 Japan, 1944\n\nReferences: a. C.C.S. 242/6 [주1]\n\nb. C.C.S. 319/5 [주2]\n\nc. C.C.S. 417 [주3]\n\n1.\n\nWe are agreed that every effort should be exerted to bring the U. S. S. E. into the war against Japan at the earliest practicable date, and that plans should be prepared in that event.\n\n2.\n\nWe are agreed that plans should be prepared for operations in the event that Germany is defeated earlier than the fall of 1944.\n\n3.\n\nA schedule of proposed operations and projected target dates for planning purposes is given in the appendix to the enclosure. The operations envisaged are based on a concept of obtaining strategic objectives and bases from which to conduct further operations to force the unconditional surrender of Japan at the earliest practicable date. The operations are in consonance with the over-all objective and over-all strategic concept agreed upon at Quadrant [주4] and [780면] reaffirmed by the Combined Chiefs of Staff in C. C. S. 380/2, [주5] and with the provisions of C. C. S. 417 (Over-all Plan for the Defeat of Japan).\n\n4.\n\nGeneral. In addition to the specific objectives hereinafter indicated, supporting operations should be conducted. Both the specific and supporting operations will be designed to destroy the Japanese Fleet at an early date; to secure maximum attrition of enemy air forces; to intensify air, submarine, and mining operations against enemy shipping and lines of communication; to establish air and sea blockade of the main Japanese islands; to continue efforts to keep China in the war; and to enable us to launch land and carrier-based air operations against Japan.\n\n5.\n\nNorth Pacific. Plans for the North Pacific involve the augmentation of base facilities and defensive installations in the Aleutians in preparation for entry into the Kuriles and Soviet territory in the event of Russian collaboration. Naval surface and submarine action, including raids on the Japanese fishing fleet will be carried out. Preparations will be made for executing very long range strategic bombing against the Kuriles and northern Japan.\n\n6.\n\nCentral, South and Southwest Pacific. The advance along the New Guinea-N. E. I.-Philippine axis will proceed concurrently with operations for the capture of the Mandated Islands. A strategic bombing force will be established in Guam, Tinian, and Saipan for strategic bombing of Japan proper. Air bombardment of targets in the N. E. I.-Philippine Area and the aerial neutralization of Rabaul will be intensified.\n\n7.\n\nChina. Our efforts in the China area should have as their objective the intensification of land and air operations in and from China and the build-up of the U. S. A. A. F. and the Chinese army and air forces. It shall include also the establishing, without materially affecting other approved operations, of a very long range strategic bombing force at Calcutta, with advanced bases at Chengtu to attack vital targets in the Japanese “inner zone.” [주*]\n\n8.\n\nSoutheast Asia. In the Southeast Asia Area operations should be carried out for the capture of Upper Burma in order to improve the air route and establish overland communications with China. Operation Buccaneer will be conducted. Within the means available additional offensive operations including carrier borne raids, should be conducted by sea, air, and ground forces for the purpose of maintaining pressure on the enemy, inducing dispersion of his forces, and [781면] attaining the maximum attrition practicable on [of?] his air and naval forces and shipping. The preparation of the bases in India required for approved operations in the S. E. A. and China Theaters should continue. [주6]\n\n9.\n\nAs more carriers become available, the operations set forth should be supplemented, between scheduled operational dates as practicable, with massed carrier task force strikes against selected vital targets.\n\n10.\n\nThe completion of these operations will place the United Nations in positions from which to use most advantageously the great air, ground, and naval resources which will be at our disposal after Germany is defeated.\n\nEnclosure\n\nA schedule of operations for 1944 is set forth in the appendix. [주7] Target dates which have been determined after careful consideration of prospective means and of time and space factors, are presented for planning purposes only. We are convinced that the sequence of operations must be flexible; we must be prepared to take all manner of short cuts made possible by developments in the situation. The four primary developments which may permit short cuts are:\n\na.\n\nEarly defeat of the Japanese Fleet.\n\nb.\n\nSudden withdrawal of Japanese forces from areas (as from Kiska).\n\nc.\n\nIncrease in our means such as by acceleration of the assault shipbuilding program and by an earlier defeat of Germany than 1 October 1944.\n\nd.\n\nThe early collaboration of the U. S. S. E. in the war against Japan.\n\nWe have directed that further study be conducted and plans made and kept up to date for the conditions assumed in c and d.\n\nWe have directed that special attention be given to the optimum employment of the enormous air forces which will be released upon the defeat of Germany.\n\nWe have directed that a study be made for the optimum use, timing, and deployment in the war against Japan of very long range bombers.\n\n[782면]", "notes": ["[주1] 여기에 수록하지 않음.", "[주2] 전술, 243면 및 어먼(Ehrman), 제5권, 8–15면 참조.", "[주3] 전술, 765면.", "[주4] 제1차 퀘벡 회담(콰드런트)의 기록은 추후 『Foreign Relations』 총서의 다른 권으로 간행될 예정이다.", "[주5] 전술, 157면.", "[주*] 포함되는 것: 일본 본토, 만주, 조선, 북중국, 가라후토(일본령 사할린) 및 타이완(포모사). [원문에 실려 있는 각주.]", "[주6] 이 항을 변경하기로 한 연합참모본부(CCS)의 결정에 관해서는 전술, 736면 참조. C. C. S. 397호(수정)의 후속 판본에서 제8절은 — 사소한 편집상의 변경을 제외하고 — C. C. S. 417호의 \"동남아시아 전구(Southeast Asia Theater)\" 표제 아래 실려 있는 두 문단으로 이루어져 있다(전술, 765면).", "[주7] 이 일정표는 매틀로프(Matloff), 377면에 수록되어 있다."], "warn": false, "pages": ["779", "780", "781", "782"], "search": ""}, {"id": "d545", "order": 545, "date": "1944-01-12", "group": "B", "eyebrow": "d545 · Minutes of a Meeting of the Pacific War Council  The Pacific War Council consisted of representatives of those signatories of the Declaration by United Nations which were fighting in the Pacific. It met from time to time at Washington under Roosevelt as chairman. secret", "title": "태평양전쟁위원회 회의록", "badge": "Secret", "list_right": "문서 545", "meta": [{"k": "일자", "v": "1944-01-12"}, {"k": "장소", "v": "Washington (백악관 행정동 각의실)", "txt": true}, {"k": "발신", "v": "윌슨 브라운(Wilson Brown) 해군 소장 — 기록자", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": "The President 대통령 (Roosevelt 루스벨트), The Netherlands Ambassador, Dr. A. Loudon 네덜란드 대사 A. 라우던 박사, The Chinese Ambassador, Dr. Wei Tao-ming 중국 대사 웨이다오밍(魏道明) 박사, The Canadian Ambassador, Hon. Leighton McCarthy 캐나다 대사 레이턴 매카시, Vice President Sergio Osmena 세르히오 오스메냐 부통령 (필리핀 연방 대통령 마누엘 케손을 대리), The New Zealand Minister, Dr. Walter Nash 뉴질랜드 공사 월터 내시 박사, The Australian Minister, Sir Owen Dixon 오스트레일리아 공사 오언 딕슨 경, Sir Ronald Campbell, E. E. and M. P. 로널드 캠벨 경, 특명전권공사 (영국 대사 핼리팩스 자작을 대리)", "txt": true, "wide": true}, {"k": "종류", "v": "회의록"}], "links": [{"k": "FRUS", "text": "문서 545 원문", "url": "https://history.state.gov/historicaldocuments/frus1943CairoTehran/d545"}], "summary": "제36차 태평양전쟁위원회 회의에서 루스벨트 대통령이 카이로·테헤란 회담에서 장제스 및 스탈린과 나눈 논의 결과를 보고하며, 조선인은 아직 독립정부를 운영·유지할 능력이 없으므로 40년의 후견에 두어야 한다는 데 스탈린이 동의했다고 전한 기록이다.", "points": ["루스벨트 대통령은 스탈린이 \"조선인은 아직 독립정부를 운영하고 유지할 능력이 없으며 40년의 후견(tutelage)에 두어야 한다\"는 데 명시적으로 동의했다고 이사회에 전했다. 이는 카이로 선언의 \"적절한 절차를 거쳐 조선을 자유롭고 독립된 나라가 되게 한다\"는 문구가 실제로 무엇을 뜻했는지 보여주는 기록이다.", "각주 [주6]은 조선인을 \"40년의 후견\"에 둔다는 데 카이로나 테헤란에서 합의가 있었다는 다른 기록은 발견되지 않았다고 밝힌다.", "스탈린은 만주, 타이완(포모사), 펑후 제도를 중국에 반환해야 한다는 데 명시적으로 동의했다.", "일본은 도서 영유지를 박탈당하고, 적도 이북 도서의 민정 통제는 국제연합이 인수하며, 서태평양의 치안 유지와 그에 필요한 공군·해군 기지는 실효적 군사 통제를 행사할 능력이 있는 열강이 인수한다.", "러시아는 시베리아에 부동항이 없어 이를 얻기를 원하며, 스탈린은 다롄을 만국을 위한 자유항으로 만드는 데 호의적이고 시베리아 수출입 화물을 다롄 항을 거쳐 만주 철도로 보세 운송하는 구상을 지지한다.", "스탈린은 만주 철도가 중국 정부의 재산이 되어야 한다는 데 동의하며, 사할린 전체의 러시아 반환과 쿠릴 열도의 러시아 이양을 원한다.", "루스벨트는 총통과 스탈린 원수가 태평양의 모든 주요 문제에서 자신과 \"의견이 완전히 일치\"함을 확인한 것이 매우 흡족하다고 말했다.", "루스벨트는 러시아를 제외한 모든 이해 당사국이 대표되어 있는 태평양전쟁위원회가 태평양 문제의 최종 해결에 관한 예비 연구를 수행해야 한다고 보았다.", "스탈린은 류큐(리우추) 제도의 역사에 밝으며 그것이 중국에 속하고 중국에 반환되어야 한다는 데 완전히 동의한다고 루스벨트는 회고했다.", "루스벨트는 태평양 도서의 민정이 주민의 이익을 위해 수행되어야 할 책무이며 그 행정은 이익이 아니라 언제나 지출의 원천이 될 것이라는 데 모두가 동의한다고 믿는다고 말했다."], "primary": "워싱턴, 1944년 1월 12일.\n\n**비망록**\n\n태평양전쟁위원회(Pacific War Council)[주1]의 제36차 회의가 1944년 1월 12일 수요일 오후 12시 30분, 워싱턴 D. C. 백악관 행정동 각의실에서 열렸다.\n\n**참석:**\n\n대통령.\n\n네덜란드 대사 A. 라우던 박사.\n\n중국 대사 웨이다오밍 박사.\n\n캐나다 대사 레이턴 매카시.\n\n필리핀 연방 대통령 마누엘 케손을 대리한 세르히오 오스메냐 부통령.\n\n뉴질랜드 공사 월터 내시 박사.\n\n오스트레일리아 공사 오언 딕슨 경.\n\n영국 대사 핼리팩스 자작을 대리한 특명전권공사 로널드 캠벨 경.\n\n. . . . . . . . . . . . . .\n\n… 루스벨트 대통령은 장제스(Chiang Kai-shek) 총통 및 스탈린 원수와의 논의가 매우 만족스러웠다고 이사회에 알렸다. 양자 모두 일본이 그 도서 영유지를 박탈당하여야 한다는 데, 그리고 적도 이북 도서의 민정 통제는 국제연합(United Nations)이 인수하고 서태평양의 치안 유지와 따라서 그에 필요한 공군·해군 기지는 실효적인 군사 통제를 행사할 능력이 있는 [869면] 열강이 인수하여야 한다는 데 동의하였다는 것이다.[주2][주3][주4] 스탈린 원수는 다음의 사항에 명시적으로 동의하였다. 만주, 타이완(포모사), 펑후 제도가 중국에 반환되어야 한다는 것[주5]. **조선인은 아직 독립정부를 운영하고 유지할 능력이 없으며, 따라서 40년의 후견(tutelage)에 두어야 한다는 것[주6].** 러시아는 시베리아에 부동항이 없으므로 하나를 얻기를 원한다는 것, 그리고 스탈린 원수는 다롄을 만국을 위한 자유항으로 만드는 데 호의적으로 보고 있으며 시베리아의 수출입 화물을 다롄 항을 거쳐 보내 만주 철도를 통해 보세(保稅)로 시베리아 영토까지 운반할 수 있으리라는 구상을 지지한다는 것[주7]. 그는 만주 철도가 중국 정부의 재산이 되어야 한다는 데 동의한다[주8]. 그는 사할린 전체가 러시아에 반환되기를 바라며, 시베리아로 통하는 해협을 통제할 수 있도록 쿠릴 열도가 러시아에 이양되기를 바란다[주9].\n\n루스벨트 대통령은 총통과 스탈린 원수가 태평양의 모든 주요 문제에서 자신과 \"의견이 완전히 일치(eye to eye)\"함을 알게 된 것이 지극히 흡족한 일이며, 일본이 완전히 정복되고 나면 태평양의 통제에 관한 합의에 이르는 데 아무런 어려움이 없으리라 느낀다고 말했다.\n\n루스벨트 대통령은, 러시아를 제외한 모든 이해 당사국이 이 이사회에 대표되어 있고 러시아의 동의는 대통령이 이미 스탈린 원수와 나눈 논의에 비추어 기대할 수 있으므로, 태평양전쟁위원회야말로 태평양 문제의 최종 해결에 관한 예비 연구를 수행하여야 할 기구라고 생각한다고 말했다.\n\n루스벨트 대통령은 또한 스탈린이 리우추(류큐) 제도의 역사에 밝으며 그 제도가 중국에 속하고 중국에 반환되어야 한다는 데 완전히 동의한다는 것[주10], 나아가 [870면] 현재 일본이 통제하고 있는 모든 도서의 민정은 국제연합이 인수하되 앞서 말한 대로 특정 요충지에 대한 군사 통제는 평화 유지에 필요한 만큼 배정되어야 한다는 것을 회고하였다. 루스벨트 대통령은 태평양 도서의 민정이 주민들의 이익을 위하여 수행되어야 할 책무라는 데, 그리고 그 행정은 언제나 이익이 아니라 지출의 원천이 되리라는 데 모두가 동의한다고 믿는다고 말했다.[주11][주12]\n\n. . . . . . . . . . . . . .\n\n윌슨 브라운\n\n해군 소장, 미 해군.", "secondary": "Washington, January 12, 1944.\n\nMemorandum\n\nThe thirty-sixth meeting of the Pacific War Council was held in the Cabinet Room of the Executive Offices, the White House, Washington, D. C, at 12:30 p.m., on Wednesday, January 12, 1944.\n\nPresent: The President.\n\nThe Netherlands Ambassador, Dr. A. Loudon.\n\nThe Chinese Ambassador, Dr. Wei Tao-ming.\n\nThe Canadian Ambassador, Hon. Leighton McCarthy.\n\nVice President Sergio Osmena, representing Hon. Manuel Quezon, President of the Philippine Commonwealth.\n\nThe New Zealand Minister, Dr. Walter Nash.\n\nThe Australian Minister, Sir Owen Dixon.\n\nSir Ronald Campbell, E. E. and M. P., representing Viscount Halifax, the British Ambassador.\n\n. . . . . . . . . . . . . .\n\n… President Roosevelt informed the Council that his discussions with Generalissimo Chiang Kai-shek and with Marshal Stalin were highly satisfactory—in that both had agreed that Japan should be stripped of her island possessions [주2] and that the civil control of the islands north of the equator should be taken over by the United Nations, [주3] while the policing of the Western Pacific and, therefore, the necessary air and naval bases should be taken over by those powers [869면] capable of exercising effective military control. [주4] Marshal Stalin had specifically agreed to the idea that Manchuria, Formosa and the Pescadores should be returned to China; [주5] that the Koreans are not yet capable of exercising and maintaining independent government and that they should be placed under a 40-year tutelage; [주6] that Russia, having no ice-free port in Siberia, is desirous of getting one and that Marshal Stalin looks with favor upon making Dairen a free port for all the world, with the idea that Siberian exports and imports could be sent through the port of Dairen and carried to Siberian territory over the Manchurian Railroad in bond. [주7] He agrees that the Manchurian Railway should become the property of the Chinese Government. [주8] He wishes all of Sakhalin to be returned to Russia and to have the Kurile Islands turned over to Russia in order that they may exercise control of the straits leading to Siberia. [주9]\n\nPresident Roosevelt stated that it was extremely gratifying to him to find that the Generalissimo and Marshal Stalin saw “eye to eye” with him on all major problems of the Pacific and that he felt that there would be no difficulty in reaching agreements about the control of the Pacific once Japan had been completely conquered.\n\nPresident Roosevelt stated that he thinks the Pacific War Council is the body that should work out preliminary studies about the final solution of the Pacific problems as all interested powers are represented in the Council except Russia, whose agreement might be expected in view of the discussions the President had already had with Marshal Stalin.\n\nPresident Roosevelt also recalled that Stalin is familiar with the history of the Liuchiu Islands and that he is in complete agreement that they belong to China and should be returned to her [주10] and further [870면] that the civil administration of all islands now controlled by Japan should be taken over by the United Nations with, as stated before, military control of specific strong points assigned as necessary to maintain the peace. President Roosevelt stated that he believed that everyone agreed that the civil administration of the Pacific Islands is a responsibility that should be carried out for the benefit of the populations [주11] and that their administration will always be a source of expense rather than profit. [주12]\n\n. . . . . . . . . . . . . .\n\nWilson Brown\n\nRear Admiral, U. S. N.", "notes": ["[주1] 태평양전쟁위원회는 「국제연합 선언」 서명국 가운데 태평양에서 싸우고 있던 나라들의 대표로 구성되었다. 루스벨트를 의장으로 하여 워싱턴에서 수시로 열렸다.", "[주2] 1943년 12월 1일 카이로 선언에서 루스벨트, 처칠, 장제스가 \"일본이 1914년 제1차 세계대전 개시 이래 탈취하였거나 점령한 태평양의 모든 도서를 박탈당하도록 하는 것이 그들의 목적\"이라고 밝힌 대목은 앞의 448면을 보라. 카이로 선언에 대한 스탈린의 동의에 관해서는 앞의 566면을 보라.", "[주3] 일본 인근의 도서가 강력한 통제 아래 남아야 한다는 것과, 당시 일본의 수중에 있던 \"요충지(strong points)\"가 연합국의 수중에 남아야 한다는 데 동의를 나타낸 스탈린의 발언, 그리고 독일이나 일본에게서 빼앗은 \"요충지\"가 영국이나 미국 또는 양국의 통제 아래 놓일 수 있다는 몰로토프의 발언에 관해서는 각각 앞의 532면, 554면, 570면을 보라.", "[주4] 평화 보전을 위하여 충분히 강력한 국가들 또는 세계 기구가 전략적 \"요충지\"를 통제하는 문제에 관한 논의는 앞의 510–511면, 533면을 보라.", "[주5] 카이로 선언과 그에 대한 스탈린의 동의를 보라.", "[주6] 카이로 선언에서 루스벨트, 처칠, 장제스는 \"적절한 절차를 거쳐 조선을 자유롭고 독립된 나라가 되게 한다(in due course Korea shall become free and independent)\"는 3국의 결의를 표명하였다. 조선인을 \"40년의 후견 아래(under a 40-year tutelage)\" 두어야 한다는 데 카이로나 테헤란에서 합의가 있었다는 다른 기록은 발견되지 않았다.", "[주7] 앞의 567면과 『Foreign Relations, The Conferences at Malta and Yalta, 1945』 378–379면, 768면을 보라.", "[주8] 테헤란에서 만주 철도가 중국 정부의 재산이 되어야 한다는 데 스탈린이 동의하였다는 다른 기록은 발견되지 않았다. 페트로파블롭스크의 철도 연결 부재에 관한 언급은 앞의 567면을 보라. 『United States Relations With China』 113면 각주 1에 따르면, 만주 철도의 소련 측 이용은 테헤란 회담 중 비공식적으로 논의되었다. 이 서술의 근거는 확인되지 않았다.", "[주9] 테헤란에서 스탈린이 이러한 희망을 표명하였다는 다른 구체적 기록은 발견되지 않았다. 일본 인근 도서의 통제와 블라디보스토크로 접근하는 해협의 통제에 관한 스탈린의 발언은 앞의 532면, 567면을 보라. 『Foreign Relations, The Conferences at Malta and Yalta, 1945』 378–379면도 보라.", "[주10] 테헤란에서 스탈린이 류큐(리우추) 제도에 관하여 견해를 표명하였다는 다른 기록은 발견되지 않았다.", "[주11] 테헤란에서 있었던 종속 민족의 복리에 관한 논의는 앞의 485면, 486면, 571면을 보라.", "[주12] 신탁통치(trusteeship) 아래 놓일 수 있는 기지의 점령 비용에 관한 언급은 앞의 554면을 보라."], "warn": false, "pages": ["868", "869", "870"], "search": "Roosevelt 루스벨트 Chiang Kai-shek 장제스 Stalin 스탈린 A. Loudon A. 라우던 Wei Tao-ming 웨이다오밍 Leighton McCarthy 레이턴 매카시 Sergio Osmena 세르히오 오스메냐 Manuel Quezon 마누엘 케손 Walter Nash 월터 내시 Owen Dixon 오언 딕슨 Ronald Campbell 로널드 캠벨 Viscount Halifax 핼리팩스 자작 Molotov 몰로토프 Wilson Brown 윌슨 브라운 Churchill 처칠 The President 대통령 (Roosevelt 루스벨트) The Netherlands Ambassador, Dr. A. Loudon 네덜란드 대사 A. 라우던 박사 The Chinese Ambassador, Dr. Wei Tao-ming 중국 대사 웨이다오밍(魏道明) 박사 The Canadian Ambassador, Hon. Leighton McCarthy 캐나다 대사 레이턴 매카시 Vice President Sergio Osmena 세르 hibei-1941", "420"]]}, {"id": "1941-11-30", "date": "1941-11-30", "docs": [["nichibei-1941", "425"]]}, {"id": "1941-11-30-1", "date": "1941-11-30", "docs": [["nichibei-1941", "427"]]}, {"id": "1941-12-01", "date": "1941-12-01", "docs": [["pearl-1941", "d411"]]}, {"id": "1941-12-01-1", "date": "1941-12-01", "docs": [["nichibei-1941", "435"]]}, {"id": "1941-12-03", "date": "1941-12-03", "docs": [["nichibei-1941", "441"]]}, {"id": "1941-12-03-1", "date": "1941-12-03", "docs": [["nichibei-1941", "447"]]}, {"id": "1941-12-06", "date": "1941-12-06", "docs": [["pearl-1941", "d417"]]}, {"id": "1941-12-06-1", "date": "1941-12-06", "docs": [["pearl-1941", "d418"]]}, {"id": "1941-12-06-2", "date": "1941-12-06", "docs": [["nichibei-1941", "455"]]}, {"id": "1941-12-06-3", "date": "1941-12-06", "docs": [["nichibei-1941", "452"]]}, {"id": "1941-12-06-4", "date": "1941-12-06", "docs": [["nichibei-1941", "453"]]}, {"id": "1941-12-07", "date": "1941-12-07", "label": "진주만 공습", "bar": true, "key": true, "where": "오아후", "note": "하와이 시각 오전 7시 48분 공습이 시작됐다. 워싱턴 시각으로 오후 1시 20분이다. 그 한 시간 뒤인 오후 2시 20분, 노무라와 구루스가 14부 각서를 들고 국무부에 들어왔다. 각서에 선전포고 문언은 없었다."}, {"id": "1941-12-07-1", "date": "1941-12-07", "docs": [["pearl-1941", "d419"]]}, {"id": "1941-12-07-2", "date": "1941-12-07", "docs": [["pearl-1941", "d420"]]}, {"id": "1941-12-08", "date": "1941-12-08", "label": "대일 선전포고", "bar": true, "where": "워싱턴 의회", "note": "루스벨트가 의회에서 12월 7일 이래 전쟁 상태가 존재함을 선언해 줄 것을 요청했고, 합동결의가 그날 채택됐다.", "docs": [["pearl-1941", "d422"]]}, {"id": "1943-11", "date": "1943-11", "docs": [["cairo-1943", "d307"]]}, {"id": "1943-11-1", "date": "1943-11", "docs": [["cairo-1943", "d308"]]}, {"id": "1943-11-25", "date": "1943-11-25", "docs": [["cairo-1943", "d309"]]}, {"id": "1943-11-27", "date": "1943-11-27", "label": "카이로 선언", "bar": true, "key": true, "where": "카이로", "note": "미·영·중 3국 수뇌가 대일 전후 처리를 합의해 발표했다. 조선에 관한 대목은 「적당한 시기에(in due course) 자유롭고 독립된 나라가 되게 한다」였다. 이 묶음이 좇는 문구가 여기서 태어난다."}, {"id": "1943-11-28", "date": "1943-11-28", "label": "테헤란 회담", "bar": true, "where": "테헤란", "note": "루스벨트·처칠·스탈린의 첫 3자 회담. 유럽 제2전선(노르망디)의 시기가 정해졌고, 스탈린은 독일 항복 뒤 대일전 참전을 처음으로 시사했다."}, {"id": "1944-06-06", "date": "1944-06-06", "label": "노르망디 상륙", "bar": true, "note": "연합군이 프랑스 북부에 상륙해 서부 제2전선이 열렸다. 유럽 전쟁의 승패가 사실상 이때 갈렸고, 미국 안에서 「그다음은 일본」이라는 계산이 본격화된다."}, {"id": "1944-07-25", "date": "1944-07-25", "label": "항복문서 완성", "bar": true, "key": true, "where": "런던 유럽자문위원회", "note": "유럽자문위원회가 「독일의 무조건 항복」 본문을 확정했다. 독일이 항복하기 아홉 달 전이고, 파리가 해방되기 한 달 전이다. 이 뒤의 넉 달은 새로 쓰는 것이 아니라 손질하는 기간이며, 정작 1945년 5월 7일 랭스에서는 지연을 우려해 이 문서 대신 간이 「항복문서」를 쓴다."}, {"id": "1944-10-20", "date": "1944-10-20", "label": "레이테 상륙", "bar": true, "where": "필리핀", "note": "맥아더가 필리핀 탈환에 착수했다. 뒤이은 레이테만 해전에서 일본 연합함대가 무너져, 일본 본토와 남방 자원지대를 잇는 해상 수송로가 끊긴다."}, {"id": "1944-12-22", "date": "1944-12-22", "docs": [["machinery-1945", "d486"]]}, {"id": "1944-12-28", "date": "1944-12-28", "docs": [["surrender-1945", "d368"]]}, {"id": "1945-01", "date": "1945-01", "docs": [["surrender-1945", "d340"]]}, {"id": "1945-01-03", "date": "1945-01-03", "docs": [["surrender-1945", "d370"]]}, {"id": "1945-01-04", "date": "1945-01-04", "docs": [["machinery-1945", "d130"]]}, {"id": "1945-01-25", "date": "1945-01-25", "docs": [["machinery-1945", "d139"]]}, {"id": "1945-02-04", "date": "1945-02-04", "label": "얄타 회담", "bar": true, "key": true, "where": "크림반도 얄타", "note": "루스벨트·처칠·스탈린의 두 번째 3자 회담. 소련의 대일 참전 조건이 비밀협정으로 정해졌고, 루스벨트가 스탈린에게 조선의 신탁통치를 꺼내며 「20년에서 30년」이라 말했다. 카이로의 「적당한 시기」에 처음으로 숫자가 붙은 자리다."}, {"id": "1945-02-08", "date": "1945-02-08", "docs": [["yalta-1945", "d393"]]}, {"id": "1945-02-08-1", "date": "1945-02-08", "docs": [["machinery-1945", "d149"]]}, {"id": "1945-03-09", "date": "1945-03-09", "docs": [["mofa-1945", "d949"]]}, {"id": "1945-03-10", "date": "1945-03-10", "label": "도쿄 대공습", "bar": true, "note": "B-29 편대의 야간 소이탄 공습으로 도쿄 시가지가 불탔다. 하룻밤 사망자가 10만 명 안팎으로 추정된다. 일본 안에서 본토 방위가 불가능하다는 인식이 퍼지기 시작한다."}, {"id": "1945-03-14", "date": "1945-03-14", "docs": [["machinery-1945", "d488"]]}, {"id": "1945-03-18", "date": "1945-03-18", "docs": [["field-1945", "tf58-2"]]}, {"id": "1945-03-23", "date": "1945-03-23", "docs": [["machinery-1945", "d161"]]}, {"id": "1945-03-30", "date": "1945-03-30", "docs": [["machinery-1945", "d165"]]}, {"id": "1945-04", "date": "1945-04", "docs": [["surrender-1945", "d343"]]}, {"id": "1945-04-01", "date": "1945-04-01", "label": "오키나와 전투", "bar": true, "note": "미군이 오키나와에 상륙해 6월까지 싸웠다. 사상자 규모가 본토 상륙전의 비용을 가늠하는 근거가 되어, 원폭 사용과 소련 참전 요청 양쪽의 논거로 쓰인다."}, {"id": "1945-04-05", "date": "1945-04-05", "docs": [["machinery-1945", "d172"]]}, {"id": "1945-04-06", "date": "1945-04-06", "docs": [["field-1945", "tf58-3"]]}, {"id": "1945-04-11", "date": "1945-04-11", "docs": [["field-1945", "tf58-4"]]}, {"id": "1945-04-12", "date": "1945-04-12", "label": "루스벨트 사망", "bar": true, "note": "루스벨트가 급서하고 트루먼이 승계했다. 트루먼은 얄타의 비밀협정도 원폭 개발도 취임 뒤에야 통보받았다. 조선 신탁통치 구상을 밀던 사람이 사라진 자리다."}, {"id": "1945-04-14", "date": "1945-04-14", "docs": [["machinery-1945", "d178"]]}, {"id": "1945-04-15", "date": "1945-04-15", "docs": [["machinery-1945", "d179"]]}, {"id": "1945-04-18", "date": "1945-04-18", "docs": [["machinery-1945", "d181"]]}, {"id": "1945-04-22", "date": "1945-04-22", "docs": [["machinery-1945", "d59"]]}, {"id": "1945-04-23", "date": "1945-04-23", "docs": [["machinery-1945", "d187"]]}, {"id": "1945-04-23-1", "date": "1945-04-23", "docs": [["machinery-1945", "d495"]]}, {"id": "1945-04-24", "date": "1945-04-24", "docs": [["machinery-1945", "d189"]]}, {"id": "1945-04-25", "date": "1945-04-25", "label": "힘러의 항복 제의", "bar": true, "key": true, "where": "뤼베크 · 스톡홀름", "note": "힘러가 4월 24일 새벽 뤼베크에서 베르나도테 백작을 만나, 서부전선만 아이젠하워에게 항복하겠다며 스웨덴 정부에 전달을 부탁했다. 히틀러가 뇌출혈로 이미 죽었거나 이틀을 넘기지 못한다는 말도 함께 전해진다. 트루먼과 처칠은 전화로 3국 동시 무조건항복 외에는 없다고 못 박는다."}, {"id": "1945-04-25-1", "date": "1945-04-25", "docs": [["veday-1945", "d548"]]}, {"id": "1945-04-25-2", "date": "1945-04-25", "docs": [["veday-1945", "d550"]]}, {"id": "1945-04-25-3", "date": "1945-04-25", "docs": [["veday-1945", "d549"]]}, {"id": "1945-04-28", "date": "1945-04-28", "docs": [["veday-1945", "d557"]]}, {"id": "1945-04-30", "date": "1945-04-30", "label": "히틀러 자살", "bar": true, "where": "베를린 총통관저", "note": "베를린 지하에서 히틀러가 자살하고 되니츠가 승계한다. 되니츠는 전쟁을 계속하겠다고 말했고, 연합국은 히틀러가 순교자로 남는 전설이 만들어지지 않도록 5월 2일 성명을 낸다.", "docs": [["veday-1945", "d75"]]}, {"id": "1945-05-01", "date": "1945-05-01", "docs": [["veday-1945", "d205"]]}, {"id": "1945-05-01-1", "date": "1945-05-01", "docs": [["veday-1945", "d203"]]}, {"id": "1945-05-02", "date": "1945-05-02", "label": "베를린 함락", "bar": true, "where": "베를린", "note": "소련군이 베를린을 함락했다. 이틀 전 히틀러가 자살했고 남은 것은 항복 절차뿐이었다. 미국 문서에 히틀러의 죽음은 부고가 아니라 「항복문서에 서명할 능력이 있는 중앙 권력이 없을 경우」라는 가정으로 나타난다.", "docs": [["veday-1945", "d560"]]}, {"id": "1945-05-04", "date": "1945-05-04", "docs": [["veday-1945", "d561"]]}, {"id": "1945-05-04-1", "date": "1945-05-04", "docs": [["veday-1945", "d562"]]}, {"id": "1945-05-04-2", "date": "1945-05-04", "docs": [["veday-1945", "d212"]]}, {"id": "1945-05-07", "date": "1945-05-07", "docs": [["veday-1945", "d566"]]}, {"id": "1945-05-07-1", "date": "1945-05-07", "docs": [["veday-1945", "d567"]]}, {"id": "1945-05-08", "date": "1945-05-08", "label": "독일 항복", "bar": true, "key": true, "where": "랭스 · 베를린", "note": "5월 7일 새벽 2시 41분 랭스에서 서명이 끝났으나, 발표는 8일까지 묶여 있었다. 스탈린은 동부전선에서 항복 명령이 이행될지 확실치 않다며 소련의 발표를 9일로 미뤘고, 8일 밤 베를린에서 다시 서명한다. 그날 서명한 것은 유럽자문위원회가 여덟 달 다듬어 온 항복문서가 아니라 초기 군사 조항만 담은 간이 문서였다.", "docs": [["veday-1945", "d224"]]}, {"id": "1945-05-10", "date": "1945-05-10", "docs": [["mofa-1945", "d951"]]}, {"id": "1945-05-10-1", "date": "1945-05-10", "docs": [["veday-1945", "d357"]]}, {"id": "1945-05-11", "date": "1945-05-11", "docs": [["surrender-1945", "d349"]]}, {"id": "1945-05-11-1", "date": "1945-05-11", "docs": [["field-1945", "tf58-5"]]}, {"id": "1945-05-12", "date": "1945-05-12", "docs": [["veday-1945", "d235"]]}, {"id": "1945-05-18", "date": "1945-05-18", "docs": [["mofa-1945", "d953"]]}, {"id": "1945-05-21", "date": "1945-05-21", "docs": [["surrender-1945", "d355"]]}, {"id": "1945-05-28", "date": "1945-05-28", "docs": [["surrender-1945", "d379"]]}, {"id": "1945-06-22", "date": "1945-06-22", "docs": [["surrender-1945", "d358"]]}, {"id": "1945-06-27", "date": "1945-06-27", "docs": [["surrender-1945", "d385"]]}, {"id": "1945-06-30", "date": "1945-06-30", "docs": [["mofa-1945", "d960"]]}, {"id": "1945-07-16", "date": "1945-07-16", "docs": [["surrender-1945", "d361"]]}, {"id": "1945-07-17", "date": "1945-07-17", "label": "포츠담 회담", "bar": true, "where": "베를린 근교 포츠담", "note": "트루먼·처칠(뒤에 애틀리)·스탈린의 회담. 회담 중 원폭 실험 성공이 보고되고, 대일 최후통첩의 문안이 다듬어진다."}, {"id": "1945-07-21", "date": "1945-07-21", "docs": [["mofa-1945", "d964"]]}, {"id": "1945-07-26", "date": "1945-07-26", "label": "포츠담 선언", "bar": true, "note": "미·영·중 명의로 일본에 무조건 항복을 요구했다. 제8항에 「카이로 선언의 조항은 이행되어야 한다」고 못박아, 조선 독립 약속이 항복 조건 안으로 들어온다. 일본은 이를 묵살(黙殺)한다고 발표했다."}, {"id": "1945-07-27", "date": "1945-07-27", "docs": [["mofa-1945", "d1079"]]}, {"id": "1945-08", "date": "1945-08", "docs": [["frus-1945", "d771"]]}, {"id": "1945-08-02", "date": "1945-08-02", "docs": [["surrender-1945", "d364"]]}, {"id": "1945-08-04", "date": "1945-08-04", "docs": [["surrender-1945", "d390"]]}, {"id": "1945-08-06", "date": "1945-08-06", "label": "히로시마", "bar": true, "key": true, "note": "히로시마에 원자폭탄이 투하됐다. 트루먼은 같은 날 성명을 내 「이제껏 없던 폭탄」임을 알리고 항복하지 않으면 파멸이 이어질 것이라 경고했다.", "disp": "08.06", "docs": [["surrender-1945", "d401"]]}, {"id": "1945-08-08", "date": "1945-08-08", "label": "소련 참전", "bar": true, "note": "소련이 일본에 선전포고하고 이튿날 만주로 진공했다. 얄타에서 약속한 「독일 항복 뒤 3개월」을 지킨 날짜다. 미국이 조선에 지상군을 두려면 시간이 없다는 것이 이날 분명해진다.", "disp": "08.08", "docs": [["surrender-1945", "d402"]]}, {"id": "1945-08-09", "date": "1945-08-09", "label": "나가사키", "bar": true, "note": "나가사키에 두 번째 원자폭탄이 투하됐다. 같은 날 밤 어전회의가 열려 국체 유지를 조건으로 한 항복 제의가 정해진다.", "docs": [["mofa-1945", "d1085"]]}, {"id": "1945-08-10", "date": "1945-08-10", "disp": "08.10", "docs": [["surrender-1945", "d406"]]}, {"id": "1945-08-10-1", "date": "1945-08-10", "disp": "08.10 06:45", "docs": [["mofa-1945", "d1086"]]}, {"id": "1945-08-10-2", "date": "1945-08-10", "disp": "08.10 18:00", "docs": [["mofa-1945", "d1091"]]}, {"id": "1945-08-11", "date": "1945-08-11", "label": "38선 획정", "bar": true, "key": true, "note": "일반명령 제1호(SWNCC 21/5)가 고쳐지면서 조선이 북위 38도로 갈렸다. 한 문서의 b항과 f항, 다섯 조항 사이에 조선이 둘로 나뉘어 적혔다. 합참이 든 이유는 미군에게 경성의 항만과 교통 지역을 주기 위해서였다.", "docs": [["surrender-1945", "d418"]]}, {"id": "1945-08-11-1", "date": "1945-08-11", "disp": "08.11", "docs": [["surrender-1945", "d410"]]}, {"id": "1945-08-11-2", "date": "1945-08-11", "disp": "08.11", "docs": [["surrender-1945", "d412"]]}, {"id": "1945-08-11-3", "date": "1945-08-11", "disp": "08.11", "docs": [["surrender-1945", "d418"]]}, {"id": "1945-08-11-4", "date": "1945-08-11", "disp": "08.11 10:46", "docs": [["surrender-1945", "d413"]]}, {"id": "1945-08-11-5", "date": "1945-08-11", "disp": "08.11 밤", "docs": [["mofa-1945", "d1093"]]}, {"id": "1945-08-12", "date": "1945-08-12", "disp": "08.12", "docs": [["surrender-1945", "d425"]]}, {"id": "1945-08-12-1", "date": "1945-08-12", "disp": "08.12", "docs": [["surrender-1945", "d427"]]}, {"id": "1945-08-14", "date": "1945-08-14", "disp": "08.14", "docs": [["surrender-1945", "d442"]]}, {"id": "1945-08-14-1", "date": "1945-08-14", "disp": "08.14", "docs": [["surrender-1945", "d431"]]}, {"id": "1945-08-14-2", "date": "1945-08-14", "disp": "08.14", "docs": [["surrender-1945", "d437"]]}, {"id": "1945-08-14-3", "date": "1945-08-14", "disp": "08.14", "docs": [["mofa-1945", "d1098"]]}, {"id": "1945-08-14-4", "date": "1945-08-14", "disp": "08.14 20:05", "docs": [["mofa-1945", "d1097"]]}, {"id": "1945-08-14-5", "date": "1945-08-14", "disp": "08.14 20:10", "docs": [["surrender-1945", "d440"]]}, {"id": "1945-08-15", "date": "1945-08-15", "label": "일본 항복", "bar": true, "key": true, "note": "일본이 포츠담 선언 수락을 방송으로 알렸다. 전날 밤 일부 장교들이 방송을 막으려 궁성을 봉쇄하고 총리 관저를 습격했으나 실패했고, 아나미 육군대신은 새벽에 자결했다.", "disp": "08.15", "docs": [["mofa-1945", "d1100"]]}, {"id": "1945-09-02", "date": "1945-09-02", "label": "항복문서 조인", "bar": true, "where": "도쿄만 미주리함", "note": "도쿄만의 미주리함 위에서 항복문서에 서명했다. 이 문서로 연합국최고사령관(SCAP)의 권한이 발효되고, 일반명령 제1호가 법적 효력을 갖는다."}, {"id": "1945-09-08", "date": "1945-09-08", "label": "미군 인천 상륙", "bar": true, "key": true, "note": "하지 중장의 제24군단이 인천에 상륙해 이튿날 조선총독부의 항복을 받았다. 미군정이 시작된다. 닷새 뒤 하지는 카이로의 「in due course」가 조선어로 「수일 내」로 옮겨져 퍼져 있었다는 것을 알게 된다."}, {"id": "1945-09-09", "date": "1945-09-09", "docs": [["scap-0141", "1"]]}, {"id": "1945-09-13", "date": "1945-09-13", "docs": [["scap-0141", "2"]]}, {"id": "1945-09-24", "date": "1945-09-24", "docs": [["scap-0141", "2-B"]]}, {"id": "1945-09-27", "date": "1945-09-27", "disp": "09.27", "docs": [["surrender-1945", "d507"]]}, {"id": "1945-10-10", "date": "1945-10-10", "disp": "10.10", "docs": [["surrender-1945", "d526"]]}, {"id": "1945-11-13", "date": "1945-11-13", "docs": [["field-1945", "toyoda-2"]]}, {"id": "1945-11-13-1", "date": "1945-11-13", "docs": [["field-1945", "toyoda-5"]]}, {"id": "1945-11-14", "date": "1945-11-14", "docs": [["field-1945", "toyoda-7"]]}, {"id": "1945-11-14-1", "date": "1945-11-14", "docs": [["field-1945", "toyoda-8"]]}, {"id": "1945-11-23", "date": "1945-11-23", "disp": "11.23", "docs": [["surrender-1945", "d488"]]}, {"id": "1945-12-27", "date": "1945-12-27", "label": "모스크바 3상회의", "bar": true, "key": true, "note": "미·영·소 외상이 조선에 최대 5년의 신탁통치를 두고 미소공동위원회를 설치하기로 합의했다. 카이로의 「적당한 시기」가 마침내 문서상의 기한이 된 자리이자, 조선 안에서 신탁통치 반대 운동이 폭발한 계기다."}, {"id": "1946-01", "date": "1946-01", "docs": [["scap-0141", "6"]]}, {"id": "1946-03-20", "date": "1946-03-20", "label": "1차 미소공동위", "bar": true, "where": "서울", "note": "임시정부 수립을 협의할 미소공동위원회가 열렸다. 어느 정당·사회단체와 협의할 것인가를 두고 갈라져 5월에 결렬된다."}, {"id": "1946-04", "date": "1946-04", "docs": [["scap-0141", "7-J"]]}, {"id": "1946-10-01", "date": "1946-10-01", "label": "대구 10월 사건", "bar": true, "note": "식량 공출과 경찰에 대한 항의가 대구에서 시작해 남한 전역으로 번졌다. 미군정이 계엄을 선포하고 진압했다. 점령 1년 만에 통치의 정당성이 시험대에 오른 사건이다."}, {"id": "1947-05-21", "date": "1947-05-21", "label": "2차 미소공동위", "bar": true, "where": "서울", "note": "미소공동위원회가 다시 열렸으나 같은 쟁점에서 다시 갈라져 10월에 사실상 끝난다. 미국은 이 무렵부터 조선 문제를 유엔으로 넘기는 쪽으로 방향을 바꾼다."}, {"id": "1947-09-17", "date": "1947-09-17", "label": "한국 문제 유엔 이관", "bar": true, "key": true, "note": "미국이 조선 문제를 유엔 총회에 상정했다. 4개국 신탁통치라는 전시 구상이 공식적으로 폐기되고, 처리의 무대가 미소 양자에서 유엔으로 옮겨간다."}, {"id": "1948-01-08", "date": "1948-01-08", "label": "유엔한국임시위원단 입국", "bar": true, "note": "유엔한국임시위원단(UNTCOK)이 서울에 들어왔다. 소련이 북위 38도 이북 입경을 거부해, 감시할 수 있는 지역에서만 선거를 치른다는 결론으로 이어진다."}, {"id": "1948-02", "date": "1948-02", "docs": [["ndl-091", "D024"]]}, {"id": "1948-04", "date": "1948-04", "docs": [["ndl-091", "D014"]]}, {"id": "1948-04-02", "date": "1948-04-02", "docs": [["korea-1948-50", "48-d776"]]}, {"id": "1948-04-28", "date": "1948-04-28", "docs": [["korea-1948-50", "48-d790"]]}, {"id": "1948-05-10", "date": "1948-05-10", "label": "5·10 총선거", "bar": true, "key": true, "note": "남한만의 제헌국회 선거가 치러졌다. 좌익과 김구·김규식 계열이 불참했다. 분단이 절차를 갖춘 사실이 되는 날이다."}, {"id": "1948-05-11", "date": "1948-05-11", "docs": [["korea-1948-50", "48-d797"]]}, {"id": "1948-05-15", "date": "1948-05-15", "docs": [["korea-1948-50", "48-d801"]]}, {"id": "1948-08-09", "date": "1948-08-09", "docs": [["korea-1948-50", "48-d862"]]}, {"id": "1948-08-15", "date": "1948-08-15", "label": "대한민국 정부 수립", "bar": true, "key": true, "note": "대한민국 정부가 수립되고 미군정이 끝났다. 카이로에서 「in due course」라고 적힌 지 4년 9개월 뒤다. 북에서는 9월 9일 조선민주주의인민공화국이 수립된다."}, {"id": "1948-08-17", "date": "1948-08-17", "docs": [["korea-1948-50", "48-d872"]]}, {"id": "1948-12-12", "date": "1948-12-12", "label": "유엔총회 결의 195(III)", "bar": true, "where": "파리 유엔총회", "note": "유엔 총회가 대한민국 정부를 위원단이 감시할 수 있었던 지역의 합법 정부로 승인했다. 「조선 전역의 유일 합법 정부」라는 뒷날의 표현과 결의문의 문언은 같지 않다.", "docs": [["korea-1948-50", "48-d924"]]}, {"id": "1948-12-17", "date": "1948-12-17", "docs": [["korea-1948-50", "48-d926"]]}, {"id": "1948-12-22", "date": "1948-12-22", "docs": [["korea-1948-50", "48-d928"]]}, {"id": "1949-03-22", "date": "1949-03-22", "docs": [["korea-1948-50", "49-d209"]]}, {"id": "1949-06-11", "date": "1949-06-11", "docs": [["korea-1948-50", "49-d262"]]}, {"id": "1949-06-26", "date": "1949-06-26", "label": "김구 피살", "bar": true, "key": true, "where": "서울 경교장", "note": "한국독립당 위원장 김구가 육군 소위 안두희의 총에 죽었다. 무초는 이튿날 「공식·비공식 여러 경로에서 지금까지 모은 바」로 시작하는 전문을 올린다 — 전날 첫 전문에는 아무 세부사항이 없었다."}, {"id": "1949-06-27", "date": "1949-06-27", "docs": [["korea-1948-50", "49-d265"]]}, {"id": "1949-06-27-1", "date": "1949-06-27", "docs": [["korea-1948-50", "49-d266"]]}, {"id": "1949-06-29", "date": "1949-06-29", "label": "주한미군 철수 완료", "bar": true, "key": true, "where": "서울", "note": "전투부대 철수가 끝나고 군사고문단(KMAG) 약 500명만 남았다. 철수 날짜를 이승만과 매듭짓는 일이 1949년 전반기 대사관 전문의 주된 내용이었다."}, {"id": "1949-10-01", "date": "1949-10-01", "label": "중화인민공화국 수립", "bar": true, "where": "베이징", "note": "국공내전이 사실상 끝났다. 무초는 다섯 달 전 이승만에게 중국의 결과가 조선에 당장 자국을 남기지는 않으리라고 말했었다."}, {"id": "1950-01-12", "date": "1950-01-12", "label": "애치슨 연설", "bar": true, "key": true, "where": "워싱턴 내셔널프레스클럽", "note": "애치슨이 미국의 태평양 방위선을 알류샨–일본–류큐–필리핀으로 그었다. 조선은 그 선 안에 들지 않았다. 이승만이 아홉 달 전 무초에게 우려한 바로 그 이야기다."}, {"id": "1950-01-20", "date": "1950-01-20", "docs": [["korea-1948-50", "50-d3"]]}, {"id": "1950-06-09", "date": "1950-06-09", "docs": [["korea-1948-50", "50-d46"]]}, {"id": "1950-06-14", "date": "1950-06-14", "docs": [["korea-1948-50", "50-d53"]]}, {"id": "1950-06-19", "date": "1950-06-19", "docs": [["korea-1948-50", "50-d57"]]}, {"id": "1950-06-23", "date": "1950-06-23", "docs": [["korea-1948-50", "50-d58"]]}, {"id": "1950-06-25", "date": "1950-06-25", "label": "한국전쟁 발발", "bar": true, "key": true, "where": "38선 전역", "note": "북한군이 38선 전역에서 남침했다. 유엔 안전보장이사회는 같은 날 결의 82호로 적대행위 중지와 38선 이북으로의 철수를 요구했다.", "docs": [["korea-1950-53", "50-d62"]]}, {"id": "1950-06-27", "date": "1950-06-27", "label": "안보리 결의 83호", "bar": true, "key": true, "where": "뉴욕 유엔 안보리", "note": "안보리가 회원국에 대한민국을 돕는 데 필요한 지원을 권고했다. 소련 대표는 중국 대표권 문제로 회의를 비우고 있어 거부권이 행사되지 않았다.", "docs": [["korea-1950-53", "50-d130"]]}, {"id": "1950-07-07", "date": "1950-07-07", "docs": [["korea-1950-53", "50-d238"]]}, {"id": "1950-09-15", "date": "1950-09-15", "label": "인천 상륙", "bar": true, "key": true, "where": "인천", "note": "미 제10군단이 인천에 상륙했다. 9월 28일 서울을 되찾고, 10월 1일 국군이 38선을 넘는다."}, {"id": "1950-09-30", "date": "1950-09-30", "docs": [["korea-1950-53", "50-d577"]]}, {"id": "1950-10", "date": "1950-10", "docs": [["korea-1950-53", "50-d640"]]}, {"id": "1950-10-03", "date": "1950-10-03", "docs": [["korea-1950-53", "50-d593"]]}, {"id": "1950-10-12", "date": "1950-10-12", "docs": [["korea-1950-53", "50-d665"]]}, {"id": "1950-10-15", "date": "1950-10-15", "docs": [["korea-1950-53", "50-d680"]]}, {"id": "1950-10-19", "date": "1950-10-19", "label": "중공군 압록강 도하", "bar": true, "key": true, "where": "압록강", "note": "중국인민지원군이 압록강을 건너기 시작했다. 10월 25일 첫 공세가 시작되고, 전쟁의 성격이 바뀐다."}, {"id": "1950-11", "date": "1950-11", "docs": [["korea-1950-53", "50-d877"]]}, {"id": "1950-11-01", "date": "1950-11-01", "docs": [["korea-1950-53", "50-d731"]]}, {"id": "1950-11-03", "date": "1950-11-03", "docs": [["korea-1950-53", "50-d736"]]}, {"id": "1950-11-17", "date": "1950-11-17", "docs": [["korea-1950-53", "50-d847"]]}, {"id": "1950-11-24", "date": "1950-11-24", "docs": [["korea-1950-53", "50-d877"]]}, {"id": "1950-12", "date": "1950-12", "docs": [["korea-1950-53", "50-d1003"]]}, {"id": "1951-01-04", "date": "1951-01-04"}, {"id": "1951-04-11", "date": "1951-04-11", "label": "맥아더 해임", "bar": true, "key": true, "where": "워싱턴", "note": "트루먼이 맥아더를 유엔군사령관·극동군사령관에서 해임했다. 전쟁을 중국으로 넓힐 것인가를 두고 갈린 끝이다.", "docs": [["korea-1950-53", "51-d225"]]}, {"id": "1951-07-10", "date": "1951-07-10", "label": "정전회담 개시", "bar": true, "key": true, "where": "개성", "note": "개성에서 정전회담이 시작됐다. 회담장은 10월에 판문점으로 옮겨지고, 조인까지 다시 두 해가 걸린다."}, {"id": "1951-10-25", "date": "1951-10-25"}, {"id": "1951-11-27", "date": "1951-11-27"}, {"id": "1952", "date": "1952"}, {"id": "1952-05", "date": "1952-05", "docs": [["korea-1950-53", "52-d107"]]}, {"id": "1952-10", "date": "1952-10"},
