<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>카이로 선언과 조선 — 열람기</title>
<style>
:root{
  --bg:#eef1f4; --panel:#f7f9fa; --edge:#ccd4da; --edge-soft:#dde4e9;
  --ink:#16202a; --ink-2:#4a5b68; --ink-3:#71828f;
  --stamp:#8c2f39;            /* 기밀등급 도장의 자주색 */
  --link:#2f5d86;
  --a:#4a7c59; --b:#8a6d3b; --c:#3f6d8c; --d:#7a4a6b; --e:#5a6f7d; --x:#8a8f94;
  --term-line:#9db0c2; --term-bg:rgba(47,93,134,.05);
  --term-line-go:#7fa3c4; --term-bg-go:rgba(47,93,134,.10);
  --term-bg-on:rgba(47,93,134,.17);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",
         -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
    --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
    --stamp:#c9707a; --link:#7fb0da;
    --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
    --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
    --term-bg-on:rgba(127,176,218,.22);
    --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
  }
}
:root[data-theme="dark"]{
  --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
  --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
  --stamp:#c9707a; --link:#7fb0da;
  --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
  --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
  --term-bg-on:rgba(127,176,218,.22);
  --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--link)}

.wrap{display:grid;grid-template-columns:minmax(300px,25%) 1fr;height:100vh}

/* 좁은 화면 — 목록을 위로 접어 올리면 본문이 설 자리가 없다.
   목록은 서랍으로 빼고 화면 전부를 문서에 준다. */
.mbar{display:none}
.scrim{display:none}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;grid-template-rows:1fr;padding-top:44px}
  .mbar{display:flex;align-items:center;gap:10px;
    position:fixed;top:0;left:0;right:0;height:44px;z-index:30;padding:0 12px;
    background:var(--panel);border-bottom:1px solid var(--edge)}
  .mbar button{background:var(--term-bg-go);border:1px solid var(--term-line-go);
    color:var(--link);border-radius:999px;padding:3px 11px;cursor:pointer;
    font:inherit;font-size:12px;font-family:var(--mono);white-space:nowrap}
  .mbar-t{font-size:12.5px;font-weight:650;color:var(--ink-2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail{position:fixed;top:0;bottom:0;left:0;z-index:40;
    width:min(88vw,340px);max-height:none;
    transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:0 0 30px rgba(0,0,0,.35)}
  body.railopen .rail{transform:none}
  .scrim{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45);border:0;padding:0}
  body.railopen .scrim{display:block}
  .toolbar{padding:7px 16px;gap:8px}
  .toolbar #themeBtn{display:none}
  .mbar-t{flex:1}
  .mbar-th{padding:3px 9px;font-size:13px}
  .seg button{padding:4px 9px;font-size:11.5px}
  .srcline{padding:10px 16px 0}
}
@media(prefers-reduced-motion:reduce){.rail{transition:none}}

/* ── 좌측 목록 ─────────────────────────────── */
.rail{border-right:1px solid var(--edge);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
.rail-head{padding:14px 14px 10px;border-bottom:1px solid var(--edge-soft);
  display:flex;flex-direction:column;gap:8px}
/* 문서철에 들어오면 나갈 길이 있어야 한다 */
.home{display:inline-flex;align-items:center;gap:5px;text-decoration:none;
  color:var(--link);font-size:11.5px;font-family:var(--mono);
  letter-spacing:.04em;width:fit-content;
  background:var(--term-bg-go);border:1px solid var(--term-line-go);
  border-radius:999px;padding:2px 10px 2px 8px}
.home:hover{background:var(--term-bg-on);border-color:var(--link)}
.home span{font-size:12px;line-height:1}
.brand{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font-weight:400;letter-spacing:0;text-transform:none;
  color:var(--ink-3);font-size:11.5px;margin-top:2px}
input[type=search]{width:100%;padding:7px 10px;border:1px solid var(--edge);
  border-radius:3px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
input[type=search]:focus,button:focus-visible,.item:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--edge);background:transparent;color:var(--ink-2);
  border-radius:999px;padding:2px 9px;font-size:11.5px;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sortbar{display:flex;gap:10px;font-size:11.5px;color:var(--ink-3);align-items:center}
.sortbar button{background:none;border:none;color:var(--ink-3);cursor:pointer;
  font:inherit;padding:0;border-bottom:1px solid transparent}
.sortbar button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.list{overflow-y:auto;flex:1;min-height:0}
.item{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--edge-soft);border-left:3px solid transparent;
  padding:9px 13px;cursor:pointer;font:inherit;color:inherit}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--bg);border-left-color:var(--ink)}
.item.tA{border-left-color:var(--a)} .item.tB{border-left-color:var(--b)}
.item.tC{border-left-color:var(--c)} .item.tD{border-left-color:var(--d)}
.item.tE{border-left-color:var(--e)} .item.tX{border-left-color:var(--x)}
.item-top{display:flex;justify-content:space-between;gap:8px;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.item-sum{font-size:12.5px;line-height:1.45;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 제목이 「국무장관이 주한대사에게」 꼴이라 무엇을 읽는 것인지 알 수 없다.
   요지 한 줄을 옅게 깔아 준다. 목록이 길어지지 않도록 두 줄에서 자른다. */
.item-hint{font-size:11.5px;line-height:1.4;margin-top:3px;color:var(--ink-3);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── 우측 본문 ─────────────────────────────── */
.main{overflow-y:auto;min-height:0}
.toolbar{position:sticky;top:0;z-index:5;background:var(--panel);
  border-bottom:1px solid var(--edge);padding:8px 26px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px}
.toolbar .grow{flex:1}
.seg{display:flex;border:1px solid var(--edge);border-radius:3px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 11px;cursor:pointer;
  font:inherit;font-size:12px;color:var(--ink-2);border-right:1px solid var(--edge)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.srcline{padding:10px 26px 0;font-size:11px;color:var(--ink-3);line-height:1.5}

/* ── 연대 바 ───────────────────────────────
   5년 반을 한 줄에 욱여넣으면 1945년 8월 열흘은 0.5% 밖에 안 된다. 그래서
   줄을 늘여 놓고 **띠 자체를 움직인다** — 지금 읽는 문서의 날짜가 늘 정중앙이다.
   문서를 옮기면 띠가 미끄러지고, 사건 이름은 겹치지 않게 위아래로 층을 나눈다. */
.chrono{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
  width:min(940px,calc(100vw - 48px));z-index:20;user-select:none;
  border:1px solid var(--edge);border-radius:8px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 20px rgba(0,0,0,.10);
  transition:box-shadow .2s ease}
.chrono:hover{box-shadow:0 6px 26px rgba(0,0,0,.18)}
/* 옅어지는 것은 **내용**이지 판이 아니다. 판까지 투명해지면 뒤의 본문이
   비쳐 들어와 글자가 서로를 밟는다. */
.chrono-track{opacity:.5;transition:opacity .2s ease}
.chrono:hover .chrono-track{opacity:1}

/* 띠가 지나가는 창. 손으로도 밀 수 있게 진짜 가로 스크롤을 쓴다 */
.chrono-vp{position:relative;overflow-x:auto;overflow-y:hidden;
  height:var(--chH,92px);border-radius:8px;cursor:grab;
  scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain}
.chrono-vp::-webkit-scrollbar{display:none}
.chrono-vp.drag{cursor:grabbing}
/* 안쪽 띠. 양옆 여백은 창의 절반 — 첫 문서도 마지막 문서도 가운데에 설 수 있게 */
.chrono-track{position:relative;height:100%;margin:0 var(--chPad,0px)}
/* 시간 축 — 층의 한가운데 */
.chrono-track::before{content:"";position:absolute;
  left:calc(0px - var(--chPad,0px));right:calc(0px - var(--chPad,0px));
  top:var(--axis,46px);height:1px;background:var(--edge)}

/* 연도 — 해가 바뀌는 자리에 선을 긋고, 그 선부터가 그 해다.
   이름표는 창 왼쪽에 들러붙는다. 1945년 한복판을 보고 있어도 「1945」가 남는다. */
.cy{position:absolute;top:0;bottom:0;
  border-left:1px solid color-mix(in srgb,var(--ink-3) 50%,transparent)}
.cy.alt{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.cy b{position:absolute;bottom:3px;font-family:var(--mono);font-size:11px;
  font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;
  line-height:1;letter-spacing:.06em;white-space:nowrap;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px}
/* 달·분기 눈금 — 해 안에서 어디쯤인지. 분기는 조금 길게 */
/* 1px 짜리 표는 좌표에 걸터앉혀야 한다. 왼쪽 모서리를 좌표에 맞추면 표가
   반 픽셀 오른쪽에 서서, 같은 날짜의 점과 어긋나 보인다. 아래 실·표도 같다. */
.cq{position:absolute;top:calc(var(--axis,46px) - 1.5px);width:1px;height:4px;
  margin-left:-.5px;background:var(--edge);opacity:.7}
.cq.q{top:calc(var(--axis,46px) - 2.5px);height:6px;opacity:1}
.cq[hidden]{display:none}

/* 배율 — 5년 반을 한눈에 볼 때와 8월 열흘을 벌려 볼 때가 같을 수 없다 */
.chrono-zoom{position:absolute;right:6px;top:5px;z-index:3;display:flex;gap:3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-zoom,.chrono-zoom:focus-within{opacity:1}
.chrono-zoom button{width:19px;height:19px;padding:0;line-height:1;
  font-family:var(--mono);font-size:12px;color:var(--ink-2);cursor:pointer;
  background:var(--panel);border:1px solid var(--edge);border-radius:3px}
.chrono-zoom button:hover:not(:disabled){color:var(--link);border-color:var(--link)}
.chrono-zoom button:disabled{opacity:.35;cursor:default}
.chrono-scale{position:absolute;right:6px;bottom:3px;z-index:3;
  font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.03em;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-scale{opacity:1}

/* 사건 점 — 이름에서 내려오는 실보다 위다. 실이 점 위를 지나가면
   점이 실에 꿰뚫린 것처럼 보이고, 어느 것이 사건 자리인지 흐려진다. */
.cm{position:absolute;top:calc(var(--axis,46px) - 3px);width:7px;height:7px;
  margin-left:-3.5px;border-radius:50%;background:var(--ink-3);z-index:2;
  border:1.5px solid var(--panel);cursor:help;
  transition:background .15s ease,transform .15s ease}
.cm.key{background:var(--stamp);width:9px;height:9px;margin-left:-4.5px;
  top:calc(var(--axis,46px) - 4px)}
.cm:hover{background:var(--link);transform:scale(1.45)}

/* 사건 이름 — 층(lane)을 나눠 위아래로 흩는다. 여기서 겹침이 풀린다 */
.cl{position:absolute;transform:translateX(-50%);white-space:nowrap;z-index:1;
  font-family:var(--mono);font-size:10px;line-height:1.1;color:var(--ink-2);
  letter-spacing:.01em;padding:1px 4px;border-radius:2px;cursor:help;
  background:color-mix(in srgb,var(--panel) 70%,transparent)}
.cl.key{color:var(--stamp)}
.cl:hover,.cl:focus-visible{color:var(--link);outline:0;
  background:color-mix(in srgb,var(--link) 12%,var(--panel))}
/* 이름에서 축까지 내려/올려 긋는 실 — 어느 점의 이름인지 알아보게 */
.cl::after{content:"";position:absolute;left:calc(50% - .5px);width:1px;
  background:var(--edge)}
.cl.up::after{top:100%;height:var(--leg,0px)}
.cl.dn::after{bottom:100%;height:var(--leg,0px)}

/* 지금 읽는 문서가 놓인 자리. 문서를 고르면 이 표가 창 한가운데로 온다.
   손으로 띠를 밀면 표는 제 날짜에 남는다 — 표는 시간에 박혀 있지 창에 박혀 있지 않다. */
.chrono-cursor{position:absolute;top:0;bottom:0;width:1px;z-index:3;
  margin-left:-.5px;background:var(--stamp);pointer-events:none}
/* 가상 요소는 위의 *{box-sizing:border-box}가 닿지 않는다 — 여기서 직접 잡아 주지
   않으면 테두리 2px 만큼 표시가 축 아래·오른쪽으로 밀려 앉는다. */
.chrono-cursor::before{content:"";position:absolute;box-sizing:border-box;
  left:-6px;top:calc(var(--axis,46px) - 6px);width:13px;height:13px;
  border-radius:50%;background:var(--stamp);border:2px solid var(--panel)}
/* 날짜는 맨 아래, 표 바로 밑에 — 위쪽은 사건 이름 층에 내준다 */
.chrono-date{position:absolute;bottom:2px;transform:translateX(-50%);
  font-family:var(--mono);font-size:10px;color:var(--stamp);
  font-variant-numeric:tabular-nums;background:var(--panel);
  padding:0 5px;border-radius:2px;white-space:nowrap;z-index:3}
.chrono[data-nodate="1"] .chrono-cursor,
.chrono[data-nodate="1"] .chrono-date{display:none}

/* 좁은 화면에서도 연대 바는 남긴다 — 이 화면의 절반은 「언제인가」이다.
   폭을 화면 끝까지 늘리고, 손가락으로 미는 것이 이미 되므로 줌 단추는 접는다. */
@media(max-width:900px){
  .chrono{bottom:8px;width:calc(100vw - 16px);border-radius:6px}
  .chrono-zoom{display:none}
  .chrono-track{opacity:1}
}
@media(prefers-reduced-motion:reduce){.chrono-track{transition:none}}

/* 아래쪽 여백은 떠 있는 연대 바가 마지막 문단을 덮지 않을 만큼 */
article{max-width:none;padding:26px 26px 190px}
@media(max-width:900px){article{padding:18px 16px 170px}}

/* ── 앞뒤로 넘기기 ─────────────────────────────
   목록을 다시 열지 않고도 이어 읽을 수 있어야 한다. */
.steps{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;
  margin-top:34px;padding-top:18px;border-top:1px solid var(--edge)}
.step{display:flex;flex-direction:column;gap:2px;text-align:left;
  border:1px solid var(--edge);border-radius:5px;background:transparent;
  padding:9px 12px;cursor:pointer;font:inherit;color:var(--ink-2);min-width:0}
.step.next{text-align:right;align-items:flex-end}
.step:hover{border-color:var(--link);color:var(--ink);background:var(--term-bg)}
.step-k{font-family:var(--mono);font-size:11px;color:var(--link);letter-spacing:.04em}
.step-d{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.step-t{font-size:13px;line-height:1.4;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.step.empty{display:flex;align-items:center;justify-content:center;border-style:dashed;
  color:var(--ink-3);font-size:12px;font-family:var(--mono);cursor:default}
.steps .step-n{align-self:center;font-family:var(--mono);font-size:11.5px;
  color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}

@media(max-width:900px){
  .steps{grid-template-columns:1fr;gap:8px}
  .steps .step-n{order:-1;text-align:center}
  .step.next{text-align:left;align-items:flex-start}
}
.doc-head{border-bottom:1px solid var(--edge);padding-bottom:14px;margin-bottom:18px}
h1{font-size:19px;margin:0 0 4px;line-height:1.35;text-wrap:balance;font-weight:650}
.docid{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  letter-spacing:.04em;font-variant-numeric:tabular-nums}
.stamp{display:inline-block;border:1.5px solid var(--stamp);color:var(--stamp);
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:1px 6px;
  border-radius:2px;transform:rotate(-1.2deg);margin-left:8px;vertical-align:2px}
.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:3px 20px;margin-top:10px;font-size:12.5px}
.meta div{display:flex;gap:7px}
/* 참석자 명단처럼 긴 값. 좁은 칸에 넣으면 한 글자씩 세로로 눌린다 */
.meta div.wide{grid-column:1/-1}
.meta b{color:var(--ink-3);font-weight:500;min-width:52px;font-size:11.5px}
.meta span{font-family:var(--mono);font-size:12px}
.meta span.txt{font-family:var(--sans);font-size:12.5px}

.points{margin:16px 0;padding:12px 16px;border-left:2px solid var(--edge);
  background:var(--panel);border-radius:0 3px 3px 0}
.points li{margin:3px 0}
.points ul{margin:0;padding-left:18px}

.cols{display:grid;gap:26px}
.cols.two{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.cols.two{grid-template-columns:1fr}}
.pane h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 8px;font-weight:600}
.body{white-space:pre-wrap;word-break:break-word}

, "지휘권: 대통령은 각서 「A」(단일 최고연합군사령관)를 지지하고 「B」를 거부했으며, 최고사령관 문제가 정리되기 전에 지중해 통합지휘를 따로 수락할지를 두고 리히와 마셜·킹이 대립했다.", "발칸: 마셜은 발칸 작전이 전쟁을 연장시키고 미국의 잠재력을 3분의 2로 줄일 것이라며, 영국이 오버로드를 「내던지려」 한다면 우리는 전 병력을 태평양으로 돌리겠다고 말할 수 있다고 했다.", "중국 전선: 스틸웰 보고에 따르면 윈난의 중국군은 장비·식량이 부족하고 영양실조 상태이며, 중국군 각 사단은 4천~5천 명에 불과하다. 험프(the hump) 수송량은 이달 약 1만 톤을 목표로 한다.", "이탈리아 함대는 소련에 3분의 1을 선의의 표시로 넘기되 소유권 이전은 상정하지 않는다는 대통령의 방침."], "primary": "Moscow, 1943년 11월 19일 오후 2시\n\n비밀(secret)\n\n. . . . . . . . . . . . . .\n\n## 2. 지휘권(Command)\n\n리히(Leahy) 제독이 합동참모본부(JCS)를 대표하여 대통령에게 제출한 1943년 11월 17일자 각서들과 관련하여,\n\n**대통령**은 자신이 제안 「A」는 마음에 들지만 제안 「B」는 마음에 들지 않는다고 말했다. 다른 한편으로 그는 타협해야 할지도 모른다고 말했다. 그러나 우리는 분명히 「A」를 밀고 나가야 한다. 그는 이 문제를 가장 이른 시기에 수상과 논의하겠다고 말했다. 그는 우리가 어려움을 겪을 수는 있으나 분명히 계획 「A」로 밀고 나가야 한다고 느꼈다.\n\n**킹(King) 제독**은 개인적 견해로는, 오버로드(Overlord)가 전체의 일부에 지나지 않는 이상 각서 「A」에 제시된 입장은 완전히 논리적이며 영국 측에도 호의적으로 받아들여질 것이라고 논평했다. 그는 각서 「A」에 관해 논리가 우리 편에 있는 정도는, 지중해 통합지휘에 관해 논리가 영국 편에 있는 정도와 같다고 말했다.\n\n**리히 제독**은 각서 「A」가 완전히 논리적일지는 몰라도, 수상은 자신의 정부 형태 아래에서는 그러한 제안을 받아들일 수 없다고 느낄지 모른다고 논평했다.\n\n**킹 제독**은 통합지휘의 원칙이 이미 아이젠하워(Eisenhower) 장군의 전구에 존재한다고 지적했다. 그는 영국이 자신들의 방어 관점 때문에 각서 「A」의 제안을 받아들이기 어렵다고 지적하더라도, 그들에게 「최선의 방어는 맹렬한 공격이다」라는 점을 지적해야 한다고 느꼈다. 각서 「A」야말로 확실히 최선의 공세적 지휘체계를 만들어 준다는 것이었다.\n\n**리히 제독**은 지중해 통합지휘에 관한 결정을 전반 지휘권(over-all command) 문제가 정리될 때까지 미루자고 제안했다.\n\n**마셜(Marshall) 장군**은 리히 제독에게 전적으로 동의할 수는 없다고 말했다. 그는 중동의 체계를 언급하면서, 그곳에서는 카이로의 케이시(Casey) 씨가 그 전구의 영국군·미군 사령관 사이에서 중개자 역할을 하기로 되어 있었고, 그 결과 세 명의 사령관이 위원회 방식으로 합의를 이루려 하는 상태가 되어 버렸다고 했다. 그는 그러한 방식은 결코 만족스러울 수 없다고 느꼈으며, 그들이 [249면] 1년 반에 걸쳐 만족스러운 합의에 이르지 못했다고 덧붙였다. 그는 위원회식 체계가 군사 지휘의 올바른 형태가 아니라고 믿었다.\n\n**킹 제독**이 처칠(Churchill) 씨와 영국 전시내각의 관계에 관해 논평하자, **마셜 장군**은 영국 내각이 때때로 처칠 씨의 결정을 뒤집은 일이 있다고 지적했다.\n\n1944년 1월 1일까지 미국과 영국이 본토와 해외에 보유할 총병력이 얼마인지에 관한 대통령의 질문에 대하여, 의견의 대체적 일치는 다음과 같았다.\n\n총 병력\n\n미국 — 11,000,000\n\n영국 — 4,500,000\n\n해외\n\n미 육군 — 2,500,000~2,600,000\n\n미 해군 — 약 100만\n\n영국\n\n육군 — 총 전투병 약 2,700,000\n\n해군 — 약 100만\n\n**대통령**은 현재 해외에 보유한 총 병력 수에서 우리가 분명히 영국을 앞서 있으며, 머지않아 오버로드를 위해 잉글랜드에 두게 될 병력이 현재 그곳에 있는 영국군 총병력과 맞먹게 되리라고 논평했다.\n\n**마셜 장군**은 우리가 잉글랜드에서 이미 영국을 앞섰다고 느꼈다. 잉글랜드에는 영국군 작전사단이 다섯 개뿐이다. 우리는 지금 잉글랜드에 전개 가능한 만큼의 병력을 영국과 같은 수준으로 두고 있다. 영국은 근무 부대를 마련하고 새 부대를 재편성하기 위해 사단들을 해체해야 하는 문제를 안고 있다.\n\n**대통령**은 지난 6월에 수상이 자신에게 말하기를 당시 영국은 시리아, 이집트, 페르시아 등을 포함한 중동에 약 100만 명을 두고 있다고 했다고 말했다. 그는 미군 총병력과 영국군 병력의 전개 수치를 갖고 싶다고 덧붙였고, **마셜 장군**은 대통령을 위해 그 수치를 확보하기로 했다.\n\n**아널드(Arnold) 장군**은 항공에 관해서는 우리가 영국을 빠르게 앞질렀다고 말했다. 1944년 1월 1일까지 우리는 작전기 12,000대 이상을 보유하는 반면 영국은 약 8,000대에 그칠 것이다.\n\n**대통령**은 대독일 전쟁에 투입된 미군 총병력에 관심이 있으며 총 항공전력에 크게 관심이 있다고 말했다. 그는 각서 「B」가 마음에 들지 않는다고 말했다.\n\n**킹 제독**은 지휘를 맡을 특정 영국군 장교에 관한 보충 각서는 각서 「B」만이 받아들여질 수 있는 유일한 안이라고 드러날 경우에 대비해서만 제안된 것이라고 논평했다.\n\n[250면]\n\n**마셜 장군**은 언급된 이 특정 영국군 장교가 미국에서 잘 알려진 인물이라고 지적했다. 그는 우리를 이해하며 영국에서도 아마 상당한 인물일 것이다. 그는 요점을 고수하며 이리저리 휘둘리지 않는다.\n\n**대통령**은 각서 「A」의 마지막 문단, 즉 연합참모본부(CCS)가 제안된 최고연합군사령관의 결정을 뒤집을 수 있다고 되어 있는 대목을 언급했다.\n\n**마셜 장군**은 그 문단이 연합참모본부에 거부(negative action)의 선택권을 주기 위해 넣은 것이라고 지적했다. 그 취지는 「위원회」식 지휘체계에서 벗어나려는 것이었다. 제안된 최고연합군사령관은 완전한 지휘 통제권을 갖고 지휘 결정을 내리게 된다. 물론 그는 자신의 계획을 연합참모본부에 제출할 것이다. 연합참모본부는 아이젠하워 장군에게서 그의 군사적 지휘 권한을 빼앗은 적이 결코 없다. 다만 아이젠하워 장군에게서 「수단(means)」을 빼앗거나 그의 「수단」을 더해 주기는 한다. 우리의 아이젠하워 장군은 자신의 계획을 스스로 세우고 자신의 작전을 스스로 수행한다. 그는 어느 지점을 언제 폭격할지를 스스로 결정한다.\n\n**마셜 장군**은 이 문단에 원래 다른 한 문장이 들어 있었다고 덧붙였는데, 미 참모총장단이나 영국 참모총장단 어느 쪽이든 요청에 따라 최고연합군사령관의 해임을 실행할 수 있다는 취지였다. 그러나 그는 최고연합군사령관의 해임은 국가원수들이 결정할 사안이라는 점이 지적되어, 리히 제독의 제안에 따라 이 문장이 삭제되었다고 말했다.\n\n지중해·이탈리아·발칸 총사령관으로 알렉산더(Alexander) 장군을 두는 데 대한 합동참모본부의 태도가 어떠한지에 관한 대통령의 질문에 대하여, **마셜 장군**은 최고연합군사령관이 미국 장교가 된다면 알렉산더 장군이 지중해 총사령관으로 만족스러우리라 느낀다고 말했다. 다른 한편으로 최고연합군사령관이 영국 장교가 된다면 아이젠하워 장군이 지중해 총사령관이 되어야 한다고 했다.\n\n**대통령**은 퀘벡에서 아이젠하워 장군이 자신의 임무를 완수할 때까지, 즉 안코나 선에 도달할 때까지 머물러야 한다는 것이 중론이었던 것으로 이해하고 있다고 말했다.\n\n**마셜 장군**은 콰드런트(Quadrant) 마지막 날 오후까지는 이에 관해 확실히 알지 못했으나, 아이젠하워 장군이 로마 이북의 어느 지점에 도달할 때까지 머무는 것으로 이해했다고 말했다.\n\n**킹 제독**은 그것이 콰드런트에서의 합의였음을 상기했으나, 그 결정은 독일군의 저항이 실제로 나타난 것보다 약할 것이라는 [251면] 전제 아래 내려진 것이라고 믿는다고 말했다.\n\n**아널드 장군**은 콰드런트에서의 결정이 아이젠하워 장군이 로마 이북에 이를 때까지, 그리고 방어 태세에 들어갈 때까지 이탈리아에서 지휘를 유지한다는 것이었다는 데 동의했다.\n\n**마셜 장군**은 최고연합군사령관으로 그 특정 영국군 장교의 이름이 제시된 것은, 영국이 각서 「A」의 수락에서 발을 뺄 수 없는 처지로 몰아넣기 위함이었다고 진술했다. 그는 수상이 자신(마셜 장군)에게, 작전이 개시될 곳인 잉글랜드에 수상 자신이 있고 대통령은 미국에 있을 터이니 자신이 오버로드 사령관이 되는 편이 좋겠다고 — 다시 말해 마셜 장군이 현지에서 대통령의 직접 대리인 역할을 하게 되리라고 — 말했다고 지적했다.\n\n**대통령**은 다음과 같은 의견을 물었다. 만약 우리가 각서 「A」에 제안된 대로의 최고연합군사령관을 얻지 못한다면, 참모총장단은 영국이 아이젠하워 장군을 지중해 최고연합군사령관으로 받아들이리라고 보는가? 이 질문에 대한 참모총장단의 의견은 단호하게 긍정이었다.\n\n이탈리아의 아이젠하워 장군과 에게해의 윌슨(Wilson) 장군이 실제로 서로 협의한 적이 있는지에 관한 대통령의 질문에 대하여, **마셜 장군**은 자신이 아는 한 한 차례 회합이 있었으나 두 사람은 분명히 별개의 지휘권을 갖고 있다고 말했다.\n\n**킹 제독**은 각서 「A」와 「B」 모두 지중해의 통합지휘를 받아들이고 있다고 논평했다.\n\n**대통령**은 아이젠하워 장군이 지중해 총사령관이 된다면 만족스러우리라는 데 동의했다. 다만 알렉산더 장군이 지중해 지휘를 맡은 뒤 수상에게 좌우될 위험이 다소 있을 수 있다고 했다.\n\n**마셜 장군**은 합동참모본부가 알렉산더 장군이 수상에게 좌우될 가능성을 감수하기로 했다고 말했다. 다른 한편으로 지중해에 단일 지휘라는 바람직한 상태가 존재하게 될 것이다. 당연히 집행상의 지시는 영국 참모총장단에서 나올 것이다.\n\n**리히 제독**은 마셜 장군이 지중해·중동 연합군 총사령관에 관한 영국의 제안을 지금 받아들여야 한다고 생각하는 것이 분명하다고 말했다. 그(리히 제독)는 최고연합군사령관 문제를 끝까지 다투기 전에는 이를 받아들여서는 안 된다고 느꼈다.\n\n**마셜 장군**은 영국이 제안한 지중해 총사령관을 즉시 [252면] 받아들이지 않는 것은 비논리적이라고 느꼈다. 그는 영국의 제안을 곧바로 받아들이는 편이 더 논리적이고 성의를 보이는 일이라고 느꼈다.\n\n**킹 제독**은 마셜 장군에게 동의하는 쪽으로 기운다고 말했고, 지중해 지휘 문제는 그 자체의 타당성에 따라 곧바로 처리되어야 한다고 느꼈다.\n\n반면 **리히 제독**은 지중해 전반 지휘에 즉시 동의하는 것은 도데카니사의 현 상황에 결코 도움이 되지 않을 것이라고 말했다.\n\n**대통령**은 영국이 제안한 지중해 전반 지휘가, 우리 병력을 터키와 발칸으로 밀어 넣을 수 있는 상황을 만들려는 그들의 속셈에서 나왔을지도 모른다고 느꼈다.\n\n**킹 제독**은 지중해 총사령관이 연합참모본부 아래에 있게 되며, 총사령관이 누가 되든 전반적 전략계획의 어떠한 변경에 대해서도 반드시 연합참모본부의 승인을 구해야 할 것이라고 지적했다.\n\n**대통령**은 설령 알렉산더 장군이 총사령관이 되어 도데카니사에 대해 미군 병력과 상륙정을 쓰고자 하더라도 대통령이 안 된다고 말할 수 있다고 논평했다.\n\n**킹 제독**은 지중해 총사령관의 배치, 할당, 작전 방향이 연합참모본부와 국가원수들의 결정에 따르게 될 것이라고 논평했다.\n\n**마셜 장군**은 영국이 지난주 지중해에서 통합지휘의 부재로 인해 피해를 입었다고 지적하리라고 느꼈다. 그는 아이젠하워 장군과 같은 위치에 있는 사령관은 자신의 책임이 아닌 다른 지휘부로 증원을 보내는 데 언제나 인색하다고 말했다. 반면 확대된 전구에 책임을 지는 전반 사령관이라면 자신이 책임진 전구 내에서 약화된 지점을 보강하는 데 대해 다르게 느낄 것이다. 그는 최근 알래스카에서의 지휘 상황을 예로 들었다.\n\n**마셜 장군**은 만약 아이젠하워 장군이 중동에 대한 책임을 지고 있었다면, 그가 도데카니사에 대한 추가 항공 지원에 관하여 테더(Tedder) 장군과 스파츠(Spaatz) 장군의 태도에 영향을 주었을 것이고 상황이 달라졌을지도 모른다고 영국이 틀림없이 느끼고 있으며 아마 그것이 옳을 것이라고 말했다.\n\n**대통령**은 왜 레로스인가, 왜 코스인가라고 물었다. 그는 수상이 도데카니사에 관한 미국의 태도에 대해 언짢아했다고 말했다. 그는 중동 사령부가 개시한 영국의 도데카니사 작전이 시작되기 전에 우리가 그 세부 내용을 알고 있었는지 물었다. 참모총장단의 대체적 중론은 미국이 도데카니사에서 계획된 작전에 관해 사전에 통보받지 못했다는 것이었다.\n\n[253면] 다만 **마셜 장군**은 그 섬들에 대한 영국군의 이동에 관한 영국의 「핑크(pink) 전문」을 자신이 보았을 가능성이 있다고 믿는다고 말했다. 그는 영국이 언제나 도데카니사를 미국보다 더 중요하게 여겨 왔다고 덧붙였다.\n\n**대통령**은 각서 「A」에 제안된 지휘체계에 제시된 원칙에 어떠한 변경이 가해지기 전에 자신과 합동참모본부 사이에 또 한 차례 회의가 있어야 한다고 진술했다. 그는 우리가 지중해의 통합지휘에는 동의할 수 있으나 최고연합군사령관 문제를 다루는 것과 동시에 해서는 안 된다고 덧붙였다.\n\n**홉킨스(Hopkins) 씨**는 지중해 최고연합군총사령관 문제를 논의함에 있어 우리는 인물이 아니라 원칙의 문제를 논의하고 있는 것이라고 논평했다.\n\n영국이 아이젠하워 장군이 로마에 도달하기 전에 윌슨 장군을 아이젠하워 장군 예하에 두겠는가에 관한 대통령의 질문에 대하여, **마셜 장군**과 **킹 제독**은 그렇다고 말했다.\n\n## 3. 독일에서의 책임 구역 — 유럽 전역에 걸친 「랭킨(Rankin)」\n\n**대통령**은 합동참모본부를 대표하여 리히 제독에게서 받은, 유럽 전역에 걸친 랭킨의 결과로 생길 세력권에 관한 지침을 요청하는 각서에서, 그 문서가 명시적으로 말하지는 않은 채 어떤 전제들을 두고 있다고 논평했다. 그는 어떠한 영토 처리가 이루어지든 독일의 지리적 하위 구분에 부합해야 한다고 느꼈다. 그는 소련 정부가 전후 독일을 해체하는 데 아무런 이의를 제기하지 않을 것이며, 실질적으로 말해 전후에 독일 국가가 셋, 경우에 따라서는 다섯이 되어야 한다고 말했다. 그는 (1) 우리가 남부 독일, 즉 바덴, 뷔르템베르크(Wurtenburg [Württemberg]), 바이에른, 라인강[마인강?] 이남 전부를 잡을 수 있다고 말했다. 이 지역은 일종의 남부 국가를 이룬다. (2) 그 지역의 북쪽과 서쪽 전부, 함부르크와 하노버 등을 포함하고 베를린까지 포함하여 제2의 국가를 이루고, 북동부, 즉 프로이센, 포메른과 그 남쪽을 잡아 제3의 국가를 이룬다. 그는 이러한 대체적 구분이 독일을 쪼개는 논리적 근거라고 믿었다. 특히 첫째 곧 남부 국가는 대체로 로마 가톨릭이고, 북서부는 개신교이며, 북동부의 종교는 프로이센주의라고 할 수 있기 때문에 더욱 그러했다. 그는 스탈린(Stalin) 원수가 그러한 분할을 「좋다」고 할지도 모른다고 느꼈다. 그는 참모총장단이 유럽 랭킨을 그러한 구분에 부합시키기를 원하리라고 믿었다. 실제로 영국은 독일의 북서부를 원하며 미국이 프랑스와 [254면] 모젤강 이남의 독일을 맡기를 바라고 있다. 그는 그런 배치가 마음에 들지 않는다고 말했다. 우리는 프랑스를 재건하는 일에 얽히고 싶지 않다. 프랑스는 영국의 「아이(baby)」다. 현재 미국은 프랑스에서 인기가 없다. 영국이 프랑스, 룩셈부르크, 벨기에, 바덴, 바이에른, 뷔르템베르크를 맡아야 한다. 이 지역들의 점령은 영국이 해야 한다. 미국은 북서 독일을 잡아야 한다. 우리는 브레멘과 함부르크 같은 항구, 또한 노르웨이와 덴마크로 우리 함선을 들여보낼 수 있고, 베를린까지 나아가야 한다. 그러면 소련은 그 동쪽의 영토를 잡을 수 있다. 미국이 베를린을 가져야 한다. 영국은 미국이 남부 독일을 갖는 것으로 계획하고 있으나 그(대통령)는 그것이 마음에 들지 않는다고 했다.\n\n**마셜 장군**은 이 문제를 다시 검토해야 한다는 데 동의했다. 그는 대통령 앞에 놓인 문서의 제안들이 잉글랜드로부터 이어지는 오버로드 전선의 우익에 미군을 집중시킨다는 고려에서 파생된 것이라고 말했다. 점령에 관한 구상은 주로 오버로드의 군사적 고려에 근거한 것이었다. 그는 그 문서에서 세 가지 관점에서의 솔직한 접근을 본다고 말했다. (1) 정상적인 오버로드, (2) 약간의 전투를 수반하는 부분적 오버로드, (3) 랭킨 「C」안(오버로드가 개시되기 전 독일의 완전 붕괴).\n\n**킹 제독**은 독일이 붕괴할 때 오버로드가 진행 중이라면 대통령의 구상 아래에서는 우리 병력의 교차 이동이 불가피해질 것이라고 논평했다. 특히 우리가 센강 선에 도달해 있다면 더욱 그러할 것이다.\n\n**마셜 장군**은 오버로드가 개시될 때 병참의 관점에서 미군이 우익에 있어야 한다고 말했다.\n\n**킹 제독**은 점령 지역에 관한 대통령의 구상이 극복 불가능한 어려움을 주는 것은 아니지만, 그럼에도 풀어야 할 문제가 있다고 논평했다.\n\n**마셜 장군**은 만약 붕괴가 온다면 우리 병력을 둘로 나눌 수 있다고 말했다.\n\n**대통령**은 함부르크와 브레멘 이남에는 네덜란드의 항구들에 이르기까지 항구가 없다고 논평했다.\n\n**킹 제독**은 오버로드의 군사 계획이 이미 상당히 진척되어 오버로드의 전개에 어떠한 변경도 받아들이는 것은 실행 가능하지 않다고 느꼈다.\n\n**마셜 장군**은 이 문제 전체가 결국 잉글랜드의 항구 문제로 돌아간다고 말했다. 우리가 오버로드를 고수한다면, 대통령이 개괄한 점령에 관한 정치적 고려에 부응하기 위해 오버로드를 어느 진행 단계에서든 이탈시킬 수 있는 방안을 마련해 두어야 한다.\n\n[255면]\n\n**대통령**은 독일 점령에 미국 본토에서 오는 병력을 가능한 한 많이 써야 한다는 것이 자신의 구상이라고 말했다. 이들은 스코틀랜드를 돌아 올 수 있다.\n\n**킹 제독**은 우리가 북서 독일 점령을 위해 지정된, 특정 지휘부에 속한 별도의 점령군을 두어야 한다고 느꼈다.\n\n**마셜 장군**은 오버로드의 구상이 미군이 우익에서 전진해 나간다는 것이었고 그 사단들이 가장 먼저 귀국할 부대여야 한다고 말했다.\n\n**대통령**은 현재 북아프리카, 시칠리아, 이탈리아에 있는 사단들이 가장 먼저 미국으로 돌아와야 할 사단이라고 느낀다고 말했다. 그는 프랑스에서의 정치적 「골칫거리」의 한 원인은 드골(De Gaulle)이 정부를 접수할 때 부대 뒤 1마일 지점에 있기를 바라고 있다는 점이라고 말했다. 그는 우리가 가능한 한 빨리 프랑스와 이탈리아에서 빠져나와 영국과 프랑스가 그들 자신의 문제를 함께 처리하도록 해야 한다고 느꼈다. 베를린을 향한 경주가 분명히 있을 것이다. 우리는 가능한 한 빨리 미군 사단들을 베를린에 투입해야 할지도 모른다.\n\n**리히 제독**은 북서 독일로 곧장 들어가는 것이 쉬울 것이라고 논평했다. 점령군이 북서 독일로 진출하는 문제는, 북서 프랑스에서 그 사이의 영토를 가로질러 싸우며 나아가는 것보다 분명히 덜 어려울 것이다.\n\n**마셜 장군**은 지휘를 동질적인 통제 아래 유지하는 것이 가장 중요하다고 논평했다.\n\n**대통령**은 전투가 거의 또는 전혀 없는 철도에 의한 독일 진주(進駐)를 상정하고 있다고 말했다.\n\n**마셜 장군**은 차량 부족이 심각할 것이며 육상 전진은 주로 자동차 트럭에 의존해야 하리라고 본다고 말했다.\n\n**홉킨스 씨**는 독일 붕괴 두 시간 뒤에 공수사단 하나를 베를린에 투입할 준비를 갖추자고 제안했다.\n\n점령 지역 구분에 대한 국무부 관점에서의 리히 제독의 의견을 묻는 대통령의 질문에 대하여, **리히 제독**은 우리가 분명히 가능한 한 빨리 프랑스에서 빠져나와야 한다고 느낀다고 말했다. 우리는 가장 이른 시점에 프랑스에서 나오기 위해 어떠한 어려움도 감수해야 한다. 우리가 드골에게 프랑스를 넘겨주고자 한다면 그것도 좋다. 그러나 독일 붕괴 시점에 프랑스에 있는 병력이 무엇이든 간에 어떠한 선거든 감독하기 위해 반드시 남아 있어야 할 것이다. 드골 장군은 지금 당장 프랑스 정부를 출범시키고 싶어 한다. 프랑스에 내전이 일어날 가능성이 있다. 영국이 그런 사태를 정리해야 한다. 다른 한편으로 미국으로서는 독일의 상황을 다루는 편이 훨씬 쉬울 것이다. 독일인은 [256면] 프랑스에서 예상되는 혼란한 상황 아래의 프랑스인보다 다루기 쉽다.\n\n**대통령**은 자신이 개인적으로 약 100만 명의 미군 점령군을 상정하고 있다고 말했다. 그는 「검역(quarantine)」 정책에 관해 부연했다. 그는 네 개의 국제연합(United Nations) 국가가 그 경찰력에 의해 필요하다면 「검역」 방식으로 유럽의 질서를 유지할 수 있다고 말했다. 예컨대 우리는 유고슬라비아 같은 곳의 지역적 다툼을 수습하는 데 우리 병력을 쓰고 싶지 않다. 우리는 육군과 해군을 경제 봉쇄로 활용하여 무질서가 지배하는 어떤 지역에 대해서도 출입을 차단할 수 있다.\n\n대통령이 유럽에 100만 명을 유지하는 것이 얼마 동안 필요하리라고 상정하는지에 관한 마셜 장군의 질문에 대하여, **대통령**은 최소한 1년, 어쩌면 2년이라고 답했다.\n\n**리히 제독**은 독일이 손을 놓으면 유럽 여러 지역에서 반드시 내전이 일어날 것이라고 논평했다. 프랑스군 사단들이 제대로 통제될 수 있다면 그들이 틀림없이 프랑스의 내전을 진압할 수 있을 것이다. 드골이 병력을 통제할 수 있다면 그가 내전을 진압할 수 있다 — 그러나 그다음에는? 프랑스는 식량과 군수품을 필요로 할 것이다. **대통령**은 우리가 분명히 어떤 사단들은 프랑스에 남겨 두어야 할지 모른다고 말했다. 그는 네덜란드는 문제가 아니라고 느꼈다. 여왕이 그곳으로 돌아갈 것이고 모든 것이 잘될 것이다. 반면 벨기에는 큰 문제다 — 두 언어를 쓰는 나라다. 어쩌면 독일과 프랑스 사이에 완충국이 필요할 것이다. 이 완충국은 북부 프랑스, 이를테면 칼레, 릴, 아르덴(Ardenne[s])에서 알자스와 로렌까지 — 다시 말해 스위스에서 해안까지 이를 수 있다. 이것이 하나의 단일한 완충국이 될 것이다.\n\n**리히 제독**은 이것이 한때 독일 측의 제안이기도 했으며 금지구역(interdicted zone)이라 불렸다고 논평했다.\n\n**대통령**은 만약 우리가 COSSAC이 제안한 랭킨 문서를 받아들인다면, 미국에 제안된 남부 점령 지역에서 우리가 하는 모든 움직임을 영국이 훼방할 것이라고 논평했다. 그는 이 문서의 제안들 뒤에 영국의 정치적 고려가 있음이 아주 명백하다고 말했다.\n\n**마셜 장군**은 대통령 손에 있는 점령 지대에 관한 문서가 논리적으로 맞아떨어진다고 말했다. 병력의 얽힘이 덜하고 보급선이 더 짧고 직선적일 것이다. 그 문서는 그러한 기준으로 작성되었다.\n\n**킹 제독**은 오버로드의 어느 단계에서든 대통령이 제안한 점령 지역으로 전환하기 위해 어떤 작전이 필요할지를 계획해 두는 것이 필수적임이 분명하다고 말했다.\n\n. . . . . . . . . . . . . .\n\n[257면]\n\n## 5. 총통 장제스, 처칠 수상, 스탈린 원수와의 대통령 회담을 위한 제안 의제\n\n부속서 「A」의 항목 1b, 「러시아 참전에 대한 중국의 태도」와 관련하여,\n\n**마셜 장군**은 이 문제를 총통과 논의하는 것이 현명한 일인지 의문을 제기했다.\n\n**대통령**은 중국인들이 외몽골에서 러시아와 동등한 권리를 원한다고 말했다. 장제스(Chiang Kai-shek)는 만주를 돌려받기를 원한다. 이 주제에 관한 논의는 틀림없이 말썽을 일으킬 것이다. 그러나 이 문제는 「자유지대(free zones)」를 근거로 해결될 수 있을지 모른다. **총통은 러시아, 중국, 미국을 수탁국으로 하여 시행되는 조선에 대한 신탁통치(trusteeship)를 원한다.**\n\n**마셜 장군**은 소련이 쿠잔(Kuzan [Pusan?], 부산?)을 원하는데 그곳이 일본에 가깝기 때문이라고 말했다.\n\n**킹 제독**은 소련이 좋은 큰 항구와 다롄(Dairen)으로의 연락로를 원한다고 말했다.\n\n**홉킨스 씨**는 총통이 대통령에게 일본에 대해 상정된 모든 작전에 관한 논의를 요청할지도 모른다고 논평했다.\n\n**대통령**은 총통에게 이 작전들을 대략적으로 말해 주겠으나 구체적으로 밝히거나 날짜를 언급할 생각은 없다고 답했다. **대통령**은 총통이 틀림없이 험프(the hump, 히말라야 항공 수송로)를 넘는 수송량 문제를 물어볼 것이라고 말했다.\n\n일본 폭격을 위한 매킨(McKean [McCain])제독의 계획이 어떻게 진행되고 있는지에 관한 대통령의 질문에 대하여, **킹 제독**은 그것이 다듬어지고 있는 중이며 지금 예행연습을 하고 있어 거기서 경험을 얻게 될 것이라고 답했다.\n\n**대통령**은 태평양 최고사령관 문제는 제기하지 않겠다고 말했다.\n\n부속서 「A」의 항목 1b[d], 「북부 버마 작전에 대한 중국의 지원의 중요성」과 관련하여 **대통령**은 이 문제의 논의에 소머벨(Somervell) 장군을 참여시키는 것이 바람직할지 모르겠다고 말했다.\n\n이어 **마셜 장군**은 중국군에 앞서 나아갈 장거리 침투부대를 위한 특수여단으로 편성된 미군 지원병 3,000명의 편성에 관해 이야기했다. 그는 이 미군 부대를 편성하는 데 큰 노력이 기울여졌다고 말했다. 그들에게는 특수 장비와 특수 항공기가 제공되었다.\n\n윈난에서의 중국군 훈련에 관해 들은 바가 무엇인지에 관한 대통령의 질문에 대하여, **마셜 장군**은 스틸웰(Stilwell) 장군이 최근 전문에서 중국군이 장비가 부족하고 식량이 부족하며 영양실조를 겪고 있고, 필요한 병력 가운데 아주 적은 비율만을 받았을 뿐이라고 말했다고 했다. 중국군 사단은 각기 [258면] 4천에서 5천 명으로 이루어져 있다. 그들은 모두 신병이고 영양이 부족하여, 훈련을 시작하려면 먼저 적절한 신체 상태로 만들어야 한다. 그는 영국 측이 윈난 병력 문제에 관해 낙담해 있다고 덧붙였다.\n\n**마셜 장군**은 중국군, 영국군, 인도군 사이에 미군 병력을 추가로 밀어 넣는 것은 심각한 잘못이 되리라고 본다고 덧붙였다. 우리는 이미 비행장 건설을 위해 인도에 4,000명의 추가 병력을 보내고 있다. 또한 이 지역에 철도를 건설하는 대대 하나를 두고 있다.\n\n이창(Ichang) 부근에 해병 연대 하나를 보내 달라는 총통의 요청 — 그렇게 하면 약 20만 명의 중국군이 실제로 싸우게 되리라는 — 이 어떻게 되었는지에 관한 대통령의 질문에 대하여, **합동참모본부와 홉킨스 씨**는 그러한 요청에 관해 들어 본 적이 없다고 진술했다.\n\n**마셜 장군**은 이창 부근에 미군 대부대를 두는 것과 같은 어떠한 제안도 험프를 넘는 보급 문제의 어려움을 키우는 결과를 낳을 것이라고 말했다.\n\n험프를 넘는 수송량이 어떻게 되어 가고 있는지에 관한 대통령의 질문에 대하여, **아널드 장군**은 야간 비행으로 일본 전투기의 저항을 피하는 방법과 그 밖의 개선된 방법을 통해 이달에 약 1만 톤의 수치에 도달하기를 바란다고 말했다. 그는 우리가 가능한 한 빨리 수송량을 늘려 갈 것이라고 덧붙였다. 다만 그는 이 보급로와 관련하여 우리가 중국에 미군 병력을 두어야 한다고 지적했다. 그가 아는 한 송유관 사업은 일정대로 진행되고 있었다.\n\n**대통령**은 독일이 정리된다면 블라디보스토크 부근에서 폭격기를 몇 대나 운용할 수 있을지 연구해야 한다고 말했다.\n\n**아널드 장군**은 브래들리(Bradley) 장군의 계획이 알래스카로부터의 보급으로 최대 100대의 폭격기를 운용하는 것을 제안했다고 말했다.\n\n항목 2c (1), 「전후 문제 — 일본 점령에 대한 중국의 참여」와 관련하여 — **대통령**은 중국이 틀림없이 일본 점령에 참여하기를 원할 것이라고 말했다.\n\n항목 2c (3), 「상호 원조를 위한 육·해군 기지」와 관련하여 — **대통령**은 위임통치 제도(Mandated Islands)를 국제연합(United Nations)의 공동 주권 아래 두는 것이 상정되고 있다고 말했다. 중국은 타이완(포모사, Formosa)과 오가사와라(보닌, Bonins) 제도를 원한다. 위임통치 제도에서 필요한 군사기지는 미국이 점령하게 될 것이다. 그 제도 전체에 대한 전반적 민정(民政) 통제와 더 작은 섬들에 대한 민정 통제가 있을 수 있다. 우리가 위임통치령의 작은 섬들까지 점령하고 싶어 하지는 않을 것이 분명하다.\n\n[259면]\n\n**홉킨스 씨**는 타이완(포모사)이 기지로서 중요한 곳이 되리라고 판단된다면 총통이 미국에 기지 사용권을 기꺼이 줄 것이라고 느꼈다.\n\n**대통령**은 이에 동의했으나, 타이완(포모사)에서의 이 기지 사용권은 영구적인 것으로 받아서는 안 된다고 말했는데, 총통이 어떠한 영구 기지에도 동의하지 않을 것이기 때문이라고 했다.\n\n부속서 「B」, 「대통령과 수상의 회담을 위한 제안 의제」와 관련하여 — **대통령**은 처칠 씨가 유럽 경제 연방을 추진하는 데 여전히 관심을 두고 있다고 말했다. 그는 우리가 어떠한 유럽 세력권도 받아들이는 데 끌려 들어가서는 안 된다고 말했다. 우리는 예컨대 유고슬라비아에 미군 병력을 유지하도록 강요받고 싶지 않다.\n\n수상의 제안에 어떤 타협의 여지가 있겠는지에 관한 마셜 장군의 질문에 대하여, 그(**대통령**)는 미국이 처음부터 나서지는 않겠지만 항공 또는 해군 전력은 보낼 수 있을 것이라고 말했다.\n\n동지중해-발칸 지역 작전에 참여하지 않는다는 미국의 정책에 관하여, **대통령**은 우리가 이 문제에서 소련의 태도에 유의해야 한다고 말했다.\n\n**마셜 장군**은 우리가 이 발칸 문제가 정리되는 것을 봐야 한다고 말했다. 우리는 발칸이 필요하다고 보지 않는다. 이 지역에서 작전을 벌이는 것은 전쟁을 연장시키는 결과를 낳고 태평양에서의 전쟁도 길어지게 할 것이다. 우리는 지금 잉글랜드에 오버로드를 위한 100만 톤 이상의 보급품을 두고 있다. 발칸을 벌여 전쟁을 실질적으로 연장하는 것은 역주행하는 일이 될 것이다. 그것은 분명히 미국의 잠재력을 3분의 2로 줄일 것이다. **마셜 장군**은 오버로드를 위한 약속과 준비가 미국 안에서 서쪽으로 로키산맥에까지 미치고 있다고 지적했다. 영국은 사실상 통신·교통이 없는 나라에서 작전을 벌이기 위해 지금 오버로드를 「내던지고」 싶어 할지도 모른다. 만약 그들이 그러한 제안을 고집한다면, 우리는 그들이 그렇게 하겠다면 우리는 손을 떼고 전 병력을 태평양으로 돌리겠다고 말할 수 있을 것이다.\n\n**대통령**은 우리가 영국에게, 당신들은 발칸에 가까운 중동에 병력이 많은데 그들을 극동으로 보내는 것이 어떻겠느냐고 말할 수 있다고 했다. 그는 소련군이 지금 폴란드 국경에서 불과 60마일, 베사라비아에서 40마일 떨어진 곳에 있다고 지적했다. 그들이 앞으로 2주 안에 그럴 수도 있듯이 부크강을 건넌다면 루마니아 진입을 눈앞에 두게 된다. 소련은 이렇게 말할지도 모른다. 「누군가가 지금 아드리아해에서 다뉴브강으로 올라와 준다면, 우리는 곧바로 독일을 쉽게 무찌를 수 있을 것이다.」\n\n[260면]\n\n**마셜 장군**은 그러한 움직임이 갖는 함의를 소련에 설명할 준비가 되어 있어야 한다고 말했다. 소련군이 부크강에 이르면 우리는 그때 우리 항공전력을 투입해 그들을 지원할 수 있다. 우리는 잉글랜드에서 문제를 밀어붙일 수 있다. 그는 우리 자신의 계획에 확정적으로 나서기 전에는 소련에 그들의 계획을 묻는 문제를 꺼내서는 안 된다고 느꼈다. 그런 다음에 우리는 그들에게 항공 지원을 줄 수 있다.\n\n이와 관련하여 **마셜 장군**은 소련과 군사적으로 일을 처리하기 위해 대통령이 어떤 형태의 조직을 상정하고 있는지 물었다. 그는 우리가 구체적인 문제들을 가지고 소련에 접근해야 하며, 소련 장교 한 사람이 우리가 무엇을 하고 있는지를 분명히 알게 해야 한다고 느꼈다.\n\n**대통령**은 우리가 런던의 통제위원회를 잊어서는 안 된다고 지적했다. 이 위원회는 틀림없이 그 체계의 일부로서 군사위원회를 요구할 것이다.\n\n**리히 제독**은 런던의 통제위원회가 우리에게 골칫거리 외에 아무것도 아닐 것이라고 논평했다.\n\n**킹 제독**은 터키가 참전한다면 다른 작전에서 보급과 병력을 빼내 가는 결과가 될 것이라고 지적했다. 그는 소련과 만나기 전에 이번과 같은 회의를 한 번 더 할 수 있겠는지 물었다.\n\n**대통령**은 그렇다는 뜻을 표했다.\n\n**아널드 장군**은 소련이 일본에 대한 기지와 작전에 어떤 항공 시설을 쓸 수 있게 될지를 우리에게 미리 알려 주어야 한다고 말했다. 이 정보를 가능한 한 빨리 얻는 것이 중요했다.\n\n**마셜 장군**은 버마, 수마트라, 아캬브가 대통령이 수상과 논의할 목록에 올라 있지 않다고 지적했다. 그는 수상이 수마트라나 안다만 제도에 대한 작전을 지지하고 있다고 말했다.\n\n**리히 제독**은 이제쯤 수상이 그 구상에 다소 「물렸을」지 모른다고 느꼈다.\n\n**킹 제독**은 영국이 우리로부터 더 많은 도움이 없이는 안다만 제도 작전밖에 할 수 없다고 말한다면서, 그것은 분명히 제자리걸음에 지나지 않는다고 지적했다.\n\n**대통령**은 아조레스 문제에 크게 짜증이 난다고 말했다.\n\n**리히 제독**은 짜증을 내는 것이 지극히 온당하며, 영국이 마음만 있다면 아조레스에 관해 더 도움이 될 수 있을 것이라고 느꼈다.\n\n**킹 제독**은 최근 아조레스에 들어간 해군 함선과 항공기가 포르투갈인과 영국인에게 좋은 대접을 받았다고 논평했다.\n\n**아널드 장군**은 우리의 첫 수송기가 내일 아조레스에 도착한다고 말했다.\n\n**킹 제독**은 아조레스의 비행장들이 예상보다 훨씬 좋다고 논평했다.\n\n[261면]\n\n**마셜 장군**은 우리에게 정말로 필요했던 것은 리스본에 「일 잘하는 사람(go-getter)」을 두는 것이었다고 생각했다. 그곳 우리 대표의 태도로 보아 우리가 무엇이라도 얻고 있는 것이 놀랍다고 그는 느꼈다.\n\n부속서 「C」의 항목 1a, 「스탈린 원수와의 대통령 회담을 위한 제안 의제」 가운데 「전략폭격에서의 소련의 협력, 미군의 소련 기지 사용 포함」이라는 주제와 관련하여 — **대통령**은 소련이 우리 항공기는 원하지만 우리 인원은 원하지 않는다고 말했다.\n\n**리히 제독**은 이 문제에 관한 소련의 관점이 누그러지고 있다고 믿는다고 말했다.\n\n이탈리아 함대와 이탈리아 선박에 관하여, **킹 제독**은 소련이 이탈리아 선박을 요구할 처지에 있다고 보지 않는다고 말했다.\n\n**대통령**은 선의의 표시로 소련에 선박의 3분의 1을 주는 편이 낫겠다고 말했다. 소유권 이전은 상정되지 않았다. 그는 이 문제에서 이탈리아의 태도를 신경 쓸 필요가 없다고 말했다. 취지는 이탈리아 선박을 연합국의 점유 아래 두고 필요에 따라 최선의 용도로 할당하는 것이었다. 우리는 장차 어떠한 이탈리아 해군도 분명히 막을 것이다. 이 선박들을 실컷 쓴 뒤에 최종적인 소유권 문제를 이야기할 수 있다. 그때 우리는 이탈리아인에게 몇 척을 돌려줄 수 있을 것이다. 그는 소련이 그 사용에 관해 합당한 제안을 한다면 소련에 주는 선박을 소련 인원이 운용하는 것은 괜찮으리라고 느꼈다.\n\n**리히 제독**은 이번 회의가 참모총장단에게 큰 도움이 되었다고 논평했다.\n\n이어 **대통령**은 독일에 대한 미국 점령지대에 관한 자신의 구상을 거듭 밝히고 제안된 경계선을 지도 위에 그렸다. 이 지도는 브라운(Brown) 해군소장에게서 얻은 것으로, 회의가 끝날 때 마셜 장군에게 건네졌다.", "secondary": "Moscow, November 19, 1943, 2 p.m.\n\nsecret\n\n. . . . . . . . . . . . . .\n\n2. Command\n\nWith regard to the memoranda dated 17 November 1943 submitted to him by Admiral Leahy for the Joint Chiefs of Staff, [주2] The President said he liked proposal “A” but did not like proposal “B”. On the other hand, he said he may have to compromise. We should, however, definitely go after “A”. He said he would take up the matter with the Prime Minister at the earliest time. He felt we should definitely try to go ahead with plan “A”, although we may have difficulty.\n\nAdmiral King observed that in his personal opinion, in that Overlord is only a part of the whole, the position set forth in memorandum “A” is completely logical and should appeal favorably to the British. He said the logic was as much on our side for memorandum “A” as was the logic on the side of the British for a unified command in the Mediterranean. [주3]\n\nAdmiral Leahy observed that while memorandum “A” may be completely logical, the Prime Minister may feel that under his form of government he could not accept such a proposal.\n\nAdmiral King pointed out that the principle of unified command already existed in General Eisenhower’s theater. He felt that even though the British should point out that they would have difficulty in accepting the proposal in memorandum “A” because of their defense point of view, it should be pointed out to them that the “best defense is a vigorous offense.” Certainly memorandum “A” made for the best offensive command setup.\n\nAdmiral Leahy suggested that the Mediterranean unified command decision be postponed until after the over-all command matter is settled.\n\nGeneral Marshall said that he could not entirely agree with Admiral Leahy. He referred to the setup in the Middle East where Mr. Casey of Cairo was supposed to act in the position of an intermediary, between the British and U. S. commanders in that theater, the result of which would leave three commanders trying to get an agreement on a committee basis. He felt that any such arrangement could never prove satisfactory and added that they had failed over a period of a [249면] year and a half to come to satisfactory agreements. He believed that a committee setup was not a proper form of military command.\n\nAdmiral King commented on the relationship of Mr. Churchill to the British War Cabinet and General Marshall pointed out that at times the British Cabinet has overriden Mr. Churchill’s decisions.\n\nIn reply to a question from the President as to what total forces the U. S. and United Kingdom would have at home and abroad by the first of January 1944, the consensus of opinion seemed to be about as follows:\n\nTotal Military Forces\n\nU. S.—11,000,000\n\nU. K.—4,500,000\n\nOverseas\n\nU. S. Army—2,500,000—2,600,000\n\nU. S. Navy—about one million\n\nUnited Kingdom\n\nArmy—About 2,700,000 total fighting men\n\nNavy—About one million\n\nThe President observed that we are definitely ahead of the British as regards the total number of men we have overseas at the present time and that we will soon have as many men in England for Overlord as the total British forces now in that place.\n\nGeneral Marshall felt we were already ahead of the British in England. There are only five British operational divisions in England. We have now as many men in England as can be deployed as have the British. The British have the problems of breaking down divisions in order to provide service troops and reorganize new troops.\n\nThe President said that the Prime Minister told him last June that the British had about one million men in the Middle East at that time, including Syria, Egypt, Persia, and so forth. He added that he would like to have the figures on deployment of total of U. S. forces versus British forces, and General Marshall undertook to obtain those figures for the President.\n\nGeneral Arnold said that with regard to the air, we have passed the British rapidly. By 1 January 1944 we will have over 12,000 operational planes, while the British will only have about 8,000.\n\nThe President said he was concerned in the total number of U. S. forces engaged in the war against Germany, and much interested in the total air forces. He said he did not like memorandum “B”.\n\nAdmiral King observed that a supplementary memorandum [주4] regarding a particular British officer for command was only proposed in the event that it is indicated that memorandum “B” is the only one that can be accepted.\n\n[250면]\n\nGeneral Marshall pointed out that this particular British officer mentioned is well known in the United States. He understands us and is presumably a man of stature in Britain. He sticks to the point and does not permit himself to be pushed around.\n\nThe President referred to the last paragraph of memorandum “A” wherein it was stated that the Combined Chiefs of Staff could override the decisions of the proposed Supreme Allied Commander.\n\nGeneral Marshall pointed out that that paragraph had been put in so that the Combined Chiefs of Staff would have the option of negative action. The idea was to get away from the “committee” command system. The proposed Supreme Allied Commander would have complete command control and make command decisions. Of course, he would submit his plans to the Combined Chiefs of Staff. The Combined Chiefs of Staff have never taken away from General Eisenhower his military command prerogatives. They do, however, take “means” away from General Eisenhower or add to his “means.” Our General Eisenhower makes his own plans and carries out his own operations. He decides where and when to bomb certain points.\n\nGeneral Marshall added that there had originally been another sentence included in this paragraph to the effect that either the U. S. Chiefs of Staff or the British Chiefs of Staff could effect the relief of the Supreme Allied Commander on request. He said that this had been deleted, however, on Admiral Leahy’s suggestion, in that it was pointed out that the relief of the Supreme Allied Commander would be a matter for decision by the Chiefs of State.\n\nIn reply to a question from the President as to the attitude of the Joint Chiefs of Staff regarding General Alexander as Commander in Chief for the Mediterranean, Italy and the Balkans, General Marshall said that if the Supreme Allied Commander should be a United States officer, he felt that General Alexander would be satisfactory for Commander in Chief of the Mediterranean. On the other hand, if the Supreme Allied Commander should be a British officer, General Eisenhower should become Commander in Chief of the Mediterranean.\n\nThe President said that he understood at Quebec that it was the opinion that General Eisenhower should stay until his mission was completed, that is, until he reached the Ancona line. [주5]\n\nGeneral Marshall said he had not known definitely about this until the last afternoon of Quadrant but that he understood that General Eisenhower was to remain until he reached a point north of Rome.\n\nAdmiral King recalled that was the agreement at Quadrant but said he believed that the decision had been taken with the understanding [251면] that German resistance would be less than had actually been offered.\n\nGeneral Arnold agreed that the decision at Quadrant had been for General Eisenhower to remain in command in Italy until north of Rome and in a defensive position.\n\nGeneral Marshall stated that the name of the particular British officer for Supreme Allied Commander had been suggested in order to throw the British into a position where they could not back out in the acceptance of memorandum “A”. He pointed out that the Prime Minister had said to him (General Marshall) that it would be well for him to be the Overlord commander in that the Prime Minister was in England from where the operation would be launched whereas the President would be in the United States—in other words, General Marshall would act as the President’s direct representative on the spot.\n\nThe President asked for an opinion as follows: if we do not get a Supreme Allied Commander as proposed in memorandum “A”, do the Chiefs of Staff believe that the British would accept General Eisenhower as the Supreme Allied Commander for the Mediterranean? The opinion of the Chiefs of Staff to this question was emphatically in the affirmative.\n\nIn reply to a question from the President as to whether General Eisenhower in Italy and General Wilson in the Aegean had really ever gotten together, General Marshall said that they had had one meeting, that he knew of, but that they had definitely separate commands.\n\nAdmiral King observed that both memoranda “A” and “B” accepted unified command in the Mediterranean.\n\nThe President agreed that it would be satisfactory if General Eisenhower became commander in chief of the Mediterranean. However, there might be some danger should General Alexander take over the Mediterranean command and then be dominated by the Prime Minister.\n\nGeneral Marshall said that the Joint Chiefs of Staff had accepted the contingency of General Alexander being dominated by the Prime Minister. On the other hand, the desirable condition of one command in the Mediterranean would exist. Naturally, executive direction would come from the British Chiefs of Staff.\n\nAdmiral Leahy said that evidently General Marshall thinks we should accept the British proposal for an Allied Commander in Chief of the Mediterranean and Middle East now. He (Admiral Leahy) did not feel that we should accept this until we have fought out the matter of a Supreme Allied Commander.\n\nGeneral Marshall felt that it would be illogical not to accept a Mediterranean commander in chief as proposed by the British [252면] immediately. He felt that it would be more logical and show good faith to accept the British proposal forthwith.\n\nAdmiral King said he was inclined to agree with General Marshall, and felt that the Mediterranean command should be dealt with on its merits forthwith.\n\nAdmiral Leahy, on the other hand, said that to agree to the overall Mediterranean command immediately would certainly not help the situation now in the Dodecanese.\n\nThe President felt that the over-all Mediterranean command proposed by the British might have resulted from an idea in the back of their heads to create a situation in which they could push our troops into Turkey and the Balkans.\n\nAdmiral King pointed out that the Mediterranean commander in chief would be under the Combined Chiefs of Staff and that whoever the Commander in Chief might be he would necessarily have to seek approval of the Combined Chiefs of Staff for any changes in his overall strategic plans.\n\nThe President observed that even if General Alexander should become commander in chief and desire to use U. S. troops and landing craft against the Dodecanese, the President could say no.\n\nAdmiral King observed that dispositions, allocations, lines of campaign of the commander in chief, Mediterranean, would be subject to decisions of the Combined Chiefs of Staff and the Chiefs of State.\n\nGeneral Marshall felt that the British would point out that they had suffered last week as the result of the lack of unified command in the Mediterranean. He said that a commander, in a position such as General Eisenhower, was always conservative regarding the sending of reinforcements to another command that was not his own responsibility. On the other hand, an over-all commander who had responsibility for an enlarged theater would feel differently toward bolstering up any weakened position in the theater for which he was responsible. He cited a recent command situation in Alaska as an example.\n\nGeneral Marshall said if General Eisenhower had had responsibility for the Middle East, the British doubtless feel, and perhaps rightly so, he would have influenced the attitude of Generals Tedder and Spaatz towards additional air support in the Dodecanese and the situation might have been different.\n\nThe President asked, why Leros, why Cos? He said the Prime Minister had been upset as regards the United States attitude regarding the Dodecanese. He asked whether we knew of the details of the British operations in the Dodecanese initiated by the Middle East command before those operations began? The general consensus of opinion of the Chiefs of Staff was that the United States had not been informed in advance of the proposed operations in the Dodecanese. [253면] However, General Marshall said he believed possibly he had seen a British pink dispatch regarding their movements against these islands. He added that the British always regarded the Dodecanese as of greater importance than have we in the United States.\n\nThe President stated that before any change is made in the principle set forth in the command setup proposed in memorandum “A” there should be another meeting between himself and the Joint Chiefs of Staff. He added that we could agree to a unified command in the Mediterranean but not at the same time as we took up the matter of the Supreme Allied Commander.\n\nMr. Hopkins observed that in discussing the matter of the Supreme Allied Commander in Chief for the Mediterranean, we were discussing a matter of principles rather than of personalities.\n\nIn reply to a question from the President as to whether it was felt the British would put General Wilson under General Eisenhower before General Eisenhower reached Rome, General Marshall and Admiral King said yes.\n\n3. Spheres of Responsibility in Germany—Europe–Wide “Rankin”\n\nThe President observed that in the memorandum he received from Admiral Leahy on behalf of the Joint Chiefs of Staff [주6] asking for guidance regarding spheres of influence as a result of a European-wide Rankin, the paper makes certain suppositions without actually saying so. He felt that whatever territorial dispositions were made should conform to geographic subdivisions of Germany. He said that the Soviet Government will offer no objection to breaking up Germany after the war, that practically speaking there should be three German states after the war, possibly five. He said (1) we might take southern Germany, Baden, Wurtenburg [Württemberg], Bavaria, everything south of the Rhine [Main?]. This area forms a sort of southern state. (2) Take everything north and west of that area, including Hamburg and Hanover, and so forth, up to and including Berlin to form a second state, and the northeastern part, that is Prussia, Pomerania, and south, to form a third state. He believed these general divisions were a logical basis for splitting up Germany. Especially was this so because the first or southern state was largely Roman Catholic; the northwestern portion is Protestant, while it might be said that the religion of the northeastern part is Prussianism. He felt that Marshal Stalin might “okay” such a division. He believed that the Chiefs of Staff would want to make a European Rankin conform to such a division. Actually the British wanted the northwestern part of Germany and would like to see the U. S. take France [254면] and Germany south of the Moselle River. He said he did not like that arrangement. We do not want to be concerned with reconstituting France. France is a British “baby.” United States is not popular in France at the present time. The British should have France, Luxembourg, Belgium, Baden, Bavaria, and Wurtenburg. The occupation of these places should be British. The United States should take northwest Germany. We can get our ships into such ports as Bremen and Hamburg, also Norway and Denmark, and we should go as far as Berlin. The Soviets could then take the territory to the east thereof. The United States should have Berlin. The British plan for the United States to have southern Germany, and he (the President) did not like it. [주7]\n\nGeneral Marshall agreed that the matter should be gone into again. He said the proposals in the paper before the President had devolved from a consideration of the United States concentration on the right of the Overlord line from England. The conceptions for occupation were primarily based on military considerations of Overlord. He said he saw a frank approach to the matter in the paper from three points of view: (1) a normal Overlord; (2) a partial Overlord, with some fighting; and (3) Rankin Case “C” (total collapse of Germany before Overlord got underway).\n\nAdmiral King observed that if Overlord should be underway when Germany collapsed, we would necessarily have a cross-over of our forces under the President’s plan. Particularly would this be so if we should have reached the line of the Seine.\n\nGeneral Marshall said that when Overlord was launched we must have U. S. forces on the right from a logistics point of view.\n\nAdmiral King observed that while the President’s idea regarding areas of occupation did not present insuperable difficulties, nevertheless there was a problem which would have to be worked out.\n\nGeneral Marshall said if a break comes, we could split our forces into two parts.\n\nThe President observed that there were no ports south of Hamburg and Bremen until the Dutch ports are reached.\n\nAdmiral King felt that the military plans for Overlord were so far developed that it would not be practicable to accept any change in Overlord deployment.\n\nGeneral Marshall said that the whole matter goes back to the question of ports in England. If we stick to Overlord we must have a scheme for disengaging Overlord at any stage of development in order to comply with the political considerations of occupation outlined by the President.\n\n[255면]\n\nThe President said it was his idea we should use as many troops from the United States in the occupation of Germany as possible. These can go around Scotland.\n\nAdmiral King felt that we must have a special occupational army, in a particular command, earmarked for occupation of northwest Germany.\n\nGeneral Marshall said that the Overlord conception was that the United States forces would be progressing on the right and those should be the divisions first to come home.\n\nThe President said he felt that the divisions now in North Africa, Sicily and Italy should be the divisions first to be sent back to the United States. He said one reason for the political “headache” in France was that De Gaulle hoped to be one mile behind the troops in taking over the government. He felt that we should get out of France and Italy as soon as possible, letting the British and the French handle their own problem together. There would definitely be a race for Berlin. We may have to put the United States divisions into Berlin as soon as possible.\n\nAdmiral Leahy observed it would be easy to go directly into northwest Germany. The problem of occupational troops proceeding to northwest Germany would certainly be less difficult than their fighting their way there across the intervening territory from northwestern France.\n\nGeneral Marshall observed that it was most important to keep commands in homogeneous control.\n\nThe President said he envisaged a railroad invasion of Germany with little or no fighting.\n\nGeneral Marshall said he assumed there would be a difficult lack of rolling stock and the land advance would have to be largely made on a motor truck basis.\n\nMr. Hopkins suggested that we be ready to put an airborne division into Berlin two hours after the collapse of Germany.\n\nIn reply to a question from the President as to Admiral Leahy’s opinion of the occupational area divisions, from a State Department point of view, Admiral Leahy said that he felt we should definitely get out of France as soon as possible. We should accept any difficulties in order to get out of France at the earliest possible time. If we want to let De Gaulle have France, all well and good. However, whatever troops there are in France at the time of German collapse will certainly have to stay in order to supervise any elections. General De Gaulle wants to start the French Government right now. Possibly there will be civil war in France. The British should clear up such a condition. On the other hand, it would be much easier for the United States to handle conditions in Germany. The Germans [256면] are easier to handle than would be the French under the chaotic conditions that could be expected in France.\n\nThe President said he personally envisaged an occupational force of about one million United States troops. He expanded on the policy of “quarantine.” He said that the four United Nations by their police power could, if necessary, maintain order in Europe by the “quarantine” method. For instance, we do not want to use our troops in settling local squabbles in such a place as Yugoslavia. We could use the Army and Navy as an economic blockade and preclude ingress or egress to any area where disorder prevailed.\n\nIn reply to a question from General Marshall as to how long the President contemplated it would be necessary to maintain one million men in Europe, The President replied for at least one year, maybe two.\n\nAdmiral Leahy observed that there will certainly be civil wars in many parts of Europe when the Germans let go. If the French divisions could be properly controlled, they could doubtless put down civil war in France. If De Gaulle could control the troops, he could put down the civil war—but what then? France will require food and munitions. The President said we may definitely have to keep certain divisions in France. He felt that Holland was no problem. The Queen will return there and all will be well. On the other hand, Belgium is a big question—it is a two-language country. Possibly a buffer state between Germany and France will be necessary. This buffer state could run from northern France, say, Calais, Lille, and Ardenne[s], through to Alsace and Lorraine—in other words, from Switzerland to the seacoast. This would be a single buffer state.\n\nAdmiral Leahy observed that this was also at one time a German proposal and called the interdicted zone.\n\nThe President observed that if we take the Rankin paper proposed by COSSAC, [주8] the British would undercut us in every move we make in the southern occupational area proposed for the United States. He said that it was quite evident that British political considerations were in the back of the proposals in this paper.\n\nGeneral Marshall said that the paper in the President’s hands as regards occupational zones works out logically. There would be less entanglement in forces, supply lines would be shorter and more direct. The paper was worked out on that basis.\n\nAdmiral King said that it was evident from any stage of Overlord it is imperative to plan for what operations should be necessary in order to switch to the occupation areas proposed by the President.\n\n. . . . . . . . . . . . . .\n\n[257면]\n\n5. Proposed Agenda for President’s Conferences With Generalissimo Chiang Kai-shek, Prime Minister Churchill and Marshal Stalin\n\nWith regard to Item 1b of Enclosure “A”, “Chinese attitude towards Russian participation,” [주9] General Marshall questioned whether it would be wise to discuss this matter with the Generalissimo.\n\nThe President said the Chinese desire equal rights with Russia in Outer Mongolia. Chiang Kai-shek wants Manchuria back. Unquestionably a discussion of this subject will cause trouble. The matter might be worked out, however, on the basis of “free zones”. The Generalissimo desires a trusteeship over Korea, administered by Russia, China and the United States as trustees.\n\nGeneral Marshall said the Soviets want Kuzan [Pusan?] in that it is close to Japan.\n\nAdmiral King said the Soviets want a nice big port and communication to Dairen.\n\nMr. Hopkins observed that the Generalissimo might ask the President for a discussion of all operations contemplated against Japan.\n\nThe President replied that he will tell the Generalissimo in general these operations, but did not propose to be specific or mention dates. The President said undoubtedly the Generalissimo will inquire about the matter of tonnage over the hump.\n\nIn reply to a question from the President as to how Admiral McKean’s [McCain’s] plan for the bombing of Japan was coming along, Admiral King replied that it was being worked out and they were having rehearsals now from which experience will be gained.\n\nThe President said he will not bring up the question of a Supreme Commander in the Pacific.\n\nWith regard to item 1b [d] of enclosure “A”, “Importance of Chinese assistance to operations in North Burma” The President said he thought it might be desirable to bring General Somervell into the discussion of this matter.\n\nGeneral Marshall then told about the organization of 3,000 U. S. volunteers, organized as a special brigade for long-range penetration groups to precede the Chinese forces. He said that great efforts had been made to organize this United States unit. They had been provided with special equipment and special planes.\n\nIn reply to a question from the President as to what had been heard regarding the training of Chinese troops in Yunnan, General Marshall said that General Stilwell, in a recent dispatch, said that Chinese troops lacked equipment, lacked food, suffered from malnutrition, and that he had only received a very small percentage of the troops that were needed. The Chinese divisions each consist of from [258면] four to five thousand troops. They are all new men and underfed, and must first be brought into suitable physical condition before their training can commence. He added that the British were despondent regarding the matter of Yunnan forces.\n\nGeneral Marshall added he thought it would be a serious error to clamp down additional United States troops between the Chinese, British and Indian troops. We are already sending 4,000 additional troops to India in order to build airfields. We also have a battalion in this area constructing a railroad.\n\nIn reply to a question from the President as to whatever happened about the Generalissimo’s request for a regiment of marines near Ichang, which would result in making some 200,000 Chinese really fight, The Joint Chiefs of Staff and Mr. Hopkins stated that they had never heard of such a request.\n\nGeneral Marshall said that any such proposition as putting a large unit of U. S. troops in the vicinity of Ichang would result in increasing the difficulty of the supply problem over the hump.\n\nIn reply to a question from the President as to how the tonnage over the hump was getting along, General Arnold said that by means of night flying and thus avoiding Japanese fighter opposition and other improved methods, he hoped to attain a figure of about 10,000 tons this month. He added that we will step up the tonnage as rapidly as possible. He pointed out, however, that we must have American troops in China in connection with this supply route. As far as he knew the pipeline project was up to schedule.\n\nThe President said if Germany should be cleaned up, we must study how many bombers could be operated from the vicinity of Vladivostok.\n\nGeneral Arnold said that General Bradley’s plan had proposed the operation of 100 bombers maximum by supply from Alaska. [주10]\n\nWith regard to item 2c (1), subject “Post-war Problems—Chinese participation in the occupation of Japan”—The President said the Chinese will undoubtedly want to take part in the occupation of Japan.\n\nWith regard to item 2c (3), “Military and naval bases for mutual assistance”—The President said it was contemplated that the Mandated Islands would be under the composite sovereignty of the United Nations. The Chinese want Formosa and the Bonins. The military bases required in the Mandated Islands would be occupied by the United States. There might be an over-all civilian control of the entire group and civilian control of the smaller islands. Certainly we would not want to occupy the smaller islands in the Mandates.\n\n[259면]\n\nMr. Hopkins felt that if it was believed that Formosa would be an important place for a base, the Generalissimo would be glad to give base rights to the United States.\n\nThe President agreed but said that these base rights in Formosa should not be given on a permanent basis in that the Generalissimo would not agree to any permanent bases.\n\nWith regard to Enclosure “B”, “Proposed agenda for the meeting of the President and the Prime Minister” [주11] —The President said that Mr. Churchill is still interested in working for a European economic federation. He said that we should not get roped into accepting any European sphere of influence. We do not want to be compelled, for instance, to maintain United States troops in Yugoslavia.\n\nIn reply to a question from General Marshall as to whether there would be any compromise in the Prime Minister’s proposal, he (The President) said that the United States would not act initially but could send air or naval forces.\n\nIn regard to U. S. policy on non-participation in operation of eastern Mediterranean-Balkan area, The President said we must be concerned with the Soviet attitude in this matter.\n\nGeneral Marshall said we must see the question of this Balkan matter settled. We do not believe that the Balkans are necessary. To undertake operations in this region would result in prolonging the war and also lengthening the war in the Pacific. We have now over a million tons of supplies in England for Overlord. It would be going into reverse to undertake the Balkans and prolong the war materially. It would certainly reduce United States potentialities by two-thirds. General Marshall pointed out that commitments and preparations for Overlord extend as far west as the Rocky Mountains in the United States. The British might like to “ditch” Overlord at this time in order to undertake operations in a country with practically no communications. If they insist on any such proposal, we could say that if they propose to do that we will pull out and go into the Pacific with all our forces.\n\nThe President said that we could tell the British that they have lots of troops in the Middle East, close to the Balkans, why not send them to the Far East? He pointed out that the Soviets are now only 60 miles from the Polish border and 40 miles from Bessarabia. If they cross the Bug River, which they might do within the next two weeks, they would be on the point of entering Rumania. The Soviets might say, “If someone would now come up from the Adriatic to the Danube, we could readily defeat Germany forthwith.”\n\n[260면]\n\nGeneral Marshall said we will have to be ready to explain to the Soviets the implications of any such move. If the Soviet forces get to the Bug River, we can then throw in our air to assist them. We could force the issue from England. He felt that we should not bring up the matter of asking the Soviets for their plans until we are committed to our own plans. Then we could give them air support.\n\nIn this connection General Marshall inquired of the President what sort of an organization he contemplated for doing business with the U. S. S. R. on a military basis. He felt that we should come to the Soviets on specific problems and should definitely have a Soviet officer know what we are doing.\n\nThe President pointed out that we should not forget about the control commission in London. [주12] This commission will undoubtedly ask for a military committee as a part of that setup.\n\nAdmiral Leahy observed that the control commission in London will mean nothing but trouble for us.\n\nAdmiral King pointed out that if Turkey entered the war it would result in drawing away supplies and troops from other operations. He asked whether it would be possible to have another conference like this before meeting with the U. S. S. R.\n\nThe President indicated in the affirmative.\n\nGeneral Arnold said the Soviets should give us advance notice of what air facilities would be available for bases and operations against Japan. It was important to get this information as soon as possible.\n\nGeneral Marshall suggested that Burma, Sumatra and Akyab were not on the list for the President to discuss with the Prime Minister. He said that the Prime Minister was in favor of operations against Sumatra, or the Andaman Islands.\n\nAdmiral Leahy felt that by now the Prime Minister may be somewhat “fed up” with that idea.\n\nAdmiral King pointed out that the British say that without more help from us they can only do the Andaman Islands operation, which is certainly a case of marking time.\n\nThe President said he was much annoyed about the Azores matter.\n\nAdmiral Leahy felt that it was perfectly proper to be annoyed and that the British could be of more help regarding the Azores if they wanted to.\n\nAdmiral King observed that recent naval ships and planes which entered the Azores were well treated by the Portuguese and British.\n\nGeneral Arnold said our first transport plane will arrive in the Azores tomorrow.\n\nAdmiral King observed that the airfields in the Azores were much better than had been expected.\n\n[261면]\n\nGeneral Marshall thought that what we really should have had was a “go-getter” in Lisbon. From the attitude of our representative there he felt it was a wonder we have anything.\n\nWith regard to Item 1a of Enclosure “C”, “Proposed agenda for the President’s meeting with Marshal Stalin” [주13] regarding the topic, “Soviet collaboration in Strategic Bombing, including use of Soviet Bases by U. S. Forces”—The President said that the Soviets would like to have our planes but not our personnel.\n\nAdmiral Leahy said he believed the Soviets were softening in their point of view regarding this matter.\n\nWith regard to the Italian fleet and Italian shipping, Admiral King said he did not believe the Soviets were in a position to demand Italian ships.\n\nThe President said it would be better to let the U. S. S. R. have one-third of the ships as a token of good-will. No transfer of title was contemplated. He said we should not be concerned about the Italian attitude in this matter. The idea was to retain the Italian ships in the possession of the Allies and allocate them for best use as necessary. We will certainly prevent any future Italian Navy. After using these ships to our heart’s content we can talk about the matter of eventual title. Then we could give back a few of the ships to the Italians. He felt that it would be all right for the ships given to the U. S. S. R. to be manned by Soviet personnel if a reasonable proposition for the use of them is made by the Soviets.\n\nAdmiral Leahy observed that the conference had been of great benefit to the Chiefs of Staff.\n\nThe President then reiterated his idea of a U. S. occupational zone for Germany and drew out the proposed line of demarcation on a map. This map had been obtained from Rear Admiral Brown and was handed to General Marshall at the conclusion of the meeting. [주14]", "notes": ["[주1] 참석자는 루스벨트, 홉킨스, 리히, 마셜, 킹, 아널드, 브라운, 로열이었다.", "[주2] 앞의 203면.", "[주3] 앞의 150면 참조.", "[주4] 앞의 209면.", "[주5] 언급된 결정에 관해서는 Matloff, 224~228면 참조.", "[주6] 이 책에는 수록하지 않음.", "[주7] 루스벨트가 이 점령지대에 관한 자신의 구상을 그린 지도에 관한 언급은 이 문서의 마지막 문단과 각주 14 참조.", "[주8] 요약은 뒤의 786면 참조.", "[주9] 앞의 245면.", "[주10] 언급된 계획은 1942년 폴렛 브래들리(Follet Bradley) 소장이 제기한 것으로, 알래스카를 경유한 대소련 항공기 수송과 시베리아 기지 개발에 관한 것이었다. Maurice Matloff and Edwin M. Snell, 『Strategic Planning for Coalition Warfare, 1941–1942』 (Washington: U. S. Government Printing Office, 1953), United States Army in World War II 총서, 343~346면 참조.", "[주11] 앞의 246면.", "[주12] 아마도 모스크바 회의에서 설치가 합의된 유럽자문위원회(European Advisory Commission)를 가리킨다.", "[주13] 앞의 247면.", "[주14] 이 지도는 Matloff, 341면 맞은편에 실려 있다."], "warn": true, "pages": ["248", "249", "250", "251", "252", "253", "254", "255", "256", "257", "258", "259", "260", "261"], "search": "Roosevelt 루스벨트 (대통령) Hopkins 홉킨스 Leahy 리히 제독 Marshall 마셜 장군 King 킹 제독 Arnold 아널드 장군 Brown 브라운 해군소장 Royal 로열 Churchill 처칠 (수상) Stalin 스탈린 원수 Chiang Kai-shek 장제스 (총통) Eisenhower 아이젠하워 장군 Alexander 알렉산더 장군 Wilson 윌슨 장군 Casey 케이시 Tedder 테더 장군 Spaatz 스파츠 장군 Stilwell 스틸웰 장군 Somervell 소머벨 장군 De Gaulle 드골 장군 McCain 매케인 제독 (원문 표기 McKean) Bradley 브래들리 장군 (Follet Bradley 폴렛 브래들리 소장) Matloff 매트로프 (편집자 각주의 저자) Snell 스넬 (편집자 각주의 저자) Roosevelt 루스벨트 (대통령) Hopkins 홉킨스 Leahy 리히 (제독) Marshall 마셜 (장군) King 킹 (제독) Arnold 아널드 (장군) Brown 브라운 Royal 로열"}, {"id": "d259", "order": 259, "date": "1943-11-23", "group": "B", "eyebrow": "d259 · Chinese Summary Record", "title": "루스벨트·장제스 회담에 관한 중국 측 요약 기록, 1943년 11월 23일 오후 8시", "badge": null, "list_right": "문서 259", "meta": [{"k": "일자", "v": "1943-11-23"}, {"k": "장소", "v": "Cairo", "txt": true}, {"k": "발신", "v": "중국 측 기록 (영역본, 'Translation' 표기)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": "Franklin D. Roosevelt 프랭클린 D. 루스벨트, Chiang Kai-shek 장제스", "txt": true, "wide": true}, {"k": "종류", "v": "기록"}], "links": [{"k": "FRUS", "text": "문서 259 원문", "url": "https://history.state.gov/historicaldocuments/frus1943CairoTehran/d259"}], "summary": "루스벨트와 장제스가 중국의 4대국 지위, 일본 천황제·군사점령·배상, 영토 반환, 군사 협력, 그리고 조선·인도차이나·태국의 장래 지위 등 10개 항목을 논의한 중국 측 요약 기록.", "points": ["(7) 루스벨트는 조선·인도차이나 및 기타 식민지 지역과 태국의 장래 지위에 관하여 중국과 미국이 상호 양해에 이르러야 한다는 의견을 제시했고, 장제스는 이에 동의하면서 조선에 독립을 부여할 필요성을 강조했다.", "장제스는 인도차이나의 전후 독립 달성을 미·중이 함께 도와야 하며 태국에는 독립국 지위가 회복되어야 한다고 보았고, 루스벨트가 동의를 표했다.", "루스벨트는 중국이 4대국의 하나로서 그 기구와 모든 결정에 대등한 자격으로 참여해야 한다고 했고, 장제스는 기꺼이 참여하겠다고 답했다.", "일본 천황제 폐지 문제에 대해 장제스는 이것이 일본의 정체(政體) 문제와 결부되므로 전후 일본 국민 스스로 결정하도록 남겨두어야 한다고 답했다.", "루스벨트는 전후 일본 군사점령에서 중국이 주도적 역할을 해야 한다고 보았으나, 장제스는 중국에 그럴 역량이 없으므로 미국 주도 아래 중국이 보조적 자격으로 참여하겠다고 했다.", "영토 반환: 중국 동북 4성, 타이완(포모사), 펑후 제도의 중국 반환에 합의했고, 랴오둥 반도와 뤼순(포트아서)·다롄 두 항구가 포함된다는 양해가 있었다.", "류큐 제도에 대해 루스벨트가 거듭 중국의 의사를 물었으나, 장제스는 미·중 공동 점령과 궁극적으로는 국제기구의 신탁통치 아래 양국 공동 관리에 찬성한다고 답했다.", "배상은 일부를 일본의 산업 기계·설비, 군함과 상선, 철도 차량 등 현물로 받는 방안에 양자가 합의했다.", "군사 협력: 외국의 침략 시 상호 원조, 태평양 각지 기지에 대한 미군 주둔, 양국 육·해군 기지의 상호 이용, 아시아 관련 결정 이전의 미·중 사전 협의에 합의했다.", "외몽골과 탄누투바 문제는 장차 소련과의 교섭을 통해 해결해야 한다는 것이 장제스의 입장이었다.", "통합 지휘: 장제스는 미·중 합동참모회의 구성 또는 기존 영·미 참모총장회의에 중국이 참여하는 방안을 제안했다."], "primary": "1943년 11월 23일, 오후 8시\n\n번역문\n\n**(1) 중국의 국제적 지위에 관하여** — 루스벨트(Franklin D. Roosevelt) 대통령은 중국이 4대국의 하나로서 그 자리를 차지하고 4대국 기구의 기관과 그 모든 결정에 대등한 자격으로 참여해야 한다는 견해를 표명하였다. 장제스(Chiang Kai-shek) 총통은 중국이 4대국의 모든 기구와 결정에 참여하게 되기를 기쁘게 여긴다고 답하였다.\n\n**(2) 일본 황실의 지위에 관하여** — 루스벨트 대통령은 전후 일본 천황이라는 제도를 폐지하여야 하는지에 대한 장제스 총통의 견해를 물었다. 총통은, 이는 일본의 정부 형태 문제와 결부되는 것이므로 국제관계에서 스스로 영속될 수 있는 어떠한 오류도 초래하지 않도록 전후 일본 국민 자신이 결정하도록 남겨두어야 한다고 말하였다.\n\n**(3) 일본의 군사점령에 관하여** — 루스벨트 대통령은 전후 일본의 군사점령에서 중국이 주도적 역할을 하여야 한다는 의견이었다. 그러나 장제스 총통은 중국이 이 상당한 책임을 떠맡을 만한 채비가 되어 있지 않으며, 그 임무는 미국의 주도 아래 수행되어야 하고, 그때 가서 필요하다고 판명될 경우 중국이 [324면] 보조적 자격으로 그 임무에 참여할 수 있다고 생각하였다. 총통은 또한 이 문제에 대한 최종 결정은 실제 정세가 더 전개되기를 기다려도 된다는 입장을 취하였다.\n\n**(4) 현물 배상에 관하여** — 장제스 총통은 전후 일본이 중국에 지불하여야 할 배상의 일부를 실물 재산의 형태로 지불할 수 있으리라고 제의하였다. 일본의 산업 기계와 설비, 군함과 상선, 철도 차량 등 상당 부분을 중국에 이전할 수 있을 것이라고 하였다. 루스벨트 대통령은 그 제의에 동의를 표명하였다.\n\n**(5) 영토의 반환에 관하여** — 장제스 총통과 루스벨트 대통령은, 일본이 중국으로부터 무력으로 탈취한 중국의 동북 4성, 타이완(포모사) 및 펑후 제도(Penghu Islands [Pescadores])가 전후 중국에 반환되어야 하며, 여기에 랴오둥 반도와 그 두 항구인 뤼순(포트아서)과 다롄이 포함되어야 한다는 양해 아래 합의하였다. 이어서 대통령은 류큐 제도 문제를 언급하며 중국이 류큐를 원하는지 한 차례 이상 물었다. 총통은 중국이 중국과 미국에 의한 류큐의 공동 점령에, 그리고 궁극적으로는 어느 국제기구의 신탁통치 아래 양국에 의한 공동 관리에 찬성할 것이라고 답하였다. 루스벨트 대통령은 홍콩 문제도 제기하였다. 총통은 대통령이 더 논의를 진행하기에 앞서 영국 당국과 그 문제를 협의할 것을 제안하였다.\n\n**(6) 군사 협력에 관한 사항에 관하여** — 루스벨트 대통령은, 전후 중국과 미국이 외국의 침략이 있을 경우 양국이 서로를 원조할 수 있도록 하는 일정한 약정을 맺어야 하며, 미국이 침략 방지의 책임을 실효적으로 분담할 수 있도록 태평양의 여러 기지에 충분한 병력을 유지하여야 한다고 제의하였다. 장제스 총통은 두 제의 모두에 동의를 표명하였다. 총통은 미국이 중국의 국방을 강화하고 국제적 의무의 이행을 가능하게 하기 위하여 중국의 육·해·공군을 장비하는 데 필요한 원조를 제공할 수 있는 처지가 되기를 희망한다고 표명하였다. 장제스 총통은 또한 상호 안전을 달성하기 위하여 양국이 각기의 육군 및 해군 기지를 상대국이 사용할 수 있도록 하는 약정을 맺어야 한다고 제의하였고, 중국은 뤼순(포트아서)을 중국과 미국의 공동 처분에 맡길 용의가 있다고 말하였다. 루스벨트 대통령은 그 나름대로, 아시아에 관한 사항에 대하여 어떤 결정이 이루어지기 전에 중국과 미국이 서로 협의하여야 한다고 제의하였다. 총통은 동의를 표시하였다.\n\n[325면]\n\n**(7) 조선, 인도차이나 및 태국에 관하여** — 루스벨트 대통령은 중국과 미국이 조선, 인도차이나 및 그 밖의 식민지 지역, 그리고 태국의 장래 지위에 관하여 상호 양해에 이르러야 한다는 의견을 제시하였다. 장제스 총통은 이에 동의하면서 조선에 독립을 부여할 필요성을 강조하였다. 또한 중국과 미국이 함께 인도차이나가 전후 독립을 달성하도록 돕는 데 힘써야 하며, 태국에는 독립국의 지위가 회복되어야 한다는 것이 총통의 견해였다. 대통령은 동의를 표명하였다.\n\n**(8) 중국에 대한 경제 원조에 관하여** — 장제스 총통은 중국의 전후 경제 재건이 대단히 어려운 과업이 될 것이며, 차관 등의 형태로 미국의 재정 원조와 아울러 각종 기술 원조를 필요로 하리라고 지적하였다. 루스벨트 대통령은 그 문제에 대하여 면밀하고 실제적인 고려가 이루어질 것이라고 밝혔다.\n\n**(9) 외몽골과 탄누투바에 관하여** — 루스벨트 대통령은 특히 탄누투바의 현재 지위와 그 인접국들과의 역사적 관계에 관하여 물었다. 장제스 총통은 그 지역이 러시아에 의하여 강제로 탈취되어 병합되기까지 중국 외몽골의 불가분한 일부였다고 지적하였다. 그는 탄누투바 문제가 외몽골 문제와 더불어 장차 소비에트 러시아와의 교섭을 통하여 해결되어야 한다고 말하였다.\n\n**(10) 통합 지휘에 관하여** — 장제스 총통은 중·미 합동 참모총장회의(China–U. S. Joint Council of Chiefs-of-Staff)의 구성을, 또는 그 대안으로 기존의 영·미 참모총장회의에 중국이 참여하는 것을 제의하였다. 루스벨트 대통령은 그 문제에 대한 결정에 이르기 위하여 미국의 참모총장들과 협의하는 데 동의하였다.\n\n---\n\n영국 참모총장단 만찬, 저녁\n\n참석자\n\n| 미국 | 영국 |\n|---|---|\n| 리히(Leahy) 제독 | 브룩(Brooke) 장군 |\n| 킹(King) 제독 | 포털(Portal) 공군참모총장 |\n| 아널드(Arnold) 장군 | 커닝엄(Cunningham) 해군원수 |\n| | 딜(Dill) 육군원수 |\n\n[326면]", "secondary": "November 23, 1943, 8 p.m.\n\nTranslation\n\n(1)\n\nOn China’s International Position—President Roosevelt expressed his view that China should take her place as one of the Big Four [주1] and participate on an equal footing in the machinery of the Big Four Group and in all its decisions. Generalissimo Chiang responded that China would be glad to take part in all the Big Four machinery and decisions.\n\n(2)\n\nOn the Status of Japanese Imperial House—President Roosevelt enquired of Generalissimo Chiang’s views as to whether the institution of the Emperor of Japan should be abolished after the war. The Generalissimo said that this would involve the question of the form of government of Japan and should be left for the Japanese people themselves to decide after the war, so as not to precipitate any error which might perpetuate itself in international relations.\n\n(3)\n\nOn Military Occupation of Japan—President Roosevelt was of the opinion that China should play the leading role in the post-war military occupation of Japan. [주2] Generalissimo Chiang believed, however, that China was not equipped to shoulder this considerable responsibility, that the task should be carried out under the leadership of the United States and that China could participate in the task in [324면] a supporting capacity should it prove necessary by that time. The Generalissimo also took the position that the final decision on the matter could await further development of the actual situation.\n\n(4)\n\nOn Reparation in Kind—Generalissimo Chiang proposed that a part of the reparation Japan was to pay China after the war could be paid in the form of actual properties. Much of Japan’s industrial machinery and equipment, war and merchant ships, rolling stock, etc., could be transferred to China. President Roosevelt expressed his concurrence in the proposal.\n\n(5)\n\nOn Restoration of Territories—Generalissimo Chiang and President Roosevelt agreed that the four Northeastern provinces of China, Taiwan and the Penghu Islands [Pescadores] which Japan had taken from China by force must be restored to China after the war, it being understood that the Liaotung Peninsula and its two ports Lushun (Port of Arthur) and Dairen, must be included. The President then referred to the question of the Ryukyu Islands and enquired more than once whether China would want the Ryukyus. The Generalissimo replied that China would be agreeable to joint occupation of the Ryukyus by China and the United States and, eventually, joint administration by the two countries under the trusteeship of an international organization. President Roosevelt also raised the question of Hongkong. The Generalissimo suggested that the President discuss the matter with the British authorities before further deliberation.\n\n(6)\n\nOn Matters Concerning Military Cooperation—President Roosevelt proposed that, after the war, China and the United States should effect certain arrangements under which the two countries could come to each other’s assistance in the event of foreign aggression and that the United States should maintain adequate military forces on various bases in the Pacific in order that it could effectively share the responsibility of preventing aggression. Generalissimo Chiang expressed his agreement to both proposals. The Generalissimo expressed his hope that the United States would be in a position to extend necessary aid to China for equipping its land, naval and air forces for the purpose of strengthening its national defense and enabling its performance of international obligations. Generalissimo Chiang also proposed that, to achieve mutual security, the two countries should arrange for army and naval bases of each to be available for use by the other and stated that China would be prepared to place Lushun (Port of Arthur) at the joint disposal of China and the United States. President Roosevelt, on his part, proposed that China and the United States should consult with each other before any decision was to be reached on matters concerning Asia. The Generalissimo indicated agreement.\n\n[325면] (7)\n\nOn Korea, Indo-China and Thailand—President Roosevelt advanced the opinion that China and the United States should reach a mutual understanding on the future status of Korea, Indo-China and other colonial areas as well as Thailand. Concurring, Generalissimo Chiang stressed on the necessity of granting independence to Korea. It was also his view that China and the United States should endeavor together to help Indo-China achieve independence after the war and that independent status should be restored to Thailand. The President expressed his agreement. [주3]\n\n(8)\n\nOn Economic Aid to China—Generalissimo Chiang pointed out that China’s post-war economic reconstruction would be a tremendously difficult task which would require United States financial aid in the form of loans, etc., and also various types of technical assistance. President Roosevelt indicated that close and practical consideration would be given to the matter.\n\n(9)\n\nOn Outer Mongolia and Tannu Tuva—President Roosevelt enquired especially as to the present status of Tannu Tuva and its historical relations with its neighbors. Generalissimo Chiang pointed out that the area had been an integral part of China’s Outer Mongolia until it was forcibly taken and annexed
