by Russia. He said that the question of Tannu Tuva, together with that of Outer Mongolia, must be settled in time to come through negotiations with Soviet Russia.\n\n(10)\n\nOn Unified Command—Generalissimo Chiang proposed the formation of a China–U. S. Joint Council of Chiefs-of-Staff or, as an alternative, China’s participation in the existing Britain–U. S. Council of Chiefs-of-Staff. [주4] President Roosevelt agreed to consult the chiefs of staff of the United States in order to reach a decision on the matter. [주5]\n\nDinner party of the British Chiefs of Staff, evening\n\nPresent\n\nUnited States United Kingdom\n\nAdmiral Leahy General Brooke\n\nAdmiral King Air Chief Marshal Portal\n\nGeneral Arnold Admiral of the Fleet Cunningham\n\nField Marshal Dill\n\n[326면]", "notes": ["[주1] 미국, 중국, 소련, 영국.", "[주2] 후술, 864면 참조.", "[주3] 후술, 389, 485, 864, 869면 참조. 엘리엇 루스벨트 편, 『F. D. R., 그의 사신집(私信集) 1928–1945』(뉴욕: Duell, Sloan and Pearce, 1950, 전2권), 제2권 1489면; 에드워드 R. 스테티니어스 2세, 『루스벨트와 러시아인: 얄타 회담』(가든시티: Doubleday and Company, Inc., 1949), 237–238면.", "[주4] 후술, 388면 참조.", "[주5] 루스벨트의 답은 부정적이었다. 후술, 748면 참조. 이 주제에 대한 연합참모본부(CCS)의 검토에 관해서는 전술, 305, 320면도 참조."], "warn": false, "pages": ["323", "324", "325", "326"], "search": "Franklin D. Roosevelt 프랭클린 D. 루스벨트 Chiang Kai-shek 장제스 Admiral Leahy 리히 제독 Admiral King 킹 제독 General Arnold 아널드 장군 General Brooke 브룩 장군 Air Chief Marshal Portal 포털 공군참모총장 Admiral of the Fleet Cunningham 커닝엄 해군원수 Field Marshal Dill 딜 육군원수 Franklin D. Roosevelt 프랭클린 D. 루스벨트 Chiang Kai-shek 장제스"}, {"id": "d263", "order": 263, "date": "1943-11-24", "group": "B", "eyebrow": "d263 · Combined Chiefs of Staff Minutes", "title": "연합참모본부 회의록, 1943년 11월 24일 오전 11시", "badge": "Secret", "list_right": "문서 263", "meta": [{"k": "일자", "v": "1943-11-24"}, {"k": "장소", "v": "Cairo", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": "The President (Franklin D. Roosevelt) 대통령(프랭클린 D. 루스벨트), The Prime Minister (Winston S. Churchill) 총리(윈스턴 S. 처칠), United States / China 오찬 회동 참석자 — General Marshall 마셜 장군, Lieutenant General Stilwell 스틸웰 중장, Generalissimo Chiang 장제스 총통, Madame Chiang 장 부인(쑹메이링)", "txt": true, "wide": true}, {"k": "종류", "v": "회의록"}], "links": [{"k": "FRUS", "text": "문서 263 원문", "url": "https://history.state.gov/historicaldocuments/frus1943CairoTehran/d263"}], "summary": "카이로에서 열린 연합참모본부 회의에서 루스벨트와 처칠이 스탈린과의 회담을 앞두고 오벌로드·지중해·동남아시아 전역의 작전 우선순위를 점검하고, 그 과정에서 중국이 만주와 조선의 재점령을 포함한 넓은 열망을 품고 있다는 점이 언급된 기록.", "points": ["대통령은 \"중국이 만주와 조선의 재점령을 포함한 넓은 열망(wide aspirations)을 갖고 있다는 데는 의문의 여지가 없다\"고 말했다. 조선의 전후 처리가 미국 최고 수뇌부의 논의에 중국의 영토적 요구라는 맥락으로 등장한 대목이다.", "대통령은 총통(장제스)이 전날의 논의에 매우 만족한 듯하다고 언급했다. 카이로에서의 미·중 회담 직후의 평가다.", "대통령은 몰로토프가 밝힌 견해, 즉 일본의 패배가 독일의 패배에 뒤이어 현재 일반적으로 가능하다고 여겨지는 것보다 더 빨리 올 것이라는 견해에 동의한다고 말했다.", "총리는 히틀러가 끝난 뒤 일본을 어떻게 이길 것인지에 참모진이 많은 고심을 해 왔으며, 영국 함대를 그 목적에 가장 크게 기여할 수 있는 곳에 배치하겠다고 말했다.", "대통령은 이 회의가 스탈린과의 회담에 앞선 예비 검토이며 최종 결정은 그 회담의 진행에 달려 있다고 못 박았다.", "총리는 지난 두 달이 실망의 연속이었다고 진단했다. 이탈리아 전역의 정체, 지중해에서의 부대·상륙정 차출, 유고슬라비아 티토 세력에 대한 보급 부재, 에게해 레로스 상실(정예 5,000명, 순양함 4척·구축함 7척 손실)을 들었다.", "총리는 오벌로드에 대한 열의를 조금도 늦추지 않았다며 \"우리는 여기에 자루 끝까지 박혀 있다\"고 말하고, 다만 상륙정 운용에 약간의 융통성은 인정되어야 한다고 주장했다.", "총리가 제시한 일정은 1월 로마, 2월 로도스, 유고슬라비아 보급, 지휘 체계 정리와 에게해 개방(터키 접촉 결과에 따라)이며, 영국은 포강 유역 진출 의사가 없고 이탈리아 전역의 목표를 피사–리미니 선으로 엄격히 한정한다고 밝혔다.", "대통령은 런던에서 앙카라에 이르는 전략공군을 하나의 지휘 아래 두어야 한다며 1918년 포슈 원수의 지휘를 예로 들었고, 총리는 연합참모본부 체제가 충분히 만족스럽게 작동해 왔다고 답했다."], "primary": "1943년 11월 24일 오전 11시\n\n기밀(secret)\n\n**1. 유럽과 지중해에서의 작전**\n\n대통령은 이번 회의에서 지중해를 포함한 유럽 전역(戰域)의 작전에 대한 예비 검토가 이루어지기를 바란다고 말했다. 최종 결정은 머지않아 열릴 스탈린(Stalin) 수상과의 회담이 어떻게 되느냐에 달려 있을 것이었다. 스탈린 수상이 오벌로드(Overlord) 너머로는 아무 생각이 없으며, 고려할 가치가 있는 유일한 작전으로서 이 작전에 최고의 중요성을 부여하고 있다는 보고가 일부 있었다. 다른 쪽에서는 스탈린 수상이 1944년의 오벌로드에 더하여 겨울 내내 독일군에게 숨 돌릴 틈이 주어지지 않기를, 그리고 지금부터 오벌로드까지 노는 손이 없기를 간절히 바라고 있다고 보았다. 병참상의 문제는 오벌로드를 그 온전한 모습 그대로 유지하면서 동시에 지중해를 불타오르게 할 수 있느냐였다. 대통령이 보기에 스탈린 수상은 거의 틀림없이 지중해에서의 행동 지속과 오벌로드를 모두 요구할 것이었다. 동지중해에 관해서는 \"독일군이 도데카니사 제도에서 어디로 갈 것인가\"라는 물음이 제기되었다. 답은 \"어디로도 가지 않는다\"인 듯했다. 같은 물음을 우리 자신에게 적용한다면 답은 터키의 행동에 달린 것으로 보였다. 터키의 참전은 이 문제의 양상을 상당히 다르게 만들 것이었다. 이 또한 스탈린 수상과의 회담에서 논의할 문제였다.\n\n총리는 대통령의 견해에 동의한다고 말했다. 우리는 북아프리카와 지중해에서, 러시아에서, 그리고 태평양에서 한 해 동안 끊이지 않는 성공을 거두었다. 알라메인과 토치(Torch)는 튀니지에서 대규모 독일군을 섬멸하는 길을 닦았다. 뒤이어 대단히 성공적인 시칠리아 작전이 있었고, 그다음에는 살레르노의 과감한 상륙작전과 나폴리 점령이 있었다. 그리고 무솔리니의 몰락, 이탈리아의 붕괴, 이탈리아 함대의 항복이 왔다. 전쟁의 역사 전체를 통틀어 연합국이 이토록 오랜 기간 함께 성공을 거둔 일도, 두 동맹국 사이에서 최고 사령부로부터 야전의 병사들에 이르기까지 이만큼 높은 수준의 협력과 전우애가 이어진 일도 없었다. 그러나 우리의 조직을 점검하여 개선의 여지가 있는지 살펴보지 않는다면, 우리는 이 성과들과 앞에 놓인 과업에 [331면]\n\n걸맞지 않은 사람이 될 것이다. 이 정기 회의의 목적이 바로 그것이었다.\n\n지난 한 해의 거의 끊이지 않은 성공과는 대조적으로, 최근 두 달은 일련의 실망을 낳았다. 이탈리아에서는 전역이 시들해졌다. 우리에게는 적을 밀어낼 힘을 줄 만큼의 우세가 충분치 않았다. 날씨는 나빴다. 일부 부대와 상륙정이 지중해에서 떠난 것은 그곳에 남아 싸우는 병사들에게 다소 사기를 떨어뜨리는 영향을 준 듯했다. 전략공군의 증강 또한 진전이 더딘 데 한몫했을 수 있다. 주된 목표는 로마였는데, \"로마를 쥔 자가 이탈리아의 권리증서를 쥐기\" 때문이었다. 로마를 우리 수중에 넣으면 이탈리아 정부는 고개를 들 수 있을 것이었다. 나아가 우리는 북쪽의 비행장들을 장악할 수 있는 위치에 서게 될 것이었다.\n\n그, 총리는 무거운 마음으로나마 지중해 전역에서 7개 사단을 돌려보내는 데 동의했다. 일급 부대인 영국 제50사단과 제51사단은 승선 준비를 위해 장비가 회수된 상태였다. 그사이 미 제3사단은 무려 49일 동안 적과 계속 접촉하고 있었고, 다른 미국·영국 부대들도 오랜 기간 쉬지 못한 채 싸우고 있었다.\n\n아드리아해를 건너 유고슬라비아로 넘어가면 더 큰 골칫거리가 끓어오르고 있었다. 티토(Tito)를 따르는 22만 2천 명에게 해상으로 사실상 아무런 보급도 전달되지 않았다는 것은 개탄스러운 사실이었다. 이 굳센 이들은 영미 연합군이 로마 이남 이탈리아에서 붙들고 있는 것과 맞먹는 수의 독일군을 유고슬라비아에서 붙들고 있었다. 이탈리아 붕괴 후 독일군은 다소 혼란에 빠졌고 애국파는 해안의 넓은 구간을 장악했다. 그러나 우리는 그 기회를 잡지 못했다. 독일군은 회복하여 파르티잔을 조금씩 몰아내고 있었다. 그 주된 이유는 발칸을 가로지르는 인위적인 책임 경계선이었다. 한편으로 이 지역 작전의 책임은 중동 사령부에 있었으나 그들에게는 병력이 없었다. 다른 한편으로 아이젠하워 장군에게는 병력이 있었으나 책임이 없었다. 파르티잔과 애국파가 우리에게 거의 아무런 대가도 치르게 하지 않으면서 그토록 후한 도움을 주었다는 점을 생각하면, 그들의 저항이 유지되어 시들지 않도록 보장하는 일이 대단히 중요했다.\n\n더 동쪽으로 에게해로 가 보면 그림은 마찬가지로 어두웠다. 이탈리아가 무너졌을 때 값싼 전리품이 우리에게 열려 있었고, 윌슨 장군에게는 \"임기응변으로 과감히 하라\"는 명령이 내려졌다. 로도스는 장악하지 못했지만 우리는 코스, 레로스, 사모스와 그 밖의 작은 섬들을 점령했다. 10월에는 로도스를 탈취하기를 바랐으나, [332면]\n\n막상 때가 오자 그 임무에 쓸 수 있는 것은 인도군 1개 사단뿐이었고, 이는 섬에 있는 독일군 8천 명을 몰아내기에 불충분한 병력으로 여겨졌다. 적은 우리의 초기 움직임에 강하게 반응했다. 적은 우리를 섬에서 하나씩 몰아냈고, 마지막으로 레로스를 되찾았는데 우리는 그곳에서 일급 병력 5천 명을 잃고 순양함 4척과 구축함 7척이 격침되거나 손상되었다. 그럼에도 익사한 독일 병사들과 공습 및 전투에서 죽은 자들을 감안하면 어느 쪽도 전투 손실에서 큰 우세를 주장할 수 없었다. 그러나 독일군은 이제 에게해에 다시 자리를 잡았다.\n\n대통령이 말한 대로, 터키의 태도는 이 지역의 앞으로의 사태에 깊은 영향을 미칠 것이었다. 로도스가 다시 우리 손에 들어오고 터키의 비행장을 우리가 쓸 수 있게 되면, 다른 섬들은 적이 지탱할 수 없는 곳이 될 것이었다.\n\n러시아인들이 터키를 참전시키는 일의 중요성에 대해 우리와 같은 견해를 가지기를 바랄 만했다. 그들은 거기서 큰 가능성이 생겨나며 다르다넬스 해협을 통해 보급을 보냄으로써 그들과 손을 잡을 기회가 생긴다는 점을 알아야 했다. 헝가리, 루마니아, 불가리아에 미칠 영향도 깊을 것이었다. 이 모든 일이 꽤 적은 비용으로, 이를테면 2개 사단과 상륙정 몇 척으로 이루어질 수 있을지도 몰랐다. 스탈린 수상과의 회담에서 돌아오는 길에 터키 총리와의 회동을 주선할 수도 있을 것이었다.\n\n이제 동남아시아 전역으로 넘어가면, 최초의 컬버린(Culverin) 작전에는 영국 단독으로 댈 수 있는 것보다 훨씬 많은 함선과 주정이 필요하다는 점이 이제 분명해졌다. 미국 참모총장단이 컬버린이 태평양 전쟁에 대한 최선의 기여라고 본다면 우리의 자원은 미국의 도움으로 메워져야 할 것이었다. 반대로 컬버린의 대가가 너무 크다고 본다면, 동남아시아 전역에서 지중해로 로도스 공격에 충분한 상륙정을 되돌려 오는 편이 나을 수도 있었다. 그러면 순서는 먼저 로마, 다음이 로도스가 될 것이었다.\n\n그, 총리는 영국이 포강 유역으로 진격할 생각은 전혀 없음을 분명히 하고자 했다. 영국의 구상은 이탈리아 전역이 피사–리미니 선이라는 엄격히 제한된 목표를 갖는다는 것이었다. 정규 편성 부대를 유고슬라비아로 보낼 일은 없었다. 그곳에 필요한 것은 넉넉한 보급 꾸러미, 항공 지원, 그리고 어쩌면 소수의 코만도뿐이었다. 애국파에 대한 지원을 이렇게 늘리더라도 우리에게 큰 추가 부담이 생기지는 않을 것이었다. 끝으로, 이탈리아에서 목표에 도달하고 나면 우리가 왼쪽으로 갈지 오른쪽으로 갈지를 결정할 때가 올 것이었다.\n\n[333면]\n\n이제 결정타인 오벌로드로 넘어가서, 총리는 자신이 이 작전에 대한 열의를 조금도 늦추지 않았음을 강조했다. 우리는 상륙작전의 경험에서 매우 큰 이익을 얻었고 우리의 상륙 장비는 몰라볼 만큼 개선되었다. 병력 증강 기간에는 독일군이 우리보다 더 빨리 집결할 수 있는 불안한 시기가 있을 것이었다. 그럼에도 영국군 16개 사단은 부름이 있을 때 준비되어 있을 것이었다. 그가 보기에 작전의 시기는 우리 준비의 완벽함보다는 적의 상태에 더 좌우되는 듯했다. 그는 독일군이 2월까지 수건을 던지지 않는다면 여름 내내 격전을 각오해야 한다는 견해에 동의했다. 그럴 경우 영국군 16개 사단이 우리 기여의 한계라는 점이 인식되어야 할 것이었다. 영국은 인력에 대한 어떠한 추가 요구도 감당할 수 없었으니, 우리 인력은 이미 전쟁 근무에 완전히 투입되어 있었다.\n\n여러 전역을 두루 검토한 뒤, 상호 관계는 다음과 같이 정리되는 듯했다.\n\n오벌로드는 여전히 최우선이지만, 이 작전이 지중해의 다른 모든 활동을 배제해 버리는 폭군이어서는 안 된다. 예컨대 상륙정 운용에 약간의 융통성은 인정되어야 마땅했다. 영국 조선소에 LCT 70척의 추가 건조가 발주되었다. 우리는 이보다 더 잘할 수 있는지 살펴보아야 한다.\n\n알렉산더 장군은 오벌로드용 상륙정의 반환 시기를 12월 중순에서 1월 중순으로 미뤄 달라고 요청했다. 미국과 영국 참모진 사이에서 쟁점이 된 자원은 태평양의 것을 제외하면 전체의 10퍼센트에 지나지 않는 것으로 드러날 공산이 컸다. 분명 어느 정도의 탄력성은 마련될 수 있었다. 그럼에도 그는 우리가 오벌로드에 대해 약해졌거나 식었거나 발을 빼려 한다는 생각을 없애고 싶어 했다. 우리는 여기에 자루 끝까지 박혀 있었다.\n\n요약하면, 그가 주창한 계획은 1월에 로마, 2월에 로도스, 유고슬라비아인들에 대한 보급, 지휘 체제의 정리, 그리고 터키에 대한 접촉의 결과에 따른 에게해의 개방이었으며, 오벌로드를 위한 모든 준비는 앞서 말한 지중해 정책의 틀 안에서 전속력으로 진행한다는 것이었다.\n\n대통령은 독일의 군사적 능력이 달마다 어떤 상태일지 우리가 알 수 없다고 말했다. 러시아의 전진이 현재의 속도로 계속된다면 우리 동맹국은 몇 주 안에 루마니아 국경에 이를 것이었다. 다가오는 회담에서 러시아인들은 그럴 경우 우리가 무엇을 할 작정인지 물을지도 몰랐다. 그들은 우리의 우익과 그들의 좌익을 연결하자고 제안할지도 몰랐다. 우리는 이 물음에 답할 준비가 되어 있어야 했다.\n\n[334면]\n\n러시아인들은 티토를 돕기 위해 아드리아해 북단에서 작전을 벌이자고 제안할지도 몰랐다.\n\n인력 문제로 넘어가, 대통령은 현재 해외와 각자의 본국에 배치된 미국과 영국의 공군 및 지상군 수치를 읽어 주었다.\n\n총리는 히틀러가 끝장난 뒤 우리가 일본을 어떻게 이겨야 할 것인지에 대해 참모진이 많은 생각을 기울여 왔다고 말했다. 그는 이 문제를 풀기로 결심했으며 영국 함대는 이 목적에 가장 크게 기여할 수 있는 곳이라면 어디에든 배치될 것이었다. 공군 증강 또한 검토될 것이었다.\n\n대통령은 일본의 패배가 독일의 패배에 뒤이어 올 것이며 현재 일반적으로 가능하다고 여겨지는 것보다 더 빠를 것이라는, 몰로토프(Molotov) 씨가 밝힌 견해에 자신도 동의한다고 말했다. 총통(장제스, Chiang Kai-shek)은 전날 열린 논의에 매우 만족한 듯했다. **중국이 만주와 조선의 재점령을 포함하는 넓은 열망을 갖고 있다는 데는 의문의 여지가 없었다.**\n\n이어 대통령은 지휘 문제를 언급하며, 자신은 아직도 제한된 기간의 작전을 위해 한 전역에서 다른 전역으로 선박과 항공 부대를 옮겨 달라는 요청을 받고 있다고 말했다. 그가 보기에 런던에서 앙카라에 이르는 우리의 전략공군은 하나의 지휘 아래 있어야 했다. 그는 1918년 포슈(Foch) 원수가 행사한 지휘를 예로 들었다.\n\n총리는 일단 우리가 해협을 건너면 작전 지역에 통합 지휘가 수립될 것이라고 말했다. 그는 대통령이 언급한 결정을 내리는 데 있어 연합참모본부(CCS) 체제가 상당히 만족스럽게 작동해 왔다고 보았다.\n\n총리는 영국에서 출격하는 미국 주간(晝間) 폭격기의 정확성과 효과에 찬사를 보냈다.\n\n대통령과 총리는 참모진에게, 가능하다면 다가오는 러시아와의 회담 전에 합의된 견해에 이르는 것을 목표로, 1944년 유럽 및 지중해 전역에서 수행할 작전의 범위와 시기에 관한 문제들을 검토하도록 요청했다.\n\n**장제스–마셜 오찬 회동, 오후**\n\n참석\n\n| 미국 | 중국 |\n|---|---|\n| 마셜 장군(General Marshall) | 장제스 총통(Generalissimo Chiang) |\n| 스틸웰 중장(Lieutenant General Stilwell) | 장 부인(쑹메이링, Madame Chiang) |\n\n[335면]", "secondary": "November 24, 1943, 11 a.m.\n\nsecret\n\n1. Operations in Europe and the Mediterranean\n\nThe President said that at this meeting he hoped there would be a preliminary survey of operations in the European Theater, including the Mediterranean. Final decisions would depend on the way things went at the conference shortly to be held with Premier Stalin. There were some reports that Premier Stalin had no thoughts beyond Overlord, to which he attached the highest importance as being the only operation worth considering. In other quarters it was held that Premier Stalin was anxious that in addition to Overlord in 1944, the Germans should be given no respite throughout the winter, and that there should be no idle hands between now and Overlord. The logistic problem was whether we could retain Overlord in all its integrity and, at the same time, keep the Mediterranean ablaze. In his view, Premier Stalin would be almost certain to demand both the continuation of action in the Mediterranean, and Overlord. As regards the Eastern Mediterranean, the question arose “where will the Germans go from the Dodecanese.” The answer seemed to be “nowhere.” If the same question was applied to ourselves, the answer seemed to depend on the action of Turkey. The entry of Turkey into the war would put quite a different complexion on the matter. This would be another question for discussion at the meeting with Premier Stalin.\n\nThe Prime Minister said he was in accord with the President’s views. We had had a year of unbroken success in North Africa and the Mediterranean, in Russia, and in the Pacific. Alamein and Torch had paved the way for the extermination of large German forces in Tunisia. This was followed by the highly successful Sicily operation, and subsequently by the daring amphibious landing at Salerno and the capture of Naples. Then came Mussolini’s fall, the collapse of Italy and the capitulation of the Italian Fleet. In the whole history of warfare there had never been such a long period of joint Allied success, nor such a high degree of cooperation and comradeship extending from the High Command down to the troops in the field between two Allies. We should, however, be unworthy of these accomplishments and of the tasks lying ahead if we did not test our [331면] organization to see whether improvements could be made. That was the purpose of these periodical meetings.\n\nAs a contrast to the almost unbroken successes of the past year, the last two months had produced a series of disappointments. In Italy the campaign had flagged. We did not have a sufficient margin of superiority to give us the power to force the enemy back. The weather had been bad. The departure from the Mediterranean of certain units and landing craft had had, it seemed, a rather depressing effect on the soldiers remaining to fight the battle. The build-up of strategic air forces may also have contributed to the slow progress. The main objective was Rome, for “whoever holds Rome holds the title deeds of Italy.” With Rome in our possession, the Italian Government would hold up its head. Moreover, we should then be in a position to seize the landing grounds to the northward.\n\nHe, The Prime Minister, had agreed, but with a heavy heart, to the return of seven divisions from the Mediterranean Theater. The 50th and 51st British Divisions, which were first-class troops, had had their equipment removed in preparation for embarkation. In the meanwhile, the 3rd U. S. Division had been no less than 49 days in constant contact with the enemy, and other U. S. and British units had been fighting without rest for long periods.\n\nPassing across the Adriatic to Yugoslavia, more trouble had brewed up. It was a lamentable fact that virtually no supplies had been conveyed by sea to the 222,000 followers of Tito. These stalwarts were holding as many Germans in Yugoslavia as the combined Anglo-American forces were holding in Italy south of Rome. The Germans had been thrown into some confusion after the collapse of Italy and the Patriots had gained control of large stretches of the coast. We had not, however, seized our opportunity. The Germans had recovered and were driving the Partisans out bit by bit. The main reason for this was the artificial line of responsibility which ran through the Balkans. On the one hand, the responsibility for operations here lay with the Middle East Command but they had not the forces. On the other hand, General Eisenhower had the forces but not the responsibility. Considering that the Partisans and Patriots had given us such a generous measure of assistance at almost no cost to ourselves, it was of high importance to insure that their resistance was maintained and not allowed to flag.\n\nMoving further east to the Aegean, the picture was equally black. When Italy fell, cheap prizes were open to us, and General Wilson had been ordered to “improvise and dare.” Although we had not been able to seize Rhodes we had occupied Kos, Leros, Samos and others of the smaller islands. It had been hoped to capture Rhodes in October, [332면] but when the time came only one Indian division was available for the task, and this was considered an insufficient force to eject the 8,000 Germans in the island. The enemy had reacted strongly to our initial moves. He had ejected us one by one from the islands, ending up with the recapture of Leros where we had lost 5,000 first-class troops, with four cruisers and seven destroyers either sunk or damaged. Nevertheless, taking into account the German soldiers drowned and those killed by air attack and in the battle, neither side could claim any large superiority in battle casualties. The Germans, however, were now re-established in the Aegean.\n\nAs stated by the President, the attitude of Turkey would have a profound effect on future events in this area. With Rhodes once more in our possession and the Turkish airfields at our disposal, the other islands would become untenable for the enemy.\n\nIt was to be hoped that the Russians would share our view of the importance of bringing Turkey into the war. They should see that great possibilities would accrue and a chance to join hands with them by means of sending supplies through the Dardanelles. The effect on Hungary, Rumania and Bulgaria would be profound. All this might be done at quite a small cost, say, two divisions and a few landing craft. It might well be that a meeting with the Turkish Prime Minister could be arranged on the way back from meeting Premier Stalin.\n\nPassing now to the Southeast Asia Theater, it was now clear that First Culverin would require many more ships and craft than the British alone could supply. If it was thought by the United States Chiefs of Staff that Culverin was the best contribution to the Pacific war, then our resources would have to be made up by help from America. If, on the other hand, Culverin was thought to be too costly, it might be better to bring back from the Southeast Asia Theater to the Mediterranean sufficient landing craft for an attack on Rhodes. Thus the sequence would be, first Rome then Rhodes. [주1] He, the Prime Minister, wished to make it clear that the British had no idea of advancing into the Valley of the Po. Their idea was that the campaign in Italy should have the strictly limited objective of the Pisa-Rimini line. No regular formations were to be sent to Yugoslavia. All that was needed there was a generous packet of supplies, air support and, possibly, a few Commandos. This stepping-up of our help to the Patriots would not involve us in a large additional commitment. Finally, when we had reached our objectives in Italy, the time would come to take the decision whether we should move to the left or to the right.\n\n[333면]\n\nTurning now to the knock-out blow, Overlord, The Prime Minister emphasized that he had in no way relaxed his zeal for this operation. We had profited very considerably in our experiences of amphibious operations and our landing appliances had improved out of all knowledge. There would be an anxious period during the build-up, when the Germans might be able to concentrate more quickly than we could. Nevertheless, the 16 British divisions would be ready when called upon. It seemed to him that the timing of the operation depended more on the state of the enemy than on the set perfection of our preparations. He agreed with the view that if the Germans did not throw in the sponge by February we should have to expect heavy fighting throughout the summer. In this event, it would have to be realized that the 16 British divisions were the limit of our contribution. The British could not meet any further calls on our manpower, which was now fully deployed on war service.\n\nAfter reviewing all the various theaters of operations the relationships seemed to work out as follows.\n\nOverlord remained top of the bill, but this operation should not be such a tyrant as to rule out every other activity in the Mediterranean; for example, a little flexibility in the employment of landing craft ought to be conceded. Seventy additional LCT’s had been ordered to be built in British shipyards. We must see if we can do even better than this.\n\nGeneral Alexander had asked that the date of the return of the landing craft for Overlord should be deferred from mid-December to mid-January. The resources which were at issue between the American and British Staffs would probably be found to amount to no more than 10 percent of the whole, excluding those in the Pacific Surely some degree of elasticity could be arranged. Nevertheless, he wished to remove any idea that we had weakened, cooled, or were trying to get out of Overlord. We were in it up to the hilt.\n\nTo sum up, the program he advocated was Rome in January, Rhodes in February, supplies to the Yugoslavs, a settlement of the Command arrangements and the opening of the Aegean, subject to the outcome of an approach to Turkey; all preparations for Overlord to go ahead full steam within the framework of the foregoing policy for the Mediterranean.\n\nThe President said that we could not tell what the state of German military capabilities would be from month to month. The Russian advance, if it continued at its present rate, would bring our ally in a few weeks to the boundaries of Rumania. At the forthcoming conference, the Russians might ask what we intended to do in this event. They might suggest a junction of our right with their left. We should be ready to answer this question.\n\n[334면]\n\nThe Russians might suggest that we stage an operation at the top of the Adriatic with a view to assisting Tito.\n\nTurning to manpower, The President read out the figures for the U. S. and British air and land forces at present disposed overseas and in the respective home countries.\n\nThe Prime Minister said that the staffs had been giving much thought to how we should beat Japan when Hitler was finished. He was determined to solve this problem and the British Fleet would be disposed wherever it could make the best contribution towards this end. The air force build-up would also be studied.\n\nThe President said that he shared the views expressed by Mr. Molotov that the defeat of Japan would follow that of Germany and more rapidly than at present was generally thought possible. It seemed that the Generalissimo had been well satisfied with the discussion held the previous day. There was no doubt that China had wide aspirations which included the re-occupation of Manchuria and Korea.\n\nThe President then referred to the question of Command, remarking that he still received requests for the transfer of shipping and of air forces from one theater to another for a limited period of operations. In his view our strategic air forces from London to Ankara should be under one command. He cited the example of the command which Marshal Foch exercised in 1918.\n\nThe Prime Minister said that once we were across the Channel a united command would be established in the area of operations. He considered that the Combined Chiefs of Staff system had worked reasonably satisfactorily in taking the decision referred to by the President.\n\nThe Prime Minister paid a tribute to the accuracy and effectiveness of the U. S. daylight bombers operating from the United Kingdom.\n\nThe President and Prime Minister invited the staffs to study the problems as to the scope and dates of the operations to be carried out in the European and Mediterranean Theaters in 1944, with a view to arriving at an agreed view, if possible, before the coming meeting with the Russians.\n\nChiang–Marshall luncheon meeting, afternoon\n\nPresent\n\nUnited States China\n\nGeneral Marshall Generalissimo Chiang\n\nLieutenant General Stilwell Madame Chiang\n\n[335면]", "notes": ["[주1] 1943년 11월 21일 처칠이 영국 참모총장단에게 보낸 각서와 비교할 것. Churchill, 686면."], "warn": false, "pages": ["330", "331", "332", "333", "334", "335"], "search": "Franklin D. Roosevelt (The President) 루스벨트 대통령 Winston S. Churchill (The Prime Minister) 처칠 총리 Joseph Stalin (Premier Stalin) 스탈린 수상 Chiang Kai-shek (the Generalissimo) 장제스 총통 Madame Chiang 장 부인(쑹메이링) George C. Marshall 마셜 장군 Joseph W. Stilwell 스틸웰 중장 Dwight D. Eisenhower 아이젠하워 장군 Harold Alexander 알렉산더 장군 Henry Maitland Wilson 윌슨 장군 Josip Broz Tito 티토 Vyacheslav Molotov 몰로토프 Ferdinand Foch 포슈 원수 Benito Mussolini 무솔리니 Adolf Hitler 히틀러 The President (Franklin D. Roosevelt) 대통령(프랭클린 D. 루스벨트) The Prime Minister (Winston S. Churchill) 총리(윈스턴 S. 처칠) United States / China 오찬 회동 참석자 — General Marshall 마셜 장군, Lieutenant General Stilwell 스틸웰 중장, Generalissimo Chiang 장제스 총통, Madame Chiang 장 부인(쑹메이링)"}, {"id": "d288", "order": 288, "date": "1943-11-23", "group": "C", "eyebrow": "d288 · United States Delegation Memorandum  The author of this memorandum was presumably Hopkins. Harriman indicated to the editors in 1956 that Hopkins had handed the paper to him to read; that he had added the sentence at the end; and that he had returned it to Hopkins (023.1/5–256).", "title": "소련 정부의 총통 정권에 대한 태도와 중국 공산당 지원 의도에 관하여 총통이 깊이 우려하고 있다는 보고에 대한 논평", "badge": null, "list_right": "문서 288", "meta": [{"k": "일자", "v": "1943-11-23"}, {"k": "장소", "v": "Cairo", "txt": true}, {"k": "발신", "v": "미국 대표단 각서 — 작성자는 홉킨스(Hopkins)로 추정됨(각주1). 마지막 문장은 해리먼(Harriman)이 손으로 가필", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 288 원문", "url": "https://history.state.gov/historicaldocuments/frus1943CairoTehran/d288"}], "summary": "모스크바에서 관찰된 징후를 근거로 소련 정부의 대중국 의도를 다섯 항목으로 정리한 미국 대표단 각서로, 소련이 4대 강국이 참여하는 어떤 형태의 신탁통치 아래 조선의 독립에 동의하는 것이 그들의 태도와 부합하리라는 관측을 담고 있다.", "points": ["소련 정부의 태도로 보아 4대 강국이 참여하는 어떤 형태의 신탁통치 아래 조선의 독립에 동의하는 것이 그들에게 일관된 일일 것이라고 관측했다. 조선 독립을 신탁통치와 묶어 소련의 동의 가능성을 점친 대목이다.", "다만 부동항(warm water port) 문제에 관한 소련 정부의 태도에 대해서는 아직 아무런 징후가 없다고 적었다.", "소련은 대체로 중국 영토에 대한 야심이 없으며, 최근 신장성에서 철수한 것이 그 근거라고 보았다.", "외몽골 독립 승인은 일본의 진출에 대한 군사적 보호를 위한 것이었다고 해석했다.", "소련은 전후 중국의 국내 평화와 강력한 중앙정부를 원하며, 그 목표는 오직 장제스를 통해서만 달성될 수 있음을 인정하고 있다고 보았다.", "소련은 민주주의 원칙에 입각한 보다 자유주의적인 정책과 사회 조건의 개선을 요구할 것이라고 보았다.", "소련은 중국 공산당 문제의 해결을 원하며, 장제스가 이들을 독립된 정당으로 인정하거나 어떤 방식으로든 정부에 참여시키는 방식을 바란다고 보았다.", "모스크바 주재 중국 대사(푸빙창)도 같은 취지의 견해를 표명했다고 적었다."], "primary": "카이로, 1943년 11월 23일.\n\n**소련 정부의 총통 정권에 대한 태도와 중국 공산당을 지원하려는 의도에 관하여 총통이 깊이 우려하고 있다는 보고에 대한 논평**\n\n모스크바에는 소련 정부가 다음과 같다는 확실한 징후들이 있다.\n\n1. 전후 시기에 중국 내부의 평화와 강력한 중앙정부를 원한다.\n\n2. 이 목표가 오직 총통을 통해서만 달성될 수 있음을 인정한다.\n\n3. 민주주의 원칙에 입각한 보다 자유주의적인 정책과 사회 조건의 개선을 요구할 것이다.\n\n4. 총통이 중국 공산당을 독립된 정당으로 받아들이거나 어떤 방식으로든 그들을 정부에 들어오게 함으로써 중국 공산당 문제가 어떻게든 해결되기를 바란다.\n\n5. 대체로 중국 영토에 관하여 야심을 가지고 있지 않다. 이러한 견해는 그들이 최근 신장성(新疆省)에서 철수한 사실로 뒷받침된다. 외몽골의 독립을 승인한 것은 일본의 진출에 대한 군사적 보호를 위한 것이었다. 부동항 문제에 관한 소련 정부의 태도에 대해서는 아직 아무런 징후가 없으나, 4대 강국이 참여하는 어떤 형태의 신탁통치 아래 조선의 독립에 그들이 동의하는 것은 그들에게 일관된 일일 것이다.\n\n모스크바 주재 중국 대사도 이러한 취지의 견해를 표명한 바 있다.\n\n[377면]", "secondary": "Cairo, November 23, 1943.\n\nComments on Reports That the Generalissimo is Deeply Concerned Over the Soviet Government’s Attitude Toward His Regime and Its Intention To Support the Chinese Communists\n\nIn Moscow there are definite indications that the Soviet Government:\n\n1.\n\nIn the post war period wants peace within China and a strong central government,\n\n2.\n\nRecognizes that this objective can be obtained only through the Generalissimo,\n\n3.\n\nWill insist on a more liberal policy based on democratic principles and improvement in social conditions,\n\n4.\n\nDesires some solution of the Chinese communist problem either by the Generalissimo’s acceptance of them as an independent political [주2] party or by bringing them into the Government in some manner,\n\n5.\n\nDoes not have ambitions in respect to Chinese territory in general. This view is supported by their recent withdrawal from the Province of Sinkiang. The recognition of Outer Mongolia’s independence was for military protection against the Japanese advance. There is no indication yet as to the Soviet Government’s attitude regarding the question of a warm water port, although it would be consistent for them to agree to the independence of Korea under some type of trusteeship in which the four great powers would participate.\n\nThe Chinese Ambassador in Moscow [주3] has expressed opinions along these lines. [주4]\n\n[377면]", "notes": ["[주1] 이 각서의 작성자는 홉킨스(Hopkins)로 추정된다. 해리먼(Harriman)은 1956년 편집자들에게, 홉킨스가 이 문서를 자신에게 읽어보라고 건네주었고, 자신이 끝에 그 문장을 덧붙였으며, 그것을 홉킨스에게 돌려주었다고 밝혔다(023.1/5–256).", "[주2] \"political\"(정당의)이라는 낱말은 손으로 행간에 써 넣은 것이다.", "[주3] 푸빙창(Foo Ping-sheung).", "[주4] 마지막 문장은 해리먼이 손으로 덧붙인 것이다."], "warn": false, "pages": ["376", "377"], "search": "Chiang Kai-shek 장제스 (본문에서는 'the Generalissimo 총통'으로만 지칭) Harry Hopkins 해리 홉킨스 (각주 — 작성자 추정) W. Averell Harriman 애버럴 해리먼 (각주 — 마지막 문장 가필자) Foo Ping-sheung 푸빙창 (각주 — 모스크바 주재 중국 대사)"}, {"id": "d299", "order": 299, "date": "1943-11-24", "group": "C", "eyebrow": "d299 · Memoranda by the Chinese Government  Handed by Wang to Hopkins by direction of Chiang, for transmission to Roosevelt—not as formal proposals but as an indication of the problems which, the Chinese felt, might suitably be discussed, and “as reference material for the committee responsible for the drafting of the communiqué”. This footnote is based on, and the quoted words are taken from, a letter of May 21, 1957, from the Chinese Ambassador at Washington (Tong) to the Historical Office, Department of State (023.1/5–2157). It does not appear that any committee was appointed to draft the communiqué; see post, pp. 399–404.", "title": "중국 정부 각서", "badge": null, "list_right": "문서 299", "meta": [{"k": "일자", "v": "1943-11-24"}, {"k": "장소", "v": "Cairo", "txt": true}, {"k": "발신", "v": "중국 정부 (장제스의 지시로 왕충후이(Wang)가 홉킨스에게 전달)", "txt": true}, {"k": "수신", "v": "루스벨트 대통령 (홉킨스를 통해 전달)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 299 원문", "url": "https://history.state.gov/historicaldocuments/frus1943CairoTehran/d299"}], "summary": "중국 정부가 4대국 이사회 구성, 과도기 국제 안보, 유럽 문제, 극동 문제 및 일본 패전 후 처리에 관해 제시한 각서로, 미·영·중 3국이 전후 조선의 독립을 승인하는 데 합의해야 한다는 항목을 담고 있다.", "points": ["일본 패전 후 처리(IV-C): 중국·영국·미국은 전후 조선의 독립을 승인하는 데 합의해야 하며, 소련이 조선 독립 승인에 관한 이 합의에 가담하는 것은 언제든 환영한다.", "일본 패전 후 처리(IV-D): 일본은 1931년 9월 18일 이후 중국으로부터 취한 모든 영토를 중국에 반환하고, 다롄과 뤼순, 타이완(포모사)과 펑후 제도도 중국에 반환해야 한다.", "국제연합 이사회가 구성되기까지 미국·영국·소련·중국이 가급적 빠른 시일 안에 4대국 이사회를 설치하고, 워싱턴에 상설위원회를 둔다.", "국제연합 이사회 구성에 관해 중국 정부는 미국 정부가 제안한 방안(11개국 집행기구, 4대국이 간부회를 구성)을 지지한다.", "과도기 국제 안보를 위해 4개국이 연합국 군사기술위원회를 설치하고, 전 세계 요충지에 국제 해군·공군 기지를 설치한다.", "유럽 문제에 관한 국제연합 내부의 논의는 즉시 중국 정부에 통보되어야 하며, 독일 항복에 관한 결정에 중국이 참여하도록 초청되어야 한다.", "극동 문제: 중·영·미 3국이 극동위원회를 설치하고, 워싱턴의 기존 영미 참모총장 이사회를 3국 이사회로 확대하거나 대안으로 중미 참모총장 이사회를 설치한다.", "적국 영토와 해방 지역의 군정·민정 권한 배분 원칙, 일본 전쟁 지도자 및 잔학 행위 책임자 처벌 계획, 중국 내 일본인 재산 및 상선대 접수 등을 제안한다."], "primary": "[카이로, 1943년 11월 24일.]\n\n## 4대국 이사회 또는 국제연합 이사회의 설치\n\n**I.**\n\n국제연합(United Nations) 이사회가 구성되기까지, 미국·영국·소련(U. S. S. R.)·중국은 4개국 선언[주2]과 관련된 문제들을 논의하기 위한 4대국 이사회를 가능한 한 이른 시일 안에 설치하여야 한다.\n\n**II.**\n\n이사회는 워싱턴에 상설위원회를 둔다. 위원회는 필요에 따라 런던, 충칭 또는 모스크바에서 회의를 열 수 있다.\n\n**III.**\n\n이사회는 국제연합 이사회를 조직할 임무를 맡는다.\n\n**IV.**\n\n국제연합 이사회의 조직에 관하여, 중국 정부는 미국 정부가 제안한 방안[주3]을 지지한다. 즉, 국제연합 중 11개국이 집행기구를 구성하고, 미국·영국·소련·중국이 간부회(Presidium)로서 활동한다.\n\n## 과도기의 국제 안보\n\n**I.**\n\n미국·영국·소련·중국은 국제 안보의 조직과 유지에 관한 모든 군사 문제를 검토하기 위하여 연합국 군사기술위원회(Inter-Allied Military Technical Commission)를 설치하여야 한다.\n\n**II.**\n\n국제 안보를 성공적으로 조직하고 유지하기 위하여 일정한 수의 국제 해군 및 공군 기지가 설치될 것이다. 그러한 기지는 전 세계의 전략적 요충지에 두어야 하며, 그 선정은 전문가들의 의견에 근거하고 그러한 기지가 놓일 국가의 동의를 받아야 한다.\n\n[388면]\n\n## 유럽 문제와 독일의 항복\n\n국제연합 사이의 유럽 문제에 관한 모든 논의는 즉시 중국 정부에 통보되어야 한다. 독일의 항복에 관한 어떠한 결정에도 중국이 참여하도록 초청되어야 한다.\n\n## 극동에 관한 문제\n\n**I. 극동위원회의 구성.**\n\n중국·영국·미국은 극동에서 전쟁이 진행됨에 따라 발생하는 정치 문제에 관한 공동 협의를 원활히 하기 위하여 극동위원회를 설치하여야 한다. 소련이 이 위원회에 참여하는 것은 언제든 환영한다.\n\n**II. 통합 지휘의 창설.**\n\n극동의 적에 대한 국제연합의 전쟁에서 전략과 지휘를 통일하기 위하여, 워싱턴에 있는 기존의 영미 참모총장 이사회(Anglo-American Council of Chiefs-of-Staff)를 3자 이사회, 곧 중국·미국·영국의 참모총장 이사회로 확대하여야 한다. 또는 그 대안으로, 극동의 중국군과 미군을 지휘하기 위한 중미 참모총장 이사회를 설치하여야 한다.\n\n**III. 연합국 점령 이후 적국 영토 및 적국이 보유하던 영토의 행정.**\n\n(A)\n\n적국의 영토를 점령하면 점령군이 군정 및 민정의 권한을 행사한다. 다만 점령군이 중국군도 영국군도 미국군도 아닌 경우에는, 해당 영토에 관한 모든 정치 문제는 특별히 설치되는 공동 이사회에서 해결하며, 그 이사회에서는 중국·영국·미국이 해당 영토에 군대를 두고 있지 않더라도 그 영토의 통제를 위하여 온전히 참여한다.\n\n(B)\n\n중국·영국 또는 미국의 영토 중 어느 부분이 해방되면, 군정의 권한은 점령군이 행사하고, 민정의 권한은 해당 영토에 대하여 정당하게 주권을 가진 국가가 행사한다. 군정과 민정 양쪽에 걸리는 사안은 점령군과 해당 국가의 민정 행정기관 사이의 협의로 해결한다.\n\n(C)\n\n그 밖의 국제연합 영토 중 어느 부분이 해방되면, 군정의 권한은 [389면] 점령군이 행사하고, 민정의 권한은 해당 영토에 대하여 정당하게 주권을 가진 국가가 행사하되, 다만 점령군의 통제를 받는다. (달리 말하면, 중국은 유럽의 해방 지역 행정에 관하여 영국과 미국이 제안한 방안을 지지한다.)\n\n**IV. 일본이 패전한 뒤의 처리.**\n\n(A)\n\n중국·영국·미국은 일본이 패전한 뒤 일본을 다루기 위한 일정한 지도 원칙에 합의하여야 한다 — 패전한 이탈리아를 다루는 문제에 관하여 모스크바 3국 회의[주4]에서 채택된 것과 유사한 원칙이다.\n\n(B)\n\n중국·영국·미국은 일본에서 전쟁에 책임이 있는 지도자들과 전쟁 중 자행된 잔학 행위에 책임이 있는 일본 군대의 장교 및 병사들을 처벌하기 위한 계획에 합의하여야 한다 — 나치 전범의 처벌을 위하여 모스크바 3국 회의에서 채택된 것[주5]과 유사한 계획이다.\n\n(C)\n\n**중국·영국·미국은 전쟁 후 조선의 독립을 승인하는 데 합의하여야 한다. 조선의 독립 승인에 관한 이 합의에 소련이 가담하는 것은 언제든 환영한다.**\n\n(D)\n\n일본은 1931년 9월 18일 이래 중국으로부터 취한 모든 영토를 중국에 반환하여야 한다. 일본은 또한 다롄과 뤼순, 그리고 타이완(포모사)과 펑후 제도를 중국에 반환하여야 한다.\n\n(E)\n\n태평양의 영토에 관한 문제들을 처리하기 위하여, 중국·영국·미국은 일정한 기본 원칙에 합의하고 아울러 이들 문제의 처리를 위한 권고를 하도록 전문가 위원회를 설치하여야 한다. 그러한 위원회가 설치되지 않을 경우, 그 임무는 설치가 예정된 극동위원회가 맡는다.\n\n(F)\n\n중국 내의 모든 일본인 재산은 사유·공유를 막론하고, 그리고 일본의 상선대는, 전쟁에서 중국 정부와 인민이 입은 손실에 대한 부분적 배상으로서 중국 정부가 접수한다. 전쟁 후 극동의 평화 유지를 위하여, 적대행위가 끝난 시점에 남아 있을 수 있는 일본의 탄약과 전쟁 물자, 군함과 항공기는 중국·미국·영국의 참모총장 공동 이사회, 또는 그 대안으로 설치가 예정된 극동위원회의 처분에 맡긴다.\n\n[390면]", "secondary": "[Cairo, November 24, 1943.]\n\nEstablishment of a Four-Power Council or a Council of the United Nations\n\nI.\n\nPending the formation of a Council of the United Nations, the United States, Great Britain, the U. S. S. R., and China should establish at the earliest practicable date a Four-Power Council for the discussion of questions connected with the Four-Power Declaration. [주2]\n\nII.\n\nThe Council shall maintain a Permanent Standing Committee in Washington. The Committee may, as occasion arises, hold meetings in London, Chungking, or Moscow.\n\nIII.\n\nThe Council is charged with the duty of organizing a Council of the United Nations.\n\nIV.\n\nAs regards the organization of the Council of the United Nations, the Chinese Government endorses the proposed scheme of the Government of the United States: viz., Eleven of the United Nations shall form an executive body, with the United States, Great Britain, the U. S. S. R., and China acting as a Presidium. [주3]\n\nInternational Security During the Period of Transition\n\nI.\n\nThe United States, Great Britain, the U. S. S. R., and China should establish an Inter-Allied Military Technical Commission to consider all military questions concerning the organization and maintenance of international security.\n\nII.\n\nFor the successful organization and maintenance of international security, a certain number of International Naval and Air Bases will be established. Such Bases should be located at strategic points all over the world, the selection of which should be based upon the opinion of experts and subject to the consent of the States wherein such Bases are to be situated.\n\n[388면]\n\nEuropean Questions and the Surrender of Germany\n\nAny discussion on European questions among the United Nations should be communicated forthwith to the Chinese Government. China should be invited to participate in any decision concerning the surrender of Germany.\n\nQuestions Relating to the Far East\n\nI. Formation of a Far Eastern Committee.\n\nChina, Great Britain, and the United States should set up a Far Eastern Committee to facilitate joint consultation on political problems arising from the progress of the war in the Far East. The participation of the U. S. S. R. in this Committee is welcomed at any time.\n\nII. Creation of a Unified Command.\n\nWith a view to unifying the strategy and direction of the war of the United Nations against the enemy in the Far East, the existing Anglo-American Council of Chiefs-of-Staff in Washington should be enlarged to be a tripartite council, that is, a Council of Chiefs-of-Staff of China, the United States, and Great Britain; or in the alternative, a Sino-American Council of Chiefs-of-Staff should be established for the direction of the Chinese and American forces in the Far East.\n\nIII. Administration of Enemy Territory and Enemy-held Territories following Allied Occupation.\n\n(A)\n\nOn the occupation of the territory of the enemy, the army of occupation shall exercise the powers of military and civil administration. However, if the army of occupation should be neither Chinese nor British nor American, then all political problems concerning the said territory shall be settled by a specially created Joint Council, wherein China, Great Britain, and the United States, even though without an army in the said territory, shall fully participate for the control of the said territory.\n\n(B)\n\nOn the liberation of any part of the territory of China, Great Britain, or the United States, the powers of military administration shall be exercised by the army of occupation; and the powers of civil administration, by the State which rightfully has sovereignty over the territory in question. Matters touching on both the military and the civil administration shall be settled by consultation between the army of occupation and the civil administrative organ of the said State.\n\n(C)\n\nOn the liberation of any part of the territory of other United Nations, the powers of military administration shall be exercised by [389면] the army of occupation; and the powers of civil administration, by the State which rightfully has sovereignty over the territory in question, subject, however, to the control of the army of occupation. (In other words, China endorses the proposed scheme of Great Britain and the United States regarding the administration of liberated territories in Europe. [주4] )\n\nIV. Settlement with Japan upon Her Defeat.\n\n(A)\n\nChina, Great Britain, and the United States should agree upon certain guiding principles for the treatment of Japan after her defeat—principles similar to those adopted by the Tripartite Conference in Moscow regarding the treatment of defeated Italy.\n\n(B)\n\nChina, Great Britain, and the United States should agree upon a program for the punishment of the leaders in Japan responsible for the war and of the officers and men of the Japanese armed forces responsible for the atrocities perpetrated during the war,—a program similar to the one adopted by the Tripartite Conference in Moscow for the punishment of Nazi war criminals. [주5]\n\n(C)\n\nChina, Great Britain, and the United States should agree to recognize the independence of Korea after the war. The adherence of the U. S. S. R. to this agreement for the recognition of Korea’s independence is welcomed at any time.\n\n(D)\n\nJapan shall restore to China all the territories she has taken from China since September 18, 1931. Japan shall also return Dairen and Port Arthur, and Formosa and the Pescadores Islands to China.\n\n(E)\n\nFor the settlement of questions relating to territories in the Pacific, China, Great Britain, and the United States should agree upon certain basic principles and also establish a Committee of Experts to make recommendations for the settlement of these questions. If such a Committee is not established, its work shall be undertaken by the projected Far Eastern Committee.\n\n(F)\n\nAll Japanese property in China, private as well as public, and the Japanese mercantile fleet shall be taken over by the Chinese Government as indemnification in part for the losses sustained by the Chinese Government and people in the war. For the maintenance of peace in the Far East after the war, Japan’s ammunition and war materials, her war vessels and her aircraft, which may still remain at the end of hostilities, shall be placed at the disposal of the Joint Council of Chiefs-of-Staff of China, the United States, and Great Britain, or in the alternative, of the projected Far Eastern Committee.\n\n[390면]", "notes": ["[주1] 장제스의 지시에 따라 왕(Wang)이 홉킨스에게 건네어 루스벨트에게 전달하도록 한 것이다. 정식 제안으로서가 아니라, 중국 측이 보기에 논의하기에 적합할 문제들을 제시한 것이며, 또한 \"코뮈니케 기초를 맡은 위원회를 위한 참고 자료로서\" 건네졌다. 이 각주는 1957년 5월 21일 주(駐)워싱턴 중국 대사(둥)가 국무부 역사실에 보낸 서한에 근거한 것이며, 인용된 문구도 그 서한에서 취한 것이다(023.1/5–2157). 코뮈니케를 기초하기 위한 위원회가 임명되었던 것으로는 보이지 않는다. 뒤의 399–404면을 보라.", "[주2] 1943년 10월 30일 모스크바 회의에서 서명되고 11월 1일에 발표된 「일반적 안전보장에 관한 4개국 선언」의 본문은 Decade, 11면을 보라.", "[주3] 그 \"제안된 방안\"은 1943년 7월 14일자 「국제기구 헌장 초안」을 반영한 것으로 보인다. Notter, 473면을 보라.", "[주4] 앞의 382면 각주 4를 보라.", "[주5] 「독일의 잔학 행위에 관한 선언」, 1943년 11월 1일. Decade, 13면."], "warn": false, "pages": ["387", "388", "389", "390"], "search": "Chiang Kai-shek 장제스 Hopkins 홉킨스 Roosevelt 루스벨트 Wang 왕 Tong 둥"}, {"id": "d307", "order": 307, "date": "1943-11-25", "group": "A", "eyebrow": "d307 · American Draft of the Communiqué, With Amendments by the President’s Special Assistant (Hopkins)  The draft as typed is the same as the draft submitted to Roosevelt (supra) except for the addition, on a separate sheet, of the last three paragraphs naming the conference participants. The handwritten amendments by Hopkins were made prior to the revised version of November 25, 1943 (infra).", "title": "미국 측 코뮈니케 초안 — 대통령 특별보좌관 홉킨스의 수정 포함", "badge": null, "list_right": "문서 307", "meta": [{"k": "일자", "v": "1943-11-25"}, {"k": "장소", "v": "Cairo", "txt": true}, {"k": "발신", "v": "미국 대표단 (대통령 특별보좌관 홉킨스(Harry Hopkins)의 가필이 들어간 타자 원고)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "코뮈니케 초안"}], "links": [{"k": "FRUS", "text": "문서 307 원문", "url": "https://history.state.gov/historicaldocuments/frus1943CairoTehran/d307"}], "summary": "카이로 회담 발표용 미국 측 코뮈니케 최초 타자 초안으로, 조선이 \"일본 패망 후 가능한 한 가장 이른 시점에\" 자유롭고 독립된 나라가 되어야 한다고 규정한 판본이다.", "points": ["조선 조항: 일본에 의한 조선 인민의 \"배신적 노예화\"를 상기하며, 조선이 \"일본 패망 후 가능한 한 가장 이른 시점에(at the earliest possible moment after the downfall of Japan)\" 자유롭고 독립된 나라가 되도록 결의한다고 적었다. 이는 뒤이은 수정안 d308의 \"적절한 시점에(at the proper moment)\", 영국 초안 d309와 최종본 d343의 \"적절한 절차를 거쳐(in due course)\"보다 훨씬 이른 시점을 못박은 표현이다.", "일본이 점령한 태평양 도서는 일본으로부터 영구히 박탈한다.", "만주·타이완(포모사)처럼 일본이 중국인으로부터 훔친 영토는 중화민국에 반환한다.", "루스벨트·장제스·처칠과 각국 군 수뇌가 \"아프리카 어딘가\"에서 회담을 마쳤다고만 밝히고 장소를 특정하지 않는다.", "대일 공세 계획의 세부는 공개하지 않으며, 세 나라는 일본의 무조건 항복을 받아낼 때까지 함께 싸우기로 서약했다고 밝힌다.", "장제스가 부인 장 부인(쑹메이링)을 대동했고 그가 여러 회의에 참석했다는 대목이 들어 있다(d308에서는 참석 언급이 삭제된다).", "각주에 홉킨스의 여백 가필 \"all conquered\", \"violence & greed\", 그리고 \"일본은 위임통치령에 더해 과거와 현재의 모든 정복지를 포기해야 한다\"는 문장이 기록되어 있다. 이 가필들이 d308 본문에 반영된다."], "primary": "1943년 11월 25일\n\n코뮈니케 초안\n\n루스벨트(Franklin D. Roosevelt) 대통령, 총통 장제스(Chiang Kai-shek), 그리고 처칠(Winston Churchill) 총리는 각자의 군 수뇌들과 함께 아프리카 어딘가에서 회담을 마쳤다. 여러 군사 사절단은 중국과 동남아시아로부터 일본을 겨냥해 수행할 향후 군사 작전에 합의하였다. 그 계획들은, 세부는 공개할 수 없으나, 일본에 대한 맹렬한 공세를 규정하고 있다. 우리는 바다와 육지와 하늘에서 우리의 잔학한 적에게 가차 없는 압박을 가할 것을 결의한다. 이 압박은 이미 진행 중이다. 이 지역에서 벌일 우리 합동 공세의 시기와 장소와 규모는 지금은 공개할 수 없으나, 일본은 그 위력을 알게 될 것이다.\n\n우리는 일본이 점령한 태평양의 도서들 — 그 다수는 그것들을 군사화하지 않겠다는 일본의 명시적이고 명확한 서약에 반하여 강력한 기지로 만들어졌다 — 이 일본으로부터 영원히 박탈될 것임을 결의하며, 그들이 만주와 타이완(포모사)처럼 중국인으로부터 그토록 배신적으로 훔쳐 간 영토는 당연히 중화민국에 반환될 것이다. 우리는 일본에 의한 조선 인민의 배신적 노예화를 유념하고 있으며, 그 나라가 일본 패망 후 가능한 한 가장 이른 시점에 자유롭고 독립된 나라가 될 것임을 결의한다.\n\n우리는 일본의 패배가 격렬하고 단호한 전투를 요구하리라는 것을 충분히 알고 있다. 우리 세 나라는 일본의 무조건 항복을 받아낼 때까지 함께 싸울 것을 서약하였다.\n\n총통은 부인 장 부인(쑹메이링, Madam Chiang Kai-shek)을 대동하였으며, 그는 총통과 함께 우리 군 수뇌들과의 여러 회의에 참석하였다.\n\n[402면]\n\n회담에는 미국을 대표하여 다음 인사가 참석하였다:\n\n윌리엄 D. 리히(William D. Leahy) 제독; 조지 C. 마셜(George C. Marshall) 대장; 어니스트 J. 킹(Ernest J. King) 제독; H. H. 아널드(H. H. Arnold) 대장; B. B. 서머벨(B. B. Somervell) 중장; 에드윈 M. 왓슨(Edwin M. Watson) 소장; 윌슨 브라운(Wilson Brown) 소장(해군); 로스 매킨타이어(Ross McIntire) 소장(해군); 해리 홉킨스(Harry Hopkins) 씨; W. 애버렐 해리먼(W. Averell Harriman) 대사; J. G. 위넌트(J. G. Winant) 대사; L. 더글러스(L. Douglas) 씨; J. J. 매클로이(J. J. McCloy) 씨.\n\n영국 측 대표는 다음과 같다: 앨런 브룩(Alan Brooke) 대장; 찰스 포털(Charles Portal) 공군원수; A. 커닝엄(A. Cunningham) 제독; 레더스(Leathers) 경; 헤이스팅스 이즈메이(Hastings Ismay) 중장.\n\n중국 사절단에는 다음이 포함되었다: 상전(Shang Chen) 장군; 왕충후이(Wang Chung-hui) 박사; 양쉬안청(Yang Hsuan-chen [Hsuan-ch'eng]) 해군 중장; 저우즈러우(Chow [Chou] Chih-jou) 중장.", "secondary": "November 25, 1943\n\nDraft of Communiqué\n\nPresident Roosevelt, Generalissimo Chiang Kai-shek, and Prime Minister Churchill, and their respective military leaders, have completed a conference somewhere in Africa. The several military missions have agreed upon future military operations directed against Japan from China and Southeast Asia. The plans, the details of which cannot be disclosed, provide for vigorous offensives against the Japanese. We are determined to bring unrelenting pressure against our brutal enemy by sea, land, and air. This pressure is already underway. The time, place, and scope of our joint offensives in this area cannot now be disclosed, but Japan will know of their power.\n\nWe are determined that the islands in the Pacific which have been occupied by the Japanese, many of them made powerful bases contrary to Japan’s specific and definite pledge not to so militarize them, will be taken from Japan forever, and the territory [주2] they have [주3] so treacherously stolen from the [주4] Chinese, such as Manchuria and Formosa, will of course be returned to the Republic of China. We are mindful of the treacherous enslavement of the people of Korea by Japan, and are determined that that country, at the earliest possible moment after the downfall of Japan, shall become a free and independent country.\n\nWe know full well that the defeat of Japan is going to require fierce and determined fighting. Our three countries are pledged to fight together until we have received the unconditional surrender of Japan.\n\nThe Generalissimo was accompanied by his wife, Madam Chiang Kai-shek, who took part with the Generalissimo in several of the conferences with our military leaders. [주5]\n\n[402면]\n\nThe conference was attended on behalf of the United States by: Admiral William D. Leahy; General George C. Marshall; Admiral Ernest J. King; General H. H. Arnold; Lt. General B. B. Somervell; Major General Edwin M. Watson; Rear Admiral Wilson Brown; Rear Admiral Ross McIntire; Mr. Harry Hopkins; Ambassador W. Averell Harriman; Ambassador J. G. Winant; [주6] Mr. L. Douglas; Mr. J. J. McCloy.\n\nBritish representatives were: General Sir Alan Brooke; Air Chief Marshal Sir Charles Portal; Admiral Sir A. Cunningham; Lord Leathers; Lt. General Sir Hastings Ismay.\n\nThe Chinese mission included: [주7] General Shang Chen; Dr. Wang Chung-hui; Vice Admiral Yang Hsuan-chen [Hsuan-ch’eng]; and Lt. General Chow [Chou] Chih-jou.", "notes": ["[주1] 타자된 이 초안은 루스벨트에게 제출된 초안(앞 문서)과 동일하되, 별지에 회담 참석자를 열거한 마지막 세 단락이 추가된 점만 다르다. 홉킨스의 수기 수정은 1943년 11월 25일자 수정본(뒤 문서)이 만들어지기 전에 이루어졌다.", "[주2] 여백의 이 대목 근처에, 아마도 \"영토 … 훔쳐 간(territory … stolen)\"이라는 구절과 결부시키려는 의도로 \"all conquered(정복된 모든 것)\"라는 말과 \"violence & greed(폭력과 탐욕)\"라는 말이 적혀 있다. 이 두 어군은 모두 홉킨스의 필적이다.", "[주3] 이 대목에 홉킨스는 \"occupied belonging to the Dutch(네덜란드령으로서 점령된)\"라는 말을 삽입하였다.", "[주4] 이 대목에 \"Dutch and the(네덜란드와)\"라는 말이 삽입되었는데, 필적은 확인되지 않았다.", "[주5] 이 말들은 홉킨스가 삭제한 것으로 보인다. 이 문장 아래에 홉킨스의 필적으로 다음의 말이 적혀 있다: \"우리는 일본이 위임통치령에 더하여 과거와 현재의 모든 정복지를 포기할 것을 결의한다.\"", "[주6] 이 대목에 홉킨스는 \"Steinhardt(스타인하트)\"라는 이름을 추가하였다.", "[주7] 이 대목에 \"amongst others(그 밖에도)\"라는 말이 홉킨스의 필적으로 추가되었다."], "warn": false, "pages": ["401", "402"], "search": "Franklin D. Roosevelt 루스벨트 Chiang Kai-shek 장제스 Winston Churchill 처칠 Madam Chiang Kai-shek 장 부인(쑹메이링) Harry Hopkins 홉킨스 William D. Leahy 리히 George C. Marshall 마셜 Ernest J. King 킹 H. H. Arnold 아널드 B. B. Somervell 서머벨 Edwin M. Watson 왓슨 Wilson Brown 윌슨 브라운 Ross McIntire 매킨타이어 W. Averell Harriman 해리먼 J. G. Winant 위넌트 L. Douglas 더글러스 J. J. McCloy 매클로이 Alan Brooke 앨런 브룩 Charles Portal 포털 A. Cunningham 커닝엄 Lord Leathers 레더스 경 Hastings Ismay 이즈메이 Shang Chen 상전 Wang Chung-hui 왕충후이 Yang Hsuan-ch'eng 양쉬안청 Chou Chih-jou 저우즈러우 Steinhardt 스타인하트 (각주에만 등장)"}, {"id": "d308", "order": 308, "date": "1943-11-25", "group": "A", "eyebrow": "d308 · Revised American Draft of the Communiqué  This revised draft was dictated by Hopkins to Warrant Officer Cornelius on the morning of November 25, 1943 (letter from Albert M. Cornelius to the Historical Office of the Department of State, 023.1/3–257). A typewritten notation on one of the carbon copies of this draft reads “11/25/43 edition”.", "title": "미국 측 코뮈니케 수정 초안", "badge": null, "list_right": "문서 308", "meta": [{"k": "일자", "v": "1943-11-25"}, {"k": "장소", "v": "Cairo", "txt": true}, {"k": "발신", "v": "대통령 특별보좌관 홉킨스(Harry Hopkins) — 코닐리어스(Cornelius) 준위에게 구술", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "코뮈니케 초안"}], "links": [{"k": "FRUS", "text": "문서 308 원문", "url": "https://history.state.gov/historicaldocuments/frus1943CairoTehran/d308"}], "summary": "홉킨스가 구술한 미국 측 코뮈니케 수정 초안으로, 조선 독립 시점이 앞선 초안 d307의 \"가능한 한 가장 이른 시점\"에서 \"적절한 시점\"으로 바뀐 판본이다.", "points": ["조선 조항: 조선이 \"일본 패망 후 적절한 시점에(at the proper moment after the downfall of Japan)\" 자유롭고 독립된 나라가 되도록 결의한다고 적었다. 앞선 초안 d307의 \"가능한 한 가장 이른 시점에(at the earliest possible moment)\"에서 시점 규정이 눈에 띄게 느슨해졌다.", "d307에서 홉킨스가 여백에 적어 두었던 \"violence & greed\"가 본문에 편입되어, \"일본이 폭력과 탐욕으로 빼앗은 모든 정복 영토는 그들의 손아귀에서 해방될 것\"이라는 문장이 새로 들어갔다.", "3국 정상의 발표가 인용부호로 묶인 \"공동성명(joint statement)\" 형식으로 재구성되어, 발표 형식이 정리되었다.", "태평양 도서 박탈, 만주·타이완(포모사) 반환 조항이 각각 별개의 단락으로 분리되었다.", "d307의 \"vigorous offensives\"가 \"continuous and increasingly vigorous offensives(지속적이고 갈수록 맹렬한 공세)\"로 강화되었다.", "d307에 있던 \"이 지역에서 벌일 합동 공세의 시기·장소·규모는 공개할 수 없다\"는 문장이 삭제되었다.", "장 부인(쑹메이링)이 회의에 참석했다는 언급이 삭제되고 동행 사실만 남았다. 미국 참석자 명단에는 스타인하트(Steinhardt) 대사가 추가되었고, 중국 사절단에는 \"그 밖에도(among others)\"가 붙었다. 모두 d307 각주에 기록된 홉킨스의 가필이 반영된 결과다.", "\"Our three countries\"가 \"Our countries\"로 바뀌었다."], "primary": "1943년 11월 25일\n\n코뮈니케 초안.\n\n루스벨트(Franklin D. Roosevelt) 대통령, 총통 장제스(Chiang Kai-shek), 그리고 처칠(Winston Churchill) 총리는 각자의 군 수뇌들과 함께 아프리카 어딘가에서 회담을 마쳤다. 이들은 다음의 공동성명을 발표하였다:\n\n\"여러 군사 사절단은 중국과 동남아시아로부터 일본을 겨냥해 수행할 향후 군사 작전에 합의하였다. 그 계획들은, 세부는 공개할 수 없으나, 일본에 대한 지속적이고 갈수록 맹렬한 공세를 규정하고 있다. 우리는 바다와 육지와 하늘에서 우리의 잔학한 적에게 [403면] 가차 없는 압박을 가할 것을 결의한다. 이 압박은 이미 진행 중이다. 일본은 그 위력을 알게 될 것이다.\n\n\"우리는 일본이 점령한 태평양의 도서들 — 그 다수는 그것들을 군사화하지 않겠다는 일본의 명시적이고 명확한 서약에 반하여 강력한 기지로 만들어졌다 — 이 일본으로부터 영원히 박탈될 것임을 결의한다.\n\n\"일본이 만주와 타이완(포모사)처럼 중국인으로부터 그토록 배신적으로 훔쳐 간 영토는 당연히 중화민국에 반환될 것이다. 일본인이 폭력과 탐욕으로 빼앗은 모든 정복 영토는 그들의 손아귀에서 해방될 것이다.\n\n\"우리는 일본에 의한 조선 인민의 배신적 노예화를 유념하고 있으며, 그 나라가 일본 패망 후 적절한 시점에 자유롭고 독립된 나라가 될 것임을 결의한다.\n\n\"우리는 일본의 패배가 격렬하고 단호한 전투를 요구하리라는 것을 충분히 알고 있다. 우리 나라들은 일본의 무조건 항복을 받아낼 때까지 함께 싸울 것을 서약하였다.\"\n\n총통은 부인 장 부인(쑹메이링, Madam Chiang Kai-shek)을 대동하였다.\n\n회담에는 미국을 대표하여 다음 인사가 참석하였다: 윌리엄 D. 리히(William D. Leahy) 제독; 조지 C. 마셜(George C. Marshall) 대장; 어니스트 J. 킹(Ernest J. King) 제독; H. H. 아널드(H. H. Arnold) 대장; B. B. 서머벨(B. B. Somervell) 중장; 에드윈 M. 왓슨(Edwin M. Watson) 소장; 윌슨 브라운(Wilson Brown) 소장(해군); 로스 매킨타이어(Ross McIntire) 소장(해군); 해리 홉킨스(Harry Hopkins) 씨; W. 애버렐 해리먼(W. Averell Harriman) 대사; J. G. 위넌트(J. G. Winant) 대사; 스타인하트(Steinhardt) 대사; L. 더글러스(L. Douglas) 씨; J. J. 매클로이(J. J. McCloy) 씨.\n\n영국 측 대표는 앨런 브룩(Alan Brooke) 대장; 찰스 포털(Charles Portal) 공군원수; A. 커닝엄(A. Cunningham) 제독; 레더스(Leathers) 경; 헤이스팅스 이즈메이(Hastings Ismay) 중장이었다.\n\n중국 사절단에는 그 밖에도 상전(Shang Chen) 장군; 왕충후이(Wang Chung-hui) 박사; 양쉬안청(Yang Hsuan-chen [Hsuan-ch'eng]) 해군 중장; 저우즈러우(Chow [Chou] Chih-jou) 중장이 포함되었다.\n\n[404면]", "secondary": "November 25, 1943\n\nDraft of Communiqué.\n\nPresident Roosevelt, Generalissimo Chiang Kai-shek, and Prime Minister Churchill, and their respective military leaders, have completed a conference somewhere in Africa. They issued the following joint statement:\n\n“The several military missions have agreed upon future military operations directed against Japan from China and Southeast Asia. The plans, the details of which cannot be disclosed, provide for continuous and increasingly vigorous offensives against the Japanese. We are determined to bring unrelenting pressure against our brutal enemy [403면] by sea, land, and air. This pressure is already underway. Japan will know of its power.\n\n“We are determined that the islands in the Pacific which have been occupied by the Japanese, many of them made powerful bases contrary to Japan’s specific and definite pledge not to militarize them, will be taken from Japan forever.\n\n“The territory that Japan has so treacherously stolen from the Chinese, such as Manchuria and Formosa, will of course be returned to the Republic of China. All of the conquered territory taken by violence and greed by the Japanese will be freed from their clutches.\n\n“We are mindful of the treacherous enslavement of the people of Korea by Japan, and are determined that that country, at the proper moment after the downfall of Japan, shall become a free and independent country.\n\n“We know full well that the defeat of Japan is going to require fierce and determined fighting. Our countries are pledged to fight together until we have received the unconditional surrender of Japan.”\n\nThe Generalissimo was accompanied by his wife, Madam Chiang Kai-shek.\n\nThe conference was attended on behalf of the United States by Admiral William D. Leahy; General George C. Marshall; Admiral Ernest J. King; General H. H. Arnold; Lt. General B. B. Somervell; Major General Edwin M. Watson; Rear Admiral Wilson Brown; Rear Admiral Ross McIntire; Mr. Harry Hopkins; Ambassador W. Averell Harriman; Ambassador J. G. Winant; Ambassador Steinhardt; Mr. L. Douglas; Mr. J. J. McCloy.\n\nBritish representatives were General Sir Alan Brooke; Air Chief Marshal Sir Charles Portal; Admiral Sir A. Cunningham; Lord Leathers; Lt. General Sir Hastings Ismay.\n\nThe Chinese mission included, among others, General Shang Chen; Dr. Wang Chung-hui; Vice Admiral Yang Hsuan-chen [Hsuan-ch’eng]; and Lt. General Chow [Chou] Chih-jou.\n\n[404면]", "notes": ["[주1] 이 수정 초안은 1943년 11월 25일 오전에 홉킨스가 코닐리어스(Cornelius) 준위에게 구술한 것이다(앨버트 M. 코닐리어스가 국무부 역사국에 보낸 서한, 023.1/3–257). 이 초안의 먹지 사본 하나에는 \"11/25/43 edition(1943년 11월 25일판)\"이라는 타자 표기가 적혀 있다."], "warn": false, "pages": ["402", "403", "404"], "search": "Franklin D. Roosevelt 루스벨트 Chiang Kai-shek 장제스 Winston Churchill 처칠 Madam Chiang Kai-shek 장 부인(쑹메이링) Harry Hopkins 홉킨스 William D. Leahy 리히 George C. Marshall 마셜 Ernest J. King 킹 H. H. Arnold 아널드 B. B. Somervell 서머벨 Edwin M. Watson 왓슨 Wilson Brown 윌슨 브라운 Ross McIntire 매킨타이어 W. Averell Harriman 해리먼 J. G. Winant 위넌트 Steinhardt 스타인하트 L. Douglas 더글러스 J. J. McCloy 매클로이 Alan Brooke 앨런 브룩 Charles Portal 포털 A. Cunningham 커닝엄 Lord Leathers 레더스 경 Hastings Ismay 이즈메이 Shang Chen 상전 Wang Chung-hui 왕충후이 Yang Hsuan-ch'eng 양쉬안청 Chou Chih-jou 저우즈러우 Albert M. Cornelius 코닐리어스 (각주에만 등장)"}, {"id": "d309", "order": 309, "date": "1943-11-25", "group": "A", "eyebrow": "d309 · British Draft of the Communiqué  The handwriting appears to be that of Churchill. Date and authorship not indicated, but the text as amended is very similar to the final version printed post, p. 448.", "title": "영국 측 코뮈니케 초안", "badge": null, "list_right": "문서 309", "meta": [{"k": "일자", "v": "1943-11-25"}, {"k": "장소", "v": "10 Downing Street, Whitehall (런던)", "txt": true}, {"k": "발신", "v": "영국 측 (필적은 처칠의 것으로 보임)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "코뮈니케 초안"}], "links": [{"k": "FRUS", "text": "문서 309 원문", "url": "https://history.state.gov/historicaldocuments/frus1943CairoTehran/d309"}], "summary": "카이로 회담 공동 코뮈니케의 영국 측 초안으로, 조선 관련 문구에 \"in due course\"(적절한 절차를 거쳐)가 처음 등장한다.", "points": ["조선 조항이 \"the aforesaid three Great Powers, mindful of the enslavement of the people of Korea, are determined that in due course Korea shall become free and independent\"로 되어 있다. 미국 초안(d307)의 `at the earliest possible moment after the downfall of Japan`, 미국 수정안(d308)의 `at the proper moment after the downfall of Japan`이 여기서 `in due course`(적절한 절차를 거쳐)로 바뀌었다.", "이 `in due course` 문구가 그대로 최종 코뮈니케(d343)에 들어간다.", "일본이 1914년 제1차 세계대전 개시 이후 탈취·점령한 태평양의 모든 도서를 박탈한다는 조항.", "일본이 중국인으로부터 훔친 만주, 타이완(포모사) 등 모든 영토를 중화민국에 반환한다는 조항이다. 최종본에 있는 \"펑후 제도(the Pescadores)\"가 아직 들어 있지 않고, \"such as Manchuria Formosa\"로 쉼표도 빠져 있다.", "최종본의 \"세 대국은 스스로를 위한 이득을 탐하지 않으며 영토 확장의 뜻이 없다\"는 대목이 이 초안에는 아직 없다.", "마지막 문단이 \"in harmony with the United Nations\"로만 되어 있어, 최종본의 \"in harmony with those of the United Nations at war with Japan\"(일본과 교전 중인 국제연합 제국과 보조를 맞추어)보다 범위가 넓게 잡혀 있다.", "일본의 무조건 항복(unconditional surrender)을 얻어내기 위한 작전을 계속한다는 결의."], "primary": "1943년 11월 25일\n\n다우닝가 10번지,\n\n화이트홀.\n\n**보도 코뮈니케**\n\n루스벨트 대통령, 장제스(Chiang Kai-shek) 총통, 처칠 총리는 각자의 군사·외교 고문들과 함께 북아프리카에서 회의를 마쳤다. 다음의 일반 성명이 발표되었다:\n\n\"여러 군사 사절단은 일본에 대한 향후 군사 작전에 합의하였다. 세 대(大)연합국은 그 흉포한 적들에게 해상·육상·공중에서 가차 없는 압력을 가하겠다는 결의를 표명하였다. 이 압력은 이미 높아지고 있다.\n\n일본이 1914년 제1차 세계대전 개시 이래 탈취하였거나 점령한 태평양의 모든 도서를 박탈당하도록 하고, 또 일본이 중국인으로부터 훔친 만주 타이완(포모사)과 같은 모든 영토를 중화민국에 반환하도록 하는 것이 그들의 목적이다. 일본은 또한 폭력과 탐욕으로 취한 그 밖의 모든 영토로부터 축출될 것이다. 앞서 말한 세 대국은 조선 인민의 노예 상태에 유의하여, **적절한 절차를 거쳐 조선을 자유롭고 독립된 나라가 되게 할 것을 결의한다**.\n\n이러한 목적을 염두에 두고 세 연합국은 국제연합(United Nations)과 보조를 맞추어, 일본의 무조건 항복을 얻어내는 데 필요한 중대하고도 장기적인 작전을 계속 견지해 나갈 것이다.\"\n\n[405면]", "secondary": "November 25, 1943\n\n10, Downing Street,\n\nWhitehall.\n\nPRESS COMMUNIQUÉ\n\nPresident Roosevelt, Generalissimo Chiang Kai-shek and Prime Minister Churchill, together with their respective military and diplomatic advisers, have completed a conference in North Africa. The following general statement was issued:\n\n“The several military missions have agreed upon future military operations against Japan. The three great Allies expressed their resolve to bring unrelenting pressure against their brutal enemies by sea, land and air. This pressure is already rising.\n\nIt is their purpose that Japan shall be stripped of all the islands in the Pacific which she has seized or occupied since the beginning of the first World War in 1914, and that all the territories Japan has stolen from the Chinese, such as Manchuria Formosa, shall be restored to the Republic of China. Japan will also be expelled from all other territories which she has taken by violence ad greed. The aforesaid three Great Powers, mindful of the enslavement of the people of Korea, are determined that in due course Korea shall become free and independent.\n\nWith these objects in views the three Allies, in harmony with the United Nations, will continue to persevere in the serious and prolonged operations necessary to procure the unconditional surrender of Japan.”\n\n[405면]", "notes": ["[주1] 필적은 처칠의 것으로 보인다. 날짜와 작성자는 표시되어 있지 않으나, 수정된 상태의 본문은 뒤의 448면에 인쇄된 최종본과 매우 유사하다."], "warn": false, "pages": ["404", "405"], "search": "Roosevelt 루스벨트 Chiang Kai-shek 장제스 Churchill 처칠"}, {"id": "d343", "order": 343, "date": "1943-11-26", "group": "A", "eyebrow": "d343 · Final Text of the Communiqué  This is the agreed text as it was given by Hopkins to Kirk on the afternoon of November 26, 1943; see the memorandum by Kirk, infra. For earlier drafts of the communiqué, see ante, pp. 399–404. The communiqué, was released to the press by the White House on December 1, 1943, and was printed, with slight editorial variations, in the Department of State Bulletin, vol. ix, December 4, 1943, p. 393.", "title": "코뮈니케 최종 확정본", "badge": null, "list_right": "문서 343", "meta": [{"k": "일자", "v": "1943-11-26"}, {"k": "장소", "v": "Cairo", "txt": true}, {"k": "발신", "v": "미국·영국·중화민국 3국 (합의 본문)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "코뮈니케 확정본"}], "links": [{"k": "FRUS", "text": "문서 343 원문", "url": "https://history.state.gov/historicaldocuments/frus1943CairoTehran/d343"}], "summary": "카이로 회담의 최종 공동 코뮈니케(카이로 선언) 확정 본문으로, \"적절한 절차를 거쳐 조선을 자유롭고 독립된 나라가 되게 한다\"는 조항이 확정되었다.", "points": ["조선 조항이 \"The aforesaid three great powers, mindful of the enslavement of the people of Korea, are determined that in due course Korea shall become free and independent.\"로 확정되었다. `in due course`(적절한 절차를 거쳐)가 영국 초안(d309)에서 그대로 살아남았다.", "일본은 1914년 제1차 세계대전 개시 이래 탈취·점령한 태평양의 모든 도서를 박탈당한다.", "일본이 중국인으로부터 훔친 만주, 타이완(포모사), 펑후 제도를 중화민국에 반환한다. 초안(d309)에 없던 \"펑후 제도\"가 여기서 추가되었다.", "일본은 폭력과 탐욕으로 취한 그 밖의 모든 영토에서 축출된다.", "3국은 \"스스로를 위한 이득을 탐하지 않으며 영토 확장의 뜻이 없다\"고 명기했다. 영국 초안에는 없던 문단이 최종본에 들어왔다.", "3국은 일본의 침략을 억제·처벌하기 위해 이 전쟁을 수행한다고 밝힌다.", "일본의 무조건 항복을 얻어낼 때까지 \"일본과 교전 중인 국제연합 제국\"과 보조를 맞추어 작전을 계속한다."], "primary": "1943년 11월 26일\n\n**보도 코뮈니케**\n\n루스벨트 대통령, 장제스(Chiang Kai-Shek) 총통, 처칠 총리는 각자의 군사·외교 고문들과 함께 북아프리카에서 회의를 마쳤다. 다음의 일반 성명이 발표되었다:\n\n\"여러 군사 사절단은 일본에 대한 향후 군사 작전에 합의하였다. 세 대(大)연합국은 그 흉포한 적들에게 해상·육상·공중에서 가차 없는 압력을 가하겠다는 결의를 표명하였다. 이 압력은 이미 높아지고 있다.\n\n\"세 대연합국은 일본의 침략을 억제하고 처벌하기 위하여 이 전쟁을 수행하고 있다. 그들은 스스로를 위한 아무런 이득도 탐하지 않으며 영토 확장의 뜻도 없다. 일본이 1914년 제1차 세계대전 개시 이래 탈취하였거나 점령한 태평양의 모든 도서를 박탈당하도록 하고, 또 일본이 중국인으로부터 훔친 만주, 타이완(포모사), 펑후 제도와 같은 모든 영토를 중화민국에 반환하도록 하는 것이 그들의 목적이다. 일본은 또한 폭력과 탐욕으로 취한 [449면] 그 밖의 모든 영토로부터 축출될 것이다. 앞서 말한 세 대국은 조선 인민의 노예 상태에 유의하여, **적절한 절차를 거쳐 조선을 자유롭고 독립된 나라가 되게 할 것을 결의한다**.\n\n\"이러한 목적을 염두에 두고 세 연합국은 일본과 교전 중인 국제연합(United Nations) 제국과 보조를 맞추어, 일본의 무조건 항복을 얻어내는 데 필요한 중대하고도 장기적인 작전을 계속 견지해 나갈 것이다.\"", "secondary": "November 26, 1943\n\nPress Communiqué\n\nPresident Roosevelt, Generalissimo Chiang Kai-Shek and Prime Minister Churchill, together with their respective military and diplomatic advisers, have completed a conference in North Africa. The following general statement was issued:\n\n“The several military missions have agreed upon future military operations against Japan. The three great Allies expressed their resolve to bring unrelenting pressure against their brutal enemies by sea, land and air. This pressure is already rising.\n\n“The three great Allies are fighting this war to restrain and punish the aggression of Japan. They covet no gain for themselves and have no thought of territorial expansion. It is their purpose that Japan shall be stripped of all the islands in the Pacific which she has seized or occupied since the beginning of the first World War in 1914, and that all the territories Japan has stolen from the Chinese, such as Manchuria, Formosa, and the Pescadores, shall be restored to the Republic of China. Japan will also be expelled from all other territories [449면] which she has taken by violence and greed. The aforesaid three great powers, mindful of the enslavement of the people of Korea, are determined that in due course Korea shall become free and independent.\n\n“With these objects in view the three Allies, in harmony with those of the United Nations at war with Japan, will continue to persevere in the serious and prolonged operations necessary to procure the unconditional surrender of Japan.”", "notes": ["[주1] 이것은 1943년 11월 26일 오후 홉킨스가 커크(Kirk)에게 건넨 합의 본문이다. 바로 아래의 커크 비망록을 보라. 코뮈니케의 이전 초안들에 대해서는 앞의 399–404면을 보라. 이 코뮈니케는 1943년 12월 1일 백악관에 의해 언론에 공표되었고, 약간의 편집상 이문(異文)과 함께 『국무부 회보(Department of State Bulletin)』 제9권, 1943년 12월 4일자, 393면에 인쇄되었다."], "warn": false, "pages": ["448", "449"], "search": "Roosevelt 루스벨트 Chiang Kai-shek 장제스 Churchill 처칠 Hopkins 홉킨스 Kirk 커크"}, {"id": "d371", "order": 371, "date": "1943-11-30", "group": "B", "eyebrow": "d371 · Bohlen Minutes", "title": "볼렌 회의록", "badge": "secret", "list_right": "문서 371", "meta": [{"k": "일자", "v": "1943-11-30"}, {"k": "장소", "v": "Tehran", "txt": true}, {"k": "발신", "v": "볼렌(Charles E. Bohlen) 작성 회의록", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": "Franklin D. Roosevelt 루스벨트 대통령, Joseph Stalin 스탈린 원수, Winston Churchill 처칠 총리, (문서 말미에 별도로 기재된 홉킨스–이든–몰로토프 오찬 회동 참석자) Harry Hopkins 홉킨스 (미국), Anthony Eden 이든 외무장관 (영국), Vyacheslav Molotov 몰로토프 외무인민위원 (소련), Captain Ware 웨어 대위 (미국), Captain Lunghi 룽기 대위 (영국), Mr. Pavlov 파블로프 (소련)", "txt": true, "wide": true}, {"k": "종류", "v": "회의록"}], "links": [{"k": "FRUS", "text": "문서 371 원문", "url": "https://history.state.gov/historicaldocuments/frus1943CairoTehran/d371"}], "summary": "1943년 11월 30일 테헤란에서 열린 루스벨트·스탈린·처칠 오찬 회동 기록으로, 스탈린이 카이로 코뮈니케 전체를 승인하며 조선은 독립해야 하고 만주·타이완(포모사)·펑후 제도는 중국에 반환되어야 한다고 말한 대목이 담겨 있다.", "points": ["스탈린은 카이로 극동 코뮈니케 초안을 읽었으며, 아무런 약속도 할 수 없으나 그 코뮈니케와 그 모든 내용을 전적으로 승인한다고 답했다. 그는 \"조선은 독립해야 하는 것이 옳다(it was right that Korea should be independent)\"고 말했다.", "스탈린은 이어서 만주·타이완(포모사)·펑후 제도가 중국에 반환되어야 한다고 말했으나, 중국인은 지금까지 싸우지 않았으니 싸우도록 만들어야 한다고 덧붙였다.", "처칠과 루스벨트는 스탈린의 견해에 동의를 표했다. 조선 독립에 3국 정상이 구두로 합의한 대목이다.", "처칠이 스탈린에게 코뮈니케 열람 여부를 물은 것은 소련 정부의 극동 구상과 그곳 부동항 문제에 관한 견해를 알아내려는 의도였다고 스스로 밝혔다.", "스탈린은 극동에서 러시아가 무엇을 얻을 수 있는지 물었으나, 소련이 극동 전쟁에 실제로 참전하는 시점까지 기다리는 편이 나을 것이라며 구체적 논의를 미뤘다.", "블라디보스토크는 부분적으로만 부동항이고 일본이 통제하는 해협에 막혀 있으며, 러시아의 유일한 부동항은 무르만스크뿐이라고 스탈린이 지적했다.", "루스벨트가 극동에도 자유항 구상을 적용할 수 있다며 다롄(Dairen)을 가능성으로 언급했고, 국제적 보장 아래 두는 방안을 제시했다.", "처칠은 대통령이 읽어 준 영미 연합참모부 권고안(오찬 전)에 스탈린이 크게 만족을 표했고, 붉은 군대도 동시에 공세 작전을 펴겠다고 밝혔다고 기록한다. 오버로드 최고사령관은 3~4일 내에 지명될 예정이라 했다.", "남프랑스 작전은 오버로드 최고사령관 지휘 아래, 이탈리아 작전은 지중해 전구 최고사령관 지휘 아래 둔다는 데 의견이 모였다.", "다르다넬스 해협 체제 완화, 발트해 접근로(브레멘·함부르크·뤼베크 자유지대화, 킬 운하 국제관리) 문제가 논의되었다.", "이날 오후 4시 30분 짧은 회의를 끝으로 전체회의는 종료하고, 이튿날 오후 4시에 정상 3인과 이든·몰로토프·홉킨스가 정치 문제(폴란드·핀란드·스웨덴)를 논의하기로 결정했다."], "primary": "1943년 11월 30일 오후 1시 30분\n\n극비(secret)\n\n오찬에 앞서, 총리의 요청으로 대통령은 스탈린(Joseph Stalin) 원수에게 영미 연합참모부의 권고안을 읽어 주었다. 이 권고안은 대통령 자신과 총리가 승인한 것이었다.\n\n스탈린 원수는 이 결정에 대해 커다란 만족을 표하였다. 그는 붉은 군대도 같은 시기에 공세 작전을 수행할 것이며, 이 결정에 부여하는 가치를 그 행동으로 보여 주겠다고 덧붙였다. 그는 최고사령관이 언제 지명되느냐고 물었다.\n\n대통령은 자신의 참모진과 협의해야 하지만, 최고사령관은 사나흘 안에, 다시 말해 자신과 총리가 카이로로 돌아간 직후에 지명될 것이라고 확신한다고 말했다. 대통령은 지휘권에 관하여 처칠(Winston Churchill) 씨와 논의해야 했던 문제가 여럿 있었다고 말했다. 그는 오버로드(Overlord)의 최고사령관은 잉글랜드에서 지휘하게 될 것이고, 지중해 지역을 맡을 최고사령관이 따로 있을 것이라고 덧붙였다. 그리고 한 가지 문제는 남프랑스에서의 작전이 누구의 지휘 아래 들어가느냐 하는 것이었다.\n\n[566면]\n\n이 대목에서 총리가 끼어들어, 남프랑스에서의 작전은 오버로드 최고사령관 아래 두어야 하지만, 프랑스에서의 작전과 맞물리도록 강화되어야 하는 이탈리아에서의 작전은 지중해 전구 최고사령관 아래 두어야 한다고 말했다.\n\n스탈린 원수는 이 구상에 동의를 표하며, 그것이 건전한 군사 원칙이라고 말했다.\n\n오찬의 다음 대목에서는 총리가 스탈린 원수에게 카이로 회담의 극동에 관한 코뮈니케 안을 읽어 보았느냐고 물을 때까지 일반적인 대화가 오갔다.\n\n스탈린 원수는 읽어 보았으며, 아무런 약속도 할 수 없으나 그 코뮈니케와 그 모든 내용을 전적으로 승인한다고 답하였다. 그는 조선은 독립해야 하는 것이 옳으며, 만주와 타이완(포모사)과 펑후 제도는 중국에 반환되어야 한다고 말하였다. 그러나 그는 중국인은 지금까지 싸우지 않았으니 싸우도록 만들어야 한다고 덧붙였다.\n\n총리와 대통령은 스탈린 원수의 견해에 동의를 표하였다.\n\n소련의 광대한 크기에 관하여 얼마간 논의가 오간 뒤 — 그 과정에서 스탈린 원수는 러시아가 그토록 광대한 영토를 갖고 있지 않았더라면 독일이 아마 승리를 거두었을 것이라고 솔직히 인정하였다 — 총리는 러시아와 같은 거대한 대륙 덩어리는 부동항 접근권을 가질 자격이 있다고 생각한다고 말했다. 그는 그 문제가 당연히 평화 처리의 일부를 이룰 것이라고 말하며, 그것이 우호적으로, 친구들 사이에서처럼 해결될 수 있으리라고 언급하였다.\n\n스탈린 원수는 적절한 때에 그 문제를 논의할 수 있겠으나, 처칠 씨가 문제를 꺼냈으니 다르다넬스 해협 체제에 관하여 물어보고 싶다고 답하였다. 그는 잉글랜드가 더 이상 반대하지 않으므로 그 체제를 완화하는 것이 좋겠다고 말하였다.\n\n총리는 잉글랜드가 이제 러시아의 부동항 접근에 아무런 이의가 없다고 답하면서, 다만 과거에는 이의가 있었음을 인정하였다. 그러나 그는 우리 모두가 터키를 참전시키려 애쓰고 있는 지금 해협에 관하여 무언가를 하는 것이 과연 바람직한지 의문을 제기하였다.\n\n스탈린 원수는 그 문제를 서두를 필요는 없으며, 다만 여기서 일반적으로 논의해 보는 데 관심이 있을 뿐이라고 말하였다.\n\n[567면]\n\n총리는 대영제국은 이 정당한 문제에 아무런 이의가 없으며, 나아가 우리 모두 러시아의 함대가, 해군 함대든 상선대든, 세계의 모든 바다에 나오는 것을 보기를 바란다고 답하였다.\n\n스탈린 원수는 커즌(Curzon) 경은 생각이 달랐다고 말하였다.\n\n총리는 그것은 사실이며, 그 시절 러시아와 잉글랜드가 서로 견해를 같이하지 않았음을 부인해 봐야 소용없다고 답하였다.\n\n스탈린 원수는 그 시절에는 러시아도 아주 달랐다고 답하였다.\n\n대통령은 앞서 스탈린 원수와 논의한 바 있는 발트해 접근로 문제로 돌아갔다. 그는 옛 한자 도시인 브레멘, 함부르크, 뤼베크를 일종의 자유지대로 만들고, 킬 운하는 국제 관리와 보장 아래 두어 세계 상업에 통항의 자유를 주는 구상이 마음에 든다고 말하였다.\n\n스탈린 원수는 그것이 좋은 구상이라고 생각한다고 말한 뒤, 극동에서는 러시아를 위해 무엇을 할 수 있겠느냐고 물었다.\n\n총리는 바로 그런 이유로 카이로 코뮈니케에 관한 원수의 견해를 듣게 되어 특히 기뻤다고 답하였다. 극동에 관한, 그리고 그곳 부동항 문제에 관한 소련 정부의 견해를 알아내는 데 관심이 있었기 때문이다.\n\n스탈린 원수는 물론 러시아인들에게도 견해가 있으나, 러시아인이 극동 전쟁에 적극적으로 참여하게 될 때를 기다리는 편이 아마 나을 것이라고 답하였다. 그러나 그는 극동에는 막혀 있지 않은 항구가 하나도 없으며, 블라디보스토크도 일부만 부동(不凍)일 뿐 그나마 일본이 통제하는 해협에 가로막혀 있다고 덧붙였다.\n\n대통령은 자유항 구상을 극동에도 적용할 수 있으리라 생각한다고 말하며, 다롄(Dairen)을 하나의 가능성으로 언급하였다.\n\n스탈린 원수는 중국인이 그런 구상을 좋아하지 않으리라 생각한다고 말하였다.\n\n이에 대통령은 그들이 국제적 보장 아래 두는 자유항 구상은 좋아하리라고 생각한다고 답하였다.\n\n스탈린 원수는 그것이라면 나쁘지 않겠다고 말하며, 캄차카의 페트로파블롭스크는 훌륭한 항구이고 부동항이지만 철도 연결이 없다고 덧붙였다. 그는 이와 관련하여 일반적으로, 러시아에는 부동항이 무르만스크 하나뿐이라고 지적하였다.\n\n[568면]\n\n이어 총리는 전후 세계를 통치할, 그리고 전후 세계의 방향을 맡게 될 나라들이 만족해하며 아무런 영토적 야심이나 그 밖의 야심을 갖지 않는 것이 중요하다고 말하였다. 그 문제가 강대국들에게 흡족한 방식으로 해결될 수 있다면 세계는 참으로 평화롭게 남을 수 있으리라고 그는 느꼈다. 그는 굶주린 나라와 야심에 찬 나라는 위험하며, 세계의 주요한 나라들이 부유하고 행복한 사람의 처지에 있는 것을 보고 싶다고 말하였다.\n\n대통령과 스탈린 원수는 동의하였다.\n\n그러고 나서, 오늘 오후 4시 30분의 짧은 회의를 끝으로 회담의 전체회의는 더 이상 열지 않되, 내일 4시에 대통령과 스탈린 원수와 총리가 이든(Anthony Eden) 씨, 몰로토프(Vyacheslav Molotov) 씨, 홉킨스(Harry Hopkins) 씨와 함께 만나 정치 문제를 논의하기로 결정되었으며, 논의 가능한 주제로 폴란드, 핀란드, 스웨덴이 거론되었다.\n\n홉킨스–이든–몰로토프 오찬 회동, 오후 1시 30분\n\n참석자\n\n| 미국 | 영국 | 소련 |\n|---|---|---|\n| 홉킨스 씨 | 이든 외무장관 | 몰로토프 외무인민위원 |\n| 웨어(Ware) 대위 | 룽기(Lunghi) 대위 | 파블로프(Pavlov) 씨 |", "secondary": "November 30, 1943, 1:30 p.m.\n\nsecret\n\nBefore luncheon, at the Prime Minister’s request, The President read to Marshal Stalin the recommendations of the combined British and American Staffs, [주2] which had been approved by himself and the Prime Minister.\n\nMarshal Stalin expressed his great satisfaction with this decision. He added that the Red Army would at the same time undertake offensive operations, and would demonstrate by its actions the value it placed on this decision. He asked when the Commander in Chief would be named.\n\nThe President said he had to consult with his Staff, but that he was sure that the Commander in Chief would be named in three or four days or, in other words, immediately following his return, and that of the Prime Minister, to Cairo. The President said that there were a number of questions in regard to command which he had had to discuss with Mr. Churchill. He added that the Commander in Chief of Overlord would operate from England, and that there would be a Commander in Chief for the Mediterranean area. And one question was, under whose command the operations in Southern France would fall.\n\n[566면]\n\nAt this point The Prime Minister interrupted to say that the operations in Southern France should be under the Commander in Chief of Overlord, but the operations in Italy, which must be intensified to coordinate with the operations in France, would be under the Commander in Chief of the Mediterranean theater.\n\nMarshal Stalin expressed agreement with this idea, and said it was sound military doctrine.\n\nFor the next part of the luncheon the conversation was general, until The Prime Minister asked Marshal Stalin whether he had read the proposed communiqué on the Far East of the Cairo conference. [주3]\n\nMarshal Stalin replied that he had and that although he could make no commitments he thoroughly approved the communiqué and all its contents. He said it was right that Korea should be independent, and that Manchuria, Formosa and the Pescadores Islands should be, returned to China. He added, however, that the Chinese must be made to fight, which they had not thus far done.\n\nThe Prime Minister and The President expressed agreement with Marshal Stalin’s views.\n\nAfter some discussion of the great size of the Soviet Union, during which Marshal Stalin admitted frankly that had Russia not had at her disposal such a vast territory the Germans would have probably won the victory, The Prime Minister said that he felt that such a large land mass as Russia deserved the access to warm water ports. He said that the question would of course form part of the peace settlement, and he observed that it could be settled agreeably and as between friends.\n\nMarshal Stalin replied that at the proper time that question could be discussed, but that since Mr. Churchill had raised the question he would like to inquire as to the regime of the Dardanelles. [주4] He said that since England no longer objected, it would be well to relax that regime.\n\nThe Prime Minister replied that England had now no objections to Russia’s access to warm water ports, although he admitted that in the past she had. He questioned, however, the advisability of doing anything about the Straits at the time, as we were all trying to get Turkey to enter the war.\n\nMarshal Stalin said there was no need to hurry about that question, but that he was merely interested in discussing it here in general.\n\n[567면]\n\nThe Prime Minister replied that Great Britain saw no objections to this legitimate question, and that furthermore we all hoped to see Russian fleets, both naval and merchant, on all seas of the world.\n\nMarshal Stalin said that Lord Curzon had had other ideas.\n\nThe Prime Minister replied that that was true, and that it would be idle to deny that in those days Russia and England did not see eye to eye.\n\nMarshal Stalin replied that Russia also was quite different in those days.\n\nThe President reverted to the question of the approaches to the Baltic Sea, which he had previously discussed with Marshal Stalin. [주5] He said he liked the idea of establishing the former Hanseatic cities of Bremen, Hamburg and Lubeck into some form of a free zone, with the Kiel Canal put under international control and guaranty, with freedom of passage for the world’s commerce.\n\nMarshal Stalin said he thought that that was a good idea, and then asked what could be done for Russia in the Far East.\n\nThe Prime Minister replied that it was for this reason that he had been particularly glad to hear the Marshal’s views on the Cairo communiqué, since he was interested to find out the views of the Soviet government on the Far East and the question of warm water ports there.\n\nMarshal Stalin replied that of course the Russians had their views, but that it would perhaps be better to await the time when the Russians would be taking an active representation in the Far Eastern war. [주6] He added, however, that there was no port in the Far East that was not closed off, since Vladivostok was only partly ice-free, and besides covered by Japanese controlled Straits.\n\nThe President said he thought the idea of a free port might be applied to the Far East besides, and mentioned Dairen as a possibility.\n\nMarshal Stalin said he did not think that the Chinese would like such a scheme.\n\nTo which The President replied that he thought they would like the idea of a free port under international guaranty. [주7]\n\nMarshal Stalin said that that would not be bad, and added that Petropavlovsk or [on?] Kamchatka was an excellent port, and ice-free, but with no rail connections. He pointed out in this general connection that Russia had only one ice-free port, that of Murmansk. [주8]\n\n[568면]\n\nThe Prime Minister then said that it was important that the nations who would govern the world after the war, and who would be entrusted with the direction of the world after the war, should be satisfied and have no territorial or other ambitions. If that question could be settled in a manner agreeable to the great powers, he felt then that the world might indeed remain at peace. He said that hungry nations and ambitious nations are dangerous, and he would like to see the leading nations of the world in the position of rich, happy men.\n\nThe President and Marshal Stalin agreed.\n\nIt was then decided that after a short session this afternoon at 4:30 [주9] there would be no more full sessions of the conference, but at 4:00 o’clock tomorrow the President, Marshal Stalin and the Prime Minister, together with Mr. Eden, Mr. Molotov and Mr. Hopkins, would meet to discuss political matters, and reference was made to Poland, Finland and Sweden as possible subjects of discussion. [주10]\n\nHopkins–Eden–Molotov luncheon meeting, 1:30 p.m.\n\nPresent\n\nUnited States United Kingdom Soviet Union\n\nMr. Hopkins Foreign Secretary Eden Foreign Commissar Molotov\n\nCaptain Ware Captain Lunghi Mr. Pavlov", "notes": ["[주2] 앞의 563면을 보라.", "[주3] 앞의 448면.", "[주4] 1936년 7월 20일 해협 체제에 관한 몽트뢰 협약의 본문은 British Cmd. 5249, Turkey No. 1 (1936) 또는 League of Nations Treaty Series 제173권 213면을 보라. The Problem of the Turkish Straits (워싱턴: 미국 정부인쇄국, 1947) 25면에도 수록되어 있다.", "[주5] 앞의 510면을 보라.", "[주6] Foreign Relations, The Conferences at Malta and Yalta, 1945, 361–400면, 894–897면, 984면을 보라.", "[주7] 그 전주에 열린 제1차 카이로 회담에서 장제스와 이 문제를 논의한 것에 관하여는 앞의 324면, 367면을 보라.", "[주8] 1944년에 해리먼이 이 논의를 언급한 것에 관하여는 Foreign Relations, The Conferences at Malta and Yalta, 1945, 378면을 보라.", "[주9] 오후 4시에 시작된 제3차 전체회의의 회의록은 뒤의 576면을 보라.", "[주10] 1943년 12월 1일 오후에 열린 3국 특별 정치회의의 회의록은 뒤의 596면을 보라."], "warn": false, "pages": ["565", "566", "567", "568"], "search": "Franklin D. Roosevelt 루스벨트 Joseph Stalin 스탈린 Winston Churchill 처칠 Charles E. Bohlen 볼렌 (회의록 작성자) Anthony Eden 이든 Vyacheslav Molotov 몰로토프 Harry Hopkins 홉킨스 Lord Curzon 커즌 경 Captain Ware 웨어 대위 Captain Lunghi 룽기 대위 Pavlov 파블로프 Chiang Kai-shek 장제스 (각주에만 등장) W. Averell Harriman 해리먼 (각주에만 등장) Franklin D. Roosevelt 루스벨트 대통령 Joseph Stalin 스탈린 원수 Winston Churchill 처칠 총리 (문서 말미에 별도로 기재된 홉킨스–이든–몰로토프 오찬 회동 참석자) Harry Hopkins 홉킨스 (미국) Anthony Eden 이든 외무장관 (영국) Vyacheslav Molotov 몰로토프 외무인민위원 (소련) Captain Ware 웨어 대위 (미국) Captain Lunghi 룽기 대위 (영국) Mr. Pavlov 파블로프 (소련)"}, {"id": "d470", "order": 470, "date": "1943-12-03", "group": "C", "eyebrow": "d470 · Memorandum by the United States Chiefs of Staff", "title": "연합참모본부 문서 397호(수정) — 1944년 일본 격파를 위한 개별 작전", "badge": "secret", "list_right": "문서 470", "meta": [{"k": "일자", "v": "1943-12-03"}, {"k": "장소", "v": "Cairo", "txt": true}, {"k": "발신", "v": "연합참모본부(CCS, Combined Chiefs of Staff) — 문서번호 C. C. S. 397 (Revised). 미·영 합동 문서이며 미국 합동참모본부(JCS) 단독 문서가 아니다.", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 470 원문", "url": "https://history.state.gov/historicaldocuments/frus1943CairoTehran/d470"}], "summary": "1944년 중 일본의 무조건 항복을 강요하기 위한 전역별(북태평양·중부/남/남서태평양·중국·동남아시아) 작전 계획과 목표 일정, 그리고 소련 참전과 독일의 조기 패배에 대비한 계획 준비를 규정한 연합참모본부 각서로, 각주에서 폭격 목표가 되는 일본의 「내권(inner zone)」에 조선이 포함된다고 정의한다.", "points": ["**조선은 본문이 아니라 각주에 나온다.** 제7항에서 청두 전진기지의 초장거리 폭격 목표로 지목한 일본의 「내권(inner zone)」이 무엇인지를 원문 각주 [주*]가 정의하는데, 그 목록이 \"일본 본토, 만주, **조선**, 북중국, 가라후토(일본령 사할린), 타이완(포모사)\"이다. 즉 연합참모본부는 조선을 일본 제국의 핵심 권역(공격 대상이 되는 전략 구역)의 일부로 분류하고 있었다.", "중국 전역에서는 캘커타에 초장거리 전략폭격 부대를, 청두에 전진기지를 두어 일본의 「내권(inner zone)」에 있는 핵심 목표를 공격하기로 했다. 각주 정의에 따르면 이 폭격 대상 구역에 조선이 들어간다.", "일본 본토 주요 도서에 대한 항공·해상 봉쇄를 확립하고, 일본에 대한 지상 기지 및 항공모함 기반 항공작전을 개시할 수 있게 하는 것을 지원 작전의 목표로 삼았다.", "괌·티니안·사이판에 전략폭격 부대를 설치하여 일본 본토(Japan proper)를 전략폭격하기로 했다.", "쿠릴 열도와 일본 북부에 대한 초장거리 전략폭격 실행을 준비하고, 소련이 협력할 경우 쿠릴 열도와 소련 영토로 진입하기 위해 알류샨 열도의 기지·방어시설을 증강하기로 했다.", "가능한 한 이른 시기에 소련을 대일전에 끌어들이기 위해 모든 노력을 기울여야 하며 그 경우에 대비한 계획을 준비해야 한다는 데 합의했다.", "독일이 1944년 가을보다 이르게 패배할 경우에 대비한 작전 계획도 준비하기로 했다.", "뉴기니–네덜란드령 동인도–필리핀 축선을 따른 진격을 위임통치 제도 탈취 작전과 병행 진행하고, 라바울의 항공 무력화를 강화하기로 했다.", "동남아시아에서는 상부 버마 탈취와 버캐니어(Buccaneer) 작전을 수행하기로 했다.", "작전 순서는 유연해야 하며, 일본 함대의 조기 격파, 일본군의 돌연한 철수, 아군 수단의 증대, 소련의 조기 협력이라는 네 가지 사태 진전이 지름길을 열어줄 수 있다고 보았다.", "부속서의 목표 일자는 어디까지나 계획 수립 목적으로만 제시된 것임을 명시했다."], "primary": "비밀\n\nC. C. S. 397호 (수정)\n\n[카이로,] 1943년 12월 3일.\n\n**1944년 일본 격파를 위한 개별 작전**\n\n참조 문서:\n\na. C.C.S. 242/6 [주1]\n\nb. C.C.S. 319/5 [주2]\n\nc. C.C.S. 417 [주3]\n\n1. 우리는 소련(U. S. S. E.)을 가능한 한 이른 실행 가능 시기에 대일전에 참전시키기 위하여 모든 노력을 기울여야 하며, 그 경우에 대비한 계획이 준비되어야 한다는 데 합의한다.\n\n2. 우리는 독일이 1944년 가을보다 이르게 패배할 경우에 대비한 작전 계획이 준비되어야 한다는 데 합의한다.\n\n3. 계획 수립 목적을 위한 작전 제안 일정과 예정 목표 일자는 첨부물의 부속서에 제시되어 있다. 상정된 작전들은 전략적 목표와, 일본의 무조건 항복을 가능한 한 이른 실행 가능 시기에 강요하기 위한 추가 작전을 수행할 기지를 획득한다는 구상에 입각한 것이다. 이 작전들은 콰드런트(Quadrant) 회담에서 합의되고 [주4] [780면] 연합참모본부(CCS)가 C. C. S. 380/2호에서 재확인한 [주5] 총괄 목표 및 총괄 전략 구상과, 그리고 C. C. S. 417호(일본 격파를 위한 총괄 계획)의 규정과 부합한다.\n\n4. **총론.** 이하에 지적된 개별 목표에 더하여 지원 작전들이 수행되어야 한다. 개별 작전과 지원 작전은 모두 다음을 목적으로 입안될 것이다. 일본 함대를 조기에 격멸하는 것, 적 공군의 소모를 최대한 확보하는 것, 적의 선박과 교통선에 대한 항공·잠수함·기뢰 부설 작전을 강화하는 것, 일본 본토 주요 도서에 대한 항공 및 해상 봉쇄를 확립하는 것, 중국을 계속 전쟁에 붙들어 두려는 노력을 지속하는 것, 그리고 우리가 일본에 대하여 지상 기지 및 항공모함 기반 항공작전을 개시할 수 있게 하는 것이다.\n\n5. **북태평양.** 북태평양에 대한 계획은, 러시아가 협력할 경우 쿠릴 열도와 소련 영토로 진입하는 데 대비하여 알류샨 열도의 기지 시설과 방어 시설을 증강하는 것을 포함한다. 일본 어선단에 대한 습격을 포함하여 해상 함정 및 잠수함 작전이 수행될 것이다. 쿠릴 열도와 일본 북부에 대한 초장거리 전략폭격의 실행을 위한 준비가 이루어질 것이다.\n\n6. **중부·남·남서태평양.** 뉴기니–네덜란드령 동인도–필리핀 축선을 따른 진격은 위임통치 제도(Mandated Islands) 탈취 작전과 동시에 진행될 것이다. 일본 본토(Japan proper)에 대한 전략폭격을 위하여 괌, 티니안, 사이판에 전략폭격 부대가 설치될 것이다. 네덜란드령 동인도–필리핀 지역 내 목표에 대한 공중 폭격과 라바울의 항공 무력화가 강화될 것이다.\n\n7. **중국.** 중국 지역에서 우리의 노력은 중국 내에서 그리고 중국을 발판으로 하는 지상·항공 작전의 강화와, 미 육군항공대(U. S. A. A. F.) 및 중국 육군·공군의 증강을 목표로 삼아야 한다. 여기에는 또한, 이미 승인된 다른 작전들에 실질적 영향을 주지 않는 범위에서, 일본의 「내권(inner zone)」에 있는 핵심 목표를 공격하기 위하여 청두에 전진기지를 둔 초장거리 전략폭격 부대를 캘커타에 설치하는 것이 포함된다. [주*]\n\n8. **동남아시아.** 동남아시아 지역에서는 항공 노선을 개선하고 중국과의 육상 교통을 확립하기 위하여 상부 버마 탈취를 위한 작전이 수행되어야 한다. 버캐니어(Buccaneer) 작전이 수행될 것이다. 가용한 수단의 범위 내에서, 적에 대한 압박을 유지하고 그 병력의 분산을 유도하며 [781면] 적의 항공·해군 전력과 선박에 실행 가능한 최대한의 소모를 가할 목적으로, 항공모함 탑재기에 의한 습격을 포함한 추가 공세 작전이 해군·공군·지상군에 의하여 수행되어야 한다. 동남아시아 및 중국 전구에서 승인된 작전에 필요한 인도 내 기지의 정비는 계속되어야 한다. [주6]\n\n9. 항공모함이 더 많이 가용해짐에 따라, 위에 제시된 작전들은 예정된 작전 일자 사이사이에 실행 가능한 한 선정된 핵심 목표에 대한 집중적인 항공모함 기동부대 타격으로 보완되어야 한다.\n\n10. 이 작전들의 완수는 연합국(United Nations)을, 독일이 패배한 뒤 우리 처분 아래 놓이게 될 막대한 항공·지상·해군 자원을 가장 유리하게 사용할 수 있는 위치에 서게 할 것이다.\n\n**첨부물**\n\n1944년 작전 일정이 부속서에 제시되어 있다. [주7] 예상되는 수단과 시간·공간 요소를 신중히 고려한 끝에 결정된 목표 일자들은 오로지 계획 수립 목적으로만 제시된 것이다. 우리는 작전의 순서가 유연해야 한다고 확신한다. 우리는 정세의 진전으로 가능해지는 온갖 종류의 지름길을 취할 준비가 되어 있어야 한다. 지름길을 허용할 수 있는 네 가지 주요 사태 진전은 다음과 같다.\n\na. 일본 함대의 조기 격파.\n\nb. 일본군의 어느 지역으로부터의 돌연한 철수(키스카에서와 같은).\n\nc. 강습용 선박 건조 계획의 가속과 1944년 10월 1일보다 이른 독일의 패배 등으로 인한 우리 수단의 증대.\n\nd. 소련(U. S. S. E.)의 대일전에 대한 조기 협력.\n\n우리는 c와 d에서 상정된 조건에 대하여 추가 연구를 수행하고 계획을 수립하여 최신 상태로 유지하도록 지시하였다.\n\n우리는 독일의 패배와 더불어 풀려나게 될 막대한 공군력의 최적 운용에 특별한 주의를 기울이도록 지시하였다.\n\n우리는 대일전에서 초장거리 폭격기의 최적 사용, 시기 및 배치에 관한 연구가 이루어지도록 지시하였다.\n\n[782면]", "secondary": "secret \n C. C. S. 397 (Revised)\n\n[Cairo,] 3 December 1943.\n\nSpecific Operations for the Defeat of
