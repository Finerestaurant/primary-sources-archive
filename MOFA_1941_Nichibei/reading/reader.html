문 표기", "v": "昭和16年11月30日"}, {"k": "전보번호", "v": "第八四六号（館長符号扱）"}, {"k": "발신", "v": "在中国日高代理大使 (재중국 히다카 대리대사, 日高信六郎)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신, 東郷茂徳)", "txt": true}, {"k": "발신·착신", "v": "南京 11月30日後発 / 本省 11月30日夜着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "日米交渉の進捗状況につき汪主席に内報について", "txt": true, "wide": true}], "summary": "히다카 대리대사가 훈령(제510호)에 따라 11월 30일 왕 주석과 회견하여 일미교섭의 사정을 내보하고, 사견으로서 교섭 성립의 가망이 이미 적으며 화전(和戦) 양쪽의 준비를 굳히고 있다고 국면의 절박함을 내비쳤다고 보고한 전보.", "points": ["귀전 제510호에 관하여.", "30일 왕(汪) 주석과 회견하여 서두에 귀전의 사정을 우선(不取敢) 내보했다.", "아울러 본사(本使)의 사견으로서, 일미교섭 성립의 가망은 이미 적고 우리로서는 화전(和戦) 양쪽의 준비를 굳히고 있다면서 국면이 절박해 있다는 뜻을 내비쳤다(仄メカシ).", "앞으로도 충분히 연락을 도모하겠다는 뜻을 부언했다.", "이에 대해 주석은 위 내보에 감사하며, 긴급한 용무가 있을 때에는 언제든지 귀관과 연락할 수 있도록 절차를 마련해 두겠다고 답했다."], "primary": "[210면]\n귀전(貴電) 제510호에 관하여.\n\n30일 왕(汪) 주석과 회견하여, 서두에 귀전의 사정을 우선(不取敢) 내보(内報)함과 아울러, 본사(本使)의 사견으로서 일미교섭 성립의 가망은 이미 적고 우리로서는 화전(和戦) 양쪽의 준비를 굳히고 있는 중이라 하여 국면이 절박해 있다는 뜻을 내비치고(仄メカシ), 앞으로도 충분히 연락을 도모하겠다는 뜻을 부언(付言)한바, 주석은 위 내보에 사의를 표하고 긴급한 용무가 있을 때에는 언제든지 귀관과 연락하도록 절차를 마련해 두겠다는 뜻을 답하였다.", "secondary": "[210面]\n貴電第五一〇号ニ関シ\n三十日汪主席ト会見シ冒頭貴電ノ次第ヲ不取敢内報スルト共ニ本使ノ私見トシテ日米交渉成立ノ見込最早乏シク吾人トシテハ和戦両様ノ準備ヲ固メツツアリトテ局面切迫シ居ル旨ヲ仄メカシ今後共充分連絡ヲ計ルヘキ旨付言セル処主席ハ右内報ヲ謝シ緊急ノ御用アル際ハ何時ニテモ貴官ト連絡スル様手筈ヲシ置ク旨答ヘタリ", "notes": ["「汪主席」은 남경 국민정부 주석 왕조명(汪兆銘)이다.", "「不取敢」(とりあえず)은 「우선·일단」의 뜻이다.", "「仄メカシ」(ほのめかし)는 「넌지시 내비치다」의 뜻이다.", "「和戦両様」은 화평과 전쟁 양쪽 모두를 뜻한다.", "여기서 말하는 「貴電第五一〇号」는 문서 424 이다."], "warn": false, "pages": ["nichibei2_05_027"], "search": "日高信六郎 (히다카 신로쿠로) — 재중국 대리대사 東郷茂徳 (도고 시게노리) — 외무대신 汪兆銘 (왕조명) — 남경 국민정부 주석 (본문 표기는 「汪主席」)"}, {"id": "427", "order": 427, "date": "1941-11-30", "group": "B", "eyebrow": "문서 427 · 「ハル・ノート」に関し米国側の反省申入れ方訓令", "title": "「ハル・ノート」에 관하여 미국 측의 반성을 신청하도록 하는 훈령", "list_right": "문서 427", "meta": [{"k": "일자", "v": "1941-11-30"}, {"k": "원문 표기", "v": "昭和16年11月30日"}, {"k": "전보번호", "v": "第八五七号"}, {"k": "발신", "v": "東郷外務大臣 (도고 외무대신, 東郷茂徳)", "txt": true}, {"k": "수신", "v": "在米国野村大使 (주미 노무라 대사, 野村吉三郎)", "txt": true}, {"k": "발신·착신", "v": "本省 11月30日発", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "「ハル・ノート」に関し米国側の反省申入れ方訓令", "txt": true, "wide": true}], "summary": "외무대신이 노무라 대사에게, 11월 26일 미국 신제안에 대하여 미국 정부에 심심(深甚)한 반성을 구한다는 취지를 구두로 신청하되, 그로 인해 교섭이 곧바로 결렬로 이끌리지 않도록 배려하라고 지시한 훈령.", "points": ["왕전(往電) 제844호(문서 420)에 관하여.", "우선(不取敢) 다시 한 번 아래 취지를 구두로써 신청하기 바란다.", "미국 정부가, 우리 쪽이 공정한 입장에 입각하여 종래의 피아(彼我) 주장을 충분히 고려한 위에 작성한 20일의 우리 쪽 신제안을 심의의 기초로 삼기 어렵다고 하고, 26일 동아(東亜)의 현실을 무시하고 제국의 권위에 관계되는 점이 적지 않은 신제안을 한 것은 제국정부가 이해에 고통스러워하는 바이다.", "특히 지나(支那) 문제에 대하여 그 태도를 표변(豹変)한 것과 같은 것은, 7개월에 걸친 교섭에서 미국 정부가 기도한 근본적 목적이 어디에 있었는지를 의심케 하는 바가 있다.", "이에 여기서 미국 정부에 대하여 심심(深甚)한 반성을 구하는 바이다.", "（또한 본 훈령 집행에 즈음하여서는, 위 신청에 의해 교섭을 곧바로 결렬로 이끄는 일이 없도록 배려하기 바란다.）", "※ 주목: 여기서도 11월 26일 미국 문서를 「新提案」이라 부른다. 「最後通牒」이라는 말은 쓰지 않았다."], "primary": "[211면]\n왕전(往電) 제844호에 관하여.\n\n우선(不取敢) 다시 한 번 아래의 취지를 구두로써 신청하여 주기 바란다.\n\n미국 정부가, 우리 쪽이 공정한 입장에 입각하여 종래의 피아(彼我) 주장을 충분히 고려한 위에 작성한 20일의 우리 쪽 신제안(新提案)을 심의의 기초로 삼기 어렵다고 하고, 26일 동아(東亜)의 현실을 무시하며 제국의 권위에 관계되는 점이 적지 않은 신제안을 한 것은, 제국정부가 이해하기에 고통스러운 바이다. 특히 지나(支那) 문제에 대하여 그 태도를 표변(豹変)한 것과 같은 것은, 7개월에 걸친 교섭에서 미국 정부가 기도(企図)한 근본적 목적이 어디에 있었는가를 의심케 하는 바가 있다. 이에 여기서 미국 정부에 대하여 심심(深甚)한 반성을 구하는 바이다.\n\n（또한 본 훈령의 집행에 즈음하여서는, 위 신청에 의하여 교섭을 곧바로 결렬로 이끄는 일이 없도록 배려하여 주기 바란다.）", "secondary": "[211面]\n往電第八四四号ニ関シ\n今一応左記ノ趣旨ヲ口頭ヲ以テ御申入相成度不取敢\n米国政府カ我方ニ於テ公正ナル立場ニ立脚シ従来ノ彼我主張ヲ充分考慮ノ上作成セル二十日ノ我方新提案ヲ審議ノ基礎トシ難シト為シ二十六日ノ東亜ノ現実ヲ無視シ帝国ノ権威ニ関スル点少ナカラサル新提案ヲ為シタルハ帝国政府ノ理解ニ苦シム所ナリ殊ニ支那問題ニ付其ノ態度ヲ豹変セルカ如キハ七ヶ月ニ亘ル交渉ニ於テ米国政府カ企図シタル根本的目的那辺ニ在リタルヤヲ疑ハシムルモノアリ仍テ茲ニ米国政府ニ対シ深甚ナル反省ヲ求ムルモノナリ（尚本訓令執行ニ際シテハ右申入ニ依リ交渉ヲ直ニ決裂ニ導クカ如キコトナキ様御配慮アリ度シ）", "notes": ["「往電第八四四号」는 문서 420 이다.", "「二十日ノ我方新提案」은 11월 20일 제시한 이른바 을안(乙案)이다.", "「支那」는 당대 표기로, 그대로 옮겼다.", "「不取敢」(とりあえず)은 「우선·일단」의 뜻이다.", "「豹変」은 태도를 갑자기 바꾸는 것을 뜻한다.", "「那辺」은 「어디」의 뜻이다.", "「仍テ」(よって)는 「이에」의 뜻이다.", "괄호 안의 마지막 단락은 훈령 본문이 아니라 대사에게 준 실행상의 주의이다."], "warn": false, "pages": ["nichibei2_05_028"], "search": "東郷茂徳 (도고 시게노리) — 외무대신 野村吉三郎 (노무라 기치사부로) — 주미 대사"}, {"id": "428", "order": 428, "date": "1941-11-30", "group": "A", "eyebrow": "문서 428 · 「東条首相演説」に対する米国側の反応について", "title": "「도조 수상 연설」에 대한 미국 측의 반응에 관하여", "list_right": "문서 428", "meta": [{"k": "일자", "v": "1941-11-30"}, {"k": "원문 표기", "v": "昭和16年11月30日"}, {"k": "전보번호", "v": "第一二二二号（大至急、館長符号扱）"}, {"k": "발신", "v": "在米国野村大使 (주미 노무라 대사, 野村吉三郎)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신, 東郷茂徳)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 11月30日後発 / 本省 12月1日後着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "「東条首相演説」に対する米国側の反応について", "txt": true, "wide": true}], "summary": "노무라 대사가, 도조 수상의 11월 30일 연설을 미국 각 신문이 큰 표제로 다루었고 특히 「영미인의 아시아 민족 착취(exploitation)는 응징으로 일소되어야 한다」는 구절을 크게 취급했으며, 헐 장관이 웜스프링스에서 요양 중이던 대통령에게 즉시 전화 보고하여 대통령이 급거 예정을 변경해 귀환하게 되었다고 보고한 대지급 전보.", "points": ["도조 총리의 연설은 30일 각 신문이 모두 큰 표제로 게재했다.", "그 가운데 영미인의 아시아 민족 「exploitation」은 「must be purged with vengeance」라는 문구를 특히 크게 다루고 있다.", "한편 신문 보도에 따르면 백악관(白亜館) 「セクレタリ」(비서)는, 도조 수상의 연설에 대하여 「ハル」(헐) 장관이 즉시 「ワーム・スプリング」(웜스프링스)에서 요양 중이던 대통령에게 전화로 보고했고, 대통령은 급거 예정을 변경하여 30일 오후 그곳을 출발, 1일 오전 중에는 귀화(帰華, 워싱턴 귀환)할 예정이라는 뜻을 발표하고 있다.", "위 연설은 미국 측에서 상당한 선전의 도구로 쓰일 우려가 있으니 적절히(可然) 조치해 주기 바란다.", "아울러 연설의 「テキスト」(텍스트)를 방문(邦文)·영문 모두 지급으로 송부해 주기 바란다.", "【付記 = 「東条首相演説」 전문(212~213면)】 일만화(日満華) 삼국 공동선언 1주년 기념 대회에 보낸 축사 형식의 연설이다. 삼국의 융합을 「천여(天与)의 필연적 귀결」이라 하고, 공동선언의 대경륜을 전 인류의 「부동의 지도 원리」라 규정한다.", "【付記】 적성(敵性) 국가들이 대동아공영권 확립을 방해하고 있으며, 장(蒋) 정권이 영미의 선동과 공산당의 선전에 놀아나 항전을 부르짖어 청장년을 헛되이 죽이고 있는데, 이는 영미가 대동아 제민족을 서로 싸우게 하여 아시아 제패의 야심을 이루려는 상투수단이라고 비난했다.", "【付記】 노무라 전보가 미국 신문이 크게 다루었다고 보고한 대목(영미인의 아시아 민족 「착취」를 「응징으로 일소해야 한다」)에 해당하는 것은 이 부분으로 보인다. 「我等は人類の名誉のために、人類の矜持のために断じてこれを徹底的に排撃しなければならぬ」 및 그에 이어지는 「欧米諸国家の搾取劫略の魔手を芟除せんがため」다.", "【付記】 편주(編注)에 따르면 연설 본문은 『東京朝日新聞縮刷版 昭和十六年 自九月至十二月』에서 채록한 것이다."], "primary": "[211면]\n도조(東条) 총리의 연설은 30일의 각 신문이 어느 것이나 큰 표제로써 게재하고 있는바, 그 가운데 영미인의 아시아(亜細亜) 민족 exploitation 은 must be purged with vengeance 라는 문구를 특히 크게 취급하고 있다. 한편 신문 보도에 따르면 백악관(白亜館) 「セクレタリ」(비서)는, 도조 수상의 연설에 대하여 「ハル」(헐) 장관이 즉시 「ワーム・スプリング」(웜스프링스)에서 휴양 중인 대통령에게 전화로 보고한바, 대통령은 급거 예정을 변경하여 30일 오후 같은 곳을 출발, 1일 오전 중에는 귀화(帰華)할 예정이라는 뜻을 발표하고 있다. 위 연설은 미국 측에서 상당한 선전의 도구로 제공될 우려가 있으니 적절히(可然) 조치하여 주심과 아울러, 「テキスト」(텍스트)를（방문(邦文), 영문）지급으로 송부하여 주시기 바란다.\n\n---\n\n[212면]\n（부기(付記)）\n「도조 수상 연설」\n\n〇 일만화(日満華) 삼국이 대동아공영권의 중핵으로서 신세계사 창조의 일대 생명력에 혼연 융합하고 있는 것은, 무릇 하늘이 준 여러 조건이 그리 되게 하는 필연적 귀결이다. 이야말로 혈연적으로 지연적으로, 혹은 역사적으로 문화적으로, 일만화 삼국이 똑같이 짊어져야 할 가장 영광스러운 숙명이며, 어느 누구도 이에 용훼(容喙)할 수 없는 가장 엄숙한 사실이 아니면 안 된다. 작년 이달 이날 공표된 일만화 삼국 공동선언은 곧 이 진체(真諦)를 세상에 천명한 것이다.\n\n〇 생각건대 일만화 삼국 공동선언이 보이는 대경륜(大経綸)은, 각 사람 각 국가가 그 역사적 적성과 그 자연적 환경에 따라 각기 본연의 특질을 발양하면서 서로 협심육력(協心戮力)하여 대동아 제국민의 공존공영을 도모함과 아울러, 나아가 전 인류의 강녕과 번영을 기도하고 이를 위한 신질서를 건설하려는 웅혼(雄渾)한 대이상을 구현하려는 데 있음은 새삼 말할 것도 없다. 그런데 이 대이상은 지금 대동란의 화중(禍中)에 혼미하고 방황하는 전 인류를 번연(翻然)히 각성시켜, 전 인류의 내일의 진로를 비추어 여는 부동의 지도 원리가 되어 있는 것이다. 우리 일만화 삼국이 무슨 다행인지 이러한 대이상의 횃불을 들고서 함께 손을 잡고 온갖 형극(荊棘)을 헤쳐 열며 천장만난(千障万難)을 뚫고 벌써 1년의 성과를 보이기에 이르렀으니, 이야말로 실로 세기의 일대 공영(功栄)이 아니고 무엇이겠는가.\n\n〇 그러나 주변을 전망하면 수많은 적성(敵性) 국가가 지금도 여전히 그 준동(蠢動)을 그치지 않고 있다. 아니, 더욱더 집요하기 짝이 없는 술책을 부려 우리 대동아공영권 확립의 대업을 방해하고, 그로써 어디까지나 여러 해 이를 방자히 해 온 착취 겁략(劫略)의 악몽을 좇으려 하며, 십억의 우리 대동아 제민족의 희생 위에서 홀로 그들만이 그 사리사욕을 채우려 하고 있는 것이다. 장(蒋) 정권이 혹은 영미의 선동에 좌우되고 혹은 공산당의 선전에 놀아나, 함부로 항전을 부르짖으며 전도유위한 청장년을 헛되이 개죽음시키고 있는 것은, 대동아 제민족으로 하여금 서로 잡아먹게 하고 그 간극을 타서 영미 양국이 아시아 제패의 야심을 이루려는 것으로서, 이와 같은 것은 본디 영미 양국의 상투수단으로 삼는 바이다. 우리는 인류의 명예를 위하여, 인류의 긍지를 위하여 단[213면]연코 이를 철저히 배격하지 않으면 안 된다.\n\n〇 다행히 귀 국민 여러분은 밤낮으로 제일선에 있으면서, 직접 공산당의 잔인하기 그지없는 파괴공작을 방알(防遏)하는 데 온갖 고심을 거듭하시면서도, 나아가 구미 여러 국가의 착취 겁략의 마수를 삼제(芟除)하기 위하여 온갖 노력을 경주하시고, 물심 양쪽에 걸친 이 저주스러운 철쇄를 끊어, 거기에 전 민족으로 하여금 희희(嬉々)히 안거낙업(安居楽業)하게 하는 해방의 여명을 불러오려 하고 계신다. 게다가 더욱이 그 풍옥한 지상자원과 무진장한 매장자원의 개발을 한층 더 증대함으로써 널리 전 인류에 그 은택을 미치게 하려 하고 계신다. 이야말로 참으로 일만화 삼국 공동선언의 구체적 실천이며, 이 실천에 정신(挺身)하는 사람들이야말로 다름 아닌 숭고한 인도(人道)의 전사로서 우리가 충심으로 찬탄해 마지않는 바이다.\n\n〇 우리는 여기 오늘의 기념일을 맞이함에 즈음하여, 일만화 삼국 공동선언의 대이상 완수의 성전(聖戦)에 쓰러진 수많은 영령에 심심한 감사의 뜻을 바침과 아울러, 이 대이상 구현을 위해서는 선인의 시신을 넘어 용왕매진하려는 불퇴전의 결의를 한층 굳게 하는 바이다. 그리고 우리는 여기 이 역사적 대업 완성을 위한 공동전선이 더욱더 그 유대를 공인(鞏靱)하게 하여, 하루라도 빨리 혁혁한 성과를 거두고 정의의 진영에 높이 개가가 오를 날을 간절히 기념(祈念)하며, 그로써 본 대회에 대한 동지로서의 축사로 삼는다.\n\n편주(編注) 『東京朝日新聞縮刷版 昭和十六年 自九月至十二月』에서 채록", "secondary": "[211面]\n東条総理ノ演説ハ三十日ノ各紙何レモ大見出シヲ以テ掲載シ居ル処右ノ内英米人ノ亜細亜民族 exploitation ハ must be purged with vengeance ナル文句ヲ特ニ大キク取扱ヒ居レリ一方新聞報ニ依レハ白亜館「セクレタリ」ハ東条首相ノ演説ニ付テハ「ハル」長官ハ直ニ「ワーム・スプリング」ニ休養中ノ大統領ニ対シ電話報告セル処大統領ハ急遽予定ヲ変更シ三十日午後同地ヲ出発一日午前中ニハ帰華ノ予定ナル旨発表シ居リ右演説ハ米国側ニ於テ相当宣伝ノ具ニ供スヘキ惧アルニ付可然御手配相成ルト共ニ「テキスト」（邦文、英文）至急御送付相成度\n\n[212面]\n（付記）\n「東条首相演説」\n〇日満華三国が大東亜共栄圏の中核として新世界史創造の一大生命力に渾然融合しつつあることは、けだし天与の諸条件が然らしむる必然的帰結である、これこそ血縁的に地縁的にあるひは歴史的に文化的に、日満華三国がひとしく担ふべき最も光栄ある宿命であり、何人もがこれに容喙すべからざる最も厳粛なる事実でなくてはならぬ、昨年本月本日、公にされた日満華三国共同宣言は、すなはちこれが真諦を世に闡明したものである。\n〇惟ふに日満華三国共同宣言の示す大経綸は、各人、各国家が、その歴史的適性とその自然的環境とにより、それぞれ本然の特質を発揚しつつ、互に協心戮力、以て大東亜諸国民の共存共栄を図るとともに、進んで全人類の康寧と繁栄とを企図し、これがための新秩序を建設せんとする、雄渾なる大理想を具現せんとするに在ることは改めて申すに及ばぬ、しかるにこの大理想たる今や大動乱の禍中に昏迷し彷徨する全人類を翻然覚醒せしめ、全人類明日の進路を照破する不動の指導原理となってゐるのである、わが日満華三国が、何の幸か、かかる大理想の炬火を揚げつつ、ともに手をとりあらゆる荊棘を切り開き千障万難を突いて早くも一年の成果を示すに至ったが、これまさしく世紀の一大功栄に非ずして何であらうか。\n〇しかしながら周辺を展望すれば幾多の敵性国家が今なほ依然としてその蠢動を熄めないのである、いないよいよ執拗極りなき術策を弄してわが大東亜共栄圏確立の大業を妨害し、もってあくまで多年これを恣にしたる搾取劫略の悪夢を追はんとし、十億のわが大東亜諸民族の犠牲において独り彼等のみがその私利私欲を充たさんとしてゐるのである、蒋政権があるひは英米の煽動に左右せられ、あるひは共産党の宣伝に躍り、猥りに抗戦を叫んで前途有為の青壮年を空しく犬死せしめつつあるは、大東亜諸民族をして相喰ましめ、その間隙に乗じ、英米両国がアジア制覇の野心を遂うせんとするものであって、かくのごときは由来英米両国の常套手段とするところである、我等は人類の名誉のために、人類の矜持のために断[213面]じてこれを徹底的に排撃しなければならぬ。\n〇幸ひ貴国民各位は、日夜、第一線に在って、直接、共産党の残忍極まる破壊工作を防遏することにあらゆる苦心を重ねられつつ、しかも欧米諸国家の搾取劫略の魔手を芟除せんがため、あらゆる努力を傾注せられ、物心両つながらのこの呪ふべき鉄鎖を断ち切って、そこに全民族に嬉々として安居楽業せしむる解放の黎明を招来せんとしてゐられるのである、しかもなほ加ふるにその豊沃なる地上資源と無尽蔵なる埋蔵資源との開発をより一層増大することによって遍く全人類にこれが恵沢を及ぼさんとせられてゐるのである、これこそ、真に日満華三国共同宣言の具体的実践であり、これが実践に挺身する人々こそは、とりもなほさず崇高なる人道の戦士として我等の衷心より讃嘆措く能はざるところである。\n〇われ等はここに本日の記念日を迎へるに当り、日満華三国共同宣言の大理想完遂の聖戦にたふれたる幾多の英霊に深甚なる感謝の念を捧げるとともに、この大理想具現のためには、先人の屍を越えて勇往邁進せんとする不退転の決意を一層固うする次第であるが、われ等はここにこの歴史的大業完成のための共同戦線が、愈々その紐帯を鞏靱ならしめ、一日も速かに赫々たる成果を収めて、正義の陣営に高く凱歌の挙がる日を切に祈念し、もって本大会に対する同志としての祝辞とする。\n\n編注 『東京朝日新聞縮刷版 昭和十六年 自九月至十二月』より採録", "notes": ["영문 구절 exploitation / must be purged with vengeance 는 원문에 로마자 그대로 인쇄되어 있어 번역하지 않고 그대로 두었다.", "「白亜館」은 백악관(White House)의 당대 한자 표기이다.", "「セクレタリ」는 secretary(대통령 비서·공보 담당)의 가타카나 표기이다.", "「ワーム・スプリング」은 조지아주 웜스프링스(Warm Springs)로, 루스벨트 대통령의 요양지이다.", "「帰華」의 「華」는 화부(華府, 워싱턴)를 가리킨다. 곧 워싱턴으로 돌아온다는 뜻이다.", "「可然」(しかるべく)은 「적절히·알아서」의 뜻이다.", "간행본 표제 아래에 「付記 一一月三〇日「東条首相演説」」이라는 편자의 부기(付記)가 붙어 있으나, 연설 본문 자체는 이 지면에 실려 있지 않다."], "warn": false, "pages": ["nichibei2_05_028", "nichibei2_05_029", "nichibei2_05_030"], "search": "野村吉三郎 (노무라 기치사부로) — 주미 대사 東郷茂徳 (도고 시게노리) — 외무대신 東条英機 (도조 히데키) — 총리대신 (본문 표기는 「東条総理」·「東条首相」) 「ハル」 (헐, Cordell Hull) — 국무장관 「ルーズベルト」大統領 (루스벨트, Franklin D. Roosevelt) — 본문에서는 「大統領」으로만 나온다"}, {"id": "429", "order": 429, "date": "1941-11-30", "group": "A", "eyebrow": "문서 429 · 米国国務長官との会談申入れについて", "title": "미국 국무장관과의 회담 신청에 관하여", "list_right": "문서 429", "meta": [{"k": "일자", "v": "1941-11-30"}, {"k": "원문 표기", "v": "昭和16年11月30日"}, {"k": "전보번호", "v": "第一二二四号（大至急、極秘、館長符号）"}, {"k": "발신", "v": "在米国野村大使 (주미 노무라 대사, 野村吉三郎)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신, 東郷茂徳)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 11月30日後発 / 本省 12月1日後着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "米国国務長官との会談申入れについて", "txt": true, "wide": true}], "summary": "노무라 대사가, 훈령(제857호)에 따라 즉시 헐 국무장관에게 회견을 신청 중이나 대통령의 다음 날 아침 귀환 예정 등으로 아직 시간 협의가 되지 않았고 시기를 놓칠 우려가 있으니, 도쿄에서도 그루 주일 대사에게 지급으로 신청해 달라고 요청한 대지급 전보.", "points": ["귀전 제857호(문서 427)에 관하여.", "즉시(早速) 「ハル」(헐)에게 회견을 신청하는 중이다.", "그러나 대통령이 다음 날 아침 귀화(帰華, 워싱턴 귀환)할 예정인 것 등의 사정으로 아직 시간의 협의가 이루어지지 않고 있다.", "시기를 놓칠 우려가 있으니, 귀방(도쿄)에서도 「グルー」(그루) 대사에게 지급으로 신청해 주시기 바란다.", "난외(欄外) 기입: 「午後七時半」."], "primary": "[213면]\n귀전(貴電) 제857호에 관하여.\n\n즉시(早速) 「ハル」(헐)에게 회견을 신청하는 중이나, 대통령이 내일 아침 귀화(帰華)할 예정인 것 등의 사정으로 아직 시간의 협의가 붙지 않고 있는바, 시기를 놓칠 우려가 있으니 귀방(貴方)에서도 「グルー」(그루) 대사에게 지급으로 신청하시도록 하여 주시기 바란다.\n\n（난외 기입）　오후 7시 반", "secondary": "[213面]\n貴電第八五七号ニ関シ\n早速「ハル」ニ会見方申入中ナルモ大統領明朝帰華ノ予定ナル等ノ為未タ時間ノ打合付カサル処時機ヲ失スル惧アルニ付貴方ニ於テモ「グルー」大使ニ至急御申入相成様致度シ\n（欄外記入）　午後七時半", "notes": ["「貴電第八五七号」는 문서 427(11월 30일 도고 외무대신 훈령)이다.", "「帰華」의 「華」는 화부(華府, 워싱턴)를 가리킨다.", "「グルー」는 주일 미국대사 조지프 그루(Joseph C. Grew)이다. 워싱턴에서 회견 시간이 잡히지 않으니 도쿄에서 그루 대사를 통해 같은 신청을 하라는 뜻이다.", "「（欄外記入）」는 원 전보 용지의 난외에 적힌 기입을 간행본이 그대로 옮긴 것으로, 「午後七時半」이 무엇의 시각인지는 지면에 밝혀져 있지 않다.", "「早速」은 「즉시·곧」의 뜻이다."], "warn": false, "pages": ["nichibei2_05_030"], "search": "野村吉三郎 (노무라 기치사부로) — 주미 대사 東郷茂徳 (도고 시게노리) — 외무대신 「ハル」 (헐, Cordell Hull) — 국무장관 「グルー」 (그루, Joseph C. Grew) — 주일 미국대사 「ルーズベルト」大統領 (루스벨트, Franklin D. Roosevelt) — 본문에서는 「大統領」으로만 나온다"}, {"id": "430", "order": 430, "date": "1941-12-01", "group": "X", "eyebrow": "문서 430 · 開戦に関する御前会議決定", "title": "개전에 관한 어전회의 결정", "list_right": "문서 430", "meta": [{"k": "일자", "v": "1941-12-01"}, {"k": "원문 표기", "v": "昭和16年12月1日"}, {"k": "전보번호", "v": null}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "발신·착신", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "御前会議決定"}, {"k": "표제", "v": "開戦に関する御前会議決定", "txt": true, "wide": true}], "summary": "1941년 12월 1일 어전회의가 미영란(米英蘭)에 대한 개전을 결정한다. 결정문 두 줄과 총리대신·외무대신의 설명이 붙어 있다.", "points": ["결정문은 단 두 줄이다. 11월 5일 국책수행요령에 따른 대미 교섭이 성립하지 못했다는 것, 그리고 제국은 미영란에 대해 개전한다는 것이다.", "도조(東條英機) 총리의 설명은 미국이 새로 추가한 조건을 세 가지로 꼽는다. 지나로부터의 무조건 전면 철병, 남경정부 부인, 일독이 삼국조약의 사문화다.", "도고(東郷茂徳) 외무대신의 설명에 11월 26일 미국 문서(헐 노트)의 10개 항이 통째로 인용돼 있다. 원문은 이를 「최후통첩」이라 부르지 않는다. 「미국 측 회답」, 「본 제안」이라 적을 뿐이다.", "일본 쪽이 11월 20일 낸 다섯 항목의 신제안도 전문이 실려 있다. 남부 불인 주둔군의 북부 이주, 석유 대일 공급 재개, 원장 행위 중단이 핵심이다.", "헐 노트를 수락했을 때 무엇이 무너지는지를 다섯 항목으로 정리한다. 만주국의 지위 동요, 삼국조약의 사문화, 소련까지 더한 포위망을 든다.", "루스벨트가 지나 문제에서 「소개자(紹介者)」이고자 한다고 말한 대목과, 22일 헐이 대통령의 「다리 놓기」는 시기가 이르다고 흘린 대목이 나란히 적혀 있다.", "제국의 국제적 지위가 「만주사변 이전보다도 더욱 저하」된다는 표현이 수락 거부의 근거로 쓰인다."], "primary": "[214면]\n**개전에 관한 어전회의 결정**\n\n부기 一　어전회의에서의 총리대신 설명\n　　 二　어전회의에서의 외무대신 설명\n\n## 12월 1일 어전회의 결정\n\n11월 5일 결정한 제국국책수행요령(帝国々策遂行要領)에 의거한 대미 교섭은 끝내 성립하기에 이르지 못한다.\n\n제국은 미영란(米英蘭)에 대하여 개전한다.\n\n## （부기 一）12월 1일 어전회의에서의 총리대신 설명\n\n윤허를 얻었으므로 오늘 의사(議事)의 진행은 제가 이를 맡습니다.\n\n11월 5일 어전회의 결정에 의거하여, 육해군에서는 작전 준비의 완정(完整)에 힘쓰는 한편, 정부에서는 온갖 수단을 다하고 전력을 기울여 대미 국교 조정의 성립에 노력해 왔습니다만, 미국은 종래의 주장을 한 걸음도 양보하지 않을 뿐만 아니라, 다시 미영란지(米英蘭支) 연합 아래 지나(支那)로부터의 무조건 전면 철병, 남경정부(南京政府)의 부인, 일독이(日独伊) 삼국조약의 사문화(死文化)를 요구하는 등 새로운 조건을 추가하여 제국의 일방적 양보를 강요해 왔습니다. 만약 제국이 이에 굴종한다면 제국의 권위를 실추하고 지나사변(支那事変)의 완수를 기할 수 없을 뿐만 아니라, 마침내는 제국의 존립마저 위태롭게 하는 결과가 되는 터이며, 외교 수단에 의해서는 도저히 제국의 주장을 관철할 수 없다는 것이 명백해졌습니다. 한편 미영란지 등 여러 나라는 그 경제적·군사적 압박을 더욱더 강화해 왔으며, 우리 국력상의 견지에서 보더라도, 또 작전상의 관점에서 보더라도, 도저히 이대로 추이하는 것을 허용할 수 없는 상태에 이르렀습니다. 사태가 여기에 이른 이상 제국은 목전의 위국(危局)을 타개하고 자존자위(自存自衛)를 완수하기 위하여 미영란에 대해 개전하지 않을 수 없는 데에 이른 터입니다.\n\n지나사변도 이미 4년 남짓에 걸친 오늘, 다시 대전쟁에 돌입하게 되어 신금(宸襟)을 번거롭게 해 드리는 것은 참으로 황공하기 그지없는 터이옵니다.\n\n그러나 곰곰이 생각해 보건대 국력은 이제 지나사변 이전의 몇 배가 되었고, 국내의 결속은 더욱 굳으며, 육해 장병의 사기는 더욱 왕성하여, [215면]거국일체 일사봉공(一死奉公)으로 국난 돌파를 기해야 한다는 것은 제가 확신하여 의심하지 않는 바이옵니다. 그러하오니 별지의 오늘 의제에 관하여 심의를 바라고자 합니다.\n\n또한 외교 교섭, 작전 사항 기타의 사항에 관해서는 각기 소관 대신 및 통수부 측 등으로부터 설명을 드리겠습니다.\n\n## （부기 二）12월 1일 어전회의에서의 외무대신 설명\n\n오늘은 주로 11월 5일 어전회의 이후의 일미 교섭 경과에 관하여 설명드리겠습니다만, 그 이전 곧 10월 말의 교섭 상황을 극히 간단히 요약하자면, 미국 측은 국제 관계의 기초로서\n\n一、일체 국가의 영토 보전 및 주권 존중\n二、타국의 내정 불간섭\n三、통상상의 무차별 대우\n四、평화 수단에 의하는 외에 태평양에서의 현상 불변경\n\n의 4원칙을 견지하고 그 적용을 강요하고자 하였으며, 아울러 제국의 평화적 의도에 관해 의혹을 표시하고, 지나(支那)에서의 주병(駐兵)에 이의를 제기하며, 통상상의 무차별 원칙을 무조건 지나에 적용해야 한다고 주장하고, 또 삼국조약 문제에 관해서도 이를 사실상 사문(死文)이 되게 할 것을 요구하여, 교섭은 이 때문에 난관에 봉착하고 마침내 정돈(停頓)된 터였던 것입니다.\n\n이처럼 양국의 견해가 대립하게 된 까닭은, 미국이 국제 관계 처리에 관하여 그 전통적으로 견지하는 원칙적 이념을 강경하게 고집하고, 동아(東亜)의 실정을 돌아보지 않고 이를 그대로 지나 기타에 적용하고자 주장하고 있는 데에 기인하는 것으로, 미국 측이 이 태도를 개선하지 않는 한 본 교섭의 타결은 극히 곤란하다고 인정한 것입니다.\n\n그러나 현 내각으로서도 공정한 기초 위에서의 일미 국교 조정을 도모하는 것이 타당하다고 인정하여, 제국으로서 할 수 있는 한의 양보를 시도하고 그로써 일미 충돌 회피에 최후의 노력을 기울이기로 하였던 것입니다. 즉 이러한 견지에서 당시 교섭의 주요 난점이었던 삼국조약에 의거한 자위권의 해석, 통상 무차별 원칙, 그리고 지나 및 불인(仏印)으로부터의 철병이라는 세 문제에 관하여 종래의 제국 제안 곧 9월 25일 안을 완화하여,\n\n（一）삼국조약에 의거한 자위권 문제에 관해서는 미국 측이 자위권의 관념을 부당하게 확대하지 않을 것을 언명하게 하고 그 경우 우리 쪽에서도 같은 언명을 하기로 하며,\n（二）무차별 원칙에 관해서는 그 원칙이 전 세계에 적용되는 것이라면 그것이 지나에도 적용되는 데에 이의가 없다고 하기로 [216면]하고,\n（三）철병 문제에 관해서는 지나사변 때문에 지나에 파견된 일본 군대는 북지(北支)·몽강(蒙疆)의 일정 지역 및 해남도(海南島)에 관해서는 일지(日支) 간 평화 성립 후 소요 기간 주둔하되, 그 나머지 군대는 평화 성립과 동시에 일지 간 협정에 따라 철거를 개시하고 치안 확립과 함께 2년 이내에 철병을 완료하며, 또 불인에 관해서는 영토 주권의 존중을 약속하고 불인에 파견되어 있는 군대는 지나사변이 해결되거나 또는 공정한 극동 평화가 확립될 경우에는 즉시 이를 철거한다고 수정하기로 하여, 이는 11월 5일의 어전회의에서 결정을 얻은 터입니다.\n\n정부는 이 결정에 의거하여 노무라(野村吉三郎) 대사에게, 사태가 급박한 이때 파탄에 임박한 일미 국교의 국면을 전환하기 위해서는 본안(本案)에 의해 급속히 타결하는 수밖에 없고, 제국은 참기 어려움을 참고 최대한의 양보를 감행한 것임에 비추어, 미국 측도 맹성(猛省)하여 태평양 평화를 위해 우리 쪽과 협조할 것을 절망(切望)한다는 취지로 신입(申入)하도록 훈령하였습니다. 이후 교섭은 화부(華府, 워싱턴)에서 이루어졌습니다만, 도쿄에서도 이 교섭을 촉진하는 뜻에서 본 대신도 자주 주경(在京) 미국·영국 대사와 절충을 거듭하였습니다. 그리하여 노무라 대사는 7일 「ハル」(헐, Hull) 국무장관과의 회견을 시작으로, 10일 「ルーズヴェルト」(루스벨트, Roosevelt) 대통령, 12일 및 15일 「ハル」 장관과 회담을 거듭하며 예의 교섭 진척에 노력한 바가 있었습니다. 그동안 정부는 시국이 중대함에 비추어 외교상 십분의 노력을 시도하고자 5일 구루스(来栖三郎) 대사를 미국에 급파하기로 하여, 동 대사는 15일 화부에 도착하고 17일부터 노무라 대사를 도와 교섭에 참가하였습니다. 교섭은 당시 이미 한창이어서 미국 측은 7일 이래 우리 쪽에 대해 여러 점에 관해 질의를 제출하여 제국의 진의를 탐색하려는 기색을 보였습니다. 미국 측은 일찍부터 이른바 「ヒットラー」(히틀러, Hitler)주의의 타도를 표방하고 제국에 대해 무력 정책의 포기를 요구해 왔습니다만, 삼국조약과의 관계에서 제국의 정책에 대해 여전히 의혹을 품고 있었던 듯하여, 이번에도 제국의 평화적 의도에 관해 앞서 말한 8월 28일 제국 정부의 평화적 의도 성명에 대한 재확인을 요구함과 동시에, 일미 협정이 성립하면 제국은 삼국조약을 유지할 필요가 없을 것이고 그것은 소멸 혹은 사문이 되기를 희망한다는 뜻을 반복하여 역설하였습니다. 통상 무차별 원칙에 관해서는 우리 쪽이 제안한 「전 세계에 적용될 것」 운운의 조건 제거를 희망하며, 미국이 본래 자유 통상 회복을 위해 노력해 온 터임을 강조하였습니다. 동시에 미국 측은 따로 「경제 정책에 관한 공동선언안」이라는 것을 제의해 왔는데, 양국이 협력하여 전 세계에 통상 자유의 회복을 도모할 것, 일미 통상협정의 체결에 의해 정상 통상 관계를 [217면]회복할 것 외에, 지나에서는 경제·재정·통화에 관한 완전한 통제권을 지나 정부에 회수해야 할 것, 열국 협동 아래 지나의 경제 공동 개발을 행할 것 등을 제안하였습니다.또 지나로부터의 철병 문제에 관해서는 특별히 깊이 논의하지 않고 다만 영구 내지 불확정 기간의 주병에 난색을 보이는 데 그쳤습니다만, 제국이 평화 정책을 채택한다면 미국으로서 일지 직접 교섭 주선의 용의가 있다는 뜻을 신출(申出)하였습니다. 정부는 이에 대해, 8월 28일의 제국의 평화적 의도 천명에 관하여 미국 측이 확인을 희망하는 점은 9월 25일자 우리 제안 가운데 포함되어 있으며 따라서 현 내각도 그 취지에서 이를 확인함에 이의가 없다는 것, 또 통상상의 무차별 원칙에 조건을 붙인 것은 우리 쪽에서는 동 원칙이 전 세계에 일률로 적용되기를 희망하고 그 희망의 실현에 순응하여 지나에 대해서도 동 원칙의 적용을 승인한다는 의미라는 것, 공동선언안에 관해서는 그것이 지나의 현실을 무시하고 특히 지나 공동 개발의 제안은 지나 국제 관리의 단서가 될 우려가 있으므로 수락하기 어렵다는 것, 그리고 미국 측의 일지 화평 주선 신입에는 이의가 없다는 뜻을 회답하게 하였던 것입니다. 구루스 대사는 이 단계에서 교섭에 참획(参画)한 것이며, 노무라·구루스 두 대사는 17일 대통령과, 18일·20일·21일·22일·26일 계속하여 「ハル」 장관과 회견을 거듭하였던 것입니다. 그런데 17일·18일 양일의 회견에서 대통령은 일미 평화를 희망한다는 뜻을 말하고, 지나 문제에 관해서는 간섭도 알선도 할 의도가 없으며 단지 「소개자(紹介者)」이고자 할 뿐이라고 말하였고, 다른 한편 「ハル」 장관은 제국이 독일(獨逸)과 제휴하고 있는 한 일미 교섭은 지극히 어려우므로 우선 이 근본적 곤란을 제거할 필요가 있다고 누누이 역설하여, 쌍방이 논의를 다하였으나 난관은 여전히 삼국조약, 무차별 원칙 및 지나 문제에 있다는 것이 명백해졌으므로, 20일에 이르러 우리 쪽은 종래 교섭의 기초였던 안문(案文)이 선전적 색채로 가득 차 있던 것을 간략화하고, 또 의견이 쉽사리 일치하지 않는 무차별 원칙 문제를 제거하며, 다시 삼국조약 문제는 상대편의 제안을 기다린다는 취지로 이 또한 일단 우리 제안에서 제거하고, 또 지나 문제는 주로 이를 일지 직접 교섭으로 옮긴다는 취지로 미국 측에서는 단지 일지 화평 방해를 삼가도록 한다는 신제안을 제출하게 하였습니다. 곧 동 안의 내용은 다음과 같습니다.\n\n一、일미 양국 정부는 모두 불인(仏印) 이외의 남동아세아 및 남태평양 지역에 무력적 진출을 행하지 않을 것을 확약한다.\n二、일미 양국 정부는 난령인도(蘭領印度)에서 그 필요로 하는 물자의 [218면]획득이 보증되도록 상호 협력하는 것으로 한다.\n三、일미 양국 정부는 상호 통상 관계를 자산 동결 이전의 상태로 복귀시켜야 한다. 미국 정부는 소요의 석유의 대일 공급을 약속한다.\n四、미국 정부는 일지 양국의 화평에 관한 노력에 지장을 주는 듯한 행동에 나서지 않아야 한다.\n五、일본국 정부는 일지 간 화평이 성립하거나 또는 태평양 지역에서 공정한 평화가 확립될 때에는 현재 불령인도지나(仏領印度支那)에 파견되어 있는 일본 군대를 철퇴할 것을 약속한다.\n일본국 정부는 본 양해가 성립하면 현재 남부 불령인도지나에 주둔 중인 일본군을 북부 불령인도지나로 이주(移駐)시킬 용의가 있음을 천명한다.\n\n이에 대해 미국 측은 제국이 삼국조약과의 관계를 명백히 하고 평화 정책 채용을 확언하지 않는 한 원장(援蒋) 행위 정지는 곤란하며, 대통령의 이른바 「소개자」가 되겠다는 제안도 일본의 평화 정책 채용을 전제로 하는 것이라는 뜻을 말하였습니다만, 이에 대해 우리 쪽은 미국 측 신출의 취지에 의거하여 대통령의 소개로 일지 직접 교섭이 개시된다면 화평의 주선자인 미국이 여전히 원장 행위를 계속하여 평화 성립을 방해하는 것은 모순임을 지적하고 미국 측의 반성을 요망하였습니다. 그런데 그 후에도 미국 측은 일미 양국이 각기 동아 및 서반구에서 지도적 입장에 서는 데에 이의가 없으며 친선리에 태평양 협정을 맺고 싶다고 말하면서도, 지나에 관해 미국은 장개석(蒋介石) 원조 중단을 응낙하지 않을 뿐만 아니라 삼국조약에 관한 종래의 주장을 고집·반복하며 더 이상 양보의 기색을 보이지 않았던 것입니다.\n\n그동안 미국 정부는 영국·호주·네덜란드 및 중경(重慶) 대표와 협의한 바가 있어, 22일 「ハル」 장관은, 이들 나라는 일본이 평화 정책을 채택하는 것이 명확해지면 통상 상태 복귀를 실행할 수 있겠으나 당분간은 점진적으로 이를 행할 의도인 듯하며, 또 남부 불인으로부터의 철병만으로는 남태평양 방면의 급박한 정세를 완화하기에 부족하다고 하고 있다고 말하고, 다시 대통령의 일지 간 「다리 놓기(橋渡シ)」는 시기가 아직 무르익지 않았다고 생각한다는 뜻을 흘리기에 이르렀습니다.\n\n그런데 미국 정부는 그 후에도 이들 나라 대표와 협의를 거듭하고 있었습니다만, 26일 「ハル」 장관은 두 대사에게 20일의 우리 신제안에 관해서는 신중히 연구를 가하고 관계국과도 협의하였으나 유감스럽게도 동의하기 어렵다고 말하고, 미국 측 6월 안과 우리 쪽 9월 안의 조절안이라 칭하면서, 제1로 이른바 4원칙(단 제4항은 분쟁 방지를 위한 국제 협력 및 조정으로 변경되었다)의 확인을 구함과 동시에, 제2로 따로 양국 정부가 취해야 할 조치로서 [219면]\n\n一、일미 양국 정부는 영제국·네덜란드·지나·소련·태국과 함께 다변적 불가침조약의 체결에 힘쓴다.\n二、일미 양국 정부는 일·미·영·지나·네덜란드·태국 정부 사이에 불인의 영토 주권을 존중하고 불인의 영토 주권이 위협받는 경우 필요한 조치에 관해 즉시 협의해야 할 협정의 체결에 힘쓴다.\n위 협정 체약국은 불인에서의 무역 및 경제 관계에서 특혜 대우를 배제하고 평등의 원칙 확보에 힘쓴다.\n三、일본 정부는 지나 및 불인으로부터 일체의 군대(육·해·공 및 경찰)를 철수해야 한다.\n四、양국 정부는 중경정부를 제외한 어떠한 정권도 군사적·정치적·경제적으로 지지하지 않는다.\n五、양국 정부는 지나에서의 치외법권(조계 및 단비의정서(団匪議定書)에 의거한 권리를 포함한다)을 포기하고 타국에도 같은 조치를 종용해야 한다.\n六、양국 정부는 호혜적 최혜국 대우 및 통상 장벽 저감의 주의에 의거한 통상조약 체결을 상의해야 한다(생사(生糸)는 자유 품목으로 남겨 둔다).\n七、양국 정부는 상호 자산동결령을 폐지한다.\n八、엔·달러 환 안정에 관해 협정하고 양국이 각기 반액씩 자금을 공급한다.\n九、양국 정부는 제3국과 체결하고 있는 어떠한 협정도 본 협정의 근본 목적 곧 태평양 전 지역의 평화 확보에 모순되게 해석되지 않을 것에 동의한다.\n一〇、이상의 여러 원칙을 타국에도 종용할 것\n\n등의 각 항을 포함한 안을 앞으로의 교섭의 기초로서 제안하였습니다.이에 관해 두 대사는 그 부당함을 지적하고 강경한 응수를 하였습니다만 「ハル」 장관은 양보의 기색을 보이지 않았다는 것입니다. 이어 27일 두 대사가 다시 대통령과 회견하였을 때 대통령은 지금도 여전히 일미 교섭의 타결을 희망한다고 말하면서도, 지난 7월 본 교섭 진행 중에 일본군의 남부 불인 진주를 보게 되어 찬물을 뒤집어쓴 격이었는데 최근의 정보에 의하면 또다시 찬물을 뒤집어쓸 우려가 있는 듯이 생각된다고 말하고, 잠정적 방법으로 국면 타개를 도모하더라도 양국의 근본 주의·방침이 일치하지 않으면 일시적 해결도 결국 무효라고 생각한다는 뜻을 말하였다고 합니다.\n\n그런데 위 미국 측 제안 가운데에는 통상 문제(제6·7·8 각 항) 내지 지나 치외법권 철폐(제5항) 등 우리 쪽으로서 용인할 수 있는 항목도 약간 포함되어 있습니다만, 지나·불인 관계 사항(제2·3항), 국민정부 부인(제4항), 삼국조약 부인(제9항) 및 [220면]다변적 불가침조약(제1항) 등은 어느 것이나 제국으로서 도저히 동의할 수 없는 것에 속하며, 본 제안은 미국 측 종래의 여러 제안에 비해 현저한 퇴보이자 또한 반년을 넘는 교섭 경위를 전혀 무시한 부당한 것이라고 인정하지 않을 수 없는 것입니다.\n\n요컨대 미국 정부는 시종 그 전통적 이념 및 원칙을 고집하여 동아의 현실을 몰각하고 게다가 스스로는 쉽사리 실행하지 않는 여러 원칙을 제국에 강요하려는 것으로서, 우리나라가 자주 여러 차례 양보를 하였음에도 불구하고 7개월 남짓에 걸친 이번 교섭을 통해 당초의 주장을 고지(固持)하여 한 걸음도 양보하지 않았던 것입니다.\n\n생각건대 미국의 대일 정책은 시종일관 우리의 부동의 국시(国是)인 동아 신질서 건설을 방해하려는 데에 있으며, 이번 미국 측 회답은 가령 이를 수락한다면 제국의 국제적 지위는 만주사변 이전보다도 더욱 저하되고 그 존립 또한 위태로워지지 않을 수 없는 것으로 인정되는 것입니다. 곧\n\n一、장개석 치하의 중국은 더욱더 영미 의존의 경향을 증대하고 제국은 국민정부에 대한 신의를 잃어 일지(日支) 우의 또한 장래 오래도록 훼손되며, 나아가서는 대륙으로부터 전면적으로 퇴각을 부득이하게 되고 그 결과 만주국의 지위도 필연 동요를 초래하기에 이를 것이며, 이와 같이 하여 우리 지나사변 완수의 방도는 근저로부터 뒤엎어질 것이며\n二、영미는 이들 지역의 지도자로서 군림하기에 이르러 제국의 권위는 땅에 떨어지고 안정 세력이라는 지위가 복멸되어 동아 신질서 건설에 관한 우리 대업은 중도에 와해되기에 이를 것이며\n三、삼국조약은 한 조각 사문(死文)이 되어 제국은 신의를 해외에 실추하고\n四、새로이 소련(蘇連)까지 더하여 집단 기구적 조직으로써 제국을 견제하려는 것은 우리 북변(北辺)의 우환을 증대시키는 것이 될 것이며\n五、통상 무차별 기타의 여러 원칙과 같은 것은 그 이르는 바가 반드시 배제해야 할 것은 아니라 하더라도, 이를 우선 태평양 지역에만 적용하려는 기도는 결국 영미의 이기적 정책 수행의 방도에 지나지 않으며 우리 쪽에서는 중요 물자의 획득에 큰 지장을 초래하기에 이를 것이며\n\n요컨대 위 제안은 도저히 우리 쪽에서 용인하기 어려운 것으로서, 미국 측에서 그 제안을 전면 철거한다면 모르되 위 제안을 기초로 하여 이 이상 교섭을 지속하더라도 우리 주장을 충분히 관철하는 것은 거의 불가능하다고 할 수밖에 없다고 말씀드리지 않을 수 없습니다.", "secondary": "[214면]\n開戦に関する御前会議決定\n付記一　御前会議における総理大臣説明\n　　二　御前会議における外務大臣説明\n\n十二月一日御前会議決定\n十一月五日決定ノ帝国々策遂行要領ニ基ク対米交渉遂ニ成立スルニ至ラス\n帝国ハ米英蘭ニ対シ開戦ス\n\n（付記一）\n十二月一日御前会議ニ於ケル総理大臣説明\n御許シヲ得タルニ依リマシテ本日ノ議事ノ進行ハ私カ之ニ当リマス\n十一月五日御前会議決定ニ基キマシテ、陸海軍ニ於テハ作戦準備ノ完整ニ勉メマスル一方、政府ニ於キマシテハ凡有ル手段ヲ尽シ全力ヲ傾注シテ、対米国交調整ノ成立ニ努力シテ参リマシタカ、米国ハ従来ノ主張ヲ一歩モ譲ラサルノミナラス、更ニ米英蘭支連合ノ下ニ支那ヨリ無条件全面撤兵、南京政府ノ否認、日独伊三国条約ノ死文化ヲ要求スル等新タナル条件ヲ追加シ帝国ノ一方的譲歩ヲ強要シテ参リマシタ、若シ帝国ニシテ之ニ屈従センカ帝国ノ権威ヲ失墜シ支那事変ノ完遂ヲ期シ得サルノミナラス、遂ニハ帝国ノ存立ヲモ危殆ニ陥ラシムル結果ト相成ル次第テアリマシテ、外交手段ニ依リテハ到底帝国ノ主張ヲ貫徹シ得サルコトカ明カトナリマシタ、一方米英蘭支等ノ諸国ハ其ノ経済的、軍事的圧迫ヲ益々強化シテ参リマシテ、我国力上ノ見地ヨリスルモ、又作戦上ノ観点ヨリスルモ、到底此ノ儘推移スルヲ許ササル状態ニ立チ至リマシタ、事茲ニ至リマシテハ帝国ハ現下ノ危局ヲ打開シ、自存自衛ヲ完ウスル為メ米英蘭ニ対シ開戦ノ止ムナキニ立チ至リマシタル次第テアリマス\n支那事変モ既ニ四年有余ニ亘リマシタル今日、更ニ大戦争ニ突入致スコトト相成リ、宸襟ヲ悩マシ奉ルコトハ洵ニ恐懼ノ至リニ堪エヌ次第テコサイマス\n然シナカラ熟々考ヘマスルニ国力ハ今ヤ支那事変前ニ数倍シ、国内ノ結束愈々固ク、陸海将兵ノ士気益々旺盛ニシテ、挙国一体一死奉公、国難突破ヲ期スヘキハ私ノ確信シテ疑ハヌ所テコサイマス、[215면]就イテハ別紙本日ノ議題ニ付テ、御審議ヲ願ヒ度イト存シマス\n尚外交交渉、作戦事項其他ノ事項ニ関シマシテハ、夫々所管大臣及統師部側等ヨリ御説明申上ケマス\n\n（付記二）\n十二月一日御前会議ニ於ケル外務大臣説明\n本日ハ主トシテ十一月五日御前会議以後ニ於ケル日米交渉ノ経過ニ付御説明申上ケマスカ其レ以前即チ十月末ニ於ケル交渉ノ状況ヲ極メテ簡単ニ要約致シマスルト米側ハ国際関係ノ基礎トシテ\n一、一切ノ国家ノ領土保全及主権尊重\n二、他国ノ内政不干渉\n三、通商上ノ無差別待遇\n四、平和手段ニ依ルノ外太平洋ニ於ケル現状ノ不変更\nノ四原則ヲ堅持シ之カ適用ヲ強要セムトシ、尚帝国ノ平和的意図ニ関シ疑惑ヲ表示シ、支那ニ於ケル駐兵ニ異議ヲ唱ヘ、通商上ノ無差別原則ヲ無条件ニ支那ニ適用スヘシト主張シ、又三国条約問題ニ付テモ之ヲ事実上死文タラシメムコトヲ求メ、交渉ハ之カ為メ難関ニ逢著シ遂ニ停頓セル次第テアツタノテアリマス。\n斯ノ如ク両国ノ見解対立ヲ来シタル所以ノモノハ、米国カ国際関係処理ニ付其ノ伝統的ニ堅持スル原則的理念ヲ強硬ニ固執シ、東亜ノ実情ヲ顧ミス之ヲ其ノ儘支那其他ニ適用センコトヲ主張シ居ルコトニ起因スルモノテ、米側ニシテ右ノ態度ヲ改善セサルニ於テハ、本交渉ノ妥結ハ極メテ困難ナリト認メタノテアリマス。\n然シ乍ラ現内閣トシマシテモ公正ナル基礎ニ於ケル日米国交調整ヲ計ルヲ妥当ト認メ、帝国トシテ能フ限リノ譲歩ヲ試ミ以テ日米衝突回避ニ最後ノ努力ヲ傾ケルコトニ致シタノテアリマス。即チ右ノ見地ヨリ当時交渉ノ主要難点タリシ三国条約ニ基ク自衛権ノ解釈、通商無差別原則並ニ支那及仏印ヨリノ撤兵ノ三問題ニ付従来ノ帝国提案即チ九月二十五日案ヲ緩和シ、\n（一）三国条約ニ基ク自衛権問題ニ付テハ米側カ自衛権ノ観念ヲ不当ニ拡大セサルコトヲ言明セシメ其ノ場合我方ニ於テモ同様ノ言明ヲナスコトトシ、\n（二）無差別原則ニ付テハ右原則カ全世界ニ適用セラルルモノナルニ於テハ右カ支那ニモ適用セラルルコトニ異議ナキコトト[216면]シ、\n（三）撤兵問題ニ付テハ支那事変ノ為メ支那ニ派遣セラレタル日本軍隊ハ北支蒙疆ノ一定地域及海南島ニ関シテハ日支間平和成立後所要期間駐屯スヘク、爾余ノ軍隊ハ平和成立ト同時ニ日支間協定ニ従ヒ撤去ヲ開始シ、治安確立ト共ニ二年以内ニ撤兵ヲ完了スヘク、又仏印ニ付テハ領土主権ノ尊重ヲ約シ、仏印ニ派遣セラレ居ル軍隊ハ支那事変解決スルカ又ハ公正ナル極東平和確立スルニ於テハ直ニ之ヲ撤去スヘシト修正スルコトトシ、右ハ十一月五日ノ御前会議ニ於テ御決定ヲ得マシタ次第テアリマス。\n政府ハ右ノ御決定ノ次第ニ基キ野村大使ニ対シ事態急迫セル此ノ際破綻ニ瀕セル日米国交ノ局面ヲ転換スル為ニハ本案ニ依リ急速妥結スルノ外ナク、帝国ハ難キヲ忍ヒテ最大限ノ譲歩ヲ敢テシタルモノナルニ鑑ミ、米国側モ猛省シテ太平洋平和ノ為メ我方ト協調センコトヲ切望スル旨申入方訓令致シマシタ。爾後交渉ハ華府ニ於テ行ハレタルカ東京ニ於テモ右交渉ヲ促進スル意味ニ於テ本大臣モ屡々在京米英大使ト折衝ヲ遂ケマシタ。而シテ野村大使ハ七日「ハル」国務長官トノ会見ヲ手初メトシ、十日「ルーズヴェルト」大統領十二日及十五日「ハル」長官ト会談ヲ重ネ、鋭意交渉進捗ニ努力スル所カアリマシタ、此ノ間政府ハ時局ノ重大ナルニ鑑ミ外交上十全ノ努力ヲ試ミンカ為メ、五日来栖大使ヲ米国ニ急派スルコトトシ、同大使ハ十五日華府到着十七日ヨリ野村大使ヲ援助シテ交渉ニ参加致シマシタ。交渉ハ当時既ニ酣ニシテ米側ハ七日以来我方ニ対シ幾多ノ点ニ付質疑ヲ提出シ帝国ノ真意ヲ探ラントスル様子ヲ示シマシタ。米側ハ夙ニ所謂「ヒットラー」主義ノ打倒ヲ標榜シ、帝国ニ対シ武力政策ノ抛棄ヲ要求シテ居リマシタカ、三国条約トノ関係ニ於テ帝国ノ政策ニ対シ依然疑惑ヲ抱キ居リシモノノ如ク、今回モ帝国ノ平和的意図ニ付前述ノ八月二十八日帝国政府ノ平和的意図ノ声明ニ付再確認ヲ要求スルト共ニ、日米協定成立セハ帝国ハ三国条約ヲ保持スルノ要ナカルヘク右ハ消滅若クハ死文トナルコトヲ希望スル旨反覆力説致シマシタ。通商無差別原則ニ付テハ我方ノ提案セル「全世界ニ適用セラルルコト」云々ノ条件除去ヲ希望シ、米国カ由来自由通商回復ノ為メ努力シ来レル次第ヲ強調致シマシタ。同時ニ米側ハ別ニ「経済政策ニ関スル共同宣言案」ナルモノヲ提議越シ、両国協力シテ全世界ニ通商自由ノ回復ヲ計ルコト、日米通商協定ノ締結ニ依リ正常通商関[217면]係ヲ回復スルコトノ外、支那ニ於テハ経済財政通貨ニ関スル完全ナル統制権ヲ支那政府ニ回収スヘキコト列国協同下ニ支那ノ経済共同開発ヲ行フコト等ヲ提案致シマシタ。尚又支那ヨリノ撤兵問題ニ付テハ特ニ深ク之ヲ論議セス唯永久乃至不確定期間ノ駐兵ニ対シ難色ヲ示スニ止マリマシタカ、帝国カ平和政策ヲ採ルニ於テハ米国ニ於テ日支直接交渉周旋ノ用意アル次第ヲ申出テマシタ。政府ハ右ニ対シ八月二十八日ノ帝国ノ平和的意図闡明ニ関シ米側カ確認ヲ希望スル点ハ九月二十五日付我提案中ニ包含セラレ居リ、従ツテ現内閣モ其ノ趣旨ニ於テ之カ確認ニ異議ナキコト、又通商上ノ無差別原則ニ付条件ヲ付シタルハ我方ニ於テハ同原則カ全世界ニ一律ニ適用セラルルヲ希望シ、右希望ノ実現ニ順応シテ支那ニ対シテモ同原則ノ適用ヲ承認ストノ意味合ナルコト、共同宣言案ニ付テハ右カ支那ノ現実ヲ無視シ殊ニ支那共同開発ノ提案ハ支那国際管理ノ端緒トナル惧アルヲ以テ受諾シ難キコト、及米側ノ日支和平周旋申入レニハ異議ナキ旨回答セシメタノテアリマス。来栖大使ハ此ノ段階ニ於テ交渉ニ参画セルモノテアリマシテ、野村来栖両大使ハ十七日大統領ト、十八日、二十日、二十一日、二十二日、二十六日ト引続キ「ハル」長官ト会見ヲ重ネタノテアリマス。然ルニ十七、十八両日ノ会見ニ於テハ大統領ハ日米平和ヲ希望スル旨ヲ述ヘ、支那問題ニ付テハ干渉モ斡旋モスル意図ナク単ニ「紹介者」タラント欲スルモノナリト言ヒ、他方「ハル」長官ハ帝国カ獨逸ト提携シ居ル限リ日米交渉ハ至難ナルヲ以テ、先ツ此ノ根本的困難ヲ除去スル必要アリト縷々力説シ、双方論議ヲ尽セルモ難関ハ依然トシテ三国条約、無差別原則及支那問題ニ在ルコト明カトナリマシタノテ、二十日ニ至リ我方ハ従来交渉ノ基礎タリシ案文カ宣伝的色彩ニ満チ居タルヲ簡略化シ、且意見容易ニ一致セサル無差別原則問題ヲ除去シ、更ニ三国条約問題ハ先方ヨリノ提案ニ俟ツ趣旨ヲ以テ是又一応我提案ヨリ除去シ、尚又支那問題ハ主トシテ之ヲ日支直接交渉ニ移スノ趣旨ヲ以テ米側ニ於テハ単ニ日支和平妨碍ヲ差控ヘシムルコトトスル新提案ヲ提出致サセマシタ。即チ同案ノ内容ハ左ノ通リテアリマス。\n一、日米両国政府ハ孰レモ仏印以外ノ南東亜細亜及南太平洋地域ニ武力的進出ヲ行ハサルコトヲ確約ス\n二、日米両国政府ハ蘭領印度ニ於テ其ノ必要トスル物資ノ[218면]獲得カ保証セラルル様相互ニ協力スルモノトス\n三、日米両国政府ハ相互ニ通商関係ヲ資産凍結前ノ状態ニ復帰スヘシ米国政府ハ所要ノ石油ノ対日供給ヲ約ス\n四、米国政府ハ日支両国ノ和平ニ関スル努力ニ支障ヲ与フルカ如キ行動ニ出テサルヘシ\n五、日本国政府ハ日支間和平成立スルカ又ハ太平洋地域ニ於ケル公正ナル平和確立スル上ハ現ニ仏領印度支那ニ派遣セラレ居ル日本軍隊ヲ撤退スヘキ旨ヲ約ス\n日本国政府ハ本了解成立セハ現ニ南部仏領印度支那ニ駐屯中ノ日本軍ハ之ヲ北部仏領印度支那ニ移駐スルノ用意アルコトヲ闡明ス\n右ニ対シ米側ハ帝国カ三国条約トノ関係ヲ明カニシ平和政策採用ヲ確言スルニ非サレハ援蒋行為停止ハ困難ナリ、大統領ノ所謂「紹介者」タラントノ提案モ日本ノ平和政策採用ヲ前提トスルモノナル旨ヲ述ヘマシタカ、之ニ対シ我方ハ米側申出ノ趣旨ニ基キ大統領ノ紹介ニ依リ日支直接交渉開始セラルルニ於テハ、和平ノ周旋者タル米国カ依然援蒋行為ヲ継続シ、平和成立ヲ妨碍スルハ矛盾ナルヲ指摘シ米側ノ反省ヲ要望致シマシタ。然ルニ其ノ後モ米側ハ日米両国カ夫々東亜及西半球ニ於テ指導的立場ニ立ツニ異議ナク親善裡ニ太平洋協定ヲ結ヒ度シト述ヘ乍ラモ支那ニ付米国ハ蒋介石援助打切リヲ応諾セサルノミナラス、三国条約ニ関スル従来ノ主張ヲ固執反覆シ、更ニ譲歩ノ色ヲ示サナカツタノテアリマス。\n此ノ間米国政府ハ英豪蘭及重慶代表ト協議スル所アリ、二十二日「ハル」長官ハ右諸国ハ日本カ平和政策ヲ採ルコト明確トナラハ通商常態復帰ヲ実行シ得ヘキモ、差当リ漸進的ニ之ヲ行フ意図ノ如ク、又南部仏印ヨリノ撤兵ノミニテハ南太平洋方面ノ急迫セル情勢ヲ緩和スルニ足ラストナシ居レリト述ヘ、更ニ大統領ノ日支間「橋渡シ」ハ時機未タ熟セスト思考スル旨ヲ洩スニ至リマシタ。\n然ルニ米国政府ハ其ノ後モ右諸国代表ト協議ヲ重ネツツアツタノテアリマスカ、二十六日「ハル」長官ハ両大使ニ対シ二十日ノ我新提案ニ付テハ慎重研究ヲ加ヘ関係国トモ協議セルモ遺憾乍ラ同意シ難シト述ヘ、米側六月案ト我方九月案トノ調節案ナリト称シテ第一所謂四原則（但シ第四項ハ紛争防止ノ為ノ国際協力及調停ニ変更セラル）ノ確認ヲ求ムルト共ニ第二別ニ両国政府ノ採ルヘキ措置トシテ[219면]\n一、日米両国政府ハ英帝国、蘭、支、蘇、泰ト共ニ多辺的不可侵条約ノ締結ニ努ム\n二、日米両国政府ハ日、米、英、支、蘭、泰国政府トノ間ニ仏印ノ領土主権ヲ尊重シ仏印ノ領土主権カ脅威サルル場合必要ナル措置ニ関シ即時協議スヘキ協定ノ締結ニ努ム\n右協定締約国ハ仏印ニ於ケル貿易及経済関係ニ於テ特恵待遇ヲ排除シ平等ノ原則確保ニ努ム\n三、日本政府ハ支那及仏印ヨリ一切ノ軍隊（陸、海、空及警察）ヲ撤収スヘシ\n四、両国政府ハ重慶政府ヲ除ク如何ナル政権ヲモ軍事的、政治的、経済的ニ支持セス\n五、両国政府ハ支那ニ於ケル治外法権（租界及団匪議定書ニ基ク権利ヲ含ム）ヲ抛棄シ他国ニモ同様ノ措置ヲ慫慂スヘシ\n六、両国政府ハ互恵的最恵国待遇及通商障壁低減ノ主義ニ基ク通商条約締結ヲ商議スヘシ（生糸ハ自由品目ニ据置ク）\n七、両国政府ハ相互ニ資産凍結令ヲ廃止ス\n八、円弗為替安定ニ付協定シ両国夫々半額宛資金ヲ供給ス\n九、両国政府ハ第三国ト締結シ居ル如何ナル協定モ本協定ノ根本目的即チ太平洋全地域ノ平和確保ニ矛盾スルカ如ク解釈セラレサルコトニ付同意ス\n一〇、以上諸原則ヲ他国ニモ慫慂スルコト\n等ノ各項ヲ包含セル案ヲ爾今交渉ノ基礎トシテ提案致シマシタ。右ニ付両大使ハ其ノ不当ナルヲ指摘シ、強硬ナル応酬ヲナシマシタカ「ハル」長官ハ譲歩ノ色ヲ示サナカツタ由テアリマス。越エテ二十七日両大使カ更ニ大統領ト会見セル際ニハ大統領ハ今猶日米交渉ノ妥結ヲ希望スト述ヘ乍ラモ去ル七月本交渉進行中日本軍ノ南部仏印進駐ヲ見タル為メ冷水ヲ浴セラレタルカ、最近ノ情報ニ依レハ復々冷水ヲ浴セラルル懸念アルヤニ考ヘラルト云ヒ、暫定的方法ニ依リ局面打開ヲ計ルモ両国ノ根本主義方針カ一致セサレハ一時的解決モ結局無効ト思フ旨ヲ述ヘタ趣テアリマス。\n然ルニ右米側提案中ニハ通商問題（第六、七、八各項）乃至支那治外法権撤廃（第五項）等我方トシテ容認シ得ヘキ項目モ若干含マレテ居リマスカ、支那仏印関係事項（第二、三項）国民政府否認（第四項）三国条約否認（第九項）及[220면]多辺的不可侵条約（第一項）等ハ何レモ帝国トシテ到底同意シ得サルモノニ属シ、本提案ハ米側従来ノ諸提案ニ比シ著シキ退歩ニシテ且半歳ヲ越エル交渉経緯ヲ全然無視セル不当ナルモノト認メサルヲ得ヌノテアリマス。\n要之米国政府ハ終始其ノ伝統的理念及原則ヲ固執シ東亜ノ現実ヲ没却シ而モ自ラハ容易ニ実行セサル諸原則ヲ帝国ニ強要セムトスルモノニシテ、我国カ屡々幾多ノ譲歩ヲ為セルニ拘ラス七ケ月余ニ亘ル今次交渉ヲ通シ当初ノ主張ヲ固持シテ一歩モ譲ラナカツタノテアリマス。\n惟フニ米国ノ対日政策ハ終始一貫シテ我不動ノ国是タル東亜新秩序建設ヲ妨碍セントスルニ在リ、今次米側回答ハ仮ニ之ヲ受諾センカ帝国ノ国際的地位ハ満州事変以前ヨリモ更ニ低下シ、其ノ存立モ亦危殆ニ陥ラサルヲ得ヌモノト認メラレルノテアリマス。即チ\n一、蒋介石治下ノ中国ハ愈々英米依存ノ傾向ヲ増大シ帝国ハ国民政府ニ対スル信義ヲ失シ日支友誼亦将来永ク毀損セラレ延テハ大陸ヨリ全面的ニ退却ヲ余儀ナクセラレ其ノ結果満州国ノ地位モ必然動揺ヲ来スニ至ルヘク斯クノ如クニシテ我支那事変完遂ノ方途ハ根底ヨリ覆没セラルヘク\n二、英米ハ此等地域ノ指導者トシテ君臨スルニ至リ帝国ノ権威地ニ墜チテ安定勢力タル地位ヲ覆滅シ東亜新秩序建設ニ関スル我大業ハ中途ニシテ瓦解スルニ至ルヘク\n三、三国条約ハ一片ノ死文トナリテ帝国ハ信ヲ海外ニ失墜シ\n四、新タニ蘇連ヲモ加ヘ集団機構的組織ヲ以テ帝国ヲ控制セントスルハ我北辺ノ憂患ヲ増大セシムルコトトナルヘク\n五、通商無差別其他ノ諸原則ノ如キハ其ノ謂フ所必スシモ排除スヘキニ非スト雖モ之ヲ先ツ太平洋地域ニノミ適用セントスル企図ハ結局英米ノ利己的政策遂行ノ方途ニ過キスシテ我方ニ於テハ重要物資ノ獲得ニ大ナル支障ヲ来スニ至ルヘク\n要スルニ右提案ハ到底我方ニ於テハ容認シ難キモノテ米側ニ於テ其ノ提案ヲ全然撤去スルニ於テハ格別右提案ヲ基礎トシテ此ノ上交渉ヲ持続スルモ我カ主張ヲ充分ニ貫徹スルコトハ殆ト不可能ト云フノ外ナシト申サナケレハナリマセヌ。", "notes": ["「帝国々策遂行要領」의 々는 원문 그대로 두었다. 「帝国国策遂行要領」이다.", "「華府」는 워싱턴이다. 당대 표기를 그대로 두었다."], "warn": false, "pages": ["nichibei2_05_031", "nichibei2_05_032", "nichibei2_05_033", "nichibei2_05_034", "nichibei2_05_035", "nichibei2_05_036", "nichibei2_05_037"], "search": "野村吉三郎 (노무라 기치사부로) 来栖三郎 (구루스 사부로) 東郷茂徳 (도고 시게노리) ハル / Cordell Hull (헐) ルーズヴェルト / Franklin D. Roosevelt (루스벨트) 蒋介石 (장개석) ヒットラー / Adolf Hitler (히틀러)"}, {"id": "431", "order": 431, "date": "1941-12-01", "group": "B", "eyebrow": "문서 431 · 情勢緊迫のおり米国側動静に警戒方訓令", "title": "정세가 긴박하니 미국 측 동정에 경계하라는 훈령", "list_right": "문서 431", "meta": [{"k": "일자", "v": "1941-12-01"}, {"k": "원문 표기", "v": "昭和16年12月1日"}, {"k": "전보번호", "v": "第八六五号（極秘、館長符号）"}, {"k": "발신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "수신", "v": "在米国野村大使 (주미 노무라 대사)", "txt": true}, {"k": "발신·착신", "v": "本省 12月1日後8時30分発", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "情勢緊迫のおり米国側動静に警戒方訓令", "txt": true, "wide": true}], "summary": "본성이 노무라에게, 미국의 의혹을 불필요하게 키우지 말라고 지시한다. 신문에는 교섭이 계속 중이라는 취지로 대응하라고 한다.", "points": ["왕전 제812호가 정한 기일이 이미 지났고 정세는 더 진전되고 있다고 적는다. 개전 결정 당일에 보낸 전보다.", "신문 등에는 「양쪽 주장의 거리는 크지만 교섭은 계속 중」이라는 취지로 지도하고 있다고 알린다. 이는 노무라 한 사람에게만 알리는 것이라고 못 박는다.", "주경 미국대사에 대한 신입은 이번에는 삼가고 워싱턴에서만 하라고 지시한다.", "루스벨트가 급히 워싱턴으로 돌아간 것이 11월 30일 도조 수상 성명 때문이라는 보도가 있으나, 극동 정세 긴박을 우려한 것일 수도 있다며 진상을 알아보라고 한다."], "primary": "[221면]\nvery urgent\n\n왕전(往電) 제857호에 관하여\n\n一、왕전 제812호의 기일을 경과하고 정세는 더욱더 진전되고 있으나, 우리 쪽은 이때 불필요하게 미국 측의 의혹을 늘리지 않도록 경계하는 견지에서 신문 기타에 대해서는 「피아(彼我)의 주장은 거리가 큰 바가 있으나 교섭은 계속 중이다」라는 취지로 지도하고 있다（이상은 귀사(貴使)에게만 알리는 뜻으로）.\n二、귀전 제1224호 말단의 주경(在京) 미국대사에 대한 신입(申入)은 이때 삼가므로 귀방(貴方)에서만 신입해 주기 바란다.\n三、대통령이 급거 화부(華府)로 돌아간 것은 30일 도조(東条) 수상 성명의 영향이라는 보도도 있으나, 이는 극동 정세의 긴박을 우려한 때문인가 하고도 생각되니 진상을 탐구해 주기 바란다.", "secondary": "[221면]\nvery urgent\n往電第八五七号ニ関シ\n一、往電第八一二号ノ期日ヲ経過シ情勢ハ益々進展シツツアルモ我方ハ此際不必要ニ米側ノ疑惑ヲ増ササル様警戒スル見地ヨリ新聞其他ニ対シテハ彼我ノ主張ハ距離大ナルモノアルモ交渉ハ継続中ナリトノ趣旨ヲ以テ指導シ居レリ（以上貴使限リノ含迄）\n二、貴電第一二二四号末段在京米大使ヘノ申入ハ此際差控フルニ付キ貴方ニ於テノミ御申入アリ度シ\n三、大統領急遽帰華セルハ三十日東条首相声明ノ影響ナルヤノ報道モアルモ右ハ極東情勢ノ緊迫ヲ懸念セル為カトモ思惟セラルル処真相御探求アリ度シ", "notes": ["「往電」은 본성이 앞서 보낸 전보를, 「貴電」은 대사관이 보낸 전보를 가리킨다.", "「華府」는 워싱턴이다. 당대 표기를 그대로 두었다."], "warn": false, "pages": ["nichibei2_05_038"], "search": "東郷茂徳 (도고 시게노리) 野村吉三郎 (노무라 기치사부로) 東條英機 (도조 히데키) ルーズヴェルト / Franklin D. Roosevelt (루스벨트)"}, {"id": "432", "order": 432, "date": "1941-12-01", "group": "B", "eyebrow": "문서 432 · 「東条首相演説」の新聞発表経緯について", "title": "「도조 수상 연설」의 신문 발표 경위에 관하여", "list_right": "문서 432", "meta": [{"k": "일자", "v": "1941-12-01"}, {"k": "원문 표기", "v": "昭和16年12月1日"}, {"k": "전보번호", "v": "第八六六号（大至急）"}, {"k": "발신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "수신", "v": "在米国野村大使 (주미 노무라 대사)", "txt": true}, {"k": "발신·착신", "v": "本省 12月1日後11時59分発", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "「東条首相演説」の新聞発表経緯について", "txt": true, "wide": true}], "summary": "문제가 된 도조 수상 연설은 수상이 하지 않은 연설이라고 해명한다. 흥아동맹 사무국이 초안을 기자에게 넘긴 것이 그대로 실렸다는 것이다.", "points": ["11월 30일 흥아동맹 주최 일화기본조약 체결 1주년 기념 축하회의 축사였다. 사무국이 스스로 기초했다고 적는다.", "30일이 일요일이라 석간이 없어, 29일 밤 수상과 정부 당국의 사열을 거치기 전에 사무국이 기자 요구에 응해 넘긴 것이라고 한다.", "수상 자신은 30일에 아무 연설도 하지 않았고 원고도 정부 당국이 전혀 몰랐다고 못 박는다.", "영역문의 「purge this sort of practice from East Asia with vengeance」에 해당하는 원문은 「단연코 이를 철저히 배격하지 않으면 안 된다」였다고 바로잡는다.", "12월 1일 오후 11시 59분 발신이다. 어전회의가 개전을 결정한 그날 밤이다."], "primary": "[221면]\n문제가 된 도조(東条) 수상의 연설이라는 것은, 11월 30일 흥아동맹(興亜同盟) 주최 일화기본조약(日華基本条約) 체결 1주년 기념 축하회를 위한 축사로서 동 동맹 사무국이 스스로 기초한 것인데, 30일이 마침 일요일이어서 석간 발행이 없는 까닭에 29일 밤 수상 기타 정부 당국의 사열(査閲)을 거치지 않은 채 동 사무국에서 신문기자의 청구에 응하여 건넨 것이 그대로 신문에 발표된 것이다.\n\n사실 수상 자신은 30일에 아무런 연설도 하지 않았고, 또 위 원고도 수상을 비롯한 정부 당국이 전혀 알지 못하였던 터로서, 흥아동맹에 대해서는 필요한 조치를 강구한 터이다.\n\n또한 역문(訳文) 가운데 For the honor and pride of mankind we must purge this sort of practice from East Asia with vengeance 라고 되어 있는 것은, 원문에서는 「인류의 명예를 위하여 인류의 긍지를 위하여 단연코 이를 철저히 배격하지 않으면 안 된다」라고 되어 있던 것이다. 참고로 알린다.", "secondary": "[221면]\n問題トナリタル東条首相ノ演説ナルモノハ十一月三十日興亜同盟主催日華基本条約締結一周年記念祝賀会ノ為ノ祝辞トシテ同同盟事務局カ自ラ起草シタルモノナル処三十日カ恰モ日曜日ニテ夕刊発行ナキ為二十九日夜首相其他政府当局ノ査閲ヲ経サル中ニ同事務局ニ於テ新聞記者ノ請求ニ任セ渡シタルモノカ其ノ儘新聞ニ発表セラレタルモノナリ\n事実首相自身三十日ニハ何等演説シ居ラス又右原稿モ首相初メ政府当局ノ全然承知シ居ラサリシ次第ニテ興亜同盟ニ対シテハ必要ナル措置ヲ講シタル次第ナリ\n尚訳文中For the honor and pride of mankind we must purge this sort of practice from East Asia with vengeanceトアルハ原文ニ於テハ人類ノ名誉ノ為ニ人類ノ矜恃ノ為ニ断シテ之ヲ徹底的ニ排撃セネハナラヌトアリタルモノナリ為念", "notes": ["「為念」은 참고로 알린다는 뜻의 전보 상투어다.", "영문은 지면에 로마자로 그대로 박혀 있다. 원문 그대로 두었다."], "warn": false, "pages": ["nichibei2_05_038"], "search": "東郷茂徳 (도고 시게노리) 野村吉三郎 (노무라 기치사부로) 東條英機 (도조 히데키)"}, {"id": "433", "order": 433, "date": "1941-12-01", "group": "A", "eyebrow": "문서 433 · 「東条首相演説」等に関する米国国務長官との会談要旨報告", "title": "「도조 수상 연설」 등에 관한 미국 국무장관과의 회담 요지 보고", "list_right": "문서 433", "meta": [{"k": "일자", "v": "1941-12-01"}, {"k": "원문 표기", "v": "昭和16年12月1日"}, {"k": "전보번호", "v": "第一二二五号（極秘、館長符号）"}, {"k": "발신", "v": "在米国野村大使 (주미 노무라 대사)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 12月1日後発 / 本省 12月2日前着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "「東条首相演説」等に関する米国国務長官との会談要旨報告", "txt": true, "wide": true}], "summary": "노무라와 구루스가 헐과 만난 자리의 보고다. 헐이 힘주어 말한 것은 두 가지, 일본 정부와 여론의 동향 그리고 불인 병력 증주다.", "points": ["두 대사가 국무성에 들어서자 기자는 물론 성원 일부까지 통로에 몰려들었다. 「화전(和戦)의 위기가 곧 결정된다」고 여기는 삼엄한 광경이었다고 적는다.", "헐이 도조 수상 성명을 침통한 표정으로 꺼낸다. 대통령이 급거 돌아온 이유의 하나가 그것이라고 말한다.", "헐이 자기 처지를 털어놓는다. 교섭 개시 이래 일본 요인에게서 뒷받침할 만한 말을 하나도 듣지 못해 국내에서 비난을 받고 궁지에 몰렸다는 것이다.", "불인 병력 증주에 관해 미국이 무엇을 보고 있는지 구체적으로 말한다. 해륙 병력 이동, 병기 육양, 운송선의 움직임을 시시각각 전보로 받고 있다고 한다.", "일본군 진주가 결과적으로 「히틀러리즘」을 간접 원조하고 있다는 것이 헐의 논지다.", "노무라가 6월 21일 안과 9월 25일 안을 무용으로 돌리는 것은 서로에게 유감이라고 말하자 헐이 대체로 동감의 표정을 보였다고 적는다.", "노무라의 반론이 날카롭다. 지나를 못 본 체 죽게 한다는 논의가 있으나, 거꾸로 일미 양국이 지나 문제 때문에 각자 자국을 못 본 체 죽게 하는 일은 피해야 하지 않느냐고 되묻는다."], "primary": "[222면]\n귀전(貴電) 제857호 훈령의 취지에 따라 1일 본사(本使)는 구루스(来栖) 대사와 함께 「ハル」(헐, Hull) 장관과 회견하여 구두 신입(申入)을 마쳤다. 장관의 응답은 요컨대 종래 반복 설명의 범위를 벗어나지 않았으며, 그 역점은 우리 쪽 정부 당국 및 여론의 동향, 그리고 불인(仏印) 병력 증주(増駐)의 두 점에 있다.\n\n「ハ」는 회담 모두(冒頭)부터 침통한 표정으로 곧바로 수상 성명（왕전 제1222호 참조）에 언급하고, 대통령이 급거 화부(華府)로 돌아간 것도 하나는 이에 기인한다는 뜻을 말하였으므로（본사 등이 국무성에 갔을 때 신문기자는 물론 성원(省員)의 일부까지 통로에 몰려들어, 암묵 중에 화전(和戦)의 위기가 곧 결정되는 것으로 해석하는 듯한 삼엄한 광경을 보였다）, 본사 등은 이른바 수상의 성명이 왜곡되고 또한 과장되어 있는 것이라 믿는다는 뜻을 말하고, 본래 누구의 연설이라 하더라도 단지 어느 한 점만을 들고 그 전문을 보이지 않을 경우에는 연설자의 본의와 반대의 취지로 해석되는 경우가 허다함을 지적하며 위 성명의 전문을 취하는 중이라는 뜻을 말하였다. 그러자 장관도 점차 진정된 기색을 보였으나, 최근 본사 등과의 교섭 개시 이래 일본 측 요인으로부터 이를 지지하고 또한 국면 타개를 용이하게 할 만한 아무런 언설도 들을 수 없는 것은 매우 유감이며 그 때문에 「ハ」가 국내로부터 갖가지 비난 공격을 받아 매우 궁지에 서 있다고 그 궁상을 털어놓고, 지난번 대통령이 말한 대로 4년 남짓의 일지사변(日支事変)을 거쳐 우리 국민이 이상(異状)한 긴장 상태에 있는 점은 충분히 양해하나 일본 측에서도 본 교섭 성립에 의해 태평양의 평화 확립을 희망하는 듯하다고 부연·반복하였으며, 「ハ」는 본사 등의 노력에 성원을 보내 주기를 절망(切望)해 마지않는다는 뜻을 말하였다.\n\n또 불인 병력 증주 문제에 관해서는, 미국 정부로서도 지난 며칠에 걸쳐 불인 및 지나(支那) 연안 지방에 주재하는 미국 관헌 등으로부터 일본 해륙 병력 이동의 모양, 각종 병기 육양(陸揚)의 상황, 운송선의 움직임 등에 관해 시시각각 전보를 접하고 있고 그 행선지（태국뿐 아니라 남서태평양의 여러 지역에 관해서도 우려하고 있는 듯이 여겨진다）등에 관해서도 매우 우려하고 있는 터로서, 이러한 사태를 앞에 두고 우리나라 해륙의 책임자가 어떠한 준비를 진행해야 할 것인가는, 처지를 바꾸어 일본 해륙군이 동일한 정세에 임한 경우를 가상해 본다면 충분히 [223면]양해될 바일 것이라고 말하였다. 그리고 여러 차례 설명한 대로 위 일본군의 진주가 침략적 의도에서 나온 것이 아니라 하더라도 주위의 관계 각국은 모두 해륙의 병력을 그 방면에 결집하여 이에 대비하지 않을 수 없게 되고 그 결과 간접적으로 「ヒトラーズム」(히틀러리즘, Hitlerism)을 원조하는 것이 되고 있는 터에 관해서는 거듭 주의를 환기하고 싶으며, 일본의 언론·행동이 모두 위와 같은 형편인 오늘에 있어서는 국면 타개를 위해 전혀 손쓸 도리도 없게 되어 있다는 뜻을 역설하였다.\n\n장관은, 일미의 파국이 양국을 위해서는 물론 세계를 위해서도 최대의 불행이며 요컨대 일미 전쟁은 건설적이 아니라 파괴적이라는 것은 충분히 양해하고 있고 따라서 본 교섭 성립을 위해 여전히 열의를 가지고 있으나, 위에서 설명한 바와 같은 사정으로 이 나라와 같은 국풍(国柄)에서는 장관 및 대통령의 입장도 매우 곤란한 바가 있는 듯하였다. 본사 등이 6월 21일 안 및 9월 25일 안도 모처럼 그만큼 다 되어 있었는데 이때 이를 전혀 무용으로 돌리는 것은 서로에게 매우 유감이라 해야 할 것이라고 말하자 대체로 동감의 표정을 보였으나, 최근의 일본 측 정세 및 미국의 국론에 비추어 이번과 같은 제안으로 복귀하지 않을 수 없게 된 터임을 말하였다. 다시 본사 등이 문제의 배후에는 늘 지나 문제가 존재함을 지적하고, 본사 등이 종래 거듭 말씀드린 화부회의(華府会議) 이래의 쓰라린 경험에도 비추어 최근 귀 제안과 같은 기초 위에서는 일지 화평은 도저히 바라기 어려우며, 지나를 못 본 체 죽게 한다느니 하는 논의도 있는 모양이나 거꾸로 일미 양국이 지나 문제 때문에 각각 자국을 못 본 체 죽게 하는 것과 같은 일은 단연코 피해야 할 바가 아니겠느냐고 말한 데 대하여, 장관은 이를 수긍하였으나 이미 말한 바와 같은 당면의 정세에 비추어 일본 측에서 우선 언론 개선 등에 의해 어떻게든 위 타개의 방도에 나서 주기를 절망한다는 뜻을 거듭 말하였다.", "secondary": "[222면]\n貴電第八五七号訓令ノ次第一日本使来栖大使ト共ニ「ハル」長官ニ会見口頭申入ヲ了セリ長官ノ応答ハ要スルニ従来反覆説明ノ範囲ヲ出テスシテ其ノ力点ハ我方政府当局及輿論ノ動向並仏印兵力増駐ノ二点ニ存ス「ハ」ハ会談冒頭ヨリ沈痛ナル表情ヲ以テ早速首相声明（往電第一二二二号参照）ニ言及シ大統領モ急遽帰華セルモ一ハ之ニ基ク旨ヲ述ヘタルヲ以テ（本使等ノ国務省ニ赴クヤ新聞記者ハ勿論省員ノ一部スラ通路ニ蝟集シ暗黙ノ間ニ和戦ノ危機直ニ決セラルルモノト解スルカ如キ物々シキ光景ヲ呈セリ）本使等ヨリ所謂首相ノ声明カ歪曲且誇張セラレオルモノト信スル旨ヲ述ヘ本来何人ノ演説ト雖モ単ニ或一点ノミヲ挙ケ其ノ全文ヲ示ササルニ於テハ演説者ノ本意ト反対ノ趣旨ニ解セラルル場合多々アルヲ指摘シ右声明ノ全文取寄中ナル旨ヲ述ヘタル処長官モ次第ニ沈静ノ色ヲ示シタルカ最近本使等トノ交渉開始以来日本側要人ヨリ之ヲ支持シ且局面打開ヲ容易ナラシムルカ如キ何等ノ言説ヲ聞クヲ得サルハ頗ル遺憾ニシテ之カ為メ「ハ」カ国内ヨリ種々非難攻撃ヲ受ケ頗ル窮地ニ立チオル窮状ヲ打チアケ過般大統領所説ノ如ク四年有余ノ日支事変ヲ経テ我国民カ異状ノ緊張状態ニ在ル点ハ充分了承スルモ日本側ニ於テモ本交渉成立ニ依リ太平洋ノ平和確立ヲ希望スルカ如シト敷衍反覆セラレ「ハ」ハ本使等ノ努力ニ声援ヲ与ヘラレンコトヲ切望シテ已マサル旨ヲ述ヘタリ又仏印兵力増駐ノ問題ニ関シテハ米国政府トシテモ過去数日ニ亘リ仏印及支那沿岸地方駐在ノ米国官憲等ヨリ日本海陸兵力移動ノ模様各種兵器陸揚ノ状況運送船ノ動キ等ニ関シ刻々電報ニ接シオリ其ノ行先（泰国ノミナラス南西太平洋ノ諸地域ニ関シテモ懸念シオル如ク思ハル）等ニ付テモ頗ル懸念シオル次第ニシテ右様事態ヲ前ニシ我国海陸ノ責任者カ如何ナル準備ヲ進ムヘキヤハ地ヲ換ヘテ日本海陸軍カ同一情勢ニ臨メル場合ヲ仮想セラルルニ於テハ充分[223면]了解セラルル所ナルヘシト述ヘ累次説明ノ如ク右日本軍ノ進駐カ侵略的意図ニ出テオルモノニ非ストスルモ周囲ノ関係各国ハ何レモ海陸ノ兵力ヲ同方面ニ結集シテ之ニ備ヘサルヘカラサルコトトナリ其ノ結果間接ニ「ヒトラーズム」ヲ援助スルコトトナリ居ル次第ニ付テハ繰返シ注意シタク日本ノ言論、行動共ニ叙上ノ有様ナル今日ニ於テハ局面打開ノ為メ全ク手ノ下シ様モナキコトトナリ居ル旨力説セリ\n長官ハ日米ノ破局カ両国ノ為ハ勿論世界ノ為メ最大ノ不幸ニシテ要スルニ日米戦争ハ建設的ニアラスシテ破壊的ナルコトハ充分了解シ居リ従ツテ本交渉成立ノ為メ不相変熱意ヲ有シ居ルモ上述説明ノ如キ事情ニテ当国ノ如キ国柄ニ於テ長官及大統領ノ立場モ頗ル困難ナルモノアルモノノ如ク本使等ヨリ六月二十一日案及九月二十五日案モ折角アレ迄出来上リ居リ此ノ際之ヲ全然無用ニ帰セシムルカ如キハ御互ニ頗ル遺憾トスヘシト述ヘ大体同感ノ表情ヲ示シタルモ最近ニ於ケル日本側ノ情勢及米国ノ国論ニ鑑ミ今次ノ如キ提案ニ復帰セサルヲ得サルニ至リタル次第ヲ述ヘ更ニ本使等カ問題ノ背後ニハ常ニ支那問題存スルコトヲ指摘シ本使等カ従来繰返シ申述ヘタル華府会議以来ノ苦キ経験ニモ鑑ミ最近御提案ノ如キ基礎ニ於テハ日支和平ハ到底望ミ難ク支那見殺シ云々ノ論議モ之レ有ルヤノ趣ナルカ逆ニ日米両国カ支那問題ノ為ニ各々自国ヲ見殺シニスルカ如キハ断シテ避クヘキ所ニアラスヤト述ヘタルニ対シ長官ハ之ヲ首肯シタルカ既ニ申述ヘタルカ如キ当面ノ情勢ニ鑑ミ日本側ニ於テ先ツ言論改善等ニ依リ何トカ右打開ノ方途ニ出テラレンコトヲ切望スル旨繰返シ申述ヘタリ", "notes": ["「ハ」는 전보문에서 「ハル」(헐)을 줄여 쓴 것이다.", "「本使」는 발신자인 노무라 자신을 가리킨다."], "warn": false, "pages": ["nichibei2_05_039", "nichibei2_05_040"], "search": "野村吉三郎 (노무라 기치사부로) 来栖三郎 (구루스 사부로) 東郷茂徳 (도고 시게노리) ハル / Cordell Hull (헐) ルーズヴェルト / Franklin D. Roosevelt (루스벨트) 東條英機 (도조 히데키)"}, {"id": "434", "order": 434, "date": "1941-12-01", "group": "A", "eyebrow": "문서 434 · 「東条首相演説」等に対する米国側の反応について", "title": "「도조 수상 연설」 등에 대한 미국 측의 반응에 관하여", "list_right": "문서 434", "meta": [{"k": "일자", "v": "1941-12-01"}, {"k": "원문 표기", "v": "昭和16年12月1日"}, {"k": "전보번호", "v": "第一二二六号（大至急）"}, {"k": "발신", "v": "在米国野村大使 (주미 노무라 대사)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 12月1日後発 / 本省 12月2日後着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "「東条首相演説」等に対する米国側の反応について", "txt": true, "wide": true}], "summary": "노무라가 12월 1일자 미국 신문의 논조를 모아 보고한다. 도조 연설과 안도 익찬회 부총재 연설이 나란히 실렸고, 루스벨트의 급거 귀환과 겹쳐 큰 파장을 낳았다는 것이다.", "points": ["1일자 각 신문이 도조 연설에 이어 안도(安藤) 익찬회 부총재의 30일 연설을 실었다. 독이(独伊)와의 동맹 관계를 재강조하고 미국을 동아공영권 확립의 최대 장애물로 지목한 대목을 특보했다고 적는다.", "대통령이 웜스프링스 휴가를 앞당겨 끊고 돌아가기로 한 것은, 30일 헐이 전화로 도조 연설의 강경한 언사를 전하고 극동 정세의 급박을 알린 데 따른 것이라는 보도가 많다고 한다.", "그 연설이 11월 26일자 미국 측 대일 공문서에 대한 일본 정부의 거부적 태도를 표시하는 것이라고 읽히고 있다고 적는다. 헐 노트를 「二十六日付米側対日公文書」라 부른다.", "같은 날 도쿄발 UP는 일본이 미국 회답에 불만이나 최소 2주 교섭 연장을 희망한다는 관변 담화를 전했다. 수상 연설 내용과 어긋나 이상한 인상을 준다고 적는다.", "일부 신문은 일본의 태국 침략이 기정 계획이므로 그런 신출도 결국 유럽 정세를 곁눈질한 지연책일 것이라고 관측한다."], "primary": "[223면]\n왕전(往電) 제1222호에 관하여\n\n1일자 각 신문은 이번 도조(東条) 수상의 연설에 이어 안도(安藤) 익찬회(翼賛会) 부총재의 30일 연설을 실었고, 특히 동 부총재가 독이(独伊)와의 동맹 관계를 재강조하고 미국을 동아공영권 확립상 최대의 장애물로 삼은 [224면]것을 특보하였다. 이는 대통령의 「ウォームスプリング」(웜스프링스, Warm Springs)로부터의 급거 귀화(帰華) 결정 및 29일과 30일에 걸친 「ハル」(헐, Hull) 장관과 영국대사의 회견 속행과 더불어 일반의 주목을 끌고 있다. 각 신문의 보도 양상을 종합하건대, 대통령이 특별히 휴가를 앞당겨 끊고 귀화하기로 결정한 것은 30일 「ハル」 장관이 전화로 도조 수상 연설 가운데의 강경한 언사를 전하고 극동 정세의 급박을 알린 데 따른 것이라 하는 것이 많다. 또 정부 부내에서도 각별한 비평은 삼가고 있으나, 위 연설이 26일자 미국 측 대일 공문서에 대한 일본 정부의 거부적 태도를 표시하는 것으로서 일본이 마침내 동 회담에 트집을 잡고 무언가 강경 수단에 나서는 전제가 아니겠느냐고 해석되고 있는 듯한 보도를 하여, 일반에 다대한 반영(反影)을 주고 있다.\n\n또한 1일자 각 신문은 도쿄발 UP로써, 우리 쪽이 미국 측 회답에는 불만족스러우나 다시 적어도 2주간 교섭 연장의 희망이 있다는 관변(官辺)의 담화라는 것을 보도하였다. 이는 위 수상의 연설 내용에 비추어 이상한 느낌을 주고 있는데, 일부 신문은 일본의 「タイ」(태국, Thailand) 침략은 기정 계획이므로 이런 종류의 신출(申出)도 결국 유럽 정세와 견주어 본 일본 측의 천연책(遷延策)에 지나지 않을 것이라고 관측하고 있다.", "secondary": "[223면]\n往電第一二二二号ニ関シ\n一日ノ各紙ハ今次東条首相ノ演説ニ引続キ安藤翼賛会副総裁ノ三十日演説ヲ掲ケ特ニ同副総裁カ独伊トノ同盟関係ヲ再強調シ米国ヲ以テ東亜共栄圏確立上最大ノ障害物トナセ[224면]ルコトヲ特報シ右ハ大統領ノ「ウォームスプリング」ヨリノ急遽帰華決定及二十九日及三十日ニ亘ル「ハル」長官ト英大使トノ会見続行ト共ニ一般ノ注目ヲ惹キ居ル処各紙ノ報道振リヲ総合スルニ大統領カ特ニ休暇ヲ切上ケ帰華ニ決定セルハ三十日「ハル」長官ヨリ電話ニテ東条首相演説中ノ強硬言辞ヲ伝ヘ極東情勢ノ急迫ヲ報セルニ依ルモノトスルモノ多ク又政府部内ニ於テモ格別ノ批評ハ差控ヘ居ルモ右演説カ二十六日付米側対日公文書ニ対スル日本政府ノ拒否的態度ヲ表示スルモノトシテ日本カ愈同会談ニ物言ヲツケ何等強硬手段ニ出ツル前提ナラスヤト解セラレ居ルカ如キ報道ヲ為シ一般ニ多大ノ反影ヲ与ヘ居レリ\n尚一日ノ各紙ハ又東京発UPヲ以テ我方カ米側回答ニハ不満足ナルモ更ニ少クトモ二週間交渉延長ノ希望アリトノ官辺ノ談話ナルモノヲ報シ右首相ノ演説内容ニ照シ異様ノ感ヲ与ヘ居ルカ一部新聞ハ日本ノ「タイ」侵略ハ既定計画ナルヲ以テ此ノ種申出モ結局欧州情勢ト睨ミ合セタル日本側ノ遷延策ニ外ナラサルヘシト観測シ居レリ", "notes": ["「帰華」는 워싱턴(華府)으로 돌아간다는 뜻이다.", "원문의 「反影」은 지면 그대로다. 「반향」의 뜻으로 쓰였다.", "「二十六日付米側対日公文書」가 헐 노트다. 원문은 「최후통첩」이라 부르지 않는다."], "warn": false, "pages": ["nichibei2_05_040", "nichibei2_05_041"], "search": "野村吉三郎 (노무라 기치사부로) 東郷茂徳 (도고 시게노리) 東條英機 (도조 히데키) 安藤翼賛会副総裁 (안도 익찬회 부총재) ハル / Cordell Hull (헐) ルーズヴェルト / Franklin D. Roosevelt (루스벨트)"}, {"id": "435", "order": 435, "date": "1941-12-01", "group": "A", "eyebrow": "문서 435 · 局面打開のため首脳会談再検討方意見具申", "title": "국면 타개를 위한 수뇌회담 재검토에 관한 의견 구신(具申)", "list_right": "문서 435", "meta": [{"k": "일자", "v": "1941-12-01"}, {"k": "원문 표기", "v": "昭和16年12月1日"}, {"k": "전보번호", "v": "第一二二七号（極秘、館長符号）"}, {"k": "발신", "v": "在米国野村大使 (노무라 주미대사)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 12月1日後発 / 本省 12月2日後着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "局面打開のため首脳会談再検討方意見具申", "txt": true, "wide": true}], "summary": "노무라 대사가, 미국 측이 여전히 원칙론을 고집하나 교섭 계속은 희망하고 있으므로, 이 기회에 양국 정부 수뇌 또는 그 대표자가 호놀룰루 같은 중간 지점에서 회견하여 최종 타결을 시도하자고 본국에 건의하고, 정부 이름으로 제의해도 좋을지 회훈을 청한 전보.", "points": ["미국 측 의향은 여전히 원칙적 주장을 고집하나 교섭은 계속하고 싶어 한다고 관측.", "종래처럼 이론이나 지난 경위에 얽매여서는 오늘 이상의 진전을 기대하기 어렵다고 판단.", "양국 정부 수뇌자의 출마(出馬)가 곤란하면 가장 신뢰하는 대표자끼리의 회견을 제안.", "미국 측 예시로 「ウォレス」(월리스) 부통령 또는 「ホプキンス」(홉킨스), 일본 측 예시로 루스벨트 대통령과 면식이 있고 그가 경의를 표하는 고노에 전 수상 또는 이시이 추밀고문관을 든다.", "양국 육해군 수뇌자를 수행시켜 「ホノルル」(호놀룰루) 같은 중간 지점에서 회견, 쌍방 최근의 대안(對案)을 의제의 기초로 삼아 최종 타결 노력을 시도하자는 안.", "이는 화(和)·전(戰) 어느 쪽으로 결정하기 위해서도 유리한 안이라고 진언.", "다만 앞서 고노에 총리·루스벨트 대통령 회견이 성립되지 못한 경위와 그것이 일본 내정에 미친 영향에 비추어 신중한 고려가 필요함을 인정.", "정부 이름으로 미국 측 의향을 확인하는 것이 가장 유효하나, 내정상 곤란하면 우선 대사 개인의 착상으로서 타진하고, 미국 측이 응하면 정부 이름으로 제의해도 좋을지 회전(回電)을 청함."], "primary": "[224면]\n제一二二七호（극비, 관장부호）\n\n미국 측 의향은 여전히 원칙적 주장을 고집하고 있으나 교섭은 계속하고 싶다는 희망인 바, 종래와 같이 이론이나 지난 경위에 붙잡혀 있어서는 도저히 오늘 이상의 진전을 기대하기 어려우므로, 다시 대국적 견지에서 정치적 타개의 길을 강구하기 위하여, 이 기회에 양국 정부 수뇌자의 출마(出馬)가 곤란하다면 그 가장 신뢰하는 대표자（예컨대 미국 측에서는 부통령 「ウォレス」(월리스, Wallace) 또는 「ホプキンス」(홉킨스, Hopkins), 우리 쪽에서는 「ロ」(루, 루스벨트) 대통령과 서로 아는 사이로서 그가 경의를 표하고 있는 고노에(近衛) 전 수상 또는 이시이(石井) 추밀고문관과 같은 이）에게 양국 육해군 수뇌자를 수행시켜, 「ホノルル」(호놀룰루)와 같은 중간 지점에서 회견한 위에 피아(彼我) 최근의 대안(對案)을 의제의 기초로 하여 최종적 타결의 노력을 시도하는 것이, 화(和)·전(戰) 어느 쪽으로 결정하기 위해서도 유리한 하나의 안이라고 생각됩니다.\n\n다만 위의 것은 앞서 고노에 총리와 「ロ」 대통령의 회견이 성립되지 못하였던 경위 및 그것이 우리 내정상에 미친 영향에도 비추어, 혹은 미국 측의 의[225면]향을 확인할 필요가 있을 뿐만 아니라, 또한 이에 의한 타결의 성부(成否)도 미지수이므로 신중한 고려를 요함은 물론이나, 시국 타개를 위해서는 이 기회에 가능한 모든 수단을 시도하는 것이 무익하지 않다고 생각되는 바, 정부의 이름으로 위에 관한 미국 측 의향을 확인하는 것이 가장 유효할 것이나 우리 내정상 등의 사정으로 재미없다고 하신다면, 일단 본 대사 한도의 착상으로서 상대방의 의향을 타진하고, 미국 측이 이에 응하는 경우에는 정부의 이름으로 이를 제의하여도 지장이 없는지 여부, 어떻게 할 것인지의 건에 관하여 의향을 즉시 회전(回電)하여 주시기 바랍니다.", "secondary": "[224面]\n第一二二七号（極秘、館長符号）\n米側意向ハ依然トシテ原則的主張ヲ固執スルモ交渉ハ継続シタキ希望ナル処従来ノ如ク理論ヤ行懸リニ捉ハレ居リテハ到底今日以上ノ進展ヲ期シ難キヲ以テ更ニ大局的見地ヨリ政治的打開ノ道ヲ講スル為此ノ際両国政府首脳者ノ出馬困難ナラハ其ノ最モ信頼スル代表者（例ヘハ米側ニテハ副大統領「ウォレス」又ハ「ホプキンス」我方ニテハ「ロ」大統領ノ相識ノ間柄ニシテ敬意ヲ払ヒ居ル近衛前首相又ハ石井枢密顧問官ノ如キ）ニ両国陸海軍ノ首脳者ヲ随行セシメ「ホノルル」ノ如キ中間地点ニ於テ会見ノ上彼我最近ノ対案ヲ議題ノ基礎トシテ最終的妥結ノ努力ヲ試ミルコト和戦何レカニ決スル為ニモ有利ナル一案ト存セラル\n尤モ右ハ曩ニ近衛総理「ロ」大統領会見カ不成立トナレル経緯及之カ我内政上ニ及ホセル影響ニモ鑑ミ或ハ米側ノ意[225面]向ヲ確ムルノ必要アルノミナラス又之ニ依リ妥結ノ成否モ未知数ナルヲ以テ慎重考慮ヲ要スルハ勿論ナルカ時局打開ノ為ニハ此ノ際有ラユル可能ノ手段ヲ試ミルコト無益ナラスト存セラルル処政府ノ名ニ於テ右ニ関スル米側意向ヲ確ムルコト最モ有効ナルヘキモ我内政上等ノ都合ニテ面白カラストセハ一応本使限リノ思付トシテ先方ノ意向ヲ打診シ米側カ之ニ応スル場合ニハ政府ノ名ニ於テ之ヲ提議シ差支ナキヤ否ヤ何分ノ儀御意向折返シ御回電請フ", "notes": [], "warn": false, "pages": ["nichibei2_05_041", "nichibei2_05_042"], "search": "野村吉三郎 (노무라 기치사부로) — 주미대사 東郷茂徳 (도고 시게노리) — 외무대신 「ウォレス」(월리스, Henry A. Wallace) — 미국 부통령 「ホプキンス」(홉킨스, Harry Hopkins) 「ロ」大統領 (루스벨트, Franklin D. Roosevelt) 近衛文麿 (고노에 후미마로) — 전 수상 石井菊次郎 (이시이 기쿠지로) — 추밀고문관"}, {"id": "436", "order": 436, "date": "1941-12-01", "group": "A", "eyebrow": "문서 436 · 首相演説等に関し意見具申", "title": "수상 연설 등에 관한 의견 구신(具申)", "list_right": "문서 436", "meta": [{"k": "일자", "v": "1941-12-01"}, {"k": "원문 표기", "v": "昭和16年12月1日"}, {"k": "전보번호", "v": "第一二三〇号（極秘、館長符号）"}, {"k": "발신", "v": "在米国野村大使 (노무라 주미대사)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 12月1日後発 / 本省 12月2日後着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "首相演説等に関し意見具申", "txt": true, "wide": true}], "summary": "노무라 대사가, 도조 수상과 가야·스즈키 두 각료의 연설이 미국 측에 배외(排外)·영미 타도 연설로 전해져 대일 의혹을 한층 강화시켰으며, 미국 측은 11월 26일 문서 수교 후 일본의 회답을 긴장 속에 기다리던 참이라 이 연설을 특히 중대시하고 있다고 보고하고, 앞으로 각료의 외교 문제 발언에 각별한 주의를 기울여 달라고 진언한 전보.", "points": ["귀전 제八六五호에 관한 회답.", "대통령의 워싱턴 귀임(帰華) 직접 이유는 왕전 제一二二二호 등으로 보고한 바와 같음.", "원래 미국 측의 대일 시의(猜疑)는 도조 수상의 의회 연설을 비롯해 대정익찬회·지방장관회의 등에서의 가야·스즈키 두 각료의 연설이 영미 타도에 역점을 둔 배외 연설로 전해져 한층 강화되었다.", "최근 불인(仏印) 방면 병력 증강 보도로 일본의 진의를 더욱 의심하던 차에, 이번 도조 수상 연설이 「동아에서 영미를 구축하겠다」는 취지로 전해졌다.", "11월 26일자 대일 공문서 수교 후 일본 회답을 긴장하며 대기 중이던 미국 측은 이 연설을 특히 중대시한 것으로 인정된다.", "미국 정부는 일본이 미국 측 조건을 거부하고 군사 행동에 나설 전조가 아닌가 보았을 수도 있으며, 일부 신문은 연설을 문자 그대로 해석하면 전쟁을 의미한다고까지 극론했다.", "미국에서는 외교 문제에 관한 대통령 연설이 신중을 기하며 국책의 동향을 보이는 것으로 늘 중시되므로, 그런 관념으로 수상 연설을 읽은 미국민이 그런 인상을 갖게 된 것은 오히려 당연하다.", "각료가 외교 문제에 관해 의사 표시를 하는 경우 각별한 유의를 바라며, 최악의 경우에도 우리 주장의 공정함을 국내외에 인상 지우도록 지금부터 주도(周到)한 주의를 기울여 둘 것을 진언."], "primary": "[225면]\n제一二三〇호（극비, 관장부호）\n\n귀전 제八六五호에 관하여.\n\n대통령이 워싱턴(華盛頓)으로 돌아온 직접의 이유에 대해서는 왕전(往電) 제一二二二호 등으로 보고한 바와 같습니다만, 원래 미국 측이 우리 쪽에 대하여 품고 있는 시의(猜疑)는, 도조(東條) 수상의 의회 연설을 비롯하여 대정익찬회(大政翼賛会), 지방장관회의 등에서의 가야(賀屋)·스즈키(鈴木) 두 각료의 연설이 영미 타도에 역점을 둔 배외(排外) 연설인 것처럼 전해졌기 때문에 한층 강화되었고, 다시 지난번 이래 불인(仏印) 방면의 병력 증강 보도에 의하여 더욱더 일본의 진의를 의심하고 있던 참에, 이번 도조 수상 연설이 동아(東亜)로부터 영미를 구축(駆逐)하여야 한다는 취지로 전해졌기 때문에, 26일자 대일 공문서를 수교한 뒤 우리 쪽 회답을 긴장하여 기다리고 있던 미국 측으로서는 그 연설을 특히 중대시한 것으로 인정됩니다（혹은 미국 정부에서는 마침내 일본이 미국 측 조건을 거부하고 어떠한 군사 행동에 나서는 전제(前提)가 아닌가 하고 간주하였을지도 모르며, 일부 신문은 그 연설을 문자 그대로 해석하면 전쟁을 의미한다고까지 극론(極論)하였습니다）.\n\n또한 이 나라에서는 외교 문제에 관한 대통령의 연설에는 신중을 기하고 있고, 또 그것은 국책의 동향을 보이는 것으로서 항상 중요시되고 있음은 아시는 바와 같으며, 그러한 관념으로 수상의 연설을 읽은 이 나라 국민으로서 위와 같은 인상을 품기에 이른 것은 오히려 당연하다고 하여야 할 것입니다.\n\n따라서 이미 충분히 조치가 되어 있는 일로 생각합니다만, 목하(刻下)의 중대한 시기에 즈음하여 수상 또는 각료가 외교 문제에 관하여 무언가 의사 표시를 하시는 경우에는 그 점에 충분히 유의하여 주시기 바라며, 최악의 경우에 있어서도 우리 쪽 주장이 공정함을 중외(中外)에 인상 지우도록 오늘[226면]부터 주도(周到)한 주의를 기울여 두는 것이 마땅할 것으로 사료됩니다.", "secondary": "[225面]\n第一二三〇号（極秘、館長符号）\n貴電第八六五号ニ関シ\n大統領帰華ノ直接ノ理由ニ付テハ往電第一二二二号等報告ノ通リナルカ元来米側ノ我方ニ対スル猜疑ハ東条首相ノ議会演説ヲ始メ大政翼賛会、地方長官会議等ニ於ケル賀屋、鈴木両閣員ノ演説カ英米打倒ヲ力点トセル排外演説ナルカノ如ク伝ヘラレタル為メ一層強メラレ更ニ過般来仏印方面兵力増強ノ報ニ依リ益々日本ノ真意ヲ疑ヒ居リタル矢先今次東条首相演説カ東亜ヨリ英米ヲ駆逐スヘシトノ趣旨ヲ伝ヘラレタル為メ二十六日付対日公文書手交後ノ我方回答ヲ緊張待機中ノ米側トシテハ同演説ヲ特ニ重大視セルモノト認メラル（或ハ米政府ニテハ愈々日本カ米側条件ヲ拒否シ何等カノ軍事行動ニ出ツル前提ナラスヤト看做セルヤモ知レス一部新聞ハ同演説ヲ文字通リ解釈セハ戦争ヲ意味ストスラ極論セリ）\n尚当国ニ於テハ外交問題ニ関スル大統領ノ演説ニハ慎重ヲ期シ居リ又右ハ国策ノ動向ヲ示スモノトシテ常ニ重要視セラレ居ルコト御承知ノ通リニシテ斯カル頭ニテ首相ノ演説ヲ読メル当国民トシテ右様印象ヲ抱クニ至レルハ寧ロ当然ト言フヘシ\n就テハ既ニ充分ノ手配済ノコトトハ存スルモ刻下ノ重大時機ニ当リ首相又ハ内閣員ニ於テ外交問題ニ関シ何等意思表示セラルル場合ニハ其ノ辺充分御留意ヲ得度ク最悪ノ場合ニ於テモ我方主張ノ公正ナルヲ中外ニ印象セシムル様今日[226面]ヨリ周到ノ注意ヲ払ヒ置クコト然ルヘキヤニ思考セラル", "notes": [], "warn": false, "pages": ["nichibei2_05_042", "nichibei2_05_043"], "search": "野村吉三郎 (노무라 기치사부로) — 주미대사 東郷茂徳 (도고 시게노리) — 외무대신 東条英機 (도조 히데키) — 수상 賀屋興宣 (가야 오키노리) — 대장대신 鈴木貞一 (스즈키 데이이치) — 기획원 총재 「ロ」大統領 (루스벨트, Franklin D. Roosevelt)"}, {"id": "437", "order": 437, "date": "1941-12-01", "group": "A", "eyebrow": "문서 437 · ウェルズ国務次官との会談予定について", "title": "웰스 국무차관과의 회담 예정에 관하여", "list_right": "문서 437", "meta": [{"k": "일자", "v": "1941-12-01"}, {"k": "원문 표기", "v": "昭和16年12月1日"}, {"k": "전보번호", "v": "第一二三一号（極秘、館長符号）"}, {"k": "발신", "v": "在米国野村大使 (노무라 주미대사)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 12月1日後発 / 本省 12月2日後着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "ウェルズ国務次官との会談予定について", "txt": true, "wide": true}], "summary": "미국 측의 요청으로 노무라 대사와 구루스 대사가 12월 2일 오전 10시 15분에 웰스 국무차관과 회견할 예정임을 보고한 짧은 전보.", "points": ["회견은 상대방(미국 측)의 요구에 의한 것.", "본사(노무라 대사)가 구루스(来栖) 대사와 함께 나감.", "일시는 명 2일 오전 10시 15분.", "상대는 「ウェルズ」(웰스, Welles) 국무차관.", "「ハル」(헐, Hull) 장관은 감기로 등청이 곤란하다는 것."], "primary": "[226면]\n제一二三一호（극비, 관장부호）\n\n상대방의 요구에 의하여 본사(本使)는 구루스(来栖) 대사와 함께 내일 2일 오전 10시 15분에 「ウェルズ」(웰스, Welles) 차관과 회견할 예정입니다（「ハル」(헐, Hull) 장관은 감기 때문에 등청(登庁)이 곤란하다고 합니다）.", "secondary": "[226面]\n第一二三一号（極秘、館長符号）\n先方ノ求ニヨリ本使来栖大使ト共ニ明二日午前十時十五分「ウェルズ」次官ト会見ノ予定ナリ（「ハル」長官ハ風邪ノ為登庁困難ナリトノコトナリ）", "notes": [], "warn": false, "pages": ["nichibei2_05_043"], "search": "野村吉三郎 (노무라 기치사부로) — 주미대사 来栖三郎 (구루스 사부로) — 특파대사 東郷茂徳 (도고 시게노리) — 외무대신 「ウェルズ」(웰스, Sumner Welles) — 미 국무차관 「ハル」(헐, Cordell Hull) — 미 국무장관"}, {"id": "438", "order": 438, "date": "1941-12-02", "group": "A", "eyebrow": "문서 438 · ウェルズ国務次官との会談の際手交された仏印兵力増強に関する米国側覚書について", "title": "웰스 국무차관과의 회담 때 수교된 불인(仏印) 병력 증강에 관한 미국 측 각서에 관하여", "list_right": "문서 438", "meta": [{"k": "일자", "v": "1941-12-02"}, {"k": "원문 표기", "v": "昭和16年12月2日"}, {"k": "전보번호", "v": "第一二三二号（極秘、館長符号） / 別電 第一二三三号（極秘、館長符号）"}, {"k": "발신", "v": "在米国野村大使 (노무라 주미대사)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "발신·착신", "v": "第一二三二号: ワシントン 12月2日前発 / 本省 12月3日前着 ; 別電第一二三三号: ワシントン 12月2日後発 / 本省 12月3日後着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "ウェルズ国務次官との会談の際手交された仏印兵力増強に関する米国側覚書について", "txt": true, "wide": true}], "summary": "12월 2일 노무라·구루스 두 대사가 웰스 국무차관과 회견하여, 대통령의 직접 명에 의한 남부 불인 일본군 증강에 관한 미국 측 각서를 수교받은 경위와 회담 내용을 보고하고, 미국 측도 평화적 수습과 급속한 타결을 희망하고 있음이 관취되므로 회답 전의(詮議) 시 이 점을 고려해 달라고 요청한 전보. 별전으로 미국 측 각서 원문(영문)과 그 부기 번역문을 실었다.", "points": ["왕전 제一二三一호 관련. 2일 노무라 대사가 구루스 대사와 함께 웰스 국무차관과 회견.", "차관은 먼저 「대통령 직접의 명에 의한 것」임을 전제하고, 별전 제一二三三호의 각서를 낭독한 뒤 이를 수교했다.", "두 대사는 불인 진주에 관해 정부로부터 아무런 통보를 받지 못했다며 즉시 본국 정부에 전달하겠다고 답하고, 원래 11월 20일 제안이 바로 이런 사태를 고려한 것이었음을 설명.", "차관은 「세계의 어느 부분에서든 침략에 반대함을 건전(建前)으로 한다」는 미국의 입장을 양해해 달라고 답변.", "두 대사는 경제 전쟁도 「アグレッション」(어그레션)이며 무력 전쟁보다 더 신랄하다고 종래 누차 응수해 왔음을 상기시키고, 일본 국민이 경제 압박에 굴하느냐 돌파하느냐 둘 중 하나를 택할 수밖에 없는 처지임을 통감하고 있다고 진술.", "미국의 새 제안(11월 26일)을 그대로 심의의 기초로 수락함은 도저히 불가능하며, 6월 21일안·9월 25일안이 있고 쌍방 합의도 상당히 진전되었는데 이를 일척(一擲)하는 것은 원만·급속한 해결의 길이 아니라고 역설.", "일본은 일지사변 해결 또는 동아에 공정한 평화 확립 시 불인에서 철병할 것을 이미 제의하고 있으므로, 근본 문제가 해결되면 오늘 신청하신 문제도 자연히 해소될 성질이 아니냐고 언급.", "웰스 차관은 26일의 미국 제안이 요컨대 미국 국내 정세에 비추어 일단 미국의 근본적 건전(建前)을 명확히 해 둘 필요에서 나온 것이라고 응수하고, 곧 장관과도 상의하겠다고 답했다.", "차관은 일본 측이 26일 제안에 대한 회답 등에서 그러한 여지를 남겨 두기를 바라는 듯한 구문(口吻)을 흘렸다.", "1일 헐 장관과의 회견 및 이날 회견에 의하면 미국 측도 현하 난국의 평화적 수습을 희망하고 급속 타결을 바라고 있음이 충분히 관취되므로, 회답 전의 시 이 점을 고려해 달라고 요청.", "별전 제一二三三호는 루스벨트 대통령 명의의 각서로, 남부 불인 일본군의 급속·현저한 증강 보고, 비시 협정 한도 초과, 추가 침략(필리핀·동인도 제도·버마·말레이·태국) 우려, 독일의 유럽 정책과의 대비, 그리고 두 대사를 통해 일본 정부에 즉시 조회할 것을 요청하는 내용."], "primary": "[226면]\n제一二三二호（극비, 관장부호）\n\n왕전(往電) 제一二三一호에 관하여.\n\n2일 본사(本使)는 구루스(来栖) 대사와 함께 「ウェルズ」(웰스, Welles) 국무차관과 회견하였던바, 차관은 우선 이것이 대통령 직접의 명에 의한 것이라는 뜻을 전제하고 별전 제一二三三호의 각서를 낭독한 뒤 이를 수교(手交)하였으므로, 본사 등은 불인(仏印) 진주에 관해서는 아무런 정부의 통보도 받고 있지 않으니 신청하신 취지는 즉시 본국 정부에 전달하겠다고 말한 위에, 본래 우리 쪽이 11월 20일의 제안을 한 것은 전적으로 이러한 종류의 사태를 고려한 것이었다는 까닭을 진술하였습니다. 이에 대하여 차관은 세계의 어떠한 부분에 있어서도 침략에 반대하는 것을 건전(建前)으로 삼고 있는 미국의 입장을 잘 양해하여 주기 바란다고 답하였으므로, 본사 등은 미국 및 그 밖의 나라가 우리나라에 대하여 경제적 압력（경제 전쟁도 「アグレッション」(어그레션, aggression)이며 무력 전쟁보다도 한층 신랄한 것임은 종래 누차 응수해 두었습니다）을 가하기에 이른 경위 및 그 당부(當否)에 관해서는 여기서 논의할 시간을 갖지 못하나, 우리 국민으로서는 이 경제 압박에 직면하여 이에 굴복하느냐 또는 이를 돌파하느냐 [227면]둘 중 하나를 택하지 않을 수 없는 입장에 있음을 통감하고 있다는 것을 충분히 양해하여 주기 바라며, 지난번 대통령도 이해하신 바 4년에 걸친 사변을 계속해 온 우리나라 일반 민심의 상태와 아울러 생각하여 주기 바란다고 말해 두었습니다.\n\n다시 화제를 최근의 미국 제안으로 돌려, 제국 정부가 국운에 관한 중대 문제로서 본건을 신중히 심의를 거듭하고 있는 사정을 진술한 데 대하여 (차관은) 충분히 이를 양해하였고, 본사 등이 우리 쪽으로서는 그 새 제안을 적어도 그대로 심의의 기초로서 수락함은 도저히 불가능할 것이라고 역설하고, 이미 애써 만든 6월 21일안 및 그것을 가능한 한 받아들인 9월 25일안이 존재하고 쌍방의 합의도 상당히 진전되어 있음에도 불구하고 이를 일척(一擲)하고 이제 와서 새 제안에 의한 심의를 시도하는 것과 같음은 결코 교섭을 원만하고도 급속히 해결하는 길이 아닐 것이라고 설파하였으며, 본래 우리 쪽은 일지사변(日支事變)의 해결 또는 동아(東亜)에 공정한 평화가 확립될 경우에는 불인으로부터 철병할 것을 제의하고 있음에 비추어, 근본 문제의 해결을 보게 되면 오늘 신청하신 문제와 같은 것은 자연히 해소될 성질의 것이 아니겠는가 하고 말하였습니다. 이에 대하여 동 차관은 다대한 주의를 기울이면서, 26일의 미국 제안은 요컨대 미국의 국내 정세에도 비추어 일단 미국의 근본적 건전(建前)을 명확히 하여 둘 필요에서 나온 것이라는 뜻을 응수한 위에, 위 의견에 관해서는 즉시 장관과도 상의하겠다고 답하였고, 또한 일본 측이 26일의 미국 제안에 대한 회답 등에서 그러한 여지를 남겨 두기를 바라는 듯한 구문(口吻)을 흘렸습니다.\n\n1일의 「ハル」(헐, Hull) 장관과의 회견 및 금일의 회견에 의하면, 미국 측도 현하(現下) 난국의 평화적 수습을 희망하고 있음이 명백하며 급속한 타결을 도모하고자 하는 희망임이 충분히 관취(觀取)되므로, 미국 신제안에 대한 회답 및 별전 제一二三三호 각서에 대한 회답을 전의(詮議)하실 즈음에는 이 점을 충분히 고려에 넣어 주시기 바랍니다.\n\n（별 전）\n제一二三三호（극비, 관장부호）\n\n(1) 나는 지난 며칠 동안 일본군이 남부 인도차이나로 계속 이동하고 있다는 보고들을 받았다. 이들 보고는 일본이 인도차이나에 주둔시키고 있는 모든 종류의 병력이 매우 급속하고도 현저하게 증가하고 있음을 보여 준다.\n일본과 비시(Vichy) 프랑스 정부 사이의 협정——그 협정의 성질을 지금 논할 필요는 없다——의 조항에 의하여 인도차이나에 주둔이 허용된 일본군의 총수는, 이미 그곳에 있는 병력의 총량보다 훨씬 적었다는 것이 나의 명확한 이해였다.\n이렇게 증강된 일본군의 인도차이나 주둔은, 그 지역의 치안 유지를 위해서라면 그만한 수의 병력이 도저히 필요할 수 없는 이상, 일본이 그 병력을 한층 더한 침략의 목적에 사용하려는 것을 의미하는 듯이 보인다.\n그러한 침략은 필리핀 제도(諸島)를 향한 것일 수도, 동인도(東印度)의 수많은 섬들을 향한 것일 수도, 버마를 향한 것일 수도, 말레이를 향한 것일 수도 있으며, 또는 강제에 의하여서든 실제 무력의 사용에 의하여서든 태국(Thailand) 점령을 감행할 목적일 수도 있다.\n(2) 그러한 새로운 침략은 물론 이미 중국에 대하여 행해진 침략 행위에 더해지는 것이 될 터인바, 그에 대한 우리의 태도는 널리 알려져 있고 일본 정부에도 누차 표명되어 왔다. 일본 대사와 구루스 대사에게, 이미 취해진 조치의 실제 이유가 무엇인지, 그리고 인도차이나에서의 이 최근의 급속한 병력 집결로 드러난 일본 정부의 정책을 내가 무엇이라고 보아야 할 것인지를 즉시 일본 정부에 조회하도록 요청하여 주기 바란다. 본 정부는 지난 수년간 유럽에서, 동일한 성격의 군사적 조치를 이용하여 자유롭고 독립된 여러 민족의 영토와 권리를 끊임없이 그리고 착착 잠식해 온 독일 정부의 정책을 보아 왔다. 내가 일본 정부의 의도를 알고자 하는 것은 그 때문이며, 또한 미국 방위라는 광범한 문제 때문이다.\n\n[229면]（부 기）\n\n나는 지난 며칠에 걸쳐 남부 인도차이나에 대하여 일본 군대가 계속 이동하고 있다는 보고（복수）를 접수하고 있다. 위 보고는 인도차이나 주둔의 모든 종류의 일본 군대가 극히 급속하고도 현저하게 증가하고 있음을 말해 주는 것이다. 지금 여기서 일본국과 「ヴィシイ」(비시) 정부 간 협정의 성질을 논할 필요는 없으나, 동 협정의 여러 조항에 의하여 인도차이나에 주둔이 인정되어 있는 일본 군대의 총수는 이미 그곳에 있는 군대의 총수보다 훨씬 적은 수였다는 것이 내가 명료히 양해하고 있던 바이다.\n\n인도차이나에 대한 전기(前記)와 같은 일본 군대의 증주(增駐)는, 그러한 다수의 군대가 동 지역의 치안 유지를 위하여 필요하다고 될 수 없을 것임에 비추어, 다시 침략의 목적을 위하여 일본국에 의한 이들 군대의 사용을 의미하는 것과 같다.\n\n그러한 침략은 비도(比島, 필리핀), 난인(蘭印) 제도, 「ビルマ」(버마), 말레이 반도를 목적으로 하고, 또는 강제 혹은 무력 행사의 어느 것에 의하여 태국 점령 기도를 목적으로 하는 것이라고 상상할 수 있을 것이다.\n\n이미 지나(支那)에 대하여 행해지고 있는 침략 행위에 더하여 다시 이번에 새로이 침략 행위가 행해지려 하고 있다. 더욱이 지나에 대한 우리의 태도는 주지의 바이며 또한 일본국 정부에 대하여 누차 신입(申入)해 둔 바이다.\n\n일본국 대사 및 구루스 대사에 대하여, 이미 취해진 여러 조치의 참된 이유는 무엇인지, 아울러 나는 위와 같은 인도차이나에서의 최근의 급속한 군대 집결에 의하여 나타난 일본국 정부의 정책을 어떠한 것으로 생각하여야 할 것인지에 관하여 지급(至急) 일본국 정부에 조회하여 주기를 요청하기 바란다. 당 정부는 과거 수년간에 걸쳐 유럽에서 동일한 군사적 조치에 의하여 자유롭고도 독립된 여러 민족의 영토 및 권리를 부단히 그리고 착착 침략해 온 독일국 정부의 정책을 보아 왔다. 내가 일본국 정부의 의도를 알고자 하는 것은 위 이유에 의한 것이며, 또한 미국 국방이라는 광범한 문제 때문이다.", "secondary": "[226面]\n第一二三二号（極秘、館長符号）\n往電第一二三一号ニ関シ\n二日本使来栖大使ト共ニ「ウェルズ」国務次官ト会見セル処次官ハ先ス大統領直接ノ命ニ依ルモノナル旨ヲ前置シ別電第一二三三号ノ覚書ヲ読上ケ之ヲ手交シタルヲ以テ本使等ヨリ仏印進駐ニ関シテハ何等政府ヨリ通報ヲ受ケ居ラサルニ付御申入ノ趣旨ハ早速本国政府ヘ転達スヘシト述ヘタル上本来我方カ十一月二十日ノ提案ヲ為シタルハ全ク此ノ種事態ヲ考慮シタモノナル所以ヲ述ヘタルニ対シ次官ハ世界ノ如何ナル部分ニ於テモ侵略ニ反対スルコトヲ建前ト為シ居ル米国ノ立場ハ能ク御諒承ヲ得度シト答ヘタルヲ以テ本使等ハ米国其ノ他カ我国ニ対シ経済的圧力（経済戦争モ「アグレッション」ニシテ武力戦争ヨリモ一層辛辣ナルコトハ従来縷々応酬シ置キタリ）ヲ加フルニ至リシ経緯及之カ当否ニ関シテハ茲ニ論議スル時間ヲ有セサルモ我国民トシテハ右経済圧迫ニ直面シ之ニ屈スルカ又ハ之ヲ突破スル[227面]カニ者其ノ一ヲ選ハサルヘカラサル立場ニ在ルヲ痛感シ居ルコトハ充分御了解ヲ得度ク過般大統領モ理解セラレタル四年ニ亘ル事変ヲ続ケタル我国一般民心ノ状態ト併セ考ヘラレ度シト述ヘ置キタルカ\n更ニ話題ヲ最近ノ米国提案ニ転シ帝国政府カ国運ニ関スル重大問題トシテ本件慎重審議ヲ重ネツツアル次第ヲ述ヘタルニ対シ充分之ヲ了解シ本使等カ我方トシテ右新提案ヲ少クトモ其ノ儘審議ノ基礎トシテ受諾スルハ到底不可能ナルヘシト力説シ既ニ折角六月二十一日案及右ヲ出来得ル限リ取入レタル九月二十五日案存在シ双方ノ合意モ相当進ミ居ルニ拘ラス之ヲ一擲シ今更新提案ニ依ル審議ヲ試ミルカ如キハ決シテ交渉ノ円満且急速ニ解決スル所以ニアラサルヘシト説キ本来我方ハ日支事変ノ解決又ハ東亜ニ公正ナル平和確立ノ場合ハ仏印ヨリ撤兵スヘキ旨提議シ居ルニ鑑ミ根本問題解決ヲ見ルニ於テハ本日御申入ノ問題ノ如キハ自然ニ解消スヘキ筋合ニアラサルヤト述ヘタルニ対シ同次官ハ多大ノ注意ヲ払ヒ二十六日ノ米国提案ハ要スルニ米国ノ国内情勢ニモ鑑ミ一応米国ノ根本的建前ヲ明カニシ置ク必要ニ出テタルモノナル旨ヲ応酬シタル上右御意見ニ関シテハ早速長官トモ相談スヘシト答ヘ且日本側カ二十六日ノ米国提案ニ対スル回答等ニ於テ右様ノ余地ヲ存セラルルヲ望ムカ如キ口吻ヲ洩ラシタリ\n一日ノ「ハル」長官トノ会見及本日ノ会見ニ依レハ米国側モ現下難局ノ平和的収拾ヲ希望シ居ルコト明カニシテ急速妥結ヲ計リタキ希望ナルコト充分観取セラルルニ付米国新提案ニ対スル回答及別電第一二三三号覚書ニ対スル回答御詮議ニ際シテハ此ノ点充分御考慮ニ加ヘラルル様致シ度シ\n\n（別 電）\n第一二三三号（極秘、館長符号）\n(1) I have received reports during the past days of continuing Japanese troop movements to southern Indo-China. These reports indicate a very rapid and material increase in the forces of all kinds stationed by Japan in Indo-China.\nIt was my clear understanding that by the terms of [228面]the agreement–and there is no present need to discuss the nature of that agreement–between Japan and the French Government at Vichy that the total number of Japanese forces permitted by the terms of that agreement to be stationed in Indo-China was very considerably less than the total amount of the forces already there.\nThe stationing of these increased Japanese forces in Indo-China would seem to imply the utilization of these forces by Japan for purposes of further aggression, since no such number of forces could possibly be required for the policing of that region.\nSuch aggression could conceivably be against the Philippine Islands ; against the many islands of the East Indies; against Burma; against Malaya or either through coercion or through the actual use of force for the purpose of undertaking the occupation of Thailand.\n(2) Such new aggression would, of course, be additional to the acts of aggression already undertaken against China, our attitude towards which is well known, and has been repeatedly stated to the Japanese Government. Please be good enough to request the Japanese Ambassador and Ambassador Kurusu to inquire at once of the Japanese Government what the actual reasons may be for the steps already taken, and what I am to consider is the policy of the Japanese Government as demonstrated by this recent and rapid concentration of troops in Indo-China. This Government has seen in the last few years in Europe a policy on the part of the German Government which has involved a constant and steady encroachment upon the territory and rights of free and independent peoples through the utilization of military steps of the same character. It is for that reason and because of the broad problem of American defense that I should like to know the intention of the Japanese Government.\n\n[229面]（付 記）\n余ハ過去数日間ニ亘リ南部印度支那ニ対シ日本軍隊カ引続キ移動シツツアリトノ報告（複数）ヲ接受シ居レリ右報告ハ印度支那駐屯ノ凡有ユル種類ノ日本軍隊ノ極メテ急速且著シキ増加ヲ物語ルモノナリ今此処ニ日本国及「ヴィシイ」政府間協定ノ性質ヲ論スルノ要ナキモ同協定ノ諸条項ニヨリテ印度支那ニ駐屯ヲ認メラレ居ル日本軍隊ノ総数ハ既ニ同地ニ在ル軍隊ノ総数ヨリ遙カニ少数ナリシコトハ余ノ明瞭ニ諒解シ居タル所ナリ\n印度支那ニ対スル前記ノ如キ日本軍隊ノ増駐ハ斯ル多数ノ軍隊カ同地域ノ治安維持ノ為ニ必要トセラルルコトアリ得サルヘキニ鑑ミ更ニ侵略ノ目的ノ為ニ日本国ニ依ル之等軍隊ノ使用ヲ意味スルモノノ如シ\n斯ル侵略ハ比島、蘭印諸島、「ビルマ」、馬来半島ヲ目的トシ又ハ強制若ハ武力行使ノ何レカニヨリ泰国占領企図ヲ目的トスルモノト想像シ得ヘシ\n既ニ支那ニ対シ行ハレ居ル侵略行為ニ加フルニ更ニ今次新ニ侵略行為行ハレントシツツアリ然モ支那ニ対スル吾人ノ態度ハ周知ノ所ニシテ且日本国政府ニ対シ屡次申入レ置済ナリ\n日本国大使及来栖大使ニ対シ既ニ採ラレタル諸措置ノ真ノ理由如何並ニ余ハ右ノ如キ印度支那ニ於ケル最近ノ急速ナル軍隊集結ニヨリ示サレタル日本国政府ノ政策カ如何ナルモノト考フヘキカニ付至急日本国政府ニ照会アリ度キ旨要請セラレタシ当政府ハ過去数年間ニ亘リ欧州ニ於テ同様ノ軍事的措置ニ依リ自由且独立ナル諸民族ノ領土及権利ヲ不断ニ且著々ト侵略シ来レル独逸国政府ノ政策ヲ観来レリ余カ日本国政府ノ意図ヲ知ラントスルハ右理由ニ依ルモノニシテ且米国国防テフ広汎ナル問題ノ故ナリ", "notes": ["별전 제一二三三호의 영문 각서에는 간행본에서 (1)·(2)의 각주 번호가 붙어 있다(본문 상단 어깨 숫자). 각주 본문은 이 지면에 실려 있지 않다.", "「（付 記）」는 간행본이 붙인 그 영문 각서의 일본어 역문이다."], "warn": false, "pages": ["nichibei2_05_043", "nichibei2_05_044", "nichibei2_05_045", "nichibei2_05_046"], "search": "野村吉三郎 (노무라 기치사부로) — 주미대사 来栖三郎 (구루스 사부로) — 특파대사 東郷茂徳 (도고 시게노리) — 외무대신 「ウェルズ」(웰스, Sumner Welles) — 미 국무차관 「ハル」(헐, Cordell Hull) — 미 국무장관 Roosevelt (루스벨트) — 미 대통령. 각서를 「대통령 직접의 명」으로 전달"}, {"id": "439", "order": 439, "date": "1941-12-02", "group": "A", "eyebrow": "문서 439 · 「東条首相演説」の経緯に関し米国側へ説明", "title": "「도조 수상 연설」의 경위에 관하여 미국 측에 설명", "list_right": "문서 439", "meta": [{"k": "일자", "v": "1941-12-02"}, {"k": "원문 표기", "v": "昭和16年12月2日"}, {"k": "전보번호", "v": "第一二三四号（大至急、館長符号扱）"}, {"k": "발신", "v": "在米国野村大使 (노무라 주미대사)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 12月2日後発 / 本省 12月3日前着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "「東条首相演説」の経緯に関し米国側へ説明", "txt": true, "wide": true}], "summary": "도조 수상 연설 원고 발표상의 착오를 그대로 두면 교섭 계속에 악영향이 있으리라 보고, 2일 오전 웰스 차관과의 회견에 앞서 데라사키를 시켜 발렌타인을 국무성으로 방문시켜 사정을 설명하게 한 경위를 보고한 전보.", "points": ["귀전 제八六九호（도조 수상 연설의 건）에 관한 회답.", "연설 원고 발표상의 착오를 그대로 방치하면 교섭 계속에 악영향이 있으리라 사료되었다.", "2일 오전, 본사가 「ウェルズ」(웰스) 차관과 회견하기에 앞서 데라사키(寺崎)를 시켜 「バランタイン」(발렌타인, Ballantine)을 국무성으로 방문하게 하여 서두에 귀전의 취지를 적절히 설명하게 했다.", "「バ」(발렌타인)는 일미 관계 긴장의 이 「サイコロジカル・モーメント」(사이콜로지컬 모먼트, psychological moment)에 그러한 강경 성명이 전해져 미국 조야에 다대한 충동을 준 것은 심히 불행하고도 위험한데, 이야기를 듣고 매우 안도했다고 말했다고 한다.", "데라사키는 떠들어 댄 것은 미국 신문이므로 자신은 무슨 석명(釋明)을 하러 온 것이 아니라 다만 사실의 진상을 전한 것뿐이라고 하고, 이 기회에 양국 신문이 서로 냉정할 필요가 있으니 이 점 앞으로도 지도해 주기 바란다고 부언해 두었다는 것."], "primary": "[229면]\n제一二三四호（대지급, 관장부호 취급）\n\n[230면]귀전 제八六九호에 관하여（도조 수상 연설의 건）.\n\n본건 연설 원고 발표상의 착오에 관해서는 이를 이대로 방치해 두는 것이 교섭 계속에 악영향이 있으리라고 사료되었으므로, 2일 오전 본사(本使)가 「ウェルズ」(웰스)와 회견하기에 앞서 데라사키(寺崎)로 하여금 「バランタイン」(발렌타인, Ballantine)을 국무성으로 방문하게 하여 서두에 귀전의 취지를 적절히 설명하게 해 두었던바, 그때 「バ」(발렌타인)는, 일미 관계가 긴장된 이 「サイコロジカル・モーメント」(심리적 순간, psychological moment)에 이러한 강경 성명이 전해져 미국 조야(朝野)에 다대한 충동을 준 것은 심히 불행하고도 위험한 일인데 말씀을 듣고 대단히 안도하였다고 말하였다고 합니다.\n\n또한 데라사키로부터는, 떠들어 댄 것은 미국 신문이므로 자신은 무슨 석명(釋明)을 하러 온 것이 아니라 다만 사실의 진상을 전해 드린 것에 지나지 않으나, 이 기회에 양국 신문은 서로 냉정할 필요가 있을 것이니 이 점에 관하여 앞으로도 지도하여 주기 바란다는 뜻을 부언해 두었다고 합니다.", "secondary": "[229面]\n第一二三四号（大至急、館長符号扱）\n[230面]貴電第八六九号ニ関シ（東条首相演説ノ件）\n本件演説原稿発表上ノ手違ニ付テハ之ヲ此ノ儘放置シ置クコトハ交渉継続ニ悪影響アルヘシト思料セラレタルヲ以テ二日午前本使「ウェルズ」ニ会見ニ先立チ寺崎ヲシテ「バランタイン」ヲ国務省ニ往訪セシメ冒頭貴電ノ趣旨ヲ適宜説明セシメ置キタル処其ノ際「バ」ハ日米関係緊張ノ此ノ「サイコロジカル・モーメント」ニ於テ斯カル強硬声明カ伝ヘラレ米朝野ニ多大ノ衝動ヲ与ヘタルハ甚タ不幸且ツ危険ナルカ御話ヲ伺ヒ非常ニ安堵セリト述ヘタル趣ナリ\n尚寺崎ヨリ騒キ立テタルハ米国新聞ナルヲ以テ自分ハ何等釈明ニ来レルニアラス唯事実ノ真相ヲ御伝ヘシタル迄ナルカ此ノ際両国新聞ハ御互ニ冷静ナルヲ要スヘク此ノ点此ノ上トモ御指導アリタキ旨付言シ置ケル由ナリ", "notes": [], "warn": false, "pages": ["nichibei2_05_046", "nichibei2_05_047"], "search": "野村吉三郎 (노무라 기치사부로) — 주미대사 東郷茂徳 (도고 시게노리) — 외무대신 東条英機 (도조 히데키) — 수상 寺崎英成 (데라사키 히데나리) — 주미대사관 서기관 「バランタイン」(발렌타인, Joseph W. Ballantine) — 미 국무성 「ウェルズ」(웰스, Sumner Welles) — 미 국무차관"}, {"id": "440", "order": 440, "date": "1941-12-03", "group": "B", "eyebrow": "문서 440 · 仏印兵力増強に関する米国側覚書への回答につき訓令", "title": "불인(仏印) 병력 증강에 관한 미국 측 각서에 대한 회답에 관한 훈령", "list_right": "문서 440", "meta": [{"k": "일자", "v": "1941-12-03"}, {"k": "원문 표기", "v": "昭和16年12月3日"}, {"k": "전보번호", "v": "第八七五号（大至急、館長符号）"}, {"k": "발신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "수신", "v": "在米国野村大使 (노무라 주미대사)", "txt": true}, {"k": "발신·착신", "v": "本省 12月3日発", "txt": true, "wide": true}, {"k": "종류", "v": "訓令"}, {"k": "표제", "v": "仏印兵力増強に関する米国側覚書への回答につき訓令", "txt": true, "wide": true}], "summary": "도고 외무대신이 노무라 대사에게, 불인 병력 증강에 관한 미국 측 각서에 대해 「불지(仏支) 국경 부근 지나군의 준동에 대비해 북부 불인에서 일부 증강을 행했고 그와 관련해 자연히 남부 방면 부대 이동도 있었을 뿐이며 일불 공동방위 의정서의 범위를 이탈하지 않았다」는 취지로 응수하라고 지시한 훈령 전보.", "points": ["귀전 제一二三二호에 관한 회훈.", "미국 측에는 아래 취지로 응수하라는 지시.", "불인에서의 아군 증강에 관한 풍설은, 최근 불지(仏支) 국경 부근에서 지나군이 빈번히 준동(蠢動)하고 있음에 비추어 주로 이에 대비하기 위해 북부 불인에서 일부 증강을 행했고, 그와 관련하여 자연히 남부 방면 부대의 이동도 행해진 것을 과대하게 보도한 데 따른 것으로 인정된다.", "우리 쪽은 일불(日仏) 공동방위 의정서의 범위를 조금도 일탈하고 있지 않다는 것."], "primary": "[230면]\n제八七五호（대지급, 관장부호）\n\n귀전 제一二三二호에 관하여.\n\n미국 측에는 다음의 취지로 응수하시기 바랍니다.\n\n불인(仏印)에서의 아군 증강에 관한 풍설은, 최근 불지(仏支) 국경 부근에서 지나(支那)군이 빈번히 준동(蠢動)하고 있음에 비추어 주로 이에 대비하기 위하여 북부 불인에서 일부의 증강을 행하였고, 이와 관련하여 자연히 남부 방면 부대의 이동도 행하여진 것을 과대하게 보도한 데에 의한 것으로 인정되는 바이며, 우리 쪽은 일불(日仏) 공동방위 의정서의 범위를 조금도 일탈하고 있지 아니한 바입니다.", "secondary": "[230面]\n第八七五号（大至急、館長符号）\n貴電第一二三二号ニ関シ\n米側ニハ左ノ趣旨ヲ以テ応酬セラレ度シ\n仏印ニ於ケル我軍増強ニ関スル風説ハ最近仏支国境付近ニ於テ支那軍カ頻ニ蠢動シ居ルニ鑑ミ主トシテ之ニ備ヘンカ為北部仏印ニ於テ一部ノ増強ヲ行ヒ右ト関連シ自然南部方面部隊ノ移動モ行ハレタルコトヲ誇大ニ報道セラレタルニ依ルモノト認メラルル処我方ハ日仏共同防衛議定書ノ範囲ヲ何等逸脱シ居ラサル次第ナリ", "notes": ["「支那」는 당대 일본 측 표기 그대로이며 「지나」로 옮겼다."], "warn": false, "pages": ["nichibei2_05_047"], "search": "東郷茂徳 (도고 시게노리) — 외무대신 野村吉三郎 (노무라 기치사부로) — 주미대사"}, {"id": "441", "order": 441, "date": "1941-12-03", "group": "B", "eyebrow": "문서 441 · 首脳会談の再提議は不適当の旨訓令", "title": "수뇌회담의 재제의는 부적당하다는 뜻의 훈령", "list_right": "문서 441", "meta": [{"k": "일자", "v": "1941-12-03"}, {"k": "원문 표기", "v": "昭和16年12月3日"}, {"k": "전보번호", "v": "第八七六号（大至急、館長符号）"}, {"k": "발신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "수신", "v": "在米国野村大使 (노무라 주미대사)", "txt": true}, {"k": "발신·착신", "v": "本省 12月3日後9時発", "txt": true, "wide": true}, {"k": "종류", "v": "訓令"}, {"k": "표제", "v": "首脳会談の再提議は不適当の旨訓令", "txt": true, "wide": true}], "summary": "노무라 대사가 건의한 양국 수뇌 회견안(제一二二七호)에 대하여, 전 내각 때에도 우리 쪽이 제의하였다가 성사되지 못한 경위가 있으므로 이 기회에 우리 쪽에서 다시 이를 신청하는 것은 적당하지 않다는 정부 의향을 전한 회훈.", "points": ["귀전 제一二二七호（국면 타개를 위한 수뇌 회담 재검토 의견 구신）에 대한 회훈.", "양국 수뇌자 회견에 관해서는, 아시는 바와 같이 전 내각 시대에도 우리 쪽에서 제의하여 불성공으로 끝난 경위가 있다.", "이 기회에 우리 쪽에서 다시 이를 신청하는 것은 적당하지 않다는 의향이므로 그 점 양지(諒知)하라."], "primary": "[230면]\n제八七六호（대지급, 관장부호）\n\n귀전 제一二二七호에 관하여.\n\n양국 수뇌자 회견에 관해서는 아시는 바와 같이 전 내각 시대에도 우리 쪽에서 제의하여 불성공으로 끝난 경위도 있으므로, 이 기회에 우리 쪽에서 다시 이를 신청하는 것은 적당하지 않다는 의향이니 그 점 [231면]양지(諒知)하여 주시기 바랍니다.", "secondary": "[230面]\n第八七六号（大至急、館長符号）\n貴電第一二二七号ニ関シ\n両国首脳者会見ニ付テハ御承知ノ通リ前内閣時代ニモ我方ヨリ提議シ不成功ニ終リタル経緯モアリ此ノ際我方ヨリ再度之ヲ申出ツルコトハ適当ナラストノ意向ナルニ付右ニ御[231面]承知アリ度シ", "notes": ["「前内閣時代」는 제3차 고노에 내각 시기의 고노에·루스벨트 수뇌회담 제의를 가리킨다(문서 435 참조)."], "warn": false, "pages": ["nichibei2_05_047", "nichibei2_05_048"], "search": "東郷茂徳 (도고 시게노리) — 외무대신 野村吉三郎 (노무라 기치사부로) — 주미대사"}, {"id": "442", "order": 442, "date": "1941-12-03", "group": "B", "eyebrow": "문서 442 · 我が方最終提案につき確認", "title": "우리 쪽 최종 제안에 관한 확인", "list_right": "문서 442", "meta": [{"k": "일자", "v": "1941-12-03"}, {"k": "원문 표기", "v": "昭和16年12月3日"}, {"k": "전보번호", "v": "第八七七号（大至急、館長符号）"}, {"k": "발신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "수신", "v": "在米国野村大使 (노무라 주미대사)", "txt": true}, {"k": "발신·착신", "v": "本省 12月3日後9時発", "txt": true, "wide": true}, {"k": "종류", "v": "訓令"}, {"k": "표제", "v": "我が方最終提案につき確認", "txt": true, "wide": true}], "summary": "교섭 중 미국 측 6월안과 일본 측 9월안이 언급되고 있는 데 대하여, 현재 일본이 유지하고 있는 안은 11월 20일 제안이며 9월안은 그것으로 대위(代位)되었음을 확인시킨 짧은 훈령.", "points": ["귀전 제一二二五호에 관한 회훈. 전보 머리에 「very urgent」가 조판되어 있다.", "귀하가 절충 중에 미국 측 6월안과 우리 쪽 9월안이 언급되고 있다.", "말할 것도 없이 현재 우리 쪽이 유지하고 있는 안은 11월 20일 제안이다.", "9월안은 그것에 의하여 대위(代位)된 것임을 확인(「為念」= 다짐 삼아)."], "primary": "[231면]\n제八七七호（대지급, 관장부호）\nvery urgent\n\n귀전 제一二二五호에 관하여.\n\n귀하가 절충 중에 미국 측 6월안과 우리 쪽 9월안을 언급하고 계신 바, 말씀드릴 것도 없이 현재 우리 쪽이 유지하고 있는 안은 11월 20일 제안이며, 9월안은 그것에 의하여 대위(代位)된 것입니다. 다짐 삼아 말씀드립니다(為念).", "secondary": "[231面]\n第八七七号（大至急、館長符号）\nvery urgent\n貴電第一二二五号ニ関シ\n貴方御折衝中米側六月案ト我方九月案トニ言及セラレ居ル処申ス迄モナク現在我方ノ維持シ居ル案ハ十一月二十日提案ニシテ九月案ハ右ニ依リ代位セラレタルモノナリ為念", "notes": [], "warn": false, "pages": ["nichibei2_05_048"], "search": "東郷茂徳 (도고 시게노리) — 외무대신 野村吉三郎 (노무라 기치사부로) — 주미대사"}, {"id": "443", "order": 443, "date": "1941-12-03", "group": "B", "eyebrow": "문서 443 · 我が方方針米国側へ徹底方訓令", "title": "우리 쪽 방침을 미국 측에 철저히 알릴 것에 관한 훈령", "list_right": "문서 443", "meta": [{"k": "일자", "v": "1941-12-03"}, {"k": "원문 표기", "v": "昭和16年12月3日"}, {"k": "전보번호", "v": "第八七八号（大至急、館長符号）"}, {"k": "발신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "수신", "v": "在米国野村大使 (노무라 주미대사)", "txt": true}, {"k": "발신·착신", "v": "本省 12月3日後9時発", "txt": true, "wide": true}, {"k": "종류", "v": "訓令"}, {"k": "표제", "v": "我が方方針米国側へ徹底方訓令", "txt": true, "wide": true}], "summary": "도고 외무대신이 노무라 대사에게, ①도조 수상 성명의 영역(英譯) 부적당과 미국 신문·라디오의 불온한 논조, ②미영의 대일 군비 증강과 대만 남부 상공 정찰 비행 등 자극적 행동, ③11월 20일 대안(對案)이 공정한 입장에 선 난국 타개의 최선책이며 미국 측 원칙적 입장과 모순되지 않는다는 점을, 미국 측에 거듭 설시(說示)하도록 지시한 훈령.", "points": ["귀전 제一二二五호에 관한 회훈. 전보 머리에 「very urgent」.", "一、미국 측은 일본 정부 당국 성명·여론 동향·남방 병력 이동을 빈번히 문제 삼아 이를 구실로 교섭 타결에 대한 일본의 성의에 의혹을 표하고 있다.", "도조 수상 성명의 진상은 왕전 제八六六호와 같으며, 영역(同盟通信社 작성이라 함)이 심히 부적당하여 뜻밖의 반향을 부른 것으로 인정된다.", "일반 여론 지도에 관해서는 본 대신도 특히 고심하였고, 주일 미국대사도 국무성에 보고하고 있을 터이며, 실제로 「ハル」(헐) 장관도 귀전 제一一四八호와 같이 개선을 인정하고 만족의 뜻을 표하였다.", "그런데 미국 측 최근 신문 논조는 매우 불온하며, 「ラヂオ」 방송(특히 최근 수일 샌프란시스코 단파 방송이 현저)은 연일 교섭의 기미(機微)한 내용을 방송하고 있다.", "이는 교섭 소식에 통한 자와 연락이 없으면 불가능하다고 볼 수밖에 없으니, 미국 측이 자기의 잘못은 돌아보지 않고 일본만을 책하려는 것은 부당하다.", "二、미영 등 여러 나라는 최근 더욱 대일 군비를 증강하고 자극적 태도로 나오고 있으며, 특히 지난달 20일 미국 비행기가 대만 남부 아란비(鵞鑾鼻) 상공을 정찰 비행한 일이 있다(27일 주일 미국대사에게 항의 완료).", "그 밖에도 영미 측의 유사한 행동이 한두 번이 아니므로, 정세의 기미에 비추어 영미 측에 억제를 요망하지 않을 수 없다.", "三、11월 20일의 일본 측 대안은 공정한 입장에 입각하여 제안한 것이며 이 기회에 난국 타개의 최선의 방책이라고 생각하는 까닭을 앞으로도 미국 측에 설시할 것.", "미국 측이 일본 대안을 일반적 원칙과 양립하지 않는다고 하는 것은 제4항의 「일지(日支) 화평을 방해하지 않는다」는 규정을 가리키는 것으로 해석되나, 일본은 누차 신입한 대로 대통령의 소개에 의해 일지 화평 교섭이 개시되면 원장(援蔣) 행위를 정지하여야 한다고 주장하는 것이므로 미국 측의 이른바 원칙적 입장과 조금도 모순되지 않는다는 점을 알아 둘 것."], "primary": "[231면]\n제八七八호（대지급, 관장부호）\nvery urgent\n\n귀전 제一二二五호에 관하여.\n\n一、미국 측은 우리 정부 당국의 성명 및 여론의 동향, 그리고 우리 쪽의 남방 병력 이동을 자꾸 문제 삼고 이를 구실로 하여 교섭 타결에 대한 우리 쪽의 성의에 의혹을 표하고 있는바, 도조(東條) 수상 성명의 진상은 왕전(往電) 제八六六호와 같으며, 그 영역(英譯)（동맹통신사에서 작성한 것이라 함）이 심히 부적당하였기 때문에 뜻밖의 반향을 초래한 것으로 인정되는 바입니다. 일반 여론 지도에 관해서는 본 대신도 특히 고심한 바이며, 이 점은 주경(在京) 미국대사로부터도 국무성에 보고되고 있을 터이고, 실제로 「ハル」(헐, Hull) 장관도 귀전 제一一四八호에 실린 바와 같이 개선을 인정하고 만족의 뜻을 표한 바입니다. 그런데 미국 측 최근의 신문 논조에는 자못 불온한 것이 있을 뿐만 아니라, 「ラヂオ」(라디오) 방송（특히 최근 수일간의 상항(桑港, 샌프란시스코) 단파 방송이 현저합니다）과 같은 것은 연일 교섭의 기미(機微)한 내용을 방송하고 있습니다. 이는 명백히 교섭의 소식에 통한 자와 연락이 있지 아니하고서는 이러한 종류의 방송은 불가능하다고 인정할 수밖에 없는 바, 미국 측이 자기의 잘못을 돌아보지 아니하고 우리 쪽만을 책하려 하는 것은 부당하다고 하여야 할 것입니다.\n\n二、미영 등 여러 나라는 최근에 이르러 더욱더 대일 군비를 증강하고 우리 쪽에 대하여 자극적 태도로 나오고 있으며, 특히 지난달 20일 미국 비행기[232면]가 대만 남부 아란비(鵞鑾鼻) 상공을 정찰 비행한 일이 있었습니다（27일 주경 미국대사에게 항의를 마쳤습니다）. 그 밖에도 영미 측이 유사한 행동에 나온 일이 한두 번에 그치지 않으니, 이 점에 관해서도 정세가 기미(機微)함에 비추어 영미 측에서 억제하도록 요망하지 아니할 수 없는 바입니다.\n\n三、또한 11월 20일의 우리 쪽 대안(對案)은 공정한 입장에 입각하여 제안한 것으로서, 이 기회에 난국 타개의 최선의 방책이라고 사고(思考)하는 까닭을 앞으로도 미국 측에 설시(說示)하여 주시기 바랍니다（미국 측이 우리 대안을 일반적 원칙과 양립하지 않는다고 칭하는 것은 제4항의 「일지(日支) 화평을 방해하지 않는다」는 규정을 가리키는 것으로 해석되는 바, 우리 쪽은 누차 신입(申入)한 대로 대통령의 소개에 의하여 일지 화평 교섭이 개시되는 운(運)에 이른 이상은 원장(援蔣) 행위를 정지하여야 한다고 주장하는 것으로서, 미국 측의 이른바 원칙적 입장과 조금도 모순되지 아니하는 일이니 그 점을 알아 두시기 바랍니다）.", "secondary": "[231面]\n第八七八号（大至急、館長符号）\nvery urgent\n貴電第一二二五号ニ関シ\n一、米側ハ我政府当局声明並ニ輿論ノ動向及我方ノ南方兵力移動ヲ頻リニ問題トシ右ヲ口実トシテ交渉妥結ニ対スル我方ノ誠意ニ疑惑ヲ表シ居ル処東条首相声明ノ真相ハ往電第八六六号ノ通リニテ英訳（同盟通信社ニテ作成セル由）甚シク不適当ナリシ為メ意外ノ反響ヲ招キタルモノト認メラルル次第ナルカ一般輿論指導ニ関シテハ本大臣ニ於テモ特ニ苦心セル処ニシテ此ノ点ハ在京米国大使ヨリモ国務省ニ報告シ居ル筈ニテ現ニ「ハル」長官モ貴電第一一四八号所載ノ通リ改善ヲ認メ満足ノ意ヲ表シタル次第ナリ然ルニ米側最近ノ新聞論調ニハ頗ル不穏ナルモノアルノミナラス「ラヂオ」放送（特ニ最近数日ノ桑港短波放送顕著ナリ）ノ如キハ連日交渉ノ機微ナル内容ヲ放送シツツアリ右ハ明カニ交渉ノ消息ニ通シタル者ト連絡アルニ非サレハ此ノ種放送ハ不可能ト認ムル外ナキ処米側カ自己ノ非ヲ顧ミスシテ我方ノミヲ責メントスルハ不当ト云フヘシ\n二、米英等ノ諸国ハ最近ニ至リ益々対日軍備ヲ増強シ我方ニ対シ刺激的態度ニ出テ居リ特ニ先月二十日米国飛行機[232面]ハ台湾南部鵞鑾鼻上空ヲ偵察飛行セルコトアリ（二十七日在京米国大使ニ抗議済ミ）其他英米側カ類似ノ行動ニ出テタルコト一再ニ止マラス此ノ点ニ付テモ状勢ノ機微ナルニ鑑ミ英米側ニ於テ抑制方ヲ要望セサルヲ得サル次第ナリ\n三、尚十一月二十日ノ我方対案ハ公正ナル立場ニ立脚シ提案セルモノニシテ此ノ際難局打開ノ最善ノ方策ト思考スル所以ヲ此ノ上トモ米側ニ御説示アリ度シ（米側カ我対案ヲ以テ一般的原則ト両立セスト称スルハ第四項ノ日支和平ヲ妨碍セストノ規定ヲ指スモノト解セラルル処我方ハ屢次申入ノ通リ大統領ノ紹介ニ依リ日支和平交渉開始ノ運ヒニ至リタル上ハ援蒋行為ヲ停止スヘシト主張スルモノニシテ米側ノ所謂原則的立場ト何等矛盾セサル儀ナルニ付右含ミ置カレ度シ）", "notes": ["「桑港」은 샌프란시스코의 당대 한자 표기.", "「鵞鑾鼻」는 대만 남단의 가란비(오늘의 어롼비/헝춘반도 남단)."], "warn": false, "pages": ["nichibei2_05_048", "nichibei2_05_049"], "search": "東郷茂徳 (도고 시게노리) — 외무대신 野村吉三郎 (노무라 기치사부로) — 주미대사 東条英機 (도조 히데키) — 수상 「ハル」(헐, Cordell Hull) — 미 국무장관 蔣介石 (장제스) — 「援蒋」의 대상"}, {"id": "444", "order": 444, "date": "1941-12-03", "group": "A", "eyebrow": "문서 444 · 日米交渉の経緯と仏印兵力増強に関する米国大統領の記者会見について", "title": "일미교섭의 경위와 불인(仏印) 병력 증강에 관한 미국 대통령의 기자회견에 관하여", "list_right": "문서 444", "meta": [{"k": "일자", "v": "1941-12-03"}, {"k": "원문 표기", "v": "昭和16年12月3日"}, {"k": "전보번호", "v": "第一二三九号（極秘、館長符号）"}, {"k": "발신", "v": "在米国野村大使 (노무라 주미대사)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 12月3日前発 / 本省 12月3日後着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "日米交渉の経緯と仏印兵力増強に関する米国大統領の記者会見について", "txt": true, "wide": true}], "summary": "12월 2일 루스벨트 대통령이 기자단 회견에서 불인 증병 의도에 관한 대일 조회 발송을 발표하고, 아울러 처음으로 자신의 의견으로서 금춘(今春) 이래 일미교섭의 경위와 남부 불인 진주·이번 증병이 모두 교섭 진행 중에 행해졌음을 간단히 언급한 사실을 보고한 전보.", "points": ["왕전 제一二三二호에 관한 보고.", "2일 대통령은 기자단과의 회견에서, 미국 정부가 같은 날 일본 측에 불인에의 이번 병력 증강 의도에 관하여 조회를 발송한 사실을 발표했다.", "아울러 처음으로 자신의 의견으로서, 금춘(今春) 이래의 일미교섭 경위와, 일본의 남부 불인 진주 및 전해지는 이번 불인 증병이 모두 교섭 진행 중에 행해진 것임을 간단히 언급했다(2일자 화부특정(華府特情) 참조).", "이는 대통령이 「ワームスプリング」(웜스프링스, Warm Springs)에서 워싱턴으로 돌아온 뒤 최초의 회견이었다는 점, 그리고 상당히 솔직하게 교섭 내용에 언급하고 있다는 점에서 주목을 끌고 있다."], "primary": "[232면]\n제一二三九호（극비, 관장부호）\n\n왕전(往電) 제一二三二호에 관하여.\n\n2일 대통령은 기자단과의 회견에서, 미국 정부가 같은 날 우리 쪽에 대하여 불인(仏印)에의 이번 병력 증강의 의도에 관하여 조회를 발송하였다는 뜻을 발표함과 아울러, 처음으로 자기의 의견으로서 금춘(今春) 이래의 일미교섭의 경위 및 우리 쪽의 남부 불인 진주와 전하여지는 이번 불인 증병(增兵)이 모두 교섭 진행 중에 행하여졌다는 것에 간단히 언급하였습니다（2일자 화부특정(華府特情) 참조）. 이는 대통령이 「ワームスプリング」(웜스프링스, Warm Springs)에서 워싱턴으로 돌아온 뒤 최초의 회견이기도 하였고, 또한 상당히 솔직하게 교섭 내용에 언급하고 있다는 점에서 주목을 끌고 있습니다.", "secondary": "[232面]\n第一二三九号（極秘、館長符号）\n往電第一二三二号ニ関シ\n二日大統領ハ記者団トノ会見ニ於テ米政府カ同日我方ニ対シ仏印ヘノ今次兵力増強ノ意図ニ関シ照会ヲ発セル旨ヲ発表スルト共ニ始メテ自己ノ意見トシテ今春以来ノ日米交渉ノ経緯並ニ我方南部仏印進駐及伝ヘラルル今次仏印増兵カ何レモ交渉進行中ニ行ハレタルコトニ簡単ニ言及セルカ（二日付華府特情参照）右ハ大統領ノ「ワームスプリング」ヨリ帰華後最初ノ会見ニモアリ且相当率直ニ交渉内容ニ触レ居ル点ニ於テ注目ヲ惹キ居レリ", "notes": ["「華府」는 워싱턴(華盛頓府)의 당대 약칭이며, 「華府特情」은 워싱턴 발 특별 정보 보고를 가리킨다.", "「帰華」는 워싱턴으로 돌아옴을 뜻한다."], "warn": false, "pages": ["nichibei2_05_049"], "search": "野村吉三郎 (노무라 기치사부로) — 주미대사 東郷茂徳 (도고 시게노리) — 외무대신 Roosevelt (루스벨트) — 미 대통령"}, {"id": "445", "order": 445, "date": "1941-12-03", "group": "A", "eyebrow": "문서 445 · 米・英両国共同軍事行動についての観測", "title": "미국·영국 두 나라의 공동 군사행동에 관한 관측", "list_right": "문서 445", "meta": [{"k": "일자", "v": "1941-12-03"}, {"k": "원문 표기", "v": "昭和16年12月3日"}, {"k": "전보번호", "v": "第一二四二号（大至急、館長符号扱）"}, {"k": "발신", "v": "在米国野村大使 (노무라 주미대사)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 12月3日後発 / 本省 12月4日前着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "米・英両国共同軍事行動についての観測", "txt": true, "wide": true}], "summary": "일본이 태국에 진주할 경우 미국은 선전포고 여부와 무관하게 영국과 협동하여 즉시 군사행동에 나설 것이 필지라는 노무라 대사의 관측 보고.", "points": ["여러 정보를 종합한 결과의 관측 보고이다.", "계기는 일본 측의 「타이」(태국) 진주이다.", "선전포고의 유무는 별개 문제로 본다.", "미국은 영국과 협동하여 곧바로 어떤 군사행동에 나설 것이 필지라고 본다.", "「대지급(大至急)」·관장부호 취급의 전보로, 12월 3일 발신·4일 착신이다."], "primary": "[233면] 여러 정보를 종합하건대, 우리 쪽의 「타이」 진주가 일어날 경우, 선전(宣戦)의 유무는 별개로 하고 미국 측에서는 영국 측과 협동하여 곧바로 어떠한 군사행동에 나올 것이 필지(必至)라고 인정된다.", "secondary": "[233면]諸般ノ情報ヲ総合スルニ我方ノ「タイ」進駐起リタル場合宣戦ノ有無ハ別トシテ米側ニ於テハ英側ト協同直ニ何等カノ軍事行動ニ出ツルコトハ必至ト認メラル", "notes": [], "warn": false, "pages": ["nichibei2_05_049", "nichibei2_05_050"], "search": "野村吉三郎 (노무라 기치사부로) 東郷茂徳 (도고 시게노리)"}, {"id": "446", "order": 446, "date": "1941-12-03", "group": "A", "eyebrow": "문서 446 · 「東条首相演説」により日米関係は最も緊迫せる旨のフライシャーの談話", "title": "「도조 수상 연설」로 일미관계가 가장 긴박해졌다는 취지의 플라이셔 담화", "list_right": "문서 446", "meta": [{"k": "일자", "v": "1941-12-03"}, {"k": "원문 표기", "v": "昭和16年12月3日"}, {"k": "전보번호", "v": "第一二五三号（館長符号扱）"}, {"k": "발신", "v": "在米国野村大使 (노무라 주미대사)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 12月3日後発 / 本省 12月4日後着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "「東条首相演説」により日米関係は最も緊迫せる旨のフライシャーの談話", "txt": true, "wide": true}], "summary": "12월 2일 밤 언론인 「플라이셔」가 데라사키에게 말한 바를 옮긴 전보로, 루스벨트를 격앙시킨 경위와 11월 26일 미국 측 조건 제출에 이른 사정, 그럼에도 전쟁 회피 희망은 남아 있다는 관측을 전한다.", "points": ["현 정부는 루스벨트의 「퍼스널 인스트루먼트」이므로 그의 감정이 국책 결정의 중요 요소라고 본다.", "루스벨트는 당초부터 일미 타결을 강하게 원했고 최근에는 영국·호주도 이를 희망했으며, 지나만이 반대해 왔다고 한다.", "그를 노하게 한 주된 원인은 구루스 대사의 도미와 도조 수상의 의회 연설이 거의 동시에 행해진 것, 그리고 회기 중 한두 각료의 강경 발언이다.", "「로」를 둘러싼 이른바 「워 파티」의 강경 태도가 겹쳐 흥분한 참에 일본군 불인 증강 보고가 속속 들어왔다.", "일본에 성의가 없다고 여기게 된 「사이콜로지컬 모먼트」에 후스·쑹쯔원의 요구가 겹쳐 26일 헐 장관의 미국 측 조건 제출로 이어졌다고 본다.", "표면상 지나 측의 외교적 승리로 보이나 전적으로 「럭」에 의한 것이라고 한다.", "헐은 한때 이른바 국부적 양해안에 상당한 희망을 걸었으나 이제 정력을 거의 소모했다고 한다.", "일미관계는 가장 긴박한 관두에 이르렀으나 미·일 및 영·호에 전쟁 회피 희망이 남아 있는 기초적 상태에는 변경이 없다고 관측한다."], "primary": "[233면] 2일 밤 「フライシャー」(플라이셔, Fleisher)가 데라사키(寺崎)에게 말한 바는 다음과 같다.\n\n현 정부는 현재 「ローズベルト」(루스벨트, Roosevelt)의 「パーソナル・インスツルメント」(퍼스널 인스트루먼트)가 되어 있으므로 그의 감정이 내외 국책 결정상 중요한 요소라는 것은 아시는 바와 같거니와, 「로」는 일미교섭에 관한 한 당초부터 일미 타결의 강한 생각을 가지고 있었고 최근에는 또 영·호 두 나라도 이를 희망하였으며(란인(蘭印)은 문제가 되지 않는다) 지나(支那)만이 반대하여 온 것으로서, 이번 교섭에서 그를 노하게 한 주된 원인은 우선 구루스(来栖三郎) 대사의 도미와 도조(東条英機) 수상의 의회 연설이 거의 동시에 행하여졌을 뿐 아니라 의회 개회 중 한두 각료로부터도 강경한 언사가 있었던 것으로, 위는 「로」를 둘러싼 이른바 「ウオー・パーチー」(워 파티, war party)의 강경한 태도와도 서로 어울려 「로」를 자못 흥분시킨 참에 일본군 불인(仏印) 증강의 보고가 속속 들어와 「로」로 하여금 일본에 성의가 없다고 생각하게 만든 「サイコロジカル・モーメント」(사이콜로지컬 모먼트)에 마침 지나 측으로부터는 후스(胡適) 및 쑹쯔원(宋子文)이 요구하는 바가 있어, 마침내 26일 「ハル」(헐, Hull) 장관으로부터 미국 측 조건의 제출에 이르게 된 것으로서, 표면상 지나 측의 외교적 승리로 돌아간 감이 있으나 위는 전적으로 「ラック」(럭, luck)에 의한 것이다. 그동안 「헐」은 비상한 노력과 인내로써 어떠한 형태로든 교섭 타결에 힘써 한때 상당한 희망(이른바 국부적 양해안이다)을 걸었으나, 이제는 「하」 자신이 거의 정력을 소모해 다한 실정이다. 또한 위 미국 측 공기에 박차를 가한 것은 이번의 이른바 도조 수상의 연설로서, 일미관계는 가장 긴박한 관두(関頭)에 이르렀으나, 자신으로서는 본 교섭의 주역인 미국 및 일본에서는 여전히 전쟁 회피의 희망이 있고 영·호 또한 이를 희망하고 있는 기초적 상태에는 아무런 변경이 없는 것으로 관측하고 있다.", "secondary": "[233면]二日夜「フライシャー」ノ寺崎ニ語ル所左ノ通リ\n現政府ハ現在「ローズベルト」ノ「パーソナル・インスツルメント」トナリ居ルヲ以テ彼ノ感情ハ内外国策決定上重要ナル要素ナルコト御承知ノ通リナルカ「ロ」ハ日米交渉ニ関スル限リ当初ヨリ日米妥結ノ強キ考ヲ有シ最近ハ又英豪両国モ之ヲ希望シ（蘭印ハ問題トナラス）支那ノミ反対シ来タレルモノニテ今次交渉ニ於テ彼ヲ怒ラセタル主ナル原因ハ先ツ来栖大使ノ来米ト東条首相ノ議会演説トカ殆ト同時ニ行ハレタルノミナラス議会開会中一、二閣僚ヨリモ強硬言辞アリ右ハ「ロ」ヲ取捲ク所謂「ウオー・パーチー」ノ強硬態度トモ相俟ツテ頗ル「ロ」ヲ興奮セシメタル所へ日本軍仏印増強ノ報告続々ト入リ来タリ「ロ」ヲシテ日本ニ誠意ナシト思ヘル「サイコロジカル・モーメント」ニ偶々支那側ヨリハ胡適及宋子文ヨリ求ムル所アリ遂ニ二十六日「ハル」長官ヨリ米側条件ノ提出トナリタルモノニテ表面支那側ノ外交的勝利ニ帰シタル感アルモ右ハ全然「ラック」ニ依ルモノナリ此ノ間「ハル」ハ非常ナ労力ト忍耐ヲ以テ何等カノ交渉妥結ニ努メ一時相当ノ希望（所謂局部的諒解案ナリ）繋カレタルモ最早ヤ「ハ」自身殆ト精力ヲ消耗シ尽セル実情ナリ尚右米側空気ニ拍車ヲ掛ケタルハ今次ノ所謂東条首相ノ演説ニテ日米関係ハ最モ緊迫セル関頭ニ立到リタルモ自分トシテハ本交渉ノ立役者タル米国及日本ニ於テハ依然戦争回避ノ希望アリ英豪亦之ヲ希望シ居ル基礎的状態ニハ何等変更ナキモノト観測シ居レリ", "notes": ["「支那」는 당대 일본 측 표기 그대로 「지나」로 옮겼다.", "「蘭印」은 네덜란드령 동인도(蘭領印度)의 약칭이며, 「仏印」은 프랑스령 인도차이나의 약칭이다.", "「ハ」는 「ハル」(헐)의 줄임으로, 원문의 줄임 그대로 「하」로 두었다.", "「二十六日」은 11월 26일 미국 측 문서(이른바 헐 노트)의 제출을 가리킨다. 원문은 이를 「米側条件ノ提出」이라고만 적고 있다."], "warn": false, "pages": ["nichibei2_05_050"], "search": "フライシャー (플라이셔, Wilfrid Fleisher — 미국 언론인) 寺崎 (데라사키, 寺崎英成 — 주미대사관 서기관) 「ローズベルト」·「ロ」 (루스벨트, Franklin D. Roosevelt) 来栖大使 (구루스, 来栖三郎) 東条首相 (도조, 東条英機) 「ハル」·「ハ」 (헐, Cordell Hull) 胡適 (후스 — 주미 중국대사) 宋子文 (쑹쯔원)"}, {"id": "447", "order": 447, "date": "1941-12-03", "group": "A", "eyebrow": "문서 447 · スタンレー・ジョーンズを通じての和戦に関する大統領の意向打診について", "title": "스탠리 존스를 통한 화전(和戰)에 관한 대통령의 의향 타진에 관하여", "list_right": "문서 447", "meta": [{"k": "일자", "v": "1941-12-03"}, {"k": "원문 표기", "v": "昭和16年12月3日"}, {"k": "전보번호", "v": "第一二五五号（極秘、館長符号）"}, {"k": "발신", "v": "在米国野村大使 (주미 노무라 대사, 野村吉三郎)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신, 東郷茂徳)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 12月3日後発 / 本省 12月4日前着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "スタンレー・ジョーンズを通じての和戦に関する大統領の意向打診について", "txt": true, "wide": true}], "summary": "노무라 대사가, 데라사키와 가까운 사이인 「スタンレー・ジョンズ」(스탠리 존스)를 통해 12월 3일 오후 루스벨트 대통령과 극비 단독 면회를 갖게 하여 화전에 관한 대통령의 의향을 타진시킨 결과, 대통령이 태평양에서는 여전히 평화를 원하고 있음이 분명해졌으나 지급으로 외교적 타개책이 필요하다고 존스가 역설하였음을 보고한 전보.", "points": ["3일 오후, 데라사키(寺崎)와 밀접한 관계에 있는 「スタンレー・ジョンズ」(스탠리 존스)를 「ロ」(로=루스벨트) 대통령에게 면회시켰다. 극비리에 두 사람만의 회견이었다.", "화전(和戰)에 관한 대통령의 의향을 타진시킨 결과, 대통령은 태평양에서는 「依然平和ヲ欲シオル」(여전히 평화를 원하고 있는) 점이 명료해졌다.", "다만 지급으로 외교적으로 무엇인가의 타개(切抜)를 요한다는 뜻을 「ジョ」(존스)가 역설하였다.", "「ジョ」는 「キリスト」(그리스도) 신교의 최장로로서 신도 4천만 명을 거느리고 있는 유력 인물이다."], "primary": "[234면]\n제1255호（극비, 관장부호）\n　　워싱턴　12월 3일 후발(後発)\n　　본　성　　12월 4일 전착(前着)\n\n3일 오후, 데라사키(寺崎)와 밀접한 관계에 있는 「スタンレー・ジョンズ」(스탠리 존스)로 하여금 「ロ」(로=루스벨트) 대통령에게 면회(극비리에 두 사람만의 회견이었음)하여 화전(和戦)에 관한 대통령의 의향을 타진하게 한바, 대통령은 태평양에 있어서는 여전히 평화를 원하고 있는 점이 명료해졌다. 다만 지급으로 외교적으로 무엇인가의 타개(切抜)를 요한다는 뜻을 「ジョ」(존스)는 역설하였다.\n\n또한 「ジョ」는 「キリスト」(그리스도) 신교의 최장로로서 신도 4천만 명을 거느리고 있는 유력 인물이다.", "secondary": "[234面]\n第一二五五号（極秘、館長符号）\n　　ワシントン　12月3日後発\n　　本　省　　12月4日前着\n三日午後寺崎ト密接ナル関係アル「スタンレー・ジョンズ」ヲシテ「ロ」大統領ニ面会（極秘裡ニ二人限リノ会見ナリ）和戦ニ関スル大統領ノ意向ヲ打診セシメタル処大統領ハ太平洋ニ於テハ依然平和ヲ欲シオル点明瞭トナリタリ但至急外交的ニ何等カノ切抜ヲ要スル旨「ジョ」ハ力説セリ\n尚「ジョ」ハ「キリスト」信教ノ最長老ニシテ信徒四千万人ヲ率ヒオル有力人物ナリ", "notes": ["표제에서는 「スタンレー・ジョーンズ」로, 본문에서는 「スタンレー・ジョンズ」로 장음 부호 유무가 다르게 조판되어 있다. 지면 그대로 두었다.", "「ロ」大統領의 「ロ」는 「ローズヴェルト」(루스벨트)의 약기이다.", "「寺崎」는 주미 일본대사관 1등서기관 데라사키 히데나리(寺崎英成)이다.", "「切抜」(기리누케)는 「타개·활로를 뚫음」의 뜻이다.", "「和戦」은 화평이냐 전쟁이냐, 곧 강화와 개전의 갈림을 가리키는 당대의 말이다.", "「後発」·「前着」은 오후 발신·오전 도착을 뜻하는 전보 용어이다."], "warn": false, "pages": ["nichibei2_05_051"], "search": "野村吉三郎 (노무라 기치사부로) — 주미 대사 東郷茂徳 (도고 시게노리) — 외무대신 寺崎 (데라사키, 寺崎英成) — 주미 일본대사관 서기관 「スタンレー・ジョンズ」 (스탠리 존스, E. Stanley Jones) — 감리교 선교사 「ロ」大統領 (루스벨트, Franklin D. Roosevelt)"}, {"id": "448", "order": 448, "date": "1941-12-03", "group": "A", "eyebrow": "문서 448 · 仏印兵力増強に関する米国側覚書への回答につき意見具申", "title": "불인(佛印) 병력 증강에 관한 미국 측 각서에의 회답에 관하여 의견 구신(具申)", "list_right": "문서 448", "meta": [{"k": "일자", "v": "1941-12-03"}, {"k": "원문 표기", "v": "昭和16年12月3日"}, {"k": "전보번호", "v": "第一二五六号（極秘、館長符号）"}, {"k": "발신", "v": "在米国野村大使 (주미 노무라 대사, 野村吉三郎)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신, 東郷茂徳)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 12月3日後発 / 本省 12月4日後着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "仏印兵力増強に関する米国側覚書への回答につき意見具申", "txt": true, "wide": true}], "summary": "노무라 대사가, 일본군의 불인(프랑스령 인도차이나) 증파에 관한 미국 측 조회에 대한 본국의 회답 훈령(귀전 제875호)을 받고서, 미국 측이 이 회답을 일미 화전을 가르는 열쇠로 극히 중대시하고 있어 훈시된 설명만으로는 상대를 납득시키거나 미국 측의 조치를 저지하기 어렵다고 보아, 11월 10일 자신이 대통령에게 제시한 우리 안(案)의 취지대로 평화적 의도를 좀 더 명확히 한 회답으로 재고해 달라고 지급 회전(回電)을 요청한 전보.", "points": ["귀전 제875호（우리 불인 진주군 증강에 관한 풍설의 건）에 관하여.", "곧바로 회전을 받았고 그것이 물론 묘의(廟議)의 신중한 고려를 거친 것으로 배찰(拝察)하나, 미국 측은 이 건 회답을 「極メテ重要視」(극히 중요시)하고 있음이 귀전대로이다.", "특히 어제(12월 2일)의 대통령 성명 이래 신문 방면에서도 이 건 회답이 「日米和戦ヲ決スル鍵」(일미 화전을 결정하는 열쇠)라는 보도가 빈번히 전해지고 있다.", "우리 쪽 회답 여하에 따라서는 상대편도 상당히 思ヒ切リタル(과감한) 조치로 나올지도 모른다.", "정부가 참으로 교섭 타결을 기하시는 경우는 물론, 단지 교섭을 계속해 두시려는 의향의 경우에도, 시달하신 설명만으로는 상대를 납득시키거나 위와 같은 미국 측 조치를 저지하기 어렵다고 생각된다.", "현재 11월 10일 본사(本使)가 대통령에게 제시한 우리 안(案)에도 명시되어 있는 바가 있으니, 조금 더 우리 쪽의 평화적 의도를 명확히
