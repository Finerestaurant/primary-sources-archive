of the entire Pacific area. But the proposal contained a number of points unacceptable to the Japanese Government. For instance, with reference to the Tripartite Pact between Japan, Germany and Italy, the American Government asked the Japanese Government to give an undertaking not to menace the security of the United States when the latter should participate in the European war on the plea of self-defense. Again, as regards the China Affair, the American Government would undertake to use its good offices for the initiation of peace negotiations between the Japanese Government and the Chungking régime on such terms as were acceptable to the United States.\n[276면]\nAccordingly, the Japanese Government sent a counter-proposal in the middle of May, modifying the American proposal. Concerning the Tripartite Pact it was explicitly stated that Japan's obligation to render military assistance would arise as stipulated under the said treaty, while with regard to the China Affair, it was provided that the American Government, accepting the premises of the three Konoye Principles, the Sino-Japanese Basic Treaty and the Joint Declaration of Japan, Manchoukuo and China, and relying upon Japan's Policy of neighborly friendship, would urge upon the Chungking régime to enter into negotiations with the Japanese Government for the restoration of peace, and it was further stipulated that in case Chungking refused to accept the American advice, the United States was to cease from aiding the Chungking régime. Negotiations were continued further when in the latter part of June a new counter-proposal was submitted by the American Government, which, as compared with its proposal of April, set forth American claims in a more concrete manner. Discussions were continued to be held, revolving round this June proposal.\n2. In July, soon after the formation of the third Konoye Cabinet the Japanese Government took measures of joint defense of French Indo-China in accordance with the Protocal concluded between Japan and France, whereupon the American Government applied economic pressure by freezing Japanese assets. But the Japanese Government still hoped for a peaceful settlement, and in August premier Prince Konoye sent a personal message to President Roosevelt, setting forth fully the peaceful intentions of Japan, and proposing a meeting without delay between the responsible heads of the two Governments with a view to averting the crisis in the relations of the two countries. While accepting in principle the Konoye proposal, the American Government stoutly maintained its stand that it could not see its way to putting it into practice unless an [277면]agreement of view had been first reached on the pending issues, especially on the questions of the Tripartite Pact, the stationing of Japanese troops in China, and the non-discriminatory treatment in international commerce; and moreover, it held fast to its June proposal, refusing to make any concessions. Accordingly, the Japanese Government submitted on September 6 a proposal, followed by yet another proposal submitted on September 25 which took into account the American proposal of June and incorporated Japanese claims. Negotiations were continued until October 2, when the American Government requested clarification of Japan's intentions regarding the application of the four principles long advocated by the United States as fundamental principles of international relations namely:\n（1）Respect for the territorial integrity and the sovereignty of each and all nations.\n（2）Support of the principle of non-interference in the internal affairs of other countries.\n（3）Support of the principle of equality, including equality of commercial opportunity.\n（4）Non-disturbance of the status quo in the Pacific except as the status quo may be altered by peaceful means.\nAt the same time, it demanded the Japanese Government to clarify further its views concerning the three questions mentioned above. As a result, the negotiations struck an impasse. In the meantime the Konoye Cabinet resigned in the middle of October.\nSuch divergence of view as above mentioned between the two Governments was produced largely because the American Government obstinately adhered to utopian principles based on selfish views for dealing with international relations, and insisted upon the application thereof in China and elsewhere, regardless of the real conditions of East Asia. It was evident that so long as the American Government persisted in that [278면]attitude, there was little chance of bringing negotiations to a successful conclusion.\n3. The present Cabinet in its solicitude for the peace of the Pacific decided to continue the negotiation. With a view to effecting a settlement on an equitable basis, the Japanese Government formulated the following proposal concerning the three principal issues in the negotiations-namely （1）the right of self-defense in connection with the Tripartite Pact, （2）non-discriminatory treatment in international commerce, and （3）evacuation of troops from China and French Indo-China.\n（1）The American Government undertakes not to enlarge unduly the meaning of \"self-defense\"\n（2）The Japanese Government recognizes the principle of non-discrimination in international commercial relations to be applied to all the Pacific area, including China, on the understanding that the said principle is to be applied uniformly to the rest of the world.\n（3）Following the restoration of peace between Japan and China, the Japanese troops despatched to China in connection with the China Affair will be stationed for the necessary duration in specified areas, and the rest of the troops will be withdrawn upon the conclusion of peace and in accordance with the agreement between Japan and China. The troops in French Indo-China will be withdrawn immediately either upon the settlement of the China Affair or the establishment of peace in East Asia on an equitable basis.\nNegotiations were conducted on the basis of the above proposal. Meanwhile the Japanese Government requested the American Government to use its good offices, upon the conclusion of the Japanese-American negotiation, for the conclusion of a similar understanding with Great Britain and other countries [279면]concerning relevant subjects. Moreover, in order to do the utmost in the negotiation, dispatched Ambassador Kurusu posthaste to Washington to assist Admiral Nomura.\nOn the other hand, the American Government repeatedly urged that there would be no need for Japan to maintain the Tripartite Pact after the consummation of a Japanese-Amercan agreement, and expressed its hope that the said treaty would cease to exist or become a dead letter. As regards the principle of non-discrimination in international commerce, the American Government, insisting on its unconditional application to China, proposed the economic development of China jointly by the Powers. To this proposal the Japanese Government replied to the effect that with regard to the commercial non-discrimination principle, Japan hoped for its application throughout the world and that it would recognize its application to China in accordance with the realization of this principle throughout the world, and also that the American proposal for the joint international development of China was unacceptable to Japan as it would open the way for the joint international control of China. On these grounds, the Japanese Government requested the American Government to withdraw the proposal in question.\n4. On November17 and thereafter Admiral Nomura, together with Ambassador Kurusu, repeatedly met the American President and the Secretary of State and strongly urged upon the latter two the necessity of bringing about speedily an amicable conclusion of the negotiation. Discussions were extended over a few meetings at which the President stated that he was prepared to act as an \"introducer\" of peace between Japan and Chungking, and the Secretary of State emphasized, that, Japanese-American negotiations would prove difficult as long as Japan co-operated with Germany, and it was necessary to remove this fundamental difficulty. Despite these discussions, it [280면]became clear that the difficulty lay as before in the questions of the Tripartite Pact, of the international commercial non-discriminatory treatment and of China. In order to avert the rupture of diplomatic relations between the two countries, the Japanese Government presented on November 20, the following new proposal calculated to achieve an equitable solution of the more essential and urgent questions.\n（1）Both the Governments of Japan and the United States undertake not to make any armed advancement into any of the regions, excepting French Indo-China, in the South-eastern Asia and the Southern Pacific area.\n（2）The Governments of Japan and the United States shall cooperate with a view to securing the acquisition of those goods and commodities which the two countries need in the Netherlands East Indies.\n（3）The Governments of Japan and the United States mutually undertake to restore their commercial relations to those prevailing prior to the freezing of the assets\nThe Government of the United States shall supply Japan a required quantity of oil.\n（4）The Government of the United States undertakes not to indulge in measures and actions prejudicial to the endeavours for the restoration of general peace between Japan and China.\n（5）The Japanese Government undertakes to withdraw troops now stationed in French Indo-China upon either the restoration of peace between Japan and China or the establishment of an equitable peace in the Pacific area.\nThe Government of Japan declares that it is prepared to remove the Japanese troops now stationed in the southern part of French Indo-China to the northern part of the said [281면]territory upon the conclusion of the present agreement.\nRegarding the above proposal, the Secretary of State contended that it was impossible for the American Government to accept the item 4 of our proposal and cease aiding the Chiang Kai-shek régime unless Japan clarified her relations with the Tripartite Pact and gave assurances regarding her adoption of a peaceful policy, and that the President's offer to act as \"introducer\"of Sino-Japanese peace was predicated upon Japan's adoption of a peaceful policy. Thereupon, the Japanese Government instructed the two Ambassadors to request reconsideration by the American Government, pointing out to the Secretary of State that, in case direct negotiations were opened between Japan and Chungking through \"introduction\" by the President, the continuation of aid to the Chiang Kai-shek regime by the United States, the peace introducer, would constitute an interference with the realization of peace, and that the American contention was therefore inconsistent.\n5. Meanwhile, the American Government consulted with the representatives of Britain, Australia, the Netherlands and Chungking, and on November 22 the Secretary of State told our two Ambassadors that withdrawal of troops from southern French Indo-China alone would not be enough to ease the tense situation in the Southern Pacific and that he considered the time was not yet ripe for the so-called \"introduction\" of peace between Japan and Chungking by the President.\nSubsequently, the American Government continued consultations with the representatives of the Powers above-referred to and on November 26 the Secretary of State presented to our Ambassadors, as a basis for future negotiations, a proposal to the following effect, stating that, although the American Government had carefully studied the Japanese proposal of the 20th and consulted with the countries concerned, they could not unfortunately bring themselves to agree to our proposal.\n[282면]\n（A）In the new proposal, American Government reiterated, with reference to political relations, the above-mentioned four principles as the fundamental principles to be practically applied to mutual relations between Japan and the United States. However, it changed the item 4 to \"the principle of reliance upon international co-operation and conciliation for the prevention and pacific settlement of controversies and for improvement of internationl conditions by peaceful methods and processes.\" As regards economic relations, the American Government elaborated the third political principle concerning the equality of opportunity and equal treatment in commerce.\n（B）As measures to be adopted by the Governments of Japan and the United States it proposed as follows:\n（i）The Government of the United States and the Government of Japan will endeavor to conclude a multilateral non-aggression pact among the British Empire, China, Japan, the Netherlands, the Soviet Union, Thailand and the United States.\n（ii）Both Governments will endeavor to conclude among the American, British, Chinese, Japanese, the Netherlands and Thai Governments an agreement whereunder each of the Governments would pledge itself to respect the territorial integrity of French Indo-China and, in the event that there should develop a threat to the territorial integrity of Indo-China, to enter into immediate consulation with a view to taking such measures as may be deemed necessary and advisable to meet the threat in question.\nSuch agreement would provide also that each of the Government party to the agreement would not seek or accept preferential treatment in its trade or economic relations with Indo-China and would use its influence to obtain for each of the signatories equality of treatment in trade and [283면]commerce with French Indo-China.\n（iii）The Government of Japan will withdraw all military, naval, air and police forces from China and from Indo-China.\n（iv）The Government of the United States and the Government of Japan will not support—militarily, politically, economically—any Government or régime in China other than the National Government of the Republic of China with capital temporarily at Chungking.\n（v）Both Governments will give up all extraterritorial rights in China, including rights and interests in and with regard to international settlements and concessions, and rights under the Boxer Protocol of 1901.\nBoth Governments will endeavor to obtain the agreement of the British and other Governments to give up extraterritorial rights in China, including rights international settlements and in concessions and under the Boxer Protocol of 1901.\n（vi）The Government of the United States and the Government of Japan will enter into negotiations for the conclusion between the United States and Japan of a trade agreement, based upon reciprocal most favored-nation treatment and reduction of trade barriers by both countries, including an undertaking by the United States to bind raw silk on the free list.\n（vii）The Government of the United States and the Government of Japan will, respectively, remove the freezing restrictions on Japanese funds in the United States and on American funds in Japan.\n（viii）Both Governments will agree upon a plan for the stabilization of the dollar-yen rate, with the allocation of funds adequate for this purpose, half to be supplied by Japan and half by the United States.\n[284면]\n（ix）Both Governments will agree that no agreement which either has concluded with any third powers shall be interpreted by it in such a way as to conflict with the fundamental purpose of this agreement, the establishment and preservation of peace throughout the Pacific area.\n（x）Both Governments will use their influence to cause other Governments to adhere to and to give practical application to the basic political and economic principles set forth in this agreement.\nRegarding the above proposal, our Ambassador refuted the American claims pointing out their unreasonableness. But the Secretary of State failed to show any sign of concession, and on November 27 the President told our two Ambassadors that, although he still hoped for an amicable conclusion of the Japanese-American negotiations, he considered that it would be futile to try to surmount the crisis by a modus vivendi so long as the fundamental policies of the two countries were not in accord.\nThe Japanese Government, therefore, requested reconsideration of the American Government, because, despite the fact that our proposal of November 20 was made after fully considering the claims of both sides on the most equitable basis, the American Government, maintaining that it could not agree to this proposal, made a new proposal which entirely ignored the realities in East Asia and in particular completely changed its attitude with respect to the China question—a fact which led the Japanese Government to doubt the sincerity of the American Government. On December 2, however, the American Under-Secretary of State Welles, stating that he was acting under Presidential order, made an inquiry to our Government regarding our true intentions, saying that, according to their information, movements and reinforcement of Japanese troops were recently taking place in the region of French Indo-China. To this inquiry, the Japanese Government replied [285면]that, in view of the recent marked actvities of the Chungking forces in the neighborhood of the frontier between French Indo-China as a precautionary measure and that this naturally had resulted in movement of the troops in the Southern area. Meanwhile the American Government rapidly reinforced the encircling front against Japan and led public opinion to its own advantage and thus prepared the ground with a view to meeting the situation arising from the rupture of the negotiations.\n6. The Japanese Government made clear their attitude regarding the above-mentioned American proposal in its Memorandum to the American Government under date of December 7, the full text of which is published separately.", "notes": ["「支那」는 당대 일본의 표기이므로 「지나」로 그대로 옮겼다. 「支那事変」도 「지나사변」으로 두었다.", "「東三ノ間」「東溜間」은 궁중의 방 이름이다.", "「＝」는 11-28", "label": "테헤란 회담", "bar": true, "where": "테헤란", "note": "루스벨트·처칠·스탈린의 첫 3자 회담. 유럽 제2전선(노르망디)의 시기가 정해졌고, 스탈린은 독일 항복 뒤 대일전 참전을 처음으로 시사했다."}, {"id": "1944-06-06", "date": "1944-06-06", "label": "노르망디 상륙", "bar": true, "note": "연합군이 프랑스 북부에 상륙해 서부 제2전선이 열렸다. 유럽 전쟁의 승패가 사실상 이때 갈렸고, 미국 안에서 「그다음은 일본」이라는 계산이 본격화된다."}, {"id": "1944-07-25", "date": "1944-07-25", "label": "항복문서 완성", "bar": true, "key": true, "where": "런던 유럽자문위원회", "note": "유럽자문위원회가 「독일의 무조건 항복」 본문을 확정했다. 독일이 항복하기 아홉 달 전이고, 파리가 해방되기 한 달 전이다. 이 뒤의 넉 달은 새로 쓰는 것이 아니라 손질하는 기간이며, 정작 1945년 5월 7일 랭스에서는 지연을 우려해 이 문서 대신 간이 「항복문서」를 쓴다."}, {"id": "1944-10-20", "date": "1944-10-20", "label": "레이테 상륙", "bar": true, "where": "필리핀", "note": "맥아더가 필리핀 탈환에 착수했다. 뒤이은 레이테만 해전에서 일본 연합함대가 무너져, 일본 본토와 남방 자원지대를 잇는 해상 수송로가 끊긴다."}, {"id": "1944-12-22", "date": "1944-12-22", "docs": [["machinery-1945", "d486"]]}, {"id": "1944-12-28", "date": "1944-12-28", "docs": [["surrender-1945", "d368"]]}, {"id": "1945-01", "date": "1945-01", "docs": [["surrender-1945", "d340"]]}, {"id": "1945-01-03", "date": "1945-01-03", "docs": [["surrender-1945", "d370"]]}, {"id": "1945-01-04", "date": "1945-01-04", "docs": [["machinery-1945", "d130"]]}, {"id": "1945-01-25", "date": "1945-01-25", "docs": [["machinery-1945", "d139"]]}, {"id": "1945-02-04", "date": "1945-02-04", "label": "얄타 회담", "bar": true, "key": true, "where": "크림반도 얄타", "note": "루스벨트·처칠·스탈린의 두 번째 3자 회담. 소련의 대일 참전 조건이 비밀협정으로 정해졌고, 루스벨트가 스탈린에게 조선의 신탁통치를 꺼내며 「20년에서 30년」이라 말했다. 카이로의 「적당한 시기」에 처음으로 숫자가 붙은 자리다."}, {"id": "1945-02-08", "date": "1945-02-08", "docs": [["yalta-1945", "d393"]]}, {"id": "1945-02-08-1", "date": "1945-02-08", "docs": [["machinery-1945", "d149"]]}, {"id": "1945-03-09", "date": "1945-03-09", "docs": [["mofa-1945", "d949"]]}, {"id": "1945-03-10", "date": "1945-03-10", "label": "도쿄 대공습", "bar": true, "note": "B-29 편대의 야간 소이탄 공습으로 도쿄 시가지가 불탔다. 하룻밤 사망자가 10만 명 안팎으로 추정된다. 일본 안에서 본토 방위가 불가능하다는 인식이 퍼지기 시작한다."}, {"id": "1945-03-14", "date": "1945-03-14", "docs": [["machinery-1945", "d488"]]}, {"id": "1945-03-18", "date": "1945-03-18", "docs": [["field-1945", "tf58-2"]]}, {"id": "1945-03-23", "date": "1945-03-23", "docs": [["machinery-1945", "d161"]]}, {"id": "1945-03-30", "date": "1945-03-30", "docs": [["machinery-1945", "d165"]]}, {"id": "1945-04", "date": "1945-04", "docs": [["surrender-1945", "d343"]]}, {"id": "1945-04-01", "date": "1945-04-01", "label": "오키나와 전투", "bar": true, "note": "미군이 오키나와에 상륙해 6월까지 싸웠다. 사상자 규모가 본토 상륙전의 비용을 가늠하는 근거가 되어, 원폭 사용과 소련 참전 요청 양쪽의 논거로 쓰인다."}, {"id": "1945-04-05", "date": "1945-04-05", "docs": [["machinery-1945", "d172"]]}, {"id": "1945-04-06", "date": "1945-04-06", "docs": [["field-1945", "tf58-3"]]}, {"id": "1945-04-11", "date": "1945-04-11", "docs": [["field-1945", "tf58-4"]]}, {"id": "1945-04-12", "date": "1945-04-12", "label": "루스벨트 사망", "bar": true, "note": "루스벨트가 급서하고 트루먼이 승계했다. 트루먼은 얄타의 비밀협정도 원폭 개발도 취임 뒤에야 통보받았다. 조선 신탁통치 구상을 밀던 사람이 사라진 자리다."}, {"id": "1945-04-14", "date": "1945-04-14", "docs": [["machinery-1945", "d178"]]}, {"id": "1945-04-15", "date": "1945-04-15", "docs": [["machinery-1945", "d179"]]}, {"id": "1945-04-18", "date": "1945-04-18", "docs": [["machinery-1945", "d181"]]}, {"id": "1945-04-22", "date": "1945-04-22", "docs": [["machinery-1945", "d59"]]}, {"id": "1945-04-23", "date": "1945-04-23", "docs": [["machinery-1945", "d187"]]}, {"id": "1945-04-23-1", "date": "1945-04-23", "docs": [["machinery-1945", "d495"]]}, {"id": "1945-04-24", "date": "1945-04-24", "docs": [["machinery-1945", "d189"]]}, {"id": "1945-04-25", "date": "1945-04-25", "label": "힘러의 항복 제의", "bar": true, "key": true, "where": "뤼베크 · 스톡홀름", "note": "힘러가 4월 24일 새벽 뤼베크에서 베르나도테 백작을 만나, 서부전선만 아이젠하워에게 항복하겠다며 스웨덴 정부에 전달을 부탁했다. 히틀러가 뇌출혈로 이미 죽었거나 이틀을 넘기지 못한다는 말도 함께 전해진다. 트루먼과 처칠은 전화로 3국 동시 무조건항복 외에는 없다고 못 박는다."}, {"id": "1945-04-25-1", "date": "1945-04-25", "docs": [["veday-1945", "d548"]]}, {"id": "1945-04-25-2", "date": "1945-04-25", "docs": [["veday-1945", "d550"]]}, {"id": "1945-04-25-3", "date": "1945-04-25", "docs": [["veday-1945", "d549"]]}, {"id": "1945-04-28", "date": "1945-04-28", "docs": [["veday-1945", "d557"]]}, {"id": "1945-04-30", "date": "1945-04-30", "label": "히틀러 자살", "bar": true, "where": "베를린 총통관저", "note": "베를린 지하에서 히틀러가 자살하고 되니츠가 승계한다. 되니츠는 전쟁을 계속하겠다고 말했고, 연합국은 히틀러가 순교자로 남는 전설이 만들어지지 않도록 5월 2일 성명을 낸다.", "docs": [["veday-1945", "d75"]]}, {"id": "1945-05-01", "date": "1945-05-01", "docs": [["veday-1945", "d205"]]}, {"id": "1945-05-01-1", "date": "1945-05-01", "docs": [["veday-1945", "d203"]]}, {"id": "1945-05-02", "date": "1945-05-02", "label": "베를린 함락", "bar": true, "where": "베를린", "note": "소련군이 베를린을 함락했다. 이틀 전 히틀러가 자살했고 남은 것은 항복 절차뿐이었다. 미국 문서에 히틀러의 죽음은 부고가 아니라 「항복문서에 서명할 능력이 있는 중앙 권력이 없을 경우」라는 가정으로 나타난다.", "docs": [["veday-1945", "d560"]]}, {"id": "1945-05-04", "date": "1945-05-04", "docs": [["veday-1945", "d561"]]}, {"id": "1945-05-04-1", "date": "1945-05-04", "docs": [["veday-1945", "d562"]]}, {"id": "1945-05-04-2", "date": "1945-05-04", "docs": [["veday-1945", "d212"]]}, {"id": "1945-05-07", "date": "1945-05-07", "docs": [["veday-1945", "d566"]]}, {"id": "1945-05-07-1", "date": "1945-05-07", "docs": [["veday-1945", "d567"]]}, {"id": "1945-05-08", "date": "1945-05-08", "label": "독일 항복", "bar": true, "key": true, "where": "랭스 · 베를린", "note": "5월 7일 새벽 2시 41분 랭스에서 서명이 끝났으나, 발표는 8일까지 묶여 있었다. 스탈린은 동부전선에서 항복 명령이 이행될지 확실치 않다며 소련의 발표를 9일로 미뤘고, 8일 밤 베를린에서 다시 서명한다. 그날 서명한 것은 유럽자문위원회가 여덟 달 다듬어 온 항복문서가 아니라 초기 군사 조항만 담은 간이 문서였다.", "docs": [["veday-1945", "d224"]]}, {"id": "1945-05-10", "date": "1945-05-10", "docs": [["mofa-1945", "d951"]]}, {"id": "1945-05-10-1", "date": "1945-05-10", "docs": [["veday-1945", "d357"]]}, {"id": "1945-05-11", "date": "1945-05-11", "docs": [["surrender-1945", "d349"]]}, {"id": "1945-05-11-1", "date": "1945-05-11", "docs": [["field-1945", "tf58-5"]]}, {"id": "1945-05-12", "date": "1945-05-12", "docs": [["veday-1945", "d235"]]}, {"id": "1945-05-18", "date": "1945-05-18", "docs": [["mofa-1945", "d953"]]}, {"id": "1945-05-21", "date": "1945-05-21", "docs": [["surrender-1945", "d355"]]}, {"id": "1945-05-28", "date": "1945-05-28", "docs": [["surrender-1945", "d379"]]}, {"id": "1945-06-22", "date": "1945-06-22", "docs": [["surrender-1945", "d358"]]}, {"id": "1945-06-27", "date": "1945-06-27", "docs": [["surrender-1945", "d385"]]}, {"id": "1945-06-30", "date": "1945-06-30", "docs": [["mofa-1945", "d960"]]}, {"id": "1945-07-16", "date": "1945-07-16", "docs": [["surrender-1945", "d361"]]}, {"id": "1945-07-17", "date": "1945-07-17", "label": "포츠담 회담", "bar": true, "where": "베를린 근교 포츠담", "note": "트루먼·처칠(뒤에 애틀리)·스탈린의 회담. 회담 중 원폭 실험 성공이 보고되고, 대일 최후통첩의 문안이 다듬어진다."}, {"id": "1945-07-21", "date": "1945-07-21", "docs": [["mofa-1945", "d964"]]}, {"id": "1945-07-26", "date": "1945-07-26", "label": "포츠담 선언", "bar": true, "note": "미·영·중 명의로 일본에 무조건 항복을 요구했다. 제8항에 「카이로 선언의 조항은 이행되어야 한다」고 못박아, 조선 독립 약속이 항복 조건 안으로 들어온다. 일본은 이를 묵살(黙殺)한다고 발표했다."}, {"id": "1945-07-27", "date": "1945-07-27", "docs": [["mofa-1945", "d1079"]]}, {"id": "1945-08", "date": "1945-08", "docs": [["frus-1945", "d771"]]}, {"id": "1945-08-02", "date": "1945-08-02", "docs": [["surrender-1945", "d364"]]}, {"id": "1945-08-04", "date": "1945-08-04", "docs": [["surrender-1945", "d390"]]}, {"id": "1945-08-06", "date": "1945-08-06", "label": "히로시마", "bar": true, "key": true, "note": "히로시마에 원자폭탄이 투하됐다. 트루먼은 같은 날 성명을 내 「이제껏 없던 폭탄」임을 알리고 항복하지 않으면 파멸이 이어질 것이라 경고했다.", "disp": "08.06", "docs": [["surrender-1945", "d401"]]}, {"id": "1945-08-08", "date": "1945-08-08", "label": "소련 참전", "bar": true, "note": "소련이 일본에 선전포고하고 이튿날 만주로 진공했다. 얄타에서 약속한 「독일 항복 뒤 3개월」을 지킨 날짜다. 미국이 조선에 지상군을 두려면 시간이 없다는 것이 이날 분명해진다.", "disp": "08.08", "docs": [["surrender-1945", "d402"]]}, {"id": "1945-08-09", "date": "1945-08-09", "label": "나가사키", "bar": true, "note": "나가사키에 두 번째 원자폭탄이 투하됐다. 같은 날 밤 어전회의가 열려 국체 유지를 조건으로 한 항복 제의가 정해진다.", "docs": [["mofa-1945", "d1085"]]}, {"id": "1945-08-10", "date": "1945-08-10", "disp": "08.10", "docs": [["surrender-1945", "d406"]]}, {"id": "1945-08-10-1", "date": "1945-08-10", "disp": "08.10 06:45", "docs": [["mofa-1945", "d1086"]]}, {"id": "1945-08-10-2", "date": "1945-08-10", "disp": "08.10 18:00", "docs": [["mofa-1945", "d1091"]]}, {"id": "1945-08-11", "date": "1945-08-11", "label": "38선 획정", "bar": true, "key": true, "note": "일반명령 제1호(SWNCC 21/5)가 고쳐지면서 조선이 북위 38도로 갈렸다. 한 문서의 b항과 f항, 다섯 조항 사이에 조선이 둘로 나뉘어 적혔다. 합참이 든 이유는 미군에게 경성의 항만과 교통 지역을 주기 위해서였다.", "docs": [["surrender-1945", "d418"]]}, {"id": "1945-08-11-1", "date": "1945-08-11", "disp": "08.11", "docs": [["surrender-1945", "d410"]]}, {"id": "1945-08-11-2", "date": "1945-08-11", "disp": "08.11", "docs": [["surrender-1945", "d412"]]}, {"id": "1945-08-11-3", "date": "1945-08-11", "disp": "08.11", "docs": [["surrender-1945", "d418"]]}, {"id": "1945-08-11-4", "date": "1945-08-11", "disp": "08.11 10:46", "docs": [["surrender-1945", "d413"]]}, {"id": "1945-08-11-5", "date": "1945-08-11", "disp": "08.11 밤", "docs": [["mofa-1945", "d1093"]]}, {"id": "1945-08-12", "date": "1945-08-12", "disp": "08.12", "docs": [["surrender-1945", "d425"]]}, {"id": "1945-08-12-1", "date": "1945-08-12", "disp": "08.12", "docs": [["surrender-1945", "d427"]]}, {"id": "1945-08-14", "date": "1945-08-14", "disp": "08.14", "docs": [["surrender-1945", "d442"]]}, {"id": "1945-08-14-1", "date": "1945-08-14", "disp": "08.14", "docs": [["surrender-1945", "d431"]]}, {"id": "1945-08-14-2", "date": "1945-08-14", "disp": "08.14", "docs": [["surrender-1945", "d437"]]}, {"id": "1945-08-14-3", "date": "1945-08-14", "disp": "08.14", "docs": [["mofa-1945", "d1098"]]}, {"id": "1945-08-14-4", "date": "1945-08-14", "disp": "08.14 20:05", "docs": [["mofa-1945", "d1097"]]}, {"id": "1945-08-14-5", "date": "1945-08-14", "disp": "08.14 20:10", "docs": [["surrender-1945", "d440"]]}, {"id": "1945-08-15", "date": "1945-08-15", "label": "일본 항복", "bar": true, "key": true, "note": "일본이 포츠담 선언 수락을 방송으로 알렸다. 전날 밤 일부 장교들이 방송을 막으려 궁성을 봉쇄하고 총리 관저를 습격했으나 실패했고, 아나미 육군대신은 새벽에 자결했다.", "disp": "08.15", "docs": [["mofa-1945", "d1100"]]}, {"id": "1945-09-02", "date": "1945-09-02", "label": "항복문서 조인", "bar": true, "where": "도쿄만 미주리함", "note": "도쿄만의 미주리함 위에서 항복문서에 서명했다. 이 문서로 연합국최고사령관(SCAP)의 권한이 발효되고, 일반명령 제1호가 법적 효력을 갖는다."}, {"id": "1945-09-08", "date": "1945-09-08", "label": "미군 인천 상륙", "bar": true, "key": true, "note": "하지 중장의 제24군단이 인천에 상륙해 이튿날 조선총독부의 항복을 받았다. 미군정이 시작된다. 닷새 뒤 하지는 카이로의 「in due course」가 조선어로 「수일 내」로 옮겨져 퍼져 있었다는 것을 알게 된다."}, {"id": "1945-09-09", "date": "1945-09-09", "docs": [["scap-0141", "1"]]}, {"id": "1945-09-13", "date": "1945-09-13", "docs": [["scap-0141", "2"]]}, {"id": "1945-09-24", "date": "1945-09-24", "docs": [["scap-0141", "2-B"]]}, {"id": "1945-09-27", "date": "1945-09-27", "disp": "09.27", "docs": [["surrender-1945", "d507"]]}, {"id": "1945-10-10", "date": "1945-10-10", "disp": "10.10", "docs": [["surrender-1945", "d526"]]}, {"id": "1945-11-13", "date": "1945-11-13", "docs": [["field-1945", "toyoda-2"]]}, {"id": "1945-11-13-1", "date": "1945-11-13", "docs": [["field-1945", "toyoda-5"]]}, {"id": "1945-11-14", "date": "1945-11-14", "docs": [["field-1945", "toyoda-7"]]}, {"id": "1945-11-14-1", "date": "1945-11-14", "docs": [["field-1945", "toyoda-8"]]}, {"id": "1945-11-23", "date": "1945-11-23", "disp": "11.23", "docs": [["surrender-1945", "d488"]]}, {"id": "1945-12-27", "date": "1945-12-27", "label": "모스크바 3상회의", "bar": true, "key": true, "note": "미·영·소 외상이 조선에 최대 5년의 신탁통치를 두고 미소공동위원회를 설치하기로 합의했다. 카이로의 「적당한 시기」가 마침내 문서상의 기한이 된 자리이자, 조선 안에서 신탁통치 반대 운동이 폭발한 계기다."}, {"id": "1946-01", "date": "1946-01", "docs": [["scap-0141", "6"]]}, {"id": "1946-03-20", "date": "1946-03-20", "label": "1차 미소공동위", "bar": true, "where": "서울", "note": "임시정부 수립을 협의할 미소공동위원회가 열렸다. 어느 정당·사회단체와 협의할 것인가를 두고 갈라져 5월에 결렬된다."}, {"id": "1946-04", "date": "1946-04", "docs": [["scap-0141", "7-J"]]}, {"id": "1946-10-01", "date": "1946-10-01", "label": "대구 10월 사건", "bar": true, "note": "식량 공출과 경찰에 대한 항의가 대구에서 시작해 남한 전역으로 번졌다. 미군정이 계엄을 선포하고 진압했다. 점령 1년 만에 통치의 정당성이 시험대에 오른 사건이다."}, {"id": "1947-05-21", "date": "1947-05-21", "label": "2차 미소공동위", "bar": true, "where": "서울", "note": "미소공동위원회가 다시 열렸으나 같은 쟁점에서 다시 갈라져 10월에 사실상 끝난다. 미국은 이 무렵부터 조선 문제를 유엔으로 넘기는 쪽으로 방향을 바꾼다."}, {"id": "1947-09-17", "date": "1947-09-17", "label": "한국 문제 유엔 이관", "bar": true, "key": true, "note": "미국이 조선 문제를 유엔 총회에 상정했다. 4개국 신탁통치라는 전시 구상이 공식적으로 폐기되고, 처리의 무대가 미소 양자에서 유엔으로 옮겨간다."}, {"id": "1948-01-08", "date": "1948-01-08", "label": "유엔한국임시위원단 입국", "bar": true, "note": "유엔한국임시위원단(UNTCOK)이 서울에 들어왔다. 소련이 북위 38도 이북 입경을 거부해, 감시할 수 있는 지역에서만 선거를 치른다는 결론으로 이어진다."}, {"id": "1948-02", "date": "1948-02", "docs": [["ndl-091", "D024"]]}, {"id": "1948-04", "date": "1948-04", "docs": [["ndl-091", "D014"]]}, {"id": "1948-04-02", "date": "1948-04-02", "docs": [["korea-1948-50", "48-d776"]]}, {"id": "1948-04-28", "date": "1948-04-28", "docs": [["korea-1948-50", "48-d790"]]}, {"id": "1948-05-10", "date": "1948-05-10", "label": "5·10 총선거", "bar": true, "key": true, "note": "남한만의 제헌국회 선거가 치러졌다. 좌익과 김구·김규식 계열이 불참했다. 분단이 절차를 갖춘 사실이 되는 날이다."}, {"id": "1948-05-11", "date": "1948-05-11", "docs": [["korea-1948-50", "48-d797"]]}, {"id": "1948-05-15", "date": "1948-05-15", "docs": [["korea-1948-50", "48-d801"]]}, {"id": "1948-08-09", "date": "1948-08-09", "docs": [["korea-1948-50", "48-d862"]]}, {"id": "1948-08-15", "date": "1948-08-15", "label": "대한민국 정부 수립", "bar": true, "key": true, "note": "대한민국 정부가 수립되고 미군정이 끝났다. 카이로에서 「in due course」라고 적힌 지 4년 9개월 뒤다. 북에서는 9월 9일 조선민주주의인민공화국이 수립된다."}, {"id": "1948-08-17", "date": "1948-08-17", "docs": [["korea-1948-50", "48-d872"]]}, {"id": "1948-12-12", "date": "1948-12-12", "label": "유엔총회 결의 195(III)", "bar": true, "where": "파리 유엔총회", "note": "유엔 총회가 대한민국 정부를 위원단이 감시할 수 있었던 지역의 합법 정부로 승인했다. 「조선 전역의 유일 합법 정부」라는 뒷날의 표현과 결의문의 문언은 같지 않다.", "docs": [["korea-1948-50", "48-d924"]]}, {"id": "1948-12-17", "date": "1948-12-17", "docs": [["korea-1948-50", "48-d926"]]}, {"id": "1948-12-22", "date": "1948-12-22", "docs": [["korea-1948-50", "48-d928"]]}, {"id": "1949-03-22", "date": "1949-03-22", "docs": [["korea-1948-50", "49-d209"]]}, {"id": "1949-06-11", "date": "1949-06-11", "docs": [["korea-1948-50", "49-d262"]]}, {"id": "1949-06-26", "date": "1949-06-26", "label": "김구 피살", "bar": true, "key": true, "where": "서울 경교장", "note": "한국독립당 위원장 김구가 육군 소위 안두희의 총에 죽었다. 무초는 이튿날 「공식·비공식 여러 경로에서 지금까지 모은 바」로 시작하는 전문을 올린다 — 전날 첫 전문에는 아무 세부사항이 없었다."}, {"id": "1949-06-27", "date": "1949-06-27", "docs": [["korea-1948-50", "49-d265"]]}, {"id": "1949-06-27-1", "date": "1949-06-27", "docs": [["korea-1948-50", "49-d266"]]}, {"id": "1949-06-29", "date": "1949-06-29", "label": "주한미군 철수 완료", "bar": true, "key": true, "where": "서울", "note": "전투부대 철수가 끝나고 군사고문단(KMAG) 약 500명만 남았다. 철수 날짜를 이승만과 매듭짓는 일이 1949년 전반기 대사관 전문의 주된 내용이었다."}, {"id": "1949-10-01", "date": "1949-10-01", "label": "중화인민공화국 수립", "bar": true, "where": "베이징", "note": "국공내전이 사실상 끝났다. 무초는 다섯 달 전 이승만에게 중국의 결과가 조선에 당장 자국을 남기지는 않으리라고 말했었다."}, {"id": "1950-01-12", "date": "1950-01-12", "label": "애치슨 연설", "bar": true, "key": true, "where": "워싱턴 내셔널프레스클럽", "note": "애치슨이 미국의 태평양 방위선을 알류샨–일본–류큐–필리핀으로 그었다. 조선은 그 선 안에 들지 않았다. 이승만이 아홉 달 전 무초에게 우려한 바로 그 이야기다."}, {"id": "1950-01-20", "date": "1950-01-20", "docs": [["korea-1948-50", "50-d3"]]}, {"id": "1950-06-09", "date": "1950-06-09", "docs": [["korea-1948-50", "50-d46"]]}, {"id": "1950-06-14", "date": "1950-06-14", "docs": [["korea-1948-50", "50-d53"]]}, {"id": "1950-06-19", "date": "1950-06-19", "docs": [["korea-1948-50", "50-d57"]]}, {"id": "1950-06-23", "date": "1950-06-23", "docs": [["korea-1948-50", "50-d58"]]}, {"id": "1950-06-25", "date": "1950-06-25", "label": "한국전쟁 발발", "bar": true, "key": true, "where": "38선 전역", "note": "북한군이 38선 전역에서 남침했다. 유엔 안전보장이사회는 같은 날 결의 82호로 적대행위 중지와 38선 이북으로의 철수를 요구했다.", "docs": [["korea-1950-53", "50-d62"]]}, {"id": "1950-06-27", "date": "1950-06-27", "label": "안보리 결의 83호", "bar": true, "key": true, "where": "뉴욕 유엔 안보리", "note": "안보리가 회원국에 대한민국을 돕는 데 필요한 지원을 권고했다. 소련 대표는 중국 대표권 문제로 회의를 비우고 있어 거부권이 행사되지 않았다.", "docs": [["korea-1950-53", "50-d130"]]}, {"id": "1950-06-28", "date": "1950-06-28", "label": "서울 함락", "where": "서울", "note": "개전 나흘 만에 서울이 무너졌다. 한강 인도교가 새벽에 끊겨 시민과 국군 상당수가 강 북쪽에 남았다.", "bar": true, "key": true, "docs": [["crest-war", "W004"]]}, {"id": "1950-07-05", "date": "1950-07-05", "label": "오산 전투", "where": "오산", "note": "미 지상군이 처음 싸웠다. 스미스 특수임무부대가 오산 북쪽에서 북조선군 전차를 막지 못하고 물러났다.", "bar": true, "docs": [["crest-war", "W021"]]}, {"id": "1950-07-07", "date": "1950-07-07", "docs": [["korea-1950-53", "50-d238"]]}, {"id": "1950-07-20", "date": "1950-07-20", "label": "대전 함락", "where": "대전", "note": "미 24사단이 대전에서 밀려났다. 사단장 딘 소장이 부대와 떨어져 낙오했고, 뒤에 사로잡힌다.", "bar": true, "docs": [["crest-war", "W082"]]}, {"id": "1950-08-01", "date": "1950-08-01", "label": "낙동강 방어선", "where": "낙동강", "note": "유엔군이 낙동강 동남쪽으로 물러나 마지막 선을 쳤다. 대구와 부산을 등지고 두 달 가까이 버틴다.", "bar": true, "key": true, "docs": [["crest-war", "W096"]]}, {"id": "1950-09-15", "date": "1950-09-15", "label": "인천 상륙", "bar": true, "key": true, "where": "인천", "note": "미 제10군단이 인천에 상륙했다. 9월 28일 서울을 되찾고, 10월 1일 국군이 38선을 넘는다."}, {"id": "1950-09-16", "date": "1950-09-16", "label": "낙동강 돌파", "where": "낙동강", "note": "인천 상륙 다음 날 유엔군이 낙동강 방어선에서 반격으로 돌아섰다.", "bar": true, "docs": [["crest-war", "W201"]]}, {"id": "1950-09-28", "date": "1950-09-28", "label": "서울 수복", "where": "서울", "note": "석 달 만에 서울을 되찾았다. 이튿날 이승만과 맥아더가 중앙청에서 환도식을 열었다.", "bar": true, "key": true, "docs": [["crest-war", "W233"]]}, {"id": "1950-09-30", "date": "1950-09-30", "docs": [["korea-1950-53", "50-d577"]]}, {"id": "1950-10", "date": "1950-10", "docs": [["korea-1950-53", "50-d640"]]}, {"id": "1950-10-01", "date": "1950-10-01", "label": "국군 38선 돌파", "where": "38선", "note": "국군 3사단이 동해안에서 38선을 넘었다. 유엔군의 북진은 10월 7일 총회 결의 뒤에 이어진다.", "bar": true, "key": true}, {"id": "1950-10-03", "date": "1950-10-03", "docs": [["korea-1950-53", "50-d593"]]}, {"id": "1950-10-12", "date": "1950-10-12", "docs": [["korea-1950-53", "50-d665"]]}, {"id": "1950-10-15", "date": "1950-10-15", "docs": [["korea-1950-53", "50-d680"]]}, {"id": "1950-10-19", "date": "1950-10-19", "label": "중공군 압록강 도하", "bar": true, "key": true, "where": "압록강", "note": "중국인민지원군이 압록강을 건너기 시작했다. 10월 25일 첫 공세가 시작되고, 전쟁의 성격이 바뀐다."}, {"id": "1950-10-19-pyongyang", "date": "1950-10-19", "label": "평양 함락", "where": "평양", "bar": true, "key": true, "note": "유엔군이 평양에 들어갔다. 북조선 정부는 이미 강계로 옮겨 간 뒤였다. 같은 날 중공군이 압록강을 건너기 시작한다.", "docs": [["crest-war", "W285"]]}, {"id": "1950-10-26", "date": "1950-10-26", "label": "초산 도달", "where": "초산", "note": "국군 6사단 7연대가 압록강에 닿았다. 유엔군이 국경에 이른 유일한 자리이고, 같은 무렵 중공군 1차 공세가 시작된다.", "bar": true}, {"id": "1950-11", "date": "1950-11", "docs": [["korea-1950-53", "50-d877"]]}, {"id": "1950-11-01", "date": "1950-11-01", "docs": [["korea-1950-53", "50-d731"]]}, {"id": "1950-11-03", "date": "1950-11-03", "docs": [["korea-1950-53", "50-d736"]]}, {"id": "1950-11-17", "date": "1950-11-17", "docs": [["korea-1950-53", "50-d847"]]}, {"id": "1950-11-24", "date": "1950-11-24", "docs": [["korea-1950-53", "50-d877"]]}, {"id": "1950-11-25", "date": "1950-11-25", "label": "중공군 2차 공세", "where": "청천강·장진호", "note": "중공군이 청천강과 장진호 양쪽에서 대공세에 나섰다. 유엔군의 총공세가 사흘 만에 무너지고 전면 후퇴가 시작된다.", "bar": true, "key": true}, {"id": "1950-12", "date": "1950-12", "docs": [["korea-1950-53", "50-d1003"]]}, {"id": "1950-12-15", "date": "1950-12-15", "label": "흥남 철수 시작", "where": "흥남", "note": "동부 전선의 유엔군과 피난민이 흥남에서 배로 빠져나가기 시작했다. 12월 24일까지 십만 명 넘는 피난민이 함께 실려 나갔다.", "bar": true, "key": true}, {"id": "1951-01-04", "date": "1951-01-04"}, {"id": "1951-03-14", "date": "1951-03-14", "label": "서울 재수복", "where": "서울", "note": "유엔군이 서울을 다시 찾았다. 전선은 이 뒤로 38선 언저리에서 굳는다.", "bar": true}, {"id": "1951-04-11", "date": "1951-04-11", "label": "맥아더 해임", "bar": true, "key": true, "where": "워싱턴", "note": "트루먼이 맥아더를 유엔군사령관·극동군사령관에서 해임했다. 전쟁을 중국으로 넓힐 것인가를 두고 갈린 끝이다.", "docs": [["korea-1950-53", "51-d225"]]}, {"id": "1951-06-23", "date": "1951-06-23", "label": "말리크 방송", "where": "유엔", "note": "소련 유엔대표 말리크가 방송에서 정전을 제안했다. 두 주 남짓 뒤 개성에서 회담이 열린다.", "bar": true, "key": true}, {"id": "1951-07-10", "date": "1951-07-10", "label": "정전회담 개시", "bar": true, "key": true, "where": "개성", "note": "개성에서 정전회담이 시작됐다. 회담장은 10월에 판문점으로 옮겨지고, 조인까지 다시 두 해가 걸린다."}, {"id": "1951-10-25", "date": "1951-10-25"}, {"id": "1951-11-27", "date": "1951-11-27"}, {"id": "1952", "date": "1952"}, {"id": "1952-05", "date": "1952-05", "docs": [["korea-1950-53", "52-d107"]]}, {"id": "1952-05-07", "date": "1952-05-07", "label": "거제도 포로수용소 사건", "where": "거제도", "note": "포로들이 수용소장 도드 준장을 붙잡았다. 포로 송환 문제가 회담을 붙든 두 해의 한복판이다.", "bar": true, "key": true}, {"id": "1952-10", "date": "1952-10"}, {"id": "1953-01", "date": "1953-01", "docs": [["korea-1950-53", "52-d376"]]}, {"id": "1953-04", "date": "1953-04"}, {"id": "1953-06-18", "date": "1953-06-18", "label": "반공포로 석방", "bar": true, "where": "부산·논산 등 포로수용소", "note": "이승만이 유엔군에 알리지 않고 반공포로 약 2만 5천 명을 풀어 주었다. 포로 송환 문제는 정전회담이 가장 오래 붙들려 있던 대목이다.", "docs": [["korea-1950-53", "53-d607"]]}, {"id": "1953-07-27", "date": "1953-07-27", "label": "정전협정 조인", "bar": true, "key": true, "where": "판문점", "note": "정전협정이 조인됐다. 대한민국은 서명하지 않았다. 평화조약이 아니라 군사적 정전이며, 그 상태가 지금까지 이어진다.", "docs": [["korea-1950-53", "53-d724"]]}, {"id": "1953-10-01", "date": "1953-10-01", "label": "한미상호방위조약 조인", "bar": true, "key": true, "where": "워싱턴", "note": "한미상호방위조약이 조인됐다(발효는 이듬해 11월 17일). 1949년 6월 철수로 비었던 자리를 조약이 대신한다."}]}, "terms": {"_": [{"w": "W. Walton Butterworth, Jr.", "k": "_:31", "href": null}, {"w": "Archibald J. K. Clark Kerr", "k": "_:92", "href": null}, {"w": "Edward R. Stettinius, Jr.", "k": "_:20", "href": null}, {"w": "Sir Archibald Clark Kerr", "k": "_:92", "href": null}, {"w": "Fedor Tarasovich Gousev", "k": "_:38", "href": null}, {"w": "William H. Draper, Jr.", "k": "_:53", "href": null}, {"w": "E. Allan Lightner, Jr.", "k": "_:101", "href": null}, {"w": "H. Merrell Benninghoff", "k": "_:107", "href": null}, {"w": "Lord Louis Mountbatten", "k": "_:138", "href": null}, {"w": "Franklin D. Roosevelt", "k": "_:6", "href": null}, {"w": "W. Walton Butterworth", "k": "_
