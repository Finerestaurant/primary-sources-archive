 한 회답 방식이 바람직하다.", "가능하다면 위 취지로 재고하신 뒤 지급으로 무언가의 회전(回電)을 주시기 바란다."], "primary": "[234면]\n제1256호（극비, 관장부호）\n　　워싱턴　12월 3일 후발\n　　본　성　　12월 4일 후착\n\n귀전 제875호（우리 불인(仏印) 진주군 증강에 관한 풍설의 건）에 관하여.\n\n곧바로 회전(回電)을 접하였는바, 위는 물론 묘의(廟議)의 신중한 고려를 거친 것으로 배찰(拝察)하나, 미국 측에 있어서는 본건 회답을 극히 중요시하고 있음이 귀전대로이며, 특히 어제의 대통령 성명 이래 신문 방면에서도 본건 회답은 일미 화전(和戦)을 결정하는 열쇠라는 보도가 빈번히 전해지고 있다. 우리 쪽 회답 방식 여하에 따라서는 상대편도 상당히 과감한(思ヒ切リタル) 조치로 나올지도 헤아릴 수 없는 터인데, 정부에서 참으로 교섭 타결을 기하시는 경우에는 물론, 단지 교섭을 계속해 두시려는 의향의 경우에 있어서도, 내시(来示)하신 설명을 가지고서는 상대편을 납득시키거나 또는 앞서 말한 것과 같은 미국 측의 조치를 저지하는 것이 곤란하다고 생각되므로, 현재 11월 10일 본사(本使)로부터 대통령에게 제시한 우리 안(案)에도 명시되어 있는 바가 있고 하니, 조금 더 우리 쪽의 평화적 의도를 명확히 한 회답 방식이 바람직한 까닭에, 될 수 있으면 위 취지로 재고하신 뒤 지급으로 무언가의 회전을 번거로이 하여 주시기 바란다.", "secondary": "[234面]\n第一二五六号（極秘、館長符号）\n　　ワシントン　12月3日後発\n　　本　省　　12月4日後着\n貴電第八七五号（我仏印進駐軍増強ニ関スル風説ノ件）ニ関シ\n早速御回電ニ接セル処右ハ勿論廟議ノ慎重ナル御考慮ヲ経タルモノト拝察スルモ米国側ニ於テハ本件回答ヲ極メテ重要視シ居ルコト貴電ノ通リニテ殊ニ昨日ノ大統領ノ声明以来新聞方面ニ於テモ本件回答ハ日米和戦ヲ決スル鍵ナリトノ報道頻々トシテ伝ヘラレ居リ我方ノ回答振リ如何ニ依リテハ先方モ相当思ヒ切リタル措置ニ出ツルヤモ計ラレサル処政府ニ於テ真ニ交渉妥結ヲ期セラルルニ於テハ勿論単ニ交渉ヲ継続シオク御意向ノ場合ニ於テモ御来示ノ説明ヲ以テシテハ先方ヲ納得セシメ又ハ前記ノ如キ米側ノ措置ヲ阻止スルコト困難ト存セラルルニ付現ニ十一月十日本使ヨリ大統領ニ提示セル我方案ニモ明示シアル次第モ有之今少シク我方ノ平和的意図ヲ明カニセル回答振リ望マシキヲ以テ出来得レハ右趣旨ニテ御再考ノ上至急何分ノ御回電相煩シ度シ", "notes": ["「仏印」은 프랑스령 인도차이나(佛領印度支那)의 약칭이다.", "「貴電第八七五号」는 이에 앞선 도고 외무대신의 훈령이다. 이 전보에 대한 도고의 회답이 문서 449이다.", "「廟議」는 조정(정부)의 어전 회의·각의 등의 심의를 이르는 말이다.", "「昨日ノ大統領ノ声明」은 12월 2일 미국 측이 일본군의 불인 증파에 관하여 일본 정부에 조회한 일을 가리킨다.", "「本使」는 발신자인 노무라 대사 자신을 가리키는 자칭이다.", "「和戦」은 화평이냐 전쟁이냐를 이르는 당대의 말이다.", "「何分ノ御回電」은 「어떻게든 무언가의 회전(지시)」이라는 뜻이다."], "warn": false, "pages": ["nichibei2_05_051"], "search": "野村吉三郎 (노무라 기치사부로) — 주미 대사 東郷茂徳 (도고 시게노리) — 외무대신 大統領 (루스벨트, Franklin D. Roosevelt)"}, {"id": "449", "order": 449, "date": "1941-12-04", "group": "B", "eyebrow": "문서 449 · 仏印兵力増強に関する米国側覚書への回答につき訓令", "title": "불인(佛印) 병력 증강에 관한 미국 측 각서에의 회답에 관한 훈령", "list_right": "문서 449", "meta": [{"k": "일자", "v": "1941-12-04"}, {"k": "원문 표기", "v": "昭和16年12月4日"}, {"k": "전보번호", "v": "第八九一号（大至急、館長符号）"}, {"k": "발신", "v": "東郷外務大臣 (도고 외무대신, 東郷茂徳)", "txt": true}, {"k": "수신", "v": "在米国野村大使 (주미 노무라 대사, 野村吉三郎)", "txt": true}, {"k": "발신·착신", "v": "本省 12月4日後11時59分発", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "仏印兵力増強に関する米国側覚書への回答につき訓令", "txt": true, "wide": true}], "summary": "도고 외무대신이, 회답 내용을 좀 더 명확히 하자는 노무라 대사의 의견 구신(문서 448)에 대하여, 그 취지는 일단 지당하나 이때 왕전 제875호 이상으로 설명을 주는 것은 기미(機微)한 관계도 있어 도리어 재미없는 결과를 부를 우려가 있으니 왕전의 취지대로 회답해 두라고 지시한 대지급 훈령.", "points": ["귀전 제1256호(문서 448)에 관하여.", "귀전의 취지는 「一応尤モナルモ」(일단 지당하나).", "이때 왕전(往電) 제875호 이상으로 설명을 주는 것은 「機微ナル関係モアリ」(기미한 관계도 있어).", "도리어 「面白カラサル結果」(재미없는 결과)를 초래할 우려가 있다.", "그러므로 이때는 위 왕전의 취지에 따라 회답해 두시기 바란다.", "발신 시각이 「12月4日後11時59分発」로 분 단위까지 기재되어 있다."], "primary": "[235면]\n제891호（대지급, 관장부호）\n　　본　성　　12월 4일 후(後) 11시 59분 발\n\n귀전 제1256호에 관하여.\n\n귀전의 취지는 일단 지당하나, 이때 왕전(往電) 제875호 이상으로 설명을 주는 것은 기미(機微)한 관계도 있어 도리어 재미없는 결과를 초래할 우려가 있으므로, 이때는 위 왕전의 취지에 따라 회답해 두시기 바란다.", "secondary": "[235面]\n第八九一号（大至急、館長符号）\n　　本　省　　12月4日後11時59分発\n貴電第一二五六号ニ関シ\n貴電ノ御趣旨一応尤モナルモ此ノ際往電第八七五号以上ニ説明ヲ与フルコトハ機微ナル関係モアリ却ツテ面白カラサル結果ヲ招来スル惧アルニ付此ノ際ハ右往電ノ趣旨ニヨリ回答シ置カレ度", "notes": ["「貴電第一二五六号」는 문서 448(12월 3일 노무라 대사의 의견 구신)이다.", "「往電第八七五号」는 앞서 도쿄에서 보낸 훈령으로, 그 내용의 범위를 넘어서지 말라는 뜻이다.", "「機微ナル関係」는 미묘하여 밖에 드러내기 어려운 사정을 이른다. 무엇을 가리키는지는 지면에 밝혀져 있지 않다.", "「面白カラサル」는 「달갑지 않은·좋지 않은」의 뜻이다.", "「後11時59分」은 오후 11시 59분이다. 12월 4일이 끝나기 1분 전에 발신된 셈이다."], "warn": false, "pages": ["nichibei2_05_052"], "search": "東郷茂徳 (도고 시게노리) — 외무대신 野村吉三郎 (노무라 기치사부로) — 주미 대사"}, {"id": "450", "order": 450, "date": "1941-12-05", "group": "C", "eyebrow": "문서 450 · 交渉経緯を独・伊両国へ率直に通報方意見具申", "title": "교섭 경위를 독·이 양국에 솔직히 통보하도록 의견 구신(具申)", "list_right": "문서 450", "meta": [{"k": "일자", "v": "1941-12-05"}, {"k": "원문 표기", "v": "昭和16年12月5日"}, {"k": "전보번호", "v": "第一四二二号（極秘、館長符号）"}, {"k": "발신", "v": "在独国大島大使 (주독 오시마 대사, 大島浩)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신, 東郷茂徳)", "txt": true}, {"k": "발신·착신", "v": "ベルリン 12月5日後発 / 本省 12月6日前着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "交渉経緯を独・伊両国へ率直に通報方意見具申", "txt": true, "wide": true}], "summary": "베를린의 오시마 대사가, 일미 교섭 경위의 개요는 당시 곧바로 독일 측에 전해 두었으나 미국 측이 앞으로 일독 이간 등의 견지에서 상세한 발표를 하여 악선전에 이용할 공산이 적지 않으므로, 고노에 수상의 「メッセージ」와 같은 것은 물론 그 밖에도 되도록 솔직히 교섭 경위를 독·이에 통보해 두는 것이 득책이라고 진언하고, 사정에 따라서는 도쿄 주재 독·이 대사를 통해 해도 좋겠다고 한 전보.", "points": ["귀전 제986호에 관하여.", "일미 교섭의 경위 개요는 「当時直ニ独側ニ伝ヘ置キタル」(당시 곧바로 독일 측에 전해 두었다).", "그러나 미국 측은 앞으로 「日独離間等ノ見地ヨリ」(일독 이간 등의 견지에서) 상세한 발표를 하여 악선전에 이용할 공산이 적지 않다.", "예컨대 당시 세계에 전해진 고노에 수상의 「メッセージ」와 같은 것은 물론, 그 밖에도 될 수 있는 한 솔직히 교섭의 경위를 독·이에 통보해 두는 것이 득책(得策)이라고 인정한다.", "사정에 따라서는 재경(在京, 도쿄 주재) 독·이 대사를 통하여 행하시기 바란다."], "primary": "[235면]\n제1422호（극비, 관장부호）\n　　베를린　12월 5일 후발\n　　본　성　　12월 6일 전착\n\n귀전 제986호에 관하여.\n\n일미 교섭의 경위 개요는 당시 곧바로 독일 측에 전해 두었는바, 미국 측은 앞으로 일독 이간 등의 견지에서 상세한 발표를 하여 악선전에 이용할 공산이 적지 않으므로, 예컨대 당시 세계에 전해진 고노에(近衛) 수상의 「メッセージ」(메시지)와 같은 것은 물론 그 밖에도 될 수 있는 한 솔직히 교섭의 경위를 독·이(独伊)에 통보해 두는 것이 득책(得策)이라고 인정한다. 사정에 따라서는 재경(在京) 독·이 대사를 통하여 행하여 주시기 바란다.", "secondary": "[235面]\n第一四二二号（極秘、館長符号）\n　　ベルリン　12月5日後発\n　　本　省　　12月6日前着\n貴電第九八六号ニ関シ\n日米交渉ノ経緯概要ハ当時直ニ独側ニ伝ヘ置キタル処米側ハ今後日独離間等ノ見地ヨリ詳細ナル発表ヲ為シ悪宣伝ニ利用スル公算少カラサルニ依リ例ヘハ当時世界ニ伝ヘラレタル近衛首相「メッセージ」ノ如キモノハ勿論其ノ他出来ル限リ率直ニ交渉ノ経緯ヲ独伊ニ通報シ置クコト得策ナリト認ム都合ニ依リテハ在京独伊大使ヲ通シ行ハレタシ", "notes": ["발신자 「在独国大島大使」는 주독일 대사 오시마 히로시(大島浩)이다.", "「近衛首相「メッセージ」」는 1941년 8월 고노에 후미마로(近衛文麿) 수상이 루스벨트 대통령에게 보낸 정상회담 제안 메시지를 가리킨다.", "「独伊」는 독일과 이탈리아, 곧 삼국동맹의 두 동맹국이다.", "「在京独伊大使」는 도쿄에 주재하는 독일·이탈리아 대사이다.", "「得策」은 상책·유리한 방책의 뜻이다."], "warn": false, "pages": ["nichibei2_05_052"], "search": "大島浩 (오시마 히로시) — 주독일 대사 東郷茂徳 (도고 시게노리) — 외무대신 近衛文麿 (고노에 후미마로) — 전 수상. 본문에는 「近衛首相」으로 나온다"}, {"id": "451", "order": 451, "date": "1941-12-05", "group": "A", "eyebrow": "문서 451 · 仏印兵力増強等に関する米国国務長官との会談要旨報告", "title": "불인(佛印) 병력 증강 등에 관한 미국 국무장관과의 회담 요지 보고", "list_right": "문서 451", "meta": [{"k": "일자", "v": "1941-12-05"}, {"k": "원문 표기", "v": "昭和16年12月5日"}, {"k": "전보번호", "v": "第一二六一号（極秘、館長符号）"}, {"k": "발신", "v": "在米国野村大使 (주미 노무라 대사, 野村吉三郎)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신, 東郷茂徳)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 12月5日後発 / 本省 12月6日前着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "仏印兵力増強等に関する米国国務長官との会談要旨報告", "txt": true, "wide": true}], "summary": "12월 5일 노무라 대사와 구루스 대사가 함께 헐 국무장관을 방문하여, 불인 병력 증강에 관한 훈령의 취지를 서면으로 수교하고 나눈 회담의 요지 보고. 헐은 그 설명이 마치 지나 측이 국경에 병력을 집결해 공세로 나올 우려가 있다는 뜻으로도 해석된다고 하였고, 양 대사는 11월 20일 안(案)에 의한 급속한 국면 타개가 최선이라고 역설하였다.", "points": ["5일 본사(노무라)가 구루스(来栖) 대사와 함께 「ハル」(헐) 장관을 왕방(往訪)하여, 훈령의 취지를 만약을 위해(為念) 서면(書物)으로 하여 수교하였다.", "「ハル」는 그 설명이 「宛モ支那側カ国境ニ兵力ヲ結集シ攻勢ニ出テ来ル惧アル」(마치 지나 측이 국경에 병력을 결집하여 공세로 나올 우려가 있다)는 뜻으로도 해석된다고 말하였다.", "이에 양 대사는 어느 쪽이 공세로 나올지는 제반 정세·병력의 균형 등에도 달렸고, 현지 정세를 알지 못하는 자기들로서는 훈령 이외에 아무런 설명도 더할 수 없으며, 지나 측이 광서(広西) 방면에 다수의 병력을 모으고 있음은 자기들도 전부터 듣고 있는 바라고 응수하였다.", "「ハル」는 「兎ニ角御説明ハ大統領ニ伝達スヘシ」(어쨌든 설명은 대통령에게 전달하겠다)고 말하였다.", "양 대사는, 이러한 오해와 사건의 빈발을 우려하기 때문에 우리 쪽은 11월 20일 안(案)에 의한 급속한 국면 타개가 최선이라고 믿는다고 말하였다.", "불인 진주가 거듭 거론되나 이는 요컨대 「パワー・ポリチク」(파워 폴리틱스)의 문제이며, 귀국에서도 최량의 방어는 공격에 있다고 하고 특히 군인은 그러하니, ABCD의 병비(兵備)·함대 증가에 대하여 우리 육해군도 무관심할 수 없을 것이라고 하였다.", "「ハ」(헐)는 올봄 교섭 개시부터 7월 24일 일본군의 남부 불인 진주에 이르기까지 미국이 석유의 대일 수출을 허용해 온 사실로 자기가 상원 등에서 혹독한 공격을 받아 왔으므로, 오늘의 정세에서 대일 석유 공급을 재개하는 것은 도저히 여론(輿論)의 승복을 얻을 수 없다고 하였다.", "양 대사는 그 우려는 일미 관계가 개선되어 장관이 누차 주장해 온 일반적 화협(和協)이 성립하면 당연히 해소될 것이며, 거기에 이르는 도정으로 이때 먼저 우리 쪽 11월 20일 안에 의한 국면 타개를 기하는 것이 가장 실제적이라고 역설해 두었다.", "장관이 일본 신문 논조 등이 일미 타협을 곤란하게 하고 있다고 지적하자, 양 대사는 미국 측 일부 신문의 태도도 마찬가지임을 지적하고 3일 헐의 신문 회견에도 언급하였다. 헐은 그것은 미국의 근본적 정책에 관하여 말한 데 그친다면서, 어쨌든 본건 교섭에 관하여 최근 연일 신문기자에게 몰려 곤혹스럽다(閉口シオル)고 말하였다.", "작별에 즈음하여 「ハ」는 「今後何時ニテモ会見スヘシ」(앞으로 언제라도 회견하겠다)고 말하였다."], "primary": "[235면]\n제1261호（극비, 관장부호）\n　　워싱턴　12월 5일 후발\n　　본　성　　12월 6일 전착\n\n귀전 제891호에 관하여.\n\n5일 본사(本使)는 구루스(来栖) 대사와 함께 「ハル」(헐) 장관을 왕방하여 훈령의 취지를 만약을 위해(為念) 서면으로 하여 수교한바, 「ハル」는 그 설명은 마치 지나(支那) 측이 국경에 병력을 결집하여 공세로 나올 우려가 있다는 뜻으로도 해석된다고 [236면]말하였다. 이에 본사 등으로부터, 어느 쪽이 공세로 나올 것인지는 제반 정세와 병력의 균형(釣合) 등에도 달릴 것이며, 현지의 정세를 명확히 알지 못하는 본사 등으로서는 이 훈령 이외에 아무런 설명도 더할 수 없는 터이나, 지나 측으로서 공격으로 나오는 경우도 있을 수 있고, 지나 측이 광서(広西) 방면에 다수의 병력을 모으고 있음은 본사 등도 전부터 듣고 있는 바라고 응수하였던바, 「ハル」는 어쨌든 설명은 대통령에게 전달하겠다고 말하였다.\n\n다음으로 본사 등으로부터, 애당초 이번 대통령의 질의와 같은 사태에서 오는 오해 및 그 밖의 빈발을 우려하기 때문에야말로 우리 쪽으로서는 11월 20일 안(案)에 의하여 급속히 국면 타개를 도모하는 것이 최선이라고 믿는 터이며, 불인 진주의 일을 거듭 말씀하시나 이는 요컨대 「パワー・ポリチク」(파워 폴리틱스)의 문제로서, 귀국에서도 최량의 방어는 공격에 있다고 하고 특히 군인은 그러하니, ABCD의 병비(兵備)·함대의 증가에 대하여 우리 육해군도 무관심할 수 없을 것이라고 말하고, 귀전 제878호 말단의 취지를 다시 되풀이하였던바, 「ハ」(헐)는, 올봄 본 교섭 개시로부터 7월 24일 일본군의 남부 불인 진주에 이르기까지 미국이 석유의 대일 수출을 허용하고 있던 사실에 관하여 자신은 전부터 상원 기타에서 혹독한 공격을 받아 온 것과 같은 사정이므로, 오늘의 정세에 있어서 대일 석유 공급을 재개하는 것과 같은 일은 도저히 여론(輿論)의 승복을 얻을 수 없을 것이라고 말하였다. 이에 본사 등은, 위 우려하시는 점은 일미 간의 관계가 개선되고 귀 장관이 누차 주장하시는 일반적 화협(和協)이 성립하는 데 있어서는 당연히 해소될 것으로 믿어지는바, 거기에 도달하는 도정(道程)으로서 이때 먼저 우리 쪽 11월 20일 안에 의하여 국면의 타개를 기하는 것이 가장 실제적이라고 생각한다는 뜻을 역설해 두었다.\n\n또한 장관으로부터 우리나라 신문 논조 그 밖의 것이 일미 타협을 곤란하게 하고 있는 점을 지적하였으므로, 본사 등은 미국 측 일부 신문의 태도 또한 마찬가지임을 지적하고, 귀전 제878호의 「一」에서 설시하신 여러 점을 적의(適宜) 인용하고, 다시 3일 「ハ」의 신문 회견에도 언급해 두었던바, 「ハ」는 그것은 단지 미국의 근본적 정책에 관하여 말한 데 그치는 터이나, 어쨌든 본건 교섭에 관하여 최근 연일 신문기자에게 몰아세워져 곤혹스러워하고 있는(閉口シオル) 터라고 말하였다. 그리하여 본사 등은, 그와 같이 외부로부터 갖가지 방해가 들어올 우려가 있음에도 비추어, 당방(當方) 11월 20일 안에 의한 급속한 국면 타개가 더욱더 필요하게 되는 터라고 설득해 두었다.\n\n사거(辞去)에 즈음하여 「ハ」는 앞으로 언제라도 회견하겠다고 말하고 있었다.", "secondary": "[235面]\n第一二六一号（極秘、館長符号）\n　　ワシントン　12月5日後発\n　　本　省　　12月6日前着\n貴電第八九一号ニ関シ\n五日本使来栖大使ト共ニ「ハル」長官ヲ往訪御訓令ノ趣旨ヲ為念書物トシ手交シタル処「ハル」ハ御説明ハ宛モ支那側カ国境ニ兵力ヲ結集シ攻勢ニ出テ来ル惧アルトモ解セラ[236面]ルト述ヘタルニ付本使等ヨリ何レカ攻勢ニ出ツルヤハ諸般ノ情勢兵力ノ釣合等ニモ依ルヘク現地ノ情勢ヲ明カニセサル本使等トシテハ本訓令以外何等説明ヲ加フルヲ得サル次第ナルカ支那側トシテハ攻撃ニ出テ来ル場合モアルヘク支那側カ広西方面ニ多数ノ兵力ヲ集メ居ルコトハ本使等モ予テ聞キ及ヒ居ル所ナリト応酬セル処「ハル」ハ兎ニ角御説明ハ大統領ニ伝達スヘシト述ヘタリ\n次テ本使等ヨリ抑々今回大統領質疑ノ如キ事態ヨリ来ル誤解及其他ノ頻発ヲ慮レハコソ我方トシテハ十一月二十日案ニ依リ急速ニ局面打開ヲ計ルヲ最善ト信シ居ル次第ナリ仏印進駐ノコトヲ繰返サルルカ是レ要スルニ「パワー・ポリチク」ノ問題ニシテ貴国ノ如キモ最良ノ防禦ハ攻撃ニ在リトセラレ殊ニ軍人ハ然ルヲ以テABCDノ兵備、艦隊ノ増加ニ対シ我陸海軍モ無関心ナルヲ得サルヘシト述ヘ貴電第八七八号末段ノ趣旨ヲ再ヒ繰返セル処「ハ」ハ本春本交渉開始ヨリ七月二十四日ノ日本軍ノ南部仏印進駐ニ至ル迄米国カ石油ノ対日輸出ヲ許シ居タル事実ニ付自分ハ予テ上院其他ニ於テ手酷シキ攻撃ヲ受ケ居リタル様ノ事情ナルニ付今日ノ情勢ニ於テ対日石油供給ヲ再開スルカ如キハ到底輿論ノ承服ヲ得ルヲ得サルヘシト述ヘタルニ付本使等ハ右御懸念ノ点ハ日米間ノ関係改善シ貴長官カ屢次御主張ノ一般的和協成立スルニ於テハ当然解消スヘキモノト信セラルル処之ニ到達スル道程トシテ此ノ際先ツ我方十一月二十日案ニ依リ局面ノ打開ヲ期スルコト最モ実際的ナリト思考スル旨力説シオキタリ\n更ニ長官ヨリ我国新聞論調其ノ他カ日米妥協ヲ困難ナラシメツツアル点ヲ指摘セルヲ以テ本使等ハ米国側一部新聞ノ態度亦同様ナルヲ指摘シ貴電第八七八号ノ一御説示ノ諸点ヲ適宜引用シ更ニ三日「ハ」ノ新聞会見ニモ言及シオキタル処「ハ」ハ右ハ単ニ米国ノ根本的政策ニ付述ヘタルニ止マル次第ナルカ兎ニ角本件交渉ニ付最近連日新聞記者ニ 발전 보류)가 있다.", "그 아래 편주가 붙어 있다. **「원문서에는 이 전보 열넷째 본(本)의 발전 종료 시각이 7일 오후 4시라고 기재되어 있다」**. 도쿄 시각이다.", "부기(付記)는 그 영문 각서를 일본 외무성이 옮긴 일본어 역문으로, 一、부터 七、까지다."], "primary": "[237면]\n\n**452**\n\n**「대미 각서」 발전(発電)에 관하여**\n\n쇼와 16년 12월 6일\n도고 외무대신(東郷茂徳)이 주미 노무라 대사(野村吉三郎)에게 (전보)\n\n별전(別電)　12월 6일자 도고 외무대신이 주미 노무라 대사에게 보낸 제902호\n부기(付記)　위 별전의 역문(訳文)\n\n제901호\n본성(本省)　12월 6일 발(発)\n\n一、정부에서는 11월 26일의 미국 측 제안에 관하여 신중히 묘의(廟議)를 다한 결과 **대미 각서(영문)를 결정하였음.**\n\n二、위 각서는 장문인 관계도 있어 전부 접수되는 것은 내일이 될지도 모르나, 목하의 정세는 극히 기미(機微)한 바가 있으므로 **위를 수령하였다는 사실은 당분간 엄비(厳秘)에 부쳐 두시기 바람.**\n\n三、위 각서를 미국 측에 **제시할 시기에 관하여는 추후 따로 전보할 것**이나, 그 전보가 도착하는 대로 훈령에 따라 언제라도 미국 측에 수교할 수 있도록 문서의 정리 그 밖에 미리 만단의 준비를 마쳐 두시기 바람.\n\n（별전）\n제902호（관장 부호）\n본성　12월 6일 후 8시 30분 발（편주）\n\n（1）\n\n**MEMORANDUM（각서）**\n\n— 이 별전의 본문은 일본 정부가 미국에 건넬 **영문 각서**이며, 이른바 「14부 각서」다.\n같은 글의 한국어 번역이 미국 쪽 문서철 「진주만으로 가는 열 주」의 **d420**\n(1941년 12월 7일 오후 2시 20분 주미 일본대사가 국무장관에게 건넨 각서)에 실려 있다.\n여기서는 일본 외무성이 타전한 영문을 원문 그대로 두고 겹쳐 옮기지 않는다.\n**두 문면을 나란히 놓고 대조할 수 있게 하려는 것이다** — 도쿄가 보낸 영문과\nFRUS가 인쇄한 영문 사이에 차이가 있다면 그것 자체가 사료다.\n\n[243면 – 245면]\n\n〔**아직 옮기지 못한 대목입니다.** 영문 각서 제III항부터 제VII항 앞부분까지 세 쪽입니다.\n원본 지면은 이 문서철에 그대로 실려 있으니 직접 보실 수 있습니다.\n같은 글의 한국어 번역은 미국 쪽 문서철 「진주만으로 가는 열 주」의 **d420**\n(1941년 12월 7일 오후 2시 20분에 건네진 각서)에 있습니다.〕\n\n[246면]\n\n（난외 기입）**이하 발전(発電) 보류**\n\n**편주(編注)** — 원문서에는 이 전보 **열넷째 본(本)의 발전 종료 시각이\n7일 오후 4시**라고 기재되어 있다.\n\n[246면]（부기）\n一、제국정부는 「아메리카」합중국 정부와의 사이에 우호적 양해를 이루고, 양국 공동의 노력에 의하여 태평양 지역에서의 평화를 확보하며, 그로써 세계 평화의 도래에 공헌하고자 하는 진지한 희망에 촉발되어, 본년 4월 이래 합중국 정부와의 사이에 양국 국교의 조정 증진 및 태평양 지역의 안정에 관하여 성의를 기울여 교섭을 계속하여 왔던바, 지난 8개월에 걸친 교섭을 통하여 합중국 정부가 고수하여 온 주장 및 그 사이 합중국 및 영국이 제국에 대하여 취한 조치에 관하여, 이에 솔직히 그 소신을 합중국 정부에 개진하는 영광을 가진다.\n二、동아(東亞)의 안정을 확보하고 세계의 평화에 기여하며 그로써 만방(萬邦)으로 하여금 각기 제자리를 얻게 하려는 것은 제국 부동(不動)의 국시(國是)이다. 앞서 중화민국은 제국의 진의를 이해하지 못하여 불행히도 지나사변(支那事變)의 발생을 보기에 이르렀으나, 제국은 평화 극복(克復)의 방도를 강구함과 아울러 전화(戰禍)의 확대를 방지하고자 시종 최선의 노력을 다하여 왔다. 작년 9월 제국이 독·이 양국과의 사이에 삼국조약을 체결한 것[247면]도 또한 위 목적을 달성하고자 함에 다름 아니다.\n그런데 합중국 및 영제국(英帝國)은 온갖 수단을 다하여 충칭 정권을 원조함으로써 일·지 전면 화평의 성립을 방해하고 동아의 안정에 대한 제국의 건설적 노력을 억제하였을 뿐만 아니라, 혹은 난령인도(蘭領印度)를 견제하고 혹은 불령인도지나(佛領印度支那)를 위협하여, 제국이 이들 여러 지역과 서로 손잡고 공영(共榮)의 이상을 실현하고자 하는 기도를 저해하였다. 특히 제국이 프랑스와의 사이에 체결한 의정서에 의거하여 불령인도지나 공동방위의 조치를 강구하자, 합중국 정부 및 영국 정부는 이를 자국 영역에 대한 위협이라고 곡해하여 화란국(和蘭國)까지 끌어들여 자산동결령을 실시함으로써 제국과의 경제 단교를 감행하고, 명백히 적대적 태도를 보임과 아울러 제국에 대한 군비를 증강하고 제국 포위의 태세를 갖추어, 그로써 제국의 존립을 위태롭게 하는 것과 같은 정세를 유치(誘致)하기에 이르렀다.\n이에 불구하고 제국 총리대신은 본년 8월 사태의 급속한 수습을 위하여 합중국 대통령과 회견하여 양국 간에 존재하는 태평양 전반에 걸친 중요 문제를 토의·검토할 것을 제의하였다. 그런데 합중국 정부는 위 신청에 주의(主義)상 찬동을 표하면서도, 그 실행은 양국 간 중요 문제에 관하여 의견 일치를 본 뒤로 하여야 한다고 주장하여 양보하지 않았다.\n三、이에 제국정부는 9월 25일 종래의 합중국 정부의 주장도 충분히 고려한 위에, 미국안을 기초로 하고 여기에 제국정부의 주장을 넣은 하나의 안을 제시하여 논의를 거듭하였으나 쌍방의 견해는 쉽사리 일치하지 아니하였으므로, 현 내각에 있어서는 종래 교섭의 주요 난점이었던 여러 문제에 관하여 제국정부의 주장을 더욱 완화한 수정안을 제시하여 교섭의 타결에 노력하였으나, 합중국 정부는 시종 당초의 주장을 고집하고 협조적 태도로 나오지 아니하여 교섭은 여전히 지체되었다. 이에 11월 20일에 이르러 제국정부는 양국 국교의 파탄을 회피하기 위하여 최선의 노력을 다한다는 취지로써 추요(樞要)하고도 긴급한 문제에 관하여 공정한 타결을 도모하기 위하여 앞의 제안을 간단화하여,\n（一）양국 정부는 불인(佛印) 이외의 남동아세아 및 남태평양 지역에 무력 진출을 행하지 아니할 것을 확약할 것\n（二）양국 정부는 난령인도에서 각자 필요로 하는 물자의 획득이 보장되도록 상호 협력할 것\n（三）양국 정부는 상호 통상 관계를 자산동결 이전의 상태로 복귀시킬 것, 합중국 정부는 소요의 석유를 대일 공급할 것을 약속할 것\n（四）합중국 정부는 일·지 양국의 화평에 관한 노력에 지장을 주는 것과 같은 행동에 나오지 아니할 것\n（五）제국정부는 일·지 간 화평이 성립하거나 또는 태평양 지역에서의 공정한 평화가 확립되는 때에는 현재 불[248면]령인도지나에 파견되어 있는 일본 군대를 철퇴시킬 것이며, 또 본 양해가 성립하면 현재 남부 불령인도지나에 주둔 중인 일본군은 이를 북부 불령인도지나로 이주(移駐)시킬 용의가 있을 것 등을 내용으로 하는 신제안을 제시하고, 동시에 지나 문제에 관하여는 합중국 대통령이 앞서 언명한 대로 일·지 화평의 소개자가 되는 데에 이의는 없으나, 일·지 직접 교섭 개시 후에는 합중국이 일·지 화평을 방해하지 아니할 것을 약속할 것을 요구하였던바, 합중국 정부는 위 신제안을 수락할 수 없다고 하였을 뿐만 아니라 원장(援蔣) 행위를 계속할 의사를 표명하고, 이어 다시 앞의 언명에도 불구하고 대통령의 이른바 일·지 간 화평의 소개를 행할 시기가 아직 무르익지 아니하였다 하여 이를 철회하였으며, 마침내 11월 26일에 이르러 오로지 합중국 정부가 종래 고집하여 온 원칙을 강요하는 태도로써 제국정부의 주장을 무시한 제안을 하기에 이르렀으니, 이는 제국정부가 가장 유감으로 하는 바이다.\n四、무릇 본건 교섭 개시 이래 제국정부는 시종 오로지 공정하고도 겸억(謙抑)한 태도로써 예의(銳意) 타결에 힘쓰고 누차 어려움을 참으며 할 수 있는 한의 양보를 감행하였거니와, 교섭상 중요 사항이었던 지나 문제에 관하여서도 협조적 태도를 보였고, 합중국 정부가 제창한 국제 통상상의 무차별 대우 원칙 준수에 관하여서는 본 원칙이 세계 각국에 행하여지기를 희망하며 또한 그 실현에 순응하여 이를 지나를 포함하는 태평양 지역에 적용하도록 노력하겠다는 뜻을 표명하였고, 또한 지나에서의 제3국의 공정한 경제 활동은 결코 이를 배제하는 것이 아님도 천명(闡明)하였으며, 나아가 불령인도지나로부터의 철병에 관하여서도 정세 완화에 이바지하기 위하여 앞서 말한 바와 같이 남부 불령인도지나로부터의 즉시 철병을 나아가 제의하는 등 극력 타협의 정신을 발휘하였음은 합중국 정부가 일찍이 양해하는 바라고 믿는다. 그런데 합중국 정부는 항상 이론에 구애되어 현실을 무시하고 그가 품고 있는 비실제적 원칙을 고집하여 아무런 양보도 하지 아니한 채 헛되이 교섭을 지연시켰음은 제국정부가 양해하기 어려운 바이거니와, 특히 아래의 여러 점에 관하여서는 합중국 정부의 주의를 환기하지 아니할 수 없다.\n（一）합중국 정부는 세계 평화를 위한 것이라 칭하며 자기에게 유리한 여러 원칙을 주장하고 그 채택을 제국정부에 강요하였으나, 세계의 평화는 현실에 입각하고 또한 상대국의 입장에 이해를 가지며 상호 수락할 수 있는 방도를 발견함에 의하여서만 구현될 수 있는 것으로서, 현실을 무시하고 일국의 독선적 주장을 상대국에 강요하는 것과 같은 태도는 교섭의 성립을 촉진하는 소이(所以)가 아니다.[249면]이번에 합중국 정부가 일·미 협정의 기초로서 제의한 여러 원칙에 관하여서는, 그 가운데에는 제국정부로서 취지에 있어 찬동을 아끼지 아니할 것도 있으나, 합중국 정부가 곧바로 그 채택을 요망함은 세계의 현상(現狀)에 비추어 볼 때 가공(架空)의 이념에 사로잡힌 것이라 할 수밖에 없다.\n또한 일·미·영·지(支)·소(蘇)·난(蘭)·태(泰) 7개국 간에 다변적 불가침 조약을 체결하자는 안과 같은 것도 헛되이 집단적 평화 기구라는 낡은 구상을 좇은 결과 동아의 실정과 유리된 것이라 할 수밖에 없다.\n（二）합중국 정부의 이번 제안 가운데 「양국 정부가 제3국과 체결하고 있는 어떠한 협정도 본 취극(取極)의 근본 목적인 태평양 전역의 평화 확보에 모순되는 것처럼 해석되지 아니할 것에 관하여 합의한다」고 되어 있음은, 곧 합중국이 유럽 전쟁에 참전하는 경우에 제국의 삼국조약상의 의무 이행을 견제하려는 의도로써 제안한 것으로 인정되므로, 이는 제국정부가 수락할 수 없는 바이다.\n본래 합중국 정부는 그 자기의 주장과 이념에 현혹되어 스스로 전쟁 확대를 기도하고 있다고 하지 아니할 수 없다. 합중국 정부는 한편으로 태평양 지역의 안정을 꾀하여 자국의 배후를 안고(安固)하게 하면서, 다른 한편으로 영제국을 도와 유럽 신질서 건설에 매진하는 독·이 양국에 대하여 자위권의 이름 아래 나아가 공격을 가하려는 것인바, 이는 태평양 지역에 평화적 수단에 의하여 안정의 기초를 쌓으려는 수많은 원칙적 주장과 전연 모순·배치되는 것이다.\n（三）합중국 정부는 그가 고수하는 주장에 있어 무력에 의한 국제 관계 처리를 배격하면서, 한편으로는 영제국 등과 함께 경제력에 의한 압박을 가하고 있는바, 이러한 압박은 경우에 따라서는 무력 압박 이상의 비인도적 행위로서 국제 관계 처리의 수단으로서 배격되어야 할 것이다.\n（四）합중국 정부의 의도는 영제국 그 밖의 여러 나라를 유인하여 지나 그 밖의 동아 여러 지역에 대하여 그 종래 보유하여 온 지배적 지위를 유지·강화하려는 것으로 볼 수밖에 없는바, 동아 여러 나라가 과거 백여 년에 걸쳐 영·미의 제국주의적 착취 정책 아래 현상 유지를 강요당하고 양국 번영의 희생이 됨을 감수하지 아니할 수 없었던 역사적 사실에 비추어, 이는 만방으로 하여금 각기 제자리를 얻게 하려는 제국의 근본 국책과 전연 배치되는 것으로서 제국정부가 단연코 용인할 수 없는 바이다.\n합중국 정부의 이번 제안 가운데 불령인도지나에 관한 규정은 바로[250면] 위 태도의 적례(適例)라 할 것으로서, 불령인도지나에 관하여 프랑스를 제외하고 일·미·영·난·지·태 6개국 간에 동 지역의 영토 주권의 존중 및 무역·통상의 균등 대우를 약속하려는 것은, 동 지역을 6개국 정부의 공동 보장 아래에 두려는 것으로서, 프랑스의 입장을 전연 무시한 점은 잠시 제쳐 두더라도, 동아의 사태를 분규로 이끈 최대 원인의 하나인 9개국 조약과 유사한 체제를 새로이 불령인도지나에 확장하려는 것으로 보아야 할 것이니, 제국정부로서 용인할 수 없는 바이다.\n（五）합중국 정부가 지나 문제에 관하여 제국에 요망한 바는, 혹은 전면 철병의 요구라 하고 혹은 통상 무차별 원칙의 무조건 적용이라 하여, 어느 것이나 지나의 현실을 무시하고 동아의 안정 세력인 제국의 지위를 뒤엎으려는 것인바, 합중국 정부가 이번 제안에서 충칭 정권을 제외한 어떠한 정권도 군사적·정치적 및 경제적으로 지지하지 아니할 것을 요구하여 난징 정부를 부인하여 없애려는 태도로 나온 것은 교섭의 기초를 근저로부터 뒤엎는 것이라 할 것이니, 이는 앞의 원장 행위 정지의 거부와 아울러 합중국 정부가 일·지 간에 평상 상태의 복귀 및 동아 평화의 회복을 저해할 의사가 있음을 실증하는 것이다.\n五、요컨대 이번 합중국 정부의 제안 가운데에는 통상 조약 체결, 자산동결령의 상호 해제, 엔·달러 환(円弗爲替) 안정 등의 통상 문제 내지 지나에서의 치외법권 철폐 등 본질적으로 불가하지 아니한 조항이 없지는 아니하나, 다른 한편으로 4년 남짓에 걸친 지나사변의 희생을 무시하고 제국의 생존을 위협하며 권위를 모독(冒瀆)하는 것이 있다. 따라서 전체적으로 보아 제국정부로서는 교섭의 기초로서 도저히 이를 수락할 수 없음을 유감으로 한다.\n六、또한 제국정부는 교섭의 급속한 성립을 희망하는 견지에서 일·미 교섭 타결 시에는 영제국 그 밖의 관계국과의 사이에도 동시 조인할 것을 제의하였고 합중국 정부도 대체로 이에 동의를 표시한 바 있었던바, 합중국 정부는 영·호(豪)·난·충칭 등과 누차 협의한 결과 특히 지나 문제에 관하여서는 충칭 측의 의견에 영합하여 앞의 여러 제안을 한 것으로 인정되며, 위 여러 나라는 어느 것이나 합중국과 마찬가지로 제국의 입장을 무시하려는 것이라 단정하지 아니할 수 없다.\n七、생각건대 합중국 정부의 의도는 영제국 그 밖의 나라들과 구합(苟合)하여 책동함으로써 동아에서의 제국의 신질서 건설에 의한 평화 확립의 노력을 방해하려는 데 그치지 아니하고, 일·지 양국으로 하여금 서로 싸우게 하여 그로써 영·미의 이익을 옹호하려는 것임은 이번 교섭을 [251면]통하여 명료하게 된 바이다. 이리하여 일·미 국교를 조정하고 합중국 정부와 서로 손잡고 태평양의 평화를 유지·확립하려던 제국정부의 희망은 마침내 상실되었다.\n이에 제국정부는 여기에 합중국 정부의 태도에 비추어 앞으로 교섭을 계속하더라도 타결에 이를 수 없다고 인정하는 수밖에 없다는 뜻을 합중국 정부에 통고함을 유감으로 하는 바이다.", "secondary": "[237面]\n452\n「対米覚書」発電について\n昭和16年12月6日\n東郷外務大臣より在米国野村大使宛（電報）\n別電　一二月六日付東郷外務大臣より在米国野村大使宛第九〇二号\n付記　右別電訳文\n第九〇一号\n本省　12月6日　発\n一、政府ニ於テハ十一月二十六日ノ米側提案ニ付慎重廟議ヲ尽シタル結果対米覚書（英文）ヲ決定セリ\n二、右覚書ハ長文ナル関係モアリ全部接受セラルルハ明日トナルヤモ知レサルモ刻下ノ情勢ハ極メテ機微ナルモノアルニ付右御受領相成リタルコトハ差当リ厳秘ニ付セラルル様致サレ度シ\n三、右覚書ヲ米側ニ提示スル時期ニ付テハ追テ別ニ電報スヘキモ右電接到ノ上ハ訓令次第何時ニテモ米側ニ手交シ得ル様文書ノ整理其他予メ万端ノ手配ヲ了シ置カレ度シ\n\n（別電）\n第九〇二号（館長符号）\n本省　12月6日後8時30分発（編注）\n\n（1）MEMORANDUM\n\nI. The Government of Japan, prompted by a genuine desire to come to an amicable understanding with the Government of the United States in order that the two countries by their joint efforts may secure the peace of the Pacific area and thereby contribute toward the realization of world peace, has continued negotiations with the utmost sincerity since April last with the Government of the United States regarding the adjustment and advancement of Japanese-American relations and the stabilization of the Pacific area.\n\nThe Japanese Government has the honor to state frankly its views concerning the claims the American Government has persistently maintained as well as the measures the United States and Great Britain have [238面] taken toward Japan during these eight months.\n\nII. It is the immutable policy of the Japanese Government to insure the stability of East Asia and to promote world peace, and thereby to enable all nations to find each its proper place in the world.\n\nEver since the China Affair broke out owing to the failure on the part of China to comprehend Japan's true intentions, the Japanese Government has striven for the restoration of peace and it has consistently exerted its best efforts to prevent the extention of war-like disturbances. It was also to that end that in September last year Japan concluded the Tripartite Pact with Germany and Italy.\n\n（2）However, both the United States and Great Britain have resorted to every possible measure to assist the Chungking régime so as to obstruct the establishment of a general peace between Japan and China, interfering with Japan's constructive endeavours toward the stabilization of East Asia. Exerting pressure on the Netherlands East Indies, or menacing French Indo-China, they have attempted to frustrate Japan's aspiration to realize the ideal of common prosperity in cooperation with these regions. Furthermore, when Japan in accordance with its protocol with France took measures of joint defence of French Indo-China, both American and British Governments, wilfully misinterpreted it as a threat to their own possessions and inducing the Netherlands Government to follow suit, they enforced the assets freezing order, thus severing economic relations with Japan. While manifesting thus an obviously hostile attitude, these countries have strengthened their military preparations perfecting an encirclement of Japan, and have brought about a situation which endangers the very existence of the Empire.\n\n（3）Nevertheless, to facilitate a speedy settlement, the Premier of Japan proposed, in August last, to meet the President of the United States for a discussion of [239面] important problems between the two countries covering the entire Pacific area. However, the American Government, while accepting in principle the Japanese proposal, insisted that the meeting should take place after an agreement of view had been reached on fundamental and essential questions.\n\nIII. Subsequently, on September 25th the Japanese Government submitted a proposal based on the formula proposed by the American Government, taking fully into consideration past American claims and also incorporating Japanese views. Repeated discussions proved of no avail in producing readily an agreement of view. The prersent Cabinet, therefore, submitted a revised proposal, moderating still further the Japanese claims regarding the principal points of difficulty in the negotiation and endeavoured strenuously to reach a settlement. But the American Government, adhering steadfastly to its original proposal, failed to display in the slightest degree a spirit of conciliation. The negotiation made no progress.\n\n（4）Thereupon, the Japanese Government, with a view to doing its utmost for averting a crisis in Japanese-American relations, submitted on November 20th still another proposal in order to arrive at an equitable solution of the more essential and urgent questions which, simplifying its previous proposal, stipulated the following points :\n\n(1)　The Governments of Japan and the United States undertake not to dispatch armed forces into any of the regions, excepting French Indo-China, in the Southeastern Asia and the Southern Pacific area.\n(2)　Both Governments shall cooperate with a view to securing the acquisition in the Netherlands East Indies of those goods and commodities of which the two countries are in need.\n(3)　Both Governments mutually undertake to [240面] restore commercial relations to those prevailing prior to the freezing of assets. The Government of the United States shall supply Japan the required quantity of oil.\n(4)　The Government of the United States undertakes not to resort to measures and actions prejudicial to the restoration of general peace between Japan and China.\n(5)　The Japanese Government undertakes to withdraw troops now stationed in French Indo-China upon either the restoration of peace between Japan and China or the establishment of an equitable peace in the Pacific area; and it is prepared to remove the Japanese troops in the southern part of French Indo-China to the northern part upon the conclusion of the present agreement.\n\n（5）As regards China, the Japanese Government, while expressing its readiness to accept the offer of the President of the United States to act as “introducer” of peace between Japan and China as was previously suggested, asked for an undertaking on the part of the United States to do nothing prejudicial to the restoration of Sino-Japanese peace when the two parties have commenced direct negotiations.\n\nThe American Government not only rejected the above-mentioned new proposal, but made known its intention to continue its aid to Chiang Kai-shek; and in spite of its suggestion mentioned above, withdrew the offer of the President to act as the so-called “introducer” of peace between Japan and China, pleading that time was not yet ripe for it. Finally on November 26th, in an attitude to impose upon the Japanese Government those principles it has persistently maintained, the American Government made a proposal totally ignoring Japanese claims, which is a source of profound regret to the Japanese Government.\n\n[243면 – 245면]\n\n〔이 아카이브에서 아직 옮기지 못한 대목 — 영문 각서 제III항 ~ 제VII항 앞부분.\n원본 지면은 pages/nichibei2_05_060.png ~ 062.png 에 그대로 있다.\n같은 글의 영문과 한국어 번역이 「진주만으로 가는 열 주」의 d420 에 실려 있다.〕\n\n[246면]\n\n（欄外記入）以下発電留保\n\n編注　原文書には本電一四本目の発電終了時刻は七日午後四時である旨記載されている。\n\n[246면]（付記）\n一、帝国政府ハ「アメリカ」合衆国政府トノ間ニ友好的諒解ヲ遂ケ両国共同ノ努力ニ依リ太平洋地域ニ於ケル平和ヲ確保シ以テ世界平和ノ招来ニ貢献セントスル真摯ナル希望ニ促サレ本年四月以来合衆国政府トノ間ニ両国国交ノ調整増進並ニ太平洋地域ノ安定ニ関シ誠意ヲ傾倒シテ交渉ヲ継続シ来リタル処過去八月ニ亙ル交渉ヲ通シ合衆国政府ノ固持セル主張並ニ此間合衆国及英国ノ帝国ニ対シ執レル措置ニ付茲ニ率直ニ其所信ヲ合衆国政府ニ開陳スルノ光栄ヲ有ス\n二、東亜ノ安定ヲ確保シ世界ノ平和ニ寄与シ以テ万邦ヲシテ各其ノ所ヲ得シメントスルハ帝国不動ノ国是ナリ曩ニ中華民国ハ帝国ノ真意ヲ解セス不幸ニシテ支那事変ノ発生ヲ見ルニ至レルモ帝国ハ平和克復ノ方途ヲ講スルト共ニ戦禍ノ拡大ヲ防止センカ為終始最善ノ努力ヲ致シ来レリ客年九月帝国カ独伊両国トノ間ニ三国条約ヲ締結シタ[247면]ルモ亦右目的ヲ達成センカ為ニ外ナラス\n然ルニ合衆国及英帝国ハ有ラユル手段ヲ竭シ重慶政権ヲ援助シテ日支全面和平ノ成立ヲ妨碍シ東亜ノ安定ニ対スル帝国ノ建設的努力ヲ控制セルノミナラス或ハ蘭領印度ヲ牽制シ或ハ仏領印度支那ヲ脅威シ帝国ト此等諸地域ト相携ヘテ共栄ノ理想ヲ実現セントスル企図ヲ阻害セリ殊ニ帝国カ仏国トノ間ニ締結シタル議定書ニ基キ仏領印度支那共同防衛ノ措置ヲ講スルヤ合衆国政府及英国政府ハ之ヲ以テ自国領域ニ対スル脅威ナリト曲解シ和蘭国ヲモ誘ヒ資産凍結令ヲ実施シテ帝国トノ経済断交ヲ敢テシ明カニ敵対的態度ヲ示スト共ニ帝国ニ対スル軍備ヲ増強シ帝国包囲ノ態勢ヲ整ヘ以テ帝国ノ存立ヲ危殆ナラシムルカ如キ情勢ヲ誘致スルニ至レリ\n右ニ拘ラス帝国総理大臣ハ本年八月事態ノ急速収拾ノ為合衆国大統領ト会見シ両国間ニ存在スル太平洋全般ニ亙ル重要問題ヲ討議検討センコトヲ提議セリ然ルニ合衆国政府ハ右申入ニ主義上賛同ヲ与ヘ乍ラ之カ実行ハ両国間重要問題ニ関シ意見一致ヲ見タル後トスヘシト主張シテ譲ラス\n三、仍テ帝国政府ハ九月二十五日従来ノ合衆国政府ノ主張ヲモ充分考慮ノ上米国案ヲ基礎トシ之ニ帝国政府ノ主張ヲ取入レタル一案ヲ提示シ論議ヲ重ネタルカ双方ノ見解ハ容易ニ一致セサリシヲ以テ現内閣ニ於テハ従来交渉ノ主要難点タリシ諸問題ニ付帝国政府ノ主張ヲ更ニ緩和シタル修正案ヲ提示シ交渉ノ妥結ニ努メタルモ合衆国政府ハ終始当初ノ主張ヲ固執シ協調的態度ニ出テス交渉ハ依然渋滞セリ茲ニ於テ十一月二十日ニ至リ帝国政府ハ両国国交ノ破綻ヲ回避スル為メ最善ノ努力ヲ尽ス趣旨ヲ以テ枢要且緊急ノ問題ニ付公正ナル妥結ヲ図ル為メ前記提案ヲ簡単化シ\n（一）両国政府ニ於テ仏印以外ノ南東亜細亜及南太平洋地域ニ武力進出ヲ行ハサル旨ヲ確約スルコト\n（二）両国政府ニ於テ蘭領印度ニ於テ其ノ必要トスル物質ノ獲得カ保障セラルル様相互ニ協力スルコト\n（三）両国政府ハ相互ニ通商関係ヲ資産凍結前ノ状態ニ復帰スルコト、合衆国政府ハ所要ノ石油ノ対日供給ヲ約スルコト\n（四）合衆国政府ハ日支両国ノ和平ニ関スル努力ニ支障ヲ与フルカ如キ行動ニ出テサルコト\n（五）帝国政府ハ日支間和平成立スルカ又ハ太平洋地域ニ於ケル公正ナル平和確立スル上ハ現ニ仏[248면]領印度支那ニ派遣セラレ居ル日本軍隊ヲ撤退スヘク又本了解成立セハ現ニ南部仏領印度支那ニ駐屯中ノ日本軍ハ之ヲ北部仏領印度支那ニ移駐スルノ用意アルコト等ヲ内容トスル新提案ヲ提示シ同時ニ支那問題ニ付テハ合衆国大統領カ曩ニ言明シタル通日支和平ノ紹介者ト為ルニ異議ナキモ日支直接交渉開始ノ上ハ合衆国ニ於テ日支和平ヲ妨碍セサル旨ヲ約センコトヲ求メタルカ合衆国政府ハ右新提案ヲ受諾スルヲ得スト為セルノミナラス援蒋行為ヲ継続スル意思ヲ表明シ次テ更ニ前記ノ言明ニ拘ラス大統領ノ所謂日支間和平ノ紹介ヲ行フノ時機猶熟セストテ之ヲ撤回シ遂ニ十一月二十六日ニ至リ偏ニ合衆国政府カ従来固執セル原則ヲ強要スルノ態度ヲ以テ帝国政府ノ主張ヲ無視セル提案ヲ為スニ至リタルカ右ハ帝国政府ノ最モ遺憾トスル所ナリ\n四、抑本件交渉開始以来帝国政府ハ終始専ラ公正且謙抑ナル態度ヲ以テ鋭意妥結ニ努メ屢難キヲ忍ヒテ能フ限リノ譲歩ヲ敢テシタルカ交渉上重要事項タリシ支那問題ニ関シテモ協調的態度ヲ示シ合衆国政府ノ提唱セル国際通商上ノ無差別待遇原則遵守ニ付テハ本原則ノ世界各国ニ行ハレンコトヲ希望シ且其ノ実現ニ順応シテ之ヲ支那ヲモ含ム太平洋地域ニ適用スル様努力スヘキ旨ヲ表明シ尚支那ニ於ケル第三国ノ公正ナル経済活動ハ何等之ヲ排除スルモノニアラサルコトヲモ闡明セルカ更ニ仏領印度支那ヨリノ撤兵ニ付テモ情勢緩和ニ資スルカ為メ前述ノ如ク南部仏領印度支那ヨリノ即時撤兵ヲ進ンテ提議スル等極力妥協ノ精神ヲ発揮セルハ合衆国政府ノ夙ニ諒解スル所ナリト信ス然ルニ合衆国政府ハ常ニ理論ニ拘泥シ現実ヲ無視シ其ノ抱懐スル非実際的原則ヲ固執シテ何等譲歩セス徒ラニ交渉ヲ遷延セシメタルハ帝国政府ノ諒解ニ苦ム所ナルカ特ニ左記諸点ニ付テハ合衆国政府ノ注意ヲ喚起セサルヲ得ス\n（一）合衆国政府ハ世界平和ノ為ナリト称シテ自己ニ好都合ナル諸原則ヲ主張シ之カ採択ヲ帝国政府ニ迫レル処世界ノ平和ハ現実ニ立脚シ且相手国ノ立場ニ理解ヲ持シ相互ニ受諾シ得ヘキ方途ヲ発見スルコトニ依リテノミ具現シ得ルモノニシテ現実ヲ無視シ一国ノ独善的主張ヲ相手国ニ強要スルカ如キ態度ハ交渉ノ成立ヲ促進スル所以ノモノニアラス[249면]今般合衆国政府カ日米協定ノ基礎トシテ提議セル諸原則ニ付テハ右ノ中ニハ帝国政府トシテ趣旨ニ於テ賛同ニ吝カナラサルモノアルモ合衆国政府カ直ニ之カ採択ヲ要望スルハ世界ノ現状ニ鑑ミ架空ノ理念ニ駆ラルルモノト云フノ外ナシ\n尚日、米、英、支、蘇、蘭、泰七国間ニ多辺的不可侵条約ヲ締結スルノ案ノ如キモ徒ラニ集団的平和機構ノ旧構想ヲ追フノ結果東亜ノ実情ト遊離セルモノト云フノ外ナシ\n（二）合衆国政府今次ノ提案中ニ「両国政府カ第三国ト締結シ居ル如何ナル協定モ本取極ノ根本目的タル太平洋全域ノ平和確保ニ矛盾スルカ如ク解釈セラレサルコトニ付合意ス」トアルハ即チ合衆国カ欧州戦争参入ノ場合ニ於ケル帝国ノ三国条約上ノ義務履行ヲ牽制セントスル意図ヲ以テ提案セルモノト認メラルルヲ以テ右ハ帝国政府ノ受諾シ得サル所ナリ\n由来合衆国政府ハ其ノ自己ノ主張ト理念トニ眩惑セラレ自ラ戦争拡大ヲ企図シツツアリト謂ハサルヲ得ス合衆国政府ハ一方太平洋地域ノ安定ヲ策シ自国ノ背後ヲ安固ト為シツツ他方英帝国ヲ援ケ欧州新秩序建設ニ邁進スル独伊両国ニ対シ自衛権ノ名ノ下ニ進ンテ攻撃ヲ加ヘントスルモノナルカ右ハ太平洋地域ニ平和的手段ニ依リ安定ノ基礎ヲ築カントスル幾多ノ原則的主張ト全然矛盾背馳スルモノナリ\n（三）合衆国政府ハ其ノ固持スル主張ニ於テ武力ニ依ル国際関係処理ヲ排撃シツツ一方英帝国等ト共ニ経済力ニ依ル圧迫ヲ加ヘツツアル処斯ル圧迫ハ場合ニ依リテハ武力圧迫以上ノ非人道的行為ニシテ国際関係処理ノ手段トシテ排撃セラルヘキモノナリ\n（四）合衆国政府ノ意図ハ英帝国其他ノ諸国ヲ誘引シ支那其ノ他東亜ノ諸地域ニ対シ其ノ従来保持セル支配的地位ヲ維持強化セントスルモノト見ルノ外ナキ処東亜諸国カ過去百有余年ニ亙リ英米ノ帝国主義的搾取政策ノ下ニ現状維持ヲ強ヒラレ両国繁栄ノ犠牲タルニ甘ンセサルヲ得サリシ歴史的事実ニ鑑ミ右ハ万邦ヲシテ各其ノ所ヲ得シメントスル帝国ノ根本国策ト全然背馳スルモノニシテ帝国政府ノ断シテ容認スル能ハサル所ナリ\n合衆国政府今次提案中仏領印度支那ニ関スル規定ハ正[250면]ニ右態度ノ適例ト称スヘク仏領印度支那ニ関シ仏国ヲ除キ日、米、英、蘭、支、泰六国間ニ同地域ノ領土主権ノ尊重並ニ貿易及通商ノ均等待遇ヲ約束セントスルハ同地域ヲ六国政府ノ共同保障ノ下ニ立タシメントスルモノニシテ仏国ノ立場ヲ全然無視セル点ハ暫ク措クモ東亜ノ事態ヲ紛糾ニ導キタル最大原因ノ一タル九国条約類似ノ体制ヲ新ニ仏領印度支那ニ拡張セントスルモノト観ルヘキモノニシテ帝国政府トシテ容認シ得サル所ナリ\n（五）合衆国政府カ支那問題ニ関シ帝国ニ要望セル所ハ或ハ全面撤兵ノ要求ト云ヒ或ハ通商無差別原則ノ無条件適用ト云ヒ何レモ支那ノ現実ヲ無視シ東亜ノ安定勢力タル帝国ノ地位ヲ覆滅セントスルモノナル処合衆国政府カ今次提案ニ於テ重慶政権ヲ除ク如何ナル政権ヲモ軍事的、政治的且経済的ニ支持セサルコトヲ要求シ南京政府ヲ否認シ去ラントスルノ態度ニ出テタルハ交渉ノ基礎ヲ根底ヨリ覆スモノト云フヘク右ハ前記援蒋行為ノ停止ノ拒否ト共ニ合衆国政府カ日支間ニ平常状態ノ復帰及東亜平和ノ回復ヲ阻害スルノ意思アルコトヲ実証スルモノナリ\n五、要之今次合衆国政府ノ提案中ニハ通商条約締結、資産凍結令ノ相互解除、円弗為替安定等ノ通商問題乃至支那ニ於ケル治外法権撤廃等本質的ニ不可ナラサル条項ナキニアラサルモ他方四年有余ニ亙ル支那事変ノ犠牲ヲ無視シ帝国ノ生存ヲ脅威シ権威ヲ冒瀆スルモノアリ従テ全体的ニ観テ帝国政府トシテハ交渉ノ基礎トシテ到底之ヲ受諾スルヲ得サルヲ遺憾トス\n六、尚帝国政府ハ交渉ノ急速成立ヲ希望スル見地ヨリ日米交渉妥結ノ際ハ英帝国其他ノ関係国トノ間ニモ同時調印方ヲ提議シ合衆国政府モ大体之ニ同意ヲ表示セル次第アル処合衆国政府ハ英、豪、蘭、重慶等ト屢協議セル結果特ニ支那問題ニ関シテハ重慶側ノ意見ニ迎合シ前記諸提案ヲ為セルモノト認メラレ右諸国ハ何レモ合衆国ト同シク帝国ノ立場ヲ無視セントスルモノト断セサルヲ得ス\n七、惟フニ合衆国政府ノ意図ハ英帝国其ノ他ト苟合策動シテ東亜ニ於ケル帝国ノ新秩序建設ニ依ル平和確立ノ努力ヲ妨碍セントスルノミナラス日支両国ヲ相闘ハシメ以テ英米ノ利益ヲ擁護セントスルモノナルコトハ今次交渉ヲ[251면]通シ明瞭ト為リタル所ナリ斯クテ日米国交ヲ調整シ合衆国政府ト相携ヘテ太平洋ノ平和ヲ維持確立セントスル帝国政府ノ希望ハ遂ニ失ハレタリ\n仍テ帝国政府ハ茲ニ合衆国政府ノ態度ニ鑑ミ今後交渉ヲ継続スルモ妥結ニ達スルヲ得スト認ムルノ外ナキ旨ヲ合衆国政府ニ通告スルヲ遺憾トスルモノナリ", "notes": [], "warn": true, "pages": ["nichibei2_05_054", "nichibei2_05_055", "nichibei2_05_056", "nichibei2_05_057", "nichibei2_05_058", "nichibei2_05_059", "nichibei2_05_060", "nichibei2_05_061", "nichibei2_05_062", "nichibei2_05_063", "nichibei2_05_064", "nichibei2_05_065", "nichibei2_05_066", "nichibei2_05_067", "nichibei2_05_068"], "search": "도고 시게노리(東郷茂徳) 노무라 기치사부로(野村吉三郎)"}, {"id": "453", "order": 453, "date": "1941-12-06", "group": "B", "eyebrow": "문서 453 · 「対米覚書」の機密保持方訓令", "title": "「대미 각서」의 기밀 유지에 관한 훈령", "list_right": "문서 453", "meta": [{"k": "일자", "v": "1941-12-06"}, {"k": "원문 표기", "v": "昭和16年12月6日"}, {"k": "전보번호", "v": "第九〇四号"}, {"k": "발신", "v": "東郷外務大臣 (도고 외무대신, 東郷茂徳)", "txt": true}, {"k": "수신", "v": "在米国野村大使 (주미 노무라 대사, 野村吉三郎)", "txt": true}, {"k": "발신·착신", "v": "本省 12月6日発", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "「対米覚書」の機密保持方訓令", "txt": true, "wide": true}], "summary": "12월 6일자로 타전한 「대미 각서」(왕전 제902호)를 준비할 때 타이피스트 등을 절대 사용하지 말고 기밀 유지에 거듭 신중을 기하라는 도고 외무대신의 훈령 전보.", "points": ["왕전(往電) 제902호, 곧 「대미 각서」 본문 전보에 관한 부속 훈령이다.", "각서를 준비함에 있어 「タイピスト」(타이피스트) 등은 절대로 사용하지 말라고 지시했다.", "기밀 유지에는 「이 위에 또한(此上共)」 신중에 신중을 기하라고 했다.", "말하지 않아도 될 일이지만(申ス迄モナキコト乍ラ)이라는 표현으로 시작해, 본성이 이 각서의 취급을 특별히 우려하고 있었음을 보여준다."], "primary": "[251면]\n제904호\n\n왕전(往電) 제902호에 관하여.\n\n말씀드릴 것까지도 없는 일이오나, 본건 각서를 준비함에 있어서는 「タイピスト」(타이피스트) 등은 절대로 사용하지 않도록, 기밀 유지에는 이 위에 또한 신중에 신중을 기하여 주시기 바란다.", "secondary": "[251面]\n第九〇四号\n往電第九〇二号ニ関シ\n申ス迄モナキコト乍ラ本件覚書ヲ準備スルニ当リテハ「タイピスト」等ハ絶対ニ使用セサル様機密保持ニハ此上共慎重ニ慎重ヲ期セラレ度シ", "notes": ["「往電第九〇二号」는 문서 452의 별전(別電), 즉 「대미 각서」(MEMORANDUM) 영문 본문을 실은 전보이다. 문서 452는 237면에서 시작해 251면 상단까지 이어진다.", "「申ス迄モナキコト乍ラ」는 「말씀드릴 것까지도 없는 일이지만」의 뜻이다.", "「此上共」은 「이 위에 또한·더욱더」의 뜻이다.", "간행본 지면에서 이 문서의 본문 왼쪽에 세로 물결선(〰)이 그어져 있으나 조판상의 표시이므로 원문에 넣지 않았다."], "warn": false, "pages": ["nichibei2_05_068"], "search": "東郷茂徳 (도고 시게노리) — 외무대신 野村吉三郎 (노무라 기치사부로) — 주미 대사"}, {"id": "454", "order": 454, "date": "1941-12-06", "group": "A", "eyebrow": "문서 454 · 局面打開のための側面工作につき報告", "title": "국면 타개를 위한 측면 공작에 관한 보고", "list_right": "문서 454", "meta": [{"k": "일자", "v": "1941-12-06"}, {"k": "원문 표기", "v": "昭和16年12月6日"}, {"k": "전보번호", "v": "第一二七二号（極秘、館長符号）"}, {"k": "발신", "v": "在米国野村大使 (주미 노무라 대사, 野村吉三郎)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신, 東郷茂徳)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 12月6日後発 / 本省 12月7日後着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "局面打開のための側面工作につき報告", "txt": true, "wide": true}], "summary": "노무라 대사가, 대통령·헐 등과의 정면 교섭 외에 대통령과 가까운 각료급 유력자를 통한 두 갈래 측면 공작(A공작·B공작)의 진행 상황을 보고한 극비 전보.", "points": ["대통령·「ハル」(헐) 등과의 정면 교섭 외에, 대통령과 관계가 깊은 각료 또는 같은 격의 유력자와 직접·간접으로 연락을 취하여 측면 운동을 시도하고 있다.", "「국무성과 미묘한 관계가 있으니 엄비(厳秘)로 해 달라」고 못 박았다.", "A공작: 공작자가 4일 대통령과 오찬을 함께 하며 일미전쟁의 불가(不可)를 설하고, 대통령이 속히 일지(日支) 사이의 「紹介」(중개)를 할 것을 종용했으나 대통령은 속내를 밝히지 않았다.", "공작자에 따르면 그것은 대통령이 늘 취하는 태도이며, 지난번 대통령이 「ルイス」(루이스)와 회견해 「ストライキ」(파업)를 해결한 것도 이 공작자의 헌책에 따른 것이라고 한다.", "B공작: 공작자가 우리 쪽 11월 20일안을 9월 25일안 안에 전부 포함시키고, 11월 26일 미국안 가운데 우리 쪽에 유리하거나 무해한 부분을 더한 것에 다소 수정을 가하여, 이에 대한 「ハル」의 동의를 얻어 새로 미국안으로서 제출시키려 하고 있다.", "양 공작 관계자는 모두 대통령이 일미 타협을 충심으로 희망하고 있다고 전한다.", "그들은 모두 「ハル」의 사람됨(為人)을 숙지하고 있으며, 헐이 무슨 일에나 원칙론·이상론을 휘두르는 것은 그의 성벽(性癖)이라 할 만하나 그 실제적 적용에서는 상당히 관용적인 점을 우리 쪽에서도 주의할 필요가 있다고 말했다.", "「以上何等御参考迄」(이상 아무쪼록 참고까지)로 끝맺었다."], "primary": "[251면]\n제1272호 （극비, 관장부호）\n\n대통령·「ハル」(헐) 등에 대한 정면 교섭 외에, 대통령과 관계가 깊은 각료 또는 같은 격의 유력자와도 직접·간접으로 연락을 취하여 （국무성과 미묘한 관계가 있으니 엄비(厳秘)로 하여 주시기 바란다） 측면 운동을 시도하고 있는바, 오늘까지의 진전은 대체로 아래와 같다.\n\n（一）A공작　공작자는 4일 대통령과 오찬을 함께 하며 일미전쟁의 불가(不可)를 설하고, 대통령이 속히 일지(日支) 사이의 「紹介」(중개)를 할 것을 종용하였으나, 대통령은 속내를 밝히지 않았다. 공작자의 말에 따르면 이는 대통령이 늘 취하는 태도로서, 지난번 대통령이 「ルイス」(루이스)와 회견하여 「ストライキ」(파업)를 해결한 것도 이 공작자의 헌책(献策)에 따른 것이라 한다.\n\n（二）B공작　공작자는 우리 쪽 11월 20일안을 9월 25일안 안에 전부 포함시키고, 11월 26일 미국안 가운데 우리 쪽에 유리하거나 또는 무해한 부분을 더한 것에 다소의 수정을 가하여, 이에 [252면] 대한 「ハル」의 동의를 얻어 붙여 새로이 미국안으로서 제출시키려 하고 있다.\n\n（三）이상 양 공작 관계자는 모두 대통령이 일미 타협을 충심으로 희망하고 있다는 뜻을 전하는 외에, 그들은 모두 「ハル」의 사람됨(為人)을 숙지하고 있으며, 「ハ」(헐)가 무슨 일에나 원칙론·이상론을 휘두르는 것은 그 사람의 성벽(性癖)이라고도 할 만하나, 그럼에도 이것의 실제적 적용에는 상당히 관용적인 점은 우리 쪽에서도 주의를 요할 것이라고 말하고 있었다.\n\n이상 아무쪼록 참고까지.", "secondary": "[251面]\n第一二七二号（極秘、館長符号）\n大統領「ハル」等ニ対スル正面交渉ノ外大統領ト関係深キ閣僚又ハ同格ノ有力者トモ直接間接ニ連絡ヲ取リ（国務省ト機微ノ関係アリ厳秘トセラレ度シ）側面運動ヲ試ミツツアル処今日迄ノ進展大体左ノ通\n（一）A工作　工作者ハ四日大統領ト午餐ヲ共ニシ日米戦争ノ不可ヲ説キ大統領カ速ニ日支間ノ「紹介」ヲ為スコトヲ慫慂シタルモ大統領ハ意中ヲ明ニセス工作者ノ言ニ依レハ右ハ大統領ノ常ニ採ル態度ニシテ過般大統領カ「ルイス」ト会見「ストライキ」ヲ解決シタルモ右工作者ノ献策ニ依ルモノナル由\n（二）B工作　工作者ハ我方十一月二十日案ヲ九月二十五日案内ニ全部包含セシメ十一月二十六日米案ノ我方ニ有利又ハ無害ナル部分ヲ加ヘタルモノニ多少ノ修正ヲ施シ之ニ[252面]対スル「ハル」ノ同意ヲ取付ケ新ニ米案トシテ提出セシメントシツツアリ\n（三）以上両工作関係者ハ何レモ大統領カ日米妥協ヲ衷心ヨリ希望シツツアル旨ヲ伝フル外彼等ハ何レモ「ハル」ノ為人ヲ熟知シオリ「ハ」カ何事ニモ原則論理想論ヲ振リ廻スハ同人ノ性癖トモ称スヘク而モ之カ実際的適用ニハ余程寛容ナル点ハ我方ニ於テモ注意ヲ要スヘシト述ヘオリタリ\n以上何等御参考迄", "notes": ["「館長符号」는 대사관장(대사) 전용 암호를 뜻한다.", "「日支」·「支那」는 당대 표기이다. 「日支間ノ紹介」는 일본과 중국(중경 정권) 사이의 화평 중개를 미국 대통령이 맡는 것을 가리킨다.", "「ルイス」는 미국 광산노조 지도자 존 L. 루이스(John L. Lewis)로 보이나 지면에는 성만 가타카나로 적혀 있다. 1941년 가을 석탄 파업을 가리키는 것으로 보이나 지면에 명시가 없어 해석을 붙이지 않았다.", "「我方十一月二十日案」은 이른바 을안(乙案), 「九月二十五日案」은 9월 25일 일본 측 제안, 「十一月二十六日米案」은 이른바 「ハル・ノート」이다. 이 전보는 그것을 「米案」이라고만 부르고 「最後通牒」이라는 말은 쓰지 않았다.", "「A工作」·「B工作」의 공작자 이름은 지면에 나오지 않는다.", "「為人」은 「사람됨(ひととなり)」이다.", "「以上何等御参考迄」의 「何等」은 「아무쪼록·부디」에 가까운 상투어이다."], "warn": true, "pages": ["nichibei2_05_068", "nichibei2_05_069"], "search": "野村吉三郎 (노무라 기치사부로) — 주미 대사 東郷茂徳 (도고 시게노리) — 외무대신 「ハル」 (헐, Cordell Hull) — 국무장관 「大統領」 (루스벨트, Franklin D. Roosevelt) — 본문에서는 「大統領」으로만 나온다 「ルイス」 (루이스, Lewis) — 본문에는 성만 나온다"}, {"id": "455", "order": 455, "date": "1941-12-06", "group": "A", "eyebrow": "문서 455 · 米国大統領より天皇陛下へ親電発出について", "title": "미국 대통령이 천황 폐하께 친전을 발송한 건에 관하여", "list_right": "문서 455", "meta": [{"k": "일자", "v": "1941-12-06"}, {"k": "원문 표기", "v": "昭和16年12月6日"}, {"k": "전보번호", "v": "第一二七五号（極秘、館長符号）"}, {"k": "발신", "v": "在米国野村大使 (노무라 주미대사)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 12月6日後発 / 本省 12月7日後着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "米国大統領より天皇陛下へ親電発出について", "txt": true, "wide": true}], "summary": "12월 6일 밤 국무성이 루스벨트 대통령의 천황 앞 친전 발송을 공표한 사실을 노무라 대사가 보고하고, 친전 원문(영문)과 그 번역문을 붙였다.", "points": ["6일 밤 국무성이 대통령이 천황 폐하께 친전을 발송했다고 공표했으나 내용은 불명.", "동시에 국무성은 약 12만 5천의 일본군이 이미 불인(佛印)에 있고, 오늘 아침 군함 호송의 2개 군단이 「샴」만으로 향하고 있다는 정보를 발표.", "이 때문에 친전은 불인 증주(增駐)·태국 진출과 관련된 것으로 일반에 받아들여지고 있음.", "대통령이 외교기관을 거치지 않고 직접 폐하 앞으로 친전을 보낸 것은, 지난해 「파나이」호 사건 때의 친전에 대한 일본 측 조치 방식을 고려한 결과로 보임.", "부기 1은 12월 6일자 대통령 친전 영문 원문, 부기 2는 그 번역문."], "primary": "@@KO@@", "secondary": "付記一　十二月六日付天皇陛下宛米国大統領親電\\n　　二　右訳文\\n\\n[252면]六日夜国務省ハ大統領カ天皇陛下ニ親電ヲ発セル旨公表ス内容不明ナルモ同時ニ国務省ヨリ其ノ入手セル情報トシテ約十二万五千ノ日本軍既ニ仏印ニ在ル外今朝軍艦護送ノ二個軍団カ「シャム」湾ニ向ヒツツアル由ナルコトヲ発表セルニ鑑ミ仏印増駐「タイ」進出ニ関連スルモノト一般ニ見ラレ居レリ\\n尚大統領カ外交機関ヲ経由セス直接陛下宛親電ヲ発セルハ先年「パナイ」号事件ノ親電ニ対スル我方措置振リヲ考慮シタル結果カト思ハル\\n\\n（付記一）\\n\\nHis Imperial Majesty\\nThe Emperor of Japan.\\n\\nAlmost a century ago the President of the United States addressed to the Emperor of Japan a message extending an offer of friendship of the people of the United States to the people of Japan. That offer was accepted, and in the long period of unbroken peace and friendship which has followed, our respective nations, through the virtues of their peoples and the wisdom of [253면]their rulers have prospered and have substantially helped humanity.\\n\\nOnly in situations of extraordinary importance to our two countries need I address to Your Majesty messages on matters of state. I feel I should now so address you because of the deep and far-reaching emergency which appears to be in formation.\\n\\nDevelopments are occurring in the Pacific area which threaten to deprive each of our nations and all humanity of the beneficial influence of the long peace between our two countries. Those developments contain tragic possibilities.\\n\\nThe people of the United States, believing in peace and in the right of nations to live and let live, have eagerly watched the conversations between our two Governments during these past months. We have hoped for a termination of the present conflict between Japan and China. We have hoped that a peace of the Pacific could be consummated in such a way that nationalities of many diverse peoples could exist side by side without fear of invasion; that unbearable burdens of armaments could be lifted for them all; and that all peoples would resume commerce without discrimination against or in favor of any nation.\\n\\nI am certain that it will be clear to Your Majesty, as it is to me, that in seeking these great objectives both Japan and the United States should agree to eliminate any form of military threat. This seemed essential to the attainment of the high objectives.\\n\\nMore than a year ago Your Majesty's Government concluded an agreement with the Vichy Government by which five or six thousand Japanese troops were permitted to enter into Northern French Indo-China for the protection of Japanese troops which were operating against China further north. And this Spring and Summer the Vichy Government permitted further Japanese military forces to enter into Southern Frence Indo-China for the common defense of French Indo-China. I think I am correct in saying that no attack [254면]has been made upon Indo-China, nor that any has been contemplated.\\n\\nDuring the past few weeks it has become clear to the world that Japanese military, naval and air forces have been sent to Southern Indo-China in such large numbers as to create a reasonable doubt on the part of other nations that this continuing concentration in Indo-China is not defensive in its character.\\n\\nBecause these continuing concentrations in Indo-China have reached such large proportions and because they extend now to the southeast and the southwest corners of that Peninsula, it is only reasonable that the people of the Philippines, of the hundreds of Islands of the East Indies, of Malaya and of Thailand itself are asking themselves whether these forces of Japan are preparing or intending to make attack in one or more of these many directions.\\n\\nI am sure that Your Majesty will understand that the fear of all these peoples is a legitimate fear in as much as it involves their peace and their national existence. I am sure that Your Majesty will understand why the people of the United States in such large numbers look askance at the establishment of military, naval and air bases manned and equipped so greatly as to constitute armed forces capable of measures of offense.\\n\\nIt is clear that a continuance of such a situation is unthinkable.\\n\\nNone of the peoples whom I have spoken of above can sit either indefinitely or permanently on a keg of dynamite.\\n\\nThere is absolutely no thought on the part of the United States of invading Indo-China if every Japanese soldier or sailor were to be withdrawn therefrom.\\n\\nI think that we can obtain the same assurance from the Governments of the East Indies, the Governments of Malaya and the Government of Thailand. I would even undertake to ask for the same assurance on the part of [255면]the Government of China. Thus a withdrawal of the Japanese forces from Indo-China would result in the assurance of peace throughout the whole of the South Pacific area.\\n\\nI address myself to Your Majesty at this moment in the fervent hope that Your Majesty may, as I am doing, give thought in this definite emergency to ways of dispelling the dark clouds. I am confident that both of us, for the sake of the peoples not only of our own great countries but for the sake of humanity in neighboring territories, have a sacred duty to restore traditional amity and prevent further death and destruction in the world.\\n\\nWashington,\\nDecember 6, 1941.\\n\\nFRANKLIN D. ROOSEVELT.\\n\\n（付記二）\\n\\n日本国天皇陛下\\n\\n約一世紀前米国大統領ハ日本国天皇ニ対シ書ヲ致シ米国民ノ日本国々民ニ対スル友好ヲ申出タル処右ハ受諾セラレ爾来不断ノ平和ト友好ノ長期間ニ亘リ両国民ハ其ノ徳ト指導者ノ叡智ニヨリテ繁栄シ人類ニ対シ偉大ナル貢献ヲ為セリ\\n陛下ニ対シ余カ国務ニ関シ親書ヲ呈スルハ両国ニ取リ特ニ重大ナル場合ニ於テノミナルカ現ニ醸成セラレツツアル深刻且広汎ナル非常事態ニ鑑ミ茲ニ一書ヲ呈スヘキモノト感スル次第ナリ\\n日米両国民及全人類ヲシテ両国間ノ長年ニ亘ル平和ノ福祉ヲ喪失セシメントスルカ如キ事態カ現ニ太平洋地域ニ発生シツツアリ右情勢ハ悲劇ヲ孕ムモノナリ\\n米国民ハ平和ト諸国家ノ共存ノ権利トヲ信シ過去数ケ月ニ亘ル日米交渉ヲ熱心ニ注視シ来レリ吾人ハ支那事変ノ終息ヲ祈念シ諸国民ニ於テ侵略ノ恐怖ナクシテ共存シ得ルカ如キ太平洋平和カ実現セラレンコトヲ希望シ且堪ヘ難キ軍備ノ負担ヲ除去シ又各国民カ如何ナル国家ヲモ排撃シ若クハ之ニ特恵ヲ与フルカ如キ差別ヲ設ケサル通商ヲ復活セシメンコトヲ念願セリ\\n右大目的ヲ達成センカ為ニハ陛下ニ於カレテモ余ト同シク日米両国ハ如何ナル形式ノ軍事的脅威ヲモ除去スルコトニ同意[256면]スヘキコト明瞭ナリト信ス\\n約一年前陛下ノ政府ハ「ヴィシー」政府ト協定ヲ締結シ之ニ基キ北部仏領印度支那ニ同地北方ニ於テ支那軍ニ対シ行動シ居リタル日本軍保護ノ為ニ五、六千ノ軍隊ヲ進駐セシメタリ而シテ本年春及夏「ヴィシー」政府ハ仏領印度支那共同防衛ノ為メ更ニ日本部隊ノ南部仏印進駐ヲ容許セリ\\n余ハ仏領印度支那ニ対シ何等ノ攻撃行ハレタルコトナク又攻撃ヲ企図セラレタルコトナシト言明シテ差支ナシト思考ス\\n@@", "notes": [], "warn": false, "pages": ["nichibei2_05_069", "nichibei2_05_070", "nichibei2_05_071", "nichibei2_05_072"], "search": "野村吉三郎 (노무라 기치사부로) 東郷茂徳 (도고 시게노리) フランクリン・ディ・ルーズヴェルト (프랭클린 D. 루스벨트, Franklin D. Roosevelt)"}, {"id": "456", "order": 456, "date": "1941-12-07", "group": "B", "eyebrow": "문서 456 · 米国大統領よりの親電に関し照会", "title": "미국 대통령의 친전(親電)에 관한 조회", "list_right": "문서 456", "meta": [{"k": "일자", "v": "1941-12-07"}, {"k": "원문 표기", "v": "昭和16年12月7日"}, {"k": "전보번호", "v": "第九〇五号（大至急、館長符号）"}, {"k": "발신", "v": "東郷外務大臣 (도고 시게노리, 東郷茂徳)", "txt": true}, {"k": "수신", "v": "在米国野村大使 (주미 노무라 대사, 野村吉三郎)", "txt": true}, {"k": "발신·착신", "v": "本省 12月7日後2時発", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "米国大統領よりの親電に関し照会", "txt": true, "wide": true}], "summary": "AP·UP 보도로 알려진 루스벨트 대통령의 천황 앞 친전 발신 공표의 진상을 즉시 회신하라는 훈령.", "points": ["AP 및 UP 통신 보도에 따르면 미국 국무성이 대통령의 천황 앞 친전 발출을 공표했다고 한다.", "그 진상을 즉시 회신하라고 지시.", "발신 시각: 본성 12월 7일 오후 2시 발."], "primary": "[257면]\nAP 및 UP 통신에 의하면 국무성은 대통령이 성상폐하(聖上陛下) 앞으로 친전(親電)을 발출하였다는 뜻을 공표한 모양인바, 진상을 즉시 회신하여 주시기 바람.", "secondary": "[257面]\nAP及UP通信ニ依レハ国務省ハ大統領カ聖上陛下宛親電ヲ発出セル旨ヲ公表セル趣ノ処真相折返シ御回示アリ度", "notes": [], "warn": false, "pages": ["nichibei2_05_074"], "search": "東郷茂徳 (도고 시게노리) 野村吉三郎 (노무라 기치사부로) 「ローズヴェルト」(루스벨트, Roosevelt) — 본문에서는 「大統領」"}, {"id": "457", "order": 457, "date": "1941-12-07", "group": "B", "eyebrow": "문서 457 · 「対米覚書」手交方訓令", "title": "「대미 각서」 수교(手交) 훈령", "list_right": "문서 457", "meta": [{"k": "일자", "v": "1941-12-07"}, {"k": "원문 표기", "v": "昭和16年12月7日"}, {"k": "전보번호", "v": "第九〇七号（大至急、館長符号）"}, {"k": "발신", "v": "東郷外務大臣 (도고 시게노리, 東郷茂徳)", "txt": true}, {"k": "수신", "v": "在米国野村大使 (주미 노무라 대사, 野村吉三郎)", "txt": true}, {"k": "발신·착신", "v": "本省 12月7日後5時30分発", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "「対米覚書」手交方訓令", "txt": true, "wide": true}], "summary": "대미 각서를 현지 시각 7일 오후 1시를 기하여 노무라 대사가 직접 미국 측(되도록 국무장관)에 수교하라는 훈령.", "points": ["왕전(往電) 제901호에 관한 것.", "대미 각서를 현지 시각 7일 오후 1시를 기하여 미국 측에 수교하라.", "되도록 국무장관에게, 대사가 직접 수교할 것.", "발신 시각: 본성 12월 7일 오후 5시 30분 발."], "primary": "[257면]\n왕전(往電) 제901호에 관하여.\n본건 대미 각서를 귀지(貴地) 시각 7일 오후 1시를 기하여 미국 측에(되도록 국무장관에게) 귀 대사로부터 직접 수교하시기 바람.", "secondary": "[257面]\n往電第九〇一号ニ関シ\n本件対米覚書貴地時刻七日午後一時ヲ期シ米側ニ（成ル可ク国務長官ニ）貴大使ヨリ直接御手交アリ度シ", "notes": [], "warn": false, "pages": ["nichibei2_05_074"], "search": "東郷茂徳 (도고 시게노리) 野村吉三郎 (노무라 기치사부로) 「ハル」(헐, Cordell Hull) — 본문에서는 「国務長官」"}, {"id": "458", "order": 458, "date": "1941-12-07", "group": "B", "eyebrow": "문서 458 · 両大使以下館員に対する慰労の意伝達", "title": "양 대사 이하 관원에 대한 위로의 뜻 전달", "list_right": "문서 458", "meta": [{"k": "일자", "v": "1941-12-07"}, {"k": "원문 표기", "v": "昭和16年12月7日"}, {"k": "전보번호", "v": "第九〇八号"}, {"k": "발신", "v": "東郷外務大臣 (도고 시게노리, 東郷茂徳)", "txt": true}, {"k": "수신", "v": "在米国野村大使 (노무라 기치사부로, 野村吉三郎)", "txt": true}, {"k": "발신·착신", "v": "本省 12月7日発", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "両大使以下館員に対する慰労の意伝達", "txt": true, "wide": true}], "summary": "교섭이 끝났음을 전제로 도고가 노무라와 구루스, 대사관 직원 전원에게 사의를 표한다.", "points": ["본성 12월 7일 발신이다. 각서 수교 훈령(457호, 7일 후5시30분 발신)이 나간 뒤에 보낸 전보다.", "「日米国交ノ調整成ラス遂ニ今日ノ事態ニ立到リタル」이라 적었다. 교섭이 깨진 것을 본성 스스로 확인한 문구다.", "「今日ノ事態」가 무엇인지는 적지 않았다.", "양 대사(노무라·구루스)의 노고와 관원 전원의 분투에 사의를 표하는 것으로 끝난다."], "primary": "[257면]\n귀 양 대사께서 심혈을 기울이신 진력에도 불구하고 일미 국교의 조정이 이루어지지 못하고 마침내 오늘의 사태에 이르게 된 것은 함께 자못 유감으로 여기는 바이다.\n\n이 기회에 양 대사의 노력과 노고에 대하여 심심한 사의를 표함과 아울러 귀관 관원 여러분의 분투에 감사한다.", "secondary": "[257면]\n貴両大使カ心血ヲ注カレタル御尽力ニモ不拘日米国交ノ調整成ラス遂ニ今日ノ事態ニ立到リタルハ共ニ頗ル遺憾トスル所ナリ\n此ノ機会ニ両大使ノ御努力ト御労苦ニ対シ深甚ノ謝意ヲ表スルト共ニ貴館館員御一同ノ御奮闘ヲ感謝ス", "notes": [], "warn": false, "pages": ["nichibei2_05_074"], "search": "東郷茂徳 (도고 시게노리, 외무대신) 野村吉三郎 (노무라 기치사부로, 주미대사) 来栖三郎 (구루스 사부로, 특명대사. 「貴両大使」의 한 사람)"}, {"id": "459", "order": 459, "date": "1941-12-07", "group": "B", "eyebrow": "문서 459 · 「対米覚書」の一部修正方訓令", "title": "「대미 각서」의 일부 수정 훈령", "list_right": "문서 459", "meta": [{"k": "일자", "v": "1941-12-07"}, {"k": "원문 표기", "v": "昭和16年12月7日"}, {"k": "전보번호", "v": "第九一一号（緊急、館長符号）"}, {"k": "발신", "v": "東郷外務大臣 (도고 시게노리, 東郷茂徳)", "txt": true}, {"k": "수신", "v": "在米国野村大使 (노무라 기치사부로, 野村吉三郎)", "txt": true}, {"k": "발신·착신", "v": "本省 12月7日後7時20分発", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "「対米覚書」の一部修正方訓令", "txt": true, "wide": true}], "summary": "각서 III 항 첫머리 영문의 한 낱말을 고치라는 훈령이다. 12월 7일 오후 7시 20분에 나갔다.", "points": ["본성 12월 7일 후7시20분 발신. 각서 수교 훈령(457호, 후5시30분 발신)보다 1시간 50분 뒤다.", "고치라 한 곳은 각서 III의 첫머리, 「But the American Government, adhering steadfastly to its original proposal」 안의 proposal 이다.", "proposal 을 assertions 로 바꾸라 했다. 개전 직전에 각서 문면을 낱말 하나까지 손보고 있었다는 기록이다.", "왕전 제九〇二호에 잇대는 전보다."], "primary": "[257면]\n제九一一호（긴급, 관장부호）\n\n왕전 제九〇二호에 관하여\n\n[258면]\n대미 각서 중 III의 첫머리 쪽 「But the American Government, adhering steadfastly to its original proposal」의 proposal 을 assertions 로 정정하기 바람.", "secondary": "[257면]\n第九一一号（緊急、館長符号）\n往電第九〇二号ニ関シ\n[258면]\n対米覚書中IIIノ初メノ方 But the American Government, adhering steadfastly to its original proposal ノ proposal ヲ assertions ニ訂正アリ度", "notes": ["「館長符号」는 공관장이 직접 다루는 암호를 가리킨다."], "warn": false, "pages": ["nichibei2_05_074", "nichibei2_05_075"], "search": "東郷茂徳 (도고 시게노리, 외무대신) 野村吉三郎 (노무라 기치사부로, 주미대사)"}, {"id": "460", "order": 460, "date": "1941-12-08", "group": "B", "eyebrow": "문서 460 · 米国大統領親電への天皇陛下回答伝達に際しての駐日米国大使との会談要旨", "title": "미국 대통령 친전에 대한 천황폐하 회답을 전달할 때의 주일 미국대사와의 회담 요지", "list_right": "문서 460", "meta": [{"k": "일자", "v": "1941-12-08"}, {"k": "원문 표기", "v": "昭和16年12月8日"}, {"k": "전보번호", "v": null}, {"k": "발신", "v": "東郷外務大臣 (도고 시게노리, 東郷茂徳)", "txt": true}, {"k": "수신", "v": "在本邦米国大使 (주일 미국대사 그루, ジョセフ・グルー)", "txt": true}, {"k": "발신·착신", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "会談録"}, {"k": "표제", "v": "米国大統領親電への天皇陛下回答伝達に際しての駐日米国大使との会談要旨", "txt": true, "wide": true}], "summary": "12월 8일 오전 7시 반, 도고가 그루를 불러 천황의 회답을 전하고 대미 각서 사본을 건넸다. 진주만 기습 성공 통보가 들어온 지 세 시간 뒤다.", "points": ["회담 시각이 「昭和十六年十二月八日午前七時半」으로 못박혀 있다.", "도고는 각서에 대해 「華府時間七日午後本覚書ヲ米国政府ニ提出方取計ヒ置キタリ」라고만 말했다. 워싱턴 시간 7일 오후라 했을 뿐 시각도 전달 여부도 말하지 않았다.", "그루는 친전을 직접 봉정하겠다고 청했고 도고는 막지 않았으나 필요 없을 것이라 했다. 부기삼의 （註）二는 「親電ハ結局捧呈セラレサリシモノナリ」라 적고, 정보국 발표가 사실과 다르다고 못박았다.", "부기삼이 12월 7일 밤부터 8일 아침까지의 시각을 촘촘히 적었다. 밤 10시 넘어 그루의 연락, 자정 15분에 그루 방문, 오전 2시 반 참내, 3시 반 지나 귀저, 8일 오전 6시를 기해 영미 대사 통고 예정.", "그 예정을 세운 「직후（四時過キ）」에 오카(岡) 해군군무국장이 전화로 진주만 기습 성공을 알려 왔다. 통고 예정보다 두 시간 가까이 앞선다.", "（註）三은 8일 아침 회견 때 「英米大使何レモ右ニ先チ交戦状態発生セルコトヲ知リ居ラサリシモノナリ」라고 적었다."], "primary": "[258면]\n쇼와 16년 12월 8일 오전 7시 반\n\n一、본 대신으로부터, 어젯밤 지참하여 오신 「루스벨트」(ローズベルト) 대통령의 성상폐하께 대한 친전에 관하여는 귀 대사와 회견한 뒤 이에 대한 성상폐하의 어의(御思召)를 받들 기회를 얻었습니다. 즉 성상폐하께서는 귀 대사를 통하여 「루스벨트」 대통령에게 아래의 취지를 전달하도록 하명하셨다 하여\n\n「불인(仏印)에 일본 군대가 집결한 사정에 관하여는 지난번 미국 대통령의 조회에 대하여 일본 정부로 하여금 회답하게 하였다. 또한 불인으로부터의 철병은 일미 교섭에 있어서의 한 항목을 이루는 것으로서, 이에 관하여도 일본 정부로 하여금 의사표시를 하게 하였으니 그로써 양지하기 바란다. 그리고 태평양 나아가 세계의 평화와 강녕을 초래하려 함은 짐의 본디 뜻이며, 이를 위하여 짐의 정부로 하여금 오늘까지 노력하게 하여 온 것은 대통령께서도 일찍이 양해하고 계신 바이리라 믿는다」\n\n라는 사연을 진술하였던바, 동 대사는 이를 황공히 배청한 뒤 어의의 뜻은 곧바로 대통령에게 전달하겠다고 답하였고, 아울러 자기가 가지고 있는 훈령에 의하면 본 사(本使)가 배알을 청원한 뒤 친히 그 친전을 봉정하여야 한다고 되어 있는데 양국 관계가 목하 중대한 위국에 직면하고 있는 때이기도 하니 배알을 특별히 주선하여 주시기를 청할 수 없겠는가 하고 신청하였습니다. 그래서 본 대신은, 만약 귀 대사의 배알의 목적이 단지 그 친전의 봉정뿐이라면 어의는 이미 말씀드린 바와 같으므로 그 필요가 없지 않은가 생각되나, 본 대신으로서는 귀 대사의 희망을 저지할 의도가 조금도 없으며 귀 대사가 그 친전 외에 부가하여 아뢸 것도 있다면 물론 고려에 인색하지 않겠다는[259면] 취지를 답하였던바, 동 대사는 극히 만족한 모습으로 사의를 표하였습니다.\n\n（또한 동 대사의 요청에 따라 후에 위 신청의 취지의 영문 가역（별첨 갑호）을 송부해 두었습니다）\n\n二、이어서 본 대신으로부터 대미 각서 사본을 수교하고, 제국 정부는 일미 교섭 타결을 위하여 전력을 기울였고 본 대신 또한 열심히 노력한 것은 아시는 바와 같으나, 미국 정부의 태도에 비추어 유감스럽게도 금후 교섭을 계속하더라도 성립할 가망이 없다는 결론에 도달하였으므로 화부(華府, 워싱턴) 시간 7일 오후 본 각서를 미국 정부에 제출하도록 조치해 두었다, 사태가 여기에 이른 것은 본 대신이 가장 유감으로 여기는 바라고 말하였던바, 동 대사는 문서는 관으로 돌아간 뒤 배견하겠고 지금 아무런 의견을 진술하는 것은 삼가겠다고 말하고 물러갔다.\n\n편주　부기 二 참조\n\n（부기 一）\n불인에 일본 군대가 집결한 사정에 관하여 지난번 미국 대통령의 조회에 대하여 일본 정부에서 회답하게 하였다.\n\n또한 불인으로부터의 철병은 일미 교섭에 있어서의 한 항목을 이루는 것으로서, 이에 관하여도 일본 정부로 하여금 의사표시를 하게 하였으니 그로써 양지하기 바란다.\n\n그리고 태평양 나아가 세계의 평화와 강녕을 초래하려 함은 짐의 본디 뜻이며, 이를 위하여 짐의 정부로 하여금 오늘까지 노력하게 하여 온 것은 대통령께서도 일찍이 양해하고 계신 바이리라 믿는다.\n\n（부기 二）\n（원문 영문. 아래는 참고 번역이다）\n\n폐하께서는 대통령의 간곡한 메시지에 대하여 감사와 사의를 표하셨다. 폐하께서는 대통령의 메시지에 대한 회답으로서 다음을 대통령에게 전하도록 외무대신에게 그 뜻을 알리셨다.\n\n「며칠 전 대통령은 불령 인도지나에 있어서의 일본군 증강의 사정에 관하여 조회하였고, 이에 대하여 폐하께서는 정부에 회답하도록 명하셨다. 불령 인도지나로부터의 일본군 철수는 일미[260면] 교섭의 의제 가운데 하나를 이룬다. 폐하께서는 이 문제에 관하여도 미국 정부에 그 견해를 진술하도록 정부에 명하셨다. 따라서 대통령께서 이 회답을 참조하여 주시기를 바란다.\n\n태평양의, 나아가 그 결과로서 세계의 평화 확립은 폐하께서 오래 품어 오신 소망이며, 그 실현을 위하여 폐하께서는 지금까지 정부로 하여금 진지한 노력을 계속하게 하셨다. 폐하께서는 대통령께서 이 사실을 충분히 알고 계시리라 믿으신다.」\n\n（부기 三）\n「루스벨트」 대통령의 친전에 관한 경위\n\n一、작년 12월 7일 이른 아침 당지에 들어온 UP 통신은, 미국 국무장관이 성상폐하께 대한 「루스벨트」 대통령의 「메시지」를 발송하였다는 뜻을 공표하였다고 보도한 바 있었다. 이에 외무 당국에서는 곧바로 관계 방면과 연락하고 그 「메시지」의 도착을 대기하고 있었다.\n\n二、그런데 그 「메시지」는 상당히 연착한 듯, 그날 밤 10시가 지나서야 비로소 재경 미국대사로부터 외무대신에게, 중요 긴급 안건에 관하여 훈령이 접수되어 전문을 해독 중이라는 취지로 후에 회견하고 싶다는 뜻을 알려 왔는데, 그날 밤중（0시 15분）「그루」 대사는 그 「메시지」를 지니고 도고 외무대신을 관저로 내방하였다.\n\n三、회담은 십수 분 만에 끝났으나, 그때 「그」 대사는 「루」 대통령으로부터 성상폐하께 대한 친전이 접수된 것과 아울러 동 대사는 그것을 친히 배알한 위에 궐하에 봉정하도록 특별히 훈령받고 있다는 것을 말하고 외무대신의 주선을 구하였다. 외무대신은 이에 대하여, 배알의 건은 밤중의 일이기도 하여 내일 아침에 이르지 않으면 절차도 밟기 어려우며, 귀 사(貴使)의 희망대로 배알이 이루어질지는 친전의 내용에도 달린 일일 것이라는 뜻으로 응수한바, 「그」 대사는 준비한 친전 사본（갑호）을 비공식으로 대신에게 수교하고, 사태가 자못 중대한 때이니 기어이 배알하고자 한다며 거듭 특별한 배려를 바란다고 말하고 재회를 약속하고 물러갔다.\n\n四、외무대신은 그 친전의 요역(要訳)을 지니고 총리 관저에 가서 수상 이하와 긴급 협의한 결과 본건 취급 방침의 복안을 대체로 결정하고, 그날 밤 오전 2시 반에 참내（폐하께서는 해군 정장으로 출어하셨다）하여 위곡(委曲)을 복주하였다.\n\n五、외무대신은 오전 3시 반이 지나 귀저하였으므로, 예정대로[261면] 8일 오전 6시를 기하여 재경 영·미 대사에게 일미 교섭 타절의 통고를 행함과 아울러, 그때 「그」 대사에게 아래를 「루」 대통령 친전에 대한 성상폐하의 어의로서 통보하기로 하고 준비를 진행하였다.\n\n記\n불인에 일본 군대가 집결한 사정에 관하여 지난번 미국 대통령의 조회에 대하여 일본 정부에서 회답하게 하였다.\n\n또한 불인으로부터의 철병은 일미 교섭에 있어서의 한 항목을 이루는 것으로서, 이에 관하여도 일본 정부로 하여금 의사표시를 하게 하였으니 그로써 양지하기 바란다.\n\n그리고 태평양 나아가 세계의 평화와 강녕을 초래하려 함은 짐의 본디 뜻이며, 이를 위하여 짐의 정부로 하여금 오늘까지 노력하게 하여 온 것은 대통령께서도 일찍이 양해하고 계신 바이리라 믿는다.\n\n그 후 얼마 지나지 않아（4시 지나）오카(岡) 해군 군무국장으로부터 대신에게 전화로 진주만 기습이 주효하였다는 뜻을 통보해 왔다.\n\n六、8일 아침 외무대신은 예정보다 다소 늦게（전화 연락이 곤란하였던 데 따른다）미·영 대사를 접견하였는데, 그때 「그」 대사와의 사이에는 요지 별지（을호）와 같은 회담이 행하여졌다.\n\n（주）\n一、본건 회담에는 가세(加瀬) 서기관이 입회 통역하였다.\n二、친전은 결국 봉정되지 아니한 것이다. 이 점 정보국의 공표는 사실과 다르다.\n三、8일 아침 회견 때에는 영·미 대사 모두 그에 앞서 교전 상태가 발생한 것을 알고 있지 아니하였던 것이다.\n\n편주　一 455문서 부기 一 참조\n　　　二 460문서 참조", "secondary": "[258면]\n昭和十六年十二月八日午前七時半\n一、本大臣ヨリ昨夜御持参相成リタル「ローズベルト」大統領ノ聖上陛下ニ対スル親電ニ関シテハ貴大使ト会見後右ニ対スル聖上陛下ノ御思召ヲ拝承スル機会ヲ得マシタ即チ聖上陛下ニ於カセラレテハ貴大使ヲ通シ「ローズベルト」大統領ニ左記趣旨ヲ伝達方御下命相成リマシタトテ\n「仏印ニ日本軍隊集結セル事情ニ付テハ過般米国大統領ノ照会ニ対シ日本政府ヲシテ回答セシメタリ尚仏印ヨリノ撤兵ハ日米交渉ニ於ケル一項目ヲ為セルモノニシテ右ニ付テモ日本政府ヲシテ意思表示ヲ為サシメタルニヨリ右ニヨリ御承知相成度シ而シテ太平洋牽テ世界ノ平和康寧ヲ招来セントスルハ朕ノ素志ニシテ之カ為朕ノ政府ヲシテ今日迄努力セシメ来リタルコトハ大統領ニ於テモ夙ニ了承セラレ居ル所タルヘキヲ信ス」\nノ次第ヲ申述ヘマシタ処同大使ハ之ヲ恐懼拝聴シタル上御思召ノ程ハ早速大統領ニ伝達致スヘシト答へ尚自分ノ有スル訓令ニ依レハ本使ニ於テ拝謁ヲ御願シタル上親シク右親電ヲ捧呈スヘシトアル処両国関係目下重大危局ニ直面致シ居ル際ニモアリ拝謁方特ニ御取計ヲ願ヘマシキヤト申出テマシタノテ本大臣ハ若シ貴大使ノ拝謁ノ目的カ単ニ右親電捧呈ノミナルニ於テハ御思召ハ既述ノ通ナルニ付其必要ナキヤニ考ヘラルルモ本大臣ニ於テハ何等貴大使ノ御希望ヲ阻止スル意図ナク貴大使カ右親電ノ外ニ付加言上スヘキコトモアラハ勿論考慮ニ吝ナラストノ[259면]趣旨ヲ答ヘマシタ処同大使ハ極メテ満足ナル様子ニテ謝意ヲ述ヘマシタ\n（尚同大使ノ求メニ依リ後刻右申入レノ趣旨ノ英文仮訳（別添甲号）ヲ送付シ置キマシタ）\n二、次テ本大臣ヨリ対米覚書写ヲ手交シ帝国政府ハ日米交渉妥結ノ為メ全力ヲ傾倒シ本大臣亦熱心ニ努力セルコト御承知ノ通ナルモ米国政府ノ態度ニ鑑ミ遺憾乍ラ今後交渉ヲ継続スルモ成立ノ見込ナシトノ結論ニ達シタルヲ以テ華府時間七日午後本覚書ヲ米国政府ニ提出方取計ヒ置キタリ事態茲ニ立至レルハ本大臣ノ最モ遺憾トスル所ナリト述ヘタルニ同大使ハ文書ハ帰館ノ上拝見スヘク唯今何等意見ヲ申述フルコトハ差控フヘシト述へ辞去セリ\n編 注　付記二参照\n（付記一）\n仏印ニ日本軍隊集結セル事情ニ付テ過般米国大統領ノ照会ニ対シ日本政府ニ於テ回答セシメタリ\n尚仏印ヨリノ撤兵ハ日米交渉ニ於ケル一項目ヲ為セルモノニシテ右ニ付テモ日本政府ヲシテ意思表示ヲ為サシメタルニヨリ右ニヨリ御承知相成度シ\n而シテ太平洋牽テ世界ノ平和康寧ヲ招来セントスルハ朕ノ素志ニシテ之カ為メ朕ノ政府ヲシテ今日迄努力セシメ来リタルコトハ大統領ニ於テモ夙ニ了承セラレ居ル所タルヘキヲ信ス\n（付記二）\nHis Majesty has expressed his gratefulness and appreciation for the cordial message of the President. He has graciously let known his wishes to the Foreign Minister to convey the following to the President as a reply to the latter's message.\n\"Some days ago, the President made inquires regarding the circumstances of the augmentation of Japanese forces in French Indo-China, to which His Majesty has directed the Government to reply. Withdrawal of Japanese forces from French Indo-China constitutes one of the subject matters of the Japanese-[260면]American negotiations. His Majesty has commanded the Government to state its views to the American Government also on this question. It is, therefore, desired that the President will kindly refer to this reply.\nEstablishment of peace in the Pacific and consequently of the world has been the cherished desire of His Majesty, for the realization of which He has hitherto made the Government continue its earnest endeavors. His Majesty trusts that the President is fully aware of this fact.\"\n（付記三）\n「ルーズベルト」大統領ノ親電ニ関スル経緯\n一、客年十二月七日早朝当地ニ入電セルUP通信ハ米国国務長官カ聖上陛下ニ対スル「ルーズベルト」大統領ノ「メッセージ」発送セラレタル旨ヲ公表セル由報道スル所アリ依テ外務当局ニ於テハ直ニ関係方面ト連絡シ右「メッセージ」到着ヲ待機シ居リタリ\n二、然ルニ右「メッセージ」ハ相当延着セルモノノ如ク同夜十時過キニ至リテ初メテ在京米国大使ヨリ外務大臣ニ対シ重要緊急案件ニ付キ訓令接到シ電文解読中ナル趣ヲ以テ後刻会見致シ度キ旨申越シタルカ同夜半（零時十五分）「グルー」大使ハ右「メッセージ」ヲ携ヘ東郷外務大臣ヲ官邸ニ来訪セリ\n三、会談ハ十数分ニテ終了セルカ其際「グ」大使ハ「ル」大統領ヨリ聖上陛下ニ対スル親電接到セルコト並ニ同大使ハ右ヲ親シク拝謁ノ上闕下ニ捧呈方特ニ訓令セラレ居ルコトヲ述ヘ外務大臣ノ斡旋ヲ求メタリ外務大臣ハ右ニ対シ拝謁ノ儀ハ夜中ノコトニモアリ明朝ニ至ラサレハ手続モ致シ兼ヌルモ貴使ノ希望通リ拝謁適フヘキヤハ親電内容ニモ依ルコトナルヘシトノ意味合ヲ応酬セル処「グ」大使ハ用意ノ親電写（甲号）ヲ非公式ニ大臣ニ手交シ事態頗ル重大ナル際ナルニ付キ是非共拝謁致シ度ク重ネテ特別ノ御配慮ヲ願フト述ヘ再会ヲ約シ辞去シタリ\n四、外務大臣ハ右親電要訳ヲ携ヘ総理官邸ニ赴キ首相以下ト緊急協議ノ結果本件取扱振ノ腹案ヲ大体決定シ同夜午前二時半参内（陛下ニハ海軍正装ニテ出御遊ハサル）シ委曲ヲ伏奏セリ\n五、外務大臣ハ午前三時半過キ帰邸シタルヲ以テ予定ノ通[261면]リ八日午前六時ヲ期シ在京英米大使ニ対シ日米交渉打切ノ通告ヲ行フト共ニ其際「グ」大使ニ対シ左記ヲ「ル」大統領親電ニ対スル聖上陛下ノ御思召トシテ通報スルコトトシ手配ヲ進メタリ\n記\n仏印ニ日本軍隊集結セル事情ニ付テ過般米国大統領ノ照会ニ対シ日本政府ニ於テ回答セシメタリ\n尚仏印ヨリノ撤兵ハ日米交渉ニ於ケル一項目ヲ為セルモノニシテ右ニ付テモ日本政府ヲシテ意思表示ヲ為サシメタルニヨリ右ニヨリ御承知相成度シ\n而シテ太平洋牽テ世界ノ平和康寧ヲ招来セントスルハ朕ノ素志ニシテ之カ為朕ノ政府ヲシテ今日迄努力セシメ来リタルコトハ大統領ニ於テモ夙ニ了承セラレ居ル所タルヘキヲ信ス\n其後幾許モナク（四時過キ）岡海軍々務局長ヨリ大臣ニ電話ヲ以テ真珠湾ノ奇襲奏功セル旨通報越シタリ\n六、八日朝外務大臣ハ予定ヨリ稍々遅レテ（電話連絡困難ナリシニ依ル）米英大使ヲ接見シタルカ其際「グ」大使トノ間ニハ要旨別紙（乙号）ノ如キ会談行ハレタリ\n（註）\n一、本件会談ニハ加瀬書記官立会通訳セリ\n二、親電ハ結局捧呈セラレサリシモノナリ此点情報局ノ公表ハ事実ト相違ス\n三、八日朝会見ノ際ハ英米大使何レモ右ニ先チ交戦状態発生セルコトヲ知リ居ラサリシモノナリ\n編注　一 455文書付記一参照\n　　　二 460文書参照", "notes": ["「仏印」은 프랑스령 인도차이나(불령 인도지나)를 가리키는 당대 일본식 약칭이다. 원문 그대로 「불인」으로 옮겼다.", "「華府」는 워싱턴의 한자 표기다.", "「願ヘマシキヤ」는 지면에 탁점 없이 그렇게 인쇄되어 있다. 고치지 않았다.", "부기 二의 영문은 원문 그대로 두었고, 그 아래 참고 번역을 덧붙였다. inquires, augmentation 등의 철자도 지면대로다.", "「編注」(편주)는 외무성 편찬자가 붙인 주다. 원문의 일부가 아니다."], "warn": false, "pages": ["nichibei2_05_075", "nichibei2_05_076", "nichibei2_05_077", "nichibei2_05_078"], "search": "東郷茂徳 (도고 시게노리, 외무대신) ジョセフ・グルー (그루, Joseph C. Grew, 주일 미국대사. 원문 「グルー」「グ」) フランクリン・ルーズベルト (루스벨트, Franklin D. Roosevelt. 원문 「ローズベルト」「ルーズベルト」「ル」) 岡敬純 (오카 다카즈미, 해군성 군무국장) 加瀬俊一 (가세 도시카즈, 서기관. 통역 입회) 東条英機 (도조 히데키, 총리. 원문 「首相」)"}, {"id": "461", "order": 461, "date": "1941-12-08", "group": "B", "eyebrow": "문서 461 · 日米交渉決裂に関する東郷外務大臣と駐日英国大使との会談要旨", "title": "일미 교섭 결렬에 관한 도고 외무대신과 주일 영국대사의 회담 요지", "list_right": "문서 461", "meta": [{"k": "일자", "v": "1941-12-08"}, {"k": "원문 표기", "v": "昭和16年12月8日"}, {"k": "전보번호", "v": null}, {"k": "발신", "v": "東郷外務大臣 (도고 시게노리, 東郷茂徳)", "txt": true}, {"k": "수신", "v": "在本邦英国大使 (주일 영국대사 크레이기, ロバート・クレーギー)", "txt": true}, {"k": "발신·착신", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "会談録"}, {"k": "표제", "v": "日米交渉決裂に関する東郷外務大臣と駐日英国大使との会談要旨", "txt": true, "wide": true}], "summary": "12월 8일 오전 8시, 미국대사 접견에 잇대어 영국대사를 불러 대미 각서 사본을 건넸다.", "points": ["회담 시각이 「昭和十六年十二月八日午前八時」로 못박혀 있다. 460호의 미국대사 회담(오전 7시 반) 직후다.", "영국대사에게도 대미 각서 「사본」을 건넸다. 사본이지만 최근 일영 간 문제에 대한 제국 정부의 견해를 표시한 것으로 이해해 달라고 했다.", "영국대사는 일본 선박 다수가 군대를 호위해 「샴」만을 서항 중이며 일부는 태국령, 다른 일부는 말레이 반도로 향하는 듯하다는 정보를 댔다.", "영국대사는 타국이 태국의 독립과 보전을 존중하면 영국도 침해할 의도가 없다고 하고, 일본 정부가 군부를 억제하기를 희망한다고 했다.", "도고는 어젯밤 이래의 정세를 상세히 알지 못한다고 답했다. 진주만 기습 성공 통보를 받은 지 네 시간이 지난 시점이다.", "도고는 도리어 영국 측이 태국 국경 부근에 인도 병력 등을 집결시키고 있다는 보도를 들었다며, 우리 함선이 근해를 유익(游弋)하는 것은 그에 대처하기 위한 것이리라고 했다."], "primary": "[261면]\n쇼와 16년 12월 8일 오전 8시\n\n미국대사와의 회견에 잇대어 재경 영국대사를 인견하여, 미국대사에게 대한 것과 마찬가지로 간단히 일미 교섭 타절이 부득이하게 된 취지를 말하고 대미 각서 사본을 수교하였으며, 이것은 사본이나 영국은 본 교섭에 심대한 관계를 가지고 있고 영미 관계는 사실상 불가분임에 비추어 최근의 일영 간 여러 문제에 관한 제국 정부의 견해를 표[262면]시한 것으로 양해해 주기 바란다고 말하였습니다.\n\n그러자 동 대사는 교섭 결렬에 관하여는 본 대신과 마찬가지로 이를 깊이 유감으로 여긴다는 뜻을 말하고, 또한 정보에 의하면 일본 선박 다수가 군대를 호위하여 「샴」만을 서항 중이라 하며 일부는 태국령으로, 다른 일부는 말레이 반도로 향하는 것이 아닌가 상상되는데, 만약 일본군이 그 지방에 침입한다면 심상치 않은 사태를 유발할 것이다, 영국은 지난번에도 말한 바와 같이（6일 본 대신과의 회견을 뜻한다）타국이 태국의 독립 및 보전을 존중한다면 나서서 이를 침해할 아무런 의도가 없다, 그러니 일본 정부에서 군부를 억제하기를 희망한다고 말하였습니다.\n\n그래서 본 대신은, 어젯밤 이래의 정세에 관하여는 상세히 알지 못한다, 다만 오늘 아침에도 태국 국경 부근에 영국 측이 인도 병사 등을 집결시키고 있다는 보도를 듣고 있으며 그 방면의 사태는 평상이 아니라고 인정되는바, 이 정세에 대처하기 위하여 우리 함선이 근해를 유익(游弋)하고 있는 것이리라고 생각한다, 본 대신은 목하 주태(在泰) 제국대사로부터 정보를 받아 오고 있으므로 그것이 접수되면 이것도 고려에 넣어 정세를 연구하기로 하겠다고 답하였던바, 동 대사는 평화를 교란하는 분자의 날조적 보도를 경계해 주기 바란다는 취지를 말하고 물러갔습니다.", "secondary": "[261면]\n昭和十六年十二月八日午前八時\n米国大使トノ会見ニ引続キ在京英国大使ヲ引見致シマシテ米国大使ニ対スルト同様簡単ニ日米交渉打切ノ已ムナキニ至レル旨ヲ述ヘ対米覚書写ヲ手交シ右ハ写ナルモ英国ハ本交渉ニ甚大ナル関係ヲ有シ居リ英米関係ハ事実上不可分ナルニ鑑ミ最近ノ日英間諸問題ニ関スル帝国政府ノ見解ヲ表[262면]示セルモノト了解セラレ度シト述ヘマシタ処同大使ハ交渉決裂ニ付テハ本大臣同様之ヲ深ク遺憾トスル旨述ヘ尚情報ニ依レハ日本船舶多数軍隊ヲ護衛シ「シャム」湾ヲ西航中ノ由ニテ一部ハ泰領ニ他ハ馬来半島ニ向フモノナルヤニ想像セラルル処若シ日本軍カ同地方ニ侵入スルニ於テハ由々敷事態ヲ誘発スヘシ英国ハ過日モ申述ヘタル通リ（六日本大臣トノ会見ヲ意味ス）他国カ泰ノ独立及保全ヲ尊重スルニ於テハ進テ之ヲ侵害スル何等ノ意図ナシ就テハ日本政府ニ於テ軍部ヲ抑制センコトヲ希望スト述ヘマシタノテ本大臣ハ昨夜来ノ情勢ニ付テハ詳知セス尤モ本朝モ泰国境付近ニ英国側カ印度兵等ヲ集結シ居ル旨ノ報道ヲ開キ及ヒ居リ同方面ノ事態ハ平常ニアラスト認メラレ此ノ情勢ニ対処スル為メ我艦船カ近海ヲ游弋シ居ルモノナルヘシト考フ本大臣ハ目下在泰帝国大使ヨリ情報ヲ取寄セ居ルニ付キ右接到ノ上ハ之ヲモ考慮ニ入レ情勢ヲ研究スルコトトスヘシト答ヘマシタルニ同大使ハ平和ヲ擾乱スル分子ノ捏造的報道ヲ警戒セラレ度シトノ趣旨ヲ述ヘ辞去致シマシタ", "notes": ["「泰」는 태국(타이)의 당대 표기다.", "「馬来半島」는 말레이 반도다.", "「游弋」는 함선이 일정 해역을 돌며 경계하는 것을 이른다.", "「報道ヲ開キ及ヒ居リ」의 「開」는 지면 그대로다. 뜻으로는 「聞」이다."], "warn": false, "pages": ["nichibei2_05_078", "nichibei2_05_079"], "search": "東郷茂徳 (도고 시게노리, 외무대신) ロバート・クレーギー (크레이기, Robert Craigie, 주일 영국대사. 원문에는 이름 없이 「在京英国大使」)"}, {"id": "462", "order": 462, "date": "1941-12-08", "group": "X", "eyebrow": "문서 462 · 宣戦の詔書", "title": "선전의 조서", "list_right": "문서 462", "meta": [{"k": "일자", "v": "1941-12-08"}, {"k": "원문 표기", "v": "昭和16年12月8日"}, {"k": "전보번호", "v": null}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "발신·착신", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "詔書"}, {"k": "표제", "v": "宣戦の詔書", "txt": true, "wide": true}], "summary": "1941년 12월 8일 미국·영국에 대한 선전의 조서. 부기 다섯 편이 붙어 있다. 정부 성명과 그 영역문, 개전을 의결한 추밀원 회의 의사요록, 외무성이 공표한 「일미교섭 경과」와 그 영역문이다.", "points": ["본문 262면의 조서는 「朕茲ニ米国及英国ニ対シテ戦ヲ宣ス」로 시작한다. 미국과 영국만을 대상으로 하고 네덜란드는 들어 있지 않다.", "조서는 중화민국 국민정부의 갱신과 「重慶ニ残存スル政権」을 갈라 놓고, 미·영이 잔존 정권을 지원해 동아의 화란을 조장했다고 적었다.", "부기삼 추밀원 회의 의사요록이 이 문서의 고갱이다. 심사위원회는 12월 8일 오전 7시 40분 궁중 히가시산노마에서 열렸다.", "출석자 주기에 「東郷外務大臣ハ米、英大使ト会見ノ為遅参ス」가 있다. 개전을 의결하는 회의에 외무대신이 통고를 마치고 늦게 들어왔다.", "전쟁 개시는 12월 1일 어전회의에서 이미 칙재되었고, 추밀원 자순은 「미국 및 영국에 대하여 선전을 포고한다」는 상주안에 한정되었다.", "네덜란드에 대하여는 「작전의 편의상」 선전하지 않는다고 도조 총리가 답했다.", "부기사 「일미교섭 경과」는 11월 26일 미국 문서를 「최후통첩」이라 부르지 않는다. 「今後ノ交渉ノ基礎案トシテ大要左ノ如キ案」이라고만 적었다.", "부기사 말미는 12월 7일자 「대미 각서」로 태도를 명확히 했다고 적고, 각서 본문은 「（省略）」으로 빼 놓았다."], "primary": "**[262면]**\n\n**462　선전의 조서**　쇼와 16년 12월 8일\n\n부기 一　선전에 관한 정부 성명\n부기 二　위 정부 성명 영역문\n부기 三　12월 8일 추밀원 회의 의사요록 / 미국 및 영국에 대하여 선전을 포고하는 건\n부기 四　12월 8일 외무성 공표 / 일미교섭 경과\n부기 五　위 공표 영역문\n\n**조　서**\n\n천우(天佑)를 보유하고 만세일계의 황조(皇祚)를 밟은 대일본제국 천황은 밝히 충성용무한 너희 유중(有衆)에게 보인다.\n\n짐은 이에 미국 및 영국에 대하여 전(戰)을 선(宣)한다. 짐의 육해 장병은 전력을 떨쳐 교전에 종사하고, 짐의 백료유사(百僚有司)는 여정(勵精)하여 직무를 봉행하며, 짐의 중서(衆庶)는 각각 그 본분을 다하여, 억조(億兆) 일심으로 국가의 총력을 들어 정전(征戰)의 목적을 달성함에 유산(遺算) 없기를 기하라.\n\n무릇 동아의 안정을 확보하고 그로써 세계의 평화에 기여함은 비현(丕顯)하신 황조고(皇祖考)와 비승(丕承)하신 황고(皇考)께서 지어 서술하신 원유(遠猷)로서 짐이 권권(拳々)히 놓지 아니하는 바이며, 그리하여 열국과의 교의를 두터이 하고 만방 공영의 낙을 함께함은 이 또한 제국이 항상 국교의 요의(要義)로 삼는 바이다.\n\n**[263면]** 이제 불행히도 미영 양국과 흔단(釁端)을 열기에 이른 것은 진실로 부득이한 바가 있으니, 어찌 짐의 뜻이겠는가. 중화민국 정부는 앞서 제국의 진의를 이해하지 못하고 함부로 일을 꾸며 동아의 평화를 교란하여, 마침내 제국으로 하여금 간과(干戈)를 잡기에 이르게 하였고 이에 4년 남짓을 지났다. 다행히 국민정부가 갱신됨이 있어 제국은 이와 선린의 의를 맺고 서로 제휴하기에 이르렀으나, 충칭(重慶)에 잔존하는 정권은 미영의 비음(庇蔭)을 믿고 형제가 아직도 담 안에서 서로 다투기를 그치지 않는다. 미영 양국은 잔존 정권을 지원하여 동아의 화란(禍亂)을 조장하고, 평화라는 미명에 숨어 동양 제패의 비망(非望)을 마음껏 펴려 한다. 그 위에 여국(與國)을 꾀어 제국의 주변에서 무비(武備)를 증강하여 우리에게 도전하고, 다시 제국의 평화적 통상에 온갖 방해를 가하며, 마침내 경제 단교를 감행하여 제국의 생존에 중대한 위협을 가한다. 짐은 정부로 하여금 사태를 평화 속에 회복시키게 하고자 오래도록 은인(隱忍)하였으나, 저들은 조금도 교양(交讓)의 정신이 없이 헛되이 시국의 해결을 지연시키고, 그 사이에 도리어 더욱더 경제상 군사상의 위협을 증대하여 우리를 굴종시키려 한다. 이와 같이 하여 추이한다면 동아 안정에 관한 제국 적년의 노력은 모두 수포로 돌아가고 제국의 존립 또한 바야흐로 위태로움에 빠질 것이다. 일이 이미 여기에 이르렀으니 제국은 이제 자존자위를 위하여 궐연(蹶然)히 일어나 일체의 장애를 파쇄하는 것 외에 길이 없다.\n\n황조황종(皇祖皇宗)의 신령이 위에 계시다. 짐은 너희 유중의 충성용무를 믿고 의지하여, 조종(祖宗)의 유업을 회홍(恢弘)하고 속히 화근을 삼제(芟除)하여 동아 영원의 평화를 확립하고 그로써 제국의 광영을 보전할 것을 기한다.\n\n어명어새(御名御璽)\n\n쇼와 16년 12월 8일\n\n**（부기 一）**\n\n**정부 성명**\n\n삼가 선전(宣戰)의 대조(大詔)를 받들어 이에 중외(中外)에 선명한다.\n\n무릇 동아의 안정을 확보하고 세계 평화에 공헌함은 제국 부동의 국시(國是)이며, 열국과의 우의를 두터이 하여 이 국시의 완수를 도모함은 제국이 국교의 요의로 삼는 바이다. 그러한데 앞서 중화민국은 우리의 진의를 이해하지 못하고 헛되이 외력을 믿고 제국에 도전해 와 지나사변(支那事變)의 발생을 보기에 이르렀으나, 어능위(御稜威) 아래 황군(皇軍)이 향하는 곳에 적이 없어 이미 지나는 중요 지점이 모두 우리 손에 돌아왔고, 동우구안(同憂具眼)의 인사가 국민정부를 갱신하여 제국은 이와 선린의 의를 맺었으며, 우호 열국으로서 국민정부를 승인한 것이 이미 11개국의 많음에 이르렀다. 이제 충칭 정권은 오지(奧地)에 잔존하여 **[264면]** 무익한 항전을 계속하는 데 지나지 않는다. 그러나 영미 양국은 동아를 영구히 예속적 지위에 두려는 완미한 태도를 고치려 하지 않고, 온갖 방법으로 지나사변의 수결(收結)을 방해하였으며, 다시 난인(蘭印)을 사주하고 불인(佛印)을 위협하며 제국과 태국의 친교를 찢으려고 책동하지 않는 바가 없다. 그리하여 제국과 이들 남방 제방(諸邦) 사이에 공영의 관계를 증진하려는 자연적 요구를 저해함에 편안한 날이 없다. 그 모양은 마치 제국을 적시하고 제국에 대한 계획적 공격을 실시하고 있는 것과 같아, 마침내 무도하게도 경제 단교의 거사에 나오기에 이르렀다. 무릇 교전 관계에 있지 아니한 국가 사이의 경제 단교는 무력에 의한 도전에 견줄 만한 적대 행위로서, 그 자체 묵과할 수 없는 바이다. 그런데도 양국은 다시 여국을 유인하여 제국의 사방에 무력을 증강하고 제국의 존립에 중대한 위협을 가하기에 이르렀다.\n\n제국 정부는 태평양의 평화를 유지하여 전 인류에게 전화(戰禍)가 파급됨을 방지할 것을 고념(顧念)하여, 위에 서술한 바와 같이 제국의 존립과 동아의 안정에 대한 위협이 격심한 것이 있음에도 불구하고, 8개월의 오랜 기간에 걸쳐 은인자중하며 미국과의 사이에 외교 교섭을 거듭하여, 미국과 그 배후에 있는 영국 및 이들 양국에 부화(附和)하는 제방의 반성을 구하고, 제국의 생존과 권위가 허락하는 한 호양(互讓)의 정신으로써 사태의 평화적 해결에 힘써, 다할 것을 다하고 할 것을 하였다. 그러한데 미국은 헛되이 가공의 원칙을 희롱하여 동아의 명명백백한 현실을 인정하지 않고, 그 물적 세력을 믿고 제국의 참된 국력을 깨닫지 못하며, 여국과 함께 노골적으로 무력의 위협을 증대하여 그로써 제국을 굴종시킬 수 있다고 여긴다.\n\n이리하여 평화적 수단에 의하여 미국 및 그 여국에 대한 관계를 조정하고 서로 이끌어 태평양의 평화를 유지하려는 희망과 방도는 완전히 상실되었고, 동아의 안정과 제국의 존립은 바야흐로 위태로움에 빠졌다. 더구나 오늘에 이르러 저들은 우리 군에 대하여 직접 공격을 가해 왔다. 일이 이에 이르렀다. 마침내 미국 및 영국에 대하여 선전의 대조가 환발(渙發)되었다. 성지(聖旨)를 받들어 진실로 공구감격(恐懼感激)을 이기지 못한다. 우리 신민 1억은 철석의 단결로써 궐기용약하여 국가의 총력을 들어 정전(征戰)의 일에 종사하고, 그로써 동아의 화근을 영구히 삼제하여 성지에 응해 받들어야 할 때이다.\n\n생각건대 세계 만방으로 하여금 각각 그 처소를 얻게 한다는 대조는 병연(炳然)히 일성(日星)과 같다. 제국이 일만화(日滿華) 3국의 제휴에 의하여 공영의 실(實)을 거두고 나아가 동아 흥륭의 기초를 쌓으려는 방침은 본디 변할 바 없으며, 또 제국과 지향을 같이하는 독이(獨伊) 양국과 맹약하여 세계 평화의 기조를 긋고 신질서의 건설에 매 **[265면]** 진하려는 결의는 더욱더 뇌고(牢固)한 바가 있다. 그리하여 이번에 제국이 남방 여러 지역에 대하여 새로이 행동을 일으키는 것이 부득이함에 이르렀으나, 결코 그 주민에 대하여 적의를 가지는 것이 아니다. 다만 영미의 폭정을 배제하여 동아를 명랑본연(明朗本然)의 모습으로 되돌리고, 서로 이끌어 공영의 낙을 나누고자 기념(冀念)하는 것에 지나지 않는다. 제국은 이들 주민이 우리의 진의를 양해하고 제국과 함께 동아의 신천지에서 새로운 발족을 기할 것임을 믿어 의심치 않는다.\n\n이제 황국의 융체(隆替)와 동아의 흥폐(興廢)는 이 한 번의 거사에 걸려 있다. 전 국민은 이번 정전의 연원과 사명에 깊이 생각을 이르게 하여, 진실로 교만함 없이 또 게으름 없이, 능히 다하고 능히 견디어, 그로써 우리 조상의 유풍을 현창하고, 난관을 만나면 반드시 국가 흥륭의 기초를 열었던 우리 조상의 혁혁한 사적(史績)을 우러러, 웅혼심원한 황모(皇謨)의 익찬(翼贊)에 만에 하나의 유감도 없기를 맹세하며, 나아가 정전의 목적을 완수하여 그로써 성려(聖慮)를 영원히 편안케 해 드릴 것을 기하지 않으면 안 된다.\n\n**（부기 二）**\n\n（원문이 영문이다. 부기 一 정부 성명의 공식 영역문이므로 영문 그대로 둔다.）\n\nStatement by the Imperial Japanese Government, December 8th, 1941.\n\n**[266면]**　**[267면]**　**[268면]** （영문 전문은 원문 항목 `ja` 에 실었다.）\n\n**（부기 三）**\n\n**12월 8일 추밀원 회의 의사요록 （마쓰모토 조약국장 수기）**\n\n**서　언**\n\n쇼와 13년(1938) 12월 추밀원 관제(官制) 개정 때 결정된 내규 가운데에는, 동 관제 제6조 제11호의 사항 중에는 「선전(宣戰)의 포고」를 포함한다고 되어 있는바, 이는 전쟁의 의사 결정을 자순(諮詢)하시는 것인지, 단지 선전을 포고해야 할 것인지 여부를 자순하시는 것인지 분명하지 아니하나, 미국 및 영국에 대하여 선전할 때에는 전쟁의 의사 결정은 이미 쇼와 16년 12월 1일의 어전회의 결과로서 행하여졌으므로, 추밀원에는 「미국 및 영국에 대하여 선전을 포고한다」라고 하는 상주안(上奏案)을 자순하시게 되었고, 선전의 조서안(詔書案)은 참고로서 상주안에 첨부되었다.（상주안 및 조서안은 내각에서 기안）\n\n◎ 심사위원회\n\n12월 8일 오전 7시 40분 궁중 히가시산노마(東三ノ間)\n\n출석자　전 고문관, 전 국무대신（도고(東郷茂徳) 외무대신은 미·영 대사와 회견하기 위하여 지참(遲參)함）\n\n모리야마(森山) 법제국장관\n\n외무성　야마모토(山本) 「아메리카」국장\n\n사카모토(阪本) 구아국장,\n\n마쓰모토(松本) 조약국장\n\n**[269면]**\n\n육군성　무토(武藤) 군무국장\n\n해군성　오카(岡) 군무국장\n\n먼저 해군대신으로부터 오늘 아침 이래 「말레이」 방면·홍콩 방면·「하와이」 방면에 있어서의 미·영군과의 교전 상황에 관하여 보고가 있었다.\n\n하라(原) 의장＝부의장을 위원장으로 하고 전 고문관을 위원으로 하는 심사위원회를 즉시 개최하여 심의를 촉진할 것을 희망함.\n\n도조(東條英機) 총리대신＝선전포고의 이유를 설명함.\n\n스가와라(菅原)·후카이(深井) 두 고문관으로부터 전비(戰費)의 지변(支辨), 물자의 관계 등에 관하여 질문이 있었고, 대장대신·총리대신으로부터 답변이 있었다.\n\n후타가미(二上) 고문관＝본건 자순은 「선전포고를 하여도 좋은가 어떤가」라고 하는 하문(下問)이신가, 즉 전쟁 개시에 관하여서는 이미 칙재(勅裁)가 있었던 것인가.\n\n총리대신＝그러하다.\n\n（도고 외무대신 출석함）\n\n후타가미·이케다(池田) 두 고문관으로부터, 참고로 첨부된 조서 안문(案文) 중 「미국(米国)」이라 함은 미주(米州)를 가리키는 것이라는 오해를 준다 하여 수정 의견이 나왔으나, 총리 및 조약국장으로부터 그러한 오해가 생길 리 없음을 변명하였다.\n\n마지막으로 도고 외무대신으로부터 개전에 이르기까지의 외교 경과에 관하여 보고가 있었다.\n\n원안 만장일치로 가결되었다.\n\n◎ 본회의\n\n같은 날 오전 10시 궁중 히가시타마리노마(東溜間)\n\n천황 폐하 친림(親臨).\n\n이시이(石井) 고문관＝선전포고의 시기는 언제인가, 미·영에 책임을 전가당하지 않도록 주의할 필요가 있다.\n\n총리대신＝즉각 포고하는 것이 바람직하다.\n\n구보타(窪田) 고문관＝전투 행위는 이미 시작된 듯한데 대본영과의 관계는 어떠한가.\n\n총리대신＝12월 1일의 어전회의에서 영·미·란(蘭)에 대하여 개전하기로 결정하였다.\n\n시미즈(清水) 고문관＝「타이」국의 태도는 어떠한가.\n\n총리대신＝아직 불명이나 공동방위의 방침으로 교섭 중이다.\n\n시미즈 고문관＝란(蘭)에 대하여는 선전하지 않는가.\n\n총리대신＝란에 대하여는 작전의 편의상 선전하지 않는다.\n\n미나미(南) 고문관＝독일의 태도는 어떠한가.\n\n총리대신＝대체로 참전할 모양이며 목하 교섭 중이다.\n\n나라(奈良) 고문관＝「소(ソ)」련의 태도는 어떠한가.\n\n**[270면]**\n\n총리대신＝「소」련의 태도는 신중하다.\n\n출석자　심사위원회와 같음.\n\n스즈키(鈴木) 위원장의 심사 보고가 있었고 만장일치로 가결되었다.\n\n**（부기 四）**\n\n**일미교섭 경과**\n\n一、일미 간의 교섭은 올해 봄 무렵부터 워싱턴（華盛頓）에서 개시되어, 4월 중순 미국 정부로부터 비공식 시안(試案)의 제시가 있었는바, 그 제안의 내용은 （一）양국이 품고 있는 국제 관념 및 국가 관념 （二）구주(歐洲) 전쟁에 대한 태도 （三）지나사변에 대한 태도 （四）일미 양국 간의 통상 （五）태평양 지역에 있어서의 경제 활동 （六）태평양 지역의 정치적 안정 （七）필리핀（比律賓） 중립화 등의 항목을 포함하여, 이를 태평양 전반의 문제에 관한 일반적 협정의 기초로 삼으려 한 것이다. 본안에는 일본 정부로서 수락할 수 없는 여러 점이 있었다. 동 안 가운데 미국 정부는 일독이 삼국동맹조약에 관하여는 미국이 자위(自衛)에 이름을 빌려 구주 전쟁에 참입(參入)하는 경우 제국이 태평양 방면에서 미국의 안전을 위협하지 않을 것에 관하여 보장을 구하였고, 또 지나사변에 관하여는 미국이 용인하는 기초 조건으로써 일지(日支) 화평을 중개하려 하였다. 이에 제국 정부는 5월 중순, 삼국조약에 관하여는 우리의 군사원조 의무는 동 조약 규정의 경우에 발동하는 뜻을 명확히 하고, 또 지나사변에 관하여는 미국이 고노에(近衛) 3원칙, 일지기본조약 및 일만화 공동선언을 양해하고 우리의 선린우호 정책을 신뢰하여 충칭에 대하여 화평을 권고할 것이며, 충칭이 그 권고에 청종(聽從)하지 않으면 충칭 원조 중지를 신입(申入)해 주기 바란다는 뜻을 요구하는 등의 수정을 가한 대안(對案)을 제출하여 교섭을 거듭하였던바, 6월 하순 미국 정부로부터 앞의 4월안에 비하여 미국의 주장을 더욱 구체적으로 만든 수정안의 제시가 있었고, 이후 교섭은 그 안을 둘러싸고 계속되었다.\n\n二、그러한데 7월 제3차 고노에 내각 설립 후 얼마 되지 않아, 제국이 프랑스와의 사이에 체결한 의정서에 기하여 불령인도지나 공동방위의 조치를 강구하자 미국은 제국에 대하여 자산 동결을 행하여 경제적 압박을 가해 왔다. 그러나 제국은 여전히 평화 해결의 희망에 재촉되어, 8월 고노에 수상으로부터 「루스벨트（ルーズヴェルト）」 대통령에 대하여 「메시지（メッセーヂ）」로써 제국 정부의 평화적 의도를 개진함과 함께, 위국(危局) 구제를 위하여는 한시라도 빨리 양국 수뇌자 회합이 필요한 까닭을 알려 보냈다. 이에 대하여 미국은 주의(主義)상 찬의를 표하였으나, 교섭 중인 현안 특히 삼국조약 문제, 재지(在支) 일본 군대 주류 문제 및 국제 통상 무차별 대우 문제에 관하여 먼저 합의가 성 **[271면]** 립하지 아니하면 이를 실행에 옮기기 어렵다는 태도를 고집하고, 또한 앞의 6월안을 고수하여 양보하지 않았다. 이에 따라 우리 쪽은 9월 6일 국면 타개안을 제시하고, 이어 같은 달 25일에 이르러 이들 우리 쪽의 주장에 앞의 미국 측 6월안을 참작한 신안(新案)을 제출하여 교섭을 거듭하였는바, 10월 2일 미국은 일찍부터 그 국제 관계의 기준으로서 고수해 온 4원칙 즉 （一）일체 국가의 영토 보전 주권 존중 （二）타국의 내정 불간섭 （三）통상상의 무차별 대우 및 （四）평화 수단에 의하는 외에는 태평양에 있어서의 현상을 변경하지 않는다는 여러 원칙의 적용에 관한 제국의 의도, 아울러 앞의 세 문제에 관한 제국 정부의 견해를 더욱 명시할 것을 요구하였고, 교섭은 이 때문에 난관에 봉착하기에 이르러 마침내 정돈(停頓)된 채 10월 중순 제3차 고노에 내각은 괘관(掛冠)하였다.\n\n이와 같이 양국의 견해 대립을 초래한 까닭은, 미국이 국제 관계 처리에 관하여 독선적 견해에 입각한 가공의 원칙적 이념을 강경히 고집하고 동아의 실정을 돌아보지 않은 채 이를 그대로 지나 기타에 적용할 것을 주장하고 있는 데 기인하는 것으로서, 미국이 이 태도를 고수하는 한 본 교섭의 타결은 극히 곤란한 상황에 있었다.\n\n三、현 내각에서는 태평양의 평화를 고념하기 위하여 교섭을 계속하기로 정하고, 공정한 기초 위에서 타결을 도모하려는 견지에서 당시 교섭의 주요 문제였던 세 사항에 관하여, （一）삼국조약에 관련되는 자위권 문제에 관하여는 미국에서 자위권의 관념을 함부로 확대하지 않는다는 뜻을 명확히 할 것을 요구하고, （二）통상상의 무차별 대우 원칙에 관하여는 그 원칙이 전 세계에 적용된다면 그것이 지나를 포함한 전 태평양 지역에 적용되는 것에 이의 없다고 하며, （三）철병 문제에 관하여는 지나사변 때문에 지나에 파견된 일본 군대의 일부는 일지 간 평화 성립 후 일정 지역에 소요 기간 주둔할 것이며, 나머지 군대는 평화 성립과 동시에 일지 간 협정에 따라 철거를 개시하여 치안 확립과 함께 철거할 것이고, 또 불인에 파견되어 있는 군대는 지나사변이 해결되거나 또는 공정한 동아의 평화가 확립되면 곧 이를 철거한다는 안(案)을 얻어, 이 안에 의하여 교섭을 속행하였다. 그 사이 정부는 일미교섭 성립 때에는 관계 사항에 관하여 영국 기타 여러 나라와도 동시에 양해가 성립하도록 미국 측에서 알선할 것을 요망하고, 또한 본건 교섭에 만전의 노력을 기울이기 위하여 구루스(来栖三郎) 대사를 미국에 급파하여 노무라(野村吉三郎) 대사를 원조하게 하였다.\n\n그러한데 미국 측은 일미협정이 성립하면 제국은 삼국조약을 보지(保持) **[272면]** 할 필요가 없을 것이고 그것은 소멸 혹은 사문(死文)이 되기를 요망한다는 뜻을 반복 역설하였으며, 통상 무차별 원칙은 무조건 지나에 적용할 것을 주장하고, 열국 공동 아래 지나의 경제 협동 개발을 행할 것 등을 포함하는 경제 정책에 관한 일미 공동선언안을 제출하였다. 이에 제국 정부는 이에 대하여, 통상 무차별 원칙에 관하여는 제국은 동 원칙이 전 세계에 적용되기를 희망하며 그 희망의 실현에 순응하여 지나에 대하여도 동 원칙의 적용을 승인한다는 취지를 답함과 함께, 그 공동선언안에 관하여는 지나 공동 개발 제안은 지나 국제 관리의 단서가 될 우려가 있으므로 수락하기 어렵다는 것을 말하고 미국 측에 철회를 구하였다.\n\n四、11월 17일 이래 노무라 대사는 구루스 대사와 함께 대통령 및 국무장관과 회견을 거듭하여 교섭의 급속한 타결이 필요함을 역설하였던바, 대통령은 지나 문제에 관하여는 일지 간 화평의 「소개자(紹介者)」가 될 용의가 있다고 말하였고, 또 국무장관은 제국이 독일과 제휴하고 있는 한 일미교섭은 지극히 어려우므로 먼저 이 근본적 곤란을 제거할 필요가 있다는 뜻을 강조하여, 두세 차례에 걸쳐 논의를 거듭하였다. 그러나 난관은 여전히 삼국조약, 국제 통상 무차별 대우 문제 및 지나 문제에 있음이 명백해졌으므로, 제국 정부는 양국 국교의 파탄을 회피하기 위하여 최선의 노력을 다하려는 고려에 기하여, 추요(樞要)하고 긴급한 문제에 관하여 공정한 타결을 도모하고자 11월 20일 다음의 신제안을 제출하였다.\n\n（一）、일미 양국 정부는 어느 쪽도 불인 이외의 남동아세아 및 남태평양 지역에 무력적 진출을 행하지 아니할 것을 확약한다.\n\n（二）、일미 양국 정부는 난령인도(蘭領印度)에서 그 필요로 하는 물자의 획득이 보장되도록 상호 협력하는 것으로 한다.\n\n（三）、일미 양국 정부는 상호 통상 관계를 자산 동결 전의 상태로 복귀시켜야 한다.\n\n미국 정부는 소요의 석유의 대일 공급을 약속한다.\n\n（四）、미국 정부는 일지 양국의 화평에 관한 노력에 지장을 주는 것과 같은 행동에 나오지 아니한다.\n\n（五）、일본국 정부는 일지 간 화평이 성립하거나 또는 태평양 지역에 있어서 공정한 평화가 확립되는 때에는 현재 불령인도지나에 파견되어 있는 일본 군대를 철퇴시킬 뜻을 약속한다.\n\n일본국 정부는 본 양해가 성립하면 현재 남부 불령인도지나에 주둔 중인 일본군을 이를 북부 불령인도지나로 이주(移駐)시킬 용의가 있음을 천명한다.\n\n이에 대하여 국무장관은, 제국이 삼국조약과의 관계를 명확히 하고 평화 정책 채용을 확언하지 아니하면 위 제4항을 수락하여 원장(援蔣) 행위를 정지하는 것은 불가능하다고 말하고, 또 대통령의 이른바 **[273면]** 일지 간 화평의 「소개자」가 되겠다는 제안도 일본의 평화 정책 채용을 전제로 하는 것이라는 뜻을 말하며 제4항에 관하여 큰 난색을 보였다. 그러므로 우리 쪽은 양 대사로 하여금 국무장관에 대하여, 대통령의 소개에 의하여 일지 직접 교섭이 개시되는 경우 화평의 소개자인 미국이 여전히 원장 행위를 계속하려는 것은 평화 성립을 방해하는 것으로서 그 태도에 모순이 있음을 지적하고 미국 정부의 반성을 요청하게 하였다.\n\n五、그러한데 그 사이 미국 정부는 영(英)·호(豪)·란(蘭) 및 충칭 대표와 협의하는 바가 있어, 11월 22일 국무장관은 양 대사에 대하여 남부 불인으로부터의 철병만으로는 남태평양 방면의 급박한 정세를 완화하기에 부족하다는 뜻, 아울러 대통령의 이른바 일지 간의 소개는 시기가 아직 무르익지 않았다고 생각한다는 뜻을 말하였다.\n\n미국 정부는 그 후에도 앞의 여러 대표와 협의를 거듭하고 있었는바, 26일 국무장관은 양 대사에 대하여, 20일의 우리 제안에 관하여는 신중히 연구를 가하고 관계국과도 협의하였으나 유감스럽게도 동의하기 어렵다면서, 금후 교섭의 기초안으로서 대요 다음과 같은 안을 제출하였다. 즉\n\n一、일미 상호 간에 실제로 적용해야 할 근본적 원칙으로서, 정치 관계에 있어서는 앞서 말한 4원칙을 다시 서술하였으나 다만 그중 제4점을 분쟁의 방지 및 평화적 해결, 아울러 평화적 방법 및 수속에 의한 국제 정세 개선을 위한 국제 협력 및 국제 조정 준거의 원칙으로 고치고, 경제 관계에 있어서는 주로 앞의 정치적 원칙의 제3 통상상의 기회 균등 및 평등 대우의 원칙을 부연하고,\n\n一、일미 양국 정부가 취해야 할 조치로서\n\n（イ）일미 양국 정부는 영(英)·란(蘭)·지(支)·소(蘇)·태(泰)와 함께 다변적 불가침조약의 체결에 힘쓴다.\n\n（ロ）일미 양국 정부는 일·미·영·지·란·태국 정부 사이에, 불인의 영토 주권을 존중하고 불인의 영토 주권이 위협받는 경우 필요한 조치에 관하여 즉시 협의해야 할 협정의 체결에 힘쓴다.\n\n위 협정 체결국은 불인에 있어서의 무역 및 경제 관계에서 특혜 대우를 배제하고 평등의 원칙 확보에 힘쓴다.\n\n（ハ）일본 정부는 지나 및 불인으로부터 일체의 군대（육·해·공 및 경찰）를 철수하여야 한다.\n\n（ニ）양국 정부는 충칭 정부를 제외한 어떠한 정권도 군사적·정치적·경제적으로 지지하지 아니한다.\n\n（ホ）양국 정부는 지나에 있어서의 치외법권（조계 및 단비(團匪) **[274면]** 의정서에 기한 권리를 포함）을 포기하고 타국에도 같은 조치를 종용하여야 한다.\n\n（ヘ）양국 정부는 호혜적 최혜국 대우 및 통상 장벽 저감의 주의에 기한 통상조약 체결을 상의하여야 한다.（생사(生糸)는 자유 품목에 둔다）\n\n（ト）양국 정부는 상호 자산 동결령을 폐지한다.\n\n（チ）엔·달러（円弗） 환(換) 안정에 관하여 협정하고 양국이 각각 반액씩 자금을 공급한다.\n\n（リ）양국 정부는 제3국과 체결하고 있는 어떠한 협정도 본 협정의 근본 목적 즉 태평양 전 지역의 평화 확보에 모순되는 것과 같이 해석되지 아니할 것에 관하여 동의한다.\n\n（ヌ）이상의 여러 원칙을 타국에도 종용할 것.\n\n을 제안하였다.\n\n이에 관하여 양 대사는 그 부당함을 지적하고 강경한 응수를 하였으나, 국무장관은 양보의 빛을 보이지 않았다. 넘어서 27일 대통령은 양 대사에 대하여, 지금도 일미교섭의 타결을 희망하지 않는 것은 아니나 잠정적 방법에 의하여 국면 타개를 꾀하는 것은 양국의 근본 주의 방침이 일치하지 아니하는 한 결국 무효라고 생각한다는 뜻을 말하였다. 이에 제국 정부는 미국에 대하여, 11월 20일의 우리 쪽 제안은 가장 공정한 기초 위에서 종래의 피아(彼我) 주장을 충분히 고려한 뒤 작성된 것임에도 불구하고 미국이 이에 동의할 수 없다고 하며 동아의 현실을 무시한 신안을 제출하고, 특히 지나 문제에 관하여 그 태도를 표변시킨 것은 미국의 성의를 의심케 하는 것이므로 미국 측에서 반성할 것을 요구하였다. 그러나 국무장관은 종래의 태도를 고집할 뿐 교섭의 본질적 문제에 관하여 더 상의를 진행하려는 기색이 없었다. 넘어서 12월 2일에 이르러 「웰스（ウェルズ）」 차관은 대통령의 명이라면서, 정보에 의하면 최근 불인 방면에서 일본 군대의 이동 증강이 행하여지고 있다며 이에 관한 제국의 진의를 조회해 왔다. 이에 제국 정부는, 그것은 최근 불인과 지나의 국경 부근에서 지나군이 자주 준동하고 있음에 비추어 이에 대비하기 위하여 북부 불인에서 일부 병력의 증강을 행한 것인바, 이와 관련하여 자연히 남부에서도 부대의 이동이 행하여진 것이라는 뜻을 회답하였다. 그러나 그 사이 미국 정부는 대일 포위진을 급속히 증강함과 함께 여론을 지도하여 교섭 결렬의 경우에 대비한 터다지기를 하기에 이르렀다.\n\n六、따라서 앞의 미국 제안에 대하여 제국 정부는 12월 7일자로 별첨 「대미 각서」（생략）로써 그 태도를 명확히 하였다.\n\n**[275면]**\n\n**（부기 五）**\n\n（원문이 영문이다. 부기 四 「일미교섭 경과」의 공식 영역문이므로 영문 그대로 둔다. 전문은 원문 항목 `ja` 에 실었다. 275면부터 285면까지이다.）\n\nSUMMARY OF THE JAPANESE-AMERICAN NEGOTIATIONS.（December 8th, 1941.）", "secondary": "[262면]\n462\n昭和16年12月8日\n宣戦の詔書\n付記一　宣戦に関する政府声明\n　　二　右政府声明英訳文\n　　三　一二月八日枢密院会議議事要録\n　　　　米国および英国に対し宣戦布告の件\n　　四　一二月八日外務省公表\n　　　　日米交渉経過\n　　五　右公表英訳文\n\n詔　書\n天佑ヲ保有シ万世一系ノ皇祚ヲ践メル大日本帝国天皇ハ昭ニ忠誠勇武ナル汝有衆ニ示ス\n朕茲ニ米国及英国ニ対シテ戦ヲ宣ス朕カ陸海将兵ハ全力ヲ奮テ交戦ニ従事シ朕カ百僚有司ハ励精職務ヲ奉行シ朕カ衆庶ハ各々其ノ本分ヲ尽シ億兆一心国家ノ総力ヲ挙ケテ征戦ノ目的ヲ達成スルニ遺算ナカラムコトヲ期セヨ\n抑々東亜ノ安定ヲ確保シ以テ世界ノ平和ニ寄与スルハ丕顕ナル皇祖考丕承ナル皇考ノ作述セル遠猷ニシテ朕カ拳々措[263면]カサル所而シテ列国トノ交誼ヲ篤クシ万邦共栄ノ楽ヲ偕ニスルハ之亦帝国カ常ニ国交ノ要義ト為ス所ナリ今ヤ不幸ニシテ米英両国ト釁端ヲ開クニ至ル洵ニ已ムヲ得サルモノアリ豈朕カ志ナラムヤ中華民国政府曩ニ帝国ノ真意ヲ解セス濫ニ事ヲ構ヘテ東亜ノ平和ヲ攪乱シ遂ニ帝国ヲシテ干戈ヲ執ルニ至ラシメ茲ニ四年有余ヲ経タリ幸ニ国民政府更新スルアリ帝国ハ之ト善隣ノ誼ヲ結ヒ相提携スルニ至レルモ重慶ニ残存スル政権ハ米英ノ庇蔭ヲ恃ミテ兄弟尚未タ牆ニ相鬩クヲ悛メス米英両国ハ残存政権ヲ支援シテ東亜ノ禍乱ヲ助長シ平和ノ美名ニ匿レテ東洋制覇ノ非望ヲ逞ウセムトス剰へ与国ヲ誘ヒ帝国ノ周辺ニ於テ武備ヲ増強シテ我ニ挑戦シ更ニ帝国ノ平和的通商ニ有ラユル妨害ヲ与へ遂ニ経済断交ヲ敢テシ帝国ノ生存ニ重大ナル脅威ヲ加フ朕ハ政府ヲシテ事態ヲ平和ノ裡ニ回復セシメムトシ隠忍久シキニ彌リタルモ彼ハ毫モ交譲ノ精神ナク徒ニ時局ノ解決ヲ遷延セシメテ此ノ間却ツテ益々経済上軍事上ノ脅威ヲ増大シ以テ我ヲ屈従セシメムトス斯ノ如クニシテ推移セムカ東亜安定ニ関スル帝国積年ノ努力ハ悉ク水泡ニ帰シ帝国ノ存立亦正ニ危殆ニ瀕セリ事既ニ此ニ至ル帝国ハ今ヤ自存自衛ノ為蹶然起ツテ一切ノ障礙ヲ破砕スルノ外ナキナリ\n皇祖皇宗ノ神霊上ニ在リ朕ハ汝有衆ノ忠誠勇武ニ信倚シ祖宗ノ遺業ヲ恢弘シ速ニ禍根ヲ芟除シテ東亜永遠ノ平和ヲ確立シ以テ帝国ノ光栄ヲ保全セムコトヲ期ス\n御名御璽\n昭和十六年十二月八日\n\n（付記一）\n政府声明\n恭シク宣戦ノ大詔ヲ奉戴シ茲ニ中外ニ宣明ス。\n抑々東亜ノ安定ヲ確保シ、世界平和ニ貢献スルハ、帝国不動ノ国是ニシテ、列国トノ友誼ヲ敦クシ、此ノ国是ノ完遂ヲ図ルハ、帝国ガ以テ国交ノ要義ト為ス所ナリ。然ルニ、曩ニ中華民国ハ、我真意ヲ解セズ、徒ラニ外力ヲ恃ンデ、帝国ニ挑戦シ来リ、支那事変ノ発生ヲ見ルニ至リタルガ、御稜威ノ下、皇軍ノ向フ所敵ナク、既ニ支那ハ、重要地点悉ク我手ニ帰シ、同憂具眼ノ士国民政府ヲ更新シテ帝国ハ之ト善隣ノ誼ヲ結ビ、友好列国ノ国民政府ヲ承認スルモノ已ニ十一ケ国ノ多キニ及ビ、今ヤ重慶政権ハ、奥地ニ残存[264면]シテ無益ノ抗戦ヲ続クルニ過ギズ。然レドモ英米両国ハ東亜ヲ永久ニ隷属的地位ニ置カントスル頑迷ナル態度ヲ改ムルヲ欲セズ、百方支那事変ノ収結ヲ妨碍シ、更ニ蘭印ヲ使嗾シ、仏印ヲ脅威シ、帝国ト泰国トノ親交ヲ裂カムガ為、策動至ラザルナシ。仍チ帝国ト之等南方諸邦トノ間ニ共栄ノ関係ヲ増進セムトスル自然的要求ヲ阻害スルニ寧日ナシ。其ノ状恰モ帝国ヲ敵視シ帝国ニ対スル計画的攻撃ヲ実施シツツアルモノノ如ク、遂ニ無道ニモ、経済断交ノ挙ニ出ヅルニ至レリ。凡ソ交戦関係ニ在ラザル国家間ニ於ケル経済断交ハ、武力ニ依ル挑戦ニ比ス可キ敵対行為ニシテ、ソレ自体黙過シ得ザル所トス。然モ両国ハ更ニ与国ヲ誘引シテ帝国ノ四辺ニ武力ヲ増強シ、帝国ノ存立ニ重大ナル脅威ヲ加フルニ至レリ。\n帝国政府ハ、太平洋ノ平和ヲ維持シ、以テ全人類ニ戦禍ノ波及スルヲ防止セムコトヲ顧念シ、叙上ノ如ク帝国ノ存立ト東亜ノ安定トニ対スル脅威ノ激甚ナルモノアルニ拘ラズ、隠忍自重八ケ月ノ久シニ亘リ、米国トノ間ニ外交交渉ヲ重ネ、米国ト其ノ背後ニ在ル英国並ニ此等両国ニ付和スル諸邦ノ反省ヲ求メ、帝国ノ生存ト権威トノ許ス限リ、互譲ノ精神ヲ以テ事態ノ平和的解決ニ努メ、尽ス可キヲ尽シ、為ス可キヲ為シタリ。然ルニ米国ハ、徒ラニ架空ノ原則ヲ弄シテ東亜ノ明々白々タル現実ヲ認メズ、其ノ物的勢力ヲ恃ミテ帝国ノ真ノ国力ヲ悟ラズ、与国ト共ニ露ハニ武力ノ脅威ヲ増大シ、以テ帝国ヲ屈従シ得ベシトナス。\n斯クテ平和的手段ニ依リ、米国並ニ其ノ与国ニ対スル関係ヲ調整シ、相携ヘテ太平洋ノ平和ヲ維持セムトスル希望ト方途トハ全ク失ハレ、東亜ノ安定ト帝国ノ存立トハ方ニ危殆ニ瀕セリ。更ニ今日ニ至ツテ、彼ハ我軍ニ対シテ、直接攻撃ヲ加へ来レリ。事茲ニ至ル。遂ニ米国及英国ニ対シ宣戦ノ大詔ハ渙発セラレタリ。聖旨ヲ奉体シテ洵ニ恐懼感激ニ堪エズ。我等臣民一億鉄石ノ団結ヲ以テ蹶起勇躍シ、国家ノ総力ヲ挙ゲテ征戦ノ事ニ従ヒ、以テ東亜ノ禍根ヲ永久ニ芟除シ聖旨ニ応へ奉ルベキノ秋ナリ。\n惟フニ世界万邦ヲシテ各々其ノ処ヲ得シムルノ大詔ハ、炳トシテ日星ノ如シ。帝国ガ日満華三国ノ提携ニ依リ、共栄ノ実ヲ挙ゲ、進ンデ東亜興隆ノ基礎ヲ築カムトスルノ方針ハ、固ヨリ渝ル所ナク、又帝国ト志向ヲ同ジウスル独伊両国ト盟約シテ、世界平和ノ基調ヲ画シ、新秩序ノ建設ニ邁[265면]進スルノ決意ハ、益々牢固タルモノアリ。而シテ、今次帝国ガ南方諸地域ニ対シ、新ニ行動ヲ起スノ已ムヲ得ザルニ至ル、何等其ノ住民ニ対シ敵意ヲ有スルモノニアラズ。只英米ノ暴政ヲ排除シテ東亜ヲ明朗本然ノ姿ニ復シ、相携ヘテ共栄ノ楽ヲ頒タント冀念スルニ外ナラズ。帝国ハ之等住民ガ、我ガ真意ヲ諒解シ、帝国ト共ニ、東亜ノ新天地ニ新ナル発足ヲ期スベキヲ信ジテ疑ハザルモノナリ。\n今ヤ皇国ノ隆替、東亜ノ興廃ハ此ノ一挙ニ懸レリ。全国民ハ今次征戦ノ淵源ト使命トニ深ク思ヲ致シ、苟モ驕ルコトナク、又怠ルコトナク、克ク竭シ克ク耐へ、以テ我等祖先ノ遺風ヲ顕彰シ、難関ニ逢フヤ必ズ国家興隆ノ基ヲ啓キシ我等祖先ノ赫々タル史績ヲ仰ギ、雄渾深遠ナル皇謨ノ翼賛ニ万遺憾ナキヲ誓ヒ、進ンデ征戦ノ目的ヲ完遂シ、以テ聖慮ヲ永遠ニ安ンジ奉ラムコトヲ期セザルベカラズ。\n\n（付記二）\nStatement by the Imperial Japanese Government\nDecember 8th, 1941\nAn Imperial Rescript declaring war having been graciously granted, the Japanese Government hereby makes an announcement to all the world.\nIt is the immutable policy of Japan to insure the stability of East Asia and to contribute to the cause of world peace, while the guiding principle of its foreign policy has been to carry out the aforesaid national policy by cultivating friendship with all nations. Unfortunately, the China Affair broke out, owing to the fact that China failed to comprehend Japan's true intentions, and provoked a conflict. But under the august virtue of our sovereign, our Imperial forces proved victorious wherever they went. All important points in China have now fallen into our hands, and farsighted Chinese leaders sharing the same views with us have established a new National Government of China, with which Japan has formed the ties of neighbourly friendship, and which has already been recognized by as many as eleven friendly Powers. Today, the Chungking Government, surviving in the [266면]remote interior, can do no more than continue its futile resistance. However, the United States of America and the British Empire, unwilling to alter their senseless policy of keeping East Asia permanently in a servile position, obstructed by all means the settlement of the China Affair.\nMoreover, they instigated the Netherlands East Indies, menaced French Indo-China and resorted to all possible measures with a view to alienating Japan and Thailand. So busily engaged were these two Powers in frustrating Japan's natural aspiration to promote with these countries of the South the relationship of common prosperity, that it appeared they were about to open a planned attack upon us. Finally, they went so far as to adopt the outrageous measure of severing economic relations with Japan. Between non-belligerent Powers the rupture of economic relations constitutes a hostile action comparable to a challenge by armed force. Not content even with such an impermissible action, the two Powers, inducing other countries to follow suit, caused the increase of armed forces on all sides of Japan, creating a grave menace to our existence. Despite such menace to the existence of Japan and the stability of East Asia, the Japanese Government, anxious to preserve the peace of the Pacific and to prevent the spread of war-like disturbances to all the world, conducted patiently and prudently for eight long months diplomatic negotiations with the United States. We urged upon the United States, and Britain at its back, and also other countries under the influence of the two Powers, reconsideration of their attitude, we showed the spirit of conciliation as far as it was compatible with both the existence and prestige of our Empire, and we endeavoured toward a peaceful settlement. We tried all that could be tried, and did all that could be done. However, the American Government, toying with utopian principles, refused to recognize the plain realities of East Asia. Blinded by its material strength, [267면]it failed to see the real power of Japan. And in conjunction with its associate Powers, the American Government increased military menace in the belief that it could thereby compel Japan's submission. No longer there exists any hope or formula to maintain the peace of the Pacific in co-operation with the United States and associate Powers through the adjustment of our relations with them by peaceful means. The stability of East Asia and the existence of Japan are now in jeopardy. Even today they are directly attacking our armed forces. Such being the situation, an Imperial Rescript declaring war on the United States of America and the British Empire has been issued. The Government is filled with awe on receiving the Imperial Injunction. It is time for us, one hundred million subjects of His Majesty, to stand up resolutely with a unity of will strong as iron, and devote the nation's total strength to the prosecution of the war in order that we may eliminate forever the sources of evil in East Asia and thereby meet the august wishes of our sovereign.\nThere remains, glorious as the sun and stars, the Imperial Rescript on Japan's mission to enable all nations to have each, its proper place in the world. And immutable is our policy to realize common prosperity of Japan, China and Manchoukuo through the co-operation and collaboration of the three countries, and to lay the foundation for the rise and progress of East Asia. And firm and unshakable as ever is our national resolve that, in alliance with Germany and Italy sharing the same aspirations with Japan, we should mark a foundation for world peace and march foward toward the construction of a new order, Japan is now obliged newly to take action in the various regions of the South, but it should be stressed that we harbour no hostile intention toward the peoples of those regions. We only desire to do away with the tyranny of America and Britain and to restore East Asia to its proper and underfiled state of existence and share in the enjoyment of common prosperity with [268면]them all. We are convinced that the peoples of these regions will understand Japan's true intentions and look forward to a new beginning of life in a new East Asia.\nThe rise or fall of our Empire, and the progress or decline of East Asia, depend upon the present war. All our people, mindful of the origin and the mission of this campaign, should not act rashly nor be neglectful. But through our industry and endurance we should prove worthy of the best traditions of our forefathers. Looking up to the brilliant accomplishments of those in history who turned every crisis into an opportunity of furthering our national fortune, we should pledge ourselves to assist in the noble and far-sighted Imperial policy, and to attain the aims of the present campaign and to set thereby our sovereign's mind forever at ease.\n\n（付記三）\n十二月八日枢密院会議議事要録（松本条約局長手記）\n序　言\n昭和十三年十二月枢密院官制改正ノ際決定ノ内規中ニハ同官制第六条第十一号ノ事項中ニハ「宣戦ノ布告」ヲ含ムトアリテ、右ハ戦争ノ意思決定ヲ御諮詢相成ルモノナリヤ単ニ宣戦ヲ布告スベキヤ否ヤヲ御諮詢相成ルモノナリヤ明カナラザルガ、米国及英国ニ対シ宣戦ノ際ニハ戦争ノ意思決定ハ既ニ昭和十六年十二月一日ノ御前会議ノ結果トシテ行ハレ、枢密院ニハ「米国及英国ニ対シ宣戦ヲ布告ス」ト云フ上奏案ヲ御諮詢相成ルコトトナリ、宣戦ノ詔書案ハ参考トシテ上奏案ニ添付セラレタリ（上奏案及詔書案ハ内閣ニテ起案）\n◎審査委員会\n十二月八日午前七時四十分宮中東三ノ間\n出席者　全顧問官、全国務大臣（東郷外務大臣ハ米、英大使ト会見ノ為遅参ス）\n森山法制局長官\n外務省　山本「アメリカ」局長\n阪本欧亜局長、\n松本条約局長\n[269면]\n陸軍省　武藤軍務局長\n海軍省　岡　軍務局長\n最初ニ海軍大臣ヨリ今朝来「マレー」方面香港方面「ハワ
