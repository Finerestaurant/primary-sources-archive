<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>일미교섭 1941 — 열람기</title>
<style>
:root{
  --bg:#eef1f4; --panel:#f7f9fa; --edge:#ccd4da; --edge-soft:#dde4e9;
  --ink:#16202a; --ink-2:#4a5b68; --ink-3:#71828f;
  --stamp:#8c2f39;            /* 기밀등급 도장의 자주색 */
  --link:#2f5d86;
  --a:#4a7c59; --b:#8a6d3b; --c:#3f6d8c; --d:#7a4a6b; --e:#5a6f7d; --x:#8a8f94;
  --term-line:#9db0c2; --term-bg:rgba(47,93,134,.05);
  --term-line-go:#7fa3c4; --term-bg-go:rgba(47,93,134,.10);
  --term-bg-on:rgba(47,93,134,.17);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",
         -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
    --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
    --stamp:#c9707a; --link:#7fb0da;
    --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
    --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
    --term-bg-on:rgba(127,176,218,.22);
    --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
  }
}
:root[data-theme="dark"]{
  --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
  --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
  --stamp:#c9707a; --link:#7fb0da;
  --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
  --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
  --term-bg-on:rgba(127,176,218,.22);
  --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--link)}

.wrap{display:grid;grid-template-columns:minmax(300px,25%) 1fr;height:100vh}

/* 좁은 화면 — 목록을 위로 접어 올리면 본문이 설 자리가 없다.
   목록은 서랍으로 빼고 화면 전부를 문서에 준다. */
.mbar{display:none}
.scrim{display:none}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;grid-template-rows:1fr;padding-top:44px}
  .mbar{display:flex;align-items:center;gap:10px;
    position:fixed;top:0;left:0;right:0;height:44px;z-index:30;padding:0 12px;
    background:var(--panel);border-bottom:1px solid var(--edge)}
  .mbar button{background:var(--term-bg-go);border:1px solid var(--term-line-go);
    color:var(--link);border-radius:999px;padding:3px 11px;cursor:pointer;
    font:inherit;font-size:12px;font-family:var(--mono);white-space:nowrap}
  .mbar-t{font-size:12.5px;font-weight:650;color:var(--ink-2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail{position:fixed;top:0;bottom:0;left:0;z-index:40;
    width:min(88vw,340px);max-height:none;
    transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:0 0 30px rgba(0,0,0,.35)}
  body.railopen .rail{transform:none}
  .scrim{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45);border:0;padding:0}
  body.railopen .scrim{display:block}
  .toolbar{padding:7px 16px;gap:8px}
  .toolbar #themeBtn{display:none}
  .mbar-t{flex:1}
  .mbar-th{padding:3px 9px;font-size:13px}
  .seg button{padding:4px 9px;font-size:11.5px}
  .srcline{padding:10px 16px 0}
}
@media(prefers-reduced-motion:reduce){.rail{transition:none}}

/* ── 좌측 목록 ─────────────────────────────── */
.rail{border-right:1px solid var(--edge);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
.rail-head{padding:14px 14px 10px;border-bottom:1px solid var(--edge-soft);
  display:flex;flex-direction:column;gap:8px}
/* 문서철에 들어오면 나갈 길이 있어야 한다 */
.home{display:inline-flex;align-items:center;gap:5px;text-decoration:none;
  color:var(--link);font-size:11.5px;font-family:var(--mono);
  letter-spacing:.04em;width:fit-content;
  background:var(--term-bg-go);border:1px solid var(--term-line-go);
  border-radius:999px;padding:2px 10px 2px 8px}
.home:hover{background:var(--term-bg-on);border-color:var(--link)}
.home span{font-size:12px;line-height:1}
.brand{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font-weight:400;letter-spacing:0;text-transform:none;
  color:var(--ink-3);font-size:11.5px;margin-top:2px}
input[type=search]{width:100%;padding:7px 10px;border:1px solid var(--edge);
  border-radius:3px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
input[type=search]:focus,button:focus-visible,.item:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--edge);background:transparent;color:var(--ink-2);
  border-radius:999px;padding:2px 9px;font-size:11.5px;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sortbar{display:flex;gap:10px;font-size:11.5px;color:var(--ink-3);align-items:center}
.sortbar button{background:none;border:none;color:var(--ink-3);cursor:pointer;
  font:inherit;padding:0;border-bottom:1px solid transparent}
.sortbar button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.list{overflow-y:auto;flex:1;min-height:0}
.item{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--edge-soft);border-left:3px solid transparent;
  padding:9px 13px;cursor:pointer;font:inherit;color:inherit}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--bg);border-left-color:var(--ink)}
.item.tA{border-left-color:var(--a)} .item.tB{border-left-color:var(--b)}
.item.tC{border-left-color:var(--c)} .item.tD{border-left-color:var(--d)}
.item.tE{border-left-color:var(--e)} .item.tX{border-left-color:var(--x)}
.item-top{display:flex;justify-content:space-between;gap:8px;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.item-sum{font-size:12.5px;line-height:1.45;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 제목이 「국무장관이 주한대사에게」 꼴이라 무엇을 읽는 것인지 알 수 없다.
   요지 한 줄을 옅게 깔아 준다. 목록이 길어지지 않도록 두 줄에서 자른다. */
.item-hint{font-size:11.5px;line-height:1.4;margin-top:3px;color:var(--ink-3);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── 우측 본문 ─────────────────────────────── */
.main{overflow-y:auto;min-height:0}
.toolbar{position:sticky;top:0;z-index:5;background:var(--panel);
  border-bottom:1px solid var(--edge);padding:8px 26px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px}
.toolbar .grow{flex:1}
.seg{display:flex;border:1px solid var(--edge);border-radius:3px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 11px;cursor:pointer;
  font:inherit;font-size:12px;color:var(--ink-2);border-right:1px solid var(--edge)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.srcline{padding:10px 26px 0;font-size:11px;color:var(--ink-3);line-height:1.5}

/* ── 연대 바 ───────────────────────────────
   5년 반을 한 줄에 욱여넣으면 1945년 8월 열흘은 0.5% 밖에 안 된다. 그래서
   줄을 늘여 놓고 **띠 자체를 움직인다** — 지금 읽는 문서의 날짜가 늘 정중앙이다.
   문서를 옮기면 띠가 미끄러지고, 사건 이름은 겹치지 않게 위아래로 층을 나눈다. */
.chrono{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
  width:min(940px,calc(100vw - 48px));z-index:20;user-select:none;
  border:1px solid var(--edge);border-radius:8px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 20px rgba(0,0,0,.10);
  transition:box-shadow .2s ease}
.chrono:hover{box-shadow:0 6px 26px rgba(0,0,0,.18)}
/* 옅어지는 것은 **내용**이지 판이 아니다. 판까지 투명해지면 뒤의 본문이
   비쳐 들어와 글자가 서로를 밟는다. */
.chrono-track{opacity:.5;transition:opacity .2s ease}
.chrono:hover .chrono-track{opacity:1}

/* 띠가 지나가는 창. 손으로도 밀 수 있게 진짜 가로 스크롤을 쓴다 */
.chrono-vp{position:relative;overflow-x:auto;overflow-y:hidden;
  height:var(--chH,92px);border-radius:8px;cursor:grab;
  scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain}
.chrono-vp::-webkit-scrollbar{display:none}
.chrono-vp.drag{cursor:grabbing}
/* 안쪽 띠. 양옆 여백은 창의 절반 — 첫 문서도 마지막 문서도 가운데에 설 수 있게 */
.chrono-track{position:relative;height:100%;margin:0 var(--chPad,0px)}
/* 시간 축 — 층의 한가운데 */
.chrono-track::before{content:"";position:absolute;
  left:calc(0px - var(--chPad,0px));right:calc(0px - var(--chPad,0px));
  top:var(--axis,46px);height:1px;background:var(--edge)}

/* 연도 — 해가 바뀌는 자리에 선을 긋고, 그 선부터가 그 해다.
   이름표는 창 왼쪽에 들러붙는다. 1945년 한복판을 보고 있어도 「1945」가 남는다. */
.cy{position:absolute;top:0;bottom:0;
  border-left:1px solid color-mix(in srgb,var(--ink-3) 50%,transparent)}
.cy.alt{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.cy b{position:absolute;bottom:3px;font-family:var(--mono);font-size:11px;
  font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;
  line-height:1;letter-spacing:.06em;white-space:nowrap;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px}
/* 달·분기 눈금 — 해 안에서 어디쯤인지. 분기는 조금 길게 */
/* 1px 짜리 표는 좌표에 걸터앉혀야 한다. 왼쪽 모서리를 좌표에 맞추면 표가
   반 픽셀 오른쪽에 서서, 같은 날짜의 점과 어긋나 보인다. 아래 실·표도 같다. */
.cq{position:absolute;top:calc(var(--axis,46px) - 1.5px);width:1px;height:4px;
  margin-left:-.5px;background:var(--edge);opacity:.7}
.cq.q{top:calc(var(--axis,46px) - 2.5px);height:6px;opacity:1}
.cq[hidden]{display:none}

/* 배율 — 5년 반을 한눈에 볼 때와 8월 열흘을 벌려 볼 때가 같을 수 없다 */
.chrono-zoom{position:absolute;right:6px;top:5px;z-index:3;display:flex;gap:3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-zoom,.chrono-zoom:focus-within{opacity:1}
.chrono-zoom button{width:19px;height:19px;padding:0;line-height:1;
  font-family:var(--mono);font-size:12px;color:var(--ink-2);cursor:pointer;
  background:var(--panel);border:1px solid var(--edge);border-radius:3px}
.chrono-zoom button:hover:not(:disabled){color:var(--link);border-color:var(--link)}
.chrono-zoom button:disabled{opacity:.35;cursor:default}
.chrono-scale{position:absolute;right:6px;bottom:3px;z-index:3;
  font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.03em;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-scale{opacity:1}

/* 사건 점 — 이름에서 내려오는 실보다 위다. 실이 점 위를 지나가면
   점이 실에 꿰뚫린 것처럼 보이고, 어느 것이 사건 자리인지 흐려진다. */
.cm{position:absolute;top:calc(var(--axis,46px) - 3px);width:7px;height:7px;
  margin-left:-3.5px;border-radius:50%;background:var(--ink-3);z-index:2;
  border:1.5px solid var(--panel);cursor:help;
  transition:background .15s ease,transform .15s ease}
.cm.key{background:var(--stamp);width:9px;height:9px;margin-left:-4.5px;
  top:calc(var(--axis,46px) - 4px)}
.cm:hover{background:var(--link);transform:scale(1.45)}

/* 사건 이름 — 층(lane)을 나눠 위아래로 흩는다. 여기서 겹침이 풀린다 */
.cl{position:absolute;transform:translateX(-50%);white-space:nowrap;z-index:1;
  font-family:var(--mono);font-size:10px;line-height:1.1;color:var(--ink-2);
  letter-spacing:.01em;padding:1px 4px;border-radius:2px;cursor:help;
  background:color-mix(in srgb,var(--panel) 70%,transparent)}
.cl.key{color:var(--stamp)}
.cl:hover,.cl:focus-visible{color:var(--link);outline:0;
  background:color-mix(in srgb,var(--link) 12%,var(--panel))}
/* 이름에서 축까지 내려/올려 긋는 실 — 어느 점의 이름인지 알아보게 */
.cl::after{content:"";position:absolute;left:calc(50% - .5px);width:1px;
  background:var(--edge)}
.cl.up::after{top:100%;height:var(--leg,0px)}
.cl.dn::after{bottom:100%;height:var(--leg,0px)}

/* 지금 읽는 문서가 놓인 자리. 문서를 고르면 이 표가 창 한가운데로 온다.
   손으로 띠를 밀면 표는 제 날짜에 남는다 — 표는 시간에 박혀 있지 창에 박혀 있지 않다. */
.chrono-cursor{position:absolute;top:0;bottom:0;width:1px;z-index:3;
  margin-left:-.5px;background:var(--stamp);pointer-events:none}
/* 가상 요소는 위의 *{box-sizing:border-box}가 닿지 않는다 — 여기서 직접 잡아 주지
   않으면 테두리 2px 만큼 표시가 축 아래·오른쪽으로 밀려 앉는다. */
.chrono-cursor::before{content:"";position:absolute;box-sizing:border-box;
  left:-6px;top:calc(var(--axis,46px) - 6px);width:13px;height:13px;
  border-radius:50%;background:var(--stamp);border:2px solid var(--panel)}
/* 날짜는 맨 아래, 표 바로 밑에 — 위쪽은 사건 이름 층에 내준다 */
.chrono-date{position:absolute;bottom:2px;transform:translateX(-50%);
  font-family:var(--mono);font-size:10px;color:var(--stamp);
  font-variant-numeric:tabular-nums;background:var(--panel);
  padding:0 5px;border-radius:2px;white-space:nowrap;z-index:3}
.chrono[data-nodate="1"] .chrono-cursor,
.chrono[data-nodate="1"] .chrono-date{display:none}

/* 좁은 화면에서도 연대 바는 남긴다 — 이 화면의 절반은 「언제인가」이다.
   폭을 화면 끝까지 늘리고, 손가락으로 미는 것이 이미 되므로 줌 단추는 접는다. */
@media(max-width:900px){
  .chrono{bottom:8px;width:calc(100vw - 16px);border-radius:6px}
  .chrono-zoom{display:none}
  .chrono-track{opacity:1}
}
@media(prefers-reduced-motion:reduce){.chrono-track{transition:none}}

/* 아래쪽 여백은 떠 있는 연대 바가 마지막 문단을 덮지 않을 만큼 */
article{max-width:none;padding:26px 26px 190px}
@media(max-width:900px){article{padding:18px 16px 170px}}

/* ── 앞뒤로 넘기기 ─────────────────────────────
   목록을 다시 열지 않고도 이어 읽을 수 있어야 한다. */
.steps{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;
  margin-top:34px;padding-top:18px;border-top:1px solid var(--edge)}
.step{display:flex;flex-direction:column;gap:2px;text-align:left;
  border:1px solid var(--edge);border-radius:5px;background:transparent;
  padding:9px 12px;cursor:pointer;font:inherit;color:var(--ink-2);min-width:0}
.step.next{text-align:right;align-items:flex-end}
.step:hover{border-color:var(--link);color:var(--ink);background:var(--term-bg)}
.step-k{font-family:var(--mono);font-size:11px;color:var(--link);letter-spacing:.04em}
.step-d{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.step-t{font-size:13px;line-height:1.4;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.step.empty{display:flex;align-items:center;justify-content:center;border-style:dashed;
  color:var(--ink-3);font-size:12px;font-family:var(--mono);cursor:default}
.steps .step-n{align-self:center;font-family:var(--mono);font-size:11.5px;
  color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}

@media(max-width:900px){
  .steps{grid-template-columns:1fr;gap:8px}
  .steps .step-n{order:-1;text-align:center}
  .step.next{text-align:left;align-items:flex-start}
}
.doc-head{border-bottom:1px solid var(--edge);padding-bottom:14px;margin-bottom:18px}
h1{font-size:19px;margin:0 0 4px;line-height:1.35;text-wrap:balance;font-weight:650}
.docid{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  letter-spacing:.04em;font-variant-numeric:tabular-nums}
.stamp{display:inline-block;border:1.5px solid var(--stamp);color:var(--stamp);
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:1px 6px;
  border-radius:2px;transform:rotate(-1.2deg);margin-left:8px;vertical-align:2px}
.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:3px 20px;margin-top:10px;font-size:12.5px}
.meta div{display:flex;gap:7px}
/* 참석자 명단처럼 긴 값. 좁은 칸에 넣으면 한 글자씩 세로로 눌린다 */
.meta div.wide{grid-column:1/-1}
.meta b{color:var(--ink-3);font-weight:500;min-width:52px;font-size:11.5px}
.meta span{font-family:var(--mono);font-size:12px}
.meta span.txt{font-family:var(--sans);font-size:12.5px}

.points{margin:16px 0;padding:12px 16px;border-left:2px solid var(--edge);
  background:var(--panel);border-radius:0 3px 3px 0}
.points li{margin:3px 0}
.points ul{margin:0;padding-left:18px}

.cols{display:grid;gap:26px}
.cols.two{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.cols.two{grid-template-columns:1fr}}
.pane h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 8px;font-weight:600}
.body{white-space:pre-wrap;word-break:break-word}

xt": true}, {"k": "발신·착신", "v": "本省 11月26日発", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "電話連絡に際して使用すべき隠語について", "txt": true, "wide": true}], "summary": "정세가 급박하여 전보로는 시간이 걸리므로 앞으로 회담 상황 등은 도쿄–워싱턴 전화로 통보하도록 하고, 그때 쓸 은어표와 본성 밖 전화번호를 지시한 전보.", "points": ["정세가 나날이 급박해지고 있으나 전보는 장시간을 요하므로, 앞으로는 필요에 따라 회담 등의 상황은 간단한 것에 한하여 수시로 전화로 야마모토 아메리카국장에게 통보하라.", "그때 사용할 은어를 열거: 삼국조약 문제=ニューヨーク, 무차별대우 문제=シカゴ, 지나 문제=サンフランシスコ.", "인물 은어: 총리=伊藤君, 외무대신=伊達君, 육군=徳川君, 해군=前田君, 대통령=君子サン, ハル=梅子サン.", "사항 은어: 일미교섭=縁談, 국내정세=商売, 양보한다=山ヲ売ル, 양보하지 않는다=山ハ売レヌ, 형세 급전한다=子供カ生レル.", "본성 이외의 전화번호: 야마모토 국장(世田ケ谷四六一七), 가세 과장(四谷四七九三), 대신 관저(銀座三六一四), 차관 관저(銀座一〇二二)."], "primary": "[185면]\n정세는 날로 급박해지고 있는 바, 전보는 장시간을 요하므로, 앞으로는 필요에 응하여 회담 등의 상황은 간단한 것에 한하여 수시로 전화로써 야마모토 아메리카국장(山本亜米利加局長)에게 통보하여 주기 바라며, 그때 사용해야 할 은어는 다음과 같다.\n삼국조약 문제　ニューヨーク（뉴욕）\n무차별대우 문제　シカゴ（시카고）\n지나(支那) 문제　サンフランシスコ（샌프란시스코）\n총리　伊藤君（이토 군）\n외무대신　伊達君（다테 군）\n육군　徳川君（도쿠가와 군）\n해군　前田君（마에다 군）\n일미교섭　縁談（혼담）\n대통령　君子サン（기미코 상）\nハル（헐）　梅子サン（우메코 상）\n국내정세　商売（장사）\n양보한다　山ヲ売ル（산을 판다）\n양보하지 않는다　山ハ売レヌ（산은 팔리지 않는다）\n형세가 급전한다　子供カ生レル（아이가 태어난다）\n또한 만약을 위하여, 본성 이외의 전화번호는 야마모토 국장（世田ケ谷 四六一七）, 가세 과장（四谷 四七九三）, 대신 관저（銀座 三六一四）, 차관 관저（銀座 一〇二二）이다.", "secondary": "[185面]\n情勢ハ逐日急迫シツツアル処電報ハ長時間ヲ要スルヲ以テ今後ハ必要ニ応シ会談等ノ模様ハ簡単ナルモノニ限リ随時電話ヲ以テ山本亜米利加局長ニ御通報相成度其ノ際使用スヘキ隠語左ノ通\n三国条約問題　ニューヨーク\n無差別待遇問題　シカゴ\n支那問題　サンフランシスコ\n総理　伊藤君\n外務大臣　伊達君\n陸軍　徳川君\n海軍　前田君\n日米交渉　縁談\n大統領　君子サン\nハル　梅子サン\n国内情勢　商売\n譲歩スル　山ヲ売ル\n譲歩セス　山ハ売レヌ\n形勢急転スル　子供カ生レル\n尚為念本省以外ノ電話番号ハ山本局長（世田ケ谷四六一七）加瀬課長（四谷四七九三）大臣官邸（銀座三六一四）次官官邸（銀座一〇二二）ナリ", "notes": ["「支那」는 당대 일본 측 표기 그대로 「지나」로 옮겼다.", "「山本亜米利加局長」은 외무성 아메리카국장 야마모토 구마이치(山本熊一).", "「加瀬課長」은 외무대신 비서관 겸 가세 도시카즈(加瀬俊一).", "은어의 좌우 대응은 지면에서 「사항」 열 아래에 「은어」가 놓이는 2단 배열이다."], "warn": false, "pages": ["nichibei2_05_002"], "search": "東郷茂徳 (도고 시게노리) — 외무대신 野村吉三郎 (노무라 기치사부로) — 주미 대사 山本熊一 (야마모토 구마이치) — 외무성 아메리카국장 加瀬俊一 (가세 도시카즈) — 과장(대신 비서관) 「ハル」 (헐, Cordell Hull) — 미국 국무장관"}, {"id": "406", "order": 406, "date": "1941-11-26", "group": "A", "eyebrow": "문서 406 · 状況打開のため大統領と天皇との親電交換につき意見具申", "title": "상황 타개를 위하여 대통령과 천황의 친전 교환에 관하여 의견 구신", "list_right": "문서 406", "meta": [{"k": "일자", "v": "1941-11-26"}, {"k": "원문 표기", "v": "昭和16年11月26日"}, {"k": "전보번호", "v": "第一一八〇号"}, {"k": "발신", "v": "在米国野村大使 (노무라 주미대사)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 11月26日後発 / 本省 11月27日前着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "状況打開のため大統領と天皇との親電交換につき意見具申", "txt": true, "wide": true}], "summary": "노무라·구루스가 을안 타결의 가망이 없다고 보고하고, 루스벨트 대통령이 먼저 천황에게 전신을 보내게 하여 이에 천황의 친전으로 답하는 형태로 공기를 일신하고 시간을 벌 것, 아울러 불인·난인·타이를 포함하는 중립권 설립을 제의할 것을 건의한 전보.", "points": ["누차 보고한 대로 을안(乙案) 전부를 미국에 용인시킬 가망은 거의 없고 시일은 절박하다.", "이대로 가면 교섭 타절(打切) 외에 길이 없다고 단언한다.", "유일한 타개책으로 「로(ロ)」 대통령이 먼저 지존(천황)께 태평양 평화 유지를 위한 일미 협력의 희망을 전신케 하고, 이에 대해 천황의 친전(御親電)을 내리게 하자고 제안.", "친전 교환의 효과로 ① 공기의 일신 ② 시기(時機)의 유예를 든다.", "영미측이 난인(蘭印) 보호 점령에 나설 가능성을 들어, 일본이 선수를 쳐 불인·난인·「타이」국을 포함하는 중립권 설립을 제의하자고 건의.", "1941년 9월 루스벨트가 불인·타이 중립을 제의한 전례를 근거로 든다.", "결렬 후 대영미 충돌은 불가피하며, 독일이 삼국조약 제3조의 의무를 발동할지는 「자못 의문」이라고 적었다.", "일지사변(日支事變) 해결은 세계전 종국까지 미룰 수밖에 없게 된다고 전망.", "본 전보를 「본사(本使)로서 최후의 의견 구신」이라 부르고, 기도 내대신에게까지 보인 뒤 지급 회전할 것을 요청."], "primary": "[186면]\n제一一八〇호 (극비, 관장부호)\n노무라(野村吉三郎)·구루스(来栖三郎)로부터\n\n누차의 왕전(往電)대로 을안(乙案) 전부를 용인시킬 가망은 거의 없고, 한편 시일은 절박하여 이대로는 유감스럽게도 교섭을 타절(打切)하는 수밖에 없으니 미력함이 참괴(慙愧)를 견딜 수 없습니다. 이때에 유일한 타개책으로서는, 심히 공구(恐懼)함을 견딜 수 없사오나, 먼저 「로(ロ)」 대통령으로부터 지존(至尊)께 대하여 태평양 평화 유지를 목적으로 하는 일미 양국 협력의 희망을 전신(電信)케 하고(어내의(御内意)를 기다려 극력 교섭하겠습니다), 이에 대하여 어친전(御親電)을 앙망(仰望)하와 그로써 공기를 일신함과 동시에, 지금 조금 더 시기(時機)의 어유예(御猶予)를 얻고, 영미측이 난인(蘭印) 보호 점령에 나설 가능성도 고려하여 우리 쪽에서 선수를 쳐서 불인(仏印)·난인(蘭印)·「타이(タイ)」국을 포함하는 중립권(中立圈) 설립(금년 9월에 「로(ロ)」 대통령이 불인·「타이」국 중립을 제의한 것은 아시는 바와 같습니다)을 제의하는 것이 마땅하다고 생각합니다.\n\n이번 교섭의 결렬이 반드시 일미 개전(開戰)을 뜻하는 것은 아니라는 관측도 있을 수 있으나, 결렬 후에는 앞서 말한 바와 같이 영미측의 난인(蘭印) 진주(進駐)도 예상되어, 결국 우리 쪽의 공격에 의한 대영미 충돌은 불가피할 것이며, 이에 대하여 독일이 조약 제3조의 의무를 발동함을 수긍(肯)할지는 자못 의문이고, 또한 일지사변(日支事變)의 해결은 적어도 이번 세계전(世界戰)의 종국까지 미루어 넘기는 수밖에 없게 될 것입니다.\n\n본 전보는 혹은 본사(本使)로서 최후의 의견 구신(具申)이 될 것이므로, 적어도 기도(木戸幸一) 내대신(內大臣)께까지 보이신 뒤 지급(至急) 회신하여 주시기를, 어떻게든 회전(回電)을 간절히 바랍니다.", "secondary": "[186面]\n第一一八〇号（極秘、館長符号）\n野村来栖ヨリ\n累次往電ノ通乙案全部ヲ容認セシムル見込殆ント無ク一方時日ハ切迫此ノ儘ニテハ遺憾乍ラ交渉打切ノ外ナク微力慙愧ニ堪ヘス此ノ際唯一ノ打開策トシテハ甚タ恐懼ニ堪ヘサルモ先「ロ」大統領ヨリ至尊ニ対シ奉リ太平洋平和維持ヲ目的トスル日米両国協力ノ希望ヲ電信セシメ（御内意ヲ俟テ極力交渉ス）之ニ対シ御親電ヲ仰キ奉リ以テ空気ヲ一新スルト同時ニ今少シク時機ノ御猶予ヲ得英米側カ蘭印保護占領ニ出テ来ル可能性ヲモ考慮シ我方ヨリ先手ヲ打チ仏印、蘭印、「タイ」国ヲ包含スル中立圏設立（本年九月「ロ」大統領カ仏印、「タイ」国中立ヲ提議セルハ御承知ノ通リナリ）ヲ提議スルコト可然ト思考ス\n今回交渉ノ決裂カ必スシモ日米開戦ヲ意味セサルヤノ観測存スヘキモ決裂後ハ前述ノ如ク英米側ノ蘭印進駐モ予想セラレ結局我方ノ攻撃ニ依ル対英米衝突不可避ナルヘク右ニ対シ独逸カ条約第三条ノ義務発動ヲ肯スルヤハ頗ル疑問ニシテ且日支事変ノ解決ハ少ナクトモ今次世界戦ノ終局迄持チ越スノ外ナキニ至ルヘシ\n本電ハ或ハ本使トシテ最後ノ意見具申タルヘキニ付少クトモ木戸内大臣迄御示シノ上至急折返ヘシ何分ノ御回電切望ス", "notes": [], "warn": false, "pages": ["nichibei2_05_002", "nichibei2_05_003"], "search": "野村吉三郎 (노무라 기치사부로) — 주미대사 来栖三郎 (구루스 사부로) — 특파대사 東郷茂徳 (도고 시게노리) — 외무대신 「ロ」＝ローズヴェルト (루스벨트, Franklin D. Roosevelt) — 미국 대통령 木戸幸一 (기도 고이치) — 내대신"}, {"id": "407", "order": 407, "date": "1941-11-26", "group": "A", "eyebrow": "문서 407 · 電話連絡の時間について", "title": "전화 연락 시간에 관하여", "list_right": "문서 407", "meta": [{"k": "일자", "v": "1941-11-26"}, {"k": "원문 표기", "v": "昭和16年11月26日"}, {"k": "전보번호", "v": "第一一八一号"}, {"k": "발신", "v": "在米国野村大使 (노무라 주미대사)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 11月26日後発 / 本省 11月27日前着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "電話連絡の時間について", "txt": true, "wide": true}], "summary": "본성의 은어(隱語) 사용 훈령(제836호)에 응하면서, 일미 간 전화 연락이 가능한 시간대가 도쿄 시각으로 세 구간에 한정되어 있으므로 긴급 전보가 더 빠른 경우에는 전화를 걸지 않기로 하겠다고 회답한 전보.", "points": ["본성의 귀전 제836호(전화 연락 시 사용할 은어 지정)를 곧바로 실행하겠다고 회답.", "일미 간 전화 연락 가능 시간은 도쿄 시각으로 ① 오전 7시~10시 ② 오전 11시~오후 1시 ③ 오후 2시~오후 4시의 세 구간으로 제한되어 있다.", "그 제한 때문에 긴급 전보에 의하는 편이 빠른 경우에는 전화를 걸지 않는 것으로 하겠다."], "primary": "[186면]\n제一一八一호 (지급, 극비, 관장부호)\n귀전 제八三六호에 관하여\n\n즉시 실행하여야 하겠으나, 일미 간 전화 연락 시간(도쿄 시각으로 오전 7시 내지 10시 및 오전 11시 내지 오후 1시, 오후 2시 내지 오후 4시)에 제한이 있는 까닭에, 긴급 전보에 의하는 편이 빠른 경우에는 전화를 걸지 않는 것으로 하겠습니다.", "secondary": "[186面]\n第一一八一号（至急、極秘、館長符号）\n貴電第八三六号ニ関シ\n早速実行スヘキモ日米間電話連絡時間（東京時間午前七時乃至十時及午前十一時乃至午後一時、午後二時乃至午後四時）ニ制限アル為緊急電報ニ依ル方早キ場合ハ電話セサルコトトスヘシ", "notes": ["귀전 제836호는 앞의 문서 405 「電話連絡に際して使用すべき隠語について」(도고 외무대신 → 노무라 대사, 11월 26일 발)를 가리킨다."], "warn": false, "pages": ["nichibei2_05_003"], "search": "野村吉三郎 (노무라 기치사부로) — 주미대사 東郷茂徳 (도고 시게노리) — 외무대신"}, {"id": "408", "order": 408, "date": "1941-11-26", "group": "A", "eyebrow": "문서 408 · 米国国務長官との会談時間未定について", "title": "미국 국무장관과의 회담 시간이 미정임에 관하여", "list_right": "문서 408", "meta": [{"k": "일자", "v": "1941-11-26"}, {"k": "원문 표기", "v": "昭和16年11月26日"}, {"k": "전보번호", "v": "第一一八四号"}, {"k": "발신", "v": "在米国野村大使 (노무라 주미대사)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 11月26日後発 / 本省 11月27日前着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "米国国務長官との会談時間未定について", "txt": true, "wide": true}], "summary": "데라사키를 밸런타인에게 보내어 헐 장관과의 회견 예정 시각을 물었으나, 헐이 이른 아침부터 본건 심의에 몰두하여 시각이 아직 확정되지 않았고, 다만 오늘 중에는 회견이 이루어질 것 같다는 인상을 받았다고 보고한 전보.", "points": ["왕전 제1178호에 이어, 오늘 아침 다시 데라사키(寺崎)를 「밸런타인」에게 보내어 회견 예정 시각을 묻게 했다.", "「밸런타인」의 답: 「헐」 장관은 오늘도 이른 아침부터 본건에 관하여 심의·연구 중이어서 다른 일을 돌아볼 겨를이 거의 없는 실정이며, 회견 예정 시각은 지금도 확정하지 못하고 있다.", "다시 확인차 장관과 연락한 뒤에도 같은 취지의 회답을 하였다.", "대체로 오늘 중에는 회견이 이루어질 것이라는 인상을 받았다고 덧붙임(「為念」)."], "primary": "[187면]\n제一一八四호 (극비, 관장부호)\n왕전(往電) 제一一七八호에 관하여\n\n오늘 아침 다시 데라사키(寺崎)로 하여금 「밸런타인(バレンタイン, Valentine)」을 방문케 하여 회견의 예정 시각을 묻게 하였던바, 「밸(バ)」은 「헐(ハル, Hull)」 장관은 오늘도 이른 아침부터 본건에 관하여 심의·연구 중이어서 거의 다른 일을 돌아볼 겨를이 없는 실상이며, 회견 예정 시각은 지금도 아직 확정하지 못하고 있는 형편이라고 말하였습니다. 다시 확인을 위하여 장관과 연락한 뒤에도 같은 취지의 회답을 하였으나, 대체로 오늘 중에는 회견이 이루어질 것 같다는 인상을 받았습니다. 참고로 알려 드립니다.", "secondary": "[187面]\n第一一八四号（極秘、館長符号）\n往電第一一七八号ニ関シ\n今朝更ニ寺崎ヲシテ「バレンタイン」ヲ往訪セシメ会見ノ予定時間ヲ質サシメタル処「バ」ハ「ハル」長官ハ今日モ早朝ヨリ本件ニ関シ審議研究中ニシテ殆ント他事ヲ顧ミル暇ナキ実状ニテ会見予定時間ハ今尚確定致シ兼ネオル次第ナリト述ヘタルカ更ニ念ノ為長官ト連絡ノ後同趣旨ノ回答ヲ為セルモ大体本日中ニハ会見ノ運ニ至ルヘキ印象ヲ受ケタル趣ナリ為念", "notes": [], "warn": false, "pages": ["nichibei2_05_004"], "search": "野村吉三郎 (노무라 기치사부로) — 주미대사 東郷茂徳 (도고 시게노리) — 외무대신 寺崎英成 (데라사키 히데나리) — 주미대사관 서기관 「バレンタイン」(밸런타인, Joseph W. Ballantine) — 미 국무부 극동부 「ハル」(헐, Cordell Hull) — 미국 국무장관"}, {"id": "409", "order": 409, "date": "1941-11-26", "group": "A", "eyebrow": "문서 409 · 米国国務長官との会談時間について", "title": "미국 국무장관과의 회담 시간에 관하여", "list_right": "문서 409", "meta": [{"k": "일자", "v": "1941-11-26"}, {"k": "원문 표기", "v": "昭和16年11月26日"}, {"k": "전보번호", "v": "第一一八七号"}, {"k": "발신", "v": "在米国野村大使 (노무라 주미대사)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 11月26日後発 / 本省 11月27日前着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "米国国務長官との会談時間について", "txt": true, "wide": true}], "summary": "노무라 대사가 구루스 대사를 동반하여 11월 26일 오후 4시 45분에 헐 장관과 회담할 예정임을 알린 짧은 전보.", "points": ["회담 시각이 본 26일 오후 4시 45분으로 정해졌다.", "본사(노무라)가 구루스 대사를 동반한다.", "앞 문서 408에서 「아직 확정되지 않았다」던 시각이 이 전보로 확정되었다."], "primary": "[187면]\n제一一八七호 (극비, 관장부호)\n\n본사(本使)는 구루스(来栖三郎) 대사를 동반하여 본 26일 오후 4시 45분에 「헐(ハル, Hull)」 장관과 회담할 예정입니다.", "secondary": "[187面]\n第一一八七号（極秘、館長符号）\n本使来栖大使同伴本二十六日午後四時四十五分「ハル」長官ト会談ノ予定ナリ", "notes": [], "warn": false, "pages": ["nichibei2_05_004"], "search": "野村吉三郎 (노무라 기치사부로) — 주미대사 来栖三郎 (구루스 사부로) — 특파대사 東郷茂徳 (도고 시게노리) — 외무대신 「ハル」(헐, Cordell Hull) — 미국 국무장관"}, {"id": "410", "order": 410, "date": "1941-11-26", "group": "A", "eyebrow": "문서 410 · 米国国務長官との会談の際提示された米国案 要旨報告", "title": "미국 국무장관과의 회담 때 제시된 미국안 요지 보고", "list_right": "문서 410", "meta": [{"k": "일자", "v": "1941-11-26"}, {"k": "원문 표기", "v": "昭和16年11月26日"}, {"k": "전보번호", "v": "第一一八九号"}, {"k": "발신", "v": "在米国野村大使 (노무라 주미대사)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 11月26日後発 / 本省 11月27日後着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "米国国務長官との会談の際提示された米国案 要旨報告", "txt": true, "wide": true}], "summary": "11월 26일 오후 4시 45분부터 약 2시간 헐 장관과 회담하여 이른바 「헐 노트」를 수령한 사실과, 그 두 안(4원칙 승인 / 9개 항목)의 요지를 본국에 보고한 전보.", "points": ["회담은 11월 26일 오후 4시 45분부터 약 2시간, 노무라·구루스 두 대사가 헐 장관과 했다.", "헐은 일본의 11월 20일 잠정협정안(을안)에 동의할 수 없다고 통고했다.", "미국 측 6월 21일 안과 일본 측 9월 25일 안의 「현격을 조절」한 신안을 「a plan」으로서 제출.", "문서에 「tentative and without commitment」라는 어깨글(肩書)이 붙어 있다는 사실을 명기했다.", "갑(甲)은 이른바 4원칙의 승인을 구하는 것, 을(乙)은 9개 항목.", "을의 요지: 다국 간 상호 불가침 조약, 불인 불가침·경제 균등, 지나 및 전 불인으로부터의 일본군 전면 철병, 장 정권 이외의 정권 불지지, 치외법권·조계 철폐, 호혜통상조약, 동결령 해제, 엔·달러 환 안정, 제3국 협정(삼국동맹) 무력화.", "제9항에 노무라 자신이 「三国協定骨抜キ案」(삼국협정 골빼기 안)이라는 촌평을 달았다.", "일본 측은 「도쿄에 전달하는 것조차 고려할 수 없다」고 강경히 응수했으나 헐은 양보할 기색이 없었다.", "미국의 경화 원인을 영·난·지의 책동, 원장 정지 요구, 일본 요인들의 영미 타도 연설, 대 태국 국방 위임 요구설로 추측하고, 「미국 측 타협파가 강경파에 압도되었다」고 보았다."], "primary": "[187면]\n제一一八九호 (극비, 관장부호)\n\n26일 오후 4시 45분부터 약 2시간, 본사(本使)와 구루스(来栖三郎) 대사가 「헐(ハル, Hull)」 장관과 회담하였습니다.\n\n「헐」로부터, 요 며칠 사이 이달 20일 일본 측이 제출한 잠정협정안(우리 쪽 을안(乙案))에 관하여 미국 정부에서 각 방면으로 검토함과 아울러 관계 제국(諸國)과 신중히 협의하였으나 유감스럽게도 이에 동의할 수 없고, 결국 미국 측 6월 21일 안과 일본 측 9월 25일 안의 현격(懸隔)을 조절한 아래 요령의 신안(新案)을 하나의 안(a plan)으로서 ([188면] tentative and without commitment 이라고 어깨에 적었습니다) 제출하지 않을 수 없게 되었다고 하며, 다음의 두 안을 제출하였습니다.\n\n갑(甲), 이른바 4원칙의 승인을 구한 것\n\n을(乙),\n(1) 일·미·영·「소(ソ)」·난(蘭)·지(支)·태(泰) 국가 간의 상호 불가침 조약 체결\n(2) 일·미·영·난·지·태 국가 간의 불인(仏印) 불가침 및 불인에서의 경제상 균등 대우에 관한 협정 취극(取極)\n(3) 지나(支那) 및 전(全) 불인으로부터의 일본군 전면 철병\n(4) 일미 양국이 지나에서 장(蔣) 정권 이외의 정권을 지지하지 않는다는 확약\n(5) 지나에서의 치외법권 및 조계(租界) 철폐\n(6) 최혜국 대우를 기초로 하는 일미 간 호혜통상조약 체결\n(7) 일미 상호 동결령 해제\n(8) 엔·「달러(ドル)」 환(換) 안정\n(9) 일미 양국이 제3국과의 사이에 체결한 어떠한 협정도 본건 협정 및 태평양 평화 유지의 목적에 반하는 것으로 해석되지 않아야 할 것을 약속함 (삼국협정 골빼기(骨抜キ) 안)\n\n이에 대하여 우리 쪽에서는, 전혀 종래의 논의에 어긋나므로 도쿄에 전달하는 것조차 고려할 수 없다고 하며 강경한 응수를 거듭하였으나, 「헐」은 도저히 양보할 기색이 없습니다.\n\n미국 측이 이러한 강경안을 제시하기에 이른 것은, 영·난·지의 책동에 의한 것과, 원장(援蔣) 행위 정지에 관한 우리 쪽의 요구, 그리고 요 며칠 사이 우리나라 요인들의 영미 타도 연설, 우리의 대(對) 태국(泰國) 국방 전면적 위임 요구설 등에 영향을 받아 미국 측의 타협파가 강경파에 압도된 때문인가 하고 추찰(推察)합니다.", "secondary": "[187面]\n第一一八九号（極秘、館長符号）\n二十六日午後四時四十五分ヨリ約二時間本使及来栖大使「ハル」長官ト会談ス\n「ハル」ヨリ茲数日間本月二十日日本側提出ノ暫定協定案（我方乙案）ニ付米国政府ニ於テ各方面ヨリ検討スルト共ニ関係諸国ト慎重協議セルモ遺憾乍ラ之ニ同意出来ス結局米側六月二十一日案ト日本側九月二十五日案ノ懸隔ヲ調節セル左記要領ノ新案ヲ一案（a plan）トシテ（tentative and [188面] without commitment ト肩書ス）提出スルノ已ムヲ得サルニ至レリトテ左ノ二案ヲ提出セリ\n甲、所謂四原則ノ承認ヲ求メタルモノ\n乙、\n（一）日米英「ソ」蘭支泰国間ノ相互不可侵条約締結\n（二）日米英蘭支泰国間ノ仏印不可侵並ニ仏印ニ於ケル経済上ノ均等待遇ニ対スル協定取極\n（三）支那及全仏印ヨリノ日本軍ノ全面撤兵\n（四）日米両国ニ於テ支那ニ於ケル蔣政権以外ノ政権ヲ支持セサル確約\n（五）支那ニ於ケル治外法権及租界ノ撤廃\n（六）最恵国待遇ヲ基礎トスル日米間互恵通商条約締結\n（七）日米相互凍結令解除\n（八）円「ドル」為替安定\n（九）日米両国カ第三国トノ間ニ締結セル如何ナル協定モ本件協定及太平洋平和維持ノ目的ニ反スルモノト解セラレサルヘキコトヲ約ス（三国協定骨抜キ案）\n右ニ対シ我方ヨリ全然従来ヨリノ話合ニ悖リ東京ニ取次クコトスラ考慮セサルヲ得ストテ強硬応酬ヲ重ネタルカ「ハル」ハ到底譲ル気色ナシ\n米側ニテ斯ル強硬案ヲ提示スルニ至レルハ英蘭支ノ策動ニ依ル外援蔣行為停止ノ我方要求ト数日来我国要人ノ英米打倒演説我対泰国国防全面的委任要求説等ニ影響サレ米側ノ妥協派カ強硬派ニ圧倒セラレタル為カト推察ス", "notes": ["이 전보가 보고하는 미국 측 문서가 이른바 「ハル・ノート」(헐 노트)이며, 이 편(篇)의 제목 「八 「ハル・ノート」受領から開戦」이 여기서 시작된다."], "warn": false, "pages": ["nichibei2_05_004", "nichibei2_05_005"], "search": "野村吉三郎 (노무라 기치사부로) — 주미대사 来栖三郎 (구루스 사부로) — 특파대사 東郷茂徳 (도고 시게노리) — 외무대신 「ハル」(헐, Cordell Hull) — 미국 국무장관 蔣介石 (장제스) — 원문에는 「蔣政権」「援蔣」으로만 나온다"}, {"id": "404", "order": 404, "date": "1941-11-27", "group": "B", "eyebrow": "문서 404 · 「乙案」前文の英文修正方訓令", "title": "「을안(乙案)」 전문(前文)의 영문 수정 훈령", "list_right": "문서 404", "meta": [{"k": "일자", "v": "1941-11-27"}, {"k": "원문 표기", "v": "昭和16年11月27日"}, {"k": "전보번호", "v": "第八四一号 （館長符号）"}, {"k": "발신", "v": "東郷外務大臣 (도고 외무대신, 東郷茂徳)", "txt": true}, {"k": "수신", "v": "在米国野村大使 (주미 노무라 대사, 野村吉三郎)", "txt": true}, {"k": "발신·착신", "v": "本省 11月27日後3時発", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "「乙案」前文の英文修正方訓令", "txt": true, "wide": true}], "summary": "을안 전문 영문의 자구를 네 곳 수정하도록 지시한 훈령 전보.", "points": ["the peace in the pacific 의 peace 앞의 정관사 the 를 뺀다.", "elucidating 을 affirming 으로 한다.", "agreed upon 을 reached 로 한다.", "mutual understanding 의 mutual 을 삭제한다."], "primary": "[184면]\n귀전 제一一七一호에 관하여\n을안(乙案) 전문(前文)의 영문은 다음과 같이 수정하기 바란다.\nthe peace in the pacific 의 peace 앞의 the（정관사）를 빼고, elucidating 을 affirming 으로 하며, agreed upon 을 reached 로 하고, mutual understanding 의 mutual 을 삭제한다.", "secondary": "[184面]\n貴電第一一七一号ニ関シ\n乙案前文英文ハ左ノ通リ修正サレ度シ\nthe peace in the pacific ノ peace ノ前ノ the （定冠詞）ヲ除キ elucidating ヲ affirming トシ agreed upon ヲ reached トシ mutual understanding ノ mutual ヲ削除ス", "notes": ["영문 어구는 지면에 로마자로 조판되어 있으므로 그대로 두었다."], "warn": false, "pages": ["nichibei2_05_001"], "search": "東郷茂徳 (도고 시게노리) — 외무대신 野村吉三郎 (노무라 기치사부로) — 주미 대사"}, {"id": "411", "order": 411, "date": "1941-11-27", "group": "A", "eyebrow": "문서 411 · 交渉打切りの際の処置につき意見具申", "title": "교섭 타절 시의 조치에 관하여 의견 구신", "list_right": "문서 411", "meta": [{"k": "일자", "v": "1941-11-27"}, {"k": "원문 표기", "v": "昭和16年11月27日"}, {"k": "전보번호", "v": "第一一九〇号"}, {"k": "발신", "v": "在米国野村大使 (노무라 주미대사)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 11月27日発 / 本省 11月27日着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "交渉打切りの際の処置につき意見具申", "txt": true, "wide": true}], "summary": "기일 내 타결이 불가능해진 이상, 아무 의사 표시 없이 돌연 자유 행동에 나서면 미국의 역선전에 이용되고 대국의 신의에도 어긋나므로, 도쿄에서 미국 대사에게 통고하거나 성명을 내는 방식으로 교섭에 매듭을 지어 달라고 건의한 전보.", "points": ["26일 미국안(제1189호)에 비추어 지시받은 기일 안에 일본 주장을 수락시킬 가망은 없다고 단정.", "「우리 쪽은 아직 최후통첩적 의사 표시를 한 일이 없다」고 명기한다. 미국안을 「최후통첩」이라 부르지 않고, 도리어 일본 쪽이 그런 표시를 하지 않았다는 문맥이다.", "11월 17일 대통령이 「no last words」라고 말한 사실을 근거로 든다(원문에 영문 그대로).", "매듭 없이 돌연 자유 행동에 나서면, 미국이 「일본이 행동 준비를 위해 회담을 끌어 왔다」고 선전하여 파탄 책임을 일본에 전가할 우려가 있다.", "그 근거로 미국이 일본의 불인 진주 때문에 회담이 정지되었다고 재삼 언급해 온 사례를 든다.", "역선전 방지뿐 아니라 「대국으로서의 신의」상으로도 고려가 필요하다고 적었다.", "다만 그러한 의사 표시는 「우리 군기(軍機)와 긴밀한 관계」가 있으므로 정부 재량에 맡긴다.", "구체적 방법으로 ① 도쿄에서 주일 미국대사에 대한 통고 ② 중외에 대한 성명을 제시.", "그 경우 미리 워싱턴에 내보(內報)한 뒤 동시에 신입하게 해 달라고 요청.", "대통령과의 회견을 앞두고 유념할 점이 있으면 즉시 회시해 달라고 청함."], "primary": "[188면]\n제一一九〇호\n\n이번 일미 교섭의 경과는 누차의 전보로 아시는 바와 같으며, 본 26일 미국 측 제안(별전 제一一八九호)에 비추어 보아도 피아(彼我)의 주장에 현격(懸隔)이 현저하여, 지시하신 기일 내에 당방(當方)의 주장을 수락시키는 것은 유감스럽게도 도저히 가망이 없게 된 형편입니다.\n\n그런데 미국 측에서는 종래의 주장과 아울러 우리 쪽이 본건 관계 각국의 동의 취부(取付)를 구한 관계상, 다시 제국(諸國)과 협의한 끝에 위 제안을 하기에 이른 형편이며, 그 기도(企圖)하는 바는 물론 방심을 [189면] 허락하지 않으나, 우리 쪽에서는 어훈령(御訓令)의 사정도 있어 오늘까지 상대방에 대하여 급속한 타결을 촉구하였을 뿐이며, 그런 까닭에 아직 최후통첩적 의사 표시를 한 일이 없고, 또 17일 대통령도 no last words 라고 말한 바와 같은 사태에도 비추어,\n\n만약 우리 쪽이 현하(現下)의 교섭에 어떻게든 매듭을 짓지 않은 채 기일 후에 어떠한 자유 행동에 나서는 경우에는, 미국 측은 목하 관계 제국과 절충 중이라는 사실도 이용하여, 도리어 우리 쪽이 소기(所期)의 행동 준비를 위하여 본건 회담을 끌어 왔고 그 준비가 갖추어졌으므로 회담 계속 중임에도 불구하고 제멋대로 예정된 행동을 개시한 것처럼 선전하여 교섭 파탄의 책임을 우리 쪽에 전가하려 할 우려가 있습니다. 이는 실제로 우리의 불인(仏印) 진주(進駐) 때문에 회담이 정지되었다는 취지를 재삼 언급한 사례에 비추어도 간취(觀取)됩니다.\n\n그러므로 우리 쪽이 본건 교섭 타절(打切)의 의사 표시를 아무것도 하지 않은 채 돌연 자유 행동에 나서는 것은, 위와 같은 역선전에 이용될 우려가 있을 뿐 아니라 대국(大國)으로서의 신의(信義) 상으로도 고려를 요하는 바입니다. 더구나 이러한 의사 표시는 우리 군기(軍機)와 긴밀한 관계가 있을 것이므로, 정부의 재량에 따라 도쿄에서 미국 대사에 대한 통고 또는 중외(中外)에 대한 성명 등 마땅한 방법으로 이번 교섭의 매듭을 분명히 하시는 것이 득책(得策)이라고 생각됩니다. 다만 그 경우에는 미리 당방에 내보(內報)하신 뒤 동시에 신입(申入)하는 것으로 하고자 합니다.\n\n또한 대통령과 회견할 사정도 있으므로, 이때에 더 유념하여야 할 점이 있으면 즉시 회시(回示)하여 주시기를 청합니다.", "secondary": "[188面]\n第一一九〇号\n今次日米交渉ノ経過ハ累次電報ニ依リ御承知ノ通リニシテ本二十六日米側提案（別電第一一八九号）ニ徴スルモ彼我ノ主張懸隔著シク御来示ノ期日内ニ当方主張ヲ受諾スルコトハ遺憾乍ラ到底見込ナキニ至レル次第ナリ\n然ルニ米側ニ於テハ予テノ主張並ニ我方ヨリ本件関係各国ノ同意取付ヲ求メタル関係上尚ホ諸国ト協議ノ上右提案ヲ為スニ至リタル次第ナルカ其ノ企図スル所ハ素ヨリ油断ヲ [189面] 許ササルモ我方ニ於テハ御訓令ノ次第モアリ今日迄先方ニ対シ急速妥結ヲ迫リタルノミニテ其ノ為未タ最後通牒的意思表示ヲ為シタルコトナク又十七日大統領モ no last words ト云ヘルカ如キ事態ニモ鑑ミ若シ我方ニ於テ現下ノ交渉ニ何トカ区切ヲ付ケスシテ期日後ニ於テ何等自由行動ニ出ツル場合ニハ米側ハ目下関係諸国ト折衝中ナル事実モ利用シ反ツテ我方カ所期ノ行動準備ノ為メ本件会談ヲ引キスリ之カ用意成リタルヲ以テ会談継続中ニモ拘ラス勝手ニ予定ノ行動ヲ開始シタルモノノ如ク宣伝シ交渉破綻ノ責任ヲ我方ニ転嫁セントスルノ惧アルコト現ニ再三我仏印進駐ノ為メ会談停止サレタル旨ヲ言及セル事例ニ依リテモ観取セラルルヲ以テ我方カ何等本件交渉打切ノ意思表示ヲ為サスシテ突如自由行動ニ出ツルコトハ右ノ如キ逆宣伝ニ利用セラルル惧アルノミナラス大国トシテノ信義上ヨリモ考慮ヲ要スル次第ナルカ而モ斯ノ如キ意思表示ハ我軍機ト緊密ノ関係アルヘキヲ以テ政府ノ御裁量ニ依リ東京ニ於テ米国大使ニ対スル通告又ハ中外ニ対スル声明等然ルヘキ方法ニ依リ今次交渉ノ区切リヲ明カニセラルルコト得策ナルヤニ存セラル尤モ其ノ場合ニハ予メ当方ヘ御内報ノ上同時ニ申入ルルコトト致シ度シ\n尚大統領ト会見ノ都合モアルニ付此ノ際尚ホ心得ヘキ点モアラハ折返ヘシ御回示ヲ請フ", "notes": ["「軍機」는 군사 기밀. 노무라가 개전 준비의 시기 문제를 에둘러 짚은 대목이다.", "「no last words」는 11월 17일 노무라·구루스가 루스벨트 대통령을 만났을 때 대통령이 한 말로, 「최후의 말은 없다」 즉 아직 결렬이 아니라는 뜻으로 인용된 것이다."], "warn": false, "pages": ["nichibei2_05_005", "nichibei2_05_006"], "search": "野村吉三郎 (노무라 기치사부로) — 주미대사 東郷茂徳 (도고 시게노리) — 외무대신 「ロ」＝ローズヴェルト (루스벨트, Franklin D. Roosevelt) — 미국 대통령. 원문에는 「大統領」으로만 나온다"}, {"id": "412", "order": 412, "date": "1941-11-27", "group": "B", "eyebrow": "문서 412 · 米国による蘭印保護占領の可能性につき照会", "title": "미국에 의한 난인 보호 점령의 가능성에 관한 조회", "list_right": "문서 412", "meta": [{"k": "일자", "v": "1941-11-27"}, {"k": "원문 표기", "v": "昭和16年11月27日"}, {"k": "전보번호", "v": "第八四二号"}, {"k": "발신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "수신", "v": "在米国野村大使 (노무라 주미대사)", "txt": true}, {"k": "발신·착신", "v": "本省 11月27日後3時発", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "米国による蘭印保護占領の可能性につき照会", "txt": true, "wide": true}], "summary": "노무라의 제1180호(문서 406) 중단에 나오는 「미국 측이 난인 보호 점령에 나설 가능성」이라는 대목을 「사(事) 자못 중대」하다고 보고, 그 근거와 참고가 될 사항을 회전하라고 도고 외무대신이 되물은 전보.", "points": ["귀전 제1180호(=문서 406) 중단의 「米側カ蘭印保護占領ニ出テ来ル可能性」이라는 구절을 지목한다.", "이를 「사(事) 자못 중대」하다고 평가하고, 당방으로서는 좀 더 정확한 사정을 알고 싶다고 했다.", "그 가능성을 언급한 근거 등, 본성의 참고가 될 사항과 함께 회전(回電)할 것을 요구.", "방향이 워싱턴→도쿄가 아니라 도쿄→워싱턴인, 이 구간에서 드문 본성 발신 전보."], "primary": "[189면]\n제八四二호 (관장부호)\n\n귀전 제一一八〇호 중단(中段)에 미국 측이 난인(蘭印) 보호 점령에 나설 가능성 운운(云々)이라 하였는바, 이는 사(事)가 자못 중대하여 당방(當方)으로서는 좀 더 적확한 사정을 알고자 하오니, 위 가능성에 언급하신 근거 등 당방의 참고가 될 만한 사항과 함께 회전(回電)하여 주시기 바랍니다.", "secondary": "[189面]\n第八四二号（館長符号）\n貴電第一一八〇号中段ニ米側カ蘭印保護占領ニ出テ来ル可能性云々トアル処右ハ事頗ル重大ニシテ当方トシテハ今少シク的確ナル事情ヲ承知シ度キニ付右可能性ニ言及セラレタル根拠等当方参考トナルヘキ事項ト共ニ御回電ヲ乞フ", "notes": ["「貴電第一一八〇号」는 문서 406(노무라·구루스의 친전 교환 건의)이며, 그 「중단」이란 「英米側カ蘭印保護占領ニ出テ来ル可能性ヲモ考慮シ」의 대목을 가리킨다. 406 원문은 「英米側」이라 적었는데 이 조회 전보는 「米側」이라 옮겨 적고 있다."], "warn": false, "pages": ["nichibei2_05_006"], "search": "東郷茂徳 (도고 시게노리) — 외무대신 野村吉三郎 (노무라 기치사부로) — 주미대사"}, {"id": "413", "order": 413, "date": "1941-11-27", "group": "A", "eyebrow": "문서 413 · 米国国務長官より提示された我が方最終案に対する米国側対案について", "title": "미국 국무장관이 제시한 우리 측 최종안에 대한 미국 측 대안에 관하여", "list_right": "문서 413", "meta": [{"k": "일자", "v": "1941-11-27"}, {"k": "원문 표기", "v": "昭和16年11月27日"}, {"k": "전보번호", "v": "第一一九一号 （極秘、館長符号）"}, {"k": "발신", "v": "在米国野村大使 (노무라 주미대사)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 11月27日前発 / 本省 11月27日後着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "米国国務長官より提示された我が方最終案に対する米国側対案について", "txt": true, "wide": true}], "summary": "노무라가 11월 26일 헐 장관에게서 이른바 「헐 노트」를 건네받은 경위를 여덟 항으로 보고한 전보. 뒤에 그 문서의 영문 원본(별전)과, 일본 외무성이 옮긴 일본어 문면(부기二)이 붙어 있다.", "points": ["노무라가 11월 26일 헐과 만난 경위를 여덟 항으로 보고한다. **「최후통첩」이라는 말은 쓰지 않고 「対案」이라 부른다.**", "제1항은 이렇다. 20일 제출한 을안에 대해 미국이 닷새간 심의하고 관계국과도 협의했으나 **「유감스럽게도 이에 관하여 심의할 수 없게 되었다」**고 통고받는다.", "제2항은 이렇다. 헐이 본안 제시가 불가피해진 사정으로, 회담 내용을 비밀에 부쳐 온 탓에 **「민론(民論)을 중히 여겨야 할 이 나라에서」** 지나를 저버린다는 뜬소문이 돌아 자신도 당혹스럽다는 점을 든다.", "제5항에서 노무라가 **「우리로서는 결단코 난징 정부를 저버릴 수 없다」**고 잘라 말한다. 헐은 미국이 가진 정보로는 난징 정부에 지나를 통치할 능력이 없다고 답한다.", "제7항에서 **이대로 제국 정부에 전달하는 것이 옳은지에 깊은 의문이 있다**며, 두 사람이 숙독·숙의한 뒤 정하겠다고 말해 둔다.", "제8항이다. 대통령이 친구들 사이에 **「마지막 말은 없다」**고 했던 경위를 들어 회견을 청하고, 헐이 내키지 않아 하면서도 주선을 승낙한다.", "（부기二）는 헐 노트를 일본 외무성이 옮긴 일본어 문면이다. 머리에 **「厳秘　一時的且拘束力ナシ」**(엄비, 일시적이며 구속력 없음)라 적혀 있다. 미국 원문의 「Strictly Confidential, Tentative and Without Commitment」다."], "primary": "[189면]\n\n**별전(別電)**\n一　11월 27일자 주미 노무라 대사 → 도고 외무대신 제1192호 — 오럴 스테이트먼트\n二　11월 27일자 제1193호 — 미국 대안(헐 노트) 전단(前段)\n三　11월 27일자 제1194호 — 미국 대안(헐 노트) 후단(後段)\n**부기(付記)**　一　위 별전一의 역문　二　위 별전二·三의 역문\n\n〔본전 제1191호의 한국어 번역은 아직 넣지 못했습니다. 원문은 위에 그대로 있습니다.〕\n\n〔**아직 옮기지 못한 대목입니다.** 192~198면 일곱 쪽 —\n（별전一）구두 성명, （별전二·三）미국 대안 영문, 그리고 （부기一）구두 성명의 일본어 역문입니다.\n원본 지면은 이 문서철에 그대로 실려 있습니다.\n영문 두 건의 한국어 번역은 미국 쪽 문서철 「진주만으로 가는 열 주」의\n**d408**(11월 26일 구두 성명)과 **d409**(이른바 헐 노트)에 있습니다.〕\n\n[199면]\n\n**（부기 二）**\n\n**엄비(厳秘)　일시적이며 구속력 없음**\n　　　　　　　　　　　　　　1941년 11월 26일\n\n**합중국 및 일본국 간 협정의 기초 개략**\n\n**제1항**\n**정책에 관한 상호 선언안**\n\n합중국 정부 및 일본국 정부는 함께 태평양의 평화를 바라며, 그 국책은 태평양 지역 전반에 걸친 영속적이고 광범한 평화를 목적으로 하고, 양국은 이 지역에서 아무런 영토적 기도(企図)를 갖지 않고 타국을 위협하거나 인접국에 대하여 침략적으로 무력을 행사할 의도가 없으며, 또 그 국책에 있어서는 상호 간 및 일체의 타국 정부와의 관계의 기초가 되는 아래의 근본 제원칙을 적극적으로 지지하고 또 이를 실제적으로 적용할 것임을 천명한다.\n\n（一）일체 국가의 영토 보전 및 주권의 불가침 원칙\n（二）다른 여러 나라의 국내 문제에 대한 불간여(不干与)의 원칙\n（三）통상상의 기회 및 대우의 평등을 포함하는 평등 원칙\n（四）분쟁의 방지 및 평화적 해결, 아울러 평화적 방법과 절차에 의한 국제 정세 개선을 위한 국제 협력 및 국제 조정 준거의 원칙\n\n일본국 정부 및 합중국 정부는 만성적 정치 불안정의 근절, 빈번한 경제적 붕괴의 방지 및 평화의 기초 설정을 위하여, 상호 간 및 다른 국가·다른 국민과의 경제 관계에 있어 아래의 제원칙을 적극적으로 지지하고 또 실제적으로 적용할 것에 합의하였다.\n\n（一）국제 통상 관계에 있어서의 무차별 대우의 원칙\n（二）국제적 경제 협력 및 과도한 통상 제한으로 나타난 극단적 국가주의 철폐의 원칙\n（三）일체의 국가에 의한 무차별적 원료 물자 획득의 원칙\n（四）국제적 상품 협정의 운용에 관하여 소비 국가 및 민중의 이익을 충분히 보호하는 원칙\n（五）일체 국가의 주요 기업 및 연속적 발전에 이바지하고 또 일체 국가의 복지에 합치하는 무역 절차에 의한 지불을 허용케 하는 국제 금융 기구 및 협정 수립의 원칙\n\n**제2항**\n**합중국 정부 및 일본국 정부가 취해야 할 조치**\n\n합중국 정부 및 일본국 정부는 다음과 같은 조치를 취할 것을 제안한다.\n\n一、합중국 정부 및 일본국 정부는 영제국·지나·일본국·화란·소련방·태국 및 합중국 간 다변적 불가침 조약의 체결\n\n[200면]\n…에 노력해야 한다.\n\n二、 양국 정부는, 미(米)·영(英)·지(支)·일(日)·란(蘭) 및 태(泰) 정부 사이에, 각국 정부가 프랑스령 인도지나의 영토주권을 존중하고 또한 인도지나의 영토보전에 대한 위협이 발생하는 것과 같은 경우에 그러한 위협에 대처하는 데 필요하고 또한 적당하다고 간주되어야 할 조치를 강구할 목적으로써 즉시 협의한다는 뜻을 서약해야 할 협정의 체결에 노력해야 한다.\n그러한 협정은 또한 협정 체약국인 각국 정부가 인도지나와의 무역 또는 경제관계에 있어서 특혜적 대우를 구하거나 또는 이를 받지 않아야 하며, 또한 각 체약국을 위하여 프랑스령 인도지나와의 무역 및 통상에 있어서의 평등대우를 확보하기 위하여 진력해야 한다는 뜻을 규정하는 것으로 한다.\n\n三、 일본국 정부는 지나(支那) 및 인도지나로부터 일체의 육·해·공군 병력 및 경찰력을 철수해야 한다.\n\n四、 합중국 정부 및 일본국 정부는, 임시로 수도를 중경(重慶)에 둔 중화민국 국민정부 이외의, 지나에 있어서의 어떠한 정부 또는 정권도 군사적·정치적·경제적으로 지지하지 않아야 한다.\n\n五、 양국 정부는 외국 조계 및 거류지 내 및 이에 관련된 여러 권익, 아울러 1901년 단비사건(團匪事件) 의정서에 의한 여러 권리를 포함하는, 지나에 있는 일체의 치외법권을 포기해야 한다.\n양국 정부는 외국 조계 및 거류지에 있어서의 여러 권리, 아울러 1901년 단비사건 의정서에 의한 여러 권리를 포함하는 지나에 있어서의 치외법권 포기에 관하여 영국 정부 및 그 밖의 여러 정부의 동의를 얻어내도록 노력해야 한다.\n\n六、 합중국 정부 및 일본국 정부는, 상호적 최혜국 대우 및 통상장벽의 저감, 아울러 생사(生糸)를 자유품목으로서 그대로 두려고 하는 미국 측 기도에 근거하여, 합중국과 일본국 사이에 통상협정 체결을 위한 협의를 개시해야 한다.\n\n七、 합중국 정부 및 일본국 정부는 각각 합중국에 있는 일본 자금 및 일본국에 있는 미국 자금에 대한 동결조치를 철폐해야 한다.\n\n八、 양국 정부는 엔·달러(円弗) 환의 안정에 관한 안에 대하여 협정하고, 위 목적을 위한 적당한 자금의 할당은 절반은 일본국으로부터, 절반은 합중국으로부터 공급되어야 한다는 것에 동의해야 한다.\n\n九、 양국 정부는, 그 어느 한쪽이 제3국과 체결하고 있는 어떠한 협정도 그 나라에 의하여 본 협정의 근본목적, 즉 태평양 지역 전반의 평화 확립 및 유지에 모순되는 것처럼 해석되지 [201면] 않아야 한다는 것에 동의해야 한다.\n\n一〇、 양국 정부는, 타국 정부로 하여금 본 협정에 규정된 기본적인 정치적·경제적 원칙을 준수하게 하고 또한 이를 실제적으로 적용하게 하기 위하여 그 세력을 행사해야 한다.", "secondary": "[189面]\n別電一　一一月二七日付在米国野村大使より東郷外[190面]務大臣宛第一一九二号\nオーラル・ステートメント\n二　一一月二七日付在米国野村大使より東郷外務大臣宛第一一九三号\n米国対案（ハル・ノート）前段\n三　一一月二七日付在米国野村大使より東郷外務大臣宛第一一九四号\n米国対案（ハル・ノート）後段\n付記一　右別電一訳文\n二　右別電二、三訳文\n\n第一一九一号　（極秘、館長符号）\nワシントン　11月27日前発\n本　省　11月27日後着\n一、二十日当方提出ノ提案（乙案但シ六及七ヲ除ク）ニ付テハ五日間ニ亘リ審議研究シ且関係諸国トモ協議セルモ遺憾乍ラ之ニ付審議スルヲ得サルニ至レリ\n二、当方ヨリ「オーラル」中六月二十一日米案ト九月二十五日日本案トノ懸隔調和ヲ云々セラレ居ルモ本案ハ右何レノ案トモ著シク異リオル旨ヲ指摘セルニ対シ「ハル」ハ右ハ当方指摘ノ「パラグラフ」ノ直前ノ「パラグラフ」ト併読アリタク当方トシテハ前記日米両案調節ノ一案ナリト述ヘ何分会談開始以来其ノ内容ヲ秘シ来レル為メ民論ヲ重ンスヘキ当国ニ於テ種々ノ憶測ヲ生シ殊ニ支那ヲ見殺シニスルカ如キ浮説モ頻リニ伝ヘラレ自分モ当惑シオル一方日本側ハ二十二日会談ノ際申上ケオキタル次第ニモ拘ラス各要人ハ相変ラス非平和的議論ヲ高調セラレオル関係モ有之自分トシテハ諸般ノ事情上本案提示ノ已ムヲ得サルニ至レル次第ナリト述ヘタリ\n三、先方提案「セクション」一ニ付テハ先ツ四原則中第四カ従来ノ所謂「スチムソン・ドクトリン」ト変化セルヲ指摘セルニ対シテ別段返答ナク無差別待遇主義ニ対シテハ従来ノ我方主張ヲ「レマインド」スルト共ニ例ヘハ右原則ヲ直ニ支那ニ適用シ現在経済ノ運営ニ急激苛酷ナル変革ヲ加フルノ不合理不可能ヲ指摘セルニ対シテハ右ノ[191面]如キハ十分理解シオリ原則ハ原則トシテ必スシモ急速実現ヲ予想シオル次第ニアラスト答ヘタリ\n四、同提案「セクション」第二ノ（一）ニ関シ其ノ趣旨ハ兎ニ角トシ日本カ華府会議以来此ノ種集団的機構ニ付テハ頗ル苦キ経験ヲ有シ居リ本案カ九国条約的機構ヲ復活セントスルモノナルニ於テハ我国トシテハ四年間ノ今次事変カ全ク無益ニ帰スルコトトナル次第ニシテ到底容認シ得サル所以ヲ強調セルニ対シテハ何等力アル反駁ヲ為サス\n五、更ニ同「セクション」（三）及（四）ニ至リテハ全ク出来ナイ相談ニシテ（四）ノ重慶政府承認ノ如キ米国カ恰モ支那即チ蔣政権ヲ見殺シニスルヲ得スト称セラルルカ如ク我国トシテハ断シテ南京政府ヲ見殺シニスルヲ得ストキッパリ云ヒ切リタルニ対シ「ハル」ハ要スルニ交渉ニ依ル次第ニシテ必スシモ即時実現ヲ主張シオル次第ニアラス南京政府ニ関シテハ米国ノ有スル情報ニ依レハ到底支那ヲ統治スルノ能力ナシト見ルノ外ナシト述ヘタルヲ以テ右ハ過去ニ於テ支那ニ幾多ノ政府カ興亡セル経緯ヲ無視セラレタル議論ナリト応酬シオキタリ\n六、三国条約ノ問題ニ至リテハ米国ハ日本ヲシテ出来得ル限リノ譲歩ヲ為サシメンコトヲ希望セラレツツアル一方前述ノ如キ支那問題ニ対シテハ殆ント当方ヲシテ重慶ニ謝罪セヨト称セラルルニ等シク苟クモ米国大統領カ過般「紹介」ヲ云々セラレタルハマサカ右ノ如キ趣旨ニ出テラレタル次第ニハアラサルヘシト述ヘタルニ対シ「ハル」ハ別段答フル所ナシ\n七、兎ニ角単ニ一読シタルノミニテモ甚タ承服シ難キ御提案ニテ殊ニ支那問題ニ関シ絶対受諾不可能ナル条項ヲ含ミオルニ鑑ミ此ノ儘之ヲ帝国政府ニ伝達スルハ誠意日米両国ノ妥結ヲ念願トスル本使等トシテ採ルヘキ措置ナリヤ否ヤニモ深キ疑問アリ何レ両人ニ於テ更ニ熟読熟議ノ上決定スルコトト致シ度シト述ヘオキタリ\n八、最後ニ本使ヨリ米国トシテハ本案ノ外考慮ノ余地ナシトセラルル意ナリヤ及過般大統領カ友人間ニハ「最後ノ言葉ナシ」ト称セラレタル経緯ニモ鑑ミ会見方ヲ取計フヲ得ヘキヤト質シタルニ対シ前者ニ対シテハ右ハ要スルニ一案ナリト答ヘ後者ニ対シテハ余リ進マサル様子ナリシモ取計ヒ方承諾セリ\n\n[192面]\n（別電一）\n第一一九二号　（極秘、館長符号）\nワシントン　11月27日前発\n本　省　11月27日後着\nStrictly Confidential.\nOral\nNovember 26, 1941.\n\n〔192면 – 198면 — 이 아카이브에서 아직 옮기지 못한 대목.\n（別電一）第一一九二号 오럴 스테이트먼트, （別電二·三）第一一九三·一一九四号 미국 대안(영문),\n그리고 （付記一）별전一의 역문. 원본 지면은 pages/nichibei2_05_009.png ~ 015.png 에 있다.\n영문 두 건은 「진주만으로 가는 열 주」의 d408·d409 와 같은 글이다.〕\n\n[199면]\n\n（付記二）\n\n厳秘　一時的且拘束力ナシ\n　　　　　　　　　　　　　　一九四一年一一月二六日\n\n合衆国及日本国間協定ノ基礎概略\n\n第一項\n政策ニ関スル相互宣言案\n\n合衆国政府及日本国政府ハ共ニ太平洋ノ平和ヲ欲シ其ノ国策ハ太平洋地域全般ニ亙ル永続的且広汎ナル平和ヲ目的トシ両国ハ右地域ニ於テ何等領土的企図ヲ有セス他国ヲ脅威シ又ハ隣接国ニ対シ侵略的ニ武力ヲ行使スルノ意図ナク又其国策ニ於テハ相互間及一切ノ他国政府トノ間ノ関係ノ基礎タル左記根本諸原則ヲ積極的ニ支持シ且之ヲ実際的ニ適用スヘキ旨闡明ス\n\n（一）一切ノ国家ノ領土保全及主権ノ不可侵原則\n（二）他ノ諸国ノ国内問題ニ対スル不干与ノ原則\n（三）通商上ノ機会及待遇ノ平等ヲ含ム平等原則\n（四）紛争ノ防止及平和的解決並ニ平和的方法及手続ニ依ル国際情勢改善ノ為国際協力及国際調停遵拠ノ原則\n\n日本国政府及合衆国政府ハ慢性的政治不安定ノ根絶頻繁ナル経済的崩壊ノ防止及平和ノ基礎設定ノ為相互間並ニ他国家及他国民トノ間ノ経済関係ニ於テ左記諸原則ヲ積極的ニ支持シ且実際的ニ適用スヘキコトニ合意セリ\n\n（一）国際通商関係ニ於ケル無差別待遇ノ原則\n（二）国際的経済協力及過度ノ通商制限ニ現ハレタル極端ナル国家主義撤廃ノ原則\n（三）一切ノ国家ニ依ル無差別的ナル原料物資獲得ノ原則\n（四）国際的商品協定ノ運用ニ関シ消費国家及民衆ノ利益ノ充分ナル保護ノ原則\n（五）一切ノ国家ノ主要企業及連続的発展ニ資シ且一切ノ国家ノ福祉ニ合致スル貿易手続ニ依ル支払ヲ許容セシムルカ如キ国際金融機構及取極樹立ノ原則\n\n第二項\n合衆国政府及日本国政府ノ採ルヘキ措置\n\n合衆国政府及日本国政府ハ左ノ如キ措置ヲ採ルコトヲ提案ス\n\n一、合衆国政府及日本国政府ハ英帝国、支那、日本国、和蘭、蘇連邦、泰国及合衆国間多辺的不可侵条約ノ締結\n\n[200면]\nニ努ムヘシ\n二、両国政府ハ米、英、支、日、蘭及泰政府間ニ各国政府カ仏領印度支那ノ領土主権ヲ尊重シ且印度支那ノ領土保全ニ対スル脅威発生スルカ如キ場合斯ル脅威ニ対処スルニ必要且適当ナリト看做サルヘキ措置ヲ講スルノ目的ヲ以テ即時協議スル旨誓約スヘキ協定ノ締結ニ努ムヘシ\n斯ル協定ハ又協定締約国タル各国政府カ印度支那トノ貿易若ハ経済関係ニ於テ特恵的待遇ヲ求メ又ハ之ヲ受ケサルヘク且各締約国ノ為メ仏領印度支那トノ貿易及通商ニ於ケル平等待遇ヲ確保スルカ為メ尽力スヘキ旨規定スヘキモノトス\n三、日本国政府ハ支那及印度支那ヨリ一切ノ陸、海、空軍兵力及警察力ヲ撤収スヘシ\n四、合衆国政府及日本国政府ハ臨時ニ首都ヲ重慶ニ置ケル中華民国国民政府以外ノ支那ニ於ケル如何ナル政府若クハ政権ヲモ軍事的、政治的、経済的ニ支持セサルヘシ\n五、両国政府ハ外国租界及居留地内及之ニ関連セル諸権益並ニ一九〇一年ノ団匪事件議定書ニ依ル諸権利ヲモ含ム支那ニ在ル一切ノ治外法権ヲ抛棄スヘシ\n両国政府ハ外国租界及居留地ニ於ケル諸権利並ニ一九〇一年ノ団匪事件議定書ニヨル諸権利ヲ含ム支那ニ於ケル治外法権抛棄方ニ付英国政府及其ノ他ノ諸政府ノ同意ヲ取付クヘク努力スヘシ\n六、合衆国政府及日本国政府ハ互恵的最恵国待遇及通商障壁ノ低減並ニ生糸ヲ自由品目トシテ据置カントスル米側企図ニ基キ合衆国及日本国間ニ通商協定締結ノ為メ協議ヲ開始スヘシ\n七、合衆国政府及日本国政府ハ夫々合衆国ニ在ル日本資金及日本国ニ在ル米国資金ニ対スル凍結措置ヲ撤廃スヘシ\n八、両国政府ハ円弗為替ノ安定ニ関スル案ニ付協定シ右目的ノ為メ適当ナル資金ノ割当ハ半額ヲ日本国ヨリ半額ヲ合衆国ヨリ供給セラルヘキコトニ同意スヘシ\n九、両国政府ハ其ノ何レカノ一方カ第三国ト締結シ居ル如何ナル協定モ同国ニ依リ本協定ノ根本目的即チ太平洋地域全般ノ平和確立及保持ニ矛盾スルカ如ク解釈セラ\n[201面]\nレサルヘキコトヲ同意スヘシ\n一〇、両国政府ハ他国政府ヲシテ本協定ニ規定セル基本的ナル政治的、経済的原則ヲ遵守シ且之ヲ実際的ニ適用セシムル為メ其ノ勢力ヲ行使スヘシ", "notes": [], "warn": true, "pages": ["nichibei2_05_006", "nichibei2_05_007", "nichibei2_05_008", "nichibei2_05_009", "nichibei2_05_010", "nichibei2_05_011", "nichibei2_05_012", "nichibei2_05_013", "nichibei2_05_014", "nichibei2_05_015", "nichibei2_05_016", "nichibei2_05_017", "nichibei2_05_018"], "search": ""}, {"id": "414", "order": 414, "date": "1941-11-27", "group": "A", "eyebrow": "문서 414 · 米国大統領と軍部首脳との秘密会談について", "title": "미국 대통령과 군부 수뇌의 비밀 회담에 관하여", "list_right": "문서 414", "meta": [{"k": "일자", "v": "1941-11-27"}, {"k": "원문 표기", "v": "昭和16年11月27日"}, {"k": "전보번호", "v": "第一一九五号"}, {"k": "발신", "v": "在米国野村大使 (주미 노무라 대사, 野村吉三郎)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신, 東郷茂徳)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 11月27日後発 / 本省 11月28日前着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "米国大統領と軍部首脳との秘密会談について", "txt": true, "wide": true}], "summary": "11월 25일 정오 백악관에서 대통령이 헐 장관·육해군장관·스타크 해군작전부장·마셜 육군참모총장을 불러 극비 협의를 했다는 신문보도를 전한 전보.", "points": ["신문보도에 따르면 대통령은 25일 정오 백악관(白亜館)에 「ハル」장관 외에 육·해군 장관, 「スターク」해군작전부장, 「マーシャル」육군참모총장을 불러 무언가를 극비리에 협의했다.", "협의 내용은 일체 발표를 피하고 있다.", "극동 문제가 토의의 주제에 포함되었으리라고 간주되고 있다.", "마치 그것이 일미교섭의 경과와 어떤 관계가 있는 것처럼 취급되고 있다."], "primary": "[201면]\n신문보도에 의하면 대통령은 25일 정오 백악관(白亜館)에 「ハル」(헐, Hull) 장관 외에 육·해군 장관, 「スターク」(스타크, Stark) 해군작전부장 및 「マーシャル」(마셜, Marshall) 육군참모총장을 불러 무언가를 극비리에 협의하였다는 바, 협의 내용에 대해서는 일체 발표를 피하고 있으나, 극동 문제가 토의의 주제에 포함되었던 것으로 간주되고 있으며, 마치 그것이 일미교섭의 경과와 어떠한 관계가 있는 것처럼 취급되고 있다.", "secondary": "[201面]\n新聞報道ニ依レハ大統領ハ二十五日正午白亜館ニ「ハル」長官ノ外陸海軍長官「スターク」海軍作戦部長及「マーシャル」陸軍参謀総長ヲ招致シ何事カ極秘裡ニ協議セル由ニテ協議内容ニ付テハ一切発表ヲ避ケ居ルモ極東問題カ討議ノ主題ニ含マレタルモノト見做サレ恰モ右カ日米交渉ノ経過ト何等カノ関係アルカ如ク取扱ハレ居レリ", "notes": ["「白亜館」은 백악관(White House)의 당대 표기이다."], "warn": false, "pages": ["nichibei2_05_018"], "search": "野村吉三郎 (노무라 기치사부로) — 주미 대사 東郷茂徳 (도고 시게노리) — 외무대신 「ハル」 (헐, Cordell Hull) — 국무장관 「スターク」 (스타크, Harold R. Stark) — 해군작전부장 「マーシャル」 (마셜, George C. Marshall) — 육군참모총장"}, {"id": "415", "order": 415, "date": "1941-11-27", "group": "A", "eyebrow": "문서 415 · 米国大統領との会見予定について", "title": "미국 대통령과의 회견 예정에 관하여", "list_right": "문서 415", "meta": [{"k": "일자", "v": "1941-11-27"}, {"k": "원문 표기", "v": "昭和16年11月27日"}, {"k": "전보번호", "v": "第一一九六号（極秘、館長符号）"}, {"k": "발신", "v": "在米国野村大使 (주미 노무라 대사, 野村吉三郎)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신, 東郷茂徳)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 11月27日後発 / 本省 11月28日前着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "米国大統領との会見予定について", "txt": true, "wide": true}], "summary": "27일 오후 5시 반에 노무라 대사가 구루스 대사와 함께 대통령과 공연(公然)히 회견할 예정임을 알린 한 줄짜리 전보.", "points": ["회견 일시는 11월 27일 오후 5시 반.", "노무라 대사와 구루스 대사가 함께 대통령을 만난다.", "「公然」 회견, 즉 비공식·비밀이 아닌 공개 회견으로 예정되어 있다 (원문에서 「公然」에 방점이 찍혀 있다)."], "primary": "[201면]\n27일 오후 5시 반, 본사(本使, 노무라)는 구루스(来栖三郎) 대사와 함께 대통령과 공연(公然)히 회견할 예정.", "secondary": "[201面]\n二十七日午後五時半本使来栖大使ト共ニ大統領ニ公然会見ノ予定", "notes": ["원문 「公然」 두 글자 옆에 방점(傍点)이 찍혀 있다. 강조 표시로 보인다."], "warn": false, "pages": ["nichibei2_05_018"], "search": "野村吉三郎 (노무라 기치사부로) — 주미 대사 来栖三郎 (구루스 사부로) — 특파대사 東郷茂徳 (도고 시게노리) — 외무대신"}, {"id": "416", "order": 416, "date": "1941-11-27", "group": "A", "eyebrow": "문서 416 · 交渉決裂の際の米国による蘭印保護進駐の可能性について", "title": "교섭 결렬 시 미국에 의한 란인(蘭印) 보호 진주(進駐) 가능성에 관하여", "list_right": "문서 416", "meta": [{"k": "일자", "v": "1941-11-27"}, {"k": "원문 표기", "v": "昭和16年11月27日"}, {"k": "전보번호", "v": "第一二〇四号（極秘、館長符号）"}, {"k": "발신", "v": "在米国野村大使 (주미 노무라 대사, 野村吉三郎)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신, 東郷茂徳)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 11月27日後発 / 本省 11月28日後着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "交渉決裂の際の米国による蘭印保護進駐の可能性について", "txt": true, "wide": true}], "summary": "미국이 네덜란드령 기아나에 알루미늄 자원 확보를 명목으로 보호 진주를 단행한 사례에 비추어, 일미교섭이 결렬될 경우 영·미가 고무·주석 등 국방자원 확보를 명목으로 란인(蘭印, 네덜란드령 동인도)에 보호 진주할 가능성을 고려해 두어야 한다고 상신한 전보.", "points": ["미국은 재영(在英) 네덜란드 정부와 협정한 뒤 네덜란드령 「ギアナ」(기아나) 보호 진주를 단행했다.", "그 발표에 따르면 진주 목적은 미국 국방자원으로 필요한 「アルミニューム」(알루미늄) 확보이며, 평시라면 네덜란드 정부가 란인의 병력을 파견해야 하나 서남태평양의 현 정세 아래서는 그것이 불가능하여 미국 육군으로 광산을 보호한다는 것이다.", "동시에 네덜란드 정부의 초청에 따라 브라질(伯剌西爾)도 이에 참가했다.", "앞서 네덜란드 외상이 란인 방문 도중 워싱턴에 들러 미국 정부 당국과 협의한 이래, 미국의 대(對)란인 군수품 공급과 기사(技師)의 왕래 등의 사실, 그리고 란인의 역사에 비추어 볼 때, 일미교섭 결렬에 따른 정세 여하에 따라서는 영·미가 위 미·브라질의 기아나 진주처럼 란인에서 고무(護謨)·주석(錫) 등 국방자원 확보를 명목으로 보호 진주의 수단에 나설 수 있다. 이를 고려에 넣어 둘 필요가 있다.", "앞서 보낸 전보 제1180호에서 이 점에 언급한 것도 바로 이 취지에 다름 아니다."], "primary": "[201면]\n귀전(貴電) 제842호에 관하여. 미국 측에서는 종래부터의 주장 아울러 우리 쪽의 요구에 따라 관계국인 네덜란드(蘭)와도 협의 중인 차에, 본월 24일 [202면] 「ホワイト・ハウス」(백악관) 발표와 같이 미국은 재영(在英) 네덜란드 정부와 협정한 위에 네덜란드령 「ギアナ」(기아나) 보호 진주를 단행하였다.\n\n위 발표에 명기된 바와 같이, 이 진주는 미국 국방자원으로서 필요한 「アルミニューム」(알루미늄) 확보를 주안으로 하며, 더욱이 평상시라면 네덜란드 정부가 란인(蘭印)의 병력을 파견해야 할 터이나 서남태평양에 있어서의 현재의 정세 아래서는 이를 행할 수 없으므로 미국 육군으로써 그곳의 알루미늄 광산을 보호하는 것이며, 동시에 네덜란드 정부의 초청에 따라 브라질(伯剌西爾)도 이에 참가하였다는 사정을 밝히고 있다.\n\n이에 비추어 볼 때, 또한 앞서 네덜란드 외상이 란인 방문 도중 이곳(워싱턴)에 들러 미국 정부 당국과 협의한 이래, 미국의 대(對)란인 군수품 공급 및 기사(技師)의 미국·란인 간 왕래 등의 사실, 아울러 란인의 역사에도 비추어 볼 때 — 일미교섭 결렬의 결과에 따르는 정세 여하에 따라서는, 영·미가 앞에 적은 미국·브라질의 네덜란드령 「ギアナ」 진주와 같이 란인에 있어서의 고무(護謨)·주석(錫) 등 국방자원 확보를 명목으로 하여 그 보호 진주의 수단에 나서는 일이 있을 수 있음을 고려에 넣어 둘 필요가 있는 바이며, 왕전(往電) 제1180호에서 이 점에 언급한 것도 위 취지에 다름 아니다.", "secondary": "[201面]\n貴電第八四二号ニ関シ米側ニ於テハ予テヨリノ主張並ニ我方ノ要求ニ依リ関係国タル蘭トモ協議中ナル折柄本月二十四日「ホワイト・ハウ[202面]ス」発表ノ如ク米国ハ在英国ノ蘭政府ト協定ノ上蘭領「ギアナ」保護進駐ヲ断行シタルカ右発表ニ明記セル如ク同進駐ハ米国国防資源トシテ必要ナル「アルミニューム」確保ヲ主眼トシ而モ平常時ナラハ蘭国政府カ蘭印ノ兵力ヲ派遣スヘキ筈ナルモ西南太平洋ニ於ケル現在ノ情勢ノ下ニ之ヲ行フヲ得サルヲ以テ米国陸軍ヲ以テ同地ノ「アルミニューム」鉱山ヲ保護スルモノニシテ同時ニ蘭政府ノ招請ニ依リ伯剌西爾モ之ニ参加セル次第ヲ明カニシ居ルニ鑑ミ又曩ニ蘭国外相カ蘭印訪問ノ途次当地ニ立寄リ米国政府当局ト協議セル以来米ノ対蘭印軍需品ノ供給及技師ノ米蘭印間ノ往来等ノ事実並ニ蘭印ノ歴史ニモ徴シ日米交渉ノ決裂ノ結果ニ伴フ情勢如何ニ依リテハ英米カ前記米伯ノ蘭領「ギアナ」進駐ノ如ク蘭印ニ於ケル護謨、錫等ノ国防資源確保ヲ名トシテ之カ保護進駐ノ手段ニ出ツルコトアリ得ヘキヲ考慮ニ入レ置クノ要アル次第ニシテ往電第一一八〇号ニ此ノ点ニ言及セルモ右ノ趣旨ニ他ナラス", "notes": ["「蘭印」은 네덜란드령 동인도(현 인도네시아)의 당대 표기이다.", "「伯剌西爾」은 브라질의 한자 음역 표기이다.", "「護謨」는 고무(rubber)의 당대 표기이다."], "warn": false, "pages": ["nichibei2_05_018", "nichibei2_05_019"], "search": "野村吉三郎 (노무라 기치사부로) — 주미 대사 東郷茂徳 (도고 시게노리) — 외무대신"}, {"id": "417", "order": 417, "date": "1941-11-27", "group": "A", "eyebrow": "문서 417 · 日本のタイ侵入説に関する新聞報道について", "title": "일본의 타이 침입설에 관한 신문보도에 관하여", "list_right": "문서 417", "meta": [{"k": "일자", "v": "1941-11-27"}, {"k": "원문 표기", "v": "昭和16年11月27日"}, {"k": "전보번호", "v": "第一二〇五号（大至急）"}, {"k": "발신", "v": "在米国野村大使 (주미 노무라 대사, 野村吉三郎)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신, 東郷茂徳)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 11月27日後発 / 本省 11月28日後着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "日本のタイ侵入説に関する新聞報道について", "txt": true, "wide": true}], "summary": "27일 워싱턴 석간 각지가 관변 정보라며 일본군의 불인(佛印) 대병력 집중과 수일 내 타이 침입 임박설, 그리고 그것이 11월 26일자 미국 각서에 대한 일본의 거부를 예시하는 것이라는 보도를 1면에 특보했음을 알린 지급 전보.", "points": ["27일 워싱턴 석간 각지가 관변(官辺) 정보라며, 일본이 최근 며칠 사이 불인(仏印) 안에 다량의 무기와 함께 대군을 집중시키고 있으며 그 총수가 7만에 이를 전망이라고 보도했다.", "그 대군의 이동 상황으로 보아 일본군의 「タイ」(타이) 침입이 수일 내에 결행되는 것이 아닌가 하고 관측되고 있다는 취지를 공보(公報)에 넣어 싣고 있다.", "아울러 이 일본군의 행동은 「二十六日付米政府ノ対日覚書」(11월 26일자 미국 정부의 대일 각서)에 대한 일본의 거부를 예시하는 것으로 믿어지고 있다는 취지를 1면에 특보했다.", "가운데에는, 그 군사행동이야말로 구루스 대사의 도미(渡米)에도 불구하고 일본 측의 당초부터의 진의도(真意図)였으리라고 믿어지고 있다는 취지, 아울러 그것이 미국 측 대일 강경화의 중대 원인인 것처럼 덧붙여 적은 것도 있다.", "각 방면의 주목을 끌고 있다."], "primary": "[202면]\n27일 이곳(워싱턴) 석간 각지는 관변(官辺)으로부터의 정보로서, 일본이 요 며칠 사이 불인(仏印) 안에 다량의 무기와 함께 대군을 집중시키고 있고 이미 그 총수가 7만에 이를 전망인 바, 위 대군의 이동 상황으로 보아 일본군의 「タイ」(타이) 침입은 근일 수일 중에 결행되는 것이 아닌가 하고 관측되고 있다는 취지의 공보(公報)가 들어 있다는 것, 아울러 위 일본군의 행동은 26일자 미국 정부의 대일 각서에 대한 일본의 거부를 예시하는 것이라고 믿어지고 있다는 취지를 제1면에 특보하였다.\n\n그 가운데에는, 위 군사행동이 구루스(来栖三郎) 대사의 도미(遣米)에도 불구하고 일본 측의 당초부터의 진의도(真意図)였던 것이리라고 믿어지고 있다는 취지, 아울러 그것이 미국 측의 대일 강경화의 중대 원인인 것처럼 덧붙여 적고 있는 것도 있어, 각 방면의 주목을 끌고 있다.", "secondary": "[202面]\n二十七日当地夕刊各紙ハ官辺ヨリノ情報トシテ日本カ茲数日来仏印内ニ多量ノ武器ト共ニ大軍ヲ集中シツツアリ既ニ其ノ総数七万ニ上ル見込ナルカ右大軍ノ移動状況ヨリ見テ日本軍ノ「タイ」侵入ハ近々数日中ニ決行セラルルニ非スヤト看ラレ居ル旨ノ公報入リ居ルコト並ニ右日本軍ノ行動ハ二十六日付米政府ノ対日覚書ニ対スル日本ノ拒否ヲ予示スルモノト信セラレ居ル旨ヲ第一面ニ特報シ中ニハ右軍事行動カ来栖大使ノ遣米ニ拘ハラス日本側当初ヨリノ真意図ナリシナラント信セラレ居ル旨並右カ米側対日硬化ノ重大原因ナル如ク付言シ居ルモノアリ各方面ノ注目ヲ惹キ居レリ", "notes": ["「仏印」은 프랑스령 인도지나의 당대 약칭이다.", "11월 26일자 미국 각서(이른바 「ハル・ノート」)를 이 전보는 「米政府ノ対日覚書」(미국 정부의 대일 각서)라고만 적고 있다. 「最後通牒」이라는 말은 쓰이지 않았다."], "warn": false, "pages": ["nichibei2_05_019"], "search": "野村吉三郎 (노무라 기치사부로) — 주미 대사 来栖三郎 (구루스 사부로) — 특파대사 東郷茂徳 (도고 시게노리) — 외무대신"}, {"id": "418", "order": 418, "date": "1941-11-27", "group": "A", "eyebrow": "문서 418 · 米国大統領との会見要旨報告", "title": "미국 대통령과의 회견 요지 보고", "list_right": "문서 418", "meta": [{"k": "일자", "v": "1941-11-27"}, {"k": "원문 표기", "v": "昭和16年11月27日"}, {"k": "전보번호", "v": "第一二〇六号（極秘、館長符号）"}, {"k": "발신", "v": "在米国野村大使 (주미 노무라 대사, 野村吉三郎)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신, 東郷茂徳)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 11月27日後発 / 本省 11月28日後着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "米国大統領との会見要旨報告", "txt": true, "wide": true}], "summary": "11월 27일 노무라·구루스 두 대사가 헐 장관 배석 아래 루스벨트 대통령과 회견한 내용의 보고. 대통령은 일본의 불인 남부 진주로 「첫 번째 찬물」을 뒤집어썼고 두 번째가 우려된다고 말했고, 헐은 「モダスビベンジ」(모두스 비벤디)가 무산된 이유를 설명했다.", "points": ["대통령은 지난 대전에서 일미가 함께 연합국 측에 섰던 일과, 당시 독일이 타국의 심리를 파악하지 못한 점을 언급하며 회담을 시작했다.", "대통령은 일미관계의 평화적 타결에 아직 큰 희망을 갖고 있다고 말했다.", "노무라가 「이번 제안은 일본 정부를 몹시 실망시킬 것」이라고 말하자, 대통령은 자신도 크게 실망하고 있다면서, 회담 개시 이래 일본의 불인(仏印) 남부 진주로 「제1회의 찬물」을 뒤집어썼고, 최근 정보로는 「제2회의 찬물」의 우려도 있다고 말했다 (전보는 이를 불인 증병과 태국 진주를 뜻하는 듯하다고 주석하고 제1205호를 참조시킨다).", "대통령은 「モダスビベンジ」(모두스 비벤디)로 현상을 타개하려는 안도 근본 방침이 일치하지 않으면 일시적 해결은 결국 무효로 돌아간다고 말하고, 「チャーチル」(처칠)과의 대서양 회담은 근본 방침이 일치해 있었다고 말했다.", "구루스는 양국의 견해차는 근본 주의의 문제가 아니라 그 실제 적용(원문 「実際的通用」)의 문제라 하고, 통상무차별 원칙도 지나에 곧바로 적용하면 급격한 경제 변혁이 되어 일본으로서는 유보를 붙일 수밖에 없고 그것이 오해의 원인이 되었다고 말했다.", "헐은 현재 지나에 일본군을 따라 상인 약 25만 명이 들어가 각종 영업을 하며 제3국인과 문제를 일으키고 있다고 지적하고, 그런 이익까지 문제 삼는다면 해결은 극히 곤란하다고 말했다. 구루스는 일본의 주장은 그런 사소한 문제가 아니라 큰 주(主)문제에 관한 것이라고 답했다.", "대통령의 「紹介」(중개·소개) 제의에 대해, 대통령은 아직 그 생각을 버리지 않았으나 일·지 쌍방이 동시에 희망해야 한다고 말했다.", "노무라는 아직 도쿄로부터 훈령을 받지 못했으나 30년래의 교의(交誼)로 존경하는 대통령의 「ステーツマンシップ」(스테이츠먼십)에 의해 타개의 길이 열리기를 희망한다고 말했다.", "대통령은 내일 금요일 오후 시골로 요양을 떠나 다음 주 수요일 워싱턴(華府)으로 돌아오며, 그 뒤에 두 대사와 다시 만나고 싶다, 그 사이에 국면 타개에 도움이 될 사태가 생기면 좋겠다고 말했다 (노무라는 대통령이 과로한 듯 보였다고 적었다).", "헐은 회담 도중 「モダスビベンジ」가 성공하지 못한 이유로, 일본이 불인에 대병을 증주(増駐)해 (불명)국의 병력을 견제하면서 한 손에는 삼국동맹조약을, 다른 손에는 방공협정을 내걸고 미국에 석유 공급을 요구하는 것은 도저히 미국 민중을 납득시킬 수 없다고 말했다.", "헐은 또, 평화적 해결을 논의하는 중에 일본 측 수상·외상 등 요인으로부터 이를 촉진할 만한 언사는 없고 오히려 힘에 의한 이른바 신질서 건설을 주장하는 언론만 있는 것은 매우 유감이라고 되풀이해 말했다."], "primary": "[203면]\n27일 본사(本使, 노무라)는 구루스(来栖三郎) 대사와 함께 대통령(「ハル」장관 배석)과 회담하였으며, 그 요령은 다음과 같다.\n\n대통령은 우선, 지난 대전(大戦)에서는 일미가 함께 연합국 측에 서 있었는데 당시 독일(独逸)이 아무래도 타국의 심리를 파악하지 못한 점에 관하여 일미가 함께 여러 가지로 경험한 바라고 말한 위에, 본 회담 개시 이래 일본 측에서도 평화를 애호하는 사람들이 여러 가지로 진력해 주신 것을 알고 있어 흔쾌히 여기고 있었다, 또 미국 국민 대다수의 의향도 일본과의 평화적 관계 유지를 희망하고 있음이 명백하다, 자신은 지금도 여전히 일미관계가 평화적 타결에 이르는 것에 관하여 큰 희망을 갖고 있다고 말하였다.\n\n본사가 「이번의 제안은 일본 정부를 몹시 실망시킬 것」이라고 말한 데 대하여, 대통령은 「실은 자신도 사태가 여기에 이른 데 대하여 큰 실망을 느끼지 않을 수 없다. 그러나 본 회담 개시 이래 수개월 동안, 일본의 불인(仏印) 남부 진주에 의하여 제1회의 찬물을 뒤집어썼고, 최근에도 정보에 의하면 제2회의 찬물을 뒤집어쓸 우려도 있는 듯이 생각된다」고 말하였다. (위는 불인에의 증병과 태(泰) 진주를 뜻하는 것으로 보인다.) (왕전 제1205호 참조.)\n\n다시 「일본이 4년간의 전쟁으로 인하여 일반 민심을 평화로운 미국의 현상(現状)으로써 재단할 수 없다는 것은 충분히 이해할 수 있으나, 그렇다 하더라도 「ハル」장관과 귀 대사 등과의 회담 중에 일본의 지도자 측으로부터 아무런 평화적 언사도 들을 수 없었던 것은 본건 교섭을 몹시 곤란하게 만든 바이며, 대저 「モダスビベンジ」에 의하여 현상을 타개하려는 안도 만약 종국에 있어서 국제관계 처리에 관한 일미 양국의 근본적인 주의(主義)·방침이 일치하지 않으면 일시적 해결도 결국 무효로 돌아가는 것처럼 생각된다」고 말하고, 「チャーチル」(처칠)과의 양상(洋上) 회견 같은 것은 쌍방의 근본적 방침이 일치하고 또한 무엇을 협정할 것인지가 미리 판명되어 있었던 것이라고 말하였다.\n\n이에 구루스로부터, 종래의 교섭 경과로부터 보건대 일미 양국의 의견 차이는 근본적인 주의의 문제가 아니라 그 실제적 통용(通用)에 관한 문제이다, 간단한 일례를 들면 미국 측이 통상무차별의 원칙을 주장하시는 데 대하여 일본 측은 주의로서는 이존(異存)이 없으나 이를 곧바로 지나(支那)에 적용하여 현실의 경제상태에 급격한 변혁을 주는 것을 고려할 때 일본으로서는 당연히 여러 가지 유보를 붙이게 되고, 그것이 다시 오해의 [204면] 원인이 된 일도 있으리라고 생각된다고 말하였다.\n\n이에 대하여 「ハル」로부터, 「말씀하시는 취지는 여러 차례의 설명으로 이해하고 있으나, 자신이 듣는 바에 의하면 현재 지나에는 일본 군대에 수반하여 약 25만 명의 상인이 들어와 각종 영업을 하고 있고, 이들이 제3국인과의 관계에서 여러 가지 문제를 야기하고 있는 모양인데, 그러한 사람들의 이익까지도 문제로 삼으시는 취지라면 문제의 해결은 극히 곤란할 것」이라고 말하였으므로, 구루스로부터 일본 측의 주장은 그러한 사소한(些々한) 문제가 아니라 큰 주(主)문제에 관한 것이라고 말해 두었다.\n\n다시 본사 등으로부터 대통령의 「소개(紹介)」 운운에 언급한 데 대하여, 대통령으로부터 「자신은 지금도 여전히 그 생각을 버리고 있지 않다. 다만 그것은 일·지(日支) 쌍방으로부터 동시에 희망되는 것을 필요로 한다」고 말하였으므로, 그러한 일은 실제 문제로서 심히 곤란할 것이라고 말한 데 대하여, 그는 「자신은 내정 문제 등에서 이와 같은 여러 가지 경험을 가지고 있는데, 그 사이에 저절로 방법은 있을 것」이라고 답하였다.\n\n본사로부터, 이번의 제안에 대해서는 도쿄로부터 아직 아무런 훈령도 접하지 못하였으나 자신으로서는 30년래의 교의(交誼)에 의하여 다대한 존경을 갖고 있는 귀 대통령의 「ステーツマンシップ」(스테이츠먼십)에 의하여 무언가 타개의 길이 발견되기를 희망하고 있다는 뜻을 말한 데 대하여, 대통령은 「실은 지난 주말 정양(静養) 여행을 갈 예정이었으나 긴급한 국내 문제 및 구루스 대사의 도미(来米)로 인하여 오늘까지 연기하고 있었는데, 내일 금요일 오후 출발하여 시골로 가서 정양한 (과로한 듯이 보였다) 뒤 다음 주 수요일에 워싱턴으로 돌아오므로, 그 뒤에 귀 대사 등과 면접할 기회를 갖고 싶다는 희망이며, 그 사이에 만약 무언가 국면 타개에 도움이 될 만한 사태의 발생을 본다면 좋겠다」고 말하였다.\n\n또한 회담 도중에 「ハル」로부터 「モダスビベンジ」가 성공하지 못하고 끝난 이유에 언급하여, 앞에 적은 대통령의 설명 외에 「일본이 대병(大兵)을 불인에 증주(増駐)하여 (불명)국의 병력을 그 방면에 견제하면서, 다시 한 손에는 삼국동맹조약을, 다른 한 손에는 방공협정(防共協定)을 내걸고 미국에 석유 공급을 요구하시는 데 대하여 일본의 희망에 응하는 것은 도저히 미국 민중을 승복시킬 수 있는 바가 아니다. 지난번 회담에서도 말씀드린 대로, 모처럼 우리들이 일미 문제의 평화적 해결을 논의하고 있는 데 대하여, 일본 측 수상·외상 그 밖의 요인으로부터 이를 촉진하기 쉽게 할 만한 언사는 없고 도리어 힘(力)에 의한 이른바 신질서 건설을 주장하시는 듯한 언론만 있었던 것은 몹시 유감이다」라고 되풀이하여 말하고 있었다.", "secondary": "[203面]\n二十七日本使来栖大使ト共ニ大統領（「ハル」長官列席）ト会談要領左ノ通リ\n大統領ハ先ツ前回大戦ニハ日米ハ共ニ連合国側ニ立チ居リタルカ当時独逸カ如何ニモ他国ノ心理ヲ把握セサル点ニ関シ日米共ニ種々経験シタル所ナリト述ヘタル上本会談開始以来日本側ニ於テモ平和ヲ愛好スル人々ノ種々尽力セラレタルヲ承知シ欣快ニ感シ居タリ又米国民大多数ノ意向モ日本トノ平和的関係維持ヲ希望シ居ルコト明カナリ自分ハ今猶日米関係カ平和的妥結ニ達スルコトニ付大ナル  — 국무장관 「チャーチル」 (처칠, Winston Churchill) — 영국 수상"}, {"id": "419", "order": 419, "date": "1941-11-28", "group": "E", "eyebrow": "문서 419 · 日米交渉の近況につき通報", "title": "일미교섭의 근황에 관한 통보", "list_right": "문서 419", "meta": [{"k": "일자", "v": "1941-11-28"}, {"k": "원문 표기", "v": "昭和16年11月28日"}, {"k": "전보번호", "v": "合第二四一四号（大至急、館長符号）"}, {"k": "발신", "v": "東郷外務大臣 (도고 외무대신, 東郷茂徳)", "txt": true}, {"k": "수신", "v": "各在外公館長 (각 재외공관장)", "txt": true}, {"k": "발신·착신", "v": "本省 11月28日前2時50分発", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "日米交渉の近況につき通報", "txt": true, "wide": true}], "summary": "외무대신이 각 재외공관장에게 일미교섭의 경과를 통보한 회람 전보. 미국 측이 11월 20일 일본의 최종안을 수락할 가망은 극히 적으며, 그럴 경우 국면 수습은 매우 곤란해진다고 알렸다.", "points": ["노무라 대사가 헐 국무장관 및 루스벨트 대통령에게, 종래의 일본안에 신내각 성립 후 다소의 수정을 가한 신제안을 제출했다.", "교섭은 이달 초순 이래 워싱턴(華府)에서 루스벨트 대통령·헐 장관과 노무라 대사 사이에 진행되었으며, 구루스 대사도 17일부터 참가했다.", "도쿄에서도 외무대신이 미국·영국 대사에게 급속한 해결의 필요를 역설해 왔다.", "그러나 미국 측은 일본안에 대한 낙부(諾否)를 밝히기에 앞서 제국정부의 평화적 의도에 관한 확언을 요구하고, 그 밖의 원칙적 문제에 대해서도 미리 일본의 약낙(約諾)을 받아내려 하는 등, 여전히 이론적 원칙론에 사로잡혀 나날이 급박해지는 사태에 부합하지 않음이 심하다.", "그래서 일본은 11월 20일 다시, 남서태평양 방면의 사태를 완화해 목첩(目睫)에 닥친 태평양의 위기를 회피하기 위한 최종안을 제시했다.", "그 후 미국 측은 영국·호주·네덜란드·지나 등 관계국과도 협의해 이를 심의한 모양이며, 머지않아 어떤 회답이 있을 절차로 되어 있다.", "그러나 지금까지의 미국 측 태도 등에 비추어, 미국 측이 이 시점에 맹성(猛省)하여 11월 20일의 일본 최종안을 수락할 가망은 극히 적으며, 그럴 경우 국면의 수습은 매우 곤란해진다.", "수신처: 영·미·하노이(河内)·태·소련(蘇)·독·이·「バタビヤ」(바타비아)·호주·북대(北大)·만대(満大)·남경·상해·홍콩. 미국에서 북미 각 공관장(호놀룰루 포함)·캐나다(加)·멕시코(墨)·브라질(伯)·칠레(智)·아르헨티나(亜)로 전전(転電) 바람. 홍콩에서 싱가포르(新喜坡)·「マニラ」(마닐라)로 전보 바람."], "primary": "[205면]\n일미교섭 근황\n\n一、 노무라 대사는 「ハル」(헐) 국무장관 및 「ルーズベルト」(루스벨트) 대통령에 대하여, 종래의 우리 쪽 안(案)에 신내각 성립 후 다소의 수정을 가한 신제안을 제출하였고, 교섭은 이달 초순 이래 화부(華府, 워싱턴)에서 「ル」(루스벨트) 대통령 및 「ハ」(헐) 장관과 노무라 대사 사이에 행해지고 있으며(구루스 대사도 17일부터 참가하였다), 그뿐 아니라 도쿄에서도 본 대신으로부터 미·영 대사에 대하여 급속한 해결의 필요가 있다는 뜻을 역설하고 있는 터인데, 미국 측은 위 안에 대한 낙부(諾否)를 밝히기에 앞서 제국정부의 평화적 의도에 관한 확언을 요구함과 아울러 그 밖의 원칙적 문제에 대해서도 미리 우리 쪽의 약낙(約諾)을 받아내려 하는 등, 그 태도는 여전히 이론적 원칙론에 사로잡혀 나날이 급박해지는 사태에 부합하지 않는 바가 심하다. 이에 따라 우리 쪽은 20일 다시, 남서태평양 방면의 사태를 완화하고 그로써 목첩(目睫)에 닥쳐오고 있는 태평양의 위기를 회피하기 위한 우리 쪽 최종안을 제시하였고, 그 후 미국 측은 영(英)·호(豪)·란(蘭) 및 지(支) 등 관계국과도 협의를 행하여 이를 심의한 모양인데, 머지않아 어떠한 회답이 있을 절차로 되어 있다.\n\n二、 그러나 오늘까지의 미국 측 태도 등에 비추어, 미국 측이 이때에 맹성(猛省)하여 20일의 우리 쪽 최종안을 수락할 가망은 극히 적으며, 그러한 경우 국면의 수습은 몹시 곤란해지는 바이다.\n\n본전(本電) 수신처\n영, 미, 하노이(河内), 태(泰), 소련(蘇), 독, 이, 「バタビヤ」(바타비아), 호주, 북대(北大), 만대(満大), 남경, 상해, 홍콩\n미국에서 북미 각 공관장(「ホノルル」 포함), 캐나다(加), 멕시코(墨), 브라질(伯), 칠레(智), 아르헨티나(亜)로 전전(転電) 바람\n홍콩에서 신희파(新喜坡, 싱가포르), 「マニラ」(마닐라)로 전보 바람", "secondary": "[205面]\n日米交渉近況\n一、野村大使ハ「ハル」国務長官及「ルーズベルト」大統領ニ対シ従来ノ我方案ニ新内閣成立後多少ノ修正ヲ加ヘタル新提案ヲ提出シ交渉ハ本月初旬以来華府ニ於テ「ル」大統領及「ハ」長官ト野村大使間ニ行ハレ（来栖大使モ十七日ヨリ参加セリ）オルノミナラス東京ニ於テモ本大臣ヨリ米英大使ニ対シ急速解決ノ要アル旨力説シツツアル処米側ハ右案ニ対スル諾否ヲ明ニスルニ先立チ帝国政府ノ平和的意図ニ関スル確言ヲ求ムルト共ニ其ノ他ノ原則的問題ニ付テモ予メ我方ノ約諾ヲ取付ケントスル等其ノ態度ハ依然理論的原則論ニ捉ハレ逐日急迫スル事態ニ副ハサル所甚シキニ依リ我方ハ二十日更ニ南西太平洋方面ノ事態ヲ緩和シ以テ目睫ニ迫リツツアル太平洋ノ危機ヲ回避スル為メノ我方最終案ヲ提示シ其後米国側ハ英、豪、蘭及支等ノ関係国トモ協議ヲ行ヒ右ヲ審議セル模様ナルカ近ク何等ノ回答アル手筈トナリ居レリ\n二、然レトモ今日迄ノ米側態度等ニ鑑ミ米側カ此際猛省シテ二十日ノ我方最終案ヲ受諾スル見込極メテ少ク然ル場合局面ノ収拾ハ頗ル困難トナル次第ナリ\n本電宛先\n英、米、河内、泰、蘇、独、伊、「バタビヤ」、豪州、北大、満大、南京、上海、香港\n米ヨリ北米各公館長（含「ホノルル」）加、墨、伯、智、亜ヘ転電アリ度\n香港ヨリ新喜坡、「マニラ」ヘ電報アリ度", "notes": ["「華府」는 워싱턴의 당대 한자 표기이다.", "「新喜坡」는 싱가포르의 한자 음역이다.", "「北大」·「満大」는 각각 주북경(북지)·주만주국 대사관을 가리키는 약칭으로 보인다.", "본문 중 「支」는 지나(支那)의 약칭으로, 당대 표기이므로 그대로 두었다.", "「二十日ノ我方最終案」은 이른바 을안(乙案)을 가리킨다. 이 전보는 11월 26일 미국 문서를 아직 받기 전(발신 시각 28일 오전 2시 50분) 시점의 통보이다."], "warn": false, "pages": ["nichibei2_05_022"], "search": "東郷茂徳 (도고 시게노리) — 외무대신 野村吉三郎 (노무라 기치사부로) — 주미 대사 来栖三郎 (구루스 사부로) — 특파대사 「ハル」 (헐, Cordell Hull) — 국무장관 「ルーズベルト」 (루스벨트, Franklin D. Roosevelt) — 대통령"}, {"id": "420", "order": 420, "date": "1941-11-28", "group": "B", "eyebrow": "문서 420 · 「ハル・ノート」に対する措置につき訓令", "title": "「ハル・ノート」에 대한 조치에 관한 훈령", "list_right": "문서 420", "meta": [{"k": "일자", "v": "1941-11-28"}, {"k": "원문 표기", "v": "昭和16年11月28日"}, {"k": "전보번호", "v": "第八四四号"}, {"k": "발신", "v": "東郷外務大臣 (도고 외무대신, 東郷茂徳)", "txt": true}, {"k": "수신", "v": "在米国野村大使 (주미 노무라 대사, 野村吉三郎)", "txt": true}, {"k": "발신·착신", "v": "本省 11月28日発", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "「ハル・ノート」に対する措置につき訓令", "txt": true, "wide": true}], "summary": "11월 26일 미국 측 대안(이른바 「ハル・ノート」)을 교섭의 기초로 삼을 수 없으며, 제국정부의 견해 신청으로써 교섭은 실질적으로 타절(打切)할 수밖에 없다고 알리면서, 다만 미국 측에 결렬의 인상을 주지 말고 「대사 개인의 의견」이라는 형식으로 설명하라고 지시한 훈령.", "points": ["노무라 대사의 전보 제1189호 등을 접수했다.", "두 대사(노무라·구루스)의 여러 차례에 걸친 노력에도 불구하고 미국 측이 이번과 같은 「理不尽ナル対案」(이치에 맞지 않는 대안)을 제시한 것은 몹시 뜻밖이고 유감이다.", "우리 쪽으로서는 도저히 이것을 교섭의 기초로 삼을 수 없다.", "따라서 이번 교섭은 위 미국안에 대한 제국정부의 견해(2~3일 안에 추전(追電)하겠다)를 신청함으로써 실질적으로는 타절(打切)로 할 수밖에 없는 정세다.", "다만 상대방에게 교섭 결렬의 인상을 주는 것은 피하고자 한다.", "그러므로 귀방(貴方)에서는 「지금 아직 청훈(請訓) 중이어서 정부의 의향을 자세히 알지 못하는, 대사 개인 한도의 의견」이라는 형식으로 설명하라.", "설명 내용: 종래 제국이 공정한 주장을 해 온 것, 특히 제국이 태평양 평화를 위해 여러 차례 어려움을 참고 희생을 무릅쓰며 협조적 태도를 보였음에도 미국 측이 이에 대응하지 않아 교섭 성립을 지극히 어렵게 만들고 있다는 것.", "또 위와 같은 사정이므로, 귀전 제1180호로 품신(稟申)한 건은 내시(来示)한 방면과도 연락했으나 어느 쪽이나 「이때의 조치로서는 적당하지 않다」는 의향이니 양해하라.", "※ 주목: 본문은 11월 26일 미국 문서를 「対案」·「米案」이라 부르며, 「最後通牒」이라는 말은 쓰지 않는다."], "primary": "[205면]\n귀전(貴電) 제1189호 등 접수. 두 대사의 여러 차례에 걸친 노력에도 불구하고 미국 측이 이번과 같은 이치에 맞지 않는(理不尽ナル) 대안(対案)을 제시한 것은 몹시 뜻밖이며 또한 유감[206면]으로 여기는 바로서, 우리 쪽으로서는 도저히 이것을 교섭의 기초로 삼을 수 없다. 따라서 이번 교섭은 위 미국안에 대한 제국정부의 견해(2~3일 안에 추전(追電)하겠다)를 신청(申入)함으로써 실질적으로는 타절(打切)로 할 수밖에 없는 정세이나, 상대방에 대해서는 교섭 결렬의 인상을 주는 것을 피하고자 한다. 그러므로 귀방(貴方)에서는 「지금 아직 청훈(請訓) 중이어서 정부의 의향을 자세히 알지 못하는, 귀사(貴使) 한도의 의견」이라 하여, 종래 제국이 공정한 주장을 해 왔다는 것, 특히 제국이 태평양 평화를 위하여 여러 차례 어려운 것을 참고 희생을 무릅쓰며 협조적 태도를 보였음에도 불구하고 미국 측은 이에 대응하지 않아 교섭 성립을 지극히 어렵게 만들고 있다는 것을 설명하기 바란다.\n\n또한 위와 같은 사정이므로, 귀전 제1180호로 품신(稟申)하신 건은 내시(来示)하신 방면과도 연락하였으나 어느 쪽이나 「그것은 이때의 조치로서는 적당하지 않다」는 의향이니, 이 점 양해하시기 바란다.", "secondary": "[205面]\n貴電第一一八九号等接受両大使段々ノ御努力ニモ拘ラス米側カ今次ノ如キ理不尽ナル対案ヲ提示セルハ頗ル意外且遺[206面]憾トスル所ニシテ我方トシテハ到底右ヲ交渉ノ基礎トスル能ハス従ツテ今次交渉ハ右米案ニ対スル帝国政府見解（両三日中ニ追電スヘシ）申入ヲ以テ実質的ニハ打切トスル他ナキ情勢ナルカ先方ニ対シテハ交渉決裂ノ印象ヲ与フルコトヲ避ケルコトトシ度キニ付貴方ニ於テハ目下猶請訓中ニシテ政府ノ意向ヲ詳カニセサル貴使限リノ意見ナリトシテ従来帝国カ公正ナル主張ヲ為シタルコト特ニ帝国カ太平洋平和ノ為ニ屢々難キヲ忍ヒ犠牲ヲ敢テシテ協調的態度ヲ示シタルニ拘ラス米国側ハ之ニ対応セス交渉成立ヲ至難ナラシムルコトヲ御説明アリ度シ\n尚右ノ如キ次第ニ付貴電第一一八〇号御稟申ノ件御来示ノ方面トモ連絡セルモ何レモ右ハ此ノ際ノ措置トシテ適当ニアラストノ意向ナルニ付右御了承アリ度シ", "notes": ["표제 「「ハル・ノート」に対する措置につき訓令」은 간행본 편자가 붙인 것이다.", "본문에서 11월 26일 미국 문서를 가리키는 말은 「対案」·「米案」이다. 「最後通牒」이라는 말은 쓰지 않았다.", "「両三日中ニ追電スヘシ」의 「両三日」은 2~3일이라는 뜻이다.", "「貴使限リノ意見」 — 정부의 훈령이 아니라 대사 개인의 견해라는 형식을 취하라는 지시다."], "warn": false, "pages": ["nichibei2_05_022", "nichibei2_05_023"], "search": "東郷茂徳 (도고 시게노리) — 외무대신 野村吉三郎 (노무라 기치사부로) — 주미 대사 来栖三郎 (구루스 사부로) — 특파대사 (본문의 「両大使」 중 한 사람)"}, {"id": "421", "order": 421, "date": "1941-11-28", "group": "E", "eyebrow": "문서 421 · 「ハル・ノート」に関し通報", "title": "「ハル・ノート」에 관한 통보", "list_right": "문서 421", "meta": [{"k": "일자", "v": "1941-11-28"}, {"k": "원문 표기", "v": "昭和16年11月28日"}, {"k": "전보번호", "v": "合第二四一六号（館長符号）"}, {"k": "발신", "v": "東郷外務大臣 (도고 외무대신, 東郷茂徳)", "txt": true}, {"k": "수신", "v": "各大使 (각 대사)", "txt": true}, {"k": "발신·착신", "v": "本省 11月28日後8時30分発", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "「ハル・ノート」に関し通報", "txt": true, "wide": true}], "summary": "외무대신이 각 대사에게 보낸 한 문장짜리 지급(至急) 회람 전보. 11월 27일 미국 측이 제시해 온 대안은 제국의 입장을 무시한 것이라고 통보했다.", "points": ["본문은 단 한 문장이다: 「일미교섭에 관하여 27일 미국 측이 제시해 온 대안은 제국의 입장을 무시한 것이다.」", "전문 머리에 라틴 문자로 「very urgent」가 찍혀 있다.", "※ 주목: 여기서도 11월 26일자 미국 문서를 「対案」이라 부르고 있으며 「最後通牒」이라 하지 않았다.", "※ 주목: 날짜를 「二十七日」로 적었다. 미국 측 문서 자체의 날짜는 11월 26일이나, 워싱턴에서 수교(手交)받은 날을 기준으로 삼은 표기다."], "primary": "[206면]\nvery urgent\n\n일미교섭에 관하여 27일 미국 측이 제시해 온 대안(対案)은 제국의 입장을 무시한 것이다.", "secondary": "[206面]\nvery urgent\n日米交渉ニ関シ二十七日米側ノ提示シ来レル対案ハ帝国ノ立場ヲ無視セルモノナリ", "notes": ["「very urgent」는 원문에 라틴 문자 가로쓰기로 그대로 인쇄되어 있어 번역하지 않고 그대로 두었다.", "「館長符号」는 공관장용 암호를 뜻한다.", "본문에서 미국 문서를 가리키는 말은 「対案」이다."], "warn": false, "pages": ["nichibei2_05_023"], "search": "東郷茂徳 (도고 시게노리) — 외무대신"}, {"id": "422", "order": 422, "date": "1941-11-28", "group": "A", "eyebrow": "문서 422 · 我が方タイ進駐の場合米国による蘭印進駐の可能性について", "title": "우리 쪽이 타이에 진주할 경우 미국에 의한 난인(蘭印) 진주의 가능성에 관하여", "list_right": "문서 422", "meta": [{"k": "일자", "v": "1941-11-28"}, {"k": "원문 표기", "v": "昭和16年11月28日"}, {"k": "전보번호", "v": "第一二〇九号（極秘、館長符号）"}, {"k": "발신", "v": "在米国野村大使 (주미 노무라 대사, 野村吉三郎)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신, 東郷茂徳)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 11月28日後発 / 本省 11月29日前着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "我が方タイ進駐の場合米国による蘭印進駐の可能性について", "txt": true, "wide": true}], "summary": "노무라 대사가, 황군이 태국에 진주할 경우 미국이 관계국을 규합·원조하여 남서태평양 지역의 공동방위 강화책으로 나올 것이며 그 일부로서 방위를 이유로 한 난인(蘭印, 네덜란드령 동인도) 진주 같은 수단에 나올 가능성이 적지 않다고 관측해 보고한 극비 전보.", "points": ["황군의 태국(泰国) 진주 시 미국을 비롯해 영·호·란·지 등이 어떤 행동으로 나올지는 제국으로서 가장 경계를 요하는 일이다.", "그것이 곧바로 영국군과의 정면충돌을 뜻하지는 않는다는 관측도 있을 수 있다.", "그러나 8월 17일자 대통령의 「オーラル」(구두 성명)에서 미국 측은 우리 쪽이 불인(仏印) 이외로 진출해 올 경우 즉시 적당한 행동에 나설 것이라고 예고해 둔 경위가 있다.", "또 최근 당지(워싱턴) 방면의 신문 보도에도 비추어 보면, 설령 영미 측이 태국에서 군사조치로 대항하더라도, 미국으로서는 관계국을 규합·원조하여 남서태평양 지역의 공동방위 강화 방책으로 나올 것이다.", "그 일부로서, 예컨대 왕전(往電) 제1204호로 신진(申進)한 바와 같이 방위를 이유로 하는 난인(蘭印) 진주와 같은 수단에 나설 가능성이 적지 않다고 관측된다.", "이는 이미 충분히 연구하고 계실 줄 알지만 사태의 중요성에 비추어 거듭 전보한다."], "primary": "[206면]\n황군(皇軍)의 태국(泰国) 진주의 경우, 미국을 비롯하여 영(英)·호(豪)·란(蘭)·지(支) 등이 어떠한 행동으로 나올 것인가는 제국으로서 가장 경계(戒心)를 요할 일임은 물론이다. 그것이 곧바로 영국군과의 정면충돌을 의미하지는 않는다는 관측이 혹 있을 수 있으나, 8월 17일자 대통령의 「オーラル」(구두 성명)에서 미국 측이 우리 쪽이 불인(仏印) 이외로 진출해 올 경우에는 즉시 적당한 행동에 나설 것이라는 뜻을 예고해 두고 있는 경위, 아울러 최근 당 방면(워싱턴)의 신문 보도에도 비추어, 설령 영미 측이 태국에서 군사조치로써 대항한다 하더라도, 미국으로서는 관계국을 규합(糾合)·원조하여 남서태평양 지[207면]역의 공동방위 강화 방책으로 나서고, 그 일부로서 예컨대 왕전(往電) 제1204호로 신진(申進)한 바와 같이 방위를 이유로 하는 난인(蘭印) 진주와 같은 수단에 나올 가능성이 적지 않다고 관측된다. 이 점은 이미 충분히 연구하고 계실 줄로 생각하나, 사태의 중요성에 비추어 거듭 전보하는 바이다.", "secondary": "[206面]\n皇軍ノ泰国進駐ノ場合米ヲ始メ英、豪、蘭、支等カ如何ナル行動ニ出テ来ルヘキヤハ帝国トシテ最モ戒心ヲ要スヘキコト勿論ニシテ右ハ直ニ英兵トノ正面衝突ヲ意味セストノ観測或ハ存スヘキモ八月十七日付大統領ノ「オーラル」ニ於テ米側ハ我方カ仏印以外ニ進出シ来ル場合ニハ直ニ適当行動ニ出スヘキ旨予告シ居ル経緯並ニ最近当方面ノ新聞報ニモ鑑ミ仮令英米側カ泰国ニ於テ軍事措置ヲ以テ対抗スルモ米国トシテハ関係国ヲ糾合援助シテ南西太平洋地[207面]域ノ共同防衛強化ノ方策ニ出テ其ノ一部トシテ例ヘハ往電第一二〇四号申進メノ如ク防衛ヲ理由トスル蘭印進駐ノ如キ手段ニ出テ来ル可能性少ナカラスト観測セラル右ハ既ニ充分御研究ノコトト存スルモ事態ノ重要性ニ鑑ミ重ネテ電報ス", "notes": ["「蘭印」은 네덜란드령 동인도(현 인도네시아)를 가리키는 당대 표기이다.", "「仏印」은 프랑스령 인도차이나를 가리키는 당대 표기이다.", "「支」는 지나(支那)의 약칭으로 당대 표기이므로 그대로 두었다.", "「オーラル」은 oral (statement) 의 가타카나 표기로, 8월 17일 루스벨트 대통령이 노무라 대사에게 건넨 구두 성명을 가리킨다.", "「泰国」은 태국(타이)이다."], "warn": false, "pages": ["nichibei2_05_023", "nichibei2_05_024"], "search": "野村吉三郎 (노무라 기치사부로) — 주미 대사 東郷茂徳 (도고 시게노리) — 외무대신 「ルーズベルト」大統領 (루스벨트, Franklin D. Roosevelt) — 본문에서는 「大統領」으로만 나온다"}, {"id": "423", "order": 423, "date": "1941-11-28", "group": "A", "eyebrow": "문서 423 · 米国側による「ハル・ノート」公表およびその反響について", "title": "미국 측의 「ハル・ノート」 공표 및 그 반향에 관하여", "list_right": "문서 423", "meta": [{"k": "일자", "v": "1941-11-28"}, {"k": "원문 표기", "v": "昭和16年11月28日"}, {"k": "전보번호", "v": "第一二一四号（極秘、館長符号）"}, {"k": "발신", "v": "在米国野村大使 (주미 노무라 대사, 野村吉三郎)", "txt": true}, {"k": "수신", "v": "東郷外務大臣 (도고 외무대신, 東郷茂徳)", "txt": true}, {"k": "발신·착신", "v": "ワシントン 11月28日後発 / 本省 11月29日後着", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "米国側による「ハル・ノート」公表およびその反響について", "txt": true, "wide": true}], "summary": "노무라 대사가, 종래 회담에 침묵을 지켜 온 국무성이 11월 26일 회담에 대해서는 스스로 나서서 발표했고, 미국 신문들이 「전쟁이냐 평화냐의 선택은 오로지 일본 측에 달렸다」는 논조로 보도하고 있음을 주의를 요하는 점이라고 보고한 극비 전보.", "points": ["왕전(往電) 제1190호에 관하여.", "당지의 일미회담에 관해 종래 침묵을 지키는 버릇이 있던 국무성이, 어제 26일 회담에 대해서는 스스로 나아가 발표를 행했다.", "각 신문은 이에 응하여 『「ハル」, 일본 측에 「ピースプラン」(평화안)을 수교(手交)』, 『미국은 제2의 「ミュンヘン」(뮌헨) 회의안을 물리치다』 등의 표제를 달았다.", "「ハル」의 4원칙 등 추상적으로는 누구에게도 확실한 점을 강조하고, 미국 측 제안을 받아들일지 여부는 일본의 뜻대로이며, 전쟁이냐 평화냐 어느 쪽을 택할지도 오로지 일본 측에 달려 있다는 식의 논조(書キ振リ)임이 주의를 요하는 점이다.", "「為念」(염두에 두시도록)으로 맺었다.", "※ 주목: 미국 신문이 11월 26일 문서를 「ピースプラン」이라 부른 것을 노무라가 그대로 인용해 보고했다. 노무라 자신도 이 전보에서 「最後通牒」이라는 말은 쓰지 않았다."], "primary": "[207면]\n왕전(往電) 제1190호에 관하여.\n\n당지(워싱턴)에서의 일미회담에 관하여 종래 침묵을 지키는 버릇이 있던 국무성이 어제 26일의 회담에 대해서는 스스로 나아가 발표를 행하였고, 각 신문은 이에 응하여 『「ハル」(헐), 일본 측에 「ピースプラン」(평화안)을 수교(手交)하다』, 『미국은 제2의 「ミュンヘン」(뮌헨) 회의안을 물리치다』 등의 표제를 붙였다. 「ハル」(헐)의 4원칙 등 추상적으로는 누구에게나 확실한 점을 강조하고, 미국 측 제안을 받아들일지 여부는 일본의 뜻대로이며 전쟁이냐 평화냐 어느 것을 택할지도 오로지 일본 측에 달려 있다는 식의 필치(書キ振リ)임은 주의를 요하는 점이다. 염두에 두시도록(為念).", "secondary": "[207面]\n往電第一一九〇号ニ関シ\n当地ニ於ケル日米会談ニ関シ従来沈黙ヲ守ル癖アリシ国務省カ昨二十六日ノ会談ニ付テハ自ラ進ンテ発表ヲ行ヒ各新聞ハ之ニ応シ『「ハル」日本側ニ「ピースプラン」ヲ手交ス』『米国ハ第二ノ「ミュンヘン」会議案ヲ斥ク』等ノ見出シヲ以テ「ハル」ノ四原則等抽象的ニハ何人ニモ確カナル点ヲ強調シ米国側提案ヲ受入ルルヤ否ヤハ日本ノ勝手ナルカ戦争カ平和カ何レヲ選フヤモ一ニ懸ツテ日本側ニ存リトノ書キ振リナルコトハ注意ヲ要スル点ナリ為念", "notes": ["『 』 안의 두 구절은 미국 신문 표제를 옮긴 것이다.", "「ピースプラン」은 peace plan, 「ミュンヘン」은 Munich(뮌헨 회담)의 가타카나 표기이다.", "「ハル」ノ四原則 — 헐 4원칙(1941년 4월 헐 국무장관이 제시한 네 가지 원칙).", "「為念」은 「염두에 두시도록」이라는 뜻의 전보 상투어이다.", "「書キ振リ」는 글의 논조·필치를 뜻한다."], "warn": false, "pages": ["nichibei2_05_024"], "search": "野村吉三郎 (노무라 기치사부로) — 주미 대사 東郷茂徳 (도고 시게노리) — 외무대신 「ハル」 (헐, Cordell Hull) — 국무장관"}, {"id": "424", "order": 424, "date": "1941-11-29", "group": "D", "eyebrow": "문서 424 · 中国問題に関する交渉状況汪主席に内報方訓令", "title": "중국 문제에 관한 교섭 상황을 왕(汪) 주석에게 내보(内報)하도록 하는 훈령", "list_right": "문서 424", "meta": [{"k": "일자", "v": "1941-11-29"}, {"k": "원문 표기", "v": "昭和16年11月29日"}, {"k": "전보번호", "v": "第五一〇号（極秘、館長符号扱）"}, {"k": "발신", "v": "東郷外務大臣 (도고 외무대신, 東郷茂徳)", "txt": true}, {"k": "수신", "v": "在中国日高代理大使 (재중국 히다카 대리대사, 日高信六郎)", "txt": true}, {"k": "발신·착신", "v": "本省 11月29日前0時50分発", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "中国問題に関する交渉状況汪主席に内報方訓令", "txt": true, "wide": true}], "summary": "외무대신이 남경 국민정부의 왕조명(汪主席)에게 일미교섭 중 지나 문제 부분의 경과를 절대 극비로 내보하고, 사태가 어떻게 전개되더라도 일본을 신뢰하여 협력하도록 신청하라고 지시한 훈령.", "points": ["귀전 제828호에 관하여.", "一、 일미교섭 중 지나 문제에 관한 부분은 왕(汪) 주석에게도 극비로 내보한 9항목에 관한 것이며, 우리 쪽은 그 9항목에 대해 아무런 태도 변경도 하지 않았다.", "최근 교섭에서 일지(日支) 화평 문제에 대해 미국 측은 간섭 또는 조정에 나설 의사는 없고 단지 일지 간의 다리 놓기(橋渡シ)를 하려 한다는 의향을 표명한 일이 있다.", "다른 한편 우리 쪽에서는 미국이 일지 양국의 화평에 관한 노력에 지장을 주는 행동에 나서지 말 것을 요구했다(이로써 우리 쪽은 미국으로 하여금 원장(援蒋) 행위를 정지시켜 동아의 화평 촉진을 꾀한 것이다).", "이에 대해 미국 측은 원장 행위 중지에는 강한 반대를 표명하여, 앞서 말한 「다리 놓기」와는 전혀 모순되는 태도를 보였다. 그 때문에 화평 문제도 해결 전망이 서지 않으며, 아울러(旁) 일미교섭의 성립도 곤란한 실상이다.", "二、 호적(胡適)이 22일 「ハル」(헐) 장관과 회견한 것은, 일미교섭의 내용이 영·호·란과 함께 중경(重慶)에도 관계가 있으므로 이들의 내의(内意)를 타진한 것으로 여겨진다.", "三、 이상은 절대 극비로 왕 주석 한 사람에게만 알린다는 함의(含)로 귀관이 내보한 뒤, 앞으로 사태가 어떻게 전개되더라도 우리 쪽을 신뢰하여 협력하도록 신청하기 바란다."], "primary": "[207면]\n귀전(貴電) 제828호에 관하여.\n\n一、 일미교섭 가운데 지나(支那) 문제에 관한 부분은 왕(汪) 주석에게도 극비로 내보(内報)한 9항목에 관한 것인데, 우리 쪽에서는 위 9항목에 대하여 아무런 태도도 변경한 바 없다. 또한 최근의 교섭에서 일지(日支) 화평 문제에 대해서는 미국 측이 간섭 또는 조정에 나설 의사를 가지지 않고 단지 일지 사이의 다리 놓기(橋渡シ)를 하려 하는 듯한 의향을 표명한 일이 있으나, 다른 한편 우리 쪽에서는 미국이 일지 양국의 화평에 관한 노력에 지장을 주는 것과 같은 행동에 나서지 아니할 것을 요구하였다(이로써 우리 쪽은 미국으로 하여금 원장(援蒋) 행위를 정지시키고, 그리하여 동아(東亜)의 화평 촉진을 기도(企図)한 터이다). 이에 대[208면]하여 미국 측은 원장 행위의 중지에는 강한 반대를 표명하여, 앞서 말한 다리 놓기의 점과는 전혀 모순되는 태도를 보였고, 그 때문에 화평 문제도 해결의 전망이 서지 않으며, 아울러(旁) 일미교섭의 성립도 곤란한 실상이다.\n\n二、 호적(胡適)이 22일 「ハル」(헐) 장관과 회견한 것은, 일미교섭의 내용이 영(英)·호(豪)·란(蘭)과 함께 중경(重慶)에도 관계가 있는 까닭에 이들의 내의(内意)를 타진한 것으로 인정된다.\n\n三、 이상은 절대 극비로서 왕 주석 한 사람에게만 알린다는 함의(含)로 귀관이 내보(内報)한 뒤, 앞으로 사태가 어떠한 모양으로 전개되더라도 우리 쪽을 신뢰하여 협력하도록 신청하여 주기 바란다.", "secondary": "[207面]\n貴電第八二八号ニ関シ\n一、日米交渉中支那問題ニ関スル部分ハ汪主席ニモ極秘内報セル九項目ニ関スルモノナルカ我方ニ於テハ右九項目ニ付何等態度ヲ変更セルコトナシ尚最近ノ交渉ニ於テ日支和平問題ニ付テハ米側ハ干渉又ハ調停ニ出スル意思ヲ有セス単ニ日支間ノ橋渡シヲ為サントスル如キ意向ヲ表明シタルコトアルモ他方我方ヨリ米国ハ日支両国ノ和平ニ関スル努力ニ支障ヲ与フルカ如キ行動ニ出テサルコトヲ要求（之ニ依リ我方ハ米国ヲシテ援蒋行為ヲ停止セシメ以テ東亜ノ和平促進ヲ企図セル次第ナリ）シタルニ対[208面]シテハ米側ハ援蒋行為ノ中止ニハ強キ反対ヲ表明シ前記橋渡シノ点トハ全然矛盾スル態度ヲ示シ為ニ和平問題モ解決見込立タス旁日米交渉成立モ困難ナル実状ナリ\n二、胡適カ二十二日「ハル」長官ト会見シタルハ日米交渉ノ内容カ英、豪、蘭ト共ニ重慶ニモ関係アル為之等ノ内意ヲ打診シタルモノナルヤニ認メラル\n三、以上絶対極秘汪主席限リノ含迄ニ貴官ヨリ内報ノ上今後事態カ如何様ニ展開スルトモ我方ニ信頼協力スヘキ様御申入相成度", "notes": ["「支那」·「日支」·「東亜」는 당대 표기 그대로 옮겼다.", "「汪主席」은 남경 국민정부 주석 왕조명(汪兆銘)이다.", "「援蒋」은 장개석(蒋介石) 정권에 대한 원조를 가리키는 당대 표기이다.", "「重慶」은 장개석 정권(중경 국민정부)을 가리킨다.", "「胡適」은 당시 주미 중국(중경 국민정부) 대사이다.", "「旁」(かたがた)은 「아울러·겸하여」의 뜻이다.", "「九項目」은 일본 측이 지나 문제에 관해 제시해 온 아홉 항목을 가리킨다."], "warn": false, "pages": ["nichibei2_05_024", "nichibei2_05_025"], "search": "東郷茂徳 (도고 시게노리) — 외무대신 日高信六郎 (히다카 신로쿠로) — 재중국 대리대사 (본문 표기는 「在中国日高代理大使」) 汪兆銘 (왕조명) — 남경 국민정부 주석 (본문 표기는 「汪主席」) 胡適 (호적) — 중경 국민정부 주미 대사 「ハル」 (헐, Cordell Hull) — 국무장관 蒋介石 (장개석) — 본문에서는 「援蒋」의 형태로만 나온다"}, {"id": "425", "order": 425, "date": "1941-11-30", "group": "C", "eyebrow": "문서 425 · 日米交渉決裂の場合の三国同盟発動につき独国側へ内報方訓令", "title": "일미교섭 결렬의 경우 삼국동맹 발동에 관하여 독일 측에 내보(内報)하도록 하는 훈령", "list_right": "문서 425", "meta": [{"k": "일자", "v": "1941-11-30"}, {"k": "원문 표기", "v": "昭和16年11月30日"}, {"k": "전보번호", "v": "第九八五号（別電＝第九八六号を附す）"}, {"k": "발신", "v": "東郷外務大臣 (도고 외무대신, 東郷茂徳)", "txt": true}, {"k": "수신", "v": "在独国大島大使 (주독 오시마 대사, 大島浩)", "txt": true}, {"k": "발신·착신", "v": "本省 11月30日発 ／ 別電 第九八六号（大至急、極秘、館長符号）本省 11月30日後3時30分発", "txt": true, "wide": true}, {"k": "종류", "v": "電報"}, {"k": "표제", "v": "日米交渉決裂の場合の三国同盟発動につき独国側へ内報方訓令", "txt": true, "wide": true}], "summary": "일미교섭이 결렬 필지(必至)의 사태에 이르렀음을 히틀러 총통·리벤트로프 외상에게 급히 내보하고, 대영미 전쟁 발생 시 독·이의 즉시 대미 참전을 기대한다는 뜻, 단독 불강화(不講和) 협정 체결, 대소(対蘇) 태도, 절대 기밀 유지 등을 신청하도록 지시한 훈령. 교섭 경위의 요점을 적은 별전(제986호)이 함께 실려 있다.", "points": ["一、 금년 4월 전 내각 당시 개시된 일미교섭은 제국정부의 성의 있는 노력에도 불구하고 마침내 결렬 필지의 사태에 이르렀고, 제국으로서는 이 사태에 직면하여 중대한 결의를 필요로 하게 되었다(교섭 경위 요점은 별전대로).", "귀 대사는 대지급으로 「ヒトラー」(히틀러) 총통 및 「リッペン」(리벤트로프) 외상을 면회하여 경과의 요점을 내보하고, 최근 영미 양국의 도발적 태도와 그 병력의 동아 각지 출동 계속에 대항하여 우리 쪽도 병력 출동을 부득이하게 되었으며, 형세가 흘러가는 바 마침내 무력충돌을 초래하여 우리와 영미 양국 사이에 전쟁 상태가 발생하기에 이를 우려가 극히 크다는 것을 내밀히 통보하고, 또한 그 발생의 시기가 뜻밖에 빨리 올지도 모른다는 뜻을 덧붙여 말하라.", "二、 제국과 영미 사이에 전쟁이 발생할 경우 제국으로서는 삼국조약의 관계로도 독·이의 즉시 대미 전쟁 참가를 기대하는 바이니, 독·이 측이 우리 쪽 기대에 어긋나지 않도록 운영해 가는 데 최선의 노력을 기울이라. (일영 전쟁의 경우에 관해서는 작년 삼국조약 체결 당시 주경(在京) 독일대사의 내한(来翰)이 있고, 일미 전쟁의 경우에 관해서는 조약 조문 외에 같은 취지를 부연한 주경 독일대사 내한의 한 항 및 귀전의 사정이 있다.)", "三、 또 제국으로서는 이때에 단독 불강화(単独不講和)에 관한 협정을 일독 간 및 일이 간에 따로따로(독이 간에는 이미 존재한다) 체결해 두는 것이 제반의 고려로부터 적당하다고 인정된다. 이는 독·이로서도 종래 명언한 전쟁 완수의 건전(建前)에서 보아도 환영할 바일 것으로 생각되니, 이 점에 대해서도 급속히 성립을 보도록 진력하라.", "四、 위 신청 시 독·이 측에서 소련방(蘇連邦)에 대한 우리 쪽 태도를 질문하면, 우리 쪽의 대소 태도는 앞서(嚮ニ) 독·이 측에 신청한 대로이며, 이번 우리 쪽의 남방 행동에 의해 대소 견제 조치를 완화하는 일은 물론 없고, 소련 측이 영미와 합작하여 우리 쪽에 대한 적대 행위에 나올 경우에는 단호히 이를 배격할 용의가 있으나, 당분간은 남방에 중점을 두고 북방에 대하여 우리 쪽에서 나아가 적극적 행동에 나서는 것은 삼가고자 하는 의향이라고 설명하라.", "五、 본건은 작전상의 관계도 있어 절대 기밀을 요함은 물론이니, 독·이 측에도 특히 엄중히 주의시켜 두라.", "六、 이(伊)에 대해서는 주독 대사가 독일 측에 신청을 한 직후에 「ムッソリーニ」(무솔리니) 수상 및 「チ」(치아노) 외상에게 신청하도록 하고자 한다.", "【별전 제986호】一、 일미교섭은 4월 중순부터 개시되어 반년 남짓 계속되었는데, 그 사이 제국정부는 시종일관 우리 국책 부동의 기조인 삼국조약을 견지하고 일미 국교 조정도 엄밀히 동 조약의 범위 내에서 타결을 기하여, 늘 의연한 태도로 교섭에 임하며 조약 소기의 목적인 미국의 참전 견제에 힘써 왔다.", "【별전】二、 현 내각은 기전(既電)대로 제국의 권위와 존립을 엄히 옹호하면서 공정한 기초 위에서 종래 교섭을 계속해 왔다. 교섭의 주된 난점 중에는 철병 문제(지나 및 불인으로부터의 철병을 요망한다) 등에 관한 피아 견해의 대립도 있었으나, 종래 교섭의 경위에 비추어 보면 근본의 난관은 오히려 미국 측이 국제관계 처리에 관한 그 전통적 이념, 곧 지난번의 영미 양상(洋上) 회담에 나타난 것과 같은 원칙적 이념을 고집하는 점에 있다.", "【별전】 요컨대 미국 측의 진의는 일·독·이의 구아(欧亜)에서의 신질서 건설(곧 삼국조약의 목적)을 부인·방해하려는 것으로서, 제국이 독·이와 제휴하는 한 일미 우호관계의 유지는 곤란하다고 하여, 이 견지에서 마침내 마치 제국의 삼국조약 이탈을 요구하는 듯한 태도를 보이기에 이르렀다. 그것이 교섭 최후의 단계에 이르러, 곧 최근 수일간의 절충에 의해 더욱 분명해졌으므로, 제국은 일이 이에 이른 이상 이 이상의 교섭 계속은 거의 무익하다고 인정하지 않을 수 없게 되었다.", "【별전】三、 26일 미국 정부가 제시한 대안(対案)은 앞서 말한 태도를 한층 명확히 한 것으로서, 삼국조약에 관해서는 「양국 정부의 일방이 제3국과 체결하고 있는 어떠한 협정도 본 협정의 근본 목적, 곧 태평양 전역의 평화 확보에 모순되는 것처럼 해석되어서는 아니 될 것에 동의한다」 운운이라 되어 있다. 이는 제국의 삼국조약 의무 해석을 구속하여, 그로써 미국이 머지않아 유럽 전쟁에 참입(参入)할 경우 제국으로 하여금 독·이 원조를 삼가게 하려는 기도(企図)에서 나온 것임이 명료하며, 다른 여러 문제는 어찌 되었든 이 항 하나만 보아도 미국 측 제안은 교섭의 기초로 삼을 수 없다고 인정했다.", "【별전】 또 미국 정부는 본안 제시에 앞서 빈번히 영·호·란(지) 등 여러 나라와 협의를 거듭한 사실이 있다. 따라서 미국은 이제 이들 나라와 함께 제국을 독·이와 함께 적시(敵視)하는 것임이 찰지(察知)된다.", "※ 주목: 별전은 11월 26일 미국 문서를 「対案」이라 부른다. 「最後通牒」이라는 말은 쓰지 않는다."], "primary": "[208면]\n一、 금년 4월 전(前) 내각 당시 개시된 일미교섭은 제국정부의 성의 있는 노력에도 불구하고 마침내 결렬 필지(必至)의 사태에 이르렀는바(교섭 경위의 요점은 별전대로), 제국으로서는 이 사태에 직면하여 중대한 결의를 필요로 하기에 이르렀다. 그러므로 귀 대사는 대지급(大至急)으로 「ヒトラー」(히틀러) 총통 및 「リッペン」(리벤트로프) 외상을 면회하여 위 경과의 요점을 내보(内報)함과 아울러, 최근 영미 양국이 도발적 태도로 나와 그 병력이 동아 각지에 출동을 계속하고 있음에 대항하여 우리 쪽으로서도 병력의 출동을 부득이하게 되었고, 형세가 흘러가는 바 마침내 무력충돌을 초래하여 우리와 영미 양국 사이에 전쟁 상태의 발생을 보기에 이를 우려가 극히 크다는 것을 내밀히 통보하고, 또한 그 발생의 시기가 뜻밖에 빨리 올지도 모른다는 뜻을 부언(付言)하기 바란다.\n\n二、 제국과 영미 사이에 전쟁이 발생할 경우, 제국으로서는 삼국조약의 관계로부터도 독·이의 즉시 대미 전쟁 참가를 기대하는 바이니, 독·이 측이 우리 쪽 기대에 어긋나지 않도록 운영해 나가는 데 최선의 노력을 기울여 주기 바란다.\n（일영 전쟁의 경우에 관해서는 작년(客年) 삼국조약 체결 당시 주경(在京) 독일대사의 내한(来翰)이 있고, 일미 전쟁의 경우에 관해서는 조약의 조문 외에 같은 취지를 부연한 주경 독일대사 내한의 한 항(項) 및 귀전의 사정이 [209면]있다.）\n\n三、 또 제국으로서는 이때에 단독 불강화(単独不講和)에 관한 협정을 일독 간 및 일이 간에 따로따로（독이 간에는 이미 존재한다）체결해 두는 것이 제반의 고려로부터 적당하다고 인정되는 터인데, 이는 독·이로서도 종래 명언(明言)한 전쟁 완수의 건전(建前)에서 말하더라도 환영할 바일 것으로 사료되니, 그 점에 대해서도 급속히 성립을 보도록 이 또한 진력하여 주기 바란다.\n\n四、 위 신청 시 독·이 측으로부터 소련방(蘇連邦)에 대한 우리 쪽의 태도에 관하여 질문이 있을 경우에는, 우리 쪽의 대소(対蘇) 태도는 앞서(嚮ニ) 독·이 측에 신청한 대로이며, 이번 우리 쪽의 대남방 행동에 의하여 대소 견제의 조치를 완화하는 일 따위는 물론 없고, 소련 측이 영미와 합작하여 우리 쪽에 대한 적대 행위에 나오는 것과 같은 경우에는 단호히 이를 배격할 용의를 가지고 있으나, 당분간은 남방에 중점을 두고 북방에 대하여 우리 쪽에서 나아가 적극적 행동에 나서는 것은 삼가고자 하는 의향이라는 뜻을 설명하기 바란다.\n\n五、 본건은 작전상의 관계도 있어 절대 기밀을 요함은 물론이니, 그 점에 대해서는 독·이 측에도 특히 엄중히 주의시켜 두기 바란다.\n\n六、 이(伊)에 대해서는 주독 대사가 독일 측에 신청을 한 직후에 「ムッソリーニ」(무솔리니) 수상 및 「チ」(치아노) 외상에게 신청하도록 하고자 한다.\n\n---\n\n（별전）\n제986호（대지급, 극비, 관장부호）\n\n一、 일미교섭은 4월 중순부터 개시하여 반년 남짓에 걸쳐 계속되었는데, 그 사이 제국정부는 시종일관 우리 국책 부동(不動)의 기조인 삼국조약을 견지하고, 일미 국교 조정도 엄밀히 동 조약의 범위 내에서 타결을 기하여, 늘 의연(毅然)한 태도로써 교섭에 임하고 조약 소기(所期)의 목적인 미국의 참전 견제에 힘써 온 터이다.\n\n二、 따라서 현 내각은 기전(既電)대로 제국의 권위와 존립을 엄히 옹호하면서 공정한 기초 위에서 종래 교섭을 계속해 왔는바, 교섭의 주된 난점 가운데에는 철병 문제（지나 및 불인으로부터의 철병을 요망한다）등에 관한 피아(彼我) 견해의 대립도 있었으나, 종래 교섭의 경위에 비추어 보면 근본의 난관은 오히려 미국 측이 국제관계 처리에 관한 그 전통적 이념, 곧 지난번의 영미 양상(洋上) 회담에 나타난 것과 같은 원칙적 이념을 고집하는 점에 있다. 요컨대 미국 측의 진의는 일·독·이의 구아(欧亜)에서의 신질서 건설[210면]（곧 삼국조약의 목적）을 부인·방해하려는 것으로서, 제국이 독·이와 제휴하는 한 일미 우호관계의 유지는 곤란하다고 하여, 이 견지에서 마침내 마치 제국의 삼국조약 이탈을 요구하는 듯한 태도를 보이기에 이르렀다. 그것이 교섭 최후의 단계에 이르러, 곧 최근 수일간의 절충에 의하여 더욱 명백해졌으므로, 제국은 일이 이에 이른 이상 이 이상의 교섭 계속은 거의 무익하다고 인정하지 않을 수 없기에 이르렀다.\n\n三、 26일 미국 정부가 제시한 대안(対案)은 앞서 말한 태도를 한층 명확히 한 것으로서, 삼국조약에 관해서는 「양국 정부의 일방이 제3국과 체결하고 있는 어떠한 협정도 본 협정의 근본 목적, 곧 태평양 전역의 평화 확보에 모순되는 것처럼 해석되어서는 아니 될 것에 동의한다」 운운이라 되어 있다. 이는 제국의 삼국조약 의무 해석을 구속하고, 그로써 미국이 머지않아(不日) 유럽 전쟁에 참입(参入)할 경우 제국으로 하여금 독·이 원조를 삼가게 하려는 기도(企図)에서 나온 것임이 명료하며, 다른 여러 문제는 어찌 되었든 이 항 하나만 보더라도 미국 측 제안은 교섭의 기초로 삼을 수 없다고 인정하였다. 또한 미국 정부는 본안 제시에 앞서 빈번히 영·호·란（지）등 여러 나라와 협의를 거듭한 사실이 있다. 따라서 미국은 이제 이들 나라와 함께 제국을 독·이와 함께 적시(敵視)하는 것임이 찰지(察知)된다.", "secondary": "[208面]\n一、本年四月前内閣当時開始セラレタル日米交渉ハ帝国政府ノ誠意アル努力ニ不拘逐ニ決裂必至ノ事態ニ立チ至リタル処（交渉経緯要点別電ノ通リ）帝国トシテハ右事態ニ直面シ重大ナル決意ヲ必要トスルニ至レリ就テハ貴大使ハ大至急「ヒトラー」総統及「リッペン」外相ニ面会セラレ右経過ノ要点ヲ内報セラルルト共ニ最近英米両国カ挑発的態度ニ出テ其ノ兵力カ東亜ノ各地ニ出動ヲ継続シ居ルニ対抗シ我方トシテモ兵力ノ出動ヲ余儀ナクセシメラレ勢ヒノ赴ク所逐ニ武力衝突ヲ来シ我ト英米両国トノ間ニ戦争状態ノ発生ヲ見ルニ至ルノ虞レ極メテ大ナルコトヲ内密通報セラレ且右発生ノ時期ハ意外ニ早ク来ルヤモ知レサル旨付言セラレタシ\n二、帝国ト英米トノ間ニ戦争発生ノ場合帝国トシテハ三国条約ノ関係ヨリモ独伊ノ即時対米戦争参加ヲ期待スルモノナルニ付独伊側カ我方期待ニ背カサル様取運ヒ方ニ付最善ノ努力ヲ払ハレタシ\n（日英戦争ノ場合ニ関シテハ客年三国条約締結当時在京独大使ノ来翰アリ日米戦争ノ場合ニ関シテハ条約ノ条文ノ外同趣旨ヲ敷衍セル在京独大使来翰ノ一項及貴電ノ次第[209面]アリ）\n三、尚帝国トシテハ此ノ際単独不講和ニ関スル協定ヲ日独間及日伊間ニ別々ニ（独伊間ニハ既ニ存在ス）締結シ置クコト諸般ノ考慮ヨリ適当ト認ムル処右ハ独伊トシテモ従来明言セル戦争完遂ノ建前ヨリ云フモ歓迎スヘキ所ナルヘシト思考セラルルニ付右ニ付テモ急速成立ヲ見ル様是亦御尽力相成度\n四、右申入ノ際独伊側ヨリ蘇連邦ニ対スル我方ノ態度ニ関シ質問アリタル際ニ於テハ我方ノ対蘇態度ハ嚮ニ独伊側ニ申入ノ通リニシテ今次我方ノ対南方行動ニ依リ対蘇牽制ノ措置ヲ緩和スルカ如キコトナキハ勿論蘇側カ英米ト合作シテ我方ニ対スル敵対行為ニ出テ来ルカ如キ場合ニハ断固之ヲ排撃スルノ用意ヲ有スルモ差当リハ南方ニ重点ヲ置キ北方ニ対シテ我方ヨリ進ンテ積極的行動ニ出ツルコトハ差控ヘ度キ意向ナル旨説明セラレタシ\n五、本件ハ作戦上ノ関係モアリ絶対機密ヲ要スルコトハ勿論ノ儀ニシテ右ニ付テハ独伊側ニモ特ニ厳重注意シ置カレ度\n六、伊ニ対シテハ在独大使ヨリ独側ニ申入ヲ為シタル直後ニ於テ「ムッソリーニ」首相及「チ」外相ニ申入レラルルコトト致シ度\n\n（別電）\n第九八六号（大至急、極秘、館長符号）\n一、日米交渉ハ四月中旬ヨリ開始シ半歳有余ニ亘リ継続セルカ其ノ間帝国政府ハ終始一貫我国策不動ノ基調タル三国条約ヲ堅持シ日米国交調整モ厳密ニ同条約ノ範囲内ニ於テ妥結ヲ期シ常ニ毅然タル態度ヲ以テ交渉ニ臨ミ条約所期ノ目的タル米国ノ参戦牽制ニ努メタル次第ナリ\n二、従ツテ現内閣ハ既電ノ通リ帝国ノ権威ト存立トヲ厳ニ擁護シツツ公正ナル基礎ニ於テ従来交渉ヲ継続セル処交渉ノ主タル難点中ニハ撤兵問題（支那及仏印ヨリノ撤兵ヲ要望ス）等ニ関スル彼我見解ノ対立モアリタルモ従来交渉ノ経緯ニ徴スレハ根本ノ難関ハ寧ロ米側ニ於テ国際関係処理ニ関スル其ノ伝統的理念即チ過般ノ英米洋上会談ニ表ハレタルト同様ノ原則的理念ヲ固執セル点ニ在リ要スルニ米側ノ真意ハ日独伊ノ欧亜ニ於ケル新秩序建設[210面]（即チ三国条約ノ目的）ヲ否認妨碍セント欲スルモノニシテ帝国カ独伊ト提携スル限リ日米友好関係ノ維持ハ困難ナリト為シ此ノ見地ヨリ逐ニハ恰モ帝国ノ三国条約離脱ヲ要求スルカノ態度ヲ示スニ至リタルカ右ハ交渉最後ノ段階ニ至リ即チ最近数日間ノ折衝ニ依リ愈明日トナリタルヲ以テ帝国ハ事茲ニ至リテハ此ノ上ノ交渉継続ハ殆ト無益ナリト認メサルヲ得サルニ至レリ\n三、二十六日米国政府ノ提示セル対案ハ前記態度ヲ更ニ明カニセルモノニシテ三国条約ニ関シテハ「両国政府ノ一方カ第三国ト締結シ居ル如何ナル協定モ本協定ノ根本目的即チ太平洋全域ノ平和確保ニ矛盾スルカ如ク解釈セラレサルヘキコトニ同意ス」云々トアリ右ハ帝国ノ三国条約義務解釈ヲ拘束シ以テ米国カ不日欧州戦争ニ参入スル場合帝国ヲシテ独伊援助ヲ差控ヘシメントスル企図ニ出ツルモノナルコト明瞭ニシテ他ノ諸問題ハ兎ニ角トシ本項ノミヲ見ルモ米側提案ハ交渉ノ基礎トスルコト能ハストシテ認メタリ尚米国政府ハ本案提示ニ先立チ頻リニ英、豪、蘭（支）等諸国ト協議ヲ重ネタル事実アリ従ツテ米国ハ今ヤ右諸国ト共ニ帝国ヲ独伊ト共ニ敵視スルモノナルコト察知セラル", "notes": ["「リッペン」은 리벤트로프(Joachim von Ribbentrop) 독일 외상의 약칭 표기이다.", "「チ」外相은 이탈리아 외상 치아노(Galeazzo Ciano)의 약칭 표기이다.", "「三国条約」은 1940년 9월의 일독이 삼국동맹조약이다.", "「客年」은 작년(1940년)을 뜻한다.", "「嚮ニ」는 「앞서·이전에」의 뜻이다.", "「英米洋上会談」은 1941년 8월의 대서양 회담(대서양헌장)을 가리킨다.", "「支那」·「仏印」·「欧亜」·「蘇連邦」은 당대 표기 그대로 두었다.", "「不日」은 「머지않아」의 뜻이다.", "「建前」은 여기서는 「명분·표방하는 방침」의 뜻이다."], "warn": false, "pages": ["nichibei2_05_025", "nichibei2_05_026", "nichibei2_05_027"], "search": "東郷茂徳 (도고 시게노리) — 외무대신 大島浩 (오시마 히로시) — 주독 대사 (본문 표기는 「在独国大島大使」) 「ヒトラー」 (히틀러, Adolf Hitler) — 총통 「リッペン」 (리벤트로프, Joachim von Ribbentrop) — 독일 외상 「ムッソリーニ」 (무솔리니, Benito Mussolini) — 이탈리아 수상 「チ」 (치아노, Galeazzo Ciano) — 이탈리아 외상"}, {"id": "426", "order": 426, "date": "1941-11-30", "group": "D", "eyebrow": "문서 426 · 日米交渉の進捗状況につき汪主席に内報について", "title": "일미교섭의 진척 상황을 왕(汪) 주석에게 내보(内報)한 건에 관하여", "list_right": "문서 426", "meta": [{"k": "일자", "v": "1941-11-30"}, {"k": "원
