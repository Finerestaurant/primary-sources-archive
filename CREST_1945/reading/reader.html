 란이 판독되지 않는다) Economic Information: Currency in Dairen"}, {"id": "M14", "order": 24, "date": "1946-12-23", "group": "B", "eyebrow": "1946 만주·북조선 · 현장 첩보보고", "title": "경제 및 군사 첩보: 안둥의 소련 측 활동", "badge": "U.S. OFFICIALS ONLY (기밀등급 표시는 판독되지 않는다)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1946-12-23"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Economic and Military Information: Antung Soviet Activities", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000200250005-1"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000200250005-1"}], "summary": "안둥 일대에서 소련군이 무엇을 쥐고 있고 무엇을 강 건너로 옮기는지를 여섯 항목으로 적었다. 노획 일본제 무기와 기계류가 압록강을 건넌다.", "points": ["압록강 철교와 안둥 시내의 라구사오 발전소가 여전히 소련군 경비 아래 있다.", "소련 측이 산다오망에 비밀 정보조직을 두고, 북조선에서 노획한 일본제 무기를 공산군에게 넘기는 일을 맡긴다.", "다량의 기계류가 안둥에서 강 건너 신의주로 옮겨졌다.", "안둥이 위협받을 때마다 성 부지사가 신의주로 건너가 소련군과 협의했다.", "공산군이 기관차 여러 대를 소련제 야포와 맞바꾸어, 안둥 철도에 기관차가 세 대만 남았다.", "중앙정보단이 머리에 주를 달아 안둥이 1946년 국민당군에게 넘어갔으므로 아래 사정은 이미 달라졌을 것이라고 밝힌다."], "primary": "[공개 승인 1999/09/08 : CIA-RDP82-00457R000200250005-1]\n\n미국 관리 전용(U.S. OFFICIALS ONLY)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)   25X1A2g\n\n첩보보고(INTELLIGENCE REPORT)\n\n일자:  25X1X6\n\n국가   중국\n주제   경제 및 군사 첩보: 안둥의 소련 측 활동\n배포(DIST.)  1944년 12월 23일 [원문 `23 Decenber 1944` 그대로]\n25X1A6a  면수  1\n보충(SUPPLEMENT)\n\n25X1X6\n\n출처(ORIGIN)  [삭제]\n\n[주: 안둥(Antung 安東) (124-23, 40-09)이 1946년 [판독 불가]에 국민당군에게 넘어간 뒤이므로  25X1X6  아래에 적은 사정은 틀림없이 달라졌을 것이다.]\n\n1. 압록강 철교와 안둥 시내의 라구사오(Lakushao) 발전소는 여전히 소련군의 경비 아래 있다.\n\n2. 소련 측은 산다오망(Santaomang) 또는 산다오랑터우(Santaolangtou) (12h-20, 40-03)에 비밀 정보조직을 두고 있다. 이 조직은 북조선에서 노획한 일본제 무기를 공산군에게 넘기는 일을 맡고 있다.\n\n3. 다량의 기계류가 안둥에서 강 건너 조선의 신의주(Shingishu 新義州) (124-26, 40-06)로 옮겨졌다.\n\n4. 안둥이 국민당군의 위협을 받을 때마다 성(省) 부지사가 신의주로 가서 소련군과 협의하였다.\n25X1A6a\n\n5. 소련군 운전병이 모는 소련군 화물차가 안둥과 좡허(Chuangho 莊河) 사이의 도로를 자주 오간다. 이들의 경로는 신의주와 다롄(Dairen 大連)을 거친다. [[판독 불가] 주: 이들이 안둥과 좡허를 거쳐 신의주에서 다롄으로 간다는 뜻으로 보인다.]\n\n6. 공산군은 기관차 여러 대를 소련제 야포와 맞바꾸었고, 지금 안둥 철도에는 기관차가 세 대밖에 없다.\n\n25X1A6a\n\n25X1X6\n\n25X1A9a", "secondary": "Approved For Release 1999/09/08 : CIA-RDP82-00457R000200250005-1\n\nU.S. OFFICIALS ONLY\n\nCENTRAL INTELLIGENCE GROUP   25X1A2g\n\nINTELLIGENCE REPORT\n\nDATE:  25X1X6\n\nCOUNTRY   China\nSUBJECT   Economic and Military Information: Antung [Soviet Activities]\nDIST.  23 Decenber 1944 [원문 그대로]\n25X1A6a  PAGES  1\nSUPPLEMENT\n\n25X1X6\n\nORIGIN  [삭제]\n\n[Note: Since Antung (124-23, 40-09) fell to the Nationalists  25X1X6  [판독 불가] 1946, conditions described below have no doubt changed.]\n\n1. The Yalu River Bridge and Lakushao Electric Power Plant in Antung City are still under Soviet guard.\n\n2. The Soviets have a secret service organization at Santaomang or Santaolangtou (12h-20, 40-03). This organization is in charge of delivering Japanese weapons captured in northern Korea to the Communists.\n\n3. Large shipments of machinery have been moved from Antung across the river into Shingishu, Korea (124-26, 40-06).\n\n4. Each time Antung was threatened by the Nationalists, the provincial deputy governor went to Shingishu to confer with the Soviet forces.\n25X1A6a\n\n5. Soviet army trucks with Soviet drivers frequently travel the highways between Antung and Chuangho. They are routed through Shingishu and Dairen. [[판독 불가] note: Presumably it is meant that they travel from Shingishu to Dairen via Antung and Chuangho.]\n\n6. The Communists have traded several locomotives for Soviet artillery, and there are now only three locomotives on the Antung Railroad.\n\n25X1A6a\n\n25X1X6\n\n25X1A9a", "notes": ["[삭제·공개 표시] Approved For Release 1999/09/08 : CIA-RDP82-00457R000200250005-1 (공개 승인 도장)", "[삭제·공개 표시] 25X1X6 (DATE 줄, 머리 주 안, 문서 끝)", "[삭제·공개 표시] 25X1A2g, 25X1A6a, 25X1A9a (여백의 면제 표시)", "[삭제·공개 표시] ORIGIN 줄의 출처 표시가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] 5항 끝 주의 작성자 표시가 판독되지 않는다"], "note": "배포일이 `23 Decenber 1944` 로 찍혀 있다. 색인의 날짜와 앞뒤 문서로 보아 1946년이 맞으나 날짜의 숫자는 고치지 않고 원문대로 두었다. 머리 주에서 안둥 함락 시점의 달 이름이 떨어져 나가 판독 불가로 두었다. 산다오망의 좌표 `12h-20, 40-03` 은 경도의 세 번째 자리가 h 로 찍혀 있다. 124로 보이나 숫자를 고치지 않았다. 안둥 `(124-23, 40-09)` 과 신의주 `(124-26, 40-06)` 은 온전하다. 2항의 지명이 `Santaomang` 과 `Santaolangtou` 두 가지로 찍혀 있어 원문의 두 표기를 다 살렸다. 표제의 `pa rary nannenpreae Information` 은 색인의 원제에 따라 Economic and Military Information 으로 읽었다. `sepenags weapons` 는 Japanese weapons 로, `Hationaliats` 는 Nationalists 로, `goveraer` 는 governor 로, `Shingisha` 는 Shingishu 로, `locorotives` 는 locomotives 로, `artiliery` 는 artillery 로 고쳤다. `Shingishu` 는 신의주의 일본식 표기이며 원문 표기를 살렸다.", "warn": false, "search": "Approved For Release 1999/09/08 : CIA-RDP82-00457R000200250005-1 (공개 승인 도장) 25X1X6 (DATE 줄, 머리 주 안, 문서 끝) 25X1A2g, 25X1A6a, 25X1A9a (여백의 면제 표시) ORIGIN 줄의 출처 표시가 먹칠되어 [삭제]로 옮겼다 5항 끝 주의 작성자 표시가 판독되지 않는다 Economic and Military Information: Antung Soviet Activities"}]</script>

, "d557"]]}, {"id": "1945-04-30", "date": "1945-04-30", "label": "히틀러 자살", "bar": true, "where": "베를린 총통관저", "note": "베를린 지하에서 히틀러가 자살하고 되니츠가 승계한다. 되니츠는 전쟁을 계속하겠다고 말했고, 연합국은 히틀러가 순교자로 남는 전설이 만들어지지 않도록 5월 2일 성명을 낸다.", "docs": [["veday-1945", "d75"]]}, {"id": "1945-05-01", "date": "1945-05-01", "docs": [["veday-1945", "d205"]]}, {"id": "1945-05-01-1", "date": "1945-05-01", "docs": [["veday-1945", "d203"]]}, {"id": "1945-05-02", "date": "1945-05-02", "label": "베를린 함락", "bar": true, "where": "베를린", "note": "소련군이 베를린을 함락했다. 이틀 전 히틀러가 자살했고 남은 것은 항복 절차뿐이었다. 미국 문서에 히틀러의 죽음은 부고가 아니라 「항복문서에 서명할 능력이 있는 중앙 권력이 없을 경우」라는 가정으로 나타난다.", "docs": [["veday-1945", "d560"]]}, {"id": "1945-05-04", "date": "1945-05-04", "docs": [["veday-1945", "d561"]]}, {"id": "1945-05-04-1", "date": "1945-05-04", "docs": [["veday-1945", "d562"]]}, {"id": "1945-05-04-2", "date": "1945-05-04", "docs": [["veday-1945", "d212"]]}, {"id": "1945-05-07", "date": "1945-05-07", "docs": [["veday-1945", "d566"]]}, {"id": "1945-05-07-1", "date": "1945-05-07", "docs": [["veday-1945", "d567"]]}, {"id": "1945-05-08", "date": "1945-05-08", "label": "독일 항복", "bar": true, "key": true, "where": "랭스 · 베를린", "note": "5월 7일 새벽 2시 41분 랭스에서 서명이 끝났으나, 발표는 8일까지 묶여 있었다. 스탈린은 동부전선에서 항복 명령이 이행될지 확실치 않다며 소련의 발표를 9일로 미뤘고, 8일 밤 베를린에서 다시 서명한다. 그날 서명한 것은 유럽자문위원회가 여덟 달 다듬어 온 항복문서가 아니라 초기 군사 조항만 담은 간이 문서였다.", "docs": [["veday-1945", "d224"]]}, {"id": "1945-05-10", "date": "1945-05-10", "docs": [["mofa-1945", "d951"]]}, {"id": "1945-05-10-1", "date": "1945-05-10", "docs": [["veday-1945", "d357"]]}, {"id": "1945-05-11", "date": "1945-05-11", "docs": [["surrender-1945", "d349"]]}, {"id": "1945-05-11-1", "date": "1945-05-11", "docs": [["field-1945", "tf58-5"]]}, {"id": "1945-05-12", "date": "1945-05-12", "docs": [["veday-1945", "d235"]]}, {"id": "1945-05-18", "date": "1945-05-18", "docs": [["mofa-1945", "d953"]]}, {"id": "1945-05-21", "date": "1945-05-21", "docs": [["surrender-1945", "d355"]]}, {"id": "1945-05-28", "date": "1945-05-28", "docs": [["surrender-1945", "d379"]]}, {"id": "1945-06-22", "date": "1945-06-22", "docs": [["surrender-1945", "d358"]]}, {"id": "1945-06-27", "date": "1945-06-27", "docs": [["surrender-1945", "d385"]]}, {"id": "1945-06-30", "date": "1945-06-30", "docs": [["mofa-1945", "d960"]]}, {"id": "1945-07-16", "date": "1945-07-16", "docs": [["surrender-1945", "d361"]]}, {"id": "1945-07-17", "date": "1945-07-17", "label": "포츠담 회담", "bar": true, "where": "베를린 근교 포츠담", "note": "트루먼·처칠(뒤에 애틀리)·스탈린의 회담. 회담 중 원폭 실험 성공이 보고되고, 대일 최후통첩의 문안이 다듬어진다."}, {"id": "1945-07-21", "date": "1945-07-21", "docs": [["mofa-1945", "d964"]]}, {"id": "1945-07-26", "date": "1945-07-26", "label": "포츠담 선언", "bar": true, "note": "미·영·중 명의로 일본에 무조건 항복을 요구했다. 제8항에 「카이로 선언의 조항은 이행되어야 한다」고 못박아, 조선 독립 약속이 항복 조건 안으로 들어온다. 일본은 이를 묵살(黙殺)한다고 발표했다."}, {"id": "1945-07-27", "date": "1945-07-27", "docs": [["mofa-1945", "d1079"]]}, {"id": "1945-08", "date": "1945-08", "docs": [["frus-1945", "d771"]]}, {"id": "1945-08-02", "date": "1945-08-02", "docs": [["surrender-1945", "d364"]]}, {"id": "1945-08-04", "date": "1945-08-04", "docs": [["surrender-1945", "d390"]]}, {"id": "1945-08-06", "date": "1945-08-06", "label": "히로시마", "bar": true, "key": true, "note": "히로시마에 원자폭탄이 투하됐다. 트루먼은 같은 날 성명을 내 「이제껏 없던 폭탄」임을 알리고 항복하지 않으면 파멸이 이어질 것이라 경고했다.", "disp": "08.06", "docs": [["surrender-1945", "d401"]]}, {"id": "1945-08-08", "date": "1945-08-08", "label": "소련 참전", "bar": true, "note": "소련이 일본에 선전포고하고 이튿날 만주로 진공했다. 얄타에서 약속한 「독일 항복 뒤 3개월」을 지킨 날짜다. 미국이 조선에 지상군을 두려면 시간이 없다는 것이 이날 분명해진다.", "disp": "08.08", "docs": [["surrender-1945", "d402"]]}, {"id": "1945-08-09", "date": "1945-08-09", "label": "나가사키", "bar": true, "note": "나가사키에 두 번째 원자폭탄이 투하됐다. 같은 날 밤 어전회의가 열려 국체 유지를 조건으로 한 항복 제의가 정해진다.", "docs": [["mofa-1945", "d1085"]]}, {"id": "1945-08-10", "date": "1945-08-10", "disp": "08.10", "docs": [["surrender-1945", "d406"]]}, {"id": "1945-08-10-1", "date": "1945-08-10", "disp": "08.10 06:45", "docs": [["mofa-1945", "d1086"]]}, {"id": "1945-08-10-2", "date": "1945-08-10", "disp": "08.10 18:00", "docs": [["mofa-1945", "d1091"]]}, {"id": "1945-08-11", "date": "1945-08-11", "label": "38선 획정", "bar": true, "key": true, "note": "일반명령 제1호(SWNCC 21/5)가 고쳐지면서 조선이 북위 38도로 갈렸다. 한 문서의 b항과 f항, 다섯 조항 사이에 조선이 둘로 나뉘어 적혔다. 합참이 든 이유는 미군에게 경성의 항만과 교통 지역을 주기 위해서였다.", "docs": [["surrender-1945", "d418"]]}, {"id": "1945-08-11-1", "date": "1945-08-11", "disp": "08.11", "docs": [["surrender-1945", "d410"]]}, {"id": "1945-08-11-2", "date": "1945-08-11", "disp": "08.11", "docs": [["surrender-1945", "d412"]]}, {"id": "1945-08-11-3", "date": "1945-08-11", "disp": "08.11", "docs": [["surrender-1945", "d418"]]}, {"id": "1945-08-11-4", "date": "1945-08-11", "disp": "08.11 10:46", "docs": [["surrender-1945", "d413"]]}, {"id": "1945-08-11-5", "date": "1945-08-11", "disp": "08.11 밤", "docs": [["mofa-1945", "d1093"]]}, {"id": "1945-08-12", "date": "1945-08-12", "disp": "08.12", "docs": [["surrender-1945", "d425"]]}, {"id": "1945-08-12-1", "date": "1945-08-12", "disp": "08.12", "docs": [["surrender-1945", "d427"]]}, {"id": "1945-08-14", "date": "1945-08-14", "disp": "08.14", "docs": [["surrender-1945", "d442"]]}, {"id": "1945-08-14-1", "date": "1945-08-14", "disp": "08.14", "docs": [["surrender-1945", "d431"]]}, {"id": "1945-08-14-2", "date": "1945-08-14", "disp": "08.14", "docs": [["surrender-1945", "d437"]]}, {"id": "1945-08-14-3", "date": "1945-08-14", "disp": "08.14", "docs": [["mofa-1945", "d1098"]]}, {"id": "1945-08-14-4", "date": "1945-08-14", "disp": "08.14 20:05", "docs": [["mofa-1945", "d1097"]]}, {"id": "1945-08-14-5", "date": "1945-08-14", "disp": "08.14 20:10", "docs": [["surrender-1945", "d440"]]}, {"id": "1945-08-15", "date": "1945-08-15", "label": "일본 항복", "bar": true, "key": true, "note": "일본이 포츠담 선언 수락을 방송으로 알렸다. 전날 밤 일부 장교들이 방송을 막으려 궁성을 봉쇄하고 총리 관저를 습격했으나 실패했고, 아나미 육군대신은 새벽에 자결했다.", "disp": "08.15", "docs": [["mofa-1945", "d1100"]]}, {"id": "1945-09-02", "date": "1945-09-02", "label": "항복문서 조인", "bar": true, "where": "도쿄만 미주리함", "note": "도쿄만의 미주리함 위에서 항복문서에 서명했다. 이 문서로 연합국최고사령관(SCAP)의 권한이 발효되고, 일반명령 제1호가 법적 효력을 갖는다."}, {"id": "1945-09-08", "date": "1945-09-08", "label": "미군 인천 상륙", "bar": true, "key": true, "note": "하지 중장의 제24군단이 인천에 상륙해 이튿날 조선총독부의 항복을 받았다. 미군정이 시작된다. 닷새 뒤 하지는 카이로의 「in due course」가 조선어로 「수일 내」로 옮겨져 퍼져 있었다는 것을 알게 된다."}, {"id": "1945-09-09", "date": "1945-09-09", "docs": [["scap-0141", "1"]]}, {"id": "1945-09-13", "date": "1945-09-13", "docs": [["scap-0141", "2"]]}, {"id": "1945-09-24", "date": "1945-09-24", "docs": [["scap-0141", "2-B"]]}, {"id": "1945-09-27", "date": "1945-09-27", "disp": "09.27", "docs": [["surrender-1945", "d507"]]}, {"id": "1945-10-10", "date": "1945-10-10", "disp": "10.10", "docs": [["surrender-1945", "d526"]]}, {"id": "1945-11-13", "date": "1945-11-13", "docs": [["field-1945", "toyoda-2"]]}, {"id": "1945-11-13-1", "date": "1945-11-13", "docs": [["field-1945", "toyoda-5"]]}, {"id": "1945-11-14", "date": "1945-11-14", "docs": [["field-1945", "toyoda-7"]]}, {"id": "1945-11-14-1", "date": "1945-11-14", "docs": [["field-1945", "toyoda-8"]]}, {"id": "1945-11-23", "date": "1945-11-23", "disp": "11.23", "docs": [["surrender-1945", "d488"]]}, {"id": "1945-12-27", "date": "1945-12-27", "label": "모스크바 3상회의", "bar": true, "key": true, "note": "미·영·소 외상이 조선에 최대 5년의 신탁통치를 두고 미소공동위원회를 설치하기로 합의했다. 카이로의 「적당한 시기」가 마침내 문서상의 기한이 된 자리이자, 조선 안에서 신탁통치 반대 운동이 폭발한 계기다."}, {"id": "1946-01", "date": "1946-01", "docs": [["scap-0141", "6"]]}, {"id": "1946-03-20", "date": "1946-03-20", "label": "1차 미소공동위", "bar": true, "where": "서울", "note": "임시정부 수립을 협의할 미소공동위원회가 열렸다. 어느 정당·사회단체와 협의할 것인가를 두고 갈라져 5월에 결렬된다."}, {"id": "1946-04", "date": "1946-04", "docs": [["scap-0141", "7-J"]]}, {"id": "1946-10-01", "date": "1946-10-01", "label": "대구 10월 사건", "bar": true, "note": "식량 공출과 경찰에 대한 항의가 대구에서 시작해 남한 전역으로 번졌다. 미군정이 계엄을 선포하고 진압했다. 점령 1년 만에 통치의 정당성이 시험대에 오른 사건이다."}, {"id": "1947-05-21", "date": "1947-05-21", "label": "2차 미소공동위", "bar": true, "where": "서울", "note": "미소공동위원회가 다시 열렸으나 같은 쟁점에서 다시 갈라져 10월에 사실상 끝난다. 미국은 이 무렵부터 조선 문제를 유엔으로 넘기는 쪽으로 방향을 바꾼다."}, {"id": "1947-09-17", "date": "1947-09-17", "label": "한국 문제 유엔 이관", "bar": true, "key": true, "note": "미국이 조선 문제를 유엔 총회에 상정했다. 4개국 신탁통치라는 전시 구상이 공식적으로 폐기되고, 처리의 무대가 미소 양자에서 유엔으로 옮겨간다."}, {"id": "1948-01-08", "date": "1948-01-08", "label": "유엔한국임시위원단 입국", "bar": true, "note": "유엔한국임시위원단(UNTCOK)이 서울에 들어왔다. 소련이 북위 38도 이북 입경을 거부해, 감시할 수 있는 지역에서만 선거를 치른다는 결론으로 이어진다."}, {"id": "1948-02", "date": "1948-02", "docs": [["ndl-091", "D024"]]}, {"id": "1948-04", "date": "1948-04", "docs": [["ndl-091", "D014"]]}, {"id": "1948-04-02", "date": "1948-04-02", "docs": [["korea-1948-50", "48-d776"]]}, {"id": "1948-04-28", "date": "1948-04-28", "docs": [["korea-1948-50", "48-d790"]]}, {"id": "1948-05-10", "date": "1948-05-10", "label": "5·10 총선거", "bar": true, "key": true, "note": "남한만의 제헌국회 선거가 치러졌다. 좌익과 김구·김규식 계열이 불참했다. 분단이 절차를 갖춘 사실이 되는 날이다."}, {"id": "1948-05-11", "date": "1948-05-11", "docs": [["korea-1948-50", "48-d797"]]}, {"id": "1948-05-15", "date": "1948-05-15", "docs": [["korea-1948-50", "48-d801"]]}, {"id": "1948-08-09", "date": "1948-08-09", "docs": [["korea-1948-50", "48-d862"]]}, {"id": "1948-08-15", "date": "1948-08-15", "label": "대한민국 정부 수립", "bar": true, "key": true, "note": "대한민국 정부가 수립되고 미군정이 끝났다. 카이로에서 「in due course」라고 적힌 지 4년 9개월 뒤다. 북에서는 9월 9일 조선민주주의인민공화국이 수립된다."}, {"id": "1948-08-17", "date": "1948-08-17", "docs": [["korea-1948-50", "48-d872"]]}, {"id": "1948-12-12", "date": "1948-12-12", "label": "유엔총회 결의 195(III)", "bar": true, "where": "파리 유엔총회", "note": "유엔 총회가 대한민국 정부를 위원단이 감시할 수 있었던 지역의 합법 정부로 승인했다. 「조선 전역의 유일 합법 정부」라는 뒷날의 표현과 결의문의 문언은 같지 않다.", "docs": [["korea-1948-50", "48-d924"]]}, {"id": "1948-12-17", "date": "1948-12-17", "docs": [["korea-1948-50", "48-d926"]]}, {"id": "1948-12-22", "date": "1948-12-22", "docs": [["korea-1948-50", "48-d928"]]}, {"id": "1949-03-22", "date": "1949-03-22", "docs": [["korea-1948-50", "49-d209"]]}, {"id": "1949-06-11", "date": "1949-06-11", "docs": [["korea-1948-50", "49-d262"]]}, {"id": "1949-06-26", "date": "1949-06-26", "label": "김구 피살", "bar": true, "key": true, "where": "서울 경교장", "note": "한국독립당 위원장 김구가 육군 소위 안두희의 총에 죽었다. 무초는 이튿날 「공식·비공식 여러 경로에서 지금까지 모은 바」로 시작하는 전문을 올린다 — 전날 첫 전문에는 아무 세부사항이 없었다."}, {"id": "1949-06-27", "date": "1949-06-27", "docs": [["korea-1948-50", "49-d265"]]}, {"id": "1949-06-27-1", "date": "1949-06-27", "docs": [["korea-1948-50", "49-d266"]]}, {"id": "1949-06-29", "date": "1949-06-29", "label": "주한미군 철수 완료", "bar": true, "key": true, "where": "서울", "note": "전투부대 철수가 끝나고 군사고문단(KMAG) 약 500명만 남았다. 철수 날짜를 이승만과 매듭짓는 일이 1949년 전반기 대사관 전문의 주된 내용이었다."}, {"id": "1949-10-01", "date": "1949-10-01", "label": "중화인민공화국 수립", "bar": true, "where": "베이징", "note": "국공내전이 사실상 끝났다. 무초는 다섯 달 전 이승만에게 중국의 결과가 조선에 당장 자국을 남기지는 않으리라고 말했었다."}, {"id": "1950-01-12", "date": "1950-01-12", "label": "애치슨 연설", "bar": true, "key": true, "where": "워싱턴 내셔널프레스클럽", "note": "애치슨이 미국의 태평양 방위선을 알류샨–일본–류큐–필리핀으로 그었다. 조선은 그 선 안에 들지 않았다. 이승만이 아홉 달 전 무초에게 우려한 바로 그 이야기다."}, {"id": "1950-01-20", "date": "1950-01-20", "docs": [["korea-1948-50", "50-d3"]]}, {"id": "1950-06-09", "date": "1950-06-09", "docs": [["korea-1948-50", "50-d46"]]}, {"id": "1950-06-14", "date": "1950-06-14", "docs": [["korea-1948-50", "50-d53"]]}, {"id": "1950-06-19", "date": "1950-06-19", "docs": [["korea-1948-50", "50-d57"]]}, {"id": "1950-06-23", "date": "1950-06-23", "docs": [["korea-1948-50", "50-d58"]]}, {"id": "1950-06-25", "date": "1950-06-25", "label": "한국전쟁 발발", "bar": true, "key": true, "where": "38선 전역", "note": "북한군이 38선 전역에서 남침했다. 유엔 안전보장이사회는 같은 날 결의 82호로 적대행위 중지와 38선 이북으로의 철수를 요구했다.", "docs": [["korea-1950-53", "50-d62"]]}, {"id": "1950-06-27", "date": "1950-06-27", "label": "안보리 결의 83호", "bar": true, "key": true, "where": "뉴욕 유엔 안보리", "note": "안보리가 회원국에 대한민국을 돕는 데 필요한 지원을 권고했다. 소련 대표는 중국 대표권 문제로 회의를 비우고 있어 거부권이 행사되지 않았다.", "docs": [["korea-1950-53", "50-d130"]]}, {"id": "1950-07-07", "date": "1950-07-07", "docs": [["korea-1950-53", "50-d238"]]}, {"id": "1950
