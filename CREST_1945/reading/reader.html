<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>조선을 밖에서 보다 — 열람기</title>
<style>
:root{
  --bg:#eef1f4; --panel:#f7f9fa; --edge:#ccd4da; --edge-soft:#dde4e9;
  --ink:#16202a; --ink-2:#4a5b68; --ink-3:#71828f;
  --stamp:#8c2f39;            /* 기밀등급 도장의 자주색 */
  --link:#2f5d86;
  --a:#4a7c59; --b:#8a6d3b; --c:#3f6d8c; --d:#7a4a6b; --e:#5a6f7d; --x:#8a8f94;
  --term-line:#9db0c2; --term-bg:rgba(47,93,134,.05);
  --term-line-go:#7fa3c4; --term-bg-go:rgba(47,93,134,.10);
  --term-bg-on:rgba(47,93,134,.17);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",
         -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
    --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
    --stamp:#c9707a; --link:#7fb0da;
    --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
    --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
    --term-bg-on:rgba(127,176,218,.22);
    --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
  }
}
:root[data-theme="dark"]{
  --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
  --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
  --stamp:#c9707a; --link:#7fb0da;
  --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
  --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
  --term-bg-on:rgba(127,176,218,.22);
  --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--link)}

.wrap{display:grid;grid-template-columns:minmax(300px,25%) 1fr;height:100vh}

/* 좁은 화면 — 목록을 위로 접어 올리면 본문이 설 자리가 없다.
   목록은 서랍으로 빼고 화면 전부를 문서에 준다. */
.mbar{display:none}
.scrim{display:none}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;grid-template-rows:1fr;padding-top:44px}
  .mbar{display:flex;align-items:center;gap:10px;
    position:fixed;top:0;left:0;right:0;height:44px;z-index:30;padding:0 12px;
    background:var(--panel);border-bottom:1px solid var(--edge)}
  .mbar button{background:var(--term-bg-go);border:1px solid var(--term-line-go);
    color:var(--link);border-radius:999px;padding:3px 11px;cursor:pointer;
    font:inherit;font-size:12px;font-family:var(--mono);white-space:nowrap}
  .mbar-t{font-size:12.5px;font-weight:650;color:var(--ink-2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail{position:fixed;top:0;bottom:0;left:0;z-index:40;
    width:min(88vw,340px);max-height:none;
    transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:0 0 30px rgba(0,0,0,.35)}
  body.railopen .rail{transform:none}
  .scrim{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45);border:0;padding:0}
  body.railopen .scrim{display:block}
  .toolbar{padding:7px 16px;gap:8px}
  .toolbar #themeBtn{display:none}
  .mbar-t{flex:1}
  .mbar-th{padding:3px 9px;font-size:13px}
  .seg button{padding:4px 9px;font-size:11.5px}
  .srcline{padding:10px 16px 0}
}
@media(prefers-reduced-motion:reduce){.rail{transition:none}}

/* ── 좌측 목록 ─────────────────────────────── */
.rail{border-right:1px solid var(--edge);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
.rail-head{padding:14px 14px 10px;border-bottom:1px solid var(--edge-soft);
  display:flex;flex-direction:column;gap:8px}
/* 문서철에 들어오면 나갈 길이 있어야 한다 */
.home{display:inline-flex;align-items:center;gap:5px;text-decoration:none;
  color:var(--link);font-size:11.5px;font-family:var(--mono);
  letter-spacing:.04em;width:fit-content;
  background:var(--term-bg-go);border:1px solid var(--term-line-go);
  border-radius:999px;padding:2px 10px 2px 8px}
.home:hover{background:var(--term-bg-on);border-color:var(--link)}
.home span{font-size:12px;line-height:1}
.brand{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font-weight:400;letter-spacing:0;text-transform:none;
  color:var(--ink-3);font-size:11.5px;margin-top:2px}
input[type=search]{width:100%;padding:7px 10px;border:1px solid var(--edge);
  border-radius:3px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
input[type=search]:focus,button:focus-visible,.item:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--edge);background:transparent;color:var(--ink-2);
  border-radius:999px;padding:2px 9px;font-size:11.5px;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sortbar{display:flex;gap:10px;font-size:11.5px;color:var(--ink-3);align-items:center}
.sortbar button{background:none;border:none;color:var(--ink-3);cursor:pointer;
  font:inherit;padding:0;border-bottom:1px solid transparent}
.sortbar button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.list{overflow-y:auto;flex:1;min-height:0}
.item{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--edge-soft);border-left:3px solid transparent;
  padding:9px 13px;cursor:pointer;font:inherit;color:inherit}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--bg);border-left-color:var(--ink)}
.item.tA{border-left-color:var(--a)} .item.tB{border-left-color:var(--b)}
.item.tC{border-left-color:var(--c)} .item.tD{border-left-color:var(--d)}
.item.tE{border-left-color:var(--e)} .item.tX{border-left-color:var(--x)}
.item-top{display:flex;justify-content:space-between;gap:8px;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.item-sum{font-size:12.5px;line-height:1.45;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 제목이 「국무장관이 주한대사에게」 꼴이라 무엇을 읽는 것인지 알 수 없다.
   요지 한 줄을 옅게 깔아 준다. 목록이 길어지지 않도록 두 줄에서 자른다. */
.item-hint{font-size:11.5px;line-height:1.4;margin-top:3px;color:var(--ink-3);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── 우측 본문 ─────────────────────────────── */
.main{overflow-y:auto;min-height:0}
.toolbar{position:sticky;top:0;z-index:5;background:var(--panel);
  border-bottom:1px solid var(--edge);padding:8px 26px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px}
.toolbar .grow{flex:1}
.seg{display:flex;border:1px solid var(--edge);border-radius:3px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 11px;cursor:pointer;
  font:inherit;font-size:12px;color:var(--ink-2);border-right:1px solid var(--edge)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.srcline{padding:10px 26px 0;font-size:11px;color:var(--ink-3);line-height:1.5}

/* ── 연대 바 ───────────────────────────────
   5년 반을 한 줄에 욱여넣으면 1945년 8월 열흘은 0.5% 밖에 안 된다. 그래서
   줄을 늘여 놓고 **띠 자체를 움직인다** — 지금 읽는 문서의 날짜가 늘 정중앙이다.
   문서를 옮기면 띠가 미끄러지고, 사건 이름은 겹치지 않게 위아래로 층을 나눈다. */
.chrono{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
  width:min(940px,calc(100vw - 48px));z-index:20;user-select:none;
  border:1px solid var(--edge);border-radius:8px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 20px rgba(0,0,0,.10);
  transition:box-shadow .2s ease}
.chrono:hover{box-shadow:0 6px 26px rgba(0,0,0,.18)}
/* 옅어지는 것은 **내용**이지 판이 아니다. 판까지 투명해지면 뒤의 본문이
   비쳐 들어와 글자가 서로를 밟는다. */
.chrono-track{opacity:.5;transition:opacity .2s ease}
.chrono:hover .chrono-track{opacity:1}

/* 띠가 지나가는 창. 손으로도 밀 수 있게 진짜 가로 스크롤을 쓴다 */
.chrono-vp{position:relative;overflow-x:auto;overflow-y:hidden;
  height:var(--chH,92px);border-radius:8px;cursor:grab;
  scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain}
.chrono-vp::-webkit-scrollbar{display:none}
.chrono-vp.drag{cursor:grabbing}
/* 안쪽 띠. 양옆 여백은 창의 절반 — 첫 문서도 마지막 문서도 가운데에 설 수 있게 */
.chrono-track{position:relative;height:100%;margin:0 var(--chPad,0px)}
/* 시간 축 — 층의 한가운데 */
.chrono-track::before{content:"";position:absolute;
  left:calc(0px - var(--chPad,0px));right:calc(0px - var(--chPad,0px));
  top:var(--axis,46px);height:1px;background:var(--edge)}

/* 연도 — 해가 바뀌는 자리에 선을 긋고, 그 선부터가 그 해다.
   이름표는 창 왼쪽에 들러붙는다. 1945년 한복판을 보고 있어도 「1945」가 남는다. */
.cy{position:absolute;top:0;bottom:0;
  border-left:1px solid color-mix(in srgb,var(--ink-3) 50%,transparent)}
.cy.alt{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.cy b{position:absolute;bottom:3px;font-family:var(--mono);font-size:11px;
  font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;
  line-height:1;letter-spacing:.06em;white-space:nowrap;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px}
/* 달·분기 눈금 — 해 안에서 어디쯤인지. 분기는 조금 길게 */
/* 1px 짜리 표는 좌표에 걸터앉혀야 한다. 왼쪽 모서리를 좌표에 맞추면 표가
   반 픽셀 오른쪽에 서서, 같은 날짜의 점과 어긋나 보인다. 아래 실·표도 같다. */
.cq{position:absolute;top:calc(var(--axis,46px) - 1.5px);width:1px;height:4px;
  margin-left:-.5px;background:var(--edge);opacity:.7}
.cq.q{top:calc(var(--axis,46px) - 2.5px);height:6px;opacity:1}
.cq[hidden]{display:none}

/* 배율 — 5년 반을 한눈에 볼 때와 8월 열흘을 벌려 볼 때가 같을 수 없다 */
.chrono-zoom{position:absolute;right:6px;top:5px;z-index:3;display:flex;gap:3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-zoom,.chrono-zoom:focus-within{opacity:1}
.chrono-zoom button{width:19px;height:19px;padding:0;line-height:1;
  font-family:var(--mono);font-size:12px;color:var(--ink-2);cursor:pointer;
  background:var(--panel);border:1px solid var(--edge);border-radius:3px}
.chrono-zoom button:hover:not(:disabled){color:var(--link);border-color:var(--link)}
.chrono-zoom button:disabled{opacity:.35;cursor:default}
.chrono-scale{position:absolute;right:6px;bottom:3px;z-index:3;
  font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.03em;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-scale{opacity:1}

/* 사건 점 — 이름에서 내려오는 실보다 위다. 실이 점 위를 지나가면
   점이 실에 꿰뚫린 것처럼 보이고, 어느 것이 사건 자리인지 흐려진다. */
.cm{position:absolute;top:calc(var(--axis,46px) - 3px);width:7px;height:7px;
  margin-left:-3.5px;border-radius:50%;background:var(--ink-3);z-index:2;
  border:1.5px solid var(--panel);cursor:help;
  transition:background .15s ease,transform .15s ease}
.cm.key{background:var(--stamp);width:9px;height:9px;margin-left:-4.5px;
  top:calc(var(--axis,46px) - 4px)}
.cm:hover{background:var(--link);transform:scale(1.45)}

/* 사건 이름 — 층(lane)을 나눠 위아래로 흩는다. 여기서 겹침이 풀린다 */
.cl{position:absolute;transform:translateX(-50%);white-space:nowrap;z-index:1;
  font-family:var(--mono);font-size:10px;line-height:1.1;color:var(--ink-2);
  letter-spacing:.01em;padding:1px 4px;border-radius:2px;cursor:help;
  background:color-mix(in srgb,var(--panel) 70%,transparent)}
.cl.key{color:var(--stamp)}
.cl:hover,.cl:focus-visible{color:var(--link);outline:0;
  background:color-mix(in srgb,var(--link) 12%,var(--panel))}
/* 이름에서 축까지 내려/올려 긋는 실 — 어느 점의 이름인지 알아보게 */
.cl::after{content:"";position:absolute;left:calc(50% - .5px);width:1px;
  background:var(--edge)}
.cl.up::after{top:100%;height:var(--leg,0px)}
.cl.dn::after{bottom:100%;height:var(--leg,0px)}

/* 지금 읽는 문서가 놓인 자리. 문서를 고르면 이 표가 창 한가운데로 온다.
   손으로 띠를 밀면 표는 제 날짜에 남는다 — 표는 시간에 박혀 있지 창에 박혀 있지 않다. */
.chrono-cursor{position:absolute;top:0;bottom:0;width:1px;z-index:3;
  margin-left:-.5px;background:var(--stamp);pointer-events:none}
/* 가상 요소는 위의 *{box-sizing:border-box}가 닿지 않는다 — 여기서 직접 잡아 주지
   않으면 테두리 2px 만큼 표시가 축 아래·오른쪽으로 밀려 앉는다. */
.chrono-cursor::before{content:"";position:absolute;box-sizing:border-box;
  left:-6px;top:calc(var(--axis,46px) - 6px);width:13px;height:13px;
  border-radius:50%;background:var(--stamp);border:2px solid var(--panel)}
/* 날짜는 맨 아래, 표 바로 밑에 — 위쪽은 사건 이름 층에 내준다 */
.chrono-date{position:absolute;bottom:2px;transform:translateX(-50%);
  font-family:var(--mono);font-size:10px;color:var(--stamp);
  font-variant-numeric:tabular-nums;background:var(--panel);
  padding:0 5px;border-radius:2px;white-space:nowrap;z-index:3}
.chrono[data-nodate="1"] .chrono-cursor,
.chrono[data-nodate="1"] .chrono-date{display:none}

/* 좁은 화면에서도 연대 바는 남긴다 — 이 화면의 절반은 「언제인가」이다.
   폭을 화면 끝까지 늘리고, 손가락으로 미는 것이 이미 되므로 줌 단추는 접는다. */
@media(max-width:900px){
  .chrono{bottom:8px;width:calc(100vw - 16px);border-radius:6px}
  .chrono-zoom{display:none}
  .chrono-track{opacity:1}
}
@media(prefers-reduced-motion:reduce){.chrono-track{transition:none}}

/* 아래쪽 여백은 떠 있는 연대 바가 마지막 문단을 덮지 않을 만큼 */
article{max-width:none;padding:26px 26px 190px}
@media(max-width:900px){article{padding:18px 16px 170px}}

/* ── 앞뒤로 넘기기 ─────────────────────────────
   목록을 다시 열지 않고도 이어 읽을 수 있어야 한다. */
.steps{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;
  margin-top:34px;padding-top:18px;border-top:1px solid var(--edge)}
.step{display:flex;flex-direction:column;gap:2px;text-align:left;
  border:1px solid var(--edge);border-radius:5px;background:transparent;
  padding:9px 12px;cursor:pointer;font:inherit;color:var(--ink-2);min-width:0}
.step.next{text-align:right;align-items:flex-end}
.step:hover{border-color:var(--link);color:var(--ink);background:var(--term-bg)}
.step-k{font-family:var(--mono);font-size:11px;color:var(--link);letter-spacing:.04em}
.step-d{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.step-t{font-size:13px;line-height:1.4;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.step.empty{display:flex;align-items:center;justify-content:center;border-style:dashed;
  color:var(--ink-3);font-size:12px;font-family:var(--mono);cursor:default}
.steps .step-n{align-self:center;font-family:var(--mono);font-size:11.5px;
  color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}

@media(max-width:900px){
  .steps{grid-template-columns:1fr;gap:8px}
  .steps .step-n{order:-1;text-align:center}
  .step.next{text-align:left;align-items:flex-start}
}
.doc-head{border-bottom:1px solid var(--edge);padding-bottom:14px;margin-bottom:18px}
h1{font-size:19px;margin:0 0 4px;line-height:1.35;text-wrap:balance;font-weight:650}
.docid{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  letter-spacing:.04em;font-variant-numeric:tabular-nums}
.stamp{display:inline-block;border:1.5px solid var(--stamp);color:var(--stamp);
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:1px 6px;
  border-radius:2px;transform:rotate(-1.2deg);margin-left:8px;vertical-align:2px}
.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:3px 20px;margin-top:10px;font-size:12.5px}
.meta div{display:flex;gap:7px}
/* 참석자 명단처럼 긴 값. 좁은 칸에 넣으면 한 글자씩 세로로 눌린다 */
.meta div.wide{grid-column:1/-1}
.meta b{color:var(--ink-3);font-weight:500;min-width:52px;font-size:11.5px}
.meta span{font-family:var(--mono);font-size:12px}
.meta span.txt{font-family:var(--sans);font-size:12.5px}

.points{margin:16px 0;padding:12px 16px;border-left:2px solid var(--edge);
  background:var(--panel);border-radius:0 3px 3px 0}
.points li{margin:3px 0}
.points ul{margin:0;padding-left:18px}

.cols{display:grid;gap:26px}
.cols.two{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.cols.two{grid-template-columns:1fr}}
.pane h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 8px;font-weight:600}
.body{white-space:pre-wrap;word-break:break-word}

<script id="data" type="application/json">[{"id": "L01", "order": 0, "date": "1945-02-01", "group": "A", "eyebrow": "1945 뉴욕 · OSS 외국인 전문가 조사", "title": "조선 현지 첩보", "badge": null, "list_right": "각서", "meta": [{"k": "일자", "v": "1945-02-01"}, {"k": "발신", "v": "Eric Straight 에릭 스트레이트 (Survey of Foreign Experts, New York 외국인 전문가 조사, 뉴욕)", "txt": true}, {"k": "수신", "v": "Major Duncan Lee 던컨 리 소령", "txt": true}, {"k": "종류", "v": "각서"}, {"k": "원제", "v": "Korean Field Intelligence", "txt": true}, {"k": "CREST 번호", "v": "0005657579"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/0005657579"}], "summary": "뉴욕에서 만난 전직 조선 선교사 다섯 명의 의견을 정리한 각서다. 백인 요원은 지금 조선에 들여보내면 살아남지 못하고, 조선 태생만 조건을 갖추면 쓸 수 있다고 본다.", "points": ["백인은 조선을 아무리 잘 알아도 지금 조건에서 들여보내면 쓸 만한 기간 동안 살아남을 가망이 사실상 없다고 본다.", "조선 태생은 뒤에 적은 조건을 갖추면 살아남아 어느 정도 쓸모가 있으리라고 본다.", "면담자는 메리놀회 신부 둘, 장로회 선교사 하나, 감리회 선교사 하나, 메리놀회 수녀 하나다. 이름은 모두 (b)(6)으로 지워져 있다.", "활동지가 지명으로 남는다. 축곶진(Chukochin)과 신의주(Shingishu), 황해(Kokai), 평양(Heijo), 평양에서 약 20마일 떨어진 영유(Youngyu)다. 둘은 1942년 그립스홀름호로 귀국했다.", "보갑제(Po Chia)를 근거로 든다. 열 집이나 그 배수를 한 조로 묶고 조마다 조장을 두어, 등록되지 않은 사람이 집에 있으면 8&4시간 안에 경찰에 신고하게 한다. 가까운 친척이든 잠깐 들른 손님이든 예외가 없고 어기면 벌이 아주 무겁다.", "조선인 대다수를 믿을 수 없다고 본다. 오래 눌려 지내고 경찰의 감시를 받으면서 사기가 떨어져, 전쟁 전 여러 해 잘 알고 지낸 서양인이라도 당국에 밀고하리라는 것이다.", "망명 조선인을 쓴다면 조선을 떠난 지 7~8년을 넘지 않아야 하고, 연락이 되는 동안 유지한 가까운 친족 관계가 있어야 한다. 활동 범위는 제 고향 마을 언저리로 묶이고, 기대할 것은 전해 들은 정보와 앞날의 정보원 확보다.", "북서 조선의 통제가 중부·남부보다 더 엄하다고 본다. 그 지역이 다른 곳보다 더 반일적이라고 여겨지기 때문이다."], "primary": "(b)(6)\n\n외국인 전문가 조사(Survey of Foreign Experts)        뉴욕\n던컨 리 소령(Major Duncan Lee)                1945년 2월 1일.\n에릭 스트레이트(Eric Straight) [판독 불가]\n\n공개 승인 일자: 2011년 6월 7일 (APPROVED FOR RELEASE DATE: 07-Jun-2011)\n\n조선 현지 첩보\n\n이 문서는 월요일의 대화를 확인하는 것으로, 그 자리에서 나는 위 주제에 관한 우리의 여러 면담에서 지금까지 얻은 결과를 간략히 개괄해 귀하에게 알려 드렸다. 이 의견들은 특히 북서 조선에 해당하며, 여러 면담자가 여러 해 거주한 지역이 바로 그곳이다. 다음과 같이 요약할 수 있다.\n\n1. 백인은 그 나라를 전에 얼마나 잘 알았든 상관없이, 현재의 조건에서 들여보낼 경우 쓸 만한 기간 동안 살아남을 가망이 사실상 없다.\n\n2. 조선 태생으로서 아래에 밝히는 일정한 정당성(justifications)을 갖춘 자라면, 목숨을 부지하고 어느 정도 쓸모가 있을 상당한 가망이 있다.\n\n이 주제를 함께 논의한 사람들은 다음과 같다.\n\n[삭제] [삭제] 이 두 사람은 모두 조선의 메리놀 가톨릭 선교회(Maryknoll Catholic Mission)에 소속되어 북서 지방에서 약 [판독 불가] 동안 살았고, 1942년 그립스홀름호(Gripsholm)로 본국에 돌아왔다. [삭제]는 자기 차를 가지고 있어 축곶진(Chukochin) 선교부에서 신의주(Shingishu)와 북서 조선의 다른 지방으로 자주 다녔다. [삭제]는 건축가였고 시간의 대부분을 선교 건물을 세우는 데 썼다. 그 일과 관련해 그는 자기 보급 트럭을 운영했다.\n\n[삭제]는 스무 해 동안 조선에서 장로회 해외선교부(Presbyterian Board of Foreign Missions)의 후원 아래 일했다. 그는 황해(Kokai)에 주재했고 그 둘레 지방을 대체로 잘 안다. 그는 1940년에 미국으로 돌아왔다.\n\n[삭제]는 감리회 선교사였고, 조선의 평양(Heijo) 지역에서 28년을 거주한 뒤 1941년에 본국으로 돌아왔다. 그가 맡은 일은 초등학교와 중등학교의 설립과 운영이었다. 그 일과 관련해 그는 그 나라의 다른 지방으로도 자주 다녔으나, 그가 가장 잘 아는 곳은 물론 자기가 있던 바로 그 지역이다.\n\n[삭제]는 메리놀 선교회(Maryknoll Mission Society)의 교육 담당 회원이며 열다섯 해 동안 영유(Youngyu)에 주재했다. 평양에서 약 20마일 떨어진 곳이다. 그 여자는 그립스홀름호로 1lodi [원문 그대로]년에 본국에 돌아왔다.\n\n위의 모든 사람에 관한 색인표(index slips)를 첨부하며, 이것이 더 자세한 약력을 제공할 것이다. 이 각서에서 이후로는 특정 의견을 색인 번호로 가리킨다.\n\n[판독 불가] 대상자 [판독 불가] 하나의 [판독 불가] 시도 [판독 불가] 그러한 [판독 불가] 은 거의 즉각적인 파국을 맞으리라고 [보았다]. [삭제]는 그런 요원에게 살아남을 가망이 더 낫다고 보았으나, 그마저도 확실히 미덥지 않게 여겼다. 시간 문제일 뿐이며 어쩌면 짧은 시간 안에 그 요원이 일본인에게 발각되리라고 느꼈기 때문이다.\n\n이러한 의견의 주된 이유는 다음과 같다.\n\n1. 일본인-조선인 경찰이 유지하는 지역 주민에 대한 촘촘한 감시. 이 통제는 중부와 남부 지방보다 북서 조선에서 다소 더 엄한데, 그 지역이 다른 지방보다 더 반일적이라고 여겨지기 때문이다. 그 결과 통제가 매우 엄하며, 물론 여기에는 엄격한 준수를 강요하는 보갑제(Po Chia system)가 포함된다. 이 제도는 모든 마을을 열 가구 또는 그 배수 단위의 조로 묶고 각 조에 한 사람을 조장으로 두는 것으로, 등록되지 않은 사람이 어떤 집에 있을 경우 8&4 [원문 그대로]시간 안에 경찰에 신고할 것을 요구한다. 이는 아무리 가까운 친척이든 아무리 잠깐 머무는 방문객이든 어떤 사람에게나 적용되며, 이 규정을 지키지 않을 때의 벌은 매우 무겁다.\n\n2. 현재의 조건에서 서양인(occidental)을 당국에 밀고하지 않으리라고 믿을 수 있는 조선인은 극히 적다는 판단. 우리 면담자들의 의견으로는, 전쟁 전 여러 해 동안 그들에게 좋게 잘 알려져 있던 사람이라 해도 이는 마찬가지다. 이는 오랜 기간에 걸친 일본의 지배와 그들의 촘촘한 경찰 감독 때문이며, 그것이 이 백성의 사기를 떨어뜨려 그들에게 [판독 불가] 을 거의 또는 전혀 의지할 수 없는 지경에 이르게 했다. 이 의견은 대상자 [삭제] 와 [삭제] 가 강하게 견지했다.\n\n[3면] 그러나 대상자 [삭제] 는 모두 일정한 사정 아래에서는 망명 조선인을 첩보 요원으로 쓸 수 있다는 의견이었다. 기본적인 신뢰성 문제는 별도로 하고, 그런 사람은 조선을 떠나 있은 기간이 너무 길지 않아야 하며, 곧 7년이나 8년을 넘지 않아야 하고, 연락이 가능한 동안 유지해 온 가까운 가족 관계가 있어야 한다. 다시 말해, [판독 불가] 그들 자신의 활동 범위는 자기 고을이나 마을의 [판독 불가] 구역으로 한정되어야 한다. 보호와 도움을 친척들의 충심에 의지해야 하기 때문이며, 그 친척들에게는 미등록자를 숨기는 데 따르는 매우 실제적인 위험보다 핏줄의 정이 더 무거울 것이기 때문이다. 이는 그러한 조선인 요원이 그 나라에 있는 동안 자기 개인의 이동에서 엄격히 제한받으리라는 뜻이지만, 그들이 값진 간접 정보를 얻고 가까운 친척을 그 용도로 삼아 앞날의 첩보 원천을 마련할 수는 있으리라고 본다.\n\n사본: 버나드 크놀렌버그 씨(Mr. Bernard Knollenberg)", "secondary": "(b)(6)\n\nSurvey of Foreign Experts        New York\nMajor Duncan Lee                February 1, 1945.\nEric Straight [판독 불가]\n\nAPPROVED FOR RELEASE DATE: 07-Jun-2011\n\nKorean Field Intelligence\n\nThis will serve to confirm Monday's conversation during which I gave you a brief outline of results so far obtained from our various interviews on the above subject. These opinions apply particularly to northwest Korea in which region the various interviewees resided for many years. They may be summarized as follows:\n\n1. A white man, regardless of previous familiarity with the country, would have virtually no chance of survival for any useful period of time if sent in under present conditions.\n\n2. A native-born Korean with certain justifications, as specified hereafter, would have a fair chance of keeping alive and being of some use.\n\nPeople with whom this subject was discussed were as follows:\n\n[삭제] [삭제] Both these men were attached to the Maryknoll Catholic Mission in Korea and lived in the northwestern region for about [판독 불가], returning to this country on the Gripsholm in 1942. [삭제] had his own car in which he traveled frequently from his Chukochin Mission to Shingishu and other parts of northwest Korea. [삭제] was an architect and spent most of his time in the erection of mission buildings. In connection with this he operated his own supply truck.\n\n[삭제] was for twenty years in Korea working under the auspices of the Presbyterian Board of Foreign Missions. He was stationed in Kokai and is generally familiar with the surrounding country. He returned to the United States in 1940.\n\n[삭제] was a Methodist missionary who returned to this country in 1941, after a residence of 28 years in the Heijo area of Korea. His particular job was the establishment and management of primary and secondary schools. In this connection he often traveled to other parts of the country although his greatest familiarity is of course with his own immediate area.\n\n[삭제] is a teaching member of the Maryknoll Mission Society and for fifteen years was stationed at Youngyu, approximately twenty miles from Heijo. She returned to this country on the Gripsholm in 1lodi [원문 그대로].\n\nIndex slips on all of the foregoing are attached and will provide you with more detailed biographies. Hereafter in this memorandum reference to specific opinions will be made by index numbers.\n\n[판독 불가] subject [판독 불가] an [판독 불가] undertaking [판독 불가] that su[ch] [판독 불가] would meet with almost immediate disaster. [삭제] gave such an agent a better chance of survival but even he was decidedly doubtful, feeling that it would be only a matter of time, and perhaps a short time, before the agent was discovered by the Japanese.\n\nThe principal reasons for these opinions are:\n\n1. The close surveillance over the local population which is maintained by the Japanese-Korean police. This control is somewhat stricter in northwest Korea than in the central and southern regions as the area is regarded as more anti-Japanese than other sections. As a result the controls are very strict and of course include the Po Chia system to which rigid adherence is insisted upon. This system, which consists of forming every community into groups of ten families or multiples thereof with one man as leader in each group, requires that the presence of an unregistered individual in a given house be reported to the police within 8&4 [원문 그대로] hours. This applies to any individuals, however close a relative or however transient a visitor, and the penalties for noncompliance with the regulation are very severe.\n\n2. The belief that very few Koreans could be trusted under existing conditions not to denounce an occidental to the authorities. In the opinion of our interviewees this would apply even though such a man had been well and favorably known to them for years prior to the war. This is due to the long period of Japanese domination and their close police supervision, which has lowered the morale of the people to a point where little or no reliance could be placed upon them to [판독 불가]. This opinion was strongly held by subjects [삭제] and [삭제].\n\n[Page 3] Subjects [삭제] were however all of the opinion that under certain circumstances exiled Koreans might be used as intelligence agents. Aside from the question of basic reliability, such men should not have been away from Korea too long, i.e., not over seven or eight years, and should have close family ties which they maintained as long as communication was possible. In other words, [판독 불가] their own field of operations would have to be confined to the [판독 불가] area of their own town or village as they would have to depend for protection and help upon the loyalty of relatives with whom the ties of blood would outweigh the very real element of danger in concealing a nonregistered individual. This would mean that such Korean agents would be strictly limited in their own personal movements while in the country, but it is thought that they would be able to obtain valuable second-hand information and establish sources of future intelligence, using close relatives for the purpose.\n\nCC: Mr. Bernard Knollenberg", "notes": ["[삭제·공개 표시] (b)(6). 문서 첫 줄", "[삭제·공개 표시] APPROVED FOR RELEASE DATE: 07-Jun-2011. 공개 승인 도장", "[삭제·공개 표시] 면담자 다섯 명의 이름이 모두 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] 본문 2면 첫 문단의 여러 줄이 먹칠 또는 판독 불가로 끊겨 있다"], "note": "OCR 원문의 낱말 뭉갬을 바로잡아 en 에 실었다. Korecn→Korean, Mejor Dunccn Lee→Major Duncan Lee, Februs ry→February, geve→gave, outiine→outline, obtiined→obtained, Méryknoll→Maryknoll, rrestyteriasn→Presbyterian 같은 것이다. 날짜와 숫자는 손대지 않았다. 그립스홀름호 귀국 연도가 `1lodi` 로 뭉개져 있는데 고치지 않고 그대로 두었다. 앞 문단의 1942년과 이 배의 교환 항해 시기를 보면 1943년으로 읽히지만 원문 글자가 그것을 뒷받침하지 않는다. 보갑제 신고 기한도 `8&4` 로 뭉개져 있어 그대로 두었다. 24시간인지 48시간인지 원문에서 가려낼 수 없다. 2항의 `jusiificstions` 는 `justifications`(정당성)로 읽어 옮겼다. 문맥으로는 `qualifications`(자격 요건)가 자연스럽고 L02 에 그 낱말이 실제로 나오지만, 글자가 justific- 에 가까워 고치지 않았다. 발신자 성 `Ststght`·`Lt ight` 는 Straight 로 읽었으나 확실하지 않다. 지명은 원문의 일본식 표기를 그대로 살리고 한국어를 붙였다. Shingishu 신의주, Kokai 황해, Heijo 평양, Youngyu 영유다. Chukochin 은 대응 지명을 확정하지 못해 원문 표기로만 두었다. 면담자 다섯 명의 이름은 모두 (b)(6) 사생활 면제로 지워져 있어 짐작해 채우지 않았다. `a white man`, `an occidental`, 조선인의 사기가 떨어져 믿을 수 없다는 평가는 1945년 미국 문서의 표현 그대로 옮겼다.", "warn": false, "search": "Duncan Chaplin Lee 던컨 채플린 리 (소령, 수신자) Eric Straight 에릭 스트레이트 (발신자, 성의 판독이 확실하지 않다) Bernard Knollenberg 버나드 크놀렌버그 (사본 수신) (b)(6). 문서 첫 줄 APPROVED FOR RELEASE DATE: 07-Jun-2011. 공개 승인 도장 면담자 다섯 명의 이름이 모두 먹칠되어 [삭제]로 옮겼다 본문 2면 첫 문단의 여러 줄이 먹칠 또는 판독 불가로 끊겨 있다 Korean Field Intelligence"}, {"id": "L02", "order": 1, "date": "1945-03-19", "group": "A", "eyebrow": "1945 뉴욕 · OSS 외국인 전문가 조사", "title": "작전 자료, 조선", "badge": null, "list_right": "각서", "meta": [{"k": "일자", "v": "1945-03-19"}, {"k": "발신", "v": "Eric Straight 에릭 스트레이트 (Survey of Foreign Experts, New York 외국인 전문가 조사, 뉴욕)", "txt": true}, {"k": "수신", "v": "Major Duncan C. Lee 던컨 C. 리 소령", "txt": true}, {"k": "종류", "v": "각서"}, {"k": "원제", "v": "Operational Data - Korea", "txt": true}, {"k": "CREST 번호", "v": "0005657586"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/0005657586"}], "summary": "조선에서 오래 지낸 면담자 한 사람에게서 요원 침투 방안을 캐낸 각서다. 백인은 쓸 수 없고 조선인 포로가 가장 나은 후보라고 본다. 3월 20일자 송부 서한이 뒤에 붙어 있다.", "points": ["백인 요원은 지금 조선에서 살아남을 가망이 거의 없다고 다시 확인한다. 산속에 얼마간 숨을 수는 있어도 작전상으로는 완전히 손발이 묶인다는 것이다.", "요원은 사람에 맞춰 임무를 짜야지 정해 둔 계획에 사람을 끼워 넣으면 안 된다고 본다. 성패가 개인의 사정에 크게 걸리기 때문이다.", "조선을 떠난 지 오래되면 지방 사투리와 억양을 잃어 그것만으로 곧바로 의심을 산다고 본다. 조선 안의 사투리 차이가 매우 뚜렷하다는 것이다.", "미국에 여러 해 있은 조선인과 최근까지 직접 당한 조선인의 감정을 갈라 본다. 「미국 조선인은 충분히 원한이 깊으나 그것은 이론적이고 직업적인 것이며 직접 겪은 것과는 다르다」고 한다.", "조선인 전쟁포로가 가장 나은 후보라고 본다. 일본인 곁에서 지내 현행 기록·통제에 밝고 가족의 근황을 비교적 최근까지 알기 때문이다. 일본에 세뇌되었을 가망은 낮게 본다.", "진입 방법으로 해안 상륙과 낙하산 투하를 든다. 해안은 인구가 조밀하므로 낙하산 쪽을 낫다고 보고, 나무가 없는 근처 산의 위쪽 비탈을 투하지로 꼽는다.", "신분 문제를 푸는 방안으로 가족 중 한 사람을 사라지게 하고 그 신분을 요원이 넘겨받는 것을 제안한다. 사진과 지문에 의한 신원 확인이 없고 기록이 문서로만 되어 있어 가능하다고 본다. 진주만 이후 그런 방법이 도입되었을 가망은 낮게 본다.", "면담자는 쉰 살가량이고 조선어가 뛰어나며 장로회 해외선교부에 있다. 워싱턴에 며칠 올 뜻을 밝혔다. 귀가 어두워 바쁜 사무실에는 맞지 않을 수 있으나 자문이나 조선인 면접에 쓸 만하다고 하고, 형편이 넉넉하지 않으니 비용을 대야 한다고 덧붙인다.", "3월 20일자 송부 서한에 배포 경로가 남는다. (a) 「Operational Date on Korea」와 (b) H. S. 모건 중령 앞 「Specified Information on Korea」를 각각 두 부씩 프레이지 소령에게 보내 아이플러 대령이 보게 하라고 적었다. 며칠 안에 조선에 있는 특정 인물들을 다룬 특별 「S」 보고서가 갈 것이라고도 적었다."], "primary": "외국인 전문가 조사(Survey of Foreign Experts), 뉴욕\n던컨 C. 리 소령(Major Duncan C. Lee)                1945년 3월 19일.\n에릭 스트레이트(Eric Straight)\n\n공개 승인 일자: 2011년 6월 7일 (APPROVED FOR RELEASE DATE: 07-Jun-2011)\n\n작전 자료, 조선\n\n다음의 기록은 같은 날짜로 문서 보안(Document Security)의 [삭제] 중령 앞으로 보낸 내 각서와 함께 읽어야 한다. 그 각서는 [삭제] 중령이 특별히 관심을 두는 여러 사항을 다루고 있으나, 그 사항들은 아래의 문단들과도 직접 관련이 있다.\n\n대상자는 지금 시점에 백인 요원이 조선에서 살아남을 가망이 거의 없다는 다른 면담자들의 의견을 확인해 주었다. 그는 얼마 동안 어느 산속 은신처에 숨어 지낼 수는 있을 것이나, 그것도 살아갈 방도를 찾을 수 있을 때의 이야기이며, 작전의 관점에서는 확실히 완전히 손발이 묶일 것이다.\n\n한편 대상자는 어떤 유형의 조선인이라면 쓸모 있게 살아남을 가망이 있다는 다른 면담자들의 견해도 확인해 주었다. 가장 알맞은 조선인의 유형을 규정해 달라는 요청을 받자 대상자는 다음과 같이 밝혔다.\n\n가장 중요한 점은 그 일을 하고자 하는 뜻을 스스로 가진 조선인, 그리고 그 목적을 위해 자기 나름의 계획이나 구상을 내놓을 수 있는 조선인을 찾는 것이다. 다시 말해 대상자는 계획의 세부를 가능한 한 그 개인의 능력에 맞추어야 하며, 그 개인을 특정한 작전 계획에 끼워 맞추려 해서는 안 된다고 제안한다. 그가 이 점을 드는 것은 그러한 작전의 성패가 개인의 사정에 크게 좌우될 수밖에 없기 때문이다. 그 사람은 구어의 발음을 잃지 않았을 만큼 최근까지 조선에 있었어야 한다. 구어에는 지방에 따른 차이가 매우 뚜렷하며, 이 나라에 너무 오래 있은 조선인은 제 지방의 억양을 잃었을 공산이 크고 그것만으로도 곧바로 의심을 받게 된다.\n\n또한 그 사람은 조선에 가까운 개인적 연고가 있어야 한다. 그의 생존이 친척과 어쩌면 가까운 벗들의 도움에 달려 있을 것이기 때문이다.\n\n덧붙여, 그리고 어쩌면 무엇보다 중요하게, 대상자는 조선인 요원을 고를 때 그의 반일 감정이 얼마나 강한지를 엄격히 살펴야 한다는 의견이다. 대상자는 여러 해 동안 미국에 있었던 조선인의 감정과, [2면] 몸소 그리고 비교적 최근에 [판독 불가] 에서 고초를 겪은 그 동포의 감정 사이에 상당한 차이를 둔다. 그의 말을 그대로 옮기면 「미국 조선인도 충분히 원한이 깊으나 그것은 이론적이고 직업적인 것이며, 직접 겪은 것과는 다르다」이다.\n\n앞의 이야기를 간추리면서 대상자는 이러한 자격 요건들이 겹치면 요원이 벌일 수 있는 활동의 범위와 규모가 그에 따라 정해질 수밖에 없다고 지적한다. 어떤 경우에는 그것을 폭넓게 잡을 수 있고, 다른 경우에는 사정이 그것을 상당히 제한할 수 있다. 그래서 그는 일을 사람에 맞출 것이지 그 반대가 되어서는 안 된다고 말한다.\n\n대상자는 자기 [판독 불가] 를 떠나 있은 지 여섯 해나 일곱 해 된 조선인을 쓸 가능성을 결코 배제하지 않으나, 그는 상당히 강하게 [판독 불가] 느낀다.\n\n[판독 불가] 조선인 전쟁포로를 [판독 불가] 할 가능성. 그의 [판독 불가] 이런 사람들 가운데 [일부가] 가장 나은 후보가 될 법하다. 그들은 십중팔구 일본인의 손에 몸소 고초를 겪었을 것이며, 어떤 경우든 일본인 가까이에서 지내 왔으므로 현행 기록과 통제 따위에 밝다. 게다가 그들은 자기 가족과 벗들의 현재 소재와 형편을 비교적 최근까지 알고 있을 것이고, 같은 까닭에서 이 나라에 여러 해 살아온 조선인들보다 그들에게 정으로 더 가까울 것이다.\n\n이와 관련해 대상자에게 그런 사람들의 신뢰성에 대한 생각을 물었다. 그는 그들 가운데 다수가 일본인에게 사상적으로 물들었을 가망은 적다는 의견이다. 오히려 그들이 극도로 원한이 깊을 공산이 훨씬 크다고 보며, 어떤 경우든 제대로 신문하면 이런 점들이 밝혀지리라고 여긴다.\n\n구체적인 방법과 수단을 묻자 대상자는, 요원이 기대할 수 있는 도움을 미리 어느 정도 알아 두는 것이 필수적인 만큼 여기서도 그런 사전 지식은 조선인 전쟁포로에게서 얻을 공산이 가장 크며, 계획은 물론 그 도움의 범위에 대한 그의 [판독 불가] 에 주로 근거해야 한다고 말했다. 요원이 제 가족의 근처에 이르기만 하면 도움을 기대할 수 있다고 어지간히 확신한다고 할 때, 다음에 오는 문제는 원하는 지역에 이르는 동안 발각을 피할 가장 유망한 방도다.\n\n[판독 불가] 진주만 이전의 여행 사정뿐 아니라 [판독 불가] 새로운 통제가 도입되었고 기존의 [판독 불가] 이 더 조여졌으므로, 처음부터 길게 이동하는 것은 무모하다고 보아야 한다. 이를 받아들인다면 [판독 불가] 요원은 해안에 상륙하거나 낙하산으로 투하되어야 하며, 어느 쪽이든 제 고향 고을이나 마을에 될 수 있는 대로 가까워야 한다.\n\n동봉한 [판독 불가]\n\n뒤의 방법을 쓴다면, 그리고 대상자는 해안을 따라 인구가 더 조밀하기 때문에 그쪽이 낫다고 여기는데, 그 경우 가까운 산의 위쪽 비탈이 제안된다. 조선은 산이 매우 많아서 요원의 고향 땅에서 그리 멀지 않은 곳에 그런 높은 지대가 있을 공산이 크다. 위쪽 비탈이 바람직하다고 보는 까닭은 그곳이 몇몇 예외를 빼고는 사람이 살지 않기 때문이며, 또 높은 산일수록 나무가 없는 경향이 있기 때문이다.\n\n요원의 신분은 물론 중요한 문제다. [판독 불가] 공식 [판독 불가] 없이 얼마 동안 살아남는 것은 [판독 불가] 이며, 그것도 오직 [판독 불가] 가까운 벗들이 제 몫을 다할 때, 그것도 충심뿐 아니라 필요한 신중함까지 갖추어 다할 때의 이야기다. 그러나 이는 관련된 모든 이에게 엄청난 부담이 될 뿐 아니라 원하는 목적을 이루지도 못할 것이다. 요원은 이동의 [자유]가 있어야 하며, 이를 위해 대상자는 사라지게 만들 수 있는 가족의 다른 구성원의 신분을 [넘겨받을] 것을 제안한다. 사진이나 지문에 의한 신원 확인 방법이 [없다는] 점이 중요해지는 것이 바로 이 대목이다. (물론 그런 방법이 진주만 이후 도입되지 않았다는 전제에서다. 대상자는 그럴 가망이 낮다고 본다.) 제 직계 가족 [안의] 쓸 만한 후보들에 대해 충분히 최근의 지식을 갖추었다면, 요원은 [도착]하는 즉시 이 친척 가운데 한 사람을 사라지게 할 [판독 불가] 채비를 갖추고, 그런 다음 그 사람의 신분을 넘겨받을 수 있다. [이 일]은 빠르게 이루어져야 하며 요원은 곧바로 활동할 현장으로 나아가야 하는데, 그곳은 제 고향 고을에서 얼마간 떨어진 곳이어야 한다. 그러나 이것이 이루어지고 요원과 그 가족 양쪽이 충분히 말을 맞추었다면, 요원은 활동지의 경찰 앞에서 분명하고 그럴듯한 이야기를 댈 수 있다. 즉각 조회가 이루어지겠지만 문서 기록만 쓰이는 만큼 그 조회에 아무런 문제가 없을 것이다.\n\n[판독 불가] 공산주의자 [판독 불가]\n\n나는 이 면담에서 확실히 [판독 불가] 호의적인 [인상]을 [판독 불가] 받았다. 귀하도 짐작하겠지만 [판독 불가] 일본 [판독 불가]. [대상자는] 쉰 살가량의 사람이며 지능이 평균 이상이다. 나는 그가 조선어에 매우 뛰어나고 그 나라에서 [판독 불가] 이 많다고 [본다]. 그는 장로회 해외선교부(Presbyterian Board of Foreign Missions)에 [있으며], 귀하가 조선과 관련된 이 문제나 다른 문제로 [만나기를] 바란다면 워싱턴에 며칠 올 뜻이 있다고 밝혔다. 그가 바쁜 사무실에 얼마나 잘 맞을지는 모르겠다. 귀가 어둡고 그 점을 다소 의식하는 듯하기 때문이다. 그러나 자문을 구하는 방식으로, 또는 가려 뽑은 조선인을 그들의 말로 면접하는 데 쓸 사람으로는 상당히 유용하다고 여길 만하다. 나는 그가 형편이 넉넉하지 않다고 어지간히 확신하므로, 드는 비용은 귀하가 댈 준비를 해 두어야 하리라고 본다.\n\n외국인 전문가 조사(Survey of Foreign Experts), 뉴욕        [판독 불가]\n\n던컨 C. 리 소령(Major Duncan C. Lee)                1945년 3월 £0 [원문 그대로]일.\n에릭 스트레이트(Eric Straight)\n\n던컨 귀하,\n\n월요일에 귀하와 이야기한 대로 이제 새 조선 자료를 동봉한다. 이 자료는 (a) 3월 19일자로 귀하 앞으로 보내는 「Operational Date on Korea」(조선 작전 자료)라는 제목의 각서 원본 한 부와 사본 세 부, 그리고 (b) 3월 19일자로 H. S. 모건 중령(Commander H. S. Morgan) 앞으로 보내는 「Specified Information on Korea」(조선에 관한 특정 정보)라는 제목의 각서 사본 세 부로 이루어진다.\n\n(a)와 (b)를 각각 두 부씩 프레이지 소령(Major Frazee)에게 보내 아이플러 대령(Colonel Eifler)이 보게 해 주기 바란다. 이는 귀하도 잘 알고 있는 기존의 약정에 따른 것이다.\n\n앞으로 며칠 안에 귀하는 지금 조선에 있는 특정 인물들을 다룬 특별 「S」 보고서도 받게 될 것이다.\n\n귀하가 이 자료를 상당히 급히 기다린다는 것을 알기에 처음 구술한 그대로 손보지 않고 보내며, 그래도 충분히 알아볼 수 있으리라고 생각한다.", "secondary": "Survey of Foreign Experts - New York\nMajor Duncan C. Lee                March 19, 1945.\nEric Straight\n\nAPPROVED FOR RELEASE DATE: 07-Jun-2011\n\nOperational Data - Korea\n\nThe following notes should be read in conjunction with my memorandum of even date addressed to Commander [삭제] of Document Security. This latter memorandum covers various points of specific interest to Commander [삭제] but these points also have a direct bearing on the following paragraphs.\n\nSubject confirmed the opinions of other interviewees to the effect that a white agent would have little chance of survival in Korea at the present time. He might be able to hide away in some mountain retreat for a time, always providing he could find some means of existence, but he would certainly be completely hamstrung from an operative standpoint.\n\nOn the other hand, subject also confirmed the ideas of other interviewees that certain types of Koreans would have a chance of useful survival. When asked to define the most suitable type of Korean, subject specified as follows:\n\nThe most important point is to find a Korean who himself had a desire to do the job and who could produce a plan or scheme of his own for the purpose. In other words, subject suggests that the details of the project should, as far as possible, be made to fit the capabilities of the individual rather than attempting to fit the individual into a specific plan of operation. He makes this point because the success or failure of such an operation must depend to a large extent on individual circumstances. The man must have been in Korea recently enough not to have lost his colloquial pronunciation. There are very distinct regional differences in colloquial speech and the Korean who has been in this country too long is more than likely to have lost his local accent which would in itself make him subject to immediate suspicion.\n\nFurthermore the man must have close personal ties in Korea as his survival will depend upon the assistance of relatives and perhaps close friends.\n\nIn addition, and perhaps most important of all, subject is of the opinion that the Korean agent must be chosen with strict attention to the intensity of his anti-Japanese sentiments. Subject draws a considerable distinction between the feelings of the Korean who has been in America for a number of years and his compatriot who [2면] has personally and comparatively recently suffered at [판독 불가]. In his own words \"The American Korean is bitter enough but theoretically and professionally, which is different from first-hand experience.\"\n\nIn summing up the foregoing, subject points out that a combination of these qualifications will inevitably mean that the scope and extent of the agent's operations will be controlled thereby. In one case it may be possible to make them comprehensive, in another circumstances may limit them considerably, hence his observation that the job should be fitted to the man and not vice versa.\n\nSubject by no means excludes the possibility of using Koreans who have been away from their [판독 불가] for six or seven [판독 불가] but he feels quite str[ongly] [판독 불가].\n\n[판독 불가] the possibility of [판독 불가] of Korean prisoners of war. In his [판독 불가] of these men might well prove the best bets. They have in all probability suffered personally at the hands of the Japanese; they have in any event been living close to the Japanese and are familiar with current records, controls, etc. Moreover they will be comparatively up to date on the present whereabouts and condition of their family and friends and, by the same token, will be sentimentally closer to the latter than those Koreans who have been living in this country for a number of years.\n\nIn this connection subject was questioned as to his feelings on the score of the reliability of such men. He is of the opinion that the chances are slight that many of them have become indoctrinated by the Japanese. On the contrary he believes that they are much more likely to be extremely bitter and, in any event, feels that proper questioning would clarify these points.\n\nQuestioned as to specific ways and means subject said that inasmuch as some foreknowledge of the assistance which an agent could anticipate would be essential, here again such foreknowledge is most likely to be found with the Korean prisoner of war and of course the plan must largely be based on his [판독 불가] of the extent of such assistance. Assuming that the agent is reasonably convinced that once he reaches the vicinity of his family he can count on aid, then comes the question of the most likely way to avoid detection in reaching the desired locality.\n\n[판독 불가] Pearl Harbor travel conditions but also [판독 불가] that new controls have been introduced and the existing [판독 불가] tightened up so that any extended initial journey should be regarded as unwise. If this is accepted [판독 불가] the agent must either be landed on the coast or dropped by parachute, and in both instances as close as possible to his home town or village.\n\nThe accompanying [판독 불가]\n\nIf the latter means are used, and subject feels they are preferable due to the greater density of population along the coast, then the higher slopes of a nearby mountain are suggested. Korea is very mountainous and the odds are that some such high ground exists not too far from the agent's home territory. The upper slopes are considered advisable both because they are, with few exceptions, unpopulated and because the tendency would be for the higher mountains to be bare of trees.\n\nThe agent's identity presents of course an important problem. It is [판독 불가] survive for a time without an official [판독 불가] as [판독 불가] only [판독 불가] close friends do their part, not only with loyalty but with the necessary discretion. However this would not only be a tremendous strain on all concerned but it would hardly accomplish the desired purpose. The agent must have [판독 불가] of movement and for this [판독 불가] subject suggests [판독 불가] the identity of another member of the family who [판독 불가] could be made to disappear. It is at this point that the [판독 불가] of photographic or fingerprint identification methods becomes important (always provided of course that such methods have not been introduced since Pearl Harbor. Subject regards this as unlikely.) Armed with sufficiently up to date knowledge of available candidates [판독 불가] his immediate family, the agent could at once upon [판독 불가] establish [판독 불가] arrangements for one of these relatives to disap[pear] [판독 불가] could then assume that man's identity. [판독 불가] would have to be done quickly and the agent should immediately proceed to the scene of his operations, which should be some distance removed from his home town. With this accomplished however and with both the agent and his family sufficiently posted, the former could then face the police at his point of operations with a clear-cut and feasible story. An immediate check would be made but inasmuch as only written records are used, such a check should involve no complications.\n\n[판독 불가] Communist [판독 불가]\n\nI would [판독 불가] have a decid[edly] [판독 불가] favorable [판독 불가] this interview which, as you will gather, [판독 불가] Japanese [판독 불가]. [판독 불가] a man of about 50 and above average in intelligence. I [판독 불가] that he has excellent Korean and great [판독 불가] in the country. He [판독 불가] at the Presbyterian [Board] of Foreign [Missions] [판독 불가] expressed his willingness to come to Washington for a few days should you wish to [판독 불가] on this or other subjects connected with Korea. I do not know how well he would fit into a busy office as he is hard of hearing and is, I think, somewhat self conscious on the point. However on a consultative basis or perhaps as a man who could be used to interview selected Koreans in their own language, you might find him of considerable use. I feel moderately certain that he is not well off so that I think you must be prepared to pay any expenses incurred.\n\nSurvey of Foreign Experts - New York        [판독 불가]\n\nMajor Duncan C. Lee                March £0 [원문 그대로], 1945.\nEric Straight\n\nDear Duncan,\n\nAs discussed with you on Monday, I now enclose the new Korean material. This consists of (a) an original and three copies of a memorandum to you on the subject \"Operational Date on Korea\" dated March 19th and (b) three copies of a memorandum to Commander H. S. Morgan on the subject \"Specified Information on Korea\" dated March 19th.\n\nWill you be good enough to send two copies each of (a) and (b) to Major Frazee for Colonel Eifler's attention. This is in accordance with a standing agreement with which I know you are familiar.\n\nIn the next few days you will also be receiving a special \"S\" report dealing with certain individuals now in Korea.\n\nKnowing that you are in a considerable hurry for this material I have let it go as first dictated and without the usual polish, but I think you will find it sufficiently clear.", "notes": ["[삭제·공개 표시] APPROVED FOR RELEASE DATE: 07-Jun-2011. 공개 승인 도장", "[삭제·공개 표시] 면담 대상자의 이름이 문서 전체에서 지워져 있고 subject 로만 불린다", "[삭제·공개 표시] 문서 보안 담당 Commander 의 이름이 본문에서 지워져 있다. 뒤에 붙은 송부 서한에는 Commander H. S. Morgan 으로 남아 있다", "[삭제·공개 표시] 2면 이하 여러 문단의 첫머리와 끝이 먹칠 또는 판독 불가로 끊겨 있다"], "note": "OCR 원문의 낱말 뭉갬을 바로잡아 en 에 실었다. Mejor Duncen C. bee→Major Duncan C. Lee, Xoree→Korea, opisioms→opinions, hanstrung→hamstrung, colioquial→colloquial, endoctrin ted→indoctrinated, vilo;es→slopes, sehhods→methods 같은 것이다. 날짜와 숫자는 손대지 않았다. 뒤에 붙은 송부 서한의 날짜가 `Merch £0, 1945` 로 뭉개져 있는데 고치지 않고 그대로 두었다. 20일로 읽히지만 원문 글자가 그대로 £0 이다. raw/index.json 이 이 문서에 붙인 날짜는 앞의 각서 날짜인 3월 19일이다. 제목의 `Operstionel Dete` 는 Operational Data 로 읽어 title_en 에 넣었다. 다만 CREST 색인 제목은 OPERATIONAL DATE 이고, 송부 서한 본문에도 \\\"Operational Date on Korea\\\" 로 적혀 있어 서한 부분에서는 그대로 두었다. 이 파일은 한 건이 아니라 두 건이다. 3월 19일자 각서 뒤에 3월 £0일자 송부 서한이 이어진다. 문서 보안 담당 Commander 의 이름이 각서 본문에서는 지워져 있으나 송부 서한에는 H. S. Morgan 으로 남아 있다. 각서 본문에서 먹칠된 이름은 짐작해 채우지 않고 [삭제]로 두었다. 면담 대상자의 이름은 문서 전체에서 지워져 있고 subject 로만 불린다. 2면 이하는 종이 상태가 나빠 문단의 첫머리와 끝이 여러 곳에서 끊긴다. `Communist` 로 시작하는 문단은 낱말 하나만 남아 있어 내용을 복원하지 않았다. 발신자 성 `Ststght`·`Steright` 는 Straight 로 읽었으나 확실하지 않다. 조선인 요원의 가족 중 한 사람을 사라지게 하고 그 신분을 넘겨받게 한다는 대목, 조선인 전쟁포로를 후보로 꼽는 대목은 1945년 원문 그대로 옮겼다.", "warn": false, "search": "Duncan Chaplin Lee 던컨 채플린 리 (소령, 수신자) Eric Straight 에릭 스트레이트 (발신자, 성의 판독이 확실하지 않다) H. S. Morgan H. S. 모건 (Commander 중령, 문서 보안) Major Frazee 프레이지 소령 Colonel Eifler 아이플러 대령 APPROVED FOR RELEASE DATE: 07-Jun-2011. 공개 승인 도장 면담 대상자의 이름이 문서 전체에서 지워져 있고 subject 로만 불린다 문서 보안 담당 Commander 의 이름이 본문에서 지워져 있다. 뒤에 붙은 송부 서한에는 Commander H. S. Morgan 으로 남아 있다 2면 이하 여러 문단의 첫머리와 끝이 먹칠 또는 판독 불가로 끊겨 있다 Operational Data - Korea"}, {"id": "L03", "order": 2, "date": "1945-03-26", "group": "A", "eyebrow": "1945 뉴욕 · OSS 외국인 전문가 조사", "title": "외국인 전문가 조사, 뉴욕", "badge": "confidential", "list_right": "각서", "meta": [{"k": "일자", "v": "1945-03-26"}, {"k": "발신", "v": "Eric Straight 에릭 스트레이트 (외국인 전문가 조사, 뉴욕)", "txt": true}, {"k": "수신", "v": "Major Duncan Lee 던컨 리 소령", "txt": true}, {"k": "종류", "v": "각서"}, {"k": "원제", "v": "SURVEY OF FOREIGN EXPERTS - NEW YORK", "txt": true}, {"k": "CREST 번호", "v": "0005657591"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/0005657591"}], "summary": "조선 인구 지도의 사진 확대본 두 장을 던컨 리 소령에게 보내며 한 장은 프레이지 소령을 거쳐 밀러 대령에게 넘겨 달라고 부탁한다.", "points": ["동봉물은 조선 인구 지도의 포토스탯 확대본 두 장이다.", "지도를 만든 사람의 이름이 원문에서 비어 있다. 만든 시점은 19£7년 5월로 적혀 있다.", "지도는 장로교 해외선교부가 내던 월보에 싣기 위해 제작된 것이다.", "같은 자료 한 벌이 K & A 앞으로도 갔다.", "동봉물 한 장은 프레이지(Frazee) 소령에게, 밀러(Miller) 대령이 보도록 넘겨 달라고 적었다.", "문서 머리에 CONFIDENTIAL 표시가 있다."], "primary": "공개 승인 (b)(6)\n일자: 08-Jun-2011\n\n외국인 전문가 조사, 뉴욕\nCONFIDENTIAL\n\n던컨 리 소령\t\t\tMarch £6, 1045 [날짜 숫자 원문 그대로]\n에릭 스트레이트\n\n조선 인구 지도의 포토스탯 확대본 두 장을 동봉한다. 흥미로우시리라 생각한다.\n\n이 지도는 [판독 불가] 가 19£7년 5월에 [날짜 숫자 원문 그대로] 장로교 해외선교부가 내는 월보에 싣기 위해 만든 것이다. 범례는 따로 설명이 필요 없다.\n\n또 한 벌은 K & A 앞으로 보냈다. 동봉물 가운데 한 장을 프레이지 소령에게 넘겨 밀러 대령이 보도록 해 주시면 고맙겠다.\n\nE.W.S.\n\n동봉물", "secondary": "APPROVED FOR RELEASE (b)(6)\nDATE: 08-Jun-2011\n\nSURVEY OF FOREIGN EXPERTS - NEW YORK\nCONFIDENTIAL\n\nMajor Duncan Lee\t\t\tMarch £6, 1045\nEric Straight\n\nI enclose two photostatic enlargements of a Korean population map which you may find of interest.\n\nThis map was prepared by [판독 불가] in May of 19£7, for publication in the monthly bulletin put out by the Presbyterian Board of Foreign Missions. The legend is self-explanatory.\n\nI have sent another copy to K & A and would appreciate your forwarding one of the enclosures to Major Frazee for Colonel Miller's attention.\n\nE.W.S.\n\nEnclosures", "notes": ["[삭제·공개 표시] APPROVED FOR RELEASE (b)(6)", "[삭제·공개 표시] DATE: 08-Jun-2011", "[삭제·공개 표시] (b)(6)"], "note": "OCR 원문의 표제는 `SURVEY OF FOREIGN EXPLATE - NEV YORK`, 기밀 표시는 `CONFIDENTIA!` 로 찍혀 있다. 낱말 철자로 보아 바로잡았다. 날짜 `Merch £6, 1045` 는 `March` 만 고치고 숫자는 원문대로 두었다. `£6` 은 26, `1045` 는 1945로 보이나 손대지 않았다. 지도 제작 시점 `19£7` 도 마찬가지다. 발신인 이름은 문서마다 `Stright`·`Stuight`·`Staight` 로 다르게 읽혔고 서명이 `E.W.S.` 인 점을 함께 보아 Straight 로 통일했다. `ColonebMiifler` 는 Colonel Miller 로 읽었으나 확실하지 않다. `Major*Frazee` 는 뒤 문서 L05의 `Major Freree` 와 같은 사람으로 보인다. 지도를 만든 사람의 이름 자리가 원문에서 비어 있다. 먹칠인지 스캔에서 빠진 것인지 가려지지 않아 판독 불가로 두었다.", "warn": false, "search": "Duncan Lee 던컨 리 (소령, 수신인) Eric Straight 에릭 스트레이트 (발신인, 서명 E.W.S.) Frazee 프레이지 (소령) Miller 밀러 (대령) APPROVED FOR RELEASE (b)(6) DATE: 08-Jun-2011 (b)(6) SURVEY OF FOREIGN EXPERTS - NEW YORK"}, {"id": "L04", "order": 3, "date": "1945-03-26", "group": "A", "eyebrow": "1945 뉴욕 · OSS 외국인 전문가 조사", "title": "「S」 보고 N-13610", "badge": null, "list_right": "각서", "meta": [{"k": "일자", "v": "1945-03-26"}, {"k": "발신", "v": "Eric Straight 에릭 스트레이트 (외국인 전문가 조사, 뉴욕)", "txt": true}, {"k": "수신", "v": "Major Duncan C. Lee 던컨 C. 리 소령", "txt": true}, {"k": "종류", "v": "각서"}, {"k": "원제", "v": "\"S\" Report N-13610", "txt": true}, {"k": "CREST 번호", "v": "0005657588"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/0005657588"}], "summary": "「S」 보고 N-13610 원본을 넘기면서 그 안의 이름이 문자로 치환된 것이고 해독표는 따로 간다고 알린다. 첨부된 보고는 조선에서 선교사로 지낸 미국인 면담 기록이다.", "points": ["3월 20일 자 각서에서 약속한 대로 「S」 보고 N-13610의 원본을 동봉한다.", "이런 자료를 다루는 관례대로 보고는 문자로 치환되어 있고, 해독표는 별도 전령 편에 간다.", "재배포 여부는 수신자의 판단에 맡기며 사본이 더 필요하면 보내 주겠다고 적었다.", "첨부 보고의 정보원은 60세 미국인이다. 장로교 해외선교부 소속으로 조선에 두 차례 살았고 1942년에 미국으로 돌아왔다.", "정보원은 조선어를 하며 그립스홀름호 선상에서, 그리고 1944년 9월과 11월에 각각 면담을 받은 적이 있다.", "정보원은 A 읍의 조선인 의사를 접촉 후보로 지목했다. 그 의사가 한때 일본에 맞서 일할 뜻을 밝혔다고 한다.", "의사의 이름은 외국식 성 C 밖에 기억하지 못하나, 그 아내는 A의 E 소속 D의 활동 회원으로 정보원이 잘 안다.", "정보원은 신분 확인만 제대로 되면 두 사람이 협력하거나 최소한 다른 접촉선을 알려 줄 것으로 보며, 그 신분 확인을 자신이 해 주겠다고 했다.", "면담자는 앤서니 코넬(Anthony Cornell)이다."], "primary": "공개 승인\n일자: 08-Jun-2011\n\n외국인 전문가 조사, 뉴욕\n\n던컨 C. 리 소령\t\t\tMarch £6, 1945 [날짜 숫자 원문 그대로]\n에릭 스트레이트\n「S」 보고 N-13610\n\n3월 20일 자 내 각서에서 약속한 대로, 이제 「S」 보고 N-13610의 원본을 동봉한다.\n\n이런 자료를 다룰 때의 우리 관례대로 이 보고는 「문자로 치환」되어 있으며, 해독표 자체는 별도의 전령 편으로 받게 될 것이다.\n\n이 자료를 더 배포할 것인지는 귀하의 판단에 맡긴다. 혹 사본이 더 필요하다면 기꺼이 한 벌 더 보내겠다.\n\n[판독 불가 - 서명]\n\n동봉물\n\n\n외국인 전문가 조사\n5번가 630번지\n뉴욕 시\n\n# 8913610\t\t\tMarch 2, 1045 [문서번호와 날짜 숫자 원문 그대로]\n[판독 불가]: 조선\n[판독 불가]: 미국인, 60세. 대상자는 1694년부터 1206년까지, 그리고 다시 1921년부터 1942년까지 조선에 거주했으며 [연도 숫자 원문 그대로] 장로교회 해외선교부 아래에서 선교 사업에 종사하다가 1942년에 미국으로 돌아왔다. 그는 조선 안을 널리 다녔는데 주로 북경상(北慶尚, North Keisho, 경상북도)과 황해(黄海, Kokai, Hwanghae) 두 도였다. 그는 조선어를 하며 그립스홀름호 선상에서, 그리고 1944년 9월에 415에 의해, 1944년 11월에는 미니애폴리스의 해군정보국(ONI)에 의해 조선에 관한 면담을 받았다. 그는 현재 뉴욕 주 뉴욕의 장로교회 해외선교부에 몸담고 있다.\n\n조선 정세에 관한 면담이 진행되는 가운데 대상자는 그 나라 안에서 접촉이 가능한 인물에 관해 질문을 받았다. 이와 관련해 그는 A 읍의 조선인 의사 한 사람을 거명했다. 이 사람은 본래 B 출신이며 한때 대상자에게 일본인들에 맞서 일할 뜻이 있다고 말한 적이 있다. 유감스럽게도 대상자는 그를 외국식 성 C 로밖에 식별하지 못했다. 그러나 그 의사의 아내는 대상자가 매우 잘 아는데, 그 여자가 A 에 있는 E 의 D 에서 활동 회원이었기 때문이다. 그 여자의 조선 이름은 F 였고 선교사들 사이에서는 G 로도 알려져 있었다.\n\n대상자는 그 아내가 영어를 꽤 유창하게 읽으며 남편은 A 에서 자기 소유의 작은 병원을 운영한다고 덧붙였다.\n\n대상자는 신분이 제대로 확인되기만 하면 그들이 십중팔구 협력하거나 적어도 다른 쓸모 있는 접촉선을 알려 줄 것이라고 믿는다. 대상자 자신이 그러한 신분 확인을 해 줄 뜻이 있다.\n\n앤서니 코넬, 면담자", "secondary": "APPROVED FOR RELEASE\nDATE: 08-Jun-2011\n\nSurvey of Foreign Experts - New York\n\nMajor Duncan C. Lee\t\t\tMarch £6, 1945\nEric Straight\n\"S\" Report N-13610\n\nAs promised in my memorandum of March 20th, I now enclose the original of \"S\" report N-13610.\n\nAs is our custom in handling such material, the report is \"keyed\" and you may expect the key itself by a separate courier.\n\nThe matter of further distribution of this material is one which we leave to your own judgment. If by chance you need an extra copy we shall be glad to send one along.\n\n[판독 불가 - 서명]\n\nEnclosures\n\n\nSURVEY OF FOREIGN EXPERTS\n630 Fifth Avenue\nNew York City\n\n# 8913610\t\t\tMarch 2, 1045\n[판독 불가]: KOREA\n[판독 불가]: American, 60 years old. Subject lived in Korea from 1694 to 1206, and again from 1921 to 1942, engaged in missionary work under the Board of Foreign Missions of the Presbyterian Church, returning to the United States in 1942. He traveled widely in Korea, principally in the provinces of North Keisho (North Kyongsang) and Kokai (Hwanghae). He speaks Korean and was interviewed on Korea aboard the Gripsholm and by 415 in September 1944 and by ONI, Minneapolis, in November 1944. He is now connected with the Board of Foreign Missions of the Presbyterian Church in New York, N.Y.\n\nIn the course of an interview on Korean conditions, subject was questioned regarding possible contacts within the country. In this connection he suggested a Korean physician in the town of A. This man originally hailed from B and at one time expressed himself to subject as being willing to work against the Japanese. Unfortunately subject was only able to identify him by the foreign surname of C. However, the doctor's wife is very well known to subject as she was an active member of the D of the E in A. Her Korean name was F and she was known to missionaries also as G.\n\nSubject added that the wife reads English quite fluently and also that her husband operates his own small hospital in A.\n\nIt is subject's belief that they would in all probability cooperate or at least suggest other useful contacts provided proper identification was given. Subject would be willing to supply such identification himself.\n\nAnthony Cornell, Interviewer", "notes": ["[삭제·공개 표시] APPROVED FOR RELEASE", "[삭제·공개 표시] DATE: 08-Jun-2011"], "note": "보고서 번호는 본문 각서에서 `N-13610`, 첨부 보고 머리에서는 `# 8913610` 으로 읽힌다. 같은 문서를 가리키는 것으로 보이나 문서번호는 고치지 않고 각각 원문대로 두었다. 각서의 날짜 `March £6, 1945` 와 첨부 보고의 `March 2, 1045` 도 숫자를 손대지 않았다. 정보원의 조선 거주 기간 `1694 to 1206` 은 1894년부터 1906년까지로 보이나 역시 원문대로 두었다. 첨부 보고 머리의 두 항목 이름표가 `ou Tas`, `Sua Ts` 로만 읽혀 판독 불가로 두었다. 각각 대상 지역과 정보원 신원을 적는 난이다. `UNI, Minneapolis` 는 해군정보국(ONI)으로 읽었다. `by 415` 의 415 는 숫자여서 그대로 두었다. 도명 `Korth Keisho`, `Kokal (Rwanghae)` 는 North Keisho, Kokai (Hwanghae) 로 바로잡았다. Keisho·Kokai 는 경상·황해의 일본식 읽기이며 원문이 괄호 안에 조선식 표기를 함께 달아 놓았다. A부터 G까지의 문자는 이 보고가 「문자로 치환」된 것이어서 실명 대신 들어간 자리다. 해독표가 따로 갔다고 각서가 밝히고 있다. 짐작해 채우지 않았다. 각서 끝의 서명이 `Eeteke` 로 읽혀 판독 불가로 두었다.", "warn": false, "search": "Duncan C. Lee 던컨 C. 리 (소령, 수신인) Eric Straight 에릭 스트레이트 (발신인) Anthony Cornell 앤서니 코넬 (면담자) APPROVED FOR RELEASE DATE: 08-Jun-2011 \"S\" Report N-13610"}, {"id": "L05", "order": 4, "date": "1945-04-03", "group": "A", "eyebrow": "1945 뉴욕 · OSS 외국인 전문가 조사", "title": "조선 보고", "badge": null, "list_right": "각서", "meta": [{"k": "일자", "v": "1945-04-03"}, {"k": "발신", "v": "Eric Straight 에릭 스트레이트 (외국인 전문가 조사, 뉴욕)", "txt": true}, {"k": "수신", "v": "Major Duncan C. Lee 던컨 C. 리 소령", "txt": true}, {"k": "종류", "v": "각서"}, {"k": "원제", "v": "Korean Reports", "txt": true}, {"k": "CREST 번호", "v": "0005657594"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/0005657594"}], "summary": "조선에 관한 보고 N-9194와 N-9194/2를 각각 두 벌씩 보내며 프레이지 소령에게 넘겨 달라고 부탁한다.", "points": ["조선에 관한 보고 두 건을 각각 두 벌씩 동봉한다.", "보고 번호는 N-9194와 N-9194/2다.", "프레이지(Frazee) 소령에게 넘겨 달라고 적었다.", "서명은 E.W.S.이고 발신 표시는 외국인 전문가 조사 뉴욕이다."], "primary": "외국인 전문가 조사, 뉴욕\n\n던컨 C. 리 소령\t\t\t1945년 4월 3일.\n에릭 스트레이트\n\n공개 승인\n일자: 08-Jun-2011\n\n조선 보고\n\n조선에 관한 아래 보고를 각각 두 벌씩 동봉한다.\n\nN-9194\nN-9194/2\n\n이것들을 프레이지 소령에게 넘겨 주시면 고맙겠다.\n\nE.W.S.", "secondary": "Survey of Foreign Experts - New York\n\nMajor Duncan C. Lee\t\t\tApril 3, 1945.\nEric Straight\n\nAPPROVED FOR RELEASE\nDATE: 08-Jun-2011\n\nKorean Reports\n\nI enclose two copies each of the following reports on Korea:\n\nN-9194\nN-9194/2\n\nI would appreciate your forwarding these to Major Frazee.\n\nE.W.S.", "notes": ["[삭제·공개 표시] APPROVED FOR RELEASE", "[삭제·공개 표시] DATE: 08-Jun-2011"], "note": "보고 번호 `N-9194` 와 `N-9194/2` 는 원문 그대로 두었다. 날짜 `april 3, 1945` 는 낱말만 April 로 고쳤고 숫자는 손대지 않았다. `dew York` 은 New York, `Major Freree` 는 Major Frazee, `two copies ezch` 는 each 로 읽었다. Frazee 는 L03의 `Major*Frazee` 와 같은 사람으로 보인다. 발신인 이름은 이 문서에서 `Eric Staight` 로 읽히나 서명 E.W.S. 와 다른 문서를 함께 보아 Straight 로 통일했다. 공개 승인 도장은 원문에서 본문 첫머리와 제목 사이에 찍혀 있어 그 자리에 그대로 두었다.", "warn": false, "search": "Duncan C. Lee 던컨 C. 리 (소령, 수신인) Eric Straight 에릭 스트레이트 (발신인, 서명 E.W.S.) Frazee 프레이지 (소령) APPROVED FOR RELEASE DATE: 08-Jun-2011 Korean Reports"}, {"id": "L06", "order": 5, "date": "1945-07-17", "group": "A", "eyebrow": "1945 뉴욕 · OSS 외국인 전문가 조사", "title": "조선에서의 일본 보안 규정", "badge": null, "list_right": "각서", "meta": [{"k": "일자", "v": "1945-07-17"}, {"k": "발신", "v": "Eric Straight 에릭 스트레이트 (외국인 전문가 조사, 뉴욕)", "txt": true}, {"k": "수신", "v": "Major Duncan C. Lee 던컨 C. 리 소령", "txt": true}, {"k": "종류", "v": "각서"}, {"k": "원제", "v": "Japanese Security Regulations in Korea", "txt": true}, {"k": "CREST 번호", "v": "0005657654"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/0005657654"}], "summary": "조선에서의 일본 보안 규정과 통제 조치를 다룬 면담 각서 두 건의 사본을 보내며 같은 사본이 모건 중령에게도 갔다고 알린다.", "points": ["코넬 씨가 작성한 각서 두 건의 사본을 동봉한다.", "각서의 내용은 조선에서의 일본 보안 규정과 통제 조치에 관한 면담이다.", "면담 상대의 이름 자리는 지워져 있다.", "같은 사본이 H. S. 모건(H.S. Morgan) 중령에게도 발송되고 있다.", "발신 표시가 S.F.E. 뉴욕으로 줄어 있고 그 옆에 (b)(6) 삭제 표시가 붙어 있다."], "primary": "(b)(6)\nS.F.E. 뉴욕 (b)(6)\n\n던컨 C. 리 소령\t\t\t1945년 7월 17일.\n\n에릭 스트레이트\n조선에서의 일본 보안 규정\n\n코넬 씨가 작성한 각서 두 건의 사본을 동봉한다. 조선에서의 일본 보안 규정 및 통제 조치에 관해 [삭제] 와 가진 면담을 다룬 것이다.\n\n이 각서들의 사본은 H. S. 모건 중령에게도 발송되고 있다.\n\nE.W.S.\n\n동봉물\n공개 승인\n일자: 08-Jun-2011", "secondary": "(b)(6)\nS.F.E. - New York (b)(6)\n\nMajor Duncan C. Lee\t\t\tJuly 17, 1945.\n\nEric Straight\nJapanese Security Regulations in Korea\n\nI enclose copies of two memoranda written by Mr. Cornell covering interviews held with [삭제] on Japanese Security Regulations and Control Measures in Korea.\n\nCopies of these memoranda are also being sent to Commander H.S. Morgan.\n\nE.W.S.\n\nEnclosures\nAPPROVED FOR RELEASE\nDATE: 08-Jun-2011", "notes": ["[삭제·공개 표시] (b)(6)", "[삭제·공개 표시] (b)(6)", "[삭제·공개 표시] APPROVED FOR RELEASE", "[삭제·공개 표시] DATE: 08-Jun-2011", "[삭제·공개 표시] [삭제] (면담 상대의 이름)"], "note": "머리의 삭제 표시가 OCR에서 `: b)\\(6` 과 `(2)(6)` 로 갈라져 읽혔다. 둘 다 정보자유법 제6항 면제 표시 (b)(6)로 보아 그대로 적었다. 발신 표시 `S.F..-` 는 Survey of Foreign Experts 의 약칭 S.F.E. 로 읽었다. `Dunven` 은 Duncan, `Seourity` 는 Security, `Kr. Cornell` 은 Mr. Cornell 로 바로잡았다. `held with` 다음의 면담 상대 이름 자리가 비어 있다. 같은 면에 (b)(6) 표시가 두 군데 붙어 있어 사생활을 이유로 지운 것으로 보고 [삭제] 로 적었으나 스캔에서 빠진 것일 가능성도 남는다. 모건 중령의 이름 뒤에 원문에는 쉼표와 함께 소속으로 보이는 대목이 이어지다 끊겨 있다.", "warn": false, "search": "Duncan C. Lee 던컨 C. 리 (소령, 수신인) Eric Straight 에릭 스트레이트 (발신인, 서명 E.W.S.) Cornell 코넬 (각서 작성자, L04의 면담자 Anthony Cornell 앤서니 코넬과 같은 사람으로 보인다) H. S. Morgan H. S. 모건 (중령) (b)(6) (b)(6) APPROVED FOR RELEASE DATE: 08-Jun-2011 [삭제] (면담 상대의 이름) Japanese Security Regulations in Korea"}, {"id": "L07", "order": 6, "date": "1945-08-30", "group": "A", "eyebrow": "1945 뉴욕 · OSS 외국인 전문가 조사", "title": "평시 정보 준비, 중국전구 지역", "badge": null, "list_right": "각서", "meta": [{"k": "일자", "v": "1945-08-30"}, {"k": "발신", "v": "기본 각서는 Major Lee 리 소령과 Ensign SerVaas 서바스 소위. 1차 배서는 Hq Office of Strategic Services, China Theater, Intelligence Division 전략사무국 중국전구 사령부 정보부의 정보장교 (서명 판독 불가, 중령). 2차 배서는 Richard P. Heppner 리처드 P. 헤프너 대령", "txt": true}, {"k": "수신", "v": "1차 배서는 Strategic Services Officer, China Theater 중국전구 전략첩보장교. 2차 배서는 Director, Office of Strategic Services, Washington, D. C. 워싱턴 전략사무국장", "txt": true}, {"k": "종류", "v": "각서"}, {"k": "원제", "v": "Preparation for peacetime intelligence, China Theater area", "txt": true}, {"k": "CREST 번호", "v": "0005657669"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/0005657669"}], "summary": "리 소령과 서바스 소위의 각서에 두 차례 배서가 붙은 문서다. 중국전구 정보부가 중국, 만주, 조선, 프랑스령 인도차이나의 평시 활동을 아우르는 종합 정보 계획을 만들겠다고 밝히고 승인을 받는다.", "points": ["기본 각서는 1945년 8월 30일 자 리 소령과 서바스 소위의 각서다. 제목은 평시 정보 준비, 중국전구 지역이다.", "1차 배서는 9월 3일 자로 중국전구 정보부가 냈고 승인을 구한다.", "정보부는 중국, 만주, 조선, 프랑스령 인도차이나의 평시 활동을 아우르는 종합 정보 계획을 되도록 빨리 만들 뜻을 밝힌다. 조선이 그 범위에 들어 있다.", "계획 자체는 구체적인 작전 계획서가 되고, 부록으로 적임 인원, 계획 시점의 실행 정도, 통신, 그리고 현재의 OSS에서 새 조직으로 넘어가는 방안을 붙인다.", "계획은 OSS 중국전구가 최종 청산되기 30일에서 45일 전까지는 워싱턴으로 가져갈 수 있도록 완성하자고 제안한다.", "기본 각서를 워싱턴의 국장에게 올리고 사본을 맥베인 소령에게 보내자고 건의한다.", "2차 배서는 9월 4일 자로 헤프너 대령이 승인하고 워싱턴 국장에게 올린다."], "primary": "공개 승인 (b)(6)\n일자: 08-Jun-2011\n\n[판독 불가]\n\n기본 문서: 1945년 8월 30일 자 리 소령과 서바스 소위의 각서. 건명: [판독 불가]\n평시 정보 준비, 중국전구 지역.\n\n[판독 불가]\n\n1차 배서.\n\n전략사무국 중국전구 사령부 정보부, APO 627, 1945년 9월 3일\n\n수신: 중국전구 전략첩보장교, APO 627\n\n1. 기본 각서를 귀하의 승인을 받고자 이송한다.\n\n2. 본 부는 중국, 만주, 조선 및 프랑스령 인도차이나에서의 평시 활동을 포괄하는 종합 정보 계획을 되도록 빨리 작성할 의도를 가지고 있다. 계획 자체는 구체적인 작전 계획이 될 것이다. 여기에는 적합한 인원, 계획 작성 시점에서의 실행 정도, 통신, 그리고 현재 구성되어 있는 대로의 OSS로부터 새 조직으로 이행을 이루기 위한 방안을 다루는 부록들이 첨부될 것이다. 이 계획은 OSS/CT의 최종 청산이 있기 30일 내지 45일 전보다 늦지 않게 본인 또는 귀하가 지정하는 다른 장교가 워싱턴으로 가지고 갈 수 있는 시한 안에 완성되도록 제안한다. 그리하면 워싱턴에서 직접 논의할 수 있고 이행에 필요한 조치를 시행할 수 있을 것이다.\n\n3. 기본 각서를 워싱턴의 국장에게 이송하고 사본을 맥베인 소령에게 보낼 것을 건의한다.\n\n[판독 불가 - 서명]\n중령, 야전포병.\nOSS/CT 정보장교\n\n2차 배서.\n\n전략사무국 중국전구 사령부, APO 627, 1945년 9월 4일.\n\n수신: 전략사무국장, 워싱턴 D. C.\n\n1. 승인함.\n\n2. 이송함.\n\n리처드 P. 헤프너\n대령, 야전포병.\nOSS/CT 전략첩보장교\n\n[판독 불가]", "secondary": "APPROVED FOR RELEASE (b)(6)\nDATE: 08-Jun-2011\n\n[판독 불가]\n\nBASIC: Memo fr Major Lee and Ensign SerVaas dtd 30 August 1945, Subj: [판독 불가]\nPreparation for peacetime intelligence, China Theater area.\n\n[판독 불가]\n\n1st Ind.\n\nHq Office of Strategic Services, China Theater, Intelligence Division, APO 627, 3 September 1945\n\nTo: Strategic Services Officer, China Theater, APO 627\n\n1. Basic memorandum is forwarded for your approval.\n\n2. It is the intention of this division to prepare as rapidly as possible a master intelligence plan covering peacetime operations in China, Manchuria, Korea and French Indo-China. The plan itself will be a specific operational program. Attached to it will be appendices covering suitable personnel, degree of implementation as of the date of the plan, communications and proposals for effecting the transition from OSS as presently constituted to the new organization. It is proposed that this plan be completed within such time that it may be taken back to Washington by the undersigned or such other officer as you may designate not later than thirty to forty-five days before the final liquidation of OSS/CT. This will permit personal discussions in Washington and instituting of such measures for transition as may be necessary.\n\n3. It is suggested that basic memorandum be forwarded to the Director in Washington with copy to Lt. Comdr. McBaine.\n\n[판독 불가 - 서명]\nLt. Colonel, F. A.\nIntelligence Officer, OSS/CT\n\n2nd Ind.\n\nHq Office of Strategic Services, China Theater, APO 627, 4 September 1945.\n\nTo: Director, Office of Strategic Services, Washington, D. C.\n\n1. Approved.\n\n2. Forwarded.\n\nRICHARD P. HEPPNER\nColonel, F. A.\nStrategic Services Officer, OSS/CT\n\n[판독 불가]", "notes": ["[삭제·공개 표시] APPROVED FOR RELEASE (b)(6)", "[삭제·공개 표시] DATE: 08-Jun-2011", "[삭제·공개 표시] (b)(6)"], "note": "기본 각서의 건명 줄이 `Subj: DerTs g6]` 로 뭉개져 판독 불가로 두었다. 바로 다음 줄에 제목이 이어 찍혀 있어 그것을 표제로 삼았다. 1차 배서 서명은 `o be L` 로만 읽혀 판독 불가로 두었다. 계급과 직책만 남아 중령이자 OSS/CT 정보장교임을 알 수 있다. 문서 끝의 `Be segrtl` 도 판독 불가로 두었다. 기밀 등급 도장으로 보이나 단정할 수 없어 classification 은 비워 두었다. `CSS` 와 `0SS` 는 OSS 로, `BPO 627` 과 `aPC 627` 은 APO 627 로 바로잡았다. `Merchuria` 는 Manchuria, `Comir` 은 Comdr. 로 읽었다. 날짜의 숫자는 모두 원문대로다. F. A. 는 야전포병(Field Artillery) 병과 표시다. 문서 첫머리와 `1st Ind.` 앞에 뭉개진 글자 덩어리가 있어 그 자리에 판독 불가로 표시했다.", "warn": false, "search": "Major Lee 리 소령 (기본 각서 기안자. 이 문서철의 수신인 Duncan C. Lee 던컨 C. 리와 같은 사람인지는 문서상 확인되지 않는다) Ensign SerVaas 서바스 소위 (기본 각서 기안자) McBaine 맥베인 (소령) Richard P. Heppner 리처드 P. 헤프너 (대령, OSS 중국전구 전략첩보장교) APPROVED FOR RELEASE (b)(6) DATE: 08-Jun-2011 (b)(6) Preparation for peacetime intelligence, China Theater area"}, {"id": "M01", "order": 7, "date": "1946-01-01", "group": "B", "eyebrow": "1946 만주·북조선 · 현장 첩보보고", "title": "조선공산 전투서열", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1946-01-01"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단(CIG)", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Korean Communist Order of Battle", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000100170001-5"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000100170001-5"}], "summary": "중앙정보단이 낸 한 면짜리 첩보보고다. 만주 쪽 조선의용군 두 갈래의 병력과 배치를 적었다. 하나는 두만강 북안, 하나는 압록강 북안이다.", "points": ["8월 24일 현재 YANG Chun-yu 양춘유가 지휘하는 조선의용군이 왕칭과 옌지 일대에서 활발히 움직였다. 총원 약 12,000명이다.", "이 부대의 임무는 두만강 북안 경비다.", "LI Hung-kuang 리훙광이 지휘하는 조선의용군은 6,600명이고 사령부는 콴뎬에 있다. 병력은 압록강 북안을 따라 늘어서 있다.", "약 9할이 무장했고 서른 문이 넘는 포를 가졌다고 적었다.", "본문 곳곳이 25X1 표시로 지워져 있다. 정보원에 관한 대목이 통째로 빠졌다."], "primary": "Approved For Release 2006/02/27 : CIA-RDP82-00457R000109470001-5\n\nCONFIDENTIAL(기밀)   25X1\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\nCONFIDENTIAL\n\n제목   조선공산 전투서열(Korean Communist Order of Battle)\n배포   1946년 10월 29일\n25X1   면수 1\n출처지   [판독 불가]   보충   25X1\n\n8월 24일 현재, 조선의용군(Korean Voluntary Corps)은 YANG Chun-yu 양춘유의 지휘 아래 왕칭(Wang-ching 汪淸, 129-36, 43-16)과 옌지(Yen-chi 延吉, 129-31, 42-65) 일대에서 매우 활발히 움직였다. 조선인 부대의 총원은 약 12,000명이다.\n\n이들의 임무는 두만강(Tumen River) 북안을 경비하는 것이다. [삭제] 25X1\n\n25X1 [삭제] LI Hung-kuang 리훙광이 지휘하는 조선의용군의 총병력은 6,600명이다.\n\n사령부는 콴뎬(Kuan-tien 寬甸, 124-46, 40-44)에 있고 병력은 압록강(Yalu River) 북안을 따라 배치되어 있다.\n\n이들 가운데 약 9할이 무장하고 있으며 서른[판독 불가] 문이 넘는 포를 가지고 있다. 25X1\n\n문서번호 [판독 불가]\n\n이 문서는 중앙정보국장이 1978년 10월 16일 미합중국 문서보관관에게 보낸 서한에 따라 CONFIDENTIAL에서 비밀해제된다.\n\n다음 재검토 [판독 불가]\n\nCONFIDENTIAL\n\nApproved For Release 2006/02/27 : CIA-RDP82-00457R000100170001-5", "secondary": "Approved For Release 2006/02/27 : CIA-RDP82-00457R000109470001-5\n\nCONFIDENTIAL   25X1\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCONFIDENTIAL\n\nSUBJECT   Korean Communist Order of Battle\nDIST.   29 October 1946\n25X1   PAGES 1\nORIGIN   [판독 불가]   SUPPLEMENT   25X1\n\nAs of 24 August, the Korean Voluntary Corps, under the command of YANG Chun-yu, was very active around Wang-ching (129-36, 43-16) and Yen-chi (129-31, 42-65). The Korean Corps totals about 12,000 men.\n\nTheir duty is to garrison the north bank of the Tumen River. [삭제] 25X1\n\n25X1 [삭제] The total strength of the Korean Voluntary Corps commanded by LI Hung-kuang is 6,600 men.\n\nHeadquarters is at Kuan-tien (124-46, 40-44) and the troops are distributed along the north bank of the Yalu River.\n\nAbout ninety per cent of these men are armed and they have over thir[ty] [판독 불가] guns. 25X1\n\nDocument No. [판독 불가]\n\nThis document is hereby [declassified from] CONFIDENTIAL in accordance with [the] letter of 16 October 1978 [from the] Director of Central Intelligence [to the] Archivist of the United States.\n\nNext Review [판독 불가]\n\nCONFIDENTIAL\n\nApproved For Release 2006/02/27 : CIA-RDP82-00457R000100170001-5", "notes": ["[삭제·공개 표시] 25X1 — 본문에 네 곳", "[삭제·공개 표시] Approved For Release 2006/02/27 : CIA-RDP82-00457R000109470001-5 — 첫 면 상단", "[삭제·공개 표시] Approved For Release 2006/02/27 : CIA-RDP82-00457R000100170001-5 — 하단", "[삭제·공개 표시] 먹칠된 자리 두 곳을 [삭제]로 옮겼다"], "note": "옌지의 좌표가 (129-31, 42-65)로 적혀 있다. 분(分)은 60을 넘을 수 없으니 값이 깨진 것이다. 같은 문서철 M06은 같은 지명을 (129-31, 42-55)로 적었다. 그래도 이 문서의 숫자는 고치지 않고 그대로 두었다.\n\n지휘관 이름 둘은 OCR이 뭉개졌다. YARG Chun-yu를 YANG Chun-yu로, LI Hungeicuang을 LI Hung-kuang으로 읽었다. 확정은 아니다.\n\n두 상단 공개 도장의 문서번호가 서로 다르다. 앞은 R000109470001-5, 뒤는 R000100170001-5다. 앞쪽이 OCR 오류로 보이나 고치지 않았다.\n\n하단 비밀해제 도장은 글자가 심하게 뭉개져 문장 구조만 살리고 빠진 낱말을 대괄호로 채웠다.\n\n문서 자체의 배포일은 1946년 10월 29일이고 「8월 24일 현재」라고만 적혀 있다. raw/index.json의 날짜는 1946-01-01이다.", "warn": false, "search": "YANG Chun-yu 양춘유 (조선의용군 지휘관. 원문 OCR은 YARG) LI Hung-kuang 리훙광 (조선의용군 지휘관. 원문 OCR은 LI Hungeicuang) 25X1 — 본문에 네 곳 Approved For Release 2006/02/27 : CIA-RDP82-00457R000109470001-5 — 첫 면 상단 Approved For Release 2006/02/27 : CIA-RDP82-00457R000100170001-5 — 하단 먹칠된 자리 두 곳을 [삭제]로 옮겼다 Korean Communist Order of Battle"}, {"id": "M02", "order": 8, "date": "1946-04-02", "group": "B", "eyebrow": "1946 만주·북조선 · 현장 첩보보고", "title": "군사첩보: 중국공산군이 조선의 소련군에 물자를 대다", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1946-04-02"}, {"k": "발신", "v": "Strategic Services Unit, War Department 전략첩보대(육군부), Washington, D.C.", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Chinese Communists Supply Russians in Korea", "txt": true}, {"k": "CREST 번호", "v": "0000138989"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/0000138989"}], "summary": "안둥의 중국공산군이 조선에 있는 소련군에 기계와 물자를 몰래 실어 보낸다는 보고다. 정보원은 안둥현 국민당 당부 사람이고, 국민당은 그곳에서 지하활동밖에 못 한다.", "points": ["중국공산군이 안둥(124-23, 40-09)을 장악하고 있어 국민당은 지하로만 움직인다. 사정이 나빠 사람들이 묵던으로 빠져나갔고, 국민당은 묵던에 이들을 접대할 시설을 두었다.", "안둥의 중국공산군은 조선의 소련군에 기계와 물자를 은밀히 실어 보내는 일을 계속하고 있다.", "거래가 극도로 비밀리에 이루어져 상세한 내용은 누구도 얻을 수 없다고 적었다.", "린뱌오의 참모장이 기자회견에서 조선의 소련군을 위해 식량을 사들였음을 인정했다. 보고가 드는 유일한 공개 근거다.", "SOURCE는 Z, SUB SOURCE는 See Note, EVALUATION은 OCR이 P23으로 뭉개져 읽을 수 없다."], "primary": "CONTROL\n미국 및 영국 관리 전용(U.S. AND BRITISH OFFICIALS ONLY)\n\n전략첩보대, 육군부(STRATEGIC SERVICES UNIT, WAR DEPARTMENT)\n워싱턴 D.C.\n\n첩보 배포 번호(INTELLIGENCE DISSEMINATION NUMBER) A4-68911\n\n국가   중국(China)                          원보고(ORIGINAL RPT.)   LV-1559\n제목   군사첩보: 중국공산군이 조선의       정보 일자(DATE OF INFO.)   1946년 3월 23일\n       소련군에 물자를 대다.               보고 일자(DATE OF RPT.)    q May 1946 [원문 그대로]\n                                           배포(DISTRIBUTED)          1946년 6월 21일\n출처지   상하이(Shanghai)\n전구(THEATRE)                              확인(CONFIRMATION)\n                                           보충(SUPPLEMENT)\nSOURCE   Z\nSUB SOURCE   See Note                     면수   1.\nEVALUATION   P23 [판독 불가]               첨부(ATTACHMENTS)\n\n(SSU 중국지부 주: 부정보원은 안둥현(Antung Hsien 安東縣) 국민당 당부의 일원이다. 중국공산군이 안둥(Antung 安東, 124-23, 40-09)을 장악하고 있어 국민당은 그곳에서 지하활동밖에 할 수 없다. 또 안둥의 사정이 극도로 나빠 많은 사람이 묵던(Mukden 奉天)으로 돌아가야 했다. 국민당은 이 안둥 대표들을 접대하려고 묵던에 시설 하나를 두고 있다. 아래 정보는 그곳에서 얻은 것이다.)\n\n1. 안둥의 중국공산군은 조선에 있는 소련군에 기계와 물자를 은밀히 실어 보내는 일을 계속하고 있다. 거래가 극도로 비밀리에 이루어지므로 누구도 이 작업에 관한 상세한 정보를 얻을 수 없다.\n\n2. 그러나 LIN Piao 린뱌오([판독 불가]) 장군의 참모장인 WU Hsu-shu 우쉬수([판독 불가])는 기자회견에서 중국공산군이 조선의 소련군을 위해 식량을 사들였음을 인정했다.\n\nCONTROL\nCONFIDENTIAL   미국 및 영국 관리 전용\n\n[판독 불가 면 표시]", "secondary": "CONTROL\nU.S. AND BRITISH OFFICIALS ONLY\n\nSTRATEGIC SERVICES UNIT, WAR DEPARTMENT\nWASHINGTON, D.C.\n\nINTELLIGENCE DISSEMINATION NUMBER A4-68911\n\nCOUNTRY   China                                    ORIGINAL RPT.   LV-1559\nSUBJECT   Military Information: Chinese Communists  DATE OF INFO.   23 March 1946\n          Supply Russians in Korea.                 DATE OF RPT.    q May 1946 [원문 그대로]\n                                                    DISTRIBUTED     21 June 1946\nORIGIN    Shanghai\nTHEATRE                                            CONFIRMATION\n                                                   SUPPLEMENT\nSOURCE    Z\nSUB SOURCE   See Note                              NO. OF PAGES  1.\nEVALUATION   P23 [판독 불가]                        ATTACHMENTS\n\n(SSU China Note: Subsource is a member of the Antung Hsien Kuomintang Party Headquarters. Because the Chinese Communists control Antung (124-23, 40-09), the Kuomintang Party can only undertake underground activities there. Also, because of extremely bad conditions in Antung, many men have had to return to Mukden. The Kuomintang maintains an establishment in Mukden to entertain these Antung representatives. It was there that the following information was obtained.)\n\n1. The Chinese Communists in Antung are continuing to secretly transport machines and supplies to the Russian army in Korea. Because of the extreme secrecy with which the transactions are carried on, it is impossible for anyone to obtain any detailed information on these operations.\n\n2. However, WU Hsu-shu ([판독 불가]), Chief-of-Staff to General LIN Piao ([판독 불가]), during a press conference, admitted that the Chinese Communists had bought food supplies for the Russian Army in Korea.\n\nCONTROL\nCONFIDENTIAL   U.S. AND BRITISH OFFICIALS ONLY\n\n[판독 불가 면 표시]", "notes": ["[삭제·공개 표시] CONTROL / U.S. AND BRITISH OFFICIALS ONLY — 상하단 배포 제한 도장", "[삭제·공개 표시] CONFIDENTIAL — 하단 등급 도장", "[삭제·공개 표시] 인명 뒤 한자 표기가 스캔에서 뭉개져 [판독 불가]로 두었다"], "note": "EVALUATION 줄이 OCR에서 P23으로 나온다. 이 계열의 등급 표기는 C-3처럼 글자 하나와 숫자 하나인데 여기서는 판독되지 않아 원문 표기를 그대로 두고 [판독 불가]를 붙였다.\n\n보고 일자가 「q May 1946」으로 찍혀 있다. 숫자로 보이나 고치지 않고 그대로 두었다.\n\n배포 번호가 A4-68911로 읽힌다. 이 계열의 다른 문서는 A-69173, A-70200처럼 A 다음에 바로 하이픈이 온다. 문서번호이므로 고치지 않았다.\n\n참모장 이름은 OCR이 「@U Hsu-shu」로 뭉개졌다. 앞 글자를 W로 읽어 WU Hsu-shu로 두었다. 린뱌오의 당시 참모장이라면 우슈취안(伍修權)일 가능성이 있으나 원문 표기와 다르므로 바꾸지 않았다.\n\n안둥의 좌표 (124-23, 40-09)는 M05와 같다.\n\n문서 자체의 일자는 정보 1946년 3월 23일, 보고 5월, 배포 6월 21일이다. raw/index.json의 날짜는 1946-04-02다.", "warn": false, "search": "LIN Piao 린뱌오(林彪) (중국공산군 장군) WU Hsu-shu 우쉬수 (린뱌오의 참모장. 원문 OCR 그대로 옮겼다) CONTROL / U.S. AND BRITISH OFFICIALS ONLY — 상하단 배포 제한 도장 CONFIDENTIAL — 하단 등급 도장 인명 뒤 한자 표기가 스캔에서 뭉개져 [판독 불가]로 두었다 Military Information: Chinese Communists Supply Russians in Korea"}, {"id": "M03", "order": 9, "date": "1946-05-04", "group": "B", "eyebrow": "1946 만주·북조선 · 현장 첩보보고", "title": "군사첩보: 조선의 소련군", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1946-05-04"}, {"k": "발신", "v": "Strategic Services Unit, War Department 전략첩보대(육군부)", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Russian Troops in Korea", "txt": true}, {"k": "CREST 번호", "v": "0000139027"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/0000139027"}], "summary": "만주에서 물러난 소련군 약 1만 3천이 신의주로 들어가 압록강을 봉쇄했고, 북동 조선에 약 4만이 있다는 보고다. 절반은 차량화 부대다.", "points": ["최근 만주에서 철수한 소련군 약 13,000명이 신의주(124-24, 40-06)로 갔고 압록강을 봉쇄했다.", "북동 조선의 장진(127-10, 40-54), 백암(128-28, 41-12), 갑산(128-18, 41-05)에 소련군 약 40,000명이 있다.", "그 절반은 VALIKOFF 소장이 지휘하는 차량화 부대다.", "SOURCE는 Z, SUB SOURCE는 총통의 베이핑 사령부다. EVALUATION 줄은 스캔이 뭉개져 읽을 수 없다.", "지명마다 일본식 이름과 좌표가 나란히 붙어 있다. 국경 밖에서 조선을 보던 방식이 표기에 남아 있다."], "primary": "첩보 배포 번호(INTELLIGENCE DISSEMINATION NUMBER)   A~69294a8 [원문 그대로]\n\n국가   조선(Korea)                          원보고(ORIGINAL RPT.)   YV-1L712 part [원문 그대로]\n제목   군사첩보: 조선의 소련군.             정보 일자(DATE OF INFO.)   29-29 siay LIAL [원문 그대로]\n                                            보고 일자(DATE OF RPT.)    1946년 6월 13일\n                                            배포(DISTRIBUTED)          1Z July 1946 [원문 그대로]\n출처지   상하이(Shanghai)\n전구(THEATRE)                               확인(CONFIRMATION)\n                                            보충(SUPPLEMENT)\nSOURCE   Z\nSUB SOURCE   총통의 베이핑 사령부(Generalissimo's Peking headquarters).   면수  1.\nEVALUATION   [판독 불가]                    첨부(ATTACHMENTS)\n\n최근 만주에서 철수한 소련군 약 13,000명이 신의주(Hsinichou /Shingishu, (124-24, 40-06)/)로 갔고, 압록강(Yalu River)을 봉쇄했다.\n\n소련군 약 40,000명이 북동 조선의 장진(Changchin /Choshin, (127-10, 40-54)/), 백암(Paiyen /Hakugan, (128-28, 41-12)/), 갑산(Chiashan /Kozan, (128-18, 41-05)/)에 있다. 그 절반은 VALIKOFF 발리코프 소장이 지휘하는 차량화 부대다.\n\nAPPROVED FOR RELEASE\n18 DEC 1397 [원문 그대로]\n\nCONFIDENTIAL   CONTROL   미국 및 영국 관리 전용\n\n227", "secondary": "INTELLIGENCE DISSEMINATION NUMBER   A~69294a8 [원문 그대로]\n\nCOUNTRY   Korea                                   ORIGINAL RPT.   YV-1L712 part [원문 그대로]\nSUBJECT   Military Information: Russian Troops    DATE OF INFO.   29-29 siay LIAL [원문 그대로]\n          in Korea.                               DATE OF RPT.    13 June 1946\n                                                  DISTRIBUTED     1Z July 1946 [원문 그대로]\nORIGIN    Shanghai\nTHEATRE                                           CONFIRMATION\n                                                  SUPPLEMENT\nSOURCE    Z\nSUB SOURCE   Generalissimo's Peking headquarters. NO. OF PAGES  1.\nEVALUATION   [판독 불가]                          ATTACHMENTS\n\nAbout 13,000 Russian troops, who were recently evacuated from Manchuria, have gone to Hsinichou /Shingishu, (124-24, 40-06)/ and they have blockaded the Yalu River.\n\nAbout 40,000 Russian troops are in Changchin /Choshin, (127-10, 40-54)/, Paiyen /Hakugan, (128-28, 41-12)/, and Chiashan /Kozan, (128-18, 41-05)/ in northeastern Korea. One half are motorized units under Major General VALIKOFF.\n\nAPPROVED FOR RELEASE\n18 DEC 1397 [원문 그대로]\n\nCONFIDENTIAL   CONTROL   U.S. AND BRITISH OFFICIALS ONLY\n\n227", "notes": ["[삭제·공개 표시] APPROVED FOR RELEASE 18 DEC 1397 — 공개 승인 도장", "[삭제·공개 표시] CONFIDENTIAL / CONTROL — U.S. AND BRITISH OFFICIALS ONLY — 하단 도장"], "note": "머리의 일자와 번호가 심하게 뭉개져 있다. 정보 일자 「29-29 siay LIAL」, 배포 「1Z July 1946」, 원보고 번호 「YV-1L712 part」, 배포 번호 「A~69294a8」은 날짜의 숫자와 문서번호라 고치지 않고 원문 그대로 두었다.\n\n공개 승인 도장이 「18 DEC 1397」로 찍혀 있다. 같은 계열 M05와 M06은 같은 도장이 「18 DEC 1997」이다. 그래도 이 문서의 숫자는 그대로 두었다.\n\n지명 뒤 빗금 안은 일본식 지명과 좌표다. 원문에서는 대괄호에 가까운 표시인데 스캔에서 빗금과 f 자로 뭉개졌다. 빗금으로 통일해 옮겼다. Hsinichou는 신의주, Changchin/Choshin은 장진, Paiyen/Hakugan은 백암, Chiashan/Kozan은 갑산으로 읽었다.\n\nEVALUATION 줄은 글자가 남아 있지 않아 [판독 불가]로 두었다. 등급을 짐작해 채우지 않았다.\n\n문서 자체의 보고 일자는 1946년 6월 13일, 배포는 7월이다. raw/index.json의 날짜는 1946-05-04다.", "warn": false, "search": "VALIKOFF 발리코프 (소련군 소장. 차량화 부대 지휘) APPROVED FOR RELEASE 18 DEC 1397 — 공개 승인 도장 CONFIDENTIAL / CONTROL — U.S. AND BRITISH OFFICIALS ONLY — 하단 도장 Military Information: Russian Troops in Korea"}, {"id": "M05", "order": 10, "date": "1946-06-02", "group": "B", "eyebrow": "1946 만주·북조선 · 현장 첩보보고", "title": "군사첩보: 안둥의 중국공산군이 조선에서 장비를 받다", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1946-06-02"}, {"k": "발신", "v": "Strategic Services Unit, War Department 전략첩보대(육군부), Washington, D.C.", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Chinese Communists at Antung Receive Equipment from Korea", "txt": true}, {"k": "CREST 번호", "v": "0000139025"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/0000139025"}], "summary": "안둥의 중국공산군이 조선에서 트럭과 포를 받아 새 포병연대를 꾸린다는 두 줄짜리 보고다. 소련군은 강 건너편에 탄약 집적소를 두고 있다.", "points": ["안둥(124-23, 40-09)의 중국공산군이 최근 조선에서 트럭 50대, 37밀리 포 15문, 75밀리 산포 10문을 받았다.", "받은 목적은 새 포병연대의 편성이다.", "소련군은 안둥 바로 건너편 강가에 탄약 집적소를 두고 있다.", "SOURCE는 Z, SUB SOURCE는 국민정부 동북사령부, EVALUATION은 C-3이다.", "M02와 방향이 반대다. 4월 보고는 물자가 조선으로 갔다고 했고, 이 보고는 장비가 조선에서 왔다고 한다."], "primary": "CONTROL\n미국 및 영국 관리 전용(U.S. AND BRITISH OFFICIALS ONLY)\n\n전략첩보대, 육군부(STRATEGIC SERVICES UNIT, WAR DEPARTMENT)\n워싱턴 D.C.\n\n첩보 배포 번호(INTELLIGENCE DISSEMINATION NUMBER)   A~-69173 [원문 그대로]\n\n국가   중국(China)                          원보고(ORIGINAL RPT.)   RB-38905\n제목   군사첩보: 안둥의 중국공산군이       정보 일자(DATE OF INFO.)   1946년 6월 29일\n       조선에서 장비를 받다.               보고 일자(DATE OF RPT.)    1946년 7월 2일\n                                           배포(DISTRIBUTED)          1946년 7월 8일\n출처지   상하이(Shanghai)\n전구(THEATRE)                              확인(CONFIRMATION)\n                                           보충(SUPPLEMENT)\nSOURCE   Z\nSUB SOURCE   국민정부 동북사령부(Nationalist Northeast Command Hq.)   면수  1\nEVALUATION   C-3                            첨부(ATTACHMENTS)\n\n1. 안둥(Antung 安東, 124-23, 40-09)의 중국공산군은 최근 조선에서 트럭 50대, 포 15문(37밀리), 산포 10문(75밀리)을 받았다. 새 포병연대를 편성하기 위한 것이다.\n\n2. 소련군은 안둥 바로 건너편 강가에 탄약 집적소를 두고 있다.\n\nAPPROVED FOR RELEASE\n18 DEC 1997\n\nCONTROL   미국 및 영국 관리 전용\n\nCONFIDENTIAL", "secondary": "CONTROL\nU.S. AND BRITISH OFFICIALS ONLY\n\nSTRATEGIC SERVICES UNIT, WAR DEPARTMENT\nWASHINGTON, D.C.\n\nINTELLIGENCE DISSEMINATION NUMBER   A~-69173 [원문 그대로]\n\nCOUNTRY   China                                    ORIGINAL RPT.   RB-38905\nSUBJECT   Military Information: Chinese Communists  DATE OF INFO.   29 June 1946\n          at Antung Receive Equipment from Korea.   DATE OF RPT.    2 July 1946\n                                                    DISTRIBUTED     8 July 1946\nORIGIN    Shanghai\nTHEATRE                                            CONFIRMATION\n                                                   SUPPLEMENT\nSOURCE    Z\nSUB SOURCE   Nationalist Northeast Command Hq.      NO. OF PAGES  1\nEVALUATION   C-3                                    ATTACHMENTS\n\n1. The Chinese Communists at Antung (124-23, 40-09) have recently received fifty trucks, fifteen guns (37MM) and ten pack howitzers (75MM) from Korea for the organization of a new artillery regiment.\n\n2. The Russians have ammunition dumps just across the river from Antung.\n\nAPPROVED FOR RELEASE\n18 DEC 1997\n\nCONTROL   U.S. AND BRITISH OFFICIALS ONLY\n\nCONFIDENTIAL", "notes": ["[삭제·공개 표시] CONTROL / U.S. AND BRITISH OFFICIALS ONLY — 상하단 배포 제한 도장", "[삭제·공개 표시] APPROVED FOR RELEASE 18 DEC 1997 — 공개 승인 도장", "[삭제·공개 표시] CONFIDENTIAL — 하단 등급 도장"], "note": "EVALUATION은 C-3이다. 앞 글자는 정보원 신빙성, 뒤 숫자는 정보의 확실성을 가리키는 표기이며 풀어 쓰지 않고 그대로 두었다.\n\n안둥의 좌표 (124-23, 40-09)는 M02와 같다.\n\n배포 번호가 「A~-69173」으로 찍혀 있다. 물결표와 하이픈이 겹쳐 나오는데 문서번호라 손대지 않았다.\n\n본문에서 고친 것은 낱말뿐이다. Antuny를 Antung으로, [rom을 from으로 읽었다. 숫자와 좌표는 그대로다.\n\n문서 자체의 일자는 정보 1946년 6월 29일, 보고 7월 2일, 배포 7월 8일이다. raw/index.json의 날짜는 1946-06-02다.", "warn": false, "search": "CONTROL / U.S. AND BRITISH OFFICIALS ONLY — 상하단 배포 제한 도장 APPROVED FOR RELEASE 18 DEC 1997 — 공개 승인 도장 CONFIDENTIAL — 하단 등급 도장 Military Information: Chinese Communists at Antung Receive Equipment from Korea"}, {"id": "M06", "order": 11, "date": "1946-07-05", "group": "B", "eyebrow": "1946 만주·북조선 · 현장 첩보보고", "title": "군사첩보: 소련군 장교들이 조선에서 옌지에 도착하다", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1946-07-05"}, {"k": "발신", "v": "Strategic Services Unit, War Department 전략첩보대(육군부), Washington, D.C.", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Soviet Officers Arrive in Yenchi from Korea", "txt": true}, {"k": "CREST 번호", "v": "0000139006"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/0000139006"}], "summary": "7월 초 소련군 장교 여섯이 조선에서 옌지로 와 중국공산당 관리들과 협의했다는 한 문장짜리 보고다.", "points": ["7월 초 소련군 장교 여섯 명이 조선에서 옌지(129-31, 42-55)에 도착했다.", "온 목적은 중국공산당 관리들과의 협의다.", "SOURCE는 Z, SUB SOURCE는 동북중국사령부, EVALUATION은 C-O로 찍혀 있다.", "본문은 이 한 문장이 전부다. 나머지는 등급 도장과 배포 제한 표시다."], "primary": "CONTROL\n미국 및 영국 관리 전용(U.S. AND BRITISH OFFICIALS ONLY)\n\nGUARD\n\n전략첩보대, 육군부(STRATEGIC SERVICES UNIT, WAR DEPARTMENT)\n워싱턴 D.C.\n\n첩보 배포 번호(INTELLIGENCE DISSEMINATION NUMBER)   h-70200 [
