원문 그대로]\n\n국가   중국(China)                          원보고(ORIGINAL RPT.)   Rd-4O0562 part [원문 그대로]\n제목   군사첩보: 소련군 장교들이           정보 일자(DATE OF INFO.)   1946년 8월 15일\n       조선에서 옌지에 도착하다.           보고 일자(DATE OF RPT.)    lo August 1946 [원문 그대로]\n                                           배포(DISTRIBUTED)          1946년 8월 21일\n출처지   상하이(Shanghai)\n전구(THEATRE)                              확인(CONFIRMATION)\n                                           보충(SUPPLEMENT)\nSOURCE   Z\nSUB SOURCE   동북중국사령부(Northeast China Command).   면수  1\nEVALUATION   C-O [원문 그대로]              첨부(ATTACHMENTS)\n\n7월 초, 소련군 장교 여섯 명이 조선에서 옌지(Yenchi 延吉, 129-31, 42-55)에 도착해 중국공산당 관리들과 협의했다.\n\nCONTROL\n미국 및 영국 관리 전용\n\nAPPROVED FOR RELEASE\n\n78 DEC 1997 [원문 그대로]\n\n-37", "secondary": "CONTROL\nU.S. AND BRITISH OFFICIALS ONLY\n\nGUARD\n\nSTRATEGIC SERVICES UNIT, WAR DEPARTMENT\nWASHINGTON, D.C.\n\nINTELLIGENCE DISSEMINATION NUMBER   h-70200 [원문 그대로]\n\nCOUNTRY   China                                    ORIGINAL RPT.   Rd-4O0562 part [원문 그대로]\nSUBJECT   Military Information: Soviet Officers     DATE OF INFO.   15 August 1946\n          Arrive in Yenchi from Korea.              DATE OF RPT.    lo August 1946 [원문 그대로]\n                                                    DISTRIBUTED     21 August 1946\nORIGIN    Shanghai\nTHEATRE                                            CONFIRMATION\n                                                   SUPPLEMENT\nSOURCE    Z\nSUB SOURCE   Northeast China Command.               NO. OF PAGES  1\nEVALUATION   C-O [원문 그대로]                      ATTACHMENTS\n\nIn early July, six Soviet officers arrived in Yenchi (129-31, 42-55) from Korea to confer with Chinese Communist officials.\n\nCONTROL\nU.S. AND BRITISH OFFICIALS ONLY\n\nAPPROVED FOR RELEASE\n\n78 DEC 1997 [원문 그대로]\n\n-37", "notes": ["[삭제·공개 표시] CONTROL / U.S. AND BRITISH OFFICIALS ONLY — 상하단 배포 제한 도장", "[삭제·공개 표시] GUARD — 상단 취급 표시", "[삭제·공개 표시] APPROVED FOR RELEASE 78 DEC 1997 — 공개 승인 도장"], "note": "EVALUATION이 「C-O」로 찍혀 있다. 뒤 자리는 1에서 6까지의 숫자여야 하는데 글자 O로 읽힌다. 6이 뭉개진 것일 수 있으나 등급 표기는 고치지 않고 그대로 두었다.\n\n배포 번호 「h-70200」, 원보고 번호 「Rd-4O0562 part」, 보고 일자 「lo August 1946」, 공개 도장의 「78 DEC 1997」은 모두 문서번호와 날짜라 원문 그대로 두었다. 같은 계열 M05의 공개 도장은 「18 DEC 1997」이다.\n\n옌지의 좌표 (129-31, 42-55)는 정상 범위다. 같은 문서철 M01은 같은 지명을 (129-31, 42-65)로 적었다.\n\n정보 일자는 8월 15일인데 본문은 「7월 초」의 일을 말한다. 원문 그대로다.\n\n상단 배포 제한 줄은 스캔이 심하게 뭉개져 자모를 알아볼 수 없다. 같은 계열 문서들이 같은 위치에 찍은 문구로 복원해 옮겼다.\n\n문서 자체의 배포일은 1946년 8월 21일이다. raw/index.json의 날짜는 1946-07-05다.", "warn": false, "search": "CONTROL / U.S. AND BRITISH OFFICIALS ONLY — 상하단 배포 제한 도장 GUARD — 상단 취급 표시 APPROVED FOR RELEASE 78 DEC 1997 — 공개 승인 도장 Military Information: Soviet Officers Arrive in Yenchi from Korea"}, {"id": "M15", "order": 12, "date": "1946-08-14", "group": "B", "eyebrow": "1946 만주·북조선 · 현장 첩보보고", "title": "군사 첩보: 소련군 활동", "badge": "confidential (U.S. AND BRITISH OFFICIALS ONLY)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1946-08-14"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Soviet Activities", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000100660006-6"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000100660006-6"}], "summary": "소련과 조선의 국경 지대에 일본인과 만주인과 괴뢰 조선인이 섞인 「국민공산군(National Communist Troops)」이라는 조직이 있다고 적은 한 문단짜리 보고다.", "points": ["국가 표시가 Korea 다. 표제는 소련군 활동이고 보는 곳은 소·조선 국경 지대다.", "「국민공산군(National Communist Troops)」은 일본인, 만주인, 괴뢰 조선인이 섞인 혼성 조직이다. 원문은 combined Japanese-Manchurian-puppet-Korean organization 이라고 적었다.", "소련이 이 집단을 아직 조직하는 중이라고 보고한다. 이미 선 조직이 아니라 만들어지는 중인 것으로 본 것이다.", "병력은 약 40¢,000명이고 세 파로 나뉜다. 병력 수의 자릿수가 스캔에서 뭉개져 있다.", "본문이 이 한 문단뿐이고 출처와 정보 입수 일자는 지워져 있다."], "primary": "기밀(CONFIDENTIAL)\n\n공개 승인 2001/0392 [원문 그대로] : CIA-RDP[판독 불가]-00457R0001[판독 불가]\n\n미국 및 영국 관리 전용(U.S. AND BRITISH OFFICIALS ONLY)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)   25X1A2g\n\n국가   조선(Korea)            일자:  25X1A6a\n주제   군사 첩보: 소련군 활동\n배포(DIST.)  1646년 [원문 그대로] 11월 29일\n면수  1\n보충(SUPPLEMENT)\n출처(ORIGIN)  [삭제]\n\n이 문서는 이에 [판독 불가]\n[판독 불가] 에 따라 [판독 불가]\n\n1. 소련과 조선의 국경을 따라 놓인 지역에 일본인과 만주인과 괴뢰 조선인이 섞인 조직이 있으며, 「국민공산군(National Communist Troops)」([한자 판독 불가])이라 불린다. 소련은 이 집단을 아직 조직하려 하고 있으며, [판독 불가] 약 40¢,000 [원문 그대로] 명으로 이루어지고 세 파로 나뉜다.\n\n25X1A9a\n\n25X1A9a", "secondary": "CONFIDENTIAL\n\nApproved For Release 2001/0392 [원문 그대로] : CIA-RDP[판독 불가]-00457R0001[판독 불가]\n\nU.S. AND BRITISH OFFICIALS ONLY\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT   25X1A2g\n\nCOUNTRY   Korea            DATE:  25X1A6a\nSUBJECT   Military Information: Soviet Activities\nDIST.  29 November 1646 [원문 그대로]\nPAGES  1\nSUPPLEMENT\nORIGIN  [삭제]\n\nThis document is hereby [판독 불가]\n[판독 불가] with the [판독 불가]\n\n1. In the area along the USSR-Korean border, there is a combined Japanese-Manchurian-puppet-Korean organization called the \"National Communist Troops\" ([한자 판독 불가]). The Soviets are still trying to organize this group, [판독 불가] consists of approximately 40¢,000 [원문 그대로] men who are divided into three factions.\n\n25X1A9a\n\n25X1A9a", "notes": ["[삭제·공개 표시] Approved For Release 2001/0392 : CIA-RDP[판독 불가]-00457R0001 (공개 승인 도장)", "[삭제·공개 표시] 25X1A2g (INTELLIGENCE REPORT 줄 오른쪽)", "[삭제·공개 표시] 25X1A6a (DATE 줄)", "[삭제·공개 표시] 25X1A9a (본문 아래 두 곳)", "[삭제·공개 표시] ORIGIN 줄의 출처 표시가 비어 있어 [삭제]로 옮겼다", "[삭제·공개 표시] 본문 위 재분류 도장의 글자 대부분이 판독되지 않는다"], "note": "본문이 한 문단뿐이고 그 한 문단마저 여러 곳이 뭉개졌다. 병력 수가 `40¢,000` 으로 찍혀 있다. 40만인지 4만인지 40만 몇천인지 가릴 수 없어 숫자를 고치지 않고 원문 그대로 두었다. 배포일은 `29 November 1646` 으로 찍혀 있다. 1946년이 분명하나 날짜의 숫자는 고치지 않았다. 조직 이름 뒤에 달린 한자 병기가 `(19 2 op }` 로 뭉개져 한 글자도 확정되지 않는다. 「National Communist Troops」의 우리말 이름은 확정할 수 없어 원어를 앞세우고 음을 따 「국민공산군」으로 달았다. `The Soviets are still trying to organize this group, la Sn consists of` 에서 `la Sn` 은 관계절을 여는 말로 보이나 확정되지 않아 판독 불가로 두었다. 낱말 교정은 `INTELNGENCE` 를 INTELLIGENCE 로, `Militury`·`.ctivities` 를 Military·Activities 로, `Japunese~Venchuri an~puppet-Koreun` 을 Japanese-Manchurian-puppet-Korean 으로, `orgunive` 를 organize 로, `upproxim tely` 를 approximately 로, `uiviaea into three fuctions` 를 divided into three factions 로 한 것이다. 좌표는 이 문서에 나오지 않는다.", "warn": true, "search": "Approved For Release 2001/0392 : CIA-RDP[판독 불가]-00457R0001 (공개 승인 도장) 25X1A2g (INTELLIGENCE REPORT 줄 오른쪽) 25X1A6a (DATE 줄) 25X1A9a (본문 아래 두 곳) ORIGIN 줄의 출처 표시가 비어 있어 [삭제]로 옮겼다 본문 위 재분류 도장의 글자 대부분이 판독되지 않는다 Military Information: Soviet Activities"}, {"id": "M16", "order": 13, "date": "1946-08-15", "group": "B", "eyebrow": "1946 만주·북조선 · 현장 첩보보고", "title": "경제 첩보: 지린성 간도성의 경제 사정", "badge": "restricted", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1946-08-15"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Economic Information: Economic Conditions in Chientao Province, Kirin", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000100650005-8"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000100650005-8"}], "summary": "간도성(間島省)의 석탄 생산, 기계 공업, 식량 사정, 통화, 옌지 시내 사정, 철도를 항목별로 적은 두 면짜리 보고다.", "points": ["라오터우거우(老頭溝) 탄광을 중국공산군이 운영한다. 정전과 부품 부족으로 하루 평균 생산이 들쭉날쭉하다. 일본인 밑에서는 네 갱에서 하루 7,000톤을 냈으나 지금은 제2갱과 제3갱만 쓴다. 1946년 7월 1일 제4갱에 불이 났다.", "화룡(和龍)의 다섯 갱은 아직 생산이 없고 쌓아 둔 저탄을 헐어 쓴다. 저탄은 1945년 8월에 8,000톤이었다. 세 광산의 석탄은 공산군이 운영하는 철도가 쓴다.", "농기계 공작소가 7월 1일 옌지에서 훈춘으로 옮겨졌고 라오터우거우 탄광의 수리 기계도 같이 갔다. 중국공산군은 일본인 기술자를 계속 쓰고 옌지에 스무 명이 있다.", "간도성은 일본인 밑에서도 식량을 들여오던 곳이다. 교통이 어지러워 사정이 심각하다. 6월 한 달 동안 굶어 죽은 사람이 나온다. 누구의 처와 아이인지는 지워져 있다.", "공산군은 만주족과 중국인에게 팔 식량을 열차로 들여왔고 일본인에게는 값을 더 받고 팔았다. 수수는 16킬로에 650엔이고 쌀값은 알려져 있지 않다.", "만주국폐, 소련군표, 치둥은행권, 둥베이은행권 네 가지가 같은 값어치로 돈다.", "옌지는 전등과 물이 평소대로 들어오고 평온하다. 조선인 조직의 본부가 옛 일본인 건설 사무소에 있고 중국공산군 본부는 옛 성 경찰훈련소에 있다.", "옌지에서 둔화까지 하루 한 번 열차가 다니고 노선은 모두 표준궤다. 일본인은 열차를 탈 수 없다."], "primary": "문서번호 [판독 불가]\n등급 변경 없음(NO CHANGE in Class.) [판독 불가]\n공개 승인 1999/09/08 : CIA-RDP82-00457R0001[판독 불가]006\n대외비(RESTRICTED)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n첩보보고(INTELLIGENCE REPORT)\n\n일자:  [판독 불가]\n정보 입수 일자(INFO. DATE):  25X1A2\n주제   경제 첩보: [판독 불가]\n배포(DIST.)  1946년 11월 29일\n면수  2\n보충(SUPPLEMENT)\n출처(ORIGIN)\n25X1X6\n\n[국립문서보관관(Archivist) [판독 불가]]\n\n1. 석탄 생산\n\n25X1X6\n가. 라오터우거우(Laot'oukou 老頭溝) (1°9- 10, 4m 5h) [원문 그대로]의 탄광은 [삭제]가 마지막으로 관찰하였을 때 중국공산군이 운영하고 있었다. 생산량은 정전과 낡은 기계의 부품 부족 때문에 들쭉날쭉하며, 하루 평균 <00 [원문 그대로]톤이다.\n\n나. 1946년 7월 1일까지는 제4갱을 채굴하였다. 그날 갱 안에 불이 났고, 지금은 제2갱과 제3갱을 쓴다.\n\n다. 일본인 밑에서는 이 광산이 네 개의 갱으로 이루어져 있었고 만주철도회사(Manchuria Railroad Company)가 운영하였으며, 하루 생산량은 7,000톤이었다.\n\n라. 화룡(Holung 和龍) (129-39, 42-38)에는 만주탄광주식회사(Manchuria Tanko Kabushiki Kaisha)의 갱 두 개와 산와광업(Sanwa Kongyo Mining Companies)의 갱 세 개가 있다. 중국공산군이 이를 가동하려 하고 있으나 아직 생산은 없다. 25X1X6 다만 쌓아 둔 저탄을 헐어 쓰고 있으며, 저탄은 19455년 [원문 그대로] 8월에 8,000톤이었다. 현재 저탄의 규모는 알려져 있지 않다.\n\n마. 위 세 광산의 석탄은 공산군이 운영하는 철도가 쓰고 있다.\n\n2. 그 밖의 생산\n\n가. 옌지(Yenchi 延吉) (129-31, 12-55) [원문 그대로]에는 [판독 불가] 기계를 [판독 불가]하는 업체가 있다. 농기계 공작소는 7월 1일 옌지에서 훈춘(Hunchun 琿春) (13022, 42-52) [원문 그대로]으로 옮겨졌다. 라오터우거우 탄광의 수리 기계도 같은 곳으로 옮겨졌다.\n\n나. 중국공산군은 아직도 일본인 기술자를 쓰고 있다. 옌지에는 지금 스무 명이 고용되어 있다.\n\n3. 식량 사정\n\n일본인 밑에서도 간도성(Chien Tao Province 間島省)은 식량을 들여오는 지방이었다. 지금은 25X1X6 교통과 통신이 어지러운 상태여서 사정이 심각하다. 6월 한 달 동안 [삭제]의 처와 아이 둘이 굶어 죽었다. 공산군은 만주족과 중국인에게 팔 식량을 열차 단위로 들여왔고, 값을 더 매겨 일본인에게도 팔았다. 수수(kaoliang) 값은 16킬로에 650엔이었다. 25X1A8a 쌀값은 알려져 있지 않다. 주: 이 지역의 식량 부족은 전에 보고된 바 없다.\n\n4. 통화\n\n네 가지 지폐가 돌고 있으며 값어치와 선호도가 모두 같다. 만주국폐가 있고, 소련군표가 있으며, 중국공산군이 낸 두 가지 지폐로 치둥은행권(Chitung Bank Notes)과 둥베이은행권(Tung Pei Bank Notes)이 있다.\n\n[배포 도장: [판독 불가] 대외비(RESTRICTED)  25X1A9a  25X1A2g / ADSO / 부(DEP.) [판독 불가] / PLANS / DADSO / EXEC. / [판독 불가]]\n\n25X1X6\n\n공개 승인 1999/09/08 : CIA-RDP82-00457R000109650005-8 [원문 그대로]\n2\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n5. 옌지 시내 사정\n\n옌지는 전등과 물이 평소대로 들어온다. 평온하고 질서가 있다. 새로 세워지는 공공 시설은 없다. 조선인 [판독 불가]주의자 본부는 전에 일본인의 다쿠미(Takumi) 건설 또는 공무 사무소였던 건물에 있다. 중국공산군은 전에 성 정부의 경찰훈련소였던 건물에 본부를 두고 있다.\n\n6. 철도 노선\n\n옌지와 둔화(Tunhua 敦化) (128-14, 43-12) 사이에 하루 한 번 열차가 다니며 두 시간이 걸린다. [삭제]는 철도 선로를 따라 걸었다. 일본인은 열차를 타는 것이 허용되지 않는다. 둔화에서 자오허(Chiaoho 蛟河) (127-20, 43-43)까지의 철도 여정은 세 시간이 걸렸다. 자오허에서 마안산(Maanshan 馬鞍山)까지 (128-45, 44-18) 열차로 40분이 걸렸다. 그는 노선이 모두 표준궤임을 보았다. 새로 놓는 철도는 보지도 못하였고 듣지도 못하였다.\n\n공개 승인 1999/09/08 : CIA-RDP82-00457R000100650005-8", "secondary": "Document No. [판독 불가]\nNO CHANGE in Class. [판독 불가]\nApproved For Release 1999/09/08 : CIA-RDP82-00457R0001[판독 불가]006\nRESTRICTED\n\nCENTRAL INTELLIGENCE GROUP\nINTELLIGENCE REPORT\n\nDATE:  [판독 불가]\nINFO. DATE:  25X1A2\nSUBJECT   Economic Information: [판독 불가]\nDIST.  29 November 1946\nPAGES  2\nSUPPLEMENT\nORIGIN\n25X1X6\n\n[Archivist [판독 불가]]\n\n1. Coal Production\n\n25X1X6\na. The coal mine at Laot'oukou (1°9- 10, 4m 5h) [원문 그대로] was being operated by the Chinese Communists when last observed by [삭제]. Production, which varies owing to electricity failures and lack of parts for worn machinery, averages <00 [원문 그대로] tons a day.\n\nb. Up to 1 July 1946 Shaft #4 was mined. On that date there was a fire in the shaft, and now Shafts #2 and #3 are in use.\n\nc. Under the Japanese, the mine consisted of four shafts and was operated by the Manchuria Railroad Company, with a daily production of 7,000 tons.\n\nd. At Holung (129-39, 42-38) there are two shafts of the Manchuria Tanko Kabushiki Kaisha and three shafts of Sanwa Kongyo Mining Companies. The Chinese Communists are attempting to put them in operation, but as yet there is no production. 25X1X6 They are, however, drawing on the stockpile, which consisted of 8,000 tons in August 19455 [원문 그대로]. The size of the present stockpile is unknown.\n\ne. The coal from the above three mines is being used by the Communist-operated railroads.\n\n2. Other Production\n\na. At Yenchi (129-31, 12-55) [원문 그대로] there are [판독 불가] firms [판독 불가] machinery. The farm machine tool plant was moved from Yenchi on 1 July to Hunchun (13022, 42-52) [원문 그대로]. Also moved to the same place was the repair machinery from the Laot'oukou coal mine.\n\nb. The Chinese Communists are still using Japanese technicians. In Yenchi twenty are now employed.\n\n3. Food Situation\n\nEven under the Japanese, Chien Tao Province was a food-importing district. Now with 25X1X6 communications in a state of confusion, the situation is critical. During the month of June [삭제] wife and 2 children died of starvation. The Communists have shipped in trainloads of food for sale to the Manchus and Chinese, and also, though at a higher price, to the Japanese. The price of kaoliang was 650 yen for 16 kilos. 25X1A8a The price of rice is unknown. Note: No reports have been received previously of food shortages this area.\n\n4. Currency\n\nThere are four kinds of notes in circulation, all of equal value and desirability. There is Manchukuo currency; Soviet Military notes; and two kinds of currency issued by the Chinese Communists, Chitung Bank Notes and Tung Pei Bank Notes.\n\n[Routing block: [판독 불가] RESTRICTED  25X1A9a  25X1A2g / ADSO / DEP. [판독 불가] / PLANS / DADSO / EXEC. / [판독 불가]]\n\n25X1X6\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R000109650005-8 [원문 그대로]\n2\n\nCENTRAL INTELLIGENCE GROUP\n\n5. Yenchi City Conditions\n\nYenchi has lights and water as usual. There is peace and good order. There are no new public installations being erected. The Korean [판독 불가]ist Headquarters is in the former Japanese Takumi Construction or Works Office; the Chinese Communists have their headquarters in the former Provincial Government Police Training School.\n\n6. Rail Lines\n\nTrains run once a day between Yenchi and Tunhua (128-14, 43-12), a two hour trip. [삭제] walked along rail line. No Japanese are permitted on the trains. The rail trip from Tunhua to Chiaoho (127-20, 43-43) took three hours. From Chiaoho to Maanshan (128-45, 44-18) by train took 40 minutes. He observed that the lines are all standard gauge. He did not see, nor was he informed, of any new rail construction.\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R000100650005-8", "notes": ["[삭제·공개 표시] Approved For Release 1999/09/08 : CIA-RDP82-00457R000109650005-8 및 CIA-RDP82-00457R000100650005-8 (두 면의 공개 승인 도장. 문서번호가 두 곳에서 달리 찍혔다)", "[삭제·공개 표시] 25X1X6 (ORIGIN 줄, 1항 앞, 라 항 안, 3항 안, 2면 머리)", "[삭제·공개 표시] 25X1A2 (INFO. DATE 줄)", "[삭제·공개 표시] 25X1A8a (3항 안)", "[삭제·공개 표시] 25X1A9a, 25X1A2g (아래쪽 배포 도장 옆)", "[삭제·공개 표시] 1항 가에서 관찰자를 가리키는 표시가 지워져 [삭제]로 옮겼다", "[삭제·공개 표시] 3항에서 굶어 죽은 이가 누구의 처와 아이인지 그 이름이 지워져 [삭제]로 옮겼다", "[삭제·공개 표시] 6항에서 선로를 따라 걸은 사람의 표시가 지워져 [삭제]로 옮겼다", "[삭제·공개 표시] SUBJECT 줄의 표제 뒷부분이 판독되지 않는다", "[삭제·공개 표시] Document No. 줄과 NO CHANGE in Class. 도장의 기재가 판독되지 않는다"], "note": "표제는 색인의 원제 ECONOMIC INFORMATION: ECONOMIC CONDITIONS IN CHIENTAO PROVINCE KIRIN 에 따라 읽었다. 스캔에서는 `SUBJECT Economic Information:` 뒤가 떨어져 나갔다. 지명은 원문 표기를 앞세우고 병기했다. Laot'oukou 라오터우거우(老頭溝), Holung 화룡(和龍), Yenchi 옌지(延吉), Hunchun 훈춘(琿春), Tunhua 둔화(敦化), Chiaoho 자오허(蛟河), Maanshan 마안산(馬鞍山), Chien Tao Province 간도성(間島省). 원문은 `Chien Tao` 로 띄어 썼고 색인 제목은 `Chientao` 로 붙여 썼다. 둘 다 간도다. 좌표는 고치지 않았다. 라오터우거우의 `(1°9- 10, 4m 5h)` 는 도와 분이 성립하지 않는 값이다. 옌지의 `(129-31, 12-55)` 는 위도가 12도로 찍혔고 훈춘의 `(13022, 42-52)` 는 경도의 도와 분 사이가 붙어 있다. 둔화·자오허·마안산·화룡의 좌표는 형태가 온전하다. 숫자는 고치지 않았다. 하루 평균 생산량이 `<00 tons` 로 찍혀 앞 숫자를 가릴 수 없다. 저탄이 쌓인 시점이 `August 19455` 로 찍혀 있다. 1945년으로 보이나 날짜의 숫자는 고치지 않았다. 3항에서 굶어 죽은 사람 대목은 원문이 `During the month of June ___ wife and 2 children died of starvation` 이고 앞의 소유자 이름이 지워져 있다. 채우지 않았다. 5항의 `The Korean ___ist Headquarters` 는 가운데가 떨어져 나가 어떤 조직인지 확정되지 않는다. 접미사 ist 만 남은 그대로 두었다. 낱말 교정은 `Leotioukow` 를 Laot'oukou 로, `Shaw. #4` 를 Shaft #4 로, `Manchuria Reilroad` 를 Manchuria Railroad 로, `Tonko Kabue shikikaisha` 를 Tanko Kabushiki Kaisha 로, `attompiing`·`cperation`·`productioa` 를 attempting·operation·production 으로, `d>aving` 을 drawing 으로, `Yenehi` 를 Yenchi 로, `etill`·`Japenese`·`technicians` 를 still·Japanese·technicians 로, `Eyeu` 를 Even 으로, `evitical` 을 critical 로, `cied` 를 died 로, `trainleada` 를 trainloads 로, `kacliang` 을 kaoliang 으로, `shorteges` 를 shortages 로, `Manchukvo` 를 Manchukuo 로, `Yoviet` 를 Soviet 으로, `* Pung Pei` 를 Tung Pei 로, `lighta` 를 lights 로, `ron once a day` 를 run once a day 로, `Chiacho` 를 Chiaoho 로, `tha`·`ses`·`ef` 를 the·see·of 로 한 것이다. 2항 가의 `there are rere firms vormintne nechinery` 는 업체 수와 업종을 가리키는 두 낱말이 뭉개져 판독 불가로 두었다. 마지막 문장의 `food shortages this area` 는 전치사가 빠진 채로 찍혀 있고 그대로 두었다. 아래쪽 배포 도장은 부서 약호만 몇 개 읽히고 나머지는 판독되지 않는다.", "warn": false, "search": "Approved For Release 1999/09/08 : CIA-RDP82-00457R000109650005-8 및 CIA-RDP82-00457R000100650005-8 (두 면의 공개 승인 도장. 문서번호가 두 곳에서 달리 찍혔다) 25X1X6 (ORIGIN 줄, 1항 앞, 라 항 안, 3항 안, 2면 머리) 25X1A2 (INFO. DATE 줄) 25X1A8a (3항 안) 25X1A9a, 25X1A2g (아래쪽 배포 도장 옆) 1항 가에서 관찰자를 가리키는 표시가 지워져 [삭제]로 옮겼다 3항에서 굶어 죽은 이가 누구의 처와 아이인지 그 이름이 지워져 [삭제]로 옮겼다 6항에서 선로를 따라 걸은 사람의 표시가 지워져 [삭제]로 옮겼다 SUBJECT 줄의 표제 뒷부분이 판독되지 않는다 Document No. 줄과 NO CHANGE in Class. 도장의 기재가 판독되지 않는다 Economic Information: Economic Conditions in Chientao Province, Kirin"}, {"id": "M07", "order": 14, "date": "1946-09-01", "group": "B", "eyebrow": "1946 만주·북조선 · 현장 첩보보고", "title": "정치첩보: 북만주의 조선인", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1946-09-01"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단(CIG)", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Political Information: Koreans in Northern Manchuria", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000300390009-1"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000300390009-1"}], "summary": "치치하얼, 퉁싱, 하얼빈 세 곳의 조선인을 정보원 여럿의 말로 정리한 보고다. 남은 조선인이 누구인지, 무장하고 있는지, 누구 편에서 싸우는지를 묻는다.", "points": ["치치하얼에는 조선인이 200에서 400명 있다. 한 정보원은 대부분 농민이라 하고, 다른 정보원은 노점상이며 남은 이들은 조선으로 돌아갈 형편이 안 되는 사람들뿐이라고 한다.", "치치하얼에 조선인회는 있으나 독립운동은 없다는 말과, 중국공산군이 들어왔을 때 조선 독립 이야기가 좀 돌았다는 말이 함께 실려 있다.", "두 번째 정보원은 조선인이 공정하게 대우받는다고 보면서도, 중국공산군이 조선인보다 일본인을 더 높이 친다고 여긴다.", "퉁싱(127-51, 46-22)의 조선인 부락은 약 2,000명이다. 1946년 5월 젊은 조선인들이 중국공산군을 도와 조선 독립을 얻으려 군대를 만든다는 말이 돌았고, 1945년 8월 퇴각하던 일본군에게서 뺏은 무기를 쓰려 했다.", "소련이 조선인을 돕는다고 정보원이 보는 근거가 둘이다. 무기 반납 명령에서 조선인은 빠졌고, 겨울에 조선인이 새 러시아 화폐로 일본인에게서 옷을 사들였다.", "하얼빈에서는 많은 조선인이 린뱌오의 동북민주연군에 속해 싸운다. 지휘관은 소련계로 분류되는 중국인 CHUNG Tzu-yün이다.", "이 조선인 부대의 사령부는 외국인 구역 삼가에 있고, 병력은 소련에서 훈련받았다. 그 밖에 하얼빈에 조선인 2,000명이 있다.", "공산군 밖에 대대 규모의 조선인 자치군이 따로 있고, 사령부는 옛 일본 영사관 건물이다.", "본문에 삽입된 주는 만주의 중국공산당이 소련계, 옌안계, 만주 토착계 셋으로 갈린다고 적었다."], "primary": "25X1A29\n\nApproved For Release: 1999/04/09 : CIA-RDP82-00457R000300390009-1\n\nCONFIDENTIAL\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n47324\n국가   중국(China)                          일자(DATE): 25X1X6\n                                            정보(INFO.)\n제목   정치첩보: 북만주의 조선인\n       (Political Information: Koreans in Northern Manchuria)   배포(DIST.) + February 1947 [원문 그대로]\n25X1A6a\n출처지(ORIGIN)   [LIBRARY COPY]              보충(SUPPLEMENT)\n\n1. 치치하얼(Tsitsihar 齊齊哈爾)\n\n가. 한 정보원은 시내에 조선인이 200명에서 400명 있다고 말한다. 대부분 농민이다. 다른 정보원은 조선인이 작은 노점을 꾸리는 일에 종사하며, 치치하얼에 남아 있는 자들은 조선으로 돌아가기에 너무 가난한 사람들뿐이라고 말한다.\n\n25X1X6\n\n나. 첫 번째 정보원은 조선인회(Korean Association)는 있으나 독립운동은 없다고 말한다. 두 번째 정보원은 중국공산군이 치치하얼에 들어왔을 때 조선 독립에 관한 이야기가 얼마간 있었다고 말했다.\n\n다. 두 번째 정보원에 따르면 조선인은 공정하게 대우받는다. 다만 정보원은 중국공산군이 조선인보다 일본인을 더 높이 평가한다고 본다.\n\n2. 퉁싱(Tunghsing 東興, 127-51, 46-22)\n\n가. 약 2,000명의 조선인 부락이 있다. 1946년 5월, 정보원은 젊은 조선인들이 중국공산군을 도와 조선 독립을 확보하려고 군대를 만들려 한다는 말을 들었다. 이들은 1945년 8월 일본군이 이 지역을 지나 퇴각할 때 그들에게서 노획한 무기를 쓸 참이었다. 정보원은 조선인이 소련의 도움을 받고 있다고 본다. 그 근거는 두 가지다. 소련이 모든 무기와 병기를 반납하라고 명령했을 때 조선인은 면제되었다는 것, 그리고 1915년 [원문 그대로] 겨울에 조선인들이 퉁베이(Tungpei 東北, 126-52, [판독 불가]7-59)에 들어와 새 러시아 화폐로 일본인에게서 옷을 사들였다는 것이다.\n\n3. 하얼빈(Harbin)   25X1X6\n\n가. 두 정보원은 하얼빈에서 많은 조선인이 중국공산군에 복무한다는 데 의견이 같다. 그중 한 정보원은 이들을 [판독 불가]로 지목하며, 린뱌오(LIN Piao 林彪)의 동북민주연군(United Democratic Army)의 일부이고 병력이 약 2[판독 불가]0,000명이라고 말한다. 지휘관은 중국인 CHUNG Tzu-yün 중쯔윈([판독 불가])이며 소련계(Soviet Clique)에 속한다.\n(GM 주: 만주의 중국공산당은 소련계, 옌안계, 만주 토착계 셋으로 갈린다.)\n이 조선인 부대의 사령부는 외국인 구역 삼가(Third Street)에 있다. 병력 대부분은 시내 [판독 불가] 구역에 숙영한다.   25X1X6   이 부대는 소련에서 훈련받았다. 이 병력 말고도 하얼빈에는 조선인 2,000명이 있다. [삭제] 다른 정보원은 공산군에서 싸우는 조선인 외에 조선인 자치군(Korean Self-Administration army)에 복무하는 자도 많다고 말한다. 이 부대는 대대 규모이며 사령부를 옛 일본 영사관 건물에 두고 있다.\n\n분류(CLASSIFICATION)   CONFIDENTIAL\n\n25X1X6\n\n문서번호 [판독 불가]\n\n이 문서는 개정된 간첩법(50 U.S.C. 31 및 32)이 정하는 바 미합중국의 국방에 관계된 정보를 담고 있다. 권한 없는 자에게 이를 전달하거나 그 내용을 어떤 방식으로든 누설하는 것은 법으로 금지된다.\n\nApproved For Release: 1999/04/09 : CIA-RDP82-00457R000300390009-1", "secondary": "25X1A29\n\nApproved For Release: 1999/04/09 : CIA-RDP82-00457R000300390009-1\n\nCONFIDENTIAL\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\n47324\nCOUNTRY   China                                DATE: 25X1X6\n                                               INFO.\nSUBJECT   Political Information: Koreans in Northern\n          Manchuria                            DIST. + February 1947 [원문 그대로]\n25X1A6a\nORIGIN    [LIBRARY COPY]                       SUPPLEMENT\n\n1. Tsitsihar\n\na. One source states there are 200-400 Koreans in the city. Most of them are farmers. Another source says that the Koreans are employed as operators of small street stalls, and that the only ones remaining in Tsitsihar are those too poor to go back to Korea.\n\n25X1X6\n\nb. The first source says there is a Korean Association, but there are no independence movements. The second said that when the Chinese Communists entered Tsitsihar, there was some talk of Korean independence.\n\nc. The Koreans, according to the second source, are treated fairly. Source believes, however, that the Chinese Communists regard the Japanese more highly than they do the Koreans.\n\n2. Tunghsing (127-51, 46-22)\n\na. There is a Korean settlement of about 2,000 people. In May 1946, source heard that the young Koreans were going to form an army to help the Chinese Communists secure Korean independence. They were going to use arms captured from the Japanese soldiers when the latter retreated through the district in August 1945. Source believes that the Koreans are receiving help from the Soviets. His reasons are that when the Soviets ordered all arms and weapons to be handed in, the Koreans were exempted, and that in the winter of 1915 [원문 그대로] the Koreans came into Tungpei (126-52, [판독 불가]7-59) and bought clothing from the Japanese, using new Russian currency.\n\n3. Harbin   25X1X6\n\na. Two sources agree that many Koreans serve with the Chinese Communist forces at Harbin. One of the sources identifies these men as [판독 불가], a part of LIN Piao's United Democratic Army, and states that there are approximately 2[판독 불가]0,000 troops. Their commander is a Chinese, CHUNG Tzu-yün ([판독 불가]), who belongs to the Soviet Clique.\n(GM note: Chinese Communists in Manchuria are divided into three parties: Soviet, Yenan, and native Manchurian.)\nThe headquarters of these Korean forces is on Third Street in the Foreign Section. Most of the men are quartered in the [판독 불가] sector of the city.   25X1X6   The troops were trained in the USSR. In addition to these forces, there are 2,000 Koreans in Harbin. [삭제] other source says that besides the Koreans fighting in the Communist army, there are also many serving in a Korean Self-Administration army. This is about the size of a battalion, and has its headquarters in the old Japanese Consulate building.\n\nCLASSIFICATION   CONFIDENTIAL\n\n25X1X6\n\nDocument No. [판독 불가]\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50 U.S.C. 31 and 32, as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nApproved For Release: 1999/04/09 : CIA-RDP82-00457R000300390009-1", "notes": ["[삭제·공개 표시] 25X1A29 — 첫 면 상단", "[삭제·공개 표시] 25X1X6 — 본문 다섯 곳 이상", "[삭제·공개 표시] 25X1A6a — 머리 ORIGIN 줄 옆", "[삭제·공개 표시] Approved For Release: 1999/04/09 CIA-RDP82-00457R000300390009-1 — 상하단 공개 도장", "[삭제·공개 표시] DATE / INFO 칸의 값이 25X1X6으로 지워져 있다"], "note": "하얼빈 조선인 부대의 병력 수가 OCR에서 「2%0»000」으로 뭉개졌다. 20,000으로도 250,000으로도 읽힐 수 있어 2[판독 불가]0,000으로 두었다. 숫자를 채워 넣지 않았다.\n\n퉁베이의 좌표가 「(126-52,),7-59)」로 찍혀 나온다. 위도 앞자리가 깨져 (126-52, [판독 불가]7-59)로 두었다. 퉁싱의 좌표 (127-51, 46-22)는 그대로 읽힌다.\n\n소련의 무기 반납 명령을 말하는 대목에 「1915년 겨울」이 나온다. 앞뒤 문맥은 1945년이지만 날짜의 숫자라 고치지 않고 원문 그대로 두었다.\n\n배포 일자가 「+ February 1947」로 찍혀 날짜 숫자가 없다. 그대로 두었다.\n\n하얼빈 조선인들을 무엇으로 지목했는지 적은 낱말이 OCR에서 「Hides」로 나온다. 뜻이 서지 않아 [판독 불가]로 두었다. 숙영지 구역 이름 「Shanzht.o」도 같다.\n\n본문에 끼워 넣은 주가 「GM note」로 시작한다. 발신 기관의 약호로 보이나 확정할 수 없어 원문 표기를 그대로 옮겼다.\n\n지명은 Tsitsihar 치치하얼, Tunghsing 퉁싱, Tungpei 퉁베이, Harbin 하얼빈으로 읽었다. 원문 표기를 앞에 두고 병기했다.\n\n문서 자체의 배포는 1947년 2월이고 정보 일자 칸은 25X1X6으로 지워져 있다. raw/index.json의 날짜는 1946-09-01이다.", "warn": false, "search": "LIN Piao 린뱌오(林彪) (동북민주연군 사령) CHUNG Tzu-yün 중쯔윈 (하얼빈 조선인 부대 지휘관. 중국인이며 소련계로 분류된다) 25X1A29 — 첫 면 상단 25X1X6 — 본문 다섯 곳 이상 25X1A6a — 머리 ORIGIN 줄 옆 Approved For Release: 1999/04/09 CIA-RDP82-00457R000300390009-1 — 상하단 공개 도장 DATE / INFO 칸의 값이 25X1X6으로 지워져 있다 Political Information: Koreans in Northern Manchuria"}, {"id": "M08", "order": 15, "date": "1946-10-01", "group": "B", "eyebrow": "1946 만주·북조선 · 현장 첩보보고", "title": "정치 첩보: 만주 주재 임시정부 인사", "badge": null, "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1946-10-01"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Political Information: Personnel of Korean Provisional Government in Manchuria", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000300450004-9"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000300450004-9"}], "summary": "만주에 나와 있는 임시정부 관계자 네 사람의 소재와 직책을 적었다. 이름의 로마자와 한자가 대부분 뭉개져 사람을 확정할 수 없다.", "points": ["중앙정보단이 문서 머리에 주를 붙였다. 임시정부는 중국에 있던 조선인들이 스스로 세운 망명정부이고, 전쟁 동안 중국이 그렇게 인정했다는 설명이다.", "만주 주재 임시정부 대표단의 수반은 [판독 불가] Pak-kan 이다. 현재 봉천(Mukden)에 있고, 어디에서 왔는지는 지워져 있다.", "장춘 조선인회 전 회장 CHENG 은 조선인회 연맹의 총무다. 본명이 CHENG Chun-sin 이라는 것은 그의 개인적 친구가 확인해 주었다고 적혀 있다.", "임시정부 고문 [판독 불가] Suk 은 남조선으로 갈 기회를 기다리고 있다.", "PAK Yong-nin 이 최근 조선인회 회장에 임명되었고, 보좌는 CHO Byong-nic 이다.", "네 사람의 한자 이름이 모두 원문에 병기되어 있으나 스캔에서 뭉개져 한 글자도 읽히지 않는다."], "primary": "[정본화 - 공개 승인 : CIA-RDP82-00457R000300450004-9]\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가   중국\n주제   정치 첩보: 만주 주재 임시정부 인사\n배포(DIST.)  1947년 2월 7일\n25X1A6a\n면수  [판독 불가]\n보충(SUPPLEMENT)\n열람용 사본(LIBRARY COPY)  25X1X6\n\n[주: 임시정부(Korean Provisional Government)는 중국에 있던 조선인들이 스스로 조선의 망명정부로 세운 집단이었다. 전쟁 동안 중국은 그들을 그렇게 인정하였다.]\n\n25X1A6a\n\n1. [판독 불가] Pak-kan ( [한자 판독 불가] )은 만주 주재 임시정부 대표단의 수반이다. 그는 현재 봉천(Mukden 奉天)에 있으며, [판독 불가]에서 그곳으로 왔다.\n\n25X1X6\n\n2. 장춘(Changchun 長春) 조선인회의 전 회장인 CHENG 은 현재 [판독 불가]에 있다. 그는 조선인회 연맹(League of Korean Associations)의 총무다. (상하이) [판독 불가] 주: [삭제]가 확인해 주었다. 그는 대상자의 개인적 친구이며, CHENG 의 본명이 CHENG Chun-sin [한자 판독 불가]이라고 말한다.\n\n3. 임시정부 고문인 [판독 불가] Suk [판독 불가]은 [판독 불가]에 있으며 남조선으로 갈 기회를 기다리고 있다.\n\n4. PAK Yong-nin ( [한자 판독 불가] )은 최근 [판독 불가] 조선인회의 회장으로 임명되었다. 그의 보좌는 CHO Byong-nic[판독 불가] [한자 판독 불가]이다.\n\n기밀등급 [판독 불가]\n\n[정본화 - 공개 승인 : CIA-RDP82-00457R000300450004-9]", "secondary": "Sanitized - Approved For Release : CIA-RDP82-00457R000300450004-9\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCOUNTRY   China\nSUBJECT   Political Information: Personnel of Korean Provisional Government in Manchuria\nDIST.  7 February 1947\n25X1A6a\nPAGES  [판독 불가]\nSUPPLEMENT\nLIBRARY COPY  25X1X6\n\n[Note: The Korean Provisional Government was a group of Koreans in China who set themselves up as Korea's government-in-exile. They were so recognized by China during the war.]\n\n25X1A6a\n\n1. [판독 불가] Pak-kan ( [한자 판독 불가] ) is the head of the Korean Provisional Government representatives in Manchuria. He is now in Mukden, having come there from [판독 불가]\n\n25X1X6\n\n2. CHENG, the former president of the Changchun Korean Association, is now in [판독 불가]. He is general secretary of the League of Korean Associations. (Shanghai) [판독 불가] Note: Confirmed by [삭제], a personal friend of subject, who states that CHENG's full name is CHENG Chun-sin [한자 판독 불가].\n\n3. [판독 불가] Suk [판독 불가], advisor to the Korean Provisional Government, is in [판독 불가] waiting for an opportunity to go to South Korea.\n\n4. PAK Yong-nin ( [한자 판독 불가] ) has recently been appointed head of the [판독 불가] Korean Association. His assistant is CHO Byong-nic[판독 불가] [한자 판독 불가]\n\nCLASSIFICATION [판독 불가]\n\nSanitized - Approved For Release : CIA-RDP82-00457R000300450004-9", "notes": ["[삭제·공개 표시] Sanitized - Approved For Release : CIA-RDP82-00457R000300450004-9 (문서 위아래 공개 승인 도장)", "[삭제·공개 표시] 25X1A6a (문서 머리와 본문 1항 앞)", "[삭제·공개 표시] 25X1X6 (1항 뒤 정보원 표시)", "[삭제·공개 표시] 25X1X6 (LIBRARY COPY 줄)", "[삭제·공개 표시] 2항의 확인자 이름이 먹칠되어 [삭제]로 옮겼다"], "note": "OCR 손상이 이 계열에서 가장 심한 문서다. 표제는 `Political Information: Personnel of Korean SIST. 7 / Provisional Government in Manchuria _ WISE February 1947` 로 배포일 줄이 제목 사이에 끼어 찍혔다. `SIST. 7`·`WISE February 1947` 을 `DIST. 7 February 1947` 로 읽었다. 인명은 모두 로마자만 남기고 한자를 짓지 않았다. 1항의 `is Pak-kan`, 3항의 `Sa Suk a7 cn i` 는 성이 뭉개져 누구인지 가릴 수 없다. 2항의 `UGHONG` 은 뒤에 나오는 `CHENG's full name is CHENG Chun-sin` 으로 보아 CHENG 으로 읽었다. 4항 `CHO Byonc-nicl` 은 끝 글자가 l 인지 k 인지 가려지지 않는다. `Xorea`·`Xorean`·`Serean` 은 Korea/Korean 으로, `hina` 는 China 로, `eroup` 은 group 으로, `acocnized` 는 recognized 로, `sesretary` 는 secretary 로 고쳤다. 문서번호 `CIA- RDP82-00457R000300430004%` 는 아래쪽 도장과 색인에 따라 000300450004-9 로 읽었으나 위쪽 도장의 숫자는 원문이 뭉개져 있다.", "warn": true, "search": "[판독 불가] Pak-kan (만주 주재 임시정부 대표단 수반) CHENG / CHENG Chun-sin (전 장춘 조선인회 회장, 조선인회 연맹 총무) [판독 불가] Suk (임시정부 고문) PAK Yong-nin (조선인회 회장) CHO Byong-nic[판독 불가] (PAK Yong-nin 의 보좌) Sanitized - Approved For Release : CIA-RDP82-00457R000300450004-9 (문서 위아래 공개 승인 도장) 25X1A6a (문서 머리와 본문 1항 앞) 25X1X6 (1항 뒤 정보원 표시) 25X1X6 (LIBRARY COPY 줄) 2항의 확인자 이름이 먹칠되어 [삭제]로 옮겼다 Political Information: Personnel of Korean Provisional Government in Manchuria"}, {"id": "M09", "order": 16, "date": "1946-10-31", "group": "B", "eyebrow": "1946 만주·북조선 · 현장 첩보보고", "title": "군사 첩보: 마오쩌둥이 하얼빈에서 회의를 열다", "badge": null, "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1946-10-31"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: MAO Tze-tung Holds Meeting in Harbin", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000100230013-5"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000100230013-5"}], "summary": "10월 21일경 하얼빈에서 열린 긴급회의를 전한다. 중국공산당과 조선인 공산주의자, 몽골인민공화국 대표가 만주의 방어 구역을 나눴다는 내용이다.", "points": ["회의 참석자는 고위 공산당원, 조선인 공산주의자 대표, 몽골인민공화국 대표 셋이다. 세 당사자가 군사작전에서 협력하기로 했다고 적었다.", "조선민주연합정부가 북만주 28개 현의 방어를 맡는다.", "조선공산독립군이 옌지와 안둥 관구의 12개 현의 방어를 맡는다.", "몽골인민공화국은 싱안성을, 나머지 지역은 중국공산군이 맡는다. 중국공산군은 하얼빈 이남에 병력을 모아 공격에 나선다고 적었다.", "중앙정보단이 주를 달아 국민당군이 1946년 10월 안둥을 점령했다는 보고가 있었다고 적었다. 본문의 안둥 방어 배정과 어긋나는 대목이다."], "primary": "25X1A2g\n\n[공개 승인 1999/09/08 : CIA-RDP82-00457R000100230013-5]\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n일자:  25X1X6\n\n국가   중국\n주제   군사 첩보: 마오쩌둥(MAO Tze-tung)이 하얼빈에서 회의를 열다\n배포(DIST.)  19,6년 10월 31일 [원문 `31 October 19,6` 그대로]\n면수  1\n보충(SUPPLEMENT)\n\n25X1A6a\n\n1. 10월 21일경 마오쩌둥(MAO Tze-tung)이 하얼빈(Harbin)에서 긴급회의를 열었고, 고위 공산당원과 조선인 공산주의자 대표, 몽골인민공화국 대표가 참석하였다. 세 당사자가 군사작전에서 협력하기로 결정되었다.\n\n2. 조선민주연합정부(Korean Democratic Allied Government)가 북만주 28개 현(hsien)의 방어를 맡는다. 조선공산독립군(Korean Communist Independent Army)이 옌지(Yenchi 延吉)와 안둥(Antung 安東) 관구의 12개 현의 방어를 맡는다.\n\n25X1A6a\n[주: 국민당군이 1946년 10월 [판독 불가]일에 안둥을 점령하였다는 보고가 있었다.]\n\n3. 몽골인민공화국이 싱안성(Hsingan Provinces 興安)의 방어를 맡는다.\n\n4. 그 밖의 모든 지역은 중국공산군이 지킨다. 중국공산군은 하얼빈 이남에 병력을 집결시켜 공격에 나서기로 되어 있다.\n\n25X1A2g\n25X1A9a  25X1A9a", "secondary": "25X1A2g\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R000100230013-5\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nDATE:  25X1X6\n\nCOUNTRY   China\nSUBJECT   Military Information: MAO Tze-tung Holds Meeting in Harbin\nDIST.  31 October 19,6 [원문 그대로]\nPAGES  1\nSUPPLEMENT\n\n25X1A6a\n\n1. On about 21 October, MAO Tze-tung held an emergency meeting in Harbin which was attended by high ranking Communists, Korean Communist representatives and Mongolian People's Republic representatives. It was decided that the three parties would cooperate in military operations.\n\n2. The Korean Democratic Allied Government is to be responsible for the defense of twenty-eight hsiens in North Manchuria. The Korean Communist Independent Army is to be responsible for the defense of twelve hsiens of Yenchi and Antung Districts.\n\n25X1A6a\n[Note: It was reported that the Nationalists captured Antung on [판독 불가] October 1946.]\n\n3. The Mongolian People's Republic is to be responsible for the defense of Hsingan Provinces.\n\n4. All other areas are to be protected by the Chinese Communists who are to concentrate their forces south of Harbin to launch an attack.\n\n25X1A2g\n25X1A9a  25X1A9a", "notes": ["[삭제·공개 표시] 25X1A2g (문서 첫 줄과 끝)", "[삭제·공개 표시] Approved For Release 1999/09/08 : CIA-RDP82-00457R000100230013-5 (공개 승인 도장)", "[삭제·공개 표시] 25X1X6 (DATE 줄)", "[삭제·공개 표시] 25X1A6a (본문 앞과 2항 뒤 주 앞)", "[삭제·공개 표시] 25X1A9a 25X1A9a (문서 끝 배포처 표시)"], "note": "배포일 `DIST. 31 October 19,6` 의 연도가 뭉개져 `19,6` 으로 찍혀 있다. 1946으로 보이나 날짜의 숫자는 고치지 않고 원문대로 두었다. `MAQ` 은 MAO 로, `Meebing` 은 Meeting 으로, `Feople's` 는 People's 로, `partles` 는 parties 로, `Ib` 는 It 로, `Ad. other` 는 All other 로, `coxentrate` 는 concentrate 로 고쳤다. 국민당군의 안둥 점령 날짜는 `on ober 1946` 으로 일자가 떨어져 나가 판독 불가로 두었다. `hsien` 은 현(縣)이나 원문 표기를 살렸다. 조선인 조직명 두 개(Korean Democratic Allied Government, Korean Communist Independent Army)는 이 시기 다른 자료에서 확인되는 정식 명칭이 아니어서 원문을 직역하고 로마자를 병기했다.", "warn": false, "search": "MAO Tze-tung 마오쩌둥(毛澤東) 25X1A2g (문서 첫 줄과 끝) Approved For Release 1999/09/08 : CIA-RDP82-00457R000100230013-5 (공개 승인 도장) 25X1X6 (DATE 줄) 25X1A6a (본문 앞과 2항 뒤 주 앞) 25X1A9a 25X1A9a (문서 끝 배포처 표시) Military Information: MAO Tze-tung Holds Meeting in Harbin"}, {"id": "M10", "order": 17, "date": "1946-11-11", "group": "B", "eyebrow": "1946 만주·북조선 · 현장 첩보보고", "title": "군사 첩보: 북조선 주둔 소련군 배치", "badge": "confidential (CONTROL — U.S. OFFICIALS ONLY)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1946-11-11"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Disposition of Soviet Troops in Northern Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000300730006-6"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000300730006-6"}], "summary": "북조선의 소련군 배치를 알린 앞선 보고와 다른 출처에서 들어온 비슷한 보고를 대조한 것이다. 두 보고가 어긋나는 지점만 지명별로 뽑아 적었다.", "points": ["두 보고의 부대와 병력 수는 대체로 같았고, 아래 적은 지점만 달랐다고 밝힌다. 그래서 이 문서는 배치의 전모가 아니라 차이 목록이다.", "공군이 배치된 곳은 평양, 신의주, 사리원, 함흥, 나진동 다섯이다. 각각 240 대 243 계열의 숫자로 갈린다.", "소련 보병여단은 선천, 정주, 개천, 대사도, 용암포, Sansa[판독 불가], Naneni, Unggiryong 여덟 곳에 나온다. 한 보고는 4,000, 다른 보고는 2,400으로 적었다.", "Sansa[판독 불가] 항목에는 위치와 부대와 수에 관한 언급이 없다는 주가 붙어 있다.", "항목 기호가 a, b, e, f, h, p, q, r, s, t, u, v, w 로 건너뛴다. 사이의 항목은 두 보고가 일치해 실리지 않은 것으로 보인다."], "primary": "[공개 승인 1999/09/08 : CIA-RDP82-00457R000300730006-6]\n\n통제(CONTROL)\n미국 관리 전용(U.S. OFFICIALS ONLY)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n일자:  25X1X6\n\n국가   조선\n주제   군사 첩보: 소련군 배치 [북조선]\n배포(DIST.)  [판독 불가]\n25X1A6a  면수  2\n보충(SUPPLEMENT)\n출처(ORIGIN)  25X1X6\n\n25X1A2g\n25X1A6\n\n[주: 북조선의 소련군 배치를 알린 [판독 불가] 출처의 [삭제]를 보라. 이와 비슷한 보고가 [삭제]로부터 접수되었다. 병력 수와 부대는 두 보고에서 같았으며, 아래에 적은 것만 다르다.]  25X1A6a   25X1A6a\n\na. 평양(Pyongyang)\n   공군 --- 240   2143\nb. 신의주(Sinuiju)\n   공군 --- 240   243\ne. 사리원(Sariwon)\n   공군 --- 240   2h3\nf. 함흥(Hamhung)\n   공군 --- 240   245\nh. 나진동(Najindong)\n   공군 --- 240   2h3\np. 선천(Sonchon)\n   소련 보병여단   4,000   2,400\nq. 정주(Chongju)\n   소련 보병여단   4,000   2,400\nr. 개천(Kaechon)\n   소련 보병여단   4,000   2,400\ns. 대사도(Taedasado)\n   소련 보병여단   4,000   2,400\nt. 용암포(Yongampo)\n   소련 보병여단   4,000   2400\n\n25X1A8a\n25X1A9a\n\n[ADSO] [SPOF] [EDABSS] [SPDS] [EXES] [CONTROL] [FBP] [SPDA] [TRB] [XI]\n\n[공개 승인 1999/09/08 : CIA-RDP82-00457R000300730006-6]\n\n[공개 승인 1999/09/08 : CIA-RDP82-00457R000300730006-6]\n\n기밀(CONFIDENTIAL)\n25X1A2g\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\nu. Sansa[판독 불가]\n   소련 보병여단   4,000   [위치·부대·수에 관하여 언급이 없다.]\n\nv. Naneni\n   소련 보병여단   4,000   2,400\nw. Unggiryong\n   소련 보병여단   4,000   2,400\n\n기밀(CONFIDENTIAL)\n\n미국 관리 전용(U.S. OFFICIALS ONLY)\n\n[공개 승인 1999/09/08 : CIA-RDP82-00457R000300730006-6]", "secondary": "Approved For Release 1999/09/08 : CIA-RDP82-00457R000300730006-6\n\nCONTROL\nU.S. OFFICIALS ONLY\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nDATE:  25X1X6\n\nCOUNTRY   Korea\nSUBJECT   Military Information: Disposition of Soviet [Troops in North Korea]\nDIST.  [판독 불가]\n25X1A6a  PAGES  2\nSUPPLEMENT\nORIGIN  25X1X6\n\n25X1A2g\n25X1A6\n\n[Note: See [삭제] of [판독 불가] origin giving Soviet troop dispositions in North Korea. This similar report was received from [삭제]. The number of troops and units were the same in both reports with the exceptions given below.]  25X1A6a   25X1A6a\n\na. Pyongyang\n   Air Forces --- 240   2143\nb. Sinuiju\n   Air Forces --- 240   243\ne. Sariwon\n   Air Forces --- 240   2h3\nf. Hamhung\n   Air Forces --- 240   245\nh. Najindong\n   Air Forces --- 240   2h3\np. Sonchon\n   USSR Infantry Brigade   4,000   2,400\nq. Chongju\n   USSR Infantry Brigade   4,000   2,400\nr. Kaechon\n   USSR Infantry Brigade   4,000   2,400\ns. Taedasado\n   USSR Infantry Brigade   4,000   2,400\nt. Yongampo\n   USSR Infantry Brigade   4,000   2400\n\n25X1A8a\n25X1A9a\n\n[ADSO] [SPOF] [EDABSS] [SPDS] [EXES] [CONTROL] [FBP] [SPDA] [TRB] [XI]\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R000300730006-6\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R000300730006-6\n\nCONFIDENTIAL\n25X1A2g\nCENTRAL INTELLIGENCE GROUP\n\nu. Sansa[판독 불가]\n   USSR Infantry Brigade   4,000   [No mention made of location, unit and number.]\n\nv. Naneni\n   USSR Infantry Brigade   4,000   2,400\nw. Unggiryong\n   USSR Infantry Brigade   4,000   2,400\n\nCONFIDENTIAL\n\nU.S. OFFICIALS ONLY\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R000300730006-6", "notes": ["[삭제·공개 표시] Approved For Release 1999/09/08 : CIA-RDP82-00457R000300730006-6 (면마다 찍힌 공개 승인 도장, 세 번)", "[삭제·공개 표시] 25X1X6 (DATE 줄과 ORIGIN 줄)", "[삭제·공개 표시] 25X1A6a, 25X1A6, 25X1A2g, 25X1A8a, 25X1A9a (본문 여백의 면제 표시)", "[삭제·공개 표시] 머리 주에서 참조 보고서 번호와 접수처 두 곳이 먹칠되어 [삭제]로 옮겼다"], "note": "표의 오른쪽 여백에 세로로 찍힌 도장 글자가 표 안으로 흘러들어와 숫자 뒤에 붙었다. 표에 딸린 두 숫자 열의 머리글이 스캔에서 잘려 무엇을 뜻하는지 원문에서 확인되지 않는다. 공군 항목의 둘째 숫자가 `2143`·`243`·`2h3`·`245` 로 제각기 읽힌다. 모두 같은 값(243으로 보인다)일 가능성이 크나 숫자는 고치지 않고 원문대로 두었다. 용암포의 `2400` 도 다른 줄과 달리 쉼표가 없으나 그대로 두었다. 지명은 `Sarisron`→Sariwon 사리원, `Hemhung`→Hamhung 함흥, `HNajindong`→Najindong 나진동으로 읽었다. `Taedasado` 는 대사도로 옮겼으나 확실하지 않다. `Sansa`·`Naneni`·`Unggiryong` 은 대응 지명을 확정할 수 없어 로마자만 두었다. `Naneni` 는 나남(Nanam)으로 보이나 단정하지 않는다. `Alr`·`AZp`·`Forees` 는 Air Forces 로, `Infentry`·`Trigade`·`Brigado` 는 Infantry Brigade 로 고쳤다. 문서 아래쪽 배포처 상자의 글자는 대부분 판독되지 않아 원문에 읽힌 그대로 나열했다.", "warn": true, "search": "Approved For Release 1999/09/08 : CIA-RDP82-00457R000300730006-6 (면마다 찍힌 공개 승인 도장, 세 번) 25X1X6 (DATE 줄과 ORIGIN 줄) 25X1A6a, 25X1A6, 25X1A2g, 25X1A8a, 25X1A9a (본문 여백의 면제 표시) 머리 주에서 참조 보고서 번호와 접수처 두 곳이 먹칠되어 [삭제]로 옮겼다 Military Information: Disposition of Soviet Troops in Northern Korea"}, {"id": "M17", "order": 18, "date": "1946-11-26", "group": "B", "eyebrow": "1946 만주·북조선 · 현장 첩보보고", "title": "군사 첩보: 만주", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1946-11-26"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Manchuria", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000100370010-3"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000100370010-3"}], "summary": "뤼순 일대의 계엄과 통행금지, 그리고 안둥의 압록강 철교를 지키던 소련군이 조선 쪽으로 물러난 일을 적은 두 문단짜리 보고다.", "points": ["국가 표시는 중국이나 둘째 문단은 압록강 국경을 다룬다.", "뤼순 일대에 10월 10일부터 계엄이 시행된다. 통행금지는 오후 8시부터 이튿날 오전 5시까지다.", "안둥의 압록강 철교를 지키던 소련군이 10월 28일 조선 쪽으로 물러난다. 다리를 지키던 병력이 강 건너로 옮겨간 것이다.", "배포일은 1946년 11월 26일이고 면수는 한 면이다."], "primary": "[판독 불가]\n공개 승인 2005/07/12 : CIA-RDP82-00457R000100370010-3\n\n기밀(CONFIDENTIAL)\n25X1  기밀(CONFIDENTIAL)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)   25X1\n국가   중국(China)            일자:  25X1\n정보(INFO.)\n주제   군사 첩보: 만주        배포(DIST.)  1946년 11월 26일\n25X1     면수  1\n\n배포처(DISTRIBUTION)\n\n1. 뤼순(Port Arthur 旅順) 일대에 10월 10일부터 계엄이 시행되고 있다. 통행금지 시간은 오후 8시부터 이튿날 오전 5시까지다.\n\n25X1  [판독 불가]\n\n2. 안둥(An-tung 安東)의 압록강(Yalu River) 철교를 지키던 소련군이 10월 28일 조선 쪽으로 물러났다.\n\n문서번호 [판독 불가]\n등급 변경 없음(NO CHANGE in Class.) [판독 불가]\n[ ] 비밀해제(DECLASSIFIED)\n등급 변경(Class. CHANGED TO):  TS  S  C\nDDA 각서, 4 [판독 불가] 17   25X1\n\n기밀(CONFIDENTIAL)\n\n공개 승인 2005/07/12 : CIA-RDP82-00457R000100370010-3", "secondary": "[판독 불가]\nApproved For Release 2005/07/12 : CIA-RDP82-00457R000100370010-3\n\nCONFIDENTIAL\n25X1  CONFIDENTIAL\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT   25X1\nCOUNTRY   China            DATE:  25X1\nINFO.\nSUBJECT   Military Information: Manchuria     DIST.  26 November 1946\n25X1     PAGES  1\n\nDISTRIBUTION\n\n1. Martial law has been enforced in the Port Arthur area since 10 October. Curfew hours are from 8 p.m. until 5 a.m. the following day.\n\n25X1  [판독 불가]\n\n2. The Soviet troops which were guarding the Yalu River bridge at An-tung withdrew to the Korean side on 28 October.\n\nDocument No. [판독 불가]\nNO CHANGE in Class. [판독 불가]\n[ ] DECLASSIFIED\nClass. CHANGED TO:  TS  S  C\nDDA Memo, 4 [판독 불가] 17   25X1\n\nCONFIDENTIAL\n\nApproved For Release 2005/07/12 : CIA-RDP82-00457R000100370010-3", "notes": ["[삭제·공개 표시] Approved For Release 2005/07/12 : CIA-RDP82-00457R000100370010-3 (앞뒤 두 곳의 공개 승인 도장)", "[삭제·공개 표시] 25X1 (문서 머리, INTELLIGENCE REPORT 줄, DATE 줄, PAGES 줄 왼쪽, 1항과 2항 사이, 비밀해제 처리 도장 안)", "[삭제·공개 표시] Document No. 줄과 NO CHANGE in Class. 도장의 기재가 판독되지 않는다", "[삭제·공개 표시] DDA Memo 줄의 일자가 판독되지 않는다"], "note": "본문이 두 문단뿐이고 비교적 온전하게 읽힌다. 국가 표시가 `Cina` 로 찍혀 China 로 읽었다. 표제의 `Milatery Information; Manchuria` 는 Military Information: Manchuria 로 읽었다. 낱말 교정은 `Maréial lew` 를 Martial law 로, `eines 10 Ostober` 를 since 10 October 로, `Carfew` 를 Curfew 로, `whieh` 를 which 로, `Eorean` 을 Korean 으로, `so the Korean side` 를 to the Korean side 로 한 것이다. 문서 첫 줄의 손글씨와 1항 옆의 `Meltdenf` 는 글자를 가릴 수 없어 판독 불가로 두었다. 등급 표시가 `CONFIDENTTAT,` 와 `SOMFIDENTIAL-` 로 두 번 찍혀 있고 둘 다 CONFIDENTIAL 로 읽었다. 날짜의 숫자는 고치지 않았다. 배포일 `26 November 1946` 과 본문의 `10 October`·`28 October` 는 원문대로다. 아래쪽 비밀해제 처리 도장의 `DDA Memo, 4 ... 17` 은 읽힌 그대로 두었다. 좌표는 이 문서에 나오지 않는다. 안둥의 압록강 철교는 안둥과 신의주를 잇는 다리다.", "warn": false, "search": "Approved For Release 2005/07/12 : CIA-RDP82-00457R000100370010-3 (앞뒤 두 곳의 공개 승인 도장) 25X1 (문서 머리, INTELLIGENCE REPORT 줄, DATE 줄, PAGES 줄 왼쪽, 1항과 2항 사이, 비밀해제 처리 도장 안) Document No. 줄과 NO CHANGE in Class. 도장의 기재가 판독되지 않는다 DDA Memo 줄의 일자가 판독되지 않는다 Military Information: Manchuria"}, {"id": "M11", "order": 19, "date": "1946-12-10", "group": "B", "eyebrow": "1946 만주·북조선 · 현장 첩보보고", "title": "군사 첩보: 조선의용군 배치", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1946-12-10"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Korean Volunteer Army Dispositions", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000300450006-7"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000300450006-7"}], "summary": "북조선의 조선의용군 병력을 2만으로 잡고, 세 군단의 배치를 구간별로 적은 표다. 대부분이 철도 연변에 깔려 있다.", "points": ["조선의용군은 철도보안대, 경비대, 압록강 경비대 세 군단으로 나뉜다.", "가장 큰 덩어리는 평양의 경비대 5,000명과 신의주의 철도보안대 3,000명이다.", "나머지는 신의주와 평양 사이 2,500명, 평양과 만포진 사이 1,500명, 원산과 Kunclan 사이 1,000명처럼 철도 구간을 나눠 배치되어 있다.", "진남포에 1,000명, 압록강 경비대에 306명이 적혀 있다.", "2,000명은 어디에 있고 어느 부대인지 모른다고 밝힌다. 문서가 스스로 모르는 것을 적은 대목이다.", "병사는 각자 일본제 소총 한 자루로 무장하고, 경기관총이 몇 정 있다고만 적었다."], "primary": "[공개 승인 1999/09/08 : CIA-RDP82-00457R000300450006-7]\n\n통제(CONTROL)\n25X1X7\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가   조선            일자:  25X1X6\n주제   군사 첩보: 조선의용군 [배치]\n배포(DIST.)  1947년 2월 7일\n25X1A6a  면수  2\n출처(ORIGIN)  [삭제]   25X1X6   보충(SUPPLEMENT)\n\n조선의용군의 배치와 병력\n\n1. 북조선에 있는 조선의용군(Korean Volunteer Army)의 총 병력은 20,000명에 이른다. 이 군은 다음 세 군단으로 나뉜다.\n\n   a. 철도보안대(The Railroad Peace Preservation Corps).\n   b. 경비대(The Garrison Corps).\n   c. 압록강 경비대(The Yalu River Garrison Corps).\n\n2. 배치 [판독 불가]\n\n부대 | 위치 | 병력\n\n철도보안대 | 신의주(Sinuiju) (124 = nh Oe OG) (Shingishu 新義州) | 3,000\n경비대 | [판독 불가] (1260L4, 2-CL) (Heijo 平壤) | 5,000\n철도보안대 | 진남포(Chinnampo) (125924, B44) | 1,000\n철도보안대 | 평양(Pyongyang) (125d, 239-02)과 [판독 불가] (136614, 386203) (Shimbakku) 사이 | 300\n철도보안대 | 평양(Pyongyang) ( [판독 불가] 39-01)과 원산(Wonsan) (12726, 39210) (Genzan 元山) 사이 | 700\n철도보안대 | 신의주(Sinuiju, Shingishu) (124-24,,40-06)와 평양(Pyongyang) (125-4[판독 불가],[판독 불가]39-01) 사이 | 2,500\n철도보안대 | 원산(Wonsan, Genzan) (12[판독 불가]726, 30-10)과 Huenwing ([판독 불가]3,42-25) 사이 | [판독 불가]000\n철도보안대와 경비대 | 원산(Wonsan, Genzan) (127626, 39-10)과 Kunclan (127.05, 38-06) 사이 | 1,000\n철도보안대와 경비대 | 평양(Pyongyang) (1[판독 불가]-24, 39-01)과 만포진(Manpojin) (136-18, [판독 불가]110) (Manpojin) 사이 | 1,500\n압록강 경비대 | | 306\n\n나머지 2,000명의 배치와 부대 명칭은 알려져 있지 않다. 병사는 각자 [판독 불가]식 (일본제) 소총 한 자루로 무장한다. 의용군은 경기관총도 몇 정 보유하고 있다.\n\n[판독 불가]\n\n25X1X7\n\n25X1A9a  기밀(CONFIDENTIAL)\n\n기밀등급 [판독 불가]\n\n[공개 승인 1999/09/08 : CIA-RDP82-00457R000300450006-7]", "secondary": "Approved For Release 1999/09/08 : CIA-RDP82-00457R000300450006-7\n\nCONTROL\n25X1X7\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCOUNTRY   Korea            DATE:  25X1X6\nSUBJECT   Military Information: Korean Volunteer Army [Dispositions]\nDIST.  7 February 1947\n25X1A6a  PAGES  2\nORIGIN  [삭제]   25X1X6   SUPPLEMENT\n\nDISPOSITION AND STRENGTH OF KOREAN VOLUNTEER ARMY\n\n1. Total strength of the Korean Volunteer Army in Northern Korea amounts to 20,000 troops. This army is divided into the following three corps:\n\n   a. The Railroad Peace Preservation Corps.\n   b. The Garrison Corps.\n   c. The Yalu River Garrison Corps.\n\n2. Disposition [판독 불가]\n\nUNIT | LOCATION | STRENGTH\n\nRailroad Peace Preservation Corps. | Sinuiju (124 = nh Oe OG) (Shingishu) | 3,000\nGarrison Corps. | [판독 불가] (1260L4, 2-CL) (Heijo) | 5,000\nRailroad Peace Preservation Corps. | Chinnampo (125924, B44) | 1,000\nRailroad Peace Preservation Corps. | Between Pyongyang (125d, 239-02) and [판독 불가] (136614, 386203) (Shimbakku) | 300\nRailroad Peace Preservation Corps. | Between Pyongyang ( [판독 불가] 39-01) and Wonsan (12726, 39210) (Genzan) | 700\nRailroad Peace Preservation Corps. | Between Sinuiju (Shingishu) (124-24,,40-06) and Pyongyang (125-4[판독 불가],[판독 불가]39-01) | 2,500\nRailroad Peace Preservation Corps. | Between Wonsan (Genzan) (12[판독 불가]726, 30-10) and Huenwing ([판독 불가]3,42-25) | [판독 불가]000\nRailroad Peace Preservation Corps and Garrison Corps. | Between Wonsan (Genzan) (127626, 39-10) and Kunclan (127.05, 38-06) | 1,000\nRailroad Peace Preservation Corps and Garrison Corps. | Between Pyongyang (1[판독 불가]-24, 39-01) and Manpojin (136-18, [판독 불가]110) (Manpojin) | 1,500\nYalu River Garrison Corps. | | 306\n\nThe disposition and designation of the remaining two thousand troops are unknown. Each soldier is armed with one [판독 불가] (Japanese) rifle. The Volunteer Army also possesses a few light machine guns.\n\n[판독 불가]\n\n25X1X7\n\n25X1A9a  CONFIDENTIAL\n\nCLASSIFICATION [판독 불가]\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R000300450006-7", "notes": ["[삭제·공개 표시] Approved For Release 1999/09/08 : CIA-RDP82-00457R000300450006-7 (두 면의 공개 승인 도장)", "[삭제·공개 표시] 25X1X7 (문서 머리와 표 오른쪽, 문서 끝)", "[삭제·공개 표시] 25X1X6 (DATE 줄과 ORIGIN 줄)", "[삭제·공개 표시] 25X1A6a, 25X1A9a (여백의 면제 표시)", "[삭제·공개 표시] ORIGIN 줄의 출처 표시가 먹칠되어 [삭제]로 옮겼다"], "note": "좌표가 표 안에서 가장 심하게 깨졌다. 숫자를 고치지 않는다는 규칙에 따라 읽힌 그대로 옮겼다. `(124 = nh Oe OG)`·`(1260L4, 2-CL)`·`(125924, B44)`·`(136614, 386203)` 같은 것은 도와 분으로 성립하지 않는 값이다. 신의주는 표의 다른 줄에서 `(124-24,,40-06)` 으로 읽히므로 첫 줄의 값도 같은 지점을 가리키는 것으로 보이나 손대지 않았다. 원산은 `(127-26, 39-10)`·`(12726, 39210)`·`(127626, 39-10)`·`(30-10)` 으로 줄마다 달리 읽힌다. 만포진의 위도가 `£110` 으로 찍혀 있다. 지명 `Huenwing`·`Kunclan`·`Shimbakku` 는 대응 지명을 확정할 수 없어 로마자만 두었다. 일본식 지명 병기(Shingishu 신의주, Heijo 평양, Genzan 원산, Manpojin 만포진)는 원문이 그대로 달아 놓은 것이다. 소총 이름은 `¥+3&(Jsornese)` 로 뭉개져 있다. 38식으로 보이나 숫자를 짓지 않고 판독 불가로 두었다. `Kerean`·`Aray`·`Thig`·`Corps`·`Gecvivon`·`Rellroad`·`Raliroad`·`Red road`·`Praservation`·`Volurtear`·`slso`·`oma` 따위의 뭉갬은 낱말 철자로 보아 바로잡았다. 위쪽 도장의 문서번호가 `000300450686-7` 로 찍혔으나 아래쪽 도장과 색인에 따라 000300450006-7 로 읽었다.", "warn": true, "search": "Approved For Release 1999/09/08 : CIA-RDP82-00457R000300450006-7 (두 면의 공개 승인 도장) 25X1X7 (문서 머리와 표 오른쪽, 문서 끝) 25X1X6 (DATE 줄과 ORIGIN 줄) 25X1A6a, 25X1A9a (여백의 면제 표시) ORIGIN 줄의 출처 표시가 먹칠되어 [삭제]로 옮겼다 Military Information: Korean Volunteer Army Dispositions"}, {"id": "M12", "order": 20, "date": "1946-12-11", "group": "B", "eyebrow": "1946 만주·북조선 · 현장 첩보보고", "title": "정치 첩보: 압록강에서의 어선 나포", "badge": "confidential (U.S. AND BRITISH OFFICIALS ONLY)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1946-12-11"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Political Information: Seizure of Fishing Boats on Yalu River", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000300550006-6"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000300550006-6"}], "summary": "1946년 11월 압록강에서 러시아 병사와 조선인 병사가 중국 배 여러 척을 세우고 몰수한 일을 사례별로 적었다. 강 위의 항행이 사실상 끊긴다.", "points": ["11월 14일 국제운수공사의 62톤 배가 원쯔거우에서 나포된다. 화물 120톤은 국수, 성냥, 말린 자두, 양산이었다.", "11월 중 25톤짜리 배와 11월 22일 어민 WANG Ch'ing-kung 의 배가 같은 곳에서 잇따라 나포된다. WANG 은 재산과 현금 189,500위안을 몰수당한다.", "세 배 모두 조선인 몇 명과 러시아인 2명이 세워 수색했다. 러시아인이 지휘하는 것으로 보였으나 검사가 끝나면 배를 조선인에게 넘겼다.", "몰수는 퉁타이핑 세관에서 북조선 재정국이 했다. 중국공산당이 낸 압록강 항행 면허가 없으면 몰수한다고 했고, 국민당이 조선 배를 몰수하는 데 대한 보복이라고 했다.", "승조원 일부는 국민당원이라는 혐의를 받고 처벌 위협을 당했다. 모두 풀려났으나 돈과 재산을 빼앗겼고 신분증명서는 조선인들이 가져갔다.", "11월 25일 휘발유를 실은 군용 기선 후화는 러시아 병사에게 끌려갔다가, 안둥 위수사령부가 신의주의 러시아군 사령부와 직접 교섭해 12월 2일 돌려받는다.", "제3수정구사령부 참모장 LIAO 장군은 실제 몰수를 조선인이 하기 때문에 러시아가 책임을 부인할 수 있다고 말한다. 북조선에 책임 있는 당국이 없다는 것이 문제를 더 어렵게 만든다고 본다.", "총격을 받은 배도 여럿 있었다. 그 결과 강 위의 항행이 모두 멈추고 밤의 밀수만 남았다고 적었다."], "primary": "미국 및 영국 관리 전용(U.S. AND BRITISH OFFICIALS ONLY)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가   조선            일자:  25X1X6\n주제   정치 첩보: 압록강에서의 어선 나포\n배포(DIST.)  1947년 2월 14일\n면수  3\n25X1A6a\n보충(SUPPLEMENT)\n출처(ORIGIN)  [삭제]   25X1X6a\n\n1. 1946년 11월 14일, 화물 120톤을 실은 62톤짜리 배 한 척이 원쯔거우(Wentzukou) 일대([한자 판독 불가])에서 나포되었다. 이 배는 국제운수공사(International Transportation Company) 소속으로, 이 회사는 전에 일본인 소유였다가 지금은 중국인이 운영한다. 원쯔거우는 압록강(Yalu River) 가의 안둥(Antung 安東) (124-23, 40-09)에서 남서쪽으로 약 15킬로미터 지점이다. 배는 즈푸(Chefoo 芝罘) (121-24, 37-32)에서 [판독 불가]로 가는 길이었다. 화물은 주로 국수, 성냥, 말린 자두, 양산이었다.\n\n2. 11월 [판독 불가]일, WU [판독 불가]([한자 판독 불가])의 배가 원쯔거우 일대에서 러시아 병사와 조선인 병사에게 나포되었다. 25톤짜리 배다. 이 배는 안둥으로 가는 길이었고 화물은 싣고 있지 않았다.\n\n3. 11월 22일 오전 12시, WANG Ch'ing-kung([한자 판독 불가])의 배가 원쯔거우 일대에서 나포되었다. WANG 은 어민이며 안둥에서 고기를 팔고 집으로 돌아가는 길이었다. 약 100,500위안어치의 개인 재산과 물품, 그리고 현금 189,500.00위안이 몰수되었다.\n\n4. 이 세 배는 원쯔거우 일대에서 비슷한 정황으로 정지당했다. 각 배의 진술로는, 처음에 조선인 [판독 불가]명과 러시아인 2명에게 정지당해 수색을 받았다. 두 경우에는 조선인과 러시아인이 강 한가운데의 작은 섬에 있었다. 이 섬은 제3수정구사령부(3rd Pacification Area Command)가 중국 섬이라고 주장하나 주권 귀속이 다투어지는 곳이다. 세 번째 경우에는 작은 기선을 써서 배를 세웠다. 수색대의 지휘는 러시아인이 맡은 것으로 보이나, 배를 검사한 뒤에는 조선인에게 넘겼고 조선인이 배를 퉁타이핑(Tungt'aip'ing)([한자 판독 불가])으로 끌고 갔다. 그곳은 [판독 불가]에서 강 건너 바로 맞은편이다.\n\n5. 배의 실제 몰수는 퉁타이핑 세관에서 이루어졌다. 담당 기관은 북조선 재정국(Bureau of Public Finance of Northern Korea)([한자 판독 불가])이라 불린다. 조선인들은 먼저 중국공산당이 발급한 압록강 [판독 불가] 면허를 보자고 요구하였다. [판독 불가]라고 설명되었다.\n\n[정본화 - 공개 승인 : CIA-RDP82-00457R000300550006-6]\n기밀(CONFIDENTIAL)   25X1A2g\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n공산당 면허가 없으면 그 배는 몰수된다는 것이었다. 조선인들이 주장하기로는 국민당이 조선 배를 몰수하고 있으므로 그에 대한 보복이라는 것이다. 승조원에 대한 처우는 각기 달랐다. 일부는 국민당원이라는 혐의를 받고 처벌하겠다는 위협을 당했다. 모두 결국은 풀려났으나, 돈과 개인 재산을 몰수당한 뒤였고, 작은 배로 강을 건너 돌아가는 것이 허용되었다. 신분증명서는 모두 조선인들이 가져갔다.\n\n11월 25일, 후화(Fu-hua)([한자 판독 불가])라는 이름의 군용 기선이 휘발유를 가득 싣고 병사 7명의 호위를 받으며 좡허(Chuangho 莊河) (123-92, 39-42)에서 안둥으로 가던 중 러시아 병사들에게 정지당해 퉁먼커우(Tungmenkou)([한자 판독 불가])(위치를 찾을 수 없음)로 끌려갔다. 중국 측 말로는 배가 조선 쪽 기슭 가까이 항행하고 있었으나 경계선의 중국 쪽에 있었다고 한다.\n\n안둥 위수사령부는 신의주(Sinuiju) (12[판독 불가]27, 40-08)의 러시아군 사령부와 직접 교섭에 들어갔으며, 상대는 Kie-la-fu-fu 대령(러시아인 이름의 중국식 음역)이었다. 배와 화물과 병사는 12월 2일에 돌려받았다.\n\n이 문제는 중앙정부에 이관되었다. 제3수정구사령부 참모장 LIAO [판독 불가] 장군([한자 판독 불가])에 따르면, 실제 몰수를 조선인들이 하였기 때문에 러시아인들이 어느 나포에 대해서도 책임을 부인할 수 있다는 점이 문제를 복잡하게 만든다. 현재 북조선의 불안정과 책임 있는 당국의 부재가 문제를 더 복잡하게 한다. 제3수정구사령부는 문제를 중앙정부에 이관한 것 말고는 배를 주인에게 돌려받기 위한 다른 조치를 취하지 않았다.\n\n[판독 불가] 위에 적은 나포가 압록강에서 일어난 전부는 아니며, 최근 제3수정구사령부에 알려진 것들일 뿐이다. 배가 총격을 받은 사례도 여럿 있었다. 그 결과 작은 어선을 포함해 강 위의 모든 항행이 중단되었고, 다만 밤에 이루어지는 소량의 통행이 남았는데 대부분 밀수다.\n\n11월 47일 [원문 그대로] 밤, 몰수된 배 가운데 하나의 소유주인 국제운수공사의 직원 LIU Ch'ing-t'ou([한자 판독 불가])가 강을 건너 신의주로 갔다. 신의주는 안둥에서 강 건너 바로 맞은편이다. 그는 보안대(Peace Preservation Corps) 사령관을 만났고, [삭제] 자기 배가 전에 안둥에 있던 중국공산정부에 넘어갔다고 그에게 말하였다. CHU [판독 불가]는 강 위의 어떤 배도 안둥으로 화물을 실어 날라서는 안 되며 이것이 몰수의 이유라고 설명하였다.\n\n기밀(CONFIDENTIAL)\n\n[정본화 - 공개 승인 : CIA-RDP82-00457R000300550006-6]", "secondary": "U.S. AND BRITISH OFFICIALS ONLY\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCOUNTRY   Korea            DATE:  25X1X6\nSUBJECT   Political Information: Seizure of Fishing Boats on Yalu River\nDIST.  14 February 1947\nPAGES  3\n25X1A6a\nSUPPLEMENT\nORIGIN  [삭제]   25X1X6a\n\n1. On 14 November 1946 a 62 ton boat with 120 tons of cargo, belonging to the International Transportation Company which is a former Japanese concern now under Chinese direction, was seized in the Wentzukou area ([한자 판독 불가]). Wentzukou is approximately 15 kilometers southwest of Antung (124-23, 40-09) on the Yalu River. It was enroute from Chefoo (121-24, 37-32) to [판독 불가]. The cargo consisted principally of noodles, matches, dried plums, and parasols.\n\n2. On [판독 불가] November the boat of WU [판독 불가] ([한자 판독 불가]), a vessel of 25 tons, was seized by Russian and Korean soldiers in the Wentzukou area. The vessel was enroute to Antung and carried no cargo.\n\n3. On 22 November at 12 A.M. the boat of WANG Ch'ing-kung ([한자 판독 불가]) was seized in the Wentzukou area. WANG is a fisherman and was returning home from Antung after selling his fish. Personal property and supplies worth approximately 100,500 Yuan and 189,500.00 Yuan in cash were confiscated.\n\n4. These three boats were stopped in the Wentzukou area under similar circumstances. Each boat reported that it was first stopped and searched by [판독 불가] Koreans and 2 Russians. In two cases the Koreans and Russians were on a small island in the middle of the river whose sovereignty is open to question although claimed to be a Chinese island by the 3rd Pacification Area Command. In the third case a small steamer was used to stop the vessel. The Russians appeared to be in command of the searching party but after inspecting the boats they were turned over to the Koreans who then took them to Tungt'aip'ing ([한자 판독 불가]) which is directly across the river from [판독 불가].\n\n5. Actual confiscation of the boats took place in the Tungt'aip'ing Customs House. The agency in charge is called the Bureau of Public Finance of Northern Korea ([한자 판독 불가]). The Koreans first asked to see the boats' licenses to [판독 불가] the Yalu River which [were] issued by Chinese Communists. It was explained [판독 불가]\n\n[Sanitized - Approved For Release : CIA-RDP82-00457R000300550006-6]\nCONFIDENTIAL   25X1A2g\nCENTRAL INTELLIGENCE GROUP\n\nhad no Communist license it would be confiscated as a retaliation against the Nationalists who the Koreans alleged were confiscating Korean boats. Treatment of the crew members varied. Some were accused of being Kuomintang party members and threatened with punishment. All were eventually released after money and personal property had been confiscated, and they were allowed to return across the river in small boats. All identification papers were retained by the Koreans.\n\nOn 25 November a military steam boat named the Fu-hua ([한자 판독 불가]), fully laden with gasoline and guarded by 7 soldiers, enroute from Chuangho (123-92, 39-42) to Antung was stopped by Russian soldiers and taken to Tungmenkou ([한자 판독 불가]) (cannot be located). According to the Chinese the boat was sailing near the Korean shore but was on the Chinese side of the boundary.\n\nThe Antung Garrison Command entered into direct negotiations with the Russian Command in Sinuiju (12[판독 불가]27, 40-08) dealing with a Colonel Kie-la-fu-fu (Chinese phoneticization of Russian name). The boat, cargo, and soldiers were returned on 2 December.\n\nThe problem has been referred to the Central Government. According to General LIAO [판독 불가] ([한자 판독 불가]), Chief of Staff of the Third Pacification Area Command, the problem is complicated by the fact that the Russians can disclaim responsibility for any of the seizures as the actual confiscations were carried out by the Koreans. The present instability in Northern Korea and the lack of any responsible authority further complicates the problem. Beyond referring the problem to the Central Government no other steps have been taken by the Third Pacification Area Command to secure the return of the boats to their owners.\n\n[판독 불가] the above mentioned seizures are not the only ones that have taken place on the Yalu River but are the ones which have recently been brought to the attention of the Third Pacification Area Command. There have been several cases of boats being fired upon. The result has been the stopping of all navigation upon the river including the small fishing vessels with the exception of a small amount of traffic, mostly smuggling, which is carried on at night.\n\nOn the night of 47 November [원문 그대로], LIU Ch'ing-t'ou ([한자 판독 불가]), an official of the International Transportation Company, owner of one of the boats which was confiscated, crossed the river and went to Sinuiju, directly across the river from Antung. He met with the Commander of the Peace Preservation Corps [삭제] him that his ship had been turned over to the Chinese Communist Government formerly in Antung. CHU [판독 불가] explained that no ship on the river should carry cargo to Antung and that this was the reason for confiscation.\n\nCONFIDENTIAL\n\nSanitized - Approved For Release : CIA-RDP82-00457R000300550006-6", "notes": ["[삭제·공개 표시] Sanitized - Approved For Release : CIA-RDP82-00457R000300550006-6 (두 면의 공개 승인 도장)", "[삭제·공개 표시] 25X1X6, 25X1X6a (DATE 줄과 ORIGIN 줄)", "[삭제·공개 표시] 25X1A6a, 25X1A9a, 25X1A2g (여백의 면제 표시)", "[삭제·공개 표시] ORIGIN 줄의 출처 표시가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] 마지막 문단에서 보안대 사령관의 이름이 들어갈 자리가 먹칠되어 [삭제]로 옮겼다"], "note": "이 계열에서 가장 긴 보고이고 서술 부분은 비교적 잘 읽힌다. 다만 인명의 한자가 모두 스캔에서 뭉개져 한 글자도 확정되지 않아 [한자 판독 불가]로 두었다. 2항의 선주 이름은 `WU Date JUNE` 으로 찍혀 뒤 음절을 가릴 수 없다. 참모장은 `General LIAC Rucejui` 로 찍혀 성만 LIAO 로 읽었다. 마지막 문단의 `Chue` 는 앞 문장의 보안대 사령관을 가리키는 것으로 보이나 확정되지 않는다. 좌표는 고치지 않았다. 좡허의 `(123-92, 39-42)` 는 경도의 분이 92로 성립하지 않는 값이고, 신의주의 `(12%27, 40-08)` 은 경도 앞자리가 깨져 있다. 즈푸의 `(121-24, 37-32)` 와 안둥의 `(124-23, 40-09)` 는 온전하다. 마지막 문단의 날짜는 `47 Nevember` 로 찍혀 있다. 17일로 보이나 날짜의 숫자는 고치지 않고 원문대로 두었다. 3항의 시각 `12 A.M.` 도 원문대로 두었다. 몰수액 `100,500 Yuan` 과 `189, 500 OO Yuan` 은 원문의 자릿수를 그대로 옮겼다. 2면에서 문단 번호가 사라져 6항 이하가 번호 없이 이어진다. 번호를 새로 매기지 않았다. `Pacification Area Command` 는 중국 국민정부의 수정구(綏靖區) 사령부다. 원문 표기를 살려 병기했다.", "warn": false, "search": "WU [판독 불가] (25톤 배의 선주) WANG Ch'ing-kung (어민, 배를 나포당함) Kie-la-fu-fu 대령 (신의주 주둔 러시아군 사령부, 러시아인 이름의 중국식 음역) LIAO [판독 불가] 장군 (제3수정구사령부 참모장) LIU Ch'ing-t'ou (국제운수공사 직원) CHU [판독 불가] (보안대 사령관으로 보인다) Sanitized - Approved For Release : CIA-RDP82-00457R000300550006-6 (두 면의 공개 승인 도장) 25X1X6, 25X1X6a (DATE 줄과 ORIGIN 줄) 25X1A6a, 25X1A9a, 25X1A2g (여백의 면제 표시) ORIGIN 줄의 출처 표시가 먹칠되어 [삭제]로 옮겼다 마지막 문단에서 보안대 사령관의 이름이 들어갈 자리가 먹칠되어 [삭제]로 옮겼다 Political Information: Seizure of Fishing Boats on Yalu River"}, {"id": "M18", "order": 21, "date": "1946-12-11", "group": "B", "eyebrow": "1946 만주·북조선 · 현장 첩보보고", "title": "경제 첩보: 국민당 측의 옛 일본 어선 사용", "badge": null, "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1946-12-11"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Economic Information: Nationalist Use of Former Japanese Fishing Boats", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000200010010-1"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000200010010-1"}], "summary": "옛 일본 어선 다섯 척의 제원과 쓰임, 승조원 임금표를 적은 한 장짜리 보고다. 운항 중인 두 척이 한약을 싣고 조선으로 떠난다고 적혀 있다.", "points": ["배의 제원이 먼저 나온다. 길이 66피트, 무게 약 45톤, 분당 1520회전에서 70마력, 속력 7노트다.", "**운항 중인 두 척이 곧 한약을 싣고 조선으로 떠난다.** 조선과 이어지는 대목은 이 한 문장이다.", "배의 내력이 두 단계다. 원래 일본 어선이었고, 전쟁이 끝나면서 중국공산군 손에 들어가 즈리만에서 어선으로 쓰였다. 제목은 국민당 측의 사용이라고 적고 있다.", "다섯 척 중 두 척은 운항 중이고 세 척은 탕구에서 수리 중이다. 수리 중인 배는 기관의 마력이 다르다.", "승조원 임금표가 붙어 있다. 선장 월 20만, 기관장 16만, 선원 5천 CNC다. 식비는 별도로 한 사람당 월 약 55,060 CNC다.", "정보원 자신이 표 안에 관찰자(Observer)로 올라 있다."], "primary": "[공개 승인 : CIA-RDP82- 90457R000200040010- 4 원문 그대로]\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n첩보보고(INTELLIGENCE REPORT)\n\n25X1X6\n\n국가  중국                            일자:\n첩보(INFO.)\n주제  경제 첩보: 국민당 측의 옛 일본 어선 사용\n배포(DIST.)  1946년 12월 11일\n\n25X1A6a\n\n25X1X6\n\n면수  1\n보충(SUPPLEMENT)\n\n1. 배는 길이 66피트, 너비 [판독 불가]피트이며 무게는 약 45톤이다. 이 배의 동력 장치는 [판독 불가]기통 기관으로, 분당 1520회전에서 지시마력 70마력을 내고 속력은 7노트다.\n\n2. 전쟁이 끝날 무렵 이 배 여러 척이 중국공산군(Chinese Communists)의 손에 들어갔고, 이들은 배를 주로 어선으로 써서 즈리만(Gulf of Chihli 直隷灣)에서 끌그물 조업을 했다. 연간 어획이 가장 적은 초가을 몇 달 동안에는 배를 화물 운송에 쓴다. 행선지는 [판독 불가]다.\n\n3. 수산국(The Fisheries)은 이 배를 다섯 척 가지고 있다. 두 척은 운항 중이고 세 척은 탕구(Tangku 塘沽)에서 수리 중이다. 정보원은 수리 중인 배의 기관이 지금 쓰이는 배의 기관과 마력이 같지 않다고 말한다. 운항 중인 두 척은 곧 한약(Chinese medicines)을 싣고 조선(Korea)으로 떠난다.\n\n4. 승조원 수와 임금: 이 배들은 화물을 실어 나를 때 각각 열 명의 승조원을 태운다. 어로에 나갈 때는 각각 선원 두 명을 더 태운다. 승조원에게는 식사가 지급되는데, 하루 세 끼 [판독 불가]에서 먹는 것으로 한 사람당 한 달에 약 CNC 55,060[원문 그대로]이 든다. 아래의 급료는 이 식비와 별도다.\n\n    선장(Master)                    200,000.  CNC 월\n    관찰자(Observer, 정보원)         [판독 불가]\n    기관장(Engineer)                160,000.  \"   \"    \"\n    선원 겸 취사(Sailor Cook)        [판독 불가]\n    제1기관원(No. 1 Engine man)      [판독 불가]\n    제2기관원(No. 2 Engine man)      [판독 불가]\n    제1선원(No. 1 Sailor)            [판독 불가]\n    선원(Sailors)                     5,000.  \"   \"    \"\n\n    [표에서 떨어져 나온 금액 두 줄]\n                                     10,000.  \"   \"    \"\n                                     12,000.  \"   \"    \"\n\n등급 변경(Class. CHANGED TO): [판독 불가]\n분류(CLASSIFICATION) [판독 불가]", "secondary": "Approved For Release : CIA-RDP82- 90457R000200040010- 4 [원문 그대로]\n\nCENTRAL INTELLIGENCE GROUP\nINTELLIGENCE REPORT\n\n25X1X6\n\nCOUNTRY  China                        DATE:\nINFO.\nSUBJECT  Economic Information: Nationalist Use of Former Japanese Fishing Boats\nDIST.  11 December 1946\n\n25X1A6a\n\n25X1X6\n\nPAGES  1\nSUPPLEMENT\n\n1. The boats are 66 feet long, [판독 불가] feet wide, and weigh approximately 45 tons. The power plant of the craft is a [판독 불가]-cylinder engine with an indicated 70 horsepower at 1520 revolutions per minute and a speed of 7 knots.\n\n2. At the end of the war, a number of these craft fell into the hands of the Chinese Communists, who used them principally as fishing craft, trolling with them in the Gulf of Chihli. In the early autumn months when the yearly catch is at its lowest level, they use the boats to transport cargoes to [판독 불가].\n\n3. The Fisheries have five of these boats. Two are in operation and three are under repair at Tangku. Source says that the engines on the ships under repair do not have the same horsepower as those now in use. The two operating vessels will leave soon for Korea with a cargo of Chinese medicines.\n\n4. Crew strength and wages: These vessels each carry a crew of ten when hauling cargo. When on fishing trips they carry two additional sailors each. Members of the crew are furnished food at a cost of approximately CNC 55,060 [원문 그대로] each per month for three meals a day at [판독 불가]. The salaries below are in addition to this food allowance:\n\n    Master              200,000.  CNC per month\n    Observer (Source)   [판독 불가]\n    Engineer            160,000.  \"   \"    \"\n    Sailor Cook         [판독 불가]\n    No. 1 Engine man    [판독 불가]\n    No. 2 Engine man    [판독 불가]\n    No. 1 Sailor        [판독 불가]\n    Sailors               5,000.  \"   \"    \"\n\n    [표에서 떨어져 나온 금액 두 줄]\n                         10,000.  \"   \"    \"\n                         12,000.  \"   \"    \"\n\nClass. CHANGED TO: [판독 불가]\nCLASSIFICATION [판독 불가]", "notes": ["[삭제·공개 표시] 25X1X6 (표제부 DATE 줄 위)", "[삭제·공개 표시] 25X1A6a (표제부 가운데)", "[삭제·공개 표시] 25X1X6 (본문 앞)", "[삭제·공개 표시] Approved For Release : CIA-RDP82- 90457R000200040010- 4 (공개 승인 도장. 문서번호를 읽힌 그대로 두었다)", "[삭제·공개 표시] Class. CHANGED TO: (등급 변경 도장. 내용이 판독되지 않는다)", "[삭제·공개 표시] CLASSIFICATION (아래쪽 분류 표시. 등급이 판독되지 않는다)"], "note": "OCR 훼손이 심하다. 낱말은 고쳤다. `Chins`는 China, `Roats`는 Boats, `shinese Gomnists`는 Chinese Communists, `Fisherics`는 Fisheries, `chase boate`는 these boats, `gassels`는 vessels, `carge`는 cargo, `Grew atrength`는 Crew strength, `perry`는 carry, `havling`은 hauling, `feod`는 food, `Ceok`은 Cook, `thia faod`는 this food 로 읽었다. 통화 약호는 원문에 `CNG`와 `CHC`가 섞여 나오는데 둘 다 CNC(중국 법폐)로 읽었다. 금액은 한 자리도 고치지 않았다. 식비 `55,060`은 월 20만을 받는 선장의 급료에 견주면 자릿수가 어색하나 원문 그대로 두었다. 임금표는 원문에서 직책 이름 칸과 금액 칸이 어긋나 있다. 선장 200,000, 기관장 160,000, 선원 5,000 세 줄만 직책과 금액이 붙어 있고, `10,000`과 `12,000` 두 금액은 어느 직책의 것인지 판별되지 않아 표 아래에 따로 두었다. 나머지 직책의 금액은 [판독 불가]로 남겼다. 어느 직책에 붙일지 짐작하지 않았다. 배 너비와 기통 수도 원문에서 각각 `§`와 `@ geoylinder`로 뭉개져 [판독 불가]로 두었다. 하루 세 끼를 먹는 곳으로 적힌 `S88`도 판독되지 않는다. 둘째 항의 화물 행선지 `Ror Ga`는 조선으로 읽힐 여지가 있으나 확정할 수 없어 [판독 불가]로 두었다. 제목은 국민당 측의 사용이라고 하는데 본문 둘째 항은 배가 중국공산군 손에 들어갔다고 적는다. 원문의 이 어긋남을 그대로 두었다. 공개 승인 도장의 문서번호는 `90457R000200040010-4`로 읽히는데 목록의 문서번호(00457R000200010010-1)와 다르다. 숫자를 고치지 않았다. 같은 날짜의 M12와 이어진다. 12월 11일 압록강에서 배를 뺏긴 보고와 같은 날 다른 배들이 조선으로 떠난 보고다. 여드레 뒤 이 배의 선장 둘이 M19에서 다롄의 환율을 알려 준다.", "warn": true, "search": "25X1X6 (표제부 DATE 줄 위) 25X1A6a (표제부 가운데) 25X1X6 (본문 앞) Approved For Release : CIA-RDP82- 90457R000200040010- 4 (공개 승인 도장. 문서번호를 읽힌 그대로 두었다) Class. CHANGED TO: (등급 변경 도장. 내용이 판독되지 않는다) CLASSIFICATION (아래쪽 분류 표시. 등급이 판독되지 않는다) Economic Information: Nationalist Use of Former Japanese Fishing Boats"}, {"id": "M13", "order": 22, "date": "1946-12-18", "group": "B", "eyebrow": "1946 만주·북조선 · 현장 첩보보고", "title": "군사 첩보: 중국공산군이 북조선에서 소련 측과 물자를 거래하다", "badge": "confidential (CONTROL — U.S. AND BRITISH OFFICIALS ONLY)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1946-12-18"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Chinese Communists Trading Supplies with the Soviets in North Korea.", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000200200007-4"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000200200007-4"}], "summary": "만주의 중국공산군이 식량과 금을 주고 북조선의 소련 측에게서 일본제 탄약과 군수품을 받는다는 두 문단짜리 보고다.", "points": ["거래 품목이 분명하다. 중국공산군이 내놓는 것은 식량과 금이고, 받는 것은 일본제 탄약과 군수품이다.", "물자는 정크선으로 서조선만을 건너 실어 나른다.", "거래의 주선과 조건은 배가 떠나기 전에 다롄에서 정한다. 소련이 다롄과 북조선 양쪽에 걸쳐 있다는 것이 이 경로의 전제다.", "국가란에 중국과 조선이 함께 올라 있다."], "primary": "[공개 승인 2001/03/22 : CIA-RDP82-00457R000200200007-4]\n\n기밀(CONFIDENTIAL)\n\n통제(CONTROL)\n미국 및 영국 관리 전용(U.S. AND BRITISH OFFICIALS ONLY)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n첩보보고(INTELLIGENCE REPORT)\n\n국가   중국, 조선            일자:  25X1A\n첩보(INFO.)\n주제   군사 첩보: 중국공산군이 북조선에서 소련 측과 물자를 거래하다.\n배포(DIST.)  1946년 12월 18일\n25X1C  면수  1\n\n출처(ORIGIN)  [삭제]   보충(SUPPLEMENT)\n\n25X1X\n\n1. 만주의 중국공산군은 지금 북조선에 있는 소련 측과 식량과 금을 주고 일본제 탄약 및 군수품을 받는 거래를 하고 있다.\n\n2. 물자는 정크선으로 서조선만(Korea Bay)을 건너 실어 나른다. 거래의 주선과 조건은 대체로 정크선이 조선으로 떠나기 전에 다롄(Dairen 大連)에서 소련 측과 정한다.\n\n문서번호 [판독 불가]\n등급 변경 없음(NO CHANGE in Class.) [판독 불가]\n[ ] 비밀해제(DECLASSIFIED)\n등급 변경(Class. CHANGED TO): [판독 불가]\nDDA 각서, 1977년 4월 4일\n근거: DDA REG. 77/1783\n일자: [판독 불가]  담당: [판독 불가]\n\n25X1A", "secondary": "Approved For Release 2001/03/22 : CIA-RDP82-00457R000200200007-4\n\nCONFIDENTIAL\n\nCONTROL\nU.S. AND BRITISH OFFICIALS ONLY\n\nCENTRAL INTELLIGENCE GROUP\nINTELLIGENCE REPORT\n\nCOUNTRY   China, Korea            DATE:  25X1A\nINFO.\nSUBJECT   Military Information: Chinese Communists Trading Supplies with the Soviets in North Korea.\nDIST.  18 December 1946\n25X1C  PAGES  1\n\nORIGIN  [삭제]   SUPPLEMENT\n\n25X1X\n\n1. The Chinese Communists in Manchuria are now trading food and gold for Japanese ammunition and military supplies with the Soviets in North Korea.\n\n2. Junks are used to carry the supplies through Korea Bay. Arrangements and terms of trade are generally made with the Soviets in Dairen before the junks leave for Korea.\n\nDocument No. [판독 불가]\nNO CHANGE in Class. [판독 불가]\n[ ] DECLASSIFIED\nClass. CHANGED TO: [판독 불가]\nDDA Memo, 4 Apr 77\nAuth: DDA REG. 77/1783\nDate: [판독 불가]  By: [판독 불가]\n\n25X1A", "notes": ["[삭제·공개 표시] Approved For Release 2001/03/22 : CIA-RDP82-00457R000200200007-4 (공개 승인 도장)", "[삭제·공개 표시] 25X1A (DATE 줄과 문서 끝)", "[삭제·공개 표시] 25X1C (PAGES 줄 앞)", "[삭제·공개 표시] 25X1X (본문 앞)", "[삭제·공개 표시] ORIGIN 줄의 출처 표시가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] 아래쪽 비밀해제 처리 도장의 문서번호와 일자, 담당자 란이 판독되지 않는다"], "note": "본문이 두 문단뿐이고 비교적 온전하게 읽힌다. `Commmists` 는 Communists 로, `tera` 는 terms 로, `Kewrea`·`Worth Korea` 는 Korea·North Korea 로, `dunks` 는 Junks 로 고쳤다. 둘째 문단 앞의 `«,` 는 항목 번호 2로 읽었다. 아래쪽 비밀해제 처리 도장의 `DDA REG. 77/1783` 은 숫자를 고치지 않고 읽힌 그대로 두었다. `Korea Bay` 는 압록강 하구 앞의 만으로 서조선만에 해당한다.", "warn": false, "search": "Approved For Release 2001/03/22 : CIA-RDP82-00457R000200200007-4 (공개 승인 도장) 25X1A (DATE 줄과 문서 끝) 25X1C (PAGES 줄 앞) 25X1X (본문 앞) ORIGIN 줄의 출처 표시가 먹칠되어 [삭제]로 옮겼다 아래쪽 비밀해제 처리 도장의 문서번호와 일자, 담당자 란이 판독되지 않는다 Military Information: Chinese Communists Trading Supplies with the Soviets in North Korea."}, {"id": "M19", "order": 23, "date": "1946-12-19", "group": "B", "eyebrow": "1946 만주·북조선 · 현장 첩보보고", "title": "경제 첩보: 다롄의 통화", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1946-12-19"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Economic Information: Currency in Dairen", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000200220009-0"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000200220009-0"}], "summary": "다롄에서 도는 돈을 세 부분으로 나눠 적은 보고다. 유통 중인 통화, 환율, 유통 상황이다. 조선은행권이 세 통화 가운데 하나로 올라 있다.", "points": ["**다롄에서 쓰이는 통화가 세 가지뿐이라고 못 박는다.** 만주국폐, 소련군표, 그리고 조선은행권이다.", "조선은행권이 만주 항구의 일상 통화로 돌고 있다. 해방 뒤에도 조선의 돈이 국경 밖에서 통용된다는 기록이다.", "조선은행권과 소련군 통화가 100 대 100으로 교환된다는 대목이 있고, 뒤에 소련군표 1.80 대 조선은행권 1이라는 다른 숫자가 이어진다. 두 숫자가 어긋나는데 문서는 둘 다 싣고 있다.", "가장 널리 도는 것은 소련군표다. 다만 원문 편집자가 「가장」이라는 낱말에 빗금을 쳐 판독을 확신하지 못한다고 표시했다.", "소련 측이 중국공산당 측 지폐의 유통을 금지한다. 인플레이션을 피하려는 것이라고 적혀 있다.", "국민당 측이 소련군표를 회수하자 그 돈이 공산당 측 지역과 다롄으로 몰려 물가가 두 배로 올랐다.", "미화 달러가 정크선으로 상하이에서 다롄으로 들어온다. 앞서 붙잡힌 사람들은 체벌을 받고 재산을 몰수당했다.", "정보원이 밝혀져 있다. 다롄과 국민당 측 항구, 공산당 측 항구를 오간 전직 어선 선장 두 사람이다. 통역은 자신이 사실이라고 본 부분만 옮겼다고 말했다."], "primary": "문서번호 [판독 불가]\n등급 변경 없음(NO CHANGE in Class.)\n[공개 승인 1999/09/08 : CIA-RDP82-00457R0002002960099 원문 그대로]\n\n[ ] 비밀해제(DECLASSIFIED)\n\n등급 변경(Class. CHANGED TO): TS  S\nDDA 각서, 1977년 4월 4일\n근거: DDA Reg. 77/1763[원문 그대로]\n일자: [판독 불가]  담당: [판독 불가]\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n첩보보고(INTELLIGENCE REPORT)\n\n국가  중국                            일자:\n첩보(INFO.)  기재된 대로\n배포(DIST.)  1946년 12월 19일\n\n면수  [판독 불가]\n보충(SUPPLEMENT)\n\n주제  경제 첩보: 다롄의 통화\n\n출처(ORIGIN)  기재된 대로   25X1X6\n\n25X1X6\n\n가. 유통 중인 통화\n\n1. 다롄(Dairen 大連)에서 유통되는 은행권은 다음과 같다.\n   ㄱ. 옛 만주중앙은행권(Central Bank of Manchuria notes, 만주국폐 Manchurian yuan).\n   ㄴ. 조선은행권(Bank of Korea notes).\n   ㄷ. 소련군표(Soviet Army notes).\n\n2. 다롄에서 /가장?/ 널리 유통되는 통화는 소련군표다. 몇 달 전 인민호성보(Jen Min Hu Sheng Pao)의 인쇄소가 [판독 불가] 지폐를 인쇄해도 좋다는 허가를 받았다. 그러나 아직 인쇄된 것은 없다.\n\n3. 다롄의 기준 /?/ 통화는 소련군표다.\n\n4. 다롄에서 쓰이는 통화는 세 가지뿐이다. 만주국폐, 소련군 통화, 조선은행권이다.\n\n25X1X6\n\n25X1A9a\n\n분류(CLASSIFICATION)  [판독 불가]   25X1A8a\n\n25X1A2g\n[공개 승인 1999/09/08 : CIA-RDP82-00457R [판독 불가] -0]\n\n25X1X6  나. 환율\n\n1. 미화 달러 환율은 다음과 같았다.\n\n   1946년 4월 3일    1달러를 만주국폐로 바꾸면   175.00\n   [판독 불가]         \"    \"     \"        \"       \"      209,00[원문 그대로]\n   [판독 불가]         \"    \"     \"        \"       \"      750 200[원문 그대로]\n   [판독 불가]         \"    \"     \"        \"       \"      550 600[원문 그대로]\n   [판독 불가] 9월      \"    \"     \"        \"       \"      43 »D0[판독 불가]\n\n   다롄의 환율은 톈진(Tientsin 天津)과 상하이(Shanghai 上海)의 환율에 [판독 불가]된다.\n\n25X1A6a\n\n   열흘에 한 번꼴로 미화 달러가 중국 정크선을 통해 상하이에서 다롄으로 [판독 불가]되어 들어온다. 지금 이 일에 관여하는 인원은 모두 중국인이다. 앞서 몇 차례는 [판독 불가]이 이 일을 하다 붙잡혔다. 이들은 체벌을 받았고 재산을 몰수당했다.\n\n25X1X6\n\n2. 만주국폐, 조선은행권, 소련군표 사이의 환율:\n   ㄱ. 만주국폐와 소련군표는 각각 100 대 159의 비율로 교환되었다.\n   ㄴ. 조선은행권과 소련군 통화는 각각 100 대 100의 비율로 교환되었다.\n25X1A6a\n\n   [주: 앞서 소련군표와 만주국폐가 같은 값이라고 보고된 바 있다.]\n\n25X1X6\n\n3. 만주국폐, 조선은행권, 소련군표 사이의 환율에 관한 추가 보고:\n   ㄱ. 소련군표 1.80 대 조선은행권 1.\n   ㄴ. 소련군표 1.50 대 만주국폐 1.\n\n   [정보원: 다롄과 국민당 측 항구, 공산당 측 항구를 오간 전직 어선 선장 두 사람. 통역은 톈진의 국립수산국(National Bureau of Fisheries)에 딸린 관찰자(observer)다. 그는 정보원의 진술 가운데 자신이 사실이라고 판단한 부분만 통역했다고 말했다. 면담 일자는 8월 28일이다. 정보의 일자는 밝혀지지 않았다. 출처지: 톈진.]\n\n4. 소련군표는 만주국폐 17410[원문 그대로]의 비율로 교환되었다.\n\n[공개 승인 1999/09/08 : CIA-RDP82-00457R000200220009-0]\n\n[공개 승인 1999/09/08 : CIA-RDP82-00457R000700220689-0 원문 그대로]\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n- 5 -[원문 그대로]\n\n25X1X6  다. 유통\n\n1. 소련 측은 공산당 측이 발행한 지폐의 유통을 금지했다. 이미 유통 중인 통화의 인플레이션을 피하려는 것이다. CRC[원문 그대로]는 아직 유통되지 않았다.\n\n2. 국민당 측이 자기가 장악한 지역에서 소련군표를 회수하기 시작한 뒤로, 이 지폐가 공산당 측이 쥐고 있는 지역으로, 특히 다롄으로 크게 흘러들었다. 이 때문에 여러 물품의 값이 이전의 두 배로 올랐다.\n\n기밀(CONFIDENTIAL)\n\n[공개 승인 1999/09/08 : CIA-RDP82-00457R000200220009-0]", "secondary": "Document No. [판독 불가]\nNO CHANGE in Class.\nApproved For Release 1999/09/08 : CIA-RDP82-00457R0002002960099 [원문 그대로]\n\n[ ] DECLASSIFIED\n\nClass. CHANGED TO: TS  S\nDDA Memo, 4 Apr 77\nAuth: DDA Reg. 77/1763 [원문 그대로]\nDate: [판독 불가]  By: [판독 불가]\n\nCENTRAL INTELLIGENCE GROUP\nINTELLIGENCE REPORT\n\nCOUNTRY  China                        DATE:\nINFO.  As stated\nDIST.  19 December 1946\n\nPAGES  [판독 불가]\nSUPPLEMENT\n\nSUBJECT  Economic Information: Currency in Dairen\n\nORIGIN  As stated   25X1X6\n\n25X1X6\n\nA. Currency in circulation\n\n1. Bank notes in circulation in Dairen are as follows:\n   a. The former Central Bank of Manchuria notes (Manchurian yuan).\n   b. Bank of Korea notes.\n   c. Soviet Army notes.\n\n2. The currency in /greatest?/ circulation in Dairen is the Soviet Army note. A few months ago, the Jen Min Hu Sheng Pao's printing shop was given permission to print [판독 불가] notes. None have been printed yet, however.\n\n3. The standard /?/ Dairen currency is the Soviet Army note.\n\n4. Only three currencies are used in Dairen: Manchurian yuan, Soviet Army currency and Korean notes.\n\n25X1X6\n\n25X1A9a\n\nCLASSIFICATION  [판독 불가]   25X1A8a\n\n25X1A2g\nApproved For Release 1999/09/08 : CIA-RDP82-00457R [판독 불가] -0\n\n25X1X6  B. Exchange Rates\n\n1. U.S. dollar exchange rates were as follows:\n\n   3 April 1946     $1 exchanged for Manchurian yuan   175.00\n   [판독 불가]        \"    \"     \"        \"       \"      209,00 [원문 그대로]\n   [판독 불가]        \"    \"     \"        \"       \"      750 200 [원문 그대로]\n   [판독 불가]        \"    \"     \"        \"       \"      550 600 [원문 그대로]\n   [판독 불가] September  \"    \"     \"     \"       \"      43 »D0 [판독 불가]\n\n   The exchange rate in Dairen is [판독 불가] by the exchange rate in Tientsin and Shanghai.\n\n25X1A6a\n\n   About every ten days, U.S. dollars are [판독 불가] into Dairen from Shanghai by means of Chinese junks. Personnel involved in this traffic now are all Chinese. In several earlier cases, [판독 불가] were apprehended in this activity. They were given physical punishment and their property was confiscated.\n\n25X1X6\n\n2. Manchurian, Korean and Soviet Army dollar exchange rates:\n   a. Manchurian yuan and Soviet Army dollars were exchangeable at a rate of 100 to 159, respectively.\n   b. Korean notes and Soviet Army currency were exchangeable at a rate of 100 to 100, respectively.\n25X1A6a\n\n   [Note: It was previously reported that Soviet Army notes and Manchurian yuan were of equal value.]\n\n25X1X6\n\n3. Additional report on exchange rates between Manchurian, Korean and Soviet Army dollars:\n   a. Soviet 1.80 to 1 Korean.\n   b. Soviet 1.50 to 1 Manchurian yuan.\n\n   [Source: Two ex-fishing boat captains who travelled between Dairen and both Nationalist and Communist ports. Interpreter is an observer attached to the National Bureau of Fisheries at Tientsin. He stated that he had interpreted only such parts of source's reports as he considered true. Date of interview was 28 August. Date of information was not given. Origin: Tientsin.]\n\n4. Soviet Army notes were exchanged at a rate of 17410 [원문 그대로] Manchurian yuan.\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R000200220009-0\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R000700220689-0 [원문 그대로]\nCENTRAL INTELLIGENCE GROUP\n\n- 5 - [원문 그대로]\n\n25X1X6  C. Circulation\n\n1. The Soviets have forbidden the circulation of the paper money issued by the Communists because the Soviets wish to avoid inflation of the currency already in circulation. CRC [원문 그대로] has not yet been circulated.\n\n2. Since the Nationalists began to call in the Soviet Army notes in the areas they control, there has been a great influx of these notes into the Communist-held areas and into Dairen, in particular. This has caused the prices of many articles to rise to twice the former amount.\n\nCONFIDENTIAL\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R000200220009-0", "notes": ["[삭제·공개 표시] Approved For Release 1999/09/08 : CIA-RDP82-00457R0002002960099 (첫 면 공개 승인 도장. 등급 변경 도장과 겹쳐 찍혀 문서번호가 목록의 것과 다르게 읽힌다)", "[삭제·공개 표시] Approved For Release 1999/09/08 : CIA-RDP82-00457R [판독 불가] -0 (둘째 면 공개 승인 도장)", "[삭제·공개 표시] Approved For Release 1999/09/08 : CIA-RDP82-00457R000200220009-0 (둘째 면 끝과 마지막 면 끝)", "[삭제·공개 표시] Approved For Release 1999/09/08 : CIA-RDP82-00457R000700220689-0 (마지막 면 머리. 앞의 것과 번호가 다르게 읽힌다)", "[삭제·공개 표시] 25X1X6 (ORIGIN 줄, 가·나·다 절 머리, 본문 여러 곳)", "[삭제·공개 표시] 25X1A9a (첫 면 아래)", "[삭제·공개 표시] 25X1A8a (CLASSIFICATION 줄 옆)", "[삭제·공개 표시] 25X1A2g (둘째 면 공개 승인 도장 위)", "[삭제·공개 표시] 25X1A6a (둘째 면 환율 항목 사이 두 곳)", "[삭제·공개 표시] Class. CHANGED TO: TS  S / DDA Memo, 4 Apr 77 / Auth: DDA Reg. 77/1763 (등급 변경 도장. 일자와 담당자 란이 판독되지 않는다)"], "note": "OCR 훼손이 심하다. 환율표가 가장 심하다. 낱말은 고쳤다. `Nanchuria`는 Manchuria, `Chine`은 China, `notea`는 notes, `exchanve`·`exchanveable`은 exchange·exchangeable, `Pientsin`은 Tientsin, `Shen-hat`·`Shen:hal`은 Shanghai, `Uatren`·`Leiren`·`Datran`은 Dairen, `funkse`는 junks, `Commmist`는 Communist, `sationalist`는 Nationalist, `ishsries`는 Fisheries, `rroat influx`는 great influx, `ctreuletian`은 circulation 으로 읽었다. 숫자는 한 자리도 고치지 않았다. 환율표 첫 줄만 날짜와 값이 붙어 있고(1946년 4월 3일, 만주국폐 175.00), 나머지 네 줄은 날짜가 뭉개져 [판독 불가]로 두었다. `209,00`은 소수점 자리에 쉼표가 찍혀 있고 `750 200`·`550 600`은 자릿점 없이 두 덩어리로 읽히며 `43 »D0`은 끝자리가 판독되지 않는다. 모두 읽힌 그대로 옮겼다. 마지막 항의 `17410`도 자릿점이 없으나 고치지 않았다. 나 절 2항의 조선은행권 대 소련군표 100 대 100과 3항의 소련군표 1.80 대 조선은행권 1은 서로 맞지 않는데 원문이 둘을 나란히 싣고 있어 그대로 두었다. `/greatest?/`와 `/?/`는 원문 편집자가 판독을 확신하지 못한다는 표시이므로 빗금째 살렸다. 미화 달러가 다롄으로 들어오는 방식을 적은 낱말(`anu:led`)과 앞서 붙잡힌 사람들의 국적을 적은 낱말(`vananess`)은 판독되지 않아 [판독 불가]로 두었다. 뒤의 것은 Japanese 로 읽힐 여지가 있으나 확정하지 않았다. 다 절 1항의 `crc`는 CRC 로 읽었고 어느 통화인지 확정하지 않았다. 마지막 면 쪽번호가 `- 5 -`로 읽히는데 세 면짜리 문서로 보인다. 공개 승인 도장의 문서번호가 면마다 다르게 읽히는 것도 고치지 않았다. 정보원 두 사람은 M18의 어선과 이어진다. 8월 28일 톈진에서 면담한 것이다.", "warn": true, "search": "Approved For Release 1999/09/08 : CIA-RDP82-00457R0002002960099 (첫 면 공개 승인 도장. 등급 변경 도장과 겹쳐 찍혀 문서번호가 목록의 것과 다르게 읽힌다) Approved For Release 1999/09/08 : CIA-RDP82-00457R [판독 불가] -0 (둘째 면 공개 승인 도장) Approved For Release 1999/09/08 : CIA-RDP82-00457R000200220009-0 (둘째 면 끝과 마지막 면 끝) Approved For Release 1999/09/08 : CIA-RDP82-00457R000700220689-0 (마지막 면 머리. 앞의 것과 번호가 다르게 읽힌다) 25X1X6 (ORIGIN 줄, 가·나·다 절 머리, 본문 여러 곳) 25X1A9a (첫 면 아래) 25X1A8a (CLASSIFICATION 줄 옆) 25X1A2g (둘째 면 공개 승인 도장 위) 25X1A6a (둘째 면 환율 항목 사이 두 곳) Class. CHANGED TO: TS  S / DDA Memo, 4 Apr 77 / Auth: DDA Reg. 77/1763 (등급 변경 도장. 일자와 담당자
