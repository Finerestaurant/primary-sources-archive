 란이 판독되지 않는다) Economic Information: Currency in Dairen"}, {"id": "M14", "order": 24, "date": "1946-12-23", "group": "B", "eyebrow": "1946 만주·북조선 · 현장 첩보보고", "title": "경제 및 군사 첩보: 안둥의 소련 측 활동", "badge": "U.S. OFFICIALS ONLY (기밀등급 표시는 판독되지 않는다)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1946-12-23"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Economic and Military Information: Antung Soviet Activities", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000200250005-1"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000200250005-1"}], "summary": "안둥 일대에서 소련군이 무엇을 쥐고 있고 무엇을 강 건너로 옮기는지를 여섯 항목으로 적었다. 노획 일본제 무기와 기계류가 압록강을 건넌다.", "points": ["압록강 철교와 안둥 시내의 라구사오 발전소가 여전히 소련군 경비 아래 있다.", "소련 측이 산다오망에 비밀 정보조직을 두고, 북조선에서 노획한 일본제 무기를 공산군에게 넘기는 일을 맡긴다.", "다량의 기계류가 안둥에서 강 건너 신의주로 옮겨졌다.", "안둥이 위협받을 때마다 성 부지사가 신의주로 건너가 소련군과 협의했다.", "공산군이 기관차 여러 대를 소련제 야포와 맞바꾸어, 안둥 철도에 기관차가 세 대만 남았다.", "중앙정보단이 머리에 주를 달아 안둥이 1946년 국민당군에게 넘어갔으므로 아래 사정은 이미 달라졌을 것이라고 밝힌다."], "primary": "[공개 승인 1999/09/08 : CIA-RDP82-00457R000200250005-1]\n\n미국 관리 전용(U.S. OFFICIALS ONLY)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)   25X1A2g\n\n첩보보고(INTELLIGENCE REPORT)\n\n일자:  25X1X6\n\n국가   중국\n주제   경제 및 군사 첩보: 안둥의 소련 측 활동\n배포(DIST.)  1944년 12월 23일 [원문 `23 Decenber 1944` 그대로]\n25X1A6a  면수  1\n보충(SUPPLEMENT)\n\n25X1X6\n\n출처(ORIGIN)  [삭제]\n\n[주: 안둥(Antung 安東) (124-23, 40-09)이 1946년 [판독 불가]에 국민당군에게 넘어간 뒤이므로  25X1X6  아래에 적은 사정은 틀림없이 달라졌을 것이다.]\n\n1. 압록강 철교와 안둥 시내의 라구사오(Lakushao) 발전소는 여전히 소련군의 경비 아래 있다.\n\n2. 소련 측은 산다오망(Santaomang) 또는 산다오랑터우(Santaolangtou) (12h-20, 40-03)에 비밀 정보조직을 두고 있다. 이 조직은 북조선에서 노획한 일본제 무기를 공산군에게 넘기는 일을 맡고 있다.\n\n3. 다량의 기계류가 안둥에서 강 건너 조선의 신의주(Shingishu 新義州) (124-26, 40-06)로 옮겨졌다.\n\n4. 안둥이 국민당군의 위협을 받을 때마다 성(省) 부지사가 신의주로 가서 소련군과 협의하였다.\n25X1A6a\n\n5. 소련군 운전병이 모는 소련군 화물차가 안둥과 좡허(Chuangho 莊河) 사이의 도로를 자주 오간다. 이들의 경로는 신의주와 다롄(Dairen 大連)을 거친다. [[판독 불가] 주: 이들이 안둥과 좡허를 거쳐 신의주에서 다롄으로 간다는 뜻으로 보인다.]\n\n6. 공산군은 기관차 여러 대를 소련제 야포와 맞바꾸었고, 지금 안둥 철도에는 기관차가 세 대밖에 없다.\n\n25X1A6a\n\n25X1X6\n\n25X1A9a", "secondary": "Approved For Release 1999/09/08 : CIA-RDP82-00457R000200250005-1\n\nU.S. OFFICIALS ONLY\n\nCENTRAL INTELLIGENCE GROUP   25X1A2g\n\nINTELLIGENCE REPORT\n\nDATE:  25X1X6\n\nCOUNTRY   China\nSUBJECT   Economic and Military Information: Antung [Soviet Activities]\nDIST.  23 Decenber 1944 [원문 그대로]\n25X1A6a  PAGES  1\nSUPPLEMENT\n\n25X1X6\n\nORIGIN  [삭제]\n\n[Note: Since Antung (124-23, 40-09) fell to the Nationalists  25X1X6  [판독 불가] 1946, conditions described below have no doubt changed.]\n\n1. The Yalu River Bridge and Lakushao Electric Power Plant in Antung City are still under Soviet guard.\n\n2. The Soviets have a secret service organization at Santaomang or Santaolangtou (12h-20, 40-03). This organization is in charge of delivering Japanese weapons captured in northern Korea to the Communists.\n\n3. Large shipments of machinery have been moved from Antung across the river into Shingishu, Korea (124-26, 40-06).\n\n4. Each time Antung was threatened by the Nationalists, the provincial deputy governor went to Shingishu to confer with the Soviet forces.\n25X1A6a\n\n5. Soviet army trucks with Soviet drivers frequently travel the highways between Antung and Chuangho. They are routed through Shingishu and Dairen. [[판독 불가] note: Presumably it is meant that they travel from Shingishu to Dairen via Antung and Chuangho.]\n\n6. The Communists have traded several locomotives for Soviet artillery, and there are now only three locomotives on the Antung Railroad.\n\n25X1A6a\n\n25X1X6\n\n25X1A9a", "notes": ["[삭제·공개 표시] Approved For Release 1999/09/08 : CIA-RDP82-00457R000200250005-1 (공개 승인 도장)", "[삭제·공개 표시] 25X1X6 (DATE 줄, 머리 주 안, 문서 끝)", "[삭제·공개 표시] 25X1A2g, 25X1A6a, 25X1A9a (여백의 면제 표시)", "[삭제·공개 표시] ORIGIN 줄의 출처 표시가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] 5항 끝 주의 작성자 표시가 판독되지 않는다"], "note": "배포일이 `23 Decenber 1944` 로 찍혀 있다. 색인의 날짜와 앞뒤 문서로 보아 1946년이 맞으나 날짜의 숫자는 고치지 않고 원문대로 두었다. 머리 주에서 안둥 함락 시점의 달 이름이 떨어져 나가 판독 불가로 두었다. 산다오망의 좌표 `12h-20, 40-03` 은 경도의 세 번째 자리가 h 로 찍혀 있다. 124로 보이나 숫자를 고치지 않았다. 안둥 `(124-23, 40-09)` 과 신의주 `(124-26, 40-06)` 은 온전하다. 2항의 지명이 `Santaomang` 과 `Santaolangtou` 두 가지로 찍혀 있어 원문의 두 표기를 다 살렸다. 표제의 `pa rary nannenpreae Information` 은 색인의 원제에 따라 Economic and Military Information 으로 읽었다. `sepenags weapons` 는 Japanese weapons 로, `Hationaliats` 는 Nationalists 로, `goveraer` 는 governor 로, `Shingisha` 는 Shingishu 로, `locorotives` 는 locomotives 로, `artiliery` 는 artillery 로 고쳤다. `Shingishu` 는 신의주의 일본식 표기이며 원문 표기를 살렸다.", "warn": false, "search": "Approved For Release 1999/09/08 : CIA-RDP82-00457R000200250005-1 (공개 승인 도장) 25X1X6 (DATE 줄, 머리 주 안, 문서 끝) 25X1A2g, 25X1A6a, 25X1A9a (여백의 면제 표시) ORIGIN 줄의 출처 표시가 먹칠되어 [삭제]로 옮겼다 5항 끝 주의 작성자 표시가 판독되지 않는다 Economic and Military Information: Antung Soviet Activities"}, {"id": "N01", "order": 25, "date": "1947-01-03", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "조선 정세 (ORE 5/1)", "badge": null, "list_right": "정세 판단서", "meta": [{"k": "일자", "v": "1947-01-03"}, {"k": "종류", "v": "정세 판단서"}, {"k": "원제", "v": "THE SITUATION IN KOREA (ORE 5/1)", "txt": true}, {"k": "CREST 번호", "v": "0000256989"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/0000256989"}], "summary": "중앙정보단이 1947년 첫머리에 내놓은 조선 정세 판단서다. 38도선 분할이 굳어진 가운데 북조선의 소비에트화가 남조선의 민주화보다 앞서 나갔다고 보고, 소련의 당면 목표와 장기 목표를 갈라 짚는다.", "points": ["카이로와 얄타의 독립 약속은 이행되지 않았다. 38도선은 우편 교환과 북에서 남으로 보내는 잉여 전력을 빼면 왕래가 끊긴 장벽이 되었다.", "지난 5월 미소공동위원회가 휴회한 뒤 교착이 이어진다. 갈라진 지점은 신탁통치 반대자를 임시정부에서 뺄 것인가이다. 소련은 빼라 하고 하지 장군은 언론의 자유를 든다.", "북조선은 인민위원회 위계에 행정을 맡겨 자치의 겉모습을 주었다. 은행과 중공업과 통신을 국유화하고 토지를 나누었다. 11월 3일 선거로 잠정 위원회가 정식 위원회로 바뀌었고 투표율은 99.6%였다. 후보는 단일 명부였다.", "판단서는 조선인 대다수가 사회주의 강령을 지지하면서도 소련의 강령은 지지하지 않는다고 본다. 근거로 미국 지구의 모든 선거에서 우익이 크게 이긴 것을 든다. 다만 이 판단이 북조선 사정을 충분히 알고 내린 것이 아니라 편견의 소산일 수 있다고 스스로 단서를 단다.", "남조선 불안의 근본 원인을 정치보다 경제로 짚는다. 6월 홍수, 보리 수집 36%, 10월 쌀 수집 할당량 1% 미만, 대구와 부산 시가전에서 경관 40명과 폭도 40명 사망, 체포 3,782명.", "소련의 당면 목표는 북조선의 공산 정권 수립이고 장기 목표는 반도 전체를 극동 방위 체계에 넣는 것이다. 소련 지구에서 30만에서 40만으로 추산되는 조선인 무장 병력이 조직되고 있으며, 미군이 통제를 잃으면 대규모 침투로 개입하리라 본다."], "primary": "중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\nCIA 역사자료 검토 프로그램(CIA HISTORICAL REVIEW PROGRAM)\n전면 공개(RELEASE IN FULL)\n\n조선 정세 |\n\nORE 5/1\n1947년 1월 3일 236095 35, a\n\nORE 5/1\n\n1947년 1월 3일 _ 사본 번호 _ §\n\n중앙정보단\n\n조선 정세\n\n요약\n\n\\ 통일과 독립은 조선 사람이 가장 바라는 것이며, 미국과 소련에 의한 분할과 공동 점령은 이 반도의 정치·경제 생활을 좌우하는 요인이다. 카이로에서 한 독립의 약속은 얄타에서 확인되었으나 이행되지 않았다. 38도선에서의 조선 분할은 미국 지구와 소련 지구 사이에 거의 뚫을 수 없는 장벽이 되었다. 조선의 통일과 궁극의 독립을 규정한 모스크바 결정(Moscow Decision)은 이행되지 않았는데, 주된 까닭은 그 문서의 해석과 민주주의의 뜻을 두고 미국과 소련이 어긋난 데 있다. 지난 5월 미소공동위원회(Joint Commission)가 휴회한 뒤로 이를 다시 열려는 모든 노력은 실패하였다.\n\n지금의 교착 속에서 미국과 소련은 둘 다 제 지구의 정치·경제 조직을 강화하려 하고 있다. 소련이 북조선에서 통제 체제로 나아간 속도는 미국이 제 지구에서 민주주의로 나아간 속도보다 빨랐다. 남조선에 대한 미국의 잠정 정책은 미소공동위원회의 휴회로 모스크바 결정의 해석을 둘러싼 근본적 불일치가 드러난 뒤에야 시행되었다. 반면에 북조선의 소비에트화는 점령 직후에 시작되어 그 뒤로 끊임없이 진행되었다.\n\n조선에서 소련의 정책은 결코 소련을 치는 근거지가 되지 않을 우호적인 국가를 세우는 데 맞추어져 있다. 극동에 있는 제 빈약한 자원을 최소한만 쓰면서 이 목적을 이루기 위하여, 소련은 북조선을 정치적으로는 종속시키되 경제적으로는 자급하게 만들려 하였다. 소련은 조선 공산주의자들이 지배하는 「인민위원회(people's committees)」의 위계에 행정을 맡김으로써 제 지구에 자치의 겉모습을 주었다. 북조선의 경제 또한 국가 통제의 원칙 위에 다시 세워졌다. 은행·중공업·통신은 모두 국유화되었다. 토지는 재분배되었고, 사적 기업은 주로 농업과 수공업에 남아 있다. 엄격한 정치적 감독 아래 있는 독점적 조합 체계에는 가입이 강제된다.\n\n비밀(SECRET)\n\n사회주의적 강령은 조선인 대다수가 지지하는 바이지만, 소련의 강령은 인민의 지지를 얻지 못한 것으로 보인다. 남조선에서 반대자들과의 선택은 그리고 북조선의 소련식 규율과는 대조적으로, 남조선은 불안 상태에 있다. 식량 부족이 불안의 주된 원인이나, 잘 조직된 공산주의자 미군 점령 반대 세력이 지금의 소요에 정치적 방향을 주려 애쓰고 있으며, 소련 선전은 이 소요를 온건파가 미국 지구에서 여러 정당의 연립을 이루고 잠정 입법기구를 세우는 일에 대한 항의로 그려 낸다. 다수는 지금 상당히 진척된 미국의 잠정 계획을 지지할 준비가 되어 있다. 그리하여 공산당의 더 급진적인 날개는 소련 선전의 지원을 받아 점령에 맞선 테러 활동에 나섰다. 조선인 군대가 소련 지구에서 훈련받고 있으며, 미군이 남조선의 정세를 통제하지 못하게 될 경우 아마도 대규모 침투의 방식으로 개입하리라 예상할 수 있다.\n\nsate, 따라서 북조선에 확고한 공산주의 정권을 세운다는 소련의 당면 목표는 실현에 가까이 와 있다. 그러나 소련의 장기 목표는 이 반도 전체를 소련의 극동 방위 체계 안에 편입시키는 것이다. 미국의 남조선 점령이 이 계획의 가장 큰 장애이므로, 소련 선전과 공산주의자의 선동은 한결같이 미국을 조선에서 몰아내려 해 왔다. 현재 소련은 남조선에서 공산당이 벌이는 직접 행동의 결과를 기다리며 그 이상의 외교적 행동을 미루어 두고 있다.\n\n그러나 급진적 방법이 실패할 경우 소련이 타협에 나설 가능성은 남아 있는데, 어떤 장기적 이점은 미국 쪽에 있기 때문이다. 조선인 대부분이 소련이든 다른 어떤 강대국이든 그 지배를 열렬히 반대하므로, 미군과 소련군이 동시에 물러난다면 인구의 3분의 2를 안고 있는 남조선의 안정된 민주 정부가 소련이 지배하는 북조선 정권보다 유리할 것이다. 그러므로 남조선에서 질서를 유지할 수 있고 임시정부 수립을 향해 진전이 이루어진다면, 소련은 발판에서 양보하기로 결정할 수도 있다.\n\n- 이 정세에 대한 더 완전한 연구를 여기에 첨부한다.\n\n부록(ENCLOSURE)\n조선 정세\n\n분할이 미치는 압도적 영향 ee 조선을 두 지구로 나눈 분할이 이 반도의 정치·경제 생활을 지배한다. 38도선에서의 조선 분할은 굳고 단단한 경계로 굳어져, 우편의 교환과 북조선에서 남조선으로 넘기는 잉여 전력의 송전을 빼고는 나라의 북쪽 절반과 남쪽 절반 사이의 모든 왕래를 끊어 놓았다.\n\n조선인의 열망과 미소 정책 통일과 독립은 조선 사람의 으뜸가는 열망이다. 조선 민족주의는 뿌리 깊은 운동으로 일본의 40년 억압을 견디어 살아남았고 마침내 1943년 12월 카이로 회담에서 국제적 승인을 얻었다. 미국·영국·중국은 그때 조선의 독립을 회복시킬 것을 서약하였다. 이 선언에 대한 소련의 동의는 뒤이어 1945년 2월 얄타에서 얻었고, 그 정책은 같은 해 7월 포츠담에서 재확인되었다. 1945년 12월 모스크바 외상회의는 조선 사람을 독립과 민주주의에 대비시키기 위하여 전 조선을 위한 임시정부를 세우기로 합의하였다. 점령이 이 반도를 서로 다른 지구로 갈라 놓았으므로, 모스크바 결정은 또한 임시정부를 조직하고 통일 조선을 위한 광범한 민주 개혁 계획을 마련하는 데 그 정부와 협의할 미소공동위원회를 두도록 규정하였다. 이 계획은 다시 미국·소련·영국·중국 정부에 제출되어 「최장 5년간」 지속될 4개국 신탁통치의 기초가 될 것이었다. 모스크바 결정을 실행하려는 모든 노력은 주로 신탁통치를 둘러싼 충돌 때문에 실패하였고, 조선은 38도선에서 두 동강 난 채로 있다.\n\n올해 5월 미소공동위원회가 휴회한 뒤로 소련은 미국이 받아들일 수 없는 조건이 아니고서는 대표단을 서울로 돌려보내기를 끈질기게 거부해 왔다. 북조선의 소련군 사령관은 신탁통치 반대자들을 조선 임시정부에서 배제해야 한다는 주장에서 소련이 물러서지 않으리라는 것을 분명히 하였다. 하지(Hodge) 장군 역시 조선인의 언론 자유의 권리와 모스크바 결정의 신탁통치 조항에 대한 넓은 해석을 똑같이 강하게 주장한다. 따라서 가까운 앞날에 미소공동위원회가 다시 열릴 전망은 희박하다.\n\n반도의 통일이 이루어지기까지 미국과 소련은 둘 다 제 지구의 정치·경제 조직을 강화하려 하고 있다. 소련은 점령하자마자 제 지구의 소비에트화를 시작한 반면, 미국의 정책은 미소공동위원회가 휴회할 때까지 모스크바 결정이 곧 이행되리라는 전제 위에 서 있었다. 남조선을 위한 별도의 잠정 계획은 미소공동위원회 교섭의 결렬이 민주주의에 대한 미국과 소련의 관념이 서로 적대적이라는 것과 그 사이에서 타협을 찾기가 어렵다는 것을 드러낸 뒤에야 시행되었다. 그러므로 북조선의 소비에트화는 미국 지구의 민주화보다 더 멀리 나아가 있다.\n\n북조선 정세 ee ee eh ES 소련의 정책과 정치 계획. 조선에서 소련의 정책은 결코 소련을 치는 근거지가 될 수 없는 우호적인 국가를 세우는 데 맞추어져 있다. 소련은 극동에 있는 제 빈약한 자원을 최소한만 쓰면서 이 목적을 이루려 하므로, 소련 정책의 필연적 귀결은 정치적 종속과 경제적 자급을 결합하는 것이다. 조선에서든 다른 곳에서든 소련 체제의 가장 두드러진 특징은 모든 반대를 가혹하게 억누르는 것이다. 남조선의 미군정과 달리 북조선의 소련 당국은 다투는 분파들 사이의 조정자가 되려 하지 않았다. 소련은 일본으로부터 이 지역의 통제권을 넘겨받은 직후 일본 통치의 잔재를 청산하기 위하여 「잠정 인민위원회(interim people's committees)」 체계를 세웠다. 이 위원회들은 소련이 뽑았으나 전원이 조선인으로 이루어져 있다. 이 잠정 위원회들은 11월 3일 선거의 결과로 이제 정식 위원회로 바뀌었다.\n\n이로써 소련은 조선인에게 자치의 겉모습을 주면서 직접 행정의 책임은 피하였다. 지방과 도의 인민위원회 위계는 중앙위원회에서 정점을 이루며, 그 지도자는 김일성(Kim Il Sawng)으로 소련은 그를 항일 저항의 영웅이자 스탈린을 본뜬 인민의 지도자로 선전해 왔다. 이 정권은 대중의 지지를 일당 체계에 기대고 있다. 소련은 모든 반대 세력을 없앤 뒤 제 정부에 호의적인 정당들을 북조선노동당(North Korean Labor Party)이라 하는 독점 조직으로 묶어 나갔다. 이 노동당의 우두머리 김두봉(Kim Doo Bong)은 김일성과 더불어 소련의 감독 아래 있는 일종의 조선인 두 사람 집정 체제를 이루고 있다.\n\n소련의 경제 조치. 북조선의 경제 또한 통제와 간접 지배의 원칙 위에 다시 짜였다. 소련 지구는 조선 전체 인구의 약 3분의 1과 전체 식량 생산의 35%를 안고 있어 농업에서 자급한다. 게다가 조선의 광업·전력·중공업은 38도선 이북에 몰려 있다. 폴리(Pauley) 대사는 소련 지구 공업 지역의 60%를 시찰한 뒤, 북조선에서 반출된 것은 사소한 설비 품목뿐이라고 결론지었다.\n\n4, PHS 비밀(SECRET) 따라서 소련은 제 지구의 공업 잠재력을 보존하고 경제적 자급을 쌓아 올리려는 것으로 보인다.\n\n소련 선전은 미국 지구의 침체된 상태와 견주어 북조선의 경제적 진보를 강조하며, 실제로 소련 지배 아래에서 혁명적 변화가 일어났다. 조선인과 일본인 지주는 하나의 계급으로서 청산되었고, 일본이 이용해 먹던 전통적 토지 보유 제도는 폐지되었다. 소련은 100만 헥타르(2,471,000 에이커)의 토지를 소작인에게 무상으로 분배하였다고 자랑한다. 중공업뿐 아니라 은행·통신·운수도 모두 인민위원회가 통제한다. 다시 말해 곧바로 사회화할 수 있는 모든 기업은 국가가 넘겨받았다. 사적 기업은 장인이나 농민 같은 소생산자 사이에만 남아 있다. 소련은 또한 조선인 노동자에게 8시간 노동제와 함께 사회보험과 최저임금 보장을 시행하였다고 주장한다. 아동 노동은 금지되었고, 여성에게는 정치적·경제적으로 동등한 권리가 주어졌다. ;\n\n소련의 계획에 대한 조선인의 반응 eee 소련 계획이 지닌 선전상의 값어치는 특히 미국 지구에서 의심할 바 없다. 조선인은 오늘의 미국 기준으로 보면 거의 모두 좌익이며, 보수 정당들조차 전통적 자본주의의 옹호자로 볼 수 없다. 기간산업의 사회화와 토지의 재분배는 남조선 모든 정당의 정강에 들어 있다. 그러므로 소련의 정책은 조선에서 큰 대중적 호소력을 지니리라 예상할 만하다. 그러나 증거가 모자라기는 하여도, 소련의 계획이 인민의 지지를 얻지 못하였다는 징후가 있다. 공산주의와 소련의 우세는 사실 남조선에서 좌익 정당과 우익 정당 사이의 주요 쟁점이며, 그곳에서는 이따금 일시적으로 신문을 제한하는 일이 있기는 하나 표현의 자유가 통한다. 남조선의 좌익 정당들은 대체로 소련 체제에 호의적이고 우익 정당들은 이에 반대한다. 그리하여 미국 지구의 조선인은 소련의 반대자와 지지자 사이에서 분명한 선택을 할 수 있다. 그러므로 미국 지구에서 치른 모든 선거가 우익 정당에 큰 다수를 안겨 주었다는 것은 뜻이 있다. 이 결과는 38도선 이남의 조선인 사이에 소련 공산주의에 대한 강한 반감이 있다는 것으로만 설명할 수 있다. 다만 이 대중의 판단은 소련 지구의 사정을 충분히 알고서 내린 것이 아니며, 판단이라기보다 편견의 소산일 수도 있다.\n\n소련 지구 조선인의 태도만이 소련 정책의 성공 여부를 확실히 알려 주는 것이다. 그러나 소련 선전을 빼면 경계 이북의 여론 상태에 관해 얻을 수 있는 정보는 거의 없다. 이따금 도는 저항의 소문, 이를테면 : ~ . 비밀(Secrer) 그리고 기꺼이 그것을 떨쳐 버리고 싶어 한다. 그러나 소련 체제가 인기가 없다는 이야기를 전부 그 군대의 비행 탓으로 돌릴 수는 없다. 지나친 통제 또한 조선인 사이에 어느 정도 반감을 낳았을 수 있다. 예컨대 정치에서의 일당 체계는 노동 조직에서도 그대로 되풀이된다. 북조선에서 조합 가입은 강제이며, 모든 조합은 공산당의 지도 아래 전조선노동조합(All Korea Labor Union)에 편입되어 있다. 소련 지구에서 8시간 노동제가 법으로 보장되어 있는데도, 조합원들은 최근 남조선 파업자들을 위한 기금을 모으기 위하여 날마다 한 시간씩 더 일하도록 요구받았다.\n\n소련이 통제하는 다른 지역에서와 마찬가지로 북조선에도 불만은 아마 있을 것이다. 그러나 현재 58도선 이북의 소련 체제는 어느 때보다 굳게 자리를 잡은 것으로 보인다. 모스크바 신문은 정식 인민위원회를 세운 11월 3일 선거에서 등록 유권자의 99.6%가 투표에 나와 현 정부에 대한 충성을 크게 과시하였다고 자랑하였다. 소련의 관례에 따라 유권자들은 선택이라는 난처함을 겪지 않았는데, 모든 후보가 단일 명부에 올라 있었기 때문이다. 소련은 이 결과를 북조선에서 현재의 통치 체계를 이어 가라는 인민의 위임으로 여긴다.\n\n남조선 정세 ore 개관. 38도선 이북에 소련식 규율이 지배하는 동안 남조선은 불안 상태에 있다. 분파주의와 정당 간 다툼은 최근 일련의 파업과 폭동으로 치달아 미군의 개입을 부를 지경이 되었다. 9월 말 철도 노동자와 인쇄공의 파업은 남동부의 경상북도와 경상남도를 중심으로 한 폭력 사태로 번졌다. 공식 추산에 따르면 10월 초 대구와 부산 지역의 시가전에서 경관 약 40명과 폭도 약 40명이 죽었다. 재산 피해는 수백만 엔에 이르렀고 체포자는 3,782명이었다. 이 소요가 벌어지는 동안 미군은 이따금 군중을 향해 발포하지 않을 수 없었다. 파업자들이 차츰 일터로 돌아가면서 10월 중순 무렵 잠시 평온이 돌아왔다. 그러나 그달 말께 불안이 되살아났고, 무대는 남동부에서 남서부와 서울 부근으로 옮겨 갔다. 10월 22일로 잡혀 있던 수도에서의 봉기는 군정 쪽의 때맞춘 조치로 막았다. 이 소요의 끝은 아직 a: -6- A eae 보이지 않으며, 암살 기도와 파괴 공작의 보고가 계속 들어오고 있다. 하지 장군은 공산주의자들이 좌우 통합을 깨뜨리고 남조선에서 임시 입법기구가 서는 것을 막기 위하여 군정에 맞선 반란을 부추기고 있다고 공개적으로 비난하였다. 소련 선전은 이 선동을 「반동 분자들을 데리고 남조선의 ‘독립 정부’를 만들어 내려는 미국 행정 당국의 기도」에 대한 인민의 불만으로 돌림으로써 이 해석에 은연중 동의한다.\n\n경제 정세. 남조선에서 지금 벌어지는 소요의 근본 원인은 정치적이라기보다 아마 경제적인 것이다. 다른 점령 지역과 마찬가지로 조선의 미국 지구는 물자 부족과 물가 폭등에 시달린다. 공산주의자의 지도는 궁핍이 불러일으킨 불만을 이용하였을 뿐이다. 남조선의 식량 사정은 지난 6월 홍수가 여름 곡식 농사를 망친 뒤로 줄곧 위태로웠다. 군정이 지난겨울 유지한 곡물 자유시장은 남아 있던 쌀 비축분을 헤프게 흘려보내게 하였다. 식량 통제는 지난 3월에 시행되었는데, 부족을 막기에는 너무 늦었다. 한번 암시장에서 폭리를 취하도록 허용된 뒤로 농민들은 정해진 값으로 곡식을 강제 수집하는 데 저항해 왔다. 여름 곡식의 으뜸인 보리는 9월 초까지 정부가 수집한 것이 수확량의 36%에 지나지 않았다. 남조선의 심각한 식량 부족을 덜어 주리라 기대되던 가을 쌀 수확도 아주 더디게 들어오고 있다. 10월에는 예상한 5%에 견주어 수집 할당량의 1%도 채우지 못하였고, 12월 15일에도 수집은 여전히 예정보다 크게 뒤처져 있었다.\n\n파업과 홍수와 전시의 노후로 운수가 무너진 탓에 남조선에서 있는 물자를 나누는 일은 한층 더 어려워졌다. 8월과 9월 미국에서 들어온 곡물은 최소 소요량에 25% 모자랐다. 이런 형편에서 암시장 쌀값은 보통 소비자가 손댈 수 없을 만큼 치솟았다. 군정은 통제를 엄격히 시행하겠다고 앞서 발표하였음에도 미봉책으로 쌀의 제한적인 자유 이동을 눈감아 주었다. 조선 사람들은 물가 폭등을 호소하면서도 정부의 쌀 수집과 배급에는 대체로 반대한다. 조선인 경찰은 9월 동안 암시장 쌀을 압수하려고 들어오는 열차를 뒤지는 일에 나섰다. 이 조치는 항의의 폭풍을 불러 곧 그만두었다. 조선의 미군정은 언론의 자유를 존중하는 까닭에 능률을 얼마를 치르든 모든 정책에서 여론을 셈에 넣어야 한다.\n\n미군 점령에 대한 조선인의 저항은 미국 정책의 너그러움에 힘입어 커졌다. 경제적 불만은 미국 당국이 관용하리라 셈한 남조선의 군정 반대자들에 의하여 정치적 불안으로 바뀌었다. The aot Ok : eer Seer 지금의 봉기는 인민의 원한의 산물이라기보다 불확실함의 산물이다. 미국은 조선인이 일본 아래에서 익숙해진 그런 종류의 통치를 그들에게 씌우지 않았다. 군정은 서로 겨루는 분파들 사이에서 균형을 잡으려 하다가 그 의도에 관하여 대중을 헷갈리게 하였고, 공정함은 우유부단으로 해석되었다.\n\n정치 정세. 미국은 조선인을 가르치려는 것이지 특정 사상을 주입하려는 것이 아니다. 이에 따라 군정은 per미군과 소련군 양쪽의 즉시 철수. 외국의 지배는 미국 지구에서나 소련 지구에서나 인기가 없다. 그럼에도 남조선의 우익과 좌익 양쪽의 온건파는 소련의 지배에 대한 대안으로서 미군정을 지지할 것이다. 하지 장군은 미국 지구에서 여러 정당의 연립을 이루고 잠정 입법기구를 세우는 일에. 이로써 남조선은 모스크바 결정이 실행되기까지 어느 정도의 자치를 얻게 될 것이었다. 다수는 이제 실현 단계에 이른 미국의 잠정 계획을 지지할 준비가 되어 있다. 좌우의 통합은 10월 초에 발표되었고, 12월 중에 소집된 잠정 입법기구의 선거가 치러졌다.\n\n남조선에 대한 소련의 계획.\na Krell.\n\n공산당이 갈라지고 그 가장 과격한 부분이 박헌영(Pak Heun Yung) 아래에 놓인 뒤에야 til. 공산주의자들은 잠정 입법기구를 남조선의 분리주의 정부이자 일본 시대 자문회의의 부활이라고 규탄한 뒤, 점령에 맞선 테러 활동에 나선 것으로 보인다.\n\n하지 장군의 정보 제공자들에 따르면 미국 지구의 공산주의자들은 북조선의 소련과 손잡고 올겨울 총반란을 꾸미고 있다. 미군 점령에 맞선 불안을 부추기려는 소련 선전의 나란한 노력 말고는 소련이 공모하였다는 직접적 증거는 없다. 그럼에도 조선공산당을 매개로 한 소련의 개입은 상정할 수 있으며, 지금의 소요가 총봉기로 이어진다면 그 개입은 커지리라 예상할 수 있다. 남조선의 한 저명한 좌익 지도자는 최근 ° SeGRE—— 소련 지구를 다녀온 뒤, 지난 몇 달 동안 소련 공작원 1만 명이 경계를 넘어 침투하였다고 언명하였다. 믿을 만한 보고들은 소련 지구에서 조선인 대규모 무장 병력이 조직되고 있으며 그 수가 30만에서 40만 명에 이를 수도 있다고 알린다. 미군이 진압할 수 없는 반란이 일어날 경우 소련은 이 조선인 비정규 병력을 통하여 남조선에 간접적으로 개입할 수도 있다.\n\n하지 장군은 소련이 훈련시킨 조선인들이 미국 지구를 침공하려 한다는 경고를 내놓았고, 이에 따라 미군 병력을 지체 없이 편제 정원(T/O)까지 채워 줄 것을 요청하였다. 이 침공은 정규군의 원정보다는 대규모 침투의 형태를 띨 가능성이 크다. 약 15만 명으로 추산되는 북조선의 소련군은 미군이 이 반도에서 완전히 물러나지 않는 한 경계를 넘지 않으리라 보인다.\n\n앞으로의 소련의 목표와 예상되는 전개 소련은 조선에 대하여 두 갈래의 정책을 가지고 있으며, 이는 미국 지구와 소련 지구 양쪽에 적용된다. 북조선에서 소련의 정책은 소련과의 완전한 협력을 지향하는 공산주의자 통제 정권을 세우는 데 맞추어져 있다. 최근 소련 지구에서 정식 인민위원회를 뽑은 선거는 이 당면 목표를 이루었음을 뜻한다. 소련의 장기 목표는 이 반도 전체를 소련의 극동 방위 체계 안에 편입시키는 것이다. 미국의 점령이 이 목적을 이루는 데 가장 큰 장애이므로, 소련 선전과 공산주의자의 선동은 미국을 조선에서 몰아내는 데 맞추어져 왔다. 점령이 시작된 뒤로 끊임없이 밀어붙여 온 남조선 군정에 대한 공격은 북조선에서 소련 권력이 굳어지고 남조선에 대한 미국의 잠정 정책이 나오면서 한층 거세졌다.\n\n모스크바 결정을 실행하기 위한 미소공동위원회의 교섭은 여전히 교착 상태이며, 그러는 동안 공산주의자들은 미국 지구에서 잠정 정부가 서는 것을 폭력으로 막으려 애쓰고 있다. 소련의 외교는 남조선에서 공산당이 벌이는 직접 행동에 자리를 내준 것으로 보이나, 급진적 방법이 실패할 경우 소련이 타협에 나설 가능성은 언제나 남아 있다. 미소공동위원회를 다시 열자는 소련의 첫 타진은 남조선에서 좌우 통합 운동이 성공하고 좌우합작위원회가 잠정 입법기구에 찬성한다고 선언한 것과 때를 같이하였다. 남조선의 민주적 재편을 밀고 나가겠다는 미국의 결의가 뚜렷해지면서 합의의 전망은 빠르게 사그라들었다. 결국 소련은 북조선의 소련 정치고문이 번스(Bunce) 공사와 함께 미소공동위원회를 다시 열 기초로 마련해 놓은 방안을 거부하였다. © -4—SPCRET 그러므로 모스크바 결정이 가까운 앞날에 실행될 전망은 희박하다. 한편 소련이 제 지구를 곧바로 소비에트화함으로써 처음의 이점을 얻기는 하였으나, 어떤 장기적 이점은 미국 쪽에 있다. 두 지구의 조선인 대다수는 지배를 열렬히 반대한다 = 10% - 2 비밀(SEGRET)", "secondary": "CENTRAL INTELLIGENCE GROUP\n\nCIA HISTORICAL REVIEW PROGRAM\nRELEASE IN FULL\n\nTHE SITUATION IN KOREA |\n\nORE 5/1\n3 January 1947 236095 35, a\n\nORE 5/1\n\n3 January 1947 _ Copy No. _ §\nCENTRAL INTELLIGENCE GROUP\n\nTHE SITUATION IN KOREA\n\nSUMMARY\n\n\\ Unity and independence are the dominant aspirations of the Korean people, while partition and joint occupation by the US and USSR are the governing factors in the political and economic life of the peninsula. The promises of independence made at Cairo, and confirmed at Yalta, have not been fulfilled. The division of Korea at the 38th parallel has become an almost impenetrable barrier between the US and Soviet Zones. The Moscow Decision, which provides for the unification and eventual independence of Korea, has not been implemented, largely because of disagreement between the US and USSR over the interpretation of the document and the meaning of democracy. All efforts to reconvene the Joint Commission since its adjournment last May have failed.\n\nIn the current deadlock, both the US and USSR are attempting to strengthen the political and economic organization of their own zones. The USSR has made more rapid progress toward regimentation in North Korea than the US has made toward democracy in its zone. An interim US policy for South Korea was not implemented until-after the adjournment of the Joint ‘Commission disclosed the fundamental disagreement over interpretation of the Moscow Decision. The sovietization of North Korea, on the other hand, began immediately after the occupation, and has proceeded without interruption since then.\n\nSoviet policy in Korea is directed toward the establishment of a friendly state which will:never serve as a base of attack upon the USSR. In order to attain this objective at a minimum cost to itsown scanty resources in the Far East, the USSR has attempted to make North Korea economically self-sufficient though politically subordinate. Soviets have given their zone a semblance of autonomy by entrusting the administration to a hierarchy of \"people's committees\" dominated by the Korean Communists. The economy of North Korea has also been reconstructed on the principle of state control. Banking, heavy industry and communications have all been nationalized. The land has been redistributed, and private enterprise survives chiefly in agriculture and handicrafts. Membership is compulsory in a monopolistic system of unions under strict political supervision.\n\nSECRET\n\nAlthough a socialistic program is favored by the large majority.of Koreans, the Soviet program does not appear to have won the support of the people. In South Korea the choice between Opponents and In contrast to the Soviet discipline of North Korea, South Korea is in a state of unrest. The food shortage is the chief cause of unrest, but the well organized Communist opponents of the US occupation are endeavoring to give political direction to the current disorders, which Soviet propaganda represents as a protest against the operation of moderates in forming a coalition of parties and in estab~ lishing a provisional legislature in the US Zone. The majority is Prepared to support the US interim Program, which is now well advanced, The more radical Wing of the Communist Party, with the Support of Soviet propaganda, has therefore resorted to a campaign of terrorism against the occupation. A Korean army is being trained in the Soviet Zone, and may be expected to intervene, probably by mass infiltration, in case US forces should lose control of the situation in South Korea.\n\nsate, The immediate Soviet objective of establishing a firm Communist regime in North Korea is, therefore, close to realization. The long-range objective of the USSR is, however, to integrate the entire ’ peninsula in the Soviet system of Far Eastern defenses. Since the US occupation of South Korea is the chief obstacle to this plan, Soviet propaganda and Communist agitation have consistently sought to drive ’ the US out of Korea. At the present time, the USSR has deferred further diplomatic action pending the results of direct action by the : Communist Party in South Korea.\n\nA possibility remains, however, that the USSR will resort to compromise if radical methods fail, because certain long-term advantages are on the side of the US. Since most Koreans fervently oppose domination by the USSR or any other power, a stable democratic government in South Korea, which contains two-thirds of the population, would have the advantage over the Soviet-dominated regime in North Korea if. US and Soviet troops simultaneously withdrew. Therefore, if order can be maintained in South Korea and progress is made toward establishing @ provisional government, the USSR may decide to make concessions in foothold.\n\n- A more complete study of this Situation is enclosed herewith.\n\nENCLOSURE\nTHE SITUATION IN KOREA\n\nThe Dominating Influence of Partition ee The partition of Korea into two zones dominates the political and economic life of the peninsula. The division of Korea at the 38th parallel has turned into a hard and fast boundary which cuts off all intercourse betwéen the northern and southern halves of the country, except for the exchange of mail and the transfer of surplus electric power from North to South Korea.\n\nKorean Aspirations and US-USSR Policies Unity and independence are the chief aspirations of the Korean people. Korean nationalism is a deep-rooted movement which survived forty years of Japanese repression and finally won international recognition at the Cairo Conference in December, 1943. The US, Great Britain, and China pledged themselves at that time to restore the independence of Korea. Soviet adherence to this declaration was subsequently obtained at Yalta in February, 1945, and the policy was reaffirmed at Potsdam in July of that year. The Conference of. Foreign Ministers at Moscow in December, 1945, agreed to establish a provisional government for all Korea in order to prepare the Korean people for independence and democracy. Since the occupation had divided the penin-~ sula into separate zones, the Moscow Decision also provided for a Joint Commission of the US and USSR to organize the provisioral government and consult with it in working out a broad program of democratic reforms for a united Korea. This program in turn was to be submitted to the governments of the US, USSR, UK and China as the basis for a fourpower trusteeship which would last \"for a period of up to five years\", All efforts to carry out the Moscow Decision have failed principally because of the conflict over trusteeship, and Korea remains bisected at tne 38th parallel.\n\nSince the adjournment of the Joint Commission in May of this year, the USSR has persistently refused to return its delegation to Seoul, except on terms unacceptable to the US. The Soviet Commander. in North Korea has made it clear that the USSR would not retreat from its contention that the opponents of trusteeship must be excluded from the provisional government of Korea. General Hodge is equally insistent on the Koreans' right of free speech and on a broad interpretation of the trusteeship clause of the Moscow Decision. There is consequently little prospect of reconvening the Joint Commission in the near future.\n\nPending the unification of the peninsula, the US and the USSR are both attempting to strengthen the political and economic organization of their respective zones. The USSR began the sovietization of its zone immediately upon occupation, whereas, until the adjournment of the Joint Commission, US policy was based on the assumption that the Moscow Decision would soon be fulfilled. A separate interim program for South Korea was not implemented until after the breakdown of Joint Commission negotiations had revealed the antagonism of the US and Soviet conceptions of democracy, and the difficulty of finding a compromise between them. The sovietization of North Korea therefore has progressed farther than has the democratization of the US Zone.\n\nSituation in North Korea ee ee eh ES Soviet Policy and Political Program. Soviet policy in Korea is directed toward the establishment of a friendly state which could never serve as a base of attack upon the USSR. Since the USSR intends to attain this objective at a minimum cost to its own scanty resources in the Far East, a corollary of Soviet policy is to combine political subordination with economic self-sufficiency. The most striking feature of the Soviet regime in Korea as elsewhere is the stern repression of all opposition. Unlike the US Military Government in South Korea, the Soviet authorities in the North have not tried to be arbiters between contending factions. Immediately after taking over control of the region from the Japanese, the Soviets set up a system of \"interim people's committees\" to liquidate the remnants of Japanese rule. Although these committees were selected by the Soviets, they are composed entirely of Koreans. These interim committees have now been replaced by permanent committees as a result of the elections of 3 November.\n\nThe USSR has thus given the Koreans a semblance of autonomy and avoided the responsibilities of direct administration. The hierarchy of local and provincial people's committees culminates in a central committee, under the leadership of Kim Il Sawng, who has been publicized by the Soviets as a hero of the resistance to Japan and a leader of the people on the model of Stalin. This regime depends for pcpular support upon a Single-party system. After eliminating all opposition, the Soviets proceeded to consolidate the parties favorable to their government ina monopolistic organization known as the North Korean Labor Party. The head of this Labor Party, Kim Doo Bong, constitutes together with Kim Il Sawng a sort of Korean duumvirate under the supervision of the USSR.\n\nSoviet Economic Measures. The economy of North Korea has also been reorganized on the principles of regimentation and indirect control. With approximately one-third of the total population of Korea and 35% of the total food production, the Soviet Zone is agriculturally self-supPorting. Korean mining, electric power, and heavy industry are, moreover, concentrated north of the 38th parallel. After inspecting 60% of the industrial areas of the Soviet Zone, Ambassador Pauley concluded that only minor items of equipment had been removed from North Korea.\n\n4, PHS SECRET It seems therefore that the USSR intends to Preserve the industria] potential and build up the economic self-sufficiency of its zone.\n\nSoviet propaganda stresses the €conomic progress of North Korea in contrast to the stagnant condition of the US Zone, and revolutionary changes have in fact taken place under Soviet rule. Korean and Japanese landowners have been liquidated as a class, and the traditional system of land tenure, which the Japanese exploited, has been abolished. The Soviets boast that one million hectares (2,471,000 .acres) of land have been distributed free of charge to the tenants. Banking, communications, and transportation, as well as heavy industry, are all controlled by the people's committees. In other words, all enterprises susceptible of immediate socialization have been taken over by the state. Private enterprise survives only among small producers, such as artisans and farmers. The Soviets also claim to have , instituted the eight-hour day for Korean workmen together with social insurance, and a guaranteed minimum wage. Child labor has been prohibited, and equal rights, both political and economic, have been given to women. ;\n\nKorean Reactions to the Soviet Program eee There is no doubt of the propaganda value of the Soviet program, especially in the US Zone.. Almost all Koreans are leftists by current US standards, and not even the conservative parties can be considered defenders of traditional Capitalism. The socialization of basic industries and the redistribution of land figure in the political platforms of every party in South Korea. Soviet policies might therefore be expected to have great popular appeal in Korea. Despite a lack of evidence, there are indications, however, that the Soviet program has not won the support of the people. Communism and Soviet ascendancy are in fact the main issues between the parties of the left and the right in South Korea, where freedom of expression prevails in spite of occasional and temporary restrictions on the press. The leftist parties in South Korea are in general sympathetic, while the rightist parties are opposed to the Soviet regime. The Koreans of the US Zone have thus a clear choice between the opponents and the supporters of the USSR. . It is therefore significant that every election held in the US Zone has given the rightist parties. a large majority. These results can be explained only by a strong aversion to Soviet Communism among Koreans south of the 38th parallel. The popular decision, however, is not taken in full knowledge of conditions in the Soviet Zone, and may. be the product of prejudice rather than of judgment.\n\nThe attitude of Koreans in the Soviet Zone is the only sure indication of the success of Soviet policy. But, aside from Soviet propaganda; almost no information is available on the state of public Opinion north of the boundary. Occasional rumors of resistance, such : ~ . Secrer and would gladly be rid of it. The alleged unpopularity of the Soviet regime, however, cannot be entirely ascribed to the misconduct of its troops. Excessive regimentation may also have produced a certain antagonism among the Koreans. . For example, the single-party system of politics is duplicated in the organization of labor. Union membership is compulsory in North Korea, and every union ig incorporated in the All Korea Labor Union under the direction of the Communist Party. Although the eight-hour day has been guaranteed by, law in the Soviet Zone, union members were recently required to contribute an extra hour of work each day to build up a fund for South Korean strikers.\n\nDiscontent probably exists in North Korea, as in other areas of Soviet control. At present, however, the Soviet regime north of the 58th parallel appears more firmly established than ever. The Moscow press has boasted that, in the elections of 3 November establishing permanent people's committees, 99.6% of the registered voters went to the polls in a great demonstration of loyalty to the existing government. In accordance with Soviet practice, the voters were not given the embarrassment of a choice, since all candidates figured on a Single Slate. The Soviets regard the results as a popular mandate to carry on their present system of government in North Korea.\n\nSituation in South Korea ore General. While Soviet discipline reigns north of the 38th parallel, South Korea is ina State of unrest. Factionalism and party Strife have recently culminated in a series of strikes and riots threattervention by US troops. The strike of railroad workers and printers at the end of September led to an outbreak of violence centering in the Southeastern provinces of Kyongsang Pukto and Kyongsang Namdo. According to official estimates, approximately 40 policemen and 40 rioters were killed in street fighting in the Taegu and Pusan areas at the beinning of October. Property losses totalled millions of yen, while arrests numbered 3,782. US troops were occasionally forced to fire into the mobs ‘during the course of these disturbances. Quiet was temporarily restored toward the middle of October, as the strikers gradually returned to work. A recrudescence of unrest set in, however, toward the end of the month, while the scene shifted from the southeast to the southwest and to the area about Seoul. An uprising in the capital, scheduled for 22 October, was prevented by timely action on the Part of the Military Government. The end of these. disorders is not yet a: -6- A eae in sight, and reports continue to come in of attempted assassination and sabotage. General Hodge has publicly accused the Communists of fomenting insurrection against the Military Government in order to break up the unification of the right and the left and block the establishment of a provisional legislature in South Korea. Soviet propaganda implicitly agrees with this interpretation by ascribing the agitation to popular discontent with the \"attempts of the American administration to manufacture: an ‘independent government' of southern Korea with reactionary elements.\"\n\nEconomic Situation. The basic cause of the current disorders in South Korea is perhaps less political than economic. Like other occupied areas, the US Zone in Korea suffers from scarcity and inflation. Communist leadership has only exploited the discontent aroused by want. The food situation in South Korea has been critical ever since last June when floods spoiled the summer grain crop. The free market in grain which the Military Government maintained last winter permitted a wasteful distribution of existing reserves of rice. Food controls were put into effect last March, too late to prevent a shortage. Having once been allowed to profiteer on the black market, the farmers have resisted the forced collection of grain at fixed prices. Only 36% of the barley ¢rop, which is the principal summer grain, had been collected by the government at the beginning of September. The fall harvest of rice, which was expected to relieve the acute food shortage in South Korea, is also coming in very slowly. Less than 1% of the’collection quota was met in October as against an anticipated 5%, and collections were still well behind schedule on 15 December.\n\nThe breakdown of transportation because of Strikes, floods, and wartime deterioration, has further complicated the distribution of available supplies in South Korea. Grain shipments from the US during August and September were 25% short of minimum requirements. Under these conditions the price of black market rice shas soared beyond the reach of the average consumer. As a palliative measure, the Military Government has tolerated a limited free movement of rice, in spite of previous announcements that controls would be rigidly enforced. While complaining of inflation, the Korean population is generally opposed to government collection and distribution of rice. The Korean police undertook to search incoming trains during September in order to seize black market rice. This procedure provoked a storm of protest, and was soon abandoned. Because it respects free speech, the US Military Government in Korea must take public opinion into account in all its policies, whatever the cost to efficiency.\n\nKorean resistance to the US occupation has been encouraged by the leniency of US policy. Economic discontent has been converted into political unrest by the opponents of the Military Government in South Korea who calculated on the toleration of the US authorities. The aot Ok : eer Seer current uprisings are not so much the product of Popular grievances as of uncertainty. The US has not imposed upon the Koreans the kind of government to which they had become accustomed under the Japanese. By attempting to hold the balance between rival factions, the Military Government has confused the public as to its intentions, and impartiality has been interpreted as irresolution.\n\nPolitical Situation. The US intends to educate the Koreans, not to indoctrinate them. The Military Government has accordingly perimmediate withdrawal of both US and Soviet troops. Foreign control is unpopular in both the US and the Soviet Zones. The moderates of both right and left in South Korea will nevertheless Support. the US Military Government as the alternative to Soviet domination. General Hodge has coalition of parties and in establishing a provisional legislature in the US Zone. South Korea would thus gain a measure of self-government pending the execution of the Moscow Decision. ‘fhe majority is prepared to support the US interim program, which has now advanced to the point of realization. The unification of the right and the left was announced early in October, and elections have been held to the provisional legis-~ lature which was convoked during December.\n\nSoviet Program for South Korea.\na Krell.\n\ntil after the Communist party had been split, and its most violent under Pak Heun Yung. After denouncing the provisional legislature as a Separatist government in South Korea, and as a revival of the advisory council of the Japanese, the Communists have apparently embarked on a campaign of terrorism against the occupation.\n\nAccording to General Hodge's informants, the Communists in the US Zone are planning a general revolt for this winter in concert with the Soviets in North Korea. There is no immediate evidence of Soviet complicity, except the parallel efforts of Soviet propaganda to stir up unrest against the US occupation. Soviet intervention through the agency of the Korean Communist Party may nevertheless be assumed and can be expected to increase if the current disorders lead to a general insurrection. After returning from a recent visit to the ° SeGRE—— Soviet Zone, a prominent leftist leader in South Korea declared that 10,000 Soviet agents have infiltrated across the border during the. past few months. Reliable reports indicate that a large Korean armed force, possibly numbering as many as 300,000 to 400,000 men, is being organized in the Soviet Zone. In case a revolt should break out which “US troops could not subdue, the Soviets might intervene indirectly in South Korea by.means of these Korean irregulars.\n\nGeneral Hodge has issued warnings of an impending invasion of the US Zone by Soviet-trained Koreans, and has accordingly requested that the US forces be brought up to T/O strength without delay. This invasion would probably take the form of mass infiltration, rather than of a regular military expedition. The Soviet army in North Korea, estimated at approximately 150,000, will presumably not cross the border, unless US troops should withdraw entirely from the peninsula.\n\nFuture Soviet Objectives and Probable Developments The USSR has a twofold policy for Korea, which applies to both the US and the Soviet Zones. Soviet policy in North Korea is directed at the establishment of a Communist-controlled regime oriented toward complete collaboration with the USSR. The recent election of a permnent people's committee in the Soviet Zone represents the achievement of this immediate objective. The long-range objective of the USSR is to integrate the entire peninsula in the Soviet system of Far Eastern defenses. Since the US occupation constitutes the chief obstacle to the accomplishment of this purpose, Soviet propaganda and Communist agitation have been directed toward driving the US out of Korea. The attack on the Military Government in South Korea, which has been. pressed continuously since the beginning of the occupation, has become intensified with the consolidation of Soviet authority in North Korea and the development of an interim US policy for the South.\n\nJoint Commission negotiations for the execution of the Moscow Decision are still deadlocked, while the Communists strive to prevent by violence the establishment of an interim government in the US Zone. Diplomacy by the USSR has apparently given way to direct action by the Communist Party in South Korea, although the possibility always remains that the USSR will resort to compromise if radical methods fail. The first Soviet overtures to réconvene the Joint Commission coincided with the success of the unification movement of the right and the left in South Korea and the declaration of the coalition committee in favor of an interim legislature. The prospect of agreement faded rapidly as the US determination to- pursue the democratic reorganization of South Korea became apparent. In the end the USSR rejected the formula which the Soviet Political Adviser in North Korea had worked out together with Minister Bunce as a basis for reconvening the Joint Commission. © -4—SPCRET There is therefore little prospect that the Moscow Decision may be carried out in the near future. Meanwhile, although the USSR gained the initial advantage by immediate sovietization of its zone, certain long-term advantages are on the side of the US. The large majority of Koreans in both zones are fervently opposed to domination = 10% - 2 SEGRET", "notes": ["[삭제·공개 표시] CIA HISTORICAL REVIEW PROGRAM — CIA 역사자료 검토 프로그램", "[삭제·공개 표시] RELEASE IN FULL — 전면 공개. 먹칠 없이 전부 공개한다는 표시다", "[삭제·공개 표시] SECRET — 본문 쪽마다 찍힌 비밀 등급 도장", "[삭제·공개 표시] Secrer — SECRET 이 스캔에서 뭉개진 것. 원문 그대로 둔다", "[삭제·공개 표시] SEGRET — SECRET 이 스캔에서 뭉개진 것. 원문 그대로 둔다", "[삭제·공개 표시] SPCRET — SECRET 이 스캔에서 뭉개진 것. 원문 그대로 둔다. 앞에 -4- 가 붙어 있다", "[삭제·공개 표시] PHS — 4, PHS SECRET 줄에 남은 표시", "[삭제·공개 표시] Copy No. _ § — 사본 번호 칸. 손으로 적힌 번호는 판독되지 않는다", "[삭제·공개 표시] 236095 35, a — 표지에 남은 등록 번호 계열의 숫자", "[삭제·공개 표시] -6- / -10- — 쪽 번호 도장"], "note": "이 한 건은 영문(en)을 손으로 교정하지 않았다. OCR 이 거의 깨끗해서 줄 끝 하이픈으로 잘린 낱말을 잇고 문단을 되돌리는 기계 처리만 했다(열람기/reflow.py). 뭉갠 글자는 원문 그대로 남아 있다. 원본 OCR 은 raw/N01.txt 에 있다.", "warn": false, "search": "Kim Il Sawng 김일성 — 중앙 인민위원회 지도자. 소련이 항일 저항의 영웅이자 스탈린을 본뜬 인민의 지도자로 선전한다고 적었다 Kim Doo Bong 김두봉 — 북조선노동당 우두머리. 김일성과 두 사람 집정 체제를 이룬다고 적었다 Pak Heun Yung 박헌영 — 갈라진 조선공산당의 가장 과격한 부분을 이끈다고 적었다 General Hodge 하지 장군 — 주조선 미군 사령관 Ambassador Pauley 폴리 대사 — 소련 지구 공업 지역의 60%를 시찰하고 반출된 설비가 사소한 품목뿐이라고 결론지었다 Minister Bunce 번스 공사 — 북조선의 소련 정치고문과 미소공동위원회 재개 방안을 마련했다 Stalin 스탈린 — 김일성 선전의 본보기로 언급된다 CIA HISTORICAL REVIEW PROGRAM — CIA 역사자료 검토 프로그램 RELEASE IN FULL — 전면 공개. 먹칠 없이 전부 공개한다는 표시다 SECRET — 본문 쪽마다 찍힌 비밀 등급 도장 Secrer — SECRET 이 스캔에서 뭉개진 것. 원문 그대로 둔다 SEGRET — SECRET 이 스캔에서 뭉개진 것. 원문 그대로 둔다 SPCRET — SECRET 이 스캔에서 뭉개진 것. 원문 그대로 둔다. 앞에 -4- 가 붙어 있다 PHS — 4, PHS SECRET 줄에 남은 표시 Copy No. _ § — 사본 번호 칸. 손으로 적힌 번호는 판독되지 않는다 236095 35, a — 표지에 남은 등록 번호 계열의 숫자 -6- / -10- — 쪽 번호 도장 THE SITUATION IN KOREA (ORE 5/1)"}, {"id": "N02", "order": 26, "date": "1947-01-14", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "경제 첩보: 북조선의 실업", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-01-14"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Economic Information: Unemployment in North Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r001200540009-4"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r001200540009-4"}], "summary": "북조선에 실업이 심하다. 당국이 노동자를 소련과 만주의 광산과 공장으로 내보내고 있고, 구호 단체가 그 알선을 맡고 있다는 한 쪽짜리 보고다.", "points": ["북조선 당국이 노동자에게 소련과 만주의 광산·공장에서 일하라고 권하고 있다.", "노동자 5천 명을 하얼빈 일대로 보냈다고 적었다. 문서에 찍힌 시점은 「1947년 5월」이나 배포일이 1947년 1월이다.", "북조선 구호회(Pak Cho Bén Ha Ho Hoe)가 실업자와 빈민을 맡으려고 세워졌다.", "구호회는 실제 구호는 거의 못 하고 소련과 만주의 일자리를 얻어 주는 일을 했다고 본다.", "노동력을 국경 밖으로 내보내는 것이 실업 대책이 되고 있다는 관찰이다."], "primary": "기밀(CONFIDENTIAL)\n\n25X1C    첩보보고(INTELLIGENCE REPORT)\n\n국가  조선(Korea)            일자:\n입수(INFO.)\n배포(DIST.)  1947년 1월\n면수  1\n보충(SUPPLEMENT)\n\n주제  경제 첩보: 북조선의 실업\n\n1. 북조선에는 심각한 실업 문제가 있다. 그 결과로 북조선 당국(North Korean authorities)은 북조선 노동자들에게 소련(USSR)과 만주(Manchuria)의 광산과 공장에서 일할 것을 권해 왔다. 1947년 5월 [원문 그대로]에 북조선 당국은 북조선 노동자 5,000명을 하얼빈(Harbin) 일대로 보냈다.\n\n2. 북조선의 실업자와 빈민을 돌보기 위하여 북조선 구호회(North Korean Relief Society, Pak Cho Bén Ha Ho Hoe [원문 그대로] [한자 판독 불가])가 설립되었다. 이 단체는 실효 있는 구호 사업은 별로 하지 못하였으나, 북조선 사람들을 위하여 소련과 만주에서 일자리를 얻어 주는 일은 해냈다.\n\n본 문서는 개정된 간첩법(Espionage Act, 50 U.S.C. 31조 및 32조)이 정한 뜻에서 미합중국의 국방에 관계되는 정보를 담고 있다. 이 문서를 전달하거나 그 내용을 어떠한 방법으로든 권한 없는 자에게 누설하는 것은 법으로 금지된다.\n\n문서번호 [판독 불가]\n등급 변경 없음(NO CHANGE in Class.) [판독 불가]\n비밀해제(DECLASSIFIED)\n등급 변경(Class. CHANGED TO): [판독 불가]\n근거(Auth): [판독 불가]\n일자(Date): [판독 불가]\n\n분류(CLASSIFICATION) [판독 불가]\n\n기밀(CONFIDENTIAL)\n\n공개 승인(Approved For Release) [판독 불가] 200540009-4", "secondary": "CONFIDENTIAL\n\n25X1C    INTELLIGENCE REPORT\n\nCOUNTRY  Korea            DATE:\nINFO.\nDIST.  January 1947\nPAGES  1\nSUPPLEMENT\n\nSUBJECT  Economic Information: Unemployment in North Korea\n\n1. There is a serious unemployment problem in North Korea. As a result, the North Korean authorities have been urging the North Korean laborers to work in mines and factories in the USSR and Manchuria. In May 1947 [원문 그대로], five thousand North Korean laborers were sent by the North Korean authorities to the Harbin area.\n\n2. To take care of the unemployed and destitute in North Korea the North Korean Relief Society (Pak Cho Bén Ha Ho Hoe [원문 그대로] [한자 판독 불가]) was established. It has not been able to do much effective relief work, but has managed to obtain employment in the USSR and Manchuria for North Koreans.\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nDocument No. [판독 불가]\nNO CHANGE in Class. [판독 불가]\nDECLASSIFIED\nClass. CHANGED TO: [판독 불가]\nAuth: [판독 불가]\nDate: [판독 불가]\n\nCLASSIFICATION [판독 불가]\n\nCONFIDENTIAL\n\nApproved For Release [판독 불가] 200540009-4", "notes": ["[삭제·공개 표시] 25X1C (INTELLIGENCE REPORT 줄 왼쪽 여백의 면제 표시)", "[삭제·공개 표시] Approved For Release [판독 불가] 200540009-4 (아래쪽 공개 승인 도장. 문서번호가 뭉개져 있다)", "[삭제·공개 표시] Document No. / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO / Auth / Date (등급 변경 도장. 채워 넣은 값이 모두 뭉개져 [판독 불가]로 옮겼다)"], "note": "한 쪽짜리 짧은 보고이고 본문 두 문단은 비교적 잘 읽힌다. 머리글은 심하게 뭉개져 `OWINTRY`(COUNTRY), `INTELLIGERCE`(INTELLIGENCE), `SMISJECT`(SUBJECT), `Eecononia Inforration`(Economic Information), `Zorth Korea`(North Korea) 로 읽었다. 1항의 시점은 `in May 1947` 로 찍혀 있다. 배포일이 1947년 1월이므로 앞뒤가 맞지 않으나 날짜의 숫자는 고치지 않고 그대로 두었다. 노동자 수 `Live thousand` 는 five thousand 로 읽었다. 여백에 `/7 /` 같은 손글씨 자국이 함께 찍혔으나 숫자가 아니라 표시로 보아 옮기지 않았다. 2항의 단체명은 `Pak Cho Bén Ha Ho Hoe` 로 찍혀 있고 뒤따르는 문자가 뭉개져 한자를 확정할 수 없다. 로마자를 고치지 않고 그대로 두었고 영문 표기 North Korean Relief Society 를 북조선 구호회로 옮겼다. 간첩법 조항 `50, U.S.C. Sl and 32` 의 `Sl` 은 같은 문서철 N06 에 실린 같은 문구가 `31 and 32` 로 찍혀 있어 31로 읽었다. 다른 숫자는 고치지 않았다.", "warn": false, "search": "25X1C (INTELLIGENCE REPORT 줄 왼쪽 여백의 면제 표시) Approved For Release [판독 불가] 200540009-4 (아래쪽 공개 승인 도장. 문서번호가 뭉개져 있다) Document No. / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO / Auth / Date (등급 변경 도장. 채워 넣은 값이 모두 뭉개져 [판독 불가]로 옮겼다) Economic Information: Unemployment in North Korea"}, {"id": "N03", "order": 27, "date": "1947-03-14", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "군사 첩보: 북조선 주둔 소련군 배치", "badge": "confidential (CONTROL, U.S. OFFICIALS ONLY)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-03-14"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Disposition of Soviet Forces in North Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000400230006-0"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000400230006-0"}], "summary": "북조선에 있는 소련군이 중부로 모이고 있다고 보고, 신의주·평양·사리원·원산 네 곳의 병종별 인원과 항공기 수를 적은 한 쪽짜리 표다.", "points": ["소련군이 북조선 중부에 집중하고 있다는 것이 첫 항의 판단이다.", "신의주에 기갑 300, 공병 500, 항공 1500, 특무부대 150, 기타 300, 항공기 296대를 적었다.", "평양(125-44, 39-01)에 군사령부 6350, 사단사령부 12000(공병과 포병이 반반), 항공기 150대(그중 120대가 전투기)를 적었다.", "사리원(12544, 38-30)에 사단사령부 12000(약 4800이 공병·포병 부대), 항공 243, 항공기 25대를 적었다.", "원산(127-26, 39-10)에 사단사령부 12900을 적었다. 다른 두 곳의 사단사령부 수치와 한 자리가 다르다.", "끝에 소련군 배치에 관한 앞선 보고들을 함께 보라는 주가 붙는다. 참조 번호는 먹칠되어 있다."], "primary": "취급 제한(CONTROL)\n미국 관리 전용(U.S. OFFICIALS ONLY)   25X1A\n\n기밀(CONFIDENTIAL)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n첩보보고(INTELLIGENCE REPORT)\n\n국가  조선(Korea)            일자:\n입수(INFO.)\n주제  군사 첩보: 북조선 주둔 소련군 배치\n배포(DIST.)  1947년 3월 14일\n면수  1\n25X1A\n보충(SUPPLEMENT)\n\n25X1   1. 소련군은 북조선 중부에 집중하고 있다.\n\n2. 신의주(Sinuiju) [판독 불가]에 다음이 있다.\n\n   기갑부대(Armored forces)           300\n   공병(Engineers)                    500\n   항공부대(Air forces)               1500\n   특무부대(Special Service Troops)    150\n   기타(Others)                       300\n25X1X  항공기 수(Number of planes)     296\n\n3. 평양(Pyongyang) (125-44, 39-01)에 다음이 있다.\n\n   군사령부(Army Headquarters)        6350\n   사단사령부(Division Headquarters) 12000 (공병과 포병에 똑같이 나뉘어 있다)\n   항공기 수                           150 (그 가운데 120대가 전투기다)\n\n4. 사리원(Sariwon) (12544, 38-30) [원문 그대로]에 다음이 있다.\n\n   사단사령부                        12000 (약 4800이 공병 및 포병 부대에 [판독 불가])\n   항공부대                            243\n   항공기 수                            25\n25X1X\n\n5. 원산(Wonsan) (127-26, 39-10)에 다음이 있다.\n\n   사단사령부                        12900\n\n주: 북조선의 소련군 배치에 관한 앞선 보고들은 [삭제]를 보라.\n\n기밀(CONFIDENTIAL)\n\n분류(CLASSIFICATION)\n\n[이 배포처 목록은] 본 문서를 공개하기 전에 삭제하여야 한다 [판독 불가]\n\n문서번호 [판독 불가]\n등급 변경 없음(NO CHANGE in Class.) [판독 불가]\n비밀해제(DECLASSIFIED)\n등급(Class.) [판독 불가]\n근거(Auth): [판독 불가]\n일자(Date): [판독 불가]\n\n공개 승인(Approved For Release) 2001/03/17 : CIA-RDP82- [판독 불가]", "secondary": "CONTROL\nU.S. OFFICIALS ONLY   25X1A\n\nCONFIDENTIAL\n\nCENTRAL INTELLIGENCE GROUP\nINTELLIGENCE REPORT\n\nCOUNTRY  Korea            DATE:\nINFO.\nSUBJECT  Military Information: Disposition of Soviet Forces in North Korea\nDIST.  14 March 1947\nPAGES  1\n25X1A\nSUPPLEMENT\n\n25X1   1. Soviet forces are concentrating in the central part of North Korea.\n\n2. The following are at Sinuiju [판독 불가]:\n\n   Armored forces           300\n   Engineers                500\n   Air forces              1500\n   Special Service Troops   150\n   Others                   300\n25X1X  Number of planes     296\n\n3. The following are at Pyongyang (125-44, 39-01):\n\n   Army Headquarters       6350\n   Division Headquarters  12000 (equally divided between engineer and artillery)\n   Number of planes         150 (of which 120 are fighters)\n\n4. The following are at Sariwon (12544, 38-30) [원문 그대로]:\n\n   Division Headquarters  12000 (approximately 4800 [판독 불가] to engineer and artillery units)\n   Air forces               243\n   Number of planes          25\n25X1X\n\n5. The following are at Wonsan (127-26, 39-10):\n\n   Division Headquarters  12900\n\nNote: See [삭제] for previous reports on Soviet dispositions in North Korea.\n\nCONFIDENTIAL\n\nCLASSIFICATION\n\n[THIS DISTRIBUTION LISTING MUST BE EX]CISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT [판독 불가]\n\nDocument No. [판독 불가]\nNO CHANGE in Class. [판독 불가]\nDECLASSIFIED\nClass. [판독 불가]\nAuth: [판독 불가]\nDate: [판독 불가]\n\npapier zen: Release 2001/03/17 : CIA-RDP82- [판독 불가]", "notes": ["[삭제·공개 표시] 25X1A (머리글 U.S. OFFICIALS ONLY 줄과 PAGES 줄 옆의 면제 표시)", "[삭제·공개 표시] 25X1 (1항 왼쪽 여백)", "[삭제·공개 표시] 25X1X (2항 항공기 줄과 5항 앞의 면제 표시)", "[삭제·공개 표시] Note 줄의 참조 보고 번호가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] papier zen: Release 2001/03/17 : CIA-RDP82- [판독 불가] (첫 줄의 공개 승인 도장. Approved For Release 가 뭉개진 것이다)", "[삭제·공개 표시] THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT (배포처 목록 삭제 지시)"], "note": "표가 중심인 한 쪽짜리 보고다. 병력 수와 항공기 수는 한 자리도 고치지 않았다. 좌표도 그대로 두었다. 사리원의 `(12544, 38~30)` 은 경도에 붙임표가 빠져 125-44 로 보이나 고치지 않고 원문대로 옮겼다. 평양의 좌표가 같은 125-44 인 것이 눈에 띄나 판단하지 않았다. 신의주 뒤에 붙었을 좌표는 `ty. BON` 으로 찍혀 읽을 수 없어 [판독 불가]로 두었다. 4항의 `4800 corre to engineer and artillery units` 에서 `corre` 는 corresponding 또는 correspond 로 보이나 확정되지 않아 [판독 불가]로 두었다. 5항 원산의 사단사령부는 `12900` 으로 찍혀 있다. 평양·사리원의 `12000` 과 한 자리가 다르나 고치지 않았다. 2항 기타 항목 옆의 `/\"? 7` 은 여백의 손글씨 자국으로 보아 옮기지 않았다. 머리글의 `SOUNTRY`(COUNTRY), `Soformation`(Information), `Nortl: Korea`(North Korea), `Headgnarters`(Headquarters), `Troo>s`(Troops), `>lanes`(planes) 로 읽었다. 문서 번호 도장의 채워 넣은 값은 모두 뭉개져 있다.", "warn": false, "search": "25X1A (머리글 U.S. OFFICIALS ONLY 줄과 PAGES 줄 옆의 면제 표시) 25X1 (1항 왼쪽 여백) 25X1X (2항 항공기 줄과 5항 앞의 면제 표시) Note 줄의 참조 보고 번호가 먹칠되어 [삭제]로 옮겼다 papier zen: Release 2001/03/17 : CIA-RDP82- [판독 불가] (첫 줄의 공개 승인 도장. Approved For Release 가 뭉개진 것이다) THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT (배포처 목록 삭제 지시) Military Information: Disposition of Soviet Forces in North Korea"}, {"id": "N04", "order": 28, "date": "1947-03-28", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "군사 첩보: 조선인 공산군", "badge": "confidential (CONTROL, U.S. OFFICIALS ONLY)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-03-28"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Korean Communist Troops", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000400640001-0"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000400640001-0"}], "summary": "압록강과 두만강 양안에 약 10만의 조선인 공산군이 있고 KIM Il-sung 이 이끈다고 본 보고다. 소련이 무기와 감독관을 대고, 창구펑에 중국·소련·조선 합동 사령부를 두었다고 적었다.", "points": ["압록강 양안 산악지대에 조선인 공산군 약 100,000명이 있고 삭주(Sakchu)에서 종성(Chongsong)까지 걸쳐 있다고 적었다.", "KIM Il-sung 을 십 년 동안 일본과 싸운 옛 공산당 지도자로 소개하고, 모스크바의 대학에서 LI Li-san 과 동기였다고 적었다.", "KIM 에 관한 앞선 보고들을 모아 놓았다. 옌지 일대 책임자, 소련군 대령, 유럽에서도 싸웠다, 조선의용군(전 조선경비군) 지휘, 북조선 임시인민위원회 위원장, 북조선노동당 중앙위원회 수반이라는 것이다.", "부대에 중국인 공산당원과 소련인 기술자가 소수 섞여 있고 소련인 군사·정치 감독관 약 100명이 있다고 적었다.", "일본 항복 전부터 가지고 있던 무기에 더해 소련이 노획 일본 장비를 넘겼고 모자란 것은 소련이 채웠다고 적었다.", "중국·소련·조선 군사 연합체가 압록강과 두만강 연안을 통제한다고 보고, 삭주의 삼림지대를 기점으로 창구펑(Changkufeng)을 중심 기지로 삼는다고 적었다.", "창구펑에 조선인민연합임시정부(Korean People's United Temporary Government)가 있고 1946년 9월 그곳에서 중국·조선·소련 대표가 참석한 군사회의가 열렸다고 적었다."], "primary": "25X1A2g\n\n취급 제한(CONTROL)\n[미국] 관리 전용(OFFICIALS ONLY)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가  조선(Korea)\n주제  군사 첩보: 조선인 공산군(Korean Communist Troops)\n일자:\n입수(INFO.)\n배포(DIST.)\n면수\n보충(SUPPLEMENT)\n\n본 문서는 1978년 10월 16일 중앙정보국장이 미합중국 기록관리관에게 보낸 서한에 따라 기밀(CONFIDENTIAL)로 재분류된다.\n\n다음 재검토일: 2008년\n\n등급 변경 없음(NO CHANGE in Class.) [판독 불가]\n\n1. 약 100,000명 [판독 불가]의 조선인 공산군이 [판독 불가] 아래 [판독 불가] 산악 [판독 불가]에 있으며, [판독 불가]의 양안을 따라 삭주(Sakchu 朔州, 일본식 Sakushu) (225-01 [원문 그대로], [판독 불가])에서 종성(Chongsong 鍾城, 일본식 Shorei) (12918 [원문 그대로], [판독 불가])까지 이른다.\n\n2. [판독 불가]는 옛 공산당 [판독 불가] 지도자로, [판독 불가] 십 년 동안 일본과 싸웠으며, 그 무대는 삼각주 지역(Tunepientse [판독 불가]) [판독 불가], 무크덴(Mukden 봉천), 린장(Linchiang 臨江) (126-55, 41-50), 안둥(Antung 安東) [판독 불가]이었다.\n\n3. [판독 불가] 모스크바의 「소련 [판독 불가] 대학」 출신이며, 그곳에서 중국공산당 지도자 [판독 불가] 및 LI Li-san 리리싼([한자 판독 불가])과 동기였다. [판독 불가]. 유의할 것은 [판독 불가] 조선 [판독 불가], KIM 에 관하여 앞서 보고된 대로 [판독 불가] 옌지(Yenchi 延吉) ([판독 불가]) [판독 불가] 일대에서 그가 책임자라는 것, [판독 불가] 소련군 대령이라는 것, 유럽에서도 싸웠다는 것, [판독 불가]로 알려져 있다는 것, 조선의용군(Korean Volunteers Army, 전에는 조선경비군 Korean Policing Army 라 불렸다)의 지휘자이며 그 병력이 [판독 불가] 100,000명이라는 것, [판독 불가] 그리고 그가 북조선 임시인민위원회(Northern Korea Provisional People's Committee) 위원장이며 북조선노동당(North Korean Labor Party) 중앙위원회의 수반이라는 것이다.\n\n4. [판독 불가] 통제 구역은 [판독 불가] 삭주에서 [판독 불가] 삭주(Sakushu) [판독 불가], 신의주(Sinuiju 新義州, 일본식 Shingishu) [판독 불가], [판독 불가]deng [판독 불가] (Vol 8, 36020 [원문 그대로]) [판독 불가] (128438 [원문 그대로], [판독 불가]) [판독 불가] 강이며, 그 다음 [판독 불가] 갑산(Kapsan 甲山, 일본식 Kozan) [판독 불가], 혜산(Hyesan 惠山) [판독 불가], 회령(Hoeryong 會寧, 일본식 Kainei) [판독 불가], 무산(Musan 茂山) [판독 불가] (129-10 [판독 불가]), 종성(Chongsong, 일본식 Shojo) (129945 [원문 그대로], M2215 [원문 그대로]) [판독 불가] 두만강 우안까지 뻗는다. KIM 의 부대는 [판독 불가] 좌안의 중국공산군과 [판독 불가] Chang[판독 불가]에서 [판독 불가] 중국 국민당군 [판독 불가] 압록강 가의 린장(126-55, 41-50) [판독 불가], 그리고 [판독 불가] (1266 [원문 그대로] [판독 불가]) [판독 불가] 두만강 좌안의 [판독 불가] (229-50 [원문 그대로], 1:2-57 [원문 그대로])와 훈춘(Hunchun 琿春) [판독 불가] 중국공산군과 국민당군 사이의 [판독 불가]에서의 전투 [판독 불가] 공산군 [판독 불가] 콴뎬(Kuantien 寬甸) (126- [판독 불가]) [판독 불가]. 알려진 바로는 [판독 불가] 조선인 공산군이 [판독 불가] 아래 [판독 불가] 국민당군 [판독 불가] 보충병 [판독 불가] 몰래 (압록강?) [원문 그대로]을 건너 초산(Chosan 楚山, 일본식 Sozan) [판독 불가]에 주둔하였고, 콴뎬 [판독 불가]의 [판독 불가], 중국 [공산군]이 제25사단을 섬멸하는 것을 도왔다 [판독 불가] 강 [판독 불가] 어귀에서 [판독 불가] 콴뎬 [판독 불가] (상하이 주: [판독 불가] 이 사단은 [판독 불가] 국민당군의 10월 [판독 불가] 안둥 공세 [판독 불가]로 짐작된다. 그 사단은 [판독 불가] 동안 [판독 불가] 손실을 입었다 [판독 불가] 병력).\n\n25X1A2g\n\n[삭제]\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n공개 승인(Approved For Release) 1999/09/08 : CIA-RDP82-00457R00040[판독 불가]\n\n지금의 자리에서 KIM 은 해당 구역을 통제하는 일에 관하여 소련공산당 중앙당(Central Party of the Soviet Union)의 지시와 감독을 받는다. 그의 군대에는 소수의 중국인 공산당원과 소련인 기술자, 그리고 약 100명의 소련인 군사·정치 감독관이 들어 있다. 통제력을 강화하기 위하여 소련은 KIM 아래의 조선인 공산군을 키우려고 다량의 무기와 물자를 대 주었다.\n\n(상하이 주: 조선경비군(Korean Policing Army), 곧 조선의용군(Korean Volunteers Army)은 소련이 만주로 들어올 때 소련의 명령으로 비상군으로 만들어진 것이라고 앞서 보고된 바 있다.)\n\n이 조선인 공산군이 일본 패전 전부터 가지고 있던 무기에 더하여, 소련은 노획한 일본 장비를 많이 넘겨 주었다. 그러고 나서 모자란 것은 소련이 채워 주었다.\n\n압록강과 두만강 연안 구역을 통제하는 중국·소련·조선 군사 연합체(military bloc)가 만들어졌다. 극동에서 전략 요지를 장악한다는 목표를 이루기 위하여 이 연합은 삭주의 울창한 삼림지대를 기점으로 삼고, 중국·소련·조선의 공산 세력이 통제하는 삼각주 지역의 창구펑(Changkufeng 張鼓峰) (240225 [원문 그대로], [판독 불가])을 중심 기지로 쓰고 있다. 창구펑에는 중국·소련·조선 합동 사령부가 세워졌으며, 이곳이 지금 조선인민연합임시정부(Korean People's United Temporary Government)의 소재지다. ([워싱턴] 주: 이 지역의 조선인에 관한 앞선 보고는 [삭제]를 보라.)\n\n196[판독 불가]년 [원문 그대로] 9월 창구펑에서 군사회의가 열렸고 중국인, 조선인, 소련인이 참석하였다. 소련 대표는 북조선 주둔 소련군 사령부 참모차장 KOU Nao-k'ou-fu 장군([한자 판독 불가])이었다. 중국공산당 대표는 LI Li-san 리리싼이었고, 조선인 공산당 대표는 KIM Il-sung 이었다.\n\n(상하이 주: 소식통에 따르면 196[판독 불가]년 [원문 그대로] 12월 하순에 창구펑에서 또 한 번 군사회의가 열릴 예정이었다. 이 회의에 관하여 더 들어온 정보는 없다.)\n\n[판독 불가] 취급 제한(CONTROL)   미국 관리 전용(U.S. OFFICIALS ONLY)\n\n공개 승인(Approved For Release) 1999/09/08 : CIA-RDP82-00457R000400640001-0", "secondary": "25X1A2g\n\nCONTROL\n[U.S.] OFFICIALS ONLY\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCOUNTRY  Korea\nSUBJECT  Military Information: Korean Communist Troops\nDATE:\nINFO.\nDIST.\nPAGES\nSUPPLEMENT\n\nThis document is hereby regraded to CONFIDENTIAL in accordance with the letter of 16 October 1978 from the Director of Central Intelligence to the Archivist of the United States.\n\nNext Review Date: 2008\n\nNO CHANGE in [Class.] [판독 불가]\n\n1. There are approximately 100,000 [판독 불가] Korean Communist troops under [판독 불가] in the mountainous [판독 불가] along both banks of the [판독 불가] from Sakchu (Sakushu) (225-01 [원문 그대로], [판독 불가]) to Chongsong (Shorei) (12918 [원문 그대로], [판독 불가]).\n\n2. [판독 불가] is the former Communist [판독 불가] leader [판독 불가] who [판독 불가] fought the Japanese for ten years in the delta area (Tunepientse [판독 불가]) [판독 불가] of Mukden, Linchiang (126-55, 41-50) and Antung [판독 불가].\n\n3. [판독 불가] a graduate of the [판독 불가] \"Soviet [판독 불가] University\" in Moscow, where he was a classmate of Chinese Communist leaders [판독 불가] and LI Li-san ([한자 판독 불가]), which [판독 불가]. It should be noted [판독 불가] Korean [판독 불가] as previously reported of KIM [판독 불가] in the Yenchi ([판독 불가]) [판독 불가] areas; that he is the chief [판독 불가]; that he is [판독 불가] a Colonel in the Soviet Army; that he fought in Europe as well; that he is reputed [판독 불가]; that he is director of the Korean Volunteers Army, formerly [called the Korean] Policing Army, which is [판독 불가] 100,000 strong; [판독 불가] and that he is chairman of the Northern Korea Provisional People's Committee, and head of the Central Committee of the [North] Korean Labor Party.\n\n4. [판독 불가] area of control [판독 불가] at Sakchu [판독 불가] to Sakchu (Sakushu) [판독 불가], Sinuiju (Shingishu) [판독 불가], [판독 불가]deng [판독 불가] (Vol 8, 36020 [원문 그대로]) [판독 불가] (128438 [원문 그대로], [판독 불가]) [판독 불가] river, and then [판독 불가] extends to Kapsan (Kozan) [판독 불가], Hyesan [판독 불가], Hoeryong (Kainei) [판독 불가], Musan [판독 불가] (129-10 [판독 불가]), Chongsong (Shojo) (129945 [원문 그대로], M2215 [원문 그대로]) [판독 불가] right bank of the Tumen river. KIM's troops [판독 불가] with the Chinese Communists on the left bank [판독 불가] at Chang[판독 불가] [판독 불가] the Chinese Nationalists [판독 불가] Linchiang (126-55, 41-50) on the Yalu [판독 불가], and with the [판독 불가] (1266 [원문 그대로] [판독 불가]) [판독 불가] on the left bank of the Tumen [판독 불가] (229-50 [원문 그대로], 1:2-57 [원문 그대로]) and Hunchun [판독 불가] a battle at [판독 불가] between Chinese Communists and Nationalist forces [판독 불가] Communists [판독 불가] Kuantien (126- [판독 불가]) [판독 불가]. It has been learned that [판독 불가] Korean Communist troops, under [판독 불가] the Nationalists [판독 불가] replacements [판독 불가] secretly crossed the (Yalu?) [원문 그대로] and stationed at Chosan (Sozan) [판독 불가] of the Kuantien [판독 불가] and helped the Chinese [Communists] wipe out the 25th Division [판독 불가] of the [river] at the mouth [판독 불가] of Kuantien [판독 불가] (Shanghai note: [판독 불가] it is presumed that this division [판독 불가] the Nationalists' October [판독 불가] drive on Antung. The division [판독 불가] suffered [판독 불가] losses during [판독 불가] strengths).\n\n25X1A2g\n\n[삭제]\n\nCENTRAL INTELLIGENCE GROUP\nApproved For Release 1999/09/08 : CIA-RDP82-00457R00040[판독 불가]\n\nIn his present position, KIM is instructed and supervised by the Central Party of the Soviet Union in controlling the areas. Included in his army is a small number of Chinese Communists and Soviet technicians and about 100 Soviet military and political supervisors. In order to strengthen their controlling influence, the Soviets have furnished large quantities of arms and material, to develop the Korean Communist army under KIM.\n\n(Shanghai note: It has been previously reported that the Korean Policing Army, or Korean Volunteers Army, is said to have been created by Soviet order as an emergency army at the time the Soviets entered Manchuria.)\n\nIn addition to the weapons these Korean Communists had before the defeat of Japan, the Soviets have given them much surrendered Japanese equipment. After this was done, deficiencies were made up by the Soviets.\n\nA Chinese-Soviet-Korean military bloc has been created which controls the areas along the Yalu and Tiumen rivers. To attain their goal of controlling strategic positions in the Far East, this combination is utilizing the densely wooded area of Sakchu as a starting point and Changkufeng (240225 [원문 그대로], [판독 불가]) in the delta area controlled by the Chinese, Soviet and Korean Communists, as the central base. A Chinese-Soviet-Korean headquarters has been established at Changkufeng, present seat of the Korean People's United Temporary Government ([Washington's] Note: See [삭제] for previous report on Koreans in this area).\n\nIn September 196[판독 불가] [원문 그대로] a military conference was held at Changkufeng which [was] attended by Chinese, Koreans, and Soviets. The Soviet representative was General KOU Nao-k'ou-fu ([한자 판독 불가]), Assistant Chief of Staff of the Soviet Army Headquarters in North Korea; the Chinese Communist representative was LI Li-san; and the Korean Communist representative was KIM Il-sung.\n\n(Shanghai note: According to sources, another military conference was to have been held in the latter part of December 196[판독 불가] [원문 그대로] in Changkufeng. There has been no further information on this meeting.)\n\n[판독 불가] CONTROL   U.S. OFFICIALS ONLY\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R000400640001-0", "notes": ["[삭제·공개 표시] 25X1A2g (첫 면 머리와 첫 면 아래 여백 두 곳)", "[삭제·공개 표시] Approved For Release 1999/09/08 : CIA-RDP82-00457R00040[판독 불가] (둘째 면 머리의 공개 승인 도장)", "[삭제·공개 표시] Approved For Release 1999/09/08 : CIA-RDP82-00457R000400640001-0 (마지막 줄의 공개 승인 도장)", "[삭제·공개 표시] This document is hereby regraded to CONFIDENTIAL in accordance with the letter of 16 October 1978 from the Director of Central Intelligence to the Archivist of the United States. Next Review Date: 2008 (재분류 도장)", "[삭제·공개 표시] NO CHANGE in Class. (등급 변경 도장. 채워 넣은 값이 뭉개져 있다)", "[삭제·공개 표시] 창구펑 문단의 워싱턴 주에서 앞선 보고의 참조 번호가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] 둘째 면 머리 위쪽의 한 줄이 먹칠되어 [삭제]로 옮겼다"], "note": "이 계열에서 OCR 품질이 가장 나쁜 문서다. 첫 면 본문 1항부터 4항까지는 글자가 겹쳐 찍히고 줄이 어긋나 문장의 절반 이상을 읽을 수 없다. 읽히는 낱말만 원문 줄 차례대로 옮기고 나머지는 [판독 불가]로 두었다. 끊긴 대목을 문맥으로 메우지 않았다. 반면 둘째 면은 비교적 깨끗하여 거의 온전히 옮겼다. 좌표는 한 자리도 고치지 않았다. 삭주의 `(225-01 i024)` 는 경도 225도로 성립하지 않는 값이고, 종성의 `(12918 9 lyPeal 5 )` 와 `(129945 M2215)`, 두만강 좌안의 `(229-50, 1:2-57)`, 창구펑의 `(240225 eons )`, 콴뎬의 `(126- )` 는 모두 깨져 있다. 린장의 `(126-55, 41-50)` 만 성립하는 값이다. 4항에 `Vol 8, 36020` `(128438 pbceths)` 처럼 좌표인지 다른 숫자인지 가릴 수 없는 덩어리가 있어 원문 그대로 두었다. 회의 연도는 `September 196)` 과 `latier pert of hecerber 196` 으로 찍혀 끝자리가 잘렸다. 1946년으로 보이나 날짜의 숫자는 채우지 않았다. 인명 표기는 원문대로 두었다. 소련 대표는 `General KOU Nao Ktou FU` 로 찍혀 KOU Nao-k'ou-fu 로 읽었고 뒤따르는 한자는 뭉개져 있다. 중국공산당 지도자는 `LY Liesan` `1] Li~gan` `Li-gan` 으로 세 번 달리 찍혀 LI Li-san 으로 읽었다. `KIN Ll-esung` `FYM` `EIN llesung` 은 모두 KIM Il-sung 이다. `Changkufeng` 은 두만강 하구의 장고봉(張鼓峰)이다. 1938년 소련과 일본이 부딪친 곳이고 이 보고는 그곳에 조선인민연합임시정부가 있다고 적었다. 기관 이름은 원문 표기를 앞세웠다. `Korean Policing Army` 를 조선경비군으로, `Korean Volunteers Army` 를 조선의용군으로 옮겼다. 이 문서는 두 이름을 같은 부대의 옛 이름과 새 이름으로 적고 있다.", "warn": true, "search": "KIM Il-sung 김일성 (조선인 공산군 지휘자로 적혔다. 북조선 임시인민위원회 위원장, 북조선노동당 중앙위원회 수반) LI Li-san 리리싼(李立三) (중국공산당 지도자. 모스크바에서 KIM 과 동기였다고 적혔고 창구펑 회의의 중국공산당 대표로 나온다) KOU Nao-k'ou-fu (북조선 주둔 소련군 사령부 참모차장. 러시아인 이름의 중국식 음역으로 보인다) 25X1A2g (첫 면 머리와 첫 면 아래 여백 두 곳) Approved For Release 1999/09/08 : CIA-RDP82-00457R00040[판독 불가] (둘째 면 머리의 공개 승인 도장) Approved For Release 1999/09/08 : CIA-RDP82-00457R000400640001-0 (마지막 줄의 공개 승인 도장) This document is hereby regraded to CONFIDENTIAL in accordance with the letter of 16 October 1978 from the Director of Central Intelligence to the Archivist of the United States. Next Review Date: 2008 (재분류 도장) NO CHANGE in Class. (등급 변경 도장. 채워 넣은 값이 뭉개져 있다) 창구펑 문단의 워싱턴 주에서 앞선 보고의 참조 번호가 먹칠되어 [삭제]로 옮겼다 둘째 면 머리 위쪽의 한 줄이 먹칠되어 [삭제]로 옮겼다 Military Information: Korean Communist Troops"}, {"id": "N05", "order": 29, "date": "1947-04-07", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "정치 첩보: 북조선노동당", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-04-07"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Political Information: Northern Korea Labor Party", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000500010006-3"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000500010006-3"}], "summary": "북조선에서 가장 힘이 센 당이 노동당이라고 보고, 그 조직 얼개와 도별 당 본부 소재지, 주요 인물 넷을 적은 두 쪽짜리 보고다.", "points": ["노동당(Labor Party)과 노동조합(Labor Association)을 구별해야 한다고 못박는다. 조합은 당이 통제하는 여러 조직 가운데 하나다.", "북조선의 모든 노동자는 임금 총액의 4퍼센트를 내고 노동조합에 들어야 한다. 당원 자격은 더 제한되어 있다고 본다.", "당원이 북조선 임시인민위원회의 힘을 대부분 쥐고 있다고 적었다.", "도마다 중앙 조직을 두고 그것을 통해 군·구·리의 단위를 통제한다. 큰 도시는 따로 당 조직을 둔다.", "도별 당 본부 소재지를 다섯 곳 적었다. 평안남도는 평양(125-44,39-01), 평안북도는 신의주(124-24, 40-06), 황해도는 해주(125-42,38-02)다.", "주요 인물로 Kim Kwae-Bong(당 책임자), Kim Il-Sung(중앙위원회 위원장), Kim Tyang(집행위원회 책임자), Kang Nyang-Ok 을 들었다.", "중앙위원회는 약 20명과 서기국으로 이루어지고 그 아래 집행위원회가 있다. 총무·조직·선전·문화·농민노동·청년·부녀 부서를 둔다."], "primary": "기밀(CONFIDENTIAL)   25X1\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가  조선(Korea)            일자:  25X1\n입수(INFO.)\n주제  정치 첩보: 북조선노동당(Northern Korea Labor Party)\n배포(DIST.)  1947년 4월 7일\n면수  2\n25X1\n출처(ORIGIN)\n보충(SUPPLEMENT)\n\n배포처(DISTRIBUTION)\n국무부 | 육군부 | 해군부 | 공군 | 법무부 | [판독 불가]\n\n[삭제] 1. 북조선에서 가장 중요한 당은 노동당(Labor Party, [한자 판독 불가])이다. 이것은 노동조합(Labor Association, [한자 판독 불가])과 구별하여야 한다. 조합은 25X1 북조선노동당이 통제하는 여러 조직 가운데 하나일 뿐이다.\n\n[삭제] 북조선의 모든 노동자는 임금 총액의 4퍼센트를 납부함으로써 노동조합에 가입하여야 한다. 노동당의 당원 자격은 25X1 그보다 제한되어 있다고 본다. 입당 방법은 알려져 있지 않다.\n\n25X1 2. 노동당원들이 북조선 임시인민위원회(Northern Korean 25X1 Provisional People's Committee) [삭제]에서 권력의 대부분을 쥐고 있다. 당은 도마다 중앙 조직을 두고, 그것을 통하여 25X1 각 군(county), 구(district), 리(village)의 단위를 통제한다. 큰 도시들은 따로 노동당 조직을 둔다. 25X1 도·군·구·시의 당 조직은 중앙위원회(Central Committee)와 같은 얼개를 따른다. 25X1 시의 당 조직은 도 노동당의 통제를 받는 대신 중앙위원회의 직접 통제를 받을 수도 있다. 그런 경우에도 도 노동당은 시 노동당에 대하여 어느 정도 간접적인 통제를 유지한다. 도·군·구마다 노동조합(Labor Associations), 농민조합(Farmers' Associations), 소비조합(Consumers' Associations)이 있다. 공장 노동자와 사무 노동자는 세포제(cellular system) 조직을 쓴다.\n\n25X1\n\n[삭제] 3. 다음 도들의 당 본부는 아래와 같다.\n\n   도                                        소재 도시\n   가. 평안남도(Pyongan-Namdo, [판독 불가])      평양(Pyongyang, 일본식 Heijo) (125-44,39-01)\n   나. 평안북도(Pyongan-Pukto, Heian-Hokudo)  신의주(Sinuiju, 일본식 Shingishu) (124-24, 40-06)\n   다. 함경남도(Hamgyong-Namdo, Kanko-Nando)  [판독 불가] (127-32,39-54)\n   라. 함경북도(Hamgyong-Pukto, Kanko-Hokudo) [판독 불가] (Ranan 나남) (129-4,1,41-42) [원문 그대로]\n   마. 황해도(Hwanghai-Do, Kokai-Do)          해주(Haeju, 일본식 Kaishu) (125-42,38-02)\n\n경고: 이 배포처 목록은 본 문서를 공개하기 전에 삭제하여야 한다.\n기밀(CONFIDENTIAL)   비밀해제 조치는 뒷면을 보라\n\n25X1\n\n공개 승인(Approved For Release) 2005/12/16 : CIA-RDP82-00457R000500010006-3\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n공개 승인(Approved For Release) 2005/12/16 : CIA-RDP82-00457R000500010006-3\n\n기밀(CONFIDENTIAL)\n\n25X1  4. 당의 주요 인물로는 다음이 있다.\n\n   가. Kim Kwae-Bong([한자 판독 불가])은 [삭제] 당의 책임자(director)로, 또 Kim Il-Sung 이 이끄는 당 중앙위원회 소속 건국회의부(Conference Office of the Foundation of State)의 일원으로 보고된다.\n\n   나. Kim Il-Sung 은 [삭제] 중앙위원회 위원장(chairman)으로 보고된다.\n\n   다. Kim Tyang([한자 판독 불가])은 [삭제] 집행위원회(Executive 25X1 Council)의 책임자이며 건국회의부의 일원으로 보고된다.\n\n   라. Kang Nyang-Ok([한자 판독 불가])은 [삭제] 건국회의부의 일원으로 보고된다.\n\n5. [삭제] 당은 약 20명으로 이루어진 중앙위원회와 서기국(Secretariat)이 이끈다. 중앙위원회 아래에 집행위원회가 있다. [삭제] 중앙위원회에 직접 책임을 지는 부서는 다음과 같다. 총무(General Affairs), 조직(Organization), 선전(Propaganda), 문화(Cultural), 농민노동(Farmer-Labor), 청년(Young Men's) 및 부녀(Women's) [판독 불가] 문화부와 농민노동부를 뺀 같은 부서들 [판독 불가]. 노동조합, 농민조합, 소비조합은 중앙위원회의 직접 통제 아래 있다.\n\n기밀(CONFIDENTIAL)\n\n공개 승인(Approved For Release) 2005/12/16 : CIA-RDP82-00457R000500010006-3", "secondary": "CONFIDENTIAL   25X1\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCOUNTRY  Korea            DATE:  25X1\nINFO.\nSUBJECT  Political Information: Northern Korea Labor Party\nDIST.  7 April 1947\nPAGES  2\n25X1\nORIGIN\nSUPPLEMENT\n\nDISTRIBUTION\nSTATE | WAR | NAVY | AIR | JUSTICE | [판독 불가]\n\n[삭제] 1. The most important party in North Korea is the Labor Party ([한자 판독 불가]). This should be distinguished from the Labor Association ([한자 판독 불가]) which is 25X1 only one of the organizations controlled by the Northern [Korea Labor] Party.\n\n[삭제] Every laborer in North Korea must join the Labor Association by remitting four per cent of his total wages. Membership in the Labor Party is 25X1 believed to be more limited. Method of admission is unknown.\n\n25X1 2. Members of the Labor Party wield most of the power in the Northern Korean 25X1 Provisional People's Committee [삭제]. The Party maintains a central organization in each province through which it controls its units in each 25X1 county, district and village. Large cities have separate Labor Party organizations. 25X1 The Party organization in each province, county, district, and city follows the same plan as that of the Central Committee. The Party 25X1 organization in a city may be controlled directly by the Central Committee instead of being controlled by the Provincial Labor Party. If this is the case, the Provincial Labor Party maintains some amount of indirect control over the City Labor Parties. There are Labor Associations, Farmers' Associations, and Consumers' Associations in each province, county and district. Factory and office workers use the cellular system of organization.\n\n25X1\n\n[삭제] 3. Party Headquarters for the following provinces are listed below.\n\n   Province                                City\n   a. Pyongan-Namdo ([판독 불가])            Pyongyang (Heijo) (125-44,39-01)\n   b. Pyongan-Pukto (Heian-Hokudo)         Sinuiju (Shingishu) (124-24, 40-06)\n   c. Hamgyong-Namdo (Kanko-Nando)         [판독 불가] (127-32,39-54)\n   d. Hamgyong-Pukto (Kanko-Hokudo)        [판독 불가] (Ranan) (129-4,1,41-42) [원문 그대로]\n   e. Hwanghai-Do (Kokai-Do)               Haeju (Kaishu) (125-42,38-02)\n\nWARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT.\nCONFIDENTIAL   SEE REVERSE FOR DECLASSIFICATION ACTION\n\n25X1\n\nApproved For Release 2005/12/16 : CIA-RDP82-00457R000500010006-3\n\nCENTRAL INTELLIGENCE GROUP\nApproved For Release 2005/12/16 : CIA-RDP82-00457R000500010006-3\n\nCONFIDENTIAL\n\n25X1  4. Key figures in the Party include:\n\n   a. Kim Kwae-Bong ([한자 판독 불가]) is reported [삭제] to be director of the Party; and a member of the Conference Office of the Foundation of State under the Central Committee of the Party which is headed by Kim Il-Sung.\n\n   b. Kim Il-Sung is reported [삭제] to be chairman of the Central Committee.\n\n   c. Kim Tyang ([한자 판독 불가]) is reported [삭제] to be chief of the Executive 25X1 Council; to be a member of the Conference Office.\n\n   d. Kang Nyang-Ok ([한자 판독 불가]) is reported [삭제] to be member of the Conference Office.\n\n5. [삭제] The Party is directed by the Central Committee consisting of about 20 members and a Secretariat. Under the Central Committee is the Executive Council. [삭제] directly responsible to the Central Committee are the following departments: General Affairs, Organization, Propaganda, Cultural, Farmer-Labor, Young Men's and Women's [판독 불가] the same departments with the exception of the Cultural and Farmer-Labor [판독 불가]. The Labor Association, Farmers' Association and Consumers' Association are under the direct control of the Central Committee.\n\nCONFIDENTIAL\n\nApproved For Release 2005/12/16 : CIA-RDP82-00457R000500010006-3", "notes": ["[삭제·공개 표시] 25X1 (본문 왼쪽 여백에 여러 줄에 걸쳐 되풀이해 찍혀 있다. 지운 자리마다 붙은 면제 표시로 보인다)", "[삭제·공개 표시] 본문 곳곳의 네모 먹칠. 1항 앞, 2항의 임시인민위원회 뒤, 3항 앞, 4항의 각 인물 뒤, 5항 앞을 [삭제]로 옮겼다", "[삭제·공개 표시] WARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT.", "[삭제·공개 표시] SEE REVERSE FOR DECLASSIFICATION ACTION", "[삭제·공개 표시] Approved For Release 2005/12/16 : CIA-RDP82-00457R000500010006-3 (세 곳의 공개 승인 도장)"], "note": "본문은 대체로 읽히나 왼쪽 여백이 먹칠과 25X1 표시로 덮여 있어 문단 첫머리가 자주 끊긴다. 끊긴 대목을 [삭제]로 옮겼다. 3항의 도별 표에서 평안남도의 일본식 도명과 함경남도·함경북도의 도시 이름이 뭉개졌다. 좌표로 미루어 함경남도는 함흥, 함경북도는 나남으로 보이나 이름 칸이 읽히지 않으므로 [판독 불가]로 두고 괄호 안의 `Ranan` 만 살렸다. 좌표는 고치지 않았다. 함경북도의 `(129-4,1,41-42)` 는 쉼표가 하나 더 찍혀 있으나 그대로 두었다. 인명은 원문 로마자를 그대로 두었다. `Kim KwaeBong` 은 당 책임자라는 직책 설명으로 보아 김두봉일 수 있으나 로마자를 고치지 않았다. `Kim Tyang` `Keng Nyanc-0k` 도 판단하지 않고 원문 표기를 살렸다. `Kim T1-Sun` 과 `Kim 11-Sung` 은 같은 사람으로 보아 Kim Il-Sung 으로 읽었다. 중앙위원회 인원 `about 2O members` 의 `2O` 는 20으로 읽었다. 노동당(Labor Party)과 노동조합(Labor Association)을 구별하라는 것이 이 보고의 첫 항이므로 두 이름을 옮길 때 섞지 않았다. `Conference Office of the Foundation of State` 는 건국회의부로 직역했다. 당대의 정식 명칭을 찾아 바꾸지 않았다.", "warn": false, "search": "Kim Kwae-Bong (당 책임자 겸 건국회의부 일원으로 적혔다. 한자가 뭉개져 있다) Kim Il-Sung 김일성 (중앙위원회 위원장) Kim Tyang (집행위원회 책임자 겸 건국회의부 일원) Kang Nyang-Ok (건국회의부 일원) 25X1 (본문 왼쪽 여백에 여러 줄에 걸쳐 되풀이해 찍혀 있다. 지운 자리마다 붙은 면제 표시로 보인다) 본문 곳곳의 네모 먹칠. 1항 앞, 2항의 임시인민위원회 뒤, 3항 앞, 4항의 각 인물 뒤, 5항 앞을 [삭제]로 옮겼다 WARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT. SEE REVERSE FOR DECLASSIFICATION ACTION Approved For Release 2005/12/16 : CIA-RDP82-00457R000500010006-3 (세 곳의 공개 승인 도장) Political Information: Northern Korea Labor Party"}, {"id": "N06", "order": 30, "date": "1947-05-14", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "정치 첩보: 북조선 해방 후 일 년의 주요 사건", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-05-14"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Political Information: Main Events of the Year Following the Liberation of North Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000500860007-9"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000500860007-9"}], "summary": "북조선의 보안 관서에 돌던 소책자를 통째로 옮긴 것이다. 1945년 8월 15일부터 1946년 7월 말까지의 일지다.", "points": ["정보원 말로는 북조선의 보안 관서에 돌던 소책자이고, 날짜가 쓸모 있을 수 있어 참고 자료로 배포한다고 머리에 밝혔다.", "1945년 8월 16일 정치범과 부정 상거래로 잡힌 이들이 풀려나고 평안남도에 건국준비위원회가 선다.", "1945년 8월 25일 소련군이 조선으로 들어와 조선의 해방과 독립을 선포한다고 적었다. 10월 20일 조선공산당 북조선분국이 선다.", "1945년 11월 3일 광주학생사건 기념 시위가 열리고 같은 날 조선민주당이 선다.", "1946년 2월 북조선인민위원회가 서고 KIM Il-sung 위원장이 11개 정강을 발표한다. 3월에 20개 정강과 토지개혁이 이어진다.", "1946년 5월 이승만(I Sung-man)과 김구(KIM Koo)를 없애자는 시위가 열린다.", "1946년 6월 북조선 노동법령, 7월 남녀평등법과 농업현물세가 이어지고 7월 말 북조선공산당과 신민당의 합당이 발표된다.", "미소공동위원회가 1946년 1월에 열려 2월에 한 번 끝나고 3월에 다시 열렸다가 5월에 무기한 휴회한다."], "primary": "공개 승인(Approved For Release) 2001/03/05 : CIA-RDP82-00457R000500860007-9\n\n25X1A\n\n기밀(CONFIDENTIAL)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)   73935\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가  조선(Korea)            일자:\n입수(INFO.)  아래를 보라\n주제  정치 첩보: 북조선 해방 후 일 년의 주요 사건\n배포(DIST.)  1947년 5월 [판독 불가]일\n면수  3\n25X1A\n출처(ORIGIN)\n보충(SUPPLEMENT)\n25X1X\n\n배포처(DISTRIBUTION)\n국무부 | 육군부 | 해군부 | 공군 | [판독 불가]\n\n25X1A  (주: 이 보고는 「북조선 해방 후 일 년의 주요 사건(Main Events of the Year Following the Liberation of North Korea)」이라는 제목의 소책자를 옮긴 것이다. 정보원에 따르면 이 책자는 북조선의 보안 관서(Peace Preservation Offices)들 사이에 돌고 있다. 날짜가 쓸모 있을 수 있어, 또 참고 자료로 쓰이도록 배포한다.)\n\n1945년 8월 15일    일본 천황이 일본의 무조건 항복을 선언한다.\n\n1945년 8월 16일    조선 전역(북조선?)에서 모든 정치범과 부정 상거래로 검거된 자들이 옥에서 풀려난다.\n                   평안남도에 건국(?)준비위원회(Preparatory Committee for the Establishment of the State (?) Government)가 결성된다.\n\n1945년 8월 17일    조선공산당 평안남도위원회가 결성된다.\n\n1945년 8월 1[판독 불가]일    일본인 관청 전부의 접수가 시작된다.\n\n1945년 8월 25일    소련군이 조선으로 진주하여 조선의 해방과 독립을 선포한다.\n\n1945년 8월 27일    평안남도 인민위원회가 결성된다.\n\n1945년 10월 1[판독 불가]일    시 군중대회가 열린다. KIM Il-sung 장군([한자 판독 불가])이 승리 연설을 하고 앞으로의 계획을 발표한다.\n\n1945년 10월 20일   조선공산당 북조선분국(North Korea Branch Bureau of the Korean Communist Party)이 설치된다.\n\n1945년 11월 3일    「광주학생사건(Kwang-ju Student Incident)」 기념 시위가 열린다. 조선민주당(Korean Democratic Party)이 결성된다.\n\n1945년 11월 7일    소련 10월혁명 기념 시위가 열린다.\n\n1945년 11월 25일   문화예술총연맹(Cultural Professional League)이 결성된다.\n\n1945년 11월 30일   북조선에 노동조합전국평의회(National Council of Labor Unions) 본부가 설치된다.\n\n분류(CLASSIFICATION) 기밀(CONFIDENTIAL)\n\n문서번호 [판독 불가]\n등급 변경 없음(NO CHANGE in Class.) [판독 불가]\n비밀해제(DECLASSIFIED)\n등급 변경(Class. CHANGED TO): TS S [판독 불가]\nDDA 각서, 1977년 4월 4일\n근거(Auth): [판독 불가]\n일자(Date): [판독 불가]\n\n공개 승인(Approved For Release) 2001/03/05 : CIA-RDP82-00457R000500860007-9\n\n[두 번째 면. 원문은 날짜 칸과 사건 칸의 두 단으로 되어 있으나 OCR 에서 두 단이 따로 떨어져 나왔다. 어느 날짜에 어느 사건이 붙는지 확정할 수 없어 짝지어 옮기지 않고 인쇄된 차례대로 두 칸을 나누어 적는다.]\n\n[날짜 칸, 인쇄된 차례대로]\n1945년 12월 11일\n1945년 12월 1[판독 불가]일\n1945년 12월 [판독 불가]일\n1945년 12월 2[판독 불가]일\n1946년 1월 [판독 불가]일\n1946년 1월 16일\n1946년 1월 20일\n1946년 1월 31일\n1946년 2월 [판독 불가]일\n1946년 2월 7일\n1946년 2월 [판독 불가]일\n[판독 불가]년 2월 10일\n[판독 불가]년 2월 23일\n1946년 3월 1일\n[판독 불가]년 3월 6일\n[판독 불가]년 3월 [판독 불가]일\n1926년 [원문 그대로] 3월 2[판독 불가]일\n1946년 3월 23일\n[판독 불가]년 3월 2[판독 불가]일\n1926년 [원문 그대로] 4월 5일\n1946년 5월 1일\n1946년 5월 [판독 불가]일\n1446년 [원문 그대로] 5월 [판독 불가]일\n\n[사건 칸, 인쇄된 차례대로]\nKIM Il-sung 장군이 조선공산당 북조선분국 책임비서로 임명된다.\n모스크바 외상회의(Moscow Foreign Ministers Conference).\n여성동맹(Women's League) 결성.\n삼상 외상회의(Big Three Foreign Ministers' Conference)를 지지하는 인민 시위.\n삼상 외상회의가 조선에 관한 결정을 내린다.\n제1차 미소공동위원회(Russo-American Committee) 회의 시작.\n북조선민주청년동맹(North Korean Democratic Youth League) 결성.\n평안남도 인민위원회 제1차 전체위원회 회의.\n전국농민동맹(National Farmers' League) 북조선위원회 결성.\n미소공동회의 종료.\n조선민주당 대회.\n철도노동조합(Railway Workers Union) 회의 시작.\n북조선인민위원회(North Korea People's Committee) 수립. KIM Il-sung 위원장이 11개 정강(11 Political Principles)을 발표한다.\n북조선인민위원회 수립을 축하하는 군중대회가 열린다.\n소련군 창설 제2[판독 불가]주년 기념식.\n3·1절 시위.\n북조선 토지개혁 강령(North Korea Land Reform Program) 발표.\n평양소비조합(Pyongyang Cooperative League) 결성.\n평안남도 인민위원회 제2차 전체회의.\n제2차 미소공동위원회 회의.\nKIM Il-sung 위원장이 20개 정강(20 Political Principles)을 발표한다.\n북조선 토지개혁 강령의 계획이 완료된다.\n북조선 교원 및 전문직 노동자 동맹(North Korea Teachers and Professional Workers League) 결성.\n북조선 농민은행(North Korea Farmers' Bank) 설립.\n5·1절 시위.\n어린이날(Boys' Day) 기념식.\n미소공동위원회 무기한 휴회.\n\n기밀(CONFIDENTIAL)\n\n공개 승인(Approved For Release) 2001/03/05 : CIA-RDP82-00457R000500860007-9\n\n[세 번째 면. 여기도 두 단이 따로 떨어져 나왔다.]\n\n73935\n\n[날짜 칸, 인쇄된 차례대로]\n1946년 5월 [판독 불가]일\n1946년 5월 9일\n1946년 5월 19일\n1946년 [판독 불가]월 21일\n1946년 6월 1[판독 불가]일\n1926년 [원문 그대로] 6월 24일\n1946년 6월 27일\n1946년 6월 30일\n1946년 7월 1일\n1946년 7월 15일\n1946년 7월 30일\n\n[사건 칸, 인쇄된 차례대로]\n북조선체육동맹(North Korea Physical Education League) 결성.\n[판독 불가] 기념식.\n이승만(I [판독 불가]-man, Rhee Syng-man)과 김구(KIM Koo) 같은 지도자들을 없애자고 요구하는 시위.\n보통강(Bot'ong River) 범람으로 생긴 피해의 복구 착수.\n「증산의 날(Increase Product
