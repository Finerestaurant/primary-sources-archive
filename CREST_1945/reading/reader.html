   1300 (following day)\n(129-49, 41-46)                                           One train per day.\n\nChongjin            Wonsan              0900              One train per day. (Two trains\n                                                          per day leave Chongjin: one for\n                                                          Pyongyang, one for Wonsan.)\n25X1A\n\n2. The distance between Wonsan and Hamhung is roughly only a third [판독 불가]tween Hamhung and Nanam, yet the time given above for the trip between Wonsan and Hamhung is nine hours and that for the Hamhung-Nanam trip is only six hours.\n\nDocument No. [판독 불가]\n\nCONFIDENTIAL/CONTROL U.S. OFFICIALS ONLY\n\nCONFIDENTIAL\n\nApproved For Release 2001/03/05 : CIA-RDP82-00457R000700050002-1\n[판독 불가]\n\nApproved For Release 2001/03/05 : CIA-RDP82-00457R000700050002-1\n\nCENTRAL INTELLIGENCE GROUP\n\n25X1X\n\nThe railroad between Sinuiju and Pyongyang is double-tracked, but only one track is used. Passenger trains must wait on sidings for passage of trains coming from the opposite direction or for passage of Soviet trains.\n\nThe railroad between Pyongyang and Wonsan is double-tracked for a short distance northeast of [판독 불가] to Kowon (Kogen) (127-14, 39-26), and [판독 불가] double-tracked to Wonsan. Note: The \"short distance of double-tracked road northeast from Pyongyang\" probably refers to that part of the main line between Sinuiju and Pyongyang which is used on the Pyongyang-Wonsan road. Also, according to Chapter 7 of Janis #75, the road from Kowon to Wonsan is single-tracked as of February 1945.\n\nThe railroad from Wonsan to Chongjin is double-tracked. (Note: Chapter 7 of Janis #75 shows this railroad as single-tracked as of February 1945.)*\n\nNo direct rail connection exists between Vladivostok and North Korea. Rail traffic is routed through eastern Manchuria and then into Siberia. (Note: Chapter 7 of Janis #75 shows a single-tracked railroad leaving the Korean border at Hunyung (Kunju) (130-15, 42-55) for Vladivostok.)**\n\nDelays in traveling are frequent and may last from a few hours to several days. One cause of delay is the inferior grade of coal and oil that the railroads are forced to use. Soviet trains have priority over other trains and it is often necessary to wait for Soviet freight and passenger trains to pass. On 12 February 1947 a delay of over five hours occurred at Yangdok (Yotoku) (126-54, 39-10) when the engine of a Korean passenger train was removed and attached to a Soviet freight train. The Korean stationmaster at Yangdok explained to the passengers that Soviets have priority over Korean passengers and that it was necessary to wait for another engine to arrive.\n\n7. Passenger trains usually consist of seven or eight cars. The cars are in poor condition, with seats removed and windows broken, and are usually extremely crowded. Engineers on Korean passenger trains are Korean, those on Soviet trains, Soviets. Occasionally a Soviet engineer is seen wearing a Soviet Army overcoat and may be a member of the Soviet Army. Soviet soldiers travel either in special trains or in special cars attached to Korean trains. On the east coast, however, Soviet soldiers sometimes ride in the same cars as Korean passengers.\n25X1X\n\n8. Public Bus Line Between Sinuiju and Uiju (Gishu) (224-32, 40-12) [원문 그대로]\n\nTwo busses operate between Sinuiju and Uiju, both using charcoal as fuel. The busses run every hour on the hour from Sinuiju to Uiju between the hours of 0[판독 불가]00 and 1600 and between Uiju and Sinuiju between the hours of 0900 and 1700. Fare is 38 won. There are seats in each bus for 30 passengers but the busses are usually overcrowded. Breakdowns are frequent and schedules are not maintained. Bus lines also operate between the other large cities of North Korea.\n\n[판독 불가] Transport\n\nTrucks operate between the larger cities of North Korea. These are privately owned but are controlled by the Communications Bureaus of the Peoples Committees. Most of them use carbide as a fuel, the remainder using charcoal.\n\n25X1X\n\nCONFIDENTIAL/CONTROL U.S. OFFICIALS ONLY\n\nApproved For Release 2001/03/05 : CIA-RDP82-00457R000700050002-1", "notes": ["[삭제·공개 표시] Approved For Release 2001/03/05 : CIA-RDP82-00457R000700050002-1 (세 곳의 공개 승인 도장)", "[삭제·공개 표시] 25X1A (표 여백에 세 번, 헤더에 한 번)", "[삭제·공개 표시] 25X1X (본문 여백에 세 번)", "[삭제·공개 표시] CONFIDENTIAL/CONTROL U.S. OFFICIALS ONLY (본문 하단과 말미의 등급 표시)", "[삭제·공개 표시] Document No. 뒤의 번호가 뭉개져 [판독 불가]로 옮겼다"], "note": "시각표가 표 형태여서 스캔에서 칸이 여러 군데 어긋난다. 표의 짜임은 살리되 숫자는 한 자리도 고치지 않았다. 신의주 출발 `0760` 은 시각으로 성립하지 않는 값이고, 평양 출발 `1106`, 나남 도착 `2.100`, 원산 출발 `0¢00` 도 마찬가지다. 원산 출발은 판독이 되지 않아 `0[판독 불가]00` 으로 두었다. 좌표도 깨진 채 두었다. 원산 `(127-26, 39-1C)` 은 위도 끝이 글자 C 로 찍혀 있고, 함흥 `(127232, 39-54)` 은 경도의 붙임표가 사라졌으며, 나남 `(129-41, 41°42)` 은 붙임표가 도 기호로 찍혔다. 의주 `(224-32, 40-12)` 는 경도 앞자리가 2 로 찍혀 있는데 다른 문서에서는 124 다. 배포일은 `2h dune 19247` 로 찍혀 있다. 달 이름만 June 으로 바로잡고 숫자는 그대로 두었다. 문단 번호는 1·2 와 7·8 만 남고 그 사이가 스캔에서 사라졌다. 번호를 새로 매기지 않고 번호 없이 이어 두었다. 2항의 `a third ... tween Hamhung and Nanam` 은 줄이 끊기며 낱말 앞부분이 날아갔다. [판독 불가]로 표시했다. 트럭 항목의 소제목은 `Ja ex Transport` 로 찍혀 앞 낱말을 가릴 수 없다. `Janis #75` 는 미 육해군 합동정보조사(Joint Army-Navy Intelligence Study) 제75호이고 조선 편이다. 원문 표기를 살렸다. 훈융(Hunyung)의 일본식 표기는 `Kunju` 로 찍혀 있는데 확정되지 않아 로마자를 그대로 두었다. `Communications Bureaus of the Peoples Committees` 는 인민위원회 교통국으로 옮기고 원어를 병기했다.", "warn": false, "search": "Approved For Release 2001/03/05 : CIA-RDP82-00457R000700050002-1 (세 곳의 공개 승인 도장) 25X1A (표 여백에 세 번, 헤더에 한 번) 25X1X (본문 여백에 세 번) CONFIDENTIAL/CONTROL U.S. OFFICIALS ONLY (본문 하단과 말미의 등급 표시) Document No. 뒤의 번호가 뭉개져 [판독 불가]로 옮겼다 Economic Information: Transportation in North Korea"}, {"id": "N16", "order": 40, "date": "1947-07-10", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "경제 첩보: 북조선의 식량 사정, 평양의 물가", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-07-10"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Economic Information: Food Conditions in North Korea; Commodity Prices in Pyongyang", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000700340002-9"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000700340002-9"}], "summary": "1947년 봄 조선 서북부의 식량 사정과 평양 물가를 적었다. 쌀 배급소, 설탕 배급표, 남으로 넘어가는 피난민을 다룬다.", "points": ["1947년 3월보다 서북부 식량 사정이 훨씬 나빠졌다. 굶어 죽은 사례는 없으나 이틀에 옥수수 가루 한 끼만 먹는 사람이 많다고 적었다.", "**피난민이 만주가 아니라 남조선으로 간다.** 제 나라 안에 있으려는 마음과 만주 국경 통제가 이유라고 본다.", "농민이 종자를 정부가 대 줄 줄 알고 1946년 가을과 겨울에 농산물을 다 팔았다. 종자가 오지 않아 토지개혁으로 땅을 받은 농민까지 농사를 버리고 있다.", "평양에만 쌀 배급소가 있다. 1두(30근)에 2300원으로 자유시장보다 100원 싸지만 품질은 자유시장 쌀이 낫다.", "환율은 소문으로만 적혔다. 북조선 원과 남조선 원이 1대 5, 남조선 원과 미화 달러가 6021, 암시장 350213 이라고 원문에 찍혀 있다.", "설탕 배급표가 평양과 신의주에 나왔다. 배급소 값 75원, 시장 값 190원이고, 표 자체가 100~130원에 거래되는 장사가 신의주에 생겼다.", "설탕은 귀하지 않은데 왜 통제하는지 모르겠다고 적으면서, 옥수수 가루와 쌀로 통제를 넓히려는 예행이라고 짐작한다.", "평양 물가표에 쌀 1400원, 옥수수 가루 1100원, 무명 한 필 14000원, 타이어 25000원이 올라 있다."], "primary": "문서번호 [판독 불가]\n등급 변경 없음(NO CHANGE in Class.) [원문 그대로]\n\n[공개 승인 2005/05/16 : CIA-RDP82-00457R000700340002-9]\n\n기밀(CONFIDENTIAL)\n\n이 문서는 이로써 [판독 불가]로 등급이 재조정됨\nDirect[판독 불가]\n다음 [판독 불가] 일자: [판독 불가]\n\n국가   조선(Korea)\n주제   경제 첩보: 북조선의 식량 사정, 평양의 물가(Economic Information: Food Conditions in North Korea; Commodity Prices in Pyongyang)\n정보(INFO.)\n배포(DIST.)  1947년 7월 10일\n면수  2\n\n25X1\n25X1\n25X1\n\n경고(WARNING)\n\n[배포처 표: 판독 불가한 표시가 각 칸에 들어 있다]\n국무부(STATE) | 육군부(WAR) | 해군부(NAVY) | 법무부(JUSTICE) | [판독 불가]\n\n경고 고지: 이 배포처 목록은 본 문서를 공개하기 전에 삭제되어야 한다.\n\n[공개 승인 2005/05/16 : CIA-[판독 불가]]\n\n자료센터(REFERENCE CENTER) [판독 불가]\n\n1947년 3월과 견주면 조선 서북부의 지금 식량 사정은 훨씬 나쁘다. 실제로 굶어 죽은 사례는 알려진 것이 없으나, 이틀에 한 번 옥수수 가루로 한 끼만 먹는 사람이 많은 것은 분명하다. 남조선과 만주로 달아나는 피난민의 수가 날마다 늘고 있다. 이 피난민 대부분이 만주가 아니라 남조선을 향하는데, 조선인이 제 나라 안에 있기를 바라기 때문이고, 또 만주와 조선의 국경 양쪽 통제가 엄해 만주로 들어가기가 어렵기 때문이다.\n\n농민들은 파종할 종자가 없어 불만이다. 많은 농민이 올봄에 정부가 종자를 대 주리라 믿고 1946년 가을과 겨울 내내 농산물을 다 팔아 버렸다. 지금까지 정부는 종자를 내놓지 않았고, 많은 농민이 땅을 버리고 남조선으로 가려 하고 있다. 토지개혁에서 [판독 불가] 땅을 받은 농민들이 지금 농사를 떠나고 있다. 다만 농민들은 정부 관리를 상대로 어떤 행동도 하지 않고 있으며, 불만이 정부에 대한 겉으로 드러난 반대로 표출되고 있지도 않다.\n\n조선인 관리들이 평양(Pyongyang, Heijo 헤이조) (125-44, 39-01)의 여러 상점에서 쌀 배급소를 운영하고 있는데, 물량이 남아 있는 한 누구나 쌀을 살 수 있다. 사람들이 쌀을 사려고 아침부터 밤까지 줄을 선다. 쌀은 1두(30근)(약 40파운드)에 2300원으로 팔리는데, 이는 그 지역 자유시장 값보다 100원 싸다. 다만 자유시장 쌀이 품질은 훨씬 낫다. 평양 주민들의 말로는 배급소가 문을 연 지 한 달쯤 되었으나, 그 한 달 사이에도 물량이 떨어지면 이따금 문을 닫았다고 한다. 조선인 정부 관리가 운영하는 쌀 배급소가 설치된 도시는 평양뿐이다. [주(注): 북조선 원(Won)의 정확한 평가는 이 사령부가 [판독 불가] 얻을 수 있다. 다만 소문으로는 북조선 원과 남조선 원의 환율이 1대 5, 남조선 원과 미화 달러의 환율이 6021, 암시장 350213 이라고 한다.] [원문 그대로]\n\n북조선에서 설탕을 배급하려는 시도가 이루어지고 있다. 설탕 배급소가 평양과 신의주(Sinuiju, Shingishu 신기슈) (124-24, 40-06)에 문을 열었다. 배급표는 지구 지도자들에게 발급되었다.\n\n등급 구분(CLASSIFICATION) 기밀(CONFIDENTIAL)\n\n[판독 불가] 본 문서의 공개.\n\n25X1\n[공개 승인 [판독 불가]]\n\n기밀(CONFIDENTIAL)\n\n신의주와 평양에서는 소비조합(Consumers Association)이 지구 지도자에게 배급표를 발급하였다. 그러면 지구 지도자가 자기 지구의 사람들에게 표를 나누어 준다. 표 한 장은 설탕 1근(1과 3분의 1파운드)에 해당하며, 배급 지정 상점에서 75원에 살 수 있다. 통상 시장 가격은 1근에 190원이다. 배급소에서 파는 설탕은 값이 훨씬 싼데도 자유시장에서 파는 것보다 품질이 훨씬 좋다. 신의주 일대의 첫 배급표는 4월 중순쯤 발급되었다. 5월 1일까지 표는 한 번밖에 발급되지 않았다. 여론으로는 곧 평안북도의 다른 도시들에도 표가 발급될 것이라고 한다. 신의주에서는 설탕표를 사고파는 장사가 생겨났다. 표 값은 100원에서 130원 사이다. 설탕표를 자유시장에 내다 파는 것이 불법은 아니어서, 더 요긴한 물품을 원하는 많은 가정이 표를 팔아 버렸다. 지금 북조선에서 설탕이 특별히 귀하지는 않은데, 한 가지 까닭은 조선인이 설탕을 많이 쓰지 않는다는 것이다. 이 시점에 설탕 배급을 통제하려는 이유는 알 수 없다. 북조선 정부가 설탕 배급을 통제하는 만족스러운 방식을 만들어 낸 다음 그 방식을 옥수수 가루나 쌀 같은 다른 물품으로 넓히려는 뜻일 수 있다. 또 정부는 설탕 배급에서 부딪치는 어려움을 풀 수 있다면 다른 물품의 배급이나 유통 통제로 넓히기가 쉬워지리라고 볼 수도 있다.\n\n평양의 물가:\n\n콩깻묵          1 [판독 불가]                             700원(Won)\n콩             1두(One Tu)                              900\n쌀             \"   \"                                   1400\n옥수수 가루      \"   \"                                   1100\n무명            한 필(Roll, 40야드)                      14000\n돼지고기         1근(One Chin)                             70\n쇠고기          \"   \"                                     50\n소금            [판독 불가]                                900\n설탕            \"   근(Chin)                              150\n청주(백주)       1되(One Sung, 1.8리터)                   [판독 불가]00 [원문 그대로]\n궐련            갑(Pack)                                [판독 불가]\n  (상품)\n고무신           켤레(Pair)                                450\n무명 양말        1                                       [판독 불가]\n조선 명주        40척(Shaku)(1척은                        [판독 불가]\n               0.231240야드)\n타이어           개(Each)                                25000\n\n진남포(Chinnampo) (125-24, 38-44)에서는 굴, 생선, 새우를 비롯한 해산물이 흔하고 값이 싸다. 생선은 지역 시장에서 1근에 40원에 팔린다.\n\n기밀(CONFIDENTIAL)\n\n기밀(CONFIDENTIAL)\n\n[공개 승인 2005/05/16 : CIA-RDP82-00457R000700340002-9]", "secondary": "Document No. [판독 불가]\nNO CHANGE in Class. [원문 그대로]\n\nApproved For Release 2005/05/16 : CIA-RDP82-00457R000700340002-9\n\nCONFIDENTIAL\n\nThis document is hereby regraded to [판독 불가]\nDirect[판독 불가]\nNext [판독 불가] Date: [판독 불가]\n\nCOUNTRY   Korea\nSUBJECT   Economic Information: Food Conditions in North Korea; Commodity Prices in Pyongyang\nINFO.\nDIST.  10 July 1947\nPAGES  2\n\n25X1\n25X1\n25X1\n\nWARNING\n\n[배포처 표: 판독 불가한 표시가 각 칸에 들어 있다]\nSTATE | WAR | NAVY | JUSTICE | [판독 불가]\n\nWARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT.\n\nApproved For Release 2005/05/16 : CIA-[판독 불가]\n\nREFERENCE CENTER [판독 불가]\n\nCompared with that of March 1947, the present food situation in northwest Korea is much worse. No cases of actual starvation are known, but there definitely are many people who eat only one meal of cornmeal every two days. The number of refugees fleeing to South Korea and Manchuria is increasing daily. The destination of most of these refugees is South Korea rather than Manchuria because of the preference of Koreans to be in their own country and because of the stringent border controls of both sides of the Manchurian-Korean border which make it difficult to enter Manchuria.\n\nFarmers are dissatisfied because there is a lack of seeds for planting. Many farmers believed that the government would furnish them seeds this spring and consequently sold all their farm products through the fall and winter of 1946. Up to the present time no seeds have been provided by the government and many farmers are abandoning their land and attempting to go to South Korea. Farmers who obtained [판독 불가] land in the land reformation are now leaving their farms. The farmers, however, are not taking any action against government officials nor is their dissatisfaction being expressed in any outward disapproval of their government.\n\nKorean officials are operating rice distribution centers at several stores in Pyongyang (Heijo) (125-44, 39-01) where any individual may purchase rice as long as the supply lasts. People line up from morning to night to purchase the rice. It is sold at 2300 Won per Tu (30 chin) (about 40 pounds), which is 100 Won cheaper than the local open market price; however, rice on the open market is of much better quality. According to Pyongyang residents, the distribution centers have been open for about one month, but they have been closed from time to time during the month when supplies were depleted. Pyongyang is the only city in which rice distribution centers operated by Korean government officials are established. [Note: An accurate evaluation of the North Korean Won is [판독 불가] available to this headquarters, however, rumor places the exchange rate between North and South Korean Won at 1:5 and the rate between South Korean Won and U.S. dollars at 6021, black market, 350213] [원문 그대로]\n\nAn attempt to ration sugar is being made in North Korea. Sugar distribution centers have been opened in Pyongyang and Sinuiju (Shingishu) (124-24, 40-06). Ration tickets have been issued to district leaders\n\nCLASSIFICATION CONFIDENTIAL\n\n[판독 불가] RELEASE OF THIS DOCUMENT.\n\n25X1\nApproved For Release [판독 불가]\n\nCONFIDENTIAL\n\nin Sinuiju and Pyongyang by the Consumers Association. The district leader then issues the tickets to the people in his district. Each ticket is good for one chin (one and one-third pounds) of sugar, which can be purchased for 75 Won at the stores designated as distribution points. Regular market price is 190 Won per chin. Sugar sold at the distribution centers is of much higher quality than that sold on the open market even though the price is much less. The first tickets in the Sinuiju area were issued about the middle of April. Up to the first of May tickets had been issued only once. Public opinion indicates that tickets will soon be issued in other cities of North Pyongan Province. A business of buying and selling sugar tickets has developed in Sinuiju. Price of the tickets runs from 100 to 130 Won. It is not unlawful to dispose of the sugar tickets on the open market and many families who prefer a more staple commodity have sold their tickets. Sugar is not particularly scarce in North Korea at present, partly because Koreans do not use much sugar, and the reason for attempting to control the distribution of sugar at the present time is unknown. It may be the intention of the North Korean Government to try to develop a satisfactory system of controlling the distribution of sugar and then extend that system to other commodities, such as cornmeal and rice and the government may believe that if difficulties encountered in the rationing of sugar can be solved, extension of the rationing or distribution control of other commodities can be facilitated.\n\nCommodity prices in Pyongyang:\n\nBean cake        1 [판독 불가]                            700 Won\nSoy beans        One Tu                                 900\nRice             \"    \"                                1400\nCornmeal         \"    \"                                1100\nCotton cloth     Roll (40 Yds)                        14000\nPork             One Chin                                70\nBeef             \"    \"                                  50\nSalt             [판독 불가]                              900\nSugar            \"    Chin                              150\nWhite wine       One Sung (1.8 liters)                [판독 불가]00 [원문 그대로]\nCigarettes       Pack                                 [판독 불가]\n  (good quality)\nRubber shoes     Pair                                   450\nCotton socks     1                                    [판독 불가]\nKorean silk      40 Shaku (1 shaku equals             [판독 불가]\n                 .231240 yards)\nTires            Each                                 25000\n\nIn Chinnampo (125-24, 38-44), sea food, including oysters, fish and shrimp, is plentiful and inexpensive. Fish sell for 40 Won per chin in the local market.\n\nCONFIDENTIAL\n\nCONFIDENTIAL\n\nApproved For Release 2005/05/16 : CIA-RDP82-00457R000700340002-9", "notes": ["[삭제·공개 표시] Approved For Release 2005/05/16 : CIA-RDP82-00457R000700340002-9 (앞뒤 두 곳의 공개 승인 도장)", "[삭제·공개 표시] Approved For Release 2005/05/16 : CIA-[판독 불가] (배포처 표 위에 겹쳐 찍힌 도장)", "[삭제·공개 표시] 25X1 (헤더에 세 번, 2면 하단에 한 번)", "[삭제·공개 표시] WARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT.", "[삭제·공개 표시] 배포처 표(STATE·WAR·NAVY·JUSTICE)의 각 칸 표시가 뭉개져 [판독 불가]로 옮겼다", "[삭제·공개 표시] 등급 재조정 도장의 근거 문구가 뭉개져 [판독 불가]로 옮겼다", "[삭제·공개 표시] Document No. 뒤의 번호가 뭉개져 [판독 불가]로 옮겼다"], "note": "환율 대목이 이 문서에서 가장 뭉개진 곳이다. 원문은 `at 6021, black market, 350213` 으로 찍혀 있다. 같은 계열의 N18 은 같은 소문을 `60:1` 과 `350:1` 로 적고 있어 쌍점이 숫자로 읽힌 것으로 보이나, 숫자는 고치지 않고 원문대로 두었다. 북조선 원의 평가에 관한 문장은 `is r avaitanle to this headguarters` 로 찍혀 부정어 여부를 가릴 수 없다. [판독 불가]로 두었다. 물가표는 오른쪽 값이 여러 줄 날아갔다. 청주 `00`, 궐련 `AD`, 무명 양말 `FO`, 조선 명주 `Ao` 는 숫자로 복원되지 않아 [판독 불가]로 두었다. 콩깻묵의 단위 `Lece` 와 소금의 단위도 읽히지 않는다. 본문의 문단 번호가 스캔에서 모두 사라져 번호 없이 이어 두었다. 새로 매기지 않았다. `Tu` 는 되가 아니라 말(斗)이고 원문이 30근이라 밝혀 두었으므로 그대로 두었다. `Chin` 은 근(斤), `Sung` 은 되(升), `Shaku` 는 일본식 척(尺)이다. 단위는 원문 표기를 앞세웠다. 기관 이름은 원문대로 옮겼다. `Consumers Association` 소비조합, `Peoples Committees` 인민위원회다. 평양과 신의주는 조선 이름과 일본식 이름이 나란히 찍혀 있어 둘 다 살렸다. 진남포는 일본식 표기만 나온다. 좌표 `(125-44, 39-01)` `(124-24, 40-06)` `(125-24, 38-44)` 는 온전하다.", "warn": false, "search": "Approved For Release 2005/05/16 : CIA-RDP82-00457R000700340002-9 (앞뒤 두 곳의 공개 승인 도장) Approved For Release 2005/05/16 : CIA-[판독 불가] (배포처 표 위에 겹쳐 찍힌 도장) 25X1 (헤더에 세 번, 2면 하단에 한 번) WARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT. 배포처 표(STATE·WAR·NAVY·JUSTICE)의 각 칸 표시가 뭉개져 [판독 불가]로 옮겼다 등급 재조정 도장의 근거 문구가 뭉개져 [판독 불가]로 옮겼다 Document No. 뒤의 번호가 뭉개져 [판독 불가]로 옮겼다 Economic Information: Food Conditions in North Korea; Commodity Prices in Pyongyang"}, {"id": "N17", "order": 41, "date": "1947-07-10", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "경제 첩보: 진남포에서의 해운", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-07-10"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Economic Information: Shipping from Chinnampo", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000700340003-8"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000700340003-8"}], "summary": "1947년 4월 24일 진남포 항구를 본 짧은 보고다. 주항은 비어 있고 소련군이 지키며, 작은 항구에 범선과 정크선이 몰려 있다.", "points": ["**주항에 배가 한 척도 없다.** 입구가 통제되고 소련군 초병이 길을 지키며 조선인은 들어가지 못한다.", "바리케이드나 철조망은 없다. 물리적 방벽이 아니라 초병과 출입 금지로 통제하고 있다는 관찰이다.", "대동강 어귀 가까운 작은 항구에는 범선과 정크선이 백 척 넘게, 작은 디젤선이 열 척 있다. 디젤선 세 척은 평양행 자루를 싣고 있었고 정보원은 식량으로 본다.", "범선이 진남포에서 서울, 다롄, 산둥반도 항구로 갔다는 여론을 전한다. 모두 몰래, 공식 승인 없이 다닌 항해다.", "시장에서 살림살이를 파는 가정이 많이 보였다. 배로 남조선에 갈 사람들이라고 적었다.", "관찰 자체가 정보원의 눈에 의존한다. 「정보원은 식량으로 본다」, 「백 척이 넘는(?)」처럼 원문에 확신하지 못한 표시가 그대로 남아 있다."], "primary": "[판독 불가]457R000700340003-8\n\n[공개 승인 2001/03/05 : CIA-RDP82-00457R000700340003-8]\n\n기밀(CONFIDENTIAL)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n첩보보고(INTELLIGENCE REPORT)\n\n이 문서는 중앙정보국장이 [판독 불가]에게 보낸 1573년 [원문 그대로] 10월 16일자 서한에 따라 이로써 기밀(CONFIDENTIAL)로 등급이 재조정됨\n\n주제   경제 첩보: 진남포에서의 해운(Economic Information: Shipping from Chinnampo)\n배포(DIST.)  20 [판독 불가] 3949 [원문 그대로]\n25X1A     면수  2\n국가   조선(Korea)\n\n25X1A\n\n1. 19@7년 [원문 그대로] 4월 24일 진남포(Chinnampo) (12524, 38-44) [원문 그대로] 주항(主港)에는 배가 한 척도 없었다. 주항으로 드는 (육로?) 입구는 통제되어 있다. 항구 부근에 바리케이드나 철조망 방책은 없으나, 항구로 가는 길에 소련군 초병이 배치되어 있고 조선인은 그 구역에 들어가지 못한다.\n\n2. 대동강(Taedong River) 어귀에 더 가까운 작은 항구에는 백 척이 넘는(?) 작은 범선과 정크선, 그리고 열 척의 작은 디젤선이 있었다. 디젤선 세 척은 자루를 싣고 있었는데 정보원은 그 안에 식량이 들어 있었다고 본다. 이 배들의 목적지는 평양(Pyongyang, Heijo 헤이조) (125+44,398(1) [원문 그대로]이었다. 승조원은 조선인이었다.\n\n3. 그 지역 여론에 따르면 범선들이 진남포에서 (Kan 강을 거슬러?) 남조선의 수도 서울로, 또 다롄(Dairen 大連)으로, 또 산둥반도(Shantung Peninsula)의 항구들로 갔다. 다만 이 항구들로 가는 배들은 몰래, 공식 승인 없이 항해하였다. 지역 시장에서 살림살이를 파는 가정이 많이 목격되었다. 이 가정들은 아마 배를 타고 진남포를 떠나 남조선으로 갈 것이다.\n\n4. 큰 어선단이 진남포를 근거지로 조업한다.\n\n문서번호 [판독 불가]\nDDA 각서, 1977년 4월 4일\n근거(Auth.): DDA 규정 77/1763\n일자: [판독 불가] APR 197[판독 불가]   담당: [판독 불가]\n\n기밀(CONFIDENTIAL)\n등급 구분(CLASSIFICATION) 기밀(CONFIDENTIAL)\n\n[공개 승인 [판독 불가]]\n\n경고 고지: 이 배포처 목록은 본 문서를 공개하기 전에 삭제되어야 한다.\n\n[판독 불가]", "secondary": "[판독 불가]457R000700340003-8\n\nApproved For Release 2001/03/05 : CIA-RDP82-00457R000700340003-8\n\nCONFIDENTIAL\n\nCENTRAL INTELLIGENCE GROUP\nINTELLIGENCE REPORT\n\nThis document is hereby regraded to CONFIDENTIAL in accordance with the letter of 16 October 1573 [원문 그대로] from the Director of Central Intelligence to [판독 불가]\n\nSUBJECT   Economic Information: Shipping from Chinnampo\nDIST.  20 [판독 불가] 3949 [원문 그대로]\n25X1A     PAGES  2\nCOUNTRY   Korea\n\n25X1A\n\n1. On 24 April, 19@7 [원문 그대로] there were no ships in the main harbor of Chinnampo (12524, 38-44) [원문 그대로]. The (land?) entrance to the main harbor is restricted. There are no barricades or barbed wire entanglements in the vicinity of the harbor, but Soviet guards are posted on the road to the harbor and Koreans are not allowed to enter the area.\n\n2. In a smaller harbor nearer the mouth of the Taedong River, there were more than a hundred (?) small sailing ships and junks and ten small Diesel-powered ships. Three of the Diesel-powered ships were loading sacks which source believes were filled with foodstuffs. Destination of these ships was Pyongyang (Heijo) (125+44,398(1) [원문 그대로]. Crews were Korean.\n\n3. According to public opinion in the area, sailing vessels went from Chinnampo (up the Kan river?) to Seoul, capital of South Korea, to Dairen, and to ports on the Shantung Peninsula, but vessels sailing to these ports sailed clandestinely and without official approval. Many families were observed in the local market selling their household goods. These families will probably leave Chinnampo for South Korea by boat.\n\n4. A large fishing fleet operates from Chinnampo.\n\nDocument No. [판독 불가]\nDDA Memo, 4 Apr 77\nAuth: DDA REG. 77/1763\nDate: [판독 불가] APR 197[판독 불가]   By: [판독 불가]\n\nCONFIDENTIAL\nCLASSIFICATION CONFIDENTIAL\n\nApproved For Release [판독 불가]\n\nWARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT.\n\n[판독 불가]", "notes": ["[삭제·공개 표시] Approved For Release 2001/03/05 : CIA-RDP82-00457R000700340003-8 (첫 면의 공개 승인 도장)", "[삭제·공개 표시] Approved For Release [판독 불가] (하단에 겹쳐 찍혀 번호가 읽히지 않는 두 번째 도장)", "[삭제·공개 표시] 25X1A (헤더에 두 번)", "[삭제·공개 표시] WARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT.", "[삭제·공개 표시] DDA Memo, 4 Apr 77 / Auth: DDA REG. 77/1763 (비밀해제 근거 도장)", "[삭제·공개 표시] 등급 재조정 도장에서 서한 수신자 자리가 뭉개져 [판독 불가]로 옮겼다", "[삭제·공개 표시] Document No. 뒤의 번호가 뭉개져 [판독 불가]로 옮겼다"], "note": "두 면짜리 짧은 보고인데 헤더가 특히 심하게 뭉개졌다. 제목은 등급 재조정 도장 위에 겹쳐 찍힌 `Shipping fro: dbinnay` 조각과 주제 줄의 `Economie Tex:` 조각을 맞춰 읽었다. 배포일은 `DESY. 20 duis 3949` 로 찍혀 있다. 달 이름은 판독되지 않아 [판독 불가]로 두었고 연도 자리의 3949 는 고치지 않았다. 목록 자료의 날짜는 1947년 7월 10일이다. 본문 날짜 `19@7` 도 그대로 두었다. 좌표는 두 곳 다 깨져 있다. 진남포는 `(12524, 38-44)` 로 경도의 붙임표가 사라졌고, 평양은 `(125+44,398(1)` 로 붙임표가 더하기로, 위도가 괄호 섞인 문자열로 찍혔다. 같은 계열의 다른 문서는 진남포를 (125-24, 38-44), 평양을 (125-44, 39-01)로 적으나 이 문서의 숫자는 고치지 않았다. 3항의 `(up the Kan river?)` 는 원문 그대로 두었다. 대동강 하구에서 서울로 가는 물길이라 대동강이나 한강 어느 쪽으로도 읽힐 수 있어 지명을 짓지 않았다. 물음표는 원문 작성자가 붙인 것이다. 2항의 `more than a hundred (?)` 와 1항의 `(land?)` 도 마찬가지로 원문의 의문 표시라 살려 두었다. `household foods` 는 `household goods` 로 읽었다. 시장에 살림살이를 내다 파는 대목이다.", "warn": false, "search": "Approved For Release 2001/03/05 : CIA-RDP82-00457R000700340003-8 (첫 면의 공개 승인 도장) Approved For Release [판독 불가] (하단에 겹쳐 찍혀 번호가 읽히지 않는 두 번째 도장) 25X1A (헤더에 두 번) WARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT. DDA Memo, 4 Apr 77 / Auth: DDA REG. 77/1763 (비밀해제 근거 도장) 등급 재조정 도장에서 서한 수신자 자리가 뭉개져 [판독 불가]로 옮겼다 Document No. 뒤의 번호가 뭉개져 [판독 불가]로 옮겼다 Economic Information: Shipping from Chinnampo"}, {"id": "N18", "order": 42, "date": "1947-07-11", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "경제 첩보: 북조선의 식량 사정", "badge": "confidential (CONTROL U.S. OFFICIALS ONLY)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-07-11"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Economic Information: Food Conditions in North Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000700340004-7"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000700340004-7"}], "summary": "1947년 2월 기준 북조선 다섯 도시의 쌀값과 식량 배급 구조를 적었다. 소비조합의 현물세 징수, 소련으로의 반출 소문, 삭주의 시위를 함께 다룬다.", "points": ["동해안, 특히 청진과 나남 일대의 부족이 가장 심하다. 조선 동부에서는 쌀을 구하기 어렵고 주식이 옥수수 가루다.", "1두(30근) 쌀값을 도시별로 적었다. 정주 1150원, 의주 1459원, 평양 15590원 [원문 그대로], 함흥 1990원, 청진 2200원이다.", "환율은 소문으로 붙어 있다. 북조선 원과 남조선 원이 1대 5, 남조선 원과 미화가 공식 60대 1, 암시장 350대 1이다.", "**소비조합이 인민위원회 아래에서 식량을 걷고 보관하고 나눈다.** 현물세로 한 해 생산의 약 25퍼센트를 걷고, 모자라면 정부가 정한 낮은 값에 더 사들인다.", "농민은 현물세는 참으나 낮은 값의 매입에는 훨씬 크게 반발한다. 그 반발로 평안북도의 쌀 매입 사업이 일시 중단되었다.", "전임 관리와 공장 노동자가 달마다 쌀이나 옥수수 가루 36근을 받는다. 급여가 700~800원으로 낮아 배급이 보수의 일부로 취급된다.", "주민 대다수가 식량이 소련으로 간다고 믿는다. 역에 쌓인 쌀을 보안대가 지키고 큰 도시에서는 소련군이 지킨다. 정부는 이를 부인하며 오히려 소련이 식량을 들여온다고 성명을 냈다.", "삭주에서 민주청년동맹 맹원들이 보안대 관리와 인민위원회 위원을 때렸다. 중국공산군의 주둔과 그 부대가 지역 식량을 먹는 데 대한 항의다.", "신의주에서는 2월에 학생들이 쌀을 힘으로 빼앗고 절반 값만 치렀다. 농민이 쌀을 들이지 않아 값이 1두 1800원으로 올랐다.", "금 1냥이 32,000원이다. 조선 은 「달러」는 화폐가 아니라 물품으로 돌고 있다고 적혀 있다."], "primary": "[판독 불가]457R000700340004-7\n\n[판독 불가] 33998 [원문 그대로]\n25X1A\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n첩보보고(INTELLIGENCE REPORT)\n기밀(CONFIDENTIAL)   25X1A\n국가   조선(Korea)\n정보(INFO)\n주제   경제 첩보: 북조선의 식량 사정(Economic Information: Food Conditions in North Korea)\n배포(DIST.)  LX July 1947 [원문 그대로]\n25X1A\n이 문서는 중앙정보국장이 [판독 불가]에게 보낸 1775년 [원문 그대로] 10월 16일자 서한에 따라 이로써 기밀(CONFIDENTIAL)로 등급이 재조정됨\n출처(ORIGIN)\n\n25X1X\n\n1. 북조선 전역에서 식량이 갈수록 귀해지고 있으나 가장 심한 곳은 동해안, 특히 청진(Chongjin, Seishin 세이신) (129-49,41-46)과 나남(Nanam, Ranan 라난) (129-41,41-42) 일대다. 농민에게는 아직 먹을 것이 있으나 부족이 느껴지고 있으며 특히 큰 도시에서 그렇다. 조선 동부에서는 쌀을 구하기가 어렵고 많은 곳에서 주식은 옥수수 가루다.\n\n25X1A   2. 다음 도시들의 자유시장에서 다음의 값이 통용된다. [주(注): 최근의 소문은 북조선 원과 남조선 원의 환율을 1대 5로 잡는다. 남조선 원과 미화의 공식 환율은 현재 60대 1, 암시장 환율은 350대 1이다.]\n25X1X\n\n의주(Uiju, Gishu 기슈)        1두(30근)      1459원(Won)   1947년 2월 9일\n(124-32,40+12) [원문 그대로]\n정주(Chongju, Teishu 데이슈)  \"    \"         1150  \"        \"  2월 7일\n(125-12, 39-42)\n평양(Pyongyang, Heijo 헤이조) \"              15590 \" [원문 그대로]  \"  2월 9일\n(125-44, 39-01)\n함흥(Hamhung, Kanko 간코)     \"              1990  \"        \"  2월 14일\n(127-32, 39-54)\n청진(Chongjin)               \"              2200  \"        \"  2월 20일\n\n청진과 함흥에서는 자유시장에서 쌀을 찾기가 매우 어렵고, 그 지역의 주식은 이제 옥수수 가루와 감자다. 정주에는 쌀이 넉넉하다. 식량은 주로 쌀과 옥수수 가루인데 겨울 동안 평안북도에서 청진 방면으로 실려 나갔다. 쌀은 정주 일대에서 평양으로도 옮겨졌다. 청진에는 해산물이 흔하고 값이 싸다.\n\n기밀(CONFIDENTIAL)\n\n등급 구분(CLASSIFICATION) 기밀(CONFIDENTIAL)   미국 관리 전용 통제(CONTROL U.S. OFFICIALS ONLY)\n\n경고 고지: 이 배포처 목록은 본 문서를 공개하기 전에 삭제되어야 한다.\n\n[공개 승인 2001/03/05 : CIA-RDP82-00457R000700[판독 불가]]\n\n문서번호 [판독 불가]\n등급 변경 없음(NO CHANGE in Class.) [원문 그대로]\n근거(Auth.): DDA [판독 불가]\n승인\n일자: 15 APR [판독 불가]   담당: [판독 불가]\n\n[공개 승인 2001/03/05 : CIA-RDP82-00457R000700340004-7]\n\n4. 정부 관리와 여러 단체(여성동맹(Womens League), 노동당(Labor Party) 따위)의 관리 가운데 그 단체 일을 전임으로 하는 사람은 소비조합(Consumers Association)으로부터\n25X1X   달마다 쌀이나 옥수수 가루의 특별 배급을 받고, 여기에 성냥, 수건, 콩기름 같은 다른 물품의 배급이 더해진다. 이들은 달마다 쌀이나 옥수수 가루 36근을 받고, 60세가 넘는 부모 한 사람마다, 그리고 16세 미만의 아이 한 사람마다 18근을 더 받는다. 이 배급은 그들의 근무에 대한 부분적인 보수로 여겨지는데, 그들의 급여가 보통 달에 700원에서 800원 사이여서 다른 사람들이 버는 액수와 견주면 낮기 때문이다. 공장 노동자도 정부 피고용자로 취급되어 쌀 배급을 함께 받는다.\n\n5. 소비조합은 인민위원회(Peoples Committees)의 관할 아래 있으며, 농민에게서 식량을 걷는 일, 식량을 보관하는 일, 정부 피고용자에게 식량을 나누는 일을 맡는다. 농민에게서 걷는 일은 「현물(commodity)」세로 이루어지는데, 농민은 한 해 생산량의 약 25퍼센트를 소비조합에 넘겨야 한다. 현물세나 물품세로 걷은 식량이 모자라면 소비조합의 관리들은 정부가 정한 낮은 값에 농민에게서 식량을 더 사들일 수 있다. 지금 이것이 이루어지고 있으며 농민의 가장 큰 불만 가운데 하나다. 농민은 현물세에 불만이 있으나 참을 마음은 있다. 그보다 훨씬 더 불만인 것은 수확물을 낮은 값에 사 가는 일이다. 농민의 반발로 평안북도에서는 정부의 쌀 매입 사업이 일시 중단되었다. 식량은 농촌 곳곳의 작은 창고에 보관된다. 그런 다음 많은 양이 큰 도시로 옮겨져 그곳에 보관된다. 삭주(Sakchu, Sekushu 사쿠슈) (125-02,40-24), 신의주(Sinuiju, Shingishu 신기슈) (124-24,40-06), 그리고 [판독 불가]에 평안북도의 주요 창고 세 곳이 있다.\n\n6. 주민 대다수는 많은 양의 식량이 소련(USSR)으로 보내졌다고 믿는다. 많은 철도역에 실려 나가기를 기다리는 쌀이 대량으로 쌓여 있다. 이 쌀은 대개 보안대(Peace Preservation Corps) 부대가 지키며, 큰 도시에서는 소련군 초병이 지키거나 소련군과 조선인이 함께 지킨다. 다만 조선 공산정부는 소련이 나라에서 식량을 가져간다는 것을 부인하였고, 소련이 식량을 가져가는 것이 아니라 오히려 들여오고 있다고 지적하는 반대되는 성명을 냈다.\n25X1X\n\n25X1X   7. [삭제]는 소련인들이 실제로 시골로 나가 물품을 징발하였다고 보고한다. [삭제] 모든 물품은 인민위원회가 소비조합을 통하여 걷으며, 그는 조합이 식량을 소련 측에 넘겼다고 보나 그런 일이 실제로 있었던 사례는 알지 못한다.\n\n8. 평안북도의 많은 농촌 마을에 지금의 식량 부족을 소련과 인민위원회 탓으로 돌리는 전단이 나붙었다.\n\n기밀(CONFIDENTIAL)\n미국 관리 전용(U.S. OFFICIALS ONLY)\n\n기밀(CONFIDENTIAL)\n\n[공개 승인 2001/03/05 : CIA-RDP82-00457R000700340004-7]\n\n[공개 승인 2001/63/45 [원문 그대로] : [판독 불가] DP82-00457R000700349904-7 [원문 그대로]]\n\n기밀(CONFIDENTIAL)\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n삭주 일대에서는 정부가 후원하는 단체인 민주청년동맹(Democratic Young Men's League) 맹원들이 조선인 보안대 관리들과 지역 인민위원회 위원들을 상대로 시위를 벌였다. 그 지역에 중국공산군이 주둔하고 있는 것과 이 부대가 그 지역 식량을 먹어 치우는 것에 항의한 것이다. 민주청년동맹 맹원들은 삭주의 보안대 본부에 딸린 관리들과 지역 인민위원회 위원들을 때렸다. 도(道) 정부의 인사들이 삭주에 와서 지역 주민에게 중국공산군은 그들의 벗이며 앞으로 싸움이 벌어지면 중국공산군이 그들을 지켜 줄 것이라고 설명하였다. 중국공산군이 누구로부터 그들을 지켜 준다는 것인지는 언급되지 않았다. [주(注): [삭제], 제4항, 평안북도의 소요에 관한 것.]   25X1A\n\n신의주에서는 19047년 [원문 그대로] 2월 동안 학생들이 쌀값이 너무 비싸다고 여겨 상인들에게서 쌀을 힘으로 빼앗고 부르는 값의 절반만 치렀다. 그러자 농민들이 신의주로 쌀을 가져오기를 거부하여 값이 1두에 1800원까지 올랐다.\n\n1947년 2월 6일 의주의 물가:\n\n쌀               1두(30근)         1450원(Won)\n옥수수 가루       1두                900\n밀가루            1근                 65\n설탕             1근                400\n궐련             갑                  30\n  (그 지역 제조)\n돼지고기          [판독 불가] 근      [판독 불가]\n쇠고기            1근                 30\n\n1947년 2월 20일 청진의 물가:\n\n쌀               1두               2200원(Won)\n쇠고기            1근                100\n생선(6인치 길이)   마리                20\n궐련             갑                  40\n  (그 지역 제조)\n술               1두                 70\n인조견            1자(foot)          400\n감자             1두                900\n\n청진의 큰 상점은 모두 팔 물건이 없어 문을 닫았다. 사고파는 일은 이제 대부분 자유시장에서 이루어진다.\n\n금과 은의 값(북조선 전역?):\n\n금 1냥(liang)                32,000원(Won)\n조선 은 「달러」 1개               270원(Won)   (전에는 1달러가 1원과 같았다.\n                                            이 주화는 근래에 화폐 단위로\n                                            쓰이지 않았고 지금은 하나의\n                                            물품으로 돌고 있다.)\n\n기밀(CONFIDENTIAL)\n\n미국 관리 전용(U.S. OFFICIALS ONLY)\n\n[공개 승인 2001/03/05 : CIA-RDP82-00457R000700340004-7]\n\n25X1A", "secondary": "[판독 불가]457R000700340004-7\n\n[판독 불가] 33998 [원문 그대로]\n25X1A\nCENTRAL INTELLIGENCE GROUP\nINTELLIGENCE REPORT\nCONFIDENTIAL   25X1A\nCOUNTRY   Korea\nINFO\nSUBJECT   Economic Information: Food Conditions in North Korea\nDIST.  LX July 1947 [원문 그대로]\n25X1A\nThis document is hereby regraded to CONFIDENTIAL in accordance with the letter of 16 October 1775 [원문 그대로] from the Director of Central Intelligence to [판독 불가]\nORIGIN\n\n25X1X\n\n1. Food is becoming increasingly scarce in all parts of North Korea, but the greatest scarcity exists along the east coast, especially in the Chongjin (Seishin) (129-49,41-46) - Nanam (Ranan) (129-41,41-42) area. Farmers still have food available but the scarcity is being felt, particularly in the larger cities. It is difficult to obtain rice in eastern Korea and in many places the staple food is cornmeal.\n\n25X1A   2. The following prices prevail in the open market in the following cities: [Note: A recent rumor puts the exchange rate between North Korean Won and South Korean Won at 1:5. The official exchange rate between South Korean Won and U.S. is currently 60:1, black market rate, 350:1.]\n25X1X\n\nUiju (Gishu)          One Tu (30 chin)   1459 Won    9 February 1947\n(124-32,40+12) [원문 그대로]\nChongju (Teishu)      \"     \"            1150  \"     7   \"      \"\n(125-12, 39-42)\nPyongyang (Heijo)     \"                  15590 \" [원문 그대로]   9   \"      \"\n(125-44, 39-01)\nHamhung (Kanko)       \"                  1990  \"    14   \"      \"\n(127-32, 39-54)\nChongjin              \"                  2200  \"    20   \"      \"\n\nIn Chongjin and Hamhung, it is very difficult to find rice on the open market, and the main staple foods in those areas are now cornmeal and potatoes. In Chongju rice is plentiful. Foodstuffs, mainly rice and cornmeal, were shipped out of North Pyongan Province to the Chongjin area during the winter months. Rice has also been moved from the Chongju area to Pyongyang. Seafood is plentiful and inexpensive in Chongjin.\n\nCONFIDENTIAL\n\nCLASSIFICATION CONFIDENTIAL   CONTROL U.S. OFFICIALS ONLY\n\nWARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT.\n\nApproved For Release 2001/03/05 : CIA-RDP82-00457R000700[판독 불가]\n\nDocument No. [판독 불가]\nNO CHANGE in Class. [원문 그대로]\nAuth: DDA [판독 불가]\nApproved\nDate: 15 APR [판독 불가]   By: [판독 불가]\n\nApproved For Release 2001/03/05 : CIA-RDP82-00457R000700340004-7\n\n4. Government officials and officials of the various organizations (such as Womens League, Labor Party, etc.) who work full time for their organizations receive from the Consumers Association\n25X1X   a special food issue of rice or cornmeal each month plus an issue of other commodities such as matches, towels and soybean oil. They receive 36 chin of rice or cornmeal per month and an additional 18 chin for each parent over 60 years of age and each child under 16. This issue is regarded as partial compensation for their services, as their wages are usually between 700 and 800 won per month, which is low in comparison with the amounts earned by other individuals. Factory workers are regarded as government employees and receive the rice issue also.\n\n5. The Consumers Associations, under the jurisdiction of the Peoples Committees, have charge of the collection of foodstuffs from the farmers, the storing of the food, and the distribution of the food to government employees. Collection from the farmers is accomplished through the \"commodity\" tax, which requires the farmer to turn over approximately 25% of his yearly production to the Consumers' Association. If the amount of food collected through the commodity or material tax is insufficient, officials of the Consumers' Association can purchase additional foodstuffs from the farmer at a low price fixed by the government. This is being done at the present time and is one of the greatest sources of discontent for the farmer. The farmer is dissatisfied with the commodity tax but is willing to put up with it. He is much more dissatisfied with the purchase of his harvest at a low price. Opposition of farmers has caused a temporary halt in the government's rice-buying program in North Pyongan Province. The food is stored in small storehouses throughout the rural areas. Large quantities are then moved into the large cities and stored there. Sakchu (Sekushu) (125-02,40-24), Sinuiju (Shingishu) (124-24,40-06) and [판독 불가] contain the three principal storehouses for North Pyongan Province.\n\n6. The great majority of the population believe that large quantities of food have been sent to the USSR. In many railway stations large quantities of rice are awaiting shipment. This rice is usually guarded by Peace Preservation Corps troops, except in the larger cities where Soviet guards or both Soviet and Korean guards are used. The Korean Communist government, however, has denied that the Soviets are taking food from the country and has issued contrary statements which point out that the Soviets are bringing food into the country rather than removing it.\n25X1X\n\n25X1X   7. [삭제] reports that the Soviets actually went out into the country and requisitioned commodities. [삭제] all commodities are collected by the People's Committee through the Consumers' Association, and he believes that foodstuffs have been turned over to the Soviets by the Association but knows of no actual instance in which this was done.\n\n8. Leaflets have appeared in many farm villages in North Pyongan Province blaming the Soviets and the Peoples' Committees for the present food shortage.\n\nCONFIDENTIAL\nU.S. OFFICIALS ONLY\n\nCONFIDENTIAL\n\nApproved For Release 2001/03/05 : CIA-RDP82-00457R000700340004-7\n\nApproved For Release 2001/63/45 [원문 그대로] : [판독 불가] DP82-00457R000700349904-7 [원문 그대로]\n\nCONFIDENTIAL\nCENTRAL INTELLIGENCE GROUP\n\nIn the Sakchu area, members of the Democratic Young Men's League, a government-sponsored organization, demonstrated against Korean Peace Preservation Corps officials and members of the local Peoples Committee in a protest against the presence of Chinese Communist troops in the area and the consumption of local food by these troops. Members of the Democratic Young Men's League beat officials connected with the Peace Preservation Corps Headquarters in Sakchu and officials of the local Peoples Committee. Members of the Provincial Government came to Sakchu and explained to the local people that the Chinese Communists were their friends and that the Chinese Communists would protect them in future fighting. No mention was made of the persons from whom the Chinese Communists would protect them. [Note: [삭제], para four, on riots in North Pyongan Province.]   25X1A\n\nIn Sinuiju during February 19047 [원문 그대로] students thought the price of rice too high and took the rice from the merchants by force, paying them one-half the price asked. Farmers then refused to bring their rice to Sinuiju and the price rose to 1800 won per one Tu.\n\nCommodity prices in Uiju on 6 February 1947:\n\nRice              1 Tu (30 chin)    1450 Won\nCornmeal          1 Tu               900\nFlour             1 Chin              65\nSugar             1 Chin             400\nCigarettes        Pack                30\n  (locally made)\nPork              [판독 불가] Chin     [판독 불가]\nBeef              1 Chin              30\n\nCommodity prices in Chongjin on 20 February 1947:\n\nRice              1 Tu              2200 Won\nBeef              1 Chin             100\nFish (6\" long)    Each                20\nCigarettes        Pack                40\n  (locally made)\nWine              1 Tu                70\nArtificial silk   1 foot             400\nPotatoes          1 Tu               900\n\nAll the large stores in Chongjin have no goods to sell and are closed. Most of the buying and selling is now carried on in the open market.\n\nPrice of gold and silver (throughout North Korea?):\n\n1 liang gold              32,000 Won\n1 Korean silver \"dollar\"     270 Won   (formerly one dollar was equal to one won.\n                                       This coin has not been used in recent years\n                                       as a monetary unit and circulates now as a\n                                       commodity.)\n\nCONFIDENTIAL\n\nU.S. OFFICIALS ONLY\n\nApproved For Release 2001/03/05 : CIA-RDP82-00457R000700340004-7\n\n25X1A", "notes": ["[삭제·공개 표시] Approved For Release 2001/03/05 : CIA-RDP82-00457R000700340004-7 (네 곳의 공개 승인 도장)", "[삭제·공개 표시] Approved For Release 2001/63/45 : DP82-00457R000700349904-7 (숫자가 깨진 채 찍힌 다섯 번째 도장)", "[삭제·공개 표시] 25X1A (헤더에 세 번, 2항 여백과 3면 여백과 말미에 각 한 번)", "[삭제·공개 표시] 25X1X (본문 여백에 다섯 번)", "[삭제·공개 표시] WARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT.", "[삭제·공개 표시] NO CHANGE in Class. / Auth: DDA / Date: 15 APR / By: (비밀해제 근거 도장, 담당자 자리가 뭉개짐)", "[삭제·공개 표시] 7항에서 정보원을 가리키는 자리가 두 군데 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] 삭주 시위 문단 끝의 참조 문헌 표시가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] 등급 재조정 도장에서 서한 수신자 자리가 뭉개져 [판독 불가]로 옮겼다"], "note": "숫자가 이 문서의 핵심이라 한 자리도 고치지 않았다. 2항 물가표의 의주 쌀값은 `1459 Won` 이고 뒤쪽 의주 물가표는 같은 달 6일치를 `1450 Won` 으로 적는다. 날짜도 9일과 6일로 어긋난다. 둘 다 원문대로 두었다. 평양의 `15590` 은 다른 도시가 네 자리인 것과 견주면 한 자리가 남는 값이나 고치지 않았다. 배포일은 `DIST. LX July 1947` 로 찍혀 있다. 목록 자료는 1947년 7월 11일로 적고 있으나 원문의 `LX` 를 숫자로 바꾸지 않았다. 등급 재조정 도장의 연도 `1775` 와 신의주 사건의 `19047` 도 그대로 두었다. 좌표 `(124-32,40+12)` 는 위도의 붙임표가 더하기로 찍혀 그대로 두었다. 나머지 좌표는 온전하다. 문단 번호가 2에서 4로 건너뛴다. 3항이 스캔에서 사라진 것으로 보이나 번호를 새로 매기지 않았다. 3면의 세 문단도 번호 없이 이어진다. 기관 이름은 원문 표기를 앞세우고 옮겼다. `Peace Preservation Corps` 보안대, `Peoples Committees` 인민위원회, `Consumers Association` 소비조합, `Democratic Young Men's League` 민주청년동맹, `Womens League` 여성동맹, `Labor Party` 노동당이다. 한자는 스캔에 없으므로 붙이지 않았다. `Korean Communist government` 는 조선 공산정부로 그대로 옮겼다. 단위는 `Tu` 말(斗), `Chin` 근(斤), `liang` 냥이다. 원문 표기를 살렸다. 의주 물가표의 돼지고기 줄은 단위와 값이 모두 뭉개져 [판독 불가]로 두었다. 지명은 조선 이름과 일본식 이름이 나란히 찍힌 곳을 모두 살렸다. 청진의 일본식 이름은 첫 표에서만 나오고 뒤에서는 조선 이름만 나온다.", "warn": false, "search": "Approved For Release 2001/03/05 : CIA-RDP82-00457R000700340004-7 (네 곳의 공개 승인 도장) Approved For Release 2001/63/45 : DP82-00457R000700349904-7 (숫자가 깨진 채 찍힌 다섯 번째 도장) 25X1A (헤더에 세 번, 2항 여백과 3면 여백과 말미에 각 한 번) 25X1X (본문 여백에 다섯 번) WARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT. NO CHANGE in Class. / Auth: DDA / Date: 15 APR / By: (비밀해제 근거 도장, 담당자 자리가 뭉개짐) 7항에서 정보원을 가리키는 자리가 두 군데 먹칠되어 [삭제]로 옮겼다 삭주 시위 문단 끝의 참조 문헌 표시가 먹칠되어 [삭제]로 옮겼다 등급 재조정 도장에서 서한 수신자 자리가 뭉개져 [판독 불가]로 옮겼다 Economic Information: Food Conditions in North Korea"}, {"id": "N19", "order": 43, "date": "1947-07-11", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "군사 첩보: 북조선의 소련군", "badge": "secret / control U.S. officials only (본문 도장으로 confidential 로 등급 조정됨)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-07-11"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Soviet Troops in North Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000700360008-1"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000700360008-1"}], "summary": "1947년 4월과 5월 신의주, 평양, 진남포, 의주에 있던 소련군의 수와 병과 표지, 열차와 트럭 이동을 열차 차장과 통역에게서 들은 대로 적었다.", "points": ["신의주의 소련군은 약 2,000명으로 보고되고, 다른 정보원은 약 1,500명으로 추산한다. 4월 15일경 평양에서 병력 약 350명을 실은 객차 다섯 량이 증결되어 신의주로 갔다.", "정보원이 열차 차장이다. 평소 소련군에게 배정되는 객차가 두 량인 것을 알기 때문에 증결 다섯 량을 병력 증가로 읽는다. 첩보가 철도 종사자에게서 나온다.", "장교 견장의 병과 표지로 부대 성격을 가린다. 표지 없는 무리가 가장 크고 보병으로 짐작한다. 전차, 항공, 수송, 포병, 통신 표지가 이어진다.", "진남포의 소련군은 석 달 사이 절반 아래로 줄어 2,000명으로 추산된다. 평양 비행장 둘레에는 참호가 파이고 야포 일곱 문이 놓였다.", "의주 파견대는 장교 두 명과 사병 여섯 명뿐이고 주된 일이 형무소 감독이다. 대위가 조사를 서두르라거나 풀어주라고 현지 관리에게 지시한다.", "의주 파견대의 조선인 통역이 압록강 밀수를 보호해 주고 돈과 물자를 받아 대위에게 건넨다고 적었다. 소련군 차량이 물자 운반에 쓰였다.", "옛 일본군 위병소, 옛 일본 경찰부, 옛 일본 해운국, 옛 일본 호텔이 그대로 소련군 시설로 쓰인다."], "primary": "[공개 승인 2001/11/23 : CIA-RDP82-00457R0007[판독 불가]]   25X1A\n\n기밀(CONFIDENTIAL)\n\n비밀/통제 미국 관리 전용(SECRET/CONTROL U.S. OFFICIALS ONLY)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n25X1A\n25X1A\n일자(DATE):\n\n국가  조선(Korea)\n\n[도장: 본 문서는 이로써 [판독 불가] 중앙정보국장(Director of Central Intelligence) [판독 불가]의 서한에 따라 기밀(CONFIDENTIAL)로 등급이 조정되었다 [판독 불가]]\n\n주제  군사 첩보: [판독 불가]\n\n배포(DIST.)  1947년 7월 31일 [원문 그대로]\n면수  3 [판독 불가]\n보충(SUPPLEMENT)\n25X1A\n출처(ORIGIN)  [삭제]\n\n25X1X\n\n1. 신의주(Sinuiju 新義州, 일본식 Shingishu) (12[판독 불가]-2[판독 불가], 10-06 [원문 그대로])의 소련군:\n\n가. 신의주의 소련군 [판독 불가]은 약 2,000명이다. [삭제]   25X1A   는 그 수를 약 1,500명으로 추산한다. 평양(Pyongyang, 일본식 Heijo) (125-44, 39-01)에서 신의주로 가는 열차의 차장   25X1A   에 따르면, 4월 15일경 평양에서 병력 약 350명을 실은 객차 다섯 량이 열차에 증결되었다. 이 객차들의 최종 목적지는 신의주였다. 다섯 량은 평양~신의주 열차에서 소련군에게 평소 배정되는 두 량에 더해진 것이다. 신의주에서 평양으로 가는 열차에는 비슷한 증결이 없었으므로, 차장은 4월 중에 신의주의 소련군 병력이 조금 늘었다고 본다. 같은 차장은 또, 트럭을 실은 무개화차 네 량이 거의 같은 때에 신의주에 도착했으며 그 트럭들이 신의주 주둔 소련군에게 인도되었다고 말한다.\n\n나. 옛 일본군 위병소(Japanese Military Guard Station)에는 122밀리 곡사포와 비슷한 야포 20문이 있다. 이 위병소는 백사(白沙, White Sand) 구역([한자 판독 불가])과 백운(白雲, White Cloud) 구역([한자 판독 불가])을 가르는 경계 가까이에 있다.\n\n다. 신의주에서 관찰된 소련군 장교 견장의 병과 표지:\n\n(1) 가장 큰 무리는 표지가 없는 견장을 달고 있으며 보병으로 짐작된다.   25X1A\n\n(2) 그다음으로 큰 무리는 전차병과 표지를 단다.\n\n(3) 세 번째로 큰 무리는 항공병과 표지를 단다.\n\n(4) 네 번째로 큰 무리는 수송병과와 닮았으나 몇 가지 다른 표지를 단다. 벽돌과 별이 없고, 닻과 큰 쇠망치가 /[판독 불가] 낫과 망치/ 꽃잎을 두른 테로 둘러싸여 있다.\n\n(5) 더 작은 무리들은 포병과 표지를 달고, 비행장 관제탑 부근에서 목격된 장교 두 명은 통신병과 표지를 단다.\n\n경고: 이 배포처 목록은 본 문서를 공개하기 전에 삭제해야 한다.(WARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT.)\n\nILLEGIB(판독 불능 표시)\n\n등급(CLASSIFICATION)\n\n25X1A\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n공개 승인 2001/11/23 : CIA-RDP82-00457R0007[판독 불가]\n\n기밀(CONFIDENTIAL)\n\n25X1X\n\n2. 신의주에서 평양으로 가는 도중에 관찰된 소련군 병사:\n\n가. 4월 1S일 [원문 그대로] 0800시에 신의주를 떠난 열차에는 객차가 여덟 량 있었다. 두 량이 소련군에게 배정되었는데, 이 열차에서 소련군에게 평소 할당되는 수다. 이 객차들에는 좌석과 창문이 있어서 조선인이 타는 객차와 다르다.\n\n나. 열차에는 소련인이 약 150명 타고 있었고, 한 량마다 병사 70명에서 80명이 탔다. 한 량에 탄 병사 70명 가운데 약 20명이 장교였다. 보병, 전차, 항공 병과 표지가 관찰되었다. 전차병과 장교 한 명이 근위 휘장(Guards Badge)을 달고 있었고, 여러 명이 조국전쟁훈장(Order of the War for the Fatherland)과 비슷한 훈장을 달고 있었다. 약장이 아니라 훈장 실물을 달고 있었다. 다른 훈장도 달고 있었으나 무엇인지 가릴 수 없다.\n\n다. 열차에 탄 병사는 저마다 소총이나 기관단총으로 무장하고 있었다. 장교는 저마다 권총을 지녔다. 신의주에서 파손된 소총 약 30정이 객차 한 량에 실렸으며 수리를 위해 평양으로 보내지는 중이었다.\n\n라. 열차에서 소련군 병사에 대한 검사는 없었다. 소련군 객차에 탄 조선인은 신의주 비행장에서 일하는 러시아어 통역 한 명과, 그 통역 및 소련군 병사 여덟 명과 함께 차련관(Charyongwan, 일본식 Sharenkan) (12[판독 불가]-42, 39-52)으로 가서 신의주로 땔나무를 실어 오려는 조선인 인부 일곱 명뿐이었다.\n\n마. 위에 적은 통역에 따르면, 소련군은 차련관 부근의 산 하나를 사들여 땔나무를 모두 그곳에서 얻는다. 나무는 신의주의 각 부대로 보내지고, 차련관 남쪽의 선천(Sonchon, 일본식 Sensen) (124-54, 39-43)과 정주(Chongju, 일본식 Teishu) (125-12, 39-2[판독 불가])에 있는 부대로도 보내진다. 소나무를 실은 무개화차 여러 량이 차련관에서 목격되었다.\n\n3. 평양:\n\n가. 전차병과와 포병과에 속한 장교 여럿이 근위 휘장을 달고 있는 것이 관찰되었다.\n\n나. 평양 비행장 둘레에 참호가 파였고 방어선 둘레 여러 지점에 야포 일곱 문이 놓였다.\n\n4. 진남포(Chinnampo) (125-2[판독 불가], 33-14 [원문 그대로])의 소련군:\n\n가. 진남포의 소련군 수는 지난 석 달 동안 크게 줄었다. 현지 주민들은 소련군 수를 2,000명으로 추산하는데, 석 달 전 그곳에 있던 수의 절반에 못 미친다. 소련군 장교 다수가 표지를 달지 않으며 보병 장교로 짐작된다. 전차병과와 포병과 표지도 진남포에서 보인다.\n\n나. 소련군 장교와 그 가족은 옛 일본 경찰부(Japanese Police Bureau) 부근에 산다. 옛 일본 해운국(Japanese Navigation Bureau)도 소련군 숙영에 쓰인다. 다만 소련군 주력 병영은 시 바깥에 있다.\n\n5. 의주(Uiju, 일본식 Gishu) (12[판독 불가]-32, 40-12)의 소련군 파견대:\n\n가. 소련군 장교 두 명과 사병 여섯 명이 의주의 소련군 파견대 전부다. 이 파견대는 지난 다섯 달 동안 의주에 주둔해 왔다. 지휘관은 MThoV [원문 그대로] 대위(발음에 따른 표기)이고, 부지휘관은 중위다. 대위는 붉은 줄과 붉은 테가 있는 노란 견장을 단다. 이 부대의 주된 임무는 의주 형무소와 관련된 것으로 보이며, 형무소는 주 1회, 대개 토요일에 방문한다. 대위는 현지 형무소 관리들에게 특정 인물의 조사를 서두르라거나, 어떤 이는 풀어주라거나, 어떤 이는 더 조사하도록 붙들어 두라고 지시한다. 대위와 그의 통역은 달마다 한 번 평양으로 간다. 파견대는 옛 일본 호텔에 숙영하고 있다.\n\n나. 통역은 CHEA Inelkiap [원문 그대로]([한자 판독 불가])이라는 조선인이며, 그와 어쩌면 대위까지도 조선과 만주 국경을 넘나드는 현지 밀수와 얽혀 있다. 통역은 밀수꾼들에게 돈과 물자를 받는 대가로 보호를 약속하며, 그 돈과 물자는 대위에게 건네진다고 그가 말한다. 소련군 차량이 압록강(Yalu River) 기슭으로 가서 만주에서 상인들이 가져온 물자를 실어 오는 데 쓰였다.\n\n비밀/통제 미국 관리 전용(SECRET/CONTROL U.S. OFFICIALS ONLY)\n\n공개 승인 2001/11/23 : CIA-RDP82-00457R000[판독 불가]\n\n25X1A\n\n6. 트럭 교통:\n\n소련군은 4월과 5월 동안 서북조선의 차량 수를 늘렸다. 신의주와 평양 사이 도로에서 트럭 통행이 많은 것을 볼 수 있고, 진남포와 평양 사이에서도 그렇다. 4월 16일경 간리(Kanni)([한자 판독 불가]) [Chonni?] (125-12, 9942 [원문 그대로])에 소련군 트럭 100대 넘게 있었다.   ([삭제] 주: [삭제]는 2월에 간리에 트럭 620대가 있다고 보고하였다.)   25X1A   25X1A\n\n기밀(CONFIDENTIAL)\n\n비밀/통제 미국 관리 전용(SECRET/CONTROL U.S. OFFICIALS ONLY)\n\n참고자료실 서고(REFERENCE CENTER LIBRARY)\n3\n\n공개 승인 2001/11/23 : CIA-RDP82-00457R000700360008-1", "secondary": "[Approved For Release 2001/11/23 : CIA-RDP82-00457R0007[판독 불가]]   25X1A\n\nCONFIDENTIAL\n\nSECRET/CONTROL U.S. OFFICIALS ONLY\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\n25X1A\n25X1A\nDATE:\n\nCOUNTRY  Korea\n\n[Stamp: This document is hereby regraded CONFIDENTIAL in accordance with [판독 불가] letter of [판독 불가] Director of Central Intelligence [판독 불가]]\n\nSUBJECT  Military Information: [판독 불가]\n\nDIST.  31 July 1947 [원문 그대로]\nPAGES  3 [판독 불가]\nSUPPLEMENT\n25X1A\nORIGIN  [삭제]\n\n25X1X\n\n1. Soviet Troops in Sinuiju (Shingishu) (12[판독 불가]-2[판독 불가], 10-06 [원문 그대로]):\n\na. [판독 불가] of Soviet troops in Sinuiju is about 2000. [삭제]   25X1A   estimates the number at about 1500. According to a conductor   25X1A   on the train running from Pyongyang (Heijo) (125-44, 39-01) to Sinuiju, five railway cars carrying a total of approximately 350 troops were added to the train in Pyongyang about 15 April. Final destination of the cars was Sinuiju. The five cars were in addition to the two cars normally assigned to Soviet troops on the Pyongyang-Sinuiju train. As no similar addition of cars was made to the train from Sinuiju to Pyongyang, the conductor believes Soviet troop strength was slightly increased in Sinuiju during April. The same conductor also states that four flatcars loaded with trucks also arrived in Sinuiju at approximately the same time and that the trucks were consigned to Soviet Military Forces in Sinuiju.\n\nb. In the former Japanese Military Guard Station, which is near the boundary separating the White Sand District ([한자 판독 불가]) from the White Cloud District ([한자 판독 불가]), there are 20 artillery pieces resembling the 122mm Howitzer.\n\nc. Insignia observed on shoulder boards of Soviet officers in Sinuiju:\n\n(1) Largest group observed wear shoulder boards with no insignia and are believed to belong to the infantry.   25X1A\n\n(2) Second largest group wear tank corps insignia.\n\n(3) Third largest group wear air corps insignia.\n\n(4) Fourth largest group wear insignia resembling that of transportation corps with some differences: the bricks and star are absent, while the anchor and sledge hammers /[판독 불가] hammer and sickle/ are surrounded by a ring of flower petals.\n\n(5) Smaller groups wear the insignia of the artillery corps, and two officers seen in the vicinity of the airport control tower wear signal corps insignia.\n\nWARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT.\n\nILLEGIB\n\nCLASSIFICATION\n\n25X1A\nCENTRAL INTELLIGENCE GROUP\n\nApproved For Release 2001/11/23 : CIA-RDP82-00457R0007[판독 불가]\n\nCONFIDENTIAL\n\n25X1X\n\n2. Soviet Soldiers Observed En Route from Sinuiju to Pyongyang:\n\na. There were eight passenger cars on the train which left Sinuiju at 0800 on 1S April [원문 그대로]. Two passenger cars were assigned to the Soviet troops, the number normally allotted to the Soviets on this train. These cars have seats and windows, differing thereby from the cars in which the Koreans travel.\n\nb. Approximately 150 Soviets were on the train, each car carrying between 70 and 80 soldiers. Of the 70 soldiers in one car, about 20 were officers. Infantry, tank and air corps insignia were observed. One tank corps officer wore the Guards Badge and several wore a decoration resembling the Order of the War for the Fatherland. The actual decoration, not the ribbon, was worn. Other decorations were worn but cannot be identified.\n\nc. Each soldier on the train was armed with a rifle or sub-machine gun. Each officer carried a pistol. About 30 damaged rifles were loaded on one of the cars in Sinuiju and were being sent to Pyongyang for repair.\n\nd. No inspection of Soviet soldiers was made on the train. The only Koreans who rode in the Soviet cars were a Russian interpreter working at the Sinuiju airfield and seven Korean laborers proceeding with the interpreter and eight Soviet soldiers to Charyongwan (Sharenkan) (12[판독 불가]-42, 39-52) to bring firewood back to Sinuiju.\n\ne. According to the above-mentioned interpreter, the Soviets have purchased a mountain near Charyongwan from which they obtain all their firewood. Wood is shipped to the detachments in Sinuiju and also to detachments south of Charyongwan in Sonchon (Sensen) (124-54, 39-43) and Chongju (Teishu) (125-12, 39-2[판독 불가]). Several flat cars loaded with pine wood were seen at Charyongwan.\n\n3. Pyongyang:\n\na. Several officers belonging to tank and artillery corps were observed wearing the Guards Badge.\n\nb. Trenches have been dug around the Pyongyang airfield and seven artillery pieces placed at different points around the perimeter of the defenses.\n\n4. Soviet Troops in Chinnampo (125-2[판독 불가], 33-14 [원문 그대로]):\n\na. The number of Soviet troops in Chinnampo has been greatly reduced during the last three months. Local residents estimate the number of Soviet troops at 2000, or less than one half the number there three months ago. Many Soviet officers wear no insignia and are believed to be infantry officers. Tank corps and artillery insignia are also seen in Chinnampo.\n\nb. Soviet officers and their families reside in the vicinity of the former Japanese Police Bureau. The former Japanese Navigation Bureau is also used for billeting Soviet troops; however, the main Soviet barracks are outside of the city.\n\n5. Soviet Detachment in Uiju (Gishu) (12[판독 불가]-32, 40-12):\n\na. Two Soviet officers and six Soviet enlisted men comprise the entire Soviet detachment in Uiju. This detachment has been stationed in Uiju for the last five months. Commanding Officer is a Captain MThoV [원문 그대로] (based on pronunciation), while the vice-commander is a first lieutenant. The captain wears a yellow shoulder board with a red stripe and red border. Main duties of the unit appear to be connected with the Uiju prison, which is visited once a week, usually on Saturday. The captain gives orders to local prison officials to speed investigations of certain individuals, release others and hold others for further investigation. The captain and his interpreter make a trip to Pyongyang once a month. The detachment is billeted in the former Japanese Hotel.\n\nb. The interpreter, a Korean named CHEA Inelkiap [원문 그대로] ([한자 판독 불가]), and possibly the captain, are connected with the local smuggling operations across the Korean-Manchurian border. The interpreter promises protection to the smugglers in return for money and materials which he states are given to the captain. Soviet Army vehicles have been used to go to the Yalu River bank and pick up materials brought by the merchants from Manchuria.\n\nSECRET/CONTROL U.S. OFFICIALS ONLY\n\nApproved For Release 2001/11/23 : CIA-RDP82-00457R000[판독 불가]\n\n25X1A\n\n6. Truck Traffic:\n\nThe Soviets increased the number of vehicles in northwest Korea during April and May. Heavy truck traffic on the highway between Sinuiju and Pyongyang can be observed, as well as between Chinnampo and Pyongyang. About 16 April more than 100 Soviet trucks were at Kanni ([한자 판독 불가]) [Chonni?] (125-12, 9942 [원문 그대로]).   ([삭제] Note: [삭제] reported 620 trucks at Kanni in February.)   25X1A   25X1A\n\nCONFIDENTIAL\n\nSECRET/CONTROL U.S. OFFICIALS ONLY\n\nREFERENCE CENTER LIBRARY\n3\n\nApproved For Release 2001/11/23 : CIA-RDP82-00457R000700360008-1", "notes": ["[삭제·공개 표시] Approved For Release 2001/11/23 : CIA-RDP82-00457R000700360008-1 (여러 면의 공개 승인 도장)", "[삭제·공개 표시] 25X1A (표제부, 본문 여백, 각 면에 반복해서 나타난다)", "[삭제·공개 표시] 25X1X (1항과 2항 앞의 인적 정보원 면제 표시)", "[삭제·공개 표시] ORIGIN 줄이 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] 1항 가에서 병력 수를 달리 추산한 기관의 이름이 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] 6항 말미 주의 보고 주체가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] WARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT.", "[삭제·공개 표시] ILLEGIB (스캔본에 찍힌 판독 불능 표시)", "[삭제·공개 표시] 본문 도장: This document is hereby regraded CONFIDENTIAL in accordance with [판독 불가]"], "note": "타자본을 마이크로필름으로 뜬 것이라 표제부가 특히 심하게 뭉갰다. SUBJECT 줄이 `Military Infermatd OB` 로 찍혀 뒤가 끊긴다. 제목은 아카이브 메타데이터의 `MILITARY INFORMATION: SOVIET TROOPS IN NORTH KOREA` 를 따랐고 원문 줄에는 [판독 불가]를 두었다. 배포 줄은 `BIST. 31 duly 1947` 로 찍혀 있다. 메타데이터의 날짜는 7월 11일이다. 날짜의 숫자는 고치지 않고 31일 그대로 두었다. 2항 가의 `1S April` 도 고치지 않았다. 1항 가가 `about 15 April` 이라 15일로 읽힐 여지가 있으나 확정하지 않았다. 좌표를 고치지 않았다. 신의주가 `(12h-2%,, 10-06)` 으로 찍혀 위도 앞자리가 1로 나오는데, 같은 문서철의 N20 은 `(124-22, 40-06)`, N21 은 `(124-24, 40-06)` 으로 적는다. 진남포는 `(125-2i,,33=14)` 로 위도가 33-14 인데 N20 의 진남포 좌표와 어긋난다. 6항의 간리는 `(125-12, 9942)` 로 위도가 성립하지 않는 값이다. 정주의 `(125-12, 39-2)` 는 분의 끝 숫자가 빠졌다. 선천은 여기서 `39-43`, N21 에서 `39-48` 이다. 어느 쪽도 고치지 않았다. 1항 가의 `about 1500.7` 에서 끝의 7 은 활자 얼룩으로 보아 옮기지 않았다. 1항 나의 White Sand District 와 White Cloud District 는 한자가 뭉개져 백사와 백운으로 읽었을 뿐 확정되지 않는다. 4항 (4)의 `/-:?- hammer. and slekle/` 는 원문 편집자가 낫과 망치로 고쳐 읽은 삽입구다. 슬래시 삽입 표시를 살렸다. 의주 통역의 이름 `CHEA Inelkiap` 은 조선말 이름의 로마자 표기인데 음절을 가릴 수 없어 한국어를 짓지 않았다. 대위 이름 `MThoV` 도 원문이 발음에 따른 표기라고 밝혀 그대로 두었다. 6항 표제가 `Track Traffie` 로 찍혀 있으나 본문이 트럭 통행을 말하므로 Truck Traffic 으로 읽었다. 스캔에서 6항 표제가 5항 본문 앞으로 밀려 나와 있다. 읽는 차례대로 다시 놓았다.", "warn": false, "search": "Captain MThoV [원문 그대로] (의주 주둔 소련군 파견대 지휘관, 발음에 따른 표기) CHEA Inelkiap [원문 그대로] (의주 파견대의 조선인 통역) Approved For Release 2001/11/23 : CIA-RDP82-00457R000700360008-1 (여러 면의 공개 승인 도장) 25X1A (표제부, 본문 여백, 각 면에 반복해서 나타난다) 25X1X (1항과 2항 앞의 인적 정보원 면제 표시) ORIGIN 줄이 먹칠되어 [삭제]로 옮겼다 1항 가에서 병력 수를 달리 추산한 기관의 이름이 먹칠되어 [삭제]로 옮겼다 6항 말미 주의 보고 주체가 먹칠되어 [삭제]로 옮겼다 WARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT. ILLEGIB (스캔본에 찍힌 판독 불능 표시) 본문 도장: This document is hereby regraded CONFIDENTIAL in accordance with [판독 불가] Military Information: Soviet Troops in North Korea"}, {"id": "N20", "order": 44, "date": "1947-07-12", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "경제 첩보: 서북조선의 교통", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-07-12"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Economic Information: Transportation in Northwest Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000700370011-6"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000700370011-6"}], "summary": "신의주와 평양 사이를 진남포를 거쳐 한 번 왕복한 사람이 본 여객 열차 시각과 요금, 객차 수, 선로 상태, 화물 통행량을 적었다.", "points": ["정보원이 직접 탄 왕복 한 차례가 자료의 전부다. 시각은 대략이라고 문서가 스스로 밝힌다.", "평양~신의주 열차는 객차 여덟 량 가운데 두 량을 소련군용으로 잡아 둔다. 평양~진남포 열차에는 소련군용 객차가 없다.", "신의주~평양의 소요 예정 시간이 2월의 아홉 시간에서 아홉 시간 반으로 늘었다. 요금도 올랐으나 액수가 뭉개져 읽히지 않는다.", "평양과 진남포 사이는 복선이었는데 소련군이 한쪽 선로를 걷어 가서 단선이 되었다.", "화물 통행은 진남포~평양 쪽이 신의주~평양 쪽보다 많다. 왕복 중에 지나친 화물열차 편수와 화차 수를 근거로 든다."], "primary": "[판독 불가]   25X1\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n기밀(CONFIDENTIAL)\n\n국가  조선(Korea)\n[도장: [판독 불가] 중앙정보국장(Director of Central Intelligence) [판독 불가] 미국 국립기록관리청장(Archivist of the United States) [판독 불가] 1978년 4월 2일]\n\n주제  경제 첩보: 서북조선의 교통\n\n접수(INFO.)  [판독 불가]\n배포(DIST.)  1947년 7월 12일 [원문 그대로]\n면수  2\n보충(SUPPLEMENT)  [판독 불가]\n\n25X1\n\n[판독 불가]. 여객 열차 시각표\n\n25X1   (주: 아래 정보는   25X1   진남포(Chinnampo) (125-2[판독 불가], 38-[판독 불가])를 거쳐 신의주(Sinuiju 新義州, 일본식 Shingishu) (124-22, 40-06)와 평양(Pyongyang, 일본식 Heijo) (125-44, 39-01) 사이를 한 번 왕복하는 동안 [얻은] 것이다. 출발과 도착 시각은 대략이다.)\n\n출발지        도착지        출발            도착        비고\n\n신의주        평양          [판독 불가]     1630        요금이 최근 [판독 불가]원(won)으로 올랐다.   25X1A   [판독 불가]에 [판독 불가]. 2월의 요금 [판독 불가]: [판독 불가]. 정시 운행. 소요 예정 시간 아홉 시간 반. (2월의 소요 예정 시간은 아홉 시간.)\n\n평양          진남포        [판독 불가]00    1800        요금 [판독 불가]원(won). 열차에 객차 6량. 정시 운행. 소요 예정 시간 네 시간. 소련군용으로 잡아 둔 객차 없음. 하루 한 편.\n\n진남포        평양          0800            1200        하루 한 편.\n\n평양          신의주        1206 [원문 그대로]   0030   객차 여덟 량. 소련군용으로 두 량을 잡아 둠. 하루 한 편. 기관 고장으로 열차가 세 시간 늦음.\n\n[판독 불가]. 평양과 진남포 사이 철도는 지금 선로변 역 구내를 빼고는 단선이다. 이 노선은 전에 복선이었으나 소련군이 한쪽 선로를 걷어 갔다.\n\n[판독 불가] 장비 [판독 불가]\n\n경고: 이 배포처 목록은 본 문서를 공개하기 전에 삭제해야 한다.(WARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT.)\n\n등급 변경(Class. CHANGED TO): TS  S  C   [판독 불가]   등급(CLASSIFICATION) [판독 불가]\n근거(Auth): DDA REG. 77/[판독 불가]\n일자(Date): 1978년 4월 13일\n\n기밀(CONFIDENTIAL)   25X1\n공개 승인 2003/08/07 : CIA-RDP82-00457R000700370011-6\n\n25X1A\n\n25X1A\n[공개 승인 2003/08/07 : CIA-RDP]82-00457R000700370011-6\n\n기밀(CONFIDENTIAL)\n\n진남포~평양 노선의 화물 통행이 신의주~평양 노선보다 많다. (주: [삭제]는 이 정보를 다음에 근거해 말하였다. 진남포에서 평양으로 가는 동안 무개화차와 유개화차를 일곱 량 내지 여덟 량씩 단 [판독 불가] 열차 두 편과, 무개화차와 유개화차 1[판독 불가]량을 단 화물열차 한 편을 지나쳤다. 신의주에서 평양으로 가는 동안에는 무개화차 여덟 량을 단 화물열차 한 편을 지나쳤다.)\n\n기밀(CONFIDENTIAL)\n\n공개 승인 2003/08/07 : CIA-RDP82-00457R000700370011-6\n\n25X1", "secondary": "[판독 불가]   25X1\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCONFIDENTIAL\n\nCOUNTRY  Korea\n[Stamp: [판독 불가] Director of Central Intelligence [판독 불가] Archivist of the United States [판독 불가] April 2, 1978]\n\nSUBJECT  Economic Information: Transportation in Northwest Korea\n\nINFO.  [판독 불가]\nDIST.  12 July 1947 [원문 그대로]\nPAGES  2\nSUPPLEMENT  [판독 불가]\n\n25X1\n\n[판독 불가]. Passenger Train Schedules\n\n25X1   (Note: The information given below was [obtained] during   25X1   one round trip between Sinuiju (Shingishu) (124-22, 40-06) and Pyongyang (Heijo) (125-44, 39-01) via Chinnampo (125-2[판독 불가], 38-[판독 불가]). The times for departures and arrivals are approximate.)\n\nFrom        To          Depart          Arrive      Remarks\n\nSinuiju     Pyongyang   [판독 불가]     1630        Fare recently increased to [판독 불가] won.   25X1A   [판독 불가] for [판독 불가]. Fare [판독 불가] in February: [판독 불가]. Trip made on schedule. Scheduled time: nine and one-half hours. (Scheduled time in February: nine hours.)\n\nPyongyang   Chinnampo   [판독 불가]00    1800        Fare [판독 불가] won. 6 passenger cars on train. Trip made on schedule. Scheduled time: four hours. No cars reserved for Soviet troops. One train per day.\n\nChinnampo   Pyongyang   0800            1200        One train per day.\n\nPyongyang   Sinuiju     1206 [원문 그대로]   0030   Eight passenger cars. Two passenger cars reserved for Soviets. One train per day. Train delayed three hours because of engine trouble.\n\n[판독 불가]. The railroad between Pyongyang and Chinnampo is now single-tracked except at stations along the line. This line was formerly double-tracked but one track has been removed by the Soviets.\n\n[판독 불가] equipment [판독 불가]\n\nWARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT.\n\nClass. CHANGED TO: TS  S  C   [판독 불가]   CLASSIFICATION [판독 불가]\nAuth: DDA REG. 77/[판독 불가]\nDate: 13 APR 1978\n\nCONFIDENTIAL   25X1\nApproved For Release 2003/08/07 : CIA-RDP82-00457R000700370011-6\n\n25X1A\n\n25X1A\n[Approved For Release 2003/08/07 : CIA-RDP]82-00457R000700370011-6\n\nCONFIDENTIAL\n\nFreight traffic on the Chinnampo-Pyongyang line is heavier than on the Sinuiju-Pyongyang line. (Note: [삭제] based this information on the following: Two [판독 불가] trains, each with seven or eight flatcars and boxcars, and one freight train, with 1[판독 불가] flatcars and boxcars, were passed during the trip from Chinnampo to Pyongyang. One freight train, with eight flatcars, was passed during the trip from Sinuiju to Pyongyang.)\n\nCONFIDENTIAL\n\nApproved For Release 2003/08/07 : CIA-RDP82-00457R000700370011-6\n\n25X1", "notes": ["[삭제·공개 표시] Approved For Release 2003/08/07 : CIA-RDP82-00457R000700370011-6 (두 면의 공개 승인 도장)", "[삭제·공개 표시] 25X1, 25X1A (표제부와 표 안, 각 면 여백에 반복해서 나타난다)", "[삭제·공개 표시] 화물 통행 주에서 정보원 지칭이 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] WARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT.", "[삭제·공개 표시] 1978년 등급 조정 도장: Class. CHANGED TO: TS S C / Auth: DDA REG. 77/[판독 불가] / Date: 13 APR 1978", "[삭제·공개 표시] 표제부 도장: Director of Central Intelligence / Archivist of the United States / April 2, 1978"], "note": "이 문서철에서 스캔 상태가 가장 나쁜 축이다. 본문이 표 하나로 되어 있는데 표의 괘선과 글자가 겹쳐 찍혀 요금과 출발 시각의 숫자가 대부분 살아남지 못했다. 숫자를 짐작해 채우지 않고 [판독 불가]로 두었다. 표는 원문의 다섯 칸을 그대로 유지해 옮겼다. 신의주 출발 시각은 `CCG`, 평양 출발 시각은 `TOO` 로 찍혀 있어 어느 숫자도 세울 수 없다. 평양발 신의주행의 출발 시각은 `1206` 으로 읽히나 1200 일 가능성이 있어 원문대로 두었다. 요금 단위는 `won` 이므로 원으로 옮기되 원문 표기를 병기했다. 좌표를 고치지 않았다. 진남포가 `(1. 25-2h,, 38ahk` 로 찍혀 도와 분의 뒷자리가 살지 않는다. 신의주 `(124-22, 40-06)` 과 평양 `(125-44, 39-01)` 은 온전하다. 같은 문서철의 N19 는 신의주를 `(12h-2%,, 10-06)`, 진남포를 `(125-2i,,33=14)` 로 적어 어긋난다. 어느 쪽도 고치지 않았다. 절 번호가 표 앞뒤로 모두 뭉개져 [판독 불가]로 두고 번호를 새로 매기지 않았다. 표 다음의 짧은 표제 `=e eauinent No` 는 차량이나 장비에 관한 항목의 머리로 보이나 확정되지 않아 [판독 불가]로 두었다. 1978년의 등급 조정 도장 두 개가 1947년 본문 위에 겹쳐 찍혀 있다. 본문과 구별해 적었다.", "warn": true, "search": "Approved For Release 2003/08/07 : CIA-RDP82-00457R000700370011-6 (두 면의 공개 승인 도장) 25X1, 25X1A (표제부와 표 안, 각 면 여백에 반복해서 나타난다) 화물 통행 주에서 정보원 지칭이 먹칠되어 [삭제]로 옮겼다 WARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT. 1978년 등급 조정 도장: Class. CHANGED TO: TS S C / Auth: DDA REG. 77/[판독 불가] / Date: 13 APR 1978 표제부 도장: Director of Central Intelligence / Archivist of the United States / April 2, 1978 Economic Information: Transportation in Northwest Korea"}, {"id": "N21", "order": 45, "date": "1947-07-14", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "정치 첩보: 북조선의 민심 이반", "badge": "secret / control U.S. officials only (면 아래 등급 줄은 confidential)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-07-14"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Political Information: Public Discontent in North Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000700620009-1"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000700620009-1"}], "summary": "평안도 세 군의 폭동, 학생 소요, 지식인의 반소 운동, 압록강을 건너는 사람들, 식량 부족과 좁쌀 값을 한 면에 몰아 적었다.", "points": ["정주군, 안주군, 선천군에서 폭동이 잇따라 소련 곡물 창고가 불타고 관청 인원 160명이 살해되었다고 적었다.", "국민학교와 중학교에서 공산주의 교리를 가르치는 데 반발한 학생 소요가 있었다. 해주에서 아홉 명, 신의주에서 5,000명이 붙잡혔다고 적었다. 두 숫자의 자릿수 차이가 크다.", "지식인들이 평양, 영흥, 안주, 함흥에서 반소 운동을 일으키고 안주와 선천을 거쳐 신의주와 안둥으로 빠져나간다. 만주에서 군사 조직을 만들어 돌아오려 한다고 적었다.", "명단에 든 원주는 소련 지구가 아니라고 문서가 스스로 단다. 남조선 지명이 섞여 들어온 것을 편집자가 알아본 것이다.", "날마다 여든 명이 넘게 압록강을 건너간다. 정치적 자유가 없어서라고 적었다.", "좁쌀 한 부대 16킬로그램이 2,700엔이다. 원문 편집자가 단위가 무엇인지 되묻는 삽입구를 달았다.", "종자를 대주지 못해 농민이 농사를 놓고 있다는 앞선 보고를 주로 붙였다."], "primary": "[공개 승인 2001/03/05 : CIA-RDP]82-00457R000700620009-1\n\n[본 문서는] 개정된 간첩법(Espionage Act) 미국법전 제50편 제[판독 불가]조 및 제32조가 [정한 뜻 안에서 미국의 국방에 관계되는 정보를 담고 있다]. 그 내용을 권한 없는 자에게 전달하거나 [어떤] 방식으로든 누설하는 것은 법으로 금지된다.\n\n비밀/통제 미국 관리 전용(SECRET/CONTROL U.S. OFFICIALS ONLY)   25X1A\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n25X1X\n국가  조선(Korea)\n접수(INFO.)  [판독 불가]\n주제  [정치] 첩보: [북조선]의 민심 이반\n배포(DIST.)  1947년 7월 1[판독 불가]일\n25X1A  면수  1\n25X1X\n\n1. 정주(Chongju, 일본식 Teishu)군([한자 판독 불가]), 안주(Anju, 일본식 Anshu)군([한자 판독 불가]), 선천(Sonchon, 일본식 Sensen)군([한자 판독 불가])에서 폭동이 여러 차례 일어났다. 소련 [판독 불가] 곡물 창고 여러 곳에 불이 났고, 「공안 및 식량부족국(Bureau of Public Safety and Food Shortages)」의 인원 160명이 (이 지역에서?) 살해되었다.   25X1A   ([삭제] 주: 북조선의 폭동에 관한 앞선 보고는 [삭제].)   25X1A\n\n2. 국민학교와 중학교 학생들이 공산주의 교리를 배우도록 강요당하는 까닭에 북조선에서 학생 폭동이 일어났다. 지방 당국은 헌병을 불러 이 폭동 참가자들을 붙잡게 하였다. 해주(Haeju, 일본식 Kaishu) (125-42, 3[판독 불가]-02)에서 학생 아홉 명이, 신의주(Sinuiju, 일본식 Shingishu) (124-24, 40-06)에서 5,000명이 붙잡혔다.   25X1\n\n3. 지식인 다수가 평양(Pyongyang, 일본식 Heijo) (125-44, 39-01), 영흥(Yonghung, 일본식 Eiko) (127-14, 39-32), 안주(Anju, 일본식 Anshu) (125-[판독 불가], [판독 불가]), 함흥(Hamhung, 일본식 Kanko) (127-32, 39-54), 원주(Wonju, 일본식 Genshu) (127-56, 37-20)에서 반소 운동을 일으켰다.   25X1A   ([삭제] 주: 소련 지구가 아니다.) 그들 가운데 다수가 이 지역을 떠나 안주와 선천(Sonchon, 일본식 Sensen) (124-54, 39-48)을 거쳐 신의주와 안둥(Antung 安東) (124-23, 40-09)으로 갔다. 이들은 만주에서 군사 조직을 만들어 그 조직과 함께 북조선으로 돌아오기를 바라고 있다.\n\n4. 날마다 여든 명이 넘는 사람이 압록강(Yalu River)을 건너 만주로 넘어간다. 대부분은 반소 인사이며 정치적 자유를 허락받지 못해 집을 떠났다.\n\n5. 평양, [판독 불가], 원주 읍내에 식량이 모자란다. 좁쌀 한 부대(16킬로그램)가 2,700엔(yen)에 팔린다 [이것은 [판독 불가]인가?]. 대부분의 사람은 「술지게미(distillers' grain)」로 연명하고 있다.   25X1A   봄 논밭갈이는 [판독 불가]하다.   25X1X   ([삭제] 주: [삭제]는 1947년 3월 27일과 5월 1일 사이에 북조선의 농민들이 정부가 종자를 대주지 못한 탓에 농사를 [버리고 있다]고 보고하였다.)\n\n기밀(CONFIDENTIAL)\n\n등급(CLASSIFICATION)  기밀(CONFIDENTIAL)  통제 미국 관리 전용(CONTROL U.S. OFFICIALS ONLY)\n\n문서 번호 [판독 불가]\n등급 변경 없음(NO CHANGE in Class.)\n[판독 불가] 참고자료실(REFERENCE CENTER) [판독 불가]\n등급 변경(Class. CHANGED TO): TS  S  [판독 불가]\n\n공개 승인 2001/03/05 : CIA-RDP82-00457R000700620009-1\n일자(Date): [판독 불가]   담당(By): [판독 불가]", "secondary": "[Approved For Release 2001/03/05 : CIA-RDP]82-00457R000700620009-1\n\n[This document contains information affecting the national defense of the] United States within [the meaning of the] Espionage Act 50, U.S.C. [판독 불가] and 32, as amended. Its transmission or the revelation of its contents [in any] manner to an unauthorized person is prohibited by law.\n\nSECRET/CONTROL U.S. OFFICIALS ONLY   25X1A\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\n25X1X\nCOUNTRY  Korea\nINFO.  [판독 불가]\nSUBJECT  [Political] Information: Public Discontent in [North Korea]\nDIST.  1[판독 불가] July 1947\n25X1A  PAGES  1\n25X1X\n\n1. Many riots have occurred in Chongju (Teishu)-gun ([한자 판독 불가]), Anju (Anshu)-gun ([한자 판독 불가]) and Sonchon (Sensen)-gun ([한자 판독 불가]). Several Soviet [판독 불가] granaries have been set on fire and 160 persons of the \"Bureau of Public Safety and Food Shortages\" (in these areas?) have been murdered.   25X1A   ([삭제] Note: [삭제] for previous reports on riots in North Korea.)   25X1A\n\n2. There have been student riots in North Korea because primary and middle school students are compelled to study Communist doctrines. The local authorities have called upon the military police to arrest these rioters. Nine students [were] arrested at Haeju (Kaishu) (125-42, 3[판독 불가]-02) and 5000 persons at Sinuiju (Shingishu) (124-24, 40-06).   25X1\n\n3. Many intellectuals have started an anti-Soviet movement in Pyongyang (Heijo) (125-44, 39-01), Yonghung (Eiko) (127-14, 39-32), Anju (Anshu) (125-[판독 불가], [판독 불가]), Hamhung (Kanko) (127-32, 39-54) and Wonju (Genshu) (127-56, 37-20).   25X1A   ([삭제] Note: Not in Soviet zone.) Many of them have left these places for Sinuiju and Antung (124-23, 40-09) via Anju and Sonchon (Sensen) (124-54, 39-48). They hope to form a military unit in Manchuria and to return with this unit to North Korea.\n\n4. Every day more than eighty persons cross the Yalu River into Manchuria. Most of them are anti-Soviet and have left their homes because they were not allowed political freedom.\n\n5. There is a scarcity of food in the town of Pyongyang, [판독 불가] and Wonju. A bag of millet (16 kilograms) is sold for 2700 yen [are these [판독 불가]?]. Most people are living on \"distillers' grain\".   25X1A   It is [판독 불가]ssible for the spring tilling of the fields to take place.   25X1X   ([삭제] Note: [삭제] reported that between 27 March and 1 May 1947, farmers in North Korea were [leaving their] farms because of failure of the government to supply them with seeds.)\n\nCONFIDENTIAL\n\nCLASSIFICATION  CONFIDENTIAL  CONTROL U.S. OFFICIALS ONLY\n\nDocument No. [판독 불가]\nNO CHANGE in Class.\n[판독 불가] REFERENCE CENTER [판독 불가]\nClass. CHANGED TO: TS  S  [판독 불가]\n\nApproved For Release 2001/03/05 : CIA-RDP82-00457R000700620009-1\nDate: [판독 불가]   By: [판독 불가]", "notes": ["[삭제·공개 표시] Approved For Release 2001/03/05 : CIA-RDP82-00457R000700620009-1 (앞뒤 공개 승인 도장)", "[삭제·공개 표시] 25X1, 25X1A, 25X1X (표제부와 각 항 여백에 반복해서 나타난다)", "[삭제·공개 표시] 1항, 3항, 5항의 편집자 주에서 참조 보고와 보고 주체가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] 표제부 간첩법 고지문의 일부가 다른 인쇄와 겹쳐 읽히지 않는다", "[삭제·공개 표시] Document No. / NO CHANGE in Class. / Class. CHANGED TO: TS S (등급 처리 도장)"], "note": "한 면짜리 보고인데 표제부에 간첩법 고지문이 세로로 겹쳐 찍혀 있다. 남은 조각으로 문장을 세우되 사라진 대목은 대괄호로 감싸 표시했고 조문 번호는 짓지 않았다. `50, U.S.C. 32 and` 로만 남아 앞 조문 번호를 [판독 불가]로 두었다. 배포 줄이 `BE July 1947` 로 찍혀 날짜의 십의 자리만 살았다. 메타데이터는 7월 14일이다. 숫자를 고치지 않고 `1[판독 불가]` 로 두었다. 좌표를 고치지 않았다. 해주가 `(125-42, 3@-02)` 로 찍혀 위도 앞자리가 뭉개졌다. 안주는 `(125 5ohO, Pail a` 로 찍혀 분 이하가 살지 않는다. 선천은 여기서 `39-48`, 같은 문서철 N19 에서 `39-43` 이다. 어느 쪽도 고치지 않았다. 2항의 `Nine students` 와 `5000 persons` 는 자릿수가 크게 어긋나지만 원문이 그렇게 적었다. 신의주 쪽은 학생이 아니라 사람 수로 적혀 있다. 5항의 좁쌀 값 `2700 gen` 은 yen 으로 읽고 숫자는 손대지 않았다. 뒤에 붙은 `[are these ...?]` 는 원문 편집자가 단위를 되묻는 삽입구인데 안쪽 낱말이 뭉개져 [판독 불가]로 두었다. 이 계열의 다른 문서가 원(won)을 쓰는 것과 어긋나는 대목이라 편집자도 걸린 것으로 보인다. 같은 항의 `It is ssible` 은 앞 글자가 떨어져 나가 가능하다는 뜻인지 불가능하다는 뜻인지가 뒤집힌다. 짐작하지 않고 [판독 불가]로 두었다. 군 이름 뒤의 한자는 세 곳 모두 뭉개져 짓지 않았다. `Bureau of Public Safety and Food Shortages` 는 원문 표기 그대로 옮겼다. 당대 북조선의 실제 기구 이름과 맞추지 않았다.", "warn": false, "search": "Approved For Release 2001/03/05 : CIA-RDP82-00457R000700620009-1 (앞뒤 공개 승인 도장) 25X1, 25X1A, 25X1X (표제부와 각 항 여백에 반복해서 나타난다) 1항, 3항, 5항의 편집자 주에서 참조 보고와 보고 주체가 먹칠되어 [삭제]로 옮겼다 표제부 간첩법 고지문의 일부가 다른 인쇄와 겹쳐 읽히지 않는다 Document No. / NO CHANGE in Class. / Class. CHANGED TO: TS S (등급 처리 도장) Political Information: Public Discontent in North Korea"}, {"id": "N22", "order": 46, "date": "1947-07-15", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "군사 첩보: 만주의 새 북조선군", "badge": "confidential / control U.S. officials only", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-07-15"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: New North Korean Army in Manchuria", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000700420004-7"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000700420004-7"}], "summary": "1947년 4월 북조선에서 소련이 훈련시킨 조선인 대부대가 만주로 넘어간 경로와 규모를 적고, 뒤에 이 군대의 이름이 무엇인지를 놓고 그동안의 보고를 견주는 긴 논평을 붙였다.", "points": ["국가란이 조선이 아니라 중국이다. 조선 문서로 분류되지 않은 채 만주 쪽에서 조선을 보고 있다.", "본문은 부대 규모를 약 56,000명으로 적고 뒤의 논평은 50,000명으로 적는다. 한 문서 안에서 숫자가 어긋난다.", "지휘관은 장성급 KIM Un-kap, 44세다. 한자가 뭉개져 이름을 확정할 수 없다.", "5월 7일 수란 동북쪽에서 린뱌오가 이 부대를 사열했다고 적었다. 국민당 첩자를 피해 밤에 산맥을 탔다고 한다.", "공작원 수를 본문은 [판독 불가]명 넘게로, 다음 항은 약 300명으로 낮춰 잡는다. 보고와 평가가 한 면에 나란히 놓인다.", "논평이 이름 문제를 다룬다. 조선의용군, 조선국군, Kyung Bi Dai 경비대, 북조선의용군이 뒤섞이고 무엇이 공식 이름인지 아직 모른다고 적는다.", "임시 정부는 법적으로 군대를 둘 수 없어서 그전에는 「김일성의 군대」나 「북조선인민위원회의 군대」로 불렸다고 설명한다.", "소련군과 미군이 물러간 뒤의 남북 사이 전쟁에 대비해 전투 경험을 쌓게 하는 것이라고 본다. 1947년 7월에 이미 그렇게 읽고 있다."], "primary": "[판독 불가] 공개 승인 2006/11/05 : CIA-RDP82-00457R000700420004-7\n\n문서 번호 [판독 불가]\n등급 변경(Class. CHANGED TO): TS  S  [판독 불가]\nDDA 각서, 4 Apr [판독 불가]\n근거(Auth): DDA REG. 77/[판독 불가]\n\n[도장: 본 문서는 이로써 [판독 불가] 중앙정보국장(Director of Central Intelligence) [판독 불가]의 서한에 따라 기밀(CONFIDENTIAL)로 등급이 조정되었다 [판독 불가]]\n다음 검토 일자: 2008년\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n첩보보고(INTELLIGENCE REPORT)\n\n국가  중국(China)\n\n주제  군사 첩보: 만주의 새 북조선군\n\n배포(DIST.)  1947년 7월 15일\n기밀(CONFIDENTIAL)   면수  2\n25X1   보충(SUPPLEMENT)\n출처(ORIGIN)  [삭제]\n\n1. 1947년 4월 중순경, 새로 편성되고 장비가 좋으며 최근 소련에게 훈련받은 약 56,000명 규모의 조선공산의용군(Korean Communist Volunteer Army)이 초양(Choyang, 일본식 Seizan) (125-18, 20-50 [원문 그대로])을 떠나 소백두산맥(Small Chang Pai mountain range) /Gubeck-san [원문 그대로], 41-52, 128-12?/을 거쳐 만주로 /126-05, [판독 불가]-55? 지점에서/ 들어갔으며, 푸쑹(Fusung 撫松) (127-18, 42-20)을 거쳐 둔화(Tunhua 敦化) (123-14, 43-22)로 갔다. 이 부대의 당시와 현재 지휘관은 장성급인 KIM Un-kap 김운갑([한자 판독 불가]), 44세다.\n\n2. 이 부대는 5월 초에 북쪽으로 이동하여 5월 6일경 주력을 둔화로 들여보냈고, 선발 부대는 그 무렵 수란(Shulan 舒蘭) (126-48, [판독 불가]) 동북쪽으로 움직였다. 이 군의 일부 부대는 1947년 5월 7일 수란 동북쪽 전선 진지에서 린뱌오(LIN Piao 林彪) 장군의 사열을 받았다고 한다. 이들은 국민당 첩자에게 이동을 감추기 위해 밤에 산맥을 타고 움직였고, 새롭고 잘 훈련된 군대로 국민당군 앞에 갑자기 나타나려 하였다.\n\n3. 이 군은 하얼빈(Harbin) 남쪽과 동남쪽의 쑹화강(Sungari River) 방어선을 차지하러 북상하면서, 국민당 점령 지역, 특히 푸순(Fushun 撫順) (123-54, 41-53), 퉁화(Tunghua 通化) (125-57, 43-43 [원문 그대로]), 지린(Kirin 吉林) (126-32, 43-91 [원문 그대로])으로 공작원과 파괴 공작원을 들여보냈다. 이 공작원 가운데 둘은 지린의 국민당 정세를 정찰한 뒤, (중국공산군 공격에 앞서) 공작원을 더 들여보낼 준비를 하려고 그 일대를 돌아다녔다. 목적지는 지린과 Gosngcum [원문 그대로]이었다. 공작원 하나는 이 새 군의 지하 공작원 [판독 불가]명 넘게 국민당 여러 거점에 성공적으로 심어졌다고 추산하였다.\n\n25X1\n\n4. 이 군이 국민당 거점에 심은 공작원 수는 약 300명으로 보는 편이 사실에 더 가깝다.\n\n5. 새 군이 만주로 들어간 주된 목적은 5월 공세를 위해 중국공산군을 보강하고, 조선의용군(Korean Volunteer Corps) 소속으로 얼마 전부터 만주에서 중국공산군과 함께 싸워 온 약 20,000명 규모의 조선인 부대를 교대해 주는 것이다. 새 군은 소련이 특별히 훈련시켰고, 소속 대원 일부는 소련제와 일본제 무기, 그 가운데 주로 일본제를 갖춘 부대라고 말하였다. 이 군은 1946년 9월부터 북조선에서 한 부대로 훈련해 왔다. 영관급 장교는 조선의용군의 본래 인원에서 나왔으나, 분대장과 위관급 장교 다수는 북조선의 조선공산당 장교학교(Korean Communist Officers Training Schools) /[판독 불가] 보안대 장교학교(Peace Preservation Corps Officers Training Schools)/를 최근에 나온 자들이다.\n\n등급(CLASSIFICATION)  기밀(CONFIDENTIAL)\n\n공개 승인 2006/11/05 : CIA-RDP82-00457R000700420004-7\n\n25X1\n\n25X1\n\n공개 승인 2006/11/05 : CIA-RDP82-00457R000700420004-7\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n기밀(CONFIDENTIAL)\n\n[논평:]\n\n50,000명 [원문 그대로]의 새 군에 간도(Chientao 間島) 지역의 병력과 이미 하얼빈 지역에 있는 병력을 더하면 만주의 조선의용군(Korean Volunteer Army) 병력은 약 70,000명이 될 것으로 추산된다. (신문들은 80,000명에서 100,000명으로 보도한다.)\n\n[삭제]는 5월에, 북조선 보안훈련대(North Korean Peace Preservation Training Corps) 생도 30,000명이 4월 22일 새 조선군으로 편성되었다고 보고하였다. 또한 동만주에 있던 조선의용군이 해체되어 북조선으로 돌아갔으며 그 해체 명령이 1946년 8월 15일에 내려졌다고 보고된 바 있다. 그때에는 「조선국군(Korean National Army)」이 존재하지 않았으나, 돌아온 조선의용군(군)에서 그런 군대가 만들어지고 있다는 증거가 1946년 10월에 처음 보고되었다. 1946년 11월경 북조선 경비대(North Korean Constabulary), 곧 Kyung Bi Dai 경비대가 새 국군과 합쳐졌다고 보고되었다. 같은 보고는 새 조선군의 이름이 Kyung Bi Dai 가 될 것이라고 적었다. 그러나 더 최근의 다른 보고들은 그 이름이 공식으로는 「북조선의용군(North Korean Volunteer Army)」이 될 수도 있음을 시사한다.\n\n여러 출처의 다른 보고들이 시사하는 바는 이렇다. 북조선 정부가 소련의 뒷받침을 받아 옛 조선의용군을 북조선으로 불러들였고, 그 장교 다수를 소련에서 훈련받은 조선인들과 함께 옛 Kyung Bi Dai 에 넣었으며, 북조선 훈련학교 졸업자들을 Kyung Bi Dai 의 하급 제대에 넣었고, Kyung Bi Dai 를 돌아온 조선의용군 주력과 합쳤으며, 새 군을 Kyung Bi Dai 또는 북조선의용군이라 불렀다는 것이다. 그 전에 북조선 부대는 「KIM Il-sung 김일성의 군대」 또는 「북조선인민위원회(North Korean People's Committee)의 군대」로 알려져 있었다. 주된 까닭은 임시 정부가 법적으로 군대를 둘 수 없기 때문이다.\n\n위의 내용이 사실이라면, 만주로 보내지는 북조선군 부대는 어느 것이든 새 국군의 일부일 가능성이 높고, 비정규 부대는 새 국군에 흡수되면서 사라지기 시작할 것이다.\n\n더 나아가 나타나는 징후는, 북조선 정부가 다시 소련의 도움을 받아 새 군의 큰 부대들을 만주로 보내 중국공산군과 함께 전투 경험을 쌓게 하고 있으며, 이것이 소련군과 미군 점령군이 물러간 뒤 남북조선 사이에 일어날 수 있는 전쟁에 대비한 것이라는 점이다. 조선인 대부대가 자무쓰(Chiamussu 佳木斯) (130-21, 46-29) 일대로 이동하였고 거기서 전선으로 갔다는 보고들이 있다. 이 이동은 1946년 가을과 겨울, 1947년 초의 이동과 다르다. 관련된 부대가 북조선에서 나오고 있고, 앞서 보고된 부대들보다 규모가 훨씬 크다는 점에서 그렇다. 새 「군」들은 대개 소련이 훈련시켰고 일본제나 소련제 무기를 잘 갖추었다고 보고된다. 5월 중국공산군의 창춘(Changchun 長春) 공격에 조선인 부대가 실제로 가담하였는지는 아직 확인되지 않았으나, 이른바 「5월 공세」에 가담하고 있으며 주요 전선에서 그 부대가 발견될 것이라는 말은 사실일 수 있다. 유나이티드프레스 주재 특파원은 지린 일대에서 완편 조선인 사단들이 활동하고 있으며 그 가운데 하나가 6월 1일 옌퉁산(Yentungshan 煙筒山) (125-59, 43-17)과 옌퉁산 남쪽 24마일의 피시(Pishih)를 공격하였다고 보도한다 (판스(Panshih 磐石)--125-59, 42-56?).\n\n[판독 불가] 통제 미국 관리 전용(CONTROL U.S. OFFICIALS ONLY)\n\n기밀(CONFIDENTIAL)\n\n공개 승인 2006/11/05 : CIA-RDP82-00457R000700420004-7", "secondary": "[판독 불가] Approved For Release 2006/11/05 : CIA-RDP82-00457R000700420004-7\n\nDocument No. [판독 불가]\nClass. CHANGED TO: TS  S  [판독 불가]\nDDA Memo, 4 Apr [판독 불가]\nAuth: DDA REG. 77/[판독 불가]\n\n[Stamp: This document is hereby regraded CONFIDENTIAL [판독 불가] in accordance with [판독 불가] letter of [판독 불가] Director of Central Intelligence [판독 불가]]\nNext Review Date: 2008\n\nCENTRAL INTELLIGENCE GROUP\nINTELLIGENCE REPORT\n\nCOUNTRY  China\n\nSUBJECT  Military Information: New North Korean Army in Manchuria\n\nDIST.  15 July 1947\nCONFIDENTIAL   PAGES  2\n25X1   SUPPLEMENT\nORIGIN  [삭제]\n\n1. About mid-April 1947 a new, well equipped and recently Soviet-trained Korean Communist Volunteer Army of approximately 56,000 men departed from Choyang (Seizan) (125-18, 20-50 [원문 그대로]) and entered Manchuria /at 126-05, [판독 불가]-55?/ via the Small Chang Pai mountain range /Gubeck-san [원문 그대로], 41-52, 128-12?/, traveling to Tunhua (123-14, 43-22) via Fusung (127-18, 42-20). The commander of these troops then and at present is KIM Un-kap ([한자 판독 불가]), of general officer rank, aged 44.\n\n2. These troops traveled northward during early May, moving the main body of their forces into Tunhua about 6 May, with advanced units moving northeast of Shulan (126-48, [판독 불가]) about that date. Some units of the army were said to have been reviewed by General LIN Piao at front line posts northeast of Shulan on 7 May 1947. They traveled the mountain ranges at night in order to hide their movements from Nationalist spies and suddenly to confront the Nationalist forces with a fresh, well trained army.\n\n3. As the army progressed northward to occupy the Sungari River defense line south and southeast of Harbin, it also dispatched agents and saboteurs into Nationalist-held areas, particularly Fushun (123-54, 41-53), Tunghua (125-57, 43-43 [원문 그대로]), and Kirin (126-32, 43-91 [원문 그대로]). Two of these agents, after scouting the Nationalist situation at Kirin, traveled through the area to prepare for the entry of more agents (in advance of the Chinese Communist attack) into Kirin and Gosngcum [원문 그대로]. One of the agents estimated that over [판독 불가] underground agents of the new army had been successfully planted in various Nationalist centers.\n\n25X1\n\n4. A more nearly accurate estimate of the number of agents planted by this army in Nationalist centers would be about 300.\n\n5. The chief purpose of the new army's entry
