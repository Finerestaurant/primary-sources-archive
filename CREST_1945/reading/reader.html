ion Day)」.\n북조선 노동법령 발표.\n북조선에서 시행할 농업현물세제(Agricultural Products Tax System) 발표.\n노동법령 발표를 축하하는 대회.\n평안남도 인민위원회 제3차 전체회의.\n보통강 지구 복구 완료 축하식.\n남녀평등권 법령 발표.\n북조선민주주의민족통일전선위원회(North Korea Democratic National Unified Front Committee) 결성.\n북조선공산당(North Korea Communist Party)과 신민당(New Democratic Party)의 합당 발표.\n\n본 문서는 개정된 간첩법(Espionage Act, 50 U.S.C. 31조 및 32조)이 정한 뜻에서 미합중국의 국방에 관계되는 정보를 담고 있다. 이 문서를 전달하거나 그 내용을 어떠한 방법으로든 권한 없는 자에게 누설하는 것은 법으로 금지된다.\n\n기밀(CONFIDENTIAL)\n\n공개 승인(Approved For Release) 2001/03/05 : CIA-RDP82-00457R000500860007-9", "secondary": "Approved For Release 2001/03/05 : CIA-RDP82-00457R000500860007-9\n\n25X1A\n\nCONFIDENTIAL\n\nCENTRAL INTELLIGENCE GROUP   73935\n\nINTELLIGENCE REPORT\n\nCOUNTRY  Korea            DATE:\nINFO.  See Below\nSUBJECT  Political Information: Main Events of the Year Following the Liberation of North Korea\nDIST.  [판독 불가] May 1947\nPAGES  3\n25X1A\nORIGIN\nSUPPLEMENT\n25X1X\n\nDISTRIBUTION\nSTATE | WAR | NAVY | AIR | [판독 불가]\n\n25X1A  (Note: This report is a translation of a pamphlet which is entitled \"Main Events of the Year Following the Liberation of North Korea\" and which, according to the source, is circulated among Peace Preservation Offices in North Korea. It is disseminated for the possible value of the dates and as reference material.)\n\n15 August 1945    Japanese Emperor declares unconditional surrender of Japan.\n\n16 August 1945    All political prisoners and those arrested for illegal business practices released from jail throughout Korea (North Korea?).\n                  Preparatory Committee for the Establishment of the State (?) Government formed in Pyongan-namdo.\n\n17 August 1945    Pyongan-namdo Committee of the Korean Communist Party formed.\n\n1[판독 불가] August 1[판독 불가]5    Taking over of all Japanese offices begun.\n\n25 August 1945    Soviet Army advances into Korea and announces the liberation and independence of Korea.\n\n27 August 1945    Pyongan-namdo People's Committee formed.\n\n1[판독 불가] October 1945    City mass meeting held. General KIM Il-sung ([한자 판독 불가]) makes victory speech and announces plans for future.\n\n20 October 1945   North Korea Branch Bureau of the Korean Communist Party established.\n\n3 November 1945   Demonstration held commemorating the \"Kwang-ju Student Incident\". Korean Democratic Party formed.\n\n7 November 1945   Demonstration held commemorating the Soviet October Revolution.\n\n25 November 1945  Cultural Professional League formed.\n\n30 November 1945  Head Office of the National Council of Labor Unions established in North Korea.\n\nCLASSIFICATION CONFIDENTIAL\n\nDocument No. [판독 불가]\nNO CHANGE in Class. [판독 불가]\nDECLASSIFIED\nClass. CHANGED TO: TS S [판독 불가]\nDDA Memo, 4 Apr 77\nAuth: [판독 불가]\nDate: [판독 불가]\n\nApproved For Release 2001/03/05 : CIA-RDP82-00457R000500860007-9\n\n[두 번째 면. 원문은 날짜 칸과 사건 칸의 두 단으로 되어 있으나 OCR 에서 두 단이 따로 떨어져 나왔다. 어느 날짜에 어느 사건이 붙는지 확정할 수 없어 짝지어 옮기지 않고 인쇄된 차례대로 두 칸을 나누어 적는다.]\n\n[날짜 칸, 인쇄된 차례대로]\n11 December 1945\n1[판독 불가] December 1945\n[판독 불가] December 1945\n2[판독 불가] December 1945\n[판독 불가] January 1946\n16 January 1946\n20 January 1946\n31 January 1946\n[판독 불가] February 1946\n7 February 1946\n[판독 불가] February 1946\n10 February [판독 불가]\n23 February [판독 불가]\n1 March 1946\n6 March [판독 불가]\n[판독 불가] March [판독 불가]\n2[판독 불가] March 1926 [원문 그대로]\n23 March 1946\n2[판독 불가] March [판독 불가]\n5 April 1926 [원문 그대로]\n1 May 1946\n[판독 불가] May 1946\n[판독 불가] May 1446 [원문 그대로]\n\n[사건 칸, 인쇄된 차례대로]\nGeneral KIM Il-sung appointed secretary of the North Korea Branch of the Korean Communist Party.\nMoscow Foreign Ministers Conference.\nFormation of the Women's League.\nPeople's demonstration in support of the Big Three Foreign Ministers' Conference.\nBig Three Foreign Ministers' Conference hands down decision on Korea.\nFirst Russo-American Committee meeting begun.\nNorth Korean Democratic Youth League formed.\nFirst general committee meeting of the Pyongan-namdo People's Committee.\nNorth Korea Committee of the National Farmers' League formed.\nRusso-American Conference ends.\nKorean Democratic Party meets.\nRailway Workers Union meeting begun.\nNorth Korea People's Committee established. Chairman KIM Il-sung announces 11 Political Principles.\nMass meeting held celebrating the establishment of the North Korea People's Committee.\nCelebration of the 2[판독 불가]th anniversary of the formation of the Soviet Army.\nMarch 1 demonstration.\nNorth Korea Land Reform Program announced.\nPyongyang Cooperative League formed.\nSecond general meeting of Pyongan-namdo People's Committee.\nSecond meeting of the Russo-American Committee.\nChairman KIM Il-sung announces 20 Political Principles.\nPlans completed for Land Reform Program in North Korea.\nFormation of the North Korea Teachers and Professional Workers League.\nEstablishment of the North Korea Farmers' Bank.\nMay 1 demonstration.\nBoys' Day Celebration.\nAdjournment of Russo-American Committee for indefinite period.\n\nCONFIDENTIAL\n\nApproved For Release 2001/03/05 : CIA-RDP82-00457R000500860007-9\n\n[세 번째 면. 여기도 두 단이 따로 떨어져 나왔다.]\n\n73935\n\n[날짜 칸, 인쇄된 차례대로]\n[판독 불가] May 1946\n9 May 1946\n19 May 1946\n21 Ma[판독 불가] 1946\n1[판독 불가] June 1946\n24 June 1926 [원문 그대로]\n27 June 1946\n30 June 1946\n1 July 1946\n15 July 1946\n30 July 1946\n\n[사건 칸, 인쇄된 차례대로]\nFormation of the North Korea Physical Education League.\n[판독 불가] Celebration.\nDemonstration calling for the annihilation of such leaders as I [판독 불가]-man (Rhee Syng-man) and KIM Koo.\nRepairing begun of damage caused by flooding of Bot'ong River.\n\"Increase Production Day\".\nAnnouncement of North Korea labor laws.\nAnnouncement of the Agricultural Products Tax System to be used in North Korea.\nMeeting to celebrate announcement of the labor laws.\nThird general meeting of Pyongan-namdo People's Committee.\nCelebration of the completion of repairs in the Bot'ong River Area.\nAnnouncement of laws giving equal rights to men and women.\nFormation of the North Korea Democratic National Unified Front Committee.\nAnnouncement of the coalition of the North Korea Communist Party and the New Democratic Party.\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nCONFIDENTIAL\n\nApproved For Release 2001/03/05 : CIA-RDP82-00457R000500860007-9", "notes": ["[삭제·공개 표시] 25X1A (첫 면 머리와 머리주 왼쪽 여백)", "[삭제·공개 표시] 25X1X (ORIGIN 줄 아래)", "[삭제·공개 표시] Approved For Release 2001/03/05 : CIA-RDP82-00457R000500860007-9 (네 곳의 공개 승인 도장)", "[삭제·공개 표시] Document No. / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S / DDA Memo, 4 Apr 77 / Auth / Date (등급 변경 도장. 채워 넣은 값이 대부분 뭉개져 있다)", "[삭제·공개 표시] DISTRIBUTION 줄의 배포처 목록 일부가 읽히지 않아 [판독 불가]로 옮겼다"], "note": "북조선에서 나온 소책자를 미국이 통째로 옮긴 것이라 원문 자체가 번역문이다. 첫 면은 날짜 칸과 사건 칸이 짝을 이룬 채로 스캔되어 그대로 옮겼다. 둘째 면과 셋째 면은 OCR 에서 두 단이 따로 떨어져 나와 어느 날짜에 어느 사건이 붙는지 알 수 없다. 둘째 면은 날짜 23개에 사건 27개, 셋째 면은 날짜 11개에 사건 13개로 수가 맞지 않아 한 날짜에 사건이 둘 이상 붙는 곳이 있다. 짝을 지으면 없는 날짜가 생기므로 짝짓지 않고 두 칸을 나누어 그대로 실었다. 날짜의 숫자는 한 자리도 채우지 않았다. `2] March 1926` `5 April 1926` `& Wey 1446` `24 Jane 1926` 처럼 연도가 1926년이나 1446년으로 찍힌 것이 넷 있다. 1946년이 분명해 보이나 고치지 않고 [원문 그대로]로 두었다. 달 이름은 낱말이므로 `Decerber` `Uareh` `Fehruary` `Hay` `Jane` `Inly` 를 고쳐 읽었다. `21 Mar 1946` 은 3월인지 5월인지 가릴 수 없어 달을 [판독 불가]로 두었다. 소련군 창설 기념 `2fth anniversary` 는 1946년 2월이면 28주년이나 숫자를 채우지 않았다. `1] Political Principles` 는 11개 정강으로 읽었다. `20 Political Prineirles` 는 그대로 20이다. 인명은 원문 표기를 살렸다. 이승만은 `IT Gvanr-nan (Rhee Synp-man)` 으로 찍혀 괄호 안만 Rhee Syng-man 으로 읽었고 앞의 로마자는 확정할 수 없어 [판독 불가]로 두었다. `Keang-ju Student Incident` 는 광주학생사건이다. `Bctlonr iver` 는 평양의 보통강이다. `YeNaw Colehvation` 은 무슨 기념인지 가릴 수 없어 [판독 불가]로 두었다. `Peace Preservation Cffices` 는 보안 관서로 옮겼다. 같은 문서철에서 `Peace Preservation Corps` 는 보안대인데 여기는 Offices 로 찍혀 있어 부대가 아니라 관서로 읽었다. 기관 이름은 원문 영문 표기를 괄호에 함께 남겼다. `Russo-American Committee` 는 미소공동위원회이나 문서가 쓴 순서를 살려 러미가 아니라 미소로 옮기되 영문 표기를 병기했다. 간첩법 조항의 `50,,U.8.0. 31 and 32` 는 31과 32로 읽었다. 오른쪽 위의 `73935` 는 두 면에 찍힌 일련번호로 보아 그대로 남겼다.", "warn": false, "search": "KIM Il-sung 김일성 (조선공산당 북조선분국 책임비서, 북조선인민위원회 위원장으로 나온다) I [판독 불가]-man / Rhee Syng-man 이승만 (1946년 5월 시위의 규탄 대상으로 나온다) KIM Koo 김구 (같은 시위의 규탄 대상) 25X1A (첫 면 머리와 머리주 왼쪽 여백) 25X1X (ORIGIN 줄 아래) Approved For Release 2001/03/05 : CIA-RDP82-00457R000500860007-9 (네 곳의 공개 승인 도장) Document No. / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S / DDA Memo, 4 Apr 77 / Auth / Date (등급 변경 도장. 채워 넣은 값이 대부분 뭉개져 있다) DISTRIBUTION 줄의 배포처 목록 일부가 읽히지 않아 [판독 불가]로 옮겼다 Political Information: Main Events of the Year Following the Liberation of North Korea"}, {"id": "N07", "order": 31, "date": "1947-05-16", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "군사 첩보: 조선인 공산 의용군", "badge": null, "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-05-16"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Korean Communist Volunteer Corps", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000600070001-1"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000600070001-1"}], "summary": "조선인 공산 의용군의 부대별 지휘관과 병력, 소재지를 적은 한 쪽짜리 전투서열표다. 국가는 중국으로 분류되어 있다.", "points": ["국가 칸이 조선이 아니라 중국(China)으로 되어 있다. 만주에 있는 조선인 부대를 중국 문서로 다룬 것이다.", "부대마다 지휘관 이름을 조선식 로마자와 한자, 그리고 중국식 독음을 나란히 적었다.", "제1여단 5,000, 제3여단 1,500, 제4여단 4,000, 제5여단 4,000, 제6여단 1,200, 이름 없는 부대 5,200으로 적었다. 사령부와 제2여단은 병력 미상이다.", "만주와 조선 국경을 따라 있는 조선인 부대로 강계(Kang-kye) 군구를 따로 적었다. 지휘관은 Kim Hui-yong 이다.", "강계 군구 아래에 제13·14·15여단과 기병연대를 두었고 병력은 모두 미상이다.", "소재지는 옌지, 하얼빈, 멍장(126-48, 42-23)과 미상이 섞여 있다."], "primary": "국가  중국(China)\n\n주제  군사 첩보: 조선인 공산 의용군(Korean Communist Volunteer Corps)\n\n출처(ORIGIN)\n25X1X\n\n공개 승인(Approved For Release) 2001/03/05 : CIA-RDP82-00457R000608070001-1 [원문 그대로]\n\n25X1A\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n일자:  25X1C\n입수(INFO.)\n배포(DIST.)  1947년 5월 16일\n면수  1\n25X1A\n보충(SUPPLEMENT)\n\n부대, 번호                        지휘관                                  병력\n\n조선인 공산 의용군 사령부          Kim [판독 불가] ([한자 판독 불가])      미상\n(Korean Communist                 [중국식 독음 Chin Ah-yen] [판독 불가]\nVolunteer Army Hqs.)\n\n제1여단                           Im Sung-ya ([한자 판독 불가])            5,000\n                                  [중국식 독음 Lin Sheng-yu]\n\n제2여단                           Choe Chong-ok ([한자 판독 불가])         미상\n                                  [중국식 독음 Tsui Ching-yu]\n\n제3여단                           Bang Sin-tae ([한자 판독 불가])          1,500\n                                  [중국식 독음 Chieng Hsin-tai]\n\n제4여단                           Lee Seng-ayong [원문 그대로] ([한자 판독 불가])   4,000\n                                  [중국식 독음 Li Hsing-ming]\n\n제5여단                           미상                                    4,000\n\n제6여단                           미상                                    1,200\n\n[부대명 미상]                      미상                                    5,200\n\n\n만주와 조선 국경을 따라 있는 조선인 부대(Korean Troops Along the Manchurian-Korean Border)\n\n강계(Kang-kye 江界, [한자 판독 불가]) [중국식 독음 Chiangchieh] 군구(Military District)\n\n                                  Kim Hui-yong ([한자 판독 불가])\n                                  [중국식 독음 Chin Hui-jung]\n\n제13여단                          미상\n제14여단                          미상\n제15여단                          미상\n\n기병연대(Cavalry Regiment)\n\n\n소재지(Location)\n\n옌지(Yenchi 延吉)\n하얼빈(Harbin 哈爾濱)\n미상\n옌지\n미상\n\n옌지\n미상\n\n멍장(Meng-chiang 蒙江) (126-48, 42-23)", "secondary": "COUNTRY  China\n\nSUBJECT  Military Information: Korean Communist Volunteer Corps\n\nORIGIN\n25X1X\n\nApproved For Release 2001/03/05 : CIA-RDP82-00457R000608070001-1 [원문 그대로]\n\n25X1A\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nDATE:  25X1C\nINFO.\nDIST.  16 May 1947\nPAGES  1\n25X1A\nSUPPLEMENT\n\nUnit, Number                    Commander                          Strength\n\nKorean Communist                Kim [판독 불가] ([한자 판독 불가])   unknown\nVolunteer Army Hqs.             [Chin Ah-yen] [판독 불가]\n\n1st Brigade                     Im Sung-ya ([한자 판독 불가])        5,000\n                                [Lin Sheng-yu]\n\n2nd Brigade                     Choe Chong-ok ([한자 판독 불가])     unknown\n                                [Tsui Ching-yu]\n\n3rd Brigade                     Bang Sin-tae ([한자 판독 불가])      1,500\n                                [Chieng Hsin-tai]\n\n4th Brigade                     Lee Seng-ayong [원문 그대로] ([한자 판독 불가])   4,000\n                                [Li Hsing-ming]\n\n5th Brigade                     unknown                            4,000\n\n6th Brigade                     unknown                            1,200\n\n[unknown]                       unknown                            5,200\n\n\nKorean Troops Along the Manchurian-Korean Border\n\nKang-kye ([한자 판독 불가]) [Chiangchieh] Military District\n\n                                Kim Hui-yong ([한자 판독 불가])\n                                [Chin Hui-jung]\n\n13th Brigade                    unknown\n14th Brigade                    unknown\n15th Brigade                    unknown\n\nCavalry Regiment\n\n\nLocation\n\nYenchi\nHarbin\nunknown\nYenchi\nunknown\n\nYenchi\nunknown\n\nMeng-chiang (126-48, 42-23)", "notes": ["[삭제·공개 표시] 25X1X (ORIGIN 줄 아래)", "[삭제·공개 표시] 25X1A (첫 면 머리와 PAGES 줄 아래 두 곳)", "[삭제·공개 표시] 25X1C (DATE 줄)", "[삭제·공개 표시] Approved For Release 2001/03/05 : CIA-RDP82-00457R000608070001-1 (공개 승인 도장. 문서번호가 색인의 000600070001-1 과 다르게 찍혀 있다)"], "note": "전투서열표만 있는 한 쪽짜리 문서다. 표의 세 칸 가운데 소재지 칸이 OCR 에서 따로 떨어져 나와 어느 부대가 어디에 있는지 짝지을 수 없다. 소재지 여덟 줄을 인쇄된 차례대로 따로 실었다. 앞 표의 부대 수가 여덟이라 차례가 맞을 수 있으나 확정되지 않아 짝짓지 않았다. 병력 숫자는 고치지 않았다. 이름 없는 마지막 줄의 `5 200` 은 쉼표가 빠진 것으로 보아 5,200으로 읽었으나 그 밖의 자릿수는 손대지 않았다. 지휘관 이름은 조선식 로마자와 한자, 대괄호 안의 중국식 독음이 짝을 이루어 인쇄되어 있다. 한자는 모두 뭉개져 한 자도 확정되지 않는다. 로마자는 원문대로 두었다. 사령부 지휘관은 `Kin Dem ae a Ka` 로 찍혀 성만 Kim 으로 읽었고 중국식 독음은 `Chin dih-yen` 으로 찍혀 Chin Ah-yen 으로 읽었다. 제1여단장은 `Tm Sung-ya` 로 찍혀 Im 으로 읽었다. 제4여단장 `Lee Seng-ayong` 은 가운데 글자를 가릴 수 없어 원문대로 두었다. 강계는 압록강 상류의 江界다. 멍장(Meng-chiang)은 지금의 징위(靖宇)이고 좌표 (126-48, 42-23)은 성립하는 값이다. 이 문서는 국가 칸이 중국으로 되어 있다. 만주에 있는 조선인 부대를 다룬 것이라 그렇다. 기밀 표시가 스캔에 남아 있지 않아 classification 을 null 로 두었다.", "warn": false, "search": "Kim [판독 불가] (조선인 공산 의용군 사령부 지휘관. 중국식 독음 Chin Ah-yen 으로 병기되어 있다) Im Sung-ya (제1여단장. 중국식 독음 Lin Sheng-yu) Choe Chong-ok (제2여단장. 중국식 독음 Tsui Ching-yu) Bang Sin-tae (제3여단장. 중국식 독음 Chieng Hsin-tai) Lee Seng-ayong (제4여단장. 중국식 독음 Li Hsing-ming) Kim Hui-yong (강계 군구 지휘관. 중국식 독음 Chin Hui-jung) 25X1X (ORIGIN 줄 아래) 25X1A (첫 면 머리와 PAGES 줄 아래 두 곳) 25X1C (DATE 줄) Approved For Release 2001/03/05 : CIA-RDP82-00457R000608070001-1 (공개 승인 도장. 문서번호가 색인의 000600070001-1 과 다르게 찍혀 있다) Military Information: Korean Communist Volunteer Corps"}, {"id": "N08", "order": 32, "date": "1947-05-20", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "군사 첩보: 북조선의 중국공산군", "badge": "confidential (CONTROL, U.S. OFFICIALS ONLY)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-05-20"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Chinese Communist Army in North Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000600160001-1"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000600160001-1"}], "summary": "북조선에 있는 중국공산군 사령부가 평양에 있고, 유지비를 대려고 공장 둘을 그 군대에 넘겼다는 한 쪽짜리 보고다.", "points": ["중국공산군 사령부가 평양에 있고, 중국인이 소유했던 「고쇼로(Koshoro)」라는 집을 쓰고 있다고 적었다.", "이 군대를 유지하는 데 조선 화폐로 한 달 4천만 원이 든다고 적었다.", "상하이 주로 환율을 달았다. 1947년 3월 기준 공정환율은 미화 1달러에 16원, 암시장은 45원에서 60원이다.", "돈을 마련하려고 가네보(Kanebo)와 일본곡산(Nippon Cereal) 두 회사를 중국공산군에 넘겼다. 두 곳 모두 수천 명을 쓰던 공장이다.", "그 결과 공장에서 일하던 조선인이 해고되고 중국공산군과 연결된 중국인 민간인과 군인으로 채워졌다.", "이 일이 그 지역 조선인들 사이에 상당한 불만을 일으켰다고 적었다.", "말미의 주에서 3항의 내용을 확인하지 못했다고 밝히고, 공장에서 일하는 것은 전투부대가 아니라 근무부대일 것이라 짐작한다."], "primary": "공개 승인(Approved For Release) 2006/01/31 : CIA-RDP82-00457R000600[판독 불가]\n\n기밀(CONFIDENTIAL)\n\n취급 제한(CONTROL)   미국 관리 전용(U.S. OFFICIALS ONLY)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n첩보보고(INTELLIGENCE REPORT)\n\n국가  조선(Korea)            일자:\n입수(INFO.)\n주제  군사 첩보: 북조선의 중국공산군(Chinese Communist Army in North Korea)\n배포(DIST.)  1947년 5월 20일\n면수  1\n\n25X1\n출처(ORIGIN) [삭제]   보충(SUPPLEMENT)\n\n1. 북조선에 있는 중국공산군의 사령부는 평양(Pyongyang)에 있으며, 전에 어느 중국인이 소유했던 「고쇼로(Koshoro)」([한자 판독 불가])라 불리는 [판독 불가]를 쓰고 있다.\n\n2. 북조선에서 중국공산군을 유지하는 데는 조선 화폐로 한 달에 40,000,000이 든다. (상하이 주: 공정 환율은 미화 1.00달러에 16원이고, 암시장 환율은 미화 1.00달러에 45원에서 60원이다. 1947년 3월 기준.)\n\n3. 위 금액을 마련하는 문제는 가네보 회사(Kanebo Company, [한자 판독 불가])*와 일본곡산 회사(Nippon Cereal Company, [한자 판독 불가])*를 중국공산군에 넘김으로써 부분적으로 풀렸다. 두 회사는 모두 수천 명의 노동자를 쓰고 있다. 이 조치로 전에 그 공장들에 고용되어 있던 조선인들이 해고되었고, 그 자리는 중국공산군과 연결된 중국인 민간인과 군인으로 채워지게 되었다. 이 조치는 그 지역 조선인 주민들 사이에 상당한 불만을 일으켰다.\n\n25X1  25X1A  [삭제] 주: [삭제] 3항의 정보를 분명히 밝힐 수 없었다. 다만 중국공산군 병력이 실제로 공장에서 일하고 있는 것으로 보인다. 이들은 전투부대가 아니라 근무부대일 것으로 짐작된다.\n\n* (평양 안인가?)\n\n본 문서는 [판독 불가] 서한에 따라 기밀(CONFIDENTIAL)로 [재분류된다]\n\n25X1\n\n공개 승인(Approved For Release) 2006/01/31 : CIA-RDP82-00457R000600160001-1\n\n분류(CLASSIFICATION)  기밀, 미국 관리 전용(CONFIDENTIAL, U.S. OFFICIALS ONLY)", "secondary": "Approved For Release 2006/01/31 : CIA-RDP82-00457R000600[판독 불가]\n\nCONFIDENTIAL\n\n[C]ONTROL   U.S. OFFICIALS ONLY\n\nCENTRAL INTELLIGENCE GROUP\nINTELLIGENCE REPORT\n\nCOUNTRY  Korea            DATE:\nINFO.\nSUBJECT  Military Information: Chinese Communist Army in North Korea\nDIST.  20 May 1947\nPAGES  1\n\n25X1\nORIGIN [삭제]   SUPPLEMENT\n\n1. The headquarters of the Chinese Communist Army in North Korea is in Pyongyang, occupying a [판독 불가] formerly owned by a Chinese, called the \"Koshoro\" ([한자 판독 불가]).\n\n2. It costs 40,000,000 Korean currency per month to maintain the Chinese Communist Army in North Korea. (Shanghai Note: Official exchange rate: 16 won to U. S. $1.00; black market rate: 45-60 won to U. S. $1.00, as of March 1947.)\n\n3. The problem of raising the above sum has been partially solved by turning over the Kanebo Company ([한자 판독 불가])* and the Nippon Cereal Company ([한자 판독 불가])*, both employing several thousand workers, to the Chinese Communist Army. This has resulted in the dismissal of Koreans formerly employed in the factories, to be replaced by both civil and military Chinese connected with the Chinese Communist Army. This move has caused considerable dissatisfaction among the local Korean population.\n\n25X1  25X1A  [삭제] Note: [삭제] unable to clarify the information in paragraph three. It appears, however, that Chinese Communist troops are actually employed in the factory. It is supposed that these would be service troops rather than combatant.\n\n* (in Pyongyang?)\n\nThis document is [hereby regraded to] CONFIDENTIAL [in accordance with the] letter of [판독 불가]\n\n25X1\n\nApproved For Release 2006/01/31 : CIA-RDP82-00457R000600160001-1\n\nCLASSIFICATION  CONFIDENTIAL, U.S. OFFICIALS ONLY", "notes": ["[삭제·공개 표시] 25X1 (ORIGIN 줄, 말미 주 앞, 재분류 도장 아래 세 곳)", "[삭제·공개 표시] 25X1A (말미 주 앞)", "[삭제·공개 표시] ORIGIN 줄의 출처 표시가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] 말미 주에서 주를 단 주체의 이름이 두 곳 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] Approved For Release 2006/01/31 : CIA-RDP82-00457R000600160001-1 (두 곳의 공개 승인 도장. 위쪽은 문서번호 뒷자리가 잘려 있다)", "[삭제·공개 표시] This document is hereby regraded to CONFIDENTIAL in accordance with the letter of ... (재분류 도장. 본문이 대부분 잘려 있다)"], "note": "짧고 비교적 잘 읽히는 보고다. 금액과 환율은 한 자리도 고치지 않았다. 유지비 `40,000,000 Korean currency` 는 단위를 원문대로 두었다. 문서가 won 이라 쓰지 않고 Korean currency 라고만 적었기 때문이다. 환율 주는 `16 won to U. S. $1.00` 과 `45-60 won to U. S. $1.00` 을 그대로 옮겼다. 1항에서 사령부가 쓰는 건물의 종류를 가리키는 낱말이 `a ren` 으로 찍혀 읽을 수 없다. residence 로 보이나 확정되지 않아 [판독 불가]로 두었다. 「Koshoro」는 일본어 독음으로 적힌 상호이고 뒤따르는 한자가 뭉개져 있다. 짓지 않고 [한자 판독 불가]로 두었다. 3항의 두 회사는 일본 기업 이름이다. `Kanebo` 는 가네보(鐘紡), `Nippon Cereal` 은 일본곡산으로 옮겼으나 원문에 붙은 한자는 모두 뭉개져 있다. 별표가 붙은 곳에 대한 원문의 주가 `* (in Pyongyang?)` 이므로 공장 위치를 미국 쪽에서도 확신하지 못한 것이다. 머리글의 `Ax` 는 Army, `Zorth Korea` 는 North Korea, `Aray` `Amy` 는 Army, `Ccmmnist` `Commmnist` `Conpany` `Mippon` `Chinege` `connected` `aneng` `lecal` `gupposed` 는 각각 Communist, Company, Nippon, Chinese, among, local, supposed 로 읽었다. `turn aver` 는 turning over 로 읽었다.", "warn": false, "search": "25X1 (ORIGIN 줄, 말미 주 앞, 재분류 도장 아래 세 곳) 25X1A (말미 주 앞) ORIGIN 줄의 출처 표시가 먹칠되어 [삭제]로 옮겼다 말미 주에서 주를 단 주체의 이름이 두 곳 먹칠되어 [삭제]로 옮겼다 Approved For Release 2006/01/31 : CIA-RDP82-00457R000600160001-1 (두 곳의 공개 승인 도장. 위쪽은 문서번호 뒷자리가 잘려 있다) This document is hereby regraded to CONFIDENTIAL in accordance with the letter of ... (재분류 도장. 본문이 대부분 잘려 있다) Military Information: Chinese Communist Army in North Korea"}, {"id": "N09", "order": 33, "date": "1947-05-21", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "군사 첩보: 조선의용군", "badge": "CONTROL, U.S. OFFICIALS ONLY", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-05-21"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Korean Volunteer Army", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000600170007-4"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000600170007-4"}], "summary": "조선의용군의 병력을 앞서 보고한 40,700에서 크게 올려 잡고, 만주 안의 배치처를 좌표와 함께 적은 한 쪽짜리 보고다.", "points": ["조선의용군의 병력을 「십만 칠천」이라 적고 문서 자체가 거기에 [sic]를 달았다.", "앞서 보고한 병력은 40,700이었다고 밝힌다. 두 숫자 사이의 차이가 이 보고의 요점이다.", "배치 인원을 50,000 / 20,000 / 5,600 / 15,006 / 15,000과 나머지로 나누어 적었다.", "소재지로 옌지(129-31, 42-55), 자무쓰(130-21, 46-49), 둔화(126-14, 43-22), (127-17, 43-51), 둔화 동쪽, 하얼빈, 훈춘(130-22, 42-52), 왕칭(129-80, 43-17)을 들었다.", "무장은 일본 무기이고 지휘관은 중국인, 부지휘관은 조선인이라고 적었다.", "국가 칸은 조선이 아니라 중국(China)이다."], "primary": "공개 승인(Approved For Release) 2006/04/13 : CIA-RDP82-00457R0006[판독 불가]\n\n취급 제한(CONTROL)\n미국 관리 전용(U.S. OFFICIALS ONLY)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가  중국(China)\n\n주제  군사 첩보: 조선의용군(Korean Volunteer Army)\n\n출처(ORIGIN)  [삭제]\n\n일자:\n입수(INFO.)\n배포(DIST.)  1947년 5월 21일\n면수  1\n보충(SUPPLEMENT)\n\n25X1A6A\n25X1A2G\n25X1A6A\n25X1A6A\n25X1X6\n25X1A6A\n\n1. 조선의용군의 병력은 십만 칠천(One Hundred Seventh [sic] Thousand)이다 [앞서 40,700으로 보고되었다]. 배치는 다음과 같다.\n\n   조선의용군 사령부(Korean Volunteer Army Hq)\n   50,000\n   20,000\n   5,600\n   15,006\n   15,000\n\n   나머지(Remainder)\n\n2. 조선의용군은 일본 무기로 무장하고 있다. 지휘관은 중국인이고 부지휘관은 조선인이다.\n\n[소재지 칸. OCR 에서 병력 칸과 따로 떨어져 나왔다.]\n\n   옌지(Yenchi 延吉) (129-31, 42-55)\n   자무쓰(Chiamusen 佳木斯) (130-21, 46-49)\n   둔화(Tunhua 敦化) (126-14, 43-22)\n   [판독 불가] (127-17, 43-51)\n   둔화 동쪽(East of Tunhua)\n   하얼빈(Harbin 哈爾濱)\n   옌지, 훈춘(Hunchun 琿春) (130-22, 42-52), 왕칭(Wangching 汪淸) (129-80, 43-17)\n\n문서번호 [판독 불가]\n등급 변경 없음(NO CHANGE in Class.) [판독 불가]\n비밀해제(DECLASSIFIED)\n등급 변경(Class. CHANGED TO): TS S [판독 불가]\nDDA 각서, 1977년 4월 4일\n근거(Auth): DDA REG. 77/[판독 불가]\n일자(Date): [판독 불가]  담당 [판독 불가]\n\n25X1\n\n공개 승인(Approved For Release) 2006/04/13 : CIA-RDP82-00457R000600170007-4", "secondary": "Approved For Release 2006/04/13 : CIA-RDP82-00457R0006[판독 불가]\n\nCONTROL\nU.S. OFFICIALS ONLY\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCOUNTRY  China\n\nSUBJECT  Military Information: Korean Volunteer Army\n\nORIGIN  [삭제]\n\nDATE:\nINFO.\nDIST.  21 May 1947\nPAGES  1\nSUPPLEMENT\n\n25X1A6A\n25X1A2G\n25X1A6A\n25X1A6A\n25X1X6\n25X1A6A\n\n1. The strength of the Korean Volunteer Army is One Hundred Seventh [sic] Thousand [previously reported as 40,700], distributed as follows,\n\n   Korean Volunteer Army Hq\n   50,000\n   20,000\n   5,600\n   15,006\n   15,000\n\n   Remainder\n\n2. The Korean Volunteer Army is equipped with Japanese weapons; the commanding officers are Chinese and the deputy commanders are Korean.\n\n[소재지 칸. OCR 에서 병력 칸과 따로 떨어져 나왔다.]\n\n   Yenchi (129-31, 42-55)\n   Chiamusen (130-21, 46-49)\n   Tunhua (126-14, 43-22)\n   [판독 불가] (127-17, 43-51)\n   East of Tunhua\n   Harbin\n   Yenchi, Hunchun (130-22, 42-52), and Wangching (129-80, 43-17)\n\nDocument No. [판독 불가]\nNO CHANGE in Class. [판독 불가]\nDECLASSIFIED\nClass. CHANGED TO: TS S [판독 불가]\nDDA Memo, 4 Apr 77\nAuth: DDA REG. 77/[판독 불가]\nDate: [판독 불가]  By [판독 불가]\n\n25X1\n\nApproved For Release 2006/04/13 : CIA-RDP82-00457R000600170007-4", "notes": ["[삭제·공개 표시] 25X1A6A (네 곳), 25X1A2G, 25X1X6, 25X1 (여백의 면제 표시)", "[삭제·공개 표시] ORIGIN 줄의 출처 표시가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] Approved For Release 2006/04/13 : CIA-RDP82-00457R000600170007-4 (두 곳의 공개 승인 도장. 위쪽은 문서번호 뒷자리가 잘려 있다)", "[삭제·공개 표시] Document No. / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S / DDA Memo, 4 Apr 77 / Auth: DDA REG. 77 / Date / By (등급 변경 도장)"], "note": "한 쪽짜리 표다. 병력 칸과 소재지 칸이 OCR 에서 따로 떨어져 나와 어느 인원이 어디에 있는지 짝지을 수 없다. 병력이 사령부를 포함해 일곱 줄, 소재지가 일곱 줄이라 차례가 맞을 수 있으나 확정되지 않아 짝짓지 않고 두 칸을 나누어 실었다. 병력 총수는 문서가 `One Hundred Seventh {sief Thousand` 로 적었다. `{sief` 는 원문이 스스로 단 [sic]다. 문서가 이미 이상하다고 표시한 숫자이므로 고치지 않고 그대로 옮겼다. 앞서 보고된 수치는 `40 700` 으로 찍혀 40,700으로 읽었다. 배치 인원 가운데 `15,006` 은 15,000의 오식으로 보이나 고치지 않았다. `15 ,G00` 은 15,000으로 읽었다. 좌표는 한 자리도 고치지 않았다. 왕칭의 `(129-80, 43-17)` 은 경도의 분이 80으로 성립하지 않는 값이다. 훈춘의 `(130-22, 42-52)` 도 실제 위치보다 동쪽으로 치우친 값이나 그대로 두었다. 지명은 좌표로 짚었다. `Chiamusen (130-21, 46-49)` 은 자무쓰(佳木斯), `funhua (126-14, 43-22)` 는 둔화(敦化)로 읽었다. `Iefe (127-17, 43-51)` 는 어느 곳인지 가릴 수 없어 [판독 불가]로 두고 좌표만 살렸다. 2항의 `the sonmmanding officers` 는 마지막 면의 흐트러진 줄에 걸쳐 있던 `the commanding` 을 이어 붙여 읽었다. 이 문서도 국가 칸이 중국이다. 만주에 있는 조선인 부대를 다루기 때문이다. 스캔에 CONFIDENTIAL 도장이 남아 있지 않아 classification 은 CONTROL, U.S. OFFICIALS ONLY 만 적었다.", "warn": false, "search": "25X1A6A (네 곳), 25X1A2G, 25X1X6, 25X1 (여백의 면제 표시) ORIGIN 줄의 출처 표시가 먹칠되어 [삭제]로 옮겼다 Approved For Release 2006/04/13 : CIA-RDP82-00457R000600170007-4 (두 곳의 공개 승인 도장. 위쪽은 문서번호 뒷자리가 잘려 있다) Document No. / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S / DDA Memo, 4 Apr 77 / Auth: DDA REG. 77 / Date / By (등급 변경 도장) Military Information: Korean Volunteer Army"}, {"id": "N10", "order": 34, "date": "1947-05-22", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "정치 첩보: RHEE Syngman 이승만의 활동 계획", "badge": "confidential (CONTROL U.S. OFFICIALS ONLY)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-05-22"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Political Information: Proposed Activities of RHEE Syngman", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000600210006-0"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000600210006-0"}], "summary": "이승만이 만주의 한국임시정부 대표단을 해산하고 조선에서 광복군을 되살리려 한다는 보고다. 국가는 「중국-조선」으로 적혀 있고 만주 쪽에서 들어온 첩보다.", "points": ["이승만의 목표 두 가지를 앞머리에 적었다. 만주의 한국임시정부 대표단(KPGRG) 해산과 조선 안에서의 한국광복군(KRA) 부활이다.", "KPGRG 성원들이 조선인들을 중국공산당과 내통했다고 고발했고 국민당 당국이 그들을 체포했다. 몸값을 치르고 풀려났다.", "PAK 과 LEE 가 중국 정부의 임시정부 유지비에서 큰 몫을 받아 왔고, 그래서 해산에 반대했다. 만주에서만 해산하는 선에서 타협이 이루어졌다.", "LEE 는 이승만을 따라 조선으로 가서 새 광복군의 수장이 되기로 했다.", "이승만이 광복군을 되살리려는 이유를 셋으로 들었다. 조선민족방위대의 영향력 상쇄, 소련군 철수 뒤 북조선 공산주의자를 물리칠 무력의 제시, 미군정의 존중 확보다.", "새 광복군의 병력은 이범석의 광복청년단(450,000명이라고 전한다)과 김구의 한국민주당에서 뽑는다고 적었다.", "이승만에 반대하는 사람으로 LU Dong-yol, 김규식, 여운형, WANG Il-so 를 들었다."], "primary": "문서번호(Document No.) [판독 불가]\n[판독 불가]\n등급 변경 없음(NO CHANGE in Class.) [판독 불가]\n근거(Auth): [판독 불가]\n일자(Date): [판독 불가]\n\n기밀/미국 관리 한정 취급(CONFIDENTIAL/CONTROL U.S. OFFICIALS ONLY)\n\n25X1A2g\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가   중국-조선(China-Korea)                                     일자(DATE):\n                                                          정보취득(INFO.) 일자 미상(Undated)\n주제   정치 첩보: RHEE Syngman 이승만의 활동 계획\n                                                          배포(DIST.) 1947년 5월 22일 [L947 원문 그대로]\n25X1A6a                                                   면수(PAGES) [판독 불가]\n                                                          보충(SUPPLEMENT)\n출처(ORIGIN)   [판독 불가]   25X1X6\n\n25X1A6a\n\n(주: RHEE Syngman 이승만의 권력 장악 시도에는 여러 목표 가운데 다음 두 가지가 들어 있다. 만주에 있는 한국임시정부 대표단(Korean Provisional Government - Representative Group)의 해산, 그리고 조선 안에서의 한국광복군(Korean Restoration Army) 부활이다.)\n\n25X1X6\n\n1. 한국임시정부 대표단(Korean Provisional Government Representative Group)은 [판독 불가] 그 [판독 불가] 복리와 재산과 [판독 불가]를 보호할 목적으로 [판독 불가] 이 단체가 만주(Manchuria)의 조선인들 사이에서 [판독 불가]인 까닭에 [판독 불가] 만주 밖 다른 지역의 조선인들에게는 이렇다 할 영향을 미치지 못하였다 [판독 불가] [판독 불가] 군대의 철수 [판독 불가] KPGRG 성원들이 조선인들을 중국공산당(Chinese Communists)과 [판독 불가]하였다고 고발하였고, 이에 국민당(Nationalist) 당국이 그들을 체포하였다. 몸값을 치르고 피해자들은 풀려났다.\n\n2. 이 기간 KPGRG 의 수장은 PAK [판독 불가]([한자 판독 불가])이었다(POKU [판독 불가] [한자 판독 불가]로도 알려져 있다). [판독 불가]의 수석대표는 LEE [판독 불가]([한자 판독 불가])였다. 그는 한때 충칭(Chungking 重慶)에 있던 「광복(Restoration)」 기관의 [판독 불가]였고, 한국임시정부가 1946년 조선으로 옮겨 가기 전까지 임시정부의 [판독 불가]였다. PAK 과 LEE 는 임시정부(KPG)와 그 뒤를 이은 KPGRG 의 유지를 위해 중국 정부가 배정한 자금에서 큰 몫을 받았다. 이 때문에 PAK 과 LEE 는 KPGRG 를 통째로 해산하려는 RHEE 의 애초 계획에 반대하였다. 타협이 이루어진 것으로 보이며, 그에 따라 KPGRG 는 만주에서만 해산된다. 그곳이 이 단체의 평판이 가장 나쁜 지역이기 때문이다. LEE 는 이제 RHEE 를 따라 조선으로 가서 새로 만들 한국광복군(Korean Restoration Army)의 수장이 되기로 동의하였다.\n\n3. RHEE 가 KRA 를 [판독 불가]하려는 이유는 세 가지다. [판독 불가]\n\n가. 조선민족방위대(Korean National Defense Corps)의 영향력을 상쇄해야 한다. [판독 불가] 그 지도자들이 그를 지지하지 않는다.\n\n나. 소련 점령군이 철수한 뒤 북조선 공산주의자들을 물리칠 수 있는 무력을 내보일 수 있어야 한다.\n\n다. 그러한 무력의 뒷받침이 있어야 남조선의 미군정(American Military Government)에게서 존중을 얻을 수 있다. 그의 성공은 미군정의 지원에 달려 있다.\n\n공개 승인(Approved For Release) 1999/09/08 : CIA-RDP8[판독 불가]\n\n등급(CLASSIFICATION) [판독 불가] 미국 관리 한정 취급(CONTROL U.S. OFFICIALS ONLY)\n\n25X1X6\n\n25X1A2g\n\n공개 승인(Approved For Release) [판독 불가]\n\n새 KRA 는 주로 LEE Bum-suk 이범석([한자 판독 불가])의 광복청년단(Korean Restoration Youth Group)에서 뽑는다. 이 단체는 450,000명([판독 불가]) 규모라고 전한다. 그리고 KIM Koo 김구의 한국민주당(Korean Democratic Party)에서도 뽑는다.\n\nRHEE 에 반대하는 무리는 다음 사람들로 이루어져 있다. LU Dong-yol([한자 판독 불가])은 현재 KNDC 의 수장이고 1919년 상하이(Shanghai)에서 KRA 의 사령관이었다(주: 당시에는 한국독립군(Korean Independence Army)으로 불렸다). KIM Kyu Sik 김규식([한자 판독 불가])은 1944년 8월 임시정부 부주석이었다. LYUH Woon Hyung 여운형([한자 판독 불가])은 1919년 난징(Nanking 南京)에서 조선공산당(Korean Communist Party)의 수장이었고 지금은 서울에 있으며 젊은 조선인들 사이에서 인기가 있다. 그리고 WANG Il-so([한자 판독 불가])가 있다. WANG 에 관한 보고는 S0+5275 [원문 그대로]를 보라.\n\n기밀/미국 관리 한정 취급(CONFIDENTIAL/CONTROL U.S. OFFICIALS ONLY)\n\n공개 승인(Approved For Release) 1999/09/08 : CIA-RDP82-00457R000600210006-0", "secondary": "Document No. [판독 불가]\n[판독 불가]\nNO CHANGE in Class. [판독 불가]\nAuth: [판독 불가]\nDate: [판독 불가]\n\nCONFIDENTIAL/CONTROL U.S. OFFICIALS ONLY\n\n25X1A2g\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCOUNTRY   China-Korea                                     DATE:\n                                                          INFO. Undated\nSUBJECT   Political Information: Proposed Activities of RHEE Syngman\n                                                          DIST. 22 May [L947 원문 그대로]\n25X1A6a                                                   PAGES [판독 불가]\n                                                          SUPPLEMENT\nORIGIN   [판독 불가]   25X1X6\n\n25X1A6a\n\n(Note: RHEE Syngman's bid for power includes, among others, the following two objectives: the dissolution of the Korean Provisional Government - Representative Group in Manchuria and the revival of the Korean Restoration Army in Korea.)\n\n25X1X6\n\n1. The Korean Provisional Government Representative Group [판독 불가] purpose of protecting the [판독 불가] welfare, property and [판독 불가] where [판독 불가] because of its [판독 불가] of Koreans in Manchuria [판독 불가] in any appreciable way the Koreans in other parts of [판독 불가] withdrawal of [판독 불가] forces [판독 불가] whereby the KPGRG members accused [판독 불가] Koreans of [판독 불가] with the Chinese Communists, whereupon the Nationalist authorities arrested them. On payment of a ransom, the victims were released.\n\n2. Chief of the KPGRG during this time was PAK [판독 불가] ([한자 판독 불가]) (also known as POKU [판독 불가] [한자 판독 불가]). Chief representative in [판독 불가] was LEE [판독 불가] ([한자 판독 불가]), who was sometime [판독 불가] of the organ of \"Restoration\" in Chungking [판독 불가] of the Korean Provisional Government before it was removed to Korea in 1946. PAK and LEE received large shares of the Chinese Government allotment for the maintenance of the KPG and the subsequent KPGRG. For this reason, PAK and LEE opposed RHEE's original plan to dissolve the KPGRG entirely. A compromise has apparently been reached whereby the KPGRG will be disbanded only in Manchuria, since that is the area in which the group is in worst repute. LEE has now agreed to accompany RHEE to Korea and become chief of the proposed new Korean Restoration Army.\n\n3. RHEE's reasons for [판독 불가] the KRA are threefold: [판독 불가]\n\na. He must offset the influence of the Korean National Defense Corps [판독 불가] whose leaders do not favor him.\n\nb. He must be able to point to a force which is capable of defeating the North Korean Communists after the withdrawal of the Soviet occupation forces.\n\nc. He needs the backing of such a force to gain the respect of the American Military Government in South Korea, on whose support his success is dependent.\n\nApproved For Release 1999/09/08 : CIA-RDP8[판독 불가]\n\nCLASSIFICATION [판독 불가] CONTROL U.S. OFFICIALS ONLY\n\n25X1X6\n\n25X1A2g\n\nApproved For Release [판독 불가]\n\nThe new KRA is to be recruited mainly from LEE Bum-suk's ([한자 판독 불가]) Korean Restoration Youth Group, reportedly 450,000 ([판독 불가]) strong, and from KIM Koo's Korean Democratic Party.\n\nOpposed to RHEE is a group of men made up of LU Dong-yol ([한자 판독 불가]), present chief of the KNDC and commander of the KRA in 1919 (Shanghai) (Note: known as the Korean Independence Army then); KIM Kyu Sik ([한자 판독 불가]), vice-president of the KPG in August 1944; LYUH Woon Hyung ([한자 판독 불가]), chief of the Korean Communist Party in Nanking in 1919, now in Seoul and popular among young Koreans; and WANG Il-so ([한자 판독 불가]). See S0+5275 [원문 그대로] for report on WANG.\n\nCONFIDENTIAL/CONTROL U.S. OFFICIALS ONLY\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R000600210006-0", "notes": ["[삭제·공개 표시] Approved For Release 1999/09/08 : CIA-RDP82-00457R000600210006-0 (마지막 면의 공개 승인 도장)", "[삭제·공개 표시] Approved For Release 1999/09/08 : CIA-RDP8[판독 불가] (1면 아래의 공개 승인 도장. 문서번호 뒷부분이 잘려 있다)", "[삭제·공개 표시] Approved For Release [판독 불가] (2면 머리의 공개 승인 도장)", "[삭제·공개 표시] 25X1A2g (1면 머리와 2면 머리의 면제 표시)", "[삭제·공개 표시] 25X1A6a (헤더의 면제 표시. 두 군데)", "[삭제·공개 표시] 25X1X6 (ORIGIN 줄과 본문 앞, 1면 아래의 면제 표시. 인적 정보원)", "[삭제·공개 표시] ORIGIN 줄의 출처 표시가 판독되지 않아 [판독 불가]로 옮겼다", "[삭제·공개 표시] Document No. 도장과 등급 변경 도장(NO CHANGE in Class. / Auth / Date)이 뭉개져 있다"], "note": "1면 왼쪽 절반이 마이크로필름에서 심하게 흐려져 1항이 거의 낱말 단위로만 남았다. 이어지지 않는 대목은 모두 [판독 불가]로 두고 문장을 채우지 않았다. 표제는 `Proposed Activities of 9 / RHEE Syngwan` 으로 두 줄에 걸쳐 찍혀 있다. 배포 일자는 `BIST. 22. Hay L947` 로 찍혔다. 연도가 L947 이지만 날짜의 숫자는 고치지 않고 원문대로 두었다. 국가 칸은 `China-Berea` 로 찍혀 China-Korea 로 읽었다. 인명 표기는 원문을 앞세웠다. `LEU Bun-suk` 은 LEE Bum-suk 으로 읽었다. `KIM Keo` 는 KIM Koo 로 읽었다. `LU Dongeyol` 은 성의 첫 글자가 L 로 찍혀 있어 그대로 두었다. 이 사람은 KNDC 수장이자 1919년 광복군 사령관으로 적혀 있다. 등장하는 한자는 모두 스캔에서 뭉개져 한 글자도 확정되지 않아 [한자 판독 불가]로 두었다. 광복청년단 병력 `450,000` 뒤에 붙은 괄호 안 숫자는 `(\"7.7` 로만 남아 [판독 불가]로 두었다. WANG 관련 참조 보고 번호는 `S0+5275 4.` 로 찍혀 있다. 문서번호이므로 고치지 않았다. 기관 이름은 원문 표기를 앞세웠다. `Korean Provisional Government - Representative Group` 은 한국임시정부 대표단, `Korean Restoration Army` 는 한국광복군, `Korean National Defense Corps` 는 조선민족방위대로 옮겼으나 약칭 KPGRG·KRA·KNDC 는 원문대로 두었다. 김구를 한국민주당 소속으로 적은 것은 원문 그대로다. 고치지 않았다.", "warn": true, "search": "RHEE Syngman 이승만 PAK [판독 불가] (KPGRG 수장. POKU [판독 불가]로도 알려짐) LEE [판독 불가] (KPGRG 수석대표. 새 광복군 수장이 되기로 함) LEE Bum-suk 이범석 (광복청년단) KIM Koo 김구 (한국민주당) LU Dong-yol (현 KNDC 수장. 1919년 상하이에서 KRA 사령관) KIM Kyu Sik 김규식 (1944년 8월 임시정부 부주석) LYUH Woon Hyung 여운형 (1919년 난징 조선공산당 수장. 현재 서울) WANG Il-so Approved For Release 1999/09/08 : CIA-RDP82-00457R000600210006-0 (마지막 면의 공개 승인 도장) Approved For Release 1999/09/08 : CIA-RDP8[판독 불가] (1면 아래의 공개 승인 도장. 문서번호 뒷부분이 잘려 있다) Approved For Release [판독 불가] (2면 머리의 공개 승인 도장) 25X1A2g (1면 머리와 2면 머리의 면제 표시) 25X1A6a (헤더의 면제 표시. 두 군데) 25X1X6 (ORIGIN 줄과 본문 앞, 1면 아래의 면제 표시. 인적 정보원) ORIGIN 줄의 출처 표시가 판독되지 않아 [판독 불가]로 옮겼다 Document No. 도장과 등급 변경 도장(NO CHANGE in Class. / Auth / Date)이 뭉개져 있다 Political Information: Proposed Activities of RHEE Syngman"}, {"id": "N11", "order": 35, "date": "1947-06-02", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "정치 첩보: KIM Il-sung 김일성 정권에 대한 불만", "badge": "[판독 불가]", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-06-02"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Political Information: Dissatisfaction with KIM Il-sung's Regime", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000600430001-1"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000600430001-1"}], "summary": "북조선 민심의 다섯 대목을 짧게 적었다. 부유층의 자본 도피, 만주로 갔다가 환멸을 느낀 농민, 실업, 이승만의 난징 방문에 쏠린 관심, 정치 발언 단속이다.", "points": ["북조선 부유층이 김일성 정부를 믿지 않고 자본을 남조선으로 옮길 방도를 찾는다. 안둥을 거쳐 몰래 옮기며, 물건을 산다는 구실로 안둥에 자금을 보낸다.", "중국 국민정부가 조선인대표단을 통해 만주의 조선인에게 개인 대부를 해 준다는 말을 듣고 농민들이 만주로 옮겨 갔다. 만주와 북조선 양쪽에 다 불만이고 불안해한다.", "일자리 없는 사람들이 거리에 무리를 지어 서성인다.", "이승만의 난징 방문이 북조선에서 크게 논란이 되었다. 조선의 앞날이 그 결과에 달렸을 수도 있다고 본 사람이 많았다.", "정치 논의 억압이 심해졌다. 거리나 전화로 정치를 말하는 것이 금지되었고 유죄가 되면 무거운 벌을 받는다."], "primary": "[판독 불가]\n\n국가   조선(Korea)\n\n주제   정치 첩보: KIM Il-sung 김일성 정권에 대한 불만\n\n참조(REFERENCE) [판독 불가]\n\n[판독 불가]\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n[판독 불가] 한정(ONLY)\n\n첩보보고(INTELLIGENCE REPORT)\n\n문서관리(Archivist) [판독 불가]\n다음 재검토(Next Review) [판독 불가]\n\n일자(DATE):\n정보취득(INFO.)\n배포(DIST.)\n면수(PAGES)\n보충(SUPPLEMENT)   25X1A2g\n\n[판독 불가]0430001-1\n\n[판독 불가] 1978 [판독 불가] 에게 [판독 불가] 중앙(Central) [판독 불가] 미합중국(the United Stat[판독 불가]) [판독 불가] 2958\n\n25X1A6a\n25X1A2g\n\n5. [원문 그대로]\n\n북조선의 부유층 [판독 불가]은 KIM Il-sung 김일성 정부에 대한 신뢰를 잃었다. 그들은 자본을 남조선으로 옮길 방도를 꾸미고 있다. 25X1X6 자본이 안둥(Antung 安東)을 거쳐 남조선으로 몰래 옮겨지고 있다. 일부는 안둥에서 물건을 산다는 구실을 대고 자금을 그리로 옮긴다.\n\n북조선 농민들은 중국 국민정부(Chinese Nationalist Government)가 조선인대표단(Korean Representative Group)을 통해 만주(Manchuria)의 조선인들에게 개인 대부를 해 준다는 말을 들었다. 그래서 많은 농민이 만주로 옮겨 갔고 환멸을 느꼈다. 그들은 만주와 북조선 양쪽의 형편에 다 불만이며 불안해한다.\n\n일자리 없는 사람들이 거리에 무리를 지어 서성인다.\n\nRHEE Syng-man 이승만의 난징(Nanking 南京) 방문은 북조선에서 상당한 논란을 불렀다. 많은 조선인이 이 방문에 큰 뜻이 있다고 여겼고, 조선의 앞날이 RHEE 의 방문 결과에 달려 있을 수도 있다고 보았다.\n\n북조선 정부는 최근 사람들 사이의 정치 논의를 억누르는 엄한 조치를 취했다. 거리나 전화로 「정치」를 말하는 것이 금지되었고, 그 혐의로 기소되어 유죄가 되면 무거운 벌을 받는다.\n\n[경고: 이 배포처 목록은] 이 문서를 [공개하기 전에] 삭제해야 한다(EXCISED BEFORE)\n\n공개 승인(Approved For Release) 1[판독 불가]\n\n이 문서는 개정된 방첩법(Espionage Act) 미국법전 제50편 제31조 및 제32조가 정한 뜻에서 미합중국의 국방에 관계된 정보를 담고 있다. 그 내용을 어떤 방식으로든 [판독 불가]에게 전달하거나 누설하는 것은 법으로 금지된다.", "secondary": "[판독 불가]\n\nCOUNTRY   Korea\n\nSUBJECT   Political Information: Dissatisfaction with KIM Il-sung's Regime\n\nREFERENCE [판독 불가]\n\n[판독 불가]\n\nCENTRAL INTELLIGENCE GROUP\n\n[판독 불가] ONLY\n\nINTELLIGENCE REPORT\n\nArchivist [판독 불가]\nNext Review [판독 불가]\n\nDATE:\nINFO.\nDIST.\nPAGES\nSUPPLEMENT   25X1A2g\n\n[판독 불가]0430001-1\n\n[판독 불가] 1978 [판독 불가] to the [판독 불가] Central [판독 불가] the United Stat[판독 불가] [판독 불가] 2958\n\n25X1A6a\n25X1A2g\n\n5. [원문 그대로]\n\nWealthy elements of the North Korean [판독 불가] have lost faith in KIM Il-sung's government. They are contriving methods of transferring capital to South Korea. 25X1X6 Capital is being secretly transferred to South Korea through Antung. Some persons are transferring funds to Antung under the subterfuge of buying goods there.\n\nNorth Korean farmers had heard that the Chinese Nationalist Government was making personal loans to Koreans in Manchuria, through the Korean Representative Group. Many farmers then migrated to Manchuria and were disillusioned. They are dissatisfied with conditions in both Manchuria and North Korea and feel insecure.\n\nThe jobless loiter in the streets in large numbers.\n\nRHEE Syng-man's visit to Nanking caused considerable comment in North Korea. Many Koreans felt that this visit had great significance and that possibly the future of Korea will depend on the results of RHEE's visit.\n\nThe Government in North Korea has recently taken severe steps to repress political discussion among the people. Talking \"politics\" on the street or on the telephone is forbidden and heavy penalties are given to those so charged and convicted.\n\n[WARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE] EXCISED BEFORE [PUBLIC RELEASE OF THIS DOCUMENT]\n\nApproved For Release 1[판독 불가]\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50 U.S.C., 31 and 32, as amended. Its transmission or the revelation of its contents in any manner [판독 불가] is prohibited by law.", "notes": ["[삭제·공개 표시] Approved For Release 1[판독 불가] (공개 승인 도장. 뒷부분이 잘려 있다)", "[삭제·공개 표시] WARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT (배포처 목록 삭제 경고. 앞뒤가 잘려 EXCISED BEFORE 만 남았다)", "[삭제·공개 표시] 25X1A2g (헤더와 본문 옆 여백의 면제 표시)", "[삭제·공개 표시] 25X1A6a (본문 앞의 면제 표시)", "[삭제·공개 표시] 25X1X6 (첫 항목 안의 면제 표시. 인적 정보원)", "[삭제·공개 표시] 0430001-1 (공개 승인 도장에서 문서번호 끝자리만 남았다)"], "note": "다섯 항목의 서술 부분은 잘 읽히나 헤더가 거의 남지 않았다. 등급 표시가 `rath eve aa LY` 로만 남아 확정할 수 없어 [판독 불가]로 두었다. 배포 일자 칸도 비어 있어 en 안에서 채우지 않았다. 스캔에서 문단 번호가 5 하나만 남았다. 이 번호는 다섯 항목 가운데 어느 것에 붙은 것인지 확정되지 않아 위치를 그대로 두고 [원문 그대로]로 표시했다. 나머지 항목에는 번호를 새로 매기지 않았다. OCR 이 두 단으로 갈라진 본문을 뒤섞어 놓아 낱말 순서를 문장이 되도록 되돌렸다. `Wealthy elements of the North Korean ig diem` 에서 `ig diem` 은 population 으로 보이나 확정되지 않아 [판독 불가]로 두었다. `HH&E's visit` 은 앞 문장의 RHEE 를 가리키는 것이 분명해 RHEE 로 읽었다. 마지막의 방첩법 고지문은 이 문서철 전체에 찍히는 정형 문구다. 낱말이 흩어져 있으나 정형 문구로 보아 되살렸고, 끊긴 대목은 [판독 불가]로 두었다. 문서 아래의 이관 도장은 `1978`, `the United Stac`, `2958` 만 남아 조각으로 옮겼다. `Korean Representative Group` 은 N10 의 한국임시정부 대표단과 같은 것으로 보이나 원문 표기가 달라 그대로 두었다.", "warn": false, "search": "KIM Il-sung 김일성 RHEE Syng-man 이승만 Approved For Release 1[판독 불가] (공개 승인 도장. 뒷부분이 잘려 있다) WARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT (배포처 목록 삭제 경고. 앞뒤가 잘려 EXCISED BEFORE 만 남았다) 25X1A2g (헤더와 본문 옆 여백의 면제 표시) 25X1A6a (본문 앞의 면제 표시) 25X1X6 (첫 항목 안의 면제 표시. 인적 정보원) 0430001-1 (공개 승인 도장에서 문서번호 끝자리만 남았다) Political Information: Dissatisfaction with KIM Il-sung's Regime"}, {"id": "N12", "order": 36, "date": "1947-06-04", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "경제 첩보: 북조선의 민심 이반", "badge": "[판독 불가]", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-06-04"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Economic Information: Public Discontent in North Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000600510008-5"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000600510008-5"}], "summary": "1947년 첫 석 달의 소련군표 환율, 후창과 자성의 식량 폭동, 신의주에서 안둥으로 넘어가는 조선인 수를 달별로 적었다.", "points": ["소련군표 가치가 석 달 사이에 떨어진다. 100원에 1월 105, 2월 115-120, 3월 136이다.", "1947년 2월 말과 3월 초에 후창과 자성에서 식량 폭동이 일어난다. 지난해 흉작과 1946년 11월 중국공산군·조선독립의용군 4만에서 5만 명이 현지 식량을 바닥낸 것을 원인으로 들었다.", "후창에서는 5,000명이 경찰서를 습격하고 조선독립의용군 숙영지를 덮쳐 식료품을 모두 실어 갔다.", "자성에서는 신의주에서 온 경찰이 진압하지 못해 소련군을 불러들였다.", "평안북도의 식량 폭동은 1월 중순부터 2월 첫 주까지 이미 보고된 바 있다고 덧붙였다.", "신의주에서 안둥으로 몰래 넘어가는 조선인이 늘어난다. 1월 67명, 2월 116명, 3월 4183 [원문 그대로], 4월 1일부터 7일까지 219명이다.", "돌아온 이유가 땅이다. 한때 만주국에 살았다는 이유로 북조선인민위원회가 땅을 주지 않아 다시 만주로 나간다."], "primary": "공개 승인(Approved For Release) 2003/08/05 : CIA-RDP82-00457R000600510008-5\n\n[판독 불가] 이로써 등급을 [판독 불가]로 조정한다\n\n경고(WARNING NOTICE): 이 배포처 목록은 이 문서를 공개하기 전에 삭제해야 한다.\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가   조선(Korea)                                            일자(DATE): 25X1\n주제   경제 첩보: 북조선의 민심 이반\n                                                           배포(DIST.) [판독 불가] 1947년\n                                                           면수(PAGES) 1\n출처(ORIGIN)   25X1                                          보충(SUPPLEMENT)\n25X1\n배포처(DISTRIBUTION)\n국무부(STATE) | 육군부(WAR) | 해군부(NAVY) | 법무부(JUSTICE) | [판독 불가] | [판독 불가] | | | | |\n\n1. 북조선에서 소련 점령군 통화(Soviet Occupation currency)의 가치는 1947년 첫 석 달 동안 다음과 같이 25X1 떨어졌다.\n\n1월......100원(won)이 소련군표(Soviet notes) 105에 해당하였다.\n2월......100원이 소련군표 115-120에 해당하였다.\n3월......100원이 소련군표 136에 해당하였다.\n\n25X1\n\n2. 1947년 2월 말과 3월 초에 후창(Huchang, 일본식 Kesho, 127-03, 41-25)과 자성(Chasong, 일본식 Jijo, 126-36, 41-28)에서 식량 폭동이 일어났다. 폭동의 원인으로는 지난해의 흉작, 그리고 1946년 11월 중국공산군과 조선독립의용군(Korean Independent Volunteer Army) 40,000-50,000명이 이 지역을 점거하여 현지 식량 비축을 바닥낸 것을 들었다.\n\n가. 후창에서는 5,000명이 지역 경찰서를 습격하고 식량을 요구하였다. 이 습격에 이어 조선독립의용군의 숙영지를 덮쳐 식료품을 모두 실어 갔다.\n\n나. 자성에서는 후창의 폭동 직후에 또 다른 식량 폭동이 일어났다. 신의주(Sinuiju, 일본식 Shingishu, 124-24, 40-06)에서 파견된 경찰이 폭동을 진압하지 못하자 소련군 부대를 불러들였고 폭동은 가라앉았다.\n\n25X1 (주: 앞서 보고된 것. 1월 중순부터 2월 첫 주까지 평안북도(North Pyongan Province)의 식량 폭동.)\n\n신의주에서 안둥(Antung 安東)으로 몰래 넘어가는 조선인의 수가 다음과 같이 늘고 있다. 1947년 1월에 67명이 압록강(Yalu River)을 건넜고, 2월에 116명, 3월에 4183 [원문 그대로]명, 4월 1일부터 7일까지 219명이다. 여기에는 도착한 뒤 안둥 조선인회(Antung Korean Association)에 알리지 않고 압록강을 건넌 것으로 알려진 상당수의 조선인 농민이 빠져 있다. 지금 동북(Northeast)으로 들어오는 조선인 가운데 상당수는 한때 만주국(Manchukuo)으로 이주하였다가 일본 항복 뒤 조선으로 돌아간 사람들이다. 이들이 지금 다시 동북으로 오는 이유는, 북조선인민위원회(North Korea People's Committee)가 한때 나라 밖에 살았다는 이유로 북조선에서 땅을 주기를 거부하기 때문이다.\n\n25X1A   경고(WARNING NOTICE): 이 배포처 목록은 삭제해야 한다\n\n3", "secondary": "Approved For Release 2003/08/05 : CIA-RDP82-00457R000600510008-5\n\n[판독 불가] is hereby regraded [판독 불가]\n\nWARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT.\n\nINTELLIGENCE REPORT\n\nCOUNTRY   Korea                                            DATE: 25X1\nSUBJECT   Economic Information: Public Discontent in North Korea\n                                                           DIST. [판독 불가] 1947\n                                                           PAGES 1\nORIGIN   25X1                                              SUPPLEMENT\n25X1\nDISTRIBUTION\nSTATE | WAR | NAVY | JUSTICE | [판독 불가] | [판독 불가] | | | | |\n\n1. The value of Soviet Occupation currency in North Korea has decreased as 25X1 follows during the first three months of 1947:\n\nJanuary......100 won equalled 105 Soviet notes.\nFebruary.....100 won equalled 115-120 Soviet notes.\nMarch........100 won equalled 136 Soviet notes.\n\n25X1\n\n2. Food riots occurred in Huchang (Kesho, 127-03, 41-25) and Chasong (Jijo, 126-36, 41-28) during late February and early March 1947. The riots are attributed to last year's poor harvest and the occupation of the district in November 1946 by 40-50,000 Chinese Communist and Korean Independent Volunteer Army troops who drained local food reserves.\n\na. In Huchang 5,000 people attacked the local police station and demanded food. Following this attack they raided the billet of the Korean Independent Volunteer Army and removed all foodstuffs.\n\nb. In Chasong another food riot occurred soon after the one in Huchang. Police dispatched from Sinuiju (Shingishu, 124-24, 40-06) could not quell the riot; whereupon Soviet elements were sent for and the riot subsided.\n\n25X1 (Note: Previously reported: Food riots in North Pyongan Province from the middle of January to the first week of February.)\n\nThe number of Koreans smuggling themselves from Sinuiju to Antung is increasing as follows: In January 1947, 67 crossed the Yalu River; in February, 116; in March, 4183 [원문 그대로]; and from 1-7 April, 219. Not included is a considerable number of Korean farmers known to have crossed the Yalu without informing the Antung Korean Association upon arrival. A number of Koreans now entering the Northeast had at one time migrated to Manchukuo and then returned to Korea after the Japanese surrender. Their reason for returning now to the Northeast is that the North Korea People's Committee refuses to grant them land in North Korea because they once resided outside the country.\n\n25X1A   WARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE\n\n3", "notes": ["[삭제·공개 표시] Approved For Release 2003/08/05 : CIA-RDP82-00457R000600510008-5 (공개 승인 도장)", "[삭제·공개 표시] WARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT (문서 위아래에 두 번 찍힌 배포처 목록 삭제 경고)", "[삭제·공개 표시] 25X1 (DATE 줄, ORIGIN 줄, 1항 본문 안, 1항과 2항 사이, 2항 끝의 주 앞. 모두 여섯 군데)", "[삭제·공개 표시] 25X1A (아래쪽 경고 문구 옆의 면제 표시)", "[삭제·공개 표시] [판독 불가] is hereby regraded [판독 불가] (등급 조정 도장)"], "note": "본문은 이 다섯 건 가운데 가장 잘 읽힌다. 배포 일자는 `DIST. & oj EE 1947` 로 찍혀 달과 날을 읽을 수 없어 [판독 불가]로 두었다. 등급 표시가 남아 있지 않아 classification 을 [판독 불가]로 두었다. 1항의 환율 세 줄에서 기준액 100 이 각각 `e100`, `L00`, `LOO` 로 찍혔다. 글자 O 와 숫자 0 의 혼동으로 보아 100 으로 읽었다. 환율 숫자 105, 115-120, 136 은 손대지 않았다. 3항의 3월 밀입국자 수는 `Waren, 4183` 으로 찍혀 있다. 67, 116, 219 의 흐름으로 보면 418 로 읽히나 통계 숫자이므로 고치지 않고 [원문 그대로]로 두었다. 지명은 원문 표기와 일본식 표기를 함께 살렸다. `Huchang (Kesho)` 는 후창(厚昌)이고 일본식 읽기는 Kosho 로 보이나 원문이 Kesho 로 찍혀 있어 그대로 두었다. `Chasong (Jijo)` 는 자성(慈城)이다. 좌표 (127-03, 41-25), (126-36, 41-28), (124-24, 40-06) 은 온전하다. 기관 이름은 원문을 앞세웠다. `Korean Independent Volunteer Army` 는 조선독립의용군, `North Korea People's Committee` 는 북조선인민위원회, `Antung Korean Association` 은 안둥 조선인회로 옮겼다. `Manchukuo` 는 만주국으로 두었다. 3항의 문단 번호가 스캔에서 사라져 번호 없이 이어진다. 새로 매기지 않았다. 면수 칸은 `PAGES i` 로 찍혀 1로 읽었다.", "warn": false, "search": "Approved For Release 2003/08/05 : CIA-RDP82-00457R000600510008-5 (공개 승인 도장) WARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT (문서 위아래에 두 번 찍힌 배포처 목록 삭제 경고) 25X1 (DATE 줄, ORIGIN 줄, 1항 본문 안, 1항과 2항 사이, 2항 끝의 주 앞. 모두 여섯 군데) 25X1A (아래쪽 경고 문구 옆의 면제 표시) [판독 불가] is hereby regraded [판독 불가] (등급 조정 도장) Economic Information: Public Discontent in North Korea"}, {"id": "N13", "order": 37, "date": "1947-06-13", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "정치 첩보: 북조선 여행에서 겪은 통제", "badge": "confidential (CONTROL U.S. OFFICIALS ONLY)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-06-13"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Political Information: Controls Encountered on a Trip through North Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000600680008-7"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000600680008-7"}], "summary": "북조선을 열차로 오간 사람이 겪은 검문을 구간별로 적었다. 신의주에서 평양을 거쳐 원산·함흥·나남까지 갔다가 청진에서 돌아온다.", "points": ["여행에 별도 허가증은 아직 필요하지 않다. 인민위원회가 낸 개인 신분증만 지니면 되고, 여행 신고 규정은 느슨하게 지켜진다.", "표를 산 뒤 승차 전에 사복 검사원이 통상 검문을 한다. 검사원은 대개 철도보안대 소속이다.", "열차가 떠난 뒤 조선인 세 명이 더 자세한 검문을 한다. 둘은 철도보안대 제복, 하나는 나이 든 사복이다.", "자세히 신문받는 쪽은 옷을 잘 입은 젊은 사람이다. 노동자나 농민이나 상인으로 보이지 않는 사람을 골랐다.", "묻는 것은 행선지, 여행 목적, 출신지, 소지금이 많은 이유, 반장 이름, 집 주소다. 답을 신분증과 맞추어 본인 여부를 가린다.", "신의주에서 정주 사이가 가장 엄하다. 목적지가 평양 남쪽인 승객에게 특히 주의를 기울인다.", "역과 열차 말고 도로에서도 검문한다. 의주 쪽 연하동에서 조선보안대 세 명이 버스를 세웠고, 일본식 38식 소총으로 무장하고 있었다.", "간니의 여관은 보안대 사복 순찰조가 날마다 점검한다. 소련군이 그 마을에 숙영하기 때문으로 보았다."], "primary": "25X1A2q\n\n[판독 불가]\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n[판독 불가]\n\n[판독 불가] 33599\n[판독 불가]\n\n주제   정치 첩보: 북조선 여행에서 겪은 통제\n                                                          배포(DIST.) 1947년 6월 13일\n\n                                                          면수(PAGES) 3\n\n                                                          보충(SUPPLEMENT)\n출처(ORIGIN)   [판독 불가]   25X1A6a   25X1X6\n\n일자(DATE):\n\n1. 여행에 특별한 허가증이나 서류는 아직 필요하지 않다. 인민위원회(Peoples Committee)가 발급한 개인 신분증(identification card)은 지니고 다녀야 한다. 이 증명서를 자주 검사하기 때문이다. 여행자가 등록된 구역의 지역 책임자에게 떠날 여행을 알리게 되어 있으나, 이 규정은 매우 느슨하게 지켜진다.\n\n2. 모든 사람은 대개 철도표를 산 뒤 열차에 오르기 전에 통상 검문을 받는다. 이 검문은 사복 검사원이 하며, 검사원은 대개 철도보안대(Railway Peace Preservation Corps) 소속이다. 시간이 모자라고 사람이 많아 이 신문은 제한적이며, 여행자의 목적지와 여행 목적을 묻고 개인 신분증을 확인하는 데 그친다. 작은 역에서 열차를 타는 승객은 승차를 허락받기 전에 더 자세한 신문을 받는다.\n\n3. 열차가 떠난 뒤에 또 한 번, 더 자세한 검문이 있다. 신의주(Sinuiju, 일본식 Shingishu) (124-24, 40-06)와 평양(Pyongyang, 일본식 Heijo) (125-44, 39-01) 사이의 구간을 빼면, 검문은 언제나 조선인 세 명이 하였다. 둘은 철도보안대 제복을 입었고, 하나는 나이가 든 사복 차림이었다. 승객은 모두 개인 신분증을 내보여야 했고 일부는 더 자세한 신문을 받았다. 자세히 신문받은 사람은 대개 젊은 사람이었고, 특히 옷을 잘 차려입어 노동자나 농민이나 상인으로 보이지 않는 사람이었다. 신문받는 사람의 수는 검사원의 기분에 달린 듯하였다. 어떤 때는 객차 안의 거의 모두를 신문하였고 어떤 때는 몇 사람만 하였다. 가장 자주 나온 물음은 이러하다. 어디로 가는가. 여행의 목적은 무엇인가. 어디서 왔는가. 왜 이렇게 많은 돈을 지니고 있는가. 당신의 반장은 누구인가. 집 주소는 어디인가. 개인 신분증에 적힌 내용에 관한 물음도 자주 나왔다. 답을 증명서와 맞추어 보아 여행자가 제 증명서를 잘 알고 있는지 가려냈다.\n\n문서번호(Document No.) [판독 불가]\n등급 변경 없음(NO CHANGE in) [판독 불가]\n[판독 불가] 1948 [판독 불가]\n\n등급(CLASSIFICATION)   기밀/미국 관리 한정 취급(CONFIDENTIAL/CONTROL U.S. OFFICIALS ONLY)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n정본화 - 공개 승인(Sanitized - Approved For Release) : [판독 불가]\n- 2 -   25X1A2g\n\n증명서 소지자의 본적지 사정에 관한 물음도 자주 나왔다. 개인과 짐에 대한 몸수색과 검사가 잦았고, 특히 여행자에게 의심을 살 만한 구석이 있을 때 그러하였다. 신의주와 정주(Chongju, 일본식 Teishu) (125-12, 39-42) 사이의 열차 검문은 검사원 두 명만 하였고 둘 다 사복이었다. 목적지가 평양 남쪽인 승객에게 특히 주의를 기울였다. 이 검문은 여행 전체에서 가장 엄한 축에 들었다.\n\n열차 여행 동안 다음의 검문이 있었다.\n\n신의주역                        통상 검문. 신분증을 내보임.\n\n신의주에서 정주                  검문 세 차례. 그 가운데 하나는 정주 도착 직전. 사람과 짐에 대한 수색이 있었음.\n\n평양에서 원산                    떠나기 전 평양에서 통상 역 검문. 원산으로 가는 길에 여러 차례\n(일본식 Genzan)                 검문. 여러 승객이 신문을 받았으나 신의주와 평양 사이보다\n(127-26, 39-10)                덜 엄하였음. 첫 검문은 열차가 떠난 지 한 시간 뒤에 있었음.\n\n원산역                          함흥(Hamhung, 일본식 Kanko) (127-32, 39-54)행 열차에 오르기 전 통상 역 검문.\n\n원산에서 함흥                    함흥 도착 직전 검문. 여러 승객이 신문받음. 엄한 정도는 평양과 원산 사이와 비슷하였음.\n\n함흥역                          나남(Nanam, 일본식 Ranan) (12941, 41-42) [원문 그대로]행 열차에 오르기 전 통상 역 검문.\n\n함흥에서 나남                    신분증 검사 한 차례.\n\n돌아오는 길\n\n청진(Chongjin, 일본식 Seishin)   이 역에서는 열차가 떠나기 전에 통상 검사가 없었음.\n(2.29540,41-46) [원문 그대로]역\n\n청진에서 평양                    검문 세 차례\n\n평양에서 신의주                  평양에서 통상 역 검문. 평양과 신의주 사이에 검문 두 차례. 북조선 남부에서 온 여행자에게 특히 주의를 기울임.\n\n정주와 평양 사이, 그리고 나남과 청진 사이에서는 도로 차단이나 검문을 만나지 않았다.\n\n기밀/미국 관리 한정 취급(CONFIDENTIAL/CONTROL U.S. OFFICIALS ONLY)\n\n정본화 - 공개 승인(Sanitized - Approved For Release) : CIA-RDP82-00457R000600680008-7\n\n정본화 - 공개 승인(Sanitized - Approved For Release) : CIA-RDP82-00457R0[판독 불가]08-7\n25X1A2q\n\n철도역이나 열차 안에서 있었던 위의 검문 말고도, 여행 동안 다음의 검문이 있었다.\n\n도로 검문                        [판독 불가]와 의주(Uiju, 일본식 Gishu) 사이 [판독 불가] 연하동(Yonha-dong) (124-28, 40-08)에서 공영 버스가 세워졌다. 승객은 모두 신분증을 내보여야 했고, 조선보안대(Korean Peace Preservation Corps) 대원 세 명에게 신문을 받았다. 이들은 카키색 제복을 입었고 차가 다가오는 소리를 듣고 도로로 나왔다. 이들은 일본식 38식(M-38) 소총으로 무장하고 있었다. 개인과 짐에 대한 몸수색이 있었고, 물은 것은 대체로 열차의 검사원이 묻는 것과 같았으며, 답은 신분증에 적힌 내용과 맞추어 보았다. 다른 검문소에 견주면 이 검문소는 신문이 느슨하였다. 다만 승객이 북조선의 다른 지역에서 온 사람이면 신문이 훨씬 엄하였다.\n\n여관 조사                        간니(Kanni)([한자 판독 불가]) (Chonni --- 125.36, 39-107) [원문 그대로]의 여관에 묵는 여행자는 모두 조사를 받는다. 간니는 작은 마을이다. 보안대(Peace Preservation Corps) 소속 사복 서너 명으로 이루어진 상설 순찰조가 조사를 한다. 이 순찰조는 여관을 날마다 점검하고 모든 여행자를 신문한다. 신문이 이렇게 잦은 이유 하나는 소련군이 이 마을에 숙영하고 있기 때문일 수 있다.\n\n기밀/미국 관리 한정 취급(CONFIDENTIAL/CONTROL U.S. OFFICIALS ONLY)\n\n정본화 - 공개 승인(Sanitized - Approved For Release) : CIA-RDP82-00457R000600680008-7", "secondary": "25X1A2q\n\n[판독 불가]\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\n[판독 불가]\n\n[판독 불가] 33599\n[판독 불가]\n\nSUBJECT   Political Information: Controls Encountered on a Trip through North Korea\n                                                          DIST. 13 June 1947\n\n                                                          PAGES 3\n\n                                                          SUPPLEMENT\nORIGIN   [판독 불가]   25X1A6a   25X1X6\n\nDATE:\n\n1. No special permits or papers are required for travel as yet. It is necessary to carry the individual identification card issued by the Peoples Committee as this card is frequently checked. The local district leader of the district in which the traveler is registered is to be informed of any trips about to be taken but this regulation is very loosely complied with.\n\n2. All individuals are usually subjected to a routine check after the purchase of their railroad tickets and before boarding the train. This is conducted by a plainclothes inspector who is usually a member of the Railway Peace Preservation Corps. Because of the lack of time and the many individuals involved this is a limited interrogation and consists only of inquiries regarding the traveler's destination and purpose, and an inspection of the traveler's personal identification card. Passengers boarding the train at smaller stations are subjected to a more detailed questioning before being allowed to board the train.\n\n3. Another, more detailed check is conducted after the train has started. With the exception of the trip between Sinuiju (Shingishu) (124-24, 40-06) and Pyongyang (Heijo) (125-44, 39-01), the check was always conducted by three Koreans, two in the uniform of the Railway Peace Preservation Corps and one, an older man, in plain clothes. All passengers were required to show their personal identification cards and some were subjected to a more detailed questioning. Those questioned in detail were usually young people, particularly those who were well dressed and who did not resemble laborers, farmers or merchants. The number of people questioned seemed to depend upon the mood of the inspector, who sometimes questioned almost everyone in the car and other times, only a few. Questions asked most frequently were: Where are you going? What is the purpose of your trip? Where are you from? Why do you have so much money? Who is your section leader? What is your home address? Questions were often asked about the information contained on the personal identification card, the answers being checked against the card to determine whether the traveler was familiar with his own card.\n\nDocument No. [판독 불가]\nNO CHANGE in [판독 불가]\n[판독 불가] 1948 [판독 불가]\n\nCLASSIFICATION   CONFIDENTIAL/CONTROL U.S. OFFICIALS ONLY\n\nCENTRAL INTELLIGENCE GROUP\nSanitized - Approved For Release : [판독 불가]\n- 2 -   25X1A2g\n\nQuestions were often asked about local conditions in the home district of the card holder. Personal search of individuals and baggage was frequently made, particularly when there was anything about a traveler to arouse suspicion. The inspection on the train between Sinuiju and Chongju (Teishu) (125-12, 39-42) was conducted by only two inspectors, both in plain clothes. Particular attention was paid to any passenger whose destination was south of Pyongyang. This inspection was one of the most strict of the trip.\n\nThe following inspections were made during the train trip:\n\nSinuiju station                Routine check. Identification cards shown.\n\nSinuiju to Chongju             Three inspections, one immediately preceding arrival at Chongju. Search of persons and baggage made.\n\nPyongyang to Wonsan            Routine station inspection at Pyongyang before leaving.\n(Genzan)                       Several checks made on way to Wonsan. Several passengers\n(127-26, 39-10)                questioned but examination less strict than that between Sinuiju and Pyongyang. First inspection took place one hour after departure of the train.\n\nWonsan station                 Routine station inspection before boarding train to Hamhung (Kanko) (127-32, 39-54)\n\nWonsan to Hamhung              Inspection immediately preceding arrival at Hamhung. Several passengers questioned. About the same degree of strictness as exercised between Pyongyang and Wonsan.\n\nHamhung station                Routine station inspection before boarding train to Nanam (Ranan) (12941, 41-42) [원문 그대로].\n\nHamhung to Nanam               One inspection of identification cards.\n\nReturn Trip\n\nChongjin (Seishin)             There was no routine examination at this station prior to\n(2.29540,41-46) [원문 그대로]   departure of the train.\nStation\n\nChongjin to Pyongyang          Three inspections\n\nPyongyang to Sinuiju           Routine station inspection at Pyongyang. Two inspections between Pyongyang and Sinuiju. Particular attention paid to any travelers from south part of North Korea.\n\nNo road barriers or checks were encountered between the cities of Chongju and Pyongyang nor between the cities of Nanam and Chongjin.\n\nCONFIDENTIAL/CONTROL U.S. OFFICIALS ONLY\n\nSanitized - Approved For Release : CIA-RDP82-00457R000600680008-7\n\nSanitized - Approved For Release : CIA-RDP82-00457R0[판독 불가]08-7\n25X1A2q\n\nIn addition to the above inspections which took place in railway stations or on board trains, the following inspections were made during the trip:\n\nRoad inspection                Between [판독 불가] and Uiju (Gishu) [판독 불가] at Yonha-dong (124-28, 40-08), a public bus was stopped; all passengers were required to show their identification cards and were questioned by three members of the Korean Peace Preservation Corps, who wore khaki uniforms and who came out on the road upon hearing the vehicle approaching. They were armed with Japanese-type M-38 rifles. A personal search of the individuals and their baggage was made and the questions asked were generally the same as those asked by inspectors on the trains, the answers being checked against the information on the identification cards. In comparison to other stations, this station was lax in its questioning. If the passenger was from some other area of North Korea, however, the questioning was much more strict.\n\nHotel investigation            All travelers stopping in the hotel at Kanni ([한자 판독 불가]) (Chonni --- 125.36, 39-107) [원문 그대로], a small village, are investigated by a regular patrol of three or four plainclothes men who belong to the Peace Preservation Corps. This patrol also checks the hotel daily and questions all travelers. One reason for the extensive questioning may be that Soviet troops are billeted in the town.\n\nCONFIDENTIAL/CONTROL U.S. OFFICIALS ONLY\n\nSanitized - Approved For Release : CIA-RDP82-00457R000600680008-7", "notes": ["[삭제·공개 표시] Sanitized - Approved For Release : CIA-RDP82-00457R000600680008-7 (2면과 3면 아래의 공개 승인 도장)", "[삭제·공개 표시] Sanitized - Approved For Release : CIA-RDP82-00457R0[판독 불가]08-7 (3면 머리의 공개 승인 도장. 가운데가 잘려 있다)", "[삭제·공개 표시] Sanitized - Approved For Release : [판독 불가] (2면 머리의 공개 승인 도장)", "[삭제·공개 표시] 25X1A2q (1면 머리와 3면 머리의 면제 표시)", "[삭제·공개 표시] 25X1A2g (2면 머리의 면제 표시)", "[삭제·공개 표시] 25X1A6a, 25X1X6 (ORIGIN 줄의 면제 표시. 인적 정보원)", "[삭제·공개 표시] ORIGIN 줄의 출처 표시가 판독되지 않아 [판독 불가]로 옮겼다", "[삭제·공개 표시] Document No. 도장과 등급 변경 도장(NO CHANGE in Class.)이 뭉개져 있다"], "note": "다섯 건 가운데 본문이 가장 온전하다. 헤더는 거의 남지 않았다. 좌표를 고치지 않았다. 함흥역 줄의 나남 좌표는 `(12941, 41-42)` 로 찍혀 경도의 도와 분 사이 구분이 없다. 청진역 줄의 좌표는 `(2.29540,41-46)` 으로 앞자리가 깨져 있다. 여관 조사 줄의 `(Chonni---125.36, 39-107)` 은 위도의 분이 107 로 성립하지 않는 값이다. 셋 다 원문대로 두었다. 정주 좌표가 이 문서에서는 `(125-12, 39-42)` 인데 같은 여행을 다룬 N14 에서는 `(125-22, 39-42)` 다. 어느 쪽도 고치지 않았다. 신의주 `(124-24, 40-06)`, 평양 `(125-44, 39-01)`, 원산 `(127-26, 39-10)`, 함흥 `(127-32, 39-54)`, 연하동 `(124-28, 40-08)` 은 온전하다. 지명은 조선 이름과 일본식 이름을 둘 다 살렸다. 여관이 있던 마을은 `Kanni` 로 적히고 괄호 안에 `Chonni` 가 붙어 있다. 원문의 한자는 뭉개져 [한자 판독 불가]로 두었다. 이 마을은 N14 에도 `Kanni`, `(Chonni?)` 로 나온다. 기관 이름은 원문을 앞세웠다. `Peace Preservation Corps` 는 보안대, `Railway Peace Preservation Corps` 는 철도보안대, `Korean Peace Preservation Corps` 는 조선보안대로 옮겼다. `Peoples Committee` 는 원문에 아포스트로피가 없어 그대로 두었고 인민위원회로 옮겼다. `Japanese-type M-38 rifles` 는 일본 38식 보병총을 가리키는 것으로 보이나 원문 표기를 살렸다. 1면 아래 도장의 `1as8.` 은 1948 로 읽었으나 앞뒤가 끊겨 확정되지 않는다. 3항 첫머리는 `30` 으로 찍혀 3항으로 읽었다.", "warn": false, "search": "Sanitized - Approved For Release : CIA-RDP82-00457R000600680008-7 (2면과 3면 아래의 공개 승인 도장) Sanitized - Approved For Release : CIA-RDP82-00457R0[판독 불가]08-7 (3면 머리의 공개 승인 도장. 가운데가 잘려 있다) Sanitized - Approved For Release : [판독 불가] (2면 머리의 공개 승인 도장) 25X1A2q (1면 머리와 3면 머리의 면제 표시) 25X1A2g (2면 머리의 면제 표시) 25X1A6a, 25X1X6 (ORIGIN 줄의 면제 표시. 인적 정보원) ORIGIN 줄의 출처 표시가 판독되지 않아 [판독 불가]로 옮겼다 Document No. 도장과 등급 변경 도장(NO CHANGE in Class.)이 뭉개져 있다 Political Information: Controls Encountered on a Trip through North Korea"}, {"id": "N14", "order": 38, "date": "1947-06-18", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "군사 첩보: 북조선의 소련군", "badge": "[판독 불가]", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-06-18"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Soviet Troops in North Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000600750002-5"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000600750002-5"}], "summary": "북조선 각 도시의 소련군 배치를 적었다. 서북부는 병력이 줄고 청진·나남·원산에는 그대로 있다. 원산과 청진의 항만 통제를 자세히 다룬다.", "points": ["머리에 단서를 달았다. 내용이 일반적이고 잡다하나 앞선 보고들을 뒷받침할 수 있다는 것이다.", "평양과 신의주 사이 서북부에서 소련군이 크게 줄었다. 사람들의 가장 큰 이야깃거리가 소련군 철수다.", "원산·청진·나남에서만 사람들이 소련군이 곧 떠나지 않으리라고 본다. 병력이 많은 순서도 청진, 나남, 원산이다.", "보안대 대원이 나남의 소련군을 5만 명대로 말한다. 다만 자릿수가 스캔에서 뭉개져 있다.", "원산은 해안에서 떨어진 곳에 철조망 장벽을 쳤고 소련인과 조선인 경비병이 100-150피트마다 선다. 항만 출입에 특별 통행증이 필요하다.", "원산항의 하역 일을 조선인에게서 소련인으로 바꾸었다. 소련이 이 도시를 제 항구로 삼으려 한다는 소문이 상인들 사이에 돈다.", "청진에는 지상군 말고 공군과 해군 인원이 많이 보인다. 날개 아래 붉은 별을 단 비행기가 도시 위를 난다.", "간니에 미국제 2.5톤 화물차 20대 넘게, 작은 전차 다섯 대, 야포 여러 문이 있다. 정주와 평양 사이에서 눈에 띄는 유일한 소련군 부대다.", "소련군이 시장에서 현지 상인을 통해 물건을 판다. 연필, 시계, 러시아 빵이 자주 팔린다."], "primary": "25X1A8a\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가   조선(Korea)                                            25X1A6a\n\n주제   군사 첩보: 북조선의 소련군\n                                                           배포(DIST.) 1[판독 불가] 6월 [2987 원문 그대로]\n\n                                                           면수(PAGES) 2\n\n25X1A6a                                                    보충(SUPPLEMENT)\n출처(ORIGIN)   [판독 불가]\n\n25X1X6\n\n25X1A6\n\n(주: 여기에 담긴 정보는 일반적이고 잡다한 성격이나, 앞선 보고들을 뒷받침하는 데 쓰일 수 있다.)\n\n25X1X6\n\n1. 평양(Pyongyang, 일본식 Heijo) (L25-44, B9OL) [원문 그대로]과 신의주(Sinuiju) ([판독 불가], 1O-06) [원문 그대로] 사이의 지역, 곧 북조선 서북부 전역에서 소련군 병력이 크게 줄었다. [판독 불가] 러시아군의 수 [판독 불가] 병력이 최근 이 지역에서 [판독 불가]된 것으로 추산된다. [판독 불가] 사람들 사이의 가장 큰 이야깃거리는 소련군이 철수할 수 있다는 것이다. 원산(Wonsan), 청진(Chongjin), 나남(Nanam)에서만 사람들이 소련군이 가까운 시일 안에 철수하지 않으리라고 믿는다. 소련군이 가장 많은 곳은 청진, 나남, 원산 지역 순이다.\n\n25X1X6\n\n2. 보안대(Peace Preservation Corps) 대원 한 사람은 나남에 소련군 50,[판독 불가]명이 있다고 말한다. 정보원 자신도 적어도 그만큼은 있다고 본다. 소련군은 함흥(Hamhung, 일본식 Kanko) (21-82, 29-58) [원문 그대로]에 그보다 적게 있고 평양에는 더 적다.\n\n25X1X6\n\n2. [원문 그대로] 원산의 소련군\n\n가. 원산에서는 해안에서 40-560 [원문 그대로]미터 떨어진 곳에 철조망 장벽이 있다. 이 장벽은 해안을 따라 [판독 불가] 거리만큼 뻗어 있고 항만 구역 전체를 [판독 불가] 둘러싼다. 소련인과 조선인 경비병이 이 장벽을 따라 100-150피트마다 배치되어 있다.\n\n나. [판독 불가] 구역에 들어가려면 특별 통행증이 있어야 하고, 그 통행증이 있어도 조선인 노동자는 일부 구역에 들어갈 수 없다. 소련군은 전에는 배의 짐을 싣고 부리는 데 조선인을 썼으나, 지금 이 일은 소련인이 한다. 원산항과 그 둘레의 [판독 불가] 구역 일부는 어선의 출입이 제한된다. 상인들 사이에는 소련이 이 도시를 소련의 항구로 삼으려 한다는 소문이 돈다.\n\n[판독 불가]\n\n25X1X6\n\n3. [판독 불가]의 소련군\n\n도시를 둘러싼 [판독 불가]에, 특히 철도역 동쪽 산에 콘크리트 [판독 불가]([판독 불가])가 많이 있다.\n\n문서번호(Document No.) [판독 불가]\n[판독 불가]\n\n25X1X6\n\n5.\n\n25X1X6\n\n6.\n\n[판독 불가]\n\n25X1X6\n\n[판독 불가] 학교 건물, 걸어서 북쪽으로 약 30분\n\n나. 도시에 소련 [판독 불가]이 많이 있고 그 가운데 다수가 장교다.\n\n다. 여론에 따르면 도시 안의 소련군 수가 [판독 불가] 늘고 있다.\n\n라. 교외에서 훈련과 사격 연습을 한다.\n\n가. 정규 소련 지상군 말고도 소련 공군 병력, 소련 [판독 불가], 소련 해군 인원이 청진에서 많이 눈에 띈다.\n\n나. 많은 비행기가 도시 위를 난다. 일부는 날개 아래쪽에 붉은 별이 그려져 있고 [판독 불가] 조선 국기가 있다.\n\n다. 소련인과 조선인 경비병이 철도역에 배치되어 있다. [판독 불가] 그들의 [판독 불가]\n\n라. [판독 불가] 철조망 장벽. 이 더미는 길이 약 60야드, 너비 [판독 불가]야드, 높이 [판독 불가] 40피트다.\n\n가. 항만 구역은 [판독 불가]에서 500-600미터 떨어진 곳까지 출입이 제한된다. 소련인 경비병 두 명이 항만 둘레 100미터마다 배치되어 있다. 조선인 노동자가 항만 구역 안에서 일한다.\n\n[판독 불가] (Chonni?) (125-38, [판독 불가])\n\n간니(Kanni)에는 미국제 2.5톤 화물차가 20대 넘게 있고, 작은 전차 다섯 대, 고무 타이어에 얹은 야포 여러 문, 그리고 소련군 약 1.50 [원문 그대로]명이 있다. 이것은 정주(Chongju, 일본식 Teishu) (125-22, 39-42)와 평양 사이에서 눈에 띌 만한 규모의 유일한 소련군 부대다.\n\n소련군의 물품 판매\n\n위에 든 도시들의 시장 지역 상인들에 따르면, 소련군은 물품을 현지 상인을 통해 처분하는 일이 잦다. 가장 자주 팔리는 물품은 [판독 불가], 연필, 시계, 러시아 빵이다.\n\n나. 경전차 50대 넘게와 다수의 소련군이 철도역에서 [판독 불가] 떨어진 곳에 모여 있다.", "secondary": "25X1A8a\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCOUNTRY   Korea                                            25X1A6a\n\nSUBJECT   Military Information: Soviet Troops in North Korea\n                                                           DIST. 1[판독 불가] June [2987 원문 그대로]\n\n                                                           PAGES 2\n\n25X1A6a                                                    SUPPLEMENT\nORIGIN   [판독 불가]\n\n25X1X6\n\n25X1A6\n\n(Note: Although the information contained herein is general and miscellaneous in nature, it may serve as confirmation of previous reports.)\n\n25X1X6\n\n1. There has been a large reduction of Soviet troop strength throughout northwest Korea in the area between Pyongyang (Heijo) (L25-44, B9OL) [원문 그대로] and Sinuiju ([판독 불가], 1O-06) [원문 그대로] and it is estimated [판독 불가] number of Russian troops [판독 불가] strength has been [판독 불가] in these areas recently. [판독 불가] the main topic of conversation among the people is the possible withdrawal of Soviet troops. Only in Wonsan, Chongjin, and Nanam do the people believe that Soviet troops will not be withdrawn in the near future. The greatest numbers of Soviet troops are in the Chongjin, Nanam and Wonsan areas in that order.\n\n25X1X6\n\n2. A member of the Peace Preservation Corps states that there are 50,[판독 불가] Soviet troops in Nanam and source also believes that there are at least that many there. Lesser numbers of Soviet troops are in Hamhung (Kanko) (21-82, 29-58) [원문 그대로] and still less in Pyongyang.\n\n25X1X6\n\n2. [원문 그대로] Soviet Troops in Wonsan\n\na. At Wonsan barbed wire barriers are encountered 40-560 [원문 그대로] meters from the coast, extending a [판독 불가] distance around the coast and enclosing the entire [판독 불가] port area. Guards, both Soviet and Korean, are stationed every 100-150 feet along this barrier.\n\nb. A special pass is necessary to enter the [판독 불가] area, but even with this pass Korean laborers are restricted from some of the area. The Soviets formerly employed Koreans to load and unload the ships, but this type of work is now done by Soviets. The port of Wonsan and part of the surrounding [판독 불가] area is restricted to fishing boats. There are rumors among the merchants that the Soviets intend to retain the city for a Soviet port.\n\n[판독 불가]\n\n25X1X6\n\n3. Soviet Troops in [판독 불가]\n\nThere are many concrete [판독 불가] ([판독 불가]) on the [판독 불가] around the city and particularly on the mountain east of the railway station.\n\nDocument No. [판독 불가]\n[판독 불가]\n\n25X1X6\n\n5.\n\n25X1X6\n\n6.\n\n[판독 불가]\n\n25X1X6\n\n[판독 불가] school building approximately 30 minutes walk north\n\nb. There are a large number of Soviet [판독 불가] in the city, many of whom are officers.\n\nc. According to public opinion there is a [판독 불가] increase in the number of Soviet troops in the city.\n\nd. Training and rifle practice is carried on in the suburbs.\n\na. In addition to the regular Soviet ground troops, large numbers of Soviet air force troops, Soviet [판독 불가] and Soviet naval personnel are seen in Chongjin.\n\nb. Many airplanes fly over the city, some marked with a red star on the underside of their wings, [판독 불가] with the Korean national flag.\n\nc. Soviet and Korean guards are stationed at the railway station. [판독 불가] of their [판독 불가]\n\nd. [판독 불가] barbed wire barriers. These piles are approximately 60 yards long, [판독 불가] yards wide and [판독 불가] 40 feet high.\n\na. The port area, 500-600 meters from the [판독 불가], is restricted. Two Soviet guards are stationed every 100 meters around the port. Korean laborers work inside the harbor area.\n\n[판독 불가] (Chonni?) (125-38, [판독 불가])\n\nThere are more than 20 two and one-half ton trucks of American make, five small tanks, several artillery pieces mounted on rubber tires, and about 1.50 [원문 그대로] Soviet troops in Kanni. This is the only Soviet unit of any appreciable size between Chongju (Teishu) (125-22, 39-42) and Pyongyang.\n\nSale of Articles by Soviet Troops\n\nAccording to the merchants in the market areas of the above-mentioned cities, Soviet troops often dispose of articles through the local merchants. Articles most frequently sold are [판독 불가], pencils, watches and Russian bread.\n\nb. Over 50 light tanks and a large number of Soviet troops are concentrated at a [판독 불가] from the railway station.", "notes": ["[삭제·공개 표시] 25X1A8a (1면 머리의 면제 표시)", "[삭제·공개 표시] 25X1A6a (COUNTRY 줄과 SUPPLEMENT 줄의 면제 표시)", "[삭제·공개 표시] 25X1A6 (본문 앞 주 옆의 면제 표시)", "[삭제·공개 표시] 25X1X6 (각 항목 옆 여백에 여덟 번 찍힌 면제 표시. 인적 정보원)", "[삭제·공개 표시] ORIGIN 줄의 출처 표시가 판독되지 않아 [판독 불가]로 옮겼다", "[삭제·공개 표시] Document No. 도장이 뭉개져 있다", "[삭제·공개 표시] 공개 승인 도장은 이 OCR 본문에 남아 있지 않다"], "note": "2면이 두 단으로 짜여 있는데 OCR 이 단의 순서를 흩어 놓았다. 항목이 실제 문서에서 어느 도시에 붙는지 확정할 수 없어 원문 파일에 나온 순서를 그대로 지키고 새로 배열하지 않았다. 3항의 표제는 `Sox: Troupe tp Hans` 로 찍혀 도시 이름을 확정할 수 없다. 나남으로 보이나 [판독 불가]로 두었다. 항목 번호도 뭉개져 있다. 원산 절은 `Ze` 로 찍혀 2로 읽히나 앞 문단이 이미 2항이다. 번호를 고치지 않고 [원문 그대로]로 표시했다. 4항이 보이지 않고 5와 6만 번호로 남았다. 병력 수를 고치지 않았다. 나남의 소련군은 `50, aon` 으로 찍혀 뒷자리를 읽을 수 없다. 50,000 으로 보이나 채우지 않고 50,[판독 불가]로 두었다. 간니의 소련군은 `1.50` 으로 찍혀 있다. 150 으로 보이나 원문대로 두었다. 원산의 철조망 거리는 `40-560 metare` 로 찍혀 있다. 40-50 으로 보이나 원문대로 두었다. 좌표도 고치지 않았다. 평양은 `(L25-44, B9OL)` 로 자리마다 글자가 섞였고, 신의주는 `Sight earn 1O-06)` 으로 앞부분이 무너졌으며, 함흥은 `(21-82, 29-58)` 로 도가 성립하지 않는다. 셋 다 N13 에서 각각 (125-44, 39-01), (124-24, 40-06), (127-32, 39-54)로 온전히 찍혀 있으나 이 문서의 숫자는 손대지 않았다. 정주는 이 문서에서 `(125-22, 39-42)` 이고 N13 에서는 `(125-12, 39-42)` 다. 어느 쪽도 고치지 않았다. 배포 일자는 `ist. 1s Jase 2987` 로 찍혀 날과 연도를 읽을 수 없다. 연도 2987 은 그대로 두었다. 가장 자주 팔린 물품의 첫 항목은 `TENS` 로 찍혀 pens 로 보이나 확정되지 않아 [판독 불가]로 두었다. 등급 표시가 이 OCR 에 남아 있지 않아 classification 을 [판독 불가]로 두었다. 지명은 조선 이름과 일본식 이름을 둘 다 살렸다. `Kanni` 는 N13 에도 나오는 마을이며 괄호 안의 `(Chonni?)` 는 원문의 물음표까지 그대로 옮겼다.", "warn": true, "search": "25X1A8a (1면 머리의 면제 표시) 25X1A6a (COUNTRY 줄과 SUPPLEMENT 줄의 면제 표시) 25X1A6 (본문 앞 주 옆의 면제 표시) 25X1X6 (각 항목 옆 여백에 여덟 번 찍힌 면제 표시. 인적 정보원) ORIGIN 줄의 출처 표시가 판독되지 않아 [판독 불가]로 옮겼다 Document No. 도장이 뭉개져 있다 공개 승인 도장은 이 OCR 본문에 남아 있지 않다 Military Information: Soviet Troops in North Korea"}, {"id": "N15", "order": 39, "date": "1947-06-24", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "경제 첩보: 북조선의 교통", "badge": "confidential (CONTROL U.S. OFFICIALS ONLY)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-06-24"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Economic Information: Transportation in North Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000700050002-1"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000700050002-1"}], "summary": "북조선을 한 차례 통과하며 본 것을 적은 보고다. 여객열차 시각표와 운임, 선로 복선 여부, 지연의 원인, 버스와 트럭 운수를 담았다.", "points": ["여객열차 시각표를 노선별로 적었다. 신의주에서 평양까지 운임 113원, 원산에서 함흥까지 129원이다. 대부분 노선이 하루 한 편이다.", "신의주에서 평양까지 계획 시간은 아홉 시간인데 실제로는 12~13시간이 걸리고 이틀까지 걸리기도 한다고 적었다.", "**소련 열차가 조선 열차보다 우선한다.** 1947년 2월 12일 양덕에서 조선인 여객열차의 기관차를 떼어 소련 화물열차에 붙여 다섯 시간 넘게 지연되었다.", "양덕 역장이 승객에게 소련인이 조선인 승객보다 우선한다고 대놓고 설명한 대목이 그대로 실려 있다.", "객차는 좌석이 뜯기고 창문이 깨진 채 극도로 붐빈다. 소련 병사는 전용 열차나 전용 객차를 쓰나 동해안에서는 조선인과 같은 객차를 타기도 한다.", "선로 상태를 1945년 2월 기준 재니스 제75호와 대조한다. 미국이 일본 시기의 조사 자료를 아직 기준으로 쓰고 있다는 뜻이다.", "신의주와 의주 사이 버스는 목탄, 도시 사이 트럭은 카바이드를 연료로 쓴다. 트럭은 개인 소유이나 인민위원회 교통국이 통제한다."], "primary": "자료센터(REFERENCE CENTER) [판독 불가]\n\n기밀(CONFIDENTIAL)   33787 [원문 그대로]\n미국 관리 전용 통제(CONTROL U.S. OFFICIALS ONLY)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가   [판독 불가]\n주제   경제 첩보: 북조선의 교통(Economic Information: Transportation in North Korea)\n배포(DIST.)  2h June 19247 [원문 그대로]\n25X1A     면수  2\n          보충(SUPPLEMENT)\n\n25X1X\n\n1. 여객열차 시각표\n\n주(注): 아래에 적은 출발 시각과 도착 시각은 대략의 것이며, 북조선을 한 차례 통과하며 관찰한 것에 근거한다.\n25X1A\n\n출발지                도착지                출발     도착     비고\nSinuiju 신의주        Pyongyang 평양       0760     1600     운임 113원. 통상 12~13시간이\n(Shingishu 신기슈)    (Heijo 헤이조)        [원문     [원문     걸리나 이틀까지 걸릴 수 있다.\n(124-24, 40-06)      (125-44, 39-01)      그대로]    그대로]    하루 한 편. 계획 시간은 9시간.\n\nPyongyang 평양       Sinuiju 신의주       1106     2100     하루 한 편.\n                                         [원문 그대로]\n\nPyongyang 평양       Wonsan 원산          1500              하루 한 편.\n                    (Genzan 겐잔)\n                    (127-26, 39-1C)\n                    [원문 그대로]\n\nWonsan 원산          Hamhung 함흥         0[판독   1700*     운임 129원. 원산에서 북쪽으로\n                    (Kanko 간코)          불가]00            하루 한 편이 떠난다.\n                    (127232, 39-54)\n                    [원문 그대로]\n\nHamhung 함흥         Nanam 나남           1500     2.100*   원산에서 출발해 북쪽으로\n                    (Ranan 라난)                   [원문     운행하는 그 열차다.\n                    (129-41, 41°42)               그대로]\n                    [원문 그대로]\n\nChongjin 청진        Pyongyang 평양       1700     1300 (다음 날)\n(Seishin 세이신)                                            하루 한 편.\n(129-49, 41-46)\n\nChongjin 청진        Wonsan 원산          0900              하루 한 편. (청진에서는 하루\n                                                          두 편이 떠난다. 하나는 평양행,\n                                                          하나는 원산행이다.)\n25X1A\n\n2. 원산과 함흥 사이의 거리는 함흥과 나남 [판독 불가] 사이의 대략 3분의 1에 지나지 않는데도, 위에 적힌 원산과 함흥 사이의 소요 시간은 아홉 시간이고 함흥과 나남 사이는 여섯 시간뿐이다.\n\n문서번호 [판독 불가]\n\n기밀/미국 관리 전용 통제(CONFIDENTIAL/CONTROL U.S. OFFICIALS ONLY)\n\n기밀(CONFIDENTIAL)\n\n[공개 승인 2001/03/05 : CIA-RDP82-00457R000700050002-1]\n[판독 불가]\n\n[공개 승인 2001/03/05 : CIA-RDP82-00457R000700050002-1]\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n25X1X\n\n신의주와 평양 사이의 철도는 복선이나 한 선로만 쓰인다. 여객열차는 맞은편에서 오는 열차나 소련 열차가 지나가도록 대피선에서 기다려야 한다.\n\n평양과 원산 사이의 철도는 [판독 불가] 북동쪽으로 짧은 구간이 복선이고 고원(Kowon, Kogen 고겐) (127-14, 39-26)까지 이어지며, 원산까지 [판독 불가] 복선이다. 주(注): 「평양에서 북동쪽으로 짧은 복선 구간」이라는 말은 신의주와 평양 사이 본선 가운데 평양~원산 노선에 쓰이는 부분을 가리키는 것으로 보인다. 또한 재니스(Janis) 제75호 제7장에 따르면 고원에서 원산까지의 노선은 1945년 2월 현재 단선이다.\n\n원산에서 청진까지의 철도는 복선이다. (주: 재니스 제75호 제7장은 이 철도를 1945년 2월 현재 단선으로 표시한다.)*\n\n블라디보스토크와 북조선 사이에는 직결 철도가 없다. 철도 운수는 만주 동부를 거쳐 시베리아로 들어가는 경로를 탄다. (주: 재니스 제75호 제7장은 조선 국경의 훈융(Hunyung)(Kunju) (130-15, 42-55)에서 블라디보스토크로 나가는 단선 철도를 표시한다.)**\n\n운행 지연이 잦으며 몇 시간에서 며칠까지 이어질 수 있다. 지연의 한 원인은 철도가 쓸 수밖에 없는 저질 석탄과 기름이다. 소련 열차가 다른 열차보다 우선하므로 소련 화물열차와 여객열차가 지나가기를 기다려야 하는 일이 잦다. 1947년 2월 12일 양덕(Yangdok, Yotoku 요토쿠) (126-54, 39-10)에서 다섯 시간이 넘는 지연이 생겼는데, 조선인 여객열차의 기관차를 떼어 소련 화물열차에 붙였기 때문이다. 양덕의 조선인 역장은 승객들에게 소련인이 조선인 승객보다 우선하며 다른 기관차가 올 때까지 기다려야 한다고 설명하였다.\n\n7. 여객열차는 보통 일곱 량이나 여덟 량으로 이루어진다. 객차는 상태가 나빠 좌석이 뜯겨 나가고 창문이 깨져 있으며 대개 극도로 붐빈다. 조선인 여객열차의 기관사는 조선인이고 소련 열차의 기관사는 소련인이다. 이따금 소련 기관사가 소련군 외투를 입고 있는 것이 보이는데 소련군 소속일 수 있다. 소련 병사들은 특별열차를 타거나 조선 열차에 붙인 전용 객차를 탄다. 다만 동해안에서는 소련 병사가 조선인 승객과 같은 객차에 타는 일도 있다.\n25X1X\n\n8. 신의주와 의주(Uiju, Gishu 기슈) (224-32, 40-12) [원문 그대로] 사이의 공영 버스 노선\n\n신의주와 의주 사이에 버스 두 대가 다니며 둘 다 목탄을 연료로 쓴다. 버스는 신의주에서 의주로 0[판독 불가]00시부터 1600시까지 매시 정각에 다니고, 의주에서 신의주로는 0900시부터 1700시까지 다닌다. 운임은 38원이다. 버스마다 30명이 앉을 자리가 있으나 대개 정원을 넘겨 붐빈다. 고장이 잦고 시각표는 지켜지지 않는다. 북조선의 다른 큰 도시들 사이에도 버스 노선이 운행한다.\n\n[판독 불가] 운수\n\n북조선의 큰 도시들 사이에 트럭이 다닌다. 트럭은 개인 소유이나 인민위원회(Peoples Committees)의 교통국(Communications Bureaus)이 통제한다. 대부분 카바이드를 연료로 쓰고 나머지는 목탄을 쓴다.\n\n25X1X\n\n기밀/미국 관리 전용 통제(CONFIDENTIAL/CONTROL U.S. OFFICIALS ONLY)\n\n[공개 승인 2001/03/05 : CIA-RDP82-00457R000700050002-1]", "secondary": "REFERENCE CENTER [판독 불가]\n\nCONFIDENTIAL   33787 [원문 그대로]\nCONTROL U.S. OFFICIALS ONLY\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCOUNTRY   [판독 불가]\nSUBJECT   Economic Information: Transportation in North Korea\nDIST.  2h June 19247 [원문 그대로]\n25X1A     PAGES  2\n          SUPPLEMENT\n\n25X1X\n\n1. Passenger Train Schedules\n\nNote: The times for departures and arrivals given below are approximate and are based on observations made during one trip through North Korea.\n25X1A\n\nFrom                To                  Depart   Arrive   Remarks\nSinuiju             Pyongyang           0760     1600     Fare 113 won. Trip usually takes\n(Shingishu)         (Heijo)             [원문     [원문     12-13 hours, but may take up to\n(124-24, 40-06)     (125-44, 39-01)     그대로]    그대로]    two days. One train per day.\n                                                          Scheduled time: nine hours.\n\nPyongyang           Sinuiju             1106     2100     One train per day.\n                                        [원문 그대로]\n\nPyongyang           Wonsan (Genzan)     1500              One train per day.\n                    (127-26, 39-1C)\n                    [원문 그대로]\n\nWonsan              Hamhung (Kanko)     0[판독   1700*     Fare 129 won. One train per day\n                    (127232, 39-54)     불가]00            leaves Wonsan for the North.\n                    [원문 그대로]\n\nHamhung             Nanam (Ranan)       1500     2.100*   This is the train originating in\n                    (129-41, 41°42)              [원문     Wonsan and running North.\n                    [원문 그대로]                  그대로]\n\nChongjin (Seishin)  Pyongyang           1700
