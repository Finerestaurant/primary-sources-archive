S. OFFICIALS ONLY   25X1A\n\nCENTRAL INTELLIGENCE GROUP\nINTELLIGENCE REPORT\n\nThis document is hereby regraded to CONFIDENTIAL in accordance with the letter of 16 [판독 불가] 1978 from the Director of Central Intelligence to the Archivist of the United States.\n\nSUBJECT   Economic Information: Relief in North Korea\nNext Review Date: 2008\nDIST.  1[판독 불가] September 1947\nPAGES  1\nCOUNTRY   Korea\n25X1A\n\nRelief Goods Received from Soviets\n\n2. [원문 그대로] In May a small amount of flour and corn meal was received from the Soviet authorities and distributed as relief goods in North Korea. The flour and corn meal were given only to factory workers. [삭제]\n\n2. The people do not believe that the flour and corn meal came from the USSR but that they are part of the \"commodity\" tax collected last year by the Korean Consumers' Association and turned over to the Soviets.\n25X1A   Note: [삭제] Farmers in North Korea are required to [판독 불가] approximately 25% of their yearly production to the Consumers' Association). The people feel that, because of the acute food shortage in North Korea and because of the anti-Soviet feeling among a large part of the Korean population, the Soviets are now giving back to the people in North Korea some of the foodstuffs turned over to the Soviets last year.\n\n25X1A\n\n3. The distribution of the foodstuffs is being handled by the various People's Committees in North Korea.\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nDocument No. [판독 불가]\nNO CHANGE in Class. [판독 불가]\nREFERENCE C[판독 불가]\n\nCLASSIFICATION   CONFIDENTIAL   CONTROL: U. S. OFFICIALS ONLY\n\nApproved For Release 2[판독 불가] CONFIDENTIAL [판독 불가]82-00457R000900020007-7", "notes": ["[삭제·공개 표시] Approved For Release ... CIA-RDP82-00457R000900020007-7 (첫 면과 끝의 공개 승 우리 편에 있다」였다.", "소련군이 특무(대간첩)대를 통해 이런 선전을 그만두라고 명령했다.", "북조선 사람들은 소련이 이제 원자탄을 가지고 있다고 믿는다는 주가 붙어 있다."], "primary": "~ 930\n\n공개 승인(Approved For Release) [판독 불가] 기밀(CONFIDENTIAL) [판독 불가]82-00457R000900020008-6 [판독 불가]\n\n미국 관리 전용(U. S. OFFICIALS ONLY)   [판독 불가]\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n기밀(CONFIDENTIAL)   일자: 25X1A\n정보입수(INFO.)\n\n주제   정치 첩보: 북조선의 선전(Political Information: Propaganda in North Korea)   배포(DIST.) 1947년 9월 [판독 불가]일\n\n국가   조선(Korea)\n\n이 문서는 중앙정보국장이 미합중국 문서관리관에게 보낸 1978년 10월 16일자 서한에 따라 기밀(CONFIDENTIAL)로 등급이 조정되었다.\n25X1A\n보충(SUPPLEMENT)\n출처(ORIGIN):\n25X1X   다음 재검토 예정일: 2003년\n\n1. 북조선에서 조선인 당국이 선전부(Propaganda sections)를 조직하고 있다. 이 부서의 주된 목적은 북조선에서 반탁운동(anti-trusteeship movement)이 일어나는 것을 막는 데 있다.\n\n2. 최근 북조선 군사선전부(North Korean Military Propaganda Section)는 소련이 이제 원자탄 개발을 완료하였으며 1948년에 그 온전한 힘을 세계에 보일 수 있게 된다는 취지의 선전을 대량으로 내보냈다. 조선인 군사선전부가 퍼뜨린 구호 가운데 하나는 「승리는 이제 우리 편에 있다(Victory now belongs to our side)」였다. 그러나 소련군은 특무(대간첩)대(Special Service (counter-espionage) Corps)를 통해 조선인 군사선전부에 이런 종류의 선전을 더는 퍼뜨리지 말라고 명령하였다.\n25X1A   [삭제] 주(Note): [삭제] 북조선의 사람들은 소련이 이제 원자탄을 가지고 있다고 믿는다.)\n\n이 문서는 간첩법(Espionage Act, 50 U.S.C. 31 및 32, 개정판)이 정하는 바의 미합중국 국방에 관계된 정보를 담고 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방식으로든 누설하는 것은 법으로 금지된다.\n\n분류(CLASSIFICATION)   기밀(CONFIDENTIAL)   통제(CONTROL): 미국 관리 전용(U. S. OFFICIALS ONLY)\n\n공개 승인 20[판독 불가] 기밀(CONFIDENTIAL) [판독 불가]00457R000900020008-6", "secondary": "~ 930\n\nApproved For Release [판독 불가] CONFIDENTIAL [판독 불가]82-00457R000900020008-6 [판독 불가]\n\nU. S. OFFICIALS ONLY   [판독 불가]\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCONFIDENTIAL   DATE: 25X1A\nINFO.\n\nSUBJECT   Political Information: Propaganda in North Korea   DIST. [판독 불가] September 1947\n\nCOUNTRY   Korea\n\nThis document is hereby regraded to CONFIDENTIAL in accordance with the letter of 16 October 1978 from the Director of Central Intelligence to the Archivist of the United States.\n25X1A\nSUPPLEMENT\nORIGIN:\n25X1X   Next Review Date: 2003\n\n1. Propaganda sections are being organized by the Korean authorities in North Korea. The main purpose of the sections is to prevent an anti-trusteeship movement from developing in North Korea.\n\n2. Recently the North Korean Military Propaganda Section put out a large amount of propaganda to the effect that the USSR now has completed work on the atomic bomb and will be able to show the world its full strength in 1948. One of the slogans circulated by the Korean Military Propaganda Section was: \"Victory now belongs to our side.\" The Soviet Army, however, through its Special Service (counter-espionage) Corps, has ordered the Korean Military Propaganda Section to stop spreading any more of this type of propaganda.\n25X1A   [삭제] Note: [삭제] people in North Korea believe the Soviets now have the atomic bomb.)\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nCLASSIFICATION   CONFIDENTIAL   CONTROL: U. S. OFFICIALS ONLY\n\nApproved For Release 20[판독 불가] CONFIDENTIAL [판독 불가]00457R000900020008-6", "notes": ["[삭제·공개 표시] Approved For Release ... CIA-RDP82-00457R000900020008-6 (앞뒤 두 곳의 공개 승인 도장. CONFIDENTIAL 글자와 겹쳐 찍혀 일부가 판독되지 않는다)", "[삭제·공개 표시] 25X1A (세 곳), 25X1X (ORIGIN 줄 아래)", "[삭제·공개 표시] 2항 끝 Note 앞뒤의 출처 표시가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] ORIGIN 줄의 내용이 비어 있다", "[삭제·공개 표시] 1978년 10월 16일자 등급 조정 문구"], "note": "한 면짜리 짧은 보고다. 머리글의 주제 줄이 등급 조정 도장과 겹쳐 찍혀 거의 읽히지 않는다. 제목은 문서철 색인의 표제를 따랐다. 배포일은 T. ® September 1947 로 뭉개져 날짜를 읽을 수 없어 [판독 불가]로 두었다. 여백의 표시는 25X1A 와 25X1X 다. 첫 면 위쪽의 ~ 930 은 마이크로필름 정리 번호로 보이나 확정하지 않고 그대로 옮겼다. anti-trusteeship movement 는 반탁운동이다. Special Service (counter-espionage) Corps 는 소련군 특무기관을 가리키며 N30 과 N35 에도 같은 이름으로 나온다. 오늘의 이름으로 바꾸지 않았다. 이 문서에는 SOURCE 나 EVALUATION 줄이 인쇄되어 있지 않고 ORIGIN 줄만 있으며 그 자리는 비어 있다.", "warn": false, "search": "Approved For Release ... CIA-RDP82-00457R000900020008-6 (앞뒤 두 곳의 공개 승인 도장. CONFIDENTIAL 글자와 겹쳐 찍혀 일부가 판독되지 않는다) 25X1A (세 곳), 25X1X (ORIGIN 줄 아래) 2항 끝 Note 앞뒤의 출처 표시가 먹칠되어 [삭제]로 옮겼다 ORIGIN 줄의 내용이 비어 있다 1978년 10월 16일자 등급 조정 문구 Political Information: Propaganda in North Korea"}, {"id": "N33", "order": 57, "date": "1947-09-10", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "군사 첩보: 북조선에서의 소련군 및 공산군 부대 기동", "badge": "confidential (CONTROL: U. S. OFFICIALS ONLY)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-09-10"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Soviet [and] Communist Troop Maneuvers in North Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000900070010-8"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000900070010-8"}], "summary": "5월과 6월에 개천과 북청 일대에서 벌어진 소련군 포격 훈련과 조선인 부대 기동을 적었다. 참가 부대는 보안대 장교학교에서 1년 넘게 훈련받은 자들이다.", "points": ["5월에 개천(125-58, 39-40)에서 소련군 포격 훈련이 있었다. 소련군 약 1[판독 불가]00명과 여러 구경의 화포가 동원되었다.", "책임 장교는 Koinokopii 대령이다. 사리원 포병부대 지휘관 출신이고 최근 대령으로 진급했다. 이름은 조선말에서 옮긴 음역이라고 원문이 밝혔다.", "6월에는 북청 일대에서 포격 훈련 준비가 있었다. 병력과 화포 수를 적은 문단은 판독되지 않는다.", "조선인 부대 기동에 참가한 병력은 모두 보안대 장교학교에서 1년 넘게 훈련받은 자들이다. 보안대 부대와 철도경비대에서 온 참모장교가 소수 붙었다.", "대학과 중학교 학생 동원이 요청되었으나 학무국의 반대로 무산된다.", "분대는 30명이고 조선인 장교 한 명이 붙는다. 일본식 소총으로 사격 훈련을 하고 일부 분대는 독일제 기관총을 갖추었다.", "나남 보안대 총사령부 포병부대 400명이 북청에서 기동했다. 일본식 야포 18문이 있었으나 탄약이 없어 쏘지 못했다.", "북청 기동에 소련군 소장 한 명이 참석했다."], "primary": "[판독 불가]\n\n공개 승인(Approved For Release) 200[판독 불가] 기밀(CONFIDENTIAL) [판독 불가]82-00457R000900070010[판독 불가]\n\n미국 관리 전용(U. S. OFFICIALS ONLY)   08183\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가   조선(Korea)            일자:\n\n주제   군사 첩보: 북조선에서의 소련군 및 공산군 부대 기동(Military Information: Soviet [and] Communist Troop [Maneuvers in North Korea])\n[판독 불가]   면수 [판독 불가]\n\n다음 재검토 예정일: 2008년   기밀(CONFIDENTIAL)   보충(SUPPLEMENT)\n\n25X1X\n\n개천(Kaech'on 价川, 일본식 Keisen)에서의 소련군 포격 훈련.\n\n1. 5월 [판독 불가]일부터 5월 [판독 불가]일까지 북조선 주둔 소련군이 개천(Kaech'on, Keisen) (125-58, 39-40)에서 포격 훈련을 하였다. 소련군 약 1[판독 불가]00명이 참가하였고 여러 구경의 화포 4[판독 불가]문이 쓰였다. 이 기동의 책임 장교는 Koinokopii 대령([한자 판독 불가])이었다 (러시아인 이름을 조선말에서 옮긴 음역이다.) Koinokopii 는 전에 사리원(Sariwon 沙里院, 일본식 Shariin) ([판독 불가], 28-30) [원문 그대로]의 포병부대 지휘관이었다. 그는 최근 대령으로 진급하였다.\n\n북청(Pukch'ong 北靑, 일본식 Hokusei)에서의 소련군 포격 훈련 준비.\n\n2. 6월 중에 [판독 불가]ng([판독 불가]) (1[판독 불가]-18, [판독 불가]0-14) 일대에서 포격 훈련을 열기 위한 준비가 이루어졌다. ([판독 불가] 주: [판독 불가]항을 보라.)\n\n3. [판독 불가 — 문장 전체가 뭉개졌다. 병력 수 두 개와 화포 수가 적혀 있고 이 지역에 집결하였다는 내용으로 보이나 숫자를 읽을 수 없다.]\n\n조선인 공산군 부대 기동(Korean Communist Troop Maneuvers)   25X1A\n\n4. 이 기동에는 조선인 부대 [판독 불가]명이 넘게 참가하였다. 이 부대들은 모두 보안대 장교학교(Peace Preservation Corps Officers Schools)에서 1년 넘게 훈련을 받은 자들이었다.\n\n5. 기동에 참가한 부대는 그 학교들에 상시 주둔하는 병력에, 여러 보안대 부대(Pe An Tea--He An Dai 보안대 [한자 판독 불가])에서 온 참모장교 소수와 철도경비대(Railway Constabulary)([판독 불가]--Teis[판독 불가] Keibitai [한자 판독 불가])에서 온 참모장교 소수를 더한 것으로 보였다.\n\n[판독 불가]\n\n공개 승인 200[판독 불가]\n\n공개 승인 200[판독 불가] 기밀(CONFIDENTIAL) [판독 불가]82-00457R00090007[판독 불가]\n\n기밀(CONFIDENTIAL)\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n6. 북조선의 대학과 중학교 학생들에게도 이 군사 기동에 참가하라는 요청이 있었으나, 학무국(Education Bureau, H[판독 불가]ngmu [판독 불가]uk--Gakumu Kyoku [한자 판독 불가])의 반대로 참가하지 않았다.\n\n7. 부대는 분대로 나뉘었고 한 분대는 30명이었다. 각 분대에 (조선인) 장교 한 명이 배속되었다.\n\n8. 분대 대부분은 보병 훈련을 하였다. 사격 훈련이 있었고 일본식 H-38형 [원문 그대로] 소총이 쓰였다. 많은 분대가 기관총을 갖추었는데 그 가운데 일부는 독일제였다.\n\n9. 나남(Nanam 羅南, 일본식 Ranan) (129-41, 41-42)의 보안대 총사령부에 딸린 포병부대에서 병사 400명이 북청(Pukch'ong, Hokusei) 부근에서 포병 기동에 참가하였다. 이 부대는 일본식 야포 18문을 가지고 있었으나 탄약이 부족하여 쏘지는 않았다. 북청 기동의 책임 장교는 [삭제] 장군으로, [판독 불가] 총사령부의 부사령관이었다.\n\n10. 소련군 소장 한 명이 북청의 기동에 참석하였다.   25X1A\n\n이 문서는 간첩법(Espionage Act, 50 U.S.C. 31 및 32, 개정판)이 정하는 바의 미합중국 국방에 관계된 정보를 담고 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방식으로든 누설하는 것은 법으로 금지된다.\n\n기밀(CONFIDENTIAL)   통제(CONTROL): 미국 관리 전용(U. S. OFFICIALS ONLY)\n\n참고자료실 도서관(REFERENCE CENTER LIBRARY)\n\n공개 승인 [판독 불가] 기밀(CONFIDENTIAL) [판독 불가]", "secondary": "[판독 불가]\n\nApproved For Release 200[판독 불가] CONFIDENTIAL [판독 불가]82-00457R000900070010[판독 불가]\n\nU. S. OFFICIALS ONLY   08183\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCOUNTRY   Korea            DATE:\n\nSUBJECT   Military Information: Soviet [and] Communist Troop [Maneuvers in North Korea]\n[판독 불가]   PAGES [판독 불가]\n\nNext Review Date: 2008   CONFIDENTIAL   SUPPLEMENT\n\n25X1X\n\nSoviet Artillery Practice at Kaech'on (Keisen).\n\n1. Between [판독 불가] May and [판독 불가] May the Soviet Army in North Korea engaged in artillery practice at Kaech'on (Keisen) (125-58, 39-40). Approximately 1[판독 불가]00 Soviet troops participated and 4[판독 불가] artillery pieces of various sizes were used. The officer in charge of these maneuvers was Colonel Koinokopii ([한자 판독 불가]) (transliteration of the Russian name from the Korean.) Koinokopii was formerly the commander of an artillery unit in Sariwon (Shariin) ([판독 불가], 28-30) [원문 그대로]. He was recently promoted to Colonel.\n\nPreparation for Soviet Artillery Practice at Pukch'ong (Hokusei).\n\n2. During June, preparations for holding artillery practice were made in the [판독 불가]ng ([판독 불가]) (1[판독 불가]-18, [판독 불가]0-14) area. ([판독 불가] Note: See paragraph [판독 불가].)\n\n3. [판독 불가 — 문장 전체가 뭉개졌다. 병력 수 두 개와 화포 수가 적혀 있고 이 지역에 집결하였다는 내용으로 보이나 숫자를 읽을 수 없다.]\n\nKorean Communist Troop Maneuvers   25X1A\n\n4. More than [판독 불가] Korean troops participated in these maneuvers. All of these troops had had over one year's training in the Peace Preservation Corps Officers Schools.\n\n5. The troops participating in the maneuvers appeared to be those regularly stationed at the schools plus a small number of staff officers from the various Peace Preservation Corps troops (Pe An Tea--He An Dai [한자 판독 불가]) and a small number of staff officers from the Railway Constabulary ([판독 불가]--Teis[판독 불가] Keibitai [한자 판독 불가]).\n\n[판독 불가]\n\nApproved For Release 200[판독 불가]\n\nApproved For Release 200[판독 불가] CONFIDENTIAL [판독 불가]82-00457R00090007[판독 불가]\n\nCONFIDENTIAL\nCENTRAL INTELLIGENCE GROUP\n\n6. Students of universities and middle schools in North Korea were requested to take part in the military maneuvers but, because of the objections of the Education Bureau (H[판독 불가]ngmu [판독 불가]uk--Gakumu Kyoku [한자 판독 불가]), they did not participate.\n\n7. The troops were divided into sections, with 30 men in each section. One (Korean) officer was assigned to each section.\n\n8. Most of the sections engaged in infantry exercises. Target practice was held and rifles of the Japanese H-38 type [원문 그대로] were used. Many of the sections were equipped with machine guns, some of which were of German make.\n\n9. Four hundred soldiers from an artillery unit attached to the General Headquarters of the Peace Preservation Corps in Nanam (Ranan) (129-41, 41-42) engaged in artillery maneuvers near Pukch'ong (Hokusei). The troops had 18 field artillery pieces of Japanese design which, however, were not fired because of a shortage of ammunition. The officer in charge of the maneuvers at Pukch'ong was General [삭제], Vice-Commander of the General Headquarters of the [판독 불가].\n\n10. A Soviet major-general attended the maneuvers at Pukch'ong.   25X1A\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nCONFIDENTIAL   CONTROL: U. S. OFFICIALS ONLY\n\nREFERENCE CENTER LIBRARY\n\nApproved For Release [판독 불가] CONFIDENTIAL [판독 불가]", "notes": ["[삭제·공개 표시] Approved For Release ... CIA-RDP82-00457R000900070010-8 (여러 면의 공개 승인 도장. CONFIDENTIAL 글자와 겹쳐 찍혀 문서번호 끝자리가 판독되지 않는다)", "[삭제·공개 표시] 25X1X (첫 면 여백), 25X1A (두 곳)", "[삭제·공개 표시] 9항에서 북청 기동 책임 장군의 이름과 소속이 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] REFERENCE CENTER LIBRARY (참고자료실 도서관 도장)"], "note": "첫 면의 스캔 상태가 이 여섯 건 가운데 가장 나쁘다. 1항부터 5항까지는 글자가 절반쯤 뭉개져 있어 문장 뼈대만 살아 있다. 3항은 문장 전체를 읽을 수 없어 그대로 판독 불가로 두었다. 병력 수와 화포 수가 적혀 있으나 숫자를 짐작해 넣지 않았다. 좌표는 고치지 않았다. 사리원의 ([판독 불가], 28-30)은 경도가 통째로 깨졌고 위도 28-30 은 사리원의 실제 위치와 맞지 않으나 그대로 두었다. 2항의 (1[판독 불가]-18, [판독 불가]0-14)도 두 자리가 깨져 있다. 개천의 (125-58, 39-40)과 나남의 (129-41, 41-42)는 N30 에 나오는 같은 좌표와 일치한다. 1항의 훈련 날짜는 <l ley ana <0 ey 로 찍혀 두 날짜 모두 앞자리를 읽을 수 없다. 참가 소련군 수 1<00 과 화포 수 4U 도 한 자리씩 깨져 있어 판독 불가로 두었다. 8항의 소총 H-38 type 은 일본 三八式으로 보이나 숫자를 고치지 않았다. N30 은 같은 소총을 1-33 type 으로 적는다. Peace Preservation Corps 는 보안대, Railway Constabulary 는 철도경비대, Education Bureau 는 학무국이다. 오늘의 이름으로 바꾸지 않고 원문 로마자를 앞세웠다. 보안대의 조선말과 일본말 음이 Pe An Tea--He An Dai 로 나란히 적혀 있어 그대로 옮겼다. 철도경비대의 같은 자리는 뭉개져 Teis 와 Keibitai 만 남았다. 한자는 모두 뭉개져 한 글자도 확정하지 않았다. 지명은 조선 이름과 일본식 이름을 둘 다 살렸다. 이 문서에는 SOURCE 나 EVALUATION 줄이 인쇄되어 있지 않다.", "warn": true, "search": "Colonel Koinokopii (소련군 대령. 개천 포격 훈련 책임 장교. 러시아인 이름을 조선말에서 옮긴 음역이라고 원문이 밝혔다) General [삭제] (북청 기동 책임 장군. 보안대 총사령부 부사령관으로 적혀 있으나 이름이 먹칠되었다) Approved For Release ... CIA-RDP82-00457R000900070010-8 (여러 면의 공개 승인 도장. CONFIDENTIAL 글자와 겹쳐 찍혀 문서번호 끝자리가 판독되지 않는다) 25X1X (첫 면 여백), 25X1A (두 곳) 9항에서 북청 기동 책임 장군의 이름과 소속이 먹칠되어 [삭제]로 옮겼다 REFERENCE CENTER LIBRARY (참고자료실 도서관 도장) Military Information: Soviet [and] Communist Troop Maneuvers in North Korea"}, {"id": "N34", "order": 58, "date": "1947-09-10", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "경제 첩보: 북조선과 다롄 사이의 해운", "badge": "confidential (CONTROL: U. S. OFFICIALS ONLY)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-09-10"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Economic Information: Shipping between North Korea and Dairen", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000900090003-4"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000900090003-4"}], "summary": "북조선과 다롄을 주 1회 오가는 배 세 갈래를 적었다. 탄약과 담배가 오가고, 쇄빙선 한 척이 북조선 해안경비대와 다롄의 중국공산당 사이를 잇는다.", "points": ["작은 기선들이 다롄과 T[판독 불가]dae-do (124-26, 39-48) 사이를 주 1회 오간다. 조선 쪽에서 다롄으로 탄약이, 다롄에서 조선으로 담배와 식용유가 간다.", "800톤 쇄빙선 Chinnam [판독 불가]wan 은 전에 일본 것이었고 지금은 북조선 해안경비대가 다롄과 진남포 사이에 쓴다.", "이 항해의 목적은 북조선 해안경비대와 다롄의 중국공산당 사이의 연락 유지다.", "배의 속력은 13노트, 승조원은 [판독 불가]8명이다. 조선인 경비대원 13명과 소련인 6명이 동승한다.", "5월 24일 소련 군함이 다롄에서 진남포에 들어왔다. 장교 10명과 사병 60명이 탔고 종이 15톤을 싣고 왔다. 북조선에 종이가 몹시 모자란다."], "primary": "INTELLOFAX 1   공개 승인(Approved For Release) 2[판독 불가] 기밀(CONFIDENTIAL) [판독 불가]82-00457R000[판독 불가]\n\n1.\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)   25X1A\n첩보보고(INTELLIGENCE REPORT)   기밀(CONFIDENTIAL)\n\n이 문서는 [판독 불가]가 미합중국 문서관리관에게 보낸 1[판독 불가]78년 10월 16일자 서한에 따라 기밀(CONFIDENTIAL)로 등급이 조정되었다.   25X1C\n배포(DIST.) 1947년 9월 [판독 불가]일\n\n국가   조선 - 중국(Korea - China)\n\n주제   경제 첩보: 북조선과 다롄 사이의 해운(Economic Information: Shipping between North Korea and Dairen)\n\n25X1C\n\n[판독 불가]\n다음 재검토 예정일: 2[판독 불가]   면수 [판독 불가]\n\n보충(SUPPLEMENT)\n\n2. [원문 그대로] 작은 기선들이 다롄(Dairen 大連) (122-39, 33-86) [원문 그대로]과 T[판독 불가]dae-do([판독 불가]) (124-26, 39-48) 사이를 주 1회 오간다. T[판독 불가]dae-do 에서 다롄으로는 탄약이, 다롄에서 T[판독 불가]dae-do 로는 담배와 식용유가 이 배들에 실려 가고 있다.\n\n2. Chinnam [판독 불가]wan (일본식 Chin[판독 불가]n Maru [한자 판독 불가])은 전에 일본 [판독 불가] 소속이던 800톤짜리 쇄빙선인데, 지금은 북조선 해안경비대(North Korean Coast Guard)가 다롄과 진남포(Chinnampo 鎭南浦) (125-21, 38-44) 사이를 주 1회 오가는 데 쓰고 있다. 이 항해의 목적은 북조선 해안경비대와 다롄의 중국공산당 사이의 연락을 유지하는 데 있다. 이 배는 속력이 13노트이고 승조원은 [판독 불가]8명이다. 조선인 해안경비대원 13명과 소련인 6명(? 승조원 외에 ?)이 항해에 동승한다.\n\n3. 5월 24일 소련 군함 한 척이 다롄에서 진남포항에 들어왔다. 소련군 장교 10명과 사병 60명이 타고 있었다. 이 배는 다롄에서 종이 15톤도 실어 왔다. 지금 북조선에는 종이가 몹시 모자란다.\n25X1A\n\n이 문서는 간첩법(Espionage Act, 50 U.S.C. 31 및 32, 개정판)이 정하는 바의 미합중국 국방에 관계된 정보를 담고 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방식으로든 누설하는 것은 법으로 금지된다.\n\n분류(CLASSIFICATION)   기밀(CONFIDENTIAL)   통제(CONTROL): 미국 관리 전용(U. S. OFFICIALS ONLY)\n\n참고자료실 도서관(REFERENCE CENTER LIBRARY)\n\n공개 승인 [판독 불가] 기밀(CONFIDENTIAL) [판독 불가]00457R000900090003-4", "secondary": "INTELLOFAX 1   Approved For Release 2[판독 불가] CONFIDENTIAL [판독 불가]82-00457R000[판독 불가]\n\n1.\n\nCENTRAL INTELLIGENCE GROUP   25X1A\nINTELLIGENCE REPORT   CONFIDENTIAL\n\nThis document is hereby regraded to CONFIDENTIAL in accordance with the letter of 16 October 1[판독 불가]78 from the [판독 불가]   25X1C\n[판독 불가] Central Intelligence to the Archivist of the United States\nDIST. [판독 불가] September 1947\n\nCOUNTRY   Korea - China\n\nSUBJECT   Economic Information: Shipping between North Korea and Dairen\n\n25X1C\n\n[판독 불가]\nNext Review Date: 2[판독 불가]   PAGES [판독 불가]\n\nSUPPLEMENT\n\n2. [원문 그대로] Small steam boats ply weekly between Dairen (122-39, 33-86) [원문 그대로] and T[판독 불가]dae-do ([판독 불가]) (124-26, 39-48). Ammunition is being sent on these boats to Dairen from T[판독 불가]dae-do and tobacco and cooking oil to T[판독 불가]dae-do from Dairen.\n\n2. The Chinnam [판독 불가]wan (Chin[판독 불가]n Maru [한자 판독 불가]), an 800 ton ice-breaker which formerly belonged to the Japanese [판독 불가], is now being used by the North Korean Coast Guard to sail once a week between Dairen and Chinnampo (125-21, 38-44). The purpose of these trips is to maintain liaison between the North Korean Coast Guard and the Chinese Communists in Dairen. The ship has a speed of 13 knots and a crew of [판독 불가]8 men. Thirteen members of the Korean Coast Guard and six Soviets (? in addition to the crew ?) go along on the trips.\n\n3. On 24 May a Soviet war ship arrived in Chinnampo Harbor from Dairen. Ten Soviet officers and 60 enlisted men were on board. The ship also brought 15 tons of paper from Dairen. There is an acute shortage of paper in North Korea at the present time.\n25X1A\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nCLASSIFICATION   CONFIDENTIAL   CONTROL: U. S. OFFICIALS ONLY\n\nREFERENCE CENTER LIBRARY\n\nApproved For Release [판독 불가] CONFIDENTIAL [판독 불가]00457R000900090003-4", "notes": ["[삭제·공개 표시] Approved For Release ... CIA-RDP82-00457R000900090003-4 (앞뒤 두 곳의 공개 승인 도장. CONFIDENTIAL 글자와 겹쳐 찍혀 문서번호 일부가 판독되지 않는다)", "[삭제·공개 표시] 25X1A (두 곳), 25X1C (두 곳)", "[삭제·공개 표시] 머리글의 출처 줄이 뭉개져 [판독 불가]로 옮겼다", "[삭제·공개 표시] REFERENCE CENTER LIBRARY (참고자료실 도서관 도장)", "[삭제·공개 표시] 1978년 10월 16일자 등급 조정 문구"], "note": "한 면짜리 보고이고 본문은 비교적 읽히나 고유명사가 심하게 뭉개졌다. 문단 번호가 2, 2, 3 으로 찍혀 있다. 앞의 것이 1이었을 것으로 보이나 번호를 고치지 않고 [원문 그대로]로 남겼다. 좌표는 고치지 않았다. 다롄의 (122-39, 33-86)은 위도의 분이 86 이어서 성립하지 않는 값이다. 그대로 두었다. 진남포의 (125-21, 38-44)와 (124-26, 39-48)은 온전하다. 조선 쪽 섬 이름은 Tesdaea-do 로, 일본식 이름은 faehito 로 찍혀 있어 어느 쪽도 확정되지 않는다. 대동만 일대의 섬으로 보이나 짓지 않고 판독 불가로 두었다. 배 이름은 Chinnam Zwan (Chinasn Mare) 로 찍혀 있다. 丸 을 조선음으로 읽은 것과 일본음 마루를 나란히 적은 형태로 보이나 앞 글자를 확정할 수 없어 그대로 두었고 한자도 짓지 않았다. 전 소속은 Japanese Sray 로 찍혀 육군인지 해군인지 가릴 수 없다. 승조원 수 [8 mea 도 앞자리가 깨졌다. 13노트, 13명, 6명, 10명, 60명, 15톤, 800톤은 원문 그대로다. North Korean Coast Guard 는 북조선 해안경비대로 옮기고 원문 표기를 앞세웠다. 이 문서에는 SOURCE 나 EVALUATION 줄이 인쇄되어 있지 않다.", "warn": false, "search": "Approved For Release ... CIA-RDP82-00457R000900090003-4 (앞뒤 두 곳의 공개 승인 도장. CONFIDENTIAL 글자와 겹쳐 찍혀 문서번호 일부가 판독되지 않는다) 25X1A (두 곳), 25X1C (두 곳) 머리글의 출처 줄이 뭉개져 [판독 불가]로 옮겼다 REFERENCE CENTER LIBRARY (참고자료실 도서관 도장) 1978년 10월 16일자 등급 조정 문구 Economic Information: Shipping between North Korea and Dairen"}, {"id": "N35", "order": 59, "date": "1947-09-11", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "정치 첩보: 붙잡힌 남조선 공작원에 대한 소련의 처리", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-09-11"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Political Information: Soviet Handling of Captured South Korean Agents", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000900150010-9"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000900150010-9"}], "summary": "북조선에서 붙잡힌 남조선 공작원 약 1000명이 소련군 특무기관을 거쳐 원산의 기술 양성소로, 다시 소련으로 보내진다는 보고다.", "points": ["1916년 [원문 그대로] 초부터 1947년 6월까지 북조선에서 남조선 공작원 약 1000명이 붙잡혔다.", "북조선 기관들은 이들을 남조선 우익 단체를 위해 지하공작을 하러 온 반동으로 규정했다.", "붙잡힌 자들은 감옥에서 심한 학대를 받았고 가족 면회가 금지되었다. 음식 반입만 허용되었다.", "2월부터 음식 반입도 막혔다. 가족들은 수감자들이 다른 곳으로 옮겨진 것으로 믿는다.", "평양의 소련군 특무기관에서 서너 달 「정신 훈련」을 받은 뒤 원산의 산업 기술자 양성소로 보내진다. 그곳 처우는 감옥과 달리 꽤 괜찮다.", "기술 훈련을 마치면 소련으로 보내진다. 10명씩 두 조가 이미 갔다.", "배포처에 국무부, 육군부, 해군부, 법무부가 표시되어 있다."], "primary": "기밀(CONFIDENTIAL)   [판독 불가]\n\n국가   조선(Korea)            일자:\n정보입수(INFO.)   25X1\n\n주제   정치 첩보: 붙잡힌 남조선 공작원에 대한 소련의 처리(Political Information: Soviet Handling of Captured South Korean Agents)\n배포(DIST.) 1947년 9월 [판독 불가]일\n[판독 불가] 19[판독 불가]년 10월 16일\n미합중국 문서관리관(Archivist of the United States)\n보충(SUPPLEMENT)\n출처(ORIGIN) [ 25X1 ]   다음 재검토 예정일: [판독 불가]   25X1\n\n배포처(DISTRIBUTION)\nX | X | X | X |\n국무부(STATE) | 육군부(WAR) | 해군부(NAVY) | 법무부(JUSTICE) | R & E\n\n1. 1916년 [원문 그대로] 초부터 1947년 6월까지 북조선에서 남조선 공작원 약 1000명이 붙잡혔다.\n\n[삭제]\n\n2. 북조선의 정부 기관들은 이 공작원 대부분을 남조선 우익 단체를 위해 지하공작을 하러 남조선에서 온 반동으로 규정하였다.\n\n3. 붙잡힌 뒤 이 공작원들은 북조선의 감옥에 갇혔다. 이들은 심한 학대를 받았고 가족을 만나는 것이 허락되지 않았다. 다만 가족이 음식을 넣어 주는 것은 허용되었다.\n\n4. [판독 불가] 평양(Pyongyang 平壤, 일본식 Heijo) (125[판독 불가]44, 39-01)의 소련군 특무(대간첩)기관(Soviet Army Special Service (Counter-Espionage) Headquarters)으로 [보내졌다]. 수감자 가족들은 또 2월에 이제부터는 수감자에게 음식을 넣을 수 없다는 말을 들었다고 진술한다. 그래서 가족들은 수감자들이 갇혀 있던 감옥에서 빼내어져 다른 곳으로 보내진 것이라고 믿는다.\n\n5. 평양의 소련군 특무기관에서 수감자들은 서너 달 동안 「정신 훈련(mental training)」(? 공산주의 사상 주입)을 받는다. 그 뒤 원산(Wonsan 元山, 일본식 Genzan) (127-26, 39-10)의 산업 기술자 양성소로 보내진다. 이 양성소는 원산의 소련군이 관할한다. 여기서 수감자들은 기술 훈련을 받는다. 양성소에서는 하루 세 끼가 나오고 대체로 수감자들에 대한 처우는 꽤 괜찮은 편이다.\n\n6. 기술 훈련을 마친 뒤 수감자들은 소련으로 보내지고 있다. 한 조에 10명씩 두 조가 이미 이 양성소에서 소련으로 보내졌다.\n\n이 문서는 간첩법(Espionage Act, 50 U.S.C. 31 및 32, 개정판)이 정하는 바의 미합중국 국방에 관계된 정보를 담고 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방식으로든 누설하는 것은 법으로 금지된다.\n\n문서번호(Document No.) [판독 불가]   기밀(CONFIDENTIAL)\n등급 변경 없음(NO CHA[판독 불가])\n등급(Class.) [판독 불가]\n참고자료실 도서관(REFERENCE CENTER LIBRARY)\n\n승인(Auth): [판독 불가] 77/1763\n일자(Date): 1978년 5월 2[판독 불가]일\n\n공개 승인 [판독 불가] 기밀(CONFIDENTIAL) [판독 불가]00457R000900150010-9", "secondary": "CONFIDENTIAL   [판독 불가]\n\nCOUNTRY   Korea            DATE:\nINFO.   25X1\n\nSUBJECT   Political Information: Soviet Handling of Captured South Korean Agents\nDIST. [판독 불가] September 1947\n[판독 불가] 16 October 19[판독 불가]\nArchivist of the United States\nSUPPLEMENT\nORIGIN [ 25X1 ]   Next Review Date: [판독 불가]   25X1\n\nDISTRIBUTION\nX | X | X | X |\nSTATE | WAR | NAVY | JUSTICE | R & E\n\n1. Approximately 1000 South Korean agents were captured in North Korea from the beginning of 1916 [원문 그대로] until June 1947.\n\n[삭제]\n\n2. The North Korean governmental organizations have described most of these agents as reactionaries who have come from South Korea to do underground work for the South Korean Rightist organizations.\n\n3. When apprehended, these agents were imprisoned in North Korean jails. They were severely mistreated and were not permitted to see members of their families. Their families, however, were allowed to send them food.\n\n4. [판독 불가] to the Soviet Army Special Service (Counter-Espionage) Headquarters in Pyongyang (Heijo) (125[판독 불가]44, 39-01). Members of the families of the prisoners also state that in February they were told that they would no longer be allowed to send food to the prisoners. They therefore believe that the prisoners were removed from the prisons in which they had been confined and sent elsewhere.\n\n5. At the Soviet Army Special Service Headquarters in Pyongyang the prisoners receive three to four months of \"mental training\" (? Communist indoctrination). They are then sent to Wonsan (Genzan) (127-26, 39-10) to a training camp for industrial technicians. This camp is controlled by the Soviet Army in Wonsan. Here the prisoners receive technical training. Three meals a day are served at the camp and, in general, the prisoners are fairly well treated.\n\n6. After completing their technical training, the prisoners are being sent to the USSR. Two groups, with 10 persons in each group, have already been sent to the USSR from this training camp.\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nDocument No. [판독 불가]   CONFIDENTIAL\nNO CHA[판독 불가]\nClass. [판독 불가]\nREFERENCE CENTER LIBRARY\n\nAuth: [판독 불가] 77/1763\nDate: 2[판독 불가] MAY 1978\n\nApproved For Release [판독 불가] CONFIDENTIAL [판독 불가]00457R000900150010-9", "notes": ["[삭제·공개 표시] Approved For Release ... CIA-RDP82-00457R000900150010-9 (끝의 공개 승인 도장. CONFIDENTIAL 글자와 겹쳐 찍혀 문서번호 앞부분이 판독되지 않는다)", "[삭제·공개 표시] 25X1 (INFO. 줄, ORIGIN 줄, 재검토 예정일 옆)", "[삭제·공개 표시] 1항과 2항 사이의 대목이 통째로 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] 4항 첫머리가 먹칠 및 뭉갬으로 문장 앞부분이 사라졌다", "[삭제·공개 표시] Document No. / NO CHANGE in Class. / Class. (등급 도장)", "[삭제·공개 표시] REFERENCE CENTER LIBRARY (참고자료실 도서관 도장)", "[삭제·공개 표시] Auth: [판독 불가] 77/1763, Date: 2[판독 불가] MAY 1978 (비밀해제 승인 도장)"], "note": "머리글이 등급 조정 도장과 겹쳐 찍혀 절반쯤만 읽힌다. 본문 여섯 문단은 비교적 잘 읽힌다. 1항의 시작 연도는 1916 으로 찍혀 있다. 1946년으로 보이나 날짜의 숫자는 고치지 않고 [원문 그대로]로 남겼다. 붙잡힌 수 약 1000명과 10명씩 두 조도 원문 그대로다. 1항과 2항 사이에 먹칠된 대목이 있고 4항의 첫머리가 그 먹칠에 이어져 있다. 4항은 술어가 사라져 문장이 완결되지 않는다. 앞 문장의 뜻을 이어 [보내졌다]로 보충하고 대괄호로 표시했다. 평양 좌표는 12544, 39-01 로 붙여 찍혀 도와 분 사이의 구분이 판독되지 않는다. N30 은 같은 평양을 /125-44, 35-01/ 로 적는다. 원산의 (127-26, 39-10)은 온전하다. Special Service (Counter-Espionage) Headquarters 는 소련군 특무기관이며 N30 과 N32 에도 같은 이름으로 나온다. 오늘의 이름으로 바꾸지 않았다. mental training 은 원문이 스스로 물음표를 달아 공산주의 사상 주입이 아닌가 하고 되묻는 대목이라 그 물음표까지 그대로 옮겼다. 지명은 조선 이름과 일본식 이름을 둘 다 살렸다. 이 문서에는 SOURCE 나 EVALUATION 줄이 인쇄되어 있지 않고 ORIGIN 줄만 있으며 그 자리는 25X1 로 가려져 있다.", "warn": false, "search": "Approved For Release ... CIA-RDP82-00457R000900150010-9 (끝의 공개 승인 도장. CONFIDENTIAL 글자와 겹쳐 찍혀 문서번호 앞부분이 판독되지 않는다) 25X1 (INFO. 줄, ORIGIN 줄, 재검토 예정일 옆) 1항과 2항 사이의 대목이 통째로 먹칠되어 [삭제]로 옮겼다 4항 첫머리가 먹칠 및 뭉갬으로 문장 앞부분이 사라졌다 Document No. / NO CHANGE in Class. / Class. (등급 도장) REFERENCE CENTER LIBRARY (참고자료실 도서관 도장) Auth: [판독 불가] 77/1763, Date: 2[판독 불가] MAY 1978 (비밀해제 승인 도장) Political Information: Soviet Handling of Captured South Korean Agents"}, {"id": "N36", "order": 60, "date": "1947-09-16", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "조선에 관한 국가정보요구의 승인", "badge": null, "list_right": "각서", "meta": [{"k": "일자", "v": "1947-09-16"}, {"k": "발신", "v": "THOS. B. INGLIS, Rear Admiral, USNavy, Chief of Naval Intelligence 토머스 B. 잉글리스 해군소장, 해군정보국장", "txt": true}, {"k": "수신", "v": "The Secretary, National Intelligence Authority 국가정보기구(NIA) 간사", "txt": true}, {"k": "종류", "v": "각서"}, {"k": "원제", "v": "Approval of National Intelligence Requirements for Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp80r01731r003600060005-6"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp80r01731r003600060005-6"}], "summary": "해군정보국장이 조선에 관한 국가정보요구 문서를 소폭 수정 조건으로 승인하고, 북조선 항만과 해안경비대, 항공 관련 항목을 늘리라고 붙임에 적어 보낸다.", "points": ["해군정보국장 잉글리스 소장이 문서를 「아래 적은 소폭 수정을 조건으로 승인」한다고 표시한다. 부결이나 정보자문위원회(I.A.B.) 회부는 고르지 않았다.", "북조선의 군사 잠재력 항목을 늘리라고 요구한다. 항만, 상륙 가능 해안, 내륙 진입로를 JANIS 75호에 실린 것에 더해 최신 자료로 보강하라는 것이다.", "해안경비대와 해관 등 북조선에서 해군으로 곧바로 전용할 수 있는 부대의 편성, 훈련, 장비를 요구한다. 선박 수리와 건조 시설, 군용과 민간 양쪽의 항공 사항도 넣으라고 한다.", "제2절 남조선 항목에는 노동조합 같은 대중 단체와 외국 단체의 관계를 넣으라고 한다. 조선 노동 단체와 공산 계열 세계노련(WFTU)의 관계를 예로 든다.", "미국이 조선을 무엇으로 알고 싶어 했는지를 요구 목록의 형태로 보여 주는 문서다. 현장 보고가 아니라 요구서에 대한 결재다."], "primary": "5166\n\n공개 승인(Approved For Release) [판독 불가]\n\n사본(COPY)\n\n「사본(COPY)」\n\n국가정보기구(NATIONAL INTELLIGENCE AUTHORITY) 간사 앞 각서:\n\n주제: 조선에 관한 국가정보요구(National Intelligence Requirements for Korea)의 승인\n\n1. 표제 문서에 대하여:\n\na. 수정 없이 승인\n\nb. 아래에 적은 소폭 수정을 조건으로 승인\n\nc. 부결. 정보자문위원회(I.A.B.)를 열어 문서를 심의할 것을 요청\n\nd. 기초 기관으로 반송 (표시됨) TBI\n\n[판독 불가]\n\n26 [원문 그대로] 제안 또는 수정 사항:\n\n(붙임 종이 참조)\n\n해군(NAVY) 검토 완료.\n\n(서명) THOS. B. INGLIS 토머스 B. 잉글리스\n서명란\n해군소장(Rear Admiral, USNavy)\n해군정보국장(Chief of Naval Intelligence)\n\n반송처: 7123호실\n노스인테리어빌딩(North Interior Building)        16 Sep 19,7 [원문 그대로]\n[판독 불가]\n\n[판독 불가]\n공개 승인 2003/10/07 : [판독 불가]\n\n사본(COPY) [판독 불가]\n공개 승인 2003/10/07 : [판독 불가]\n\n「사본(COPY)」\n\n9731\n\n주제: 조선에 관한 국가정보요구의 승인.\n\n제안:\n\n기초 기관은 다음의 의견에 비추어 이 문서를 재검토할 것을 권고한다:\n\na. 북조선의 군사 잠재력에 관한 문단을 늘려 다음을 포함시켜야 한다 --\n\n(1) 북조선의 항만, 상륙 해안, 내륙으로 드는 통로에 관한 최신 정보. JANIS 75호(JANIS No. 75)에 실린 내용을 보강하는 것이다.\n\n(2) 북조선의 해안경비대(Coast Guard), 해관(Maritime Customs), 그 밖에 해군 임무로 곧바로 전용할 수 있는 부대의 편성, 훈련, 장비에 관한 최신 정보.\n\n(3) 수리 시설과 건조 시설을 포함한 해운 시설에 관한 정보.\n\n(4) 군용과 민간 양쪽의 항공 사항에 관한 정보.\n\nb. 제2절 남조선(Section II, South Korea) 아래에는, 노동조합과 같은 대중 단체와 다른 나라의 유사 단체 사이의 관계에 관한 자료를 넣는 것을 고려해야 한다. 그 예가 조선의 노동 단체와 공산주의자가 장악한 세계노동조합연맹(WFTU) 사이의 관계이며, 소련은 이를 통하여 남조선 노동 단체 사이에서 자기들의 objections [원문 그대로]을 밀고 나갈 수 있다.\n\n공개 승인 2003/10/07 : [판독 불가]", "secondary": "5166\n\nApproved For Release [판독 불가]\n\nCOPY\n\n\"COPY\"\n\nMEMORANDUM FOR THE SECRETARY, NATIONAL INTELLIGENCE AUTHORITY:\n\nSubject: Approval of National Intelligence Requirements for Korea\n\n1. The subject paper is:\n\na. Approved without change\n\nb. Approved, subject to the minor amendments set out below\n\nc. Disapproved. Request meeting of I.A.B. to consider paper\n\nd. Return to drafting agency (checked) TBI\n\n[판독 불가]\n\n26 [원문 그대로] Suggestions or amendments:\n\n(See attached sheet)\n\nNAVY review(s) completed.\n\n(signed) THOS. B. INGLIS\nSignature\nRear Admiral, USNavy\nChief of Naval Intelligence\n\nReturn to: Room 7123\nNorth Interior Building        16 Sep 19,7 [원문 그대로]\n[판독 불가]\n\n[판독 불가]\nApproved For Release 2003/10/07 : [판독 불가]\n\nCOPY [판독 불가]\nApproved For Release 2003/10/07 : [판독 불가]\n\n\"COPY\"\n\n9731\n\nSubject: Approval of National Intelligence Requirements for Korea.\n\nSuggestions:\n\nIt is recommended that the drafting agency reconsider this paper in the light of the following comments:\n\na. The paragraph on military potentials of North Korea should be enlarged to include --\n\n(1) Current information on ports, landing beaches and routes inland in North Korea in amplification of that contained in JANIS No. 75.\n\n(2) Current information on organization, training and equipment of the Coast Guard, Maritime Customs or other units in North Korea readily convertible to naval service.\n\n(3) Information on marine shipping facilities, including repair and construction facilities.\n\n(4) Information on aeronautical matters, both military and civil.\n\nb. Under Section II, South Korea, consideration should be given to the inclusion of data on the relations between popular groups such as labor unions and similar groups in other countries. An example of this is relations between Korean labor groups and the Communist dominated WFTU through which the Soviets are able to further their objections [원문 그대로] among the South Korean labor groups.\n\nApproved For Release 2003/10/07 : [판독 불가]", "notes": ["[삭제·공개 표시] Approved For Release 2003/10/07 : CIA-RDP80R01731R003600060005-6 (세 곳의 공개 승인 도장. 문서번호 부분이 모두 뭉개져 [판독 불가]로 옮겼다)", "[삭제·공개 표시] 첫 면 머리의 공개 승인 도장은 날짜까지 뭉개져 있어 「Approved For Release [판독 불가]」로 옮겼다", "[삭제·공개 표시] 체크란 아래 한 줄이 판독되지 않아 [판독 불가]로 옮겼다", "[삭제·공개 표시] 서명 아래 반송처 다음 줄의 도장 문구가 뭉개져 [판독 불가]로 옮겼다"], "note": "본문 자체는 짧고 읽히나 스캔에 겹쳐 찍힌 도장 줄이 모두 뭉개져 있다. 공개 승인 도장의 문서번호는 지어내지 않고 [판독 불가]로 두었다. 서명란의 날짜는 `16 Sep 19,7` 로 찍혀 있다. 1947년 9월 16일로 보이나 날짜의 숫자는 고치지 않고 원문대로 두었다. 두 번째 항목의 번호는 `26` 으로 찍혀 있다. `2.` 가 뭉개진 것으로 보이나 숫자를 고치지 않았다. 체크란의 항목 기호는 원문에 `a. be ce de` 로 찍혀 있어 a b c d 로 폈다. 낱말 철자만 고치는 범위다. 마지막 문단의 `objections` 는 문맥상 objectives 로 읽히나 그 자체가 성립하는 낱말이라 고치지 않고 원문대로 두었다. `I.AeB.` 는 I.A.B.(Intelligence Advisory Board 정보자문위원회)로 읽었다. `JANIS Noe 75` 는 JANIS No. 75 로 읽었다. JANIS 는 미 육해군 합동정보연구(Joint Army-Navy Intelligence Study)다. `WFTU` 는 세계노동조합연맹이며 원문 약어를 그대로 두었다. 두 면의 머리에 각각 `5166` 과 `9731` 이라는 숫자가 찍혀 있어 그대로 옮겼다. 비밀등급 표시가 본문에 남아 있지 않아 classification 은 null 로 두었다. 서명 아래 `CEStS` 처럼 보이는 도장 자국이 있으나 판독되지 않는다.", "warn": false, "search": "THOS. B. INGLIS 토머스 B. 잉글리스 (해군소장, 해군정보국장, 서명자) Approved For Release 2003/10/07 : CIA-RDP80R01731R003600060005-6 (세 곳의 공개 승인 도장. 문서번호 부분이 모두 뭉개져 [판독 불가]로 옮겼다) 첫 면 머리의 공개 승인 도장은 날짜까지 뭉개져 있어 「Approved For Release [판독 불가]」로 옮겼다 체크란 아래 한 줄이 판독되지 않아 [판독 불가]로 옮겼다 서명 아래 반송처 다음 줄의 도장 문구가 뭉개져 [판독 불가]로 옮겼다 Approval of National Intelligence Requirements for Korea"}, {"id": "N37", "order": 61, "date": "1947-09-18", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "정치 첩보: 만주와 북조선의 공산주의자들이 뤼순에서 회합하다", "badge": "confidential control (U.S. OFFICIALS ONLY)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-09-18"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Political Information: Communists from Manchuria and North Korea Meet in Port Arthur", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000900370003-3"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000900370003-3"}], "summary": "1947년 5월 뤼순 의학원 건물에서 LI Li-san 이 소집한 회합에 동북국과 내몽골, 북조선의 대표가 모인다. 열여덟 명이 참석해 비밀 군사 조직을 만드는 방식으로 공산 활동을 넓히기로 결의한다.", "points": ["국가 표시가 중국(China)으로 되어 있으나 내용의 절반이 조선이다. 회합 소집자는 LI Li-san 리리싼이고 장소는 뤼순의 의학원 건물이다.", "참석자에 동북국 서기 LIN Feng, CHANG Hsueh-shih, 신의주 주둔 팔로군 전 부대의 사령관이자 안둥성 주석으로 전에 보고된 KAO Ch'ung-min, MAO Tse-tung 의 대표 CHU Ch'i-wen 이 있다.", "KIM Il-sung 김일성의 대표로 YIM Chung-kap 이 참석한다. 북조선이 이 회합에 사람을 보냈다는 것이 이 보고의 핵심이다.", "몽골 쪽에서는 몽골당 조직부장 Temurbagan 과 Boinmandaho 의 대표 Hatai Ahsungshenda 가 온다. 보고자는 Hatai 가 실제로는 내몽골자치정부의 대표일 수 있다고 단서를 단다.", "약 열여덟 명이 모였고 의장은 LI Li-san 이었다. 결의 가운데 비밀 군사 조직을 만들어 공산 활동을 넓힐 지역이 열거된다.", "그 지역에 자무쓰, 하얼빈, 뤼순, 동몽골, 왕예먀오, 자란툰, 치치하얼과 함께 북조선의 평양(헤이조), Sinup(신구), 회령(가이네이)이 들어간다."], "primary": "공개 승인(Approved For Release) 200[판독 불가] : CIA-RDP82-00457R000900370003-3\n기밀(CONFIDENTIAL)\n\n[판독 불가] 훈련된 정보분석관의 [판독 불가] 연구용으로 제공하는 평가되지 않은 정보(unevaluated information).\n\n기밀 통제(CONFIDENTIAL CONTROL) — 25X1A\n미국 관리 전용(U.S. OFFICIALS ONLY)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n111004\n\n국가  중국(China)            일자: 25X1A\n                          정보(INFO.)\n                          배포(DIST.)  [판독 불가] 1947년 9월\n주제  정치 첩보: 만주와 북조선의 공산주의자들이 뤼순(Port Arthur 旅順)에서 회합하다\n25X1A                     면수  2\n                          보충(SUPPLEMENT)\n25X1X\n\n1. 1947년 5월 [판독 불가]일, LI Li-san 리리싼이 뤼순의 의학원(Medical College) 건물에서 회합을 소집하였다. 다음 인물들이 참석하였다:\n\na. LIN Feng 린펑([한자 판독 불가]), 동북국(Northeast Bureau) 서기. (전에는 동북국 군사부의 당 위원이자 동북국 당 [판독 불가]의 위원으로 보고된 바 있다.)\n\nb. CHANG Hsueh-shih 창쉐스([한자 판독 불가]) (CHANG Hsueh-ssu [한자 판독 불가]). (전에는 동북국 군사부 [판독 불가] 군구(Military Region)의 정치위원이자 동북국 정치부의 위원으로 보고된 바 있다.)\n\nc. KAO Ch'ung-min 가오충민([한자 판독 불가]) (KAO Ch'ung-min [한자 판독 불가]). (전에는 신의주(Sinuiju, 일본식 Shingishu 新義州) ([판독 불가] 40-06)에 있는 중국공산당 팔로군(Eighth Route Army) 전 병력의 사령관이자 안둥성(Antung Province 安東省) 주석으로 보고된 바 있다.)\n\nd. CHU Ch'i-wen 주치원([한자 판독 불가]), MAO Tse-tung 마오쩌둥의 대표. (CHU 는 전에 동북국 군사부 랴오둥(Liaotung 遼東) 군구의 당 위원으로 보고된 바 있다.)\n\ne. YIM Chung-kap([한자 판독 불가]), KIM Il-sung 김일성([한자 판독 불가])의 대표.\n\n25X1A  f. Temurbagan 테무르바간(T'e-mu-erh-pa-kan), 몽골당 조직부장. [삭제] Temurbagan 의 인물 정보에 관하여, 그를 [판독 불가]에 있는 내몽골자치정부(Inner Mongolian Autonomous Government) 경제과의 책임자로 보고하고 있다.\n25X1A\n\n문서번호(Document No.) [판독 불가]\n등급 변경 없음(NO CHANGE in Class.) [ ]\n[ ] 비밀해제(DECLASSIFIED)\n등급 구분(CLASSIFICATION) 기밀(CONFIDENTIAL)\n등급 변경(Class. CHANGED TO): TS S C\nDDA 각서, 1977년 4월 4일\n근거(Auth): DDA REG. 77/1763\n일자: 1978년 4월 14일  담당: [판독 불가]\n\n공개 승인 200[판독 불가] : CIA-RDP82-00457R000900370003-3\n기밀(CONFIDENTIAL)\n\n2\n\n공개 승인 200[판독 불가] : CIA-RDP82-00457R000900370003-3\n기밀(CONFIDENTIAL)\n중앙정보단(CENTRAL INTELLIGENCE GROUP)  1904\n\ng. Hatai Ahsungshenda 하타이 아숭센다 양(Ha-t'ai-ah-sung-shen-te), Boinmandaho 보인만다호(Po-yen-man-tu)의 대표. [삭제] Boinmandaho 는 전에 동내몽골자치정부(Eastern Inner Mongolian Autonomous Government) 주석이었고 뒤에 동서 내몽골자치운동연합회의 부주석이었으나, 1947년 3월 내몽골 정부 기구가 개편될 때 자리에서 물러났다. 현재 그는 왕예먀오(Wangyehmiao 王爺廟)에 있으며 겉으로는 정치에 관여하지 않고 있다. [삭제] 따라서 Hatai Ahsungshenda 는 25X1A Boinmandaho 의 대표라기보다 내몽골자치정부의 대표일 가능성이 있다.)\n\n회합에는 약 열여덟 명이 참석하였고 LI Li-san 이 의장을 맡았다. 회합에서 통과된 여러 결의 가운데는, 비밀 군사 조직을 만드는 방식으로 공산 활동을 넓힌다는 계획이 있었다. 대상 지역은 동북 지구의 자무쓰(Chiamussu 佳木斯), 하얼빈(Harbin 哈爾濱), 뤼순(Port Arthur 旅順), 동몽골(Eastern Mongolia), 왕예먀오(Wangyehmiao 王爺廟), 자란툰(Chalantun 扎蘭屯), 치치하얼(Tsitsihar 齊齊哈爾)과, 북조선의 평양(Pyongyang, 일본식 Heijo 平壤, 125-44, 39-01), Sinup(일본식 Shingu, 126-46, 39-54), 회령(Hoeryong, 일본식 Kainei 會寧, 129-15, 42-25)이다.\n\n이 문서에는 개정된 간첩법(Espionage Act, 50, U.S.C. 31 및 32)에서 정한 뜻에서 미합중국의 국방에 관련되는 정보가 들어 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방식으로든 알리는 것은 법으로 금지된다.\n\n기밀 통제(CONFIDENTIAL CONTROL)  미국 관리 전용(U.S. OFFICIALS ONLY)\n\n공개 승인 200[판독 불가] : CIA-RDP82-00457R000900370003-3\n기밀(CONFIDENTIAL)", "secondary": "Approved For Release 200[판독 불가] : CIA-RDP82-00457R000900370003-3\nCONFIDENTIAL\n\n[판독 불가] unevaluated information for the [판독 불가] research use of trained intelligence analysts.\n\nCONFIDENTIAL CONTROL — 25X1A\nU.S. OFFICIALS ONLY\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\n111004\n\nCOUNTRY  China            DATE: 25X1A\n                          INFO.\n                          DIST.  [판독 불가] September 1947\nSUBJECT  Political Information: Communists from Manchuria and North Korea Meet in Port Arthur\n25X1A                     PAGES  2\n                          SUPPLEMENT\n25X1X\n\n1. On [판독 불가] May 1947 LI Li-san called a meeting at the Medical College Building in Port Arthur. The following personalities attended:\n\na. LIN Feng ([한자 판독 불가]), Secretary of the Northeast Bureau (previously reported as Party Commissioner of the Military Department of the Northeast Bureau and a Commissioner of the Party [판독 불가] of the Bureau).\n\nb. CHANG Hsueh-shih ([한자 판독 불가]) (CHANG Hsueh-ssu [한자 판독 불가]) (previously reported as Political Commissioner of the [판독 불가] Military Region of the Military Department of the Northeast Bureau and Commissioner of the Political Department of the Bureau).\n\nc. KAO Ch'ung-min ([한자 판독 불가]) (KAO Ch'ung-min [한자 판독 불가]) (previously reported as the Commanding Officer of all Chinese Communist Eighth Route Army troops in Sinuiju (Shingishu, [판독 불가] 40-06) and Governor of Antung Province).\n\nd. CHU Ch'i-wen ([한자 판독 불가]), representative of MAO Tse-tung. (CHU was previously reported as Party Commissioner of the Liaotung Military Region of the Military Department of the Northeast Bureau).\n\ne. YIM Chung-kap ([한자 판독 불가]), representative of KIM Il-sung ([한자 판독 불가]).\n\n25X1A  f. Temurbagan (T'e-mu-erh-pa-kan), Chief of the Mongolian Party Organization Department. [삭제] for biographical information on Temurbagan, reporting him to be head of\n25X1A  the Economic Section of the Inner Mongolian Autonomous Government at [판독 불가]\n\nDocument No. [판독 불가]\nNO CHANGE in Class. [ ]\n[ ] DECLASSIFIED\nCLASSIFICATION CONFIDENTIAL\nClass. CHANGED TO: TS S C\nDDA Memo, 4 Apr 77\nAuth: DDA REG. 77/1763\nDate: 14 APR 1978  By: [판독 불가]\n\nApproved For Release 200[판독 불가] : CIA-RDP82-00457R000900370003-3\nCONFIDENTIAL\n\n2\n\nApproved For Release 200[판독 불가] : CIA-RDP82-00457R000900370003-3\nCONFIDENTIAL\nCENTRAL INTELLIGENCE GROUP  1904\n\ng. Miss Hatai Ahsungshenda (Ha-t'ai-ah-sung-shen-te), representative of Boinmandaho (Po-yen-man-tu). [삭제] Boinmandaho, formerly 25X1A Chairman of the Eastern Inner Mongolian Autonomous Government and later Vice Chairman of the combined Eastern and Western Inner Mongolian Autonomous Movement Association, was relieved from his office when there was a reorganization of the Inner Mongolia governmental structure in March 1947; at present he is in Wangyehmiao, outwardly inactive in politics. [삭제] Consequently, Hatai Ahsungshenda 25X1A is possibly a representative of the Inner Mongolian Autonomous Government rather than of Boinmandaho.)\n\nThere were about eighteen members present at the meeting, with LI Li-san acting as chairman. Among the many resolutions passed at the meeting was a plan to expand Communist activities in Chiamussu, Harbin, Port Arthur, Eastern Mongolia, Wangyehmiao, Chalantun, and Tsitsihar in the Northeast area, and in Pyongyang (Heijo, 125-44, 39-01), Sinup (Shingu, 126-46, 39-54), and Hoeryong (Kainei, 129-15, 42-25) in North Korea, by organizing secret military groups.\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nCONFIDENTIAL CONTROL  U.S. OFFICIALS ONLY\n\nApproved For Release 200[판독 불가] : CIA-RDP82-00457R000900370003-3\nCONFIDENTIAL", "notes": ["[삭제·공개 표시] Approved For Release 200[판독 불가] : CIA-RDP82-00457R000900370003-3 (네 곳의 공개 승인 도장. 공개 연도가 도장에 겹쳐 판독되지 않는다)", "[삭제·공개 표시] 25X1A (머리의 통제 줄, f항 왼쪽 여백 두 곳, g항 본문 두 곳)", "[삭제·공개 표시] 25X1X (SUPPLEMENT 줄 아래 여백)", "[삭제·공개 표시] f항에서 Temurbagan 의 인물 정보 출처를 적은 자리가 지워져 [삭제]로 옮겼다", "[삭제·공개 표시] g항에서 Boinmandaho 관련 서술 앞뒤의 출처 표시 두 곳이 지워져 [삭제]로 옮겼다", "[삭제·공개 표시] Document No. [판독 불가] / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S C / DDA Memo, 4 Apr 77 / Auth: DDA REG. 77/1763 / Date: 14 APR 1978 (비밀해제 처리 도장)"], "note": "국가란이 China 로 되어 있는 문서이나 참석자와 결의 대상에 북조선이 들어 있어 이 문서철에 들어왔다. 인명에 붙은 한자는 모두 스캔에서 뭉개져 한 글자도 확정되지 않아 [한자 판독 불가]로 두었다. 로마자 표기는 원문을 앞세웠다. `KIM Tl-sung` 은 KIM Il-sung 으로 읽었다. 소문자 l 과 대문자 I 가 뒤바뀐 흔한 오독이다. `KAO Gutaia-nthe` 는 뒤에 다시 나오는 `KAO Chtung-min` 을 따라 KAO Ch'ung-min 으로 읽었다. `CHU Chti-wen` 은 CHU Ch'i-wen, `CHANG Heueh-ssn` 은 CHANG Hsueh-ssu 로 읽었다. 아포스트로피가 t 로 찍히는 것이 이 스캔의 버릇이다. 회합 날짜는 `On >? May 1947` 로 찍혀 일자가 판독되지 않는다. 지어내지 않고 [판독 불가]로 두었다. 배포 일자도 `WKSeptenber 1947` 로 앞의 일자가 뭉개져 있다. 좌표는 고치지 않았다. 신의주의 `(aera 40-06)` 은 경도가 통째로 깨져 있어 [판독 불가]로 두었고 위도만 남겼다. 평양 `(125-44, 39-01)`, 회령 `(129-15, 42-25)` 는 온전하다. `Sinup (Shingu, 126-46, 39-54)` 은 좌표로 보면 신의주 쪽이나 원문이 Sinuiju 와 따로 적어 놓았으므로 표기를 고치지 않고 그대로 두었다. `Tsitsibar` 는 Tsitsihar 로, `Chiamussu` 는 그대로 두고 자무쓰로 병기했다. `Kainel` 은 회령의 일본식 이름 Kainei 로 읽었다. 머리의 「평가되지 않은 정보」 문구는 스캔이 심하게 뭉개져 읽히는 부분만 살리고 나머지는 [판독 불가]로 두었다. `Northeast Bureau` 는 중국공산당 동북국이다. `Eighth Route Army` 는 팔로군이며 원문 표기를 살렸다.", "warn": false, "search": "LI Li-san 리리싼(李立三) (회합 소집자이자 의장) 차량, 섬에 있는 소련군 소대, 옛 세무서 건물의 포병 부대, 차량 창고와 경비 병력을 항목마다 지도 참조 번호와 함께 적었다.", "소련 해군은 시청에 사령부를 두고 옛 전매국 건물을 병사로 쓴다. 항만 구역에 해군 경비대와 창고 경비대가 따로 있다.", "조선인 쪽은 보안서(Bo An Sur) 약 200명, 보안대(Bo An Dai) 약 500명, 북조선 경비대(Kyung Bi Dai) 100명이다. 보안대 지휘관의 성은 CHONG 이다.", "동해안경비대 원산 부대는 어항에 모여 있고 배 여덟 척 가운데 두 척만 쓴다. 병력 140명이며 지휘관 YI 는 옌안에서 훈련받았다. 제복이 소련 해군의 것과 비슷한 짙은 남색 무명이다."], "primary": "기밀(CONFIDENTIAL)\n공개 승인(Approved For Release) 2004/[판독 불가] : CIA-RDP82-00457R000900430009-0\n\n[판독 불가] 통제(CONTROL) 미국 관리 전용(U.S. OFFICIALS ONLY)  25X1[판독 불가]\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n첩보보고(INTELLIGENCE REPORT)\n국가  조선(Korea)            일자(DATE):\n                          정보(INFO.)  25X1A\n주제  군사 첩보: 원산(Wonsan, 일본식 Ge[판독 불가]san 元山) 일대\n                          배포(DIST.)  [판독 불가] 1947년 9월\n                          면수  4\n                          보충(SUPPLEMENT)\n                          붙임(ATTACHMENT)  지도 1장\n\n원산 비행장(Wonsan Airfield) (127-29, 39-10)\n\n1. 원산 비행장은 칼마(Kalma, 일본식 Katsuma 葛麻)반도에 있다. 원산항으로 좁고 길게 뻗어 나간 땅이다. (붙임 1의 참조 1을 볼 것.)  25X1X\n\n2. 이 비행장에는 활주로가 하나 있으며 너비 150피트, 길이 3500피트다. ([삭제] JANIS 75호 표 XIV-2에 따르면: 1944년 12월 25X1C 칼마반도의 원산 비행장에는 교차하는 포장 활주로가 두 개 있었다. 3850피트 × 230피트 동북동/서남서, 3000피트 × 230피트 북북서/남남동.)\n\n3. 비행장에 단발기 40대와 쌍발기 3대가 있다. 여러 종류의 차량 28대도 비행장에 있다.\n\n4. 비행장에 소련군 경비병 300명이 배치되어 있다.\n\n5. 비행장의 탐조등 두 대는 밤마다 쓰인다.\n\n6. 비행장에 격납고가 3동 있다. ([삭제] JANIS 75호 표 XXV-2 [원문 그대로]에 따르면: 1944년 12월에는 큰 격납고 8동과 작은 격납고 3동이 있었다.)\n\n원산항의 선박\n\n7. 원산항에 큰 소련 배 두 척이 있다. (붙임 1의 참조 3을 볼 것.) 하나는 1800톤 구축함이고 다른 하나는 3000톤 수송선이다.\n\n8. 3000톤 구축함 한 척이 1947년 4월 10일 원산항을 떠났다.\n\n원산 조선소(Wonsan Shipyard)\n\n9. 원산 조선소에서 (붙임 1의 참조 [판독 불가]를 볼 것.) 지금 많은 배를 짓고 있다. ([삭제] JANIS 75호 제6장에 따르면: 1946년 3월 당시 원산 일대에서 알려진 조선소는 어항 동쪽의 것뿐이었으나, 이 보고서 붙임 1의 참조 11에 해당하는 자리에 조선소가 있을 수 있다는 언급이 있었다.)\n\n기밀(CONFIDENTIAL)\n등급 구분(CLASSIFICATION) [판독 불가] 통제 미국 관리 전용\n\n문서번호(Document No.) [판독 불가]\n등급 변경 없음(NO CHANGE in Class.) [ ]\n[ ] 비밀해제(DECLASSIFIED)\n등급 변경(Class. CHANGED TO): TS S C\nDDA 각서, 1977년 4월 4일\n\n자료실 도서관(REFERENCE CENTER LIBRARY)\n\n공개 승인 200[판독 불가] : CIA-RDP82-00457R000900430009-0\n\n[판독 불가]\n\n공개 승인 2001/03/05 : CIA-RDP82-00457R000900430009-0\n\n기밀(CONFIDENTIAL)\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n원산 시내의 소련 육군 병력\n25X1A\n\n[판독 불가]. 원산 시내에 소련 육군 병력이 약 [판독 불가]명 있다.\n\n[판독 불가]. 원산의 소련군 위수사령부(Soviet Army Garrison Headquarters)에는 (붙임 1의 참조 15를 볼 것.) 구경 약 4인치의 화포 11문이 있다. 고무 타이어를 단 견인차 11대, 큰 화물차 8대, 그 밖의 여러 종류 차량 18대도 있다. 이 사령부에 소련 육군 장교가 약 89명 있다.\n\n[판독 불가]. 원산항의 섬 하나에 소련 병사 한 개 소대가 배치되어 있다. 이 섬에 화포 3문이 있다.\n\n[판독 불가]. 병력 [판독 불가]명의 소련 포병 부대가 옛 세무서(Revenue Office) 건물에 (숙영 중인 것으로 보인다). (붙임 1의 참조 10을 볼 것.) 이 부대의 화포는 원산의 소련 육군 사령부에 있다. (제21항 [원문 그대로]을 볼 것.)\n\n1[판독 불가]. 원산에 소련군 창고가 있으며 여러 종류의 차량 [판독 불가]120대가 들어 있다. (붙임 1의 참조 19를 볼 것.) 이 창고에 소련 병사 [판독 불가]명의 파견대가 배치되어 있다.\n\n원산의 소련 해군 인원\n\n[판독 불가]. 원산에 소련 해군 병력이 약 50명 있다.\n\n[판독 불가]. 소련 해군 사령부는 시청(City Hall)에 있다. (붙임 1의 참조 7을 볼 것.) 이 사령부에 소련 해군 장교가 약 80명 있다.\n\n17. 옛 전매국(Tobacco Monopoly Bureau)이 쓰던 건물에 소련 해군 병사(兵舍)가 있다. (붙임 1의 참조 2를 볼 것.) 이 병사에 소련 해군 병력 100명이 있다.\n\n1[판독 불가]. 소련 항만 구역의 일부에 (붙임 1의 참조 4를 볼 것) 소련 해군 경비대(Soviet Naval Guard Unit) 대원 120명이 있다.\n\n[판독 불가]. 소련 항만 구역에는 특별 「소련 해군 창고 경비[판독 불가]」 대원 50명도 있다. (붙임 1의 참조 5를 볼 것.)\n\n20. 소련 항만 구역에 탐조등이 한 대 있으나 쓰이지 않고 있다. (붙임 1의 참조 4를 볼 것.)\n\n원산의 조선인 부대\n\n21. 원산의 보안서(Peace Preservation Offices, Bo An Sur [한자 판독 불가])에 약 200명이 있다. (보안서 본부의 위치는 붙임 1의 참조 8을 볼 것.)\n\n22. 원산의 보안대(Peace Preservation Corps, Bo An Dai [한자 판독 불가])에 대원이 약 500명 있다. (보안대 본부의 위치는 붙임 1의 참조 14를 볼 것.) 원산의 보안대 병력을 지휘하는 자의 이름은 CHONG([한자 판독 불가])이다.\n\n23. 원산에 북조선 경비대(North Korean Constabulary, Kyung Bi Dai [한자 판독 불가]) 대원 100명이 있다. (붙임 1의 참조 5를 볼 것.) 이들은 항만 구역에서 소련 측을 도와 경비 임무를 맡는다.\n\n기밀(CONFIDENTIAL)\n[판독 불가] 통제(CONTROL)\n미국 관리 전용(U. S. OFFICIALS ONLY)\n\n공개 승인 2001/03/05 : CIA-RDP82-00457R000900430009-0\n\n공개 승인 2001/03/05 : CIA-RDP82-00457R000900430009-0\n\n기밀(CONFIDENTIAL)\n\n원산의 조선 동해안경비대(Korean East Sea Coast Guard)\n\n24. 동해안경비대([한자 판독 불가]) 원산 부대의 대원들은 어항 구역에 모여 있다. (붙임 1의 참조 12와 13을 볼 것.) 이들은 자동차 네 대와 작은 발동선 여덟 척을 가지고 있다. 배 가운데 지금 쓰이는 것은 두 척뿐이다. 날마다 0200시부터 1600시까지 그 두 척이 바다에 나간다.\n\n25. 원산의 동해안경비대 파견대에 140명이 있다. 파견대 지휘관의 이름은 YI([한자 판독 불가])다. 그는 [판독 불가]세이며 옌안(Yenan 延安) (109-27, 36-34)에서 훈련받았다. (상하이 주(Shanghai Note): 동해안경비대의 본부가 원산에 있다고 다른 미국 기관이 보고한 바 있다.)\n\n[판독 불가]. 이 조선 해안경비대 파견대의 대원들은 소련 해군 인원이 입는 것과 비슷한 짙은 남색 무명 제복을 입는다.\n\n이 문서에는 개정된 간첩법(Espionage Act, 50, U.S.C. 31 및 32)에서 정한 뜻에서 미합중국의 국방에 관련되는 정보가 들어 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방식으로든 알리는 것은 법으로 금지된다.\n\n기밀(CONFIDENTIAL)\n[판독 불가] 통제(CONTROL)\n미국 관리 전용(U.S. OFFICIALS ONLY)\n\n공개 승인 2001/03/05 : CIA-RDP82-00457R000900430009-0\n\n기밀(CONFIDENTIAL)\n\n[붙임 1 — 지도 범례. 항목 번호가 스캔에서 사라져 원문에 찍힌 차례대로만 옮긴다.]\n\n소련군 영창(Soviet Army Jail).\n\n[판독 불가] 원산(OF WONSAN)\n\n칼마(가쓰마)반도의 원산 비행장.\n\n소련 해군 병사(兵舍).\n\n소련 해군 항만 구역의 일부. 1200톤 소련 구축함 한 척과 3000톤 소련 수송선 한 척이 여기에 정박해 있다.\n\n소련 해군 항만 구역의 일부. 소련 해군 경비대 420명. 탐조등 1대.\n\n소련 해군 항만 구역의 일부. 북조선 경비대(Kyung Bi Dai) 100명.\n\n「소련 해군 창고 경비대」 50명.\n\n시청. 소련 해군 사령부.\n\n원산 보안서(Bo An Sur) 본부.\n\n철도 사무소.\n\n철도역.\n\n원산 조선소.\n\n어항과 시장 구역.\n\n원산 보안대(Bo An Tai) 본부.\n\n소련군 위수사령부.\n\n원산 방송국.\n\n소련 육군 및 해군 장교 숙사.\n\n옛 세무서 건물. 소련 포병 부대 140명.\n\n소련군 차량 창고.\n\n소련군 기념비.\n\n기밀(CONFIDENTIAL)\n[판독 불가] 통제 미국 관리 전용\n\n공개 승인 2001/03/05 : CIA-RDP82-00457R000900430009-0", "secondary": "CONFIDENTIAL\nApproved For Release 2004/[판독 불가] : CIA-RDP82-00457R000900430009-0\n\n[판독 불가] CONTROL U.S. OFFICIALS ONLY  25X1[판독 불가]\nCENTRAL INTELLIGENCE GROUP\nINTELLIGENCE REPORT\nCOUNTRY  Korea            DATE:\n                          INFO.  25X1A\nSUBJECT  Military Information: Wonsan (Ge[판독 불가]san) Area\n                          DIST.  [판독 불가] September 1947\n                          PAGES  4\n                          SUPPLEMENT\n                          ATTACHMENT  1 Map\n\nWonsan Airfield (127-29, 39-10)\n\n1. The Wonsan Airfield is on the Kalma (Katsuma) Peninsula, a narrow strip of land which juts out into Wonsan Harbor. (See Reference 1 on Attachment 1.)  25X1X\n\n2. This airfield has one run-way which is 150 feet wide and 3500 feet long. ([삭제] According to Janis 75, Table XIV-2: In December 1944, on 25X1C Wonsan airfield on the Kalma Peninsula, there were two run-ways, crossed (paved): 3850 feet x 230 feet ENE/WSW; 3000 feet x 230 feet NNW/SSE.)\n\n3. There are 40 single-engine planes and 3 twin-engine planes on the airfield. There are also 28 vehicles of various types at the field.\n\n4. There are 300 Soviet guards stationed at the airfield.\n\n5. The two searchlights at the airfield are in use every night.\n\n6. There are 3 hangars on the airfield. ([삭제] According to Janis 75, Table XXV-2 [원문 그대로]: In December 1944, there were 8 large and 3 small hangars.)\n\nShips in Wonsan Harbor\n\n7. There are two large Soviet ships in Wonsan Harbor. (See Reference 3 on Attachment 1.) One is an 1800-ton destroyer and the other, a 3000-ton transport.\n\n8. A 3000-ton destroyer left Wonsan Harbor on 10 April 1947.\n\nWonsan Shipyard\n\n9. In the Wonsan Shipyard (See Reference [판독 불가] on Attachment 1.) many ships are now being built. ([삭제] According to Janis 75, Chapter VI: In March 1946, the only known shipyard in the Wonsan area was east of the Fishing Harbor, but there was mention of a possible shipyard north of the Fishing Harbor in an area corresponding to Reference 11 of Attachment 1 of this report.)\n\nCONFIDENTIAL\nCLASSIFICATION [판독 불가] CONTROL U.S. OFFICIALS ONLY\n\nDocument No. [판독 불가]\nNO CHANGE in Class. [ ]\n[ ] DECLASSIFIED\nClass. CHANGED TO: TS S C\nDDA Memo, 4 Apr 77\n\nREFERENCE CENTER LIBRARY\n\nApproved For Release 200[판독 불가] : CIA-RDP82-00457R000900430009-0\n\n[판독 불가]\n\nApproved For Release 2001/03/05 : CIA-RDP82-00457R000900430009-0\n\nCONFIDENTIAL\nCENTRAL INTELLIGENCE GROUP\n\nSoviet Army Troops in Wonsan City\n25X1A\n\n[판독 불가]. There are approximately [판독 불가] Soviet Army troops in Wonsan proper.\n\n[판독 불가]. At the Soviet Army Garrison Headquarters in Wonsan (See Reference 15 on Attachment 1.) there are 11 artillery pieces with a (bore) diameter of approximately 4 inches. There are also 11 tractors with rubber tires, 8 large trucks, and 18 other vehicles of various types. There are approximately 89 Soviet Army officers at this Headquarters.\n\n[판독 불가]. There is a platoon of Soviet soldiers stationed on one of the islands [in] Wonsan Harbor. There are 3 artillery pieces on this island.\n\n[판독 불가]. A Soviet artillery unit of [판독 불가] men is (billeted?) in the former Revenue Office Building. (See Reference 10 on Attachment 1.) The artillery pieces of this unit are at the Soviet Army headquarters in Wonsan. (See paragraph 21 [원문 그대로].)\n\n1[판독 불가]. There is a Soviet Army Warehouse in Wonsan containing [판독 불가]120 vehicles of various types. (See Reference 19 on Attachment 1.) A detachment of [판독 불가] Soviet soldiers is stationed in this warehouse.\n\nSoviet Navy Personnel in Wonsan\n\n[판독 불가]. There are approximately 50 Soviet Naval troops in Wonsan.\n\n[판독 불가]. The Soviet Naval Headquarters is in the City Hall. (See Reference 7 on Attachment 1.) There are approximately 80 Soviet naval officers at this Headquarters.\n\n17. There is a Soviet Naval Barracks in the building formerly occupied by the Tobacco Monopoly Bureau. (See Reference 2 on Attachment 1.) There are 100 Soviet Naval troops in this barracks.\n\n1[판독 불가]. In part of the Soviet Port Area (See Reference 4 on Attachment 1) there are 120 members of a Soviet Naval Guard Unit.\n\n[판독 불가]. There are also 50 members of a special \"Soviet Naval Warehouse Guard [판독 불가]\" in the Soviet port area. (See Reference 5 on Attachment 1.)\n\n20. There is one searchlight in the Soviet Port Area, but it is not being used. (See Reference 4 on Attachment 1.)\n\nKorean Troops in Wonsan\n\n21. There are approximately 200 men in the Peace Preservation Offices (Bo An Sur [한자 판독 불가]) in Wonsan. (For location of Peace Preservation Office Headquarters, see Reference 8 on Attachment 1.)\n\n22. There are approximately 500 members of the Peace Preservation Corps (Bo An Dai [한자 판독 불가]) in Wonsan. (For location of Peace Preservation Corps Headquarters, see Reference 14 on Attachment 1.) The name of the commander of the Peace Preservation Corps troops in Wonsan is CHONG ([한자 판독 불가]).\n\n23. There are 100 members of the North Korean Constabulary (Kyung Bi Dai [한자 판독 불가]) in Wonsan. (See Reference 5 on Attachment 1.) They assist the Soviets [in] performing guard duty in the port area.\n\nCONFIDENTIAL\n[판독 불가] CONTROL\nU. S. OFFICIALS ONLY\n\nApproved For Release 2001/03/05 : CIA-RDP82-00457R000900430009-0\n\nApproved For Release 2001/03/05 : CIA-RDP82-00457R000900430009-0\n\nCONFIDENTIAL\n\nKorean East Sea Coast Guard in Wonsan\n\n24. Members of the Wonsan Unit of the East Sea Coast Guard ([한자 판독 불가]) are concentrated in the fishing port area. (See References 12 and 13 on Attachment 1.) They have four cars and eight small motorboats. Only two of the boats are now being used. From 0200 hours to 1600 hours daily the two boats are at sea.\n\n25. There are 140 men in the East Coast Guard Detachment in Wonsan. The name of the commander of the detachment is YI ([한자 판독 불가]). He is [판독 불가]-years of age and was trained in Yenan (109-27, 36-34). (Shanghai Note: It has been reported by another American agency that the Headquarters of the East Sea Coast Guard is at Wonsan.)\n\n[판독 불가]. Members of this Korean Coast Guard Detachment wear uniforms of dark blue cotton cloth similar to those worn by the Soviet naval personnel.\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nCONFIDENTIAL\n[판독 불가] CONTROL\nU.S. OFFICIALS ONLY\n\nApproved For Release 2001/03/05 : CIA-RDP82-00457R000900430009-0\n\nCONFIDENTIAL\n\n[ATTACHMENT 1 — MAP LEGEND. 항목 번호가 스캔에서 사라져 원문에 찍힌 차례대로만 옮긴다.]\n\nSoviet Army Jail.\n\n[판독 불가] OF WONSAN\n\nWonsan Airfield on Kalma (Katsuma) Peninsula.\n\nSoviet Naval Barracks.\n\nPart of Soviet Naval Port Area. One 1200 ton Soviet destroyer and one 3000 ton Soviet transport anchored here.\n\nPart of Soviet Naval Port Area. 420 men of Soviet Naval Guard Unit. 1 searchlight.\n\nPart of Soviet Naval Port Area. 100 men of North Korean Constabulary (Kyung Bi Dai).\n\n50 men of \"Soviet Naval Warehouse Guard Unit\"\n\nCity Hall. Soviet Naval Headquarters.\n\nWonsan Peace Preservation Office (Bo An Sur) Headquarters.\n\nRailway Office.\n\nRailway Station.\n\nWonsan Shipyard.\n\nFishing Port and Market Area.\n\nWonsan Peace Preservation Corps (Bo An Tai) Headquarters.\n\nSoviet Army Garrison Headquarters.\n\nWonsan Broadcasting Station.\n\nSoviet Army and Navy Officers' Billets.\n\nFormer Revenue Office Building. 140 men of Soviet Artillery Unit.\n\nSoviet Army Warehouse for Vehicles.\n\nSoviet Army Monument.\n\nCONFIDENTIAL\n[판독 불가] CONTROL U.S. OFFICIALS ONLY\n\nApproved For Release 2001/03/05 : CIA-RDP82-00457R000900430009-0", "notes": ["[삭제·공개 표시] Approved For Release 2001/03/05 : CIA-RDP82-00457R000900430009-0 (다섯 곳의 공개 승인 도장. 첫 면과 첫 면 하단은 연도 일부가 뭉개져 있다)", "[삭제·공개 표시] 25X1A (첫 면 INFO. 줄, 2면 소제목 아래)", "[삭제·공개 표시] 25X1X (1항 오른쪽 여백)", "[삭제·공개 표시] 25X1C (2항 JANIS 인용 안쪽)", "[삭제·공개 표시] 25X1[판독 불가] (첫 면 CONTROL 줄 오른쪽)", "[삭제·공개 표시] 2항·6항·9항의 JANIS 인용 앞에 붙은 출처 표시가 지워져 [삭제]로 옮겼다", "[삭제·공개 표시] Document No. [판독 불가] / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S C / DDA Memo, 4 Apr 77 (비밀해제 처리 도장)", "[삭제·공개 표시] REFERENCE CENTER LIBRARY (자료실 소인)"], "note": "네 면짜리 보고이고 2면부터 스캔이 크게 상해 있다. 2면과 3면의 문단 번호가 대부분 사라져 [판독 불가]로 두었다. 번호를 새로 매기지 않았다. 남아 있는 번호만 17, 20, 21, 22, 23, 24, 25다. 4항에서 참조하는 「제21항」은 원문에 `paragraph 21` 로 찍혀 있어 그대로 두었다. 병력 숫자 가운데 읽히지 않는 것은 채우지 않았다. 시내 소련 육군 병력은 `approximately SG` 로 찍혀 자릿수도 알 수 없다. 옛 세무서 건물의 포병 부대는 `24) men` 으로 찍혀 있는데 지도 범례에는 같은 자리를 140명이라 적었다. 두 값을 맞추지 않고 각각 원문대로 두었다. 창고의 차량 수는 `L120` 으로 찍혀 앞자리를 가릴 수 없다. 항만 구역의 소련 해군 경비대는 본문이 120명, 범례가 420명으로 서로 다르다. 이것도 맞추지 않았다. 항구의 배도 본문은 1800톤 구축함, 범례는 1200톤 구축함으로 다르다. 그대로 두었다. 6항의 JANIS 표 번호는 `Table XXV-2` 로 찍혀 있다. 2항의 `Table XIV-2` 와 어긋나나 문서번호에 준하는 것으로 보아 고치지 않았다. 좌표는 고치지 않았다. 원산 비행장 `(127-29, 39-10)` 과 옌안 `(109-27, 36-34)` 은 온전하다. 제목의 일본식 지명이 `Geiszaa` 로 뭉개져 있고 목록 제목에는 `G[ ]EISAN` 으로 남아 있다. 원산의 일본식 이름은 겐잔(元山)이나 원문이 확정되지 않으므로 채우지 않고 [판독 불가]로 두었다. 조선인 부대 이름은 원문의 로마자 표기를 앞세웠다. `Peace Preservation Offices (Bo An Sur)` 는 보안서, `Peace Preservation Corps (Bo An Dai)` 는 보안대, `North Korean Constabulary (Kyung Bi Dai)` 는 경비대다. 범례에서는 보안대가 `Ro An tai` 로 찍혀 Bo An Tai 로 읽었다. 뒤에 붙은 한자는 모두 뭉개져 [한자 판독 불가]로 두었다. 지도 범례는 항목 번호가 모두 사라졌고 「소련군 영창」 한 줄이 다른 항목보다 앞으로 밀려 찍혀 있다. 번호를 붙이지 않고 찍힌 차례대로 옮겼다. `Janis 75` 는 미 육해군 합동정보연구 제75호이며 조선을 다룬 권이다.", "warn": false, "search": "CHONG (원산 보안대 지휘관, 성만 적혀 있고 한자 뭉개짐) YI (원산 동해안경비대 파견대 지휘관, 성만 적혀 있고 한자 뭉개짐, 옌안에서 훈련) Approved For Release 2001/03/05 : CIA-RDP82-00457R000900430009-0 (다섯 곳의 공개 승인 도장. 첫 면과 첫 면 하단은 연도 일부가 뭉개져 있다) 25X1A (첫 면 INFO. 줄, 2면 소제목 아래) 25X1X (1항 오른쪽 여백) 25X1C (2항 JANIS 인용 안쪽) 25X1[판독 불가] (첫 면 CONTROL 줄 오른쪽) 2항·6항·9항의 JANIS 인용 앞에 붙은 출처 표시가 지워져 [삭제]로 옮겼다 Document No. [판독 불가] / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S C / DDA Memo, 4 Apr 77 (비밀해제 처리 도장) REFERENCE CENTER LIBRARY (자료실 소인) Military Information: Wonsan (Ge[판독 불가]san) Area"}, {"id": "N39", "order": 63, "date": "1947-09-26", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "정치 첩보: 북조선의 여론과 불만", "badge": "confidential control (U.S. OFFICIALS ONLY)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-09-26"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Political Information: Public Opinion and Discontent in North Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000900550011-4"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000900550011-4"}], "summary": "청진 일대 농민이 세금과 농산물 강제 매도에 반감을 품으나 드러내 항의하지는 않는다고 적었다. 7월 하순부터 북조선 전역에서 소요가 일어나 400명이 죽었다고 보고한다.", "points": ["청진(세이신) 일대 농민은 북조선의 현 공산정권을 지지하지 않으나 공공연히 항의하지는 않는다. 세금 정책과 농산물을 정부에 낮은 고정가로 팔게 하는 것에 반감이 크다.", "그러나 북조선 전역에서 15세부터 21세 사이의 젊은 층은 공산정권을 믿고 그 정책을 지지하기 시작한다고 본다. 세대가 갈린다는 관찰이다.", "7월 23일 무렵부터 북조선 전역에서 소요가 일어난다. 미소공동위원회에서 소련이 신탁통치에 대해 취한 태도에 항의하는 것이다.", "소요의 결과 조선인 400명이 죽고 1,000명이 다치고 10,000명이 붙잡혔다고 적었다.", "다섯 명이 넘는 모임에는 당국의 허가가 있어야 한다. 보고자는 그 당국이 조선 쪽인지 소련 쪽인지 확정하지 못하고 물음표를 달아 둔다.", "도시와 농촌이 구역으로 나뉘고 구역마다 당국이 지정한 책임자가 주민의 동태를 살핀다."], "primary": "공개 승인(Approved For Release) 2001/03/05 : CIA-RDP82-00457R00090[판독 불가]\n\n25X1A\n기밀 통제(CONFIDENTIAL CONTROL) 미국 관리 전용(U.S. OFFICIALS ONLY)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)  41338L\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가  조선(Korea)            일자(DATE):\n                          정보(INFO.)  [판독 불가]\n주제  정치 첩보: 북조선의 여론과 불만\n                          배포(DIST.)  [판독 불가] 1947년 9월\n출처(ORIGIN)              보충(SUPPLEMENT)\n\n청진(Chongjin, 일본식 Seishin 淸津) (129-29, 41-45) 일대의 농민들은 북조선의 현 공산정권을 지지하지 않으나 드러내 놓고 항의하지는 않는다. 이들은 정부의 조세 정책과 농산물의 많은 부분을 낮은 고정 가격으로 정부에 팔아야 하는 요구에 반감이 크다.\n\n그러나 대체로 북조선 전역의 젊은 층, 특히 15세에서 21세 사이의 사람들은 북조선의 공산정권을 믿고 그 정책을 지지하기 시작하고 있다.\n\n7월 23일 무렵부터 북조선 전역에서 소요가 있어 왔다. 미소공동위원회(United States - USSR Joint Commission on Korea)에서 소련이 신탁통치(trusteeship)에 대하여 취한 태도에 항의하는 것이다.  25X1X\n\n이 소요의 결과로 조선인 400명이 죽고 1,000명이 다치고 10,000명이 붙잡혔다.\n\n25X1X\n\n[판독 불가]\n\n북조선에서 다섯 명이 넘는 모임을 하려면 (조선? 소련?) 당국의 허가를 받아야 한다. 북조선의 도시와 농촌 지역은 구역으로 나뉘어 있고, 구역마다 당국이 책임자를 지정하여 그 구역 주민 전체의 활동을 가까이서 살핀다.\n\n문서번호(Document No.) [판독 불가]\n등급 변경 없음(NO CHANGE in Class.) [ ]\n[ ] 비밀해제(DECLASSIFIED)\n등급 변경(Class. CHANGED TO): TS S C\nDDA 각서, 1977년 4월 4일\n근거(Auth): DDA REG. 77/[판독 불가]\n일자: 1979년 4월 19일  담당: [판독 불가]\n\n이 문서에는 개정된 간첩법(Espionage Act, 50, U.S.C. 31 및 32)에서 정한 뜻에서 미합중국의 국방에 관련되는 정보가 들어 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방식으로든 알리는 것은 법으로 금지된다.\n\n등급 구분(CLASSIFICATION)  기밀(CONFIDENTIAL)", "secondary": "Approved For Release 2001/03/05 : CIA-RDP82-00457R00090[판독 불가]\n\n25X1A\nCONFIDENTIAL CONTROL U.S. OFFICIALS ONLY\n\nCENTRAL INTELLIGENCE GROUP  41338L\n\nINTELLIGENCE REPORT\n\nCOUNTRY  Korea            DATE:\n                          INFO.  [판독 불가]\nSUBJECT  Political Information: Public Opinion and Discontent in North Korea\n                          DIST.  [판독 불가] September 1947\nORIGIN                    SUPPLEMENT\n\nThe farmers in the Chongjin (Seishin) (129-29, 41-45) area do not approve of the present Communist government in North Korea but are making no open protest against it. They are bitter against the government's taxation policy and the requirement that they sell much of their farm produce to the government at low, fixed prices.\n\nHowever, in general, the younger people throughout North Korea, especially those between the ages of 15 and 21, are beginning to believe in the Communist government in North Korea and to support its policies.\n\nSince about 23 July, there has been rioting throughout North Korea in protest against the Soviet stand on trusteeship at the United States - USSR Joint Commission on Korea.  25X1X\n\nAs a result of these riots, 400 Koreans have been killed, 1,000 wounded and 10,000 arrested.\n\n25X1X\n\n[판독 불가]\n\nFor any meeting of more than five persons in North Korea permission must be obtained from the (Korean? Soviet?) authorities. The cities and rural areas of North Korea are divided into districts, with each district being assigned a leader by the authorities to keep a close check on the activities of all the residents of the district.\n\nDocument No. [판독 불가]\nNO CHANGE in Class. [ ]\n[ ] DECLASSIFIED\nClass. CHANGED TO: TS S C\nDDA Memo, 4 Apr 77\nAuth: DDA REG. 77/[판독 불가]\nDate: 19 APR 1979  By: [판독 불가]\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nCLASSIFICATION  CONFIDENTIAL", "notes": ["[삭제·공개 표시] Approved For Release 2001/03/05 : CIA-RDP82-00457R00090[판독 불가] (첫 줄의 공개 승인 도장. 문서번호 끝이 잘려 있다)", "[삭제·공개 표시] 25X1A (머리의 통제 줄 위)", "[삭제·공개 표시] 25X1X (소요를 적은 문단 옆, 그리고 그 아래 문단 옆)", "[삭제·공개 표시] 두 번째 25X1X 아래 한 줄이 지워졌거나 뭉개져 [판독 불가]로 옮겼다", "[삭제·공개 표시] Document No. [판독 불가] / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S C / DDA Memo, 4 Apr 77 / Auth: DDA REG. 77/[판독 불가] / Date: 19 APR 1979 (비밀해제 처리 도장)"], "note": "한 면짜리 보고다. 문단에 번호가 붙어 있지 않아 번호를 새로 매기지 않았다. 청진의 좌표가 이 문서에서는 `(129-29, 41-45)` 로 찍혀 있다. 같은 무렵의 다른 보고들은 `(129-49, 41-46)` 으로 적는다. 숫자를 맞추지 않고 원문대로 두었다. 주제 줄은 `se pata Siena area iene Opinion and` 로 심하게 뭉개져 목록의 제목을 따라 읽었다. 배포 일자의 앞자리도 뭉개져 있다. 머리의 `41338L` 은 보고 번호로 보이며 원문 그대로 옮겼다. 다섯 명 넘는 모임의 허가 주체를 적은 `(Kerean? Soviet?)` 는 보고자가 물음표를 단 그대로다. 풀지 않고 옮겼다. `Joint Commission on Korea` 는 미소공동위원회다. 원문 표기를 앞세웠다. 사상자 숫자 400, 1,000, 10,000 은 원문대로 두었다.", "warn": false, "search": "Approved For Release 2001/03/05 : CIA-RDP82-00457R00090[판독 불가] (첫 줄의 공개 승인 도장. 문서번호 끝이 잘려 있다) 25X1A (머리의 통제 줄 위) 25X1X (소요를 적은 문단 옆, 그리고 그 아래 문단 옆) 두 번째 25X1X 아래 한 줄이 지워졌거나 뭉개져 [판독 불가]로 옮겼다 Document No. [판독 불가] / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S C / DDA Memo, 4 Apr 77 / Auth: DDA REG. 77/[판독 불가] / Date: 19 APR 1979 (비밀해제 처리 도장) Political Information: Public Opinion and Discontent in North Korea"}, {"id": "N40", "order": 64, "date": "1947-09-26", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "항공 첩보: 청진(세이신) 일대", "badge": "confidential control (U.S. OFFICIALS ONLY)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-09-26"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Air Information: Chongjin (Seishin) Area", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000900550012-3"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000900550012-3"}], "summary": "청진과 나남 사이의 비행장에 단발기 여덟 대가 있고 그 가운데 셋이 일본제, 다섯이 소련제라고 적었다. 북조선 공군에는 아직 비행기가 없다고 보고한다.", "points": ["청진(세이신)과 나남(라난) 사이의 비행장에 단발기 여덟 대가 있다. 셋은 일본제이고 다섯은 소련제다. 해방 두 해 뒤에도 일본 비행기가 남아 있다는 뜻이다.", "JANIS 75호 표 IV-2의 기록을 나란히 붙인다. 청진 서쪽, 나남과 청진을 잇는 길의 북북서쪽에 비행장이 있다는 것이다.", "청진 일대에 소련 공군 병력 500명이 있고 지휘관은 대위다.", "북조선 공군은 청진에 비행기를 한 대도 가지고 있지 않으나 머지않아 들어올 것으로 본다.", "북조선 공군 대원들이 지금 예비 훈련을 받고 있다. 교관이 소련 사람인지는 보고자가 물음표를 달아 두었다."], "primary": "공개 승인(Approved For Release) 2001/03/05 : CIA-RDP82-00457R00090[판독 불가]\n\n기밀 통제(CONFIDENTIAL CONTROL) 미국 관리 전용(U.S. OFFICIALS ONLY)  25X1A\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n첩보보고(INTELLIGENCE REPORT)  113367\n국가  조선(Korea)            일자(DATE):\n                          정보(INFO.)  25X1A\n주제  항공 첩보: 청진(Chongjin, 일본식 Seishin 淸津) 일대\n                          배포(DIST.)  [판독 불가] 1947년 9월\n                          면수  1\n25X1A                     보충(SUPPLEMENT)\n출처(ORIGIN)\n\n25X1A\n\n1. [판독 불가]에 청진(Chongjin, 일본식 Seishin) (129-49, [판독 불가])과 나남(Nanam, 일본식 Ranan 羅南) (129-41, 41-42) 사이의 비행장에 단발기 여덟 대가 있었다. 이 가운데 세 대는 일본제였고 나머지 다섯 대는 소련제였다. ([삭제] JANIS 75호 표 IV-2에 따르면 청진 서쪽 [판독 불가]마일, 나남과 청진을 잇는 길의 북북서쪽 1마일 지점에 비행장이 있다.)\n\n2. 청진 일대에 소련 공군 병력 500명이 있다. [삭제] 이들의 지휘관은 대위다.\n\n3. 북조선 공군(North Korean Air Force) /_청진의?_/ 은 현재 비행기를 한 대도 가지고 있지 않다. 다만 머지않아 비행기를 쓸 수 있게 될 것으로 예상된다. 이 공군의 대원들은 지금 예비 [판독 불가] 훈련을 받고 있다 (소련 교관에게서?). [삭제]\n25X1C\n\n문서번호(Document No.) [판독 불가]\n등급 변경 없음(NO CHANGE in Class.) [ ]\n[ ] 비밀해제(DECLASSIFIED)\n등급 변경(Class. CHANGED TO): TS S C\nDDA 각서, 1977년 4월 4일\n근거(Auth): DDA REG. 77/1785\n일자: 1979년 4월 19일  담당: [판독 불가]\n\n이 문서에는 개정된 간첩법(Espionage Act, 50, U.S.C. 31 및 32)에서 정한 뜻에서 미합중국의 국방에 관련되는 정보가 들어 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방식으로든 알리는 것은 법으로 금지된다.\n\n등급 구분(CLASSIFICATION)  기밀 통제 미국 관리 전용\n\n공개 승인 2001/03/0[판독 불가]\n1947년 9월 29일 (SEP 29 1947 접수 도장)", "secondary": "Approved For Release 2001/03/05 : CIA-RDP82-00457R00090[판독 불가]\n\nCONFIDENTIAL CONTROL U.S. OFFICIALS ONLY  25X1A\nCENTRAL INTELLIGENCE GROUP\nINTELLIGENCE REPORT  113367\nCOUNTRY  Korea            DATE:\n                          INFO.  25X1A\nSUBJECT  Air Information: Chongjin (Seishin) Area\n                          DIST.  [판독 불가] September 1947\n                          PAGES  1\n25X1A                     SUPPLEMENT\nORIGIN\n\n25X1A\n\n1. On [판독 불가], there were eight single-engine airplanes on the airfield between Chongjin (Seishin) (129-49, [판독 불가]) and Nanam (Ranan) (129-41, 41-42). Three of these planes were of Japanese make; the other five were of Soviet make. ([삭제] According to Janis 75, Table IV-2, there is an airfield [판독 불가] miles W of Chongjin and one mile NNW of Nanam-Chongjin road.)\n\n2. There are 500 Soviet Air Force troops in the Chongjin area. [삭제] Their Commanding Officer is a captain.\n\n3. The North Korean Air Force /_in Chongjin?_/ has no airplanes at the present time; however, it is expected that airplanes will be available in the near future. Members of this air force are now receiving preliminary [판독 불가] training (from Soviet instructors?). [삭제]\n25X1C\n\nDocument No. [판독 불가]\nNO CHANGE in Class. [ ]\n[ ] DECLASSIFIED\nClass. CHANGED TO: TS S C\nDDA Memo, 4 Apr 77\nAuth: DDA REG. 77/1785\nDate: 19 APR 19[판독 불가]  By: [판독 불가]\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nCLASSIFICATION  CONFIDENTIAL CONTROL U.S. OFFICIALS ONLY\n\nApproved For Release 2001/03/0[판독 불가]\nSEP 29 1947", "notes": ["[삭제·공개 표시] Approved For Release 2001/03/05 : CIA-RDP82-00457R00090[판독 불가] (첫 줄과 마지막 줄의 공개 승인 도장. 문서번호 끝이 잘려 있다)", "[삭제·공개 표시] 25X1A (머리의 통제 줄, INFO. 줄, SUPPLEMENT 줄 왼쪽, 1항 위)", "[삭제·공개 표시] 25X1C (3항 아래)", "[삭제·공개 표시] 1항의 JANIS 인용 앞과 2항의 병력 서술 뒤, 3항의 훈련 서술 뒤에 지워진 자리가 있어 [삭제]로 옮겼다", "[삭제·공개 표시] Document No. [판독 불가] / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S C / DDA Memo, 4 Apr 77 / Auth: DDA REG. 77/1785 / Date: 19 APR 19[판독 불가] (비밀해제 처리 도장)", "[삭제·공개 표시] SEP 29 1947 (접수 도장)"], "note": "한 면짜리 보고다. 1항의 관측 일자가 `On |,»` 로 뭉개져 있어 채우지 않고 [판독 불가]로 두었다. 청진의 위도도 `il-t6` 으로 찍혀 판독되지 않는다. 같은 무렵의 다른 보고들은 `41-46` 으로 적으나 이 문서에서는 확정할 수 없으므로 채우지 않았다. 나남의 좌표 `(129-41, 41-42)` 는 온전하다. JANIS 인용의 거리도 `fir miles` 로 뭉개져 [판독 불가]로 두었다. 3항의 `/_in Chongjin?_/` 는 원문에 그어 넣은 삽입 표시와 물음표를 그대로 옮긴 것이다. 훈련 교관에 관한 `(from Soviet instructors?)` 도 보고자가 단 물음표 그대로다. 풀지 않았다. `Hanan (Ranan)` 은 나남(羅南)으로 읽었다. 머리의 `113367` 은 보고 번호로 보이며 원문 그대로 옮겼다. `North Korean Air Force` 는 원문 표기를 앞세웠다. 이 해에 이름이 바뀌는 중이라 오늘의 이름으로 바꾸지 않았다.", "warn": false, "search": "Approved For Release 2001/03/05 : CIA-RDP82-00457R00090[판독 불가] (첫 줄과 마지막 줄의 공개 승인 도장. 문서번호 끝이 잘려 있다) 25X1A (머리의 통제 줄, INFO. 줄, SUPPLEMENT 줄 왼쪽, 1항 위) 25X1C (3항 아래) 1항의 JANIS 인용 앞과 2항의 병력 서술 뒤, 3항의 훈련 서술 뒤에 지워진 자리가 있어 [삭제]로 옮겼다 Document No. [판독 불가] / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S C / DDA Memo, 4 Apr 77 / Auth: DDA REG. 77/1785 / Date: 19 APR 19[판독 불가] (비밀해제 처리 도장) SEP 29 1947 (접수 도장) Air Information: Chongjin (Seishin) Area"}, {"id": "N41", "order": 65, "date": "1947-09-26", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "경제 첩보: 청진의 식량 사정과 물가", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-09-26"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Economic Information: Food Conditions and Commodity Prices in Chongjin", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000900560002-3"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000900560002-3"}], "summary": "청진에서 쌀과 옥수숫가루가 몹시 모자라고 사람들이 콩깻묵을 주식으로 삼는다고 적었다. 옥수숫가루를 먹으면 상류층으로 여겨진다는 말과 함께 세 품목의 값을 붙였다.", "points": ["청진 일대에 쌀과 옥수숫가루 같은 주식이 몹시 모자란다.", "생선과 해산물은 흔하고 싸다. 그해 어획이 특히 좋았기 때문이다.", "청진 사람들의 주식은 콩깻묵이다. 옥수숫가루를 먹는 사람은 「상류층」으로 여겨진다고 적었다.", "가난한 사람들이 청진 일대의 소나무 껍질을 벗겨 먹었다.", "값은 옥수숫가루 1두에 1300~1400원, 쌀 1두에 1900원, 콩깻묵 한 덩이에 1100원이다."], "primary": "공개 승인(Approved For Release) 2003/08/07 : CIA-RDP82-00457R000900560002-3\n기밀(CONFIDENTIAL)\n25X1\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가  조선(Korea)            일자(DATE):  [판독 불가]\n                          정보(INFO.)\n주제  경제 첩보: 청진의 식량 사정과 물가\n                          배포(DIST.)  1947년 9월 28일\n                          면수  1\n                          보충(SUPPLEMENT)\n출처(ORIGIN)  25X1\n\n[판독 불가]\n\n배포처(DISTRIBUTION)\n\n1. 청진(Chongjin, 일본식 Seishin 淸津) (129-49, 41-46) 일대에는 쌀과 옥수숫가루 같은 주식이 몹시 모자란다.\n\n2. 그러나 생선을 비롯한 해산물은 흔하고 값이 싸다. 올해가 어민들에게 특히 좋은 해였기 때문이다.\n\n3. 청진 사람들의 주된 주식은 콩깻묵(bean cake)이다. 옥수숫가루를 먹을 수 있는 사람은 누구나 「상류층」으로 여겨진다.\n\n4. 청진의 가난한 사람들 가운데 다수가 청진 일대의 소나무 껍질을 벗겨 식량으로 써 왔다.\n\n5. 청진의 물가:\n\n품목            단위        값\n옥수숫가루      1 Tu        1300~1400 Won\n쌀              1 Tu        1900 Won\n콩깻묵          1 Cake      1100 Won\n\n25X1  25X1\n25X1\n\n이 문서에는 개정된 간첩법(Espionage Act, 50, U.S.C. 31 및 32)에서 정한 뜻에서 미합중국의 국방에 관련되는 정보가 들어 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방식으로든 알리는 것은 법으로 금지된다.\n\n문서번호(Document No.) [판독 불가]\n등급 변경 없음(NO CHANGE in Class.) [ ]\n[ ] 비밀해제(DECLASSIFIED)\n등급 변경(Class. CHANGED TO): TS [판독 불가]\nDDA 각서, 1977년 4월 4일\n근거(Auth): DDA REG. 77/[판독 불가]\n\n기밀(CONFIDENTIAL)\n\n등급 구분(CLASSIFICATION)  [판독 불가]\n\n자료실(REFERENCE CENTER) [판독 불가]\n\n공개 승인 2003/08/07 : CIA-RDP82-00457R000900560002-3", "secondary": "Approved For Release 2003/08/07 : CIA-RDP82-00457R000900560002-3\nCONFIDENTIAL\n25X1\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCOUNTRY  Korea            DATE:  [판독 불가]\n                          INFO.\nSUBJECT  Economic Information: Food Conditions and Commodity Prices in Chongjin\n                          DIST.  28 September 1947\n                          PAGES  1\n                          SUPPLEMENT\nORIGIN  25X1\n\n[판독 불가]\n\nDISTRIBUTION\n\n1. In the Chongjin (Seishin) (129-49, 41-46) area there is an acute shortage of such staple foods as rice and cornmeal.\n\n2. Fish and other sea food, however, are plentiful and cheap, because this has been an especially good year for the fishermen.\n\n3. The main staple food of the people in Chongjin is bean cake. Anyone having cornmeal to eat is regarded as \"upper class\".\n\n4. Many of the poor people in Chongjin have skinned the bark off pine trees in the Chongjin area and have used it for food.\n\n5. Commodity Prices in Chongjin:\n\nCommodity      Unit        Price\nCornmeal       1 Tu        1300-1400 Won\nRice           1 Tu        1900 Won\nBean Cake      1 Cake      1100 Won\n\n25X1  25X1\n25X1\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nDocument No. [판독 불가]\nNO CHANGE in Class. [ ]\n[ ] DECLASSIFIED\nClass. CHANGED TO: TS [판독 불가]\nDDA Memo, 4 Apr 77\nAuth: DDA REG. 77/[판독 불가]\n\nCONFIDENTIAL\n\nCLASSIFICATION  [판독 불가]\n\nREFERENCE CENTER [판독 불가]\n\nApproved For Release 2003/08/07 : CIA-RDP82-00457R000900560002-3", "notes": ["[삭제·공개 표시] Approved For Release 2003/08/07 : CIA-RDP82-00457R000900560002-3 (첫 줄과 마지막 줄의 공개 승인 도장)", "[삭제·공개 표시] 25X1 (머리의 기밀 표시 옆, ORIGIN 줄, 물가표 아래 세 곳)", "[삭제·공개 표시] ORIGIN 줄 아래 정보원을 적은 자리가 판독되지 않아 [판독 불가]로 옮겼다", "[삭제·공개 표시] Document No. [판독 불가] / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS [판독 불가] / DDA Memo, 4 Apr 77 / Auth: DDA REG. 77/[판독 불가] (비밀해제 처리 도장)", "[삭제·공개 표시] REFERENCE CENTER [판독 불가] (자료실 소인)"], "note": "한 면짜리 보고이고 본문은 비교적 잘 읽힌다. 값과 단위는 원문대로 두었다. `1 Tu` 는 되나 말을 옮긴 음역으로 보이나 확정할 수 없어 풀지 않고 그대로 두었다. 쌀 값의 단위는 원문에 `1900 Wen` 으로 찍혀 있어 Won 으로 읽었다. 낱말 철자의 오독으로 보았다. 숫자 1300~1400, 1900, 1100 은 고치지 않았다. 4항의 항목 번호가 스캔에서 사라져 있으나 앞뒤가 1, 2, 3, 5로 이어지므로 4를 넣었다. 물가표 아래 세 줄은 간첩법 문구가 물가표와 겹쳐 찍힌 것이며 읽히는 대로 옮겼다. 청진의 좌표 `(129-49, 41-46)` 은 온전하다. 이 문서철에서 청진 좌표가 온전하게 남은 몇 안 되는 예다. 문서 머리에 U.S. OFFICIALS ONLY 표시가 보이지 않아 classification 은 confidential 로만 적었다.", "warn": false, "search": "Approved For Release 2003/08/07 : CIA-RDP82-00457R000900560002-3 (첫 줄과 마지막 줄의 공개 승인 도장) 25X1 (머리의 기밀 표시 옆, ORIGIN 줄, 물가표 아래 세 곳) ORIGIN 줄 아래 정보원을 적은 자리가 판독되지 않아 [판독 불가]로 옮겼다 Document No. [판독 불가] / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS [판독 불가] / DDA Memo, 4 Apr 77 / Auth: DDA REG. 77/[판독 불가] (비밀해제 처리 도장) REFERENCE CENTER [판독 불가] (자료실 소인) Economic Information: Food Conditions and Commodity Prices in Chongjin"}, {"id": "N42", "order": 66, "date": "1947-09-29", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "군사 첩보: 북조선에서의 소련군 병력과 물자 이동", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-09-29"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Soviet Troop and Materiel Movements in North Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000900560001-4"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000900560001-4"}], "summary": "1947년 6월 청진을 지나거나 청진에 드나든 소련군 병력과 물자의 이동을 여덟 건으로 적었다. 소총과 탄약이 인민군에 넘어간다는 소문을 함께 전한다.", "points": ["6월 한 달 청진을 축으로 한 이동만 여덟 건이다. 평양, 나진동, 회령, 나남, 함흥이 오간 곳이다.", "6월 19일 여섯 량짜리 열차가 청진을 지난다. 소총 3000정, 탄약 8000상자, 소련 병사 500명, 조선 병사 300명이 실려 있었다.", "그 총과 탄약이 평양에서 북조선 인민군(North Korea People's Army)에 넘겨질 것이라는 소문이 있었다고 적었다.", "6월 14일에는 약 3000명이 나진동(라신) 일대를 떠나 평양으로 간다. 같은 날 약 500명이 차량으로 청진을 지나 회령으로 향한다.", "6월 24일 함흥의 포병 부대 병사 500명이 청진으로 옮긴다. 같은 달 24일께 함흥에서 소련군의 것으로 보이는 6×6 화물차 여러 대가 무개차에 실리는 것이 목격된다.", "조선인 병사가 소련군 열차에 함께 타고 있다는 대목이 이 보고의 핵심이다. 병력을 넘기는 일이 진행되고 있다는 뜻이다."], "primary": "공개 승인(Approved For Release) 2003/08/07 : CIA-RDP82-00457R000900560001-4\n\n기밀(CONFIDENTIAL)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n첩보보고(INTELLIGENCE REPORT)\n\n25X1\n\n국가  [판독 불가]        일자(DATE):  25X1[판독 불가]\n                          정보(INFO.)\n주제  군사 첩보: 북조선에서의 소련군 병력과 물자 이동\n                          배포(DIST.)  [판독 불가] 1947년 9월\n                          면수  1\n                          보충(SUPPLEMENT)\n25X1\n출처(ORIGIN)  [삭제]\n\n1. 6월 [판독 불가]일, [판독 불가] 소련 보병 150명이 평양(Pyongyang, 일본식 Heijo 平壤) (125-44, 39-01)에서 오는 열차로 청진(Chongjin, 일본식 Seishin 淸津) [삭제]에 도착하였다.\n\n2. 6월 14일, 소련군 약 3000명이 나진동(Najindong, 일본식 Rashin 羅津) (130-15, 42-10) 일대를 떠나 평양으로 갔다.\n\n3. 6월 19일, 여섯 량으로 이루어진 열차가 [판독 불가]로 가는 길에 청진을 지나갔다. 열차에는 소총 3000정, 탄약 8000상자, 소련 병사 500명, 조선 병사 300명이 실려 있었다. 그 [판독 불가]과 탄약이 평양[판독 불가] 북조선 인민군(North Korea People's Army)에 넘겨질 것이라는 소문이 있었다.\n\n4. 6월 14일, 소련군 약 500명이 [판독 불가]에서 [판독 불가]편으로 청진을 지나 이동하였다. 목적지는 회령(Hoeryong, 일본식 Kainei 會寧) (129-45, 42-22[판독 불가])이었다.\n\n5. 6월 [판독 불가]일, 소련 병사 약 300명으로 이루어진 부대가 청진을 떠나 나남(Nanam, 일본식 Ranan 羅南) (129-41, 41-42)으로 갔다. 이 부대는 구경 약 3인치의 화포 두 문을 가지고 있었다.\n\n6. 6월 17일, 소련 병사 약 300명이 나진동 일대에서 지프와 화물차 편으로 청진에 도착하였다.\n\n7. 6월 24일, 함흥(Hamhung, 일본식 Kanko 咸興) (127-32, 39-54)에 있던 포병 부대의 병사 500명이 청진으로 옮겨졌다.\n\n8. 6월 2[판독 불가]일 또는 그 무렵, (?? 소련군의) 6 × 6 화물차 여러 대가 함흥에서 무개화차에 실리는 것이 [삭제] 목격되었다.\n\n이 문서에는 개정된 간첩법(Espionage Act, 50, U.S.C. 31 및 32)에서 정한 뜻에서 미합중국의 국방에 관련되는 정보가 들어 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방식으로든 알리는 것은 법으로 금지된다.\n\n문서번호(Document No.) [판독 불가]\n등급 변경 없음(NO CHANGE in Class.) [ ]\n[ ] 비밀해제(DECLASSIFIED)\n등급 변경(Class. CHANGED TO): TS S C\nDDA 각서, 1977년 4월 4일\n근거(Auth): [판독 불가]\n일자: [판독 불가]\n등급 구분(CLASSIFICATION)  기밀(CONFID[판독 불가])\n25X1\n25X1\n\n자료실(REFERENCE CENTER) [판독 불가]\n\n공개 승인 2003/08/07 : CIA-RDP82-004[판독 불가]00900560001-4", "secondary": "Approved For Release 2003/08/07 : CIA-RDP82-00457R000900560001-4\n\nCONFIDENTIAL\n\nCENTRAL INTELLIGENCE GROUP\nINTELLIGENCE REPORT\n\n25X1\n\nCOUNTRY  [판독 불가]        DATE:  25X1[판독 불가]\n                          INFO.\nSUBJECT  Military Information: Soviet Troop and Materiel Movements in North Korea\n                          DIST.  [판독 불가] September 1947\n                          PAGES  1\n                          SUPPLEMENT\n25X1\nORIGIN  [삭제]\n\n1. [판독 불가] June, [판독 불가] 150 Soviet infantry troops arrived in Chongjin (Seishin) [삭제]
