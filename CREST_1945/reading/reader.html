al): PAK Yong-chun 박영준([한자 판독 불가]). Nanking 난징(南京)의 한국대표단 위원장인 PAK Sun 박순의 아들이다.\n\n정보과장(Chief of the Information Section): HO U-song 허우성([한자 판독 불가])\n\n작전과장(Chief of the Operations Section): CHONG Chung-[판독 불가] 정중[판독 불가]([한자 판독 불가]). 1947년 8월에 CHANG Chin 장진([한자 판독 불가])이 이 과의 과장이 되었다.\n\n훈련과장(Chief of the Training Section): CH'OE Hyok-chu 최혁주([한자 판독 불가]). 한국자위군(Korean Self Defense Army) 한 대대의 지휘관이다.\n\n총무과장(Chief of the General Affairs Section): YI Si-ch'an 이시찬([한자 판독 불가]). 1947년 8월에 KIM In-ki 김인기([한자 판독 불가])가 이 과의 과장이 되었다.\n\n[여백에 겹쳐 찍힌 도장 조각] [판독 불가] from the [판독 불가] the United States. [판독 불가] 재검토 일자(Review Date): 2008\n\n[세로로 겹쳐 찍힌 도장 한 단 [판독 불가]]\n\n2. 만주의 한국독립당 당원 명부에는 약 200명의 이름이 올라 있다. 한국독립당 안에는 세 갈래가 있다:\n\na. 친중 조선인.\n\nb. 1903년에 조선을 떠난 이주 조선인으로 대개 농민이며, 1919년에 조선을 떠나 만주에 사는 조선인으로 대개 보수파다.\n\nc. 친일파와 한때의 부역자, 그리고 일정 수의 기회주의자와 파렴치한 자들이다.\n\n3. 1947년 2월 이래 한국독립당은 펑톈에서 월간지 Kon Kuk 건국([한자 판독 불가])을 발행하고 있다.\n\n이 문서는 개정된 간첩법(Espionage Act) 미국법전 제50편 31조 및 32조에서 정한 뜻의 미국 국방에 관한 정보를 담고 있다. 그 전달 또는 [판독 불가]\n\n25X1X7", "secondary": "25X1A2g\n\nApproved For Release [판독 불가] 0830006-7\n\nSO_/9325\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT 126347\n\nCOUNTRY  China                DATE:  25X1A6a\nINFO.\n\nSUBJECT  Political Information: The Korean Independence\nParty in Manchuria        DIST.  [판독 불가] November 1947\n\nPAGES  1\n\n25X1A6a\n25X1X6\n\nORIGIN        SUPPLEMENT\n\n1. The Korean Independence Party (KIP) was organized by the Korean Representative Group (KRG) in China. The headquarters of the KIP in Manchuria is in Mukden. The leading personnel of the KIP in Manchuria include:\n\nChairman: KIM Hak-kyu ([한자 판독 불가]), also vice chairman of the KRG in Manchuria.\n\nSecretary General: PAK Yong-chun ([한자 판독 불가]), son of PAK Sun, chairman of the KRG in Nanking.\n\nChief of the Information Section: HO U-song ([한자 판독 불가])\n\nChief of the Operations Section: CHONG Chung-[판독 불가] ([한자 판독 불가]); in August 1947 CHANG Chin ([한자 판독 불가]) became chief of this section.\n\nChief of the Training Section: CH'OE Hyok-chu ([한자 판독 불가]), commanding officer of a battalion of the Korean Self Defense Army.\n\nChief of the General Affairs Section: YI Si-ch'an ([한자 판독 불가]); in August 1947 KIM In-ki ([한자 판독 불가]) became chief of this section.\n\n[여백에 겹쳐 찍힌 도장 조각] [판독 불가] from the [판독 불가] the United States. [판독 불가] Review Date: 2008\n\n[세로로 겹쳐 찍힌 도장 한 단 [판독 불가]]\n\n2. The KIP party list in Manchuria has approximately 200 names. There are three elements within the KIP:\n\na. Pro-Chinese Koreans.\n\nb. Emigrant Koreans who left Korea in 1903 and are mostly farmers, and Koreans who left Korea in 1919 to live in Manchuria and are mostly conservatives.\n\nc. Pro-Japanese, one-time collaborators, together with a certain number of opportunists and unscrupulous individuals.\n\n3. Since February 1947, the KIP has published a monthly magazine, Kon Kuk ([한자 판독 불가]), in Mukden.\n\n[This doc]ument contains information affecting the national defense of the United States within the meaning of the Espionage [Act, 50] U.S.C. 31 and 32 as amended. Its transmission or [판독 불가]\n\n25X1X7", "notes": ["[삭제·공개 표시] Approved For Release : CIA-RDP82-00457R001000830006-7 (첫 면 머리의 공개 승인 도장. 앞부분이 뭉개져 뒤의 0830006-7 만 읽힌다)", "[삭제·공개 표시] 25X1A2g (첫 면 머리의 면제 표시)", "[삭제·공개 표시] 25X1A6a (DATE 줄과 ORIGIN 줄 위)", "[삭제·공개 표시] 25X1X6 (ORIGIN 줄 위)", "[삭제·공개 표시] 25X1X7 (마지막 줄)", "[삭제·공개 표시] ORIGIN 줄과 SUPPLEMENT 줄의 내용이 비어 있다", "[삭제·공개 표시] 여백에 겹쳐 찍힌 비밀해제 도장 조각. Review Date: 2008 만 읽힌다"], "note": "한 면짜리 짧은 보고이나 스캔에 세로로 겹쳐 찍힌 도장이 본문 가운데를 갈라 놓아 간부 명단이 여러 토막으로 흩어져 있다. 순서를 원문의 세로 배열대로 되살렸다. 겹쳐 찍힌 도장 한 단은 낱자만 남아 판독되지 않는다. 인명 뒤의 한자가 모두 뭉개져 한 글자도 확정되지 않아 [한자 판독 불가]로 두었다. 로마자를 앞세우고 한국어를 병기했다. 원문에 PAK Sim, chairman of the KEG in Hering 으로 찍힌 대목은 같은 계열의 N59 가 PAK Sun, Chairman of the Korean Representative Group in Nanking 이라 적고 있어 PAK Sun 과 Nanking 으로 읽었다. 낱말과 사람 이름의 철자를 바로잡는 범위다. 작전과장 이름은 CHONG Chung aie 로 찍혀 끝 음절을 가릴 수 없어 [판독 불가]로 두었다. Korean Self Defense Army 는 원문 표기를 그대로 두었다. 당원 수 약 200명과 이주 연도 1903년, 1919년은 고치지 않았다. 같은 계열의 N59 는 1903년과 1913년이라 적어 연도가 서로 어긋난다. 각 문서가 적은 대로 두었다. 첩보보고 번호는 126347 이고 왼쪽 위의 SO_/9325 도 그대로 옮겼다. 배포 일자 줄은 November 1947 만 읽히고 날짜 숫자는 뭉개져 [판독 불가]로 두었다. 국가 항목이 Korea 가 아니라 China 로 되어 있다. 원문대로 두었다. 본문에 비밀등급 낱말이 남아 있지 않아 classification 은 null 로 두었다. Kon Kuk 은 건국이며 한자가 뭉개져 짓지 않았다.", "warn": false, "search": "KIM Hak-kyu 김학규 (만주 한국독립당 위원장, 만주 한국대표단 부위원장) PAK Yong-chun 박영준 (한국독립당 총무장, PAK Sun 박순의 아들) PAK Sun 박순 (난징 한국대표단 위원장) HO U-song 허우성 (정보과장) CHONG Chung-[판독 불가] 정중[판독 불가] (전 작전과장) CHANG Chin 장진 (1947년 8월부터 작전과장) CH'OE Hyok-chu 최혁주 (훈련과장, 한국자위군 대대장) YI Si-ch'an 이시찬 (전 총무과장) KIM In-ki 김인기 (1947년 8월부터 총무과장) Approved For Release : CIA-RDP82-00457R001000830006-7 (첫 면 머리의 공개 승인 도장. 앞부분이 뭉개져 뒤의 0830006-7 만 읽힌다) 25X1A2g (첫 면 머리의 면제 표시) 25X1A6a (DATE 줄과 ORIGIN 줄 위) 25X1X6 (ORIGIN 줄 위) 25X1X7 (마지막 줄) ORIGIN 줄과 SUPPLEMENT 줄의 내용이 비어 있다 여백에 겹쳐 찍힌 비밀해제 도장 조각. Review Date: 2008 만 읽힌다 Political Information: The Korean Independence Party in Manchuria"}, {"id": "N59", "order": 82, "date": "1947-11-12", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "정치 첩보: 만주의 한국대표단", "badge": "confidential (1978년 10월 서한에 따라 재분류된 도장이 첫 면에 겹쳐 있다)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-11-12"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Political Information; The Korean Representative Group in Manchuria", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r001000850006-5"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r001000850006-5"}], "summary": "만주 한국대표단의 간부, 연혁, 자금줄, 내부 구성을 적고 그 뒤에 이 단체를 실제로 움직인다는 여성 이보은과 그 주변 인물의 신상과 만주국 시절 이력을 길게 붙였다.", "points": ["펑톈 한국대표단 위원장은 YI Kwang 이광이고 부위원장 KIM Hak-kyu 김학규는 펑톈 한국독립당 위원장을 겸한다. 앞 문서 N58과 인물이 겹친다.", "김구가 떠난 뒤 중국의 임시정부가 해산되자 중국국민정부가 박순을 세워 난징에 본부를 둔 한국대표단을 만들었다고 적었다.", "중국국민정부가 매달 자금을 대고 국민당과 국방부 제2청(BIS)에서도 자금이 들어온다. 금액은 원문에 US54500 으로 찍혀 있다.", "한국대표단이 조선인보다 중국인에게 이익이 된다고 본다. 1946년 베이핑, 톈진, 상하이에서 조선인 소유 재산을 적산으로 몰수하는 데 협력한 것을 근거로 든다.", "친중 세력이 지원한 흥아단이 부역자 재산 몰수를 내걸었으나 부역하지 않은 자의 재산까지 빼앗고 조선인 46명을 죽였다. 왕일서 장군이 1946년 여름에 해산시킨다.", "실제 통제자를 여성 이보은으로 지목한다. 매달 자금을 대며 그 돈은 NECC G2 과장이던 원강 장군에게서 나온다고 적었다. 원 장군을 펑톈의 아편 공장 두 곳과 연결짓는다.", "이보은은 난징 한국대표단 위원장 박순의 양녀이고 36세, 평양 출신이다. 주소와 동거인까지 적혀 있다.", "이보은과 최등학이 김구 계열과 김도명이 이끄는 이른바 공산주의자 집단 양쪽에 걸쳐 있다고 본다. 뒤의 집단은 좌익 조직을 통해 남조선과, 만주 중국공산당을 통해 북조선과 이어진다.", "김도명 형제의 일본 이름과 만주국 시절 행적, 이보은이 일본 헌병대원의 첩이었다는 대목까지 신상을 캔다. 부역 이력으로 인물을 재는 이 해의 방식이 드러난다."], "primary": "25X1A2g\n\n국가  중국(China)                일자(DATE):  25X1A6a\n정보(INFO.)\n\n주제  정치 첩보: 만주의 한국대표단(The Korean Representative\nGroup in Manchuria)        배포(DIST.)  1947년 11월 [판독 불가]일\n\n면수  3\n\n[이] 문서는 이로써 다음으로 재분류된다\n\n25X1A6a   기밀(CONFIDENTIAL). 다음에 따른다\n\n출처(ORIGIN)   [판독 불가] 1978년 10월 [판독 불가]자 [판독 불가]의 서한   보충(SUPPLEMENT)\n\n25X1X6\n\n25X1A[판독 불가]   [판독 불가] 한국대표단에 관한 이전 보고들.\n\n만주 한국대표단(KRG)의 주요 인사, 펑톈\n\n3 [원문 그대로] 펑톈(Mukden 奉天)의 한국대표단(Korean Representative Group, KRG) 주요 인사는 다음과 같다:\n\n위원장: YI Kwang 이광([한자 판독 불가])\n\n부위원장: KIM Hak-kyu 김학규([한자 판독 불가]). 펑톈 한국독립당(Korean Independence Party)의 위원장이기도 하다.\n\n[판독 불가]\n\n[판독 불가]: CHANG Chin 장진([한자 판독 불가]). 가명은 CHANG Kyon-kun 장견군([한자 판독 불가])이다.\n\n총무[판독 불가](of General Affairs): KYE Sung-un 계승은([한자 판독 불가])\n\n구호행정[판독 불가](of Relief Administration): KYE Sung-[판독 불가] 계승[판독 불가]\n\n민사[판독 불가](of Civil Affairs): YI Kyu-tong 이규동([한자 판독 불가])\n\n한국대표단의 [연]혁\n\n위원장 KIM Koo 김구([한자 판독 불가])가 떠난 뒤 중국의 대한민국임시정부(Korean Provisional Government)가 해산되자, 중국국민정부(Chinese National Government)는 김구의 [판독 불가] 가운데 한 사람인 PAK Sun 박순([한자 판독 불가])을 [판독 불가] 중국 내 대표단으로 [판독 불가] 하였고 본부는 난징(Nanking 南京)에 두었다.\n\n한국대표단은 박순 아래 결성되어 중국 내 조선인 사무를 정치, 경제, 문화에 걸쳐 관장하였다. 중국국민정부가 한국대표단에 재정을 대며, 매달 미화 US54500 [원문 그대로]에 해당하는 금액을 준다. 이 금액 외에도 한국대표단은 국민당(Kuomintang)과 BIS(MND) [국방부 제2청]으로부터 일정한 자금을 받는다.\n\n3. 한국대표단은 중국국민정부 행정 기관들에 딸린 하부 기관에 지나지 않으며, 중국 내 조선인보다 중국인에게 이익이 된다. [판독 불가] 중국인에게 돌아가는 이익은 한국대표단이 [판독 불가] 국민정부와 협력하여 조선인이 소유한 「적산(enemy property)」을 몰수한 것이다. 조선인 소유 재산의 몰수는 1946년 중에 베이핑(Peiping 北平), 톈진(Tientsin 天津), 상하이(Shanghai 上海)에서 일어났다. 중국국민정부는 모든 조선인 문제의 해결을 조선인 사회단체나 협회가 아니라 한국대표단에 의존한다.\n\n4. 한국대표단은 만주 대부분에 지부를 두었다. 이 지부들은 중국국민정부의 보조 기관 노릇을 한다. 조선인거류민회(Korean Residents Association), 여러 조선인 개신교 단체, 중한문화협회(Sino-Korean Cultural Association)가 만주 조선인 사이의 주요 단체다.   25X1X7\n\n비밀등급(CLASSIFICATION) 기밀(CONFIDENTIAL)\n\n문서번호(Document No.) [판독 불가]\n\n[판독 불가]\n\n공개 승인(Approved For Release) [판독 불가]\n25X1X7\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)   25X1A6a\n\n-2-\n\n5. 한국대표단 안에는 두 부류의 사람이 있다. (a) 친중 세력과 1903년, 1913년에 조선을 떠난 만주의 옛 조선인 거류민. (b) 전에 일본에 부역한 자와 친일파로, 현재 한국대표단을 보호막으로 쓰고 있는 자들이다. 이 두 부류 모두에 기회주의자와 파렴치한 분자가 들어 있다.\n\n6. 한국대표단의 친중 세력은 한때 흥아단(Hing A Tan)([한자 판독 불가])을 지원하였다. 흥아단은 일본에 부역한 조선인이 소유한 재산의 몰수를 실행하려고 만들어진 단체다. 그러나 이 단체는 부역하지 않은 자의\n\n25X1A2g   재산까지 몰수하였고 조선인 46명을 죽였다. WANG Il-so 왕일서 장군([한자 판독 불가])(왕 장군의 활동에 관한 보고는 [판독 불가] 참조)이 이 단체를 해산시키고 그 구성원을 체포하는 데 결정적 구실을 하였으며, 그 과정에서 왕의 부하 두 명이 흥아단 단원에게 살해되었다. 그때 왕 장군은 주석 동북행원(President's Northeast Field Headquarters)의 한교사무처(Korean Administrative Department) 처장이었다. 위에 적은 일들은 1946년 여름에 일어났다. 흥아단 안의 친일 세력은 흥아단이 해산된 직후 한국대표단에 들어갔다.\n\n7. 한국대표단이 조선인의 이익에 헌신하는 단체라기보다 중국국민정부에 대한 특무 기관에 가깝게 움직이기 때문에, 조선인들 자신은 한국대표단에 의지하지 않고 자기 문제를 스스로 풀려 한다.\n\nYI Po-un 이보은, CH'OE Tung-hak 최등학, KIM To-myong 김도명\n\n8. 한국대표단은 실제로는 한 여자가 통제한다. YI Po-un 이보은([한자 판독 불가])이며 가명은 YI Mi-yong 이미용([한자 판독 불가])이다. 그는 재정 후원을 통하여 한국대표단을 통제하며 매달 NEC$1,9000,000 [원문 그대로]을 댄다. 이보은의 재정 지원은 1947년 9월 5일까지 NECC G2 과장이던 WEN Ch'iang 원강 장군과 이름을 알 수 없는 다른 고위 장교 두 명에게서 나온다. 원 장군은 펑톈의 아편 공장 두 곳과 연결되어 있다고 전한다.\n\n9. 이보은은 난징 한국대표단 위원장인 PAK Sun 박순(PAK Ch'an-ik 박찬익 [한자 판독 불가], PAK Nam-pa 박남파 [한자 판독 불가]로도 알려져 있다)의 양녀다. 나이는 36세이고 평양(Pyongyang, Heijo) 출신이다. 현주소는 펑톈 베이스구(Pei Shih District) 캉타이가(K'ang T'ai Street) 2단 27호다. 이보은은 조선인 CH'OE Tung-hak 최등학([한자 판독 불가]), 가명 CH'OE Kae-sok 최개석([한자 판독 불가])과 박순의 아들 PAK Yong-chun 박영준([한자 판독 불가])과 함께 살고 있다. 최등학은 조선 함경남도(Hamgyong Namdo) 이원(Iwon, Rigen) 출신이며, 일본의 만주 점령기에 만주국 정부에서 높은 관직에 있었다. 현재는 무직이다. 1947년 초에 최등학은 서울에 다녀왔고 만주로 돌아온 뒤 최근에 하얼빈(Harbin)과 창춘(Changchun 長春)에 다녀왔는데 이유는 알 수 없다. 이보은은 1947년 6월 말 비행기로 난징을 떠나 펑톈으로 돌아왔다. 난징에 간 이유는 알 수 없다.\n\n40 [원문 그대로]. 이보은과 최등학은 서로 다른 두 조선인 집단에 걸쳐 있다. (a) 중국의 한국대표단으로, 친중 성향이며 KIM Koo 김구 및 옛 충칭(Chungking) 대한민국임시정부의 그 동료들과 이어져 있는데 이들 대부분은 지금 조선에 있다. (b) 파렴치한 전 친일 세력, 기회주의자, 그리고 이보은의 사촌으로 현재 서울에 있는 KIM To-myong 김도명이 이끄는 이른바 공산주의자들이다. 이 집단은 좌익 정치 조직과의 연결을 통하여 남조선과 직접 연락을 유지한다. 또한 만주의 중국공산당을 통하여 북조선 및 중국공산군이 장악한 만주와도 연락선을 가지고 있다.\n\n42 [원문 그대로]. 일본 점령기 이보은의 이력은 만주국의 일본인 유력자들과의 부역의 이력이다. 이보은은 일본 점령 당시 사촌인 KIM To-myong 김도명([한자 판독 불가])과 가까웠는데, 김의 일본 이름은 TAKAYAMA Domio 다카야마 도미오([한자 판독 불가])였다. 김은 한때 만주국 정부의 중요한 관리였고 나중에 「자칭」 공산주의자가 되었다. 김에게는 형이 둘 있었고 일본 이름은 TAKAYAMA Michiaya 다카야마 미치아야([한자 판독 불가])와 TAKAYAMA Michitake 다카야마 미치타케([한자 판독 불가]) 또는 TAKAYAMA Michine 다카야마 미치네([한자 판독 불가])였다. 이보은은 김 형제와 가까웠고 이들을 통하여 만주국 최고위 인물들과 널리 안면을 텄다. 전쟁 중에는 일본 헌병대(Japanese Gendarmerie)의 한 사람인 HIROTA 히로타([한자 판독 불가])의 첩이었다. 이보은은 이 무렵 부유한 여자였다.\n\n25X1X[판독 불가]   CONTRO[판독 불가]\n\n공개 승인(Approved For Release) [판독 불가] 00860006-8\n\n-3-\n\n공개 승인(Approved For Release) [판독 불가]\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n기밀(CONFIDENTIAL)\n\n[판독 불가] 1945년 5월 김도명은 공산주의 혐의자로 일본 당국에 한 달 동안 구금되었다. 풀려난 뒤 그는 일본 헌병대의 밀정이 되었다. 그의 형 다카야마 미치아야는 [판독 불가]년 3월에 몇 건의 강도 혐의로 펑톈 경찰에 한 달 동안 구금되어 있었다. 구금될 당시 그는 펑톈의 어느 중학교에서 영어를 가르치고 있었다. 4월에 다카야마 미치아야는 조선 서울로 떠났다. 다른 형 다카야마 미치타케는 이때 무직이었다.\n\n일본이 항복할 무렵 김도명과 그의 형 다카야마 미치타케, 그리고 이보은은 소련군이 점령한 [판독 불가] 만주에서 [판독 불가] 살고 있었다. 김과 그의 형은 공산주의자로 [판독 불가]. 1945년 [2945 원문 그대로] 9월에 두 형제는 조선으로 떠났다. 김은 [판독 불가]에 머물며 한동안 공무원으로 [판독 불가] 하다가 서울로 갔고 지금 거기서 어떤 정치 활동에 관여하고 있다. 같은 해에 이보은은 펑톈을 세 차례 떠나 서울, 하얼빈, 창춘에 다녀왔다.\n\n[이] 문서는 개정된 [판독 불가]에서 정한 뜻의 미국 국방에 관한 정보를 담고 있다. [그 전달 또는] 그 내용을 권한 없는 자에게 [판독 불가] 누설하는 것은 법으로 금지된다.\n\n공개 승인(Approved For Release) [판독 불가] 0011000850008-5", "secondary": "25X1A2g\n\nCOUNTRY  China                DATE:  25X1A6a\nINFO.\n\nSUBJECT  Political Information; The Korean Representative\nGroup in Manchuria        DIST.  [판독 불가] November 1947\n\nPAGES  3\n\n[This] document is hereby regraded to\n\n25X1A6a   CONFIDENTIAL in accordance with the\n\nORIGIN   [판독 불가] letter of [판독 불가] October 1978 from the   SUPPLEMENT\n\n25X1X6\n\n25X1A[판독 불가]   [판독 불가] previous reports on the Korean Representative Group.\n\nLeading personnel of the KRG, Mukden\n\n3 [원문 그대로] The leading personnel of the Korean Representative Group (KRG) in Mukden are:\n\nChairman: YI Kwang ([한자 판독 불가])\n\nVice Chairman: KIM Hak-kyu ([한자 판독 불가]), who is also Chairman of the Korean Independence Party in Mukden.\n\n[판독 불가]\n\n[판독 불가]: CHANG Chin ([한자 판독 불가]) whose alias is CHANG Kyon-kun ([한자 판독 불가])\n\n[판독 불가] of General Affairs: KYE Sung-un ([한자 판독 불가])\n\n[판독 불가] of Relief Administration: KYE Sung-[판독 불가]\n\n[판독 불가] of Civil Affairs: YI Kyu-tong ([한자 판독 불가])\n\n[Histo]ry of the KRG\n\nUpon the dissolution of the Korean Provisional Government in China after the departure of the Chairman, KIM Koo ([한자 판독 불가]), the Chinese National Government [판독 불가] a member of KIM Koo's [판독 불가], PAK Sun ([한자 판독 불가]), as the [판독 불가] Representative Group in China with headquarters in Nanking.\n\n[The K]RG was formed under PAK Sun to administer Korean affairs in China---political, economic and cultural. [The] Chinese National Government finances the KRG, giving it a sum equal to US54500 [원문 그대로] a month. In addition to this sum, the KRG receives certain funds from the Kuomintang party and the BIS (MND) [Second Department, Ministry of National Defense].\n\n3. The KRG is merely a subordinate organ for the administrative organs of the Chinese National Government, benefiting the Chinese rather than the Koreans in China. [판독 불가] benefit to the Chinese is the [판독 불가] cooperation by the KRG with the [판독 불가] National Government in confiscating \"enemy property\" owned by Koreans. Confiscations of property owned by Koreans occurred in Peiping, Tientsin and Shanghai during 1946. The Chinese National Government depends upon the KRG to solve all Korean problems, rather than depending on Korean societies and associations.\n\n4. The KRG established branch offices in most of Manchuria; these offices serve as assisting organs for the Chinese National Government. The Korean Residents Association, various Korean Protestant societies and the Sino-Korean Cultural Association are the important organizations among the Koreans in Manchuria.   25X1X7\n\nCLASSIFICATION CONFIDENTIAL\n\nDocument No. [판독 불가]\n\n[판독 불가]\n\nApproved For Release [판독 불가]\n25X1X7\n\nCENTRAL INTELLIGENCE GROUP   25X1A6a\n\n-2-\n\n5. Within the KRG are two types of individuals: (a) The pro-Chinese element and old Korean residents of Manchuria who left Korea in 1903 and 1913; and (b) Former Japanese collaborators, pro-Japanese, who are presently using the KRG for protection. In both these categories are opportunists and unscrupulous elements.\n\n6. The pro-Chinese element of the KRG at one time supported the Hing A Tan ([한자 판독 불가]). The Hing A Tan was a group formed to carry out the confiscation of property owned by Koreans who had collaborated with the Japanese; but this group also confiscated the\n\n25X1A2g   property of non-collaborationists and killed 46 Koreans. General WANG Il-so ([한자 판독 불가]) (See [판독 불가] for report on General WANG's activities) was instrumental in dissolving this group and in securing the arrest of its members, two of WANG'S men being killed in the process by members of the Hing A Tan. At that time, General WANG was the chief of the Korean Administrative Department of the President's Northeast Field Headquarters. The events described above occurred in the summer of 1946. The pro-Japanese element in the Hing A Tan joined the KRG shortly after the Hing A Tan was dissolved.\n\n7. Because the KRG acts more as a special service organization to the Chinese National Government than as a group devoted to the interests of Koreans, the Koreans themselves do not rely on the KRG but attempt to solve their problems alone.\n\nYI Po-un, CH'OE Tung-hak, KIM To-myong\n\n8. The KRG is actually controlled by a woman, YI Po-un ([한자 판독 불가]), alias YI Mi-yong ([한자 판독 불가]). She controls the KRG through financial backing, supplying it with NEC$1,9000,000 [원문 그대로] a month. YI's financial support comes from General WEN Ch'iang, Chief of NECC G2 Section until 5 September 1947, and two other officers of high rank, names unknown. General WEN is reportedly connected with two opium factories in Mukden.\n\n9. YI Po-un is the adopted daughter of PAK Sun (also known as PAK Ch'an-ik [한자 판독 불가] and PAK Nam-pa [한자 판독 불가]), Chairman of the Korean Representative Group in Nanking. She is 36 years old, a native of Pyongyang (Heijo). Her present address is House 27, 2nd Section of K'ang T'ai Street, Pei Shih District, Mukden. YI is living with a Korean CH'OE Tung-hak ([한자 판독 불가]), alias CH'OE Kae-sok ([한자 판독 불가]) and a son of PAK Sun, PAK Yong-chun ([한자 판독 불가]). CH'OE is a native of Iwon (Rigen), Hamgyong Namdo, Korea; during the Japanese occupation of Manchuria, he held a high official position with the Manchukuo Government. He is at present unemployed. In early 1947 CH'OE made a trip to Seoul and returned to Manchuria where he recently made a trip to Harbin and Changchun, reason unknown. YI Po-un left Nanking by plane in late June 1947 and returned to Mukden; the reason for her visit to Nanking is unknown.\n\n40 [원문 그대로]. YI Po-un and CH'OE Tung-hak are affiliated with two distinct groups of Koreans: (a) The Korean Representative Group in China, which is pro-Chinese and which is affiliated with KIM Koo and his colleagues of the former Korean Provisional Government in Chungking, most of whom are now in Korea; and (b) the unscrupulous former pro-Japanese element, opportunists and so-called Communists led by KIM To-myong, cousin of YI Po-un, at present in Seoul. This group maintains direct communications with South Korea through its connection with leftist political organizations. It also has a liaison with North Korea and Chinese Communist-held Manchuria through the Chinese Communist Party in Manchuria.\n\n42 [원문 그대로]. YI's history during the Japanese occupation is a history of collaboration with Japanese figures in Manchukuo. YI, at the time of the Japanese occupation, was closely associated with her cousin, KIM To-myong ([한자 판독 불가]), whose Japanese name was TAKAYAMA Domio ([한자 판독 불가]). KIM was at one time an important official in the Manchukuo Government; he later became a \"self-styled\" Communist. KIM had two elder brothers, whose Japanese names were TAKAYAMA Michiaya ([한자 판독 불가]) and TAKAYAMA Michitake ([한자 판독 불가]) or TAKAYAMA Michine ([한자 판독 불가]). YI was closely associated with the KIM brothers and through them acquired a wide acquaintance with top Manchukuo figures; during the war she was the mistress of a member of the Japanese Gendarmerie, HIROTA ([한자 판독 불가]). YI, at this time, was a wealthy woman.\n\n25X1X[판독 불가]   CONTRO[판독 불가]\n\nApproved For Release [판독 불가] 00860006-8\n\n-3-\n\nApproved For Release [판독 불가]\n\nCENTRAL INTELLIGENCE GROUP\n\nCONFIDENTIAL\n\n[판독 불가] May 1945 KIM To-myong was detained for a month by the Japanese authorities as a Communist suspect; after his release he became an informer for the Japanese Gendarmerie. His elder brother, TAKAYAMA Michiaya had been, in March [판독 불가], detained for a month by the police in Mukden, suspected of certain robberies; at the time of his detention he was teaching English in a certain middle school in Mukden. In April, TAKAYAMA Michiaya left for Seoul, Korea. The other brother, TAKAYAMA Michitake, at this time was unemployed.\n\nAt the time of the Japanese surrender KIM To-myong, his brother, TAKAYAMA Michitake, and YI Po-un were living [판독 불가] in the Soviet Army occupied [판독 불가] Manchuria. KIM and his brother [판독 불가] as Communists; in September 2945 [원문 그대로] the two brothers left for Korea. KIM stayed in [판독 불가] and [판독 불가] as a public official for a time, then proceeded to Seoul where he is now engaged in some sort of political activity. The same year YI made three trips out of Mukden which took her to Seoul, Harbin and Changchun.\n\n[This] document contains information [affecting] the national defense of the U[nited] S[tates] within the meaning of [판독 불가] as amended. [Its transmission or the] revelation of its contents [판독 불가] to an unauthorized person is pro[hibited] by law.\n\nApproved For Release [판독 불가] 0011000850008-5", "notes": ["[삭제·공개 표시] Approved For Release : CIA-RDP82-00457R001000850006-5 (여러 곳의 공개 승인 도장. 앞부분이 뭉개져 뒤의 00860006-8, 0011000850008-5 같은 조각만 읽힌다)", "[삭제·공개 표시] 25X1A2g (첫 면 머리와 2면 여백의 면제 표시)", "[삭제·공개 표시] 25X1A6a (DATE 줄, ORIGIN 줄, 2면 머리)", "[삭제·공개 표시] 25X1X6 (ORIGIN 줄 아래)", "[삭제·공개 표시] 25X1X7 (4항 끝과 2면 머리, 2면 끝)", "[삭제·공개 표시] 1978년 10월 서한에 따라 CONFIDENTIAL 로 재분류한다는 도장이 첫 면 ORIGIN 줄에 겹쳐 찍혀 있다", "[삭제·공개 표시] CLASSIFICATION CONFIDENTIAL 과 Document No. 줄. 문서번호는 뭉개져 [판독 불가]로 옮겼다", "[삭제·공개 표시] 2면 끝의 CONTRO[판독 불가] 통제 표시"], "note": "세 면짜리 보고다. 1면 첫머리와 3면은 타자 잉크가 흐려 심하게 뭉개져 있고 2면은 비교적 잘 읽힌다. 첫 면의 머리 부분에 1978년 재분류 도장이 본문 위에 겹쳐 찍혀 있어 ORIGIN 줄과 뒤섞였다. 겹친 두 줄을 갈라 옮겼다. 문단 번호에 원문의 오식이 있다. 첫 문단이 3 으로 찍혀 있고 뒤에 다시 3 항이 나온다. 10항은 40, 11항은 42 로 찍혀 있다. 번호를 고치지 않고 [원문 그대로]를 붙였다. 2항에 해당하는 연혁 부분은 번호 없이 이어진다. 자금 액수는 두 곳 다 원문대로 두었다. 중국국민정부의 지원액은 US54500 으로 찍혀 있고 US 다음 글자가 달러 기호가 뭉개진 것으로 보이나 금액의 숫자를 고치지 않았다. 이보은의 지원액은 NEC$1,9000,000 으로 찍혀 있고 자릿수가 성립하지 않으나 그대로 두었다. NEC 는 동북 지역 유통 화폐 표기로 보이나 확정하지 않았다. 5항의 이주 연도는 1903년과 1913년이다. 같은 날짜의 N58 은 1903년과 1919년이라 적어 서로 어긋난다. 각 문서가 적은 대로 두었다. 흥아단이 죽인 조선인 46명도 원문대로 두었다. 인명과 단체명 뒤의 한자가 모두 뭉개져 [한자 판독 불가]로 두었다. 로마자를 앞세우고 한국어를 병기했다. 원문에 Namyong Nemdo 로 찍힌 곳은 Iwon 이원이 속한 도이므로 Hamgyong Namdo 함경남도로 읽었다. Rigen 은 이원의 일본식 읽기다. 6항의 WANG Il-so 장군 관련 참조 보고 번호는 SNM 으로 찍혀 판독되지 않아 [판독 불가]로 두었다. Hing A Tan 은 흥아단이며 한자가 뭉개져 짓지 않았다. President's Northeast Field Headquarters 는 국민정부의 주석 동북행원이다. NECC 는 동북 지역 사령부 계통의 약어로 보이나 풀지 않고 원문대로 두었다. 3면의 마지막 두 문단은 글자가 가장 심하게 뭉개진 대목이다. 서술의 뼈대는 읽히나 동사가 여럿 깨져 [판독 불가]로 두었다. September 2945 는 1945년으로 보이나 날짜의 숫자는 고치지 않았다. 다카야마 미치아야가 구금된 해도 farch AT 로 찍혀 연도를 확정하지 않았다. 지명은 원문 표기를 앞세우고 병기했다. Mukden 펑톈, Peiping 베이핑, Tientsin 톈진, Changchun 창춘이다. 평양은 원문이 Pyongyang (Heijo) 로 조선 이름과 일본식 이름을 나란히 적어 둘 다 살렸다.", "warn": false, "search": "YI Kwang 이광 (펑톈 한국대표단 위원장) KIM Hak-kyu 김학규 (부위원장, 펑톈 한국독립당 위원장 겸임) CHANG Chin 장진 (가명 CHANG Kyon-kun 장견군) KYE Sung-un 계승은 (총무 담당) KYE Sung-[판독 불가] 계승[판독 불가] (구호행정 담당) YI Kyu-tong 이규동 (민사 담당) KIM Koo 김구 (전 대한민국임시정부 주석) PAK Sun 박순 (난징 한국대표단 위원장. 별명 PAK Ch'an-ik 박찬익, PAK Nam-pa 박남파) WANG Il-so 왕일서 장군 (주석 동북행원 한교사무처장, 흥아단 해산) YI Po-un 이보은 (가명 YI Mi-yong 이미용. 한국대표단의 실제 통제자로 지목된 여성) WEN Ch'iang 원강 장군 (1947년 9월 5일까지 NECC G2 과장) CH'OE Tung-hak 최등학 (가명 CH'OE Kae-sok 최개석. 함경남도 이원 출신, 전 만주국 관리) PAK Yong-chun 박영준 (박순의 아들) KIM To-myong 김도명 (일본 이름 TAKAYAMA Domio 다카야마 도미오. 이보은의 사촌) TAKAYAMA Michiaya 다카야마 미치아야 (김도명의 형) TAKAYAMA Michitake 다카야마 미치타케 또는 TAKAYAMA Michine 다카야마 미치네 (김도명의 형) HIROTA 히로타 (일본 헌병대원) Approved For Release : CIA-RDP82-00457R001000850006-5 (여러 곳의 공개 승인 도장. 앞부분이 뭉개져 뒤의 00860006-8, 0011000850008-5 같은 조각만 읽힌다) 25X1A2g (첫 면 머리와 2면 여백의 면제 표시) 25X1A6a (DATE 줄, ORIGIN 줄, 2면 머리) 25X1X6 (ORIGIN 줄 아래) 25X1X7 (4항 끝과 2면 머리, 2면 끝) 1978년 10월 서한에 따라 CONFIDENTIAL 로 재분류한다는 도장이 첫 면 ORIGIN 줄에 겹쳐 찍혀 있다 CLASSIFICATION CONFIDENTIAL 과 Document No. 줄. 문서번호는 뭉개져 [판독 불가]로 옮겼다 2면 끝의 CONTRO[판독 불가] 통제 표시 Political Information; The Korean Representative Group in Manchuria"}, {"id": "N60", "order": 83, "date": "1947-11-13", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "경제 첩보: 평양의 병기 공장", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-11-13"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Economic Information: Ordnance Plants in Pyongyang (Heijo)", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r001100030007-3"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r001100030007-3"}], "summary": "평양의 옛 일본 병기창 두 곳이 북조선의 손에서 어떻게 되었는지를 한 면으로 적었다. 제1창은 수류탄과 탄약을 만들고 제2창은 아직 놀고 있다.", "points": ["머리에 야니스(JANIS) 75호를 인용해 1945년 3월 평양 조병창이 조선에서 가장 중요한 병기 공장이었을 것이라 적었다. 전쟁 때 만든 지지가 이 해에도 기준 노릇을 한다.", "옛 일본 병기창 제1창이 있던 사동 지구에서 북조선이 병기 공장을 돌리고 있다. 수류탄과 여러 탄약을 만든다.", "권총 제조 시도는 모두 실패했다. 자재와 기술자가 모자라기 때문이라고 적었다.", "조선인 기술자가 감독으로 고용되어 있다고 본다. 인원 숫자는 원문에서 뭉개져 있다.", "옛 일본 병기창 제2창에서도 무기 생산을 준비하나 아직 가동되지 않는다.", "평양의 좌표를 (125-44, 39-01)로 적었다. 조선 이름과 일본식 이름 Heijo 를 나란히 쓴다."], "primary": "INTELLOFAX 18\n\n공개 승인(Approved For Release) [판독 불가]R001100030007-3\n\n기밀(CONFIDENTIAL) - 25X1\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가  조선(Korea)                일자(DATE):  25X1\n정보(INFO.)\n\n주제  경제 첩보: 평양(Pyongyang, Heijo)의 병기 공장\n        배포(DIST.)  1947년 11월 [판독 불가]일\n\n25X1  면수  1\n\n25X1\n\n[주:] 야니스(Janis) 75호 제9장 IX-95 (D)에 따르면, 1945년 3월\n25X1 평양(Pyongyang, Heijo) (125-44, 39-01)의 조병창은 소총과 탄약을 생산하는, 조선에서 아마도 가장 중요한 병기 공장이었다.)\n\n1. 북조선인들은 지금\n25X1 전에 일본 병기창 제1창(Japanese Ordnance Depot #1)이던 곳에서 병기 공장을 가동하고 있다. 사동(Sadong, Jido)([한자 판독 불가]) 지구(?) [판독 불가]에 있다.\n주: 평[판독 불가]에서 동쪽으로 약 3마일 되는 곳에 사동(Sadong, Jido)이라 알려진 마을이 있다.\n이 공장에서는 지금 수류탄과 여러 가지 탄약을 생산하고 있으나, 권총을 제조하려는 시도는 모두 실패하였다. 자재와 기술자가 (? 평양\n25X1 일대에 ?) 모자라기 때문이다. 이 공장에는 조선인 기술자 (even [원문 그대로]명이 (? 감독으로 ?) 고용되어 있다.\n\n2. 북조선인들은 또 전에 평양의 일본 병기창 제2창(Japanese Ordnance Depot #2)이던 공장에서도 무기를 생산할 준비를 하고 있다. 그러나 이 공장은 아직 가동되지 않고 있다.\n\n이 문서는 개정된 간첩법(Espionage Act) 미국법전 제50편 31조 및 32조에서 정한 뜻의 미국 국방에 관한 정보를 담고 있다. 그 전달 또는 그 내용을 어떤 방법으로든 권한 없는 자에게 누설하는 것은 법으로 금지된다.\n\n문서번호(Document No.) [판독 불가]\n\n비밀등급 변경 없음(NO CHANGE in Class.) [판독 불가]\n\n[ ] 비밀해제(DECLASSIFIED)\n\n비밀등급 다음으로 변경(Class. CHANGED TO): TS S [판독 불가]\nDDA 각서, 1977년 4월 4일\n근거(Auth): DDA REG. 77/17   25X1\n\n일자 2 [판독 불가] 1[판독 불가] 처리자 [판독 불가]\n\n비밀등급(CLASSIFICATION) 기밀(CONFIDENTIAL)\n\nREFERENCE CENTER LIBRARY 참고자료실\n\n공개 승인(Approved For Release) [판독 불가] 44457R001100030007-3", "secondary": "INTELLOFAX 18\n\nApproved For Release [판독 불가]R001100030007-3\n\nCONFIDENTIAL - 25X1\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCOUNTRY  Korea                DATE:  25X1\nINFO.\n\nSUBJECT  Economic Information: Ordnance Plants in\nPyongyang (Heijo)        DIST.  [판독 불가] November 1947\n\n25X1  PAGES  1\n\n25X1\n\n[Note:] According to Janis 75, Chapter IX-95 (D), in March 1945\n25X1 the arsenal at Pyongyang (Heijo) (125-44, 39-01) was probably the most important ordnance plant in Korea, producing small arms and ammunition.)\n\n1. The North Koreans are now operating an ordnance plant in what was formerly\n25X1 the Japanese Ordnance Depot #1 in the Sadong (Jido) ([한자 판독 불가]) District (?) of [판독 불가].\nNote: There is a village known as Sadong (Jido) approximately three miles east of P[판독 불가].\nGrenades and various kinds of ammunition are now being produced in this factory but all attempts to manufacture pistols have been unsuccessful because of the shortage of materials and technicians (? in the Pyongyang\n25X1 area?). There are (even [원문 그대로] Korean technicians employed (? as supervisors?) at this factory.\n\n2. The North Koreans are also making preparations to produce weapons in a factory which was formerly the Japanese Ordnance Depot #2 in Pyongyang. However, this factory is not yet in operation.\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nDocument No. [판독 불가]\n\nNO CHANGE in Class. [판독 불가]\n\n[ ] DECLASSIFIED\n\nClass. CHANGED TO: TS S [판독 불가]\nDDA Memo, 4 Apr 77\nAuth: DDA REG. 77/17   25X1\n\nDate 2 [판독 불가] 1[판독 불가] By [판독 불가]\n\nCLASSIFICATION CONFIDENTIAL\n\nREFERENCE CENTER LIBRARY\n\nApproved For Release [판독 불가] 44457R001100030007-3", "notes": ["[삭제·공개 표시] Approved For Release : CIA-RDP82-00457R001100030007-3 (두 곳의 공개 승인 도장. 앞부분이 뭉개져 뒤의 R001100030007-3 만 읽힌다)", "[삭제·공개 표시] 25X1 (첫 면 머리와 본문 왼쪽 여백 여러 곳. 정보원 관련 대목이 지워진 자리로 보인다)", "[삭제·공개 표시] Document No. 줄. 문서번호가 뭉개져 [판독 불가]로 옮겼다", "[삭제·공개 표시] NO CHANGE in Class. / [ ] DECLASSIFIED / Class. CHANGED TO: TS S / DDA Memo, 4 Apr 77 / Auth: DDA REG. 77/17 (비밀등급 처리 도장)", "[삭제·공개 표시] CLASSIFICATION CONFIDENTIAL", "[삭제·공개 표시] REFERENCE CENTER LIBRARY (참고자료실 도장)"], "note": "한 면짜리 짧은 보고다. 본문 왼쪽 여백에 25X1 이 여러 줄에 걸쳐 붙어 있고 그 자리마다 문장이 끊긴다. 정보원을 가리키는 대목이 지워진 것으로 보인다. 지워진 표시를 본문에 그대로 남겼다. 첫 면 왼쪽 위의 'wTELLOFAX 18 은 INTELLOFAX 18 로 읽었다. 국무부와 정보기관의 색인 체계 이름이다. 공장 인원 숫자를 확정하지 못했다. 원문이 There are (even Korean technicians 로 찍혀 있어 seven 일곱으로 읽힐 만하나 인원 수는 이 계열의 핵심이라 고치지 않고 (even 을 그대로 두었다. 병기창 번호는 1항이 fl, 2항이 #2 로 찍혀 있다. 2항이 #2 로 뚜렷하므로 1항을 #1 로 읽었다. Janis 75 는 미 육해군 합동정보연구(Joint Army-Navy Intelligence Study) 75호이며 원문 표기를 그대로 두었다. 인용한 장 표시 Chapter IX-95 (D) 도 원문대로다. 평양의 좌표 (125-44, 39-01) 은 깨지지 않았고 고치지 않았다. 사동은 원문이 Sadong (Jido) 로 조선 이름과 일본식 이름을 나란히 적어 둘 다 살렸다. 뒤의 한자는 뭉개져 짓지 않았다. 사동 지구가 어느 행정 단위에 속하는지 적은 대목은 스캔에서 잘려 [판독 불가]로 두었다. 마을 위치를 적은 주에서 P 뒤가 잘려 있다. 평양으로 읽히나 짐작해 채우지 않았다. 물음표를 괄호에 넣은 (?) 표기는 원문 분석자가 확신하지 못한다는 표시다. 그대로 옮겼다. 등장 실인물이 없어 people 은 비워 두었다.", "warn": false, "search": "Approved For Release : CIA-RDP82-00457R001100030007-3 (두 곳의 공개 승인 도장. 앞부분이 뭉개져 뒤의 R001100030007-3 만 읽힌다) 25X1 (첫 면 머리와 본문 왼쪽 여백 여러 곳. 정보원 관련 대목이 지워진 자리로 보인다) Document No. 줄. 문서번호가 뭉개져 [판독 불가]로 옮겼다 NO CHANGE in Class. / [ ] DECLASSIFIED / Class. CHANGED TO: TS S / DDA Memo, 4 Apr 77 / Auth: DDA REG. 77/17 (비밀등급 처리 도장) CLASSIFICATION CONFIDENTIAL REFERENCE CENTER LIBRARY (참고자료실 도장) Economic Information: Ordnance Plants in Pyongyang (Heijo)"}, {"id": "N61", "order": 84, "date": "1947-11-17", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "군사 첩보: 만주의 조선의용군", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-11-17"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: The Korean Volunteer Army in Manchuria", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r001100070007-9"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r001100070007-9"}], "summary": "조선의용군(Korean Volunteer Army)의 내력을 1933년 조선혁명군관학교부터 1947년 만주 배치까지 훑는다. 마지막에 지휘관별 병력 수를 붙인다.", "points": ["1933년에서 1934년 사이 중국인 K'ANG 과 KIM Won-pong 김원봉이 조선혁명군관학교를 세운다. 1937년 7월 7일 사건 뒤 루산의 중국 중앙군관학교에 조선인 특별훈련반을 두고 80명을 교육한다.", "1939년 한커우에서 조선민주의용군(KDVA)이 중국 국민당군 정치부 아래 조직된다. 같은 해 PAK Hyo-sam 박효삼을 포함한 장교 30명이 갈라져 나와 황허를 건너 중국공산당에 합류한다.", "임시정부의 KIM Koo 김구가 KIM Tu-pong 김두봉을 보내 이들을 되돌리려 하나 김두봉 자신이 그 무리의 지도자가 된다.", "일본 항복 뒤 조선인 공산주의자들이 만주로 넘어가는 조건 세 가지를 문서가 적는다. 무기와 식량 지원, 장차 조선혁명 참가, 만주 조선인의 중국인과 동등한 권리다.", "1945년 11월 PAK Il-u 박일우가 600명을 이끌고 동만주로 간다. 12월 PAK Hyo-sam 이 2,000명을 이끌고 하이룽·류허·퉁화로 간다. 이들은 자기들이 공산군도 팔로군도 아니고 장차 조선국군이 된다고 선전한다.", "선전이 먹히지 않자 1946년 무크덴의 KVA 일부를 지방 보안대로 바꾸고 강제 모집으로 돌아선다. 두 달 훈련 뒤 중국공산군으로 보낸다.", "미소 공동 신탁통치 때문에 조선 진입 계획이 막혔다고 적는다. 다만 일부는 실제로 들어갔다.", "최고사령관은 KIM Il-song 김일성이고 대리사령관은 CH'OE Liu-chong 으로 찍혀 있다. 둘 다 북조선에 있고 사령부는 옌지에 있다.", "지휘관별 병력은 KANG Sin-t'ae 약 21,000명, PAK Hyo-sam 약 26,000명, KIM Ch'aek 김책 약 34,000명이다."], "primary": "공개 승인(Approved For Release) [판독 불가] : [판독 불가]457R001100070007-9\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가   [판독 불가]                              일자(DATE):   25X1X\n                                              정보일(INFO.)\n주제   [판독 불가] 조선의용군(The Korean Volunteer Army) [만주의]   배포(DIST.) 1947년 11월 (원문 `Novesser 1947`)\n                                              면수  3\n25X1A                                         보충(SUPPLEMENT)\n25X1X\n\n정보원 평가(EVALUATION OF SOURCE)\n[평가 표 판독 불가]\n\n국무부(STATE) | 육군부(WAR) | 해군부(NAVY) | 법무부(JUSTICE) | R&E | CAD | [판독 불가]\n\n25X1\n\n1. 지금 만주(Manchuria 원문 `Wanchuria`)에서 중국공산군과 함께 싸우고 있는 조선의용군(Korean Volunteer Army, KVA)([한자 판독 불가])의 내력은 1933년에서 1934년 사이에 시작되었다. K'ANG(원문 `Kiawe`)([한자 판독 불가])이라는 중국인과 KIM Won-pong 김원봉([한자 판독 불가])이 조선혁명군관학교(Korean Revolution Officers' Training School)([한자 판독 불가])를 세운 때다. K'ANG 은 쓰촨성(Szechuan Province)에 있던 중국 중앙군관학교(Chinese Central Military Academy)([한자 판독 불가]) 제3기 졸업생이고, KIM 은 같은 학교 제4기 졸업생이다. 조선혁명군관학교의 제1기에는 조선인 생도 40명이 교육을 받았고, 제2기에는 80명이 교육을 받았다.\n\n2. 1937년 「7월 7일 사건(July 7th Incident)」 직후, K'ANG 과 KIM 은 루산(Lushan) (102-59, 30-10) [원문 그대로]의 중국 중앙군관학교에 조선인 특별훈련반(Special Training Class for Koreans)을 두고 조선인 생도 80명을 교육하였다.\n\n3. 1939년 K'ANG 과 KIM 은 한커우(Hankow) 일대로 가서 중국 국민당군 정치부(Political Department of the Chinese Nationalist Army)의 직접 통제 아래 조선민주의용군(Korean Democratic Volunteer Army, KDVA)([한자 판독 불가])을 조직하였다.\n\n4. 1939년 KDVA 안에서 분열이 일어나, 공산주의에 공감하던 장교 30명이 KDVA 를 떠났다. 그 안에 PAK Hyo-sam 박효삼([한자 판독 불가])이 있었다. 이들은 뤄양(Loyang) (112-26, 3h-hO) [원문 그대로]으로 갔다가 황허(Yellow River)를 건너 중국공산당에 합류해 일본군과 싸웠다.\n\n5. KDVA 안에서 이 분열이 일어난 한 가지 까닭은 중앙군관학교 조선인 특별훈련반에서 중국인 장교와 조선인 장교 사이에 있던 마찰이다. 조선인들은 또 중국 국민당군 정치부 아래에 있는 KDVA 에서 조선인이 중국인과 동등하게 대우받지 못한다고 느꼈다. PAK 의 무리는 그런 대우에 불만을 품고 KDVA 를 떠나 중국공산당에 합류하였다.\n\n6. 그때 KIM Koo 김구([한자 판독 불가])가 이끌던 대한민국임시정부(Korean Provisional Government)는 KIM Tu-pong 김두봉([한자 판독 불가])을 PAK Hyo-sam 에게 보내어\n\n25X1\n\n문서번호(Document No.) [판독 불가]\n등급(CLASSIFICATION) 기밀(CONFIDENTIAL)\n등급 변경 없음(NO CHANGE in class.) [ ]\n[ ] 비밀해제(DECLASSIFIED)\n등급 변경(Class. CHANGED TO):\n근거(Auth): 0, G59. 7878S [원문 그대로]\n일자(Date): [판독 불가]   25X1\n\n공개 승인 [판독 불가] : [판독 불가]57R001100070007-9\n\n———\n\n공개 승인 [판독 불가]   기밀(CONFIDENTIAL)\n25X1  25X1A\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n그와 그 무리를 KDVA 의 품으로 되돌리려 하였다. KIM Tu-pong 은 실패했을 뿐 아니라 그 자신이 PAK 의 무리에서 지도자의 한 사람이 되었고 열렬한 공산주의자가 되었다.\n\n7. PAK 의 무리는 뒤에 조선독립동맹군(Korean Independence Army)([한자 판독 불가])으로 알려지게 되었고, 이 군대가 지금의 조선의용군의 핵심을 이루었다.\n\n8. 옌안(Yenan)의 조선인 공산주의자들은 곧 조선독립동맹군과 손을 잡았고, 일본이 항복할 때 이들은 모두 중국공산당의 지휘 아래 있었다. 그때 조선인 공산주의자들은 다음 조건으로 중국공산당을 돕기 위해 부대를 만주로 옮기는 데 동의하였다.\n\n가. 중국공산당은 조선인 공산주의자들에게 무기, 탄약, 식량, 피복을 대주기로 약속하였다.\n나. 중국공산당은 장차 있을 조선혁명에 조선인 공산주의자들과 함께하기로 합의하였다.\n다. 만주의 조선인 주민은 중국인과 동등한 권리를 가진다.\n\n9. 중국공산당이 위 조건에 동의한 뒤로 중국인과 조선인 공산주의자들은 함께 움직였다. 1945년 11월 중국공산당은 부대를 만주로 옮기기 시작하였다. PAK Il-u 박일우([한자 판독 불가])는 조선의용군 병력 약 600명을 이끌고 무크덴(Mukden 봉천)을 거쳐 동만주로 갔다. 이 병력은 루타이(Lutai) (117-50, 39-20)에서 모집한 것이다. 조선인 공산주의자들은 이미 1943년부터 베이핑(Peiping)과 톈진(Tientsin)에서 병력을 모집하고 있었다. 모집 거점은 루타이 부근의 농장이었고, 거기서 모집된 자들이 중국 각지의 중국공산군 부대로 몰래 보내졌다.\n\n12월에 PAK Hyo-sam 은 병력 약 2,000명을 이끌고 하이룽(Hailung) (125-49, 42-39), 류허(Liuho 원문 `Iduho`) (125-45, 42-17), 퉁화(Tunghua) (125+57, 4l—43) [원문 그대로]로 갔다. 이 병력은 대개 진저우(Chinchow 원문 `Chinche:`) (121-07, 41-07)와 무크덴에서 모집한 것이다. 이들이 내건 선전 곧 정치 노선은 자기들이 공산주의자도 팔로군(Eighth Route Army) 병력도 아니라 KVA 이며, 조선인의 이익을 지키러 만주에 왔고, 장차 조선국군(Korean National Army)이 될 것이라는 내용이었다. 선전은 제법 먹혀들어 많은 젊은이가 KVA 에 들어왔다. 그러나 뒤의 몇 달 동안 이탈자가 나왔고 들어오려 하지 않는 사람도 많았다. 그러자 KVA 당국은 방식을 바꾸었다. 1946년 이들은 무크덴에 있던 KVA 의 일부와 아마 다른 지점의 병력까지 지방 보안대(local Peace Preservation Units)로 바꾸었다. [판독 불가]는 소련군이 만주를 점령하고 있던 때다. 그 뒤 KVA 는 강제로 병력을 모집하였고, 모집한 자에게 두 달 훈련을 시킨 뒤 중국공산군 부대로 보냈다.\n\nKVA 는 한때 조선으로 들어갈 뜻을 가지고 있었으나 미소 공동 신탁통치(joint USSR-US trusteeship) 때문에 계획대로 들어가지 못하였다. 다만 KVA 병력의 일부는 실제로 들어갔다. [판독 불가](원문 `2isri-od.`).\n\n중국 국민당군이 만주에 들어오자 KVA 는 린장(Linchiang) (126-54, A142) [원문 그대로]과 [판독 불가]engchiang(원문 `lengchiong`) (1.6048, 42-23) [원문 그대로]으로 옮겼다. 이때 이들은 자기들이 「세계의 프롤레타리아를 해방할」 군대이며 중국공산군이 자기들의 동반자라고 선언하였다.\n\n대체로 KVA 는 장비가 나쁘다. 다만 중국공산군에 배속된 부대는 중국공산군 부대와 동등한 지위에 있다. 조선인 부대와는 별도로, 만주의 중국공산군 중대에는 평균 10명에서 20명가량의 조선인이 있다.\n\nKVA 의 최고사령관은 KIM Il-song 김일성([한자 판독 불가])이고 대리사령관은 CH'OE Liu-chong [원문 그대로]([한자 판독 불가])이다. 두 사람 다 북조선에 있다. CH'OE 는 린장을 거쳐 북조선에서 만주로 조선인 병력을 보내는 일을 특별히 맡고 있다. KVA 의 사령부는 옌지(Yenchi 원문 `Tenchi`) (129-31, 42-55)에 있다. 만주에 있는 KVA 의 여러 부대는 각자의 지휘관을 통하여 북조선의 KIM Il-song 에게 책임을 진다. KVA 에 관하여 중국공산당과 KIM Il-song 사이에 실제로 어떤 약정과 합의가 있는지는 현재로서는 알려져 있지 않다.\n\n25X1A\n\n기밀(CONFIDENTIAL)   25X1A\n\n공개 승인 [판독 불가] : [판독 불가]457R001100070007-9\n\n———\n\n[REFERENCE CENTER 도장, 판독 불가]\n\n공개 승인 [판독 불가]\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n10. [번호 판독 불가, 원문 여백에 `16.`] 만주에서 중국공산군의 공세가 [판독 불가](원문 `abeut 17 oar 17,`)경에 힘을 얻기 직전, 만주의 조선인 부대와 그 주요 지휘관, 위치, 대략의 병력 수는 다음과 같았다.\n\n가. KANG Sin-t'ae(원문 `KATG Sinettae`)([한자 판독 불가])의 지휘 아래 있는 병력. 대략 21,000명이며, [판독 불가](원문 `fuePrua`) 일대의 제47종대(47th Column), 자오허(Chiaohe) (12792¢, L?/\") [원문 그대로] 일대의 독립 제5사단과 제6사단, 옌지(Yenchi 원문 `Yerckd`) 일대의 제1·제2 보안여단(Peace Preservation Brigades)으로 이루어져 있다.\n\n나. PAK Hyo-sam 의 지휘 아래 있는 병력. 사령부는 류허(Liuho)에 있고 대략 26,000명이다. 메이허커우(Meihokou 원문 `!eihokov`) (125-41, 42-32)의 Yang Ch'ong-u([한자 판독 불가]) 지대와 독립 제2사단, 하이룽 남쪽의 Li Hong-lnong [원문 그대로]([한자 판독 불가]) 지대, 류허의 Chong-paek([한자 판독 불가]) 종대, 신빈(Hsinpin 원문 `Isinpin`) (125-01, 41-42)의 Yong-san([한자 판독 불가]) 지대, 창춘(Changchun) 부근의 한중종대(Sino-Korean Column)로 이루어져 있다.\n\n다. KIM Ch'aek 김책([한자 판독 불가])의 지휘 아래 있는 병력. 대략 34,000명이며, 수란(Shulan) (126-48, 44-21)의 제3종대, 자무쓰(Chiamussu 원문 `Chiarussu`) (130-21, 46/9) [원문 그대로]의 제5종대, Shinhe [원문 그대로] (121-52, 39-20)의 랴오난(Liao-nan)(?랴오닝 Liaoning) 지대로 이루어져 있다.\n\n11. [번호 판독 불가] Yang Ch'ong 지대는 한때 중국인을 많이 안고 있던 유일한 조선인 부대다. 약 50퍼센트였다. 이 지대는 지금은 대부분 조선인이다. 나머지 부대는 거의 전부 조선인으로 이루어져 있다.\n\n이 문서는 미합중국의 국방에 관계된 정보로서 개정된 간첩법(Espionage Act 50, U.S.C. 31 및 32)의 적용을 받는 정보를 담고 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방법으로든 누설하는 것은 법으로 금지된다.\n\n25X1\n\n공개 승인 [판독 불가] : [판독 불가]457R001100070007-9", "secondary": "Approved For Release [판독 불가] : [판독 불가]457R001100070007-9\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCOUNTRY   [판독 불가]                        DATE:   25X1X\n                                            INFO.\nSUBJECT   [판독 불가] The Korean Volunteer Army [in Manchuria]   DIST. November 1947 (원문 `Novesser 1947`)\n                                            PAGES  3\n25X1A                                       SUPPLEMENT\n25X1X\n\nEVALUATION OF SOURCE\n[평가 표 판독 불가]\n\nSTATE | WAR | NAVY | JUSTICE | R&E | CAD | [판독 불가]\n\n25X1\n\n1. The history of the Korean Volunteer Army (KVA) ([한자 판독 불가]) now fighting with the Chinese Communists in Manchuria (원문 `Wanchuria`), began in 1933-34 when a Chinese named K'ANG (원문 `Kiawe`) ([한자 판독 불가]) and KIM Won-pong ([한자 판독 불가]) established the Korean Revolution Officers' Training School ([한자 판독 불가]). K'ANG was a graduate of the third graduating class of the Chinese Central Military Academy ([한자 판독 불가]) in Szechuan Province; KIM was a graduate of the fourth class of the same academy. In the first term of the Korean Revolution Officers' Training School, forty Korean cadets were trained; in the second term, eighty were trained.\n\n2. Immediately after the \"July 7th Incident\" in 1937, K'ANG and KIM established the Special Training Class for Koreans in the Chinese Central Military Academy at Lushan (102-59, 30-10) [원문 그대로], training eighty Korean cadets.\n\n3. In 1939 K'ANG and KIM went to the Hankow area and organized the Korean Democratic Volunteer Army (KDVA) ([한자 판독 불가]) under the direct control of the Political Department of the Chinese Nationalist Army.\n\n4. In 1939 a split occurred in the KDVA and thirty officers of Communist sympathies, including PAK Hyo-sam ([한자 판독 불가]), left the KDVA and went to Loyang (112-26, 3h-hO) [원문 그대로], then crossed the Yellow River and joined the Chinese Communists to fight the Japanese.\n\n5. One reason for this split within the KDVA was the friction between Chinese and Korean officers in the Special Training Class for Koreans in the Central Military Academy. The Koreans also felt that in the KDVA under the Political Department of the Chinese Nationalist Army, the Koreans were not being treated as equals of the Chinese. PAK's group, dissatisfied with such treatment, left the KDVA and joined the Chinese Communists.\n\n6. The Korean Provisional Government, at that time headed by KIM Koo ([한자 판독 불가]), then dispatched KIM Tu-pong ([한자 판독 불가]) to go to PAK Hyo-sam and attempt to\n\n25X1\n\nDocument No. [판독 불가]\nCLASSIFICATION CONFIDENTIAL\nNO CHANGE in class. [ ]\n[ ] DECLASSIFIED\nClass. CHANGED TO:\nAuth: 0, G59. 7878S [원문 그대로]\nDate: [판독 불가]   25X1\n\nApproved For Release [판독 불가] : [판독 불가]57R001100070007-9\n\n———\n\nApproved For Release [판독 불가]   CONFIDENTIAL\n25X1  25X1A\n\nCENTRAL INTELLIGENCE GROUP\n\nwin him and his clique back into the fold of the KDVA. KIM Tu-pong not only failed but he himself became one of the leaders in PAK's group and an ardent Communist.\n\n7. PAK's group later became known as the Korean Independence Army ([한자 판독 불가]) and this army formed the nucleus for the present Korean Volunteer Army.\n\n8. Korean Communists at Yenan were soon affiliated with the Korean Independence Army and all were under the command of the Chinese Communists when the Japanese surrendered. Korean Communists then agreed to move their troops into Manchuria to assist the Chinese Communists under the following conditions:\n\na. The Chinese Communists promised to supply the Korean Communists with arms, ammunition, food and clothing.\nb. The Chinese Communists agreed to join the Korean Communists in a future Korean revolution.\nc. Korean residents in Manchuria would have equal rights with the Chinese.\n\n9. After the Chinese Communists agreed to the above conditions, the Chinese and Korean Communists acted together. In November 1945 the Chinese Communists started to transfer their troops to Manchuria. PAK Il-u ([한자 판독 불가]) led approximately 600 Korean Volunteer Army troops to East Manchuria via Mukden. These troops had been recruited at Lutai (117-50, 39-20). As early as 1943 Korean Communists were recruiting troops from Peiping and Tientsin; the recruiting point was at a farm near Lutai from which the recruits were secretly sent to Chinese Communist armies throughout China.\n\nIn December PAK Hyo-sam led approximately 2,000 troops, recruited mostly in Chinchow (원문 `Chinche:`) (121-07, 41-07) and Mukden, to Hailung (125-49, 42-39), Liuho (원문 `Iduho`) (125-45, 42-17) and Tunghua (125+57, 4l—43) [원문 그대로]. Their propaganda or political line was that they were not Communists nor Eighth Route Army troops but were the KVA, that they were in Manchuria to protect the interests of Koreans and that in the future they would be the Korean National Army. Their propaganda was fairly successful and many young people joined the KVA. However, in later months there were desertions and many were unwilling to join. The KVA authorities then changed their tactics. In 1946 they changed a part of the KVA in Mukden and perhaps other points into local Peace Preservation Units. [판독 불가] was at the time of the Soviet occupation of Manchuria. The KVA then recruited by force, giving the recruits two months training after which they were sent to the Chinese Communist armies.\n\nIt was the intention of the KVA at one time to enter Korea, but the joint USSR-US trusteeship prevented them from entering as planned. Part of the troops of the KVA, however, did enter, [판독 불가] (원문 `2isri-od.`).\n\nWhen the Chinese Nationalist troops entered Manchuria, the KVA moved to Linchiang (126-54, A142) [원문 그대로] and [판독 불가]engchiang (원문 `lengchiong`) (1.6048, 42-23) [원문 그대로]. At this time they announced that they were an army which would \"emancipate the proletariat of the world\" and that the Chinese Communist Army was their partner.\n\nGenerally, the KVA is poorly equipped, but those units attached to the Chinese Communists are on an equal status with the Chinese Communist units. In addition to the Korean units, there are approximately ten to twenty Koreans in an average Chinese Communist company in Manchuria.\n\nThe supreme commander of the KVA is KIM Il-song ([한자 판독 불가]) and the acting commander is CH'OE Liu-chong [원문 그대로] ([한자 판독 불가]). Both men are in North Korea. CH'OE has the particular function of dispatching Korean troops to Manchuria from North Korea by way of Linchiang. The headquarters of the KVA is at Yenchi (원문 `Tenchi`) (129-31, 42-55). The various elements of the KVA in Manchuria are responsible through their individual commanding officers to KIM Il-song in North Korea. The actual arrangement and agreements between the Chinese Communists and KIM Il-song regarding the KVA are not known at present.\n\n25X1A\n\nCONFIDENTIAL   25X1A\n\nApproved For Release [판독 불가] : [판독 불가]457R001100070007-9\n\n———\n\n[REFERENCE CENTER 도장, 판독 불가]\n\nApproved For Release [판독 불가]\n\nCENTRAL INTELLIGENCE GROUP\n\n10. [번호 판독 불가, 원문 여백에 `16.`] Immediately prior to the Chinese Communist offensive in Manchuria which gained its impetus about [판독 불가] (원문 `abeut 17 oar 17,`), Korean units in Manchuria, their principal commanders, their locations and approximate numbers were as follows:\n\na. The force under the command of KANG Sin-t'ae (원문 `KATG Sinettae`) ([한자 판독 불가]), approximately 21,000 in number, composed of the 47th Column in the [판독 불가] (원문 `fuePrua`) area, the Independent 5th and 6th Divisions in the Chiaohe (12792¢, L?/\") [원문 그대로] area, and the 1st and 2nd Peace Preservation Brigades in the Yenchi (원문 `Yerckd`) area.\n\nb. The force under the command of PAK Hyo-sam with headquarters at Liuho, approximately 26,000 in number, composed of the Yang Ch'ong-u ([한자 판독 불가]) Detachment and the 2 Independent Division both of Meihokou (원문 `!eihokov`) (125-41, 42-32), the Li Hong-lnong [원문 그대로] ([한자 판독 불가]) Detachment south of Hailung, the Chong-paek ([한자 판독 불가]) Column at Liuho, the Yong-san ([한자 판독 불가]) Detachment at Hsinpin (원문 `Isinpin`) (125-01, 41-42) and the Sino-Korean Column near Changchun.\n\nc. The force under the command of KIM Ch'aek ([한자 판독 불가]), approximately 34,000 in number, composed of the 3rd Column at Shulan (126-48, 44-21), the 5th Column at Chiamussu (원문 `Chiarussu`) (130-21, 46/9) [원문 그대로] and the Liao-nan (?Liaoning) Detachment at Shinhe [원문 그대로] (121-52, 39-20).\n\n11. [번호 판독 불가] The Yang Ch'ong Detachment is the only Korean unit that at one time contained a large number of Chinese—about 50%. This detachment now is mostly Korean. The other units are almost entirely composed of Koreans.\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act 50, U.S.C. 31 and 32, as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\n25X1\n\nApproved For Release [판독 불가] : [판독 불가]457R001100070007-9", "not
