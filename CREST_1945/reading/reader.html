on the train from Pyongyang (Heijo) (125-44, 39-01).\n\n2. On 14 June, approximately 3000 Soviet troops left the Najindong (Rashin) (130-15, 42-10) area for Pyongyang.\n\n3. On 19 June, a train consisting of six cars passed through Chongjin en route to [판독 불가]. On the train were 3000 rifles, 8000 cases of ammunition, 500 Soviet soldiers and 300 Korean soldiers. It was rumored that the [판독 불가] and ammunition were to be turned over to the North Korea People's Army [판독 불가] Pyongyang.\n\n4. On 14 June, approximately 500 Soviet troops moved through Chongjin by [판독 불가] from [판독 불가]. Their destination was Hoeryong (Kainei) (129-45, 42-22[판독 불가]).\n\n5. On [판독 불가] June, a unit of approximately 300 Soviet soldiers departed from Chongjin for Nanam (Ranan) (129-41, 41-42). The unit had two artillery pieces with (bore) diameters of approximately three inches.\n\n6. On 17 June, approximately 300 Soviet soldiers arrived in Chongjin from the Najindong area by jeeps and trucks.\n\n7. On 24 June, 500 soldiers of an artillery unit in Hamhung (Kanko) (127-32, 39-54) were transferred to Chongjin.\n\n8. On or about 2[판독 불가] June a large number of (?? Soviet Army) 6 x 6 trucks were [삭제] observed being loaded on flat cars in Hamhung.\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nDocument No. [판독 불가]\nNO CHANGE in Class. [ ]\n[ ] DECLASSIFIED\nClass. CHANGED TO: TS S C\nDDA Memo, 4 Apr 77\nAuth: [판독 불가]\nDate: [판독 불가]\nCLASSIFICATION  CONFID[판독 불가]\n25X1\n25X1\n\nREFERENCE CENTER [판독 불가]\n\nApproved For Release 2003/08/07 : CIA-RDP82-004[판독 불가]00900560001-4", "notes": ["[삭제·공개 표시] Approved For Release 2003/08/07 : CIA-RDP82-00457R000900560001-4 (첫 줄과 마지막 줄의 공개 승인 도장. 마지막 줄은 문서번호 가운데가 뭉개져 있다)", "[삭제·공개 표시] 25X1 (첫 면 여러 곳과 하단 두 곳)", "[삭제·공개 표시] 25X1[판독 불가] (DATE 줄. 원문에 `25X14` 로 찍혔으나 뒤 글자가 확정되지 않는다)", "[삭제·공개 표시] ORIGIN 줄의 출처 표시가 지워져 [삭제]로 옮겼다", "[삭제·공개 표시] 1항의 청진 뒤와 8항의 목격 서술 앞에 지워진 자리가 있어 [삭제]로 옮겼다", "[삭제·공개 표시] Document No. [판독 불가] / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S C / DDA Memo, 4 Apr 77 (비밀해제 처리 도장)", "[삭제·공개 표시] REFERENCE CENTER [판독 불가] (자료실 소인)"], "note": "한 면짜리 보고다. 국가란이 통째로 뭉개져 [판독 불가]로 두었다. 내용은 북조선이다. 날짜의 숫자를 고치지 않았다. 1항과 5항의 일자, 8항의 `2)` 는 뒷자리가 뭉개져 채우지 않았다. 병력과 물자 숫자 150, 3000, 8000, 500, 300은 원문대로 두었다. 좌표도 고치지 않았다. 평양 `(125-44, 39-01)`, 나진동 `(130-15, 42-10)`, 나남 `(129-41, 41-42)`, 함흥 `(127-32, 39-54)` 는 온전하다. 회령은 `(129-45, 42-223)` 으로 찍혀 위도의 분 뒤에 자리가 하나 더 붙어 있다. 같은 무렵의 N37 은 회령을 `(129-15, 42-25)` 로 적는다. 어느 쪽도 맞추지 않고 각각 원문대로 두었다. 지명은 `Najindong (Rashia)` 를 나진동(라신)으로, `Renee` 와 `prasaees` 는 판독되지 않아 [판독 불가]로 두었다. 4항의 이동 수단 `by mr` 도 판독되지 않는다. 3항의 `the pons and ammunition` 은 앞의 rifles 를 받는 말로 보이나 확정되지 않아 [판독 불가]로 두었다. `North Korea People's Army` 는 원문 표기 그대로다. 이 해에 이름이 굳어지는 중이므로 오늘의 이름으로 바꾸지 않았다. 8항의 `(7? Soviet Army)` 는 보고자가 단 물음표로 보아 `(?? Soviet Army)` 로 옮겼다.", "warn": false, "search": "Approved For Release 2003/08/07 : CIA-RDP82-00457R000900560001-4 (첫 줄과 마지막 줄의 공개 승인 도장. 마지막 줄은 문서번호 가운데가 뭉개져 있다) 25X1 (첫 면 여러 곳과 하단 두 곳) 25X1[판독 불가] (DATE 줄. 원문에 `25X14` 로 찍혔으나 뒤 글자가 확정되지 않는다) ORIGIN 줄의 출처 표시가 지워져 [삭제]로 옮겼다 1항의 청진 뒤와 8항의 목격 서술 앞에 지워진 자리가 있어 [삭제]로 옮겼다 Document No. [판독 불가] / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S C / DDA Memo, 4 Apr 77 (비밀해제 처리 도장) REFERENCE CENTER [판독 불가] (자료실 소인) Military Information: Soviet Troop and Materiel Movements in North Korea"}, {"id": "N43", "order": 67, "date": "1947-09-30", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "군사 첩보: 청진 일대의 소련군", "badge": "confidential control (U.S. OFFICIALS ONLY)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-09-30"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Soviet Troops in the Chongjin Area", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000900550013-2"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000900550013-2"}], "summary": "청진 일대의 소련군 총병력을 약 5,000명으로 보고 보병 연대와 포병 부대, 통신 부대의 규모와 지휘관 계급, 장비를 적었다. 산 두 곳에 놓인 고사포 자리도 함께 적었다.", "points": ["청진(세이신) 일대의 소련군 총병력이 약 5,000명이다.", "보병 연대 하나가 있고 연대장은 중령이다.", "포병 부대 하나가 약 1,800명이며 지휘관은 소령이다. 화물차 열두 대, 지프 세 대, 큰 화포 세 문, 소형과 중형 화포 열세 문, 고사포 네 문을 가지고 있다.", "통신 부대 하나가 약 400명이며 지휘관은 중위다.", "청진 일대의 Ch'anma 산에 구경 3인치 고사포 세 문이 소련군에 의해 설치되었다.", "청진 북성(Puksong) 구역의 Tingdee 산에 고사포 한 문과 화포 한 문이 설치되었다."], "primary": "[판독 불가] 공개 승인(Approved For Release) 2001/03/05 : CIA-RDP82-00457R[판독 불가]\n\n기밀 통제(CONFIDENTIAL CONTROL) 미국 관리 전용(U.S. OFFICIALS ONLY)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n첩보보고(INTELLIGENCE REPORT)\n\n                          일자(DATE):\n                          정보(INFO.)\n주제  군사 [판독 불가]      배포(DIST.)  [판독 불가] 1947년 9월\n25X1A                     면수  1\n                          보충(SUPPLEMENT)\n\n국가  조선(Korea)\n\n[판독 불가]의 소련군\n\n1. [판독 불가] 청진(Chongjin, 일본식 Seishin 淸津) (129-49, [판독 불가]) 일대의 소련군 총병력은 약 5,000명이다 [판독 불가]\n\n2. 청진 일대에 소련군 보병 연대가 하나 있다. 이 연대의 지휘관은 중령이다.\n\n3. 청진 일대에 약 1,800명 규모의 소련 포병 부대가 하나 있다. 지휘관은 소령이다. 이 부대는 화물차 열두 대, 지프 세 대, 큰 화포 세 문, 소형과 중형 화포 열세 문, 고사포 네 문을 가지고 있다.\n\n4. 청진 일대에 약 400명 규모의 소련 통신 부대가 하나 있다. 지휘관은 중위다.\n\n5. 구경 3인치의 고사포 세 문이 청진 일대의 Ch'anma 산([한자 판독 불가])에 소련군에 의하여 [판독 불가] 설치되었다.\n\n6. 청진 북성(Puksong)([한자 판독 불가]) 구역의 Tingdee 산([한자 판독 불가])에 [판독 불가] 한 문과 화포 한 문이 [판독 불가]에 의하여 설치되었다.\n\n이 문서에는 개정된 간첩법(Espionage Act, 50, U.S.C. 31 및 32)에서 정한 뜻에서 미합중국의 국방에 관련되는 정보가 들어 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방식으로든 알리는 것은 법으로 금지된다.\n\n문서번호(Document No.) [판독 불가]\n등급 변경 없음(NO CHANGE in Class.) [ ]\n[ ] 비밀해제(DECLASSIFIED)\n등급 변경(Class. CHANGED TO): TS S C\nDDA 각서, 1977년 4월 4일\n근거(Auth): DDA REG. 77/1763\n일자: 1979년 4월 19일  담당: [판독 불가]\n\n등급 구분(CLASSIFICATION)  기밀 통제, 미국 관리 전용\n\n[판독 불가] CIA-RDP82-00457R000900550013-2\n\n공개 승인 2001/[판독 불가]", "secondary": "[판독 불가] Approved For Release 2001/03/05 : CIA-RDP82-00457R[판독 불가]\n\nCONFIDENTIAL CONTROL U.S. OFFICIALS ONLY\n\nCENTRAL INTELLIGENCE GROUP\nINTELLIGENCE REPORT\n\n                          DATE:\n                          INFO.\nSUBJECT  Military [판독 불가]      DIST.  [판독 불가] September 1947\n25X1A                     PAGES  1\n                          SUPPLEMENT\n\nCOUNTRY  Korea\n\nSoviet Troops in [판독 불가]\n\n1. [판독 불가] the total number of Soviet troops in the Chongjin (Seishin) (129-49, [판독 불가]) area is approximately 5,000 [판독 불가]\n\n2. There is one infantry regiment of Soviet troops in the Chongjin area. The commanding officer of this regiment is a lieutenant colonel.\n\n3. In the Chongjin area there is one Soviet artillery unit of approximately 1,800 men. The Commanding officer is a major. The unit has twelve trucks, three jeeps, three large artillery pieces, thirteen small and medium-sized artillery pieces and four anti-aircraft guns.\n\n4. There is one Soviet signal corps unit of approximately 400 men in the Chongjin area. The commanding officer is a 1st Lieutenant.\n\n5. Three anti-aircraft guns, with [판독 불가] diameters of three inches have [판독 불가] set up on Mount Ch'anma ([한자 판독 불가]) in the Chongjin area by the Soviet troops.\n\n6. One [판독 불가] gun and one artillery piece have been set up on Mount Tingdee ([한자 판독 불가]) in the Puksong ([한자 판독 불가]) District of Chongjin by the [판독 불가].\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nDocument No. [판독 불가]\nNO CHANGE in Class. [ ]\n[ ] DECLASSIFIED\nClass. CHANGED TO: TS S C\nDDA Memo, 4 Apr 77\nAuth: DDA REG. 77/1763\nDate: 19 APR 197[판독 불가]  By: [판독 불가]\n\nCLASSIFICATION  CONFIDENTIAL CONTROL, U.S. OFFICIALS ONLY\n\n[판독 불가] CIA-RDP82-00457R000900550013-2\n\nApproved For Release 2001/[판독 불가]", "notes": ["[삭제·공개 표시] Approved For Release 2001/03/05 : CIA-RDP82-00457R[판독 불가] (첫 줄의 공개 승인 도장. 문서번호 끝이 잘려 있다)", "[삭제·공개 표시] [판독 불가] CIA-RDP82-00457R000900550013-2 (마지막 면 하단의 소인. 앞머리가 뭉개져 있다)", "[삭제·공개 표시] Approved For Release 2001/[판독 불가] (맨 아래 도장)", "[삭제·공개 표시] 25X1A (PAGES 줄 왼쪽 여백)", "[삭제·공개 표시] 1항의 문장 앞뒤에 지워졌거나 뭉개진 자리가 있어 [판독 불가]로 옮겼다", "[삭제·공개 표시] Document No. [판독 불가] / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S C / DDA Memo, 4 Apr 77 / Auth: DDA REG. 77/1763 / Date: 19 APR 197[판독 불가] (비밀해제 처리 도장)"], "note": "한 면짜리 보고다. 주제 줄이 `Military all` 로 잘려 목록의 제목을 따라 읽었다. 소제목 `Soviet Troops in` 다음이 비어 있어 [판독 불가]로 두었다. 청진의 위도가 `129-494 4 i-t6` 처럼 겹쳐 찍혀 판독되지 않는다. 같은 날짜대의 N41 은 `41-46` 으로 적으나 이 문서에서는 확정할 수 없어 채우지 않았다. 병력 숫자 5,000, 1,800, 400과 장비 수는 원문대로 두었다. 총병력 5,000과 부대별 합계가 맞지 않으나 맞추지 않았다. 5항의 `hy diameters` 는 (bore) 즉 구경으로 보이나 확정되지 않아 [판독 불가]로 두었다. 6항의 `One rere. ae gun` 은 앞 항의 anti-aircraft gun 을 받는 것으로 보이나 글자가 남지 않아 [판독 불가]로 두었다. 산 이름은 원문 로마자 `Mount Ch'anma` 와 `Mount Tingdee` 를 그대로 두었다. 뒤에 붙은 한자가 모두 뭉개져 있어 한글 지명을 짓지 않았다. `Puksong District` 는 북성으로 읽었으나 한자는 뭉개져 있다.", "warn": false, "search": "Approved For Release 2001/03/05 : CIA-RDP82-00457R[판독 불가] (첫 줄의 공개 승인 도장. 문서번호 끝이 잘려 있다) [판독 불가] CIA-RDP82-00457R000900550013-2 (마지막 면 하단의 소인. 앞머리가 뭉개져 있다) Approved For Release 2001/[판독 불가] (맨 아래 도장) 25X1A (PAGES 줄 왼쪽 여백) 1항의 문장 앞뒤에 지워졌거나 뭉개진 자리가 있어 [판독 불가]로 옮겼다 Document No. [판독 불가] / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S C / DDA Memo, 4 Apr 77 / Auth: DDA REG. 77/1763 / Date: 19 APR 197[판독 불가] (비밀해제 처리 도장) Military Information: Soviet Troops in the Chongjin Area"}, {"id": "N45", "order": 68, "date": "1947-10-02", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "군사 첩보: 안둥성(安東省)의 조선인 공산군 부대", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-10-02"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Korean Communist Troops in Antung Province", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000900710009-9"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000900710009-9"}], "summary": "1947년 6월과 7월에 조선인 공산군 이홍광(Li Hong Kwang) 지대 병력이 안둥(Antung 安東)에 들어오고 다시 관뎬(Kuantien) 방면으로 나간 것을 날짜별로 적었다. 신의주의 보안대 장교학교를 나온 병력이 안둥에 주둔하는 대목이 함께 붙는다.", "points": ["6월 6일 이홍광 지대 제1대대 470명 남짓이 안둥에 들어온다. 6월 14일에는 제2대대 460명이 들어온다.", "부대 이름의 둘째 글자를 두고 혼선이 있다고 문서가 스스로 적는다. 중국식으로 읽으면 Li Hung Kuang, 조선식으로 읽으면 Li Hong Kwang 이다.", "7월 3일 안둥의 이홍광 지대 특무병 30여 명이 CH'OE Myong-chi 지휘로 이동해 그곳에 주둔하던 부대와 교대한다.", "같은 7월 3일 조선인 병력 200여 명이 안둥에서 관뎬 방면으로 이동한다. 6월 16일 관뎬에 중국공산당 보안대 2000명이 있다는 보고가 주석으로 붙는다.", "이홍광 지대 300여 명이 압록강 기슭을 따라 안둥에 주둔하고, 30명이 창뎬허커우에서 경비를 선다.", "6월 27일 남신의주의 북조선 보안대 장교학교에서 나온 병력이 안둥에 도착해 류타오커우 구역에 숙영하며 안둥의 조선인 주민을 지킨다고 적었다.", "안둥성 안에 조선의용군(Korean Volunteer Army)이라 부른 병력이 따로 나온다. 6월 9일 500에서 600명, 펑청에 150명이다."], "primary": "공개 승인 2005/05/16 : CIA-RDP8&2-00457R000909710009-9 [원문 그대로]\n\n기밀(CONFIDENTIAL)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n25X1\n국가   중국(China)                                일자:\n                                                 정보일(INFO.)\n주제   [판독 불가] 조선인 공산군 부대                배포(DIST.) [판독 불가] 1947년\n25X1                                             면수  2\n\n배포처(DISTRIBUTION)\n[배포처 표 판독 불가]\n\n25X1  1. [판독 불가] 6월 6일, 조선인 공산군 이용광(Li Yong Kwang) [한자 판독 불가] (? 이홍광 Li Hong Kwang [한자 판독 불가]) 지대(Detachment) 제1대대가 안둥(Antung 安東) (2he22, 4O-08) [원문 그대로]에 들어왔다. 이 대대의 인원은 470명이 넘었다.\n\n25X1  주(Note): 조선인 이홍광(Li Hong Kwang) 지대는 한자를 중국식으로 읽어 Li Hung Kuang 지대로 보고되는 일이 잦았다. 지대 이름의 둘째 글자를 두고 혼선이 있는 것으로 보인다. 그 글자는 [한자 판독 불가]로도, [한자 판독 불가]로도 보고되었으며, 둘 다 중국말로는 \"Hung\", 조선말로는 \"Hong\" 으로 읽는다.\n\n25X1  [판독 불가] 이홍광 지대는 6월 11일에 Sau[판독 불가] (2ha22, 42-11) [원문 그대로]에서 동쪽으로 약 20킬로미터 지점에 있었다.\n\n25X1  [판독 불가] 조선의용군(Korean Volunteer Army) 병력 500명에서 600명 사이가 6월 9일경 중국공산군과 함께 안둥에 [판독 불가].)\n\n2. 6월 14일, 이홍광 지대 제2대대가 병력 460명으로 안둥에 들어왔다.\n\n3. [판독 불가]일 (원문 `Onl dior.`), 이홍광 지대 제2대대 병력 약 70명이 안둥을 떠나 관뎬(Kuantien) (124-46, 40-44) 부근의 관수이(Kuanshui)([한자 판독 불가])로 갔다. 관수이에서 이 병력은 퉁화(Tunghua 通化) (125-57, [판독 불가])로 나아갈 예정이었다.\n\n4. 7월 3일, 안둥에 있는 이홍광 지대의 특무병(special service troops) 30여 명이 CH'OE Myong-chi([한자 판독 불가])의 지휘 아래 Tgachokou [원문 그대로] (123-55, 40-53)에 도착해 그곳에 주둔하던 (? 조선인? 중국인?) 부대와 교대하였다. 이 특무병 30명은 소총과 경기관총 두 정으로 무장하고 있었다.\n\n25X1  5. 7월 3일, [판독 불가] 지대의 조선인 병력 200여 명이 안둥에서 관뎬 방면으로 이동하였다. (주: 6월 16일, 중국공산당 보안대(Peace Preservation Corps) 병력 약 2000명이 관뎬에 있다고 보고되었다.)\n\n6. 이홍광 지대 병력 300여 명이 압록강(Yalu River) 기슭을 따라 안둥에 주둔하고 있다.\n\n7. 조선인 공산군 30명이 창뎬허커우(Changtienhokou) (124-48, 40-25)에서 경비 임무를 수행하고 있다.\n\n기밀(CONFIDENTIAL)\n[REFERENCE CENTER 도장, 판독 불가]\n\n공개 승인 2005/05/16 : CIA-RDP82-00457R000900710009-9\n\n———\n\n공개 승인 2005/05/16 : CIA-RDP82-00457R000900710009-9\n\n문서번호(Document No.) [판독 불가]\n등급 변경 없음(No CHANGE in Classification) [판독 불가]\n[ ] 비밀해제(DECLASSIFIED) [판독 불가]\n25X1\n\n공개 승인 2005/05/16 : CIA-RDP82-00457R000900710009-9\n\n———\n\n공개 승인 2005/05/16 : CIA-RDP82-00457R00090071000[9-9]\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n[판독 불가] 27일 (원문 `27 Jans`), 조선인 공산군 2[판독 불가]0명이 남신의주(South Sinuiju)의 북조선 보안대 장교학교(North Korean Peace Preservation Corps Officers School)에서 안둥에 도착하였다. 이 학교는 신의주(Sinuiju 신의주(新義州), 일본식 Shingishu) (124-24, 40-06)에서 몇 킬로미터 떨어져 있다. 이 병력은 안둥시의 류타오커우(Liutaokou)([한자 판독 불가]) 구역에 숙영하고 있다. 이들은 경비 임무를 맡고 안둥의 조선인 주민을 보호(?)한다.\n\n펑청(Fengcheng 鳳城) (124-02, 40-23)에는 조선의용군(Korean Volunteer Army) 병력 150명이 있다.\n\n이 문서는 미합중국의 국방에 관계된 정보로서 개정된 간첩법(Espionage Act, 50, U.S.C. 31 및 32)의 적용을 받는 정보를 담고 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방법으로든 누설하는 것은 법으로 금지된다.\n\n문서번호(Document No.) 007 [원문 그대로]\n등급 변경 없음(No CHANGE in Class.) [판독 불가]\n\n기밀(CONFIDENTIAL)\n\n공개 승인 2005/05/16 : CIA-RDP82-00457R000900710009-9", "secondary": "Approved For Release 2005/05/16 : CIA-RDP8&2-00457R000909710009-9 [원문 그대로]\n\nCONFIDENTIAL\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\n25X1\nCOUNTRY   China                                   DATE:\n                                                  INFO.\nSUBJECT   [판독 불가] Korean Communist Troops      DIST. [판독 불가] 1947\n25X1                                              PAGES  2\n\nDISTRIBUTION\n[배포처 표 판독 불가]\n\n25X1  1. [판독 불가] 6 June, the 1 Battalion of the Li Yong Kwang [한자 판독 불가] (? Li Hong Kwang [한자 판독 불가]) Detachment of Korean Communist troops entered Antung (2he22, 4O-08) [원문 그대로]. There were over 470 men in the battalion.\n\n25X1  Note: The Korean Li Hong Kwang Detachment has often been reported as the Li Hung Kuang Detachment, according to the Chinese reading of the characters. Some confusion seems to exist concerning the second character of the name of the detachment. The character has been reported as [한자 판독 불가] and as [한자 판독 불가], both of which are read \"Hung\" in Chinese and \"Hong\" in Korean.\n\n25X1  [판독 불가] the Li Hong Kwang Detachment was about 20 kilometers east of Sau[판독 불가] (2ha22, 42-11) [원문 그대로] on 11 June.\n\n25X1  [판독 불가] between 500 and 600 Korean Volunteer Army troops en[판독 불가]ung with the Chinese Communist troops about 9 June.)\n\n2. On 14 June, the 2 Battalion of the Li Hong Kwang Detachment, with a strength of 460 men, entered Antung.\n\n3. On [판독 불가] (원문 `Onl dior.`), approximately 70 troops of the 2 Battalion of the Li Hong Kwang Detachment left Antung for Kuanshui ([한자 판독 불가]) near Kuantien (124-46, 40-44). From Kuanshui the troops were to proceed to Tunghua (125-57, [판독 불가]).\n\n4. On 3 July, over 30 special service troops under the command of CH'OE Myong-chi ([한자 판독 불가]) of the Li Hong Kwang Detachment in Antung arrived at Tgachokou [원문 그대로] (123-55, 40-53) to relieve (? Korean? Chinese?) troops stationed there. These 30 special service troops were armed with rifles and two light machine guns.\n\n25X1  5. On 3 July, over 200 Korean troops of the [판독 불가] Detachment proceeded from Antung in the direction of Kuantien. (Note: On 16 June, about 2000 Chinese Communist Peace Preservation Corps troops were reported at Kuantien.)\n\n6. Over 300 troops of the Li Hong Kwang Detachment are stationed in Antung along the Yalu River Bank.\n\n7. Thirty Korean Communist troops are performing guard duty at Changtienhokou (124-48, 40-25).\n\nCONFIDENTIAL\n[REFERENCE CENTER 도장, 판독 불가]\n\nApproved For Release 2005/05/16 : CIA-RDP82-00457R000900710009-9\n\n———\n\nApproved For Release 2005/05/16 : CIA-RDP82-00457R000900710009-9\n\nDocument No. [판독 불가]\nNo CHANGE in Classification [판독 불가]\n[ ] DECLASSIFIED [판독 불가]\n25X1\n\nApproved For Release 2005/05/16 : CIA-RDP82-00457R000900710009-9\n\n———\n\nApproved For Release 2005/05/16 : CIA-RDP82-00457R00090071000[9-9]\n\nCENTRAL INTELLIGENCE GROUP\n\nOn 27 [판독 불가] (원문 `27 Jans`), 2[판독 불가]0 Korean Communist troops arrived in Antung from the North Korean Peace Preservation Corps Officers School in South Sinuiju, a few kilometers from Sinuiju (Shingishu) (124-24, 40-06). These troops are billeted in the Liutaokou ([한자 판독 불가]) district of Antung City. They perform guard duties and protect (?) the Korean residents of Antung.\n\nThere are 150 Korean Volunteer Army troops in Fengcheng (124-02, 40-23).\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nDocument No. 007 [원문 그대로]\nNo CHANGE in Class. [판독 불가]\n\nCONFIDENTIAL\n\nApproved For Release 2005/05/16 : CIA-RDP82-00457R000900710009-9", "notes": ["[삭제·공개 표시] Approved For Release 2005/05/16 : CIA-RDP82-00457R000900710009-9 (각 면의 공개 승인 도장)", "[삭제·공개 표시] 첫 면의 도장은 `CIA-RDP8&2-00457R000909710009-9` 로 찍혀 뒷면들과 문서번호가 다르나 고치지 않았다", "[삭제·공개 표시] 25X1 (COUNTRY·PAGES 줄과 1·5항 왼쪽 여백에 반복해 찍힌 면제 표시)", "[삭제·공개 표시] Document No. 007 / No CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO 의 등급 처리 도장", "[삭제·공개 표시] DISTRIBUTION 표가 뭉개져 수신처를 읽을 수 없다"], "note": "OCR 상태가 이 계열에서 나쁜 편이다. 좌표를 고치지 않았다. 안둥의 `(2he22, 4O-08)` 과 사우[판독 불가]의 `(2ha22, 42-11)` 은 경도 앞자리가 깨져 있다. 다른 문서에서 안둥은 (124-23, 40-09)로 나오나 이 문서의 숫자를 그대로 두었다. 퉁화의 위도는 `blob` 으로 찍혀 [판독 불가]로 두었다. 3항의 날짜는 `Onl dior.` 로 찍혀 있어 판독하지 않았다. 앞뒤가 6월 14일과 7월 3일이다. 2면의 `27 Jans` 도 월을 확정하지 못해 [판독 불가]로 두었다. 같은 문단의 병력 수 `2.0` 은 가운데 자리가 비어 2[판독 불가]0 으로 옮겼다. 4항의 지명 `Tgachokou` 는 고치지 않았다. 5항의 지대 이름 자리에 X 표시만 남아 [판독 불가]로 두었다. 부대 이름의 한자는 문서가 두 글자를 견주는 대목인데 스캔에서 둘 다 뭉개져 [한자 판독 불가]로 두었다. `Peace Preservation Corps` 는 보안대(保安隊)이고 `Korean Volunteer Army` 는 조선의용군이다. 원문 표기를 앞세웠다. 2면은 문단 번호가 사라져 번호 없이 이어진다. 새로 매기지 않았다.", "warn": false, "search": "Li Hong Kwang 이홍광 (지대 이름. 원문은 Li Yong Kwang·Li Hung Kuang 표기도 함께 적는다) CH'OE Myong-chi 최명지(?) (안둥 주둔 이홍광 지대 특무병 지휘, 한자 판독 불가) Approved For Release 2005/05/16 : CIA-RDP82-00457R000900710009-9 (각 면의 공개 승인 도장) 첫 면의 도장은 `CIA-RDP8&2-00457R000909710009-9` 로 찍혀 뒷면들과 문서번호가 다르나 고치지 않았다 25X1 (COUNTRY·PAGES 줄과 1·5항 왼쪽 여백에 반복해 찍힌 면제 표시) Document No. 007 / No CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO 의 등급 처리 도장 DISTRIBUTION 표가 뭉개져 수신처를 읽을 수 없다 Military Information: Korean Communist Troops in Antung Province"}, {"id": "N46", "order": 69, "date": "1947-10-08", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "정치 첩보: 북조선의 신문", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-10-08"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Political Information: Newspapers in North Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r001200870001-5"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r001200870001-5"}], "summary": "북조선에서 널리 읽히는 조선말 신문 여섯을 발행 주체와 함께 적었다. 신문마다 어느 정당이나 단체의 기관지인지가 붙는다.", "points": ["Min Chu Cho Sin 민주조선은 북조선로동당과 북조선인민위원회의 기관지다.", "T'u Sa Sin Mun 투사신문은 애국투사후원회(Ae Kuk T'u Sa Hu Won Hoe)의 기관지다.", "No Tong Sin Mun 노동신문은 북조선직업총연맹(Puk Cho Son Chik Up Ch'ong Yon Maeng)의 기관지다.", "Nong Min Sin Mun 농민신문은 농민동맹(Nong Min Tong Maeng)의 기관지다.", "No Tong Cha Sin Mun 노동자신문은 북조선일반직업동맹(Puk Cho Son Il Pan Chik Up Tong Maeng)의 기관지다.", "Cho Son Sin Mun 조선신문은 극도로 친소련적인 간행물이라고 적었다. 발행 주체는 적지 않았다.", "끝에 세 단체에 관한 추가 정보를 가리키는 주석이 붙는데 그 대목이 삭제되어 있다."], "primary": "공개 승인 2006/11/06 : CIA-RDP82-00457R001200870001-5\n\n기밀(CONFIDENTIAL)   25X1\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n25X1\n국가   조선(Korea)                                일자:\n주제   정치 첩보: 북조선의 신문                      배포(DIST.) [판독 불가] 1940년 1월 [원문 그대로]\n25X1                                              면수  1\n                                                  보충(SUPPLEMENT)\n25X1\n배포처(DISTRIBUTION)\n[배포처 표 판독 불가 — 국무부(STATE)·육군부(WAR)·해군부(NAVY)·공군(AIR)·[판독 불가]·OSD·[판독 불가] 칸이 있다]\n25X1\n\n1. 다음 여섯 종의 조선말 신문이 북조선에서 널리 읽힌다:\n\n민주조선(Democratic Korea, Min Chu Cho Sin [한자 판독 불가]). 북조선로동당(North Korean Labor Party)과 북조선인민위원회(North Korean People's Committee)의 기관지다.\n\n투사신문(The Fighters' News, T'u Sa Sin Mun [한자 판독 불가]). 애국투사후원회(Patriotic Fighters' Supporters' Association, Ae Kuk T'u Sa Hu Won Hoe [한자 판독 불가])의 기관지다.\n\n노동신문(Labor News, No Tong Sin Mun [한자 판독 불가]). 북조선직업총연맹(North Korean General Trades' League, Puk Cho Son Chik Up Ch'ong Yon Maeng [한자 판독 불가])의 기관지다.\n\n농민신문(Farmers' News, Nong Min Sin Mun [한자 판독 불가]). 농민동맹(Farmers' League, Nong Min Tong Maeng [한자 판독 불가])의 기관지다.\n\n노동자신문(The Workers' News, No Tong Cha Sin Mun [한자 판독 불가]). 북조선일반직업동맹(North Korean General Workers' League, Puk Cho Son Il Pan Chik Up Tong Maeng [한자 판독 불가])의 기관지다.\n\n조선신문(Korean News, Cho Son Sin Mun [한자 판독 불가]). 극도로 친소련적인 간행물이다.\n\n25X1  [삭제] (주: 애국투사후원회, 북조선직업총연맹, 북조선일반직업동맹에 관한 정보는 [판독 불가].)\n\n이 문서는 미합중국의 국방에 관계된 정보로서 개정된 간첩법(Espionage Act, 50, U.S.C. 31 및 32)의 적용을 받는 정보를 담고 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방법으로든 누설하는 것은 법으로 금지된다.\n\n등급 변경(Class. CHANGED TO): TS  S  C\nDDA 각서, 1977년 4월 4일\n25X1  근거(Auth.): DDA REG. 77/[판독 불가]\n일자: 1978년 5월 2[판독 불가]일\n\n분류(CLASSIFICATION) 기밀(CONFIDENTIAL)\n\n기밀(CONFIDENTIAL)\n\n공개 승인 2006/11/06 : CIA-RDP82-00457R001200870001-5", "secondary": "Approved For Release 2006/11/06 : CIA-RDP82-00457R001200870001-5\n\nCONFIDENTIAL   25X1\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\n25X1\nCOUNTRY   Korea                                                DATE:\nSUBJECT   Political Information: Newspapers in North Korea      DIST. [판독 불가] January 1940 [원문 그대로]\n25X1                                                            PAGES  1\n                                                                SUPPLEMENT\n25X1\nDISTRIBUTION\n[배포처 표 판독 불가 — STATE / WAR / NAVY / AIR / [판독 불가] / OSD / [판독 불가] 등의 칸이 있다]\n25X1\n\n1. The following six Korean language newspapers have a wide circulation in North Korea:\n\nDemocratic Korea (Min Chu Cho Sin [한자 판독 불가]), an organ of the North Korean Labor Party and the North Korean People's Committee.\n\nThe Fighters' News (T'u Sa Sin Mun [한자 판독 불가]), an organ of the Patriotic Fighters' Supporters' Association (Ae Kuk T'u Sa Hu Won Hoe [한자 판독 불가]).\n\nLabor News (No Tong Sin Mun [한자 판독 불가]), an organ of the North Korean General Trades' League (Puk Cho Son Chik Up Ch'ong Yon Maeng [한자 판독 불가]).\n\nFarmers' News (Nong Min Sin Mun [한자 판독 불가]), an organ of the Farmers' League (Nong Min Tong Maeng [한자 판독 불가]).\n\nThe Workers' News (No Tong Cha Sin Mun [한자 판독 불가]), an organ of the North Korean General Workers' League (Puk Cho Son Il Pan Chik Up Tong Maeng [한자 판독 불가]).\n\nKorean News (Cho Son Sin Mun [한자 판독 불가]), an extremely pro-Soviet publication.\n\n25X1  [삭제] (Note: [판독 불가] for information on the Patriotic Fighters' Supporters' Association, the North Korean General Trades' League and the North Korean General Workers' League.)\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nClass. CHANGED TO: TS  S  C\nDDA Memo, 4 Apr 77\n25X1  Auth: DDA REG. 77/[판독 불가]\nDate: 2[판독 불가] MAY 1978\n\nCLASSIFICATION CONFIDENTIAL\n\nCONFIDENTIAL\n\nApproved For Release 2006/11/06 : CIA-RDP82-00457R001200870001-5", "notes": ["[삭제·공개 표시] Approved For Release 2006/11/06 : CIA-RDP82-00457R001200870001-5 (앞뒤의 공개 승인 도장)", "[삭제·공개 표시] 25X1 (제호 옆, COUNTRY·PAGES 줄, DISTRIBUTION 위아래, 마지막 주석 앞, 근거 줄에 반복해 찍힌 면제 표시)", "[삭제·공개 표시] 마지막 문단의 주석에서 출처를 가리키는 대목이 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] Class. CHANGED TO: TS S C / DDA Memo, 4 Apr 77 / Auth: DDA REG. 77/[판독 불가] / Date: 2[판독 불가] MAY 1978 의 등급 변경 도장", "[삭제·공개 표시] DISTRIBUTION 표가 뭉개져 수신처를 읽을 수 없다"], "note": "짧은 문서이나 조선말 이름이 빽빽하다. 신문 이름과 단체 이름의 한자가 모두 스캔에서 뭉개져 한 글자도 확정되지 않아 [한자 판독 불가]로 두었다. 로마자 표기는 뭉개진 글자만 바로잡았다. `Cho Sda Sin Mun` 은 Cho Son Sin Mun, `Ae Buk T'u Sa Bu Won He` 는 Ae Kuk T'u Sa Hu Won Hoe, `Pak Cho edn Il Fan Shik Up Tong Maeng` 은 Puk Cho Son Il Pan Chik Up Tong Maeng 으로 읽었다. 첫 신문의 로마자는 원문대로 `Min Chu Cho Sin` 이다. 세 번째 신문이 속한 단체의 영문 이름은 본문 첫 대목에서 `General Tradea' snene` 으로 뭉개져 있는데, 같은 문서 마지막 주석에 `General Trades' League` 로 다시 나와 그것을 따랐다. 배포 날짜는 `Dp January 1940` 으로 찍혀 있다. 1948년으로 보이나 날짜의 숫자는 고치지 않았다. 등급 변경 도장의 `2&2 MAY 1978` 도 그대로 두었다.", "warn": false, "search": "Approved For Release 2006/11/06 : CIA-RDP82-00457R001200870001-5 (앞뒤의 공개 승인 도장) 25X1 (제호 옆, COUNTRY·PAGES 줄, DISTRIBUTION 위아래, 마지막 주석 앞, 근거 줄에 반복해 찍힌 면제 표시) 마지막 문단의 주석에서 출처를 가리키는 대목이 먹칠되어 [삭제]로 옮겼다 Class. CHANGED TO: TS S C / DDA Memo, 4 Apr 77 / Auth: DDA REG. 77/[판독 불가] / Date: 2[판독 불가] MAY 1978 의 등급 변경 도장 DISTRIBUTION 표가 뭉개져 수신처를 읽을 수 없다 Political Information: Newspapers in North Korea"}, {"id": "N47", "order": 70, "date": "1947-10-09", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "정치 첩보: 북조선의 통제", "badge": "confidential control — U.S. officials only", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-10-09"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Political Information: Controls in North Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r001000030014-6"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r001000030014-6"}], "summary": "북조선에서 사람을 다니게 하고 살게 하는 통제가 실제로 어떻게 작동하는지를 적었다. 통행에 필요한 서류, 철도경비대의 역과 열차 검문, 이사 절차, 여관 숙박 신고를 다룬다.", "points": ["북조선에서 다니는 데 필요한 것은 신분증명서와 콜레라 증명서뿐이다. 구역 책임자의 서면 허가는 있으면 좋으나 필수가 아니어서 대개 받지 않는다.", "북조선의 각 군은 「구역(section)」으로 나뉘고 한 구역은 대개 29호로 이루어진다.", "철도경비대(Ch'ol To Kyong Pi Tae)가 모든 역에서 검문한다. 검사원이 매표원 옆에 앉아 신분증명서와 콜레라 증명서를 확인해야 표를 판다.", "의심받는 것은 대개 16세에서 23세 사이의 젊은이 가운데 「공인」 단체에 속하지 않은 사람, 짐이 많거나 이상한 사람이다. 정당이나 공인 단체에 가입했는지, 아니면 왜 안 했는지를 묻는다.", "열차마다 검사원이 네다섯 명 타고 도중에 다른 검사원으로 교대한다. 7월에 사복 검사원은 평양과 정주 사이 열차에서 두 명만 목격되었다. 실제로 조사받는 사람은 승객 열에 하나가 못 된다.", "함흥역에는 철도경비대 분소가 있다. 의심받은 승객을 열차에서 내려 조사하는데 신분증명서의 내용을 본인이 아는지를 주로 확인한다.", "구역을 옮겨 이사하려면 떠나는 구역 책임자의 허가에 군 책임자의 서명을 받고, 옮긴 뒤 새 구역 책임자에게 제출해야 한다.", "여관은 투숙객 명부를 갖추고 매일 저녁 20시에 정보를 보안대(Po An Tae)에 넘긴다. 1947년 4월 김일성 장군이 낸 외박객 신고 명령은 엄하게 시행되지 않는다."], "primary": "기밀 통제(CONFIDENTIAL CONTROL)\n미국 관리 전용(U.S. OFFICIALS ONLY)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가   조선(Korea)                                일자:\n                                                  정보일(INFO.)  25X1X6\n주제   정치 첩보: 북조선의 통제                      배포(DIST.) [판독 불가]월 1347년 [원문 그대로]\n25X1A6a                                           면수  2\n\n출처(ORIGIN)   25X1X6                              보충(SUPPLEMENT)\n\n25X1A6a\n\n[삭제] (주: 이 주제에 관한 추가 정보는 [판독 불가].)\n25X1A2g\n\n1. 북조선에서 여행하는 데 필요한 것은 신분증명서(personal identification card)와 콜레라 증명서뿐이다. 모든 사람은 여행에 앞서 콜레라 예방주사를 맞아야 한다. 여행자가 속한 「구역(section)」 책임자의 서면 허가는 있는 편이 낫지만 반드시 필요하지는 않으며, 대부분의 여행자는 굳이 받지 않는다. 북조선의 각 군(district)은 「구역」으로 나뉘고, 한 「구역」은 보통 약 29호(families) [원문 그대로]로 이루어진다.\n\n2. 모든 철도역에서 제복을 입은 철도경비대(Railway Constabulary, Ch'ol To Kyong Pi Tae [한자 판독 불가]) 대원의 검문이 이루어지고 있다. 보통 검사원 한 명이 매표원 옆에 앉아 있고, 표를 사려는 사람은 모두 신분증명서와 콜레라 증명서를 보여야 표를 살 수 있다. 검사는 형식적이나, 표를 사는 사람이 의심스럽다고 여겨지면 그렇지 않다. 의심을 받는 것은 대체로 16세에서 23세 사이의 젊은이 가운데 어떤 「공인」(북조선 공산정부가 후원하는) 단체에도 속하지 않은 사람이거나, 짐을 많이 지녔거나 이상한 종류의 짐을 지닌 사람이다. 보통 다음과 같은 질문을 한다. \"어느 정당이나 공인 단체의 성원인가?\" \"아니라면 왜 아닌가?\" \"어디로 가는가?\" \"여행의 목적은 무엇인가?\" 철도경비대 대원들은 열차 시각 전에 역 안을 돌아다니며 열차를 기다리는 사람들을 자주 심문하기도 한다.\n\n열차마다 검사원이 네 명 내지 다섯 명 탄다. 열차의 검사원은 거의 모두 제복 차림이다. 7월 동안 북조선의 열차에서 직접 목격된 사복 검사원은 둘뿐이었다. 이들은 평양(Pyongyang 평양, 일본식 Heijo) (125-44, 39-01)과 정주(Chongju 정주, 일본식 Teishu) (125-12, 39-42) 사이를 오가는 열차에 있었다. 검사원들은 시발역에서 종착역까지 같은 열차를 타지 않고 노선 중간에서 다른 검사원과 교대한다. 검사원들은 열차 전체를 훑으며 의심스러운 사람을 모두 심문한다. 다만 심문받는 사람의 수는 승객 수에 견주면 매우 적다. 승객 열 명 가운데 한 명이 넘지 않을 것이다.\n\n분류(CLASSIFICATION) 기밀 통제(CONFIDENTIAL CONTROL) 미국 관리 전용(U. S. OFFICIALS ONLY)\n\n문서번호(Document No.) 077 [원문 그대로]\n등급 변경 없음(No CHANGE in Class.) [판독 불가]\n[ ] 비밀해제(DECLASSIFIED)\n등급 변경(Class. CHANGED TO): TS  S\nDDA 각서, [판독 불가]\n근거(Auth.): [판독 불가]\n\n공개 승인 1999/09/08 : CIA-RDP82-00457R001000030014-6\n\n———\n\n공개 승인 1999/09/08 : CIA-RDP82-00457R001000030014-6\n\n25X1A2g\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n함흥(Hamhung 함흥, 일본식 Kanko) (127-32, 39-54) 철도역에는 철도경비대 분소가 있다. 의심스러운 승객은 이 역에서 열차에서 내려지는 일이 잦으며, 제복을 입은 철도경비대 대원이 이 사무소에서 심문한다. 대원의 관심은 주로 의심받는 사람이 자기 신분증명서에 적힌 내용을 잘 알고 있는지를 확인하는 데 있는 것으로 보인다. 심문은 매우 격식 없는 [판독 불가] (원문 `M@iocka`)로 이루어진다.\n\n북조선에서 개인이나 가족이 한 구역의 거처에서 다른 구역의 거처로 옮기는 것은 어렵고 번거로운 절차다. 먼저 그 개인이나 가족이 떠나는 구역의 책임자에게서 허가서를 받아야 하고, 거기에 군 책임자의 서명을 받아야 한다. 새 거처로 옮긴 뒤에는 그 개인이나 가족이 새 구역 책임자에게 허가서를 제출해야 하며, 그 책임자가 이를 자기 군 책임자에게 올린다.\n\n모든 여관 주인은 투숙객 명부를 갖추고 투숙객의 신분증명서에 적힌 모든 정보를 적어 두어야 한다. 매일 저녁 20시에 그 정보는 보안대(Peace Preservation Corps, Po An Tae [한자 판독 불가])에 넘겨지며, 보안대가 정보를 대조하고 의심을 산 투숙객을 조사한다.\n\n1947년 4월 김일성(KIM Il-sung) 장군이 낸 명령, 곧 외박하는 손님을 받은 집은 그 손님을 구역 책임자에게 신고하라는 명령은 엄하게 시행되지 않고 있다. 위반이 많았으나 거의 또는 전혀 문제 삼지 않았다.\n\n이 문서는 미합중국의 국방에 관계된 정보로서 개정된 간첩법(Espionage Act, 50, U.S.C. 31 및 32)의 적용을 받는 정보를 담고 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방법으로든 누설하는 것은 법으로 금지된다.\n\n기밀 통제(CONFIDENTIAL CONTROL)\n미국 관리 전용(U. S. OFFICIALS ONLY)\n\n공개 승인 1999/09/08 : CIA-RDP82-00457R001000030014-6", "secondary": "CONFIDENTIAL CONTROL\nU.S. OFFICIALS ONLY\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCOUNTRY   Korea                                              DATE:\n                                                             INFO.  25X1X6\nSUBJECT   Political Information: Controls in North Korea      DIST. [판독 불가]tober 1347 [원문 그대로]\n25X1A6a                                                      PAGES  2\n\nORIGIN    25X1X6                                             SUPPLEMENT\n\n25X1A6a\n\n[삭제] (Note: [판독 불가] further information on this subject.)\n25X1A2g\n\n1. The only requisites for traveling in North Korea are a personal identification card and a cholera certificate. All persons must receive cholera shots before making a trip. Written permission from the traveler's \"section\" leader is desirable but not necessary and most travelers do not bother to obtain it. Each district in North Korea is divided into \"sections\", each \"section\" usually consisting of about 29 families [원문 그대로].\n\n2. Inspections by uniformed members of the Railway Constabulary (Ch'ol To Kyong Pi Tae [한자 판독 불가]) are being conducted in all railway stations. Usually an inspector sits next to the ticket seller and all ticket purchasers are required to show him their identification cards and cholera certificates before a ticket can be purchased. The inspection is superficial, except when the purchaser is considered suspicious. Those regarded as suspicious are generally young people between the ages of 16 and 23 who do not belong to any \"official\" (North Korean Communist Government sponsored) organization or those persons carrying a large amount, or a peculiar kind, of luggage. Such questions as the following are usually asked: \"Are you a member of any political party or official organization?\" \"If not, why not?\" \"Where are you going?\" \"What is the purpose of your trip?\" Members of the Railway Constabulary also move about in the station before train time and often question persons who are waiting for trains.\n\nThere are four or five inspectors on each train. Almost all the inspectors on the trains are in uniform. Only two plain clothes inspectors were personally observed on trains in North Korea during July. These were on a train running between Pyongyang (Heijo) (125-44, 39-01) and Chongju (Teishu) (125-12, 39-42). The inspectors do not ride the same train from its point of origin to its final destination, but are replaced by other inspectors along the route. The inspectors go through the entire train and question all suspicious persons. However, the number of persons questioned is very low in proportion to the number of passengers. Probably not more than one out of every ten passengers is questioned.\n\nCLASSIFICATION CONFIDENTIAL CONTROL U. S. OFFICIALS ONLY\n\nDocument No. 077 [원문 그대로]\nNo CHANGE in Class. [판독 불가]\n[ ] DECLASSIFIED\nClass. CHANGED TO: TS  S\nDDA Memo, [판독 불가]\nAuth: [판독 불가]\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R001000030014-6\n\n———\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R001000030014-6\n\n25X1A2g\n\nCENTRAL INTELLIGENCE GROUP\n\nIn the railway station at Hamhung (Kanko) (127-32, 39-54) there is a branch office of the Railway Constabulary. Suspicious passengers are often removed from trains at this station and questioned in this office by a uniformed member of the Railway Constabulary who seems to be primarily interested in ascertaining whether the person under suspicion is familiar with the information contained on his personal identification card. The questioning is conducted in a very informal [판독 불가] (원문 `M@iocka`).\n\nFor an individual or a family in North Korea to move from a residence in one section to one in another section is a difficult and involved procedure. A permit must first be obtained from the leader of the section from which the individual or family is moving and must be signed by the leader of the district. After moving into the new residence, the individual or family must submit the permit to the new section leader who forwards it to his district leader.\n\nAll hotel keepers are required to keep a register of their guests and to obtain all information contained on the guest's identification card. At 2000 hours every evening the information is turned over to the Peace Preservation Corps (Po An Tae [한자 판독 불가]) which checks the information and investigates any guest who has aroused suspicion.\n\nThe order issued by General KIM Il-sung in April 1947 requiring any family having an overnight visitor to register the visitor with the section leader is not being rigidly enforced. There have been many violations to which little or no attention has been paid.\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nCONFIDENTIAL CONTROL\nU. S. OFFICIALS ONLY\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R001000030014-6", "notes": ["[삭제·공개 표시] Approved For Release 1999/09/08 : CIA-RDP82-00457R001000030014-6 (두 면의 공개 승인 도장)", "[삭제·공개 표시] 25X1X6 (INFO. 줄과 ORIGIN 줄), 25X1A6a (PAGES 줄과 여백), 25X1A2g (1면 첫 대목과 2면 머리)", "[삭제·공개 표시] ORIGIN 줄 아래의 출처 설명과 추가 정보를 가리키는 주석이 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] Document No. 077 / No CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S / DDA Memo 의 등급 처리 도장"], "note": "본문의 서술은 이 계열에서 잘 읽히는 편이고 머리와 도장 부분이 심하게 뭉개졌다. 배포 날짜가 `¥ tober 1347` 로 찍혀 월 앞 글자와 연도가 깨져 있다. 1947년 10월로 보이나 날짜의 숫자는 고치지 않았다. 문서번호 `077` 도 그대로 두었다. 1항의 한 구역 호수 `about 29 families` 는 20의 오독으로 보이나 통계 숫자여서 고치지 않고 [원문 그대로]로 표시했다. 좌표는 넷 다 온전하다. 2면 첫 문단 끝의 `M@iocka` 는 manner 로 보이나 확정되지 않아 [판독 불가]로 두었다. 조선말 이름의 한자는 모두 뭉개져 [한자 판독 불가]로 두었다. 기관 이름은 원문 표기를 앞세웠다. `Railway Constabulary` 는 철도경비대, `Kyong Pi Tae` 는 경비대, `Peace Preservation Corps (Po An Tae)` 는 보안대다. 지명은 조선 이름과 일본식 이름을 둘 다 살렸다. 1면의 셋째 문단과 2면의 네 문단은 원문에 번호가 없어 번호를 새로 매기지 않았다.", "warn": false, "search": "KIM Il-sung 김일성 (장군. 1947년 4월 외박객 신고 명령을 냈다고 적었다. 원문은 `General Kil. Ilesung`) Approved For Release 1999/09/08 : CIA-RDP82-00457R001000030014-6 (두 면의 공개 승인 도장) 25X1X6 (INFO. 줄과 ORIGIN 줄), 25X1A6a (PAGES 줄과 여백), 25X1A2g (1면 첫 대목과 2면 머리) ORIGIN 줄 아래의 출처 설명과 추가 정보를 가리키는 주석이 먹칠되어 [삭제]로 옮겼다 Document No. 077 / No CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S / DDA Memo 의 등급 처리 도장 Political Information: Controls in North Korea"}, {"id": "N48", "order": 71, "date": "1947-10-09", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "정치 첩보: 남북 사이의 통행 통제", "badge": "confidential control — U.S. officials only", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-10-09"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Political Information: Travel Controls between North and South Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r001000030015-5"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r001000030015-5"}], "summary": "38선을 넘어 북조선으로 들어오는 사람을 어떻게 걸러 내는지를 적었다. 세 겹의 경계선과 신천리 국경수용소의 운영, 남으로 가는 사람에게 금지된 물건을 다룬다.", "points": ["38선을 따라 북조선 쪽에 세 겹의 경계선이 있다. 첫째는 소련군으로 짐만 아주 꼼꼼히 살핀다.", "둘째는 북조선 경비대(Kyong Pi Tae)다. 신분증명서와 콜레라 예방접종 증명서를 확인하고 짐을 묻는다. 정보원은 이들이 철도경비대와 비슷한 제복을 입은 것을 근거로 그렇게 판단했다.", "셋째는 보안대(Po An Tae)다.", "남에서 북으로 들어오는 사람은 모두 38선 부근의 국경수용소로 보내져 일주일가량 머문다.", "신천리 수용소는 보안대가 관할하고 조선인 YOM San-tiae 가 책임자다. 그는 신천리 지역 보안대의 우두머리이기도 하다. 7월 초에 여행자 30명이 있었다. 밥값은 본인이 내고 잠자리는 공짜다.", "북조선에 집이 있는 사람은 신분증명서를 수용소에 빼앗기고, 그 증명서는 사는 구역의 책임자에게 보내진다. 구역 책임자가 그 사람의 이후 행동을 더 가까이 살피게 하려는 것이다.", "증명서를 빼앗긴 사람은 도중에 검문을 받으면 금천(Kumchon)에서 조선 당국이 가져갔다고 말하라는 지시를 받는다.", "수용소 운영은 허술하다. 몸수색이 없고 신문도 깊지 않으며 「공작원」이나 반공 성향을 가려내려는 시도가 보이지 않는다.", "남으로 가는 사람은 라디오, 각종 기계, 전기 기구, 많은 돈과 금을 가져갈 수 없다. 다만 장사꾼과 여행자 다수가 산길로 검문 지점을 피해 물건을 밀반출한다."], "primary": "공개 승인 1999/09/08 : CIA-RDP82-00457R001000030015-5\n\n기밀 통제(CONFIDENTIAL CONTROL)\n미국 관리 전용(U.S. OFFICIALS ONLY)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n첩보보고(INTELLIGENCE REPORT)\n\n국가   조선(Korea)                                 일자: 25X1X6\n                                                   정보일(INFO.)\n주제   정치 첩보: 남북 조선 사이의 통행 통제\n                                                   배포(DIST.) [판독 불가] 1947년 10월\n25X1A6a                                            면수 [판독 불가]\n\n출처(ORIGIN)   25X1X6                               보충(SUPPLEMENT)\n\n1. 북조선 쪽 38선을 따라 북조선으로 들어오는 모든 사람을 검문하는 세 겹의 경계선이 있다.\n\n2. 38선에 가장 가까운 첫째 경계선은 소련군으로 이루어진다. 이 소련군은 여행자 각자의 짐과 소지품만을 아주 꼼꼼히 살핀다.\n\n3. 둘째 경계선은 북조선 경비대(North Korean Constabulary, Kyong Pi Tae [한자 판독 불가]) 대원으로 이루어진다. (안둥 주(Antung Note): 정보원은 이 병력이 철도경비대(Railway Constabulary) 대원이 입는 것과 매우 비슷한 제복을 입고 있다는 사실에 근거해 이렇게 판단하였다.) 이 병력은 여행자의 신분증명서와 콜레라 예방접종 증명서를 확인하고 짐과 소지품에 관해 묻기도 한다.\n\n4. 셋째 경계선은 보안대(Peace Preservation Corps, Po An Tae [한자 판독 불가]) 대원으로 이루어진다.\n\n5. 남조선에서 북조선으로 들어오는 사람은 모두 38선 부근의 국경수용소(border camps) 가운데 한 곳으로 보내져 약 일주일 동안 그곳에 머문다.\n\n신천리(Sinchonni)의 국경수용소 [판독 불가]\n\n6. 신천리(Sinchonni) (126-50, 48-02) [원문 그대로]에 이런 수용소 가운데 하나가 있으며 보안대의 관할 아래 있다.\n\n7. 조선인 YOM San-tiae [원문 그대로]([한자 판독 불가])가 이 수용소의 책임자다. 그는 신천리 지역 보안대(Po An Tae [한자 판독 불가])의 우두머리이기도 하다.\n\n8. 7월 초에 이 수용소에는 여행자 30명이 있었다.\n\n9. 이 수용소에 머무는 사람은 모두 밥값을 스스로 내야 하나 잠자리는 무료로 제공된다.\n\n10. 여행자의 집이 북조선에 있으면 수용소 당국이 그의 신분증명서를 빼앗아 그가 사는 [판독 불가] 구역(section)의 책임자에게 보낸다. 이는 구역\n\n25X1A6a\n\n공개 승인 1999/09/08 : CIA-RDP82-00457R001000030015-5\n\n———\n\n책임자가 해당 인물의 이후 행동을 더 가까이 살피게 하려는 것이다. 그런 다음 수용소 당국은 여행자에게, 집으로 가는 길에 검사원이 붙잡거든 금천(Kumchon 금천, 일본식 Kinsen) (126-23, 38-10)에서 조선 당국이 신분증명서를 가져갔다고 말하라고 이른다. ([판독 불가] 주: 금천은 신천리의 국경수용소에서 약 9마일 떨어진 곳으로 이 일대에서 가장 큰 읍이며, 따라서 그 지역 보안대(Po An Tae) 당국의 본부가 있는 곳일 수 있다.)\n\n신천리의 수용소는 그리 체계 있게 운영되지 않는다. 여행자의 몸을 수색하지 않으며, 여행자에 대한 신문도 대개 그리 철저하지 않아 신원이나 여행 이유를 묻지 않는다. 여행자를 걸러 「공작원(agents)」이나 반공 성향을 지닌 사람을 찾아내려는 시도는 보이지 않는다.\n\n신천리의 수용소는 북조선에서 남조선으로 가는 사람을 조사하는 데에도 보안대 당국이 쓰고 있다. 이런 여행자들은 며칠 동안 수용소에 붙잡아 둔다. 짐을 꼼꼼히 검사하고 신분증명서를 빼앗은 뒤에야 남조선으로 떠나는 것을 허락한다.\n\n북조선에서 남조선으로 가는 여행자는 라디오, 온갖 종류의 기계, 온갖 종류의 전기 기구, 그리고 많은 액수의 돈과 금을 가져가는 것이 금지된다. 그러나 많은 상인과 여행자가 산길로 다니며 검사가 이루어지는 지점을 피해 물건을 남조선으로 밀반출한다.\n\n이 문서는 미합중국의 국방에 관계된 정보로서 개정된 간첩법(Espionage Act, 50, U.S.C. 31 및 32)의 적용을 받는 정보를 담고 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방법으로든 누설하는 것은 법으로 금지된다.\n\n분류(CLASSIFICATION) 기밀 통제(CONFIDENTIAL CONTROL) 미국 관리 전용(U. S. OFFICIALS ONLY)\n\n[REFERENCE CENTER LIBRARY 도장]\nDDA 각서, 1977년 4월 4일\n근거(Auth.): [판독 불가]\n일자: [판독 불가]\n\n공개 승인 1999/09/08 : CIA-RDP82-00457R001000030015-5", "secondary": "Approved For Release 1999/09/08 : CIA-RDP82-00457R001000030015-5\n\nCONFIDENTIAL CONTROL\nU.S. OFFICIALS ONLY\n\nCENTRAL INTELLIGENCE GROUP\nINTELLIGENCE REPORT\n\nCOUNTRY   Korea                                     DATE: 25X1X6\n                                                     INFO.\nSUBJECT   Political Information: Travel Controls between\n          North and South Korea                      DIST. [판독 불가] October 1947\n25X1A6a                                              PAGES [판독 불가]\n\nORIGIN    25X1X6                                     SUPPLEMENT\n\n1. Along the 38th parallel in North Korea there are three lines of guards to check on all persons entering North Korea.\n\n2. The first line of guards nearest the 38th parallel consists of Soviet troops. These Soviet troops merely check each traveler's luggage and other belongings very closely.\n\n3. The second line of guards consists of members of the North Korean Constabulary (Kyong Pi Tae [한자 판독 불가]). (Antung Note: Source bases this information on the fact that these troops wear uniforms very similar to those worn by members of the Railway Constabulary.) These troops check for the travelers' personal identification cards and cholera inoculation certificates and also ask questions concerning their baggage and other belongings.\n\n4. The third line of troops consists of members of the Peace Preservation Corps (Po An Tae [한자 판독 불가]).\n\n5. All persons entering North Korea from South Korea are sent to one of several border camps near the 38th parallel and remain there for about one week.\n\nBorder Camp [판독 불가] at Sinchonni\n\n6. At Sinchonni (126-50, 48-02) [원문 그대로] there is one of these camps which is under the supervision of the Peace Preservation Corps.\n\n7. YOM San-tiae [원문 그대로] ([한자 판독 불가]), a Korean, is in charge of this camp. He is also the head of the Peace Preservation Corps (Po An Tae [한자 판독 불가]) in the Sinchonni area.\n\n8. In the early part of July there were 30 travelers at this camp.\n\n9. All persons held at this camp must pay for their food but are given free lodging.\n\n10. If the traveler's home is in North Korea, his personal identification card is taken from him by the camp authorities and sent to the leader of the [판독 불가] section in which he lives. This is done in order to have the section\n\n25X1A6a\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R001000030015-5\n\n———\n\nleader maintain a closer check on the future activities of the individual concerned. The traveler is then told by the camp authorities to inform all inspectors who stop him while he is enroute home that his identification card had been taken from him by Korean authorities at Kumchon (Kinsen) (126-23, 38-10). ([판독 불가] Note: Kumchon, approximately nine miles from the border camp at Sinchonni, is the largest town in the area and, therefore, is possibly the seat of the headquarters of the local Peace Preservation Corps (Po An Tae) authorities.)\n\nThe camp at Sinchonni is not run very systematically. No search of the traveler's person is made and usually the interrogation of the traveler is not very thorough, no questions being asked as to his background or his reasons for traveling. No attempt seems to be made to screen the travelers to discover any \"agents\" or persons with anti-Communist tendencies.\n\nThe camp at Sinchonni is also used by the Peace Preservation Corps authorities for investigating people going into South Korea from North Korea. These travelers are kept at the camp for several days. Their luggage is carefully checked and their personal identification cards taken from them before they are permitted to leave for South Korea.\n\nTravelers from North Korea to South Korea are prohibited from taking along radios, machines of any kind, electrical appliances of any kind, and large amounts of money and gold. However, many merchants and travelers smuggle their goods into South Korea by traveling over mountain routes and avoiding those points where inspections are made.\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nCLASSIFICATION CONFIDENTIAL CONTROL U. S. OFFICIALS ONLY\n\n[REFERENCE CENTER LIBRARY 도장]\nDDA Memo, 4 Apr 77\nAuth: [판독 불가]\nDate: [판독 불가]\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R001000030015-5", "notes": ["[삭제·공개 표시] Approved For Release 1999/09/08 : CIA-RDP82-00457R001000030015-5 (두 면의 공개 승인 도장)", "[삭제·공개 표시] 25X1X6 (DATE 줄과 ORIGIN 줄)", "[삭제·공개 표시] 25X1A6a (PAGES 줄과 1면 아래 여백)", "[삭제·공개 표시] REFERENCE CENTER LIBRARY 도장과 DDA Memo, 4 Apr 77 의 등급 처리 도장", "[삭제·공개 표시] PAGES 칸의 면수가 뭉개져 읽히지 않는다"], "note": "좌표를 고치지 않았다. 6항 신천리의 `(126-50, 48-02)` 는 위도가 48도로 찍혀 38선 부근이라는 본문과 맞지 않으나 그대로 두었다. 금천의 `(126-23, 38-10)` 은 온전하다. 금천은 원문에 `Kuwachon {sinsen}` 과 `Kucchon` 으로 두 번 다르게 찍혔는데, 일본식 이름 Kinsen 이 함께 적혀 있어 금천(金川)으로 읽고 표기를 통일했다. 7항의 인명 `YOM San-tiae` 는 뒤 음절을 확정할 수 없어 원문 표기를 그대로 두었다. 한자는 모두 뭉개져 [한자 판독 불가]로 두었다. 기관 이름은 원문 표기를 앞세웠다. 이 문서는 경비대(Kyong Pi Tae)를 North Korean Constabulary 로, 보안대(Po An Tae)를 Peace Preservation Corps 로 적어 둘을 다른 조직으로 세운다. 3항의 `(Antung Note:)` 는 안둥 현장에서 붙인 주석으로 정보원의 판단 근거를 밝힌 대목이라 살렸다. 10항은 면이 갈리는 중간에서 끊기며, 2면의 이어지는 세 문단에는 번호가 없어 새로 매기지 않았다. 1면 아래쪽에 `i2 4` 와 `'spections are made.` 같은 조각이 겹쳐 찍혀 있는데 뒤 문단의 끝부분이 밀려 들어온 것으로 보아 본문에 넣지 않았다.", "warn": false, "search": "YOM San-tiae (신천리 국경수용소 책임자이자 그 지역 보안대 우두머리. 원문 표기를 그대로 두었고 한자는 판독 불가) Approved For Release 1999/09/08 : CIA-RDP82-00457R001000030015-5 (두 면의 공개 승인 도장) 25X1X6 (DATE 줄과 ORIGIN 줄) 25X1A6a (PAGES 줄과 1면 아래 여백) REFERENCE CENTER LIBRARY 도장과 DDA Memo, 4 Apr 77 의 등급 처리 도장 PAGES 칸의 면수가 뭉개져 읽히지 않는다 Political Information: Travel Controls between North and South Korea"}, {"id": "N49", "order": 72, "date": "1947-10-13", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "군사 첩보: 만주의 공산군에 대한 소련의 지원, 만주의 조선인 부대와 몽골인 부대", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-10-13"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Soviet Aid to Communists, Manchuria; Korean and Mongolian Troops, Manchuria", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r001000030013-7"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r001000030013-7"}], "summary": "1947년 8월과 9월 만주에서 들어온 짧은 보고 여섯 항을 모았다. 소련이 훈련한 장교와 조종사, 소련이 넘긴다는 비행기, 그리고 조선인 병력의 이동을 항마다 정보원을 밝혀 적었다.", "points": ["소련이 훈련한 장교들이 새 종대(column) 셋의 핵심을 이룬다. 이들은 블라디보스토크에서 소련이 마련한 특별 7개월 과정을 받았고, 새 종대의 훈련병은 7월부터 헤이허툰 일대에서 징집되었다.", "소련이 훈련한 중국인 조종사 300명이 자무쓰에 도착했다는 보고가 있다. 소련이 공산군에 비행기 100대를 주며 이달 안에 하얼빈으로 인도한다.", "8월 10일에서 21일 사이 옌지에서 온 조선인 5,000명이 자오허를 지나 판스와 하이룽으로 향했다.", "8월 16일에서 26일 사이 조선인 병력 2,000명이 쑤이펀허에서 하얼빈에 도착했다. 지휘관은 KIM Ch'aek 김책이다.", "8월 26일에서 9월 3일 사이 소속 불명의 조선인 병력 6,000명이 안둥에 도착했다. 일본제 38식 소총을 지니고 누런 군복을 입었다.", "9월 23일 자로 몽골인 병력 2,090명이 푸위에 도착했다.", "항마다 정보원을 밝힌다. 자무쓰 일대의 국민당 정보원, 국민당 동북사령부, 하얼빈의 국민당 정보원이다."], "primary": "공개 승인 1999/09/08 : CIA-RDP[판독 불가]457R00[판독 불가]\n\n25X1A2g\n기밀(CONFIDENTIAL)   25X1A9A\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n첩보보고(INTELLIGENCE REPORT)\n\n국가   중국(China)                                일자:\n                                                  정보일(INFO.)  기재한 바와 같음(As stated)\n주제   군사 첩보: 만주의 공산군에 대한 소련의 지원,\n       만주의 조선인 부대와 몽골인 부대               배포(DIST.)  1947년 10월 6일\n25X1A6a                                           면수  2\n\n출처(ORIGIN)   [판독 불가]\n\n25X1X6\n\n25X1X6   8월 2[판독 불가]일\n\n1. 소련이 훈련한 장교들이 헤이허툰(Heihotun) (127-31, 50-15) 남쪽 훈련장에서 훈련을 마쳐 가는 새 종대(column) 셋의 핵심을 이룬다. 이 장교들은 블라디보스토크(Vladivostok)에서 소련이 마련한 특별 7개월 과정으로 훈련받았다. 세 새 종대의 훈련병은 7월부터 헤이허툰 일대에서 징집되었다.\n\n제2항의 정보원(Source for Par. 2): 자무쓰(Chiamussu) 일대에서 온 국민당 정보원\n\n[판독 불가] 9월\n\n2. 소련이 훈련한 중국인 조종사 300명이 자무쓰(Chiamussu 佳木斯) (130-21, 46-49)에 도착하였다고 보고되었다.\n\n소련은 공산군에 비행기 100대를 주고 있으며 이달 안에 하얼빈(Harbin)으로 인도될 것이다.\n\n제3항의 정보원: 국민당 동북사령부(Nationalist Northeast Command Headquarters)\n\n9월 24일\n\n3. 8월 10일에서 21일 사이에 옌지(Yenchi 延吉) (129-31, 42-55)에서 온 조선인 5,000명이 판스(Panshih 磐石) (125-58, 42-56)와 하이룽(Hailung 海龍) (125-48, 42-39)으로 가는 길에 자오허(Chiaoho 蛟河) (127-20, 43-43)를 지났다.\n\n제4항의 정보원: 하얼빈의 국민당 정보원\n\n9월 22일\n\n4. 8월 16일에서 26일 사이에 조선인 병력 2,000명이 쑤이펀허(Suifenho 綏芬河) (131-09, 44-23)에서 하얼빈에 도착하였다. 지휘관은 KIM Ch'aek 김책이다.\n\n분류(CLASSIFICATION) 기밀(CONFIDENTIAL)\n\n문서번호(Document No.) 010 [원문 그대로]\n등급 변경 없음(No CHANGE in Class.) [판독 불가]\n[ ] 비밀해제(DECLASSIFIED)\n등급 변경(Class. CHANGED TO): TS  S  C\nDDA 각서, 1977년 4월 4일\n근거(Auth.): DDA REG. 77/[판독 불가]\n일자: [판독 불가]\n\n공개 승인 1999/09/08 : CIA-RDP82-00457R001000030013-7\n\n———\n\n25X1A2g\n\n공개 승인 1999/09/08 : CIA-RDP82-00457R00[판독 불가]\n\n25X1X6   [판독 불가]\n\n5. 8월 26일에서 9월 3일 사이에 소속을 알 수 없는 조선인 병력 6,000명이 안둥(Antung 安東)에 도착하였다. 이 병력은 일본제 M-38 소총을 지니고 누런 군복을 입고 있다.\n\n9월 23일\n\n6. 몽골인 병력 2,090명 [원문 그대로]이 푸위(Fuyu 扶餘) (124-49, 45-11)에 도착하였다.\n\n이 문서는 미합중국의 국방에 관계된 정보로서 개정된 간첩법(Espionage Act, 50, U.S.C. 31 및 32)의 적용을 받는 정보를 담고 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방법으로든 누설하는 것은 법으로 금지된다.\n\n공개 승인 1999/09/08 : CIA-RDP82-00457R001000030013-7", "secondary": "Approved For Release 1999/09/08 : CIA-RDP[판독 불가]457R00[판독 불가]\n\n25X1A2g\nCONFIDENTIAL   25X1A9A\n\nCENTRAL INTELLIGENCE GROUP\nINTELLIGENCE REPORT\n\nCOUNTRY   China                                              DATE:\n                                                              INFO.  As stated\nSUBJECT   Military Information: Soviet Aid to Communists,\n          Manchuria; Korean and Mongolian Troops, Manchuria   DIST.  6 October 1947\n25X1A6a                                                       PAGES  2\n\nORIGIN    [판독 불가]\n\n25X1X6\n\n25X1X6   2[판독 불가] August\n\n1. Soviet-trained officers comprise the nucleus of three new columns now completing training in a camp south of Heihotun (127-31, 50-15). These officers were trained in Vladivostok in a special seven-month course sponsored by the Soviets. Trainees for the three new columns were drafted in the Heihotun area, beginning in July.\n\nSource for Par. 2: Nationalist informant from Chiamussu area\n\n[판독 불가] September\n\n2. It is reported that 300 Soviet-trained Chinese pilots have arrived in Chiamussu (130-21, 46-49).\n\nThe Soviets are giving the Communists 100 planes which will be delivered to Harbin this month.\n\nSource for Par. 3: Nationalist Northeast Command Headquarters\n\n24 September\n\n3. 5,000 Koreans from Yenchi (129-31, 42-55) passed through Chiaoho (127-20, 43-43) enroute to Panshih (125-58, 42-56) and Hailung (125-48, 42-39) between 10 and 21 August.\n\nSource for Par. 4: Nationalist informant, Harbin\n\n22 September\n\n4. 2,000 Korean troops arrived in Harbin from Suifenho (131-09, 44-23) between 16 and 26 August. The commander is KIM Ch'aek.\n\nCLASSIFICATION CONFIDENTIAL\n\nDocument No. 010 [원문 그대로]\nNo CHANGE in Class. [판독 불가]\n[ ] DECLASSIFIED\nClass. CHANGED TO: TS  S  C\nDDA Memo, 4 Apr 77\nAuth: DDA REG. 77/[판독 불가]\nDate: [판독 불가]\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R001000030013-7\n\n———\n\n25X1A2g\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R00[판독 불가]\n\n25X1X6   [판독 불가]\n\n5. Between 26 August and 3 September a group of 6,000 unidentified Korean troops arrived in Antung. These troops carry Japanese M-38 rifles and wear yellow uniforms.\n\n23 September\n\n6. 2,090 [원문 그대로] Mongolian troops arrived at Fuyu (124-49, 45-11).\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R001000030013-7", "notes": ["[삭제·공개 표시] Approved For Release 1999/09/08 : CIA-RDP82-00457R001000030013-7 (두 면의 공개 승인 도장. 두 곳은 도장 자체가 뭉개져 있다)", "[삭제·공개 표시] 25X1A2g (양면 머리), 25X1A9A (제호 옆), 25X1A6a (PAGES 줄), 25X1X6 (ORIGIN 아래와 2면 머리)", "[삭제·공개 표시] ORIGIN 줄의 출처 표시가 읽히지 않는다", "[삭제·공개 표시] 제1항의 정보원을 밝히는 줄이 남아 있지 않다. 제2항부터 제4항까지만 정보원 줄이 붙는다", "[삭제·공개 표시] Document No. 010 / No CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S C / DDA Memo, 4 Apr 77 의 등급 처리 도장"], "note": "항마다 정보원과 정보 취득일을 밝히는 짜임이라 그 줄을 모두 살렸다. 좌표를 고치지 않았다. 여덟 곳 모두 자릿수가 온전하다. 병력 수도 고치지 않았다. 6항의 `2,090` 은 2,000의 오독으로 보이나 통계 숫자여서 [원문 그대로]로 표시했다. 1항 위의 날짜 `2h august` 는 뒷자리를 확정할 수 없어 2[판독 불가]일로 두었고, 2항 위의 `sux. aeptenber` 도 [판독 불가]로 두었다. 5항의 소총 표기는 원문이 `i--38` 로 뭉개져 있다. 일본군 38식 소총을 가리키는 것이 분명하므로 M-38 로 옮겼다. 지명은 중국 쪽이 대부분이라 한자를 병기했다. 원문에 한자가 없는 대목이므로 스캔 판독과 무관하다. 자오허는 원문에 `Chiacho` 로 찍혀 있어 좌표와 경로로 미루어 Chiaoho 로 읽었다.", "warn": false, "search": "KIM Ch'aek 김책 (하얼빈에 도착한 조선인 병력 2,000명의 지휘관) Approved For Release 1999/09/08 : CIA-RDP82-00457R001000030013-7 (두 면의 공개 승인 도장. 두 곳은 도장 자체가 뭉개져 있다) 25X1A2g (양면 머리), 25X1A9A (제호 옆), 25X1A6a (PAGES 줄), 25X1X6 (ORIGIN 아래와 2면 머리) ORIGIN 줄의 출처 표시가 읽히지 않는다 제1항의 정보원을 밝히는 줄이 남아 있지 않다. 제2항부터 제4항까지만 정보원 줄이 붙는다 Document No. 010 / No CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S C / DDA Memo, 4 Apr 77 의 등급 처리 도장 Military Information: Soviet Aid to Communists, Manchuria; Korean and Mongolian Troops, Manchuria"}, {"id": "N50", "order": 73, "date": "1947-10-27", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "경제 첩보: 청진을 드나드는 철도 운행", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-10-27"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Economic Information: Rail Traffic to and from Chongjin", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r001000320006-3"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r001000320006-3"}], "summary": "청진에서 원산·평양·신북청으로 오가는 열차의 편성과 시각을 적고, 1947년 6월에 청진을 드나든 화물을 날짜별로 적었다.", "points": ["청진에서 원산, 평양, 신북청으로 각각 화물열차 한 편과 여객열차 한 편이 매일 떠나고 매일 들어온다.", "여객열차는 보통 일고여덟 량이고 그중 한두 량은 짐칸이다. 한 편에 대략 700에서 800명을 실어 나른다.", "청진과 신북청 사이는 15시간, 청진과 원산 사이는 17시간, 평양과 청진 사이는 약 22시간 걸린다.", "화물열차 시각은 불규칙하다.", "6월 13일 소금과 [판독 불가]와 관을 실은 화차 세 량이 평양에서 청진에 들어온다.", "6월 14일 두만(Tumen)에서 좁쌀 5,000부대를 실은 열차가 평양으로 가며 청진을 지난다.", "6월 15일 휘발유 500통과 기름 100통이 평양에서 청진에 들어온다.", "6월 21일 소금 100톤이 청진에서 상삼봉으로 나가고, 같은 날 전동기와 변압기와 케이블과 강관을 실은 화물열차가 나진동으로 떠난다.", "신북청의 일본식 이름을 두고 미군 지도와 자료가 엇갈린다는 주석이 붙는다."], "primary": "공개 승인 1999/09/08 : CIA-RDP82-00457R001000320006-3\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n첩보보고(INTELLIGENCE REPORT)\n\n국가   조선(Korea)                                일자:  25X1A6a\n\n주제   경제 첩보: 청진을 드나드는 철도 운행           배포(DIST.)  1947년 10월 27일\n25X1A6a                                           면수  2\n\n출처(ORIGIN)   [판독 불가]\n\n25X1X6\n\n1. [판독 불가] 청진(Chongjin 청진, 일본식 Seishin) (129-49, 41-46)에서 다음 도시들로 각각 화물열차 한 편과 여객열차 한 편이 매일 떠난다. 원산(Wonsan 원산, 일본식 Genzan) (12726, 39-10) [원문 그대로], 평양(Pyongyang 평양, 일본식 Heijo) (125-44, 39-01), 신북청(Sinbukchong 신북청, 일본식 Shinhokusei) (128-22, 40-10)이다. 이 도시들에서 청진으로도 화물열차 한 편과 여객열차 한 편이 25X1X6 매일 들어온다. 여객열차는 보통 일곱 량 내지 여덟 량이고, 그 가운데 한두 량은 짐을 싣는 데 쓴다. 열차 한 편은 보통 승객 약 700명에서 800명을 실어 나른다.\n\n25X1A6a\n\n[판독 불가] (주: 1944년 9월에 나온 미군의 「조선 지도 지명집(Gazetteer to Maps of Korea)」에는 신북청이 Shinhokusado 역으로 적혀 있다. 그러나 Janis 75 의 도판 VII-53 에는 그 지명이 신북청(Shinhokusei)으로 적혀 있다.)\n\n2. 매일 오후 5시에 여객열차가 청진을 떠나 신북청으로 간다. 매일 오후 7시에 여객열차가 신북청에서 청진에 도착한다. 신북청과 청진 사이는 15시간이 걸린다.\n\n3. 매일 오후 1시에 여객열차가 청진을 떠나 (신북청을 거쳐) 원산으로 간다. 매일 오후 3시에 여객열차가 원산에서 청진에 도착한다. 청진과 원산 사이는 17시간이 걸린다.\n\n4. 매일 오전 7시에 여객열차가 (? 신북청을 거쳐) 평양에서 청진에 도착한다. 매일 오전 10시 30분에 여객열차가 청진을 떠나 평양으로 간다. 평양과 청진 사이는 약 22, 시간 [원문 그대로]이 걸린다.\n\n5. 원산, 신북청, 평양을 오가는 화물열차의 시각은 불규칙하다.\n\n6. 6월 13일, 소금과 [판독 불가](원문 `s lu cr`)와 관을 실은 화차 세 량이 평양에서 청진에 도착하였다.\n\n7. 6월 14일, 두만(Tumen 圖們) (129-49, 42-58)에서 좁쌀 5,000부대를 실은 열차가 평양으로 가는 길에 청진을 지났다.\n\n8. 6월 15일, 휘발유 500통과 기름 100통이 평양에서 화물열차로 청진에 도착하였다.\n\n[삭제] (주: 이 주제에 관한 [판독 불가] 정보.)\n\n25X1A6a\n\n분류(CLASSIFICATION) 기밀(CONFIDENTIAL)\n\n[REFERENCE CENTER 도장]\n\n공개 승인 1999/09/08 : CIA-RDP82-00457R001000320006-3\n\n———\n\n공개 승인 1999/09/08 : CIA-RDP82-00457R001000320006-3\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n9. 6월 21일, 소금 100톤이 청진에서 상삼봉(Sangsambong 상삼봉, 일본식 Kamisambo) (129-46, 42-43)으로 화물열차 편에 실려 나갔다.\n\n10. 6월 21일, 화물열차 한 편이 청진을 떠나 나진동(Najindong 나진동, 일본식 Rashindo) (130-15, 42-10)으로 갔다. 그 가운데 세 량에는 각각 전동기 네 대가 실려 있었다. 나머지 화차에는 변압기, 케이블선, 강관이 실려 있었다.\n\n이 문서는 미합중국의 국방에 관계된 정보로서 개정된 간첩법(Espionage Act, 50, U.S.C. 31 및 32)의 적용을 받는 정보를 담고 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방법으로든 누설하는 것은 법으로 금지된다.\n\n[REFERENCE CENTER 도장]\n\n공개 승인 1999/09/08 : CIA-RDP82-00457R001000320006-3", "secondary": "Approved For Release 1999/09/08 : CIA-RDP82-00457R001000320006-3\n\nCENTRAL INTELLIGENCE GROUP\nINTELLIGENCE REPORT\n\nCOUNTRY   Korea                                          DATE:  25X1A6a\n\nSUBJECT   Economic Information: Rail Traffic to and\n          from Chongjin                                  DIST.  27 October 1947\n25X1A6a                                                  PAGES  2\n\nORIGIN    [판독 불가]\n\n25X1X6\n\n1. [판독 불가] one freight train and one passenger train leave daily from Chongjin (Seishin) (129-49, 41-46) for each of the following cities: Wonsan (Genzan) (12726, 39-10) [원문 그대로], Pyongyang (Heijo) (125-44, 39-01), and Sinbukchong (Shinhokusei) (128-22, 40-10). One freight train and one passenger train also arrive daily 25X1X6 in Chongjin from each of these cities. The passenger trains usually have seven or eight cars, one or two of which are used for carrying baggage. Each train usually carries approximately 700-800 passengers.\n\n25X1A6a\n\n[판독 불가] (Note: In the AUS [원문 그대로] \"Gazetteer to Maps of Korea\", issued September 1944, Sinbukchong is given as Shinhokusado Station. However, in Janis 75, Figure VII-53, the place is given as Sinbukchong (Shinhokusei).)\n\n2. At 5 p.m. daily, a passenger train leaves Chongjin for Sinbukchong. At 7 p.m. daily, a passenger train arrives in Chongjin from Sinbukchong. The trip between Sinbukchong and Chongjin takes 15 hours.\n\n3. At 1 p.m. daily, a passenger train leaves Chongjin for Wonsan (via Sinbukchong). At 3 p.m. daily, a passenger train arrives in Chongjin from Wonsan. The trip between Chongjin and Wonsan takes 17 hours.\n\n4. At 7 a.m. daily, a passenger train arrives in Chongjin from Pyongyang (? via Sinbukchong). At 10:30 a.m. daily, a passenger train leaves Chongjin for Pyongyang. The trip between Pyongyang and Chongjin takes approximately 22, hours [원문 그대로].\n\n5. The freight train schedules to and from Wonsan, Sinbukchong and Pyongyang are irregular.\n\n6. On 13 June, three freight cars loaded with salt, [판독 불가] (원문 `s lu cr`) and pipe arrived at Chongjin from Pyongyang.\n\n7. On 14 June, a train carrying 5,000 bags of millet from Tumen (129-49, 42-58) passed through Chongjin on the way to Pyongyang.\n\n8. On 15 June, 500 cans of gasoline and 100 cans of oil arrived in Chongjin [from] Pyongyang by freight train.\n\n[삭제] (Note: [판독 불가] information on this subject.)\n\n25X1A6a\n\nCLASSIFICATION CONFIDENTIAL\n\n[REFERENCE CENTER 도장]\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R001000320006-3\n\n———\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R001000320006-3\n\nCENTRAL INTELLIGENCE GROUP\n\n9. On 21 June, 100 tons of salt were shipped by freight train from Chongjin to Sangsambong (Kamisambo) (129-46, 42-43).\n\n10. On 21 June, a freight train left Chongjin for Najindong (Rashindo) (130-15, 42-10) with three of its cars each containing four electric motors. The other cars carried transformers, cable lines, and steel pipe.\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\n[REFERENCE CENTER 도장]\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R001000320006-3", "notes": ["[삭제·공개 표시] Approved For Release 1999/09/08 : CIA-RDP82-00457R001000320006-3 (두 면의 공개 승인 도장)", "[삭제·공개 표시] 25X1A6a (DATE 줄, PAGES 줄, 본문 사이와 아래 여백)", "[삭제·공개 표시] 25X1X6 (ORIGIN 아래와 1항 가운데)", "[삭제·공개 표시] ORIGIN 줄의 출처 표시가 읽히지 않는다", "[삭제·공개 표시] 8항 뒤의 주석에서 출처를 가리키는 대목이 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] REFERENCE CENTER 도장"], "note": "좌표를 고치지 않았다. 원산의 `(12726, 39-10)` 은 경도의 도와 분 사이 줄표가 빠진 채로 찍혀 있어 그대로 두었다. 두만의 경도 `129-49` 는 청진의 경도와 같은 값인데 원문이 그렇게 찍혀 있어 고치지 않았다. 4항의 소요 시간 `22, hours` 는 쉼표가 끼어 있으나 숫자를 건드리지 않았다. 6항의 화물 가운데 `s lu cr` 은 sulphur 로 보이나 확정되지 않아 [판독 불가]로 두고 원문을 적었다. 1항 뒤 주석의 지도 발행 기관이 `AUS` 로 찍혀 있다. 미군 지도창(Army Map Service, AMS)으로 보이나 문서번호에 준하는 표기여서 고치지 않았다. `Janis 75` 는 미군의 합동육해군정보연구(Joint Army-Navy Intelligence Study) 조선 편이다. 지명은 조선 이름과 일본식 이름을 둘 다 살렸다. 신북청의 일본식 이름을 두고 자료가 엇갈린다고 문서가 스스로 적는 대목이라 주석을 그대로 옮겼다.", "warn": false, "search": "Approved For Release 1999/09/08 : CIA-RDP82-00457R001000320006-3 (두 면의 공개 승인 도장) 25X1A6a (DATE 줄, PAGES 줄, 본문 사이와 아래 여백) 25X1X6 (ORIGIN 아래와 1항 가운데) ORIGIN 줄의 출처 표시가 읽히지 않는다 8항 뒤의 주석에서 출처를 가리키는 대목이 먹칠되어 [삭제]로 옮겼다 REFERENCE CENTER 도장 Economic Information: Rail Traffic to and from Chongjin"}, {"id": "N51", "order": 74, "date": "1947-10-29", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "경제 첩보: 만주에서의 조선인 귀환", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-10-29"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Economic Information: Korean Repatriation from Manchuria", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r001000360002-3"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r001000360002-3"}], "summary": "만주에 남은 조선인이 왜 1946년 12월 귀환선을 타지 않았는지, 지금 형편이 어떤지, 선양 일대에서 몇 사람이 돌아가기를 바라는지를 적었다.", "points": ["1946년 12월 귀환선을 타지 않은 조선인이 많았다. 그해 만주의 벼농사가 좋았고 중국 당국이 도와주고 농사지을 기회를 주겠다고 약속했기 때문이다.", "그러나 올해 중국 당국은 만주의 조선인을 위해 아무것도 하지 않았다. 그 결과 대부분의 형편이 나쁘다.", "선양·안산·카이위안·푸순 일대만 해도 귀환을 바라는 조선인이 약 20,000명이다.", "그 20,000명의 내역은 선양 거주자 8,080명, 안산 일대 농민 약 4,000명, 카이위안 일대 농민 약 2,920명, 선양과 푸순 사이 지역 농민 약 5,000명이다.", "이들은 모두 귀환을 위해 선양으로 쉽게 모을 수 있는 곳에 있다.", "선양의 8,080명 가운데 남자가 4,196명이고 그중 2,798명이 열여덟 살을 넘었다. 여자는 3,885명이고 그중 2,602명이 열여덟 살을 넘었다."], "primary": "이 문서는 미합중국의 국방에 관계된 정보로서 개정된 간첩법(Espionage Act, 50, U.S.C. 31 및 32)의 적용을 받는 정보를 담고 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방법으로든 누설하는 것은 법으로 금지된다.\n\n공개 승인 2005/05/16 : CIA-RDP82-00457R001000360002-3\n\n기밀(CONFIDENTIAL)   25X1\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n첩보보고(INTELLIGENCE REPORT)\n\n국가   중국(China)                                일자:  25X1\n                                                  정보일(INFO.)\n주제   경제 첩보: 만주에서의 조선인 귀환\n       [만주]                                      배포(DIST.)  1947년 [판독 불가]월 2일 [원문 그대로]\n25X1                                              면수  1\n\n출처(ORIGIN)   [판독 불가]                           보충(SUPPLEMENT)\n\n배포처(DISTRIBUTION)\n[배포처 표 판독 불가 — 법무부(Justice) 칸이 보인다]\n\n25X1  1. 만주의 조선인 다수는 1946년 12월의 귀환선(repatriation ship)을 타고 조선으로 돌아가지 않았다. 그해 만주의 벼농사가 좋았고, 중국 당국이 25X1 도움을 주고 농사지을 기회를 주겠다고 약속하였기 때문이다.\n\n2. 그러나 올해 중국 당국은 만주의 조선인을 돕기 위해 아무것도 하지 않았다. 그 결과 만주에 있는 조선인 대부분의 경제 형편은 나쁘다.\n\n3. 선양(Mukden 봉천), 안산(Anshan 鞍山) (122-57, 41-06), 카이위안(Kaiyuan 開原) (124091, 42233) [원문 그대로], 푸순(Fushun 撫順) ([판독 불가]54, 41-63) [원문 그대로] 일대만 해도 귀환을 바라는 조선인이 약 20,000명 있다.\n\n4. 이 20,000명 가운데 선양 거주자가 8,080명, 안산 일대의 농민이 약 4,000명, 카이위안 일대의 농민이 약 2,920명, 선양과 푸순 사이 지역의 농민이 약 5,000명이다. 이 20,000명은 모두 귀환을 위해 선양으로 쉽게 모을 수 있는 [판독 불가] 지역에 있다.\n\n5. 선양에는 귀환을 바라는 조선인이 8,080명 있다. 그 가운데 남자가 4,196명이고, 그중 2,798명이 열여덟 살을 넘었다. 여자는 3,885명이고, 그중 2,602명이 열여덟 살을 넘었다.\n\n문서번호(Document No.) [판독 불가]\n등급 변경 없음(No CHANGE in Class.) [판독 불가]\n[ ] 비밀해제(DECLASSIFIED)\n등급 변경(Class. CHANGED TO): TS  S  C\nDDA 각서, 1977년 4월 4일\n근거(Auth.): DDA REG. 77/2783 [원문 그대로]\n25X1\n\n공개 승인 2005/05/16 : CIA-RDP82-00457R001000360002-3", "secondary": "This document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32, as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nApproved For Release 2005/05/16 : CIA-RDP82-00457R001000360002-3\n\nCONFIDENTIAL   25X1\n\nCENTRAL INTELLIGENCE GROUP\nINTELLIGENCE REPORT\n\nCOUNTRY   China                                          DATE:  25X1\n                                                          INFO.\nSUBJECT   Economic Information: Korean Repatriation from\n          [Manchuria]                                     DIST.  2 [판독 불가]ctober 1947 [원문 그대로]\n25X1                                                      PAGES  1\n\nORIGIN    [판독 불가]                                      SUPPLEMENT\n\nDISTRIBUTION\n[배포처 표 판독 불가 — Justice 칸이 보인다]\n\n25X1  1. Many Koreans in Manchuria did not return to Korea on the December 1946 repatriation ship, because the rice harvest in Manchuria had been good and because the Chinese authorities had promised to give them 25X1 assistance and the opportunity to raise crops.\n\n2. However, the Chinese authorities have done nothing to help the Koreans in Manchuria this year. As a result, the economic condition of most of the Koreans in Manchuria is bad.\n\n3. [In the] Mukden, Anshan (122-57, 41-06), Kaiyuan (124091, 42233) [원문 그대로] and Fushun ([판독 불가]54, 41-63) [원문 그대로] areas alone, there are approximately 20,000 Koreans who wish to be repatriated.\n\n4. Of these 20,000 Koreans, there are 8,080 residents of Mukden, approximately 4,000 farmers in the Anshan area, approximately 2,920 farmers in the Kaiyuan area, and approximately 5,000 farmers in the area between Mukden and Fushun. All of these 20,000 Koreans are in [판독 불가] areas from which they can easily be concentrated in Mukden for repatriation.\n\n5. There are 8,080 Koreans in Mukden who wish to be repatriated. Of this number, 4,196 are males, of whom 2,798 are over the age of eighteen; 3,885 are females, of whom 2,602 are over the age of eighteen.\n\nDocument No. [판독 불가]\nNo CHANGE in Class. [판독 불가]\n[ ] DECLASSIFIED\nClass. CHANGED TO: TS  S  C\nDDA Memo, 4 Apr 77\nAuth: DDA REG. 77/2783 [원문 그대로]\n25X1\n\nApproved For Release 2005/05/16 : CIA-RDP82-00457R001000360002-3", "notes": ["[삭제·공개 표시] Approved For Release 2005/05/16 : CIA-RDP82-00457R001000360002-3 (앞뒤의 공개 승인 도장)", "[삭제·공개 표시] 25X1 (제호 옆, DATE 줄, PAGES 줄, 1항 앞과 가운데, 아래 여백에 반복해 찍힌 면제 표시)", "[삭제·공개 표시] ORIGIN 줄의 출처 표시가 읽히지 않는다", "[삭제·공개 표시] Document No. / No CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S C / DDA Memo, 4 Apr 77 / Auth: DDA REG. 77/2783 의 등급 처리 도장", "[삭제·공개 표시] DISTRIBUTION 표가 뭉개져 법무부(Justice) 칸 말고는 읽을 수 없다"], "note": "통계 숫자를 한 자리도 고치지 않았다. 5항의 남녀 합계는 4,196 더하기 3,885 로 8,081 이 되어 같은 항의 8,080 과 한 명 어긋난다. 원문이 그렇게 적혀 있어 그대로 두었다. 4항의 내역 합계는 20,000 으로 맞는다. 좌표도 고치지 않았다. 카이위안의 `(124091, 42233)` 은 줄표가 빠지고 자릿수가 어긋난 채 찍혀 있고, 푸순의 `(...54, 41-63)` 은 경도 앞자리가 떨어져 나갔으며 위도의 분이 63으로 성립하지 않는다. 안산의 `(122-57, 41-06)` 은 온전하다. 선양은 원문이 Mukden 으로만 적어 좌표가 없다. 배포 날짜는 `2 dotoper 1947` 로 찍혀 월 이름이 뭉개졌다. 날짜의 숫자는 고치지 않았다. 주제 줄은 `Rea Information` 으로 찍혀 있어 Economic Information 으로 읽었다. 문서 제목이 뒤 낱말에서 잘려 [Manchuria]로 보충했다. 이 문서에는 SOURCE·EVALUATION 줄이 없고 ORIGIN 줄도 읽히지 않아 정보원을 알 수 없다.", "warn": false, "search": "Approved For Release 2005/05/16 : CIA-RDP82-00457R001000360002-3 (앞뒤의 공개 승인 도장) 25X1 (제호 옆, DATE 줄, PAGES 줄, 1항 앞과 가운데, 아래 여백에 반복해 찍힌 면제 표시) ORIGIN 줄의 출처 표시가 읽히지 않는다 Document No. / No CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S C / DDA Memo, 4 Apr 77 / Auth: DDA REG. 77/2783 의 등급 처리 도장 DISTRIBUTION 표가 뭉개져 법무부(Justice) 칸 말고는 읽을 수 없다 Economic Information: Korean Repatriation from Manchuria"}, {"id": "N52", "order": 75, "date": "1947-10-29", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "군사 첩보; 북조선 보안대 장교학교의 불만", "badge": null, "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-10-29"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information; Discontent in Peace Preservation Corps Officers' Schools in North Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r001000450005-0"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r001000450005-0"}], "summary": "북조선 보안대 장교학교의 졸업생과 학생들이 대우에 불만을 품고 있다는 여섯 항의 보고다. 급식과 규율, 탈영, 모병난을 적었다.", "points": ["입학할 때는 졸업하면 보안서 같은 군사·준군사 조직의 중요한 자리로 간다고 들었으나, 졸업생 대부분이 보통 병사 노릇을 하고 있다.", "5월 이래 급식은 하루 두 끼, 옥수수죽뿐이다. 원문의 월 앞 글자가 뭉개져 있다.", "훈련은 혹독하고 상관 비판은 어떤 사안에서도 용납되지 않는다.", "사기가 낮고 탈영이 늘어 학교 직원들이 심각하게 우려한다.", "모병이 어렵다. 지방의 유력 공산주의자가 본보기로 자진 입학하고, 어떤 곳에서는 강제로 끌려간다.", "말미의 주는 17세에서 26세 젊은이가 북조선 전역에서 징집되어 이 학교로 보내진다고 적는다. 보고한 곳의 이름은 지워졌다."], "primary": "25X1A2g\n\n[판독 불가] 정본화 - 공개 승인 : CIA-RDP82-00457R001000450005-0\n\n25X1A2g\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT) . J 22446 [원문 그대로]\n국가  조선(Korea)                                  일자:  25X1A6a\n정보(INFO.)  [판독 불가]\n주제  군사 첩보; 북조선 보안대 장교학교(Peace Preservation Corps Officers' Schools)의 불만\n                                                  배포(DIST.) [판독 불가] 1947년 10월\n                                                  면수 1\n보충(SUPPLEMENT) .\n출처(ORIGIN)  [판독 불가]  25X1X6\n\n1. 북조선 보안대 장교학교(Peace Preservation Corps Officers' Schools)의 졸업생과 재학생 다수가 자신들이 받는 대우에 불만을 품고 있다.\n\n2. 북조선의 보안대 장교학교가 처음 세워졌을 때, 학생들은 학교를 졸업하면 보안서(Peace Preservation Office, Po An So [한자 판독 불가])와 같은 여러 군사 및 준군사 조직의 중요한 자리에 배치될 것이라는 말을 들었다. 그러나 학교 졸업생 대부분은 보통 병사의 임무를 수행해 왔다.\n\n5. [원문 그대로] 보안대 장교학교의 식량 사정은 나쁘다. [판독 불가] 5월 이래로 학생들은 하루에 두 끼만, 그것도 옥수수죽(corn meal)으로만 받아 왔다.\n\n4. 학교의 훈련은 혹독했고 규율은 엄격하게 집행되어 왔다. 어떤 사안에 대해서도 상관을 비판하는 것은 용납되지 않는다.\n\n5. 학생들의 사기는 낮고 학교로부터의 탈영이 크게 늘어, 학교 직원들이 심각하게 우려하고 있다.\n\n6. 북조선의 군 당국은 보안대 장교학교에 들어올 인원을 모집하는 데 큰 어려움을 겪고 있다. 북조선 일부 지방의 유력한 공산주의자 가운데 몇몇은 지역 사회의 다른 사람들에게 본을 보이려고 자진하여 학교에 들어갔다. 북조선의 어떤 곳에서는 젊은이들이 보안대 [판독 불가] 학교에 들어가도록 강제로 강요당하기까지 하였다.   25X1A29 [원문 그대로]\n\n(주: [삭제]는 17세에서 26세 사이의 젊은이들이 북조선 전역에서 징집되어 보안대 장교학교로 보내지고 있다고 보고하였다.)\n\n25X1A6a.\n\n[이 문서는 개정된 간첩법(Espionage Act) 50 U.S.C. 31조 및 32조가 정하는 바에 따라 미합중국의 국방에 관계된 정보를 담고 있다. 그 전달 또는 그 내용을 어떠한 방식으로든 권한 없는 자에게 누설하는 것은 법으로 금지된다. — 도장 전체가 뭉개져 있다. 판독된 낱말은 다음과 같다: \"s document contains information ... the maplonece ket meeieCe jL and ... D nes. 32 as amended, ... noc Classe : vevelaticn of Lvs contents in nner ... to an unauthorized person is prohib= ... TS Law.\"]\n\n[] 등급 변경 없음(NO CHANGE in Class.) [원문에는 'CHANG' 만 판독된다]\n[] 비밀해제(DECLASSIFIED)\n등급 변경 후(Class. CHANGED TO): [판독 불가]\nDDA 각서(DDA Memo),\n근거(Auth): DDA REG. 77/176,\n일자(Date): 1978년 4월 21일   담당(By): [판독 불가]\n\n분류(CLASSIFICATION) [판독 불가]\n\nREFER [판독 불가]\n\n정본화 - 공개 승인 : CIA-RDP82-00457R001000450005-0", "secondary": "25X1A2g\n\n[판독 불가] Sanitized - Approved For Release : CIA-RDP82-00457R001000450005-0\n\n25X1A2g\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT . J 22446 [원문 그대로]\nCOUNTRY  Korea                                    DATE:  25X1A6a\nINFO.  [판독 불가]\nSUBJECT  Military Information; Discontent in Peace Preservation Corps Officers' Schools in North Korea\n                                                  DIST. [판독 불가] October 1947\n                                                  PAGES 1\nSUPPLEMENT .\nORIGIN  [판독 불가]  25X1X6\n\n1. Many of the graduates and students of the Peace Preservation Corps Officers' Schools in North Korea are dissatisfied with the treatment they are receiving.\n\n2. When the Peace Preservation Corps Officers' Schools in North Korea were first established, the students were told that, upon graduation from the schools, they would be assigned to important positions in various military and semi-military organizations, such as the Peace Preservation Office (Po An So [한자 판독 불가]). However, most of the graduates of the schools have been performing the duties of ordinary soldiers.\n\n5. [원문 그대로] The food situation in the Peace Preservation Corps Officers' Schools is bad. Since [판독 불가] May the students have received only two meals, consisting only of corn meal, a day.\n\n4. The training at the schools has been vigorous and discipline has been strictly enforced. No criticism of superiors on any matter is tolerated.\n\n5. The morale of the students is low and desertions from the schools have increased so much that the staff members of the schools are seriously concerned.\n\n6. The military authorities in North Korea are experiencing great difficulty in recruiting men for the Peace Preservation Corps Officers' Schools. Some of the leading Communists in certain localities in North Korea have joined the schools voluntarily to set an example for others in the community. In some places in North Korea young men have even been compelled by force to join the Peace Preservation Corps [판독 불가] Schools.   25X1A29 [원문 그대로]\n\n(Note: [삭제] reported that young men between the ages of 17 and 26 are being conscripted throughout North Korea and sent to Peace Preservation Corps Officers' Schools.)\n\n25X1A6a.\n\n[This document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50 U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law. — 도장 전체가 뭉개져 있다. 판독된 낱말은 다음과 같다: \"s document contains information ... the maplonece ket meeieCe jL and ... D nes. 32 as amended, ... noc Classe : vevelaticn of Lvs contents in nner ... to an unauthorized person is prohib= ... TS Law.\"]\n\n[] NO CHANGE in Class. [원문 'CHANG' 만 판독]\n[] DECLASSIFIED\nClass. CHANGED TO: [판독 불가]\nDDA Memo,\nAuth: DDA REG. 77/176,\nDate: 21 APR 1978   By: [판독 불가]\n\nCLASSIFICATION [판독 불가]\n\nREFER [판독 불가]\n\nSanitized - Approved For Release : CIA-RDP82-00457R001000450005-0", "notes": ["[삭제·공개 표시] Sanitized - Approved For Release : CIA-RDP82-00457R001000450005-0 (첫 면과 마지막 면의 공개 승인 도장)", "[삭제·공개 표시] 25X1A2g (첫 면 상단 두 곳)", "[삭제·공개 표시] 25X1A6a (DATE 줄과 말미)", "[삭제·공개 표시] 25X1X6 (ORIGIN 줄)", "[삭제·공개 표시] 25X1A29 (6항 끝의 여백 표시. 25X1A2g 의 오독으로 보이나 찍힌 대로 옮겼다)", "[삭제·공개 표시] ORIGIN 줄의 출처 표시가 지워져 [판독 불가]로 옮겼다", "[삭제·공개 표시] 말미 주의 보고 주체가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] DDA Memo, Auth: DDA REG. 77/176, Date: 21 APR 1978 (비밀해제 검토 도장)"], "note": "본문 여섯 항은 비교적 잘 읽힌다. 다만 문단 번호가 1, 2, 5, 4, 5, 6 순으로 찍혀 있다. 셋째 항의 5는 3의 오독으로 보이나 번호를 고치지 않고 [원문 그대로]로 두었다. 3항의 `Since X May` 에서 월 앞의 글자를 가릴 수 없어 [판독 불가]로 두었다. 급식 횟수 두 끼와 나이 17세, 26세는 원문 숫자를 그대로 옮겼다. 표제 옆의 정리번호 `J 22446` 은 앞의 문자가 확실하지 않으나 고치지 않았다. DIST 줄의 날짜는 `*\" October 1947` 로 찍혀 일자리가 없어 [판독 불가]로 두었다. index 의 문서 일자는 1947-10-29 다. 보안대(Po An Tae 保安隊), 보안서(Po An So)의 한자는 스캔에서 모두 뭉개져 [한자 판독 불가]로 두었다. 6항의 `Peace Preservation Corps per Schools` 에서 `per` 는 `Officers'` 의 오독으로 보이나 확정되지 않아 [판독 불가]로 두었다. 하단의 간첩법 경고 도장은 글자가 거의 남지 않아 판독된 낱말을 그대로 적고 정형 문구임을 밝혀 두었다.", "warn": false, "search": "Sanitized - Approved For Release : CIA-RDP82-00457R001000450005-0 (첫 면과 마지막 면의 공개 승인 도장) 25X1A2g (첫 면 상단 두 곳) 25X1A6a (DATE 줄과 말미) 25X1X6 (ORIGIN 줄) 25X1A29 (6항 끝의 여백 표시. 25X1A2g 의 오독으로 보이나 찍힌 대로 옮겼다) ORIGIN 줄의 출처 표시가 지워져 [판독 불가]로 옮겼다 말미 주의 보고 주체가 먹칠되어 [삭제]로 옮겼다 DDA Memo, Auth: DDA REG. 77/176, Date: 21 APR 1978 (비밀해제 검토 도장) Military Information; Discontent in Peace Preservation Corps Officers' Schools in North Korea"}, {"id": "N53", "order": 76, "date": "1947-10-30", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "군사 첩보: 북조선의 제복과 계급장", "badge": null, "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-10-30"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Uniforms and Insignia in North Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r001000450006-9"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r001000450006-9"}], "summary": "북조선의 보안대, 보안서, 경비대, 철도경비대, 해안경비대, 인민군이 각각 어떤 제복과 계급장을 쓰는지를 열 항으로 적었다.", "points": ["다섯 조직 모두 일본 육군식 깃 표장에 계급장을 단다. 미국이 일본 육군의 형식으로 북조선 군복을 읽고 있다.", "보안대는 붉은 테두리의 연붉은 깃 표장, 보안서는 테두리 없는 연붉은 표장, 정규 경비대와 철도경비대는 검은 테두리다. 해안경비대는 검은 테두리이되 모양이 조금 다르다.", "해안경비대만 카키색 제복이고 나머지는 검은색 제복이다.", "철도경비대 장교와 인민군은 소련군을 닮은 제복에 견장을 쓴다. 깃 표장 계통과 견장 계통이 갈린다.", "인민군 견장은 병과별로 붉은색(보병·포병·기병), 푸른색(공군), 검은색(통신)이다. 소련군 견장의 낫과 망치 자리에 조선의 국가 표장이 들어간다.", "각 항 앞에 C-2, C-3, C-6, C-4, F-6 같은 정보원 평가등급이 붙어 있다. 8항만 F 등급이다."], "primary": "25X1A2g\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)   25X1A2g\n첩보보고(INTELLIGENCE REPORT) |\n\n국가  조선(Korea)                                  일자(DATE):\n정보(INFO.)  아래를 볼 것(See below)\n\n주제  군사 첩보: 북조선의 제복과 계급장\n                                                  배포(DIST.) 1947년 10월 30[판독 불가]일\n25X1A6a  [이 문서는 [판독 불가]로부터 온 [판독 불가] 10월 1[판독 불가]일자 [판독 불가] 서한에 따라 [판독 불가] 등급으로 재조정된다 — 재등급 도장이 표제 위에 겹쳐 찍혀 있다]\n                                                  면수 2\n보충(SUPPLEMENT)\n출처(ORIGIN)                                       25X1X6\n\nC-2 1. 북조선 보안대(Peace Preservation Corps, Po An Tae [한자 판독 불가]), 보안서(Peace Preservation Office, Po An So [한자 판독 불가]), 정규 경비대(regular Constabulary, Kyong Pi Tae [한자 판독 불가]), 철도경비대(Railway Constabulary), 해안경비대(Coast Guard Constabulary)의 대원들은 일본 육군 인원이 달던 것과 비슷한 깃 표장(collar tab)에 계급장을 단다.\n\nC-3 2. 보안대(Po An Tae) 대원은 붉은 테두리가 있는 연붉은색 깃 표장을 단다. 표장 위의 금별과 금줄이 계급을 나타낸다.\n\nC-6 3. 보안서(Po An So) 대원은 연붉은색 깃 표장을 단다.\n\nC-4 4. 정규 경비대와 철도경비대 대원은 검은 테두리가 있는 연붉은색 깃 표장을 단다.\n\nC-[판독 불가] 5. 해안경비대 대원도 검은 테두리가 있는 연붉은색 깃 표장을 달지만, 그 표장은 정규 경비대와 철도경비대 대원이 다는 것과 조금 다르다.\n\nC-6 6. 해안경비대 대원은 카키색 제복을 입는다.\n\nC-[판독 불가] 7. 철도경비대와 정규 경비대, 보안대, 보안서 대원은 검은색 제복을 입는다.\n\n25X1X6\n\nF-6 8. 철도경비대 장교는 사병과 다른 제복을 입는다. 장교 제복은 소련군과 북조선 인민군(People's Army of North Korea)의 것을 닮았다. 계급장은 깃 표장이 아니라 견장(shoulder board)에 단다. [판독 불가]\n\n25X1X6\n\nC-2 9. 인민군(People's Army), 곧 보안대 장교학교(Peace Preservation Corps Officers' Schools)의 성원은 소련군 병사가 입는 것과 비슷한 제복을 입는다. 깃은 높이 세운 형태이고 계급장은 견장에 단다. 견장은 소련군이 쓰는 것과 비슷하나 조금 더 좁다.\n\n[참고자료실 도서관(REFERENCE CENTER LIBRARY)]\n\n[공개 승인 1999/09/08] : CIA-RDP82-00457R001000450006-9\n\n[페이지 구분]\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)  [CIA-RDP]82-00457R001[000450]006-9   25X1A2q [원문 그대로]\n\nC-[판독 불가] 10. 인민군, 곧 보안대 장교학교 성원의 병과는 견장의 색으로 나타낸다. 보병, 포병, 기병은 붉은 바탕을 쓰고, 공군은 푸른 바탕을, 통신병과는 검은 바탕을 쓴다. 견장에는 큰 별이 하나 있는데, 소련군 병사 제복의 견장에서 낫과 망치 도안이 든 큰 별이 놓인 것과 같은 자리다. 다만 낫과 망치 대신 조선의 국가 표장(Korean national emblem)이 별 안에 들어간다. 계급은 더 작은 별들과 줄로 나타낸다. 장교의 견장에는 계급을 나타내는 작은 별과 줄이 모두 있으나, 사병의 견장에는 계급을 나타내는 줄만 있다. 장교와 사병의 제복은 장교의 것이 더 좋은 천으로 지어진다는 점 말고는 차이가 없다.\n\n[이 문서는 개정된 간첩법(Espionage Act) 50 U.S.C. 31조 및 32조가 정하는 바에 따라 미합중국의 국방에 관계된 정보를 담고 있다. 그 전달 또는 그 내용을 어떠한 방식으로든 권한 없는 자에게 누설하는 것은 법으로 금지된다.]\n\n공개 승인 1999/09/08 : CIA-RDP82-00457R001000450006-9", "secondary": "25X1A2g\n\nCENTRAL INTELLIGENCE GROUP   25X1A2g\nINTELLIGENCE REPORT |\n\nCOUNTRY  Korea                                    DATE:\nINFO.  See below\n\nSUBJECT  Military Information: Uniforms and Insignia in North Korea\n                                                  DIST. 30[판독 불가] October 1947\n25X1A6a  [This document is hereby regraded to [판독 불가] in accordance with the [판독 불가] letter of 1[판독 불가] October [판독 불가] from the [판독 불가] — 재등급 도장이 표제 위에 겹쳐 찍혀 있다]\n                                                  PAGES 2\nSUPPLEMENT\nORIGIN                                            25X1X6\n\nC-2 1. The members of the North Korean Peace Preservation Corps (Po An Tae [한자 판독 불가]), Peace Preservation Office (Po An So [한자 판독 불가]), regular Constabulary (Kyong Pi Tae [한자 판독 불가]), Railway Constabulary and Coast Guard Constabulary wear their insignia on collar tabs similar to those worn by Japanese Army personne
