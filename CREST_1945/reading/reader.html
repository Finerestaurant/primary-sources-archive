이드 100통 남짓이 만포진에서 배로 만주로 건너갔다. 이 물자는 신의주(Shingishu)에서 강계(Kanggye)를 거쳐 온 여객열차에 달려 왔다.", "면포 200필가량, 모직(?) 350야드, 콩기름 380통, 자동차 전조등 전구 250상자가 만주 지안에서 만포진에 도착한 뒤 군용열차로 평양(Heijo)에 갔다.", "그 면포는 팔로군(8 Route Army) 군복에 쓰는 것과 같은 종류였다고 적었다."], "primary": "공개 승인 [판독 불가]\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가   조선(Korea) -- 중국(China)                    일자:\n                                                    정보일(INFO.)\n주제   경제 첩보: 북조선과 만주 사이의 선박 수송       배포(DIST.) 1947년 12월 5일 (원문 `5 December 19/,7` [원문 그대로])\n\n                                                    면수  iL [원문 그대로]\n25X1                                                보충(SUPPLEMENT)\n                                                    25X1\n\n1. 무기와 탄약으로 여겨지는 물자(MATERIALS)가 만포진(Manpojin 만포진(滿浦鎭), 일본식 Menpochin [원문 그대로]) (126-18, 41-10)에서 배로 압록강(Yalu River)을 건너 만주로 보내지고 있다. 배를 쓰는 까닭은 만포진의 철교가 수리 중이고 그 다리 위의 철도가 운행하지 않기 때문이다.\n\n2. [판독 불가] 모피 [판독 불가]점, 쌀 500근(catties), 해산물 2300근, 그리고 카바이드 100통이 넘는 양이 만포진에서 배로 압록강을 건너 만주로 보내졌다. 이 물자는 모두 신의주(Sinuiju 신의주(新義州), 일본식 Shingishu) (124-24, 40-06)에서 강계(Kanggye 강계(江界), 일본식 Kekat [원문 그대로]) (126-36, 40-58)를 거쳐 온 여객열차에 달려 [판독 불가] 도착한 것이다.\n\n3. [판독 불가] 면포 약 200필, (모직?) 천 350야드, 콩기름 380통, 자동차 전조등 전구 250상자가 만주 지안(Chian 집안(輯安)) (126-10, 42-07)에서 만포진에 [판독 불가] 도착하였다. 25X1 이 물자는 평양(Pyongyang 평양(平壤), 일본식 Heijo) (125-44, 3[판독 불가])으로 25X1 군용열차로 수송되었다.\n\n그 천은 팔로군(8 Route Army) 군복에 쓰이는 것과 같은 종류였다.\n\n25X1\n\n이 문서는 중앙정보국장이 미합중국 문서보관관에게 보낸 1978년 10월 16일자(원문 `16 October i978` [원문 그대로]) 서한에 따라 기밀(CONFIDENTIAL)로 등급이 조정되었다.\n\n다음 재검토 일자(Next Review Date): 2008\n\n25X11  이 문서는 미합중국의 국방에 관계된 정보로서 개정된 간첩법(Espionage Act, 50, U.S.C. 31 및 32)의 적용을 받는 정보를 담고 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방법으로든 누설하는 것은 법으로 금지된다.\n\n문서번호(Document No.) 3 0 ¢% [판독 불가]\n\n등급 변경 없음(NO CHANGE in Class.) [판독 불가]\n비밀해제(DECLASSIFIED) [판독 불가]\n등급 변경(Class. CHANGED TO): [판독 불가]\nDDA [판독 불가] 1762 [원문 그대로]\n근거(Auth): REG. 97/4763 [원문 그대로]\n일자(Date): [판독 불가]\n\n25X1\n25X1\n\n기밀(CONFIDENTIAL)\n\n등급 구분(CLASSIFICATION)", "secondary": "Approved For Re[판독 불가]\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCOUNTRY   Korea -- China                                DATE:\n                                                        INFO.\nSUBJECT   Economic Information: Shipping between        DIST. 5 December 19/,7 [원문 그대로]\n          North Korea and Manchuria\n                                                        PAGES  iL [원문 그대로]\n25X1                                                    SUPPLEMENT\n                                                        25X1\n\n1. MATERIALS, believed to be weapons and ammunition, are being sent by boat across the Yalu River into Manchuria from Manpojin (Menpochin) [원문 그대로] (126-18, 41-10). Boats are being used because the railroad bridge at Manpojin is being repaired and the railroad over the bridge is not in operation.\n\n2. [판독 불가] pieces of fur, 500 catties of rice, 2300 catties of sea foods and more than 100 cans of carbide were sent by boat from Manpojin across the Yalu River to Manchuria. All these goods had arrived [판독 불가] attached to a passenger train which had come from Sinuiju (Shingishu) (124-24, 40-06) via Kanggye (Kekat) [원문 그대로] (126-36, 40-58).\n\n3. [판독 불가] approximately 200 rolls of cotton cloth, 350 yards of (woolen?) cloth, 380 cans of soybean oil, and 250 boxes of motor car headlight bulbs [판독 불가] arrived at Manpojin from Chian (126-10, 42-07), Manchuria. 25X1 these goods were shipped to Pyongyang (Heijo) (125-44, 3[판독 불가]) 25X1 military train.\n\nThe cloth was of the same type as that used for 8 Route Army uniforms.\n\n25X1\n\nThis document is hereby regraded to CONFIDENTIAL in accordance with the letter of 16 October i978 [원문 그대로] from the Director of Central Intelligence to the Archivist of the United States.\n\nNext Review Date: 2008\n\n25X11  This document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nDocument No. 3 0 ¢% [판독 불가]\n\nNO CHANGE in Class. [판독 불가]\nDECLASSIFIED [판독 불가]\nClass. CHANGED TO: [판독 불가]\nDDA [판독 불가] 1762 [원문 그대로]\nAuth: REG. 97/4763 [원문 그대로]\nDate: [판독 불가]\n\n25X1\n25X1\n\nCONFIDENTIAL\n\nCLASSIFICATION", "notes": ["[삭제·공개 표시] Approved For Release (첫 면 상단의 공개 승인 도장. 스캔이 뭉개져 문서번호를 읽을 수 없다)", "[삭제·공개 표시] 25X1, 25X11 (COUNTRY·SUPPLEMENT 줄과 본문 3항 앞뒤, 간첩법 고지 옆에 반복해 찍힌 면제 표시)", "[삭제·공개 표시] Document No. 3 0 ¢% / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO / DDA REG. 97/4763 의 등급 처리 도장", "[삭제·공개 표시] 1항의 정보원 표시와 2·3항 첫머리의 출처 대목이 25X1 로 지워져 문장이 시작 없이 이어진다"], "note": "한 면짜리 짧은 보고다. 2항과 3항의 첫머리가 정보원 표시(25X1)로 지워져 있고 OCR 이 줄 순서를 뒤섞어 놓았다. 모피 수량, 2항의 화물 도착 경위, 3항의 도착 경위가 그 자리에 있었을 것으로 보이나 지어내지 않고 [판독 불가]로 두었다. 배포 일자는 `5 December 19/,7` 로 찍혀 있다. 1947년이 분명하나 날짜의 숫자는 고치지 않고 원문을 함께 적었다. 등급 조정 서한의 `16 October i978` 도 마찬가지다. 면수 칸은 `iL` 로 찍혀 있어 그대로 두었다. 좌표는 고치지 않았다. 만포진 (126-18, 41-10), 신의주 (124-24, 40-06), 강계 (126-36, 40-58), 지안 (126-10, 42-07)은 온전하다. 평양의 `(125-44, 3...)` 은 위도 뒷자리가 잘려 [판독 불가]로 두었다. 지명의 일본식 표기가 원문에 함께 적혀 있다. 신의주는 Shingishu, 평양은 Heijo 로 온전하나 만포진은 `Menpochin`, 강계는 `Kekat` 으로 찍혀 있다. 만포진의 일본식 읽기는 Manpochin, 강계는 Kokai 이나 원문 표기를 고치지 않았다. `8 Route Army` 는 중국공산당의 팔로군이다. 무게 단위 catty(근)와 야드는 원문대로 두었다.", "warn": false, "search": "Approved For Release (첫 면 상단의 공개 승인 도장. 스캔이 뭉개져 문서번호를 읽을 수 없다) 25X1, 25X11 (COUNTRY·SUPPLEMENT 줄과 본문 3항 앞뒤, 간첩법 고지 옆에 반복해 찍힌 면제 표시) Document No. 3 0 ¢% / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO / DDA REG. 97/4763 의 등급 처리 도장 1항의 정보원 표시와 2·3항 첫머리의 출처 대목이 25X1 로 지워져 문장이 시작 없이 이어진다 Economic Information: Shipping between North Korea and Manchuria"}, {"id": "N67", "order": 91, "date": "1947-12-09", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "군사 첩보: 북조선 인민군 편제의 변경", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-12-09"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "수신", "v": "WAR / NAVY / JUSTICE 등 (배포처 표가 뭉개져 일부만 읽힌다)", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Change in Organization of North Korean People's Army", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r001100730008-5"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r001100730008-5"}], "summary": "인민군(North Korean People's Army)과 보안대(Peace Preservation Corps)를 합쳐 「북조선군 총사령부」 아래 두었다는 한 문장짜리 보고다.", "points": ["인민군과 보안대가 통합된다.", "통합된 부대는 「북조선군 총사령부(General Headquarters of the North Korean Army)」의 지휘 아래 놓인다.", "보안대의 조선말 이름이 괄호에 로마자로 적혀 있으나 앞부분이 지워져 `An Tae` 만 남았다.", "「평가되지 않은 정보(UNEVALUATED INFORMATION)」 표시가 붙어 있다. 훈련된 정보분석관의 연구용이라고 적었다."], "primary": "공개 승인 2003/08/07 : CIA-RDP82-00457R001100730008-5\n\n이것은 평가되지 않은 정보다(THIS IS UNEVALUATED INFORMATION). [판독 불가] 훈련된 정보분석관의 연구용이다.\n\nINTELLOFAX [판독 불가]\n\n기밀(CONFIDENTIAL)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)   25X1\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가   조선(Korea)                                        일자: 25X11\n주제   군사 첩보: 북조선 인민군(North Korean People's       정보일(INFO.)\n       Army) 편제의 변경                                   배포(DIST.) 1947년 12월 9일\n                                                          면수  i [원문 그대로]\n25X1                                                      보충(SUPPLEMENT)\n                                                          25X1\n\n배포처(DISTRIBUTION)\n[표 판독 불가]  육군부(WAR) | 해군부(NAVY) | 법무부(JUSTICE)  [판독 불가]  25X11\n\n1. [판독 불가] 북조선 인민군(North Korean People's Army)과 보안대(Peace Preservation Corps) 25X1 An Tae)가 통합되어 \"북조선군 총사령부(General Headquarters of the North Korean Army)\"의 지휘 아래 놓였다.\n\n\"열람용 사본(LIBRARY COPY)\"\n\n이 문서는 미합중국의 국방에 관계된 정보로서 개정된 간첩법(ESPIONAGE ACT, 50 U.S.C. 31 및 32)의 적용을 받는 정보를 담고 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방법으로든 누설하는 것은 법으로 금지된다. 중앙정보국장의 허가 없이는 국무부, 육군부, 해군부 이외의 곳에서 전부 또는 일부를 복제할 수 없다.\n\n이 문서는 중앙정보국장이 미합중국 문서보관관에게 보낸 서한(원문 `letter of 15 Ocinber i678` [원문 그대로])에 따라 기밀(CONFIDENTIAL)로 등급이 조정되었다.\n\n다음 재검토 일자(Next Review Date): 2608 [원문 그대로]\n\n등급 구분(CLASSIFICATION) [판독 불가]\n\n공개 승인 2003/08/07 : CIA-RDP82-00457R001100730008-5", "secondary": "Approved For Release 2003/08/07 : CIA-RDP82-00457R001100730008-5\n\nTHIS IS UNEVALUATED INFORMATION [판독 불가] FOR THE RESEARCH USE OF TRAINED INTELLIGENCE ANALYSTS.\n\nINTELLOFAX [판독 불가]\n\nCONFIDENTIAL\n\nCENTRAL INTELLIGENCE GROUP   25X1\n\nINTELLIGENCE REPORT\n\nCOUNTRY   Korea                                            DATE: 25X11\nSUBJECT   Military Information: Change in Organization      INFO.\n          of North Korean People's Army                     DIST. 9 December 1947\n                                                            PAGES  i [원문 그대로]\n25X1                                                        SUPPLEMENT\n                                                            25X1\n\nDISTRIBUTION\n[표 판독 불가]  WAR | NAVY | JUSTICE  [판독 불가]  25X11\n\n1. [판독 불가] the North Korean People's Army and the Peace Preservation Corps 25X1 An Tae) were combined and placed under the command of \"General Headquarters of the North Korean Army.\"\n\n\"LIBRARY COPY\"\n\nTHIS DOCUMENT CONTAINS INFORMATION AFFECTING THE NATIONAL DEFENSE OF THE UNITED STATES WITHIN THE MEANING OF THE ESPIONAGE ACT, 50 U.S.C. 31 AND 32, AS AMENDED. ITS TRANSMISSION OR THE REVELATION OF ITS CONTENTS IN ANY MANNER TO AN UNAUTHORIZED PERSON IS PROHIBITED BY LAW. IT MAY NOT BE REPRODUCED IN WHOLE OR IN PART BY OTHER THAN STATE, WAR OR NAVY DEPARTMENTS EXCEPT BY PERMISSION OF THE DIRECTOR OF CENTRAL INTELLIGENCE.\n\nThis document is hereby regraded to CONFIDENTIAL in accordance with the letter of 15 Ocinber i678 [원문 그대로] from the Director of Central Intelligence to the Archivist of the United States.\n\nNext Review Date: 2608 [원문 그대로]\n\nCLASSIFICATION [판독 불가]\n\nApproved For Release 2003/08/07 : CIA-RDP82-00457R001100730008-5", "notes": ["[삭제·공개 표시] Approved For Release 2003/08/07 : CIA-RDP82-00457R001100730008-5 (앞뒤 면의 공개 승인 도장)", "[삭제·공개 표시] 25X1, 25X11 (DATE 줄, SUPPLEMENT 줄, DISTRIBUTION 표, 본문 1항 가운데에 찍힌 면제 표시)", "[삭제·공개 표시] 1항 첫머리의 정보원과 시점 표시가 지워져 문장이 시작 없이 이어진다", "[삭제·공개 표시] 1항 가운데 보안대의 조선말 이름 앞부분이 25X1 로 지워져 `An Tae)` 만 남았다", "[삭제·공개 표시] DISTRIBUTION 표의 배포처 표시 일부가 뭉개져 읽히지 않는다"], "note": "본문이 한 문장뿐인 보고다. 나머지는 서식과 도장이다. 1항의 `An Tae)` 는 보안대(保安隊)의 조선말 읽기를 로마자로 적은 것의 끝부분으로 보이나 앞이 지워져 있어 채우지 않았다. 이 문서철의 다른 문서들이 `Peace Preservation Corps` 를 보안대로 적는다. 기관 이름은 원문 표기를 앞세우고 병기했다. 인민군은 이 해에 창설과 개칭을 겪는 중이라 원문이 무엇이라 불렀는지를 그대로 두었다. 등급 조정 서한의 날짜는 `15 Ocinber i678` 로 찍혀 월과 연도를 확정할 수 없어 고치지 않고 원문을 적었다. 같은 도장이 N66 에서는 `16 October i978` 로 찍혀 있다. 재검토 일자는 `2608` 로 찍혀 있다. N66 의 같은 칸은 2008 이다. 숫자를 고치지 않았다. 면수 칸의 `i` 도 그대로 두었다. 첫 줄의 `HIS 1S UNEVALUATED FNFORMAT)@m 35555` 는 평가되지 않은 정보 표시이고 뒤의 숫자 뭉치는 판독하지 않았다.", "warn": false, "search": "Approved For Release 2003/08/07 : CIA-RDP82-00457R001100730008-5 (앞뒤 면의 공개 승인 도장) 25X1, 25X11 (DATE 줄, SUPPLEMENT 줄, DISTRIBUTION 표, 본문 1항 가운데에 찍힌 면제 표시) 1항 첫머리의 정보원과 시점 표시가 지워져 문장이 시작 없이 이어진다 1항 가운데 보안대의 조선말 이름 앞부분이 25X1 로 지워져 `An Tae)` 만 남았다 DISTRIBUTION 표의 배포처 표시 일부가 뭉개져 읽히지 않는다 Military Information: Change in Organization of North Korean People's Army"}, {"id": "N68", "order": 92, "date": "1947-12-29", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "정치 첩보: 북조선의 정당과 사회단체", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-12-29"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Political Information: Political Parties and Organizations in North Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r001200100010-0"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r001200100010-0"}], "summary": "북조선로동당, 청우당, 민주청년동맹, 직업총동맹, 민주녀성동맹, 민주주의민족통일전선위원회를 차례로 훑고 각 단체의 위원장과 가입 의무를 적었다. 앞선 보고들을 보완하는 문서라고 스스로 밝힌다.", "points": ["최근 KIM Il-song 김일성이 KIM Tu-pong 김두봉을 대신해 북조선로동당 중앙위원회 위원장이 된다. 김두봉은 당원으로 남으나 알려진 직책이 없다.", "북조선청우당(Puk Cho Son Ch'ong U Tang) 중앙위원회 위원장은 KIM Tal-hyon 이다. 자유주의자이고 약간 좌파이나 공산주의자는 분명히 아니라고 적었다. 다만 당의 활동은 로동당이 감독하고 통제한다.", "북조선민주청년동맹은 전에 북조선공산청년동맹이었고 소련 국제공산청년동맹의 지부다. 여덟 살에서 서른 살까지의 남자는 가입이 의무이며 여덟 살에서 열다섯 살은 소년부에 들어간다. 소학교에 들어가면 자동으로 가입한다.", "도·시·군·면마다 위원회가 있고 그 아래 시 구역, 블록, 작은 마을, 학교에 「초급단체(Ch'o Kip Tan Ch'e)」를 둔다.", "북조선직업총동맹은 모든 노동자의 가입이 의무이며 서른두 개 동맹의 상부 조직이다. 여덟 개의 이름을 든다. 군인과 실업자만 제외된다.", "북조선민주녀성동맹은 전에 북조선공산녀성동맹이었고 18세 이상 여성의 가입이 의무다. 위원장은 Pak Chong-ae 박정애, 부위원장은 KI Un-su 다.", "민주주의민족통일전선위원회의 의장은 KIM Tu-pong, 부의장은 CH'OE Yong-kon 이다. 집행권도 입법권도 없으나 정부·정당·단체 대표로 이루어지고 로동당이 좌우한다.", "이 조직의 뿌리를 1940년 충칭에서 만들어진 민족통일전선위원회로 잡고, 거기 참여한 조선인 좌파 네 단체와 해방 뒤 각 단체가 어떻게 갈라지고 합쳤는지를 적었다.", "북조선의 젊은 남자는 대개 정당 하나, 민주청년동맹, 서른두 개 직업동맹 가운데 하나에 겹쳐 속한다고 맺는다."], "primary": "[판독 불가]\n\nR003200100010-0 [원문 그대로]\n\n기밀(CONFIDENTIAL)\n\n29X1A [원문 그대로]\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n0625 [원문 그대로]\n\n국가   조선(Korea)                                          일자: [판독 불가]\n                                                            정보일(INFO.)\n주제   정치 첩보: 북조선의 정당과 사회단체                    배포(DIST.) 1947년 12월 2일\n\n25X1A                                                       면수  3 [원문 `>`]\n출처(ORIGIN)   [판독 불가]                                   보충(SUPPLEMENT)\n\n25X1A   주(Note): 다음 정보는 앞선 보고들을 보완한다.\n\n25X1X\n\n북조선로동당(North Korean Labor Party)\n\n1. 최근 KIM Il-song 김일성이 KIM Tu-pong 김두봉을 대신하여 북조선로동당 중앙위원회 위원장이 되었다. 김두봉은 여전히 로동당 당원이나 당 안에서 알려진 직책은 없다.\n\nCHU Nyong-ha 주녕하(?)[원문 `CHJ Nyong~he`]([한자 판독 불가])가 로동당 중앙위원회 부위원장이다.\n\n북조선청우당(North Korean Youth Friendship Party)\n\n2. 북조선청우당(Puk Cho Son Ch'ong U Tang)[원문 `Par Che Sén Ch'ing U Tang`]([한자 판독 불가]) 중앙위원회 위원장은 KIM Tal-hyon 김달현(?)([한자 판독 불가])이다. KIM 은 자유주의자이며 약간 좌파이나 공산주의자는 분명히 아니다. 다만 그의 당의 활동은 북조선 공산주의의 아성인 로동당이 감독하고 통제한다.\n\n북조선민주청년동맹(North Korean Democratic Young Men's League)\n\n3. 북조선민주청년동맹(Puk Cho Son Min Chu Ch'ong Nyun Tong Maeng)([한자 판독 불가])은 전에 북조선공산청년동맹(North Korean Communist Youth League)([한자 판독 불가])으로 알려졌던 조직이며, 소련의 국제공산청년동맹(International Communist Youth League)의 지부다.\n\n4. 여덟 살에서 서른 살 사이의 모든 남자는 민주청년동맹에 가입하는 것이 의무다. 여덟 살에서 열다섯 살 사이의 소년은 소년부(Juvenile Section)의 성원이 된다. 소학교에 들어갈 때 모든 소년이 자동으로 동맹에 가입한다.\n\n5. 민주청년동맹의 [판독 불가]는 평양(Pyongyang 평양(平壤), 일본식 Heijo)([한자 및 뒤 대목 판독 불가])에 있다.\n\n위원회의 위원장은 KIM [판독 불가][원문 `hIM Chle`]([한자 판독 불가])이고 부위원장은 HO Min 허민(?)([한자 판독 불가])이다.\n\n[판독 불가] 도, 시, 군, 면(myon [한자 판독 불가])마다 위원회가 있다. 그 아래로 시 구역, 시 블록, 작은 마을, 학교에 \"초급단체(primary organs, Ch'o Kip Tan Ch'e)\"[원문 `Chto Kip fan Cn'te`]([한자 판독 불가])라는 더 작은 단위까지 두고 있다.\n\n기밀(CONFIDENTIAL)\n\n이 문서는 중앙정보국장이 [판독 불가]에게 보낸 서한(원문 `letter of 16 October 1873` [원문 그대로])에 따라 기밀(CONFIDENTIAL)로 등급이 조정되었다.\n\n일자(Date): 2 6 [판독 불가]  공개 승인 [판독 불가] 4457R0042001000102021 [원문 그대로] States.\n\n[판독 불가]\n\n등급 변경(CHANGED) [판독 불가]\n비밀해제(DECLASSIFIED) [판독 불가]\n\n29X1X [원문 그대로]\n\n7.\n25X1\n\n공개 승인 [판독 불가] 467R001200100010-0\n\n기밀(CONFIDENTIAL)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n29X1A [원문 그대로]\n\n1¥O06Q2Y [판독 불가]\n\n북조선직업총동맹(North Korean General Trades League)\n\n북조선직업총동맹(Puk Cho Son Chik Op Ch'ong Tong Maeng)([한자 판독 불가])은 북조선의 모든 노동자의 동맹이다. (주: 이 동맹은 앞서 직업동맹(Professional League) 및 노동자동맹(Workers' League)으로 보고된 바 있다.)\n\n모든 노동자의 이 동맹 가입은 의무다. 중앙위원회는 평양에 있고 위원장은 CH'OE Kyong-tok 최경덕(?)([한자 판독 불가])이다. 이 동맹은 서른두 개 동맹의 상부 조직이다. 그 가운데 여덟은 다음과 같다.\n\n(가) 교원문화인동맹(Teachers and Cultural Workers' League, Kyo Won Mun Hwa In Tong Maeng)([한자 판독 불가])\n\n(나) 목재노동자동맹(Lumbermen's League, Mok Chae No Tong Cha Tong Maeng)[원문 `Mok hae No Tong Cha Tong Maenp`]([한자 판독 불가])\n\n(다) 문학예술동맹(Writers' and Literary Artists' League, Mun Hak Ye Sul Tong Maeng)([한자 판독 불가])\n\n(라) 일반노동자동맹(General Workers' League, Il Pan [판독 불가] Tong Op [판독 불가] Tong Maeng)([한자 판독 불가])\n\n(마) 공업기술인동맹(Industrial Technicians' League, Song Sp Ki Sul In Tong Maeng [원문 그대로])([한자 판독 불가])\n\n(바) [판독 불가] 동맹([판독 불가] San Chong Op Won Tong Maeng)([한자 판독 불가])\n\n(사) 축산기술인동맹(Livestock Workers' League, Ch'uk San Ki Sul In [판독 불가] Maeng)([한자 판독 불가])\n\n(아) 농민동맹(Farmers' League, Nong Min Tong Maeng)[원문 `Nong din Tong Maenz`]([한자 판독 불가])\n\n북조선직업총동맹에서 가입이 제외되는 것은 군인과 실업자뿐이다. 이 동맹은 소련이 후원하는 국제노동자연맹(International Workers Federation, ? 세계노동조합연맹(World Federation of Trade Unions)?)의 지부다. 이 동맹의 기능은 북조선의 노동자를 통제하고 규율하며 그들에게 공산주의 교양을 주는 데 있는 것으로 보인다.\n\n북조선민주녀성동맹(North Korean Democratic Women's League)\n\n북조선민주녀성동맹([한자 판독 불가])은 전에 북조선공산녀성동맹(North Korean Communist Women's League)([한자 판독 불가])으로 알려졌던 조직이다. 이 동맹은 소련의 국제공산녀성동맹(International Communist Women's League)의 지부다.\n\n18세 이상의 모든 여성은 이 동맹에 가입하는 것이 의무다. 이 동맹의 중앙위원회는 평양에 있다.\n\n중앙위원회 위원장은 Pak Chong-ae 박정애([한자 판독 불가])이고 부위원장은 KI Un-su [원문 그대로]([한자 판독 불가])다.\n\n민주주의민족통일전선위원회(National Democratic Unified Front Council)\n\nKIM Tu-pong 김두봉[원문 `KIM Ti~pong`]([한자 판독 불가])과 CH'OE Yong-kon 최용건(?)([한자 판독 불가])이 민주주의민족통일전선위원회(Min Chu Chu I Min Chok Tong Il Chon Son Wi Won Hoe)([한자 판독 불가]) (? 민주주의민족전선(National Democratic Front)?)의 의장과 부의장이다.\n\n이 위원회는 정기적으로 모여 국가적으로 중요한 문제를 논의한다. 집행권도 입법권도 없으나 정부, 정당, 수많은 협회와 동맹의 대표로 이루어져 있다. 위원회는 북조선로동당이 좌우한다.\n\n민주주의민족통일전선위원회의 착상은 1940년 충칭(Chungking 중경(重慶))에서 민족통일전선위원회(Min Chok Tong Il Chon Son Wi Won Hoe)([한자 판독 불가])가 만들어졌을 때 비롯되었다. 그 위원회는 다음의 조선인 좌파 단체들의 성원으로 이루어져 있었다.\n\n(가) 조선인민해방대동맹(The Korean People's Liberation League, Cho Son In Min Hae Pang Tae Tong Maeng)([한자 판독 불가])\n\n(나) 조선민족혁명당(The Korean National Revolutionary Party, Cho Son Min Chok Hyok Myong Tang)([한자 판독 불가])\n\n(다) 조선독립동맹(The Korean Independence League, Cho Son Tok Ip Tong Maeng)([한자 판독 불가])\n\n(라) 해외혁명투쟁[판독 불가]지회(The Overseas Revolutionary Fighters' Association, Hae Wae Hyok Myong Tu Chaeng [판독 불가] Chi Hoe)([한자 판독 불가])\n\n기밀(CONFIDENTIAL)\n\n공개 승인 [판독 불가] R001200100010-0\n\n15.\n\n140 62 [판독 불가]\n\n전쟁이 끝나자 이 단체들의 성원 가운데 일부는 옌안(Yenan 연안(延安))과 무크덴(Mukden 봉천(奉天))을 거쳐 북조선으로 갔고, 다른 일부는 상하이(Shanghai 상해(上海))를 거쳐 남조선으로 갔다. 북조선으로 간 이들은 민족통일전선위원회의 착상을 함께 가지고 가서 민주주의민족통일전선위원회를 세웠다.\n\n북조선에서는 조선인민동맹(Korean People's League)과 조선독립동맹(Korean Independence League)이 합쳐 신민당(New Democratic Party)이 되었고, 신민당은 뒤에 북조선공산당(North Korean Communist Party)과 합쳐 북조선로동당이 되었다. 해외혁명투쟁자협회(Overseas Revolutionary Fighters Association)는 이름을 애국투사후원회(Patriotic Fighters' Supporters' Association, Ae Kuk T'u Sa Hu Won Hoe)([한자 판독 불가])로 바꾸었다. 조선민족혁명당은 북조선에서 해산되었으나 지금 남조선에서 재건되고 있다.\n\n겹치는 소속(Multiple Membership)\n\n이 보고에 적은 어느 한 조직에 속한다고 해서 다른 조직에 속하는 것이 배제되지는 않는다. 북조선의 보통 젊은 남자는 대개 인정된 정당 가운데 하나, 민주청년동맹, 그리고 이 보고 7항에 적은 서른두 개 직업동맹 가운데 하나에 속해 있다.\n\n이 문서는 미합중국의 국방에 관계된 정보로서 개정된 간첩법(Espionage Act, 50, U.S.C. 31 및 32)의 적용을 받는 정보를 담고 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방법으로든 누설하는 것은 법으로 금지된다.\n\n[판독 불가]R001200100010-0", "secondary": "[판독 불가]\n\nR003200100010-0 [원문 그대로]\n\nCONFIDENTIAL\n\n29X1A [원문 그대로]\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\n0625 [원문 그대로]\n\nCOUNTRY   Korea                                              DATE: [판독 불가]\n                                                             INFO.\nSUBJECT   Political Information: Political Parties and       DIST. 2 December 1947\n          Organizations in North Korea\n25X1A                                                        PAGES  3 [원문 `>`]\nORIGIN    [판독 불가]                                         SUPPLEMENT\n\n25X1A   Note: The following information amplifies previous reports.\n\n25X1X\n\nNorth Korean Labor Party\n\n1. Recently KIM Il-song replaced KIM Tu-pong as chairman of the Central Committee of the North Korean Labor Party. KIM Tu-pong is still a member of the Labor Party but holds no known office in the party.\n\nCHU Nyong-ha [원문 `CHJ Nyong~he`] ([한자 판독 불가]) is vice-chairman of the Central Committee of the Labor Party.\n\nNorth Korean Youth Friendship Party\n\n2. The chairman of the Central Committee of the North Korean Youth Friendship Party (Puk Cho Son Ch'ong U Tang) [원문 `Par Che Sén Ch'ing U Tang`] ([한자 판독 불가]) is KIM Tal-hyon ([한자 판독 불가]). KIM is a liberal and slightly leftist but definitely not a Communist. The activities of his party, however, are supervised and controlled by the Labor Party, the stronghold of Communism in North Korea.\n\nNorth Korean Democratic Young Men's League\n\n3. The North Korean Democratic Young Men's League (Puk Cho Son Min Chu Ch'ong Nyun Tong Maeng) ([한자 판독 불가]) formerly known as the North Korean Communist Youth League ([한자 판독 불가]), is a branch of the International Communist Youth League of the U.S.S.R.\n\n4. It is compulsory for all males between the ages of eight and thirty to join the Democratic Young Men's League. Boys between the ages of eight and fifteen become members of the Juvenile Section. When entering primary school all boys automatically join the League.\n\n5. [판독 불가] of the Democratic Young Men's League is at Pyongyang (Heijo) ([한자 및 뒤 대목 판독 불가]).\n\nThe chairman of the committee is KIM [판독 불가] [원문 `hIM Chle`] ([한자 판독 불가]), and the vice-chairman is HO Min ([한자 판독 불가]).\n\n[판독 불가] There are committees in every province, city, county and township (myon [한자 판독 불가]). There is even a further breakdown into \"primary organs\" (Ch'o Kip Tan Ch'e) [원문 `Chto Kip fan Cn'te`] ([한자 판독 불가]) in city sections, city blocks, small villages, schools and\n\nCONFIDENTIAL\n\nThis document is hereby regraded to CONFIDENTIAL in accordance with the letter of 16 October 1873 [원문 그대로] from the Director of Central Intelligence to the [판독 불가]\n\nDate: 2 6 [판독 불가]  Approved For [판독 불가] 4457R0042001000102021 [원문 그대로] States.\n\n[판독 불가]\n\nCHANGED [판독 불가]\nDECLASSIFIED [판독 불가]\n\n29X1X [원문 그대로]\n\n7.\n25X1\n\nApproved For Re[판독 불가] 467R001200100010-0\n\nCONFIDENTIAL\n\nCENTRAL INTELLIGENCE GROUP\n\n29X1A [원문 그대로]\n\n1¥O06Q2Y [판독 불가]\n\nNorth Korean General Trades League\n\nThe North Korean General Trades League (Puk Cho Son Chik Op Ch'ong Tong Maeng) ([한자 판독 불가]) is a league of all workers in North Korea. (Note: This league has been previously reported as the Professional League and Workers' League.)\n\nMembership of all workers in this league is compulsory. Its Central Committee is at Pyongyang and its chairman is CH'OE Kyong-tok ([한자 판독 불가]). It is the parent organization to thirty-two leagues. Eight of these leagues are:\n\n(a) Teachers and Cultural Workers' League (Kyo Won Mun Hwa In Tong Maeng) ([한자 판독 불가])\n\n(b) Lumbermen's League (Mok Chae No Tong Cha Tong Maeng) [원문 `Mok hae No Tong Cha Tong Maenp`] ([한자 판독 불가])\n\n(c) Writers' and Literary Artists' League (Mun Hak Ye Sul Tong Maeng) ([한자 판독 불가])\n\n(d) General Workers' League (Il Pan [판독 불가] Tong Op [판독 불가] Tong Maeng) ([한자 판독 불가])\n\n(e) Industrial Technicians' League (Song Sp Ki Sul In Tong Maeng) [원문 그대로] ([한자 판독 불가])\n\n(f) [판독 불가] League ([판독 불가] San Chong Op Won Tong Maeng) ([한자 판독 불가])\n\n(g) Livestock Workers' League (Ch'uk San Ki Sul In [판독 불가] Maeng) ([한자 판독 불가])\n\n(h) Farmers' League (Nong Min Tong Maeng) [원문 `Nong din Tong Maenz`] ([한자 판독 불가])\n\nOnly the military and the unemployed are excluded from membership in the North Korean General Trades League, which is a branch of the Soviet-sponsored International Workers Federation (? World Federation of Trade Unions?). Apparently, the functions of the league are to control and regiment the workers in North Korea and to give them Communist indoctrination.\n\nNorth Korean Democratic Women's League\n\nThe North Korean Democratic Women's League ([한자 판독 불가]) was formerly known as the North Korean Communist Women's League ([한자 판독 불가]). It is a branch of the International Communist Women's League of the U.S.S.R.\n\nMembership in this league is compulsory for all women 18 years of age or older. The Central Committee of this league is at Pyongyang.\n\nThe chairman of the Central Committee is Pak Chong-ae ([한자 판독 불가]); the vice-chairman is KI Un-su [원문 그대로] ([한자 판독 불가]).\n\nNational Democratic Unified Front Council\n\nKIM Tu-pong [원문 `KIM Ti~pong`] ([한자 판독 불가]) and CH'OE Yong-kon ([한자 판독 불가]) are president and vice-president respectively of the National Democratic Unified Front Council (Min Chu Chu I Min Chok Tong Il Chon Son Wi Won Hoe) ([한자 판독 불가]) (? National Democratic Front?).\n\nThe council meets periodically to discuss problems of national importance. Although it has no executive or legislative powers, it is composed of representatives of the government, the political parties and numerous associations and leagues. The council is dominated by the North Korean Labor Party.\n\nThe idea of the National Democratic Unified Front Council originated in Chungking in 1940 when the National Unified Front Committee (Min Chok Tong Il Chon Son Wi Won Hoe) ([한자 판독 불가]) was formed. The committee was composed of members of the following Korean leftist groups:\n\n(a) The Korean People's Liberation League (Cho Son In Min Hae Pang Tae Tong Maeng) ([한자 판독 불가])\n\n(b) The Korean National Revolutionary Party (Cho Son Min Chok Hyok Myong Tang) ([한자 판독 불가])\n\n(c) The Korean Independence League (Cho Son Tok Ip Tong Maeng) ([한자 판독 불가])\n\n(d) The Overseas Revolutionary Fighters' Association (Hae Wae Hyok Myong Tu Chaeng [판독 불가] Chi Hoe) ([한자 판독 불가])\n\nCONFIDENTIAL\n\nApproved For [판독 불가] R001200100010-0\n\n15.\n\n140 62 [판독 불가]\n\nWhen the war ended, some of the members of these groups went to North Korea via Yenan and Mukden; others went to South Korea via Shanghai. Those who went to North Korea took with them the idea of the National Unified Front Committee and established the National Democratic Unified Front Council.\n\nIn North Korea the Korean People's League and the Korean Independence League merged to form the New Democratic Party, which later merged with the North Korean Communist Party to form the North Korean Labor Party. The Overseas Revolutionary Fighters Association changed its name to the Patriotic Fighters' Supporters' Association (Ae Kuk T'u Sa Hu Won Hoe) ([한자 판독 불가]). The Korean National Revolutionary Party was disbanded in North Korea, but is now being reorganized in South Korea.\n\nMultiple Membership\n\nMembership in any one organization mentioned in this report does not exclude the individual from membership in any of the other organizations. The average young man in North Korea is usually a member of one of the accepted political parties, the Democratic Young Men's League and one of the 32 workers' leagues mentioned in paragraph 7 of this report.\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\n[판독 불가]R001200100010-0", "notes": ["[삭제·공개 표시] Approved For Release ... R001200100010-0 (각 면의 공개 승인 도장. 첫 면은 `R003200100010-0`, 2면 상단은 `467R001200100010-0`, 1면 하단은 `4457R0042001000102021` 로 찍혀 서로 다르나 고치지 않았다)", "[삭제·공개 표시] 25X1A, 25X1X, 29X1A, 29X1X, 25X1 (제목 칸 옆과 ORIGIN 줄, 각 면 여백에 반복해 찍힌 면제 표시. 29X1 은 25X1 이 뭉개진 것으로 보이나 찍힌 대로 옮겼다)", "[삭제·공개 표시] ORIGIN 칸의 출처 표시가 25X1A 로 지워져 있다", "[삭제·공개 표시] DATE 칸의 정보 취득 일자가 뭉개져 읽히지 않는다", "[삭제·공개 표시] 1면 아래 등급 처리 도장(CHANGED / DECLASSIFIED / Date)이 겹쳐 찍혀 읽히지 않는다", "[삭제·공개 표시] 5항에서 중앙위원회 소재를 적은 대목 뒤가 스캔 얼룩으로 지워졌다"], "note": "단체 이름이 로마자와 한자로 함께 적혀 있는 문서다. 한자는 스캔에서 모두 뭉개져 한 글자도 확정되지 않아 [한자 판독 불가]로 두었다. 로마자는 원문 표기를 앞세우고 한국어를 병기했으며, 확정할 수 없는 인명에는 물음표를 붙였다. 명백한 판독 오류만 바로잡고 원문을 대괄호에 함께 적었다. `CHJ Nyong~he`, `KIM Ti~pong`, `Par Che Sén Ch'ing U Tang`, `Mok hae`, `Nong din Tong Maenz`, `hIM Chle`, `Chto Kip fan Cn'te` 가 그런 자리다. 직업동맹 (마)의 `Song Sp Ki Sul In Tong Maeng` 과 녀성동맹 부위원장 `KI Un-su` 는 고치지 않고 그대로 두었다. (라)와 (바)는 로마자가 뭉개져 [판독 불가]로 남겼다. 문단 번호가 도중에 사라진다. 1항에서 5항까지는 번호가 붙으나 그 뒤로는 소제목만 이어진다. 다만 마지막 대목이 `paragraph 7 of this report` 를 가리키므로 직업총동맹 대목이 7항이었던 것으로 보인다. 번호를 새로 매기지 않았다. 1면 하단의 등급 조정 서한 날짜는 `16 October 1873` 으로 찍혀 있다. 다른 문서의 같은 도장은 1978년이나 숫자를 고치지 않았다. 문서번호 도장도 면마다 다르게 찍혔고 그대로 두었다. 기관 이름은 이 해에 바뀌는 중이므로 원문이 부른 이름을 앞세웠다. `North Korean Youth Friendship Party` 는 청우당(靑友黨), `Democratic Young Men's League` 는 민주청년동맹, `General Trades League` 는 직업총동맹, `Democratic Women's League` 는 민주녀성동맹이다. 녀성동맹은 북조선 표기를 따랐다. 문서가 스스로 `? World Federation of Trade Unions?`, `? National Democrati , "d557"]]}, {"id": "1945-04-30", "date": "1945-04-30", "label": "히틀러 자살", "bar": true, "where": "베를린 총통관저", "note": "베를린 지하에서 히틀러가 자살하고 되니츠가 승계한다. 되니츠는 전쟁을 계속하겠다고 말했고, 연합국은 히틀러가 순교자로 남는 전설이 만들어지지 않도록 5월 2일 성명을 낸다.", "docs": [["veday-1945", "d75"]]}, {"id": "1945-05-01", "date": "1945-05-01", "docs": [["veday-1945", "d205"]]}, {"id": "1945-05-01-1", "date": "1945-05-01", "docs": [["veday-1945", "d203"]]}, {"id": "1945-05-02", "date": "1945-05-02", "label": "베를린 함락", "bar": true, "where": "베를린", "note": "소련군이 베를린을 함락했다. 이틀 전 히틀러가 자살했고 남은 것은 항복 절차뿐이었다. 미국 문서에 히틀러의 죽음은 부고가 아니라 「항복문서에 서명할 능력이 있는 중앙 권력이 없을 경우」라는 가정으로 나타난다.", "docs": [["veday-1945", "d560"]]}, {"id": "1945-05-04", "date": "1945-05-04", "docs": [["veday-1945", "d561"]]}, {"id": "1945-05-04-1", "date": "1945-05-04", "docs": [["veday-1945", "d562"]]}, {"id": "1945-05-04-2", "date": "1945-05-04", "docs": [["veday-1945", "d212"]]}, {"id": "1945-05-07", "date": "1945-05-07", "docs": [["veday-1945", "d566"]]}, {"id": "1945-05-07-1", "date": "1945-05-07", "docs": [["veday-1945", "d567"]]}, {"id": "1945-05-08", "date": "1945-05-08", "label": "독일 항복", "bar": true, "key": true, "where": "랭스 · 베를린", "note": "5월 7일 새벽 2시 41분 랭스에서 서명이 끝났으나, 발표는 8일까지 묶여 있었다. 스탈린은 동부전선에서 항복 명령이 이행될지 확실치 않다며 소련의 발표를 9일로 미뤘고, 8일 밤 베를린에서 다시 서명한다. 그날 서명한 것은 유럽자문위원회가 여덟 달 다듬어 온 항복문서가 아니라 초기 군사 조항만 담은 간이 문서였다.", "docs": [["veday-1945", "d224"]]}, {"id": "1945-05-10", "date": "1945-05-10", "docs": [["mofa-1945", "d951"]]}, {"id": "1945-05-10-1", "date": "1945-05-10", "docs": [["veday-1945", "d357"]]}, {"id": "1945-05-11", "date": "1945-05-11", "docs": [["surrender-1945", "d349"]]}, {"id": "1945-05-11-1", "date": "1945-05-11", "docs": [["field-1945", "tf58-5"]]}, {"id": "1945-05-12", "date": "1945-05-12", "docs": [["veday-1945", "d235"]]}, {"id": "1945-05-18", "date": "1945-05-18", "docs": [["mofa-1945", "d953"]]}, {"id": "1945-05-21", "date": "1945-05-21", "docs": [["surrender-1945", "d355"]]}, {"id": "1945-05-28", "date": "1945-05-28", "docs": [["surrender-1945", "d379"]]}, {"id": "1945-06-22", "date": "1945-06-22", "docs": [["surrender-1945", "d358"]]}, {"id": "1945-06-27", "date": "1945-06-27", "docs": [["surrender-1945", "d385"]]}, {"id": "1945-06-30", "date": "1945-06-30", "docs": [["mofa-1945", "d960"]]}, {"id": "1945-07-16", "date": "1945-07-16", "docs": [["surrender-1945", "d361"]]}, {"id": "1945-07-17", "date": "1945-07-17", "label": "포츠담 회담", "bar": true, "where": "베를린 근교 포츠담", "note": "트루먼·처칠(뒤에 애틀리)·스탈린의 회담. 회담 중 원폭 실험 성공이 보고되고, 대일 최후통첩의 문안이 다듬어진다."}, {"id": "1945-07-21", "date": "1945-07-21", "docs": [["mofa-1945", "d964"]]}, {"id": "1945-07-26", "date": "1945-07-26", "label": "포츠담 선언", "bar": true, "note": "미·영·중 명의로 일본에 무조건 항복을 요구했다. 제8항에 「카이로 선언의 조항은 이행되어야 한다」고 못박아, 조선 독립 약속이 항복 조건 안으로 들어온다. 일본은 이를 묵살(黙殺)한다고 발표했다."}, {"id": "1945-07-27", "date": "1945-07-27", "docs": [["mofa-1945", "d1079"]]}, {"id": "1945-08", "date": "1945-08", "docs": [["frus-1945", "d771"]]}, {"id": "1945-08-02", "date": "1945-08-02", "docs": [["surrender-1945", "d364"]]}, {"id": "1945-08-04", "date": "1945-08-04", "docs": [["surrender-1945", "d390"]]}, {"id": "1945-08-06", "date": "1945-08-06", "label": "히로시마", "bar": true, "key": true, "note": "히로시마에 원자폭탄이 투하됐다. 트루먼은 같은 날 성명을 내 「이제껏 없던 폭탄」임을 알리고 항복하지 않으면 파멸이 이어질 것이라 경고했다.", "disp": "08.06", "docs": [["surrender-1945", "d401"]]}, {"id": "1945-08-08", "date": "1945-08-08", "label": "소련 참전", "bar": true, "note": "소련이 일본에 선전포고하고 이튿날 만주로 진공했다. 얄타에서 약속한 「독일 항복 뒤 3개월」을 지킨 날짜다. 미국이 조선에 지상군을 두려면 시간이 없다는 것이 이날 분명해진다.", "disp": "08.08", "docs": [["surrender-1945", "d402"]]}, {"id": "1945-08-09", "date": "1945-08-09", "label": "나가사키", "bar": true, "note": "나가사키에 두 번째 원자폭탄이 투하됐다. 같은 날 밤 어전회의가 열려 국체 유지를 조건으로 한 항복 제의가 정해진다.", "docs": [["mofa-1945", "d1085"]]}, {"id": "1945-08-10", "date": "1945-08-10", "disp": "08.10", "docs": [["surrender-1945", "d406"]]}, {"id": "1945-08-10-1", "date": "1945-08-10", "disp": "08.10 06:45", "docs": [["mofa-1945", "d1086"]]}, {"id": "1945-08-10-2", "date": "1945-08-10", "disp": "08.10 18:00", "docs": [["mofa-1945", "d1091"]]}, {"id": "1945-08-11", "date": "1945-08-11", "label": "38선 획정", "bar": true, "key": true, "note": "일반명령 제1호(SWNCC 21/5)가 고쳐지면서 조선이 북위 38도로 갈렸다. 한 문서의 b항과 f항, 다섯 조항 사이에 조선이 둘로 나뉘어 적혔다. 합참이 든 이유는 미군에게 경성의 항만과 교통 지역을 주기 위해서였다.", "docs": [["surrender-1945", "d418"]]}, {"id": "1945-08-11-1", "date": "1945-08-11", "disp": "08.11", "docs": [["surrender-1945", "d410"]]}, {"id": "1945-08-11-2", "date": "1945-08-11", "disp": "08.11", "docs": [["surrender-1945", "d412"]]}, {"id": "1945-08-11-3", "date": "1945-08-11", "disp": "08.11", "docs": [["surrender-1945", "d418"]]}, {"id": "1945-08-11-4", "date": "1945-08-11", "disp": "08.11 10:46", "docs": [["surrender-1945", "d413"]]}, {"id": "1945-08-11-5", "date": "1945-08-11", "disp": "08.11 밤", "docs": [["mofa-1945", "d1093"]]}, {"id": "1945-08-12", "date": "1945-08-12", "disp": "08.12", "docs": [["surrender-1945", "d425"]]}, {"id": "1945-08-12-1", "date": "1945-08-12", "disp": "08.12", "docs": [["surrender-1945", "d427"]]}, {"id": "1945-08-14", "date": "1945-08-14", "disp": "08.14", "docs": [["surrender-1945", "d442"]]}, {"id": "1945-08-14-1", "date": "1945-08-14", "disp": "08.14", "docs": [["surrender-1945", "d431"]]}, {"id": "1945-08-14-2", "date": "1945-08-14", "disp": "08.14", "docs": [["surrender-1945", "d437"]]}, {"id": "1945-08-14-3", "date": "1945-08-14", "disp": "08.14", "docs": [["mofa-1945", "d1098"]]}, {"id": "1945-08-14-4", "date": "1945-08-14", "disp": "08.14 20:05", "docs": [["mofa-1945", "d1097"]]}, {"id": "1945-08-14-5", "date": "1945-08-14", "disp": "08.14 20:10", "docs": [["surrender-1945", "d440"]]}, {"id": "1945-08-15", "date": "1945-08-15", "label": "일본 항복", "bar": true, "key": true, "note": "일본이 포츠담 선언 수락을 방송으로 알렸다. 전날 밤 일부 장교들이 방송을 막으려 궁성을 봉쇄하고 총리 관저를 습격했으나 실패했고, 아나미 육군대신은 새벽에 자결했다.", "disp": "08.15", "docs": [["mofa-1945", "d1100"]]}, {"id": "1945-09-02", "date": "1945-09-02", "label": "항복문서 조인", "bar": true, "where": "도쿄만 미주리함", "note": "도쿄만의 미주리함 위에서 항복문서에 서명했다. 이 문서로 연합국최고사령관(SCAP)의 권한이 발효되고, 일반명령 제1호가 법적 효력을 갖는다."}, {"id": "1945-09-08", "date": "1945-09-08", "label": "미군 인천 상륙", "bar": true, "key": true, "note": "하지 중장의 제24군단이 인천에 상륙해 이튿날 조선총독부의 항복을 받았다. 미군정이 시작된다. 닷새 뒤 하지는 카이로의 「in due course」가 조선어로 「수일 내」로 옮겨져 퍼져 있었다는 것을 알게 된다."}, {"id": "1945-09-09", "date": "1945-09-09", "docs": [["scap-0141", "1"]]}, {"id": "1945-09-13", "date": "1945-09-13", "docs": [["scap-0141", "2"]]}, {"id": "1945-09-24", "date": "1945-09-24", "docs": [["scap-0141", "2-B"]]}, {"id": "1945-09-27", "date": "1945-09-27", "disp": "09.27", "docs": [["surrender-1945", "d507"]]}, {"id": "1945-10-10", "date": "1945-10-10", "disp": "10.10", "docs": [["surrender-1945", "d526"]]}, {"id": "1945-11-13", "date": "1945-11-13", "docs": [["field-1945", "toyoda-2"]]}, {"id": "1945-11-13-1", "date": "1945-11-13", "docs": [["field-1945", "toyoda-5"]]}, {"id": "1945-11-14", "date": "1945-11-14", "docs": [["field-1945", "toyoda-7"]]}, {"id": "1945-11-14-1", "date": "1945-11-14", "docs": [["field-1945", "toyoda-8"]]}, {"id": "1945-11-23", "date": "1945-11-23", "disp": "11.23", "docs": [["surrender-1945", "d488"]]}, {"id": "1945-12-27", "date": "1945-12-27", "label": "모스크바 3상회의", "bar": true, "key": true, "note": "미·영·소 외상이 조선에 최대 5년의 신탁통치를 두고 미소공동위원회를 설치하기로 합의했다. 카이로의 「적당한 시기」가 마침내 문서상의 기한이 된 자리이자, 조선 안에서 신탁통치 반대 운동이 폭발한 계기다."}, {"id": "1946-01", "date": "1946-01", "docs": [["scap-0141", "6"]]}, {"id": "1946-03-20", "date": "1946-03-20", "label": "1차 미소공동위", "bar": true, "where": "서울", "note": "임시정부 수립을 협의할 미소공동위원회가 열렸다. 어느 정당·사회단체와 협의할 것인가를 두고 갈라져 5월에 결렬된다."}, {"id": "1946-04", "date": "1946-04", "docs": [["scap-0141", "7-J"]]}, {"id": "1946-10-01", "date": "1946-10-01", "label": "대구 10월 사건", "bar": true, "note": "식량 공출과 경찰에 대한 항의가 대구에서 시작해 남한 전역으로 번졌다. 미군정이 계엄을 선포하고 진압했다. 점령 1년 만에 통치의 정당성이 시험대에 오른 사건이다."}, {"id": "1947-05-21", "date": "1947-05-21", "label": "2차 미소공동위", "bar": true, "where": "서울", "note": "미소공동위원회가 다시 열렸으나 같은 쟁점에서 다시 갈라져 10월에 사실상 끝난다. 미국은 이 무렵부터 조선 문제를 유엔으로 넘기는 쪽으로 방향을 바꾼다."}, {"id": "1947-09-17", "date": "1947-09-17", "label": "한국 문제 유엔 이관", "bar": true, "key": true, "note": "미국이 조선 문제를 유엔 총회에 상정했다. 4개국 신탁통치라는 전시 구상이 공식적으로 폐기되고, 처리의 무대가 미소 양자에서 유엔으로 옮겨간다."}, {"id": "1948-01-08", "date": "1948-01-08", "label": "유엔한국임시위원단 입국", "bar": true, "note": "유엔한국임시위원단(UNTCOK)이 서울에 들어왔다. 소련이 북위 38도 이북 입경을 거부해, 감시할 수 있는 지역에서만 선거를 치른다는 결론으로 이어진다."}, {"id": "1948-02", "date": "1948-02", "docs": [["ndl-091", "D024"]]}, {"id": "1948-04", "date": "1948-04", "docs": [["ndl-091", "D014"]]}, {"id": "1948-04-02", "date": "1948-04-02", "docs": [["korea-1948-50", "48-d776"]]}, {"id": "1948-04-28", "date": "1948-04-28", "docs": [["korea-1948-50", "48-d790"]]}, {"id": "1948-05-10", "date": "1948-05-10", "label": "5·10 총선거", "bar": true, "key": true, "note": "남한만의 제헌국회 선거가 치러졌다. 좌익과 김구·김규식 계열이 불참했다. 분단이 절차를 갖춘 사실이 되는 날이다."}, {"id": "1948-05-11", "date": "1948-05-11", "docs": [["korea-1948-50", "48-d797"]]}, {"id": "1948-05-15", "date": "1948-05-15", "docs": [["korea-1948-50", "48-d801"]]}, {"id": "1948-08-09", "date": "1948-08-09", "docs": [["korea-1948-50", "48-d862"]]}, {"id": "1948-08-15", "date": "1948-08-15", "label": "대한민국 정부 수립", "bar": true, "key": true, "note": "대한민국 정부가 수립되고 미군정이 끝났다. 카이로에서 「in due course」라고 적힌 지 4년 9개월 뒤다. 북에서는 9월 9일 조선민주주의인민공화국이 수립된다."}, {"id": "1948-08-17", "date": "1948-08-17", "docs": [["korea-1948-50", "48-d872"]]}, {"id": "1948-12-12", "date": "1948-12-12", "label": "유엔총회 결의 195(III)", "bar": true, "where": "파리 유엔총회", "note": "유엔 총회가 대한민국 정부를 위원단이 감시할 수 있었던 지역의 합법 정부로 승인했다. 「조선 전역의 유일 합법 정부」라는 뒷날의 표현과 결의문의 문언은 같지 않다.", "docs": [["korea-1948-50", "48-d924"]]}, {"id": "1948-12-17", "date": "1948-12-17", "docs": [["korea-1948-50", "48-d926"]]}, {"id": "1948-12-22", "date": "1948-12-22", "docs": [["korea-1948-50", "48-d928"]]}, {"id": "1949-03-22", "date": "1949-03-22", "docs": [["korea-1948-50", "49-d209"]]}, {"id": "1949-06-11", "date": "1949-06-11", "docs": [["korea-1948-50", "49-d262"]]}, {"id": "1949-06-26", "date": "1949-06-26", "label": "김구 피살", "bar": true, "key": true, "where": "서울 경교장", "note": "한국독립당 위원장 김구가 육군 소위 안두희의 총에 죽었다. 무초는 이튿날 「공식·비공식 여러 경로에서 지금까지 모은 바」로 시작하는 전문을 올린다 — 전날 첫 전문에는 아무 세부사항이 없었다."}, {"id": "1949-06-27", "date": "1949-06-27", "docs": [["korea-1948-50", "49-d265"]]}, {"id": "1949-06-27-1", "date": "1949-06-27", "docs": [["korea-1948-50", "49-d266"]]}, {"id": "1949-06-29", "date": "1949-06-29", "label": "주한미군 철수 완료", "bar": true, "key": true, "where": "서울", "note": "전투부대 철수가 끝나고 군사고문단(KMAG) 약 500명만 남았다. 철수 날짜를 이승만과 매듭짓는 일이 1949년 전반기 대사관 전문의 주된 내용이었다."}, {"id": "1949-10-01", "date": "1949-10-01", "label": "중화인민공화국 수립", "bar": true, "where": "베이징", "note": "국공내전이 사실상 끝났다. 무초는 다섯 달 전 이승만에게 중국의 결과가 조선에 당장 자국을 남기지는 않으리라고 말했었다."}, {"id": "1950-01-12", "date": "1950-01-12", "label": "애치슨 연설", "bar": true, "key": true, "where": "워싱턴 내셔널프레스클럽", "note": "애치슨이 미국의 태평양 방위선을 알류샨–일본–류큐–필리핀으로 그었다. 조선은 그 선 안에 들지 않았다. 이승만이 아홉 달 전 무초에게 우려한 바로 그 이야기다."}, {"id": "1950-01-20", "date": "1950-01-20", "docs": [["korea-1948-50", "50-d3"]]}, {"id": "1950-06-09", "date": "1950-06-09", "docs": [["korea-1948-50", "50-d46"]]}, {"id": "1950-06-14", "date": "1950-06-14", "docs": [["korea-1948-50", "50-d53"]]}, {"id": "1950-06-19", "date": "1950-06-19", "docs": [["korea-1948-50", "50-d57"]]}, {"id": "1950-06-23", "date": "1950-06-23", "docs": [["korea-1948-50", "50-d58"]]}, {"id": "1950-06-25", "date": "1950-06-25", "label": "한국전쟁 발발", "bar": true, "key": true, "where": "38선 전역", "note": "북한군이 38선 전역에서 남침했다. 유엔 안전보장이사회는 같은 날 결의 82호로 적대행위 중지와 38선 이북으로의 철수를 요구했다.", "docs": [["korea-1950-53", "50-d62"]]}, {"id": "1950-06-27", "date": "1950-06-27", "label": "안보리 결의 83호", "bar": true, "key": true, "where": "뉴욕 유엔 안보리", "note": "안보리가 회원국에 대한민국을 돕는 데 필요한 지원을 권고했다. 소련 대표는 중국 대표권 문제로 회의를 비우고 있어 거부권이 행사되지 않았다.", "docs": [["korea-1950-53", "50-d130"]]}, {"id": "1950-07-07", "date": "1950-07-07", "docs": [["korea-1950-53", "50-d238"]]}, {"id": "1950
