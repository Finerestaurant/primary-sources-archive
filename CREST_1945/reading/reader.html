into Manchuria is to bolster Chinese Communist forces for the May offensive and to relieve certain Korean units numbering about 20,000 men, which had been fighting in Manchuria with the Chinese Communists for some time as members of the Korean Volunteer Corps. The new army was specially trained by Soviets and was described by some of its own members as specially equipped with Soviet and Japanese arms, mostly the latter. It had been training in North Korea since September 1946 as a unit. Its field officers are from the original ranks of the Korean Volunteer Corps, but its squad leaders and many of its junior officers are recent graduates of the Korean Communist Officers Training Schools /[판독 불가] Peace Preservation Corps Officers Training Schools/ in North Korea.\n\nCLASSIFICATION  CONFIDENTIAL\n\nApproved For Release 2006/11/05 : CIA-RDP82-00457R000700420004-7\n\n25X1\n\n25X1\n\nApproved For Release 2006/11/05 : CIA-RDP82-00457R000700420004-7\nCENTRAL INTELLIGENCE GROUP\n\nCONFIDENTIAL\n\n[Comment:]\n\nIt is estimated that the new army of 50,000 [원문 그대로], added to those in the Chientao area and already in the Harbin area, would raise Korean Volunteer Army strength in Manchuria to about 70,000. (Newspapers report from 80,000-100,000.)\n\n[삭제] reported in May that 30,000 cadets of the North Korean Peace Preservation Training Corps were organized into a new Korean army on 22 April. It has also been reported that the Korean Volunteer Army, located in eastern Manchuria, was deactivated and returned to North Korea, the order for the deactivation reportedly having gone out on 15 August 1946. At that time there was no \"Korean National Army\" in existence, but evidence of the formation of such an army from the returned Korean Volunteer Corps (Army) was first reported in October 1946. About November 1946 the North Korean Constabulary, or Kyung Bi Dai, was reported to have merged with the new national army. The same report states that the new Korean army would be called the Kyung Bi Dai. However, other and more recent reports indicate that the name may be officially \"North Korean Volunteer Army\".\n\nOther reports from various sources indicate that the North Korean government, with the backing of the Soviets, has pulled the old Korean Volunteer Corps back to North Korea; put many of its officers into the old Kyung Bi Dai along with Koreans trained in the USSR; put graduates of the North Korean training schools into the lower echelons of the Kyung Bi Dai; merged the Kyung Bi Dai with the main force of the returned Korean Volunteer Corps; and called the new army either the Kyung Bi Dai or the North Korean Volunteer Army. Prior to this, the North Korean forces were known as the \"Army of KIM Il-sung\" or the \"Army of the North Korean People's Committee\", chiefly because a provisional government may not legally maintain an army.\n\nIf the above is true, it is likely that any unit of North Korean troops sent to Manchuria will be a part of the new national army and that irregular units will begin to disappear as they are absorbed into it.\n\nFurther indications are that the North Korean Government, again with the help of the Soviets, is sending large units of the new army to Manchuria to gain battle experience with the Chinese Communists in preparation for a possible war between North and South Korea after the withdrawal of Soviet and American occupation forces. There are reports that large Korean units have moved into the Chiamussu (130-21, 46-29) area and from there to the battle front. These movements differ from those of the fall and winter months of 1946 and early 1947 in that the units involved are coming from North Korea and that they are of much larger size than the units previously reported. The new \"armies\" are usually reported as Soviet-trained and well equipped with Japanese or Soviet weapons. It has not yet been established that Korean troops actually took part in the Chinese Communist attack on Changchun in May, but it is possibly true that they are taking part in the so-called \"May offensive\" and that their units will be found on the major battlefronts. A United Press staff correspondent reports full strength Korean divisions operating in the Kirin area, one of which was on 1 June attacking Yentungshan (125-59, 43-17) and Pishih, 24 miles south of Yentungshan (Panshih--125-59, 42-56?).\n\n[판독 불가] CONTROL U.S. OFFICIALS ONLY\n\nCONFIDENTIAL\n\nApproved For Release 2006/11/05 : CIA-RDP82-00457R000700420004-7", "notes": ["[삭제·공개 표시] Approved For Release 2006/11/05 : CIA-RDP82-00457R000700420004-7 (여러 면의 공개 승인 도장)", "[삭제·공개 표시] 25X1 (표제부와 3항 아래, 2면 여백에 나타난다)", "[삭제·공개 표시] ORIGIN 줄이 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] 논평 둘째 문단 첫머리의 보고 주체가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] 본문 도장: This document is hereby regraded CONFIDENTIAL in accordance with [판독 불가] / Next Review Date: 2008", "[삭제·공개 표시] Document No. / Class. CHANGED TO: TS S / DDA Memo, 4 Apr / Auth: DDA REG. 77 (1978년 등급 처리 도장)"], "note": "이 문서철에서 1947년의 이름 문제를 가장 길게 다룬 보고다. 논평 부분은 절 번호가 없이 이어져 원문대로 번호를 붙이지 않았다. 「Comment」라는 표제가 뭉개져 대괄호로 표시했다. 병력 수를 고치지 않았다. 1항의 `56,000` 과 논평 첫 문단의 `50,000` 이 어긋나지만 둘 다 원문대로 두었다. 3항의 `over GOC underground agents` 는 600 으로 읽힐 여지가 있으나 숫자를 짓지 않고 [판독 불가]로 두었다. 바로 다음 항이 약 300명으로 낮춰 잡는 대목이라 자릿수가 판단에 걸린다. 좌표를 고치지 않았다. 출발지 Choyang 의 `(125-18, 20-50)` 은 위도 20도로 조선에 놓일 수 없는 값이다. 지린의 `(126-32, 43-91)` 은 분이 91 로 성립하지 않는다. 퉁화의 `(125-57, 43-43)` 도 실제 위치와 어긋나 보인다. 수란은 `(126=h8, Lbe-2L)` 로 위도가 살지 않아 [판독 불가]로 두었다. 만주 진입점 `126-05, bie 552` 와 소백두산맥의 `41-52, 128-12?` 는 원문이 슬래시로 감싼 편집자 삽입이다. 물음표까지 살렸다. `Gubeck-san` 은 조선말 산 이름의 로마자 표기인데 음절을 확정할 수 없어 한국어를 짓지 않았다. 3항의 목적지 `Gosngcum` 도 마찬가지다. 기관 이름을 오늘의 말로 바꾸지 않았다. `Kyung Bi Dai` 는 이 문서의 표기 그대로 두고 경비대를 병기했다. 한자는 짓지 않았다. `Peace Preservation Corps` 는 보안대, `North Korean Constabulary` 는 북조선 경비대로 옮기되 원어를 앞세웠다. 5항의 `Korean Communist Officers Training Schools` 뒤에 붙은 슬래시 삽입은 원문 편집자가 보안대 장교학교로 고쳐 읽은 것이다. 마지막 문단의 `Pishih` 와 뒤에 붙은 `(Panshih--125-59, 42-56?)` 도 원문 편집자의 대조 표기다. 물음표를 살렸다.", "warn": false, "search": "KIM Un-kap 김운갑 (새 군의 지휘관, 장성급, 44세) General LIN Piao 린뱌오(林彪) (중국공산군) KIM Il-sung 김일성 (논평에서 이전 명칭의 유래로 언급된다) Approved For Release 2006/11/05 : CIA-RDP82-00457R000700420004-7 (여러 면의 공개 승인 도장) 25X1 (표제부와 3항 아래, 2면 여백에 나타난다) ORIGIN 줄이 먹칠되어 [삭제]로 옮겼다 논평 둘째 문단 첫머리의 보고 주체가 먹칠되어 [삭제]로 옮겼다 본문 도장: This document is hereby regraded CONFIDENTIAL in accordance with [판독 불가] / Next Review Date: 2008 Document No. / Class. CHANGED TO: TS S / DDA Memo, 4 Apr / Auth: DDA REG. 77 (1978년 등급 처리 도장) Military Information: New North Korean Army in Manchuria"}, {"id": "N23", "order": 47, "date": "1947-07-16", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "군사 첩보: 삭주와 그 부근의 소련군, 중국공산군, 조선인 부대", "badge": "secret / control U.S. officials only (면 아래 등급 줄은 confidential)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-07-16"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Soviet, Chinese Communist and Korean Troops in Sakchu and Vicinity", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000700450010-8"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000700450010-8"}], "summary": "압록강 가 삭주 일대의 다섯 마을에 있는 소련군, 중국공산군, 조선인 보안대의 인원과 무기를 마을마다 세어 적었다.", "points": ["한 국경 마을에 세 군대가 겹쳐 있다. 소련군, 중국공산군, 조선인 보안대를 항을 나누어 따로 센다.", "소련군은 마을마다 장교 한둘에 사병 서넛에서 열둘까지로 아주 적다. 이들이 모두 정치 활동에 종사한다고 적었다.", "삭주의 중국공산군은 약 1,000명으로 세 군대 가운데 가장 크다. 무기는 일본제 소총 500정이다.", "중국공산군은 만포진으로 옮겼다가 결국 만주로 들어갈 것으로 본다. 조선 땅을 통로로 쓴다.", "조선인 보안대는 삭주 200명, 청수리 30명, 나머지 마을은 분대 규모다. 병사마다 소총탄 100발을 지닌다.", "사복 차림의 중국공산군도 있다는 편집자 주가 붙는다."], "primary": "국가  조선(Korea)\n\n25X1A\n\n[판독 불가]\n\n비밀/통제 미국 관리 전용(SECRET/CONTROL U.S. OFFICIALS ONLY)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n기밀(CONFIDENTIAL)   일자(DATE)  25X1C\n\n접수(INFO.)  [판독 불가]\n배포(DIST.)  1947년 7월 16일\n[도장: [판독 불가] 중앙정보국장(Director of Central Intelligence) [판독 불가] 미국 국립기록관리청장(Archivist of the United States) [판독 불가]]   면수  2\n보충(SUPPLEMENT)  [판독 불가]\n\n다음 검토 [일자] [판독 불가]\n\n25X1A\n\n25X1X\n\n1. 삭주(Sakchu)와 그 부근의 소련군.\n\n가. 소련군 장교 다섯 명과 병사 12명으로 이루어진 소련군 부대 하나가 삭주(Sakchu, 일본식 Sakushu) (125-02, 40-2[판독 불가])에 주둔한다. 이 부대에 트럭 세 대가 딸려 있다.\n\n나. 소련군 장교 네 명과 사병 일곱 명이 청수리(Chongsuri) (124-540-238) [원문 그대로]에 있다. 이 부대에 트럭 한 대가 딸려 있다.\n\n다. 소련군 장교 두 명과 사병 여섯 명이 청성진(Chongsongjin) (12[판독 불가]-50, 40-2[판독 불가])에 있다.\n\n라. 소련군 장교 두 명과 사병 세 명이 방산동(Pangsandong) (125-00, 40-2[판독 불가]3 [원문 그대로])에 있다.\n\n마. 소련군 장교 한 명과 사병 세 명이 옥강동(Okkangdong, 일본식 Gyokukodo) (12[판독 불가]-4[판독 불가], 40-20)에 있다.\n\n바. 위에 적은 소련군 무리는 모두 정치 활동에 종사하고 있다고 한다.\n\n2. 삭주와 그 부근의 제복 입은 중국공산군.\n\n([삭제] 주: 이 지역에는 사복 차림의 중국공산군도 있다고 보고된다.)\n\n가. 삭주에 제복 입은 중국공산군이 약 1,000명 있다. 이들은 경기관총 30정과 일본제 소총 500정으로 무장하고 있다. 중국공산군 탄약고 두 곳과 중국공산군 보급 창고 두 곳이 삭주에 있다.\n\n나. 청수리에 제복 입은 중국공산군이 약 150명 있다. 이들은 경기관총 3정과 소총 50정으로 무장하고 있다. 이 부대에 트럭 15대가 딸려 있다. 청수리에는 중국공산군 창고가 [판독 불가]곳 있다.\n\n다. 삭주와 청수리의 제복 입은 중국공산군은 머지않아 만포진(Manpojin, [판독 불가]) (126-18, 41-10)으로 옮기고 결국에는 만주로 [판독 불가]할 것으로 예상한다.\n\n비밀/통제 미국 관리 전용(SECRET/CONTROL U.S. OFFICIALS ONLY)\n\n근거(AUTH): [판독 불가]\n\n등급(Class.) [판독 불가]   등급(CLASSIFICATION) [판독 불가]\n\n공개 승인 2001/03/05 : CIA-RDP82-00457R000700[판독 불가]\n\n3. 삭주와 그 부근의 조선인 부대.\n\n가. 삭주에 조선인 보안대(Korean Peace Preservation troops) 병력이 약 200명 있다. 이들은 경기관총 15정과 소총 200정으로 무장하고 있다. 병사마다 소총탄 100발을 지닌다.\n\n나. 청수리에 조선인 보안대 병사가 30명 있다. 이들은 경기관총 3정과 소총 약 20정으로 무장하고 있다. 병사마다 소총탄 100발과 수류탄 두 발을 지닌다.\n\n다. Shengsongjin [원문 그대로]에 조선인 보안대 병사 12명으로 이루어진 분대 하나가 있다. 이들은 경기관총 한 정으로 무장하고 있다.\n\n라. 방산동에 조선인 보안대 병사 열 명으로 이루어진 분대 하나가 있다.\n\n마. 옥강동에 조선인 보안대 병사 여섯 명이 있다.\n\n참고자료실 서고(REFERENCE CENTER LIBRARY)\n\n기밀(CONFIDENTIAL)\n비밀/통제 미국 관리 전용(SECRET/CONTROL U.S. OFFICIALS ONLY)\n\n공개 승인 2001/03/05 : CIA-RDP82-00457R000700450010-8", "secondary": "COUNTRY  Korea\n\n25X1A\n\n[판독 불가]\n\nSECRET/CONTROL U.S. OFFICIALS ONLY\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCONFIDENTIAL   DATE  25X1C\n\nINFO.  [판독 불가]\nDIST.  16 July 1947\n[Stamp: [판독 불가] Director of Central Intelligence [판독 불가] Archivist of the United States [판독 불가]]   PAGES  2\nSUPPLEMENT  [판독 불가]\n\nNext Review [Date] [판독 불가]\n\n25X1A\n\n25X1X\n\n1. Soviet Troops in Sakchu and Vicinity.\n\na. One Soviet unit of five Soviet Army officers and 12 soldiers is stationed at Sakchu (Sakushu) (125-02, 40-2[판독 불가]). Three trucks are attached to this unit.\n\nb. Four Soviet Army officers and seven enlisted soldiers are at Chongsuri (124-540-238) [원문 그대로]. One truck is attached to this unit.\n\nc. Two Soviet Army officers and six enlisted soldiers are at Chongsongjin (12[판독 불가]-50, 40-2[판독 불가]).\n\nd. Two Soviet Army officers and three enlisted soldiers are at Pangsandong (125-00, 40-2[판독 불가]3 [원문 그대로]).\n\ne. One Soviet Army officer and three enlisted soldiers are at Okkangdong (Gyokukodo) (12[판독 불가]-4[판독 불가], 40-20).\n\nf. All of the above-mentioned Soviet groups are reportedly engaged in political activity.\n\n2. Uniformed Chinese Communist Troops in Sakchu and Vicinity.\n\n([삭제] note: Chinese Communist troops in plain clothes are also reported in this area.)\n\na. There are approximately 1,000 Chinese Communist troops in uniform at Sakchu. They are armed with 30 light machine guns and 500 Japanese rifles. Two Chinese Communist ammunition dumps and two Chinese Communist supply warehouses are in Sakchu.\n\nb. There are approximately 150 Chinese Communist troops in uniform at Chongsuri. They are armed with 3 light machine guns and 50 rifles. 15 trucks are attached to this unit. There are [판독 불가] Chinese Communist warehouses in Chongsuri.\n\nc. The Chinese Communist uniformed troops at Sakchu and Chongsuri expect to move to Manpojin ([판독 불가]) (126-18, 41-10) in the near future and eventually [판독 불가] Manchuria.\n\nSECRET/CONTROL U.S. OFFICIALS ONLY\n\nAUTH: [판독 불가]\n\nClass. [판독 불가]   CLASSIFICATION [판독 불가]\n\nApproved For Release 2001/03/05 : CIA-RDP82-00457R000700[판독 불가]\n\n3. Korean Troops in Sakchu and Vicinity.\n\na. There are approximately 200 Korean Peace Preservation troops in Sakchu. They are armed with 15 light machine guns and 200 rifles. Each soldier has 100 rounds of rifle ammunition.\n\nb. There are 30 Korean Peace Preservation soldiers in Chongsuri. They are armed with 3 light machine guns and approximately 20 rifles. Each soldier has 100 rounds of rifle and two hand grenades.\n\nc. There is one squad of 12 Korean Peace Preservation soldiers at Shengsongjin [원문 그대로]. They are armed with one light machine gun.\n\nd. There is a squad of ten Korean Peace Preservation soldiers at Pangsandong.\n\ne. Six Korean Peace Preservation soldiers are at Okkangdong.\n\nREFERENCE CENTER LIBRARY\n\nCONFIDENTIAL\nSECRET/CONTROL U.S. OFFICIALS ONLY\n\nApproved For Release 2001/03/05 : CIA-RDP82-00457R000700450010-8", "notes": ["[삭제·공개 표시] Approved For Release 2001/03/05 : CIA-RDP82-00457R000700450010-8 (두 면의 공개 승인 도장)", "[삭제·공개 표시] 25X1A, 25X1C, 25X1X (표제부와 본문 앞 여백)", "[삭제·공개 표시] 2항 첫머리 편집자 주의 주체가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] 표제부 도장: Director of Central Intelligence / Archivist of the United States / Next Review Date", "[삭제·공개 표시] AUTH / Class. CHANGED TO (등급 처리 도장)"], "note": "서술이 짧고 항이 잘게 나뉘어 있어 본문 자체는 비교적 잘 읽힌다. 대신 좌표가 거의 다 깨졌다. 숫자를 고치지 않았다. 청수리의 `(124-540-238)` 은 도와 분의 구분이 무너져 네 자리 좌표로 세울 수 없다. 원문 그대로 두었다. 방산동의 `(125-00,40~2:3)` 은 분 가운데에 기호가 끼어 있다. 삭주 `(125002,40~21,)` 과 청성진 `(12),—50 ,40~21,)` 은 분의 끝자리를 확정할 수 없다. 옥강동 `(12)--l.,40-20)` 은 경도가 살지 않았다. 만포진 `(126-18, 41-10)` 만 온전하다. 지명이 문서 안에서 어긋난다. 1항 다의 `Chongsongjin` 이 3항 다에서는 `Shengsongjin` 으로 찍혀 있다. 같은 곳으로 보이나 고치지 않고 각각 원문대로 두었다. 만포진의 일본식 이름이 `frenpcent` 로 찍혀 음을 세울 수 없어 [판독 불가]로 두었다. 삭주와 옥강동은 일본식 이름 Sakushu 와 Gyokukodo 가 살아 있어 병기했다. 청수리, 청성진, 방산동은 일본식 이름이 원문에 없다. 2항 나의 창고 수는 `§` 로 찍혀 숫자를 짓지 않았다. 2항 다의 `eventually [판독 불가] Manchuria` 는 만주로 들어간다는 뜻의 동사가 뭉개진 것이다. `Korean Peace Preservation troops` 는 보안대로 옮기고 원어를 앞세웠다. 같은 문서철 N22 가 같은 조직을 두고 이름이 바뀌는 중이라고 적는 것과 나란히 읽힌다. 3항 나의 `100 rounds of rifle and two hand grenades` 는 원문에 ammunition 이 빠져 있다. 앞 항에 맞추어 소총탄으로 옮겼다.", "warn": false, "search": "Approved For Release 2001/03/05 : CIA-RDP82-00457R000700450010-8 (두 면의 공개 승인 도장) 25X1A, 25X1C, 25X1X (표제부와 본문 앞 여백) 2항 첫머리 편집자 주의 주체가 먹칠되어 [삭제]로 옮겼다 표제부 도장: Director of Central Intelligence / Archivist of the United States / Next Review Date AUTH / Class. CHANGED TO (등급 처리 도장) Military Information: Soviet, Chinese Communist and Korean Troops in Sakchu and Vicinity"}, {"id": "N24", "order": 48, "date": "1947-07-18", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "군사 첩보: 서북조선의 경비대", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-07-18"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: The Constabulary in Northwest Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000700550002-6"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000700550002-6"}], "summary": "의주 일대에 배치된 조선 경비대 120명의 주둔지와 임무, 무장을 적었다. 머리에 붙은 주에서 18세부터 30세까지의 북조선 청년을 경비대에 넣는다는 소문과, 1946년 11월 경비대가 조선국군의 이름이 되었다는 보고를 함께 전한다.", "points": ["실제 징병 계획은 아직 보고된 바 없으나 대규모 징병의 소문이 계속된다고 적었다. 18세부터 30세까지의 청년 221명(원문 그대로)을 가까운 시일에 경비대에 넣는다는 것이다.", "1946년 11월 Kyung Bi Dai 경비대가 조선국군(Korean National Army)의 이름이 되었고 원래의 경비대가 여기에 합쳐졌다는 보고를 덧붙였다. 이 해에 이름이 바뀌는 중임을 보여 준다.", "의주(Uiju 義州, 일본식 Gishu) 일대에 경비대 120명이 있다. 본부는 옛 일본인 건물에 두었다.", "임무는 조선과 만주의 국경인 압록강 기슭을 지키는 것이다. 의주 일대에서는 강기슭을 따라 50미터마다 보초를 세운다.", "무장은 일본제 38식 소총이다. 훈련은 의주 부근 산에서 이따금 한다.", "의주 일대 경비대원은 모두 북조선의 다른 지방에서 온 사람이고, 말씨가 그것을 드러낸다고 적었다.", "괄호 안의 이름은 매큔라이샤워 방식으로 로마자화했다는 주가 붙어 있다."], "primary": "공개 승인 2005/05/16 : [판독 불가]\n\n문서번호 [판독 불가]\n\n등급 변경 없음(NO CHANGE in Class.) [판독 불가]\n\n25X1\n\n[중앙]정보단([CENTRAL] INTELLIGENCE GROUP)\n\n일자: [판독 불가]\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가  조선                              일자(DATE)\n                                        입수(INFO.)\n주제  군사 첩보: 서북조선의 경비대(Military Information: The Constabulary in Northwest Korea)\n                                        배포(DIST.)  1947년 7월 [판독 불가]일\n                                        면수  1\n보충(SUPPLEMENT)\n\n출처(ORIGIN)\n\n배포처(DISTRIBUTION)  [판독 불가]\n국무부(STATE) | 육군부(WAR) | 해군부(NAVY) | [판독 불가]\n\n25X1\n25X1\n25X1\n\n주(Note): 실제 징병 계획이 보고된 바는 아직 없으나, 북조선 청년의 대규모 징병에 관한 소문이 끈질기게 이어져 왔다. 이 소문에 따르면 18세에서 30세 사이의 청년 221명 [원문 그대로]이 가까운 시일 안에 북조선 경비대(North Korean Constabulary, Kyung Bi Dai [한자 판독 불가])에 편입될 것이라고 한다. 또한 1946년 11월에 Kyung Bi Dai 경비대가 조선국군(Korean National Army)의 이름이 되었고, 원래의 Kyung Bi Dai 경비대가 여기에 합쳐졌다고 보고된 바 있다.\n\n의주 일대의 경비대(Constabulary in the Uiju Area)\n\n1. 의주(Uiju 義州, 일본식 Gishu 기슈) (126-22, 40-12) 일대에 조선 경비대 병력 120명이 있다. 본부는 옛 일본인 [판독 불가]에 있으며 [판독 불가] 구역([한자 판독 불가])에 자리한다.\n\n25X1\n\n2. 오작동(Ojok-tong) (224-30, [판독 불가]) [원문 그대로], 승하도(Sungha Island) [판독 불가], 그리고 의주의 [판독 불가] 수구(Sugu [한자 판독 불가]) 구역들에 경비 분소가 [판독 불가] 있다. 수구동(Sugu-dong, Guixodo, 124-38, 40[판독 불가]16)이라 불리는 곳은 의주에서 동쪽으로 약 [판독 불가] 지점이다.\n\n25X1\n25X1\n\n3. 이 병력의 주된 임무는 조선과 만주의 국경인 압록강(Yalu River) 기슭을 지키는 것이다. 의주 일대에서는 강기슭을 따라 50미터마다 보초를 세운다. 무장은 일본제 38식 소총(Japanese Model 38 rifles)이다. 의주 부근 산에서 이따금 훈련이 실시된다.\n\n4. 의주 일대 경비대원은 모두 북조선의 다른 지방에서 왔으며, 가장 많은 수가 [판독 불가]에서 왔다. [삭제] 주(Note): 병력 대부분이 [판독 불가]의 말씨를 쓴다.\n\n기밀(CONFIDENTIAL)\n\n25X1\n25X1\n\n주(Note): 괄호 안에 나오는 이름은 매큔라이샤워(McCune-Reischauer) 방식에 따라 로마자로 적은 것이다.\n\n경고: 이 문서를 공개하기 전에 배포처 목록을 반드시 삭제할 것.\n\n25X1\n\n공개 승인 2005/05/16 : CIA-RDP82-00457R000700550002-6", "secondary": "Approved For Release 2005/05/16 : [판독 불가]\n\nDocument No. [판독 불가]\n\nNO CHANGE in Class. [판독 불가]\n\n25X1\n\n[CENTRAL] INTELLIGENCE GROUP\n\nDate: [판독 불가]\n\nINTELLIGENCE REPORT\n\nCOUNTRY  Korea                          DATE\n                                        INFO.\nSUBJECT  Military Information: The Constabulary in Northwest Korea\n                                        DIST.  [판독 불가] July 1947\n                                        PAGES  1\nSUPPLEMENT\n\nORIGIN\n\nDISTRIBUTION  [판독 불가]\nSTATE | WAR | NAVY | [판독 불가]\n\n25X1\n25X1\n25X1\n\nNote: Although no actual conscription program has yet been reported, there have been persistent rumors of large scale conscription of North Korean young men. According to these rumors 221 [원문 그대로] young men between the ages of 18 and 30 will be inducted into the North Korean Constabulary (Kyung Bi Dai [한자 판독 불가]) in the near future. It has also been reported that the Kyung Bi Dai became, in November 1946, the name for the Korean National Army, with which the original Kyung Bi Dai was merged.\n\nConstabulary in the Uiju Area\n\n1. There are 120 Korean Constabulary troops in the Uiju (Gishu) (126-22, 40-12) area. Their main headquarters is in the former Japanese [판독 불가] in the [판독 불가] district ([한자 판독 불가]).\n\n25X1\n\n2. [판독 불가] are guard sub-stations in Ojok-tong (224-30, [판독 불가]) [원문 그대로], on Sungha Island [판독 불가], and in the [판독 불가] Sugu [한자 판독 불가] districts of Uiju. [판독 불가] called Sugu-dong (Guixodo, 124-38, 40[판독 불가]16) is approximately [판독 불가] east of Uiju.\n\n25X1\n25X1\n\n3. The chief duty of the troops is to guard the Yalu River bank on the Korean-Manchurian border. Guards are stationed every 50 meters along the river bank in the Uiju area. They are equipped with Japanese Model 38 rifles. Occasional training exercises are held in the mountains near Uiju.\n\n4. All members of the Constabulary in the Uiju area came from other parts of North Korea, the largest number coming [판독 불가]. [삭제] Note: most of the troops speak the dialect of [판독 불가].\n\nCONFIDENTIAL\n\n25X1\n25X1\n\nNote: The names appearing in brackets are romanized according to the McCune-Reischauer system.\n\nWARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT.\n\n25X1\n\nApproved For Release 2005/05/16 : CIA-RDP82-00457R000700550002-6", "notes": ["[삭제·공개 표시] Approved For Release 2005/05/16 : CIA-RDP82-00457R000700550002-6 (첫 면과 끝 면의 공개 승인 도장. 첫 면 것은 스캔에서 뭉개졌다)", "[삭제·공개 표시] 25X1 (본문 왼쪽 여백에 여덟 군데 이상 반복된다)", "[삭제·공개 표시] Document No. [판독 불가] / NO CHANGE in Class. (등급 처리 도장)", "[삭제·공개 표시] 4항의 정보원 주 앞에 먹칠된 자리가 있어 [삭제]로 옮겼다", "[삭제·공개 표시] WARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT"], "note": "이번에 맡은 여섯 건 가운데 OCR 상태가 가장 나쁘다. 표제부와 배포처 줄이 거의 무너져 있어 상당 부분을 [판독 불가]로 두었다. 원문 표기는 `Kyung Bi Dal` 과 `Kyung Bi Dail` 로 두 번 다르게 찍혀 있는데, 같은 낱말의 오독으로 보아 `Kyung Bi Dai` 로 옮기고 경비대를 병기했다. 뒤에 붙은 한자는 뭉개져 확정되지 않아 짓지 않았다. 이 문서는 경비대(Kyung Bi Dai)와 조선국군(Korean National Army)을 구별해 적고 있고, 1946년 11월에 이름이 옮겨 갔다고 본다. 원문 표기를 그대로 두었다. 인원수 `221` 은 문맥상 어색하나 숫자를 고치지 않고 원문대로 두었다. 좌표도 고치지 않았다. 의주의 `(126-22, 40-12)` 는 온전하다. 오작동의 `(224-30, ...)` 은 경도 앞자리가 224로 찍혀 성립하지 않는 값이고 위도는 `0u12` 로 깨져 있다. 수구동의 `(124-38, 40<16)` 은 위도의 도와 분 사이가 깨져 있다. 지명은 조선 이름과 일본식 이름을 함께 적는 이 계열의 관례를 따라 `Uiju (Gishu)` 를 둘 다 살렸다. `Sugu-dong (Guixodo, ...)` 의 괄호 안 표기도 원문대로 두었다. 4항의 출신지와 말씨가 적힌 대목은 스캔에서 뭉개져 지명을 읽을 수 없다. 짐작해 채우지 않았다.", "warn": true, "search": "Approved For Release 2005/05/16 : CIA-RDP82-00457R000700550002-6 (첫 면과 끝 면의 공개 승인 도장. 첫 면 것은 스캔에서 뭉개졌다) 25X1 (본문 왼쪽 여백에 여덟 군데 이상 반복된다) Document No. [판독 불가] / NO CHANGE in Class. (등급 처리 도장) 4항의 정보원 주 앞에 먹칠된 자리가 있어 [삭제]로 옮겼다 WARNING NOTICE: THIS DISTRIBUTION LISTING MUST BE EXCISED BEFORE PUBLIC RELEASE OF THIS DOCUMENT Military Information: The Constabulary in Northwest Korea"}, {"id": "N25", "order": 49, "date": "1947-07-21", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "경제 첩보: 소련의 도움을 받은 북조선으로의 자본 이전", "badge": "[판독 불가] (CONTROL: U.S. OFFICIALS ONLY)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-07-21"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Economic Information: Transfer of Capital to North Korea with Soviet Assistance", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000700470008-9"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000700470008-9"}], "summary": "상하이의 조선인 무리가 부유한 조선인의 재산을 소련 영사관과 소련계 회사를 거쳐 북조선으로 옮겨 준다며 값의 절반을 요구한다는 보고다. 1946년 8월에 넘어간 미화 85,000달러의 예치 경로를 적었다. 나라 구분은 중국으로 되어 있다.", "points": ["상하이의 조선인 무리가 부유한 조선인에게 자본을 북조선으로 옮겨 주겠다고 제안한다. 통로는 소련 영사관과 그 밖의 소련 기관과 회사다.", "옮길 수 있는 재산은 다이아몬드, 금괴, 미국 통화로 제한된다. 무리가 요구하는 값은 옮기는 재산의 50퍼센트다.", "무리를 이룬 사람은 YU In-sop, YI Pyong-nam, Jacky Park 이다. 소련 기관과의 연락은 상하이 창고회사 이사 Segal 이 맡고, 그의 몫은 무리가 가져가는 몫에서 뗀다.", "1946년 8월 조선인 세 사람이 미화 85,000달러를 북조선 송금용으로 넘겼다. SONG Chuk-chi, KIM Pak-chu, CHOI Mang-kuei 다.", "돈은 모스크바 나로드니 은행에 두 회사 이름으로 예치되었다. 60,000달러는 시네마 아츠 코퍼레이션, 25,000달러는 인베스트먼트 앤드 트레이딩 컴퍼니 계좌다.", "1946년 9월 J. Shelestian 이 상하이를 떠나며 이 계좌들의 예금을 인출해 조선으로 가져가려 했다.", "비슷한 방식의 송금이 더 있었고, 옮겨진 돈은 조선의 개인에게 지급되지 않고 평양의 조선상업은행에 예치되었다.", "앞장에 정정 쪽이 붙어 6항의 문장을 고쳐 놓았다. 본문과 정정문의 연도가 서로 다르다."], "primary": "공개 승인 2001/03/05 : CIA-RDP82-00457R00070047006[판독 불가]\n\n미국 관리 전용(U.S. OFFICIALS ONLY)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가  중국(China)                       일자(DATE):  25X1C\n                                        입수(INFO.)\n주제  경제 첩보: 소련의 도움을 받은 북조선으로의 자본 이전(Economic Information: Transfer of Capital to North Korea with Soviet Assistance)\n                                        배포(DIST.)  1947년 7월 [판독 불가]일\n                                        면수  1\n보충(SUPPLEMENT)\n\n정정(Correction)\n\n6항의 [판독 불가]는 다음과 같이 읽어야 한다. 「JOL6년 [원문 그대로] 11월 현재 Shelestian 은 [판독 불가] 조선에 있다고 보고되었다.」\n\n현지 배포는 위에 적은 대로 이루어졌다.\n\n이 문서는 개정된 방첩법(Espionage Act) 미국법전 제50편 제31조 및 제32조가 정한 바에 따라 미국의 국방에 관계되는 정보를 담고 있다. 권한 없는 자에게 이를 전달하거나 그 내용을 어떤 방식으로든 누설하는 것은 법으로 금지된다.\n\n문서번호 007\n등급 변경 없음(NO CHANGE in Class.) [ ]\n[ ] 비밀해제(DECLASSIFIED)\n등급을 다음으로 변경(Class. CHANGED TO): TS  S  C\nDDA 각서, 1977년 4월 4일\n근거(Auth.): DDA REG. 77 [판독 불가]\n일자: [판독 불가]\n\n등급(CLASSIFICATION)  [판독 불가]  통제(CONTROL): 미국 관리 전용(U.S. OFFICIALS ONLY)\n\n공개 승인 2001/03/05 : CIA-RDP82-00457R000700470008-9\n\n[면 2]\n\n공개 승인 2001/03/05 : CIA-RDP82-00457R000700470008-9\n\n이 문서는 개정된 방첩법(Espionage Act) 미국법전 제70편 [원문 그대로] 제31조 및 제32조가 정한 바에 따라 미국의 국방에 관계되는 정보를 담고 있다. 권한 없는 자에게 이를 전달하거나 그 내용을 어떤 방식으로든 누설하는 것은 법으로 금지된다.\n\n기밀(CONFIDENTIAL)\n\n25X1\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가  중국(China)                       일자(DATE):  25X1C\n                                        입수(INFO.)\n주제  경제 첩보: 소련의 도움을 받은 북조선으로의 자본 이전\n                                        배포(DIST.)  1947년 7월 [판독 불가]일\n25X1C                                   면수  2\n보충(SUPPLEMENT)\n\n25X1A\n25X1A\n\n1. 지난 [판독 불가] 해 동안 소수의 조선인 무리가 상하이(Shanghai 上海)의 부유한 조선인들과 접촉하면서, 상하이에서 북조선으로 조선인 자본을 옮기는 일을 주선하자고 권해 왔다. 이 이전은 소련 영사관(Soviet Consulate)과 그 밖의 소련 기관 및 회사를 통해 이루어질 수 있다. 옮길 자본은 다이아몬드, 금괴, 미국 통화로 제한되어야 한다. 이 무리가 요구하는 조건은 옮길 자본 가치의 50퍼센트다. ([삭제] 주: 이것을 어떻게 지불하는지는 적혀 있지 않다. 아마도 옮길 금액의 절반을 무리가 가져가는 것으로 보인다. 예치가 이루어지기 전에 무리가 제 몫을 떼어 간다는 것을 보여 주는 [판독 불가]항을 볼 것.)\n\n2. 1944년 [원문 그대로] 11월 이 무리는 다음으로 이루어져 있었다. YU In-sop [판독 불가]([한자 판독 불가]), YI Pyong-nam [LI Pyong-nam]([한자 판독 불가]), 그리고 Jacky Park [PAK [판독 불가]]([한자 판독 불가])이다. 이 무리가 소련 기관들과 연락하는 사람은 [판독 불가] Segal 이며 상하이 창고회사(Shanghai Storage Company)의 이사다. Segal 의 몫은 자본 총액의 [205 원문 그대로]이고, 이 금액은 무리가 가져가는 [5603 원문 그대로]에서 뗀다.\n\n3. 많은 고객 후보가 이 무리와 교섭했으나 실제로 귀중품을 넘긴 사람은 적다.\n\n4. 1946년 8월 다음 조선인들이 북조선으로 보내기 위해 미화 85,000달러를 넘겼다. SONG Chuk-chi([한자 판독 불가])는 상하이에서 조선인 공산주의자들을 도왔고 소련 정보원들을 위해 조선인 쪽에서 정보를 [판독 불가]한 것으로 알려져 있다. KIM Pak-chu([한자 판독 불가])는 상하이의 친소 조선인 집단 [판독 불가]와 연줄이 있다. CHOI Mang-kuei [CHOE Min-kye]([한자 판독 불가])는 전에 상하이에서 영향력 있던 조선인 상인이다.\n\n5. 이 미화 85,000달러는 모스크바 나로드니 은행(Moscow Narodny Bank)에 다음 회사들의 이름으로 예치되었다.\n   가. 미화 60,000달러는 시네마 아츠 코퍼레이션(Cinema Arts Corporations, 뮤지엄 로 142번지) 계좌로.\n   나. 미화 25,000달러는 인베스트먼트 앤드 트레이딩 컴퍼니(Investment and Trading Company, 중정로 9번지) 계좌로.\n\n6. 1946년 9월 J. Shelestian 씨는 전에 [판독 불가] 무역대리점에 있던 사람으로, 상하이를 떠나 소련으로 갔다. 떠나기 전에 그는 모스크바 나로드니 은행에서 위에 적은 계좌들에 예치된 금액을 인출했으며, 그것을 조선으로 가져갈 뜻이었다. ([삭제] 주: 1942년 [원문 그대로] 11월 현재 Shelestian 은 조선에 있다고 보고되었다.)\n\n7. 다른 소련 기관과 회사의 계좌를 이용해 비슷한 방식으로 통화를 보낸 일이 더 있었다. 옮겨진 자금은 조선 안의 개인에게 지급되지 않았고 평양(Pyongyang, 일본식 Heijo 헤이조) (25-hh [원문 그대로], 39-01)의 조선상업은행(Korean Commercial Bank)에 예치되었다.\n\n등급(CLASSIFICATION)  [판독 불가]  통제(CONTROL): 미국 관리 전용(U.S. OFFICIALS ONLY)", "secondary": "Approved For Release 2001/03/05 : CIA-RDP82-00457R00070047006[판독 불가]\n\nU.S. OFFICIALS ONLY\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCOUNTRY  China                          DATE:  25X1C\n                                        INFO.\nSUBJECT  Economic Information: Transfer of Capital to North Korea with Soviet Assistance\n                                        DIST.  [판독 불가] July 1947\n                                        PAGES  1\nSUPPLEMENT\n\nCorrection\n\nIn paragraph 6 the [판독 불가] should read: \"As of November JOL6 [원문 그대로] Shelestian [판독 불가] was reported to be [in Korea]\".\n\nField distribution was made as indicated above.\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nDocument No. 007\nNO CHANGE in Class. [ ]\n[ ] DECLASSIFIED\nClass. CHANGED TO: TS  S  C\nDDA Memo, 4 Apr 77\nAuth: DDA REG. 77 [판독 불가]\nDate: [판독 불가]\n\nCLASSIFICATION  [판독 불가]  CONTROL: U.S. OFFICIALS ONLY\n\nApproved For Release 2001/03/05 : CIA-RDP82-00457R000700470008-9\n\n[면 2]\n\nApproved For Release 2001/03/05 : CIA-RDP82-00457R000700470008-9\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 70 [원문 그대로] U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nCONFIDENTIAL\n\n25X1\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCOUNTRY  China                          DATE:  25X1C\n                                        INFO.\nSUBJECT  Economic Information: Transfer of Capital to North Korea with Soviet Assistance\n                                        DIST.  [판독 불가] July 1947\n25X1C                                   PAGES  2\nSUPPLEMENT\n\n25X1A\n25X1A\n\n1. For the [판독 불가] year a small group of Koreans has been making contact with wealthy Koreans in Shanghai and suggesting that transfers of Korean capital from Shanghai to North Korea be arranged. These transfers may be made through the Soviet Consulate and other Soviet organizations and firms. The capital to be transferred must be restricted to diamonds, gold bars and U.S. currency. The terms demanded by the gang are 50% of the value of the capital to be transferred. ([삭제] Note: It is not stated how this is to be paid. Presumably half of the amount to be transferred is retained by the gang. See paragraph [판독 불가] which indicates that the gang takes its share before deposits are made.)\n\n2. In November 1944 [원문 그대로] the group consisted of: YU In-sop [판독 불가] ([한자 판독 불가]), YI Pyong-nam [LI Pyong-nam] ([한자 판독 불가]), and Jacky Park [PAK [판독 불가]] ([한자 판독 불가]). The group's contact man with Soviet organizations is [판독 불가] Segal, director of the Shanghai Storage Company. Segal's cut is [205 원문 그대로] of the total value of the capital, this amount to be deducted from the [5603 원문 그대로] taken by the group.\n\n3. Many prospective customers have negotiated with the group but few have turned over their valuables.\n\n4. In August 1946 the following Koreans turned over US $85,000 for transmittal to North Korea: SONG Chuk-chi ([한자 판독 불가]) who is known to have assisted Korean Communists in Shanghai and to have [판독 불가] intelligence from Korean sources for Soviet agents; KIM Pak-chu ([한자 판독 불가]), who has connections with the [판독 불가] of the pro-Soviet group of Koreans in Shanghai; CHOI Mang-kuei [CHOE Min-kye] ([한자 판독 불가]), formerly an influential Korean businessman in Shanghai.\n\n5. This US $85,000 was deposited in the Moscow Narodny Bank in the name of the following firms:\n   a. US $60,000 for the account of Cinema Arts Corporations, 142 Museum Rd.\n   b. US $25,000 for the account of Investment and Trading Company, 9 Chung Cheng Road.\n\n6. In September 1946, Mr. J. Shelestian, formerly of the [판독 불가] Trading Agency, left Shanghai for the USSR. Before his departure he withdrew from the Moscow Narodny Bank the sums deposited in the above mentioned accounts with the intention of taking them to Korea. ([삭제] Note: As of November 1942 [원문 그대로] Shelestian was reported to be in Korea.)\n\n7. There have been other shipments of currency in a similar manner using the accounts of other Soviet organizations and firms; the funds transferred have not been paid out to individuals in Korea but have been deposited in the Korean Commercial Bank at Pyongyang (Heijo) (25-hh [원문 그대로], 39-01).\n\nCLASSIFICATION  [판독 불가]  CONTROL: U.S. OFFICIALS ONLY", "notes": ["[삭제·공개 표시] Approved For Release 2001/03/05 : CIA-RDP82-00457R000700470008-9 (두 면의 공개 승인 도장. 첫 면 것은 끝자리가 뭉개졌다)", "[삭제·공개 표시] 25X1C (두 면의 DATE 줄)", "[삭제·공개 표시] 25X1A (면 2 여백에 두 군데)", "[삭제·공개 표시] 25X1 (면 2 위쪽 여백)", "[삭제·공개 표시] 1항과 6항의 편집자 주 앞에 정보원을 가리키는 자리가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] Document No. 007 / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S C / DDA Memo, 4 Apr 77 / Auth: DDA REG. 77 (등급 처리 도장)", "[삭제·공개 표시] U.S. OFFICIALS ONLY, CONTROL: U.S. OFFICIALS ONLY (배포 통제 표시)"], "note": "두 면짜리 문서이고 첫 면은 정정 쪽이다. 정정 쪽과 본문의 연도가 서로 다르다. 정정 쪽은 6항을 「As of November JOL6」로, 본문 6항은 「As of November 1942」로 찍고 있다. 정정이 1942를 1946으로 바로잡으려던 것으로 보이나 두 숫자 모두 고치지 않고 원문대로 두었다. 2항의 `In November 1944` 도 앞뒤 서술과 어긋나 보이나 그대로 두었다. Segal 의 몫은 `205`, 무리의 몫은 `5603` 으로 찍혀 있다. 각각 20퍼센트와 50퍼센트로 읽히지만 퍼센트 기호가 숫자로 뭉개진 것인지 자릿수가 더 있는 것인지 가릴 수 없어 숫자를 고치지 않고 원문 문자열을 그대로 남겼다. 평양의 좌표는 `(25-hh, 39-01)` 로 찍혀 경도 앞자리가 빠져 있고 분 자리가 문자로 읽혔다. 고치지 않았다. 4항은 스캔에서 줄이 어긋나 SONG Chuk-chi 를 설명하는 구절이 CHOI Mang-kuei 뒤로 떨어져 있다. 문맥에 따라 SONG 뒤로 되돌려 옮겼다. 등급 표시는 두 면 모두 뭉개져 있다. 아래쪽 등급 줄은 `SORE` 와 `SET` 로 찍혀 SECRET 으로도 읽히고, 면 2 위쪽에는 CONFIDENTIAL 이 따로 찍혀 있다. 확정하지 않고 [판독 불가]로 두었다. 국가 구분이 조선이 아니라 China 로 되어 있는 문서다. 상하이에서 나온 보고이기 때문으로 보인다. 방첩법 조항이 첫 면에는 `50, U.S.C.`, 면 2에는 `70 a S.C.` 로 다르게 찍혀 있어 둘 다 그대로 두었다.", "warn": false, "search": "YU In-sop (상하이의 조선인 무리) YI Pyong-nam [LI Pyong-nam] (상하이의 조선인 무리) Jacky Park (상하이의 조선인 무리) Segal (상하이 창고회사 이사, 소련 기관과의 연락) SONG Chuk-chi (미화를 넘긴 조선인) KIM Pak-chu (미화를 넘긴 조선인) CHOI Mang-kuei [CHOE Min-kye] (전 상하이의 조선인 상인) J. Shelestian (모스크바 나로드니 은행 예금을 인출해 소련으로 떠난 인물) Approved For Release 2001/03/05 : CIA-RDP82-00457R000700470008-9 (두 면의 공개 승인 도장. 첫 면 것은 끝자리가 뭉개졌다) 25X1C (두 면의 DATE 줄) 25X1A (면 2 여백에 두 군데) 25X1 (면 2 위쪽 여백) 1항과 6항의 편집자 주 앞에 정보원을 가리키는 자리가 먹칠되어 [삭제]로 옮겼다 Document No. 007 / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S C / DDA Memo, 4 Apr 77 / Auth: DDA REG. 77 (등급 처리 도장) U.S. OFFICIALS ONLY, CONTROL: U.S. OFFICIALS ONLY (배포 통제 표시) Economic Information: Transfer of Capital to North Korea with Soviet Assistance"}, {"id": "N26", "order": 50, "date": "1947-07-29", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "경제 첩보: 북조선의 환율과 물가", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-07-29"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Economic Information: Exchange Rates and Commodity Prices, North Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000700730005-3"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000700730005-3"}], "summary": "1947년 4월 17일 현재 동북폐와 북조선 원의 환율, 그리고 쌀과 잡곡의 값을 적은 한 장짜리 보고다.", "points": ["1947년 4월 17일 동북폐(Northeast Currency, NEC)와 북조선 원의 환율은 동북폐 2.30 대 1원이다.", "4월 중 동북폐와 미국 달러의 암시장 환율은 동북폐 1,000 대 미화 1달러다.", "같은 날 백미는 파운드당 60원에서 63원이다.", "좁쌀은 57원에서 60원, 수수(Kaoliang)는 53원에서 57원, 옥수수 가루는 41원에서 50원이다.", "북조선 원의 가치 평가는 다른 문서를 보라는 주가 붙어 있으나 그 문서 표시는 뭉개져 있다."], "primary": "[판독 불가]\n공개 승인 2001/03/05 : CIA-RDP82-00457R000700730005-3\n\n기밀(CONFIDENTIAL)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n25X1A\n국가  조선                              일자(DATE):  25X1A\n                                        입수(INFO.)\n주제  경제 첩보: 북조선의 환율과 물가(Economic Information: Exchange Rates and Commodity Prices, North Korea)\n                                        배포(DIST.)  1947년 7월 XX일\n                                        면수  4 [원문 그대로]\n보충(SUPPLEMENT)\n25X1A\n\n1. 1947년 4월 17일 동북폐(Northeast Currency, NEC)와 북조선 원(won)의 환율은 동북폐 2.30 대 1원이었다. [삭제] 주: 4월 중 동북폐와 미국 달러의 암시장 환율은 동북폐 1,000 대 미화 1달러였다. 북조선 원의 가치 평가에 대해서는 [판독 불가]를 볼 것.)   25X1A\n\n25X1A\n2. 4월 17일 북조선의 주요 상품 값은 다음과 같았다.\n\n   품목             단위      값\n   백미             파운드    60 - 63 원\n   좁쌀(Millet)     〃        57 - 60 〃\n   수수(Kaoliang)   〃        53 - 57 〃\n   옥수수 가루      〃        41 - 50 〃\n\n이 문서는 개정된 방첩법(Espionage Act) 미국법전 제50편 제32조 및 제32조 [원문 그대로]가 정한 바에 따라 미국의 국방에 관계되는 정보를 담고 있다. 권한 없는 자에게 이를 전달하거나 그 내용을 어떤 방식으로든 누설하는 것은 법으로 금지된다.\n\n문서번호 6 0 5\n등급 변경 없음(NO CHANGE in Class.) [x]\n[ ] 비밀해제(DECLASSIFIED)\n등급을 다음으로 변경(Class. CHANGED TO): TS  S  C\nDDA 각서, 1977년 4월 4일\n근거(Auth.): DDA REG. 77/1763\n일자: [판독 불가]  담당: [판독 불가]\n\n등급(CLASSIFICATION)  기밀(CONFIDENTIAL)\n공개 승인 2001/03/05 : CIA-RDP82-00457R000700730005-3", "secondary": "[판독 불가]\nApproved For Release 2001/03/05 : CIA-RDP82-00457R000700730005-3\n\nCONFIDENTIAL\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\n25X1A\nCOUNTRY  Korea                          DATE:  25X1A\n                                        INFO.\nSUBJECT  Economic Information: Exchange Rates and Commodity Prices, North Korea\n                                        DIST.  XX July 1947\n                                        PAGES  4 [원문 그대로]\nSUPPLEMENT\n25X1A\n\n1. On 17 April, 1947 the rate of exchange between the Northeast Currency (NEC) and the North Korean won was NEC 2.30 to 1 won. [삭제] Note: In April the black market rate of exchange between the NEC and the U.S. dollar was NEC 1,000 to U.S. $1. See [판독 불가] for the evaluation of North Korean won.)   25X1A\n\n25X1A\n2. The principal commodities in North Korea were priced as follows on 17 April:\n\n   Commodity        Unit      Price\n   Polished rice    Pound     60 - 63 won\n   Millet           \"         57 - 60 \"\n   Kaoliang         \"         53 - 57 \"\n   Corn meal        \"         41 - 50 \"\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 32 and 32 [원문 그대로] as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nDocument No. 6 0 5\nNO CHANGE in Class. [x]\n[ ] DECLASSIFIED\nClass. CHANGED TO: TS  S  C\nDDA Memo, 4 Apr 77\nAuth: DDA REG. 77/1763\nDate: [판독 불가]  By: [판독 불가]\n\nCLASSIFICATION  CONFIDENTIAL\nApproved For Release 2001/03/05 : CIA-RDP82-00457R000700730005-3", "notes": ["[삭제·공개 표시] Approved For Release 2001/03/05 : CIA-RDP82-00457R000700730005-3 (위아래 두 군데의 공개 승인 도장)", "[삭제·공개 표시] 25X1A (표제부와 본문 여백에 다섯 군데)", "[삭제·공개 표시] DATE 줄과 INFO 줄이 25X1A 로 가려져 있다", "[삭제·공개 표시] 1항의 편집자 주 앞이 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] Document No. 6 0 5 / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S C / DDA Memo, 4 Apr 77 / Auth: DDA REG. 77/1763 (등급 처리 도장)"], "note": "한 장짜리 표 문서라 본문은 짧다. 값과 환율 숫자는 한 자리도 고치지 않았다. 표의 단위 칸은 원문에서 반복 기호로 되어 있어 그대로 살렸다. 배포일이 `XX July 1947` 로 날짜 숫자가 비어 있고, 면수는 한 장인데도 `4` 로 찍혀 있다. 둘 다 고치지 않았다. 방첩법 조항이 `32 and 32` 로 찍혀 있다. 앞의 것이 31의 오독으로 보이나 숫자를 고치지 않았다. 1항의 편집자 주는 여는 괄호가 스캔에서 사라지고 닫는 괄호만 남아 있어 그대로 두었다. 북조선 원의 가치 평가를 위해 참조하라는 문서 표시는 뭉개져 읽을 수 없다. 상품 이름은 원문 표기를 앞세우고 옮겼다. `Kaoliang` 은 수수이고 원문 표기를 살렸다. `Millet` 은 이 계열에서 좁쌀로 옮긴다. 통화 이름 `Northeast Currency` 는 만주 동북 지역에서 쓰던 돈이고 원문 표기를 그대로 두었다.", "warn": false, "search": "Approved For Release 2001/03/05 : CIA-RDP82-00457R000700730005-3 (위아래 두 군데의 공개 승인 도장) 25X1A (표제부와 본문 여백에 다섯 군데) DATE 줄과 INFO 줄이 25X1A 로 가려져 있다 1항의 편집자 주 앞이 먹칠되어 [삭제]로 옮겼다 Document No. 6 0 5 / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S C / DDA Memo, 4 Apr 77 / Auth: DDA REG. 77/1763 (등급 처리 도장) Economic Information: Exchange Rates and Commodity Prices, North Korea"}, {"id": "N27", "order": 51, "date": "1947-08-10", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "군사 첩보: 청진과 나남 사이의 보안대 장교학교", "badge": "[판독 불가]", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-08-10"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Peace Preservation Corps Officers School between Chongjin and Nanam", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r001000040001-9"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r001000040001-9"}], "summary": "청진과 나남 사이 옛 미쓰비시 제철공장에 들어선 보안대 장교학교의 위치와 인원, 훈련 내용, 보유 무기를 적었다.", "points": ["보안대(Peace Preservation Corps) 장교학교가 청진(Chongjin 淸津, 일본식 Seishin)에서 약 4킬로미터 떨어진 옛 미쓰비시 제철공장에 있다. 청진과 나남(Nanam 羅南, 일본식 Ranan) 사이다.", "학생들은 전에 미쓰비시 공장 직원이 쓰던 숙사에 든다.", "이 학교에 약 15,000명이 있다.", "보병 훈련을 한다. 기관총, 기관단총, 소총, 구경 약 2인치 박격포 다루는 법을 가르친다. 다만 실탄 사격은 관측된 바 없다.", "훈련에는 일본식 무기와 독일제 무기를 쓴다. 학교 구역에 소련제 소형 화포 한 문을 포함한 화포 7문, 중기관총, 박격포 약 40문, 경기관총 약 70정, 톰프슨 기관단총 몇 정이 있다.", "학교 구성원은 소련식 군복을 입는다.", "편집자 주에 보안대 장교 본부가 나남에 있다는 별도 보고가 붙어 있다."], "primary": "공개 승인 1999/09/08 : [판독 불가]\n\n25X1A2g\n\n[판독 불가]   25X1A2g\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n                                        25X1X6\n국가  조선                              일자(DATE):\n                                        입수(INFO.)\n주제  군사 첩보: 청진과 나남 사이의 보안대 장교학교(Military Information: Peace Preservation Corps Officers School between Chongjin and Nanam)\n                                        배포(DIST.)  1947년 10월 XX일\n25X1A6a                                 면수  1\n                                        25X1A9a\n25X1X6                                  보충(SUPPLEMENT)\n\n25X1A2g\n25X1X6\n\n1. 보안대 장교학교(Peace Preservation Corps Officers School)가 옛 미쓰비시 제철공장(Mitsubishi Steel and Iron Factory)에 있으며, 청진(Chongjin 淸津, 일본식 Seishin 세이신) (129-49, 41-46)에서 약 4킬로미터 떨어진 곳으로 청진과 나남(Nanam 羅南, 일본식 Ranan 라난) (129-41, [Al-4z 원문 그대로]) 사이다. ([삭제] 주: [삭제]가 보고하기로는 보안대 장교 본부가 나남에 있다고 한다.)\n\n2. 이 학교의 학생들은 전에 미쓰비시 공장 직원들이 쓰던 숙사에 들어 있다.\n\n3. 이 학교에는 약 15,000명의 병사가 있다.\n\n4. 이 학교에서는 보병 훈련을 시킨다. 학생들은 기관총, 기관단총, 소총, 그리고 구경이 약 2인치인 박격포를 다루는 교육을 받는다. 다만 무기를 쏘는 것은 관측된 바 없다.\n\n5. 훈련 과정에는 일본식 무기와 독일제 무기를 쓴다. 학교 구역에는 다음 무기가 있다.\n\n   소형 및 중형 화포 7문. 그 가운데 소련제 소형 화포 1문이 포함된다.\n   [li 원문 그대로]정의 중기관총\n   박격포 약 40문\n   경기관총 약 70정\n   톰프슨 기관단총(Thompson sub-machine guns) 몇 정\n\n6. 이 보안대 장교학교의 구성원은 소련식 군복을 입는다.\n\n이 문서는 개정된 방첩법(Espionage Act)이 정한 바에 따라 미국의 국방에 관계되는 정보를 담고 있다. 권한 없는 자에게 [판독 불가] 그 내용을 [판독 불가] 법으로 금지된다.\n\n등급(CLASSIFICATION)  [판독 불가]\n\n문서번호 0 [판독 불가] 0 b\n등급 변경 없음(NO CHANGE in Class.) [ ]\n[x] 비밀해제(DECLASSIFIED)\n등급을 다음으로 변경(Class. CHANGED TO): [판독 불가]\n승인 [판독 불가]\n일자: [판독 불가]\n\n[판독 불가]\n공개 승인 1999/09/08 : CIA-RDP82-00457R001000046004-9 [원문 그대로]", "secondary": "Approved For Release 1999/09/08 : [판독 불가]\n\n25X1A2g\n\n[판독 불가]   25X1A2g\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\n                                        25X1X6\nCOUNTRY  Korea                          DATE:\n                                        INFO.\nSUBJECT  Military Information: Peace Preservation Corps Officers School between Chongjin and Nanam\n                                        DIST.  XX October 1947\n25X1A6a                                 PAGES  1\n                                        25X1A9a\n25X1X6                                  SUPPLEMENT\n\n25X1A2g\n25X1X6\n\n1. There is a Peace Preservation Corps Officers School in the former Mitsubishi Steel and Iron Factory approximately four kilometers from Chongjin (Seishin) (129-49, 41-46) between Chongjin and Nanam (Ranan) (129-41, [Al-4z 원문 그대로]). ([삭제] Note: [삭제] reported that the Headquarters of the Peace Preservation Corps Officers is at Nanam.)\n\n2. The students at this school are billeted in the barracks which were formerly used by the employees of the Mitsubishi Factory.\n\n3. There are approximately 15,000 soldiers at this school.\n\n4. Infantry training is given at this school. The students receive instruction in handling machine guns, sub-machine guns, rifles, and mortars with a bore diameter of approximately two inches. However, no firing of weapons has been observed.\n\n5. Japanese-type weapons and German-made weapons are used in the training courses. The school area contains the following weapons:\n\n   7 small and medium sized artillery pieces, including one small Soviet artillery piece\n   [li 원문 그대로] heavy machine guns\n   Approximately 40 trench mortars\n   Approximately 70 light machine guns\n   Several Thompson sub-machine guns\n\n6. Members of this Peace Preservation Corps Officers School wear army uniforms of the Soviet type.\n\nThis document contains informa[tion affecting the] national defense of the Uni[ted States within the] meaning of the Espio[nage Act ...] amended. [판독 불가] contents [판독 불가] pro[hibited] by law.\n\nCLASSIFICATION  [판독 불가]\n\nDocument No. 0 [판독 불가] 0 b\nNO CHANGE in Class. [ ]\n[x] DECLASSIFIED\nClass. CHANG[ED TO: 판독 불가]\nAppro[ved 판독 불가]\nDate: [판독 불가]\n\n[판독 불가]\nApproved For Release 1999/09/08 : CIA-RDP82-00457R001000046004-9 [원문 그대로]", "notes": ["[삭제·공개 표시] Approved For Release 1999/09/08 : CIA-RDP82-00457R001000046004-9 (위아래 두 군데의 공개 승인 도장. 위쪽 것은 문서번호가 뭉개졌다)", "[삭제·공개 표시] 25X1A2g (세 군데)", "[삭제·공개 표시] 25X1X6 (세 군데. DATE 줄 포함)", "[삭제·공개 표시] 25X1A6a (PAGES 줄 왼쪽)", "[삭제·공개 표시] 25X1A9a (제목 줄 오른쪽)", "[삭제·공개 표시] 1항의 편집자 주 앞과 그 안의 보고 주체가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] Document No. / NO CHANGE in Class. / DECLASSIFIED (등급 처리 도장)"], "note": "본문 여섯 항은 비교적 잘 읽히나 표제부와 아래쪽 도장은 심하게 뭉개졌다. 청진의 좌표 `(129-49, 41-46)` 은 온전하다. 나남의 좌표는 `(129-41, Al-4z)` 로 찍혀 위도가 문자로 읽혔다. 41-42로 보이나 숫자를 고치지 않고 원문 문자열을 남겼다. 5항의 중기관총 수량은 `li,` 로 찍혀 11로 보이나 확정되지 않아 그대로 두었다. 병력 `15,000` 은 장교학교 규모로는 커 보이나 고치지 않았다. 지명은 조선 이름과 일본식 이름을 함께 살렸다. 나남의 일본식 표기가 원문에 `Banan` 으로 찍혀 있으나 나남의 일본식 읽기가 Ranan 이고 R 과 B 의 혼동이 이 스캔에 잦아 Ranan 으로 옮겼다. 배포일이 `XX October 1947` 로 10월인데 문서철의 메타데이터 날짜는 8월 10일이다. 원문의 10월 표기를 그대로 두었다. 아래쪽 공개 승인 도장의 문서번호가 `R001000046004-9` 로 찍혀 있어 이 문서의 CREST 번호인 R001000040001-9 과 다르다. 고치지 않고 원문대로 두었다. `Peace Preservation Corps` 는 보안대다. 이 해에 인민군으로 이름이 옮겨 가는 중이므로 원문 표기를 앞세웠다.", "warn": false, "search": "Approved For Release 1999/09/08 : CIA-RDP82-00457R001000046004-9 (위아래 두 군데의 공개 승인 도장. 위쪽 것은 문서번호가 뭉개졌다) 25X1A2g (세 군데) 25X1X6 (세 군데. DATE 줄 포함) 25X1A6a (PAGES 줄 왼쪽) 25X1A9a (제목 줄 오른쪽) 1항의 편집자 주 앞과 그 안의 보고 주체가 먹칠되어 [삭제]로 옮겼다 Document No. / NO CHANGE in Class. / DECLASSIFIED (등급 처리 도장) Military Information: Peace Preservation Corps Officers School between Chongjin and Nanam"}, {"id": "N28", "order": 52, "date": "1947-08-11", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "경제 첩보: 북조선에서 소련으로 보낸 인력과 물자", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-08-11"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Economic Information: Shipment of Personnel and Materials from North Korea to USSR", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000800300001-3"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000800300001-3"}], "summary": "1947년 봄과 여름에 북조선임시인민위원회가 소련으로 보낸 기술자와 조종사 훈련생, 그리고 원산에서 블라디보스토크로 떠난 식량 수송선을 적은 한 장짜리 보고다.", "points": ["5월 27일 북조선임시인민위원회가 조선인 농업 기술자 50명을 보냈다. 다른 분야 기술자 10명씩도 함께 보냈으나 분야 이름이 스캔에서 뭉개졌다.", "4월 말 북조선의 보안대 장교학교 요원 가운데 뛰어난 자로 뽑힌 조선인 병사 200명이 조종사 훈련을 받으러 소련으로 떠났다.", "6월 28일 식량을 가득 실은 2,500톤급 소련 화물선 두 척이 원산에서 블라디보스토크로 떠났다.", "인력과 식량이 모두 북에서 소련 쪽으로 나가는 방향이다."], "primary": "[판독 불가]\n공개 승인 2005/05/16 : CIA-RDP82-00457R000800300901-3 [원문 그대로]   25X1\n\n기밀(CONFIDENT[IAL])\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGEN[CE REPORT])\n\n국가  조선                              일자(DATE): [판독 불가]\n                                        입수(INFO.) [판독 불가]\n주제  경제 첩보: 북조선에서 소련으로 보낸 인력과 물자(Economic Information: Shipment of Personnel and Materials from North Korea to USSR)\n                                        배포(DIST.)  1947년 8월 11일\n                                        면수  1\n보충(SUPPLEMENT) [판독 불가]\n\n배포처(DISTRIBUTION)\n국무부(STATE)  육군부(WAR) [판독 불가]\n\n25X1\n1. 5월 27일 북조선임시인민위원회(North Korean Provisional People's Committee)가 조선인 농업 기술자 50명, [판독 불가]에 기술자 10명, [판독 불가] 공업 기술자 [판독 불가]명, 그리고 그 밖의 산업에 [판독 불가] 10명을 보냈다.   25X1\n\n25X1\n\n2. 4월 말 조선인 병사 200명이 조종사 훈련을 받으러 소련으로 떠났다. 이들은 북조선의 보안대 장교학교(Peace Preservation Officers Schools) 요원 가운데 뛰어난 능력을 인정받아 뽑힌 자들이다.\n25X1\n\n3. 6월 28일 식량을 가득 실은 2,500톤급 소련 화물선 두 척이 원산(Wonsan 元山, 일본식 Gensan 겐산) (127-25, 39-10)에서 블라디보스토크(Vladivostok)로 떠났다.\n\n문서번호 7 [판독 불가]\n등급 변경 없음(NO CHANGE in Class.) [판독 불가]\n\n기밀(CONFIDENTIAL)\n\n공개 승인 2005/05/16 : CIA-RDP82-00457R000800300001-3", "secondary": "[판독 불가]\nApproved For Release 2005/05/16 : CIA-RDP82-00457R000800300901-3 [원문 그대로]   25X1\n\nCONFIDENT[IAL]\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGEN[CE REPORT]\n\nCOUNTRY  Korea                          DATE: [판독 불가]\n                                        INFO. [판독 불가]\nSUBJECT  Economic Information: Shipment of Personnel and Materials from North Korea to USSR\n                                        DIST.  11 August 1947\n                                        PAGES  1\nSUPPLEMENT [판독 불가]\n\nDISTRIBUTION\nSTATE  WAR [판독 불가]\n\n25X1\n1. On 27 May the North Korean Provisional People's Committee sent 50 (Korean) agricultural experts, 10 experts to the [판독 불가], [판독 불가] experts [in] industry and 10 [판독 불가] other industries.   25X1\n\n25X1\n\n2. At the end of April, 200 (Korean) soldiers, who had been selected from the staffs of the Peace Preservation Officers Schools in North Korea for their outstanding ability, left for the USSR to receive training as aviators.\n25X1\n\n3. On 28 June, two 2500 ton Soviet cargo ships, fully loaded with foodstuffs, left Wonsan (Gensan) (127-25, 39-10) for Vladivostok.\n\nDocument No. 7 [판독 불가]\nNO CHANGE in Class. [판독 불가]\n\nCONFIDENTIAL\n\nApproved For Release 2005/05/16 : CIA-RDP82-00457R000800300001-3", "notes": ["[삭제·공개 표시] Approved For Release 2005/05/16 : CIA-RDP82-00457R000800300901-3 (위쪽 도장. 아래쪽 도장과 문서번호가 한 자리 다르다)", "[삭제·공개 표시] Approved For Release 2005/05/16 : CIA-RDP82-00457R000800300001-3 (아래쪽 도장)", "[삭제·공개 표시] 25X1 (위쪽 여백과 본문 왼쪽에 다섯 군데)", "[삭제·공개 표시] Document No. 7 / NO CHANGE in Class. (등급 처리 도장)"], "note": "한 장짜리이고 1항이 가장 심하게 뭉개졌다. 보낸 기술자의 분야 이름이 읽히지 않아 인원수만 남기고 나머지는 [판독 불가]로 두었다. 농업 기술자 50명과 마지막의 10명은 숫자가 또렷하다. 중간 항목의 인원수는 확정되지 않아 짐작해 채우지 않았다. 원산의 좌표 `(127-25, 39-10)` 은 온전하다. 원산의 일본식 표기는 원문에 `Gengen` 으로 찍혀 있으나 원산의 일본식 읽기가 Gensan 이고 이 스캔에서 s 가 g 로 자주 읽혔다. Gensan 으로 옮겼다. 위쪽 공개 승인 도장의 문서번호가 `R000800300901-3` 으로 아래쪽 도장 및 이 문서의 CREST 번호와 한 자리 다르다. 고치지 않고 둘 다 그대로 두었다. 2항의 학교 이름이 `Peace Preservation Officers Schools` 로 Corps 가 빠진 채 찍혀 있다. 같은 시기 N27 은 `Peace Preservation Corps Officers School` 로 적는다. 원문 표기를 그대로 두었다. 이 문서는 기관 이름을 북조선임시인민위원회로 적고 있다.", "warn": false, "search": "Approved For Release 2005/05/16 : CIA-RDP82-00457R000800300901-3 (위쪽 도장. 아래쪽 도장과 문서번호가 한 자리 다르다) Approved For Release 2005/05/16 : CIA-RDP82-00457R000800300001-3 (아래쪽 도장) 25X1 (위쪽 여백과 본문 왼쪽에 다섯 군데) Document No. 7 / NO CHANGE in Class. (등급 처리 도장) Economic Information: Shipment of Personnel and Materials from North Korea to USSR"}, {"id": "N29", "order": 53, "date": "1947-08-13", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "정치 첩보: 북조선의 민심 이반", "badge": "confidential (CONTROL U.S. OFFICIALS ONLY)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-08-13"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Political Information: Public Discontent in North Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000800370002-5"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000800370002-5"}], "summary": "정주에서 소련군 대위가 살해된 사건과 그 뒤의 검거, 소련군 가족이 조선인 집주인의 세간을 팔고 떠난 데 대한 항의, 승호리 공장에서 기술자 여섯 명이 죽은 일을 묶어 적었다.", "points": ["5월 어느 날 밤 9시 정주(Chongju 定州, 일본식 Teishu) 거리에서 소련군 대위가 살해된다. 소련군 대위와 북조선 보안대 사이의 다툼에서 비롯한 것으로 본다.", "평안북도 보안부장이 조사하러 정주에 갔다가 정주의 소련군 당국에 체포되어 사흘 동안 구금된다.", "이어 보안서가 정주의 민주당 직원 전원을 체포하고 살인은 반동분자의 소행이라고 발표한다.", "소련으로 돌아가는 소련군 가족들이 조선인 집주인의 세간을 팔고 그 돈으로 조선 물건을 사서 가져간다.", "북조선 주민이 인민위원회에 항의했으나 위원회는 아직 아무 조치도 취하지 않았다.", "북조선에 있던 소련군 가족의 약 절반이 이미 소련으로 떠났다.", "6월 8일 승호리 공장에서 소련군에 고용된 기술자 여섯 명이 숙사에서 죽는다. 독살되었다는 소문이 승호리에 돈다.", "편집자 주에 1944년 9월판 미군 지도청 조선 지명집의 표기 오류를 지적한 대목이 붙어 있다."], "primary": "[판독 불가]\n25X1A\n기밀(CONFIDENTIAL)  통제(CONTROL) 미국 관리 전용(U.S. OFFICIALS ONLY)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가  조선                              일자(DATE):  25X1C\n                                        입수(INFO.)\n주제  정치 첩보: 북조선의 민심 이반(Political Information: Public Discontent in North Korea)\n                                        배포(DIST.)  1947년 8월 18일\n25X1A                                   면수  12 [원문 그대로]\n                                        보충(SUPPLEMENT)\n                                        25X1X\n\n소련군 장교 암살(Assassination of Soviet Army Officer)\n\n1. 5월 2[판독 불가]일 21시, 정주(Chongju 定州, 일본식 Teishu 데이슈) (125-12, 39-42)의 거리에서 소련군 대위 한 명이 살해되었다. 이 살인은 그 소련군 대위와 (정주의) 북조선 보안대(North Korean Peace Preservation Corps) 병력 사이의 다툼에서 비롯한 것으로 본다.\n\n2. 평안북도(North Pyongan, 일본식 Heian 헤이안) 보안부(Peace Preservation Department, Bo An Pu [한자 판독 불가]) [Po an Pu] 부장이 사건을 조사하러 정주에 갔다. 그는 정주의 소련군 당국에 체포되어 사흘 동안 구금되었다.\n\n3. 이어 보안서(Peace Preservation Office, Bo an Su [한자 판독 불가]) [Po an S[판독 불가]] (정주의 보안서인지는 확실하지 않다)가 정주의 민주당(Democratic Party) 직원 전원을 체포하고, 이 살인은 반동분자들이 저지른 것이라고 발표하였다.\n\n북조선 사람들이 소련군 가족의 행동에 항의하다(North Koreans Protest Actions of Soviet Troops' Families)\n\n[한자 판독 불가]\n\n4. 북조선에 있던 소련군 병사의 가족들은 소련으로 떠나기 전에 조선인 집주인의 집안 세간을 팔았고, 그 돈으로 소련에 가져갈 조선 물건을 샀다.\n\n5. 북조선 사람들이 이 일을 인민위원회(People's Committees)에 항의했으나 위원회는 아직 아무런 조치도 취하지 않았다.\n\n6. 북조선에 있는 소련군 가족의 약 절반이 이미 소련으로 떠났다.\n\n7. 6월 8일, 승호리(Sunghori, 일본식 Shekewi [원문 그대로]) (125-58, 38-87)의 공장에서 소련군에 고용된 기술자 여섯 명(조선인인지 소련인인지 불확실)이 그 공장 숙사에서 죽었다. 그들이 독살되었다는 소문이 승호리에 돈다.\n\n25X1A  ([삭제] 주: 승호리(Sunghori)는 1944년 9월판 미군 지도청 조선 지도 지명집(AMS Gazetteer to Maps of Korea)에 Sungnori 로 잘못 실려 있다.)\n\n문서번호 [판독 불가]\n[판독 불가] 등급 4 Apr [판독 불가]\n근거(Auth.): [판독 불가]\n일자: [판독 불가]\n\n등급(CLASSIFICATION)  기밀(CONFIDENTIAL)  통제(CONTROL) 미국 관리 전용(U.S. OFFICIALS ONLY)\n\n공개 승인 2000/08/07 : CIA-RDP82-00457R000800370002-5", "secondary": "[판독 불가]\n25X1A\nCONFIDENTIAL  CONTROL U.S. OFFICIALS ONLY\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCOUNTRY  Korea                          DATE:  25X1C\n                                        INFO.\nSUBJECT  Political Information: Public Discontent in North Korea\n                                        DIST.  18 August 1947\n25X1A                                   PAGES  12 [원문 그대로]\n                                        SUPPLEMENT\n                                        25X1X\n\nAssassination of Soviet Army Officer\n\n1. At 2100 hours on 2[판독 불가] May a Soviet Army captain was murdered on a street in Chongju (Teishu) (125-12, 39-42). The murder is believed to have resulted from a disagreement between the Soviet Army captain and the North Korean Peace Preservation Corps troops (in Chongju).\n\n2. The chief of the North Pyongan (Heian) Province Peace Preservation Department (Bo An Pu [한자 판독 불가]) [Po an Pu] went to Chongju to investigate the incident. He was arrested and detained for three days by the Soviet Army officials in Chongju.\n\n3. The Peace Preservation Office (Bo an Su [한자 판독 불가]) [Po an S[판독 불가]] (in Chongju?) then arrested the entire staff of the Democratic Party in Chongju and announced that the murder had been committed by reactionaries.\n\nNorth Koreans Protest Actions of Soviet Troops' Families\n\n[한자 판독 불가]\n\n4. Before leaving for the USSR, families of Soviet Army troops in North Korea sold the house furnishings which belonged to their Korean landlords and bought Korean goods to take with them to the USSR.\n\n5. The people of North Korea have protested the matter to their People's Committees, but the Committees have, as yet, taken no action.\n\n6. About one-half of the families of the Soviet troops in North Korea have already left for the USSR.\n\n7. On 8 June, six (? Korean? Soviet?) technicians employed by the Soviet Army at a factory in Sunghori (Shekewi [원문 그대로]) (125-58, 38-87) died in the barracks of that factory. It is rumored in Sunghori that they were poisoned.\n\n25X1A  ([삭제] Note: Sunghori is incorrectly given as Sungnori in the September 1944 edition of the AMS Gazetteer to Maps of Korea.)\n\nDocument No. [판독 불가]\n[판독 불가] Class. 4 Apr [판독 불가]\nAuth: [판독 불가]\nDate: [판독 불가]\n\nCLASSIFICATION  CONFIDENTIAL  CONTROL U.S. OFFICIALS ONLY\n\nApproved For Release 2000/08/07 : CIA-RDP82-00457R000800370002-5", "notes": ["[삭제·공개 표시] Approved For Release 2000/08/07 : CIA-RDP82-00457R000800370002-5 (아래쪽 공개 승인 도장)", "[삭제·공개 표시] 25X1A (표제부에 두 군데, 7항의 편집자 주 앞에 한 군데)", "[삭제·공개 표시] 25X1C (DATE 줄)", "[삭제·공개 표시] 25X1X (SUPPLEMENT 줄 아래)", "[삭제·공개 표시] 7항 편집자 주 앞의 정보원 표시가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] CONFIDENTIAL CONTROL U.S. OFFICIALS ONLY (위아래 두 군데의 등급 및 배포 통제 표시)", "[삭제·공개 표시] Document No. 와 등급 처리 도장이 뭉개져 있다"], "note": "이름이 밝혀진 인물은 하나도 없다. 소련군 대위와 평안북도 보안부장 모두 직함으로만 적혀 있다. 1항의 날짜는 `2¢ Way` 로 찍혀 5월인 것은 읽히나 일자의 둘째 자리를 가릴 수 없다. 짐작해 채우지 않았다. 면수가 `12` 로 찍혀 있는데 한 장짜리 보고다. 1과 2가 붙은 것으로 보이나 숫자를 고치지 않았다. 좌표는 고치지 않았다. 정주의 `(125-12, 39-42)` 는 온전하다. 승호리의 `(125-58, 38-87)` 은 위도의 분이 87로 성립하지 않는 값이다. 지명은 조선 이름과 일본식 이름을 둘 다 살렸다. 승호리의 일본식 표기는 `Shekewi` 로 찍혀 글자가 너무 무너져 바로잡지 않고 원문대로 두었다. 기관 이름은 원문 표기를 앞세웠다. `Peace Preservation Corps` 는 보안대, `Peace Preservation Department (Bo An Pu)` 는 보안부, `Peace Preservation Office (Bo an Su)` 는 보안서로 옮겼으나 뒤의 둘은 로마자와 한자가 함께 뭉개져 있어 확정된 것이 아니다. 원문의 로마자 표기와 대괄호 안의 매큔라이샤워 표기를 모두 남겼다. 3항의 `Democratic Party` 는 조선민주당을 가리키는 것으로 보이나 원문이 당 이름을 그렇게만 적었으므로 풀어 쓰지 않았다. 3항 괄호 안의 물음표와 7항 괄호 안의 물음표는 원문 작성자가 확신하지 못해 붙인 것이라 그대로 살렸다. 7항 주의 지명집 이름은 `AUS Gazetteer` 로 찍혔으나 미군 지도청(Army Map Service)의 AMS 가 분명하여 바로잡았다. 배포일은 8월 18일로 찍혀 있고 문서철의 메타데이터 날짜는 8월 13일이다. 원문 표기를 그대로 두었다.", "warn": false, "search": "Approved For Release 2000/08/07 : CIA-RDP82-00457R000800370002-5 (아래쪽 공개 승인 도장) 25X1A (표제부에 두 군데, 7항의 편집자 주 앞에 한 군데) 25X1C (DATE 줄) 25X1X (SUPPLEMENT 줄 아래) 7항 편집자 주 앞의 정보원 표시가 먹칠되어 [삭제]로 옮겼다 CONFIDENTIAL CONTROL U.S. OFFICIALS ONLY (위아래 두 군데의 등급 및 배포 통제 표시) Document No. 와 등급 처리 도장이 뭉개져 있다 Political Information: Public Discontent in North Korea"}, {"id": "N30", "order": 54, "date": "1947-09-04", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "군사 첩보: 북조선의 보안대 장교학교", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-09-04"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: Peace Preservation Corps Officers Schools in North Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000800840007-8"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000800840007-8"}], "summary": "북조선 전역에서 17세부터 25세까지 청년을 징집해 보안대 장교학교에 넣고 있다는 보고다. 총사령부와 지휘부, 평양 중앙학교와 신의주 학교의 편제, 무장, 교육 내용을 항목별로 적었다.", "points": ["17세부터 25세까지 청년이 북조선 전역에서 징집되어 보안대 장교학교로 간다. 신의주 일대는 구역마다 500명을 뽑는다. 징병은 북조선 군사위원회 군사부가 맡는다.", "총사령부는 나남(129-41, 41-42)에 있고 총사령관은 CHOE Yong-kon 최용건, 부사령관은 MU Chong 무정이다. 무정은 옌안의 조선의용군 사령관이자 조선독립동맹 책임자였다.", "학교들은 1946년 3월에 정치학교라는 이름으로 세워졌다가 보안대 장교학교로 이름이 바뀌었다. 소련군 검열단이 한 주에 한 번 각 학교를 검열한다.", "모든 학교에 「사상 검열」 부서가 있다. 검열관 두세 명이 학생들과 함께 훈련받으며 반동 사상을 가진 학생을 찾아낸다.", "졸업생과 재학생을 합해 약 130,0[판독 불가]0명이라고 적었다. 졸업생은 대개 38선 부근에 배치된다.", "평양의 중앙 보안대 장교학교만이 진짜 장교를 임관시킨다. 현재 학생 600명이다. 다른 학교 졸업생은 임관되지 않는다.", "평양 지구사령부가 신리에 세워졌고 부사령관은 PAK Hyo-sam 박효삼이다. 제3연대 본부는 신의주 남서쪽에 있고 연대장은 CHANG Tok-sam 장덕삼이다. 대대장 셋은 모두 옌안에서 돌아온 자들이다.", "남신의주 주둔 부대는 일본식 1-33형 소총과 소련식 기관총 20정, 박격포 3문으로 무장했다.", "신의주 학교는 훈련 기간 6개월이고 낮에는 소련군 장교가 지도한다. 러시아어도 가르친다. 학교 책임자는 신의주 소련군 특무기관 사령관이다.", "신의주 학교 제1기는 지원자 남자 600명과 여자 100명이었고 제2기는 추천, 제3기는 징집이다. 현재 기수는 3000명이다."], "primary": "INTELLOFAX 4\n\n25X1[판독 불가]\n공개 승인(Approved For Release) 2005/0[판독 불가]/16 : CIA-RDP[판독 불가]000899[판독 불가]40007\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n첩보보고(INTELLIGENCE REPORT)\n국가   조선(Korea)            일자:\n정보입수(INFO.)\n주제   군사 첩보: 북조선의 보안대 장교학교(Military Information: Peace Preservation Corps Officers Schools in North Korea.)\n배포(DIST.)  [판독 불가] 1947년 9월   25X1A\n25X1   면수 4\n25X1   25X1\n\n배포처(DISTRIBUTION)\n[판독 불가]\n국무부(STATE) |_\n\n1. 17세부터 25세까지의 청년들이 북조선 전역에서 징집되어 보안대 장교학교(Peace Preservation Corps Officers Schools)로 보내지고 있다.\n\n2. 신의주(Sinuiju 新義州, 일본식 Shingishu) (124-2[판독 불가], 40-06) 일대의 각 구역(?)은 17세부터 25세까지 500명을 뽑아 보안대 장교학교에서 훈련을 받게 한다.\n\n3. 북조선 군사위원회(North Korea Military Committee)의 군사부(Military Affairs Department)가 북조선의 모든 보안대 장교학교에 대한 징병을 맡고 있다.\n\n25X1A\n25X1\n25X1\n\n4. 보안대 장교학교들은 지금 대규모 훈련 계획을 진행하고 있으며, (조선인) 부대가 날마다 야외 전투 연습에 참가한다. 소련군 검열단이 각 보안대 장교학교를 한 주에 한 번 검열한다.\n25X1   25X1A\n\n5. 북조선의 보안대 [보안대] 장교학교 총사령부는 나남(Nanam 羅南, 일본식 Ranan) (129-41, 41-42)에 있다. 주(Note): 다른 미국 기관이 앞서 보고한 바로는, 5월 15일 현재 북조선의 보안대 장교훈련소 총사령부는 평양(Pyongy[판독 불가])에 있다 [판독 불가] 문서철 [판독 불가] /125-44, 35-01/ [원문 그대로].)\n25X1   25X1   25X1\n\n6. 보안대 장교학교의 총사령관은 CHOE Yong-kon 최용건([한자 판독 불가])이다. 그는 (소련 내의) 소련 군사학교(Soviet Military School)를 졸업하고 (당시 [판독 불가]에 있던) 소련 군사위원회(Soviet Military Committee)에서 근무하였으며 대일 전승일(V-J Day) 뒤에 조선으로 돌아왔다. 주(Note): [삭제]\n25X1   CHOE, Yong-ken [원문 그대로], 북조선 조선민주당(Korean Democratic Party) 당수이자 도(道) 관련 부서(Prefectural B[판독 불가]reau)의 책임자.)\n25X1\n\n7. 북조선 보안대 장교학교 총사령부의 부사령관은 MU Chong 무정([한자 판독 불가])이다. 그는 [판독 불가] 사령\n\n분류(CLASSIFICATION)\n\n문서번호(Document No.) [판독 불가]\n등급 변경 없음(NO CHANGE in Class.) [판독 불가]\n[ ] 비밀해제(DECLASSIFIED)\n등급 변경(Class. CHANGED TO): TS  S  C\n참고자료실 도서관(REFERENCE CENTER LIBRARY)\n[판독 불가]\n\n/16 : CIA-RDP82-00457R000800840007-8\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n공개 승인 2005/05/16 : CIA-RDP82-00457R000800840007-8\n\n25X1A 옌안(Yenan 延安) (209-27, 36-36) [원문 그대로]에 있던 조선의용군(Korean Volunteer Army)([한자 판독 불가])의 사령관이었고 조선독립동맹(Korean Independence League)([한자 판독 불가])의 책임자였다 [판독 불가]. 그는 대일 전승일 뒤에 북조선으로 돌아왔다. 주(Note): [삭제] MU-chong 무정, 조선독립의용군(Korean Independent Volunteer Army) 사령관. 주(Note): 또한\n25X1   [판독 불가] 및 [판독 불가]-chong 으로도 보고되었다.\n25X1\n\n[판독 불가]\n\n8. 모든 보안대 장교학교에는 「사상 검열(thought inspection)」 부서가 두어져 있다. 검열관(inspectors) 두세 명이 학생 각 기수와 함께 훈련을 받으면서 반동 사상을 가진 학생을 찾아낸다.\n25X1\n\n9. [판독 불가] 지금 보안대 장교학교로 불리는 학교들은 원래 1946년 3월에 세워졌고 처음에는 정치학교(Political Schools)로 불렸다. 이 정치학교들은 조선 청년들에게 공산주의 사상을 주입하고 군사훈련을 시키기 위해 세워진 것이었다.\n25X1\n\n10. 보안대 장교학교 교직원 가운데 중요한 자들은 주로 소련 내의 소련 정치학교(Soviet Political Schools)나 옌안의 팔로군 군정학교(Eighth Route Army Military and Political School)에서 훈련을 받은 조선인이다. 이 교관들은 영리하고 상당한 능력을 갖추고 있다. 나머지 교직원은 그 지역 출신이다. 이들의 능력은 중요한 교직원들보다 상당히 떨어진다.\n25X1A   25X1\n\n[번호 없음] 보안대 장교학교의 졸업생과 재학 중인 학생을 합한 총수는 약 130,0[판독 불가]0명이다.\n\n[번호 없음] 보안대 장교학교 졸업생은 대개 북조선 남부, 38선 부근에 배치되어 왔다. 일부는 보안대 부대의 교관으로 배치되었다. 뛰어난 학생 일부는 평양의 중앙 보안대 장교학교(Central Peace Preservation Officers School)로 [판독 불가] 보내졌다. [판독 불가] 북조선에서 조선인 병사를 보안대 부대의 장교로 만들기 위해 훈련하는 유일한 학교다.\n\n평양의 중앙 보안대(?) 장교학교(Central Peace Preservation (Corps?) Officers School in Pyongyang)\n\n13. 평양의 중앙 보안대 장교학교는 북조선에서 유일한 진짜 장교 양성 학교다. 이 학교 졸업생은 보안대 장교로 임관된다. 다른 보안대 장교학교의 졸업생은 장교로 임관되지도 않고 어떤 임관 장교의 계급도 받지 않는다.\n25X1\n\n14. 평양 중앙 보안대 장교학교의 후보자는 대개 이른바 다른 보안대 장교학교의 우수한 학생 가운데서 뽑는다. 때로는 특별한 능력을 보이고 특별 입학시험에 합격한 보안대 부대원도 이 학교의 후보자로 뽑힌다.\n25X1\n\n15. 평양 중앙 보안대 장교학교 졸업생은 보안대 부대의 장교로 배치된다.\n\n16. 현재 평양 중앙 보안대 장교학교에 등록된 학생은 600명이다.\n\n17. 조선의용군 출신과 평양 중앙 보안대 장교학교 졸업생만이 보안대 부대의 참모진이 될 자격이 있다.\n\n기밀(CONFIDENTIAL)   25X1\n[판독 불가]\n33\n공개 승인 2005/05/16 : CIA-RDP82-00457R000800840007-8\n\n공개 승인 2005/05/16 : CIA-RDP82-00457R000800840007-8\n25X1   25X1   25X1A\n\n보안대 장교학교 평양 지구사령부(PYONGYANG DISTRICT HEADQUARTERS OF THE PEACE PRESERVATION CORPS OFFICERS SCHOOLS)\n\n18. 보안대 장교학교 평양 지구사령부가 최근 평양 교외 신리(Sinri, Shin Ri 新里)([한자 판독 불가]) (125-[판독 불가]4, 39-01)에 세워졌다. 지구 사령관은 LU Chong [원문 그대로]이다. (주: 7항을 보라). 부사령관은 PAK Hyo-sam 박효삼([한자 판독 불가])이다. [판독 불가]은 옌안의 군정학교(Military and Political School)([한자 판독 불가]) 졸업생이며 옌안에서 조선독립동맹 군사부의 책임자였다.\n\n19. 보안대 장교학교 평양 지구사령부 제3연대 본부는 신의주에서 남서쪽으로 몇 킬로미터 떨어진 [판독 불가]akwon([한자 판독 불가])에 있다. 주(Note): [판독 불가] 남신의주에 [판독 불가]akwon 구역이 있다. 또한 다른 미국 기관이 앞서 보고한 바로는, 평양에 본부를 둔 보안대 장교학교 제3군구(Third Military District)의 제3훈련대는 Pongnyousedong /? 125-16, 39-00 또는 125-30, 10-12 ?/에 있고, 개천(Kaechon 价川, 일본식 Kuisen) /125-58, 39-[판독 불가]0/에 본부를 둔 보안대 장교학교 제1군구의 제3훈련대는 신의주 본시가에서 몇 킬로미터 떨어진 남신의주에 있다.)\n\n20. 제3연대 본부의 사령관은 CHANG Tok-sam 장덕삼([한자 판독 불가])이다. 그는 옌안에서 조선의용군 제2지대의 사령관이었다.\n\n21. 제3연대는 3개 대대로 이루어져 있다. 제3연대 제1대대의 대대장은 O [판독 불가]([한자 판독 불가])이며, 옌안의 군정학교 졸업생이고 옌안에서 조선독립동맹의 일원이었다. 제2대대의 대대장은 [판독 불가] U-mon([한자 판독 불가])이다. 제3대대의 대대장은 Y[판독 불가] Jang-kuk([한자 판독 불가])이다. O 와 [판독 불가]와 YE 는 대일 전승일 뒤에 옌안에서 조선으로 돌아왔다.\n\n22. 제3연대 일부 부대는 남신의주의 옛 상업중학교에 주둔하고 있다.\n\n23. 남신의주에 주둔한 제3연대 부대는 일본식 1-33형 [원문 그대로] 소총으로 무장하고 있다. 소련식 기관총 20정과 박격포 3문도 갖추고 있다.\n\n25X1   신의주 보안대 장교학교(Sinuiju Peace Preservation Corps Officers School)\n\n24. 신의주의 보안대 장교학교는 [판독 불가]개 부(部)로 나뉘어 있다. 한 부(? 22항에 적은 제3연대의 부대들인가 ?)는 남신의주의 옛 상업중학교에 있다. 학교의 다른 부는 신의주 본시가의 부두 일대에 있다.\n25X1\n\n25. 신의주 보안대 장교학교의 훈련 과정 기간은 6개월이다. 보병 훈련과 포병 훈련을 한다. 학교에는 훈련 과정에 쓰는 화포 3문이 있다. 군사훈련은 낮에 소련군 장교들의 지도 아래 받는다. 군사와 정치 양쪽의 추가 교육은 학교에 딸린 조선인 교관들이 맡는다. 러시아어 교육도 한다.\n25X1   25X1\n\n26. 학교의 책임자는 신의주 주둔 소련군 특무기관(Special Service Headquarters) 사령관이다. [삭제] 주(Note): 앞서 보고된 바:\n\n[판독 불가]   25X1\n공개 승인 2005/05/16 : CIA-RDP82-00457R000800840007-8\n\n25X1   25X1\n286\n\n공개 승인 2005/05/16 : CIA-RDP82-00457R00086089[판독 불가]0007-8\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\nPimashiht'ou 중령(Lt. Col.) /중국식 음역/이 신의주 주둔 소련군 특무(대간첩) 기관의 사령관이다.\n\n27. 신의주의 보안대 장교학교는 처음에 정치학교(Political School)로 불렸다. 이 학교에서 두 기수가 졸업했고 세 번째 기수가 지금 훈련 중이다. 학교가 아직 정치학교로 불리던 때의 제1기에서는 남자 약 600명과 여자 100명이 훈련을 받았다. 제1기 학생은 모두 지원자였다. 제2기 학생은 어느 정도 정규 교육을 받은 사람들로 보안대 부대와 정당들이 훈련에 추천한 자들이었다. 제3기 학생은 훈련을 위해 징집되었다. 현재 기수인 제3기 학생 대부분은 신의주 일대의 마을 출신이다.\n\n28. 신의주 보안대 장교학교의 현재 기수 학생은 3000명이다.\n\n29. 신의주 학교 졸업생 대부분은 근무를 위해 38선 부근 지역으로 보내졌다.\n\n이 문서는 간첩법(Espionage Act, 50 U.S.C. 31 및 32, 개정판)이 정하는 바의 미합중국 국방에 관계된 정보를 담고 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방식으로든 누설하는 것은 법으로 금지된다.\n\n공개 승인 2005/05/16 : CIA-RDP82-00457R000800840007-8", "secondary": "INTELLOFAX 4\n\n25X1[판독 불가]\nApproved For Release 2005/0[판독 불가]/16 : CIA-RDP[판독 불가]000899[판독 불가]40007\nCENTRAL INTELLIGENCE GROUP\nINTELLIGENCE REPORT\nCOUNTRY   Korea            DATE:\nINFO.\nSUBJECT   Military Information: Peace Preservation Corps Officers Schools in North Korea.\nDIST.  [판독 불가] September 1947   25X1A\n25X1   PAGES 4\n25X1   25X1\n\nDISTRIBUTION\n[판독 불가]\nSTATE |_\n\n1. Young men between the ages of 17 and 25 are being conscripted throughout North Korea and sent to the Peace Preservation Corps Officers Schools.\n\n2. Each district (?) in the Sinuiju (Shingishu) (124-2[판독 불가], 40-06) area selects 500 persons between the ages of 17 and 25 to undergo training in Peace Preservation Corps Officers Schools.\n\n3. The Military Affairs Department of the North Korea Military Committee is in charge of military conscription for all the Peace Preservation Corps Officers Schools in North Korea.\n\n25X1A\n25X1\n25X1\n\n4. The Peace Preservation Corps Officers Schools are now carrying on an extensive training program, with (Korean) troops participating in field combat exercises daily. A Soviet inspection group inspects each Peace Preservation Corps Officers School once a week.\n25X1   25X1A\n\n5. The General Headquarters of the Peace Preservation [Corps] Officers Schools in North Korea is at Nanam (Ranan) (129-41, 41-42). Note: Previously reported by another American agency: On 15 May, General Headquarters of Peace Preservation Corps Officers Training Centers in North Korea at Pyongy[판독 불가] [판독 불가] file [판독 불가] /125-44, 35-01/ [원문 그대로].)\n25X1   25X1   25X1\n\n6. The Commander in Chief of the Peace Preservation Corps Officers Schools is CHOE Yong-kon ([한자 판독 불가]). He was graduated from the Soviet Military School (in the USSR), served with the Soviet Military Committee (in the [판독 불가]) and returned to Korea after V-J Day. Note: [삭제]\n25X1   CHOE, Yong-ken [원문 그대로], Chairman of Korean Democratic Party in North Korea and head of the Prefectural B[판독 불가]reau.)\n25X1\n\n7. The Vice Commanding Officer of the General Headquarters of the Peace Preservation Corps Officers Schools in North Korea is MU Chong ([한자 판독 불가]). He was [판독 불가] command\n\nCLASSIFICATION\n\nDocument No. [판독 불가]\nNO CHANGE in Class. [판독 불가]\n[ ] DECLASSIFIED\nClass. CHANGED TO: TS  S  C\nREFERENCE CENTER LIBRARY\n[판독 불가]\n\n/16 : CIA-RDP82-00457R000800840007-8\n\nCENTRAL INTELLIGENCE GROUP\nApproved For Release 2005/05/16 : CIA-RDP82-00457R000800840007-8\n\n25X1A ing officer of the Korean Volunteer Army ([한자 판독 불가]) at Yenan (209-27, 36-36) [원문 그대로] and the head of the Korean Independence League ([한자 판독 불가]) [판독 불가]. He returned to North Korea after V-J Day. Note: [삭제] MU-chong, Commanding Officer of Korean Independent Volunteer Army. Note: also\n25X1   reported as [판독 불가] and [판독 불가]-chong.\n25X1\n\n[판독 불가]\n\n8. A \"thought inspection\" department is maintained in all Peace Preservation Corps Officers Schools. Two or three \"inspectors\" undergo training with each class of students to discover those students who have reactionary ideas.\n25X1\n\n9. [판독 불가] schools now known as Peace Preservation Corps Officers Schools were originally established in March 1946 and were first known as Political Schools. These Political Schools had been established to indoctrinate the young Koreans with Communistic ideas and to give them military training.\n25X1\n\n10. The important members of the staffs of the Peace Preservation Corps Officers Schools are mainly Koreans who received training in the Soviet Political Schools in the USSR or in the Eighth Route Army Military and Political School at Yenan. These instructors are intelligent and possess considerable ability. The other members of the staff are from the local areas. Their ability is considerably less than that of the important members of the staffs.\n25X1A   25X1\n\n[번호 없음] The total number of graduates of the Peace Preservation Officers Schools and the students receiving training in the schools is approximately 130,0[판독 불가]0.\n\n[번호 없음] Graduates of the Peace Preservation Corps Officers Schools have usually been assigned duty in the southern part of North Korea in the vicinity of the 38th parallel. Some have been assigned as instructors in Peace Preservation Corps Units. Some of the exceptional students have been sent for [판독 불가] to the Central Peace Preservation Officers School in Pyongyang. [판독 불가] the only school in North Korea engaged in training Korean soldiers to [판독 불가] officers in the Peace Preservation Corps Units.\n\nCentral Peace Preservation (Corps?) Officers School in Pyongyang\n\n13. The Central Peace Preservation Officers School in Pyongyang is the only real officers training school in North Korea. Graduates of this school are commissioned as officers in the Peace Preservation Corps. Graduates of the other Peace Preservation Corps Officers Schools are neither commissioned as officers nor do they receive the grade of any commissioned officer.\n25X1\n\n14. Candidates for the Central Peace Preservation Officers School in Pyongyang are usually selected from the outstanding students at the other so-called Peace Preservation Corps Officers Schools. Sometimes Peace Preservation Corps Unit members who have demonstrated special ability and have passed a special entrance examination are also selected as candidates for this school.\n25X1\n\n15. Graduates of the Central Peace Preservation Officers School in Pyongyang are assigned as officers in Peace Preservation Corps Units.\n\n16. There are now 600 students enrolled in the Central Peace Preservation Officers School in Pyongyang.\n\n17. Only members of the Korean Volunteer Army and graduates of the Pyongyang Central Peace Preservation Officers School are qualified to become members of the staffs of Peace Preservation Corps Units.\n\nCONFIDENTIAL   25X1\n[판독 불가]\n33\nApproved For Release 2005/05/16 : CIA-RDP82-00457R000800840007-8\n\nApproved For Release 2005/05/16 : CIA-RDP82-00457R000800840007-8\n25X1   25X1   25X1A\n\nPYONGYANG DISTRICT HEADQUARTERS OF THE PEACE PRESERVATION CORPS OFFICERS SCHOOLS\n\n18. A Pyongyang District Headquarters of the Peace Preservation Corps Officers Schools was recently established in the Sinri (Shin Ri) suburb of Pyongyang ([한자 판독 불가]) (125-[판독 불가]4, 39-01). The District Commander is LU Chong [원문 그대로]. (Note: See paragraph 7). The Vice Commander is PAK Hyo-sam ([한자 판독 불가]). [판독 불가] is a graduate of the Military and Political School ([한자 판독 불가]) in Yenan and was the head of the Military Department of the Korean Independence League in Yenan.\n\n19. The Headquarters of the 3rd Regiment of the Pyongyang District Headquarters of the Peace Preservation Corps Officers Schools is at [판독 불가]akwon ([한자 판독 불가]), a few kilometers southwest of Sinuiju. Note: [판독 불가] There is a [판독 불가]akwon District in South Sinuiju. Also previously reported by another American agency: The 3rd Training Unit of the Third Military District of the Peace Preservation Corps Officers Schools, with headquarters at Pyongyang, is at Pongnyousedong /? 125-16, 39-00 or 125-30, 10-12 ?/; the 3rd Training Unit of the First Military District of the Peace Preservation Corps Officers Schools, with headquarters at Kaechon /Kuisen/ /125-58, 39-[판독 불가]0/ is at South Sinuiju, a few kilometers from Sinuiju proper.)\n\n20. Commanding Officer of the 3rd Regimental Headquarters is CHANG Tok-sam ([한자 판독 불가]). He was the Commanding Officer of the 2nd group of the Korean Volunteer Army in Yenan.\n\n21. The 3rd Regiment consists of three battalions. The Commanding Officer of the 1st Battalion of the 3rd Regiment is O [판독 불가] ([한자 판독 불가]), who is a graduate of the Military and Political School in Yenan and was a member of the Korean Independence League in Yenan. The Commanding Officer of the 2nd Battalion is [판독 불가] U-mon ([한자 판독 불가]). The Commanding Officer of the 3rd Battalion is Y[판독 불가] Jang-kuk ([한자 판독 불가]). O, [판독 불가] and YE returned to Korea from Yenan after V-J Day.\n\n22. Some of the units of the 3rd Regiment are stationed in the former commercial middle school in South Sinuiju.\n\n23. Units of the 3rd Regiment stationed in South Sinuiju are armed with rifles of the Japanese 1-33 type [원문 그대로]. They also have 20 machine guns of the Soviet type and three trench mortars.\n\n25X1   Sinuiju Peace Preservation Corps Officers School\n\n24. The Peace Preservation Corps Officers School in Sinuiju is divided into [판독 불가] sections. One section (? units of the 3rd Regiment mentioned in paragraph 22 ?) is located in the former commercial middle school in South Sinuiju. The other section of the school is in the wharf area of Sinuiju proper.\n25X1\n\n25. The length of the training course in the Sinuiju Peace Preservation Corps Officers School is six months. Infantry and artillery training is given. The school has three artillery pieces which are used in the training course. Military training is received during the daytime under the guidance of Soviet officers. Additional instruction, both military and political, is given by the Korean instructors attached to the school. Instruction in the Russian language is also given.\n25X1   25X1\n\n26. The head of the school is the Commanding Officer of the Special Service Headquarters of the Soviet Army in Sinuiju. [삭제] Note: Previously reported:\n\n[판독 불가]   25X1\nApproved For Release 2005/05/16 : CIA-RDP82-00457R000800840007-8\n\n25X1   25X1\n286\n\nApproved For Release 2005/05/16 : CIA-RDP82-00457R00086089[판독 불가]0007-8\nCENTRAL INTELLIGENCE GROUP\n\nLt. Col. Pimashiht'ou /Chinese phoneticization/ is Commanding Officer of the Soviet Special Service /counter-espionage/ Headquarters in Sinuiju.\n\n27. The Peace Preservation Corps Officers School in Sinuiju was first known as the Political School. Two classes were graduated from this school and the third is now in training. Approximately 600 men and 100 women were trained in the first class when the school was still known as the Political School. Students of the first class were all volunteers. Students of the second class were persons with some formal education and had been recommended for the training by the Peace Preservation Corps Units and the political parties. Students of the third class were conscripted for the training. Most of the students in the third class, the present class, are from the villages in the Sinuiju area.\n\n28. There are 3000 students in the present class in the Peace Preservation Corps Officers School in Sinuiju.\n\n29. Most of the graduates of the Sinuiju School have been sent to the area around the 38th parallel for duty.\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nApproved For Release 2005/05/16 : CIA-RDP82-00457R000800840007-8", "notes": ["[삭제·공개 표시] Approved For Release 2005/05/16 : CIA-RDP82-00457R000800840007-8 (네 면의 공개 승인 도장. 1면과 4면은 도장이 본문과 겹쳐 찍혀 일부가 판독되지 않는다)", "[삭제·공개 표시] 25X1, 25X1A (여백에 반복해 찍힌 면제 표시. 본문 좌우 여백에 스무 곳 넘게 나온다)", "[삭제·공개 표시] 6항 뒤 Note 앞의 출처 표시가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] 7항 이어지는 대목의 Note 앞이 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] 26항에서 신의주 소련군 특무기관 사령관 이름이 들어갈 자리가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] Document No. / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S C (2면의 등급 변경 도장)", "[삭제·공개 표시] REFERENCE CENTER LIBRARY (참고자료실 도서관 도장)"], "note": "이 계열에서 가장 긴 보고이고 네 면 모두 스캔 상태가 나쁘다. 문단 번호가 여러 곳에서 뭉개져 있어 앞뒤 차례로 읽었다. 11항과 12항에 해당하는 두 문단은 원문에 번호가 아예 찍혀 있지 않아 [번호 없음]으로 두고 번호를 새로 매기지 않았다. 좌표는 한 자리도 고치지 않았다. 5항 주의 평양 좌표는 /125-44, 35-01/ 로 찍혀 있다. N35 문서는 같은 평양을 (125-44, 39-01)로 적으므로 위도가 어긋나지만 그대로 두었다. 옌안의 (209-27, 36-36)은 경도가 209도로 성립하지 않는 값이다. 신의주의 (124-2[판독 불가], 40-06)은 경도 분의 끝자리가 깨졌고, 개천의 /125-58, 39-[판독 불가]0/은 위도 분의 앞자리가 L 로 찍혀 판독되지 않는다. Pongnyousedong 의 /? 125-16, 39-00 or 125-30, 10-12 ?/ 는 원문 자체가 물음표를 달아 놓은 대목이라 그대로 옮겼다. 23항의 소총은 1-33 type 으로 찍혀 있다. 일본 三八式으로 보이나 숫자를 고치지 않고 원문대로 두었다. 인명의 한자는 모두 스캔에서 뭉개져 한 글자도 확정되지 않아 [한자 판독 불가]로 두었다. 최용건과 박효삼, 장덕삼, 무정은 로마자 표기를 그대로 두고 한글만 병기했다. 18항의 지구 사령관은 LU Chong 으로 찍혀 있고 원문 자신이 7항을 보라고 적어 무정을 가리키는 것으로 보이나 철자를 고치지 않았다. 19항의 지명 [판독 불가]akwon 은 첫 글자가 깨져 확정되지 않는다. Peace Preservation Corps 는 보안대(保安隊)다. 이 해에 인민군으로 이름이 바뀌는 중이라 원문 표기를 앞세우고 병기했다. Sinri 신리, Nanam 나남(Ranan), Kaechon 개천(Kuisen), Sinuiju 신의주(Shingishu)처럼 조선 이름과 일본식 이름이 둘 다 적힌 곳은 둘 다 살렸다. 이 문서에는 SOURCE 나 EVALUATION 줄이 인쇄되어 있지 않다. 정보원을 밝힌 대목은 모두 먹칠되었다.", "warn": false, "search": "CHOE Yong-kon 최용건 (보안대 장교학교 총사령관. 같은 항의 주에는 CHOE, Yong-ken 으로 적혀 있다) MU Chong 무정 (총사령부 부사령관. 옌안 조선의용군 사령관, 조선독립동맹 책임자 출신. 18항에는 LU Chong 으로 찍혀 있다) PAK Hyo-sam 박효삼 (평양 지구사령부 부사령관) CHANG Tok-sam 장덕삼 (제3연대장) O [판독 불가] (제3연대 제1대대장) [판독 불가] U-mon (제3연대 제2대대장) Y[판독 불가] Jang-kuk (제3연대 제3대대장. 뒤 문장에서는 YE 로 줄여 적었다) Pimashiht'ou 중령 (신의주 소련군 특무기관 사령관. 러시아인 이름의 중국식 음역이라고 원문이 밝혔다) Approved For Release 2005/05/16 : CIA-RDP82-00457R000800840007-8 (네 면의 공개 승인 도장. 1면과 4면은 도장이 본문과 겹쳐 찍혀 일부가 판독되지 않는다) 25X1, 25X1A (여백에 반복해 찍힌 면제 표시. 본문 좌우 여백에 스무 곳 넘게 나온다) 6항 뒤 Note 앞의 출처 표시가 먹칠되어 [삭제]로 옮겼다 7항 이어지는 대목의 Note 앞이 먹칠되어 [삭제]로 옮겼다 26항에서 신의주 소련군 특무기관 사령관 이름이 들어갈 자리가 먹칠되어 [삭제]로 옮겼다 Document No. / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S C (2면의 등급 변경 도장) REFERENCE CENTER LIBRARY (참고자료실 도서관 도장) Military Information: Peace Preservation Corps Officers Schools in North Korea"}, {"id": "N31", "order": 55, "date": "1947-09-08", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "경제 첩보: 북조선의 구호", "badge": "confidential (CONTROL: U. S. OFFICIALS ONLY)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-09-08"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Economic Information: Relief in North Korea", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r000900020007-7"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r000900020007-7"}], "summary": "5월에 소련 당국이 밀가루와 옥수숫가루를 북조선에 구호품으로 내주었다. 사람들은 그것이 작년에 자기들에게서 걷어 간 현물세라고 여긴다.", "points": ["5월에 받은 소량의 밀가루와 옥수숫가루를 구호품으로 배급했다. 공장 노동자에게만 주었다.", "사람들은 소련이 준 것이 아니라 조선소비조합이 걷어 소련에 넘긴 현물세의 일부가 돌아온 것이라고 믿는다.", "북조선 농민은 한 해 생산량의 약 25%를 소비조합에 내게 되어 있다는 주가 붙어 있다.", "식량 부족이 심각하고 반소 감정이 퍼져 있어 소련이 되돌려 주는 것이라고 사람들이 본다.", "배급은 각 인민위원회가 맡는다."], "primary": "공개 승인(Approved For Release) [판독 불가] 기밀(CONFIDENTIAL) [판독 불가]2-00457R000900020007-7\n[판독 불가]\n\n미국 관리 전용(U. S. OFFICIALS ONLY)   25X1A\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n첩보보고(INTELLIGENCE REPORT)\n\n이 문서는 중앙정보국장이 미합중국 문서관리관에게 보낸 1978년 [판독 불가]월 16일자 서한에 따라 기밀(CONFIDENTIAL)로 등급이 조정되었다.\n\n주제   경제 첩보: 북조선의 구호(Economic Information: Relief in North Korea)\n다음 재검토 예정일: 2008년\n배포(DIST.)  1947년 9월 1[판독 불가]일\n면수  1\n국가   조선(Korea)\n25X1A\n\n소련으로부터 받은 구호품(Relief Goods Received from Soviets)\n\n2. [원문 그대로] 5월에 소련 당국으로부터 소량의 밀가루와 옥수숫가루를 받아 북조선에서 구호품으로 배급하였다. 밀가루와 옥수숫가루는 공장 노동자에게만 주었다. [삭제]\n\n2. 사람들은 그 밀가루와 옥수숫가루가 소련에서 온 것이라고 믿지 않는다. 작년에 조선소비조합(Korean Consumers' Association)이 걷어 소련 측에 넘긴 「현물(commodity)」세의 일부라고 믿는다.\n25X1A   주(Note): [삭제] 북조선의 농민은 한 해 생산량의 약 25%를 소비조합에 [판독 불가] 하게 되어 있다). 사람들은 북조선의 식량 부족이 심각하고 조선인 상당수 사이에 반소 감정이 있기 때문에, 소련이 작년에 넘겨받은 식량 일부를 지금 북조선 사람들에게 돌려주고 있는 것이라고 여긴다.\n\n25X1A\n\n3. 식량 배급은 북조선의 각 인민위원회(People's Committees)가 맡아 하고 있다.\n\n이 문서는 간첩법(Espionage Act, 50 U.S.C. 31 및 32, 개정판)이 정하는 바의 미합중국 국방에 관계된 정보를 담고 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방식으로든 누설하는 것은 법으로 금지된다.\n\n문서번호(Document No.) [판독 불가]\n등급 변경 없음(NO CHANGE in Class.) [판독 불가]\n참고자료실(REFERENCE C[판독 불가])\n\n분류(CLASSIFICATION)   기밀(CONFIDENTIAL)   통제(CONTROL): 미국 관리 전용(U. S. OFFICIALS ONLY)\n\n공개 승인 2[판독 불가] 기밀(CONFIDENTIAL) [판독 불가]82-00457R000900020007-7", "secondary": "Approved For Release [판독 불가] CONFIDENTIAL [판독 불가]2-00457R000900020007-7\n[판독 불가]\n\nU.
