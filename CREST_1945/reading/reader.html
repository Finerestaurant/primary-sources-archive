지대 이름) Chong-paek (류허의 종대 이름) Yong-san (신빈의 지대 이름) Approved For Release … 457R001100070007-9 (각 면의 공개 승인 도장. 도장 글자가 뭉개져 앞자리를 읽을 수 없다) 25X1, 25X1A, 25X1X (표제부와 본문 여백에 반복해 찍힌 면제 표시) Document No. / CLASSIFICATION CONFIDENTIAL / NO CHANGE in class. / DECLASSIFIED / Class. CHANGED TO: / Auth: 0, G59. 7878S / Date: 의 등급 처리 도장 EVALUATION OF SOURCE 아래의 평가 표가 뭉개져 읽을 수 없다 배포처 표(STATE·WAR·NAVY·JUSTICE·R&E·CAD)의 표시 칸을 읽을 수 없다 COUNTRY 칸과 SUBJECT 줄 앞부분이 뭉개져 [판독 불가]로 옮겼다 Military Information: The Korean Volunteer Army in Manchuria"}, {"id": "N62", "order": 85, "date": "1947-11-17", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "군사 첩보: 만주의 조선자위군", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-11-17"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: The Korean Self Defense Army in Manchuria", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r001100070008-8"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r001100070008-8"}], "summary": "만주의 한국독립당(KIP)이 중국 국민당의 힘을 빌려 무크덴에 조선자위군(KSDA)을 만든 경위와 그 편제, 병력, 장비를 적었다.", "points": ["KIP 가 조선에 모병 공작원을 보내 지원자 60명을 안둥에 모으고, 이를 명분으로 국민당에 조선인 군대 창설을 요청한다.", "KIP 지도자 KIM Hak-kyu 와 PAK Yong-chun 이 주석 동북행원의 중국인 중령 YANG Fu-t'ang 을 통해 군대를 조직한다. 처음 이름은 창옌 지구 조선민주자위군이다.", "임명된 조선인 지휘관들이 KIP 통제를 꺼려 처음에는 자리를 거절한다. YI Paek-kun 한 사람만 끝까지 거절하고 남조선으로 간다.", "1947년 7월 국민당이 조선인 혈통의 국민당군 장군 KIM Un-ch'ung 을 지휘관으로 임명한다. 그가 창춘 전선의 조선인 공산군 포로 286명을 편입하려다 이견이 생기고, 난징으로 떠난 뒤 돌아오지 않는다.", "1947년 7월 24일 기준 병력은 장교와 병사 567명이다. 무기는 국민당이 보초용으로 준 소총 일곱 정과 조선인 장교의 권총 열 정뿐이다.", "KSDA 는 동북초비사령부의 직접 통제를 받는다. 7월 9일 무크덴에서 훈련 중인 조선인이 412명이고 그 가운데 60명이 KIM Nang 의 장교훈련소에 있다.", "조선인 공산군 포로 17명도 훈련을 받고 훈련이 끝나면 KSDA 에 배치된다."], "primary": "공개 승인(Approved For Release) [판독 불가] : [판독 불가]7R00[판독 불가]70008-8\n25X1  25X1A\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가   중국(China)                            일자(DATE):  25X1A\n                                             정보일(INFO.)\n주제   [판독 불가] 조선자위군(The Korean Self Defense [Army in Manchuria])   배포(DIST.) 1947년 11월 6일\n25X1A                                        면수  2\n출처(ORIGIN)  [판독 불가]                       보충(SUPPLEMENT)\n25X1X\n\n배포처(DISTRIBUTION)\n국무부(STATE) | 육군부(WAR) | 해군부(NAVY) | 법무부(JUSTICE) | R&E | CAD\n[표시 칸 판독 불가]\n\n1. 만주의 한국독립당(Korean Independence Party, KIP)은 자기들이 싸울 수 있는 군대를 조직할 수 있음을 25X1X 중국 국민당 당국에 보이려 하였다. 그래서 1945년 말과 1947년 초 [원문 그대로]에, 애국심이 있고 조선을 돕고자 하는 조선인 청년은 모두 군대를 만드는 데 참여해야 한다고 발표하였다. 1947년 1월 KIP 는 모병 공작원을 조선으로 들여보냈다. 이 모병 장교들이 애쓴 결과, 조선인 약 60명이 KIP 가 조직하려던 군대에 들어가려고 지원자로서 안둥(Antung 安東)에 왔다.\n\n2. 이 지원자 60명을 명분으로 삼아, KIP 지도자인 KIM Hak-kyu([한자 판독 불가])와 PAK Yong-chun([한자 판독 불가])이 중국 국민당 쪽에 접촉하여 「만주의 조선인을 지키기」 위한 조선인 군대를 만들자고 하였다. KIM 과 PAK 은 둘 다 YANG Fu-t'ang([한자 판독 불가])의 친구였다. YANG 은 주석 동북행원(President's Northeast Field Headquarters, 지금의 NEPH 원문 `NKPH`)에 있던 중국인 중령이다. YANG 은 KIM 과 PAK 이 조선인 군대를 조직하는 것을 도왔고, 이 군대는 창옌 지구 조선민주자위군(Korean Democratic Self Defense Army in the Chang-Yen Area)([한자 판독 불가])(무크덴 북쪽)으로 알려지게 되었다. 이 군대는 지금 보통 조선자위군(Korean Self Defense Army, KSDA)이라 부른다.\n\n3. KIM 과 PAK 은 CH'EN Li-fu 천리푸와 그의 CC계(CC Clique)를 따르는 자로 알려져 있어, 만주의 조선인들, 특히 무크덴의 조선인들이 대체로 좋아하지 않는다. 그래서 KIM 과 PAK 은 HSIUNG Shih-hui 슝스후이 장군의 이름으로 YANG 이 KSDA 의 장교를 임명하게 하였다. 처음에 부대의 지휘관으로 임명된 조선인들은 새 자리를 받아들이지 않았다. 이 군대가 KIM 과 PAK 이 이끄는 한국독립당의 영향과 통제 아래 있다는 것을 알고 있었고, 임명된 자들은 그 둘을 좋아하지 않았기 때문이다. 그러나 결국 임명된 장교들은 받아들일 수밖에 없었다. 중국 국민당의 압력이 있었고, 만주의 전반적인 중국인과 조선인 사이의 군사·정치 정세가 그러했으며, 임명된 자들 말고는 계획된 부대를 제대로 지휘할 수 있는 조선인이 없었기 때문이다. 장교로 임명된 조선인 가운데 YI Paek-kun(원문 `YI Pack-kin`)([한자 판독 불가]) 한 사람만이 받아들이지 않았다. 그는 194[판독 불가]년 8월 25일 무크덴을 떠나 남조선으로 갔다.   25X1A\n\n4. 처음에 KSDA 의 여러 부대는 소대(platoon)라 불렸다. 그러나 이 부대들은 곧 대대(battalion)로 불리게 되었다. 1947년 7월 첫 두 주 동안 KIP(그리고 [판독 불가](원문 `XRG`))와 중국 국민당 사이에 상당한 다툼이 있었다. 조선인 단체들은 이 군대가 조선인의 감독을 받는 자치 조직이 되기를 바랐다. 1947년 7월 초 국민당은\n\n25X1\n등급(CLASSIFICATION) 기밀(CONFIDENTIAL)\n문서번호(Document No.) [판독 불가]\n등급 변경 없음(NO CHANGE in Class.) [ ]\n[ ] 비밀해제(DECLASSIFIED)\n등급 변경(Class. CHANGED TO): [판독 불가]\n일자(Date): [판독 불가]\n\n공개 승인 [판독 불가] : [판독 불가]7R001100070008-8\n\n———\n\n공개 승인 [판독 불가]  기밀(CONFIDENTIAL)  [판독 불가]100070008-8\n\n25X1\n25X1  25X1A\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n-2-\n\n[원문 여백에 `6.`] KIM Un-ch'ung([한자 판독 불가]) 장군을 지휘관으로 임명하였다. 그는 조선인 혈통으로 중국 국민당군의 장군이 된 사람이다. 다시 의견이 갈렸다. KIM 장군이 창춘(Changchun) 전선에서 사로잡은 조선인 공산군 포로 286명을 KSDA 에 편입하려 했기 때문이다. KIM 장군은 이 조치의 허가를 얻으러 난징(Nanking)으로 떠났으나 무크덴으로 돌아오지 않았다. 이때부터 국방부(Ministry of National Defense)가 KSDA 의 조직을 맡았다.\n\n현재 KSDA 의 편제는 다음과 같다.\n\n지휘관: YANG Fu-t'ang\n부지휘관: PAK Yong-chun\n\n대대장:\n제1대대 - YUN Il-p'a([한자 판독 불가])\n제2대대 - CH'OE Hyok-chu([한자 판독 불가])\n제3대대 - KIM Nang([한자 판독 불가]). KIM Yang([한자 판독 불가])과 KIM Mong([한자 판독 불가])으로도 알려져 있다\n제4대대 - KIM Se-nak(원문 `KIU Se=nak`)([한자 판독 불가])\n\n본래 YI Paek-kun 아래 또 한 대대를 두려 했으나 YI 가 그 자리를 거절하였다. 그래서 MUN Hak-pin([한자 판독 불가])이 임명되었으나, PAK Yong-chun 이 그를 해임하고 중국인 한 사람(이름 미상)을 임명하였다. 1947년 9월 27일에 이르러 이 부대는 언급되지 않았다. [판독 불가] 해체되어 다른 네 대대에 편입된 것으로 보인다.\n\n[원문 여백에 `7.`] 1947년 7월 24일 KSDA 의 인원은 장교와 병사 567명이었다. 이 군대는 나뉘어 있다. 한쪽은 Ming Lien Chieh([한자 판독 불가])에 있고 다른 한쪽은 Ch'[판독 불가] Li Chieh(원문 `Ch'nne Li Chieh`)([한자 판독 불가])에 있다. 무크덴시 서쪽의 두 구역이다.\n\nKSDA 는 만들어진 뒤로 이렇다 할 일을 이룬 것이 없다. 이 군대가 가진 것은 중국 국민당이 보초용으로 내준 소총 일곱 정과 조선인 장교들이 사사로이 쓰는 권총 열 정뿐이다.\n\nKSDA 는 동북초비사령부(Northeast Pacification Headquarters)의 직접 통제를 받는다. 1947년 7월 9일 무크덴에서 국민당의 훈련을 받고 있던 조선인은 41? [원문 그대로] 명이었다. 제3대대장 KIM Nang 이 무크덴의 T[판독 불가] Yuan Chieh(원문 `T. Yuan Chieh`)([한자 판독 불가])에 있는 장교훈련소를 맡았다. 전에 신학교 건물이던 곳이다. 훈련을 받는 조선인 412명 가운데 60명이 KIM Nang 의 훈련소에 있다. 훈련을 마치면 이 조선인 60명은 KSDA 의 네 대대에서 장교가 된다. KIM Nang 은 조선인 공산군 포로 17명의 훈련도 맡고 있는데, 이들은 훈련을 마치면 KSDA 에 배치된다.\n\n이 문서는 미합중국의 국방에 관계된 정보로서 개정된 간첩법(Espionage Act 50, U.S.C. 31 및 32)의 적용을 받는 정보를 담고 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방법으로든 누설하는 것은 법으로 금지된다.\n\n25X1\n\n기밀(CONFIDENTIAL)\n\n25X1\n\n공개 승인 [판독 불가] : [판독 불가]457R001100070008-8", "secondary": "Approved For Release [판독 불가] : [판독 불가]7R00[판독 불가]70008-8\n25X1  25X1A\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCOUNTRY   China                              DATE:  25X1A\n                                             INFO.\nSUBJECT   [판독 불가] The Korean Self Defense [Army in Manchuria]   DIST. 6 November 1947\n25X1A                                        PAGES  2\nORIGIN  [판독 불가]                            SUPPLEMENT\n25X1X\n\nDISTRIBUTION\nSTATE | WAR | NAVY | JUSTICE | R&E | CAD\n[표시 칸 판독 불가]\n\n1. The Korean Independence Party (KIP) in Manchuria, in an effort to show the 25X1X Chinese Nationalist authorities that the KIP could organize a fighting force, announced in late 1945 and early 1947 [원문 그대로] that all young Koreans who were patriotic and wanted to aid Korea should join in forming an army. In January 1947 the KIP sent agent-recruiting officers into Korea. As a result of the efforts of these recruiting officers, about sixty Koreans came to Antung as volunteers to join the army which the KIP intended to organize.\n\n2. With these sixty volunteers as a talking point, KIM Hak-kyu ([한자 판독 불가]) and PAK Yong-chun ([한자 판독 불가]), KIP leaders, then approached the Chinese Nationalists to form a Korean army to \"protect Koreans in Manchuria.\" KIM and PAK were both friends of YANG Fu-t'ang ([한자 판독 불가]), a Chinese lieutenant colonel in the President's Northeast Field Headquarters (now NEPH) (원문 `NKPH`). YANG helped KIM and PAK organize the Korean army which became known as the Korean Democratic Self Defense Army in the Chang-Yen Area ([한자 판독 불가]) (north of Mukden). This army is now usually called the Korean Self Defense Army (KSDA).\n\n3. KIM and PAK, reportedly followers of CH'EN Li-fu and his CC Clique, are not generally liked by Koreans in Manchuria and in Mukden in particular. KIM and PAK, therefore, had YANG appoint the officers for the KSDA in the name of General HSIUNG Shih-hui. At first the Koreans appointed as commanding officers of the proposed units did not accept their new positions; they knew that this proposed Korean army was influenced and controlled by the Korean Independence Party headed by KIM and PAK whom the appointees do not like. Finally, however, the officers appointed had to accept because of pressure from the Chinese Nationalists, the general Sino-Korean military and political situation in Manchuria, and because there were no other Koreans except those appointed who could capably command the units proposed. Of those Koreans appointed as officers, only YI Paek-kun (원문 `YI Pack-kin`) ([한자 판독 불가]) did not accept; he left Mukden on 25 August 194[판독 불가] for South Korea.   25X1A\n\n4. At the beginning, the various units of the KSDA were called platoons. However, these units soon became known as battalions. During the first two weeks in July 1947 there was considerable contention between the KIP (and the [판독 불가] (원문 `XRG`)) and the Chinese Nationalists. The Korean groups wanted the army to be an autonomous body under the supervision of a Korean. In early July 1947 the Nationalists\n\n25X1\nCLASSIFICATION CONFIDENTIAL\nDocument No. [판독 불가]\nNO CHANGE in Class. [ ]\n[ ] DECLASSIFIED\nClass. CHANGED TO: [판독 불가]\nDate: [판독 불가]\n\nApproved For Release [판독 불가] : [판독 불가]7R001100070008-8\n\n———\n\nApproved For Release [판독 불가]  CONFIDENTIAL  [판독 불가]100070008-8\n\n25X1\n25X1  25X1A\nCENTRAL INTELLIGENCE GROUP\n-2-\n\n[원문 여백에 `6.`] appointed General KIM Un-ch'ung ([한자 판독 불가]), a general in the Chinese Nationalist army of Korean parentage, to be the commanding officer. Further differences of opinion occurred because General KIM wanted to incorporate 286 Korean Communist prisoners captured on the Changchun front into the KSDA. General KIM left for Nanking to secure permission for this move, but has not returned to Mukden. From this time on the Ministry of National Defense took charge of organizing the KSDA.\n\nThe present organization of the KSDA is as follows:\n\nCommanding Officer: YANG Fu-t'ang\nVice Commander: PAK Yong-chun\n\nBattalion Commanders:\n1 Battalion - YUN Il-p'a ([한자 판독 불가])\n2 Battalion - CH'OE Hyok-chu ([한자 판독 불가])\n3 Battalion - KIM Nang ([한자 판독 불가]) also known as KIM Yang ([한자 판독 불가]) and KIM Mong ([한자 판독 불가])\n4 Battalion - KIM Se-nak (원문 `KIU Se=nak`) ([한자 판독 불가])\n\nAnother battalion under YI Paek-kun was originally planned; however, YI refused the position. MUN Hak-pin ([한자 판독 불가]) was then appointed; however, he was discharged by PAK Yong-chun and a Chinese (name unknown) was appointed. By 27 September 1947 no mention was made of this unit; it [판독 불가] have been dissolved and incorporated into the other four battalions.\n\n[원문 여백에 `7.`] On 24 July 1947 there were 567 officers and men in the KSDA. The army is divided: one part is at Ming Lien Chieh ([한자 판독 불가]) and the other at Ch'[판독 불가] Li Chieh (원문 `Ch'nne Li Chieh`) ([한자 판독 불가]), two districts in the western section of Mukden City.\n\nSince its formation, the KSDA has accomplished nothing of importance. The army has only seven rifles donated by the Chinese Nationalists for the use of sentries and ten pistols belonging to the Korean officers for their private use.\n\nThe KSDA is directly controlled by the Northeast Pacification Headquarters. On 9 July 1947 there were 41? [원문 그대로] Koreans being trained by the Nationalists in Mukden. KIM Nang, Commander of the 3 Battalion, has been placed in charge of an officers' training camp at T[판독 불가] Yuan Chieh (원문 `T. Yuan Chieh`) ([한자 판독 불가]), a former seminary building in Mukden. Of the 412 Koreans being trained, sixty are in KIM Nang's camp. Upon completion of their training, the sixty Koreans will become officers in the four battalions of the KSDA. KIM Nang is also in charge of the training of seventeen Korean Communist prisoners who will be placed in the KSDA upon the completion of their training.\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act 50, U.S.C. 31 and 32, as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\n25X1\n\nCONFIDENTIAL\n\n25X1\n\nApproved For Release [판독 불가] : [판독 불가]457R001100070008-8", "notes": ["[삭제·공개 표시] Approved For Release … 457R001100070008-8 (각 면의 공개 승인 도장. 앞자리가 뭉개져 있다)", "[삭제·공개 표시] 25X1, 25X1A, 25X1X (표제부와 1항·3항 여백에 반복해 찍힌 면제 표시)", "[삭제·공개 표시] CLASSIFICATION CONFIDENTIAL / Document No. / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: / Date: 의 등급 처리 도장", "[삭제·공개 표시] ORIGIN 칸이 뭉개져 [판독 불가]로 옮겼다", "[삭제·공개 표시] DISTRIBUTION 표의 표시 칸을 읽을 수 없다", "[삭제·공개 표시] SUBJECT 줄 앞부분이 뭉개져 [판독 불가]로 옮겼다"], "note": "두 면짜리 보고다. 1면은 비교적 읽히고 2면의 명단 대목이 흐리다. 인명과 지명의 한자가 모두 스캔에서 깨져 [한자 판독 불가]로 두었다. 1항의 `late 1945 and early 1947` 은 앞뒤가 맞지 않으나 날짜의 숫자는 고치지 않고 그대로 두었다. 3항의 출국 날짜는 `25 August. 194:` 로 찍혀 연도의 끝자리를 읽을 수 없다. 4항의 `(and the XRG.` 는 KRA 곧 조선인거류민회를 가리키는 것으로 보이나 확정되지 않아 [판독 불가]로 두었다. 같은 문서철의 N64 가 무크덴의 Korean Residents Association 을 다룬다. 병력 수를 고치지 않았다. 7월 9일자 훈련 인원은 첫 언급이 `41?` 로 찍혀 있고 같은 문단 뒤에서는 `412` 로 나온다. 앞의 것을 원문대로 두었다. 2면 여백의 문단 번호는 `6.` 과 `7.` 만 남아 있어 새로 매기지 않고 남은 자국만 표시했다. 무크덴 두 구역 이름 `Ming Lien Chieh` 와 `Ch'nne Li Chieh`, 훈련소가 있던 `T. Yuan Chieh` 는 로마자 표기를 고치지 않았다. `President's Northeast Field Headquarters` 는 주석 동북행원이고 약호는 문서가 `NKPH` 로 찍었으나 뒤에서 `Northeast Pacification Headquarters` 로 풀어 쓴다. 원문 표기를 함께 남겼다. `Korean Independence Party` 는 한국독립당, `Korean Self Defense Army` 는 조선자위군으로 옮기고 원문 표기를 앞세웠다.", "warn": false, "search": "KIM Hak-kyu (원문 `KIN Hak-kyu`, 한국독립당 지도자) PAK Yong-chun (한국독립당 지도자, KSDA 부지휘관) YANG Fu-t'ang 양푸탕 (주석 동북행원 소속 중국인 중령, KSDA 지휘관) CH'EN Li-fu 천리푸 (CC계) HSIUNG Shih-hui 슝스후이 장군 (그 이름으로 KSDA 장교가 임명됨) YI Paek-kun (원문 `YI Pack-kin`, 임명을 거절하고 남조선으로 감) KIM Un-ch'ung (조선인 혈통의 중국 국민당군 장군, KSDA 지휘관으로 임명됨) YUN Il-p'a (제1대대장) CH'OE Hyok-chu (제2대대장) KIM Nang (제3대대장. KIM Yang·KIM Mong 으로도 불린다. 장교훈련소를 맡음) KIM Se-nak (원문 `KIU Se=nak`, 제4대대장) MUN Hak-pin (다섯째 대대장으로 임명되었다가 해임됨) Approved For Release … 457R001100070008-8 (각 면의 공개 승인 도장. 앞자리가 뭉개져 있다) 25X1, 25X1A, 25X1X (표제부와 1항·3항 여백에 반복해 찍힌 면제 표시) CLASSIFICATION CONFIDENTIAL / Document No. / NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: / Date: 의 등급 처리 도장 ORIGIN 칸이 뭉개져 [판독 불가]로 옮겼다 DISTRIBUTION 표의 표시 칸을 읽을 수 없다 SUBJECT 줄 앞부분이 뭉개져 [판독 불가]로 옮겼다 Military Information: The Korean Self Defense Army in Manchuria"}, {"id": "N44", "order": 86, "date": "1947-11-18", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "조선에서의 소련 목표 이행 (ORE 62)", "badge": "secret", "list_right": "국가정보판단서", "meta": [{"k": "일자", "v": "1947-11-18"}, {"k": "발신", "v": "Central Intelligence Agency 중앙정보국", "txt": true}, {"k": "종류", "v": "국가정보판단서"}, {"k": "원제", "v": "Implementation of Soviet Objectives in Korea (ORE 62)", "txt": true}, {"k": "CREST 번호", "v": "0000256631"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/0000256631"}], "summary": "소련이 조선 전역을 위성국으로 만들려 하며 침투와 공고화와 통제라는 계획을 대일전승일 이래 지켜 왔다고 본다. 유엔 총회 결의가 통과된 지금 소련이 택할 수 있는 수는 북조선인민위원회를 합법 정부로 선포한 뒤 일방 철수하는 것이라고 판단한다.", "points": ["1946년 중반에 새어 나온 소련의 「조선을 위한 기본계획」이 이 판단의 뼈대다. 공동위원회에서 시간을 끌면서 북에 군사·정치 기구를 세우고, 남에서는 공산당을 지하로 넣어 행정과 경찰에 침투시킨다는 것이다.", "소비에트화에 저항할 수 있던 세 집단을 지목한다. 유산 계급, 민족주의 청년, 서구 지향 종교 집단이다. 토지개혁법과 영업세가 유산 계급을 몰수해 남으로 밀어냈고, 서북조선청년회는 미국 지대로 옮겨 갔고, 개신교와 천주교 지도부는 가택 연금에 놓였다고 적었다.", "북조선인민위원회가 소련에서 훈련받고 소련과 조선의 이중 국적을 가진 조선인들로 「채워져」 있어 소련 정책에 종속된다고 본다. 북조선 군사력은 조선 전역을 지체 없이 장악할 수 있는 수준에 이르렀다고 평가한다.", "1947년 8월 11일 마셜의 각서, 8월 26일 러벳의 4개국 회의 요청, 9월 4일 소련의 거부, 9월 26일 소련의 상호 철수 제안, 10월 7일 무명 정치인들의 G-2 접촉, 11월 5일 유엔 총회 정치위원회의 결의 통과를 차례로 짚는다.", "소련이 점령을 계속하면 미국의 남조선 점령도 계속되고, 그러면 두 체제를 나란히 견주어 보이는 미국의 장기 재건 계획이 남에서 가능해진다. 소련이 가장 두려워하는 것이 이것이라고 본다.", "미군이 철수하면 남에는 저항할 세력이 없다고 단언한다. 우익 지도부는 권력을 잡으면 중도파를 좌익으로 밀어내고 자기들끼리 갈라질 것이며, 우익 청년 단체와 경찰과 경비대는 서로 다투고 있어 인민군의 대항 세력이 못 된다는 것이다.", "소련 지지자가 남조선 유권자의 약 30퍼센트라고 추산한다. 이승만이 미군 잔류 요청을 거두고 미군이 떠나면 북조선을 「다룰」 수 있다고 말하는 것을 망상이라 적었다.", "선거일인 1948년 3월 31일 이전에 소련이 일방 철수를 명하리라 예상하고, 유엔 임시위원단의 조선 출발이 그 신호가 될 수 있다고 본다."], "primary": "중앙정보국(CENTRAL INTELLIGENCE AGENCY)\n\n조선에서의 소련 목표 이행(IMPLEMENTATION OF SOVIET OBJECTIVES IN KOREA)\n\nORE 62 [원문 \"one62\"]    중앙정보국 역사검토계획(CIA HISTORICAL REVIEW PROGRAM)\n1947년 11월 18일    전문 공개(RELEASE IN FULL)\n\n문서(Document) [판독 불가]\n비밀(SECRET)\n\n$0005 [원문 그대로]\n\nORE 62    [판독 불가]\n\n1947년 11월 18일    사본 번호(Copy No.) ___ [삭제]\n\n조선에서의 소련 목표 이행(IMPLEMENTATION OF SOVIET OBJECTIVES IN KOREA)\n\n요약(SUMMARY)\n\n조선에서의 소련의 전술은 소련이 조선 전역을 위성국으로 확보하려 하고 있음을 분명히 보여 주었다. 이 정책을 추구하면서 소련은 대일전승일(V-J Day) 이래 침투와 공고화와 통제라는 명확한 계획을 고수해 왔다. 이 정책에 대한 미국의 대응은 소련의 작전 일정에 사소한 이탈을 가져왔을 뿐, 그 근본 전략에는 아무런 변화도 강요하지 못하였다.\n\n항구적 조선 정부 수립을 위한 선거를 감시할 유엔 위원단을 임명하자는 미국의 제안이 유엔 총회(UNGA)에서 채택되었으므로, 자기 지대에 대한 사찰을 완강히 거부하는 소련이 점령을 계속할 수밖에 없게 된 것처럼 보일 수 있다. 그 결과 미국의 점령 또한 계속되어야 할 것이고, 따라서 소련이 완전한 통제를 이루는 날은 무기한 미루어지는 것처럼 보인다. 그러나 소련은 미국이 유엔에서 일방적으로 행동함으로써 이미 모스크바 협정을 파기하였다는 자기들의 주장을 이용하여 일방적으로 철수할 수 있다. 소련이 그렇게 할 여유가 있는 것은, 자기들이 물리적으로 없는 상태에서도 정책을 수행할 수 있도록 북조선에 강력한 군사적·정치적 기구를 세워 두었고 이제 그것에 의지할 수 있기 때문이다. 이러한 정황에서 미국이 유엔 총회 결의의 이행을 보고자 한다면, 아마도 북조선으로의 진입을 강행해야 할 것이며, 소련이 「독립」 북조선이라 부를 대상, 「제국주의」 국가에게 무자비하게 짓밟히고 있다고 할 그 대상을 상대로 군사력을 쓰게 될 것이다. 마찬가지로 미국이 남조선에서 일방적으로 행동하려는 어떠한 시도도 「제국주의」 목적을 위한 부당한 점령 연장이라는 낙인이 찍힐 수 있고, 그리하여 남조선 사람들 사이에 심각한 반미 감정을 낳을 수 있다.\n\n따라서 유엔 위원단이 조선에 도착하기에 앞서 시점을 맞춘 일방 철수가 소련의 전술로 충분히 있을 법하다. 이 조치가 취해진다면, 반드시 북조선 정권에 대하여 유엔 위원단의 북조선 진입을 어떤 대가를 치르더라도 저지하라는 명령이 따를 것이다. 이러한 상황에서 미국이 압력에 굴복하여 단기간 안에 자기 병력을 철수하리라는 것이 아마도 소련의 기대일 것이다. 상당한 노력을 오랜 기간에 걸쳐 투입하지 않고서는 미국이 남조선에 실효 있는 대항 세력을 세울 수 없으므로, 미국의 철수는 남조선이 북으로부터의 종국적 지배에 대하여 어떠한 진지한 저항도 하지 못하는 상태로 남겨 두는 결과를 낳을 것이다.\n\n주(Note): 이 문서는 국무부, 육군부, 해군부, 공군부의 정보 조직들과 조정을 거쳤다.\n\n1    비밀(SECRET) [원문 \"1 ena\"]\n\n조선에서의 소련 목표 이행(IMPLEMENTATION OF SOVIET OBJECTIVES IN KOREA)\n\n대일전승일 이래 조선에서의 소련의 전술은, 조선을 극동의 충실한 소련 위성국으로 획득하는 것을 보장하지 않는 어떠한 해결도 받아들이지 않겠다는 확고한 의도를 일관되고 분명하게 드러내 왔다. 소련의 이른바 「조선을 위한 기본계획(Master Plan for Korea)」의 세부 내용이 1946년 중반에 새어 나왔으며, 그 뒤의 사태는 소련이 전술적 고려에서 부득이하게 생긴 사소한 이탈을 빼고는 이 「계획」의 기본 골격을 따라 왔다는 사실을 뒷받침하는 쪽이다.\n\n애초의 계획은 미소공동위원회(US-USSR Joint Commission)에서 지연 전술을 써서 긴 유예 기간을 벌어 두려 한 것으로 보인다. 그 목적은 소련의 후원 아래 북조선에 강력한 군사·정치 기구가 세워지기 전까지는 어떠한 조선 문제 해결도 나오지 못하도록 확실히 해 두는 데 있었다. 이는 이른바 민주주의민족전선(Democratic Peoples' Front)의 구성원을 늘림으로써 남조선 공산당을 강화하는 방식으로 이루어질 것이었다. 공산당 자체는 지하로 들어가 「전위(front)」 조직들을 통해 활동하면서 실제 세력을 감추기로 되어 있었다. 또한 남조선의 행정 및 경찰 조직의 요직에 당원을 침투시키는 데 집중하기로 되어 있었다.\n\n소련은 이 목적들 가운데 첫째 것을 이루는 데 두드러지게 성공하였다. 1945년 소련군이 북조선에 들어왔을 때, 주민 가운데 소비에트화에 조직적으로 저항할 수 있다고 여겨진 집단이 셋 있었다. 곧 (1) 유산 계급, 즉 자작농과 상공업자, (2) 민족주의 청년, 주로 학생, (3) 서구 지향의 종교 집단이다. 처음부터 북조선인민위원회(North Korean Peoples' Committee)가 이룩하였다고 내세우는 정치·경제·사회 개혁은 이 잠재적 저항의 핵심을 없애는 데 정확히 겨냥되어 있었다. 토지개혁법(Land Reform Law)과 영업세(Business Tax)는 유산 계급의 실질적 몰수를 가져왔고, 그들을 38선(38th Parallel)을 넘어 남으로 몰려 내려가는 피난 반대자의 흐름에 보태었다. 내무국(Bureau of Internal Affairs) 아래 세워진 효율적인 경찰망이 매우 성공적으로 작동한 결과, 북조선의 주요 청년 단체였던 서북조선청년회(Northwest Korean Youth Association)는 미국 지대로 옮겨 갈 수밖에 없었고 이제 그 활동이 거의 오로지 38선 이남의 좌익에 대한 테러 행위에 국한되어 있다. 북조선의 개신교와 천주교 종교 집단은 민주주의민족전선에 사실상 흡수되었거나, 아니면 불법 단체로 선포되고 공포에 마비된 그 지도부가 가택 연금에 놓였다.\n\n입수 가능한 모든 증거는 소련이 자기 북조선인민위원회의 충성과 존속 능력을 신뢰할 만한 충분한 이유가 있음을 가리킨다. 이 정권이 소련 정책의 지시에 종속되어 있다는 점은, 소련에서 훈련받고 소련과 조선의 이중 국적을 가진 조선인들로 그 정권이 주의 깊게 「채워져(packed)」 있다는 사실로 보장된다. 나아가 북조선의 군사력은 소련의 지도 아래 주의 깊고 착실하게 발전되어, 적극적 작전이 개시된 뒤 심각한 지체 없이 조선 전역을 장악할 수 있는 수준에 이르렀다.\n\n비밀(SECRET) [원문 \"waeRET\"]\n\n북조선에서의 통제 공고화만큼 성공적이지는 못하였으나, 남조선에서 공산당 지하 조직의 강화도 소련의 낙관을 북돋울 만큼은 충분히 진척되었다. 애초의 「기본계획」에 따르면, 두 지대에서 공산 세력을 공고히 한 다음에는 남조선 우익과의 화해(rapprochement)를 향한 노력이 뒤따르게 되어 있었고, 그 결과로 가능한 한 좌측으로 기울어진 연립 정부를 세우기로 되어 있었다. 그러면 소련이 점령군 상호 철수를 제안할 것이고 미국은 그에 대해 정당하게 반대할 수 없을 터였다. 양측 병력이 철수한 뒤에는 남조선에서 공산주의자 도발 요원들이 「비상사태」를 만들어 내기로 되어 있었다. 북조선 무장 병력은 이 소요를 진압한다는 명목 아래 정부의 실효적 통제를 장악하고, 그리하여 조선 전역을 소련의 지배 아래 통일하는 과업을 완성하게 될 것이었다.\n\n그러나 사태는 이처럼 매끄러운 형태로 흘러가도록 허용되지 않았다. 화해 노력이 어떤 결실을 맺기까지 필요한 시간이 너무 길었고, 지연에 초조해진 미국이 더 공세적인 행동 노선에 나서면서 크렘린의 패를 강제로 드러내게 하는 쪽으로 작용하였기 때문이다.\n\n1947년 8월 11일, 마셜(Marshall) 국무장관은 몰로토프(Molotov) 외상에게 보낸 각서에서, 공동위원회에 경과 보고서를 내도록 요청하고 그것을 바탕으로 양국이 조선 독립을 앞당기는 데 필요한 조치를 협의하자고 제안하였다. 크렘린은 즉시 그 보고서 자체의 문제를 붙들고 늘어져 더 지연할 기회로 삼았다. 두 대표단이 불일치를 담은 공동 보고서조차 합의하지 못하리라는 것이 분명해지자, 러벳(Lovett) 국무장관 대리는 8월 26일 모스크바 협정 서명 4개국에 각서를 보내 9월 8일에 워싱턴에서 회의를 열자고 요청하였다. 소련은 9월 4일 이 요청을 거부하였는데, 크렘린은 미국의 다음 행보가 9월 17일에 소집될 예정인 유엔 총회 회기에 이 문제를 상정하는 것이 되리라는 점을 분명히 알고 있었을 것이다. 소련이 계속 지연할 또 하나의 기회를 이처럼 의도적으로 거부한 것은, 뒤의 사태에 비추어 보면, 크렘린이 조선에서의 자기 세력과 그 세력에 기초하여 구상하고 있던 대응 수에 대해 매우 자신하고 있어 더 이상 지연할 급박한 필요를 느끼지 않았다는 표시로 해석할 수 있다.\n\n9월 26일, 미국이 조선 문제를 유엔 총회 의제에 넣도록 공식 요청한 뒤, 공동위원회의 소련 대표단은 조선인들 「스스로」에 의한 통일 조선 정부 수립의 예비 조치로서 모든 점령군의 상호 철수를 제안하였다. 이처럼 그때까지의 소련 정책에 대한 미국의 대응이 소련의 작전 계획에 수정을 강요한 것으로 보인다. 크렘린의 선전 기구가 이 철수 제안을 열심히 뒤따라 밀고 나간 것은, 수락되리라고 예상하지는 않았지만 그 제안을 교란 전술로 써서 조선에서 화해 국면이 완료되고 그로써 철수에 대한 미국의 반대가 무너질 때까지 유엔 총회의 토의를 흐리고 어쩌면 늦추려 하였음을 분명히 보여 주었다.\n\n소련은 전 조선적 「연립」 정부 수립을 위한 노력을 미루지 않고 밀어붙였다. 1947년 10월 7일, 비교적 알려지지 않은 조선인 정치인 한 무리가 소련 대표단과 협의한 뒤 주조선 미군 G-2에 접근하여\n\n3    비밀(SECRET) [원문 \"3 PSPORD io\"]\n\n비밀(SECRET)\n\n통일 조선 정부 수립 방안을 제안하였다. 이 시도는 성공하지 못하였으나, 상호 철수 제안이 쳐 준 연막 아래에서 애초의 「기본계획」의 다음 목표를 확보하려는 소련의 시도를 뚜렷이 보여 주는 것이었다.\n\n11월 5일 유엔 총회 정치위원회가 미국이 제안한 결의를 통과시키면서, 철수 제안은 그 목적 가운데 또 하나를 이루지 못하게 되었다. 이 결의는 유엔 감시 아래 조선인 대표를 뽑는 전국 선거를 규정하였고, 그 대표들은 유엔 임시위원단(UN Temporary Commission)과 협의하기로 되어 있었다. 이 대표들은 이어 스스로 국회를 구성하여 국민 정부를 세우고, 점령국들과 협의하여 「가능하다면」 90일 안에 무장 병력의 철수를 마련하기로 되어 있었다.\n\n이 결의의 통과는 달라진 조건에 맞추어 유연한 소련의 작전 계획에 어느 정도 추가 수정을 요구할 것이다. 그러나 이 결의가 소련의 정책을 근본적으로 바꾸거나 그 실현을 실질적으로 위태롭게 하리라는 징후는 없다. 소련은 선전에서나 유엔에서의 공식 발언에서나 이 결의의 이행에 아무 역할도 하지 않겠다는 뜻을 충분히 내비쳤다. 사실상 이는 결의가 요구하는 선거를 감시할 목적으로 유엔 위원단이 소련 지대에 들어오는 것을 허용하지 않겠다는 뜻이다. 그러한 행동은 국제적으로나 조선 안에서나 조선 문제 전반에 관하여 소련을 뚜렷이 수세에 몰아넣을 것이다. 북조선 정권이 너무나 철저히 「민주적」이어서 유엔의 감독이 필요하지 않다는 소련의 주장은, 유엔의 기구를 통해 질서 있는 해결을 이루려는 미국의 성실한 시도 앞에서 아무런 무게도 갖지 못할 것이다. 소련이 도저히 사찰을 견딜 수 없는 정권에 대한 관찰을 의도적으로 막고 있다는 함의를 피할 수 없게 될 것이다.\n\n따라서 위와 같은 정황에서 소련이 북조선 점령을 계속하는 것은 사실상 유엔에 대한 의도적 도전 정책이 된다. 이 국면에서 크렘린이 내놓을 수 있는 어떤 선전용 몸짓도 조선 독립의 실현을 일방적으로 가로막았다는 오명을 그 어깨에서 벗겨 주지 못할 것이다. 게다가 소련 병력을 조선 땅에 계속 두는 것은 소련의 관점에서 미국의 남조선 점령 지속을 정당화해 준다는 가장 큰 불리함을 안는다. 소련의 이론가들이 이제 미국에서 예상되던 「전반적 자본주의 위기」가 무기한 미루어졌다고 시사한 것으로 보이므로, 그들은 조선에서 미국의 관여를 청산하도록 강제해 줄 이 기계장치 신(deus ex machina)의 등장을 더는 기대할 수 없다. 그러므로 북에서 소련의 점령이 계속되면 남에서 미국의 점령이 계속된다는 결과가 따라붙고, 그리하여 반도 전체에 대한 소련의 완전한 통제가 이루어지는 날은 무기한 미루어질 것이다. 이러한 상황은 소련이 가장 두려워하는 것으로 보이는 바로 그런 종류의 미국의 계획을 남조선에서 실시할 수 있게 해 줄 것이다. 곧 미국이 자기 보안 병력의 보호 아래 남조선에서 경제·문화·정치의 장기적 재건 계획에 착수할 수 있게 되고, 그것은 두 지대의 현지 주민에게 미국 체제와 소련 체제 각각의 성취와 잠재력을 나란히 놓고 견주어 볼 기회를 제공하는 효과를 낳을 것이다.\n\n4    비밀(SECRET) [원문 \"4 Sea\"]\n\n비밀(SECRET) [원문 \"Sera\"]\n\n크렘린이 계속 유지하는 것이 좋다고 볼 수 있는 정책으로서 소련의 점령 지속을 늘 염두에 두어야 하지만, 소련이 지금 취할 수 있는 수로서 주도권 회복을 약속하는 유일한 것은 북조선인민위원회를 북조선의 합법 정부로 선포한 뒤 점령군의 일방 철수를 명하는 것임이 분명하다. 이 선포에는 아마도 남조선에 대한 주권을 주장하는 북조선 정부의 요구를 인정하는 내용까지 들어갈 것이다. 유엔 주재 소련 대표단은 유엔 임시위원단이 「대표성 없는」 기구이고 그 결의는 「비민주적」이며 따라서 소련은 그 이행에 어떤 방식으로도 스스로를 구속하지 않겠다고 이미 밝혔다. 그러므로 소련은 결의 제4조 (c)항에 구속된다고 여기지 않을 것이다. 이 조항은 정당하게 선출된 국민 정부와 점령국들 사이에 합의가 이루어진 뒤에야 병력 철수가 이루어질 수 있다고 규정한다. 요컨대 소련의 관점에서 이 조항은 병력 철수에 아무런 법적 장애가 되지 않을 것이다. 이 철수에는 북조선의 소련 괴뢰 정권에 대하여 유엔 위원단의 진입을 어떤 대가를 치르더라도 막으라는 명령이 뒤따를 것이다. 이 정권의 독립을 법적으로 승인하는 것은 크렘린으로서 충분히 정당화할 수 있다. 크렘린은 미국이 조선 문제에서 유엔의 행동을 요구함으로써 모스크바 결정을 파기하였음을 보이는 데 공을 들여 왔기 때문이다.\n\n유엔 총회는 자기가 쓸 수 있는 병력이 없으므로, 그 위임을 수행하려 한다면 유일한 방도는 남조선의 미군에게 도움을 요청하는 것이 될 것이다. 그렇게 되면 미국은 중대한 정책 결정에 부딪히게 된다. 미군을 쓴다는 것은 사실상 북조선인민군(North Korean Peoples' Army)의 적극적 반대를 무릅쓰고 38선을 넘는 「침공」을 뜻하게 된다. 소련의 선전은 미국이 죄 없는 「민주적이고 애국적인」 조선인을 함부로 학살한다고, 그리고 유엔이 「주권」 국가의 내정에 부당하게 간섭한다고 어김없이 끊임없이 비난할 것이다. 크렘린은 미국의 그러한 노골적인 북조선 개입이 설령 유엔의 승인을 받는다 하더라도 매우 일어나기 어렵다고 보고 있을 것이다.\n\n소련은 아마도 미국이 조선의 항구적 분단을 불가피한 것으로 받아들이고 남에서 항구적 독립 정부를 세우기 위한 유엔 감시 선거를 진행하려 할 것이라고 판단할 것이다. 그러면 소련은 남에서 점령 반대 감정이 커져 미국이 조선의 유일한 점령국으로 있는 처지를 지탱할 수 없게 될 정도에 이르리라고 기대할 수 있다. 남조선에서 미국이 후원하는 어떠한 정치·경제 계획의 성공도 현지 주민의 반감 어린 태도로 위태로워질 것이다. 필요한 선동을 위하여 소련은 남조선 유권자의 약 30퍼센트를 이룬다고 추산되는 자기 지지자들에게만 기댈 수 있는 것이 아니라, 남조선 우익, 특히 이승만(Rhee Syngman)의 자기최면적 야심에도 기댈 수 있다. 이승만은 병력 상호 철수라는 소련의 제안에 처음에는 충격을 받았으나, 이미 미군 잔류 요청을 거두었고 미군이 철수하고 나면 자기가 북조선 사람들을 얼마든지 「다룰」 수 있다는 태도를 취해 왔다. 이승만과 다른 남조선 사람들이 이러한 망상을 계속 품고 있다는 것은 「연립」 노력이 수그러들지 않고 이어졌으며 가까운 장래에 더 강해지리라는 좋은 표시다. 미군이 철수한다면 북조선 정권은 이 태도를 교묘하게 이용하여\n\n5    비밀(SECRET) [원문 \"5 welt\"]\n\n비밀(SECRET) [원문 \"OER,\"]\n\n「연립」을 성사시키고 계획대로 남조선 지배로 나아가리라고 예상할 수 있다.\n\n「연립」의 전망이 좋지 않을 경우, 북조선인민위원회로서는 남조선 정부를 「대표성 없다」거나 「비민주적」이라고 낙인찍는 것이 비교적 간단한 일이 될 것이다. 남조선 좌익이 선거를 거부하였을 것이기 때문이다. 그러면 군사 침공은 남쪽의 「고통받는 동포」에 대한 「해방」이 될 것이다.\n\n요컨대 전술의 문제는 남조선에 대한 북조선의 지배가 미군 철수의 불가피한 결과가 되리라는 사실에 견주면 부차적일 뿐이다. 앞서 밝힌 대로 북조선에는 인민위원회의 매끄럽게 작동하는 통제 기구를 어떤 식으로든 흐트러뜨릴 수 있는 세력이 있다는 증거가 없다. 게다가 미군 철수 뒤 남조선에는 북으로부터의 종국적 지배에 실효 있게 저항할 수 있는 세력도, 세력의 연합도 없을 것이다. 우익 지도부는 독재적 지배에 너무나 외곬으로 매달려 있어, 독립 남조선 정부에서 그들이 권력을 잡고 나면 중도파는 좌익 진영에 합류할 것이다. 더구나 우익 지도부는 자기들 안에서조차 오래 협력하는 능력을 보인 적이 없다. 실제 권력이 그들 손에 들어오면 당파 내부의 균열이 벌어지고 그만큼 좌익이 이득을 보리라고 예상할 수 있다. 끝으로 미국이 미리 준비해 두지 않는다면, 지금 자기들끼리 다투고 있는 남조선의 우익 청년 단체와 경찰과 경비대는 북조선인민군 및 그것을 뒷받침하는 경찰과 경비대 조직에 맞설 어떤 종류의 실효 있는 대항 세력으로도 볼 수 없다.\n\n이러한 고려에 비추어, 또 소련의 철수 준비에 관한 최근 보고에 비추어, 유엔 결의가 정한 선거일인 1948년 3월 31일 이전 어느 시점에 소련이 위에 개괄한 전반적 정책의 이행 단계로서 북조선에서 자기 병력의 일방 철수를 명하리라고 예상하는 것이 합리적이다. 이 철수의 날짜를 어느 정도라도 확실하게 예측하는 것은 불가능하나, 유엔 임시위원단이 조선을 향해 곧 출발하는 것이 소련군을 조선 땅에서 빼내는 신호로 받아들여질 공산이 상당하다.\n\n미국 정부인쇄국(U. S. GOVERNMENT PRINTING OFFICE)\n1928—S—1947 [원문 그대로]", "secondary": "CENTRAL INTELLIGENCE AGENCY\n\nIMPLEMENTATION OF SOVIET OBJECTIVES IN KOREA\n\nORE 62 [원문 \"one62\"]    CIA HISTORICAL REVIEW PROGRAM\n18 November 1947    RELEASE IN FULL\n\nDocument [판독 불가]\nSECRET\n\n$0005 [원문 그대로]\n\nORE 62    [판독 불가]\n\n18 November 1947    Copy No. ___ [삭제]\n\nIMPLEMENTATION OF SOVIET OBJECTIVES IN KOREA\n\nSUMMARY\n\nSoviet tactics in Korea have clearly demonstrated that the USSR is intent on securing all of Korea as a satellite. In pursuing this policy, the USSR has, since V-J Day, adhered to a definite program of infiltration, consolidation, and control. US reaction to this policy has resulted in minor departures from the Soviet schedule of operations but has not forced any change in the fundamental strategy.\n\nSince the US proposal that a UN Commission be appointed to supervise elections for a permanent Korean Government has been accepted by the UNGA, it might appear that the Soviets, adamant against inspection of their zone, would be forced to continue their occupation. In consequence, US occupation would also have to be continued, and the day of full Soviet control would thus seem to be indefinitely postponed. The Soviets, however, making use of their contention that the US, by unilateral action in the UN, has already abrogated the Moscow agreement, could withdraw unilaterally. This they could afford because they can now rely on the powerful military and political machine they have built in the North to carry out their policies in their own physical absence. Under such circumstances, should the US wish to see the UNGA resolution implemented, it would presumably have to force entrance into North Korea, using military force against what the USSR would call an \"independent\" North Korea which was being ruthlessly trampled upon by an \"imperialistic\" nation. Similarly, any attempt by the US to act unilaterally in South Korea could be stigmatized as an unwarranted extension of the occupation for \"imperialistic\" ends, thus producing serious anti-US resentment among the South Koreans.\n\nUnilateral withdrawal, timed to take place prior to the arrival in Korea of the UN Commission, appears therefore to be an entirely probable Soviet tactic. If this step is taken, it will necessarily be accompanied by an order to the North Korean regime to resist at all costs the entry of the UN Commission into North Korea. It is probably the Soviet hope that in this situation the US will yield to pressure and withdraw its forces within a short period of time. Since no effective counterforce can be established by the US in South Korea without the investment of considerable effort over an extended period, US withdrawal would have the effect of leaving South Korea incapable of offering any serious resistance to eventual domination by the North.\n\nNote: This paper has been coordinated with the intelligence organizations of the Departments of State, Army, Navy, and Air Force.\n\n1    SECRET [원문 \"1 ena\"]\n\nIMPLEMENTATION OF SOVIET OBJECTIVES IN KOREA\n\nSoviet tactics in Korea since V-J Day have consistently and clearly indicated a firm intention to accept no settlement which would not insure the acquisition of Korea as a loyal Soviet satellite in the Far East. Details of an alleged Soviet \"Master Plan for Korea\" were compromised in mid-1946, and subsequent events tend to confirm the fact that the USSR has been following the essential outline of this \"Plan\" with minor divergencies necessitated by tactical considerations.\n\nOriginal plans apparently called for an extended breathing-space to be provided by the use of stalling tactics in the US-USSR Joint Commission. The purpose of this was to make certain that no Korean settlement should be forthcoming until a powerful military-political machine had been constructed in North Korea under Soviet auspices. This was to be accomplished by the strengthening of the South Korean Communist Party through an increase in the membership of the so-called Democratic Peoples' Front. The Communist Party itself was to go underground and mask its real strength by working through \"front\" organizations. It was also to concentrate on infiltrating its members into key positions in the administrative and police organization of South Korea.\n\nThe USSR was signally successful in accomplishing the first of these purposes. When the Soviet forces entered North Korea in 1945, there were three main groups in the population which were considered capable of offering any organized resistance to Sovietization. These were: (1) the propertied classes—peasant proprietors and businessmen, (2) nationalist youths, mainly students; and (3) religious groups with a Western orientation. From the outset, the vaunted political, economic, and social reforms accomplished by the North Korean Peoples' Committee have been specifically designed to eliminate this potential core of resistance. The Land Reform Law and the Business Tax have resulted in the actual expropriation of the propertied classes and added them to the stream of refugee dissidents swarming south over the 38th Parallel. The efficient police net established under the Bureau of Internal Affairs has functioned so successfully that the leading North Korean youth group, the Northwest Korean Youth Association, has been forced to move into the US Zone and is now almost solely confined in its activities to terroristic acts against Leftists south of the 38th Parallel. Protestant and Catholic religious groups in North Korea have either been effectively absorbed into the Democratic Peoples' Front or have been declared illegal and their terror-paralyzed leadership placed under house arrest.\n\nAll available evidence indicates that the USSR has every reason to be confident in the loyalty and survival-power of its North Korean Peoples' Committee. The subordination of this regime to the dicta of Soviet policy is assured by the fact that it has been carefully \"packed\" with Soviet-trained Koreans holding dual Soviet-Korean citizenship. Moreover, North Korean military forces have been carefully and soundly developed under Soviet guidance to the point where they are capable of taking over all of Korea without serious delay after the initiation of active operations.\n\nSECRET [원문 \"waeRET\"]\n\nAlthough not as successful as the consolidation of control in North Korea, the strengthening of the Communist underground in the South proceeded sufficiently well as to encourage Soviet optimism. According to the original \"Master Plan,\" consolidation of Communist strength in both zones was to be followed by efforts directed toward a rapprochement with the South Korean Rightists which was to result in the erection of a coalition government oriented as far to the Left as possible. The USSR would then have made a proposal for mutual withdrawal of occupying forces to which the US could have had no legitimate objection. Following the withdrawal of both forces, a \"state of emergency\" was to have been produced by Communist agents provocateurs in South Korea. The North Korean armed forces, under the guise of quelling these disturbances, would seize effective control of the government, thus completing the task of uniting all Korea under Soviet domination.\n\nDevelopments were not permitted to follow this smooth pattern, however, because the time required for the rapprochement effort to bear any fruit was too extended, and the US, growing restive at the delay, embarked on a more aggressive line of action which tended to force the Kremlin's hand.\n\nOn 11 August 1947, Secretary of State Marshall, in a note to Foreign Minister Molotov, suggested that the Joint Commission be requested to issue a report of progress on the basis of which the two powers would consult as to the steps necessary for the acceleration of Korean independence. The Kremlin promptly seized on the question of the report itself as an opportunity for further stalling. When it became clear that the two delegations would not be able to agree even on a joint report of disagreement, Acting Secretary of State Lovett, on 26 August, dispatched notes to the four signatories to the Moscow Agreement requesting a conference in Washington to meet 8 September. The USSR on 4 September rejected this request, although the Kremlin must have known that the next US move would involve presentation of the case to the UNGA Session scheduled to convene on 17 September. This deliberate rejection by the USSR of another opportunity for continued stalling may be interpreted, in the light of later events, as a sign that the Kremlin was so confident in its strength in Korea, and on the countermoves it was contemplating, based on this strength, that it no longer felt any urgent need for delay.\n\nOn 26 September, after the US had formally requested the inclusion of Korea on the UNGA agenda, the Soviet Delegation to the Joint Commission proposed mutual withdrawal of all occupying forces from Korea as a preliminary to the establishment of a unified Korean government by the Koreans \"themselves.\" Thus, US reaction to previous Soviet policy had apparently forced a revision in the Soviet plan of operations. The avidity with which the Kremlin's propaganda machinery followed up the withdrawal proposal clearly demonstrated that, although acceptance was not anticipated, the proposal would be employed as a diversionary tactic to obscure and perhaps delay UNGA discussion until the rapprochement phase was completed in Korea and US objections to withdrawal thereby overcome.\n\nThe USSR lost no time in pushing its efforts for creation of an all-Korean \"coalition\" government. On 7 October 1947, a group of relatively unknown Korean politicians approached G-2, US Armed Forces in Korea, after having conferred with the\n\n3    SECRET [원문 \"3 PSPORD io\"]\n\nSECRET\n\nSoviet Delegation, and proposed a plan for creation of a unified Korean Government. Although this effort was unsuccessful, it was a clear indication of a Soviet attempt to secure the next objective in the original \"Master Plan\" under the smoke screen provided by the proposal for mutual withdrawal.\n\nThe withdrawal proposal failed to achieve another of its purposes when on 5 November, the Political Committee of the UNGA passed a US-proposed resolution which provided for national elections, under UN observation, for Korean representatives who were to consult with a UN Temporary Commission. These representatives would then constitute themselves a National Assembly which would establish a National Government and, in consultation with the occupying powers, arrange for the withdrawal of armed forces within 90 days \"if possible.\"\n\nPassage of this resolution will necessitate certain further revisions in the flexible Soviet plan of operations to meet changed conditions. However, there is no indication that the resolution will basically alter Soviet policy or even materially jeopardize its fulfillment. The USSR has given ample indication, in both its propaganda and in official statements before the UN, that it will take no part in implementation of the resolution. In effect, this means that no UN Commission will be permitted to enter the Soviet Zone for the purpose of observing the elections called for in the resolution. Such action will put the USSR distinctly on the defensive in relation to the whole Korean problem, both internationally and within Korea itself. Its argument that the North Korean regime is so thoroughly \"democratic\" that no UN supervision is warranted, will not carry any weight in the face of a sincere US attempt to achieve an orderly solution through the machinery of the UN. The implication will be unavoidable that the Soviets are deliberately preventing observation of a regime which simply will not bear inspection.\n\nIt follows that continued Soviet occupation of North Korea under the above circumstances will constitute, in effect, a policy of deliberate defiance of the UN. No mere propaganda gesture that the Kremlin can make at this juncture will remove from its shoulders the onus of unilateral obstruction of the realization of Korean independence. In addition, retention of Soviet forces on Korean soil would have the prime disadvantage, from the Soviet viewpoint, of justifying continued US occupation of the South. Since Soviet theoreticians have now apparently indicated indefinite postponement of the anticipated \"general capitalist crisis\" in the US, they can no longer look for the appearance of this deus ex machina to force liquidation of US commitments in Korea. Thus continued Soviet occupation of the North would carry with it the corollary of continued US occupation of the South, with the consequence that the day of complete Soviet control of the whole peninsula would be indefinitely postponed. This situation would permit the institution in South Korea of precisely the sort of US program which the USSR seems to fear most. For it would enable the US, under the protection of its own security forces, to embark on a long-range program of economic, cultural, and political rehabilitation in South Korea, which would have the effect of offering to the native population of both zones a side-by-side comparison of the respective accomplishments and potentialities of the US and Soviet systems.\n\n4    SECRET [원문 \"4 Sea\"]\n\nSECRET [원문 \"Sera\"]\n\nAlthough continued Soviet occupation must always be kept in mind as a policy which the Kremlin may see fit to retain, it is clear that the one move that the USSR can now make which promises recapture of the initiative, is that of ordering a unilateral withdrawal of its occupying forces after declaring the North Korean Peoples' Committee the legal government of North Korea. This declaration will probably include recognition of the North Korean Government's claim to sovereignty over South Korea as well. The Soviet delegation to the UN has already stated that the UN Temporary Commission is an \"unrepresentative\" body, that the resolution is \"undemocratic,\" and that therefore the USSR will not commit itself in any way to its implementation. Hence, the USSR will not feel bound by Section 4 (c) of the resolution, which stipulates that troop withdrawals may take place only after arrangements have been made between the duly elected national government and the occupying powers. In short, from the Soviet viewpoint, this provision will constitute no legal obstacle to troop withdrawal. This withdrawal would be accompanied by an order to the Soviet puppet regime in North Korea to oppose at all costs the entry of the UN Commission. Legal recognition of the independence of this regime can be amply justified by the Kremlin, since it has been at pains to show that the US has abrogated the Moscow Decision in calling for UN Action in Korea.\n\nSince the UNGA has no forces at its disposal, its only recourse, should it seek to carry out its mandate, will be to request the aid of the US forces in South Korea. Should this occur, the US would be faced with a critical policy decision. Employment of US forces would necessitate, in effect, an \"invasion\" across the 38th Parallel against the active opposition of the North Korean Peoples' Army. Soviet propaganda would inevitably and incessantly charge the US with the wanton slaughter of innocent \"democratic and patriotic\" Koreans, while charging the UN with unwarranted interference in the internal affairs of a \"sovereign\" state. It is probable that the Kremlin considers such outright US intervention in North Korea highly unlikely, even if it should have UN sanction.\n\nThe USSR probably estimates that the US will accept the permanent division of Korea as inevitable and will attempt to proceed with a UN-supervised election for the establishment of a permanent independent government in the South. The USSR could then count on anti-occupation sentiment in the South to grow to such proportions as would make the US position as sole occupier of Korea untenable. The success of any US-sponsored politico-economic program in South Korea would be jeopardized by the antipathetic attitude of the native population. For the necessary agitation, the USSR could not only depend on its adherents, who constitute an estimated 30% of the South Korean electorate, but also on the auto-hypnotizing ambitions of the South Korean Rightists, particularly Rhee Syngman. The latter, after his initial shock at the Soviet proposal for mutual troop withdrawal, has already cancelled his plea for retention of US forces and has adopted the line that he is perfectly capable of \"handling\" the North Koreans once US forces are withdrawn. This persistent delusion on the part of Rhee and other South Koreans is good indication that \"coalition\" efforts have continued unabated and will be strengthened in the near future. Given the withdrawal of US forces, the North Korean regime can be expected astutely to capitalize on this atti-\n\n5    SECRET [원문 \"5 welt\"]\n\nSECRET [원문 \"OER,\"]\n\ntude, effect the \"coalition,\" and proceed with the domination of South Korea according to plan.\n\nShould the prospects for a \"coalition\" be unfavorable, it would be a relatively simple matter for the North Korean Peoples' Committee to brand the South Korean government \"unrepresentative\" and \"undemocratic\" since the South Korean Leftists will have boycotted the elections. Military invasion would thus constitute a \"liberation\" of the \"suffering countrymen\" in the South.\n\nIn short, the question of tactics is merely incidental to the fact that North Korean domination of the South will be an inevitable consequence of the US troop withdrawal. As has been indicated, there is no evidence of any force in North Korea capable of disrupting, in any way, the smooth functioning control-mechanism of the Peoples' Committee. In addition, following US withdrawal, there will be no force, or coalition of forces, in South Korea capable of effective resistance to eventual domination by the North. The rightist leadership is so single-mindedly bent on dictatorial control that following its accession to power in an independent South Korean government, the moderates would join the leftist camp. Moreover, the rightist leadership has displayed no capacity for extended cooperation even within its own ranks. As real power comes into its hands, intraparty cleavages can be expected to widen to the consequent advantage of the Left. Lastly, without previous US preparation, the South Korean rightist youth groups, police and constabulary, now warring among themselves, cannot be considered as any sort of effective counterforce to the North Korean People's Army and its supporting police and constabulary services.\n\nIn the light of these considerations, and in view of recent reports of Soviet preparations for withdrawal, it is reasonable to expect that some time before 31 March 1948, the election date stipulated in the UN resolution, the USSR will order the unilateral withdrawal of its forces from North Korea as a step in the implementation of the general policy outlined above. It is impossible to predict the date of this withdrawal with any degree of certainty, but there is a good chance that the imminent departure for Korea of the UN Temporary Commission may be taken as the signal for the removal of Soviet troops from Korean soil.\n\nU. S. GOVERNMENT PRINTING OFFICE\n1928—S—1947 [원문 그대로]", "notes": ["[삭제·공개 표시] CIA HISTORICAL REVIEW PROGRAM / RELEASE IN FULL (표지의 공개 승인 도장)", "[삭제·공개 표시] SECRET (표지와 각 면 머리·꼬리의 비밀 등급 도장. OCR 에서 waeRET, Sera, OER, welt, Sea 로 뭉개져 있다)", "[삭제·공개 표시] 표지의 문서 관리 줄 `Document “aotser ta Srnes”` 가 판독되지 않아 [판독 불가]로 옮겼다", "[삭제·공개 표시] 표지의 `ORE 62` 뒤에 붙은 표기 `Buca` 가 판독되지 않아 [판독 불가]로 옮겼다", "[삭제·공개 표시] `Copy No.___` 의 사본 번호 자리가 지워져 [삭제]로 옮겼다", "[삭제·공개 표시] 표지의 관리번호 `$0005` 는 원문 그대로 두었다", "[삭제·공개 표시] 이 문서에는 25X1 이나 (b)(6) 같은 면제 조항 표시가 없다. 전문 공개(RELEASE IN FULL) 처리된 문서다"], "note": "OCR 품질이 이 문서철에서 가장 좋다. 인쇄된 소책자를 스캔한 것이라 본문은 거의 온전하고, 뭉개진 곳은 표지의 관리 표기와 각 면의 SECRET 도장뿐이다. 본문에서 고친 것은 `Teforms`→`reforms`, `otcupation`→`occupation`, `progaganda`→`propaganda`, `dicussion`→`discussion`, `politiclans`→`politicians`, `38th Farallel`→`38th Parallel`, `asa`→`as a`, `constitute.no`→`constitute no` 정도의 낱말 뭉갬이다. 문서 날짜가 갈린다. 문서철 목록은 이 문서를 10월 2일자로 적었으나 표지와 속표지 모두 `18 November 1947` 로 찍혀 있다. 본문이 11월 5일 유엔 총회 정치위원회 표결을 이미 지난 일로 다루므로 11월 18일이 맞는다. 날짜는 고치지 않고 문서에 찍힌 대로 두었다. 표지에 `one62` 로 찍힌 것은 `ORE 62` 이나 문서번호이므로 고치지 않고 원문 표기를 함께 남겼다. 끝의 `1928—S—1947` 은 정부인쇄국 인쇄 번호이고 숫자를 고치지 않았다. 절 번호가 없는 문서다. 요약(SUMMARY)과 본문이 각각 번호 없는 문단으로 이어지고 부록이나 표는 없다. 각주는 요약 끝의 조정 부처를 밝힌 `Note` 한 줄뿐이라 그대로 옮겼다. 면 바뀜과 그 자리의 도장은 원문의 위치에 남겼다. 3면과 6면은 문장 도중에 넘어가므로 en 과 ko 모두 끊긴 채로 이어 붙였다. `Democratic Peoples' Front` 는 민주주의민족전선, `North Korean Peoples' Committee` 는 북조선인민위원회, `Bureau of Internal Affairs` 는 내무국, `Northwest Korean Youth Association` 은 서북조선청년회로 옮기되 원문 표기를 병기하였다. 오늘의 말로 바꾸지 않았다. `constabulary` 는 이 계열의 다른 문서와 맞추어 경비대로 옮겼다. 이 문서에는 지명이 38선 말고는 나오지 않아 조선 이름과 일본식 이름의 병기가 필요한 대목이 없다. 로마자로 적힌 조선말 이름도 `Rhee Syngman` 하나뿐이고 한자 병기가 붙어 있지 않다.", "warn": false, "search": "Marshall 마셜 (국무장관) Molotov 몰로토프 (소련 외상) Lovett 러벳 (국무장관 대리) Rhee Syngman 이승만 (남조선 우익 지도자) CIA HISTORICAL REVIEW PROGRAM / RELEASE IN FULL (표지의 공개 승인 도장) SECRET (표지와 각 면 머리·꼬리의 비밀 등급 도장. OCR 에서 waeRET, Sera, OER, welt, Sea 로 뭉개져 있다) 표지의 문서 관리 줄 `Document “aotser ta Srnes”` 가 판독되지 않아 [판독 불가]로 옮겼다 표지의 `ORE 62` 뒤에 붙은 표기 `Buca` 가 판독되지 않아 [판독 불가]로 옮겼다 `Copy No.___` 의 사본 번호 자리가 지워져 [삭제]로 옮겼다 표지의 관리번호 `$0005` 는 원문 그대로 두었다 이 문서에는 25X1 이나 (b)(6) 같은 면제 조항 표시가 없다. 전문 공개(RELEASE IN FULL) 처리된 문서다 Implementation of Soviet Objectives in Korea (ORE 62)"}, {"id": "N63", "order": 87, "date": "1947-11-18", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "정치 첩보: 북조선 오도행정국", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-11-18"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Political Information: North Korean Five Provinces Administration Bureau", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r001100090002-2"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r001100090002-2"}], "summary": "북조선 정부의 오도행정국이 무엇을 하는 기구인지 한 면으로 적었다. 소련군정과의 연락만 맡고 실제 행정 기능은 없다고 본다.", "points": ["오도행정국은 북조선 정부와 북조선 소련군정 당국 사이의 연락을 맡는다. 북조선 정부 안에서 실제 행정 기능은 없다고 적었다.", "구성은 국장과 각 도 인민위원회 위원장들, 그리고 소련인과 조선인 사무원·번역원·통역원 다수다.", "북조선에는 도가 여섯인데 이름은 오도다. 소련군정이 행정상 함경남도와 38선 이북 강원도를 한 개 도로 묶어 보았기 때문이라고 설명한다.", "국장은 CH'OE Yong-kon 최용건이다. 조선민주당 당원이고 소련군의 (? 명예?) 장군 계급을 가지고 있다고 적었다."], "primary": "이 문서는 미합중국 국립문서보관소장(Archivist of the United States) 앞으로 보낸 중앙정보국장(Director of Central Intelligence)의 [판독 불가] [판독 불가]78년 [문서]에 따라 이로써 기밀([CONFID]ENTIAL)로 등급이 조정되었다. 다음 재검토 일자(Next Review Date): 2008\n\n25X1\n\n이 문서는 미합중국의 국방에 관계된 정보로서 개정된 간첩법(Espionage Act 50, U.S.C. 31 및 32)의 적용을 받는 정보를 담고 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방법으로든 누설하는 것은 법으로 금지된다.\n\n기밀(CONFIDENTIAL)   25X1A\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가   조선(Korea)                            일자(DATE):  [판독 불가]\n                                             정보일(INFO.)\n25X1X\n주제   정치 첩보: 북조선 오도행정국(Political Information: North Korean Five Provinces Administration Bureau)   배포(DIST.) 1947년 11월 [판독 불가]일 (원문 `BY Hower 1947`)\n                                             면수  1\n출처(ORIGIN)  [판독 불가]   25X1A\n25X1X                                        보충(SUPPLEMENT)\n\n배포처(DISTRIBUTION)\n국무부(STATE) | 육군부(WAR) | 해군부(NAVY) | 법무부(JUSTICE) | R&E | CAD | [판독 불가]\n[표시 칸 판독 불가, `XX` 표시가 남아 있다]\n\n1. 북조선 정부(North Korean Government)의 「오도행정국(Five Provinces' Administration Bureau, O To Haeng Chane Euk [원문 그대로])」([한자 판독 불가])은 북조선 정부와 북조선의 소련군정 당국(Soviet Military Government authorities) 사이의 연락을 맡는다. 다만 북조선 정부 안에서 실제 행정 기능은 없다. 이 기구는 국장 한 사람과 각 도 인민위원회(People's Committee) 위원장들, 그리고 소련인과 조선인 사무원, 번역원, 통역원으로 이루어진 많은 직원으로 구성되어 있다.\n\n25X1A\n\n2. 북조선 정부에는 여섯 개 도가 있고 각 도에 저마다 인민위원회가 있으나, 이 기구를 「오도행정국」이라 부른다. 소련군정 당국이 행정상의 목적으로 함경남도(South Hamgyong, 일본식 Kankyo)와 38선 이북의 강원도(Kangwon, 일본식 Kogen) 부분을 한 개 도로 보아 왔기 때문이다.\n\n3. 국장은 CH'OE Yong-kon 최용건([한자 판독 불가])이다. 그는 조선민주당(Korean Democratic Party) 당원이며 소련군의 (? 명예?) 장군 계급을 가지고 있다.\n\n25X1\n\n다음 재검토 일자(Next Review Date): 2008\n\n기밀(CONFIDENTIAL)", "secondary": "This document is hereby regraded to [CONFID]ENTIAL in accordance with the [판독 불가] [판독 불가]78 from the Director of Central Intelligence to the Archivist of the United States. Next Review Date: 2008\n\n25X1\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act 50, U.S.C. 31 and 32, as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nCONFIDENTIAL   25X1A\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCOUNTRY   Korea                              DATE:  [판독 불가]\n                                             INFO.\n25X1X\nSUBJECT   Political Information: North Korean Five Provinces Administration Bureau   DIST. [판독 불가] November 1947 (원문 `BY Hower 1947`)\n                                             PAGES  1\nORIGIN  [판독 불가]   25X1A\n25X1X                                        SUPPLEMENT\n\nDISTRIBUTION\nSTATE | WAR | NAVY | JUSTICE | R&E | CAD | [판독 불가]\n[표시 칸 판독 불가, `XX` 표시가 남아 있다]\n\n1. The \"Five Provinces' Administration Bureau\" (O To Haeng Chane Euk) [원문 그대로] ([한자 판독 불가]) of the North Korean Government maintains liaison between the North Korean Government and the Soviet Military Government authorities in North Korea, but has no real administrative functions in the North Korean Government. It is composed of the head of the bureau and the chairmen of the various provincial People's Committees and a large staff of Soviet and Korean office workers, translators and interpreters.\n\n25X1A\n\n2. Although the North Korean Government has six provinces, each province having its own People's Committee, the bureau is called the \"Five Provinces' Administration Bureau\", because the Soviet Military Government authorities have, for administrative purposes, considered South Hamgyong (Kankyo) Province and that part of Kangwon (Kogen) Province north of the 38th parallel as one province.\n\n3. The head of the bureau is CH'OE Yong-kon ([한자 판독 불가]) who is a member of the Korean Democratic Party and holds the (? honorary?) rank of general in the Soviet Army.\n\n25X1\n\nNext Review Date: 2008\n\nCONFIDENTIAL", "notes": ["[삭제·공개 표시] This document is hereby regraded to CONFIDENTIAL … Next Review Date: 2008 (등급 재조정 도장. 글자가 흩어져 조각으로만 남아 있다)", "[삭제·공개 표시] 25X1, 25X1A, 25X1X (표제부와 1항 옆 여백에 반복해 찍힌 면제 표시)", "[삭제·공개 표시] DATE 칸과 ORIGIN 칸이 뭉개져 [판독 불가]로 옮겼다", "[삭제·공개 표시] DISTRIBUTION 표의 표시 칸을 읽을 수 없다. `XX` 자국만 남아 있다"], "note": "한 면짜리 짧은 보고다. 본문 세 항은 비교적 잘 읽히나 표제부와 도장이 흩어져 있다. 첫머리의 등급 재조정 도장은 스캔에서 글자가 여러 조각으로 흩어져 나와 조각을 이어 붙여 옮겼다. 연도는 `a78` 로만 남아 [판독 불가]78 로 두었다. 배포 일자는 `BY Hower 1947` 로 찍혀 달은 November 로 읽었으나 날짜의 숫자는 판독하지 않았다. 기구 이름의 로마자는 `O To Haeng Chane Euk` 으로 찍혀 있다. 오도행정국을 옮긴 것으로 보이나 로마자를 고치지 않고 원문대로 두었다. 한자가 뭉개져 [한자 판독 불가]로 두었다. 지명은 문서가 조선 이름과 일본식 이름을 나란히 적는다. `South Hameyong (Kankyo)` 와 `Kengwen (Kogen}` 의 철자를 South Hamgyong (Kankyo)·Kangwon (Kogen) 으로 바로잡고 둘 다 살렸다. `Korean Democratic Party` 는 조선민주당이다. 3항의 `(? honorary?)` 는 원문에 있는 물음표 표기라 그대로 두었다. 같은 문서철 N61 이 북조선에 있는 조선의용군 대리사령관을 `CH'OR Liu-chong` 으로 적는데 같은 사람인지는 이 문서만으로 확정되지 않는다.", "warn": false, "search": "CH'OE Yong-kon 최용건 (오도행정국장, 조선민주당 당원, 소련군 장군 계급) This document is hereby regraded to CONFIDENTIAL … Next Review Date: 2008 (등급 재조정 도장. 글자가 흩어져 조각으로만 남아 있다) 25X1, 25X1A, 25X1X (표제부와 1항 옆 여백에 반복해 찍힌 면제 표시) DATE 칸과 ORIGIN 칸이 뭉개져 [판독 불가]로 옮겼다 DISTRIBUTION 표의 표시 칸을 읽을 수 없다. `XX` 자국만 남아 있다 Political Information: North Korean Five Provinces Administration Bureau"}, {"id": "N64", "order": 88, "date": "1947-11-20", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "정치 첩보: 무크덴의 조선인거류민회", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-11-20"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Political Information: Korean Residents Association in Mukden", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r001100210002-8"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r001100210002-8"}], "summary": "무크덴 조선인거류민회(KRA)의 선출 방식과 1947년 8월 29일 현재의 임원 명단을 적고, 회장 YI Hoe-ch'ol 이 7월 28일 사임한 경위를 이어 붙였다.", "points": ["임원은 무크덴의 조선인 26개 구역 대표가 뽑는다. 만 16세 이상 조선인 100명마다 대표 한 사람을 뽑고 현재 대표는 145명이다.", "1947년 8월 29일 현재 회장은 KIM Tong-u 다. 총무·재무·호적·사회·교육·산업·농무·상무 여덟 부의 부장과 차장 명단이 붙는다.", "YI Hoe-ch'ol 은 7월 28일 사임하며 네 가지 까닭을 든다. 조선인들과의 협력난, 모금난, 조선인산업개발협회(KIDA) 수익을 쓴 일, 그리고 농민 지원금 배분에 대한 한교사무처의 조사 위협이다.", "무크덴 조선인이 바라는 송환이 더디고 회장의 처신 탓에 중국인이 조선인에게서 멀어졌다고 여긴다.", "회원은 다달이 NEC$500 을 내기로 되어 있었으나 일자리와 작황이 나빠 부담이 부유한 소수에게 쏠린다.", "주석 동북행원 한교사무처가 봄 파종 자금 MEC $4,000,000 을 주었다. YI 가 지정된 구역을 따르지 않고 제 판단대로 나누었는데 7월 말 그 구역들이 물에 잠겨 돈이 헛되이 쓰였다.", "조선자위군 참모장교 CH'OE Sok-ch'on 의 공개 비판이 사임을 밀어붙인다. KRA 가 단오절에 조선자위군을 대접한다며 걷은 자금과 식량의 처분이 문제가 된다."], "primary": "이 문서는 [판독 불가]에 관한 정보를 담고 있다. 권한 없는 자에게 그 내용을 어떤 방법으로든 누설하는 것은 법으로 금지된다.\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n\n국가   중국(China)                            일자(DATE):\n                                             정보일(INFO.)\n주제   정치 첩보: 무크덴의 조선인거류민회(Political Information: Korean Residents Association in Mukden)   배포(DIST.) 1947년 11월 [판독 불가]일 (원문 `Bovember 1947`)\n                                             면수  2\n출처(ORIGIN)  아래 참조(see below)             보충(SUPPLEMENT)\n25X1\n\n[판독 불가]57R001100210002-8   25X1\n\n배포처(DISTRIBUTION)\n국무부(STATE) | 육군부(WAR) | 해군부(NAVY) | 법무부(JUSTICE) | R&E | CAD\n[표시 칸 판독 불가]   25X1\n\n문서번호(Document No.) [판독 불가]\n등급 변경 없음(No CHANGE in Class.) [ ]\n[ ] 비밀해제(DECLASSIFIED)\n등급 변경(Class. CHANGED TO): TS\nDDA Memo, 1977년 4월 4일\nDDA REG. 77/176\n등급(CLASSIFICATION) 기밀(CONFIDENTIAL)\n\n공개 승인(Approved For Release) [판독 불가] : [판독 불가]457R001100210002-8\n\n1. 무크덴(Mukden 봉천)의 조선인거류민회(Korean Residents Association, KRA)([한자 판독 불가]) 임원은 무크덴의 조선인 26개 구역에서 나온 대표들이 뽑는다. 만 16세 이상 조선인 100명마다 대표 한 사람을 뽑는다. 현재 대표는 145명이다.\n\n25X1\n\n2. 1947년 8월 29일 현재, YI Hoe-ch'ol 이 사임한 뒤 KRA 의 새 임원과 편제는 다음과 같다.\n\n회장(Chairman):                 KIM Tong-u([한자 판독 불가]). 전에 YI Hoe-ch'ol 아래에서 부회장이었다\n부회장(Vice Chairman):          YI Yon-hyin [원문 그대로]([한자 판독 불가])\n서기(Secretary):                SO Yong-kyu([한자 판독 불가])\n\n총무부(General Affairs Department)\n  부장:                         YI Son-haeng([한자 판독 불가])\n  차장:                         HO Pyong-mun([한자 판독 불가])\n  차장:                         CHANG Pyong-ch'il([한자 판독 불가])\n\n재무부(Finance Department)\n  부장:                         YIM Yong-hi([한자 판독 불가]) (여성)\n  차장:                         PAK Song-yol([한자 판독 불가])\n\n호적부(Census and Registration Department)\n  부장:                         KIM Kwan-hae([한자 판독 불가])\n  차장:                         KIM Pyong-no([한자 판독 불가])\n\n사회부(Social Affairs Department)\n  부장:                         PAK Pyon-myong([한자 판독 불가])\n\n교육부(Education Department)\n  부장:                         IM Yong-ho([한자 판독 불가])\n\n[REFERENCE CENTER 도장, 판독 불가]\n\n———\n\n25X1   [판독 불가]001100210002-8   25X1\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n-2-   [판독 불가] (원문 `129744.`)\n\n산업부(Industrial Affairs Department)\n  부장:                         CHANG Yong-mun([한자 판독 불가])\n\n농무부(Agricultural Affairs Department)\n  부장:                         PYON Kil-sun([한자 판독 불가])\n\n상무부(Commercial Affairs Department)\n  부장:                         CHO Pyong-ryop([한자 판독 불가])\n\n25X1  3. 1947년 7월 28일 YI Hoe-ch'ol([한자 판독 불가])이 무크덴 KRA 회장직에서 사임하였다. 그는 사임의 까닭으로 다음을 들었다.\n\n가. 무크덴 일대의 조선인들과 협력하기가 갈수록 어려워졌다.\n\n나. KRA 를 유지할 자금을 걷는 데 재정상의 어려움이 있다.\n\n다. 조선인산업개발협회(Korean Industrial Development Association, KIDA)를 운영하면서 YI 가 그 수익을 쓴 일이 곤란하게 되었다.\n\n라. 중국인들이 무크덴 일대의 조선인 농민에게 준 자금의 배분을 두고, 주석 동북행원(President's Northeast Field Headquarters, 지금의 NEPH) 한교사무처(Korean Administration Department)가 조사에 들어가겠다고 위협하였다.\n\n4. 무크덴 일대의 조선인들은 KRA 에 협조하지 않고 있다. KRA 가 그 지역 조선인 대다수에게 이로운 성과를 보이지 못했기 때문이다. 무크덴의 조선인들이 바라는 송환은 더디게 진행되었고, 회장 YI 의 처신 때문에 중국인들이 조선인에게서 멀어졌다고들 여긴다.\n\n5. KRA 가 생긴 뒤로 무크덴의 조선인은 각자 KRA 유지를 위해 다달이 NEC$500 [원문 그대로]씩 내기로 되어 있었다. 일자리가 없고 작황이 나빠 조선인 대다수에게 이 부담은 어려운 것이 되었다. 유지 부담은 주로 그 지역의 몇 안 되는 부유한 조선인에게 얹혔다.\n\n6. 주석 동북행원 한교사무처는 YI 에게 MEC $4,000,000 [원문 그대로]을 주었다. 무크덴 일대의 조선인 농민에게 나누어 주어 봄 파종을 돕게 할 돈이었다. 사무처는 어느 구역을 지원할지와 구역마다 얼마를 줄지를 정해 두었다. YI 는 이 조건에 동의하지 않고, 자기가 보기에 가장 이로운 결과를 낼 것 같은 구역에 돈을 나누어 주었다. 1947년 7월 마지막 두 주 동안 YI 가 자금을 나누어 준 구역들이 물에 잠겨 농작물이 못 쓰게 되었고 [판독 불가]4,000,000 [원문 그대로]은 헛되이 쓰였다. YI 는 사무처가 준 자금의 배분을 중국인들이 조사하여 자기를 물러나게 만들기 전에 스스로 사임하는 것이 결국 그 지역 조선인에게 이롭다고 여긴다.\n\n25X1\n\n7. YI 의 사임은 YI 가 이끌던 KRA 와 KIDA 사이에 계속된 마찰의 결과였다. KIDA 는 조선인 실업가와 상인 다수가 뒷받침하고 있다. KRA 가 중국 단오절(Chinese May Festival)에 조선자위군(Korean Self Defense Army)을 대접한다며 걷은 자금과 식량의 처분이 미심쩍었던 탓에 YI 는 부정을 저질렀다는 의심을 받았다.\n\n8. 조선자위군 참모장교 CH'OE Sok-ch'on([한자 판독 불가])이 YI 아래 있던 이전 KRA 집행부를 공개적으로 비판하였다. 이 비판이 YI 를 사임하게 만드는 데 큰 몫을 하였다.\n\n기밀(CONFIDENTIAL)   25X1\n25X1\n\n[REFERENCE CENTER 도장, 판독 불가]\n\n공개 승인 [판독 불가] : [판독 불가]457R001100210002-8", "secondary": "This document contains information [판독 불가] the revelation of its contents in any manner to an unauthorized person is prohibited by law.\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n\nCOUNTRY   China                              DATE:\n                                             INFO.\nSUBJECT   Political Information: Korean Residents Association in Mukden   DIST. [판독 불가] November 1947 (원문 `Bovember 1947`)\n                                             PAGES  2\nORIGIN  see below                            SUPPLEMENT\n25X1\n\n[판독 불가]57R001100210002-8   25X1\n\nDISTRIBUTION\nSTATE | WAR | NAVY | JUSTICE | R&E | CAD\n[표시 칸 판독 불가]   25X1\n\nDocument No. [판독 불가]\nNo CHANGE in Class. [ ]\n[ ] DECLASSIFIED\nClass. CHANGED TO: TS\nDDA Memo, 4 Apr 77\nDDA REG. 77/176\nCLASSIFICATION CONFIDENTIAL\n\nApproved For Release [판독 불가] : [판독 불가]457R001100210002-8\n\n1. Officers of the Korean Residents Association (KRA) ([한자 판독 불가]) in Mukden are elected by representatives from the twenty-six Korean districts in Mukden. One representative is selected for every 100 Koreans over 16 years of age. At present there are 145 representatives.\n\n25X1\n\n2. As of 29 August 1947, the new officers and organization of the KRA after the resignation of YI Hoe-ch'ol were as follows:\n\nChairman:                       KIM Tong-u ([한자 판독 불가]), formerly Vice Chairman under YI Hoe-ch'ol\nVice Chairman:                  YI Yon-hyin [원문 그대로] ([한자 판독 불가])\nSecretary:                      SO Yong-kyu ([한자 판독 불가])\n\nGeneral Affairs Department\n  Chairman:                     YI Son-haeng ([한자 판독 불가])\n  Assistant:                    HO Pyong-mun ([한자 판독 불가])\n  Assistant:                    CHANG Pyong-ch'il ([한자 판독 불가])\n\nFinance Department\n  Chairman:                     YIM Yong-hi ([한자 판독 불가]) (Miss)\n  Assistant:                    PAK Song-yol ([한자 판독 불가])\n\nCensus and Registration Department\n  Chairman:                     KIM Kwan-hae ([한자 판독 불가])\n  Assistant:                    KIM Pyong-no ([한자 판독 불가])\n\nSocial Affairs Department\n  Chairman:                     PAK Pyon-myong ([한자 판독 불가])\n\nEducation Department\n  Chairman:                     IM Yong-ho ([한자 판독 불가])\n\n[REFERENCE CENTER 도장, 판독 불가]\n\n———\n\n25X1   [판독 불가]001100210002-8   25X1\n\nCENTRAL INTELLIGENCE GROUP\n\n-2-   [판독 불가] (원문 `129744.`)\n\nIndustrial Affairs Department\n  Chairman:                     CHANG Yong-mun ([한자 판독 불가])\n\nAgricultural Affairs Department\n  Chairman:                     PYON Kil-sun ([한자 판독 불가])\n\nCommercial Affairs Department\n  Chairman:                     CHO Pyong-ryop ([한자 판독 불가])\n\n25X1  3. On 28 July 1947 YI Hoe-ch'ol ([한자 판독 불가]) resigned as chairman of the KRA in Mukden. He gave the following as his reasons for resigning:\n\na. It has become increasingly difficult to cooperate with Koreans in the Mukden area.\n\nb. Financial difficulty of soliciting funds for the support of the KRA.\n\nc. The embarrassing use of profits by YI resulting from the operation of the Korean Industrial Development Association (KIDA).\n\nd. The threat of an investigation by the Korean Administration Department of the President's Northeast Field Headquarters (now NEPH) of the allocation of funds provided by the Chinese to Korean farmers in the Mukden area.\n\n4. The Koreans in the Mukden area have not been cooperating with the KRA because the KRA has not shown results beneficial to the majority of the Korean people in the area. Repatriation, which is desired by the Koreans in Mukden, has proceeded slowly and it is felt that the Chinese have been alienated from the Koreans by the actions of Chairman YI.\n\n5. Since the inception of the KRA each Korean in Mukden was supposed to contribute NEC$500 [원문 그대로] per month for the support of the KRA. The lack of employment and the poor crops have made the contribution difficult for the majority of the Koreans. The burden of support has rested mainly on the few wealthy Koreans in the area.\n\n6. The Korean Administration Department of the President's Northeast Field Headquarters gave YI MEC $4,000,000 [원문 그대로] which was to be allocated to the Korean farmers in the Mukden area to support the spring planting. The Department stipulated the districts which were to be supported and the amount to be given each district. YI did not agree with these stipulations and allocated the money to the districts he believed would produce the most beneficial results. During the last two weeks in July 1947 the districts to which YI distributed the funds were flooded, the crops ruined and the [판독 불가]4,000,000 [원문 그대로] wasted. YI believes that his resigning before the Chinese force him to do so by investigating the distribution of the Department's funds given him will ultimately benefit the Koreans in the area.\n\n25X1\n\n7. YI's resignation was the result of continuous friction between the KRA under YI's administration and the KIDA which is supported by many Korean businessmen and merchants. Because of the questionable disposition of funds and food collected by the KRA for the entertainment of the Korean Self Defense Army at the Chinese May Festival, YI was suspected of corruption.\n\n8. CH'OE Sok-ch'on ([한자 판독 불가]), a staff officer of the Korean Self Defense Army, publicly criticized the former KRA administration under YI. This criticism did much to force YI's resignation.\n\nCONFIDENTIAL   25X1\n25X1\n\n[REFERENCE CENTER 도장, 판독 불가]\n\nApproved For Release [판독 불가] : [판독 불가]457R001100210002-8", "notes": ["[삭제·공개 표시] Approved For Release … 457R001100210002-8 (각 면의 formation: Korean Residents Association in Mukden"}, {"id": "N65", "order": 89, "date": "1947-11-28", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "정치 첩보: 중국공산당·소련과 연결된 조선인 조직과 인물", "badge": "confidential control (U.S. ONLY)", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-11-28"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Political Information: Korean Organizations and Personalities with Chinese Communist and Soviet Connections", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r001100370003-0"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r001100370003-0"}], "summary": "소련군이 무크덴(Mukden 봉천)을 점령한 동안 그곳에서 만들어진 조선인 단체 다섯과 그 주요 인물의 이름을 적었다. 국민당군이 들어온 뒤 단체가 해산되고 사람들이 흩어진 경과가 뒤에 붙는다.", "points": ["소련군 점령기의 무크덴에서 청년단(Youth Corps), 조선해방동맹(Korean Emancipation League), 독립동맹(Independence League), 중소한친선협회(Sino-Soviet-Korean Friendship Association), 여자청년단(Women's Youth Corps)이 생긴다.", "다섯 단체 모두 무크덴의 조선인 공산주의자가 만들고 후원했으며 점령 중의 중국공산당·소련군과 긴밀히 연락했다고 적었다.", "중소한친선협회 회원 가운데 다른 단체에서도 앞장선 인물로 CH'A Il-p'yong, CHON Nung-il, CH'OE Min-san, CH'OE Sun, YI Tong-kkyan 을 든다. 지금 있는 곳이 퉁화(Tunghua)이거나 북조선이다.", "협회 회원만으로 확인된 사람 가운데 YI Sang-tae 는 북조선인민위원회 정보부의 책임자였거나 그곳에서 일했을 수 있다고 적었다.", "중소한친선협회가 정치 활동과 선전의 도구로 인민시보(The People's Times)를 냈다. 주필의 이름은 뒤 음절만 남고 지워졌다.", "국민당군이 무크덴을 점령한 뒤 단체들이 해산되고 일부는 북조선으로, 일부는 중국공산당 지역으로 갔으며 일부는 지하로 들어간다.", "무크덴에 남아 지하로 들어간 인물 열한 명의 이름과 청년단에서 맡았던 자리를 적었다. 청년단 기관지 청년단신문(Youth Corps News)의 주필과 기자가 여럿 들어 있다."], "primary": "출처(ORIGIN)\n\n공개 승인 [판독 불가] : [판독 불가]R001100370003-0 [원문 심하게 뭉개짐]\n\n29X1 [원문 그대로]  25X1 b\n\n기밀 통제(CONFIDENTIAL CONTROL)\n미국 전용(U.S. ONLY)\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n첩보보고(INTELLIGENCE REPORT)\n25X11\n\n국가   중국(China)                                        일자:\n                                                          정보일(INFO.)\n주제   정치 첩보: 중국공산당·소련과 연결된 조선인 조직과      배포(DIST.) [판독 불가]\n       인물\n                                                          면수  3\n\n                                                          보충(SUPPLEMENT)\n\n2. [원문 그대로 — 문단 번호가 본문과 어긋난 자리에 찍혀 있다]\n\n소련군이 무크덴(Mukden 봉천(奉天))을 점령하고 있는 동안 조선인 정치 단체와 협회들이 조직되었고, 다음의 조직들이 나타났다.\n\n청년단(The Youth Corps)([한자 판독 불가])\n\n조선해방동맹(The Korean Emancipation League)([한자 판독 불가])\n\n독립동맹(The Independence League)([한자 판독 불가])\n\n중소한친선협회(The Sino-Soviet-Korean Friendship Association)([한자 판독 불가])\n\n여자청년단(The Women's Youth Corps)([한자 판독 불가])\n\n이 조직들은 모두 무크덴의 조선인 공산주의자들이 조직하고 후원한 것이며, 중국공산당 및 소련군이 무크덴을 점령하고 있는 동안 그들과 긴밀한 연락을 유지하였다.\n\n다음의 인물들은 모두 중소한친선협회 회원이며, 자신이 속한 다른 조직들에서 가장 활발한 정치 지도자였다.\n\nCH'A Il-p'yong 차일평(?)([한자 판독 불가]), 조선해방동맹 지도자. 현재 퉁화(Tunghua 통화(通化)) (125-57, 41-41) 일대에 있다.\n\nCHON Nung-il 전능일(?)([한자 판독 불가]), 독립동맹 지도자. 현재 북조선에 있다.\n\nCH'OE Min-san 최민산(?)[원문 `CH'OE Minesan`]([한자 판독 불가]), 청년단 단장. 현재 퉁화 일대에 있다.\n\nCH'OE Sun 최순(?)[원문 `GH'GE Sun`]([한자 판독 불가]), 청년단 단원. 현재 북조선에 있다.\n\nYI Tong-kkyan([한자 판독 불가]), 청년단 단원. 현재 북조선에 있다.\n\n다음의 인물들은 중소한친선협회 회원이었다. 위에 보고한 동맹과 단체들에도 함께 속하였는지는 알려지지 않았다.\n\nCH'OE Yon-sik 최연식(?)([한자 판독 불가]). 현재 인천(Inch'on 인천(仁川)) (126-38, 37-28)에 있다.\n\n25X11\n\n등급 변경 없음(NO CHANGE in Class.) [X]\n[ ] 비밀해제(DECLASSIFIED)\n등급 변경(Class. CHANGED TO): TS S [판독 불가]\nDDA 각서(Memo), 1977년 4월 4일\n근거(Auth): DDA REG. 77/1763\n\n공개 승인 [판독 불가]\n\n29X1 [원문 그대로]\n\n[판독 불가]R001100370003-0 [공개 승인 도장, 뭉개짐]\n\n등급 구분(CLASSIFICATION)   기밀 통제(CONFIDENTIAL CONTROL)   미국 전용(U.S. ONLY)\n\n문서번호(Document No.) 66 [원문 그대로]\n\n25X1\n\n공개 승인 [판독 불가] : [판독 불가]R001100370003-0 [원문 심하게 뭉개짐]\n\n미국 전용(U.S. ONLY)   25X1A [원문 `25X14`]\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\nKIM Sung-won 김승원(?)([한자 판독 불가]). 현재 서울의 Chukch'an Jong [원문 그대로] 구역에 있다.\n\nYUN Song-ho 윤성호(?)([한자 판독 불가]). 현재 북조선에서 관리로 있다.\n\nYI Sang-tae 이상태(?)([한자 판독 불가]). 한때 북조선인민위원회(North Korea People's Committee) 정보부(Intelligence Department)의 책임자였거나 그곳에서 일했을 수 있다.\n\n[판독 불가]([한자 판독 불가])\n\n25X1\n\n25X1\n\n[판독 불가]ongyan. [판독 불가]\n\n25X1\n\n4. 중소한친선협회는 인민시보(The People's Times)([한자 판독 불가])를 냈으며, 이 신문은 정치 활동과 선전의 도구였다.\n\n25X1\n\n[판독 불가]won 이 주필(Chief Editor)이었다.\n\n25X1\n\n5. 중국 국민당군이 무크덴을 점령한 뒤 위에 적은 조직들은 해산되었다. 회원 가운데 일부는 북조선으로 갔고, 일부는 중국공산당 점령 지역으로 간 것으로 보이며, 일부는 지하로 들어갔다.\n\n6. 다음은 위에 적은 조직들에 한때 속했던 인물들로서, 지하로 들어가 아직 무크덴 일대에 남아 있는 자들이다.\n\n[판독 불가] Ho-yong([한자 판독 불가]), 전 청년단신문(Youth Corps News) 주필.\n\nKIM Chong-sik 김정식(?)([한자 판독 불가]), 전 청년단 지도자.\n\nCHONG Won-ha 정원하(?)[원문 `CHONG vion-ha`]([한자 판독 불가]), 전 청년단신문 편집자.\n\nKIM Ch'am([한자 판독 불가]), 전 청년단신문 기자. 현재 동북조선신문(Northeast Korean News) 기자.\n\nY[판독 불가] Hyo-suk([한자 판독 불가]), 전 여자청년단(Women's Youth Corps)([한자 판독 불가]) 단장.\n\nKIM Sang-kon 김상곤(?)[원문 `KIN Sang~kon`]([한자 판독 불가]), 전 청년단 단원.\n\nCH'A Song-um[원문 `CHYA Song=um`]([한자 판독 불가]), 전 청년단 단원.\n\nCHO Sung-ok 조승옥(?)[원문 `CHO Sing~ok`]([한자 판독 불가]), 전 청년단 부단장.\n\nCHONG Tae-kon[원문 `CHONG. Tae<keSn`]([한자 판독 불가]), 현 청년단 부단장이며 무크덴의 한 지하 조직 지도자.\n\nCHU Hao-sok([한자 판독 불가]), 전 청년단 단원.\n\n[판독 불가], 전 청년단 단원.\n\n이 문서는 미합중국의 국방에 관계된 정보로서 개정된 간첩법(Espionage Act, 50, U.S.C. 31 및 32)의 적용을 받는 정보를 담고 있다. 권한 없는 자에게 이 문서를 전달하거나 그 내용을 어떤 방법으로든 누설하는 것은 법으로 금지된다.\n\n기밀 통제(CONFIDENTIAL CONTROL)\n미국 전용(U.S. ONLY)\n25X11\n\n공개 승인 [판독 불가] : [판독 불가]R001100370003-0 [원문 심하게 뭉개짐]", "secondary": "ORIGIN\n\nApproved For Re[판독 불가] : [판독 불가]R001100370003-0 [원문 심하게 뭉개짐]\n\n29X1 [원문 그대로]  25X1 b\n\nCONFIDENTIAL CONTROL\nU.S. ONLY\n\nCENTRAL INTELLIGENCE GROUP\n\nINTELLIGENCE REPORT\n25X11\n\nCOUNTRY   China                                             DATE:\n                                                            INFO.\nSUBJECT   Political Information: Korean Organizations and    DIST. [판독 불가]\n          Personalities with Chinese Communist and Soviet\n          Connections                                        PAGES  3\n\n                                                             SUPPLEMENT\n\n2. [원문 그대로 — 문단 번호가 본문과 어긋난 자리에 찍혀 있다]\n\nDuring the occupation of Mukden by Soviet troops, Korean political groups and associations were organized, and the following organizations emerged:\n\nThe Youth Corps ([한자 판독 불가])\n\nThe Korean Emancipation League ([한자 판독 불가])\n\nThe Independence League ([한자 판독 불가])\n\nThe Sino-Soviet-Korean Friendship Association ([한자 판독 불가])\n\nThe Women's Youth Corps ([한자 판독 불가])\n\nAll these organizations were organized and sponsored by Korean Communists in Mukden and maintained close liaison with the Chinese Communists and the Soviet armies during their occupation of Mukden.\n\nThe following personalities, all members of the Sino-Soviet-Korean Friendship Association, were the most active political leaders in the other organizations of which they were members:\n\nCH'A Il-p'yong ([한자 판독 불가]), leader of the Korean Emancipation League; at present in the Tunghua (125-57, 41-41) area.\n\nCHON Nung-il ([한자 판독 불가]), leader of the Independence League; at present in North Korea.\n\nCH'OE Min-san [원문 `CH'OE Minesan`] ([한자 판독 불가]), chief of the Youth Corps; in the Tunghua area at present.\n\nCH'OE Sun [원문 `GH'GE Sun`] ([한자 판독 불가]), a member of the Youth Corps; at present in North Korea.\n\nYI Tong-kkyan ([한자 판독 불가]), a member of the Youth Corps; at present in North Korea.\n\nThe following personalities were members of the Sino-Soviet-Korean Friendship Association; it is not known whether they were also members of the leagues and groups reported above.\n\nCH'OE Yon-sik ([한자 판독 불가]); at present in Inch'on (126-38, 37-28).\n\n25X11\n\nNO CHANGE in Class. [X]\n[ ] DECLASSIFIED\nClass. CHANGED TO: TS S [판독 불가]\nDDA Memo, 4 Apr 77\nAuth: DDA REG. 77/1763\n\nApproved For Re[판독 불가]\n\n29X1 [원문 그대로]\n\n[판독 불가]R001100370003-0 [공개 승인 도장, 뭉개짐]\n\nCLASSIFICATION   CONFIDENTIAL CONTROL   U.S. ONLY\n\nDocument No. 66 [원문 그대로]\n\n25X1\n\nApproved For Re[판독 불가] : [판독 불가]R001100370003-0 [원문 심하게 뭉개짐]\n\nU.S. ONLY   25X1A [원문 `25X14`]\n\nCENTRAL INTELLIGENCE GROUP\n\nKIM Sung-won ([한자 판독 불가]); at present in the Chukch'an Jong [원문 그대로] district of Seoul.\n\nYUN Song-ho ([한자 판독 불가]); at present a government official in North Korea.\n\nYI Sang-tae ([한자 판독 불가]); may at one time have been the head of or a worker in the Intelligence Department of the North Korea People's Committee.\n\n[판독 불가] ([한자 판독 불가])\n\n25X1\n\n25X1\n\n[판독 불가]ongyan. [판독 불가]\n\n25X1\n\n4. The Sino-Soviet-Korean Friendship Association published The People's Times ([한자 판독 불가]) which was an instrument of political activity and propaganda.\n\n25X1\n\n[판독 불가]won was the Chief Editor.\n\n25X1\n\n5. After the Chinese Nationalist Army occupied Mukden, the organizations described above were dissolved; some of the members went to North Korea, some possibly into Chinese Communist-held territory, and some went underground.\n\n6. The following are personalities, at one time members of the organizations mentioned above, who have gone underground and still remain in the Mukden area:\n\n[판독 불가] Ho-yong ([한자 판독 불가]), former Chief Editor of the Youth Corps News.\n\nKIM Chong-sik ([한자 판독 불가]), former leader of the Youth Corps.\n\nCHONG Won-ha [원문 `CHONG vion-ha`] ([한자 판독 불가]), former editor of the Youth Corps News.\n\nKIM Ch'am ([한자 판독 불가]), formerly a reporter for the Youth Corps News; now a reporter for the Northeast Korean News.\n\nY[판독 불가] Hyo-suk ([한자 판독 불가]), formerly Chief of the Women's Youth Corps ([한자 판독 불가]).\n\nKIM Sang-kon [원문 `KIN Sang~kon`] ([한자 판독 불가]), former member of the Youth Corps.\n\nCH'A Song-um [원문 `CHYA Song=um`] ([한자 판독 불가]), former member of the Youth Corps.\n\nCHO Sung-ok [원문 `CHO Sing~ok`] ([한자 판독 불가]), formerly Deputy Chief of the Youth Corps.\n\nCHONG Tae-kon [원문 `CHONG. Tae<keSn`] ([한자 판독 불가]), present Deputy Chief of the Youth Corps and leader of an underground organization in Mukden.\n\nCHU Hao-sok ([한자 판독 불가]), former member of the Youth Corps.\n\n[판독 불가], former member of the Youth Corps;\n\nThis document contains information affecting the national defense of the United States within the meaning of the Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents
