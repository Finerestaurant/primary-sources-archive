l.\n\nC-3 2. Members of the Peace Preservation Corps (Po An Tae) wear light red collar tabs with a red border. Gold stars and gold lines on the tabs designate rank.\n\nC-6 3. Members of the Peace Preservation Office (Po An So) wear light red collar tabs.\n\nC-4 4. Members of the regular Constabulary and the Railway Constabulary wear light red collar tabs with a black border.\n\nC-[판독 불가] 5. Members of the Coast Guard Constabulary also wear light red collar tabs with a black border, but the tabs differ slightly from those worn by members of the regular Constabulary and the Railway Constabulary.\n\nC-6 6. Members of the Coast Guard Constabulary wear khaki uniforms.\n\nC-[판독 불가] 7. Members of the Railway and regular Constabulary, Peace Preservation Corps and Peace Preservation Office wear black uniforms.\n\n25X1X6\n\nF-6 8. The officers of the Railway Constabulary wear uniforms different from those of the enlisted men. The officers' uniforms resemble those of the Soviet Army and the People's Army of North Korea. The insignia are worn on shoulder boards instead of on collar tabs. [판독 불가]\n\n25X1X6\n\nC-2 9. Members of the People's Army, or Peace Preservation Corps Officers' Schools, wear uniforms similar to those worn by the Soviet Army troops, with high stand-up collars and with the insignia on shoulder boards. The shoulder boards are similar to those used by the Soviets, but are slightly narrower.\n\n[REFERENCE CENTER LIBRARY]\n\n[Approved For Release 1999/09/08] : CIA-RDP82-00457R001000450006-9\n\n[페이지 구분]\n\nCENTRAL INTELLIGENCE GROUP  [CIA-RDP]82-00457R001[000450]006-9   25X1A2q [원문 그대로]\n\nC-[판독 불가] 10. The branch of service of members of the People's Army, or Peace Preservation Corps Officers' Schools, is designated by the color of the shoulder board. A red background is used by the infantry, artillery and cavalry; a blue background by the air force; and a black background by the signal corps. There is a large star on the shoulder board in the same position as the large star with the hammer and sickle device on the shoulder board of the Soviet soldier's uniform. However, instead of the hammer and sickle, the Korean national emblem is placed inside the star. Smaller stars and stripes are used to denote rank. The officers' shoulder boards have both the smaller stars and stripes to denote rank, but the enlisted men's shoulder boards have only stripes to denote rank. There is no difference between the uniforms of the officers and enlisted men except that the uniforms of the officers are made from better material than those of the enlisted men.\n\n[This document contains information affecting the national defense of the] United States within [the meaning of] the Espionage Act [50], U.S.C. 31 and [32 as amended. It]s transmission or [the revelation] of its contents in any [manner to] an unauthorized person is [prohib]ited by law.\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R001000450006-9", "notes": ["[삭제·공개 표시] Approved For Release 1999/09/08 : CIA-RDP82-00457R001000450006-9 (두 면의 공개 승인 도장. 첫 면의 것은 글자가 뭉개져 있다)", "[삭제·공개 표시] 25X1A2g (첫 면 상단 두 곳)", "[삭제·공개 표시] 25X1A2q (2면 상단. 25X1A2g 의 오독으로 보이나 찍힌 대로 옮겼다)", "[삭제·공개 표시] 25X1A6a (표제 옆)", "[삭제·공개 표시] 25X1X6 (ORIGIN 줄, 7항과 8항 사이, 8항과 9항 사이 세 곳)", "[삭제·공개 표시] 8항 끝에 지워진 자리가 있어 [판독 불가]로 옮겼다"], "note": "각 항 앞의 정보원 평가등급이 이 문서의 요점이라 살려 옮겼다. 다만 스캔에서 뭉개진 것이 있다. 1항은 `C-+2-`, 5항은 `o-S`, 7항은 `Cm`, 10항은 `C-&` 로 찍혀 있다. 1항은 C-2 로 읽었고 나머지 셋은 확정할 수 없어 뒷자리를 [판독 불가]로 두었다. 5항의 `o-S` 는 C-5, 10항의 `C-&` 는 C-6 으로 보이나 짐작해 채우지 않았다. 2항, 3항, 4항, 6항, 8항, 9항의 등급은 뚜렷하다. 표제 위에 재등급 도장이 겹쳐 찍혀 본문 머리 부분이 뒤엉켜 있다. `regraded to`, `in accordance with the`, `letter of 16 Octobe`, `from the` 만 남아 있어 등급명과 발신처를 [판독 불가]로 두었다. DIST 줄은 `30% October 1947` 로 찍혀 일자의 끝을 가릴 수 없다. 보안대, 보안서, 경비대의 한자는 모두 스캔에서 뭉개져 [한자 판독 불가]로 두었다. 원문 표기 Po An Tae, Po An So, Kyong Pi Tae 를 앞세우고 한국어를 병기했다. 2면에서 문서번호 도장과 본문이 겹쳐 `82-00457R061 H0G50N96-9` 로 찍혔다. 문서번호는 고치지 않고 판독되는 부분만 대괄호로 보였다.", "warn": false, "search": "Approved For Release 1999/09/08 : CIA-RDP82-00457R001000450006-9 (두 면의 공개 승인 도장. 첫 면의 것은 글자가 뭉개져 있다) 25X1A2g (첫 면 상단 두 곳) 25X1A2q (2면 상단. 25X1A2g 의 오독으로 보이나 찍힌 대로 옮겼다) 25X1A6a (표제 옆) 25X1X6 (ORIGIN 줄, 7항과 8항 사이, 8항과 9항 사이 세 곳) 8항 끝에 지워진 자리가 있어 [판독 불가]로 옮겼다 Military Information: Uniforms and Insignia in North Korea"}, {"id": "N54", "order": 77, "date": "1947-10-30", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "정치 첩보: 북조선 정부와 노동당 안의 파벌", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-10-30"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Political Information: Factions in North Korean Government and Labor Party", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r001200300009-0"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r001200300009-0"}], "summary": "북조선노동당과 정부 안에 KIM Il-song 과 KIM Tu-pong 이 이끄는 두 파벌이 맞서 있고, 실권은 KIM Il-song 이 쥐고 있다는 한 항짜리 보고다.", "points": ["KIM Il-song 김일성은 소련이 지원하는 「국제혁명파」를 이끈다. KIM Tu-pong 김두봉은 국제적 기반이 아닌 민족적 기반 위에 공산주의를 세우려는 파벌을 이끈다.", "KIM Il-song 은 조선을 소비에트 공화국으로 만들려 하고, KIM Tu-pong 은 조선이 독립국으로 남기를 바란다고 적었다.", "당 위원장 자리는 KIM Tu-pong 이 갖고 있으나 이름뿐이다. 집무처가 KIM Il-song 의 사람들로 채워져 감시받는다.", "KIM Tu-pong 이 한 일은 자기 심복 몇을 KIM Il-song 의 집무처에 넣은 것뿐이라고 본다.", "말미의 주는 KIM Il-song 이 이미 중앙위원회 위원장을 대신하였고 KIM Tu-pong 은 당직이 없다고 적는다. 보고한 곳의 이름은 지워졌다."], "primary": "공개 승인 기밀(CONFIDENTIAL) [CIA-RDP]82-00457R001200300009-0\n\n25X1X   25X1A\n\nINTELLOFAX [판독 불가]\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n첩보보고(INTELLIGENCE REPORT) .\n                                                  [원문 그대로] (143873\n\n국가  조선(Korea) .\n정보(INFO.) [판독 불가]\n\n주제  정치 첩보: 북조선 정부와 노동당 안의 파벌\n                                                  배포(DIST.) [판독 불가] 1월 [판독 불가]\n25X1A                                             면수 1\n보충(SUPPLEMENT)\n\n출처(ORIGIN)  [판독 불가]   25X1X\n\n25X1X\n\n1. KIM Tu-pong 김두봉([한자 판독 불가])과 KIM Il-song 김일성([한자 판독 불가])이 북조선노동당(North Korean Labor Party)과 북조선 정부 안에서 서로 맞서는 두 파벌을 이끈다. KIM Il-song 은 소련의 지원을 받는 「국제혁명파(International Revolutionary Faction)」의 지도자다. KIM Tu-pong 은 조선에 공산주의를 세우되 국제적 기반이 아니라 민족적 기반 위에 세우려는 파벌을 이끈다. KIM Il-song 은 조선을 소비에트 공화국으로 만들고자 하고, KIM Tu-pong 은 조선이 독립국으로 남기를 바란다.\n\nKIM Tu-pong 이 당의 위원장(president, 「chairman」) 자리를 차지하고 있음에도, 지금 조선노동당을 완전히 장악한 것은 KIM Il-song 이다.* KIM Tu-pong 의 지위는 이름뿐이다. 그는 KIM Il-song 에게서 명령과 지시를 받고, 그것을 반드시 따라야 하며 또 엄격히 따르고 있다. KIM Il-song 은 또한 KIM Tu-pong 의 집무처를 자기에게 충성하는 사람들로 채워 두었고, 그들은 KIM Tu-pong 의 모든 활동을 KIM Il-song 에게 보고한다. 이 엄중한 감시의 결과로 KIM Tu-pong 은 자신의 독자적인 사업을 시작하지 못하였고, 그래서 KIM Il-song 과 KIM Il-song 의 정책에 말로만 동조하고 있다. 그가 할 수 있었던 것은 자기 심복 몇을 KIM Il-song 의 집무처에 넣어 KIM Il-song 의 활동을 자기에게 보고하게 한 것뿐이다.\n\n25X1A\n25X1A  * (주: [삭제]에 따르면 KIM Il-song 이 KIM Tu-pong 을 대신하여 북조선노동당 중앙위원회 위원장이 되었다. KIM Tu-pong 은 여전히 노동당 당원이나 당내에 아무 직책도 갖고 있지 않다.)\n\n[이 문서는 개정된 간첩법(Espionage Act) 50 U.S.C. 31조 및 32조가 정하는 바에 따라 미합중국의 국방에 관계된 정보를 담고 있다. 그 전달 또는 그 내용을 어떠한 방식으로든 권한 없는 자에게 누설하는 것은 법으로 금지된다.]\n\n문서번호(Document No.) [판독 불가]\n등급 변경 없음(NO CHANGE in Class.) []\n[] 비밀해제(DECLASSIFIED)\n등급 변경 후(Class. CHANGED TO): TS  S  C\n근거(Auth): DDA REG. 77/1763\n일자(Date): [판독 불가]\n                                                  25X1X\n분류(CLASSIFICATION)  기밀(CONFIDENTIAL)  통제(CONTROL) [판독 불가]\n\n공개 승인 기밀(CONFIDENTIAL) [CIA-RDP]82-00457[R001]200300009-0", "secondary": "Approved For Release CONFIDENTIAL [CIA-RDP]82-00457R001200300009-0\n\n25X1X   25X1A\n\nINTELLOFAX [판독 불가]\n\nCENTRAL INTELLIGENCE GROUP\nINTELLIGENCE REPORT .\n                                                  [원문 그대로] (143873\n\nCOUNTRY  Korea .\nINFO. [판독 불가]\n\nSUBJECT  Political Information: Factions in North Korean Government and Labor Party\n                                                  DIST. [판독 불가] January [판독 불가]\n25X1A                                             PAGES 1\nSUPPLEMENT\n\nORIGIN  [판독 불가]   25X1X\n\n25X1X\n\n1. KIM Tu-pong ([한자 판독 불가]) and KIM Il-song ([한자 판독 불가]) head two opposing factions in the North Korean Labor Party and the North Korean Government. KIM Il-song is the leader of the \"International Revolutionary Faction\" which is supported by the USSR. KIM Tu-pong heads the faction which seeks to establish Communism in Korea on a national and not an international basis. KIM Il-song wishes to make Korea a Soviet Republic; KIM Tu-pong wishes to have Korea remain an independent nation.\n\nKIM Il-song is now in complete control of the Korean Labor Party even though KIM Tu-pong holds the office of president (\"chairman\") of the party.* KIM Tu-pong's position is merely a nominal one, for he receives orders and directives from KIM Il-song which he must and does strictly follow. KIM Il-song has also filled KIM Tu-pong's office with his own loyal followers who report to him on all KIM Tu-pong's activities. As a result of this strict surveillance, KIM Tu-pong has been unable to start an independent program of his own and, therefore, gives lip service to KIM Il-song and KIM Il-song's policies. He has been able to do nothing beyond placing some of his own henchmen in the office of KIM Il-song to report to him on KIM Il-song's activities.\n\n25X1A\n25X1A  * (Note: According to [삭제] KIM Il-song has replaced KIM Tu-pong as chairman of the Central Committee of the North Korean Labor Party; KIM Tu-pong is still a member of the Labor Party but holds no office in the party.)\n\n[This document contains information affecting the national defense of the] United States within the meaning of [the] Espionage Act, 50, U.S.C. 31 and 32 as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is [prohibited by law.]\n\nDocument No. [판독 불가]\nNO CHANGE in Class. []\n[] DECLASSIFIED\nClass. CHANGED TO: TS  S  C\nAuth: DDA REG. 77/1763\nDate: [판독 불가]\n                                                  25X1X\nCLASSIFICATION  CONFIDENTIAL  CONTROL [판독 불가]\n\nApproved For Release CONFIDENTIAL [CIA-RDP]82-00457[R001]200300009-0", "notes": ["[삭제·공개 표시] Approved For Release CONFIDENTIAL : CIA-RDP82-00457R001200300009-0 (첫 면과 마지막 면의 공개 승인 도장. 표제 글자와 겹쳐 뭉개져 있다)", "[삭제·공개 표시] 25X1X (첫 면 상단, ORIGIN 줄, 본문 앞, 하단 네 곳)", "[삭제·공개 표시] 25X1A (첫 면 상단, PAGES 줄, 말미 주 앞 두 곳)", "[삭제·공개 표시] ORIGIN 줄의 출처 표시가 지워져 [판독 불가]로 옮겼다", "[삭제·공개 표시] 말미 주의 `According to` 다음에 오는 출처가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S C / Auth: DDA REG. 77/1763 (비밀해제 검토 도장)"], "note": "본문은 한 항뿐이고 문장은 대체로 읽히나 낱글자가 심하게 뒤엉켜 있다. `Nerth`, `witich`, `internetiousl bashes`, `Soviel Republics`, `fol.ow`, `Lilled`, `evle`, `tiie` 같은 오독을 바로잡아 옮겼다. 이름 표기가 한 문서 안에서 `KIM Il-sdng`, `Kd dl~-sdiag`, `KIM Ti-song`, `KIM D~séng`, `Kid Tl-sohg`, `KIM Tlesdng`, `Kl Il-sig`, `AIM Tl-oShg` 로 제각각 찍혀 있다. 원문의 로마자는 `Il-sŏng` 계열로, 문서가 쓴 표기를 `KIM Il-song` 하나로 통일해 옮기고 한국어를 병기했다. `KIM Tu-pong` 도 `KM Tu-pong`, `Kid Tu-pong`, `KU Tu-pong`, `Ki Tu-~pang` 으로 흩어져 있다. 두 사람의 한자는 스캔에서 모두 뭉개져 [한자 판독 불가]로 두었다. 표제 옆의 정리번호 `(143873` 은 여는 괄호만 있고 닫는 괄호가 없으나 고치지 않았다. DIST 줄은 `Je TAR: nuar?` 로 찍혀 January 로만 읽히고 일자와 연도를 가릴 수 없다. index 의 문서 일자는 1947-10-30 이다. 위원장을 가리키는 말로 원문이 `president` 를 쓰고 괄호 안에 `chairman` 을 물음표와 함께 달아 두었다. 그대로 살렸다. 말미 주의 별표는 본문 두 번째 문단의 별표와 짝을 이룬다.", "warn": false, "search": "KIM Tu-pong 김두봉 (북조선노동당 위원장. 한자는 뭉개져 있다) KIM Il-song 김일성 (「국제혁명파」 지도자. 한자는 뭉개져 있다) Approved For Release CONFIDENTIAL : CIA-RDP82-00457R001200300009-0 (첫 면과 마지막 면의 공개 승인 도장. 표제 글자와 겹쳐 뭉개져 있다) 25X1X (첫 면 상단, ORIGIN 줄, 본문 앞, 하단 네 곳) 25X1A (첫 면 상단, PAGES 줄, 말미 주 앞 두 곳) ORIGIN 줄의 출처 표시가 지워져 [판독 불가]로 옮겼다 말미 주의 `According to` 다음에 오는 출처가 먹칠되어 [삭제]로 옮겼다 NO CHANGE in Class. / DECLASSIFIED / Class. CHANGED TO: TS S C / Auth: DDA REG. 77/1763 (비밀해제 검토 도장) Political Information: Factions in North Korean Government and Labor Party"}, {"id": "N55", "order": 78, "date": "1947-11-03", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "군사 첩보: 북조선 인민군 또는 보안대 장교학교", "badge": "confidential", "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-11-03"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information: North Korean People's Army or Peace Preservation Corps Officers' Schools", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r001000450007-8"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r001000450007-8"}], "summary": "북조선의 정규 부대가 인민군이라고도 보안대 장교학교라고도 불린다는 것을 밝히고, 지휘부와 대대 배치, 남신의주 학교의 내부를 3면에 걸쳐 적었다.", "points": ["정규 육군이 인민군(In Min Kun)과 보안대 장교학교(Po An Kan Pu Hak Kyo) 두 이름으로 불린다. 이름이 겹쳐 있는 것 자체가 이 해의 정보다.", "사령관은 CH'OE Yong-kon 최용건, 부사령관은 MU Chong 무정이다. 둘 다 옌안 출신이고 무정은 조선의용군 사령관이었다.", "최용건은 재량이 크나 KIM Il-song 김일성 장군과 Shtikov 시티코프 장군의 지시를 받는다고 적었다.", "총 병력은 14개 대대로 이루어진 1개 사단이다. 사단 사령부는 나남에 있고 사단장은 KIM Kang 김강이다.", "대대 배치는 평양 5, 신의주 3, 진남포 2, 용암포 2, 해주 1, 청진 1이다. 다른 보고는 2개 사단과 1개 독립 보병여단이라고 한다.", "남신의주 학교는 학생 1500명에서 2000명, 3개 대대다. 연대 사령부는 락원에 있고 소련군 소령이 군사고문으로 배속되어 있다.", "6월 3일 독일제 기관총 35정이 청진에서 열차로 평양 학교에 도착해 각 도로 배분된다.", "정보원 평가등급이 항마다 다르다. 병력과 배치를 적은 5항과 7항은 F-6 이다."], "primary": "[판독 불가] 공개 승인 1999/09/08 : [CIA-]RDP[82-00457R001000450007-8]\n\n중앙정보장(Director of Central [Intelligence])\n25X1A2g\n중앙정보단(CENTRAL INTELLIGENCE GROUP)  [참고자]료실(REFERENCE CENTER)\n첩보보고(INTELLIGENCE REPORT)\n국가  조선(Korea)                                  일자(DATE):\n\n정보(INFO.)  아래를 볼 것(See below)\n[판독 불가]\n\n주제  군사 첩보: 북조선 인민군 또는 보안대 장교학교\n                                                  배포(DIST.)\n25X1A6a                                           면수 3\n\n출처(ORIGIN)                                       보충(SUPPLEMENT)\n\n25X1X6\n\nC-3 1. 북조선의 정규 육군 부대는 이제 인민군(People's Army, In Min Kun [한자 판독 불가]) 성원 또는 보안대 장교학교(Peace Preservation Corps Officers' Schools) 성원 가운데 하나로 불린다. 후자는 보안간부학교(Peace Preservation Staff Officers' Schools, Po An Kan Pu Hak Kyo [한자 판독 불가])라고도 한다.\n\nC-[판독 불가] 2. 병사가 보안대 장교학교의 성원이면서도 그 학교에 주둔하지 않고 그 학교에서 훈련을 받지 않을 수 있다. 학교에서 몇 마일 떨어진 곳에 주둔하며 통상의 군무를 수행하고 있을 수 있다.\n\n[판독 불가] 3. 인민군, 곧 보안대 장교학교의 사령관은 CH'OE Yong-kon 최용건([한자 판독 불가])이고 부사령관은 MU Chong 무정([한자 판독 불가])이다. (워싱턴 주: 「CH'OE Yong-kon 과 MU Chong 에 관한 그 밖의 정보는 [삭제]를 볼 것.」)   25X1A2g\n\nF-[판독 불가] 4. CH'OE Yong-kon 은 인민군을 지휘하는 데 상당한 재량을 허용받고 있으나, KIM Il-song 김일성 장군과 Shtikov 시티코프 장군에게서 지시를 받는다.\n\nF-6 5. 북조선에 있는 인민군, 곧 보안대 장교훈련학교의 총 병력은 14개 대대로 이루어진 1개 사단이다.*\n    사단 사령부는 나남(Nanam, 羅南 Ranan) (129-41, bl-a2 [원문 그대로])에 있다.\n[판독 불가]  KIM Kang 김강([한자 판독 불가])이 사단장이다.\n[판독 불가]  신의주(Sinuiju, Shingishu) (124-2h [원문 그대로], 40-06)에 3개 대대가 있다.\n[판독 불가]  평양(Pyongyang, Heijo) (125-44, 39-01)에 5개 대대, 용암포(Yongampo, Ryugampo) (124-22, 3056 [원문 그대로])에 2개 대대, 해주(Haeju, Kaishu) (12512 [원문 그대로], 38-02)에 1개 대대, 청진(Chongjin, [판독 불가]) (129-49, bl-h6 [원문 그대로])에 1개 대대, 진남포(Chinnampo) (125-24, 30-44)에 2개 대대가 있다.\n25X1A6a  (주: [삭제]는 [판독 불가], 해주, 신의주, 그리고 청진과 나남 사이에 보안대 장교학교가 있다고 보고하였다.)   25X1A2g\n\n[판독 불가] 북조선 인민군이 2개 사단과 1개 독립 보병여단으로 이루어져 있다는 보고가 [삭제] 있었다.   25X1X6\n\n분류(CLASSIFICATION)  [기밀(CONFIDENTIAL) — 판독 불가]\n\n25X1A\n\n[판독 불가]\n[DDA] REG. [77/176]\n공개 승인 1999/09/08 [판독 불가]\n\n공개 승인 1999/09/08 : C[IA-RDP]82-00457R001000450007-8\n                                                  25X1A2g\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n\n[판독 불가]\n\n25X1X6\n\nF-3 6. 조선 공산주의 보안대 장교학교의 총사령부는 나남에 있으며 사단 사령부(Division Headquarters)로 알려져 있다.\n25X1A6a  ([삭제] [판독 불가]와 이 보고의 5항을 볼 것.)   25X1A2g\n\nF-6 7. 북조선의 각 도(道)마다 그 도 안의 보안대 장교학교를 관할하는 연대 [판독 불가] 사령부가 설치되었다.\n    (북조선 부대의 1개 연대가 3개 대대로 이루어진다면, 함경북도와 황해도는 정원에 미달한다. 이 보고의 5항에 따르면 황해도의 해주에 1개 대대, 함경북도의 청진에 1개 대대만 보고되어 있다. 또한 5항에 따르면 강원도와 함경남도에는 대대가 없고, 평안남도에는 7개 대대가 있다. 진남포에 2개, 평양에 5개다. 그러나 [삭제]는 [판독 불가]도의 함흥(Hamhung)에 보안대 장교학교가 있다고 보고하였다.)   25X1A2g  25X1A6a\n\nF-2 8. 나남에 있는 보안대 장교학교 총사령부의 지휘관은 CH'OE Yong-kon 이다.\nF-3  그는 옌안(Yenan 延安) (109-27, 36-36)에 있던 군사정치학교(조선인을 위한 것인가?)의 전 교장이었고, 한때 옌안에서 조선독립동맹(Korean Independence League)의 수장이었다.\nF-2  부사령관은 MU Chong 이며, 옌안에서 조선의용군(Korean Volunteer Army)의 전 사령관이었다.\n\n신의주의 보안대 장교학교\n25X1A\n[삭제] 「이 주제에 관한 그 밖의 정보는 [삭제]를 볼 것.」   25X1A2g\n\n[번호 판독 불가] 신의주의 보안대 장교훈련학교는 평안북도에 있는 유일한 보안대 장교훈련학교다. 평안북도에는 다른 훈련학교들도 있고 그 가운데 군사적 성격의 훈련을 하는 곳도 있으나, 그것들은 도 인민위원회 보안부(Provincial Government Peace Preservation Department, Po An Pu [한자 판독 불가]) 같은 다른 조직이 운영한다.\n\nF-6 10. 이 학교는 실제로는 남신의주 보안대 장교학교(South Sinuiju Peace Preservation Corps Officers' School)로 불리며 남신의주에 있다.\n\nF-6 11. 학교의 학생 수는 1500명에서 2000명 사이다.\nF-[판독 불가]  이들은 3개 대대로 편성되어 있다.\n\n[판독 불가]-3 12. 이 학교와 평안북도를 관할하는 연대 사령부는 락원(Rakwon)에 있다. 신의주에서 남서쪽으로 몇 킬로미터 떨어진 곳으로, 의주(Uiju, Gishu) ([한자 판독 불가])군과 용천(Yongchon, Ryosen) ([한자 판독 불가])군의 경계선 가까이다.\n\n[판독 불가] 13. 락원 연대 사령부의 지휘관은 YI ([한자 판독 불가])라는 이름의 조선인으로 42세이며, 전쟁 중에 옌안에 있었다.\n\n[판독 불가] 14. 락원 연대 사령부 정치부장은 KO Pong-ki 고봉기([한자 판독 불가])로 36세이며 조선의용군의 전 성원이다.\n\n참고자료실 도서관(REFERENCE CENTER LIBRARY)\n\n공개 승인 1999/09/08 : CIA-RDP82-00457R001000450007-8\n\n[3면. 문단 번호가 본문에서 떨어져 나와 왼쪽에 15. / 17. / 19. 만 남아 있다]\n\n15.\n17.\n19.\n25X1X6\n\n공개 승인 1999/09/08 : CIA-RDP82-00457R001000450007-8\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)   25X1A2g\n\n-3-  |  123800\n\n[번호 판독 불가] 소련군 장교 한 명이 소령으로서 군사고문으로 락원 연대에 배속되어 있다.\n\n[번호 판독 불가] 남신의주 학교 제1대대의 지휘관은 O Ch'i-man 오치만([한자 판독 불가])으로 34세다. 제2대대의 지휘관은 KIM U-man 김우만([한자 판독 불가])으로 32세다. 제3대대의 지휘관은 YI ([한자 판독 불가])로 29세다. O 와 KIM 과 YI 는 옌안에서 조선의용군의 성원이었다.\n\n[번호 판독 불가] 남신의주 학교의 훈련은 군사훈련과 정치훈련으로 나뉘며 군사훈련에 무게가 실린다.\n\n[번호 판독 불가] 이 학교의 주된 군사훈련장은 석하동(Sokhadong) (124-26, 40-04) 부근의 석하산(Sokha Mountain, [한자 판독 불가]) 일대에 있다. 매일 4개 중대가 석하산 일대로 가서 보병 훈련과 소총 및 소화기 교육을 받고 포술 연습을 한다. ([삭제] 주: 석하동은 신의주에서 약 3마일 떨어져 있다.)   25X1A6a\n\n[번호 판독 불가] 남신의주 학교에서 하는 정치 교육은 소련군의 역사, 조선의 대일 투쟁의 역사, 그리고 「사상 개조(thought improvement)」(공산주의 사상 주입인가?)를 강조한다.\n\n보안대 장교학교를 위한 기관총\n\n[번호 판독 불가] 6월 3일, 독일제 기관총 35정이 청진에서 열차로 평양 보안대 장교학교에 도착하였다. 이 기관총들은 각 도의 모든 보안대 장교학교에 배분될 것이다.\n\n[이 문서는 개정된 간첩법(Espionage Act) 50 U.S.C. 31조 및 32조가 정하는 바에 따라 미합중국의 국방에 관계된 정보를 담고 있다. 그 전달 또는 그 내용을 어떠한 방식으로든 권한 없는 자에게 누설하는 것은 법으로 금지된다.]\n\n공개 승인 1999/09/08 : CIA-RDP82-00457R001000450007-8.", "secondary": "[판독 불가] Approved For Release 1999/09/08 : [CIA-]RDP[82-00457R001000450007-8]\n\nDirector of Central [Intelligence]\n25X1A2g\nCENTRAL INTELLIGENCE GROUP  [REFERENCE C]ENTER\nINTELLIGENCE REPORT\nCOUNTRY  Korea                                    DATE:\n\nINFO.  See below\n[판독 불가]\n\nSUBJECT  Military Information: North Korean People's Army or Peace Preservation Corps Officers' Schools\n                                                  DIST.\n25X1A6a                                           PAGES 3\n\nORIGIN                                            SUPPLEMENT\n\n25X1X6\n\nC-3 1. The regular North Korean Army troops are now known either as members of the People's Army (In Min Kun [한자 판독 불가]) or the Peace Preservation Corps Officers' Schools, also known as the Peace Preservation Staff Officers' Schools (Po An Kan Pu Hak Kyo [한자 판독 불가]).\n\nC-[판독 불가] 2. A soldier may be a member of a Peace Preservation Corps Officers' School but may not be stationed at the school nor be receiving training at the school. He may be stationed several miles from the school performing regular military duties.\n\n[판독 불가] 3. The commander of the People's Army, or the Peace Preservation Corps Officers' Schools, is CH'OE Yong-kon ([한자 판독 불가]); the vice-commander is MU Chong ([한자 판독 불가]). (Washington Note: \"See [삭제] for further information on CH'OE Yong-kon and MU Chong.\")   25X1A2g\n\nF-[판독 불가] 4. CH'OE Yong-kon is allowed a great deal of latitude in commanding the People's Army, but receives direction from General KIM Il-song and General Shtikov.\n\nF-6 5. The total strength of the People's Army, or the Peace Preservation Corps Officers' Training Schools, in North Korea is one division consisting of fourteen battalions.*\n    The Division Headquarters is at Nanam (Ranan) (129-41, bl-a2 [원문 그대로]).\n[판독 불가]  KIM Kang ([한자 판독 불가]) is the division commander.\n[판독 불가]  There are three battalions at Sinuiju (Shingishu) (124-2h [원문 그대로], 40-06).\n[판독 불가]  There are five battalions at Pyongyang (Heijo) (125-44, 39-01), two battalions at Yongampo (Ryugampo) (124-22, 3056 [원문 그대로]), one battalion at Haeju (Kaishu) (12512 [원문 그대로], 38-02), one battalion at Chongjin ([판독 불가]) (129-49, bl-h6 [원문 그대로]), and two battalions at Chinnampo (125-24, 30-44).\n25X1A6a  (Note: [삭제] reported Peace Preservation Corps Officers' Schools at [판독 불가], Haeju, Sinuiju, and between Chongjin and Nanam.)   25X1A2g\n\n[판독 불가] It has been reported [삭제] that the North Korean People's Army consists of two divisions and one independent infantry brigade.   25X1X6\n\nCLASSIFICATION  [CONFIDENTIAL — 판독 불가]\n\n25X1A\n\n[판독 불가]\n[DDA] REG. [77/176]\nApproved For Release 1999/09/08 [판독 불가]\n\nApproved For Release 1999/09/08 : C[IA-RDP]82-00457R001000450007-8\n                                                  25X1A2g\n\nCENTRAL INTELLIGENCE GROUP\n\n[판독 불가]\n\n25X1X6\n\nF-3 6. The general headquarters for the Korean Communist Peace Preservation Corps Officers' Schools is at Nanam and is known as Division Headquarters.\n25X1A6a  ([삭제] See [판독 불가] and paragraph 5 of this report.)   25X1A2g\n\nF-6 7. In each of the North Korean provinces a regimental [판독 불가] headquarters for the Peace Preservation Corps Officers' Schools in the province has been established.\n    (If a regiment of North Korean troops is composed of three battalions, then North Hamgyong and Hwanghae Provinces are understrength. According to paragraph 5 of this report, only one battalion is reported at Haeju in Hwanghae Province and one battalion at Chongjin in North Hamgyong Province. Furthermore, according to paragraph 5, there are no battalions in Kangwon and South Hamgyong Provinces, but there are seven battalions in South Pyongan Province, two at Chinnampo and five at Pyongyang. However, [삭제] reported a Peace Preservation Corps Officers School at Hamhung in [판독 불가]ng Province.)   25X1A2g  25X1A6a\n\nF-2 8. The commanding officer of the general headquarters of the Peace Preservation Corps Officers' Schools at Nanam is CH'OE Yong-kon.\nF-3  He was the former head of a military and political school (for Koreans?) in Yenan (109-27, 36-36) and at one time was head of the Korean Independence League in Yenan.\nF-2  The vice-commander is MU Chong, former commander of the Korean Volunteer Army in Yenan.\n\nPeace Preservation Corps Officers' School at Sinuiju\n25X1A\n[삭제] \"See [삭제] for further information on this subject.\"   25X1A2g\n\n[번호 판독 불가] The Peace Preservation Corps Officers' Training School at Sinuiju is the only Peace Preservation Corps Officers' Training School in North Pyongan Province. There are other training schools, some of which give training of a military nature, in North Pyongan Province, but they are operated by other organizations such as the Provincial Government Peace Preservation Department (Po An Pu [한자 판독 불가]).\n\nF-6 10. The school is actually known as the South Sinuiju Peace Preservation Corps Officers' School and is in South Sinuiju.\n\nF-6 11. There are between 1500 and 2000 students at the school.\nF-[판독 불가]  They are organized into three battalions.\n\n[판독 불가]-3 12. The regimental headquarters for the school and for North Pyongan Province is at Rakwon, a few kilometers southwest of Sinuiju near the boundary line of Uiju (Gishu) ([한자 판독 불가]) County and Yongchon (Ryosen) ([한자 판독 불가]) County.\n\n[판독 불가] 13. The commander of the Rakwon Regimental Headquarters is a Korean named YI ([한자 판독 불가]), 42 years of age, who was in Yenan during the war.\n\n[판독 불가] 14. The chief of the Political Department of the Rakwon Regimental Headquarters is KO Pong-ki ([한자 판독 불가]), 36 years of age, and a former member of the Korean Volunteer Army.\n\nREFERENCE CENTER LIBRARY\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R001000450007-8\n\n[3면. 문단 번호가 본문에서 떨어져 나와 왼쪽에 15. / 17. / 19. 만 남아 있다]\n\n15.\n17.\n19.\n25X1X6\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R001000450007-8\n\nCENTRAL INTELLIGENCE GROUP   25X1A2g\n\n-3-  |  123800\n\n[번호 판독 불가] A Soviet Army officer, a major, is attached to the Rakwon Regiment as a military adviser.\n\n[번호 판독 불가] The commanding officer of the 1 Battalion of the South Sinuiju school is O Ch'i-man ([한자 판독 불가]), 34 years of age. The commanding officer of the 2 Battalion is KIM U-man ([한자 판독 불가]), 32 years of age. The commanding officer of the 3 Battalion is YI ([한자 판독 불가]), 29 years of age. O, KIM and YI were members of the Korean Volunteer Army in Yenan.\n\n[번호 판독 불가] The training at the South Sinuiju school is divided into military and political training, with emphasis placed upon the military.\n\n[번호 판독 불가] The main military training area for the school is in the Sokha Mountain ([한자 판독 불가]) area near Sokhadong (124-26, 40-04). Four companies go to the Sokha Mountain area daily and receive infantry training, rifle and small arms instruction, and engage in artillery practice. ([삭제] Note: Sokhadong is approximately three miles from Sinuiju.)   25X1A6a\n\n[번호 판독 불가] The political instruction given at the South Sinuiju school stresses the history of the Soviet Army, the history of Korea's struggle against Japan, and \"thought improvement\" (Communist indoctrination?).\n\nMachine Guns for Peace Preservation Corps Officers Schools\n\n[번호 판독 불가] On 3 June, 35 German machine guns arrived at the Pyongyang Peace Preservation Corps Officers' School by train from Chongjin. They will be distributed among all the Peace Preservation Corps Officers' Schools in each province.\n\n[This document contains information affecting the national defense of the] United States within the [meaning of the] Espionage Act 50, U.S.C. 31 and 32, as amended. Its transmission or the revelation of its contents in any manner to an unauthorized person is prohibited [by law.]\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R001000450007-8.", "notes": ["[삭제·공개 표시] Approved For Release 1999/09/08 : CIA-RDP82-00457R001000450007-8 (세 면에 걸쳐 여섯 곳의 공개 승인 도장)", "[삭제·공개 표시] 25X1A2g (1면 상단, 2면 상단, 3면 상단, 본문 주 옆 등 여러 곳)", "[삭제·공개 표시] 25X1A6a (PAGES 줄, 5항 주, 6항 주, 7항 주, 18항 주)", "[삭제·공개 표시] 25X1X6 (본문 앞, 5항 끝, 2면 본문 앞, 3면 두 곳)", "[삭제·공개 표시] 25X1A (1면 하단, 신의주 절 머리)", "[삭제·공개 표시] 3항 워싱턴 주의 참조처가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] 5항 주와 7항 주의 보고 주체가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] 5항 뒤 2개 사단 설의 출처가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] 신의주 절 머리의 참조 문구 앞뒤가 먹칠되어 [삭제]로 옮겼다", "[삭제·공개 표시] DDA REG. 77/176 (비밀해제 검토 도장, 1면 하단)"], "note": "이 다섯 건 가운데 가장 길고 가장 심하게 뭉개진 문서다. 좌표를 하나도 고치지 않았다. 나남의 `(129-41, bl-a2)`, 신의주의 `(124-2h, 40-06)`, 청진의 `(129-49, bl-h6)` 은 숫자 자리에 글자가 들어가 있다. 용암포의 `(124-22, 3056)` 과 해주의 `(12512, 38-02)` 는 붙임표가 사라졌고, 진남포의 `(125-24, 30-44)` 는 위도 30도가 되어 39도의 오독으로 보이나 고치지 않았다. 옌안의 `(109-27, 36-36)` 과 석하동의 `(124-26, 40-04)` 는 온전하다. 병력 숫자도 고치지 않았다. 14개 대대, 1개 사단, 학생 1500명에서 2000명, 기관총 35정, 나이 42세, 36세, 34세, 32세, 29세, 거리 3마일은 모두 원문 그대로다. 5항에 적힌 대대 수를 더하면 3 더하기 5 더하기 2 더하기 1 더하기 1 더하기 2 로 14가 되어 총계와 맞는다. 3면에서 문단 번호가 본문과 분리되어 왼쪽에 15, 17, 19 만 남았다. 어느 문단이 어느 번호인지 확정할 수 없어 번호를 새로 붙이지 않고 [번호 판독 불가]로 두었으며, 떨어져 나온 번호는 그 자리에 그대로 옮겼다. 2면 신의주 절의 첫 문단도 번호가 사라졌다. 앞뒤로 보아 9항이나 짐작해 채우지 않았다. 정보원 평가등급은 판독되는 것만 살렸다. 1항 C-3, 6항 F-3, 7항 F-6, 8항 F-2 와 그 아래 F-3, F-2, 10항과 11항 F-6 은 뚜렷하다. 2항의 `'oS`, 3항의 `rel.`, 4항의 `Fb`, 12항의 `Wa3` 은 앞이나 뒤를 가릴 수 없어 [판독 불가]로 두었다. 이름의 로마자는 원문 표기를 그대로 두고 한국어를 병기했다. `CH'OR Yong-kon`, `CAGE Yong-kUn`, `CH'QE Yong-k8n` 으로 흩어진 것은 `CH'OE Yong-kon` 으로, `MU Ching`, `1:0 Ch¥ng` 으로 흩어진 것은 `MU Chong` 으로 통일했다. `XIM Tleseng` 은 KIM Il-song 이다. 한자는 모든 자리에서 뭉개져 한 글자도 확정되지 않아 [한자 판독 불가]로 두었다. 지명은 조선 이름과 일본식 이름을 둘 다 살렸다. 청진의 일본식 이름은 원문에서 뭉개져 [판독 불가]로 두었다. 5항 주에 나오는 첫 지명은 `TWOneraut` 로 찍혀 있어 가릴 수 없다. 7항 주 끝의 도 이름은 `ng Province` 만 남아 함경남도로 보이나 짓지 않았다. 6항이 나남의 총사령부를 `Korean Communist Peace Preservation Corps Officers' Schools` 라 부르는 것과 3항이 부르는 이름이 다르다. 기관 이름은 문서가 쓴 대로 두었다.", "warn": false, "search": "CH'OE Yong-kon 최용건 (인민군 겸 보안대 장교학교 사령관. 옌안 군사정치학교 전 교장, 조선독립동맹 전 수장) MU Chong 무정 (부사령관. 옌안 조선의용군 전 사령관) KIM Il-song 김일성 (장군으로 표기됨. 최용건에게 지시를 준다) Shtikov 시티코프 (소련군 장군) KIM Kang 김강 (사단장) YI (락원 연대 사령부 지휘관, 42세. 이름의 뒷 음절과 한자가 판독되지 않는다) KO Pong-ki 고봉기 (락원 연대 사령부 정치부장, 36세) O Ch'i-man 오치만 (남신의주 학교 제1대대장, 34세) KIM U-man 김우만 (남신의주 학교 제2대대장, 32세) YI (남신의주 학교 제3대대장, 29세. 락원 연대 지휘관과 같은 사람인지 알 수 없다) Approved For Release 1999/09/08 : CIA-RDP82-00457R001000450007-8 (세 면에 걸쳐 여섯 곳의 공개 승인 도장) 25X1A2g (1면 상단, 2면 상단, 3면 상단, 본문 주 옆 등 여러 곳) 25X1A6a (PAGES 줄, 5항 주, 6항 주, 7항 주, 18항 주) 25X1X6 (본문 앞, 5항 끝, 2면 본문 앞, 3면 두 곳) 25X1A (1면 하단, 신의주 절 머리) 3항 워싱턴 주의 참조처가 먹칠되어 [삭제]로 옮겼다 5항 주와 7항 주의 보고 주체가 먹칠되어 [삭제]로 옮겼다 5항 뒤 2개 사단 설의 출처가 먹칠되어 [삭제]로 옮겼다 신의주 절 머리의 참조 문구 앞뒤가 먹칠되어 [삭제]로 옮겼다 DDA REG. 77/176 (비밀해제 검토 도장, 1면 하단) Military Information: North Korean People's Army or Peace Preservation Corps Officers' Schools"}, {"id": "N56", "order": 79, "date": "1947-11-03", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "군사 첩보; 북조선 경비대(Kyong Pi Tae) 조직의 명칭 변경", "badge": null, "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-11-03"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Military Information; Change in Name of North Korean Constabulary (Kyong Pi Tae) Organizations", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r001000490007-4"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r001000490007-4"}], "summary": "1947년 4월 북조선인민위원회 내무국이 경비대(Kyong Pi Tae) 조직을 모두 보안대(Po An Tae)로 고쳐 부르기로 했다는 다섯 항의 보고다.", "points": ["4월 6일 내무국(Nae Mu Kuk)이 모든 Kyong Pi Tae 조직을 Po An Tae 로 부른다고 발표한다.", "보안대 장교학교(보안간부학교, 곧 인민군) 성원에게는 이 변경이 적용되지 않는다. 이들은 결코 Kyong Pi Tae 로 불리지 않는다.", "이유는 Kyong Pi Tae 라는 말이 군대를 가리키는 말인데 이들이 실제로는 군이 아니라 경찰의 임무를 한다는 것이다.", "경비대, 철도경비대, 해안경비대가 각각 보안대, 철도보안대, 해안보안대가 된다.", "그러나 북조선 사람 다수는 습관 때문에 여전히 Kyong Pi Tae 라 부른다고 적었다.", "발표 날짜는 1항이 4월 6일, 4항이 4월 5일로 서로 다르다. 둘 다 원문대로 두었다."], "primary": "25X1A2g\n\nINTELLOFAX [판독 불가] 공개 승인 1999/09/08 : CIA-RDP82-00457R001000490007-4\n\n25X1A2g\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)   423998\n첩보보고(INTELLIGENCE REPORT)\n\n국가  조선(Korea)                                  일자(DATE):\n\n정보(INFO.)  [판독 불가] 1[판독 불가]47\n\n주제  군사 첩보; 북조선 경비대(Kyong Pi Tae) 조직의 명칭 변경\n                                                  배포(DIST.) [판독 불가] 1947년\n                                                  면수 1\n[판독 불가]  25X1A6a                               보충(SUPPLEMENT)\n                                                  25X1X6\n\n출처(ORIGIN)\n\n1. 1947년 4월 6일, 북조선인민위원회(North Korean People's Committee)의 내무국(Bureau of Internal Affairs, Nae Mu Kuk [한자 판독 불가])은 모든 Kyong Pi Tae 경비대(Constabulary) 조직을 앞으로 Po An Tae 보안대(Peace Preservation Corps) ([한자 판독 불가])로 부른다고 발표하였다.\n\n2. 그러나 이 명칭 변경은 보안대 장교학교(Peace Preservation Corps Officers' School) 성원에게는 적용되지 않는다. 이 학교는 보안간부학교(Peace Preservation Staff Officers' School) 또는 인민군(People's Army)이라고도 불린다. 이들은 결코 Kyong Pi Tae 의 성원으로 불리지 않는다.\n25X1A6a  ([삭제] 주: [판독 불가] 북조선의 인민군.)   25X1A2g\n\n3. 북조선 당국이 명칭 변경의 이유로 내세운 것은, 「Kyong Pi Tae」라는 말이 군대나 군 부대를 가리킬 때 쓰이는 데 반해 Kyong Pi Tae 의 성원은 실제로는 군 부대가 아니며 군사적 성격이 아니라 경찰의 임무를 수행해 왔다는 것이다.\n\n4. 4월 5일 이래로, 경비대(Kyong Pi Tae), 철도경비대(Railway Constabulary, Ch'ol To Kyong Pi Tae [한자 판독 불가]), 해안경비대(Coast Guard Constabulary, Hae An Kyong Pi Tae [한자 판독 불가])는 각각 보안대(Peace Preservation Corps, Po An Tae [한자 판독 불가]), 철도보안대(Railway Peace Preservation Corps, Ch'ol To Po An Tae [한자 판독 불가]), 해안보안대(Coast Guard Peace Preservation Corps, Hae An Po An Tae [한자 판독 불가])로 불려 왔다.\n\nF-2 6. [원문 그대로 — 5항 없이 6으로 건너뛴다] 그러나 북조선 사람 다수는 습관의 힘 때문에 여전히 「Po An Tae」보다 「Kyong Pi Tae」라는 말을 즐겨 쓴다.\n\n[이 문서는 개정된 간첩법(Espionage Act) 50 U.S.C. 31조 및 32조가 정하는 바에 따라 미합중국의 국방에 관계된 정보를 담고 있다. 그 전달 또는 그 내용의 누설은 [이하 판독 불가]]\n\nDDA 각서(DDA Memo),\n근거(Auth): DDA REG. 77/176\n일자(Date): 1978년 4월 24일   담당(By): [판독 불가]\n분류(CLASSIFICATION)  [판독 불가]\n\n공개 승인 1999/09/08 : CIA-RDP82-00457R001000490007-4\n\n참고자료실 도서관(REFERENCE CENTER LIBRARY)", "secondary": "25X1A2g\n\nINTELLOFAX [판독 불가] Approved For Release 1999/09/08 : CIA-RDP82-00457R001000490007-4\n\n25X1A2g\n\nCENTRAL INTELLIGENCE GROUP   423998\nINTELLIGENCE REPORT\n\nCOUNTRY  Korea                                    DATE:\n\nINFO.  [판독 불가] 1[판독 불가]47\n\nSUBJECT  Military Information; Change in Name of North Korean Constabulary (Kyong Pi Tae) Organizations\n                                                  DIST. [판독 불가] 1947\n                                                  PAGES 1\n[판독 불가]  25X1A6a                               SUPPLEMENT\n                                                  25X1X6\n\nORIGIN\n\n1. On 6 April 1947, the Bureau of Internal Affairs (Nae Mu Kuk) ([한자 판독 불가]) of the North Korean People's Committee announced that all Kyong Pi Tae (Constabulary) organizations would henceforth be known as the Po An Tae (Peace Preservation Corps) ([한자 판독 불가]).\n\n2. The change in designation does not, however, apply to members of the Peace Preservation Corps Officers' School, known also as the Peace Preservation Staff Officers' School or the People's Army. They are never referred to as members of Kyong Pi Tae.\n25X1A6a  ([삭제] Note: [판독 불가] People's Army in North Korea.)   25X1A2g\n\n3. The reason given by the North Korean authorities for the change in name was that the term \"Kyong Pi Tae\" is used in reference to an army or army troops, whereas the members of the Kyong Pi Tae were not actually army troops but performed duties of a police rather than a military nature.\n\n4. Since 5 April, the Constabulary (Kyong Pi Tae), the Railway Constabulary (Ch'ol To Kyong Pi Tae) ([한자 판독 불가]) and the Coast Guard Constabulary (Hae An Kyong Pi Tae) ([한자 판독 불가]) have been known respectively as the Peace Preservation Corps (Po An Tae) ([한자 판독 불가]), Railway Peace Preservation Corps (Ch'ol To Po An Tae) ([한자 판독 불가]) and the Coast Guard Peace Preservation Corps (Hae An Po An Tae) ([한자 판독 불가]).\n\nF-2 6. [원문 그대로 — 5항 없이 6으로 건너뛴다] However, many of the North Koreans, through force of habit, still use the term \"Kyong Pi Tae\" in preference to \"Po An Tae\".\n\n[This document contains information affecting the national defense of the] United States within [the meaning of the Espionag]e Act 50, U.S.C. [31 and 32 as amended.] Its transmission or the [revelation of its contents ...]\n\nDDA Memo,\nAuth: DDA REG. 77/176\nDate: 24 APR 1978   By: [판독 불가]\nCLASSIFICATION  [판독 불가]\n\nApproved For Release 1999/09/08 : CIA-RDP82-00457R001000490007-4\n\nREFERENCE CENTER LIBRARY", "notes": ["[삭제·공개 표시] Approved For Release 1999/09/08 : CIA-RDP82-00457R001000490007-4 (첫 면과 마지막 면의 공개 승인 도장)", "[삭제·공개 표시] 25X1A2g (첫 면 상단 두 곳, 2항 주 옆)", "[삭제·공개 표시] 25X1A6a (표제 아래, 2항 주 앞)", "[삭제·공개 표시] 25X1X6 (SUPPLEMENT 줄 옆)", "[삭제·공개 표시] 2항 주의 보고 주체와 본문이 먹칠되어 [삭제]와 [판독 불가]로 옮겼다", "[삭제·공개 표시] DDA Memo, Auth: DDA REG. 77/176, Date: 24 APR 1978 (비밀해제 검토 도장)"], "note": "본문은 짧고 비교적 잘 읽힌다. 이름이 바뀌는 과정 자체를 적은 문서라 조직 이름을 오늘의 말로 바꾸지 않고 원문 표기를 앞세워 병기했다. Kyong Pi Tae 경비대, Po An Tae 보안대, Nae Mu Kuk 내무국, Ch'ol To 철도, Hae An 해안이다. 한자는 모든 자리에서 스캔에 뭉개져 [한자 판독 불가]로 두었다. 원문의 로마자는 `Kyŏng Pi Tae` 처럼 반달표가 붙은 형태이나 스캔에서 `KyOng`, `Kytng`, `KySng`, `Skying` 으로 흩어져 있다. 반달표를 살릴 수 없는 자리가 많아 `Kyong Pi Tae` 로 통일해 옮겼다. 문단 번호가 1, 2, 3, 4 다음에 5 없이 6으로 건너뛴다. 번호를 새로 매기지 않고 [원문 그대로]로 밝혀 두었다. 1항의 발표일은 4월 6일인데 4항은 4월 5일 이래로라고 적는다. 하루 차이가 나지만 날짜의 숫자를 고치지 않고 둘 다 그대로 두었다. 정보원 평가등급은 마지막 항의 `Fe2` 만 남아 F-2 로 읽었다. 앞의 네 항에는 등급 표시가 보이지 않는다. 표제 옆의 정리번호 `423998` 은 그대로 두었다. DIST 줄과 INFO 줄의 날짜는 `etic ca; 1947` 과 `2 Soom 1S47` 로 찍혀 월과 일을 가릴 수 없다. index 의 문서 일자는 1947-11-03 이다.", "warn": false, "search": "Approved For Release 1999/09/08 : CIA-RDP82-00457R001000490007-4 (첫 면과 마지막 면의 공개 승인 도장) 25X1A2g (첫 면 상단 두 곳, 2항 주 옆) 25X1A6a (표제 아래, 2항 주 앞) 25X1X6 (SUPPLEMENT 줄 옆) 2항 주의 보고 주체와 본문이 먹칠되어 [삭제]와 [판독 불가]로 옮겼다 DDA Memo, Auth: DDA REG. 77/176, Date: 24 APR 1978 (비밀해제 검토 도장) Military Information; Change in Name of North Korean Constabulary (Kyong Pi Tae) Organizations"}, {"id": "N57", "order": 80, "date": "1947-11-05", "group": "C", "eyebrow": "1947 북조선 · 중앙정보단·중앙정보국 보고", "title": "정치 첩보: 북조선인민위원회 내무국", "badge": null, "list_right": "첩보보고", "meta": [{"k": "일자", "v": "1947-11-05"}, {"k": "발신", "v": "Central Intelligence Group 중앙정보단", "txt": true}, {"k": "종류", "v": "첩보보고"}, {"k": "원제", "v": "Political Information; Bureau of Internal Affairs of the North Korea People's Committee", "txt": true}, {"k": "CREST 번호", "v": "cia-rdp82-00457r001000490002-9"}], "links": [{"k": "CREST", "text": "아카이브닷오르그 원본", "url": "https://archive.org/details/cia-rdp82-00457r001000490002-9"}], "summary": "북조선인민위원회 내무국의 조직과 권한을 도, 군 단위까지 훑은 보고다. 보안국이 내무국으로 이름을 바꾸고, 도와 군의 내무 기구가 인민위원회의 손을 떠나 내무국 한 줄로 묶인다.", "points": ["내무국장은 Pak Il-u 박일우다. 이 국은 전에 보안국(Peace Preservation Bureau)이라 불렸다고 적었다. 이름이 바뀌는 중이라는 것을 미국이 포착한 대목이다.", "도 내무부와 군 내무소가 전에는 각기 도, 군 인민위원회의 통제를 받았으나 지금은 내무국에만 책임을 진다. 도와 군의 인민위원회가 이 통제권 상실에 깊이 반발한다고 적었다.", "내무국의 가장 중요한 기능을 내부 경찰(국가 보안) 체계의 운영으로 본다. 내무 계통 관리는 도, 군 인민위원장을 포함한 어떤 정부 관리도 체포할 권한을 가진다.", "철도보안대와 해안보안대는 내무국이 아니라 교통국 소속이다. 해안보안대는 교통국 해정서 아래에 있다. 다만 도 내무부가 철도보안대 감찰과에 죄수 처우에 관한 명령을 낼 수 있다.", "군 내무소는 총무계, 보안계, 감찰계, 건설계, 인민 등록 계통, 보건계, 문화계로 나뉜다. 문화계는 언제나 부소장이 맡는다.", "각 군 내무소의 보안대와 보안서 인원은 모두 110명이다. 대원은 지방에서 뽑지만 장교는 인민군 소속인 경우가 많다.", "보안대와 보안서 대원은 군사 훈련을 받고 무기를 지니나 임무는 경찰 임무이고, 정규 육군의 일부로 여기지 않는다고 적었다.", "김일성이 다른 어느 국보다 내무국과 긴밀히 연락한다고 적었다. 평안북도 내무부장과 초산군 내무 책임자의 이름을 붙였다."], "primary": "25X1A2g\n\n정본화 - 공개 승인 : [판독 불가] 00457R001000490002-[판독 불가]\n\n25X1A2g\n중앙정보단(CENTRAL INTELLIGENCE GROUP)\n첩보보고(INTELLIGENCE REPORT) 125504\n\n국가   조선(Korea)                일자(DATE):\n정보(INFO.)  아래 참조\n\n주제   정치 첩보: 북조선인민위원회 내무국(Bureau of Internal Affairs\nof the North Korea People's Committee)        배포(DIST.)  1947년 11월 [판독 불가]일\n\n면수  5\n\n출처(ORIGIN)  [판독 불가]   25X1A6a   보충(SUPPLEMENT)\n\n25X1X6\n\n[판독 불가]9월 194[판독 불가]\n\nF-[판독 불가] 1. 북조선인민위원회 내무국(Internal Affairs Bureau, Nae Mu Kuk 내무국)([한자 판독 불가])의 국장은 Pak Il-u 박일우([한자 판독 불가])다. 이 국은 전에 북조선인민위원회 보안국(Peace Preservation Bureau)이라 불렸다.\n\nF-3 2. 북조선의 각 도에는 내무부(Internal Affairs Department, Nae Mu Pu 내무부)([한자 판독 불가])가 있다.\n\nF-3 3. 북조선의 각 군에는 내무소(Internal Affairs Office, Nae Mu So 내무서)([한자 판독 불가])가 있다.\n\n[판독 불가] 1947년 9월 12일\n\n[판독 불가]-6 4. 전에는 각 도의 내무부가 그 도 인민위원회의 통제 아래 있었고, 각 군의 내무소는 그 군 인민위원회의 통제 아래 있었다. 그러나 현재는 둘 다 북조선인민위원회 내무국에 대해서만 책임을 진다. 도와 군의 인민위원회는 이 통제권을 잃은 것에 깊이 반발하고 있다.\n\n[판독 불가]-3 5. 내무국의 가장 중요한 기능은 내부 경찰(? 국가 보안 ?) 체계의 운영이다.\n\nB-6 내무국과 내무부, 내무소의 관리들은 군과 도 인민위원회 위원장을 포함하여 어떤 정부 관리라도 체포할 권한까지 가지고 있다.\n\n1947년 9월 2일\n\nF-3 6. 북조선인민위원회 내무국과 각 도 내무부는 각각 그 산하 보안부(Peace Preservation Department, Po An Pu 보안부)를 통하여 자기에게 배속된 보안대(Peace Preservation Corps) 인원을 통제한다.\n\nF-6 군 내무소에는 보안부가 없고, 자기에게 배속된 보안대 인원을 직접 통제한다.\n\n비밀등급 변경 없음(NO CHANGE in Class.)\n[ ] 비밀해제(DECLASSIFIED)\n비밀등급 다음으로 변경(Class. CHANGED TO):\n\n정본화 - 공개 승인 : [판독 불가] 00457R001000490002-9\n\n정본화 - 공개 승인 : [판독 불가] 0457 R001 0004[판독 불가]\n\n중앙정보단(CENTRAL INTELLIGENCE GROUP)   25X1A2g\n\n-2-\n\n[판독 불가] 7. 그러나 철도보안대(Railway Peace Preservation Corps, Ch'ol To Po An Tae 철도보안대)([한자 판독 불가])와 해안보안대(Coast Guard Peace Preservation Corps, Hae An Po An Tae 해안보안대)([한자 판독 불가])의 대원은 내무국의 통제 아래 있지 않다. 철도보안대는 북조선인민위원회 교통(체신?)국(Transportation (Communications?) Bureau)의 통제 아래 있다. 해안보안대는 북조선인민위원회 교통(체신?)국의 해정서(Marine Administration Office, Hae Chong So 해정서)([한자 판독 불가])의 통제 아래 있다. 그러나 도 내무부는 필요할 때 철도보안대 감찰과에 죄수의 취급과 처우에 관하여 명령을 낼 수 있다.\n\nF-3 8. 각 군(kun 군)의 내무소(Nae Mu So 내무서)([한자 판독 불가]) 조직은 다음과 같다:\n\na. 총무계(General Affairs Section, Ch'ong Mu Kye 총무계)([한자 판독 불가]): 행정 사무와 일반 사무를 다룬다.\n\nb. 보안계(Peace Preservation Section, Po An Kye 보안계)([한자 판독 불가]): 치안과 질서를 유지하고 여관 검사를 한다.\n\n[판독 불가]\n\nc. [판독 불가]계(Kam Ch'al Kye 감찰계)([한자 판독 불가]): 정보를 다룬다.\n\nd. 건설계(Construction Works Section, Kon Sol Kye 건설계)([한자 판독 불가]): 도로를 수리한다. 비상시에는 통신 시설의 보수 작업도 한다.\n\ne. [판독 불가]계(In Min [판독 불가] Kye 인민[판독 불가]계)([한자 판독 불가]): [판독 불가]를 발급하고, 인구조사를 하며, 출생과 사망 기록을 관리한다.\n\nf. 보건계(Health Maintenance Section, Po Kon Kye 보건계)([한자 판독 불가]): 전염병 예방을 맡고 모든 공중위생 사업을 감독한다.\n\ng. 문화계(Cultural Section, Mun Hwa Kye 문화계)([한자 판독 불가]): 보안대(Po An Tae 보안대)([한자 판독 불가]) 대원의 문화 훈련과 교육을 감독하고 개인 신상에 관하여 조언을 준다. 각 군 내무소의 부소장이 언제나 이 계를 맡는다.\n\nF-3 9-2 [원문 그대로] 각 군 내무소에서 일하는 인원 가운데 사복을 입은 자는 흔히 보안서(Peace Preservation Office, Po An So 보안서)([한자 판독 불가]) 소속이라 불리고, 제복을 입은 자는 보안대(Po An Tae 보안대)([한자 판독 불가]) 대원이라 불린다.\n\nF-6 10. 각 군 내무소에는 보안대와 보안서 인원을 합하여 모두 110명이 있다.\n\n[판독 불가] 1947년 8월 10일 [2947 원문 그대로]\n\nC-5 11. 북조선의 보안대(Po An Tae)와 보안서(Po An So) 인원은 각 보안부(Po An Pu) 아래에 편성된다. 보안대와 보안서 인원의 대부분은 그 지방에서 모집된다.\n\nF-6 그러나 장교는 흔히 인민군(People's Army) 소속이고, 그 지방 출신이 아닌 경우가 많다.\n\n정본화 - 공개 승인 : [판독 불가] 00457R001000490002-9\n\n정본화 - 공개 승인 : [판독 불가] 00457R001000490002-[판독 불가]\n\n25X1A2g\n\nC-5 22 [원문 그대로]. 보안대와 보안서의 대원은 모두 군사 훈련을 받고 무기를 지니지만, 군사 임무가 아니라 경찰 임무를 수행한다. 이들은 범죄 수사와 위생 검사를 하고 인구조사를 하며 그 밖에 비슷한 성격의 임무를 수행한다.\n\nC-5 13. 보안대와 보안서의 대원은 정규 육군 부대의 일부로 여겨지지 않는다.\n\n[판독 불가] VU [원문 그대로]. KIM Il-song 김일성은 북조선인민위원회의 다른 어떤 국보다도 내무국과 더 긴밀히 연락을 유지한다.\n\nF-[판독 불가] 15. 평안북도(North Pyongan (Heian) Province) 내무부장은 [판독 불가] Pyong-yong [판독 불가] 병용([한자 판독 불가])이다.\n\nF-6 36 [원문 그대로]. [판독 불가](Sozan 초산) 군 내무국장은 KIM Chong-ki 김정기다.\n\nF-6 17. Chosan 초산군 내무소의 전 소장은 AN Song-sun 안성순([한자 판독 불가])이었다. 1947년 봄에 그는 북조선인민위원회 내무국 감찰과 정보책임자로 승진하였다.\n\n이 문서는 다음에 관한 정보를 담고 있다[판독 불가]\n[판독 불가] 간첩법(Espionage Ac[판독 불가]\n32조 개정, [판독 불가]\n그 내용의 누설[판독 불가]\n권한 없는 자에게 [판독 불가]\n법으로 금지된다.\n\n정본화 - 공개 승인 : [판독 불가] 00457R001000490002-9", "secondary": "25X1A2g\n\nSanitized - Approved For Release : [판독 불가] 00457R001000490002-[판독 불가]\n\n25X1A2g\nCENTRAL INTELLIGENCE GROUP\nINTELLIGENCE REPORT 125504\n\nCOUNTRY   Korea                DATE:\nINFO.  See below\n\nSUBJECT   Political Information; Bureau of Internal Affairs\nof the North Korea People's Committee        DIST.  [판독 불가] November 1947\n\nPAGES  5\n\nORIGIN  [판독 불가]   25X1A6a   SUPPLEMENT\n\n25X1X6\n\n[판독 불가]eptember 194[판독 불가]\n\nF-[판독 불가] 1. The head of the Internal Affairs Bureau (Nae Mu Kuk) ([한자 판독 불가]) of the North Korea People's Committee is Pak Il-u ([한자 판독 불가]). This bureau was formerly known as the Peace Preservation Bureau of the North Korea People's Committee.\n\nF-3 2. In each province in North Korea there is an Internal Affairs Department (Nae Mu Pu) ([한자 판독 불가]).\n\nF-3 3. In each county in North Korea there is an Internal Affairs Office (Nae Mu So) ([한자 판독 불가]).\n\n[판독 불가] 12 September 1947\n\n[판독 불가]-6 4. Formerly, the Internal Affairs Department in each province was under the control of its Provincial People's Committee, and the Internal Affairs Office in each county under the control of its County People's Committee. At the present time, however, both are responsible only to the Bureau of Internal Affairs of the North Korea People's Committee. The Provincial and County People's Committees have deeply resented the loss of this control.\n\n[판독 불가]-3 5. The most important function of the Internal Affairs Bureau is the operation of an internal police (? state security ?) system.\n\nB-6 The officials of the Internal Affairs Bureau, Departments and Offices even have the authority to place under arrest any government official, including the chairman of the County and Provincial People's Committees.\n\n2 September 1947\n\nF-3 6. The Internal Affairs Bureau of the North Korea People's Committee and the Provincial Departments of Internal Affairs each controls, through its Peace Preservation Department (Po An Pu), the Peace Preservation Corps personnel attached to it.\n\nF-6 The County Internal Affairs Office does not have a Peace Preservation Department but directly controls the Peace Preservation Corps personnel attached to it.\n\nNO CHANGE in Class.\n[ ] DECLASSIFIED.\nClass. CHANGED TO:\n\nSanitized - Approved For Release : [판독 불가] 00457R001000490002-9\n\nSanitized - Approved For Release : [판독 불가] 0457 R001 0004[판독 불가]\n\nCENTRAL INTELLIGENCE GROUP   25X1A2g\n\n-2-\n\n[판독 불가] 7. However, members of the Railway Peace Preservation Corps (Ch'ol To Po An Tae) ([한자 판독 불가]) and of the Coast Guard Peace Preservation Corps (Hae An Po An Tae) ([한자 판독 불가]) are not under the control of the Internal Affairs Bureau. The Railway Peace Preservation Corps is under the control of the Transportation (Communications?) Bureau of the North Korea People's Committee. The Coast Guard Peace Preservation Corps is under the control of the Marine Administration Office (Hae Chong So) ([한자 판독 불가]) of the Transportation (Communications ?) Bureau of the North Korea People's Committee. However, the Provincial Internal Affairs Department may, when necessary, issue orders to the Inspection Section of the Railway Peace Preservation Corps concerning the handling and treatment of prisoners.\n\nF-3 8. The organization of the Internal Affairs Office (Nae Mu So) ([한자 판독 불가]) in each county (kun) is as follows:\n\na. General Affairs Section (Ch'ong Mu Kye) ([한자 판독 불가]): Handles administrative matters and affairs of a general nature.\n\nb. Peace Preservation Section (Po An Kye) ([한자 판독 불가]): Keeps peace and order; conducts hotel inspections.\n\n[판독 불가]\n\nc. [판독 불가] Section (Kam Ch'al Kye) ([한자 판독 불가]): Handles intelligence.\n\nd. Construction Works Section (Kon Sol Kye) ([한자 판독 불가]): Repairs roads; in emergencies also does repair work on communications installations.\n\ne. [판독 불가] Section (In Min [판독 불가] Kye) ([한자 판독 불가]): Issues [판독 불가]; takes the census; keeps records on births and deaths.\n\nf. Health Maintenance Section (Po Kon Kye) ([한자 판독 불가]): In charge of prevention of epidemics; supervises all public sanitation work.\n\ng. Cultural Section (Mun Hwa Kye) ([한자 판독 불가]): Supervises the cultural training and education of members of the Peace Preservation Corps (Po An Tae) ([한자 판독 불가]) and gives them advice on personal affairs. The assistant head of the Internal Affairs Office in each county is always in charge of this section.\n\nF-3 9-2 [원문 그대로] Of the personnel working in each County Internal Affairs Office, those in plain clothes are commonly referred to as members of the Peace Preservation Office (Po An So) ([한자 판독 불가]); those in uniform, as members of the Peace Preservation Corps (Po An Tae) ([한자 판독 불가]).\n\nF-6 10. In each County Internal Affairs Office there is a total of 110 Peace Preservation Corps and Peace Preservation Office personnel.\n\n[판독 불가] 10 August 2947 [원문 그대로]\n\nC-5 11. Members of the Peace Preservation Corps (Po An Tae) and the Peace Preservation Office (Po An So) in North Korea are organized under the various Peace Preservation Departments (Po An Pu). Most of the personnel of the Peace Preservation Corps and Peace Preservation Office are recruited from the local area.\n\nF-6 The officers, however, often belong to the People's Army and do not often come from the local area.\n\nSanitized - Approved For Release : [판독 불가] 00457R001000490002-9\n\nSanitized - Approved For Release : [판독 불가] 00457R001000490002-[판독 불가]\n\n25X1A2g\n\nC-5 22 [원문 그대로]. Although members of both the Peace Preservation Corps and the Peace Preservation Office receive military training and bear arms, they perform police rather than military duties. They conduct criminal investigations, sanitation inspections, take the census and perform other duties of a similar nature.\n\nC-5 13. The members of the Peace Preservation Corps and the Peace Preservation Office are not considered part of the regular army troops.\n\n[판독 불가] VU [원문 그대로]. KIM Il-song maintains closer liaison with the Internal Affairs Bureau than with any other governmental bureau in the North Korea People's Committee.\n\nF-[판독 불가] 15. The chief of the North Pyongan (Heian) Province Internal Affairs Department is [판독 불가] Pyong-yong ([한자 판독 불가]).\n\nF-6 36 [원문 그대로]. The chief of the [판독 불가] (Sozan) County Internal Affairs Bureau is KIM Chong-ki.\n\nF-6 17. The former Chief of the Chosan County Internal Affairs Office was AN Song-sun ([한자 판독 불가]). In the spring of 1947 he was promoted to Chief of Intelligence of the Inspection Section of the Internal Affairs Bureau of the North Korea People's Committee.\n\nThis document contains informa[판독 불가]\n[판독 불가] the Espionage Ac[판독 불가]\n32 as amended, [판독 불가]\nthe revela[판독 불가]\nn unauthorized person is [판독 불가]\nted by law.\n\nSanitized - Approved For Release : [판독 불가] 00457R001000490002-9", "notes": ["[삭제·공개 표시] Sanitized - Approved For Release : CIA-RDP82-00457R001000490002-9 (여
