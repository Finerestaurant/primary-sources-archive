월 15일.\n\nM25313. 몰로토프가 오늘 저녁 나를 불렀다. 그는 나에게 다음의 성명을 읽어 주었다.\n\n「미합중국, 소련, 영국 및 중국 정부에 보낸 8월 14일자 일본 정부의 선언에는, 포츠담선언의 조건을 일본이 수락하는 것에 관하여 일본 천황이 조서를 내린 것과 관련하여, 일본은 그 소재를 불문하고 일본의 모든 육군·해군·항공 당국 및 그 관할 아래 있는 모든 무장 병력에 대하여 군사 행동을 중지하고 무기를 인도하라는 명령을 발할 준비가 되어 있다고 적혀 있다.\n\n8월 15일 정오에 공표된 일본 천황의 조서[주98]에는 8월 15일자 일본 정부의 선언[주99]에서 말한 바와 같은 명령이 담겨 있지 않다. 이 조서는 일반적 성격의 선언에 지나지 않는다.\n\n소련 정부는, 그 소재를 불문하고 모든 일본 무장 병력에 대하여 적대행위를 중지하고 소련군을 포함한 연합군에 항복하며 무기를 인도할 것을 명하는 명령이 담긴 조서를 일본 천황이 즉시 내리도록 하기 위한 긴급 조치를 취할 필요가 있다고 본다.\n\n소련 정부는, 일본군의 항복에 관한 위의 명령이 언제 발해질 것인지, 그리고 일본의 항복 문서 서명이 어느 날에 이루어질 것인지에 관한 정보를 미합중국 정부로부터 받기를 기다린다.」\n\n나는 몰로토프에게, 일본의 항복 조건 수락에 대하여 우리가 스위스 정부를 통하여 보낸 회답의 요지를 접수하였다고 알리고, [666면] 8월 14일자 마셜이 맥아더에게 보낸 평문 전문(平文電文) 육군전보 1409호[주1]의 내용을 알려 주었다. 나는 일본의 수락 때와 마찬가지로 이 회답이 일본 측에 도달하기까지 얼마간 시간이 걸릴 수 있다고 말하였다. 나는 또한 딘 장군[주2]이 안토노프 장군[주3]에게, 8월 15일자 육군전보(맥아더 번호 0500)[주1]에 담긴 맥아더 장군의 메시지를 도쿄로 중계하는 데 도움을 달라고 서면으로 요청하였음을 설명하고 그 메시지의 요지를 전하였다.\n\n몰로토프는 나에게 현재까지 실제로 항복한 사례가 있었는지 물었고, 나는 지금까지 아무런 정보도 받지 못하였다고 답하였다.\n\n나는 몰로토프에게 전달할 수 있도록 이날 중으로 (육군 통신선을 통하여) 모든 진전 상황을 긴급히 알려 주기를 바란다.\n\n[\n\n해리먼\n\n]", "secondary": "Moscow, 15 August, 1945.\n\nM25313. Molotov requested me to call this evening. He read to me the following statement:\n\n“In the declaration of the Japanese Government to the Governments of the United States of America, the Soviet Union, Great Britain and China dated August 14, it is stated that in connection with the issuance of a rescript by the Japanese Emperor concerning the acceptance by Japan of the conditions of the Potsdam Declaration Japan was prepared to issue orders to all military, naval and air authorities of Japan and to all the armed forces under their jurisdiction, wherever they might be, to cease military operations and to surrender their arms.\n\nThe rescript of the Japanese Emperor published at noon August 15 [주98] contains no order, as mentioned in the Declaration of the Japanese Government of August 15. [주99] This rescript is only a declaration of a general character.\n\nThe Soviet Government considers it necessary to take urgent measures for the immediate issuance of a rescript by the Japanese Emperor which will contain an order to all the Japanese armed forces, where-ever they might be, to cease hostilities, to capitulate to the Allied forces, including the Soviet forces, and to surrender their arms.\n\nThe Soviet Government awaits the receipt from the Government of the United States of America of information as to when the above-mentioned order concerning the capitulation of the Japanese forces will be issued and as to the date on which the act of capitulation of Japan will be signed.”\n\nI informed Molotov that we had received a summary of the reply which we had made through the Swiss Government to the Japanese acceptance of the surrender terms and advised him of the contents of [666면] Army cable Number 1409 plain text message Marshall to MacArthur, August 14. [주1] I stated that as in the case of the Japanese acceptance some time might elapse before this reply was received by the Japanese. I also explained that General Deane [주2] had requested General Antonov [주3] in writing to assist in relaying the message from General MacArthur to Tokyo contained in Army cable Number (MacArthur’s number 0500) August 15 [주1] and gave him the gist of this message.\n\nMolotov asked me whether there had been any actual surrenders up to the present time, to which I replied that I had thus far received no information.\n\nI hope I may be urgently informed this day (via Army channels) of all developments in order to pass them on to Molotov.\n\n[\n\nHarriman\n\n]", "notes": ["[주98] 일본 시간. 워싱턴 시간으로는 8월 14일 저녁이었다.", "[주99] 8월 14일자 스위스 대리대사의 각서에 인용된 회답을 보라, 662면.", "[주1] 국무부 문서철에서 찾지 못함.", "[주2] 존 R. 딘(John R. Deane) 육군 소장, 주소련 미국 군사사절단장.", "[주3] 알렉세이 인노켄티예비치 안토노프(Alexey Innokentyevich Antonov) 육군 대장, 소련군 참모총장.", "[주1] 국무부 문서철에서 찾지 못함."], "note": "번역자 주 — 소련 성명 본문에서 「8월 15일자 일본 정부의 선언」이라 한 대목은 앞 문단의 「8월 14일자」와 어긋난다. 원문 그대로 두었고 각주 99가 8월 14일자 문서를 가리킨다. 서명 「Harriman」이 원문에서 대괄호 안에 있어 그 표기를 그대로 살렸다. 「capitulate/capitulation」은 「항복」으로, 「surrender their arms」는 「무기를 인도」로 구분해 옮겼다. 「plain text message」는 암호화하지 않은 평문 전보를 뜻한다. 각주 번호 [주1]이 두 번 나오는 것은 원문(면이 바뀌며 번호가 다시 매겨진 것)대로다.", "warn": false, "pages": ["665", "666"], "search": "W. Averell Harriman 해리먼 — 주소련 미국 대사 Vyacheslav M. Molotov 몰로토프 — 소련 외무인민위원 George C. Marshall 마셜 — 미 육군참모총장(전보 발신자로 언급) Douglas MacArthur 맥아더 — 연합국최고사령관 지명자 John R. Deane 존 R. 딘 — 주소련 미국 군사사절단장, 육군 소장 Alexey I. Antonov 알렉세이 I. 안토노프 — 소련군 참모총장, 육군 대장 히로히토 천황(본문에는 「일본 천황」으로만 나옴)"}, {"id": "d447", "order": 447, "date": "1945-08-15", "group": "A", "eyebrow": "d447 · The Secretary of State to the Ambassador in the Soviet Union (Harriman)", "title": "국무장관이 주소련 대사(해리먼)에게", "badge": null, "list_right": "문서 447", "meta": [{"k": "일자", "v": "1945-08-15"}, {"k": "시각", "v": "발신 1945년 8월 15일 오후 7시 (Washington, August 15, 1945—7 p.m.)"}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "1840"}, {"k": "원문출처", "v": "육군부 경유 귀 제M25313호, 1945년 8월 15일에 대한 회신", "txt": true}, {"k": "발신", "v": "국무장관 번스(Byrnes)", "txt": true}, {"k": "수신", "v": "주소련 대사 해리먼(Harriman)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 447 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d447"}], "summary": "몰로토프가 제기한 논점은 오늘 발송한 맥아더 장군 앞 지령과 그 부속서로 충분히 다루어졌으며, 항복이나 사절 도착 보고는 아직 없고 이후 이 문제는 맥아더 장군이 처리한다고 알리다.", "points": ["1945년 8월 15일 오후 7시 워싱턴 발신, 전보 제1840호.", "육군부 경유 귀하의 제M25313호(1945년 8월 15일)에 대한 회신이다.", "오늘자 본인의 전보로 보낸 문서들 — 맥아더 장군 앞 지령과 그 부속서 (1) 일본 천황의 조서, (2) 항복문서 — 이 몰로토프가 귀하에게 한 진술에서 제기한 논점을 충분히 다루고 있다고 본인은 믿는다.", "우리가 아는 한 항복은 아직 일어나지 않았으며, 사절이 도착했다는 보고도 없다.", "이 문제들은 이제부터 맥아더 장군이 처리한다."], "primary": "워싱턴, 1945년 8월 15일—오후 7시.\n\n1840. 육군부 경유 1945년 8월 15일자 귀 제M25313호. 오늘 날짜 본인의 전보 [주4] 로 보낸 문서들, 즉 맥아더 장군 앞 지령과 그 부속서 (1) 일본 천황의 조서(Proclamation by the Emperor of Japan) 및 (2) 항복문서(Instrument of Surrender)는, 몰로토프가 귀하에게 한 진술에서 제기한 논점들을 충분히 다루고 있다고 본인은 믿습니다.\n\n우리가 아는 한 항복은 아직 일어나지 않았으며, 사절(emissaries)이 도착하였다는 보고도 아직 없습니다. 이 문제들은 이제부터 맥아더 장군이 처리하고 있습니다.\n\n번스", "secondary": "Washington, August 15, 1945—7 p.m.\n\n1840. Your No. M25313 via War Department, August 15, 1945. Documents sent in my telegram of today’s date, [주4] namely, Directive to General MacArthur with its annexes (1) Proclamation by the Emperor of Japan and (2) Instrument of Surrender, fully cover, I believe, the points raised by Mr. Molotov in his statement to you.\n\nNo surrenders have occurred to our knowledge nor have we any report that emissaries have as yet arrived. These matters are being dealt with from now on by General MacArthur.\n\nByrnes", "notes": ["[주4] 665면 각주 97 참조."], "note": "번역자 주 — 여기서 말하는 「맥아더 장군 앞 지령과 그 부속서」는 d431의 문서다. 「Proclamation by the Emperor of Japan」은 d431에서와 같이 천황 명의의 포고이며, 여기서는 「조서」로 옮기고 원어를 병기했다.", "warn": false, "pages": ["666"], "search": "Byrnes 번스(James F. Byrnes) — 국무장관 Harriman 해리먼(W. Averell Harriman) — 주소련 미국대사 Molotov 몰로토프(Vyacheslav M. Molotov) — 소련 외무인민위원 MacArthur 맥아더(Douglas MacArthur) — 연합국최고사령관"}, {"id": "d488", "order": 488, "date": "1945-11-23", "group": "X", "eyebrow": "d488 · The Acting Political Adviser in Japan (Atcheson) to the Secretary of State", "title": "주일 정치고문 대리(애치슨)가 국무장관에게", "badge": null, "list_right": "문서 488", "meta": [{"k": "일자", "v": "1945-11-23"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": "No. 67"}, {"k": "원문출처", "v": "No. 67 (동봉 1: Mr. Max W. Bishop의 대화 비망록, 1945년 11월 9일 / 동봉 2: 애치슨의 대화 비망록, 1945년 11월 9일 / 동봉 3: 애치슨의 대화 비망록, 1945년 11월 12일)", "txt": true}, {"k": "발신", "v": "주일 정치고문 대리 애치슨(George Atcheson, Jr.)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "보고(despatch) — 대화 비망록 3건 동봉"}], "links": [{"k": "FRUS", "text": "문서 488 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d488"}], "summary": "애치슨이 스즈키 내각 서기관장 사코미쓰 히사쓰네, 정보국의 가세 도시카즈, 전략폭격조사단의 갤브레이스에게 직접 들은 이야기를 대화 비망록 3건으로 묶어 보낸 것으로, 6월 말 어전회의부터 8월 14일 밤 조서 재가와 8월 15일 방송에 이르기까지 일본이 항복 결정에 도달한 경위를 일본 측 당사자의 진술로 재구성한다.", "points": ["쿠데타 우려: 「이때 육군이 어떤 종류의 쿠데타(coup d'état)를 시도하리라는 큰 두려움이 있었다. 따라서 광신적 군국주의자들(rabid militarists)을 속이기 위해 온갖 노력이 기울여졌다. 육군상 아나미(Anami) 대장 또한 사건을 막기 위해 그의 힘이 미치는 모든 일을 하였다.」 — 그러나 그 혼자서는 군국주의자들의 행동을 막을 수 없었고, 평화를 바라는 모든 이가 항복 전 한 주 동안 필사적으로 움직였다(사코미쓰는 자기 노력을 「고기가 지칠 때까지 어르는 노련한 어부」에 비유했다).", "실제 소동: 8월 15일 자정부터 오전 8시까지 육군이 궁성의 모든 출입구 앞에 병사를 배치해 출입을 막고 천황의 방송을 저지하려 했다. 동부군관구의 다나카(Tanaka) 대장이 직접 문으로 가 병사들을 설득해 물러가게 했다. 다른 군국주의자 무리는 총리 관저를 기관총으로 공격했고, 스즈키 총리와 히라누마 남작의 집이 군국주의자들에 의해 불탔다. 사코미쓰는 이를 「사소한 소란(minor disturbances)」에 그쳤다고 말한다.", "8월 14일 오후 11시 첫 조서(終戰詔書)가 완성·재가되었고, 천황 자신이 국민에게 직접 방송하기로 결정했다. 8월 15일 오전 4시 육군상(아나미)이 자결했고, 같은 날 오후 3시 스즈키 내각이 총사직을 상주했다.", "결정 경로: 6월 하순 천황이 스스로 어전회의(Gozenkai)를 소집해 종전을 위한 조치를 요청 → 7월 10일경 소련을 통한 간접 접근 결정(고노에 특사) → 7월 26일 포츠담 선언 → 8월 6일 히로시마 → 8월 9일 오전 과학자들이 원자탄임을 입증, 같은 날 이른 아침 소련 참전.", "8월 9일: 오전 8시 스즈키가 천황을 뵘 → 오전 9시 30분 6인 회합(어전회의 아님) → 오후 2시경 각의 → 결론 없이 오후 11시 어전회의 소집. 히라누마 기이치로 남작이 총리 측에 가담해 4대 3. 양측 누구도 물러서지 않아 천황이 직접 재결했다 — 메이지 유신 이래 처음으로 천황이 「휘장(curtain)」 뒤에서 나온 순간으로 사코미쓰는 묘사한다.", "8월 10일 오전 3시 어전회의 종료, 같은 날 오전 7시 연합국에 전보 발신. 8월 13일 오전 5시 연합국 회답 수신(일본의 최종 정체는 일본 국민의 자유로이 표명된 의사에 따른다).", "8월 14일 오전 10시 30분 어전회의: 참모총장 두 사람이 어전회의 청원 서명을 거부해 통상 절차를 우회했고, 천황이 스스로 6인과 전 각료를 소집했다. 천황은 자신의 의견에 모두가 따를 것을 요구하고, 앞으로 일본은 전쟁 수단에서 완전히 분리되어 무기와 군비 없이 진정한 영구 평화를 누리겠다고 말한 뒤 조서 기초를 명했다.", "군국주의의 관성: 육군 스스로도 전쟁 수행 능력에 대한 자신을 잃었으나, 군국주의의 힘과 관성은 「브레이크 없이 언덕을 굴러 내려가는 자전거」와 같아 멈출 방법이 없었고 육군 자신도 그만두는 법을 몰랐다 — 그래서 내각은 군국주의자를 멈춰 세울 「구실(peg/excuse)」이 될 사건이 필요했다(원폭과 소련 참전).", "「항복(surrender)」이라는 낱말: 사코미쓰는 첫 조서에서 그 말을 의식적으로 피했다고 밝히며, 「비상한 조치(extra-ordinary measure)」라는 두 낱말이 실제로 항복을 뜻한 것이라고 말한다. 9월 2일 조서에서는 그 말을 썼다.", "소련 중개 시도의 층위 차이: 사코미쓰는 7월 10일경 결정이라 하고, 가세 도시카즈는 자기와 기도 후작의 노력으로 7월 초 결정되어 7월 14일 이른 시각에 모스크바에 긴급 전보를 쳤다 하며, 갤브레이스가 전한 기도 후작의 말로는 첫 제의 전보가 6월 6일에 갔다고 한다."], "primary": "No. 67\n\n**주일 정치고문 대리(애치슨)가 국무장관에게**\n\n도쿄, 1945년 11월 23일.\n[12월 6일 접수.]\n\n각하: 본직은 본 사무소 직원 한 사람과 사코미쓰 히사쓰네(Sakomizu Hisatsune) 씨 — [701면] 스즈키[주58] 내각(1941년 4월 7일~8월 15일)의 서기관장(Chief Secretary) — 사이의 대화 비망록 사본을 동봉하는 영광을 갖습니다.\n\n이 대화에서 사코미쓰 씨는 다음을 지적하였습니다. 총리대신(스즈키)이 맨 처음 다룬 문제는 전쟁의 실제 상황에 대한 재검토였다는 것. 6월 하순에 천황이 어전회의를 소집하여 전쟁을 끝내기 위한 조치를 취할 것을 요청하였다는 것. 7월 10일경 소련 정부에 대하여 특사(고노에 공[주59])를 접수해 줄 것을 요청하는 접근이 이루어졌다는 것. 일본 측은 소비에트 러시아의 주선(good offices)을 이용할 생각이었다는 것. 포츠담 선언이 발표되기 전에 소련 정부로부터 아무런 회답도 받지 못하였다는 것. 내각의 일부 구성원, 특히 총리대신·해군대신[주60]·외무대신[주61]은 천황이 「폐지(abolished)」되지 않아도 된다는 양해에 이를 수 있다면 포츠담 선언이 일본의 항복을 위한 적합한 기초라고 말하였다는 것. 내각의 다른 구성원들은 두 가지 조건, 곧 일본에 대한 군사 점령이 없을 것과 해외의 모든 일본군을 자발적으로 소환할 것을 조건으로 해서만 포츠담 선언의 수락에 찬성하였다는 것. 8월 9일 천황이 위에 말한 양해와 함께 포츠담 선언을 수락하도록 친히 지시하였고, 다시 8월 14일에 천황이 포츠담 선언 및 일본 정부의 궁극적 형태에 관한 일본 측 질의에 대한 연합국의 회답에 기초하여 전쟁을 종결하는 조서(Imperial Rescript)를 준비하도록 지시하였다는 것.\n\n이와 관련하여, 정보국(Bureau of Information)의 가세[주62] 씨가 최근 본직에게 알려온 바에 따르면, 소련 정부를 설득하여 전쟁을 중개하도록 하려는 희망에서 7월 초에 모스크바로 대표단을 보내기로 결정이 이루어진 것은 그 자신의 노력과 내대신(Lord Keeper of the Privy Seal) 기도(Kido) 후작의 노력을 통해서였다고 하니, 흥미롭게 새겨둘 만합니다.[주63] 그는 덧붙이기를, 7월 14일 「긴급(urgent)」 전보가 모스크바로 발송되었으나 스탈린 대원수가 그날 저녁 포츠담으로 떠났기 때문에 일본 대사[주64]는 스탈린도 몰로토프도 만날 수 없었다고 하였습니다. 가세 씨는 그러므로 일본 측은 스탈린이 일본 측 제안을 포츠담으로 가지고 갔는지 여부를 알지 못하였다고 말하였습니다. 그러나 [702면] 스탈린이 쑹쯔원(T. V. Soong) 박사[주65]를 접견하고 있다는 것이 알려졌을 때, 일본 측은 자기들의 제안이 러시아 측의 고려를 받지 못하리라는 것을 깨달았습니다.\n\n전략폭격조사단(Strategic Bombing Survey)의 케네스 갤브레이스(Kenneth Galbraith) 씨는 본직에게, 기도 후작이 전략폭격조사단 일행에게 말하기를 일본 정부가 첫 제안을 6월 6일 모스크바로 타전하였고 그때 고노에가 모스크바로 갈 것을 제의하였다고 하였다고 알려왔습니다.\n\n가세 씨 및 갤브레이스 씨와의 본직의 대화 비망록 사본들을 동봉합니다.\n\n경구(敬具),\n\n조지 애치슨 2세(George Atcheson, Jr.)\n\n---\n\n**[동봉 1]**\n\n**주일 정치고문실의 맥스 W. 비숍(Max W. Bishop) 씨가 작성한 대화 비망록**\n\n[도쿄,] 1945년 11월 9일.\n\n참석자: 사코미쓰 히사쓰네 씨, 스즈키 내각(1941년 4월 7일~8월 15일) 전 서기관장;\n\n구보(Kubo) 씨;\n\n비숍 씨\n\n사코미쓰 씨는, 구보 씨의 제안에 따라 8월 15일에 발표된 항복에 이르기까지 일본에서 있었던 사태 전개의 자세한 내용을 비숍 씨에게 이야기하러 왔다고 말하였다. 천황과 스즈키 사이의 개인적 우의와 긴밀한 관계가 분명해지도록, 그는 다음을 설명하였다. 스즈키 총리는 1930년부터 1936년까지 천황의 시종무관장(Aide-de-Camp)이었다는 것. 스즈키는 1936년 2월 26일의 군사 반란 혹은 「사건(incident)」에서 습격을 받아 부상하였다는 것. 스즈키는 그 뒤 1936년 중 회복하자 추밀원 부의장에 임명되었고 1940년에는 의장이 되었다는 것. 그는 도조[주66]나 고이소[주67] 같은 총리들과 천황의 관계는 공적인 것이었으며, 따라서 스즈키가 총리로 임명됨으로써 천황은 개전 이래 처음으로 총리를 통하여 자신의 진심을 표현할 수 있게 되었다고 말하였다. 이하는 사코미쓰 씨의 서술이다.\n\n스즈키 내각이 맨 처음 다룰 문제는 전쟁의 실제 상황에 대한 완전한 재검토였다. 해군대신 요나이(Yonai) 대장과 스즈키 총리는 긴밀히 협력하며 육군에게는 완전히 비밀로 하는 가운데, 전쟁을 계속하는 것은 일본과 [703면] 일본 국민의 완전한 파멸을 뜻할 것이고, 또한 하루하루 계속될수록 세계 문명을 더욱 파괴하게 되리라는 결론에 이르렀다.\n\n6월의 마지막 열흘 동안, 천황은 — 그가 그 문제를 총리와 논의하였던 것은 의심의 여지 없이 사실이지만 — 누구로부터의 공식적 진언도 없이 자신의 뜻으로 어전회의(御前会議, Gozenkai)를 소집하였다. 이 회의에는 천황 앞에 여섯 사람이 참석하였다 — 총리대신, 육군대신[주68], 해군대신, 외무대신, 육군 참모총장[주69], 해군 군령부총장[주70]. 이 회합에서 천황은 전쟁을 종결시키기 위한 조치를 취할 것을 요청하였다.\n\n뒤이은 토의에서, 천황의 뜻을 받드는 데에는 두 가지 길이 있다고 결정되었다.\n\n1) 연합국들과 직접 교섭을 여는 것, 또는\n\n2) 제3자 혹은 중립국의 중개를 통하여 연합국에 간접적으로 접근하는 것.\n\n7월 초, 실제로는 10일경에, 러시아를 통하여 연합국에 접근하기로 결정되었다. (다른 정보원으로부터 알게 된 바로는, 이 결정에 주로 책임이 있었던 것은 외무대신 도고(Togo)였다.) 러시아에 일본의 특사를 받아들여 달라고 요청하는 전문이 주모스크바 일본 대사에게 발송되었다. 러시아 측은 그러한 특사를 보내는 목적과 그 특사에게 부여하려는 권한에 대한 충분한 설명을 요구하는 것으로 회답하였다. 일본 측은 두 가지 목적으로 특사를 보내고자 한다고 답하였다.\n\n1) 러·일 관계의 개선, 그리고\n\n2) 전쟁을 종결시키는 데에 러시아의 주선을 이용하는 문제의 협의.\n\n물론 근본 목적은 적대행위를 종결시키는 데에 러시아의 주선을 구하는 것이었다. 특사는 고노에 공(Prince Konoye)으로 하기로 결정되었다. (고노에 공을 택한 이유에 대한 설명으로, 사코미쓰 씨는 고노에 공이 1941년 10월 총리를 사임할 때 그 뒤 언제든 자기가 필요하게 되면 할 수 있는 무엇이든 하겠다고 천황에게 약속하였다고 진술하였다. 사코미쓰 씨는 고노에의 선정은 고노에가 천황에게 한 개인적 약속이 얽혀 있는 까닭에 설명하기가 다소 어렵다고 설명하였다.)\n\n일본 측 전문에 대한 어떠한 회답이 있기도 전에 스탈린 씨와 몰로토프 씨는 포츠담 회담을 위하여 모스크바를 떠나야 하였다. 소련 측의 회답은 그들이 돌아오는 대로 있을 것이라고 언명되었다. 소비에트 러시아의 주선을 [704면] 얻는 일이 가망 없다는 것이 일본 측에게 명백해 보였음에도 불구하고, 일본 정부는 그럼에도 사토(Sato) 대사에게 회답을 재촉하기를 계속하였다.\n\n7월 26일 포츠담 선언이 발표되었고, 일본 내각은 이를 면밀히 검토하여 이 선언이 일본의 항복을 위한 수락할 만한 기초를 이룬다는 결론에 이르렀다. 육군 자신도 전쟁을 계속할 능력에 대한 자신을 잃고 있었으나, 군국주의의 힘과 전쟁을 끌고 가는 관성은 「브레이크 없이 언덕을 굴러 내려가는 자전거」와 같았다. 그것을 멈출 방법이 없었고 육군 자신도 어떻게 그만두어야 할지 몰랐다. 따라서 군국주의자들을 강제로 멈춰 세우고 항복을 가져오기 위하여 이용할 만한 어떤 사태나 사건을 내각이 찾아내는 일이 필요하였다. 바로 이 시점에 원자폭탄이 히로시마에 투하되었다. 내각은 자기들의 항복 운동을 걸어둘 적합한 못(peg)을 찾았다고 느꼈다. 그러나 육군은 히로시마의 폭발이 실제로는 원자폭탄이 아니라 이미 알려진 폭약을 쓴 초대형 폭탄에 지나지 않는다고 주장하였다. 이 논쟁을 결말짓기 위하여 과학 전문가진이 히로시마로 파견되었다. 8월 9일 과학자들은 그것이 실제로 원자폭탄이라는 증거를 제출하였다. 같은 날 이른 아침 러시아가 참전하였다.\n\n스즈키 총리는 전쟁이 즉시 중지되어야 하며 원자폭탄과 러시아의 참전이 충분한 「구실(excuse)」 장치가 된다고 결정하였다. 그는 오전 8시경 천황에게 갔다. 천황은 전쟁이 종결되어야 하며 포츠담 선언에 기초하여야 한다는 데에 동의하였다. 궁성을 나온 뒤 총리는 같은 날 오전 9시 30분에 6월 하순의 어전회의에 참석하였던 바로 그 여섯 사람을 모았다. (8월 9일 오전의 이 회합은 어전회의가 아니었다.) 이때 다음이 결정되었다.\n\n(a) 포츠담 선언은 그것이 천황을 폐지하는 것을 포함하지 않는다는 양해와 함께라면 수락될 수 있다, 또는\n\n(b) 두 가지 조건과 함께라면 수락될 수 있다.\n\n1) 연합국 군대가 일본을 점령하지 않을 것;\n\n2) 일본이 자국의 명령으로 해외의 모든 자국 군인을 불러들이는 것이 허용될 것이며 항복이 해외에서 실행되지 않을 것.\n\n총리대신, 해군대신, 외무대신은 천황이 폐지되지 않는다는 양해와 함께 포츠담 선언을 수락하는 데에 찬성하였다. 육군대신과 육군 참모총장 및 해군 군령부총장은 위의 두 조건과 함께서만 포츠담 선언을 수락하는 데에 찬성하였다. 같은 날 오후, 8월 9일 2시경에 각의가 소집되었다. 표명된 대세는 총리대신, 해군대신 [705면] 및 외무대신의 견해와 일치하였다. 그러나 어떤 각료들은 자기 자신의 개인적 의견을 분명히 표명하고 그 의견에 책임을 질 만큼 「그릇이 크지(big enough)」 못하였다. 그들은 그저 총리대신에게 동의하겠다고만 진술하였다. 각의에서는 명확한 결정에 이르지 못하였고, 그리하여 총리대신은 천황에게 갔으며 8월 9일 밤 11시에 어전회의가 소집되었다.\n\n같은 여섯 핵심 인물과 추밀원 의장 히라누마 기이치로(Hiranuma Kiichiro) 남작, 그리고 사코미쓰 씨가 참석하였다. 히라누마 남작이 총리대신과 그 일파에 가담하여 표결은 4대 3이 되었다. 그때 천황에게, 보시는 바와 같이 회의에서 합의에 이르기가 불가능하며 자기들은 결정을 내릴 수 없으므로 천황께서 결정하시는 바가 무엇이든 그것을 따르는 것이 필요하다고 아뢰었다. 그러자 천황은 히라누마 남작, 총리대신 및 해군·외무 대신과 뜻을 같이한다고 표명하였다. 언제나 종래에는 회의가 천황을 직접 끌어들이지 않은 채 결정에 이르는 것이 관례였다 — 어느 한쪽이 양보하여 합의가 이루어질 수 있도록 하는 것이다. 그러나 이 경우에는 천황이 말할 때까지 어느 쪽도 양보하려 하지 않았다.\n\n(사코미쓰 씨는 이 중대한 회합에서의 극도의 긴장과 격정을 묘사하였다.) 참석한 모든 사람이, 그때까지 천황과 인민 사이에 드리워져 있던 「휘장(curtain)」이 걷혔다는, 그리고 메이지 유신 이래 처음으로 천황이 실제로 이 「휘장」 뒤에서 걸어 나와 인민 앞에 직접, 몸소, 그리고 인민의 편에 섰다는 느낌에 사로잡혔다. 그 경험은 너무나 격렬하게 감정적이어서 「눈물이 걷잡을 수 없이 흘렀다」. 참석자 모두가 그 자리의 「위대한 역사적 중요성」을 느꼈다. 천황과 인민 사이의 「휘장」이라는 비유를 씀으로써, 사코미쓰 씨는 천황과 어떠한 중요한 행위나 결정 사이에 어떤 사람이나 집단이 서고 그 사람 또는 집단이 그 결정이나 행위에 대한 책임을 지는 것이 관례였다는 사실을 가리킨 것이다.\n\n천황은 이어서 자신의 결정에 대한 이유를 말하였다. (사코미쓰 씨는 그 순간의 격정 때문에 천황이 말한 그대로의 낱말 하나하나를 다 기억할 수는 없으나 세 가지 점은 특히 분명하다고 말하였다.) 천황은 이렇게 말하였다.\n\n1) 전쟁의 맨 처음부터 군부의 계획과 정보는 실제 상황의 사실로부터 크게 동떨어져 있었다는 것;\n\n2) 전쟁을 계속하는 것은 일본 국민과 국가의 파멸을 뜻할 것이며 또한 세계 문명에도 재앙이 되리라는 것; 그리고\n\n3) 치러진 희생과 견디어 낸 고난을 돌이키는 것이 비록 슬프고 가슴 아픈 일이나, 그럼에도 [706면] 이러한 방식으로 이 시점에 전쟁을 종결하는 것은 신의 뜻과 세계의 운명에 부합한다는 것.\n\n(사코미쓰 씨는 곁들여, 천황의 진정한 심경의 한 예로서, 개전 당시 조서의 원안에는 미국 및 영국과의 전쟁이 불가피하게 되었다는 서술 뒤에 마침표가 있었으나 천황이 「이 어찌 짐의 뜻이겠는가(How far this is removed from my true wishes!)」라는 구절을 손수 써 넣었다는 점을 지적하였다.)\n\n어전회의는 8월 10일 오전 3시에 끝났고, 연합국들에 대한 전보가 같은 날 아침 오전 7시에 발송되었다. 8월 13일 오전 5시에 연합국들로부터 회답이 접수되었는데, 거기에는 일본의 궁극적 정체(政體)는 일본 국민의 자유로이 표명된 의사에 따를 것이라고 언명되어 있었다. 이 회답은 격론의 대상이 되었다 — 어떤 일본인들은 일본의 궁극적 정체를 결정할 수 있는 것은 오직 천황 자신뿐이라고 주장하였고, 다른 일본인들은 천황의 뜻과 인민의 뜻은 같은 것이며 천황의 뜻이 인민의 뜻을 포괄하고 그 역도 그러하다고 주장하였다. 후자의 무리는 연합국 회답의 즉각 수락을 촉구하였다.\n\n사코미쓰 씨 자신도 총리대신에게 이 길을 따르도록 진언하였다. 총리대신은 이미 같은 견해를 가지고 있었으며 즉시 일본의 즉각 항복을 촉구하였다. 육군대신과 군국주의자들은 요지부동으로 반대하였다. 해군은 갈라져 있었으며 해군대신 요나이 대장은 총리대신 편이었다. 이들 고관이 자기들끼리 합의에 이르지 못한 까닭에 또 한 차례의 어전회의를 여는 것이 필요해졌다. 그런데 어전회의를 청원하려면 세 사람, 곧 총리대신·육군 참모총장·해군 군령부총장의 서명이 필요하였다. 해군 군령부총장 도요다(Toyoda) 대장과 육군 참모총장은 서명을 거부하였고, 따라서 그들의 거부를 우회할 어떤 비상한 수단을 찾아내는 것이 요구되었다. (통상은 어전회의 소집을 위한 서명된 청원이 그러한 조치가 취해지기 전에 천황에게 제출된다.) 그리하여 스즈키 총리가 천황에게 여쭈었고, 천황은 자신의 발의로 여섯 핵심 고관과 내각의 다른 모든 구성원을 8월 14일 오전 10시 30분 어전회의에 소집하였다.\n\n육군대신, 육군 및 해군 참모총장은 일본 측 조건이 충족되지 않는 한 연합국 회답을 수락해서는 안 된다는 견해를 표명하였다. 이에 천황이 회의에서 말하기를, 자신은 이 시점에 자신의 의견을 표명하겠으며 모두가 자신의 견해에 동의할 것을 요구하겠다고 하였다. 그는 자신의 의견이 8월 9일 어전회의에서 표명한 것과 조금도 다르지 않다고, 앞으로 일본은 [707면] 전쟁을 수행할 수단으로부터 전적으로 분리되어 어떠한 무기나 군비도 갖지 않을 것이라고, 그리고 일본은 이러한 방식으로 어떠한 형태의 군국주의로부터도 완전히 분리되어 진정한 영구 평화를 누릴 것이며, 그리하여 무력으로 유지되지 않는 평화를 누리는 나라로서 세계 평화에 기여할 것이라고 말하였다. 이어서 천황은 내각에 전쟁을 종결하는 조서를 즉시 기초할 것을 명하였다.\n\n8월 10일 이래 사코미쓰 씨는 8월 9~10일 어전회의에서의 천황의 말씀의 대체적 윤곽을 따라 그러한 조서의 초안을 작성해 오고 있었다. 그러므로 14일 회합에서 천황이 개진한 추가적인 생각들을 삽입하기만 하면 되었다.\n\n(사코미쓰 씨는 이 대목에서, 전쟁을 종결하는 조서 가운데 특히 중요한 두 구절을 강조하고 싶다고 말하였다. 그것은 「만세를 위하여 태평을 열고자 하는 우리의 소망(Our wish to bring into realization great peace for the benefit of all future generations)」과 「짐은 언제나 그대들 선량하고 충량한 신민과 함께 있노라(We are always together with our good and loyal subjects)」였다. 그는 이어, 첫 조서에 「항복(surrender)」이라는 말이 쓰이지 않았다는 이유로 외국 언론에 얼마간의 비판이 있었음을 지적하였다. 그는 기초하면서 그 낱말을 쓰는 것을 의식적으로 피하였다고 말하였다. 그는 그때 자기와 모든 일본인이 겪고 있던 격렬한 감정을 이해하기가 어렵지 않을 것이라고 덧붙였다. 이 감정의 깊이 때문에 「항복」이라는 말을 명시적으로 쓰는 것이 불가능하였으니, 그는 그것이 그 문서의 장중함과 존엄을 덜어내고 따라서 모든 일본인에 대한 그 강력한 효과를 감소시켰으리라고 믿었다. 그는 될 수 있는 한 많은 존엄과 힘을 그 문서에 담으려고 의식적으로 애쓰고 있었다. 그는 덧붙이기를, 9월 2일 항복 조인 때에는 조서에 「항복」이라는 말이 쓰였으며 일본 국민은 그때에는 참된 상황을 이해하게 되어 「항복」이라는 말이 쓰이는 데에 대한 준비가 되어 있었다고 하였다. 첫 조서에서는 「비상한 조치(extra-ordinary measure)」라는 두 낱말이 실제로 항복을 뜻하였으며 그렇게 의도한 것이었다고 그는 느꼈다.)\n\n**첫 조서는 8월 14일 오후 11시에 완성되어 재가되었다. 천황 자신이 국민에게 직접 방송하기로 결정하였다.**\n\n**이때 육군이 어떤 종류의 쿠데타(coup d'état)를 시도하리라는 큰 두려움이 있었다. 따라서 광신적 군국주의자들(rabid militarists)을 속이기 위하여 온갖 노력이 기울여졌다. 육군대신 아나미(Anami) 대장 또한 사건(incident)을 막기 위하여 그의 힘이 미치는 모든 일을 하였다.** 그러나 그 혼자로서는 군국주의자들의 행동을 미리 막을 수 없었을 것이며, 평화를 바라는 모든 이가 항복 전 한 주 동안 필사적으로 움직였다. (사코미쓰 씨는 자신의 노력을 고기가 지쳐 늘어질 때까지 어르는 노련한 어부의 그것에 비유하여 묘사하였다.) 사소한 소란들만이 있었을 뿐이다. [708면] 8월 15일 자정부터 아침 8시까지 육군은 천황의 방송을 미리 막으려는 노력에서 궁성의 모든 출입구 앞에 병사들을 배치하여 누구도 드나들지 못하게 하였다. 동부군관구(Eastern Defense Command)의 다나카(Tanaka) 대장이 마침내 문으로 가서 몸소 병사들을 설득하여 물러가게 하였다. 다른 군국주의자 무리들은 총리대신 관저를 기관총으로 공격하였다. 스즈키 총리와 히라누마 남작의 집은 군국주의자들에 의하여 불태워졌다.\n\n8월 15일 오전 4시에 육군대신이 자결하였다. (사코미쓰 씨는 이 자결에 대하여 자못 흥미로운 설명을 하였다. 그는 진술하기를, 육군대신은 개인적으로는 전쟁을 계속하는 데에 아무런 자신이 없었고 전쟁이 멈추기를 바랐으나, 육군에 대한 충성 때문에 육군대신은 자신이 군국주의자들 편에 서야 한다고 느꼈으며, 사코미쓰 씨가 앞서 말한 대로 「브레이크 없이 언덕을 굴러 내려가는 자전거」와 같았던 군국주의의 힘에 종지부를 찍을 어떠한 방법도 찾을 수 없었다고 하였다. 그러므로 육군대신은 군국주의자들에게 「사죄」하기 위하여 자결하지 않으면 안 된다고 느꼈다. 사코미쓰 씨는 육군대신이야말로 자결이라는 사무라이 전통을 참으로 따른 유일한 사람이었다고 덧붙였다.)\n\n건강이 좋지 않고 지쳐 있던 스즈키 총리는 내각에서 놓여나기를 바랐다. 그는 한 내각이 항복에 서명하고 나서 곧바로 사직하는 것은 바람직하지 않으리라고 여겼다. 어느 정도의 기간이든 재임을 계속하도록 허락하지 않을 자신의 건강에 비추어, 스즈키 총리는 육군대신의 자결이라는 계기를 자신의 사표를 제출할 좋은 기회로 붙잡았다. (그가 총리로 계속하였더라면 새 육군대신을 얻고 내각을 개편하는 일이 필요하였을 것이다.) 그리하여 8월 15일 오후 3시에 스즈키 내각은 천황에게 총사직을 제출하였다.\n\n주(註): 이 시기 정부의 중요 구성원은 다음과 같았다.\n\n- 총리대신 스즈키 간타로(Suzuki Kantaro)\n- 외무대신 도고 시게노리(Togo Shigenori)\n- 해군대신 요나이 미쓰마사(Yonai Mitsumasa)\n- 육군대신 아나미 고레치카(Anami Korechika)\n- 서기관장 사코미쓰 히사쓰네(Sakomizu Hisatsune)\n- 추밀원 의장 히라누마 기이치로(Hiranuma Kiichiro) 남작\n- 육군 참모총장 우메즈 요시지로(Umezu Yoshijiro) 대장\n- 해군 군령부총장 도요다 소에무(Toyoda Soemu) 대장\n\n맥스 W. 비숍(Max W. Bishop)\n\n[709면]\n\n---\n\n**[동봉 2]**\n\n**주일 정치고문 대리(애치슨)가 작성한 대화 비망록**\n\n[도쿄,] 1945년 11월 9일.\n\n참석자: 가세 도시카즈(Kase Toshikazu) 씨, 정보국(Bureau of Information);\n\n애치슨 씨.\n\n가세 씨는 오늘 저녁 본직에게, 얼마 전부터 자신이 내대신 기도 후작과 매우 가까웠다고 말하였다. 그는 자신의 노력과 기도의 노력을 통하여, 1945년 7월 초 일본 정부 상층부에서 소련 정부로 하여금 미국 및 영국 정부와 「전쟁의 청산(liquidation of the war)」을 주선하도록 힘써 줄 것을 설득할 목적으로 모스크바에 대표단을 보내기로 결정되었다고 말하였다. 그는 자기 자신도 그 대표단의 일원이 될 예정이었으며, 7월 14일 이른 시각에 주모스크바 일본 대사에게 긴급 전보가 발송되었다고 말하였다. 스탈린은 그날 저녁 포츠담으로 떠났고, 대사는 그도 몰로토프도 만날 수 없었으나 몰로토프의 제2인자와 그 문제를 논의하였는데 그는 매우 정중하였으나 확답을 주지 않았으며, 따라서 일본 측은 스탈린이 그 제안들을 「호주머니에 넣어(in his pocket)」 포츠담으로 가지고 갔는지, 또 그러하다면 그가 그것들을 거기서 탁상에 올려놓을 것인지를 알지 못하였다. 그 뒤 스탈린이 쑹쯔원을 접견하고 있다는 것이 알려졌을 때, 일본 측은 소비에트 러시아의 「마음이 중국으로 돌아섰다」는 것과 일본의 화평 제안이 러시아 측의 고려를 받지 못하리라는 것을 깨달았다.\n\n조지 애치슨 2세(George Atcheson, Jr.)\n\n---\n\n**[동봉 3]**\n\n**주일 정치고문 대리(애치슨)가 작성한 대화 비망록**\n\n[도쿄,] 1945년 11월 12일.\n\n참석자: 케네스 갤브레이스(Kenneth Galbraith) 씨, 전략폭격조사단;\n\n애치슨 씨.\n\n갤브레이스 씨는 오늘 저녁 본직에게, 오후 동안 자신이 소속 일행의 구성원들과 내대신 기도 후작 사이의 회견에 배석하였다고 말하였다. 그는 기도가 그들에게 말하기를, 1945년 6월 6일 일본 정부가 모스크바에 전보를 보내어 소련 정부가 연합국에 제시할 화평 조건을 제의하도록 고노에가 모스크바로 갈 것을 제안하였으나 러시아 정부는 아무런 회답도 하지 않았다고 하였다고 말하였다.\n\n[710면]\n\n(과달카날, 사이판, 오키나와의 함락이 전쟁을 계속하려는 혹은 화평을 구하려는 일본 측 결의에 미친 영향을 알아보는 것은 흥미로울 것이다. 사이판이 진짜 전환점이었을지도 모른다.)\n\n조지 애치슨 2세(George Atcheson, Jr.)\n\n---\n\nII. 일본의 점령과 통제, 1945년 9월 2일~12월 31일 [주71]", "secondary": "No. 67\n\nTokyo, November 23, 1945.\n[Received December 6.]\n\nSir: I have the honor to enclose a copy of a memorandum of conversation between a member of this Office and Mr. Sakomizu Hisatsune, [701면] Chief Secretary of the Suzuki [주58] Cabinet (April 7 to August 15, 1941).\n\nDuring this conversation Mr. Sakomizu pointed out that the first question taken up by the Prime Minister (Suzuki) was a review of the actual situation of the war; that during the latter part of June the Emperor called an Imperial conference and asked that steps be taken to end the war; that about July 10 an approach was made to the Soviet Government to ask that a special envoy (Prince Konoye) [주59] be received; that the Japanese had in mind using Soviet Russia’s good offices; that no reply was received from the Soviet Government prior to issuance of the Potsdam Declaration; that certain members of the Cabinet, especially the Prime Minister, Navy Minister [주60] and Foreign Minister [주61] said that the Potsdam Declaration was a suitable basis for Japanese surrender if an understanding could be reached that the Emperor need not be “abolished”; that other members of the Cabinet favored acceptance of the Potsdam Declaration only under two conditions, no military occupation of Japan and voluntary recall of all Japanese troops abroad; that on August 9 the Emperor personally directed that the Potsdam Declaration be accepted with the above mentioned understanding and that again on August 14 the Emperor directed that an Imperial Rescript terminating the war be prepared on the basis of the Potsdam Declaration and the reply of the Allied Nations to the Japanese query concerning the ultimate form of the Japanese Government.\n\nIn this connection it is of interest to note that Mr. Kase [주62] of the Bureau of Information informed me recently that it was through his own efforts and those of Marquis Kido, Lord Keeper of the Privy Seal, that the decision had been reached early in July to send a delegation to Moscow in the hope of persuading the Soviet Government to mediate the war. [주63] He added that an “urgent” telegraphic message was sent to Moscow on July 14 but that as Generalissimo Stalin left that evening for Potsdam, the Japanese Ambassador [주64] had been unable to see either Stalin or Molotov. Mr. Kase said that therefore the Japanese were unaware whether Stalin had taken the Japanese proposals with him to Potsdam. However, when it became known that [702면] Stalin was receiving Dr. T. V. Soong, [주65] the Japanese realized that their proposals would not receive Russian consideration.\n\nMr. Kenneth Galbraith of the Strategic Bombing Survey has informed me that Marquis Kido told members of the Strategic Bombing Survey group that the Japanese Government telegraphed its first proposal to Moscow on June 6, and suggested at that time that Konoye proceed to Moscow.\n\nThere are enclosed copies of memoranda of my conversations with Mr. Kase and Mr. Galbraith.\n\nRespectfully yours,\n\nGeorge Atcheson, Jr.\n\n[Enclosure 1]\n\nMemorandum of Conversation, by Mr. Max W. Bishop of the Office of the Political Adviser in Japan\n\n[Tokyo,] November 9, 1945.\n\nParticipants: Mr. Sakomizu Hisatsune, Former Chief Secretary of the Suzuki Cabinet (April 7 to August 15, 1941);\n\nMr. Kubo;\n\nMr. Bishop\n\nMr. Sakomizu said that at Mr. Kubo’s suggestion he had come to tell Mr. Bishop the details of developments in Japan leading up to the surrender which was announced on August 15. In order that the relationship of personal friendship and close association between the Emperor and Suzuki would be clear, he explained that Prime Minister Suzuki had been the Emperor’s Aide-de-Camp from 1930 to 1936; that Suzuki had been assaulted and wounded in the military revolt or “incident” on February 26, 1936; and that Suzuki had later in 1936 upon his recovery, been made Vice President of the Privy Council, and in 1940 had become President. He said that the relationship between such Prime Ministers as Tojo [주66] and Koiso [주67] and the Emperor had been an official one, and that, therefore, with the appointment of Suzuki as Prime Minister, the Emperor was able for the first time since the outbreak of war to express his true feelings through the Prime Minister. Following is Mr. Sakomizu’s narrative:\n\nThe first question to be taken up by the Suzuki Cabinet was a complete re-examination of the real situation of the war. The Navy Minister, Admiral Yonai, and Prime Minister Suzuki, working closely together and in complete secrecy from the Army, reached the conclusion that to continue the war would mean utter destruction of Japan [703면] and the Japanese people, and would also, each day it continued, be further destructive of world civilization.\n\nDuring the last ten days of June, the Emperor of his own will and without official advice from anyone, although it was undoubtedly true that he had discussed the matter with the Prime Minister, called an Imperial Conference (Gozenkai). Six persons attended this Conference before the Emperor—the Prime Minister, the War Minister, [주68] the Navy Minister, the Foreign Minister, the Chief of Staff for the Army [주69] and the Chief of Staff for the Navy. [주70] At this meeting the Emperor asked that steps be taken to bring about an end to the war.\n\nIn the discussion which followed it was decided that there were two ways in which the Emperor’s wishes could be met:\n\n1)\n\nTo open direct communications with the Allied nations, or\n\n2)\n\nTo approach the Allies indirectly and through the mediation of a third party or neutral country.\n\nIt was decided in the first part of July, around the 10th actually, to make an approach to the Allies through Russia. (It has been learned from another source that Foreign Minister Togo was principally responsible for this decision.) A message was sent to the Japanese Ambassador in Moscow asking Russia to accept a special envoy from Japan. The Russians replied by asking for a full explanation of the purposes of sending such an envoy and of the powers which it was proposed to give to the special envoy. The Japanese replied that they desired to send a special envoy for two purposes:\n\n1)\n\nTo improve Russo-Japanese relations, and\n\n2)\n\nTo discuss the use of Russia’s good offices in bringing about an end to the war.\n\nThe fundamental purpose was, of course, to seek Russia’s good offices in terminating the hostilities. It was decided that Prince Konoye would be the special envoy. (As an explanation of the selection of Prince Konoye, Mr. Sakomizu stated that when Prince Konoye had resigned as Prime Minister in October of 1941, he had promised the Emperor that if he were needed at any time thereafter, he would do whatever he could. Mr. Sakomizu explained that selection of Konoye was rather difficult to explain as it involved a personal promise made by Konoye to the Emperor.)\n\nBefore any reply to the Japanese message was made, Mr. Stalin and Mr. Molotov had to leave Moscow for the Potsdam Conference. It was stated that the Soviet reply would be forthcoming upon their return. Although it seemed apparent to the Japanese that obtaining of [704면] Soviet Russia’s good offices was hopeless, the Japanese Government nevertheless continued to press Ambassador Sato for an answer.\n\nOn July 26, the Potsdam Declaration was issued and was carefully scrutinized by the Japanese Cabinet which came to the conclusion that this Declaration constituted an acceptable basis for Japanese surrender. Although the Army itself had lost confidence in its ability to continue the war, the force of militarism and the momentum which was carrying the war along were like a “bicycle rolling down hill without brakes”: there was no way to stop it and the Army itself did not know how to give up. It was therefore necessary for the Cabinet to discover some development or event on which to capitalize in order to force the militarists to halt and to bring about surrender. At this juncture the atomic bomb was dropped on Hiroshima. The Cabinet felt that it had found a suitable peg on which to pin its surrender movement; but the Army asserted that the explosion at Hiroshima was not really an atomic bomb but was merely a super-bomb using already known explosives. To settle this argument a scientific staff of experts was sent to Hiroshima. On August 9 the scientists submitted proof that it was actually an atomic bomb. Early on the same morning Russia entered the war.\n\nPrime Minister Suzuki decided that the war must be stopped immediately and that the atomic bomb and Russia’s entry were sufficient “excuse” devices. He went to the Emperor about 8:00 a.m. The Emperor agreed that the war should be brought to an end and on the basis of the Potsdam Declaration. After leaving the palace, the Prime Minister gathered together at 9:30 a.m. the same six men who had attended the Imperial Conference in the latter part of June. (This meeting in the morning of August 9 was not an Imperial Conference). At this time it was decided that:\n\n(a)\n\nThe Potsdam Declaration could be accepted with the understanding that it does not include abolishing the Emperor, or\n\n(b)\n\nThat it could be accepted with two conditions:\n\n1)\n\nThat Allied troops not occupy Japan;\n\n2)\n\nThat Japan be allowed to call back all its soldiers from abroad under its own orders and that surrender not be effected abroad.\n\nThe Prime Minister, the Navy Minister and the Foreign Minister favored the acceptance of the Potsdam Declaration with the understanding that the Emperor not be abolished. The War Minister and the Chief of Staff of the Army and the Chief of Staff of the Navy favored acceptance of the Potsdam Declaration only with the above two conditions. There was a Cabinet meeting called the same afternoon, August 9, about two o’clock. The consensus expressed was in agreement with the views of the Prime Minister, the Navy Minister [705면] and the Foreign Minister. However, some ministers were not “big enough” to express clearly their own individual opinions and to accept responsibility for those opinions; they merely stated that they would agree with the Prime Minister. No clear decision was reached at the Cabinet meeting and the Prime Minister then went to the Emperor and an Imperial Conference was called at eleven o’clock the night of August 9.\n\nThe same six key men and the President of the Privy Council, Baron Hiranuma Kiichiro, and Mr. Sakomizu were present. Baron Hiranuma joined with the Prime Minister and his group making the vote four to three. The Emperor was then told that, as he could see, it was impossible for an agreement to be reached by the conference, that they could not make a decision and that it was therefore necessary for them to follow whatever the Emperor decided. The Emperor then expressed his concurrence with Baron Hiranuma, the Prime Minister and the Navy and Foreign Ministers. Always before it had been the custom for a Conference to reach a decision without directly involving the Emperor—one side or the other yielding so that an agreement could be reached. But, in this instance neither side would yield until the Emperor spoke.\n\n(Mr. Sakomizu described the extreme tension and emotion at this important meeting.) Everyone present was impressed with the feeling that the “curtain” which had heretofore hung between the Emperor and the people was drawn aside, and that for the first time since the Meiji Restoration, the Emperor actually stepped from behind this “curtain” and came directly and personally before the people and on the side of the people. The experience was so intensely emotional that “tears flowed freely”. All present sensed the “great historic importance” of the occasion. By using the figure of a “curtain” between the Emperor and the people, Mr. Sakomizu had reference to the fact that it had been customary for someone or a group to stand between the Emperor and any important action or decision and for that person or group to accept responsibility for the decision or act.\n\nThe Emperor went on to give his reasons for his decision (Mr. Sakomizu said that because of the emotion of the moment, he could not remember every word as it had been uttered by the Emperor, but that three points were especially clear.) The Emperor said:\n\n1)\n\nThat from the very start of the war, the plans and information of the military had been far removed from the facts of the true situation;\n\n2)\n\nthat to continue the war would mean the destruction of the Japanese people and the country and would also be disastrous to world civilization; and\n\n3)\n\nthat although it was sad and moving to recall the sacrifices which had been made and the suffering which had been endured, nevertheless [706면] the termination of the war in this manner and at this time was in accordance with the will of God and the destiny of the world.\n\n(Speaking parenthetically and as an example of the real feeling of the Emperor, Mr. Sakomizu pointed out that in the original draft of the Imperial Rescript at the beginning of the war, there had been a period after the statement that war with the United States and Great Britain had become inevitable, but that the Emperor had himself inserted the phrase “How far this is removed from my true wishes!”)\n\nThe Imperial Conference closed at 3:00 a.m. on August 10 and a telegram to the Allied Nations was dispatched at 7:00 a.m. the same morning. On August 13 at 5:00 a.m. the reply was received from the Allied Nations in which it was stated that the ultimate form of government in Japan would depend upon the freely expressed will of the Japanese people. This reply was hotly debated—certain Japanese insisting that it was only the Emperor himself who could decide the ultimate form of government in Japan, other Japanese insisting that the Emperor’s will and the people’s will were the same thing, and that the Emperor’s will encompassed the people’s will and vice versa. The latter group urged immediate acceptance of the Allied reply.\n\nMr. Sakomizu himself advised the Prime Minister to follow this course. The Prime Minister already had the same view and at once urged Japan’s immediate surrender. The War Minister and the militarists were unalterably opposed. The Navy was divided with the Navy Minister, Admiral Yonai, on the side of the Prime Minister. Failure of these officials to reach an agreement among themselves made it necessary to hold another Imperial Conference. However, to petition for an Imperial Conference required the signature of three persons; the Prime Minister, the Chief of Staff of the Army and the Chief of Staff of the Navy. The Navy Chief of Staff, Admiral Toyoda, and the Army Chief of Staff refused to sign and it was therefore required that some extra-ordinary means of circumventing their refusal be found. (Ordinarily a signed petition to call an Imperial Conference is submitted to the Emperor before such action is taken.) Prime Minister Suzuki then consulted the Emperor, and the Emperor on his own initiative, summoned the six key officials and all other members of the Cabinet to an Imperial Conference on August 14, at 10:30 a.m.\n\nThe War Minister, the Chiefs of Staff of the Army and Navy expressed the view that the Allied reply should not be accepted unless Japanese conditions were met. The Emperor thereupon addressed the Conference and stated that he would express at that point his opinion and that he would require all to agree with his views. He said that his opinion was in no way different from that which he expressed at the Imperial Conference on August 9, that in the future, Japan [707면] would entirely be separated from the means to wage war and would be without any arms or armament, and that Japan would in this way enjoy true eternal peace, completely separated from any form of militarism and would thus contribute to world peace as a country enjoying peace not maintained by arms. The Emperor thereupon ordered the Cabinet immediately to draft an Imperial Rescript terminating the war.\n\nSince August 10, Mr. Sakomizu had been working on a draft for such an Imperial Rescript, following the general outline of the Emperor’s remarks at the Imperial Conference on August 9–10. It was therefore necessary merely to insert the additional ideas which the Emperor had set forth at the meeting on the 14th.\n\n(Mr. Sakomizu at this point said he wanted to emphasize two especially important phrases in the Imperial Rescript terminating the war. They were: “Our wish to bring into realization great peace for the benefit of all future generations” and “We are always together with our good and loyal subjects.” He went on to point out that there had been some criticism in the foreign press for the reason that in the first Imperial Rescript there had been no use of the word “surrender”. He said that in drafting he had consciously avoided using the word. He added it should not be difficult to understand the intense emotional feeling under which he and all Japanese were laboring at that time. This depth of emotion made it impossible to use specifically the word surrender which he believed would have detracted from the solemnity and dignity of the document and therefore would have lessened its powerful effect on all Japanese. He was consciously attempting to put as much dignity and force into the document as he could. He added that on September 2, at the time of the signing of the surrender, the word “surrender” was used in the Imperial Rescript and that the Japanese people by then had come to understand the true situation and were prepared for the use of the word “surrender.” In the first rescript he felt that the two words “extra-ordinary measure” actually meant surrender and had so intended.)\n\nThe first Imperial Rescript was completed and approved at 11:00 p.m. August 14. The Emperor himself made the decision to broadcast directly to the people.\n\nAt this time there was great fear that the Army would attempt some sort of coup d’état. Every effort was therefore made to deceive the rabid militarists. General Anami, the War Minister, also did all in his power to prevent an incident. However, he alone could not have forestalled action by the militarists, and all who favored peace worked strenuously during the week before surrender. (Mr. Sakomizu described his efforts as being like those of a skilled fisherman who plays the fish until it is exhausted.) There were only minor disturbances. [708면] From midnight of August 15 until 8:00 in the morning, the Army placed soldiers in the front of all entrances to the Palace and prevented anyone from going in or coming out, in an effort to forestall the broadcast of the Emperor. General Tanaka of the Eastern Defense Command finally went to the gates and personally persuaded the soldiers to depart. Other groups of militarists attacked the Prime Minister’s residence with machine guns. Prime Minister Suzuki’s and Baron Hiranuma’s home were burned by the militarists.\n\nOn August 15 at 4:00 a.m. the War Minister committed suicide. (Mr. Sakomizu gave a rather interesting explanation of this suicide. He stated that the War Minister personally had no confidence in continuing the war and wanted it to stop, but because of loyalty to the Army the War Minister felt that he had to be on the militarists’ side and could find no way to put an end to the force of militarism which, as Mr. Sakomizu had said earlier, was like a “bicycle rolling down hill without brakes”. The War Minister therefore felt that in order to “apologize” to the militarists, he had to commit suicide. Mr. Sakomizu added that the War Minister was the only one who truly followed the Samurai tradition of suicide.)\n\nPrime Minister Suzuki who was in poor health and exhausted, desired release from the Cabinet. He felt that it would not be advisable for a Cabinet to sign the surrender and then immediately resign. In view of his health which would not allow him to continue in office for any length of time, Prime Minister Suzuki seized upon the occasion of the suicide of the War Minister as a good opportunity to present his resignation. (It would have been necessary for him to obtain a new War Minister and re-organize his Cabinet had he continued as Prime Minister.) Accordingly on August 15 at 3:00 p.m. the Suzuki Cabinet submitted its resignation to the Emperor.\n\nNote: The following were important members in the government during this period:\n\nPrime Minister Suzuki Kantaro\n\nForeign Minister Togo Shigenori\n\nNavy Minister Yonai Mitsumasa\n\nArmy Minister Anami Korechika\n\nChief Secretary Sakomizu Hisatsune\n\nPresident of Privy Council Baron Hiranuma Kiichiro\n\nChief of Staff of the Army General Umezu Yoshijiro\n\nChief of Staff of the Navy Admiral Toyoda Soemu\n\nMax W. Bishop\n\n[709면]\n\n[Enclosure 2]\n\nMemorandum of Conversation, by the Acting Political Adviser in Japan (Atcheson)\n\n[Tokyo,] November 9, 1945.\n\nParticipants: Mr. Kase Toshikazu, Bureau of Information;\n\nMr. Atcheson.\n\nMr. Kase told me this evening that for some time he had been very close to Marquis Kido, Lord Keeper of the Privy Seal. He said that through his own efforts and those of Kido it was decided in higher Japanese Government circles early in July 1945 to send a delegation to Moscow for the purpose of persuading the Soviet Government to endeavor to arrange with the American and British Governments for the “liquidation of the war”. He said that he himself was to be a member of the delegation and that an urgent telegraphic message was sent to the Japanese Ambassador in Moscow early on July 14; that Stalin left that evening for Potsdam; that the Ambassador had been unable to see him or Molotov but had discussed the matter with Molotov’s number two who was very cordial but non-committal and the Japanese therefore did not know whether Stalin had taken the proposals to Potsdam “in his pocket” or whether, if so, he would lay them on the table there. Subsequently, when it became known that Stalin was receiving T. V. Soong, the Japanese realized that Soviet Russia’s “mind had turned to China” and that the Japanese peace proposals would not receive Russian consideration.\n\nGeorge Atcheson, Jr.\n\n[Enclosure 3]\n\nMemorandum of Conversation, by the Acting Political Adviser in Japan (Atcheson)\n\n[Tokyo,] November 12, 1945.\n\nParticipants: Mr. Kenneth Galbraith, Strategic Bombing Survey;\n\nMr. Atcheson.\n\nMr. Galbraith told me this evening that during the afternoon he had been present at an interview by members of his group with Marquis Kido, Lord Keeper of the Privy Seal. He said that Kido told them that a telegram was sent by the Japanese Government to Moscow on June 6, 1945, proposing that Konoye go to Moscow to propose peace terms for the Soviet Government to put forth to the Allies but that the Russian Government made no reply.\n\n[710면]\n\n(It would be interesting to learn the effect upon Japanese determination to keep on with the war or seek peace of the capture of Guadalcanal, Saipan, Okinawa; Saipan may have been the real turning point.)\n\nGeorge Atcheson, Jr.\n\nII. Occupation and control of Japan, September 2–December 31, 1945 [주71]", "notes": ["[주58] 스즈키 간타로 남작 해군대장(Adm. Baron Kantaro Suzuki), 일본 총리대신, 1945년 4월 7일~8월 15일.", "[주59] 고노에 후미마로 공(Prince Fumimaro Konoye), 일본 총리대신, 1937년 6월~1939년 1월 및 1940년 7월 22일~1941년 10월 16일. (원문 각주에는 October가 「Octoher」로 오식되어 있다.)", "[주60] 요나이 미쓰마사 해군대장(Adm. Mitsumasa Yonai).", "[주61] 도고 시게노리(Shigenori Togo).", "[주62] 가세 도시카즈(Toshikazu Kase), 일본 외무성.", "[주63] 모스크바와의 왕복에 관한 자료는 Foreign Relations, The Conference of Berlin (The Potsdam Conference), 1945, vol. ii, pp. 1248 이하를 보라.", "[주64] 사토 나오타케(Naotake Sato).", "[주65] 중화민국 행정원장(Premier).", "[주66] 도조 히데키 대장(Gen. Hideki Tojo), 일본 총리대신, 1941년 10월 18일~1944년 7월 18일.", "[주67] 고이소 구니아키 대장(Gen. Kuniaki Koiso), 일본 총리대신, 1944년 7월 21일~1945년 4월 5일.", "[주68] 아나미 고레치카 대장(Gen. Korechika Anami).", "[주69] 우메즈 요시지로 대장(Gen. Yoshijiro Umezu).", "[주70] 도요다 소에무 해군대장(Adm. Soemu Toyoda).", "[주71] Report of Government Section, Supreme Commander for the Allied Powers: Political Reorientation of Japan, September 1945 to September 1948 (Washington, Government Printing Office [1949]), 2 vols. (제2권에 기본 문서들이 실려 있다), 그리고 Department of State publication No. 2671, Far Eastern Series 17: Occupation of Japan: Policy and Progress (Washington, Government Printing Office, 1947)도 아울러 보라."], "note": "번역자 주 — 1. 이 문서는 항복 결정을 「사후에 일본 측 당사자에게 직접 들어 재구성한」 것이다. 전언의 층위를 본문에서 구분되게 옮겼다. (가) 애치슨의 송부장 본문 — 애치슨 자신이 사코미쓰·가세·갤브레이스에게 들은 내용의 요약. (나) 동봉 1 — 비숍이 적은 사코미쓰의 진술이며, 「Following is Mr. Sakomizu's narrative(이하는 사코미쓰 씨의 서술이다)」 이후는 전부 사코미쓰의 말이다. 원문에서 괄호로 묶인 대목은 비숍이 사코미쓰의 부연이나 설명을 표시한 것이므로 괄호를 그대로 살렸다. (다) 동봉 2·3 — 애치슨이 직접 적은 가세·갤브레이스와의 대화. 동봉 3의 기도 후작 발언은 갤브레이스가 애치슨에게 전한 것으로, 두 단계 전언이다.\n\n2. 애치슨 자신의 판단이 드러나는 곳은 두 군데뿐이다. 송부장의 「it is of interest to note(흥미롭게 새겨둘 만하다)」와 동봉 3 말미 괄호 안의 「사이판이 진짜 전환점이었을지도 모른다」이다. 후자는 원문에서도 괄호에 들어 있으며 애치슨의 사견이다.\n\n3. 「(It has been learned from another source that Foreign Minister Togo was principally responsible for this decision.)」의 「another source(다른 정보원)」는 원문이 밝히지 않는다. 이 괄호는 비숍이 넣은 것으로 보이나 확정할 수 없어 그대로 두었다.\n\n4. 원문 오식으로 보이는 곳을 고치지 않고 그대로 두었다. 송부장과 동봉 1의 참석자 항목 모두에서 스즈키 내각의 기간이 「(April 7 to August 15, 1941)」로 적혀 있으나 각주 58은 「1945」로 되어 있다. 1945년이 옳으나 본문은 원문대로 「1941년」으로 옮기고 여기에 적어둔다. 각주 59의 「Octoher」도 원문 오식이며 그대로 옮기고 notes_ko에 표기했다.\n\n5. 시대적·감정적 표현을 다듬지 않고 그대로 옮겼다. 「rabid militarists 광신적 군국주의자들」, 「the militarists 군국주의자들」, 「some ministers were not 'big enough' 어떤 각료들은 그릇이 크지 못하였다」, 「'excuse' devices 「구실」 장치」, 「a suitable peg on which to pin its surrender movement 항복 운동을 걸어둘 적합한 못」, 「a bicycle rolling down hill without brakes 브레이크 없이 언덕을 굴러 내려가는 자전거」, 「tears flowed freely 눈물이 걷잡을 수 없이 흘렀다」. 이 문서에는 'Japs' 같은 멸칭은 나오지 않는다. 다만 「the Japanese」와 「the Japs」를 구별할 필요가 없었다는 사실 자체를 적어둔다.\n\n6. 직명 번역. Chief Secretary of the Cabinet은 「내각 서기관장」이 정식 역어이나 원문이 「Chief Secretary」이므로 「서기관장」으로 옮기고 처음에 원어를 병기했다. Chief of Staff for the Navy는 일본 측 실제 직명이 해군 군령부총장이므로 그렇게 옮겼으나, 원문은 육군·해군을 모두 'Chief of Staff'로 적는다. Aide-de-Camp는 시종무관장으로 옮겼다(스즈키는 1929~1936년 시종장이었으므로 원문의 직명 표기가 부정확할 수 있다 — 원문대로 두고 여기에 적는다). Lord Keeper of the Privy Seal은 내대신, President of the Privy Council은 추밀원 의장.\n\n7. 인명 표기. 원문은 모두 로마자이며 한자를 주지 않는다. 통용 한국어 표기를 앞에 두고 로마자를 병기했다. 이름 없이 성만 나오는 인물(Kubo 구보, Tanaka 다나카, Kido 기도)은 로마자를 살리고 people에 그 사실을 적었다. 다나카는 「General Tanaka of the Eastern Defense Command」로만 나오며 이름은 원문에 없다.\n\n8. 조서 인용구는 원문이 영역(英譯)이다. 한국어로 옮기면서 영문을 괄호에 병기하여 원문이 무엇이었는지 대조할 수 있게 했다. 일본어 원문의 문구로 되돌리지 않았다 — 이 문서의 정본은 영역이다.\n\n9. Gozenkai(御前会議)는 원문이 로마자 표기를 괄호에 넣어 두었으므로 「어전회의(御前会議, Gozenkai)」로 첫 등장에만 병기했다.\n\n10. 시각은 모두 원문 그대로 살렸다. 8월 9일 오전 8시 / 오전 9시 30분 / 오후 2시경 / 밤 11시, 8월 10일 오전 3시 / 오전 7시, 8월 13일 오전 5시, 8월 14일 오전 10시 30분 / 오후 11시, 8월 15일 자정~오전 8시 / 오전 4시 / 오후 3시.", "warn": false, "pages": ["700", "701", "702", "703", "704", "705", "706", "707", "708", "709", "710"], "search": "George Atcheson, Jr. 조지 애치슨 2세 — 주일 정치고문 대리(Acting Political Adviser in Japan). 본 보고의 발신자이자 동봉 2·3의 작성자 Max W. Bishop 맥스 W. 비숍 — 주일 정치고문실 직원. 동봉 1(사코미쓰와의 대화 비망록) 작성자 Sakomizu Hisatsune 사코미쓰 히사쓰네 — 스즈키 내각 서기관장. 이 문서의 주된 정보원 Kubo 구보 — 사코미쓰와 비숍의 면담을 주선한 인물. 원문에 성만 나오고 직명 없음 Suzuki Kantaro 스즈키 간타로 — 총리대신(해군대장·남작). 1930~1936년 천황 시종무관장, 1936년 2·26 사건에서 피습, 추밀원 부의장·의장 역임 Anami Korechika 아나미 고레치카 — 육군대신(대장). 쿠데타를 막고자 힘썼고 8월 15일 오전 4시 자결 Yonai Mitsumasa 요나이 미쓰마사 — 해군대신(해군대장). 스즈키와 함께 육군 몰래 전황 재검토 Togo Shigenori 도고 시게노리 — 외무대신. 소련을 통한 접근 결정에 주로 책임이 있었다고 「다른 정보원」이 전함 Umezu Yoshijiro 우메즈 요시지로 — 육군 참모총장(대장). 어전회의 청원 서명 거부 Toyoda Soemu 도요다 소에무 — 해군 군령부총장(해군대장). 어전회의 청원 서명 거부 Hiranuma Kiichiro 히라누마 기이치로 — 추밀원 의장(남작). 8월 9일 밤 어전회의에서 총리 측에 가담해 4대 3을 만듦. 자택이 군국주의자들에 의해 소실 Kido Koichi 기도(Marquis Kido) 후작 — 내대신(Lord Keeper of the Privy Seal). 원문에는 이름 없이 성만 표기됨 Kase Toshikazu 가세 도시카즈 — 정보국(Bureau of Information). 각주 62에 따르면 일본 외무성 소속 Konoye Fumimaro 고노에 후미마로 — 공작(Prince). 대소련 특사로 내정 Sato Naotake 사토 나오타케 — 주모스크바 일본 대사 Tojo Hideki 도조 히데키 — 전 총리대신(대장) Koiso Kuniaki 고이소 구니아키 — 전 총리대신(대장) Tanaka 다나카 — 동부군관구(Eastern Defense Command) 대장(General). 8월 15일 궁성 앞 병사들을 몸소 설득해 물러가게 함. 원문에 성만 표기 The Emperor 천황(히로히토) — 원문에는 「the Emperor」로만 나오고 이름은 나오지 않는다 Stalin 스탈린 — 대원수(Generalissimo) Molotov 몰로토프 T. V. Soong 쑹쯔원 — 중화민국 행정원장 Kenneth Galbraith 케네스 갤브레이스 — 미국 전략폭격조사단(Strategic Bombing Survey)"}, {"id": "d507", "order": 507, "date": "1945-09-27", "group": "A", "eyebrow": "d507 · The Acting Political Adviser in Japan (Atcheson) to the Secretary of State", "title": "주일본 정치고문 대리(애치슨)가 국무장관에게", "badge": null, "list_right": "문서 507", "meta": [{"k": "일자", "v": "1945-09-27"}, {"k": "시각", "v": "발신 1945년 9월 27일 (시각 표기 없음) / 접수 9월 29일 오후 1시 (Received September 29—1 p.m.)"}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": "3"}, {"k": "원문출처", "v": null, "txt": true}, {"k": "발신", "v": "주일본 정치고문 대리 애치슨(George Atcheson, Jr.)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 507 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d507"}], "summary": "도쿄와 그 인근의 정황·여론을 빠르게 둘러본 첫인상으로서 SCAP에 제출한 각서를 전문(轉電)한 것으로, 국민 사이의 얼떨떨한 느낌과 전쟁이 끝났다는 큰 안도·패배에 대한 체념·앞으로의 처우에 대한 불안, 패배의 사실은 거의 보편적으로 받아들여지되 죄책감이나 수치심은 그렇지 않다는 점, 지도층의 두 갈래, 그리고 새 사회·경제 구조의 창출은 점진적이어야 한다는 판단을 담았다.", "points": ["전보번호 3. 도쿄 9월 27일 발신, 9월 29일 오후 1시 접수.", "각서는 어디까지나 「첫인상」이며, 도쿄와 그 바로 인근의 정황·의견을 빠르게 둘러본 데 근거한 것임을 스스로 인정하고 있다 — SCAP에 제출된 것을 그대로 옮겨 보낸다.", "(a) 많은 민중에게서 어떤 얼떨떨한 느낌(dazed feeling)이 감지되기는 하나, 사람들의 일반적 반응은 전쟁이 끝났다는 큰 안도, 패배에 대한 체념, 그리고 일본이 받게 될 처우에 대한 불안이다.", "(b) 패배라는 사실은 사실상 보편적으로 받아들여지고 있다. 그러나 그 수용에 보편적인 죄책감이나 수치심이 따르지는 않는다. 일본의 인종·습속·문화에 대한 긍지는 널리 남아 있다. (제대로 다루면 이 요소는 미국의 정책 수행에 유용할 수 있다.)", "(c) 지도층은 두 갈래로 갈리는 것으로 보인다 — 첫째, 활동을 대체로 일반 행정과 점령군 명령의 집행에 한정하는 듯한 정부·행정 관리들. 둘째, 일본 정치생활에 민주적 활동의 겉모습을 만들어 내려는 기회주의적 아귀다툼으로 느껴지는 일에 분주한 일부 인사들.", "(d) 예상대로, 앞으로 한두 세대 동안 일본에서 일어나야 할 변화를 이끌어 갈 것으로 합리적으로 기대할 만한 뚜렷한 지도의 틀은 아직 나타나지 않았다. 정부의 군사적 등뼈가 부서진 마당에 그런 지도력에 생명을 불어넣을 개별 지도자들도 아직 나오지 않았다.", "충격으로부터의 회복, 오랜 군국주의적 지도·지배가 갑작스레 제거된 일, 그리고 겨우 목숨을 잇는 일조차 극도로 어려운 사정 — 이런 요인들 때문에 진보적이고 지성 있는 지도력의 공백은 상당 기간 메워지지 않을 것 같다.", "다른 한편, 근면과 점령군과의 협력을 통해 일본의 지위를 회복하겠다는 결의의 기색은 널리 나타나고 있다.", "(e) 새로운 일본의 경제·사회 구조의 창출은 여러 해에 걸쳐 현명하게 착수되고 조심스레 지켜보며 길러야 할 점진적 과정일 수밖에 없다. 갑작스레 이루어질 수 없다.", "점령 초기 단계에서 바라는 사회·경제적 변화를 — 어쩌면 해체에 이를 정도로 — 가속하려 드는 것은 바람직하지 않아 보인다. 전쟁으로 이어진 고급 정책 결정에 연루되었거나 전쟁에 관여했을 수 있는 책임 있는 지도자 전원을 즉시 완전히 근절하는 따위의 조치는 바로 이 시점에서는 매우 교란적일 수 있으며, 점진적으로 또 현지 사정이 명하는 바에 따라 진행되어야 한다."], "primary": "도쿄, 1945년 9월 27일.\n[접수 9월 29일 오후 1시]\n\n3. 다음 각서는, 인정컨대 또 부득이하게 도쿄와 그 바로 인근의 정황과 의견을 빠르게 둘러본 데 근거한 첫인상만을 나타내는 것으로서 SCAP에 제출되었다.\n\n「(a) 많은 민중 쪽에서 어떤 얼떨떨한 느낌이 감지되기는 하나, 사람들 사이의 일반적 반응은 전쟁이 끝났다는 커다란 안도, 패배에 대한 체념, 그리고 일본에 주어질 처우에 관한 불안이다.\n\n(b) 패배라는 사실은 사실상 보편적으로 받아들여지고 있다. 그러나 이 수용에 보편적인 죄책감이나 수치심이 따르는 것은 아니다. 일본의 인종·습속(mores)·문화에 대한 긍지는 여전히 널리 퍼져 있다. (제대로 다룬다면 이 요소는 미국의 정책들을 실행하는 데 값진 것이 될 수 있다.)\n\n「(c) 지도층은 두 범주로 갈리는 것으로 보인다.\n\n첫째,\n\n활동을 대체로 일반 행정과 점령군 명령의 집행에 한정하는 것으로 보이는 정부·행정 관리들의 지도층.\n\n둘째,\n\n일본의 정치생활에 민주적 활동의 겉모습을 만들어 내려는, 기회주의적인 아귀다툼으로 느껴지는 일에 분주히 종사하는 일부 인사들의 지도층. 정부 관리들과, 새로운 민주적 사회·정치 관행을 소리 높여 주장하는 이 사람들의 지도자들이, 평화롭고 신뢰할 만한 일본으로 점진적으로 진화해 가기 위한 건전한 기본 계획을 세울 수 있을지, 또 세우려 할지를 판단하기에는 아직 이르다.\n\n「(d) 예상되었던 대로, 앞으로 한두 세대 동안 일본에서 일어나야만 하는 변화들을 이끌어 낼 것으로 합리적으로 의지할 수 있을 뚜렷한 지도의 틀은 아직 나타나지 않았다. 마찬가지로, 정부의 군사적 등뼈가 파괴된 터라 그러한 지도력에 생명을 줄 수 있는 개별 지도자들도 아직 나서지 않았다. 일본의 장래에 관한 불확실성이 그러한 지도자들의 출현을 막는 데 크게 어른거리고 있는 것으로 보인다. 충격으로부터의 회복이 필요하다는 것, 오랫동안 이어져 온 군국주의적 지도와 국정 전반에 대한 [725면] 지배가 갑작스레 제거되었다는 것, 그리고 그저 살아남는 일조차 극도로 어렵다는 것 — 이러한 요인들은 진보적이고 지성 있는 지도력의 공백이 상당 기간 메워지지 않으리라는 점을 시사한다. 다른 한편으로, 근면과 점령군과의 협력을 통해 일본의 지위를 회복하겠다는 결의의 정신이 널리 드러나고 있다.\n\n「(e) 모든 관찰은, 새로운 일본의 경제·사회 구조의 창출이 여러 해에 걸쳐 현명하게 착수되고 조심스럽게 지켜지며 길러져야 할 점진적 과정일 수밖에 없다는 사실을 거듭 강조한다. 그것은 갑작스레 이루어질 수 없다. 점령의 초기 단계에서, 바라는 사회적·경제적 변화를 — 어쩌면 해체에 이를 지경까지 — 가속하려고 시도하는 것은 바람직하지 않아 보인다. 전쟁으로 이어진 고급 정책의 결정들에 이전에 연루되었거나 전쟁에 관여하였을 수 있는 책임 있는 지도자 전원을 즉시 완전히 근절하는 것과 같은 조치는, 바로 이 시점에서는 대단히 교란적일 수 있으며, 점진적으로 또 현지 사정이 명하는 바에 따라 진행되어야 한다.」\n\n애치슨", "secondary": "Tokyo, September 27, 1945.\n[Received September 29—1 p.m.]\n\n3. Following memorandum submitted to SCAP as representing only initial impressions admittedly and necessarily based upon quick survey of conditions and opinions in Tokyo and immediate environs:\n\n“(a) Although one senses a certain dazed feeling on the part of many of the populace, the general reaction among the people is one of great relief that the war is finished, of resignation to defeat and of anxiety in regard to the treatment to be given Japan.\n\n(b) There is practically universal acceptance of the fact of defeat. This acceptance is not, however, accompanied by a universal sense of guilt or shame. Pride in Japanese race, mores, and culture remains widespread. (Properly handled, this factor may be valuable in implementing United States policies.)\n\n“(c) Leadership appears to fall into two categories;\n\n1st,\n\nthat of government and administrative officials who seem to limit their activities largely to general administration and execution of orders of the occupation forces; and\n\n2nd,\n\nthat of certain individuals who are busily engaged in what is felt to be opportunistic scrambling to create a surface appearance of democratic activity in Japanese political life. It is too early to determine whether government officials and leaders of these highly vocal proponents of new democratic social and political practices can or will develop sound basic programs for the gradual evolution of a peaceful and reliable Japan.\n\n“(d) As was to be expected, there has not yet emerged a clear pattern of leadership which could reasonably be relied upon to develop the changes which must take place in Japan during the next one or two generations. Similarly, with the military backbone of the government destroyed, there have not yet come forward the individual leaders who can give life to such leadership. Uncertainty in regard to Japan’s future seems to loom large in preventing the emergence of such leaders. Factors such as necessary recovery from shock and sudden elimination of long standing militaristic direction and domination [725면] of all National affairs, and the extreme difficulty of bare existence, make it unlikely that the vacuum in progressive and intelligent leadership will be filled for a considerable period of time. On the other hand, there is wide evidence of a spirit of determination to recover Japan’s position through diligence and cooperation with the occupying forces.\n\n“(e) All observations reemphasize the fact that creation of a new Japanese economic and social structure must necessarily be a gradual process wisely initiated and carefully watched and fostered for many years. It cannot be accomplished suddenly. It would appear undesirable, in the initial stages of occupation, to attempt to accelerate, perhaps to the point of disintegration, the desired social and economic changes. Such measures as the immediate complete eradication of all responsible leaders who may formerly have been implicated in decisions of high policy which led to war or were concerned with war, might be highly disturbing at this particular juncture and should be proceeded with gradually and as local circumstances dictate.”\n\nAtcheson", "notes": [], "note": "번역자 주 — 원문에 문서 표제와 출처 파일번호(source_note)가 실려 있지 않아 title_en은 FRUS의 이 시기 애치슨 도쿄 전보의 표제 관례를 따랐고 source_note는 null로 두었다. 「SCAP」은 연합국최고사령관(Supreme Commander for the Allied Powers)으로, 원문 약어를 그대로 두었다. (c)항의 「1st,」「2nd,」와 항목 사이의 줄바꿈은 원문 조판 그대로 유지하였다. 인용부호는 원문에서 (a)·(c)·(d)·(e) 앞에만 여는 따옴표가 붙고 (b) 앞에는 없는데, 원문 표기를 그대로 옮겼다. 「mores 습속」, 「Pride in Japanese race 일본 인종에 대한 긍지」 등 이 시대 문서의 인종·민족 일반화 표현은 다듬지 않고 그대로 옮겼다. 「one senses」·「appears」·「seem」·「would appear」 등은 모두 관찰·추정의 어조로 옮겼다.", "warn": false, "pages": ["724", "725"], "search": "George Atcheson, Jr. 조지 애치슨 2세 — 주일본 정치고문 대리"}, {"id": "d514", "order": 514, "date": "1945-10-02", "group": "A", "eyebrow": "d514 · The Acting Political Adviser in Japan (Atcheson) to the Secretary of State", "title": "주일본 정치고문 대리(애치슨)가 국무장관에게", "badge": null, "list_right": "문서 514", "meta": [{"k": "일자", "v": "1945-10-02"}, {"k": "시각", "v": "발신 1945년 10월 2일 (시각 표기 없음) / 접수 10월 8일 오전 11시 42분 (Received October 8—11:42 a.m.)"}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": "13"}, {"k": "원문출처", "v": null, "txt": true}, {"k": "발신", "v": "주일본 정치고문 대리 애치슨(George Atcheson, Jr.)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 514 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d514"}], "summary": "일본 외무성이 중립국 외교관들에 대해 「평화는 교섭된 것」이며 대(對)중립국 관계에서 일본 정부의 지위가 항복 전과 같다는 주장을 유지하려 하고 전쟁이 「멈춰졌다」는 통념을 조장하고 있다고 보고하면서, 일본 정부로 하여금 중립국 공관과의 관계를 연합국 군사령부를 통해서만 하도록 지시하는 방안을 미국 정부가 진지하게 고려할 것을 건의한 전보.", "points": ["전보번호 13. 도쿄 10월 2일 발신, 10월 8일 오전 11시 42분 접수.", "믿을 만한 외교 소식통으로부터 알게 된 바로는, 일본 외무성이 이곳 중립국 외교관들과의 관계에서 평화가 교섭된 것(peace was negotiated)이라는 주장, 그리고 중립국 및 그들의 대일 관계에 대해 일본 정부가 항복 전과 같은 지위를 여전히 갖고 있다는 주장을 유지하려 애쓰고 있다.", "일본 외무성 구성원들이 현직 일본 관리들 가운데 가장 반동적이고 관료적인 축에 든다는 징후도 얼마간 있다.", "사정에 밝은 일본 소식통에 따르면, 외무성은 전쟁이 「멈춰졌다(stopped)」는 통념을 조장하는 데 적극적이며, 그리하여 일본이 완전히 패배했다는 이해와 자각이 널리 퍼지는 것을 가로막고 있다.", "외무성이 지금 수행하는 일부 기능과 임무는 일본 점령의 목적상 바람직할 수 있으나, 일본 정부가 중립국 외교공관과의 관계를 오직 연합국 군사령부를 통해서만 하도록 지시하는 것이 바람직한지를 미국 정부가 진지하게 고려해야 한다고 본다.", "이 조치를 중립국들이 문제 삼을 수 있음을 알고 있으나, 포츠담 선언의 이행에 이바지하고 여러 바람직한 목적의 달성을 향한 적극적 진전이 되므로 정당하다고 믿는다.", "중립국들이 자국 수도에서 일본 공관과의 관계를 끊으라는 우리 요구에는 이의를 볼 수 있겠으나, 이곳 일본 외무성에 대한 위 제한은 군사 점령의 긴급한 필요로서 강하게 반대할 근거는 없어 보인다.", "재외 일본 외교요원의 소환은 가까운 장래에 취할 또 하나의 바람직한 조치가 될 수 있다."], "primary": "도쿄, 1945년 10월 2일.\n[접수 10월 8일 오전 11시 42분]\n\n13. 믿을 만한 외교 소식통으로부터 우리가 이해하는 바로는, 일본 외무성은 이곳 중립국 외교관들과의 관계에서 평화가 교섭된 것이며 일본 정부는 중립국들 및 그들의 대일 관계에 대하여 항복 이전에 지녔던 것과 같은 지위를 여전히 지니고 있다는 주장을 유지하려 애쓰고 있다. 또한 일본 외무성 구성원들이 현재 재직 중인 일본 관리들 가운데 가장 반동적이고 관료적인 축에 속한다는 징후도 얼마간 있다. 사정에 밝은 일부 일본 소식통에 따르면, 외무성은 전쟁이 「멈춰졌다」는 일반적 믿음을 조장하려는 노력에 적극적이며, 그리하여 일본이 완전히 패배하였다는 이해와 자각이 널리 퍼지는 것을 방해하고 있다.\n\n외무성이 현재 수행하고 있는 어떤 기능과 임무들은 일본 점령의 목적을 위하여 바람직할 수도 있으나, 우리는 미국 정부가 일본 정부로 하여금 중립국 외교공관과의 관계를 오직 연합국 군사령부를 통하여서만 수행하도록 지시하는 것이 바람직한지에 대하여 진지한 고려를 기울여야 한다고 느낀다. 이 조치가 중립국들에 의하여 문제로 제기될 수 있음은 알고 있으나, 우리는 그것이 포츠담 선언의 이행에 기여하고 여러 바람직한 목적의 달성을 향한 적극적인 한 걸음이 된다는 점에서 정당하다고 믿는다. 나아가 중립국 정부들이 자국 수도에 있는 일본 외교공관과의 관계를 끊어 달라는 우리의 요청에 대해서는 [734면] 이의를 볼 수도 있겠으나, 이곳 일본 외무성에 대하여 제안된 위와 같은 제한에 대해서는, 그것이 군사 점령의 긴급한 필요인 이상 그들이 반대할 만한 강한 근거는 없어 보인다. 재외 일본 외교요원의 소환은 가까운 장래에 취해야 할 또 하나의 바람직한 조치가 될 수 있을 것이다.\n\n애치슨", "secondary": "Tokyo, October 2, 1945.\n[Received October 8—11:42 a.m.]\n\n13. We understand from a reliable diplomatic source that Japanese Foreign Office is endeavoring in its relations with neutral diplomats here to maintain that peace was negotiated and that Japanese Government still holds same position vis-à-vis neutral countries and their relations with Japan as it held before surrender. There is also some indication that members of Japanese Foreign Office are among the most reactionary and bureaucratic of Japanese officials now in office. According to some informed Japanese sources, Foreign Office is active in efforts to foster general belief that the war was “stopped,” thus hindering development of widespread understanding and realization that Japan was utterly defeated.\n\nWhile certain functions and duties now performed by the Foreign Office may be desirable for the purposes of the occupation of Japan, we feel that serious consideration should be given by the American Government to the desirability of directing the Japanese Government to conduct its relations with neutral diplomatic missions only through Allied Military Headquarters. It is realized that this action might be questioned by neutral countries, but we believe it justified as contributing to the carrying out of the Potsdam Declaration and as an affirmative step forward in the accomplishment of various desirable objectives. Furthermore, while neutral governments might perceive [734면] objection to our requesting that they cease relations with Japanese diplomatic missions in their own capitals, there would not seem to be strong ground on which they could object to the suggested restriction on Japanese Foreign Office here as exigency of military occupation. Recall of Japanese diplomatic personnel abroad might constitute a further desirable step to be taken in near future.\n\nAtcheson", "notes": [], "note": "번역자 주 — 원문에 문서 표제와 출처 파일번호가 실려 있지 않아 title_en은 FRUS의 이 시기 애치슨 도쿄 전보의 표제 관례를 따랐고 source_note는 null로 두었다. 「Japanese Foreign Office」는 일본 외무성(外務省)이다. 「Allied Military Headquarters」는 연합국 군사령부로 옮겼다 — 원문이 SCAP이라는 약어 대신 이 표현을 쓴 점을 그대로 살렸다. 「it appears」·「there would not seem to be」·「we feel」 등은 관찰·의견의 어조를 그대로 유지하였다. 원문의 따옴표 「stopped」와 「peace was negotiated」의 인용 여부 차이도 원문대로 두었다(전자만 원문에 따옴표가 있다).", "warn": false, "pages": ["733", "734"], "search": "George Atcheson, Jr. 조지 애치슨 2세 — 주일본 정치고문 대리"}, {"id": "d524", "order": 524, "date": "1945-10-10", "group": "A", "eyebrow": "d524 · The Acting Political Adviser in Japan (Atcheson) to the Secretary of State", "title": "주일본 정치고문 대리(애치슨)가 국무장관에게", "badge": null, "list_right": "문서 524", "meta": [{"k": "일자", "v": "1945-10-10"}, {"k": "시각", "v": "발신 1945년 10월 10일 (시각 표기 없음) / 접수 10월 10일 오후 1시 (Received October 10—1 p.m.)"}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": "31"}, {"k": "원문출처", "v": null, "txt": true}, {"k": "발신", "v": "주일본 정치고문 대리 애치슨(George Atcheson, Jr.)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 524 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d524"}], "summary": "10월 4일 맥아더 장군이 헌법 개정을 말한 뒤 고노에 공(公)이 다카기 교수를 대동하고 비공식으로 찾아와 조언을 구하자, 훈령이 아직 없는 상태에서 애치슨이 개인적·비공식 의견으로 메이지 헌법의 결함 일곱 가지를 열거해 준 내용을 요약 보고하고, 헌법 개정 지침 초안의 전보 요약을 서둘러 보내 줄 것을 청한 전보.", "points": ["전보번호 31. 도쿄 10월 10일 발신, 같은 날 오후 1시 접수. 헌법 개정 지침 초안의 전보 요약을 요청한 10월 4일자 제18호 전보를 참조한다.", "10월 4일 고노에(近衞)가 맥아더 장군을 방문했고(애치슨 배석), 그 자리에서 장군은 고노에에게 「일본 헌법은 개정되어야 한다」고 말하였다. 그 결과로 고노에가 제국대학 다카기 교수를 대동하고 어젯밤 자신의 요청으로 비공식 방문을 하였다.", "고노에가 조언과 제안을 구하였으나 이 문제에 관한 훈령이 없었으므로, 애치슨은 개인적·비공식 의견을 일반적 성격으로만 제시하였다.", "1. 국민을 대표한다고 표방하는 유일한 정부 부문인 중의원(House of Representatives)이 제한된 권한만 누렸다. 내각은 중의원에 책임을 지지 않았고, 헌법에는 내각이 중의원의 신임을 얻어야 하고 불신임 표결로 무너져야 한다는 따위의 규정이 전혀 없었다. 예산 통제권은 제한적이고 황실 비용에는 통제권이 없었다. 귀족원이 부결한 법안을 법률로 만들 권한이 없어 귀족원이 입법을 무한정 가로막을 수 있었다. 상급 권력의 자의적 명령에 따라 해산되고 재선거에 부쳐질 수 있었다.", "2. 존재하던 「권리장전」에서는 각 권리가 「법률의 범위 내에서」라는 제한으로 거세되어 있었다. 선거권자에 관한 명시가 없었고, 중앙집권적 경찰 통제와 중앙집권적 교육 통제의 폐해로부터 국민을 지키는 장치도 없었다.", "3. 귀족원은 어떤 의미로도 민주적이지 않았고 귀족·재계 인사·고액 납세자만을 대표하면서 비상한 통제력을 행사하였다.", "4. 정부에 맞선 국민의 권리를 사법적으로 보호하거나 관리를 탄핵할 규정이 없었다.", "5. (장차 존재한다면) 육군·해군 대신을 규율·통제하여 정부에 책임을 지게 하고, 그리하여 군국주의자들이 헌법적 방법으로 얻지 않은 권력 — 천황에의 직접 상주권, 취임 거부로 내각 구성을 막는 권한 등 — 을 통하여 정부를 틀어쥐지 못하게 할 규정이 없었다. 민주적 헌법이라면 그러한 관직을 문민(civilian)으로 요구할 것이다.", "6. 추밀원(Privy Council)은 중의원과 국민의 권리를 억제하는 데 봉사하는 초정부적 기구였다.", "7. 국민의 대표가 헌법 개정을 발의하고 채택할 수 없고, 천황이 거부권을 무시하며 의회 폐회 중에 법을 제정하고 그 법을 존속시키기 위해 의회를 열지 않을 수 있다면, 「자유롭게 표명된 국민의 의사」를 반영하는 정부는 있을 수 없다.", "고노에는 천황이 개정에 찬성하며 자신도 이를 위해 적극 활동하겠다는 뜻을 내비쳤다. 그는 추가 논의를 청하고 그 목적으로 다카기도 접견해 줄 것을 요청하였다.", "따라서 국무부가 참조 전보에서 요청한 자료의 발송을 서둘러 준다면 도움이 되겠다. 공문서(despatch)가 뒤따른다.[주27]"], "primary": "도쿄, 1945년 10월 10일.\n[접수 10월 10일 오후 1시]\n\n31. 헌법 개정에 관한 지침 초안의 전보 요약을 요청한 우리 10월 4일자 제18호를 참조함. 제국대학 다카기 교수[주25]를 대동하고, 고노에[주26]가 자신의 요청에 따라 어젯밤 나를 비공식으로 방문하였다. 이는 10월 4일 그가 맥아더 장군을 방문한 결과인데, 그 자리에는 내가 배석하였고 그 자리에서 장군은 고노에에게 일본(Jap) 헌법은 개정되어야 한다고 말하였다. 고노에는 나에게 조언과 제안을 구하였다. 이 주제에 관한 지침이 없었으므로, 나는 다음과 같이 일반적 성격의 개인적·비공식 의견을 제시하였다.\n\n(요약 시작) 1. 국민을 대표한다고 표방하는 유일한 정부 부문인 중의원은 제한된 권한만을 누렸다. 내각은 중의원에 대하여 책임을 지지 않았고, 헌법에는 예컨대 내각이 중의원의 신임을 얻어야 하며 불신임 표결로 무너져야 한다는 어떠한 규정도 없었다. 중의원은 예산에 대하여 제한된 통제권만을 가졌고 황실 비용에 대하여는 아무런 통제권도 갖지 못하였다. 중의원은 귀족원이 부결한 뒤에는 그 법안을 법률로 통과시킬 권능이 없었으며, 귀족원은 입법을 무한정 가로막을 수 있었다. 중의원은 상급 권력의 자의적인 명령에 따라 해산되고 재선거에 부쳐질 수 있었다.\n\n2. 존재하고 있던 「권리장전」이라 할 것에서는, 각 권리가 「법률의 범위 내에서」라는 제한에 의하여 거세되어 있었다. 선거권자에 관한 명시가 없었고, 중앙집권적 경찰 통제와 중앙집권적 교육 통제의 폐해로부터 국민을 지키는 장치도 없었다.\n\n3. 귀족원은 어떠한 의미에서도 민주적이지 않았고, 귀족·재계 인사·고액 납세자만을 대표하였으며, 국민 의사의 뒷받침을 두고 비상한 통제력을 행사하였다.\n\n4. 정부에 대한 국민의 권리를 사법적으로 보호하거나 관리를 탄핵하기 위한 규정이 없었다.\n\n5. (장차 존재하게 된다면) 육군대신·해군대신을 규율하고 통제하여 그들을 정부에 대하여 책임지게 하고, 그리하여 군국주의자들에게서 천황에의 직접 상주권이나 취임을 거부함으로써 내각 구성을 가로막는 권한과 같이 헌법적 수단으로 얻지 아니한 권력을 통한 정부 장악을 박탈할 규정이 없었다. 민주적 헌법이라면 그러한 관직은 문민이어야 한다고 요구할 것이다.\n\n6. 추밀원은 중의원과 국민의 권리를 억제하는 데 복무하는 초정부적 기구였다.\n\n7. 국민의 대표들이 헌법 개정을 발의하고 채택할 수 없다면, 또 천황이 거부권을 무시할 수 있고 의회가 열려 있지 않을 때 법을 제정할 수 있으며 그러한 법을 존속시키기 위하여 의회를 열지 않은 채 둘 수 있다면, 「자유롭게 표명된 국민의 의사」를 반영하는 정부란 있을 수 없다. (요약 끝)\n\n[740면]\n\n고노에는 천황이 개정에 찬성한다는 뜻과, 자신이 이를 위하여 적극적으로 활동하겠다는 뜻을 내비쳤다. 그는 우리가 더 논의하기를 청하였고, 그 목적으로 내가 다카기(Tagaki)도 접견해 줄 것을 요청하였다. 따라서 국무부가 참조 전보에서 요청한 자료의 발송을 서둘러 준다면 도움이 되겠다. 공문서가 뒤따른다.[주27]\n\n애치슨", "secondary": "Tokyo, October 10, 1945.\n[Received October 10—1 p.m.]\n\n31. Reference our No. 18, October 4 requesting telegraphic summary of draft directive on revision of constitution. Accompanied by Professor Takagi [주25] of Imperial University, Konoye [주26] called on me informally last evening at his request as result of his call on General MacArthur October 4 at which I was present and at which the General told Konoye that Jap constitution must be revised. Konoye asked me for advice and suggestions; lacking the directive on this subject, I offered personal, unofficial comment on general character as follows:\n\n(Begin summary) 1. House of Representatives, only Govt branch purporting to represent the people, enjoyed only limited powers. Cabinet was not responsible to it and constitution lacked any provision whereby, for example, Cabinet must have confidence of House and fall upon vote of censure. House had only limited control over budget and none over expenditures of Imperial household. It was not competent to pass a bill into law after disapproval thereof by House of Peers which could interminably block legislation. It was subject to dissolution and to facing reelection on arbitrary dictum of higher authority.\n\n2. In such “Bill of Rights” as existed, each right was emasculated by restriction to “within limits of the law”. There was no specification of the electorate, no guarding of people from evils of centralized police control and centralized control of education.\n\n3. House of Peers was not democratic in any sense, represented only nobles, financiers and payers of high taxes and exercised extraordinary control with support of people’s will.\n\n4. There was no provision for judicial protection of people’s rights as against govt for impeachment of officials.\n\n5. There was no provision to regulate and control War, Navy Ministers (if there should be any in future), to make them responsible to the govt and thus deprive militarists of grip on govt through powers not acquired by constitutional means such as direct access to throne and power to block formation of Cabinet by refusing to serve; democratic constitution would require such officials to be civilian.\n\n6. Privy Council was extra-governmental body serving in restraint of House of Representatives and people’s rights.\n\n7. There could not be a govt reflecting “freely expressed will of the people” if the people’s representatives could not initiate and adopt amendments to the constitution and if Emperor could override the veto, enact laws when Diet not in session and keep Diet out of session in order to continue such laws. (End summary)\n\n[740면]\n\nKonoye indicated that Emperor was in favor of revision and that he himself would actively work therefor. He asked that we have further discussions and that I also receive Tagaki for that purpose. It would accordingly be helpful if Dept could expedite sending of material requested in reference telegram. Despatch follows. [주27]\n\nAtcheson", "notes": ["[주25] 다카기 야사카(Yasaka Takagi, 高木八尺), 도쿄 제국대학 미국헌법·정치 교수.", "[주26] 고노에 후미마로 공(Prince Fumimaro Konoye, 近衞文麿), 전 일본 총리, 10월 9일까지 무임소대신.", "[주27] 공문서 제6호, 10월 10일자, 수록하지 않음."], "note": "번역자 주 — 원문에 문서 표제와 출처 파일번호가 실려 있지 않아 title_en은 FRUS의 이 시기 애치슨 도쿄 전보의 표제 관례를 따랐고 source_note는 null로 두었다. 원문은 맥아더의 발언을 옮기며 「Jap constitution」이라는 멸칭 표기를 쓰고 있다 — 다듬지 않고 「일본(Jap) 헌법」으로 원어를 병기해 두었다. 원문에서 다카기의 로마자 표기가 앞에서는 「Takagi」, 뒤에서는 「Tagaki」로 엇갈리는데 각각 그대로 살렸다(각주 25는 Takagi). 3항의 「exercised extraordinary control with support of people's will」은 문맥상 「without support(국민 의사의 뒷받침 없이)」의 전보 탈자일 가능성이 있으나 단정하지 않고 원문 그대로 「국민 의사의 뒷받침을 두고」로 직역하였다 — 원문 대조가 필요한 대목이다(confidence를 medium으로 둔 주된 이유). 「House of Representatives 중의원」, 「House of Peers 귀족원」, 「Privy Council 추밀원」, 「Diet 의회(제국의회)」, 「Imperial household 황실」로 옮겼다. 전보 특유의 축약(「Govt」, 「Dept」)은 우리말로 풀었다. 이 문서가 말하는 헌법은 대일본제국헌법(메이지 헌법)이나, 원문에 그 명칭이 없으므로 본문에는 넣지 않았다.", "warn": true, "pages": ["739", "740"], "search": "George Atcheson, Jr. 조지 애치슨 2세 — 주일본 정치고문 대리 Douglas MacArthur 더글러스 맥아더 — 연합국최고사령관(SCAP) Prince Fumimaro Konoye 고노에 후미마로 공 — 전 일본 총리, 10월 9일까지 무임소대신 Yasaka Takagi 다카기 야사카 — 도쿄 제국대학 미국헌법·정치 교수 Emperor 천황 — 원문 표기 그대로"}, {"id": "d526", "order": 526, "date": "1945-10-10", "group": "A", "eyebrow": "d526 · The Acting Political Adviser in Japan (Atcheson) to the Secretary of State", "title": "주일본 정치고문 대리(애치슨)가 국무장관에게", "badge": null, "list_right": "문서 526", "meta": [{"k": "일자", "v": "1945-10-10"}, {"k": "시각", "v": "발신 1945년 10월 10일 (시각 표기 없음) / 접수 10월 12일 오후 3시 25분 (Received October 12—3:25 p.m.)"}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": "37"}, {"k": "원문출처", "v": null, "txt": true}, {"k": "발신", "v": "주일본 정치고문 대리 애치슨(George Atcheson, Jr.)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 526 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d526"}], "summary": "내각 교체와 10월 4일 최고사령관의 사상통제법 폐지·정치범 석방 명령이 준 충격으로 일본의 정치 활동이 빨라지고 있음을 보고하면서, 새 내각의 성격(범용하고 보수적이며 국민선거 전까지의 임시방편으로 보인다)과 정당 결성의 난맥상, 그리고 대다수 국민이 생계 문제에만 골몰하여 정치에 무관심해 보인다는 관찰을 전한 전보.", "points": ["전보번호 37. 도쿄 10월 10일 발신, 10월 12일 오후 3시 25분 접수.", "내각 교체[주29]와 사상통제법 폐지·정치범 석방에 관한 10월 4일 최고사령관 명령이 준 충격으로 일본의 정치 활동이 빨라지고 있다.", "포츠담 선언 아래 정부가 무엇을 해야 하는지 이해하지 못하여 실패한 이전 내각과 비교하면, 새 내각은 스스로의 행동으로 바라는 변화들을 앞질러 갈 조짐이 있다.", "그러나 이 시도에서 새 내각이 얼마나 성공할지는 두고 보아야 한다 — 각료 가운데 누구도 천황에 가깝지 않고, 두드러진 추진력이나 위신을 지니지도 않았다.", "새 정당들이 마구잡이로 결성되고 있으나 지금까지 활력을 보이는 것은 세 집단뿐이다. 하토야마가 「자유(Liberal)」당을 이끌고 있으며, 그는 지금은 없어진 정우회(政友會)의 간사장을 지낸 인물이다.", "공산당과 사회당. 바로 지금 공산당 지도자들이 옥에서 풀려나고 있다.", "정통파 내지 보수파 지도자들과 우익 세력은 조용히 있으나, 의심할 바 없이 상당한 영향력을 계속 행사하고 있다.", "대다수 국민은 정치에 관한 한 무관심해 보이며, 주로 생계라는 절박한 문제를 생각하고 있다.", "새 내각은 보수성의 기색이 더 짙다(1939년에 내무대신[주30]은 국민정신총동원연맹의 회장이었고, 대정익찬회의 전 사무총장이다).", "새 내각은 범용하며, 겉보기에는 연합국의 요구를 맞추려는 노력을 이어가고 국민선거로 뽑힐 새 정부에 길을 트기 위한 임시적 구성으로 보인다.", "미국이 전범으로 볼 만하다고 여겨진 자들은 피하고, 국제적 교분과 경험이 있는 자들이 뽑혔는데, 이는 자격이나 개인적 능력보다는 미국에 받아들여질 만하다는 이유가 컸을 것이다.", "현 내각의 노력이 앞선 내각의 노력보다 성공적일 가능성은 충분하나, 임시방편 이상으로 볼 수 있을지는 의문이다."], "primary": "도쿄, 1945년 10월 10일.\n[접수 10월 12일 오후 3시 25분]\n\n37. 내각 교체[주29]와, 사상통제법의 폐지 및 정치범의 석방에 관한 10월 4일 최고사령관 명령이 준 충격으로 일본의 정치 활동이 빨라지고 있다. 포츠담 선언 아래에서 정부가 무엇을 하여야 하는지를 이해할 수 없었던 까닭에 실패한 이전 내각과 비교하면, 새 내각은 스스로의 행동으로 바라는 변화들을 앞질러 갈 조짐이 보인다.\n\n이 시도에서 새 내각이 얼마나 성공적일지는 두고 보아야 한다. 각료 가운데 누구도 천황에 가깝지 않으며, 두드러진 추진력이나 위신을 지니고 있지도 않기 때문이다. 새로운 정당들이 마구잡이로 결성되고 있으나 지금까지 얼마간의 활력을 보이는 것은 세 집단뿐이다. 하토야마가 「자유」당을 이끌고 있는데, 그는 지금은 없어진 정우회의 간사장을 지낸 사람이다.\n\n[741면]\n\n공산당과 사회당. 바로 지금 공산당 지도자들이 옥에서 풀려나고 있다. 정통파 내지 보수파 지도자들과 우익 세력은 조용히 있으나, 의심할 여지 없이 상당한 영향력을 계속 행사하고 있다. 대다수 주민은 정치에 관한 한 무관심해 보이며, 대체로 생계라는 절박한 문제들을 생각하고 있다.\n\n새 내각은 보수성의 기색을 더 많이 보인다(1939년에 내무대신[주30]은 국민정신총동원연맹의 회장이었으며, 대정익찬회의 전 사무총장이다). 새 내각은 범용하며, 겉보기에는 연합국의 요구를 충족시키려는 노력을 이어가고 국민선거 뒤에 선출될 새 정부에 길을 트기 위하여 다만 임시적으로 짜인 것으로 보인다. 미국이 전범으로 여길 법하다고 생각된 자들은 피해졌고, 국제적인 교분과 경험을 가진 자들이 뽑혔는데, 이는 아마도 어떤 자격이나 개인적 능력 때문이라기보다는 미국에 받아들여질 만하다는 점 때문이었을 것이다. 현 내각의 노력은 앞선 내각의 노력보다 훨씬 성공적일 수도 있겠으나, 그것을 임시방편 이상으로 볼 수 있을지는 의문이다.\n\n애치슨", "secondary": "Tokyo, October 10, 1945.\n[Received October 12—3:25 p.m.]\n\n37. Japanese political activity is speeding up with the Cabinet change [주29] and the shock which was given by the 4 October order of the Supreme Commander concerning the abolition of thought control laws and the release of political prisoners. Compared with the previous Cabinet which failed because it was not able to understand what the Government was supposed to do under the Potsdam Declaration there are signs that the new Cabinet will by their own actions anticipate the desired changes.\n\nHow successful in this attempt the new Cabinet will be remains to be seen, as none of its members are close to the throne nor do they possess outstanding forcefulness or prestige. New political parties are being formed in a haphazard fashion with only three groups up till now showing any vitality. Hatoyama is leading the “Liberal” party, he being formerly the defunct Seiyukai’s executive director.\n\n[741면]\n\nCommunist and Socialist parties. Just now are the Communist leaders being freed from prison. The orthodox or conservative leaders and the rightist elements are keeping quiet but they continue to exercise considerable influence, no doubt. Most of the population appears to be apathetic as far as politics are concerned, thinking mostly about the urgent problems of livelihood.\n\nThe new Cabinet shows more signs of conservatism (in 1939 the Home Minister [주30] was the President of the National Spiritual Mobilization League; and is the former Director of the Imperial Rule Assistance Association). The new Cabinet is mediocre and was designed apparently only temporarily in order to carry on the efforts to meet the requirements of the Allies and to clear the way for the new Government which will be chosen after a national election. Those who were thought likely to be considered as war criminals by the U.S. were avoided and those were chosen who had had international acquaintanceship and experience, probably more because of their acceptability to the U.S. than for any qualifications or individual abilities. The efforts of the present Cabinet may very well be more successful than the efforts of the preceding Cabinet but whether it can be considered as more than a stop gap is doubtful.\n\nAtcheson", "notes": ["[주29] 시데하라 기주로 남작(Baron Kijuro Shidehara, 幣原喜重郎)이 10월 9일 총리가 되어, 히가시쿠니노미야 나루히코 왕(Prince Naruhiko Higashi-Kuni, 東久邇宮稔彦, 8월 17일~10월 5일)의 뒤를 이었다.", "[주30] 호리키리 젠지로(Zenjiro Horikri)."], "note": "번역자 주 — 원문에 문서 표제와 출처 파일번호가 실려 있지 않아 title_en은 FRUS의 이 시기 애치슨 도쿄 전보의 표제 관례를 따랐고 source_note는 null로 두었다. 「Hatoyama」는 이름 없이 성만 나와 있어 하토야마 이치로로 단정하지 않고 로마자를 살렸다. 각주 30의 「Zenjiro Horikri」는 원문 표기 그대로이며 「Horikiri(호리키리)」의 탈자로 보이나 단정하지 않았다 — 이 점이 confidence를 medium으로 둔 이유의 하나다. 「National Spiritual Mobilization League」는 국민정신총동원연맹, 「Imperial Rule Assistance Association」은 대정익찬회(大政翼贊會)로 옮겼다. 「Seiyukai」는 정우회(政友會)다. 「Director/executive director」는 각각 사무총장·간사장으로 옮겼으나 원어 직함과 정확히 대응하는지는 확인이 필요하다. 원문 셋째 문단은 「Communist and Socialist parties.」라는 불완전한 문장으로 시작하는데(전보 전문 편집의 흔적으로 보인다), 손대지 않고 그대로 옮겼다. 「Most of the population appears to be apathetic」 등 관찰의 어조와 「no doubt」·「is doubtful」 같은 판단의 어조를 구분하여 옮겼다.", "warn": true, "pages": ["740", "741"], "search": "George Atcheson, Jr. 조지 애치슨 2세 — 주일본 정치고문 대리 Hatoyama 하토야마(하토야마 이치로, 鳩山一郎로 보인다) — 「자유」당 지도자, 옛 정우회 간사장 Baron Kijuro Shidehara 시데하라 기주로 남작 — 1945년 10월 9일 취임한 총리 (각주) Prince Naruhiko Higashi-Kuni 히가시쿠니노미야 나루히코 왕 — 전 총리(8월 17일~10월 5일) (각주) Zenjiro Horikri 호리키리 젠지로 — 내무대신 (각주)"}]</script>
<script id="conf" type="application/json">{"pages": {"dir": "../pages", "ext": "png", "label": "원본 지면", "thumbs": "../thumbs", "thumb_ext": "jpg"}, "chrono": {"from": "1943-09-01", "to": "1948-12-31", "note": "열람기 아래쪽에 늘 떠 있는 연대 바의 눈금이다. 문서 하나를 읽을 때 그것이 어느 시점의 것인지 잡아 준다. 문서철을 가리지 않고 공용으로 쓴다. note 는 사건에 마우스를 올렸을 때 뜨는 요약이다 — 두세 문장을 넘기지 마라.", "events": [{"date": "1943-11-27", "label": "카이로 선언", "key": true, "where": "카이로", "note": "미·영·중 3국 수뇌가 대일 전후 처리를 합의해 발표했다. 조선에 관한 대목은 「적당한 시기에(in due course) 자유롭고 독립된 나라가 되게 한다」였다. 이 묶음이 좇는 문구가 여기서 태어난다."}, {"date": "1943-11-28", "label": "테헤란 회담", "where": "테헤란", "note": "루스벨트·처칠·스탈린의 첫 3자 회담. 유럽 제2전선(노르망디)의 시기가 정해졌고, 스탈린은 독일 항복 뒤 대일전 참전을 처음으로 시사했다."}, {"date": "1944-06-06", "label": "노르망디 상륙", "note": "연합군이 프랑스 북부에 상륙해 서부 제2전선이 열렸다. 유럽 전쟁의 승패가 사실상 이때 갈렸고, 미국 안에서 「그다음은 일본」이라는 계산이 본격화된다."}, {"date": "1944-10-20", "label": "레이테 상륙", "where": "필리핀", "note": "맥아더가 필리핀 탈환에 착수했다. 뒤이은 레이테만 해전에서 일본 연합함대가 무너져, 일본 본토와 남방 자원지대를 잇는 해상 수송로가 끊긴다."}, {"date": "1945-02-04", "label": "얄타 회담", "key": true, "where": "크림반도 얄타", "note": "루스벨트·처칠·스탈린의 두 번째 3자 회담. 소련의 대일 참전 조건이 비밀협정으로 정해졌고, 루스벨트가 스탈린에게 조선의 신탁통치를 꺼내며 「20년에서 30년」이라 말했다. 카이로의 「적당한 시기」에 처음으로 숫자가 붙은 자리다."}, {"date": "1945-03-10", "label": "도쿄 대공습", "note": "B-29 편대의 야간 소이탄 공습으로 도쿄 시가지가 불탔다. 하룻밤 사망자가 10만 명 안팎으로 추정된다. 일본 안에서 본토 방위가 불가능하다는 인식이 퍼지기 시작한다."}, {"date": "1945-04-01", "label": "오키나와 전투", "note": "미군이 오키나와에 상륙해 6월까지 싸웠다. 사상자 규모가 본토 상륙전의 비용을 가늠하는 근거가 되어, 원폭 사용과 소련 참전 요청 양쪽의 논거로 쓰인다."}, {"date": "1945-04-12", "label": "루스벨트 사망", "note": "루스벨트가 급서하고 트루먼이 승계했다. 트루먼은 얄타의 비밀협정도 원폭 개발도 취임 뒤에야 통보받았다. 조선 신탁통치 구상을 밀던 사람이 사라진 자리다."}, {"date": "1945-05-02", "label": "베를린 함락", "note": "소련군이 베를린을 함락했다. 이틀 전 히틀러가 자살했고, 남은 것은 항복 절차뿐이었다. 도쿄의 일본 지도부는 이 소식을 스위스·스웨덴 공관과 외신을 통해 받아 본다."}, {"date": "1945-05-08", "label": "독일 항복", "key": true, "note": "독일이 무조건 항복해 유럽 전쟁이 끝났다. 일본은 마지막 동맹을 잃었고, 소련은 대일전으로 병력을 돌릴 수 있게 됐다. 이 소식에 대한 일본 안팎의 반응이 이 묶음의 「기」에 해당한다."}, {"date": "1945-07-17", "label": "포츠담 회담", "where"
