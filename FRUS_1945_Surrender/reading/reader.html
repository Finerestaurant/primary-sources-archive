야콥손과 이야기를 나눈 책임 있는 OSS 중간 연락원(cut-out) 쪽에서는, 기타무라의 접근이 도쿄의 훈령에 따른 것이라기보다 현지에서 발의된 것이라고 믿고 있다. 따라서 이 접근이 얼마나 진지한지를 가늠하기 어렵다.\n\n(베른 주재 OSS 대표가 보고하는 바로는, 야콥손이 그에게 이번 주말 바젤로 자기를 만나러 와 달라고 긴급히 요청하였다. OSS 대표는 그 초청을 거절하였으나, 7월 15일 일요일에 베른에서 만날 수 있다고 야콥손에게 말하였다. 베른 주재 OSS 대표는 오직 야콥손이 줄 수 있는 정보를 얻기 위해서만 그를 만날 것이며, 이 문제 전체를 최대한의 조심과 유보로써 다룰 것으로 예상한다.)\n\n찰스 S. 체스턴", "secondary": "Washington, July 13, 1945.\n\nThe following information, received from Mr. Allen Dulles in Wiesbaden, dated 12 and 13 July, concerns a new Japanese attempt to approach Allied authorities through OSS representatives in Switzerland:\n\nPer Jacobsson, a Swedish national and economic adviser to the Bank for International Settlements, has been approached by Kojiro Kitamura, a director of the Bank, a representative of the Yokohama Specie Bank and former financial attaché in Berlin. Kitamura indicated to Jacobsson that he was anxious to establish immediate contact with American representatives and implied that the only condition on which Japan would insist with respect to surrender would be some consideration for the Japanese Imperial family. Kitamura showed that he was completely familiar with OSS operations which led to the surrender of German forces in North Italy, and declared that he wished to establish a contact similar to that made by General Karl Wolff.\n\nAccording to Jacobsson, Kitamura is acting with the consent of the Japanese Minister to Switzerland, Shunichi Kase, and is working with Brigadier General Kiyotomi Okamoto, a former Japanese Military Attaché in Bern. [Okamoto is probably the chief of Japanese [489면] intelligence in Europe.] [주16] Kitamura claims that the Japanese group in Switzerland has direct communications with Tokyo and is in a position to make definite commitments.\n\n(Responsible OSS cut-out sources who talked with Jacobsson at Basel believe that the Kitamura approach was initiated locally rather than on the basis of instructions from Tokyo. Hence it is difficult to assess the seriousness of the approach.\n\n(The OSS representative in Bern reports that Jacobsson has urgently requested him to come to Basel to see him this coming weekend. The OSS representative has declined the invitation but has told Jacobsson that he could see him in Bern on Sunday, 15 July. The OSS representative in Bern will see Jacobsson only to obtain such intelligence as Jacobsson is able to give, and expects to treat the entire matter with the greatest caution and reserve.)\n\nCharles S. Cheston", "notes": ["[주16] 대괄호는 원문에 있는 것이다."], "note": "번역자 주 — 베른 경로의 두 번째 갈래가 열리는 문서다. 앞선 d349·d357·d358이 「독일계 소식통 → 후지무라(해군)」 갈래였다면, 여기서부터는 「페르 야콥손 → 기타무라·요시무라(국제결제은행) → 가세·오카모토」 갈래가 시작된다. 두 갈래는 d364(8/2)에서 합류한다.\n\n전언 층위: 「기타무라 → 야콥손 → (바젤의 OSS 중간 연락원) → 비스바덴의 덜레스 → 체스턴 → 국무장관」. 'indicated'(시사하였다), 'implied'(내비쳤다), 'According to Jacobsson'(야콥손에 따르면), 'Kitamura claims'(기타무라는 주장한다), 'believe that'(…라고 믿고 있다)을 그대로 살렸다. 특히 마지막 두 문단은 소괄호로 묶인 OSS 자신의 평가·조치이며 기타무라의 말이 아니다 — 원문의 소괄호를 그대로 두었다. 원문에서 이 두 문단은 여는 괄호만 있고 첫 문단의 닫는 괄호가 없다(FRUS 원문 그대로).\n\n낱말 구분: 'surrender of German forces in North Italy'와 'with respect to surrender'는 모두 「항복」이나, 이 문서에는 'capitulation'도 'peace feeler'도 'mediation'도 쓰이지 않았다. 'the only condition on which Japan would insist'는 「일본이 고집할 유일한 조건」으로 직역했다.\n\n'cut-out'은 첩보 용어로, 본인과 정보원 사이에 두는 중간 연락원을 뜻한다. 「중간 연락원(cut-out)」으로 옮기고 로마자를 병기했다.\n\n대괄호 문단(오카모토 신원 추정)은 각주 16에 따라 원문 각서 자체에 있는 것이므로 대괄호째 본문에 두었다.\n\n원문 인명 표기 Kojiro Kitamura, Shunichi Kase, Kiyotomi Okamoto는 각각 기타무라 고지로(北村孝治郎), 가세 슌이치(加瀬俊一), 오카모토 기요토미(岡本清福)로 짐작되나 원문에 한자가 없으므로 로마자를 병기했다.", "warn": false, "pages": ["488", "489"], "search": "Charles S. Cheston 찰스 S. 체스턴 — 전략사무국(OSS) 국장대리, 이 각서의 작성자 Allen Dulles 앨런 덜레스 — 비스바덴 OSS 임무단 책임자 (d363·d364의 표기) Per Jacobsson 페르 야콥손 — 스웨덴 국적자, 국제결제은행(BIS) 경제고문 Kojiro Kitamura 기타무라 고지로 — 국제결제은행 이사, 요코하마정금은행 대표, 전 베를린 주재 재무관 Karl Wolff 카를 볼프 — 독일 장군, 북이탈리아 독일군 항복 교섭의 상대 Shunichi Kase 가세 슌이치 — 주스위스 일본 공사 Kiyotomi Okamoto 오카모토 기요토미 — 소장(Brigadier General), 전 베른 주재 일본 무관, 유럽 주재 일본 정보 조직 책임자로 추정"}, {"id": "d361", "order": 361, "date": "1945-07-16", "group": "B", "eyebrow": "d361 · Memorandum by the Director of the Office of Strategic Services (Donovan) to the Secretary of State", "title": "전략사무국장(도너번)이 국무장관에게 보낸 각서", "badge": null, "list_right": "문서 361", "meta": [{"k": "일자", "v": "1945-07-16"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 PW/8–245", "txt": true}, {"k": "발신", "v": "전략사무국(OSS) 국장 도너번(William J. Donovan)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 361 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d361"}], "summary": "7월 13일자 각서의 후속으로, 7월 15일 비스바덴에서 덜레스를 만난 페르 야콥손의 보고 — 국제결제은행의 일본 측 인사 요시무라와 기타무라가 우메즈 참모총장·요나이 해군대신·도고 외무대신을 포함하는 강화파를 대변한다고 주장하며 천황의 존치와 1889년 헌법으로의 복귀 두 가지만을 거듭 내세웠고, 덜레스는 그루의 7월 10일 성명이 이 상황을 포괄하며 이는 「강화 타진」의 범주에 든다고 신중히 응답했다는 내용.", "points": ["7월 13일자 각서(스위스 주재 OSS 대표를 통한 일본 측의 새로운 접근 시도)의 후속으로, 비스바덴의 앨런 덜레스에게서 받았다. 정보 제공자는 앞선 각서와 같은 출처인 스웨덴 국적자·국제결제은행(바젤) 경제고문 페르 야콥손이다.", "야콥손은 덜레스와 만나기를 청하였고 그 목적으로 7월 15일 비스바덴으로 데려와졌으며 곧바로 바젤로 돌아갔다.", "야콥손의 보고: 7월 10일과 13일 사이에 그는 국제결제은행 소속 일본 관리 요시무라(Yoshimura), 그리고 은행 이사이자 요코하마정금은행 대표이며 전 베를린 주재 재무관인 기타무라 고지로와 일련의 회담을 가졌다.", "요시무라와 기타무라는 주스위스 일본 공사 가세 슌이치, 그리고 전 베른 주재 일본 무관으로 지금은 유럽 주재 일본 정보 조직의 책임자로 여겨지는 오카모토 기요토미 소장과 협의하며 움직이고 있다고 주장한다.", "두 사람은 또한 가세와 오카모토가 일본 참모총장과 직접·비밀리에 연락하는 수단을 갖고 있다고 주장한다.", "요시무라는 자기가 대변하는 강화파에 육군참모총장 우메즈 요시지로 대장, 해군대신 요나이 미쓰마사 대장, 외무대신 도고 시게노리가 포함된다고도 주장한다.", "야콥손이 보기에 요시무라와 기타무라는 더 이상 무조건 항복의 원칙을 문제 삼지 않는 듯하였으나, 한 대목에서 「무조건적인 육·해군의 항복만으로는 충분하지 않겠느냐」고 물었다. 야콥손은 자기 판단으로 그런 제안은 연합국에 받아들여지지 않고 한낱 말장난(quibble)으로 여겨질 것이라고 답하였다.", "두 일본 관리는 일본의 영토 보전 유지 문제를 꺼냈으나, 만주국·조선·타이완(포모사)을 거기에 넣을 뜻은 아니었던 것으로 보인다.", "회담 내내 일본 관리들은 오직 두 가지만을 강조하였다 — (a) 천황의 존치, (b) 1889년에 반포된 헌법으로 돌아갈 가능성.", "기타무라는 이 두 가지에 대한 덜레스의 의견을 타진해 달라는 각서를 작성하여 야콥손에게 건넸다.", "(덜레스는 이 두 일본인이 천황 존치를 고집하는 까닭이, 항복에 관하여 실효적 조치를 취할 수 있는 이는 천황뿐이며 무조건 항복에 대한 그의 지지를 얻으려면 그에게 얼마간의 생존 희망을 내보여야 한다고 그들이 느끼기 때문이라고 본다.)", "이후 요시무라와 기타무라는 두 번째 각서를 작성하여, 도쿄가 진행할 준비가 되었을 경우 연합국 대표와의 회담을 어떻게 주선할 수 있으며 어떤 형식의 권한 위임이 필요한지를 물었다.", "야콥손 개인으로서는 이 접근들이 진지하며 스위스의 일본 측 집단이 도쿄와 끊임없이 전보로 접촉하고 있다고 확신한다. 그러나 이 확신은 인상에만 근거한 것으로 보인다 — 두 일본 측 접촉자는 도쿄의 권한 있는 기관에서 훈령을 받았다고 정확히 말한 적이 한 번도 없기 때문이다.", "(덜레스는 조심스레 다듬은 표현으로 야콥손에게 네 가지를 지적하였다: 1. 그루의 7월 10일 성명이 이 상황을 포괄한다 — 완전한 권한을 가진 관리에게서 나왔다는 결정적 증거가 없는 한 이 접근들은 그루가 말한 「강화 타진」의 범주에 정확히 들어간다. 2. 권한 있는 일본 당국이 무조건 항복을 받아들인다면 그 항복을 어떻게 실행할지는 해당 연합국 당국이 정할 것이다. 3. 왕조 문제와 헌법 문제에 관하여 그(덜레스)는 논평할 것이 없다. 4. 신속한 무조건 항복이 이 파국에서 무엇이라도 건질 유일한 길로 보인다.)", "(덜레스는, 일본인이 독일이 겪은 결과 — 광범한 물리적 파괴와 독일 권위의 전면적 붕괴 — 를 절실히 새기고 있다는 야콥손의 견해에 동의한다. 그것은 독일이 전망이 없음이 완전히 분명해진 뒤에도 헛된 싸움을 여러 달 끌었기 때문이다. 따라서 야콥손은, 일본 본토 섬들에서 비(非)군국주의적 일본 정부 제도가 보전될 수만 있다면 어떤 대가를 치르더라도 전쟁을 끝내려는 경향이 일본의 일부 층에서 자라고 있다고 느낀다.)", "(덜레스는 며칠 안에 요시무라·기타무라의 이 접근에 진지한 뒷받침이 있는지, 아니면 스위스의 일본 측 집단이 제 발의로 뭔가를 시작해 보려는 노력에 지나지 않는지에 관한 얼마간의 증거를 얻을 것으로 기대한다.)"], "primary": "워싱턴, 1945년 7월 16일.\n\n다음의 정보는 스위스 주재 OSS 대표를 통하여 연합국 당국에 접근하려는 일본 측의 새로운 시도에 관한 7월 13일자 각서의 후속편으로, 비스바덴의 앨런 덜레스 씨에게서 받았다. 이 정보는 앞의 각서와 같은 출처, 곧 스웨덴 국적자이며 바젤 국제결제은행 경제고문인 페르 야콥손이 제공한 것이다. 야콥손은 덜레스 씨를 만나기를 청하였고 그 목적으로 7월 15일 비스바덴으로 데려와졌으며, 곧바로 바젤로 돌아갔다.\n\n야콥손의 보고에 따르면, 7월 10일과 13일 사이에 그는 국제결제은행에 소속된 일본 관리 요시무라(Yoshimura), 그리고 그 은행의 이사이며 요코하마정금은행의 대표이자 전 베를린 주재 재무관인 기타무라 고지로(Kojiro Kitamura)와 일련의 회담을 가졌다. 요시무라와 기타무라는 주스위스 일본 공사 가세 슌이치(Shunichi Kase), 그리고 전 베른 주재 일본 무관으로서 지금은 유럽 주재 일본 정보 조직의 책임자로 여겨지는 오카모토 기요토미(Kiyotomi Okamoto) 소장과 협의하며 움직이고 있다고 주장한다. 요시무라와 기타무라는 또한 가세와 오카모토가 일본 참모총장[주17]과 직접 그리고 비밀리에 연락할 수단을 갖고 있다고 주장한다. 요시무라는 나아가, 자기가 대변하는 강화파에 육군참모총장 [490면] 우메즈 요시지로(Yoshijiro Umezu) 대장, 해군대신 요나이 미쓰마사(Mitsumasa Yonai) 대장, 외무대신 도고 시게노리(Shigenori Togo)가 포함된다고 주장한다.\n\n야콥손이 보기에 요시무라와 기타무라는 더 이상 무조건 항복의 원칙을 문제 삼지 않는 듯하였으나, 한 대목에서 그들은 무조건적인 육군·해군의 항복만으로 충분하지 않겠느냐고 물었다. 야콥손은 자기 판단으로, 그러한 제안은 연합국에 받아들여지지 않을 것이며 한낱 말장난으로만 여겨질 것이라고 답하였다. 두 일본 관리는 모두 일본의 영토 보전을 유지하는 문제를 꺼냈으나, 만주국·조선·타이완(포모사)을 거기에 넣을 뜻은 아니었던 것으로 보인다.\n\n야콥손과의 논의 내내 일본 관리들은 오직 두 가지 점만을 강조하였다: (a) 천황의 존치, 그리고 (b) 1889년에 반포된 헌법으로 돌아갈 가능성. 기타무라는 이 두 가지 점에 관한 덜레스 씨의 의견을 타진해 달라고 청하는 각서를 작성하여 야콥손에게 건넸다.\n\n(덜레스 씨는 이 두 일본인이 천황의 존치를 고집하는 까닭이, 항복에 관하여 실효적인 조치를 취할 수 있는 이는 오직 천황뿐이며 무조건 항복에 대한 그의 지지를 얻기 위해서는 그에게 얼마간의 생존 희망을 내보여야 한다고 그들이 느끼기 때문이라고 생각한다.)\n\n그 뒤 요시무라와 기타무라는 두 번째 각서를 작성하여, 만일 도쿄가 진행할 준비가 되었다면 연합국 대표들과의 회담을 어떻게 주선할 수 있으며 어떤 형식의 권한 위임이 필요한지를 물었다.\n\n야콥손은 이 접근들이 진지하며 스위스의 일본 측 집단이 도쿄와 끊임없이 전보로 접촉하고 있다고 개인적으로 확신하고 있다. 이 확신은 인상에만 근거한 것으로 보이는데, 그의 두 일본 측 접촉자가 도쿄의 어떤 권한 있는 기관으로부터 훈령을 받았다고 정확히 말한 적은 한 번도 없기 때문이다.\n\n(덜레스 씨는 조심스레 다듬은 표현으로 야콥손에게 다음을 지적하였다:\n\n(1.\n\n그루 씨의 7월 10일 성명[주17a]이 이 상황을 포괄한다. 지금까지 야콥손이 설명한 이 접근들은, 그것이 완전한 권한을 부여받은 관리에게서 나왔다는 결정적 증거가 없는 한, 그루 씨가 말한 「강화 타진(peace feelers)」의 범주에 정확히 들어간다.\n\n(2.\n\n권한 있는 일본 당국이 무조건 항복을 받아들인다면, 그러한 항복을 어떻게 실행할 것인지는 해당 연합국 당국이 정할 것이다.\n\n(3.\n\n그(덜레스 씨)는 왕조 문제와 헌법 문제에 관하여는 논평할 것이 없다.\n\n(4.\n\n신속한 무조건 항복이 이 파국에서 무엇이라도 건질 유일한 길로 보인다.\n\n[491면]\n\n(덜레스 씨는, 일본인이 독일이 겪은 결과 — 광범한 물리적 파괴와 모든 독일 권위의 붕괴를 포함하여 — 를 절실히 새기고 있다는 야콥손의 견해에 동의한다. 그것은 독일이 그 가망 없음이 완전히 명백해진 뒤로도 여러 달 동안 헛된 싸움을 끌었기 때문이다. 따라서 야콥손은, 일본 본토 섬들에서 비군국주의적인 일본 정부 제도가 보전될 수 있다면 어떤 대가를 치르더라도 전쟁을 끝내려는 경향이 일본의 어떤 층에서 자라나고 있다고 느낀다.\n\n(덜레스 씨는 요시무라와 기타무라의 이 접근들이 진지한 뒷받침을 가진 것인지, 아니면 스위스의 일본 측 집단이 제 발의로 뭔가를 시작해 보려는 노력에 지나지 않는 것인지에 관한 얼마간의 증거를 며칠 안에 얻을 것으로 기대한다.)\n\n윌리엄 J. 도너번", "secondary": "Washington, 16 July, 1945.\n\nThe following information, a sequel to a memorandum dated 13 July concerning a new Japanese attempt to approach Allied authorities through OSS representatives in Switzerland, has been received from Mr. Allen Dulles in Wiesbaden. The information was supplied by the source of the reference memorandum, Per Jacobsson, a Swedish national and economic adviser to the Bank for International Settlements in Basel. Jacobsson had asked to see Mr. Dulles and was brought to Wiesbaden for that purpose on 15 July, returning immediately to Basel.\n\nJacobsson reports that between 10 and 13 July he had a series of conferences with Yoshimura, a Japanese official attached to the Bank for International Settlements, and Kojiro Kitamura, a director of the Bank, representative of the Yokohama Specie Bank, and former financial attaché in Berlin. Yoshimura and Kitamura claim to be acting in consultation with the Japanese Minister to Switzerland, Shunichi Kase, and Brigadier General Kiyotomi Okamoto, former Japanese military attaché in Bern, who now is believed to be chief of Japanese Intelligence in Europe. Yoshimura and Kitamura claim further that Kase and Okamoto have direct and secret means of communicating with the Japanese Chief of Staff. [주17] Yoshimura also claims that the peace group which he represents includes General [490면] Yoshijiro TJmezu, Army Chief of Staff; Admiral Mitsumasa Yonai, Minister of Navy; and Shigenori Togo, Foreign Minister.\n\nYoshimura and Kitamura appeared to Jacobsson no longer to question the principle of unconditional surrender, though at one point they asked whether unconditional military and naval surrender might not be sufficient. On his own initiative, Jacobsson replied that such a proposal would not be acceptable to the Allies but would be considered merely a quibble. Both Japanese officials raised the question of maintaining Japanese territorial integrity, but they apparently did not mean to include Manchukuo, Korea or Formosa.\n\nThroughout discussions with Jacobsson, the Japanese officials stressed only two points: (a) the preservation of the Emperor, and (b) the possibility of returning to the constitution promulgated in 1889. Kitamura prepared and presented to Jacobsson a memorandum asking him to sound out Mr. Dulles’ opinion on the two points.\n\n(Mr. Dulles feels that these two Japanese are insisting on the retention of the Emperor because they feel that he alone can take effective action with respect to surrender and that some hope of survival must be held out to him in order to gain his support for unconditional surrender.)\n\nLater Yoshimura and Kitamura prepared a second memorandum in which they asked how, if Tokyo were ready to proceed, conversations could be arranged with Allied representatives and what form of authorization would be required.\n\nJacobsson is personally convinced that these approaches are serious and that the Japanese group in Switzerland is in constant cable contact with Tokyo. This conviction appears to be based on impressions only, since his two Japanese contacts never stated precisely that they had received instructions from any authorized agency in Tokyo.\n\n(Mr. Dulles, in carefully guarded statements, pointed out to Jacobsson that:\n\n(1.\n\nMr. Grew’s statement of 10 July [주17a] covered the situation. As yet these approaches which Jacobsson described, in the absence of conclusive evidence that they emanated from a fully-empowered official, fall squarely into the category of “peace feelers” described by Mr. Grew.\n\n(2.\n\nIf competent Japanese authorities accepted unconditional surrender, appropriate Allied authorities would determine how such a surrender should be effected.\n\n(3.\n\nHe (Mr. Dulles) had no comments to make with regard to dynastic and constitutional questions.\n\n(4.\n\nPrompt unconditional surrender appears to be the only way to save anything out of the wreckage.\n\n[491면]\n\n(Mr. Dulles agrees with Jacobsson that the Japanese have taken to heart the consequences which Germany has suffered, including extensive physical destruction and the collapse of all German authority, because it prolonged a futile struggle many months after its hopelessness was wholly apparent. Jacobsson feels therefore that a tendency is growing in certain Japanese circles to try to terminate the war at any cost, provided that non-militaristic Japanese governmental institutions can be preserved in the Japanese home islands.\n\n(Mr. Dulles expects within a few days to obtain some evidence as to whether these approaches by Yoshimura and Kitamura have any serious backing or represent merely an effort by the Japanese group in Switzerland to start something on their own initiative.)\n\nWilliam J. Donovan", "notes": ["[주17] 우메즈 요시지로 대장(Gen. Yoshijiro Umezu).", "[주17a] Department of State Bulletin, 1945년 7월 15일자, 84면."], "note": "번역자 주 — 원문 표기 오류: 본문에 'General Yoshijiro TJmezu'로 적혀 있다. 각주 17이 'Gen. Yoshijiro Umezu'로 바로잡고 있어 U를 TJ로 잘못 조판한 것이 분명하다. 영문은 손대지 않았고 번역에서는 우메즈 요시지로로 옮겼다.\n\n전언 층위가 이 묶음에서 가장 깊다 — 「도쿄의 강화파(요시무라의 주장) → 가세·오카모토 → 요시무라·기타무라 → 야콥손 → 덜레스 → 도너번 → 국무장관」. 원문의 표지를 하나도 지우지 않았다: 'claim to be acting'(…하며 움직이고 있다고 주장한다), 'claim further'(나아가 …라고 주장한다), 'also claims'(…라고도 주장한다), 'appeared to Jacobsson'(야콥손이 보기에), 'they apparently did not mean'(…뜻은 아니었던 것으로 보인다), 'Jacobsson is personally convinced'(개인적으로 확신하고 있다), 'This conviction appears to be based on impressions only'(인상에만 근거한 것으로 보인다), 'Mr. Dulles feels/believes'(덜레스는 …라고 생각한다).\n\n이 문서의 핵심 유보: 우메즈·요나이·도고가 강화파에 속한다는 것은 **요시무라의 주장**일 뿐이며, 원문 자신이 곧이어 「두 일본 측 접촉자는 도쿄의 권한 있는 기관에서 훈령을 받았다고 정확히 말한 적이 한 번도 없다」고 못 박는다. 이 두 층을 뭉개지 않도록 문장 순서를 원문 그대로 두었다.\n\n낱말 구분: 'unconditional surrender'(무조건 항복), 'unconditional military and naval surrender'(무조건적인 육군·해군의 항복), 'peace feelers'(강화 타진)를 각각 다르게 옮겼다. 특히 일본 측이 「육·해군의 무조건 항복만으로 충분하지 않겠느냐」고 물은 대목은 무조건 항복의 범위를 군대에 한정하려는 시도이며, 야콥손이 이를 'quibble(말장난)'로 일축한 것이 그대로 기록되어 있다.\n\n조선이 나오는 대목: 일본 측이 「영토 보전(territorial integrity)」을 꺼냈으나 만주국·조선·타이완은 거기에 포함할 뜻이 아니었던 것으로 보인다고 되어 있다. 곧 이 시점에 스위스의 일본 측 인사들은 조선의 상실을 이미 전제하고 있었다.\n\n원문의 (1. (2. (3. (4. 는 여는 소괄호만 있고 닫는 괄호가 없다 — 덜레스의 발언 전체가 하나의 괄호 안 서술이기 때문이다. 조판 그대로 두었다. 각 항의 줄바꿈도 원문 TEI의 배치를 따랐다.\n\nsource_note에 관한 유의: 색인상 이 문서의 원문 출처 번호는 7월 16일자임에도 740.00119 PW/8–245(8월 2일 편철)로 되어 있으며 d364와 같다. 이 각서가 국무부에 8월 2일에야 편철된 것으로 보이나 확인하지 못했다.\n\n요시무라(Yoshimura)는 원문에 성만 있고 한자가 없다. 기타무라 고지로(北村孝治郎), 가세 슌이치(加瀬俊一), 오카모토 기요토미(岡本清福), 우메즈 요시지로(梅津美治郎), 요나이 미쓰마사(米内光政), 도고 시게노리(東郷茂徳)로 짐작되나 원문에 한자가 없으므로 로마자를 병기했다.", "warn": false, "pages": ["489", "490", "491"], "search": "William J. Donovan 윌리엄 J. 도너번 — 전략사무국(OSS) 국장, 이 각서의 작성자 Allen Dulles 앨런 덜레스 — 비스바덴 OSS 임무단 책임자, 유럽에서 OSS에 복무 중인 뉴욕 변호사 Per Jacobsson 페르 야콥손 — 스웨덴 국적자, 바젤 국제결제은행(BIS) 경제고문 Yoshimura 요시무라 — 국제결제은행 소속 일본 관리 Kojiro Kitamura 기타무라 고지로 — 국제결제은행 이사, 요코하마정금은행 대표, 전 베를린 주재 재무관 Shunichi Kase 가세 슌이치 — 주스위스 일본 공사 Kiyotomi Okamoto 오카모토 기요토미 — 소장, 전 베른 주재 일본 무관, 유럽 주재 일본 정보 조직 책임자로 여겨짐 Yoshijiro Umezu 우메즈 요시지로 — 육군참모총장(대장) Mitsumasa Yonai 요나이 미쓰마사 — 해군대신(대장) Shigenori Togo 도고 시게노리 — 외무대신 Joseph C. Grew 그루 — 국무차관. 7월 10일 성명"}, {"id": "d363", "order": 363, "date": "1945-07-18", "group": "B", "eyebrow": "d363 · Memorandum by the Director of the Office of Strategic Services (Donovan) to the Secretary of State", "title": "전략사무국장(도너번)이 국무장관에게 보낸 각서", "badge": null, "list_right": "문서 363", "meta": [{"k": "일자", "v": "1945-07-18"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 P.W./7–1845", "txt": true}, {"k": "발신", "v": "전략사무국(OSS) 국장 도너번(William J. Donovan)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 363 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d363"}], "summary": "7월 13일·16일자 각서의 후속으로, 비스바덴 OSS 임무단장 앨런 덜레스가 7월 18일 전달한 것 — 국제결제은행의 요시무라와 기타무라가 취리히에서 오카모토 기요토미 소장과 즉시 회합하고 그 직후 도쿄에 타전할 예정이었으며, 덜레스는 며칠 안에 중요한 진전은 없겠으나 도쿄의 정세가 일본으로 하여금 무조건 항복을 받아들이게 할 때 일본이 쓸 수 있는 통로가 열리고 있다고 본다는 내용.", "points": ["비스바덴 OSS 임무단장 앨런 덜레스가 7월 18일 전달한 정보로, OSS 대표를 통하여 연합국 당국에 접근하려는 일본 측 시도에 관한 7월 13일자·16일자 각서의 후속편이다.", "스위스 주재 OSS 대표들이 덜레스에게 알린 바로는, 국제결제은행의 일본 관리 요시무라와 기타무라 고지로가 취리히에서 오카모토 기요토미 소장과 즉시 회합할 예정이었고, 그 직후 도쿄로 타전할 예정이었다.", "[오카모토는 전 베른 주재 일본 무관이며 지금은 유럽 주재 일본 정보 조직의 책임자로 여겨진다.]", "(덜레스는 앞으로 며칠 동안 이 문제에서 중요한 진전이 있을 성싶지는 않으나, 도쿄의 정세가 일본으로 하여금 무조건 항복을 받아들일 수 있게 할 때 일본인이 쓸 수 있는 하나의 선(line)이 열리고 있다고 본다.)"], "primary": "워싱턴, 1945년 7월 18일.\n\n다음의 정보는 비스바덴 OSS 임무단장 앨런 덜레스 씨가 7월 18일에 전달한 것으로, OSS 대표들을 통하여 연합국 당국에 접근하려는 일본 측 시도에 관한 7월 13일자 및 16일자의 앞선 각서들의 후속편이다.\n\n덜레스 씨는 스위스 주재 OSS 대표들로부터, 국제결제은행의 일본 측 관리인 요시무라(Yoshimura)와 기타무라 고지로(Kojiro Kitamura)가 [492면] 취리히에서 오카모토 기요토미(Kiyotomi Okamoto) 소장과 즉시 회합할 예정이며 그 직후에 도쿄로 타전할 예정이라는 통보를 받았다. [오카모토는 전 베른 주재 일본 무관으로, 지금은 유럽 주재 일본 정보 조직의 책임자로 여겨진다.][주20]\n\n(덜레스 씨는 앞으로 며칠 동안은 이 문제에서 중요한 진전이 있을 것 같지 않다고 보나, 도쿄의 정세가 일본으로 하여금 무조건 항복을 받아들이는 것을 허용할 때 일본인이 쓸 수 있는 하나의 선(線)이 열리고 있다고 본다.)\n\n윌리엄 J. 도너번", "secondary": "Washington, 18 July, 1945.\n\nThe following information, transmitted by Mr. Allen Dulles, Chief of the OSS mission in Wiesbaden, on 18 July, is a sequel to previous memoranda dated 13 and 16 July concerning a Japanese attempt to approach Allied authorities through OSS representatives:\n\nMr. Dulles has been informed by OSS representatives in Switzerland that Yoshimura and Kojiro Kitamura, Japanese officials in the [492면] Bank for International Settlements, were scheduled to confer at once with Brigadier General Kiyotomi Okamoto at Zurich, and immediately thereafter to cable Tokyo. [Okamoto is a former Japanese military attaché in Bern, now believed to be chief of Japanese Intelligence in Europe.] [주20]\n\n(Mr. Dulles believes that for the next few days important developments in this matter are not likely, but that a line is being opened which the Japanese may use when the situation in Tokyo permits Japan to accept unconditional surrender.)\n\nWilliam J. Donovan", "notes": ["[주20] 대괄호는 원문에 있는 것이다."], "note": "번역자 주 — 짧은 중계 각서다. 이 문서에서 처음으로 덜레스의 직함이 'Chief of the OSS mission in Wiesbaden(비스바덴 OSS 임무단장)'으로 명시된다 — d358 각주 14의 「유럽에서 OSS에 복무 중인 뉴욕 변호사」보다 구체적인 신원 설명이다.\n\n전언 층위: 「스위스 주재 OSS 대표들 → 덜레스(7/18 전달) → 도너번 → 국무장관」. 요시무라·기타무라의 말이 아니라 OSS 자신의 관측이라는 점에서 앞의 각서들과 층위가 다르다. 'has been informed by'(…로부터 통보를 받았다), 'now believed to be'(지금은 …로 여겨진다), 'Mr. Dulles believes'(덜레스는 …라고 본다)를 그대로 살렸다.\n\n마지막 문단의 'a line is being opened'는 첩보 용어로 「연락선(통로)이 열리고 있다」는 뜻이다. 「하나의 선(線)이 열리고 있다」로 직역하고 원문 낱말을 병기했다. 이 각서의 값어치가 여기에 있다 — OSS는 이 접근을 즉각적 강화 교섭으로 보지 않고, 나중에 쓸 통로를 확보해 두는 것으로 평가했다.\n\n낱말: 'unconditional surrender'(무조건 항복)만 쓰였고 'peace feeler'·'capitulation'·'mediation'은 나오지 않는다.\n\n대괄호 문단은 각주 20에 따라 원문 각서 자체에 있는 것이므로 대괄호째 본문에 두었다.", "warn": false, "pages": ["491", "492"], "search": "William J. Donovan 윌리엄 J. 도너번 — 전략사무국(OSS) 국장, 이 각서의 작성자 Allen Dulles 앨런 덜레스 — 비스바덴 OSS 임무단장(Chief of the OSS mission in Wiesbaden) Yoshimura 요시무라 — 국제결제은행 소속 일본 관리 Kojiro Kitamura 기타무라 고지로 — 국제결제은행 이사 Kiyotomi Okamoto 오카모토 기요토미 — 소장, 전 베른 주재 일본 무관, 유럽 주재 일본 정보 조직 책임자로 여겨짐"}, {"id": "d364", "order": 364, "date": "1945-08-02", "group": "B", "eyebrow": "d364 · Memorandum by the Acting Director of the Office of Strategic Services (Cheston) to the Secretary of State", "title": "전략사무국장대리(체스턴)가 국무장관에게 보낸 각서", "badge": null, "list_right": "문서 364", "meta": [{"k": "일자", "v": "1945-08-02"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 PW/8–245", "txt": true}, {"k": "발신", "v": "전략사무국(OSS) 국장대리 체스턴(Charles S. Cheston)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 364 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d364"}], "summary": "비스바덴 OSS 임무단장 덜레스에게서 받은 8월 1일자 전문의 요지 — 오카모토 기요토미 소장이 7월 19일 스위스에서 보낸 긴 전보(「일본은 전쟁에 졌으며 그 결과를 즉시 받아들여야 한다」)를 일본 참모총장이 논평 없이 접수하였고, 가세 공사의 보고에 외무대신이 「그것이 그대가 할 말의 전부인가?」라고 되물었으며, 스위스의 일본 측 집단이 삼국 최후통첩(포츠담 선언)을 처음의 반발에서 「빠져나갈 길을 남긴 교묘한 문서」로 평가를 바꾸었고, 후지무라와 기타무라의 두 갈래가 서로 접촉을 맺었다는 내용.", "points": ["비스바덴 OSS 임무단장 앨런 덜레스에게서 받은 8월 1일자 전문의 요지로, OSS 대표를 통한 일본 측 접근 시도에 관한 7월 13일·16일·18일자 각서들의 후속편이다.", "먼저 스웨덴 국적자이며 국제결제은행 경제고문인 페르 야콥손의 보고를 중개인을 거쳐 덜레스에게 전한 것의 요약이다.", "일본 참모총장은 오카모토 기요토미 소장이 7월 19일 스위스에서 보낸 긴 전보를 아무 논평 없이 접수하였다. 전하는 바로는(reportedly) 오카모토의 전보는 「일본은 전쟁에 졌으며 그 결과를 즉시 받아들여야 한다」고 말하였다. [오카모토는 유럽 주재 일본 정보 조직의 수장으로 여겨진다.]", "일본 외무대신 또한 베른 주재 일본 공사 가세 슌이치의 상세한 보고를 접수하였다. 7월 21일 또는 그 무렵 보낸 가세의 보고에는 (a) 그루의 7월 10일 성명, (b) 국제결제은행 이사이자 전 베를린 주재 재무관으로 덜레스에 대한 최근의 일본 측 접근에서 활동해 온 기타무라 고지로의 각서, (c) 가세 자신의 입장 표명이 들어 있었다.", "가세의 전문에 대한 외무대신의 회답에는 「그것이 그대가 할 말의 전부인가?(Is that all you have to say?)」라는 물음이 들어 있었다. 가세는 이 물음을 강화 접근을 계속하라는 권유로 해석한다.", "최근의 대일 삼국 최후통첩(포츠담 선언)이 스위스의 일본 측 집단 사이에서 주된 화제였다. 스위스 신문에 실린 발췌를 근거로 한 그들의 첫 반응은 (a) 그 선언이 일본인의 성격에 대한 이해를 결여하였고, (b) 그 문서가 「받든지 말든지(take it or leave it)」의 방식으로 짜여서는 안 되었으며, (c) 중국이 서명국에 들어간 것은 「모욕의 추가 요소」이고, (d) 그 문서는 공개적으로가 아니라 사적 경로를 통해 보내졌어야 했다는 것이었다.", "야콥손을 통하여 완전한 영문본을 받고 더 검토한 뒤 그 집단의 태도는 달라졌고, 그 선언은 「빠져나갈 길이 될 수 있는 것을 남겨 둔 교묘한 문서」로 받아들여졌다.", "그 집단은 특히 「무조건 항복」이 「일본 군대」와 결부되어 있다는 점과, 일본 국민 사이의 민주적 경향의 부활·강화에 관한 언급에 깊은 인상을 받았다. 그 결과 이 점들을 강조하는 전보를 7월 30일 도쿄로 보낼 예정이었다.", "다음은 페르 야콥손과 접촉하고 있는 일본 측 집단이 덜레스에게 보낸 각서의 요약이며, 야콥손이 위의 자기 보고와 함께 전달하였다.", "그 일본 측 집단은 「저항이 지나치게 크지」 않은 한 한 주 안에 어떤 결정이 나오기를 바라고 있음을 강조한다.", "연합국은 삼국 선언에 관하여 도쿄 라디오에서 나온 말을 「너무 진지하게」 받아들이지 말아야 한다. 그 라디오 논평은 한낱 「일본 안의 사기를 유지하기 위한 선전」에 지나지 않았다.", "도쿄 라디오로 정부의 공식 회답이 나오지 않는다면, 진짜 회답은 어떤 「공식 경로」를 통하여, 아마도 가세 공사나 오카모토 장군을 통하여 주어질 것이다.", "덜레스는 또한 스위스에 사는, 자기의 정기적 접촉자 가운데 하나인 극동에 관한 독일계 권위자로부터, 베른 주재 일본 해군 대표 후지무라 요시카즈(Yosikazu Fujimura)가 지난 두 달 동안 도쿄의 상관들에게 즉각적인 적대행위 중지를 촉구하는 긴 전보를 일곱 통 보냈다는 통보를 받았다.", "그의 상관들은 회답 전보에서 일본 해군이 더 이상 「단독으로 행동」할 수 없다고 하면서, 후지무라에게 도쿄의 명령 없이 주도적으로 나서지 말고 다만 그의 「가장 값진 접촉들」을 유지하라고 지시하였다.", "[후지무라는 전 베른 주재 일본 해군무관보로, 전하는 바로는 도쿄의 해군성 및 해군 군령부총장과 직접 무선으로 접촉하고 있다. 이 같은 독일계 소식통에게 후지무라는 앞서, 덜레스가 북이탈리아 독일군의 항복을 주선하는 데 맡은 역할과 그 독일군에게 무조건 항복에 못 미치는 어떤 조건이 주어졌을 수 있는지를 알아내는 데 관심을 보인 바 있다. 그는 (a) 천황이 존치된다는 것과 (b) 가능하다면 현재의 파국에서 얼마간의 체면을 건질 수 있다는 보장이 주어진다면 도쿄의 일본 해군 측이 항복할 뜻이 있으리라고 시사하였다. 후지무라의 접근은 6월 2일자 및 4일자 각서의 주제였다.]", "독일계 소식통이 보고하고 야콥손이 확인하는 바로는, 후지무라와 기타무라가 서로 긴밀한 접촉을 맺었다.", "야콥손이 확인하는 바로, 두 사람은 스위스에 있는 모든 일본 관계 기관의 공동 행동이 일본 정부에 얼마간의 인상을 줄 수 있으리라는 데 뜻을 같이하고 있다. 베른이 지금 「아마도 모스크바 다음으로 가장 중요한 일본의 재외 공관」이기 때문이다."], "primary": "워싱턴, 1945년 8월 2일.\n\n다음은 비스바덴 OSS 임무단장 앨런 덜레스 씨에게서 받은 8월 1일자 전문(電文)의 요지이다. 이 전문에 담긴 정보는 OSS 대표들을 통하여 연합국 당국에 접근하려는 일본 측 시도에 관한 7월 13일·16일·18일자 각서들의 후속편이다.\n\n바로 아래는 스웨덴 국적자이며 국제결제은행 경제고문인 페르 야콥손(Per Jacobsson)의 보고를 요약한 것으로, 중개인을 거쳐 덜레스 씨에게 전달된 것이다.\n\n일본 참모총장은 오카모토 기요토미(Kiyotomi Okamoto) 소장이 7월 19일 스위스에서 보낸 긴 전보를 아무 논평 없이 접수하였다. 전하는 바로는 오카모토의 전보는 일본이 전쟁에 졌으며 그 결과를 즉시 받아들여야 한다고 말하였다. [오카모토는 유럽 주재 일본 정보 조직의 수장으로 여겨진다.][주20]\n\n일본 외무대신 또한 베른 주재 일본 공사 가세 슌이치(Shunichi Kase)의 상세한 보고를 접수하였다. 7월 21일 또는 그 무렵에 보낸 가세의 보고에는 (a) 그루 씨의 7월 10일 성명, (b) 국제결제은행 이사이며 전 베를린 주재 재무관으로서 덜레스 씨에 대한 최근의 일본 측 접근에서 활동해 온 기타무라 고지로(Kojiro Kitamura)의 각서, 그리고 (c) 가세 자신의 입장 표명이 들어 있었다. 가세의 전문에 대한 외무대신의 회답에는 다음과 같은 물음이 들어 있었다: 「그것이 그대가 할 말의 전부인가?」 가세는 이 물음을 강화 접근을 계속하라는 권유로 해석한다.\n\n[493면]\n\n최근의 대일 삼국 최후통첩[주21]이 스위스의 일본 측 집단들 사이에서 주된 논의 주제가 되어 왔다. 스위스 신문에 실린 발췌를 근거로 한 그들의 첫 반응은, (a) 그 선언이 일본인의 성격에 대한 이해를 결여하고 있으며, (b) 그 문서가 「받든지 말든지」의 방식 위에서 짜여서는 안 되었고, (c) 중국이 서명국으로 들어간 것은 「모욕의 추가된 요소」에 해당하며, (d) 그 문서는 공개적으로가 아니라 사적 경로를 통하여 보내졌어야 했다는 것이었다. 야콥손을 통하여 완전한 영문본을 받고 더 검토한 뒤 그 집단의 태도는 달라졌고, 그 선언은 「빠져나갈 길이 될 수 있는 것을 남겨 둔 교묘한 문서」로 받아들여졌다. 그 집단은 특히 「무조건 항복」이 「일본 군대」와 결부되어 있다는 점, 그리고 일본 국민 사이의 민주적 경향의 부활과 강화에 관한 언급에 깊은 인상을 받았다. 그 결과 이 점들을 강조하는 전보를 7월 30일 도쿄로 보낼 예정이었다.\n\n다음은 페르 야콥손과 접촉하고 있는 일본 측 집단이 덜레스 씨에게 보낸 각서의 요약이다. 야콥손은 위에 요약한 자기 보고와 함께 이 각서를 전달하였다.\n\n그 일본 측 집단은 「저항이 지나치게 크지」 않은 한 한 주 안에 어떤 결정이 나오기를 바라고 있음을 강조한다. 연합국은 삼국 선언에 관하여 도쿄 라디오에서 나온 말을 「너무 진지하게」 받아들여서는 안 된다. 그 라디오 논평은 한낱 「일본 안의 사기를 유지하기 위한 선전」에 지나지 않았다. 만일 도쿄 라디오를 통하여 정부의 공식 회답이 이루어지지 않는다면, 진짜 회답은 어떤 「공식 경로」를 통하여, 아마도 가세 공사나 오카모토 장군에 의하여 주어질 것이다.\n\n덜레스 씨는 또한, 스위스에 살고 있으며 자기의 정기적 접촉자 가운데 한 사람인 극동에 관한 독일계 권위자로부터, 베른 주재 일본 해군 대표 후지무라 요시카즈(Yosikazu Fujimura)가 지난 두 달 동안 도쿄의 상관들에게 즉각적인 적대행위 중지를 촉구하는 긴 전보를 일곱 통 보냈다는 통보를 받았다. 그의 상관들은 회답 전보에서 일본 해군이 더 이상 「단독으로 행동」할 수 없다고 하며, 후지무라에게 도쿄로부터의 명령 없이 주도적으로 나서지 말되 그의 「가장 값진 접촉들」은 유지하라고 지시하였다.\n\n[후지무라는 전 베른 주재 일본 해군무관보로, 전하는 바로는 도쿄의 해군성 및 해군 [494면] 군령부총장[주22]과 직접 무선으로 접촉하고 있다. 이 같은 독일계 소식통에게 후지무라는 앞서, 덜레스 씨가 북이탈리아에서 독일군의 항복(the German capitulation in North Italy)을 주선하는 데 맡았던 역할, 그리고 그 독일군에게 무조건 항복에 못 미치는 어떤 조건이 주어졌을 수 있는지를 알아내는 일에 관심을 나타낸 바 있다. 그는 (a) 천황이 존치되리라는 것과 (b) 가능하다면 현재의 파국에서 얼마간의 체면을 건질 수 있으리라는 보장이 주어진다면 도쿄의 일본 해군 측이 항복할 뜻이 있으리라고 시사하였다. 후지무라의 접근들은 6월 2일자 및 4일자 각서의 주제였다.][주23]\n\n독일계 소식통이 보고하고 야콥손이 확인하는 바로는, 후지무라와 기타무라가 서로 긴밀한 접촉을 맺었다. 야콥손이 확인하는 바로, 두 사람은 스위스에 있는 모든 일본 관계 기관의 공동 행동이 일본 정부에 얼마간의 인상을 줄 수 있으리라는 데 뜻을 같이하고 있다. 베른이 이제 「아마도 모스크바 다음으로 가장 중요한 일본의 재외 공관」이기 때문이다.\n\n찰스 S. 체스턴", "secondary": "Washington, 2 August, 1945.\n\nThe following is the substance of a message, dated 1 August, received from Mr. Allen Dulles, Chief of the OSS mission in Wiesbaden. The information contained in this message is a sequel to memoranda dated 13, 16 and 18 July concerning a Japanese attempt to approach Allied authorities through OSS representatives.\n\nImmediately following is a summary of a report by Per Jacobsson, a Swedish national and economic adviser to the Bank for International Settlements, transmitted to Mr. Dulles through an intermediary:\n\nThe Japanese Chief of Staff has acknowledged without comment a long cable which Brigadier General Kiyotomi Okamoto sent from Switzerland on 19 July. Okamoto’s telegram reportedly stated that Japan has lost the war and must promptly accept the consequences. [Okamoto is believed to be the head of Japanese Intelligence in Europe.] [주20]\n\nThe Japanese Foreign Minister has also acknowledged a detailed report from Shunichi Kase, Japanese Minister in Bern. Kase’s report, sent on or about 21 July, included (a) Mr. Grew’s statement of 10 July, (b) a memorandum from Kojiro Kitamura, director of the Bank for International Settlements and former financial attaché in Berlin, who has been active in the current Japanese approaches to Mr. Dulles, and (c) a statement of Kase’s own position. The Foreign Minister’s reply to Kase’s message contained the following query: “Is that all you have to say?” Kase interprets this query as an invitation to continue peace approaches.\n\n[493면]\n\nThe recent tripartite ultimatum to Japan [주21] has been the chief topic of discussion among Japanese groups in Switzerland. Their first reaction, on the basis of excerpts published in the Swiss press, was that (a) the proclamation showed a lack of understanding of Japanese character, (b) the document should have not been framed on a basis of “take it or leave it”, (c) the inclusion of China as a signatory represented an “added element of humiliation”, and (d) the document should have been sent through private channels rather than publicly. After receiving the full English text through Jacobsson, and after further study, the attitude of the group changed, and the proclamation was accepted as an “astute document which left a possible way out”. The group was particularly impressed by “unconditional surrender” in connection with the “Japanese armed forces” and to the reference to revival and strengthening of democratic tendencies among the Japanese people. As a result, a telegram stressing these points was to be sent to Tokyo on 30 July.\n\nThe following is a summary of a memorandum to Mr. Dulles from the Japanese group in contact with Per Jacobsson. Jacobsson transmitted this memo along with his own report summarized above.\n\nThe Japanese group emphasizes that it is hoping for some decision within a week unless “resistance is too great”. The Allies should not take “too seriously” what was said over the Tokyo radio about the tripartite proclamation. This radio comment was merely “propaganda to maintain morale in Japan”. The real reply will be given through some “official channel”, possibly by Minister Kase or General Okamoto, if an official Government reply is not made over the Tokyo radio.\n\nMr. Dulles also has been informed, by a German authority on the Far East living in Switzerland who is one of his regular contacts, that Yosikazu Fujimura, a Japanese Navy representative in Bern, has sent seven long cables to his superiors in Tokyo during the past two months urging immediate cessation of hostilities. His superiors cabled in reply that the Japanese Navy no longer is able to “act alone”, and instructed Fujimura not to take the initiative without orders from Tokyo, but to maintain his “most valuable contacts”.\n\n[Fujimura, a former Japanese Assistant Naval Attaché in Bern, reportedly has direct radio contact with the Navy Ministry and Navy [494면] Chief of Staff [주22] in Tokyo. To this same German source Fujimura previously had indicated an interest in the part which Mr. Dulles played in arranging for the German capitulation in North Italy and in ascertaining what terms short of unconditional surrender might have been granted these Germans. He suggested that Japanese naval circles in Tokyo would be willing to surrender provided they were given assurances (a) that the Emperor would be retained and (b) if possible, that they could save some face from the present wreckage. Fujimura’s approaches were the subject of memoranda dated 2 and 4 June.] [주23]\n\nThe German source reports and Jacobsson confirms that Fujimura and Kitamura have established close contact with each other. The two men, Jacobsson confirms, are agreed that joint action by all Japanese services in Switzerland might make some impression on the Japanese Government, since Bern now “is probably next to Moscow the most important Japanese foreign post.”\n\nCharles S. Cheston", "notes": ["[주20] 대괄호는 원문에 있는 것이다.", "[주21] 7월 26일 포츠담에서 미국·중국·영국의 정부 수반이 승인한 일본의 항복을 요구하는 선언에 관하여는 Foreign Relations, The Conference of Berlin (The Potsdam Conference), 1945, 제2권 1474면을 보라. 일본의 무조건 항복에 관한 그 이전의 자료에 관하여는 같은 책 제1권 884면 이하 및 같은 책 제2권 1248면 이하를 보라.", "[주22] 도요다 소에무 대장(Adm. Soemu Toyoda).", "[주23] 대괄호는 원문에 있는 것이다."], "note": "번역자 주 — 이 경로의 종착점이자 두 갈래가 합류하는 문서다. 5~6월의 「독일계 소식통 → 후지무라(해군)」 갈래와 7월의 「야콥손 → 기타무라·요시무라(국제결제은행) → 가세·오카모토」 갈래가, 마지막 문단에서 「후지무라와 기타무라가 서로 긴밀한 접촉을 맺었다」로 만난다.\n\n가장 무거운 대목은 오카모토의 7월 19일 전보다 — 'Okamoto's telegram reportedly stated that Japan has lost the war and must promptly accept the consequences.' 원문에 'reportedly'가 붙어 있음에 유의해야 한다. 이것은 전보 원문이 아니라 야콥손이 중개인을 거쳐 덜레스에게 전한 요약이며, 전언 층위는 「오카모토의 전보 → (도쿄 참모총장의 무논평 접수라는 사실) → 일본 측 집단 → 야콥손 → 중개인 → 덜레스(8/1) → 체스턴 → 국무장관」의 여섯 겹이다. 'must promptly accept the consequences'는 「그 결과를 즉시 받아들여야 한다」로 옮겼다 — 'must'이므로 「해야 한다」이고 'should'로 뭉개지 않았다.\n\n외무대신의 회답 「Is that all you have to say?」는 원문이 인용부호로 묶은 직접 인용이므로 낫표로 옮기고 문장 형태를 그대로 두었다. 이 물음을 「강화 접근을 계속하라는 권유」로 읽은 것은 가세 자신의 해석이다('Kase interprets this query as').\n\n낱말 구분: 'unconditional surrender'(무조건 항복), 'the German capitulation in North Italy'(북이탈리아 독일군의 항복 = capitulation), 'terms short of unconditional surrender'(무조건 항복에 못 미치는 조건), 'immediate cessation of hostilities'(즉각적인 적대행위 중지), 'peace approaches'(강화 접근)를 각각 구별하여 옮겼다. 특히 후지무라가 도쿄에 촉구한 것은 'surrender'가 아니라 'cessation of hostilities'다.\n\n포츠담 선언에 대한 일본 측 집단의 태도 변화가 이 문서의 또 하나의 핵심이다. 그들이 「빠져나갈 길」로 읽어낸 근거는 두 가지 — 「무조건 항복」이 국가가 아니라 「일본 군대(Japanese armed forces)」에 걸려 있다는 점, 그리고 민주적 경향의 부활·강화 언급이다. 이는 d361에서 야콥손이 「말장난」이라 일축했던 「육·해군만의 무조건 항복」 논리가 포츠담 선언 문언에서 근거를 얻었다고 그들이 판단했음을 뜻한다.\n\n원문의 대괄호 문단 두 곳(오카모토 신원, 후지무라 신원과 경위)은 각주 20·23에 따라 원문 각서 자체에 있는 것이므로 대괄호째 본문에 두었다.\n\n원문 표기 'Yosikazu Fujimura'는 훈령식 로마자 표기이며 헵번식으로는 Yoshikazu다. 후지무라 요시카즈(藤村義朗)로 짐작되나 원문에 한자가 없으므로 원문 로마자를 병기했다. 기타무라 고지로(北村孝治郎), 가세 슌이치(加瀬俊一), 오카모토 기요토미(岡本清福), 도요다 소에무(豊田副武)도 마찬가지다.\n\n본문의 「일본 참모총장」과 「일본 외무대신」은 원문에 직명으로만 나온다. 각각 우메즈 요시지로(d361 각주 17에서 확인)와 도고 시게노리(d361 본문)로 짐작되나 이 문서 자체에는 이름이 없으므로 본문에 넣지 않고 people에만 그 사정과 함께 적었다.\n\n'the recent tripartite ultimatum to Japan'을 「최근의 대일 삼국 최후통첩」으로 직역했다. 각주 21이 밝히듯 포츠담 선언을 가리키나 원문이 '선언(proclamation)'과 '최후통첩(ultimatum)'을 나누어 쓰고 있으므로 각각 다르게 옮겼다.", "warn": false, "pages": ["492", "493", "494"], "search": "Charles S. Cheston 찰스 S. 체스턴 — 전략사무국(OSS) 국장대리, 이 각서의 작성자 Allen Dulles 앨런 덜레스 — 비스바덴 OSS 임무단장 Per Jacobsson 페르 야콥손 — 스웨덴 국적자, 국제결제은행(BIS) 경제고문 Kiyotomi Okamoto 오카모토 기요토미 — 소장, 유럽 주재 일본 정보 조직 수장으로 여겨짐. 7월 19일 스위스에서 긴 전보를 보냄 Shunichi Kase 가세 슌이치 — 베른 주재 일본 공사 Kojiro Kitamura 기타무라 고지로 — 국제결제은행 이사, 전 베를린 주재 재무관 Yosikazu Fujimura 후지무라 요시카즈 — 베른 주재 일본 해군 대표, 전 베른 주재 일본 해군무관보 Soemu Toyoda 도요다 소에무 — 해군 군령부총장(대장) (각주 22) Joseph C. Grew 그루 — 국무차관. 7월 10일 성명 Shigenori Togo 도고 시게노리 — 일본 외무대신 (원문에는 직명 'the Japanese Foreign Minister'로만 나온다) Yoshijiro Umezu 우메즈 요시지로 — 일본 참모총장 (원문에는 직명 'The Japanese Chief of Staff'로만 나온다)"}, {"id": "d368", "order": 368, "date": "1944-12-28", "group": "X", "eyebrow": "d368 · Memorandum of Conversation, by the Under Secretary of State (Grew)", "title": "국무차관(그루)의 대화 비망록", "badge": null, "list_right": "문서 368", "meta": [{"k": "일자", "v": "1944-12-28"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 PW/12–2844", "txt": true}, {"k": "발신", "v": "국무차관 그루(Joseph C. Grew) — 비망록 작성자", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "대화 비망록"}], "links": [{"k": "FRUS", "text": "문서 368 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d368"}], "summary": "합동참모본부 합동전후위원회의 스트롱 소장이 그루를 찾아와, 위원회가 작성한 대일 항복 조건 초안 문서철을 건네고 합동참모본부 제출 전에 국무부의 견해를 구했다는 기록.", "points": ["1944년 12월 28일, 미 육군 소장 조지 V. 스트롱이 자기 요청으로 그루를 찾아와, 합동참모본부의 합동전후위원회(Joint Post-War Committee)가 작성한 「제안된 일본 항복 조건(proposed Japanese surrender terms)」을 담은 문서 한 벌[주27]을 건넸다.", "스트롱은 자기 위원회가 독일 항복 조건[주28]에 전적으로 만족하지는 못했다고 말했다. 그 조건이 충분한 검토와 성숙한 숙고를 거치지 못했다고 그가 느꼈기 때문이다.", "따라서 그는 일본에 제시할 항복 조건을 정하는 데 시간을 낭비해서는 안 된다고 느꼈고, 이 문서들이 합동참모본부에 제출되기 전에 국무부의 견해를 듣기를 바랐다.", "스트롱은 이 조건들이 순전히 군사적인 것이며, 국무부가 조건의 정치적·경제적 국면에 관하여 견해를 제시하고자 하리라는 점을 인정했다.", "그루는, 스트롱도 알다시피 국무부 사람들이 대일 전후 계획에 관해 근 2년 가까이 작업해 왔으며, 그 문서들을 육군부·해군부의 주의에 올리기 위해 채택할 절차를 검토 중이라고 말했다.", "그루는 앞에 놓인 문제가 두 벌의 문서를 통합(integrate)하는 일이 되리라고 상정했다. 스트롱은 자기 위원회가 바라는 바는 무엇이든 기꺼이 하겠다고 말했다.", "그루는 이와 관련하여 연락위원회(Liaison Committee)를 언급했고, 국무부 문서를 그리로 회부할 수 있으리라고 했다. 그루는 국무부 자체 문서에 관해 따를 절차를 적당한 때에 스트롱에게 알려 주기로 했다."], "primary": "[워싱턴,] 1944년 12월 28일.\n\n미 육군 소장 조지 V. 스트롱(Major General George V. Strong)이 자신의 요청으로 오늘 나를 찾아와, 합동참모본부의 합동전후위원회(Joint Post-War Committee of the Joint Chiefs of Staff)가 작성한 제안된 일본 항복 조건(proposed Japanese surrender terms)을 다룬 문서 한 벌[주27]을 나에게 건넸다. 스트롱 장군은 자기 위원회가 독일 항복 조건[주28]에 전적으로 만족하지는 못하고 있다고 말했는데, 그 조건이 충분한 검토와 성숙한 숙고를 받지 못했다고 그가 느꼈기 때문이다. 그러므로 그는 일본에 제시될 항복 조건을 정하는 데 우리가 시간을 낭비해서는 안 된다고 느꼈으며, 이 문서들이 합동참모본부에 제출되기 전에 그에 관한 우리의 견해를 들을 수 있으면 좋겠다고 했다. 그는 이 조건들이 순전히 군사적인 것이며 국무부가 그 조건의 정치적·경제적 국면에 관한 견해를 제시하고자 하리라는 사실을 인정했다.\n\n나는 스트롱 장군에게, 그도 알다시피 우리 사람들이 일본에 관한 전후 계획을 두고 2년 가까운 기간의 대부분을 작업해 왔으며, 우리 문서를 육군부와 해군부의 주의에 올리기 위해 채택할 절차를 우리가 검토하고 있다고 말했다. 나는 우리 앞에 놓인 문제가 두 벌의 문서를 통합하는 일이 되리라고 상정했다. 스트롱 장군은 그의 [498면] 위원회가 바라는 바가 무엇이든 기꺼이 그렇게 하겠다고 말했다. 나는 이와 관련하여 연락위원회(Liaison Committee)를 언급했는데, 우리 문서가 그리로 회부될 수 있을 것이었다. 나는 우리 자신의 문서에 관하여 우리가 따를 수 있을 절차를 적당한 때에 스트롱 장군에게 알려 주기로 했다.\n\n조지프 C. 그루(Joseph C. Grew)", "secondary": "[Washington,] December 28, 1944.\n\nMajor General George V. Strong, United States Army, called on me today at his request and handed me a set of papers [주27] covering the proposed Japanese surrender terms which had been drawn up by the Joint Post-War Committee of the Joint Chiefs of Staff. General Strong said that his Committee was not altogether satisfied with the German surrender terms, [주28] which he felt had not been given sufficient study and mature consideration. He, therefore, felt that we should waste no time in determining the surrender terms to be offered Japan, and he would be glad to have our views on these papers before they are submitted to the Joint Chiefs of Staff. He recognized the fact that these terms were purely military and that the Department of State would wish to presents its views concerning the political and economic phases of the terms.\n\nI said to General Strong that, as he knew, our people had been working for the better part of two years on post-war planning with reference to Japan, and that we were considering the procedure to be adopted for bringing our papers to the attention of the War and Navy Departments. I assumed that the problem before us would be to integrate the two sets of papers. General Strong said that his [498면] Committee would be happy to do whatever might be desired. I mentioned in this connection the Liaison Committee, to which our papers might be referred. I undertook to let General Strong know in due course the procedure which we might follow concerning our own papers.\n\nJoseph C. Grew", "notes": ["[주27] 아래 문서(Infra).", "[주28] 1944년 7월 25일자 유럽자문위원회(European Advisory Commission) 보고 참조. Foreign Relations, The Conferences at Malta and Yalta, 1945, pp. 110–118."], "note": "번역자 주 — 이 묶음에서 가장 이른 문서다(1944년 12월 28일). 값어치는 시점에 있다 — 독일 항복 이전, 일본 본토 상륙 논의 이전에 이미 군 측이 「일본 항복 조건」 초안을 만들어 국무부에 회람하고 있었다. 낱말 구분을 지켰다: 'surrender terms'는 「항복 조건」, 'unconditional surrender'는 이 문서에 나오지 않는다. 'Joint Post-War Committee'는 합동참모본부 예하 기구이므로 「합동전후위원회」로 옮기고 원어를 병기했다. 'Liaison Committee'는 국무·육군·해군 간 연락 기구를 가리키는 것으로 보이나 원문에 정식 명칭 설명이 없어 「연락위원회」로 직역했다. 'for the better part of two years'는 「2년 가까운 기간의 대부분」으로 직역했다. 'I undertook to let ... know'의 undertake(약속하여 떠맡다)를 「알려 주기로 했다」로 옮겼다. 각주 27 'Infra'는 FRUS 편찬 관례상 「바로 아래 문서」를 뜻하며, 스트롱이 건넨 문서철이 이어서 인쇄되어 있음을 가리킨다.", "warn": false, "pages": ["497", "498"], "search": "Joseph C. Grew 조지프 C. 그루 — 국무차관, 이 비망록의 작성자 George V. Strong 조지 V. 스트롱 — 미 육군 소장, 합동참모본부 합동전후위원회"}, {"id": "d370", "order": 370, "date": "1945-01-03", "group": "B", "eyebrow": "d370 · Memorandum by the Under Secretary of State (Grew) to the Secretary of State", "title": "국무차관(그루)이 국무장관에게 보낸 각서", "badge": null, "list_right": "문서 370", "meta": [{"k": "일자", "v": "1945-01-03"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.0011 PW/12–1644", "txt": true}, {"k": "발신", "v": "국무차관 그루(Joseph C. Grew)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 370 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d370"}], "summary": "종군기자 셔로드가 「천황을 살려 두자」는 태도를 유화(appeasement)라 비판한 데 대하여, 그루가 니미츠 제독과 완전히 의견이 일치했다며 — 천황은 일본을 무조건 항복으로 이끌고 점령 후 혼란과 게릴라전을 피하는 데 중요한, 어쩌면 필수적인 자산일 수 있으므로 당분간 천황을 건드리지 말자고 국무장관에게 개진한 각서.", "points": ["그루는 이 문제[주29 — 종군기자 로버트 셔로드가 1944년 12월 16일자 편지에서 「천황을 살려 두자는 유화로 우리 자신을 속이고 있다」고 문제 삼은 것]를 니미츠 제독[주30] 및 그의 심리전 장교들과 충분히 논의했다.", "그들은 당분간 천황을 건드리지 않는 편이 낫다는 데 완전히 의견이 일치했다. 천황이 필수적이지는 않더라도 중요한 자산으로 판명될 수 있기 때문이다.", "그 자산은 두 가지 점에서다 — 일본을 무조건 항복(unconditional surrender)으로 이끄는 데, 그리고 결국 도쿄를 점령한 뒤의 혼란과 게릴라전을 피하는 데.", "달리 말하면 천황의 존재가 미국인 수천 명의 목숨을 구하는 원천이 될 수 있다고 생각할 여지가 있다.", "적어도 천황의 목소리는 일본 국민이, 그리고 아마도 일본 군대가 복종할 법한 유일한 목소리다.", "물론 이것은 아직 상황 속에서 헤아릴 수 없는(imponderable) 요소이지만, 제독도 그루와 마찬가지로, 이 장래의 문제들 — 지금 그대로도 충분히 어려운 문제들 — 을 푸는 데 있어 상상할 수 있는 어떤 자산이든 맹목적 편견 때문에 스스로 버리는 것은 어리석은 일이라고 여긴다.", "밥 셔로드가 「유화(appeasement)」라는 낱말을 쓴 것은, 그가 우리 육해군 지도자들의 신중히 연구된 견해보다 정보에 어두운 여론에 더 귀 기울이는 쪽으로 기울어 있을 수 있음을 보여준다."], "primary": "[워싱턴,] 1944[1945]년 1월 3일.\n\n장관님: 나는 이 문제[주29]를 니미츠 제독[주30]과, 또한 그의 심리전 장교들과 충분히 논의했으며, 우리는 [516면] 당분간 우리가 천황을 건드리지 않는 편이 낫다는 데 완전히 의견이 일치했다. 천황이, 필수적인 자산은 아닐지라도 중요한 자산으로 판명될 수 있기 때문이다 — 일본을 무조건 항복(unconditional surrender)으로 이끄는 데 있어서도, 우리가 결국 도쿄를 점령한 뒤의 혼란과 게릴라전을 피하는 데 있어서도 그렇다. 달리 말하면, 천황의 존재는 미국인 수천 명의 목숨을 구하는 원천이 될 수 있다고 생각할 여지가 있다. 적어도 천황의 목소리는 일본 국민이, 그리고 아마도 일본 군대가 복종할 법한 유일한 목소리다. 물론 이것은 아직 이 상황에서 헤아릴 수 없는(imponderable) 요소이지만, 제독은 나와 마찬가지로, 이 장래의 문제들 — 지금 그대로도 충분히 어려운 문제들 — 을 푸는 데 있어 상상할 수 있는 어떤 자산이든 맹목적 편견을 통해 우리 스스로에게서 빼앗아 버리는 것은 어리석은 일이리라고 느낀다.\n\n밥 셔로드(Bob Sherrod)가 「유화(appeasement)」라는 낱말을 쓴 것은, 그가 우리 육군·해군 지도자들의 신중히 연구된 견해보다 정보에 어두운 여론에 더 귀를 기울이는 쪽으로 기울어 있을 수 있음을 보여준다.\n\n조지프 C. 그루(Joseph C. Grew)", "secondary": "[Washington,] January 3, 1944[1945].\n\nMr. Secretary: I discussed this matter [주29] fully with Admiral Nimitz [주30] as well as with his psychological warfare officers and we were [516면] in complete agreement that for the present we had better let the Emperor alone, as he might be found to be an important, if not an essential asset, both in bringing Japan to unconditional surrender and in avoiding chaos and guerilla warfare after our eventual occupation of Tokyo. In other words, the presence of the Emperor may conceivably be the source of saving thousands of American lives. At least, the Emperor’s voice is the only voice which the Japanese people, and probably the Japanese military forces, are likely to obey. This, of course, is as yet an imponderable factor in the situation, but the Admiral feels, as do I, that it would be stupid to deprive ourselves through blind prejudice of any conceivable asset in solving these future problems, difficult enough as they are.\n\nBob Sherrod’s use of the word “appeasement” indicates that he may be more inclined to listen to uninformed public opinion than to the carefully studied views of our military and naval leaders.\n\nJoseph C. Grew", "notes": ["[주29] 태평양의 종군기자 로버트 셔로드(Robert Sherrod)가 보낸 1944년 12월 16일자 편지. 「천황을 살려 두자는 우리의 유화로 우리 자신을 속이는 것(deluding ourselves with our spare-the-emperor appeasement)」에 의문을 제기한 것이다.", "[주30] 함대제독 체스터 W. 니미츠(Chester W. Nimitz), 미 태평양함대 및 태평양지역 총사령관."], "note": "번역자 주 — 연도 표기가 원문에서 1944년으로 오기되어 있고 편찬자가 [1945]로 바로잡았다 — 본문에도 그 대괄호를 그대로 살렸다. 수신자 「국무장관」은 당시 에드워드 R. 스테티니어스 주니어이나 원문에 이름이 없어 직함만 옮겼다. 가정법과 단정을 구분해 옮겼다: 'might be found to be'(판명될 수 있다), 'may conceivably be'(…이 될 수 있다고 생각할 여지가 있다), 'are likely to obey'(복종할 법한). 'imponderable'은 저울로 달 수 없다 = 계량 불가능하다는 뜻이므로 「헤아릴 수 없는」으로 옮기고 원어를 병기했다. 'unconditional surrender'는 「무조건 항복」으로 고정했다 — 이 문서에서 천황 보존론은 무조건 항복을 포기하자는 것이 아니라 무조건 항복을 얻어내기 위한 수단으로 제시되어 있다. 'appeasement'는 1930년대 대독 유화를 가리키는 정치적 낙인어이므로 「유화」로 옮기고 원어를 병기했다. 그루의 주일대사 경력에서 나온 판단이나 그 배경은 원문에 없으므로 본문에 넣지 않았다.", "warn": false, "pages": ["515", "516"], "search": "Joseph C. Grew 조지프 C. 그루 — 국무차관, 이 각서의 작성자 Chester W. Nimitz 체스터 W. 니미츠 — 함대제독, 미 태평양함대 및 태평양지역 총사령관 Robert (Bob) Sherrod 로버트(밥) 셔로드 — 태평양의 종군기자 Emperor (Hirohito) 천황 — 본문에서는 이름 없이 \"the Emperor\"로만 지칭"}, {"id": "d378", "order": 378, "date": "1945-05-22", "group": "B", "eyebrow": "d378 · Memorandum by the Joint Chiefs of Staff  Circulated as SWNCC 21/2, May 23.", "title": "합동참모본부의 각서 (5월 23일 SWNCC 21/2로 배포)", "badge": null, "list_right": "문서 378", "meta": [{"k": "일자", "v": "1945-05-22"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "SM–1841"}, {"k": "원문출처", "v": "SWNCC 21 Series (각주 56: 5월 23일 SWNCC 21/2로 배포되었다)", "txt": true}, {"k": "발신", "v": "합동참모본부(JCS) — 합동참모본부를 대신하여 서기 A. J. 맥팔런드(A. J. McFarland) 준장, 미육군", "txt": true}, {"k": "수신", "v": "국무·육군·해군 3부조정위원회(SWNCC)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 378 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d378"}], "summary": "SWNCC 극동소위원회의 「일본의 무조건 항복」(SWNCC 21) 보고서에 대한 합동참모본부의 군사적 견해 — 「국제연합군 총사령관」이라는 직명 대신 「지정된 사령관」이라는 표현을 쓸 것, 지정될 경우 그는 미국 군대의 장교여야 한다는 것, 부록 E의 「홋카이도」를 삭제할 것, 독일에 대한 항복 문서를 둘러싼 논의의 결과에 비추어 부록들을 재검토할 것을 권고한다.", "points": ["표제: 일본의 무조건 항복(Unconditional surrender of Japan). 합동참모본부는 국무장관에게 다음과 같이 통보할 것을 권고한다.", "합동참모본부는 「일본의 무조건 항복」에 관한 국무·육군·해군 3부조정 극동소위원회 보고서(SWNCC 21)에 담긴 군사적 함의를 검토하였으며 다음의 의견을 제출한다.", "그 문서들 전체에서 「국제연합군 총사령관(Commander-in-Chief, United Nations Armed Forces)」이라는 직명이 쓰였는데, 이는 무조건 항복 시점까지 그렇게 지정된 사령관이 임명되어 있을 것이고, 이 사령관이 항복을 접수할 것이며, 적어도 처음에는 군정(軍政)이라는 방식을 통하여 일본에 부과되는 조건을 집행하는 일을 전적으로 맡을 것이라는 전제 위에 선 것이다.", "현재 「국제연합군 총사령관」이라는 직명을 가진 장교는 존재하지 않으므로, 그 문서들이 작성된 전제는 그 직명과 문서에 쓰인 「연합국(미국) 최고사령부(Supreme Allied (United States) Command)」라는 말 대신 「지정된 사령관(designated commander)」이라는 표현을 씀으로써 충족되는 편이 낫다.", "장래의 사태가 그러한 사령관 구상의 수정을 요구한다면, 항복 시점에 실제로 존재하는 지휘 상황에 부합하도록 문서들에 적절한 변경을 가하여야 한다.", "일본의 항복 또는 완전한 패배에 관한 문서들은 지정된 사령관이 임명될 경우 미국 군대의 장교일 것을 상정하고 있다. 합동참모본부는 태평양 전쟁에서 미국 군대가 맡고 있는 압도적 역할이 그러한 전제를 충분히 정당화한다는 의견이다.", "합동참모본부는 또한 (SWNCC 21 부록 「E」 13면 12행의) 「홋카이도」를 삭제하여야 한다고 본다.", "그 밖의 사소한 변경으로, 일본 천황의 선포문 제3항 넷째 줄의 「duties(임무)」 앞과 제1호 포고 제2항 셋째 줄의 「official(관리)」 앞에 「non-combatant(비전투)」라는 낱말을 넣는 것이 바람직하다고 본다.", "합동참모본부는 독일에 관하여 체결된 무조건 항복 문서와 그 뒤에 발하여졌거나 발하여질 포고들이 그 형식을 두고 아직 끝나지 않은 얼마간의 논의를 불러일으켰음을 알고 있다.", "합동참모본부는 그 논의가 SWNCC 21 부록들의 형식 변경으로 마땅히 이어질 만한 결정을 낳을 수 있다고 본다. 이에 따라 SWNCC와 그 해당 소위원회들이 부록들을 재검토할 것을 제안한다.", "재검토의 관점은 (a) 독일에 관한 현재의 논의가 이 부록들의 변경으로 이어져야 하는지, (b) 이 부록들이 지정된 점령 사령관에게 점령 목적의 달성을 쉽게 할 충분한 권한을 주기 위하여 실행 가능한 만큼 나아가 있는지 — 특히 여러 국제 조약에 담긴 제약으로부터 점령을 자유롭게 하는 것과 관련하여 — 를 정하는 데 있다.", "위의 의견을 조건으로 하여, 합동참모본부는 군사적 관점에서 SWNCC 21의 다섯 부록에 이의가 없다."], "primary": "SM–1841\n\n워싱턴, 1945년 5월 22일.\n\n국무·육군·해군 3부조정위원회 앞 각서:\n\n표제: 일본의 무조건 항복.\n\n합동참모본부는 국무장관에게 다음과 같이 통보할 것을 권고한다.\n\n「합동참모본부는 「일본의 무조건 항복」에 관한 국무·육군·해군 3부조정 극동소위원회 보고서(SWNCC 21)[주57]에 담긴 군사적 함의를 검토하였으며, 다음의 의견을 제출한다.\n\n「그 문서들 전체에 걸쳐 「국제연합군 총사령관」이라는 직명이 쓰였는데, 이는 무조건 항복의 시점까지 그와 같이 [544면] 지정된 사령관이 임명되어 있을 것이고, 이 사령관이 항복을 접수할 것이며, 적어도 처음에는 그가 군정(軍政)이라는 방식을 통하여 일본에 부과되는 조건을 집행하는 일을 전적으로 맡을 것이라는 전제 위에서였다. 현재로서는 「국제연합군 총사령관」이라는 직명을 가진 장교가 존재하지 아니하므로, 그 문서들이 작성된 전제는 그 직명 및 문서 안에서 쓰인 「연합국(미국) 최고사령부」라는 말이 있는 곳마다 그 대신 「지정된 사령관」이라는 표현을 씀으로써 충족되는 것이 바람직하다. 만일 장래의 사태가 그러한 사령관에 관한 구상의 수정을 요구한다면, 항복 시점에 실제로 존재하는 지휘 상황에 그 문서들이 부합하도록 적절한 변경을 가하여야 한다.\n\n「일본의 항복 또는 완전한 패배에 관한 문서들은, 지정된 사령관이 임명될 경우 그가 미국 군대의 장교일 것을 상정하고 있다. 합동참모본부는 태평양 전쟁에서 미국 군대가 맡고 있는 압도적인 역할이 그러한 사령관이 지정된다면 그는 우리나라 군대의 장교이리라는 전제를 충분히 정당화한다는 의견이다.\n\n「합동참모본부는 또한 (SWNCC 21 부록 「E」 13면 12행의) 「홋카이도」가 삭제되어야 한다고 본다.\n\n「그 밖에 바람직하다고 여겨지는 사소한 변경으로는, 일본 천황의 선포문 제3항 넷째 줄의 「임무(duties)」라는 낱말 앞에, 그리고 제1호 포고 제2항 셋째 줄의 「관리(official)」라는 낱말 앞에 「비전투(non-combatant)」라는 낱말을 삽입하는 것이다.\n\n「합동참모본부는 독일에 관하여 체결된 무조건 항복 문서[주58]와 그 뒤에 발하여졌거나 발하여질 포고들이 그 형식을 두고 아직 끝나지 아니한 얼마간의 논의를 불러일으켰음을 알고 있다. 합동참모본부는 이 논의가 SWNCC 21 부록들의 형식에 변경을 가져오는 것으로 마땅히 이어질 만한 결정을 낳을 수 있다고 본다. 따라서 합동참모본부는 국무·육군·해군 3부조정위원회와 그 해당 소위원회들이 다음을 정할 목적으로 이 부록들을 재검토할 것을 제안한다: (a) 독일에 관한 현재의 논의가 이 부록들의 변경으로 이어져야 하는지, 그리고 (b) 이 부록들이, 특히 여러 국제 조약에 담긴 제약으로부터 점령을 [545면] 자유롭게 하는 것과 관련하여, 지정된 점령 사령관에게 점령의 목적 달성을 쉽게 할 충분한 권한을 주기 위하여 실행 가능한 만큼 나아가 있는지.\n\n「위의 의견을 조건으로 하여, 합동참모본부는 군사적 관점에서 SWNCC 21의 다섯 부록에 아무런 이의를 보지 아니한다.」\n\n합동참모본부를 대신하여:\n\nA. J. 맥팔런드\n\n미육군 준장, 서기", "secondary": "SM–1841\n\nWashington, 22 May, 1945.\n\nMemorandum for the State-War-Navy Coordinating Committee:\n\nSubject: Unconditional surrender of Japan.\n\nThe Joint Chiefs of Staff recommend that the Secretary of State be informed as follows:\n\n“The Joint Chiefs of Staff have considered the military implications in the report of the State-War-Navy Coordinating Subcommittee for the Far East relating to the ‘Unconditional Surrender of Japan’ (SWNCC 21 [주57] ) and they submit the following comments.\n\n“Throughout the documents, the title ‘Commander-in-Chief, United Nations Armed Forces’ has been used on the assumption that such a [544면] designated commander will have been named by the time of the unconditional surrender, that this commander will receive the surrender and that he will, at least initially, be in full charge of enforcing the terms imposed upon Japan through the medium of military government. Since at this time no officer with the title ‘Commander-in-Chief, United Nations Armed Forces’ exists, it is preferable that the assumptions on which the documents have been drawn be met by the use of the expression ‘designated commander’ in place of the title ‘Commander-in-Chief, United Nations Armed Forces’ and the words ‘Supreme Allied (United States) Command’ wherever used in the documents. Should future events require the amendments of the conception of such a commander, appropriate changes must be made in the documents to make them conform to the command situation actually existing at the time of surrender.\n\n“The documents relating to the surrender or total defeat of Japan contemplate that the designated commander, if appointed, shall be an officer of the United States armed forces. The Joint Chiefs of Staff are of the opinion that the predominant role being played by United States forces in the war in the Pacific fully warrant the assumption that, if such a commander is designated, he will be an officer of this country’s armed forces.\n\n“The Joint Chiefs of Staff also believe that ‘Hokkaido’ (Appendix “E”, page 13, line 12, SWNCC 21) should be deleted.\n\n“Further but minor changes considered desirable are the insertion of the word ‘non-combatant’ before the word ‘duties’ in the fourth line of the third paragraph of the Proclamation by the Emperor of Japan and also before the word ‘official’ in line 3 of the paragraph numbered 2 of Proclamation No. 1.\n\n“The Joint Chiefs of Staff are aware that the instruments of unconditional surrender executed with respect to Germany [주58] and the proclamations issued or to be issued subsequent thereto have given rise to some discussion, not yet completed, as to their form. They believe that these discussions may result in determinations which might properly lead to changes in the form of the appendices to SWNCC 21. Accordingly, they suggest that these appendices be re-examined by the State-War-Navy Coordinating Committee and its appropriate subcommittees with a view to determining (a) whether the current discussions as to Germany should lead to changes in these appendices, and (b) whether these appendices go as far as is practicable to give to the designated occupying commander sufficient powers to facilitate achievement of the objectives of the occupation, particularly in respect [545면] to freeing the occupation from the restrictions contained in various international conventions.\n\n“Subject to the foregoing comments, the Joint Chiefs of Staff perceive no objection from the military point of view to the five appendices to SWNCC 21.”\n\nFor the Joint Chiefs of Staff: \n\n\nA. J. McFarland\n\nBrigadier General, U.S.A. Secretary", "notes": ["[주56] 5월 23일 SWNCC 21/2로 배포되었다.", "[주57] 2월 7일자, 521면.", "[주58] 1945년 5월 7일 및 8일의 독일 항복 문서(Acts of Military Surrender of Germany)에 관하여는 Department of State Executive Agreement Series No. 502 또는 59 Stat. (pt. 2) 1857을 보라. 독일의 항복에 이르는 교섭에 관한 자료에 관하여는 제3권 717면 이하를 보라."], "note": "번역자 주 — 이 묶음의 다른 여섯 건(베른 OSS 경로)과 성격이 다르다. 전언 보고가 아니라 합동참모본부가 SWNCC에 낸 공식 의견서이며, SWNCC 21 계열 문서다. 독일 항복(5월 7·8일) 직후에 나왔고, 각주 58이 가리키듯 독일 항복 문서의 형식을 둘러싼 논의가 대일 항복 문서의 형식에도 반영되어야 한다는 것이 이 각서의 요지 가운데 하나다. 「독일의 항복이 일본에 어떻게 닿았는가」가 여기서는 첩보 경로가 아니라 문서 형식의 문제로 나타난다.\n\n문서번호는 번역하지 않았다: SM–1841, SWNCC 21, SWNCC 21/2.\n\n용어: 'Commander-in-Chief, United Nations Armed Forces'를 「국제연합군 총사령관」으로 옮겼다. 1945년 5월 시점의 'United Nations'는 전후의 국제연합(UN) 기구가 아니라 연합국 진영을 가리키는 말이므로 「연합국군 총사령관」으로 읽는 편이 뜻에 가까우나, 원문이 'Allied'와 'United Nations'를 같은 문단 안에서 나누어 쓰고 있어(Supreme Allied (United States) Command) 구별을 살리기 위해 직역했다. 뒤에 실제로 쓰이게 되는 '연합국최고사령관(SCAP)'과는 다른 직명이다.\n\n'designated commander'는 「지정된 사령관」으로 직역했다. 이 각서의 실질적 권고가 바로 이 낱말 교체이며, 이는 3개월 뒤 맥아더가 연합국최고사령관으로 지명되는 자리를 문서상으로 비워 두는 조치였다.\n\n조동사를 뭉개지 않았다: 'should be deleted'(삭제되어야 한다), 'must be made'(가하여야 한다), 'shall be an officer'(장교일 것을 상정한다 — 원문 'contemplate that … shall be'), 'will have been named'(임명되어 있을 것), 'may result in'(낳을 수 있다).\n\n부록 「E」에서 「홋카이도」를 삭제하라는 권고가 이 각서에서 가장 구체적인 지시다. 그러나 그 부록의 내용이 이 문서에 실려 있지 않아 무엇에서 삭제하라는 것인지는 원문만으로는 알 수 없다. 추측하지 않고 그대로 두었다.\n\n원문 인용부호: 국무장관에게 통보할 내용 전체가 큰따옴표로 묶여 있고 각 문단 첫머리마다 여는 따옴표가 반복된다(당시 조판 관례). 낫표(「」)로 옮기면서 그 반복을 그대로 살렸다.\n\n각주 56은 원문에서 표제(Memorandum by the Joint Chiefs of Staff)에 붙은 것이며 본문에 참조 표시가 없다. notes_ko에 넣어 두었다.", "warn": false, "pages": ["543", "544", "545"], "search": "A. J. McFarland A. J. 맥팔런드 — 미육군 준장, 합동참모본부 서기. 합동참모본부를 대신하여 서명"}, {"id": "d379", "order": 379, "date": "1945-05-28", "group": "X", "eyebrow": "d379 · Memorandum of Conversation, by the Acting Secretary of State", "title": "국무장관 대리의 대화 비망록", "badge": null, "list_right": "문서 379", "meta": [{"k": "일자", "v": "1945-05-28"}, {"k": "시각", "v": "회담은 「오늘 아침(this morning)」 로젠먼 판사와의 협의 뒤에 이루어졌다. 대통령과의 면담 자체의 시각은 적혀 있지 않다. 본문 끝에 이튿날 회의 시각이 명기되어 있다 — 「내일 오전 11시(11:00 a.m. tomorrow)」, 펜타곤 건물 스팀슨 사무실."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 PW/5–2845", "txt": true}, {"k": "발신", "v": "국무장관 대리(그루, Joseph C. Grew) — 비망록 작성자", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "대화 비망록"}], "links": [{"k": "FRUS", "text": "문서 379 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d379"}], "summary": "그루가 로젠먼 판사와 함께 트루먼 대통령을 찾아가, 일본의 무조건 항복을 앞당기기 위해 「일본인이 스스로 장래의 정치 체제를 결정하도록 허용된다」는 취지의 성명을 5월 31일 연설에 넣을 것을 건의하고, 천황제 존치론을 역사적 근거를 들어 개진한 기록. 대통령은 자기 생각도 같은 선을 따라왔다며 관심을 표하고 육군·해군장관, 마셜 장군, 킹 제독과 먼저 협의하도록 지시했다.", "points": ["5월 28일 오전 로젠먼 판사[주59]와 협의한 뒤 그루가 판사와 함께 대통령을 만나러 갔고, 방문 목적을 아래와 같이 개진했다.", "대일 전쟁 수행에서 기본이 되는 개념은, 우리의 주된 목표 — 즉 일본이 다시 세계 평화를 위협하는 일을 불가능하게 만드는 것 — 의 달성과 유지를 위해 지금이든 장래든 아무것도 희생되어서는 안 된다는 것이다. 이는 일본의 전쟁 도구와 일본인이 다시 그 도구를 만들 능력의 파괴를 뜻한다. 일본의 군사 기구는 전면적으로 파괴되어야 하고, 가능한 한 그들의 군국주의 숭배(cult of militarism)는 지워 없어져야 한다.", "그 전제 위에서, 우리 목적을 최소한의 미국인 생명 손실로 달성하는 것이 우리의 지향이어야 한다. 따라서 우리의 원칙이나 목표를 조금도 희생하지 않으면서 일본인이 지금 무조건 항복하기를 더 쉽게 만들 수 있는 조치라면 무엇이든 가장 신중히 고려해야 한다.", "그루는 일본인이 무엇을 할지 확실하게 예측하겠다고 나선 적이 결코 없지만, 일본인이 광신적인 국민이며 마지막 참호와 마지막 한 사람까지 싸울 가능성이 있고 어쩌면 그럴 법하다는 점을 기억해야 한다고 했다. 그렇게 될 경우 미국인 생명의 대가는 예측 불가능하다.", "일본인의 무조건 항복에 대한 가장 큰 장애는, 그것이 천황과 황위(皇位)라는 제도의 파괴 또는 영구적 제거를 수반하리라는 그들의 믿음이다. 일단 철저히 패배하고 장래에 전쟁을 수행할 힘이 없게 된 뒤에 그들 자신이 스스로의 장래 정치 구조를 결정하도록 허용되리라는 뜻을 지금 일본인에게 내비칠 수 있다면, 체면을 살릴 방도가 주어질 것이며 그것 없이는 항복이 대단히 있을 법하지 않다.", "그러한 성명은 이틀 전 일어난 도쿄의 대파괴 직후에 발표된다면 최대의 효과를 가지리라고 여겨진다. 바로 이 시점에서 그러한 성명이 갖는 심리적 충격은 매우 클 것이다.", "얼마 전 장제스는 자기 군대에 보낸 공개 전언에서, 패배하고 뉘우치는 일본은 스스로의 장래 정치 구조를 결정하도록 허용되어야 한다는 것이 자기 의견이라고 말했다. 그의 나라는 다른 어느 나라보다 일본으로부터 더 큰 고통을 받았다.", "일본인에게서 천황과 천황제를 빼앗는다는 생각은 온당하지 않다. 우리가 등을 돌리는 순간(우리는 일본을 영구히 점령할 여유가 없다) 일본인이 틀림없이 천황과 천황제를 도로 앉힐 것이기 때문이다. 장기적 관점에서 일본에 대해 우리가 바랄 수 있는 최선은 입헌군주제의 발전이다. 일본에서 민주주의는 결코 작동하지 않으리라는 것을 경험이 보여주었다.", "천황과 황위 제도가 일본 침략적 군국주의의 뿌리라고 여기는 이들은 역사의 사실에 밝을 리 없다. 약 800년 동안 천황들은 실제로 그 자리를 빼앗겨 교토에서 불안정한 생계를 이어가야 했고, 그들을 몰아낸 쇼군들이 도쿄에서 통치했다. 16세기에 중국과 조선을 상대로 전쟁을 벌이고 세계를 정복하겠다고 호언한 것은 쇼군 히데요시였다.", "1868년 왕정복고를 이룬 메이지 천황은 군국주의적 쇼군들을 이겨내고 일본을 온건하고 평화로운 길로 출발시킨 강한 인물이었다. 메이지 뒤를 이은 천황들은 강한 인물이 아니었고, 군부 극단주의자들이 지배권을 쥐고 천황들에게 영향력을 행사하기가 비교적 쉬워졌다. 히로히토가 1941년에 군부를 지지하고 선전포고를 재가하기를 거부했다면 십중팔구 그 선대들의 운명을 겪었을 것이다. 어느 경우든 그가 전쟁을 원했든 아니든 군부의 야망이라는 밀물을 막을 힘은 없었을 것이다.", "이 사실들은 일본이 군국주의적이기 위해 천황을 필요로 하지 않으며 일본인이 천황을 가졌기 때문에 군국주의적인 것도 아님을 분명히 보여준다. 그들의 군국주의는 천황 자신마저 장악하는 데 성공하고 진주만 이전 몇 해 동안 과격분자들을 억제하려 최선을 다하던 천황의 조언자들을 무력하게 만든, 나라 안의 군부 파벌과 그 숭배에서 솟아난다. 1936년 2월의 암살[주60]은 황위 주변의 평화 지향적 조언자들을 숙청하려는 특정한 목적으로 군부 극단주의자들이 일으킨 것이었다. 진주만 공격을 저지른 도조 장군[주61]과 그 일당은 옛날의 쇼군들과 똑같은 군사 독재자였고, 천황은 자신의 의사가 어떠했든 그들을 억제할 힘이 전혀 없었다.", "위 사실들이 히로히토를 전쟁 책임에서 조금이라도 벗겨 주는 것은 아니다. 선전포고에 서명한 이상 책임은 정면으로 그의 어깨에 놓여 있다. 쟁점은, 천황이 서명했든 아니든 극단주의 집단이 자기 뜻대로 했으리라는 데 있다. 일단 군부 극단주의자들이 패배를 통해 신용을 잃고 나면, 순전히 하나의 상징인 천황은, 일본 국민이 자기네 군 지도자들이 자신들을 저버렸음을 확신하게 되면 나타나리라 예상되는 새로운 지도자들에 의해 이용될 수 있고 아마도 이용될 것이다. 그러므로 황위 제도는, 군국주의자들이 장래에 바랄 것이 아무것도 없음을 호되게 배우고 나면, 그 나라의 평화로운 장래를 세우는 초석이 될 수 있다.", "그루는 이어서 대통령이 5월 31일로 예정된 연설에 넣는 것을 고려하고 싶어 할 법한 성명 초안(rough draft)을 제출했다.", "대통령의 반응 — 대통령은 그루가 말한 바에 관심이 있다고 말했다. 자기 자신의 생각도 같은 선을 따라오고 있었기 때문이라는 것이다. 그리하여 대통령은 그루에게, 우선 육군장관·해군장관, 마셜 장군[주62], 킹 제독[주63]과 이 문제를 논의할 회의를 마련하도록 요청했고, 그들이 견해를 교환한 뒤에는 같은 인원이 백악관에 와서 자신과 협의하기를 바란다고 했다.", "그루는 그러한 회의를 곧바로 이튿날 아침으로 마련하겠다고 말했고, 로젠먼 판사에게 합류를 청하여 판사가 그러겠다고 했다. (회의는 펜타곤 건물의 스팀슨 사무실에서 내일 오전 11시로 잡혔다.)", "로젠먼 판사는 초안 성명이 다소 더 다듬어질 수 있으리라 보고 서너 가지 점을 제안했으며, 우리는 그것을 성명에 넣도록 힘쓸 것이다."], "primary": "[워싱턴,] 1945년 5월 28일.\n\n오늘 아침 로젠먼 판사[주59]와의 협의를 마친 뒤 나는 판사와 함께 대통령을 만나러 갔고, 우리 방문의 목적을 다음과 같이 개진했다.\n\n일본에 대한 우리의 전쟁을 수행함에 있어, 우리의 주된 목표 — 즉 일본이 다시 세계 평화를 위협하는 일을 불가능하게 만드는 것 — 의 달성과 유지를 위해서는 지금이든 장래든 아무것도 희생되어서는 안 된다는 것이 초보적이고 근본적인 개념이다. 이는 일본의 전쟁 도구와, 일본인이 다시 그 도구를 만들 수 있는 능력의 파괴를 뜻할 것이다. 그들의 군사 기구는 전면적으로 파괴되어야 하며, 가능한 한 그들의 군국주의 숭배(cult of militarism)는 지워 없어져야 한다.\n\n앞의 근본 개념들을 전제로 삼는다면, 가능한 한 최소한의 미국인 생명 손실로써 우리의 목적을 달성하는 것이 우리의 지향이어야 한다. 그러므로 우리는, 우리의 원칙이나 목표를 어떤 정도로도 희생함이 없이 일본인이 지금 무조건 항복하기를 더 쉽게 만들 수 있는 조치라면 어떤 것이든 가장 신중하게 고려해야 한다.\n\n나는 일본인이 무엇을 할지에 관해 확실하게 예측하겠다고 나선 적이 결코 없지만, 우리는 일본인이 광신적인 국민이며 마지막 참호와 마지막 한 사람까지 싸울 능력이 있고 — 그럴 법하지는 않더라도 — 있다는 점을 기억해야 한다. 그들이 그렇게 한다면 미국인 생명의 대가는 예측 불가능할 것이다.\n\n일본인의 무조건 항복에 대한 가장 큰 장애는, 그것이 천황과 황위(the Throne)라는 제도의 파괴 또는 영구적 제거를 수반하리라는 그들의 믿음이다. 일단 철저히 패배하여 장래에 전쟁을 수행할 힘이 없게 된 뒤에는 그들 자신이 스스로의 장래 정치 구조를 결정하도록 허용되리라는 어떤 뜻을 지금 일본인에게 내비칠 수 있다면, [546면] 그들에게 체면을 살릴 방도가 주어질 것이며, 그것이 없이는 항복이 대단히 있을 법하지 않다.\n\n그러한 성명은, 이틀 전에 일어난 도쿄의 대파괴 직후에 발표된다면 최대의 효과를 가지리라고 여겨진다. 바로 이 순간에 그러한 성명이 미칠 심리적 충격은 매우 클 것이다.\n\n얼마 전 자기 군대에 보낸 공개 전언에서 장제스(Chiang Kai-shek)는 — 그의 나라는 다른 어느 나라보다도 일본으로부터 더 큰 고통을 받았다 — 패배하고 뉘우치는 일본은 스스로의 장래 정치 구조를 결정하도록 허용되어야 한다는 것이 자기 의견이라고 말했다.\n\n일본인에게서 그들의 천황과 천황제(emperorship)를 빼앗는다는 생각은 온당하지 않다. 우리가 등을 돌리는 순간(그리고 우리는 일본을 영구히 점령할 여유가 없다) 일본인이 의심할 여지 없이 천황과 천황제를 다시 도로 앉힐 것이라는 이유에서다. 장기적 관점에서 우리가 일본에서 바랄 수 있는 최선은 입헌군주제의 발전이다. 일본에서 민주주의는 결코 작동하지 않으리라는 것을 경험이 보여주었다.\n\n일본의 천황과 황위 제도가 그들의 침략적 군국주의의 뿌리라고 주장하는 이들은 역사의 사실에 밝을 리가 거의 없다. 약 800년 동안 일본의 천황들은 실제로 그 자리를 빼앗겼고 교토에서 불안정한 생계를 근근이 이어가야 했으며, 그들을 몰아낸 쇼군들이 도쿄에서 통치했다. 그리고 16세기에 중국과 조선을 상대로 전쟁을 벌이고 세계를 정복하겠다고 호언한 것은 쇼군 히데요시(Hideoshi)였다.\n\n1868년 황위의 복고를 이룬 메이지 천황은 군국주의적 쇼군들을 이겨내고 일본을 온건하고 평화로운 길 위에 올려놓은 강한 인물이었다. 메이지의 뒤를 이은 천황들은 강한 인물이 아니었고, 군부 극단주의자들이 지배권을 잡고 천황들에게 자신들의 영향력을 행사하기가 비교적 쉬워졌다. 만일 히로히토가 1941년에 군부를 지지하고 선전포고를 재가하기를 거부했더라면 그는 십중팔구 그 선대들의 운명을 겪었을 것이다. 어느 경우든, 그가 전쟁을 원하는 마음을 가졌든 아니든, 그는 군부 야망의 밀물을 막을 힘이 없었을 것이다.\n\n앞의 사실들은, 일본이 군국주의적이기 위해 천황을 필요로 하는 것도 아니고 일본인이 천황을 가졌기 때문에 군국주의적인 것도 아님을 분명히 보여준다. 달리 말하면, 그들의 군국주의는 그 나라 안의 군부 파벌과 그 숭배에서 솟아난다. 그 파벌은 천황 자신마저 장악하는 데 성공했고, 진주만 이전 여러 해 동안 과격분자들(hotheads)을 억제하려 최선을 다하고 있던 천황의 조언자들을 무력하게 만들었다. 1936년 2월의 암살[주60]은 황위 주변의 평화 지향적 조언자들을 숙청하려는 [547면] 특정한 목적으로 군부 극단주의자들에 의해 감행된 것이었다. 진주만 공격을 저지른 도조 장군[주61]과 그 일당은 옛날의 쇼군들과 꼭 마찬가지로 군사 독재자였고, 천황은 자신의 의사가 어떠했든 간에 그들을 억제할 힘이 전혀 없었다.\n\n앞의 사실들이 히로히토를 전쟁의 책임에서 어떤 식으로든 벗겨 주지는 않는다. 선전포고에 서명한 이상 그 책임은 정면으로 그의 어깨에 놓여 있었기 때문이다. 쟁점이 되는 점은, 천황이 서명했든 하지 않았든 극단주의 집단이 자기들 뜻대로 했으리라는 것이다. 일단 군부 극단주의자들이 패배를 통해 신용을 잃고 나면, 순전히 하나의 상징인 천황은, 일본 국민이 자기네 군 지도자들이 그들을 저버렸다고 확신하게 되었을 때 나타나리라 예상되는 새로운 지도자들에 의해 이용될 수 있고 어쩌면 이용될 것이다. 그러므로 황위 제도는, 일단 군국주의자들이 장래에 바랄 것이 아무것도 없음을 호되게 배우고 나면, 그 나라의 평화로운 장래를 세우기 위한 초석이 될 수 있다.\n\n나는 이어서 대통령에게, 5월 31일로 제안된 연설에 포함하는 것을 그가 고려하고자 할 법한 성명의 개략적 초안을 제출했다. 대통령은 내가 말한 바에 관심이 있다고 말했는데, 자기 자신의 생각도 같은 선을 따라오고 있었기 때문이라는 것이었다. 그리하여 대통령은 나에게, 우선 육군장관 및 해군장관, 마셜 장군[주62], 킹 제독[주63]과 이 문제를 논의할 회의를 마련해 달라고 요청했고, 우리가 견해를 교환한 뒤에는 같은 인원이 백악관에 와서 자신과 협의하기를 바란다고 말했다. 나는 그러한 회의를 내일 아침으로 곧바로 마련하겠다고 말했고, 로젠먼 판사에게 우리와 합류해 달라고 청했으며, 판사는 그러겠다고 말했다. (회의는 펜타곤 건물의 스팀슨 씨 사무실에서 내일 오전 11시로 잡혔다.)\n\n로젠먼 판사는 우리의 초안 성명이 다소 더 조여질(tightened up) 수 있으리라 생각했고 서너 가지 점을 제안했는데, 우리는 그것을 성명에 넣도록 힘쓸 것이다.\n\n조지프 C. 그루(Joseph C. Grew)\n\n[548면]", "secondary": "[Washington,] May 28, 1945.\n\nAfter a conference this morning with Judge Rosenman [주59] I went with the Judge to see the President and set forth the purpose of our visit as follows:\n\nIn waging our war against Japan it is an elementary and fundamental concept that nothing must be sacrificed, now or in future, to the attainment and maintenance of our main objective, namely, to render it impossible for Japan again to threaten world peace. This will mean the destruction of Japan’s tools for war and of the capacity of the Japanese again to make those tools. Their military machine must be totally destroyed and, so far as possible, their cult of militarism must be blotted out.\n\nWith the foregoing fundamental concepts as a premise it should be our aim to accomplish our purpose with the least possible loss of American lives. We should, therefore, give most careful consideration to any step which, without sacrificing in any degree our principles or objectives, might render it easier for the Japanese to surrender unconditionally now.\n\nWhile I have never undertaken to predict with certainty anything that the Japanese may do, we must remember that the Japanese are a fanatical people and are capable, if not likely, of fighting to the last ditch and the last man. If they do this, the cost in American lives will be unpredictable.\n\nThe greatest obstacle to unconditional surrender by the Japanese is their belief that this would entail the destruction or permanent removal of the Emperor and the institution of the Throne. If some indication can now be given the Japanese that they themselves, when once thoroughly defeated and rendered impotent to wage war in future, will be permitted to determine their own future political structure, [546면] they will be afforded a method of saving face without which surrender will be highly unlikely.\n\nIt is believed that such a statement would have maximum effect if issued immediately following the great devastation of Tokyo which occurred two days ago. The psychological impact of such a statement at this particular moment would be very great.\n\nIn a public message to his troops sometime ago Chiang Kai-shek, whose country has suffered more from the Japanese than any other country, said that in his opinion a defeated and penitent Japan should be permitted to determine its own future political structure.\n\nThe idea of depriving the Japanese of their Emperor and emperorship is unsound for the reason that the moment our backs are turned (and we cannot afford to occupy Japan permanently) the Japanese would undoubtedly put the Emperor and emperorship back again. From the long range point of view the best that we can hope for in Japan is the development of a constitutional monarchy, experience having shown that democracy in Japan would never work.\n\nThose who hold that the Emperor and the institution of the Throne in Japan are the roots of their aggressive militarism can hardly be familiar with the facts of history. For approximately 800 years the Japanese Emperors were deprived of their throne in practice and were obliged to eke out a precarious existence in Kyoto while the Shoguns who had ejected them ruled in Tokyo and it was the Shogun Hideoshi who in the sixteenth century waged war against China and Korea and boasted that he would conquer the world.\n\nThe Emperor Meiji who brought about the restoration of the throne in 1868 was a strong man who overcame the militaristic Shoguns and started Japan on a moderate and peaceful course. The Emperors who followed Meiji were not strong men and it became relatively easy for the military extremists to take control and to exert their influence on the Emperors. If Hirohito had refused to support the military and approve the declaration of war in 1941 he would in all probability have suffered the fate of his predecessors. In any case whether he was or was not war-minded he would have been powerless to stem the tidal wave of military ambition.\n\nThe foregoing facts indicate clearly that Japan does not need an Emperor to be militaristic nor are the Japanese militaristic because they have an Emperor. In other words, their militarism springs from the military clique and cult in the country which succeeded in gaining control even of the Emperor himself and rendered powerless the Emperor’s advisers, who in the years before Pearl Harbor were doing their best to restrain the hotheads. The assassinations in February 1936 [주60] were undertaken by the military extremists for the specific purpose [547면] of purging the peace-minded advisers around the throne. General Tojo [주61] and his group who perpetrated the attack on Pearl Harbor were just as much military dictators as were the Shoguns in the old days and the Emperor was utterly powerless to restrain them regardless of his own volition.\n\nThe foregoing facts do not in any way clear Hirohito from responsibility for the war for, having signed the declaration of war, the responsibility was squarely on his shoulders. The point at issue is that the extremist group would have had their way whether the Emperor signed or not. Once the military extremists have been discredited through defeat the Emperor, purely a symbol, can and possibly will be used by new leaders who will be expected to emerge once the Japanese people are convinced that their military leaders have let them down. The institution of the throne can, therefore, become a cornerstone for building a peaceful future for the country once the militarists have learned in the hard way that they have nothing to hope for in the future.\n\nI then submitted to the President a rough draft of a statement which he might wish to consider including in his proposed address on May 31. The President said that he was interested in what I said because his own thoughts had been following the same line. He thereupon asked me to arrange for a meeting to discuss this question in the first instance with the Secretaries of War and Navy, General Marshall [주62] and Admiral King [주63] and that after we had exchanged views he would like to have the same group come to the White House for a conference with him. I said that I would arrange such a meeting at once for tomorrow morning and I asked Judge Rosenman to join us, which he said he would do. (The meeting was arranged in Mr. Stimson’s office in the Pentagon Building for 11:00 a.m. tomorrow.)\n\nJudge Rosenman thought that our draft statement could be somewhat tightened up and suggested three or four points which we shall endeavor to include in the statement.\n\nJoseph C. Grew\n\n[548면]", "notes": ["[주59] 새뮤얼 I. 로젠먼(Samuel I. Rosenman), 트루먼 대통령 특별고문(Special Counsel).", "[주60] 1936년 2월 26일 오전 10시 도쿄발 전보 제36호 및 그 이후의 왕복문서 참조. Foreign Relations, 1936, vol. iv, pp. 719 이하.", "[주61] 도조 히데키(Hideki Tojo), 일본 총리, 1941년 10월 18일~1944년 7월 18일.", "[주62] 육군원수 조지 C. 마셜(George C. Marshall), 미 육군 참모총장.", "[주63] 함대제독 어니스트 J. 킹(Ernest J. King), 미 합동함대 총사령관 겸 해군작전부장."], "note": "번역자 주 — 발언 층위 구분: 본문 대부분(둘째 문단부터 「…초석이 될 수 있다」까지)은 그루가 대통령에게 개진한 자기 주장을 비망록에 옮겨 적은 것이지 대통령의 말이 아니다. 대통령의 발언은 마지막에서 둘째 문단에만 나온다 — (1) 그루가 말한 바에 관심이 있다, (2) 자기 자신의 생각도 같은 선을 따라오고 있었다, (3) 육해군장관·마셜·킹과 먼저 회의하라, (4) 그 뒤 같은 인원이 백악관에서 자신과 협의하기를 바란다. 대통령은 성명을 5월 31일 연설에 넣겠다고 말하지 않았다 — 초안은 「고려하고 싶어 할 법한(he might wish to consider)」 것으로 제출되었을 뿐이다. 이 구분을 흐리지 않도록 조동사를 그대로 살렸다. 낱말: 'unconditional surrender'는 「무조건 항복」으로 고정했고 이 문서에는 'surrender terms'나 'capitulation'이 나오지 않는다. 'the Throne'(황위 제도)과 'emperorship'(천황제)을 구분해 옮겼다. 'is capable, if not likely, of fighting'은 「능력이 있고 — 그럴 법하지는 않더라도 — 있다」로, 가능성과 개연성의 차이를 살려 직역했다. 'render it easier ... to surrender unconditionally now'의 'now'(지금)를 살렸다 — 시점이 이 문서의 핵심이다. 원문 'Hideoshi'는 도요토미 히데요시(Hideyoshi)의 오기로 보이나 원문 철자를 병기해 두었고, 원문이 그를 쇼군(Shogun)이라 부르는 것도 사실과 다르나 고치지 않았다. 'democracy in Japan would never work'(일본에서 민주주의는 결코 작동하지 않으리라)는 그루의 단정이며 그대로 옮겼다.", "warn": false, "pages": ["545", "546", "547", "548"], "search": "Joseph C. Grew 조지프 C. 그루 — 국무장관 대리(국무차관), 이 비망록의 작성자이자 발언자 Harry S. Truman 트루먼 — 미국 대통령. 본문에서는 \"the President\"로만 지칭 Samuel I. Rosenman 새뮤얼 I. 로젠먼 — 대통령 특별고문, 판사. 그루와 동행 Henry L. Stimson 스팀슨 — 육군장관. 이튿날 회의 장소가 그의 펜타곤 사무실 George C. Marshall 조지 C. 마셜 — 미 육군 참모총장(각주62) Ernest J. King 어니스트 J. 킹 — 미 합동함대 총사령관 겸 해군작전부장(각주63) Chiang Kai-shek 장제스 — 중국 국민정부 주석 Hirohito 히로히토 — 일본 천황 Emperor Meiji 메이지 천황 Hideoshi (Hideyoshi) 히데요시 — 원문 표기는 \"Hideoshi\"이며 쇼군으로 기술되어 있다 Hideki Tojo 도조 히데키 — 전 일본 총리(각주61)"}, {"id": "d385", "order": 385, "date": "1945-06-27", "group": "B", "eyebrow": "d385 · Summary of United States Post-Defeat Policy Relating to Japan  As approved by Staff Committee meeting on June 26.", "title": "일본에 관한 미국의 패전 후 정책 요약 (6월 26일 참모위원회 회의에서 승인된 대로)", "badge": null, "list_right": "문서 385", "meta": [{"k": "일자", "v": "1945-06-27"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "SC–138a"}, {"k": "원문출처", "v": "Staff Committee Papers (SC–138a)", "txt": true}, {"k": "발신", "v": "국무부 참모위원회 문서(SC–138a)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 385 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d385"}], "summary": "육군부 민사국이 「대통령 재가를 받은 대일 처리 정책 성명」을 요청함에 따라, SWNCC 극동 소위원회가 작성한 보고에 대한 국무부의 태도를 정하는 문서. 부속서에서 제II항 「무조건 항복 또는 전면적 패배」를 개정하여, 항복 또는 패배 즉시 연합국 최고사령관이 일본 제국의 내외 정무에 최고 권한을 행사하고 천황의 권한과 국책 관계 기구 일체의 권한·기능은 군정부가 인수한다고 규정했다.", "points": ["문제(The Problem) — 위 제목의 주제에 관하여 SWNCC 극동 소위원회가 준비한 보고(부속서 I)에 대한 국무부의 태도를 정하는 것.", "배경(Background) — 이 보고는 육군부 민사국(Civil Affairs Division)의 요청에 답하여 작성되었다. 요청은 「일본의 처리에 관한 짧은 정책 성명을 국무부가 민사국에 제공해 줄 것, 그리고 그 성명은 일본에 대한 민사 계획이 진행될 수 있도록 대통령의 재가를 받을 것」이었다.", "육군부 요청의 인용 — 「우리는 독일의 처리에 관하여 대통령이 재가한 성명과 비슷한, 일본에 대한 성명을 염두에 두고 있다.」", "부속서 I의 표제는 「일본에 관한 미국의 초기 패전 후 정책 요약(Summary of United States Initial Post-Defeat Policy Relating to Japan)」이다.", "본문은 6월 11일자 SWNCC 150의 부속서(549면)에 인쇄된 것과 같으며, 제II항만 아래와 같이 개정되었다.", "개정된 제II항 「무조건 항복 또는 전면적 패배」 — 일본의 무조건 항복 또는 전면적 패배 즉시, 연합국 최고사령관이 일본 제국의 내정과 외교에 대하여 최고 권한을 행사한다.", "동시에, 천황의 권한 및 국책의 형성 또는 심의에 참여하는 모든 기구의 권한과 기능은 군정부(military government)가 인수한다."], "primary": "SC–138a\n\n[워싱턴,] 1945년 6월 27일.\n\n**문제**\n\n문제는, 위 주제에 관하여 국무·육군·해군 3부조정위원회(SWNCC) 극동 소위원회가 준비한 보고(부속서 I)에 대한 국무부의 태도를 정하는 것이다.\n\n**배경**\n\n이 보고는 육군부 민사국(Civil Affairs Division)의 요청에 답하여 작성되었다. 그 요청은 「일본의 처리에 관한 짧은 정책 성명을 국무부가 민사국에 제공해 줄 것, 그리고 그 성명은 일본에 대한 민사 계획이 진행될 수 있도록 대통령의 재가(Presidential approval)를 받을 것」이었다. 「우리는 독일의 처리에 관하여 대통령이 재가한 성명과 비슷한, 일본에 대한 성명을 염두에 두고 있다.」\n\n[부속서 I]\n\n**일본에 관한 미국의 초기 패전 후 정책 요약**\n\n[여기에 6월 11일자 SWNCC 150의 부속서, 549면에 인쇄된 것과 같은 본문이 이어진다. 다만 제II항은 다음과 같이 개정되었다:]\n\nII. 무조건 항복 또는 전면적 패배\n\n일본의 무조건 항복 또는 전면적 패배가 있는 즉시, 연합국 최고사령관(the supreme allied commander)이 일본 제국의 내정 및 외교 사무에 대하여 최고 권한을 행사할 것이다. 동시에, 천황의 권한과, 국책(national policies)의 형성 또는 심의에 참여하는 모든 기구의 권한 및 기능은 군정부(military government)가 인수한다.\n\n[556면]", "secondary": "SC–138a\n\n[Washington,] June 27, 1945.\n\nThe Problem\n\nThe problem is to determine the Department’s attitude toward a report (Annex I) on the above subject prepared by the State-War-Navy Coordinating subcommittee for the Far East.\n\nBackground\n\nThis report was prepared in reply to a request from the Civil Affairs Division of the War Department “that the Department of State furnish the Civil Affairs Division with a short policy statement with respect to the treatment of Japan, which statement should have the Presidential approval to the end that civil affairs planning for Japan may proceed.” “We have in mind a statement for Japan similar to the statement as approved by the President with respect to the treatment of Germany.”\n\n[Annex I]\n\nSummary of United States Initial Post-Defeat Policy Relating to Japan\n\n[Here follows text as printed in annex to SWNCC 150, June 11, page 549, except for revision of paragraph II as follows:]\n\nII. Unconditional Surrender or Total Defeat\n\nImmediately upon the unconditional surrender or total defeat of Japan, the supreme allied commander will exercise supreme authority over the domestic and foreign affairs of the Japanese Empire. Simultaneously, the powers of the Emperor and the powers and functions of all instrumentalities which participate in the formulation or consideration of national policies shall be assumed by the military government.\n\n[556면]", "notes": ["[주73] 6월 26일 참모위원회(Staff Committee) 회의에서 승인된 대로."], "note": "번역자 주 — 이 문서는 요약·표지 문서이며, 부속서 I의 본문 대부분은 FRUS 편찬자가 「6월 11일자 SWNCC 150 부속서(549면)에 인쇄된 것과 같다」며 생략했다. 따라서 실제 정책 본문은 여기에 없고 제II항 개정문만 인쇄되어 있다 — raw 텍스트가 짧은 이유다. 그 편찬자 삽입구는 대괄호를 살려 그대로 옮겼다. 낱말: 'unconditional surrender'(무조건 항복)와 'total defeat'(전면적 패배)를 원문대로 병렬로 두었다 — 이 시점(6월 27일)에서 미국은 항복 없이 전면적 패배로 끝날 경우까지 함께 규정하고 있다. 'supreme allied commander'는 원문이 소문자 표기이며 아직 고유명사화(SCAP) 이전 단계이므로 「연합국 최고사령관」으로 옮겼다. 'will exercise'(행사할 것이다)와 'shall be assumed'(인수한다)의 조동사 차이를 살렸다. 'military government'는 「군정부」로 직역했다. 제목은 raw 본문의 부속서 표제에 'Initial'이 있으나 FRUS 목차 제목에는 없어, title_en은 목차 제목을 따르고 부속서 표제는 본문에 그대로 두었다. confidence를 medium으로 둔 것은 생략된 본문(SWNCC 150 부속서)을 대조할 수 없기 때문이다.", "warn": true, "pages": ["555", "556"], "search": ""}, {"id": "d390", "order": 390, "date": "1945-08-04", "group": "X", "eyebrow": "d390 · Memorandum of Telephone Conversation, by the Acting Secretary of State", "title": "국무장관 대리의 전화 대화 비망록", "badge": null, "list_right": "문서 390", "meta": [{"k": "일자", "v": "1945-08-04"}, {"k": "시각", "v": "「오늘 아침(this morning)」 스팀슨이 전화를 걸었다. 정확한 시각은 적혀 있지 않다."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 PW/8–445", "txt": true}, {"k": "발신", "v": "국무장관 대리(그루, Joseph C. Grew) — 비망록 작성자", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전화 대화 비망록"}], "links": [{"k": "FRUS", "text": "문서 390 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d390"}], "summary": "스팀슨 육군장관이 아침에 전화를 걸어, 「신속한 항복의 경우」 일본 관리 문제를 생각해 왔으며 외부 경로에서 들어온 한 문서에 크게 감명받았다고 전하고, 그 문서가 국무부에서 묻히거나 기각되지 않도록 그루에게 직접 검토를 부탁한 기록. 부속서로 그 문서 — 천황과 민정을 존치하고 그 위에 연합국최고회의를 두자는 대일 전후 정책 건의 — 가 딸려 있다.", "points": ["8월 4일 아침 스팀슨 육군장관이 그루에게 전화하여, 「신속한 항복의 경우(in case of a speedy surrender)」 일본을 관리하는 문제의 상황을 곰곰이 생각해 왔다고 말했다.", "스팀슨은 하루 이틀 전 이 주제에 관한 문서 하나[주93]를 받았고 거기에 매우 크게 감명받았다고 했다. 그 문서는 「외부 경로(outside channels)」에서 온 것이지만 그가 보기에 매우 분별 있어 보였다.", "스팀슨은 그 문서를 자기 주의에 올린 민사국(Civil Affairs Division)에 그것을 그루에게 보내도록 요청하고 있다고 말했다. 문서에는 일본인을 「돌아서게(come around)」 설득하는 데 매우 유용하리라 그가 생각한 제안이 담겨 있다고 했다.", "스팀슨이 이 문제로 전화한 이유는, 그 문서가 국무부에서 묻히거나 기각되기를 원치 않았기 때문이다.", "스팀슨은 일본에 관한 군사 정세가 독일의 그것과 매우 다르며 우리가 일본은 언제든 훨씬 더 쉽게 통제할 수 있다고 말했고, 그루도 동의했다. 스팀슨에 따르면 지금 이 문제를 다루는 이들이 이 사실을 고려하고 있지 않다고 그는 생각했다.", "스팀슨은 그루에게 그 문서를 살펴봐 달라고 청했다 — 참모진의 챈들러 대령이 전달할 것이라 했다 — 그런 다음 자신과 논의하자고 했다. 시외에서 전화를 건 스팀슨은 다음 주 초에 워싱턴으로 돌아온다고 말했다.", "[부속서] 육군부에 제출된 각서 — 제목 「대일 적대행위 종료 후 정책에 관한 소견」. 각서 상단 기입: 육군장관이 이 각서를 읽은 뒤 「이것은 놀랄 만큼 좋은 문서다」라고 논평하고 회람을 지시했다.", "부속서 1항 — 현실적이려면 대일 전후 정책은 (a) 시간이 흐름에 따른 미국 여론의 반응 예측에 대한 인식, (b) 정복자와 피정복자 사이의 관계에 관하여 역사가 가르치는 교훈에 대한 인식 위에 서야 한다. 미국 여론의 지속적 지지를 얻지 못하는 정책은 실패할 운명이다.", "부속서 2항 — 미국 여론은 미군에 의한 장기 점령 아래에서 틀림없이 조바심을 낼 것이고, 오랜 기간 일본을 통치하는 부담을 지려 하지 않을 것이다. 철수 요구는 일본 항복 후 6개월 이내에 시작되어 그 뒤 정치적 압력으로 커질 공산이 크다. 또한 아무리 공정하고 형평한 행정 아래에서도 정복국의 직접 통치에 대한 반감은 시간이 갈수록 불가피하게 커진다. 정복국은 영구적 군사 점령과 이민에 의하지 않고는 자기 정부 형태·이상·생활방식을 피정복국에 강요할 수 없다.", "부속서 3항 — 그러므로 최고도의 정치가적 역량이 요구된다. 현재의 전쟁 히스테리에 좌우된 정책, 즉 나중에 미국 여론이 부인하거나 이행하기를 꺼릴 약속을 수반할 정책을 최대한 피해야 하고, 최단 시간에 최대한의 일본 갱생(regeneration)을 이루도록 힘써야 한다.", "부속서 4항 — 바람직해 보이는 것: (a) 천황과 민정(civil administration)을 존치한다. 항복 조건(terms of surrender)의 일부로 천황은 현 내각을 해산하고 육해군 대표를 배제한 자유주의적 내각을 불러들이도록 강제될 것이며, 황실은 연합국관리이사회에 전적으로 협력하는 한에서만 존치된다는 것도 항복 조건의 일부가 될 것이다. (b) 사실상 그 나라의 최고 권위가 되되 정규로 구성된 정부를 통하여 기능하고 지령을 내리는 연합국최고회의(Supreme Allied Council)를 설치한다. (c) 일본인이 스스로의 지도 아래 민주적 제도의 발전과 군사적 정복 정신의 제거에 나서도록 모든 격려를 준다.", "부속서 5항 — 천황 대신 연합국 군정을 세우는 안과 견주어 위 방안을 뒷받침하는 논거: 천황의 존치는 본토 밖 일본군 전부의 즉각적 항복을 아마도 보장할 것이다(항복 조건은 천황이 어디에 있든 모든 일본군에게 저항 중지와 본토 귀환 준비를 명하도록 요구하리라고 상정된다). 연합국 군정은 서투르고 비외교적이고 비효율적일 수밖에 없으며, 우리에게 그 임무를 효과적으로 수행할 안목·훈련·능력을 갖춘 인원이 충분하지 않다는 사실을 온전히 인정해야 한다.", "부속서 5(c) — 일본인이 스스로 이끌도록 허용된다면 진정한 민주적 운동이 무르익을 강한 개연성이 있어 보인다: (1) 일본인은 본질적으로 모방적인 국민이다. (2) 모든 동양인이 그렇듯 힘에 대한 큰 존경심을 가진다. (3) 민주주의로서 우리가 이룬 바를 본 이상 1867년처럼 우리를 모방하려 들 공산이 크다. (4) 항복 전에 일본을 침공하든 안 하든 일본 군부는 「체면」을 잃고 완전히 신용을 잃었을 것이다. (5) 1931년 이전에 일본의 민주적 요소는 힘을 키워 가고 있었고, 군부가 신용을 잃은 마당에 아마도 되살아날 수 있을 것이다.", "부속서 5(d)(e)(f) — 천황은 영국 국왕처럼 어떤 정치적 색채의 내각이든 부를 수 있다. 연합국 군정이 민주적 강령을 강요하려 들면 민주주의는 정복자의 지배와 결부되어 국민에게 신용을 잃는다. 연합국관리위원회가 배후에 남는 황실 통치의 존속은 마찰과 소요 가능성을 최소로 줄이고 연합국 점령군과 연합국 군사이사회의 조기 철수를 가능하게 할 것이다. 무장력을 등에 업은 국제연합(United Nations) 기구가 일본 정부에 대한 계속적 감독을 행사할 가장 효과적인 수단이 될 전망이며, 가능한 가장 이른 날짜에 문제를 그 기구에 넘기는 것을 목표로 삼아야 한다."], "primary": "[워싱턴,] 1945년 8월 4일.\n\n스팀슨 장관이 오늘 아침 전화를 걸어, 신속한 항복(a speedy surrender)의 경우 일본의 관리(management) 문제의 상황을 곰곰이 생각해 왔으며, 하루 이틀 전에 이 주제에 관한 문서 하나[주93]를 받았는데 그것에 매우 크게 감명받았다고 말했다. 스팀슨 씨는 그 문서가 외부 경로(outside channels)로부터 왔지만 자기가 보기에는 매우 분별 있어 보인다고 말했다. 스팀슨 장관은 그 문서를 자기 주의에 올린 민사국(Civil Affairs Division)에 그것을 나에게 보내도록 요청하고 있다고 말했다. 스팀슨 씨는 그 문서에 일본인을 「돌아서게(come around)」 설득하는 데 매우 유용할 수 있으리라고 그가 생각하는 제안 하나가 담겨 있다고 말했다. 그가 이 문제로 전화한 이유는 그 문서가 국무부에 의해 묻히거나 기각되기를 원하지 않았기 때문이라고 했다. 스팀슨 장관은 일본에 관한 군사 정세가 독일의 그것과 매우 다르며 우리가 일본은 언제든 훨씬 더 쉽게 통제할 수 있다고 진술했고, 나도 이에 동의했다. 스팀슨 씨에 따르면, 그는 이 사실이 지금 이 문제를 다루고 있는 이들에 의해 고려되고 있다고 생각하지 않았다.\n\n스팀슨 씨는 내가 그 문서를 살펴봐 주겠는지 물었는데, 자기 참모진의 챈들러 대령(Colonel Chandler)이 그것을 나에게 전달할 것이라고 했다. 그런 다음 그 문제를 자기와 논의하자고 했다. 시외에서 전화를 걸고 있던 스팀슨 장관은 다음 주 초에 워싱턴으로 돌아올 것이라고 말했다.\n\n조지프 C. 그루(Joseph C. Grew)\n\n[585면]\n\n[부속서]\n\n**육군부에 제출된 각서**[주94]\n\n주제: 대일 적대행위 종료 후 정책에 관한 소견\n\n1.\n\n현실적이려면, 대일 적대행위 종료 후 정책은 다음 위에 서야 한다:\n\na.\n\n시간이 흐름에 따른 미국 여론의 있음 직한 반응에 대한 인식. 미국 여론의 지속적 지지를 얻지 못하는 정책은 실패할 운명이다.\n\nb.\n\n정복자와 피정복자 사이의 관계에 관하여 역사가 가르쳐 준 교훈에 대한 인식.\n\n2.\n\n위 a와 b에 관련하여 유의해야 할 가장 중요한 점들은 다음과 같아 보인다:\n\na.\n\n미국 여론은 미군에 의한 장기간의 일본 점령 아래에서 의문의 여지 없이 조바심을 내게 될 것이다. 여론은 오랜 기간에 걸쳐 일본을 통치하는 부담을 떠맡기를 원하지 않을 것이다. 철수 요구는 일본의 항복 후 6개월 이내에 시작되어, 그 뒤로 그 목적을 향한 정치적 압력을 점점 키워 갈 공산이 크다.\n\nb.\n\n가장 공정하고 형평한 행정 아래에서조차, 패배한 나라에 대하여 직접적인 정치적·군사적 통제를 행사하는 정복국에 대한 반감은 시간이 흐름에 따라 불가피하게 커지는 경향이 있다. 여러 어려움이 생겨나 통치하는 나라에게 통제를 확대하고 강화하든가 아니면 바라던 목표를 이루지 못한 채 철수하든가 하는 양자택일을 들이민다.\n\nc.\n\n정복국은 영구적인 군사 점령과 이민에 의하지 않고는 자기의 정부 형태, 이상, 생활방식을 피정복국에 강요할 수 없다.\n\n3.\n\n그러므로 적대행위 종료 후 일본에 대한 우리 정책의 형성은 최고도의 정치가적 역량(statesmanship)을 요구한다. 우리는 뒤를 보는 것만큼이나 앞을 내다보아야 한다. 우리는 다음을 해야 한다:\n\na.\n\n현재의 전쟁 히스테리에 좌우된 정책 — 나중에 미국 여론이 부인할 정책, 또는 미국 여론이 이행하기를 꺼릴 약속을 수반할 정책 — 을 가능한 최대한으로 피한다.\n\nb.\n\n최소한의 시간에 일본의 갱생(regeneration)을 향한 최대한의 진전을 이루도록 힘쓴다. 이 목표를 이루는 데 있어 우리의 성공 정도는 승자와 패자 사이의 관계라는 문제에 우리가 얼마나 지혜롭게 다가가는가에 달려 있을 것이다.\n\n4.\n\n위에 비추어 다음이 바람직해 보인다:\n\na.\n\n천황과 민정(civil administration)을 존치한다. 항복 조건(the terms of surrender)의 일부로서 천황은 [586면] 현 내각을 해산하고 육해군 대표를 배제한 자유주의적 내각을 불러들이도록 강제될 것이다. 또한 황실(the Imperial House)은 연합국관리이사회(the Allied Control Council)에 전적으로 협력하는 한에서만 존치된다는 것도 항복 조건의 일부가 될 것이다.\n\nb.\n\n사실상 그 나라의 최고 권위가 되지만 정규로 구성된 정부를 통하여 기능하고 그 지령을 내리는 연합국최고회의(a Supreme Allied Council)를 설치한다.\n\nc.\n\n일본인이 그들 자신의 지도 아래 민주적 제도의 발전과 군사적 정복 정신의 제거에 착수하도록 모든 격려를 준다.\n\n5.\n\n천황을 대신하여 연합국 군정(Allied Military Government)을 세우는 것과 견주어, 그러한 계획을 뒷받침하여 다음 논거들이 제시된다:\n\na.\n\n천황의 존치는 본토 밖에 있는 모든 일본군의
