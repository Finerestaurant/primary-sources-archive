v": "각서"}], "links": [{"k": "FRUS", "text": "문서 432 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d432"}], "summary": "오스트레일리아 정부가 「일본의 장래」에 관한 자국 견해를 제시하며, 대일 협의·결정의 모든 단계에 전면 참여할 것과, 천황을 침략 행위 및 전쟁범죄에 대해 책임 있는 자로 다루고 항복문서 서명 순간부터 그 모든 권한과 대권이 소멸하도록 할 것을 요구한다.", "points": ["1. 참여: 오스트레일리아는 대추축·특히 대일 전쟁에서의 역할과 태평양에서의 지리적 위치에 비추어, 일본의 장래에 관한 연합국 협의와 결정의 모든 단계에 전면 참여해야 한다. 정책 수립, 휴전 조건 기초와 서명, 통제 방식의 규정, 통제 기구의 설치와 운영에 — 되도록 직접 얼굴을 맞대는 원탁 협의로 — 직접 참가해야 한다.", "오스트레일리아 정부는 지금까지 일본과 진행된 교섭에서 자국이 인정받지 못한 까닭을 이해하기 어렵다고 밝히고, 오간 문서들에 대한 자국의 해석과 부연으로 다음을 제시한다.", "2. 천황: 국가원수이자 군 최고사령관으로서 천황은 일본의 침략 행위와 전쟁범죄에 대해 책임을 져야 한다. 황위(Imperial Throne)의 장래는 때가 되면 일본 국민이 결정해야 하며, 그 결정 이전에 황위 폐지 또는 천황의 입헌군주화를 목표로 하는 정치 운동에 조직과 선전의 완전한 자유를 주어야 한다.", "천황은 항복 조항 수락에 몸소 결부되어야 한다 — 천황이 전쟁 수행과 그 파국에 대한 책임의 밖 또는 위에 있다는 어떠한 전설도 무너뜨리는 데 도움이 되도록.", "「항복 조항에 서명하는 순간부터 천황의 모든 권한과 대권은 기한 없이 소멸하며(lapse indefinitely), 일본 제국에 관한 모든 권한은 오로지 연합국 사령부에만 귀속되어 최종 강화가 이루어질 때까지 그대로 있다」는 점을 분명히 해야 한다.", "전쟁범죄를 정당하게 귀속시킬 수 있는 모든 자는 처벌 대상이라는 일반 원칙에 어떠한 예외도 허용해서는 안 된다. 웹 재판장의 보고서가 드러낸 일본의 전쟁범죄·잔학행위는 일본 최고 당국이 알고 있었을 수밖에 없는 계획적 테러·잔학 체계를 보여 준다. 히틀러 일당과 일본 최고 당국을 달리 취급하는 것을 정당화하기는 매우 어렵다.", "따라서 천황을 항복 조항에 명시적으로 결부시키기 위해 당장은 존치하되, 이것이 장래에 관한 연합국의 어떠한 약속도 아니며 천황의 신병은 항복한 적국의 다른 모든 사람과 똑같이 연합국 정부들의 처분에 맡겨진다는 점을 일본에 분명히 해야 한다.", "3. 경제·사회·정치 조건: 일본 군국주의 제거에는 사회·정치·경제 구조의 근본적 변화가 필요하다. 지난 70년간 세워진 전체주의 체제에 뿌리가 박혀 있으며, 농업 인구와 산업 노동자의 궁핍이 낮은 국내 수요와 격렬한 수출 압박, 값싼 노동력, 대규모 병력 공급, 중공업 편중을 낳았다. 농업 인구의 지위 개선과 노동조합 운동 육성에 힘써야 한다.", "그러한 정책은 연합국의 급진적·직접적 내정 개입을 뜻하며, 결의를 가지고 민주적·인민적 정권이 완전히 수립될 때까지 지속하지 않으면 무효하다. 상당히 긴 점령 기간이 필요하고 점령국들이 지칠 위험이 있으나, 이는 일본 배외주의와 침략이 되살아날 실제 위험과 견주어 보아야 한다.", "일본 산업에 대한 즉각적 통제 방침: (a) 전 산업에 걸친 경제적 무장해제, (b) 조선업을 포함한 산업의 연합국 통제와 경공업 회복 중시, (c) 수출입 무역의 연합국 통제, (d) 연합국이 정하는 바에 따른 현물 배상.", "대량 실업과 경제 불안정을 방치하여 개혁을 해쳐서는 안 되나, 재벌(Zaibatsu)의 산업 독점 지배력은 반드시 깨뜨려야 한다.", "4. 정치 조건: 군국주의자·재벌·관료를 인민의 필요에 책임지는 정부 체제로 대체해야 한다. 초기 단계에는 연합국최고사령관이 완전한 권한을 장악하고 의회(Diet)와 모든 일본 정책결정 기관의 권한을 정지시킨다. 기존 정당은 해산하되 국제연합의 목적에 어긋나지 않는 새 정당은 용인한다. 국가신도(State Shinto)의 천황 숭배와 군국주의적 결부가 신앙의 자유와 관련해 어려운 문제를 제기한다.", "5. 그 밖의 사항: 군국주의·파시즘 운동에 두드러진 일본인은 어떠한 자격으로도 연합국 군정에 기용해서는 안 된다. 항복 조항은 천황·육해군 수뇌·주요 각료가 서명해야 한다. 일본 해군은 완전 파괴 또는 연합국 인도, 상선대는 연합국에 인도하고 오스트레일리아에 정당한 몫을 배정한다. 헌병대(Kempeitai)·특고과(Tokkoka)·애국단체·비밀결사·재향군인회를 해산한다. 전쟁범죄인(천황을 포함하여)에 관한 규정을 두어야 한다.", "휴전은 본토와 외곽 지역·도서의 모든 일본군 항복을 조건으로 하며, 천황과 일본군 사령부의 권위를 그 병력의 철수와 일본 귀환에 사용한다는 점을 분명히 해야 한다."], "primary": "날짜 없음\n\n[651면]\n\n**일본의 장래**\n\n**오스트레일리아 연방 정부의 견해**\n\n**1. 협의와 결정에 대한 오스트레일리아의 참여:**\n\n오스트레일리아가 추축국들에 대한 전쟁, 특히 일본에 대한 전쟁에서 맡은 역할에 비추어, 또한 태평양에서의 그 지리적 위치에 비추어, 오스트레일리아는 일본의 장래에 관한 연합국의 협의와 결정에 모든 단계에서 전면적으로 참여하여야 한다. 오스트레일리아는 연합국 정책의 수립, 휴전 조건의 기초(起草)와 휴전 조건의 서명, 통제 방식의 규정, 그리고 통제 기구의 설치와 운영에 — 되도록이면 직접 얼굴을 맞대는 원탁 협의의 방식으로 — 직접 참가하여야 한다. 오스트레일리아 정부는 지금까지 일본과 진행되어 온 교섭에서 자국이 인정받지 못한 까닭을 이해하기 어렵다고 여기며, 오스트레일리아가 일본과의 강화 조건에 사활적으로 영향을 받는 이상 자국의 견해를 표명하지 않을 수 없다고 느낀다. 아래의 것은 그동안 오고 간 문서들에 대한 오스트레일리아 정부의 해석이자 부연으로 받아들여도 좋다. 그 문서들의 문언은 다소 일반적이므로, 오스트레일리아 정부는 이 해석이 그 조항들의 적용을 인도하기를 바란다.\n\n**2. 일본 천황:**\n\n국가원수이자 군대의 최고사령관으로서 천황은 일본의 침략 행위와 전쟁범죄에 대하여 책임을 져야 한다. 황위(Imperial Throne)의 장래는 때가 되면 일본 국민이 결정하여야 하며, 그러한 결정이 내려지기 전에 황위 제도의 폐지 또는 천황을 입헌적 국가원수로 받아들이는 것을 목표로 하는 정치 운동에는 조직과 선전의 완전한 자유가 주어져야 한다. 천황은 항복 조항의 수락에 몸소 결부되어야 하며, 그리하여 천황이 전쟁 수행과 그것이 일본에 가져온 궁극의 파국에 대한 책임의 밖에 또는 위에 있다는 어떠한 전설도 무너뜨리는 데 도움이 되어야 한다. 항복 조항에 서명하는 순간부터 천황의 모든 권한과 대권(all the powers and prerogatives of the Emperor)이 기한 없이 소멸하며, 일본 제국에 관한 모든 권한은 오로지 연합국 사령부(the Allied Command)에만 귀속되고 최종적인 강화가 이루어질 때까지 그대로 귀속되어 있다는 점이 분명히 되어야 한다. 전쟁범죄를 정당하게 귀속시킬 수 있는 모든 사람은 처벌을 받아야 한다는 일반 원칙에 어떠한 예외도 허용되어서는 안 된다. 웹 재판장[주83]이 오스트레일리아 정부에 제출하여 현재 전쟁범죄위원회(War Crimes Commission)에 계류 중인 보고서에 드러난 일본의 전쟁범죄와 잔학행위의 증거는 [652면] 일본의 최고 당국이 알고 있었을 수밖에 없는 계획적인 테러와 잔학의 체계를 보여 준다. 이 점에서 한편으로 히틀러와 그 일당, 다른 한편으로 일본의 최고 당국 사이에 차별을 두는 것을 정당화하기란 매우 어려운 일일 것이다. 그러므로 천황이 항복 조항에 명시적으로 결부될 수 있도록 당장은 존치하여야 하겠으나, 이것이 장래에 관하여 연합국 측의 어떠한 약속도 포함하지 않으며, 천황의 신병은 항복하는 적국의 다른 모든 사람과 똑같은 방식으로 연합국 정부들의 처분에 맡겨진 것으로 간주된다는 점을 일본에 분명히 하여야 한다.\n\n**3. 일본의 경제적·사회적·정치적 조건:**\n\n일본 군국주의와 그것이 태평양의 안전에 끊임없이 가하는 위협을 제거하려면 일본의 사회적·정치적·경제적 틀에 근본적인 변화가 있어야 한다. 비교적 짧은 외국 통제 기간 동안 정부 기구와 대외 무역에 표면적인 변화만 주는 것으로는 충분하지 않다. 일본 군국주의의 뿌리는 지난 70년에 걸쳐 세워진 전체주의적 사회·정치·경제 체제에 박혀 있다. 농업 인구와 공업 노동자의 궁핍한 처지, 그로 말미암은 낮은 소비 수준과 제한된 국내 수요가 일본 산업의 특징인 격렬한 수출 압박의 주된 원인이었다. 농업의 빈곤은 상당한 생산력을 가지면서도 생활 수준이 낮은 값싼 공업 노동력이 대량으로 공급됨을 뜻하였다. 이러한 조건은 시장을 확보하려는 충동을 낳았고, 그것이 일본의 영토적 야심에서 중요한 요소였다. 농업의 빈곤은 또한 대량의 군사 인력 공급을 뜻하였다. 이는 다시 전쟁 잠재력으로서의 중공업에 대한 지나친 편중에 이바지하였다. 이렇게 일그러진 일본 경제를 바로잡기 위하여, 농업 인구의 경제적·사회적 지위를 개선하고 생활 수준을 높이는 것을 목표로 하는 노동조합 운동 및 그 밖의 운동을 육성하는 데 온 힘을 기울여야 한다.\n\n그러한 정책이 연합국 여러 나라에 의한 일본 국내 문제에 대한 급진적이고 직접적인 개입을 뜻한다는 점은 인식되고 있다. 그러한 개입은 결의를 가지고 착수되고 민주적이며 인민적인 정권이 완전히 수립될 때까지 지속되지 않는 한 효력이 없을 것이다. 이는 상당히 긴 기간의 점령을 뜻하며, 점령국들이 그 일에 지쳐 버릴 위험이 있다. 그러나 이 위험은, 일본의 사회적·정치적·경제적 생활의 주요한 면모가 실질적으로 바뀌지 않은 채 남겨질 경우 일본의 배외주의와 침략이 되살아날 매우 현실적인 위험과 견주어 보아야 한다. 연합국들이 장래의 일본 침략을 막기 위하여 필요한 모든 조치를 취하겠다는 의지와 결의를 [653면] 보여 준다면, 초기 단계에 확고한 정책을 힘차게 적용함으로써 비교적 짧은 기간 안에 유망한 조건을 만들어 낼 수 있음이 밝혀질 수도 있다. 게다가 일본인들에게는, 위에서 말한 원칙에 따라 일본인 스스로 사무를 성공적으로 처리할 합당한 전망이 서는 대로 통제가 완화되고 철회되리라는 점을 깨닫게 하여야 한다. 이렇게 일본인의 활동을 북돋우는 일이 중요한 까닭은, 연합국 통제의 성패가 상당 부분 일본인의 참여를 얼마나 확보하느냐에 달려 있기 때문이다.\n\n위에 밝힌 일반 정책에 따라, 일본 산업에 대한 즉각적인 통제는 다음의 방향을 따라야 한다.\n\n(a)\n\n전 산업에 걸친 경제적 무장해제.\n\n(b)\n\n(조선업을 포함한) 산업에 대한 연합국의 통제. 다만 경공업의 회복에 중점을 둔다.\n\n(c)\n\n일본의 수입·수출 무역에 대한 연합국의 통제. 이는 필수 소비재 산업의 성장을 북돋우고 연합국의 배상 정책을 실현하기 위한 것이며, 일본이 해외 영토를 잃은 사실과 일본의 수출 무역을 전후 국제 경제 관계망 안에 맞추어 넣을 필요도 함께 고려한다.\n\n(d)\n\n배상은 연합국이 정하는 바에 따라 현물로 지급한다.\n\n한편으로 연합국이 무거운 안전보장의 부담을 지고 있는 동안 일본에 제한 없는 경제적 팽창을 허용해서는 안 되겠으나, 다른 한편으로 이 정책이 대량 실업과 경제적 불안정의 존속을 허용함으로써 개혁의 추진을 해치도록 두어서는 안 된다. 그러나 재벌(Zaibatsu)이 산업을 독점적으로 지배하는 그 힘은 반드시 깨뜨려야 한다.\n\n**4. 정치적 조건:**\n\n일본에서 정부에 대한 인민의 영향력은 장려되어야 한다. 과제는 군국주의자·재벌·관료를 인민의 필요에 책임지는 정부 체제로 대체하는 것이다. 길게 보면 이는 일본 국민 자신의 과제이겠으나, 일본에서 참으로 민주적인 세력이 스스로를 관철하기는 어려울 것이다. 그러므로 그들은 연합국들로부터 온갖 도움과 격려를 받아야 한다.\n\n초기 단계에서는 연합국최고사령관이 완전한 권한을 장악하고, 의회(Diet)와 모든 일본 정책결정 기관의 권한은 정지되어야 한다. 그러나 점차로 일본인의 민사(民事) 기능 행사에 대한 제한은 완화되어 마침내 없앨 수 있게 되어야 한다. 기존 정당은 해산되어야 하나, 국제연합(United Nations)의 목적에 어긋나지 않는 목표를 가진 새 정당은 용인되어야 한다. 지방자치 활동은 장려되어야 한다. 시민적 자유는 군정(Military Government)에 의한 법적 규정과 보호를 필요로 할 것이다. 사법·경찰 제도의 [654면] 가증스러운 면모는 폐지되어야 한다. 신앙의 자유는 천황 숭배와 군국주의적 결부를 지닌 국가신도(State Shinto)라는 어려운 문제를 제기한다. 이와 관련해서는 위의 제2항을 참조하라 — 거기서 천황의 처리를 다루었다.\n\n**5. 그 밖의 사항:**\n\n(a)\n\n어떠한 군국주의적 또는 파시즘적 운동이나 활동에서 두드러졌던 일본인은 어떠한 경우에도 연합국 군정에 어떠한 자격으로도 기용되어서는 안 된다.\n\n(b)\n\n항복 조항은 천황, 육군 및 해군 수뇌, 그리고 주요 각료가 서명하여야 한다.\n\n(c)\n\n일본 해군은 완전히 파괴하거나 연합국의 손에 넘겨야 한다. 일본 공군과 군사 시설·물자도 파괴하거나 적절한 경우에는 이관하여야 한다. 상선대는 연합국들에 인도하되 그 정당한 몫이 오스트레일리아에 배정되어야 한다.\n\n(d)\n\n군 인력은 복원(復員)시키고, 징병제는 폐지하며, 헌병대(Kempeitai, 憲兵隊), 특고과(Tokkoka, 特高課 — 비밀경찰), 애국 단체와 비밀 결사, 재향군인회는 해산하고, 무기의 제조와 휴대는 금지하여야 한다.\n\n(e)\n\n연합국 전쟁포로를 보호하는 규정과 아울러 일본인 전쟁포로에 관한 규정도 두어야 한다.\n\n(f)\n\n전쟁범죄인(천황을 포함하여)에 관한 규정을 두어야 한다.\n\n(g)\n\n휴전은 본토와 바깥 지역 및 도서에 있는 모든 일본군의 항복을 조건으로 하며, 천황과 일본군 사령부의 권위가 그들을 철수시켜 일본으로 돌려보내는 데 사용된다는 점이 분명히 양해되어야 한다.", "secondary": "undated\n\n[651면]\n\nFuture of Japan\n\nviews of the government of the commonwealth of australia\n\n1. Participation of Australia in discussions and decisions:\n\nIn view of the part played by Australia in the war against the Axis Powers and in particular against Japan, and in view also of her geographical position in the Pacific, she should participate fully at all stages in Allied consultations and decisions on the future of Japan. Australia should take a direct part, preferably by way of personal, round-table consultation, in the formulation of Allied policies, the drafting of Armistice terms and signature of Armistice conditions, the definition of methods of control and the establishment and working of control machinery. The Australian Government finds it difficult to understand why it has not been recognised in the negotiations which have taken place so far with Japan, and as Australia is vitally affected by the terms of peace with Japan it feels bound to express its views and the following may be taken as its interpretation and amplification of the documents which have passed. The terms of these documents are somewhat general and the Australian Government hopes this interpretation will guide the application of the terms.\n\n2. The Emperor of Japan:\n\nAs Head of the State and Commander-in-Chief of the Armed Forces, he should be held responsible for Japan’s acts of aggression and war crimes. The future of the Imperial Throne should be decided by the Japanese people in due course and before such a decision is taken political movements aiming at the abolition of the institution of the Throne or acceptance of the Emperor as a constitutional head of the State should be given full freedom of organization and propaganda. The Emperor should be personally identified with the acceptance of surrender terms, thus helping to destroy any legend that the Emperor is outside or above responsibility for the conduct of the war and its ultimate disaster for Japan. It should be made clear that from the moment of the signing of the surrender terms all the powers and prerogatives of the Emperor lapse indefinitely and that all authority in relation to the Japanese Empire will be vested exclusively in the Allied Command and remain so vested until the final peace settlement. No exception should be permitted to the general rule that every person to whom war crimes can justly be imputed is liable to punishment. The evidence of Japanese war crimes and atrocities revealed in the report to the Australian Government made by Chief Justice Webb [주83] and now before the War Crimes Commission discloses [652면] a deliberate system of terrorism and atrocity which must have been known to the Supreme Authorities in Japan. It would be a very difficult matter to justify discrimination in this respect as between Hitler and his associates on the one hand and the Supreme Authorities in Japan on the other. While, therefore, the Emperor should be retained at the moment in order that he can be expressly associated with the surrender terms, it should be made clear to Japan that this involves no commitment by the Allies as to the future, and that the person of the Emperor is to be regarded as at the disposal of the Allied Governments in the same way as each and every other person of the surrendering enemy state.\n\n3. Economic, social and political conditions in Japan:\n\nElimination of Japanese militarism and its constant threat to Pacific security involves radical changes in Japan’s social, political and economic pattern. Mere superficial changes in governmental machinery and external trade during a relatively short period of foreign control will not suffice. The roots of Japanese militarism are embedded in the totalitarian social, political and economic system built up over the past 70 years. The depressed conditions of the agricultural population and industrial workers, with consequent low consumption standards and limited domestic demand was largely responsible for the intense pressure for exports characteristic of Japanese industry. Agricultural poverty meant that large supplies of cheap industrial labour were available with considerable productive power but low standards of living. These conditions resulted in the drive to secure markets which was an important element in Japan’s territorial ambitions. Agricultural poverty also meant large supplies of military manpower. This in turn contributed to an overemphasis on heavy industries as a war potential. In order to correct this distortion of the Japanese economy, every effort should be made to improve the economic and social position of the agricultural population and to foster trade union and other movements aiming at raising standards of living.\n\nIt is realised that such a policy implies radical and direct intervention by the Allied countries in domestic Japanese affairs. Such intervention would be ineffective unless undertaken with determination and sustained until a democratic and popular regime is fully established. This involves a considerable period of occupation and there is a danger that the occupying Powers may weary of the task. This danger, however, should be weighed against the very real danger of a revival of Japanese chauvinism and aggression if the main features of Japan’s social, political and economic life are left substantially unchanged. If the Allied Nations demonstrate their will and determination [653면] to take all steps necessary to prevent future Japanese aggression, it may well be found that a firm policy vigorously applied in the early stages may produce promising conditions in a relatively short period. Moreover, the Japanese should be made to realise that controls would be modified and withdrawn as soon as there is reasonable prospect of successful conduct of affairs in accordance with the above-mentioned principles by the Japanese themselves. Such encouragement of Japanese activities is important, because the success of Allied controls will in large measure depend on the extent to which Japanese participation is secured.\n\nSubject to the general policy outlined above, immediate control of Japanese industry should be along the following lines:\n\n(a)\n\nEconomic disarmament, covering all industry;\n\n(b)\n\nAllied control of industry (including shipbuilding) with emphasis on restoration of light industries;\n\n(c)\n\nAllied control of Japanese import and export trade, with a view to fostering growth of essential consumer goods industries and giving effect to Allied reparations policy, having in mind also Japan’s losses of overseas territory and the need to fit Japanese export trade into the postwar network of International economic relations;\n\n(d)\n\nReparations to be paid in kind as the Allies may determine.\n\nAlthough on the one hand Japan should not be allowed unrestricted economic expansion while the Allies carry the heavy burden of security, this policy should not be allowed to prejudice the promotion of reforms by permitting the existence of mass unemployment and economic instability. It is necessary however to break the power of the Zaibatsu in their monopoly control of industry.\n\n4. Political conditions:\n\nPopular influence on government in Japan should be encouraged. The task is to replace the Militarists, Zaibatsu and Bureaucracy by a system of Government responsible to popular needs. Although in the long run this is a task for the Japanese people themselves, it will be difficult for genuinely democratic forces in Japan to assert themselves. They should therefore receive every help and encouragement from the Allied Powers.\n\nIn the initial stages the Supreme Allied Commander should assume complete authority, the powers of the Diet and all Japanese policymaking bodies being suspended. Gradually, however, restrictions on the exercise of civil functions by Japanese should be relaxed until, finally, they can be removed. Existing political parties should be dissolved, but new parties with aims compatible with the purposes of the United Nations should be countenanced. Local Government activity should be encouraged. Civil liberties would require legislative definition and protection by the Military Government. Obnoxious [654면] features of the judicial and police system should be abolished. Freedom of worship raises the difficult question of State Shinto with its Emperor-worship and its militaristic associations. In this connection reference is made to paragraph 2 above, in which consideration is given to the treatment of the Emperor.\n\n5. Other matters:\n\n(a)\n\nJapanese who have been prominent in any militaristic or Fascistic movements or activities should under no circumstances be used in any capacity by the Allied Military Government.\n\n(b)\n\nSurrender terms should be signed by the Emperor, the Military and Naval Chiefs, and the principal Cabinet Ministers.\n\n(c)\n\nThe Japanese Navy should be completely destroyed or transferred to Allied hands; the Japanese Air Force and Military installations and material should also be destroyed or, where appropriate transferred; the Merchant Navy should be surrendered to the Allied Nations, a proper share being assigned to Australia.\n\n(d)\n\nService personnel should be demobilised, conscription abolished, the Kempeitai (Gendarmerie), Tokkoka (Secret Police) Patriotic and Secret Societies and Ex-Servicemen’s Associations dissolved and manufacture and carrying of weapons prohibited.\n\n(e)\n\nThere should be provisions safeguarding Allied prisoners of war, and also provisions concerning Japanese prisoners of war.\n\n(f)\n\nThere should be provisions regarding war criminals (including the Emperor).\n\n(g)\n\nIt should be clearly understood that the Armistice is conditional on the surrender of all Japanese troops on the mainland and in the outlying parts and islands, and that the authority of the Emperor and of the Japanese Command is used to remove them and return them to Japan.", "notes": ["[주82] 8월 14일 던 씨의 부기: 「이것은 국무장관이 나에게 보낸 것이다. 나는 읽어 보았으나 이에 관하여 취할 일이 있다고는 보지 않는다.」 일본과장(디코버)의 부기: 「동의함.」 (740.00119 P.W./8–1345) 10월 19일 디코버 씨에게 전달된 사본에 적힌 부기: 「1945년 8월 13일 오후 3시에 국무장관에게 사본을 두고 감.」 (740.00119 Control(Japan)/10–1945)", "[주83] 윌리엄 플러드 웹 경(Sir William Flood Webb), 오스트레일리아 퀸즐랜드주 대법원장."], "note": "번역자 주 — 문서 본문은 「undated」이며 날짜는 각주의 부기와 출처 문서번호에서 온 것이다. 「the Allied Command」·「Supreme Allied Commander」는 원문 표기를 따라 각각 「연합국 사령부」·「연합국최고사령관」으로 옮겼다(d412의 「Supreme Commander of the Allied powers」와는 표기가 다르다). 「United Nations」는 1945년 8월 시점의 용례대로 연합국 진영을 가리키는 「국제연합」으로 두되 원어를 병기하였다. Kempeitai·Tokkoka는 원문 로마자 표기와 원문 괄호 설명(Gendarmerie, Secret Police)을 살렸다. 축약 없이 전문 번역하였다.", "warn": false, "pages": ["650", "651", "652", "653", "654"], "search": "James Clement Dunn 던 — 국무차관보 (각주의 부기) Erle R. Dickover 디코버 — 국무부 일본과장 (각주의 부기) Sir William Flood Webb 윌리엄 플러드 웹 — 오스트레일리아 퀸즐랜드주 대법원장 (각주) Adolf Hitler 히틀러 — 본문에서 일본 최고 당국과 대비되어 언급됨"}, {"id": "d433", "order": 433, "date": "1945-08-13", "group": "A", "eyebrow": "d433 · The Minister in Sweden (Johnson) to the Secretary of State", "title": "주스웨덴 공사(존슨)가 국무장관에게", "badge": null, "list_right": "문서 433", "meta": [{"k": "일자", "v": "1945-08-13"}, {"k": "시각", "v": "Stockholm, August 13, 1945—7 p.m. [Received August 13—5:43 p.m.]"}, {"k": "장소", "v": "Stockholm", "txt": true}, {"k": "전문번호", "v": "2764"}, {"k": "원문출처", "v": "Legation's 2384, July 6, 6 p.m. [주85] 참조", "txt": true}, {"k": "발신", "v": "주스웨덴 공사 존슨(Johnson)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 433 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d433"}], "summary": "일본 무관 오노데라 소장이 칼 베르나도테 왕자를 스톡홀름으로 불러, 자신이 여전히 강화 교섭에 관여하고 있으며 일본은 천황의 지위가 위태로워지는 어떠한 조건도 받아들일 수 없다 — 따라서 천황이 연합국최고사령관에 예속된다는 연합국의 첫 조건은 받아들이기 어렵다 — 고 말했다는 보고.", "points": ["남부 스웨덴에서 휴가 중이던 칼 베르나도테 왕자가 일본 무관 오노데라 소장의 요청으로 8월 11일 토요일 스톡홀름으로 즉시 오라는 연락을 받았다.", "왕자는 8월 12일 일요일 밤 도착해 즉시 오노데라와 접촉했고, 회담 후 공사관 직원과 접촉하려 했으나 3시간 동안 미행당해 오늘에야 접촉이 이루어졌다.", "오노데라는 자신이 천황 직속의 최고군사령부를 대표하므로 여전히 강화 교섭에 관여하고 있다고 밝혔고, 왕자에 따르면 이 문제를 둘러싼 일본 군부와 외무성의 갈등을 시사했다.", "오노데라는 아직 회답을 받지 못했으며 주스웨덴 일본 공사와 동시에 회답을 받게 될 것이라고 말했다.", "오노데라는 일본인(Japs)이 천황의 지위가 위태로워지는 어떠한 조건도 받아들일 수 없으며, 따라서 천황이 연합국최고사령관에 예속된다는 연합국의 첫 조건은 받아들이기 어려울 것이라고 말했다.", "왕자는 이 발언이 오노데라 개인의 의견인지 4개 연합국 정부를 대신한 전문 전달 이후 일본에서 직접 받은 정보에 근거한 것인지 알아내지 못했다.", "오노데라는 회답이 오늘이나 8월 14일에 올 것이며, 회답이 오면 즉시 왕자에게 알려 왕자가 자기 부친에게, 그리고 아마도 그를 통해 스웨덴 국왕에게 알리도록 하겠다고 말했다.", "왕자와 그 부친이 교섭에 관여했다는 오늘의 언론 보도를 왕자가 외무성 보도과장에게 부인했다 — 보도에 따르면 교섭은 외교 경로로 처리되었으므로 자기와 관계될 수 없고, 일본이 스위스·스웨덴 정부에 접근했을 때 자기는 남부 스웨덴에 있었다는 것이다."], "primary": "스톡홀름, 1945년 8월 13일 — 오후 7시.\n[접수 8월 13일 — 오후 5시 43분]\n\n2764. 공사관 전문 제2384호, 7월 6일 오후 6시[주85] 관련. 남부 스웨덴에서 휴가 중이던 칼 베르나도테 왕자[주86]가 일본 무관 오노데라(Onodera) 소장의 요청으로 8월 11일 토요일, 오노데라를 만나기 위해 즉시 스톡홀름으로 오라는 연락을 받았다. 칼 왕자는 8월 12일 일요일 밤에 도착하여 즉시 오노데라와 접촉했다. 회담 후 그는 공사관 직원과 접촉하려 했으나 [655면] 3시간 동안 미행을 당했고, 그 결과 오늘에서야 그와의 접촉이 이루어졌다.\n\n오노데라는 칼 왕자에게, 자신은 천황 직속의 최고군사령부를 대표하고 있으므로 여전히 강화 교섭에 관여하고 있다고 알렸으며, 칼 왕자에 따르면 이 문제를 둘러싸고 일본 군부와 외무성 사이에 갈등이 있음을 시사했다. 오노데라는 아직 아무런 회답도 받지 못했으며, 자신은 주스웨덴 일본 공사와 동시에 회답을 받게 될 것이라고 진술했다. 오노데라는 일본인(Japs)은 천황의 지위가 위태로워지게 되는 어떠한 조건도 받아들일 수 없으며, 따라서 천황이 연합국최고사령관에 예속된다는 연합국 측의 첫 번째 조건은 받아들이기 어려울 것이라고 진술했다. 칼 왕자는 이 진술이 오노데라의 개인적 의견인지, 아니면 4개 연합국 정부를 대신한 전문이 전달된 이후 일본으로부터 직접 받은 정보에 근거한 것인지에 관한 정보를 얻어 낼 수 없었다. 오노데라는 회답이 오늘이나 8월 14일에 이곳에 올 것이라고 진술했다. 그는 회답이 오면 즉시 칼 왕자에게 알리겠으며, 이는 칼 왕자가 자기 부친에게 알리고 아마도 그를 통해 스웨덴 국왕에게 알리도록 하기 위함이라고 말했다.\n\n칼 왕자와 그 부친이 교섭에 관여해 왔다는 취지의 오늘 자 언론 보도는 칼 왕자가 외무성 보도과장에게 부인하고 있다. 그 진술에서 칼 왕자는, 언론의 보도로 보건대 교섭은 외교 경로를 통해 처리되어 왔으므로 명백히 자신과 관계될 수 없으며, 나아가 일본이 스위스 및 스웨덴 정부에 접근했을 당시 칼 왕자는 남부 스웨덴에 있었다고 밝히고 있다.\n\n존슨", "secondary": "Stockholm, August 13, 1945—7 p.m. \n [Received August 13—5:43 p.m.]\n\n2764. Legation’s 2384, July 6, 6 p.m. [주85] Prince Carl Bernadotte [주86] who was vacationing in Southern Sweden was called Saturday Aug 11 at request of Major General Onodera, Jap Military Attaché, to come to Stockholm immediately in order to meet Onodera. Prince Carl arrived Sunday night Aug 12 and immediately contacted Onodera. Following conversation he attempted to contact officer of Legation but [655면] was followed for 3 hours and consequently contact with him was not made until today.\n\nOnodera advised Prince Carl that he was still involved in peace negotiations since he represented Supreme Military Command directly under Emperor and he inferred, according to Prince Carl, conflict between Jap military and Foreign Office on this question. Onodera stated that no reply had yet been received and that he would receive reply simultaneously with Jap Minister to Sweden. Onodera stated that Japs could not accept any terms whereby position of Emperor would be jeopardized and that accordingly first condition of Allies with respect to Emperor being subject to Supreme Commander of Allied Powers would be objectionable. Prince Carl could not obtain information whether this statement was Onodera’s opinion or was based directly on information received from Japan since time transmission of message on behalf four Allied Govts. Onodera stated reply would come here today or August 14. He said he would immediately advise Prince Carl of reply for purposes of Prince Carl advising his father and presumably through him Swedish King.\n\nPress report today to effect that Prince Carl and his father have been involved in negotiations is being denied by Prince Carl to head of Foreign Office Press Section in statement wherein Prince Carl advises that from reports in press, negotiations have been handled through diplomatic channels and obviously could therefore not concern him and further that Prince Carl was in Southern Sweden at time of Jap approach to Swiss and Swedish Govts.\n\nJohnson", "notes": ["[주85] 앞의 487면.", "[주86] 구스타프 5세(Gustav V) 국왕의 조카."], "note": "번역자 주 — 발신 오후 7시, 접수 오후 5시 43분을 살렸다. 원문에 'Jap Military Attaché', 'Jap Minister', 'Japs', 'Jap approach' 등 당대의 멸칭·축약형 표기가 반복해서 쓰인다. 번역 규칙 8에 따라 부드럽게 바꾸지 않고 본문의 'Japs'는 원어를 병기해 그대로 두었으며, 나머지 'Jap ~' 형태는 한국어로는 축약이 재현되지 않으므로 「일본 무관」·「일본 공사」로 옮기되 원문이 축약 멸칭형이라는 사실을 여기 적어 둔다. 원문의 전보 문체(관사·전치사 생략)를 임의로 풀지 않고 직역에 가깝게 옮겼다. 'Supreme Military Command directly under Emperor'는 일본의 대본영/통수부를 가리키는 것으로 보이나 원문 표현대로 「천황 직속의 최고군사령부」로 옮겼다. 'first condition of Allies with respect to Emperor being subject to Supreme Commander of Allied Powers'는 8월 11일 번스 회답의 해당 조항을 가리킨다.", "warn": false, "pages": ["654", "655"], "search": "Johnson 존슨(Herschel V. Johnson) — 주스웨덴 미국 공사, 발신자 Prince Carl Bernadotte 칼 베르나도테 왕자 — 구스타프 5세 국왕의 조카 Onodera 오노데라(小野寺信) — 일본 육군 소장, 주스웨덴 무관 Gustav V 구스타프 5세 — 스웨덴 국왕(각주)"}, {"id": "d434", "order": 434, "date": "1945-08-13", "group": "B", "eyebrow": "d434 · The Acting Secretary of War (McCloy) to the Secretary of State", "title": "육군장관 대리(매클로이)가 국무장관에게", "badge": null, "list_right": "문서 434", "meta": [{"k": "일자", "v": "1945-08-13"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": null, "txt": true}, {"k": "발신", "v": "육군장관 대리 매클로이(John J. McCloy)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 434 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d434"}], "summary": "대일 작전이 급속히 진전됨에 따라 태평양지역사령부 육군총사령관에게 정치고문을 즉시 배속하는 것이 긴요하다며, 국무부에 적임자 추천을 요청한 서한.", "points": ["일본에 대한 군사작전이 급속히 진전됨에 따라 태평양지역사령부 육군총사령관에게 정치고문을 즉시 배속하는 것이 긴요해졌다.", "유럽전구에서와 마찬가지로 그는 일본 군정(軍政)의 세부 계획 수립에 관하여, 특히 정치 정책과 관련하여 조언한다.", "일본 항복 후에는 항복 조건 집행의 임무를 맡을 미국 총사령관에게도 요청이 있을 경우 정치 문제에 관해 조언할 수 있어야 한다.", "비범한 안목, 성실성, 외교 경험, 극동의 유난히 복잡한 정치 문제와 국무부 정책에 대한 지식을 갖춘 인물이 이 자리에 지명되어야 한다.", "기본적 군사전략과 소요에 대한 이해가 있으면, 자신이 직접 책임지고 보좌할 사령관의 긴요한 친밀한 신뢰를 얻고 유지하는 데 큰 도움이 될 것이다.", "그가 대중에게도 그 판단에 큰 신뢰를 둘 수 있는 인물로 알려져 있어야 한다고 본다.", "이 정치고문은 국무부와 육군부 정책의 최대한의 조정을 보장하는 관계에서 핵심 인물이 될 것이므로, 국무부의 추천을 큰 관심을 갖고 기다린다."], "primary": "워싱턴, 1945년 8월 13일.\n\n장관 귀하,\n\n일본에 대한 군사작전의 급속한 진전으로 말미암아 태평양지역사령부 육군총사령관(Commander-in-Chief, Army Forces, Pacific Area Command)에게 정치고문을 즉시 배속하는 것이 긴요해졌습니다. 유럽전구(European Theater of Operations)에서와 마찬가지로, 그는 일본의 군정(軍政)에 관한 세부 계획의 수립에 관하여, 특히 정치 정책과 관련하여 조언하게 될 것입니다. 일본의 항복 이후에는, 요청이 있을 경우, 항복 조건을 집행할 임무를 맡게 될 미국 총사령관에게도 정치 문제에 관하여 조언할 수 있도록 대기하고 있어야 할 것입니다.\n\n비범한 안목, 성실성, 외교 경험, 극동의 유난히 복잡한 정치 문제와 [656면] 국무부 정책에 대한 지식을 갖춘 인물이 이 직위에 지명되는 것이 지극히 중요하다는 데 장관께서도 동의하시리라 믿습니다. 기본적인 군사전략과 소요에 대한 이해는, 그가 직접 책임을 지고 보좌하게 될 사령관의 긴요한 친밀한 신뢰를 얻고 유지하는 데 그에게 큰 도움이 될 것입니다. 저는 또한 그가 대중에게도 그 판단에 큰 신뢰를 둘 수 있는 인물로 알려져 있어야 한다고 봅니다.\n\n저와 마찬가지로 장관께서도 대일 전쟁에서 국무부와 육군부 정책 사이에 최대한의 조정이 이루어지기를 바라고 계시리라 압니다. 태평양지역사령부 육군총사령관에 대한 정치고문은 이 관계에서 핵심 인물이 될 것이므로, 저는 장관의 추천을 큰 관심을 갖고 기다립니다.\n\n경구,\n\n존 J. 매클로이(John J. McCloy)", "secondary": "Washington, August 13, 1945.\n\nDear Mr. Secretary: The rapid progress of military operations against Japan makes essential the immediate assignment of a political advisor to the Commander-in-Chief, Army Forces, Pacific Area Command. As in the European Theater of Operations, he will advise concerning the formulation of detailed plans for the Military Government of Japan, with particular reference to political policies. After the surrender of Japan he should also be available, if requested, to advise the U.S. Commander-in-Chief who will be charged with the duty of enforcing the surrender terms, regarding political matters.\n\nI am sure you will agree it is vitally important that a man of unusual vision, integrity, diplomatic experience, knowledge of the peculiarly complex political problems in the Far East, and of State [656면] Department policies, be nominated for this position. An appreciation of basic military strategy and requirements will assist him greatly in obtaining and maintaining the essential cordial confidence of the Commanding General to whom he will be directly responsible. I believe he should also be known to the public as a person in whose judgment great trust can be placed.\n\nI know you are desirous, as I am, to assure the utmost degree of coordination between State and War Department policies in the war against Japan. Since the political advisor to the Commander-in-Chief, Army Forces, Pacific Area Command, will be a key individual in this relationship, I anticipate your nominations with great interest.\n\nSincerely yours,\n\nJohn J. McCloy", "notes": [], "note": "번역자 주 — 시각 표시가 없는 공식 서한이다. 'Military Government'는 「군정(軍政)」으로 옮겼다. 'nominations'는 국무부가 후보를 추천·지명하는 것을 가리킨다. 수신자는 원문에 'Dear Mr. Secretary'로만 되어 있고 이름은 나오지 않는다.", "warn": false, "pages": ["655", "656"], "search": "McCloy 매클로이(John J. McCloy) — 육군장관 대리, 발신자 Byrnes 번스(James F. Byrnes) — 국무장관, 수신자(직명으로만 표시)"}, {"id": "d435", "order": 435, "date": "1945-08-14", "group": "A", "eyebrow": "d435 · The Minister in Switzerland (Harrison) to the Secretary of State", "title": "주스위스 공사(해리슨)가 국무장관에게", "badge": null, "list_right": "문서 435", "meta": [{"k": "일자", "v": "1945-08-14"}, {"k": "시각", "v": "Bern, August 14, 1945—11 a.m. [Received August 14—7:34 a.m.]"}, {"k": "장소", "v": "Bern", "txt": true}, {"k": "전문번호", "v": "3883"}, {"k": "원문출처", "v": "Your 2520 (d428) 회신", "txt": true}, {"k": "발신", "v": "주스위스 공사 해리슨(Harrison)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 435 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d435"}], "summary": "제네바의 스위스 무선국이 베른 주재 일본 공사관 앞 암호 전문을 방금 접수했고 전문이 일본 공사관으로 가는 중이라는 스투키 공사의 전화 통고 — 암호라는 사실 자체가 일본의 회답에 조건이 붙었음을 시사한다.", "points": ["귀 전문 제2520호(8월 13일 오전 9시) 관련.", "스투키(Stucki) 공사가 전화로, 제네바의 스위스 무선국이 이곳 일본 공사관 앞 암호 전문을 방금 접수했다고 알려 왔다.", "전문은 지금 일본 공사관으로 가는 중이다.", "따라서 스투키는 오늘 오후 이전에는 [내용] 접수를 예상하지 않는다.", "그가 즉시 알려 줄 것이다."], "primary": "베른, 1945년 8월 14일 — 오전 11시.\n[접수 8월 14일 — 오전 7시 34분]\n\n3883. 귀 전문 제2520호 관련. 스투키(Stucki) 공사가 나에게 전화로, 제네바의 스위스 무선국이 이곳 일본 공사관 앞 암호 전문을 방금 접수했다고 알려 왔다. 그 전문은 지금 일본 공사관으로 가는 중이다. 따라서 스투키는 오늘 오후 이전에는 접수를 예상하지 않는다. 그가 나에게 즉시 알려 줄 것이다.\n\n해리슨", "secondary": "Bern, August 14, 1945—11 a.m. \n [Received August 14—7:34 a.m.]\n\n3883. Your 2520. Minister Stucki telephones me Swiss radio station Geneva has just received code message for Japanese Legation here. Message is now on its way to Japanese Legation. Stucki therefore does not expect receipt before this afternoon. He will advise me immediately.\n\nHarrison", "notes": [], "note": "번역자 주 — 발신 오전 11시, 접수 오전 7시 34분을 살렸다. 「귀 전문 제2520호」는 이 배치의 d428(8월 13일 오전 9시, 번스)을 가리킨다 — 그 전문의 지시에 따르면 회답이 암호로 온다는 것은 일본의 회답에 조건이 붙었음을 뜻하나, 이 전보 자체는 그 추론을 적지 않았으므로 본문에 넣지 않았다. 마지막에서 두 번째 문장의 'does not expect receipt'는 목적어가 생략되어 있어 '[전문 내용의] 접수'로 읽었으나 원문대로 목적어 없이 옮겼다.", "warn": false, "pages": ["656"], "search": "Harrison 해리슨(Leland Harrison) — 주스위스 미국 공사, 발신자 Stucki 스투키(Walter Stucki) — 스위스 연방정치부 공사"}, {"id": "d436", "order": 436, "date": "1945-08-14", "group": "A", "eyebrow": "d436 · The Chargé in Australia (Minter) to the Secretary of State", "title": "주오스트레일리아 대리대사(민터)가 국무장관에게", "badge": null, "list_right": "문서 436", "meta": [{"k": "일자", "v": "1945-08-14"}, {"k": "시각", "v": "1945년 8월 14일 오후 1시 발신 (Canberra, August 14, 1945—1 p.m.) / 8월 14일 오전 12시 57분 접수 (Received August 14—12:57 a.m.)"}, {"k": "장소", "v": "Canberra", "txt": true}, {"k": "전문번호", "v": "123"}, {"k": "원문출처", "v": "740.00119 P.W./8–1445: Telegram", "txt": true}, {"k": "발신", "v": "주오스트레일리아 대리대사 민터(John R. Minter)", "txt": true}, {"k": "수신", "v": "국무장관 번스(James F. Byrnes)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 436 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d436"}], "summary": "오스트레일리아 외무장관 에바트가 항복 공식 발표에 오스트레일리아도 동시에 참여해야 한다고 강력히 요구했다는 보고.", "points": ["에바트가 민터를 불러, 오스트레일리아가 동시 공식 항복 발표에 참여해야 한다는 소감을 매우 강하게 표명.", "에바트의 말: 「미국을 제외하면, 기지·시설·보급·병력으로 현재의 이 기쁜 진전을 가져오는 데 4대국 어느 나라보다 비율상 더 많이 기여한 오스트레일리아가 그 영예를 박탈당한다는 것은 생각할 수 없는 일이다.」", "민터의 건의: 시간이 허락한다면 공식 발표 시각과 그 문안을 오스트레일리아에 통보해 줄 것.", "에바트는 런던에도 같은 취지를 제기했다."], "primary": "캔버라, 1945년 8월 14일 오후 1시\n[8월 14일 오전 12시 57분 접수]\n\n123. 에바트 [주87] 가 나를 불러, 오스트레일리아가 동시에 이루어질 공식 항복 발표에 참여하여야 한다는 자신의 소감을 매우 강력히 표명하였다. 그는 \"미국을 제외한다면, 기지·시설·보급 및 전투 병력으로 현재의 이 기쁜 진전을 가져오는 데 4대국 어느 나라보다도 비율상 더 많이 기여한 오스트레일리아가\" 그 영예를 박탈당한다는 것은 \"생각할 수 없는 일\"이라고 본다.\n\n나는 시간적 여유가 허락한다면 공식 발표의 시각과 그 문안을 그들에게 통보할 것을 건의한다.\n\n그는 런던에도 같은 취지의 진정을 하였다.\n\n민터(Minter)\n\n[657면]", "secondary": "Canberra, August 14, 1945—1 p.m. \n [Received August 14—12:57 a.m.]\n\n123. Evatt [주87] sent for me and expressed very strongly his feeling that Australia should participate in the simultaneous official surrender announcement. He views it as “unthinkable that Australia, which barring the United States has contributed proportionately more with bases, works, supplies and fighting men to bring about the present happy development than any of the Big Four” should be deprived of that honor.\n\nI recommend that if the time lag allows they be notified of the hour of official release and the language thereof.\n\nHe has made the same representations to London.\n\nMinter\n\n[657면]", "notes": ["[주87] 허버트 V. 에바트(Herbert V. Evatt), 오스트레일리아 외무장관."], "note": "번역자 주 — 「the Big Four」는 미·영·소·중 4대국을 가리킨다. 에바트의 발언 중 원문에서 인용부호로 묶인 두 부분을 그대로 인용부호로 유지했다.", "warn": false, "pages": ["656", "657"], "search": "Minter 민터(John R. Minter, 주오스트레일리아 대리대사) Evatt 에바트(Herbert V. Evatt, 오스트레일리아 외무장관)"}, {"id": "d437", "order": 437, "date": "1945-08-14", "group": "B", "eyebrow": "d437 · Memorandum by the Joint Chiefs of Staff  Circulated as SWNCC 21/7, August 14; General Order No. 1, as amended, was thereupon approved by President Truman and circulated as SWNCC 21/8, August 17.", "title": "합동참모본부의 각서", "badge": null, "list_right": "문서 437", "meta": [{"k": "일자", "v": "1945-08-14"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "SM–2866"}, {"k": "원문출처", "v": "SWNCC 21 Series (SWNCC 21/7로 회람, 1945년 8월 14일)", "txt": true}, {"k": "발신", "v": "합동참모본부(JCS) — 합동참모본부를 위하여 준장 A. J. 맥팔런드 간사", "txt": true}, {"k": "수신", "v": "국무·육군·해군 3부조정위원회(SWNCC)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 437 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d437"}], "summary": "합동참모본부가 SWNCC 21/5의 일반명령 제1호를 검토하여 오스트레일리아군 항복 구역 삭제, 조선 항복 조항 개편, 북위 38도선 채택 등의 수정을 제안하고 그 이유를 설명한 각서(부속서 A: 수정된 일반명령 제1호, 부속서 B: 대통령 명의 메시지 초안).", "points": ["제목: 일본의 항복을 위한 문서. 합동참모본부가 SWNCC 21/5 부속서 B에 담긴 일반명령 제1호 초안을 검토하고, 수정안을 부속서 「A」에 제시했다.", "a. 오스트레일리아 제국군 총사령관에게 항복하도록 한 규정을 삭제하고 그 구역의 병력을 마운트배튼 제독의 책임 하에 포함시켰다 — 영국 참모총장단이 일본 항복 즉시 필리핀 이남 남서태평양 지역의 일부에 대한 책임을 인수할 용의를 방금 표명했기 때문이다.", "b. **조선에서의 항복에 관한 항이 삭제되고, 조선에 대한 미국의 책임이 태평양 미육군 총사령관에게 배정되었다.** 조선 점령 책임이 이미 합동참모본부에 의해 태평양 미육군 총사령관에게 배정되어 있기 때문이다. 해당 지역 담당 총사령관 예하가 아닌 미군 지휘관이 국지 항복을 접수해야 하는 경우에 대비한 훈령은 이미 발했다.", "러시아군이 京城(경성=서울)과 다롄을 점령하기 전에 미군이 도착할 경우에 대비하여 미군의 진주를 위한 예비 조치가 지시되었다. 이 문제와 화북 해안 요지 확보 문제는 최고사령관이 일본 대본영에 현지에서 세부 지시를 내리는 작전적 처리가 필요할 것으로 봄. 황해 주변과 쿠릴에서 러시아 측과의 오해를 피하는 문제도 있으며, 대통령이 관계 연합국들에게 우리 의도를 알리는 것이 그 처리 방법이라고 봄.", "쿠릴: 미·소 참모총장단은 온네코탄 해협을 지나는 작전 구역 경계선에 합의했다. 합동참모본부는 니미츠 제독에게 이 선 이남 쿠릴열도의 항복 접수를 계획하도록 훈령할 것을 제의하며, 적절한 시기에 러시아 측에 이 절차를 알리고 러시아가 지원을 요청하지 않는 한 파라무시로·슘슈 두 섬에서는 소련이 항복을 접수하고 일본군을 무장 해제할 것으로 기대한다고 알릴 것을 제의한다.", "**북위 38도선을 조선에서 선택한 이유: 그것이 미군에게 京城의 항구 및 교통 중심 지역과, 어떤 형태의 4개국 분할 통치가 실현될 경우 그 일부를 중국과 영국에 할당할 수 있을 만큼 충분한 조선의 몫을 주기 때문이다.**", "합동참모본부는 일본 항복 후 조선의 행정·통치에 관한 어떠한 상세한 조치도 알지 못하며, 조선 점령 책임을 진 미군 지휘관에게 지침이 제공될 수 있도록 관계 정부 당국이 즉시 조치를 취할 것을 촉구한다.", "일본 항복에 관해 지금 정확히 추산할 수 없는 미지의 요소가 많고 상황이 날마다 바뀔 수 있으므로, 일반명령 제1호는 합동참모본부를 통한 추후 훈령에 따라 변경될 수 있다는 단서를 붙여 최고사령관에게 보내야 하며, 최고사령관은 자신이 아는 작전 상황상 필요한 세부 사항의 변경을 할 권한을 부여받아야 한다.", "부속서 A(일반명령 제1호 제1항)의 항복 구역 배분: a. 중국(만주 제외)·타이완(포모사)·북위 16도 이북 프랑스령 인도차이나 → 장제스 총통. b. 만주, **북위 38도 이북 조선**, 가라후토 → 극동 소련군 총사령관. c. 안다만·니코바르·버마·태국·북위 16도 이남 인도차이나·말라야·보르네오·네덜란드령 인도·뉴기니·비스마르크·솔로몬 → 동남아시아사령부 연합국최고사령관. d. 일본 위임통치 제도·류큐·보닌 및 기타 태평양 제도 → 미태평양함대 총사령관. e. 일본 본토 제도와 인접 소도, **북위 38도 이남 조선**, 필리핀 → 태평양 미육군 총사령관.", "무장 해제 규정: 일본 대본영은 소재를 불문한 전 일본군·일본 통제 하 부대를 완전히 무장 해제하고 무기·장비를 온전하고 안전·양호한 상태로 인도할 것을 명한다. 다만 추후 훈령이 있을 때까지 일본 본토 제도의 경찰력은 이 무장 해제 규정에서 제외되며, 경찰은 현직에 남아 법과 질서의 유지 책임을 진다.", "부속서 B는 대통령이 총리·스탈린 대원수·장제스 총통에게 보낼 메시지 초안이다: 미국은 일본 본토 확보에 최우선을 두면서 아시아 대륙 연안 지역 일본군의 항복을 촉진하기 위해 해·공군력을 사용하고자 하며, 황해와 일본 인접 수역의 통제와 아시아 대륙의 일본군 보유 요항 확보를 지시했다. 이 작전들은 군사적 목적에 한하며 최종 평화 정착을 침해하지 않는다."], "primary": "SM–2866\n\n워싱턴, 1945년 8월 14일.\n\n국무·육군·해군 3부조정위원회 앞 각서:\n\n제목: 일본의 항복을 위한 문서.\n\n합동참모본부는 제안된 일반명령 제1호(SWNCC 21/5 [주89] 의 부속서 \"B\"에 수록됨)를 검토하였으며, 그 제안된 변경은 부속서 \"A\" [주90] 에 표시되어 있다. 즉시 명백하지 않은 변경들의 이유는 다음과 같다:\n\n**a.**\n\n일정한 일본군 부대가 오스트레일리아 제국군 총사령관에게 항복하도록 한 규정은 삭제되었고, 그 구역의 병력은 마운트배튼 제독의 책임 하에 포함되었다. 이는 영국 참모총장단이 일본 항복 즉시 필리핀 이남 남서태평양 구역의 일부에 대한 책임을 인수할 용의가 있음을 방금 표명하였다는 사실에 비추어 그러하다.\n\n**b.**\n\n조선에서의 항복에 관한 항은 삭제되었고, 조선에 대한 미국의 책임은 태평양 미육군 총사령관에게 배정되었다. 조선에 대한 점령 책임이 이미 합동참모본부에 의하여 태평양 미육군 총사령관에게 배정되어 있기 때문이다. 국지적 항복이 제의된 구역의 책임을 맡은 총사령관 예하에 있지 않을 수도 있는 미군 지휘관들이 그 국지적 항복을 접수하는 데 필요한 규정을 두어야 함을 인식하여, 합동참모본부는 이 우발 사태에 대비하는 훈령을 이미 발하였다.\n\n러시아군이 京城 [주91] 과 다롄(大連)을 점령하기 전에 미군이 도착할 경우에 대비하여, 미군의 이들 지점 진입을 위한 예비 조치가 지시되었다. 이 문제와 미군이 화북(華北) 해안을 따라 요지를 확보하는 문제는 항복에 관한 작전상의 문제를 제기하며, 이는 십중팔구 최고사령관이 일본 대본영에 현지에서 세부 지시를 내리는 방식으로, 작전적 차원에서 처리되어야 할 것이다. 또한 황해 주변 지역과 쿠릴열도 양쪽에 관하여 러시아 측과의 어떠한 오해도 피해야 하는 문제가 있다. 이 문제를 처리하는 한 가지 방법은 대통령이 관계 연합국들에게 우리의 의도를 통보하는 것이라고 믿어진다.\n\n귀 위원회의 참고를 위하여, 합동참모본부가 적절한 시기에 대통령에게 제출할 메시지(부속서 \"B\")를 동봉한다.\n\n[658면]\n\n쿠릴열도 문제에 관하여, 미국과 러시아의 참모총장단은 온네코탄 해협(Onnekotan Strait)을 지나는 작전 구역 간 경계선에 합의하였다. 현재 나타나는 상황을 기초로, 합동참모본부는 니미츠 제독에게 이 선 이남 쿠릴열도의 항복을 접수할 것을 계획하도록 훈령할 것을 제의한다. 합동참모본부는 적절한 시기에 러시아 측에 이 절차를 통보할 것과, 러시아가 지원을 요청하지 않는 한 파라무시로 및 슘슈 제도(諸島)에서는 소련이 항복을 접수하고 일본군을 무장 해제할 것을 합동참모본부가 기대하고 있음을 통보할 것을 제의한다.\n\n북위 38도선이 조선에서 선택된 것은, 이것이 미군에게 京城의 항만 및 교통 지역과, 어떠한 형태의 4개국 분할 통치가 실현될 경우 그 일부를 중국 및 영국에 배분할 수 있을 만큼 충분한 크기의 조선의 일부를 주기 때문이다. 합동참모본부는 일본 항복 이후 조선의 행정 및 통치에 관한 어떠한 상세한 조치도 알지 못하며, 조선에서 점령 책임을 맡은 미군 지휘관에게 지침이 제공될 수 있도록 관계 정부 당국이 즉시 조치를 취할 것을 촉구한다.\n\n일본의 항복에 관하여는 현 시점에서 정확히 추산할 수 없는 미지의 요소가 많다. 맥아더 장군이 천황 및 대본영과의 조정을 마무리하는 기간 동안 상황은 날마다 변할 수 있다. 따라서 일반명령 제1호는, 합동참모본부를 통한 추후 훈령의 결과로 변경될 수 있다는 단서와 함께, 아울러 최고사령관이 자신이 알고 있는 작전 상황에 비추어 필요한 세부 사항의 변경을 할 수 있는 권한을 부여받는다는 단서와 함께 최고사령관에게 보내져야 한다고 믿어진다.\n\n합동참모본부를 위하여:\n\nA. J. 맥팔런드(A. J. McFarland)\n\n미육군 준장, 간사\n\n---\n\n[부속서 1]\n\n**부속서 \"A\"**\n\n### 일반명령 제1호\n\n**육군 및 해군**\n\n1. 대본영은 천황의 명에 의하여, 또한 천황에 의한 전 일본군의 연합국최고사령관에 대한 항복에 따라, 이로써 [659면] 일본 및 해외의 모든 예하 지휘관에게 명하여, 그 지휘 하의 일본군 및 일본 통제 하의 부대로 하여금 즉시 적대행위를 중지하고, 무기를 내려놓고, 현재의 소재지에 머무르며, 이하에 표시되는 바 또는 연합국최고사령관이 추후 지시할 수 있는 바에 따라 미합중국·중화민국·영국 및 영제국·소비에트 사회주의 공화국 연방을 대표하여 행동하는 지휘관들에게 무조건 항복하게 한다. 표시된 지휘관들 또는 그들이 지정한 대표들과 즉시 접촉이 이루어지며, 이는 연합국최고사령관이 정하는 세부 사항의 변경에 따른다. 그리고 그들의 훈령은 완전하고 즉각적으로 이행된다.\n\n**a.**\n\n중국(만주를 제외한다), 타이완(포모사) 및 북위 16도 이북의 프랑스령 인도차이나 내의 일본군 선임 지휘관들과 모든 육상·해상·항공 및 보조 부대는 장제스 총통에게 항복한다.\n\n**b.**\n\n만주, 북위 38도 이북의 조선 및 가라후토(남사할린) 내의 일본군 선임 지휘관들과 모든 육상·해상·항공 및 보조 부대는 극동 소련군 총사령관에게 항복한다.\n\n**c.**\n\n안다만 제도, 니코바르 제도, 버마, 태국, 북위 16도 이남의 프랑스령 인도차이나, 말라야, 보르네오, 네덜란드령 인도, 뉴기니, 비스마르크 제도 및 솔로몬 제도 내의 일본군 선임 지휘관들과 모든 육상·해상·항공 및 보조 부대는 동남아시아사령부 연합국최고사령관에게 항복한다.\n\n**d.**\n\n일본 위임통치 제도, 류큐 제도, 보닌 제도 및 그 밖의 태평양 제도에 있는 일본군 선임 지휘관들과 모든 육상·해상·항공 및 보조 부대는 미태평양함대 총사령관에게 항복한다.\n\n**e.**\n\n일본 본토 제도, 그에 인접한 소도(小島)들, 북위 38도 이남의 조선 및 필리핀에 있는 일본 대본영, 그 선임 지휘관들 및 모든 육상·해상·항공 및 보조 부대는 태평양 미육군 총사령관에게 항복한다.\n\n일본 대본영은 나아가 일본 및 해외의 예하 지휘관들에게, 소재를 불문하고 일본의 또는 일본 통제 하의 모든 부대를 완전히 무장 해제할 것과, 위에 표시된 연합국 지휘관들이 정할 수 있는 시기 및 장소에서 모든 무기 및 장비를 온전하고 안전하며 양호한 상태로 인도할 것을 명한다. (추후 훈령이 있을 때까지 일본 본토 제도의 일본 경찰력은 이 무장 해제 규정에서 제외된다. 경찰력은 그 직위에 남아 있으며 법과 질서의 보전에 대한 책임을 진다. 그러한 경찰력의 규모와 무장은 별도로 정하여진다.)\n\n(일반명령 제1호의 나머지 부분은 변경을 요하지 아니하며 SWNCC 21/5에 기재된 대로 두어야 한다.)\n\n[660면]\n\n---\n\n[부속서 2]\n\n**부속서 \"B\"**\n\n### 대통령이 총리, 스탈린 대원수 및 장제스 총통에게 보내는 메시지 초안\n\n일본 본토의 확보에 최우선을 두는 한편, 미합중국은 국지적 적대행위의 계속을 단념시키고 항만 시설에 대한 악의적 파괴 및 사보타주를 방지하기 위하여, 아시아 대륙 연안 지역에 있는 일본군의 항복을 촉진하는 데 그 해군력과 공군력을 사용하고자 한다. 나는 미 해군 부대에 대하여 일본이 항복할 경우 황해 및 일본 인접 수역을 즉시 통제하도록 지시하였으며, 또한 미군 부대에 대하여 현재 일본군이 보유하고 있는 아시아 대륙의 요항(要港)들을 확보하도록 지시하였다. 내가 이 메시지를 보내는 것은, 이 작전들이 항복을 촉진하기 위하여 미국의 군사적 역량을 활용하려는 것이며, 오직 군사적 목적을 위한 것이고, 최종적 평화 정착을 침해하지 아니한다는 점을 명백히 하기 위함이다.", "secondary": "SM–2866\n\nWashington, 14 August, 1945.\n\nMemorandum for the State-War-Navy Coordinating Committee:\n\nSubject: Instruments for the surrender of Japan.\n\nThe Joint Chiefs of Staff have reviewed the proposed General Order No. 1 (contained in Enclosure “B” of SWNCC 21/5 [주89] ) and their suggested changes are indicated in Enclosure “A”. [주90] The reasons for such changes as are not immediately apparent are as follows:\n\na.\n\nThe provision for surrender of certain Japanese forces to the Commander in Chief of the Australian Imperial Forces has been deleted and the forces in that area included under Admiral Mount-batten’s responsibility in view of the fact that the British Chiefs of Staff have just stated their willingness to assume responsibility for parts of the Southwest Pacific area south of the Philippines immediately upon Japanese surrender.\n\nb.\n\nThe paragraph pertaining to surrender in Korea has been deleted and U.S. responsibilities for Korea have been assigned to the Commander in Chief, U.S. Army Forces, Pacific, since the occupation responsibilities for Korea have already been assigned to the Commander in Chief, U.S. Army Forces, Pacific, by the Joint Chiefs of Staff. Recognizing that provisions needed to be made for acceptance of local surrenders by U.S. commanders who might not be under the commander in chief assigned the responsibility for the area for which the local surrender is offered, the Joint Chiefs of Staff have already issued instructions to provide for this contingency.\n\nPreliminary arrangements have been directed for the entry of U.S. forces into Keijo [주91] and Dairen in case they arrive before the Russians occupy these points. This and the matter of U.S. forces seizing key points along the north China Coast present operational problems concerning the surrender which will in all probability have to be handled on an operational basis with detailed directions on the spot from the Supreme Commander to the Japanese Imperial General Headquarters. There is also the problem of avoiding any misunderstanding with the Russians both on areas around the Yellow Sea and on the Kuriles. It is believed that a way to handle this problem would be for the President to inform the Allied Powers concerned of our intentions.\n\nFor your information there is enclosed (Enclosure “B”) a message which the Joint Chiefs of Staff will present to the President at an appropriate time.\n\n[658면]\n\nOn the matter of the Kuriles, the United States and Russian Chiefs of Staff have agreed to a boundary line between areas of operations which passes through Onnekotan Strait. On the basis of the situation as it appears at present, the Joint Chiefs of Staff propose to instruct Admiral Nimitz to plan on receiving the surrender of the Kurile Islands south of this line. They propose at an appropriate time to inform the Russians of this procedure and that unless the Russians request assistance, the Joint Chiefs of Staff expect the Soviets to receive the surrender and disarm the Japanese in the islands of Paramushiro and Shumushu.\n\nThe parallel 38° north has been selected in Korea since this gives to U.S. forces the port and communications area of Keijo and a sufficient portion of Korea so that parts of it might be apportioned to the Chinese and the British in case some sort of quadripartite administration eventuates. The Joint Chiefs of Staff do not know of uny detailed arrangements for the administration and government of Korea after the Japanese surrender and urge that the appropriate governmental authorities take steps at once in order that guidance may be made available to the U.S. commander charged with the occupation responsibilities in Korea.\n\nThere are many unknown factors concerning the Japanese capitulation which cannot be accurately estimated at this time. The situation is liable to be changing daily during the period when General MacArthur is completing the arrangements with the Emperor and the Imperial General Headquarters. It is therefore believed that General Order No. 1 should be sent to the Supreme Commander with a provision that it is subject to change as a result of further instructions through the Joint Chiefs of Staff and also that the Supreme Commander is empowered to make changes in matters of detail which are indicated by the operational situation as known to him.\n\nFor the Joint Chiefs of Staff: \n\n\nA. J. McFarland\n\nBrigadier General, U.S.A. Secretary\n\n[Annex 1]\n\nEnclosure “A”\n\nGeneral Order No. 1\n\nMilitary and Naval\n\n1. The Imperial General Headquarters by direction of the Emperor, und pursuant to the surrender to the Supreme Commander for the Allied Powers of all Japanese armed forces by the Emperor, hereby [659면] orders all of its commanders in Japan and abroad to cause the Japanese armed forces and Japanese-controlled forces under their command to cease hostilities at once, to lay down their arms, to remain in their present locations and to surrender unconditionally to commanders acting on behalf of the United States, the Republic of China, the United Kingdom and the British Empire, and the Union of Soviet Socialist Republics, as indicated hereafter or as may be further directed by the Supreme Commander for the Allied Powers. Immediate contact will be made with the indicated commanders, or their designated representatives, subject to any changes in detail prescribed by the Supreme Commander for the Allied Powers, and their instructions will be completely and immediately carried out.\n\na.\n\nThe senior Japanese commanders and all ground, sea, air and auxiliary forces within China (excluding Manchuria), Formosa and French Indo-China north of 16° north latitude shall surrender to Generalissimo Chiang Kai-shek.\n\nb.\n\nThe senior Japanese commanders and all ground, sea, air and auxiliary forces within Manchuria, Korea north of 38° north latitude and Karafuto shall surrender to the Commander in Chief of Soviet Forces in the Far East.\n\nc.\n\nThe senior Japanese commanders and all ground, sea, air and auxiliary forces within the Andamans, Nicobars, Burma, Thailand, French Indo-China south of 16° north latitude, Malaya, Borneo, Netherlands Indies, New Guinea, Bismarcks, and the Solomons, shall surrender to the Supreme Allied Commander, Southeast Asia Command.\n\nd.\n\nThe senior Japanese commanders and all ground, sea, air and auxiliary forces in the Japanese Mandated Islands, Ryukyus, Bonins, and other Pacific Islands shall surrender to the Commander in Chief, U.S. Pacific Fleet.\n\ne.\n\nThe Imperial General Headquarters, its senior commanders, and all ground, sea, air and auxiliary forces in the main islands of Japan, minor islands adjacent thereto, Korea south of 38° north latitude, and the Philippines shall surrender to the Commander in Chief, U.S. Army Forces in the Pacific.\n\nThe Japanese Imperial General Headquarters further orders its commanders in Japan and abroad to disarm completely all forces of Japan or under Japanese control, wherever they may be situated, and to deliver intact and in safe and good condition all weapons and equipment at such time and at such places as may be prescribed by the Allied Commanders indicated above. (Pending further instructions, the Japanese police force in the main islands of Japan will be exempt from this disarmament provision. The police force will remain at their posts and shall be held responsible for the preservation of law and order. The strength and arms of such a police force will be prescribed.)\n\n(The remainder of the General Order No. 1 requires no change and should stand as written in SWNCC 21/5.)\n\n[660면]\n\n[Annex 2]\n\nEnclosure “B”\n\nDraft Message From the President to Prime Minister, Generalissimo Stalin and Generalissimo Chiang Kai-Shek\n\nWhile giving first priority to securing the Japanese homeland, the United States proposes to use its naval and air power to expedite the surrender of Japanese forces in the coastal areas of the Asiatic mainland in order to discourage continuation of local hostilities and to prevent malicious destruction and sabotage of harbor facilities. I have directed U.S. naval forces immediately to take control of the Yellow Sea and waters adjacent to Japan in the event of Japanese capitulation and have also directed U.S. forces to secure key ports now held by the Japanese on the Asiatic mainland. I am sending this message for the purpose of making clear that these operations are in order to exploit U.S. military capabilities to expedite the surrender, are for military purposes only, and will not prejudice the final peace settlement.", "notes": ["[주88] 1945년 8월 14일 SWNCC 21/7로 회람되었다. 수정된 일반명령 제1호는 그에 따라 트루먼 대통령의 승인을 받아 8월 17일 SWNCC 21/8로 회람되었다.", "[주89] 8월 11일자, 635면.", "[주90] 이 각서의 부속서 1로 인쇄되었다.", "[주91] 서울(Seoul)."], "note": "번역자 주 — 원문 오탈자 두 곳: 「und pursuant to」(=and), 「uny detailed arrangements」(=any). 문맥에 따라 옮겼다. 「Keijo」는 경성(현 서울)의 일본식 독음으로 원문 각주 91이 「Seoul」이라 밝히고 있어 원문 표기를 살려 京城으로 두고 각주를 붙였다. 조선 분할선(북위 38도)의 근거를 밝힌 문단이 이 문서의 핵심이다 — 제1항 b(38도 이북→소련)와 e(38도 이남→미육군)로 조선이 한 명령 안에서 갈린다. 「Netherlands Indies」는 네덜란드령 동인도(현 인도네시아)이나 원문 표기대로 「네덜란드령 인도」로 옮겼다. 「Paramushiro and Shumushu」는 쿠릴 북단의 파라무시르·슘슈 섬으로 원문 로마자 표기를 따랐다.", "warn": false, "pages": ["657", "658", "659", "660"], "search": "McFarland 맥팔런드(A. J. McFarland, 미육군 준장, 합동참모본부 간사) Mountbatten 마운트배튼(Louis Mountbatten, 동남아시아사령부 연합국최고사령관) Nimitz 니미츠(Chester W. Nimitz, 미태평양함대 총사령관) MacArthur 맥아더(Douglas MacArthur) Chiang Kai-shek 장제스 Stalin 스탈린 the Emperor 천황 the President 대통령 (트루먼Harry S. Truman)"}, {"id": "d438", "order": 438, "date": "1945-08-14", "group": "B", "eyebrow": "d438 · Memorandum by the State-War-Navy Coordinating Committee", "title": "국무·육군·해군 3부조정위원회(SWNCC)의 각서", "badge": null, "list_right": "문서 438", "meta": [{"k": "일자", "v": "1945-08-14"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "SWNCC 21 Series", "txt": true}, {"k": "발신", "v": "국무·육군·해군 3부조정위원회(SWNCC) — 대리간사 앨빈 F. 리처드슨", "txt": true}, {"k": "수신", "v": "합동참모본부 간사(Secretary, Joint Chiefs of Staff)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 438 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d438"}], "summary": "SWNCC 육군 측 위원이 일반명령 제1호 제1항 e 다음에 「명시된 사령관들만이 항복을 접수할 권한을 가진 유일한 연합국 대표」라는 문장을 삽입할 것을 제의하며 합동참모본부의 긴급 검토를 요청한 각서.", "points": ["제목: 일본의 항복을 위한 문서(Instruments for the surrender of Japan). 8월 14일자 합동참모본부 각서 SM-2866(=d437)에 대한 회신.", "SWNCC 육군 측 위원의 제의: 일반명령 제1호 제1항 e 다음에 다음 문장을 삽입할 것.", "「위에 명시된 사령관들이 항복을 접수할 권한을 부여받은 유일한 연합국 대표이며, 일본군의 모든 항복은 오직 그들 또는 그들이 지정한 대표에게만 행해진다.」", "이 문제를 긴급 사안으로 합동참모본부에 회부하고, 그 의견을 얻는 대로 SWNCC에 회송할 것을 요청.", "SWNCC 대리간사 앨빈 F. 리처드슨 명의."], "primary": "워싱턴, 1945년 8월 14일.\n\n합동참모본부 간사 앞 각서:\n\n제목: 일본의 항복을 위한 문서.\n\n1.\n\n위 제목에 관한 1945년 8월 14일자 귀 각서(SM–2866)를 참조함.\n\n2.\n\nSWNCC의 육군 측 위원은, 합동참모본부가 제의한 바에 따라 그에 첨부된 일반명령을 다음 문장을 제1항 e 다음에 삽입하는 방식으로 수정할 것을 제의한다:\n\n> \"위에 명시된 사령관들이 항복을 접수할 권한을 부여받은 유일한 연합국의 대표이며, 일본군의 모든 항복은 오직 그들 또는 그들이 지정한 대표에게만 행해진다(shall be made only to them or to their designated representatives).\"\n\n3.\n\n본건을 긴급 사안으로 합동참모본부에 상신하고, 그 의견을 얻는 대로 국무·육군·해군 3부조정위원회에 회송하여 줄 것을 요청함.\n\n국무·육군·해군 3부조정위원회를 위하여:\n\n앨빈 F. 리처드슨(Alvin F. Richardson)\n\nSWNCC 대리간사\n\n[661면]", "secondary": "Washington, 14 August, 1945.\n\nMemorandum for the Secretary, Joint Chiefs of Staff:\n\nSubject: Instruments for the surrender of Japan.\n\n1.\n\nReference is made to your memorandum on the above subject dated 14 August 1945. (SM–2866)\n\n2.\n\nThe Army member of the SWNCC proposes to amend the General Order attached thereto, as proposed by the Joint Chiefs of Staff, by inserting the following sentence after paragraph 1 e.:\n\n“The above indicated commanders are the only representatives of the Allied Powers empowered to accept surrender, and all surrenders of Japanese Forces shall be made only to them or to their designated representatives.[”]\n\n3.\n\nIt is requested that this matter be brought to the attention of the Joint Chiefs of Staff as a matter of urgency and that their comments, when obtained, be forwarded to the State-War-Navy Coordinating Committee.\n\nFor the State-War-Navy Coordinating Committee: \n\n\nAlvin F. Richardson\n\nActing Secretary, SWNCC\n\n[661면]", "notes": [], "note": "번역자 주 — 원문의 인용문은 여는 따옴표만 있고 닫는 따옴표가 편집자 보충 「[\"]」로 표기되어 있다 — 번역에서는 통상 따옴표로 닫았다. 항 번호 1./2./3. 이 원문에서 독립 행으로 놓여 있는 형식을 유지했다.", "warn": false, "pages": ["660", "661"], "search": "Richardson 리처드슨(Alvin F. Richardson, SWNCC 대리간사)"}, {"id": "d439", "order": 439, "date": "1945-08-14", "group": "B", "eyebrow": "d439 · The Australian Minister (Eggleston) to the Secretary of State", "title": "오스트레일리아 공사(에글스턴)가 국무장관에게", "badge": null, "list_right": "문서 439", "meta": [{"k": "일자", "v": "1945-08-14"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": null, "txt": true}, {"k": "발신", "v": "주미 오스트레일리아 공사 에글스턴(Eggleston)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 439 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d439"}], "summary": "오스트레일리아 정부가 「항복문서 초안」에 대한 구체적 수정 의견(포로 처우, 최고사령관의 우월적 권한 명시, 후속 포괄 항복문서 조항 추가, 전범 인도 등)을 전달하고, 휴전 발표 시각의 각국 동시화를 요청하다.", "points": ["전날 대화에서 일본의 장래 처우에 관한 오스트레일리아 정부의 견해를 담은 각서를 남긴 데 이어, 「항복문서 초안(draft act of surrender)」에 관한 본국 정부의 구체적 논평을 동봉한다.", "이 「항복문서 초안」은 아마도 트루먼 대통령이 1945년 8월 11일 일본의 항복 제의에 보낸 회답과 동일한 것으로 보인다.", "휴전이 선언될 경우 오스트레일리아와 관계 각국 수도에서의 발표를 동시화하도록 조치할 것을 요청하며, 미국 정부의 동의 여부를 긴급히 회신해 달라고 요청한다.", "제3항: 포로에 대한 책임은 처벌의 위협 아래 부과되어야 하며, 포로의 의료·급식 규정과 적 수송수단 사용 시 포로 이동 최우선, 1941년 12월 이후 억류된 모든 연합국 포로·민간인의 명부와 억류 장소, 포로 처우·사망 관련 문서의 인도를 요구해야 한다.", "제4항: 8월 10일 일본 각서에 대한 연합국 회답의 제1·2항을 감안하여 연합국최고사령관의 우월적 권한을 명시하고, 정부·대본영과 함께 천황도 명기해야 한다. 제5항도 같다.", "뒤에 포츠담선언을 포함한 대일 연합국 정책을 상세히 이행하는 더 포괄적인 문서가 있을 것임을 명확히 해야 하며, 제5항에 「이 군사적 항복문서는 뒤에 대일 교전 연합국이 부과하는 일반 항복문서에 저촉되지 않으며 그에 의하여 대체된다」는 취지의 문장을 추가하자고 제안한다.", "전범의 이의 없는 인도, 선박·항공기·산업설비·물자 재고 등을 연합국 처분에 맡길 것, 포로·억류자의 완전한 안전과 복지 보장, 일본 정부·대본영뿐 아니라 개별 일본군 지휘관의 완전한 책임에 관한 명시적 규정이 필요하다."], "primary": "워싱턴, 1945년 8월 14일.\n\n장관 각하: 어제 나눈 대화 — 그 자리에서 본인은 일본의 장래 처우 문제에 관한 오스트레일리아 정부의 견해를 담은 각서를 각하께 남겼습니다 — 에 이어, 본인은 「항복문서 초안(draft act of surrender)」이라고 기술된 바를 담은 런던발 대(對)오스트레일리아 통보의 조항에 관하여 본국 정부로부터 방금 받은 몇 가지 구체적 논평을 이에 동봉합니다. 짐작건대 이 「항복문서 초안」은 트루먼 대통령이 1945년 8월 11일 일본의 항복 제의에 보낸 회답과 동일한 것입니다. [주91a]\n\n본인은 또한 본국 정부로부터, 휴전이 선언될 경우 오스트레일리아 및 관계 각국 수도에서의 발표를 동시에 하도록 조치할 것을 요청하라는 훈령을 받았습니다. 본인은 미합중국 정부가 이 제안에 동의하는지 여부를 오스트레일리아에 긴급히 알리라는 요청을 받았습니다.\n\n삼가,\n\nF. W. 에글스턴\n\n[부속서]\n\n오스트레일리아 공사(에글스턴)가 국무장관에게\n\n[워싱턴,] 1945년 8월 14일.\n\n**런던에서 오스트레일리아에 통보된 항복문서 초안에 대한 오스트레일리아 정부의 논평**\n\n제3항. 오스트레일리아 정부는 이 책임이 처벌의 위협 아래(under pain of punishment) 부과되어야 한다고 본다. 포로의 의료 및 급식에 관한 구체적 규정이 마련되어야 하며, 적 수송수단의 사용에서 포로의 이동에 최우선 순위가 주어져야 한다는 것은 필수적이다. 1941년 12월 이후 억류된 모든 연합국 포로 및 민간인의 완전한 명부를 요구하여야 하며, 그 명부에는 억류 장소가 표시되어야 한다. 포로의 처우 또는 그 사망에 관한 모든 문서가 인도되어야 한다.\n\n제4항. 8월 10일자 일본 각서에 대한 연합국 회답의 제1항 및 제2항을 염두에 두고, 오스트레일리아 정부는 연합국최고사령관의 우월적 권한(overriding authority)이 명시되어야 하며, 정부 및 대본영과 나란히 천황이 명기되어야 한다고 본다. 제5항도 이와 같다. 뒤에 포츠담선언의 조항을 포함하여 대일 연합국 정책을 상세히 이행하는 [662면] 더 포괄적인 문서가 있을 것임이 명확히 되어야 한다. 따라서 오스트레일리아 정부는 제5항에 다음과 같은 취지의 문장을 추가할 것을 제안한다 — 「이 군사적 항복문서는 뒤에 대일 교전 연합국(United Nations)에 의하여 또는 그를 대신하여 부과되고 일본 제국 및 그 무장병력 전체에 적용되는 어떠한 일반 항복문서에도 저촉되지 아니하며, 그러한 문서에 의하여 대체된다.」\n\n아울러 전범을 이의 없이 인도할 것에 관한 구체적 요구가 있어야 한다. 선박, 항공기, 산업설비, 물자 재고 등이 연합국의 처분에 놓이도록 구체적으로 규정되어야 한다. 일본 수중에 있는 포로 및 억류자의 완전한 안전과 복지가 보장되어야 한다. 이와 관련하여, 일본 정부 및 대본영뿐 아니라 개별 일본군 지휘관들의 완전한 책임에 관하여 구체적 규정을 두는 것 또한 필수적이다.", "secondary": "Washington, 14 August, 1945.\n\nDear Mr. Secretary: Further to our conversation yesterday during which I left with you a memorandum setting out the views of the Australian Government on the subject of the future treatment of Japan, I enclose herewith certain specific comments, which I have just received from my Government, on the terms of a communication from London to Australia, setting out what is described as the “draft act of surrender”. Presumably the “draft act of surrender” is identical with the reply sent by President Truman on 11th August 1945 to the Japanese surrender offer. [주91a]\n\nI have also been instructed by my Government to request that in the event of an armistice being declared arrangements should be made to synchronize the announcement in Australia and the capitals of other countries concerned. I have been requested to advise Australia urgently whether the United States Government agrees to this proposal.\n\nYours sincerely,\n\nF. W. Eggleston\n\n[Enclosure]\n\nThe Australian Minister (Eggleston) to the Secretary of State\n\n[Washington,] 14 August, 1945.\n\nComments of Australian Government on Draft Act of Surrender Communicated to Australia from London\n\nParagraph 3. The Australian Government feels that this responsibility should be exacted under pain of punishment. It is essential that specific provision should be made for the medical care and feeding of prisoners and that first priority in the use of enemy transport should be given to the movement of prisoners. Full lists of all Allied prisoners and civilians taken into custody since December 1941 should be required, and these lists should indicate the place of their detention. All documents relating to the treatment of prisoners or their decease should be surrendered.\n\nParagraph 4. Having in mind points 1 and 2 of the Allied reply to the Japanese note of 10th of August, the Australian Government feels that the overriding authority of the Allied Supreme Commander should be made explicit and that the Emperor should be named along with the Government and General Headquarters. Similarly with paragraph 5. It should be made clear that subsequently there will be [662면] a more comprehensive instrument implementing in detail the Allied policy towards Japan, including the terms of the Potsdam Declaration. The Australian Government would, therefore, propose the addition to paragraph 5 of a sentence along the following lines—“This act of military surrender is without prejudice to and will be superseded by any subsequent general instrument of surrender imposed by or on behalf of the United Nations at war with Japan and applicable to the Japanese Empire and armed forces as a whole.”\n\nIn addition, there should be a specific requirement for the handing over of war criminals without dispute. Ships, aircraft, industrial equipment, commodity stocks, etc., should be put specifically at the disposal of the Allied Powers. The complete safety and well-being of prisoners of war and internees in Japanese hands should be ensured. In this connection it is also essential to make specific provision for the full responsibility not only of the Japanese Government and Imperial Headquarters but of individual Japanese Commanders.", "notes": ["[주91a] 국무장관이 스위스 대리대사에게 보낸 8월 11일자 각서, 631면 참조."], "note": "번역자 주 — 「United Nations」는 1945년 8월 시점에서 대일 교전 연합국을 뜻하므로 「연합국」으로 옮기고 원어를 병기했다. 「Imperial Headquarters / General Headquarters」는 일본 대본영을 가리키므로 「대본영」으로 옮겼다. 논평이 가리키는 「제3항·제4항·제5항」은 항복문서 초안의 항 번호이며 원문 그대로 두었다.", "warn": false, "pages": ["661", "662"], "search": "Eggleston 에글스턴(F. W. Eggleston) — 주미 오스트레일리아 공사 Truman 트루먼(Harry S. Truman) — 미국 대통령 Secretary of State 국무장관 — 번스(James F. Byrnes)"}, {"id": "d440", "order": 440, "date": "1945-08-14", "group": "B", "eyebrow": "d440 · The Swiss Chargé (Grässli) to the Secretary of State", "title": "스위스 대리대사(그레슬리)가 국무장관에게", "badge": null, "list_right": "문서 440", "meta": [{"k": "일자", "v": "1945-08-14"}, {"k": "시각", "v": "본문 안: 「오늘 20시 10분(스위스 시간)」에 주스위스 일본 공사가 스위스 정부에 서면 성명을 전달했다. 각서 자체의 시각 표기는 없음"}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": null, "txt": true}, {"k": "발신", "v": "스위스 대리대사 그레슬리(Grässli)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 440 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d440"}], "summary": "스위스 대리대사가 8월 14일 20시 10분(스위스 시간) 주스위스 일본 공사가 전달한 일본 정부의 최종 통고 — 천황이 포츠담선언 수락 조서를 내렸고 항복 문서 서명과 정전 명령을 보증할 준비가 되어 있다 — 를 미국에 전달한다.", "points": ["8월 11일자 미국 각서(4개국 회답)를 자국 정부에 전달해 달라는 요청에 대한 회신이다.", "오늘 20시 10분(스위스 시간) 주스위스 일본 공사가 4개 연합국 정부에 전달할 서면 성명을 스위스 정부에 건넸다.", "일본 정부의 8월 14일자 통보문 전문이 인용되어 있다 — 미국·영국·소련·중국 4개국 정부 앞.", "제1항: 천황이 포츠담선언 조항의 수락에 관한 조서(詔書)를 내렸다.", "제2항: 천황은 정부와 대본영이 포츠담선언 이행에 필요한 조건에 서명하도록 권한을 부여하고 이를 보증할 준비가 되어 있다.", "제2항 후단: 천황은 또한 소재를 불문하고 일본의 모든 육·해·공 당국과 그 지휘 아래 있는 모든 부대에 대하여 적극적 작전 행동을 중지하고 무기를 인도하며 연합군 최고사령관이 요구하는 그 밖의 명령을 발할 것을 명하는 칙명을 내릴 준비가 되어 있다.", "8월 10일자 일본 각서에 붙어 있던 「천황의 대권」 조건이 이 최종 통고에는 나타나지 않는다."], "primary": "워싱턴, 1945년 8월 14일.\n\n각하: 본인은 8월 11일자 귀하의 각서 — 본인의 8월 10일자 각서로 전달된 일본 정부의 통보에 대한 미합중국, 영국, 소비에트사회주의공화국연방 및 중국 정부의 회답을 본국 정부에 전달하여 줄 것을 본인에게 요청하신 — 를 언급하는 영예를 갖습니다.\n\n오늘 20시 10분(스위스 시간)에 주스위스 일본 공사가 4개 연합국 정부에 전달해 줄 것을 요청하며 다음의 서면 성명을 스위스 정부에 전하였습니다.[주92]\n\n「미합중국, 영국, 소련 및 중국 정부에 보내는 1945년 8월 14일자 일본 정부의 통보:\n\n「포츠담선언의 제 조항 수락에 관한 8월 10일자 일본 정부의 각서 및 그에 대하여 8월 11일자로 미국 국무장관 번스가 보낸 미합중국, 영국, 소련 및 중국 정부의 회답과 관련하여, 일본 정부는 4개국 정부에 다음과 같이 통보하는 영예를 갖는다.\n\n「1. 천황 폐하께서는 일본의 포츠담선언 제 조항 수락에 관한 조서(詔書)를 내리셨다.[주93]\n\n[663면]\n\n「2. 천황 폐하께서는 정부 및 대본영이 포츠담선언의 제 조항을 이행하는 데 필요한 조건에 서명하도록 권한을 부여하고 이를 보증할 준비가 되어 있으시다. 폐하께서는 또한, 그 소재를 불문하고 일본의 모든 육군·해군·항공 당국 및 그 통제 아래 있는 모든 부대에 대하여, 적극적 작전 행동을 중지하고 무기를 인도하며 위에 말한 조건의 실행을 위하여 연합군 최고사령관이 요구할 수 있는 그 밖의 명령을 발할 것을 명하는 칙명을 내리실 준비가 되어 있으시다.」\n\n경구 [등등]\n\n그레슬리", "secondary": "Washington, August 14, 1945.\n\nSir: I have the honor to refer to your note of August 11, in which you requested me to transmit to my Government the reply of the Governments of the United States, the United Kingdom, the Union of Soviet Socialist Republics, and China to the message from the Japanese Government which was communicated in my note of August 10.\n\nAt 20.10 today (Swiss Time) the Japanese Minister to Switzerland conveyed the following written statement to the Swiss Government for transmission to the four Allied governments: [주92]\n\n“Communication of the Japanese Government of August 14, 1945, addressed to the Governments of the United States, Great Britain, the Soviet Union, and China:\n\n“With reference to the Japanese Government’s note of August 10 regarding their acceptance of the provisions of the Potsdam declaration and the reply of the Governments of the United States, Great Britain, the Soviet Union, and China sent by American Secretary of State Byrnes under the date of August 11, the Japanese Government have the honor to communicate to the Governments of the four powers as follows:\n\n“1. His Majesty the Emperor has issued an Imperial rescript regarding Japan’s acceptance of the provisions of the Potsdam declaration. [주93]\n\n[663면]\n\n“2. His Majesty the Emperor is prepared to authorize and ensure the signature by his Government and the Imperial General Headquarters of the necessary terms for carrying out the provisions of the Potsdam declaration. His Majesty is also prepared to issue his commands to all the military, naval, and air authorities of Japan and all the forces under their control wherever located to cease active operations, to surrender arms and to issue such other orders as may be required by the Supreme Commander of the Allied Forces for the execution of the above-mentioned terms.”\n\nAccept [etc.]\n\nGrässli", "notes": ["[주92] 이 본문은 주스위스 공사도 그의 8월 14일자 전보 3891호로 보고하였다 (740.00119 P.W./8–1445).", "[주93] 8월 15일 정오(일본 시간)에 방송된 조서의 본문은 New York Times, 1945년 8월 15일자를 보라."], "note": "번역자 주 — 일본의 최종 수락 통고다. 8월 10일자 제의에 붙어 있던 「천황의 대권을 침해하는 요구를 포함하지 않는다는 양해 아래」라는 조건절이 이 문서에는 나타나지 않는다는 점이 중요하다. 「Imperial rescript」는 조서(詔書), 「his commands」는 칙명으로 옮겼다. 「Supreme Commander of the Allied Forces」는 원문 표기대로 「연합군 최고사령관」으로 옮겼다(d418의 Supreme Commander for the Allied Powers와 원문 표기가 다르다). 「is prepared to」는 「~할 준비가 되어 있다」로 직역했다.", "warn": false, "pages": ["662", "663"], "search": "Grässli 그레슬리 — 주미 스위스 대리대사 James F. Byrnes 번스 — 미국 국무장관 Shunichi Kase 가세 슌이치 — 주스위스 일본 공사(본문에는 「주스위스 일본 공사」로만 나옴) 히로히토 천황(본문에는 「His Majesty the Emperor」로만 나옴)"}, {"id": "d441", "order": 441, "date": "1945-08-14", "group": "B", "eyebrow": "d441 · The Secretary of State to the Swiss Chargé (Grässli)", "title": "국무장관이 스위스 대리대사(그레슬리)에게", "badge": null, "list_right": "문서 441", "meta": [{"k": "일자", "v": "1945-08-14"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 PW/8–1445", "txt": true}, {"k": "발신", "v": "국무장관 번스(James F. Byrnes)", "txt": true}, {"k": "수신", "v": "스위스 대리대사 그레슬리(Grässli)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 441 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d441"}], "summary": "일본 정부의 회답을 포츠담 선언 및 8월 11일자 성명의 완전한 수락으로 간주하고, 대통령의 지시에 따라 적대행위의 즉각 중지, 최고사령관에게 사절 파견, 맥아더 원수를 연합국최고사령관으로 지명한 사실을 일본 정부에 전달하도록 한다.", "points": ["스위스 측이 오늘 날짜로 전달한 일본 정부의 회답 — 8월 11일 미국·중국·영국·소련 4개국 정부를 대신하여 보낸 통첩에 대한 회답 — 을 포츠담 선언 및 1945년 8월 11일자 본인 성명의 완전한 수락(full acceptance)으로 간주한다.", "대통령이 다음 전언을 일본 정부에 전달하도록 지시하였다.", "(1) 일본군의 적대행위를 즉시 중지하도록 지시하고, 그 중지의 발효 일자와 시각을 연합국최고사령관에게 통보할 것.", "(2) 즉시 연합국최고사령관에게 사절을 보내되, 일본군 부대와 지휘관의 배치에 관한 정보를 지참하게 하고, 최고사령관과 그 수행 부대가 정식 항복을 받기 위하여 지정하는 장소에 도착할 수 있도록 최고사령관이 지시하는 어떠한 조치라도 취할 완전한 권한을 부여할 것.", "(3) 그 항복을 받고 이를 실행에 옮기기 위하여 육군원수 더글러스 맥아더 장군이 연합국최고사령관으로 지명되었으며, 그가 정식 항복의 시각·장소 및 그 밖의 세부 사항을 일본 정부에 통고할 것이다."], "primary": "워싱턴, 1945년 8월 14일.\n\n각하: 오늘 날짜의 귀하의 통첩 — 본인이 미합중국·중국·영국 및 소비에트사회주의공화국연방 각 정부를 대신하여 8월 11일 귀하를 통하여 일본국 정부에 보낸 통첩에 대한 일본국 정부의 회답을 전달한 것 — 과 관련하여, 본인은 이를 포츠담 선언 및 1945년 8월 11일자 본인 성명의 완전한 수락으로 간주하는바, 미합중국 대통령이 다음 전언을 귀하에게 보내어 일본국 정부에 전달하도록 지시하였음을 알리는 영광을 가집니다.\n\n「귀하는 다음과 같이 진행하여야 한다.\n\n「(1) 일본군에 의한 적대행위를 즉시 중지하도록 지시하고, 그 중지의 발효 일자와 시각을 연합국최고사령관에게 통보할 것.\n\n「(2) 즉시 연합국최고사령관에게 사절을 보내되, 일본군 부대와 지휘관의 배치에 관한 정보를 지참하게 하고, 또한 최고사령관과 그를 수행하는 부대가 정식 항복을 받기 위하여 최고사령관이 지정하는 장소에 도착할 수 있도록 최고사령관이 지시하는 어떠한 조치라도 취할 완전한 권한을 부여할 것.\n\n「(3) 그러한 항복을 받고 이를 실행에 옮기기 위하여, 육군원수 더글러스 맥아더 장군(General of the Army Douglas MacArthur)이 연합국최고사령관으로 지명되었으며, 그가 정식 항복의 시각·장소 및 그 밖의 세부 사항을 일본국 정부에 통고할 것이다.」\n\n경구 [이하 인사말]\n\n[\n\n제임스 F. 번스\n\n]", "secondary": "Washington, August 14, 1945.\n\nSir: With reference to your communication of today’s date, transmitting the reply of the Japanese Government to the communication which I sent through you to the Japanese Government on August 11, on behalf of the Governments of the United States, China, the United Kingdom, and the Union of Soviet Socialist Republics, which I regard as full acceptance of the Potsdam Declaration and of my statement of August 11, 1945, I have the honor to inform you that the President of the United States has directed that the following message be sent to you for transmission to the Japanese Government:\n\n“You are to proceed as follows:\n\n“(1) Direct prompt cessation of hostilities by Japanese forces, informing the Supreme Commander for the Allied Powers of the effective date and hour of such cessation.\n\n“(2) Send emissaries at once to the Supreme Commander for the Allied Powers with information of the disposition of the Japanese forces and commanders, and fully empowered to make any arrangements directed by the Supreme Commander for the Allied Powers to enable him and his accompanying forces to arrive at the place designated by him to receive the formal surrender.\n\n“(3) For the purpose of receiving such surrender and carrying it into effect, General of the Army Douglas MacArthur has been designated as the Supreme Commander for the Allied Powers, and he will notify the Japanese Government of the time, place and other details of the formal surrender.”\n\nAccept [etc.]\n\n[\n\nJames F. Byrnes\n\n]", "notes": [], "note": "번역자 주 — 「my statement of August 11, 1945」는 d412의 연합국 회답을 가리킨다. 「Supreme Commander for the Allied Powers」는 연합국최고사령관(SCAP)으로 옮겼다. 「Accept [etc.]」는 외교 서한의 정형 결구를 FRUS가 생략한 것이다. 「You are to proceed as follows」의 「You」는 일본국 정부를 가리킨다.", "warn": false, "pages": ["663"], "search": "James F. Byrnes 제임스 F. 번스 — 국무장관 Max Grässli 그레슬리 — 스위스 대리대사 Douglas MacArthur 더글러스 맥아더 — 육군원수, 연합국최고사령관으로 지명됨 Harry S. Truman 트루먼 — 미합중국 대통령 (본문에서는 「미합중국 대통령」으로만 지칭)"}, {"id": "d442", "order": 442, "date": "1945-08-14", "group": "A", "eyebrow": "d442 · The Secretary of State to All Diplomatic Missions", "title": "국무장관이 전 재외공관에게", "badge": null, "list_right": "문서 442", "meta": [{"k": "일자", "v": "1945-08-14"}, {"k": "시각", "v": "발신 1945년 8월 14일 오후 8시(워싱턴)"}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": null, "txt": true}, {"k": "발신", "v": "국무장관 번스(Byrnes)", "txt": true}, {"k": "수신", "v": "전 재외공관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 442 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d442"}], "summary": "일본 항복 발표 즉시 4개국을 대표하여 주재국 외무부와 이익보호국에 일본 문서고·재산의 보관을 요구하라는 회람 훈령이다.", "points": ["일본의 항복이 발표되는 즉시 행동하라 — 미국·영국·소련·중국을 대표하여.", "교전국에서는 주재국 외무부와 이익보호국에 대하여, 파기되기 전에 일본 문서고와 재산의 보관을 요구하라.", "주재지에 영국·소련·중국 동료가 있으면 이 요구에 함께 참여해 줄 것을 요청하라.", "국무부는 영국·소련·중국 정부에 각기 자국 외교대표에게 상응하는 훈령을 내리도록 요청하고 있다.", "항복하면 일본 정부는 중립국 주재 자국 공관에 외교·영사 재산과 문서고를 연합국의 보관에 넘기도록 명하라는 지시를 받게 된다.", "일본 정부는 또한 교전국에서 자국 이익을 보호하는 정부들에 대하여 재산과 문서고를 넘길 권한을 부여하라는 지시도 받게 된다.", "발신 시각은 8월 14일 오후 8시이며, 각주의 관련 전보 3통(6910, 1835, 1258)도 같은 8월 14일 오후 8시 발신이다."], "primary": "워싱턴, 1945년 8월 14일 오후 8시.\n\n일본의 항복이 발표되는 즉시, 귀하는 미합중국, 영국, 소련 및 중국을 대표하여 [664면] 교전국에서는 주재국 외무부 및 이익보호국에 대하여 일본의 문서고와 재산이 파기되기 전에 그 보관을 요구하여야 한다. 귀하는 주재지에 영국, 러시아 및 중국 동료가 있는 경우 그들이 이 요구에 함께 참여하여 줄 것을 요청하여야 한다.\n\n국무부는 영국, 러시아 및 중국 정부에 대하여 각기 자국 외교대표에게 상응하는 훈령을 내려 줄 것을 요청하는 연락을 취하고 있다.[주94]\n\n항복이 이루어지면 일본 정부는 중립국 주재 자국 공관에 대하여 외교 및 영사 재산과 문서고를 연합국의 보관에 넘기도록 명하라는 지시를 받게 된다. 일본 정부는 또한 자국의 이익을 보호하는 정부들에 대하여 교전국에 있는 재산과 문서고를 넘길 권한을 부여하도록 지시받게 된다.\n\n번스", "secondary": "Washington, August 14, 1945—8 p.m.\n\nImmediately upon announcement of Japanese surrender you should, on behalf of United States, Great Britain, Soviet Union and China, [664면] request of FonOff and protecting power in belligerent countries custody of Japanese archives and property before they can be destroyed. You should request your British, Russian and Chinese colleagues where present to associate themselves with this request.\n\nDepartment is communicating with British, Russian and Chinese Governments [주94] requesting them to issue appropriate instructions to their diplomatic representatives.\n\nUpon surrender the Japanese Government will be instructed to order its missions in neutral countries to relinquish diplomatic and consular property and archives to custody of Allied powers. Japanese Government will be instructed also to authorize governments protecting its interests to relinquish property and archives in belligerent countries.\n\nByrnes", "notes": ["[주94] 8월 14일 오후 8시자 전보 6910호, 1835호 및 1258호(각각 영국·소련·중국 앞). 모두 미수록."], "note": "번역자 주 — 회람 전보이므로 수신인이 「전 재외공관」이며 본문의 「you」는 각 공관장을 가리킨다. 「protecting power」는 「이익보호국」, 「custody」는 「보관」으로 옮겼다. 「should」(~하여야 한다)와 「will be instructed」(지시를 받게 된다)의 어조 차이를 규칙 3에 따라 구분했다. 각주의 「respectively」는 본문에 열거된 영국·러시아·중국 정부 순서에 세 전보 번호가 각각 대응한다는 뜻이므로 그대로 옮겼다.", "warn": false, "pages": ["663", "664"], "search": "James F. Byrnes 번스 — 미국 국무장관"}, {"id": "d443", "order": 443, "date": "1945-08-14", "group": "A", "eyebrow": "d443 · The Secretary of State to the Minister in Switzerland (Harrison)  Repeated to Chungking, Moscow, and London as telegrams 1259, 1836, and 6912, respectively.", "title": "국무장관이 주스위스 공사(해리슨)에게", "badge": null, "list_right": "문서 443", "meta": [{"k": "일자", "v": "1945-08-14"}, {"k": "시각", "v": "Washington, August 14, 1945—8 p.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "2535"}, {"k": "원문출처", "v": "충칭·모스크바·런던에 각각 전보 제1259호·제1836호·제6912호로 재송(再送)했다. [주95]", "txt": true}, {"k": "발신", "v": "국무장관 번스(James F. Byrnes)", "txt": true}, {"k": "수신", "v": "주스위스 공사 해리슨(Harrison)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 443 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d443"}], "summary": "일본 정부가 중립국 주재 외교·영사 공관의 재산과 문서 일체를 연합국 대표에게 인도하고, 교전국에서도 일본 이익 보호국이 이를 연합국에 넘기도록 권한을 주게 하라고 스위스를 통해 통보하라는 훈령.", "points": ["일본 문서(archives)에 관한 국무부 회람전보 참조.", "스위스에 다음을 일본 정부에 전달하도록 요청할 것.", "「일본 정부는 중립국에 있는 자국 외교·영사 공관에 대하여 모든 재산과 문서의 보관을 연합국 대표에게 인도하도록 즉시 훈령한다.」", "「일본 정부는 마찬가지로 자국 이익을 보호하는 해당 정부가 교전국에 있는 외교·영사 재산과 문서를 연합국의 보관으로 넘기도록 권한을 부여한다.」", "이 전보는 충칭·모스크바·런던에도 각각 제1259호·제1836호·제6912호로 재송되었다."], "primary": "워싱턴, 1945년 8월 14일 — 오후 8시.\n\n2535. 일본 문서(archives)에 관한 국무부 회람전보[주96]를 볼 것. 스위스에 대하여 다음을 일본 정부에 전달하도록 요청하라.\n\n「일본 정부는 중립국에 있는 자국의 외교 및 영사 공관에 대하여, 모든 재산과 문서의 보관을 연합국 대표에게 인도하도록 즉시 훈령한다.\n\n일본 정부는 마찬가지로, 자국의 이익을 보호하는 해당 정부가 교전국에 있는 외교 및 영사 재산과 문서를 연합국의 보관으로 넘기도록 권한을 부여한다.」\n\n번스", "secondary": "Washington, August 14, 1945—8 p.m.\n\n2535. See Dept’s cirtel concerning Japanese archives. [주96] Request Swiss to communicate following to the Japanese Govt:\n\n“The Japanese Govt will immediately instruct its diplomatic and consular offices in neutral countries to surrender custody of all property and archives to representatives of Allied powers.\n\nThe Japanese Govt will likewise authorize the appropriate government protecting its interests to relinquish diplomatic and consular property and archives to the custody of Allied powers in belligerent countries.”\n\nByrnes", "notes": ["[주95] 충칭·모스크바·런던에 각각 전보 제1259호·제1836호·제6912호로 재송했다.", "[주96] 바로 앞 문서."], "note": "번역자 주 — 발신 시각 오후 8시를 살렸다. 인용부호 안의 두 문장은 일본 정부에 전달될 문언이며, 원문의 'will instruct'·'will likewise authorize'를 그대로 「즉시 훈령한다」·「권한을 부여한다」로 옮겼다(요구의 문언이지만 원문이 미래·단정형이므로 뭉개지 않았다). 'archives'는 외교공관의 기록·문서철을 가리키므로 「문서」로 옮기되 첫 등장에 원어를 병기했다. 'cirtel'은 circular telegram(회람전보)의 약어다.", "warn": false, "pages": ["664"], "search": "Byrnes 번스(James F. Byrnes) — 국무장관, 발신자 Harrison 해리슨(Leland Harrison) — 주스위스 공사, 수신자"}, {"id": "d444", "order": 444, "date": "1945-08-15", "group": "A", "eyebrow": "d444 · The Secretary of State to the Chargé in Australia (Minter)", "title": "국무장관이 주오스트레일리아 대리대사(민터)에게", "badge": null, "list_right": "문서 444", "meta": [{"k": "일자", "v": "1945-08-15"}, {"k": "시각", "v": "오후 2시 (August 15, 1945—2 p.m.)"}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "81"}, {"k": "원문출처", "v": "740.00119 PW/8–1445: Telegram", "txt": true}, {"k": "발신", "v": "국무장관 번스(Byrnes)", "txt": true}, {"k": "수신", "v": "주오스트레일리아 대리대사 민터(Minter)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 444 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d444"}], "summary": "버마·타이·말라야·보르네오·네덜란드령 인도·뉴기니·비스마르크 제도·솔로몬 제도의 일본군은 동남아시아사령부 최고사령관 또는 오스트레일리아군 사령부에 항복하게 되어 있음을 자치령 정부에 알리고, 오스트레일리아군 사령부가 항복을 받을 구체적 지역에 관하여 마운트배튼 경과 협의할 것을 권하라고 지시한다.", "points": ["전보번호 81. 워싱턴 8월 15일 오후 2시 발신.", "정해진 항복 계획(the plan of surrender which has been arranged)을 자치령 정부(오스트레일리아 정부)에 알릴 것.", "버마, 타이, 말라야, 보르네오, 네덜란드령 인도, 뉴기니, 비스마르크 제도 및 솔로몬 제도의 일본군은 동남아시아사령부 최고사령관 또는 오스트레일리아군 사령부에 항복하게 되어 있다.", "오스트레일리아군 사령부가 항복을 받을 구체적 지역에 관한 조정을 위하여 마운트배튼 경과 협의하기를 바랄 수도 있다는 점을 시사할 것."], "primary": "워싱턴, 1945년 8월 15일 오후 2시.\n\n81. 귀관은 자치령 정부에 다음을 알려야 한다. 즉 정해진 항복 계획에 따라, 버마·타이·말라야·보르네오·네덜란드령 인도·뉴기니·비스마르크 제도 및 솔로몬 제도의 일본군은 동남아시아사령부 최고사령관(the Supreme Commander, Southeast Asia Command) 또는 오스트레일리아군 사령부(the Australian Command)에 항복하게 되어 있다는 것이다. 그리고 오스트레일리아군 사령부가 항복을 받을 구체적 지역에 관한 조정을 위하여 자치령 정부가 마운트배튼 경(Lord Mountbatten)과 협의하기를 바랄 수도 있음을 시사하라.\n\n번스\n\n[665면]", "secondary": "Washington, August 15, 1945—2 p.m.\n\n81. You should inform the Dominion Government that under the plan of surrender which has been arranged, the Japanese troops in Burma, Thailand, Malaya, Borneo, Netherlands Indies, New Guinea, the Bismarcks, and Solomons are to surrender to the Supreme Commander, Southeast Asia Command, or to the Australian Command, and suggest that it may wish to consult with Lord Mountbatten with a view to arrangements as to the specific areas where the Australian Command will accept the surrender.\n\nByrnes\n\n[665면]", "notes": [], "note": "번역자 주 — 「the Dominion Government」는 영연방 자치령인 오스트레일리아 정부를 가리킨다. 「Netherlands Indies」는 네덜란드령 동인도(현 인도네시아)이나 원문 표기를 따라 「네덜란드령 인도」로 옮겼다. 이 지역 배분은 일반명령 제1호의 항복 수리 구분과 짝을 이룬다.", "warn": false, "pages": ["664", "665"], "search": "James F. Byrnes 번스 — 국무장관 John Minter 민터 — 주오스트레일리아 미국 대리대사 Lord Louis Mountbatten 마운트배튼 경 — 동남아시아사령부 최고사령관"}, {"id": "d445", "order": 445, "date": "1945-08-15", "group": "A", "eyebrow": "d445 · The Secretary of State to the Ambassador in the United Kingdom (Winant)  Identic telegrams were sent to Chungking and Moscow as Nos. 1262 and 1838, respectively.", "title": "국무장관이 주영대사(위넌트)에게", "badge": "극비(top secret) — 전달 시 극비 문서로 취급하라는 지시", "list_right": "문서 445", "meta": [{"k": "일자", "v": "1945-08-15"}, {"k": "시각", "v": "1945년 8월 15일 오후 4시 발신 (Washington, August 15, 1945—4 p.m.)"}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "6926"}, {"k": "원문출처", "v": "740.00119 P.W./8–1545: Telegram", "txt": true}, {"k": "발신", "v": "국무장관 번스(James F. Byrnes)", "txt": true}, {"k": "수신", "v": "주영대사 위넌트(John G. Winant)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 445 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d445"}], "summary": "대통령이 맥아더 장군에게 하달한 지령과 그 두 부속서의 본문을 주재국 정부에 극비 문서로 통보하라는 지시.", "points": ["8월 15일 오후 4시 발신, 전보 제6926호.", "대통령이 맥아더 장군에게 지령과 두 개의 부속서(annexes)를 하달했다.", "그 지령과 부속서의 본문을 주재국 정부에 「정보로서」, 「극비 문서로」 통보할 것.", "원문에는 여기서 8월 13일자 세 문서(647·648·649면)의 본문이 이어진다는 편집자 주가 들어 있다.", "[주97] 충칭과 모스크바에도 각각 제1262호, 제1838호로 동일한 전보가 발송되었다."], "primary": "워싱턴, 1945년 8월 15일 오후 4시\n\n6926. 대통령이 맥아더 장군에게 아래에 인용하는 지령을 그 두 개의 부속서와 함께 하달하였다. 이 지령 및 부속서의 본문을 귀하가 신임된 정부에 정보로서, 극비 문서로 통보하기 바람.\n\n[여기에 8월 13일자 세 문서의 본문이 이어진다. 647면, 648면, 649면에 수록됨.]\n\n번스(Byrnes)", "secondary": "Washington, August 15, 1945—4 p.m.\n\n6926. The President has issued to General MacArthur the directive hereafter quoted with its two annexes. Please convey the text of this directive and annexes to the Government to which you are accredited for its information as top secret documents.\n\n[Here follow texts of three documents of August 13, printed on pages 647, 648, and 649.]\n\nByrnes", "notes": ["[주97] 충칭과 모스크바에도 각각 제1262호 및 제1838호로 동문(同文) 전보가 발송되었다."], "note": "번역자 주 — 본문 가운데 대괄호 부분은 FRUS 편집자의 삽입주로, 실제 지령·부속서 본문은 이 문서가 아니라 647~649면의 별도 문서들에 인쇄되어 있다. 원문에 본문이 없으므로 옮길 내용도 없다.", "warn": false, "pages": ["665"], "search": "Byrnes 번스(James F. Byrnes, 국무장관) Winant 위넌트(John G. Winant, 주영대사) MacArthur 맥아더(Douglas MacArthur) the President 대통령 (트루먼Harry S. Truman)"}, {"id": "d446", "order": 446, "date": "1945-08-15", "group": "A", "eyebrow": "d446 · The Ambassador in the Soviet Union (Harriman) to the Secretary of State", "title": "주소련 대사(해리먼)가 국무장관에게", "badge": null, "list_right": "문서 446", "meta": [{"k": "일자", "v": "1945-08-15"}, {"k": "시각", "v": "본문 안: 「몰로토프가 오늘 저녁 나를 불렀다」 — 1945년 8월 15일 저녁(모스크바). 발신·접수 시각 표기는 없음"}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": "M25313"}, {"k": "원문출처", "v": null, "txt": true}, {"k": "발신", "v": "주소련 대사 해리먼(Harriman)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 446 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d446"}], "summary": "몰로토프가 8월 15일 저녁 해리먼을 불러, 천황의 조서에 실제 정전·항복 명령이 없으니 명령이 담긴 조서를 즉시 내리게 할 긴급 조치가 필요하다는 소련 정부의 성명을 읽어 주었다.", "points": ["몰로토프가 오늘 저녁 해리먼을 불러 소련 정부의 성명을 읽어 주었다.", "성명: 8월 14일자 일본 정부 선언에는 천황이 소재를 불문하고 모든 육·해·공 당국과 그 관할 부대에 작전 중지와 무기 인도를 명할 준비가 되어 있다고 되어 있다.", "그러나 8월 15일 정오에 공표된 천황의 조서에는 그러한 명령이 담겨 있지 않으며 일반적 성격의 선언에 지나지 않는다.", "소련 정부는, 소련군을 포함한 연합군에 대한 적대행위 중지·항복·무기 인도를 모든 일본군에 명하는 조서를 천황이 즉시 내리도록 긴급 조치를 취할 필요가 있다고 본다.", "소련 정부는 그 항복 명령이 언제 발해지는지, 일본 항복 문서 서명이 언제인지를 미국 정부로부터 통보받기를 기다린다.", "해리먼은 스위스 정부를 통한 미국 회답의 요지를 받았다고 알리고, 8월 14일자 마셜→맥아더 평문 육군전보 1409호의 내용을 전했다.", "해리먼은 일본의 수락 때와 마찬가지로 이 회답이 일본에 도달하기까지 시간이 걸릴 수 있다고 말했다.", "딘 소장이 안토노프 대장에게 8월 15일자 맥아더 전보(맥아더 번호 0500)의 도쿄 중계를 서면으로 요청했음을 설명하고 그 요지를 전했다.", "몰로토프가 현재까지 실제 항복이 있었는지 묻자 해리먼은 아직 아무 정보도 받지 못했다고 답했다.", "해리먼은 몰로토프에게 전달할 수 있도록 모든 진전 상황을 이날 중 육군 통신선을 통해 긴급히 알려 달라고 요청한다."], "primary": "모스크바, 1945년 8
