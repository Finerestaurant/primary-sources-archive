badge": null, "list_right": "문서 418", "meta": [{"k": "일자", "v": "1945-08-11"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "SWNCC 21/5", "txt": true}, {"k": "발신", "v": "국무·육군·해군 3부조정위원회(SWNCC)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "명령 초안"}], "links": [{"k": "FRUS", "text": "문서 418 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d418"}], "summary": "일본 대본영이 천황의 명에 따라 전 일본군에 적대행위 중지와 무장해제를 명하는 일반명령 제1호의 수정안으로, 제1항 a~g에서 지역별로 어느 연합군 사령관에게 항복할지를 정하며 조선을 북위 38도선에서 둘로 나눈다.", "points": ["SWNCC 21/5. 표제는 「군·해군 관계(Military and Naval)」이며 제1항부터 제12항까지로 되어 있다.", "제1항: 대본영이 천황의 명에 따라, 그리고 천황이 전 일본군을 연합국최고사령관에게 항복시킨 데 따라, 국내외 모든 지휘관에게 즉시 적대행위를 중지하고 무기를 놓으며 현 위치에 머물러 아래에 지정된 사령관에게 무조건 항복할 것을 명한다.", "1.a. 중국(만주·타이완·북위 16도 이북 프랑스령 인도차이나 제외) — 장제스 총통.", "1.b. 만주, 북위 38도 이북의 조선, 가라후토 — 극동 소련군 총사령관.", "1.c. 타이·버마·말라야·북위 16도 이남 인도차이나·수마트라·자바·안다만·니코바르·보르네오·소순다 — 동남아시아사령부 연합군최고사령관.", "1.d. 셀레베스·할마헤라·뉴기니·반다해 지역·비스마르크·솔로몬 — 오스트레일리아 제국군 총사령관.", "1.e. 일본 위임통치 제도(諸島)·오가사와라 및 그 밖의 태평양 제도 — 미 태평양함대 총사령관.", "1.f. 북위 38도 이남의 조선 — 주조선 미국 원정군 사령관.", "1.g. 일본 본토 4개 섬과 인접 소도, 류큐, 필리핀 및 대본영 자체 — 미 태평양육군 총사령관.", "한 문서 안에서 조선이 b(38도 이북·소련)와 f(38도 이남·미국)로 갈린다.", "제1항 말미: 완전 무장해제와 무기·장비의 온전한 인도를 명하되, 추후 지시가 있을 때까지 일본 본토의 경찰력은 무장해제 규정에서 제외되며 치안 유지 책임을 진다.", "제2항: 대본영은 이 명령 접수 후 (기한 미정) 이내에 육·공·대공 부대 목록, 항공기, 함정, 100총톤 초과 상선, 기뢰·기뢰원 지도, 군사시설, 연합국 포로·민간인 억류소 위치 등을 제출한다.", "제3~5항: 모든 항공기의 지상·수상·선상 대기, 함선·상선의 무손상 유지와 이동 금지 및 폭발물 처리, 기뢰 제거·항로표지 복구·안전항로 유지.", "제6~8항: 무기·탄약·군수물자, 운수·통신 시설, 군사시설, 공장·연구소·기술자료·특허의 온전한 보존과 목록 제출, 무기·탄약 제조 및 배포의 즉시 중지.", "제9항: 연합국 포로와 민간인 억류자의 안전과 후생 보전, 수용소의 즉시 인도, 안전지대로의 수송, 명단 제출.", "제10~12항: 연합국의 일본 및 일본 통제 지역 점령 지원, 민간인 소지 무기의 수집·인도 준비, 최고사령관 지시의 엄정·신속한 준수와 불이행 시의 가혹하고 즉결적인 처벌.", "제2·7·9항 d의 제출 기한은 「(time limit)」로 비워져 있는 미확정 초안이다."], "primary": "SWNCC 21/5\n\n[워싱턴, 1945년 8월 11일.]\n\n군·해군 관계(Military and Naval)\n\n**I.**\n\n대본영(大本營)은 천황의 명에 따라, 그리고 천황에 의한 전 일본 무장 병력의 연합국최고사령관(SCAP)에 대한 항복에 좇아, 이로써 일본 국내 및 국외에 있는 그 모든 지휘관에게, 그 지휘 아래 있는 일본 무장 병력 및 일본이 통제하는 병력으로 하여금 즉시 적대행위를 중지하고, 무기를 놓고, 현재의 위치에 머무르며, 이하에 지정하는 바에 따라 미합중국, 중화민국, 영국 및 대영제국, 소비에트사회주의공화국연방을 대표하여 행동하는 사령관들에게 무조건 항복할 것을 명한다. 지정된 사령관들 또는 그들이 지명한 대표들과 즉시 접촉하며, 그들의 지시는 완전하고 즉시 이행된다. [636면]\n\n**a.**\n\n만주, 타이완(Formosa) 및 북위 16도 이북의 프랑스령 인도차이나를 제외한 중국 내에 있는 일본군 선임 지휘관 및 모든 지상·해상·항공 및 보조 병력은 장제스 총통(Generalissimo Chiang Kai-shek)에게 항복한다.\n\n**b.**\n\n만주, 북위 38도 이북의 조선(Korea) 및 가라후토(Karafuto, 남사할린) 내에 있는 일본군 선임 지휘관 및 모든 지상·해상·항공 및 보조 병력은 극동 소련군 총사령관에게 항복한다.\n\n**c.**\n\n타이, 버마, 말라야, 북위 16도 이남의 프랑스령 인도차이나, 수마트라, 자바, 안다만 제도, 니코바르 제도, 보르네오 및 소순다 열도 내에 있는 일본군 선임 지휘관 및 모든 지상·해상·항공 및 보조 병력은 동남아시아사령부 연합군최고사령관에게 항복한다.\n\n**d.**\n\n셀레베스, 할마헤라, 뉴기니, 반다해(海) 지역, 비스마르크 제도 및 솔로몬 제도에 있는 일본군 선임 지휘관 및 모든 지상·해상·항공 및 보조 병력은 오스트레일리아 제국군 총사령관에게 항복한다.\n\n**e.**\n\n일본 위임통치 제도(諸島), 오가사와라 제도(Bonins) 및 그 밖의 태평양 제도에 있는 일본군 선임 지휘관 및 모든 지상·해상·항공 및 보조 병력은 미 태평양함대 총사령관에게 항복한다.\n\n**f.**\n\n북위 38도 이남의 조선(Korea)에 있는 일본군 선임 지휘관 및 모든 지상·해상·항공 및 보조 병력은 주조선 미국 원정군 사령관에게 항복한다.\n\n**g.**\n\n대본영, 그 선임 지휘관들, 그리고 일본 본토의 주요 섬들과 그에 인접한 작은 섬들, 류큐 열도 및 필리핀에 있는 모든 지상·해상·항공 및 보조 병력은 미 태평양육군 총사령관에게 항복한다.\n\n일본 대본영은 나아가 국내 및 국외에 있는 그 지휘관들에게, 소재를 불문하고 일본군 또는 일본의 통제 아래 있는 모든 병력을 완전히 무장해제하고, 위에 지정된 연합군 사령관들이 정하는 시기와 장소에서 모든 무기와 장비를 온전하고 안전하며 양호한 상태로 인도할 것을 명한다. (추후 지시가 있을 때까지 일본 본토의 경찰력은 이 무장해제 규정에서 제외된다. 경찰력은 그 자리에 머물며 법과 질서의 유지에 책임을 진다. 그러한 경찰력의 규모와 무장은 별도로 정한다.)\n\n**II.**\n\n일본 대본영은 이 명령을 접수한 때로부터 (기한) 이내에 연합국최고사령관에게 일본 및 일본의 통제 아래 있는 모든 지역에 관하여 다음의 완전한 정보를 제공한다.\n\n**a.**\n\n모든 지상·항공 및 대공 부대의 목록. 위치와 장교·병사 병력 수를 표시할 것.\n\n**b.**\n\n군용·해군용·민간용을 막론한 모든 항공기의 목록. 그 수, 형식, 위치 및 상태에 관한 완전한 정보를 기재할 것.\n\n[637면] **c.**\n\n취역 중이거나 퇴역 중이거나 건조 중인, 수상·잠수 및 보조 함정을 포함한 모든 일본 및 일본 통제 하 해군 함정의 목록. 그 위치, 상태 및 이동을 기재할 것.\n\n**d.**\n\n취역 중이거나 퇴역 중이거나 건조 중인, 100총톤을 넘는 모든 일본 및 일본 통제 하 상선의 목록. 현재 일본의 수중에 있는, 본래 국제연합(United Nations) 어느 나라에 속하였던 상선을 포함하며, 그 위치, 상태 및 이동을 기재할 것.\n\n**e.**\n\n모든 기뢰, 기뢰원 및 지상·해상·항공 이동에 대한 그 밖의 장애물의 위치와 배치, 그리고 그와 관련된 안전 항로를 표시한, 지도를 첨부한 완전하고 상세한 정보.\n\n**f.**\n\n비행장, 수상기 기지, 대공 방어시설, 항만 및 해군기지, 저장창고, 상설 및 임시 육상·연안 축성, 요새 및 그 밖의 축성 지역을 포함한 모든 군사 시설과 시설물의 위치 및 명세.\n\n**g.**\n\n국제연합 포로 및 민간인 억류자의 모든 수용소 및 그 밖의 억류 장소의 위치.\n\n**III.**\n\n일본 무장 병력 및 민간항공 당국은, 처분에 관한 추후 통지가 있을 때까지 모든 일본 육군·해군 및 민간 항공기가 지상, 수상 또는 선상에 그대로 있도록 보장한다.\n\n**IV.**\n\n모든 종류의 일본 또는 일본 통제 하 해군 함정 및 상선은 손상 없이 유지되며, 연합국최고사령관의 지시가 있을 때까지 어떠한 이동도 하지 않는다. 해상에 있는 선박은 즉시 모든 종류의 폭발물을 무해하게 만들어 배 밖으로 버린다. 해상에 있지 않은 선박은 즉시 모든 종류의 폭발물을 육상의 안전한 저장소로 옮긴다.\n\n**V.**\n\n책임 있는 일본 또는 일본 통제 하 군 및 민간 당국은 다음을 보장한다.\n\n**a.**\n\n소재를 불문하고 모든 일본의 기뢰, 기뢰원 및 지상·해상·항공 이동에 대한 그 밖의 장애물이 연합국최고사령관의 지시에 따라 제거될 것.\n\n**b.**\n\n모든 항로표지가 즉시 복구될 것.\n\n**c.**\n\n위 a가 완료될 때까지 모든 안전 항로가 열린 채로 유지되고 분명하게 표시될 것.\n\n**VI.**\n\n책임 있는 일본 및 일본 통제 하 군 및 민간 당국은 연합국최고사령관의 추후 지시가 있을 때까지 다음을 온전하고 양호한 상태로 보존한다.\n\n**a.**\n\n모든 무기, 탄약, 폭발물, 군사 장비, 저장품 및 보급품, 그 밖의 모든 종류의 전쟁 도구 및 그 밖의 모든 전쟁 물자(이 명령 제IV항에 특별히 정한 것은 제외한다).\n\n**b.**\n\n모든 육상·수상·항공 운송 및 통신 시설과 장비.\n\n[638면] **c.**\n\n비행장, 수상기 기지, 대공 방어시설, 항만 및 해군기지, 저장창고, 상설 및 임시 육상·연안 축성, 요새 및 그 밖의 축성 지역을 포함한 모든 군사 시설과 시설물, 아울러 그러한 축성·시설 및 시설물의 모든 도면과 설계도.\n\n**d.**\n\n모든 종류의 전쟁 도구, 그리고 군사 또는 준군사 조직이 그 작전과 관련하여 사용하거나 사용하려는 그 밖의 물자와 재산을, 생산하거나 그 생산 또는 사용을 용이하게 할 목적으로 설계되었거나 의도된 모든 공장, 시설, 작업장, 연구기관, 실험실, 시험소, 기술 자료, 특허, 도면, 설계도 및 발명.\n\n**VII.**\n\n일본 대본영은 이 명령을 접수한 때로부터 (기한) 이내에 연합국최고사령관에게 위 제VI항 a, b, d 각 호에 명시된 모든 항목의 완전한 목록을 제공하며, 각각의 수량, 형식 및 위치를 표시한다.\n\n**VIII.**\n\n모든 무기, 탄약 및 전쟁 도구의 제조와 배포는 즉시 중지된다.\n\n**IX.**\n\n일본 또는 일본 통제 하 당국의 수중에 있는 국제연합 포로 및 민간인 억류자에 관하여는 다음과 같다.\n\n**a.**\n\n모든 국제연합 포로 및 민간인 억류자의 안전과 후생은 엄정하게 보전되며, 여기에는 연합국최고사령관이 그 책임을 인수할 때까지 충분한 식량, 숙소, 의복 및 의료를 제공하는 데 필요한 행정 및 보급 업무가 포함된다.\n\n**b.**\n\n국제연합 포로 및 민간인 억류자의 각 수용소 또는 그 밖의 억류 장소는 그 장비, 저장품, 기록, 무기 및 탄약과 함께 포로 및 민간인 억류자 가운데 선임 장교 또는 지명된 대표의 지휘 아래 즉시 인도된다.\n\n**c.**\n\n연합국최고사령관이 지시하는 바에 따라, 포로 및 민간인 억류자는 연합국 당국이 인수할 수 있는 안전한 장소로 수송된다.\n\n**d.**\n\n일본 대본영은 이 명령을 접수한 때로부터 (기한) 이내에 연합국최고사령관에게 모든 국제연합 포로 및 민간인 억류자의 완전한 명단을 제공하며 그 소재를 표시한다.\n\n**X.**\n\n모든 일본 및 일본 통제 하 군 및 민간 당국은 연합국 병력에 의한 일본 및 일본 통제 지역의 점령을 돕고 지원한다.\n\n**XI.**\n\n일본 대본영 및 관계 일본 관리들은 연합국 점령군 사령관들의 지시가 있으면 일본 민간인이 소지한 모든 무기를 수집하여 인도할 준비를 갖춘다.\n\n**XII.**\n\n연합군최고사령관 또는 그 밖의 연합국 군 당국이 발하는 이 명령 및 그에 뒤따르는 모든 지시는 [639면] 일본 및 일본 통제 하 군 및 민간 관리와 사인(私人)에 의하여 엄정하고 신속하게 준수된다. 이 명령 또는 그에 뒤따르는 명령의 규정을 이행하는 데 지체하거나 이를 이행하지 아니하는 경우, 그리고 연합국최고사령관이 연합국에 해롭다고 판단하는 모든 행위는 연합국 군 당국과 일본 정부의 손에 의하여 가혹하고 즉결적인 처벌을 받게 된다.", "secondary": "SWNCC 21/5\n\n[Washington, August 11, 1945.]\n\nMilitary and Naval\n\nI.\n\nThe Imperial General Headquarters by direction of the Emperor, and pursuant to the surrender to the Supreme Commander for the Allied Powers of all Japanese armed forces by the Emperor, hereby orders all of its commanders in Japan and abroad to cause the Japanese armed forces and Japanese-controlled forces under their command to cease hostilities at once, to lay down their arms, to remain in their present locations and to surrender unconditionally to commanders acting on behalf of the United States, the Republic of China, the United Kingdom and the British Empire, and the Union of Soviet Socialist Republics, as indicated hereafter. Immediate contact will be made with the indicated commanders, or their designated representatives, and their instructions will be completely and immediately carried out. [636면]\n\na.\n\nThe senior Japanese commanders and all ground, sea, air and auxiliary forces within China, excluding Manchuria, Formosa and French Indo-China north of 16° north latitude shall surrender to the Generalissimo Chiang Kai-shek.\n\nb.\n\nThe senior Japanese commanders and all ground, sea, air and auxiliary forces within Manchuria, Korea north of 38° north latitude and Karafuto shall surrender to the Commander-in-Chief of Soviet Forces in the Far East.\n\nc.\n\nThe senior Japanese commanders and all ground, sea, air and auxiliary forces within Thailand, Burma, Malaya, French Indo-China south of 16° north latitude, Sumatra, Java, Andamans, Nicobars, Borneo and the Lesser Sundas shall surrender to the Supreme Allied Commander, Southeast Asia Command.\n\nd.\n\nThe senior Japanese commanders and all ground, sea, air and auxiliary forces in the Celebes, Halmahera, New Guinea, the Banda Sea areas, Bismarcks and Solomons shall surrender to the Commander-in-Chief, Australian Imperial Forces.\n\ne.\n\nThe senior Japanese commanders and all ground, sea, air and auxiliary forces in the Japanese Mandated Islands, Bonins and other Pacific Islands shall surrender to the Commander-in-Chief, U.S. Pacific Fleet\n\nf.\n\nThe senior Japanese commanders and all ground, sea, air and auxiliary forces in Korea south of 38° north latitude shall surrender to the Commanding General, U.S. Expeditionary Forces in Korea.\n\ng.\n\nThe Imperial General Headquarters, its senior commanders, and all ground, sea, air and auxiliary forces in the main islands of Japan, minor islands adjacent thereto, the Ryukyus, and the Philippines shall surrender to the Commander-in-Chief, U.S. Army Forces in the Pacific.\n\nThe Japanese Imperial General Headquarters further orders its commanders in Japan and abroad to disarm completely all forces of Japan or under Japanese control, wherever they may be situated, and to deliver intact and in safe and good condition all weapons and equipment at such time and at such places as may be prescribed by the Allied Commanders indicated above. (Pending further instructions, the Japanese police force in the main islands of Japan will be exempt from this disarmament provision. The police force will remain at their posts and shall be held responsible for the preservation of law and order. The strength and arms of such a police force will be prescribed.)\n\nII.\n\nThe Japanese Imperial General Headquarters shall furnish to the Supreme Commander for the Allied Powers, within (time limit) of receipt of this order, complete information with respect to Japan and all areas under Japanese control, as follows:\n\na.\n\nLists of all land, air and anti-aircraft units showing locations and strengths in officers and men.\n\nb.\n\nLists of all aircraft, military, naval and civil, giving complete information as to the number, type, location and condition of such aircraft.\n\n[637면] c.\n\nLists of all Japanese and Japanese-controlled naval vessels, surface and submarine and auxiliary naval craft in or out of commission and under construction giving their position, condition and movement.\n\nd.\n\nLists of all Japanese and Japanese-controlled merchant ships of over 100 gross tons, in or out of commission and under construction, including merchant ships formerly belonging to any of the United Nations which are now in Japanese hands, giving their position, condition and movement.\n\ne.\n\nComplete and detailed information, accompanied by maps, showing locations and layouts of all mines, minefields and other obstacles to movement by land, sea or air and the safety lanes in connection therewith.\n\nf.\n\nLocations and descriptions of all military installations and establishments, including airfields, seaplane bases, anti-aircraft defenses, ports and naval bases, storage depots, permanent and temporary land and coast fortifications, fortresses and other fortified areas.\n\ng.\n\nLocations of all camps and other places of detention of United Nations prisoners of war and civilian internees.\n\nIII.\n\nJapanese armed forces and civil aviation authorities will insure that all Japanese military, naval and civil aircraft remain on the ground, on the water, or aboard ship, until further notification of the disposition to be made of them.\n\nIV.\n\nJapanese or Japanese-controlled naval or merchant vessels of all types will be maintained without damage and will undertake no movement pending instructions from the Supreme Commander for the Allied Powers. Vessels at sea will immediately render harmless and throw overboard explosives of all types. Vessels not at sea will immediately remove explosives of all types to safe storage ashore.\n\nV.\n\nResponsible Japanese or Japanese-controlled military and civil authorities will insure that:\n\na.\n\nAll Japanese mines, minefields and other obstacles to movement by land, sea and air, wherever located, be removed according to instructions of the Supreme Commander for the Allied Powers.\n\nb.\n\nAll aids to navigation be reestablished at once.\n\nc.\n\nAll safety lanes be kept open and clearly marked pending accomplishment of a above.\n\nVI.\n\nResponsible Japanese and Japanese-controlled military and civil authorities will hold intact and in good condition pending further instructions from the Supreme Commander for the Allied Powers the following:\n\na.\n\nAll arms, ammunition, explosives, military equipment, stores and supplies, and other implements of war of all kinds and all other war material (except as specifically prescribed in Section IV of this order).\n\nb.\n\nAll land, water and air transportation and communication facilities and equipment.\n\n[638면] c.\n\nAll military installations and establishments, including airfields, seaplane bases, anti-aircraft defenses, ports and naval bases, storage depots, permanent and temporary land and coast fortifications, fortresses and other fortified areas, together with plans and drawings of all such fortifications, installations and establishments.\n\nd.\n\nAll factories, plants, shops, research institutions, laboratories, testing stations, technical data, patents, plans, drawings and inventions designed or intended to produce or to facilitate the production or use of all implements of war and other material and property used by or intended for use by any military or paramilitary organization in connection with its operations.\n\nVII.\n\nThe Japanese Imperial General Headquarters shall furnish to the Supreme Commander for the Allied Powers, within (time limit) or receipt of this order, complete lists of all the items specified in paragraphs a, b, and d of Section VI, above, indicating the numbers, types and locations of each.\n\nVIII.\n\nThe manufacture and distribution of all arms, ammunition and implements of war will cease forthwith.\n\nIX.\n\nWith respect to United Nations prisoners of war and civilian internees in the hands of Japanese or Japanese-controlled authorities:\n\na.\n\nThe safety and well-being of all United Nations prisoners of war and civilian internees will be scrupulously preserved, to include the administrative and supply services essential to provide adequate food, shelter, clothing, and medical care until such responsibility is undertaken by the Supreme Commander for the Allied Powers;\n\nb.\n\nEach camp or other place of detention of United Nations prisoners of war and civilian internees together with its equipment, stores, records, arms, and ammunition will be delivered immediately to the command of the senior officer or designated representative of the prisoners of war and civilian internees;\n\nc.\n\nAs directed by the Supreme Commander for the Allied Powers, prisoners of war and civilian internees will be transported to places of safety where they can be accepted by allied authorities;\n\nd.\n\nThe Japanese Imperial General Headquarters will furnish to the Supreme Commander for the Allied Powers, within (time limit) of the receipt of this order, complete lists of all United Nations prisoners of war and civilian internees, indicating their location.\n\nX.\n\nAll Japanese and Japanese-controlled military and civil authorities shall aid and assist the occupation of Japan and Japanese-controlled areas by forces of the Allied Powers.\n\nXI.\n\nThe Japanese Imperial General Headquarters and appropriate Japanese officials shall be prepared, on instructions from Allied occupation commanders, to collect and deliver all arms in the possession of the Japanese civilian population.\n\nXII.\n\nThis and all subsequent instructions issued by the Supreme Commander for the Allied Forces or other allied military authorities [639면] will be scrapulously and promptly obeyed by Japanese and Japanese-controlled military and civil officials and private persons. Any delay or failure to comply with the provisions of this or subsequent orders, and any action which the Supreme Commander for the Allied Powers determines to be detrimental to the Allied Powers, will incur drastic and summary punishment at the hands of allied military authorities and the Japanese Government.", "notes": [], "note": "번역자 주 — 이 배치의 핵심 문서다. 제1항 b(북위 38도 이북의 조선 — 극동 소련군 총사령관)와 제1항 f(북위 38도 이남의 조선 — 주조선 미국 원정군 사령관)에서 조선이 한 명령 안에서 38도선을 경계로 둘로 갈린다. b에서 조선은 만주와 가라후토 사이에 열거되고, f는 별개의 호로 따로 세워져 있다 — 이 열거 순서와 호 배치를 원문대로 지켰다.\n\n원문 표기 유지: Formosa는 「타이완(Formosa)」, Karafuto는 「가라후토(Karafuto, 남사할린)」, Bonins는 「오가사와라 제도(Bonins)」로 한국어를 앞에 두고 원문을 병기했다.\n\n원문 이상(異狀)을 그대로 둔 곳: (1) 제VII항의 「within (time limit) or receipt of this order」는 or가 of의 오식으로 보이나 원문 그대로이며 번역은 문맥에 따라 「접수한 때로부터 (기한) 이내에」로 옮겼다. (2) 제XII항의 「scrapulously」는 scrupulously의 오식이다. (3) 제XII항만 「Supreme Commander for the Allied Forces」로, 다른 곳은 모두 「Supreme Commander for the Allied Powers」로 표기가 갈린다 — 각각 「연합군최고사령관」·「연합국최고사령관」으로 구분해 옮겼다. (4) 제I항 e의 원문 문장 끝에 마침표가 없다. (5) 「(time limit)」은 초안 단계에서 기한이 비워진 자리이므로 「(기한)」으로 두었다.\n\n「United Nations」는 1945년 8월 시점에서 연합국을 가리키는 용어이나 원문 표기를 살려 「국제연합(United Nations)」으로 첫 등장에 병기했다. 규칙 3에 따라 shall(~한다)과 will(~한다/~할 것)을 구분하려 했으나 이 문서는 두 조동사가 모두 명령의 확정 서술로 쓰여 대부분 「~한다」로 옮겼다. 조문 번호는 원문의 로마숫자 I~XII와 소문자 a~g를 그대로 지켰다.", "warn": false, "pages": ["635", "636", "637", "638", "639"], "search": "Chiang Kai-shek 장제스 — 중화민국 총통(Generalissimo). 제1항 a의 항복 수령자로 유일하게 실명으로 지정됨 히로히토 천황(본문에는 「the Emperor」로만 나옴)"}, {"id": "d419", "order": 419, "date": "1945-08-11", "group": "A", "eyebrow": "d419 · The Ambassador in France (Caffery) to the Secretary of State", "title": "주프랑스 대사(캐퍼리)가 국무장관에게", "badge": null, "list_right": "문서 419", "meta": [{"k": "일자", "v": "1945-08-11"}, {"k": "시각", "v": "발신 1945년 8월 11일 오후 4시 / 접수 오후 7시 53분 (Received 7:53 p.m.)"}, {"k": "장소", "v": "Paris", "txt": true}, {"k": "전문번호", "v": "4870"}, {"k": "원문출처", "v": "740.00119 PW/8–1145: Telegram", "txt": true}, {"k": "발신", "v": "주프랑스 미국대사 캐퍼리(Caffery)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 419 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d419"}], "summary": "프랑스 외무부가 일본 항복에 관한 현재의 협의에 프랑스도 참여하고 극동 강화 조건 수립에 다른 강대국들과 함께하기를 바란다는 뜻을 본네 대사를 통해 국무부에 전하도록 훈령했음을 알리며, 그 근거로 인도차이나에서의 이해관계와 1944년 12월 8일 이래의 대일 참전을 든다.", "points": ["전보번호 4870. 파리 8월 11일 오후 4시 발신, 오후 7시 53분 접수.", "프랑스 외무부가 오늘 아침 국무장관에게 알려 달라고 요청하였다.", "본네(주미 프랑스대사)에게 국무부에 통보하도록 훈령이 내려지고 있다는 것이다.", "프랑스는 일본 항복에 관한 현재의 협의에 스스로 참여하기를 바란다.", "프랑스는 극동 강화 조건 수립에서 다른 강대국들과 함께하기를 바란다.", "그 주장의 근거로 인도차이나에서의 이해관계와 1944년 12월 8일 이래 대일 전쟁에 참가한 사실을 들었다.", "이 전언을 참사관에게 구두로 전달한 드장은, 프랑스 정부가 물론 포츠담 최후통첩의 조항에 동의한다고 말하였다."], "primary": "파리, 1945년 8월 11일 오후 4시.\n[접수 오후 7시 53분]\n\n4870. 외무부는 오늘 아침, 국무장관에게 다음을 알려 달라고 요청하였다. 즉 본네[주60]에게 국무부에 통보하도록 훈령이 내려지고 있으며, 그 내용은 프랑스가 일본의 항복에 관한 현재의 협의에 스스로 참여하기를 바라고, 극동에서의 강화 조건 수립에 다른 강대국들과 함께하기를 원한다는 것이다. 프랑스는 이 주장의 근거를 인도차이나에서의 자국 이해관계와 1944년 12월 8일 이래 대일 전쟁에 참가한 사실에 두었다.\n\n이 전언을 참사관에게 구두로 전달한 드장[주61]은, 프랑스 정부가 물론 포츠담 최후통첩의 조항에 동의한다고 말하였다.\n\n캐퍼리", "secondary": "Paris, August 11, 1945—4 p.m. \n [Received 7:53 p.m.]\n\n4870. Foreign Office asked this morning that the Secretary be informed that instructions were being given Bonnet [주60] to inform the Department that France would like to associate herself in current consultations relative to surrender of Japan and desired to join with other great powers in establishing terms of peace in Far East basing this claim on her interests in Indochina and her participation in war against Japan since December 8, 1944.\n\nDejean [주61] who delivered this message orally to the Counselor said that French Government was, of course, in accord with terms of ultimatum of Potsdam.\n\nCaffery", "notes": ["[주60] 앙리 본네(Henri Bonnet), 주미국 프랑스대사.", "[주61] 모리스 드장(Maurice Dejean), 프랑스 외무부 정무총국장."], "note": "번역자 주 — 「ultimatum of Potsdam」은 포츠담 선언(최후통첩)을 가리키나 원문 표기를 살려 「포츠담 최후통첩」으로 옮겼다. 「Counselor」는 주프랑스 미국대사관 참사관이다.", "warn": false, "pages": ["639"], "search": "Jefferson Caffery 제퍼슨 캐퍼리 — 주프랑스 미국대사 Henri Bonnet 앙리 본네 — 주미국 프랑스대사 Maurice Dejean 모리스 드장 — 프랑스 외무부 정무총국장"}, {"id": "d420", "order": 420, "date": "1945-08-11", "group": "A", "eyebrow": "d420 · The Ambassador in the United Kingdom (Winant) to the Secretary of State", "title": "주영 대사(위넌트)가 국무장관에게", "badge": null, "list_right": "문서 420", "meta": [{"k": "일자", "v": "1945-08-11"}, {"k": "시각", "v": "접수 1945년 8월 11일 오후 11시 10분 (Received August 11—11:10 p.m.) / 대사관 접수 후 5분 이내에 총리에게 전화 전달"}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "2264"}, {"k": "원문출처", "v": null, "txt": true}, {"k": "발신", "v": "주영 대사 위넌트(Winant)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 420 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d420"}], "summary": "영국 총리가 일본 항복 접수 절차에 관한 대통령의 제안에 대체로 동의하며 브루스 프레이저 제독을 영국 대표로 지명한다고 회신하다.", "points": ["8월 11일 오후 11시 10분 접수된 런던발 전보 제2264호.", "국무장관발 백악관 전보 제325호(대통령이 총리에게 보내는 통보의 전달 요청)는 대사관 접수 후 5분 이내에, 체커스에 있던 총리에게 전화로 전달되었다.", "총리의 회답: 「일본 항복 접수에 관한 귀하의 제안과 관련한 통보에 대한 회답으로, 본인은 귀하가 제안한 전반적 절차에 동의하며 브루스 오스틴 프레이저 제독을 우리 측 대표로 지명한다.」", "[주62a] 프레이저 제독은 영국 태평양함대 사령관이다."], "primary": "런던, 1945년 8월 11일.\n[1945년 8월 11일 오후 11시 10분 접수]\n\n2264. 대통령이 총리에게 보내는 통보의 전달을 요청한 국무장관발 백악관 전보 제325호 [주62] 는, 대사관 접수 후 5분 이내에 체커스(Chequers)에 있던 총리에게 전화로 전달되었습니다.\n\n총리는 다음의 통보를 대통령에게 전달해 달라고 본인에게 요청하였습니다.\n\n> 「일본 항복의 접수에 관한 귀하의 제안에 관련된 통보에 대한 회답으로서, 본인은 귀하가 제안한 전반적 [640면] 절차에 동의하며 브루스 오스틴 프레이저 경 제독 [주62a] 을 우리 측 대표로 지명한다.」\n\n위넌트", "secondary": "London, August 11, 1945.\n[Received August 11—11:10 p.m.]\n\n2264. White House Nbr 325 from the Secretary of State requesting delivery of a message from the President to the Prime Minister [주62] was telephoned to the Prime Minister, who is at Chequers, within five minutes of its receipt at the Embassy.\n\nThe Prime Minister asked me to forward the following message to the President:\n\n“In reply to your message in regard to your proposals for the acceptance of the Japanese surrender I am in accord with the general [640면] procedure you propose and I designate Admiral Sir Bruce Austin Fraser [주62a] our representative.”\n\nWinant", "notes": ["[주62] 「회의록 발췌」 제1항, 634면 참조.", "[주62a] 영국 태평양함대 사령관."], "note": "번역자 주 — 원문은 총리의 이름을 적지 않고 직명만 쓴다(1945년 8월 11일 시점의 영국 총리는 애틀리). 이름을 본문에 넣지 않고 people에만 보충 표기했다. 「White House Nbr 325」는 백악관 계통 전보번호이므로 번호를 그대로 두었다.", "warn": false, "pages": ["639", "640"], "search": "Winant 위넌트(John G. Winant) — 주영 미국대사 Prime Minister 총리(Clement Attlee) — 원문은 직명만 표기 Admiral Sir Bruce Austin Fraser 브루스 오스틴 프레이저 경 제독 — 영국 태평양함대 사령관 President 대통령(Truman 트루먼)"}, {"id": "d421", "order": 421, "date": "1945-08-11", "group": "B", "eyebrow": "d421 · The Assistant Secretary of War (McCloy) to the Assistant Secretary of State (Dunn)", "title": "육군차관보(매클로이)가 국무차관보(던)에게", "badge": null, "list_right": "문서 421", "meta": [{"k": "일자", "v": "1945-08-11"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": null, "txt": true}, {"k": "발신", "v": "육군차관보 매클로이(McCloy)", "txt": true}, {"k": "수신", "v": "국무차관보 던(Dunn)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 421 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d421"}], "summary": "인도차이나 남·북부 및 네덜란드령 동인도에서의 일본군 항복 접수에 프랑스·네덜란드가 입회하게 해 달라는 요청을, 군 계통이 아니라 정치적 경로로 처리하자고 육군차관보가 제안하다.", "points": ["프랑스는 인도차이나 북부에서의 중국 측 일본군 항복 접수와 남부에서의 영국 측 항복 접수에 입회하게 해 달라고 요청했다.", "육군부는 그 요청 자체에 이의는 없으나, 군 계통(military channels)을 통해 이를 지지하는 것은 적절하지 않다고 본다.", "중국전구에서 웨드마이어 장군은 총통(장제스) 휘하의 참모장에 불과하므로 정치 문제에 관해 총통에게 건의할 수 있는 위치가 아니다.", "제안: 정치적 근거로 지지할 만하다고 판단되면, 프랑스에 이 문제를 총통 및 영국 정부와 직접 교섭하라고 알리고, 충칭·런던 주재 미국대사에게 그렇게 제기된 요청을 지지하도록 훈령을 내리고 있다고 덧붙이라는 것.", "네덜란드령 동인도에서의 영국 측 항복 접수에 네덜란드가 입회하게 해 달라는 요청과 관련, 영국 참모총장단은 정전일부터 동인도 전역을 마운트배튼 경 사령부에 포함시키자고 제안해 왔다.", "이 제안을 육·해군 기획자들이 호의적으로 보고 있으며, 합동참모본부(JCS)가 이를 받아들일 것으로 보이므로, 네덜란드도 영국 정부에 요청을 제기하도록 권하고 필요하다면 미국대사에게 그 요청을 지지하도록 훈령하자고 제안한다."], "primary": "워싱턴, 1945년 8월 11일.\n\n지미에게: 본인은 인도차이나 북부에서의 중국 측 일본군 항복 접수와 인도차이나 남부에서의 영국 측 일본군 항복 접수에 입회할 수 있게 해 달라는 프랑스의 요청에 관하여 참모진 대표들과 이야기를 나누었습니다. 이 요청을 승인하는 데에 우리는 이의가 없습니다만, 우리의 견해로는 군 계통을 통하여 이를 지지하는 것은 적절하지 않습니다. 예컨대 중국전구에서 웨드마이어 장군 [주63] 은 총통의 지휘 아래 있는 참모장에 지나지 않으며, 따라서 정치적 사안에 관하여 총통에게 건의할 수 있는 위치에 있지 않습니다.\n\n우리의 제안은, 만약 귀하가 이 요청을 정치적 근거에서 지지하여야 한다고 판단하신다면, 프랑스 측에 이 문제를 그들이 총통 및 영국 정부와 직접 제기하여야 한다고 알리시고, 아울러 충칭 [주63a] 및 런던 주재 우리 대사들에게 그렇게 제기된 요청을 지지하도록 훈령이 내려지고 있다고 덧붙이실 수 있으리라는 것입니다.\n\n네덜란드령 동인도에서의 영국 측 일본군 항복 접수에 입회할 수 있게 해 달라는 네덜란드의 요청에 관해서는, 정전일부터 네덜란드령 동인도 전 지역을 마운트배튼 경의 사령부에 포함시키자는 영국 참모총장단의 제안을 우리가 방금 접수하였습니다. [주64] 이 제안은 육군과 해군의 기획자들이 호의적으로 보고 있습니다. 개연성이 있어 보이는 대로 이 제안이 합동참모본부에서 받아들여진다면, 네덜란드 측에도 그 요청을 영국 정부에 제기하도록 권고할 것을 제안하며, 또한 귀하가 적절하다고 판단하신다면 우리 대사에게 그 요청을 지지하도록 훈령이 내려지도록 할 것을 제안합니다.\n\n삼가,\n\n존 J. 매클로이\n\n[641면]", "secondary": "Washington, 11 August, 1945.\n\nDear Jimmy: I have talked with representatives of the Staff about the French requests to be allowed to be present at the Chinese acceptance of Japanese surrender in the northern part of Indo-China and at the British acceptance of Japanese surrender in the southern part of Indo-China. We have no objection to the granting of these requests, but our view is that we cannot appropriately support them through military channels. In the China Theater, for example, General Wedemeyer [주63] is merely Chief of Staff under command of the Generalissimo and is therefore not in a position to make recommendations to the Generalissimo on political matters.\n\nOur suggestion is that, if you believe the request should be supported on political grounds, you advise the French that the matter should be taken up by them directly with the Generalissimo and the British Government, and you might add that our Ambassadors in Chungking [주63a] and London are being instructed to support the requests so made.\n\nWith regard to the Dutch request to be allowed to be present at the British acceptance of Japanese surrender in the Netherlands East Indies, we have just received a proposal by the British Chiefs of Staff that, from the date of the cease fire, the entire Netherlands East Indies area be included in Lord Louis Mountbatten’s Command. [주64] This proposal is viewed favorably by the Army and Navy planners. If, as seems probable, the proposal is accepted by the Joint Chiefs of Staff, we suggest that the Dutch also should be advised to present their request to the British Government, and, if you consider it appropriate, that our Ambassador will be instructed to support the request.\n\nSincerely,\n\nJohn J. McCloy\n\n[641면]", "notes": ["[주63] 앨버트 C. 웨드마이어 중장, 중국전구 미군 사령관이자 중국전구 참모장 겸임.", "[주63a] 패트릭 J. 헐리 소장.", "[주64] 동남아시아 연합국최고사령관."], "note": "번역자 주 — 서두 「Dear Jimmy」는 수신인 국무차관보 던(James C. Dunn)의 애칭이다. 「Generalissimo」는 「총통」으로 옮겼고 원문에 이름은 없다. [주64]는 원문에서 마운트배튼의 직명을 설명하는 각주다.", "warn": false, "pages": ["640", "641"], "search": "McCloy 매클로이(John J. McCloy) — 육군차관보 Dunn 던(James C. Dunn) — 국무차관보, 서두의 「Jimmy 지미」 Wedemeyer 웨드마이어(Albert C. Wedemeyer) 중장 — 중국전구 미군 사령관 겸 참모장 Generalissimo 총통 — 장제스(원문은 직명만 표기) Hurley 헐리(Patrick J. Hurley) 소장 — 주충칭 미국대사(각주) Mountbatten 마운트배튼(Lord Louis Mountbatten) — 동남아시아 연합국최고사령관"}, {"id": "d422", "order": 422, "date": "1945-08-12", "group": "A", "eyebrow": "d422 · The Ambassador in the Soviet Union (Harriman) to the Secretary of State", "title": "주소련대사(해리먼)가 국무장관에게", "badge": null, "list_right": "문서 422", "meta": [{"k": "일자", "v": "1945-08-12"}, {"k": "시각", "v": "1945년 8월 12일 발신 (Moscow) / 8월 12일 오전 7시 38분 접수 (Received August 12—7:38 a.m.)"}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": "M 25277"}, {"k": "원문출처", "v": "740.00119 P.W./8–1245: Telegram", "txt": true}, {"k": "발신", "v": "주소련대사 해리먼(W. Averell Harriman)", "txt": true}, {"k": "수신", "v": "국무장관 번스(James F. Byrnes)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 422 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d422"}], "summary": "소련 정부가 대일 회답문에 가해진 변경에 동의했음을 몰로토프가 통보해 왔다는 짧은 보고.", "points": ["8월 11일자 백악관 메시지 제324호에 대한 회신.", "몰로토프가 해리먼에게, 소련 정부가 대일본 정부 회답에 가해진 변경에 동의한다고 통보.", "8월 12일 오전 7시 38분 접수 — 전날 밤의 논쟁(d410)이 하룻밤 만에 정리되었음을 보여준다."], "primary": "모스크바, 1945년 8월 12일.\n[8월 12일 오전 7시 38분 접수]\n\nM 25277. 8월 11일자 백악관 메시지 제324호 [주65] 에 관하여. 몰로토프가 나에게, 소련 정부가 일본 정부에 대한 회답에 가해진 변경에 동의한다고 통보하였다.\n\n[해리먼(Harriman)]", "secondary": "Moscow, August 12, 1945.\n[Received August 12—7:38 a.m.]\n\nM 25277. Reference White House message 324, August 11. [주65] Molotov has informed me that the Soviet Government agrees to the changes made in the reply to the Japanese Government.\n\n[\n\nHarriman\n\n]", "notes": ["[주65] 국무부 문서철에서 발견되지 않음. 유사한 메시지에 대한 영국 측 회답은 런던발 8월 11일자 전보 제2263호, 633면 참조."], "note": null, "warn": false, "pages": ["641"], "search": "Harriman 해리먼(W. Averell Harriman, 주소련대사) Molotov 몰로토프(V. M. Molotov, 소련 외무인민위원)"}, {"id": "d423", "order": 423, "date": "1945-08-12", "group": "B", "eyebrow": "d423 · Memorandum by the Director of the Office of Far Eastern Affairs (Ballantine) to Mr. Eugene H. Dooman, Special Assistant to the Assistant Secretary of State (Dunn)", "title": "극동국장(밸런타인)이 국무차관보(던)의 특별보좌관 유진 H. 두먼에게 보내는 각서", "badge": null, "list_right": "문서 423", "meta": [{"k": "일자", "v": "1945-08-12"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": null, "txt": true}, {"k": "발신", "v": "극동국장 밸런타인(Joseph W. Ballantine)", "txt": true}, {"k": "수신", "v": "국무차관보(던)의 특별보좌관 유진 H. 두먼(Eugene H. Dooman)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 423 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d423"}], "summary": "영국 공사 밸푸어가 베빈 외무장관이 보낸 항복 조건 초안을 두고 갔으며, 영국 정부는 본문과 절차의 확정 및 자치령 정부와의 사전 협의를 중시한다고 밝혔다.", "points": ["영국 대사관의 밸푸어가 찾아와 베빈이 밸푸어에게 보낸 전보 본문(항복 조건 초안 포함)을 두고 갔다.", "밸푸어는 이 초안이 참모총장단 및 자치령 정부들과 아직 조율되지 않은 잠정안이나, 대체로 영국 정부의 견해를 나타낸다고 말했다.", "영국 정부는 본문과 절차의 확정을 매우 중시하며, 조치와 공표 전에 자치령 정부들과 조율할 기회를 원한다.", "밸런타인은 이 문서를 미국 군 당국에 신속히 전달되도록 하겠다고 답했다.", "밸푸어는 또 외무부 전보를 읽어 주었는데, 여기에는 총리가 대통령에게 보낸 전보의 본문(다소 어긋난 상태)이 인용되어 있었다.", "그 전보에서 총리는 대통령이 제안한 절차에 대체로 동의하며 영국 대표로 브루스 오스틴 프레이저 제독을 지명한다고 밝혔다."], "primary": "[워싱턴,] 1945년 8월 12일.\n\n영국 대사관의 밸푸어 씨[주66]가 찾아와, 베빈(Bevin) 씨가 밸푸어 씨에게 보낸 전보의 본문 — 항복 조건 초안이 담긴 — 을 나에게 두고 갔다.[주67]\n\n밸푸어 씨는, 이 초안이 아직 참모총장단 및 자치령 정부들과 조율되지 않았으므로 잠정적인 것이나, 대체로 영국 정부의 견해를 나타낸다고 말하였다. 그는 영국 정부가 본문과 절차를 확정하는 데 큰 중요성을 두고 있으며, 조치를 취하고 공표하기에 앞서 자치령 정부들과 조율할 기회를 갖기를 바란다고 말하였다.\n\n나는 그에게, 이 문서가 우리 군 당국에 신속히 전달되도록 하겠다고 말하였다.\n\n그는 또한 외무부의 전보 하나를 나에게 읽어 주었는데, 거기에는 총리가 대통령에게 보낸 전보의 본문이 (다소 어긋난 상태로) 인용되어 있었고, 그 전보에서 총리는 대통령이 제안한 절차에 대체로 동의하며 영국 대표로 브루스 오스틴 프레이저 경 제독(Admiral Sir Bruce Austin Fraser)을 지명한다고 밝히고 있었다.\n\n조지프 W. 밸런타인\n\n[642면]", "secondary": "[Washington,] 12 August, 1945.\n\nMr. Balfour, [주66] of the British Embassy, called and left with me the attached text of a telegram from Mr. Bevin to Mr. Balfour containing a draft of surrender terms. [주67]\n\nMr. Balfour said that this draft was tentative as it had not yet cleared with the Chiefs of Staff and with the Dominion Governments but represented in general the views of the British Government. He said that the British Government attached great importance to having the text and procedure settled and desire an opportunity to clear with the Dominion Governments before action and publication.\n\nI told him that I would see that the document reached our military authorities promptly.\n\nHe read me also a telegram from the Foreign Office quoting the text (somewhat garbled) of a telegram sent by the Prime Minister to the President in which it was stated that the Prime Minister was in general accord with the procedure which the President proposed and designated Admiral Sir Bruce Austin Fraser as the British representative.\n\nJoseph W. Ballantine\n\n[642면]", "notes": ["[주66] 존 밸푸어(John Balfour), 영국 공사.", "[주67] 바로 아래 문서."], "note": "번역자 주 — 본문의 「Prime Minister」와 「President」는 이름 없이 직함만 나오므로 그대로 「총리」·「대통령」으로 옮겼다. 「somewhat garbled」는 전신 수신 과정에서 문면이 어긋났다는 뜻으로 「다소 어긋난 상태로」라고 옮겼다.", "warn": false, "pages": ["641", "642"], "search": "Joseph W. Ballantine 조지프 W. 밸런타인 — 국무부 극동국장 Eugene H. Dooman 유진 H. 두먼 — 국무차관보 특별보좌관 James Clement Dunn 던 — 국무차관보 John Balfour 존 밸푸어 — 주미 영국 공사 Ernest Bevin 베빈 — 영국 외무장관 Bruce Austin Fraser 브루스 오스틴 프레이저 — 영국 해군 제독, 영국 대표로 지명 Clement Attlee 총리(본문에는 「Prime Minister」로만 나옴) Harry S. Truman 대통령(본문에는 「President」로만 나옴)"}, {"id": "d424", "order": 424, "date": "1945-08-12", "group": "B", "eyebrow": "d424 · The British Embassy to the Department of State", "title": "영국 대사관이 국무부에", "badge": null, "list_right": "문서 424", "meta": [{"k": "일자", "v": "1945-08-12"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 PW/8–1245", "txt": true}, {"k": "발신", "v": "영국 대사관", "txt": true}, {"k": "수신", "v": "국무부", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 424 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d424"}], "summary": "영국이 제시한 항복문서(act of surrender) 초안 전문 — 일본 정부와 제국대본영이 모든 일본군을 무조건 항복시키고, 전투 중지·완전 무장해제·연합국 포로 석방·연합국이 부과할 어떠한 조건도 무조건 이행할 것을 규정한다.", "points": ["8월 12일자로 베베스트(Bevest) 씨가 밸푸어(Balfour) 씨에게 보낸 전보의 본문이며, 그 바로 앞 전보에서 언급한 항복문서 초안이 담겨 있다.", "제1항: 서명자들은 일본 제국정부와 일본 제국대본영을 대표하고 천황 폐하로부터 정당히 권한을 위임받아, 육·해·공 어디에 있든 모든 일본 군대와 일본의 통제 아래 있는 군대를 (연합국 최고사령부)에 무조건 항복시킨다.", "제2항: 즉시 칙령을 내려 (시각·일자)에 전투 행동을 중지하고, 그때 점령한 위치에 그대로 머무르며, 완전히 무장을 해제하여 무기와 장비를 연합국 최고사령부가 정당히 권한을 부여한 연합국 지휘관에게 인도하게 한다. 선박·항공기의 자침이나 선체·기관·장비, 각종 기계·병기·기구·생산 수단·건물·식량 저장품 및 그 밖의 물자에 대한 손상을 금한다.", "제3항: 일본이 억류한 모든 연합국 전쟁포로와 민간인을 석방·보호·보살피며, 가능한 한 이른 시각에 연합국 지휘관에게 안전하게 인도하도록 즉시 명령한다.", "제4항: 이 항복문서 시행을 위한 어떠한 명령이나 지시에도 즉시 따른다.", "제5항: 연합국이 일본에 부과하기로 결정하는 그 밖의 어떠한 종류의 조건이든 이의 없이(without question) 이행할 것을 약속한다.", "제6항: 이 항복문서에 따라 행동하지 않을 경우 (연합국 최고사령부)가 적절하다고 인정하는 징벌적 조치 또는 그 밖의 조치를 취한다.", "제7항: 이 문서는 영어(중국어·러시아어·일본어)로 작성되며, 영어본만이 유일한 정본이다."], "primary": "1945년 8월 12일\n\n**8월 12일자 베베스트(Bevest) 씨가 밸푸어(Balfour) 씨에게 보낸 전보 본문**\n\n다음은 나의 바로 앞 전보에서 언급한 항복문서(act of surrender) 초안이다. 시작.\n\n1.\n\n우리 서명자들은 일본 제국정부(Imperial Japanese Government)와 일본 제국대본영(Japanese Imperial General Headquarters)을 대표하고 일본국 천황 폐하로부터 정당히 권한을 위임받아, 이로써 육상·해상·항공을 막론하고 그 소재를 불문하고 모든 일본 군대 및 일본의 통제 아래 있는 군대를 (연합국 최고사령부)에 무조건 항복시킨다.\n\n2.\n\n일본 제국정부와 일본 제국대본영은, 모든 일본 육군·해군·항공 당국 및 그 통제 아래 있는 모든 부대에 대하여, (시각 및 일자)에 전투 행동을 중지하고, 그때 점령하고 있는 위치에 그대로 머무르며, 완전히 무장을 해제하여 그 무기와 장비를 연합국 최고사령부가 정당히 권한을 부여한 연합국 지휘관에게 인도할 것을 명하는 칙령(Imperial Commands)을 즉시 발한다. 어떠한 선박·함정·항공기도 자침(scuttle)시켜서는 아니 되며, 그 선체·기관·장비에 어떠한 손상도 가하여서는 아니 되고, 또한 어떠한 종류의 기계·병기·기구·생산 수단·건물·식량 저장품 또는 그 밖의 상품이나 물자에도 손상을 가하여서는 아니 된다.\n\n3.\n\n일본 제국정부와 일본 제국대본영은, 일본이 억류하고 있는 모든 연합국 전쟁포로와 모든 연합국 민간인의 석방, 그들의 보호·보살핌 및 유지, 그리고 가능한 한 이른 시각에 연합국 최고사령부가 정당히 권한을 부여한 연합국 지휘관에게 그들을 안전하게 인도하는 일에 관하여 즉시 명령을 발한다.\n\n4.\n\n일본 제국정부와 일본 제국대본영은 이 항복문서의 시행을 위한 어떠한 명령이나 지시에도 즉시 따른다.\n\n5.\n\n일본 제국정부와 일본 제국대본영은, 연합국이 일본에 부과하기로 결정할 수 있는 그 밖의 어떠한 종류의 조건이든 이의 없이 이행할 것을 약속한다.\n\n6.\n\n일본 제국정부나 일본 제국대본영 또는 그 통제 아래 있는 어떠한 부대라도 이 항복문서에 따라 행동하지 아니하는 경우에는, (연합국 최고사령부)가 적절하다고 인정하는 징벌적 조치 또는 그 밖의 조치를 취한다.\n\n7.\n\n이 문서는 영어(중국어, 러시아어, 일본어)로 작성된다. 영어본만이 유일한 정본(the only authentic text)이다.\n\n끝.\n\n[643면]", "secondary": "August 12, 1945\n\nText of Telegram From Mr. Bevest to Mr. Balfour Dated 12th August\n\nFollowing is draft act of surrender referred to in my immediately preceding telegram. Begins.\n\n1.\n\nWe, the undersigned representing the Imperial Japanese Government and Japanese Imperial General Headquarters, and duly authorised by His Majesty the Emperor of Japan hereby surrender unconditionally to the (Allied High Command) all Japanese armed forces and forces under Japanese control on land, at sea and in the air wherever they are located.\n\n2.\n\nThe Imperial Japanese Government and Japanese Imperial General Headquarters will at once issue Imperial Commands to all Japanese military, naval and air authorities and to all forces under their control to cease active operations at (time and date), to remain in the positions occupied at that time and to disarm completely, handing over their weapons and equipment to an Allied Commander duly authorised by an Allied Supreme Command. No ship, vessel, or aircraft is to be scuttled or any damage done to its hull, machinery or equipment nor to machines of any kind, armament, apparatus, means of production, buildings, stores of food or any other commodities or materials.\n\n3.\n\nThe Imperial Japanese Government and Japanese Imperial General Headquarters will at once issue orders for the liberation of all Allied prisoners of war and all Allied civilians in Japanese custody, for their protection, care and maintenance and for handing them over safely at the earliest possible moment to an Allied Commander duly authorised by an Allied Supreme Command.\n\n4.\n\nThe Imperial Japanese Government and Japanese Imperial General Headquarters will immediately comply with any orders or instructions for the carrying out of this act of surrender.\n\n5.\n\nThe Imperial Japanese Government and Japanese Imperial General Headquarters undertake to fulfil without question any other terms of whatever kind which the Allies may decide to impose upon Japan.\n\n6.\n\nIn the event of the Imperial Japanese Government or Japanese Imperial General Headquarters or any forces under their control failing to act in accordance with this act of surrender, the (Allied High Command) will take such punitive or other action as they deem appropriate.\n\n7.\n\nThis act is drawn up in the English (Chinese, Russian, Japanese) languages. English is the only authentic text.\n\nEnds.\n\n[643면]", "notes": [], "note": "번역자 주 — 「Mr. Bevest」는 원문 표기 그대로 두었다(전보 수신 과정의 표기로 보인다). 원문에서 괄호로 묶인 「(Allied High Command)」, 「(time and date)」, 「(Chinese, Russian, Japanese)」는 초안의 미확정 부분을 표시한 것이므로 괄호를 그대로 살렸다. 「Allied High Command」는 연합국 최고사령부, 「Allied Supreme Command」는 연합국 최고사령부로 옮겼으나 원문은 두 표현을 섞어 쓰고 있다. confidence를 medium으로 둔 이유는 이 두 표현의 구분과 「Bevest」 표기 때문이다.", "warn": true, "pages": ["642", "643"], "search": "Bevest 베베스트 — 원문 표기 그대로. 영국 외무장관 어니스트 베빈(Ernest Bevin)을 가리키는 것으로 보이나 원문이 이 철자이므로 고치지 않았다. John Balfour 밸푸어 — 주미 영국대사관 공사"}, {"id": "d425", "order": 425, "date": "1945-08-12", "group": "B", "eyebrow": "d425 · The Chairman of the Council of People’s Commissars of the Soviet Union(Stalin) to President Truman", "title": "소련 인민위원회의장(스탈린)이 트루먼 대통령에게", "badge": null, "list_right": "문서 425", "meta": [{"k": "일자", "v": "1945-08-12"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "[Translation] — 주미 소련대사관에서 받은 것으로 보이는 번역문 ([주67a])", "txt": true}, {"k": "발신", "v": "소련 인민위원회의장 스탈린(Stalin)", "txt": true}, {"k": "수신", "v": "트루먼 대통령", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 425 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d425"}], "summary": "소련 정부가 맥아더 원수를 연합국군 최고사령관으로 임명하는 데 동의하고, 소련 군최고사령부 대표로 데레뱐코 중장을 지명하다.", "points": ["8월 12일자 트루먼의 통보 — 일본군의 전반적 항복을 접수·조정·집행하기 위해 더글러스 맥아더 대장을 연합국군 최고사령관으로 임명하는 건 — 을 접수했다.", "소련 정부는 그 제안에 동의한다.", "소련 정부는 맥아더 장군이 일본군의 무조건 항복에 관한 명령을 대본영에 대하여 극동 소련군 최고사령관에게도 항복하도록 내리게 한다는, 제안된 절차에도 동의한다.", "소련 군최고사령부 대표로 데레뱐코 중장이 임명되었고 필요한 훈령을 모두 받았다.", "[주67a] 이 번역문은 주미 소련대사관에서 받은 것으로 보이며, 뒤에 소련 외무부 간행 서한집에 더 매끄러운 번역이 실렸다.", "[주68] 트루먼의 통보는 8월 11일자다."], "primary": "[번역문] [주67a]\n\n일본 무장병력의 전반적 항복(general capitulation)의 접수·조정·집행을 위하여 더글러스 맥아더 육군대장을 연합국군 최고사령관으로 임명하는 데 관한 귀하의 8월 12일자 통보 [주68] 를 접수하였습니다.\n\n소련 정부는 귀하의 제안에 동의합니다.\n\n또한 소련 정부는, 맥아더 장군이 대본영(Imperial Staff Quarters)에 대하여 일본군이 극동 소련군 최고사령관에게도 무조건 항복하도록 하는 명령을 내리도록 규정한, 귀하가 제안한 절차에도 동의합니다. 소련 군최고사령부의 대표로는 데레뱐코 중장 [주69] 이 임명되었으며 필요한 훈령을 모두 받았습니다.\n\n[모스크바,] 1945년 8월 12일.", "secondary": "[Translation] [주67a]\n\nI have received your message of August 12 [주68] regarding the appointment of Army General Douglas MacArthur as Supreme Commander of the Allied armies for the acceptance, coordination and conduct of the general capitulation of the Japanese armed forces.\n\nThe Soviet Government agrees to your proposal.\n\nIt also agrees to the proposed by you procedure, which provides that General MacArthur will give the Imperial Staff Quarters orders about the unconditional surrender of the Japanese troops also to the Soviet Supreme Commander in the Far East. Lieutenant General Dere-vianko [주69] has been appointed as representative of the Soviet Military Supreme Command and has been given all necessary instructions.\n\n[Moscow,] August 12, 1945.", "notes": ["[주67a] 이 번역문은 워싱턴 주재 소련대사관으로부터 받은 것으로 보인다. 뒤에 더 매끄러운 번역이 소련 외무부 간행 『대조국전쟁 1941–1945년 중 소련 각료회의 의장과 미합중국 대통령 및 영국 총리 사이의 서한집』 제2권(모스크바, 외국어출판사, 1957) 문서 제360호, 260면에 실렸다.", "[주68] 8월 11일자. 「회의록 발췌」 제1항, 634면 참조.", "[주69] 쿠즈마 니콜라예비치 데레뱐코 중장."], "note": "번역자 주 — 원문 자체가 소련대사관 측의 거친 영역문이어서 「It also agrees to the proposed by you procedure」처럼 어순이 어색한 대목이 있다([주67a]도 더 매끄러운 번역이 뒤에 나왔다고 밝힌다). 그 거친 구조를 매끄럽게 다듬지 않고 직역했다. 「Imperial Staff Quarters」는 일본 대본영을 가리키는 표현으로 보이나 통상적 영역(Imperial General Headquarters)과 다르므로 원어를 병기했다. 본문 날짜는 「8월 12일자 통보」라 하나 [주68]은 실제로는 8월 11일자라고 정정한다.", "warn": true, "pages": ["643"], "search": "Stalin 스탈린(Joseph Stalin) — 소련 인민위원회의장 Truman 트루먼(Harry S. Truman) — 미국 대통령 Douglas MacArthur 더글러스 맥아더 — 육군대장, 연합국군 최고사령관 지명자 Derevyanko 데레뱐코(Kuzma Nikolayevich Derevyanko) 중장 — 소련 군최고사령부 대표"}, {"id": "d426", "order": 426, "date": "1945-08-12", "group": "B", "eyebrow": "d426 · Draft Report by the Chairman of the State-War-Navy Coordinating Committee (Dunn)", "title": "국무·육군·해군 3부조정위원회(SWNCC) 위원장(던)의 보고서 초안", "badge": null, "list_right": "문서 426", "meta": [{"k": "일자", "v": "1945-08-12"}, {"k": "시각", "v": "오후 6시 30분경 (approximately 6:30 p.m.)"}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": null, "txt": true}, {"k": "발신", "v": "국무·육군·해군 3부조정위원회(SWNCC) 위원장 던(Dunn)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서 초안"}], "links": [{"k": "FRUS", "text": "문서 426 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d426"}], "summary": "던이 8월 12일 오후 6시 30분경, 자신과 매클로이가 번스 국무장관과 나눈 면담 — 니미츠 제독의 항복 접수 역할과 쿠릴열도 항복선 문제 — 을 보고하다.", "points": ["1945년 8월 12일 오후 6시 30분경 던이 자신 및 매클로이와 번스의 면담에 관하여 보고했다.", "매클로이와 던이 도착하기 전에 포레스털 해군장관과 번스가 이미 논의를 마쳤고, 번스는 이 문제로 대통령과 이야기할 예정이었다.", "던과 매클로이는 번스와 여러 대안을 논의했고 논쟁이 오갔다.", "니미츠 제독이 항복 접수에서 맡을 역할에 관한 결정은 그날 저녁 중에 회의 참석자들에게 통보될 것이다.", "번스는 니미츠 제독이 항복선(surrender line)으로 사용할 쿠릴열도의 작전선(operational line)을 승인했다 — 이 선은 파라무시루 바로 남쪽의 온네코탄 해협을 지난다.", "던은 해리먼에게 비행장(airbase)에 관한 합의가 있었는지 확인하고, 번스에게는 홉킨스와 이 건을 확인해 달라고 요청하겠다고 했다.", "던은 니미츠 제독이 항복 시 그 작전선을 확보하도록 지시할 것을 요청했고, 매클로이는 가드너 제독에게 이 건 및 우리가 비행장으로 원하는 섬에 관하여 니미츠 제독 앞 예비명령을 내도록 지시할 것을 요청했다."], "primary": "1945년 8월 12일\n\n1945년 8월 12일, 던 씨가 오후 6시 30분경에 한, 자신 및 매클로이 씨와 번스 씨의 면담에 관한 보고:\n\n던 씨는, 매클로이 씨와 던 씨가 도착하기 전에 포레스털 씨 [주70] 와 번스 씨가 번스 씨의 집무실에서 이미 논의를 나누었으며, 번스 씨가 이 사안에 관하여 대통령과 이야기할 예정이라고 말하였다. 던 씨와 매클로이 씨는 번스 씨와 여러 대안을 논의하였고, 이 사안을 두고 논의가 오갔다. 던 씨는, 니미츠 제독 [주71] 이 항복 접수에서 맡을 역할에 관한 결정이 그날 저녁 중에 회의 참석자들에게 통보될 것이라고 말하였다.\n\n던 씨는 또한, 번스 씨가 니미츠 제독이 항복선으로 사용할 쿠릴열도의 작전선을 승인하였다고 말하였다(이 [644면] 선은 파라무시루 바로 남쪽에 있는 온네코탄 해협을 지난다). 그러나 던 씨는, 자신이 해리먼 씨에게 비행장에 관하여 그가 어떤 합의를 한 바 있는지 확인해 보겠으며, 또한 번스 씨에게 이 사안에 관하여 홉킨스 씨 [주72] 와 확인해 줄 것을 요청하겠다고 말하였다. 던 씨는 니미츠 제독이 항복 시에 그 작전선을 확보하도록(pick up) 지시를 받게 할 것을 요청하였고, 매클로이 씨는 가드너 제독 [주73] 에게 이 사안 및 우리가 비행장으로 원하는 섬에 관하여 니미츠 제독 앞으로 예비명령을 내도록 지시할 것을 요청하였다.", "secondary": "August 12, 1945\n\nReport by Mr. Dunn at approximately 6:30 p.m. respecting his and Mr. McCloy’s interview with Mr. Byrnes, 12 August 1945:\n\nMr. Dunn stated that Mr. Forrestal [주70] and Mr. Byrnes had had a discussion previous to Mr. McCloy’s and Mr. Dunn’s arrival in Mr. Byrnes’ office and that Mr. Byrnes was going to talk to the President in regard to the matter. Mr. Dunn and Mr. McCloy discussed the various alternatives with Mr. Byrnes, and the matter was argued back and forth. Mr. Dunn stated that those at the meeting would be advised later during the evening of the decision respecting the role Admiral Nimitz [주71] would play in the acceptance of the surrender.\n\nMr. Dunn also stated that Mr. Byrnes has approved the operational line in the Kuriles for use by Admiral Nimitz as a surrender line (this [644면] line runs through Onnekotan Sts. which is just S of Paramushiru). Mr. Dunn stated, however, that he would check up with Mr. Harriman respecting whether any agreements on an airbase had been made by him and also that he would request Mr. Byrnes to check with Mr. Hopkins [주72] in regard to the matter. Mr. Dunn requested that Admiral Nimitz be directed to pick up the operational line in the surrender, and Mr. McCloy requested that Admiral Gardner [주73] be told to get out preliminary orders to Admiral Nimitz respecting this matter as well as the island that we want for an airbase.", "notes": ["[주70] 제임스 V. 포레스털, 해군장관.", "[주71] 체스터 W. 니미츠 해군원수, 태평양함대 및 태평양해역 총사령관.", "[주72] 해리 L. 홉킨스, 트루먼 대통령 특별보좌관.", "[주73] M. B. 가드너 해군소장, 미합중국 함대 총사령관 사령부."], "note": "번역자 주 — 「Onnekotan Sts.」는 온네코탄 해협(Onnekotan Strait)의 약기로 보아 옮겼다. 「Paramushiru」는 쿠릴열도 북부의 파라무시루(파라무시르)섬. 「pick up the operational line」은 항복 처리에서 그 선을 실제 경계로 확보·인수한다는 뜻으로 읽었으며 직역과 함께 원어를 병기했다.", "warn": false, "pages": ["643", "644"], "search": "Dunn 던(James C. Dunn) — 국무차관보, SWNCC 위원장 McCloy 매클로이(John J. McCloy) — 육군차관보 Byrnes 번스(James F. Byrnes) — 국무장관 Forrestal 포레스털(James V. Forrestal) — 해군장관 Nimitz 니미츠(Chester W. Nimitz) — 해군원수, 태평양함대 총사령관 Harriman 해리먼(W. Averell Harriman) — 주소련 미국대사 Hopkins 홉킨스(Harry L. Hopkins) — 대통령 특별보좌관 Gardner 가드너(M. B. Gardner) — 해군소장"}, {"id": "d427", "order": 427, "date": "1945-08-12", "group": "C", "eyebrow": "d427 · Minutes of Twenty-First Meeting of the State-War-Navy Coordinating Committee, August 12, 1945", "title": "국무·육군·해군 3부조정위원회 제21차 회의록, 1945년 8월 12일", "badge": null, "list_right": "문서 427", "meta": [{"k": "일자", "v": "1945-08-12"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "SWNCC 제21차 회의록 [발췌]. 본문에서 SWNCC 21/5 및 SWNCC 21/6의 부속서를 참조한다.", "txt": true}, {"k": "발신", "v": "국무·육군·해군 3부조정위원회(SWNCC)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회의록"}], "links": [{"k": "FRUS", "text": "문서 427 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d427"}], "summary": "천황의 포고, 항복문서, 일반명령 제1호, 연합국최고사령관에 대한 훈령을 심의한 SWNCC 제21차 회의 발췌록 — 천황 포고와 항복문서·훈령은 수정 후 승인했으나, 일반명령 제1호는 제1항의 지역 배분(쿠릴, 류큐, 애드미럴티, 조선 등)에 대한 추가 검토를 위해 심의를 미루었다.", "points": ["매클로이: 전날 제20차 회의에서는 천황의 포고가 필요 없다고 보았으나, 국무장관과의 회의에서 천황이 항복문서에 서명할 필요는 없되 자기를 대신해 항복문서에 서명할 대표들에게 권한을 주는 포고를 발하기로 합의되었다.", "위원회는 수정을 붙여 천황 포고안을 승인했다(SWNCC 21/6 부속서 「D」).", "위원회는 4개국 대표 서명란을 두고 (a) 영국 초안에서 가져온 두 규정을 넣고 (b) 천황 포고 발령과 어긋나지 않게 수정한 뒤 항복문서를 승인했다(SWNCC 21/6 부속서 「A」).", "게이츠가 포레스털 해군장관의 서한을 언급하며 미·중·영·소 대표의 부서(副署)를 권고했고, 가드너 제독은 4개국 대표 서명이 처음부터 열강의 단결을 일본에 각인시킬 것이라고 지지했다.", "매클로이와 두먼은 이것이 정치적 문제이며, 부서를 두면 다른 열강이 항복문서뿐 아니라 최고사령관의 이후 모든 결정에도 사전 동의를 요구할 근거가 되어 최고사령관의 행동의 자유를 해칠 수 있다고 보았다.", "이 문제는 회의 내내 길게 논의되었고 회의가 끝난 뒤에야 대통령이 4개국 대표 서명란을 두도록 지시함으로써 해결되었다.", "던이 영국이 제안한 항복 조건 초안을 낭독했고, (a) 선박·항공기 및 기타 군용·민간 재산의 보존과 손상 방지, (b) 연합국 포로 및 민간인 억류자의 해방·보호·간호·부양에 관해 미국 초안에 없던 바람직한 규정이 있다고 합의되어 미국 초안에 반영되었다.", "가드너 제독은 일반명령 제1호 제1항의 항복 수령 지역 배분에 대한 추가 검토를 권고했고, 이와 관련해 쿠릴, 류큐, 애드미럴티, 그리고 조선 등이 특별히 논의되었다.", "던은 제1항의 지역 배분에 대한 추가 검토를 조건으로 일반명령 초안 규정이 국무부로서는 수용 가능하다고 밝혔다.", "위원회는 합동참모본부(JCS) 대표들이 검토·수정할 때까지 일반명령 제1호의 심의를 미루기로 합의했고, 던이 쿠릴에 관해 이루어진 약속에 대한 추가 자료를 얻기로 했다.", "위원회는 연합국최고사령관에 대한 훈령을 (a) 천황의 포고 서명 요구 반영, (b) 8월 11일 3개 동맹국에 보낸 통보의 문언에 더 가깝게 일치, (c) 4개국 대표의 수락 서명 허용 및 미국 대표로 니미츠 원수의 임석 규정, (d) 일반명령 발령 규정, (e) 기타 명확화 등으로 수정한 뒤 승인했다."], "primary": "1945년 8월 12일\n\n[발췌]\n\n**1. 일본 천황의 포고**\n\n매클로이 씨는, 천황에 의한 포고가 필요하지 않다고 여겨졌던 어제의 제20차 SWNCC 회의 이후, 국무장관과의 회의에서 다음과 같이 합의되었다고 진술했다 — 즉, 일본 천황은 항복문서에 서명할 것이 요구되지는 않으나, 자기를 대신하여 항복문서에 서명할 대표들에게 권한을 부여하는 포고를 발하여, 그 대표들이 이를 최고사령관에게 교부하고 일본 국민에게 공표하도록 하여야 한다는 것이다. 그는 포고 초안을 제시했다. 몇 가지 수정이 논의되고 합의되었다.\n\n위원회는 수정을 붙여 천황에 의한 포고 초안을 승인했다. (승인된 대로의 포고는 SWNCC 21/6의 부속서 「D」로 실려 있다.[주74])\n\n위원회는 4개국 대표의 서명을 위한 공간을 마련하고, (a) 영국 초안[주75]에서 가져온 두 규정을 포함시키며 (b) 천황에 의한 포고 발령과 어긋나지 않게 하는 수정을 가한 뒤, 항복문서를 승인했다. (승인된 항복문서는 SWNCC 21/6의 부속서 「A」로 실려 있다.[주76])\n\n**2. 항복문서 (SWNCC 21/5, 부속서 「A」[주77])**\n\n위원회는 이 문서를 검토했다. 게이츠 씨는 포레스털 장관이 국무장관에게 보낸 서한을 언급했는데, 그 서한은 이 문서의 수락에 미합중국·중국·[645면]영국·소련 대표가 부서(副署)할 것을 권고하고 있었다. 가드너 제독은 이 권고를 지지하여, 4개국 전부의 대표가 서명하는 것이 처음부터 일본인들에게 열강의 단결을 각인시키는 데 도움이 되리라고 진술했다. 매클로이 씨와 두먼 씨는 이것이 정치적 문제라고 보았으며, 만일 부서가 마련된다면 이는 다른 열강이 항복 문서들을 자기들이 승인할 뿐 아니라 최고사령관의 이후의 모든 결정에도 사전에 자기들의 동의를 받아야 한다고 고집할 근거가 되어, 최고사령관의 행동의 자유를 해칠 수 있다고 보았다. 이 문제는 회의 내내 길게 논의되었고, 회의가 끝난 뒤에야 — 항복의 때와 장소에 최고사령관과 함께 임석할 4개국 대표의 서명을 위한 공간을 마련하도록 대통령이 지시함으로써 — 해결되었다.\n\n던 씨는 영국이 제안한 항복 조건 초안을 낭독했다. 이 초안에는 (a) 선박·항공기 및 기타 군용·민간 재산의 보존과 손상으로부터의 보호, (b) 연합국 포로 및 민간인 억류자의 해방·보호·간호·부양에 관하여, 우리 초안에는 들어 있지 않은 바람직한 규정이 담겨 있다는 데 합의가 이루어졌다. 이와 유사한 규정들이 미합중국의 항복문서 초안에 편입되었다.\n\n위원회는 나아가 천황에 의한 포고 서명과 어긋나지 않도록 항복문서를 수정했다.\n\n**3. 일반명령 제1호 (SWNCC 21/5, 부속서 「B」[주78])**\n\n가드너 제독은 제1항에 규정된 대로 항복을 받기 위하여 여러 연합국 사령관에게 지역을 나누는 문제에 대해 추가 검토가 있어야 한다고 권고했다. 이와 관련하여 특히 쿠릴, 류큐, 애드미럴티, 그리고 조선 등이 논의되었다.\n\n던 씨는 제1항에 담긴 지역 배분에 대한 추가 검토를 조건으로 하여, 초안대로의 일반명령 규정이 국무부로서는 수용 가능하다고 진술했다.\n\n위원회는 합동참모본부(JCS) 대표들이 검토하고 필요하다고 여겨지는 수정을 가할 때까지 일반명령 제1호의 심의를 미루기로 합의했다. 또한 위원회가 이 문제를 다시 심의하기에 앞서 던 씨가 쿠릴에 관하여 이루어진 약속에 대한 추가 자료를 얻기로 합의되었다.\n\n**4. 연합국최고사령관에 대한 훈령 (SWNCC 21/5, 부속서 「C」[주79])**\n\n위원회는 다음과 같이 수정한 뒤 이 훈령을 승인했다. (a) 천황이 포고에 서명하여야 한다는 요건을 담도록, (b) [646면] 최고사령관이 항복 조건을 수락하고 조정하며 실시할 것을 제안했던 8월 11일 우리 3개 동맹국 앞 통보에 담긴 문언에 더 가깝게 일치하도록, (c) 4개국 대표에 의한 수락 서명을 허용하고 미합중국 대표로 니미츠 해군원수의 임석을 규정하도록, (d) 일반명령의 발령을 규정하도록, (e) 그 밖의 몇 가지 점에서 훈령을 명확히 하도록. (승인된 대로의 훈령은 SWNCC 21/6의 부속서 「C」로 실려 있다.[주80])", "secondary": "August 12, 1945\n\n[Extracts]\n\n1. Proclamation by the Emperor of Japan\n\nMr. McCloy stated that, after the 20th SWNCC meeting yesterday at which it was considered that no proclamation by the Emperor would be required, it had been agreed in a meeting with the Secretary of State that the Emperor of Japan, although not required to sign the instrument of surrender, should issue a proclamation authorizing representatives to sign the instrument of surrender on his behalf for delivery by them to the Supreme Commander and for publication to the people of Japan. He presented a draft proclamation. Certain revisions were discussed and agreed to.\n\nThe Committee approved the draft Proclamation by the Emperor, with amendments. (The Proclamation, as approved, appears as Enclosure “D” of SWNCC 21/6. [주74] )\n\nThe Committee approved the Instrument of Surrender, after providing space for signature by the representatives of the four powers and amending it (a) to include the two provisions taken from the British draft [주75] and (b) to be consistent with the issuance of a proclamation by the Emperor. (The approved Instrument of Surrender appears as Enclosure “A” of SWNCC 21/6. [주76] )\n\n2. Instrument of Surrender (SWNCC 21/5, Enclosure “A” [주77] )\n\nThe Committee reviewed this document. Mr. Gates referred to a letter from Secretary Forrestal to the Secretary of State recommending that acceptance of the instrument be countersigned by the United [645면] States, Chinese, United Kingdom and Soviet representatives. Admiral Gardner stated, in support of this recommendation, that signature by representatives of all four powers would serve to impress upon the Japanese from the beginning the unity of the powers. Mr. McCloy and Mr. Dooman felt that this is a political matter and that, if counter signatures were provided, this might form the basis for insistence by the other powers not only that they pass on the surrender documents but also that every subsequent decision of the Supreme Commander be concurred in by them in advance, thus prejudicing his freedom of action. This question was discussed at length throughout the meeting and was not resolved until after the meeting when provision of spaces for signature by representatives of the four powers, who will be present with the Supreme Commander at the time and place of surrender, was directed by the President.\n\nMr. Dunn read a draft of surrender terms proposed by the British. It was agreed that this draft contained desirable provisions not contained in our draft with respect to (a) the preservation and saving from damage of ships, aircraft and other military and civil property and (b) the liberation, protection, care and maintenance of allied prisoners of war and civilian internees. Similar provisions were incorporated in the United States draft instrument of surrender.\n\nThe Committee further revised the instrument of surrender to make it consistent with the signing of a proclamation by the Emperor.\n\n3. General Order No. 1 (SWNCC 21/5, Enclosure “B” [주78] )\n\nAdmiral Gardner recommended that further study be given to the division of areas for the purposes of surrender to various allied commanders as provided in paragraph I. The Kuriles, Ryukyus, the Admiralties and Korea, among others, were specifically discussed in this connection.\n\nMr. Dunn stated that the provisions of the General Order as drafted were acceptable to the State Department, subject to further study of the allocation of areas contained in paragraph I.\n\nThe Committee agreed to defer consideration of General Order No. 1 until it has been reviewed and revised as deemed necessary by representatives of the Joint Chiefs of Staff. It was agreed that Mr. Dunn would obtain further data as to commitments made as to the Kuriles prior to further consideration of the matter by the Committee.\n\n4. Directive to Supreme Commander of the Allied Powers (SWNCC 21/5, Enclosure “C” [주79] )\n\nThe Committee approved the directive after revising it: (a) to cover the requirement that the Emperor sign a proclamation; (b) to [646면] conform more closely to the language contained in the communications addressed to our three allies on 11 August wherein it was proposed that the Supreme Commander accept, coordinate and carry out surrender terms; (c) to permit signing of the acceptance by the representatives of the four powers and to provide for the presence of Fleet Admiral Nimitz as U.S. representative; (d) to provide for the issuance of general orders; and (e) to clarify the directive in certain other respects. (The directive, as approved, appears as Enclosure “C”, SWNCC 21/6. [주80] )", "notes": ["[주74] 8월 12일. 맥아더 장군에 대한 훈령의 부속문서 1, 648면 참조.", "[주75] 앞의 642면.", "[주76] 맥아더 장군에 대한 훈령의 부속문서 2, 649면 참조.", "[주77] 8월 11일. 수록하지 않음.", "[주78] 8월 11일, 635면.", "[주79] 8월 11일. 수록하지 않음.", "[주80] 트루먼 대통령이 서명한 대로의 본문은 647면 참조."], "note": "번역자 주 — 발췌본([Extracts])이므로 회의의 전부가 아니다. 발언자를 살려 옮겼다. 항·호 번호(1.~4., (a)~(e))는 원문 그대로 유지했다. 제3항에서 조선(Korea)이 쿠릴·류큐·애드미럴티와 나란히 '항복 수령 지역 배분'의 검토 대상으로 거명된 대목이 이 회의록에서 조선과 가장 직접 닿는다 — 다만 여기서는 거명될 뿐 38도선 분할 같은 결론은 나오지 않으며, 위원회는 JCS 검토까지 심의를 미루었다. 원문의 'counter signatures'는 「부서(副署)」로 옮겼다. 회의 개최 시각은 원문에 없다.", "warn": false, "pages": ["644", "645", "646"], "search": "McCloy 매클로이(John J. McCloy) — 육군차관 Gates 게이츠(Artemus L. Gates) — 해군 측 위원 Forrestal 포레스털(James V. Forrestal) — 해군장관 Gardner 가드너(Matthias B. Gardner) 제독 Dooman 두먼(Eugene H. Dooman) Dunn 던(James C. Dunn) — 국무부 Nimitz 니미츠(Chester W. Nimitz) — 해군원수 MacArthur 맥아더(Douglas MacArthur) — 각주에 언급 Truman 트루먼 — 대통령"}, {"id": "d428", "order": 428, "date": "1945-08-13", "group": "A", "eyebrow": "d428 · The Secretary of State to the Minister in Switzerland (Harrison)", "title": "국무장관이 주스위스 공사(해리슨)에게", "badge": null, "list_right": "문서 428", "meta": [{"k": "일자", "v": "1945-08-13"}, {"k": "시각", "v": "Washington, August 13, 1945—9 a.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "2520"}, {"k": "원문출처", "v": null, "txt": true}, {"k": "발신", "v": "국무장관 번스(James F. Byrnes)", "txt": true}, {"k": "수신", "v": "주스위스 공사 해리슨(Harrison)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 428 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d428"}], "summary": "일본의 회답이 단순한 무조건 수락이면 평문으로, 조건이 붙으면 암호로 보내라고 스위스 정부에 알리고, 회답을 받는 즉시 해리슨에게 보여 주어 그가 판단하게 하라는 훈령.", "points": ["워싱턴 주재 스위스 공사관이 이날 이른 아침, 8월 11일 미국 측의 일본 무조건 항복 제의에 대한 일본 정부의 회답을 받게 될 경우 그것을 암호로 보내야 하는지 평문으로 보내야 하는지 문의했다.", "회답이 우리 제의에 대한 단순한 무조건 수락이면 평문으로 보내도 된다.", "반대로 일본의 회답에 조건이 포함되면 암호로 보내야 한다.", "해리슨은 스위스 정부에 대해, 전문을 접수하는 즉시 그에게 보여 주고 위 고려에 따라 암호화가 필요한지 여부를 그가 판단하게 해 달라고 요청할 것."], "primary": "워싱턴, 1945년 8월 13일 — 오전 9시.\n\n2520. 워싱턴 주재 스위스 공사관이 오늘 이른 아침, 일본의 무조건 항복을 위한 8월 11일 우리의 제의에 대하여 일본 정부로부터 회답을 받게 될 경우 스위스 정부가 그것을 암호로 보내야 하는지 평문으로 보내야 하는지를 문의해 왔다. 즉시 [스위스] 정치부에 다음과 같이 알리라. 만일 그 회답이 우리 제의에 대한 단순한 무조건 수락이라면 평문으로 보내도 좋다. 반대로 만일 일본의 회답이 조건을 포함하는 것이라면 그것은 암호로 보내져야 한다. 나는 귀하가 스위스 정부에 대하여, 그 전문을 접수하는 즉시 귀하에게 보여 주고, 앞서 말한 고려에 근거하여 그 회답을 암호화할 필요가 있는지 여부를 귀하가 판단하도록 해 달라고 요청할 것을 바란다.\n\n번스", "secondary": "Washington, August 13, 1945—9 a.m.\n\n2520. The Swiss Legation in Washington early this morning inquired whether the Swiss Government should send in code or in clear any reply that may be received from the Japanese Government to our proposal of August 11 for Japan’s unconditional surrender. Please immediately inform the Political Department that if the reply should be a simple unconditional acceptance of our proposal it may be sent in clear. If on the other hand the Japanese reply should involve conditions it should be sent in code. I desire you to request the Swiss Government to show you the message immediately upon its receipt and to let you determine on the basis of foregoing considerations whether the reply need be coded or not.\n\nByrnes", "notes": [], "note": "번역자 주 — 발신 시각 오전 9시를 살렸다. 'Political Department'는 스위스 연방정치부(외무 담당)를 가리키므로 「[스위스] 정치부」로 옮겼다. 원문의 'may be sent in clear'(평문으로 보내도 좋다)와 'should be sent in code'(암호로 보내져야 한다)의 조동사 차이를 살렸다.", "warn": false, "pages": ["646"], "search": "Byrnes 번스(James F. Byrnes) — 국무장관, 발신자 Harrison 해리슨(Leland Harrison) — 주스위스 공사, 수신자"}, {"id": "d429", "order": 429, "date": "1945-08-13", "group": "A", "eyebrow": "d429 · The Minister in New Zealand (Patton) to the Secretary of State", "title": "주뉴질랜드 공사(패튼)가 국무장관에게", "badge": null, "list_right": "문서 429", "meta": [{"k": "일자", "v": "1945-08-13"}, {"k": "시각", "v": "Wellington, August 13, 1945—2 p.m. [Received August 13—6:12 a.m.]"}, {"k": "장소", "v": "Wellington", "txt": true}, {"k": "전문번호", "v": "401"}, {"k": "원문출처", "v": null, "txt": true}, {"k": "발신", "v": "주뉴질랜드 공사 패튼(Patton)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 429 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d429"}], "summary": "뉴질랜드 외무부의 견해는 천황을 권좌에 존속시키는 약속을 해서는 안 되며 왕좌를 정점으로 한 봉건제 구조 전체를 뿌리 뽑아야 한다는 것이고, 뉴질랜드의 일반적 태도도 천황 존속에 반대한다는 보고.", "points": ["1. 외무부 차관 소속 관리가 공사관에 알린 바로는, 일본에 부과할 항복 조건에 관한 [뉴질랜드 외무]부의 견해는 천황을 권좌에 존속시킬 약속을 해서는 안 되며, 왕좌가 그 정점(capstone)인 봉건제 구조 전체가 뿌리 뽑혀야 한다는 것이다.", "2. 이 관리는 태평양에서의 영국의 이해가 주로 전전(戰前) 식민지의 회복에 미치며 전후 일본 관리에서 무거운 군사적 부담을 떠맡을 뜻은 없다고 단언했다. 따라서 영국은 손쉬운 해결책으로 천황 존속에 찬성한다는 것이다.", "3. 외무부 장관은 제1항에 진술된 자기 부처의 견해에 사의를 표하면서도, 천황 제거가 적절한 해결책이 되리라고는 개인적으로 확신하지 못한다고 말했다.", "4. 다른 접촉들도 뉴질랜드의 일반적 태도가 천황 존속에 반대하는 것임을 확인해 주는 듯하다."], "primary": "웰링턴, 1945년 8월 13일 — 오후 2시.\n[접수 8월 13일 — 오전 6시 12분]\n\n401. 1. 공사관은 외무부 차관(Deputy of External Affairs) 소속 관리로부터, 일본에 부과되는 항복 조건에 관한 [외무]부의 견해는 천황을 권좌에 존속시키게 될 약속은 하지 말아야 하며 왕좌가 그 정점(頂石)을 이루는 봉건제 구조 전체가 뿌리 뽑혀야 한다는 것이라고 통보받았다.\n\n2. 이 관리는, 태평양에서의 영국의 이해는 주로 전전(戰前) 식민지의 회복에 미치는 것이며 전후 일본의 관리에서 무거운 군사적 부담을 떠맡으려는 뜻은 없다고 단언했다. 따라서 영국은 손쉬운 해결책으로서 천황의 존속에 찬성한다는 것이다.\n\n3. 외무부 장관은 제1항에 진술된 [647면] 자기 부처의 견해에 사의를 표하면서도, 천황의 제거가 적절한 해결책을 제공하리라고는 개인적으로 확신하지 못한다고 말했다.\n\n4. 다른 접촉들도 뉴질랜드에서의 일반적 태도가 천황의 존속에 반대하는 것임을 확인해 주는 듯하다.\n\n패튼", "secondary": "Wellington, August 13, 1945—2 p.m. \n [Received August 13—6:12 a.m.]\n\n401. 1. Legation informed by officer of Deputy of External Affairs that viewpoint of Department on surrender terms imposed on Japan is that commitments should not be made which would perpetuate Emperor in power but that whole structure of feudalism of which throne is capstone should be eradicated.\n\n2. This official declared that British interest in Pacific extended primarily to recovery of prewar colonies with no desire to assume heavy military commitments in postwar control of Japan. Consequently British approve retention of Emperor as easy solution.\n\n3. Secretary of External Affairs, while expressing appreciation of [647면] his Department’s views as stated in paragraph 1, said that he personally unconvinced that elimination of Emperor will provide proper solution.\n\n4. Other contacts seem to confirm that general attitude in New Zealand is opposition to retention of Emperor.\n\nPatton", "notes": [], "note": "번역자 주 — 발신 오후 2시, 접수 오전 6시 12분을 살렸다. 전보 특유의 관사 생략 문체(telegraphese)라 문장이 압축되어 있으나 임의로 풀어 쓰지 않고 직역에 가깝게 옮겼다. 'officer of Deputy of External Affairs'는 원문 표기가 압축되어 있어 정확한 직명이 불분명하다 — 뉴질랜드 외무부 차관실 소속 관리로 보아 옮겼고, 이 때문에 confidence를 medium으로 두었다. 'capstone'은 건축의 갓돌 비유이므로 「정점(頂石)」으로 옮겼다.", "warn": true, "pages": ["646", "647"], "search": "Patton 패튼(Charles E. Patton) — 주뉴질랜드 미국 공사, 발신자"}, {"id": "d430", "order": 430, "date": "1945-08-13", "group": "B", "eyebrow": "d430 · The Swiss Legation to the Department of State", "title": "스위스 공사관이 국무부에게", "badge": null, "list_right": "문서 430", "meta": [{"k": "일자", "v": "1945-08-13"}, {"k": "시각", "v": "본문에 스위스 시간 기준 시각들이 있다: 8월 11일 21시 00분(베른 정치국 접수), 21시 30분(일본 공사에게 전달), 23시 24분(일본 공사의 도쿄행 전보 발송), 8월 12일 08시 00분(오사카국의 재송 요청), 09시 35분(수신 확인). 문서 자체의 발신 시각은 없음."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 PW/8–1345", "txt": true}, {"k": "발신", "v": "스위스 공사관(The Swiss Legation)", "txt": true}, {"k": "수신", "v": "국무부(The Department of State)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 430 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d430"}], "summary": "미국의 회답이 8월 13일 아침에야 도쿄에 도착했다는 도메이통신 보도가 사실이 아님을 스위스 정치국이 분 단위 전달 시각으로 반박한 각서.", "points": ["국무차관 그루가 8월 13일 오전 스위스 대리대사 그레슬리에게 전화로 문의한 데 대한 회답.", "문제된 도메이통신 보도: 미국의 회답이 일본 시간 8월 13일 월요일 아침에야 도쿄에 접수되었다는 것.", "베른 정치국의 전문에 따르면 도메이 보도는 두 가지 점에서 허위다. 첫째, 미국의 회답은 도쿄 주재 스위스 공사관을 통해 일본 정부에 전달된 것이 아니라 베른 주재 일본 공사관을 거쳐 보내졌다. 둘째, 도메이가 제시한 시간표가 부정확하다.", "실제 시각(스위스 시간): 8월 11일 21시 00분 워싱턴 주재 스위스 공사관의 전문이 베른 정치국에 접수.", "같은 날 21시 30분 일본 공사에게 전달.", "같은 날 23시 24분 일본 공사의 도쿄행 전보 발송.", "8월 12일 08시 00분 오사카국이 전보의 재송을 요청, 09시 35분 정히 수신되었음을 확인."], "primary": "각서\n\n국무차관 조지프 그루 씨가 8월 13일 오전 스위스 대리대사 막스 그레슬리 씨와 전화로 행한 문의 — 일본의 항복 제의에 대한 미국의 회답이 일본 시간으로 1945년 8월 13일 월요일 아침에야 도쿄에 접수되었다는 도메이통신(Domei News Agency) 보도에 관한 것 — 에 대하여, 본 공사관은 베른의 정치국(Political Department)으로부터 다음의 세부 사항을 접수하였다:\n\n정치국의 전문에 따르면, 도메이통신의 보도는 두 가지 점에서 허위이다. 첫째, 미국의 회답은 도쿄 주재 스위스 공사관의 중개를 통하여 일본 정부에 전달된 것이 아니라 베른 주재 일본 공사관을 경유하여 보내졌다. 둘째, 도메이통신이 제시한 시간표가 부정확하다.\n\n미국의 회답을 담은 워싱턴 주재 스위스 공사관의 전문은 8월 11일 스위스 시간 21시 00분에 베른의 정치국에 접수되었다. 그것은 스위스 시간 21시 30분에 일본 공사에게 전달되었으며, 일본 공사의 도쿄행 전보는 같은 날 23시 24분에 발송되었다. 오사카국(station Osaka)은 8월 12일 오전 스위스 시간 08시 00분에 그 전보의 재송(再送)을 요청하였고, 스위스 시간 09시 35분에 그 전보가 정히 수신되었음을 확인하였다.\n\n[워싱턴,] 1945년 8월 13일.", "secondary": "Memorandum\n\nWith regard to the inquiry which Mr. Joseph Grew, Under Secretary of State, made by telephone with Mr. Max Graessli, Chargé d’Affaires ad interim of Switzerland, on the morning of August 13 in respect to a Domei News Agency dispatch according to which the American reply to the Japanese offer of surrender was received in Tokyo only on Monday morning, August 13, 1945, Japanese time, the Legation has received the following details from the Political Department in Berne:\n\nIt is stated in a cable from the Political Department that the Domei News Agency report is false in two respects; first, the American answer was not relayed to the Japanese Government through the intermediary of the Swiss Legation in Tokyo, but was sent by way of the Japanese Legation in Berne, and second, the time schedule given by Domei Agency is incorrect.\n\nThe cable from the Swiss Legation in Washington containing the American reply was received at the Political Department in Berne on August 11 at 21.00 Swiss time. It was communicated to the Japanese Minister at 21.30 Swiss time, and the Japanese Minister’s cable to Tokyo was dispatched on the same day at 23.24 Swiss time. The station Osaka on the morning of August 12, at 08.00 Swiss time, requested a repetition of the cable and at 09.35 Swiss time confirmed that the cable had been duly received.\n\n[Washington,] August 13, 1945.", "notes": [], "note": "번역자 주 — 원문은 성을 「Graessli」로 표기했다(다른 문서에서는 「Grässli」). 스위스 시간(21.00, 23.24 등)의 마침표 구분은 한국어 관례에 따라 「21시 00분」 식으로 옮겼으나 수치는 원문 그대로다. 「station Osaka」는 무선 중계국을 가리키는 것으로 보이나 원문에 설명이 없어 직역했다.", "warn": false, "pages": ["647"], "search": "Grew 그루(Joseph C. Grew, 국무차관) Graessli / Grässli 그레슬리(Max Grässli, 스위스 대리대사)"}, {"id": "d431", "order": 431, "date": "1945-08-14", "group": "B", "eyebrow": "d431 · President Truman to General of the Army Douglas MacArthur  Photostatic copy transmitted to the Department by the Acting Secretary of the State-War-Navy Coordinating Committee on August 14, 1945. Circulated as SWNCC 21/6, August 13, after President Truman’s approval on August 12.", "title": "트루먼 대통령이 육군원수 더글러스 맥아더 장군에게", "badge": null, "list_right": "문서 431", "meta": [{"k": "일자", "v": "1945-08-14"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "SWNCC 21/6 (1945년 8월 13일 배포). 국무·육군·해군 3부조정위원회 사무국장 대리가 1945년 8월 14일 국무부에 전달한 사진 복제본 ([주81])", "txt": true}, {"k": "발신", "v": "트루먼 대통령(Harry S. Truman)", "txt": true}, {"k": "수신", "v": "육군원수 더글러스 맥아더 대장", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 431 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d431"}], "summary": "트루먼이 맥아더를 연합국최고사령관(SCAP)으로 지명하는 지령과 그 부속서인 일본 천황의 조서안 및 항복문서안.", "points": ["미·중·영·소 4개국 정부의 합의에 따라, 일본의 항복을 집행할 목적으로 맥아더를 연합국최고사령관(SCAP)으로 지명한다.", "맥아더는 천황이 서명한, 대표들에게 항복문서 서명을 위임하는 조서의 발포를 요구하며, 정당하게 위임받은 천황·일본 정부·대본영 대표로부터 서명된 항복문서를 요구·접수한다.", "맥아더는 4개 관계국을 위하여, 그리고 대일 교전 중인 그 밖의 연합국의 이익을 위하여 항복을 접수한다.", "대통령은 중국·영국·소련 국가원수에게 각각 항복 시각·장소에 입회할 대표를 지명하도록 요청했고, 미국 대표로는 체스터 W. 니미츠 해군원수를 지명했다.", "항복 접수 후 맥아더는 대본영에 대하여, 어디에 있든 일본군 지휘관들에게 항복 절차와 세부사항을 지시하는 일반명령을 발하도록 요구한다.", "항복의 순간부터 국가를 통치하는 천황과 일본 정부의 권한은 최고사령관에게 종속되며(subject to you), 최고사령관은 항복 조항 실시를 위해 적절하다고 인정하는 조치를 취한다.", "맥아더는 관계 연합국이 일본에서의 항복 조항 집행을 위해 할당하는 모든 육·해·공군에 대하여 최고 지휘권을 행사한다.", "연합국최고사령관 임명은 이 지령의 접수와 동시에 효력을 발생한다.", "[부속서 1] 천황 조서안 — 포츠담선언 조항을 수락하고, 일본 제국정부와 대본영에 자신을 대신하여 항복문서에 서명하고 일반명령을 발할 것을 명하며, 전 국민에게 즉시 적대행위를 중지하고 무장을 해제하며 항복문서와 일반명령의 모든 규정을 충실히 이행할 것을 명한다.", "[부속서 2] 항복문서안 — 대본영과 어디에 있든 모든 일본 무장병력 및 일본 통제하의 모든 무장병력의 연합국에 대한 무조건 항복 선언, 즉시 적대행위 중지와 선박·항공기·군용 및 민간 재산의 보존, 연합국 포로·민간 억류자의 즉시 해방과 보호·수송, 그리고 국가를 통치하는 천황과 일본 정부의 권한이 연합국최고사령관에게 종속한다는 조항.", "항복문서 말미에는 서명 일자·장소가 공란으로 남아 있고, 천황·일본 정부 및 대본영 대표 서명란과 연합국최고사령관 및 미·중·영·소 4개국 대표 서명란이 있다."], "primary": "1945년 8월 14일\n\n**연합국최고사령관에 대한 지령**\n\n일본의 항복을 집행할 목적으로 연합국최고사령관을 지명한다는 미합중국, 중화민국, 영국 및 [648면] 소비에트사회주의공화국연방 정부 사이의 합의에 따라, 귀관은 이로써 연합국최고사령관으로 지명된다.\n\n귀관은 천황이 서명한, 그 대표들에게 항복문서에 서명할 권한을 부여하는 조서(proclamation)의 발포를 요구할 것이다. 서명될 조서는 실질적으로 이에 첨부된 형식에 따른 것이어야 한다. 귀관은 일본 천황, 일본 정부 및 일본 대본영의 정당하게 위임받은 대표들로부터 서명된 항복문서를 요구하고 접수하기 위하여 필요한 조치를 취할 것이다. 항복문서의 문안은 이에 첨부되어 있다. 귀관은 관계 4개국 정부를 위하여, 그리고 일본과 교전 중인 그 밖의 연합국(United Nations)의 이익을 위하여 항복을 접수할 것이다.\n\n본인은 중국, 영국 및 소비에트사회주의공화국연방의 국가원수 각각에게, 항복의 시각과 장소에 귀관과 함께 입회할 대표 1인을 지명하도록 요청하였다. 본인은 이 목적을 위한 미합중국 대표로서 입회하도록 체스터 W. 니미츠 해군원수를 지명하였다. 나머지 지명을 접수하는 대로 귀관에게 통보될 것이다. 귀관은 적절한 준비를 할 것이다.\n\n일본 무장병력의 전반적 항복을 접수한 후, 귀관은 일본 대본영에 대하여, 어디에 있든 일본군 지휘관들에게 항복의 절차 및 항복을 실시하는 그 밖의 세부사항을 지시하는 일반명령을 발하도록 요구할 것이다. 귀관은 해외의 일본 무장병력이 관계 연합국 사령관들에게 항복하는 것에 관하여 일본 대본영과 필요한 준비의 조정을 행할 것이다.\n\n항복의 순간부터, 국가를 통치하는 천황 및 일본 정부의 권한은 귀관에게 종속될 것이며, 귀관은 항복 조항을 실시하기 위하여 적절하다고 인정하는 조치를 취할 것이다.\n\n귀관은 관계 연합국이 일본에서의 항복 조항 집행을 위하여 할당하는 모든 육군, 해군 및 공군에 대하여 최고 지휘권을 행사할 것이다.\n\n연합국최고사령관으로서의 귀관의 임명은 이 지령의 접수와 동시에 효력을 발생한다.\n\n해리 S. 트루먼\n\n[부속서 1]\n\n**일본 천황의 조서**\n\n1945년 7월 26일 포츠담에서 미합중국, 영국 및 중국 정부 수반이 [649면] 발표하고 뒤에 소비에트사회주의공화국연방이 참가한 선언에 제시된 조항을 수락하여, 짐은 일본 제국정부 및 일본 대본영에 대하여 짐을 대신하여 연합국최고사령관이 제시한 항복문서에 서명할 것과, 연합국최고사령관의 지시에 따라 육군 및 해군 병력에 일반명령을 발할 것을 명하였다. 짐은 짐의 모든 신민에게 즉시 적대행위를 중지하고, 무기를 내려놓으며, 항복문서 및 그에 따라 일본 대본영이 발하는 일반명령의 모든 규정을 충실히 이행할 것을 명한다.\n\n[부속서 2]\n\n**항복문서**\n\n우리는 일본 천황, 일본 정부 및 일본 대본영의 명에 의하여 또한 이를 대신하여, 1945년 7월 26일 포츠담에서 미합중국, 중국 및 영국 정부 수반이 발표하고 뒤에 소비에트사회주의공화국연방이 참가한 선언에 제시된 규정을 이에 수락한다. 이하 이 4개국을 연합국(the Allied Powers)이라 칭한다.\n\n우리는 이에 일본 대본영과 어디에 있든 모든 일본 무장병력 및 일본 통제하에 있는 모든 무장병력의 연합국에 대한 무조건 항복을 선언한다.\n\n우리는 이에 어디에 있든 모든 일본군 및 일본 국민에게 즉시 적대행위를 중지하고, 모든 선박, 항공기, 군용 및 민간 재산을 보존하여 손상으로부터 지키며, 연합국최고사령관 또는 그의 지시에 따른 일본 정부 기관이 부과하는 모든 요구에 응할 것을 명한다.\n\n우리는 이에 일본 대본영에 대하여, 어디에 있든 모든 일본군 및 일본 통제하에 있는 모든 병력의 지휘관들에게 그들 자신과 그들의 통제하에 있는 모든 병력이 무조건 항복하도록 하는 명령을 즉시 발할 것을 명한다.\n\n우리는 이에 모든 문관, 육군 및 해군 관리에게, 연합국최고사령관이 이 항복을 실시하기 위하여 적절하다고 인정하여 그가 발하거나 그의 권한 아래 발해진 모든 포고, 명령 및 지령에 복종하고 이를 집행할 것을 명하며, 또한 그러한 모든 관리에게 그 또는 그의 권한에 의하여 특별히 해임되지 아니하는 한 그 직위에 머물러 비전투 임무를 계속 수행할 것을 지시한다.\n\n[650면]\n\n우리는 이에 천황, 일본 정부 및 그 승계자를 위하여, 포츠담선언의 규정을 성실히 이행할 것과, 그 선언에 효력을 부여할 목적으로 연합국최고사령관 또는 연합국이 지명하는 그 밖의 대표가 요구하는 어떠한 명령이든 발하고 어떠한 조치든 취할 것을 약속한다.\n\n우리는 이에 일본 제국정부 및 일본 대본영에 대하여, 현재 일본의 통제하에 있는 모든 연합국 포로 및 민간 억류자를 즉시 해방하고, 그들의 보호, 간호, 부양 및 지시된 장소로의 즉시 수송을 마련할 것을 명한다.\n\n국가를 통치하는 천황 및 일본 정부의 권한은 연합국최고사령관에게 종속한다. 최고사령관은 이 항복 조항을 실시하기 위하여 적절하다고 인정하는 조치를 취할 것이다.\n\n1945년 . . . . . 월 . . . . . 일 . . . . . 시(時) . . . . . . . 에서 서명함.\n\n_____________________________________________________\n\n일본 천황 및 일본 정부의 명에 의하여 또한 이를 대신하여.\n\n_____________________________________________________\n\n일본 대본영의 명에 의하여 또한 이를 대신하여.\n\n1945년 . . . . . 월 . . . . . 일 . . . . . 시 . . . . . . . 에서, 미합중국, 중화민국, 영국 및 소비에트사회주의공화국연방을 위하여, 그리고 일본과 교전 중인 그 밖의 연합국의 이익을 위하여 수락함.\n\n_____________________________________________________\n\n연합국최고사령관.\n\n________________________\n\n미합중국 대표\n\n________________________\n\n중화민국 대표\n\n________________________\n\n영국 대표\n\n________________________\n\n소비에트사회주의공화국연방 대표", "secondary": "August 14, 1945\n\nDirective to the Supreme Commander for the Allied Powers\n\nIn accordance with the agreement among the Governments of the United States, Chinese Republic, United Kingdom, and Union of [648면] Soviet Socialist Republics to designate a Supreme Commander for the Allied Powers for the purpose of enforcing the surrender of Japan, you are hereby designated as the Supreme Commander for the Allied Powers.\n\nYou will require the issuance of a proclamation signed by the Emperor authorizing his representatives to sign the instrument of surrender. The proclamation to be signed should be substantially in the form appended hereto. You will take the necessary steps to require and receive from the duly authorized representatives of the Japanese Emperor, the Japanese Government, and the Japanese Imperial General Headquarters the signed instrument of surrender. The text of the instrument of surrender is appended hereto. You will accept the surrender for the four Governments concerned and in the interests of the other United Nations at war with Japan.\n\nI have asked the heads of state of China, Great Britain and the Union of Soviet Socialist Republics each to designate a representative who may be present with you at the time and place of surrender. I have designated Fleet Admiral Chester W. Nimitz to be present as the United States representative for this purpose. As soon as I have received the other designations you will be advised. You will make the appropriate arrangements.\n\nHaving accepted the general surrender of Japanese armed forces, you will require the Japanese Imperial General Headquarters to issue general orders which will instruct Japanese commanders wherever situated as to the mechanics of surrender and other details effectuating the surrender. You will effect any necessary coordination of arrangements with the Japanese Imperial General Headquarters with regard to the surrenders to the Allied Commanders concerned of Japanese armed forces abroad.\n\nFrom the moment of surrender, the authority of the Emperor and Japanese Government to rule the state will be subject to you and you will take such steps as you deem proper to effectuate the surrender terms.\n\nYou will exercise supreme command over all land, sea and air forces which may be allocated for enforcement in Japan of the surrender terms by the Allied Powers concerned.\n\nYour appointment as Supreme Commander for the Allied Powers is effective upon receipt of this directive.\n\nHarry S. Truman\n\n[Enclosure 1]\n\nProclamation by the Emperor of Japan\n\nAccepting the terms set forth in the Declaration issued by the heads of the Governments of the United States, Great Britain and China [649면] on July 26, 1945, at Potsdam and subsequently adhered to by the Union of Soviet Socialist Republics, I have commanded the Japanese Imperial Government and the Japanese Imperial General Headquarters to sign on my behalf the instrument of surrender presented by the Supreme Commander for the Allied Powers and to issue General Orders to the Military and Naval forces in accordance with the direction of the Supreme Commander for the Allied Powers. I command all my people forthwith to cease hostilities, to lay down their arms and faithfully to carry out all the provisions of the instrument of surrender and the General Orders issued by the Japanese Imperial General Headquarters thereunder.\n\n[Enclosure 2]\n\nInstrument of Surrender\n\nWe, acting by command of and in behalf of the Emperor of Japan, the Japanese Government and the Japanese Imperial General Headquarters, hereby accept the provisions set forth in the declaration issued by the heads of the Governments of the United States, China and Great Britain on 26 July 1945 at Potsdam, and subsequently adhered to by the Union of Soviet Socialist Republics, which four powers are hereafter referred to as the Allied Powers.\n\nWe hereby proclaim the unconditional surrender to the Allied Powers of the Japanese Imperial General Headquarters and of all Japanese armed forces and all armed forces under Japanese control wherever situated.\n\nWe hereby command all Japanese forces wherever situated and the Japanese people to cease hostilities forthwith, to preserve and save from damage all ships, aircraft, and military and civil property and to comply with all requirements which may be imposed by the Supreme Commander for the Allied Powers or by agencies of the Japanese Government at his direction.\n\nWe hereby command the Japanese Imperial General Headquarters to issue at once orders to the Commanders of all Japanese forces and all forces under Japanese control wherever situated to surrender unconditionally themselves and all forces under their control.\n\nWe hereby command all civil, military and naval officials to obey and enforce all proclamations, orders and directives deemed by the Supreme Commander for the Allied Powers to be proper to effectuate this surrender and issued by him or under his authority and we direct all such officials to remain at their posts and continue to perform their non-combatant duties unless specifically relieved by him or under his authority.\n\n[650면]\n\nWe hereby undertake for the Emperor, the Japanese Government and their successors to carry out the provisions of the Potsdam Declaration in good faith, and to issue whatever orders and take whatever action may be required by the Supreme Commander for the Allied Powers or by any other designated representative of the Allied Powers for the purpose of giving effect to that Declaration.\n\nWe hereby command the Japanese Imperial Government and the Japanese Imperial General Headquarters at once to liberate all allied prisoners of war and civilian internees now under Japanese control and to provide for their protection, care, maintenance and immediate transportation to places as directed.\n\nThe authority of the Emperor and the Japanese Government to rule the state shall be subject to the Supreme Commander for Allied Powers who will take such steps as he deems proper to effectuate these terms of surrender.\n\nSigned at . . . . . . . at . . . . . on the . . . . . day of . . . . ., 1945.\n_____________________________________________________ \n By Command and in behalf of the Emperor of Japan and the Japanese Government. \n _____________________________________________________ \n By Command and in behalf of the Japanese Imperial General Headquarters. \n Accepted at . . . . . . . at . . . . . on the . . . . . day of . . . . .,\n1945, for the United States, Republic of China, United Kingdom and\nthe Union of Soviet Socialist Republics, and in the interests of the\nother United Nations at war with Japan.\n_____________________________________________________ \n Supreme Commander for the Allied Powers. \n ________________________ \n United States Representative \n ________________________ \n Republic of China Representative \n ________________________ \n United Kingdom Representative \n ________________________ \n Union of Soviet Socialist Republics Representative", "notes": ["[주81] 국무·육군·해군 3부조정위원회 사무국장 대리가 1945년 8월 14일 국무부에 전달한 사진 복제본(photostatic copy). 1945년 8월 12일 트루먼 대통령의 승인 후 8월 13일 SWNCC 21/6으로 배포되었다."], "note": "번역자 주 — 「Signed at … at … on the … day of …, 1945.」의 공란 점선은 원문 그대로 두었다(서식상 미기입 상태). 「Supreme Commander for the Allied Powers」는 연합국최고사령관(SCAP), 「Japanese Imperial General Headquarters」는 대본영으로 옮겼다. 부속서 1의 「Proclamation」은 천황 명의 문서이므로 「조서」로 옮기되 지령 본문 첫 언급에 원어를 병기했다. 조서 본문의 1인칭 「I」는 천황 문서의 관례에 따라 「짐」으로 옮겼고, 「all my people」은 「짐의 모든 신민」으로 옮겼다. 지령의 will(~할 것)과 항복문서의 shall(~한다)의 구분을 유지했다. 이 문서는 확정 조인문(1945년 9월 2일)이 아니라 8월 12~13일 단계의 초안임에 유의.", "warn": false, "pages": ["647", "648", "649", "650"], "search": "Truman 트루먼(Harry S. Truman) — 미국 대통령 Douglas MacArthur 더글러스 맥아더 — 육군원수, 연합국최고사령관(SCAP) 지명 Chester W. Nimitz 체스터 W. 니미츠 — 해군원수, 항복 조인식 미국 대표 Emperor of Japan 일본 천황 — 히로히토(원문은 이름을 적지 않음)"}, {"id": "d432", "order": 432, "date": "1945-08-13", "group": "B", "eyebrow": "d432 · The Australian Legation to the Department of State  Notation by Mr. Dunn on August 14: “This was sent to me by the Secretary. I have read it but I do not see anything to be done about it.” Notation by the Chief of the Division of Japanese Affairs (Dickover): “Concur.” (740.00119 P.W./8–1345) Notation on copy transmitted October 19 to Mr. Dickover: “Copy left with Secretary of State at 3 p.m. on 13 Aug. 45.” (740.00119 Control(Japan)/10–1945)", "title": "오스트레일리아 공사관이 국무부에", "badge": null, "list_right": "문서 432", "meta": [{"k": "일자", "v": "1945-08-13"}, {"k": "시각", "v": "오후 3시 (각주의 부기: 「1945년 8월 13일 오후 3시에 국무장관에게 사본을 두고 감」)"}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 Control(Japan)/8–1345", "txt": true}, {"k": "발신", "v": "오스트레일리아 공사관", "txt": true}, {"k": "수신", "v": "국무부", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "
