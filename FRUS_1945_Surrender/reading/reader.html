즉각적인 항복을 아마도 보장할 것이다. 항복 조건은 천황으로 하여금 어디에 있든 모든 일본 무장군에게 저항을 중지하고 본토로 돌아갈 준비를 하도록 명령할 것을 요구하리라고 상정된다.\n\nb.\n\n연합국 군정은 서투르고, 비외교적이며, 비효율적일 수밖에 없다. 우리는 그 임무를 효과적으로 수행할 적절한 안목과 훈련과 능력을 갖춘 인원을 충분히 가지고 있지 않다는 사실을 온전히 인정해야 한다.\n\nc.\n\n일본인이 스스로 이끌도록 허용된다면, 진정한 민주적 운동을 위해 무르익어 있을 강한 개연성이 있어 보인다:\n\n(1)\n\n일본인은 본질적으로 모방적인 국민이다.\n\n(2)\n\n모든 동양인(Orientals)이 그러하듯, 그들은 힘에 대한 큰 존경심을 가지고 있다.\n\n(3)\n\n민주주의로서 우리가 이루어 낸 바를 본 이상, 그들은 1867년에 그랬듯이 우리를 모방하려 시도할 공산이 상당히 크다.\n\n(4)\n\n항복 전에 우리가 일본을 침공하든 하지 않든, 일본 군부는 「체면(face)」을 잃고 완전히 신용을 잃었을 것이다.\n\n(5)\n\n1931년 이전에 일본의 민주적 요소들은 힘을 키워 가고 있었으며, 군부가 신용을 잃은 마당에 아마도 개정될[되살아날?] 수 있을 것이다.\n\nd.\n\n천황은 영국 국왕과 마찬가지로 어떤 정치적 색채의 내각이든 부를 수 있다. 만일 천황이 군국주의자들과 갈라선 뒤 자유주의적 내각을 부르고 민주적 강령을 공공연히 지지한다면, 국민은 그것을 받아들이고 전심으로 지지할 공산이 크다. 만일 연합국 군정이 민주적 강령을 강요하려 시도한다면, 민주주의는 정복자의 지배와 결부되어 국민에게 신용을 잃을 것이다.\n\ne.\n\n연합국관리위원회(the Allied Control Commission)가 배후에 남아 있는 채로 황실 통치가 존속하는 것은 마찰과 소요의 가능성을 최소한으로 줄이고, 연합국 점령군과 연합국 군사이사회(the Allied Military Council)의 가장 이른 철수를 가능하게 할 것이다. 연합국 군정은, 특히 확보 가능한 인원의 자질을 감안할 때, 미국 여론이 받아들일 것보다 더 오래 끄는 군사 점령을 요구하게 될 상황을 거의 불가피하게 만들어 낼 것이다.\n\n[587면] f.\n\n자기 처분 아래 있는 무장력의 뒷받침을 받는 국제연합(United Nations) 기구는 일본 정부에 대한 계속적인 감독을 행사할 가장 효과적인 수단이 될 전망이다. 가능한 가장 이른 날짜에 그 문제를 이 기구에 넘기는 것이 우리의 목표가 되어야 한다. 이러한 일본 단속 방식은 직접 점령·통제보다 미국 여론에 훨씬 더 받아들여질 만할 것이다. 그것은 비용이 덜 들 것이고 성공할 가능성이 더 클 것이다.", "secondary": "[Washington,] August 4, 1945.\n\nSecretary Stimson telephoned this morning to say that he had been thinking over the situation of the management of Japan in case of a speedy surrender, and that he had received a day or two ago a paper on this subject [주93] with which he was very much impressed. Mr. Stimson said that the paper had come from outside channels, but seemed to him very sensible. Secretary Stimson said that he was asking his Civil Affairs Division, which had brought the paper to his attention, to send it to me. Mr. Stimson said the document contained a suggestion which he thought might be very useful in persuading the Japanese to “come around”. He said that the reason he called about this matter was that he did not want the paper to be buried or rejected by the Department. Secretary Stimson stated that the military situation in regard to Japan was very different from that of Germany and that we can always control Japan much more easily, to which I agreed. According to Mr. Stimson, he did not think that this fact was being considered by those who are now working on this problem.\n\nMr. Stimson asked if I would look over the paper, which he said Colonel Chandler of his staff would get to me, and then discuss the matter with him. Secretary Stimson, who was calling from out of town, said he would be back in Washington the early part of next week.\n\nJoseph C. Grew\n\n[585면]\n\n[Annex]\n\nMemorandum Submitted to the War Department [주94]\n\nSubject: Observations on Post Hostilities Policy Toward Japan\n\n1.\n\nTo be realistic, post hostilities policy toward Japan must be based upon:\n\na.\n\nRecognition of the probable reaction of the American public over a period of time. A policy which does not win the continuing support of the American public is doomed to failure.\n\nb.\n\nRecognition of the lessons taught by history with respect to relations between the conqueror and the Conquered.\n\n2.\n\nThe most important points to be noted in connection with a and b above would appear to be the following:\n\na.\n\nThe American public will unquestionably become restive under a prolonged occupation of Japan by American Forces. It will not wish to assume the burdens of governing Japan over an extended period. Demands for withdrawal are likely to begin within 6 months after the surrender of Japan and thereafter to build up increasing political pressure to that end.\n\nb.\n\nEven under the most just and equitable administration, resentment against a conquering nation exercising direct political and military control over a vanquished nation inevitably tends to increase over a period of time. Difficulties arise which present the ruling nation with the alternative of either extending and tightening control or withdrawing without accomplishing the desired objective.\n\nc.\n\nThe conquering nation cannot impose its form of government, ideals, or way of life upon a conquered nation except by permanent military occupation and immigration.\n\n3.\n\nThe formulation of our policies toward post hostilities Japan, therefore, requires the highest degree of statesmanship. We must look forward as well as backward. We must:\n\na.\n\nAvoid to the maximum extent possible policies dictated by current war hysteria which subsequently the American public will repudiate or which will involve commitments which the American public will be unwilling to fulfill.\n\nb.\n\nAttempt to accomplish the maximum degree of progress towards the regeneration of Japan in the minimum amount of time. Our degree of success in accomplishing this objective will depend upon the intelligence with which we approach the problem of the relations between the victor and the vanquished.\n\n4.\n\nIt would appear desirable in the light of the above:\n\na.\n\nTo retain the Emperor and the civil administration. As part of the terms of surrender the Emperor would be forced to dismiss the [586면] present cabinet and call a liberal cabinet excluding representatives of the military and naval forces. It would also be part of the surrender terms that the Imperial House would be retained only so long as it cooperated fully with the Allied Control Council.\n\nb.\n\nTo set up a Supreme Allied Council which would in fact be the supreme authority in the country but which would function and issue its directives through the regularly constituted government.\n\nc.\n\nTo give every encouragement to the Japanese to undertake under their own leadership the development of democratic institutions and the elimination of the spirit of military conquest.\n\n5.\n\nThe following arguments are advanced in support of such a program as compared with the establishment of Allied Military Government in place of the Emperor:\n\na.\n\nThe retention of the Emperor will probably insure the immediate surrender of all Japanese Forces outside the home islands. It is assumed that the surrender terms would require the Emperor to order all Japanese Armed Forces wherever located to cease resistance and to prepare to return to the home islands.\n\nb.\n\nAllied Military Government is bound to be bungling, undiplomatic, and inefficient. We must give full recognition to the fact that we do not have sufficient personnel with the proper vision, training, and ability to carry out the task effectively.\n\nc.\n\nThere would appear to be a strong probability that the Japanese will be ripe, if permitted to direct it themselves, for a genuine democratic movement:\n\n(1)\n\nThe Japanese are essentially an imitative people.\n\n(2)\n\nLike all Orientals, they have great respect for power.\n\n(3)\n\nHaving seen what we as a democracy have accomplished, they are quite likely, as in 1867, to attempt to imitate us.\n\n(4)\n\nWhether or not we invade Japan before her surrender the Japanese military will have lost “face” and been completely discredited.\n\n(5)\n\nPrior to 1931 the democratic elements in Japan were increasing in strength and, with the military discredited, could probably be revised [revived?].\n\nd.\n\nThe Emperor, like the British King, can summon a cabinet of any political complexion. If the Emperor after the alienation of the militarists, summons a liberal cabinet and openly supports a democratic program, the people are likely to accept it and support it wholeheartedly. If Allied Military Government attempts to impose a democratic program, democracy will be associated with the rule of the conqueror and will be discredited with the people.\n\ne.\n\nThe continuation of the Imperial rule with the Allied Control Commission remaining in the background should reduce the possibilities of friction and disturbance to the minimum and permit the earliest withdrawal of Allied Occupation Forces, and of the Allied Military Council. The Allied Military Government, particularly with the quality of personnel available, would almost inevitably create situations that would require a more protracted military occupation than the American public will accept.\n\n[587면] f.\n\nThe United Nations machinery, backed by the Armed Forces at its disposal, promises to be the most effective instrumentality for exercising continuing supervision over the Japanese Government. It should be our objective to turn the problem over to this instrumentality at the earliest possible date. This method of policing Japan will be far more acceptable to the American public than direct occupation and control. It will be less expensive and have a greater chance of success.", "notes": ["[주93] 이 각서의 부속서로 인쇄되었다.", "[주94] 각서 상단의 기입: 「육군장관은 아래 각서를 읽은 뒤 '이것은 놀랄 만큼 좋은 문서다'라고 논평하고 그것을 회람하도록 지시했다.」"], "note": "번역자 주 — 히로시마 이틀 전 문서다. 시점이 값어치이므로 가정법을 그대로 살렸다 — 「신속한 항복의 경우(in case of a speedy surrender)」는 가정이지 예측된 사실이 아니고, 부속서 5(a)의 「항복 전에 우리가 일본을 침공하든 하지 않든」도 아직 본토 침공이 열려 있는 상태의 서술이다. 낱말 구분: 'surrender'(항복), 'terms of surrender'(항복 조건)는 본문에 나오고, 'unconditional surrender'와 'capitulation'은 이 문서에 나오지 않는다 — 부속서가 천황 존치를 항복 조건에 넣자고 하는 만큼 이 차이가 중요하다. 부속서 필자는 밝혀져 있지 않고 「외부 경로에서 왔다」고만 되어 있다. 기구 이름이 부속서 안에서 일관되지 않다 — 4a는 Allied Control Council(연합국관리이사회), 4b는 Supreme Allied Council(연합국최고회의), 5b는 Allied Military Government(연합국 군정), 5e는 Allied Control Commission(연합국관리위원회)·Allied Military Council(연합국 군사이사회)·Allied Military Government가 섞여 나온다. 원문의 불일치를 통일하지 않고 각각 그대로 옮겼다. 5c(5)의 'revised [revived?]'는 편찬자의 교정 제안이므로 「개정될[되살아날?]」로 대괄호를 살렸다. 시대의 인종적 일반화 — 「일본인은 본질적으로 모방적인 국민이다」, 「모든 동양인이 그러하듯 힘에 대한 큰 존경심을 가지고 있다」 — 는 부드럽게 만들지 않고 그대로 옮겼다. 'Japs' 같은 멸칭은 이 문서에 나오지 않는다. 5c(3)의 '1867년'은 원문 그대로 두었다(메이지 유신은 통상 1868년으로 잡히나 원문을 고치지 않았다). 'United Nations'는 이 시점에서 연합국 진영과 신설 국제기구가 겹치는 표현이나 부속서 문맥상 상설 기구를 가리키므로 「국제연합」으로 옮기고 원어를 병기했다.", "warn": false, "pages": ["584", "585", "586", "587"], "search": "Henry L. Stimson 스팀슨 — 육군장관. 이 전화의 발신자 Joseph C. Grew 조지프 C. 그루 — 국무장관 대리, 이 비망록의 작성자 Colonel Chandler 챈들러 대령 — 스팀슨 참모진. 문서를 그루에게 전달할 사람 Emperor 천황 — 부속서에서 이름 없이 지칭"}, {"id": "d401", "order": 401, "date": "1945-08-06", "group": "D", "eyebrow": "d401 · Statement by President Truman  Issued by the White House August 6 as press release No. 180.", "title": "트루먼 대통령 성명", "badge": null, "list_right": "문서 401", "meta": [{"k": "일자", "v": "1945-08-06"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "Issued by the White House August 6 as press release No. 180. [주34]", "txt": true}, {"k": "발신", "v": "트루먼 대통령(President Truman)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "성명"}], "links": [{"k": "FRUS", "text": "문서 401 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d401"}], "summary": "16시간 전 미군 항공기가 히로시마에 원자폭탄 한 발을 투하했음을 알리고, 원자폭탄 개발의 경위와 규모를 밝히며, 포츠담 최후통첩을 받아들이지 않으면 「하늘로부터 폐허의 비」가 쏟아질 것이라고 경고한 백악관 성명.", "points": ["16시간 전 미군 항공기 1대가 일본 육군의 중요 기지인 히로시마에 폭탄 1발을 투하했다. T.N.T. 2만 톤 이상의 위력이며, 전쟁사상 최대 폭탄인 영국의 「그랜드 슬램」의 2천 배가 넘는 폭발력이다.", "일본은 진주만에서 공중으로 전쟁을 시작했다. 그들은 몇 곱절로 되갚음을 받았다. 그리고 끝은 아직 아니다.", "그것은 원자폭탄이며, 우주의 근본 힘을 붙들어 맨 것이다. 태양이 힘을 끌어내는 그 힘이 극동에 전쟁을 가져온 자들에게 풀려났다.", "1942년에 독일이 원자에너지를 전쟁 기계에 보태려 광적으로 애쓰고 있음을 알았으나 그들은 실패했다. 독일이 원자폭탄을 전혀 얻지 못한 것에 더욱 감사해야 한다.", "1940년 진주만 이전부터 미국과 영국이 전시 과학지식을 공동 관리했고, 그 정책 아래 원자폭탄 연구가 시작되었다. 처칠 총리와 루스벨트 대통령이 계획을 미국에서 수행하는 것이 현명하다고 합의했다.", "건설 절정기 고용 인원 12만 5천 명, 현재도 6만 5천 명 이상이 공장을 가동 중이다. 20억 달러를 썼다 — 역사상 가장 큰 과학적 도박이었고, 이겼다.", "이제 일본이 어느 도시에서든 지상에 가지고 있는 모든 생산시설을 더 빠르고 더 완전하게 지워 없앨 준비가 되어 있다. 일본의 전쟁 수행 능력을 완전히 파괴할 것이다.", "7월 26일 포츠담 최후통첩은 일본 국민을 완전한 파괴에서 구하기 위한 것이었으나 지도자들이 즉시 거부했다. 이제도 조건을 받아들이지 않으면 지상에서 본 적 없는 폐허의 비를 하늘로부터 각오해야 한다.", "전쟁장관(스팀슨)이 즉시 세부를 담은 성명을 공표한다. 오크리지(테네시 녹스빌 인근), 리치랜드(워싱턴 패스코 인근), 산타페(뉴멕시코) 인근 시설이 밝혀진다.", "미국 내 원자력의 생산과 사용을 통제할 적절한 위원회 설치를 의회가 즉시 심의하도록 권고하겠다."], "primary": "1945년 8월 6일\n\n16시간 전 미군 항공기 1대가 일본 육군의 중요한 기지인 히로시마에 폭탄 한 발을 투하했다. 그 폭탄은 T.N.T. 2만 톤 이상의 위력을 지녔다. 그것은 지금까지 전쟁사에서 쓰인 가장 큰 폭탄인 영국의 「그랜드 슬램(Grand Slam)」보다 2천 배가 넘는 폭발력을 지녔다.\n\n일본인은 진주만에서 공중으로 전쟁을 시작했다. 그들은 몇 곱절로 되갚음을 받았다. 그리고 끝은 아직 아니다. 이 폭탄으로 우리는 이제 우리 군대의 커져 가는 힘에 더하여, 파괴에 있어 새롭고 혁명적인 증대를 보태었다. [622면] 현재의 형태로 이 폭탄들은 지금 생산 중이며, 더욱 강력한 형태들이 개발 중이다.\n\n그것은 원자폭탄이다. 그것은 우주의 근본 힘을 붙들어 맨 것이다. 태양이 그 힘을 끌어내는 그 힘이 극동에 전쟁을 가져온 자들을 향해 풀려났다.\n\n1939년 이전에는 원자에너지를 방출하는 것이 이론상 가능하다는 것이 과학자들이 받아들이던 믿음이었다. 그러나 그것을 해낼 실제적 방법은 아무도 알지 못했다. 그런데 1942년에 이르러 우리는 독일인들이 세계를 노예로 삼고자 바라던 여러 전쟁 기계에 원자에너지를 보탤 방법을 찾으려고 광적으로 애쓰고 있음을 알게 되었다. 그러나 그들은 실패했다. 독일인들이 V-1과 V-2를 늦게, 그리고 제한된 수량으로만 손에 넣은 데 대해 우리는 섭리에 감사할 수 있으며, 그들이 원자폭탄은 전혀 얻지 못한 데 대해서는 더욱더 감사할 수 있다.\n\n실험실의 전투는 공중·육상·해상의 전투 못지않게 우리에게 운명적인 위험을 안고 있었다. 그리고 우리는 다른 전투들을 이겨 온 것처럼 이제 실험실의 전투를 이겼다.\n\n진주만 이전인 1940년부터 전쟁에 유용한 과학지식이 미국과 영국 사이에 공동 관리되었고, 우리 승리에 값을 매길 수 없는 도움이 많이 그 조치에서 나왔다. 그 일반 방침 아래 원자폭탄 연구가 시작되었다. 미국과 영국의 과학자들이 함께 일하면서 우리는 독일을 상대로 발견의 경주에 들어섰다.\n\n미국은 필요한 여러 지식 분야에서 뛰어난 과학자를 다수 확보하고 있었다. 미국은 이 계획에 필요한 막대한 산업적·재정적 자원을 가지고 있었고, 그것을 다른 긴요한 전쟁 사업을 지나치게 훼손하지 않고 이 계획에 쏟을 수 있었다. 미국에서는 이미 상당한 착수가 이루어져 있던 실험실 작업과 생산 공장이 적의 폭격이 미치지 않는 곳에 있을 수 있었던 반면, 그 무렵 영국은 끊임없는 공습에 노출되어 있었고 여전히 침공 가능성의 위협을 받고 있었다. 이러한 이유로 처칠 총리[주35]와 루스벨트 대통령은 이 계획을 이곳에서 수행하는 것이 현명하다는 데 합의했다. 우리는 이제 원자력 생산에 바쳐진 두 개의 큰 공장과 다수의 작은 시설을 가지고 있다. 건설이 절정에 이르렀을 때의 고용 인원은 12만 5천 명이었고, 지금도 6만 5천 명이 넘는 사람들이 공장 운영에 종사하고 있다. 다수가 그곳에서 2년 반을 일했다. 자신들이 무엇을 만들어 왔는지 아는 사람은 거의 없다. 그들은 막대한 양의 자재가 들어가는 것을 보지만 이 공장들에서 나오는 것은 아무것도 보지 못한다. 폭발 장약의 물리적 크기가 극히 작기 때문이다. 우리는 역사상 가장 큰 과학적 도박에 20억 달러를 썼다 — 그리고 이겼다.\n\n그러나 가장 큰 경이는 이 사업의 규모도, 그 비밀 유지도, 그 비용도 아니라, 서로 다른 과학 분야의 많은 사람들이 지니고 있던 [623면] 무한히 복잡한 지식 조각들을 하나의 작동 가능한 계획으로 짜맞춘 과학적 두뇌의 성취이다. 그리고 그에 못지않게 경이로웠던 것은, 여러 사람의 머리에서 나온 착상이 물리적 형체를 갖추고 예정대로 작동하도록, 이제껏 한 번도 해 본 적 없는 일을 해낼 기계와 방법을 설계해 낸 산업의 역량, 그리고 그것을 운용해 낸 노동의 역량이었다. 과학과 산업 양쪽 모두 미국 육군의 지휘 아래 일했으며, 육군은 지식의 진보에 관한 이토록 다종다양한 문제를 놀랍도록 짧은 시간에 관리해 내는 데 유례없는 성공을 거두었다. 세계에서 그와 같은 또 하나의 결합을 이루어 낼 수 있을지 의심스럽다. 이루어진 것은 역사상 조직된 과학의 가장 큰 성취이다. 그것은 높은 압박 아래에서, 실패 없이 이루어졌다.\n\n우리는 이제 일본인이 어느 도시에서든 지상에 가지고 있는 모든 생산시설을 더 신속하고 더 완전하게 지워 없앨 준비가 되어 있다. 우리는 그들의 부두, 그들의 공장, 그들의 통신을 파괴할 것이다. 오해가 없도록 하자. 우리는 일본의 전쟁 수행 능력을 완전히 파괴할 것이다.\n\n일본 국민을 완전한 파괴에서 면하게 하려고 7월 26일의 최후통첩이 포츠담에서 발해진 것이었다. 그들의 지도자들은 그 최후통첩을 즉각 거부했다.[주36] 만일 그들이 지금도 우리의 조건을 받아들이지 않는다면, 그들은 이 지상에서 결코 본 적 없는 폐허의 비가 하늘에서 쏟아지리라 각오해도 좋다. 이 공중 공격의 뒤에는 그들이 아직 본 적 없는 규모와 위력의, 그리고 그 전투 기량은 이미 그들이 알고 있는 해상·육상 병력이 따를 것이다.\n\n이 계획의 모든 국면을 몸소 챙겨 온 전쟁장관[주37]이 즉시 더 상세한 내용을 담은 성명을 공표할 것이다.\n\n그의 성명은 테네시주 녹스빌 인근 오크리지, 워싱턴주 패스코 인근 리치랜드, 그리고 뉴멕시코주 산타페 인근 시설에 관한 사실을 밝힐 것이다. 그 현장의 노동자들이 역사상 가장 큰 파괴력을 만들어 내는 데 쓰일 물질을 만들어 오기는 했으나, 그들 자신은 다른 여러 직업에서의 위험을 넘는 위험에 놓여 있지 않았다. 그들의 안전에 최대한의 주의가 기울여졌기 때문이다.\n\n우리가 원자에너지를 방출할 수 있다는 사실은 자연의 힘에 대한 인간의 이해에 새로운 시대를 연다. 원자에너지는 장래에 지금 석탄, 석유, 낙수(落水)에서 나오는 동력을 보충할 수 있을 것이나, 현재로서는 그것들과 상업적으로 겨룰 만한 기반 위에서 생산될 수 없다. 그렇게 되기까지는 오랜 기간의 집중적인 연구가 있어야 한다.\n\n이 나라의 과학자들이 세계로부터 과학지식을 감추어 두는 것은 결코 그들의 습성이었던 적이 없으며, 이 정부의 정책이었던 적도 없다. [624면] 그러므로 통상적이라면 원자에너지 작업에 관한 모든 것이 공개될 것이다.\n\n그러나 현재의 사정 아래에서는, 우리와 세계의 나머지를 갑작스러운 파괴의 위험으로부터 지킬 수 있는 방법에 대한 추가 검토가 있을 때까지, 생산의 기술적 공정이나 모든 군사적 응용을 누설할 뜻은 없다.\n\n나는 미합중국 의회가 미국 내에서 원자력의 생산과 사용을 통제할 적절한 위원회의 설치를 즉시 심의하도록 권고할 것이다. 나는 원자력이 어떻게 세계 평화의 유지를 향한 강력하고 힘 있는 영향력이 될 수 있는지에 관하여 더 검토하고 의회에 더 권고할 것이다.", "secondary": "August 6, 1945\n\nSixteen hours ago an American airplane dropped one bomb on Hiroshima, an important Japanese Army base. That bomb had more power than 20,000 tons of T.N.T. It had more than two thousand times the blast power of the British “Grand Slam” which is the largest bomb ever yet used in the history of warfare.\n\nThe Japanese began the war from the air at Pearl Harbor. They have been repaid many fold. And the end is not yet. With this bomb we have now added a new and revolutionary increase in destruction to supplement the growing power of our armed forces. In their [622면] present form these bombs are now in production and even more powerful forms are in development.\n\nIt is an atomic bomb. It is a harnessing of the basic power of the universe. The force from which the sun draws its power has been loosed against those who brought war to the Far East.\n\nBefore 1939, it was the accepted belief of scientists that it was theoretically possible to release atomic energy. But no one knew any practical method of doing it. By 1942, however, we knew that the Germans were working feverishly to find a way to add atomic energy to the other engines of war with which they hoped to enslave the world. But they failed. We may be grateful to Providence that the Germans got the V–1’s and the V–2’s late and in limited quantities and even more grateful that they did not get the atomic bomb at all.\n\nThe battle of the laboratories held fateful risks for us as well as the battles of the air, land and sea, and we have now won the battle of the laboratories as we have won the other battles.\n\nBeginning in 1940, before Pearl Harbor, scientific knowledge useful in war was pooled between the United States and Great Britain, and many priceless helps to our victories have come from that arrangement. Under that general policy the research on the atomic bomb was begun. With American and British scientists working together we entered the race of discovery against the Germans.\n\nThe United States had available the large number of scientists of distinction in the many needed areas of knowledge. It had the tremendous industrial and financial resources necessary for the project and they could be devoted to it without undue impairment of other vital war work. In the United States the laboratory work and the production plants, on which a substantial start had already been made, would be out of reach of enemy bombing, while at that time Britain was exposed to constant air attack and was still threatened with the possibility of invasion. For these reasons Prime Minister Churchill [주35] and President Roosevelt agreed that it was wise to carry on the project here. We now have two great plants and many lesser works devoted to the production of atomic power. Employment during the peak construction numbered 125,000 and over 65,000 individuals are even now engaged in operating the plants. Many have worked there for two and a half years. Few know what they have been producing. They see great quantities of material going in and they see nothing coming out of these plants, for the physical size of the explosive charge is exceedingly small. We have spent two billion dollars on the greatest scientific gamble in history—and won.\n\nBut the greatest marvel is not the size of the enterprise, its secrecy, nor its cost, but the achievement of scientific brains in putting together [623면] infinitely complex pieces of knowledge held by many men in different fields of science into a workable plan. And hardly less marvelous had been the capacity of industry to design, and of labor to operate, the machines and methods to do things never done before so that the brain child of many minds came forth in physical shape and performed as it was supposed to do. Both science and industry worked under the direction of the United States Army, which achieved a unique success in managing so diverse a problem in the advancement of knowledge in an amazingly short time. It is doubtful if such another combination could be got together in the world. What has been done is the greatest achievement of organized science in history. It was done under high pressure and without failure.\n\nWe are now prepared to obliterate more rapidly and completely every productive enterprise the Japanese have above ground in any city. We shall destroy their docks, their factories, and their communications. Let there be no mistake; we shall completely destroy Japan’s power to make war.\n\nIt was to spare the Japanese people from utter destruction that the ultimatum of July 26 was issued at Potsdam. Their leaders promptly rejected that ultimatum. [주36] If they do not now accept our terms they may expect a rain of ruin from the air, the like of which has never been seen on this earth. Behind this air attack will follow sea and land forces in such numbers and power as they have not yet seen and with the fighting skill of which they are already aware.\n\nThe Secretary of War, [주37] who has kept in personal touch with all phases of the project, will immediately make public a statement giving further details.\n\nHis statement will give facts concerning the sites at Oak Ridge near Knoxville, Tennessee, and at Richland near Pasco, Washington, and an installation near Santa Fe, New Mexico. Although the workers at the sites have been making materials to be used in producing the greatest destructive force in history they have not themselves been in danger beyond that of many other occupations, for the utmost care has been taken of their safety.\n\nThe fact that we can release atomic energy ushers in a new era in man’s understanding of nature’s forces. Atomic energy may in the future supplement the power that now comes from coal, oil, and falling water, but at present it cannot be produced on a basis to compete with them commercially. Before that comes there must be a long period of intensive research.\n\nIt has never been the habit of the scientists of this country or the policy of this Government to withhold from the world scientific knowledge. [624면] Normally, therefore, everything about the work with atomic energy would be made public.\n\nBut under present circumstances it is not intended to divulge the technical processes of production or all the military applications, pending further examination of possible methods of protecting us and the rest of the world from the danger of sudden destruction.\n\nI shall recommend that the Congress of the United States consider promptly the establishment of an appropriate commission to control the production and use of atomic power within the United States. I shall give further consideration and make further recommendations to the Congress as to how atomic power can become a powerful and forceful influence towards the maintenance of world peace.", "notes": ["[주34] 8월 6일 백악관이 보도자료 제180호로 배포했다.", "[주35] 윈스턴 S. 처칠(Winston S. Churchill). 당시 영국 총리.", "[주36] 일본 군부 수뇌는 수락에 반대했으나 일본 정부의 공식 회답은 없었다. 다만 스즈키 간타로(鈴木貫太郎) 총리는 7월 30일 일본이 그 선언을 묵살할 것이라고 말한 것으로 인용되었다.", "[주37] 헨리 L. 스팀슨(Henry L. Stimson)."], "note": "번역자 주 — 이 열흘을 여는 문서. 히로시마 원자폭탄 투하를 알리는 8월 6일 백악관 성명(보도자료 제180호)이다. 원문에 발표 시각은 없고 「16시간 전(Sixteen hours ago)」이라는 상대 시각만 나온다 — 이것이 이 문서의 유일한 시각 표시이므로 본문에 그대로 두었다. 원문에는 'Japs' 같은 멸칭은 쓰이지 않고 'the Japanese', 'Japanese people'로 되어 있다. 다만 'repaid many fold', 'rain of ruin', 'obliterate' 같은 당대의 수사는 다듬지 않고 그대로 옮겼다. 'Providence'는 「섭리」로 옮겼다. 'Grand Slam'은 영국의 대형 폭탄 이름이므로 번역하지 않고 그대로 두었다.", "warn": false, "pages": ["621", "622", "623", "624"], "search": "Truman 트루먼 — 미국 대통령, 성명 발표자 Winston S. Churchill 윈스턴 S. 처칠 — 당시 영국 총리 Roosevelt 루스벨트 — 전임 미국 대통령 Henry L. Stimson 헨리 L. 스팀슨 — 전쟁장관 Kantaro Suzuki 스즈키 간타로 — 일본 총리(각주)"}, {"id": "d402", "order": 402, "date": "1945-08-08", "group": "X", "eyebrow": "d402 · Memorandum of Conversation, by the Acting Secretary of State", "title": "국무장관 대리의 대화 비망록", "badge": null, "list_right": "문서 402", "meta": [{"k": "일자", "v": "1945-08-08"}, {"k": "시각", "v": "본문 기준 워싱턴 시간 오후 2시 50분경 대화(「지금부터 10분 뒤, 워싱턴 시간 오후 3시, 모스크바 시간 오후 10시」). 문서 자체에는 시각 표기 없음"}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "[Extract] — 발췌본", "txt": true}, {"k": "발신", "v": "국무장관 대리 그루(Joseph C. Grew)", "txt": true}, {"k": "수신", "v": "기록(비망록)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "대화 비망록"}], "links": [{"k": "FRUS", "text": "문서 402 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d402"}], "summary": "소련 대리대사 노비코프가 몰로토프의 대일 선전포고 발표를 10분 전에 그루에게 비공식으로 통고했고, 그루는 일본에 준비할 시간이 두 시간뿐이라고 응수했다.", "points": ["소련 대리대사 노비코프가 「공식 통보가 아닌 비공식」임을 전제로 알려 왔다.", "워싱턴 시간 오후 3시 = 모스크바 시간 오후 10시에 몰로토프가 소련이 일본과 전쟁 상태에 있다는 선언을 한다고 했다.", "그루가 전쟁 상태의 발효 시점을 묻자 노비코프는 「내일」이라고 답했다.", "그루는 「그러면 일본은 준비할 시간을 두 시간 갖는 셈이군」이라고 말했다.", "발췌본이며 앞뒤가 생략되어 있다(원문의 . . . . . . . 표시)."], "primary": "[발췌]\n\n[워싱턴,] 1945년 8월 8일.\n\n. . . . . . .\n\n그 다음 노비코프 씨[주38]가, 공식 통보로서가 아니라 비공식으로, 지금부터 10분 뒤 곧 워싱턴 시간 오후 3시, 모스크바 시간 오후 10시에 몰로토프 씨[주39]가 소비에트 러시아가 일본과 전쟁 상태에 있음을 선언하는 성명을 발표할 것이라고 나에게 말하였다.[주40] 나는 노비코프 씨에게 그 전쟁 상태가 언제부터 효력을 갖느냐고 물었고, 그는 「내일」이라고 답하였다. 나는 말하였다. 「그러면 일본인들은 준비할 시간을 두 시간 갖게 되는 셈이겠군요.」\n\n조지프 C. 그루", "secondary": "[Extract]\n\n[Washington,] August 8, 1945.\n\n. . . . . . .\n\nMr. Novikov [주38] then told me informally and not as an official communication that in ten minutes from now, at three p.m. Washington time, 10 p.m., Moscow time, Mr. Molotov [주39] would make a declaration stating that Soviet Russia is in a state of war with Japan. [주40] I asked Mr. Novikov when the state of war would take effect and he said “tomorrow”. I said, “That will evidently give the Japanese two hours to get ready.”\n\nJoseph C. Grew", "notes": ["[주38] 니콜라이 바실리예비치 노비코프(Nikolay Vassilyevich Novikov), 소련 대리대사.", "[주39] 뱌체슬라프 미하일로비치 몰로토프(Vyacheslav Mikhailovich Molotov), 소련 외무인민위원.", "[주40] 몰로토프 인민위원이 8월 8일 주소련 일본 대사 사토 나오타케(Naotake Sato)에게 건넨 성명문은 Conference of Berlin (Potsdam), vol. ii, p. 1474, 문서 1382의 각주 1을 보라."], "note": "번역자 주 — 본문의 「the Japanese」를 「일본인들」로 옮겼다. 그루의 마지막 말은 소련이 통고 후 두 시간 만에 개전한다는 사실을 꼬집은 반어다. 발췌본이므로 앞뒤 맥락이 잘려 있다.", "warn": false, "pages": ["624"], "search": "Joseph C. Grew 조지프 C. 그루 — 국무장관 대리 Nikolay Vassilyevich Novikov 니콜라이 V. 노비코프 — 소련 대리대사 Vyacheslav Mikhailovich Molotov 뱌체슬라프 M. 몰로토프 — 소련 외무인민위원 Naotake Sato 사토 나오타케 — 주소련 일본 대사 (각주)"}, {"id": "d403", "order": 403, "date": "1945-08-10", "group": "A", "eyebrow": "d403 · The Minister in Sweden (Johnson) to the Secretary of State", "title": "주스웨덴 공사(존슨)가 국무장관에게", "badge": null, "list_right": "문서 403", "meta": [{"k": "일자", "v": "1945-08-10"}, {"k": "시각", "v": "발신 1945년 8월 10일 오후 1시(스톡홀름) / 접수 8월 10일 오전 11시 45분(워싱턴)"}, {"k": "장소", "v": "Stockholm", "txt": true}, {"k": "전문번호", "v": "2742"}, {"k": "원문출처", "v": null, "txt": true}, {"k": "발신", "v": "주스웨덴 공사 존슨(Johnson)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 403 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d403"}], "summary": "스웨덴 외무장관 운덴이 영국·소련 공사에게 일본 정부의 포츠담선언 수락 — 「천황의 주권은 침해되지 않는다」는 양해를 조건으로 한 — 을 전달하였음을 존슨이 대통령과 국무장관에게 보고한다.", "points": ["대통령과 국무장관 앞. 영국 공사가 방금 찾아와 알려 주었다.", "운덴 외무장관이 오늘 아침 영국·소련 공사를 긴급히 불러 일본 정부의 요청을 전달했다.", "일본 정부는 포츠담에서 발표된 항복 선언을 수락한다는 뜻을 스톡홀름 주재 영국·소련 공사에게 알려 달라고 요청했다.", "「일본 정부는 그 선언이 일본 천황의 주권을 침해하지 않는 것으로 이해한다」는 점이 명시적으로 단서로 붙었다. 이 점에 대한 일본 정부의 양해를 조건으로 포츠담의 무조건 항복 조건을 수락한다.", "주스웨덴 일본 공사 오카모토는 주베른 일본 공사 가세가 스위스 정부를 통해 같은 제의를 미국·중국에 전달하도록 훈령받았으며 스톡홀름과 동시에 진행되고 있다고 말했다.", "영국·소련 공사가 미국 공사와 중국 공사에게 비공식으로 알릴 허가를 운덴에게 구해 받았다. 중국 측에는 소련 공사가 알린다.", "운덴은 이 통보를 최고 등급의 비밀로 취급해 달라고 요청했다."], "primary": "스톡홀름, 1945년 8월 10일 오후 1시.\n [8월 10일 오전 11시 45분 접수]\n\n2742. 대통령과 국무장관 앞. 영국 공사[주40a]가 방금 찾아와, 자기와 소련 공사[주40b]가 오늘 아침 대단히 긴급하게 운덴(Unden) 외무장관을 만나 달라는 요청을 받았다고 나에게 알려 왔다. 운덴 씨는 두 사람에게 [625면] 일본 정부의 요청, 곧 스톡홀름 주재 영국 및 소련 공사에게 일본의 항복에 관하여 포츠담에서 발표된 선언을 일본 정부가 수락한다는 사실을 알려 달라는 요청을 전달하였다. 일본 정부는 그 선언이 일본 천황의 주권이 침해되지 않는다는 뜻으로 이해한다는 점이 단서로 붙어 있었다. 이 점에 관한 일본 정부의 양해를 조건으로 포츠담의 무조건 항복 조건은 수락된다.\n\n운덴 외무장관은 영국 공사에게, 일본 공사[주41]가 위의 내용을 전달하면서, 베른 주재 일본 공사[주42]가 스위스 정부에 대하여 같은 무조건 항복 제의를 베른 주재 미국 및 중국 공사를 통하여 각각 그 나라에 전달해 달라고 요청하도록 훈령을 받았으며, 이 조치가 스톡홀름에서의 조치와 동시에 취해지고 있는 것으로 안다고 말하였다고 알려 주었다.\n\n영국 공사와 소련 공사는 위의 내용을 나와 중국 공사에게 비공식으로 알려도 좋겠는지 운덴 씨의 허락을 구하였고, 외무장관은 이에 동의하였다. 소련 공사가 중국 측에 알리고 있다.\n\n운덴 씨는 영국 및 소련 공사에게 이 통보를 최고 등급의 비밀로 취급하여 달라고 요청하였다.\n\n존슨", "secondary": "Stockholm, August 10, 1945—1 p.m. \n [Received August 10—11:45 a.m.]\n\n2742. For the President and the Secretary of State. The British Minister [주40a] has just called to inform me that he and the Soviet Minister [주40b] had been requested this morning to see Foreign Minister Unden with great urgency. Mr. Unden communicated to them a request from [625면] the Japanese Govt that the British and Soviet Ministers in Stockholm be informed of the Japanese Govt’s acceptance of the declaration made at Potsdam regarding Japanese surrender. It was stipulated that Japanese Govt understood that declaration to mean that the sovereignty of the Emperor of Japan would not be touched. Subject to the Japanese Govt’s understanding of this point, the unconditional surrender terms at Potsdam are accepted.\n\nForeign Minister Unden informed the British Minister that Japanese Minister [주41] in transmitting the foregoing had stated that the Japanese Minister at Bern [주42] had instructions to request the Swiss Govt to transmit the same offer of unconditional surrender to the US and China through their respective Ministers at Bern, and that he understood that this action was being taken simultaneously with the action at Stockholm.\n\nThe British and Soviet Ministers asked Mr. Unden’s permission to inform me and the Chinese Minister unofficially of the foregoing, to which the Foreign Minister agreed. The Soviet Minister is informing the Chinese.\n\nMr. Unden requested the British and Soviet Ministers to regard this communication as of the highest order of secrecy.\n\nJohnson", "notes": ["[주40a] 세실 버트런드 제럼(Cecil Bertrand Jerram).", "[주40b] 일리야 레메노비치 체르니셰프(Ilya Lemenovich Chernyshev).", "[주41] 오카모토 스에마사(Suemasa Okamoto).", "[주42] 가세 슌이치(Shunichi Kase)."], "note": "번역자 주 — 원문의 축약 표기(Govt, US, Legation 등)는 풀어 옮겼다. 「the sovereignty of the Emperor of Japan would not be touched」의 조건절은 규칙 7에 따라 풀어 쓰지 않고 그대로 옮겼다. 접수 시각(오전 11시 45분)이 발신 시각(오후 1시)보다 이른 것은 스톡홀름·워싱턴 시차 때문이며 원문 그대로 두었다.", "warn": false, "pages": ["624", "625"], "search": "Johnson 존슨 — 주스웨덴 미국 공사 Östen Undén 운덴 — 스웨덴 외무장관 Cecil Bertrand Jerram 세실 B. 제럼 — 주스웨덴 영국 공사 Ilya Lemenovich Chernyshev 일리야 L. 체르니셰프 — 주스웨덴 소련 공사 Suemasa Okamoto 오카모토 스에마사 — 주스웨덴 일본 공사 Shunichi Kase 가세 슌이치 — 주스위스(베른) 일본 공사"}, {"id": "d404", "order": 404, "date": "1945-08-10", "group": "B", "eyebrow": "d404 · Memorandum by Mr. Benjamin V. Cohen, Special Assistant to the Secretary of State  This memorandum is a summary of a trans-Atlantic conversation between Mr. Cohen and the Ambassador in the United Kingdom (Winant).", "title": "국무장관 특별보좌관 벤저민 V. 코언 씨의 각서", "badge": null, "list_right": "문서 404", "meta": [{"k": "일자", "v": "1945-08-10"}, {"k": "시각", "v": "12:20 p.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 PW/8–1045", "txt": true}, {"k": "발신", "v": "국무장관 특별보좌관 벤저민 V. 코언(Benjamin V. Cohen)", "txt": true}, {"k": "수신", "v": "(기록용 각서 — 특정 수신자 없음)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 404 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d404"}], "summary": "코언이 주영대사 위넌트와 나눈 대서양 횡단 통화 요지 — 영국 내각은 미국의 입장을 듣기 전에는 따로 통보하지 않기로 했으며, 천황 존속은 받아들이는 쪽이나 「천황의 대권 유보」 문구에 불안을 느껴 포츠담 선언에 비추어 더 정밀한 정의가 필요하다고 보았다.", "points": ["영국 정부가 일본 정부의 화평 전언(peace message)을 논의했다.", "영국은 워싱턴·모스크바·충칭 주재 자국 대사관에 훈령을 보내 동맹국들의 견해를 공식 조회하게 했다.", "외무장관 베빈이 내각 회의 중에 나와 위넌트에게 알리기를, 내각은 미국 측 통보를 듣기 전에는 다른 어떤 통첩도 생각하지 않고 있다고 했다.", "내각은 자국 정책을 미국의 정책과 나란히 두고자 하여 미국의 입장을 그때그때 알기를 바랐다.", "영국 내각은 미국의 입장을 지지하고자 하면서도 천황의 존속(continuation of the Emperor)은 받아들이는 쪽으로 기울었다.", "다만 「천황의 대권 유보(reservation of the Emperor's prerogations [prerogatives?])」 문구를 두고 불안해했고, 포츠담 선언에 비추어 그 유보를 더 정확히 정의할 필요가 있다고 보았다.", "위넌트 대사는 어느 단계에서 모스크바 주재 사토 대사를 활용하는 것이 도움이 될 수 있다고 시사했다."], "primary": "[워싱턴,] 1945년 8월 10일 오후 12시 20분\n\n영국 정부는 일본 정부의 화평 전언(peace message)을 논의하였다. 영국 정부는 워싱턴·모스크바·충칭 주재 자국 대사관에 전보를 보내어, 그 전언에 관한 동맹국들의 견해를 공식으로 조회하도록 하였다.\n\n외무장관 베빈(Bevin)은 내각 회의에서 나와 위넌트(Winant)에게 알리기를, 내각은 우리 쪽에서 통보를 받기 전까지는 다른 어떤 통첩도 예정하고 있지 않다고 하였다. 내각은 자기네 정책을 우리 정책과 나란히 유지하기를 바랐으므로 우리 입장을 그때그때 알기를 원하였다. 내각은 우리 입장을 지지하기를 바라면서도, 천황의 존속(continuation of the Emperor)을 받아들이는 쪽으로 기울어 있었다. 다만 천황의 대권 유보(the reservation of the Emperor's prerogations [prerogatives?])라는 문구에는 마음을 놓지 못하였다. 내각은 포츠담 선언에 비추어 그 유보를 더 정확하게 정의할 필요가 있다고 생각하였다.\n\n[626면]\n\n대사는 또한 어느 단계에서는 모스크바의 사토(Sato) 대사를 활용하는 것이 우리에게 도움이 될 수도 있다고 시사하였다.", "secondary": "[Washington,] August 10, 1945—12:20 p.m.\n\nThe British Government has discussed peace message of the Japanese Government. It has sent cables to its embassies in Washington, Moscow and Chungking to make formal inquiry as to the views of its allies on the message.\n\nForeign Secretary Bevin came out of the Cabinet meeting to advise Winant that no other communication was contemplated by the Cabinet until they had heard from us. The Cabinet wished to be currently informed of our position as it was their desire to keep their policy in line with ours. While they desired to support our position, they were inclined to accept the continuation of the Emperor although they were troubled about the language of the reservation of the Emperor’s prerogations [prerogatives?]. They thought a more precise definition of the reservation was necessary in light of the Potsdam Declaration.\n\n[626면]\n\nThe Ambassador also indicated that we might find it helpful at some stage to use Ambassador Sato at Moscow.", "notes": ["[주43] 이 각서는 코언 씨와 주영대사(위넌트) 사이의 대서양 횡단 대화를 요약한 것이다."], "note": "번역자 주 — 원문의 「prerogations [prerogatives?]」는 FRUS 편집자가 원문 오기에 붙인 교정 제안이다. 스키마 규칙에 따라 대괄호를 그대로 살렸다.", "warn": false, "pages": ["625", "626"], "search": "Benjamin V. Cohen 벤저민 V. 코언 — 국무장관 특별보좌관 John G. Winant 존 G. 위넌트 — 주영국 미국대사 Ernest Bevin 어니스트 베빈 — 영국 외무장관 Naotake Sato 사토 나오타케 — 모스크바 주재 일본대사"}, {"id": "d405", "order": 405, "date": "1945-08-10", "group": "A", "eyebrow": "d405 · The Secretary of State to the Ambassador in the United Kingdom (Winant)  Similar telegrams sent to Moscow on the same date as White House No. 320, to Chungking on August 11 as White House No. 321.", "title": "국무장관이 주영대사(위넌트)에게", "badge": null, "list_right": "문서 405", "meta": [{"k": "일자", "v": "1945-08-10"}, {"k": "시각", "v": "1945년 8월 10일 오후 3시 45분 발신 (Washington, August 10, 1945—3:45 p.m.)"}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "White House No. 319"}, {"k": "원문출처", "v": "740.00119 P.W./8–1045: Telegram", "txt": true}, {"k": "발신", "v": "국무장관 번스(James F. Byrnes)", "txt": true}, {"k": "수신", "v": "주영대사 위넌트(John G. Winant)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 405 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d405"}], "summary": "일본의 포츠담선언 수락 통고에 대한 연합국 회답문 초안을 영국 정부에 제시하고 즉각적인 동참과 회신을 촉구한 전보.", "points": ["8월 10일 오후 3시 45분 발신. 「즉시」 영국 외무장관에게 전달하고 회답의 긴급성을 각인시킨 뒤 곧바로 회신을 전보하라는 지시가 앞에 붙는다.", "제3항이 회답문 본문이다. 일본이 「위 선언은 천황의 주권 통치자로서의 대권을 침해하는 어떠한 요구도 포함하지 않는다는 양해 아래」라는 문구를 붙여 수락한 데 대한 미국의 입장이다.", "항복의 순간부터 국가를 통치하는 천황과 일본 정부의 권한은 연합국최고사령관에게 subject to(종속) 된다.", "천황과 일본 대본영이 항복 문서에 서명하고, 전 일본군에 전투 정지·무장 해제 명령을 발하도록 요구된다 — 이 「천황 본인의 서명」 대목이 뒤에 영국이 수정을 요구하는 지점이다.", "항복 즉시 포로와 민간인 억류자를 안전한 장소로 수송할 것.", "일본의 궁극적 정부 형태는 포츠담선언에 따라 일본 국민의 자유로이 표명된 의사로 수립된다.", "포츠담선언의 목적이 달성될 때까지 연합국 군대는 일본에 주둔한다.", "[주44] 같은 날 모스크바에 White House No. 320으로, 8월 11일 충칭에 No. 321로 같은 취지의 전보가 발송되었다."], "primary": "워싱턴, 1945년 8월 10일 오후 3시 45분\n\n[백악관 제319호.] 다음 메시지를 외무장관에게 즉시 전달하기 바람. 외무장관에게 이 메시지에 대한 회답의 긴급성을 각인시키고, 그의 회답을 즉시 전보하기 바람.\n\n> \"1. 본국 정부는 일본 정부의 포츠담선언 수락에 대하여 제3항에 인용된 바와 같은 회답을 행할 것을 제의한다. [주45]\n>\n> \"2. 적대행위가 종결되고 더 이상의 인명 손실이 방지되도록, 본국 정부는 영국 정부가 제3항에 인용된 바와 같은 회답을 조속히 행하는 데 본국 정부와 함께하기를 희망한다.\n>\n> \"3. 포츠담선언의 조건을 수락하되 '위 선언은 주권 통치자로서의 폐하의 대권을 침해하는 어떠한 요구도 포함하지 않는다는 양해 아래'라는 서술을 담고 있는 일본 정부의 메시지에 관하여, 우리의 입장은 다음과 같다.\n>\n> > '항복의 순간부터, 국가를 통치하는 천황 및 일본 정부의 권한은 연합국최고사령관에게 종속된다(shall be subject to). 최고사령관은 항복 조건을 실행하기 위하여 자신이 적절하다고 인정하는 조치를 취한다.\n> >\n> > '천황 및 일본 대본영은, 포츠담선언의 규정을 수행하는 데 필요한 항복 조건에 서명하고, 일본의 전 군대에 대하여 적대행위를 중지하고 무기를 인도하라는 명령을 발하며, 또한 최고사령관이 항복 조건을 실효케 하기 위하여 요구할 수 있는 그 밖의 명령을 발할 것을 요구받는다(will be required).\n> >\n> > '항복 즉시 일본 정부는 포로 및 민간인 억류자를, 지시되는 바에 따라, 신속히 연합국 수송선에 승선시킬 수 있는 안전한 장소로 수송한다(shall transport).\n> >\n> > '일본의 궁극적 정부 형태는, 포츠담선언에 따라, 일본 국민의 자유로이 표명된 의사에 의하여 수립된다(shall be established).\n> >\n> > '연합국의 군대는 포츠담선언에 제시된 목적이 달성될 때까지 일본에 주둔한다(will remain).'\"\n\n[번스(Byrnes)]\n\n[627면]", "secondary": "Washington, August 10, 1945—3:45 p.m.\n\n[White House No. 319.] Please deliver at once to the Secretary of State for Foreign Affairs the following message. Please impress upon the Secretary of State for Foreign Affairs the urgency of a reply to this message and telegraph at once his reply.\n\n“1. This Government proposes that a reply as quoted in paragraph 3 be made to the Japanese Government’s acceptance of the Potsdam proclamation. [주45]\n\n“2. In order that hostilities may be terminated and further loss of life be prevented this Government hopes that the British Government will associate itself with this Government in making an early reply as quoted in paragraph 3.\n\n“3. With regard to the Japanese Government’s message accepting the terms of the Potsdam proclamation but containing the statement ‘with the understanding that the said declaration does not comprise any demand which prejudices the prerogatives of His Majesty as a sovereign ruler’, our position is as follows:\n\n‘From the moment of surrender the authority of the Emperor and the Japanese Government to rule the state shall be subject to the Supreme Commander of the Allied powers who will take such steps as he deems proper to effectuate the surrender terms.\n\n‘The Emperor and the Japanese High Command will be required to sign the surrender terms necessary to carry out the provisions of the Potsdam Declaration, to issue orders to all the armed forces of Japan to cease hostilities and to surrender their arms, and to issue such other orders as the Supreme Commander may require to give effect to the surrender terms.\n\n‘Immediately upon the surrender the Japanese Government shall transport prisoners of war and civilian internees to places of safety, as directed, where they can quickly be placed aboard Allied transports.\n\n‘The ultimate form of government of Japan shall, in accordance with the Potsdam declaration, be established by the freely expressed will of the Japanese people.\n\n‘The armed forces of the Allied Powers will remain in Japan until the purposes set forth in the Potsdam declaration are achieved.’”\n\n[\n\nByrnes\n\n]\n\n[627면]", "notes": ["[주44] 같은 날짜로 모스크바에 백악관 제320호로, 8월 11일 충칭에 백악관 제321호로 유사한 전보가 발송되었다.", "[주45] 일본 측 회답은 아래(infra) 참조. 그것은 도쿄 라디오로 방송되었고 그 경로로 먼저 접수되었다."], "note": "번역자 주 — 이른바 「번스 회답(Byrnes Note)」의 미국 측 원안이다. 원문의 3중 인용부호 구조(전보 지시문 → \" \"로 묶인 메시지 → ' '로 묶인 회답 본문)를 인용 블록 중첩으로 옮겼다. `shall`/`will`/`will be required`의 구분을 살렸다.", "warn": false, "pages": ["626", "627"], "search": "Byrnes 번스(James F. Byrnes, 국무장관) His Majesty the Emperor 천황"}, {"id": "d406", "order": 406, "date": "1945-08-10", "group": "B", "eyebrow": "d406 · The Swiss Chargé (Grässli) to the Secretary of State", "title": "스위스 대리대사(그레슬리)가 국무장관에게", "badge": null, "list_right": "문서 406", "meta": [{"k": "일자", "v": "1945-08-10"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": null, "txt": true}, {"k": "발신", "v": "스위스 대리대사 그레슬리(Grässli)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 406 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d406"}], "summary": "일본 정부가 스위스를 중개로, 「천황의 대권을 침해하는 요구를 포함하지 않는다는 양해 아래」 포츠담선언의 조항을 수락할 용의가 있다는 항복 제의를 미국 정부에 전달하다.", "points": ["주스위스 일본 공사가 본국 정부의 훈령에 따라 스위스 정치국에 미국 정부에 대한 통보를 요청했다.", "일본 정부는 몇 주 전 당시 중립 관계에 있던 소련 정부에 적국들에 대한 강화 주선을 요청했으나 실패했다.", "일본 정부는 1945년 7월 26일 미·영·중 정부 수반이 포츠담에서 발표하고 뒤에 소련 정부가 참가한 공동선언에 열거된 조항을 수락할 용의가 있다 — 단 「그 선언이 주권적 통치자로서의 천황폐하의 대권을 침해하는 어떠한 요구도 포함하지 않는다는 양해 아래(with the understanding that …)」.", "일본 정부는 이 양해가 보장되기를 진심으로 희망하며 그 취지의 명시적 표명이 신속히 있기를 간절히 바란다.", "일본 정부는 미국의 회답을 스위스를 중개로 전달해 줄 것을 청한다.", "동일한 요청이 스웨덴을 중개로 영국·소련 정부에, 스위스를 중개로 중국 정부에 전달되고 있다.", "베른 주재 중국 공사에게는 스위스 정치국 경로로 이미 위 내용이 통보되었다."], "primary": "워싱턴, 1945년 8월 10일.\n\n각하: 본인은 주스위스 일본 공사가 본국 정부로부터 받은 훈령에 따라, 스위스 정치국에 아메리카합중국 정부에 대하여 다음을 통보해 줄 것을 요청하였음을 알려드리는 영광을 갖습니다.\n\n> 「세계 평화의 대의를 높이는 데 늘 마음을 쓰시며, 전쟁의 계속으로 인류에게 닥칠 재앙으로부터 인류를 구하고자 적대행위의 조속한 종결을 간절히 바라시는 천황폐하의 인자하신 명령을 받들어, 일본 정부는 몇 주 전 당시 중립 관계에 있던 소련 정부에 적국들에 대하여 평화를 회복하는 주선(good offices)을 해 줄 것을 요청하였다. 불행히도 평화를 위한 이 노력이 실패하였으므로, 일본 정부는 전반적 평화를 회복하시려는 폐하의 존엄하신 뜻에 따라, 그리고 전쟁이 초래한 이루 말할 수 없는 고통을 가능한 한 빨리 끝내기를 바라며, 다음과 같이 결정하였다.\n\n> 「일본 정부는 1945년 7월 26일 미합중국·영국·중국 정부 수반이 포츠담에서 발표하고 뒤에 소련 정부가 참가한 공동선언에 열거된 조항을, **동 선언이 주권적 통치자로서의 천황폐하의 대권을 침해하는(prejudices the prerogatives of His Majesty as a Sovereign Ruler) 어떠한 요구도 포함하지 않는다는 양해 아래(with the understanding that)**, 수락할 용의가 있다.\n\n> 「일본 정부는 이 양해가 보장되기를 진심으로 희망하며, 그 취지의 명시적 표명이 신속히 있기를 간절히 바란다.」\n\n위 통보를 전달하면서 일본 공사는, 본국 정부가 미합중국 정부에 대하여 그 회답을 스위스의 중개를 통하여 보내 줄 것을 청한다고 덧붙였습니다. 동일한 요청이 스웨덴의 중개를 통하여 영국 및 소비에트사회주의공화국연방 정부에, 또한 스위스의 중개를 통하여 중국 정부에 전달되고 있습니다. 베른 주재 중국 공사에게는 스위스 정치국의 경로를 통하여 위 내용이 이미 통보되었습니다.\n\n미합중국 정부의 회답을 본국 정부를 위하여 접수하고 전달하기 위하여 본인이 언제든 각하의 뜻에 응할 준비가 되어 있음을 확언드립니다.\n\n[이하 인사] 삼가 받아 주십시오.\n\n그레슬리\n\n[628면]", "secondary": "Washington, August 10, 1945.\n\nSir: I have the honor to inform you that the Japanese Minister to Switzerland, upon instructions received from his Government, has requested the Swiss Political Department to advise the Government of the United States of America of the following:\n\n“In obedience to the gracious command of his Majesty the Emperor who, ever anxious to enhance the cause of world peace, desires earnestly to bring about a speedy termination of hostilities with a view to saving mankind from the calamities to be imposed upon them by further continuation of the war, the Japanese Government several weeks ago asked the Soviet Government, with which neutral relations then prevailed, to render good offices in restoring peace vis-à-vis the enemy powers. Unfortunately, these efforts in the interest of peace having failed, the Japanese Government in conformity with the august wish of His Majesty to restore the general peace and desiring to put an end to the untold sufferings entailed by war as quickly as possible, have decided upon the following.\n\n“The Japanese Government are ready to accept the terms enumerated in the joint declaration which was issued at Potsdam on July 26th, 1945, by the heads of the Governments of the United States, Great Britain, and China, and later subscribed by the Soviet Government, with the understanding that the said declaration does not comprise any demand which prejudices the prerogatives of His Majesty as a Sovereign Ruler.\n\n“The Japanese Government sincerely hope that this understanding is warranted and desire keenly that an explicit indication to that effect will be speedily forthcoming.”\n\nIn transmitting the above message the Japanese Minister added that his Government begs the Government of the United States to forward its answer through the intermediary of Switzerland. Similar requests are being transmitted to the Governments of Great Britain and the Union of Soviet Socialist Republics through the intermediary of Sweden, as well as to the Government of China through the intermediary of Switzerland. The Chinese Minister at Berne has already been informed of the foregoing through the channel of the Swiss Political Department.\n\nPlease be assured that I am at your disposal at any time to accept for and forward to my Government the reply of the Government of the United States.\n\nAccept [etc.]\n\nGrässli\n\n[628면]", "notes": [], "note": "번역자 주 — 일본 측 항복 제의의 조건절 「with the understanding that the said declaration does not comprise any demand which prejudices the prerogatives of His Majesty as a Sovereign Ruler」는 이후 나흘간의 쟁점이므로 풀어 쓰지 않고 구조를 그대로 옮겼다. prerogatives는 「대권」, Sovereign Ruler는 「주권적 통치자」로 직역했다. 인용부호(“ ”)로 묶인 일본 정부 통보문은 인용 블록으로 표시했다. 「Accept [etc.]」는 외교문서 상투 인사구의 생략 표기이며 원문의 대괄호를 살렸다.", "warn": false, "pages": ["627", "628"], "search": "Grässli 그레슬리 — 주미 스위스 대리대사 His Majesty the Emperor 천황폐하 — 히로히토(원문은 이름을 적지 않음)"}, {"id": "d407", "order": 407, "date": "1945-08-10", "group": "A", "eyebrow": "d407 · The Minister in Switzerland (Harrison) to the Secretary of State", "title": "주스위스 공사(해리슨)가 국무장관에게", "badge": null, "list_right": "문서 407", "meta": [{"k": "일자", "v": "1945-08-10"}, {"k": "시각", "v": "발신 1945년 8월 10일 오후 8시(베른) / 접수 8월 10일 오후 5시 29분(워싱턴). 본문 안: 일본 공사가 오늘 오후 6시에 슈투키 공사에게 문서를 건넸다"}, {"k": "장소", "v": "Bern", "txt": true}, {"k": "전문번호", "v": "3864"}, {"k": "원문출처", "v": null, "txt": true}, {"k": "발신", "v": "주스위스 공사 해리슨(Harrison)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 407 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d407"}], "summary": "일본 공사가 8월 10일 오후 6시 스위스 외무 담당 슈투키에게 항복 제의 문서를 건넸으며, 영문본이 유일한 정본이고 같은 문서가 스웨덴 정부를 통해 영국·소련에도 전달되고 있다고 보고한다.", "points": ["일본 공사가 오늘 오후 6시에 슈투키 공사에게 통보문을 건넸다.", "본문(통보문 전문)은 8월 10일자 스위스 대리대사 각서에 인용된 것과 같으므로 FRUS 편찬에서는 생략되었다.", "일본 공사는 같은 문서가 스웨덴 정부를 통해 영국·소련 정부에도 전달되고 있다고 슈투키에게 말했다.", "일본 공사는 「영문본이 유일한 공식 정본」이라고 밝혔다.", "슈투키는 이미 워싱턴 주재 스위스 공사관에 본문을 전신으로 보내 국무장관에게 즉시 전달하도록 했다고 해리슨에게 말했다.", "슈투키는 중국 공사에게도 본문을 주어 충칭으로 전달하도록 하고 있다."], "primary": "베른, 1945년 8월 10일 오후 8시.\n [8월 10일 오후 5시 29분 접수]\n\n3864. 다음은 오늘 오후 6시에 일본 공사가 슈투키(Stucki) 공사[주46]에게 건넨 통보문의 본문이다.\n\n[여기에 앞의 문서로 실린 8월 10일자 스위스 대리대사 각서에 인용된 것과 같은 본문이 이어진다.]\n\n일본(Jap) 공사는 슈투키에게 같은 문서가 스웨덴 정부를 통하여 영국 및 소련 정부에 전달되고 있다고 말하였다.\n\n일본(Jap) 공사는 또한 영문본이 유일한 공식 정본이라고 밝혔다.\n\n슈투키는, 본문을 이미 워싱턴 주재 스위스 공사관에 전신으로 보내어 즉시 귀하에게 전달하도록 하였다고 나에게 말하였다. 그는 여기 있는 중국 공사에게도 본문을 주어 충칭으로 전달하도록 하고 있다.\n\n해리슨", "secondary": "Bern, August 10, 1945—8 p.m. \n [Received August 10—5:29 p.m.]\n\n3864. Following is text of communication handed to Minister Stucki [주46] 6 p.m. this afternoon by Japanese Minister.\n\n[Here follows text as quoted in note from the Swiss Chargé of August 10, printed supra.]\n\nJap Minister told Stucki that same was being transmitted through Swedish Govt to British and Soviet Govts.\n\nJap Minister also stated that English is sole official text.\n\nStucki told me text already cabled Swiss Leg, Wash, for delivery at once to you. He is giving text to Chinese Minister here for transmission to Chungking.\n\nHarrison", "notes": ["[주46] 발터 슈투키(Walter Stucki), 스위스 연방정치부 외무국장."], "note": "번역자 주 — 원문에 일본을 가리키는 축약 멸칭 표기 「Jap Minister」가 두 번 쓰였다. 규칙 8에 따라 부드럽게 고치지 않고 「일본(Jap) 공사」로 표기 사실을 남겼다. 통보문 본문 자체는 FRUS 편찬 단계에서 앞 문서(스위스 대리대사 8월 10일자 각서)로 대체되어 이 문서에는 실려 있지 않다.", "warn": false, "pages": ["628"], "search": "Leland Harrison 해리슨 — 주스위스 미국 공사 Walter Stucki 발터 슈투키 — 스위스 연방정치부 외무국장 Shunichi Kase 가세 슌이치 — 주스위스 일본 공사(본문에는 「일본 공사」로만 나옴)"}, {"id": "d408", "order": 408, "date": "1945-08-11", "group": "A", "eyebrow": "d408 · The Ambassador in the United Kingdom (Winant) to the Secretary of State", "title": "주영대사(위넌트)가 국무장관에게", "badge": null, "list_right": "문서 408", "meta": [{"k": "일자", "v": "1945-08-11"}, {"k": "시각", "v": "1945년 8월 11일 발신 (London) / 8월 10일 오후 10시 30분 접수 (Received August 10—10:30 p.m.)"}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "2261"}, {"k": "원문출처", "v": "740.00119 P.W./8–1145: Telegram", "txt": true}, {"k": "발신", "v": "주영대사 위넌트(John G. Winant)", "txt": true}, {"k": "수신", "v": "국무장관 번스(James F. Byrnes)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 408 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d408"}], "summary": "영국 정부가 미국 회답 초안에 원칙적으로 동의하되, 천황 본인에게 항복 문서 서명을 요구하는 것은 현명하지 않다며 천황이 「서명을 시키고 명령을 발하도록」 하는 수정을 제안한 전보.", "points": ["위넌트는 백악관 제319호를 받은 즉시 다우닝가 10번지에서 애틀리 총리와 베빈 외무장관을 만났다.", "영국은 초안에 「원칙적으로 동의(agreeing in principle)」하나 수정을 원한다.", "수정 요지: 천황이 몸소 서명하는 대신, 천황이 일본 정부와 일본 대본영으로 하여금 항복 조건에 서명하도록 「권한을 부여하고 보증(authorise and ensure)」하며, 소재를 불문한 모든 일본 육·해·공 당국과 그 예하 부대에 작전 중지와 무장 인도를 「명령(commands)」한다.", "영국은 이것이 포츠담선언 제13항에 부합한다고 본다.", "이 방식이 외곽 지역의 일본군까지 즉시 항복시켜 미국·영국·연합국의 인명을 구할 것이라고 주장.", "합의가 되면 스탈린 대원수와 장제스 총통의 동의를 얻어야 한다고 봄.", "총리와 외무장관은 회답을 기다리며 밤새 대기 중. 처칠도 위넌트에게 전화했으며 같은 견해 — 「천황(미카도)을 쓰는 것이 외곽 지역의 인명을 구한다」."], "primary": "런던, 1945년 8월 11일.\n[8월 10일 오후 10시 30분 접수]\n\n2261. 귀 백악관 제319호에 대하여. [주47] 귀하의 메시지를 받은 직후 나는 다우닝가 10번지에서 애틀리 씨 [주48] 및 베빈 씨 [주49] 와 회동하였다. 그들은 다음 메시지를 귀하에게 전달해 줄 것을 나에게 요청하였다.\n\n> \"우리는 귀하의 초안을 검토하였다. 원칙적으로는 동의하나, 천황에게 몸소 항복 조건에 서명하도록 요구하는 것이 현명한지 의심스럽다는 이유에서 일정한 수정을 가하고자 하며, 따라서 다음과 같이 제안한다:—\n>\n> 천황은 포츠담선언의 규정을 수행하는 데 필요한 항복 조건에 일본국 정부 및 일본 대본영이 서명하도록 권한을 부여하고 이를 보증한다(shall authorise and ensure). 또한 천황은, 소재를 불문하고 모든 일본 육군·해군·공군 당국 및 그 통제 하의 모든 부대에 대하여, 적극적 작전을 중지하고 무기를 인도할 것 등을 — 귀하의 초안에 있는 바와 같이 — 명령한다(shall issue his commands).\n>\n> 이는 포츠담선언 제13조의 취지에 부합한다. 우리는 또한 이것이 외곽 지역 전역에 있는 일본군의 즉각적 항복을 확보하고, 그리하여 미국·영국 및 연합국의 인명을 구할 것이라고 믿는다.\n>\n> [629면]\n>\n> 우리는 이 조건들에 관하여 우리가 합의한다면 스탈린 대원수와 장제스 총통의 동의를 얻어야 할 것으로 본다.\"\n\n총리와 외무장관은 귀하의 회답을 기다리며 밤새 대기하고 있다. 처칠 씨가 오늘 밤 나에게 전화하였다. 이 메시지가 그의 견해와 일치한다는 점을 귀하가 알고자 할 것으로 생각한다. 그는 천황(미카도)을 활용하는 것이 외곽 지역에서 인명을 구할 것이라고 믿고 있다.\n\n위넌트(Winant)", "secondary": "London, August 11, 1945.\n[Received August 10—10:30 p.m.]\n\n2261. Reur White House Number 319. [주47] Immediately after receiving your message I met with Mister Attlee [주48] and Mister Bevin [주49] at 10 Downing Street. They asked me to forward you the following message.\n\n“We have examined your draft. While agreeing in principle we desire to make certain amendments on the ground we doubt if it is wise to ask the Emperor personally to sign the surrender terms and therefore we would suggest the following:—\n\nThe Emperor shall authorise and ensure the signature by the Government of Japan and the Japanese General Headquarters of the surrender terms necessary to carry out the provisions of the Potsdam Declaration, and shall issue his commands to all the Japanese military, naval and air authorities and to all the forces under their control wherever located to cease active operations and to surrender their arms etc., as in your draft.\n\nThis is in keeping with clause 13 of the Potsdam Declaration. This we believe also will secure the immediate surrender of Japanese in all outlying areas and thereby save American, British and Allied lives.\n\n[629면]\n\nWe presume that if we are in accord on these terms we should get the agreement of Generalissimo Stalin and Generalissimo Chiang Kai-Shek.”\n\nThe Prime Minister and the Foreign Secretary are standing by all night for your answer. Mr. Churchill telephoned me tonight. I feel you would be interested to know that this message is in line with his views. He believes that using the Mikado will save lives in outlying areas.\n\nWinant", "notes": ["[주47] 8월 10일 오후 3시 45분자 전보, 626면 참조.", "[주48] 클레멘트 R. 애틀리(Clement R. Attlee), 영국 총리.", "[주49] 어니스트 베빈(Ernest Bevin), 영국 외무장관."], "note": "번역자 주 — 원문의 「Reur」는 「Reference your(귀하의 ~에 대하여)」를 줄인 전보 약어다. 「the Mikado」는 천황을 가리키는 당시 영어권 통칭으로, 원문 어감을 살려 「천황(미카도)」로 병기하였다. 발신일(8월 11일 런던)과 접수일(8월 10일 워싱턴)의 역전은 원문 그대로다.", "warn": false, "pages": ["628", "629"], "search": "Winant 위넌트(John G. Winant, 주영대사) Attlee 애틀리(Clement R. Attlee, 영국 총리) Bevin 베빈(Ernest Bevin, 영국 외무장관) Churchill 처칠(Winston S. Churchill) Stalin 스탈린 Chiang Kai-Shek 장제스 the Mikado 천황(미카도)"}, {"id": "d409", "order": 409, "date": "1945-08-11", "group": "A", "eyebrow": "d409 · The Ambassador in the Soviet Union (Harriman) to the Secretary of State", "title": "주소련 대사(해리먼)가 국무장관에게", "badge": null, "list_right": "문서 409", "meta": [{"k": "일자", "v": "1945-08-11"}, {"k": "시각", "v": "Moscow, August 11, 1945. [Received August 10—10:30 p.m.]"}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": "M 25259"}, {"k": "원문출처", "v": null, "txt": true}, {"k": "발신", "v": "주소련 대사 해리먼(Harriman)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 409 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d409"}], "summary": "8월 11일 자정 직후 몰로토프와의 회담에서 소련이 일본의 항복 제의에 「회의적」이며 이를 무조건 항복으로 보지 않아 만주 진공을 계속하고 있다고 통고받았고, 백악관 전문 320호를 전달했으나 몰로토프의 반응은 유보적이었다는 보고.", "points": ["영국 대사(클라크 커)와 해리먼이 몰로토프와 함께 있을 때 백악관 전문 320호가 해리먼에게 전달되었다.", "몰로토프는 일본 정부의 제의에 대한 양국 정부의 태도를 묻고 있던 참이었다.", "몰로토프는 소련의 태도가 「회의적(sceptical)」이라고 알렸다 — 소련은 그것을 무조건 항복으로 보지 않으며, 따라서 소련군은 만주 진공을 계속하고 있다.", "자정 직후였으므로 몰로토프는 그날이 소련 전역(戰役)의 사흘째이며 전역이 계속되리라는 점을 강조했다.", "해리먼은 몰로토프가 전쟁이 계속되기를 상당히 바라고 있다는 뚜렷한 인상을 받았다.", "전달된 미국 측 전문에 대한 몰로토프의 반응은 유보적이었고 「내일」 답을 주겠다고 했으나, 해리먼은 그것으로는 만족스럽지 않으며 오늘 밤에 답을 원한다고 했다.", "몰로토프는 이에 자국 정부와 협의해 오늘 밤 답을 주도록 애쓰겠다고 동의했다."], "primary": "모스크바, 1945년 8월 11일.\n[접수 8월 10일 — 오후 10시 30분]\n\nM 25259. 영국 대사[주49a]와 나는 귀하의 전문 「백악관 320호」[주50]가 나에게 전달되었을 때 몰로토프와 함께 있었다. 몰로토프는 일본 정부의 제의에 대하여 우리 각각의 정부의 태도가 어떠한지를 묻고 있던 참이었다. 그는 그에 대한 소련의 태도가 「회의적」이라고 우리에게 알렸다. 소련은 그것을 무조건 항복으로 보지 않기 때문이며, 따라서 소련군은 만주로의 진격을 계속하고 있다고 했다. 이때가 자정을 갓 지난 무렵이었으므로, 그는 오늘이 소련 전역(戰役)의 사흘째이며 그 전역이 계속될 것이라는 점을 강조했다.[주51] 그는 나에게 자신이 전쟁이 계속되기를 상당히 바라고 있다는 뚜렷한 인상을 주었다.\n\n그때 귀하의 전문이 도착하여 그에게 번역되어 전해졌다. 그의 반응은 유보적이었으며, 내일 나에게 답을 주겠다는 뜻을 비쳤다. 나는 그에게 그것으로는 만족스럽지 않으며 우리는 오늘 밤에 그것을 원한다고 말했다. 그는 이에 자국 정부에 그 문제를 상정하여 오늘 밤 나에게 답을 주도록 애써 보겠다고 동의했다. 만일 합당한 시간 안에 그로부터 소식을 듣지 못하면 나는 그에게 전화를 걸 것이며, 진전 상황을 귀하에게 계속 알리겠다.\n\n해리먼\n\n[630면]", "secondary": "Moscow, August 11, 1945.\n[Received August 10—10:30 p.m.]\n\nM 25259. The British Ambassador [주49a] and I were with Molotov when your message White House 320 [주50] was delivered to me. Molotov was in process of inquiring what the attitude of our respective governments were to the Japanese Government’s proposal. He informed us that the Soviet attitude towards it was “sceptical” since the Soviets did not consider it unconditional surrender, and that the Soviet forces, therefore, were continuing their advance into Manchuria. As this was shortly after midnight, he emphasized that it was the third day of the Soviet campaign which would continue. [주51] He gave me the definite impression that he was quite willing to have the war continue.\n\nYour message then arrived and it was translated to him. His reaction was noncommittal and suggested that he would give me an answer tomorrow. I told him that this would not be satisfactory and that we wished it tonight. He thereupon agreed to take it up with his Government and attempt to give me an answer tonight. If I do not hear from him in a reasonable time, I will telephone him and keep you informed of the developments.\n\nHarriman\n\n[630면]", "notes": ["[주49a] 아치볼드 J. K. 클라크 커 경(Sir Archibald J. K. Clark Kerr).", "[주50] 626면 각주 44 참조.", "[주51] 이 전역은 8월 9일에 시작되었다."], "note": "번역자 주 — 모스크바발. 발신 8월 11일, 접수 8월 10일 오후 10시 30분으로 접수일이 발신일보다 앞서는 것은 시차 때문이며, 원문 표기 그대로 두었다. 「sceptical」은 원문의 인용부호를 살려 「회의적」으로 옮겼다. 'campaign'은 소련의 대일 군사행동을 가리키므로 「전역(戰役)」으로 옮겼다.", "warn": false, "pages": ["629", "630"], "search": "Harriman 해리먼 — 주소련 미국 대사, 발신자 Molotov 몰로토프 — 소련 외무인민위원 Sir Archibald J. K. Clark Kerr 아치볼드 J. K. 클라크 커 경 — 주소련 영국 대사"}, {"id": "d410", "order": 410, "date": "1945-08-11", "group": "A", "eyebrow": "d410 · The Ambassador in the Soviet Union (Harriman) to the Secretary of State", "title": "주소련대사(해리먼)가 국무장관에게", "badge": null, "list_right": "문서 410", "meta": [{"k": "일자", "v": "1945-08-11"}, {"k": "시각", "v": "1945년 8월 11일 발신 (Moscow) / 8월 10일 오후 11시 40분 접수 (Received August 10—11:40 p.m.)"}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": "M 25260"}, {"k": "원문출처", "v": "740.00119 P.W./8–1145: Telegram", "txt": true}, {"k": "발신", "v": "주소련대사 해리먼(W. Averell Harriman)", "txt": true}, {"k": "수신", "v": "국무장관 번스(James F. Byrnes)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 410 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d410"}], "summary": "소련이 미국의 대일 회답 초안에 동의하면서도 연합국 최고사령부의 대표 후보에 관한 「합의」 조항을 붙였고, 해리먼이 격렬히 반대한 끝에 스탈린이 그 문구를 「협의」로 완화한 경과 보고.", "points": ["몰로토프가 영국 대사와 해리먼을 다시 불러 문서로 된 성명을 건넸다.", "소련 정부는 미국이 제의한 연합국 회답 초안에 동의한다.", "다만 그 회답은 대일 교전 주요국들의 이름으로 제시되어야 한다고 봄.", "쟁점은 마지막 항 — 일본이 긍정적으로 회답할 경우, 천황과 일본 정부가 종속될 「연합국 최고사령부의 대표 후보 또는 후보들」에 관하여 연합국이 「합의에 도달해야(reach an agreement)」 한다는 것.", "해리먼은 이것이 소련에 최고사령부 선정에 대한 거부권을 주는 것이라며 본국 정부가 결코 동의하지 않을 것이라고 단호히 반대.", "몰로토프는 최고사령부가 미국 장군과 소련 장군 두 사람으로 구성될 수 있다고 하면서 바실렙스키 원수를 지명했다. 해리먼은 「최고사령관이 미국인 외의 인물이라는 것은 생각할 수 없다」고 답함.", "격론 끝에 몰로토프는 전달을 고집. 해리먼이 사무실에 돌아오니 몰로토프의 비서 파블로프가 전화로, 몰로토프가 스탈린과 상의했으며 「오해가 있었고 협의(consultation)만을 의도했지 합의 도달의 필요성을 의도한 것은 아니다」라고 전함.", "해리먼이 「또는 후보들(or candidacies)」이라는 말도 수용될 수 없다고 지적하자, 몇 분 뒤 스탈린이 그 말의 삭제에 동의했다는 회신이 옴. 서면 확인 약속.", "수정된 최종 문안: 「…연합국은 …연합국 최고사령부의 대표 후보에 관하여 협의해야 한다(should consult).」", "해리먼은 이렇게 수정된 소련 측 회답이 수락 가능한지 훈령을 요청."], "primary": "모스크바, 1945년 8월 11일.\n[8월 10일 오후 11시 40분 접수]\n\nM 25260. 몰로토프가 영국 대사와 나에게 다시 방문해 줄 것을 요청하였다. 그는 우리에게 다음 성명을 건넸다.\n\n> \"소련 정부는 항복에 관한 일본 정부의 성명에 대하여 미국 정부가 제의한 연합국의 회답 초안에 동의한다.\n>\n> \"소련 정부는 위에 언급한 회답이 일본과 교전 중인 주요국들의 이름으로 제시되어야 한다고 본다.\n>\n> \"소련 정부는 또한, 일본 정부로부터 긍정적인 회답이 있을 경우, 연합국은 일본 천황과 일본 정부가 종속될 연합국 최고사령부의 대표를 위한 후보 또는 후보들에 관하여 합의에 도달해야 한다고 본다.\n>\n> \"소련 정부의 권한에 의하여 서명: V. 몰로토프.\"\n\n나는 마지막 항에 단호히 이의를 제기하고, 내 의견으로는 우리 정부가 결코 그것에 동의하지 않을 것이라고 말하였다. 나는 이것이 우리 제의에 대한 소련 정부 수락에 붙인 단서이며, 소련 정부에게 연합국 최고사령부의 선정에 대한 거부권을 주는 것이라고 지적하였다. 그 의미가 무엇이냐는 내 질문에 대하여 그는 마침내 최고사령부가 미국인 장군과 소련인 장군 두 사람으로 구성될 수도 있다고 제안하면서, 바실렙스키 원수 [주52] 를 이름을 들어 지목하였다. 나는 최고사령관이 미국인 이외의 인물이라는 것은 생각할 수 없는 일이라고 언명하였다.\n\n대단히 격렬한 논의 끝에 그는 자신의 통첩을 내 정부에 보낼 것을 고집하였다. 그러나 나는 내 의견으로는 그것이 수락될 수 없을 것이라는 입장을 견지하였다.\n\n내가 사무실에 도착하였을 때, 몰로토프의 비서 파블로프 [주52a] 가 전화로 몰로토프가 스탈린과 상의하였음을 알려 왔다. 그는 오해가 있었으며, 협의만이 의도되었을 뿐 합의에 도달할 필요성이 의도된 것은 아니라고 말하였다. 나는 그 비서에게 「또는 후보들」이라는 말 역시 수락될 수 없으리라고 본다고 지적하고, 이 뜻을 몰로토프에게 전해 줄 것을 요청하였다. 몇 분 이내에 그가 다시 전화하여 스탈린이 이 말들의 삭제에 동의하였다고 말하였다. 그는 이를 서면으로 확인하기로 동의하였다.\n\n[631면]\n\n따라서 마지막 항은 다음과 같이 된다: \"소련 정부는 또한, 일본 정부로부터 긍정적인 회답이 있을 경우, 연합국은 일본 천황과 일본 정부가 종속될 연합국 최고사령부의 대표를 위한 후보에 관하여 협의해야 한다고 본다.\"\n\n지금과 같이 수정된 소련 측 회답이 수락 가능한지에 관하여 지침을 주면 감사하겠다.\n\n[해리먼(Harriman)]", "secondary": "Moscow, August 11, 1945.\n[Received August 10—11:40 p.m.]\n\nM 25260. Molotov asked the British Ambassador and me to call again. He handed us the following statement.\n\n“The Soviet Government agrees to the draft reply of the Allied Powers proposed by the United States Government to the statement of the Japanese Government concerning surrender.\n\n“The Soviet Government considers that the above mentioned reply should be presented in the name of the principal powers waging war with Japan.\n\n“The Soviet Government also considers that, in case of an affirmative reply from the Japanese Government, the Allied Powers should reach an agreement on the candidacy or candidacies for representation of the Allied High Command to which the Japanese Emperor and the Japanese Government are to be subordinated.\n\n“On the authority of the Government of the U.S.S.R. signed: V. Molotov.”\n\nI took a firm exception to the last paragraph and said in my opinion that my Government would never agree to it. I pointed out this was a qualification of the Soviet Government’s acceptance of our proposal and that it gave the Soviet Government veto power on the selection of the Allied High Command. In answer to my inquiry as to his meaning he finally suggested that the High Command might consist of two persons, both an American and a Soviet General, specifying Marshal Vasilevsky [주52] by name. I stated that it was unthinkable that the Supreme Commander could be other than American.\n\nAfter a most heated discussion he insisted that I send his communication to my Government. I maintained, however, that in my opinion it would be unacceptable.\n\nWhen I reached my office, I found Pavlov, [주52a] Molotov’s secretary, on the telephone, advising me that Molotov had consulted Stalin. He said that there had been a misunderstanding and that only consultation had been intended and not the necessity of reaching an agreement. I pointed out to the secretary that I believed the words “or candidacies” would also be unacceptable and asked him to convey this message to Molotov. Within a few minutes he called back stating that Stalin had agreed to the deletion of these words. He agreed to confirm this in writing.\n\n[631면]\n\nThe last paragraph will therefore read: “The Soviet Government also considers that, in case of an affirmative reply from the Japanese Government, the Allied Powers should consult on the candidacy for representation of the Allied High Command to which the Japanese Emperor and the Japanese Government are to be subordinated.”\n\nI would appreciate advice as to whether the Soviet reply as now amended is acceptable.\n\n[\n\nHarriman\n\n]", "notes": ["[주52] 알렉산드르 미하일로비치 바실렙스키(Alexander Mikhailovich Vasilevsky) 원수, 극동 소련군 총사령관.", "[주52a] 블라디미르 니콜라예비치 파블로프(Vladimir Nikolayevich Pavlov)."], "note": "번역자 주 — 쟁점은 「reach an agreement(합의에 도달)」 대 「consult(협의)」, 그리고 「candidacy or candidacies(후보 또는 후보들)」 대 「candidacy(후보)」의 단복수 차이다. 복수형은 최고사령부를 미·소 공동으로 두겠다는 뜻이 되므로 해리먼이 삭제를 요구했다. 그 어휘 차이가 이 문서의 전부이므로 직역을 유지했다.", "warn": false, "pages": ["630", "631"], "search": "Harriman 해리먼(W. Averell Harriman, 주소련대사) Molotov 몰로토프(V. M. Molotov, 소련 외무인민위원) Vasilevsky 바실렙스키(Alexander M. Vasilevsky, 극동 소련군 총사령관) Pavlov 파블로프(Vladimir N. Pavlov, 몰로토프의 비서) Stalin 스탈린 the British Ambassador 영국 대사 (원문에 성명 미기재)"}, {"id": "d411", "order": 411, "date": "1945-08-11", "group": "A", "eyebrow": "d411 · The Ambassador in the Soviet Union (Harriman) to the Secretary of State", "title": "주소련 대사(해리먼)가 국무장관에게", "badge": null, "list_right": "문서 411", "meta": [{"k": "일자", "v": "1945-08-11"}, {"k": "시각", "v": "접수 1945년 8월 11일 오전 9시 50분 (Received August 11—9:50 a.m.)"}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": "M–25264"}, {"k": "원문출처", "v": "740.00119 P. W./8–1145: Telegram", "txt": true}, {"k": "발신", "v": "주소련 미국대사 해리먼(Harriman)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 411 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d411"}], "summary": "해리먼이 몰로토프로부터, 일본 정부에 보낼 항복 관련 성명안에 대한 소련 측 회답의 변경 사항을 전날 밤 전화로 받은 대로 서면 확인받았음을 보고하고, 마지막 문단의 영어가 어색하나 러시아어의 축자역임을 밝힌다.", "points": ["대통령과 국무장관 앞. 전보번호 M–25264. 접수 8월 11일 오전 9시 50분.", "해리먼은 이날 아침 몰로토프로부터, 전날 밤 전화로 전달받았던 변경 사항을 서면으로 확인받았다.", "그 변경은 항복에 관하여 일본 정부에 보내기로 한 우리 측 성명안에 대한 몰로토프의 회답에 든 것으로, 앞서 전보 M–25260으로 보고한 바 있다.", "마지막 문단의 영어가 어색(clumsy)하다는 점을 해리먼 자신도 알고 있으나, 그것은 러시아어의 축자역(literal translation)이다.", "파블로프는 처음 구두 통역에서, 그리고 뒤이어 전화로 「candidacy(입후보)」 대신 「candidate(후보자)」라는 말을 썼다.", "해리먼은 그래도 축자역을 고수하는 편이 낫다고 판단했다.", "전보 M–25259로 보고한 몰로토프와의 대화가 그 문장의 뜻을 밝혀 주는 것으로 보인다."], "primary": "모스크바, 1945년 8월 11일.\n[접수 8월 11일 — 오전 9시 50분]\n\nM–25264. 대통령 및 국무장관 앞. 오늘 아침 나는, 항복에 관하여 일본 정부에 보내기로 우리가 제안한 성명에 대한 몰로토프(Molotov)의 회답 가운데 어젯밤 전화로 나에게 전달된 변경 사항을 — 귀하에게 나의 전보 번호 M–25260으로 보고한 바와 같은 것을 — 몰로토프로부터 서면으로 확인받았다. 마지막 문단이 영어로는 어색한 표현임을 나도 알고 있으나, 그것은 러시아어의 축자역이다. 파블로프(Pavlov)는 처음 구두 통역에서, 그리고 그 뒤 전화로 「candidacy(입후보)」 대신 「candidate(후보자)」라는 말을 썼다. 그러나 나는 축자역을 그대로 고수하는 편이 낫다고 생각하였다. 나의 전보 M–25259로 보고한 몰로토프와의 대화가 그 문장의 뜻을 분명히 해 주는 것으로 보인다.\n\n해리먼", "secondary": "Moscow, August 11, 1945.\n[Received August 11—9:50 a.m.]\n\nM–25264. For the President and the Secretary of State. This morning I received confirmation in writing from Molotov of the changes given me by telephone last night in his reply to our proposed statement to the Japanese Government on surrender as reported to you in my cable number M–25260. I realize that the last paragraph is clumsy language in English but it is a literal translation of the Russian. Pavlov in his early oral translation and subsequently by telephone used the word “candidate” instead of “candidacy”. I thought it better, however, to stick to the literal translation. My conversation with Molotov as reported in my M–25259 appears to clarify the meaning of the sentence.\n\nHarriman", "notes": [], "note": "번역자 주 — 「candidate」/「candidacy」는 소련 측 회답의 문제 문장(최고사령관 후보에 관한 것)과 관련되나, 그 문장 자체는 이 전보에 실려 있지 않다. 원문에 없는 배경은 본문에 섞지 않았다.", "warn": false, "pages": ["631"], "search": "W. Averell Harriman 애버렐 해리먼 — 주소련 미국대사 Vyacheslav Molotov 몰로토프 — 소련 외무인민위원 Vladimir Pavlov 파블로프 — 몰로토프의 통역"}, {"id": "d412", "order": 412, "date": "1945-08-11", "group": "B", "eyebrow": "d412 · The Secretary of State to the Swiss Chargé (Grässli)", "title": "국무장관이 스위스 대리대사(그레슬리)에게", "badge": null, "list_right": "문서 412", "meta": [{"k": "일자", "v": "1945-08-11"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 PW/8–1045", "txt": true}, {"k": "발신", "v": "국무장관 번스(James F. Byrnes)", "txt": true}, {"k": "수신", "v": "스위스 대리대사 그레슬리(Grässli)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 412 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d412"}], "summary": "일본의 항복 제의에 대한 미·영·소·중 4개국 정부를 대신한 연합국 회답(이른바 번스 회답) — 항복하는 순간부터 국가를 통치하는 천황과 일본국 정부의 권한은 연합국최고사령관에 종속된다고 밝힌다.", "points": ["8월 10일자 스위스 측 각서(일본의 항복 제의 전달)에 대한 회답으로, 대통령의 지시에 따라 미국·영국·소련·중국 4개국 정부를 대신하여 보내는 전언이다.", "일본 정부의 전언이 포츠담 선언 조항을 수락하면서도 「위 선언은 주권 통치자로서의 천황 폐하의 대권을 침해하는 어떠한 요구도 포함하지 않는다는 양해 아래」라는 문언을 담고 있는 데 대한 우리 입장을 밝힌다.", "「항복하는 순간부터, 국가를 통치하는 천황 및 일본국 정부의 권한은 연합국최고사령관에 종속된다(shall be subject to)」 — 최고사령관은 항복 조항을 실시하기 위하여 스스로 적당하다고 인정하는 조치를 취할 것이다.", "천황은 포츠담 선언의 규정을 수행하는 데 필요한 항복 조항에 일본국 정부와 일본 제국대본영이 서명하도록 권한을 부여하고 이를 보증할 것이 요구된다.", "천황은 모든 일본 육·해·공군 당국과 그 지휘 아래 있는 모든 부대에 대하여, 어디에 있든 전투 행동을 중지하고 무기를 인도하라는 명령을 내려야 하며(shall issue), 최고사령관이 항복 조항을 실시하기 위하여 요구하는 그 밖의 명령도 내려야 한다.", "항복 즉시 일본국 정부는 전쟁포로와 민간인 억류자를 지시받은 대로 안전한 장소로 수송하여, 그곳에서 신속히 연합국 수송선에 태울 수 있게 하여야 한다.", "일본의 궁극적 정부 형태는 포츠담 선언에 따라 일본 국민이 자유로이 표명한 의사에 의하여 수립된다(shall be established).", "연합국의 군대는 포츠담 선언에 제시된 목적이 달성될 때까지 일본에 주둔할 것이다."], "primary": "워싱턴, 1945년 8월 11일.\n\n각하: 본인은 귀하의 8월 10일자 각서를 접수하였음을 알리는 영광을 가지며, 그 회답으로 다음을 통보합니다. 미합중국 대통령은, 미합중국·영국·소비에트사회주의공화국연방 및 중국 각 정부를 대신하여 다음 전언을 귀 정부를 통하여 일본국 정부에 전달하도록 귀하에게 보낼 것을 본인에게 지시하였습니다.\n\n「일본국 정부의 전언은 포츠담 선언의 조항을 수락하면서도 '위 선언은 주권 통치자로서의 천황 폐하의 대권을 침해하는 어떠한 요구도 포함하지 않는다는 양해 아래(with the understanding that the said declaration does not comprise any demand which prejudices the prerogatives of His Majesty as a sovereign ruler)'라는 진술을 담고 있는바, 이에 관한 우리의 입장은 다음과 같다.\n\n「항복하는 순간부터, 국가를 통치하는 천황 및 일본국 정부의 권한은 연합국최고사령관에 [632면] 종속된다. 최고사령관은 항복 조항을 실시하기 위하여 스스로 적당하다고 인정하는 조치를 취할 것이다.\n\n「천황은 포츠담 선언의 규정을 수행하는 데 필요한 항복 조항에 일본국 정부 및 일본 제국대본영이 서명하도록 권한을 부여하고 이를 보증할 것이 요구된다. 또한 천황은 모든 일본 육군·해군·공군 당국 및 그 통제 아래 있는 모든 부대에 대하여, 그 소재를 불문하고 전투 행동을 중지하고 무기를 인도하도록 명령을 내려야 하며, 최고사령관이 항복 조항을 실시하기 위하여 요구할 수 있는 그 밖의 명령도 내려야 한다.\n\n「항복 즉시 일본국 정부는 전쟁포로 및 민간인 억류자를 지시받은 대로 안전한 장소로 수송하여, 그곳에서 신속히 연합국 수송선에 태울 수 있도록 하여야 한다.\n\n「일본의 궁극적인 정부 형태는 포츠담 선언에 따라 일본 국민이 자유로이 표명한 의사에 의하여 수립된다.\n\n「연합국의 군대는 포츠담 선언에 제시된 목적이 달성될 때까지 일본에 주둔할 것이다.」\n\n경구 [이하 인사말]\n\n[\n\n제임스 F. 번스\n\n]", "secondary": "Washington, August 11, 1945.\n\nSir: I have the honor to acknowledge receipt of your note of August 10, and in reply to inform you that the President of the United States has directed me to send to you for transmission by your Government to the Japanese Government the following message on behalf of the Governments of the United States, the United Kingdom, the Union of Soviet Socialist Republics, and China:\n\n“With regard to the Japanese Government’s message accepting the terms of the Potsdam proclamation but containing the statement, ‘with the understanding that the said declaration does not comprise any demand which prejudices the prerogatives of His Majesty as a sovereign ruler,’ our position is as follows:\n\n“From the moment of surrender the authority of the Emperor and the Japanese Government to rule the state shall be subject to the [632면] Supreme Commander of the Allied powers who will take such steps as he deems proper to effectuate the surrender terms.\n\n“The Emperor will be required to authorize and ensure the signature by the Government of Japan and the Japanese Imperial General Headquarters of the surrender terms necessary to carry out the provisions of the Potsdam Declaration, and shall issue his commands to all the Japanese military, naval and air authorities and to all the forces under their control wherever located to cease active operations and to surrender their arms, and to issue such other orders as the Supreme Commander may require to give effect to the surrender terms.\n\n“Immediately upon the surrender the Japanese Government shall transport prisoners of war and civilian internees to places of safety, as directed, where they can quickly be placed aboard Allied transports.\n\n“The ultimate form of government of Japan shall, in accordance with the Potsdam declaration, be established by the freely expressed will of the Japanese people.\n\n“The armed forces of the Allied Powers will remain in Japan until the purposes set forth in the Potsdam declaration are achieved.”\n\nAccept [etc.]\n\n[\n\nJames F. Byrnes\n\n]", "notes": [], "note": "번역자 주 — 쟁점 문장은 원문의 조건절과 조동사를 그대로 살렸다. 일본 측 조건절 「with the understanding that … prejudices the prerogatives of His Majesty as a sovereign ruler」는 풀어 쓰지 않고 원문 병기하였다. 「shall be subject to」의 subject to는 '종속된다'로 직역하였다 — 일본 측이 이를 '제한 아래 놓인다(制限ノ下ニ置カルル)'로 옮긴 것이 뒤의 쟁점이 되나, 그 사정은 이 원문에 없으므로 본문에 섞지 않았다. 「Supreme Commander of the Allied powers」는 원문 표기 그대로이며 뒤의 문서들(d441 등)에서는 「Supreme Commander for the Allied Powers」로 나타난다. 「Accept [etc.]」는 외교 서한의 정형 결구를 FRUS가 생략한 것이다.", "warn": false, "pages": ["631", "632"], "search": "James F. Byrnes 제임스 F. 번스 — 국무장관 Max Grässli 그레슬리 — 스위스 대리대사 Harry S. Truman 트루먼 — 미합중국 대통령 (본문에서는 「미합중국 대통령」으로만 지칭)"}, {"id": "d413", "order": 413, "date": "1945-08-11", "group": "C", "eyebrow": "d413 · Memorandum of Telephone Conversation, by the Director of the Office of European Affairs (Matthews)", "title": "유럽국장(매슈스)의 전화 대화 비망록", "badge": null, "list_right": "문서 413", "meta": [{"k": "일자", "v": "1945-08-11"}, {"k": "시각", "v": "1945년 8월 11일 오전 10시 46분 (전화를 건 시각, at 10:46 this morning)"}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 PW/8–1145", "txt": true}, {"k": "발신", "v": "유럽국장 매슈스(H. Freeman Matthews)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전화 비망록"}], "links": [{"k": "FRUS", "text": "문서 413 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d413"}], "summary": "매슈스가 8월 11일 오전 10시 46분 스위스 대리대사 그레슬리에게 전화하여, 방금 전달한 연합국 회답에 대해 일본 정부의 신속한 회답을 기대한다는 뜻을 스위스 정부가 일본에 전해 줄 것을 요청한 기록.", "points": ["차관(그루)의 지시가 던을 통해 매슈스에게 전달되었다.", "매슈스가 그날 오전 10시 46분에 스위스 대리대사 그레슬리에게 전화했다 — 분 단위까지 기록된 시각이다.", "직전에 월너가 그레슬리에게 두고 온 통첩, 즉 일본의 평화 제의에 대한 회답을 언급.", "요청 내용: 미국·영국·소련·중국 4개국 정부를 대신하여 전달된 그 메시지에 대해 본국 정부가 신속한 회답을 기대한다는 것을 스위스 정부가 일본 정부에 전해 달라는 것.", "회답이 「4개국 정부를 대신하여(on behalf of the Governments of…)」 전달되었음을 명시한 대목이 소련이 요구했던 「주요 교전국들의 이름으로」와 맞물린다."], "primary": "[워싱턴,] 1945년 8월 11일.\n\n차관의 지시에 따라(던 씨 [주53] 를 통하여 나에게 전달됨) 나는 오늘 아침 10시 46분에 스위스 대리대사 그레슬리 씨에게 전화하였다. 나는 방금 월너 씨 [주54] 가 그에게 두고 온, 일본의 평화 제의에 대한 회답을 담은 통첩을 언급하면서, 미합중국·영국·소비에트 사회주의 공화국 연방 및 중국 정부를 대신하여 전달된 그 메시지에 대하여 본국 정부가 신속한 회답을 기대하고 있음을 스위스 정부가 일본 정부에 전달하도록 요청해 줄 것을 그에게 요청하였다.\n\nH. F[리먼] M[매슈스]", "secondary": "[Washington,] August 11, 1945.\n\nUnder the Secretary’s instructions (conveyed to me by Mr. Dunn [주53] ) I telephoned Mr. Grässli, the Swiss Chargé d’Affaires, at 10:46 this morning. I referred to the communication just left with him by Mr. Wallner [주54] containing the reply to the Japanese peace move and asked him to request the Swiss Government to convey to the Japanese Government that this Government expects a prompt answer to the message communicated on behalf of the Governments of the United States, the United Kingdom, the Union of Soviet Socialist Republics, and China.\n\nH. F[reeman] M[atthews]", "notes": ["[주53] 제임스 클레먼트 던(James Clement Dunn), 유럽·극동·근동 및 아프리카 담당 국무차관보.", "[주54] 우드러프 월너(Woodruff Wallner), 서유럽과(Division of Western European Affairs)."], "note": "번역자 주 — 「Under Secretary」는 본문에 이름이 없으나 당시 국무차관은 그루다 — 본문에는 원문대로 「차관」으로만 두고 people에만 병기했다. 서명 「H. F[reeman] M[atthews]」의 대괄호는 원문 편집자가 이니셜을 풀어 보충한 것이며 그 형태를 유지했다.", "warn": false, "pages": ["632"], "search": "Matthews 매슈스(H. Freeman Matthews, 유럽국장) Dunn 던(James Clement Dunn, 국무차관보) Grässli 그레슬리(Max Grässli, 스위스 대리대사) Wallner 월너(Woodruff Wallner, 국무부 서유럽과) the Under Secretary 국무차관 (그루Joseph C. Grew)"}, {"id": "d414", "order": 414, "date": "1945-08-11", "group": "A", "eyebrow": "d414 · The Secretary of State to the Minister in Switzerland (Harrison)", "title": "국무장관이 주스위스 공사(해리슨)에게", "badge": null, "list_right": "문서 414", "meta": [{"k": "일자", "v": "1945-08-11"}, {"k": "시각", "v": "정오 발신 (August 11, 1945—noon). 본문에 인용된 시각: 회답 교부 「오늘 오전 10시 30분」, 참조 전보 발신 「8월 10일 오후 8시」"}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "2510"}, {"k": "원문출처", "v": "740.00119 PW/8–1145: Telegram", "txt": true}, {"k": "발신", "v": "국무장관 번스(Byrnes)", "txt": true}, {"k": "수신", "v": "주스위스 공사 해리슨(Harrison)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 414 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d414"}], "summary": "국무부가 어젯밤 이곳 스위스 공사관을 통하여 일본의 항복 조건 본문을 접수하였으며, 4개국 정부를 대신한 우리 회답이 오늘 오전 10시 30분 스위스 대리대사에게 교부되고 그 본문이 공표되었음을 알린다.", "points": ["전보번호 2510. 워싱턴 8월 11일 정오 발신.", "국무부는 어젯밤 이곳(워싱턴) 스위스 공사관을 통하여, 귀관의 8월 10일 오후 8시자 전보 제3864호에 담긴 일본 측 항복 조건 본문을 접수하였다.", "4개국 정부를 대신한 우리 회답은 오늘 오전 10시 30분에 스위스 대리대사에게 교부되었다.", "그 본문은 공표되었다."], "primary": "워싱턴, 1945년 8월 11일 정오.\n\n2510. 국무부는 어젯밤 이곳 스위스 공사관을 통하여, 귀관의 8월 10일 오후 8시자 전보 제3864호에 담긴 일본 측 항복 조건의 본문을 접수하였다. [633면] 4개국 정부를 대신한 우리 회답은 오늘 오전 10시 30분에 스위스 대리대사에게 교부되었고, 그 본문은 공표되었다.\n\n번스", "secondary": "Washington, August 11, 1945—noon.\n\n2510. Dept received last night through Swiss Legation here text of Japanese surrender terms contained urtel 3864 August 10, 8 p.m. [633면] Our reply on behalf of the four governments was delivered to the Swiss Chargé d’Affaires at 10:30 a.m. today and text has been made public.\n\nByrnes", "notes": [], "note": "번역자 주 — 「urtel 3864」는 전보 약어(your telegram 3864)이다. 여기서 말하는 「우리 회답」이 d412이며, 이 전보가 그 교부 시각(오전 10시 30분)을 확정해 준다.", "warn": false, "pages": ["632", "633"], "search": "James F. Byrnes 번스 — 국무장관 Leland Harrison 해리슨 — 주스위스 미국공사 Max Grässli 그레슬리 — 스위스 대리대사 (본문에서는 「스위스 대리대사」로만 지칭)"}, {"id": "d415", "order": 415, "date": "1945-08-11", "group": "A", "eyebrow": "d415 · The Ambassador in the United Kingdom (Winant) to the Secretary of State", "title": "주영 대사(위넌트)가 국무장관에게", "badge": null, "list_right": "문서 415", "meta": [{"k": "일자", "v": "1945-08-11"}, {"k": "시각", "v": "접수 1945년 8월 11일 오후 3시 15분 (Received August 11—3:15 p.m.)"}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "2263"}, {"k": "원문출처", "v": null, "txt": true}, {"k": "발신", "v": "주영 대사 위넌트(Winant)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 415 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d415"}], "summary": "영국 정부가 일본 정부 앞으로 스위스 정부에 보낸 미국의 통보에 동의한다는 회신을 전달하다.", "points": ["8월 11일 오후 3시 15분 접수된 런던발 전보 제2263호.", "영국 정부가 「일본 정부 앞으로 스위스 정부에 보낸 귀하의 통보를 접수하였으며, 동의한다」고 회신했다.", "최종 문안에 영국 측 제안이 수용된 데 대해 런던에서 깊이 감사하고 있다."], "primary": "런던, 1945년 8월 11일.\n[1945년 8월 11일 오후 3시 15분 접수]\n\n2263. 본인은 다음의 통보를 각하께 전달해 달라는 요청을 받았습니다.\n\n> 「영국 정부는 일본 정부 앞으로 스위스 정부에 보낸 귀하의 통보를 접수하였으며, 이에 동의한다.」\n\n최종 문안에서 영국 측 제안이 수용된 데 대하여 이곳에서는 깊이 감사하고 있습니다.\n\n위넌트", "secondary": "London, August 11, 1945.\n[Received August 11—3:15 p.m.]\n\n2263. I have been asked to forward to you the following message:\n\n“His Majesty’s Government have received your communication to the Swiss Government for the Japanese Government, and agree.”\n\nThe acceptance of the British suggestions in the final text was deeply appreciated here.\n\nWinant", "notes": [], "note": "번역자 주 — 「His Majesty's Government」는 영국 정부를 가리키는 정식 표현이므로 「영국 정부」로 옮겼다. 원문의 접수 시각을 본문 머리에 그대로 두었다.", "warn": false, "pages": ["633"], "search": "Winant 위넌트(John G. Winant) — 주영 미국대사 His Majesty's Government 영국 정부"}, {"id": "d416", "order": 416, "date": "1945-08-11", "group": "B", "eyebrow": "d416 · The Secretary of State to the Secretary of War (Stimson)", "title": "국무장관이 육군장관(스팀슨)에게", "badge": null, "list_right": "문서 416", "meta": [{"k": "일자", "v": "1945-08-11"}, {"k": "시각", "v": "「오늘 정오부터(since noon today)」 전시정보국 방송 개시"}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": null, "txt": true}, {"k": "발신", "v": "국무장관 번스(James F. Byrnes)", "txt": true}, {"k": "수신", "v": "육군장관 스팀슨(Stimson)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 416 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d416"}], "summary": "일본 국민에게 자국 정부의 항복 제의와 연합국 회답을 알리기 위해 일본 본토에 대규모 전단 살포를 실시해 달라고 국무장관이 육군부에 요청하다.", "points": ["일본 국민이 자국 정부의 항복 제의와, 미국이 미·영·소·중을 대표해 보낸 회답을 알게 되는 것이 무엇보다 중요하다.", "입수 가능한 최선의 정보에 따르면 일본 정부는 국민에게 그 제의를 알리지 않았다.", "전시정보국(OWI)이 오늘 정오부터 8월 10일자 스위스 정부 각서(일본의 제의 전달)와 8월 11일자 국무장관 회답의 요지를 방송하고 있다.", "그러나 단파방송만으로는 일본 대중에게 닿기에 불충분하며, 대규모 전단 살포만이 목적을 이룰 수 있어 보인다.", "일본 본토 제도에 대한 전단 살포를 가능한 한 이른 시각에 실시해 줄 것을 요청한다.", "[주55] 육군장관 대리 패터슨은 8월 21일 회신에서, 제안된 전단 살포가 8월 13일과 14일에 실시되었다고 알렸다."], "primary": "워싱턴, 1945년 8월 11일.\n\n장관 각하: 각하께서도 동의하시리라 확신하는 바이지만, 일본 국민이 자국 정부의 항복 제의와 우리 정부가 우리 자신 및 영국·소비에트사회주의공화국연방·중국을 대표하여 전달한 회답을 알게 되는 것은 무엇보다 중요한 일입니다.\n\n입수 가능한 최선의 정보에 따르면, 일본 정부는 그 제의를 일본 국민에게 알리지 않았습니다. 전시정보국은 오늘 정오부터 일본의 제의를 전달한 8월 10일자 스위스 정부 각서와 본인의 8월 11일자 회답의 요지를 방송해 오고 있습니다. 그러나 단파방송은 일본 국민 대중에게 닿는 수단으로는 불충분합니다. 대규모 전단 살포만이 바라는 결과를 얻을 수 있을 것으로 보입니다.\n\n따라서 본인은 일본 본토 제도에 대한 전단 살포를 가능한 한 이른 시각에 실시하여 주실 것을 요청드리는 바입니다. 육군부가 이 요청에 응하는 것이 가능하다고 판단해 주신다면 깊이 감사하겠습니다. [주55]\n\n삼가,\n\n[\n\n제임스 F. 번스\n\n]\n\n[634면]", "secondary": "Washington, August 11, 1945.\n\nDear Mr. Secretary: It is, as I am sure you will agree, of the first importance that the Japanese people should be informed of the surrender offer of their Government and the reply communicated by our Government on behalf of ourselves, the United Kingdom, the Union of Soviet Socialist Republics, and China.\n\nAccording to the best available information, the Japanese Government has not informed the Japanese people of the offer. The Office of War Information has been broadcasting since noon today the substance of the note of August 10 from the Swiss Government communicating the Japanese offer and my reply of August 11. Short wave broadcasting, however, is an inadequate means of reaching the masses of the Japanese people. Only an extensive leaflet raid would seem capable of attaining the desired result.\n\nI am therefore writing to request that a leaflet raid upon the Japanese home islands be carried out at the earliest possible moment. It will be deeply appreciated if the War Department finds it possible to comply with this request. [주55]\n\nSincerely yours,\n\n[\n\nJames F. Byrnes\n\n]\n\n[634면]", "notes": ["[주55] 이 서한에 대한 회답으로, 육군장관 대리 패터슨(Patterson)은 8월 21일에 일본 도시들에 대한 제안된 전단 살포가 8월 13일과 14일에 실시되었다고 써 보냈다 (740.00119 FEAC/8–2145)."], "note": "번역자 주 — 서명란의 대괄호 「[ … ]」는 원문 그대로 두었다(FRUS 편집자가 서명 부분을 보충 표기한 것). Office of War Information은 「전시정보국」으로 옮겼다.", "warn": false, "pages": ["633", "634"], "search": "James F. Byrnes 번스(제임스 F. 번스) — 국무장관 Stimson 스팀슨(Henry L. Stimson) — 육군장관 Patterson 패터슨(Robert P. Patterson) — 육군장관 대리(각주)"}, {"id": "d418", "order": 418, "date": "1945-08-11", "group": "X", "eyebrow": "d418 · Revision of General Order No. 1", "title": "일반명령 제1호 수정", "
