<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>일본의 항복 — 열람기</title>
<style>
:root{
  --bg:#eef1f4; --panel:#f7f9fa; --edge:#ccd4da; --edge-soft:#dde4e9;
  --ink:#16202a; --ink-2:#4a5b68; --ink-3:#71828f;
  --stamp:#8c2f39;            /* 기밀등급 도장의 자주색 */
  --link:#2f5d86;
  --a:#4a7c59; --b:#8a6d3b; --c:#3f6d8c; --d:#7a4a6b; --e:#5a6f7d; --x:#8a8f94;
  --term-line:#9db0c2; --term-bg:rgba(47,93,134,.05);
  --term-line-go:#7fa3c4; --term-bg-go:rgba(47,93,134,.10);
  --term-bg-on:rgba(47,93,134,.17);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",
         -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
    --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
    --stamp:#c9707a; --link:#7fb0da;
    --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
    --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
    --term-bg-on:rgba(127,176,218,.22);
    --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
  }
}
:root[data-theme="dark"]{
  --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
  --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
  --stamp:#c9707a; --link:#7fb0da;
  --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
  --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
  --term-bg-on:rgba(127,176,218,.22);
  --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--link)}

.wrap{display:grid;grid-template-columns:minmax(300px,25%) 1fr;height:100vh}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{max-height:42vh}
}

/* ── 좌측 목록 ─────────────────────────────── */
.rail{border-right:1px solid var(--edge);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
.rail-head{padding:14px 14px 10px;border-bottom:1px solid var(--edge-soft);
  display:flex;flex-direction:column;gap:8px}
/* 문서철에 들어오면 나갈 길이 있어야 한다 */
.home{display:inline-flex;align-items:center;gap:5px;text-decoration:none;
  color:var(--link);font-size:11.5px;font-family:var(--mono);
  letter-spacing:.04em;width:fit-content;
  background:var(--term-bg-go);border:1px solid var(--term-line-go);
  border-radius:999px;padding:2px 10px 2px 8px}
.home:hover{background:var(--term-bg-on);border-color:var(--link)}
.home span{font-size:12px;line-height:1}
.brand{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font-weight:400;letter-spacing:0;text-transform:none;
  color:var(--ink-3);font-size:11.5px;margin-top:2px}
input[type=search]{width:100%;padding:7px 10px;border:1px solid var(--edge);
  border-radius:3px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
input[type=search]:focus,button:focus-visible,.item:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--edge);background:transparent;color:var(--ink-2);
  border-radius:999px;padding:2px 9px;font-size:11.5px;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sortbar{display:flex;gap:10px;font-size:11.5px;color:var(--ink-3);align-items:center}
.sortbar button{background:none;border:none;color:var(--ink-3);cursor:pointer;
  font:inherit;padding:0;border-bottom:1px solid transparent}
.sortbar button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.list{overflow-y:auto;flex:1;min-height:0}
.item{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--edge-soft);border-left:3px solid transparent;
  padding:9px 13px;cursor:pointer;font:inherit;color:inherit}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--bg);border-left-color:var(--ink)}
.item.tA{border-left-color:var(--a)} .item.tB{border-left-color:var(--b)}
.item.tC{border-left-color:var(--c)} .item.tD{border-left-color:var(--d)}
.item.tE{border-left-color:var(--e)} .item.tX{border-left-color:var(--x)}
.item-top{display:flex;justify-content:space-between;gap:8px;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.item-sum{font-size:12.5px;line-height:1.45;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── 우측 본문 ─────────────────────────────── */
.main{overflow-y:auto;min-height:0}
.toolbar{position:sticky;top:0;z-index:5;background:var(--panel);
  border-bottom:1px solid var(--edge);padding:8px 26px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px}
.toolbar .grow{flex:1}
.seg{display:flex;border:1px solid var(--edge);border-radius:3px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 11px;cursor:pointer;
  font:inherit;font-size:12px;color:var(--ink-2);border-right:1px solid var(--edge)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.srcline{padding:10px 26px 0;font-size:11px;color:var(--ink-3);line-height:1.5}

/* ── 연대 바 ───────────────────────────────
   5년 반을 한 줄에 욱여넣으면 1945년 8월 열흘은 0.5% 밖에 안 된다. 그래서
   줄을 늘여 놓고 **띠 자체를 움직인다** — 지금 읽는 문서의 날짜가 늘 정중앙이다.
   문서를 옮기면 띠가 미끄러지고, 사건 이름은 겹치지 않게 위아래로 층을 나눈다. */
.chrono{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
  width:min(940px,calc(100vw - 48px));z-index:20;user-select:none;
  border:1px solid var(--edge);border-radius:8px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 20px rgba(0,0,0,.10);
  transition:box-shadow .2s ease}
.chrono:hover{box-shadow:0 6px 26px rgba(0,0,0,.18)}
/* 옅어지는 것은 **내용**이지 판이 아니다. 판까지 투명해지면 뒤의 본문이
   비쳐 들어와 글자가 서로를 밟는다. */
.chrono-track{opacity:.5;transition:opacity .2s ease}
.chrono:hover .chrono-track{opacity:1}

/* 띠가 지나가는 창. 손으로도 밀 수 있게 진짜 가로 스크롤을 쓴다 */
.chrono-vp{position:relative;overflow-x:auto;overflow-y:hidden;
  height:var(--chH,92px);border-radius:8px;cursor:grab;
  scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain}
.chrono-vp::-webkit-scrollbar{display:none}
.chrono-vp.drag{cursor:grabbing}
/* 안쪽 띠. 양옆 여백은 창의 절반 — 첫 문서도 마지막 문서도 가운데에 설 수 있게 */
.chrono-track{position:relative;height:100%;margin:0 var(--chPad,0px)}
/* 시간 축 — 층의 한가운데 */
.chrono-track::before{content:"";position:absolute;
  left:calc(0px - var(--chPad,0px));right:calc(0px - var(--chPad,0px));
  top:var(--axis,46px);height:1px;background:var(--edge)}

/* 연도 — 해가 바뀌는 자리에 선을 긋고, 그 선부터가 그 해다.
   이름표는 창 왼쪽에 들러붙는다. 1945년 한복판을 보고 있어도 「1945」가 남는다. */
.cy{position:absolute;top:0;bottom:0;
  border-left:1px solid color-mix(in srgb,var(--ink-3) 50%,transparent)}
.cy.alt{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.cy b{position:absolute;bottom:3px;font-family:var(--mono);font-size:11px;
  font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;
  line-height:1;letter-spacing:.06em;white-space:nowrap;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px}
/* 달·분기 눈금 — 해 안에서 어디쯤인지. 분기는 조금 길게 */
.cq{position:absolute;top:calc(var(--axis,46px) - 1.5px);width:1px;height:4px;
  background:var(--edge);opacity:.7}
.cq.q{top:calc(var(--axis,46px) - 2.5px);height:6px;opacity:1}
.cq[hidden]{display:none}

/* 배율 — 5년 반을 한눈에 볼 때와 8월 열흘을 벌려 볼 때가 같을 수 없다 */
.chrono-zoom{position:absolute;right:6px;top:5px;z-index:3;display:flex;gap:3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-zoom,.chrono-zoom:focus-within{opacity:1}
.chrono-zoom button{width:19px;height:19px;padding:0;line-height:1;
  font-family:var(--mono);font-size:12px;color:var(--ink-2);cursor:pointer;
  background:var(--panel);border:1px solid var(--edge);border-radius:3px}
.chrono-zoom button:hover:not(:disabled){color:var(--link);border-color:var(--link)}
.chrono-zoom button:disabled{opacity:.35;cursor:default}
.chrono-scale{position:absolute;right:6px;bottom:3px;z-index:3;
  font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.03em;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-scale{opacity:1}

/* 사건 점 */
.cm{position:absolute;top:calc(var(--axis,46px) - 3px);width:7px;height:7px;
  margin-left:-3.5px;border-radius:50%;background:var(--ink-3);z-index:1;
  border:1.5px solid var(--panel);cursor:help;
  transition:background .15s ease,transform .15s ease}
.cm.key{background:var(--stamp);width:9px;height:9px;margin-left:-4.5px;
  top:calc(var(--axis,46px) - 4px)}
.cm:hover{background:var(--link);transform:scale(1.45)}

/* 사건 이름 — 층(lane)을 나눠 위아래로 흩는다. 여기서 겹침이 풀린다 */
.cl{position:absolute;transform:translateX(-50%);white-space:nowrap;z-index:1;
  font-family:var(--mono);font-size:10px;line-height:1.1;color:var(--ink-2);
  letter-spacing:.01em;padding:1px 4px;border-radius:2px;cursor:help;
  background:color-mix(in srgb,var(--panel) 70%,transparent)}
.cl.key{color:var(--stamp)}
.cl:hover,.cl:focus-visible{color:var(--link);outline:0;
  background:color-mix(in srgb,var(--link) 12%,var(--panel))}
/* 이름에서 축까지 내려/올려 긋는 실 — 어느 점의 이름인지 알아보게 */
.cl::after{content:"";position:absolute;left:50%;width:1px;background:var(--edge)}
.cl.up::after{top:100%;height:var(--leg,0px)}
.cl.dn::after{bottom:100%;height:var(--leg,0px)}

/* 지금 읽는 문서가 놓인 자리. 문서를 고르면 이 표가 창 한가운데로 온다.
   손으로 띠를 밀면 표는 제 날짜에 남는다 — 표는 시간에 박혀 있지 창에 박혀 있지 않다. */
.chrono-cursor{position:absolute;top:0;bottom:0;width:1px;z-index:2;
  background:var(--stamp);pointer-events:none}
/* 가상 요소는 위의 *{box-sizing:border-box}가 닿지 않는다 — 여기서 직접 잡아 주지
   않으면 테두리 2px 만큼 표시가 축 아래·오른쪽으로 밀려 앉는다. */
.chrono-cursor::before{content:"";position:absolute;box-sizing:border-box;
  left:-6px;top:calc(var(--axis,46px) - 6px);width:13px;height:13px;
  border-radius:50%;background:var(--stamp);border:2px solid var(--panel)}
/* 날짜는 맨 아래, 표 바로 밑에 — 위쪽은 사건 이름 층에 내준다 */
.chrono-date{position:absolute;bottom:2px;transform:translateX(-50%);
  font-family:var(--mono);font-size:10px;color:var(--stamp);
  font-variant-numeric:tabular-nums;background:var(--panel);
  padding:0 5px;border-radius:2px;white-space:nowrap;z-index:2}
.chrono[data-nodate="1"] .chrono-cursor,
.chrono[data-nodate="1"] .chrono-date{display:none}

@media(max-width:900px){.chrono{display:none}}
@media(prefers-reduced-motion:reduce){.chrono-track{transition:none}}

/* 아래쪽 여백은 떠 있는 연대 바가 마지막 문단을 덮지 않을 만큼 */
article{max-width:none;padding:26px 26px 190px}
.doc-head{border-bottom:1px solid var(--edge);padding-bottom:14px;margin-bottom:18px}
h1{font-size:19px;margin:0 0 4px;line-height:1.35;text-wrap:balance;font-weight:650}
.docid{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  letter-spacing:.04em;font-variant-numeric:tabular-nums}
.stamp{display:inline-block;border:1.5px solid var(--stamp);color:var(--stamp);
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:1px 6px;
  border-radius:2px;transform:rotate(-1.2deg);margin-left:8px;vertical-align:2px}
.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:3px 20px;margin-top:10px;font-size:12.5px}
.meta div{display:flex;gap:7px}
/* 참석자 명단처럼 긴 값. 좁은 칸에 넣으면 한 글자씩 세로로 눌린다 */
.meta div.wide{grid-column:1/-1}
.meta b{color:var(--ink-3);font-weight:500;min-width:52px;font-size:11.5px}
.meta span{font-family:var(--mono);font-size:12px}
.meta span.txt{font-family:var(--sans);font-size:12.5px}

.points{margin:16px 0;padding:12px 16px;border-left:2px solid var(--edge);
  background:var(--panel);border-radius:0 3px 3px 0}
.points li{margin:3px 0}
.points ul{margin:0;padding-left:18px}

.cols{display:grid;gap:26px}
.cols.two{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.cols.two{grid-template-columns:1fr}}
.pane h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 8px;font-weight:600}
.body{white-space:pre-wrap;word-break:break-word}
/* 번역문에 마크다운이 섞여 들어온다 — 긴 문서는 옮긴 쪽이 소제목과 항목으로
   나눠 두어야 읽힌다. 본문은 pre-wrap 이므로 줄 단위로만 풀어 준다. */
.mdh{display:block;font-weight:700;margin:20px 0 6px;letter-spacing:-.01em}
.mdh.h1{font-size:17px} .mdh.h2{font-size:15.5px}
.mdh.h3,.mdh.h4,.mdh.h5,.mdh.h6{font-size:14px;color:var(--ink-2);
  letter-spacing:.04em}
.mdq{display:block;border-left:2px solid var(--edge);padding-left:13px;
  color:var(--ink-2);margin:6px 0}
.mdli{display:block;padding-left:17px;text-indent:-17px;margin:2px 0}
.mdli::before{content:"· ";color:var(--ink-3)}
.mdli[data-n]::before{content:attr(data-n) " ";color:var(--ink-3);
  font-family:var(--mono);font-size:12px}
.mdhr{border:0;border-top:1px solid var(--edge);margin:18px 0}
.body.en{font-family:var(--mono);font-size:12.5px;line-height:1.65;color:var(--ink-2)}
.body del{color:var(--ink-3)}
.body strong{font-weight:650}

.pagemark{display:block;margin:16px 0 6px;font-family:var(--mono);font-size:10.5px;
  color:var(--ink-3);letter-spacing:.06em;border-top:1px dashed var(--edge);padding-top:5px}
.pagemark.hit{cursor:zoom-in;text-decoration:underline;
  text-decoration-style:dotted;text-underline-offset:3px}
.pagemark.hit:hover{color:var(--link)}
.fnref{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);vertical-align:super}

/* 본문 속 용어 주석.
   앞서 --edge 로 밑줄을 그었더니 배경에 묻혀 아예 보이지 않았다.
   옅은 바탕을 깔아 「여기 무언가 있다」를 먼저 알리고, 점선으로 종류를 나눈다.
   다른 문서로 가는 것(a)과 설명만 뜨는 것(span)을 색으로 구분한다. */
.term{color:inherit;text-decoration:none;cursor:help;
  background:var(--term-bg);border-radius:2px;
  padding:0 2px;margin:0 -1px;
  border-bottom:1px dashed var(--term-line);
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
a.term{cursor:pointer;color:var(--link);
  background:var(--term-bg-go);border-bottom-color:var(--term-line-go)}
.term:hover{background:var(--term-bg-on);border-bottom-style:solid;
  border-bottom-color:var(--link);color:var(--link)}
.term:focus-visible{outline:2px solid var(--link);outline-offset:2px}

.fns{margin-top:24px;padding-top:14px;border-top:1px solid var(--edge-soft);
  font-size:12px;color:var(--ink-3);line-height:1.6}
.fns h2,.scans h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 9px;font-weight:600}
.fns div{margin:4px 0}
.note{margin-top:14px;font-size:12px;color:var(--ink-3);border-left:2px solid var(--edge);
  padding-left:11px}
.empty{padding:60px 26px;color:var(--ink-3)}
.warn{color:var(--stamp)}

/* ── 스캔 원본 ─────────────────────────────── */
.scans{margin-top:24px;padding-top:14px;border-top:1px solid var(--edge-soft)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{border:1px solid var(--edge);background:var(--panel);padding:0;cursor:zoom-in;
  border-radius:2px;overflow:hidden;line-height:0;position:relative}
.thumb:hover{border-color:var(--link)}
.thumb img{width:84px;height:110px;object-fit:cover;object-position:top center;
  display:block;background:var(--edge-soft)}
.thumb b{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.62);color:#fff;
  font-family:var(--mono);font-size:9.5px;font-weight:400;padding:1px 4px;
  letter-spacing:.04em;line-height:1.5}

/* ── 확대 뷰어 ─────────────────────────────── */
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,11,14,.94);
  display:none;flex-direction:column}
.lb[open]{display:flex}
.lb-bar{display:flex;align-items:center;gap:14px;padding:9px 16px;color:#c9d3db;
  font-size:12px;border-bottom:1px solid #2a343d;flex:none}
.lb-bar .grow{flex:1}
.lb-bar button{background:none;border:1px solid #3a464f;color:#c9d3db;
  border-radius:3px;padding:3px 11px;font:inherit;font-size:12px;cursor:pointer}
.lb-bar button:hover:not(:disabled){border-color:#7fb0da;color:#fff}
.lb-bar button:disabled{opacity:.35;cursor:default}
.lb-bar .pg{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lb-stage{flex:1;min-height:0;overflow:auto;display:flex;
  align-items:flex-start;justify-content:center;padding:16px}

/* 호버 카드 — 링크 위에 머물면 그 문서가 무엇인지 미리 보여 준다.
   열람기와 같은 토큰(--panel, --edge, --ink…)을 쓰므로 별도 팔레트가 없다.
   토큰을 정의하지 않은 페이지에 얹으려면 그 값들만 채워 주면 된다. */

.hc {
  position: fixed;
  z-index: 60;
  width: min(400px, calc(100vw - 32px));
  background: var(--panel);
  border: 1px solid var(--edge);
  border-radius: 4px;
  box-shadow: 0 6px 28px rgba(16, 26, 38, .16), 0 1px 3px rgba(16, 26, 38, .1);
  padding: 15px 17px 16px;
  font-size: 13.5px;
  line-height: 1.62;
  color: var(--ink-2);
  opacity: 0;
  transform: translateY(3px);
  transition: opacity .13s ease, transform .13s ease;
  pointer-events: none;
}
.hc[data-open] { opacity: 1; transform: none; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .hc {
    box-shadow: 0 6px 30px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
  }
}
:root[data-theme="dark"] .hc {
  box-shadow: 0 6px 30px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
}

.hc-top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: baseline;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 5px;
}
.hc-top .id { white-space: nowrap }

.hc h4 {
  margin: 0 0 7px;
  font-size: 14.5px;
  line-height: 1.42;
  font-weight: 640;
  color: var(--ink);
  text-wrap: balance;
}

/* 발신 → 수신. 문서철마다 있을 수도 없을 수도 있어 비면 통째로 빠진다 */
.hc-route {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  margin: 0 0 8px;
  line-height: 1.5;
}

.hc p.sum {
  margin: 0;
  /* 요약이 길 수 있다. 넘치면 자른다 — 카드는 미리보기지 본문이 아니다 */
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.hc ul {
  margin: 9px 0 0;
  padding-left: 16px;
  color: var(--ink-3);
  font-size: 12.5px;
}
.hc li {
  margin: 2px 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.hc-foot {
  margin-top: 11px;
  padding-top: 9px;
  border-top: 1px solid var(--edge-soft);
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-3);
  display: flex;
  justify-content: space-between;
  gap: 10px;
}
.hc-foot .go { color: var(--link) }

/* 손가락으로 쓰는 기기에는 호버가 없다. 링크는 그대로 동작하므로 카드만 뺀다 */
@media (hover: none) { .hc { display: none } }
@media (prefers-reduced-motion: reduce) {
  .hc { transition: none }
}

<script id="data" type="application/json">[{"id": "d340", "order": 340, "date": "1945-01-30", "group": "B", "eyebrow": "d340 · Memorandum by the Director of the Office of Far Eastern Affairs (Ballantine) to the Under Secretary of State (Grew)", "title": "극동국장(밸런타인)이 국무차관(그루)에게 보낸 각서", "badge": null, "list_right": "문서 340", "meta": [{"k": "일자", "v": "1945-01-30"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.0011 PW/1–3045", "txt": true}, {"k": "발신", "v": "극동국장 밸런타인(Joseph W. Ballantine)", "txt": true}, {"k": "수신", "v": "국무차관 그루(Joseph C. Grew)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 340 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d340"}], "summary": "OSS가 바티칸 접촉선에서 받은 일련의 보고 — 1945년 1월 초부터 일본이 태평양 전쟁에 대한 교황의 중재를 타진해 왔으며, 처음에는 일본 「실업가」들이 재일 가톨릭 고위 성직자를 통해, 최근에는 바티칸 주재 일본 공사 하라다 겐(Ken Harada)이 직접 교섭에 나서고 있다는 내용.", "points": ["국무부가 OSS로부터 일련의 보고를 받았다. OSS는 바티칸에 접촉선을 가지고 있는 것으로 보인다. 보고는 1945년 1월 초부터 시작된, 태평양 전쟁에서 교황의 중재를 바라보는 일본 측 교섭에 관한 것이다.", "처음에는 중재 요청이 일본 「실업가(industrialists)」들로부터 재일 가톨릭 고위 성직자 — 도쿄 주재 교황사절 마렐라(Mgr. Marella) 몬시뇰과 일본인 주교 도이(Mgr. Doi) 몬시뇰 — 에게 제기된 것으로 보인다.", "그러나 더 최근에는 일본 정부가 관여하고 있는 것으로 보인다. 교섭이 지금은 바티칸에서 일본 공사(하라다 겐)와 그 보좌진에 의해 수행되고 있기 때문이다.", "일본 측이 내걸었다는 최소한도의 요구는 홍콩·하이난 보유, 필리핀 독립, 영령 인도와 네덜란드령 동인도의 자치령 지위, 극동에서 일본의 「특권적 지위」 승인이었다.", "바티칸은 이 요구가, 영미가 고려할 만하다고 바티칸이 믿은 최소한도(1937년 이전 현상 복귀)로부터 너무 멀어서 중재의 성공을 기대할 수 없다고 보았다. 그리하여 교황은 일본 측 요구가 연합국이 고려하리라 기대되는 선에 더 가까워지지 않는 한 중재 시도를 거절했다.", "1월 17일 바티칸 주재 일본 공사관 서기관 가나야마 마사히데(Masahide Kanayama)가 바티칸 관리들에게, 3거두 회담(얄타) 전에 중재를 시작하라고 촉구했다. 일본은 그 회담에서 극동 문제가 논의되리라 예상하기 때문이다.", "일본은 스탈린이 러일 중립조약 파기와 소련 비행장의 영미군 제공을 요구받으리라 예상하며, 스탈린이 그 조치들에 앞서 진지한 중재 시도가 이루어지기를 요청하고 스스로 중재자로 나서겠다고 제의하리라 예상한다고 표명된다.", "그래서 가나야마는 교황이 가장 먼저 중재를 시도하기를 바랐다(스탈린의 중재 대가가 일본에게 달갑지 않으리라 예상되기 때문으로 추정된다). 바티칸 관리들은 교황청이 중재에 나서기 전에 일본 정부가 연합국이 기대하는 것에 더 가까운 조건을 내놓아야 한다고 고집했다.", "그 뒤 하라다는, 주모스크바 일본 대사(사토 나오타케)가 기존 러일 중립협정의 존속을 두고 크렘린과 교섭 중이며, 그 존속의 대가로 일본이 삼국동맹조약과 방공협정을 파기하고 독일과 완전히 절연하며 일본 내 반공(反共) 단속을 폐지할 것이라고 바티칸에 알렸다.", "이 OSS 보고들은 정황이 충분히 구체적이고 세부가 충분히 정확하여 어느 정도 믿음을 둘 수 있다. 극동국(FE)은 이 문제에 계속 면밀히 주의를 기울이고 추가 진전을 빠짐없이 보고할 것이다."], "primary": "[워싱턴,] 1945년 1월 30일.\n\n그루 씨:\n\n국무부는 OSS[주88] — 바티칸에 접촉선을 가지고 있는 것으로 보이는 — 로부터, 1945년 1월 초에 시작된, 태평양 전쟁에서의 교황의 중재를 바라보는 바티칸과의 일본 측 교섭에 관한 일련의 보고를 받았다. 처음에는 중재 요청이 일본 「실업가(industrialists)」들에 의해 일본 내 가톨릭 고위 성직자들 — 도쿄 주재 교황사절 마렐라 몬시뇰(Mgr. Marella)과 일본인 가톨릭 주교 도이 몬시뇰(Mgr. Doi)을 포함하여 — 에게 제기된 것으로 보인다. 그러나 더 최근에는 일본 정부가 관여하고 있는 것으로 보인다. 교섭이 지금은 바티칸에서 일본 공사(하라다 겐, Ken Harada)와 그 보좌진에 의해 수행되고 있기 때문이다.\n\n일본 측이 내걸었다는 최소한도의 요구는 일본의 홍콩 및 하이난 보유, 필리핀의 독립, 영령 인도와 네덜란드령 동인도에 대한 자치령(dominion) 지위, 그리고 극동에서 일본의 「특권적 지위(privileged position)」 승인을 포함하는 것이었는데, 바티칸은 이 요구가, 영미가 고려하리라고 바티칸이 믿었던 최소한도의 요구(1937년 이전 현상으로의 복귀)로부터 너무나 멀리 떨어져 있어서 중재가 조금이라도 성공을 바랄 만하지 않다고 보았다. 그러므로 교황은 일본 측 요구가 연합국이 고려하리라 기대되는 것에 더 가까이 옮겨질 수 없는 한 중재를 시도하기를 거절했다.\n\n1월 17일 바티칸 주재 일본 공사관 서기관 가나야마 마사히데(Masahide Kanayama)는 바티칸 관리들의 한 무리에게, 3거두 회담 이전에 중재가 시작되어야 한다고 역설했다. 일본이 그 회담에서 극동 문제가 논의될 것이라 예상하기 때문이라는 것이다.[주89] 일본은 스탈린이 러일 중립조약[주90]을 파기하고 소련 비행장을 영미군의 처분에 맡기도록 요청받을 것이라고 예상하고 있으며, [476면] 또한 일본은 스탈린이 그러한 조치들이 취해지기 전에 진지한 중재 시도가 이루어지기를 요청하고 스스로 중재자로 나설 것을 제의하리라고 예상하고 있다고 표명된다. 그러므로 가나야마는 교황이 가장 먼저 중재를 시도하는 자가 되기를 바랐다(스탈린이 중재의 대가로 요구할 것이 일본인들에게 달갑지 않으리라 예상되기 때문으로 추정된다). 그러나 바티칸 관리들은, 교황청이 중재에 착수하기에 앞서 일본 정부가 연합국이 기대하는 [연합국으로부터 기대되는?] 조건에 더 가까운 조건을 제시해야 한다고 고집했다. 가나야마는 이 견해를 자국 정부에 전하겠다고 말했다.\n\n그 뒤 하라다는 바티칸에, 주모스크바 일본 대사[주91]가 기존 러일 중립협정의 존속을 두고 크렘린과 교섭 중이며, 그 존속의 대가로 일본은 삼국동맹조약과 방공협정[주92]을 파기하고, 독일과 완전히 절연하며, 일본 내의 반공(反共) 단속을 폐지할 것이라고 알렸다.\n\n이 OSS 보고들은 정황이 충분히 구체적이고 세부에서 충분히 정확하여 어느 정도 신빙성을 부여하는 것이 가능하다. FE[주93]는 이 문제에 계속 면밀한 주의를 기울일 것이며 추가 진전을 보고하는 데 소홀함이 없을 것이다.\n\nJ[oseph] W. B[allantine]", "secondary": "[Washington,] January 30, 1945.\n\nMr. Grew: The Department has received from OSS, [주88] which apparently has a contact with the Vatican, a series of reports in regard to Japanese negotiations, beginning in early January, 1945, with the Vatican looking toward mediation by the Pope in the war in the Pacific. In the beginning it appears that the requests for mediation were made by Japanese “industrialists” to Catholic dignitaries in Japan, including Mgr. Marella, the Apostolic Delegate in Tokyo, and Mgr. Doi, a Japanese Catholic Bishop. More recently, however, it appears that the Japanese Government is involved, as negotiations are now being conducted at the Vatican by the Japanese Minister (Ken Harada) and his assistants.\n\nThe alleged Japanese minimum demands, which included Japanese retention of Hongkong and Hainan, an independent Philippines, dominion status for British India and the Netherlands Indies, and recognition of Japan’s “privileged position” in the Far East, were considered by the Vatican to be too far from the minimum demands (a return to the status quo ante 1937) which the Vatican believed that the Anglo-Americans would consider, to make mediation at all hopeful of success. The Pope therefore refused to attempt to mediate unless the Japanese demands could be brought closer to what it was hoped would be considered by the Allies.\n\nOn January 17 Masahide Kanayama, a Secretary of the Japanese Legation at the Vatican, urged upon a group of Vatican officials that mediation be started before the meeting of the Big Three because Japan expects that Far Eastern questions will be discussed at the meeting. [주89] It is represented that Japan expects that Stalin will be asked to denounce the Russo-Japanese Neutrality Pact [주90] and to place Soviet airfields at the disposal of the Anglo-American forces; and [476면] that Japan expects Stalin to ask that a serious attempt at mediation be made before these steps are taken, and to offer to act himself as mediator. Kanayama therefore hoped that the Pope would be the first to attempt to mediate (presumably because it is expected that Stalin’s price for mediation would be distasteful to the Japanese). The Vatican officials, however, insisted that the Japanese Government offer terms which would be closer to those expected of [by?] the Allies before the Holy See undertakes mediation. Kanayama said that he would communicate this view to his Government.\n\nLater Harada informed the Vatican that the Japanese Ambassador at Moscow [주91] is negotiating with the Kremlin for the continuation of the existing Russo-Japanese Neutrality Agreement, in return for which continuation Japan will denounce the Tripartite and Anti-Comintern Pacts, [주92] will break completely with Germany, and will abolish Anti-Communist control in Japan.\n\nThese OSS reports are sufficiently circumstantial and sufficiently correct in detail to render it possible that they be given some credence. FE [주93] will continue to give its close attention to this matter and will not fail to report further developments.\n\nJ[oseph] W. B[allantine]", "notes": ["[주88] 전략사무국(Office of Strategic Services).", "[주89] 루스벨트 대통령, 영국 총리 처칠, 소련 인민위원회의 의장 스탈린 원수 사이의 2월 4~11일 얄타 회담에 관해서는 Foreign Relations, The Conferences at Malta and Yalta, 1945, pp. 562 이하 참조.", "[주90] 1941년 4월 13일 모스크바에서 서명. 1941년 4월 13일 오후 11시 모스크바발 전보 제763호, Foreign Relations, 1941, vol. iv, p. 944 참조. Department of State Bulletin, 1945년 4월 29일, p. 812와 비교하라.", "[주91] 사토 나오타케(Naotake Sato).", "[주92] 전자(삼국동맹조약)는 1940년 9월 27일 베를린에서 서명, Foreign Relations, Japan, 1931–1941, vol. ii, p. 165 참조. 후자(방공협정)는 1936년 11월 25일 베를린에서, 1937년 11월 6일 로마에서 서명, 같은 책 pp. 153 및 159 각각 참조.", "[주93] 극동국(Office of Far Eastern Affairs)."], "note": "번역자 주 — 전언 층위가 겹쳐 있다 — 바티칸 접촉선 → OSS → 국무부 → 밸런타인 각서. 원문의 'it appears that'(…인 것으로 보인다), 'alleged'(…라는), 'It is represented that'(…라고 표명된다), 'presumably'(추정된다)를 뭉개지 않고 그대로 살렸다. 특히 스탈린의 의중에 관한 대목은 「일본이 예상한다고 표명된다」는 이중 전언이지 확인된 사실이 아니다. 원문의 'expected of [by?] the Allies'는 편찬자가 삽입한 교정 제안이므로 「연합국이 기대하는 [연합국으로부터 기대되는?]」으로 대괄호를 살려 옮겼다. 인명 한국어 표기: Ken Harada는 하라다 겐(原田健), Masahide Kanayama는 가나야마 마사히데(金山政英), Naotake Sato는 사토 나오타케(佐藤尚武)로 옮겼으나 원문에는 한자가 없으므로 로마자를 병기했다. Mgr. Doi는 도쿄 대주교 도이 다쓰오(Doi)로 추정되나 원문에 이름(名)이 없어 성만 옮겼다. 'privileged position'은 「특권적 지위」, 'status quo ante 1937'은 「1937년 이전 현상」으로 직역했다. 'mediation(중재)'이 이 문서의 핵심 낱말이며 'peace feeler'나 'surrender'는 쓰이지 않았다.", "warn": false, "pages": ["475", "476"], "search": "Joseph W. Ballantine 조지프 W. 밸런타인 — 국무부 극동국장, 이 각서의 작성자 Joseph C. Grew 그루 — 국무차관, 수신자 Mgr. Marella 마렐라 몬시뇰 — 도쿄 주재 교황사절 Mgr. Doi 도이 몬시뇰 — 일본인 가톨릭 주교 Ken Harada 하라다 겐 — 바티칸 주재 일본 공사 Masahide Kanayama 가나야마 마사히데 — 바티칸 주재 일본 공사관 서기관 Stalin 스탈린 — 소련 인민위원회의 의장 Naotake Sato 사토 나오타케 — 주모스크바 일본 대사(각주91) Roosevelt 루스벨트 — 미국 대통령(각주89) Churchill 처칠 — 영국 총리(각주89)"}, {"id": "d343", "order": 343, "date": "1945-04-06", "group": "A", "eyebrow": "d343 · The Minister in Sweden (Johnson) to the Secretary of State", "title": "주스웨덴 공사(존슨)가 국무장관에게", "badge": null, "list_right": "문서 343", "meta": [{"k": "일자", "v": "1945-04-06"}, {"k": "시각", "v": "발신 1945년 4월 6일 오후 5시 (Stockholm, April 6, 1945—5 p.m.) / 접수 오후 7시 10분 ([Received 7:10 p.m.])"}, {"k": "장소", "v": "Stockholm", "txt": true}, {"k": "전문번호", "v": "1288"}, {"k": "원문출처", "v": "740.00119 P.W./4–645: Telegram", "txt": true}, {"k": "발신", "v": "주스웨덴 공사 존슨(Herschel V. Johnson)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 343 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d343"}], "summary": "스웨덴 외무성이 도쿄 주재 스웨덴 공사(바게)에게서 방금 받은 전보의 요지를 폰 포스트가 전한 것 — 무조건항복은 불명예를 뜻하므로 일본인에게 받아들여질 수 없으나 매우 광범위한 조건이라면 교섭을 통해 수락될 법하며, 천황은 건드려서는 안 된다는 내용.", "points": ["폰 포스트(von Post)에 따르면, 스웨덴 외무성이 도쿄 주재 스웨덴 공사[각주94: 위도르 바게]로부터 방금 받은 전보의 요지다.", "무조건항복 조건이 일본인에게 받아들여질 수 없으리라는 것은 의심의 여지가 없다. 그것이 불명예를 뜻할 것이기 때문이다.", "그러한 조건의 적용은 치명적이며 국민 측의 필사적 행동으로 이어질 것이다.", "일본 국민은 전쟁에 이길 수 없다고 믿지만, 동시에 일본을 정복하고 점령하는 것도 불가능하리라고 믿는다. 일본 병사도 일본 민간인도 포로가 되어 몸을 내맡기기보다 죽기를 택한다.", "다른 한편으로, 매우 광범위한(very far-reaching) 조건이라면 교섭의 방식으로 일본인에게 수락될 법해 보인다.", "일본 헌법의 교체 또한 배제된 것으로 보아야 한다. 천황은 건드려서는 안 된다. 다만 천황의 권력을 영국 국왕의 그것처럼 다소 민주화하는 것은 가능할 것이다."], "primary": "스톡홀름, 1945년 4월 6일 — 오후 5시.\n[접수 오후 7시 10분]\n\n1288. 다음은, 폰 포스트(von Post)에 따르면 스웨덴 외무성이 도쿄 주재 스웨덴 공사[주94]로부터 방금 받은 전보의 요지이다.\n\n무조건항복 조건이 일본인들에게 받아들여질 수 없으리라는 것은 의심의 여지가 없다. 그것이 불명예를 뜻할 것이기 때문이다. 그러한 조건의 적용은 치명적일 것이며 국민 측의 필사적인 행동으로 이어질 것이다. 일본 국민은 전쟁에 이길 수 없다고 믿지만, 또한 일본을 정복하고 점령하는 것은 불가능하리라고 믿는다. 일본 병사도, 마찬가지로 일본 민간인도, 포로로 몸을 내맡기기보다 죽기를 택한다. 다른 한편으로, 매우 광범위한 조건이라면 교섭의 방식으로 일본인들에게 받아들여질 것으로 보인다.\n\n일본 헌법의 교체 또한 배제된 것으로 여겨야 한다. 천황은 건드려져서는 안 된다. 그러나 천황의 권력을, 영국 국왕의 그것이 그러하듯, 다소 민주화하는 것은 가능할 것이다.\n\n존슨", "secondary": "Stockholm, April 6, 1945—5 p.m. \n [Received 7:10 p.m.]\n\n1288. The following is the substance of a telegram which, according to von Post, the Swedish Foreign Office has just received from the Swedish Minister at Tokyo: [주94]\n\nThere is no doubt that unconditional surrender terms would be unacceptable to the Japanese because it would mean dishonor. Application of such terms would be fatal and lead to desperate action on the part of the people. The Japanese people believe that the war can not be won but also they believe that it would be impossible to conquer and occupy Japan. The Japanese soldier and likewise the Japanese civilian prefers to die than to give himself up as a prisoner. On the other hand it seems probable that very far-reaching conditions would be accepted by the Japanese by way of negotiation.\n\nExchange of the Japanese constitution must also be considered as excluded. The Emperor must not be touched. However, the Imperial power could be somewhat democratized as is that of the English King.\n\nJohnson", "notes": ["[주94] 위도르 바게(Widor Bagge)."], "note": "번역자 주 — 스톡홀름 경로의 첫 문서. 전언 층위는 「도쿄의 익명 일본인들 → 도쿄 주재 스웨덴 공사 바게 → 스웨덴 외무성 → 폰 포스트 → 존슨 → 국무부」로 네 겹이다. 원문 본문은 바게 전보의 'substance(요지)'이지 직접 인용이 아니며, 누가 이 말을 했는지 원문에 명시되어 있지 않다(d350에서 영국 외무성이 「고위 관리들의 견해가 아니라 일본 국민 일반의 태도로서」 인용된 것이라고 밝힌다). 'unconditional surrender 무조건항복'과 'negotiation 교섭'이 이 문서에서 대비되어 쓰였다 — 'peace feeler'라는 낱말은 나오지 않는다. 'Exchange of the Japanese constitution'은 원문 그대로 「일본 헌법의 교체」로 옮겼다(개정이 아니라 교체·교환). 각주94의 'Widor Bagge'는 원문 표기 그대로 두었다(통용 표기는 Widar Bagge).", "warn": false, "pages": ["477"], "search": "Herschel V. Johnson 존슨 — 주스웨덴 미국 공사, 발신자 von Post 폰 포스트 — 스웨덴 외무성 인사(원문에 직함 없음) Widor Bagge 위도르 바게 — 도쿄 주재 스웨덴 공사(각주94)"}, {"id": "d346", "order": 346, "date": "1945-05-07", "group": "A", "eyebrow": "d346 · The Ambassador in Portugal (Baruch) to the Secretary of State  The substance of this telegram was given the British Embassy on May 14.", "title": "주포르투갈 대사(배럭)가 국무장관에게", "badge": null, "list_right": "문서 346", "meta": [{"k": "일자", "v": "1945-05-07"}, {"k": "시각", "v": "발신 1945년 5월 7일 정오 (Lisbon, May 7, 1945—noon) / 접수 오후 9시 ([Received 9 p.m.])"}, {"k": "장소", "v": "Lisbon", "txt": true}, {"k": "전문번호", "v": "990"}, {"k": "원문출처", "v": "740.00119 PW/5–745: Telegram. 이 전보의 요지는 5월 14일 영국 대사관에 전달되었다.[주97]", "txt": true}, {"k": "발신", "v": "주포르투갈 대사 배럭(Baruch)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 346 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d346"}], "summary": "리스본 주재 일본 공사관 참사관 이노우에 마스타로가 OSS의 잠복 요원이던 포르투갈 주재 DNB 특파원에게 접근하여, 「평화 타진으로 해석되기를 바라지 않는다」고 전제하면서 미국 대사관과 접촉하여 극동에서 미국이 무엇을 하려는지 알아봐 달라고 요청하고, 무조건항복은 있을 수 없으며 소련에 맞선 서방과의 협조를 주장했다는 OSS 보고.", "points": ["OSS의 […][주97a]이 보고하기를, 이곳 일본 공사관 참사관 이노우에 마스타로(Masutaro Inouye)가 어제 포르투갈 주재 DNB 특파원(전에 DNB 워싱턴 근무)인 […]에게 접근했다. 그는 지난 1년 동안 OSS의 신뢰받는 잠복 요원이었고, 이노우에가 자신에게 다음과 같이 말했다고 […]에게 알렸다.", "「나는 이것이 『평화 타진(peace feeler)』으로 해석되기를 원치 않는다. 그러나 미국 대사관과 접촉하여 그들이 극동에서 정확히 무엇을 할 작정인지 알아봐 주기 바란다.」", "「『무조건항복』은 있을 수 없다. 천황이 결코 그런 일을 하지 않을 것이기 때문이다. 그러나 우리는 일본이 미국 폭격기에 의해 가망 없이 박살나리라는 것을 인식하고 있다.」", "「우리는 삼국동맹조약이 독일에 의해 찢겼다고 본다. 조약은 단독강화가 없으리라고 했으나 되니츠가 서방 열강에 항복했기 때문이다. 그래서 우리도 이제 서방 열강과 강화를 맺을 수 있다고 느낀다. 유일한 걸림돌은 서방 열강이 어디까지 갈 작정인지 우리가 모른다는 것이다.」", "「우리는 이 전쟁에서의 정복지를 모두 포기할 준비가 되어 있으나 이전에 가지고 있던 것은 지키고 싶다.」", "「우리에게는 논거로 삼을 만한 상당히 좋은 점이 있다고 본다. 중국과 러시아다. 러시아가 미국을 극동에서 몰아내려 할 것이고 미국이 거대한 중국 시장을 잃을지 모른다는 것을 미국인들도 분명 안다. 샌프란시스코에서 몰로토프가 처신하는 방식은 스탈린이 제국주의 또는 고립주의로 되돌아갔음을 명백히 보여 준다. 서방 열강에게는 스탈린에 맞선 통일전선을 세우는 것 말고 다른 해결책이 있을 수 없다.」", "「일본은 중국에서 매우 강하다. 필요하다면 정부가 중국으로 가서 거기서 계속 싸울 수 있다. 우리는 중국 대륙의 가장 부유한 부분을 쥐고 있고 중요한 중국인 추종세력을 가지고 있다. 우리에게는 『아시아인을 위한 아시아』라는 논거가 있다.」", "「그러니 중국에서 일본을 상대로 아주 긴 전쟁을 벌인 끝에 결국 극동 시장을 러시아에 잃느니, 서방 열강은 어떤 형태로든 — 그것이 우리에게 아무리 나쁜 것이라 해도 — 타협에 이르러야 한다.」", "「폴란드 경험 이후 미국이 스탈린에게 60억 달러의 차관을 주지는 않으리라고 우리는 보며, 러시아인들이 서방 열강으로부터 더욱더 멀어져 갈 것이라고 본다. 우리는 미국이 이를 같은 눈으로 보아 주기를 바란다.」"], "primary": "리스본, 1945년 5월 7일 — 정오.\n[접수 오후 9시]\n\n990. … [주97a] OSS의 […]이 보고하는바, 이곳 일본 공사관 참사관 이노우에 마스타로(Masutaro Inouye)가 어제 …, 즉 포르투갈 주재 DNB 특파원(전에 DNB 워싱턴 근무)에게 접근했다.… 지난 1년 동안 OSS의 신뢰받는 잠복 요원이었던 그는 …에게, 이노우에가 자신에게 다음과 같은 진술을 했다고 알렸다.\n\n「나는 이것이 『평화 타진(peace feeler)』으로 해석되는 것을 원하지 않는다. 그러나 부디 미국 대사관과 접촉하여 그들이 극동에서 정확히 무엇을 할 작정인지 알아봐 주기 바란다. 『무조건항복』이란 있을 수 없다. 천황이 결코 그런 일을 하지 않을 것이기 때문이다. 그러나 우리는 일본이 미국 폭격기에 의해 가망 없이 박살나리라는 것을 인식하고 있다. 우리는 삼국동맹조약[주98]이 독일에 의해 찢어졌다고 본다. 그 조약은 단독강화가 없을 것이라고 말했음에도 되니츠[주99]가 서방 열강에 항복했기 때문이다. 그러므로 우리도 이제 서방 열강과 강화를 맺을 수 있다고 느낀다. 유일한 걸림돌은 서방 열강이 어디까지 갈 작정인지 우리가 알지 못한다는 것이다. 우리는 이 전쟁에서의 정복지를 모두 포기할 준비가 되어 있으나 이전에 우리가 가지고 있던 것은 지키고 싶다. 우리는 우리에게 논거로 삼을 상당히 좋은 점이 있다고 생각한다. 중국과 러시아다. 러시아가 미국인들을 극동에서 [479면] 몰아내려 할 것이며 미국이 거대한 중국 시장을 잃을 수 있다는 것을 미국인들도 의심 없이 알고 있다. 샌프란시스코[주2]에서 몰로토프[주1]가 처신하는 방식은 스탈린이 제국주의로, 혹은 고립주의로 되돌아갔음을 명백히 보여 준다. 서방 열강에게는 스탈린에 맞서 통일전선을 세우는 것 말고 다른 해결책이 있을 수 없다. 일본인은 중국에서 매우 강하다. 필요하다면 정부가 중국으로 가서 거기서 계속 싸울 수 있다. 우리는 중국 아대륙(亞大陸)의 가장 부유한 부분들을 쥐고 있으며 중요한 중국인 추종세력을 가지고 있다. 우리에게는 『아시아인을 위한 아시아』라는 논거가 있다. 그러므로 중국에서 일본을 상대로 아주 긴 전쟁을 치른 끝에 마침내 극동 시장을 러시아에 잃어버리느니, 서방 열강은 그것이 우리에게 아무리 나쁜 것이 될지라도 어떤 형태의 타협에 이르러야 한다. 우리는 폴란드에서의 경험 이후 미국이 스탈린에게 60억 달러의 차관을 주리라고는 생각하지 않으며, 러시아인들이 서방 열강으로부터 더욱더 멀어져 가리라고 생각한다. 우리는 미국이 이것을 같은 눈으로 보아 주기를 바란다.」\n\n배럭", "secondary": "Lisbon, May 7, 1945—noon.\n[Received 9 p.m.]\n\n990. … [주97a] of OSS reports that the Counselor of the Japanese Legation here, Masutaro Inouye, yesterday approached … the DNB representative in Portugal (formerly DNB Washington).… who has been a trusted undercover agent of OSS for past year informed … that Inouye made following statements to him:\n\n“I do not want this to be construed as a ‘peace feeler’ but please try to get into touch with the American Embassy and find out what exactly they plan to do in the Far East. There can be no ‘unconditional surrender’ as the Emperor would never do that. But we realize that Japan will be hopelessly smashed by United States bombers. We regard the Tripartite Pact [주98] as torn by Germany as Doenitz [주99] has surrendered to the western powers though the pact said that there would be no separate peace. So we now feel able to conclude a peace with the western powers too. The only drawback is that we do not know how far the western powers intend to go. We are prepared to give up all the conquests in this war but would like to keep what we had before. We think that we have a rather good point for argument: China and Russia. The Americans no doubt know that Russia will try to drive [479면] them out of the Far East and that the United States may lose the great Chinese market. The way Molotov [주1] acts at San Francisco [주2] shows plainly that Stalin has reverted to Imperialism or to Isolationism. There can be no other solution for the western powers than to get up a united front against Stalin. The Japanese are very strong in China. If need be the Government can go to China and fight on from there. We hold the richest parts of the Chinese sub-continent and we have an important Chinese following. We have the argument of ‘Asia for the Asiatics’. So instead of waging a very long war against Japan in China and finally losing the Far East markets to Russia the western powers should come to some sort of an arrangement, however bad it might be for us. We do not think that after the Polish experience the USA will grant a six billion dollar credit to Stalin and we think that the Russians will drift even farther apart from the western powers. We hope that the United States will see this in the same light.”\n\nBaruch", "notes": ["[주97] 이 전보의 요지는 5월 14일 영국 대사관에 전달되었다.", "[주97a] 이 문서에서 일부 관리들의 이름은 삭제되었다.", "[주98] 1940년 9월 27일 베를린에서 일본·독일·이탈리아가 서명. Foreign Relations, Japan, 1931–1941, vol. ii, p. 165.", "[주99] 카를 되니츠 해군원수(Grand Adm. Karl Doenitz). 5월 1일 아돌프 히틀러의 뒤를 이은 독일 정부 수반.", "[주1] 뱌체슬라프 미하일로비치 몰로토프(Vyacheslav Mikhailovich Molotov). 소련 외무인민위원.", "[주2] 1945년 4월 25일~6월 26일 샌프란시스코에서 열린 국제기구에 관한 국제연합회의."], "note": "번역자 주 — 리스본 경로. 전언 층위는 「이노우에 → DNB 특파원(OSS 잠복 요원) → OSS의 어떤 관리 → 배럭 대사 → 국무부」다. 원문의 '…'과 삭제 부호는 편찬 단계에서 관리 이름을 지운 자리이므로(각주97a) 그대로 두고 […]로 표시했다. DNB는 독일 관영 통신사 Deutsches Nachrichtenbüro의 약칭이며 원문 그대로 두었다. 이노우에가 스스로 「이것이 peace feeler로 해석되기를 원치 않는다」고 못박은 점이 이 문서의 핵심이다 — 발화자 본인이 성격 규정을 거부한 접촉이다. 'unconditional surrender'는 원문에서도 따옴표에 묶여 있어 「『무조건항복』」으로 표시를 살렸다. 'Chinese sub-continent'는 「중국 아대륙」으로 직역했다. Masutaro Inouye는 이노우에 마스타로(井上益太郎로 추정되나 원문에 한자 없음)로 옮겼고 로마자를 병기했다. d353에서 충칭 주재 중국 측이 같은 접촉을 요약해 받는다.", "warn": false, "pages": ["478", "479"], "search": "Baruch 배럭 — 주포르투갈 미국 대사, 발신자 Masutaro Inouye 이노우에 마스타로 — 리스본 주재 일본 공사관 참사관 Karl Doenitz 카를 되니츠 — 독일 정부 수반(각주99) Molotov 몰로토프 — 소련 외무인민위원 Stalin 스탈린 — 소련 지도자"}, {"id": "d347", "order": 347, "date": "1945-05-11", "group": "A", "eyebrow": "d347 · The Minister in Sweden (Johnson) to the Secretary of State", "title": "주스웨덴 공사(존슨)가 국무장관에게", "badge": null, "list_right": "문서 347", "meta": [{"k": "일자", "v": "1945-05-11"}, {"k": "시각", "v": "발신 1945년 5월 11일 오후 1시 (Stockholm, May 11, 1945—1 p.m.) / 접수 오후 4시 5분 ([Received 4:05 p.m.])"}, {"k": "장소", "v": "Stockholm", "txt": true}, {"k": "전문번호", "v": "1748"}, {"k": "원문출처", "v": "740.00119 P.W./5–1145", "txt": true}, {"k": "발신", "v": "주스웨덴 공사 존슨(Herschel V. Johnson)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 347 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d347"}], "summary": "공사관의 요청으로 그 접촉선이 5월 7일 저녁 일본 공사관의 오노데라 무관·혼마 지로 박사·기노시타 대령과 만난 결과 — 오노데라가 스웨덴 왕실 인사를 통해 연합국에 어떤 타결을 타진하도록 주선할 권한을 자신이 가지고 있다고 말했고, 무조건항복이어서는 안 된다고 못박았으며, 만남이 성사되기 전까지는 접근 사실 자체를 무조건 부인하겠다고 말했다는 보고.", "points": ["공사관의 요청으로 공사관의 접촉선(contact)이 5월 7일 저녁을 오노데라 장군(무관), 오노데라의 보좌 혼마 지로 박사(Doctor Jiro Homma), 일본 공사관 기노시타 대령과 함께 보냈다.", "일본인 거류민 23명이 덴마크와 독일에서 왔고, 스웨덴 정부의 요청으로 말뫼 인근 지구에 머물 것을 선서로 구속받되 말뫼 시내 출입은 허용되지 않는다고 접촉선은 통보받았다. 그들이 가져온 자금은 동결되었다고도 알렸다.", "스톡홀름 일본 공사관은 5월 3일 도쿄로부터 30만 크로나의 신용장을 받았으나 스웨덴 정부가 동결했다. 급여·임차료·사무비 지급을 위해 일본 측이 제출한 증빙에 근거해서만 인출이 허용되고 다른 용도로는 허용되지 않는다.", "오노데라는 도쿄에서 온 정보에 따르면 러시아가 만주 국경으로 40만 병력을 이동시키고 있으며 러시아가 일본에 선전포고할 의도라고 말했다. 또 도쿄로부터 받은 정보는 일본 내 미국의 폭격이 일반적으로 믿어지는 것보다 훨씬 심하고 아마도 미국인 자신들이 믿는 것보다도 훨씬 심함을 가리킨다고 알렸다.", "오노데라는 일본이 이길 수 없음을 인식하고 있으며 가능한 최선의 해결책은 도시와 문화의 장소가 파괴되는 것을 막는 일이라고 말했다.", "그는 스웨덴 왕실의 한 인사가 어떤 타결(some settlement)을 위해 연합국에 접근하도록 주선하는 것을 시도할 권한을 자신이 가지고 있다고 말했다. (합동참모본부에 통보 바람.)", "오노데라는 일본인이 중국인에 대해 체면을 세워야 한다는 점에 비추어 이것이 무조건항복이어서는 안 될 필요성을 지적했다.", "오노데라는 접촉선에게 이 문제를 국왕의 동생인 카를 시니어 공(Prince Carl Senior)에게 제기해 달라고 요청했다. 그는 자신이 천황을 대표하게 된다는 사실에 걸맞도록 중개자가 왕실 인사여야 한다고 고집했다.", "오노데라는 주스웨덴 일본 공사[각주3: 오카모토 스에마사]가 아니라 자신이 이 논의를 주선할 위임장을 가지고 있다고 고집했으나, 스웨덴 측 대표와 만나기 전까지는 어떤 경우에도 자신이 접근을 개시한 적이 있다는 것을 부인하겠다고 지적했다.", "공사관의 접촉선은 자신이 이 공사관과 관계가 있다는 사실이나 이 정보를 공사관에 알리고 있다는 사실을 밝히지 않았고 앞으로도 밝히지 않을 것이다.", "5월 8일 밤 접촉선은 카를 시니어 공의 개인 비서 뢰벤히엘름(Lowenhielm)에게 접근했고, 뢰벤히엘름은 이후 접촉선에게 카를 시니어 공이 스웨덴 적십자 총재로서 정치 문제에 관여할 수 없다고 알렸다. 이에 따라 카를 시니어 공은 이 문제를 국왕 및 베르나도테[각주4: 카를 주니어 공]와 논의할 생각이며 5월 12일까지 결정을 접촉선에게 알리기로 했다.", "오노데라는 주독일 일본 대사 오시마와 접촉하여 그를 스웨덴으로 오게 하기를 몹시 바란다고 말했다. 오시마와의 마지막 접촉은 5월 2일과 3일이었다고 했다. 오시마가 어떤 교섭이든 알고 있거나 참여하리라는 시사가 있었다.", "스웨덴 측에는 공사관이 이 접근에 관한 정보를 가지고 있다는 것을 알리지 않고 있다. 접촉선은 어떤 진전이든 즉시 우리에게 알리기로 동의했다."], "primary": "스톡홀름, 1945년 5월 11일 — 오후 1시.\n[접수 오후 4시 5분]\n\n1748. 공사관의 요청으로, 공사관의 접촉선(contact)이 5월 7일 저녁을 오노데라 장군(무관), 오노데라의 보좌인 혼마 지로 박사(Doctor Jiro Homma), 그리고 일본 공사관의 기노시타 대령과 함께 보냈다. 접촉선은, 일본인 거류민 23명이 덴마크와 독일로부터 왔으며 스웨덴 정부의 요청에 따라 말뫼 인근 지구에 머무를 것을 선서로 구속받고 있으나 말뫼 안으로 들어가는 것은 허용되지 않는다는 통보를 받았다. 일본 측은 또한 그들이 가지고 온 자금이 동결되었다고 알렸다.\n\n스톡홀름 일본 공사관은 5월 3일 도쿄로부터 30만 크로나 액수의 신용장을 받았는데 스웨덴 정부가 이를 동결하였다. 인출은 급여·임차 비용·사무 지출의 지급을 위하여 일본 측이 제출하는 증빙에 근거해서만 허용되며 그 밖의 목적으로는 허용되지 않는다.\n\n오노데라 장군은, 도쿄로부터의 정보가 러시아인들이 만주 국경으로 40만 병력을 이동시키고 있으며 러시아인들이 일본에 선전포고할 의도임을 드러낸다고 말하였다. 그는 또한 도쿄로부터 받은 정보가, 일본 내 미국의 폭격이 일반적으로 믿어지고 있는 것보다 훨씬 더 심하며 아마도 미국인들 자신이 믿고 있는 것보다도 훨씬 더 심함을 가리킨다고 알렸다. 오노데라는 일본이 이길 수 없다는 것이 인식되고 있으며 가능한 최선의 해결책은 그 도시들과 [480면] 문화의 장소들이 파괴되는 것을 막는 일이라고 말하였다. 그는 스웨덴 왕실의 한 인사가 어떤 타결을 위하여 연합국에 접근하도록 주선하는 일을 시도할 권한을 자신이 부여받았다고 말하였다. (합동참모본부에 통보하기 바람.) 오노데라는 일본인이 중국인에 대하여 체면을 세워야 한다는 사실에 비추어, 이것이 무조건항복이어서는 안 될 필요성을 지적하였다. 오노데라는 접촉선에게 이 문제를 국왕의 동생인 카를 시니어 공(Prince Carl Senior)에게 제기해 달라고 요청하였다. 그는 자신이 일본 천황을 대표하게 되리라는 사실에 걸맞기 위해서는 중개자가 반드시 왕실의 인사여야 한다고 고집하였다. 오노데라는, 주스웨덴 일본 공사[주3]가 아니라 자신이 이 논의들을 주선할 위임장을 가지고 있다고 고집하였으나, 스웨덴 측 대표와 만나기 전까지는 어떠한 사정 아래에서도 자신이 접근을 개시한 적이 있다는 것을 부인하겠다고 지적하였다.\n\n공사관의 접촉선은 자신이 이 공사관과 어떤 연관을 가지고 있다는 사실, 또는 자신이 이 정보를 공사관에 알리고 있다는 사실을 밝히지 않았으며 앞으로도 밝히지 않을 것이다. 5월 8일 밤 공사관의 접촉선은 카를 시니어 공의 개인 비서인 뢰벤히엘름(Lowenhielm)에게 접근하였고, 뢰벤히엘름은 그 뒤 접촉선에게, 카를 시니어 공은 스웨덴 적십자의 총재로서 정치적 문제에 관여할 수 없다고 알렸다. 이에 따라 카를 시니어 공은 이 문제를 국왕 및 베르나도테[주4]와 논의할 생각이며, 5월 12일까지 결정을 접촉선에게 알리기로 동의하였다.\n\n오노데라는 주독일 일본 대사 오시마와 접촉하여 그를 스웨덴으로 오게 하기를 몹시 바란다고 말하였다. 그는 오시마와의 마지막 접촉이 5월 2일과 3일이었다고 말하였다. 오시마가 어떠한 교섭에 대해서든 알고 있거나 그에 참여하리라는 시사가 있었다.\n\n스웨덴 측에는 이 공사관이 이 접근에 관한 정보를 가지고 있다는 것이 알려지지 않고 있다. 접촉선은 어떠한 진전이든 즉시 우리에게 알리기로 동의하였다.\n\n존슨", "secondary": "Stockholm, May 11, 1945—1 p.m. \n [Received 4:05 p.m.]\n\n1748. At request of Legation, contact of Legation spent evening May 7 with General Onodera (Military Attaché), Doctor Jiro Homma (assistant to Onodera) and Colonel Kinoshita of Japanese Legation. Contact was advised that 23 members Japanese Colony have come from Denmark and Germany and at request of Swedish Government are bound by oath to remain in district near Malmo but not privileged to go into Malmo. Japanese also advised that funds brought with them have been blocked.\n\nJapanese Legation Stockholm received a letter of credit from Tokyo on May 3 to the amount of 300,000 kroner which Swedish Government has blocked. Withdrawals are permitted on basis of vouchers submitted by Japanese for payment salaries, rental expenses, office expenditures but not for other purposes.\n\nGeneral Onodera stated that information from Tokyo reveals that Russians are moving 400,000 troops to Manchurian border and that Russians intend to declare war on Japan. He also advised that information received from Tokyo indicates that American bombing in Japan has been much worse than is generally believed and probably much worse than Americans themselves believe. Onodera stated that it is realized that Japan cannot win and that the best possible solution would be to prevent the destruction of its cities and places of [480면] culture. He stated that he was authorized to attempt to arrange for a member of the Swedish Royal Family to approach the Allies for some settlement. (Please advise Joint Chiefs of Staff.) Onodera pointed out the necessity of this not being unconditional surrender in view of the fact that the Japanese must save their face with respect to the Chinese. Onodera requested contact to raise this question with Prince Carl Senior, the King’s brother. He insisted that the intermediary must be a member of the Royal Family in order to be in keeping with the fact that he would be representing the Emperor of Japan. Onodera insisted that he, and not the Japanese Minister to Sweden, [주3] had the power of attorney to arrange for these discussions but pointed out that until he met with the Swedish representative he would under all circumstances deny that he had ever initiated an approach.\n\nLegation’s contact did not make known and will not make known fact that he has had any connections with this Legation or that he is advising Legation of this information. On night of May 8, Legation’s contact approached Prince Carl Senior’s personal secretary, Lowenhielm, who subsequently advised contact that as head of the Swedish Red Cross Prince Carl Senior cannot become involved in political affairs. Accordingly Prince Carl Senior intends to take question up with the King and Bernadotte [주4] and agreed to advise contact of decision by May 12.\n\nOnodera stated that he was anxious to contact Oshima, Japanese Ambassador to Germany, and to have him come to Sweden. He stated the last contact with Oshima was on May 2 and 3. Indication was that Oshima has knowledge of or would participate in any negotiations.\n\nSwedes are not being advised that Legation has information concerning this approach. Contact has agreed to inform us immediately of any developments.\n\nJohnson", "notes": ["[주3] 오카모토 스에마사(Suemasa Okamoto).", "[주4] 카를 주니어 공(Prince Carl Junior). 구스타브 5세 국왕의 조카."], "note": "번역자 주 — 스톡홀름 경로의 두 번째이자 가장 구체적인 문서. 전언 층위는 「오노데라 → 공사관의 접촉선 → 존슨 공사 → 국무부」이며, 접촉선이 자신과 미국 공사관의 관계를 일본 측에도 스웨덴 측에도 숨기고 있다는 점이 본문에 명시되어 있다. 오노데라가 「만나기 전까지는 접근 사실을 무조건 부인하겠다」고 미리 말해 둔 점, 그리고 주스웨덴 일본 공사(오카모토)가 아니라 무관인 자신이 위임장을 가졌다고 주장한 점 — 즉 이 경로가 일본 정부의 공식 외교 경로가 아니라 군부 경로라는 점 — 을 원문 그대로 살렸다. 원문은 오노데라를 'General Onodera (Military Attaché)'로 쓰나 이름(名)은 없다(오노데라 마코토 大佐로 알려져 있으나 원문 근거가 없어 단정하지 않는다). 마찬가지로 기노시타 대령, 오시마 대사(오시마 히로시로 알려짐)도 원문에 성만 있어 성만 옮기고 로마자를 병기했다. 'contact'는 「접촉선」으로 일관되게 옮겼다. 'some settlement 어떤 타결', 'unconditional surrender 무조건항복', 'negotiations 교섭'을 구분해 옮겼다 — 'peace feeler'는 이 문서에 나오지 않는다. 문서 중간의 「(합동참모본부에 통보 바람.)」은 존슨이 국무부에 붙인 지시이므로 괄호째 살렸다.", "warn": false, "pages": ["479", "480"], "search": "Herschel V. Johnson 존슨 — 주스웨덴 미국 공사, 발신자 Onodera 오노데라 — 스톡홀름 주재 일본 무관(원문 표기 General Onodera) Jiro Homma 혼마 지로 — 오노데라의 보좌, 박사 Kinoshita 기노시타 — 일본 공사관 대령 Suemasa Okamoto 오카모토 스에마사 — 주스웨덴 일본 공사(각주3) Prince Carl Senior 카를 시니어 공 — 스웨덴 국왕의 동생, 스웨덴 적십자 총재 Lowenhielm 뢰벤히엘름 — 카를 시니어 공의 개인 비서 Prince Carl Junior (Bernadotte) 카를 주니어 공(베르나도테) — 구스타브 5세 국왕의 조카(각주4) Gustav V 구스타브 5세 — 스웨덴 국왕(각주4에서 언급, 본문의 'the King') Oshima 오시마 — 주독일 일본 대사"}, {"id": "d349", "order": 349, "date": "1945-05-12", "group": "B", "eyebrow": "d349 · Memorandum by the Director of the Office of Strategic Services (Donovan) to the Secretary of State", "title": "전략사무국장(도너번)이 국무장관에게 보낸 각서", "badge": null, "list_right": "문서 349", "meta": [{"k": "일자", "v": "1945-05-12"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 PW/5–1245", "txt": true}, {"k": "발신", "v": "전략사무국(OSS) 국장 도너번(William J. Donovan)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 349 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d349"}], "summary": "베른 주재 OSS 대표가 전달한 것으로, 극동 전문가인 반나치·친일본 성향의 독일계 소식통이 5월 11일 주스위스 일본 공사 가세 슌이치와 나눈 대화 — 가세가 일본과 연합국 사이의 적대행위 중지를 주선하는 데 힘을 보태고 싶다는 뜻을 표했고, 소련을 통한 교섭보다 미·영과의 직접 회담을 선호한다고 했다는 보고.", "points": ["다음 정보는 베른 주재 OSS 대표가 전달한 것으로, 어떤 독일계 소식통에서 나온다. 그는 극동 전문가이며 반나치이나 친일본으로 여겨지는 인물이다.", "그 소식통은 5월 11일 주스위스 일본 공사 가세 슌이치(Shunichi Kase)와 이야기를 나누었다.", "그의 보고에 따르면 가세는 일본인과 연합국 사이의 적대행위 중지(cessation of hostilities)를 주선하는 데 도움을 주고 싶다는 바람을 표명하였다.", "보고된 바로는(reportedly), 가세는 소련을 통한 교섭보다 미국인·영국인과의 직접 회담이 더 낫다고 여긴다. 후자의 경우 소련의 위신이 너무 커져서 극동 전체가 공산화될 것이기 때문이다.", "가세는, 일본인이 고집할 몇 안 되는 조항 가운데 하나가 천황의 존치 — 일본이 공산주의로 전향하는 것을 막을 유일한 안전판으로서 — 일 것이라고 믿는다고 한다(allegedly).", "가세는 국무차관 그루가 이 견해를 함께한다고 느끼고 있다. 그는 그루를 일본에 관한 최고의 미국 권위자로 여긴다."], "primary": "워싱턴, 1945년 5월 12일.\n\n다음의 정보는 베른 주재 OSS 대표가 전달한 것으로, 어느 독일계 소식통에서 비롯한다. 그는 극동에 관한 권위자이며 반(反)나치이나 친(親)일본으로 여겨지는 인물이다.\n\n그 소식통은 5월 11일 주스위스 일본 공사 가세 슌이치(Shunichi Kase)와 이야기를 나누었다. 그는, 가세가 일본인과 연합국 사이의 적대행위 중지를 주선하는 데 힘을 보태고 싶다는 바람을 표명하였다고 보고한다. 보고된 바로는, 가세는 소련을 통한 교섭보다 미국인 및 영국인과의 직접 회담이 더 낫다고 여긴다. 후자의 경우가 되면 소련의 위신이 너무나 커져서 극동 전체가 공산화될 것이기 때문이다.\n\n전하는 바로는, 가세는 일본인이 고집할 몇 안 되는 조항 가운데 하나가 천황의 존치 — 일본이 공산주의로 전향되는 데 대한 유일한 안전판으로서의 — 이리라고 믿고 있다. 가세는 국무차관 그루가 이 의견을 함께한다고 느끼고 있으며, 그는 그루를 일본에 관한 최고의 미국 권위자로 여긴다.\n\n윌리엄 J. 도너번", "secondary": "Washington, 12 May, 1945.\n\nThe following information, transmitted by the OSS representative in Bern, originates with a German source, an authority on the Far East who is considered anti-Nazi but pro-Japanese:\n\nThe source, on 11 May, talked with Shunichi Kase, the Japanese Minister to Switzerland. He reports that Kase expressed a wish to help arrange for a cessation of hostilities between the Japanese and the Allies. Kase reportedly considers direct talks with the Americans and the British preferable to negotiations through the USSR, because the latter eventuality would increase Soviet prestige so much that the whole Far East would become Communist.\n\nKase allegedly believes that one of the few provisions the Japanese would insist upon would be the retention of the Emperor as the only safeguard against Japan’s conversion to Communism. Kase feels that Under Secretary of State Grew, whom he considers the best US authority on Japan, shares this opinion.\n\nWilliam J. Donovan", "notes": [], "note": "번역자 주 — 베른 경로. 전언 층위가 네 겹이다 — 「가세 → 독일계 소식통 → 베른 OSS 대표 → 도너번 → 국무장관」. 원문의 전언 표지를 하나도 지우지 않고 옮겼다: 'He reports that'(그는 …라고 보고한다), 'reportedly'(보고된 바로는), 'allegedly'(전하는 바로는), 'Kase feels'(가세는 …라고 느끼고 있다). 확인된 사실은 「5월 11일 소식통이 가세와 이야기했다」는 것뿐이고 나머지는 모두 그 소식통의 진술이다. 핵심 낱말은 'cessation of hostilities(적대행위 중지)'이며 'surrender'도 'peace feeler'도 'mediation'도 쓰이지 않았다 — 가세는 항복이 아니라 적대행위를 멈추는 일을 말한 것으로 보고되었다. Shunichi Kase는 가세 슌이치(加瀬俊一)로 옮겼으나 원문에 한자가 없어 로마자를 병기했다. 원문 날짜 표기 '12 May, 1945'는 이 묶음의 다른 문서(May 12, 1945)와 어순이 다른데 원문 그대로다. 서명 'William J. Donovan'은 서명이므로 한국어로 옮기고 people에 로마자를 병기했다.", "warn": false, "pages": ["481"], "search": "William J. Donovan 윌리엄 J. 도너번 — 전략사무국(OSS) 국장, 이 각서의 작성자 Shunichi Kase 가세 슌이치 — 주스위스 일본 공사 Joseph C. Grew 그루 — 국무차관"}, {"id": "d350", "order": 350, "date": "1945-05-17", "group": "X", "eyebrow": "d350 · The British Minister (Sansom) to the Chief of the Division of Japanese Affairs (Dickover)", "title": "영국 공사(샌섬)가 일본과장(딕오버)에게", "badge": null, "list_right": "문서 350", "meta": [{"k": "일자", "v": "1945-05-17"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.0011 PW/5–1745", "txt": true}, {"k": "발신", "v": "영국 공사 샌섬(George Sansom)", "txt": true}, {"k": "수신", "v": "국무부 일본과장 딕오버(Erle R. Dickover)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "서한 (첨부: 구술서)"}], "links": [{"k": "FRUS", "text": "문서 350 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d350"}], "summary": "도쿄에서 어떤 일본인들이 스웨덴 공사에게 한 발언에 관하여, 영국 외무성도 같은 소식통에게서 같은 경로로 4월 초 유사한 보고를 받았으며 국무부와 마찬가지로 그것이 평화 타진에 해당한다고 보지 않았고, 그 뒤 같은 소식통에게서 스즈키가 강화에 찬성한다는 보고와 고노에 공이 스웨덴 공사에게 한 발언을 추가로 받았다고 전하는 서한과 그 첨부 구술서.", "points": ["샌섬이 딕오버에게: 도쿄에서 어떤 일본인들이 스웨덴 공사에게 한 발언들을 딕오버가 알려 준 대화와 관련하여, 외무성에서 방금 받은 전보의 요지를 보낸다.", "외무성도 국무부와 마찬가지로 인용된 발언들이 평화 타진(peace feeler)에 해당한다고 보지 않았음을 알 수 있을 것이며, 고노에 공의 발언에 관한 추가 정보가 그들의 전문에 들어 있다.", "리스본 주재 일본 참사관의 견해에 관한 딕오버의 5월 14일 비망록을 방금 받아 외무성에 전달했다.", "[첨부] 외무성은 4월 초에 같은 소식통으로부터 같은 경로를 거쳐 유사한 보고를 받았다. 일본인들이 무조건항복을 불명예로 여기며 천황의 지위에 영향을 주는 어떠한 헌법 변경도 받아들이지 않으리라는 취지였다.", "[첨부] 외무성이 받은 판본에 따르면, 문제의 일본인들은 최근 태평양문제조사회(I.P.R.) 회의에서 제기된, 천황과 그 가족을 물리쳐야 한다는 제안이 전쟁 종결에 가장 찬성하는 일본인들 사이에서조차 매우 나쁜 인상을 남겼다고 말했다.", "[첨부] 그 보고는, 일본인들이 전쟁에 졌음을 인식하고 있으며 교섭에 의한 강화에서 광범위한 조건을 받아들일 준비가 되어 있을 것이나, 연합국이 일본을 점령할 수 있으리라고는 믿지 않는다고 덧붙였다.", "[첨부] 외무성이 받은 보고에서 위 견해들은 어떤 고위 관리들의 것으로 인용된 것이 아니라 일본 국민 일반의 태도를 대표하는 것으로 인용되었다. 평화 타진의 문제는 전혀 없어 보였고 따라서 국무부에 통보할 가치가 있다고 생각되지 않았다.", "[첨부] 그 뒤 외무성은 같은 소식통으로부터 스즈키[각주8: 스즈키 간타로 해군대장, 4월 7일 이래 총리]가 강화를 맺는 데 찬성한다는 보고를 받았으나, 어떤 종류의 강화인지는 언급되어 있지 않다.", "[첨부] 이 보고는, 고노에 공이 스웨덴 공사와의 대화에서, 미국인들이 유럽과 아시아 양쪽에서 그토록 비상한 힘을 보인 지금 영국인들이 미국인들을 매우 시샘하고 있을 것이라는 견해를 표명했다고 덧붙인다.", "[첨부] 스웨덴 공사는 미국과 영국 사이의 어떠한 불화도 기대하는 것은 일본인들에게 어리석은 일일 것이라고 답한 것으로 전해진다."], "primary": "워싱턴, 1945년 5월 17일.\n\n친애하는 딕에게: 도쿄에서 어떤 일본인 개인들이 스웨덴 공사에게 한 몇 가지 발언을 귀하가 내게 알려 준 우리의 대화와 관련하여, 나는 외무성으로부터 방금 받은 전보의 요지를 여기에 동봉하여 보냅니다.\n\n귀하는, 외무성이 국무부와 마찬가지로 인용된 그 발언들이 평화 타진(peace feeler)에 해당한다고 보지 않았다는 것, 그리고 고노에 공[주5]의 언급에 관한 약간의 추가 정보가 그들의 전문에 포함되어 있다는 것을 알게 될 것입니다.\n\n우리는 리스본 주재 일본 참사관의 견해에 관한 귀하의 5월 14일자 비망록[주6]을 방금 받았고, [482면] 이를 외무성에 전달하였습니다.\n\n경구,\n\n조지\n\n[첨부]\n\n영국 대사관이 국무부에\n\n외무성은 4월 초에 같은 소식통으로부터, 같은 경로를 거쳐, 일본인들이 무조건항복을 불명예스러운 것으로 여기며 천황의 지위에 영향을 미치는 어떠한 헌법 변경도 받아들이지 않으리라는 취지의 유사한 보고를 받았다.\n\n외무성이 받은 판본에 따르면, 문제의 일본인 개인들은, 천황과 그 가족이 물리쳐져야 한다는 최근 I.P.R.[주7] 회의에서 제기된 제안들이 전쟁을 끝내는 데 가장 찬성하는 일본인들 사이에서조차 매우 나쁜 인상을 만들어 냈다고 말하였다. 그 보고는, 일본인들이 전쟁에 졌음을 인식하고 있으며 교섭에 의한 강화에서 광범위한 조건들을 받아들일 준비가 되어 있으리라는 것, 그러나 연합국이 일본을 점령할 수 있으리라고는 그들이 믿지 않는다는 것을 덧붙였다.\n\n외무성이 받은 보고에서, 위의 견해들은 어떤 고위 관리들의 견해로서가 아니라 일본 국민 일반의 태도를 대표하는 것으로서 인용되었다. 평화 타진의 문제는 전혀 있어 보이지 않았고, 따라서 국무부에 알릴 만한 가치가 있다고 생각되지 않았다.\n\n그 뒤 외무성은 같은 소식통으로부터 스즈키[주8]가 강화를 맺는 데 찬성한다는 보고를 받았으나, 어떤 종류의 강화인지는 언급되어 있지 않다. 이 보고는, 고노에 공이 스웨덴 공사와의 대화에서, 미국인들이 유럽과 아시아 양쪽에서 그토록 비상한 힘을 보여 준 지금 영국인들이 미국인들을 매우 시샘하고 있음에 틀림없으리라는 견해를 표명하였다고 덧붙인다.\n\n스웨덴 공사는, 미국과 영국 사이의 어떠한 불화든 그것을 기대하는 것은 일본인들에게 어리석은 일일 것이라고 답하였다고 전해진다.\n\n[워싱턴,] 1945년 5월 17일.\n\n[483면]", "secondary": "Washington, May 17, 1945.\n\nDear Dick: With reference to our conversation in which you informed me of some statements made in Tokyo to the Swedish Minister by certain Japanese individuals, I send you herewith the substance of a telegram just received from the Foreign Office.\n\nYou will see that the Foreign Office, like the Department of State, did not regard the statements quoted as amounting to a peace feeler; and that some additional information as to remarks made by Prince Konoye [주5] is included in their message.\n\nWe have just received your memorandum of May 14th [주6] regarding [482면] the views of the Japanese Counsellor at Lisbon, and have transmitted it to the Foreign Office.\n\nYours very sincerely,\n\nGeorge\n\n[Enclosure]\n\nThe British Embassy to the Department of State\n\nThe Foreign Office received a similar report from the same source and through the same channels early in April, to the effect that the Japanese considered unconditional surrender dishonourable and would not accept any change in the constitution affecting the position of the Emperor.\n\nAccording to the version received by the Foreign Office, the Japanese individuals in question said that suggestions mooted at the recent I.P.R. [주7] Conference that the Emperor and his family should be set aside, had created a very bad impression even among those Japanese who were most in favour of ending the war. The report added that the Japanese realized that the war was lost and that they would be prepared to accept far reaching conditions in a negotiated peace, but they did not believe that the Allies could occupy Japan.\n\nThe above views were not, in the report received by the Foreign Office, quoted as those of certain high ranking officials, but as representing the attitude of the Japanese people in general. There did not seem to be any question of a peace feeler, and consequently it was not thought worth while to notify the Department of State.\n\nSubsequently the Foreign Office have received from the same source a report that Suzuki [주8] is in favour of making peace, but what kind of peace is not stated. This report adds that Prince Konoye, in conversation with the Swedish Minister, had expressed the view that the British must be getting very jealous of the Americans now that the latter had shown such extraordinary strength in both Europe and Asia.\n\nThe Swedish Minister is said to have answered that it would be foolish of the Japanese to count upon any disagreement between the United States and Britain.\n\n[Washington,] May 17, 1945.\n\n[483면]", "notes": ["[주5] 고노에 후미마로 공(Prince Fumimaro Konoye). 일본 총리, 1937년 6월~1939년 1월 및 1940년 7월 22일~1941년 10월 16일.", "[주6] 478면 각주 97 참조.", "[주7] 태평양문제조사회(Institute of Pacific Relations).", "[주8] 스즈키 간타로 남작 해군대장(Adm. Baron Kantaro Suzuki). 4월 7일 이래 일본 총리."], "note": "번역자 주 — 영국 측 판단. 이 문서의 값어치는 「같은 정보를 영국이 먼저 받고도 평화 타진으로 보지 않았다」는 데 있다 — 미국과 영국이 같은 소식통(도쿄 주재 스웨덴 공사)을 공유하고 있었음이 드러난다. d343(4월 6일 스톡홀름발)이 바로 그 「같은 소식통, 같은 경로」의 미국 측 판본이다. 원문의 층위 구분을 그대로 살렸다: 영국 외무성이 받은 판본에서 그 견해들은 「고위 관리들의 견해로서가 아니라 일본 국민 일반의 태도를 대표하는 것으로」 인용되었다는 단서, 그리고 스웨덴 공사의 답변에 붙은 'is said to have answered(답하였다고 전해진다)'를 빠뜨리지 않았다. 'peace feeler'는 원문에서 두 번 쓰이며 「평화 타진」으로 일관되게 옮기고, 'negotiated peace 교섭에 의한 강화', 'unconditional surrender 무조건항복'과 구별했다. 서한 본문은 샌섬이 딕오버에게 보낸 사신(私信) 형식이라 'Dear Dick / Yours very sincerely, George'라는 애칭 서명을 그대로 옮겼다. 첨부는 영국 대사관이 국무부에 보낸 구술서(aide-mémoire) 형식이다. 「스즈키가 강화에 찬성한다」는 대목은 어떤 종류의 강화인지 원문 자체가 명시하지 않는다고 밝히고 있으므로 보충하지 않았다.", "warn": false, "pages": ["481", "482", "483"], "search": "George Sansom 조지 샌섬 — 영국 공사, 발신자(서명 「조지」) Erle R. Dickover 딕오버 — 국무부 일본과장, 수신자(호칭 「딕」) Prince Fumimaro Konoye 고노에 후미마로 공 — 전 일본 총리(각주5) Kantaro Suzuki 스즈키 간타로 — 일본 총리, 4월 7일 이래(각주8) the Swedish Minister 스웨덴 공사 — 도쿄 주재(이름은 원문에 없음. d343 각주94의 바게와 같은 인물로 보인다)"}, {"id": "d353", "order": 353, "date": "1945-05-28", "group": "A", "eyebrow": "d353 · The Ambassador in China (Hurley) to the Secretary of State", "title": "주중대사(헐리)가 국무장관에게", "badge": null, "list_right": "문서 353", "meta": [{"k": "일자", "v": "1945-05-28"}, {"k": "시각", "v": "발신 1945년 5월 28일 오후 5시 (Chungking, May 28, 1945—5 p.m.) / 접수 5월 29일 오후 2시 40분 ([Received May 29—2:40 p.m.])"}, {"k": "장소", "v": "Chungking", "txt": true}, {"k": "전문번호", "v": "863"}, {"k": "원문출처", "v": "740.00119 P.W./5–2845: Telegram", "txt": true}, {"k": "발신", "v": "주중대사 헐리(Patrick J. Hurley)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 353 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d353"}], "summary": "리스본 주재 중국 공사 장첸(Chang Chien)의 전보 요약을 중국 외교부 대리부장 우궈전이 대사관에 넘겨주면서, 중국 외교부가 이미 「중국은 일본의 무조건항복에 못 미치는 어떤 것도 받아들이지 않는다」고 회답했고 일본이 러시아에 대한 의심을 뿌리려는 「명백한 노력」을 하고 있다고 논평했다는 보고.", "points": ["국무부는 물론 최근의 일본 평화 타진에 관하여 리스본 주재 우리 대사관으로부터 충분히 통보받았겠으나, 헐리는 외교부 대리부장[각주10: 우궈전, 중국 외교부 정무차장]이 제공한 리스본 주재 중국 공사 장첸(Chang Chien)의 전보 요약을 아마도 흥미로울 것으로 여겨 제출한다.", "[여기에 5월 7일 정오 리스본발 전보 제990호(478면 수록)와 유사한 전보 요약이 뒤따른다.]", "이 전문을 브리그스[각주11: 엘리스 O. 브리그스, 주중대사관 경제참사관]에게 건네면서, 우궈전은 중국 외교부가 이미 회답하여 중국은 일본의 무조건항복에 못 미치는 어떤 것도 받아들이지 않겠다고 선언하였다고 말했다.", "그는 또한 일본이 러시아에 대한 의심을 뿌리려는 「명백한 노력」에 대해 논평하였다."], "primary": "충칭, 1945년 5월 28일 — 오후 5시.\n[5월 29일 오후 2시 40분 접수]\n\n863. 국무부는 물론 최근의 일본 평화 타진에 관하여 리스본 주재 우리 대사관으로부터 충분히 통보를 받았겠으나, 나는 외교부 대리부장[주10]이 제공한, 그곳 주재 중국 공사 장첸(Chang Chien)의 전보 요약을 아마도 흥미로울 것으로 여겨 제출한다.\n\n[여기에 478면에 수록된 5월 7일 정오 리스본발 전보 제990호와 유사한 전보의 요약이 뒤따른다.]\n\n이 전문을 브리그스[주11]에게 건네면서 우(吳)는, 중국 외교부가 이미 회답하여 중국은 일본의 무조건항복에 못 미치는 어떠한 것도 받아들이지 않을 것이라고 선언하였다고 말하였다. 그는 또한 러시아에 대한 의심을 뿌리려는 일본의 「명백한 노력」에 대하여 논평하였다.\n\n헐리", "secondary": "Chungking, May 28, 1945—5 p.m. \n [Received May 29—2:40 p.m.]\n\n863. Although the Department will, of course, have been fully informed by our Embassy in Lisbon of the recent Japanese peace feeler, I submit as of probable interest the following summary of a telegram from Chang Chien, Chinese Minister there, which has been made available by the Acting Foreign Minister: [주10]\n\n[Here follows summary of telegram similar to telegram 990, May 7, noon, from Lisbon, printed on page 478.]\n\nWhen handing this message to Briggs, [주11] Wu stated that the Chinese Foreign Office had already replied, declaring that China will accept nothing less than unconditional surrender of Japan. He also commented upon the “obvious effort” of Japan to sow suspicion of Russia.\n\nHurley", "notes": ["[주10] 우궈전(K. C. Wu). 중국 외교부 정무차장(政務次長).", "[주11] 엘리스 O. 브리그스(Ellis O. Briggs). 주중대사관 경제참사관."], "note": "번역자 주 — 충칭 경로. 이 전보의 값어치는 리스본 접촉(d346)이 미국뿐 아니라 중국 측 경로로도 동시에 전해졌고, 중국이 이미 「무조건항복에 못 미치는 것은 받지 않는다」고 회답해 버렸다는 데 있다 — 일본의 이간(離間) 시도에 대한 중국 측의 즉각적 차단이다. 원문 본문 중 대괄호 「[Here follows summary…]」는 FRUS 편찬자가 중복 수록을 생략한 표시이므로 그대로 살렸다. 헐리 자신은 이를 'the recent Japanese peace feeler(최근의 일본 평화 타진)'라고 부르는데, 정작 리스본의 이노우에 본인은 d346에서 그것이 peace feeler로 해석되기를 원치 않는다고 했다 — 성격 규정이 전달 과정에서 바뀐 대목이므로 낱말을 그대로 두었다. 중국 인명 Chang Chien은 원문 로마자 표기 그대로 두고 「장첸」으로 음차했다(웨이드식 표기라 한자를 단정할 수 없다). K. C. Wu는 우궈전(吳國楨)으로 통용되는 인물이다.", "warn": false, "pages": ["484"], "search": "Patrick J. Hurley 헐리 — 주중 미국 대사, 발신자 Chang Chien 장첸 — 리스본 주재 중국 공사 K. C. Wu 우궈전 — 중국 외교부 정무차장, 외교부 대리부장(각주10) Ellis O. Briggs 엘리스 O. 브리그스 — 주중 미국 대사관 경제참사관(각주11)"}, {"id": "d355", "order": 355, "date": "1945-05-30", "group": "X", "eyebrow": "d355 · The Ambassador in Portugal (Baruch) to the Secretary of State", "title": "주포르투갈 대사(배럭)가 국무장관에게", "badge": null, "list_right": "문서 355", "meta": [{"k": "일자", "v": "1945-05-30"}, {"k": "시각", "v": "접수 1945년 6월 6일 오후 6시 ([Received June 6—6 p.m.]). 발신 시각은 원문에 없다(항공우편 전보)."}, {"k": "장소", "v": "Lisbon", "txt": true}, {"k": "전문번호", "v": "A–446"}, {"k": "원문출처", "v": "740.00119 P.W./5–3045: Airgram", "txt": true}, {"k": "발신", "v": "주포르투갈 대사 배럭(Baruch)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보 (항공우편 전보)"}], "links": [{"k": "FRUS", "text": "문서 355 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d355"}], "summary": "리스본 일본 공사관이 석간신문에 낸 공보 — 5월 21일 외신 기자회견에서 일본 정부 대변인 이구치가 영미 측이 퍼뜨린 강화 제의 보도를 단정적으로 부인하고, 일본은 어떤 장소에서도 어떤 경로로도 미국이나 영국에 강화를 제의한 적이 없다고 말했다는 내용.", "points": ["리스본의 석간신문들이 일본 공사관의 다음 공보를 게재했다.", "「이달 21일 외신 기자회견에서 일본 정부 대변인 이구치(M. Iguchi)는 영미 측이 퍼뜨린 강화 제의 보도를 단정적으로 부인하며 다음과 같이 말하였다.」", "「일본이 강화 제의를 제출하였다는 보도가 전적으로 근거 없다는 것은 말할 필요조차 없다.」", "「일본은 어떤 장소에서도, 어떤 경로를 통해서도, 미국에도 영국에도 강화를 제의한 적이 결코 없으며, 이런 유의 선전을 하는 적의 의도는 명백하여 일본 국민의 전투 사기를 약화시키는 것을 노린다.」", "「이 선전은 앞으로도 유용하다고 판단될 때마다 되풀이되리라고 상정할 수 있다. 그럼에도 불구하고 전쟁 수행에 관하여 일본 제국이 이미 정한 정책들은 어떤 방식으로도 영향을 받지 않을 것이며, 더욱이 그것은 재확인할 필요조차 없는 일이다.」"], "primary": "리스본, 1945년 5월 30일.\n[6월 6일 오후 6시 접수]\n\nA–446. 리스본의 석간신문들이 일본 공사관으로부터 나온 다음의 공보를 게재하였다.\n\n「이달 21일 외신 기자회견에서 일본 정부 대변인 이구치(M. Iguchi)는 [485면] 영미 측이 퍼뜨린 강화 제의 보도를 단정적으로 부인하며 다음과 같이 말하였다.\n\n『일본이 강화 제의를 제출하였다는 보도가 전적으로 근거가 없다는 것은 말할 필요조차 없는 일이다.\n\n일본은 어떤 장소에서도, 또 어떤 경로를 통해서도 미국에나 영국에나 강화를 제의한 적이 결코 없으며, 이런 유의 선전을 행하는 적의 의도는 명백하여 일본 국민의 전투 사기를 약화시키는 것을 노리고 있다.\n\n이 선전은 앞으로도 그렇게 하는 것이 유용하다고 판단될 때마다 되풀이되리라고 상정할 수 있다. 그럼에도 불구하고 전쟁 수행에 관하여 일본 제국이 이미 정해 놓은 정책들은 어떠한 방식으로도 영향을 받지 않을 것이며, 더욱이 그것은 재차 확인할 필요가 없는 일이다.』」\n\n배럭", "secondary": "Lisbon, May 30, 1945.\n[Received June 6—6 p.m.]\n\nA–446. Evening newspapers in Lisbon published following communiqué from Japanese Legation:\n\n“In the Foreign Press Conference on the 21st of the present month M. Iguchi, spokesman for the Japanese Government, categorically [485면] denied the reports of peace proposals divulged by the Anglo-Americans stating the following:\n\n‘It would be superfluous to say that the reports that Japan has presented peace proposals are totally without foundation.\n\nJapan has never proposed peace either to America or England in any place or through any channel and the intentions of the enemy in making propaganda of this type are obvious and contemplate the weakening of the fighting morale of the Japanese people.\n\nIt may be assumed that this propaganda will be repeated in the future whenever it is judged useful to do so. Nevertheless, the policies already determined by the Japanese Empire in reference to the prosecution of war will not be affected in any manner which, furthermore, it is unnecessary to reaffirm.’”\n\nBaruch", "notes": [], "note": "번역자 주 — 이 묶음에서 유일한 일본 측 공식 발언이다. 앞의 여러 접촉(리스본·스톡홀름·베른·바티칸)에 대해 일본 정부가 공개적으로 전면 부인한 것이다. 「어떤 장소에서도, 어떤 경로를 통해서도(in any place or through any channel)」라는 문구가 핵심이라 풀어 쓰지 않고 그대로 옮겼다 — 실제로는 d346의 이노우에가 바로 그 리스본에서 접촉했고, d347의 오노데라는 만나기 전까지 접근 사실을 부인하겠다고 미리 말해 둔 상태였다. 즉 부인 자체가 사료다. 원문은 포르투갈어 신문에 실린 공보를 영역한 것이라 'M. Iguchi'처럼 프랑스식 경칭 표기가 남아 있고 문장이 다소 번역투인데, 그 결을 그대로 두었다. 인용부호가 세 겹(공보 「」 안에 대변인 발언 『』)이므로 층위를 구분해 표시했다. 'peace proposals'는 「강화 제의」로 옮겨 'peace feeler(평화 타진)'와 구별했다.", "warn": false, "pages": ["484", "485"], "search": "Baruch 배럭 — 주포르투갈 미국 대사, 발신자 M. Iguchi 이구치 — 일본 정부 대변인(원문에 성만 있음. 이구치 사다오 井口貞夫로 추정되나 원문 근거 없음)"}, {"id": "d357", "order": 357, "date": "1945-06-04", "group": "B", "eyebrow": "d357 · Memorandum by the Acting Director of the Office of Strategic Services (Buxton) to the Secretary of State", "title": "전략사무국장대리(벅스턴)가 국무장관에게 보낸 각서", "badge": null, "list_right": "문서 357", "meta": [{"k": "일자", "v": "1945-06-04"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 P.W./6–445", "txt": true}, {"k": "발신", "v": "전략사무국(OSS) 국장대리 벅스턴(G. Edward Buxton)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 357 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d357"}], "summary": "베른 주재 OSS 대표가 6월 2일 전달한 것으로, 5월 12일자 각서에 이어지는 후속 보고 — 같은 독일계 소식통이 유럽 주재 일본 해군 대표 후지무라와 접촉하고 있으며, 후지무라는 지금 일본 정부를 장악하고 있는 해군 측이 항복할 뜻은 있으나 천황의 존치가 반드시 필요하다고 강조했다고 전한다.", "points": ["베른 주재 OSS 대표가 6월 2일 전달한 정보로, 「일본의 강화 타진(peace feeler)이라 하는 것」에 관한 1945년 5월 12일자 각서의 후속편이다.", "정보의 출처는 앞서와 같은 인물 — 극동에 관한 권위자이며 반나치이나 친일본으로 여겨지는 독일계 인사 — 이다.", "소식통은 후지무라(Fujimura)와 접촉하고 있다. 후지무라는 유럽 주재 일본 해군의 주요 대표 가운데 하나이며 전 베를린 주재 해군무관보로 이해되는 인물이다.", "후지무라는 일본 해군대신[해군상?]과 전보로 직접·비밀리에 접촉하고 있다고 보고되며, 일본 정부의 신임을 받고 있다고 여겨진다.", "후지무라가 소식통에게 시사한 바로는, 현재 일본 정부를 장악[?]하고 있는 해군 측은 항복할 뜻이 있으나 가능하다면 지금의 파국에서 얼마간의 체면은 건지고자 한다.", "그가 밝히기를, 그 해군 측은 특히 공산주의와 혼란을 피하기 위하여 천황을 존치할 필요성을 강조한다.", "후지무라는 일본이 기본적으로 필수적인 식량을 자급할 수 없으며 설탕과 쌀을 조선에 의존하고 있음을 역설한다.", "그는 또한 일본이 필요한 식량 수입을 위하여 상선대(商船隊)의 일부를 보유할 필요가 있다고 주장한다."], "primary": "워싱턴, 1945년 6월 4일.\n\n다음의 정보는 베른 주재 OSS 대표가 6월 2일에 전달한 것으로, 일본의 강화 타진이라 하는 것(an alleged Japanese peace feeler)에 관한 1945년 5월 12일자 각서의 후속편이다. 이 정보의 출처는 앞서와 같은, 극동에 관한 독일계 권위자로서 반(反)나치이나 친(親)일본으로 여겨지는 인물이다.\n\n소식통은 후지무라(Fujimura)와 접촉을 유지하고 있다. 후지무라는 유럽 주재 일본 해군 주요 대표 가운데 한 사람이며 전(前) 베를린 주재 해군무관보로 이해되는 인물이다. 후지무라는 일본 해군대신[해군상?][주12]과 전보로 직접 그리고 비밀리에 접촉하고 있다고 보고되며, 일본 정부의 신임을 누리고 있다고 여겨진다.\n\n후지무라가 소식통에게 시사한 바로는, 지금 일본 정부를 장악[?][주13]하고 있는 해군 측은 항복할 뜻이 있으나 가능하다면 현재의 파국에서 얼마간의 체면은 건지기를 바란다. 그가 밝히는 바로, 이 해군 측은 공산주의와 혼란을 피하기 위하여 천황을 존치할 필요성을 특히 강조한다. 후지무라는 일본이 기본적으로 필수적인 식량을 스스로 조달할 수 없으며 설탕과 쌀을 조선에 의존하고 있음을 힘주어 말한다. 그는 또한 일본이 필요한 식량 수입을 위하여 상선대의 일부를 보유해야 한다고 주장한다.\n\nG. 에드워드 벅스턴", "secondary": "Washington, 4 June, 1945.\n\nThe following information, transmitted by the OSS representative in Bern on 2 June, is a sequel to a memorandum dated 12 May 1945 concerning an alleged Japanese peace feeler. The source of the information is the same German authority on the Far East who is considered anti-Nazi but pro-Japanese:\n\nSource is in touch with Fujimura, who is understood to be one of the principal Japanese naval representatives in Europe and a former Assistant Naval Attaché in Berlin. Fujimura is reported to be in direct and secret contact by cable with the Japanese Minister of Marine [Navy?] [주12] and is believed to enjoy the confidence of the Japanese Government.\n\nFujimura indicated to source that the Navy circles who now control[?] [주13] the Japanese Government would be willing to surrender but wish, if possible, to save some face from the present wreckage. These Navy circles, he declares, particularly stress the necessity of preserving the Emperor in order to avoid Communism and chaos. Fujimura emphasizes that Japan cannot supply itself with basically essential foodstuffs and is dependent upon Korea for sugar and rice. He also insists that Japan needs to retain some of its merchant marine for necessary food imports.\n\nG. Edward Buxton", "notes": ["[주12] 일본 해군대신 요나이 미쓰마사 대장(Adm. Mitsumasa Yonai). (대괄호는 원문에 있는 것이다.)", "[주13] 대괄호는 원문에 있는 것이다."], "note": "번역자 주 — d349(5/12)에서 시작된 베른 OSS 경로의 두 번째 보고다. 전언 층위는 「후지무라 → 독일계 소식통 → 베른 OSS 대표(6/2 전달) → OSS 국장대리 벅스턴 → 국무장관」의 네 겹이다. 원문의 전언 표지를 지우지 않고 옮겼다: 'who is understood to be'(…로 이해되는), 'is reported to be'(…라고 보고되며), 'is believed to'(…라고 여겨진다), 'indicated to source'(소식통에게 시사한), 'he declares'(그가 밝히는 바로). 확인된 사실은 「베른 OSS 대표가 6월 2일 이 정보를 전달했다」는 것뿐이다.\n\n낱말 구분: 첫 문단의 'peace feeler'는 「강화 타진」으로, 본문의 'surrender'는 「항복」으로 옮겼고 서로 섞지 않았다. 'alleged'는 「…이라 하는」으로 살렸다 — 미국 측이 아직 진위를 판단하지 않았다는 표시다.\n\n원문의 대괄호 두 곳([Marine]→[Navy?], control[?])은 FRUS 편자가 넣은 것으로 각주 12·13이 그 사실을 밝힌다. 번역에서도 대괄호와 물음표를 그대로 두었다. 'Minister of Marine [Navy?]'는 원문 전보가 프랑스어식 'Ministre de la Marine' 어법을 따라 Marine으로 적힌 것을 편자가 Navy로 바로잡은 흔적이므로 「해군대신[해군상?]」으로 옮겼다.\n\nFujimura는 한자 표기가 원문에 없어 「후지무라」로 적고 로마자를 병기했다. d364에서 Yosikazu Fujimura(후지무라 요시카즈로 추정)로 성명이 나오나 이 문서에는 성만 있으므로 이름은 넣지 않았다.\n\n조선이 언급되는 대목이 있다 — 「일본은 설탕과 쌀을 조선(Korea)에 의존한다」. 일본 측이 항복을 말하면서도 식량 공급원으로서 조선을 전제하고 있음을 보여주는 구절이다.", "warn": false, "pages": ["486"], "search": "G. Edward Buxton G. 에드워드 벅스턴 — 전략사무국(OSS) 국장대리, 이 각서의 작성자 Fujimura 후지무라 — 유럽 주재 일본 해군 주요 대표의 한 사람, 전 베를린 주재 해군무관보 (d364에 이름이 Yosikazu Fujimura로 나온다) Mitsumasa Yonai 요나이 미쓰마사 — 일본 해군대신 (각주 12)"}, {"id": "d358", "order": 358, "date": "1945-06-22", "group": "B", "eyebrow": "d358 · Memorandum by the Acting Director of the Office of Strategic Services (Buxton) to the Secretary of State", "title": "전략사무국장대리(벅스턴)가 국무장관에게 보낸 각서", "badge": null, "list_right": "문서 358", "meta": [{"k": "일자", "v": "1945-06-22"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 P.W./6–2245", "txt": true}, {"k": "발신", "v": "전략사무국(OSS) 국장대리 벅스턴(G. Edward Buxton)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 358 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d358"}], "summary": "베른 주재 OSS 대표가 전달한 것으로 5월 12일·6월 4일자 각서에 이어지는 후속 보고 — 후지무라가 항복에 앞서 천황이 존치된다는 보장을 요구하며, 베른 신문에서 앨런 덜레스가 북이탈리아 독일군의 항복(capitulation)을 주선한 기사를 읽고 그 독일군에게 주어졌을지 모를 무조건 항복 이하의 조건을 알고 싶어 한다는 내용. 후지무라와 소식통의 신원 설명이 부기되어 있다.", "points": ["베른 주재 OSS 대표가 전달한 정보로, 베른 주재 일본 공사관에서 나온 것으로 전해지는(reportedly) 강화 타진에 관한 5월 12일자·6월 4일자 각서의 후속편이다.", "정보의 출처는 앞선 각서들에서 언급된 것과 같은 독일계 인사이며, 그에 대한 설명이 아래에 부기되어 있다.", "소식통에 따르면(According to source), 후지무라는 일본인이 항복하기에 앞서 천황이 존치되리라는 보장을 요구할 것이라고 주장한다.", "후지무라는 베른 신문에서 앨런 덜레스가 북이탈리아 독일군 항복(the German capitulation in North Italy)을 주선하는 데 맡은 역할에 관한 기사를 읽었다.", "후지무라는 그 독일군에게 무조건 항복에 못 미치는(short of unconditional surrender) 어떤 조건이 주어졌을 수 있는지 알고 싶어 하는 것이 분명하다.", "[부기 1] 후지무라는 전 베를린 주재 일본 해군무관보로, 유럽 주재 일본 해군의 주요 대표 가운데 하나로 여겨진다. 베른에서 도쿄의 해군 측과 전보로 긴밀히 접촉하고 있다고 전해진다.", "[부기 2] 소식통은 제1차 세계대전 때 일본군의 포로가 되었던 독일인으로, 석방 뒤 일본에 남아 중요한 상업 관계를 맺고 일본의 대독일 발주를 중개하여 상당한 재산을 모았으며 일본 고위층, 특히 해군의 신임을 얻었다.", "그는 몇 해 전 유럽으로 돌아왔고 히틀러 정부에 기피 인물(persona non grata)이었으므로 취리히에 거주하였으나 베를린의 일본 측, 특히 해군무관 노무라 제독과 접촉을 유지하였다.", "그는 2년 전 일본 측에 독일이 결정적으로 패배할 것이라고 조언한 것으로 이해되는데, 그때 오시마 대사는 공식적으로 독일의 승리를 예언하고 있었다."], "primary": "워싱턴, 1945년 6월 22일.\n\n다음의 정보는 베른 주재 OSS 대표가 전달한 것으로, 전하는 바로는(reportedly) 베른 주재 일본 공사관에서 나오고 있는 [487면] 강화 타진에 관한 5월 12일자 및 6월 4일자 각서의 후속편이다. 이 정보의 출처는 앞선 각서들에서 언급된 것과 같은 독일계 권위자이며, 그에 대한 설명을 아래에 붙인다.\n\n소식통에 따르면, 후지무라는 일본인이 항복하기에 앞서 천황이 존치되리라는 보장을 요구할 것이라고 주장한다. 후지무라는 앨런 덜레스(Allen Dulles)[주14] 씨가 북이탈리아에서 독일군의 항복을 주선하는 데 맡았던 역할에 관한 기사를 베른 신문에서 읽었다. 후지무라는 그 독일군에게 무조건 항복에 못 미치는 어떤 조건이 주어졌을 수 있는지를 알고자 하는 데 분명한 관심을 두고 있다.\n\n[후지무라는 전 베를린 주재 일본 해군무관보로, 유럽 주재 일본 해군의 주요 대표 가운데 하나로 여겨진다. 그는 베른에서 도쿄의 해군 측과 전보로 긴밀히 접촉하고 있다고 전해진다.][주15]\n\n[소식통은 제1차 세계대전에서 일본군에게 포로가 되었던 독일 국적자이다. 석방된 뒤 그는 일본에 머무르며 그곳에서 중요한 상업 관계를 세웠다. 그는 일본의 대(對)독일 구매를 중개하여 상당한 재산을 모았고, 일본 고위층, 특히 해군의 신임을 얻었다. 몇 해 전 그는 유럽으로 돌아왔으며, 히틀러 정부에게 기피 인물(persona non grata)이었으므로 취리히에 거처를 잡았다. 그러나 그는 베를린의 일본 측, 특히 일본 해군무관 노무라 제독과 접촉을 유지하였다. 그는 2년 전 일본 측에 독일이 결정적으로 패배하리라고 조언한 것으로 이해되는데, 그 무렵 오시마 대사는 공식적으로 독일의 승리를 예언하고 있었다.][주15]\n\nG. 에드워드 벅스턴", "secondary": "Washington, 22 June, 1945.\n\nThe following information, transmitted by the OSS representative in Bern, is a sequel to memoranda dated 12 May and 4 June concerning [487면] peace feelers emanating reportedly from the Japanese Legation in Bern. The source of the information is the same German authority referred to in previous memoranda, a description of whom is appended below:\n\nAccording to source, Fujimura insists that the Japanese, before surrendering, would require assurances that the Emperor would be retained. Fujimura has read accounts in the Bern press of Mr. Allen Dulles’ [주14] part in arranging for the German capitulation in North Italy. Fujimura is obviously interested in knowing what terms short of unconditional surrender might have been granted these Germans.\n\n[Fujimura, a former Japanese Assistant Naval Attaché in Berlin, is considered to be one of the principal Japanese naval representatives in Europe. From Bern he is reportedly in close touch by cable with naval circles in Tokyo.] [주15]\n\n[Source is a German national who was taken prisoner by the Japanese in World War I. Upon his release he remained in Japan and established important commercial relations there. He placed Japanese purchases in Germany, made a substantial fortune, and gained the confidence of high Japanese circles, particularly in the Navy. Some years ago he returned to Europe, and, as he was persona non grata with the Hitler Government, he took up residence in Zurich. He maintained contacts, however, with Japanese circles in Berlin, especially with Admiral Nomura, the Japanese Naval Attaché. He is understood to have advised the Japanese two years ago that Germany would be decisively defeated, while Ambassador Oshima at that time officially predicted a German victory.] [주15]\n\nG. Edward Buxton", "notes": ["[주14] 유럽에서 전략사무국(OSS)에 복무 중인 뉴욕 변호사.", "[주15] 대괄호는 원문에 있는 것이다.", "[주15] 대괄호는 원문에 있는 것이다."], "note": "번역자 주 — 이 묶음의 결절점이다. 독일의 항복이 일본에 어떻게 닿았는가가 여기에 있다 — 후지무라는 「베른 신문」이라는 공개된 경로로 덜레스의 북이탈리아 독일군 항복 주선을 알게 되었고, 자기들에게도 같은 것이 가능한지를 묻고 있다.\n\n낱말 구분을 지켰다. 원문은 한 문장 안에 세 낱말을 나란히 쓴다 — 'the German capitulation in North Italy'(북이탈리아 독일군의 항복 = capitulation, 군대의 투항), 'before surrendering'(항복하기에 앞서 = surrender), 'terms short of unconditional surrender'(무조건 항복에 못 미치는 조건). 'capitulation'과 'surrender'를 모두 「항복」으로 옮겼으나 전자는 북이탈리아 독일군의 군사적 투항을, 후자는 일본의 항복을 가리킨다. 'peace feelers'는 「강화 타진」으로 따로 두었다. 'mediation(중재)'은 이 문서에 나오지 않는다.\n\n전언 층위: 「후지무라 → 독일계 소식통 → 베른 OSS 대표 → 벅스턴 → 국무장관」. 'reportedly'(전하는 바로는), 'According to source'(소식통에 따르면), 'insists'(주장한다), 'is considered to be'(…로 여겨진다), 'is reportedly in close touch'(…라고 전해진다), 'is understood to have advised'(…한 것으로 이해된다)를 모두 살렸다. 다만 「후지무라가 베른 신문 기사를 읽었다」와 「그가 조건을 알고 싶어 한다」는 전언 표지 없이 단정형으로 적혀 있다 — 원문 그대로 단정형으로 옮겼다.\n\n대괄호로 묶인 두 문단은 FRUS 편자가 아니라 원문 각서 자체에 대괄호로 들어 있는 신원 설명이다(각주 15가 그 사실을 밝힌다). 편집자 주가 아니라 본문의 일부이므로 대괄호째 본문에 두었다.\n\nNomura(노무라)·Oshima(오시마)는 원문에 성만 있고 한자가 없어 로마자를 병기했다. Nomura는 베를린 주재 해군무관 노무라 나오쿠니(野村直邦)로, Oshima는 주독 대사 오시마 히로시(大島浩)로 짐작되나 원문에 근거가 없으므로 단정하지 않았다.\n\n각주 15가 두 번 붙어 있는 것은 원문 TEI에서 같은 각주가 두 대괄호 문단에 각각 참조된 결과이며, 그대로 두 줄로 두었다.", "warn": false, "pages": ["486", "487"], "search": "G. Edward Buxton G. 에드워드 벅스턴 — 전략사무국(OSS) 국장대리, 이 각서의 작성자 Fujimura 후지무라 — 전 베를린 주재 일본 해군무관보, 유럽 주재 일본 해군 주요 대표의 한 사람 Allen Dulles 앨런 덜레스 — 유럽에서 OSS에 복무 중인 뉴욕 변호사 (각주 14). 북이탈리아 독일군 항복을 주선하였다 Nomura 노무라 — 베를린 주재 일본 해군무관(제독) Oshima 오시마 — 주독일 일본 대사"}, {"id": "d360", "order": 360, "date": "1945-07-13", "group": "B", "eyebrow": "d360 · Memorandum by the Acting Director of the Office of Strategic Services (Cheston) to the Secretary of State", "title": "전략사무국장대리(체스턴)가 국무장관에게 보낸 각서", "badge": null, "list_right": "문서 360", "meta": [{"k": "일자", "v": "1945-07-13"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 P.W./7–1345", "txt": true}, {"k": "발신", "v": "전략사무국(OSS) 국장대리 체스턴(Charles S. Cheston)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 360 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d360"}], "summary": "비스바덴의 앨런 덜레스에게서 받은 7월 12일·13일자 정보로, 스위스 주재 OSS 대표를 통하여 연합국 당국에 접근하려는 일본 측의 새로운 시도에 관한 것 — 국제결제은행 이사 기타무라 고지로가 스웨덴인 페르 야콥손에게 접근하여 미국 측과 즉시 접촉하기를 바라며, 일본이 항복에 관하여 고집할 유일한 조건은 일본 황실에 대한 얼마간의 배려일 것이라고 시사하였다.", "points": ["비스바덴의 앨런 덜레스에게서 받은 7월 12일자 및 13일자 정보로, 스위스 주재 OSS 대표를 통하여 연합국 당국에 접근하려는 일본 측의 새로운 시도에 관한 것이다.", "스웨덴 국적자이며 국제결제은행(BIS) 경제고문인 페르 야콥손(Per Jacobsson)에게 기타무라 고지로(Kojiro Kitamura)가 접근하였다. 기타무라는 그 은행의 이사이자 요코하마정금은행 대표이며 전 베를린 주재 재무관이다.", "기타무라는 야콥손에게 미국 측 대표와 즉시 접촉을 맺기를 간절히 바란다는 뜻을 시사하고, 항복에 관하여 일본이 고집할 유일한 조건은 일본 황실에 대한 얼마간의 배려일 것이라는 뜻을 내비쳤다.", "기타무라는 북이탈리아 독일군의 항복으로 이어진 OSS 활동을 완전히 꿰고 있음을 드러냈고, 카를 볼프 장군이 맺었던 것과 비슷한 접촉을 맺고 싶다고 밝혔다.", "야콥손에 따르면, 기타무라는 주스위스 일본 공사 가세 슌이치의 동의 아래 움직이고 있으며 전 베른 주재 일본 무관 오카모토 기요토미 소장과 함께 일하고 있다. [오카모토는 아마도 유럽 주재 일본 정보 조직의 책임자일 것이다.]", "기타무라는 스위스의 일본 측 집단이 도쿄와 직접 연락하고 있으며 확정적인 약속을 할 수 있는 위치에 있다고 주장한다.", "(바젤에서 야콥손과 이야기한 책임 있는 OSS 중간 연락원들은 기타무라의 접근이 도쿄의 훈령에 따른 것이라기보다 현지에서 시작된 것이라고 본다. 따라서 이 접근이 얼마나 진지한지 가늠하기 어렵다.)", "(베른 주재 OSS 대표의 보고로는, 야콥손이 이번 주말 바젤로 와 달라고 긴급히 요청하였다. OSS 대표는 이를 거절하고 7월 15일 일요일 베른에서 만날 수 있다고 답하였다. 그는 야콥손이 줄 수 있는 정보를 얻기 위해서만 만날 것이며 이 문제 전체를 최대한 조심스럽고 유보적으로 다룰 작정이다.)"], "primary": "워싱턴, 1945년 7월 13일.\n\n다음의 정보는 비스바덴의 앨런 덜레스 씨에게서 받은 7월 12일자 및 13일자의 것으로, 스위스 주재 OSS 대표를 통하여 연합국 당국에 접근하려는 일본 측의 새로운 시도에 관한 것이다.\n\n스웨덴 국적자이며 국제결제은행 경제고문인 페르 야콥손(Per Jacobsson)에게 기타무라 고지로(Kojiro Kitamura)가 접근하였다. 기타무라는 그 은행의 이사이며 요코하마정금은행의 대표이자 전 베를린 주재 재무관이다. 기타무라는 야콥손에게 미국 측 대표들과 즉시 접촉을 맺기를 간절히 바란다는 뜻을 시사하였고, 항복에 관하여 일본이 고집할 유일한 조건은 일본 황실에 대한 얼마간의 배려일 것이라는 뜻을 내비쳤다. 기타무라는 북이탈리아 독일군의 항복으로 이어진 OSS 활동을 완전히 꿰고 있음을 드러냈으며, 카를 볼프(Karl Wolff) 장군이 맺었던 것과 비슷한 접촉을 맺고 싶다고 밝혔다.\n\n야콥손에 따르면, 기타무라는 주스위스 일본 공사 가세 슌이치(Shunichi Kase)의 동의 아래 움직이고 있으며, 전 베른 주재 일본 무관 오카모토 기요토미(Kiyotomi Okamoto) 소장과 함께 일하고 있다. [오카모토는 아마도 유럽 [489면] 주재 일본 정보 조직의 책임자일 것이다.][주16] 기타무라는 스위스의 일본 측 집단이 도쿄와 직접 통신하고 있으며 확정적인 약속을 할 수 있는 위치에 있다고 주장한다.\n\n(바젤에서
