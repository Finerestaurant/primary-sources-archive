<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>미국의 대한정책 — 열람기</title>
<style>
:root{
  --bg:#eef1f4; --panel:#f7f9fa; --edge:#ccd4da; --edge-soft:#dde4e9;
  --ink:#16202a; --ink-2:#4a5b68; --ink-3:#71828f;
  --stamp:#8c2f39;            /* 기밀등급 도장의 자주색 */
  --link:#2f5d86;
  --a:#4a7c59; --b:#8a6d3b; --c:#3f6d8c; --d:#7a4a6b; --e:#5a6f7d; --x:#8a8f94;
  --term-line:#9db0c2; --term-bg:rgba(47,93,134,.05);
  --term-line-go:#7fa3c4; --term-bg-go:rgba(47,93,134,.10);
  --term-bg-on:rgba(47,93,134,.17);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",
         -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
    --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
    --stamp:#c9707a; --link:#7fb0da;
    --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
    --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
    --term-bg-on:rgba(127,176,218,.22);
    --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
  }
}
:root[data-theme="dark"]{
  --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
  --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
  --stamp:#c9707a; --link:#7fb0da;
  --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
  --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
  --term-bg-on:rgba(127,176,218,.22);
  --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--link)}

.wrap{display:grid;grid-template-columns:minmax(300px,25%) 1fr;height:100vh}

/* 좁은 화면 — 목록을 위로 접어 올리면 본문이 설 자리가 없다.
   목록은 서랍으로 빼고 화면 전부를 문서에 준다. */
.mbar{display:none}
.scrim{display:none}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;grid-template-rows:1fr;padding-top:44px}
  .mbar{display:flex;align-items:center;gap:10px;
    position:fixed;top:0;left:0;right:0;height:44px;z-index:30;padding:0 12px;
    background:var(--panel);border-bottom:1px solid var(--edge)}
  .mbar button{background:var(--term-bg-go);border:1px solid var(--term-line-go);
    color:var(--link);border-radius:999px;padding:3px 11px;cursor:pointer;
    font:inherit;font-size:12px;font-family:var(--mono);white-space:nowrap}
  .mbar-t{font-size:12.5px;font-weight:650;color:var(--ink-2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail{position:fixed;top:0;bottom:0;left:0;z-index:40;
    width:min(88vw,340px);max-height:none;
    transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:0 0 30px rgba(0,0,0,.35)}
  body.railopen .rail{transform:none}
  .scrim{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45);border:0;padding:0}
  body.railopen .scrim{display:block}
  .toolbar{padding:7px 16px;gap:8px}
  .toolbar #themeBtn{display:none}
  .mbar-t{flex:1}
  .mbar-th{padding:3px 9px;font-size:13px}
  .seg button{padding:4px 9px;font-size:11.5px}
  .srcline{padding:10px 16px 0}
}
@media(prefers-reduced-motion:reduce){.rail{transition:none}}

/* ── 좌측 목록 ─────────────────────────────── */
.rail{border-right:1px solid var(--edge);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
.rail-head{padding:14px 14px 10px;border-bottom:1px solid var(--edge-soft);
  display:flex;flex-direction:column;gap:8px}
/* 문서철에 들어오면 나갈 길이 있어야 한다 */
.home{display:inline-flex;align-items:center;gap:5px;text-decoration:none;
  color:var(--link);font-size:11.5px;font-family:var(--mono);
  letter-spacing:.04em;width:fit-content;
  background:var(--term-bg-go);border:1px solid var(--term-line-go);
  border-radius:999px;padding:2px 10px 2px 8px}
.home:hover{background:var(--term-bg-on);border-color:var(--link)}
.home span{font-size:12px;line-height:1}
.brand{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font-weight:400;letter-spacing:0;text-transform:none;
  color:var(--ink-3);font-size:11.5px;margin-top:2px}
input[type=search]{width:100%;padding:7px 10px;border:1px solid var(--edge);
  border-radius:3px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
input[type=search]:focus,button:focus-visible,.item:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--edge);background:transparent;color:var(--ink-2);
  border-radius:999px;padding:2px 9px;font-size:11.5px;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sortbar{display:flex;gap:10px;font-size:11.5px;color:var(--ink-3);align-items:center}
.sortbar button{background:none;border:none;color:var(--ink-3);cursor:pointer;
  font:inherit;padding:0;border-bottom:1px solid transparent}
.sortbar button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.list{overflow-y:auto;flex:1;min-height:0}
.item{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--edge-soft);border-left:3px solid transparent;
  padding:9px 13px;cursor:pointer;font:inherit;color:inherit}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--bg);border-left-color:var(--ink)}
.item.tA{border-left-color:var(--a)} .item.tB{border-left-color:var(--b)}
.item.tC{border-left-color:var(--c)} .item.tD{border-left-color:var(--d)}
.item.tE{border-left-color:var(--e)} .item.tX{border-left-color:var(--x)}
.item-top{display:flex;justify-content:space-between;gap:8px;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.item-sum{font-size:12.5px;line-height:1.45;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 제목이 「국무장관이 주한대사에게」 꼴이라 무엇을 읽는 것인지 알 수 없다.
   요지 한 줄을 옅게 깔아 준다. 목록이 길어지지 않도록 두 줄에서 자른다. */
.item-hint{font-size:11.5px;line-height:1.4;margin-top:3px;color:var(--ink-3);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── 우측 본문 ─────────────────────────────── */
.main{overflow-y:auto;min-height:0}
.toolbar{position:sticky;top:0;z-index:5;background:var(--panel);
  border-bottom:1px solid var(--edge);padding:8px 26px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px}
.toolbar .grow{flex:1}
.seg{display:flex;border:1px solid var(--edge);border-radius:3px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 11px;cursor:pointer;
  font:inherit;font-size:12px;color:var(--ink-2);border-right:1px solid var(--edge)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.srcline{padding:10px 26px 0;font-size:11px;color:var(--ink-3);line-height:1.5}

/* ── 연대 바 ───────────────────────────────
   5년 반을 한 줄에 욱여넣으면 1945년 8월 열흘은 0.5% 밖에 안 된다. 그래서
   줄을 늘여 놓고 **띠 자체를 움직인다** — 지금 읽는 문서의 날짜가 늘 정중앙이다.
   문서를 옮기면 띠가 미끄러지고, 사건 이름은 겹치지 않게 위아래로 층을 나눈다. */
.chrono{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
  width:min(940px,calc(100vw - 48px));z-index:20;user-select:none;
  border:1px solid var(--edge);border-radius:8px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 20px rgba(0,0,0,.10);
  transition:box-shadow .2s ease}
.chrono:hover{box-shadow:0 6px 26px rgba(0,0,0,.18)}
/* 옅어지는 것은 **내용**이지 판이 아니다. 판까지 투명해지면 뒤의 본문이
   비쳐 들어와 글자가 서로를 밟는다. */
.chrono-track{opacity:.5;transition:opacity .2s ease}
.chrono:hover .chrono-track{opacity:1}

/* 띠가 지나가는 창. 손으로도 밀 수 있게 진짜 가로 스크롤을 쓴다 */
.chrono-vp{position:relative;overflow-x:auto;overflow-y:hidden;
  height:var(--chH,92px);border-radius:8px;cursor:grab;
  scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain}
.chrono-vp::-webkit-scrollbar{display:none}
.chrono-vp.drag{cursor:grabbing}
/* 안쪽 띠. 양옆 여백은 창의 절반 — 첫 문서도 마지막 문서도 가운데에 설 수 있게 */
.chrono-track{position:relative;height:100%;margin:0 var(--chPad,0px)}
/* 시간 축 — 층의 한가운데 */
.chrono-track::before{content:"";position:absolute;
  left:calc(0px - var(--chPad,0px));right:calc(0px - var(--chPad,0px));
  top:var(--axis,46px);height:1px;background:var(--edge)}

/* 연도 — 해가 바뀌는 자리에 선을 긋고, 그 선부터가 그 해다.
   이름표는 창 왼쪽에 들러붙는다. 1945년 한복판을 보고 있어도 「1945」가 남는다. */
.cy{position:absolute;top:0;bottom:0;
  border-left:1px solid color-mix(in srgb,var(--ink-3) 50%,transparent)}
.cy.alt{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.cy b{position:absolute;bottom:3px;font-family:var(--mono);font-size:11px;
  font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;
  line-height:1;letter-spacing:.06em;white-space:nowrap;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px}
/* 달·분기 눈금 — 해 안에서 어디쯤인지. 분기는 조금 길게 */
/* 1px 짜리 표는 좌표에 걸터앉혀야 한다. 왼쪽 모서리를 좌표에 맞추면 표가
   반 픽셀 오른쪽에 서서, 같은 날짜의 점과 어긋나 보인다. 아래 실·표도 같다. */
.cq{position:absolute;top:calc(var(--axis,46px) - 1.5px);width:1px;height:4px;
  margin-left:-.5px;background:var(--edge);opacity:.7}
.cq.q{top:calc(var(--axis,46px) - 2.5px);height:6px;opacity:1}
.cq[hidden]{display:none}

/* 배율 — 5년 반을 한눈에 볼 때와 8월 열흘을 벌려 볼 때가 같을 수 없다 */
.chrono-zoom{position:absolute;right:6px;top:5px;z-index:3;display:flex;gap:3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-zoom,.chrono-zoom:focus-within{opacity:1}
.chrono-zoom button{width:19px;height:19px;padding:0;line-height:1;
  font-family:var(--mono);font-size:12px;color:var(--ink-2);cursor:pointer;
  background:var(--panel);border:1px solid var(--edge);border-radius:3px}
.chrono-zoom button:hover:not(:disabled){color:var(--link);border-color:var(--link)}
.chrono-zoom button:disabled{opacity:.35;cursor:default}
.chrono-scale{position:absolute;right:6px;bottom:3px;z-index:3;
  font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.03em;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-scale{opacity:1}

/* 사건 점 — 이름에서 내려오는 실보다 위다. 실이 점 위를 지나가면
   점이 실에 꿰뚫린 것처럼 보이고, 어느 것이 사건 자리인지 흐려진다. */
.cm{position:absolute;top:calc(var(--axis,46px) - 3px);width:7px;height:7px;
  margin-left:-3.5px;border-radius:50%;background:var(--ink-3);z-index:2;
  border:1.5px solid var(--panel);cursor:help;
  transition:background .15s ease,transform .15s ease}
.cm.key{background:var(--stamp);width:9px;height:9px;margin-left:-4.5px;
  top:calc(var(--axis,46px) - 4px)}
.cm:hover{background:var(--link);transform:scale(1.45)}

/* 사건 이름 — 층(lane)을 나눠 위아래로 흩는다. 여기서 겹침이 풀린다 */
.cl{position:absolute;transform:translateX(-50%);white-space:nowrap;z-index:1;
  font-family:var(--mono);font-size:10px;line-height:1.1;color:var(--ink-2);
  letter-spacing:.01em;padding:1px 4px;border-radius:2px;cursor:help;
  background:color-mix(in srgb,var(--panel) 70%,transparent)}
.cl.key{color:var(--stamp)}
.cl:hover,.cl:focus-visible{color:var(--link);outline:0;
  background:color-mix(in srgb,var(--link) 12%,var(--panel))}
/* 이름에서 축까지 내려/올려 긋는 실 — 어느 점의 이름인지 알아보게 */
.cl::after{content:"";position:absolute;left:calc(50% - .5px);width:1px;
  background:var(--edge)}
.cl.up::after{top:100%;height:var(--leg,0px)}
.cl.dn::after{bottom:100%;height:var(--leg,0px)}

/* 지금 읽는 문서가 놓인 자리. 문서를 고르면 이 표가 창 한가운데로 온다.
   손으로 띠를 밀면 표는 제 날짜에 남는다 — 표는 시간에 박혀 있지 창에 박혀 있지 않다. */
.chrono-cursor{position:absolute;top:0;bottom:0;width:1px;z-index:3;
  margin-left:-.5px;background:var(--stamp);pointer-events:none}
/* 가상 요소는 위의 *{box-sizing:border-box}가 닿지 않는다 — 여기서 직접 잡아 주지
   않으면 테두리 2px 만큼 표시가 축 아래·오른쪽으로 밀려 앉는다. */
.chrono-cursor::before{content:"";position:absolute;box-sizing:border-box;
  left:-6px;top:calc(var(--axis,46px) - 6px);width:13px;height:13px;
  border-radius:50%;background:var(--stamp);border:2px solid var(--panel)}
/* 날짜는 맨 아래, 표 바로 밑에 — 위쪽은 사건 이름 층에 내준다 */
.chrono-date{position:absolute;bottom:2px;transform:translateX(-50%);
  font-family:var(--mono);font-size:10px;color:var(--stamp);
  font-variant-numeric:tabular-nums;background:var(--panel);
  padding:0 5px;border-radius:2px;white-space:nowrap;z-index:3}
.chrono[data-nodate="1"] .chrono-cursor,
.chrono[data-nodate="1"] .chrono-date{display:none}

/* 좁은 화면에서도 연대 바는 남긴다 — 이 화면의 절반은 「언제인가」이다.
   폭을 화면 끝까지 늘리고, 손가락으로 미는 것이 이미 되므로 줌 단추는 접는다. */
@media(max-width:900px){
  .chrono{bottom:8px;width:calc(100vw - 16px);border-radius:6px}
  .chrono-zoom{display:none}
  .chrono-track{opacity:1}
}
@media(prefers-reduced-motion:reduce){.chrono-track{transition:none}}

/* 아래쪽 여백은 떠 있는 연대 바가 마지막 문단을 덮지 않을 만큼 */
article{max-width:none;padding:26px 26px 190px}
@media(max-width:900px){article{padding:18px 16px 170px}}

/* ── 앞뒤로 넘기기 ─────────────────────────────
   목록을 다시 열지 않고도 이어 읽을 수 있어야 한다. */
.steps{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;
  margin-top:34px;padding-top:18px;border-top:1px solid var(--edge)}
.step{display:flex;flex-direction:column;gap:2px;text-align:left;
  border:1px solid var(--edge);border-radius:5px;background:transparent;
  padding:9px 12px;cursor:pointer;font:inherit;color:var(--ink-2);min-width:0}
.step.next{text-align:right;align-items:flex-end}
.step:hover{border-color:var(--link);color:var(--ink);background:var(--term-bg)}
.step-k{font-family:var(--mono);font-size:11px;color:var(--link);letter-spacing:.04em}
.step-d{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.step-t{font-size:13px;line-height:1.4;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.step.empty{display:flex;align-items:center;justify-content:center;border-style:dashed;
  color:var(--ink-3);font-size:12px;font-family:var(--mono);cursor:default}
.steps .step-n{align-self:center;font-family:var(--mono);font-size:11.5px;
  color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}

@media(max-width:900px){
  .steps{grid-template-columns:1fr;gap:8px}
  .steps .step-n{order:-1;text-align:center}
  .step.next{text-align:left;align-items:flex-start}
}
.doc-head{border-bottom:1px solid var(--edge);padding-bottom:14px;margin-bottom:18px}
h1{font-size:19px;margin:0 0 4px;line-height:1.35;text-wrap:balance;font-weight:650}
.docid{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  letter-spacing:.04em;font-variant-numeric:tabular-nums}
.stamp{display:inline-block;border:1.5px solid var(--stamp);color:var(--stamp);
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:1px 6px;
  border-radius:2px;transform:rotate(-1.2deg);margin-left:8px;vertical-align:2px}
.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:3px 20px;margin-top:10px;font-size:12.5px}
.meta div{display:flex;gap:7px}
/* 참석자 명단처럼 긴 값. 좁은 칸에 넣으면 한 글자씩 세로로 눌린다 */
.meta div.wide{grid-column:1/-1}
.meta b{color:var(--ink-3);font-weight:500;min-width:52px;font-size:11.5px}
.meta span{font-family:var(--mono);font-size:12px}
.meta span.txt{font-family:var(--sans);font-size:12.5px}

.points{margin:16px 0;padding:12px 16px;border-left:2px solid var(--edge);
  background:var(--panel);border-radius:0 3px 3px 0}
.points li{margin:3px 0}
.points ul{margin:0;padding-left:18px}

.cols{display:grid;gap:26px}
.cols.two{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.cols.two{grid-template-columns:1fr}}
.pane h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 8px;font-weight:600}
.body{white-space:pre-wrap;word-break:break-word}

/* 호버 카드 — 링크 위에 머물면 그 문서가 무엇인지 미리 보여 준다.
   열람기와 같은 토큰(--panel, --edge, --ink…)을 쓰므로 별도 팔레트가 없다.

@media (hover: none) { .hc { display: none } }

<script id="data" type="application/json">[{"id": "d756", "order": 756, "date": "1945-02-05", "group": "D", "eyebrow": "d756 · Memorandum of Conversation, by the Director of the Office of Far Eastern Affairs (Ballantine)", "title": "극동국장(밸런타인)이 작성한 대화비망록", "badge": "", "list_right": "문서 756", "meta": [{"k": "일자", "v": "1945-02-05"}, {"k": "발신", "v": "극동국장 밸런타인(Ballantine)", "txt": true}, {"k": "수신", "v": "", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "대화비망록"}, {"k": "원문출처", "v": "895.01/2–545", "txt": true}], "links": [{"k": "FRUS", "text": "문서 756 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d756"}], "summary": "장제스 총통 비서 사오위린이 국무부 극동국 관리들과 한국 독립운동 진영의 분열, 대한민국임시정부 승인 보류, 한인 무장 지원 문제를 비공식으로 논의한 기록.", "points": ["사오위린은 자유중국 내 한인 독립운동 지도자들 사이에 마찰과 시기가 있으며, 중국 정부는 이들 어느 단체와도 공식 관계가 없다고 말함.", "사오위린은 충칭의 지도자들에게 연합국의 승인을 기대하기 전에 내부 이견을 해소하고 실효적 조직을 만들라고 조언했고, 프랑스식 지하운동 조직을 제안함(비밀요원, 항공기 살포 전단, 일본군 복무 한인 병사의 무기 투기·탈영 유도).", "대한민국임시정부가 충칭의 포로 한인 병사 약 2,000명을 지하 공작원으로 훈련시키는 사업에 착수했다고 보고함.", "미·중 양국 정부 모두 당분간 임시정부 승인을 보류한다는 데 사오위린과 밸런타인이 인식을 같이함.", "무기대여법(lease-lend)에 의한 한인 부대 무장 가능성에 대해 밸런타인은 군 당국 소관이나 일본과 싸우려는 자에게 무기·장비를 공급하는 일은 가능해 보인다고 답함.", "밸런타인은 미국 내 한인 대변자 일부가 민족의 대의보다 개인·분파 이익과 개인 홍보에 관심이 크고 국무부를 자기 편으로 끌어들이려 한다며 상당한 신중함이 필요하다고 평가함.", "사오위린은 미국 내 한인 지도자들의 시기와 비협조가 중국 내보다 더 심하다고 보았고, 중국 내 독립운동과의 관계 수립과 단일 조직화를 권고하며 중·미 양국이 한국 독립 문제에서 협조하여 행동할 것이라고 알림."], "primary": "참석자:\n\n- 장제스(Chiang Kai-shek) 총통 수석비서 사오위린(Shao Yu-lin) 씨[주3]\n- 밸런타인(Ballentine) 씨\n- 터너(Turner) 씨[주4]\n\n사오 씨는 앞선 면담에서 더 상세히 검토하고 싶은 일련의 주제를 개괄한 바 있어, 그때 정한 약속에 따라 내방하였다. 이 논의는 어떠한 약속(commitment)도 함의하지 않는 개인 자격의 논의로 하기로 합의되어 있었다. 처음 논의된 주제는 한국 독립운동이었다. 사오 씨는 자유중국(Free China)에 한국 독립을 위해 활동해 온 한인들이 상당수 있어 온 지 얼마간 되었다고 말했다. 이들 집단의 지도자들 사이에는 다소의 마찰과 시기가 있어 왔다. 사오 씨는 물론 중국 정부는 이들 어느 집단과도 공식 관계를 갖고 있지 않으며, 자신도 중국 외교부의 관리로서는 한인들과 접촉이 없었다고 말했다. 그러나 장제스 비서실의 일원이 된 뒤에는 그들과 얼마간 교섭이 있었다.\n\n충칭(Chungking)의 한국 독립운동 지도자들과의 논의에서, 사오 씨는 그들에게 [1019면] 연합국(United Nations)으로부터 어떤 형태의 승인이라도 기대하기 전에 자기들끼리의 이견을 해소하고 어떤 종류든 실효적인 조직을 결성해야 한다고, 즉 그들은 어떤 의미에서 시험대에 올라 있으며 연합국으로부터 구체적 원조를 기대하기에 앞서 책임을 감당할 능력을 입증하는 것은 그들에게 달린 일이라고 조언했다고 말했다. 사오 씨는 이 지도자들에게 프랑스의 경우와 같은 방식으로 지하운동을 조직할 것을 제안했다고 말했다. 그것은 한국 인민을 분기시키고, 정세를 알리며, 저항의 방법을 가르치는 것이었다. 이와 관련하여 그는 비밀요원의 활용과 항공기에서 살포할 전단의 사용을 제안했다. 그는 또한 현재 일본에 복무 중인 한인 병사들에게 적절한 시점에 무기를 버리라고 알리거나, 연합국 쪽으로 탈영하도록 지시할 수 있을 것이라고 제안했다.\n\n사오 씨는 대한민국임시정부(Korean Provisional Government)가 이제 사오 씨의 제안에 따른 계획에 착수했으며, 무엇보다 충칭에 있는 약 2,000명에 달하는 포로가 된 한인 병사들을 상대로 지하 공작원 임무를 위한 훈련을 목표로 활동하고 있다고 진술했다.\n\n사오 씨는 대한민국임시정부에 대한 미국 정부의 태도가 중국 정부의 태도와 동일한 것, 즉 당분간 승인을 보류하는 것으로 이해하고 있다고 말했다. 밸런타인 씨는 그 이해가 맞다고 확인했다. 사오 씨는 밸런타인 씨의 의견으로는 대일 작전에 쓸 한인 부대의 무장을 위해 무기대여(lease-lend) 방식으로 군사 장비를 얻는 것이 가능하겠는지 물었다. 밸런타인 씨는 그것은 물론 군 당국이 결정할 사안이나, 일본군과 싸우겠다고 나서는 누구에게든 공급할 무기와 장비는 마련될 수 있을 것으로 보인다고 답했다. 사오 씨는 한국 관련 사안에 관해 중국 정부가 미국 정부와 연락을 취할 적절한 경로에 관하여 밸런타인 씨의 의견을 물었다. 밸런타인 씨는 자신의 의견으로는 그러한 연락은 우리 대사관을 통해 이루어져야 한다고 답했다.\n\n사오 씨는 이 나라(미국)에 있는 한국 독립운동 지도자들의 태도에 관해 물었다. 그는 한국 지도자들에 대한 자국 정부와 미국 정부의 태도의 주된 차이는, 중국 정부가 그러한 지도자들과 운동을 지도하는 데 더 적극적인 조치를 취한다는 점이라고 관찰했다고 말했다. 밸런타인 씨는 이 나라의 한인 대변자 일부는 한국의 민족적 대의를 진전시키는 것보다 자신의 개인적 이익과 자기가 속한 특정 집단의 이익을 도모하는 데 더 관심이 있어 보이고, 일부는 개인적 언론 노출을 몹시 선호하며, [1020면] 또 일부는 국무부가 자기들에게 유리한 입장을 공식화하도록 몰아가려는 듯하다고 말했다. 또한 이들은 개인적으로 야심이 크고 다소 무책임해 보이므로 상당한 신중을 기해 다룰 필요가 있다고 말했다.\n\n사오 씨는 이 나라에 도착한 뒤 한국 독립운동 지도자들과 접촉해 보니 중국에 있는 그 상대들 사이보다도 더 심한 시기와 협조 결여가 있음을 발견했다고 진술했다. 그는 그들에게 공동의 목표 앞에서 통일성이 결여되어 있다는 것은 곧 책임을 떠맡을 준비가 되어 있지 않음을 부각시킬 뿐이라고 지적했고, 어떤 종류의 승인이라도 얻으려면 하나의 책임 있는 조직으로 결합할 필요가 있다고 조언했다. 그는 그들에게 중국의 한국 독립운동과 어떤 형태로든 관계를 수립하라고 조언했으며, 한국 독립에 관한 모든 사안에서 중국 정부와 미국 정부가 협조하여 행동할 것이라고 알렸다.\n\nJ[oseph] W. B[allantine]", "secondary": "895.01/2–545\n\nMemorandum of Conversation, by the Director of the Office of Far Eastern Affairs (Ballantine)\n\n[Washington,] February 5, 1945.\n\nParticipants: Mr. Shao Yu-lin, Senior Secretary of Generalissimo Chiang Kai-shek[주3]\n\nMr. Ballentine\n\nMr. Turner[주4]\n\nMr. Shao called in pursuance of an arrangement made at a previous interview when he had outlined a range of topics he wished to explore in fuller detail. It had been agreed that the discussions were to be on a personal basis without implication of any commitment. The first topic discussed was the Korean Independence Movement. Mr. Shao said there have been for some time a number of Koreans in Free China who have been working for Korean independence. There has been some friction and jealousy between the leaders of these groups. Mr. Shao said that the Chinese Government had, of course, no official relations with any of these groups and that he as an official of the Chinese Foreign Office had no contact with the Koreans. However, after becoming a member of Chiang Kai-shek’s Secretariat he had had some dealings with them.\n\nIn discussions with the leaders of the Korean Independence Movement in Chungking, Mr. Shao said he had advised them that before [1019면] they could expect any form of recognition from the United Nations they would have to compose the differences among themselves and form some kind of effective organization; that they were in a sense on trial and that it was up to them to demonstrate their capacity for responsibility before they should expect concrete assistance from the United Nations. Mr. Shao said that he had suggested to these leaders that they organize an underground movement along the lines of that in France, which would stir up the people of Korea, inform them of developments, and instruct them in methods of resistance. In this connection he had suggested the use of secret agents and of pamphlets to be dropped from airplanes. He had suggested further that Korean troops now in the service of Japan could be told to drop their arms at the proper moment or instructed to desert to the side of the United Nations.\n\nMr. Shao stated that the Korean Provisional Government has now undertaken a program along the lines of Mr. Shao’s suggestions and that among other things they were working with captured Korean troops in Chungking who number about 2,000, with a view to training them for duties as underground agents.\n\nMr. Shao said that it was his understanding that the attitude of the American Government towards the Korean Provisional Government was the same as that of the Chinese Government, namely of withholding recognition for the present. Mr. Ballantine confirmed this understanding. Mr. Shao inquired whether, in Mr. Ballantine’s opinion, it would be possible to obtain military equipment on a lease-lend basis for the arming of Korean troops for use against Japan. Mr. Ballantine replied that this was of course a matter to be decided by the military authorities but that it seemed likely that arms and equipment could be found to supply anyone who would undertake to fight the Japanese. Mr. Shao asked Mr. Ballantine’s opinion in regard to the proper channel whereby the Chinese Government might communicate with the American Government in any matter relating to Korean matters. Mr. Ballantine replied that in his opinion such communication should be made through our Embassy.\n\nMr. Shao inquired in regard to the attitude of the Korean independence leaders in this country. He said that it was his observation that the principal difference in the attitude of his own Government and that of the American Government toward the Korean leaders was that the Chinese Government took more positive steps toward the guidance of such leaders and of the movement. Mr. Ballantine said that some of the Korean spokesmen in this country seemed to be more interested in furthering their personal interests and the interests of their particular group than in furthering the Korean national cause; that some had a great predilection for personal publicity; and that [1020면] some seemed to want to maneuver the Department into going on record in their favor; and that it was necessary to proceed with considerable caution in dealing with these men as they seemed to be personally ambitious and somewhat irresponsible.\n\nMr. Shao stated that upon his arrival in this country he had got in touch with leaders of the Korean Independence Movement and had discovered that there was even more jealousy and lack of cooperation between them than between their counterparts in China. He had pointed out to them that their lack of unity in the face of a common objective simply underscored their unpreparedness to assume responsibility, and had advised them of the necessity of combining into one responsible organization if they were to attain any kind of recognition. He had advised them to establish some form of relationship with the Korean Independence Movement in China, and had informed them that the Chinese and American Governments would act in concert in any matter concerning Korean independence.\n\nJ[oseph] W. B[allantine]", "notes": ["[주3] 중화민국 국민정부 주석.", "[주4] 극동국(FE)의 윌리엄 T. 터너(William T. Turner)."], "warn": false, "pages": [1018, 1019, 1020], "search": "Shao Yu-lin 사오위린(邵毓麟) Chiang Kai-shek 장제스 Joseph W. Ballantine 조지프 W. 밸런타인 William T. Turner 윌리엄 T. 터너"}, {"id": "d757", "order": 757, "date": "1945-02-17", "group": "D", "eyebrow": "d757 · Memorandum of Conversation, by the Director of the Office of Far Eastern Affairs (Ballantine)", "title": "극동국장(밸런타인)이 작성한 대화비망록", "badge": "", "list_right": "문서 757", "meta": [{"k": "일자", "v": "1945-02-17"}, {"k": "발신", "v": "극동국장 밸런타인(Ballantine)", "txt": true}, {"k": "수신", "v": "", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "대화비망록"}, {"k": "원문출처", "v": "895.01/2–1745", "txt": true}], "links": [{"k": "FRUS", "text": "문서 757 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d757"}], "summary": "중국대사관 및 중국 외교부 인사들이 국무부 극동국 관리들과 한국 문제 처리에 관해 비공식 의견을 교환하며 중국 측 4개 견해를 제시한 기록.", "points": ["회담은 중국 외교부 동아시아사장 양윈추(IPR 핫스프링스 회의 중국 대표)의 요청으로, 그의 충칭 귀임에 앞서 한국 문제 전반에 관한 견해를 교환하기 위해 열림.", "중국 측 견해 1: 한국 지하운동을 장려해야 한다.", "중국 측 견해 2: 재외 한인 각 집단을 통합·조정해야 하며, 특히 충칭의 대한민국임시정부 그룹을 법률상 정부가 아니라 중국 내 한국 저항운동의 핵심으로서 지원해야 한다.", "중국 측 견해 3: 어느 나라 군대가 한국에 들어가든 군정·민정은 중국·미국·영국 3국이, 그리고 소련이 대일전에 참전했다면 소련까지 포함해 공동으로 수행해야 한다(류제가 여러 차례 강조).", "중국 측 견해 4: 가능한 한 이른 시일에 초당파적 한국 정부를 수립해야 한다.", "극동국 관리들은 위 어느 항목에도 아무런 약속을 하지 않았으나, 디코버는 얄타 성명의 '해방된 국가들' 항목을 해방지역 공동행동에 관한 미국 측 사고의 지표로 언급함.", "밸런타인은 재외 한인에 대한 군사 장비 공급의 어려움을 설명하면서도 연합국 군 당국이 실행 가능하다고 보는 방식·범위에서 한인을 활용해야 한다는 중국 측 견해에 동조함.", "중국 측의 한국 문제 연구 보고서는 앞으로 몇 달간 나오지 않을 것으로 보임."], "primary": "참석자:\n\n중국 측 참석자: 중국대사관 참사관 류제(Liu Chieh); 상무참사관 리간(Kan Lee) 박사; 중국 외교부의 양윈추(Yang Yun-chu); 1등서기관 T. L. 추이(T. L. Tsui); 1등서기관 킹칭(King Ching).\n\n극동국(FE): 밸런타인 씨, 스탠턴 씨,[주5] 디코버 씨,[주6] 빈센트 씨,[주7] 윌리엄스 씨.[주8]\n\n이 회합은 중국 외교부 동아시아사장이자 최근 핫스프링스(Hot Springs)에서 열린 IPR[주9] 회의의 중국 대표 중 한 사람인 양윈추 씨의 요청으로, 연합국(United Nations)의 한국 처리에 관한 일반적 문제들 가운데 일부를 비공식으로 논의하기 위해 마련되었다. 류제 씨가 중국 측 대변자 역할을 하며 회합의 이유를 간략히 개괄했다. 그는 양 씨가 디코버 씨와 일련의 회합에서 한국에 관한 질문서 초안[주10]에 포함된 모든 문제를 논의해 왔고, 양 씨가 곧 충칭으로 떠나므로 이 주제에 관한 자신의 인상과 관찰을 마무리하기 위해 [1021면] 극동국 관리들과 한국에 관한 일반적 의견을 교환하기를 원한다고 진술했다.\n\n현재 한국 밖에 거주하는 한인의 수와 소재지, 이들 집단이 전쟁 수행에 기여할 수 있는 바의 성격과 범위, 그리고 전후 직후 시기에 이들이 지닐 잠재적 유용성에 관해 얼마간 일반적으로 논의한 뒤, 류 씨는 한국 문제에 관한 중국 측 견해를 다음과 같이 개괄했다.\n\n1. 한국의 지하운동은 장려되어야 한다.\n2. 해외의 서로 다른 모든 한인 집단을 조정하기 위한 노력이 이루어져야 한다. 이 대목에서, 그리고 논의 내내 중국 측은 충칭의 대한민국임시정부(Provisional Korean Government) 그룹이 장려되어야 할 주된 요소라는 점을 특히 강조했다. 중국 측이 이 그룹을 법률상(de jure) 정부가 아니라 중국 내 한국 저항운동의 핵심을 대표하는 존재로서 공식 지원하는 문제에 관하여 국무부로부터 어떤 격려라도 얻는다면 환영하리라는 것이 분명했다.\n3. 어느 나라 군대가 한국에 들어가든, 있을 수 있는 군정·민정 행정은 중국·미국·영국 3대국이, 그리고 소련이 대일전에 참전했다면 소련까지 포함하여 공동으로 수행해야 한다. 류 씨는 이 견해를 매우 강하게 주장하며 위 진술을 여러 차례 되풀이했다.\n4. 가능한 한 이른 시일에 초당파적(non-partisan) 한국 정부가 수립되어야 한다.\n\n위 진술 어느 것에 대해서도 극동국 관리 누구도 아무런 약속을 하지 않았다. 다만 디코버 씨는 해방 지역 일반에 대한 공동 행동과 관련한 우리 측 사고를 보여주는 것으로서 얄타 성명[주11]의 “해방된 국가들(liberated countries)” 항목을 지적했다. 밸런타인 씨는 재외 한인에게 군사 장비를 공급하는 데 따르는 어려움을 매우 신중하게 설명하면서도, 연합국 군 당국이 전쟁 수행에서 실행 가능하다고 판단하는 방식과 범위에서 한인을 활용해야 한다는 중국 측 견해에는 동의를 표했다.\n\n양 씨는 귀임에 앞서 한국에 관한 국무부의 견해를 좀 더 명확히 표명받아 자신과 동료들이 한국에 관한 다수의 문서를 준비하는 데 도움이 되기를 바랐다고 진술했다. 추이 씨는 자기들 문서를 작성하기 전에 “바람이 어느 쪽으로 부는지”를 확인하고 싶다고 진술했다. 밸런타인 씨는 중국 측 견해와 우리 측 견해가 그리 멀지 않다고 생각한다는 뜻을 내비쳤다. 그는 한국 문제에 관한 연구 문서의 준비를 진행하는 것의 중요성을 강조했는데, 이는 첫째로 중국·영국·미국 정부 관리들 사이에 “전문가 수준(expert level)”에서 견해를 교환하는 수단이자, 최종적으로는 정책 결정 관리들에게 권고안을 제공하는 수단이 된다는 것이었다. [1022면]\n\n중국 측이 한 언급들로 미루어, 한국 문제에 관한 그들의 문서는 앞으로 몇 달간은 나오지 않을 것으로 보인다.\n\nJ[oseph] W. B[allantine]", "secondary": "895.01/2–1745\n\nMemorandum of Conversation, by the Director of the Office of Far Eastern Affairs (Ballantine)\n\n[Washington,] February 17, 1945.\n\nParticipants: Chinese Present: Liu Chieh, Counselor, Chinese Embassy; Dr. Kan Lee, Commercial Counselor; Yang Yun-chu, of the Chinese Foreign Office; T. L. Tsui, First Secretary; King Ching, First Secretary.\n\nFE: Mr. Ballantine, Mr. Stanton,[주5] Mr. Dickover,[주6] Mr. Vincent,[주7] Mr. Williams.[주8]\n\nThis meeting was requested by Mr. Yang Yun-chu, Director of the East Asia Department of the Chinese Foreign Office and one of the Chinese delegates to the recent IPR[주9] Conference at Hot Springs, to discuss informally some of the general problems relating to the treatment of Korea by the United Nations. Mr. Liu Chieh acted as spokesman for the Chinese and briefly outlined the reasons for the meeting; stating that Mr. Yang had discussed with Mr. Dickover in a series of meetings all the questions included in the draft questionnaire on Korea,[주10] and as Mr. Yang was shortly leaving for Chungking he desired [1021면] an exchange of general views on Korea with officers of FE to round out his impressions and observations on this subject.\n\nAfter some general discussion of the number and location of Koreans now residing outside of Korea, the nature and scope of possible contributions these groups might make to the war effort and their potential usefulness in the immediate post-war period, Mr. Liu outlined the Chinese views on the Korean question as follows: 1.The Korean underground movement should be encouraged.2.Efforts should be made to coordinate all the different Korean groups overseas. Here and all through the discussions particular emphasis was placed by the Chinese on the Provisional Korean Government group in Chungking as being the principal element which should be encouraged. It was apparent that the Chinese would welcome any encouragement from the Department on the matter of official support of this group, not as a de jure government but as representing the heart of the Korean resistance movement in China.3.No matter which army enters Korea, the possible military civilian administration should be undertaken jointly by the three powers, China, the United States and Britain; and Soviet Bussia, if it has entered the war against Japan. Mr. Liu was very insistent on this view and repeated the above statement several times.4.At the earliest possible date there should be set up a non-partisan Korean Government.\n\nNo commitments whatever were given to any of the above statements by any of the officers of FE, although Mr. Dickover pointed to the “liberated countries” section of the Yalta statement[주11] as indicative of our thinking in regard to joint action in liberated areas generally. Mr. Ballantine very carefully explained the difficulties involved in supplying overseas Koreans with military equipment but expressed accord with the Chinese view that Koreans should be used hi whatever manner and to whatever extent the Allied military authorities might find practical in the war effort.\n\nMr. Yang stated that he had hoped to obtain a more definite expression of the Department’s views on Korea before his return to assist him and his colleagues in the preparation of the numerous papers on Korea. Mr. Tsui stated that they desired to ascertain “how the wind blows” before compiling their papers. Mr. Ballantine intimated that he did not think Chinese views and our views were very far apart. He emphasized the importance of proceeding with [1022면] the preparation of study papers on Korean problems as a means first of exchanging views between officers of the Chinese, British and American Governments at an “expert level” and finally of providing policy making officers with recommendations.\n\nFrom the comments made by the Chinese, it would seem that their papers on Korean questions will not be available for some months.\n\nJ[oseph] W. B[allantine]", "notes": ["[주5] 극동국 부국장 에드윈 F. 스탠턴(Edwin F. Stanton).", "[주6] 일본과장 얼 R. 디코버(Erle R. Dickover).", "[주7] 중국과장 존 카터 빈센트(John Carter Vincent).", "[주8] 일본과 부과장 프랭크 S. 윌리엄스(Frank S. Williams).", "[주9] 태평양문제연구회(Institute of Pacific Relations).", "[주10] 인쇄하지 않음. 다만 요약은 Foreign Relations, 1944, vol. v, p. 1297, 각주 18 참조.", "[주11] 1945년 2월 11일 루스벨트 대통령, 영국 처칠 총리, 소련 인민위원회의 의장 스탈린 원수가 발표한 것. 본문은 Foreign Relations, The Conferences at Malta and Yalta, 1945, pp. 968, 971 참조. 한국과 특히 관련되는 것으로는 군사점령과 잠정 신탁통치 수립 가능성 문제를 다룬 한국의 전후 지위에 관한 브리핑북 문서(pp. 358–361), 루스벨트 대통령과 스탈린 원수의 신탁통치 논의에 관한 2월 8일 회의록(p. 770), 그리고 한국에 관한 중·소 회담에 관한 2월 5일자 국무부 전보(p. 952)가 있다."], "warn": false, "pages": [1020, 1021, 1022], "search": "Liu Chieh 류제 Kan Lee 리간 Yang Yun-chu 양윈추 T. L. Tsui T. L. 추이 King Ching 킹칭 Joseph W. Ballantine 조지프 W. 밸런타인 Edwin F. Stanton 에드윈 F. 스탠턴 Erle R. Dickover 얼 R. 디코버 John Carter Vincent 존 카터 빈센트 Frank S. Williams 프랭크 S. 윌리엄스 Franklin D. Roosevelt 프랭클린 D. 루스벨트 (각주) Winston S. Churchill 윈스턴 S. 처칠 (각주) I. V. Stalin I. V. 스탈린 (각주)"}, {"id": "d758", "order": 758, "date": "1945-02-20", "group": "A", "eyebrow": "d758 · The Acting Secretary of State to the Ambassador in China (Hwley)", "title": "국무장관 대리가 주중대사(헐리)에게", "badge": "", "list_right": "문서 758", "meta": [{"k": "일자", "v": "1945-02-20"}, {"k": "발신", "v": "국무장관 대리(제임스 C. 던 대결)", "txt": true}, {"k": "수신", "v": "주중대사 헐리(Hurley)", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": "No. 52"}, {"k": "종류", "v": "훈령"}, {"k": "원문출처", "v": "895.01/2–2045", "txt": true}], "links": [{"k": "FRUS", "text": "문서 758 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d758"}], "summary": "이승만이 중국의 임시정부 승인 의사를 내세워 미국의 동조를 요청한 데 대해, 국무부는 승인 문제를 보류하고 전후 한국 질문서에 따른 기초 연구 준비에 노력을 집중한다는 방침을 주중대사관에 통보한 훈령.", "points": ["이승만이 '한국위원회 위원장' 명의 서한에서, 미국이 뒤따라 준다면 중국 정부가 임시정부 승인을 선도할 용의가 있으며 국무부의 묵시적 양해만 있으면 중국이 '대한민국'의 법률상 지위를 정식 승인할 것이라고 주장함.", "국무부는 2월 5일자 사오위린 대화비망록 사본을 대사관에 참고로 송부하며, 사오 씨와 국무부 관리들이 임시정부 승인 보류에 합의했음을 지적함.", "대사관은 재량으로 중국 외교부에 이승만 서한의 해당 대목 내용을 비공식으로 알리고, 승인 문제는 유보하며 전후 한국 질문서 초안에 관한 기초 자료 준비에 노력을 돌려야 한다는 국무부 의견을 확인해 줄 수 있음.", "담당 관리의 질병으로 지연이 있으나 국무부는 질문서에 기초한 연구 준비를 진행 중임을 중국 외교부에 알려도 좋음.", "이승만은 즉각 승인의 근거로 소련이 한국에 진출해 블라디보스토크에 있다는 '한국해방위원회'를 그곳 정부로 세울 우려를 들었으나, 국무부는 그러한 위원회의 존재를 확인하지 못했으며 대사관의 정보·논평을 요청함.", "본 훈령 사본은 모스크바·런던 주재 대사관에도 송부됨."], "primary": "귀하: 국무부는 이승만(Syngman Rhee) 박사[주12]가 보낸 서한을 접수했는바, “한국위원회 위원장(Chairman of the Korean Commission)” 명의의 그 서한에는 다음 문단이 포함되어 있습니다.\n\n> “6개월 전만 해도 이 문제에 아무런 관심을 보이지 않던 중국 정부가, 이제는 미국이 뒤따라 준다면 대한민국임시정부(Korean Provisional Government) 승인에 앞장설 용의가 있습니다. 저는 미국 정부가 한국의 승인에 관하여 중국과 자유로이 협조하기를 바랍니다. 중국 정부는 국무부와의 양해 없이는 움직이지 않을 것입니다. 만일 국무부가 중국에 협조하겠다는 묵시적 양해를 준다면, 중국은 대한민국(Republic of Korea)의 법률상(de jure) 지위를 정식으로 승인할 것입니다.”\n\n대사관의 참고를 위해 2월 5일자 각서[주13] 사본을 동봉합니다. 이는 장제스(Chiang Kai-shek) 총통의 수석비서 사오위린(Shao Yu-lin) 씨와 국무부 관리들 사이에 개인 자격으로 이루어진 한국 문제에 관한 대화를 요약한 것입니다. 대사관은 사오 씨와 국무부 관리들이 “대한민국임시정부”의 승인을 당분간 보류해야 한다는 데 의견이 일치했음을 유의하기 바랍니다. 대사관은 재량에 따라 적절한 기회를 찾아 이승만 서한에서 인용한 문단의 내용을 외교부에 비공식으로 알리고, 그렇게 하면서 사오 씨와의 대화를 언급하며, 국무부의 의견으로는 승인 문제는 유보해 두어야 하고 노력은 전후 한국에 관한 질문서 초안과 관련된 기초 자료의 준비에 돌려져야 한다는 점을 확인해 줄 수 있습니다. 대사관은 또한, 이 작업에 직접 관여하는 한 관리의 질병으로 다소 지연이 생기고 있으나 국무부는 [1023면] 그 질문서에 기초한 연구의 준비를 진행하고 있음을 외교부에 알리고자 할 수도 있습니다.[주14]\n\n이승만은 그 서한에서 “대한민국임시정부”의 즉각적 승인의 이유로, 소련이 한국으로 진출하여 블라디보스토크(Vladivostok)에 존재한다고 하는 “한국해방위원회(Korean Liberation Committee)”를 그곳의 정부로 수립할지 모른다는 우려를 내세우고 있습니다.[주15] 국무부는 소련 영토 내에 그러한 위원회가 존재한다는 보고를 확인하지 못했으며, 이 주제에 관하여 대사관이 가진 어떠한 논평이나 정보라도 있으면 감사하겠습니다.\n\n본 훈령의 사본은 모스크바 및 런던 주재 대사관으로 송부됩니다.[주16]\n\n경구,\n\n국무장관 대리를 대신하여:\n\n제임스 C. 던(James C. Dunn)[주17]", "secondary": "895.01/2–2045\n\nThe Acting Secretary of State to the Ambassador in China (Hwley)\n\nNo. 52\n\nWashington, February 20, 1945.\n\nSir: The Department has received a letter from Dr. Syngman Rhee,[주12] “Chairman of the Korean Commission”, in which is included the following paragraph:\n\n“The Chinese government which showed no anxiety in this respect six months ago, is now willing to take the lead in recognizing the Korean Provisional Government provided the United States would follow suit. I hope the United States Government would feel free to cooperate with China regarding the recognition of Korea. The Chinese Government would not move without an understanding with the State Department. If the State Department gives China a tacit understanding that it will cooperate, China will formally recognize the de jure status of the Republic of Korea.”\n\nThere is enclosed for the Embassy’s information a copy of a memorandum dated February 5[주13] summarizing a conversation regarding Korean problems held on a personal basis between Mr. Shao Yu-lin, Senior Secretary of Generalissimo Chiang Kai-shek, and officers of the Department. The Embassy will note that Mr. Shao and the officers of the Department were agreed that recognition of the “Korean Provisional Government” should be withheld for the present. The Embassy may in its discretion seek a suitable opportunity to indicate informally to the Foreign Office the content of the paragraph quoted from Rhee’s letter and in so doing refer to the conversation with Mr. Shao and affirm that in the opinion of the Department the question of recognition should be left in abeyance and efforts should be directed toward the preparation of basic material relating to the draft questionnaire on post-war Korea. The Embassy may also wish to inform the Foreign Office that, while the illness of an officer directly concerned with the work is causing some delay, the Department is [1023면] proceeding with the preparation of studies based on the questionnaire.[주14]\n\nRhee in his letter advances as a reason for immediate recognition of the “Korean Provisional Government” the fear that Soviet Russia might advance into Korea and establish as the government there a “Korean Liberation Committee” allegedly existing in Vladivostok.[주15] The Department has been unable to obtain confirmation of reports of the existence of such a committee in Soviet territory and would appreciate any comment or information the Embassy may have on the subject.\n\nCopies of this instruction are being sent to the Embassies at Moscow and at London.[주16]\n\nVery truly yours,\n\nFor the Acting Secretary of State: \n\n\nJames C. Dunn\n\n[주17]", "notes": ["[주12] 2월 5일자, 국무차관 앞. 인쇄하지 않음.", "[주13] 앞의 p. 1018.", "[주14] 한국 문제에 관한 여러 연구 문서가 1944년과 1945년에 극동지역부처간위원회(Inter-Divisional Area Committee on the Far East), 극동국, 그리고 일본과·영토연구과·국제안보기구과에 의해 작성되었다. 여기에는 다음이 포함된다: 1944년 3월부터 5월 사이에 작성된 “PWC” 문서 124a, 125, 126; 1944년 11월과 12월에 작성된 “H” 문서 200–207 및 209; 1945년 3월부터 11월 사이에 작성된 “K” 문서 1–16 (Records of the Committee Secretariat Branch of the Executive Secretariat, Lot 52–D478). 이 문서들은 한국의 정치·경제·안보 문제 여러 측면과 한국의 독립 능력에 관한 광범위한 주제를 다룬다. “PWC” 문서 124a, 125, 126은 각각 Foreign Relations, 1944, vol. v, pp. 1239, 1224, 1228 참조.", "[주15] 이승만 씨의 서한은 다음과 같이 진술했다: “1941년 12월 7일 이래 우리는 국무부 당국과 더불어, 러시아가 시베리아에 유지하고 있는 한인 공산군이 적절한 시기에 한국으로 밀고 들어와, 망명 중인 한국 민족주의 민주정부가 한국으로 돌아갈 기회를 얻기도 전에 반도 전체를 석권할 위험의 거듭되고 명백한 징후를 지켜보아 왔습니다. 그렇게 되면 인민은 자기들이 살고자 하는 정부 형태에 관해 의사를 표명할 기회를 갖지 못할 것입니다. 이는 당연히 한국뿐 아니라 미국과 중국에도 해로운 상황을 만들어낼 것입니다.” 밸런타인 씨가 이니셜을 남긴 2월 12일자 각서에서 일본과는 이승만의 서한에 답신하지 말 것을 권고했는데, 그 이유는 “(1) 소련의 배신을 함의하는 이승만의 주장에 이의를 제기함으로써 바람직하지 않은 논쟁을 무릅쓰거나, (2) 그 함의를 무시함으로써 그것을 묵인하는 것이 되거나, 둘 중 하나가 되지 않고서는 답신이 불가능하기 때문”이었다. (895.01/2–545) 6월 5일 그루(Grew) 씨 앞으로 보낸 후속 서한에서 이승만 씨는 “대한민국임시정부 승인을 더 지체하는 것은 한국뿐 아니라 미국까지도 불리한 처지에 놓이게 할 것입니다. … 미국과 소비에트 공화국들 사이의 궁극적 충돌을 피할 유일한 가능성은 지금 가능한 모든 곳에서 공산주의적이 아닌 모든 민주적 요소를 육성하는 것입니다.”라고 진술했다. 이 서한에는 “GM”이 남긴 6월 14일자 난외 기입이 있는데, 아마도 일본과의 조지 M. 매큔(George M. McCune)일 것이며 내용은 다음과 같다: “내용의 성격상 극동국과 협의한 뒤 접수 회신을 하지 않음.” (895.01/6–545)", "[주16] 각각 2월 20일자 훈령 451호 및 5125호로.", "[주17] 국무차관보."], "warn": false, "pages": [1022, 1023], "search": "Syngman Rhee 이승만 Patrick J. Hurley 패트릭 J. 헐리 (수신자, 원문 표기 Hwley) James C. Dunn 제임스 C. 던 Shao Yu-lin 사오위린 Chiang Kai-shek 장제스 Joseph W. Ballantine 조지프 W. 밸런타인 (각주) Joseph C. Grew 조지프 C. 그루 (각주) George M. McCune 조지 M. 매큔 (각주)"}, {"id": "d759", "order": 759, "date": "1945-03-01", "group": "B", "eyebrow": "d759 · The Chargé in China (Atcheson) to the Secretary of State", "title": "주중 대사대리(애치슨)가 국무장관에게", "badge": "", "list_right": "문서 759", "meta": [{"k": "일자", "v": "1945-03-01"}, {"k": "발신", "v": "주중 대사대리 애치슨(Atcheson)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "장소", "v": "Chungking"}, {"k": "전문번호", "v": "329"}, {"k": "종류", "v": "전보"}, {"k": "원문출처", "v": "895.01/3–145: Telegram", "txt": true}], "links": [{"k": "FRUS", "text": "문서 759 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d759"}], "summary": "대한민국임시정부 '외무부장' 조소앙이 충칭 주재 미국대사관을 방문해 미국의 적극적 지원을 요청하며 군사훈련·무기대여·첩보·전단 살포 등 4개 협력안과 샌프란시스코 회의 참가, 자신의 방미 사증을 요청했다는 보고.", "points": ["1945년 2월 23일 조소앙이 약속에 따라 대사관을 방문해 길고 산만한 진술로 미국의 적극적 지원을 요청함.", "조소앙은 한국이 기아 직전이고 거의 전면적인 징병으로 일본 통치에 대한 증오가 격화되어 행동할 때가 무르익었으며, 자기 정부가 한국 인민을 대표하는 가장 강하고 잘 조직된 집단이므로 미국이 자기 정부하고만 직접 상대하는 것이 좋겠다고 주장.", "제안한 협력 방식: (1) 태평양의 한 섬에, 이어 북중국 연안 어딘가에 한인 부대 훈련기지 설치, (2) 임시정부와의 무기대여협정 같은 방식의 군수·재정 지원, (3) 첩보 목적의 한인 요원 활용, (4) 임시정부가 작성한 선전 전단을 미군기가 한국 상공에 살포.", "임시정부가 미국에 대기 중인 대표를 샌프란시스코 유엔 안보회의에 파견하도록 초청해 줄 것을 요청함.", "조소앙 본인이 가까운 시일에 방미를 희망하며 사증 발급을 신속히 해 줄 예비 조치를 요청함. 대사관은 대화 내용을 워싱턴에 보고하겠다고만 답함.", "언론 발표에 따르면 대한민국임시정부는 2월 28일 독일에 선전포고함.", "애치슨은 조소앙 사증 문제에 관해 전신으로 훈령해 줄 것을 요청함."], "primary": "329. 2월 23일, “대한민국임시정부 외무부장(Minister for Foreign Affairs of the Korean Provisional Government)” 조소앙(Tjo So-wang) 씨가 약속에 따라 대사관을 방문하여 자기 그룹에 대한 미국의 적극적 지원을 얻고자 하면서 길고 산만한 진술을 하였음.\n\n그는 한국이 기아의 문턱에 있고, 거의 전면적인 징병으로 일본 통치에 대한 증오가 격화되었으며, 행동할 시기가 무르익었다고 말함. 그는 자기 정부가 한국 인민을 대표하는 가장 강력하고 가장 잘 조직된 집단이므로 미국이 오로지 자기 정부하고만 직접 상대하는 것이 좋을 것이라고 진술함. 구체적으로 그는 자기 정부와 미국 사이의 다음과 같은 유형의 협력을 제안함: (1) 한인 부대를 태평양의 한 섬에 있는 기지에서, 그리고 이후에는 북중국 연안 어딘가에서 훈련할 것, (2) 임시정부와의 무기대여협정과 같은 어떤 방식으로 미국이 군수 물자와 재정 원조를 제공할 것, (3) 첩보 목적으로 한인 요원을 활용할 것, (4) 미국 항공기가 한국 상공에 살포할 선전 전단을 임시정부가 작성할 것. 그는 현재 미국에 대기 중인 임시정부 대표들이 샌프란시스코의 연합국 안전보장회의(United Nations Security Conference)에 파견되도록 임시정부가 초청받게 해 달라고 요청함.[주18]\n\n그는 또한 가까운 시일 내에 개인적으로 미국을 방문하고 싶다고 말하며, 사증 발급을 신속히 하기 위한 예비 조치를 취해 줄 것을 요청함.\n\n대사관은 조 씨에게 그 대화의 요지를 워싱턴에 보고하겠다고 알렸음.\n\n언론 발표에 따르면 대한민국임시정부는 2월 28일 독일에 선전포고하였음.\n\n조 씨의 사증 문제에 관하여 전신으로 훈령하기 바람.\n\n공한(despatch)이 뒤따름.[주19]\n\n애치슨(Atcheson)", "secondary": "895.01/3–145: Telegram\n\nThe Chargé in China (Atcheson) to the Secretary of State\n\nChungking, March 1, 1945—8 a.m. \n [Received 3:46 p.m.]\n\n329. On February 23, Mr. Tjo So-wang, “Minister for Foreign Affairs of the Korean Provisional Government” called at Embassy by appointment to enlist active support of US for his group and made long, rambling statement.\n\nHe said Korea was on verge of starvation, that hatred of Japanese rule was intensified by almost universal conscription and that time was ripe for action. He stated that as his government was strongest and best organized group representing Korean people it would be well for the US to deal solely and directly with his government. Specifically, he proposed the following type of cooperation between his government and the US: (1) Korean armies to be trained at a base on one of the Pacific islands and later somewhere along north China coast, (2) military supplies and financial assistance to be made available by US under some such arrangement as a lend-lease agreement with Provisional Government, (3) Korean agents to be utilized for intelligence purposes and (4) propaganda leaflets to be prepared by Provisional Government for distribution by American planes over Korea. He asked that Provisional Government be invited to send representatives, now available in the US, to United Nations Security Conference in San Francisco.[주18]\n\nHe also said he wished personally to visit US in near future and asked that preliminary steps be taken to expedite issuance of a visa.\n\nEmbassy informed Mr. Tjo that substance of his conversation would be reported to Washington.\n\nAccording to press statement Korean Provisional Government declared war on Germany February 28.\n\nPlease instruct by telegraph in regard to question of visa for Tjo. Despatch follows.[주19]\n\nAtcheson", "notes": ["[주18] 국제기구에 관한 연합국 회의(United Nations Conference on International Organization)는 1945년 4월 25일부터 6월 26일까지 열렸다.", "[주19] 3월 3일자 공한 194호. 인쇄하지 않음."], "warn": false, "pages": [1023], "search": "George Atcheson, Jr. 애치슨 (주중 대사대리) Tjo So-wang 조소앙"}, {"id": "d760", "order": 760, "date": "1945-03-20", "group": "B", "eyebrow": "d760 · The Acting Secretary of State to the Ambassador in China (Hurley)", "title": "국무장관 대리가 주중대사(헐리)에게", "badge": "", "list_right": "문서 760", "meta": [{"k": "일자", "v": "1945-03-20"}, {"k": "발신", "v": "국무장관 대리 그루(Grew)", "txt": true}, {"k": "수신", "v": "주중대사 헐리(Hurley)", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": "473"}, {"k": "종류", "v": "전보"}, {"k": "원문출처", "v": "895.01/3–145: Telegram", "txt": true}], "links": [{"k": "FRUS", "text": "문서 760 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d760"}], "summary": "조소앙의 요청에 대해 한인 활용 문제는 전구 사령관 소관이고 샌프란시스코 회의 초청은 불가하다고 통보하도록 지시하면서, 그의 방미 사증은 임시정부 관리가 아닌 개인 자격으로만 발급할 수 있다고 한 회신 전보.", "points": ["3월 1일자 귀 대사관 전보 329호에 대한 회신.", "대일 전쟁 수행에 한인을 활용하는 문제는 군 당국이 검토할 사안이므로, 중국 내 한인의 전쟁 참여에 관한 제안은 해당 전구 사령관과 협의하는 것이 적절하다고 조소앙에게 알릴 것.", "주최 열강 간 합의로 샌프란시스코 회의 초청은 1945년 3월 1일 시점에 연합국(United Nations)이던 나라들에만 발송되었으며, 다른 나라의 옵서버 참가는 예정되어 있지 않음.", "대사관에 대한 비밀 정보: 국무부는 조소앙의 방미가 어떤 유익한 목적에 기여할지 분명치 않다고 봄.", "다만 신청인 및 재량에 따라 중국 외교부와 상황을 검토한 결과 방문이 전쟁 수행에 상당히 기여하리라 판단되면, '대한민국임시정부' 관리가 아니라 개인 자격의 한국인으로서 사증을 발급할 수 있음."], "primary": "473. 3월 1일 오전 8시자 귀 전보 329호에 관하여. 조소앙(Tjo Sowang)에게 다음과 같이 알려도 좋음. [1025면]\n\n(1) 대일 전쟁 수행에 한인을 활용하는 문제는 군 당국이 검토할 사안이며, 중국 내 한인의 전쟁 수행 참여에 관하여 그가 제기하고자 하는 어떠한 제안도 해당 전구 사령관과 협의하는 것이 적절할 것이라는 점.\n\n(2) 주최 열강 간의 합의에 따라 샌프란시스코 회의(San Francisco Conference)에 대한 초청은 1945년 3월 1일 시점에 연합국(United Nations)이었던 나라들에만 발송되었다는 점. 다른 나라들로부터의 옵서버에 대해서는 아무런 조치가 마련되어 있지 않음.[주20]\n\n귀하에 대한 비밀 정보로서: 조소앙이 제안한 방미가 어떤 유익한 목적에 기여할 것인지 국무부로서는 분명하지 않음. 다만 신청인과, 그리고 귀하의 재량에 따라 중국 외교부와 상황을 검토해 본 결과 그 방문이 전쟁 수행에 어떤 상당한 방식으로 기여하리라고 보인다면, 귀하는 그에게 “대한민국임시정부(Korean Provisional Government)”의 관리로서가 아니라 개인 자격의 한국인으로서 3(2)종 사증을 발급해도 좋음.\n\n그루(Grew)", "secondary": "895.01/3–145: Telegram\n\nThe Acting Secretary of State to the Ambassador in China (Hurley)\n\nWashington, March 20, 1945—7 p.m.\n\n473. Reurtel 329, March 1, 8:00 a.m. You may inform Tjo Sowang as follows: [1025면] (1)That the matter of the utilization of Koreans in the war effort against Japan is one for consideration by the military authorities and that any proposals which he may wish to bring forward for participation in the war effort by Koreans in China might appropriately be taken up by him with the commander of that theatre.(2)That by agreement among the sponsoring powers invitations to the San Francisco Conference were extended only to those nations which were United Nations on March 1, 1945. Provision is not being made for observers from other nations.[주20]\n\nFor your confidential information: It is not clear to the Department what useful purpose would be served by the proposed visit of Tjo So-wang to this country. If, however, after exploring the situation with the applicant and, in your discretion, with the Chinese Foreign Office, it appears that the visit would contribute in some appreciable way to the war effort, you may issue him a three (two) visa as a private Korean citizen and not as an official of the “Korean Provisional Government”.\n\nGrew", "notes": ["[주20] 1945년 3월 28일자 서한에서 국무장관은 다가오는 샌프란시스코 연합국 회의에 한국의 참가를 요청한 이승만(Syngman Rhee) 박사의 3월 8일자 서한에 회신하였다. 그 회신은 이 문단에 제시된 이유로 국무부가 그 요청을 호의적으로 고려할 처지에 있지 않다고 진술했다. (500.CC/3–845)"], "warn": true, "pages": [1023, 1024, 1025], "search": "Joseph C. Grew 조지프 C. 그루 Patrick J. Hurley 패트릭 J. 헐리 Tjo So-wang 조소앙 Syngman Rhee 이승만 (각주)"}, {"id": "d761", "order": 761, "date": "1945-04-09", "group": "B", "eyebrow": "d761 · The Chargé in China (Atcheson) to the Secretary of State", "title": "주중 대사대리(애치슨)가 국무장관에게", "badge": "", "list_right": "문서 761", "meta": [{"k": "일자", "v": "1945-04-09"}, {"k": "발신", "v": "주중 대사대리 애치슨(Atcheson)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "장소", "v": "Chungking"}, {"k": "전문번호", "v": "596"}, {"k": "종류", "v": "전보"}, {"k": "원문출처", "v": "895.01/4–945: Telegram", "txt": true}], "links": [{"k": "FRUS", "text": "문서 761 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d761"}], "summary": "프랑스 대사가 자국 정부 훈령에 따라 대한민국임시정부와 비공식적 사실상(de facto) 관계를 유지한다고 조소앙에게 통보했음을 알려 왔다는 보고.", "points": ["프랑스 대사 페치코프 장군이 외교부에 보냈다는 성명서 사본을 애치슨에게 전달함.", "그 내용은 2월 26일 조소앙에게, 대한민국 '임시정부'와 비공식적으로 사실상(de facto) 관계를 유지하라는 프랑스 정부의 대사관 앞 훈령을 알렸다는 것.", "또한 한국 해방 노력에 대한 프랑스의 동정적 관심과 한국이 신속히 독립을 회복해야 한다는 프랑스 정부의 결의를 조소앙에게 알렸다고 함.", "페치코프는 추가 설명에서 사실상 관계를 갖는 것은 프랑스 정부가 아니라 자기 대사관이라고 밝힘.", "페치코프 개인으로서는 4월 2일자 대사관 전보 560호(둘째 문단 둘째 문장)에 적힌 이유로 이 한인 집단에 승인을 부여해서는 안 된다고 본다. 충칭의 그룹이나 한국 밖 어느 그룹도 오랫동안 한국에 있지 않아 한국 인민을 실제로 대표하지 못한다는 이유다."], "primary": "596. 프랑스 대사[주21]가 자신이 외교부에 보냈다고 하는 성명서 사본을 본인에게 전달하였음. 그 내용은, 그가 2월 26일 조소앙(Tjo So-wang)에게 대한민국 “임시정부(Provisional Government)”와 비공식적으로 사실상(de facto)의 관계를 유지하라는 자국 정부의 대사관 앞 훈령을 알렸으며, 아울러 조 씨에게 한국을 해방시키려는 노력에 대한 프랑스의 동정적 관심과 한국이 신속히 독립을 회복해야 한다는 자국 정부의 결의를 알렸다는 것임.\n\n[추가] 설명에서 페치코프(Pechkoff) 장군은 대한민국임시정부와 사실상(de facto)의 관계를 갖게 될 것은 프랑스 정부가 아니라 자신의 대사관이라고 말하였으며, 개인적으로는 4월 2일 오후 2시자 본 대사관 전보 560호의 둘째 문단 둘째 문장에 진술된 이유로 이 한인 집단에 승인이 주어져서는 안 된다고 생각한다는 뜻을 내비쳤음.[주22]\n\n애치슨(Atcheson)", "secondary": "895.01/4–945: Telegram\n\nThe Chargé in China (Atcheson) to the Secretary of State\n\nChungking, April 9, 1945—11 a.m. \n [Received April 11—2 p.m.]\n\n596. French Ambassador[주21] has handed me a copy of a statement, which he said he had sent to the Foreign Office to the effect that he had made known to Tjo So-wang on February 26 his Government’s instructions to his Embassy unofficially to maintain de facto relations with the Korean “Provisional Government” and that he had further informed Tjo of France’s sympathetic interest in efforts to liberate Korea and of his Government’s determination that Korea should promptly regain its independence.\n\n[In] further explanation, General Pechkoff said that it is his Embassy and not the French Government, which would have de facto relations with the Korean Provisional Government and he indicated that he personally did not think that this Korean group should be given recognition for the reasons stated in our 560, April 2, 2 p.m., second sentence of the second paragraph.[주22]\n\nAtcheson", "notes": ["[주21] 지노비 페치코프(Zinovi Pechkoff) 장군.", "[주22] 전보는 인쇄하지 않음. 해당 문장은 다음과 같이 진술했다: “이곳의 그룹도, 한국 밖의 어떤 그룹도 한국 인민을 실제로 대표하지 못하는데, 그들 중 누구도 아주 오랜 세월 동안 한국에 있어 본 적이 없기 때문이다.” (895.01/4–245)"], "warn": false, "pages": [1025], "search": "George Atcheson, Jr. 애치슨 (주중 대사대리) Zinovi Pechkoff 지노비 페치코프 (주중 프랑스 대사) Tjo So-wang 조소앙"}, {"id": "d762", "order": 762, "date": "1945-04-09", "group": "C", "eyebrow": "d762 · The Ambassador in the United Kingdom (Winant) to the Secretary of State", "title": "주영대사(위넌트)가 국무장관에게", "badge": "", "list_right": "문서 762", "meta": [{"k": "일자", "v": "1945-04-09"}, {"k": "발신", "v": "주영대사 위넌트(Winant) — 대사를 대신하여 2등서기관 존 M. 앨리슨", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "장소", "v": "London"}, {"k": "전문번호", "v": "No. 22279"}, {"k": "종류", "v": "공한"}, {"k": "원문출처", "v": "895.01/4–945", "txt": true}], "links": [{"k": "FRUS", "text": "문서 762 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d762"}], "summary": "영국 외무부가 '대한민국임시정부'의 승인을 현재로서 고려할 이유가 없다는 국무부 견해에 동의하며, 김구·조소앙의 서한은 회신하지 않고 블라디보스토크의 '한국해방위원회'에 관한 정보도 없다고 회답해 왔다는 보고.", "points": ["1945년 2월 20일자 국무부 비밀 훈령 5125호(임시정부의 승인 요청 건)에 대한 회신으로 영국 외무부의 서한 사본을 동봉함.", "영국 외무부는 현재로서 '대한민국임시정부' 승인을 고려할 이유가 없다는 국무부의 견해에 동의함.", "1944년 9월 5일자 주영대사관 전보 7246호에서 언급된 김구와 조소앙이 외무부에 보낸 각서들은 회신하지 않은 채로 둘 것임.", "영국 외무부는 블라디보스토크에 존재한다는 '한국해방위원회'에 관해 아무런 정보를 가지고 있지 않다고 진술함."], "primary": "귀하: 본인은 “대한민국임시정부(Korean Provisional Government)”의 승인 요청에 관한 1945년 2월 20일자 국무부 비밀 훈령 5125호[주23]와 관련하여, 이 문제에 관한 외무부(Foreign Office)의 서한[주24] 사본을 여기에 동봉하는 영광을 누립니다.\n\n외무부가 현재로서는 “대한민국임시정부”의 승인을 고려할 아무런 이유가 없다는 데 대해 국무부와 견해를 같이하며, 본 대사관의 1944년 9월 5일 오후 5시자 전보 7246호[주25]에서 언급된, 김구(Kim Koo) 씨와 조소앙(Tzo So-wang) 씨가 외무부 앞으로 보낸 각서들은 회신되지 않은 채로 남을 것임을 유의하기 바랍니다. 외무부 서한은 또한 블라디보스토크(Vladivostok)에 존재한다고 하는 “한국해방위원회(Korean Liberation Committee)”에 관하여 아무런 정보도 갖고 있지 않다고 진술하고 있습니다.\n\n경구,\n\n대사를 대신하여:\n\n존 M. 앨리슨(John M. Allison)\n\n대사관 2등서기관", "secondary": "895.01/4–945\n\nThe Ambassador in the United Kingdom (Winant) to the Secretary of State\n\nNo. 22279\n\nLondon, April 9, 1945.\n[Received April 19.]\n\nSir: I have the honor to refer to the Department’s secret instruction no. 5125 of February 20, 1945,[주23] regarding the request of the “Korean Provisional Government” for recognition, and to enclose herein a copy of a letter from the Foreign Office[주24] on this subject.\n\nIt will be noted that the Foreign Office agrees with the State Department that there is no present reason to contemplate recognition of the “Korean Provisional Government” and that the notes addressed to the Foreign Office by Mr. Kim Koo and Mr. Tzo So-wang, which were mentioned in this Embassy’s telegram no. 7246 of September 5 (1944), 5 p.m.,[주25] will remain unanswered. The Foreign Office letter also states that it has no information about a “Korean Liberation Committee” alleged to exist in Vladivostok.\n\nRespectfully yours,\n\nFor the Ambassador: \n\n\nJohn M. Allison\n\nSecond Secretary of Embassy", "notes": ["[주23] 인쇄하지 않음. 다만 p. 1023의 각주 16 참조.", "[주24] 인쇄하지 않음.", "[주25] 인쇄하지 않음. 다만 요약은 Foreign Relations, 1944, vol. v, p. 1296, 각주 16 참조."], "warn": false, "pages": [1025], "search": "John G. Winant 존 G. 위넌트 (주영대사) John M. Allison 존 M. 앨리슨 Kim Koo 김구 Tzo So-wang 조소앙"}, {"id": "d763", "order": 763, "date": "1945-04-17", "group": "B", "eyebrow": "d763 · The Chargé in the Soviet Union (Kennan) to the Secretary of State", "title": "주소련 대사대리(케넌)가 국무장관에게", "badge": "", "list_right": "문서 763", "meta": [{"k": "일자", "v": "1945-04-17"}, {"k": "발신", "v": "주소련 대사대리 케넌(Kennan)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "장소", "v": "Moscow"}, {"k": "전문번호", "v": "1210 (충칭에는 26호로 전달)"}, {"k": "종류", "v": "전보"}, {"k": "원문출처", "v": "895.01/4–1745: Telegram", "txt": true}], "links": [{"k": "FRUS", "text": "문서 763 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d763"}], "summary": "블라디보스토크에 '한국해방위원회'가 존재한다는 보고를 확인할 수 없으며, 임시정부의 잠재적 경쟁 세력은 오히려 중국공산당 통제 지역에서 나중에 나타날 가능성이 크다는 블라디보스토크 총영사관의 회보를 전달한 전보.", "points": ["1945년 2월 20일자 충칭 앞 국무부 훈령 52호에 대한 답으로 블라디보스토크발 전보를 전달함.", "소련 국적이든 일본 국적이든 모든 한인은 1937년 연해주(Primore)에서 이주되었고, 후자(수는 적었을 것으로 추정)는 한국으로 돌아갈 선택권이 있었다고 전해짐. 소련 국적자들은 소비에트 카자흐스탄으로 이주된 것으로 보고되어, 연해주에 한인 민간인이 남아 있을 가능성은 낮음.", "적군(赤軍)에 2만 명 이상의 한인(소련 국적자로 추정)이 있다는 보고가 있음.", "총영사관은 블라디보스토크에 이른바 한국해방위원회가 존재한다는 보고도 소문도 들은 바 없으며, 그처럼 명백히 부자연스러운 환경에서 그런 조직이 만들어질 가능성은 낮다고 봄.", "이주된 연해주 한인은 거의 전부 소련 국적자였고 현 거주지도 한국에서 멀어 그러한 위원회의 구성 자원이 되기 어렵다고 판단.", "충칭의 대한민국임시정부에 대한 잠재적 경쟁 세력은 오히려 중국공산당이 통제하는 서북중국 지역에서, (1) 한국 정복이 임박하고 (2) 중국공산당과 국민당의 균열이 전자의 정치·군사적 지위 향상으로 더 악화된 뒤에 처음 나타날 것으로 추정. 이후 동만주 간도(Chientao) 지구와 한국 자체가 발전의 온상이 될 것으로 봄.", "위 분석은 소련의 대태평양전쟁 정치관계가 현 상태로 유지된다는 기본 전제 위에 잠정적으로 제시된 것임."], "primary": "1210. 1945년 2월 20일자 충칭 앞 국무부 훈령 52호에 대한 답으로 다음을 블라디보스토크에서 중계함:[주26]\n\n> 56호, 4월 9일 오전 0시. 소련 국적이든 일본 국적이든 모든 한인은 1937년 연해주(Primore) 지역[주27]에서 이주되었고, 후자 집단(수는 적었을 것으로 추정됨)은 한국으로 돌아갈 선택권을 가졌다고 전해짐. 소련 국적자였던 이들은 소비에트 카자흐스탄으로 이주된 것으로 보고되고 있으며, 연해주에 한국인 민간인이 남아 있을 가능성은 낮아 보임. 적군(赤軍)에 2만 명이 넘는 한인(소련 국적을 가진 것으로 추정됨)이 있다는 보고에 대해서는 대사관도 알고 있을 것임. 3월 2일[28일] 자정자 귀 전보에 관하여.\n>\n> 총영사관은 블라디보스토크에 이른바 한국해방위원회(Korean Liberation Committee)가 존재한다는 보고도 소문도 들은 바 없으며, 그처럼 명백히 [1027면] 부자연스러운 환경에서 그러한 조직이 만들어질 가능성은 낮아 보임. 앞서 언급한 이주된 연해주 한인들은 전부는 아니더라도 거의 전부가 소련 국적자였던 것으로 추정되고, 알려진 바로는 그 현 거주지 또한 한국 자체에서 멀리 떨어져 있으므로, 이 집단이 그러한 위원회 결성의 자원을 제공할 개연성도 낮아 보임. 충칭에 소재한 대한민국임시정부(Korean Provisional Government)에 대한 어떠한 잠재적 경쟁 세력이든, 아마도 중국공산당이 통제하는 서북중국 지역에서, (1) 한국의 정복이 가까워지고 (2) 중국공산당과 국민당(Kuomintang)의 균열이, 가정컨대 전자 집단의 정치·군사적 지위 향상과 더불어 더욱 악화되었을 훗날의 어느 시점에 처음 모습을 드러낼 것으로 추정됨. 그때에는 동만주의 간도(Chientao) 지구와 한국 자체가 그 이상의 전개를 위한 비옥한 토양을 제공할 것으로 보임.[주28]\n>\n> 위에 잠정적으로 제시한 분석은 태평양 전구의 전쟁에 대한 소련의 현 정치적 관계가 변함없이 유지되리라는 기본 전제 위에 서 있음을 대사관은 이해할 것임.\n\n국무부에 1210호로 발신, 충칭에 26호로 전달함.\n\n케넌(Kennan)", "secondary": "895.01/4–1745: Telegram\n\nThe Chargé in the Soviet Union (Kennan) to the Secretary of State\n\nMoscow, April 17, 1945—5 p.m. \n [Received April 18—2:15 a.m.]\n\n1210. In answer to Department’s instruction 52, February 20, 1945 to Chungking following repeated from Vladivostok:[주26]\n\n56, April 9, 12 a.m. All Koreans of either Soviet or Jap citizenship were removed from Primore area[주27] in 1937, latter group (presumably small) reputedly having option of returning to Korea. Those who were Soviet citizens are reported to have been transplanted into Soviet Kazakhstan and it appears unlikely that any civilians of Korean race remain in Primore. Embassy will be aware of reported presence of over 20,000 Koreans (presumably possessing Soviet citizenship) in Red army. Reurtel March 2 [28], midnight.\n\nConsulate has heard neither report nor rumor of existence in Vlad on [of] so-called Korean Liberation Committee and it appears unlikely that an organization of that sort would be created in such obviously [1027면] unnatural surroundings. Since aforementioned transplanted Primore Koreans were presumably nearly all if not all Soviet citizens and their present place of residence so far as known is moreover distant from Korea itself it also appears improbable that this group would provide material for formation of such a committee. Suggest that any potential rival to Korean Provisional Government located in Chungking would probably make its first appearance in Northwest China region controlled by Chinese Communists at some later date when (1) conquest of Korea might be near and (2) cleavage of Chinese Communist Party and Kuomintang by hypothesis should have become more aggravated with improvement in political military position of former group. Chientao district of eastern Manchuria and Korea itself would then presumably provide fertile ground for further developments.[주28]\n\nEmbassy will appreciate that analysis tentatively offered above is predicated upon basic proposition that present political relationship of USSR to war in the Pacific theatre will be maintained unaltered.\n\nSent Department as 1210, repeated to Chungking as 26.\n\nKennan", "notes": ["[주26] 아마도 총영사 O. 에드먼드 클럽(O. Edmund Clubb)으로부터.", "[주27] 연해주(Primorsky kray), 즉 프리모리예 지방.", "[주28] 국무부에는 전달되지 않은, 블라디보스토크 주재 총영사 앞 4월 17일 오후 4시자 전보 37호에서 주소련 대사대리는 다음과 같이 진술했다: “귀하의 참고로, 중국공산당 지역에는 일본인민해방연맹(Japanese Peoples Emancipation League) 외에 한인 해방 조직이 하나 수립되어 있음.” (Records of the Moscow Embassy, Lot F96, 800 Korea)"], "warn": true, "pages": [1025, 1026, 1027], "search": "George F. Kennan 조지 F. 케넌 (주소련 대사대리) O. Edmund Clubb O. 에드먼드 클럽 (각주)"}, {"id": "d764", "order": 764, "date": "1945-04-20", "group": "C", "eyebrow": "d764 · The Chairman of the Korean Commission in the United States (Rhee) to the Secretary of State", "title": "주미한국위원부 위원장(이승만)이 국무장관에게", "badge": null, "list_right": "문서 764", "meta": [{"k": "일자", "v": "1945-04-20"}, {"k": "발신", "v": "주미한국위원부 위원장 이승만(Chairman of the Korean Commission in the United States, Rhee)", "txt": true}, {"k": "수신", "v": "국무장관(Secretary of State)", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "서한"}, {"k": "원문출처", "v": "500.CC/4–2045", "txt": true}], "links": [{"k": "FRUS", "text": "문서 764 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d764"}], "summary": "3월 1일 이후 아르헨티나·시리아·레바논이 샌프란시스코 회의에 추가로 초청된 점을 들어, 대한민국임시정부 대표단의 참가 허용 또는 참가 여부의 표결 회부를 요청한 서한.", "points": ["3월 8일자 이승만의 서한과 3월 28일자 국무장관 답신에 이어지는 후속 서한이다.", "국무부는 \"1945년 3월 1일 시점에 연합국(United Nations)이었던 국가만이 초청 자격이 있다\"는 주최국 합의를 근거로 삼았다고 인용한다.", "그럼에도 아르헨티나·시리아·레바논이 3월 1일 이후 1945년 4월 25일 샌프란시스코 회의에 참가하게 된 점을 지적한다.", "이를 근거로 대한민국임시정부 공식 대표단의 참가 허용 가능 여부를 묻는다.", "국무부가 여전히 완강하다면, 대한민국의 참가 요청을 회의 참가국들에 회부하여 민주적 절차(즉 표결)로 그 의사를 기록하게 해 달라고 요청한다."], "primary": "장관님께: 3월 8일자 제 서한[주29]과 관련하여, 1945년 4월 25일 샌프란시스코에서 열리는 연합국 회의에 아르헨티나, 시리아 및 레바논이 가입(admission)한 사실에 대해 삼가 각하의 주의를 환기시켜도 되겠습니까.\n\n3월 28일자 귀하의 서한[주29]에서 귀하는 \"주최국들이 도달한 합의에 따라, 1945년 3월 1일에 연합국(United Nations)이었던 국가들만이 샌프란시스코 회의 초청을 받을 자격이 있다\"고 말씀하셨습니다.\n\n위에 언급한 국가들이 3월 1일 이후에 포함된 사실은, 이제 대한민국임시정부(Korean Provisional Government)의 공식 대표단도 샌프란시스코 회의에 참가하도록 허용될 수 있지 않겠는가를 여쭙게 만듭니다. 만일 국무부가 여전히 완강한 입장을 고수한다면, 3월 1일 이후 아르헨티나, 시리아 및 레바논이 가입한 사실에 비추어, 샌프란시스코 회의에 참가하는 국가들이 대한민국(Republic of Korea)의 참가 요청을 접수하고 민주적 절차(즉 표결)를 통하여 이 중대한 문제에 관한 그들의 의사를 기록하도록 허용해 주실 것을 삼가 요청드려도 되겠습니까. [1028면]\n\n깊은 경의를 표하며,\n\n삼가 올림,\n\n이승만(Syngman Rhee)", "secondary": "500.CC/4–2045\n\nThe Chairman of the Korean Commission in the United States (Rhee) to the Secretary of State\n\nWashington, April 20, 1945.\n\nSir: Further with regard to my letter of March 8th,[주29] may I respectfully call to your attention the admission of Argentina, Syria and the Lebanon to the United Nations Conference in San Francisco on April 25, 1945.\n\nIn your letter of March 28th,[주29] you stated that “Only those nations which were United Nations on March 1, 1945, were eligible to receive invitations to the San Francisco Conference, in accordance with an agreement which was arrived at by the sponsoring nations.”\n\nThe inclusion of the above-mentioned nations since March 1st prompts me to ask whether or not the official delegation of the Korean Provisional Government might not now be permitted to participate in the San Francisco Conference. If the Department of State still remains adamant, may I be permitted to respectfully request that, because of the admission of Argentina, Syria and the Lebanon since March 1st, the nations participating in the San Francisco Conference be permitted to receive the request of the Republic of Korea for inclusion [1028면] in their number and, through democratic processes (i.e., a vote) record their wishes on this vital subject.\n\nWith my highest esteem,\n\nRespectfully yours,\n\nSyngman Rhee", "notes": ["[주29] 게재하지 않음. 다만 1025면 각주 20 참조.", "[주29] 게재하지 않음. 다만 1025면 각주 20 참조."], "warn": false, "pages": [1027, 1028], "search": "Syngman Rhee 이승만"}, {"id": "d765", "order": 765, "date": "1945-05-15", "group": "C", "eyebrow": "d765 · The Chairman of the Korean Commission in the United States (Rhee) to President Truman", "title": "주미한국위원부 위원장(이승만)이 트루먼 대통령에게", "badge": null, "list_right": "문서 765", "meta": [{"k": "일자", "v": "1945-05-15"}, {"k": "발신", "v": "주미한국위원부 위원장 이승만(Chairman of the Korean Commission in the United States, Rhee) — 서명은 '한국대표단 단장'", "txt": true}, {"k": "수신", "v": "트루먼 대통령(President Truman)", "txt": true}, {"k": "장소", "v": "San Francisco"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "서한"}, {"k": "원문출처", "v": "500.CC/5–1545", "txt": true}], "links": [{"k": "FRUS", "text": "문서 765 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d765"}], "summary": "얄타에서 한국에 관해 카이로 선언에 배치되는 비밀협정이 있었다는 정황을 들어 대통령의 개입을 호소하고, 샌프란시스코 회의 의석 부여와 한국인 병력의 대일전 참전을 요청한 서한.", "points": ["카이로 선언에 배치되는 한국 관련 얄타 비밀협정이 최근 발견되었다고 주장한다.", "1905년 한국이 일본에 팔아넘겨진 비밀협정이 20년이 지나서야 공개된 전례를 들어, 한국이 비밀외교의 희생물이 된 것은 처음이 아니라고 한다.", "이번에는 연합국 회의 한복판에서 드러났으니 대통령이 개입해 과거의 잘못을 바로잡고 3천만 인민의 추가 예속을 막아 달라고 호소한다.", "연합국 회의 자격심사위원회에 정당한 의석을 요청했으며, 대통령의 지시만이 문을 열 수 있다고 한다.", "군대 및 각종 지하활동에 한국인의 방대한 인력을 제공하겠다는 제안을 거듭한다. 태평양 전선이 일본 본토에 가까워질수록 연합군은 한국 지하조직의 협력이 필요할 것이며, 이는 일본의 조기 패배와 미군 사상자 감소로 이어진다는 논리다."], "primary": "친애하는 트루먼 대통령께: 한국에 관하여 카이로 선언[주30]에 배치되는 얄타에서의 비밀협정이 최근 발견된 것은, 제게 그러하였듯이 각하께도 틀림없이 놀라운 일이었을 것입니다. 각하께서도 상기하시겠지만, 한국이 비밀외교의 희생물이 된 것은 이번이 처음이 아닙니다.\n\n1905년 한국이 일본에 팔아넘겨진 최초의 비밀협정[주31]은 20년이 지나서야 비로소 알려졌습니다. 다행히도 이번 얄타 협정은 바로 이곳, 연합국 회의(United Nations Conference)의 한복판에서 밝혀졌습니다. 저희는 각하께 개입해 주실 것을 호소하지 않을 수 없습니다. 그것만이 과거의 잘못을 바로잡고 3천만 인민이 더 이상 노예화되는 것을 막을 유일한 길이기 때문입니다.\n\n저희는 연합국 회의 자격심사위원회(Membership Committee)에 회의에서의 정당한 의석을 요구하는 저희의 청원을 제출하였습니다.[주32] 각하의 지시만이 저희에게 문을 열어줄 수 있으며, 그리하여야 한국은 이 회의에서 발언권을 가지게 될 것입니다.\n\n대통령 각하, 과거에 저희가 거듭 제기해 온 제안을 다시 한번 새롭게 드리도록 허락해 주십시오. 저희는 이제 다시금 저희의 방대한 인력을 군대와 각종 지하활동에 복무하도록 제공합니다. 한국인은 일본이 가진 가장 원한 깊은 적입니다. 그들은 지난 40년간 아무런 원조도 없이 홀로 싸움을 계속해 왔습니다. 그들은 이 전쟁에 더 크고 더 효과적인 규모로 참가하기를 원하며, 태평양 전선이 일본 열도에 가까워지고 연합군이 한국 지하 세력의 협력을 필요로 하게 될 지금은 더욱 그러합니다. [1029면] 그들은 일본을 더 빨리 패배시키고 미국인 사상자의 수를 줄이는 데 도움이 될 수 있습니다.\n\n대통령 각하, 저희는 연합국이 이 전쟁에서 싸워 얻고자 하는 인권을 한국에 부여할 그 한마디를 각하께서 해 주시리라 믿고 있습니다.\n\n깊은 경의를 표하며,\n\n삼가 올림,\n\n이승만(Syngman Rhee)\n\n한국대표단 단장(Chairman, Korean Delegation)", "secondary": "500.CC/5–1545\n\nThe Chairman of the Korean Commission in the United States (Rhee) to President Truman\n\nSan Francisco, May 15, 1945.\n\nMy Dear President Truman: The recent discovery of a secret agreement at Yalta contrary to the Cairo Declaration[주30] regarding Korea was doubtless just as startling to Your Excellency as it was to me. Your Excellency will recall that it is not the first time Korea was made a victim of secret diplomacy.\n\nThe first secret agreement by which Korea was sold to Japan in 1905[주31] was kept secret until twenty years later. Fortunately, this Yalta agreement has been uncovered right here in the midst of the United Nations Conference. We have to appeal to Your Excellency to intervene. For that is the only way to rectify the past wrong and to prevent the further enslavement of the thirty million people.\n\nWe have presented to the Membership Committee of the United Nations Conference our request for a rightful seat in the Conference.[주32] Your Excellency’s instruction alone can open the door for us and then Korea will have a voice in the assembly.\n\nMr. President, allow us to renew our offer which we have repeatedly made in the past. We now offer again our tremendous manpower to serve in the Armed Forces and in various underground activities. The Koreans are the most bitter enemies Japan has. They have continued their fight single-handed and unaided for the last forty years. They want to participate in this war on a larger and more effective [1029면] scale, especially since the Pacific warfront is drawing nearer to the Japanese Islands and the Allied Armies will need the cooperation of the Korean underground forces. They can help defeat Japan sooner and reduce the number of American casualties.\n\nWe count on you, Mr. President, to say the word that will give Korea the human rights for which the United Nations are fighting this war.\n\nWith my highest esteem,\n\nRespectfully yours,\n\nSyngman Rhee\n\nChairman, Korean Delegation", "notes": ["[주30] 루스벨트 대통령, 장제스 총통, 윈스턴 S. 처칠 총리가 발표하였으며 백악관이 12월 1일 공개하였다. 본문은 Foreign Relations, The Conferences at Cairo and Tehran, 1943, 448면 참조.", "[주31] 이는 아마도 육군장관 윌리엄 하워드 태프트와 일본 총리 가쓰라 백작 사이의 \"합의각서(agreed memorandum)\"를 가리키는 것으로 보인다. 그 사본은 1905년 7월 29일 태프트 장관이 도쿄에서 국무장관 엘리후 루트에게 보냈다. 이 사본은 국립문서보관소가 \"Miscellaneous Letters of the Department of State, July (Part III) 1905\" 중에 보관하고 있다. 이 각서는 타일러 데닛이 Current History 제21권 제1호(1924년 10월) 15–21면에 해설과 함께 처음 공표하였다. 이 판본에서는 태프트 장관을 \"곤란하게 하지 않기 위하여\" 그의 이름을 삭제하였고, 다른 주제를 다룬 마지막 여섯 문장도 삭제하였다. 전보의 전문(全文)은 존 길버트 리드가 The Pacific Historical Review 제9권 제1호(1940년 3월) 66–68면에 쓴 논문에 실려 있다.", "[주32] \"1945년 4월 25일 캘리포니아주 샌프란시스코 국제기구에 관한 연합국 회의에 대한 한국인 청원서(Korean Memorial)\", 게재하지 않음. 이 청원서는 대한민국임시정부의 지시에 따라 Tjo So-wang(조소앙으로 추정) 씨가 서명하였다. (895.01/4–2545)"], "warn": false, "pages": [1028, 1029], "search": "Syngman Rhee 이승만 Harry S. Truman 트루먼(대통령) Franklin D. Roosevelt 루스벨트(각주) Chiang Kai-shek 장제스(각주) Winston S. Churchill 윈스턴 S. 처칠(각주) William Howard Taft 윌리엄 하워드 태프트(각주) Count Katsura 가쓰라 백작(각주) Elihu Root 엘리후 루트(각주) Tyler Dennett 타일러 데닛(각주) John Gilbert Reid 존 길버트 리드(각주) Tjo So-wang 조소앙(각주, 원문 표기 그대로)"}, {"id": "d766", "order": 766, "date": "1945-06-05", "group": "C", "eyebrow": "d766 · The Acting Secretary of State to the Chairman of the Korean Commission in the United States (Rhee)", "title": "국무장관 대리가 주미한국위원부 위원장(이승만)에게", "badge": null, "list_right": "문서 766", "meta": [{"k": "일자", "v": "1945-06-05"}, {"k": "발신", "v": "국무장관 대리(Acting Secretary of State) — 실제 서명은 극동국장 대리 프랭크 P. 록하트", "txt": true}, {"k": "수신", "v": "주미한국위원부 위원장 이승만(Chairman of the Korean Commission in the United States, Rhee)", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "서한"}, {"k": "원문출처", "v": "500.CC/5–1545", "txt": true}], "links": [{"k": "FRUS", "text": "문서 766 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d766"}], "summary": "얄타 비밀협정설을 근거 없는 소문으로 일축하고, 대한민국임시정부를 통치권력으로 승인하지 않는 이유를 조목조목 밝히며 샌프란시스코 회의 의석 요구를 거부한 회신.", "points": ["백악관이 이승만의 5월 15일자 대통령 앞 서한을 국무부로 이첩하였다.", "5월 26일 충칭에서 임시정부 측 인사가 발표한 성명에 비추어, 크림(얄타) 회담에서 카이로 선언에 배치되는 대한(對韓) 약속이 있었다는 보도는 근거 없다고 본다.", "1945년 3월 24일 방송에서 국무차관보 아치볼드 매클리시가 한국인은 \"적절한 시기에(in due course)\" 독립을 얻을 것이며 이는 \"자치할 수 있는 위치에 이르는 즉시\"를 뜻하리라고 말한 예를 든다.", "샌프란시스코 회의 참가 연합국은 모두 법적으로 구성된 통치권력을 갖고 있으나, \"대한민국임시정부\"와 그 밖의 한국인 단체들은 미국의 승인을 받는 데 요구되는 자격을 갖추지 못했다고 한다.", "임시정부는 한국의 어느 지역에도 행정권을 행사한 적이 없고 오늘의 한국인을 대표한다고 볼 수 없으며 망명 한인 사이에서도 지지가 제한적이라고 평가한다.", "승인을 미루는 것은 연합국 승리 후 한국인이 정부의 최종 형태와 인적 구성을 선택할 권리를 훼손하지 않기 위함이며, 이는 추축국 지배하 또는 해방된 모든 인민에 대한 미국의 일관된 태도라고 설명한다.", "한국인 인력의 대일전 활용에 관해서는 미군 당국이 그 잠재력을 면밀히 검토해 왔고, 전쟁이 진전됨에 따라 한국인이 더 중요한 역할을 할 위치에 놓일 수 있다고 답한다."], "primary": "친애하는 이 박사께: 백악관은 트루먼 대통령께 보내신 5월 15일자 귀하의 서한을 국무부로 이첩하였습니다. 그 서한에서 귀하는 얄타에서 맺어졌다고 주장되는 한국에 관한 비밀협정이 발견되었다는 이야기에 대해 논평하시면서, 그것이 카이로 선언에 배치된다고 주장하셨습니다. 나아가 귀하는 서한에서 샌프란시스코 회의에서의 의석을 달라는 귀하의 요청을 지지해 달라고 대통령께 호소하셨고, 한국인 인력이 전쟁 수행에 더 효과적으로 활용될 수 있으리라고 제안하셨습니다.\n\n5월 26일 충칭에서 귀하의 동료가 언론에 행한 성명[주33]에 비추어 볼 때, 저는 귀하께서 크림 회담(Crimea Conference)에서 카이로 선언과 양립하지 않는 한국 관련 약속이 이루어졌다는 근거 없는 보도를 더 이상 신뢰하지 않으시리라 확신합니다. 또한 귀하께서도 분명 기억하시겠지만, 국무부의 책임 있는 당국자들은 한국이 일본으로부터 해방될 것이며 카이로 선언에 담긴 의도가 이행될 것임을 수시로 거듭 밝혀 왔습니다. 예컨대 바로 얼마 전인 1945년 3월 24일에도 국무차관보 아치볼드 매클리시(Archibald MacLeish)는 라디오 토론 프로그램에서 \"한국인은 '적절한 시기에(in due course)' 독립을 얻게 될 것이며, 이는 아마도 그들이 스스로를 통치할 수 있는 위치에 이르는 즉시를 뜻할 것\"이라고 말하였습니다.\n\n귀하께서 샌프란시스코 회의에서의 의석 요구를 되풀이하셨으므로, 이와 관련하여 국무부를 이끌어 온 몇 가지 기본적 고려 사항 — 이미 이전의 서신이나 구두로 귀하께 알려 드린 바 있는 — 을 이 시점에 다시 짚어보는 것이 적절할 듯합니다. 샌프란시스코 [1030면] 회의에 대표를 보낸 연합국(United Nations)은 모두 법적으로 구성된 통치 당국을 갖고 있는 반면, \"대한민국임시정부(Korean Provisional Government)\"와 그 밖의 한국인 단체들은 미국에 의하여 통치 당국으로 승인받는 데 필요한 자격을 갖추고 있지 않습니다.\n\n\"대한민국임시정부\"는 한국의 어느 지역에 대해서도 행정적 권한을 가져본 적이 없으며, 오늘의 한국 인민을 대표한다고 볼 수도 없습니다. 망명 한국인 사이에서조차 그 지지 세력은 제한적입니다. \"대한민국임시정부\"와 같은 집단을 상대함에 있어 본국 정부의 정책은, 연합국의 승리가 달성되었을 때 한국 인민이 자신들이 수립하고자 하는 정부의 최종적 형태와 인적 구성을 선택할 권리를 훼손할 소지가 있는 조치를 취하지 않는다는 것입니다. 그러한 정책은 추축국의 지배 아래 있거나 그로부터 해방된 모든 인민에 대한 본국 정부의 태도와 일관됩니다. 그러므로 여러 이유 가운데 특히 이러한 이유로 국무부는 \"대한민국임시정부\"를 승인하지 않았습니다.\n\n이와 관련한 국무부의 입장에 관한 위의 설명이 한국 인민과 자유를 향한 그들의 열망에 대한 공감의 결여를 조금이라도 함축하는 것이 아님을 귀하께서 이해하시리라 확신합니다. 국무부의 관리들은 한국에 관련된 문제들을 연구하는 데 많은 시간을 들여 왔고, 귀하를 비롯하여 한국과 한국인의 복리에 관심을 가진 여러 인사들과 오랜 시간 대화해 왔으며, 그러한 사안에 관한 본국 정부의 책임을 설명하고 그 책임이 어떤 방향에 따라 이행되고 있는지를 분명히 밝히고자 힘써 왔습니다.\n\n대일전에서의 한국인 인력 활용에 관한 귀하의 언급과 관련하여서는, 이 나라의 군 당국이 이 점에서 한국 인민의 잠재력을 면밀히 검토하는 일을 소홀히 하지 않았음을 확언드릴 수 있습니다. 많은 한국인이 연합국 군대에서 사심 없이 헌신적으로 복무해 온 것은 기록으로 남아 있는 사실입니다. 대일전이 진전됨에 따라 한국 인민은 일본의 패배에 점점 더 중요한 역할을 할 수 있는 위치에 놓일 수 있을 것입니다.\n\n국무부는 한국에 관한 본국 정부의 의도[주34]에 관한 위의 논의가, 허위의 소문에 근거하여 귀하께서 품어 오신 의혹을 씻어내는 데 도움이 되기를 바랍니다.\n\n삼가 올림,\n\n국무장관 대리를 위하여:\n\n프랭크 P. 록하트(Frank P. Lockhart)\n\n극동국장 대리(Acting Director Office of Far Eastern Affairs)\n\n[1031면]\n\n[전쟁 종결 시점 한국 정세에 대한 국무부의 평가와 이 지역에 관한 미국 정책의 서술은 6월 22일자 정책문서(Policy Paper) 제3절, 앞의 561면 참조.]", "secondary": "500.CC/5–1545\n\nThe Acting Secretary of State to the Chairman of the Korean Commission in the United States (Rhee)\n\nWashington, June 5, 1945.\n\nMy Dear Dr. Rhee: The White House has referred to the Department your letter of May 15 to President Truman in which you comment upon the alleged discovery of a secret agreement regarding Korea assertedly made at Yalta which, you claim, is contrary to the Cairo Declaration. Furthermore, in your letter you appeal to the President to support your request for a seat in the San Francisco Conference and suggest that Korean manpower might be more effectively utilized in the war effort.\n\nIn view of the statement to the press made by your colleague in Chungking on May 26,[주33] I am sure that you no longer give credence to the unfounded reports that commitments were entered into at the Crimea Conference in regard to Korea which are inconsistent with the Cairo Declaration. You will also doubtless recall that responsible officials of the Department have from time to time reiterated that Korea will be liberated from Japan and that the intentions embodied in the Cairo Declaration will be carried out. As recently as March 24, 1945, for example, Assistant Secretary of State Archibald MacLeish on a radio discussion program, stated that “the Koreans will get their independence ‘in due course’, which presumably means as soon as they are in a position to govern themselves.”\n\nAs you have repeated your request for a seat in the San Francisco Conference, it may be pertinent at this time to review certain basic considerations which have guided the Department in this connection and which have been made known to you in previous correspondence or orally. The United Nations which are represented at the San [1030면] Francisco Conference all have legally constituted governing authorities, whereas the “Korean Provisional Government” and other Korean organizations do not possess the qualifications requisite for obtaining recognition by the United States as a governing authority.\n\nThe “Korean Provisional Government” has never had administrative authority over any part of Korea nor can it be considered representative of the Korean people of today. Its following even among exile Koreans is limited. It is the policy of this Government in dealing with groups such as the “Korean Provisional Government” to avoid taking action which might, when the victory of the United Nations is achieved, tend to compromise the right of the Korean people to choose the ultimate form and personnel of the government which they may wish to establish. Such a policy is consistent with this Government’s attitude toward all people under Axis domination or liberated therefrom. For these reasons, then, among others, the Department has not recognized the “Korean Provisional Government”.\n\nI am sure you will realize that the foregoing review of the Department’s position in this connection carries no implication whatsoever of a lack of sympathy for the people of Korea and their aspirations for freedom. The officers of the Department have spent a great deal of time in studying the problems relating to Korea and have talked at length with you and with other individuals interested in the welfare of Korea and the Koreans and have endeavored to explain this Government’s responsibility in such matters and to give a clear indication of the lines along which this responsibility is being fulfilled.\n\nIn regard to your reference to the use of the Korean manpower in the war against Japan, you may be assured that the military services of this nation have not neglected to examine carefully the potentialities of the Korean people in this regard. It is a matter of record that many Koreans have been serving unselfishly and devotedly in the forces of the United Nations. As the war against Japan progresses, the Korean people may be placed in a position to play an increasingly important role in the defeat of Japan.\n\nThe Department hopes that the foregoing discussion of this Government’s intentions[주34] with respect to Korea will serve to dispel the doubts which you have entertained, based upon false rumors.\n\nSincerely yours,\n\nFor the Acting Secretary of State: \n\n\nFrank P. Lockhart\n\nActing Director Office of Far Eastern Affairs\n\n[1031면]\n\n[For the Department’s estimate of conditions in Korea at the end of the war and a statement of United States policy in regard to this region, see Policy Paper of June 22, Section III, ante, page 561.]", "notes": ["[주33] 5월 29일자 전보 제865호에서 주중 대사는, 대한민국임시정부의 대변인이 5월 26일 중앙통신사(Central News Agency)에 성명을 발표하여 전후 한국의 지위에 관해 얄타에서 비밀협정이 이루어졌다는 이야기를 \"근거 없는 소문\"이라고 규탄하였다고 보고하였다. (895.01/5–2045)", "[주34] 6월 8일 공개된 그루(Grew) 국무장관 대리의 \"한국에 관한 정책 재검토(Review of Policy regarding Korea)\" 성명은 Department of State Bulletin 1945년 6월 10일자 1058면 참조. 7월 2일 오후 2시 발신 전보 제6639호에서 주영 대사 위넌트(Winant)는 영국 외무부가 그루 씨의 성명에 \"전적으로 동의\"한다고 보고하였다. (711.95/7–245)"], "warn": false, "pages": [1029, 1030, 1031], "search": "Syngman Rhee 이승만 Harry S. Truman 트루먼(대통령) Frank P. Lockhart 프랭크 P. 록하트 Archibald MacLeish 아치볼드 매클리시 Joseph C. Grew 조지프 C. 그루(각주) John G. Winant 위넌트(각주, 주영 대사)"}, {"id": "d767", "order": 767, "date": "1945-07-21", "group": "B", "eyebrow": "d767 · The Chairman of the Korean Commission in the United States (Rhee) to President Truman", "title": "주미한국위원부 위원장(이승만)이 트루먼 대통령에게", "badge": null, "list_right": "문서 767", "meta": [{"k": "일자", "v": "1945-07-21"}, {"k": "발신", "v": "주미한국위원부 위원장 이승만(Chairman of the Korean Commission in the United States, Rhee)", "txt": true}, {"k": "수신", "v": "트루먼 대통령(President Truman)", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "전보"}, {"k": "원문출처", "v": "895.01/7–214–5: Telegram (원문 표기 그대로. 통상 표기라면 895.01/7–2145)", "txt": true}], "links": [{"k": "FRUS", "text": "문서 767 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d767"}], "summary": "베를린(포츠담) 회담 중인 미·영·소 수뇌가 한국의 주권과 영토 보전에 영향을 미치는 일체의 비밀협정을 부인하고 대한
