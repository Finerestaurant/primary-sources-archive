d as rapidly as possible. In the meantime a directive has been dispatched by the Joint Chiefs of Staff looking to the immediate removal of the Japanese Governor-General and other high officials. A report of the action taken pursuant to the directive is expected at any time.\n\n[1048면]\n\nThere has been a very unfavorable reaction both in Korea and in the United States to the original announcement by the American Commander regarding the temporary retention of Japanese officials.\n\nIn view of the misunderstandings and unfavorable publicity which have arisen, it is believed that it would be desirable that you issue a public statement reiterating and clarifying the intentions of the American Government in regard to the policies of this Government toward Korea. A draft of a statement, which you may wish to consider for issuance at your early convenience, is attached.\n\nDean Acheson\n\n[Annex]\n\nDraft Statement Prepared for President Truman[주69]\n\nThe surrender of the Japanese forces in Seoul, ancient Korean capital, heralds the liberation of a freedom-loving and heroic people. Despite their long and cruel subjection under the warlords of Japan, the Koreans have kept alive their devotion to national liberty and to their proud cultural heritage. This subjection has now ended. The Japanese warlords are being removed. Such Japanese as may be temporarily retained are being utilized as servants of the Korean people and of our occupying forces only because they are deemed essential by reason of their technical qualifications.\n\nIn this moment of liberation we are mindful of the difficult tasks which lie ahead. The building of a great nation has now begun with the assistance of the United States, China, Great Britain and the Soviet Union, who are agreed that Korea shall become free and independent.\n\nThe assumption by the Koreans themselves of the responsibilities and functions of a free and independent nation and the elimination of all vestiges of Japanese control over Korean economic and political life will of necessity require time and patience. The goal is in view but its speedy attainment will require the joint efforts of the Korean people and of the allies.\n\nThe American people rejoice in the liberation of Korea as the Tae-gook-kee, the ancient flag of Korea, waves again in the Land of the Morning Calm.", "notes": ["[주69] 9월 18일 백악관에 의해 발표됨. 같은 날 이승만(Syngman Rhee)은 트루먼 대통령에게 보낸 전보에서 다음과 같이 말하였다. \"친애하는 대통령 각하: 오늘 백악관이 우리 민족과 그 장래에 관하여 발표한 성명에서 모든 한국인이 느낄 형언할 수 없는 기쁨과 위안을 각하께 전할 말을 찾기 어렵습니다. 친애하는 대통령 각하, 각하께서는 인간의 자유와 민주주의의 이상에 대한 각하의 헌신을 모든 면에서 보여 주셨습니다. 각하의 이름과 각하의 고결함은 한국 국민에게 길이 존경받을 것입니다. 깊은 감사를 담아, 진심으로, 이승만.\" (740.00119–PW/9–1845)"], "warn": false, "pages": [1047, 1048], "search": "Dean Acheson 딘 애치슨 (국무장관 대리) Harry S. Truman 해리 S. 트루먼 (미국 대통령) Syngman Rhee 이승만 (각주 69) the American Commander 미군 사령관 — 원문은 직함만 표기"}, {"id": "d781", "order": 781, "date": "1945-09-15", "group": "E", "eyebrow": "d781 · The Political Adviser in Korea (Benninghoff) to the Secretary of State", "title": "주한 정치고문(베닝호프)이 국무장관에게, 제1호", "badge": "", "list_right": "문서 781", "meta": [{"k": "일자", "v": "1945-09-15"}, {"k": "발신", "v": "주한 정치고문 베닝호프(H. Merrell Benninghoff)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "장소", "v": "경성(Seoul)"}, {"k": "전문번호", "v": "No. 1"}, {"k": "종류", "v": "보고서"}, {"k": "원문출처", "v": "740.00119 Control (Japan)/9–1545", "txt": true}], "links": [{"k": "FRUS", "text": "문서 781 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d781"}], "summary": "미군 인천 상륙 일주일 후 주한미군사령부가 본 한국 정세 분석이다. 남한을 '불씨만 닿으면 터질 화약통'으로 규정하고, 일본인 관리 문제, 정당 난립, 인플레이션, 소련군의 행태와 공산주의 선전, 남북 분단, 석탄·곡물 부족, 병력·정책 부재를 보고하면서 하지 중장의 대(對)맥아더 건의 8개 항을 전재한 첫 현지 보고다.", "points": ["이 분석은 주한미군사령관 하지(John R. Hodge) 중장이 맥아더 장군에게 보낸 것과 실질적으로 동일한 내용이며, 미군의 인천(Chemulpo) 첫 상륙 일주일 후 시점의 정세 평가", "일본군은 표면상 항복 조건을 받아들이고 점령 지역에서 철수·무장해제에 협조하는 듯하나, 남한 각지에서 약탈과 한국인 위협 보고가 들어오고 있음. 일본군을 조기에 일본으로 보내지 않으면 수용소에 넣어야 할 것", "남한은 불꽃만 닿으면 터질 화약통. 카이로 선언의 \"in due course\"가 한국어로 \"수일 내\" 또는 \"곧\"에 해당하게 번역되어 왔음이 최근 발견되었고, 그래서 한국인들은 미군 도착 직후 완전 독립이 주어지지 않은 이유를 이해하지 못함", "일본인 관리 제거는 여론상 바람직하나 당분간 실행이 어렵다. 이름만 해임하고 계속 일하게 해야 하며, 하급직 외에는 자격 있는 한국인이 없고, 일본 밑에서 고위직에 오른 한국인은 친일파로 미움을 받는다", "총독과 경무국장(둘 다 일본인)의 해임과 경성 지역 경찰 인력의 대대적 교체가 성난 한국인을 달래리라고 봄", "정당·단체 수가 불명일 정도로 난립. 9월 12일 하지 장군이 단체당 2명씩을 기준으로 정치단체 대표들에게 연설했으나 1,200명 이상이 참석. 공통된 생각은 일본인 재산 접수, 일본인 축출, 즉시 독립뿐이고 그 이상의 구상은 거의 없음", "8월 15일 이래 한국인 대부분이 장기 휴일 상태이며 독립을 노동으로부터의 해방으로 여기는 듯함. 한국은 선동가들에게 완전히 무르익은 땅", "정치 정세에서 가장 고무적인 단 하나의 요인은 경성에 있는 연장·고학력의 보수파 수백 명의 존재이며, 이들은 '임시정부'의 귀환을 지지하고 다수는 아닐지라도 아마 최대 단일 집단", "조선은행권 발행고가 3월 약 35억 엔에서 9월 12일 75억 엔으로 증가, 임금·물가가 폭등. 8월 15일 수준으로 물가를 고정하라는 지시는 이행이 어렵고 암시장만 강화할 것", "소련군은 몇몇 사례를 제외하면 38도선을 존중했으나 일본인·한국인 개인의 권리는 존중하지 않아 무차별 강간·약탈 보고가 계속되며, 소련 요원이 남한 전역에 정치사상을 퍼뜨리고 경성의 여러 행진·시위가 공산주의의 사주였음이 인정됨", "공산주의자들은 일본인 재산의 즉시 접수를 주장하며 치안에 위협이 될 수 있고, 훈련된 선동가들이 미군 지역에 혼란을 일으켜 한국인이 소련식 '자유'와 통제를 택하도록 만들려 하는 것으로 보임", "북측 러시아군 사령부와는 경성을 떠나지도 억류되지도 않았던 소련 총영사를 통해 접촉이 성립되었으나 아직 어떤 양해도 이루어지지 않음", "정치철학이 크게 다른 나라들의 군대가 공동 지휘 없이 한국을 둘로 나누어 점령하는 것은 불가능한 상황. 남한에는 수도와 통신 중심, 대부분의 곡물이, 북한에는 대부분의 석탄과 전력원이 있음", "미군 지역의 결정적 부족 물자는 석탄과 식량 곡물. 석탄은 북측과의 교통 차단 때문이고 러시아 측과의 교섭이 최우선 순위, 곡물은 작년 수확분의 대량 대일 반출 때문이며 10월 말 신곡 수확으로 완화될 전망", "일본 전시산업 붕괴로 수천 명의 실업자가 발생했고, 원료 부족으로 제조업이 정지 상태이며 일본군이 부리던 한국인을 방출함에 따라 겨울이 다가올수록 문제가 심각해질 것", "하지 장군은 일본군이 일본으로 철수하기 전에는 한국에 안정된 상태를 세울 수 없다고 보며, 부산(Fusan)을 통한 조기 일본군 이송 허가를 요청", "주한미군사령부의 두 가지 큰 난관: (1) 한국의 장래에 관한 미국과 연합국의 향후 정책에 대해 사령부가 아무 정보도 없다는 것, (2) 병력과 유능한 군정 요원이 너무 적어 제한된 지역에서만 작전할 수 있다는 것. 점령 지정 부대 전체의 조기 파견이 긴요", "부산에 정찰대를 파견하고, 수일 내 제주도(Saishu/Quelpart)에 병력을 보내 그곳의 일본군 6만 명을 무장해제할 준비 중", "한국 취재 신문기자단의 행태가 나빴다고 비판한다. 사전 지식·오리엔테이션 없이 미군 군복을 이용해 활보하고 개인적 비행을 저질렀으며, 일부는 한국 급진파에 대한 공공연한 동조로 한국 지도자들의 선동을 부추겼다고 본다", "하지 장군의 대(對)맥아더 건의 8개 항: (a) 한국의 정치·경제 장래에 관한 국제 정책을 수립·발표할 국제정책 차원의 통제기구를 경성에 설치, (b) 그때까지 한국 장래에 관한 명확한 정책 훈령을 주거나 장래를 말할 권한이 있는 워싱턴 관리를 참모진에 배치, (c) 정무 경험이 있고 동양인을 아는 유력 장교 확보, (d) 중경 망명정부를 연합국 후원 아래 임시정부로 한국에 귀환시켜 점령기 및 선거 가능 시점까지 명목상 대표(figurehead)로 삼는 방안 고려, (e) 한국 상공업 재건과 일본인 재산의 한국인 이전을 도울 미국 실업가들에게 문호 개방, (f) 종전 일본이 쓰던 통화를 폐기하는 새 통화정책의 조기 수립, (g) 향후 대한국 정책에 모든 일본 국민의 한국 지역 밖 이송을 포함, (h) 국제무역의 조기 재개", "베닝호프는 건의 a·b와 관련해 사령부의 극심한 곤란을 국무부에 환기하며, 대소(對蘇) 관계와 나날이 커지는 정치·사회·경제 문제 처리를 지도할 정책 훈령의 긴급 송부를 요청"], "primary": "각하: 미군이 인천(Chemulpo)에 첫 상륙을 한 지 일주일이 지난 시점에서 본 사령부가 보는 한국의 상황에 대한 간략한 분석을 제출하게 됨을 영광으로 생각합니다. 이 분석은 주한미군사령관(USAFIK) 존 R. 하지(John R. Hodge) 중장이 더글러스 맥아더(Douglas MacArthur) 장군에게 보낸 것과 실질적으로 동일합니다.[주70]\n\n표면상 일본인들은 항복 조건을 수락하였습니다. 점령 지역에서 그들은 철수와 무장해제에 협조하는 것으로 보였습니다. 그러나 남한(southern Korea)으로부터 그들이 약탈을 하고 한국인들을 위협하며 그 밖에도 그 특유의 방식으로 행동하고 있음을 시사하는 보고들이 들어오고 있습니다. 한국인들은 우리의 점령이 단편적일 뿐이며 주한미군사령부(USAFIK)가 전 지역에 퍼질 만한 충분한 병력을 갖고 있지 않다는 것을 이해하지 못하고 있습니다. 수송이 마련되는 대로 광범위한 장거리 순찰이 시작될 것이나, 일본군이 조속히 일본으로 보내지지 않는다면 그들을 수용소(concentration camps)에 넣는 것이 필요하게 될 것입니다.\n\n남한은 불꽃 하나만 닿으면 터질 준비가 된 화약통(powder keg)이라고 하는 것이 가장 적절한 서술일 것입니다. 최근에 밝혀진 바로는, 카이로 선언(Cairo Declaration)의 \"in due course(적절한 시기에)\"라는 문구의 한국어 번역이 처음부터 \"수일 내에\" 또는 \"머지않아\"에 해당하는 것이었으며, 잘 교육받은 한국인들조차 그 차이를 지적받고 놀라움을 표시하였습니다. 따라서 한국인들은 미군의 도착 직후에 완전한 독립이 주어지지 않은 이유를 이해하지 못하였습니다. 즉각적 독립과 일본인의 일소가 실현되지 않은 데 대한 큰 실망이 있습니다.\n\n일본인에 대한 한국인의 증오는 믿을 수 없을 만큼 격렬하지만, 미군이 감시하고 있는 한 그들이 폭력에 호소하리라고는 생각되지 않습니다.\n\n일본인 관리들의 제거는 여론의 견지에서 바람직하나 당분간은 실현하기 어렵습니다. 그들은 이름으로는 해임될 수 있으나 계속 일을 하도록 하여야 합니다. 정부에서든 공익사업과 통신에서든 하급 직위 외에는 자격을 갖춘 한국인이 없습니다. 더욱이 일본인 아래에서 고위직에 오른 한국인들은 친일적이라고 간주되어 그 주인들만큼이나 미움을 받고 있습니다. 현재 가장 어려운 두 가지 문제는 다음과 같습니다: 한국인들이 계속 [1050면] 일본인의 명령에 복종하고 있다는 것, 그리고 경찰 부서의 상황과 경찰 하급 구성원들 사이의 상황이 나쁘다는 것입니다. 총독(Governor General)과 경무국장(Director of the Police Bureau) — 둘 다 일본인입니다 — 의 해임과 아울러 경성(Seoul) 지역 경찰 인원의 대대적 교체가 이루어진다면, 비록 그로써 정부 자체가 강화되지는 않더라도 성난 한국인들을 달래 줄 것으로 생각됩니다.\n\n한국에는 알 수 없는 수의 정당과 단체들이 있으며, 그중 다수는 일본의 항복이 발표된 이래 우후죽순처럼 생겨난 것입니다. 오랜 억압의 기간과 지하 활동의 어려움이 뚜렷한 성격의 정치 집단의 형성을 가로막아 왔습니다. 9월 12일 하지 장군은 각 단체에서 2명씩이라는 기준으로 정치 단체 대표들에게 연설하였습니다. 1,200명이 넘는 인원이 그 모임에 참석하였습니다. 모든 단체가 일본인 재산의 접수, 일본인의 한국으로부터의 축출, 즉각적 독립의 달성이라는 공통된 생각을 갖고 있는 것으로 보입니다. 그 이상으로는 그들에게 생각이 거의 없습니다.\n\n거의 모든 한국인이 8월 15일 이래 장기간의 휴일을 보내고 있습니다. 그들에게 독립이란 분명 노동으로부터의 자유를 뜻하며, 장래에 대한 생각은 하지 않고 \"하늘이 알아서 주시겠지\" 하는 식입니다. 우리가 도착한 이래 이 지역에서 근로의 기색은 없었고 정상적인 생업으로 돌아가려는 관심도 없었습니다. 하지 장군과 그 밖의 인사들은 한국인들이 자기 일자리를 지키고 자기 나라를 세워야 할 필요성을 끊임없이 강조해 왔습니다만, 그들은 일본인들이 여전히 대부분의 상공업 시설을 소유하거나 통제하고 있다는 사실과 이 생각을 조화시키기 어려워합니다. 한국은 선동가들에게 완전히 무르익어 있습니다.\n\n정치 정세에서 가장 고무적인 단 하나의 요인은, 연장자이며 보다 잘 교육받은 한국인들 가운데 수백 명의 보수주의자들이 경성에 있다는 것입니다. 비록 그들 중 다수가 일본인 밑에서 복무한 바 있으나 그 오명은 결국에는 사라질 것입니다. 그러한 인물들은 \"임시정부(Provisional Government)\"의 귀환을 지지하며, 다수를 이루지는 못할지라도 아마도 최대의 단일 집단일 것입니다.\n\n통화 제도는 여전히 물음표입니다. 주한미군사령부가 쓸 수 있는 소수의 조사관들이 실태 파악에 힘쓰고 있으며, 현재의 징후로는 인플레이션이 진행 중이고 통제가 불가능할 수도 있습니다. 조선은행권(Bank of Chosen notes)의 유통고는 3월의 약 35억 엔에서 9월 12일 75억 엔으로 증가하였습니다. 그 결과 임금과 물가가 당장은 통제할 수 없을 정도로 치솟았습니다. 노동은 하루에 약 30엔이 들며 그 밖의 물가도 마찬가지로 높습니다. 주한미군사령부는 물가를 8월 15일 수준으로 고정하라는 지시를 받았으나, 이는 달성하기 어려울 것이며 이미 확고히 자리 잡은 암시장을 강화하기만 할 것입니다.\n\n소수의 사례를 제외하면 소련군은 38도 경계를 존중해 왔습니다. 그러나 그들은 일본인이든 한국인이든 개인의 권리를 존중하지 않았으며, [1051면] 소련군이 점령한 모든 지역으로부터 무차별적인 강간, 약탈, 노략에 관한 보고가 끊임없이 들어오고 있습니다. 소련의 요원들이 남한 전역에 그들의 정치사상을 퍼뜨리고 있다는 데에는 의심의 여지가 거의 없으며, 경성에서의 여러 차례의 행진과 시위는 공산주의의 사주에 의한 것임이 인정되고 있습니다. 공산주의자들은 일본인 재산의 지금 당장의 접수를 주장하고 있으며 법과 질서에 대한 위협이 될 수 있습니다. 잘 훈련된 선동가들이 우리 지역에 혼란을 일으켜 한국인들로 하여금 미국을 배척하고 소련의 \"자유\"와 통제를 택하게 만들려 하고 있을 개연성이 있습니다. 남한은 그러한 활동에 비옥한 토양인데, 이는 주한미군사령부가 통제 지역을 신속히 확대하기에 충분한 병력을 갖고 있지 않기 때문입니다.\n\n주한미군사령부와 북쪽의 러시아군 사령부 사이에는, 자기 자리를 떠난 적도 억류된 적도 없는 이곳의 소련 총영사를 통하여 접촉이 성립되었습니다. 아직 어떠한 양해도 이루어지지 않았으나 확정적인 정보가 곧 입수될 수도 있습니다.\n\n정치철학이 크게 다른 나라들의 군대가 공동의 지휘 없이 한국을 두 부분으로 나누어 점령한다는 것은 불가능한 상황입니다. 남한에는 통신의 중심인 수도가 있습니다. 또한 곡물의 대부분도 남한에 있습니다. 북한에는 석탄의 대부분과 전력의 원천이 있습니다.\n\n우리 지역에는 두 가지 결정적인 부족이 있습니다. 석탄과 식량 곡물입니다. 석탄이 부족한 것은 북쪽과의 교통이 차단되었기 때문이며, 이 문제에 관한 러시아 측과의 교섭은 최우선 순위를 갖고 있습니다. 곡물이 부족한 것은 작년 수확분이 일본으로 대량 반출되었기 때문입니다. 이 상황은 10월 말에 새로운 풍작이 수확되면 완화될 것입니다. 식량 배급은 철도가 제대로 운행되지 않고 자동차 수송이 부족하기 때문에 어렵습니다. 주한미군사령부는 식량 배급을 돕기 위하여 일본군의 수송 시설을 수리하는 데 가능한 모든 일을 하고 있습니다.\n\n위에서 서술한 자발적 실업자 외에도, 일본 전시 산업의 붕괴로 인하여 수천 명의 한국인이 일자리를 잃고 있습니다. 원료의 부족으로 제조업은 정지 상태이며, 전시 체제에서 평시 체제로 전환할 당장의 전망은 없습니다. 여기에 일본군이 부리던 많은 한국인을 방출하는 일이 더해져, 이 문제는 겨울이 다가옴에 따라 점점 더 어려워질 것입니다.\n\n하지 장군은 일본군이 일본으로 옮겨지기 전에는 한국에 안정된 상태가 확립될 수 없다고 보고 있습니다. 한국에서의 복원(demobilization)은 불가능하며, 일본군은 편성된 부대 상태로 유지되었다가 무장해제가 완료되는 대로 일본으로 옮겨져야 할 것입니다. 그들을 수용소에 넣지 않는 한 효과적으로 통제할 수 없는데, 수용소에 넣으면 주한미군사령부가 그들을 먹이고 재워야 할 것입니다. [1052면] 주한미군사령부는 가능한 한 이른 시일 안에 부산(Fusan)을 통하여 일본군을 이동시킬 것을 허가해 달라고 요청하였습니다.\n\n주한미군사령부는 두 가지 큰 난관 아래에서 활동하고 있으며, 그 어느 것도 이곳에서는 시정할 수 없습니다. 첫째는 본 사령부가 한국의 장래에 관한 미국이나 그 연합국들의 향후 정책에 관하여 아무런 정보도 갖고 있지 않다는 것입니다. 이 나라에 무슨 일이 일어날 것이며, 지금 거의 완전해진 국토의 두 부분으로의 분할에 대한 해결책은 무엇이겠습니까? 당면한 군사적 필요를 넘어선 우리의 일반적 정책은 무엇이 되겠습니까? 둘째 난관은 주한미군사령부의 병력이 적고 유능한 군정 요원과 그 밖의 장교가 너무 적어서 제한된 지역에서 그리고 전반적 효과는 거의 없이 활동할 수밖에 없다는 것입니다. 통제 지역의 확대가 긴급히 필요하며, 소규모 집단이라면 이 나라의 어느 지역에라도 안전하게 진출할 수 있겠으나 그들의 존재가 매우 큰 동요를 일으켜 경찰 및 행정 기능이 붕괴할 수도 있는 반면 미국 측은 그 지역의 통제를 인수할 만한 충분한 인원을 갖고 있지 못할 것입니다. 한국 점령을 위해 지정된 전 병력이 가능한 한 조속히 이곳으로 보내지는 것이 긴요합니다.\n\n오늘 밤 정찰대가 며칠간 머무를 예정으로 부산으로 떠날 것이며, 수일 내에 제주도(Saishu, Quelpart)에 병력을 보내어 그곳의 일본군 6만 명을 무장해제하기 위한 준비가 진행되고 있습니다.\n\n한국을 취재하는 신문 특파원들은 집단으로서 좋지 못한 행동을 하였습니다. 그들은 우리의 상륙 후에 항공편으로 도착하였는데, 대부분은 일본에서 왔고 현지 사정에 대한 지식이 없었으며 오리엔테이션도 받지 않은 채 미군 군복을 이용하여 이 지역을 마구 돌아다니며 개인적인 비행을 저질렀습니다. 그들 중 일부는 한국 급진파에 대한 공공연한 동조로써 한국인 단체 지도자들을 부추겨, 모든 것을 뒤엎고 한국인이 즉각 모든 기능을 인수하도록 하라는 선동에 더욱 힘쓰게 하였다고 믿을 만한 이유가 있습니다. 그들은 현존하는 사정에 대해 조금이라도 알게 되기도 전에 점령에 관련된 미국의 모든 정책과 총사령부 및 본 사령부의 모든 정책을 매우 비판하였습니다. 이 후자의 사정은 그들이 전체 상황을 보기 시작함에 따라 이제 서서히 스스로 시정되고 있습니다. 한 무리는 어느 날 오후 항공편으로 도착하여 그날 저녁에 기사를 송고하고 이튿날 아침에 떠나면서, 한국 점령에 관해 모든 것을 안다고 느끼고 있었습니다.\n\n하지 장군은 맥아더 장군에게 다음과 같은 건의를 하였습니다:\n\n> \"다음과 같이 건의함:\n>\n> a. 한국의 정치적·경제적 장래에 관한 국제 정책을 수립하고 발표할 목적으로, 국제 정책 차원의 통제 기구를 경성(Keijo)에 설치할 것. 이 기구는 가치 있고 실효성이 있으려면 현지에서 기능하여야 함.\n>\n> b. 건의 a가 완성될 때까지, 본관에게 한국의 장래에 관한 정책에 관하여 명확한 훈령을 주거나, 또는 [1053면] 장래에 관하여 말할 권한을 가진 워싱턴의 관리들을 본관의 참모진에 추가할 것. 이러한 취지의 건의는 본관의 국무부 대표에 의해서도 송부된 바 있음.\n>\n> c. 정무(政務)에 경험이 있고 동양인을 아는 유력한 장교들을 본관의 참모진에 확보하기 위하여 모든 노력을 기울일 것.\n>\n> d. 중경(Chungking)의 망명정부를 연합국의 후원 아래 임시정부로서 한국에 귀환시켜, 점령 기간 동안 그리고 한국 국민이 선거를 치를 수 있을 정도로 안정될 때까지 명목상의 대표(figureheads)로 활동하게 하는 방안을 고려할 것.\n>\n> e. 한국의 상업과 공업을 재건하는 데 도울 수 있고 도우려 하며 일본인 재산의 한국인에의 이전을 실현하는 데 조력할 미국 실업가들에게 문호를 개방할 것.\n>\n> f. 종전에 일본인이 사용해 온 어떠한 통화의 사용도 폐기하는 새로운 통화 정책을 조기에 수립할 것.\n>\n> g. 한국에 대한 향후 정책에 모든 일본 국민을 이 지역에서 제거하는 것을 포함시킬 것.\n>\n> h. 국제 무역을 조기에 재개할 것.\"\n\n건의 \"a\" 및 \"b\"와 관련하여, 본관은 본 사령부가 그 아래에서 활동하고 있는 극히 큰 어려움에 대하여 국무부의 주의를 환기하고자 하며, 주한미군사령부가 러시아 측과의 관계에서, 그리고 날마다 계속 늘어나는 심각한 정치적·사회적·경제적 문제들의 처리에서 지침으로 삼을 정책 훈령의 긴급한 송부를 요청하고자 합니다.\n\n경구(敬具),\n\nH. 메릴 베닝호프(H. Merrell Benninghoff)", "secondary": "740.00119 Control (Japan)/9–1545\n\nThe Political Adviser in Korea (Benninghoff) to the Secretary of State\n\nNo. 1\n\n[Seoul,] 15 September, 1945.\n[Received September 28.]\n\nSir: I have the honor to submit a brief analysis of conditions in Korea as seen by this headquarters one week after the first landings by American forces were made at Chemulpo. This analysis is substantially the same as that sent by Lieutenant General John R. Hodge, Commanding the United States Army Forces in Korea (USAFIK), to General Douglas MacArthur.[주70]\n\nOn the face the Japanese have accepted the terms of surrender. In the area of occupation they have appeared to cooperate in withdrawing and disarming. However, reports are received from southern Korea indicating that they are looting and intimidating the Koreans and otherwise behaving in characteristic fashion. The Koreans do not understand that our occupation is only piecemeal and that USAFIK does not have enough troops to spread over the entire area. Extensive long-range patrols will start as soon as transportation can be arranged, but unless the Japanese forces are sent to Japan soon it will be necessary to put them in concentration camps.\n\nSouthern Korea can best be described as a powder keg ready to explode at the application of a spark. It was recently discovered that from the beginning the Korean translation of the term “in due course” in the Cairo Declaration has been the equivalent of “in a few days” or “very soon”, and well-educated Koreans expressed surprise when the difference was pointed out to them. Hence the Koreans did not understand why they were not given complete independence soon after the arrival of American troops. There is great disappointment that immediate independence and sweeping out of the Japanese did not eventuate.\n\nAlthough the hatred of the Koreans for the Japanese is unbelievably bitter, it is not thought that they will resort to violence as long as American troops are in surveillance.\n\nThe removal of Japanese officials is desirable from the public opinion standpoint but difficult to bring about for some time. They can be relieved in name but must be made to continue work. There are no qualified Koreans for other than the low-ranking positions, either in government or in public utilities and communications. Furthermore, such Koreans as have achieved high rank under the Japanese are considered pro-Japanese and are hated almost as much as their masters. The two most difficult problems at present are: The Koreans continue [1050면] to be subject to Japanese orders, and conditions in the police department and among the rank and file of the police are bad. It is believed that the removal of the Governor General and the Director of the Police Bureau, both Japanese, accompanied by wholesale replacements of police personnel in the Seoul area will mollify irate Koreans even though the government itself is not strengthened thereby.\n\nThere are an unknown number of political parties and groups in Korea, many of which have mushroomed since the Japanese surrender was announced. The long period of oppression and the difficulty of underground activity have prevented the formation of clear-cut political groups. On September 12, General Hodge spoke to representatives of political groups on the basis of two persons from each group. More than twelve hundred attended the meeting. All groups seem to have the common ideas of seizing Japanese property, ejecting the Japanese from Korea, and achieving immediate independence. Beyond this they have few ideas.\n\nAlmost all Koreans have been on a prolonged holiday since August 15. To them independence apparently means freedom from work; no thought is given to the future, “the Lord will provide”. There has been no show of industry in this area since our arrival and no interest in returning to normal pursuits. General Hodge and others have constantly stressed the necessity for Koreans to stay on the job and to build up their own country, but they find it difficult to reconcile this idea with the fact that the Japanese still own or control most business and industrial establishments. Korea is completely ripe for agitators.\n\nThe most encouraging single factor in the political situation is the presence in Seoul of several hundred conservatives among the older and better educated Koreans. Although many of them have served with the Japanese, that stigma ought eventually to disappear. Such persons favor the return of the “Provisional Government” and although they may not constitute a majority they are probably the largest single group.\n\nThe monetary system is still a questionmark. The few investigators available to USAFIK are endeavoring to ascertain conditions and present indications are that inflation is underway and may not be controllable. The circulation of Bank of Chosen notes increased from about 3.5 billion yen in March to 7.5 billion yen on September 12. The result has been that wages and prices have skyrocketed beyond immediate control. Labor costs about thirty yen a day, and other prices are similarly high. Although USAFIK was directed to peg prices at the August 15 level, this will be difficult to accomplish and will only strengthen the already well-established black market.\n\nExcept in a few instances the Soviets have respected the 38 degree boundary. However, they have not respected the rights of individuals, [1051면] either Japanese or Korean, and constant reports of indiscriminate rape, pillage and looting are received from all areas occupied by Soviet forces. There is little doubt that Soviet agents are spreading their political thought throughout southern Korea, and several parades and demonstration in Seoul have admittedly been communist-inspired. Communists advocate the seizure now of Japanese properties and may be a threat to law and order. It is probable that well-trained agitators are attempting to bring about chaos in our area so as to cause the Koreans to repudiate the United States in favor of Soviet “freedom” and control. Southern Korea is a fertile ground for such activities because USAFIK lacks sufficient troops to expand its area of control rapidly.\n\nContact has been established between USAFIK and Russian headquarters to the north through the Soviet Consul General here, who never left his post or was interned. No understandings have been reached but definite information may be available soon.\n\nThe splitting of Korea into two parts for occupation by armed forces of nations having widely divergent political philosophies, with no common command, is an impossible situation. Southern Korea contains the capital city, which is the center of communications. It also has most of the cereal crops. Northern Korea has most of the coal as well as the sources of electric power.\n\nThere are two critical shortages in our area: coal and food cereals. Coal is short because communications to the north have been cut; negotiations on the subject with the Russians have the highest priority. Cereals are short because of large shipments of last year’s crop to Japan. This situation should ameliorate when the new and good crop is harvested at the end of October. Food distribution is difficult because the railways are not functioning properly and motor transportation is lacking. USAFIK is doing everything possible to repair Japanese Army transportation facilities to assist in the distribution of food.\n\nIn addition to the voluntarily unemployed, as described above, there are thousands of Koreans out of work because of the collapse of Japanese war industries. Manufacturing is at a standstill because of the lack of raw materials, and there is no immediate prospect of converting from a war to a peace footing. This problem, to which is added the release by the Japanese Army of many Koreans utilized by them, will become increasingly difficult as winter approaches.\n\nGeneral Hodge feels that stable conditions cannot be established in Korea until the Japanese Army has been removed to Japan. Demobilization in Korea is impossible, and the army will have to be kept in formed bodies and removed to Japan as soon as its disarming is completed. It cannot be effectively controlled unless put into concentration camps, where it would have to be fed and housed by USAFIK. [1052면] USAFIK has requested permission to move the Japanese Army through Fusan at the earliest practicable date.\n\nUSAFIK is operating under two great difficulties, neither of which can be corrected at this end. The first is that this headquarters has no information in regard to the future policy of the United States or its allies as to the future of Korea. What is going to happen to the nation and what will be the solution of the now almost complete division of the country into two parts? What will be our general policies beyond immediate military necessity? The second difficulty is that USAFIK is in small strength, and has too few competent military government and other officers that it can operate only in a limited area and with little overall effect. There is urgent need for expansion of areas of control, and although small groups could venture with safety into any part of the country, their presence would be so disturbing that police and governmental functions might break down while the Americans would not have sufficient personnel to take over the control of the area. It is essential that the entire force designated for the occupation of Korea be sent here as soon as possible.\n\nA reconnaissance party will leave for Fusan tonight, for a stay of a few days, and arrangements are being made to send a force to Saishu (Quelpart) Island in a few days to disarm the 60,000 Japanese troops there.\n\nThe newspaper correspondents covering Korea as a group have behaved badly. They arrived by air after our landing, most of them from Japan with no knowledge of the local situation and without orientation took advantage of the American uniform to run rampant over the area, committing acts of personal misbehavior. There is reason to believe that by open sympathies with Korean radicals some of them have incited Korean group leaders to greater efforts at agitation for overthrow of everything and to have the Koreans take over all functions immediately. Before they got any glimmer of conditions as they existed, they were highly critical of all policies of the nation, of General Headquarters and of this headquarters relating to the occupation. This latter condition is now rectifying itself slowly as they begin to see the picture. One group arrived by air one afternoon, filed stories that evening and left the next morning, feeling that they knew all about the Korean occupation.\n\nGeneral Hodge has made the following recommendations to General MacArthur:\n\n“It is recommended that: a.A control group on an international policy level be established at Keijo for the purpose of establishing and announcing international policies concerning the political and economic future of Korea. This group must function on the ground to be worthwhile and effective. b.Pending consummation of recommendation a., I be given definite instructions as to policy with respect to the future of Korea or that [1053면] Washington officials empowered to speak of the future be added to my staff. Recommendation along this line has also been forwarded by my State Department representative. c.Every effort be made to get high-powered officers for my staff who are experienced in governmental affairs and who know orientals. d.Consideration be given to returning the Chungking Government in exile to Korea as a provisional government under Allied sponsorship to act as figureheads during occupation and until Korean people stabilize to where there can be an election. e.The door be opened to American business men who can and will help reestablish Korean business and industry and assist in effecting transfer of Japanese property to Koreans. f.Early establishment of a new monetary policy abandoning the use of any currency that has formerly been used by the Japanese. g.Future policy for Korea include removal of all Japanese nationals from the area. h.International trade be reestablished at an early date.”\n\nWith reference to recommendations “a” and “b” I should like to call the attention of the Department to the extremely great difficulties under which this headquarters is operating, and to request the urgent transmission of policy directives which will guide USAFIK in its relations with the Russians and in its treatment of the serious political, social and economic problems which continue to mount from day to day.\n\nRespectfully yours,\n\nH. Merrell Benninghoff", "notes": ["[주70] 9월 13일."], "warn": false, "pages": [1048, 1049, 1050, 1051, 1052, 1053], "search": "H. Merrell Benninghoff H. 메릴 베닝호프 (주한 정치고문) John R. Hodge 존 R. 하지 (주한미군사령관, 중장) Douglas MacArthur 더글러스 맥아더 (연합국 최고사령관)"}, {"id": "d782", "order": 782, "date": "1945-09-21", "group": "B", "eyebrow": "d782 · The Acting Secretary of State to the Ambassador in China (Hurley)", "title": "국무장관 대리가 주중 미국대사(헐리)에게", "badge": "", "list_right": "문서 782", "meta": [{"k": "일자", "v": "1945-09-21"}, {"k": "발신", "v": "국무장관 대리(Acheson)", "txt": true}, {"k": "수신", "v": "주중 미국대사(Hurley)", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": "1510"}, {"k": "종류", "v": "전보"}, {"k": "원문출처", "v": "895.01/9–1745: Telegram", "txt": true}], "links": [{"k": "FRUS", "text": "문서 782 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d782"}], "summary": "미국 및 중국에 있는 한인들의 귀국 문제에 대해 국무부는 전구사령관과 협의를 거치는 것을 조건으로 이의가 없다고 통보한다.", "points": ["이승만 및 미국 내 다른 한인들의 귀국 신청에 대해, 전구사령관과 문제가 정리되는 것을 조건으로 국무부는 이의가 없다고 밝혔다", "중국에 있는 한인들의 귀국에 대해서도 전구사령관들과 협의하여 그들이 반대하지 않는다면 국무부는 이의가 없다", "중국 주재 미군 당국의 수송 편의 제공은 세 가지 조건 아래에서만 이루어진다는 것이 국무부의 이해다", "조건 (1) 한인들이 어떤 '임시정부'의 관리 자격이 아니라 사인(私人) 자격으로 갈 것", "조건 (2) 모든 한인 단체에 동등한 특전과 편의가 주어질 것, (3) 육군 당국이 중요한 작전을 방해하지 않고 수송을 제공할 수 있을 것", "한국 주둔 미군은 이미 통역을 보유하고 있으며 추가로 파견되고 있는 것으로 이해한다"], "primary": "1510. 미국에 있는 이승만(Syngman Rhee) 및 그 밖의 한인들이 한국으로 귀환하도록 허가받게 해 달라는 신청과 관련하여, 국무부는 이 문제가 전구사령관(theater commander)과 정리되는 것을 조건으로 그러한 귀환에 아무런 이의가 없다고 밝힌 바 있다.[주71]\n\n[1054면]\n\n한국으로 귀환하기를 희망하는 중국 내 한인들과 관련해서는(대사관 전보 1485호 8월 81일; 1573호 9월 12일; 1605호 9월 17일[주72]), 전구사령관들과 협의가 이루어지고 그들이 반대하지 않는다면 국무부는 이의가 없다. 중국 주재 미군 당국이 이들 한인의 수송 편의 확보를 지원하는 것은 오직 다음의 경우에 한한다는 것이 국무부의 이해다. (1) 한인들이 어떤 \"임시정부\"의 관리로서가 아니라 사인(私人)으로서 갈 것, (2) 모든 한인 단체에 동등한 특전과 편의가 부여될 것, (3) 육군 당국이 중요한 작전을 방해하지 않고 수송을 제공할 수 있을 것.\n\n한국에 있는 미군 부대는 이미 통역을 보유하고 있으며 더 많은 통역이 파견되고 있는 것으로 우리는 이해한다.\n\n애치슨(Acheson)", "secondary": "895.01/9–1745: Telegram\n\nThe Acting Secretary of State to the Ambassador in China (Hurley)\n\nWashington, September 21, 1945—4 p.m.\n\n1510. In regard to applications of Syngman Rhee and other Koreans in United States to be permitted to return to Korea Dept has stated it perceives no objection to such return provided that matter is cleared with theater commander.[주71]\n\n[1054면]\n\nWith regard to Koreans in China desiring to return to Korea (Embtels 1485, August 81; 1573, Sept 12; and 1605, Sept 17[주72]), Dept perceives no objection if the theater commanders are consulted and they do not disapprove. It is the Dept’s understanding that American military authorities in China will assist these Koreans in obtaining transportation facilities only if (1) Koreans go as private individuals and not as officials of any “provisional government”, (2) equal privileges and facilities are accorded all Korean groups, and (3) Army authorities can supply transportation without interfering with important operations.\n\nIt is our understanding that American forces in Korea already have interpreters and that more are being sent.\n\nAcheson", "notes": ["[주71] 9월 14일자로 이승만 씨와 재미한족연합위원회(United Korean Committee in America)의 J. 규앙 던(J. Kyuang Dunn)에게 보낸 서한들. 어느 것도 수록하지 않음. 8월 28일자로 국무장관 및 국무차관보 던(Dunn)에게 보낸 각서에서 극동국장 밸런타인(Ballantine)은 미국 관리가 이승만 씨를 수행하는 데 반대하였는데, \"그것이 이 정부가 이른바 '대한민국임시정부(Provisional Government of Korea)'를 한국의 장래 정부로 선호한다는 인상을 줄 수 있기 때문\"이라는 것이었다. 국무장관도 이에 동의하였다. (895.01/8–1545) 9월 24일자로 극동국장 빈센트(Vincent)에게 보낸 각서에서 일본과장 디코버(Dickover)는 다음과 같이 진술하였다. \"이 박사에게 그의 여행 서류를 사증과(Visa Division)에 반환하여 유효화 절차를 밟도록 하는 것이 제안되었다. 이 박사는 한국 입국을 위한 군 허가증에 '한국으로 돌아가는 주미 고등판무관(High Commissioner to the United States returning to Korea)'으로 기재되어 있는데, 합동참모본부(JCS)의 스위니(Sweeney) 대령은 지난 금요일 그 허가증이 '한국으로 돌아가는 한국인(Korean national returning to Korea)' 또는 사증과가 쓰고자 하는 다른 어떤 문구로 바뀔 것이라고 밝혔다.\" (895.01/9–2445)", "[주72] 전보 1605호는 수록하지 않음. 다만 1046면 각주 62를 참조할 것."], "warn": false, "pages": [1053, 1054], "search": "Syngman Rhee 이승만 Dean Acheson 딘 애치슨(국무장관 대리) Patrick J. Hurley 패트릭 헐리(주중 미국대사) J. Kyuang Dunn J. 규앙 던(재미한족연합위원회) Joseph W. Ballantine 조지프 밸런타인(극동국장) James C. Dunn 제임스 던(국무차관보) John Carter Vincent 존 카터 빈센트(극동국장) Erle R. Dickover 얼 디코버(일본과장) Sweeney 스위니(합동참모본부 대령)"}, {"id": "d783", "order": 783, "date": "1945-09-24", "group": "A", "eyebrow": "d783 · Memorandum by Lieutenant General John R. Hodge to General of the Army Douglas MacArthur at Tokyo", "title": "존 R. 하지 중장이 도쿄의 육군원수 더글러스 맥아더에게 보낸 각서", "badge": "", "list_right": "문서 783", "meta": [{"k": "일자", "v": "1945-09-24"}, {"k": "발신", "v": "존 R. 하지(John R. Hodge) 중장", "txt": true}, {"k": "수신", "v": "도쿄의 육군원수 더글러스 맥아더(Douglas MacArthur)", "txt": true}, {"k": "장소", "v": "[경성(Seoul)]"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "895.01/9–2645", "txt": true}], "links": [{"k": "FRUS", "text": "문서 783 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d783"}], "summary": "주한미군사령관 하지 중장이 한국의 상황을 보고하며, 정책이 판이한 두 점령지대로의 38도선 분할이 한국을 하나의 국가로 통일하는 데 넘을 수 없는 장애이며 즉각적인 국제적 조치로 전(全)한국 임시정부를 수립하지 않으면 사태를 평화적으로 바로잡을 수 없다고 보고한다.", "points": ["일본인에 대한 한국인의 태도나 독립에 대한 태도에는 변화가 없으며, 인천–경성 지역에서는 표면적으로 진정되고 있으나 연합국의 의도에 대한 뿌리 깊은 불신이 커지고 있다", "많은 지식 있는 한국인들은 연합국이 한국을 하나의 국가로 세울 의사가 없다는 결론에 이미 도달했고, 노년층은 러일전쟁 전 러·일 간 같은 경계선의 분할 잠정합의를 상기하며 러시아가 옛 요구를 다시 내밀고 있다고 믿는다", "정책이 판이한 두 점령지대로의 분할은 한국의 통일에 넘을 수 없는 장애이며, 공동 정책 아래 점령군의 전폭적 지원을 받는 전(全)한국 임시정부를 국제적 차원에서 즉시 수립하지 않으면 미국의 명예를 지키며 평화적으로 시정하기 불가능한 상황이 된다", "한국은 일본의 완전한 통제 없이는 일본 제국의 일부였던 적이 없으며, 그렇게 취급하면 한국인의 영구한 적대를 산다. 일본 통제가 깨진 직후의 수용적 국면이 파벌을 통합하고 민주주의 형성 교육을 시작할 시기다", "남북 어느 쪽도 상호 교류 없이는 자립할 수 없으나 현재 왕래는 38도선 이북에서 남으로 오는 피난민뿐이고 그 역은 없다", "소련과의 군사적 차원 교섭은 거의 성과가 없고, 유일한 성과는 함흥(Kanko) 포로수용소 수용자들을 빼낸 것이다. 서울 이북 지역에서는 소련군이 전력을 끊었다", "군정은 당분간 사소한 기능을 제외하고 전면적·전적으로 수행해야 할 것으로 보이며, 기존 통치 기구는 일본의 통제와 피지배민 착취를 위해 지어져 민주적 통치에 부적합하다", "제40사단 1개 전투단이 9월 22일 인천에 도착, 부산으로 이동 중이며 부산항 개방과 석탄 확보가 시급하다. 부산 장악 즉시 일본군의 일본 송환을 개시한다", "권고: 앞선 서한의 권고를 재차 제기하며, 한국에서 접수한 모든 무기·탄약을 파괴하거나 영구히 사용 불능으로 만들 권한을 부여할 것을 추가로 권고한다"], "primary": "건명: 한국의 상황(Conditions in Korea).\n\n1. 같은 건명의 1945년 9월 13일자 본관의 서한[주74]을 참조 바람. 본 문서는 그에 대한 보충이다. 상황의 주된 변화는 큰 이동이 있었다기보다는 그림이 한층 더 펼쳐진 성격의 것이다.\n\n2. 일본인(Japs)에 대한 한국인의 태도 및 독립에 대한 그들의 태도에는 변화가 없다. 인천(Jinsen)–경성(Seoul, Keijo) 지역에서 한국인들은 표면적으로는 안정되기 시작하고 있다. 행렬과 시위가 줄었고 소리 높인 항의도 줄었다. 그러나 연합국의 의도에 대한 뿌리 깊은 불신이 커지고 있으며, 정책이 그토록 크게 엇갈리는 군대들이 점령한 두 개의 점령지대로 38도선을 따라 한국을 분할한 것에 대한 실질적인 불만이 커지고 있다. 많은 지각 있는 한국인들은 연합국들이 한국을 하나의 국가로 세울 의사가 없다는 결론에 이미 도달하였다. 나이 든 한국인들은 러일전쟁 전에 러시아와 일본 사이에 같은 경계선을 따라 한국을 분할하기로 한 잠정적 합의가 있었음을 상기하며, 러시아가 다시금 그 옛 요구를 노리고 있다고 믿는다. 지금까지의 정책에 비추어 볼 때 [1055면] 한국 독립에 관한 연합국의 약속이 진실하다는 믿음을 그들에게 북돋울 만한 것이 거의 없다. 북한(Northern Korea)에서 나오는 정보는 어느 오스트레일리아 신문 특파원이 본관에게 제출한 첨부 진술서의 내용과 같은 취지다.[주75]\n\n3. 무수한 정당들의 크게 엇갈리는 활동이 바람직하지 않다는 인식이 많은 한국인들 사이에서 커지고 있는 것으로 보인다. 그러나 다수의 목소리 높인 표현이 줄어들고 있다는 점 외에는 현재까지 이들 정당이 실질적으로 감소하지는 않았다. 파벌들 사이에 실무적 합의를 이끌어내고 서로에 대한 반목의 저류와 의심을 털어내는 일은 여전히 불가능하다.\n\n4. 본관은 정책이 크게 엇갈리는 두 개의 점령지대로 한국을 현재와 같이 분할해 놓은 것이 한국을 하나의 국가로 통일하는 데 넘을 수 없는 장애라고 본다. 본관의 견해로는, 연합국들은 이 분할로 인하여, 공동의 정책 아래 점령군의 전폭적인 지원을 받게 될 전반적(overall) 임시정부를 수립하기 위한 즉각적인 국제적 차원의 조치가 나오지 않는 한, 미국의 명예를 지키면서 평화적으로 바로잡기가 불가능한 상황을 만들어 놓았다. 러시아를 제외하고는 어느 열강도 여기에 걸린 문제들을 진지하게 생각해 본 적이 없는 것으로 보인다. 한국은 일본 제국의 일부가 아니며, 일본의 완전한 통제가 없었다면 결코 그 일부였던 적이 없다. 또한 그렇게 취급하는 나라들에 대한 한국인들의 영구한 적대를 사지 않고서는 한국을 그렇게 취급할 수 없다. 이 나라는 자신들을 일본인으로부터 풀어주는 것이라면 무엇이든 받아들일 만큼 무르익어 있으나, 과거의 역사 때문에 지금은 어떤 형태의 민주적 정부에 대해, 특히 미국에 대해 가장 호의적이다. 일본의 통제가 깨진 직후의 이 수용적인 국면이야말로 파벌들을 통합하고 민주주의에 관한 형성 교육을 시작할 시기다. 대립하는 이념 아래 이 나라를 두 부분으로 갈라놓은 상태를 계속하는 것은 치명적일 것이다. 나아가 두 지역 어느 쪽도 상호 간의 완전한 호혜 없이는 조금도 자급할 수 없다. 현재로서는 38도선 이북에서 상당한 수의 피난민이 남으로 내려오고 있을 뿐 그 반대는 없으며, 그 외에 어떠한 호혜도 없다.\n\n5. 소련 측과 군사적 차원에서 어떤 형태로든 실행 가능한 합의를 이루기 위한 노력이 계속되고 있으나 지금까지는 거의 결실이 없다. 현재까지의 유일한 성과는 함흥(Kanko) 포로수용소 수용자들을 데리고 나온 것인데, 이는 교섭이 시작된 지 약 10일 만에, 그리고 준비 문제를 둘러싼 숱한 역풍과 번복을 겪은 뒤에야 이루어졌다. 교환할 연락반의 신고 일자와 장소에 관해 본관은 아직도 러시아 측의 통보를 기다리고 있다. [1056면] 38도선을 따라 접촉하는 부대들의 관계는 지난번 보고 이후 서울 이북 지역에서 소련군이 전력을 끊은 것을 제외하고는 특이한 사건이 없었다.\n\n6. 현시점에서 한국의 \"군정(Military Government)\"은 당분간 사소한 기능을 제외하고는 완전하고 전면적인 것이 되어야 할 것으로 보인다. 여기서 정부였던 것의 구조 안으로 들어가 보면, 그 골격이 주로 일본의 통제와 피지배 민족의 착취를 위해 지어졌고 그 대부분이 민주적 통치에는 부적합함을 알게 된다. … 우리가 군정 요원을 늘리고 남부 도(道) 전역을 포함하도록 점령을 확대할 수 있게 되면, 보다 분명한 그림이 펼쳐지기를 바란다.\n\n7. 제40사단의 1개 전투단이 9월 22일 인천(Inch'on)에 도착하여 경장비 부대를 철도편으로 순차적으로 부산(Fusan)으로 이동시키고 있다. 이 사단은 10일 내지 12일 안에 한국에서 집결을 마쳐야 하나, 부산항이 열리지 않는 한 그곳으로의 이동을 완료하기까지는 여러 날이 더 걸릴 것이다. 철도 시설은 제한되어 있고 현재까지 우리가 이동에 쓸 수 있는 도로를 찾지 못하였다. 본관은 적어도 LST(전차양륙함)라도 들어갈 수 있도록 부산을 개방하라고 해군을 압박하고 있으며, 그렇게 되면 인천에서 환적할 수 있다. 석탄을 조속히 확보하지 못하면 38도 이남의 철도는 머지않아 운행을 중단할 수밖에 없을 것이다.\n\n8. 제40사단이 부산에 대한 통제를 확립하는 즉시, 본관은 일본군 부대를 항구를 통과시킬 수 있는 속도에 맞추어 최대한 신속히 일본으로 이동시키기 시작할 것이다. 육상 수송의 제약 때문에 이 흐름은 가용 선박 수송 능력에 미치지 못할 수도 있다.\n\n9. 압수한 무기와 탄약 저장물의 처리 문제가 갈수록 중요해지고 있다. … 파괴 공작자들의 접근을 막기 위해 탄약고를 경비하는 데 다른 용도로 필요한 상당수의 병력이 소모되고 있다. 한국에서는 전투정보상 가치가 있을 수 있는 소수의 품목을 제외하고 군수품을 파괴해야 한다고 본다.\n\n10. 신문 특파원들의 태도는 눈에 띄게 개선되었다. 바람직하지 못한 유치한 사고방식의 인물들은 대부분 더 흥미로운 활동 무대로 옮겨 갔다. 남아 있는 자들은 더 사려 깊고 미국 시민으로서의 책임을 더 유념하고 있다. 그럼에도 이들이 러시아 관련 기사를 송고하는 경향이 여전히 있는데, 이런 기사가 발표될 경우 이곳 미국의 임무를 위태롭게 할 수 있다. 이곳의 태평양미육군(USAFPac) 검열관들에게 위험하다고 판단되는 그러한 기사를 모두 억제하도록 귀 사령부가 경고해야 한다고 본다. 특파원들은 미국 시민이 알아야 한다는 태도를 취한다. 본관도 원칙적으로는 동의하나, 시기상조의 비판적 기사는 지금으로서는 위험하다고 본다.\n\n권고 사항:\n\na. 참조 서한에 담긴 권고들을 다시 제기한다.\n\nb. 나아가 한국에서 접수한 모든 무기와 군수품을 파괴하거나 영구히 사용 불능으로 만들 권한을 부여해 줄 것을 권고한다. 이는 미군 병력의 소요를 크게 덜어 줄 것이다.\n\n존 R. 하지(John R. Hodge)", "secondary": "895.01/9–2645\n\nMemorandum by Lieutenant General John R. Hodge to General of the Army Douglas MacArthur at Tokyo[주73]\n\n[Seoul,] 24 September, 1945.\n\nSubject: Conditions in Korea.\n\n1.Reference is made to my letter 13 September 1945,[주74] same subject. This is supplemental thereto. The principal changes in conditions are in the nature of a further unfolding of the picture rather than in the way of any great shifts.2.There is no change in the attitude of Koreans toward the Japs and/or in their attitude toward independence. In the Jinsen-Seoul (Keijo) area Koreans are beginning to settle on the surface. There are fewer parades and demonstrations and fewer vocal remonstrances. However, there is a growing deep-seated distrust of Allied intentions concerning, and real dissatisfaction with the division of Korea along the 38° line into two occupation zones occupied by forces with such widely divergent policies. Many intelligent Koreans have already reached the conclusion that the Allied Powers have no intention of building up a Korean nation. Older Koreans recall a tentative agreement between Russia and Japan before the Russo-Jap War for division of Korea along same boundary, and believe Russia is again making a bid for its old demand. Based upon policies to date there [1055면] is little to encourage them in the belief that the Allied promise of Korean independence is sincere. Information coming out of Northern Korea is along the line of the attached statement presented to me by an Australian news correspondent.[주75] 3.There appears to be a growing realization on the part of many Koreans that the widely divergent activities by the multitudinous political parties are undesirable. However, there is no real reduction of these to date except that vocal expression of many is lessening. It is still impossible to get working agreements between factions and to shake out the cross-currents and suspicions of one against the others.4.I consider the current division of Korea into two occupational zones under widely divergent policies to pose an insurmountable obstacle to uniting Korea into a nation. In my opinion the Allied Powers, by this division, have created a situation impossible of peaceful correction with credit to the United States unless immediate action on an international level is forthcoming to establish an overall provisional government which will be fully supported by the occupation forces under common policy. It appears doubtful if any of the Powers with the exception of Russia has given serious thought to the problems involved. Korea is not and without full Japanese control was never a part of the Japanese Empire, and cannot be so treated without the everlasting enmity of Koreans toward those nations who so treat them. The country is ripe for anything that releases them from the Japanese, but because of past history are now most favorable toward some type of democratic government and particularly toward the United States. During this receptive phase immediately following the breach of Japanese control is the time to unite factions and begin formative education in democracy. Continuation of separation of the country into two parts under opposed ideologies will be fatal. Furthermore, neither of the two sections is in any degree self-supporting without full reciprocity between them. At present there is no reciprocity except that refugees from north of 38° are coming south in considerable numbers and the reverse is not true.5.Continuing, but so far almost unfruitful effort is being made to establish some sort of workable agreement with the Soviets on a military level. To date the only accomplishment has been to get out the occupants of the Kanko Prisoner of War Camp which was accomplished approximately ten days after negotiations were started and after much backfiring and vacillation on arrangements. I am still awaiting word from Russians on dates and places for reporting of [1056면] exchanged liaison parties. Relationships of contact troops along the 38° line have been without unusual incidents since last report except that electric power was turned off by Soviet forces in an area north of Seoul.6.It appears at this time that the “Military Government” in Korea will for the time being have to be complete and entire except for minor functions. As we get into the structure of what was the government here, we find that the framework was built primarily for Japanese control and exploitation of a subject people and most of it is unsuitable for democratic rule. … As we are able to increase our Military Government personnel and increase our occupation to include all the southern provinces, it is hoped that a clearer picture may unfold.7.One combat team of the 40th Division arrived at Inch’on on 22 September and is moving light forces by increment by rail to Fusan. The division should close in Korea within ten to twelve days, but unless the port at Fusan is opened, will not be able to complete its movement there for many days later. Rail facilities are limited and to date we have not found any road by which we can move. I am pressing the Navy to open Fusan to LST’s at least, in which case I can transship from Inch’on. If coal cannot be obtained soon, the railways will soon be forced to suspend action south of 38°.8.As soon as the 40th Division establishes control of Fusan, I will start movement of Japanese forces to Japan as rapidly as they can be passed through the port. Because of limitations in land transport this flow may be less than the shipping capacity available.9.The problem of handling depossessed arms and ammunition stores is assuming more and more importance. … The guarding of ammunition dumps to keep out saboteurs consumes a considerable number of troops needed for other purposes. It is believed that in Korea munitions should be destroyed except such few items as may have combat intelligence value.10.The attitude of news correspondents has improved materially. Most of the undesirable juvenile minded ones have moved on to more exciting fields of endeavor. Those remaining are more thoughtful and more mindful of their responsibility as American citizens. There is still a tendency for them to send in Russian stories which if published may jeopardize the American mission here. It is believed USAFPac censors here should be warned by your headquarters to suppress all such as are considered dangerous. Correspondents take the attitude that United States citizens should be informed. I agree in principle, but believe premature critical stories are dangerous now.\n\nRecommendations: a.Recommendations contained in reference letter are reiterated. b.It is further recommended that authority be granted for destruction of or rendering permanently useless all arms and munitions taken over in Korea. This will greatly relieve need for United States troops.\n\nJohn R. Hodge", "notes": ["[주73] 사본은 주한 정치고문이 9월 26일자 공한(despatch) 제4호로 국무부에 전달하였으며, 10월 9일 접수. 그 공한에서 정치고문은 \"하지 장군의 관찰에 동의\"하며 \"순전히 군사적인 사항 이외의 사항에 관한 한 그의 권고에 찬동\"한다고 밝혔다.", "[주74] 수록하지 않음. 내용상 주한 정치고문의 9월 15일자 공한 제1호(1049면)와 유사하다.", "[주75] 첨부된 사본을 찾지 못함."], "warn": false, "pages": [1054, 1055, 1056], "search": "John R. Hodge 존 R. 하지(중장, 주한미군사령관) Douglas MacArthur 더글러스 맥아더(육군원수)"}, {"id": "d784", "order": 784, "date": "1945-09-25", "group": "B", "eyebrow": "d784 · The Chargé in China (Robertson) to the Secretary of State", "title": "주중 미국 대리대사(로버트슨)가 국무장관에게", "badge": "", "list_right": "문서 784", "meta": [{"k": "일자", "v": "1945-09-25"}, {"k": "발신", "v": "주중 미국 대리대사(Robertson)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "장소", "v": "Chungking"}, {"k": "전문번호", "v": "1657"}, {"k": "종류", "v": "전보"}, {"k": "원문출처", "v": "895.01/9–2545: Telegram", "txt": true}], "links": [{"k": "FRUS", "text": "문서 784 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d784"}], "summary": "장제스가 소련이 점령지대에서 공산주의 정부 집단을 조직·후원하고 있다는 보고에 비추어 충칭의 대한민국임시정부 인사들을 사인 자격으로 한국에 공수하는 것이 바람직하다고 보며, 미국의 대한정책을 알려 달라고 요청했다는 보고.", "points": ["중국 정보부장 우궈전(K. C. Wu)이 대사관을 찾아와, 장제스가 현재 상황에 비추어 미국의 대한정책을 알고 싶어 한다고 전했다", "소련이 소련 점령지역에서 공산주의적 정부 집단을 조직하거나 후원하고 있다는 보고가 있다고 우 박사가 언급했다", "장제스는 충칭의 대한민국임시정부 구성원들을 행정직의 임명 후보로 한국에 공수하는 것이 바람직하다고 본다", "다만 중국도 미국도 임시정부를 승인하지 않으므로 이들은 임시정부 대표가 아니라 사인 자격으로 보내야 한다", "미국이 임시정부를 승인한다면 중국 정부도 기꺼이 그렇게 하겠다고 우 박사가 언급했다", "현지 육군은 국무부가 권고 또는 후원하면 항공기를 준비하겠으나, 9월 21일자 국무부 1510호와 같은 단순한 '이의 없음' 표명은 정치적 결정 책임을 육군에 떠넘기는 것이어서 불충분하다고 본다", "이러한 성격의 정치적 결정은 국무부가 내려야 한다는 것이 육군의 견해이며, 대리대사는 국무부의 훈령을 요청한다"], "primary": "1657. 우궈전(K. C. Wu) 박사[주76]가 오늘 대사관을 방문하여, 총통(Generalissimo)[주77]이 현재의 상황에 비추어 한국에 관한 미국의 정책에 대해 통보받기를 바란다고 말하였다. 우 박사는 소련이 한국의 소련 점령지역에서 공산주의적 정부 집단을 조직하거나 후원하고 있다는 보고가 있었다고 말하였다.\n\n이러한 사실에 비추어 총통은 충칭(Chungking)에 있는 대한민국임시정부(Korean Provisional Government) 구성원들을 정부의 행정직에 임명될 수 있는 인사로서 한국에 공수하는 것이 바람직하리라고 본다. 그러나 중국도 미국도 대한민국임시정부(KPG, Korean Provisional Government)를 승인하지 않으므로, 이들은 임시정부의 대표로서가 아니라 사인(私人)으로서 보내져야 한다. 우 박사는 만일 미국이 임시정부를 승인한다면 중국 정부도 기꺼이 같이 그렇게 하겠다고 말하였다.\n\n우 박사는 총통이 헐리(Hurley) 대사가 워싱턴으로 출발하기 직전에 그와 한국 문제를 논의하였으며, 대사는 이 문제에 관한 총통의 견해를 잘 알고 있다고 말하였다. 우 박사는 이 전문을 대사가 도착하는 대로 그의 주의를 환기해 줄 것을 요청한다.\n\n국무부의 9월 21일자 1510호와 관련하여, 이곳 육군은 만일 국무부가 한인들의 한국 파견을 권고하거나 후원한다면 육군은 그 목적을 위해 기꺼이 항공기를 (가용하다면) 마련하겠다고 말한다. 그러나 육군은 참조 전보에 담긴 것과 같은 국무부의 단순한 이의 없음 표명은 충분하지 않다고 보는데, 이는 정치적 결정을 내리는 책임을 육군에 떠넘기는 것이 되기 때문이다. 육군은 이러한 성격의 정치적 결정은 국무부가 내려야 한다고 본다.\n\n국무부의 훈령을 바란다.\n\n국무부 앞으로 발송, 모스크바에 사본 발송.\n\n로버트슨(Robertson)", "secondary": "895.01/9–2545: Telegram\n\nThe Chargé in China (Robertson) to the Secretary of State\n\nChungking, September 25, 1945—5 p.m. \n [Received September 25—8:35 a.m.]\n\n1657. Dr. K. C. Wu[주76] called at Embassy today and stated that Generalissimo[주77] would appreciate being informed concerning American policy in regard to Korea in light of present conditions. Dr. Wu said it had been reported that Soviets are organizing or sponsoring Communistic governmental groups in Soviet-occupied areas of Korea.\n\nIn view of this fact, Generalissimo considers it would be advisable that members of Korean Provisional Government in Chungking be flown to Korea as possible appointees to administrative positions in the government. However, as neither China nor the United States recognizes the KPG (Korean Provisional Government) these persons should be sent as private individuals and not as representatives of the KPG (Korean Provisional Government). Dr. Wu remarked that if the United States should recognize the KPG (Korean Provisional Government), the Chinese Government would be glad to do likewise. Dr. Wu said that the Generalissimo had discussed Korean questions with Ambassador Hurley shortly before latter’s departure for Washington, and that the Ambassador was familiar with Generalissimo’s views on subject. Dr. Wu requests that this message be brought to Ambassador’s attention on arrival.\n\nWith reference to Department’s 1510, September 21, Army here says that if State Department recommends or sponsors sending of Koreans to Korea, Army will be glad to set up planes, if available, for the purpose. Army feels, however, that a mere statement of non-objection by State Department, such as contained in reference telegram, is not sufficient as this would throw responsibility for making a political decision on Army. Army believes that political decisions of this nature should be made by State Department.\n\nDepartment’s instructions would be appreciated.\n\nSent to Department; repeated to Moscow.\n\nRobertson", "notes": ["[주76] 중국 정보부장(Chinese Minister of Information).", "[주77] 장제스(Chiang Kai-shek)."], "warn": false, "pages": [1056], "search": "Walter S. Robertson 월터 로버트슨(주중 미국 대리대사) K. C. Wu 우궈전(중국 정보부장) Chiang Kai-shek 장제스(총통) Patrick J. Hurley 패트릭 헐리(주중 미국대사)"}, {"id": "d785", "order": 785, "date": "1945-09-26", "group": "D", "eyebrow": "d785 · Memorandum of Conversation, by the Director of the Office of Far Eastern Affairs (Vincent)", "title": "극동국장(빈센트)이 작성한 대화비망록", "badge": "", "list_right": "문서 785", "meta": [{"k": "일자", "v": "1945-09-26"}, {"k": "발신", "v": "극동국장(Vincent)", "txt": true}, {"k": "수신", "v": "", "txt": true}, {"k": "장소", "v": "[Washington]"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "대화비망록"}, {"k": "원문출처", "v": "895.01/9–2645", "txt": true}], "links": [{"k": "FRUS", "text": "문서 785 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d785"}], "summary": "중국대사 웨이다오밍이 애치슨 국무장관 대리를 방문하여 대한정책과 신탁통치, 충칭의 임시정부 문제를 문의하고, 애치슨은 정책에 변화가 없으며 4개국 신탁통치 협정 교섭을 곧 시작하고 38도선 분할을 가능한 한 빨리 전(全)한국 행정으로 대체하기를 바란다고 답한 대화 기록.", "points": ["중국대사 웨이다오밍이 카이로 선언과 루스벨트 대통령의 태도를 언급하며 트루먼 대통령 아래에서 그 태도에 변경이 있는지 물었다", "애치슨은 한국의 장래에 관한 미국 정책에 변화가 없으며, 독립 한국의 수립을 기대하고 있고 당면한 계획과 정책은 그 목표 달성을 위한 것이라고 확언했다", "쑹쯔원 박사가 6월에 대통령과 신탁통치 문제를 논의했고 한국 독립 준비의 최선의 방책으로 4개국 신탁통치에 동의한 것으로 이해되고 있다고 대사에게 상기시켰다", "스탈린 원수도 4개국 신탁통치에 동의했으며 영국 정부에도 미국의 구상이 통보되었다고 대사에게 알렸다", "신탁통치 협정에 관한 미국 구상의 개요를 설명하고, 협정 교섭을 시작하기 위해 가까운 장래에 나머지 3개국 정부에 구상을 제시하기를 희망한다고 말했다", "대사가 충칭의 '임시 한국정부'가 장차 한국 정부의 기초가 될 수 있다고 시사하자, 미국은 충칭의 한인들이 한국으로 가는 여행을 지원할 계획이며 그들은 개인 자격으로 한국 행정 구성을 도울 수 있을 것이라고 답했다", "장차 한국 정부의 구성은 신탁통치 협정에 참여하는 4개국 사이에서 논의할 사안이라고 지적했다", "애치슨은 현재의 38도선 미·소 점령 분할을 가능한 한 빨리 전(全)한국적 행정으로 대체하고, 군정을 신탁통치하의 민정으로 대체하기를 간절히 바란다고 밝혔다"], "primary": "참석자:\n\n- 애치슨(Acheson) 씨, 국무장관 대리\n- 웨이다오밍(Wei Tao-ming) 박사, 중국대사\n- 극동국(FE)—빈센트(Vincent) 씨\n\n중국대사가 오늘 오전 11시에 국무장관 대리를 방문하였다. 그는 한국에 관한 계획과 진전에 관심을 표하고, 카이로 선언(Cairo Declaration)을 언급하였으며, 한국에 관한 루스벨트(Roosevelt) 대통령의 태도라고 그가 이해하고 있는 바를 거론하면서, 트루먼(Truman) 대통령 측에서 이 태도에 어떤 변경이 있는지 물었다. 애치슨 씨는 한국의 장래에 관한 우리 정책에는 아무런 변화가 없었으며, 우리는 독립 한국의 수립을 기대하고 있고, 한국에 관한 우리의 당면한 계획과 정책은 그 목표를 달성하기 위한 것이라고 그에게 확언하였다.\n\n대사는 신탁통치(trusteeship)에 관한 우리의 구상에 대해 문의하였다. 그에게는 쑹쯔원(Soong) 박사가 6월에 대통령과 그 문제를 논의하였고, 쑹 박사가 한국 독립을 준비하는 최선의 방책으로서 한국에 대한 4개국 신탁통치에 동의한 것으로 이해되고 있다는 점이 상기되었다. 스탈린(Stalin) 원수도 4개국 신탁통치에 동의하였다는 것이 대사에게 통보되었고, 영국 정부에도 이러한 취지의 우리 구상이 통보되었다고 하였다. 대사에게는 신탁통치 협정에 관한 우리 자신의 구상이 간략히 설명되었으며, 협정을 위한 교섭을 시작할 목적으로 아주 가까운 장래에 우리 구상을 다른 세 정부에 제시하기를 희망한다고 전달되었다.\n\n대사는 충칭(Chungking)의 \"임시 한국정부(Provisional Korean Government)\"를 언급하면서 그것이 장차 한국 정부의 기초를 이룰 수 있으리라고 시사하였다. 그에게는 우리가 충칭에 있는 한인들이 한국으로 가는 여행을 용이하게 할 계획이며, 그곳에서 그들이 개인 자격으로 한국 행정의 구성을 도울 수 있을 것이라고 말하였다. 장차 한국 정부의 구성은 신탁통치 협정에 들어가는 4개국 사이에서 논의할 사안이라는 점이 지적되었다.\n\n애치슨 씨는 대사에게, 우리는 미국과 러시아의 점령 사이의 현행 38도선 분할을 가능한 한 빨리 한국에 대한 전반적(over-all) 행정으로 대체하기를 간절히 바라며, 가능한 한 빨리 신탁통치하의 민정(civilian administration)이 한국의 군정을 대체하기를 희망한다고 알렸다.", "secondary": "895.01/9–2645\n\nMemorandum of Conversation, by the Director of the Office of Far Eastern Affairs (Vincent)[주78]\n\n[Washington,] September 26, 1945.\n\nParticipants: Mr. Acheson, Acting Secretary\n\nDr. Wei Tao-ming, Chinese Ambassador\n\nFE—Mr. Vincent\n\nThe Chinese Ambassador called on the Acting Secretary this morning at 11 o’clock. He expressed interest in plans and developments with regard to Korea, mentioned the Cairo Declaration, referred to what he understood to be President Roosevelt’s attitude with regard to Korea, and asked whether there was any alteration in this attitude on the part of President Truman. Mr. Acheson assured him that there had been no change in our policy with regard to the future of Korea; that we looked forward to the establishment of an independent Korea; and that our immediate plans and policies with regard to Korea were for the purpose of achieving that objective.\n\nThe Ambassador inquired with regard to our ideas on trusteeship. He was reminded that Dr. Soong had discussed that matter with the President in June and that it was understood that Dr. Soong had agreed to a 4-power trusteeship for Korea as the best means for preparing for Korean independence. Marshal Stalin had agreed to a 4-power trusteeship, the Ambassador was informed, and the British Government had been advised of our ideas along this line. The Ambassador was given a brief account of our own ideas on a trusteeship agreement and was told that we hoped in the very near future to present our ideas to the other three Governments with a view to starting negotiations for an agreement.\n\nThe Ambassador mentioned the “Provisional Korean Government” in Chungking and suggested that it might form the basis for an eventual Korean Government. He was told that we planned to facilitate the travel of Koreans in Chungking to Korea, where they would be able as individuals to assist in the formation of Korean administration. The formation eventually of a Korean Government would, it was pointed out, be a matter for discussion among the four powers entering into the trusteeship agreement.\n\nMr. Acheson informed the Ambassador that we were anxious to substitute as soon as possible for the present 38° latitude division between American and Russian occupation an over-all administration for Korea, and that we hoped that as soon as possible a civilian administration under trusteeship would replace military administration in Korea.", "notes": ["[주78] 국무장관 대리가 이니셜로 확인 서명함."], "warn": false, "pages": [1056], "search": "John Carter Vincent 존 카터 빈센트(극동국장) Dean Acheson 딘 애치슨(국무장관 대리) Wei Tao-ming 웨이다오밍(중국대사) Franklin D. Roosevelt 프랭클린 루스벨트(대통령) Harry S. Truman 해리 트루먼(대통령) T. V. Soong 쑹쯔원 Joseph Stalin 이오시프 스탈린(원수)"}]</script>

, "docs": [["cairo-1943", "d307"]]}, {"id": "1943-11-1", "date": "1943-11", "arc": "korea-div", "docs": [["cairo-1943", "d308"]]}, {"id": "1943-11-25", "date": "1943-11-25", "arc": "korea-div", "docs": [["cairo-1943", "d309"]]}, {"id": "1943-11-27", "date": "1943-11-27", "label": "카이로 선언", "arc": "korea-div", "bar": true, "key": true, "where": "카이로", "note": "미·영·중 3국 수뇌가 대일 전후 처리를 합의해 발표했다. 조선에 관한 대목은 「적당한 시기에(in due course) 자유롭고 독립된 나라가 되게 한다」였다. 이 묶음이 좇는 문구가 여기서 태어난다."}, {"id": "1943-11-28", "date": "1943-11-28", "label": "테헤란 회담", "arc": "wwii", "bar": true, "where": "테헤란", "note": "루스벨트·처칠·스탈린의 첫 3자 회담. 유럽 제2전선(노르망디)의 시기가 정해졌고, 스탈린은 독일 항복 뒤 대일전 참전을 처음으로 시사했다."}, {"id": "1944-06-06", "date": "1944-06-06", "label": "노르망디 상륙", "arc": "wwii", "bar": true, "note": "연합군이 프랑스 북부에 상륙해 서부 제2전선이 열렸다. 유럽 전쟁의 승패가 사실상 이때 갈렸고, 미국 안에서 「그다음은 일본」이라는 계산이 본격화된다."}, {"id": "1944-07-25", "date": "1944-07-25", "label": "항복문서 완성", "arc": "wwii", "bar": true, "key": true, "where": "런던 유럽자문위원회", "note": "유럽자문위원회가 「독일의 무조건 항복」 본문을 확정했다. 독일이 항복하기 아홉 달 전이고, 파리가 해방되기 한 달 전이다. 이 뒤의 넉 달은 새로 쓰는 것이 아니라 손질하는 기간이며, 정작 1945년 5월 7일 랭스에서는 지연을 우려해 이 문서 대신 간이 「항복문서」를 쓴다."}, {"id": "1944-10-20", "date": "1944-10-20", "label": "레이테 상륙", "arc": "wwii", "bar": true, "where": "필리핀", "note": "맥아더가 필리핀 탈환에 착수했다. 뒤이은 레이테만 해전에서 일본 연합함대가 무너져, 일본 본토와 남방 자원지대를 잇는 해상 수송로가 끊긴다."}, {"id": "1944-12-22", "date": "1944-12-22", "arc": "wwii", "docs": [["machinery-1945", "d486"]]}, {"id": "1944-12-28", "date": "1944-12-28", "arc": "wwii", "docs": [["surrender-1945", "d368"]]}, {"id": "1945-01", "date": "1945-01", "arc": "wwii", "docs": [["surrender-1945", "d340"]]}, {"id": "1945-01-03", "date": "1945-01-03", "arc": "wwii", "docs": [["surrender-1945", "d370"]]}, {"id": "1945-01-04", "date": "1945-01-04", "arc": "wwii", "docs": [["machinery-1945", "d130"]]}, {"id": "1945-01-25", "date": "1945-01-25", "arc": "wwii", "docs": [["machinery-1945", "d139"]]}, {"id": "1945-02-04", "date": "1945-02-04", "label": "얄타 회담", "arc": "korea-div", "bar": true, "key": true, "where": "크림반도 얄타", "note": "루스벨트·처칠·스탈린의 두 번째 3자 회담. 소련의 대일 참전 조건이 비밀협정으로 정해졌고, 루스벨트가 스탈린에게 조선의 신탁통치를 꺼내며 「20년에서 30년」이라 말했다. 카이로의 「적당한 시기」에 처음으로 숫자가 붙은 자리다."}, {"id": "1945-02-08", "date": "1945-02-08", "arc": "korea-div", "docs": [["yalta-1945", "d393"]]}, {"id": "1945-02-08-1", "date": "1945-02-08", "arc": "wwii", "docs": [["machinery-1945", "d149"]]}, {"id": "1945-03-09", "date": "1945-03-09", "arc": "wwii", "docs": [["mofa-1945", "d949"]]}, {"id": "1945-03-10", "date": "1945-03-10", "label": "도쿄 대공습", "arc": "wwii", "bar": true, "note": "B-29 편대의 야간 소이탄 공습으로 도쿄 시가지가 불탔다. 하룻밤 사망자가 10만 명 안팎으로 추정된다. 일본 안에서 본토 방위가 불가능하다는 인식이 퍼지기 시작한다."}, {"id": "1945-03-14", "date": "1945-03-14", "arc": "wwii", "docs": [["machinery-1945", "d488"]]}, {"id": "1945-03-18", "date": "1945-03-18", "arc": "wwii", "docs": [["field-1945", "tf58-2"]]}, {"id": "1945-03-23", "date": "1945-03-23", "arc": "wwii", "docs": [["machinery-1945", "d161"]]}, {"id": "1945-03-30", "date": "1945-03-30", "arc": "wwii", "docs": [["machinery-1945", "d165"]]}, {"id": "1945-04", "date": "1945-04", "arc": "wwii", "docs": [["surrender-1945", "d343"]]}, {"id": "1945-04-01", "date": "1945-04-01", "label": "오키나와 전투", "arc": "wwii", "bar": true, "note": "미군이 오키나와에 상륙해 6월까지 싸웠다. 사상자 규모가 본토 상륙전의 비용을 가늠하는 근거가 되어, 원폭 사용과 소련 참전 요청 양쪽의 논거로 쓰인다."}, {"id": "1945-04-05", "date": "1945-04-05", "arc": "wwii", "docs": [["machinery-1945", "d172"]]}, {"id": "1945-04-06", "date": "1945-04-06", "arc": "wwii", "docs": [["field-1945", "tf58-3"]]}, {"id": "1945-04-11", "date": "1945-04-11", "arc": "wwii", "docs": [["field-1945", "tf58-4"]]}, {"id": "1945-04-12", "date": "1945-04-12", "label": "루스벨트 사망", "arc": "wwii", "bar": true, "note": "루스벨트가 급서하고 트루먼이 승계했다. 트루먼은 얄타의 비밀협정도 원폭 개발도 취임 뒤에야 통보받았다. 조선 신탁통치 구상을 밀던 사람이 사라진 자리다."}, {"id": "1945-04-14", "date": "1945-04-14", "arc": "wwii", "docs": [["machinery-1945", "d178"]]}, {"id": "1945-04-15", "date": "1945-04-15", "arc": "wwii", "docs": [["machinery-1945", "d179"]]}, {"id": "1945-04-18", "date": "1945-04-18", "arc": "wwii", "docs": [["machinery-1945", "d181"]]}, {"id": "1945-04-22", "date": "1945-04-22", "arc": "wwii", "docs": [["machinery-1945", "d59"]]}, {"id": "1945-04-23", "date": "1945-04-23", "arc": "wwii", "docs": [["machinery-1945", "d187"]]}, {"id": "1945-04-23-1", "date": "1945-04-23", "arc": "wwii", "docs": [["machinery-1945", "d495"]]}, {"id": "1945-04-24", "date": "1945-04-24", "arc": "wwii", "docs": [["machinery-1945", "d189"]]}, {"id": "1945-04-25", "date": "1945-04-25", "label": "힘러의 항복 제의", "arc": "wwii", "bar": true, "key": true, "where": "뤼베크 · 스톡홀름", "note": "힘러가 4월 24일 새벽 뤼베크에서 베르나도테 백작을 만나, 서부전선만 아이젠하워에게 항복하겠다며 스웨덴 정부에 전달을 부탁했다. 히틀러가 뇌출혈로 이미 죽었거나 이틀을 넘기지 못한다는 말도 함께 전해진다. 트루먼과 처칠은 전화로 3국 동시 무조건항복 외에는 없다고 못 박는다."}, {"id": "1945-04-25-1", "date": "1945-04-25", "arc": "wwii", "docs": [["veday-1945", "d548"]]}, {"id": "1945-04-25-2", "date": "1945-04-25", "arc": "wwii", "docs": [["veday-1945", "d550"]]}, {"id": "1945-04-25-3", "date": "1945-04-25", "arc": "wwii", "docs": [["veday-1945", "d549"]]}, {"id": "1945-04-28", "date": "1945-04-28", "arc": "wwii", "docs": [["veday-1945", "d557"]]}, {"id": "1945-04-30", "date": "1945-04-30", "label": "히틀러 자살", "arc": "wwii", "bar": true, "where": "베를린 총통관저", "note": "베를린 지하에서 히틀러가 자살하고 되니츠가 승계한다. 되니츠는 전쟁을 계속하겠다고 말했고, 연합국은 히틀러가 순교자로 남는 전설이 만들어지지 않도록 5월 2일 성명을 낸다.", "docs": [["veday-1945", "d75"]]}, {"id": "1945-05-01", "date": "1945-05-01", "arc": "wwii", "docs": [["veday-1945", "d205"]]}, {"id": "1945-05-01-1", "date": "1945-05-01", "arc": "wwii", "docs": [["veday-1945", "d203"]]}, {"id": "1945-05-02", "date": "1945-05-02", "label": "베를린 함락", "arc": "wwii", "bar": true, "where": "베를린", "note": "소련군이 베를린을 함락했다. 이틀 전 히틀러가 자살했고 남은 것은 항복 절차뿐이었다. 미국 문서에 히틀러의 죽음은 부고가 아니라 「항복문서에 서명할 능력이 있는 중앙 권력이 없을 경우」라는 가정으로 나타난다.", "docs": [["veday-1945", "d560"]]}, {"id": "1945-05-04", "date": "1945-05-04", "arc": "wwii", "docs": [["veday-1945", "d561"]]}, {"id": "1945-05-04-1", "date": "1945-05-04", "arc": "wwii", "docs": [["veday-1945", "d562"]]}, {"id": "1945-05-04-2", "date": "1945-05-04", "arc": "wwii", "docs": [["veday-1945", "d212"]]}, {"id": "1945-05-07", "date": "1945-05-07", "arc": "wwii", "docs": [["veday-1945", "d566"]]}, {"id": "1945-05-07-1", "date": "1945-05-07", "arc": "wwii", "docs": [["veday-1945", "d567"]]}, {"id": "1945-05-08", "date": "1945-05-08", "label": "독일 항복", "arc": "wwii", "bar": true, "key": true, "where": "랭스 · 베를린", "note": "5월 7일 새벽 2시 41분 랭스에서 서명이 끝났으나, 발표는 8일까지 묶여 있었다. 스탈린은 동부전선에서 항복 명령이 이행될지 확실치 않다며 소련의 발표를 9일로 미뤘고, 8일 밤 베를린에서 다시 서명한다. 그날 서명한 것은 유럽자문위원회가 여덟 달 다듬어 온 항복문서가 아니라 초기 군사 조항만 담은 간이 문서였다.", "docs": [["veday-1945", "d224"]]}, {"id": "1945-05-10", "date": "1945-05-10", "arc": "wwii", "docs": [["mofa-1945", "d951"]]}, {"id": "1945-05-10-1", "date": "1945-05-10", "arc": "wwii", "docs": [["veday-1945", "d357"]]}, {"id": "1945-05-11", "date": "1945-05-11", "arc": "wwii", "docs": [["surrender-1945", "d349"]]}, {"id": "1945-05-11-1", "date": "1945-05-11", "arc": "wwii", "docs": [["field-1945", "tf58-5"]]}, {"id": "1945-05-12", "date": "1945-05-12", "arc": "wwii", "docs": [["veday-1945", "d235"]]}, {"id": "1945-05-18", "date": "1945-05-18", "arc": "wwii", "docs": [["mofa-1945", "d953"]]}, {"id": "1945-05-21", "date": "1945-05-21", "arc": "wwii", "docs": [["surrender-1945", "d355"]]}, {"id": "1945-05-28", "date": "1945-05-28", "arc": "wwii", "docs": [["surrender-1945", "d379"]]}, {"id": "1945-06-22", "date": "1945-06-22", "arc": "wwii", "docs": [["surrender-1945", "d358"]]}, {"id": "1945-06-27", "date": "1945-06-27", "arc": "wwii", "docs": [["surrender-1945", "d385"]]}, {"id": "1945-06-30", "date": "1945-06-30", "arc": "wwii", "docs": [["mofa-1945", "d960"]]}, {"id": "1945-07-16", "date": "1945-07-16", "arc": "wwii", "docs": [["surrender-1945", "d361"]]}, {"id": "1945-07-17", "date": "1945-07-17", "label": "포츠담 회담", "arc": "wwii", "bar": true, "where": "베를린 근교 포츠담", "note": "트루먼·처칠(뒤에 애틀리)·스탈린의 회담. 회담 중 원폭 실험 성공이 보고되고, 대일 최후통첩의 문안이 다듬어진다."}, {"id": "1945-07-21", "date": "1945-07-21", "arc": "wwii", "docs": [["mofa-1945", "d964"]]}, {"id": "1945-07-26", "date": "1945-07-26", "label": "포츠담 선언", "arc": "wwii", "bar": true, "note": "미·영·중 명의로 일본에 무조건 항복을 요구했다. 제8항에 「카이로 선언의 조항은 이행되어야 한다」고 못박아, 조선 독립 약속이 항복 조건 안으로 들어온다. 일본은 이를 묵살(黙殺)한다고 발표했다."}, {"id": "1945-07-27", "date": "1945-07-27", "arc": "wwii", "docs": [["mofa-1945", "d1079"]]}, {"id": "1945-08", "date": "1945-08", "arc": "korea-div", "docs": [["frus-1945", "d771"]]}, {"id": "1945-08-02", "date": "1945-08-02", "arc": "wwii", "docs": [["surrender-1945", "d364"]]}, {"id": "1945-08-04", "date": "1945-08-04", "arc": "wwii", "docs": [["surrender-1945", "d390"]]}, {"id": "1945-08-06", "date": "1945-08-06", "label": "히로시마", "arc": "wwii", "bar": true, "key": true, "note": "히로시마에 원자폭탄이 투하됐다. 트루먼은 같은 날 성명을 내 「이제껏 없던 폭탄」임을 알리고 항복하지 않으면 파멸이 이어질 것이라 경고했다.", "disp": "08.06", "docs": [["surrender-1945", "d401"]]}, {"id": "1945-08-08", "date": "1945-08-08", "label": "소련 참전", "arc": "wwii", "bar": true, "note": "소련이 일본에 선전포고하고 이튿날 만주로 진공했다. 얄타에서 약속한 「독일 항복 뒤 3개월」을 지킨 날짜다. 미국이 조선에 지상군을 두려면 시간이 없다는 것이 이날 분명해진다.", "disp": "08.08", "docs": [["surrender-1945", "d402"]]}, {"id": "1945-08-09", "date": "1945-08-09", "label": "나가사키", "arc": "wwii", "bar": true, "note": "나가사키에 두 번째 원자폭탄이 투하됐다. 같은 날 밤 어전회의가 열려 국체 유지를 조건으로 한 항복 제의가 정해진다.", "docs": [["mofa-1945", "d1085"]]}, {"id": "1945-08-10", "date": "1945-08-10", "disp": "08.10", "arc": "wwii", "docs": [["surrender-1945", "d406"]]}, {"id": "1945-08-10-1", "date": "1945-08-10", "disp": "08.10 06:45", "arc": "wwii", "docs": [["mofa-1945", "d1086"]]}, {"id": "1945-08-10-2", "date": "1945-08-10", "disp": "08.10 18:00", "arc": "wwii", "docs": [["mofa-1945", "d1091"]]}, {"id": "1945-08-11", "date": "1945-08-11", "label": "38선 획정", "arc": "korea-div", "bar": true, "key": true, "note": "일반명령 제1호(SWNCC 21/5)가 고쳐지면서 조선이 북위 38도로 갈렸다. 한 문서의 b항과 f항, 다섯 조항 사이에 조선이 둘로 나뉘어 적혔다. 합참이 든 이유는 미군에게 경성의 항만과 교통 지역을 주기 위해서였다.", "docs": [["surrender-1945", "d418"]]}, {"id": "1945-08-11-1", "date": "1945-08-11", "disp": "08.11", "arc": "wwii", "docs": [["surrender-1945", "d410"]]}, {"id": "1945-08-11-2", "date": "1945-08-11", "disp": "08.11", "arc": "wwii", "docs": [["surrender-1945", "d412"]]}, {"id": "1945-08-11-3", "date": "1945-08-11", "disp": "08.11", "arc": "wwii", "docs": [["surrender-1945", "d418"]]}, {"id": "1945-08-11-4", "date": "1945-08-11", "disp": "08.11 10:46", "arc": "wwii", "docs": [["surrender-1945", "d413"]]}, {"id": "1945-08-11-5", "date": "1945-08-11", "disp": "08.11 밤", "arc": "wwii", "docs": [["mofa-1945", "d1093"]]}, {"id": "1945-08-12", "date": "1945-08-12", "disp": "08.12", "arc": "wwii", "docs": [["surrender-1945", "d425"]]}, {"id": "1945-08-12-1", "date": "1945-08-12", "disp": "08.12", "arc": "wwii", "docs": [["surrender-1945", "d427"]]}, {"id": "1945-08-14", "date": "1945-08-14", "disp": "08.14", "arc": "wwii", "docs": [["surrender-1945", "d442"]]}, {"id": "1945-08-14-1", "date": "1945-08-14", "disp": "08.14", "arc": "wwii", "docs": [["surrender-1945", "d431"]]}, {"id": "1945-08-14-2", "date": "1945-08-14", "disp": "08.14", "arc": "wwii", "docs": [["surrender-1945", "d437"]]}, {"id": "1945-08-14-3", "date": "1945-08-14", "disp": "08.14", "arc": "wwii", "docs": [["mofa-1945", "d1098"]]}, {"id": "1945-08-14-4", "date": "1945-08-14", "disp": "08.14 20:05", "arc": "wwii", "docs": [["mofa-1945", "d1097"]]}, {"id": "1945-08-14-5", "date": "1945-08-14", "disp": "08.14 20:10", "arc": "wwii", "docs": [["surrender-1945", "d440"]]}, {"id": "1945-08-15", "date": "1945-08-15", "label": "일본 항복", "arc": "wwii", "bar": true, "key": true, "note": "일본이 포츠담 선언 수락을 방송으로 알렸다. 전날 밤 일부 장교들이 방송을 막으려 궁성을 봉쇄하고 총리 관저를 습격했으나 실패했고, 아나미 육군대신은 새벽에 자결했다.", "disp": "08.15", "docs": [["mofa-1945", "d1100"]]}, {"id": "1945-09-02", "date": "1945-09-02", "label": "항복문서 조인", "arc": "wwii", "bar": true, "where": "도쿄만 미주리함", "note": "도쿄만의 미주리함 위에서 항복문서에 서명했다. 이 문서로 연합국최고사령관(SCAP)의 권한이 발효되고, 일반명령 제1호가 법적 효력을 갖는다."}, {"id": "1945-09-08", "date": "1945-09-08", "label": "미군 인천 상륙", "arc": "wwii", "bar": true, "key": true, "note": "하지 중장의 제24군단이 인천에 상륙해 이튿날 조선총독부의 항복을 받았다. 미군정이 시작된다. 닷새 뒤 하지는 카이로의 「in due course」가 조선어로 「수일 내」로 옮겨져 퍼져 있었다는 것을 알게 된다."}, {"id": "1945-09-09", "date": "1945-09-09", "arc": "korea-div", "docs": [["scap-0141", "1"]]}, {"id": "1945-09-13", "date": "1945-09-13", "arc": "korea-div", "docs": [["scap-0141", "2"]]}, {"id": "1945-09-24", "date": "1945-09-24", "arc": "korea-div", "docs": [["scap-0141", "2-B"]]}, {"id": "1945-09-27", "date": "1945-09-27", "disp": "09.27", "arc": "wwii", "docs": [["surrender-1945", "d507"]]}, {"id": "1945-10-10", "date": "1945-10-10", "disp": "10.10", "arc": "wwii", "docs": [["surrender-1945", "d526"]]}, {"id": "1945-11-13", "date": "1945-11-13", "arc": "wwii", "docs": [["field-1945", "toyoda-2"]]}, {"id": "1945-11-13-1", "date": "1945-11-13", "arc": "wwii", "docs": [["field-1945", "toyoda-5"]]}, {"id": "1945-11-14", "date": "1945-11-14", "arc": "wwii", "docs": [["field-1945", "toyoda-7"]]}, {"id": "1945-11-14-1", "date": "1945-11-14", "arc": "wwii", "docs": [["field-1945", "toyoda-8"]]}, {"id": "1945-11-23", "date": "1945-11-23", "disp": "11.23", "arc": "wwii", "docs": [["surrender-1945", "d488"]]}, {"id": "1945-12-27", "date": "1945-12-27", "label": "모스크바 3상회의", "arc": "wwii", "bar": true, "key": true, "note": "미·영·소 외상이 조선에 최대 5년의 신탁통치를 두고 미소공동위원회를 설치하기로 합의했다. 카이로의 「적당한 시기」가 마침내 문서상의 기한이 된 자리이자, 조선 안에서 신탁통치 반대 운동이 폭발한 계기다."}, {"id": "1946-01", "date": "1946-01", "arc": "korea-div", "docs": [["scap-0141", "6"]]}, {"id": "1946-03-20", "date": "1946-03-20", "label": "1차 미소공동위", "arc": "wwii", "bar": true, "where": "서울", "note": "임시정부 수립을 협의할 미소공동위원회가 열렸다. 어느 정당·사회단체와 협의할 것인가를 두고 갈라져 5월에 결렬된다."}, {"id": "1946-04", "date": "1946-04", "arc": "korea-div", "docs": [["scap-0141", "7-J"]]}, {"id": "1946-10-01", "date": "1946-10-01", "label": "대구 10월 사건", "arc": "wwii", "bar": true, "note": "식량 공출과 경찰에 대한 항의가 대구에서 시작해 남한 전역으로 번졌다. 미군정이 계엄을 선포하고 진압했다. 점령 1년 만에 통치의 정당성이 시험대에 오른 사건이다."}, {"id": "1947-05-21", "date": "1947-05-21", "label": "2차 미소공동위", "arc": "wwii", "bar": true, "where": "서울", "note": "미소공동위원회가 다시 열렸으나 같은 쟁점에서 다시 갈라져 10월에 사실상 끝난다. 미국은 이 무렵부터 조선 문제를 유엔으로 넘기는 쪽으로 방향을 바꾼다."}, {"id": "1947-09-17", "date": "1947-09-17", "label": "한국 문제 유엔 이관", "arc": "korea-div", "bar": true, "key": true, "note": "미국이 조선 문제를 유엔 총회에 상정했다. 4개국 신탁통치라는 전시 구상이 공식적으로 폐기되고, 처리의 무대가 미소 양자에서 유엔으로 옮겨간다."}, {"id": "1948-01-08", "date": "1948-01-08", "label": "유엔한국임시위원단 입국", "arc": "korea-div", "bar": true, "note": "유엔한국임시위원단(UNTCOK)이 서울에 들어왔다. 소련이 북위 38도 이북 입경을 거부해, 감시할 수 있는 지역에서만 선거를 치른다는 결론으로 이어진다."}, {"id": "1948-02", "date": "1948-02", "arc": "korea-div", "docs": [["ndl-091", "D024"]]}, {"id": "1948-04", "date": "1948-04", "arc": "korea-div", "docs": [["ndl-091", "D014"]]}, {"id": "1948-04-02", "date": "1948-04-02", "arc": "korea-div", "docs": [["korea-1948-50", "48-d776"]]}, {"id": "1948-04-28", "date": "1948-04-28", "arc": "korea-div", "docs": [["korea-1948-50", "48-d790"]]}, {"id": "1948-05-10", "date": "1948-05-10", "label": "5·10 총선거", "arc": "wwii", "bar": true, "key": true, "note": "남한만의 제헌국회 선거가 치러졌다. 좌익과 김구·김규식 계열이 불참했다. 분단이 절차를 갖춘 사실이 되는 날이다."}, {"id": "1948-05-11", "date": "1948-05-11", "arc": "korea-div", "docs": [["korea-1948-50", "48-d797"]]}, {"id": "1948-05-15", "date": "1948-05-15", "arc": "korea-div", "docs": [["korea-1948-50", "48-d801"]]}, {"id": "1948-08-09", "date": "1948-08-09", "arc": "korea-div", "docs": [["korea-1948-50", "48-d862"]]}, {"id": "1948-08-15", "date": "1948-08-15", "label": "대한민국 정부 수립", "arc": "korea-div", "bar": true, "key": true, "note": "대한민국 정부가 수립되고 미군정이 끝났다. 카이로에서 「in due course」라고 적힌 지 4년 9개월 뒤다. 북에서는 9월 9일 조선민주주의인민공화국이 수립된다."}, {"id": "1948-08-17", "date": "1948-08-17", "arc": "korea-div", "docs": [["korea-1948-50", "48-d872"]]}, {"id": "1948-12-12", "date": "1948-12-12", "label": "유엔총회 결의 195(III)", "arc": "korea-div", "bar": true,
