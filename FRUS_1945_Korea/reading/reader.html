민국임시정부를 즉시 승인한다는 공동성명을 내 달라고 청원한 전보.", "points": ["미·영·소 수뇌의 공동성명으로 (1) 한국의 정치·행정적 주권과 영토 보전에 영향을 미치는 일체의 비밀협정·양해를 부인할 것, (2) 대한민국임시정부를 지금 승인할 것, (3) 한국인에게 대일전 참전 기회를 줄 것을 청원한다.", "지금 승인해야 전후 한국에서 공산주의자와 민족주의자 사이의 내전 가능성을 없앨 수 있고, 그 내전은 국제 평화를 교란하고 러시아–한국 간 우호를 파괴할 것이라고 주장한다.", "임시정부가 지겠다는 네 가지 책임: 연합국 승리를 앞당길 인력 제공, 일본의 재무장 감시를 위한 점령 치안 협조, 귀국 후 1년 내 총선거 실시와 1919년 서울 선언에 따른 민주정부 수립, 연합국과의 우호·협력 회복.", "한국은 연합국 측에서 싸우는 나라 가운데 인구 7위이면서도 40년 투쟁 동안 원조도 승인도 받지 못한 유일한 나라라고 한다.", "1882년 조미조약의 거중조정 약속(각주 38)을 이행하여 한국을 문명국가 가족의 정당한 지위로 돌려놓아 달라고 호소한다.", "각주 39에 따르면 국무장관이 베를린에서 이 전보를 요약 타전하고 장관 대리에게 적절한 형식으로 접수 통지만 하라고 지시했으며, 7월 24일 극동국장이 접수 사실만 확인하는 회신을 보냈다."], "primary": "충칭에 망명 중인 대한민국임시정부의 워싱턴 주재 공식 대표기관인 한국위원부(Korean Commission)는, 각하께 그리고 각하를 통하여 현재 회담에 참석 중인 영국 및 소비에트 러시아의 수상들께, 다음을 내용으로 하는 공동성명을 발표해 주실 것을 삼가 청원합니다. 곧, 한국의 장래의 정치적·행정적 주권과 영토 보전에 영향을 미치는 일체의 비밀 국제협정 또는 양해를 부인할 것을 서약하고, 대한민국임시정부를 지금 승인함으로써 전후 한국에서 공산주의자와 민족주의자 사이에 내전이 일어날 가능성 — 그것은 필연적으로 국제 평화를 교란하고 러시아와 한국 사이의 우호 관계를 파괴할 것입니다 — 을 제거하며, 한국인에게 공동의 적 일본에 대항하여 더 큰 규모로 싸움에 참여할 기회를 달라는 것입니다. 연합국들이 이 정도로 협력해 준다면 대한민국임시정부는 다음의 책임을 떠맡을 수 있는 위치에 서게 될 것입니다. 첫째, 연합국의 승리를 앞당기고 연합국 사상자의 수를 줄이는 데 필요한 모든 인력을 제공하는 일. 둘째, 또 다른 전쟁을 위한 일체의 비밀 준비 가능성을 봉쇄하기 위하여 일본을 치안 관리하는 일에 협조하는 일. 셋째, 우리가 한국에 돌아간 뒤 1년 이내에 총선거를 실시하고 1919년의 서울 선언[주36]에 따라 민주주의(Democracy) [원문 그대로] 형태의 정부를 수립하는 일. 넷째, 세계 평화의 이익을 위하여 연합국과의 종래의 우호 관계 및 협력을 회복하고 증진하는 일입니다. 지금까지 한국은 연합국 측에서 싸우는 여러 나라 가운데 인구가 일곱 번째로 많은 나라이면서도, 40년에 걸친 대일 투쟁에서 아무런 원조도 승인도 받지 못한 유일한 나라이며, 그러는 동안에도 한국이 다시 [1032면] 국제 권력정치의 희생물이 될지 모른다는 소문이 끊이지 않고 나돌고 있습니다. 4천 년이 넘는 독립의 역사를 자랑하는 3천만 인민을 실망시키고 원한에 사무치게 하는 것은, 샌프란시스코 헌장[주37]이 보장한 국제 평화의 대의에 이바지하지 못할 것입니다. 그러나 한국인은 여전히 미국의 정의와 공정에 대한 [신뢰를?] 잃지 않고 있음을 각하께 확언드립니다. 새로운 세계 질서의 이 여명기에, 저희는 1882년 한국에 행한 약속[주38]을 이행함으로써 국제 협정의 신성함을 지켜 주실 것을 간청합니다. 그리하면 한국은 문명국가들의 가족 안에서 그 정당한 자리로 돌아오게 될 것이며, 그보다도 더 중요하게는, 이 전쟁이 그것을 위하여 치러지고 있는 이상(理想)에 대한 헤아릴 수 없는 수백만 인민의 믿음을 되찾는 일이 될 것입니다.[주39]\n\n이승만(Syngman Rhee)", "secondary": "895.01/7–214–5: Telegram\n\nThe Chairman of the Korean Commission in the United States (Rhee) to President Truman [주35]\n\nWashington, July 21, 1945.\n\nThe Korean Commission official representative at Washington of the Korean Provisional Government exiled in Chungking respectfully petitions Your Excellency and through you the Premiers of Great Britain and Soviet Russia now at the Conference to issue a joint statement pledging to repudiate any secret international agreement or understanding affecting the future political and administrative sovereignty and territorial integrity of Korea, to recognize the Provisional Government of the Republic of Korea now so as to eliminate the possibility of a civil war in Korea after the war between the Communists and Nationalists which will inevitably disturb international peace and disrupt friendly relations between Russia and Korea and to give the Koreans a chance to do their share of fighting on a larger scale against the common enemy Japan. With the cooperation of Allied Powers to this extent the Korean Provisional Government will be in a position to assume the responsibility, 1st, to furnish all manpower necessary to help speed the Allied victory and to reduce number of Allied casualties, 2d, to assist in policing Japan in checking all possibilities of secret preparation for another war, 3d, to hold a national election within one year after our return to Korea and establish a Democracy [sic] form of Government according to the Seoul Proclamation of 1919,[주36] and 4th, to restore and promote the former friendly relations and collaboration with the United Nations in the interest of world peace. So far Korea the seventh largest in population among the United Nations fighting on the Allied side is the only nation that has received no aid or recognition in her 40 years struggle against Japan while continued rumors persist and prevail that Korea may be [1032면] again a victim of international power politics. To keep the 30 million people proud of an independent history of over 4,000 years disappointed and rankling with resentment would not contribute to the cause of international peace guaranteed by the San Francisco Charter.[주37] However the Koreans still have, we assure you, unshaken with [faith in?] the American sense of justice and fairness. At this dawn of a new world order we beseech you to uphold the sanctity of international agreements by fulfilling the pledge made to Korea in 1882[주38] thus bringing Korea back to her rightful place in the family of civilized nations but even more important it will be redeeming the faith of uncounted millions in the details [ideals?] for which this war is being fought.[주39]\n\nSyngman Rhee", "notes": ["[주35] 트루먼 대통령은 당시 1945년 7월 17일부터 8월 2일까지 포츠담 인근에서 열린 베를린 3국 회담에 참석 중이었다. 미국·중국·영국의 정부 수반은 7월 26일 포츠담에서 발표한 선언 제8항에서 \"카이로 선언의 조항은 이행될 것이다\"라고 천명하였다. Foreign Relations, The Conference of Berlin (The Potsdam Conference), 1945, vol. ii, 1474, 1475면. 이 회담에서의 한국 관련 그 밖의 문서는 같은 책 vol. i, 1573, 1574면의 \"Korea\" 항목 및 vol. ii, 1624, 1642면의 \"Japan: Operations in and near China and Korea\", \"United Nations Organization: Trusteeship for Italian colonial territories and Korea\" 항목의 색인 참조.", "[주36] 1919년 3월 1일의 독립선언서. 본문은 재미한족연합위원회(United Korean Committee in America), Korean Liberty Conference, 32면 참조. 한국자유대회(Korean Liberty Conference)는 1942년 2월 27일부터 3월 1일까지 워싱턴에서 열렸다.", "[주37] 1945년 6월 26일 서명된 국제연합헌장. 본문은 Department of State Treaty Series No. 993 또는 59 Stat. 103 참조.", "[주38] 1882년 5월 22일 조선(Korea)에서 서명된 평화·우호·통상 및 항해 조약(Treaty of Peace, Amity, Commerce and Navigation) 참조. Department of State Treaty Series No. 61 또는 23 Stat. 720. 제1조 둘째 문장은 다음과 같다. \"만일 다른 열강이 어느 한쪽 정부를 부당하게 또는 억압적으로 대할 경우, 다른 쪽은 그 우호적 감정을 나타내어 원만한 타결을 이루도록 거중조정(good offices)을 행사할 것이다.\"", "[주39] 7월 21일 베를린 회담에 참석 중이던 국무장관은 이승만 씨의 전보를 전신으로 요약하여 보내면서, 국무장관 대리에게 \"귀하가 적절하다고 판단하는 비공식적 방식과 표현으로 리(Rhee)에게 접수 통지를 하라\"고 지시하였다. 7월 24일 극동국장은 장관 대리를 대신하여 다음과 같이 회신하였다. \"대통령의 이첩에 의하여, 대통령과 처칠 수상 및 스탈린 대원수가 한국의 정치적·행정적·영토적 보전에 관하여 공동성명을 발표하고 '대한민국임시정부'를 승인할 것을 요청하는 귀하의 전보를 접수하였음을 통지합니다.\" (895.01/7–2145)"], "warn": true, "pages": [1031, 1032], "search": "Syngman Rhee 이승만 Harry S. Truman 트루먼(대통령) Winston S. Churchill 윈스턴 S. 처칠(각주) Joseph Stalin 스탈린(각주) Chiang Kai-shek 장제스(각주 35의 포츠담 선언 관련 서술에 정부 수반으로 함축)"}, {"id": "d768", "order": 768, "date": "1945-07-25", "group": "C", "eyebrow": "d768 · The Chairman of the Korean Commission in the United States (Rhee) to the Acting Chief of the Office of Far Eastern Affairs (Lockhart)", "title": "주미한국위원부 위원장(이승만)이 극동국장 대리(록하트)에게", "badge": null, "list_right": "문서 768", "meta": [{"k": "일자", "v": "1945-07-25"}, {"k": "발신", "v": "주미한국위원부 위원장 이승만(Chairman of the Korean Commission in the United States, Rhee)", "txt": true}, {"k": "수신", "v": "극동국장 대리 프랭크 P. 록하트(Acting Chief of the Office of Far Eastern Affairs, Lockhart)", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "서한"}, {"k": "원문출처", "v": "895.01/7–2545", "txt": true}], "links": [{"k": "FRUS", "text": "문서 768 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d768"}], "summary": "얄타 비밀협정 부인을 받아들이지 못하는 다섯 가지 이유를 들고, 대한민국임시정부가 승인 요건을 모두 갖추었음을 논증하며, 승인 지연이 한국판 루블린 정부와 유혈사태를 부른다고 경고한 장문의 반박 서한.", "points": ["그루 국무차관의 얄타 비밀협정 부인 성명에 감사하면서도 의혹이 완전히 가시지 않는 다섯 가지 근거를 열거한다. 미국인 제보자의 신빙성, 소련 측의 불길한 침묵(그로미코 대사에게 해명 요구했으나 무응답), 처칠이 얄타 논의 주제를 공개할 수 없다면서 한국 문제가 없었다고는 말하지 않은 점, 미국이 한국의 참전 제안을 계속 거부해 온 것은 얄타 이전부터 유사한 합의가 있었음을 시사한다는 점, 1905년의 전례다.", "매클리시의 \"적절한 시기에(in due course)\", \"아마도(presumably)\"라는 표현에 대해 '아마도'보다 더 명확한 답을 원한다고 요구한다.", "승인 요건을 반박한다. 국제법상 첫 요건인 안정성(stability)은 25년을 버텨온 사실로 입증되었고, 인민의 지지라는 요건도 충족되었다고 주장한다(만장일치는 주장하지 않되 압도적 다수의 지지).", "임시정부는 1919년 상하이나 시베리아가 아니라 서울에서 13개 도 대표에 의해 수립되었으며, 다른 두 정부가 자진 합류했다고 주장한다(서울 선언 원본 사본 동봉).", "중국 정부와 프랑스 임시정부가 최소한 사실상(de facto) 지위를 승인했고, 중국은 재정 원조도 해 왔다고 한다.", "1944년 4월 민족주의자·공산주의자·무정부주의자까지 포함한 연립내각으로 자유중국 내 한인의 통일을 이루었으며, '한국인의 분열' 이야기는 친일파와 친공 세력이 퍼뜨린 선전이라고 반박한다.", "국무부가 임시정부와 동렬에 놓는 \"다른 한국인 단체\"란 한국판 루블린 위원회를 지향하는 소수의 공산계 선동가들일 뿐이며, 이들이 국무부 일부 관리의 협조를 받고 있다고 비난한다.", "국무부가 승인을 미루는 것은 한국 공산주의자에게 루블린식 정부를 세울 기회를 주려는 것으로 보인다고 의심하며, 그 결과는 민족주의 다수파와 공산주의 소수파 사이의 유혈사태라고 경고한다.", "소련이 한국인 홍기군(Korean Red Banner Army) 8만 명을 해산해 민간인 복장으로 한국에 들여보내고 있다고 주장하며, 유럽 해방국들의 전철을 아시아에서 되풀이하면 한국인의 선택권은 거의 없을 것이라고 한다.", "1905년 이래 한국을 희생시킨 대일 유화정책이 진주만 참사를 낳았듯, 한국에 대한 정의를 희생하는 대소 유화정책도 재앙으로 귀결될 것이라며 즉각적인 임시정부 지지 조치를 요청한다."], "primary": "친애하는 록하트 씨께: 6월 8일[5일] 자 귀하의 친절한 서한과, 보도된 얄타 비밀협정에 관하여 국무차관 조지프 C. 그루(Joseph C. Grew) 각하께서 공표하신 성명에 진심으로 감사드립니다. 한국의 장래 지위에 영향을 미치는 그러한 협정이 존재하지 않는다는 부인은, 통상적인 상황이라면 충분한 것으로 여겨져야 마땅할 것입니다. 그와 동시에 저는 다음의 사항들에 비추어 저희의 의혹이 완전히 가시지는 않았음을 고백하지 않을 수 없습니다.\n\n(1) 그 비밀협정의 진정성은 흠잡을 데 없는 평판을 지닌 한 미국인이 보증하고 있으며, 그는 자신이 얻은 정보의 출처를 밝힐 것입니다.\n\n(2) 소련 당국은 지금까지 불길하게 침묵을 지켜 왔습니다. 저희는 소련 대사[주41]에게 해명을 요청하였으나 아직 아무런 답을 받지 못하였습니다.\n\n(3) 윈스턴 처칠 수상은 얄타에서 많은 주제가 논의되었으나 현재로서는 공개할 수 없다고 밝혔습니다. 그는 한국 문제가 그 가운데 없었다고는 말하지 않았습니다.\n\n(4) 지난 40년간 일본과 싸워 온 나라인 한국은 연합국에 복무하도록 그 방대한 인력을 제공하였고, 받아들여지기만 한다면 연합국 사상자의 수를 줄일 여러 전쟁 수행 계획을 제시하였으나, 미국은 저희의 요청을 하나도 들어주지 않고 끈질기게 거부하였습니다. 이는 얄타 회담 훨씬 이전부터 구두로든 문서로든 유사한 성격의 합의가 있었음을 가리킵니다.\n\n(5) 한국은 1905년에 비밀외교의 희생물이 되었습니다. 그것은 여러 해가 지난 뒤에야 밝혀졌으니, 한국인이 항의하기에는 너무 늦은 때였습니다. 외교적 항변과 부인보다 더 실질적인 보장을 원한다고 하여 누가 그들을 탓할 수 있겠습니까?\n\n한국 인민이 한국의 자유와 독립을 서약한 카이로 선언에 대하여 고(故) 루스벨트 대통령, 처칠 수상 및 장제스 총통에게 감사하고 있다는 사실은 한 번 이상 밝혀진 바 있습니다. 저희는 또한 국무부 관리들이 저희에게 준 확약을 고맙게 여기며, 성의로써 주어진 그 확약을 신뢰합니다.\n\n국무차관보 아치볼드 매클리시(Archibald MacLeish)의 최근 라디오 성명, 곧 한국인은 카이로 선언에 명시된 대로 \"적절한 시기에(in due course)\" 독립을 얻을 것이며, 나아가 \"이는 아마도 그들이 스스로를 통치할 수 있는 위치에 이르는 즉시를 뜻할 것\"이라고 한 발언에 관해서는, 저희는 \"아마도\"보다 더 명확하게 알기를 바랍니다.\n\n귀하의 서한에 있는 다음 진술, 곧 \"샌프란시스코 회의에 대표를 보낸 연합국은 모두 법적으로 구성된 통치 당국을 갖고 있는 반면, 대한민국임시정부와 그 밖의 한국인 단체들은 미국에 의하여 통치 당국으로 승인받는 데 필요한 자격을 갖추고 있지 않다\"는 말은, 대한민국임시정부가 무엇인가 근본적인 것을 결여하고 있음을 뜻합니다. 저희가 아는 한, 대한민국임시정부가 미국의 승인을 받기 위하여 갖추지 못한 자격이란 없습니다. 국제법상 승인의 첫째가는 전제조건의 하나로 꼽혀 온 안정성(stability)은 임시정부가 이미 입증하였습니다. 임시정부는 4반세기 동안 온갖 풍파를 견뎌내고도 여전히 유일한 한국 정부로 서 있습니다.\n\n국제법이 요구하는 또 하나의 조건은 인민 자신에 의한 그 정부의 지지입니다. 이 조건 역시 한국 인민이 충족시켜 왔습니다. 저희는 의견의 만장일치를 [1034면] 주장하지 않습니다. 그러나 한국 안팎의 저희 인민의 압도적 다수가 확고하게 저희를 지지하고 있습니다.\n\n게다가 한국 정부는 1919년 상하이나 그 밖의 어느 곳이 아니라, 한국 13개 도의 대표들에 의하여 서울에서 수립되었습니다. 서울 선언 원본의 사본을 동봉합니다.[주42]\n\n이 정부가 한국에서 조직되는 동안 상하이에서 하나가, 또 시베리아에서 또 하나가 동시에 생겨났습니다. 그러나 서울의 발표가 전해지자 다른 두 정부는 자진하여 그 계획을 접고, 수천 한국인의 목숨을 희생하여 생겨난 서울 정부에 합류하였습니다.\n\n중국 정부와 프랑스 임시정부는 적어도 그 사실상(de facto)의 지위를 승인하였습니다. 전자는 그 밖에도 할 수 있는 모든 재정 원조를 저희에게 해 주고 있습니다.\n\n1944년 4월에 조직된 저희의 연립내각은 민족주의자, 공산주의자, 심지어 \"무정부주의자\"까지 포함하여 자유중국 내 모든 한국인의 통일을 이루어 냈습니다. 그럼에도 \"한국인의 분열\"이라는 이야기는 처음에는 친일 분자들에 의하여, 나중에는 이 나라 도처의 친공 분자들에 의하여 너무도 널리 선전되어, 한국 인민에 관하여 일반 대중에게 전혀 그릇된 인상을 심어 놓았습니다. 실상 한국인들 사이의 \"분열\"이란 모든 민주국가에 존재하는 공산주의 소수파와 민족주의 다수파 사이의 분열에 지나지 않습니다. 국무부가 거듭 언급해 왔고 국무부 관리들이 대한민국임시정부와 같은 반열에 놓아 온 \"그 밖의 한국인 집단들\", \"그 밖의 단체들\"이란, 한국을 위한 루블린 위원회[주43]를 지향하는 경향을 지닌 한 줌의 한국인 공산주의 선동가들과 친공 집단들에 다름 아닙니다. 이들 집단은 국무부 일부 관리들의 협조를 받아 왔고 지금도 받고 있습니다. 그들은 한국인의 다수가 임시정부에 반대한다는 인상을 은밀히 만들어 내고 있습니다. 그러나 한국 인민 사이에서는 감히 공공연하게 임시정부에 맞서지 못합니다.\n\n만일 그 선언된 통치 원칙이 미국의 그것에 기초하고 있는 한국 민족주의 정당이, \"승인을 받기 위한 필요조건\"으로 요구되는 자격을 충족시키기 위하여 소수 공산주의자들의 요구에 자신들의 임시정부를 내주어야 한다면, 다른 모든 민주국가에 만장일치가 없듯이 한국인들 사이에도 만장일치란 없으리라고 [1035면] 인정하는 편이 낫겠습니다. 동시에 저희는 한국 안의 모든 한국인이 조국의 독립이라는 하나의 목표로 단결해 있음을 확언드립니다.\n\n저희는 마침내 \"'대한민국임시정부'와 같은 집단을 상대함에 있어 본국 정부의 정책은, 연합국의 승리가 달성되었을 때 한국 인민이 자신들이 수립하고자 하는 정부의 최종적 형태와 인적 구성을 선택할 권리를 훼손할 소지가 있는 조치를 취하지 않는다는 것\"이라는 사실을 밝혀 주신 데 대하여 특별히 감사드립니다. 이는 국무부가 한국 공산주의자들에게 루블린식 정부를 구성할 기회를 주기 위하여 대한민국임시정부의 승인을 미루어 왔다는 저희의 믿음을 확인해 주는 듯합니다. 만일 그러하다면, 이야말로 한국을 민주주의에 안전한 곳으로 만들기 위하여 저희가 막고자 애써 온 바로 그것입니다.\n\n사실을 말하자면 한국에는 공산주의 문제가 없습니다. 한국 공산주의자와 관련하여 저희가 안고 있는 문제란 미국과 자유중국에 있는 한 줌의 공산주의자 및 친공 선동가들뿐입니다. 시베리아에 있는 다수의 한국인 주민은, 저희가 믿기로는 그 정서에 있어 대부분 민족주의적입니다. 그러므로 만일 연합국이 진주만 참사 이후에 인민의 의사를 대표하는 대한민국임시정부에 지지와 협력을 주었더라면, 임시정부는 공산주의자를 포함한 모든 이견 세력을 통합할 수 있는 위치에 있었을 것이고, 그 결과 시베리아의 한국인들조차 한국 정부와 소련 정부 양쪽 모두의 충실한 벗이 되었을 것입니다. 국무부의 조치 지연은 사태를 매우 복잡하게 만들었으나 아직 너무 늦지는 않았습니다.\n\n반면에 만일 국무부가 한국 공산주의자들이 대한민국임시정부에 맞서는 정부를 세울 수 있는 위치에 이를 때까지 이 문제를 미결로 남겨 두기로 작정한 것이라면, 그 불가피한 결과는 한국 안의 민족주의 다수파와 공산주의 소수파 사이의 유혈사태일 것입니다. 소련 정부는 한국인 홍기군(Korean Red Banner Army)에서 약 8만 명의 한국인을 해산시켜 민간인 복장으로 한국에 들여보내 왔습니다. 그 해독한 선전은 중국과 유럽 여러 나라에서 그러하였듯 한국에서도 반드시 심각한 문제를 일으킬 것입니다. 유럽의 해방된 나라 대부분에서 벌어진 사건들에 비추어 볼 때, 만일 미국이 유럽에서 일어난 일을 아시아에서도 일어나도록 허용한다면 한국 인민에게는 스스로 선택할 기회가 거의 없으리라는 점을 저희는 확언드립니다. 한국 인민에게 자신들이 선택한 정부를 세울 공정한 기회를 주려는 미국 정부의 선의는 소련의 지배 아래에서는 실현될 수 없을 것입니다.\n\n결국 이 정책은 미국을 불리한 처지에 놓이게 할 것이니, 저희가 국무부 [1036면] 관리들에게 말씀드려 온 바를 다시 한번 되풀이합니다. 1905년 이래 한국을 희생시키면서 일본을 유화(宥和)해 온 정책이 진주만의 참사를 불러왔듯이, 한국에 대한 정의를 희생시키면서 소련을 유화하는 정책은 반드시 재앙으로 귀결될 것입니다.\n\n그러므로 저희는 귀하와 국무부의 다른 관리들께, 한국을 위해서만이 아니라 미국을 위해서도 대한민국임시정부를 지지하는 즉각적인 조치를 취해 주실 것을 간청합니다.\n\n삼가 올림,\n\n이승만(Syngman Rhee)", "secondary": "895.01/7–2545\n\nThe Chairman of the Korean Commission in the United States (Rhee) to the Acting Chief of the Office of Far Eastern Affairs (Lockhart)[주40]\n\nWashington, July 25, 1945.\n\nMy Dear Mr. Lockhart: I sincerely appreciate your kind letter of June 8 [5] and also the statement made public by the Under Secretary of State, Honorable Joseph C. Grew, regarding the reported secret agreement of Yalta. The denial of the existence of such an agreement affecting the future status of Korea should be considered sufficient under ordinary circumstances. At the same time, I have to confess that our doubts are not entirely dispelled in the light of the following points: (1)The authenticity of the secret agreement is vouched for by an American of unimpeachable reputation and he will reveal the source of his information.(2)The Soviet authorities have so far remained ominously silent. We have asked the Soviet Ambassador[주41] for clarification but as yet have received no reply.(3)Prime Minister Winston Churchill declared that there were many topics discussed at Yalta but they could not be revealed at present. He did not say that the Korean question was not among them.(4)Korea, the country that has fought Japan for the last forty years, offered its tremendous manpower in the service of the United Nations and presented many programs of war efforts that would reduce the number of Allied casualties, if accepted but the United States persistently refused to grant any of our requests. This indicates there was an agreement of a similar nature, either oral or written, long before the Yalta Conference.(5)Korea was made a victim of secret diplomacy in 1905. It was revealed many years later, too late for the Koreans to protest. Can anyone blame them if they desire some assurances more substantial than diplomatic protestations and denials?\n\nIt has been stated more than once that the Korean people are grateful to the late President Roosevelt, Prime Minister Churchill and Generalissimo Chiang Kai-shek for the Cairo Declaration pledging the freedom and independence of Korea. We also appreciate the reassurances given us by the officers of the State Department and rely upon those reassurances made in good faith.\n\nReferring to the recent radio statement made by Assistant Secretary of State, Archibald MacLeish, that the Koreans will get their independence, “in due course,” as stated in the Cairo Declaration and further, “which presumably means as span as they are in a position to govern themselves.” We desire to know more definitely than presumably.\n\nThe statement in your letter, “the United Nations which are represented at the San Francisco Conference all have legally constituted government authorities, whereas the Korean Provisional Government and other Korean organizations do not possess the qualifications requisite for obtaining recognition by the United States as a governing authority,” denotes that the Korean Provisional Government is lacking something fundamental. There is no qualification which we know of that the Korean Provisional Government fails to possess for recognition by the United States. Stability, which has been in international law as one of the first prerequisites for recognition, has been proven by it. It has weathered all sorts of storms over a quarter of a century and still stands as the only Korean government.\n\nAnother condition required by international law is the support of that government by the people themselves. This condition has also been met by the Korean people. We do not claim a unanimity of [1034면] opinion. But an overwhelming majority of our people, in and out of Korea, are solidly behind us.\n\nAnd besides, the Korean Government was established at Seoul in 1919 by the representatives of the thirteen Provinces of Korea, not in Shanghai or anywhere else. Enclosed is a copy of the original Seoul Proclamation.[주42] While this government was being organized in Korea, one in Shanghai and another in Siberia came into being simultaneously. However, when the Seoul announcement was received, the other two voluntarily dropped their programs and joined the Seoul Government which was brought into existence at the sacrifice of thousands of Korean lives.\n\nThe Chinese Government and the Provisional Government of France have recognized its de facto status, at least. The former has been giving us, in addition, all the financial aid it could.\n\nOur coalition cabinet organized in April, 1944, including the Nationalists, Communists and even an “Anarchist,” accomplished the unity among all the Korean people in Free China. Yet “the Korean disunity” story has been so widely propagandized, first by the pro-Japanese and later by the pro-Communist elements everywhere in this country, that it has created entirely a false impression on the general public regarding the Korean people. In fact, the “disunity” among the Koreans is no more than the disunity existing in all the democratic nations between the Communist minority and the Nationalist majority. “The other Korean groups” and “the other organizations” which the State Department has been mentioning repeatedly and which the officers of the State Department have been placing on the same level as the Korean Provisional Government are none other than a handful of Korean Communist agitators and pro-Communist groups, whose tendency is to work toward a Lublin Committee[주43] for Korea. These groups have been and still are receiving the cooperation of some of the officers of the State Department. They are secretly creating the impression that a majority of the Koreans are against the Provisional Government. But among the Korean people they dare not stand openly against it.\n\nIf the Korean Nationalist Party, whose declared principle of government is based on that of the United States, has to yield their Provisional Government to the demands of the few Communists in order to meet the qualifications required as “requisite for obtaining recognition” we might as well admit that there would be no unanimity among the Koreans just as there is no unanimity among all other democratic [1035면] nations. At the same time, we assure you that all the Koreans in Korea are united with one objective—the independence of their country.\n\nWe are particularly grateful to you for revealing at last the fact that “the policy of this Government in dealing with groups such as the ‘Korean Provisional Government’ is to avoid taking action which might when the victory of the United Nations is achieved tend to compromise the right of the Korean people to choose the ultimate form and personnel of the government which they may wish to establish.” This seems to confirm our belief that the State Department has been delaying the recognition of the Korean Provisional Government in order to give the Korean Communists a chance to form a Lublin government. If it is so, this is just what we have been endeavoring to avoid in order to make Korea safe for democracy.\n\nAs a matter of fact, there is no Communist problem in Korea. All the problem we have relating to the Korean Communists is only a handful of Communists and pro-Communist agitators in America and Free China. A large number of the Korean population in Siberia are, as we believe, mostly Nationalistic in their sentiment. If, therefore, the United Nations had given their support and cooperation to the Provisional Government of the Republic of Korea, which represents the will of the people, after the Pearl Harbor disaster, it would have been in a position to unify all the dissident elements including the Communists with the result that even the Koreans in Siberia would have become loyal friends of both the Korean and Soviet governments. The delay of action by the State Department has made the situation quite complicated but it is still not too late.\n\nIf, on the other hand, the State Department is determined to leave the question undecided until the Korean Communists are in a position to form a government in opposition to the Korean Provisional Government, the inevitable result would be a bloodshed between the Korean Nationalist majority and the Communist minority in Korea. The Soviet Government disbanded some 80,000 Koreans from the Korean Red Banner Army and has been sending them into Korea in civilian garb. The poisonous propaganda will surely create a serious problem in Korea as in China and many of the European countries. In the light of the events which took place in most of the liberated countries in Europe, we assure you the Korean people would have very little chance to have their own choice, if the United States should permit to happen in Asia what has happened in Europe. The good intentions of the United States Government to give the Korean people a fair chance to establish a government of their choice would be impossible under Soviet domination.\n\nIn the long run, this policy will place the United States at a disadvantage, to reiterate once more what we have said to the officers of [1036면] the State Department. Just as the policy of appeasing Japan since 1905, at the expense of Korea, led to the Pearl Harbor disaster, the policy of appeasing the Soviet Union at the sacrifice of justice to Korea, is bound to result in disaster.\n\nTherefore, we plead with you and other officers of the State Department to take immediate action in support of the Korean Provisional Government, not only for the sake of Korea but for that of the United States as well.\n\nRespectfully yours,\n\nSyngman Rhee", "notes": ["[주40] 국무부 문서철에는 이 문서에 대한 회신의 흔적이 없다.", "[주41] 안드레이 안드레예비치 그로미코(Andrey Andreyevich Gromyko), 주미 소련 대사.", "[주42] 게재하지 않음.", "[주43] 1944년 7월 모스크바에서 그 수립이 발표된 폴란드 민족해방위원회(Polish Committee of National Liberation). 해방된 폴란드의 민정(民政)을 인수하기로 되어 있던 이 위원회는 소련의 승인을 받아 루블린에 그 소재지를 두었다. 1944년 12월 31일 이 위원회는 스스로를 폴란드 임시정부로 선포하였다. 이 주제에 관한 문서는 제5권 110면 이하 여러 곳 참조."], "warn": true, "pages": [1032, 1033, 1034, 1035, 1036], "search": "Syngman Rhee 이승만 Frank P. Lockhart 프랭크 P. 록하트 Joseph C. Grew 조지프 C. 그루 Archibald MacLeish 아치볼드 매클리시 Winston S. Churchill 윈스턴 처칠 Franklin D. Roosevelt 루스벨트(고인으로 언급) Chiang Kai-shek 장제스 Andrey Andreyevich Gromyko 안드레이 그로미코(각주)"}, {"id": "d769", "order": 769, "date": "1945-08-14", "group": "B", "eyebrow": "d769 · The Ambassador in China (Hurley) to the Secretary of State", "title": "주중 대사(헐리)가 국무장관에게", "badge": "", "list_right": "문서 769", "meta": [{"k": "일자", "v": "1945-08-14"}, {"k": "발신", "v": "주중 미국대사 헐리(Patrick J. Hurley)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "장소", "v": "중경(Chungking)"}, {"k": "전문번호", "v": "1356"}, {"k": "종류", "v": "전보"}, {"k": "원문출처", "v": "895.01/8–1445: Telegram", "txt": true}], "links": [{"k": "FRUS", "text": "문서 769 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d769"}], "summary": "대한민국임시정부 외무부장 조소앙이 중경 미국대사관을 방문하여 미군 점령에 대한 협력, 일본군 내 조선인 무장해제 지원, 조선 정치 문제에 대한 발언권을 요청했다는 보고.", "points": ["1945년 8월 14일 「대한민국임시정부 외무부장」 조소앙이 중경 미국대사관을 방문", "임시정부는 조선 상륙 시 점령군, 특히 미군과 협력하기를 희망", "극동 각지에 흩어진 일본군 내 조선인 약 100만 명의 무장해제·처리를 미군에 지원하겠다는 제안", "조선인 혁명 지도자들은 조선 정치 문제에 발언권을 갖기를 희망한다. 예로 일본·만주·러시아로부터 수백만 조선인의 송환 문제, 조선 내 공장 처리 문제를 거론한다", "대화 내용으로 보아 조소앙은 조선에서의 소련의 영향력과 행동을 우려하고 있음이 분명했음", "조소앙에게는 그의 발언이 국무부에 보고될 것이라고 통지"], "primary": "1356. 「대한민국임시정부 외무부장」 조소앙(Tjo So-wang) 씨가 8월 14일 대사관을 방문했다. 일본의 패배에서 미국이 담당한 몫에 대한 축하의 말을 한 뒤, 그는 다음과 같이 말했다. (1) 「임시정부」는 조선에 상륙하는 점령군, 특히 미군과 협력하기를 희망한다. (2) 「임시정부」는 극동 전역에 흩어져 있는 일본군 내 조선인 약 100만 명의 무장해제 및 처리에서 미군을 지원하기를 원한다. (3) 조선인 혁명 지도자들은 조선의 정치 문제가 관련된 곳에서 발언권을 갖기를 희망한다. 그는 그 사례로 일본, 만주, 러시아로부터의 수백만 조선인의 송환 문제와 조선 내 공장 처리 문제를 언급했다. 그의 대화로 보아 그가 조선에서의 소련의 영향력과 행동을 우려하고 있음이 분명했다.\n\n조소앙 씨에게는 그의 발언이 국무부에 보고될 것이라고 알렸다.\n\n국무부로 발송. 모스크바에 사본 전송.\n\n헐리(Hurley)", "secondary": "895.01/8–1445: Telegram\n\nThe Ambassador in China (Hurley) to the Secretary of State\n\nChungking, August 14, 1945—4 p.m. \n [Received August 15—10:10 a.m.]\n\n1356. Mr. Tjo So-wang, “Minister for Foreign Affairs of Korean Provisional Government” called at Embassy August 14. After congratulatory remarks on American share in Japanese defeat, he said that (1) “Provisional Government” wished to cooperate with occupational forces, particularly American, on landing in Korea, (2) “Provisional Government” desired to assist American forces in disarming and disposing of the approximately one million Koreans in Japanese Army scattered through Far East, and (3) Korean revolutionary leaders wished to have a voice where Korean political problems are concerned; he mentioned, as instances, repatriation of several million Koreans from Japan, Manchuria, and Russia, and question of disposal of factories in Korea. It was evident from his conversation that he was apprehensive of Soviet influence and actions in Korea.\n\nMr. Tjo So-wang was informed that his remarks would be reported to Department.\n\nSent to Department. Repeated to Moscow.\n\nHurley", "notes": [], "warn": false, "pages": [1036], "search": "Patrick J. Hurley 패트릭 J. 헐리 (주중 미국대사) Tjo So-wang 조소앙 (대한민국임시정부 외무부장)"}, {"id": "d770", "order": 770, "date": "1945-08-17", "group": "B", "eyebrow": "d770 · The Chairman (Kim) and the Foreign Mmister (Tjo) of the Provisional Government of the Republic of Korea to the Chairman of the Korean Commission in the United States (Rhee)", "title": "대한민국임시정부 주석(김구)과 외무부장(조소앙)이 주미 한국위원회 위원장(이승만)에게", "badge": "", "list_right": "문서 770", "meta": [{"k": "일자", "v": "1945-08-17"}, {"k": "발신", "v": "대한민국임시정부 주석 김구(Kim)와 외무부장 조소앙(Tjo)", "txt": true}, {"k": "수신", "v": "주미 한국위원회 위원장 이승만(Rhee)", "txt": true}, {"k": "장소", "v": "중경(Chungking)"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "전보"}, {"k": "원문출처", "v": "895.01/8–1845: Radiogram", "txt": true}], "links": [{"k": "FRUS", "text": "문서 770 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d770"}], "summary": "임시정부가 이승만을 통해 트루먼 대통령에게 전달을 요청한 메시지로, 일본의 무조건 항복을 5대 강국에 축하하고 조선이 일본으로부터 해방되는 것임을 확인하며 향후 각종 회의·기구에 임시정부 대표를 참여시킬 것을 요청한다.", "points": ["임시정부와 조선 인민을 대표하여 미국·영국·소련·프랑스공화국·중화민국 5대 강국에 일본의 무조건 항복 달성을 축하", "연합국이 조선의 역사적 지위를 충분히 인식하고 있으리라 믿으며, 조선은 결코 지금 일본 본토에서 분리되는 영토가 아님을 강조", "조선은 지금 일본의 강압적 침략으로부터 해방되는 것임을 거듭 확인", "포츠담회담에서 선언된 원칙에 동의하며 세 가지 방식의 협력을 희망: (1) 일본 항복 후속 조치 수행을 위해 연합국 협의기관에 임시정부 대표 파견", "(2) 휴전 조인 후 조선과 조선인의 현재·장래 운명에 관한 모든 회의에 참가", "(3) 장차 평화회의 및 UNRRA 등 조선 문제가 걸린 모든 공식·비공식 회합에 대표 참석 요청"], "primary": "다음 메시지를 트루먼 대통령에게 전달해 주시기 바랍니다.\n\n「우리 서명자들은 대한민국임시정부와 조선 인민을 대표하여, 5대 주요 강국 — 미합중국, [1037면] 영국, 소비에트 러시아, 프랑스공화국 및 중화민국 — 이 위 연합국들의 막강한 노력을 통하여 일본의 무조건 항복을 극히 신속하게 달성하고, 그로써 모든 침략 세력을 종식시키며 전 세계에 평화와 정의를 회복한 데 대하여 진심으로 축하드리는 영광을 갖습니다. 이미 여러 강국에 제출한 수많은 성명, 선언, 각서를 통하여 조선인의 기본적 염원과 목표는 표명되어 왔습니다. 우리는 연합국들이 조선의 역사적 지위를, 그리고 조선이 결코 지금 일본 본토로부터 분리되고 있는 영토가 아니라는 점을 충분히 인식하고 있다고 믿습니다. 우리는 조선이 지금 일본의 강압적 침략으로부터 해방되는 것이라는 사실을 거듭 밝힙니다. 최근 포츠담회담에서 선언된 원칙들에 동의하면서, 우리는 다음과 같은 방식으로 조력하고 협력하기를 희망하며 또 그럴 준비가 되어 있습니다.\n\n1. 대한민국임시정부는 일본의 항복에 따르는 모든 관련 활동을 수행할 것이며, 이를 가장 효과적으로 달성하기 위하여 우리 임시정부의 대표들을 협의와 협력적 집행을 위한 책임 있는 각 연합국 협의위원회 및/또는 기관에 파견하기를 희망합니다.\n\n2. 휴전 조인에 뒤이어, 조선과 조선인의 현재 및 장래의 운명에 영향을 미치는 모든 협의회에 참가하기를 희망합니다.\n\n3. 다가올 평화회의 및 UNRRA[주45] 등과 같은 모든 공식 및/또는 비공식 회합에서, 조선 문제가 관련된 곳이면 어디서나 우리가 대표되기를 요청합니다.\n\n최고의 경의를 표하며 이상의 제안을 제출합니다.」\n\n김구(Koo Kim)\nY. 조소앙(Y. Tjo So-wang)", "secondary": "895.01/8–1845: Radiogram\n\nThe Chairman (Kim) and the Foreign Mmister (Tjo) of the Provisional Government of the Republic of Korea to the Chairman of the Korean Commission in the United States (Rhee)[주44]\n\nChungking, August 17, 1945.\n\nPlease convey following message to President Truman.\n\n[“]We the undersigned in behalf of the Korean Provisional Government and of the Korean people have the honour to congratulate most heartily the five leading Powers—the United States of America, [1037면] Great Britain, Soviet Russia, the Republic of France and the Republic of China—on the excessively speedy attainment of Japan’s unconditional surrender and thereby ending all aggressive forces and reinstating peace and justice throughout the world through the mighty efforts of the said Allied Powers. Already by numerous statements, declarations and memorandums presented to the Powers the basic desire and aim of the Koreans have been expressed. We trust the Allied Powers are fully cognizant of Korea’s historical status and that Korea is by no means a territory now being severed from Japan proper. We reiterate the fact that Korea is now to be liberated from Japan’s forcible aggression. Agreeing to the principles declared by the recent Potsdam Conference we desire and are prepared to assist and cooperate in the following ways: 1.The Korean Provisional Government will carry out all pertinent operations ensuing Japan’s surrender and to achieve this most effectively we desire to dispatch our Provisional Government’s representatives to the responsible and respective Allied council commissions and/or organs for consultation and cooperative execution.2.Following the signing of the Armistice we desire participation in all Councils affecting the present and future destiny of Korea and Koreans.3.In the coming Peace Conference and in all official and/or unofficial gatherings such as the UNRRA,[주45] etc. wherever the Korean question is involved we request to be represented. Expressing our most respectful and highest consideration we submit these suggestions.[”]\n\nKoo Kim \n Y. Tjo So-wang", "notes": ["[주44] 이 사본은 8월 18일 이승만 박사가 트루먼 대통령에게 전달했고, 8월 21일 백악관 행정비서관(라타)이 국무장관에게 회부했으며, 9월 7일 국무장관 대리가 접수를 확인했다(895.01/8–1845).", "[주45] 연합국구제부흥기관(United Nations Relief and Rehabilitation Administration)."], "warn": false, "pages": [1036, 1037], "search": "Koo Kim 김구 (대한민국임시정부 주석) Tjo So-wang 조소앙 (대한민국임시정부 외무부장) Syngman Rhee 이승만 (주미 한국위원회 위원장) Harry S. Truman 해리 S. 트루먼 (미국 대통령) Latta 라타 (백악관 행정비서관)"}, {"id": "d771", "order": 771, "date": "1945-08-22", "group": "A", "eyebrow": "d771 · Draft Memorandum to the Joint Chiefs of Staff", "title": "합동참모본부 앞 각서 초안", "badge": "", "list_right": "문서 771", "meta": [{"k": "일자", "v": "1945-08-22"}, {"k": "발신", "v": "국무차관보 던(James C. Dunn) 작성, 국무·육군·해군 3부조정위원회(SWNCC) 회람", "txt": true}, {"k": "수신", "v": "합동참모본부(JCS)", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "Records of the State-War-Navy Coordinating Committee, Lot 52–M45 [SWNCC 176 Series]", "txt": true}], "links": [{"k": "FRUS", "text": "문서 771 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d771"}], "summary": "조선 점령이 4개국 분할 방식이라는 맥아더의 전제를 부인하고, 조선에 관한 유일한 국제적 양해는 얄타에서 구두로 합의된 4개국 신탁통치뿐이며 이는 점령 이후 단계의 문제임을 밝힌 국무부 초안.", "points": ["1945년 8월 22일자 JCS의 SM 3005(태평양미육군총사령관의 전문 전달)에 대한 회답 초안", "\"조선 점령은 4개국 분할 방식으로 이루어질 것이므로\"라는 총사령관 전문의 첫 구절은 옳지 않은 것으로 이해된다", "얄타 3대 연합국 회의에서 미국·소련·영국·중국이 조선에 임시 국제신탁통치를 수립한다는 구두 양해가 성립했으며, 확인되는 한 이것이 조선에 관한 유일한 국제협정이다", "그 양해는 조선 점령기 이후의 시기와 상태에 관한 것이다", "JCS에만 알리는 사항: 조선 민사행정의 성격에 관해 합의된 미국의 견해는 없으나, 국무부는 일본군 항복 완료 후 실행 가능한 한 빨리 민사행정을 통합하여 조선 전체를 하나의 중앙집권적 행정구역으로 삼는 것이 정치적으로 바람직하다고 본다", "항복 완료 시점까지 민사행정은 조선 내 두 지대의 각 사령관 책임이며, 통합 후에는 점령에 참가하는 미국·소련 및 기타 군대 사령관들로 구성된 위원회의 통제하에 둘 수 있다", "얄타 구두 양해에 따른 잠정 계획은 국제연합 총회 감독하에 4대 연합국에 의한 조선 임시신탁통치를 가능한 한 빨리 발효시키는 것을 상정", "[대괄호 안 부기] 1950년 딘 러스크가 38선 획정 경위를 회고했다. 8월 10~11일 밤 맥클로이의 요청으로 본스틸 대령과 러스크가 인접실에서 안을 마련했고, 조선의 수도를 미군 책임구역에 포함시키는 것이 중요하다고 보아 38선을 권고했다"], "primary": "1945년 8월 22일자 합동참모본부(JCS)의 SM 3005[주47]를 참조한다. 이는 조선 점령에 관한 국제협정에 관하여 [1038면] 태평양미육군총사령관(Commander in Chief, Army Forces, Pacific)이 보내온 전문을 전달한 것이다.\n\n총사령관 전문의 첫 구절, 즉 \"조선의 점령이 4개국 분할 방식(quadri-partite basis)으로 이루어질 것인 만큼\"이라는 대목은 옳은 것으로 이해되지 않는다. 얄타의 3대 연합국 회의에서, 미국·소련·영국 및 중국이 조선에 대하여 임시 국제신탁통치를 수립한다는 구두 양해가 이루어졌다. 확인할 수 있는 한 위에서 말한 양해가 조선에 관련되는 유일한 국제협정이며, 그 협정은 조선 점령기 이후의 시기와 상태에 관련되는 것이다.\n\n다음은 JCS에만 알리는 사항이다.\n\n조선 민사행정의 성격에 관하여 합의된 미국의 견해는 없으나, 국무부는 일본군의 항복이 완료된 후 실행 가능한 한 조속히 — 그때까지 민사행정은 조선 내 두 지대의 각 사령관의 책임이 된다[주48] — 민사행정을 통합하여 조선 전체가 하나의 중앙집권적 행정구역을 이루도록 하는 것이 정치적으로 바람직할 것이라고 본다. 민사행정은 조선 점령에 참가하는 미국, 소련 및 기타 군대의 지휘관들로 구성되는 위원회의 통제하에 둘 수 있을 것이다.\n\n위에서 언급한 얄타에서 이루어진 구두 양해에 따라 조선에 국제적 관리기구를 설치하기 위한 현재의 잠정 계획은, 국제연합 총회의 감독하에 4대 연합국에 의한 조선 임시신탁통치를 수립하고 그 신탁통치를 가능한 한 조속히 발효시키는 것을 규정하게 될 것이다.[주49]\n\n[1039면]\n\n[1950년 7월 12일자 각서(740.00117 Control-(Korea)/7–1250)에서, 당시 극동담당 국무차관보였던 딘 러스크(Dean Rusk)는 역사정책연구과장 G. 버나드 노블(G. Bernard Noble)의 조선 38선에 관한 문의에 다음과 같이 답변했다.\n\n\"저는 38선 탄생의 '목격자'였으므로 아마 조금 더 자세한 내용을 덧붙일 수 있을 것입니다.\n\n일본의 갑작스러운 항복으로 국무부와 군 당국은 맥아더 장군에게 내릴 필요한 명령과, 일본의 항복에 관하여 다른 연합국 정부들과 맺어야 할 필요한 조정을 긴급히 검토해야 했습니다. 이를 위하여 SWNCC(국무부 던 씨, 육군부 맥클로이 씨, 해군부 랠프 바드 씨)는 8월 10일부터 15일 사이에 여러 차례 긴 회의를 열었습니다. 던, 맥클로이, 바드는 제 기억으로는 8월 10일에서 11일로 넘어가는 밤에 펜타곤의 맥클로이 씨 사무실에서 회의를 열었고, 그 회의는 밤 대부분에 걸쳐 계속되었습니다. 주제는 일본의 항복 접수를 위한 조정이었습니다. 국무부는 (번스 씨를 통하여) 미군이 실행 가능한 한 북쪽까지 항복을 접수할 것을 제안했습니다. 군 당국은 즉시 가용한 미군 병력이 부족하다는 점과, 소련군이 그 지역에 진입하기 전에 아주 멀리 북쪽까지 도달하기 어렵게 만드는 시간·공간 요인에 직면해 있었습니다.\n\n군 측의 견해는, 항복 접수에 관한 우리의 제안이 우리의 실현 가능한 군사적 능력을 크게 넘어설 경우 소련이 수락할 가능성이 거의 없으리라는 것이었습니다. 그리고 신속함이 문제의 핵심이었습니다. 맥클로이 씨는 C. H. 본스틸 3세 대령과 저(당시 육군부 일반참모부의 대령)에게 옆방으로 물러가서, 미군이 가능한 한 북쪽까지 항복을 접수하기를 바라는 정치적 요구와 미군이 그 지역에 도달할 능력의 명백한 한계를 조화시킬 안을 마련해 오라고 요청했습니다.\n\n우리는 38선을 권고했는데, 이는 소련이 동의하지 않을 경우 미군이 현실적으로 도달할 수 있는 것보다 더 북쪽이었음에도 그렇게 한 것입니다. 그렇게 한 이유는 조선의 수도를 미군의 책임구역에 포함시키는 것이 중요하다고 생각했기 때문입니다. 38선은 육군부가 국무부에 낸 권고의 일부가 되었고, 그 선은 그 후 국제적으로 합의되었습니다. 저는 당시에 소련이 38선을 수락한 데 다소 놀랐던 것을 기억합니다. 그 지역에서의 양측의 군사적 위치로 보아 소련이 더 남쪽의 선을 고집할지도 모른다고 생각했기 때문입니다.\n\n위의 내용은 문서가 아니라 기억에 근거한 것이지만, 이 문제에 얼마간 빛을 더 비추는 데 도움이 될지도 모르겠습니다.\"]", "secondary": "Records of the State-War-Navy Coordinating Committee, Lot 52–M45\n\nDraft Memorandum to the Joint Chiefs of Staff[주48]\n\n[SWNCC 176 Series]\n\n[Washington, undated.]\n\nReference is made to SM 3005, dated August 22, 1945 from the Joint Chiefs of Staff[주47] communicating a message from the Commander in [1038면] Chief, Army Forces, Pacific, with regard to international agreements relating to the occupation of Korea.\n\nThe initial clause of the message from the Commander in Chief reading “in as much as the occupation of Korea is to be on a quadri-partite basis”, is not understood to be correct. An oral understanding was reached at the Conference of the Three Major Allies at Yalta that the United States, the Soviet Union, the United Kingdom, and China should establish a temporary international trusteeship over Korea. So far as can be ascertained the understanding referred to above is the only international agreement which relates to Korea, and that agreement would relate to a period and to a condition subsequent to the period of occupation of Korea.\n\nThe following is for the information of the JCS only:\n\nAlthough there is no agreed United States view as to the character of administration of civil affairs in Korea, the Department of State believes that it would be politically advisable that, as soon as practicable after the surrender of the Japanese forces is completed, up to which time the administration of civil affairs will be the responsibility of the respective Commanders of the two zones in Korea,[주48] the administration of civil affairs should be combined, so that the whole of Korea would constitute a centralized administrative area. The civil administration might be placed under the control of a council made up of the Commanding Officers of the United States, Soviet, and other forces participating in the occupation of Korea.\n\nPresent provisional plans for the setting-up, in accordance with the oral understanding above mentioned reached at Yalta of an international authority in Korea, would provide for the establishment of a temporary trusteeship for Korea by the Four Major Allies, under the supervision of the General Assembly of the United Nations, such trusteeship to become effective as soon as possible.[주49]\n\n[1039면]\n\n[In a memorandum dated July 12, 1950 (740.00117 Control-(Korea)/7–1250), the then Assistant Secretary of State for Far Eastern Affairs, Dean Rusk, answered an inquiry from the Chief of the Division of Historical Policy Research, G. Bernard Noble, in regard to the 38th parallel in Korea as follows:\n\n“Since I was an ‘eye witness’ to the birth of the 38th parallel perhaps I can add a little more detail:\n\nThe suddenness of the Japanese surrender forced emergency consideration by the Department of State and the armed services of the necessary orders to General MacArthur and the necessary arrangements with other allied governments about the Japanese surrender. For this purpose, SWNCC (Mr. Dunn for State, Mr. McCloy for Army, and Mr. Ralph Bard for Navy) held several long sessions during the period August 10–15. Dunn, McCloy and Bard held a meeting in Mr. McCloy’s office in the Pentagon on, I believe, the night of August 10–11, a meeting which lasted throughout most of the night. The subject was arrangements for the receipt of the Japanese surrender. The Department of State had suggested (through Mr. Byrnes) that U.S. forces receive the surrender as far north as practicable. The military was faced with the scarcity of U.S. forces immediately available and time and space factors which would make it difficult to reach very far north before Soviet troops could enter the area.\n\nThe military view was that if our proposals for receiving the surrender greatly over-reached our probable military capabilities, there would be little likelihood of Soviet acceptance—and speed was the essence of the problem. Mr. McCloy asked Col. C. H. Bonesteel, III, and me (then a Colonel on the War Department General Staff) to retire to an adjoining room and come up with a proposal which would harmonize the political desire to have U.S. forces receive the surrender as far north as possible and the obvious limitations on the ability of the U.S. forces to reach the area.\n\nWe recommended the 38th parallel even though it was further north than could be realistically reached by U. S. forces in the event of Soviet disagreement, but we did so because we felt it important to include the capital of Korea in the area of responsibility of American troops. The 38th parallel became a part of the Army’s recommendation to the Department of State and that line was subsequently agreed internationally. I remember at the time that I was somewhat surprised that the Soviet accepted the 38th parallel since I thought they might insist upon a line further south in view of our respective military positions in the area.\n\nThe above is based on memory and not on documents, but might help to throw some additional light on the point.”]", "notes": ["[주46] 육군 원수 더글러스 맥아더가 8월 22일 합동참모본부에 보낸 전문에 대한 회답안으로 국무차관보 던(Dunn)이 작성했으며, 국무·육군·해군 3부조정위원회가 8월 22일 회람했다. 맥아더 장군의 전문은 다음과 같다. \"조선의 점령이 4개국 분할 방식으로 이루어질 것인 만큼, 인접 및 중첩 지역 내 점령군 지휘관들 간의 직접 접촉에 관하여 연합국들, 특히 러시아와 도달한 합의와 조선에 관한 관련 지시 일체를 조속히 본 사령부에 통보해 줄 것을 요청한다. 이 정보는 재조선 미육군사령관(제24군단장) 앞 훈령서에 포함시키기 위하여 긴급히 필요하다.\" 사령관은 존 R. 하지(John R. Hodge) 중장이었다.", "[주47] 국무·육군·해군 3부조정위원회 앞. 미수록.", "[주48] 연합국최고사령관(맥아더)이 발한 일반명령 제1호에서는, 조선에서 38선 이북의 일본군 항복은 소련군이, 그 선 이남의 항복은 미군이 접수한다고 규정했다. 일반명령 제1호의 본문은 Report of Government Section, Supreme Commander for the Allied Powers: Political Reorientation of Japan, September 1945 to September 1948 (Washington, Government Printing Office, 1949), 부록 B, 442면에 수록되어 있다.", "[주49] 날짜 미상의 국무·육군·해군 3부조정위원회 앞 각서에서 육군차관보 맥클로이(McCloy)는 이 각서 초안이 \"맥아더 장군의 전문에 대한 회답이라고 볼 수 없으며, 그 전문은 조선 점령의 작전적 측면에만 관련되는 것으로 보인다\"고 밝히고 맥아더 장군 앞 전문 초안에 관한 자신의 안을 제출했다. 이 초안은 8월 24일 국무부의 요청으로 \"영국, 중국 또는 다른 국제연합국이 의사를 표명하지 않은 상태에서\"라는 문구를 추가하는 수정을 거쳐 같은 날 위원회의 승인을 받았다. 본문은 1040면 참조."], "warn": false, "pages": [1037, 1038, 1039], "search": "James C. Dunn 제임스 C. 던 (국무차관보) Douglas MacArthur 더글러스 맥아더 (육군 원수, 태평양미육군총사령관) John J. McCloy 존 J. 맥클로이 (육군차관보) Ralph Bard 랠프 바드 (해군부 대표) Dean Rusk 딘 러스크 (1950년 당시 극동담당 국무차관보, 1945년 당시 육군부 일반참모부 대령) C. H. Bonesteel III C. H. 본스틸 3세 (대령) G. Bernard Noble G. 버나드 노블 (역사정책연구과장) James F. Byrnes 제임스 F. 번스 (국무장관) John R. Hodge 존 R. 하지 (중장, 제24군단장)"}, {"id": "d772", "order": 772, "date": "1945-08-24", "group": "A", "eyebrow": "d772 · Memorandum by the State-War-Navy Coordinating Committee to Brigadier General Andrew J. McFarland, Secretary of the Joint Chiefs of Staff", "title": "국무·육군·해군 3부조정위원회가 합동참모본부 간사 앤드루 J. 맥팔런드 준장에게 보내는 각서", "badge": "", "list_right": "문서 772", "meta": [{"k": "일자", "v": "1945-08-24"}, {"k": "발신", "v": "국무·육군·해군 3부조정위원회(SWNCC), 간사 찰스 W. 매카시", "txt": true}, {"k": "수신", "v": "합동참모본부 간사 앤드루 J. 맥팔런드 준장", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "Records of the State-War-Navy Coordinating Committee, Lot 52–M45 [SWNCC 176 Series]", "txt": true}], "links": [{"k": "FRUS", "text": "문서 772 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d772"}], "summary": "조선의 초기 점령은 일반명령 제1호에 따라 미·소 양군만이 수행하며, 얄타에서의 다국 신탁통치 구두 양해는 초기 점령에 영향을 주지 않는다고 태평양미육군총사령관에게 통보할 것을 제안한 각서.", "points": ["제목: 조선 점령에 관한 국제협정", "영국·중국 또는 다른 국제연합국이 의사를 표명하지 않은 상태에서, 조선의 초기 점령은 일반명령 제1호 제1절 b항과 e항에 따라 미군과 소련군만이 수행한다", "장래의 임시 다국 신탁통치에 관한 구두 양해가 얄타에서 이루어졌다", "이 양해는 초기 점령에 영향을 미치지 않으며 반드시 최종적인 다국 점령으로 이어지는 것도 아니다", "조선에 관한 국제적 조정 문제는 국무부가 긴급히 검토 중이다", "SWNCC 극동소위원회가 조선에 관한 정치·경제 및 기타 사항에 대한 맥아더 장군 앞 지령을 우선 사항으로 작성하도록 지시받았다(SWNCC 176/2/D)"], "primary": "제목: 조선 점령에 관한 국제협정\n\n1. 위 제목에 관한 귀하의 1945년 8월 23[22]일자 SM-3005[주50]와 관련하여, 국무·육군·해군 3부조정위원회(SWNCC)는 태평양미육군총사령관에게 실질적으로 다음과 같이 통보할 것을 제안한다.\n\n영국, 중국 또는 다른 국제연합국이 의사를 표명하지 않은 상태에서, 조선의 초기 점령은 일반명령 제1호 제1절 b항과 e항의 규정에 따라 미군과 소련군만이 수행하게 된다. 조선에 대한 장래의 임시 다국(multi-partite) 신탁통치에 관한 구두 양해가 얄타에서 이루어졌다. 이 양해는 초기 점령에 영향을 미치지 아니하며, 반드시 최종적인 다국 점령으로 이어지는 것도 아니다. 조선에 관한 국제적 조정 문제는 국무부가 긴급히 검토 중이다.\n\n2. 국무·육군·해군 3부조정 극동소위원회는 조선에 관한 정치·경제 및 기타 사항에 대하여 맥아더 장군에게 내릴 지령을 우선 사항으로 작성하도록 지시받았다(SWNCC 176/2/D[주51]).\n\n국무·육군·해군 3부조정위원회를 대표하여,\n\n찰스 W. 매카시(Charles W. McCarthy)\n간사", "secondary": "Records of the State-War-Navy Coordinating Committee, Lot 52–M45\n\nMemorandum by the State-War-Navy Coordinating Committee to Brigadier General Andrew J. McFarland, Secretary of the Joint Chiefs of Staff\n\n[SWNCC 176 Series]\n\n[Washington,] 24 August, 1945.\n\nSubject: International Agreements as to Occupation of Korea.\n\n1. With reference to your SM-3005, 23 [22] August 1945,[주50] subject as above, the State-War-Navy Coordinating Committee proposes that the Commander in Chief, Army Forces, Pacific, be advised substantially as follows:\n\nIn the absence of declared intentions by the United Kingdom, China or other United Nation initial occupation of Korea will be by U.S. and Soviet forces only under the provisions of paragraphs b and e, Section I, General Order No. 1. An oral understanding with respect to a future temporary multi-partite trusteeship over Korea was reached at Yalta. This understanding does not affect initial occupation and does not necessarily lead to eventual multi-partite occupation. The matter of international arrangements with regard to Korea is under urgent consideration by the State Department.\n\n2. The State-War-Navy Coordinating Subcommittee for the Far East has been directed to prepare a directive to General MacArthur on political, economic and other matters pertaining to Korea, as a matter of priority (SWNCC 176/2/D[주51]).\n\nFor the State-War-Navy Coordinating Committee:\n\nCharles W. McCarthy\n\nSecretary", "notes": ["[주50] 미수록. 다만 1037면의 각서 초안을 참조.", "[주51] 미수록."], "warn": false, "pages": [1039], "search": "Andrew J. McFarland 앤드루 J. 맥팔런드 (준장, 합동참모본부 간사) Charles W. McCarthy 찰스 W. 매카시 (SWNCC 간사) Douglas MacArthur 더글러스 맥아더 (육군 원수)"}, {"id": "d773", "order": 773, "date": "1945-08-24", "group": "A", "eyebrow": "d773 · Memorandum by the Director of the Office of Far Eastern Affairs (Ballantine) to the Assistant Secretary of State (Dunn)", "title": "극동국장(밸런타인)이 국무차관보(던)에게 보내는 각서", "badge": "", "list_right": "문서 773", "meta": [{"k": "일자", "v": "1945-08-24"}, {"k": "발신", "v": "극동국장 밸런타인(Joseph W. Ballantine)", "txt": true}, {"k": "수신", "v": "국무차관보 던(James C. Dunn)", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "740.00119 P. W./8–2445", "txt": true}], "links": [{"k": "FRUS", "text": "문서 773 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d773"}], "summary": "조선 점령군에 국무부 연락요원을 배치해 달라는 태평양미육군총사령관의 요청에 대해, 배치는 바람직하나 일본 본토용 인원 문제가 결정될 때까지 구체적 권고는 유보한다는 의견.", "points": ["태평양미육군총사령관이 육군부에 보낸 전문을 열람했다. 국제적 측면을 고려할 때 조선 점령군에 국무부 연락요원을 배치하는 것이 긴요하다는 내용이다", "국무부의 의향을 조속히 알려 달라는 요청이 있었음", "밸런타인은 그러한 인원 배치가 바람직하다는 견해에 동의", "다만 일본 본토용 동종 인원 문제가 결정될 때까지 구체적 권고는 주저함", "추기: 육군부 연락장교 비트럽 대령이 전화로 이 문제의 조속한 결정을 촉구함"], "primary": "본인은 태평양미육군총사령관이 육군부에 보낸 육군부 전문을 열람했다. 그 전문은 국제적 측면을 고려할 때 국무부로부터 조선 점령군에 연락요원이 배치되는 것이 긴요하다고 판단된다고 밝히고, 국무부의 의향에 관한 정보를 조속히 알려 줄 것을 요청하고 있다.\n\n[1041면]\n\n본인은 그러한 인원의 배치가 바람직하다는 견해에 동의하나, 일본 본토를 위한 동종 인원 문제에 대한 결정이 날 때까지는 구체적인 권고를 하기를 주저한다.\n\n추기: 육군부 연락장교 비트럽(Vittrup) 대령이 방금 전화하여 이 문제에 대한 결정을 가능한 한 빨리 내릴 것을 촉구했다.[주52]\n\nJ[oseph] W. B[allantine]", "secondary": "740.00119 P. W./8–2445\n\nMemorandum by the Director of the Office of Far Eastern Affairs (Ballantine) to the Assistant Secretary of State (Dunn)\n\n[Washington,] August 24, 1945.\n\nI have been shown a War Department message from the Commander-in-Chief, Army Forces, Pacific, to the War Department stating that it is considered essential that, in view of international aspects, there be assigned from the State Department liaison personnel to the occupation forces in Korea; and early information as to the desires of the State Department is requested.\n\n[1041면]\n\nI concur in the view that assignment of such personnel is desirable but hesitate to make any specific recommendations pending decision on the question of similar personnel for Japan Proper.\n\nLater: Colonel Vittrup, War Department Liaison Officer, has just telephoned urging that decision on this matter be made as soon as possible.[주52]\n\nJ[oseph] W. B[allantine]", "notes": ["[주52] 같은 날 여백의 기재에서 던 씨는 H. M. 베닝호프(H. M. Benninghoff)를 추천했다. 그는 8월 25일 재조선 미국 점령군 사령관의 연락장교 겸 미국 정치고문으로 임명되었다."], "warn": false, "pages": [1039, 1040, 1041], "search": "Joseph W. Ballantine 조지프 W. 밸런타인 (극동국장) James C. Dunn 제임스 C. 던 (국무차관보) Vittrup 비트럽 (대령, 육군부 연락장교) H. M. Benninghoff H. M. 베닝호프 (미국 정치고문)"}, {"id": "d774", "order": 774, "date": "1945-08-26", "group": "B", "eyebrow": "d774 · The Consul General at Manila (Steintorf) to the Secretary of State", "title": "주마닐라 총영사(스타인토프)가 국무장관에게", "badge": "", "list_right": "문서 774", "meta": [{"k": "일자", "v": "1945-08-26"}, {"k": "발신", "v": "주마닐라 총영사 스타인토프(Steintorf)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "장소", "v": "마닐라(Manila)"}, {"k": "전문번호", "v": "571"}, {"k": "종류", "v": "전보"}, {"k": "원문출처", "v": "740.00119 PW/8–2645: Telegram", "txt": true}], "links": [{"k": "FRUS", "text": "문서 774 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d774"}], "summary": "하지 중장과 해리스 준장이 조선에 관한 JCS 지령을 아직 받지 못했으며 일본용 지령을 준용해 총독과 일본인 관리를 통해 통치할 계획이었다는 사실을 보고한 전보.", "points": ["존슨이 하지 중장(제24군단장)과 군단 군정관 해리스 준장의 요청으로 비공식 회담", "조선에 관한 JCS 지령이나 다른 어떤 지령도 아직 현지에 도달하지 않았음", "당초 계획은 일본용 지령을 조선에 준용하는 것이다. 미국인 군정장관의 지휘 아래 총독과 그의 일본인 참모진을 국가 행정에 활용한다는 것이다", "존슨은 전적으로 자신의 책임하에 이 정책의 바람직하지 않은 측면을 지적", "총사령부가 러시아 점령지구와 미국 점령지구 간의 관계 문제를 포함한 JCS 지령을 즉시 보내 줄 것을 육군부에 타전한 것으로 알려짐", "현지의 현행 계획으로는 미군의 조선 상륙은 9월 15일 이전에는 이루어지지 않음"], "primary": "571. 존슨[주53]은 그들의 요청에 따라 어제 미군에 할당된 조선 지역의 점령을 수행하게 될 제24군단의 사령관 존 하지(John Hodge) 중장 및 동 군단의 군정관 찰스 해리스(Charles Harris) 준장과 비공식으로 회담했다. 국무부가 부내 참고용으로만 알아 두어야 할 것으로 생각되는 바는 다음과 같다. 조선에 관한 JCS(합동참모본부)의 지령이나 그 밖의 지령이 아직 이곳에 도달하지 않았으며, 당초의 계획은 일본용 지령[주54]을 필요한 변경을 가하여(mutatis mutandis) 조선에 적용하는 것, 즉 미국인 군정장관의 지휘 아래 총독과 그의 일본인 참모진을 나라의 행정에 활용하는 것이었던 듯하다. 존슨은 전적으로 자신의 책임으로 이 정책의 바람직하지 않은 측면들을 지적했다. GHQ(총사령부)는 이제 러시아 점령지구와 미국 점령지구 간의 관계 문제를 포함한 JCS 지령을 즉시 보내 줄 것을 요청하는 전문을 육군부에 보낸 것으로 알려져 있다. 이곳의 현행 계획으로는 미군의 조선 상륙은 9월 15일 이전에는 예정되어 있지 않다.[주55]\n\n스타인토프(Steintorf)", "secondary": "740.00119 PW/8–2645: Telegram\n\nThe Consul General at Manila (Steintorf) to the Secretary of State\n\nManila, August 26, 1945—10 a.m. \n [Received August 27—9:28 a.m.]\n\n571. At their request Johnson[주53] yesterday informally conferred with Lieutenant General John Hodge, Commander of the 24th Corps which will carry out the occupation of the portion of Korea assigned to the American forces, and Brigadier General Charles Harris, Military Government Officer of that Corps. It is thought that the Dept should know for its own information only that no JCS (Joint Chiefs of Staff) or other directive with regard to Korea has yet been received here and that it was apparently the plan initially to apply the Japanese directive[주54] mutatis mutandis to Korea, that is to utilize the Governor General and his Japanese staff for the administration of the country under the direction of the American Military Governor. Entirely on his own responsibility Johnson pointed out the undesirable aspects of this policy. It is understood that GHQ (General Headquarters) has now telegraphed War Dept requesting that JCS directive including the question of relations between the Russian and American occupied sections of the country be sent immediately. Present plans here do not call for American landings in Korea until September 15th.[주55]\n\nSteintorf", "notes": ["[주53] U. 알렉시스 존슨(U. Alexis Johnson), 주마닐라 영사. 요코하마 주재 대일 정치고문실 참모로 파견되었다.", "[주54] 연합국최고사령관(맥아더)에 대한 트루먼 대통령의 지령. 앞의 647면.", "[주55] 하지 중장 휘하의 제24군단은 9월 5일 오키나와를 출발하여 9월 8일 제물포 앞바다에 도착했다. 군단 사령부는 9월 9일 경성(Seoul)으로 이동했다."], "warn": false, "pages": [1041], "search": "Steintorf 스타인토프 (주마닐라 총영사) U. Alexis Johnson U. 알렉시스 존슨 (주마닐라 영사) John Hodge 존 하지 (중장, 제24군단장) Charles Harris 찰스 해리스 (준장, 제24군단 군정관) Harry S. Truman 해리 S. 트루먼 (미국 대통령)"}, {"id": "d775", "order": 775, "date": "1945-08-31", "group": "B", "eyebrow": "d775 · The Ambassador in China (Hurley) to the Secretary of State", "title": "주중 대사(헐리)가 국무장관에게", "badge": "", "list_right": "문서 775", "meta": [{"k": "일자", "v": "1945-08-31"}, {"k": "발신", "v": "주중 미국대사 헐리(Patrick J. Hurley)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "장소", "v": "중경(Chungking)"}, {"k": "전문번호", "v": "1485"}, {"k": "종류", "v": "전보"}, {"k": "원문출처", "v": "895.01/8–3145: Telegram", "txt": true}], "links": [{"k": "FRUS", "text": "문서 775 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d775"}], "summary": "대한민국임시정부 대표가 중경 미국대사관에 두고 간 각서의 요지다. 조선 공산주의자들의 세력 확대를 경고하며 임시정부 주요 인사의 조선 입국 허용과 선교사 파견을 미국에 요청한다.", "points": ["임시정부 대표가 8월 30일 대사관을 방문하여 각서를 남기고 국무부 전달을 요청(대사관 전보 1356호, 8월 14일 참조)", "1. 임시정부 전복에 실패한 조선 공산주의자들과 중경의 그 동조자들은 당에 대한 충성을 보이고 조선 내외의 행동을 조율하기 위해 정부에서 이탈했다", "2. 러시아에서 온 조선인들과 연안(延安)의 조선인 공산주의자들이 대거 조선으로 들어가고 있다. 연안 조선인 대학의 학장 Kom Bakyun은 만주를 거쳐 조선으로 떠나기 전 공산주의 이상에 따른 정부를 조선에 세우는 것이 목표라고 방송했다", "3. 영미식 입헌주의를 신봉하며 지난 40년간 조선의 자유를 위해 싸워 온 조선 민주주의자들은 희망을 잃어가고 있고 조선에서의 기회도 줄어들고 있다", "4. 조선인 혁명 지도자들은 미군 점령군을 돕고 협력하며 치안 유지를 위해 친미 여론을 동원하기를 희망한다. 임시정부 요인들이 점령군의 보조자·통역 등으로 조선에 입국할 수 있게 해 달라고 요청", "조선이 민주주의 국가가 되느냐 공산주의 국가가 되느냐는 지금 미국이 무엇을 하느냐에 달렸으며, 결정하지 않는 것이 공산주의자들에게 유리하게 작용할 것이라고 주장", "5. 미국 선교사업의 중심지이자 그 활동이 소멸될 위험에 처한 북조선에 미국인 선교사를 즉시 파견해 줄 것을 희망(임시정부 인사 다수가 기독교인)", "7. 임시정부는 모든 조선인 단체를 동등하게 대한다는 국무부의 방침을 잘 알고 있으나, 조선 공산주의자들이 외부 지원을 받아 지금 하고 있는 일에 유의해 달라고 촉구"], "primary": "1485. 「대한민국임시정부」 대표가 어제 대사관을 방문하여(대사관 전보 1356호, 8월 14일) 각서를 두고 갔으며, 그 요지를 국무부에 전달해 줄 것을 요청했다.\n\n(각서 요지 시작)\n\n1. 대한민국임시정부를 전복하는 데 실패한 조선인 공산주의자들과 중경에 있는 그들의 동조자들은 당에 대한 충성을 과시하고 조선 내외에서의 행동을 조율하기 위하여 정부에서 이탈했다.\n\n2. 러시아로부터 온 조선인들과 연안(Yenan)의 조선인 공산주의자들이 대거 조선으로 들어가고 있다. 연안 조선인 대학 학장 Kom Bakyun은 만주를 거쳐 조선으로 가기 위해 연안을 떠나기 전, 공산주의 이상에 따른 정부를 조선에 수립하는 것이 그들의 목표라고 방송했다.\n\n3. 이상의 사정에 비추어, 영미식 입헌주의를 신봉하며 지난 40년간 조선의 자유를 위하여 싸워 온 조선인 민주주의자들은 희망을 잃어가고 있고 조선에서의 그들의 기회도 줄어들고 있다.\n\n4. 조선인 혁명 지도자들은 조선에 오는 미국 점령군을 돕고 그들과 협력하기를 희망하며, 법과 질서를 유지하기 위하여 미국에 우호적인 여론을 동원하기를 원한다. 이들은 공산주의 지도자들보다 조선인들에게 더 존경받고 더 널리 알려져 있다. 이들은 미국이 대한민국임시정부의 주요 인사들이 점령군의 보조자 또는 통역으로서, 또는 미국에 적합한 그 밖의 어떤 방식으로든 조선에 입국하도록 허용해 주기를 희망한다. 이들은 조선이 민주주의 국가로 발전하느냐 공산주의 국가로 발전하느냐 하는 문제가 지금 미국이 무엇을 하느냐에 달려 있다고 믿는다. 결정을 내리지 않는 것은 공산주의자들에게 유리하게 작용할 것이다.\n\n5. 조선인 지도자들은 미국이 미국 선교사업의 중심지이자 그러한 활동이 소멸될 위험에 처해 있는 지역인 북조선에 미국인 선교사들을 즉시 보내 주기를 희망한다. 임시정부 인사 다수가 기독교인이다.\n\n6. 미국이 조선인 지도자들을 지원하여 그들을 조선에 보내 줄 수 있다면, 그들은 미국 점령군이나 국무부의 뜻에 반하는 일은 아무것도 하지 않을 것이다.\n\n7. 대한민국임시정부는 모든 조선인 단체를 동등하게 대우한다는 국무부의 방침을 잘 알고 있으나, 조선인 공산주의자들이 외부의 지원을 받아 지금 하고 있는 일에 유의해 줄 것을 촉구한다.\n\n(요지 끝)\n\n헐리(Hurley)", "secondary": "895.01/8–3145: Telegram\n\nThe Ambassador in China (Hurley) to the Secretary of State\n\nChungking, August 31, 1945—1 p.m. \n [Received 2:59 p.m.]\n\n1485. Representative of “Korean Provisional Government” called at Embassy yesterday (Embassy’s 1356, August 14) and left memorandum, substance of which he requested be communicated to Department.\n\n(Begin summary of memorandum) 1. Having failed to overthrow Korean Provisional Government, Korean Communists and their allies in Chungking withdrew from Government to demonstrate their party loyalty and to coordinate actions inside and outside Korea.\n\n2. Koreans from Russia and Korean Communists from Yenan are entering Korea in large numbers. Before leaving Yenan for Manchuria on way to Korea, Kom Bakyun, President of Korean College in Yenan, broadcast that they aimed to set up government in Korea according to Communist ideals.\n\n3. In view of foregoing, Korean Democrats, who believe in Anglo-American constitutionalism and who have been fighting for Korean freedom for past 40 years, are losing hope and their chances in Korea are decreasing.\n\n4. Korean revolutionary leaders hope to assist and cooperate with American occupation forces in Korea and wish to mobilize public opinion in favor of Americans in order to keep law and order. These men are more respected by and better known to Koreans than Communist leaders. They hope United States will permit leading members of Korean Provisional Government to enter Korea as assistants to or interpreters for occupation forces or in any other manner suitable to United States. They believe that question of whether Korea develops into a democratic or communistic state depends on what United States does now. Failure to make decision will work in favor of Communists.\n\n5. Korean leaders hope United States will send American missionaries at once to northern Korea which is center of American missionary work and also is area where such activity is in danger of being eliminated. Many Provisional Government members are Christians.\n\n6. If United States could assist Korean leaders and send them to Korea, they would do nothing contrary to wishes of United States occupation forces or State Department.\n\n7. Korean Provisional Government is well aware of State Department’s policy of treating all Korean groups alike, but invites attention to what Korean Communists are now doing with outside assistance. (Summary ends here.)\n\nHurley", "notes": [], "warn": true, "pages": [1041], "search": "Patrick J. Hurley 패트릭 J. 헐리 (주중 미국대사) Kom Bakyun (연안 조선인 대학 학장, 원문 표기 그대로)"}, {"id": "d776", "order": 776, "date": "1945-09-07", "group": "E", "eyebrow": "d776 · Proclamation No. 1 by General of the Army Douglas MacArthur", "title": "육군 원수 더글러스 맥아더의 포고 제1호", "badge": "", "list_right": "문서 776", "meta": [{"k": "일자", "v": "1945-09-07"}, {"k": "발신", "v": "육군 원수 더글러스 맥아더, 태평양미육군총사령관", "txt": true}, {"k": "수신", "v": "조선 인민", "txt": true}, {"k": "장소", "v": "요코하마(Yokohama)"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "포고문"}, {"k": "원문출처", "v": "740.00119 Control (Korea)/9–745", "txt": true}], "links": [{"k": "FRUS", "text": "문서 776 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d776"}], "summary": "북위 38도 이남 조선에 대한 미군의 군사적 지배를 선언하고 점령의 목적과 6개 조의 점령 조건을 규정한 포고문.", "points": ["항복문서 조항에 따라 총사령관 예하 군대가 이 날 북위 38도 이남 조선 영토를 점령한다", "점령의 목적은 항복문서를 시행하고 조선인의 개인적·종교적 권리를 보호하는 것이며, 조선인의 적극적 협조와 순응을 요구한다", "조선 인민의 오랜 노예 상태와 \"적당한 시기에\" 조선이 자유롭고 독립될 것이라는 결정을 유념한다고 명시", "제1조: 북위 38도 이남 조선 영토와 인민에 대한 모든 통치 권한은 당분간 총사령관의 권한하에 행사된다", "제2조: 별도 명령이 있을 때까지 모든 관공리·공익사업 종사자 등은 종래의 직무를 계속 수행하고 기록과 재산을 보전한다", "제3조: 모든 주민은 총사령관 및 그 권한하에 발해진 명령에 즉시 복종해야 하며 점령군에 대한 저항 행위나 공안을 해치는 행위는 엄중 처벌된다", "제4조: 재산권은 존중되며 별도 명령이 없는 한 종래의 직업에 종사한다", "제5조: 군정 기간 중 모든 목적에서 영어를 공용어로 하며, 영문과 한국어·일본어 본문 사이에 해석의 모호함이나 차이가 있을 때는 영문본이 우선한다", "제6조: 추가 포고·법령·규칙·고시·지령 등이 발해질 것이다"], "primary": "조선 인민에게 고함:\n\n태평양미육군총사령관(Commander-in-chief, United States Army Forces, Pacific)으로서 본관은 이에 다음과 같이 포고한다.\n\n일본국 천황과 일본국 정부의 명에 의하여 그리고 그들을 대표하여, 또한 일본 제국대본영의 명에 의하여 그리고 이를 대표하여 서명된 항복문서[주56]의 조항에 따라, 본관 휘하의 승리한 군대는 오늘 북위 38도 이남의 조선 영토를 점령한다.\n\n조선 인민의 오랜 노예 상태와 적당한 시기에 조선이 자유롭고 독립하게 되리라는 결정을 유념하여, 조선 인민에게 이 점령의 목적이 항복문서를 시행하고 그들의 개인적 및 종교적 권리를 보호하는 데 있음을 보장한다. 이러한 목적을 실현함에 있어 제군의 적극적인 조력과 순응이 요구된다.\n\n태평양미육군총사령관으로서 본관에게 부여된 권한에 의하여, 본관은 이에 북위 38도 이남의 조선과 그 주민에 대하여 군사적 지배(military control)를 확립하고, 점령에 관한 다음의 조건을 발표한다.\n\n**제1조**\n\n북위 38도 이남 조선의 영토와 그 인민에 대한 모든 통치의 권한은 당분간 본관의 권한하에 행사된다.\n\n**제2조**\n\n추후의 명령이 있을 때까지, 모든 정부의·공공의 및 명예직의 관리와 직원, 그리고 공중위생 및 공중보건을 포함한 모든 공익사업 및 역무의 유급·무급을 불문한 모든 관리와 직원, 그리고 기타 필수적 역무에 종사하는 모든 자는 그 통상의 기능과 직무를 계속 수행하고 모든 기록과 재산을 보전·보호해야 한다.\n\n**제3조**\n\n모든 사람은 본관의 모든 명령 및 본관의 권한하에 발해진 명령에 신속히 복종해야 한다. 점령군에 대한 저항 행위 또는 공공의 평온과 안전을 어지럽힐 수 있는 일체의 행위는 엄중히 처벌된다.\n\n[1044면]\n\n**제4조**\n\n제군의 재산권은 존중된다. 본관이 달리 명령하는 경우를 제외하고 제군은 통상의 직업에 종사할 것이다.\n\n**제5조**\n\n군사적 지배 기간 중 모든 목적에서 영어를 공용어로 한다. 영문과 한국어 또는 일본어 본문 사이에 해석 또는 정의의 모호함이나 상이함이 있을 경우에는 영문본이 우선한다.\n\n**제6조**\n\n추가의 포고, 법령, 규칙, 고시, 지령 및 제정 조치가 본관에 의하여 또는 본관의 권한하에 발해질 것이며, 제군에게 요구되는 바를 명시할 것이다.[주57]\n\n1945년 9월 7일 요코하마에서 본관이 서명함\n\n더글러스 맥아더(Douglas MacArthur)\n태평양미육군총사령관", "secondary": "740.00119 Control (Korea)/9–745\n\nProclamation No. 1 by General of the Army Douglas MacArthur\n\nYokohama, September 7, 1945\n\nTo the People of Korea:\n\nAs Commander-in-chief, United States Army Forces, Pacific, I do hereby proclaim as follows:\n\nBy the terms of the Instrument of Surrender,[주56] signed by command and in behalf of the Emperor of Japan and the Japanese Government and by command and in behalf of the Japanese Imperial General Headquarters, the victorious military forces of my command will today occupy the territory of Korea south of 38 degrees north latitude.\n\nHaving in mind the long enslavement of the people of Korea and the determination that in due course Korea shall become free and independent, the Korean people are assured that the purpose of the occupation is to enforce the Instrument of Surrender and to protect them in their personal and religious rights. In giving effect to these purposes, your active aid and compliance are required.\n\nBy virtue of the authority vested in me as Commander-in-Chief, United States Army Forces, Pacific, I hereby establish military control over Korea south of 38 degrees north latitude and the inhabitants thereof, and announce the following conditions of the occupation:\n\nArticle I\n\nAll powers of Government over the territory of Korea south of 38 degrees north latitude and the people thereof will be for the present exercised under my authority.\n\nArticle II\n\nUntil further orders, all governmental, public and honorary functionaries and employees, as well as all officials and employees, paid or voluntary, of all public utilities and services, including public welfare and public health, and all other persons engaged in essential services, shall continue to perform their usual functions and duties, and shall preserve and safeguard all records and property.\n\nArticle III\n\nAll persons will obey promptly all my orders and orders issued under my authority. Acts of resistance to the occupying forces or any acts which may disturb public peace and safety will be punished severely.\n\n[1044면]\n\nArticle IV\n\nYour property rights will be respected. You will pursue your normal occupations, except as I shall otherwise order.\n\nArticle V\n\nFor all purposes during the military control, English will be the official language. In event of any ambiguity or diversity of interpretation or definition between any English and Korean or Japanese text, the English text shall prevail.\n\nArticle VI\n\nFurther proclamations, ordinances, regulations, notices, directives and enactments will be issued by me or under my authority, and will specify what is required of you.[주57]\n\nGiven under my hand at Yokohama\n\nthis seventh day of September 1945\n\nDouglas MacArthur\n\nCommander-in-Chief, United States\nArmy Forces, Pacific", "notes": ["[주56] 9월 2일 서명. 본문은 Department of State Executive Agreement Series No. 493, 59 Stat. (pt. 2) 1733 또는 Department of State Bulletin 1945년 9월 9일자 364~365면 참조(후자에는 항복문서 사진판이 실려 있다). 일본의 항복에 관한 문서는 앞의 621면 이하 참조.", "[주57] 맥아더 장군은 9월 7일에 포고 두 건을 추가로 발했다. 제2호는 범죄와 위법행위를, 제3호는 통화를 다루었다(740.00119–Control (Korea)/9–745). 연합국최고사령관은 10월 2일 일본 정부 앞 전보 제88호에서 일본 정부에 조선에서 어떠한 행정권도 행사하려 하지 말 것을 지시하고, 군정부가 조선에서의 유일한 권력임을 밝혔다. SCAPIN 88의 본문은 Report of Government Section, Supreme Commander for the Allied Powers: Political Reorientation of Japan, 부록 B, 473면 참조."], "warn": false, "pages": [1041, 1042, 1043, 1044], "search": "Douglas MacArthur 더글러스 맥아더 (육군 원수, 태평양미육군총사령관)"}, {"id": "d777", "order": 777, "date": "1945-09-10", "group": "A", "eyebrow": "d777 · Memorandum by the Acting Chairman of the State-War-Navy Coordinating Committee", "title": "국무·육군·해군 3부조정위원회 위원장 대리의 각서", "badge": "", "list_right": "문서 777", "meta": [{"k": "일자", "v": "1945-09-10"}, {"k": "발신", "v": "국무·육군·해군 3부조정위원회(SWNCC) 위원장 대리", "txt": true}, {"k": "수신", "v": "국무·육군·해군 3부조정위원회(SWNCC) / 합동참모본부(JCS)", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": "SWNCC 176/4"}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "Records of the State-War-Navy Coordinating Committee, Lot 52–M45", "txt": true}], "links": [{"k": "FRUS", "text": "문서 777 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d777"}], "summary": "주한 미군 사령관이 일본인 총독과 관리들을 잠정 유임하기로 했다는 보도가 미국의 입장을 해쳤다고 지적하고, 아베 총독 이하 일본인 고위 관리의 즉시 파면을 지시하는 맥아더 앞 전문 초안을 승인할 것을 권고한 각서.", "points": ["「태평양미육군총사령관에 대한 민사행정 기본 초기지령 — 북위 38도 이남 조선」이 군사적 관점의 의견을 구하기 위해 JCS에 회부되어 있음", "주한 미군 사령관이 일본인 총독과 그 밖의 일본인 관리들을 잠정 유임하기로 했다는 최근 보도가 이미 조선에서의 미국의 입장에 불행한 영향을 끼쳤으며, 위 지령의 전반적 취지·정책에 반한다", "제안된 지령에 부합하고 미국의 이익을 증진할 정책을 최대한 신속히 채택하기 위해, SWNCC가 부록의 맥아더 앞 전문 초안을 승인하고 이를 긴급 사항으로 JCS에 회부해 군사적 견해를 구할 것을 권고", "SWNCC와 JCS의 승인 후 이 초안 전문을 JCS가 발송할 것을 아울러 권고", "[부록 전문 초안] 일본인 총독과 관리 유임 보도로 불리한 여론이 발생했음", "아래 열거된 일본인 관리들의 역무는 기술적 자격상 긴요하지 않다고 봄(제안된 지령 요약 Warx 61967 제2항 참조)", "정치적 이유에서 아베 총독, 총독부 각 국장, 도지사, 도 경찰부장을 즉시 파면할 것이 바람직함", "그 밖의 일본인 및 부일협력 조선인 행정관들의 파면도 가능한 한 신속히 진행할 것"], "primary": "「태평양미육군총사령관에 대한 민사행정 기본 초기지령 — 북위 38도 이남 조선」(The Basic Initial Directive to the Commander in Chief, U.S. Army Forces in the Pacific for the Administration of Civil Affairs—Korea South of 38 Degrees North Latitude)은 현재 군사적 관점에서의 의견을 구하기 위하여 합동참모본부(JCS)에 회부되어 있다. 주한 미군 사령관이 일본인 총독과 그 밖의 일본인 관리들을 조선에서 잠정적으로 유임시키기로 결정했다는 최근의 보도는 이미 조선에서의 우리의 입장에 불행한 영향을 끼쳤으며, 위에 언급한 지령에 제시된 전반적 취지 및 정책에 배치된다.\n\n제안된 지령에 부합하고 미국의 이익을 [1045면] 증진할 정책을 가능한 한 신속히 채택하기 위하여, SWNCC가 부록에 첨부된 태평양미육군총사령관 앞 전문 초안을 승인하고, 이를 군사적 관점에서의 의견을 구하기 위하여 긴급 사항으로 JCS에 전달할 것을 권고한다.\n\n아울러 SWNCC와 JCS의 승인이 있은 후 부록의 전문 초안을 JCS가 발송할 것을 권고한다.\n\n[부록]\n\n**육군 원수 더글러스 맥아더 앞 전문 초안[주58]**\n\n주한 미군 사령관이 조선에서 일본인 총독과 그 밖의 일본인 관리들을 잠정적으로 유임시키기로 결정했다는 최근의 보도로 인하여 불리한 여론이 일어났다.\n\n~~다음에 열거하는 일본인 관리들의 역무가 기술적 자격상 긴요하다고는 생각되지 않는다.~~ **보도가 사실이라면 SWNCC는** 다음에 열거하는 일본인 관리들의 역무가 기술적 자격상 긴요하다고 **보지 않는다**. (제안된 지령의 요약 Warx 61967[주59] 제2항 참조.) ~~또한~~ **정치적 이유에서** 귀관이 아베(Abe) 총독, 총독부 각 국(局)의 국장, 도지사 및 도 경찰부장을 즉시 파면하는 것이 바람직하다. 귀관은 나아가 그 밖의 일본인 및 부일협력 조선인 행정관들의 파면을 가능한 한 신속히 진행해야 한다.", "secondary": "Records of the State-War-Navy Coordinating Committee, Lot 52–M45\n\nMemorandum by the Acting Chairman of the State-War-Navy Coordinating Committee\n\nSWNNC 176/4\n\n[Washington,] September 10, 1945.\n\n“The Basic Initial Directive to the Commander in Chief, U.S. Army Forces in the Pacific for the Administration of Civil Affairs—Korea South of 38 Degrees North Latitude” is now before the JCS for their comments from a military point of view. The recent report that the U.S. Commander in Korea has decided temporarily to retain the Japanese Governor-General and other Japanese officials in Korea has already had an unfortunate effect on our position in Korea and is contrary to the general intent and policies outlined in the directive mentioned above.\n\nTo expedite the adoption as quickly as possible of policies which will be consistent with the proposed directive and which will further [1045면] the interests of the United States, it is recommended that the SWNCC approve the attached draft message to the Commander in Chief, U.S. Army Forces in the Pacific, at Appendix, and transmit it to the JCS as a matter of urgency for their comment from a military point of view.\n\nIt is further recommended that after approval by SWNCC and the JCS the draft message at Appendix be forwarded by the JCS.\n\n[Appendix]\n\nDraft Message to General of the Army Douglas Mac Arthur[주58]\n\nUnfavorable publicity has resulted from recent reports that the U.S. commander in Korea has decided temporarily to retain in office the Japanese Governor General and other Japanese officials in Korea.\n\nIt is not believed If the report is correct the S.W.N.[C.C.] do not believe that the services of the Japanese officials named below are essential by reason of technical qualifications. (Refer to para. 2 of summary of proposed directive Warx 61967[주59]). Furthermore For political reasons it is advisable that you should remove them from office immediately Governor-General Abe, Chiefs of all bureaus of the Government-General, provincial governors and provincial police chiefs. You should furthermore proceed as rapidly as possible with the removal of other Japanese and collaborationist Korean administrators.", "notes": ["[주58] 국무·육군·해군 3부조정위원회가 9월 11일 승인했다. 이 초안은 9월 14일 합동참모본부에 의하여 수정되었는데, 취소선이 그어진 부분은 삭제되고 밑줄이 그어진 부분이 추가되었다. 3부조정위원회는 같은 날 이 수정에 동의했다.", "[주59] 국무부 문서철에서 사본을 찾지 못했다."], "warn": true, "pages": [1044, 1045], "search": "Douglas MacArthur 더글러스 맥아더 (육군 원수) Abe 아베 (조선총독)"}, {"id": "d778", "order": 778, "date": "1945-09-12", "group": "B", "eyebrow": "d778 · The Ambassador in China (Hurley) to the Secretary of State", "title": "주중대사(헐리)가 국무장관에게", "badge": "", "list_right": "문서 778", "meta": [{"k": "일자", "v": "1945-09-12"}, {"k": "발신", "v": "주중대사 헐리(Hurley)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "장소", "v": "Chungking(중경)"}, {"k": "전문번호", "v": "1573"}, {"k": "종류", "v": "전보"}, {"k": "원문출처", "v": "895.01/9–1245: Telegram", "txt": true}], "links": [{"k": "FRUS", "text": "문서 778 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d778"}], "summary": "중경의 대한민국임시정부 대표가 임정 지도자 약 10명을 미군 항공편으로 한국에 이송해 달라고 대사관에 요청했고, 아울러 경성에서 새 조선 정부 기구가 발족했다는 중국 언론 보도를 함께 보고한 전보.", "points": ["중양일보(Chung Yang Jih Pao) 9월 11일자 경성 9월 9일발 기사에 따르면 \"조선 정부의 새 공화위원회\"가 9월 6일 정식 발족했고, 한국 각지에서 온 1,000명 이상의 대표가 87명의 위원을 선출했으며 그중에 대한민국임시정부 주석 김구가 포함되었다고 함", "9월 11일 대한민국임시정부 대표가 대사관을 방문해, 다른 한국인 지도자들과의 회담을 위해 임정 지도자 약 10명을 중경에서 한국으로 미군이 공수해 주기를 희망한다고 표명", "그 대표는 한국인 단체에 관한 미국 정부의 방침을 알고 있으나, 임정이 새 한국 정부 수립에 참여하기 위해 한국으로 갈 기회를 갖는 것이 공정하다고 생각한다고 말함", "중국 당국에 수송을 요청했으나 중국 측은 항공 수송이 미국 당국의 통제 아래 있다고 답했다고 함", "임정은 통상 국민당 중앙집행위원 진립부(陳立夫)·진과부(陳果夫), 그리고 중앙집행위 비서장 오철성(吳鐵城)과 교섭해 왔으며, 이들은 수년 전 총통(장개석)이 임정을 상대하도록 지정한 인물로 이해된다고 함", "대표는 소련군 점령 지역 한국 내 정치 활동에 대해 크게 우려하는 모습을 보였음", "항공 수송 요청은 국무부에 전달하겠다고 대표에게 통보함"], "primary": "1573. 9월 11일자 중양일보(Chung Yang Jih Pao)의 경성 9월 9일발 보도에 따르면, \"조선 정부의 새 공화위원회(new Republican Committee of the Korean Government)\"가 9월 6일 정식으로 발족했다. 한국 각지에서 온 1,000명 이상의 대표에 의해 87명의 위원이 선출되었다고 보도되었으며, 위원 중에는 대한민국임시정부(Korean Provisional Government) 주석 김구(Chin Chiu, Kim Koo)와 그 밖의 인물들이 포함되었다.\n\n대한민국임시정부의 한 대표가 9월 11일 대사관을 방문하여, 우리 육군이 다른 한국인 지도자들과의 회담을 위해 대한민국임시정부 지도자 일단(一團), 아마도 10명을 중경에서 한국으로 공수해 주기를 희망한다고 표명했다. 그는 [1046면] 한국인 단체들에 관한 미국 정부의 방침을 알고 있다고 말했으나, 대한민국임시정부가 한국으로 가서 새 한국 정부의 수립에 참여할 기회를 갖는 것이 공정할 뿐이라고 느낀다고 말했다. 그에게 수송에 관하여 중국 당국에 교섭한 바가 있는지 물었더니, 그는 그렇게 했으며 중국 측은 항공 수송이 미국 당국의 통제 아래 있다고 말했다고 답했다.\n\n어떤 중국 당국에 교섭했는지에 관한 질문에 대하여, 그는 자기 조직이 통상 진립부(Chen Li-fu), 진과부(Chen Kuo-fu)[주60] 및 오철성(Wu Teh-chen)[주61]과 상대해 왔으며, 이들은 자신이 이해하기로 수년 전에 총통(Generalissimo)에 의해 대한민국임시정부를 상대하도록 지정된 인물들이라고 말했다.[주62]\n\n대표에게는 한국행 항공 수송 요청이 국무부에 전달될 것이라고 통보했다.\n\n대표는 소련군이 점령한 한국 지역에서의 정치 활동에 대해 매우 우려하는 것으로 보였다.\n\n국무부에 발송; 모스크바에 사본 발송.\n\n헐리(Hurley)", "secondary": "895.01/9–1245: Telegram\n\nThe Ambassador in China (Hurley) to the Secretary of State\n\nChungking, September 12, 1945—8 a.m. \n [Received 11:25 p.m.]\n\n1573. According to press report in Chung Yang Jih Pao September 11 under Seoul dateline September 9, the “new Republican Committee of the Korean Government” was formally inaugurated September 6; 87 councilors were reported elected by more than 1,000 delegates from various places in Korea; councilors included Chin Chiu (Kim Koo), President of Korean Provisional Government, and others.\n\nA representative of Korean Provisional Government called at Embassy September 11 and expressed hope that our army would fly to Korea from Chungking a group of Korean Provisional Government leaders, possibly 10, for conferences with other Korean leaders. He [1046면] said he was aware of American Government’s policy regarding Korean groups, but he felt it would be only fair if Korean Provisional Government had opportunity to proceed to Korea to take part in formation of a new Korean Government. He was asked whether Chinese authorities had been approached for transportation; he said this had been done and Chinese stated air transport was controlled by American authorities. In reply to inquiry concerning what Chinese authorities had been approached, he said his organization usually dealt with Chen Li-fu, Chen Kuo-fu[주60] and Wu Teh-chen[주61] who he understood had been designated by Generalissimo several years ago to deal with Korean Provisional Government.[주62]\n\nRepresentative was informed his request for air transportation to Korea would be communicated to State Department.\n\nRepresentative appeared much concerned over political activities in that part of Korea occupied by Soviet forces.\n\nSent to Department; repeated Moscow.\n\nHurley", "notes": ["[주60] 국민당 중앙집행위원회 위원들.", "[주61] 국민당 중앙집행위원회 비서장.", "[주62] 9월 17일 오전 9시자 전보 1605호에서 헐리 대사는 중국 측이 대한민국임시정부의 조기 한국 \"귀환\"을 환영하리라는 점을 시사하는 중앙통신사 보도와 현지 언론 사설들을 인용했다(895.01/9–1745)."], "warn": false, "pages": [1045, 1046], "search": "Patrick J. Hurley 패트릭 J. 헐리 (주중 미국대사) Kim Koo (Chin Chiu) 김구 (대한민국임시정부 주석) Chen Li-fu 진립부 (국민당 중앙집행위원) Chen Kuo-fu 진과부 (국민당 중앙집행위원) Wu Teh-chen 오철성 (국민당 중앙집행위원회 비서장) Generalissimo (Chiang Kai-shek) 총통 (장개석) — 원문은 직함만 표기"}, {"id": "d779", "order": 779, "date": "1945-09-13", "group": "B", "eyebrow": "d779 · The Acting Secretary of State to the Ambassador in the United Kingdom (Winant)", "title": "국무장관 대리가 주영대사(위넌트)에게", "badge": "", "list_right": "문서 779", "meta": [{"k": "일자", "v": "1945-09-13"}, {"k": "발신", "v": "국무장관 대리 애치슨(Acheson)", "txt": true}, {"k": "수신", "v": "주영대사 위넌트(Winant) — 본문 수신자는 런던 체류 중인 국무장관(번스)", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": "7974 (Secdel 48)"}, {"k": "종류", "v": "전보"}, {"k": "원문출처", "v": "740.00119 Council/9–1345: Telegram", "txt": true}], "links": [{"k": "FRUS", "text": "문서 779 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d779"}], "summary": "영국 정부가 한국 신탁통치 계획을 통보받은 적이 없다는 사실이 드러났음을 런던의 국무장관에게 알리고, 대통령 명의로 준비 중인 대(對)한국 성명 초안의 요지를 보고한 전보.", "points": ["육군부가 한국 문제로 제기한 몇 가지 질문의 결과, 영국 정부가 한국 신탁통치 계획을 통보받지 못했다는 사실이 분명해짐", "이 문제는 얄타에서 언급되었고 이후 홉킨스가 모스크바에서 소련 측과 논의하여 영·미·중·소 4개국 신탁통치가 승인되었으며, 대통령은 송자문에게 이를 언급해 그가 찬성 의사를 표한 것으로 이해됨", "국무부 관리가 영국대사관 관리와의 비공식 논의에서, 이 문제에 관해 미국 정부와 다른 관계국 정부 간에 공식 교섭이 없었으며 영국이 이미 통보받은 줄로 알고 있었다고 설명함", "1945년 5월 28일 홉킨스 모스크바 방문 때의 양해는, 수립될 것으로 예상되는 군정기와 한국 정부가 완전한 독립 기능을 행사할 수 있게 되는 시점 사이의 '잠정기'에 적용되는 것으로 이해되며, 점령기에 반드시 적용되는 것은 아님", "대통령 검토용 성명 초안을 국무부에서 작성했다. 한국 해방을 알리고, 잠정 유임되는 일본인은 한국 국민과 점령군의 봉사자로 활용되는 것이라 밝히며, 4대국이 한국의 자유·독립에 합의했음을 확인하고, 한국인이 자유·독립국의 책임을 떠맡기까지 시간과 인내가 필요함을 시사한다", "이 성명은 정부 기구에서 일본인 관리를 제거하는 데 관한 육군부의 대(對)맥아더 훈령과 동시에 발표될 것으로 예상됨"], "primary": "7974. Secdel 48. 국무장관께.[주63] 육군부가 한국에 관하여 제기한 몇 가지 질문의 결과로, 영국 정부가 한국의 신탁통치 계획에 관하여 통보받은 바 없다는 것이 분명해졌다. 이 문제는 얄타에서 언급되었고, 그 후 홉킨스(Hopkins)씨[주64]가 모스크바에서 러시아측과 논의하였으며,[주65] 그때 영국·미국·중국·소련의 신탁통치가 승인되었다. 대통령은 이 문제를 송자문(Soong) 박사[주66]에게 언급하였고, 그는 찬성의 뜻을 표시한 것으로 이해된다. 어제 이 문제에 관하여 영국대사관의 한 관리와 가진 비공식 논의에서, 국무부의 한 관리는 이 문제에 관하여 미국 정부와 그 밖의 이해관계 정부들 사이에 공식적인 [1047면] 교섭이 없었으며, 우리는 영국측이 이미 통보받은 것으로 상정하고 있었다고 설명하였다.\n\n홉킨스씨가 모스크바를 방문했던 1945년 5월 28일에 도달된 양해는, 수립될 것으로 상정되는 군정기(軍政期)와 한국 정부가 독립의 완전한 기능을 행사할 수 있게 되는 시기 사이의 잠정기(interim period)에 적용되는 것으로 이해되며, 점령기에 반드시 적용되는 것은 아니다.\n\n대통령의 검토를 위하여 국무부에서 성명 하나가 기초되었다.[주67] 이 성명은 한국의 해방을 알리고; 정부에 잠정적으로 유임될 수 있는 일본인들은 한국 국민과 점령군의 봉사자로서 활용되고 있다고 밝히며;[주68] 한국이 자유롭고 독립하게 되어야 한다는 데 대한 4대국(Big Four)의 합의를 확인하고; 한국인이 자유롭고 독립한 국가의 책임을 떠맡기까지에는 시간과 인내가 필요하리라는 점을 시사한다.\n\n이 성명은 정부 기구로부터 일본인 인원을 제거하는 데 관한 육군부의 대(對)맥아더(MacArthur) 훈령과 동시에 발표될 것으로 상정된다.\n\n애치슨(Acheson)", "secondary": "740.00119 Council/9–1345: Telegram\n\nThe Acting Secretary of State to the Ambassador in the United Kingdom (Winant)\n\nWashington, September 13, 1945—5 p.m.\n\n7974. Secdel 48. For Secretary of State.[주63] As a result of certain questions raised by the War Department in regard to Korea, it has become apparent that the British Government has not been informed of the plans for a trusteeship in Korea. The matter was mentioned at Yalta and later was discussed with the Russians by Mr. Hopkins[주64] in Moscow,[주65] when a British-American-Chinese-Soviet trusteeship was approved. The President mentioned the matter to Dr. Soong,[주66] who, it is understood, indicated his approval. In an informal discussion of this matter yesterday with an official of the British Embassy, an officer of the Department explained that there have been no official exchanges [1047면] between this Government and other interested governments on the subject, and that we had assumed that the British had been informed.\n\nThe understanding reached on May 28, 1945, when Mr. Hopkins visited Moscow, is understood to apply to an interim period, between the period of military government which presumably will be set up and the time when a Korean Government can exercise the full functions of independence, and does not necessarily apply to the period of occupation.\n\nA statement has been drafted in the Department for the consideration of the President.[주67] This statement heralds the liberation of Korea; states that such Japanese as may be temporarily retained in the Government are being utilized as servants of the Korean people and of the occupying forces;[주68] confirms agreement on the part of the Big Four that Korea shall become free and independent; and indicates that time and patience will be required before the Koreans can assume the responsibilities of a free and independent nation.\n\nIt is contemplated that this statement will be issued coincidentally with instructions from the War Department to MacArthur relating to the removal of Japanese personnel from the governmental structure.\n\nAcheson", "notes": ["[주63] 번스(Byrnes)씨는 1945년 9월 11일부터 10월 2일까지 런던에서 열린 외무장관회의(Council of Foreign Ministers) 제1차 회기에 참석 중이었다. 이 회기에 관한 문서는 제2권 99면 이하 참조.", "[주64] 해리 L. 홉킨스(Harry L. Hopkins), 루스벨트 및 트루먼 대통령의 특별보좌관.", "[주65] 1945년 5월 28일 오후 6시자 대화비망록 참조. Foreign Relations, The Conference of Berlin (The Potsdam Conference), 1945, 제1권, 41면.", "[주66] 송자문(T. V. Soong). 그와 트루먼 대통령의 대화가 이루어진 1945년 6월 당시 중국 행정원장(총리) 겸 외교부장.", "[주67] 후술, 1048면.", "[주68] 런던발 9월 18일자 전보 9635호에서 국무장관은, 제안된 성명은 \"such Japanese\"로 시작하는 문구를 \"'일본인들은 가능한 한 신속히 정부 직위에서 제거되고 있다'는 취지의 문언\"으로 대체하면 개선될 것이라고 제의하였다. 그러나 그는 런던 앞 9월 21일 오후 3시자 전보 8281호로 애치슨 국무장관 대리로부터, 그의 \"한국에 관한 성명에 관련된 제의는 백악관이 발표를 한 지 약 10시간 후에 국무부에 접수되었다\"는 통보를 받았다(740,00119 Council/9–1845). 성명의 발표에 관한 정보는 1048면의 각주 69 참조."], "warn": false, "pages": [1046, 1047], "search": "Dean Acheson 딘 애치슨 (국무장관 대리) John G. Winant 존 G. 위넌트 (주영 미국대사) James F. Byrnes 제임스 F. 번스 (국무장관) Harry L. Hopkins 해리 L. 홉킨스 (대통령 특별보좌관) T. V. Soong 송자문 (중국 행정원장 겸 외교부장) Douglas MacArthur 더글러스 맥아더 President (Truman) 대통령 (트루먼) — 본문은 직함만 표기"}, {"id": "d780", "order": 780, "date": "1945-09-14", "group": "A", "eyebrow": "d780 · Memorandum by the Acting Secretary of State to President Truman", "title": "국무장관 대리가 트루먼 대통령에게 보내는 각서 — 한국에 관한 성명 제안 (부속서: 트루먼 대통령을 위해 준비된 성명 초안)", "badge": "", "list_right": "문서 780", "meta": [{"k": "일자", "v": "1945-09-14"}, {"k": "발신", "v": "국무장관 대리 딘 애치슨(Dean Acheson)", "txt": true}, {"k": "수신", "v": "트루먼 대통령(President Truman)", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "740.00119 PW/9–1445", "txt": true}], "links": [{"k": "FRUS", "text": "문서 780 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v06/d780"}], "summary": "미군 사령관의 일본인 관리 잠정 유임 발표가 한국과 미국 양쪽에서 불러온 악반응을 수습하기 위해, 대통령이 대(對)한국 정책을 재확인·해명하는 공개 성명을 낼 것을 건의하고 그 초안을 첨부한 각서.", "points": ["1945년 9월 9일 미군의 한국 수도 점령 시 미군 사령관은 일본인 관리를 그 직위에 잠정 유임시킨다고 발표했으나, 이후 가능한 한 신속히 제거하겠다고 발표되었다", "그 사이 합동참모본부는 일본인 총독 및 그 밖의 고위 관리를 즉시 제거하는 것을 목표로 하는 지령을 발송했고, 그에 따른 조치 보고를 곧 받을 예정", "일본인 관리 잠정 유임에 관한 미군 사령관의 최초 발표에 대해 한국과 미국 양쪽에서 매우 불리한 반응이 일어남", "오해와 불리한 보도를 감안해, 대통령이 미국 정부의 대(對)한국 정책 의도를 재천명·해명하는 공개 성명을 발표하는 것이 바람직하다고 판단", "부속 성명 초안: 경성에서의 일본군 항복은 자유를 사랑하는 영웅적 국민의 해방을 알리며, 일본 군벌은 제거되고 있고, 잠정 유임되는 일본인은 기술적 자격 때문에 불가결하다고 여겨져 한국 국민과 미 점령군의 봉사자로서만 활용되는 것이라고 밝힘", "성명 초안은 미·중·영·소 4개국이 한국의 자유·독립에 합의했음을 확인하되, 한국인이 자유·독립국의 책임과 기능을 떠맡고 일본 지배의 잔재를 제거하는 데에는 필연적으로 시간과 인내가 필요하며 한국 국민과 연합국의 공동 노력이 요구된다고 함", "성명 초안은 태극기가 '고요한 아침의 나라'에 다시 휘날린다는 문장으로 끝맺음"], "primary": "## 한국에 관한 성명 제안 (Proposed Statement on Korea)\n\n1945년 9월 9일 미군이 한국의 수도를 점령했을 때, 미군 사령관은 일본인 관리들이 그 직위에 잠정적으로 유임될 것이라고 말했으나, 그 후 그들이 가능한 한 신속히 제거될 것이라고 발표되었다. 그 사이에 합동참모본부(JCS)에 의하여 일본인 총독(Governor-General) 및 그 밖의 고위 관리들의 즉각적 제거를 목표로 하는 지령이 발송되었다. 이 지령에 따라 취해진 조치에 관한 보고가 곧 있을 것으로 예상된다.\n\n[1048면]\n\n일본인 관리들의 잠정적 유임에 관한 미군 사령관의 최초 발표에 대하여 한국과 미국 양쪽에서 매우 불리한 반응이 있었다.\n\n제기된 오해들과 불리한 보도를 고려할 때, 각하께서 한국에 대한 미국 정부의 정책에 관하여 미국 정부의 의도를 재천명하고 명확히 하는 공개 성명을 발표하시는 것이 바람직할 것으로 사료된다. 각하께서 편하신 대로 이른 시일 안에 발표를 고려하고자 하실 수 있는 성명의 초안을 첨부한다.\n\n딘 애치슨(Dean Acheson)\n\n## [부속서] 트루먼 대통령을 위해 준비된 성명 초안[주69]\n\n한국의 옛 수도 경성(Seoul)에서의 일본군의 항복은 자유를 사랑하는 영웅적인 한 국민의 해방을 알리는 것이다. 일본 군벌들 아래에서의 길고 잔혹한 예속에도 불구하고, 한국인들은 민족적 자유와 그들의 자랑스러운 문화적 유산에 대한 헌신을 살아 있게 지켜 왔다. 이 예속은 이제 끝났다. 일본 군벌들은 제거되고 있다. 잠정적으로 유임될 수 있는 일본인들은, 오직 그들의 기술적 자격 때문에 불가결하다고 여겨지는 까닭에, 한국 국민과 우리 점령군의 봉사자로서 활용되고 있는 것이다.\n\n이 해방의 순간에 우리는 앞에 놓인 어려운 과업들을 유념하고 있다. 위대한 국가의 건설이 이제 미국·중국·영국·소련의 원조와 더불어 시작되었으며, 이들은 한국이 자유롭고 독립하게 되어야 한다는 데 합의하고 있다.\n\n한국인들 스스로가 자유롭고 독립한 국가의 책임과 기능을 떠맡는 일, 그리고 한국의 경제적·정치적 생활에 대한 일본의 통제의 모든 잔재를 제거하는 일에는 필연적으로 시간과 인내가 요구될 것이다. 목표는 눈앞에 있으나 그 신속한 달성에는 한국 국민과 연합국의 공동의 노력이 요구될 것이다.\n\n미국 국민은 한국의 옛 국기인 태극기(Tae-gook-kee)가 고요한 아침의 나라(Land of the Morning Calm)에 다시 휘날림에 따라 한국의 해방을 기뻐한다.", "secondary": "740.00119 PW/9–1445\n\nMemorandum by the Acting Secretary of State to President Truman\n\n[Washington,] September 14, 1945.\n\nProposed Statement on Korea\n\nUpon the occupation of the capital of Korea on September 9, 1945, by the American Forces, the American Commander stated that Japanese officials would be temporarily retained at their posts, but subsequently it was announced that they would be remove
