<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스위스와 스웨덴을 거쳐 — 열람기</title>
<style>
:root{
  --bg:#eef1f4; --panel:#f7f9fa; --edge:#ccd4da; --edge-soft:#dde4e9;
  --ink:#16202a; --ink-2:#4a5b68; --ink-3:#71828f;
  --stamp:#8c2f39;            /* 기밀등급 도장의 자주색 */
  --link:#2f5d86;
  --a:#4a7c59; --b:#8a6d3b; --c:#3f6d8c; --d:#7a4a6b; --e:#5a6f7d; --x:#8a8f94;
  --term-line:#9db0c2; --term-bg:rgba(47,93,134,.05);
  --term-line-go:#7fa3c4; --term-bg-go:rgba(47,93,134,.10);
  --term-bg-on:rgba(47,93,134,.17);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",
         -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
    --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
    --stamp:#c9707a; --link:#7fb0da;
    --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
    --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
    --term-bg-on:rgba(127,176,218,.22);
    --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
  }
}
:root[data-theme="dark"]{
  --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
  --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
  --stamp:#c9707a; --link:#7fb0da;
  --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
  --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
  --term-bg-on:rgba(127,176,218,.22);
  --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--link)}

.wrap{display:grid;grid-template-columns:minmax(300px,25%) 1fr;height:100vh}

/* 좁은 화면 — 목록을 위로 접어 올리면 본문이 설 자리가 없다.
   목록은 서랍으로 빼고 화면 전부를 문서에 준다. */
.mbar{display:none}
.scrim{display:none}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;grid-template-rows:1fr;padding-top:44px}
  .mbar{display:flex;align-items:center;gap:10px;
    position:fixed;top:0;left:0;right:0;height:44px;z-index:30;padding:0 12px;
    background:var(--panel);border-bottom:1px solid var(--edge)}
  .mbar button{background:var(--term-bg-go);border:1px solid var(--term-line-go);
    color:var(--link);border-radius:999px;padding:3px 11px;cursor:pointer;
    font:inherit;font-size:12px;font-family:var(--mono);white-space:nowrap}
  .mbar-t{font-size:12.5px;font-weight:650;color:var(--ink-2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail{position:fixed;top:0;bottom:0;left:0;z-index:40;
    width:min(88vw,340px);max-height:none;
    transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:0 0 30px rgba(0,0,0,.35)}
  body.railopen .rail{transform:none}
  .scrim{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45);border:0;padding:0}
  body.railopen .scrim{display:block}
  .toolbar{padding:7px 16px;gap:8px}
  .toolbar #themeBtn{display:none}
  .mbar-t{flex:1}
  .mbar-th{padding:3px 9px;font-size:13px}
  .seg button{padding:4px 9px;font-size:11.5px}
  .srcline{padding:10px 16px 0}
}
@media(prefers-reduced-motion:reduce){.rail{transition:none}}

/* ── 좌측 목록 ─────────────────────────────── */
.rail{border-right:1px solid var(--edge);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
.rail-head{padding:14px 14px 10px;border-bottom:1px solid var(--edge-soft);
  display:flex;flex-direction:column;gap:8px}
/* 문서철에 들어오면 나갈 길이 있어야 한다 */
.home{display:inline-flex;align-items:center;gap:5px;text-decoration:none;
  color:var(--link);font-size:11.5px;font-family:var(--mono);
  letter-spacing:.04em;width:fit-content;
  background:var(--term-bg-go);border:1px solid var(--term-line-go);
  border-radius:999px;padding:2px 10px 2px 8px}
.home:hover{background:var(--term-bg-on);border-color:var(--link)}
.home span{font-size:12px;line-height:1}
.brand{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font-weight:400;letter-spacing:0;text-transform:none;
  color:var(--ink-3);font-size:11.5px;margin-top:2px}
input[type=search]{width:100%;padding:7px 10px;border:1px solid var(--edge);
  border-radius:3px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
input[type=search]:focus,button:focus-visible,.item:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--edge);background:transparent;color:var(--ink-2);
  border-radius:999px;padding:2px 9px;font-size:11.5px;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sortbar{display:flex;gap:10px;font-size:11.5px;color:var(--ink-3);align-items:center}
.sortbar button{background:none;border:none;color:var(--ink-3);cursor:pointer;
  font:inherit;padding:0;border-bottom:1px solid transparent}
.sortbar button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.list{overflow-y:auto;flex:1;min-height:0}
.item{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--edge-soft);border-left:3px solid transparent;
  padding:9px 13px;cursor:pointer;font:inherit;color:inherit}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--bg);border-left-color:var(--ink)}
.item.tA{border-left-color:var(--a)} .item.tB{border-left-color:var(--b)}
.item.tC{border-left-color:var(--c)} .item.tD{border-left-color:var(--d)}
.item.tE{border-left-color:var(--e)} .item.tX{border-left-color:var(--x)}
.item-top{display:flex;justify-content:space-between;gap:8px;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.item-sum{font-size:12.5px;line-height:1.45;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 제목이 「국무장관이 주한대사에게」 꼴이라 무엇을 읽는 것인지 알 수 없다.
   요지 한 줄을 옅게 깔아 준다. 목록이 길어지지 않도록 두 줄에서 자른다. */
.item-hint{font-size:11.5px;line-height:1.4;margin-top:3px;color:var(--ink-3);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── 우측 본문 ─────────────────────────────── */
.main{overflow-y:auto;min-height:0}
.toolbar{position:sticky;top:0;z-index:5;background:var(--panel);
  border-bottom:1px solid var(--edge);padding:8px 26px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px}
.toolbar .grow{flex:1}
.seg{display:flex;border:1px solid var(--edge);border-radius:3px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 11px;cursor:pointer;
  font:inherit;font-size:12px;color:var(--ink-2);border-right:1px solid var(--edge)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.srcline{padding:10px 26px 0;font-size:11px;color:var(--ink-3);line-height:1.5}

/* ── 연대 바 ───────────────────────────────
   5년 반을 한 줄에 욱여넣으면 1945년 8월 열흘은 0.5% 밖에 안 된다. 그래서
   줄을 늘여 놓고 **띠 자체를 움직인다** — 지금 읽는 문서의 날짜가 늘 정중앙이다.
   문서를 옮기면 띠가 미끄러지고, 사건 이름은 겹치지 않게 위아래로 층을 나눈다. */
.chrono{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
  width:min(940px,calc(100vw - 48px));z-index:20;user-select:none;
  border:1px solid var(--edge);border-radius:8px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 20px rgba(0,0,0,.10);
  transition:box-shadow .2s ease}
.chrono:hover{box-shadow:0 6px 26px rgba(0,0,0,.18)}
/* 옅어지는 것은 **내용**이지 판이 아니다. 판까지 투명해지면 뒤의 본문이
   비쳐 들어와 글자가 서로를 밟는다. */
.chrono-track{opacity:.5;transition:opacity .2s ease}
.chrono:hover .chrono-track{opacity:1}

/* 띠가 지나가는 창. 손으로도 밀 수 있게 진짜 가로 스크롤을 쓴다 */
.chrono-vp{position:relative;overflow-x:auto;overflow-y:hidden;
  height:var(--chH,92px);border-radius:8px;cursor:grab;
  scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain}
.chrono-vp::-webkit-scrollbar{display:none}
.chrono-vp.drag{cursor:grabbing}
/* 안쪽 띠. 양옆 여백은 창의 절반 — 첫 문서도 마지막 문서도 가운데에 설 수 있게 */
.chrono-track{position:relative;height:100%;margin:0 var(--chPad,0px)}
/* 시간 축 — 층의 한가운데 */
.chrono-track::before{content:"";position:absolute;
  left:calc(0px - var(--chPad,0px));right:calc(0px - var(--chPad,0px));
  top:var(--axis,46px);height:1px;background:var(--edge)}

/* 연도 — 해가 바뀌는 자리에 선을 긋고, 그 선부터가 그 해다.
   이름표는 창 왼쪽에 들러붙는다. 1945년 한복판을 보고 있어도 「1945」가 남는다. */
.cy{position:absolute;top:0;bottom:0;
  border-left:1px solid color-mix(in srgb,var(--ink-3) 50%,transparent)}
.cy.alt{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.cy b{position:absolute;bottom:3px;font-family:var(--mono);font-size:11px;
  font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;
  line-height:1;letter-spacing:.06em;white-space:nowrap;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px}
/* 달·분기 눈금 — 해 안에서 어디쯤인지. 분기는 조금 길게 */
/* 1px 짜리 표는 좌표에 걸터앉혀야 한다. 왼쪽 모서리를 좌표에 맞추면 표가
   반 픽셀 오른쪽에 서서, 같은 날짜의 점과 어긋나 보인다. 아래 실·표도 같다. */
.cq{position:absolute;top:calc(var(--axis,46px) - 1.5px);width:1px;height:4px;
  margin-left:-.5px;background:var(--edge);opacity:.7}
.cq.q{top:calc(var(--axis,46px) - 2.5px);height:6px;opacity:1}
.cq[hidden]{display:none}

/* 배율 — 5년 반을 한눈에 볼 때와 8월 열흘을 벌려 볼 때가 같을 수 없다 */
.chrono-zoom{position:absolute;right:6px;top:5px;z-index:3;display:flex;gap:3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-zoom,.chrono-zoom:focus-within{opacity:1}
.chrono-zoom button{width:19px;height:19px;padding:0;line-height:1;
  font-family:var(--mono);font-size:12px;color:var(--ink-2);cursor:pointer;
  background:var(--panel);border:1px solid var(--edge);border-radius:3px}
.chrono-zoom button:hover:not(:disabled){color:var(--link);border-color:var(--link)}
.chrono-zoom button:disabled{opacity:.35;cursor:default}
.chrono-scale{position:absolute;right:6px;bottom:3px;z-index:3;
  font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.03em;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-scale{opacity:1}

/* 사건 점 — 이름에서 내려오는 실보다 위다. 실이 점 위를 지나가면
   점이 실에 꿰뚫린 것처럼 보이고, 어느 것이 사건 자리인지 흐려진다. */
.cm{position:absolute;top:calc(var(--axis,46px) - 3px);width:7px;height:7px;
  margin-left:-3.5px;border-radius:50%;background:var(--ink-3);z-index:2;
  border:1.5px solid var(--panel);cursor:help;
  transition:background .15s ease,transform .15s ease}
.cm.key{background:var(--stamp);width:9px;height:9px;margin-left:-4.5px;
  top:calc(var(--axis,46px) - 4px)}
.cm:hover{background:var(--link);transform:scale(1.45)}

/* 사건 이름 — 층(lane)을 나눠 위아래로 흩는다. 여기서 겹침이 풀린다 */
.cl{position:absolute;transform:translateX(-50%);white-space:nowrap;z-index:1;
  font-family:var(--mono);font-size:10px;line-height:1.1;color:var(--ink-2);
  letter-spacing:.01em;padding:1px 4px;border-radius:2px;cursor:help;
  background:color-mix(in srgb,var(--panel) 70%,transparent)}
.cl.key{color:var(--stamp)}
.cl:hover,.cl:focus-visible{color:var(--link);outline:0;
  background:color-mix(in srgb,var(--link) 12%,var(--panel))}
/* 이름에서 축까지 내려/올려 긋는 실 — 어느 점의 이름인지 알아보게 */
.cl::after{content:"";position:absolute;left:calc(50% - .5px);width:1px;
  background:var(--edge)}
.cl.up::after{top:100%;height:var(--leg,0px)}
.cl.dn::after{bottom:100%;height:var(--leg,0px)}

/* 지금 읽는 문서가 놓인 자리. 문서를 고르면 이 표가 창 한가운데로 온다.
   손으로 띠를 밀면 표는 제 날짜에 남는다 — 표는 시간에 박혀 있지 창에 박혀 있지 않다. */
.chrono-cursor{position:absolute;top:0;bottom:0;width:1px;z-index:3;
  margin-left:-.5px;background:var(--stamp);pointer-events:none}
/* 가상 요소는 위의 *{box-sizing:border-box}가 닿지 않는다 — 여기서 직접 잡아 주지
   않으면 테두리 2px 만큼 표시가 축 아래·오른쪽으로 밀려 앉는다. */
.chrono-cursor::before{content:"";position:absolute;box-sizing:border-box;
  left:-6px;top:calc(var(--axis,46px) - 6px);width:13px;height:13px;
  border-radius:50%;background:var(--stamp);border:2px solid var(--panel)}
/* 날짜는 맨 아래, 표 바로 밑에 — 위쪽은 사건 이름 층에 내준다 */
.chrono-date{position:absolute;bottom:2px;transform:translateX(-50%);
  font-family:var(--mono);font-size:10px;color:var(--stamp);
  font-variant-numeric:tabular-nums;background:var(--panel);
  padding:0 5px;border-radius:2px;white-space:nowrap;z-index:3}
.chrono[data-nodate="1"] .chrono-cursor,
.chrono[data-nodate="1"] .chrono-date{display:none}

/* 좁은 화면에서도 연대 바는 남긴다 — 이 화면의 절반은 「언제인가」이다.
   폭을 화면 끝까지 늘리고, 손가락으로 미는 것이 이미 되므로 줌 단추는 접는다. */
@media(max-width:900px){
  .chrono{bottom:8px;width:calc(100vw - 16px);border-radius:6px}
  .chrono-zoom{display:none}
  .chrono-track{opacity:1}
}
@media(prefers-reduced-motion:reduce){.chrono-track{transition:none}}

/* 아래쪽 여백은 떠 있는 연대 바가 마지막 문단을 덮지 않을 만큼 */
article{max-width:none;padding:26px 26px 190px}
@media(max-width:900px){article{padding:18px 16px 170px}}

/* ── 앞뒤로 넘기기 ─────────────────────────────
   목록을 다시 열지 않고도 이어 읽을 수 있어야 한다. */
.steps{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;
  margin-top:34px;padding-top:18px;border-top:1px solid var(--edge)}
.step{display:flex;flex-direction:column;gap:2px;text-align:left;
  border:1px solid var(--edge);border-radius:5px;background:transparent;
  padding:9px 12px;cursor:pointer;font:inherit;color:var(--ink-2);min-width:0}
.step.next{text-align:right;align-items:flex-end}
.step:hover{border-color:var(--link);color:var(--ink);background:var(--term-bg)}
.step-k{font-family:var(--mono);font-size:11px;color:var(--link);letter-spacing:.04em}
.step-d{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.step-t{font-size:13px;line-height:1.4;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.step.empty{display:flex;align-items:center;justify-content:center;border-style:dashed;
  color:var(--ink-3);font-size:12px;font-family:var(--mono);cursor:default}
.steps .step-n{align-self:center;font-family:var(--mono);font-size:11.5px;
  color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}

@media(max-width:900px){
  .steps{grid-template-columns:1fr;gap:8px}
  .steps .step-n{order:-1;text-align:center}
  .step.next{text-align:left;align-items:flex-start}
}
.doc-head{border-bottom:1px solid var(--edge);padding-bottom:14px;margin-bottom:18px}
h1{font-size:19px;margin:0 0 4px;line-height:1.35;text-wrap:balance;font-weight:650}
.docid{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  letter-spacing:.04em;font-variant-numeric:tabular-nums}
.stamp{display:inline-block;border:1.5px solid var(--stamp);color:var(--stamp);
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:1px 6px;
  border-radius:2px;transform:rotate(-1.2deg);margin-left:8px;vertical-align:2px}
.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:3px 20px;margin-top:10px;font-size:12.5px}
.meta div{display:flex;gap:7px}
/* 참석자 명단처럼 긴 값. 좁은 칸에 넣으면 한 글자씩 세로로 눌린다 */
.meta div.wide{grid-column:1/-1}
.meta b{color:var(--ink-3);font-weight:500;min-width:52px;font-size:11.5px}
.meta span{font-family:var(--mono);font-size:12px}
.meta span.txt{font-family:var(--sans);font-size:12.5px}

.points{margin:16px 0;padding:12px 16px;border-left:2px solid var(--edge);
  background:var(--panel);border-radius:0 3px 3px 0}
.points li{margin:3px 0}
.points ul{margin:0;padding-left:18px}

.cols{display:grid;gap:26px}
.cols.two{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.cols.two{grid-template-columns:1fr}}
.pane h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 8px;font-weight:600}
.body{white-space:pre-wrap;word-break:break-word}

현 상태에서 일본 국민을 화평으로 이끌 수 있는 것은 황족 이외에 없다는 이유를 들고 있다.\n\n다른 한편 일본의 우익 극단파는 대영미전을 완수하기 위해서는 소련의 중립 유지 확약을 받아낼 필요가 있다고 하여, 시게미쓰 외상에게 소련에 가서 직접 교섭을 행할 것을 권고했다는 소문도 전해진다. 이들 극단파는 소련의 확약을 받아내기 위해서는 남사할린(南樺太)의 양여, 만주·중국(지나)에서의 소련 지위의 승인, 일본 국내 체제의 수정(자본주의의 수정, 민주정치의 부활) 등의 조건을 승인하더라도 부득이하다고 주장하고 있다고 전해진다.\n\n二、위 일본 화평설은 영미 측의 일독(日獨) 이간을 목적으로 하는 신경전으로 간주되는바, 동시에 영미가 온갖 수단을 써서 전쟁의 급속한 종결에 초조해하고 있는 증좌로도 볼 수 있어 주목할 만하다. 현 단계에서 일본과 영미 사이에 타협 화평이 가능한 유일한 조건은 극동에서의 영미·소련의 대립이다. 즉 만약 영미가 일본을 완전히 무력하게 만든 날에는, 소련의 중국(지나) 대륙 진출은 지리적 관계 및 종래의 발판으로 보아 이를 저지하기가 극히 곤란하며, 영미로서 이를 저지하려 한다면 결국 무력에 의하는 수밖에 없을 것이므로, 일본을 이용하여 일본에 어느 정도의 힘을 보유하는 것을 허락하고 소련의 진출에 대항시키는 것을 득책이라고 생각할 때에만 일본·영미 간의 화평이 가능하다. 다른 한편 소련 또한 극동에서 영미와의 대립을 예상하는 경우에만 일본과의 양해에 도달하는 것을 득책이라고 생각할 것이며,\n\n극동에서 영미와의 사이에 양해가 성립하여 장래 아무런 중대 이해(利害)의 충돌도 예상하지 않는 경우에는, 설령 일본 측에서 중대한 양보를 제의하더라도 일본과 적극적 양해는 맺지 않을 것이다. 즉 현 단계에서 일·영미 간에 화평이 가능한 때는 동시에 일·소 간에도 양해가 가능하게 될 것이며, 어느 한쪽이 불가능한 경우에는 다른 쪽도 또한 가망이 없을 것으로 관측된다.\n\n또한 소련은 루마니아(羅馬尼) 등에 대한 것과 같은 수법(同巧異曲)의 방법으로 중국(지나)에 진출하려 하고 있는 듯하며(최근 소련 신문은 중국 문제를 크게 다루면서 위와 같은 취지로 논평하고 있다), 즉 국내 정치에서 좌익분자의 세력 증대를 꾀하고 이어서 정치적으로 이를 자기 산하로 끌어들이는 전술을 취하는 것으로 관찰된다. 만약 일본이 소문과 같은 양보를 행하는 일이 있다고 한다면, 소련은 정치적으로 만주·중국(지나)은 물론 일본에까지 진출해 올 것이므로 극히 위험하다고 하지 않을 수 없다.\n\n三、금속노동자 파업 문제(왕전 제146호 참조)에 관하여 보수당 의원 6명이 정부의 조치에 불만이라는 취지의 공동성명을 발표하였으나, 아직 연립내각의 존속 문제가 되리라고는 생각되지 않는다. 스웨덴은 최근 대독 통상의 정지, 「나비서트(ナビーサート)」에 의해, 그리고 대남미 무역의 감소에 의해 물자가 점차 감소하고 물가가 등귀하며, 할인율의 인상에 의해 「인플레」적 경향이 촉진되어 국내 문제는 점차 악화의 경향에 있다. 정계 일부에서는 특히 핀란드(芬蘭)에서 다가올 선거를 전후한 정치 정세의 추이에 큰 관심을 기울이고 있으며, 그것이 스웨덴 정정에 미칠 영향은 보수당 방면에서 우려하고 있다. 현 스웨덴 「한손(ハンソン)」 내각은 어떤 의미에서는 좌경화를 방지하고 있으므로, 개개의 구체적 시책에 대해서는 반대가 있어도 보수당 우익도 결국 동 내각을 계속 지지하는 수밖에 없다고 하고 있는 듯하다.", "secondary": "9499昭和20年3月9日重光外務大臣宛（電報）在スウエーデン岡本公使より連合国側における日本からの和平打診説について\n\nストックホルム3月9日發\n\n本省3月12日前10時20分着\n\n第一五九號\n\n諜報者報告（六日）左ノ通\n\n一、英米側ニテハ最近頻リニ日本ノ和平打診ヲ報シ居ル處當地英米人方面及瑞典人ノ間ニ於テモ最近ノ話題トナリ獨逸人中ニモ之ヲ耳ニシ憂慮シ居ル者アリ右噂ハ日本實業界知識階級及宮廷方面ニ於テ和平論擡頭シ英米トノ接觸ヲ求メシコトヲ主張スル者多シト云フニアリ又皇族カ首相ト成ラルヘシトノ新聞報道現ハレタルニ對シテモ現狀ニ於テ日本國民ヲ和平ニ導キ得ル  부하를 이끌고 스웨덴으로 탈출·공사관을 탈취하려 한다는 계획을 보고하고 해군 중앙의 엄명을 요청한 전보.", "points": ["베를린으로부터 오야(大矢) 해군대좌가 무관으로 부임한다는 소식을 듣고 당관 해군무관에게 물었으나 「해군성에 조회 중, 자신은 모른다」는 답이었다.", "4월 14일 육군무관이 공사를 찾아와 오야 대좌는 이미 임명되었으며 베를린 출장 시 해군 아베(阿部) 중장 등의 의뢰가 있었다면서, 당지 육해군 선임자 자격으로도 시급한 입국 알선을 요청했다.", "공사는 무관 경질이라면 해군성→외무성 또는 해군의 직접 정식 통고가 있어야 하며, 스웨덴 외무성이 증원을 인정하지 않는 상황에서 현 무관의 독일 전출은 사실상 불가능하다고 지적하고, 사태 확인 전에는 움직일 수 없다고 물리쳤다(왕전 제249호의 청훈 배경).", "공사는 해군무관을 감싸거나 오야 대좌의 부임을 막을 의사가 전혀 없으며 「전혀 백지」임을 강조하고, 다만 경질이라면 좀 더 원만한 절차를 희망한다고 밝혔다.", "더 중대한 문제: 아베 중장이 독일 만일의 경우 특별기로 부하 십수 명과 함께 탈출해 스웨덴에 무리하게 들어올 계획을 세웠고, 그 심복인 오야 대좌를 먼저 당지 무관으로 임명한 것으로 보인다.", "소문에 따르면 그들은 당지에서의 장래 화평 접촉까지 내다보고, 입국 후 차차 문제를 일으켜 공사관 탈취까지 획책하고 있다. 육군무관은 참획, 해군무관은 반대하고 있는 듯하다.", "4월 6일 스톡홀름 각 신문이 아베 중장의 해군무관 부임설을 보도해 「센세이션」이 일었고, 당관 조사로는 AP가 독일 측에서 얻은 정보 □□□(三字不明)라는 취지였다.", "이런 무분별한 거동은 스웨덴을 자극하고 영미에 간섭의 구실을 주며 공사의 사명 수행에 중대한 장애가 된다면서, 해군 중앙의 시급하고 엄중한 명령 발출을 간청.", "오야는 이미 코펜하겐에 도착해 사증을 기다리고 있고 동행 미쓰이(三井) 사원 와쿠타(涌田)는 15일 스톡홀름에 도착해 육해군 사무소를 두루 방문 중이라는 후속 정보."], "primary": "（□カ）\n\n一、최근 베를린으로부터 오야(大矢) 해군대좌가 무관으로서 당지에 온다는 것을 들었기에 당관 소속 해군무관에게 물어본즉, 본건에 관해서는 해군성에 확인하기 위해 해군성에 전보로 조회 중이며 자신은 아무것도 알지 못한다는 것이었다. 그런데 14일에 이르러 육군무관이 본사(本使)를 내방하여, （□カ）오야 대좌는 이미 임명된 자이며 본건에 관해서는 지난번 베를린에 출장했을 때 해군 아베(阿部) 중장 등으로부터 자신에게 의뢰한 바가 있었고, 자신은 당지 육해군을 통틀어 선임자이므로 이 자격에서도 시급히 입국 알선을 부탁드리고 싶다고 말하였다. 이에 본사는, 적어도 당관 소속 무관을 경질하는 것인 이상 해군성으로부터 외무성을 통해 통고가 있거나 혹은 직접 해군으로부터 정식으로 본사에게 통고가 있어야 할 것으로 생각한다, 또한 당국(스웨덴) 외무성은 증원을 인정하지 않는다는 태도를 취하고 있는데 현 무관은 교체되어 독일로 전출하는 것인가(현 상태에서는 사실상 불가능할 것이다), 이 점은 어떻게 하려는 것인가라고 말한바, 육군무관은 그러한 점은 알지 못한다, 다만 곧바로 알선을 구하여 마지않는다, 시기가 늦어지면 귀하를 위해 이롭지 않을 것이라고 말하였다. 이에 본사는 일에는 순서가 있다, 본사의 입장으로서는 육군무관의 의뢰가 있더라도 현지에 있는 해군무관을 전혀 무시하고 경솔한 거동에 나설 수는 없다고 물리치고, 우선 사태를 명확히 하기 위해 시급히 본성에 전보하여 그 결과를 기다리는 수밖에 없다는 뜻을 타일러 두었다.\n\n왕전 제249호는 위와 같은 사정으로 청훈한 것으로서, 본디 본사로서는 조금도 해군무관을 감싸려는(庇フ) 것이 아니며 또 （□カ）오야 대좌의 부임을 막을 의사도 없다. 이 점은 전혀 백지이니 잘 알아두시기 바라며, 다만 당관 소속 무관을 경질할 필요가 있다면 좀 더 솜씨 좋게 원만히 행하는 것을 본사로서는 특히 이 기회에 희망하지 않을 수 없다.\n\n모략이 횡행하는 세상이므로, 본건 및 그 밖에 관하여 의도를 가진 오전(誤傳)·중상 내지 배척 등이 전해지는 일이 있을 수 있기에 감히 귀하의 귀를 더럽히는 바이다.\n\n二、더욱 중대한 것은, 본사가 은밀히 듣는 바에 따르면 아베 중장은 독일 만일의 경우에는 특별히 마련한(仕立) 비행기로 부하 십수 명을 데리고 독일을 탈출하여 당국에 무리하게 들어올 계획을 세우고 있다는 것이며, 이를 위해 그 심복인 （□カ）오야 대좌를 우선 당지 무관에 임명한 것으로 보인다. 본사의 추측으로는, 이 계획이 사전에 새어나갈 때에는 종래 스웨덴〔（典カ）— 원문 「瑞西側」〕 측을 자극하지 않도록 극력 노력하고 있는 본사의 반대를 받을 것을 두려워하여, 이번 일에 관해서는 일체 본사에게 접촉해 오지 않는 것으로 생각된다. 육군무관은 물론 여기에 참획하고 있는 듯하며(해군무관은 이에 반대하고 있는 듯하다. 이로써 앞서 든 一、의 사정은 판명된다), 소문에 따르면 그들은 당지에서의 장래의 화평 접촉까지도 내다보고, 입국이 이루어진 뒤에는 차차 문제를 일으켜 공사관 탈취까지도 획책하고 있는 듯하다는 것이다. 4월 6일 당지 각 신문은 아베 중장이 해군무관으로서 당지에 들어온다는 기사를 실어 「센세이션」을 일으켰고 각 방면으로부터 문의가 있었기에 그러한 사실이 없다고 설명하게 해 두었으나, 당관에서 조사한 바에 따르면 위는 「에이피(AP)」가 독일 측으로부터 얻은 정보 □□□（三字不明）라는 취지이다.\n\n만약 만에 하나라도 앞서 말한 것과 같은 무분별한 거동을 단행한다면, 당국을 자극함은 물론 영미에게 좋은 간섭의 구실을 주는 결과가 될 것은 불을 보듯 명백하며, 당국에서 본사 등의 사명 수행에 중대한 장애를 미쳐 활동의 운명을 □（一字不明）게 하는 일이 될 것을 두려워한다. 해군 중앙에서는 과연 이와 같은 일을 승인하는 것인가. 이러한 위험하고 유해한 기도는 이를 미연에 저지하도록 해군 중앙으로부터 시급히 엄중한 명령을 발출해 주실 것을 본사는 간절히 바라 마지않는다.\n\n그 후의 정보에 의하더라도 본건 준비는 착착 진행되고 있는 모양이며（（□カ）오야는 이미 「코펜하겐」에 도착하여 사증 취득을 기다리고 있고, 동행하는 미쓰이(三井) 사원 와쿠타（？）(涌田)는 15일 당지에 도착하여 육해군 사무소를 두루 방문하고 있다）, 사실임에 틀림없다고 인정되므로, 일의 중대함에 비추어 있는 그대로를 보고하며 간절히 대지급으로 재단(裁斷)을 우러러 청하는 바이다. 또한 본건에 관해서는 즉시 어떠한 회전(囘電)이든 주시기 바란다.", "secondary": "950昭和20年4月16日東鄕外務大臣宛（電報）在スウエーデン岡本公使よりスウェーデン駐在武官の動向につき注意喚起\n\nストックホルム4月16日後1時35分發\n\n本省4月18日前1時55分着\n\n第二五二號（緊急、館長ル號、時展、極祕）\n\n（□カ）\n\n一、最近伯林ヨリ大矢海軍大佐武官トシテ當地ニ來ル旨聞込ミタルニ依リ當館附海軍武官ニ質シタル處本件ニ付テハ海軍省ニ確ムル爲海軍省ニ電昭中ナリ自分ハ何事モ承知セストノコトナリシカ十四日ニ至リ陸軍武官本使ヲ來訪（□カ）\n\nシ大矢大佐ハ旣ニ任命セラレタルモノニシテ本件ニ付テハ先般伯林ニ出張ノ際海軍阿部中將等ヨリ自分ニ依賴ノ次第アリ自分ハ當地陸海軍ヲ通シテ先任者ナルニ依リ此ノ資格ニ於テモ至急入國幹旋方御廳シタシト述ヘタリ依テ本使ハ苟クモ當館附武官ヲ更迭スルモノナル以上海軍省ヨリ外務省ヲ通シテ通告アルカ若クハ直接海軍ヨリ正式ニ本使ニ通告アルヘキモノト思考ス尙當國外務省ハ增員ヲ認メストノ態度ヲ執リ居ル處現武官ハ入替ニ獨逸ニ轉出スルモノナリヤ（現狀ニテハ事實不可能ナラン）此ノ點ハ如何セントスルモノナリヤト述ヘタル處陸軍武官ハ斯ル點ハ承知シ居ラス唯直ニ幹旋ヲ求メテ止マス時機遲ルレハ貴下ノ御爲ニナラサルヘシト云ヘルニ付本使ハ物ニハ順序アリ本使ノ立場トシテハ陸軍武官ノ依賴アリトモ現地ニ在ル海軍武官ヲ全然無視シテ輕卒ナル擧ニ出スルヲ得スト撥付ケ先ツ事態ヲ明確ニスル爲至急本省ニ電報シテ其ノ結果ヲ俟ツノ外ナキ旨諭シ置ケリ\n\n往電第二四九號ハ右ノ事情ニテ請訓セル次第ニ有之素ヨ（□カ）\n\nリ本使ニ於テハ何等海軍武官ヲ府フ次第ニアラス又大矢大佐ノ來任ヲ阻ム意思無之此ノ點ハ全然白紙ナルニ付篤ト御承知置キアリタク唯當館附武官更迭ノ要アルニ於テハ今少シク手際良ク圓滿ニ行フコトヲ本使トシテハ特ニ此ノ際希望セサルヲ得ス\n\n謀略檔行ノ世ノ中ニテ本件竝ニ其ノ他ニ關シ爲ニスル誤傳中傷乃至ハ排斥等傳ヘラルルコトアリ得ヘキヲ以テ敢テ御耳ヲ汚ス次第ナリ\n\n二、更ニ重大ナルハ本使ノ内密耳ニスル所ニ依レハ阿部中將ハ獨逸萬一ノ場合ニハ特別什立ノ飛行機ニテ部下十數名ヲ伴ヒ獨逸ヲ脫出シ當國ニ無理ヤリニ這リ込ム計畫ヲ樹（□カ）\n\nテ居レリトノコトニシテ之カ爲其ノ腹心ノ大矢大佐ヲ先ツ當地武官ニ任命セルモノナルカ如ク本使ノ推測ニテハ（典カ）\n\n此ノ計畫カ未然ニ漏ルルトキハ從來瑞西側ヲ刺戟セサル樣極力努力シ居ル本使ノ反對ヲ受クヘキヲ惧レ今囘ノコトニ關シテハ一切本使ニ接觸シ來ラサルモノト思ハル陸軍武官ハ勿論之ニ參畫シ居ルカ如ク（海軍武官ハ之ニ反對シ居ルカ如シ右ニ依リ前揭一、ノ事情ハ判明ス）噂ニ依レハ彼等ハ當地ニ於ケル將來ノ和平接觸ヲモ見越シ入國成込ノ上ハ追々ト問題ヲ起シ公使館乘取リヲモ策シ居ルカ如シトノコトナリ四月六日ノ當地各新聞ハ阿部中將海軍武官トシテ當地ニ乘込ムヘシトノ記事ヲ揭ケ「センセイシヨン」ヲ起シ各方面ヨリ問合セアリ如斯事實ナシト說明セシメ置キタルカ當館ニテ取調ヘタル所ニ依レハ右（三字不明）\n\nハ「エイピー」カ獨逸側ヨリ得タル情報□□□趣ナリ若シ萬一ニモ前記ノ如キ無思慮ナル擧ヲ斷行スルニ於テハ當國ヲ刺戟スルハ勿論英米ニ好個ノ干涉ノ口實ヲ與フル結果トナルハ火ヲ睹ルヨリモ明カニシテ當國ニ於ケル（一字不明）\n\n本使等ノ使命遂行ニ重大障碍ヲ及ホシ活動ノ連命ヲ□ムルコトトナルヲ惧ル海軍中央ニ於テハ果シテ斯ノ如キコトヲ承認スル次第ナリヤ斯ル危險有舌ナル企テハ之ヲ未然ニ阻止スル樣海軍中央ヨリ至急嚴重ナル命令發出方ヲ本使ハ切望シテ熄マス\n\n其ノ後ノ情報ニ依ルモ本件準備ハ着々進行シツツアル模（□カ）\n\n樣（大矢ハ旣ニ「コペンハアゲン」ニ到着査證取付ケヲ？\n\n待チ居リ同行ノ三井社員涌田ハ十五日當地着陸海軍事務所ヲ歷訪シ居レリ）ニテ事實ニ相遲ナシト認ムルニ付テハ事ノ重大ナルニ鑑ミ有ノ儘ヲ報告シ切ニ大至急御裁斷ヲ仰ク次第ナリ尙本件ニ付テハ折返シ何分ノ儀御囘電ヲ請フ", "notes": ["（□カ） — 편자가 붙인 「…인가」 표시. 지면에서는 「大矢」에 걸리는 작은 방주로, 스캔상 글자는 「扇」으로 보인다(같은 인물이 d958에서는 「扇大佐」로 인쇄되어 있다).", "（典カ） — 원문 「瑞西側」에 대해 편자가 「瑞典(스웨덴)」의 오기로 본다는 표시.", "（三字不明）（一字不明） — 편자가 표시한 결락 글자 수. 그대로 두었다.", "（？） — 「涌田」의 읽기·표기에 대한 편자의 의문 표시."], "warn": true, "pages": [1697, 1698, 1699], "search": "スウェーデン駐在武官の動向につき注意喚起 岡本季正 오카모토 스에마사(주스웨덴 공사, 발신자) 東鄕茂德 도고 시게노리(외무대신, 수신자) 阿部 아베 중장(在독일 해군) 大矢 오야 해군대좌(d958에는 「扇大佐」) 涌田 와쿠타(미쓰이 사원)"}, {"id": "d951", "order": 951, "date": "1945-05-10", "group": "A", "eyebrow": "문서 951 · 二 中立国を通じた和平打診", "title": "스웨덴 정부의 화평 알선 의향에 관하여 바게 공사에 대한 회답 방식을 청훈", "badge": "第三三二號（館長符號、緊急、極祕、必親展）", "list_right": "문서 951", "meta": [{"k": "일자", "v": "1945-05-10", "txt": false}, {"k": "발신", "v": "在スウエーデン岡本公使 주스웨덴 오카모토 스에마사(岡本季正) 공사", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 시게노리(東鄕茂德) 외무대신", "txt": true}, {"k": "발착", "v": "ストックホルム5月10日後發 / 本省5月11日前着", "txt": false}, {"k": "장소", "v": "ストックホルム 스톡홀름", "txt": false}, {"k": "전보번호", "v": "第三三二號（館長符號、緊急、極祕、必親展）", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "귀임한 바게 주일 스웨덴 공사가 도고 외상의 내의를 묻자, 오카모토 공사가 스웨덴 정부에 알선 의사가 있는 것으로 보인다고 판단하고 회답 방식에 대한 훈령을 청한 전보.", "points": ["5월 10일 바게(バッゲ) 공사가 귀임했다며 공사를 내방, 도쿄 출발 전 쇼야(昌谷) 공사를 통해 이야기된 건을 내밀히 꺼내고 도쿄에서 전보가 왔는지 물었다. 공사는 아무 전보도 받지 못했다고 답했고, 바게는 「귀 대신의 내의(內意)를 알고 싶다」고 말했다.", "짚이는 일: 4월 17일 스웨덴 외무차관이 「일본으로서는 더 중대한 문제를 앞두고 계시니 미국·영국이 좋아하지 않는 해군무관실 증강 같은 작은 문제를 고집하지 않는 것이 좋겠다」고 한마디 했고, 공사는 이상하다고 직감했으나 일부러 흘려들었다. 바게의 전보로 차관이 알고 있었던 것으로 추찰된다.", "차관의 말투로 보아 스웨덴 정부 측에 알선의 뜻이 있는 것으로 생각되나, 동시에 영미 측으로 그대로 새어나갈 위험이 크다는 우려.", "전적으로 스웨덴 측의 「이니셔티브」로 탐색하게 하려는 내의라면 그 취지를 다시 바게 공사에게 내시(內示)할 필요가 있으므로 시급한 회전을 요청.", "보안: 본건은 관원에게도 일체 알리지 않으며 전보 작성도 해독도 공사 자신이 한다."], "primary": "「바게(バツゲ)」 공사가 귀임하였다는 취지로 오늘 10일 본사(本使)를 내방하여, 출발 전 〔編注〕쇼야(昌谷) 공사를 통하게 하신 건에 관하여 본사에게 내밀히 이야기하고, 도쿄로부터 전보가 있었는가를 물었기에, 본사는 아무런 전보도 접하고 있지 않다고 답한바, 귀 대신의 내의(內意)를 알고 싶다고 말하였다.\n\n이로써 짚이는 것은, 4월 17일 외무차관과 회담하였을 때 차관이, 일본으로서는 더욱 중대한 문제를 앞두고 계신 터이니 이때 미국·영국이 좋아하지 않는 해군무관실 증강과 같은 작은 문제를 고집하지 않으시는 것이 좋겠다고 한마디 말하였기에, 본사는 이상한 말을 한다고 직감하였으나 일부러 그대로 흘려들어 둔 일이 있다. 물론 「바」 공사로부터의 전보에 의해 알고 있었던 것으로 추찰된다.\n\n위 차관의 말투로 미루어 보건대 스웨덴 정부 측으로서는 알선의 뜻이 있는 것으로 생각되나, 동시에 영미 측으로 그대로 새어나갈 위험이 큰 것을 우려한다. 오늘 「바」 공사로부터 청취한 바에 따르면, 전적으로 스웨덴 측의 「이니셔티브」로서 탐색하게 하시려는 내의(內意)라면 그 취지를 다시 동 공사에게 내시(內示)할 필요가 있다고 인정되므로, 어떻게 할 것인지 시급히 회전 주시기 바란다.\n\n또한 말할 것도 없이 본건은 관원에게도 일체 알리지 않으며, 전보도 본사가 짜고 귀전(貴電)의 해독도 본사가 스스로 할 것이다.", "secondary": "951昭和20年5月10日東鄕外務大臣宛（電報）在スウエーデン岡本公使よりスウェーデン政府による和平幹旋の意向に関\n\nしバッゲ公使への回答振りにつき請訓\n\nストックホルム5月10日後發\n\n本省5月11日前着\n\n第三三二號（館長符號、緊急、極祕、必親展）\n\n「バツゲ」公使歸朝セル旨ヲ以テ本十日本使ヲ來訪出發前（編注）\n\n昌谷公使ヲ通セラレタル件ニ付本使ニ内話シ東京ヨリ電報アリタルヤト導ネタルニ付本使ハ何等電報ニ接シ居ラスト答ヘタル處貴大臣ノ御内意承知致度ト述ヘタリ\n\n右ニテ思當ルハ四月十七日外務次官ト會談ノ際次官ハ日本トシテハ更ニ重大ナル問題ヲ控ヘ居ラルル次第ニ付此ノ際米國英國ノ好マサル海軍武官室ノ增强ノ如キ小問題ヲ固執セラレサルコト然ルヘシト一言述ヘタルニ付本使ハ不思議ナルコトヲ言フト直感シタルモ態ト其ノ儘聞流シ置キタルコトアリ勿論「バ」公使ヨリノ電報ニ依リ承知シ居リタルモノト推察セラル\n\n右次官ノ口吻ヨリ察スルニ瑞典政府側トシテハ幹旋ノ意有ルモノト思ハルルモ同時ニ英米側ニ筒拔ケトナル危險大ナルモノアルヲ憂慮ス本日「バ」公使ヨリ聽取リタル所ニ依レハ全然瑞典側ノ「イニシヤチブ」トシテ探ラシムル御内意ナラハ其ノ旨更ニ同公使ニ内示スルヲ要スト認ムルニ付何分ノ儀至急御囘電アリタシ\n\n尙申ス迄モ無ク本件ハ館員ニモ一切知ラシメス電報モ本使組ミ貴電ノ解讀モ本使自ラ爲スヘシ\n\n編注在本邦バッゲスウエーデン公使は東京出立前に、スウエーデン政府を介した和平交涉に関し、重光外相、昌谷忠前フインランド公使等と協議を行っていた。", "notes": ["〔編注〕 재일본 바게 스웨덴 공사는 도쿄 출발 전에 스웨덴 정부를 통한 화평 교섭에 관하여 시게미쓰 외상, 쇼야 다다시(昌谷忠) 전 핀란드 공사 등과 협의를 행하고 있었다."], "warn": false, "pages": [1699, 1700], "search": "スウェーデン政府による和平幹旋の意向に関しバッゲ公使への回答振りにつき請訓 岡本季正 오카모토 스에마사(주스웨덴 공사, 발신자) 東鄕茂德 도고 시게노리(외무대신, 수신자) バッゲ 바게(주일 스웨덴 공사) 昌谷忠 쇼야 다다시(전 주핀란드 공사) 重光葵 시게미쓰 마모루(전임 외상, 編注)"}, {"id": "d952", "order": 952, "date": "1945-05-17", "group": "A", "eyebrow": "문서 952 · 二 中立国を通じた和平打診", "title": "스웨덴 외무성 및 바게의 주의 환기를 근거로 오노데라 육군무관의 화평 공작 중지 조치를 요청", "badge": "第三五○號（極祕、館長符號、緊急、必親展）", "list_right": "문서 952", "meta": [{"k": "일자", "v": "1945-05-17", "txt": false}, {"k": "발신", "v": "在スウエーデン岡本公使 주스웨덴 오카모토 스에마사(岡本季正) 공사", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 시게노리(東鄕茂德) 외무대신", "txt": true}, {"k": "발착", "v": "ストックホルム5月17日後發 / 本省5月18日前着", "txt": false}, {"k": "장소", "v": "ストックホルム 스톡홀름", "txt": false}, {"k": "전보번호", "v": "第三五○號（極祕、館長符號、緊急、必親展）", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "오노데라 육군무관이 「에릭손」을 중개인으로 스웨덴 왕제(王弟) 칼 전하 쪽에 화평 접촉을 시도한 사실을 바게 공사가 알려오자, 이중외교를 막기 위해 육군 중앙의 금지 조치를 시급히 요청한 전보.", "points": ["5월 16일 바게 공사가 내방해 내밀히 전한 이야기: 그저께 스웨덴 외무성에서 들으니 오노데라(小野寺) 소장이 최근 「에릭손(エリクソン)」이라는 자(영미의 「블랙리스트」에 올라 있는 실업가라 한다)를 「コンベイトマン」으로 삼아, 일본 육해군을 너무 상처 입히지 않는 방법으로 화평의 길이 없겠는가라는 취지로 연락을 기도하고 있다.", "「에」는 스웨덴 국왕의 동생 「칼(カール)」 전하에게 이를 통했고, 전하는 측근을 외무성에 보내 전하게 했다. 외무성은 「그런 옆길로부터의 책동은 상대할 수 없다」며 즉각 일축.", "스웨덴 외무성의 평: 이런 중요 문제에 일개 육군무관이 책동하는 것은 불가해할 뿐 아니라 방법도 졸렬하며, 계속되면 본줄기 교섭의 방해가 되고 극히 위험하다. 이미 에릭손뿐 아니라 전하와 측근이 사실을 알고 있어 언제 새어나갈지 모른다.", "바게는 본국으로부터 전보가 없는지 재차 물었고, 아무튼 시급히 도고 외상의 내의를 알고 싶으니 잠시 기다리겠다고 말했다.", "공사가 시험 삼아 영미 측과 회담했는지 묻자, 바게는 미국 공사만 만나 자신이 본 사실을 객관적으로 말한 데 지나지 않으며, 전후 10년 일본에 재근한 일본의 친구로서 도움이 되고 싶고 만사 최선의 주의로 행동하고 있으니 안심하라고 답했다.", "공사의 요청: 오노데라 무관의 건은 육군 중앙의 명에 의한 것이든 아니든 이런 옆길로부터의 행동을 금지하도록 중앙에서 은밀하고 정확하게 시급히 조치해 달라. 이중외교는 결단코 불가하며 외무성이 단단히 대응해야 한다고 통감한다.", "5월 10일자 전보(왕전 제332호)에 대한 회전도 시급히 요청."], "primary": "왕전 제332호에 관하여\n\n一、16일 「바게(バツゲ)」 공사가 본사(本使)를 내방하여 다음과 같이 내밀히 이야기하였다.\n\n그저께 외무성에서 들은 바에 따르면, 오노데라(小野寺) 소장이 최근 당지에서 「에릭손(エリクソン)」이라는 자(영미의 「블랙리스트」에 올라 있는 실업가라 한다)를 「コンベイトマン」으로 삼아, 일본의 육해군을 너무 상처 입히지 않는 방법으로 화평의 길이 없겠는가 하는 취지로 연락을 기도하고 있으며, 「에」는 당국 국왕의 동생이신 「칼(カール)」 전하에게 이를 통하였으므로 동 전하는 그 측근자를 외무성에 보내시어 이를 전하게 하셨다. 외무성은 물론 전혀 이를 문제 삼지 않고, 그러한 옆길로부터의 책동은 상대할 수 없다 하여 곧바로 일축하였으나, 외무성에서는 이와 같은 중요 문제에 관하여 일개 육군무관이 책동하는 것은 불가해할 뿐 아니라 그 방법도 졸렬하여 이를 계속하게 할 때에는 본줄기 교섭의 방해가 되고 또한 극히 위험하다고 말하고 있다. 이미 「에」뿐 아니라 전하 및 그 측근자는 사실을 알고 있어 어떤 계기로 새어나가지 않는다고도 할 수 없다. 자신은 간절히 일본을 위함을 생각하여 주의를 드리는 바이다.\n\n二、다음으로 「바」 공사는 아직 본국으로부터 전보가 없는가 물었기에 본사는 아무런 전보도 없다고 답한바, 아무튼 시급히 도고 외상의 내의(內意)를 알고 싶으니 잠시 기다리기로 하겠다고 말하였다.\n\n본사가 시험 삼아 「바」 공사에게 당지에서 영미 측과 회담하셨는가 물은바, 미국 공사만은 면회하였으나 자신이 본 사실을 객관적으로 말한 데 지나지 않는다, 자신으로서는 전후 10년 일본에 재근하여 일본의 친구로서 도움이 되고 싶다고 생각하고 있는 터이며 만사 최선의 주의를 가지고 행동하고 있으니 그 점은 안심하셔도 좋다고 답하였다.\n\n三、그러므로 앞서 말한 오노데라 무관의 건은 육군 중앙의 명에 의한 것이든 아니든, 이와 같은 옆길로부터의 행동을 금지하도록 시급히 중앙에서 은밀히 그리고 정확히 조치해 주시기 바란다. 이때 이중외교는 결단코 불가하며, 외무성으로서는 상당히 단단히 대응할(원문 「餘程瞠リスル」) 필요가 있다고 통감한다. 또한 5월 10일자 졸전(拙電)에 대해서는 어떻게 할 것인지 시급히 회전 주시기 바란다.", "secondary": "952昭和20年5月1g日東鄕外務大臣宛（電報）在スウエーデン岡本公使よりスウェーデン外務省及びバッゲの注意喚起をふまえ小野寺陸軍武官による和平工作中止措置方要請について\n\nストックホルム5月1g日後發\n\n本省5月18日前着\n\n第三五○號（極祕、館長符號、緊急、必親展）\n\n往電第三三二號ニ關シ\n\n一、十六日「バツゲ」公使本使ヲ來訪左ノ通リ内話セリ一昨日外務省ニ於テ聞ク所ニ依レハ小野寺少將最近當地ニ於テ「エリクソン」ナル者（英米ノ「ブラツクリスト」？\n\nニ乘リ居ル實業家ナル由）ヲ「コンベイトマン」トシテ日本ノ陸海軍ヲ餘リ傷付ケサル方決ニ於テ和平ノ途ナキヤトノ趣旨ニテ連絡ヲ企圖シ居リ「エ」ハ當國國干ノ弟君ナル「カール」殿下ニ之ヲ通シタルヲ以テ同殿下ハ其ノ側近者ヲ外務省ニ道ハシ之ヲ傳ヘシメラレタリ外務省ハ勿論全然之ヲ問題トセス斯カル檔合ヨリノ策動ハ取合フヘカラストテ直ニ一蹴シタルカ外務省ニ於テハ斯クノ如キ重要問題ニ付テ一陸軍武官カ策動スルハ不可解ナルノミナラス其ノ道方モ拙劣ニシテ之ヲ繼續セシムルトキハ本筋ノ交涉ノ邪魔ニナリ且極メテ危險ナリト申シ居レリ旣ニ「エ」ノミナラス殿下及其ノ側近者ハ事實ヲ知リ居リ何等ノハスミニテ洩ルルトモ限ラス自分ハ切ニ日本ノ爲ヲ思ヒ御注意スル次第ナリ\n\n二、次ニ「バ」公使ハ未タ本國ヨリ電報ナキヤト導ネタルニ付本使ハ何等電報ナシト答ヘタル處兒ニ角至急東鄕外相ノ御内意ヲ知リ度暫ク俟ツコトト致スヘシト述ヘタリ本使ヨリ試ミニ「バ」公使ニ對シ當地ニテ英米側ト會談セラレタリヤト質シタル處米國公使ノミニハ面會セルカ自分ノ觀タル事實ヲ客觀的ニ述ヘタルニ過キス自分トシテハ前後十年日本ニ在勤シ日本ノ友人トシテ御役ニ立チ度シト存シ居ル次第ニシテ萬事最善ノ注意ヲ以テ行動シ居ルニ依リ其ノ點ハ御安心アリテ然ルヘシト答ヘタリ\n\n三、就テハ前記小野寺武官ノ件ハ陸軍中央ノ命ニ依ルモノナルト否トニ拘ラス斯クノ如キ檔合ヨリノ行動禁止方至急中央ニ於テ内密且的確ニ御措置アリ度、此ノ際二重外交ハ斷シテ不可ニシテ外務省トシテハ餘程瞠リスルヲ要スト痛感ス將又五月十日附拙電ニ對シテハ何分ノ儀至急御囘電アリタシ", "notes": [], "warn": true, "pages": [1700, 1701], "search": "スウェーデン外務省及びバッゲの注意喚起をふまえ小野寺陸軍武官による和平工作中止措置方要請について 岡本季正 오카모토 스에마사(주스웨덴 공사, 발신자) 東鄕茂德 도고 시게노리(외무대신, 수신자) バッゲ 바게(주일 스웨덴 공사) 小野寺信 오노데라(주스웨덴 육군무관, 소장) エリクソン 에릭손(스웨덴 실업가) カール 칼 전하(스웨덴 국왕의 동생)"}, {"id": "d953", "order": 953, "date": "1945-05-18", "group": "B", "eyebrow": "문서 953 · 二 中立国を通じた和平打診", "title": "바게 공작에 관하여 잠시 대기하도록 지시", "badge": "第一二○號（館長符號、嚴祕）", "list_right": "문서 953", "meta": [{"k": "일자", "v": "1945-05-18", "txt": false}, {"k": "발신", "v": "東鄕外務大臣 도고 시게노리(東鄕茂德) 외무대신", "txt": true}, {"k": "수신", "v": "在スウエーデン岡本公使 주스웨덴 오카모토 스에마사(岡本季正) 공사", "txt": true}, {"k": "발착", "v": "本省5月18日發", "txt": false}, {"k": "장소", "v": "本省 본성(도쿄)", "txt": false}, {"k": "전보번호", "v": "第一二○號（館長符號、嚴祕）", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "바게 공사를 통한 화평 타진에 대해 도쿄가 처음으로 되받은 회전으로, 전 내각 시대의 경위를 조사할 필요가 있어 시일이 걸린다며 대기를 지시한 전보.", "points": ["귀전 제332호(5월 10일, 바게 공사 응대 방식에 대한 청훈)에 대한 회답.", "전 내각(고이소 내각·시게미쓰 외상) 시대의 일을 조사할 필요가 있어 다소 시일을 요한다.", "그 점을 양지해 두라는 취지다. 즉 당분간 회답을 보류하고 대기하라는 지시다."], "primary": "귀전 제332호에 관하여\n\n전 내각 시대의 일을 조사할 필요도 있어 다소 시일을 요하므로, 이를 양지해 두시기 바란다.", "secondary": "953昭和20年5月18日在スウエーデン岡本公東鄕外務大臣より使宛（電報）バッゲ工作につき暫時待機方指示について\n\n本省5月18日發\n\n第一二○號（館長符號、嚴祕）貴電第三三二號ニ關シ\n\n前内閣時代ノコトヲ取調フル必要モアリテ稍々時日ヲ要スルニ付右ニ御承知置アリ度", "notes": [], "warn": false, "pages": [1701], "search": "バッゲ工作につき暫時待機方指示について 東鄕茂德 도고 시게노리(외무대신, 발신자) 岡本季正 오카모토 스에마사(주스웨덴 공사, 수신자)"}, {"id": "d954", "order": 954, "date": "1945-06-03", "group": "A", "eyebrow": "문서 954 · 二 中立国を通じた和平打診", "title": "바티칸 사교(司敎)로부터 미국 측과의 접촉에 관한 제안", "badge": "第五三號（館長符號、絕對極祕）", "list_right": "문서 954", "meta": [{"k": "일자", "v": "1945-06-03", "txt": false}, {"k": "발신", "v": "在バチカン原田公使 주바티칸 하라다 겐(原田健) 공사", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 시게노리(東鄕茂德) 외무대신", "txt": true}, {"k": "발착", "v": "バチカン6月3日前發 / 本省6月5日前着", "txt": false}, {"k": "장소", "v": "バチカン 바티칸", "txt": false}, {"k": "전보번호", "v": "第五三號（館長符號、絕對極祕）", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "국무성 소속 부아뇨치 사교가 로마 체재 미국인의 화평 접촉 희망을 전해 왔으나, 상대의 정체와 목적이 불분명하고 조건도 황당무계하다 하여 하라다 공사가 사실상 거절한 경위를 보고한 전보.", "points": ["5월 27일 전 주미 법왕사절관 참사관으로 현재 국무성에 있는 「부아뇨치(ブアニヨツチ)」 사교가 당관 촉탁 도미자와(富澤) 사제를 찾아와, 수개월래 로마에 있는 한 미국인이 화평 문제로 일본 측과 접촉하고 싶어 하니 다리를 놓아 달라고 신청했다.", "상대의 신분·성명은 밝힐 수 없으나 부친이 사회적으로 상당히 유력한 인사이고, 본인은 가톨릭 교도로 진지한 인물이나 공적 지위는 없다. 다만 현 교섭 단계가 되면 공적 인물을 내세울 용의가 있다고 했다.", "제안 사유: 유럽 전쟁은 끝났으나 소련의 태도에 따라 정국이 더욱 악화될 징후가 있고, 극동에서는 소련이 전쟁 최후 단계에 참전해 만주를 손에 넣고 중국 공산정부를 사주해 지반을 확보하려 할 것으로 헤아려진다. 미국 측도 앞으로 다대한 희생을 요할 것이며 일본 측에는 이미 전승의 가망이 없다.", "미국 측 휴전 조건으로 당장 촌탁할 수 있는 것: 점령지의 반환, 육해군의 무장 해제, **조선의 점령** 등이며, 국체(國体) 문제에는 저촉하지 않고 일본 본토의 점령도 고려하지 않는 것으로 생각된다.", "다만 본건은 대소(對蘇) 관계상 극히 기미(機微)하므로 주의를 요한다는 첨언이 있었다.", "하라다 공사의 판단: 조건 내용의 황당무계함은 접어두더라도 인물의 정체를 「부」가 절대 명언하지 않고 목적에도 의심스러운 절(節)이 있어 한동안 방치했다.", "「부」가 회답을 독촉해 오자, 도미자와를 통해 ①이때 일본 측에 화평 촉진의 의향은 없다고 믿는다 ②공적 입장에 있는 자가 정체 모를 인물과 이런 문제를 논할 수 없다 ③다만 상대가 공적 배경을 가진 것이 확인되고 미국 측이 일본 측에 전달할 희망이 있다면 고려할 수 있다 ④그러나 그것이 이른바 무조건 항복의 「憑從」(추종)에 지나지 않는다면 딱 질색이라는 취지로 간단히 회답하게 해 두었다.", "전보 말미에 「우선 이대로(6월 2일 기초)」."], "primary": "一、27일, 전 주미 법왕사절관(法王使節館) 참사관으로서 현재 국무성에 있는 「부아뇨치(ブアニヨツチ)」 사교(司敎)가 당관 촉탁 도미자와(富澤) 사제를 내방하여, 실은 수개월래 로마에 있는 한 미국인으로부터 화평 문제에 관하여 일본 측과 접촉하고 싶으니 다리를 놓아 달라는 의뢰가 있었다는 신청을 하였다. 상대의 신분·성명 등은 말씀드릴 수 없으나 그 부친은 사회적으로 상당히 유력한 인사(人士)이며, 본인은 가톨릭(加特力) 교도로서 진지한 인물이나 공적 지위를 가진 자는 아니다. 다만(尤モ) 상대는 현 교섭의 단계가 되면 공적 인간으로 하여금 이에 임하게 할 용의가 있다는 취지를 말하고 있었다고 하였다. 그리고 본건 신청의 사유로서는, 유럽 전쟁이 종결되었으나 그 후의 소련의 태도에 따라 정국이 더욱더 악화될 징후가 있고, 돌이켜 극동에서는 소련이 아마도 전쟁의 최후 단계에 참전하여 만주를 손에 넣고 중국 공산정부를 사주하여 그 지반을 확보하려 할 것으로 헤아려지며, 다른 한편 종래의 전적(戰績)을 돌아보더라도 미국 측에서 앞으로 반드시 다대한 희생을 요할 것이고 또 일본 측으로서는 이미 전승의 가망이 없다고 단정할 수 있다는 데 있다고 하였다. 또 미국 측 휴전 조건으로서 당장 촌탁(忖度)할 수 있는 것은 점령지의 반환, 육해군의 무장 해제, 조선의 점령 등이며, 국체(國体) 문제에는 저촉하지 않고 또 일본 본토의 점령은 고려하고 있지 않다고 생각된다고 하고 있었다고 설명하며, 다만 본건은 대소(對蘇) 관계상 극히 기미(機微)하므로 이 점 주의를 요한다고 덧붙였다는 것이다.\n\n二、그러나 조건 내용이 황당무계함은 잠시 접어두고, 본건 인물이 과연 무엇인지에 대하여 「부」는 절대로 명언하지 않을 뿐 아니라 그 목적이 어디에 있는지에 관해서도 여러 가지 의심스러운 절(節)이 있다. 따라서 본사(本使)로서는 잠시 이를 그대로 방치해 두었던바, 「부」로부터 어떠한 회답이든 달라고 독촉해 왔다는 것이므로, 도미자와로 하여금 「부」에 대하여, 이때 일본 측에 화평 촉진의 의향은 없다고 믿는다, 더구나 공적 입장에 있는 자가 무엇인지 알 수 없는 인물과 이러한 문제를 운운할 수 없음은 말할 나위도 없다, 다만(尤モ) 상대가 말하는 대로 공적 배경을 가진 것이 확인되고 미국 측으로서 무언가 일본 측에 전달할 희망이 있다면 이를 고려할 수 있을 것이다, 그러나(但シ) 만약 그것이 이른바 무조건 항복의 「憑從」（從憑カ）에 지나지 않는 것이라면 딱 질색이다(眞平ナリ)라는 취지로 간단히 회답하게 해 두었다. 위 우선 이대로(6월 2일 기초).", "secondary": "9549昭和20年6月3日東鄕外務大臣宛（電報）在バチカン原田公使よりバチカン司敎より米国側との接觸につき提案\n\nについて\n\nバチカン6月3日前發\n\n本省6月5日前着\n\n第五三號（館長符號、絕對極祕）\n\n一、二十七日前駐米決干使卽館參事官ニシテ目下國務省ニ在ル「ブアニヨツチ」司敎ハ當館囑託富澤司祭ヲ來訪ノ上實ハ數ケ月來羅馬ニ在ル一米人ヨリ和平問題ニ關シ日本側ト接觸シタキニ付橋渡シヲ依賴シタシトノ申出アリ先方ノ身分氏名等ハ申上ケ得サルカ其ノ父親ハ社會的ニ相當有力ナル人十ナリ本人ハ加特力敎徒ニシテ眞面目ナル人物ナルカ公ノ地位ヲ有スルモノニ非ス犬モ先方ハ懸交涉ノ段取リトナラハ公ノ人間ヲ以テ之ニ當ラシムル用意アル旨述ヘ居タリト爲シ本件申出ノ事由トシテハ歐洲戰爭終結セルモ其ノ後ノ蘇聯ノ態度ニ依リ政局益々惡化ノ徵アリ翻テ極東ニ於テハ蘇聯ハ恐ラク戰爭ノ最後ノ段階ニ參戰シ滿洲ヲ手中ニ入レ中國共産政府ヲ使嗾シテ其ノ地盤ヲ確保セントスヘシト察セラレ他方從來ノ戰績ヲ顧ミルモ米側ニ於テ今後必スヤ多大ノ犧牲ヲ要スヘク又日本側ニ取リテハ旣ニ戰勝ノ見込無シト斷シ得ヘシト爲スニアリ又米側休戰條件トシテ差當リ忖度シ得ルモノハ占領地ノ還附、陸海軍ノ武裝解除、朝鮮ノ占領等ニシテ國体問題ニハ觸レス又日本本土ノ占領ヲ考慮シ居ラスト思考セラルルト爲シ居タリト說明シ唯本件ハ對蘇關係上極メテ機微ナルヲ以テ此ノ點注意ノ要アリト附言シタル趣ナリ\n\n二、然ルニ條件内容ノ荒唐無稽ナルハ暫ク擱キ本件人物カ果シテ何者ナリヤ「ブ」ハ絕對ニ明言セサルノミナラス其ノ目的カ奈邊ニ在ルヤニ關シテモ種々疑ハシキ卽アリ依テ本使トシテハ暫ク之ヲ其ノ儘ニ放置シ置キタル處「ブ」ヨリ何分ノ囘答方督促シ來タリタル趣ナリシヲ以テ富澤ヲシテ「ブ」ニ對シ此ノ際日本側ニ和平促進ノ意響無シト信ス而モ公ノ立場ニ在ルモノカ何者ナルカ判ラサル人物ト斯ル問題ヲ云々シ得サルハ言フヲ俟タス犬モ先方ノ言フ如ク公ノ背景ヲ有スルコト確認セラレ米側トシテ何等日本側ニ傳達ノ希望アルニ於テハ右ヲ考慮シ得ヘシ伯（從憑カ）\n\nシ若シ右カ所謂無條件降伏ノ憑從ニ過キサルモノナラハ眞平ナリトノ趣旨ヲ以テ簡單ニ囘答セシメ置キタリ右不取敢（六月二日起草）", "notes": ["（從憑カ） — 원문 「憑從」에 대해 편자가 「從憑」의 오기인가를 표시한 것. 그대로 두었다."], "warn": false, "pages": [1701, 1702], "search": "バチカン司敎より米国側との接觸につき提案について 原田健 하라다 겐(주바티칸 공사, 발신자) 東鄕茂德 도고 시게노리(외무대신, 수신자) ブアニヨッチ 부아뇨치(사교, 전 주미 법왕사절관 참사관, 국무성 소속) 富澤 도미자와(주바티칸 공사관 촉탁 사제)"}, {"id": "d955", "order": 955, "date": "1945-06-11", "group": "A", "eyebrow": "문서 955 · 二 中立国を通じた和平打診", "title": "대일 화평의 가능성 등에 관한 미국 측의 관측에 관하여", "badge": "第三六號", "list_right": "문서 955", "meta": [{"k": "일자", "v": "1945-06-11", "txt": false}, {"k": "발신", "v": "在チューリッヒ神田總領事 주취리히 간다(神田) 총영사", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 시게노리(東鄕茂德) 외무대신", "txt": true}, {"k": "발착", "v": "チューリッヒ6月11日後6時45分發 / 本省6月14日後3時00分着", "txt": false}, {"k": "장소", "v": "チューリッヒ 취리히", "txt": false}, {"k": "전보번호", "v": "第三六號", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "유럽전 종결 후 미국의 대일 병력 집중·폭격 계획과, 일본 화평설을 둘러싼 영미의 선전, 트루먼의 무조건 항복 연설, 소련의 만주·조선 야심에 대한 미국의 경계를 종합 보고한 전보.", "points": ["미국 측 발표: 유럽전 종료로 불요해진 무기·병원의 극동 대량 수송이 착착 실시 중. 독일 포위군 총병력 1,500만~1,300만에 비해 기껏 65만이던 대일 제1선 공격 병력이 비약적으로 증강될 전망.", "일본 측 병력 평가: 400만, 추가 400만 동원 여력, 항공기 월산 1,500기로 「반드시 얕보기 어려운 실력」. 이에 대해 미국은 육군 일부를 복원(復員)하면서도 1년 내 700만 소집 계획, 연합군 합계로 대독 병력을 능가해 1,000만 이상이 될 예정이라는 보도.", "공습: 대독과 같은 작전이되 거리 관계로 초노급 대형 폭격기를 제작, 마리아나에서 8톤·오키나와에서 10톤을 적재하고 하루 1,200기 비율로 연속 폭격하면 독일보다 단기간에 목적 달성 가능하다고 한다. 해군은 동원 해제 없이 전 병력 사용.", "샌프란시스코(桑港) 회의 참석자 인상: 미국은 특히 서부에서 대일전에 열의. 정부는 독일 항복으로 늦추지 않고 일본 격멸에 매진한다는 선전에 여념이 없으며, 영국도 보수·노동 양당이 거국적으로 미국을 돕고 다른 나라도 추수.", "루스벨트 사거 때 스즈키 수상 담화와 도쿄 라디오 방송이 중립국·적 측의 주의를 끌었고, 이어 영미 측은 일본 화평 타진설을 유포하며 「일본 내부가 두 파로 갈려 수상·중신·재계는 타협 화평을 희망하고, 실력파 특히 육군은 내심 화평을 원하면서 책임 회피를 위해 표면상 전쟁 수행을 주장한다」, 「일소 관계 악화로 소련 개입 전에 영미와 손을 쓰려는 의향이 우세를 점했다」는 주석을 달았다.", "동시에 「일본 국민이 그릇된 우월 관념을 버리지 않고 군부가 뉘우침 없이 도량하는 현상에서는 그러한 화평 제안에 응할 수 없다」는 의미를 선전.", "트루먼 연설: 미국은 어중간한 화평은 하지 않고 일본의 무조건 항복을 요구한다. 다만 이는 일본을 멸망시키고 노예화하려는 것이 아니라 군벌을 제거하고 가망 없는 전쟁을 끝내기 위함이며, 듣지 않으면 독일과 같은 운명을 밟을 뿐이다.", "반면 미 군부 당국과 영국 일부(예: 구 주일대사 「크레이기」)는 일본 국내에 동요 징후가 없어 자발적 항복은 기대할 수 없고 군국 정신 타파가 필요하며 전쟁은 더 장기화한다고 대내적으로 경고.", "소련이 뤼순·다롄(旅大)의 실지 회복뿐 아니라 **만주와 조선(滿鮮)**에 야심이 있다는 보도는 미국에 불안을 주었고, 소련 참전을 전쟁 종료 촉진으로 환영하는 반면 장래 분쟁 회피를 위해 대일전에는 되도록 소련을 참가시키지 말고 미영의 힘으로 마치고 싶다는 의향이 상당히 강하다고 한다."], "primary": "미국 측 발표에 따르면, 유럽전 종료에 의해 불요(不要)하게 된 무기·병원(兵員)의 극동 방면 대량 수송은 착착 실시되고 있으며, 독일 포위군 총병력 1,500만 내지 1,300만에 비해 기껏 65만을 헤아렸던 대일 제1선 공격 병력은 이제 비약적으로 증강될 것이고, 일본의 병력은 400만이며 장래 다시 400만을 동원할 여력이 있고 항공기 월산 1,500기로서 반드시 얕보기 어려운 실력을 보유하고 있으므로, 이에 대해서는 방대한 인력·물력을 총동원하여 전쟁 수행에 매진해야 한다고 한다. 그리고 미국은 육군의 일부를 복원(復員)하겠지만 1년 내에 700만의 병력을 소집할 계획으로서, 여기에 다른 연합군을 더하면 총병력은 대독 병력량을 능가할 것이라 하며, 혹은 1,000만 이상이 될 예정이라고 보도된다. 공습에 관해서는 독일에 대한 것과 같은 작전으로, 다만 거리 관계상 종래에 없던 초노급(超弩級) 대형 폭격기를 제작하여 「마리아나」 기지로부터 8톤, 오키나와로부터 10톤의 폭탄을 적재하고 하루 1,200기의 비율로 연속 폭격을 행할 때에는 독일의 경우보다 단기간에 소기의 목적을 달성할 수 있을 것이라 하고, 해군은 육군과 같이 동원 해제를 행하지 않고 전 병력을 사용한다는 등이라고 일컬어진다. 샌프란시스코(桑港) 회의 열석자의 인상에 따르면 미국은 특히 서부에서 대일전에 열의가 있다고 하며, 정부는 독일 항복으로 마음을 늦추는 일 없이 일본 격멸에 매진해야 한다는 선전에 여념이 없고, 영국은 국내의 정쟁에 관계없이 보수당·노동당 모두 거국적으로 미국을 도우며 다른 나라들도 이에 추수하여 대일전 적극화를 부르짖고 있다.\n\n또 「루스벨트」 사거에 즈음한 스즈키 수상 담화 및 도쿄 「라디오」 방송은 중립국뿐 아니라 적 측에서도 주의를 끌었는데, 이어서 영미 측은 일본의 화평 타진 소문을 유포하고, 이에 관하여 일본 내부는 두 파로 갈려 수상·중신·재계가 타협 화평을 희망하는 데 대해 실력파 특히 육군은 내심으로는 화평을 희망하면서도 책임 회피를 위해 이에 귀를 빌려주지 않고 표면상 어디까지나 전쟁 수행을 주장하고 있는바, 일반적으로 일소 관계 악화에 의해 우색(憂色)이 농후하여 소련의 개입에 앞서 영미와 손을 쓰려는 의향이 우세를 점하였다는 취지의 주석을 （ママ）가함과 동시에, 일본 국민이 그릇된 우월 관념을 버리고 군부가 아무런 뉘우침도 없이 더욱더 도량(跳梁)하는 현상에서는 그러한 화평 제안에 도저히 응할 수 없다는 의미를 선전하고 있다. 「트루먼」은 그 연설 중에서 미국은 중도 반단(中途半端)의 화평은 하지 않으며 일본의 무조건 항복을 요구한다, 다만(但シ) 위는 일본을 멸망시키고 노예화하는 것이 아니라 군벌을 제거하고 일본에게 가망 없는 전쟁을 종결시키기 위함이다, 일본이 이를 듣지 않으면 독일과 같은 운명을 밟을 뿐이라고 말하였다. 그리하여 미 태평양 연안의 대일 방송은 앞으로 위 방침에 따라 선전한다고 한다. 그런데 최근 미 군부 당국 및 영국의 일부(예컨대 구 주일대사 「크레이기(クレーギー)」)에는, 일본 국내에 동요의 징후가 없어 자발적 항복은 기대할 수 없고 전 국민에 두루 퍼진 군국 정신을 타파할 필요가 있으며 전쟁은 앞으로 더욱 장기에 걸칠 것이라 하여 대내적으로 경고하는 자가 있다고 보도된다. 소련이 뤼순·다롄(旅大)의 실지 회복을 바랄 뿐 아니라 만주와 조선(滿鮮)에 대한 야심이 있다는 보도는 미국에 불안을 준 듯하며, 소련 참전은 전쟁 종료를 촉진할 것이라 하여 환영하는 반면, 장래의 분쟁을 회피하기 위해 대일전에는 소련을 되도록 참가시키지 말고 미영의 힘으로 마치고 싶다는 의향이 상당히 강하다고 일컬어진다.", "secondary": "955昭和20年6月11日東鄕外務大臣宛（電報）在チューリッヒ神田総領事より対日和平の可能性等に関する米国側の觀測に\n\nついて\n\nチューリッヒ6月11日後6時45分發\n\n本省6月14日後3時00分着\n\n第三六號\n\n米側ノ發表ニ依レハ歐洲戰終了ニ依リ不要トナレル武器兵員ノ極東向大量輸送ハ着々實施セラレ居リ獨逸包圍軍總兵力ノ千五百萬乃至千三百萬ニ比シ精々六十五萬ヲ數ヘタル對日第一線攻擊兵力ハ今ヤ飛躍的ニ增强セラルヘク日本ノ兵力ハ四百萬ニシテ將來尙四百萬ヲ動員スル餘力アリ航空機月産一、五○○機ニシテ必ラスシモ侮リ難キ實力ヲ保有シ居リ之ニ對シテハ尨大ナル人力物力ヲ總動員シテ戰爭遂行ニ邁進スヘシトシ米ハ陸軍ノ一部ヲ復員スヘキモ一年内ニ七百萬ノ兵ヲ召集スル計畫ニシテ之ニ他ノ聯合軍ヲ加フレハ總兵力ハ對獨兵力量ヲ凌駕スヘシト云ヒ或ハ一千萬以上トナル豫定ナリト報セラル空襲ニ付テハ對獨逸同樣ノ作戰ニテ只距離ノ關係上從來ニ無キ超弩級大型爆擊機ヲ作製シ「マリアナ」基地ヨリ八噸、沖繩ヨリ一○噸ノ爆彈ヲ積載シ一日一、二○○機ノ割合ニテ連續爆擊ヲ行フ時ハ獨逸ノ場合ヨリ短期間ニ所期ノ目的ヲ達シ得ヘシト爲シ海軍ハ陸軍ノ如ク動員解除ヲ行フコトナク全兵力ヲ使用スル等ナリト稱ス桑港會議列席者ノ印象ニ依レハ米國ハ殊ニ西部ニ於テ對日戰ニ熱意アリト云ヒ政府ハ獨逸降服ニテ意ヲ緩メルコトナク日本擊滅ニ邁進スヘシトノ宣傳ニ大童ニシテ英國ハ國内ノ政爭ニ拘ハラス保守黨勞働黨トモ擧ツテ米國ヲ助ケ他モ之ニ追隨シテ對日戰積極化ヲ呼號シ居レリ\n\n又「ルーズベルト」死去ニ際スル鈴木首相談及東京「ラジオ」放送ハ中立國ノミナラス敵側ニモ注意ヲ惹キタルカ次テ英米側ハ日本ノ和平打診ノ噂ヲ流布シ之ニ關シ日本内部ハ二派ニ分レ首相、重臣、財 나 만약 일본 측 일부에 그런 생각이 있다면 겨냥이 빗나간 것이다. 화평의 성립을 가장 희망하지 않고 일본의 힘이 다한 순간에 단물을 빨려는 것이 바로 소련이라고 본다.", "소련 국내 여행에서 서방→동방으로 이동하는 열차, 특히 비행기의 수에 「임프레스」되었다는 관찰.", "중립국뿐 아니라 적십자의 취급에 관해서도 일본 측이 적극 활용하는 태도로 나오기를 바라며, 「쥐노(ジユノー)」 박사와 간담한 결과 일본을 위해서도 결코 불리하지 않다는 인상을 받았다고 말했다.", "공사의 관찰(부기): 바게는 프랑스 내 재산 정리차 파리에 왔다가 들렀다고 말했으나, 실은 스위스 정부 및 적십자 측의 의뢰를 받아 사정 설명차 스위스를 방문한 것으로 헤아려졌다."], "primary": "8일 「바게(バツゲ)」 주일 스웨덴 공사가 본사(本使)를 내방하여 요사노(與謝野)를 함께하여 간담하였는바, 그의 담화 중 참고가 될 만한 것은 다음과 같다.\n\n一、이번에 스위스 정부 당국과도 회담할 기회가 있었는데, 일본·스위스 관계가 뜻밖에 악화되어 있는 데에는 놀랐다. 자신은 당국자에 대하여 일본의 사정 등을 설명하고, 양국 관계를 악화시키는 것은 일본·스위스 양국을 위하여 아무런 이익이 없음을, 스위스와 거의 같은 입장에 있었던 스웨덴 공사로서의 경험으로부터 말해 두었다. 「고르제(ゴルジエ)」 공사가 「너버스(ナーヴアス)」해져 있는 것은 자신도 알고 있는 바이나, 일본도 중립국을 소중히 취급하시기를 일본의 친구로서 희망을 견디지 못한다. 헌병 및 경찰관의 태도 때문에 국교를 해치는 것과 같은 일은 전혀 애석하다고 할 것이다.\n\n二、일본의 화평설이 여러 가지로 유포되고 있는바, 미국인이 무조건 항복을 부르짖고 있는 동안은 문제가 되지 않을 것이며, 하물며 황실에까지 누(累)를 미치려 한다는 언동에 이르러서는 전혀 일본을 알지 못하는 자라고 할 수밖에 없다. 또한 최근의 화평설은 일본이 소련을 통하여 영미와 이야기를 붙이려 하는 것처럼 전해지고 있는바, 자신은 이를 믿지 않으나 만약 일본 측 일부에 그러한 생각이 있다면 이는 겨냥이 빗나갔다고 할 수밖에 없다. 화평의 성립을 가장 희망하지 않고 일본의 힘이 다한 순간에 단물을 빨려는 것, 이것이 소련이라고 생각한다. 이번 소련 국내 여행에서도 서방으로부터 동방으로 이동하는 열차, 특히 비행기의 수에는 「임프레스(インプレス)」되었다.\n\n三、중립국뿐 아니라 적십자의 취급에 관해서도 일본 측이 나아가 이를 이용하는 태도로 나오시기를 희망을 견디지 못한다. 자신은 「쥐노(ジユノー)」 박사와도 간담하였는데, 그는 일본을 위해서도 결코 불리하지 않다는 인상을 받았다 운운.\n\n（덧붙여 동 공사는 프랑스 국내에 있는 재산 정리를 위하여 파리(巴里)에 날아왔다가 당국(스위스)에도 들렀다는 취지를 말하고 있었으나, 스위스 정부 및 적십자 측의 의뢰를 받아 사정 설명차 당국을 방문한 것으로 헤아려졌다.）", "secondary": "956昭和20年6月11日東鄕外務大臣宛（電報）在スイス加瀨公使より日本の対中立国政策及び和平問顯に関するバ\n\nッゲとの懇談について\n\nベルン6月11日後8時00分發\n\n本省6月14日前8時00分着\n\n第六六五號\n\n八日「バツゲ」駐日瑞典公使本使ヲ來訪與謝野ヲ交ヘ懇談シタルカ同人談話中參考トナルヘキモノ左ノ通リ\n\n一、今般瑞西政府當局トモ會談ノ機會アリタルカ日瑞關係カ意外ニ惡化シ居ルニハ驚キタリ自分ハ當局者ニ對シ日本ノ事情等ヲ說明シ兩國關係ヲ惡化セシムルコトハ日瑞兩國ノ爲ニ何等益ナキコトヲ瑞西ト略々同樣ノ立場ニアリタル瑞典公使トシテノ經驗ヨリ話シ置キタリ「ゴルジエ」公使カ「ナーヴアス」トナリ居ルコトハ自分モ承知シ居ル所ナルカ日本モ中立國ヲ大切ニ取扱ハルルコト日本ノ友人トシテ希望ニ堪エス憲兵及警察官ノ態度ノ爲國交ヲ舌スルカ如キコトハ全ク惜ムヘシ\n\n二、日本ノ和平說種々流布セラルル處米國人カ無條件降伏ヲ唱ヘ居ル内ハ問題ニナラサルヘク況ンヤ皇室ニ迄累ヲ及ホサントスルヤノ言動ニ至リテハ全ク日本ヲ知ラサルモノト言フノ外ナシ尙最近ノ和平說ハ日本カ蘇聯ヲ通シ英米ト話合ヲ付ケントスルヤニ傳ヘラルル處自分ハ之ヲ信セサルモ若シ日本側一部ニ斯ル考アラハ此カ見當外レト言フノ他ナク和平ノ成立ヲ最希望セス日本ノ力盡キタル瞬間ニ甘キ汁ヲ吸ハントスルモノ之蘇聯ナリト考フ今次蘇聯内派行ニ於テモ西方ヨリ東方ニ移動スル列車特ニ飛行機ノ數ニハ「インプレス」セラレタリ\n\n三、中立國ノミナラス赤十字ノ取扱ニ付テモ日本側カ進テ之ヲ利用スルノ態度ニ出テラレンコト希望ニ堪エス自分ハ「ジユノー」博十トモ懇談シタルカ同人ハ日本ノ爲ニモ決シテ不利ナラストノ印象ヲ受ケタリ云々\n\n（因ニ同公使ハ佛國内ニ在ル財産繫理ノ爲円里ニ飛來シ當國ニモ立寄リタル旨語リ居タルカ瑞西政府及赤十字側ノ依賴ヲ受ケ事情說明ニ當國ヲ訪問セルモノト察セラレタリ）", "notes": [], "warn": false, "pages": [1704, 1705], "search": "日本の対中立国政策及び和平問顯に関するバッゲとの懇談について 加瀨俊一 가세 슌이치(주스위스 공사, 발신자) 東鄕茂德 도고 시게노리(외무대신, 수신자) バッゲ 바게(주일 스웨덴 공사) 與謝野 요사노(주스위스 공사관원) ゴルジェ 고르제(카미유 고르제, 주일 스위스 공사) ジュノー 쥐노(마르셀 쥐노, 적십자국제위원회)"}, {"id": "d957", "order": 957, "date": "1945-06-12", "group": "A", "eyebrow": "문서 957 · 二 中立国を通じた和平打診", "title": "바티칸을 통한 접촉 제안에 대한 일본 측 회답에 대한 미국 측 반응", "badge": "第五九號（館長符號、絕對極祕）", "list_right": "문서 957", "meta": [{"k": "일자", "v": "1945-06-12", "txt": false}, {"k": "발신", "v": "在バチカン原田公使 주바티칸 하라다 겐(原田健) 공사", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 시게노리(東鄕茂德) 외무대신", "txt": true}, {"k": "발착", "v": "バチカン6月12日後發 / 本省6月14日前着", "txt": false}, {"k": "장소", "v": "バチカン 바티칸", "txt": false}, {"k": "전보번호", "v": "第五九號（館長符號、絕對極祕）", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "일본 측의 거절 회답을 받은 상대가 「어느 쪽의 이니셔티브도 없는 극비 회담을 도모하려 했을 뿐」이라고 해명하고, 무조건 항복 방침은 「어떻게든 해석할 수 있다」고 흘렸음을 보고한 전보.", "points": ["왕전 제53호(d954)에 대한 후속 보고.", "6월 8일 「부아뇨치」 사교가 다시 관원을 내방, 일본 측 회답을 그대로 상대에게 전했다고 밝히고 상대의 재답을 전달 의뢰했다.", "(一) 자신이 기도한 바는 미국 측의 공적 지위에 있는 자와 일본을 전혀 비공식·극비리에 회담시켜, 어느 쪽의 「이니셔티브」도 없이 양자의 접근을 도모하려던 것이다.", "(二) 자신으로서는 미국 측 공적 지위에 있는 자가 이때 나아가 정부의 이름으로, 혹은 정부 쪽 의향으로서 일본 정부에 무언가 전달을 희망하리라고는 생각되지 않는다.", "(三) 장래 일본 측이 미국 측에 전달할 희망이 있으면 자신은 언제든지 연락의 수고를 맡을 용의가 있다.", "또 상대는 미국 측이 주장하는 무조건 항복의 건전(建前)은 이제 와서 변경하기가 좀처럼 곤란하겠으나 「그것은 어떻게든 해석할 수 있을 것」이라고 흘리고 있었다고 한다.", "하라다 공사의 평가: 요컨대 우리 쪽 회답에 대한 상대의 변명에 지나지 않는다고 인정된다. 아무튼 참고까지."], "primary": "왕전 제53호에 관하여\n\n8일 「부아뇨치(ブアニヨツチ)」 사교가 다시 관원을 내방하여, 우리 쪽 회답은 그대로 상대에게 전해 두었는데 상대는 다시 이에 대하여 (一) 자신이 기도한 바는 미국 측의 공적 지위에 있는 자와 일본을 전혀 비공식적으로, 또한 극비리에 회담시켜 어느 쪽의 「이니셔티브」도 없이 양자의 접근을 도모하려 한 것이다, (二) 자신으로서는 미국 측의 공적 지위에 있는 자가 이때 나아가 정부의 이름으로, 혹은 정부 쪽의 의향으로서 무언가 일본 정부에 전달을 희망하는 일이 있으리라고는 생각되지 않는다, (三) 장래 일본 측으로부터 무언가 미국 측에 전달할 희망이 있으면 자신은 언제든지 연락의 수고를 맡을 용의가 있다는 취지를 우리 쪽에 전달하도록 의뢰하였다고 말하였다. 또한 상대는 미국 측이 주장하는 무조건 항복의 건전(建前)은 이제 와서 변경하는 것이 좀처럼 곤란할 것이나 그것은 어떻게든 해석할 수 있을 것이라고 흘리고 있었다고 말하고 있었다는 것인바, 위는 요컨대 우리 쪽 회답에 대한 상대의 변명에 지나지 않는다고 인정된다. 아무튼 참고까지.", "secondary": "957昭和20年6月12日東鄕外務大臣宛（電報）在バチカン原田公使よりバチカンを通じた接觸提案に対する日本側回\n\n答への米国側反応について\n\nバチカン6月12日後發\n\n本省6月14日前着\n\n第五九號（館長符號、絕對極祕）\n\n往電第五三號ニ關シ\n\n八日「ブアニヨツチ」司敎再ヒ館員ヲ來訪ノ上當方ノ囘答ハ其ノ儘先方ニ通シ置ケルカ先方ハ更ニ右ニ對シ一（一）自分ノ企圖セル所ハ米側ノ公ノ地位ニ在ル者ト日本トヲ全然非公式且極祕裡ニ會談セシメ何レノ「イニシアチブ」トモ無ク兩者ノ接近ヲ圖ラントシタルモノナリ二（一）自分トシテハ米側ノ公ノ地位ニ在ル者カ此ノ際進ンテ政府ノ名ニ於テ或ハ政府筋ノ意響トシテ何等日本政府ニ傳達ヲ希望スルコトアリトハ考ヘラレス三（一）將來日本側ヨリ何等米側ニ傳達方希望アレハ自分ハ何時ニテモ連絡ノ勞ヲ執ル用意アリトノ趣旨ヲ當方ニ傳達スル樣依賴セリト述ヘ尙先方ハ米側ノ主張スル無條件降伏ノ建前ハ今更變更スルコト仲々困難ナルヘキモ夫レハ如何樣ニモ解釋シ得ヘシト洩シ居タル由語リ居リタル趣ナルカ右ハ要スルニ當方囘答ニ對スル先方ノ辯明ニ過キスト認メラル何等御參考迄", "notes": [], "warn": false, "pages": [1705], "search": "バチカンを通じた接觸提案に対する日本側回答への米国側反応について 原田健 하라다 겐(주바티칸 공사, 발신자) 東鄕茂德 도고 시게노리(외무대신, 수신자) ブアニヨッチ 부아뇨치(사교)"}, {"id": "d958", "order": 958, "date": "1945-06-18", "group": "A", "eyebrow": "문서 958 · 二 中立国を通じた和平打診", "title": "오노데라 육군무관의 화평 공작에 관한 보고 및 대처 방책에 관한 청훈", "badge": "第四二六號（極祕、館長符號、緊急、必親展）", "list_right": "문서 958", "meta": [{"k": "일자", "v": "1945-06-18", "txt": false}, {"k": "발신", "v": "在スウエーデン岡本公使 주스웨덴 오카모토 스에마사(岡本季正) 공사", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 시게노리(東鄕茂德) 외무대신", "txt": true}, {"k": "발착", "v": "ストックホルム6月18日後發 / 本省6月19日前着", "txt": false}, {"k": "장소", "v": "ストックホルム 스톡홀름", "txt": false}, {"k": "전보번호", "v": "第四二六號（極祕、館長符號、緊急、必親展）", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "현지 신문이 폭로한 「일본 공사관의 대영미 화평 접촉」은 실은 오노데라 육군무관의 책동임을 지적하고, 육해군이 통모하여 공사관을 배제·탈취하려 한 정황을 수기 인용까지 붙여 보고하며 정부의 처리 방침을 청훈한 전보.", "points": ["왕전 제425호가 말한 「당지 일본 공사관의 영미 공사관에 대한 화평 접촉」이란 5월 17일 발전한 관장부호 전보(왕전 제350호 = d952)로 보고한 오노데라 육군무관의 책동을 가리키는 것으로 생각된다.", "오노데라는 「에릭손」(왕전 제404호 참조) 외에도 외국인과 당지 거주 일본인 한 명을 쓰고 있는 것이 아닌가 의심되는 절(節)이 있다.", "왕전 제350호에 아무런 회전이 없는바, 공사가 보기에 오노데라는 이 중요한 시기에 외무성을 앞질러 공을 세우려는 자로서 방법에 무리가 있어 이미 조금씩 마각을 드러내고 있다. 정부가 이런 육군의 책동을 어떻게 다룰지 회전을 희망.", "현지 신문의 특종 폭로(素破拔キ)에 대해서는 위와 같은 사실이 있는 한 당관이 굳이 부인 발표를 하지 않고 묵살하는 것이 좋겠다고 생각하며, 그래도 좋은지 시급한 회전 요청.", "실정 보고: 육군무관은 공명심·경쟁심이 강한 책동가로 이미 일본인 사회의 교란분자로 여겨진다. 「당관 암호가 도난당하고 있다」고 때때로 선전하는 것도 공사관을 「디스크레디트」하려는 그들 일류의 모략이라고 본다.", "간다(神田) 참사관 부부와 특히 친밀했으며, 작년 여름 오노데라가 베를린에 가 오시마(大島) 대사에게 오카모토 배척과 간다 후임 옹립을 운동했다는 소문의 진상은 가와하라(河原) 참사관에게 물어봐 달라.", "4월 16일 관장부호 전보(왕전 제252호 = d950)의 육해군 통모에 의한 공사관 탈취 음모도 가공의 상상이 아니라 대체로 사실이다.", "해군 보좌관 수기(5월 9일자) 인용: 一、오노데라 소장으로부터 (イ) 가장 중요한 시기에는 아베 중장을 해군 최고관으로(부내 한정) 받들 것, (ロ) 부내 한정으로 재스웨덴 해군무관을 「扇 대좌」로 할 것 등의 의견 개진이 있었고, 현지 출장 연락 시 아베 중장 앞으로 오노데라의 서신을 부탁받았다. 二、장래 스웨덴 소재 일본 기관의 활약 때에는 오카모토 공사를 상대로 삼지 않고 아베 중장·扇 대좌와 충분히 협의 협력할 것.", "이런 인물을 관 소속 무관으로 두는 것은 도움이 되지 않고 도리어 위험하여, 평시라면 단연 경질을 품청(稟請)할 바이라고 밝히면서도, 자신은 거조에 꺼림칙한 바가 없고 그들의 책동을 두려워하지 않는다고 덧붙였다."], "primary": "一、왕전 제425호의 「당지에서의 일본 공사관의 영미 공사관에 대한 화평 접촉」이란 말할 것도 없이, 5월 17일 발전(發電)한 관장부호 전보(왕전 제350호)로 보고한 당지에서의 오노데라(小野寺) 육군무관의 책동을 가리키는 것으로 생각된다. 동 무관은 「에릭손(エリクソン)」(그 인물에 관해서는 왕전 제404호 참조) 외에도 외국인을 사용하고, 또 당지 거주 일본인 중 한 사람도 사용하고 있는 것이 아닌가 의심되는 절(節)이 있다. 위 왕전 제350호에 관해서는 아무런 회전도 접하지 못한바, 본사(本使)가 보는 바로는 그는 이 중요한 시기에 외무성을 앞질러 공을 세우려는 자로서 그 방법에 무리가 있기 때문에 이미 조금씩 마각을 드러내고 있는 것이다. 본사로서는 정부가 이와 같은 육군의 책동을 어떻게 취급하실지 어떻게든 회전을 희망하는 바이다.\n\n二、또한 이번 당지 신문의 특종 폭로(素破拔キ)에 대해서는 앞서 말한 사실이 있는 한 당관으로부터 특별히 부인을 발표하지 않고 그대로 묵살하는 것이 좋겠다고 생각하는바, 이것으로 좋을지 시급히 회전 주시기 바란다.\n\n三、이 기회에 참고까지 당지의 실정을 기탄없이 보고하면, 육군무관은 공명심·경쟁심이 강한 책동가로서 현재 이미 일본인 사회의 교란분자로 생각된다. 종래 여러 가지 모략으로 본사 및 공사관을 「디스크레디트」하려 하였으며, 예컨대 당관 암호가 도난당하고 있다고 때때로 선전하는 것은 이 목적을 위한 그들 일류(一流)의 모략이라고 본사는 노려보고 있고, 한 번은 속았으나 두 번은 쉽게 그 수에 넘어가지 않는다. 또 간다(神田) 참사관 부부와는 특히 친밀히 서로 통하고 있었는데, 작년 여름 오노데라가 베를린에 가서 오시마(大島) 대사에게 본사를 배척하고 간다를 후임으로 삼으려 운동하였다는 소문의 진상에 관해서는 가와하라(河原) 참사관에게 물어봐 주시기 바란다. 더욱이 4월 16일 발전한 관장부호 전보(왕전 제252호)에 실린 육해군 통모(通謀)에 의한 당관 탈취 음모와 같은 것도 결코 가공의 상상이 아니라 대체로 사실이며, 그들은 여러 가지로 획책하고 있다.\n\n최근 오노데라와 통모하고 있는 해군 보좌관의 수기 중 5월 9일자 분에\n\n> 一、오노데라 소장으로부터\n> (イ) 가장 중요한 시기에는 아베(阿部) 중장을 해군의 최고관으로서 (부내 한정) 받들 것\n> (ロ) 부내 한정으로 재스웨덴 해군무관을 扇 대좌로 할 것\n> 등의 의견 개진이 있었고, 소관이 현지로 출장 연락할 때 아베 중장 앞으로 오노데라 소장의 서신을 부탁하였다.\n> 二、장래 일어날 수 있는 당국(當國) 소재 일본 기관의 활약 때에는 오카모토 공사를 상대로 삼지 않고 아베 중장·扇 대좌와 충분히 협의 협력할 것\n\n이라는 건에 관하여 상호 의견 개진이 있었다고 명료하게 기재되어 있음을, 우연히 당관 관원이 확실히 확인한 사실이 있다. 이와 같은 인물을 관 소속 무관으로 두는 것은 조금도 본사의 도움이 되지 않을 뿐 아니라 도리어 위험하므로, 평시라면 본사로부터 단연 경질(更迭)〔（更カ）— 원문 「交迭」〕을 품청(稟請)해야 할 바이다. 본사로서는 일상의 거조(擧措)에 꺼림칙한 바가 없고 또 본디 그들의 책동을 조금도 두려워하지 않으며 문제 삼고 있지도 않으나, 앞으로의 일도 있으므로 만약을 위해 말씀드린다.", "secondary": "958昭和20年6月18日東鄕外務大臣宛（電報）在スウエーデン岡本公使より小野寺陸軍武官の和平工作に関する報告及び\n\n対処方策につき請訓\n\nストックホルム6月18日後發\n\n本省6月19日前着\n\n第四二六號（極祕、館長符號、緊急、必親展）\n\n一、往電第四二五號當地ニ於ケル日本公使館ノ英米公使館ニ對スル和平接觸トハ言フ迄モナク五月十七日發電ノ館長符號電（往電第三五○號）ニテ報告ノ當地ニ於ケル小野寺陸軍武官ノ策動ヲ指スモノト思ハル、同武官ハ「エリクソン」（其ノ人物ニ付テハ往電第四○四號參昭）ノ外ニモ外人ヲ使用シ又在當地日本人ノ一ヲモ使用シ居ルニアラスヤト疑ハルル卽アリ右往電第三五○號ニ關シテハ何等ノ御囘電ニ接セサル處本使ノ見ル所ニテハ同人ハ此ノ重要時機ニ外務省ヲ出シ拔キ手柄セントスルモノニシテ其ノ道方ニ無理アル爲旣ニ少シツツ馬腦ヲ現ハシ居ルモノナリ本使トシテハ政府カ斯クノ如キ陸軍ノ策動ヲ如何ニ取扱ハルルヤ何分ノ儀御囘電ヲ希望スル次第ナリ\n\n二、尙今囘當地新聞ノ素破拔キニ對シテハ前記ノ事實アル限リ當館ヨリ特ニ打消シヲ發表セス其ノ儘默殺スルコト然ルヘシト思考スル處右ニテ官シキヤ至急御囘電アリタシ\n\n三、此ノ際御參考迄ニ當地ニ於ケル實情ヲ忌憧ナク報告スレハ陸軍武官ハ功名心競爭心强キ策動家ニシテ目下旣ニ日本人社會ノ攪亂分子ト思ハル從來種々謀略ヲ以テ本使及公使館ヲ「デイスクレジト」セントシ例ヘハ當館暗號カ盜マレ居レリト時々宣傳スルハ此ノ目的ノ爲ニスル彼等一流ノ謀略ナリト本使ハ睨ミ居リ一度ハ瞞サレタルモ二度トハ容易ニ其ノ手ニ乘ラス又神田參事官夫妻トハ特ニ親密ニ相通シ居リタルカ昨年夏小野寺カ伯林ニ赴キ大島大使ニ本使ヲ排斥シ神田ヲ後釜トセント連動セリトノ噂ノ眞相ニ付テハ河原參事官ニ御聽キ訊シアリ度シ更ニ四月十六日發電館長符號電（往電第二五二號）所載ノ陸海軍通謀ノ當館乘取ノ陰謀ノ如キモ決シテ架空ノ想像ニアラス大体事實ニシテ彼等ハ種々畫策シ居リ\n\n最近小野寺ト通謀シ居ル海軍輔佐官ノ手記中ニ五月九日ノ分ニ\n\n一、小野寺少將ヨリ\n\n(イ)最モ重要時機ニハ阿部中將ヲ海軍ノ最高官トシテ（部内限リ）仰クコト\n\n(ロ)部内限リ在瑞典海軍武官ヲ□大佐トスルコト等ヲ以テ意見開陳アリ小官現地ヘ出張連絡ノ際阿部中將宛小野寺少將書信ヲ托セリ\n\n二、將來起ルコトアルヘキ在當國日本機關ノ活躍ノ際ハ岡本公使ヲ當テトセス阿部中將□大佐ト十分協議協力スル件ニ關シ相互意見開陳アリト明瞭ニ記載シアルヲ偶然當館々員カ確實ニ確メタル事實アリ\n\n斯クノ如キ人物ヲ館附武官トシテ有スルハ何等本使ノ輔ケトナラサルノミナラス却テ危險ナルニ付平時ナラ（更カ）\n\nハ本使ヨリ斷然交迭方ヲ稟請スヘキ所ナリ本使トシテハ日常擧措疫シキ所ナク又靑ヨリ彼等ノ策動ヲ何等恐レス問題トシ居ラサル所ナルカ今後ノコトモアルニ付爲念申進ス", "notes": ["（更カ） — 원문 「交迭」에 대해 편자가 「更迭」의 오기인가를 표시한 것."], "warn": true, "pages": [1705, 1706, 1707], "search": "小野寺陸軍武官の和平工作に関する報告及び対処方策につき請訓 岡本季正 오카모토 스에마사(주스웨덴 공사, 발신자) 東鄕茂德 도고 시게노리(외무대신, 수신자) 小野寺信 오노데라(주스웨덴 육군무관, 소장) エリクソン 에릭손(스웨덴 실업가) 阿部 아베 중장(在독일 해군) 扇 오기(?) 대좌(d950에서는 「大矢大佐」로 표기) 神田 간다 참사관 大島浩 오시마 히로시(주독일 대사) 河原 가와하라 참사관"}, {"id": "d959", "order": 959, "date": "1945-06-28", "group": "A", "eyebrow": "문서 959 · 二 中立国を通じた和平打診", "title": "일미전의 전망에 관한 당지 신문기자의 관측에 관하여", "badge": "第四三號", "list_right": "문서 959", "meta": [{"k": "일자", "v": "1945-06-28", "txt": false}, {"k": "발신", "v": "在チューリッヒ神田總領事 주취리히 간다(神田) 총영사", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 시게노리(東鄕茂德) 외무대신", "txt": true}, {"k": "발착", "v": "チューリッヒ6月28日後2時5□分發 / 本省6月29日後9時50分着", "txt": false}, {"k": "장소", "v": "チューリッヒ 취리히", "txt": false}, {"k": "전보번호", "v": "第四三號", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "취리히 신문계가 스즈키 내각을 「타협 화평의 기회를 노리는 약한 성격의 정부」로 보고 일본에 승산이 없다고 관측하고 있음을 전하며, 총영사가 이에 반박하고 여론 선도에 힘쓰고 있음을 보고한 전보.", "points": ["취리히 신문기자들의 일반적 견해 종합: 교전국 정부는 일정한 정치 세력을 배경으로 서고 국내에는 반드시 반대파가 있으며, 전시 내각 교체의 원인은 반드시 전쟁 정책과 관계가 있다. 일본의 적극적 지도 세력은 육군에 있다는 전제.", "스즈키 수상의 경력과 각원의 면면으로 보아 현 내각은 「타협 화평의 기회를 노리는 약한 성격의 정부」로 해석되었다.", "루스벨트 사거 때 독일은 그를 매도해 눈살을 찌푸리게 한 반면, 도쿄 라디오는 죽은 자에게 채찍질하지 않고 조의를 표해 중립국·영미 측에 호감을 주었으나 동시에 일본에 화평의 움직임이 있다는 인상을 주었다.", "이어 영미 측에서 일본 실업가의 화평 타진설이 유포되자 위와 같은 견해에 기초해 일단 근거가 있다고 해석되었다.", "일본 측 부인과 최후까지 싸운다는 거듭된 성명은 동맹통신 뉴스에 상세한 설명이 없어 스즈키 내각의 성격과 모순된다는 인상을 주었고, 여러 억측이 붙었다. ①정부는 내심 화평 기회를 잡으려 하나 선전상 강경한 태도를 보인다 ②일본은 최대한 항전을 계속해 미국이 전쟁에 피로를 느낄 시기를 기다린다 ③정부·화평파가 다시 적극파 세력에 눌리기 시작했다.", "구미류 상식: 저항력을 잃은 부대의 항복·포로화는 수치가 아니라 당연하며, 전쟁 말기 나치 정권의 초토 전술은 전혀 무의미하다. 국민의 장래를 고려해 인적·물적 무의미한 손해를 회피하는 것이 정치가의 임무라고까지 여긴다.", "나치는 자기 생존욕에서 국민을 도련(道連)으로 끌고 들어가 불필요한 희생을 치르게 하고 밑바닥에 빠뜨렸다고 보아, 나치에 대한 통분과 증오가 커졌고 끌려간 국민도 나치와 동죄로 보는 자가 있으나 그 용감함을 칭찬하는 자는 없다.", "미국이 대독전에서 영국 이상의 경비·인명 희생을 마다하지 않은 것은 영국이 패할 경우 일·독의 위협을 느꼈기 때문이지 유럽에 대한 야심 때문이라고 보는 것은 오류다. 대일전은 직접적 위협을 느끼는 만큼 전쟁 결의가 극히 견고하고 장기화를 예상해 대비하고 있어 전쟁에 물릴 일은 없다고 본다.", "물력으로 승패를 정하려는 미국은 「필승의 신념이면 반드시 이긴다」는 정신론을 대내 선전으로 치부하고, 특공대 전술도 전국(戰局)에 미치는 효력만으로 가치 판단하며, 육해공 무력과 그 기초를 파괴하면 전쟁은 저절로 끝난다고 생각한다. 무장하지 않은 일반 국민의 저항으로 전쟁이 무승부 형태로 무한 계속되리라고는 상상하지 않는다.", "구미인의 상식·전쟁관으로는 초토 전술을 감행한 독일에서 「폴크스슈투름」이 전의를 결하고 일반 주민이 소련군은 물론 영미군에도 저항하지 않고 도처에서 문밖에 백기를 걸고 맞이했으며 「베어볼프」도 이름뿐이었던 것은 이상하지 않다. 반대로 미군의 일본 본토 상륙 시 일반 주민이 군대와 같이 죽음을 무릅쓰고 저항한다면, 포로가 되기보다 죽음을 택하는 일본 병사의 심리를 이해하기 어려운 것 이상으로 불가해하다.", "솔직히 말해 스위스인 일반은 전쟁이 장기화하더라도 결국 일본에 승산이 없다고 관측하고 있으며, 일본의 정치 지도자와 국민 마음속에는 독일의 실례와 도시 폭격의 경험에 비추어 무의미한 인적·물적 손해를 피하려는 생각이 있으리라 상상한다. 미국의 무조건 항복 요구도 독일과 달리 일본에 대해서는 반드시 고집하지 않을 수 있어 그 사이 스스로 타협 화평의 가능성이 있다고 해석하고 있다.", "총영사의 반박: 정부 교체가 곧 전쟁 정책 변경을 뜻하지 않으며, 군부가 적극적 지도 세력이라는 견해는 근본적 오류다. 전쟁 수행에 상하가 일치하고 전 국민의 전의가 극히 강렬해 반대파란 존재하지 않으며, 따라서 화평 타진의 소문은 모두 사실무근이다.", "「무조건 항복 요구는 자위상 부득이한 전쟁이라는 깊은 신념을 가진 국민의 정의감을 상하게 하고 일본을 죄인 취급하는 것이어서 분격을 부를 뿐이다」, 「전쟁의 의의를 자각하는 국민은 당초부터 생명을 버리고 나섰으므로 도시의 괴멸이나 장래의 생활 문제는 염두에 없고, 일본 국민의 괴멸을 목적으로 하지 않는다거나 독일의 전철을 밟을 것이라는 영미의 선전은 일본인의 가슴에 아무런 울림도 없다」고 설명.", "기자들의 반응: 동맹뉴스는 간단해 사정 판단이 어려우니 스위스인이 의문을 갖는 점에 상세한 「코멘트」를 붙인 보도를 입수할 수 있으면 다행이겠다.", "지난번 Neue Zürcher Zeitung 정치부장과의 회견에서도 같은 요령으로 설명했고, 그는 「힌트」를 적지 않게 얻었다며 이튿날 사설(종정 제641호 보고)에서 「국민이 일부 세력에 눌려 뜻에 반해 끌려간다」는 견해를 고쳤다. 다만 상하 일치 결속을 설하지는 않고 오히려 지나쳐, 일본의 정치 지도자가 국민의 치열한 전의 앞에 무력하다는 인상을 주는 필치여서 달갑지 않으나 앞으로도 선도에 힘쓸 생각이다."], "primary": "一、본관이 「취리히」 신문기자와 접촉하였을 때 그들이 당지 신문계 일반의 견해라고 하며 말한 바를 종합하면 다음과 같다.\n\n어느 교전국에서도 정부는 일정한 정치 세력을 배경으로 삼아 서 있고 국내에는 반드시 반대파가 존재하며, 전시 중 내각 교체의 경우 그 원인은 반드시 전쟁 정책과 관계가 있다. 일본에서의 적극적 지도 세력은 육군에 있다는 견해를 전제로 일본의 정치적 움직임을 관찰하고 있으며, 현 내각은 스즈키 수상의 경력과 각원의 면면으로 미루어 타협 화평의 기회를 노리는 약한 성격의 정부라고 해석하였다.\n\n「루스벨트」 사거 때 독일은 「루」를 매도하여 듣는 자로 하여금 눈살을 찌푸리게 한 데 반하여, 도쿄 「라디오」는 죽은 자에게 채찍질하지 않고 조의를 표하였기 때문에 중립국뿐 아니라 영미 측에도 호감을 주었는데, 동시에 일본에 화평의 움직임이 있다는 느낌을 주었다.\n\n이어서 영미 측으로부터 일본 실업가가 화평 타진을 시도하였다는 소문이 유포되자, 앞서 말한 것과 같은 견해에 기초하여 위 풍설은 일단 근거가 있다고 해석하였다.\n\n일본 측은 위 풍설을 부정하고 그 후 정부는 최후까지 싸워 낸다는 결정을 누차 성명하였으나, 동맹 「뉴스」 등에는 상세한 설명이 없기 때문에 일반적으로 위 성명은 예상하고 있는 스즈키 내각의 성격과 모순된다는 느낌을 품고 여러 가지 억측을 더하여, 어떤 자는 정부는 내심 화평의 기회를 잡으려 함에 변함이 없으나 선전을 위하여 표면상 강경한 태도를 보이고 있다고 하고, 어떤 자는 일본은 될 수 있는 대로 오래 항전을 계속하여 미국이 전쟁에 피로를 느낄 시기를 기다리려 하고 있다고 해석하며, 또 어떤 자는 정부 및 화평파가 다시 적극파의 세력에 눌리기 시작하였다고 추측하고 있다.\n\n구미류의 상식으로 보자면, 저항력을 상실한 부대가 항복하여 포로가 되는 것은 수치가 아니라 당연한 일인 것과 마찬가지로, 전쟁 말기의 「나치」 정권의 초토 전술은 전혀 무의미하다. 구미인은 전쟁에서도 국민의 장래를 고려하여 인적·물적으로 무의미한 손해를 회피하는 것이 정치가의 임무라고까지 생각하고 있으며, 「나치」 정권은 패전과 함께 몰락할 운명에 있었기 때문에 자기의 생존욕에서 국민을 길동무(道連)로 삼아 불필요한 희생을 치르게 하고 밑바닥에 빠뜨렸다고 하여, 「나치」의 무서움을 통분함과 동시에 증오심을 더하고 있고, 이에 끌려간 국민에 대해서도 「나치」와 동죄로 보는 자가 있을 뿐 그 용감함을 칭찬하는 자는 없다.\n\n미국이 대독전에서 영국 이상의 경비와 인명의 희생을 마다하지 않았던 것은 만일 영국이 패하였을 경우 일·독의 위협을 느꼈기 때문이며, 유럽에 대한 야심에 기초한 것으로 보는 것은 잘못이다. 실제로 미국은 유럽에서 그다지 큰 정치적·경제적 욕망을 가지고 있지 않다. 일본에 대해서는 독일의 경우와 달리 직접적인 위협을 느끼고 있기 때문에 그 전쟁 결의가 극히 견고하며, 대일전이 용이하지 않음을 알고 장기에 걸칠 것을 예상하여 대비를 하고 있으므로 전쟁에 물리는 일이 있으리라고는 생각되지 않는다. 물력에 의해 승패를 결정하려는 미국은 필승의 신념을 가지면 반드시 이긴다는 정신론을 대내 선전에 지나지 않는다고 하여 개의치 않으며, 특공대 전술에 대해서도 전국(戰局)에 미치는 효력만을 보아 가치 판단을 하고, 육해공의 무력 및 그 기초를 파괴함으로써 전쟁은 저절로 종결되는 것이라고 생각하고 있어, 일본 국민의 사기가 왕성하다고 하더라도 무장하지 않은 일반 국민의 저항의 결과 전쟁이 무승부의 형태로 무한히 계속되는 일이 있으리라고는 상상하고 있지 않다. 구미인의 상식 및 전쟁관으로 보자면, 초토 전술을 감행한 독일에서 장비가 조잡한 「폴크스슈투름(フオルクスシユトルム)」이 전의를 결하고 일반 주민이 소련군에 대해서는 물론 영미군에 대해서도 저항하지 않고 도처에서 문밖(戶外)에 백기를 걸고 영미군을 맞이하였으며 「베어볼프(ワエヤヴオルフ)」도 이름뿐으로 활동의 형적이 없었던 것은 이상한 일이 아니다. 이에 반하여 미군이 일본 본토 상륙을 시도할 경우 일반 주민이 군대와 마찬가지로 죽음을 돌아보지 않고 저항하는 일이 있다고 한다면, 포로가 되기보다 죽음을 택하는 일본 병사의 심리가 이해하기 곤란한 것 이상으로 불가해하다.\n\n솔직히 말하면 당국인(當國人) 일반은 전쟁이 장기에 걸친다 하더라도 결국에는 일본에 승산이 없다고 관측하고 있으며, 일본의 정치 지도자 및 국민의 마음속에는 독일의 실례와 일본 도시 폭격의 경험에 비추어 무의미한 인적·물적 손해를 피하려는 생각이 있으리라고 상상하고 있다. 다른 한편 미국은 무조건 항복을 주장하고 있으나, 독일의 경우는 「나치」 정권 자체의 괴멸을 목적으로 하였기 때문에 바로 그 「나치」 정부와의 타협 화평은 불가능하였던 데 반해 일본에 대한 태도는 이와 같지 않으며, 또 중국(지나) 문제·대소 관계 등에서 독일과는 사정을 달리하므로 반드시 위 요구를 고집한다고는 할 수 없어, 그 사이에 저절로 타협 화평의 가능성이 있다고 해석하고 있다.\n\n二、이에 대하여 본관은, 정부의 교체는 반드시 전쟁 정책의 변경을 의미하지 않으며 군부가 전쟁 정책의 적극적 지도 세력이라는 견해는 근본적 오류로서 전쟁 수행에는 상하가 일치하고 있고 특히 전 국민의 전의가 극히 강렬하여 반대파라는 것이 존재하지 않는다, 그러므로 일체의 화평 타진의 소문은 사실무근이다, 무조건 항복 요구는 자위상 부득이한 전쟁이라는 깊은 신념을 가진 국민의 정의감을 상하게 하고 일본을 죄인 취급하는 것이어서 분격을 부를 뿐이다, 전쟁의 의의를 자각하는 국민은 당초부터 생명을 버리고 나섰으므로 도시의 괴멸 기타 물질적 손해나 장래의 생활 문제 따위는 염두에 없으며, 일본 국민의 괴멸을 목적으로 하지 않는다든가 독일의 전철을 밟게 될 것이라든가 하는 영미의 선전은 일본인의 가슴에는 아무런 울림도 없다는 취지를 설명하고, 영미류의 사고방식으로 보자면 이해가 곤란한 점이 적지 않으리라 생각되나 기사·논설을 다룰 때에는 위를 사실로서 받아들여 관찰해 주기를 희망한다는 뜻을 말한바, 기자들은 동맹 「뉴스」는 간단하여 사정의 판단이 곤란하므로 당국인 등이 의문으로 삼는 점에 관하여 상세한 「코멘트」를 붙인 보도를 입수할 수 있으면 다행이겠다고 말하고 있었다.\n\n三、지난번 Neue Zurcher Zeitung 정치부장과 회견하였을 때에도 위 요령의 설명을 하였던바, 그는 「힌트」를 얻은 바가 적지 않다고 하며, 그가 집필한 이튿날(翌々日)의 사설(종정 제641호로 보고한 것)에서 국민이 일부 세력에 눌려 뜻에 반하여 끌려간다는 견해를 고쳤다. 다만 상하가 일치 결속하고 있다고 설하지는 않고, 거꾸로 지나쳐서 일본의 정치 지도자는 국민의 치열한 전의 앞에 무력하다는 인상을 주는 듯한 필치를 취한 것은 달갑지 않으나, 앞으로도 선도(善導)에 힘쓸 생각이다.", "secondary": "959昭和20年6月28日東鄕外務大臣宛（電報）在チューリッヒ神田総領事より日米戰の昇通しに関する当地新聞記者の觀測\n\nについて\n\nチューリッヒ6月28日後2時5g分發\n\n本省6月29日後9時50分着\n\n第四三號\n\n一、本官カ「チユーリツヒ」新聞記者ト接觸ノ際同人等カ當地新聞界一般ノ見解ナリトシテ語ル所ヲ綜合スルニ左ノ如シ\n\n何レノ交戰國ニ於テモ政府ハ一定ノ政治勢力ヲ背景トシテ立チ國内ニハ必ス反對派存在シ戰時中内閣更迭ノ場合其ノ原因ハ必ス戰爭政策ニ關係アリ日本ニ於ケル積極的指導勢力ハ陸軍ニアリトノ見方ヲ前提トシ日本ノ政治的動キヲ觀察シ居リ現内閣ハ鈴木首相ノ經歷ト閣員ノ顏觸ヨリ推シ安協和平ノ機會ヲ狙フ弱キ性格ノ政府ナリト解シタリ\n\n「ルーズベルト」死去ノ際獨逸ハ「ル」ヲ罵倒シ聞ク者ヲシテ顰蹙セシメタルニ反シ東京「ラチオ」ハ死人ニ鞭打タス弔意ヲ表シタル爲中立國ノミナラス英米側ニモ好感ヲ與ヘタルカ同時ニ日本ニ和平ノ動キアリトノ感ヲ與ヘタリ\n\n次テ英米側ヨリ日本實業家カ和平打診ヲ試ミタリトノ噂流布セラルルヤ前記ノ如キ見方ニ基キ右風說ハ一應根據アリト解シタリ\n\n日本側ハ右風說ヲ否定シ其ノ後政府ハ最後迄戰ヒ拔クノ決定ヲ屢屢聲明セルカ同盟「ニユース」等ニハ詳細ノ說明ナキ爲一般ニ右聲明ハ豫想シ居ル鈴木内閣ノ性格ト矛盾スルノ感ヲ抱キ種々膽測ヲ加ヘ或ル者ハ政府ハ内心和平ノ機會ヲ摑マントスルニ變リナキモ宣傳ノ爲表面上强氣ヲ示シ居レリトシ或ル者ハ日本ハ出來ル丈長ク抗戰ヲ續ケ米國カ戰爭ニ疲勞ヲ蠻ユル時期ヲ俟タントシ居レリト解シ又或ル者ハ政府及和平派ハ再ヒ積極派ノ勢力ニ押ヘラレ始メタリト推測シ居レリ\n\n歐米流ノ常識ヨリセハ抵抗力ヲ喪失セル部隊カ降伏シ捕虜トナルハ恥ニアラスシテ當然ノコトナルト同樣戰爭未期ノ「ナチ」政權ノ焦土戰術ハ全ク無意味ナリ歐米人ハ戰爭ニ於テモ國民ノ將來ヲ考慮シ人的物的ノ無意味ナル揖舌ヲ囘避スルコトハ政治家ノ任務ナリトサヘ考ヘ居リ「ナチ」政權ハ敗戰ト共ニ沒落スルノ連命ニアリタル爲自己ノ生存欲ヨリ國民ヲ道連トシ不必要ナル犧牲ヲ拂ハシメドン底ニ陷レタリトシ「ナチ」ノ恐ルヘキヲ痛憶スルト共ニ憎惡心ヲ增シ之ニ引摺ラレタル國民ニ對シテモ「ナチ」ト同罪視スル者アルモ其ノ勇敢サヲ稱讚スル者ナシ\n\n米國ハ對獨戰ニ於テ英國以上ノ經費ト人命ノ犧牲ヲ厭ハサリシハ萬一英國ノ敗レタル場合日獨ノ脅威ヲ感シタル爲ニシテ歐洲ニ對スル野心ニ基クト觀ルハ誤ニシテ現ニ米國ハ歐洲ニ於テ左程大ナル政治的經濟的欲望ヲ有シ居ラス日本ニ對シテハ獨逸ノ場合ト異ナリ直接ノ脅威ヲ感シ居ル爲其ノ戰爭決意極メテ鞏固ニシテ對日戰ノ容易ナラサルコトヲ承知シ長期ニ亘ルコトアルヲ豫想シテ構ヘヲナシ居ルヲ以テ戰爭ニ飽クコトアリトハ考ヘラレス物力ニ依リテ勝敗ヲ決セントスル米國ハ必勝ノ信念ヲ以テセハ必ス勝ツトノ精神論ハ對内宣傳ニ過キストシテ意ニ介セス特攻隊戰術ニ對シテモ戰局ニ及ホス效力ノミヲ見テ償値判斷ヲナシ陸海空ノ武力及其ノ基礎ヲ破壞スルコトニ依リ戰爭ハ自ラ終結スルモノト考ヘ居リ日本國民ノ志氣肝盛ナリトスルモ武裝セサル一般國民抵抗ノ結果戰爭カ無勝貝ノ形ニテ無限ニ繼續スルコトアリトハ想像シ居ラス歐米人ノ常識及戰爭觀ヲ以テセハ焦土戰術ヲ敢テセル獨逸ニ於テ裝備ノ粗雜ナル「フオルクスシユトルム」ハ戰意ヲ缺キ一般仕民カ蘇軍ニ對シテハ勿論英米軍ニ對シテモ抵抗セス到ル處□外ニ白旗ヲ揭ケテ英米軍ヲ迎ヘ「ワエヤヴオルフ」モ名ノミニテ活動ノ形跡無カリシハ不思議ニアラス之ニ反シ米軍カ日本本土上陸ヲ試ミル場合一般仕民カ軍隊ト同樣死ヲ顧ミス抵抗スルコトアリトセハ捕虜トナルヨリ死ヲ選フ日本兵ノ心理カ理解ニ困難ナル以上ニ不可解ナリ\n\n率直ニ言ヘハ當國人一般ニ戰爭ハ長期ニ亘ルトスルモ結 합 제501호로 훈령했다.", "그런데 귀전 제426호(d958)와 같은 사정이 있었으므로 다시 참모총장에게 주의를 주고, 이런 일이 계속되면 그 무관의 소환까지도 요구하지 않을 수 없게 될 것이라고 말했다.", "참모총장은 지난번에도 훈령해 두었으나 이번 건은 처음 듣는 일이므로 본인에게 엄중 주의하도록 즉시 훈령하겠다고 답했다.", "이상은 「귀사(貴使)에 한한 참고까지」다. 공사 본인만 알고 있으라는 취지다."], "primary": "귀전 제350호에 관하여\n\n당시 재외 공관에서의 화평 책동설을 적 측에서 유포하고 또 두전(冒頭電)이 접도(接到)한 사정이 있었으므로, 본 대신으로부터 육해군 대신, 참모총장 및 군령부 총장의 주의를 환기하여 재외 기관이 화평 공작 비슷한 행동을 하는 것이 불가한 까닭을 설명한 데 대하여, 양군 수뇌부도 같은 의견으로서 각각 재외 기관에 필요한 훈령을 발하기로 협의하고, 본 대신으로부터는 왕전 합 제501호와 같이 훈령한 바이다. 그런데 귀전 제426호와 같은 사정이 있었으므로 다시 참모총장에게 주의를 주어, 이러한 일이 계속된다면 위 무관의 소환까지도 요구하지 않을 수 없게 될 것이라는 취지를 말한바, 총장은 지난번에도 훈령해 두었으나 위는 처음 듣는 일이므로 본인에게 엄중 주의하도록 즉시 훈령하겠다고 답하였다. 위 귀사(貴使)에 한한 참고까지.", "secondary": "960昭和20年6月30日在スウエーデン岡本公使宛（電報）東鄕外務大臣より小野寺陸軍武官による和平工作等に関し東鄕\n\n外相より陸海軍側に対し注意喚起について\n\n本省6月30日後4時30分發\n\n第一五二號（館長符號、親展）\n\n貴電第三五○號ニ關シ\n\n當時出先公館ニ於ケル和平策動說ヲ敵側ニ於テ流布シ且亘頭電接到ノ次第アリタルニ依リ本大臣ヨリ陸海軍大臣、參謀總長及軍令部總長ノ注意ヲ喚起シ出先機關カ和平丁作メキタル行動ヲ爲スコトノ不可ナル所以ヲ說キタルニ對シ兩軍首膽部モ同意見ニシテ夫々出先機關ニ必要ナル訓令ヲ發スルコトニ打合セ本大臣ヨリハ往電合第五○一號ノ通訓令シタル次第ナリ然ルニ貴電第四二六號ノ次第アリタルヲ以テ更ニ參謀總長ニ注意シ斯カルコトカ續行セラルルニ於テハ右武官ノ召喚ヲモ求メサルヲ得サルニ至ルヘキ旨述ヘタル處總長ハ過般モ訓令シ置キタル次第ナルカ右ハ初耳ナルニ依リ本人ニ嚴重注意方早速訓令スヘキ旨答ヘタリ右貴使限リノ含ミ迄", "notes": [], "warn": false, "pages": [1710], "search": "小野寺陸軍武官による和平工作等に関し東鄕外相より陸海軍側に対し注意喚起について 東鄕茂德 도고 시게노리(외무대신, 발신자) 岡本季正 오카모토 스에마사(주스웨덴 공사, 수신자) 小野寺信 오노데라(주스웨덴 육군무관, 본문의 「右武官」)"}, {"id": "d961", "order": 961, "date": "1945-07-09", "group": "A", "eyebrow": "문서 961 · 二 中立国を通じた和平打診", "title": "아사히신문 주재원의 시국 정세 보고 및 화평 교섭 개시 건의에 관하여", "badge": "第七五九號（館長符號扱）", "list_right": "문서 961", "meta": [{"k": "일자", "v": "1945-07-09", "txt": false}, {"k": "발신", "v": "在スイス加瀨公使 주스위스 가세 슌이치(加瀨俊一) 공사", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 시게노리(東鄕茂德) 외무대신", "txt": true}, {"k": "발착", "v": "ベルン7月9日後2時43分發 / 本省7月11日前8時00分着", "txt": false}, {"k": "장소", "v": "ベルン 베른", "txt": false}, {"k": "전보번호", "v": "第七五九號（館長符號扱）", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "베른의 가세 공사가, 아사히신문 유럽 주재원 가사 신타로(笠信太郞)가 오가타 내각고문 앞으로 낸 정세 판단을 전문 그대로 전송한 전보. 소련은 대일 참전 또는 최후통첩으로 동아의 지반을 확보하려 하고 미·영은 그 이전에 강화를 서두르고 있으니, 3국 회담 이전과 본토 상륙전 개시 이전이 마지막 두 시기이며 스위스에서 교섭을 시작해야 한다는 결론이다.", "points": ["소련은 1944년 여름 이래 영미의 대소 태도 변화를 간파하고 대일 참전의 권리를 확보하려 하고 있으며, 그 최대 목표는 전후 동아에서 영미에 대항할 지반을 만드는 데 있다.", "중립조약 불연기 통고의 이유서는 그대로 대일 단교 내지 선전(宣戰)의 이유가 될 수 있는 성질의 것이다.", "선전 포고에 앞서 가라후토·만주·조선 등에 관한 최후통첩적 요구를 소련이 제출해 올 가능성이 충분하다. 조선이 소련의 요구 항목으로 직접 거명된 대목이다.", "미국은 샌프란시스코 회의에서 소련의 동아 진출 의도가 이미 어찌할 수 없음을 알았고, 본토 상륙 시 관동군의 내지 이송을 막기 위해 소련의 만주 견제가 필요해져 종래의 일방적 혐오만으로는 버틸 수 없게 되었다.", "미국의 「무조건 항복」은 본디 「부르는 값(言ヒ値)」에 지나지 않고 에누리를 준비하고 있는 것이라고 추정하여 그르침이 없다. 트루먼이 최근 대일 발언에서 「무조건」이라는 문자를 쓰지 않은 점을 근거로 든다.", "화평의 시기는 두 번뿐이다. 제1은 다가올 3국 회담(포츠담)까지, 제2는 본토 상륙전 개시까지이며, 이를 넘기면 최후의 기회는 영구히 사라진다.", "독일은 「단순한 패배가 아니라 지나치게 패배한 것」이며, 국가적 감시하에 들어가면 50년 뒤 재기의 기본 조건마저 잃는다는 것이 대일 교훈으로 제시된다.", "구체적 방책은 삼가되 교섭은 비밀과 신속을 요하므로 스위스에서 교섭을 개시하는 것이 극히 적당하다고 건의하고, 교섭 중 소만 국경에서 불의의 사태가 나지 않도록 각별한 경계를 요청한다.", "대내 지도로서 전 언론기관을 동원하여 화평에 대한 오해에서 생길 사태에 미리 대비할 것을 요망한다.", "편자 주에 「오가타 다케토라 내각고문에게는 배포하지 않음」이라는 기입이 있었다고 되어 있어, 정작 수신인으로 지목된 인물에게 전달되지 않았음을 보여준다."], "primary": "〔編注〕 오가타(緖方) 내각고문에게\n\n아사히(朝日) 유럽 주재원 가사 신타로(笠信太郞)가 지난번 시모무라(下村) 총재에게 아뢴 일반 정세 보고에 이어지는 결론으로서의 소견은 다음과 같다.\n\n## 一、소련방의 태도\n\n앞선 전보의 결어에서 말한 바와 같이, 소련방이 영미 태도의 변화를 일찍 간파하고 도리어 동아 전쟁 참가의 권리를 획득하려는 태도를 밀고 나아가고 있음은 의심할 여지가 없다. 소련방으로서는 현재의 단계에서는 일본을 압박하는 것 자체를 직접의 목표로 삼는 것은 아니나, 이에 큰 관심을 가지는 까닭은, 일본의 후퇴를 전제로 하고 또 이를 기회로 하여 전후 동아에서의 영미 세력에 대항하기에 충분한 지반을 이 기회에 만들어 올리는 것을 그 최대의 정책 목표로 삼기 때문임이 명료하다. 다만 이 목적을 관철할 수 있는 한에 있어서 소련방은 우리 쪽에 대하여 화(和)·전(戰) 양쪽의 태세를 취하고 아직 그 어느 쪽이라고도 명확히는 표시하지 않고 있으나, 어느 쪽이든 이 의도는 이번 동아 전쟁을 기회로 삼아 끝까지 관철하려 시도하려 함은 자명하다고 보지 않을 수 없다.\n\n이러한 소련방의 태도가 표면화하여 온 것은, 앞서 말한 영미의 대소 태도의 변화와도 때를 같이하여 작년 여름 무렵에 시작된다. 그 증좌는 역연(歷然)하여, 작년 6월 이래 계속되는 소련방인의 일본 공격에 표현되었고 11월 7일의 「스탈린」 연설로써 낙인을 찍은 형국이다. 그리고 위의 것은 지난번의 중립조약 불연기(不延期) 통고가 될 전조였던 것인데, 이 소련의 대일 태도는, 소련이 똑같이 조약 불연기를 통고하고 현재 그 조약 개정 교섭에서 이를 강압하고 있는 터키(土耳其)에 대한 태도 등과는 크게 질을 달리하여, 그 대일 통고의 이유서는 그대로 언제라도 대일 단교 내지 선전(宣戰)의 이유가 될 수 있을 정도의 것임은 여기서 말할 것도 없다. 따라서 종래의 소련 정책의 일반적인 나오는 태도와 작년 6월 이래 일관하여 표명해 온 대일 태도에 비추어, 특히 소련으로서는 영미가 소련의 동아 진출을 희망하지 않는 태도에 역행하여 선수를 치려는 입장에 있는 점, 다시 또 일본의 현 내각이 전 내각과 달리 적어도 그 성립 당초 명백히 하나의 분위기를 가진 것이라고 유럽 일반에 해석되고 있던 점을 볼 때, 소련으로서는 시기를 잃는 일 없이 동아 정책에 한 걸음을 진전시켜 두려는 것이라고 생각하여 그르침이 없을 것이다. 그 대책은 이미 대일 단교의 조치 같은 것으로는 때를 맞출 수 없는 단계에 이르렀다고 생각된다. 일반적으로 말하면, 유럽 전쟁이 종국을 고한 오늘날 직접 대일 선전의 거사로 나설 가능성은 자못 많다고 생각하지 않을 수 없다. 과연 소련이 소만(蘇滿) 국경에 충분한 준비를 이룰 때까지는 유럽 전쟁의 경험으로 보아 반 년은 요할 것이라고 생각되나, 경우에 따라서는 당초에는 시베리아(西比利亞) 오지로 물러설 것도 각오하고, 어쨌든(兎モ角) 종이 위에서 선전하여 강화에 즈음한 절대적 발언권을 확보해 두는 것은 소련으로서 셈에 맞지 않는 일이 아니다. 다만 이 시기를 확언하기는 곤란하나, 소련이 일·미·영 화평의 기운이 조성되기 시작하였다고 보게 되면 이 실현성은 갑자기 더할 것이고, 이와 반대로 소련이, 우리 쪽이 미군의 상륙을 앞두고 이와 결전할 결의가 굳다고 보게 되면 대일 선전은 이에 응하여 미루고 스스로 별개의 방법으로 나설 것으로 생각된다. 최근 한두 달 소련의 이 문제에 관한 발언은 자극적인 것이 적고, 특히 샌프란시스코(桑港) 회의 중도 이래 오히려 선전하지 않고서 선전한 것과 같은 효과만을 노리는 듯한 어조를 보였다. 다만 이로써 소련의 우리 쪽에 대한 태도가 완화되었다고 생각하는 것은 큰 잘못일 것이다. 전쟁이 길어진다고 보면 선전 포고는 최후까지 끌 수도 있을 것이며, 다만 그 이전에 우리 쪽을 향하여 가라후토(樺太)·만주(滿洲)·조선(朝鮮) 등에 관한 최후통첩적 요구를 제출해 올 가능성은 충분히 생각된다. 즉 소련으로서는 싸우지 않는 경우에도 싸우는 것과 같은 효과를 획득할 수 있다는 확신이 없으면 선전 포고 없이 끝내는 일은 없을 것이다. 불초(不肖)는, 근일 개최될 3국 회담의 직전에 즈음하여 예에 따라 「기성사실」을 만들어 두기 위하여 우리 쪽에 대하여 무언가의 요구 제출 등의 일이 없을까 우려하던 차인데, 우리 쪽이 아니라 터키에 대하여 이 수를 쓴 것을 보면 대일 방책으로서는 다시 별개의 행방을 생각하고 있는 것이라고 추단하게 되는 바이다. 그리고 이 새로운 사태의 전례가 되고 있는 것은, 미국의 대일 상륙전의 태세와 이에 대응하는 미국의 대소 정책의 변화라고 생각된다. 이는 최근의 발전으로서 다시 후단에서 말하는 바와 같다.\n\n## 二、미·영의 태도\n\n작년 여름 이래 위에서 말한 것과 같은 소련의 태도는 미·영도 물론 간취해 온 바이다. 그러므로 미·영으로서는 소련의 동아 진출 이전에 우리 쪽과 강화하는 것이 유리하다는 것은 일찍이 알고 있었을 터이고, 이 경향은 우리 스즈키(鈴木) 내각 출현 이래 최근까지 미국에서 특히 현저하게 표면화하여 왔다. 따라서 이 미·영과 소련의 일본에 대한 정책의 어긋남(喰違)은 최근 한두 달에 있어서 가장 컸던 바인데, 이 기회는 과거 한두 주간을 고비로 하여 시시각각 사라지려 하는 듯한 관(觀)이 깊다. 생각건대 미국은 최근의 단계에서, 특히 샌프란시스코에서의 소련의 압박적 공기를 통하여 소련의 동아 진출의 의도가 이미 어찌할 수도 없음을 알게 됨과 동시에, 한편 일본 본토 상륙의 과제를 눈앞에 떠올려 볼 때 그 감행에 즈음하여 관동군(關東軍)의 내지 이송을 두려워하여 이를 소만 국경에 견제할 필요를 느끼지 않을 수 없으므로, 여기서 미국으로서는 종래 품어 온 소련의 동아 진출에 대한 일방적인 혐오(毛嫌)만으로는 밀고 나갈 수 없는 사태에 직면하였다고 보지 않을 수 없다. 여기에 새롭고 참된 계기가 있다. 그러나(乍倂) 미국이 소련의 대일 선전에 의한 행동 개시를 좋아하지 않음은 여전할 것이므로, 미국은 이를 정치적으로 해결하여 소련의 동아 진출의 한도를 결정하고서 착수하려는(懸ラントスル) 태도로 나설 것이라고 보는 것을 목하의 사태에 가까운 것으로 삼아야 할 것이다.\n\n「홉킨스」의 모스크바(莫斯科) 교섭에서 소련은 적어도 표면상 유럽 문제에 대해서는 상당히 양보의 자세를 보였다. 소련으로서는 이 대상(代償)의 의미에서, 미국으로서도 그 입장으로부터 주문(註文)을 가진 바에서, 당시 극동 문제의 근간에 접촉하였던 것이 아닌가 하고 생각하는 것은 상식일 것이다. 그렇다면 독일 처리라고 하는 자못 발전성 있음과 동시에 서로 근본적으로는 접촉하기 어려운 중대 과제가 많음과는 이미 화제가 적을 3국 회담에서 대일 문제가 다루어질 기회는 무르익었다.（ママ） 소련 쪽에서 이를 꺼낼 가능성이 있다고 하면 미·영 측에 이에 대한 준비가 없다고는 볼 수 없을 것이다. 다만(但シ) 협정(取極)은 반드시 곡절이 있을 것이고, 소련으로서는 간단히 결정적인 윤곽을 만들게 하지 않으리라고 보는 것이 지당할 것이며, 일찍이 독일 문제를 둘러싼 「얄타」 회의의 협정이, 문제야 다르지만 이 전형을 잘 보여 주었다. 요컨대 소련으로서는 유럽 전쟁에서와 같은 조건을 화(和)·전(戰) 어느 쪽을 통해서든 동아에서 전개하려 함은 명백하고, 영미는 유럽 전쟁의 쓰라린 경험을 전후인 현재에도 여전히 맛보고 있음에도 불구하고 마침내 소련에게 몰려 같은 조건에 의해 대결을 이루지 않을 수 없는 사태에 가까워지고 있다. 따라서 미·영으로서는, 빨리 우리 쪽과 강화하여 전국(戰局)을 매듭짓든가, 그렇지 않으면 소련과의 사이에 정치적 해결로써 극동 세력권을 분할하여 소련의 끝없는 진출을 일단 눌러 두고서 대일전을 계속하든가 하는 외에는 없는 사태이다. 그러나 앞서 말한 것과 같이 소련이 영미로 하여금 전적으로 안심하게 할 종류의 약속을 할지 어떨지는 또 의문이며, 종래의 소련의 수법(遣口)으로 보면, 당면 미국으로 하여금 전력을 들어 대일전을 속행하도록 만들어 놓는(仕向ル) 동시에 다른 한편 소련의 중국(지나) 진출의 최후의 수는 자유로이 남겨 둘 것임에 틀림없으므로, 미국으로서 어디까지나 대일전에 몰두함에 있어서는 여전히 자신은 버리지 않으나 불안은 남을 것이다. 그러므로 설령 다가올 3국 회담에서 일단의 이야기는 된다 하더라도 그것은 일단의 것에 지나지 않고, 미·영 특히 영국으로서는 될 수 있는 한 대일전의 국면을 매듭짓지 않으면 그 대일전의 셈에 큰 어긋남을 초래할 가능성이 항상 존재한다는 것은, 바로 목전의 유럽 상황에서 그들이 몸에 사무치게 실행한 바이다. 그러니 미국은 여전히 우리를 향하여 「무조건 항복」 운운을 입에 담고 있으나, 그가 이 거래를 서두르고 있음은 명백하다. 따라서 무조건 항복이란 본디 「부르는 값(言ヒ値)」에 지나지 않고 에누리(値引)를 준비하고 있는 것이라고 추정하여 그르침이 없을 것이라고 단언한다. 지난 5월 9일의 「트루먼」의 대일 성명 이래의 미국의 방송은 그간의 소식을 암시하였다.\n\n요즈음 당지 은행가가 말하는 바에 의하면, 그들이 교제하는 미·영 외교관 계통은 내밀히 화평을 희망하고 있음이 명백히 간취된다는 것은（ママ） 단순한 항간의 기분에 지나지 않으나, 독일에 대해서는 일찍이 볼 수 없었던 현상으로서, 여기〔對인가〕 대(大)독일의 경우와는 현저한 차이가 있음을 놓쳐서는 안 된다. 다만(但シ) 사태가 추이함에 따라 일본을 독일과 동일시하려는 경향은 강해지고 있는 듯한 관(觀)은 있다. 생각건대 그들의 선전이 그들 자신을 묶는 결과이다. 그러나 당지에서의 전체의 인상으로서, 대화로써 하는 화평이 암시되고 있다는 것, 그리고 상대 쪽으로서 서두르고 있다는 느낌은 덮기 어려운 것이 있다. 「트루먼」 및 「크레이기」 등이 지난번부터 갑자기 일본의 전력의 강대함을 강조하고 또한 이를 극복하는 데는 큰 노력을 요한다는 뜻을 높이 외쳐 온 것은, 적어도 한 면에 있어서는 대일 화의(和議)를 비교적 가벼운 조건으로써 행하는 경우를 고려하여 국민에 대한 예방선을 친 것이라고 해석하는 것은 과연 지나친 것인가. Truman이 지난번 대일 발언 중에 「무조건」이라는 문자를 쓰지 않았던 것도 주목할 만하다. 또 3일자 워싱턴(華府) 「UP(ユーピー)」 전보에 있는 상원의원 Cavehart의 말 같은 것은 화평 조건에 관한 미국 내의 공기를 반영하는 것으로 보아야 할 것이다.\n\n그러나 다른 한편 미국으로서도 대일 결전을 위한 대규모의 준비에 걸려 있으므로, 본토 상륙전을 개시하기까지 이르면 그들로서도 이제는 간단히 뒤로 물러설 수 없어 대일 화평의 조건도 점점(愈々) 불가능을 강요하는 것과 같은 것을 내놓지 않을 수 없음은 필연이다. 위의 것은 소련과 미·영 사이에 이야기가 성립하는 경우 내지는 소련이 우리 쪽에 요구 제출의 거사로 나서는 경우, 이리하여 미국 자신이 단독으로 화의의 열쇠를 쥘 수 없게 되는 경우도 마찬가지일 것이다. 그러니 제1의 시기는 다가올 3국 회담까지이고 제2의 시기는 본토 상륙전 개시까지로 보아야 하며, 이를 넘기면 이 최후의 기회는 마침내 영구히 사라지는 것이 아닌가를 두려워하는 바이다. 이 기회로서는, 유럽 문제를 둘러싸고 소련에 대한 영미의 감정이 가장 악화하여 그 파도의 절정에 있는 듯한 감이 있던 한 달 전에 비하면 지금은 이미 가장 유리한 시기를 놓친 듯한 생각이 있으나, 이 영·미·소의 대립 관계는 만성(漫性)〔慢인가〕이어서 때로 조수의 만영(滿盈)은 있을지언정 근저에 있어서의 대립 관계는 대체로 변화하지 않을 것이다. 본디 극단적인 악화는 기대할 수 없다. 오히려 현재를 바닥으로 생각하여도 될 것이며, 3국 회담 후에는 오히려 일시적인 관계의 좋은 조자(調子)의 시기를 기대하지 않을 수 없다.\n\n다른 한편 영국 내의 정세에 있어서는, 「처칠」은 유럽 문제에 대한 곤경과 총선거를 앞두고, 만약 대일 문제를 해결할 수 있는 일도 있다면 그로서는 내정상 큰 국면의 전환이 되므로 이를 희망함은 명백할 것이다. 대일 문제에 관하여 최근 영국의 발언이 자못 적은 것은 대독일의 경우와 비교하여 놀랄 만한 관심의 상이(相異)를 보여 주었다. 이 경우에는 조건이 우리에게 유리하며, 선거 후에 있어서는 설령 「처칠」 내각이 안정된다 하더라도 어쨌든 영국 또한 훨씬 경화(硬化)할 것이라고 관측된다.\n\n## 三、우리 쪽의 대책\n\n우리 쪽으로서도 이 기회를 놓쳐서는 전쟁은 마침내 그칠 데를 모를 것이고, 그동안 소련이 유럽 전쟁에 쓴 대전력을 동아로 옮기기에 이른다면 사태는 이제 수습하기 어려울 것이다. 불길한 말을 좋아하지 않으나, 현재의 독일과 같은 방향으로 치닫는 외에 없는 것이 아닌가를 참으로 두려워하는 바이다. 독일은 단순한 패배가 아니라 지나치게 패배한 것이다. 이제는 자국민에게 아무런 「이니셔티브」도 없이, 국토 재산뿐만 아니라 국민마저도 온통 타국에 흩어져 빠져나가게 하였다고 말하여도 과언이 아니다. 살아남은 국민의 경제적 고난은 상당 기간에 걸쳐 사실상 타국의 노예에 가까울 것이다. 「나치」 지도자들이 최후까지 자기의 생명에만 집착한 것은 향토와 국민을 돌아보지 않는 참인성(慘忍性)과 국제 정세를 달관하지 못한 무모함이니, 마침내 일을 여기에 이르게 하였다. 본디 제국의 앞길과 같은 날에 논할 문제는 아니다.\n\n그러나 사태는 이제 촌각을 다투기에 이르렀다. 적은 압도적인 물량을 믿고 다시 우리에게 불리한 국제 정세를 굳혀서 밀고 왔다. 이 두 큰 조건은 도저히 움직이기 어렵다. 본토 상륙전은 적으로서도 중대한 손해를 입을 것이 자명하나, 유럽 전쟁의 경험에서 하면 그 절대적인 폭격의 힘은 결코 상륙을 불가능하게 하지 않는다. 그것은 물리적 문제이다. 일단 상륙에 성공한다면 비장한 전쟁은 문자 그대로 부녀자의 최후의 한 사람에까지 미칠 것이다. 국민이 온통 여기에 죽는 것은 쉽고 쉬운〔若若(?)〕 일이나, 누가 우리의 의도를 후세에 이을 것인가. 이제 싸움을 계속하는 것은 쉽고 창을 거두는 것은 어렵다. 만약 한 사람의 참된 명장이 있다면 창을 버리고 감연히 대군(大君)과 국민을 지킬 것이다. 각하(刻下)의 국난을 원구(元寇)와 비교하는 것은 심히 맞지 않는다. 국난은 이보다 백 배라고 말하여도 과언이 아닐 것이며, 따라서 능히 선승(禪僧)의 일갈로써 감당할 수 있는 사태가 아니다. 참으로 형세가 치닫는 바이다.\n\n유감이 극에 달하나, 지금 작은 집착을 버리고 인고 백년의 각오에 살아 나라의 근간과 국민을 지키지 않으면 마침내 아무것도 잃어버리는 날이 이르지 않는다고 할 수 없으니, 참으로 우려를 견딜 수 없다. 우리는 국가의 존립에는 어떠한 형태로든 반드시 군력(軍力)의 존재를 필연으로 하고, 국가가 존재하면 반드시 군력은 저절로 생겨 나오는 것이라고 믿는다. 다만 국가 관계와 국내 정치의 변화에 따라 달라진 모습으로 생겨 나올 것이다. 이를 기약하여 비로소 오늘의 미국의 불손과 잔학에 상대할 수 있을 것이다. 다만(但シ) 그를 위해서는 국가의 정신적 독립성과 경제력을 가진 국민의 건재를 전제로 하지 않을 수 없다. 가령 독일의 현상과 같이 국가적 감시 아래에 서는 것과 같은 상태에 들어가서는 이 소망도 또한 멀어질 것이다. 따라서 현재의 인종(忍從)과 고난은 오십 년 뒤에 전혀 새로운 모습으로 일본 국민을 일어서게 할 까닭이니, 이를 위한 기본 조건만은 이를 우리가 다음 세대에 남기지 않으면 안 된다고 믿는다. 이에 위정 당국에 있어서 큰 결의를 하시기를 오로지 빌지 않을 수 없는 바이다.\n\n이상, 국가 부침(浮沈)의 대사를 앞에 두고 아뢸 것도 솔직 대담함을 요하므로 스스로 좋아하지 않는 말까지도 감히 하였다. 구체적 방책에 대해서는 감히 여기서 아뢰지 않으나, 교섭은 비밀과 신속을 요하고 국제 관계를 고려할 필요가 있는 바, 이 점 당지 스위스(瑞西)에서 교섭이 개시되는 것이 극히 적당하다는 것만을 건의해 두고자 한다.\n\n또한 여기서 강조해 두고자 하는 것은, 교섭의 비밀에는 성공하더라도 발표의 순간에 있어서조차 소련이 우리 쪽에 최후적 신입(申入)을 할 수 있음은 당연히 예상에 넣어 두지 않으면 안 된다는 것이다. 그 경우 이를 결코 전쟁으로 이끌지 않도록 조처할 배포를 정하여 두는 것이 절대 필요하며, 또 교섭 중 예컨대 소만 국경에 불의의 사태가 발생하지 않도록 특별한 경계심을 요한다는 것은 다시 아뢸 것까지도 없을 것이다.\n\n## 四、대내 지도\n\n끝으로 아뢰자면, 신명을 바쳐 감투하고 계신 장병은 물론 순정(純情)한 일반 국민에게 있어서 지금 정부가 화평의 수단으로 나서는 것은 유감 지극하다는 생각이 있으리라는 것은 참으로 짐작하고도 남는 바이며, 우리 해외에 있는 자도 비보를 들을 때마다 옷깃을 여미는 동시에 일의 필요에 생각이 미쳐서는 같은 심경에 괴로워하였다. 그러나 수많은 호국 영령의 진충(盡忠)도 오로지 조국을 안태(安泰)로 이끌고 그 부모 자제를 지키려는 염원에 다름 아니므로, 이제 일이 여기에 이른 이상은 위정 당로(當路)에 있어서 큰 결심을 하시어, 그로써 나라의 초석을 지키는 동시에 이들 영령이 뒤에 남긴 부모 형제 자녀를 그들을 대신하여 지키는 것이야말로 이들 영령의 마음에 부합하는 까닭이라고 믿지 않을 수 없다. 그리고 이 점에 관해서는 전 언론기관을 여기에 동원하여, 그간의 오해에 기인한 뜻하지 않은 사태의 출래(出來)에 미리 대비하도록 온통 노력하게 하시기를 바란다(冀フ).\n\n최후로 이상의 생각은 근본에 있어서는 결코 불초 혼자의 것이 아니며, 지나친 말이나 불초가 보는 바로는 유럽에서 문제를 관찰 연구한 동포의 대부분이 은밀히 품고 있는 염원이라고 믿는다. 이에 해외에 있는 자의 유일한 임무로서 감히 꾸지람을 각오하고 참고로 불초의 확신을 개진하니, 정부에 있어서 중대한 결심의 하루라도 빠르기를 기념(祈念)한다.", "secondary": "961昭和20年7月9日東鄕外務大臣宛（電報）在スイス加瀨公使より朝日新聞駐在昌による時局情勢報告及び和平\n\n交涉開始方提言について\n\nベルン7月9日後2時43分發\n\n本省7月11日前8時00分着\n\n第七五九號（館長符號扱）\n\n（編注）\n\n緖方内閣顧問ヘ\n\n朝日歐洲駐在員笠信太郞ヨリ過般下村總裁ニ申上ケタル一般情勢報告ニ續ク結論トシテノ所見左ノ如シ\n\n一、蘇聯邦ノ態度\n\n前電ノ結語ニ述ヘタル如ク蘇聯邦ハ英米態度ノ變化ヲ早ク見テトリ逆ニ東亞戰參加ノ權利ヲ獲得セントノ態度ヲ進メツツアル ーチル」内閣安定スルニ於テモ何レニシロ英モ亦遙カニ硬化スヘシト觀測サル\n\n三、我方ノ對策\n\n我方トシテモ此ノ機ヲ逸シテハ戰ハ遂ニ止マル處ヲ知ラサルヘク其ノ間蘇聯ニシテ歐洲戰ニ用ヒタル大戰力ヲ東亞ニ移スニ到ランカ事態ハ最早收拾ニ難カルヘシ不吉ノ言ヲ好マサレトモ現在ノ獨逸ノ如キ方向ニ趨ルノ外無キニアラサルヤヲ眞ニ惧ルル次第ナリ獨逸ハ單ナル敗北ニアラスシテ敗北シ過キタルモノナリ今ヤ自國民ニ何等ノ「イニシアチーブ」無ク官ニ國土財産ノミナラス國民ヲモ擧ケテ他國ニ散脫セシメタリト言フモ過言ナラス生キ殘リタル國民ノ經濟的苦難ハ相當期間ニ亘リ事實上他國ノ奴隸ニ近カルヘシ「ナチ」指導者等カ最後迄己レノ生命ノミニ執着セシハ鄕土ト國民ヲ顧ミサル慘忽性ト國際情勢ヲ達觀セサル無謀トハ遂ニ事ヲ此處ニ到ラシメタリ素ヨリ帝國ノ前途ト同日ニ語ルヘキ問題ニアラス\n\n去リ乍ラ事態ハ今ヤ寸刻ヲ爭フニ到レリ敵ハ壓倒的ナル物量ヲ賴ミ更ニ我ニ不利ナル國際情勢ヲ固メテ以テ押シ來レリ此ノ二大條件ハ到底動カシ難シ本土上陸戰ハ敵トシテモ重大揖舌ヲ被ルハ自明ナレトモ歐洲戰ノ經驗ヨリスレハ其ノ絕大ナル爆擊ノ力ハ決シテ上陸ヲ不可能ナラシメス其ハ物理的問題ナリ一日上陸ニ成功センカ悲壯ナル戰ハ又字通リ婦女子ノ最後ノ一人ニ及ハン國民ハ擧ケ？\n\nテ此ニ死スルハ若若ナレトモ誰カ我カ意圖ヲ後世ニ繼カン今ヤ戰ヒヲ繼クルハ易ク矛ヲ收メルハ難シ若シ一人ノ眞ノ名將アラハ矛ヲ捨テテ敢然大君ト國民トヲ守ラン刻下ノ國難ヲ元寇ト比較スルハ甚タ當ラス國難ハ此ニ百倍スト言フモ過言ナラサルヘク從テ良ク禪僧ノ一喝ヲ以テ當リ得ル事態ニアラス眞ニ勢ノ趨ク所ナリ\n\n遺憾極マレトモ今小ナル執着ヲ捨テ忽苦百年ノ蠻悟ニ生キ國ノ根幹ト國民トヲ守ラサレハ遂ニ何物ヲモ喪フ日到ラサルナキヤ眞ニ憂慮ニ堪ヘス吾人ハ國家ノ存立ニハ如何ナル形ニ於テカ必ス軍力ノ存在ヲ必然トシ國家存在スレハ必ス軍力ハ自ラ生シ來タルモノト信ス唯國家關係ト國内政治ノ變化トニ應シ變リタル姿ニテ生シ來ラン之ヲ期シテ始メテ今日ノ米ノ不遂ト殘虐ニ相見ユルコトヲ得ヘシ伯シ其ノ爲ニハ國家ノ精神的獨立性ト經濟力ヲ持ツ國民ノ健在トヲ前提トセサルヲ得ス假ニ獨逸ノ現狀ノ如ク國家的監視ノ下ニ立ツカ如キ狀態ニ入リテハ此ノ望モ亦遠サカルヘシ從テ現在ノ忽從ト苦難トハ五十年後ニ全ク新シキ姿ニテ日本國民ヲ起タシメル所以ニシテ此ノ爲ノ基本條件丈ケハ之ヲ我等カ次ノ世代ニ遺ササルヘカラスト信ス玆ニ爲政當局ニ於カレ大決意ヲナサレンコトヲ偏ニ祈ラサルヲ得サル次第ナリ\n\n以上國家浮沈ノ大事ヲ前ニシテ申上クヘキコトモ率直大膽ナルヲ要スルヲ以テ自ラ好マサル言ヲモ敢テ致セリ具體的方策ニ付テハ敢テ玆ニ申上ケサルモ交涉ハ祕密ト述速トヲ要シ國際關係ヲ考慮スル必要アル處此ノ點當瑞西ニ於テ交涉開始サレルコトノ極メテ適當ナルコトノミヲ進言致シ置キ度シ\n\n尙玆ニ强調致シ置キ度キハ交涉ノ祕密ニハ成功スルモ發表ノ瞬間ニ於テスラ蘇聯カ我方ニ最後的申入レヲナスコトノアリ得ルハ當然豫想ニ容レ置カサルヘカラス其ノ場合之ヲ決シテ戰爭ニ導カサル樣取計フノ腹ヲ定メ置クコト絕對必要ニシテ又交涉中例ヘハ蘇滿國塲ニ不慮ノ事態發生セサル樣特別ノ戒心ヲ要スルコト又申上クル迄モ無カルヘシ\n\n四、對内指導\n\n結尾ニ申上ケンニ身命ヲ捧ケ敢鬪セラレツツアル將兵ハ素ヨリ純情ナル一般國民ニ取リテ今政府カ和平ノ手段ニ出ツルハ遺憾至極ナリトノ考アランコト眞ニ想察ニ餘リアル所ニシテ吾人海外ニ在ル者モ悲報ヲ聞ク每ニ襟ヲ直スト共ニ事ノ必要ニ想到シテハ同シ心塲ニ苦メリ左リ乍ラ幾多護國ノ英靈ノ盡忠モ一ニ以テ祖國ヲ安泰ニ導キ其ノ父母子弟ヲ護ラントノ念廳ニ外ナラサルヲ以テ今事玆ニ至ル以上ハ爲政當路ニ於テ大決心ヲ致サレ以テ國ノ礎石ヲ守ルト同時ニ此等英靈カ後ニ殘シタル父母兄弟子女ヲ彼等ニ代ツテ護ルコトコソ此等ノ英靈ノ心ニ副フ所以ナリト信セサルヲ得ス而シテ此ノ點ニ關シテハ全言論機關ヲ玆ニ動員シ此ノ間ノ誤解ニ基キ計ラサル事態ノ出來ニ豫メ備フル樣擧ケテ努力セシメラレンコトヲ輩フ最後ニ以上ノ考ハ根本ニ於テハ決シテ不肯獨リノモノニ非スシテ出過キタル言ナレトモ不肯ノ見ル處歐洲ニ於テ問題ヲ觀察硏究セル同胞ノ大部分カ祕カニ包懷セル念廳ナリト信ス玆ニ海外ニ在ル者ノ唯一ノ任務トシテ敢テ御叶リヲ蠻悟シ御參考ニ不肯ノ確信ヲ開陳、政府ニ於カレ重大御決心ノ一日モ早カランコトヲ祈念致ス\n\n編注緖方竹虎内閣顧問には配布せずと、書込あり。", "notes": ["〔編注〕 전보번호 뒤의 「緖方内閣顧問ヘ(오가타 내각고문에게)」는 편자가 붙인 것이다.", "編注: 오가타 다케토라(緒方竹虎) 내각고문에게는 배포하지 않았다는 기입이 있다."], "warn": true, "
