に関する報道振りについて 岡本季正 오카모토 스에마사 (주스웨덴 공사) 東鄕茂德 도고 시게노리 (외무대신) 「スターリン」 스탈린 「リーダース」 리더스 (영국 전시운수성 장관 Lord Leathers)"}, {"id": "d1075", "order": 1075, "date": "1945-07-18", "group": "B", "eyebrow": "문서 1075 · 四 ポツダム宣言の受諾", "title": "포츠담 회담에서 제의가 예상되는 연합국 측의 대일 화평 조건에 대하여", "badge": "第九一九號（緊急）", "list_right": "문서 1075", "meta": [{"k": "일자", "v": "1945-07-18", "txt": false}, {"k": "발신", "v": "東鄕茂德 도고 시게노리 (외무대신)", "txt": true}, {"k": "수신", "v": "在ソ連邦佐藤大使 주소련 사토 나오타케 대사", "txt": true}, {"k": "발착", "v": "本省7月18日後2時00分發", "txt": false}, {"k": "장소", "v": "本省", "txt": false}, {"k": "전보번호", "v": "第九一九號（緊急）", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "도고 외상이 몬테비데오·호주 단파방송이 전한 「연합국이 준비 중인 일본의 항복 조건」의 내용을 사토 대사에게 참고로 통보한 긴급 전보.", "points": ["17일 8시 「몬테비데오」 단파: 스탈린이 트루먼·처칠에게 하나의 일본 화평 제의를 제시할 것이라고 영국 신문 외교 해설자가 말했다고 방송", "18일 6시 45분 호주 A·B·C 단파: 워싱턴 통신원이 연합국이 일본의 항복 조건을 준비하고 있으며 출처는 확인되지 않으나 근거 있는 것이라고 방송", "그 조건은 공군의 폐지, 무기 및 군함을 제조할 수 있는 조선소와 중공업의 해체, 일본 점령지로부터의 철퇴다", "일본이 동의할 경우 연합국은 일본의 내지 제도(諸島)를 점령하지 않되, 항복 조건 준수를 보장하기 위해 일부 군대를 존치", "연합국은 일본이 자기의 정체(政体)를 유지하는 것을 허용한다", "장래 일본이 대전쟁을 할 가능성을 방지하기 위해 석회·철·연료 등의 민수(民需)는 제한될 것이라고 한다", "「어참고까지(御參考迄)」다. 훈령이 아니라 정보 제공이다"], "primary": "**본성 7월 18일 후 2시 00분 발**\n\n**제919호（긴급）**\n\n17일 8시의 「몬테비데오」 단파는, 「스탈린」이 「트루먼」 및 「처칠」에게 하나의 일본 화평 제의를 제시할 것이라는 뜻을 영국 신문의 외교 해설자가 말하였다고 방송하였고, 또 18일 6시 45분의 호주 A·B·C 단파는, 화부(華府, 워싱턴)의 통신원이, 연합국이 일본의 항복 조건을 준비하고 있으며 그 출처는 확인되어 있지 않으나 근거 있는 것이라고 방송하였다. 그 조건으로서 공군의 폐지 및 무기와 군함을 제조할 수 있는 조선소와 중공업의 해체, 아울러 일본의 점령지로부터의 철퇴를 들고, 일본이 동의할 경우 연합국은 일본의 내지 제도(内地諸島)를 점령하지 아니하며, 항복 조건의 준수를 보장하기 위하여 일부 군대를 존치할 것이고, 연합국은 일본이 자기의 정체(政体)를 유지하는 것을 허용할 것이며, 또한 일본이 장래 대전쟁을 할 가능성을 방지하기 위하여 석회·철·연료 등의 민수(民需)는 제한될 것이라고 말하고 있다.\n\n어참고까지(御參考迄).", "secondary": "1075昭和20年7月18日在ソ連邦佐藤大使宛（電報）東鄕外務大臣よりポツダダ会談に関する報道振りについてポツダダ会談において提議が予想される連合ストックホルム7月1g日後0時30分發国側の対日和平条件について\n\n本省7月19日後2時40分着本省7月18日後2時00分發\n\n第四七八號第九一九號（緊急）\n\n十七日當地新聞報道左ノ通リ十七日八時ノ「モンテヴイデオ」短波ハ「スターリン」ハ\n\n十六日ヨリ開催ノ豫定ナリシ「ポツダム」會談ハ「スター「トルーマン」及「チヤーチル」ニ一ノ日本和平提議ヲ提リン」ノ到着遲處セル爲一日繰處ヘトナリタル模樣ナルカ示スヘキ旨英紙ノ外交解說者カ云ヘリト放送シ又十八日六英國方面ニテハ種々ノ事實就中英米軍首膽部及英戰時連輸時四十五分ノ濠州A・B・C短波ハ華府ノ通信員ハ聯合國省「リーダース」參加セル事實ニ鑑ミ本會談ニ於テ蘇聯ノカ日本ノ降伏條件ヲ準備シ居リ其ノ出所ハ確認セラレ居ラ對日戰ニ於ケル役割論議サルヘシト見ルモノ少カラス更ニサルモ根據アルモノナリト放送シ右條件トシテ空軍ノ廢止米國方面ニテモ米ニトリ現下ノ最大問題ハ急速ナル對日戰及武器及軍艦ヲ製造シ得ル造船所及重丁業ノ解体竝ニ日本ノ終結ニアルヲ以テ英米ハ「テヘラン」「ヤルタ」ニ於ケノ占領地ヨリノ撤退ヲ擧ケ日本カ同意スル場合聯合國ハ日ルト同樣本會談ニ於テモ太平洋問題ヲ採上クヘク而シテ從本ノ内地諸島ヲ占領セス降伏條件ノ遵守ヲ保障スル爲一部來ヨリモ强硬ニ蘇聯ノ態度決定ヲ促スヘシト見ラレ居レリ軍隊ヲ存置スヘク聯合國ハ日本カ自己ノ政体ヲ維持スルコトヲ許容シ且日本カ將來大戰爭ヲナス可能性ヲ防止スヘク\n\n石灰、鐵、燃料等ノ民需ハ制限セラルヘシト云ヒ居レリ\n\n御參考迄", "notes": [], "warn": false, "pages": [1893, 1894], "search": "ポツダム会談において提議が予想される連合国側の対日和平条件について 東鄕茂德 도고 시게노리 (외무대신) 佐藤尚武 사토 나오타케 (주소련 대사) 「スターリン」 스탈린 「トルーマン」 트루먼 「チヤーチル」 처칠"}, {"id": "d1076", "order": 1076, "date": "1945-07-18", "group": "A", "eyebrow": "문서 1076 · 四 ポツダム宣言の受諾", "title": "소련의 대일 방침에 관한 당지 신문 보도에 대하여", "badge": "第四八三號", "list_right": "문서 1076", "meta": [{"k": "일자", "v": "1945-07-18", "txt": false}, {"k": "발신", "v": "在スウェーデン岡本公使 주스웨덴 오카모토 스에마사 공사", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 외무대신", "txt": true}, {"k": "발착", "v": "ストックホルム7月18日後5時25分發 / 本省7月20日後5時10分着", "txt": false}, {"k": "장소", "v": "ストックホルム 스톡홀름", "txt": false}, {"k": "전보번호", "v": "第四八三號", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "스톡홀름 신문이 전한 런던 주재 소련 공관의 언명을 옮긴 보고. 일본이 구체적 신청을 하면 중개자가 되는 것이 소련 정책에 반하지 않으나 단순한 화평 타진의 중개는 스탈린의 의도가 아니며, 소련은 일본에게 항복이냐 완전한 군사적 패퇴냐의 두 길뿐이라고 보고 있다.", "points": ["18일자 「스톡홀름 티드닝겐」이 17일 저녁 런던발(I.N.us)로 「소련은 일본이 구체적 신청을 하면 조정하겠다」는 표제로 보도", "런던 주재 소련 공관 언명: 소련 정부는 대미 화평에 관한 일본의 어떠한 구체적 신청도 기꺼이 취차(取次)할 것이다", "스탈린이 포츠담에 일본의 화평 제의를 가지고 갔다는 풍설은 긍정도 부정도 할 수 없다", "일본이 구체적 신청을 제시한다면 조정자가 되는 것은 결코 소련 정책에 반하지 않는다. 그러나 단순한 화평 타진을 위한 중개는 스탈린의 의도가 아니며, 어떠한 소련 외교관도 그것을 하도록 허락되지 않는다", "소련은 일본에게 「항복하느냐 완전한 군사적 패퇴를 하느냐」의 두 길뿐이라고 관측하며, 따라서 극동 사태에 대해 낙관하고 있다", "이 견해가 스탈린과 쑹쯔원(宋子文) 회담의 기초가 되어, 쑹쯔원에게 반공정책을 중지하고 중국공산당과 합의에 도달하도록 권장했다", "적군(赤軍)이 대독전에서 막대한 희생을 낸 뒤 만주에서 유력한 일본군과 새로운 전투를 시작하기를 바라지 않고 있음을 분명히 이해시키고 있다. 이와 반대되는 보도는 큰 유보를 두고 다루어야 한다", "다만 소련은 다른 방법으로 대일전을 원조할 수 있다. 충칭이 공산당과 화평하면 중국(지나)을 위해 대일전에 필요한 물자를 상당히 공급할 수 있다", "소련은 일본의 상황과 중국 내 일본군 점령지역 상황을 다른 어느 나라보다 잘 알고 있으므로, 스탈린이 화평 제의를 가져올 경우 일본이 진실로 항복할 시기에 이르렀는지, 아니면 전쟁을 계속할 능력이 있는지에 관해 가장 유익한 의견을 줄 수 있을 것이다"], "primary": "**스톡홀름 7월 18일 후 5시 25분 발**\n\n**본성 7월 20일 후 5시 10분 착**\n\n**제483호**\n\n18일 「스톡홀름 티드닝겐」은 17일 저녁 런던발 전보(I.N.us)로서, 「소련은 일본이 구체적 신청(申出)을 함에 있어서는 조정하려 한다」는 표제로 다음과 같이 보도하고 있음.\n\n런던 주재 소련 공관은 다음과 같이 언명하였다. 소련 정부는 대미 화평에 관한 일본의 여하한 구체적 신청도 기꺼이 취차(取次)할 것이다. 「스탈린」이 「포츠담」에 일본의 화평 제의를 가지고 갔다는 풍설은 긍정도 부정도 할 수 없으나, 만약 일본이 구체적 신청을 제시함에 있어서는 조정자가 되는 것은 결코 소련 정책에 반하는 것이 아니다. 그러나 단순한 화평 타진을 위하여 중개하는 것은 「스탈린」의 의도가 아니며, 또한 여하한 소련 외교관이라 하더라도 이를 행하는 것이 허락되지 않는다. 또 소련은 일본에게는 항복하거나 완전한 군사적 패퇴를 하거나의 두 길이 있을 뿐이라고 관측하고 있으며, 따라서 소련 당국은 극동의 사태에 관하여는 낙관하고 있다. 이 견해가 「스탈린」과 쑹쯔원(宋子文)의 회담의 기초가 되었고, 쑹쯔원에 대하여 반공정책을 중지하고 중국공산당과의 합의에 도달할 것을 권장한 것이다. 적군(赤軍)이 대독전에서 막대한 희생을 낸 뒤에 만주에서 유력한 일본군과 새로운 전투를 시작하는 것을 바라고 있지 아니함을 분명히 이해시키고 있는 바이며, 이와 반대되는 보도는 큰 유보를 가지고 이를 다루지 않으면 안 된다. 다만 소련은 다른 방법에 의하여 대일전을 원조할 수 있으니, 즉 충칭(重慶)이 공산당과 화평함에 있어서는 소련은 중국(지나)을 위하여 대일전에 필요한 물자를 상당히 공급할 수 있을 것이다. 끝으로 소련은 일본의 상황 및 중국(지나)에 있어서의 일본군 점령지역의 상황에 관하여는 다른 어느 나라보다도 잘 알고 있으므로, 만약 「스탈린」이 이 기회에 혹은 장래에 있어서 화평 제의를 가져올 경우에는, 「스」는 일본이 진실로 항복할 시기에 도달하여 있는지, 아니면 또 전쟁을 계속할 수 있는 능력이 있는지의 문제에 관하여 가장 유익한 의견을 줄 수 있을 것이다.", "secondary": "1076昭和20年7月18日東鄕外務大臣宛（電報）在スウエーデン岡本公使よりソ連の対日方針に関する当地新聞報道について\n\nストックホルム7月18日後5時25分發\n\n本省7月20日後5時10分着\n\n第四八三號\n\n十八日「ストツクホルム、チドニンゲン」ハ十七日夕倫敦發電（I.N.us）トシテ蘇聯ハ日本カ具體的申出ヲ爲スニ於テハ調停セントノ見出シニテ左ノ通リ報シ居レリ\n\n在倫敦蘇聯公館ハ左ノ通リ言明セリ蘇聯政府ハ對米和平ニ關スル日本ノ如何ナル具體的申出ヲモ喜テ取次クヘシ「スターリン」カ「ポツダム」ニ日本ノ和平提議ヲ齎シタリトノ風說ハ皆定モ否定モ爲シ得サルモ若シ日本カ具體的申出ヲ示スニ於テハ調停者トナルコトハ決シテ蘇聯政策ニ反スルモノニ非ス乍倂單ナル和平打診ノ爲ニ仲介スルハ「スターリン」ノ意圖ニ非ス又如何ナル蘇聯外交官ト雖モ之ヲ爲スヲ許サレス尙蘇聯ハ日本ハ降服スルカ完全ナル軍事的敗退ヲナスカノ二途アルノミト觀測シ居リ從テ蘇聯當局ハ極東ノ事態ニ關シテハ樂觀シ居レリ此ノ見解ハ「スターリン」ト宋子又トノ會談ノ基礎トナリ宋子又ニ對シ反共政策ヲ中止シ中國共産黨トノ合意ニ達センコトヲ勸獎セル次第ナリ赤軍カ對獨戰ニ於テ莫大ナル犧牲ヲ出セル後ニ於テ滿洲ニ於テ有力ナル日本軍ト新ナル戰鬪ヲ始ムルコトヲ望ミ居ラサルコトヲ明カニ了解セシメツツアル次第ニシテ右ト反對ノ報道ハ大ナル留保ヲ以テ之ヲ取扱ハサルヘカラス伯シ蘇聯ハ他ノ方決ニ依リテ對日戰ヲ援助シ得卽チ重慶カ共産黨ト和平スルニ於テハ蘇聯ハ支那ノ爲ニ對日戰ニ必要ナル物資ヲ相當供給シ得ヘシ最後ニ蘇聯ハ日本ノ狀況及支那ニ於ケル日本軍占領地域ノ狀況ニ付テハ他ノ何國ヨリモ良ク知リ居ルヲ以テ若シ「スターリン」カ此ノ際若クハ將來ニ於テ和平提議ヲ齎ス場合ニハ「ス」ハ日本カ眞實ニ降伏スル時期ニ達シ居レルヤ將又戰爭ヲ繼續シ得ル能力アリヤノ問題ニ付最モ有益ナル意見ヲ與フルヲ得ヘシ", "notes": [], "warn": false, "pages": [1894, 1895], "search": "ソ連の対日方針に関する当地新聞報道について 岡本季正 오카모토 스에마사 (주스웨덴 공사) 東鄕茂德 도고 시게노리 (외무대신) 「スターリン」 스탈린 宋子文 쑹쯔원 (중국 외교부장)"}, {"id": "d962", "order": 962, "date": "1945-07-19", "group": "A", "eyebrow": "문서 962 · 二 中立国を通じた和平打診", "title": "오카모토 육군무관이 참모총장에게 보낸 전보의 사전 통지", "badge": "第七九○號（至急、親展、極祕、館長符號）", "list_right": "문서 962", "meta": [{"k": "일자", "v": "1945-07-19", "txt": false}, {"k": "발신", "v": "在スイス加瀨公使 주스위스 가세 슌이치(加瀨俊一) 공사", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 시게노리(東鄕茂德) 외무대신", "txt": true}, {"k": "발착", "v": "ベルン7月19日後7時56分發 / 本省7月24日後8時00分着", "txt": false}, {"k": "장소", "v": "ベルン 베른", "txt": false}, {"k": "전보번호", "v": "第七九○號（至急、親展、極祕、館長符號）", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "오카모토 중장이 참모총장 앞으로 보낸 전보와 관련하여 아뢸 사항의 상세를 20일 중에 타전하겠다고 미리 알리는 짧은 전보.", "points": ["주스위스 육군무관 오카모토 중장이 참모총장 앞으로 전보를 보냈다는 사실을 외상에게 먼저 알린다.", "그에 관하여 아뢸 사항의 상세는 20일 중에 타전한다고 예고한다.", "「至急、親展、極祕、館長符號」의 최고 취급 등급이 붙어 있어, 육군 계통 채널에 대한 외무성의 즉시 파악 필요를 보여준다."], "primary": "오카모토(岡本) 중장이 참모총장에게 보낸 전보에 관하여 아뢰어야 할 사항의 상세는 20일 중에 타전한다. 참고로 알려 둔다(爲念).", "secondary": "962昭和20年7月19日東鄕外務大臣宛（電報）在スイス加瀨公使より岡本陸軍武官より參謀総長宛電報の事前通知\n\nベルン7月19日後7時56分發本省7月24日後8時00分着第七九○號（至急、親展、極祕、館長符號）岡本中將ヨリ參謀總長宛電報ニ付申上クヘキ事項詳細二十日中ニ發電ス爲念", "notes": [], "warn": false, "pages": [1717], "search": "岡本陸軍武官より参謀総長宛電報の事前通知 加瀨俊一 가세 슌이치 — 주스위스 공사, 발신자 東鄕茂德 도고 시게노리 — 외무대신, 수신자 岡本中將 오카모토 중장 — 주스위스 육군무관(편자 제목의 「岡本陸軍武官」). 주스웨덴 공사 오카모토 스에마사(岡本季正)와는 다른 인물이다 參謀總長 참모총장 — 당시 우메즈 요시지로(梅津美治郞). 본문에는 직명만 나온다"}, {"id": "d1077", "order": 1077, "date": "1945-07-19", "group": "A", "eyebrow": "문서 1077 · 四 ポツダム宣言の受諾", "title": "포츠담 회담 및 쑹쯔원 방소에 관한 정보", "badge": "第四八五號", "list_right": "문서 1077", "meta": [{"k": "일자", "v": "1945-07-19", "txt": false}, {"k": "발신", "v": "在スウェーデン岡本公使 주스웨덴 오카모토 스에마사 공사", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 외무대신", "txt": true}, {"k": "발착", "v": "ストックホルム7月19日前11時45分發 / 本省7月20日後8時50分着", "txt": false}, {"k": "장소", "v": "ストックホルム 스톡홀름", "txt": false}, {"k": "전보번호", "v": "第四八五號", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "17일자 첩보자 보고다. 포츠담 회담에서 소련의 대일 참전이 결정되는 일은 없을 것으로 관측되며, 모스크바의 소·중 교섭은 외몽·만주·조선 등의 지위를 다루는 것으로 미국의 지령에 따라 진행되었고, 소련이 전후 일본의 대륙 발언권 상실을 전제하는 한 소·일 교섭은 곤란하다고 한다.", "points": ["「포츠담」 회담은 영·미·소 모두 엄중한 비밀주의를 지키고 있어 내용을 예상하기 어렵다", "독일 처리 제 문제와 유럽의 신국경 획정 등이 논의될 것은 확실", "영미 신문은 극동 문제도 중요 의제이며 소련의 대일 참전이 논의될 것이라 보도하나, 본 회의는 주로 유럽전 종결의 결과 해결을 요하게 된 유럽 제 문제의 논의를 목적으로 한다", "정보를 종합하면 적어도 소련의 대일 참전이 본 회의에서 결정되는 일은 없을 것으로 관측된다", "소련이 극동 방면으로 병력을 이동하는 등 적극 행동 개시의 전제로 보이는 조치를 취하고 있는 사실은 있으나, 이는 「제스처」로 보는 것이 적당하며 적어도 당분간 소련은 대일 참전을 하지 않을 것으로 관측된다", "모스크바의 소·중 교섭은 일단락된 듯한데, 원래 이는 영미 특히 미국이 주창·준비한 것으로 보인다", "소련을 제외하고 영미만으로는 중국(지나)의 지위를 결정할 수 없고, 소련의 극동 정책 여하는 중국의 장래뿐 아니라 극동에서의 영미의 지위에도 중대한 영향이 있으므로, 먼저 소·중 직접 교섭에 의해 외몽·만주·조선 등의 지위, 중국 중앙정부의 기구, 소·중 경제관계 문제를 해결하려 한 것", "중국은 물론 미국 측과 밀접히 연락하여 그 지령에 근거해 교섭을 진행한 것으로 보인다", "소련이 중국을 상대로 극동 문제에 관해 교섭한 것은, 이미 태평양 전국(戰局)의 추이에 비추어 일본은 전후 대륙에서 발언권을 상실할 것이라는 전망에 근거한 것으로, 소련이 이런 전망을 가지는 한 소·일 간 교섭은 곤란하다고 보인다", "이 교섭에 관해서도 소련의 대일 참전설이 보도되고 있으나 단순한 억측에 지나지 않는 듯하다"], "primary": "**스톡홀름 7월 19일 전 11시 45분 발**\n\n**본성 7월 20일 후 8시 50분 착**\n\n**제485호**\n\n17일 첩보자(諜報者) 보고\n\n一、「포츠담」 회담은 영·미·소 모두 엄중한 비밀주의를 지키고 있으므로 회담의 내용을 예상하기 곤란하나, 독일 처리에 관한 제 문제와 유럽에서의 신국경 획정 등이 논의될 것은 확실하다고 보인다. 영미 신문은 극동 문제도 중요 의제의 하나일 것이며 소련방의 대일 참전이 논의될 것이라고 보도하고 있으나, 본 회의는 주로 유럽전 종결의 결과 해결을 요하게 된 유럽 제 문제의 논의를 목적으로 하며, 정보를 종합하건대 적어도 소련의 대일 참전이 본 회의에서 결정되는 일은 없을 것으로 관측된다. 소련이 극동 방면으로의 병력 이동 등 적극적 행동 개시의 전제로 생각되는 조치를 취하고 있는 사실은 있으나, 이는 「제스처」로 보는 것이 적당할 것이며, 적어도 당분간 소련은 대일 참전을 하지 않을 것으로 관측된다.\n\n二、모스크바(莫斯科)에서의 소·중(蘇支) 교섭은 일단락을 본 듯한데, 원래 이는 영미 특히 미국이 주창하고 준비한 것인 듯하다. 소련을 제외하고 영미만으로는 중국(지나)의 지위를 결정할 수 없고, 소련의 극동 정책 여하는 중국의 장래뿐 아니라 극동에서의 영미의 지위에도 중대한 영향이 있으므로, 먼저 소·중 직접 교섭에 의하여 외몽(外蒙)·만주·조선 등의 지위, 중국 중앙정부의 기구, 소·중 경제관계의 문제를 해결하려 한 것으로서, 중국은 물론 미국 측과 밀접한 연락을 유지하며 그 지령에 근거하여 교섭을 진행한 것인 듯하다. 소련이 중국을 상대로 하여 극동 문제에 관해 교섭한 것은, 이미 태평양 전국(戰局)의 추이에 비추어 일본은 전후 대륙에서의 발언권을 상실할 것이라는 전망에 근거하는 것으로서, 소련이 이와 같은 전망을 가지는 한 소련·일본 간의 교섭은 곤란하다고 보인다.\n\n또한 이 교섭에 관하여도 소련의 대일 참전설이 보도되고 있으나 단순한 억측에 지나지 않는 듯하다.", "secondary": "1077昭和20年7月19日東鄕外務大臣宛（電報）在スウエーデン岡本公使よりポツダダ会談及び宋子文訪ソに関する情報\n\nストックホルム7月19日前11時45分發\n\n本省7月20日後8時50分着\n\n第四八五號\n\n十七日諜報者報告\n\n一、「ポツダム」會談ハ英米蘇トモ嚴重ナル祕密主義ヲ持シ居ル爲會談ノ内容ヲ豫想スルコト困難ナルカ獨逸處理ニ關スル諸問題ト歐洲ニ於ケル新國塲畫定等論議サルルコト確實ナリト見ラル英米新聞ハ極東問題モ重要議題ノ一タルヘク蘇聯邦ノ對日參戰論議サルヘシト報シ居ルモ本會議ハ主トシテ歐洲戰終結ノ結果解決ヲ要スルニ到レル歐洲諸問題論議ヲ目的トシ情報ヲ綜合スルニ少クトモ蘇聯ノ對日參戰カ本會議ニ於テ決定セラルルコトハ無キモノト觀測セラレ蘇聯カ極東方面ヘノ兵力移動等積極的行動開始ノ前提ト思ハルル措置ヲ取リ居ル事實ハアルモ右ハ「ゼスチユア」ト見ルヲ適當トスヘク少クトモ當分蘇聯ハ對日參戰ヲ行ハサルモノト觀測セラル\n\n二、莫斯科ニ於ケル蘇支交涉ハ一段落ヲ見タルカ如キ處元來\n\n右ハ英米殊ニ米カ主唱シ準備セルモノノ如ク蘇聯ヲ除外シ英米ノミニテハ支那ノ地位ヲ決定シ得ス蘇聯ノ極東政策如何ハ支那ノ將來ノミナラス極東ニ於ケル英米ノ地位ニモ重大影響アルヲ以テ先ツ蘇支直接交涉ニ依リ外蒙、滿洲、朝鮮等ノ地位、支那中央政府ノ機構蘇支經濟關係ノ問題ヲ解決セントセルモノニシテ支那ハ素ヨリ米側ト密接ナル連絡ヲ保チ其ノ指令ニ基キ交涉ヲ進メタルモノノ如ク蘇聯カ支那ヲ相手トシ極東問題ニ付交涉セルハ旣ニ太平洋戰局ノ推移ニ鑑ミ日本ハ戰後大陸ニ於ケル發言權ヲ喪失スヘシトノ見透シニ基クモノニシテ蘇聯ニシテ斯クノ如キ見透シヲ有スル限リ蘇聯日本間ノ交涉ハ困難ナリト見ラル\n\n尙右交涉ニ關シテモ蘇聯ノ對日參戰說報道セラレ居ルモ單ナル膽測ニ過キサルカ如シ", "notes": [], "warn": false, "pages": [1895], "search": "ポツダム会談及び宋子文訪ソに関する情報 岡本季正 오카모토 스에마사 (주스웨덴 공사) 東鄕茂德 도고 시게노리 (외무대신) 宋子文 쑹쯔원 (편자가 붙인 제목에 등장)"}, {"id": "d963", "order": 963, "date": "1945-07-21", "group": "A", "eyebrow": "문서 963 · 二 中立国を通じた和平打診", "title": "오카모토 육군무관 등에 의한 국제결제은행 경제고문 야콥손을 통한 덜레스 공작에 관하여", "badge": "第七九六號（館長符號、親展、極祕） / 別電一 第七九七號（館長符號） / 別電二 第七九八號（館長符號） / 別電三 第七九九號（館長符號） / 別電四 第八○○號 / 付記一 第四六七號 / 付記二 瑞西情報第二四九號", "list_right": "문서 963", "meta": [{"k": "일자", "v": "1945-07-21", "txt": false}, {"k": "발신", "v": "在スイス加瀨公使 주스위스 가세 슌이치(加瀨俊一) 공사 (付記一만 在スウエーデン岡本公使 주스웨덴 오카모토 스에마사 공사)", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 시게노리(東鄕茂德) 외무대신", "txt": true}, {"k": "발착", "v": "ベルン7月21日前1時13分發 / 本省7月24日前8時00分着 (제796호) — 別電一 ベルン7月21日後0時28分發·本省7月23日後1時45分着 (제797호), 別電二 ベルン7月21日前1時21分發·本省7月24日前7時30分着 (제798호), 別電三 ベルン7月21日前1時10分發·本省7月24日前9時10分着 (제799호), 別電四 ベルン7月21日後0時28分發·本省7月23日後4時20分着 (제800호), 付記一 ストックホルム7月11日後5時30分發·本省7月12日前7時00分着 (제467호), 付記二 ベルン7月24日後3時57分發·本省7月25日後5時35分着 (瑞西情報제249호)", "txt": false}, {"k": "장소", "v": "ベルン 베른 (付記一은 ストックホルム 스톡홀름)", "txt": false}, {"k": "전보번호", "v": "第七九六號（館長符號、親展、極祕） / 別電一 第七九七號（館長符號） / 別電二 第七九八號（館長符號） / 別電三 第七九九號（館長符號） / 別電四 第八○○號 / 付記一 第四六七號 / 付記二 瑞西情報第二四九號", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "베른의 가세 공사가 오카모토 육군무관(중장)과 뜻을 같이하여, 국제결제은행 임원 기타무라·요시무라를 통해 같은 은행의 스웨덴인 경제고문 야콥손을 매개로 미국인 앨런 덜레스에게 「일본 황실과 국체(國體)에 미국이 손대지 않는가」를 타진한 경위를, 야콥손·덜레스 두 사람의 약력과 7월 10일 그루 국무장관대리 성명 원문 및 미국 신문 논조까지 붙여 본성에 보고한 장문 전보.", "points": ["가세 공사는 이 접촉이 전적으로 자신의 책임과 한 개인의 생각이며, 요사노 서기관은 전혀 동의하지 않고 쓰루오카 이하 관원은 관여하지 않는다고 못박아, 귀전 합 제501호와의 관계상 특별히 보고한다.", "가세는 정부가 대결심을 할 경우 화제를 꺼내는 방법으로서, 그 후의 정세로 보아 오히려 단도직입으로 주된 상대인 미국에 이야기를 밀고 들어가는 것이 상책이라 기울고 있다고 진언한다.", "야콥손이 전한 덜레스의 말: 일본을 위해 무언가를 구할 유일한 길은 7월 10일 그루 성명에 있는 의미의 「무조건 항복」을 즉시 수락하는 것이며, 「일본의 권한 있는 당국」이 수락하면 자신은 언제라도 트루먼과 연락할 수 있다. 트루먼과 처칠이 함께 포츠담에 있는 지금, 즉 삼국회담 중에 전쟁을 끝내는 것이 가장 좋다고 재삼 되풀이했다.", "덜레스는 또 소련이 일단 영미에 가담하게 되면 전쟁 종결은 좀처럼 간단히 되지 않을 것이라 말했고, 야콥손도 전적으로 동감이라 했다.", "그루 성명이 일본 황실과 국체에 조금도 언급하지 않은 점을 놓치지 말아 달라는 것이 야콥손의 요지이며, 일본 측이 황실·국체 문제에 지나치게 매달리면 미국 측은 이를 일본 군인의 「트릭」으로 해석할 우려가 있다고 경고했다.", "덜레스 측 감상: ①미국 측이 일본 황실에 대한 반대 선전을 하고 있지 않고 ②궁성을 고의로 폭격하고 있지 않으며 ③그루 성명 중에 일본 황실 또는 헌법을 언급하고 있지 않다는 것이 중요한 사실이며, 그루 성명이 제기하는 「무조건 항복」을 수락하고 가능한 한 속히 전쟁을 끝내는 경우에 일본은 황실 및 국체를 확보할 「베스트 찬스」를 갖는다는 것이다.", "야콥손은 영국이 자국 황실 관계상 일본 황실의 안태를 바라는 것은 자명하며, 설사 미국이 강화조건으로 국체 변경을 제안하는 일이 있어도 영국은 반드시 반대하고 그런 문제는 일본 자신에게 맡길 것이 틀림없다고 말했다.", "이번 「어프로치」는 기타무라 개인의 생각으로 순전히 「프라이빗 앤드 퍼스널」한 것임을 덜레스에게 충분히 전하게 했으나, 덜레스는 기타무라의 배후에 누군가가 있다는 것도 추찰하고 있는 모양이라 한다.", "결국 「비공식적인 타진」으로서는 이 이상의 성과를 가져올 수 없으며, 가령 반공식 회담에 들어가더라도 황실과 국체 문제를 확보할 수 있을지는 기타무라의 인상으로는 「네거티브」한 결과가 될 것이라 한다. 어쨌든 그루 성명은 숙독 완미할 필요가 있다.", "付記二의 「볼티모어 선」 논조는 무조건 항복이 이미 성명된 대일 화평의 일반 성질과 병립하는 것이며 「그것이 카이로 선언에 보이고 있음은 일본도 이를 숙지하고 있다」고 적어, 카이로 선언을 명시적으로 거론한다."], "primary": "## 第七九六號（관장부호, 친전, 극비）\n\n**ベルン 7月21日 前1時13分 發 / 本省 7月24日 前8時00分 着**\n\n一、현재 오카모토 중장(岡本中將)과는 근본에 있어 의견을 같이하며, 국제결제은행의 임원인 기타무라(北村)와 요시무라(吉村) 두 사람의 「이니셔티브」로서 그 동료인 중립국인을 통해 미국 측의 의향을 탐색하는 바를 보고드려, 정부께서 대결심(大決心)을 하심에 조금이나마 이바지하고자 하는 염원이다.\n\n동 중장에게는 전적으로 본사(本使)의 책임 및 한 개인의 생각으로 동감을 이끌어 두었던 것이며, 요사노 서기관(與謝野書記官)은 전혀 동의하지 않고 쓰루오카(鶴岡) 이하의 관원은 아무것도 관지(關知)하지 않는다는 것을, 귀전 합 제501호(貴電合第五○一號)와의 관계도 있어 특별히 말씀드린다. 또한 상대편의 모략에 걸려들 우려가 없지 않다는 것과, 또 공연히 우리 쪽이 약한 기색을 보인 것처럼 되지 않도록, 아울러 기밀 보지(保持)상 주의하고 있음은 물론이다.\n\n二、난국 타개 방책에 관한 생각은 5월 14일 전보로 참고에 제공해 두었던 바, 이 생각은 오늘도 변함이 없다. 다만 한 가지, 정부께서 대결심을 하시는 경우 이야기를 꺼내는 방법으로서는, 그 후의 정세를 관찰하여 오히려 단도직입으로 주된 상대인 미국에 이야기를 밀고 들어가는 것이 상책이라 여기는 쪽으로 기울고 있으니 참고까지 말씀드리고자 한다.\n\n三、기타무라와 요시무라가 결제은행의 스웨덴인 경제고문 「야콥손」(약력은 별전대로. 국제연맹 시대에 하라다 공사(原田公使)와 친교가 있었던 모양)을 통하여, 얼마 전까지 미국 공사관 특별고문이라는 명목으로 이 땅에 체재하며 「루스벨트」의 사설 대표라고 소문났고 예의 북부 이탈리아 독일군 대(對) 미영군 간 최후 교섭의 흑막이었던 것이 확실하다고 인정되는 미국인 「덜레스(ダラス)」(약력은 별전대로)에게 여러 가지를 물어본 결과로서, 기타무라로부터 청취한 바에 의하면, 「덜」의 말이라는 것, 특히 「덜」과 회담한 뒤의 「야(ジヤ)」의 인상·소감 가운데에는 상당히 참고가 되리라 생각되는 것이 있다. 현재로서는 확실히 하나의 좋은 줄기라고 인정되므로, 상세는 기타무라의 「메모」(엄중 보관 중)에 의한 별전 제797호를 사열(査閱)하여 주시기 바란다.\n\n---\n\n## （別電一） 第七九七號（관장부호）\n\n**ベルン 7月21日 後0時28分 發 / 本省 7月23日 後1時45分 着**\n\n〔편자 방주: （一、欠ヵ）＝「一、」이 빠진 듯〕\n\n7월 10일 「바젤」에서 요시무라가 동석한 자리에서 「야콥손」과 제1회 회담. 미리 요시무라가 오카모토 씨의 의뢰를 받아 「야」에게 말해 두었던 「일본 황실 및 국체에 관한 미국 의견 탐색의 건」을 새삼 소생(小生)이 의뢰하다.\n\n「야」는 이미 여러 차례에 걸쳐 「바젤」에 있는 Dulles의 부하 Shea를 만나고 있다. 또 「덜」의 비서는 자주 스위스에 오므로 「덜」은 물론 본건을 알고 있다고 한다.\n\n기타무라는 「야」에 대해, 일미 전쟁이 그치는 것은 단지 일미 양국의 이익만이 아니라 나아가 유럽의 부흥, 세계 인류를 위해서도 되는 일이지만, 미국이 공연히 무조건 항복을 요구할 때에는 그 실현이 심히 곤란하다. 그러나 일본 황실 및 국체에 영향이 없다는 미국 의향이 확실해지면 자신은 전력을 다하여 전쟁 종결로 이끌도록 노력하겠다고 말하다.\n\n「야」는 이 이야기는 「덜」이 꺼내는 것이 가장 좋다고 하며 「덜」의 인물과 수완을 설명하고, 특히 북부 이탈리아 공작에 관한 그의 공적을 서술했으며, 또 개인적으로도 매우 친밀한 사이라 한다.\n\n같은 날 저녁 「야」의 보고는, 기타무라가 「덜」을 만나는 것은 시기가 아직 이르며〔편자 방주: （尙早ヵ）〕, 또 위의 두 건을 국무성이나 대통령에게 전하여 만약 회답을 받는 일은 미국의 정치 기구상 수 주일을 요할 뿐 아니라 그동안 외부에 새는 경우 「처칠」과도 상담을 요하여 쉬운 일이 아니고 아마 성공하지 못하고 끝날 것이라고 한다.\n\n二、7월 13일 「바젤」에서 요시무라가 동석한 자리에서 「야」와 제2회 회담.\n\n（イ）「야」는 핀란드, 이탈리아, 루마니아, 헝가리의 예를 인용하여, 미국은 이들 나라의 위정자 내지 황실에 대해 아무런 간섭도 하고 있지 않다, 이 사실은 미국 측의 비공식 의견보다도 훨씬 확실하지 않은가〔（ママ）〕라고 역설하며, 기타무라의 제안을 오히려 쓸데없는 일인 것처럼 말한다.\n\n（ロ）이에 대해 기타무라는 일본에 있어서 황실과 국체의 특수성을 강조하고, 만약 이것이 견지된다면 전쟁 종결의 최대이자 유효한 동기가 될 수 있는 것이다, 이 문제에 손대지 않고 공연히 일본에 대해 전쟁을 그만두는 편이 좋다고 말해 보아야 아무런 효과도 없을 것이라고 설득하여, 겨우 「야」를 납득시켰다.\n\n「야」는 될 수 있는 대로 노력하겠다고 기타무라에게 맹세하다.\n\n三、（イ）「야」는 7월 14일 토요일 두 시간 및 15일 일요일 다섯 시간, 「덜」의 「비스바덴(ウイスバアデン)」 사택에서 「덜」과 이야기를 했다 한다. 이하 （ロ） 내지 （ヌ）는 위 회담에서 돌아와 7월 16일 「야」가 기타무라 및 요시무라에게 내밀히 이야기한 바이다.\n\n（ロ）「덜」이 본건에 대해 열심인 것은, 「바젤」에 있는 「야」에게 비행기 또는 자동차를 제공한 것(비행기는 눈에 띌 우려가 있으므로 왕복 모두 자동차로 했다 한다), 경우에 따라서는 현재의 일을 일체 그만두고 이 일에 매달려도〔（ママ）〕 좋다고 「야」에게 말한 것으로도 알 수 있다.\n\n（ハ）「덜」은 「야」에 대해, 일본을 위해 무언가를 구할 유일한 길은 7월 10일 「그루」 성명서(별전 제800호. 「베른」 미국 공사관 배포 일반정보에 의함)에 있는 의미의 「언컨디셔널 서렌더(アンコンチシヨナルサレンダー)」를 즉시 수락하는 것이며, 「컴피턴트 오소리티 인 재팬(コンペテントオーソリチイインチヤパン)」이 이를 수락한다면 자신은 언제라도 「트루먼」과 연락을 취할 수 있다. 그런데 현재 「트」가 「포츠담」에 있고 「처칠」 또한 같은 곳에 있을 때가 가장 손쉽게 이야기가 붙기 쉬우므로, 일본이 전쟁을 종료하는 것은 삼국회담 중이 가장 좋지 않겠는가라고 재삼 되풀이했다 한다. 물론 일미 군 수뇌부가 동아(東亞)의 어느 곳에 모여 휴전협정을 맺는 절차는 있겠지만, 총포(鐵砲)를 맞부딪는 것은 즉좌에 그칠 수 있다. 앞으로 소련이 일단 영미에 참가하기에 이르면 전쟁 종결은 좀처럼 간단히 되지 않게 될 것이라고 「덜」도 말했다 하는데, 「야」도 지극히 동감이라는 뜻을 기타무라에게 말했다. 또 「야」는 기타무라에게, 오늘 전쟁이 종료되면 「트루먼」의 큰 공적이 된다, 그는 반드시 일본에 대해 호의를 갖게 될 것이다, 이것이 미국 정치가의 심리라고 말했다.\n\n（ニ）「그루」의 성명서는 약 한 달 전 「덜」이 워싱턴(華府)에 돌아갔을 때 「그」가 다듬고 다듬어 초안을 만들고 있던 것으로 「덜」도 상담에 참여했다 한다. 이 성명서 가운데 조금도 일본의 황실 및 국체에 손대고 있지 않은 점을 놓치지 말아 주기 바란다고 「야」는 말한다.\n\n「야」는, 만약 일본 측이 황실과 국체 문제에 너무 「스틱(スチツク)」하면 미국 측은 이를 일본 군인의 「트릭(トリツク)」으로 해석할 우려가 있다고 한다. 그 뜻은, 「그」의 성명서에 있는 것과 같이 무조건 항복이란 일본을 오늘의 불행으로 이끈 군 수뇌부 세력의 종결을 의미한다고 말하고 있는 데 대해, 일본 군인이 황실과 국체의 그늘에 숨어 자기 세력의 존속을 도모하는 것이 아닌가 하는 의념(疑念)을 낳게 한다고 서술했다.\n\n（ホ）「야」는, 일본이 「그루」와 같은 친구를 갖고 있는 것은 더할 나위 없는 행복이 아닌가, 「나치스」 독일에는 「그」가 한 사람도 없어 이야기를 붙이려 해도 그 방도가 없었으나, 이와 반대로 일본에 대해서는 「그」를 비롯해 일본을 생각하는 사람이 있다, 「그」 성명서도 말하자면 저쪽에서 손을 내밀고 있는 것과 같은 것이 아닌가라고 말한다. 이러한 친구의 숨이 끊어지지 않는 동안에 이야기를 붙이는 것이 필요하다고 설득한다. 위 성명서에는 모순은 있으나 그곳이야말로 「그」의 고심이 있는 곳이 아니겠느냐고 되풀이하고 있었다.\n\n（ヘ）「야」는 또, 영국이 자국 황실과의 관계상 일본 황실의 안태(安泰)를 바라는 것은 자명한 이치이며, 따라서 가령 미국으로부터 강화 조건으로서 국체의 변경을 제안하는 것과 같은 일이 있다 하더라도 영국은 반드시 반대하고, 그러한 문제는 일본 자신에게 맡기는 데 틀림없을 것이라고 말했다.\n\n（ト）「야」가 미국 여론에 대해 좋은 인상을 줄 최선의 길은 무엇이냐고 물은 데 대해, 「덜」은 the safest way to take the risk〔편자 방주: （is ヵ）〕라고 답했다. 「야」가 「덜레스」와의 회담에서 얻은 인상으로는, （イ）미국 측이 일본 황실에 대한 반대 선전을 그치고 있지 않다는 것, （ロ）궁성(宮城)을 고의로는 폭격하고 있지 않다는 것, （ハ）「그루」 성명서 중에 일본 황실 또는 헌법에 관한 것을 「멘션(メンシアン)」하고 있지 않다는 것은 중요한 사실이며, 「덜」 등의 감상으로서는, 「그루」 성명서 중에 제의되어 있는 것과 같은 「언컨디셔널 서렌더(アンコンデシヨナルサレンダー)」를 수락하고 이 전쟁을 가능한 한 신속히 종지(終止)하는 경우에 있어서 일본은 황실 및 국체를 확보할 「베스트 찬스(ベストチヤンス)」를 갖는다는 것이다.\n\n（チ）이번의 「어프로치」는 기타무라 개인의 생각으로 순연한 「프라이빗 앤드 퍼스널」한 것이라 하여 「야콥손」으로 하여금 「덜레스」에게 단단히 전하게 했다. 따라서 「덜」도 이번의 타진이 「컴피턴트 앤드 리스판서블 오소리티즈 인 재팬(コンペテント アンド レスポンスブル オーソリチイズ イン ヂヤパン)」에서 나오고 있다는 아무런 「에비던스」도 없어, 「그루」의 성명서에 서술하고 있는 것과 같은 종류의 것을 벗어나지 못한다고 말했다 한다. 다만 「덜」은 기타무라의 이름과 존재를 약 반년 전부터 잘 알고 있다 하며, 게다가 「야」는 기타무라 및 요시무라라는 자에 대해 설명했다 한다. 물론 이 「어프로치」가 「페던틱(ペダンチツク)」한 것이 아님은 「덜」도 충분히 이해하고 있으나, 기타무라의 배후에 누군가가 있다는 것도 「덜」이 추찰하고 있는 모양이라는 것이다.\n\n（リ）결국 「언오센틱(アンオウセンチツク)」한 「사운드(サウンド)」로서는 이 이상의 성과를 가져올 수는 없다고 생각되며, 또 가령 반공식 회담에 들어가더라도 황실과 국체 문제를 확보할 수 있을지 어떨지, 기타무라의 인상으로서는 「네거티브」한 결과가 될 것이다. 어쨌든 「그루」 성명서는 숙독 완미(熟讀玩味)할 필요가 있다.\n\n추후 본건에 관해 「트루먼」의 「퍼스널 오피니언」만이라도 탐색할 수 없을까 고심했으나, 「야」의 보고에 의하면 미국의 정치 조직이 반드시 대통령의 생각대로 여러 사건을 해결할 수 있는 짜임새로 되어 있지 않음과 아울러 「트루먼」이라는 인물은 쉽사리 이러한 문제에 대해 의견을 토(吐)하지 않을 것이라는 추측이어서, 결국 성공하지 못하고 끝났다. 「덜」은 처음부터 「트」의 의견 탐색과 같은 문제로 삼고 있지 않았다 한다.\n\n（ヌ）「덜」은 「야」의 이야기를 「그루」에게만 전보하겠다고 말했으나, 「야」는 물론 「트루먼」에게 전했으리라 생각한다고 기타무라에게 말했다.\n\n四、「야」가 본건을 대단히 열심히 다루며 분주히 뛰고 있는 동기는 대체로 다음 세 가지 점에 있는 듯하다(기타무라의 인상).\n\n（イ）그 자신의 인생관인 평화 및 협조.\n\n（ロ）일본인에 대한 호감.\n\n（ハ）오늘 일본이 전쟁을 그만두어 준다면 유럽 여러 나라는 얼마나 구제될지 모른다. 만약 일본 황실이 스스로 평화를 제기하신다면 황실에 대한 인기는 대단할 것이라고 그는 말한다. 덧붙여 그의 경제 관찰에 의하면 일본이 오늘 전쟁을 그만두면 25년이면 회복할 수 있다고 한다. 그는 국제결제은행에서 파면된다 하더라도 스웨덴에 돌아가면 훌륭히 먹고 살 길이 있으므로 본건에 분주한 것과 같은 일은 좋아서 하는 것이라고 말한다(국제결제은행은 정치에 관여하지 않는다는 건전(建前)으로 되어 있다).\n\n---\n\n## （別電二） 第七九八號（관장부호）\n\n**ベルン 7月21日 前1時21分 發 / 本省 7月24日 前7時30分 着**\n\n**Jacobsson의 경력**(본인이 요시무라에게 말한 바에 의함)\n\n스웨덴인, 1894년생. 부인은 아일랜드인. 그 아우는 Sir Abchbald〔편자 방주: ？〕 Nye 중장으로 영국 참모본부 차장이며 사실상 참모본부를 도맡아 꾸려 나가고 있다.\n\n一、스웨덴 Npsala 대학 졸업.\n\n二、1920년—28년 국제연맹 임원 금융경제부원. 오스트리아, 헝가리, 「단치히」, 불가리아 등의 금융 부흥 고문으로서 역주(歷駐)하다.\n\n三、〔편자 방주: ？〕 54세로 위를 사임하고 스웨덴 국방성 경제부 비서장(소장 격).\n\n四、1934년 일체의 공직을 사임하다. 동시에 국제연맹 군비축소부장 또는 스웨덴 경제대신 취임 교섭이 있었으나 모두 사퇴하다. 결국 「바젤」 주재 국제결제은행 경제고문을 수락하다.\n\n五、1938년 전운이 가까움을 알고 고국에 돌아가 딸의 교육에도 편하게 하려고 생각하여 사표를 제출, 「스톡홀름」에 셋집 계약까지 맺었으나, 각 중앙은행 총재로부터 중립국인으로서 공평한 견해를 가진 경제고문은 더욱더 필요하다는 이유 아래 유임을 강권받아 사임하지 못하고 머무르다.\n\n六、1937—38년 「아일랜드」 은행위원회 위원에 취임, 매년 출석하여 폐제(幣制) 개혁, 중앙은행 설립에 노력하고, 항상 De Valera와 회의하여 정치 문제에까지 미치다. De Valera 측근자가 흘린 바에 의하면 그의 식견이 사람을 움직이는 바가 많아, 1938년 1월 「아일랜드」·영국 정부 간 교섭을 개시하기에 이르게 하여 「아일랜드」 경제 봉쇄의 위험을 피하게 하다. 중앙은행 성립을 계기로 사임했으나 다시 동국 정부 경제고문으로서 유임을 간청받아 때때로 「더블린」에 가며, 현재에 이르러서도 예산 비평을 속행. 「더블린」 대학으로부터 명예박사 칭호를 받다.\n\n七、그동안 스웨덴 은행의 대어소(大御所) Marcus Wallenberg(1943년 사거), Montagne Norman의 지우(知遇)를 받아 연구에 지대한 편의를 제공받다. 1939년 7월 Norman에게 만일 개전하는 날에는 Sir Fredick Thillips를 워싱턴에 파견하여 금융 문제 교섭을 맡게 하는 것이 최선이라고 생각한다는 뜻을 suggest해 두었던 바, 위가 실현되어 Lend Lease 협정의 성공을 보다.\n\n八、1941년 국제상업회의소 「카네기」 재단으로부터 의견을 구해 받아 뉴욕·워싱턴에 가다(금년 8월 「록펠러」 재단으로부터 전후 금융경제 문제 의견 상신을 위해 뉴욕·워싱턴에 초청받다).\n\n九、1945년 5월 핀란드 외무성으로부터 자문을 위해 초청되어 각 대신과 수차에 걸쳐 토의, Paarikivi〔편자 방주: （Paasikivi ヵ）〕 수상과는 두 차례에 걸쳐 토의. 부득이 핀란드 외무성과 「헬싱키」 주재 영국 대표 사이의 교섭 중개까지 인수하다.\n\n三、〔원문대로. 항목 번호가 어긋나 있다〕 4월 중 런던 체재 중 영란은행(英蘭銀行) 안에 숙박을 허가받고 자유로이 총재와 오찬을 허가받아 사무상 크게 도움을 받다.\n\n十、전(前) 이탈리아 은행 총재 「아초리니(アツオリニ)」가 독일과 협력했다는 죄목으로 재판에 회부되었을 때 그를 돕기 위해 노력하여, 「아」는 사형을 면하였다.\n\n---\n\n## （別電三） 第七九九號（관장부호）\n\n**ベルン 7月21日 前1時10分 發 / 本省 7月24日 前9時10分 着**\n\n**Dulles의 약력**(Jacobsson이 요시무라에게 말한 바에 근거함)\n\nDulles, Allen Welsh 미국인 변호사\n\n1893년 4월생\n\n「프린스턴」 기타의 대학에 유학하다\n\n1910년 5월 17일 국무성에 들어가다\n\n1918년 12월 평화교섭위원으로서 파리(巴里)에 오다\n\n1922—26년 국무성 근동국장, 그 후에는 제네바(壽府) 주재, 각종 국제회의 위원을 역임하다\n\n1927년 제3회 해군협정회의의 법률고문 기타 국제적으로 미국을 대표하다\n\n1927년 8월 변호사가 되다\n\nHenry schroeder banking corp, Schroeder trust Co,의 중역이 되다\n\n1945년\n\n스위스 주재 미국 공사 특별고문의 자격으로 「베른」에 체재하고 있었는데, 그 의견은 미국 정부에 중시되었다. 현재는 미 점령군 관계 중앙기관이 있는 「프랑크푸르트 암 마인」 부근에 체재 중이다.\n\n---\n\n## （別電四） 第八○○號\n\n**ベルン 7月21日 後0時28分 發 / 本省 7月23日 後4時20分 着**\n\n〔英文 그대로 게재. 번역하지 않는다.〕\n\nAsked to comment upon continued newspaper and radio reports that this Government has received peace offers from the Japanese Government, acting Secretary Grew, today July 10, 1945 made the following statement:\n\n“The situation today is exactly the same as it was on June 29 when I made my last statement on this subject. We have received no peace offer from the Japanese Government, either through official or unofficial channels. Conversations relating to peace have been reported to the Department from various parts of the world, but in no case has an approach been made to this Government, directly or indirectly by a person who could establish his authority to speak for the Japanese Government, and in no case has an offer of surrender been made. In no case has this Government been presented with a statement purporting to define the basis upon which the Japanese Government would be prepared to conclude peace. The alleged peace feelers have invariably been inquired as to our position. On one occasion leading Japanese industrialists were reported as wanting to know the best possible condition, the Allies would advance or compromise peace. On another occasion, the representative in Tokyo to a neutral government reported that he had been told by a private Japanese individual that the Japanese could not accept unconditional surrender because it would mean loss of face. On still another occasion a member of the staff of the Japanese Mission to a neutral country intimated to an American citizen through a German newspaper man that real American interest in the Far East should lead the United State to abandon unconditional surrender and propose terms for a negotiated peace.\n\nFinally an unidentified person approached an American Mission in a neutral country, claiming that he had been authorized (by whom was not indicated) to approach the government of the neutral country with a view to persuading the Allies to drop unconditional surrender and to propose terms. It should be borne in mind in this connection that the Japanese, like the German before them, rely upon the hope that they may be able to divide the allies and to produce division of opinion within the allied countries. To that end, it would be to their interest, as they see their interest, to initiate a public discussion of the terms to be applied to Japan. This they have already attempted to do on several occasions through radio Tokyo.\n\nFurthermore, it should be remembered that peace feelers are familiar weapons of psychological warfare and will be used as such by the Japanese, particularly now that their military position is deteriorating and the condition of their civilian population becomes more critical. I pointed out in a speech on Navy Day a year ago — on October 27, 1944 — that efforts would undoubtedly be made by the Japanese to work dissatisfaction between the allies. In that speech I said: Wish to take this important occasion to repeat, with all possible force, the warning which I have continually tried, all over the country, to drill home into the consciousness of our people, namely, that we must not, under any circumstances, accept a compromise peace with Japan, no matter how alluring such a peace may be or how desirous we may become of. Some of them, perhaps only a few at the present time, but the number will grow steadily know beyond peradventure that they are going to be defeated. Before the complete ruin of Japan, these men are almost certain to make an attempt to save something from the wreckage. They would probably offer to withdraw their troops from the occupied areas and return those areas to their fromer 〔편자 방주: (former ヵ)〕 status. They might even offer to give up their control of their puppet state in Manchuria. All this they might offer to do if only we would agree to leave their homeland free of further attack.\n\nShould that moment come, America, the united nations, would be put to a most severe test. The temptation to call it a day might be stronger than we can now visualize. That, my friends, would be the moment to fear, not for ourselves but for our sons and grandsons, lest they should have to fight this dreadful war over again in the next generation. For assuredly if we should allow ourselves to relax before carrying to completion our present determination to render the Japanese impotent ever again to threaten world peace, that would be the fate of our descendants. That cancerous growth of Japanese militarism would follow the example of the German war machine after 1918, perpetuate itself and prepare Japan again for some future Armageddon. I have no fears as to the nature of our decision, so long as our people fully understand the dangers of a compromise peace, but let us be warned in time. The nature of the purported peace feelers must be clear to everyone. They are the usual move in the conduct of psychological warfare by a defeated enemy. No thinking American, recalling Pearl Harbor, Wake, Manila, Japanese ruthless aggression elsewhere, will give them credence.\n\nJapanese militarism must and will be crushed. The policy of this government has been, is, and will continue to be unconditional surrender. Unconditional surrender does not mean, as the President pointed out in his message of June 1 1945, the destruction or enslavement of the Japanese people. The President stated this very specifically on May 8 when he said answer to the question “just what does the unconditional surrender of the armed forces mean for the Japanese people”.\n\n“It means the end of the war. It means the termination of the influence of the military leaders who have brought Japan to the present brink of disaster. It means provision for the return of soldiers and sailors to their families. It means not prolonging the present agony and suffering of the Japanese in the vain hope of victory”.\n\nThe policy of this Government has been, is, and will continue to be, unconditional surrender as defined by the President in these statement. That is the best comment I can make upon peace feelers and rumors of peace feelers of whatever origin”.\n\n---\n\n## （付記一） 第四六七號\n\n**ストックホルム 7月11日 後5時30分 發 / 本省 7月12日 前7時00分 着**\n\n11일 이곳 각 신문은 워싱턴발 전보라 하여 다음과 같이 보도하고 있다.\n\n10일 「그루」는, 미국 정부로서 일본 정부로부터 공식 또는 비공식으로 화평 제의에 접한 일이 없으나, 국무성이 얻은 보고에 의하면 두세 갈래의 줄기를 통하여 화평 교섭에 관한 이야기는 있으며, 실제로 어느 중립국에서 어떤 익명의 인물이 미국 외교관을 찾아와 연합 측이 무조건 항복을 버리고 다른 조건을 제시하도록 중립국 정부로 하여금 알선하게 할 권한을 부여받았다고 말한 일이 있다. 이러한 일본의 「피스 필러(ピースフイーラー)」는 보다 나은 조건을 얻기 위해 연합 측을 분열시키려는 것에 다름 아니다. 미국 정부로서는 현재는 물론 장래에 있어서도 무조건 항복을 견지하는 것이라고 언명했다.\n\n---\n\n## （付記二） 瑞西情報第二四九號\n\n**ベルン 7月24日 後3時57分 發 / 本省 7月25日 後5時35分 着**\n\n（23일） 일본의 화평설에 대한 「그루」 성명에 관한 미국 신문 논조(13일·14일·24일 BKB)\n\n一、「워싱턴 스타」 11일\n\n「그루」 성명으로부터 결론을 내릴 수 있다면 미국 정부는 무조건 항복에서 한 걸음도 물러서지 않을 것이라는 점인데, 동 성명은 명확을 결하는 혐의가 있다. 미국은 이미 무조건 항복이란 일본 국민의 근절 또는 노예화를 가져오는 것이 아니라고 정식으로 성명했으나, 위가 무엇을 의미하는지를 이해시키는 포괄적 성명은 아니다. 그러므로 만약 미국 정부가 일본에 부과하려는 조건을 적당히 명시하면 일본의 항복 시기를 촉진하는 것이 아니겠느냐는 책임 있는 줄기로부터의 「서제스천(サゼスチヨン)」도 있을 정도이다. 위는 물론 타협 화평(妥協和平)을 말하는 것이 아니며, 그 점은 확연히 구별하여야 할 것이 당연하다. 그러나 「그루」의 어투로부터 생각건대, 미국 정부는 일본에 대해 그러한 양보를 보일 의향이 없는 모양이며, 이번 대전을 지도하는 미국 요인의 열력(閱歷)으로 보아 정부가 취하는 태도는 충분히 이유가 있다는 신뢰감을 일으키게 하려는 것인 듯하다.\n\n二、「워싱턴 포스트」 13일\n\n「그루」 성명과 같이 일본의 미국에 대한 「어프로치」가 정식 기관을 통하지 않고 애매하며 내용이 빈약한 것이라 하면, 위는 화평의 강제(强制)가 되기에 충분하지 않으며 국무성이 이를 무시한 것은 정당할 것이다. 다만 동 성명은 미국이 추구하는 전쟁 목적을 단지 일본에 대해서뿐 아니라 미국민, 그중에서도 전선의 미군 장병에게도 제시하여야 하는가 하는 주요 문제와는 아무런 관련이 없다. 우리는 성명을 「페이스 밸류(フエースバリユー)」로 받아들이지 않으면 안 된다.\n\n三、「볼티모어 선」 12일\n\n누구나 태평양 전쟁의 조기 종료를 요망하고 미국 장병의 생명을 구하기 위한 정책에 호의를 갖고 있으나, 무조건 항복 이외의 화평 조건을 창도하는 소리는 들리지 않는다. 미국 측에서 화평 조건에 관해 거래를 하겠다는 의향을 보이면 일본은 이를 미국의 전쟁 피로 또는 약체의 징후라고 해석하여 도리어 완강한 저항을 할 것이다.\n\n무조건 항복은 이미 성명된 대일 화평의 일반 성질과 병립하는 것으로서, 그것이 「카이로」 선언에 보이고 있음은 일본도 이를 숙지하고 있다. 「루스벨트」 및 「트루먼」도 누차의 성명에서 무조건 항복을 되풀이하고 있다. 연합 측으로서는 위 성명을 넘는 행위를 하지 않을 것이다. 일본의 지도자가 불가피한 사실 앞에 신속한 조정을 한다면, 일본이 국민 생활의 재건에 착수할 수 있는 물질적 기초는 그만큼 잃는 바가 적을 것이다.\n\n四、뉴욕 「타임스」 19일\n\n일본은 미국 정부에 대해 비공식으로도 화평의 타진을 행한 일이 없다는 「그루」의 부정이 있었으나, 화평의 소문은 여전히 성하며, 워싱턴 및 런던에서는 일본을 무장 해제하고 그 점령 지역을 박탈하되 독일과 달리 그 이외의 요구는 하지 않는다는 타협 화평의 풍설이 있다. 만약 이에 의해 태평양 전쟁의 조기 종료가 성공하고 장래 일본이 무해한 존재가 된다고 하면, 이를 고찰할 충분한 가치가 있다. 일찍이 「루스벨트」가 독일에 대해 서술한 것과 같이 「트루먼」은 무조건 항복은 일본 국민의 근절 또는 노예화가 아니라고 성명했는데, 만약 일본이 그러한 조건 위에서 항복한다고 하면 더할 나위 없이 좋다고 말할 수 있을 것이다.", "secondary": "963昭和20年7月21日東鄕外務大臣宛（電報）在スイス加瀨公使より岡本陸軍武官等による国際決濟銀行経濟顧問ヤコブソンを通じたダレス工作について\n\n別電の昭和二十年七月二十一日發在スイス加瀨公使より東鄕外務大臣宛第七九七号国体護持への米国側認識に関一るダレス發言振り二昭和二十年七月二十一日發在スイス加瀨公使より東鄕外務大臣宛第七九八号ヤコブソン、経歷にっいて三昭和二十年七月二十一日發在スイス加瀨公使より東鄕外務大臣宛第七九九号ダレス、経歷にっいて\n\n四昭和二十年七月二十一日發在スイス加瀨公使より東鄕外務大臣宛第八○○号対日和平に関一る「グルー声明」にっいて\n\n付記の昭和二十年七月十一日發在スウエーデン岡本公使より東鄕外務大臣宛電報第四六七号「グルー声明」に関一る報道にっいて二昭和二十年七月二十四日發在スイス加瀨公使より東鄕外務大臣宛電報瑞西情報第二四九号「グルー声明」に対一る米紙論諷にっいて\n\nベルン7月21日前1時13分發\n\n本省7月24日前8時00分着\n\n第七九六號（館長符號、親展、極祕）\n\n(1)\n\n一、現在岡本中將トハ根本ニ於テ同意見ニテ國際決濟銀行ノ役員タル北村及吉村カ兩人ノ「イニシヤチブ」トシテ其ノ同僚タル中立國人ヲ通シ米國側ノ意向ヲ探ル所ヲ御報告シ政府ニ於カレ大決心ヲナサルルニ何等資シ度キ念廳ナリ\n\n同中將ニハ全ク本使ノ靑任及一個ノ考ニテ同感ヲ來シ置キタルモノニテ與謝野書記官ハ全然不同意鶴岡以下ノ館員ハ何等關知セサルコトヲ貴電合第五○一號ノ關係モアリ特ニ申上ク尙先方ノ謀略ニ引縣ル惧ナキニアラサルコトト又徒ラ\n\n(2)\n\nニ我方カ弱氣ヲ示シタルカ如キコトニナラサル樣將又機密保持上ニ注意シ居ルコト勿論ナリ\n\n二、難局打開方ニ關スル考ハ五月十四日電ニテ御參考ニ供シ置キタル處此ノ考ハ今日モ變リナク唯一ツ政府ニ於カレ大決心ヲナサルル場合話ノ持出シ方決トシテハ其ノ後ノ情勢ヲ觀察シ學ロ單刀直入主タル相手タル米國ニ話込ムヲ以テ上策ト考フルニ傾キ居リ御參考迄申上ケタシ\n\n三、北村及吉村カ決濟銀行ノ瑞典人經濟顧問「ヤコブソン」（略歷別電ノ通リ聯盟時代原田\n\n(3)\n\n公使ト懇意ナリシ模樣）ヲ通シ先頃迄米國公使館特別顧問ナル名目ニテ當地ニ滯在シ「ローズベルト」ノ私設代表ナリト噂サレ例ノ北伊獨逸軍對米英軍間最後交涉ノ黑幕タリシコト確シカト認メラル米人「ダラス」（略歷別電ノ通）ニ色々聞キタル結果トシテ北村ヨリ聽取スル所ニ依レハ「ダ」ノ言ナルモノ殊ニ「ダ」ト會談後ノ「ジヤ」ノ印象、所感中ニハ隨分御參考トナルヘシト思ハルルモノアリ現下惱カニ一ノ良キ筋ト認メラルルニ付「グ北村ノ「メモ」（嚴重保管中）ニ依ル別電第七九七號御査閱ヲ請フ\n\n（別電の）\n\nベルン7月21日後0時28分發\n\n本省7月23日後1時45分着\n\n第七九七號（館長符號）\n\n(1)□一、欠カ）\n\n七月十日「バアゼル」ニテ吉村同席ノ下ニ「ヤコブソン」ト第一囘會談豫メ吉村カ岡本氏ノ依賴ヲ受ケテ「ヤ」ニ話シ置キタル「日本皇室及國体ニ關スル米國意見探索ノ件」ヲ更メテ小生ヨリ依賴スル\n\n「ヤ」ハ旣ニ數囘ニ亘リ「バーゼル」ニ居ル□Dullesノ子分Sheaニ會ツテ居ル又「ダ」ノ祕書ハ屢々瑞西ニ來ルノテ「ダ」ハ勿論本件ヲ承知シテ居ルト云フ\n\n北村ハ「ヤ」ニ對シ日米戰爭カ熄ムコトハ單ニ日米兩國ノ利益丈ケテハナイ惹イテハ歐洲ノ復興世界人類ノ爲ニモナルカ米國カ徒ラニ無條件降伏ヲ要求スルトキハ其ノ實現甚タ困難テアル乍倂日本皇室及國体ニ影響ナシトノ米國意向カ確カニナレハ自分ハ全力ヲ盡シテ戰爭終結ニ導クヘク努力スルト言フ\n\n「ヤ」ハ此ノ話ハ「ダ」カ\n\n(2)\n\n持チ出スコトカ一番ヨロシイトシ「ダ」ノ人物手腕ヲ說キ特ニ北伊丁作ニ關スル同人ノ功績ヲ述ヘ又個人的ニモ眠懇ノ由\n\n同日夕刻「ヤ」ノ報告ハ北村カ「ダ」ニ會フコトハ時期□尙早カ）\n\n早尙又右二件ヲ國務省ヤ大統領ニ傳ヘ若シ返事ヲ取 Americaninterestinthe,FarEastshould,lead,the,United,State,to,abandonunconditionalsurrenderandproposetermsforanegotiatedpeace.\n\nFinally an unidentified person approached an American Mission in a neutral country, claiming that he had been authorized (by whom was not indicated) to approach the government of the neutral country with a view to persuading the Allies to drop unconditional surrender and to propose terms. It should be borne in mind in this connection that the Japanese, like the German before them, rely upon the hope that they may be able to divide the allies and to produce division of opinion within the allied countries. To that end, it would be to their interest, as they see their interest, to initiate a public discussion of the terms to be applied to Japan. This they have already attempted to do on several occasions through radio Tokyo. Furthermore, it should be remembered that peace feelers are familiar weapons of psychological warfare and will be used as such by the Japanese, particularly now that their military position is deteriorating and the condition of their civilian population becomes more critical. I pointed out in a speech on Navy Day a year ago｜1on○ctober27,19xx｜1that efforts would undoubtedly be made by the Japanese to work dissatisfaction between the allies. In that speech I said: Wish to take this important occasion to repeat, with all possible force, the warning which I have continually tried, all over the country, to drill home into the consciousness of our people, namely, that we must not, under any circumstances, accept a compromise peace with Japan, no matter how alluring such a peace may be or how desirous we may become of. Some of them, perhaps only a few at the present time, but the number will grow steadily know beyond peradventure that they are going to be defeated. Before the complete ruin of Japan, these men are almost certain to make an attempt to save something from the wreckage. They would probably offer to withdraw their troops from the occupied areas and return those areas to their fromer（former□）\n\nareasandreturnthoseareastotheirfromer status. They might even offer to give up their control of their puppet state in Manchuria. All this they might offer to do if only we would agree to leave their homeland free of further attack. Should that moment come, America, the united nations, would be put to a most severe test. The temptation to call it a day might be stronger than we can now visualize. That, my friends, would be the moment to fear, not for ourselves but for our sons and grandsons, lest they should have to fight this dreadful war over again in the next generation. For assuredly if we should allow ourselves to relax before carrying to completion our present determination to render the Japanese impotent ever again to threaten world peace, that would be the fate of our descendants. That cancerous growth of Japanese militarism would follow the example of the German war machine after 1918, perpetuate itself and prepare Japan again for some future Armageddon. I have no fears as to the nature of our decision, so long as our people fully understand the dangers of a compromise peace, but let us be warned in time. The nature of the purported peace feelers must be clear to everyone. They are the usual move in the conduct of psychological warfare by a defeated enemy. No thinking American, recalling Pearl Harbor, Wake, Manila, Japanese ruthless aggression elsewhere, will give them credence.\n\nJapanese militarism must and will be crushed. The policy of this government has been, is, and will continue to be unconditional surrender. Unconditional surrender does not mean, as the President pointed out in his message of June 1 1945, the destruction or enslavement of the Japanese people. The President stated this very specifically on May 8 when he said answer to the question “just what does the unconditional surrender of the armed forces mean for the Japanese people”. ”.“ It means the end of the war. It means the termination of the influence of the military leaders who have brought Japan to the present brink of disaster. It means provision for the return of soldiers and sailors to their families. It means not prolonging the present agony and suffering of the Japanese in the vain hope of victory”. ”.\n\nThe policy of this Government has been, is, and will continue to be, unconditional surrender as defined by the President in these statement. That is the best comment I can make upon peace feelers and rumors of peace feelers of whatever origin”. ”.\n\n（付記の）\n\nストックホルム7月11日後5時30分發\n\n本省7月12日前7時00分着\n\n第四六七號\n\n十一日當地各紙ハ華府發電トシテ左ノ如ク報シ居レリ十日「グルー」ハ米國政府トシテ日本政府ヨリ公式又ハ非公式ニ和平提議ニ接シタルコト無キモ國務省ノ得タル報告ニ依レハ二、三ノ筋ヲ通シ和平交涉ニ關スル話合ハアリ現ニ某中立國ニ於テ或ル匿名ノ人物カ米國外交官ヲ導ネ聯合側カ無條件降伏ヲ捨テ他ノ條件ヲ提示スル樣中立國政府ヲシテ幹旋セシムヘキ權限ヲ附與セラレタリト語リタルコトアリ斯ル日本ノ「ピースフイーラー」ハヨリ良キ條件ヲ得ンカ爲聯合側ヲ分裂セシメントスルモノニ他ナラス米國政府トシテハ現在ハ勿論將來ニ於テモ無條件降伏ヲ堅持スルモノナリト言明セリ\n\n（付記二）\n\nベルン7月24日後3時5g分發\n\n本省7月25日後5時35分着\n\n瑞西情報第二四九號\n\n（二十三日）日本ノ和平說ニ對スル「グルー」聲明ニ關スル米紙論調（十三日十四日二十四日BKB）\n\n一、「ワシントンスター」十一日「グルー」聲明ヨリ結論ヲ下シ得ルトセハ米國政府ハ無條件降服ヨリ一步モ退カサルヘシトノ點ナルカ同聲明ハ明確ヲ缺ク嫌アリ米國ハ旣ニ無條件降服トハ日本國民ノ根絕又ハ奴隸化ヲ齎スモノニ非スト正式ニ聲明セルモ右カ何ヲ意味スルヤヲ理解セシムル包括的聲明ニハ非ス故ニ若シ米國政府カ日本ニ課セントスル條件ヲ適當ニ明示セハ日本ノ降服時期ヲ促進スルニアラスヤトノ靑任アル筋ヨリノ「サゼスチヨン」モアル程ナリ右ハ素ヨリ安協和平ヲ云フニ非ス其ノ點確然タル區別ヲ爲スヘキコト當然ナリ然リ乍ラ「グルー」ノ口吻ヨリ考フルニ米國政府ハ日本ニ對シ斯ル讓步ヲ示ス意響ナキ模樣ニテ今次大戰ヲ指導スル米國要人ノ閱歷ヨリ見テ政府ノ取ル態度ハ充分理由アリトノ信賴感ヲ起サシメントスルモノノ如シ\n\n二、「ワシントンポスト」十三日\n\n「グルー」聲明ノ如ク日本ノ米國ニ對スル「アプローチ」カ正式機關ヲ通セス曖昧ニシテ内容ノ乏シキモノナリトセハ右ハ和平ノ强制タルニ充分ナラス國務省カ之ヲ無視シタルコトハ正當ナラン伯シ同聲明ハ米國ノ追求スル戰爭目的ヲ單ニ日本ニ對シテノミナラス米國民就中戰線ノ米將兵ニモ示スヘキヤノ主要問題トハ何等ノ關聯ナシ吾人ハ聲明ヲ「フエースバリユー」ニ受取ラサルヘカラス\n\n三、「バルチモア、サン」十二日\n\n何人モ太平洋戰爭ノ早期終了ヲ要望シ米國將兵ノ生命ヲ救フ爲ノ政策ニ好意ヲ有シアルモ無條件降服以外ノ和平條件ヲ唱道スル聲ハ聞カレ居ラス米國側ニテ和平條件ニ關シ取引ヲ爲サントノ意響ヲ示サハ日本ハ右ヲ以テ米國ノ戰爭疲勞又ハ弱體ノ徵候ナリト解釋シ却テ頑强ナル抵抗ヲ爲スヘシ\n\n無條件降服ハ旣ニ聲明セラレタル對日和平ノ一般性質ト竝立スルモノニテ右カ「カイロ」宣言ニ見ラレ居ルハ日本モ之ヲ知悉シ居レリ「ローズヴエルト」及「トルーマン」モ累次ノ聲明ニテ無條件降服ヲ繰返シ居レリ聯合側トシテハ右聲明ヲ超ユル行爲ヲ爲ササルヘシ日本ノ指導者カ不可避ナル事實ノ前ニ速カナル調繫ヲ爲サハ日本カ國民生活ノ再建ニ着手シ得ル物質的基礎ハ夫レ丈ケ失ハルル處少シ\n\n四、紐育「タイムス」十九日\n\n日本ハ米國政府ニ對シ非公式ニモ和平ノ打診ヲ行ヒタルコト無シトノ「グルー」ノ否定アリタルモ和平ノ噂ハ猶盛ニシテ華府及倫敦ニテハ日本ヲ武裝解除シ其ノ占領地域ヲ剝奪スルモ獨逸ト異リ右以外ノ要求ヲ爲サストノ安協和 되어 견딜 수 없다. 재외 사신 가운데 한 사람쯤은 마음을 다한 의견을 토로하는 자가 있어야 마땅하다고 믿기에 감히 비견(卑見)을 아뢴다."], "primary": "## 第四八九號（관장부호, 친전）\n\n**ストックホルム 7月21日 後4時25分 發 / 本省 7月22日 後2時30分 着**\n\n대동아 전국(大東亞戰局)의 현상은 비분강개의 극치로서 참으로 국가 위급 존망의 때임을 생각하게 한다. 이는 일본이 미영의 도발이 있었다 하더라도, 그쳐야 할 곳에 그치지 않고 적의 실력을 오산·경시하여 싸워서는 안 될 무리한 전쟁에 돌입한 결과로서, 그 때문에 이제는 거의 세계를 적으로 하여 싸울 수밖에 없는 지경에 빠진 현상이라 할 것이며, 일본의 전쟁 목적이 아무리 당당하다 하더라도 유감스럽게도 만사는 실력으로써 결정되는 바이다. 또 소련과 미영은 장래에 있어 결국 충돌을 면치 못할 운명에 있다고 생각되나, 유럽 전쟁에 극도로 피로한 소련이 앞으로 수년간 영미와 일을 벌이리라고는 생각되지 않는다. 이 현실의 사태에 처하여 우리 육해군에 있어 회란(囘瀾)을 기도(旣倒)에 되돌려 전국을 근본적으로 우리에게 유리하게 호전시킬 성산(成算)이 마음속으로 있다면 무엇을 근심하랴. 그렇지 않다면 일본이 취해야 할 길은, 최후의 옥쇄(玉碎)를 각오하고 끝까지 버티시어 이 무리한 전쟁을 싸워 낼 것인가, 또는 적당한 기회를 잡아 될 수 있는 대로 유리한 조건으로 화국(和局)을 맺을 것인가의 두 길이 있을 뿐이라 생각된다.\n\n최근 미국에서 대일 무조건 항복의 조건을 될 수 있는 대로 완화하여 속히 화국을 맺으려는 의향이 나타나고 있음은 누차의 졸전(拙電)대로이다. 이로써 곧 미국 여론이 전부 이에 찬성하는 것이라고 속단함은 물론 성급할 것이나, 위는 미국민 가운데 점차 전쟁에 물려 전쟁 종결을 서두르려는 희망이 강한 자가 있음을 보임과 동시에, 이오지마(硫黃島)·오키나와(沖繩) 등에서의 일본군의 장렬하여 귀신을 울릴 고군분투가 미국 상하를 진해(震駭)시켜 이 이상의 인명 희생을 회피하려는 고려에서 나오고 있음이 명백하다. 종래 일본에 대해 가장 적개심이 강했던 미국이 그러한 의향을 가지고 「포츠담」 회담 등에서 영국 측에 대일 방침을 담의(談議)함에 있어서는 영국도 또한 이에 추종할 것임은 상상하기 어렵지 않다. 또 자꾸만 풍설로서 전해지는 바의 화평에 대해 소련을 조정자로 삼는 것도, 서툴게 나갈 때에는 일본으로서 소련에게 발밑을 간파당해 이용당할 위험이 있을 것임을 고려하지 않을 수 없으나, 만약 소련이 참으로 호의를 가지고 조정을 인수함에 있어서는, 이때 일본을 위하여 미영을 눌러 화국으로 끌고 갈 수 있는 자는 결국 「스탈린」을 제쳐 놓고 달리는 없지 않겠는가고 관측한다.\n\n이러한 점들은 소관이 아뢸 것까지도 없이 이미 각하께서 충분히 고려하고 계시며, 지난번의 이른바 정부의 대소(對蘇) 시책이란 이러한 것도 의도하는 것이리라고 배찰(拜察)하는 바이다. 이제 일본의 운명이 갈리는 초중대한 위국(危局)에 제회(際會)하여 제국 외교가 진검(眞劍)하게 활동해야 할 때임을 생각하니, 진실로 적당한 기회가 있다면 참으로 결사적 일대 결심으로써 최선이라 판단되는 바를 단행하여 나라를 구할 길을 강구해야 한다고 생각하지 않을 수 없다.\n\n독일의 비참한 파괴 상황 등에 관해서는 최근 귀조자(歸朝者)로부터 충분히 보고를 청취하셨으리라 추측하는 바, 일본으로 하여금 이 비참한 운명을 밟게 해서는 안 된다는 것은 소관만의 염원은 아닐 것이다. 만약 국민을 여기까지 끌고 온 이상 이제 와서 화평 운운하는 약한 소리는 낼 수 없다, 일본 국민으로서는 어디까지나 버티지 않으면 안 된다고 하는 것이 참된 현상이라 한다면, 더 한층 대소고소(大所高所)에서 냉정하게 현실의 일본의 실정과 적의 실정을 충분히 직시함과 동시에, 황공하오나 우리 황실의 어안태(御安泰)와 일본 국민의 장래에 대해 깊이 생각을 미칠 필요가 있음을 충심으로 진언하고자 한다. 국민 여론은 군중 심리에 의해 강경 의견에 좌우되기 쉽고, 화평론은 패전주의로서 일괄 배척되는 것이 상례이다. 따라서 화국을 맺음에 있어 국내 여론에 중대한 장애가 있음에 있어서는, 비상수단으로서 상어일인(上御一人)의 어친재(御親裁)를 주청하여 폐하의 어명령에 의하도록 정하는 수단을 취하시는 것도 고려의 여지가 없겠는가. 이와 같은 것을 아뢰는 것이 참월(僭越)한 짓임은 만만(萬々) 승지하나, 국가의 전도(前途)에 대한 깊은 우려를 견딜 수 없으며, 공연히 형세의 추이를 보고만 있는 것은 군국(君國)에 보답하는 까닭이 아니다. 재외 사신 가운데 한 사람쯤은 마음을 다한 의견을 토로하는 자가 있어야 마땅하다고 믿기에, 감히 비견(卑見)을 아뢴다.", "secondary": "9649昭和20年7月21日東鄕外務大臣宛（電報）在スウエーデン岡本公使より早期和平実現の必要性につき意昇具申\n\nストックホルム7月21日後4時25分發\n\n本省7月22日後2時30分着\n\n第四八九號（館長符號、親展）\n\n大東亞戰局ノ現狀ハ悲憶慷慨ノ極ミニシテ眞ニ國家危急存亡ノ秋ナルヲ思ハシム之日本カ米英ノ挑發アリタルニセヨ止マルヘキ所ニ止マラス敵ノ實力ヲ誤算輕視シ戰フヘカラサル無理ナル戰爭ニ突入シタル結果ニシテ爲ニ今ヤ殆ント世界ヲ敵トシテ戰フノ余儀ナキ羽目ニ陷レル現狀ト言フヘク日本ノ戰爭目的カ如何ニ堂々タリトモ遺憾乍ラ萬事ハ實力ヲ以テ決セラルル次第ナリ又蘇聯ト米英トハ將來ニ於テ結局衝突ヲ免レサルヘキ連命ニアリト思ハルルモ歐洲戰爭ニ極度ニ疲勞シタル蘇聯カ今後數年間ニ英米ト事ヲ構フルモノトハ考ヘラレス此ノ現實ノ事態ニ處シテ我陸海軍ニ於テ囘瀾ヲ旣倒ニ返シ戰局ヲ根本的ニ我竝ニ立利ニ好轉セシムル心中ヨリ成算アルニ於テハ何ヲカ憂ヘシ然ラサルニ於テハ日本ノ採ルヘキ途ハ最後ノ干碎ヲ蠻悟シテ飽迄頑張ラレ此ノ無理ナル戰爭ヲ戰ヒ拔クカ又ハ適當ノ機會ヲ捉ヘテナルヘク有利ナル條件ヲ以テ和局ヲ結フカノ二途アルノミト思ハル\n\n最近米國ニ於テ對日無條件降伏ノ條件ヲナルベク緩和シテ速ニ和局ヲ結ハントスル意向現ハレ居ルハ屢次ノ拙電ノ通リニシテ之ヲ以テ直ニ米國團論カ全部之ニ贊成スルモノト速斷スルハ素ヨリ早計ナルヘキモ右ハ米國民中ニ漸ク戰爭ニ飽キ戰爭終結ヲ急カントスル希望强キモノアルヲ示スト共ニ硫裏島沖繩等ニ於ケル日本軍ノ壯烈鬼神ヲ泣カシムル孤軍奮鬪カ米國上下ヲ震駭シ此ノ上ノ人命ノ犧牲ヲ囘避セントスルノ考慮ヨリ出テ居ルハ明カナリ從來日本ニ對シ最モ敵憐心强キ米國カ斯ル意向ヲ以テ「ポツダム」會談等ニ於テ英國側ニテ對日方針ヲ談議スルニ於テハ英國モ亦之ニ追隨スヘキハ想像ニ難カラス又頻リニ風說トシテ傳ヘラルル所ノ和平ニ付テ蘇聯ヲ調停者トスルコトモ拙ク行ク時ハ日本トシテ蘇聯ニ足許ヲ見透カサレ付ケ込マルル危險アルヘキヲ考慮セサルヲ得サルモ若シ蘇聯カ眞ニ好意ヲ以テ調停ヲ引受クルニ於テハ此ノ際日本ノ爲ニ米英ヲ押ヘテ和局ニ持チ行キ得ル者ハ結局「スターリン」ヲ措キテ他ニハナカルヘキカト觀測ス\n\n之等ノ點ハ小官ノ申上クル迄モナク旣ニ閣下ニ於テ十分御考慮相成リ居リ先般ノ所謂政府ノ對蘇施策トハ斯ルコトヲモ意圖スルモノナルヘシトハ拜察スル處今ヤ日本ノ連命ノ岐ルル超重大危局ニ際會シ帝國外交カ眞劍ニ活動スヘキ秋ナルヲ思ヒ苟モ適當ノ機會アラハ眞ニ決死的一大決心ヲ以テ最善ト判斷セラルル所ヲ斷行シ以テ國ヲ救フノ途ヲ講スヘキナリト考ヘサルヲ得ス\n\n獨逸ノ悲慘ナル破壞狀況等ニ關シテハ最近歸朝者ヨリ充分報告ヲ御聽取相成タルコトト推測スル處日本ヲシテ此ノ悲慘ナル連命ヲ迴ラシムベカラストハ小官ノミノ念廳ニハアラサルヘク若シ夫レ國民ヲ此處迄引張リ來リタル以上今更和平等ト言フ弱首ハ吹ケス日本國民トシテハ何處迄モ頑張ラサルベカラスト言フカ本當ノ現狀トセハ更ニ一段ト大所高所ヨリ冷靜ニ現實ノ日本ノ實情ト敵ノ實情トヲ充分ニ直視スルト同時ニ畏多キコト乍ラ我皇室ノ御安泰ト日本國民ノ將來ニ付テ深ク思ヒヲ致スノ要アルコトヲ夷心ヨリ進言致度シ國民團論ハ群衆心理ニ依リ强硬意見ニ左右セラレ易ク和平論ハ敗戰主義トシテ一慨ニ排斥セラルル方常トス依テ和局ヲ結フニ付テ國内團論ニ重大障碍アルニ於テハ非常手段トシテ上御一人ノ御親裁ヲ奏請シ陛下ノ御命令ニ依ルコトヲ定ムルノ手段ヲ執ラルルコトモ考慮ノ余地ナキヤ斯クノ如キコトヲ申進スルハ僭越ノ沙汰ナルハ萬々承知スルモ國家ノ前途深憂ニ堪ヘス徒ニ形勢ノ推移ヲ見送リ居ルコトハ君國ニ酬ユル所以ニアラス在外使臣中一人位ハ思切リタル意見ヲ叶露スル者アリテ然ルヘシト信スルニ付敢ヘテ罕見申進ス", "notes": ["지면(s03-36)에서 「陛下ノ御命令ニ依ル」의 「陛下」 곁에 방선(傍線)이 그어져 있다. 원간본의 강조 표시로 보인다."], "warn": false, "pages": [1729, 1730, 1731], "search": "早期和平実現の必要性につき意見具申 岡本季正 오카모토 스에마사 (주스웨덴 공사, 발신자) 東鄕茂德 도고 시게노리 (외무대신, 수신자. 본문의 「閣下」) スターリン 스탈린 (소련) 上御一人／陛下 쇼와 천황 (직접 이름은 나오지 않는다)"}, {"id": "d1078", "order": 1078, "date": "1945-07-21", "group": "A", "eyebrow": "문서 1078 · 四 ポツダム宣言の受諾", "title": "대일 화평 문제에 관해 연합국 측이 제시할 무조건항복안 등에 관한 신문 논조에 대하여", "badge": "第四九○號", "list_right": "문서 1078", "meta": [{"k": "일자", "v": "1945-07-21", "txt": false}, {"k": "발신", "v": "在スウェーデン岡本公使 주스웨덴 오카모토 스에마사 공사", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 외무대신", "txt": true}, {"k": "발착", "v": "ストックホルム7月21日後4時30分發 / 本省7月22日前11時05分着", "txt": false}, {"k": "장소", "v": "ストックホルム 스톡홀름", "txt": false}, {"k": "전보번호", "v": "第四九○號", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "7월 20일자 스톡홀름 각지가 전한 영미 신문 논조를 오카모토 공사가 보고한 전보. 무조건항복 정책의 완화 여부, 국체 존속을 인정하여 일본의 체면을 살리는 항복안, 그리고 카이로 선언의 무조건항복 요구 수정론까지 나오고 있다고 한다. 포츠담 선언 5일 전이다.", "points": ["런던의 책임 있는 방면은 일본이 항복을 결의하지 않는 한 대일전은 장기에 걸칠 것으로 보고 있다", "「타임스」는 일본이 해공 공격에 특필할 저항을 보이지 못한 것은 주력이 격파된 뜻이며 예비병력이 질·양에서 빈약해졌다고 논했으나, 폭격만으로 일본을 깨뜨리는 것은 불가능하며 일본이 필사의 저항으로 전쟁을 장기화할 가능성을 과소평가해서는 안 된다고 강조하는 쪽도 많다", "일반적으로 일본 정부가 언제든 타협 화평 교섭에 응할 용의가 있음은 의심하지 않으나, 그 전제로 미영이 무조건항복 정책의 완화를 성명할 필요가 있다. 결국 어느 정도까지 완화가 가능한가가 문제다", "처칠과 장제스는 1943년 가을 극동에서의 연합국 전쟁 목적에 관해 일본이 점령한 동아 대륙 및 태평양 지역을 포기시킬 것을 결정해 두었으나, 대일 처리의 일반 원칙에 관해서는 아무것도 시사하지 않았다", "일본 본토의 점령 및 잠정적 감시에 관해서는 아무런 제안이 없었던 모양이나, 미국인이 일본에 대해 이런 종류의 제재 수단을 취하지 않으리라고는 생각되지 않는다", "중국(지나)은 이 문제에 한층 관심을 가지며 앞의 방법 이외로는 그 안전을 보장할 수 없다는 견해임이 명백", "런던에서는 휴전 수리에 대한 일본의 태도를 판정할 아무런 정보가 없음을 인정하고 있고, 본 회의가 극동 정세를 움직일 수 있을지의 문제는 오로지 소련의 태도 여하에 달려 있는데 이 점에 관해서도 정보가 없다", "「데일리 메일」은 19일, 트루먼이 무엇보다 먼저 국체(國體)의 존속을 인정하여 일본의 체면을 살리고 이른바 면자(面子)를 상하지 않는 무조건항복을 일본에 제안할 의향을 가지고 있다고 보도", "뉴욕 주식은 대일 화평 소문에 하락, 제네바(壽府) 방면에서는 일본 측 화평 타진 소문이 잇달아 전해져 각 방면의 조회가 국무성에 쇄도, 국무성은 정부로서 아직 일본으로부터 아무런 화평 신청을 받은 바 없다고 성명하지 않을 수 없게 되었다", "그러나 아직 미국민 대부분은 일본의 철저한 격멸을 희망하며, 일본인에 대한 증오는 독일에 대한 것보다 치열하고, 정부 또한 기회 있을 때마다 일본인의 광열(狂熱)함을 강조하고 있다", "19일 「뉴욕 타임스」는 무조건항복 이외의 해결은 제1차 대전 후의 독일에 대해서와 마찬가지로 정치적·경제적 재군비의 기회를 줄 것이므로, 일본이 무조건항복에 응하지 않으면 무력으로 판결을 내리는 수밖에 없다는 대일 강경론을 폈다", "오키나와 작전 이래 일본 본토 상륙작전이 심대한 출혈을 요구할 것이라는 전망이 점차 유력해졌고, 태평양에서 미국의 전쟁 목적이 불명확하고 전후 극동에 어떤 질서를 가져오려는지 전연 불명함을 비난하는 소리가 강해졌다", "일부에는 대일 조건의 명시를 요구하거나 「카이로」 선언의 무조건항복 요구 수정을 요구하는 쪽이 있다", "최근 독일에서 귀환한 「도로시 톰프슨」은, 일본의 무조건항복이 미국의 입장을 강화할지 냉정히 검토할 필요가 있으며, 정부는 일본을 완전히 붕괴시키려는 듯하나 그 결과는 아마 독일에서와 마찬가지로 극동에서도 소련에 지도권을 주게 되지 않겠는가 하는 취지를 논하고 있다"], "primary": "**스톡홀름 7월 21일 후 4시 30분 발**\n\n**본성 7월 22일 전 11시 05분 착**\n\n**제490호**\n\n7월 20일의 당지 각지(各紙)는 다음과 같이 보도하고 있음.\n\n一、최근 영미의 일본 본토 공격이 비교적 용이하게 행하여졌음에도 불구하고, 런던의 책임 있는 방면에서는 일본이 항복을 결의하지 않는 한 대일전은 장기에 걸칠 것이라고 보고 있다. 일본이 해공(海空)으로부터의 미영 공격에 대하여 특필할 만한 저항을 보이지 않은 것은 일본군의 주력이 격파된 것을 의미하며 일본의 예비병력은 질 및 양에 있어서 빈약해졌다고 하는 「타임스」의 논설에 대하여도, 폭격만에 의하여 일본을 깨뜨리는 것은 불가능하며 일본이 필사의 저항에 의하여 전쟁을 장기화시킬 수 있는 가능성은 이를 과소평가하여서는 안 된다는 뜻을 강조하는 쪽이 많다.\n\n二、일반적으로 일본 정부가 언제라도 타협 화평의 교섭에 응할 용의가 있음은 의심하지 않으나, 그 전제로서 미영이 일본에 관하여 무조건항복 정책의 완화를 성명할 필요가 있으며, 결국 어느 정도까지 그 완화가 가능한가가 문제이다. 「처칠」 및 장제스(蔣介石)는 1943년 가을 극동에서의 연합국의 전쟁 목적에 관하여 동아 대륙 및 태평양에서 일본이 점령한 지역을 포기시킬 것을 결정해 두었으나, 대일 처리의 일반 원칙에 관하여는 아무것도 시사하고 있지 않다. 일본 본토의 점령 및 잠정적 감시에 관하여는 아무런 제안도 된 바 없는 모양이나, 미국인이 일본에 대하여 이런 종류의 제재 수단을 채택하지 않으리라고는 생각되지 않는다. 중국(지나)은 본 문제에 대하여 한층 관심을 가지며 앞에서 말한 방법 이외의 방법으로는 그 안전을 보장할 수 없다는 견해를 가지고 있음이 명백하다. 한편 일본 본토에서의 전투가 장기화됨에 있어서는 방대한 인명의 희생을 필요로 할 것이라는 것은 일반적으로 관측되고 있는 바로서, 이와 같은 사태에서 미영 측에서 일본 정복에 관한 정치적이고 장기적인 조건을 한층 정확히 결정할 용의가 있음은 적어도 추찰할 수 있는 바이나, 런던에서는 휴전 수리(受理)에 대한 일본의 태도를 판정할 아무런 정보가 없음을 인정하고 있으며, 또 런던 주재 연합국 측 신문 특파원은 극동의 전쟁이 「포츠담」 회의의 일정에 오를 것을 강조하고 있으나 이 점에 관하여도 정보가 없고, 본 회의가 극동의 정세를 움직일 수 있을지 여부의 문제는 오로지 소련의 태도 여하에 달려 있다는 것, 이 점에 관하여도 역시 정보가 없으며, 오직 소련이 전쟁 종료 후의 극동의 신질서에 관하여 관심을 가지고 있다는 것밖에는 명백하지 않다고 관측하고 있다.\n\n三、「데일리 메일」은 19일, 「트루먼」이 무엇보다 먼저 국체(國體)의 존속을 인정하여 일본의 체면을 살리고 이른바 면자(面子)를 상하게 하지 않는 무조건항복을 일본에 제안할 의향을 가지고 있음을 보도하였고, 뉴욕(紐育) 주식은 대일 화평의 소문에 하락하였으며, 또 제네바(壽府) 방면에서는 일본 측의 화평 타진에 관한 소문이 잇달아 전해져 각 방면으로부터의 조회가 국무성에 쇄도하여, 국무성은 정부로서 아직 일본으로부터 아무런 화평의 신청을 받은 바 없다고 성명하지 않을 수 없게 된 사실은 있으나, 아직 미국민의 대부분은 일본의 철저한 격멸을 희망하고 있으며 그 일본인에 대한 증오는 독일에 대한 것보다 치열하고, 정부 또한 그 국민에 대하여 기회 있을 때마다 일본인의 광열(狂熱)함을 강조하고 있다. 19일 「뉴욕 타임스」는 무조건항복 이외의 해결은 일본에 대하여 제1차 대전 후의 독일에 대한 것과 마찬가지로 정치적·경제적 재군비의 기회를 줄 것이므로, 일본이 무조건항복에 응하지 않음에 있어서는 무력에 의하여 판결을 내리는 수밖에 없다는 대일 강경론을 서술하고 있는 바, 오키나와(沖繩) 작전 이래 일본 본토 상륙작전이 심대한 출혈을 요구할 것이라는 전망이 점차 유력해져 온 것은 사실이며, 태평양에서의 미국의 전쟁 목적이 불명확하여 전후 극동에 여하한 질서를 가져오려 하는지 전연 불명함을 비난하는 소리가 강해져, 일부에서는 혹은 대일 조건의 명시를 요구하고 혹은 「카이로」 선언의 무조건항복 요구의 수정을 요구하는 쪽이 있다. 최근 독일로부터 귀환한 「도로시 톰프슨」은, 일본의 무조건항복이 미국의 입장을 강화하는지 여부에 관하여 냉정히 검토할 필요가 있으며, 정부는 일본을 완전히 붕괴시키려 하고 있는 듯하나 그 결과는 아마도 독일에서와 마찬가지로 극동에서도 소련에 지도권을 주게 되는 것이 아니겠는가 하는 취지를 논하고 있다.", "secondary": "1078昭和20年7月21日東鄕外務大臣宛（電報）在スウエーデン岡本公使より対日和平問顯に関し連合国側が提示すべき無\n\n条件降伏案等に関する新聞論調について\n\nストックホルム7月21日後4時30分發\n\n本省7月22日前11時05分着\n\n第四九○號\n\n七月二十日ノ當地各紙ハ左ノ通リ報シ居レリ\n\n一、最近英米ノ日本本土攻擊カ比較的容易ニ行ハレタルニ拘ラス倫敦ノ靑任アル方面ニテハ日本ニシテ降伏ヲ決意セサル限リ對日戰ハ長期ニ亘ルヘシト見居リ日本カ海空ヨリスル米英ノ攻擊ニ對シ特筆スヘキ抵抗ヲ示ササリシハ日本軍ノ主力カ擊破サレタルコトヲ意味シ日本ノ豫備兵力ハ質及量ニ於テ貧弱トナリ居レリトスル「タイムス」ノ論說ニ對シテモ爆擊ノミニ依リ日本ヲ破ルコトハ不可能ニシテ日本カ必死ノ抵抗ニ依リ戰爭ヲ長引カシメ得ル可能性ハ之ヲ過小評償スヘカラサル旨ヲ强調スル向多シ\n\n二、一般ニ日本政府カ何時ニテモ安協和平ノ交涉ニ應スル用意アルコトハ疑ヒ居ラサルカ右前提トシテ米英カ日本ニ關シ無條件降伏ノ政策ノ緩和ヲ聲明スル要アリ結局何ノ程度迄右緩和カ可能ナリヤカ問題ナルカ「チヤーチル」及將介石ハ一九四三年秋極東ニ於ケル聯合國ノ戰爭目的ニ關シ東亞大陸及太平洋ニ於テ日本カ占領シタル地域ヲ放棄セシムヘキコトヲ決定シ居ルモ對日處理ノ一般原則ニ關シテハ何等仄カシ居ラス日本本土ノ占領及暫定的監視ニ付テハ何等提案サレタルコトナキ模樣ナルカ米國人カ日本ニ對シ何等此ノ種ノ制裁手段ヲ採ラサルモノトハ考ヘラレス支那ハ本問題ニ對シ一層關心ヲ有シ前記方決以外ノ方決ニテハ其ノ安全ヲ保障シ得ストノ見解ヲ持スルコト明白ナルカ一方日本本土ニ於ケル戰鬪長引クニ於テハ尨大ナル人命ノ犧牲ヲ必要トスヘシトハ一般ニ觀測セラレ居ル處ニシテ斯クノ如キ事態ニ於テ米英側ニ於テ日本征服ニ關スル政治的且ツ長期的條件ヲ一層正確ニ決定スル用意アルコトハ少クトモ推察シ得ル所ナルカ倫敦ニ於テハ休戰受理ニ對スル日本ノ態度ヲ判定スヘキ何等ノ情報ナキコトヲ認メ居リ又在倫敦聯合國側新聞特派員ハ極東ノ戰爭カ「ポツダム」會議ノ日程ニ上ルコトヲ强調シ居ルモ此ノ點ニ關シテモ情報ナキモ本會議カ極東ノ情勢ヲ動カシ得ルヤ否ヤノ問題ハ一ニ縣ツテ蘇聯ノ態度如何ニ在ルコト此ノ點ニ關シテモ亦情報ナキ唯蘇聯カ戰爭終了後ニ於ケル極東ノ新秩序ニ關シ關心ヲ有スルコトシカ明白ナリ居ラスト觀測シ居レリ\n\n三、「デーリーメール」ハ十九日「トルーマン」カ先ツ第一ニ國體ノ存續ヲ認メテ日本ノ體面ヲ救ヒ所謂面子ヲ傷ケサル無條件降伏ヲ日本ニ提案スル意響ヲ有スルコトヲ報シ紐育株式ハ對日和平ノ噂ニ下落シ又壽府方面ニ於テハ日本側ノ和平打診ニ關スル噂次々ニ傳ヘラレ各方面ヨリノ昭會國務省ニ殺倒シ國務省ハ政府トシテ未タ日本ヨリ何等和平ノ申入ヲ受ケタルコトナシト聲明セサルヲ得サルニ至リタル事實ハアルモ未タ米國民ノ大部分ハ日本ノ徹底的擊滅ヲ希望シ居リ其ノ日本人ニ對スル憎惡ハ獨逸ニ對スルヨリ熾烈ニシテ政府亦其ノ國民ニ對シ機會アル每ニ日本人ノ狂熱振ヲ强調シ居リ十九日「ニユーヨーク、タイムス」ハ無條件降伏以外ノ解決ハ日本ニ對シ第一次大戰後ノ獨逸ニ對スルト同樣政治的經濟的再軍備ノ機會ヲ與フヘキヲ以テ日本カ無條件降伏ニ應セサルニ於テハ武力ニ依リ判決ヲ下スノ外ナシトノ對日强硬論ヲ述ヘ居ル處沖繩作戰以來日本本土上陸作戰カ甚大ナル出血ヲ要求スヘシトノ見透漸次有力化シ來リタルハ事實ニシテ太平洋ニ於ケル米國ノ戰爭目的不明確ニシテ戰後極東ニ如何ナル秩序ヲ齎サントスルヤ全然不明ナルヲ非難スル聲强マリ一部ニハ或ハ對日條件ノ明示ヲ要求シ或ハ「カイロ」宣言ノ無條件降伏ノ要求修正方要求スル向アリ最近獨逸ヨリ歸來セル「ドロシー、トンプソン」ハ日本ノ無條件降伏カ米國ノ立場ヲ强化スルヤ否ヤニ付冷靜ニ檢討スル要アリ政府ハ日本ヲ完全ニ朋壞セシメントシ居ルモノノ如キモ其ノ結果ハ恐ラク獨逸ニ於ケルト同樣極東ニ於テモ蘇聯ニ指導權ヲ與フルコトトナルニアラスヤトノ趣旨ヲ論シ居レリ", "notes": [], "warn": false, "pages": [1895, 1896, 1897], "search": "対日和平問顯に関し連合国側が提示すべき無条件降伏案等に関する新聞論調について 岡本季正 오카모토 스에마사 (주스웨덴 공사) 東鄕茂德 도고 시게노리 (외무대신) 「チヤーチル」 처칠 蔣介石 장제스 「トルーマン」 트루먼 「ドロシー、トンプソン」 도로시 톰프슨 (미국 칼럼니스트)"}, {"id": "d965", "order": 965, "date": "1945-07-23", "group": "B", "eyebrow": "문서 965 · 二 中立国を通じた和平打診", "title": "후지무라 해군무관에 의한 덜레스 공작에 관해 상세히 탐색하도록 하는 훈령 / 별전: 1945년 7월 23일발 도고 외무대신이 주스위스 가세 공사 앞, 제371호 「덜레스의 경력에 대하여」", "badge": "第三七二號（極祕、館長符號） / 별전 第三七一號（館長符號）", "list_right": "문서 965", "meta": [{"k": "일자", "v": "1945-07-23", "txt": false}, {"k": "발신", "v": "東鄕茂德 도고 시게노리 (외무대신)", "txt": true}, {"k": "수신", "v": "在スイス加瀨公使 주스위스 가세 슌이치 공사", "txt": true}, {"k": "발착", "v": "本省7月23日後4時00分發 (별전: 本省7月23日後2時50分發)", "txt": false}, {"k": "장소", "v": "本省", "txt": false}, {"k": "전보번호", "v": "第三七二號（極祕、館長符號） / 별전 第三七一號（館長符號）", "txt": false}, {"k": "종류", "v": "훈령", "txt": true}], "summary": "베른의 후지무라 해군무관이 보고해 온 덜레스(Dulles) 접촉을 해군 중앙이 손을 떼고 외무성에 일임했으므로, 도고 외상이 가세 공사에게 무관으로부터 전말을 청취하고 상대의 확실성과 미국 당국의 화평 진의를 탐지하여 급히 회전하라고 훈령한 전보.", "points": ["「루스벨트의 재구주 특사 Dulles」라는 자가 확실한 제3자를 통해 후지무라 해군무관에게 접촉했다. 「일본 측에 미국과 절대 비밀리에 이야기할 의향이 있으면 워싱턴 정부에 전달하겠다」", "「도쿄에서 해군 고관을 스위스에 파견할 의도가 있으면 비행기 기타 준비를 인수하겠다」는 제안까지 나왔다", "해군 중앙은 적의 모략·이간 공작이며 주목표가 제국 해군에 있다고 보아 본건을 「취급하지 않을 의향」이라 회훈하고, 처리를 외무성에 일임", "다만 해군 중앙의 회훈은 「주재 제국 관헌과 밀접히 연락하여 주도하게 관찰하여야 한다(觀察スヘシ)」는 조건을 달았다", "도고는 상대가 John Foster Dulles인지 확인하고, 그를 통해 미국 당국의 화평 진의를 탐지할 수 있는지 의견을 지급 회전하라고 지시", "난외 기입: 발전 전에 해군에 보이고, 해군이 먼저 후지무라 무관에게 「다시금 공사와 상담하라」는 훈전을 내게 하고자 함. 아리마 대좌로부터 발전 완료 통보(22일)", "별전 제371호는 덜레스의 약력이다. 변호사, 1919년 배상위원회, 1933년 베를린 배상회의 대표, 1944년 공화당 외교고문, 듀이 당선 시 국무장관 물망, 샌프란시스코 회의 미국대표부 고문"], "primary": "**본성 7월 23일 후 4시 00분 발**\n\n**제372호（극비, 관장부호）**\n\n一、최근 귀지(貴地) 해군무관으로부터, 「루스벨트」의 재구주(在歐州) 특사 Dulles라는 자가 확실한 제3자를 개재시켜 동 무관에 대하여 「일본 측에서 미국과 절대 비밀리에 이야기할 의향이 있다면 화부(華府, 워싱턴) 정부에 전달할 것이며, 도쿄로부터 해군 고관을 스위스에 파견할 의도가 있다면 비행기 기타의 준비를 인수하겠다」는 뜻을 신출(申出)하였다는 취지로써 조치 방침을 청훈(請訓)해 온 바, 해군 중앙에서는 당방(當方)과 연락한 위에 「적의 모략 및 이간 공작이 빈번히 행하여지고 또한 주목표를 제국 해군에 두고 있는 것으로 인정됨에 비추어, 중앙으로서는 본건은 취급하지 않을 의향이나, 이런 종류의 공작에 대하여는 주재 제국 관헌과 밀접히 연락하여 주도(周到)하게 관찰하여야 한다(觀察スヘシ)」는 취지의 회훈(囘訓)을 발함과 아울러, 본건 처리를 외무성에 일임해 왔다.\n\n二、그러한즉 상세한 것은 귀지 해군무관으로부터 청취하여 주시기 바라며(御聽取相成度) (해군 측에서 새삼 동 무관에게 훈전을 발할 것임), 본건 Dulles라는 인물의 확실성에 관한 전망(당방 조사에 의하면 약력 별전 제371호와 같은 John Foster Dulles를 말하는 것인가라고도 생각하고 있는 바, 과연 그러한가), 본건 상대방을 통하여 미국 당국의 화평 문제에 관한 진의를 탐지해 낼 수 있을지에 관한 귀견(貴見) 등을 지급(至急) 회전하여 주시기 바람(御囘電相成度).\n\n（난외 기입）\n\n발전(發電) 전에 해군에 보이고, 해군으로부터 먼저 후지무라(藤村) 무관에 대하여 다시금(再應) 공사와 상담하도록 훈전을 발하게 하고자 함.\n\n아리마(有馬) 대좌로부터 발전을 마쳤다는 뜻의 전화 있었음. 22일\n\n---\n\n**（별전）**\n\n**본성 7월 23일 후 2시 50분 발**\n\n**제371호（관장부호）**\n\n변호사. 1919년 배상위원회, 최고경제평의회 위원, 1933년 베를린(伯林) 배상회의 대표 등의 경력을 가지며, 1944년 대통령 선거 때 공화당 외교고문으로서 활약, 「듀이」가 당선될 경우에는 국무장관으로 지목되었음.\n\n「듀」의 뜻을 받아 외교에 관하여 정부와 연락·협조에 임하였고, 상항(桑港, 샌프란시스코) 회의 미국대표부 고문이었음.", "secondary": "965昭和20年7月23日在スイス加瀨公使宛（電報）東鄕外務大臣より藤村海軍武官によるダレス工作につき委細探\n\n索方訓令\n\n別電昭和二十年七月二十三日發東鄕外務大臣より\n\n在スイス加瀨公使宛第三七一号\n\nダレス、経歷にっいて\n\n本省7月23日後4時00分發\n\n第三七二號（極祕、館長符號）\n\n一、最近貴地海軍武官ヨリ「ルーズベルト」ノ在歐州特使Dullesナル者ヨリ確實ナル第三者ヲ介シテ同武官ニ對シ「日本側ニ於テ米國ト絕對祕密裡ニ話合ノ意向アラハ華（欄外記人)府政府ニ傳達スヘク東京ヨリ海軍高官ヲ瑞西ニ派道ノ意圖アラハ飛行機其他ノ準備ヲ引受クル」旨申出タル趣ヲ以テ措置振ヲ請訓越セル處海軍中央ニ於テハ當方ト連絡ノ上」敵ノ謀略及離間丁作頻ニ行ハレ且主目標ヲ帝國海軍ニ置キアルヤニ認メラルルニ鑑ミ中央トシテハ本件ハ取上ケサル意向ナルカ此ノ種丁作ニ對シテハ駐在帝國官憲ト密接連絡シ周到ニ觀察スヘシ」トノ趣旨ノ囘訓ヲ發セルト共ニ本件處理ヲ外務省ニ一任シ來レリ\n\n二、就テハ委細貴地海軍武官ヨリ御聽取相成度（海軍側ヨリ更メテ同武官ニ訓電ヲ發スヘシ）本件□Dullesナル人物ノ確實性ニ關スル見込（當方調査ニ依レハ略歷別電第三七一號ノ如キ□JohnFosterDullesノコトカトモ思惟シ居ル處果シテ然リヤ）本件相手方ヲ通シ米國當局ノ和平問題ニ關スル眞意ヲ探リ得ルヤニ關スル貴見等至急御囘電相成度\n\n（欄外テ和）\n\n發電前海軍ニ見セ海軍ヨリ先ツ藤村武官ニ對シ再應公使ニ相談方訓電ヲ發セシムルコトト致度\n\n有馬大佐ヨリ發電濟ナル由電話アリ廿二日\n\n（別電）\n\n本省7月23日後2時50分發\n\n第三七一號（館長符號）\n\n弁護十、一九一九年暗償委員會、最高經濟評議會委員、一九三三年伯林暗償會議代表等ノ經歷ヲ有シ一九四四年大統領選擧ノ際共和黨外交顧問トシテ活躍シ「デューイ」當選ノ場合ハ國務長官ニ目サレタリ\n\n「デュ」ノ意ヲ受ケテ外交ニ關シ政府ト連絡協調ニ當リ桑港會議米國代表部顧問タリ", "notes": ["（欄外記入） — 편자가 표시한 난외 기입. 원문 두 곳에 붙어 있다.", "별전 제371호는 본전 제372호보다 1시간 10분 먼저(후 2시 50분) 발신되었다. 즉 약력 조회 전보가 앞서고 본 훈령이 뒤따랐다."], "warn": false, "pages": [1731, 1732], "search": "藤村海軍武官によるダレス工作につき委細探索方訓令　別電　昭和二十年七月二十三日發東鄕外務大臣より在スイス加瀨公使宛第三七一号　ダレス、経歷にっいて 東鄕茂德 도고 시게노리 (외무대신) 加瀨俊一 가세 슌이치 (주스위스 공사) 藤村 후지무라 (베른 주재 해군무관보좌관 — 원문은 「海軍武官」으로 표기) Dulles / John Foster Dulles 존 포스터 덜레스 「ルーズベルト」 루스벨트 (미국 대통령) 「デューイ」 듀이 (1944년 공화당 대통령 후보) 有馬大佐 아리마 대좌 (해군)"}, {"id": "d1079", "order": 1079, "date": "1945-07-27", "group": "A", "eyebrow": "문서 1079 · 四 ポツダム宣言の受諾", "title": "포츠담 선언에 대해서는 주도한 검토를 요하며 졸속으로 의사표시를 하지 않도록 하라는 의견 구신 / 부기: 1945년 7월 26일 발표 「포츠담 선언」", "badge": "第八二四號（緊急）", "list_right": "문서 1079", "meta": [{"k": "일자", "v": "1945-07-27", "txt": false}, {"k": "발신", "v": "在スイス加瀨公使 주스위스 가세 슌이치 공사", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 외무대신", "txt": true}, {"k": "발착", "v": "ベルン7月27日後11時10分發 / 本省7月29日後8時45分着 （부기 「ポツダム宣言」: 昭和二十年七月二十六日發表）", "txt": false}, {"k": "장소", "v": "ベルン 베른", "txt": false}, {"k": "전보번호", "v": "第八二四號（緊急）", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "포츠담 선언 발표 다음 날, 가세 공사가 이 선언은 미영이 신중히 고려한 결과이므로 전문(full text)을 주도하게 검토해야 하며, 라디오 등으로 성급히 이러니저러니 의사표시를 하는 것은 심히 부당하고 적어도 묘의(廟議) 결정 때까지는 일체의 의사표시 기관이 침묵을 지켜야 한다고 진언한 긴급 전보. 편자가 포츠담 선언 전문을 부기했다.", "points": ["이번 미·영·중(米英支)의 대일 공동선언은 미영으로서 신중히 고려한 결과로 인정된다", "가능한 한 신속히 그 「풀 텍스트」에 대하여 주밀(周密)한 검토를 가할 필요가 있음은 말할 것도 없다", "「라디오」 기타로 지나치게 이르게(過早) 이에 대하여 이러니저러니 의사표시를 하는 것은 심히 부당하다", "적어도(尠クモ) 묘의(廟議) 결정 때까지는 일체의 아측 의사표시 기관에서 침묵을 지키는 것이 국가를 위한 길이라 믿는다", "부기된 포츠담 선언 제8항이다. 「「카이로」 선언의 조항은 이행될 것이며 또 일본국의 주권은 혼슈·홋카이도·규슈 및 시코쿠 그리고 우리가 결정하는 제 소도(小島)에 국한될 것이다」", "제5항이다. 「우리의 조건은 다음과 같다. 우리는 이 조건으로부터 이탈하는 일이 없을 것이다. 이에 대신할 조건은 존재하지 않는다. 우리는 지연(遲延)을 인정할 수 없다」", "제13항이다. 전 일본국 군대의 무조건항복 선언과 그 성의에 대한 적당하고 충분한 보장의 제공을 요구하며, 그 이외의 일본국의 선택은 신속하고 완전한 괴멸이 있을 뿐이다"], "primary": "**베른 7월 27일 후 11시 10분 발**\n\n**본성 7월 29일 후 8시 45분 착**\n\n**제824호（긴급）**\n\n이번 우리에 대한 미·영·중(米英支)의 공동선언은 미영으로서 신중히 고려한 결과로 인정되며, 우리로서 될 수 있는 한 신속히 그 「풀 텍스트(フルテクスト)」에 대하여 주밀(周密)한 검토를 가하실 필요가 있음은 말씀드릴 것까지도 없습니다. 그러한즉 「라디오」 기타로 지나치게 이르게(過早) 이에 대하여 이러니저러니(兎角)의 의사표시를 하는 것은 심히 적당하지 아니하며, 적어도(尠クモ) 묘의(廟議)의 어결정(御決定)에 이르기까지는 일체의 아측 의사표시 기관에서 침묵을 지키는 것이 국가를 위하는 길이라고 믿습니다.\n\n이상 우선 말씀드립니다(右不取敢申上度).\n\n---\n\n**（부기）**\n\n**포츠담 선언（미·영·중 3국 선언）**\n\n1945년 7월 26일 「포츠담」에서\n\n一 우리 합중국 대통령, 중화민국 정부 주석 및 「그레이트 브리튼」국 총리대신은, 우리의 수억 국민을 대표하여 협의한 위에, 일본국에 대하여 이번 전쟁을 종결시킬 기회를 준다는 데 의견이 일치하였다.\n\n二 합중국, 영제국 및 중화민국의 거대한 육·해·공군은 서방으로부터 자국의 육군 및 공군에 의한 수배의 증강을 받아 일본국에 대하여 최후적 타격을 가할 태세를 갖추었다. 이 군사력은 일본국이 저항을 종지(終止)하기에 이를 때까지 동국에 대하여 전쟁을 수행한다는 일체의 연합국의 결의에 의하여 지지되고 또한 고무되고 있는 것이다.\n\n三 궐기(躪起)한 세계의 자유로운 인민의 힘에 대한 「독일」국의 무익하고 무의미한 저항의 결과는, 일본국 국민에 대한 선례를 극히 명백히 보여 주는 것이다. 현재 일본국에 대하여 집결되고 있는 힘은, 저항하는 「나치스」에 대하여 적용되었을 경우에 전 「독일」국 인민의 토지·산업 및 생활양식을 필연적으로 황폐로 돌아가게 한 힘에 비하여 헤아릴 수 없을 만큼 더욱 강대한 것이다. 우리의 결의에 지지되는 우리의 군사력의 최고도의 사용은 일본국 군대의 불가피하고 완전한 괴멸을 의미할 것이며, 또한 마찬가지로 필연적으로 일본국 본토의 완전한 파괴를 의미할 것이다.\n\n四 무분별한 타산에 의하여 일본 제국을 멸망의 심연에 빠뜨린 제멋대로의(我儘ナル) 군국주의적 조언자에 의하여 일본국이 계속하여 통어(統御)될 것인가, 또는 이성의 경로를 일본국이 밟을 것인가를 일본국이 결정하여야 할 시기는 도래하였다.\n\n五 우리의 조건은 다음과 같다.\n\n우리는 이 조건으로부터 이탈하는 일이 없을 것이다. 이에 대신할 조건은 존재하지 않는다. 우리는 지연(遲延)을 인정할 수 없다.\n\n六 우리는 무책임한 군국주의가 세계로부터 구축(驅逐)되기에 이르기까지는 평화·안전 및 정의의 신질서가 생겨날 수 없다는 것을 주장하는 것이므로, 일본국 국민을 기만하여 그로 하여금 세계 정복의 거사에 나서게 하는 과오를 범하게 한 자의 권력 및 세력은 영구히 제거되지 않으면 안 된다.\n\n七 위와 같은 신질서가 건설되고 또한 일본국의 전쟁 수행 능력이 파쇄되었다는 확증이 있기에 이르기까지는, 연합국이 지정할 일본국 영역 내의 제 지점은 우리가 여기에 지시하는 기본적 목적의 달성을 확보하기 위하여 점령될 것이다.\n\n八、「카이로」 선언의 조항은 이행될 것이며, 또한 일본국의 주권은 혼슈(本州)·홋카이도(北海道)·규슈(九州) 및 시코쿠(四國) 그리고 우리가 결정하는 제 소도(小島)에 국한될 것이다.\n\n九 일본국 군대는 완전히 무장을 해제당한 후 각자의 가정에 복귀하여 평화적이고 생산적인 생활을 영위할 기회를 얻게 될 것이다.\n\n十 우리는 일본인을 민족으로서 노예화하려 하거나 또는 국민으로서 멸망시키려 하는 의도를 가지는 것은 아니나, 우리의 부로(俘虜)를 학대한 자를 포함한 일체의 전쟁범죄인에 대하여는 엄중한 처벌이 가해질 것이다. 일본국 정부는 일본국 국민 사이에서의 민주주의적 경향의 부활 강화에 대한 일체의 장애를 제거하여야 한다. 언론·종교 및 사상의 자유 그리고 기본적 인권의 존중은 확립될 것이다.\n\n十一 일본국은 그 경제를 지지하고 또한 공정한 실물배상(實物賠償)의 취립(取立)을 가능하게 할 산업을 유지하는 것이 허락될 것이다. 다만 일본국으로 하여금 전쟁을 위하여 재군비를 하는 것을 가능하게 할 산업은 이에 해당하지 않는다. 위 목적을 위한 원료의 입수(그 지배와는 이를 구별한다)는 허락될 것이다. 일본국은 장래 세계 무역 관계에의 참가를 허락받을 것이다.\n\n十二 앞에 적은 제 목적이 달성되고 또한 일본국 국민의 자유로이 표명된 의사에 따라 평화적 경향을 가지고 또한 책임 있는 정부가 수립됨에 있어서는, 연합국의 점령군은 즉시 일본국으로부터 철수될 것이다.\n\n十三 우리는 일본국 정부가 즉시 전 일본국 군대의 무조건항복을 선언하고, 또한 그 행동에 있어서의 동 정부의 성의에 관하여 적당하고 충분한 보장을 제공할 것을 동 정부에 대하여 요구한다.\n\n이 이외의 일본국의 선택은 신속하고 완전한 괴멸이 있을 뿐이다.", "secondary": "1079昭和20年7月2g日東鄕外務大臣宛（電報）在スイス加瀨公使よりポツダダ宣言に対しては周到な檢討を要し拙速に意思表示せざるよう意昇具申\n\n付記昭和二十年七月二十六日發表「ポツダム宣言」\n\nベルン7月2g日後11時10分發\n\n本省7月29日後8時45分着\n\n第八二四號（緊急）\n\n今囘ノ我ニ對スル米英支ノ共同宣言ハ米英トシテ惱重考慮セル結果ト認メラレ我トシテ能フ限リ速ニ其ノ「フルテクスト」ニ就キ周密ナル檢討ヲ加ヘラルル必要アルコト申上○○\n\nクル迄モナシ就テハ「ラチオ」其ノ他ニテ過早ニ之ニ對シ兒角ノ意思表示ヲ爲スコトハ甚タ適當ナラス□クモ廟議御決定迄ハ一切ノ我意思表示機關ニ於テ沈默ヲ守ルコト國家ノ御爲ト信ス\n\n右不取敢申上度\n\n（付記）\n\nポツダム宣言（米、英、華三國宣言）\n\n千九百四十五年七月二十六日「ポツダム」ニ於テ\n\n一吾等合衆國大統領、中華民國政府主席及「グレート、ブリテン」國總理大臣ハ吾等ノ數億ノ國民ヲ代表シ協議ノ上日本國ニ對シ今次ノ戰爭ヲ終結スルノ機會ヲ與フルコトニ意見一致セリ\n\n二合衆國、英帝國及中華民國ノ巨大ナル陸、海、空軍ハ西方ヨリ自國ノ陸軍及空軍ニ依ル數倍ノ增强ヲ受ケ日本國ニ對シ最後的打擊ヲ加フルノ態勢ヲ繫ヘタリ右軍事力ハ日本國ガ抵抗ヲ終止スルニ至ル迄同國ニ對シ戰爭ヲ遂行スルノ一切ノ聯合國ノ決意ニ依リ支持セラレ且鼓舞セラレ居ルモノナリ\n\n三躙起セル世界ノ自由ナル人民ノ力ニ對スル「ドイツ」國ノ無益且無意義ナル抵抗ノ結果ハ日本國國民ニ對スル先例ヲ極メテ明白ニ示スモノナリ現在日本國ニ對シ集結シツツアル力ハ抵抗スル「ナチス」ニ對シ適用セラレタル場合ニ於テ全「ドイツ」國人民ノ土地、産業及生活樣式ヲ必然的ニ荒廢ニ歸セシメタル力ニ比シ測リ知レザル程更ニ强大ナルモノナリ吾等ノ決意ニ支持セラルル吾等ノ軍事力ノ最高度ノ使用ハ日本國軍隊ノ不可避且完全ナル壞滅ヲ意味スベク又同樣必然的ニ日本國本土ノ完全ナル破壞ヲ意味スベシ\n\n四無分別ナル打算ニ依リ日本帝國ヲ滅亡ノ淵ニ陷レタル我儘ナル軍國主義的助言者ニ依リ日本國ガ引續キ統御セラルベキカ又ハ理性ノ經路ヲ日本國ガ履ムベキカヲ日本國ガ決定スベキ時期ハ到來セリ\n\n五吾等ノ條件ハ左ノ如シ\n\n吾等ハ右條件ヨリ離脫スルコトナカルベシ右ニ代ル條件存在セズ吾等ハ遲處ヲ認ムルヲ得ズテハ嚴重ナル處罰加ヘラルベシ日本國政府ハ日本國國民六吾等ハ無靑任ナル軍國主義ガ世界ヨリ驅遂セラルルニノ間ニ於ケル民主主義的傾向ノ復活强化ニ對スル一切ノ至ル迄ハ平和、安全及正義ノ新秩序ガ生ジ得ザルコトヲ障礙ヲ除去スベシ言論、宗敎及思想ノ自由竝ニ基本的人主張スルモノナルヲ以テ日本國國民ヲ欺瞞シ之ヲシテ世權ノ尊重ハ確立セラルベシ界征服ノ擧ニ出ゾルノ過誤ヲ犯サシメタル者ノ權力及勢十一日本國ハ其ノ經濟ヲ支持シ且公正ナル實物暗償ノ取力ハ永久ニ除去セラレザルベカラズ立ヲ可能ナラシムルガ如キ産業ヲ維持スルコトヲ許サル七右ノ如キ新秩序ガ建設セラレ且日本國ノ戰爭遂行能力ベシ伯シ日本國ヲシテ戰爭ノ爲再軍備ヲ爲スコトヲ得シガ破碎セラレタルコトノ確證アルニ至ル迄ハ聯合國ノ指ムルガ如キ産業ハ此ノ限ニ在ラズ右目的ノ爲原料ノ入手定スベキ日本國領域内ノ諸地點ハ吾等ノ玆ニ指示スル基（其ノ支配トハ之ヲ區別ス）ヲ許サルベシ日本國ハ將來世本的目的ノ達成ヲ確保スル爲占領セラルベシ界貿易關係ヘノ參加ヲ許サルベシ\n\n八、「カイロ」宣言ノ條項ハ履行セラルベク又日本國ノ主十二前記諸目的ガ達成セラレ且日本國國民ノ自由ニ表明權ハ本州、北海道、九州及四國竝ニ吾等ノ決定スル諸小セル意思ニ從ヒ平和的傾向ヲ有シ且靑任アル政府ガ樹立島ニ局限セラルベシセラルルニ於テハ聯合國ノ占領軍  될 위험이 있음을 살피지 않으면 안 된다", "二、권고의 동기다. 태평양전의 희생, 독일 궤멸 후의 암담한 유럽 정세, 소련 세력의 진출 등에 비추어 대일전의 조기 종결을 희망하는 경향이 적어도 미국 중앙 정계에 움직이고 있고, 무조건항복의 간판을 내리지 않은 채 사실상 조금 완화하여 되도록 이른 시기에 손을 쓸 수 있을 때 쓰려는 미국의 「이니셔티브」에 의한 것으로 생각한다", "다만 이는 오히려 미국 정치력의 움직임으로 보는 것이 안전하며, 이를 미국의 전쟁 피로로 보는 것도, 또 군민 이간의 모략이라고만 단정하는 것도 모두 심히 유해하다고 확신한다", "三、소련과의 (10어 탈락). 스탈린이 미리 그 내용 및 공표 사실을 알고 있었을 것임은 의심 없다", "소·중 및 소·영미 간에 동아 문제 처리에 관해 극히 대략적이나마 속마음의 타합(肚ノ打合)도 이루어졌다고 보는 것이 안전하다 (소련 대 미영 관계의 관점에서는 소련의 동아 진출 한도에 대해 미영 측이 어느 정도 전망을 붙일 수 있었다고 볼 수 있다)", "따라서 이번 미·영·중 권고 선언에 대한 우리의 태도 여하에 따라서는, 뒤이어 소련으로부터 우리에게 어떤 내용의 권고를 들이댈 공산이 있다고 관찰한다"], "primary": "**베른 7월 30일 전 1시 10분 발**\n\n**본성 8월 1일 전 10시 10분 착**\n\n**제837호（대지급, 관장부호 취급）**\n\n3국 선언에 관하여\n\n一、독일에 대한 태도와의 현저한 상이\n\n독일에 대해서는 이번과 같은 전반적 어조·형식으로 상당히 자세하게 조건을 붙이는 동시에, 어쨌든(兎ニ角) 일정한 보장을 주면서 호소를 한 일이 없다. 그 가운데서도\n\n(イ) 황실 및 국체에 관하여 언급하고 있지 아니한 것\n\n(ロ) 일본 주권을 인정하고 있는 것\n\n(ハ) 일본 주권이 행하여지는 범위인 일본 국토의 일부를 인정하고 있는 것. 요컨대 일본 민족이 죽음으로써 옹호하고 있는 국체 아래에서 국가 생활을 영위해 나갈 기초를 인정할 생각이라는 것\n\n(ニ) 이른바 무조건항복이라는 문구를 사용함에 있어, 이는 일본군에 관해서이고 일본 국민 또는 정부에 관해서가 아니라는 인상을 주어, 그들로서는 어지간히 생각하였다고 인정되는 것. 이 밖에 우리의 면자(面子) 보전을 여러 가지 점에서 고려한 형적이 있는 것\n\n(ホ) 일본 군대는 무장 해제 후 평화적·생산적 생활을 보낼 기회를 부여받을 것이라고 말하고 있는 것\n\n(ヘ) 일반적 평화 산업의 보지(保持), 원료 입수, 세계 통상 참가를 용인한다고 말하고 있는 것 등은,\n\n이를 독일이 완전히 패배하여\n\n(イ) 전 국토가 4구역으로 나뉘어 미·영·소·불 4개국의 군대가 각각 1구역을 점령하고 있는 것\n\n(ロ) 수도였던 베를린(伯林) 그 자체가 4개국으로 나뉘어 마찬가지로 4국의 군대가 각각 1구획을 점령하고 있는 것\n\n(ハ) 독일에는 주권자가 없고 정부도 없다고 하여 모든 특권은 각 점령군 최고지휘관으로 이루어지는 중앙감독위원회에 옮겨진 것(「바바리아」 기타에 지방정청을 두고 독일인으로 하여금 이에 임하게 하고 있다고는 하나, 이들은 점령군의 명령 아래 행동하는 치안유지회의 부류를 벗어나지 않는다)\n\n과 견주어 생각할 때, 그 상이가 현저함을 느끼지 않을 수 없다. 그러나 이 상이는 독일과 같이 완전 패배의 경우에는 이제는 존재하지 않게 될 위험이 있음을 살피지 않으면 안 된다.\n\n二、권고의 동기\n\n지금 미국 군부는 일률적으로 말할 수는 없겠으나 상당한 의기(意氣)라고 하며, 국내 여론도 그 대부분에서 양호하다고 보이는 바이나, 태평양전의 희생, 독일 궤멸 후의 암담한 유럽 정세(유럽의 회복은 손에 잡히지 않으며 식량 특히 연료의 부족으로 올겨울은 큰일이라고들 하여 외부 특히 미국으로부터의 대대적 원조를 필요로 한다고 보인다), 소련 세력의 진출 등에 비추어, 대일전의 조기 종결을 희망하는 경향이 적어도 미국 중앙 정계에 움직이고 있어, 무조건항복의 간판을 내리지 않은 채 사실상 이를 조금 완화하여 되도록 이른 시기에 칠 수 있을 때 치려는 미국의 「이니셔티브」에 의한 것이라고 생각한다. 그러나 위는 오히려(寧ロ) 미국 정치력의 움직임으로 보는 것이 안전하며, 이를 미국의 전쟁 피로로 보는 것도, 또 군민 이간의 모략이라고만 단정하는 것도, 모두 심히 유해하다고 확신한다.\n\n三、소련과의 （10어 탈락）\n\n「스탈린」이 미리 그 내용 및 공표할 것을 알고 있었을 것임은 의심할 바 없고, 그리하여 「스」가 이에 이의를 끼우지 않았을 것임도 상식상 명료하다고 한다면, 소·중(蘇支) 및 소·영미 간에 동아 문제의 처리에 관하여 극히 대략적이나마 속마음의 타합(肚ノ打合)도 이루어졌다고 보는 것이 안전하다(이를 소련 대 미영 관계의 관점에서 보면, 소련의 동아 진출 한도에 관하여 미영 측은 어느 정도의 전망을 붙일 수 있었다고 볼 수 있을 것이다). 따라서 이번 미·영·중의 권고 선언에 대한 우리의 태도 여하에 따라서는, 뒤이어 소련으로부터 우리에 대하여 어떤 내용의 권고를 들이대 올 공산이 있는 것으로 관찰한다.", "secondary": "1080昭和20年7月30日東鄕外務大臣宛（電報）在スイス加瀨公使よりポツダダ宣言に関する觀察\n\nベルン7月30日前1時10分發\n\n本省8月1日前10時10分着\n\n第八三七號（大至急、館長符號扱）\n\n三國宣言ニ關シテ\n\n一、獨ニ對スル態度トノ顯者ナル相異\n\n獨ニ對シテハ今囘ノ如キ全般的語調、形式ヲ以テ相當仔細ニ條件ヲ附スルト共ニ兒ニ角一定ノ保障ヲ與ヘツツ呼掛ケヲナシタルコトナシ就中\n\n(イ)皇室及國體ニ付觸レ居ラサルコト\n\n(ロ)日本主權ヲ認メ居ルコト\n\n(ハ)日本主權ノ行ハルル節圍タル日本國土ノ一部ヲ認メ居ルコト要スルニ日本民族カ死ヲ以テ擁護シツツアル國體ノ下ニ國家生活ヲ營ミ行ク基礎ヲ認ムル考ナルコト(二)所謂無條件降伏ノ又句ヲ用フルニ當リ右ハ日本軍ニ就キテテアリ日本國民又ハ政府ニ就キテニアラスト云フ印象ヲ與ヘ彼等トシテハ餘程考ヘタリト認メラルルコト此ノ外我ノ面子保持ヲ色々ナル點テ考ヘタル形跡アルコト\n\n(ホ)日本軍隊ハ武裝解除後平和的生産的生活ヲ送ル機會ヲ與ヘラルヘシト言ヒ居ルコト\n\nヘ（一）一般的平和産業ノ保持、原料入手、世界通商參加ヲ容認スト云ヒ居ルコト等ハ\n\n之ヲ獨カ完全敗北シ\n\n(イ)全國土カ四區域ニ分タレ米英蘇佛四ケ國ノ軍隊カ夫々一區域ヲ占領シ居ルコト\n\n(ロ)首府タリシ伯林其ノモノカ四ケ國ニ分タレ同樣四國ノ軍隊カ各々一區畫ヲ占領シ居ルコト\n\n(ハ)獨ニハ主權者ナク政府ナシトセラレ總テノ特權ハ各占領軍最高指揮官ヨリ成ル中央監督委員會ニ移サレタルコト（「ババリア」其ノ他ニ地方政廳ヲ設ケ獨人ヲシテ之ニ當ラセ居レリト雖モ之等ハ占領軍ノ命令下ニ行動スル治安維持會ノ類ヲ出テス）\n\nト思ヒ合セルトキ其ノ相異ノ顯者ナルヲ感セサルヲ得ス然シ乍ラ此ノ相異ハ獨ノ如ク完全敗北ノ場合ハ最早ヤ存在セサルニ至ル危險アルコトヲ察セサルヘカラス\n\n二、勸告ノ動機\n\n今ヤ米軍部ハ一慨ニハ言ヘサルヘキモ相當ノ意氣込ナリトノコトニテ國内團論モ其ノ大部分ニ於テ良好ト見ラルル處太平洋戰ノ犧牲ハ獨遭滅後ノ暗憺タル歐洲情勢（歐洲ノ囘復ハ手ニ着カス貪糧殊ニ燃料ノ不足ヨリ此ノ冬ハ大變ナリト言ハレ外部特ニ米ヨリノ大々的援助ヲ必要ト見ラル）蘇聯勢力ノ進出等ニ鑑ミ對日戰ノ早期終結ヲ希望スル傾向ハ少クトモ米中央政界ニ動キ無條件降伏ノ看板ヲ下ケスニ事實上少シク之ヲ緩和シ成ルヘク早目ニ手ヲ打テルモノナレハ打タントスル米ノ「イニシアチブ」ニ依ルモノト考フ然シ乍ラ右ハ學ロ米政治力ノ動キト見ルヲ安全トシ之ヲ以テ米ノ戰爭疲勞ト見ルコトモ將又軍民離間ノ謀略トノミ難スルコトモ共ニ甚タ有舌ナリト確信ス\n\n三、蘇聯トノ（十語脫）\n\n「スターリン」カ豫メ其ノ内容竝ニ公表ノコトヲ承知シ居タルヘキハ疑ナク而シテ「ス」カ右ニ異議ヲ挾マリシコトモ常識上明瞭ナリトスレハ蘇支竝ニ蘇英米間ニ東亞問題ノ處理ニ付極ク大筋乍ラ肘ノ打合モ出來タルモノト見ルヲ安全トス（之ヲ蘇對米英關係ノ觀點ヨリスレハ蘇聯ノ東亞進出ノ限度ニ付米英側ハ或程度ノ見透シヲ付ケ得タリト見ルヲ得ヘシ）從テ今次米英支ノ勸告宣言ニ對スル我ノ態度ニ依リテハ次テ蘇聯ヨリ我ニ對シ或ル内容ノ勸告ヲ突キ付ケ來ル公算アルモノト觀察ス", "notes": ["「（十語脫）」 — 편자가 표시한 결락. 「三、蘇聯トノ」 다음 10자가 빠져 있다."], "warn": true, "pages": [1900, 1901], "search": "ポツダム宣言に関する觀察 加瀨俊一 가세 슌이치 (주스위스 공사) 東鄕茂德 도고 시게노리 (외무대신) 「スターリン」 스탈린"}, {"id": "d966", "order": 966, "date": "1945-07-31", "group": "A", "eyebrow": "문서 966 · 二 中立国を通じた和平打診", "title": "후지무라 해군무관에 의한 덜레스 공작에 대해서는 묵살함이 마땅하다는 보고에 대하여", "badge": "第八四六號（館長符號）", "list_right": "문서 966", "meta": [{"k": "일자", "v": "1945-07-31", "txt": false}, {"k": "발신", "v": "在スイス加瀨公使 주스위스 가세 슌이치 공사", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 외무대신", "txt": true}, {"k": "발착", "v": "ベルン7月31日後6時20分發 / 本省8月6日前11時10分着", "txt": false}, {"k": "장소", "v": "ベルン 베른", "txt": false}, {"k": "전보번호", "v": "第八四六號（館長符號）", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "가세 공사가 도고 외상의 제372호에 답하여, 덜레스 접촉은 미국 측의 이니셔티브로 보기 어려우므로 묵살함이 마땅하며, 중개한 「확실한 제3자」는 방공협정 당시 일독 연락계였던 독일인 「하크」라고 보고한 전보.", "points": ["본건을 해군무관 및 보좌관으로부터 청취했다. 베른에는 정식 해군무관이 없고 공사관 해군고문이 있을 뿐이다", "후지무라 보좌관 착임 후 그의 성격상, 그리고 니시하라 무관이 기술관인 관계로 여러 문제가 발생하고 있다(공관 내부 사정을 명시)", "「이니셔티브」가 미국 측에서 나온 것으로는 인정하기 어려우므로 묵살되는 것이 마땅하다고 생각한다(默殺セラルルコト然ルヘシト存ス)", "「다라스(덜레스)」의 인물에 대해서는 왕전 제799호로 이미 보고한 대로다", "「확실한 제3자」란 방공협정 당시 일·독 간 연락계였던 독일인 「하크(ハツク)」이며, 종래 현지에서 해군 측이 써 오던 인물이다", "본건은 하크가 덜레스의 비서와 친구인 관계를 이용한 것으로 인정된다"], "primary": "**베른 7월 31일 후 6시 20분 발**\n\n**본성 8월 6일 전 11시 10분 착**\n\n**제846호（관장부호）**\n\n귀전 제372호에 관하여\n\n본건을 해군무관 및 보좌관으로부터 청취하였는바(당지에는 정식으로 해군무관이 없고 당관 해군고문이 있을 뿐인데, 후지무라(藤村) 보좌관 착임 후 동인의 성격상 및 니시하라(西原) 무관이 기술관인 관계로부터 여러 가지 문제를 야기하고 있음), 「이니셔티브」가 미국 측에서 나온 것이라고는 인정하기 어려우므로 묵살되는 것이 마땅하다고 생각합니다(默殺セラルルコト然ルヘシト存ス).\n\n또한 「다라스(ダラス)」의 인물 등에 관하여는 왕전(往電) 제799호로 이미 아시는 바와 같으며, 또 확실한 제3자란 일찍이 방공협정 당시 일·독 간의 연락계였던 독일인 「하크(ハツク)」로서, 종래 당지에서 해군 측이 사용하여 온 경위가 있습니다. 본건은 동인이 「다라스」의 비서와 친구인 관계를 이용한 것으로 인정됩니다.", "secondary": "966昭和20年7月31日東鄕外務大臣宛（電報）在スイス加瀨公使より藤村海軍武官によるダレス工作については默\n\n殺が然るべしとの報告について\n\nベルン7月31日後6時20分發\n\n本省8月6日前11時10分着\n\n第八四六號（館長符號）\n\n貴電第三七二號ニ關シ\n\n本件海軍武官及輔佐官ヨリ聽取セルカ（當地ニハ正式ニ海軍武官ナク當館海軍顧問ナルカ藤村輔佐官者任後同人ノ性格上竝ニ西原武官カ技術官ナル關係ヨリ種々問題ヲ惹起シ居レリ）「イニシアチブ」カ米國側ヨリ出テタルモノトハ認メ難キニ付默殺セラルルコト然ルヘシト存ス尙「ダラス」ノ人物等ニ付テハ往電第七九九號ニテ御承知ノ通リ又確實ナル第三者トハ豫テ防共協定當時日獨ノ間ニ連絡係タリシ獨人「ハツク」ニシテ從來當地ニ於テ海軍側ノ使用シ居リタル經緯アリ本件ハ同人カ「ダラス」ノ祕書ト友人ナル關係ヲ利用セルモノト認メラル", "notes": [], "warn": false, "pages": [1732], "search": "藤村海軍武官によるダレス工作については默殺が然るべしとの報告について 加瀨俊一 가세 슌이치 (주스위스 공사) 東鄕茂德 도고 시게노리 (외무대신) 藤村 후지무라 (베른 해군무관보좌관) 西原 니시하라 (무관, 기술관) 「ダラス」 다라스 = Dulles 덜레스 「ハツク」 하크 (독일인, 방공협정 당시 일독 연락계)"}, {"id": "d1081", "order": 1081, "date": "1945-08-04", "group": "A", "eyebrow": "문서 1081 · 四 ポツダム宣言の受諾", "title": "포츠담 선언을 기초로 하여 일본 측에서 통달해야 할 화평 제안에 대하여", "badge": "第一五二○號（館長符號、緊急）", "list_right": "문서 1081", "meta": [{"k": "일자", "v": "1945-08-04", "txt": false}, {"k": "발신", "v": "在ソ連邦佐藤大使 주소련 사토 나오타케 대사", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 외무대신", "txt": true}, {"k": "발착", "v": "モスクワ8月4日後10時28分發 / 本省8月5日後5時15分着", "txt": false}, {"k": "장소", "v": "モスクワ 모스크바", "txt": false}, {"k": "전보번호", "v": "第一五二○號（館長符號、緊急）", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "사토 대사가, 소련이 알선을 맡든 안 맡든 대동아전 종결의 기초는 7월 26일 3국 대일선언일 수밖에 없다고 못박고, 가세 공사의 관찰에 전폭 동감을 표하며, 화평 결의의 통달이 하루라도 빠를수록 조건이 완화되고 늦어지면 전 국토가 초토로 화하여 제국은 멸망의 한 길밖에 없다고 진언한 긴급 전보. 히로시마 이틀 전이다.", "points": ["소련 정부가 전쟁 종결의 알선을 맡든 맡지 않든, 이번 대동아전 종결을 위해서는 7월 26일의 미영중 3국 대일선언이 그 기초여야 함은 이제 움직이기 어려운 바이다", "소련이 중개의 수고를 맡을 경우에도 그 기초 위에서 이루어질 것은 자연한 귀결이다", "귀전 제973호 괄호 안의 기술은 「적어도 3국 선언을 아측 조건 연구(攻究)의 기초로 삼고 싶다」는 뜻으로, 지극히 좋다고 생각한다", "귀전 합 제629호로 전전(轉電)받은 주스위스 가세 공사의 3국 선언에 관한 고찰은 극히 중정타당(中正妥當)한 관찰로 생각되며, 본사(本使)도 전폭적 동감을 표하는 바이다", "가세 공사의 해석대로라면, 그 기초 위에서 입안될 강화 조건은 이번 「포츠담」 3국 회의 결정에 관계된 독일 처리 조건에 비해 어느 정도 완화된 것이 되리라 상상하는 것을 반드시 견강부회의 설이라 할 수 없다", "일본의 평화 제창 결의가 하루라도 빨리 연합 측에 통달되면 그만큼 조건 완화의 정도가 커진다는 도리인 반면, 정부와 군부의 결의가 이루어지지 않아 임염(荏苒) 날을 허송함에 있어서는 일본 전 국토가 초토로 화하고 제국은 멸망의 한 길을 밟지 않을 수 없게 될 것이다", "아무리 완화된다 하더라도 강화 조건이 어떤 것일지는 독일의 예를 볼 것까지도 없이 사전에 이미 명백하며, 다수의 전쟁 책임자를 낼 것도 미리 각오하지 않으면 안 된다", "그러나 지금 국가는 멸망의 한 걸음 앞에 있으니, 이들 전쟁 책임자가 참으로 애국의 사(士)로서 조용히(從容) 제국의 희생자가 된다 하더라도 참으로 부득이한 바로 삼아야 할 것이다", "가세 공사의 의견을 읽고 감회 극히 깊은 바가 있어 감히 비견(卑見)을 올린다"], "primary": "**모스크바 8월 4일 후 10시 28분 발**\n\n**본성 8월 5일 후 5시 15분 착**\n\n**제1520호（관장부호, 긴급）**\n\n왕전(往電) 제1517호에 관하여\n\n소련 정부가 전쟁 종결의 알선(斡旋)을 맡든 맡지 않든 이에 구애되지 않고, 이번 대동아전 종결을 위해서는 7월 26일의 미·영·중 3국 대일선언이 그 기초여야 함은 이제 움직이기 어려운 바로서, 소련이 중개의 수고를 맡을 경우에도 위 기초 위에서 행하여질 것은 자연한 귀결이다. 이 점에서 귀전 제973호 괄호 안의 기술은, 적어도 3국 선언을 아측 조건 연구(攻究)의 기초로 삼고자 하시는 어소존(御所存)이라는 것으로서, 지극히 좋다고 생각된다.\n\n이에 관하여, 귀전 합 제629호로써 전전(轉電)을 받은 주스위스 가세 공사의 3국 선언에 관한 고찰은 극히 중정타당(中正妥當)한 관찰로 생각되며, 본사(本使)도 전폭적 동감을 표하는 바이다. 만약 위 선언이 동 공사의 해석과 같은 것이라고 한다면, 그 기초 위에서 입안될 강화 조건은 이번 「포츠담」 3국 회의 결정에 관계된 독일 처리 조건에 비하여 어느 정도 완화된 것이 되리라고 상상하는 것을 반드시 견강부회의 설이라고 할 수는 없다. 그리하여 위는 일본의 평화 제창 결의가 하루라도 빨리 연합 측에 통달되면 그만큼 조건 완화의 정도가 더해지게 되는 도리인 데 반하여, 만약 정부·군부의 결의가 이루어지지 않아 임염(荏苒) 날을 허송함에 있어서는, 일본 전 국토가 초토로 화하고 제국은 멸망의 한 길을 밟지 않을 수 없게 될 것이다.\n\n아무리 완화된다 하더라도 강화 조건이 여하한 것일지는 독일의 예를 볼 것까지도 없이 사전에 이미 명백하니, 다수의 전쟁 책임자를 내게 될 것도 미리 각오하지 않으면 안 된다. 그렇지만 지금 국가는 멸망의 한 걸음 앞에 있으니, 이들 전쟁 책임자가 참으로 애국의 사(士)로서 조용히(從容) 제국의 희생자가 된다 하더라도 참으로 부득이한 바로 삼아야 할 것이다.\n\n가세 공사의 의견을 읽고 감회 극히 깊은 바가 있어 감히 비견(卑見)을 올린다.", "secondary": "1081昭和20年8月4日東鄕外務大臣宛（電報）在ソ連邦佐藤大使よりポツダダ宣言を基礎として日本側より通達す\n\nべき和平提案について\n\nモスクワ8月4日後10時28分發\n\n本省8月5日後5時15分着\n\n第一五二○號（館長符號、緊急）\n\n往電第一五一十號ニ關シ\n\n蘇聯政府カ戰爭終結ノ幹旋ヲ引受クルト否トニ不拘今次ノ大東亞戰終結ノ爲ニハ十月二十六日ノ米英支三國對日宣言カ其ノ基礎タルヘキコト最早動カシ難キ所蘇聯カ仲介ノ勞ヲ取ル場合ニモ右ノ基礎ニ於テ爲サルヘキコト自然ノ歸結ナリ此ノ點ニ於テ貴電第九十三號括弧内ノ、述ハ少クトモ三國宣言ヲ我方條件攻究ノ基礎トシタキ御所存トノコトニテ至極結構ト存セラル\n\n右ニ付貴電合第六二九號ヲ以テ轉電ヲ受ケタル在瑞西加瀨公使ノ三國宣言ニ關スル考察ハ極メテ中正安當ノ觀察ト思考セラレ本使モ全幅的同感ヲ表スル所ナリ若シ右宣言カ同公使解釋ノ如キモノナリトセハ其ノ基礎ニ於テ立案セラルヘキ講和條件ハ今次ノ「ポツダム」三國會議決定ニ係ル獨逸處理條件ニ比シ或ル程度緩和セラレタルモノトナルヘシト想像スルコト必スシモ牽强附會ノ說ト云フヘカラス而シテ右ハ日本ノ平和提唱ノ決意カ一日早ク聯合側ニ通達セラルレハ夫レ丈條件緩和ノ度ヲ增スコトトナル道理ナルニ反シ若シ政府軍部ノ決意成ラス荏萬日ヲ空ウスルニ於テハ日本全土焦土ト化シ帝國ハ滅亡ノ一途ヲ迴ラサルヲ得サルヘシ\n\n如何ニ緩和セラルルトスルモ講和條件ノ如何ナルモノナルヘキヤハ獨逸ノ例ニ觀ル迄モナク事前ニ於テ旣ニ明カニシテ多數ノ戰爭靑任者ヲ出スコトモ豫メ蠻悟セサルヘカラス去リ乍ラ今ヤ國家ハ滅亡ノ一步前ニアリ此等戰爭靑任者カ眞ニ愛國ノ十トシテ從容帝國ノ犧牲者トナルモ眞ニ已ムヲ得サル所トスヘシ\n\n加瀨公使ノ意見ヲ讀ンテ感極メテ深キモノアリ敢テ罕見ヲ呈ス", "notes": [], "warn": false, "pages": [1901, 1902], "search": "ポツダム宣言を基礎として日本側より通達すべき和平提案について 佐藤尚武 사토 나오타케 (주소련 대사) 東鄕茂德 도고 시게노리 (외무대신) 加瀨俊一 가세 슌이치 (주스위스 공사)"}, {"id": "d1082", "order": 1082, "date": "1945-08-07", "group": "A", "eyebrow": "문서 1082 · 四 ポツダム宣言の受諾", "title": "포츠담 회담에서의 대일 처리안 등에 관한 관찰에 대하여", "badge": "第二六四號", "list_right": "문서 1082", "meta": [{"k": "일자", "v": "1945-08-07", "txt": false}, {"k": "발신", "v": "在ポルトガル森島公使 주포르투갈 모리시마 공사", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 외무대신", "txt": true}, {"k": "발착", "v": "リスボン8月7日後8時40分發 / 本省8月8日後5時55分着", "txt": false}, {"k": "장소", "v": "リスボン 리스본", "txt": false}, {"k": "전보번호", "v": "第二六四號", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "모리시마 공사가 포츠담 회의와 관련한 다섯 항목의 관찰을 보고한 전보. 대일 처리안을 둘러싼 미국 내 극단론의 실제 세력, 3국 선언이 스탈린의 암묵적 양해를 전제했으리라는 점, 그리고 장래 만주·조선이 강화 조항 논의의 조상(俎上)에 오를 것을 당연히 인정해 두어야 한다는 관찰이다.", "points": ["一、대일 처리안이다. 군벌 제거, 전쟁 책임자 처벌, 군사공업 폐지, 「카이로」 선언에 근거한 영토 박탈 등의 제 항목은 미국 내에서 일반의 지지를 받고 있다", "이에 대해 그것만으로는 지난 대전 후 「바이마르」 공화제로부터 「나치스」 독일 발흥을 유치한 것과 같은 잘못을 되풀이할 것이라는 이유로, 황실에 대한 근본적 대책과 재벌·지주계급 배제에 관한 근본적 사회개혁을 요망하는 논의가 행해지고 있다(3사 공통전 참조 요망)", "그러나 이 극단론이 얼마만한 세력을 가지는지는 심히 의문이며, 미국 신문·잡지를 종합하면 일부 논자에 국한된 것으로 관찰함이 타당하다고 인정된다", "대일 「포츠담」 선언 발출 당시 미국 상원의 논의는 대체로 선언을 시인하는 데 그쳤고 그 이상의 조건을 요망하는 논의는 없었던 듯하다", "선언 중에 특히 종교의 자유를 명기한 것은, 신도(神道)는 황실과 관계가 있으므로 이를 말살해야 한다는 앞의 극단론을 부인한 것으로 관찰된다", "二、「포츠담」 회의 중 극동 문제에 관해 의견 교환이 있었음은 추찰하기 어렵지 않으나, 따로 구체적 결정에 이르지 않은 것은 중국(지나)의 참가가 없었던 데 따른 것으로 생각된다", "다만 대일 「포츠담」 3국 선언의 발출은 아마도 스탈린의 암묵적 양해를 전제한 것일 터이며, 이 선언이 「카이로」 성명에 근거한 일본 영토의 처분을 명기하고 있는 점에서 보면, 장래 만주·조선에 관한 미·소·중 3국 간의 양해가 불가능한 일이 아님을 지시하고 있다고 말할 수 있다", "특히 종래의 3국 외상회의에 프랑스·중국 양국을 더하여 강화조약의 준비를 행하게 하려는 이상, 「포츠담」 결의가 현하의 문제로서 특히 이탈리아 기타 제국을 들고 있다 하더라도 대일 강화 조항에 관해서도 논의를 보게 될 것이며, **만주·조선이 조상(俎上)에 오를 것은 당연하다고 인정해 두지 않으면 안 된다**", "三、연합국 기구에 대한 중립국 가맹이다. 「포츠담」 결의는 「프랑코」 정권 부인과 대조적으로 「살라자르」 정권에는 언급하지 않았다. 포르투갈 현 정부가 「아조레스」 협정과 「울프람」 대책으로 영미에 다대한 편익을 주었고 최근 아조레스의 민간 비행장 건설을 무상 허용한 사례도 있어 영미 접근 정책을 취하고 있는 관계상, 소련도 별다른 이론을 제시하지 않은 것일 터이며, 본건 결의는 도리어 「사」의 지위 강화에 이바지할 것이다", "四、헝가리·루마니아·불가리아 등에서의 소련의 독자적 행동, 이른바 소련 세력권 하에서의 영미 신문기자 출입 금지, 배상 문제를 둘러싼 소련의 독일 내 설비·기계 반출 등의 문제에 관해서도 양해가 성립했으며, 회의 전반이 3국 호양의 정신에 지배된 자취가 현저하여 영국 신문은 일반적으로 3국 간 결속 강화를 회의의 일대 수확으로 삼고 있다", "五、「포츠담」 결의로 보건대 연합국으로서는 전반적 평화회의를 예정하지 않고 관계 제국과의 개별적 강화(媾和)에 의하여 시국의 수습을 도모하려는 방침인 것으로 인정된다"], "primary": "**리스본 8월 7일 후 8시 40분 발**\n\n**본성 8월 8일 후 5시 55분 착**\n\n**제264호**\n\n「포츠담」 회의 등에 관련하여 다음의 제 점을 우선 (보고합니다).\n\n一、대일 처리안에 관하여, 군벌의 제거, 전쟁 책임자의 처벌, 군사공업의 폐지, 「카이로」 선언에 근거한 영토의 박탈 등의 제 항목은 미국 내에서 일반의 지지를 받고 있는 바이나, 이에 대하여 앞에 적은 제 조항만으로는 지난 대전 후 「바이마르」 공화제로부터 「나치스」 독일의 발흥을 유치(誘致)한 것과 같은 잘못을 되풀이할 것이라는 이유 아래, 황실에 대한 근본적 대책 및 재벌·지주계급 배제에 관한 근본적 사회개혁을 요망하는 논의가 행하여지고 있는 바(3사 공통전 참조 바람), 위 극단론이 얼마만 한 세력을 가지고 있는지는 심히 의문으로서, 미국 신문 및 잡지 등을 종합하건대 일부 논자에 국한되어 있는 것으로 관찰함이 타당하다고 인정된다. 대일 「포츠담」 선언 발출 당시 미국 상원의 논의는 대체로 위 선언을 시인함에 그치고 그 이상의 조건을 요망하는 논의는 없었던 듯하며, 또 동 선언 중에 특히 종교의 자유를 명기한 것은, 신도(神道)는 황실과 관계가 있으므로 이를 말살하여야 한다는 앞에 적은 극단론을 부인한 것으로 관찰된다.\n\n二、「포츠담」 회의 중 극동 문제에 관하여 의견의 교환이 있었음은 추찰하기 어렵지 아니하나, 따로 구체적 결정에 이르지 아니한 것은 중국(지나)의 참가가 없었던 데 따른 것으로 생각된다. 다만 대일 「포츠담」 3국 선언의 발출은 아마도 「스탈린」의 암묵의 양해를 전제로 한 것일 터이며, 위 선언이 「카이로」 성명에 근거한 일본 영토의 처분을 명기하고 있는 점에서 보건대, 장래 만주·조선에 관한 미·소·중 3국 간의 양해가 불가능한 일이 아님을 지시하고 있는 것이라고 말하여야 할 것이다.\n\n특히 종래의 3국 외상회의에 프랑스·중국(佛支) 양국을 더하여 강화조약의 준비를 행하게 하려는 이상, 「포츠담」 결의가 현하의 문제로서 특히 이탈리아(伊太利) 기타의 제국(諸國)을 들고 있다고는 하더라도 대일 강화 조항에 관하여도 논의를 보기에 이를 것이며, 만주·조선이 조상(俎上)에 오를 것은 당연하다고 인정해 두지 않으면 안 된다.\n\n三、연합국 기구에 대한 중립국의 가맹에 관하여, 「포츠담」 결의는 「프랑코」 정권 부인에 대조하여 「살라자르」 정권에는 언급하고 있지 않다. 앞서 소련은 소련 비승인국의 참가를 이유로 「시카고」 항공회의 참가를 거부한 일이 있고, 또 브라질(伯剌西爾)의 소련 승인 당시 포르투갈(葡國) 국내 일부에서는 포르투갈은 소련 승인을 부득이하게 될 것이며 나아가(延イテ) 「사」 정권의 몰락에 이를 것이라는 의견조차 행하여지고 있었으나, 포르투갈 현 정부로서는 「아조레스」 협정 및 「울프람」 대책에 의하여 영미에 다대한 편익을 주었을 뿐 아니라 최근 미국에 대하여 「아조레스」에서의 민간 비행장의 건설을 무상 허용한 사례도 있어 영미 접근의 정책을 취하고 있는 관계상, 소련도 포르투갈에 관하여 별다른 이론(異論)을 제시하지 아니한 것일 터이며, 본건 결의는 도리어 「사」의 지위 강화에 이바지하는 바가 있을 것이다(영국 노동당 내각 성립에 관련한 포르투갈 사정에 관하여는 따로 전보하겠음).\n\n四、종래 영미에서 이러니저러니 문제가 되어 있던 헝가리(洪牙利)·루마니아(羅馬尼)·불가리아(勃牙利) 등에서의 소련의 독자적 행동, 이른바 소련 세력권 하에서의 영미 신문기자의 출입 금지 그리고 배상 문제를 둘러싼 소련의 독일 내 설비 및 기계의 반출 등의 문제에 관하여도 양해가 성립하였으며, 중요 안건이었던 대독·대폴란드(對波蘭)의 처리 등을 포함하여 회의 전반이 3국 호양의 정신에 지배된 자취가 현저하여, 영국 신문은 일반적으로 3국 간 결속의 강화를 회의의 일대 수확으로 삼고 있다.\n\n五、「포츠담」 결의로 보건대, 연합국으로서는 전반적 평화회의를 예정하지 아니하고 관계 제국과의 개별적 강화(媾和)에 의하여 시국의 수습을 도모하려는 방침인 것으로 인정된다.", "secondary": "1082昭和20年8月7日東鄕外務大臣宛（電報）在ポルトガル森島公使よりポツダダ会談における対日処理案等に関する\n\n觀察について\n\nリスボン8月7日後8時40分發\n\n本省8月8日後5時55分着\n\n第二六四號\n\n「ポツダム」會議等ニ關聯シ左記諸點不取敢\n\n一、對日處理案ニ關シ軍閥ノ除去、戰爭靑任者ノ處罰、軍事丁業ノ廢止、「カイロ」宣言ニ基ク領土ノ剝奪等ノ諸項ハ米國内ニ於テ一般ノ支持ヲ受ケ居ル所ナルカ右ニ對シ前記諸條項ノミニテハ前大戰後「ワイマール」共和制ヨリ「ナチス」獨逸勃興ヲ誘致セルカ如キ誤ヲ繰返スヘシトノ理由ノ下ニ皇室ニ對スル根本的對策竝ニ財閥及地主階級排除ニ關スル根本的社會改革ヲ要望スルノ議行ハレ居ル處（三社共通電參昭請フ）右極端論カ如何程ノ勢力ヲ有シ居ルヤハ甚タ疑問ニシテ米紙竝ニ雜誌等ヲ綜合シ一部論者ニ局限セラレ居ルモノト觀察スルコト安當ト認メラル對日「ポツダム」宣言發出當時米國上院ノ論議ハ大體右宣言ヲ是認スルニ止マリ右以上ノ條件ヲ要望スル論議ナカリシカ如ク又同宣言中ニ特ニ宗敎ノ自由ヲ明記セルハ神道ハ皇室ト關係アルカ故ニ之ヲ抹殺スヘシトノ前記極端論ヲ否認シタルモノト觀察セラル\n\n二、「ポツダム」會議中極東問題ニ關シ意見ノ交換アリタルハ推察ニ難カラサルモ別ニ具體的決定ニ至ラサリシハ支那ノ參加ナカリシニ依ルモノト思考セラル伯シ對日「ポツダム」三國宣言ノ發出ハ恐ラク「スターリン」ノ暗默ノ了解ヲ前提トセルモノナルヘク右宣言カ「カイロ」聲明ニ基ク日本領土ノ處分ヲ明記シ居ル點ヨリ見ルニ將來滿洲、朝鮮ニ關スル米蘇支三國間ノ了解ノ不可能事ニアラサルヲ指示シ居ルモノト言フヘシ\n\n殊ニ從來ノ三國外相會議ニ佛支兩國ヲ加ヘ講和條約ノ準備ヲ行ハシメントスル以上「ポツダム」決議ハ現下ノ問題トシテ特ニ伊太利其ノ他ノ諸國ヲ擧ケ居レリト雖モ對日講和條項ニ付テモ論議ヲ見ルニ至ルヘク滿洲、朝鮮ノ□上ニ上ルコト當然ナリト認メ置カサルヘカラス\n\n三、聯合國機構ニ對スル中立國ノ加盟ニ關シ「ポツダム」決議ハ「フランコ」政權否認ニ對昭シ「サラザール」政權ニハ言及シ居ラス曩ニ蘇聯ハ蘇聯非承認國ノ參加ヲ理由ニ「シカゴ」航空會議參加ヲ拒否セルコトアリ又伯刺西爾ノ蘇聯承認當時葡國内一部ニハ葡國ハ蘇聯承認ヲ餘儀ナクセラルヘク處イテ「サ」政權沒落ニ至ルヘシトノ意見スラ行ハレ居タルモ葡國現政府トシテハ「アゾーレス」協定竝ニ「ウオルフラム」對策ニ依リ英米ニ多大ノ便益ヲ與ヘタルノミナラス最近米國ニ對シ「アゾーレス」ニ於ケル民間飛行場ノ建設ヲ無償許容セル事例モアリ英米接近ノ政策ヲ執リ居ル關係上蘇聯モ葡國ニ關シ別段異論ヲ提示セサリシモノナルヘク本件決議ハ却テ「サ」ノ地位强化ニ資スル所アルヘシ（英國勞働黨内閣成立ニ關聯スル葡國事情ニ付テハ別電ス）\n\n四、從來英米ニ於テ兒角問題トナリ居タル洪牙利、羅馬尼、勃牙利等ニ於ケル蘇聯ノ獨自的行動、所謂蘇聯勢力圈下ニ於ケル英米新聞記者ノ立入禁止竝ニ暗償問題ヲ繞ル蘇聯ノ獨逸内設備及機械ノ搬出等ノ問題ニ付テモ諒解成立シタルカ重要案件タリシ對獨、對波蘭ノ處理等ヲ含ミ會議全般カ三國互讓ノ精神ニ支配セラレタル跡顯者ニシテ英新聞ハ一般ニ三國間結束ノ强化ヲ以テ會議ノ一大收穫ト爲シ居レリ\n\n□、「ポツダム」決議ヨリ見ルニ聯合國トシテハ全般的平和會議ヲ豫定セス關係諸國トノ個別的□和ニ依リ時局ノ收拾ヲ圖ラントノ方針カト認メラル", "notes": [], "warn": false, "pages": [1902, 1903, 1904], "search": "ポツダム会談における対日処理案等に関する觀察について 森島守人 모리시마 모리토 (주포르투갈 공사 — 원문은 「森島公使」) 東鄕茂德 도고 시게노리 (외무대신) 「スターリン」 스탈린 「フランコ」 프랑코 「サラザール」 살라자르"}, {"id": "d1083", "order": 1083, "date": "1945-08-07", "group": "A", "eyebrow": "문서 1083 · 四 ポツダム宣言の受諾", "title": "포츠담 회담 토의 내용에 관한 미국 측의 정보에 대하여", "badge": "第二六五號", "list_right": "문서 1083", "meta": [{"k": "일자", "v": "1945-08-07", "txt": false}, {"k": "발신", "v": "在ポルトガル森島公使 주포르투갈 모리시마 공사", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 외무대신", "txt": true}, {"k": "발착", "v": "リスボン8月7日前2時30分發 / 本省8月8日後2時50分着", "txt": false}, {"k": "장소", "v": "リスボン 리스본", "txt": false}, {"k": "전보번호", "v": "第二六五號", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "리스본 공관 첩자가 미국 측에서 얻은 정보. 포츠담 3국 회의에서 대일 문제는 토의되지 않았으나 아시아 문제가 논의되었고, 카이로 회의와 얄타 회의 결정의 「식위(喰違, 어긋남)」를 조정하려다 실패했다는 보고다. 그 어긋남이란 카이로에서는 조선의 독립을 약속하고 만주·타이완·펑후도의 회복을 중국에 약속한 데 대해, 얄타에서 영미가 만주·타이완에 관해 무엇인가 영토적 약속을 소련에 주었다는 것이다.", "points": ["一、5일 당관 첩자가 미국 측에서 얻은 정보다", "(イ) 「포츠담」 3국 회의에서 대일 문제는 토의되지 않았으나, 그와 별개로 아시아 문제에 관해 토의가 행해져 「카이로」 및 「얄타」 양 회의 결정의 어긋남(喰違)의 조정을 도모했으나 성공하지 못했다. 트루먼이 다음 회 워싱턴에서 3국 회의 재개를 종용(慫慂)한 것은 이 때문이며, 동 회의에는 대일 문제 상정을 보게 될 것이다", "(ロ) 이른바 어긋남이란, 「카이로」 회의에서는 조선의 독립은 약속하였으나 만주 및 타이완 그리고 펑후도(澎湖島)의 회복을 중국(지나)에 약속한 데 대하여, 「얄타」 회의에서 영미는 만주 및 타이완에 대하여 무엇인가의 영토적 약속을 소련에 주었다는 것이다", "二、「카이로」와 「얄타」 회의의 어긋남에 대해서는 지금까지도 약 1개월 전부터 같은 정보가 있었다", "(イ) 7월 27일 런던발 「로이터」 외교 특파원은, 대일 항복 권고에서 일본의 영토 상실은 재확인되었으나 상실 후 영토의 처분에 관해 과연 「카이로」 회의의 결정이 유지될 것인지 여부의 질문에 대해 관변 측의 회답이 없다는 뜻을 보도", "(ロ) 또 7월 25일 런던발 「로이터」 군사통신원 Jon Kimche의 통신은, 트루먼이 스탈린에게 어떤 종류의 약속을 주었다는 뜻을 보도하고 있다", "三、또 샌프란시스코(桑港) 회의에서 소련 전문위원은, 만주 및 조선은 독립국이 될 도의적 권리가 있음은 명백하나 소련의 하나로 가맹할지 여부는 당해국이 결정할 사항이라고 말하였고, 또 타이완에 관해서는 그 일부에 대해 소련을 포함한 안전보장이사회의 통제 아래에서 기지를 설정하여도 무방하다는 뜻을 말하여(왕전 제195호), 마치 「카이로」 결정을 무시한 언동이 있었다", "또 스페인(西班牙) 및 만주국의 국제연합 가입 거부에 관한 멕시코(墨西哥)의 제의와 같은 것도 만주국의 독립을 전제로 하는 듯이 보인다", "그 밖에 5월 15일 런던발 「로이터」에 의하면, 샌프란시스코 회의에서 소련은 태평양전에 참가하고 있지 않음에도 불구하고 유럽에서와 마찬가지로 태평양 문제에 관해서도 확고한 해결안을 가지고 있음이 명료해졌다는 뜻을 보도하고 있다", "(동 전보는, 위 약속이 소련의 만족하는 바가 될 경우에는 소련은 일본에 항복 제안을 하고 받아들여지지 않으면 대일 개전을 할 것이나, 일본이 본토 침략에 대해 만반의 준비를 갖추고 결전의 태세를 보여 (2어 탈락) 「포츠담」 회의의 결정에 영향을 줄 것이라고 보도하였다)"], "primary": "**리스본 8월 7일 전 2시 30분 발**\n\n**본성 8월 8일 후 2시 50분 착**\n\n**제265호**\n\n一、5일 당관(當館) 첩자가 미국 측으로부터 얻은 정보에 의하면\n\n(イ) 「포츠담」 3국 회의에서 대일 문제는 토의되지 아니하였으나, 이와는 별개로 아시아(亞細亞) 문제에 관하여 토의가 행하여져, 「카이로」 및 「얄타」 양 회의 결정의 어긋남(喰違)의 조정을 도모하였으나 성공하지 못하였다. 「트루먼」이 다음 회 워싱턴(華盛頓)에서의 3국 회의 재개를 종용(慫慂)한 것은 이를 위함이며, 동 회의에서는 대일 문제의 상정을 보게 될 것이다.\n\n(ロ) 위의 이른바 어긋남이란, 「카이로」 회의에서는 조선의 독립은 약속하였으나 만주 및 타이완(臺灣) 그리고 펑후도(澎湖島)의 회복을 중국(지나)에 약속한 데 대하여, 「얄타」 회의에서 영미는 만주 및 타이완에 대하여 무엇인가의 영토적 약속을 소련에 주었다는 것이다.\n\n二、「카이로」 및 「얄타」 회의의 어긋남에 관하여는 지금까지도 약 1개월 전부터 동일한 정보가 있었는데,\n\n(イ) 7월 27일 런던발 「로이터」 외교 특파원은, 대일 항복 권고에서 일본의 영토 상실이 재확인되었으나 상실 후의 영토의 처분에 관하여 과연 「카이로」 회의의 결정이 유지될 것인지 여부의 질문에 대하여 관변 측의 회답이 없다는 뜻을 보도하였고,\n\n(ロ) 또 7월 25일 런던발 「로이터」 군사통신원 Jon Kimche의 통신은, 「트루먼」이 「스탈린」에 대하여 어떤 종류의 약속을 주었다는 뜻을 보도하고 있다.\n\n三、또한 상항(桑港, 샌프란시스코) 회의에서 소련 전문위원은, 만주 및 조선은 독립국이 될 도의적 권리가 있음은 명백하나 소련의 하나로 가맹할지 여부는 당해국이 결정하여야 할 사항이라고 말하였고, 또 타이완에 관하여는 그 일부에 대하여 소련을 포함한 안전보장이사회의 통제 아래에서 기지를 설정하여도 무방하다는 뜻을 말하여(왕전 제195호), 마치 「카이로」 결정을 무시한 언동이 있었다. 또 스페인(西班牙) 및 만주국의 국제연합 가입 거부에 관한 멕시코(墨西哥)의 제의와 같은 것도 만주국의 독립을 전제로 하는 듯이 보이는 바이며, 그 밖에 5월 15일 런던발 「로이터」에 의하면 상항 회의에서 소련은 태평양전에 참가하고 있지 아니함에도 불구하고 유럽에서와 마찬가지로 태평양 문제에 관하여도 확고한 해결안을 가지고 있음이 명료해졌다는 뜻을 보도하고 있다(동 전보는, 위 약속이 소련의 만족하는 바가 될 경우에는 소련은 일본에 항복 제안을 하고 받아들여지지 않으면 대일 개전을 할 것이나, 일본이 본토 침략에 대하여 만반의 준비를 갖추고 결전의 태세를 보여 （2어 탈락） 「포츠담」 회의의 결정에 영향을 줄 것이라고 보도하였다).", "secondary": "1083昭和20年8月7日東鄕外務大臣宛（電報）在ポルトガル森島公使よりポツダダ会談討議内容に関する米国側の情報\n\nについて\n\nリスボン8月7日前2時30分發\n\n本省8月8日後2時50分着\n\n第二六五號\n\n一、五日當館諜者カ米國側ヨリ得タル情報ニ依レハ(イ)「ポツダム」三國會議ニ於テ對日問題ハ討議セラレサリシモ右ト離レ亞細亞問題ニ付討議行ハレ「カイロ」及「ヤルタ」兩會議ノ決定ノ喰遲ノ調繫ヲ圖リタルモ成功セス「トルーマン」カ次囘華盛頓ニ三國會議ノ再開ヲ從憑セルハ之カ爲ニシテ同會議ニハ對日問題上程ヲ見ルヘシ\n\n(ロ)右ニ所謂喰遲トハ「カイロ」會議ニ於テハ朝鮮ノ獨立ハ約セルモ滿洲及臺灣竝ニ澎湖島ノ囘復ヲ支那ニ約セルニ對シ「ヤルタ」會議ニ於テ英米ハ滿洲及臺灣ニ對シ何等カノ領土的約束ヲ蘇聯ニ與ヘタルモノナリト\n\n二、「カイロ」及「ヤルタ」會議ノ喰遲ニ付テハ是迄モ約一箇月前ヨリ同樣ノ情報アリタルカ\n\n(イ)七月二十七日倫敦發「ロイター」外交特派員ハ對日降服勸告ニ於テ日本ノ領土喪失再確認セラレタルモ喪失後ノ領土ノ處分ニ付果シテ「カイロ」會議ノ決定カ維持サルヘキヤ否ヤノ質問ニ對シ官邊筋ノ囘答ナキ旨報シ\n\n(ロ)又七月二十五日倫敦發「ロイター」軍事通信員□JonKimcheノ通信ハ「トルーマン」カ「スターリン」ニ對シ或種ノ約束ヲ與ヘタル旨報シ居レリ\n\n三、尙桑港會議ニ於テ蘇聯專門委員ハ滿洲及朝鮮ハ獨立國タルヘキ道義的權利アルハ明カナルカ蘇聯ノ一ニ加盟スルヤ否ヤハ當談國ノ決定スヘキ事項ナリト述ヘ又臺灣ニ付テハ其ノ一部ニ付蘇聯ヲ含ム安全理事會ノ統制ノ下ニ於テ基地ヲ設定シ差支ナキ旨述ヘ（往電第一九五號）恰カモ「カイロ」決定ヲ無視セル言動アリ又西班牙及滿洲國ノ國際聯合加入拒否ニ關スル□西哥ノ提議ノ如キモ滿洲國ノ獨立ヲ前提トスルカニ見ユル處其ノ他五月十五日倫敦發「ロイター」ニ依レハ桑港會議ニ於テ蘇聯ハ太平洋戰ニ參加シ居ラサルニ拘ハラス歐洲ニ於ケルト同樣太平洋問題ニ付テモ確タル解決案ヲ有スルコト明瞭トナレル旨報シ居レリ（同電ハ右約束カ蘇聯ノ滿足スル所ト
