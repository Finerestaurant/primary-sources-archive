가세 슌이치 — 주스위스 공사(수신자) 岡本季正 오카모토 스에마사 — 주스웨덴 공사(수신자) トルーマン 트루먼 — 미국 대통령(부기 1 제5관에 언급) 天皇陛下 천황폐하(쇼와 천황) — 「大御心」「御祈念」의 주체로 등장"}, {"id": "d1087", "order": 1087, "date": "1945-08-10", "group": "B", "eyebrow": "문서 1087 · 四 ポツダム宣言の受諾", "title": "소련 측에 포츠담 선언 수락에 관한 신청서를 통보한 건에 대하여", "badge": "合第六五○號（緊急、館長符號扱）", "list_right": "문서 1087", "meta": [{"k": "일자", "v": "1945-08-10", "txt": false}, {"k": "발신", "v": "東鄕外務大臣 도고 시게노리(東鄕茂德) 외무대신", "txt": true}, {"k": "수신", "v": "在スイス加瀨公使、在スウエーデン岡本公使宛 — 주스위스 가세 슌이치(加瀨俊一) 공사, 주스웨덴 오카모토 스에마사(岡本季正) 공사 앞", "txt": true}, {"k": "발착", "v": "本省8月10日發", "txt": false}, {"k": "장소", "v": "本省（외무성 본성, 도쿄）", "txt": false}, {"k": "전보번호", "v": "合第六五○號（緊急、館長符號扱）", "txt": false}, {"k": "종류", "v": "전보 — 회담 요록 통보", "txt": true}], "summary": "1945년 8월 10일, 도고 외상이 같은 날 자신을 내방한 재경 소련 대사와 나눈 회담의 요록을 주스위스·주스웨덴 두 공사에게 참고로 통보한 전보. 회담 내용은 소련의 포츠담 선언 가입 및 대일 전쟁 상태 성명의 낭독, 그에 대한 항의, 그리고 합 제648호 제국 정부 통첩(포츠담 선언 수락 신청서)의 영역문 수교와 본국 전달 요청이다.", "points": ["8월 10일 재경 소련 대사가 도고 외상을 내방하여, 소련의 「포츠담」 선언 가입 및 일본과의 전쟁 상태에 관한 성명을 정부 훈령에 의한 것이라 하여 낭독하였다. 그 성명은 라디오로 방송된 몰로토프의 사토 대사에 대한 성명과 같은 글이다.", "도고 외상은 소련이 평화 회복을 위한 알선에 관한 일본 측 신청에 회답하지 않은 채 돌연 전쟁 상태를 선언한 것은 불가해하다고 항의하였고, 대사는 「소련의 입장은 정부 성명에 명확하다」고만 답하였다.", "이어 도고 외상은 왕전(往電) 합 제648호 제국 정부 통첩의 취지를 설명하고 그 영역문을 수교하였다. 통첩은 이미 스웨덴 정부를 거쳐 소련 정부에 전달하도록 조치가 끝났으나, 대사가 이의가 없다면 이를 본국 정부에 직접 전보해 주기를 희망한다고 신청하였다.", "도고 외상은 「일본에 있어서의 천황의 어(御)지위가 일본 국민과 불가분한 것」이라는 등 일본 황실의 지위에 대하여는 대사도 잘 알고 있는 대로이며, 이 점에 관한 일본 측의 양해는 절대적인 것이므로 연합국 정부가 이에 동의하는 데 곤란이 없으리라 믿는다고 말하였다. 합 제648호의 조건절을 소련 측에 구두로 재확인한 대목이다.", "소련 대사는 자신에게는 신청을 수리할 권한이 없으나, 자신의 개인적 책임에 있어서 또한 본국 정부에 전달함에 아무런 곤란이 없을 것을 조건으로 하여 전달에 동의한다고 답하였다.", "전보는 「以上御參考迄」(이상 참고까지)로 맺어, 스위스·스웨덴 두 채널을 담당하는 공사에게 소련 채널의 진행 상황을 알리는 성격임을 밝힌다."], "primary": "## 〔편자 머리〕\n\n1087 쇼와 20년 8월 〔10〕일 도고 외무대신으로부터 주스위스 가세 공사, 주스웨덴 오카모토 공사 앞 (전보)\n\n**소련 측에 포츠담 선언 수락에 관한 신청서를 통보한 건에 대하여**\n\n---\n\n## 합 제650호 (긴급, 관장 부호 취급)\n\n**본성 8월 10일 발**\n\n一、10일 재경 「소」련 대사가 본 대신을 내방하여, 「소」련의 「포츠담」 선언 가입 및 일본과의 전쟁 상태에 관한 성명(「라디오」로 방송된 「몰로토프」의 사토 대사에 대한 성명과 같은 글)을 정부의 훈령에 의한 것이라는 취지로써 읽어 올렸다. 이에 대하여 본 대신으로부터, 「소」련이 평화 회복을 위한 알선에 관한 아측으로부터의 신청에 회답하는 일 없이 돌연히 전쟁 상태를 선언한 것은 불가해하다는 취지를 서술하였던바, 대사는 「소」련의 입장은 정부 성명에 명확하다 운운이라고 답하였다.\n\n二、이어서 본 대신으로부터 왕전(往電) 합 제648호 제국 정부 통첩의 취지를 서술하고 그 영역문(英譯文)을 수교함과 함께, 본 통첩은 스웨덴 정부를 거쳐 「소」련 정부에 전달하도록 조치가 끝났으나 귀 대사가 이의(異存)가 없다면 이를 본국 정부에 전보하여 주기를 희망한다는 뜻을 신청하고, 또한 일본에 있어서의 천황의 어(御)지위가 일본 국민과 불가분한 것이라는 점 등 일본 황실의 지위에 대하여는 귀 대사가 잘 알고 계신 대로이며 이 점에 관한 아측의 양해는 절대적인 것이므로 따라서 연합국 정부에서는 이에 동의하는 데 곤란이 없으리라고 믿는다는 뜻을 서술하였던바, 대사는 자신은 신청을 수리할 권한이 없으나 자신의 개인적 책임에 있어서 또한 본국 정부에 전달함에 아무런 곤란이 없을 것을 조건으로 하여 위 전달에 동의한다는 뜻을 답하였다.\n\n이상 참고까지.\n\n도고 외무대신으로부터\n", "secondary": "1087昭和20年8月□10□」日岡本公使宛（電報）在スイス加瀨公使、在スウエーデン東鄕外務大臣よりソ連側へポツダダ宣言受諾に関する申入れ通\n\n報について\n\n本省8月10日發\n\n合第六五○號（緊急、館長符號扱）\n\n一、十日在京「ソ」聯大使本大臣ヲ來訪シ「ソ」聯ノ「ポツダム」宣言加入及日本トノ戰爭狀態ニ關スル聲明（「ラチオ」ニテ放送セラレタル「モロトフ」ノ佐藤大使ニ對スル聲明ト同又）ヲ政府ノ訓令ニ依ル趣ヲ以テ讀上ケタリ\n\n右ニ對シ本大臣ヨリ「ソ」聯カ平和囘復ノ爲ノ幹旋ニ關スル我方ヨリノ申入レニ囘答スルコトナク突如トシテ戰爭狀態ヲ宣言セルハ不可解ナル趣ヲ述ヘタル處大使ハ「ソ」聯ノ立場ハ政府聲明ニ明カナリ云々ト答ヘタリ\n\n二、次イテ本大臣ヨリ往電合第六四八號帝國政府通牒ノ趣旨ヲ述ヘ其ノ英譯又ヲ手交スルト共ニ本通牒ハ瑞典政府ヲ經テ「ソ」聯政府ニ傳達方取計ヒ濟ミナルモ貴大使ニ於テ御異存ナクハ之ヲ本國政府ニ電報セラルルコトヲ希望スル旨ヲ申入レ且日本ニ於ケル天皇ノ御地位カ日本國民ト不可分ノモノナルコト等日本皇室ノ地位ニ付キテハ貴大使ニ於テヨク御承知ノ通リニシテ此ノ點ニ關スル我方ノ了解ハ絕對ノモノナリ從テ聯合國政府ニ於テハ之ニ同意セラルルコトニ困難ナキヲ信スル旨述ヘタル處大使ハ自分ハ御申入レヲ受理スル權限ナキモ自分ノ個人的靑任ニ於テ且本國政府ニ傳達上何等ノ困難ナキコトヲ條件トシテ右傳達ニ同意スル旨ヲ答ヘタリ\n\n以上御參考迄\n\n東鄕外務大臣より", "notes": ["편자 머리의 날짜 「8月〔10〕日」 — 지면(s06-29)에서 「10」이 괄호로 묶이고 밑에 물결선이 그어져 있다. 편자가 보충한 날짜라는 표시다. 본문 머리의 「本省 8月10日發」로 10일이 확인된다.", "「館長符號扱」 — 재외공관장 전용 암호로 취급하라는 발신 지정이다. 이 묶음 안에서 이 지정이 붙은 전보는 드물다."], "warn": false, "pages": [1921, 1922], "search": "ソ連側へポツダム宣言受諾に関する申入れ通報について 東鄕茂德 도고 시게노리 — 외무대신(발신자, 본문의 「本大臣」) 加瀨俊一 가세 슌이치 — 주스위스 공사(수신자) 岡本季正 오카모토 스에마사 — 주스웨덴 공사(수신자) 在京「ソ」聯大使 재경 소련 대사 — 회담 상대. 원문은 직명만 적고 이름을 밝히지 않았다(당시 주일 소련 대사는 야코프 말리크) 佐藤尚武 사토 나오타케 — 주소련 대사. 몰로토프 성명의 상대로 언급된다 モロトフ 몰로토프 — 소련 외무인민위원. 라디오 방송 성명의 주체로 언급된다 天皇 천황(쇼와 천황) — 「天皇ノ御地位」의 주체로 등장"}, {"id": "d1088", "order": 1088, "date": "1945-08-10", "group": "B", "eyebrow": "문서 1088 · 四 ポツダム宣言の受諾", "title": "포츠담 선언 수락 신입(申入)에 관한 훈령전의 수정에 대하여", "badge": "合第六五一號（별전 合第六五二號）", "list_right": "문서 1088", "meta": [{"k": "일자", "v": "1945-08-10", "txt": false}, {"k": "발신", "v": "東鄕茂德 도고 시게노리 외무대신", "txt": true}, {"k": "수신", "v": "在スイス加瀨公使、在スウエーデン岡本公使 — 주스위스 가세 슌이치(加瀨俊一) 공사, 주스웨덴 오카모토 스에마사(岡本季正) 공사", "txt": true}, {"k": "발착", "v": "本省8月10日後10時15分發", "txt": false}, {"k": "장소", "v": "本省", "txt": false}, {"k": "전보번호", "v": "合第六五一號（별전 合第六五二號）", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "도고 외상이 가세·오카모토 두 공사에게, 8월 10일자 항복 제의는 합 제649호 영역문을 정문(正文)으로, 합 제648호 일본문을 역문으로 취급하라고 지시하고 아울러 일본문의 정정본(합 제652호)을 보낸 훈령.", "points": ["합 제649호 영역문(英譯文)이 상대국 정부에 대한 정문(正文)이고, 합 제648호 일본문은 역문(譯文)이다. 즉 일본 측 스스로 영문을 원본으로 삼았다.", "별전 합 제652호로 일본문을 정정하여 다시 보냄.", "정정된 역문에도 「천황의 국가통치의 대권을 변경하라는 요구를 포함하고 있지 아니하다는 양해 아래」라는 조건절이 그대로 남아 있다.", "「제국 정부는 위 양해에 잘못이 없음을 믿으며, 본건에 관한 명확한 의향이 신속히 표시되기를 절망(切望)한다」는 연합국 측의 확답을 요구한 대목이다.", "수신처는 재스위스 공사와 재스웨덴 공사 두 곳.", "발신 시각은 8월 10일 후 10시 15분이다. 같은 날 새벽 6시 45분에 나간 합 제647호 훈령의 후속이다."], "primary": "**본성 8월 10일 후 10시 15분 발**\n\n**합 제651호**（긴급, 관장부호）\n\n왕전(往電) 합 제647호에 관하여\n\n귀 임국(任國) 정부에 대한 신입(申入)은 왕전 합 제649호 영역문(英譯文)으로써 이루어진 것으로 사료되는바, 그것은 정문(正文)으로 취급되기 바라며, 또 왕전 합 제648호 일본문은 역문(譯文)으로 취급하고 아울러 별전 합 제652호와 같이 정정하니, 이에 응하여 소요의 조치를 강구하기 바람.\n\n본 전보 수신처 — 재(在)스위스 공사, 재스웨덴 공사\n\n**（별전）**\n\n**본성 8월 10일 후 10시 15분 발**\n\n**합 제652호**（긴급, 관장부호）\n\n（역문）\n\n제국 정부에서는 항상 세계 평화의 촉진을 기구(冀求)하시고, 이번 전쟁의 계속으로 말미암아 초래될 참화로부터 인류를 면하게 하고자 신속한 전투의 종결을 기념(祈念)하시는\n\n천황 폐하의 대어심(大御心)에 따라, 수 주간 전 당시 중립 관계에 있던 「소비에트」 연방 정부에 대하여 적국과의 평화 회복을 위한 알선을 의뢰하였으나, 불행히도 위 제국 정부의 평화 초래에 대한 노력은 결실을 보지 못하였다. 이에 제국 정부는\n\n천황 폐하의 일반적 평화 극복(克服)에 대한 어기념(御祈念)에 기초하여 전쟁의 참화를 될 수 있는 한 신속히 종지(終止)시키고자 하여 다음과 같이 결정하였다.\n\n제국 정부는 1945년 7월 26일 「포츠담」에서 미·영·중 3국 정부 수뇌자에 의하여 발표되고 그 뒤 「소」련 정부의 참가를 본 공동선언에 열거된 조건을, 위 선언이\n\n천황의 국가통치의 대권을 변경하라는 요구를 포함하고 있지 아니하다는 양해 아래 수락한다.\n\n제국 정부는 위 양해에 잘못이 없음을 믿으며, 본건에 관한 명확한 의향이 신속히 표시되기를 절망(切望)한다.", "secondary": "1088昭和20年8月10日岡本公使宛（電報）在スイス加瀨公使、在スウエーデンポツダダ宣言受諾申入れに関する訓令電の修正について\n\n別電昭和二十年八月十日發東鄕外務大臣より在スイス加瀨公使、在スウエーデン岡本公使宛合\n\n第六五二号\n\n右修正和訳文\n\n本省8月10日後10時15分發\n\n合第六五一號（緊急、館長符號）\n\n往電合第六四七號ニ關シ\n\n貴任國政府ニ對スル申入レハ往電合第六四九號英譯又ヲ以テ爲サレタルモノト思料スル處右ハ正又トシテ取扱ハレタク又往電合第六四八號日本又ハ譯又トシテ取扱ヒ且別電合\n\n第六五二號ノ通訂正スルニ付右ニ應シ所要ノ措置ヲ講セラレ度\n\n本電宛先在瑞西公使、在瑞典公使\n\n（別電）\n\n本省8月10日後10時15分發\n\n合第六五二號（緊急、館長符號）\n\n（譯又）\n\n帝國政府ニ於テハ常ニ世界平和ノ促進ヲ輩求シ給ヒ今次戰爭ノ繼續ニ依リ齎ラサルヘキ慘禍ヨリ人類ヲ免カレシメンカ爲速ナル戰鬪ノ終結ヲ祈念シ給フ\n\n天皇陛下ノ大御心ニ從ヒ數週間前當時中立關係ニ在リタル「ソヴイエト」聯邦政府ニ對シ敵國トノ平和恢復ノ爲幹旋ヲ依賴セルカ不幸ニシテ右帝國政府ノ平和招來ニ對スル努力ハ結實ヲ見ス玆ニ於テ帝國政府ハ\n\n天皇陛下ノ一般的平和京服ニ對スル御祈念ニ基キ戰爭ノ慘禍ヲ出來得ル限リ速ニ終止セシメンコトヲ欲シ左ノ通リ決定セリ\n\n帝國政府ハ一九四五年七月二十六日「ポッダム」ニ於テ米、英、支三國政府首膽者ニ依リ發表セラレ爾後「ソ」聯政府ノ參加ヲ見タル共同宣言ニ擧ケラレタル條件ヲ右宣言ハ天皇ノ國家統治ノ大權ヲ變更スルノ要求ヲ包含シ居ラサルコトノ了解ノ下ニ受諾ス\n\n帝國政府ハ右了解ニシテ誤リナキヲ信シ本件ニ關スル明確ナル意向カ速カニ表示セラレンコトヲ切望ス", "notes": ["머리에 편자가 붙인 별전 목록: 「別電 昭和二十年八月十日發 東鄕外務大臣より在スイス加瀨公使、在スウエーデン岡本公使宛 合第六五二号 — 右修正和訳文」(위의 수정 화역문)."], "warn": false, "pages": [1922, 1923], "search": "ポツダム宣言受諾申入れに関する訓令電の修正について 東鄕茂德 도고 시게노리 加瀨俊一 가세 슌이치 岡本季正 오카모토 스에마사"}, {"id": "d1089", "order": 1089, "date": "1945-08-10", "group": "A", "eyebrow": "문서 1089 · 四 ポツダム宣言の受諾", "title": "스웨덴 정부에 포츠담 선언 수락문을 수교한 데 대하여", "badge": "第五一九號", "list_right": "문서 1089", "meta": [{"k": "일자", "v": "1945-08-10", "txt": false}, {"k": "발신", "v": "在スウエーデン岡本公使 — 주스웨덴 오카모토 스에마사(岡本季正) 공사", "txt": true}, {"k": "수신", "v": "東鄕茂德 도고 시게노리 외무대신", "txt": true}, {"k": "발착", "v": "ストックホルム8月10日後0時45分發／本省8月11日前2時30分着", "txt": false}, {"k": "장소", "v": "ストックホルム 스톡홀름", "txt": false}, {"k": "전보번호", "v": "第五一九號", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "오카모토 공사가 영문 정문이 도착하기 전에 일본문(합 제648호)으로 가역을 만들어 8월 10일 오전 11시 45분 스웨덴 외무대신에게 항복 수락문을 수교했다고 보고한 전보.", "points": ["영문 본문(합 제649호)은 아직 도착하지 않았다.", "「본건은 한시도 지의(遲疑)할 경우가 아니」라는 판단으로 공사관이 독자적으로 가역(假譯)을 작성.", "수교 시각은 8월 10일 오전 11시 45분, 상대는 스웨덴 외무대신.", "본 전보는 스톡홀름 8월 10일 후 0시 45분 발, 본성 8월 11일 전 2시 30분 착.", "스위스(베른 가세 공사)에게도 전전(轉電)했다."], "primary": "**스톡홀름 8월 10일 후 0시 45분 발**\n**본성 8월 11일 전 2시 30분 착**\n\n**제519호**（긴급, 관장부호）\n\n귀전(貴電) 합 제647호에 관하여\n\n영문 본문은 아직 접도(接到)하지 아니한 터이나, 본건은 한시도 지의(遲疑)할 경우가 아니므로 우선 당관에서 귀전 합 제648호에 기초하여 가역(假譯)을 작성하여, 본 8월 10일 오전 11시 45분 스웨덴 외무대신에게 수교(手交)하였음. 위세(委細)는 후보(後報).\n\n스위스로 전전(轉電)하였음.", "secondary": "1089昭和20年8月10日東鄕外務大臣宛（電報）在スウエーデン岡本公使よりスウェーデン政府へポツダダ宣言受諾文手交\n\nについて\n\nストックホルム8月10日後0時45分發\n\n本省8月11日前2時30分着\n\n第五一九號（緊急、館長符號）\n\n貴電合第六四七號ニ關シ\n\n英又本又ハ未タ接到セサル處本件ハ一刻モ遲疑スヘキ場合ニアラサルニ付不取敢當館ニ於テ貴電合第六四八號ニ基キ假譯ヲ作成シ本八月十日午前十一時四十五分瑞典外務大臣ニ手交セリ委細後報\n\n瑞西ヘ轉電セリ", "notes": [], "warn": false, "pages": [1923, 1924], "search": "スウェーデン政府へポツダム宣言受諾文手交について 岡本季正 오카모토 스에마사 東鄕茂德 도고 시게노리"}, {"id": "d1090", "order": 1090, "date": "1945-08-10", "group": "A", "eyebrow": "문서 1090 · 四 ポツダム宣言の受諾", "title": "스웨덴 정부가 일본 측 수락문 중의 「천황의 지위」□에 관하여 확인한 데 대하여", "badge": "第五二○號", "list_right": "문서 1090", "meta": [{"k": "일자", "v": "1945-08-10", "txt": false}, {"k": "발신", "v": "在スウエーデン岡本公使 — 주스웨덴 오카모토 스에마사(岡本季正) 공사", "txt": true}, {"k": "수신", "v": "東鄕茂德 도고 시게노리 외무대신", "txt": true}, {"k": "발착", "v": "ストックホルム8月10日後3時20分發／本省8月11日前9時10分着", "txt": false}, {"k": "장소", "v": "ストックホルム 스톡홀름", "txt": false}, {"k": "전보번호", "v": "第五二○號", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "오카모토 공사가 8월 10일 아침 스웨덴 외무대신을 회견한 상황 보고. 외무대신이 「천황의 국가통치의 대권」 조건절이 통치 조직을 뜻하는지 천황 개인의 지위를 뜻하는지 물었고, 공사는 「양자를 아울러 의미한다」고 답했다.", "points": ["스웨덴 외무대신의 질문: 「천황의 국가통치의 대권을 변경하지 아니한다」가 (가) 국가의 통치 조직을 뜻하는가, (나) 천황 폐하의 어일신상(御一身上)의 지위에 변경이 없음을 뜻하는가.", "오카모토 공사의 답변: 훈령 중에 아무 설명이 없으나 「양자를 아울러 의미하는 것으로 생각한다」. 훈령 없이 공사 개인의 해석으로 답한 대목이다.", "공사는 스웨덴에 중립국으로서 호의적 알선을 요청.", "스웨덴 외무대신은 「미력하나마 이러한 어의뢰를 받은 것을 영광」이라며 즉시 알선을 시도하겠다고 답했다.", "회견은 10일 아침, 전보는 후 3시 20분 발이다. 앞서 후 0시 45분에 낸 제519호의 상보(詳報)다.", "조건절의 걸리는 범위가 곧바로 쟁점이 되었음을 보여 준다."], "primary": "**스톡홀름 8월 10일 후 3시 20분 발**\n**본성 8월 11일 전 9시 10분 착**\n\n**제520호**（관장부호, 긴급）\n\n왕전(往電) 제519호에 관하여\n\n10일 아침 스웨덴 외무대신을 회견하여 대지급(大至急)으로 조치하여 줄 것을 의뢰·신입(申入)하였던바, 대신은 가작문(假作文)을 일독한 다음 참고를 위하여 알고자 한다고 전제한 뒤, 「천황의 국가통치의 대권을 변경하지 아니한다」 운운의 점은 국가의 통치 조직을 의미하는 것인지, 또는 천황 폐하의 어일신상(御一身上)의 지위에 변경이 없음을 의미하는 것인지를 물었다. 이에 본사(本使)는 이 점에 관하여는 본사가 받은 훈령 중에 아무런 설명이 없으나 양자를 아울러 의미하는 것으로 생각한다고 답하고, 스웨덴이 중립국으로서 이 기회에 될 수 있는 한 호의적 알선을 하여 주기를 바란다고 말하였다. 그러자 대신은, 스웨덴은 미력하나마 이러한 어의뢰(御依賴)를 받은 것을 영광으로 여기며 즉시 알선을 시도하여 될 수 있는 한 신속히 결과를 보고하겠다고 답하였다.\n\n스위스로 전전(轉電)하였음.", "secondary": "1090昭和20年8月10日東鄕外務大臣宛（電報）在スウエーデン岡本公使よりスウェーデン政府より日本側受諾文中の一天\n\n皇の地位□に関し確認について\n\nストックホルム8月10日後3時20分發\n\n本省8月11日前9時10分着\n\n第五二○號（館長符號、緊急）\n\n往電第五一九號ニ關シ\n\n十日朝瑞典外務大臣ニ會見大至急措置方依賴申入レタル處大臣ハ假作又ヲ一讀ノ上參考ノ爲ニ承知シ度シト前置キシタル上天皇ノ國家統治ノ大權ヲ變更セス云々ノ點ハ國家ノ統治組織ヲ意味スルモノナリヤ又ハ天皇陛下ノ御一身上ノ地位ニ變更ナキヲ意味スルモノナリヤト問ヘルニ付本使ハ此ノ點ニ關シテハ本使ノ受ケタル訓令中ニ何等說明ナキモ兩者ヲ共ニ意味スルモノト考フト答ヘ瑞典カ中立國トシテ此ノ際出來得ル限リ好意的幹旋ヲナサレンコトヲ望ムト述ヘタル處大臣ハ瑞典ハ微力ナルモ斯ル御依賴ヲ受ケタルヲ光榮トシ早速幹旋ヲ試ミ出來得ル限リ速ニ結果ヲ御報告スヘシト答ヘタリ\n\n瑞西ヘ轉電セリ", "notes": ["편자가 붙인 제목 중 「天皇の地位□に関し」의 □는 판독 불명 글자로 원문 그대로 두었다."], "warn": false, "pages": [1924], "search": "スウェーデン政府より日本側受諾文中の一天皇の地位□に関し確認について 岡本季正 오카모토 스에마사 東鄕茂德 도고 시게노리"}, {"id": "d1091", "order": 1091, "date": "1945-08-10", "group": "A", "eyebrow": "문서 1091 · 四 ポツダム宣言の受諾", "title": "스위스 정부에 포츠담 선언 수락문을 수교한 데 대하여", "badge": "第八六八號", "list_right": "문서 1091", "meta": [{"k": "일자", "v": "1945-08-10", "txt": false}, {"k": "발신", "v": "在スイス加瀨公使 — 주스위스 가세 슌이치(加瀨俊一) 공사", "txt": true}, {"k": "수신", "v": "東鄕茂德 도고 시게노리 외무대신", "txt": true}, {"k": "발착", "v": "ベルン8月10日後9時00分發／本省8月11日後2時15分着", "txt": false}, {"k": "장소", "v": "ベルン 베른", "txt": false}, {"k": "전보번호", "v": "第八六八號", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "가세 공사가 8월 10일 오후 6시 스위스 외무차관에게 영역문(합 제649호)을 수교하고 미국·중국 정부에의 전달과 회답 입수의 알선을 의뢰했다고 보고한 전보.", "points": ["수교 시각 8월 10일 오후 6시, 상대는 스위스 외무차관(외무대신은 휴가로 부재).", "수교한 것은 합 제649호 영역문이다. 스톡홀름과 달리 베른은 처음부터 정문(영문)을 건넸다.", "요청 사항은 (가) 가장 신속히 미국 정부 및 중국(지나) 정부에 전달, (나) 회답 입수의 알선.", "본성 착신은 8월 11일 후 2시 15분."], "primary": "**베른 8월 10일 후 9시 00분 발**\n**본성 8월 11일 후 2시 15분 착**\n\n**제868호**（관장부호, 긴급）\n\n귀전(貴電) 합 제647호에 관하여\n\n10일 오후 6시 본사(本使)는 외무차관을 면회하여（대신은 휴가로 부재）, 귀전 합 제649호 영역문(英譯文)을 수교하고, 가장 신속히 미국 정부 및 중국(지나) 정부에 전달하여 줄 것과 아울러 회답 입수의 알선을 신입(申入)하였음.", "secondary": "1091昭和20年8月10日東鄕外務大臣宛（電報）在スイス加瀨公使よりスイス政府へポツダダ宣言受諾文手交について\n\nベルン8月10日後9時00分發本省8月11日後2時15分着\n\n第八六八號（館長符號、緊急）貴電合第六四七號ニ關シ\n\n十日午後六時本使外務次官ニ面會（大臣ハ休暇不在）貴電合\n\n第六四九號英譯又ヲ手交シ最モ速ニ米國政府及支那政府ヘ傳達方竝ニ囘答入手幹旋方申入レタリ", "notes": [], "warn": false, "pages": [1924], "search": "スイス政府へポツダム宣言受諾文手交について 加瀨俊一 가세 슌이치 東鄕茂德 도고 시게노리"}, {"id": "d1092", "order": 1092, "date": "1945-08-11", "group": "A", "eyebrow": "문서 1092 · 四 ポツダム宣言の受諾", "title": "스웨덴 정부에 수락문 정문(正文)을 수교한 데 대하여", "badge": "第五二二號", "list_right": "문서 1092", "meta": [{"k": "일자", "v": "1945-08-11", "txt": false}, {"k": "발신", "v": "在スウエーデン岡本公使 — 주스웨덴 오카모토 스에마사(岡本季正) 공사", "txt": true}, {"k": "수신", "v": "東鄕茂德 도고 시게노리 외무대신", "txt": true}, {"k": "발착", "v": "ストックホルム8月11日前10時20分發／本省8月12日後1時30分着", "txt": false}, {"k": "장소", "v": "ストックホルム 스톡홀름", "txt": false}, {"k": "전보번호", "v": "第五二二號", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "오카모토 공사가 10일 저녁 영역문(합 제649호)을 받아 같은 날 오후 8시 정문으로서 스웨덴 외무성에 다시 수교했고, 스웨덴 측이 8시 반에 영국·소련 공사에게 전달하겠다고 밝혔다는 보고.", "points": ["10일 저녁 무렵 합 제649호(영역문)가 도착.", "같은 날 오후 8시에 이를 정문(正文)으로서 스웨덴 외무성에 수교했다. 오전 11시 45분의 가역 수교를 정본으로 대체한 것이다.", "오후 8시 반, 스웨덴 측이 이를 영국·소련 공사에게 전달하겠다고 통고.", "도쿄의 합 제651호 지시(영문을 정문으로 취급하라)와 부합하는 조치.", "본성 착신은 8월 12일 후 1시 30분."], "primary": "**스톡홀름 8월 11일 전 10시 20분 발**\n**본성 8월 12일 후 1시 30분 착**\n\n**제522호**（긴급）\n\n왕전(往電) 제519호에 관하여\n\n그 뒤 10일 저녁 무렵 귀전 합 제649호가 접도(接到)하였으므로, 곧 같은 날 오후 8시 이를 정문(正文)으로서 본사(本使)로부터 스웨덴 외무성에 수교하였음. 그때 같은 8시 반 스웨덴 측으로부터 이를 영국·소련 공사에게 전달하겠다는 뜻을 말하였음.\n\n스위스로 전전(轉電)하였음.", "secondary": "1092昭和20年8月11日東鄕外務大臣宛（電報）在スウエーデン岡本公使よりスウェーデン政府へ受諾文正文の手交について\n\nストックホルム8月11日前10時20分發\n\n本省8月12日後1時30分着\n\n第五二二號（緊急）\n\n往電第五一九號ニ關シ\n\n其ノ後十日夕刻貴電合第六四九號接到セルヲ以テ直ニ同日午後八時之ヲ正又トシテ本使ヨリ瑞典外務省ニ手交セリ其ノ際同八時半瑞典側ヨリ之ヲ英蘇公使ヘ傳達スル旨ヲ述ヘタリ\n\n瑞西ヘ轉電セリ", "notes": [], "warn": false, "pages": [1924, 1925], "search": "スウェーデン政府へ受諾文正文の手交について 岡本季正 오카모토 스에마사 東鄕茂德 도고 시게노리"}, {"id": "d1093", "order": 1093, "date": "1945-08-11", "group": "A", "eyebrow": "문서 1093 · 四 ポツダム宣言の受諾", "title": "스위스 정부로부터 일본의 포츠담 선언 수락에 대한 「번즈 회답」을 수령한 건", "badge": "第八七五號（緊急） / 別電 第八七六號（緊急）", "list_right": "문서 1093", "meta": [{"k": "일자", "v": "1945-08-11", "txt": false}, {"k": "발신", "v": "在スイス加瀨公使 주스위스 가세 슌이치(加瀨俊一) 공사", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 시게노리(東鄕茂德) 외무대신", "txt": true}, {"k": "발착", "v": "ベルン8月11日後11時26分發 / 本省8月12日後6時10分着 (第八七五號), ベルン8月11日後11時24分發 / 本省8月12日後6時40分着 (別電 第八七六號)", "txt": false}, {"k": "장소", "v": "ベルン 베른", "txt": false}, {"k": "전보번호", "v": "第八七五號（緊急） / 別電 第八七六號（緊急）", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "가세 공사가 8월 11일 밤 스위스 외무차관으로부터 미·영·소·중 4국을 대표한 미국의 회답문(번즈 회답)을 수교받아 그 전문과 함께 본성에 타전한 전보이며, 화역문·라디오 방수문·조약국 계통의 「번즈 회답 해석」·「포츠담 선언 수락에 관한 왕복 문서의 설명」이 부기로 붙어 있다.", "points": ["8월 11일 오후 9시 반 스위스 외무차관이 가세 공사에게 회답문을 수교하고, 미국 정부가 일본 정부의 신속한 회답을 기다리고 있다는 뜻을 전달했다.", "회답문은 워싱턴 시간 11일 오전 8시 40분 국무차관이 대통령의 명에 따라 주미 스위스 공사에게 수교한 것이다.", "본전과 별전은 함께 스웨덴으로 전전(轉電)되었다.", "회답 제1항이다. 항복하는 순간부터 천황 및 일본국 정부의 국가 통치 권한은 연합군 최고사령관의 제한 아래 놓인다.", "회답 제5항이다. 일본국의 최종적 정부 형태는 포츠담 선언에 따라 일본 국민이 자유로이 표명하는 의사에 의해 결정된다.", "부기 3 「번즈 회답 해석」은 제1항의 제한은 점령군 주둔 이상 부득이하며 오히려 당연한 해석이라 보고, 일본 측 조건(국체)에 대한 회답은 제5항에 있다고 읽었다.", "부기 3은 이 회답에 다시 응수하여 포츠담 선언 내용을 변경시키려 시도하는 것은 무의미하며 교섭 자체가 거절될 위험이 있다고 결론지었다.", "부기 4는 천황의 통치권 자체가 최고사령관에게 위양되는 것이 아니며, 최종적 정부 형태에는 국체가 포함된다고 보는 것이 온당하나 국체 변혁의 우려는 절대 없다고 단정했다."], "primary": "**제875호(긴급)**\n\n베른 8월 11일 후 11시 26분 발 / 본성 8월 12일 후 6시 10분 착\n\n11일 오후 9시 반 외무차관으로부터 본사(本使)에게 별전 제876호의 미·영·소·중(支) 4국의 회답문(워싱턴(華府) 시간 11일 오전 8시 40분 국무차관이 대통령의 명에 의하여 주미 스위스 공사에게 수교한 것)을 수교하고, 또한 미국 정부는 이에 대한 일본 정부의 신속한 회답을 기다리고 있다는 뜻을 전달하였음.\n\n본전(本電)은 별전과 함께 스웨덴으로 전전(轉電)하였음.\n\n---\n\n**（별전）**\n\n**제876호(긴급)**\n\n베른 8월 11일 후 11시 24분 발 / 본성 8월 12일 후 6시 40분 착\n\n> Answer of the United States Government to the Japanese Government on behalf of the Government of the United States, the United Kingdom, the Union of Soviet Socialist Republics and China.\n>\n> With regard to the Japanese Government's message accepting the terms of the Potsdam Proclamation but containing the statement — with the understanding that the said declaration does not comprise any demand which prejudices the prerogatives of His Majesty as a sovereign ruler — our position is as follows: From the moment on surrender the authority of the Emperor and the Japanese Government to rule the state shall be subject to the Supreme Commander of the Allied Powers who will take such steps as he deems proper to effectuate the surrender terms.\n>\n> The Emperor will be required to authorize and ensure the signature by the Government of Japan and the Japanese Imperial General Headquarters of the surrender terms necessary to carry out the Provisions of the Potsdam Declaration and shall issue his commands to all the Japanese military naval and air authorities and to all the forces under their control wherever located to cease active operations and to surrender their arms and to issue such other orders as the Supreme Commander may require to give effect to the surrender terms.\n>\n> Immediately upon the surrender the Japanese Government shall transport prisoners of war and civilian internees to places of safety as directed where they can quickly be placed aboard allied transports.\n>\n> The ultimate form of Government of Japan shall in accordance with the Potsdam Declaration be established by the freely expressed will of the Japanese people.\n>\n> The armed forces of the allied powers will remain in Japan until the purposes set forth in the Potsdam Declaration are achieved.\n\n---\n\n**（부기 1）** 쇼와 20년 8월 12일자 「번즈 회답」 화역문(和訳文)\n\n### 합중국·연합왕국·「소비에트」 사회주의 공화국 연방 및 중화민국 각 정부의 이름에 있어서의 합중국 정부의 일본국 정부에 대한 회답\n\n「포츠담」 선언의 조항은 이를 수락하되 우(右) 선언은 천황의 국가 통치의 대권을 변경하는 요구를 포함하고 있지 아니하다는 것의 양해를 아울러 진술한 일본국 정부의 통보에 관하여 오등(吾等)의 입장은 좌(左)와 같음.\n\n항복의 때로부터 천황 및 일본국 정부의 국가 통치의 권한은 항복 조항의 실시를 위하여 그 필요하다고 인정하는 조치를 취하는 연합군 최고사령관의 제한 아래에 놓이는 것으로 함.\n\n천황은 일본국 정부 및 일본 제국 대본영에 대하여 「포츠담」 선언의 여러 조항을 실시하기 위하여 필요한 항복 조항 서명(署名)의 권한을 부여하고 또한 이를 보장할 것을 요청받으며, 또 천황은 일체의 일본국 육·해·공군 관헌 및 어느 지역에 있는지를 불문하고 우(右) 관헌의 지휘 아래에 있는 일체의 군대에 대하여 전투 행위를 종지(終止)하고, 무기를 인도하며 또 항복 조항 실시를 위하여 최고사령관이 요구하는 일이 있을 명령을 발할 것을 명하여야 하는 것으로 함.\n\n일본국 정부는 항복 후 즉시 부로(俘虜) 및 피억류자를 연합국 선박에 신속히 승선시킬 수 있는 안전한 지역으로 이송하여야 하는 것으로 함.\n\n최종적인 일본국의 정부의 형태는 「포츠담」 선언에 좇아 일본국 국민이 자유로이 표명하는 의사에 의하여 결정되어야 하는 것으로 함.\n\n연합국 군대는 「포츠담」 선언에 게재된 여러 목적이 완수될 때까지 일본국 내에 머물러야 함.\n\n---\n\n**（부기 2）**\n\n〔編注〕\n\n> SECRETARY OF STATE JAMES BYRNES' LETTER TO SWISS REPRESENTATIVE\n>\n> \"Sir, I have the honor to acknowledge receipt of your note of August 10th, and in reply, to inform you that the President of the United States has directed me to send to you for transmission by your government to the Japanese Government the following message on behalf of the Governments of the United States, the United Kingdom, the Union of Soviet Socialist Republics and China.\n>\n> \"With reply to the Japanese Government's message accepting the terms of the Potsdam Proclamation but containing the statement with the understanding that said declaration does not comprise any demand which prejudices the prerogatives of His Majesty as the sovereign ruler, our position is as follows:\n>\n> \"From the moment of surrender, the authority of the Emperor and the Japanese Government to rule the state shall be subject to the Supreme Commander of the Allied Powers, who will take such steps as he deems proper to effectuate the surrender terms.\n>\n> \"The Emperor will be required to authorize and ensure the signature by the Government of Japan and the Japanese Imperial General Headquarters of the surrender terms necessary to carry out the provisions of the Potsdam Declaration and shall issue his command to all the Japanese military, naval and air authorities and to all of the forces under their control wherever located to cease active operations, and to surrender their arms and to issue such other orders as the Supreme Commander may require to give effect to the surrender terms.\n>\n> \"Immediately upon the surrender, the Japanese Government shall transport prisoners of war and civilian internees to places of safety as directed where they can quickly be placed aboard Allied transports.\n>\n> \"The ultimate form of the Government of Japan shall, in accordance with the Potsdam Declaration, be established by the freely expressed will of the Japanese people.\n>\n> \"The armed forces of the Allied powers will remain in Japan until the purposes set forth in the Potsdam Declaration are achieved.\n>\n> \"Accept, Sir, the renewed assurances of my highest consideration.\"\n>\n> (Signed) James F. Byrnes, Secretary of State.\n\n編注 — 본 회답문은 쇼와 20년 8월 12일 오전 0시 45분 외무성 라디오실이 샌프란시스코 군 방송에 의하여 방수(傍受)한 회답문 및 같은 날 같은 시각경 워싱턴·라디오 방송에 의하여 동맹통신사가 청취한 회답문을, 외무성이 대조·정리한 뒤 같은 날 각의(閣議)에 참고로 제출한 것이다.\n\n---\n\n**（부기 3）** 번즈 회답 해석（八—一三—五）\n\n一、이번 회답 중 제1항 내지 제6항은 포츠담 선언의 의의를 되풀이하여 서술한 것에 지나지 않음.\n\n특히 제1항은 점령군으로서 제국 내에 주둔하는 이상 주권의 행사가 점령군에 의하여 제한받게 되는 것은 부득이한 바이며, 오히려 당연한 해석이라 하여야 함. 따라서 가령 적측(敵側)이 이 점에 관하여 아무런 언급하는 바 없이 육해군의 무장 해제 등을 행한 뒤 당연한 권리로서 실제상 이 점을 주장한다 하더라도 아측(我方)으로서는 어찌할 수도 없었을 바임. 이를 본항에서 명확히 한 것은 오히려 적측이 우직(馬鹿正直)하였다고도 할 수 있으며, 또는 적측이 진지하게 이 점에 관하여 사전에 아측을 양해시키려 시도한 점에 있어서 도리어 성의 있는 태도라고도 인정할 수 있음.\n\n二、전 항목을 통틀어 적측이 항상 천황 폐하 및 일본 정부와 대본영을 통하여 각종 명령을 내리게 하려 하고 있음은, 적어도 점령군 주둔 중에는 우(右) 세 주체를 그대로 승인하려 하고 있는 것으로서, 이 점은 독일에 대한 전례에 비하여 자못 아측에 유리함（또한 점령군 철퇴 후의 상태는 다음 항과 같음）.\n\n三、아측의 조건에 대한 해석은 제5항에 있다고 볼 수 있음. 다만 우(右) 제5항의 점도 포츠담 선언 중에 포함되어 있으나, 이번에는 아측의 조건에 대하여 직접 이를 인용하여 회답으로 삼은 것이라 보임. 원래 국체(國体)의 여하에 관하여 외국으로부터의 보장을 구하려 하는 것과 같음은 본말전도(本末顛倒)이며, 우(右)는 당연히 국내에서 결정하여야 할 것으로서, 따라서 적측으로서는 본 문제에 대하여는 내정 간섭의 의도가 없고 국민의 자유 의사에 맡겨야 한다고 말함은 당연하며, 이 이상의 것을 기대함은 무리임. 또한 우(右) 용어에 있어서 「일본 국민의 자유로이 표명さ（せカ）られたる 의사에 의한」이라 함은 적측의 민주 정치적 입장에서 하면 당연한 말이라 할 수밖에 없음. 그러한 까닭에 그 전문(前文) 중에서 「오인(吾人)의 입장은 다음과 같다」고 말한 것이며, 아측에 있어서는 이를 또한 아국의 국체에 부합하도록 해석할 수 있는 것이라 믿음. 따라서 용어의 여하에 구애될 것 없이, 문제는 국체에 대하여는 적측에 있어서 내정 간섭의 의도가 없다는 것을 양승(諒承)하면 족하며, 적측의 정치 관념을 아측의 그것과 일치시키려 하는 것이 무리임은 부전조약(不戰條約) 당시의 사례를 고려하면 명료할 것임.\n\n四、이를 요컨대 이번 회답은 포츠담 선언을 되풀이한 것으로서 이를 일탈한 바가 없으며, 따라서 아측에서 동 선언을 수락한다고 말한 이상 이번 회답을 양승하지 않는 것은 모순임. 적측의 태도가 우(右)와 같은 이상, 본 회답에 대하여 다시 응수를 행하여 포츠담 선언의 내용을 변경시키려 시도하는 것과 같음은, 적측으로 하여금 아측에 성의가 없다는 것을 느끼게 할 뿐으로 아무런 실효를 거둘 수 없을 뿐 아니라, 아마도 적측에 있어서 이를 가지고 아측이 전언(前言)을 번복하여 포츠담 선언을 거부하였다고 삼아 이 이상의 교섭에 들어가는 것을 단적으로 거절할 것으로 예기하지 않을 수 없음.\n\n---\n\n**（부기 4）** 「포츠담」 선언 수락에 관한 왕복 문서의 설명（昭二〇、八、二七）\n\n一、제국 정부는 「포츠담」 선언 수락에 앞서, 동 선언에 열거된 조건에는 천황의 국가 통치의 대권을 변경하는 요구를 포함하고 있지 아니한 것으로 양해한다는 것 및 이에 대한 연합국 측의 의향 표시를 요망한다는 뜻의 연합국 앞 문서를 발하였음.\n\n二、이에 대하여 연합국을 대표하여 미국 국무장관으로부터 회답이 있었는바, 우(右) 회답 중 중요한 좌(左)의 두 점에 관하여 약간의 설명을 하고자 함.\n\n1、「천황 및 일본국 정부의 국가 통치의 권한은 항복 조항의 실시를 위하여 적당하다고 인정하는 조치를 취하여야 할 연합국 최고사령관의 제한 아래에 놓이는 것으로 함」\n\n우(右)는 「포츠담」 선언의 조항을 실시하기 위하여 필요하다고 인정되는 범위 내에 있어서 연합국 최고사령관이 취하여야 할 조치에 의하여 천황 및 일본국 정부의 통치권의 행사가 제한을 받는다는 뜻을 밝힌 것으로서, 천황의 통치권 그 자체가 연합국 최고사령관에게 위양(委讓)되거나 또는 동 사령관이 천황 또는 일본국 정부를 대신하여 통치권을 행사하는 것이 아님.\n\n2、「최종적인 일본국의 정부의 형태는 「포츠담」 선언에 따라 일본국 국민이 자유로이 표명하는 의사에 의하여 결정되어야 하는 것으로 함」\n\n일본국의 최종적 정부의 형태의 결정은 일본국 국민의 자유 의사에 맡기고 외부의 압박 또는 간섭에 의하여 결정하게 하려는 뜻이 없음을 보임과 동시에, 일본국 내에 있어서도 군 기타의 권력에 의하여 압박받지 않는 자유로운 민의(民意)에 의하여 결정되어야 하는 것이라는 주지(主旨)를 표명한 것임. 또 우(右) 최종적 정부의 형태라 함은, 국체(國体)와 정체(政体)의 구별이 없는 연합국 측으로서는 국체까지도 포함시키고 있는 것으로 해석함이 온당하나, 전기(前記)와 같이 일본국 국민의 자유 의지에 의하여 결정되는 것이므로 일본인의 충성심에 비추어 보더라도 사실 문제로서 국체의 변혁을 초래할 것과 같은 우려는 절대로 없다고 믿음.\n", "secondary": "1093昭和20年8月11日東鄕外務大臣宛（電報）在スイス加瀨公使よりスイス政府より日本のポツダダ宣言受諾に対する一バーンズ回答□の受領について\n\n別電昭和二十年八月十一日發在スイス加瀨公使より東鄕外務大臣宛第八七六号\n\n右回答文\n\n付記の昭和二十年八月十二日付\n\n「バーンズ回答」和訳文\n\n二昭和二十年八月十二日\n\nラジオにより傍受した「バーンズ回答」三昭和二十年八月十三日付、作成局課不明「バーンズ囘答解釋」\n\n四昭和二十年八月二十七日付、作成局課不明「「ポツダム」宣言受諾ニ關スル往復又書ノ說明」\n\nベルン8月11日後11時26分發\n\n本省8月12日後6時10分着\n\n第八七五號（緊急）\n\n十一日午後九時半外務次官ヨリ本使ニ對シ別電第八七六號ノ米、英、蘇、支四國ノ囘答又（華府時間十一日午前八時四十分國務次官カ大統領ノ命ニ依リ在米瑞西公使ニ手交セルモノ）ヲ手交シ且米國政府ハ右ニ對スル日本政府ノ速カナル囘答ヲ待チ居ル旨傳達セリ\n\n本電別電ト共ニ瑞典ニ轉電セリ\n\n（別電）\n\nベルン8月11日後11時24分發\n\n本省8月12日後6時40分着\n\n第八七六號（緊急）\n\nAnswer of the United States Government to the Japanese Government on behalf of the Government of the United States, the United Kingdom, the Union of Soviet Socialist Republics and China.\n\nWithムregardムtoムtheムJapaneseムGovernmentムsムmessageacceptingthetermsofthePotsdamProclamationbutcontainingthestatement｜ムwiththeunderstandingthatthesaiddeclarationdoesムnotムcompriseムanyムdemandムwhichムprejudicesムtheprerogativesofHisMajestyasasovereignruler｜ムour position is as follows: From the moment on surrender the authority of the Emperor and the Japanese Government to rule the state shall be subject to the Supreme Commander of the Allied Powers who will take such steps as he deems proper to effectuate the surrender terms.\n\nThe Emperor will be required to authorize and ensure the signature by the Government of Japan and the Japanese Imperial General Headquarters of the surrender terms necessary to carry out the provisions of the Potsdam Declaration and shall issue his command to all the Japanese military, naval and air authorities and to all of the forces under their control wherever located to cease active operations, and to surrender their arms and to issue such other orders as the Supreme Commander may require to give effect to the surrender terms. Immediately upon the surrender the Japanese Government shall transport prisoners of war and civilian internees to places of safety as directed where they can quickly be placed aboard allied transports.\n\nTheultimateformムofGovernmentofJapanムshallinaccordancewiththePotsdamDeclarationbeestablishedbythefreelyeOpressedwilloftheJapanesepeople.ThearmedforcesofthealliedpowerswillremaininJapanuntilthepurposessetforthinthePotsdamムDeclarationareachieved.\n\n（付記の）\n\n合衆國、聯合干國、「ソヴイエト」社會主義共和國聯邦及中華民國ノ各政府ノ名ニ於ケル合衆國政府ノ日本國政府ニ對スル囘答\n\n「ポツダム」宣言ノ條項ハ之ヲ受諾スルモ右宣言ハ天皇ノ國家統治ノ大權ヲ變更スルノ要求ヲ包含シ居ラサルコトノ了解ヲ倂セ述ヘタル日本國政府ノ通報ニ關シ吾等ノ立場ハ左ノ通ナリ\n\n降伏ノ時ヨリ天皇及日本國政府ノ國家統治ノ權限ハ降伏條項ノ實施ノ爲其ノ必要ト認ムル措置ヲ執ル聯合軍最高司令官ノ制限ノ下ニ置カルルモノトス\n\n天皇ハ日本國政府及日本帝國大本營ニ對シ「ポツダム」宣言ノ諸條項ヲ實施スル爲必要ナル降伏條項者名ノ權限ヲ與ヘ且之ヲ保障スルコトヲ要請セラレ又天皇ハ一切ノ日本國陸、海、空軍官憲及何レノ地域ニ在ルヲ問ハス\n\n右官憲ノ指揮下ニ在ル一切ノ軍隊ニ對シ戰鬪行爲ヲ終止シ、武器ヲ引渡シ及降伏條項實施ノ爲最高司令官ノ要求スルコトアルヘキ命令ヲ發スルコトヲ命スヘキモノトス日本國政府ハ降伏後直ニ俘虜及被抗留者ヲ聯合國船舶ニ速カニ乘船セシメ得ヘキ安全ナル地域ニ移送スヘキモノトス\n\n最終的ノ日本國ノ政府ノ形態ハ「ポツダム」宣言ニ遵ヒ日本國國民ノ自由ニ表明スル意思ニ依リ決定セラルヘキモノトス\n\n聯合國軍隊ハ「ポツダム」宣言ニ揭ケラレタル諸目的カ完遂セラルル迄日本國内ニ留マルヘシ\n\n（付記二）\n\n（編注）\n\nSECRETAR□○FSTATEJAMESB□RNESムLETTERT○SWISSREPRESENTATIVE“ Sir, I have the honor to acknowledge receipt of your note of August 10th, and in reply, to inform you that the President of the United States has directed me to send to you for transmission by your government to the Japanese Government the following message on behalf of the Governments of the United States, the United Kingdom, the Union of Soviet Socialist Republics and China.\n\n“WithkreplyktokthekJapanesekGovernmentムWith reply to the Japanese Government's message accepting the terms of the Potsdam Proclamation but containing the statement with the understanding that said declaration does not comprise any demand which prejudices the prerogatives of His Majesty as the sovereign ruler, our position is as follows:“ From the moment of surrender, the authority of the Emperor and the Japanese Government to rule the state shall be subject to the Supreme Commander of the Allied Powers, who will take such steps as he deems proper to effectuate the surrender terms.\n\n“The Emperor will be required to authorize and ensure the signature by the Government of Japan and the Japanese Imperial General Headquarters of the surrender terms necessary to carry out the provisions of the Potsdam Declaration and shall issue his command to all the Japanese military, naval and air authorities and to all of the forces under their control wherever located to cease active operations, and to surrender their arms and to issue such other orders as the Supreme Commander may require to give effect to the surrender terms.“ Immediately upon the surrender the Japanese Government shall transport prisoners of war and civilian internees to places of safety as directed where they can quickly be placed aboard allied transports.“ The ultimate form of the Government of Japan shall, in accordance with the Potsdam Declaration, be established by the freely expressed will of the Japanese people.“ The armed forces of the allied powers will remain in Japan until the purposes set forth in the Potsdam Declaration are achieved.\n\n“Accept, Sir, the renewed assurances of my highest consideration.\" .”\n\n(Signed)JamesF.Byrnes,\n\nSecretaryofState.\n\n編注本回答文は昭和二十年八月十二日午前○時四十五分、外務省ラジオ室がサンフランシスコ軍放送により傍受した回答文及び同日同時刻頃、ワシントン・ラジオ放送により同盟通信□が聽取した回答文を外務省が昭合繫理、上、同日、閣議に參考提出したあ、である。（付記三）\n\nバーンズ囘答解釋（八｜一三｜五）\n\n一、今囘、囘答中第一項ない至第六項はポツダム宣言、意義を繰返えし述ベたるあ、に過ぎず\n\n特に第一項は占領軍にして帝國内に駐市一る以上主權、行使が占領軍により制限せらる可きは已むを得ざる所にして學ろ當然、解釋と言うベし從て假に敵側が此、點に付き何等言及一る所無く陸海軍、武裝解除等を爲したる後當然、權利として實際上此、點を主張一るとあ我方としては如何とあ爲し能わざりし所なるベし是を本項において明確にしたることは學ろ敵側が馬鹿正直なりしとあいい得ベく又あるいは敵側が眞面目に此、點に付き事前に我方をりよう解せしめんと試みたる點において却って誠意ある態度とあ認め得ベし\n\n二、全項を通じ敵側は常に天皇陛下竝びに日本政府及び大本營を通じ各種、命令を下させしめんとしおるは少くとあ占領軍駐市中右三者をそ、まま承認せんとしおるあ、にして此、點獨逸に對一る前例に比ベ一こぶる我方に有利なり（なお占領軍撤退後、狀態は次項、通りなり）\n\n三、我方、條件に對一る解釋は第五項にありと見得ベしあっとあ右第五項、點あポツダム宣言中に含まれおるあ今囘は我方、條件に對し直接これを引用して囘答と爲したるあ、と看らる元來國体、如何に關し外國より、保障を求めんと一るが如きは本未顯倒にして右は當然國内において決定一ベきあ、と一從て敵側としては本問題にっいては内政干涉、意圖無く國民、自由意思に委一ベしと言ふは當然にしてこれ以上、ことを期待一るは無理なりなお（せカ）\n\n右用語において「日本國民、自由に表明さられたる意思による」とあるは敵側、民主政治的立場より一れば當然、言葉という、外無しかかるが故にそ、前又中においてあ「吾人、立場は次、如し」と言える次第にして我方においてはこれを又我國体に副うが如く解釋し得るあ、と信ず從って用語、如何に拘泥一ること無く問題は國体にっいては敵側において内政干涉、意圖無きことをりよう承一れば足り敵側、政治觀念を我方、夫と一致せしめんと一ること、無理なるは不戰條約當時、事例を考慮一れば明りようなるベし\n\n四、これを要一るに今囘、囘答はポツダム宣言を繰返えしたるあ、にしてこれを逸脫したる所なく從って我方において同宣言を受諾一と言える以上今囘、囘答をりよう承せざることは矛盾なり敵側、態度右、如くなる以上本囘答に對し更に應酬を行いポツダム宣言、内容を變更せしめんと試むるが如きは敵側をして我方に誠意なきことを感ぜしむる、みにして何等實效を擧げ得ざる、みならず恐らくは敵側において右をあって我方が前言を翻えしポツダム宣言を拒否したりと爲し此、上、交涉に入ることを端的に拒絕一るあ、と予期せざる可らず\n\n（付記四）\n\n「ポツダム」宣言受諾ニ關スル往復又書ノ說明\n\n（昭二○、八、二七）\n\n一、帝國政府ハ「ポツダム」宣言受諾ニ先立チ同宣言ニ擧ゲラレタル條件ニハ天皇ノ國家統治ノ大權ヲ變更スルノ要求ヲ包含シ居ラザルモノト了解スルコト及右ニ對スル聯合國側ノ意向表示ヲ要望スル旨ノ聯合國宛又書ヲ發セリ\n\n二、之ニ對シ聯合國ヲ代表シ米國國務長官ヨリ囘答アリタルガ右囘答中重要ナル左ノ二點ニ付若干說明ヲナサントス\n\n1、「天皇及日本國政府ノ國家統治ノ權限ハ降伏條項ノ實施ノ爲適當ト認ムル措置ヲ執ルベキ聯合國最高司令官ノ制限ノ下ニ置カルルモノトス」\n\n右ハ「ポツダム」宣言ノ條項ヲ實施スル爲必要ト認メラルル節圍内ニ於テ聯合國最高司令官ノ執ルベキ措置ニ依リ天皇及日本國政府ノ統治權ノ行使ガ制限ヲ受クル旨ヲ明カニセルモノニシテ天皇ノ統治權ソノモノガ聯合國最高司令官ニ委讓セラレ又ハ同司令官ガ天皇又ハ日本國政府ニ代リ統治權ヲ行使スルモノニ非ズ\n\n2、「最終的ノ日本國ノ政府ノ形態ハ「ポツダム」宣言ニ從ヒ日本國々民ノ自由ニ表明スル意思ニ依リ決定セラルベキモノトス」日本國ノ最終的政府ノ形態ノ決定ハ日本國々民ノ自由意思ニ委ネ外部ノ壓迫又ハ干涉ニ依リ決定セシムルノ意ナキヲ示スト共ニ日本國内ニ於テモ軍其他ノ權力ニ依リ壓迫セラレザル自由ナル民意ニ依リ決定スベキモノナリトノ主旨ヲ表明セルモノナリ又右最終的政府ノ形態トハ國体政体ノ區別ナキ聯合國側トシテ國体ヲモ含マシメ居ルモノト解スルヲ穩當トスルモ前記ノ如ク日本國々民ノ自由意志ニ依リ決定セラルルモノナレバ日本人ノ忠誠心ニモ鑑ミ事實問題トシテ國体ノ變革ヲ來スガ如キ虞ハ絕對ニナシト信ズ", "notes": ["〔編注〕(부기 2) — 본 회답문은 쇼와 20년 8월 12일 오전 0시 45분 외무성 라디오실이 샌프란시스코 군 방송으로 방수한 회답문과, 같은 날 같은 시각경 워싱턴 라디오 방송으로 동맹통신사가 청취한 회답문을 외무성이 대조·정리한 뒤 같은 날 각의에 참고로 제출한 것이다.", "부기 3의 표제 아래 붙은 「（八—一三—五）」는 편자 표기 그대로 두었다. 8월 13일자 작성이라는 뜻으로 보이나 확정할 수 없다.", "부기 3 제3항 본문 중 「표명さられたる」에는 지면에 「（せカ）」 방주가 달려 있다(「せ」의 오식으로 보인다는 편자 표시). 그대로 옮겼다.", "부기 1~4의 표제는 지면의 「付記一」「付記二」「付記三」「付記四」이며, 문서 머리의 목록도 「一 …和訳文 / 二 …ラジオにより傍受した「バーンズ回答」/ 三 …「バーンズ囘答解釋」/ 四 …「「ポツダム」宣言受諾ニ關スル往復文書ノ說明」」의 네 항목이다."], "warn": false, "pages": [1925, 1926, 1927, 1928, 1929, 1930, 1931], "search": "スイス政府より日本のポツダム宣言受諾に対する「バーンズ回答」の受領について 加瀨俊一 가세 슌이치 — 주스위스 공사 東鄕茂德 도고 시게노리 — 외무대신 James F. Byrnes 제임스 F. 번즈 — 미국 국무장관"}, {"id": "d1094", "order": 1094, "date": "1945-08-12", "group": "A", "eyebrow": "문서 1094 · 四 ポツダム宣言の受諾", "title": "영국 측에서 스웨덴 정부에 「번스 회답」을 참고로 송부한 데 대하여", "badge": "第五二四號", "list_right": "문서 1094", "meta": [{"k": "일자", "v": "1945-08-12", "txt": false}, {"k": "발신", "v": "在スウエーデン岡本公使 — 주스웨덴 오카모토 스에마사(岡本季正) 공사", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 시게노리(東鄕茂德) 외무대신", "txt": true}, {"k": "발착", "v": "ストックホルム8月12日後1時00分發／本省8月13日前0時35分着", "txt": false}, {"k": "장소", "v": "ストックホルム 스톡홀름", "txt": false}, {"k": "전보번호", "v": "第五二四號", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "스톡홀름 주재 영국 대사관이 11일 워싱턴에서 스위스 공사에게 수교된 4국의 대일 회답문을 참고로 스웨덴 정부에 보내 왔고, 그 내용이 스위스 발 제876호와 전연 동일하다는 오카모토 공사의 보고.", "points": ["8월 12일 정오, 스웨덴 외무성 정무국장이 오카모토 공사에게 통보한 내용.", "스톡홀름 주재 영국 대사관이 스웨덴 정부에 4국의 대일 회답문을 「참고를 위하여」 송부.", "그 회답문은 8월 11일 워싱턴에서 스위스 공사에게 수교된 것이다. 이른바 「번스 회답」이다.", "내용은 스위스(베른) 발 제876호로 이미 도쿄에 들어온 본문과 전연 동일함을 확인.", "곧 스위스 경로와 스웨덴 경로 두 갈래로 같은 회답문이 일본에 닿았다는 대조 보고다.", "발신 8월 12일 후 1시 00분, 본성 착신 8월 13일 전 0시 35분."], "primary": "**스톡홀름 8월 12일 후 1시 00분 발**\n**본성 8월 13일 전 0시 35분 착**\n\n**第五二四號（긴급）**\n\n스위스 발 귀 대신 앞 전보 제875호에 관하여\n\n12일 정오 [스웨덴] 외무성 정무국장으로부터 본사(本使)에 대하여, 당지(當地) 영국 대사관으로부터 스웨덴 정부에 대하여 11일 화부(華府, 워싱턴)에서 스위스 공사에게 수교(手交)된 4국의 대일(對日) 회답문(囘答文)을 참고를 위하여 송부해 왔다는 뜻의 통보가 있었음. 그 내용은 스위스 발 귀 대신 앞 전보 제876호와 전연(全然) 동일함.", "secondary": "10949昭和20年8月12日東鄕外務大臣宛（電報）在スウエーデン岡本公使より英国側よりスウェーデン政府に対し一バーン\n\nズ回答□參考送付について\n\nストックホルム8月12日後1時00分發\n\n本省8月13日前0時35分着\n\n第五二四號（緊急）\n\n瑞西發貴大臣宛電報第八七五號ニ關シ\n\n十二日正午外務省政務局長ヨリ本使ニ對シ當地英國大使館ヨリ瑞典政府ニ對シ十一日華府ニ於テ瑞西公使ニ手交セラレタル四國ノ對日囘答又ヲ參考ノ爲送付シ越セル旨通報アリタリ其ノ内容ハ瑞西發貴大臣宛電報第八七六號ト全然同一ナリ", "notes": [], "warn": false, "pages": [1931], "search": "英国側よりスウェーデン政府に対し「バーンズ回答」参考送付について 岡本季正 오카모토 스에마사 — 주스웨덴 공사 東鄕茂德 도고 시게노리 — 외무대신"}, {"id": "d1095", "order": 1095, "date": "1945-08-12", "group": "A", "eyebrow": "문서 1095 · 四 ポツダム宣言の受諾", "title": "「번스 회답」에 관한 스웨덴 각 신문 등의 보도 양상에 대하여", "badge": "第五二五號", "list_right": "문서 1095", "meta": [{"k": "일자", "v": "1945-08-12", "txt": false}, {"k": "발신", "v": "在スウエーデン岡本公使 — 주스웨덴 오카모토 스에마사(岡本季正) 공사", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 시게노리(東鄕茂德) 외무대신", "txt": true}, {"k": "발착", "v": "ストックホルム8月12日後1時50分發／本省8月13日前2時10分着", "txt": false}, {"k": "장소", "v": "ストックホルム 스톡홀름", "txt": false}, {"k": "전보번호", "v": "第五二五號", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "오카모토 공사가 스톡홀름 각 신문의 런던·워싱턴 특전을 근거로, 4국 회답문이 만들어지기까지 36시간의 절충 경위(미·영 내부의 찬반 양론, 소련의 무조건항복 주장, 결국 미국 안이 대세를 제압한 사정)와 영국 각 신문의 논조, 그리고 BBC 등이 「アクセプト(accept)」라는 말을 쓰고 있는 점을 보고한 전보.", "points": ["일본의 유보(留保) 승인 여부를 놓고 미·영 모두 정부 부내에 찬반 양론이 있었다는 보도.", "최초의 미국 측 「테키스트(text)」에는 천황의 지위를 연합국의 지도 아래 인정한다는 자구가 있었다.", "영국 측이 기초한 안은 천황의 지위를 인정하면서도 only until further notice라는 제한을 붙였다.", "소련이 가장 강경하게 문자 그대로의 무조건항복을 주장하여 4국 사이에 36시간에 걸쳐 절충이 이어졌다.", "결국 「천황의 지위를 인정하지 않으면 일본 군대를 유효하게 통어할 자가 없어 연합국이 그 뒤처리에 더 희생을 요구받게 된다」는 미국 측 의견이 대세를 제압하여 회답문이 결정되었다는 것이다. 회답문은 타협의 산물이나 미국 측의 외교적 승리라는 평이다.", "영국 내에서 좌익 각 신문과 밴시타트는 일본의 유보에 반대, 「데일리 익스프레스」는 천황이 계속 재위해야 한다는 호의적 논설.", "「타임스」는 천황 대권에 대한 종래와 같은 신비적 해석을 존속시키는 것은 장래 침략 사상 재생의 화근이 된다며 반대하고, 인민주권설에 근거한 서구식 입헌군주제를 일본에 수락시킬 필요를 역설.", "BBC 등 적 측 방송이 「연합국은 일본의 신출(申出)을 조건부로 수락한 것」이라 하며 「アクセプト(accept)」라는 말을 쓰고 있는 점에 주의를 요한다고 못박은 대목이다. 「수락」인지 「항복 요구」인지의 어법이 곧 쟁점이었다."], "primary": "**스톡홀름 8월 12일 후 1시 50분 발**\n**본성 8월 13일 전 2시 10분 착**\n\n**第五二五號（긴급）**\n\n12일 당지(當地) 신문은 런던 및 화부(華府, 워싱턴) 특전(特電)으로서, 미국이 4국 정부를 대표하여 대일(對日) 회답을 한 경위에 관하여 대략 다음과 같이 보도하고 있음.\n\n一、일본의 유보(留保) 승인의 가부에 관하여 미·영 모두 정부 부내에 찬부(贊否) 양론이 있었고, 최초의 미국 측 「테키스트」에는 천황의 지위를 연합국의 지도 아래 인정한다는 뜻의 자구(字句)가 있었으며, 또 영국 측에서 기초한 것에는 천황의 지위를 인정하면서도 only until further notice라는 제한을 붙였음. 소련은 가장 강경하게 문자 그대로의 무조건항복을 주장하였고, 이 때문에 36시간에 걸쳐 4국 사이에 극력 절충한 결과, 결국 천황의 지위를 인정하지 않으면 일본 군대를 유효하게 통어(統御)할 자가 없어 연합국은 그 뒤처리[始末]에 오히려 희생을 요구받게 되리라는 미국 측 의견이 대세를 제압하여 회답문(囘答文)의 결정을 보게 된 것으로서, 회답문은 타협의 결과이기는 하나 미국 측의 외교적 승리라고 평하고 있음.\n\n二、영국 내에서는 좌익 각 신문이 일본의 유보에 반대를 표명하였고 「밴시타트」도 반대 의견을 말하였으나, 「데일리 익스프레스」는 천황은 계속하여 재위(在位)하셔야 한다는 호의적 논설을 실었고, 또 「타임스」는 천황 대권(大權)에 대한 종래와 같은 신비적 해석을 존속시키는 것은 장래 침략 사상 재생의 화근이 되리라 하여 자주[頻ニ] 반대하고, 일본으로 하여금 인민주권설에 근거한 서구류(西歐流)의 입헌군주제를 수락케 할 필요를 역설하고 있음.\n\n三、또한 어제 이래의 BBC 그 밖의 적 측 방송은 연합국은 일본의 신출(申出)을 조건부로 수락한 것이라고 말하며 「악셉트(アクセプト)」라는 말을 쓰고 있는 것은 주의를 요함.", "secondary": "1095昭和20年8月12日東鄕外務大臣宛（電報）在スウエーデン岡本公使より一バーンズ回答□に関するスウェーデン各紙\n\n等の報道振りについて\n\nストックホルム8月12日後1時50分發\n\n本省8月13日前2時10分着\n\n第五二五號（緊急）\n\n十二日當地新聞ハ倫敦及華府特電トシテ米國カ四國政府ヲ代表シテ對日囘答ヲ爲セル經緯ニ付大略左ノ如ク報道シ居レリ\n\n一、日本ノ留保承認ノ可否ニ付米英共ニ政府部内ニ於テ贊否兩論アリ最初ノ米側「テキスト」ハ天皇ノ地位ヲ聯合國ノ指導下ニ認ムル旨ノ字句アリ又英側ニ於テ起草セルモノニハ天皇ノ地位ヲ認メツツモ□onlyuntilfurthernoticeナル制限ヲ附セリ蘇聯ハ最モ强硬ニ又字通リ無條件降伏ヲ主張シ之カ爲三六時間ニ亘リ四國間ニ極力折衝セル結果結局天皇ノ地位ヲ認メサレハ日本軍隊ヲ有效ニ統御スルモノナク聯合國ハ之カ始未ニ猶犧牲ヲ要求セラルヘシトノ米側意見カ大勢ヲ制シテ囘答又ノ決定ヲ見タルモノニテ囘答又ハ安協ノ結果ナルモ米側ノ外交的勝利ナリト評シ居レリ\n\n二、英國内ニ於テハ左翼各紙ハ日本ノ留保ニ反對ヲ表明シ「バンシタート」モ反對意見ヲ述ヘタルカ「デーリーエキスプレス」ハ天皇ハ引續キ在位セラルヘキナリトノ好意的論說ヲ揭ケ又「タイムス」ハ天皇大權ニ對スル從來ノ如キ神祕的解釋ヲ存續セシムルハ將來侵略思想再生ノ禍根トナルヘシトテ頻ニ反對シ日本ヲシテ人民主權說ニ基ク西歐流ノ立憲君主制ヲ受諾セシムルノ要ヲ力說シ居レリ\n\n三、尙昨日來ノBBC其他敵側放送ハ聯合國ハ日本ノ申出ヲ條件附ニテ受諾セルモノナリト述ヘ「アクセプト」ナル語ヲ使ヒ居レルハ注意ヲ要ス", "notes": [], "warn": false, "pages": [1931, 1932], "search": "「バーンズ回答」に関するスウェーデン各紙等の報道振りについて 岡本季正 오카모토 스에마사 — 주스웨덴 공사 東鄕茂德 도고 시게노리 — 외무대신 バンシタート 밴시타트 — 로버트 밴시타트(Robert Vansittart), 영국 외무성 전 사무차관"}, {"id": "d1096", "order": 1096, "date": "1945-08-14", "group": "B", "eyebrow": "문서 1096 · 四 ポツダム宣言の受諾", "title": "포츠담 선언 수락을 미·영·소·중 4국 측에 전달하도록 스위스 정부에 의뢰하라는 훈령 / 별전 1 — 1945년 8월 14일 발 도고 외무대신에게서 주스위스 가세 공사 앞 제353호, 포츠담 선언 수락 통고(영문) / 2 — 같은 날 발 제354호, 포츠담 선언 수락 통고(화역문)", "badge": "第三五二號（緊急） / 別電一 第三五三號（緊急） / 別電二 第三五四號（緊急）", "list_right": "문서 1096", "meta": [{"k": "일자", "v": "1945-08-14", "txt": false}, {"k": "발신", "v": "東鄕外務大臣 도고 시게노리(東鄕茂德) 외무대신", "txt": true}, {"k": "수신", "v": "在スイス加瀨公使 주스위스 가세 슌이치(加瀨俊一) 공사", "txt": true}, {"k": "발착", "v": "本省8月14日後11時00分發 / 別電一 本省8月14日後11時00分發 / 別電二 本省8月14日後11時00分發", "txt": false}, {"k": "장소", "v": "本省", "txt": false}, {"k": "전보번호", "v": "第三五二號（緊急） / 別電一 第三五三號（緊急） / 別電二 第三五四號（緊急）", "txt": false}, {"k": "종류", "v": "훈령", "txt": true}], "summary": "8월 14일 밤 11시, 도고 외상이 가세 공사에게 포츠담 선언 수락의 최종 통고문(영문 제353호·화역문 제354호)을 보내면서, 스위스 정부를 통해 미국 정부에, 미국 정부를 거쳐 영·소·중 3국 정부에 전달하도록 의뢰하라고 지시한 훈령.", "points": ["왕전 제352호가 본체 훈령, 제353호가 영문 통고문, 제354호가 그 화역문이다.", "전달 경로는 「스위스 정부 → 미국 정부, 미국 정부를 통하여 영·소·중 3국 정부」.", "같은 세 통을 참고로 스웨덴(스톡홀름)에도 전전(轉電)했다. 8월 10일 제의 때의 이중 경로를 그대로 유지한 것이다.", "통고문 제1항: 천황 폐하께서 포츠담 선언 조항 수락에 관한 조서(詔書)를 발포하셨다.", "제2항 전단: 천황 폐하께서 그 정부 및 대본영에 대하여, 포츠담 선언의 여러 규정을 실시하기 위하여 필요로 될 조항에 서명할 권한을 주고 또 이를 보장하실 용의가 있다.", "제2항 후단: 폐하께서 일체의 일본국 육·해·공군 관헌 및 그 지휘 아래 있는 일체의 군대에 대하여, 전투 행위를 종지하고 무기를 인도하며 위 조항 실시를 위해 연합국 최고사령관이 요구할 수 있는 명령을 발할 것을 명하실 용의가 있다.", "8월 10일의 제의에 붙어 있던 「天皇ノ國家統治ノ大權ヲ變更スルノ要求ヲ包含シ居ラサルコトノ了解ノ下ニ」라는 조건절이 이 14일 통고문에는 나타나지 않는다. 조건 없는 수락의 확정이다.", "일본 측 자신이 만든 영역문과 화역문이 나란히 실려 있어 대조가 가능하다."], "primary": "**本省 8월 14일 후 11시 00분 발**\n\n**第三五二號（긴급）**\n\n귀 임국(任國) 정부에 대하여, 별전 제353호(방역문〔邦譯文〕은 별전 제354호)와 같이 미국 정부 및 동 정부를 통하여 영·소·중(지나) 3국 정부에 전달하도록 의뢰하기 바란다.\n\n참고로서 별전 제353호 및 제354호와 함께 스웨덴에 전전(轉電)하였다.\n\n---\n\n## （別電一）\n\n**本省 8월 14일 후 11시 00분 발**\n\n**第三五三號（긴급）**\n\n> Communication of the Japanese Government of August 14th 1945 addressed to the Governments of the United States, Great Britain, the Soviet Union and China.\n>\n> With reference to the Japanese Government's Note of August 10 regarding their acceptance of the provisions of the Potsdam Declaration and the reply of the Governments of the United States, Great Britain, the Soviet Union and China sent by American Secretary of State Byrnes under the date of August 11, the Japanese Government have the honor to communicate to the Governments of the four Powers as follows:\n>\n> 1. His Majesty the Emperor has issued an Imperial Rescript regarding Japan's acceptance of the provisions of the Potsdam Declaration.\n>\n> 2. His Majesty the Emperor is prepared to authorize and ensure the signature by His Government and the Imperial General Headquarters of the necessary terms for carrying out the provisions of the Potsdam Declaration.\n>\n> His Majesty is also prepared to issue his commands to all the military, naval, and air authorities of Japan and all the forces under their control wherever located to cease active operations, to surrender arms, and to issue such other orders as may be required by the Supreme Commander of the Allied forces for the execution of the above-mentioned terms.\n\n---\n\n## （別電二）\n\n**本省 8월 14일 후 11시 00분 발**\n\n**第三五四號（긴급）**\n\n미·영·소·중(지나) 4국에 대한 8월 14일부 제국 정부 통고\n\n「포츠담」 선언의 조항 수락에 관한 8월 10일부 제국 정부의 신입(申入), 아울러 8월 11일부 「번스」 미국 국무장관 발(發) 미·영·소·중 4국 정부의 회답에 관련하여, 제국 정부는 위 4국 정부에 대하여 다음과 같이 통보하는 광영(光榮)을 가진다.\n\n一、천황 폐하께옵서는[天皇陛下ニ於カセラレテハ] 「포츠담」 선언의 조항 수락에 관한 조서(詔書)를 발포(發布)하셨다.\n\n二、천황 폐하께옵서는 그 정부 및 대본영(大本營)에 대하여 「포츠담」 선언의 여러 규정을 실시하기 위하여 필요로 될 조항에 서명할 권한을 주고 또 이를 보장하실 용의가 있다. 또 폐하께옵서는 일체의 일본국 육·해·공군 관헌 및 위 관헌의 지휘 아래 있는 일체의 군대에 대하여, 전투 행위를 종지(終止)하고 무기를 인도하며 앞에 적은 조항 실시를 위하여 연합국 최고사령관이 요구하는 일이 있을 수 있는 명령을 발할 것을 명하실 용의가 있다.", "secondary": "1096昭和20年8月14日在スイス加瀨公使宛（電報）東鄕外務大臣よりポツダダ宣言受諾を米英ソ中四カ国側へ伝達につきスイス政府に依賴方訓令\n\n別電の昭和二十年八月十四日發東鄕外務大臣より在スイス加瀨公使宛第三五三号ポツダム宣言受諾通告（英文）二昭和二十年八月十四日發東鄕外務大臣より在スイス加瀨公使宛第三五四号ポツダム宣言受諾通告（和訳文）\n\n本省8月14日後11時00分發\n\n第三五二號（緊急）\n\n貴任國政府ニ對シ別電第三五三號（邦譯又別電第三五四號）ノ通リ米國政府及同政府ヲ通シ英蘇支三國政府ニ傳達方依賴セラレタシ\n\n參考トシテ別電第三五三號及第三五四號ト共ニ瑞典ニ轉電セリ\n\n（別電の）\n\n本省8月14日後11時00分發\n\n第三五三號（緊急）\n\nCommunication of the Japanese Government of August 14th 1945 addressed to the Governments of the United States, Great Britain, the Soviet Union and China.WithreferencetotheJapaneseGovernmentムWith reference to the Japanese Government's Note of August 10 regarding their acceptance of the provisions of the Potsdam Declaration and the reply of the Governments of the United States, Great Britain, the Soviet Union and China sent by American Secretary of State Byrnes under the date of August 11, the Japanese Government have the honor to communicate to the Governments of the four Powers as follows:\n\n1.wHisMajestytheEmperorhasissuedanImperialRescriptregardingJapanムsacceptanceoftheprovisionsofthePotsdamDeclaration.\n\n2.w His Majesty the Emperor is prepared to authorize and ensure the signature by His Government and the Imperial General Headquarters of the necessary terms for carrying out the provisions of the Potsdam Declaration. His Majesty is also prepared to issue his commands to all the military, naval, and air authorities of Japan and all the forces under their control wherever located to cease active operations, to surrender arms, and to issue such other orders as may be required by the Supreme Commander of the Allied forces for the execution of the above-mentioned terms.（別電二）\n\n本省8月14日後11時00分發\n\n第三五四號（緊急）\n\n米英蘇支四國ニ對スル八月十四日附帝國政府通告\n\n「ポツダム」宣言ノ條項受諾ニ關スル八月十日附帝國政府ノ申入竝ニ八月十一日附「バーンズ」米國國務長官發米英蘇支四國政府ノ囘答ニ關聯シ帝國政府ハ右四國政府ニ對シ左ノ通通報スルノ光榮ヲ有ス\n\n一、天皇陛下ニ於カセラレテハ「ポツダム」宣言ノ條項受諾ニ關スル認書ヲ發布セラレタリ\n\n二、天皇陛下ニ於カセラレテハ其ノ政府及大本營ニ對シ「ポツダム」宣言ノ諸規定ヲ實施スル爲必要トセラルヘキ條項ニ者名スルノ權限ヲ與ヘ且之ヲ保障セラルルノ用意アリ又陛下ニ於カセラレテハ一切ノ日本國陸、海、空軍官憲及右官憲ノ指揮下ニ在ル一切ノ軍隊ニ對シ戰鬪行爲ヲ終止シ武器ヲ引渡シ前記條項實施ノ爲聯合國最高司令官ノ要求スルコトアルヘキ命令ヲ發スルコトヲ命セラルルノ用意アリ", "notes": ["편자가 붙인 머리에 별전 1(제353호, 영문)과 별전 2(제354호, 화역문)의 목차가 함께 실려 있다."], "warn": false, "pages": [1932, 1933, 1934], "search": "ポツダム宣言受諾を米英ソ中四カ国側へ伝達につきスイス政府に依頼方訓令　別電一　昭和二十年八月十四日発東鄕外務大臣より在スイス加瀨公使宛第三五三号　ポツダム宣言受諾通告（英文）　二　昭和二十年八月十四日発東鄕外務大臣より在スイス加瀨公使宛第三五四号　ポツダム宣言受諾通告（和訳文） 東鄕茂德 도고 시게노리 — 외무대신 加瀨俊一 가세 슌이치 — 주스위스 공사 バーンズ 번스 — 제임스 F. 번스(James F. Byrnes), 미국 국무장관 天皇陛下 천황 폐하 — 쇼와 천황"}, {"id": "d1097", "order": 1097, "date": "1945-08-14", "group": "A", "eyebrow": "문서 1097 · 四 ポツダム宣言の受諾", "title": "포츠담 선언 수락 통고문을 스위스 정부에 수교한 데 대하여", "badge": "第八八三號", "list_right": "문서 1097", "meta": [{"k": "일자", "v": "1945-08-14", "txt": false}, {"k": "발신", "v": "在スイス加瀨公使 — 주스위스 가세 슌이치(加瀨俊一) 공사", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 시게노리(東鄕茂德) 외무대신", "txt": true}, {"k": "발착", "v": "ベルン8月14日後8時42分發／本省8月15日前9時05分着", "txt": false}, {"k": "장소", "v": "ベルン 베른", "txt": false}, {"k": "전보번호", "v": "第八八三號", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "가세 공사가 8월 14일 오후 8시 5분 스위스 외무차관에게 수락 통고문(제353호)을 수교하고 훈령대로 취급을 의뢰했다는 회보.", "points": ["왕전 제352호(도고 외상의 훈령)에 대한 회보.", "14일 오후 8시 5분, 가세 공사가 직접 스위스 외무차관에게 귀전 제353호 통고문을 수교.", "훈령 모두(冒頭)에 지시된 대로, 미국 정부 및 미국을 통한 영·소·중 3국 정부에의 전달을 의뢰.", "스웨덴(스톡홀름)에도 전전(轉電)했다고 보고.", "베른 발신은 8월 14일 후 8시 42분, 본성 착신은 8월 15일 전 9시 05분이다. 조서 방송(15일 정오)보다 앞서 통고가 완료되어 있었음을 보여 준다.", "발신 시각(현지 20시 05분 수교, 20시 42분 발전)과 본성 훈령 발신(14일 23시 00분)의 시차는 시간대 차이 때문이다."], "primary": "**베른 8월 14일 후 8시 42분 발**\n**본성 8월 15일 전 9시 05분 착**\n\n**第八八三號（긴급）**\n\n귀전(貴電) 제352호에 관하여\n\n14일 오후 8시 5분 본사(本使)가 당국(當國) 외무차관에게 귀전 제353호 통고문(通告文)을 수교(手交)하였음. 모두(冒頭) 귀전대로 취급하여 주도록 의뢰하였음.\n\n스웨덴에 전전(轉電)하였음.", "secondary": "1097昭和20年8月14日東鄕外務大臣宛（電報）在スイス加瀨公使よりポツダダ宣言受諾通告文をスイス政府へ手交\n\nについて\n\nベルン8月14日後8時42分發本省8月15日前9時05分着\n\n第八八三號（緊急）\n\n貴電第三五二號ニ關シ\n\n十四日午後八時五分本使當國外務次官ニ貴電第三五三號通告又ヲ手交セリ亘頭貴電通リ取計方依賴セリ瑞典ヘ轉電セリ", "notes": [], "warn": false, "pages": [1934], "search": "ポツダム宣言受諾通告文をスイス政府へ手交について 加瀨俊一 가세 슌이치 — 주스위스 공사 東鄕茂德 도고 시게노리 — 외무대신"}, {"id": "d1098", "order": 1098, "date": "1945-08-14", "group": "D", "eyebrow": "문서 1098 · 四 ポツダム宣言の受諾", "title": "종전(終戰)의 조서", "badge": null, "list_right": "문서 1098", "meta": [{"k": "일자", "v": "1945-08-14", "txt": false}, {"k": "발신", "v": "御名御璽 — 천황(쇼와 천황)의 어명어새(御名御璽)", "txt": true}, {"k": "수신", "v": "爾臣民 — 신민(臣民)", "txt": true}, {"k": "장소", "v": "本省", "txt": false}, {"k": "종류", "v": "조서", "txt": true}], "summary": "1945년 8월 14일자로 발포된 종전의 조서. 제국 정부로 하여금 미·영·중(지나)·소 4국에 공동선언(포츠담 선언) 수락을 통고하게 하였음을 신민에게 고하고, 국체(國體)를 호지(護持)하여 만세를 위해 태평을 열겠다는 뜻을 밝힌 전문(全文)과 스즈키 내각 각료 전원의 부서(副署)가 실려 있다.", "points": ["「제국 정부로 하여금 미·영·중(지나)·소 4국에 대하여 그 공동선언을 수락한다는 뜻을 통고하게 하였다」. 포츠담 선언 수락의 공표다.", "미·영 두 나라에 선전(宣戰)한 까닭도 제국의 자존과 동아의 안정을 서기(庶幾)한 데서 나온 것이며 타국의 주권을 배(排)하고 영토를 침(侵)함은 본디 짐의 뜻이 아니었다는 개전 정당화.", "「적은 새로이 잔학한 폭탄을 사용하여 자주 무고(無辜)를 살상하고 참해(慘害)가 미치는 바 참으로 헤아릴 수 없기에 이르렀다」. 원자폭탄에 대한 유일한 언급이다.", "교전을 계속하면 우리 민족의 멸망을 초래할 뿐 아니라 나아가 인류의 문명까지 파각(破却)하리라는 것이 수락의 이유로 제시된다.", "「짐은 이에 국체(國體)를 호지(護持)할 수 있어」. 8월 10일 제의부터 이어진 국체 호지 조건이 조서 안에서 「달성되었다」고 선언된다.", "「감내하기 어려움을 감내하고 참기 어려움을 참아 만세를 위하여 태평을 열고자 한다」.", "동포 배제(排擠)와 사단(事端)을 함부로 일으키는 일을 경계하고, 국체의 정화(精華)를 발양하여 세계의 진운(進運)에 뒤지지 말 것을 명한다.", "조서에는 조선·대만 등 식민지, 카이로 선언, 무장해제, 점령 등 구체 조항이 일절 나오지 않는다. 「공동선언 수락」 다섯 자로 갈음되어 있다.", "1945년 8월 14일자, 내각총리대신 남작 스즈키 간타로 이하 각료 16명이 부서했다.", "육군대신 아난 고레치카(阿南惟幾)의 부서가 들어 있다. 그는 조서 발포 다음 날 새벽 자결했다."], "primary": "**昭和二十年八月十四日**\n\n## 終戰의 詔書\n\n짐은 깊이 세계의 대세와 제국의 현상(現狀)을 감(鑑)하여 비상한 조치로써 시국을 수습하고자 하여, 이에 충량(忠良)한 너희 신민에게 고하노라.\n\n짐은 제국 정부로 하여금 미·영·중(지나)·소 4국에 대하여 그 공동선언을 수락한다는 뜻을 통고하게 하였다.\n\n무릇[抑々] 제국 신민의 강녕(康寧)을 도모하고 만방공영(萬邦共榮)의 낙(樂)을 함께함은 황조황종(皇祖皇宗)의 유범(遺範)으로서 짐이 권권(拳々)히 놓지 아니하는 바이며, 지난날 미·영 두 나라에 선전(宣戰)한 까닭도 또한 실로 제국의 자존과 동아(東亞)의 안정을 서기(庶幾)함에서 나온 것이요, 타국의 주권을 배(排)하고 영토를 침(侵)함과 같은 것은 본디 짐의 뜻이 아니다. 그런데 교전이 이미 네 해를 열(閱)하매, 짐의 육해 장병의 용전(勇戰), 짐의 백료유사(百僚有司)의 여정(勵精), 짐의 일억 중서(衆庶)의 봉공(奉公), 각각 최선을 다하였음에도 불구하고 전국(戰局)이 반드시 호전되지는 아니하고 세계의 대세 또한 우리에게 이롭지 아니하다. 뿐만 아니라[加之] 적은 새로이 잔학한 폭탄을 사용하여 자주 무고(無辜)를 살상하고, 참해(慘害)가 미치는 바 참으로 헤아릴 수 없기에 이르렀다. 그런데도 오히려 교전을 계속한다면, 마침내 우리 민족의 멸망을 초래할 뿐 아니라 나아가[延テ] 인류의 문명까지도 파각(破却)하게 되리라. 이와 같다면 짐은 무엇으로써 억조(億兆)의 적자(赤子)를 보전하고 황조황종의 신령(神靈)에 사(謝)하겠는가. 이것이 짐이 제국 정부로 하여금 공동선언에 응하게 하기에 이른 까닭이다.\n\n짐은 제국과 함께 시종 동아의 해방에 협력한 여러 맹방(盟邦)에 대하여 유감의 뜻을 표하지 아니할 수 없다. 제국 신민으로서 전진(戰陣)에서 죽고 직역(職域)에 순(殉)하고 비명(非命)에 폐(斃)한 자 및 그 유족에게 생각을 이르게 하면 오내(五内)가 이 때문에 찢어진다. 또한 전상(戰傷)을 입고 재화(災禍)를 입고 가업을 잃은 자의 후생(厚生)에 이르러서는 짐이 깊이 진념(軫念)하는 바이다. 생각건대 앞으로 제국이 받아야 할 고난은 본디 심상(尋常)치 아니하며, 너희 신민의 충정(衷情)도 짐이 잘 이를 안다. 그러나 짐은 시운(時運)이 향하는 바, 감내하기 어려움을 감내하고 참기 어려움을 참아, 그로써 만세(萬世)를 위하여 태평을 열고자 한다.\n\n짐은 이에 국체(國體)를 호지(護持)할 수 있어 충량한 너희 신민의 적성(赤誠)에 신의(信倚)하고 항상 너희 신민과 함께 있다. 만약 무릇 정(情)이 격한 나머지 함부로 사단(事端)을 번거로이 하거나, 혹은 동포를 배제(排擠)하여 서로 시국을 어지럽히고 이 때문에 대도(大道)를 그르쳐 신의를 세계에 잃음과 같은 것은 짐이 가장 이를 경계한다. 마땅히 거국일가(擧國一家) 자손이 서로 전하여, 굳게 신주(神州)의 불멸을 믿고, 임무는 무겁고 길은 멂을 생각하여, 총력을 장래의 건설에 기울이고, 도의를 두터이 하고 지조를 굳게 하여, 맹세코 국체의 정화(精華)를 발양하여 세계의 진운(進運)에 뒤지지 않기를 기(期)하여야 할지니라. 너희 신민 그것들[其レ] 능히[克ク] 짐의 뜻을 체(體)하라.\n\n**御名御璽**\n\n**昭和二十年八月十四日**\n\n| 직 | 이름 |\n|---|---|\n| 内閣總理大臣 男爵 | 鈴木貫太郎 스즈키 간타로 |\n| 海軍大臣 | 米内光政 요나이 미쓰마사 |\n| 司法大臣 | 松阪廣政 마쓰자카 히로마사 |\n| 陸軍大臣 | 阿南惟幾 아난 고레치카 |\n| 軍需大臣 | 豐田貞次郎 도요다 데이지로 |\n| 厚生大臣 | 岡田忠彦 오카다 다다히코 |\n| 國務大臣 | 櫻井兵五郎 사쿠라이 효고로 |\n| 國務大臣 | 左近司政三 사콘지 세이조 |\n| 國務大臣 | 下村宏 시모무라 히로시 |\n| 大藏大臣 | 廣瀬豐作 히로세 도요사쿠 |\n| 文部大臣 | 太田耕造 오타 고조 |\n| 農商大臣 | 石黑忠篤 이시구로 다다아쓰 |\n| 内務大臣 | 安倍源基 아베 겐키 |\n| 外務大臣兼大東亞大臣 | 東鄕茂德 도고 시게노리 |\n| 國務大臣 | 安井藤治 야스이 도지 |\n| 運輸大臣 | 小日山直登 고히야마 나오토 |", "secondary": "1098昭和20年8月14日\n\n終戰の詔書\n\n朕深ク世界ノ大勢ト帝國ノ現狀トニ鑑ミ非常ノ措置ヲ以テ時局ヲ收拾セムト欲シ玆ニ忠良ナル爾臣民ニ告ク\n\n朕ハ帝國政府ヲシテ米英支蘇四國ニ對シ其ノ共同宣言ヲ受諾スル旨通告セシメタリ\n\n抗々帝國臣民ノ康學ヲ圖リ萬邦共榮ノ樂ヲ偕ニスルハ皇祖皇宗ノ遺節ニシテ朕ノ拳々措カサル所曩ニ米英二國ニ宣戰セル所以モ亦實ニ帝國ノ自存ト東亞ノ安定トヲ□幾スルニ出テ他國ノ主權ヲ排シ領土ヲ侵スカ如キハ固ヨリ朕カ志ニアラス然ルニ交戰已ニ四歲ヲ閱シ朕カ陸海將兵ノ勇戰朕カ百僚有司ノ勵精朕カ一億衆□ノ奏公各々最善ヲ盡セルニ拘ラス戰局必スシモ好轉セス世界ノ大勢亦我ニ利アラス加之敵ハ新ニ殘虐ナル爆彈ヲ使用シテ頻ニ無幸ヲ殺傷シ慘舌ノ及フ所眞ニ測ルヘカラサルニ至ル而モ尙交戰ヲ繼續セムカ終ニ我カ民族ノ滅亡ヲ招來スルノミナラス處テ人類ノ又明ヲモ破却スヘシ斯ノ如クムハ朕何ヲ以テカ億兆ノ赤子ヲ保シ皇祖皇宗ノ神靈ニ謝セムヤ是レ朕カ帝國政府ヲシテ共同宣言ニ應セシムルニ至レル所以ナリ\n\n朕ハ帝國ト共ニ終始東亞ノ解放ニ協力セル諸盟邦ニ對シ遺憾ノ意ヲ表セサルヲ得ス帝國臣民ニシテ戰陣ニ死シ職域ニ殉シ非命ニ繋レタル者及其ノ遺族ニ想ヲ致セハ五内爲ニ裂ク且戰傷ヲ貝ヒ災禍ヲ蒙リ家業ヲ失ヒタル者ノ厚生ニ至リテハ朕ノ深ク軫念スル所ナリ惟フニ今後帝國ノ受クヘキ苦難ハ固ヨリ導常ニアラス爾臣民ノ夷情モ朕善ク之ヲ知ル然レトモ朕ハ時連ノ趨ク所堪ヘ難キヲ堪ヘ忽ヒ難キヲ忽ヒ以テ萬世ノ爲ニ太平ヲ開カムト欲ス\n\n朕ハ玆ニ國體ヲ護持シ得テ忠良ナル爾臣民ノ赤誠ニ信倚シ常ニ爾臣民ト共ニ在リ若シ夫レ情ノ激スル所濫ニ事端ヲ滋クシ或ハ同胞排擔互ニ時局ヲ亂リ爲ニ大道ヲ誤リ信義ヲ世界ニ失フカ如キハ朕最モ之ヲ戒ム官シク擧國一家子孫相傳ヘ確ク神州ノ不滅ヲ信シ任重クシテ道遠キヲ念ヒ總力ヲ將來ノ建設ニ傾ケ道義ヲ篤クシ志操ヲ鞏クシ誓テ國體ノ精華ヲ發揚シ世界ノ進連ニ後レサラムコトヲ期スヘシ爾臣民其レ京ク朕カ意ヲ體セヨ\n\n御名御璽\n\n昭和二十年八月十四日\n\n内閣總理大臣男爵鈴木貫太郞\n\n海軍良大良臣米内光良政\n\n司良決良大良臣松良阪廣良政\n\n陸良軍良大良臣阿良南惟幾\n\n軍良需良大良臣豐田貞次郞\n\n厚良生良大良臣岡良田忠彦\n\n國良務良大良臣櫻井兵五郞\ 구하고 극히 슬퍼해야 할 결말을 고하고, 황공하게도 신금(宸襟)을 깊이 번뇌케 해 받들기에 이르렀다」. 패전을 신금의 문제로 서술한다.", "앞으로 제국의 국보(國步)는 더욱 간난(艱難)을 더할 것이므로 국민은 대조의 어취지를 체(体)하여 결속을 굳게 하고 국체 호지(國体護持)를 위해 온갖 노력을 기울여야 한다.", "외교의 소임을 맡은 자의 책임은 더욱 무거워졌으며, 어떤 사태에 처해서도 국체의 호지와 황국의 명예 보지(保持)를 위해 혼신의 용기를 떨치는 것이 성려(聖慮)에 부합해 받드는 유일한 길이라고 확신한다는 대목.", "공사·총영사와 관원 각위는 행동에 신중을 기하고 구차하게라도 제국 대표로서의 위엄을 실추하는 일이 없도록 유의할 것, 재류 방인에게도 위 취지를 충분히 설명하여 자중을 요망해 둘 것.", "본전 및 별전의 수신지는 스위스, 스웨덴, 포르투갈(葡), 「카불」이다. 스위스에서 취리히로 전보(轉報)하도록 지시한다.", "발신은 8월 15일 전 3시다. 조서의 라디오 방송(15일 정오)보다 아홉 시간 앞선다."], "primary": "**本省 8월 15일 전 3시 발**\n\n**合第六七一號（긴급）**\n\n一、제국 정부에서는, 속히 인류를 전쟁의 참화(慘禍)에서 면(免)하게 하실 것을 기념(祈念)하시는 천황 폐하의 대어심(大御心)에 부합해 받들기 위하여[副ヒ奉ランガ爲], 7월 26일의 「포츠담」 공동선언이 국체(國体)를 변경하는 요구를 포함하고 있지 않다는 취지의 양해 아래 이를 수락하기로 결(決)하고, 위 양해에 대한 미·영·소·중(지나) 4국 정부의 견해를 확인한 뒤, 황공하게도 천황 폐하께옵서는 8월 14일 심(深)〔（省略）〕경(更)에 별전 합 제672호와 같은 종전(終戰)에 관한 대조(大詔)를 발하셨다.\n\n二、이리하여 대동아전쟁은 개전 이래의 황군 장병의 용전(勇戰), 국민 상하 일치의 분려(奮勵)에도 불구하고 극히 슬퍼해야 할 결말을 고하고, 황공하게도 신금(宸襟)을 깊이 번뇌케 해 받들기에 이른 것은 일본 신민이 다 같이 공구(恐懼)하여 마지 못할 바이다. 게다가 앞으로 제국의 국보(國步)는 더욱[愈] 간난(艱難)을 더할 것이니, 일본 국민은 종전에 관한 대조의 어취지(御趣旨)를 체(体)하여 더욱 그 결속을 굳게 하고, 국체 호지(國体護持)를 위하여 온갖 노력을 기울일 필요가 있는 바이다.\n\n三、귀 공사(총영사) 및 관원 각위가 대동아전쟁 중 여정(勵精)하여 능히[克ク] 그 임무의 수행에 임하신 것은 본 대신이 깊이 다행으로 여기는[多トスル] 바이나, 이제 이 제국 유사 이래의 대난국(大難局)에 즈음하여 외교의 소임에 임하는 자의 책임은 더욱 무거움을 더하는 것이라 말하지 아니할 수 없다. 본 대신은 전(全) 본성원 및 재외 공관원과 함께 깊이 종전에 관한 대조의 어취지를 체(体)하고 제국이 직면하는 비경(悲境)에 생각을 이르게 하여, 그 행동에 관하여 충분히 자중하는 한편, 어떠한 사태에 처하여서도 국체(國体)의 호지와 황국(皇國)의 명예의 보지(保持)를 위하여 혼신의 용(勇)을 떨치는 것으로써 성려(聖慮)에 부합해 받들[副ヒ奉ル] 유일한 길이라고 확신하는 바이다.\n\n四、따라서 귀사(貴使)〔귀 총영사〕 및 관원 각위께서는 위 취지에 근거하여 그 행동에 관하여 신중을 기하시고, 구차하게라도[苟且ニモ] 제국 대표로서 위엄을 실추하는 일이 없도록 유의하시기 바라며, 또 귀지(貴地) 재류 방인(邦人)에 대하여서도 위 취지를 충분히 설명하시어 그 자중을 요망해 두시기 바란다.\n\n본전(本電) 및 별전 수신지  스위스, 스웨덴, 포르투갈[葡], 「카불」\n\n스위스에서 「취리히」로 전보(轉報)하여 주시기 바란다.", "secondary": "1099昭和20年8月15日公使、在ポルトガル森島公使他宛（電報）在スイス加瀨公使、在スウエーデン岡本ポツダダ宣言受諾決定の通報及び今後の措置\n\nに関する訓令\n\n本省8月15日前3時發\n\n合第六七一號（緊急）\n\n一、帝國政府ニ於テハ速ニ人類ヲ戰爭ノ慘禍ヨリ免レシメンコトヲ祈念シ給フ天皇陛下ノ大御心ニ副ヒ奏ランガ爲七月二十六日ノ「ポツダム」共同宣言ガ國体ヲ變更スルノ要求ヲ包含シ居ラズトノ趣旨ノ了解ノ下ニ之ヲ受諾スルニ決シ右了解ニ對スル米英蘇支四國政府ノ見解ヲ確メタル後畏クモ天皇陛下ニ於カセラレテハ八月十四日深（省略）\n\n更別電合第六七二號ノ如キ終戰ニ關スル大認ヲ發セラレタリ\n\n二、斯クテ大東亞戰爭ハ開戰以來ノ皇軍將兵ノ勇戰國民上下一致ノ奮勵ニモ不拘極メテ悲シムベキ結未ヲ告ゲ畏クモ宸襟ヲ深ク惱シ奏ルニ至リシコトハ日本臣民ノ齊シク恐懼措ク能ハザル所ナリ而モ今後帝國ノ國步ハ懸艱難ヲ加フベク日本國民ハ終戰ニ關スル大認ノ御趣旨ヲ体シ懸其ノ結束ヲ固クシテ國体護持ノ爲有ラユル努力ヲ拂フノ要アル次第ナリ\n\n三、貴公使（總領事）及館員各位ガ大東亞戰爭中勵精京ク其ノ任務ノ遂行ニ當ラレタルハ本大臣ノ深ク多トスル所ナルガ今ヤ此ノ帝國有史以來ノ大難局ニ際シ外交ノ衝ニ當ルモノノ靑任ハ懸重キヲ加フルモノト言ハザルベカラズ本大臣ハ全本省員及在外公館員ト共ニ深ク終戰ニ關スル大認ノ御趣旨ヲ体シ帝國ノ直面スル悲塲ニ思ヲ致シテ其ノ行動ニ關シ充分自重スル一方如何ナル事態ニ處シテモ國体ノ護持ト皇國ノ名譽ノ保持トノ爲渾身ノ勇ヲ揮フヲ以テ□慮ニ副ヒ奏ルベキ唯一ノ途ト確信スル次第ナリ\n\n四、付テハ貴使（貴總領事）及館員各位ニ於テハ右趣旨ニ基キ其ノ行動ニ關シ惱重ヲ期セラレ苟且ニモ帝國代表トシテ威嚴ヲ失墜スルガ如キコト無キ樣留意セラレ度又貴地在留邦人ニ對シテモ右趣旨ヲ充分御說明相成其ノ自重ヲ要望シ置カレ度シ\n\n本電及別電宛先瑞西、瑞典、葡、「カブール」\n\n瑞西ヨリ「チユーリツヒ」ニ轉報アリ度", "notes": ["본문 一 항의 「八月十四日深（省略）更」의 「（省略）」은 지면에 작은 글자로 인쇄된 편자 표시다. 생략된 대목이 무엇인지 지면만으로는 확정되지 않아 위치 그대로 두었다."], "warn": false, "pages": [1935, 1936], "search": "ポツダム宣言受諾決定の通報及び今後の措置に関する訓令 東鄕茂德 도고 시게노리 — 외무대신 加瀨俊一 가세 슌이치 — 주스위스 공사 岡本季正 오카모토 스에마사 — 주스웨덴 공사 森島 모리시마 — 주포르투갈 공사 天皇陛下 천황 폐하 — 쇼와 천황"}, {"id": "d1100", "order": 1100, "date": "1945-08-15", "group": "B", "eyebrow": "문서 1100 · 四 ポツダム宣言の受諾", "title": "포츠담 선언 수락에 관한 일본 측 희망을 미·영·소·중 4국 정부에 전달하도록 스위스 정부에 의뢰하라는 훈령 / 별전 1 — 1945년 8월 15일 발 도고 외무대신에게서 주스위스 가세 공사 앞 제357호, 포츠담 선언 수락에 관한 일본 측 희망 / 2 — 같은 날 발 제358호, 위의 화역문(和譯文) 〔編注〕", "badge": "第三五六號（緊急、館長符號） / 別電一 第三五七號（緊急） / 別電二 第三五八號（緊急）", "list_right": "문서 1100", "meta": [{"k": "일자", "v": "1945-08-15", "txt": false}, {"k": "발신", "v": "東鄕外務大臣 도고 시게노리(東鄕茂德) 외무대신", "txt": true}, {"k": "수신", "v": "在スイス加瀨公使 주스위스 가세 슌이치(加瀨俊一) 공사", "txt": true}, {"k": "발착", "v": "本省8月15日前4時發〔編注〕 / 別電一 本省8月15日後4時發 / 別電二 本省8月15日後3時發", "txt": false}, {"k": "장소", "v": "本省", "txt": false}, {"k": "전보번호", "v": "第三五六號（緊急、館長符號） / 別電一 第三五七號（緊急） / 別電二 第三五八號（緊急）", "txt": false}, {"k": "종류", "v": "훈령", "txt": true}], "summary": "도고 외상이 가세 공사에게, 포츠담 선언 실시 조항의 원활한 이행을 위한 일본 측 희망(연합군 진주 예고, 점령 지점 최소화·도쿄 제외, 천황 명령에 의한 자주적 무장해제, 정전 실시일의 여유, 외지 부대에 대한 식량·의약품 수송)을 스위스 정부의 알선으로 4국 정부에 전달하도록 훈령하고, 그 영역문과 화역문을 별전으로 보낸 건.", "points": ["왕전 제352호(수락 통고) 뒤 몇 시간의 여유를 두고 별전 제357호(영문)와 그 화역인 제358호를 스위스 정부를 통해 4국 정부에 전달하도록 의뢰하라는 지시.", "이 신입(申入)은 「어디까지나 우리 쪽 희망의 개진에 지나지 않으며 선언 수락의 조건으로서 제출하는 것이 아니다」라고 못박은 점이다. 8월 12일 이후 조건부 수락 논란을 되풀이하지 않으려는 문언이다.", "「우리 쪽 내정상으로도 특히 필요하다」는 괄호 안의 문구는 가세 공사에게만 알리는 내부 사정 설명(館長符號 전보).", "(1) 연합국 함대·군대의 일본 본토 진입은 미리 예정을 통보해 줄 것.", "(2) 점령 지점의 수를 최소한으로 하고 선택에서 도쿄를 제외할 것, 파주 병력도 상징적 정도에 그칠 것.", "무장해제는 해외 300만여 군대와 장병의 명예에 직결되므로, 천황 폐하의 명령에 근거해 제국군 스스로 실시하고 연합국은 그 결과 무기의 인도를 받는 방법을 최선으로 제시.", "헤이그 육전법규 제35조를 준용해 군인의 명예를 존중하고 대검(帶劍)을 인정할 것, 무장해제된 일본 군인을 강제노역에 사용할 의도가 없는 것으로 이해한다는 문언, 내지 철수용 선박 제공 요망.", "정전 실시 기일에는 원격지 부대에 천황의 명령이 철저히 전달될 여유를 둘 것.", "태평양 이도(離島)의 부대에 식량·의약품을 보내고 상병병(傷病兵)을 본토로 수송하기 위한 조치 요망.", "영역문 제357호와 화역문 제358호가 함께 실려 있어 일본 측 자신의 영역을 대조할 수 있다."], "primary": "**本省 8월 15일 전 4시 발** 〔編注〕\n\n**第三五六號（긴급, 館長符號)**\n\n귀관은 왕전(往電) 제352호 통고 후 몇 시간의 여유를 두고, 별전 제357호(방역문은 별전 제358호)를 귀 임국(任國) 정부로부터 4국 정부에 전달하도록 의뢰하기 바란다.\n\n위의 신입(申入)은 어디까지나 우리 쪽 희망의 개진(開陳)에 지나지 않으며 선언 수락의 조건으로서 제출하는 것은 아니다. 그러나 앞으로의 기미(機微)하고 곤란한 공동선언 규정의 실시 조항의 실행을 원활하게 하기 위하여 지극히 긴요하므로 (또한 우리 쪽 내정상으로도 특히 필요하다. 이는 귀관이 알아 두기 바란다) 귀 임국에 대해서도 제국 정부가 고심하는 바를 충분히 설명한 뒤 우리 쪽 희망의 실현을 위한 알선(斡旋)을 의뢰하기 바란다.\n\n별전과 함께 스웨덴에 전전(轉電)하였다.\n\n〔編注〕 전송(電送) 번호 등으로 보아 실제 발전(發電) 시간은 오전 11시경이었던 것으로 생각된다.\n\n---\n\n## （別電一）\n\n**本省 8월 15일 후 4시 발**\n\n**第三五七號（긴급）**\n\n> The Japanese Government would like to be permitted to state to the Governments of America, Britain, China and the Soviet Union what they most earnestly desire with reference to the execution of certain Provisions of the Potsdam Proclamation. This may be done possibly at the time of the Signature. But fearing that they may not be able to find an appropriate opportunity, they take the liberty of addressing the Governments of the four Powers through the good offices of the Government of Swizterland.〔（Switzerland ヵ）〕\n>\n> In view of the fact that the purpose of occupation as mentioned in the Potsdam Proclamation is solely to secure the achievement of the basic objectives set forth in the said Proclamation, the Japanese Government sincerely desire that the four Powers, relying upon the good faith of the Japanese Government, will facilitite〔（facilitate ヵ）〕 discharge by the Japanese Government of their obligations as to forestall any unnecessary complications.\n>\n> It is earnestly solicited that:\n>\n> (a) In case of the entry of Allied fleets or troops in Japan Proper, the Japanese Government be notified in advance, so that arrangements can be made for reception.\n>\n> (b) The number of the points in Japanese territory to be designated by the Allies for occupation be limited to minimum number, selection of the points be made in such a manner as to leave such a city as Tokyo unoccupied and the forces to be stationed at each point be made as small as possible.\n>\n> 2. Disarming of the Japanese forces, being a most delicate task as it involves over three millions of officers and men overseas and having direct bearing on their honour, the Japanese Government will, of course, take utmost pains. But it is suggested that the best and the most effective method would be that under the command of His Majesty the Emperor, the Japanese forces are allowed to disarm themselves and surrender arms of their own accord.\n>\n> Disarming of the Japanese forces on the Continent be carried out beginning on the front line and in successive stages.\n>\n> In connection with the disarming it is hoped that Article 35 of the Hague Convention will be applied, and the honour of the soldier will be respected, permitting them, for instance, to wear swords. Further, the Japanese Government be given to understand the Allies have no intention to employ disarmed Japanese soldiers for compulsory labour. It is sincerely hoped that shipment and transportation facilities necessary for the evacuation of the soldiers to their homeland will be speedily provided.\n>\n> 3. Since some forces are located in remote places, difficult to communicate the Imperial order, it is desired that reasonable time be allowed before the cessation of hostilities.\n>\n> 4. It is hoped that the Allies will be good enough quickly to take necessary steps or extend us facilities for the shipment of indispensable foodstuffs and medical supplies to Japanese forces in distant islands, and for the transport of wounded soldiers from those islands.\n\n---\n\n## （別電二）\n\n**本省 8월 15일 후 3시 발**\n\n**第三五八號（긴급）**\n\n제국 정부는 「포츠담」 선언의 약간 조항의 실시의 원활을 기하기 위하여 절실한 희망을 가지고 있어, 이를 위 선언 실시 조항 서명(署名) 때 또는 그 밖의 적당한 기회에 개진하게 하고자 하는 바이나, 혹 그러한 기회가 없을 것을 우려하여 이에 이를 스위스국 정부의 알선에 의하여 미·영·중(지나)·소 4국 정부에 전달하고자 한다.\n\n一、「포츠담」 선언 중의 점령의 목적이 오로지 「포츠담」 선언에 게재된 기본적 목적의 달성을 보장하는 데 있음에 비추어, 4국 측에서는 제국 정부가 해(該) 조항을 성의로써 실행하려는 것임을 신뢰하여, 제국 정부의 책무 수행을 용이하고 원활하게 하고 또한 무용한 분규를 피하도록 배려하기 바란다. 이를 위하여\n\n&nbsp;&nbsp;(1) 연합국 측의 함대 또는 군대의 일본 본토 진입에 관하여는 일본 측 준비의 관계도 있으므로 미리 그 예정을 통보하여 주기 바란다는 것\n\n&nbsp;&nbsp;(2) 연합국이 지정하여야 할 일본국 영역 내의 점령 지점은 그 수를 최소한도에 그치고, 또한 그 선택에 있어 예컨대 도쿄를 제외할 것, 아울러 위 당해 지점에 파주(派駐)되는 병력도 상징적 정도에 그칠 것\n\n&nbsp;&nbsp;을 절실히 고려하여 주기 바란다.\n\n二、무장해제는 해외에 있는 300만여의 군대에 관련됨과 아울러 일본 장병의 명예에 직접 닿는 가장 곤란하고 기미(機微)한 문제임은 말할 나위 없는 바로서, 이의 실시에 관하여는 제국 정부에서 가장 고심하고 있는 터이나, 이의 실효를 기하는 최선의 방법으로서는 천황 폐하의 어명령(御命令)에 근거하여 제국군이 스스로 실시하고, 연합국은 그 원활한 실시의 결과 무기의 인도를 받는 것으로 하기 바란다.\n\n대륙에 있는 제국군의 무장해제에 있어서는 제일선으로부터 후방을 향하여 축차(遂次)〔（逐ヵ）〕 단계적으로 실시하는 것으로 하기 바란다.\n\n무장해제에 관련하여 헤이그 육전법규 제35조를 준용하여 군인의 명예를 존중하고 대검(帶劍)은 이를 인정하여 주기 바란다. 또 연합국 측이 무장을 해제당한 일본 군인을 강제노역에 사용하는 것과 같은 의도를 가지고 있지 아니한 것으로 이해한다. 해외에서 무장을 해제당한 일본 군인을 그대로 오래 해외에 주류시키는 것은 피아 쌍방에게 달갑지 않은 갖가지 복잡하고 곤란한 문제를 낳을 우려가 있으므로, 연합국 측에서 속히 이들을 일본 내지로 철수시키기 위하여 필요한 선박 및 그 수송상의 편의를 공급하여 주실 것을 절망(切望)한다.\n\n三、정전에 관하여는 원격지에 있는 부대에 천황 폐하의 어명령을 충분히 철저하게 할 필요가 있으므로, 정전의 실시 기일에 관하여는 얼마간의 여유를 두어 주기 바란다.\n\n四、태평양의 이도(離島)에 있는 제국 군대에 대하여 필요 불가결한 정도의 식량·의약품을 송부하고, 또 이들 이도로부터 본토로 상병병(傷病兵)을 수송하기 위하여, 급히 연합국 측에서 소요의 조치를 강구하거나 또는 우리 쪽에 대하여 편의를 공여하여 주기 바란다.", "secondary": "1100昭和20年8月15日在スイス加瀨公使宛（電報）東鄕外務大臣よりポツダダ宣言受諾に関する日本側希望につき米英ソ中四カ国政府への伝達をスイス政府に依賴方訓令\n\n別電の昭和二十年八月十五日發東鄕外務大臣より在スイス加瀨公使宛第三五七号\n\nポツダム宣言受諾に関一る日本側希望\n\n二昭和二十年八月十五日發東鄕外務大臣より在スイス加瀨公使宛第三五八号\n\n右和訳文\n\n（編注）\n\n本省8月15日前4時發\n\n第三五六號（緊急、館長符號）\n\n貴官ハ往電第三五二號通告後數時間ノ余裕ヲ置キ別電第三五七號（邦譯又、別電第三五八號）ヲ貴任國政府ヨリ四國政府ニ傳達方依賴アリ度\n\n右申入ハ飽ク迄我方ノ希望ノ開陳ニ過キスシテ宣言受諾ノ條件トシテ提出スルモノニハアラス然レトモ今后ノ機微困難ナル共同宣言ノ規定ノ實施條項ノ實行ヲ圓滑ナラシムル爲極メテ肝要ナルニ付（尙我方ノ内政上ヨリシテモ特ニ必要ナリ右貴官御含迄）貴任國ニ對シテモ帝國政府苦心ノ程ヲ篤ト御說明ノ上我方希望實現ノ爲幹旋方依賴セラレ度\n\n別電ト共ニ瑞典ニ轉電セリ\n\n編注電送番号等から実際、發電時間は午前十一時頃であったと思われる。\n\n（別電の）\n\n本省8月15日後4時發\n\n第三五七號（緊急）\n\nThe Japanese Government would like to be permitted to state to the Governments of America, Britain, China and the Soviet Union what they most earnestly desire with reference to the execution of certain Provisions of the Potsdam Proclamation. This may be done possibly at the time of the Signature. But fearing that they may not be able to find an appropriate opportunity, they take the liberty of addressing the Governments of the four Powers through the good offices of the Government of Swizterland.（Switzerland□）\n\nofSwizterland.\n\nIn view of the fact that the purpose of occupation as mentioned in the Potsdam Proclamation is solely to secure the achievement of the basic objectives set forth in the said Proclamation, the Japanese Government sincerely desire that the four Powers, relying upon the good faith of the Japanese Government, will facilitite（facilitate□）\n\nGovernment,PwillPfacilitite discharge by the Japanese Government of their obligations as to forestall any unnecessary complications.\n\nItisearnestlysolicitedthat:（a）a) In case of the entry of Allied fleets or troops in Japan Proper, the Japanese Government be notified in advance, so that arrangements can be made for reception.（b）b) The number of the points in Japanese territory to be designated by the Allies for occupation be limited to minimum number, selection of the points be made in such a manner as to leave such a city as Tokyo unoccupied and the forces to be stationed at each point be made as small as possible.\n\n2.Disarming of the Japanese forces, being a most delicate task as it involves over three millions of officers and men overseas and having direct bearing on their honour, the Japanese Government will, of course, take utmost pains. But it is suggested that the best and the most effective method would be that under the command of His Majesty the Emperor, the Japanese forces are allowed to disarm themselves and surrender arms of their own accord.\n\nDisarming of the Japanese forces on the Continent be carried out beginning on the front line and in successive stages. In connection with the disarming it is hoped that Article 35 of the Hague Convention will be applied, and the honour of the soldier will be respected, permitting them, for instance, to wear swords. Further, the Japanese Government be given to understand the Allies have no intention to employ disarmed Japanese soldiers for compulsory labour. It is sincerely hoped that shipment and transportation facilities necessary for the evacuation of the soldiers to their homeland will be speedily provided.\n\n□.Since some forces are located in remote places, difficult to communicate the Imperial order, it is desired that reasonable time be allowed before the cessation of hostilities.x. It is hoped that the Allies will be good enough quickly to take necessary steps or extend us facilities for the shipment of indispensable foodstuffs and medical supplies to Japanese forces in distant islands, and for the transport of wounded soldiers from those islands.\n\n（別電二）\n\n本省8月15日後3時發\n\n第三五八號（緊急）\n\n帝國政府ハ「ポツダム」宣言ノ若干條項ノ實施ノ圓滑ヲ期スル爲切實ナル希望ヲ存シ之ヲ右宣言實施條項者名ノ際又ハ其ノ他適當ナル機會ニ開陳セシメタキ處或ハ斯カル機會ナキコトヲ虞レ玆ニ之ヲ瑞西國政府ノ幹旋ニ依リ米英支蘇四國政府ニ傳達セントス\n\n一、「ポツダム」宣言中ノ占領ノ目的カ專ラ「ポツダム」宣言ニ揭ケラレタル基本的目的ノ達成ヲ保障スルニ在ルニ鑑ミ四國側ニ於テハ帝國政府カ談條項ヲ誠意ヲ以テ實行セムトスルモノナルニ信賴シ帝國政府ノ靑務遂行ヲ容易圓滑ナラシメ且無用ノ紛糾ヲ避クルカ如ク配慮アリ度之カ爲\n\n(1)聯合國側ノ艦隊又ハ軍隊ノ日本本十進入ニ付テハ日本側準備ノ關係モアリ豫メ其ノ豫定ヲ通報アリタキコト(2)聯合國ノ指定スヘキ日本國領域内ノ占領ノ地點ハ其ノ數ヲ最少限度ニ止メ且其ノ選擇ニ當リ例ヘハ東京ヲ除外スルコト竝ニ右當談地點ニ派駐セラルル兵力モ象徵的程度ニ止ムルコト\n\nヲ切實ニ考慮アリ度\n\n二、武裝解除ハ海外ニ在ル三百萬餘ノ軍隊ニ關聯アルト共ニ日本將兵ノ名譽ニ直接觸レタル最モ困難機微ナル問題ナルコト言ヲ俟タサル所ニシテ之カ實施ニ付テハ帝國政府ニ於テ最モ苦慮シ居ル次第ナルカ之カ實效ヲ期スル最善ノ方決トシテハ天皇陛下ノ御命令ニ基キ帝國軍自ラ實施シ聯合國ハ其ノ圓滑ナル實施ノ結果武器ノ引渡ヲ受クルモノト致度\n\n（遂カ）\n\n大陸ニ在ル帝國軍ノ武裝解除ニ當リテハ第一線ヨリ遂次後方ニ向ケ段階的ニ實施スルコトトシ度\n\n武裝解除ニ關聯シ海牙陸戰決規第三十五條ヲ準用シ軍人ノ名譽ヲ重ンシ帶劔ハ之ヲ認メラレ度又聯合國側カ武裝ヲ解除セラレタル日本軍人ヲ强制勞役ニ使用スル如キ意圖ヲ有セサルモノト了解ス海外ニ於テ武裝ヲ解除セラレタル日本軍人ヲ其ノ儘永ク海外ニ駐留セシムルコトハ彼我双方ニトリ面白カラサル種々ノ複雜困難ナル問題ヲ生スルノ虞アルニ付聯合國側ニ於テ速カニ之ヲ日本内地ニ撤收セシムル爲ニ必要ナル船舶及其ノ輸送上ノ便官ヲ供給セラレンコトヲ切望ス\n\n三、停戰ニ關シテハ遠隔ノ地ニ在ル部隊ニ天皇陛下ノ御命令ヲ充分ニ徹底ヲ期スル要アルヲ以テ停戰ノ實施期日ニ付テハ幾分ノ余裕ヲ置カレ度\n\n四、太平洋ノ離島ニ在ル帝國軍隊ニ對シ必要缺クヘカラサル程度ノ貪糧醫藥品ヲ送付シ及之等離島ヨリ本土ニ傷病兵ヲ輸送スル爲至急聯合國側ニ於テ所要ノ措置ヲ講スルカ又ハ我方ニ對シ便官ヲ供與セラレ度", "notes": ["〔編注〕 전송 번호 등으로 보아 제356호의 실제 발전 시간은 오전 11시경이었던 것으로 생각된다. — 지면에 「本省 8月15日前4時發」 옆에 편자 표시가 붙어 있다.", "영역문 중 「Swizterland」에는 편자가 （Switzerland ヵ）, 「facilitite」에는 （facilitate ヵ）의 방주를 달았다. 원문의 오식을 그대로 두고 편자 주만 병기하였다.", "별전 2의 「遂次」에는 편자가 （逐ヵ）의 방주를 달았다."], "warn": false, "pages": [1936, 1937, 1938, 1939, 1940], "search": "ポツダム宣言受諾に関する日本側希望につき米英ソ中四カ国政府への伝達をスイス政府に依賴方訓令　別電一　昭和二十年八月十五日発東鄕外務大臣より在スイス加瀨公使宛第三五七号　ポツダム宣言受諾に関する日本側希望　二　昭和二十年八月十五日発東鄕外務大臣より在スイス加瀨公使宛第三五八号　右和訳文（編注） 東鄕茂德 도고 시게노리 — 외무대신 加瀨俊一 가세 슌이치 — 주스위스 공사 天皇陛下 천황 폐하 — 쇼와 천황"}, {"id": "d1101", "order": 1101, "date": "1945-08-15", "group": "B", "eyebrow": "문서 1101 · 四 ポツダム宣言の受諾", "title": "포츠담 선언 수락에 관한 일본 측 희망 개진에 관하여 스위스 정부에 예고하라는 훈령", "badge": "第三五九號（緊急、館長符號）", "list_right": "문서 1101", "meta": [{"k": "일자", "v": "1945-08-15", "txt": false}, {"k": "발신", "v": "東鄕外務大臣 도고 시게노리(東鄕茂德) 외무대신", "txt": true}, {"k": "수신", "v": "在スイス加瀨公使 주스위스 가세 슌이치(加瀨俊一) 공사", "txt": true}, {"k": "발착", "v": "本省8月15日前11時發", "txt": false}, {"k": "장소", "v": "本省", "txt": false}, {"k": "전보번호", "v": "第三五九號（緊急、館長符號）", "txt": false}, {"k": "종류", "v": "훈령", "txt": true}], "summary": "별전(제357호)이 다소 늦어지더라도 앞선 전보(제356호)의 취지에 따른 일본 측 희망의 개진을 몇 시간 안에 하고자 한다는 뜻을 미리 스위스 정부에 예고하라는 훈령.", "points": ["왕전 제356호에 관한 후속 지시.", "별전(희망 개진의 본문)이 다소 늦어질 수 있음을 전제.", "그럼에도 앞선 전보 서두의 취지에 따른 우리 쪽 희망의 개진을 몇 시간 안에 하고자 한다는 뜻을 임국 정부에 예고하라는 것.", "참고로 스웨덴(오카모토 공사)에 전전(轉電)하였다."], "primary": "**本省 8월 15일 전 11시 발**\n\n**第三五九號（긴급, 館長符號)**\n\n왕전(往電) 제356호에 관하여\n\n별전은 다소 늦어지더라도, 앞선 전보 서두(冒頭)의 취지에 따른 우리 쪽 희망의 개진(開陳)을 몇 시간 5년 8월 15일 발 주스위스 가세 공사에게서 도고 외무대신 앞 제885호, 위 통고문 / 부기 — 1945년 8월 15일, 위의 화역문(和譯文)", "badge": "第八八四號 / 別電 第八八五號（緊急）", "list_right": "문서 1103", "meta": [{"k": "일자", "v": "1945-08-15", "txt": false}, {"k": "발신", "v": "在スイス加瀨公使 주스위스 가세 슌이치(加瀨俊一) 공사", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 시게노리(東鄕茂德) 외무대신", "txt": true}, {"k": "발착", "v": "ベルン8月15日前4時42分發 / 本省8月16日前8時15分着 — 別電 ベルン8月15日前4時30分發 / 本省8月16日前10時30分着", "txt": false}, {"k": "장소", "v": "ベルン", "txt": false}, {"k": "전보번호", "v": "第八八四號 / 別電 第八八五號（緊急）", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "8월 15일 오전 3시 반 스위스 외무차관이 가세 공사에게, 미국 국무장관이 8월 14일자 제국 정부 통고를 포츠담 선언 및 11일자 4국 회답에 대한 완전한 수락으로 인정하고 미국 대통령의 명에 의해 별전 제885호의 「메시지」(정전 실시 지시)를 제국 정부에 전달하도록 의뢰하였다고 전하며 즉시 본국에 타전할 것을 요구한 건.", "points": ["8월 15일 오전 3시 반, 스위스 외무차관이 가세 공사를 불러 전달.", "미국 국무장관은 주미 스위스 공사에게, 14일자 제국 정부 통고를 「포츠담」 선언 및 11일자 4국 회답에 대한 **완전한 수락**으로 인정한다고 전했다. 일본 측 수락이 최종 확인된 대목이다.", "미국 대통령의 명에 의해 별전 제885호의 「메시지」를 제국 정부에 전달하도록 의뢰, 즉시 제국 정부에 전보할 것을 요구.", "메시지 1항이다. 일본군 군사행동의 신속한 정지를 지령하고 연합국 최고사령관에게 정전 실시 일시를 통보할 것.", "메시지 2항이다. 일본 군대 및 사령관(복수)의 배치 정보를 지니고, 연합국 최고사령관과 그 동행 부대가 정식 항복 수리를 위해 지정 지점에 도착할 수 있도록 최고사령관이 지령하는 협의를 할 충분한 권한을 부여받은 사자(복수)를 즉시 최고사령관에게 파견할 것.", "메시지 3항이다. 항복의 수리 및 그 실시를 위해 더글러스 맥아더 원수가 연합국 최고사령관에 임명되었으며, 정식 항복의 시각·장소·기타 상세 사항을 일본 정부에 통보할 것임.", "영문 원문(제885호)과 외무성의 화역문(부기)이 함께 실려 있다.", "본성 착전은 8월 16일이다. 제884호가 오전 8시 15분, 별전 제885호가 오전 10시 30분으로, 본전보다 별전이 늦게 도착했다."], "primary": "**ベルン 8월 15일 전 4시 42분 발**\n\n**本省 8월 16일 전 8시 15분 착**\n\n**第八八四號**\n\n15일 오전 3시 반 외무차관은 본사(本使)에 대하여, 미국 국무장관이 주미 스위스 공사에게 「14일자 제국 정부 통고는 「포츠담」 선언 및 11일자 4국 회답에 대한 완전한 수락으로 인정하며, 미국 대통령의 명에 의하여 별전 제885호의 「메시지」를 제국 정부에 전달하도록 의뢰한다」는 뜻을 전하고, 즉시 제국 정부에 전보할 것을 요구하였다.\n\n---\n\n## （別電）\n\n**ベルン 8월 15일 전 4시 30분 발**\n\n**本省 8월 16일 전 10시 30분 착**\n\n**第八八五號（긴급）**\n\n> You are to proceed as follows:\n>\n> 1. Direct prompt cessation of hostilities by Japanese forces, informing the Supreme Commander for the Allied Powers of the effective date and hour of such cessation.\n>\n> 2. Send emissaries at once to the Supreme Commander for the Allied Powers with information of the disposition of the Japanese forces and commanders and fully empowered to make any arrangements directed by the Supreme Commander for the Allied Powers to enable him and his accompanying forces to arrive at the place designated by him to receive the formal surrender.\n>\n> 3. For the purpose of receiving such surrender and carrying it into effect, General of the Army Douglas MacArthur has been designated as the Supreme Commander for the Allied Powers and he will notify the Japanese Government of the time, place and other details of the formal surrender.\n\n---\n\n## （付記）\n\n**정전 실시 방법에 관한 미국 정부 통고문**\n\n귀방(貴方)은 다음의 조치를 취하기 바란다.\n\n一、일본군 군사행동의 신속한 정지를 지령하고, 연합국 최고사령관에게 위 정전 실시의 일시를 통보할 것\n\n二、일본 군대 및 사령관(복수)의 배치에 관한 정보를 지니고, 또한 연합국 최고사령관 및 그 동행하는 군대가 정식 항복 수리를 위하여 연합국 최고사령관이 지시하는 지점에 도착할 수 있도록 연합국 최고사령관이 지령하는 협의(打合)를 할 충분한 권한을 부여받은 사자(使者, 복수)를 즉시 연합국 최고사령관에게 파견할 것\n\n三、항복의 수리 및 이의 실시를 위하여 「더글러스 맥아더」 원수가 연합국 최고사령관에 임명되었는바, 동 원수는 정식 항복의 시각·장소 및 기타 상세 사항에 관하여 일본 정부에 통보할 것임", "secondary": "1103昭和20年8月15日東鄕外務大臣宛（電報）在スイス加瀨公使より米国政府より日本側のポツダダ宣言受諾通告の承認及び停戰実施に関する通告文への回答要求について\n\n別電昭和二十年八月十五日發在スイス加瀨公使より東鄕外務大臣宛第八八五号\n\n右通告文\n\n付記昭和二十年八月十五日\n\n右和訳文\n\nベルン8月15日前4時42分發\n\n本省8月16日前8時15分着\n\n第八八四號\n\n十五日午前三時半外務次官ハ本使ニ對シ米國國務長官ハ在米瑞西公使ニ對シ十四日附帝國政府通告ハ「ポツダム」宣言竝ニ十一日附四國囘答ニ對スル完全ナル受諾ト認メ米國大統領ノ命ニ依リ別電第八八五號ノ「メツセージ」ヲ帝國政府ニ傳達方依賴セル旨ヲ傳ヘ直ニ帝國政府ニ電報方ヲ求メタリ\n\n（別電）\n\nベルン8月15日前4時30分發\n\n本省8月16日前10時30分着\n\n第八八五號（緊急）\n\n□ouaretoproceedasfollows:\n\n1.v Direct prompt cessation of hostilities by Japanese forces, informing the Supreme Commander for the Allied Powers of the effective date and hour of such cessation.\n\n2.v Send emissaries at once to the Supreme Commander for the Allied Powers with information of the disposition of the Japanese forces and commanders and fully empowered to make any arrangements directed by the Supreme Commander for the Allied Powers to enable him and his accompanying forces to arrive at the place designated by him to receive the formal surrender.□.v For the purpose of receiving such surrender and carrying it into effect, General of the Army Douglas MacArthur has been designated as the Supreme Commander for the Allied Powers and he will notify the Japanese Government of the time, place and other details of the formal surrender.（付記）\n\n停戰實施方ニ關スル米國政府通告又\n\n貴方ハ左ノ措置ヲトラレタシ\n\n一、日本軍軍事行動ノ速急ナル停止ヲ指令シ聯合國最高司令官ニ右停戰實施ノ日時ヲ通報スルコト\n\n二、日本軍隊及司令官（複數）ノ配置ニ關スル情報ヲ有シ且聯合國最高司令官及其ノ同行スル軍隊カ正式降服受理ノ爲聯合國最高司令官ノ指示スル地點ニ到着シ得ル樣聯合國最高司令官ノ指令スル打合ヲ爲スヘキ充分ノ權限ヲ與ヘラレタル使者（複數）ヲ直ニ聯合國最高司令官ノ許ニ派道スルコト\n\n三、降服ノ受理及之カ實施ノ爲「ダグラス、マッカーサー」元帥カ聯合國最高司令官ニ任命セラレタル處同元帥ハ正式降服ノ時、場所及其他詳細事項ニ關シ日本政府ニ通報スヘシ", "notes": ["「付記　昭和二十年八月十五日　右和訳文」 — 부기는 별전 제885호 영문에 대한 외무성의 화역문이다.", "화역문의 「（複數）」는 영문의 emissaries·commanders가 복수형임을 옮긴이(외무성)가 명시한 것으로, 원문 그대로 두었다."], "warn": false, "pages": [1940, 1941, 1942], "search": "米国政府より日本側のポツダム宣言受諾通告の承認及び停戦実施に関する通告文への回答要求について　別電　昭和二十年八月十五日発在スイス加瀨公使より東鄕外務大臣宛第八八五号　右通告文　付記　昭和二十年八月十五日　右和訳文 加瀨俊一 가세 슌이치 — 주스위스 공사 東鄕茂德 도고 시게노리 — 외무대신 ダグラス、マッカーサー 더글러스 맥아더(Douglas MacArthur) — 연합국 최고사령관 外務次官 스위스 외무차관 — 성명 미기재"}, {"id": "d1104", "order": 1104, "date": "1945-08-16", "group": "A", "eyebrow": "문서 1104 · 四 ポツダム宣言の受諾", "title": "스위스 정부에 대하여 포츠담 선언 수락에 관한 일본 측 희망의 전달을 의뢰한 건에 관하여", "badge": "第八九七號（緊急、館長符號）", "list_right": "문서 1104", "meta": [{"k": "일자", "v": "1945-08-16", "txt": false}, {"k": "발신", "v": "在スイス加瀨公使 주스위스 가세 슌이치(加瀨俊一) 공사", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 시게노리(東鄕茂德) 외무대신", "txt": true}, {"k": "발착", "v": "ベルン8月16日後7時20分發 / 本省8月17日前10時45分着", "txt": false}, {"k": "장소", "v": "ベルン", "txt": false}, {"k": "전보번호", "v": "第八九七號（緊急、館長符號）", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "가세 공사가 8월 16일 오후 6시 스위스 외무차관을 방문하여 제357호의 신입 전달을 의뢰하고, 아울러 도고 외상의 훈령 취지에 따라 여러 점에 관하여 스위스 정부의 알선을 희망해 두었다고 보고한 건.", "points": ["귀전 제356호 및 관계 전보에 대한 회보다. 이 묶음(포츠담 선언 수락)의 마지막 문서다.", "8월 16일 오후 6시 외무차관을 왕방(往訪), 귀전 제357호의 신입(일본 측 희망) 전달을 의뢰.", "아울러 귀전의 취지에 따라 여러 점에 관하여 스위스 정부의 알선을 희망해 두었음.", "제357호가 당일 오후에야 접수되어 지연을 보게 되었다는 해명(괄호 안).", "스웨덴에 전전(轉電)하였다."], "primary": "**ベルン 8월 16일 후 7시 20분 발**\n\n**本省 8월 17일 전 10시 45분 착**\n\n**第八九七號（긴급, 館長符號)**\n\n귀전(貴電) 제356호 및 관계 전보에 관하여\n\n16일 오후 6시 외무차관을 왕방(往訪)하여 귀전 제357호의 신입(申入)의 전달을 의뢰함과 아울러, 귀전의 취지에 따라 여러 점에 관하여 스위스 정부의 알선을 희망해 두었다.\n\n(또한 귀전 제357호는 오늘 오후에 접도(接到)하였기 때문에 지연을 보게 된 터이다.)\n\n스웨덴에 전전(轉電)하였다.", "secondary": "11049昭和20年8月16日東鄕外務大臣宛（電報）在スイス加瀨公使よりスイス政府に対しポツダダ宣言受諾に関する\n\n日本側希望伝達方依賴について\n\nベルン8月16日後7時20分發本省8月1g日前10時45分着\n\n第八九七號（緊急、館長符號）貴電第三五六號及關係電報ニ關シ十六日午後六時外務次官ヲ往訪貴電第三五七號ノ申入傳達方依賴スルト共ニ貴電御趣旨ニ依リ種々ノ點ニ付瑞西政府ノ幹旋方希望シ置キタリ\n\n（尙貴電第三五七號本日午後接到セル爲遲處ヲ見タル次第ナリ）\n\n瑞典ヘ轉電セリ", "notes": [], "warn": false, "pages": [1942], "search": "スイス政府に対しポツダム宣言受諾に関する日本側希望伝達方依賴について 加瀨俊一 가세 슌이치 — 주스위스 공사 東鄕茂德 도고 시게노리 — 외무대신 外務次官 스위스 외무차관 — 성명 미기재"}]</script>
