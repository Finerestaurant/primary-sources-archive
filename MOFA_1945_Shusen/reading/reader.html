하다", "영국 신문은 소련의 대일 태도에 관해 결정을 보지 못한 점에 관해서는 가볍게 언급하고 있을 뿐인데, 일본에 관해서는 3국 간에 협정을 보았다 하더라도 군사적 이유로 이를 발표할 수 없음은 당연하며, 군사상의 중요 문제에 관해 토의했다는 「코뮈니케」의 문구는 대일전이 철저히 토의되었음을 보여 주는 것이라고 보는 자가 많다", "대일전에 관해 영미군 수뇌부 간에 협의가 행해졌다는 영미 공동성명에 관련하여, 영국 외무성원은 대일전이 지금으로서는 영미만에 관계되는 것이므로 그 성명은 「포츠담」에서 발표를 보지 못한 것이며, **소련이 대일전에 참가하지 않을 것이라는 결론을 그 성명에서 끌어낼 수는 없다**는 취지를 말하고 있다", "三、워싱턴 5일발 「로이터」 전보는, 「포츠담」에서 소련 측이 북아프리카(北阿)의 이탈리아 식민지에 관해 소련을 포함하는 국제 공동관리 및 「몽트뢰」 협약 개정에 관해 중대 제의를 내놓았고, 또 영국 측이 「이란」 철퇴 문제를 제의하였으나 모두 해결을 보지 못하고 금후의 교섭으로 미루게 되었다고 보도하고 있다"], "primary": "**스톡홀름 8월 7일 후 5시 30분 발**\n\n**본성 8월 11일 전 8시 00분 착**\n\n**제515호**\n\n「포츠담」 회담의 반향을 종합하건대 다음과 같음.\n\n一、미국에서는 일반적으로 「포츠담」 회담에서 독일 처리에 관하여 영·미·소 3국이 의견의 일치를 본 것에 만족을 표하고 있으나, 일부에는 영미가 소련의 요구를 거의 전부 승인한 것을 비난하는 소리가 있다. 「시카고 트리뷴」은 「포츠담」에서 승리를 얻은 것은 소련뿐이라고 평하였고, 파리(巴里)의 「오(ㄴ)레고니안」은 마치 소련을 유일한 전승국으로 삼고 이와 가혹한 강화(媾和)조약을 맺은 듯한 관이 있다고 논하였으며, 다시 상원의원 「태프트」는 독일 영토의 폴란드(波蘭) 편입은 제3차 대전의 원인이 될 가능성이 있다고 논하고 있다. 또 회담 「코뮈니케」가 대일전에 관하여 아무것도 언급하고 있지 아니한 점에 불만을 표하는 자가 많아, 화부(華府, 워싱턴) 「포스트」는 이것이 이번 회담의 중대 결함이라고 논하고 있다. 다만 「스탈린」이 이탈리아(伊太利)의 대일 참전을 상찬(賞揚)할 것을 시사하는 듯한 「코뮈니케」에 조인한 것은 소련이 대일 중립정책에 무게를 두지 아니하게 되었다는 증좌라고 보는 자가 있으며, 소련은 결국 최후의 단계에서 대일전에 참가할 것이라고 보는 쪽이 많은 듯하다.\n\n二、영국에서도 일반적으로 만족을 표하고 있으나, 「포츠담」 결정의 결과 소련이 유럽 대륙을 제패(制□)하게 될 것을 위구하는 자가 있다. 다시 폴란드·「체코슬로바키아」 및 헝가리(洪牙利)에 거주하는 약 700만 독일인의 독일 내 이주는 이미 경제적으로 피폐한 독일에 다시 무거운 짐을 지워 우려할 만한 결과를 가져올 우려가 있다 하여 이를 비난하는 소리가 있다. 다시 「코뮈니케」에 언급되어 있지 아니한 현실의 제 문제에 관하여는 3국 간에 의견 일치를 보기에 이르지 못한 결과 구체적 문제의 처리에 있어 의견의 상위(相違)를 보게 되지 않겠는가 위구하여, 「포츠담」 회담이 성공이었는지 여부는 금후의 추이에 따라 판단할 수밖에 없다고 보는 자가 많으며, 소련의 대영미 양보로 보이는 「발칸」 제국(諸國)의 쇄국주의 해제에 관하여도 회의(懷疑)의 눈으로 보는 자가 적지 않은 듯하다. 영국 신문은 소련의 대일 태도에 관하여 결정을 보지 못한 점에 관하여는 가볍게 언급하고 있을 뿐이나, 일본에 관하여는 3국 간에 협정을 보았다고 하더라도 군사적 이유에 의하여 이를 발표할 수 없음은 당연하며, 군사상의 중요 문제에 관하여 토의하였다는 「코뮈니케」의 문구는 대일전이 철저히 토의되었음을 보여 주는 것이라고 보는 자가 많고, 대일전에 관하여 영미군 수뇌부 간에 협의가 행하여졌다는 영미 공동성명에 관련하여 영국 외무성원은, 대일전이 지금으로서는 영미만에 관계되는 까닭에 위 성명은 「포츠담」에서 발표를 보지 못한 사정이며, 소련은 대일전에 참가하는 일이 없을 것이라는 결론을 위 성명으로부터 끌어낼 수는 없다는 취지를 말하고 있다.\n\n三、워싱턴 5일발 「로이터」 전보는, 「포츠담」에서 소련 측으로부터 북아프리카(北阿)의 이탈리아 식민지에 관하여 소련을 포함하는 국제 공동관리 및 「몽트뢰」 협약 개정에 관하여 중대 제의를 내놓았고, 또 영국 측으로부터 「이란」 철퇴 문제를 제의하였으나, 어느 것이나 해결을 보지 못하고 금후의 교섭으로 미루게 되었다고 보도하고 있다.", "secondary": "10849昭和20年8月7日東鄕外務大臣宛（電報）在スウエーデン岡本公使よりポツダダ会談の連合国側における反響について\n\nストックホルム8月7日後5時30分發\n\n本省8月11日前8時00分着\n\n第五一五號\n\n「ポツダム」會談ノ反響ヲ綜合スルニ左ノ通リ\n\n一、米國ニ於テハ一般ニ「ポツダム」會談ニ於テ獨逸處理ニ關シ英米蘇三國カ意見ノ一致ヲ見タルコトニ滿足ヲ表シ居ルモ一部ニハ英米カ蘇聯ノ要求ヲ殆ト全部承認セルヲ非難スル聲アリ「シカゴ、トリビユーン」ハ「ポツダム」ニ於テ勝利ヲ得タルハ蘇聯ノミナリト評シ円里「オンレゴニアン」ハ恰モ蘇聯ヲ唯一ノ戰勝國トシ之ト苛酷ナル□和條約ヲ結ヒタルヤノ觀アリト論シ更ニ上院議員「タフト」ハ獨逸領土ノ波蘭編入ハ第三次大戰ノ原因トナル可能性アリト論シ居レリ又會談「コンミユニケ」カ對日戰ニ關シ何等觸レ居ラサル點ニ不滿ヲ表スルモノ多ク華府「ポスト」ハ右ハ今次會談ノ重大缺陷ナリト論シ居レリ伯シ「スターリン」カ伊太利ノ對日參戰ヲ嘗揚スルコトヲ示唆スル如キ「コンミユニケ」ニ調印セルハ蘇聯カ對日中立政策ニ重キヲ置カサルニ到レル證左ナリト見ルモノアリ蘇聯ハ結局最後ノ段階ニ於テ對日戰ニ參加スヘシト見ル向キ多キカ如シ\n\n二、英國ニ於テモ一般ニ滿足ヲ表シ居ルモ「ポツダム」決定ノ結果蘇聯カ歐洲大陸ヲ制□スルニ到ルコトヲ危惧スルモノアリ更ニ波蘭「チエツコスロバキア」及洪牙利ニ居仕スル約七百萬ノ獨逸人ノ獨逸内移仕ハ旣ニ經濟的ニ疲弊セル獨逸ニ更ニ重荷ヲ貝ハシメ憂フ可キ結果ヲ齎ラス惧レアリトテ之ヲ非難スル聲アリ更ニ「コンミユニケ」ニ觸レ居ラサル現實ノ諸問題ニ付テハ三國間ノ意見一致ヲ見ルニ至ラサリシ結果具體的問題ノ處理ニ當リ意見ノ相遲ヲ見ルニ非スヤト危惧シ「ポツダム」會談カ成功ナリシヤ否ヤハ今後ノ成行ニ依リ判斷スル外ナシト見ルモノ多ク蘇聯ノ英米ニ對スル讓步ト見ラルル「バルカン」諸國ノ鎭國主義解除ニ付テモ懷疑ノ眼ヲ以テ見ルモノ鮮カラサルカ如シ英國新聞ハ蘇聯ノ對日態度ニ付決定ヲ見サリシ點ニ關シテハ輕ク觸レ居ルノミナルカ日本ニ關シテハ三國間ニ協定ヲ見タリトスルモ軍事的理由ニ依リ之ヲ發表シ得サルハ當然ニシテ軍事上ノ重要問題ニ付討議セリトノ「コンミユニケ」ノ又句ハ對日戰カ徹底的ニ討議サレタルコトヲ示スモノナリト見ルモノ多ク對日戰ニ付英米軍首膽部間ニ協議行ハレタリトノ英米共同聲明ニ關聯シ英國外務省員ハ對日戰カ今ノ處英米ノミニ關スルニ依リ右聲明ハ「ポツダム」ニ於テ發表ヲ見サリシ次第ニシテ蘇聯ハ對日戰ニ參加スルコトナカルヘシトノ結論ヲ右聲明ヨリ引出スコトヲ得ストノ趣旨ヲ述ヘ居レリ\n\n三、華盛頓五日發「ロイター」電ハ「ポツダム」ニ於テ蘇聯側ヨリ北阿ニ於ケル伊太利植民地ニ關シ蘇聯ヲ含ム國際共同管理及「モントルー」協約改訂ニ關シ重大提議ヲ持出シ又英國側ヨリ「イラン」撤退問題ヲ提議シタルカ執レモ解決ヲ見ス今後ノ交涉ニ讓ルコトトナレリト報シ居レリ", "notes": [], "warn": true, "pages": [1905, 1906], "search": "ポツダム会談の連合国側における反響について 岡本季正 오카모토 스에마사 (주스웨덴 공사) 東鄕茂德 도고 시게노리 (외무대신) 「スターリン」 스탈린 「タフト」 태프트 (미국 상원의원)"}, {"id": "d1085", "order": 1085, "date": "1945-08-09", "group": "A", "eyebrow": "문서 1085 · 四 ポツダム宣言の受諾", "title": "포츠담 선언 수락에 관한 의견 구신", "badge": "第八六五號（館長符號、緊急）", "list_right": "문서 1085", "meta": [{"k": "일자", "v": "1945-08-09", "txt": false}, {"k": "발신", "v": "在スイス加瀨公使 주스위스 가세 슌이치 공사", "txt": true}, {"k": "수신", "v": "東鄕外務大臣 도고 외무대신", "txt": true}, {"k": "발착", "v": "ベルン8月9日後11時30分發 / 本省8月11日前2時30分着", "txt": false}, {"k": "장소", "v": "ベルン 베른", "txt": false}, {"k": "전보번호", "v": "第八六五號（館長符號、緊急）", "txt": false}, {"k": "종류", "v": "전보", "txt": true}], "summary": "소련 참전 당일, 가세 공사가 결국 7월 26일의 3국 선언을 붙잡아 대결심에 나서 최악의 사태를 회피하면서 수습을 도모하는 것이 유구한 국운을 위해 절대 필요한 일이라고 확신한다고 진언한 짧은 긴급 전보. 다음 날 합 제647호의 항복 제의가 나간다.", "points": ["일찍이 여쭈었던 바이기는 하나(豫テ伺ハレタルコト乍ラ), 소련의 참전을 보기에 이르러 정부의 고심은 헤아리고도 남음이 있다", "결국 7월 26일의 3국 선언을 붙잡아 대결심에 나서시어(大決心ニ出テラレ) 최악의 사태를 회피하면서 수습을 도모하실 것", "그것이 유구한 국운을 위하여 절대 필요한 일이라고 확신한다"], "primary": "**베른 8월 9일 후 11시 30분 발**\n\n**본성 8월 11일 전 2시 30분 착**\n\n**제865호（관장부호, 긴급）**\n\n일찍이 여쭈었던 바이기는 하오나, 소련의 참전을 보기에 이르러 정부의 어고심(御苦心)은 헤아리고도 남음이 있는 바, 결국 7월 26일의 3국 선언을 붙잡아 대결심에 나서시어 최악의 사태를 회피하면서 수습(拾收)을 도모하시는 것이 유구한 국운(國運)을 위하여 절대 필요한 일이라고 확신합니다.", "secondary": "1085昭和20年8月9日東鄕外務大臣宛（電報）在スイス加瀨公使よりポツダダ宣言受諾に関する意昇具申\n\nベルン8月9日後11時30分發\n\n本省8月11日前2時30分着\n\n第八六五號（館長符號、緊急）\n\n豫テ伺ハレタルコト乍ラ蘇聯ノ參戰ヲ見ルニ至リ政府ノ御苦心察スルニ餘リアル處結局七月二十六日ノ三國宣言ヲ捉ヘ大決心ニ出テラレ最惡事態ヲ囘避シツツ拾收ヲ計ラルルコト悠久ナル國連ノ爲絕体必要事ト確信ス\n\n東鄕外務大臣より", "notes": [], "warn": false, "pages": [1906, 1907], "search": "ポツダム宣言受諾に関する意見具申 加瀨俊一 가세 슌이치 (주스위스 공사) 東鄕茂德 도고 시게노리 (외무대신)"}, {"id": "d1086", "order": 1086, "date": "1945-08-10", "group": "C", "eyebrow": "문서 1086 · 四 ポツダム宣言の受諾", "title": "포츠담 선언 수락에 관한 신청서를 미·영·중·소 4개국에 전달하도록 주재국에 의뢰할 것을 명한 훈령", "badge": "合第六四七號（緊急） / 別電一 合第六四八號（緊急） / 別電二 合第六四九號（緊急）", "list_right": "문서 1086", "meta": [{"k": "일자", "v": "1945-08-10", "txt": false}, {"k": "발신", "v": "東鄕外務大臣 도고 시게노리(東鄕茂德) 외무대신", "txt": true}, {"k": "수신", "v": "在スイス加瀨公使、在スウエーデン岡本公使宛 — 주스위스 가세 슌이치(加瀨俊一) 공사, 주스웨덴 오카모토 스에마사(岡本季正) 공사 앞", "txt": true}, {"k": "발착", "v": "本省8月10日前6時45分發（본전 합 제647호） / 本省8月10日前9時00分發（별전 합 제648호·합 제649호）", "txt": false}, {"k": "장소", "v": "本省（외무성 본성, 도쿄）", "txt": false}, {"k": "전보번호", "v": "合第六四七號（緊急） / 別電一 合第六四八號（緊急） / 別電二 合第六四九號（緊急）", "txt": false}, {"k": "종류", "v": "훈령(전보) — 별전 2건 및 조약국 부기 3건 첨부", "txt": true}], "summary": "1945년 8월 10일 오전 6시 45분, 도고 외상이 주스위스 가세 공사와 주스웨덴 오카모토 공사에게 「천황의 국가통치의 대권을 변경하라는 요구를 포함하고 있지 않다는 것의 양해 하에」 포츠담 선언을 수락한다는 제국 정부의 통첩을, 스위스 공사는 미국·중국에, 스웨덴 공사는 영국·소련에 각각 주재국 정부를 통하여 최속으로 전달하도록 신청하라고 훈령한 전보이며, 신청서 본문(합 제648호)·그 영역문(합 제649호)과 조약국이 작성한 포츠담 선언 검토 3건이 부기되어 있다.", "points": ["본전 합 제647호(8월 10일 오전 6시 45분 발)다. 「전쟁의 참화에서 인류를 구하고자 하시는 大御心에 부응해 받들고자」 제국 정부는 스위스·스웨덴 양국 정부에 제국 정부의 의도를 주요 교전국에 전달할 것을 의뢰하는 한편, 재경 소련 대사를 통하여 직접 소련 정부에도 그 취지를 전달하기로 결정하였다.", "채널 분담이 명시된다. 주스위스 공사는 미국 정부 및 중국(지나) 정부에, 주스웨덴 공사는 영국 정부 및 소련 정부에 전달한다. 전달과 함께 상대방의 조속한 회답을 얻도록 알선할 것을 각각 주재국 정부에 신청하고 결과를 대지급으로 회전하라.", "별전 합 제648호(오전 9시 00분 발)다. 신청서 본문이다. 소련에 알선을 의뢰하였으나 결실을 보지 못하였음을 서술한 뒤, 「7월 26일 미·영·중 3국 수뇌에 의하여 공동으로 결정 발표되고 그 후 소련방 정부의 참가를 본 대본방 공동선언에 열거된 조건 중에는 天皇ノ國家統治ノ大權ヲ變更スルノ要求ヲ包含シ居ラサルコトノ了解ノ下ニ 제국 정부는 위 선언을 수락한다」고 한다.", "같은 별전은 이어서 「제국 정부는 위 양해에 잘못이 없이 귀국 정부가 그 뜻의 명확한 의사를 조속히 표명하기를 절망(切望)한다」고 하여, 양해에 대한 상대방의 명시적 확인을 요구한다.", "별전 합 제649호는 위 신청서의 영역문이다. 조건절은 with the understanding that the said Declaration does not comprise any demand which prejudices the prerogatives of His Majesty as a sovereign ruler 로 옮겨져 있어, 일본문의 「國家統治ノ大權ヲ變更スルノ要求」와 영문의 prejudices the prerogatives 사이에 진폭이 있다.", "부기 (1) 조약국 제1과 「미·영·중 「포츠담」 선언의 검토」(8월 9일)다. 선언 전체를 전문 5항·본문 8항으로 나누고, 「무조건항복」이라는 말이 오직 제8항의 「일본국 군대의 무조건항복」 한 군데에만 쓰였음에 주목하여, 이번 선언은 무조건항복 조항의 부과가 아니라 실질적으로 사전에 조건을 제시한 화평 권고라고 판정한다.", "같은 부기의 제3관 영토조항(제8항) 해석이 이 문서의 핵심이다. 「「카이로」 선언의 제조항은 실시될 것이며 일본국의 주권은 혼슈·홋카이도·규슈 및 시코쿠와 우리가 지정하는 제소도에 한정된다」를 받아, 카이로 선언 소급 적용의 네 항목을 イ 태평양 제도서의 박탈, ロ 만주·대만·팽호도의 중화민국 반환, ハ 폭력 및 탐욕으로 약취한 기타 일체 지역으로부터의 구축, ニ 「조선은 이를 「자유롭고 또한 독립된 것이 되게 한다」는 것으로 되어 있다」로 정리한다.", "조약국은 「위 중 ロ 및 ニ의 영토의 처분에 대하여는 의문이 없으나 イ 및 ハ에 속하는 지역의 처분 방법에 대하여는 「카이로」 선언도 이번 선언도 이를 명확히 하고 있지 않다」고 하여, 조선의 독립과 만주·대만의 반환은 다툼의 여지가 없는 확정 사항으로 읽었다. 반면 사할린(가라후토) 남반의 운명은 「전연 불명」이며 「고의로 규정을 회피한 것으로 해석할 수밖에 없다」고 한다.", "부기 (2) 조약국 「「크리미아」 선언과 「포츠담」 선언의 비교 검토」(8월 14일)다. 크리미아 선언이 독일 정부를 전연 무시한 데 반해 포츠담 선언은 오히려 일본 정부를 상대로 하는 호소로서 일본 정부를 행동의 주체로 인정하며, 점령도 전면적 점령이 아니라 「지점」의 부분적 보장점령이라고 본다.", "부기 (3) 조약국 제1·제2과 「전투정지에의 과정에서의 제문제에 대하여」(8월 11일)다. 만일 상대방이 아측이 붙인 양해사항을 거부해 올 경우 아측의 포츠담 선언 수락은 해소되고 다시 수락 전의 백지 상태로 돌아가는 것으로 보지 않을 수 없다고 하여, 조건부 수락의 법적 성격을 못박는다.", "같은 부기는 무조건항복 선언의 주체(정부냐 통수부냐)와 형식, 전투정지의 시기와 형식, 군사적 조항과 비군사적 조항의 분리 처리를 검토하고, 「순군사적 사항 이외는 상대방의 신청을 기다려 순서를 좇아 되도록 서서히 행하는 것이 유리하다」고 결론짓는다."], "primary": "## 〔편자 머리〕\n\n1086 쇼와 20년 8월 10일 도고 외무대신으로부터 주스위스 가세 공사, 주스웨덴 오카모토 공사 앞 (전보)\n\n**포츠담 선언 수락에 관한 신청서를 미·영·중·소 4개국에 전달하도록 주재국에 의뢰할 것을 명한 훈령**\n\n- 별전 1 — 쇼와 20년 8월 10일 발, 도고 외무대신으로부터 주스위스 가세 공사, 주스웨덴 오카모토 공사 앞 합 제648호. 위 신청서.\n- 별전 2 — 쇼와 20년 8월 10일 발, 도고 외무대신으로부터 주스위스 가세 공사 앞 합 제649호. 위 신청서 영역문(英譯文).\n- 부기 1 — 쇼와 20년 8월 9일자, 조약국 제1과 작성 「米、英、支「ポツダム」宣言ノ檢討」\n- 부기 2 — 쇼와 20년 8월 14일자, 조약국 작성 「「クリミヤ」宣言ト「ポツダム」宣言トノ比較檢討」\n- 부기 3 — 쇼와 20년 8월 11일자, 조약국 제1과·동 제2과 작성 「戰鬪停止ヘノ過程ニ於ケル諸問題ニ付テ」\n\n---\n\n## 본전 — 합 제647호 (긴급)\n\n**본성 8월 10일 오전 6시 45분 발**\n\n전쟁의 참화로부터 인류를 구하고자 하시는 大御心에 부응해 받들고자, 제국 정부는 스위스국 정부 및 스웨덴국 정부에 대하여 별전 합 제648호(그 영역문은 또한 별전 합 제649호)와 같이 제국 정부의 의도를 주요 교전국에 대하여 전달할 것을 의뢰하는 한편, 재경 소련 대사를 통하여 직접 소련 정부에 대하여 위 취지를 전달할 것으로 결정하였다.\n\n따라서 주스위스 공사로부터는 미국 정부 및 중국(지나) 정부에 대하여, 주스웨덴 공사로부터는 영국 정부 및 소련 정부에 대하여 가장 신속하게 위 전달을 할 것 □ 아울러 상대방의 조속한 회답을 얻도록 알선할 것을 각각 주재국 정부에 대하여 신청하고, 결과를 대지급으로 회전(囘電)하기 바란다.\n\n본전 및 별전 수신처 — 주스위스 공사, 주스웨덴 공사\n\n---\n\n## 별전 1 — 합 제648호 (긴급)\n\n**본성 8월 10일 오전 9시 00분 발**\n\n제국 정부에서는, 인류를 전쟁의 참화로부터 면하게 하고자 신속히 평화를 초래할 것을 기념(祈念)하시는 천황폐하의 大御心에 따라, 앞서 대동아전쟁에 대하여 중립 관계에 있는 「소비에트」 연방 정부에 대하여 알선을 의뢰하였으나, 불행하게도 위 제국 정부의 평화 초래에 대한 노력은 결실을 보지 못하였다. 이에 제국 정부는 앞에 말한 천황폐하의 평화에 대한 기념(御祈念)에 기하여 즉시 전쟁의 참화를 제거하고 평화를 초래할 것을 바라며 다음과 같이 결정하였다.\n\n제국 정부는, 쇼와 20년 7월 26일 미·영·중 3국 수뇌에 의하여 공동으로 결정 발표되고 그 후 소련방 정부의 참가를 본 대(對)본방 공동선언에 열거된 조건 중에는 천황의 국가통치의 대권을 변경하라는 요구를 포함하고 있지 아니하다는 것의 양해 하에, 제국 정부는 위 선언을 수락한다.\n\n제국 정부는 위 양해에 잘못이 없이 귀국 정부가 그 뜻의 명확한 의사를 신속히 표명하기를 절망(切望)한다.\n\n제국 정부는 〔스위스국 정부 / 스웨덴국 정부〕에 대하여 신속히 위의 경위를 〔미국 정부 및 중국(지나) 정부 / 영국 정부 및 소련방 정부〕에 전달하여 줄 것을 요청하는 영광을 가진다.\n\n〔지면에서는 이 마지막 문단이 중괄호로 묶인 대체 어구로 되어 있다. 스위스 공사 앞에는 「瑞西國政府」와 「米國政府及支那政府」, 스웨덴 공사 앞에는 「瑞典國政府」와 「英國政府及蘇聯邦政府」가 각각 들어간다.〕\n\n---\n\n## 별전 2 — 합 제649호 (긴급) — 英譯文\n\n**본성 8월 10일 오전 9시 00분 발**\n\n〔이하는 일본 측이 스스로 작성한 영역문이므로 번역하지 않고 원문 그대로 둔다.〕\n\nIn obedience to the gracious command of His Majesty the Emperor who, ever anxious to enhance the cause of world peace, desires earnestly to bring about an early termination of hostilities with a view to saving mankind from the calamities to be imposed upon them by further continuation of the war, the Japanese Government asked several weeks ago the Soviet Government, with which neutral relations then prevailed, to render good offices in restoring peace vis-à-vis the enemy Powers. Unfortunately, these efforts in the interest of peace having failed, the Japanese Government, in conformity with the august wish of His Majesty to restore the general peace and desiring to put an end to the untold sufferings entailed by war as quickly as possible, have decided upon the following:\n\nThe Japanese Government are ready to accept the terms enumerated in the Joint Declaration which was issued at Potsdam on July 26th, 1945 by the heads of the Governments of the United States, Great Britain and China, and later subscribed by the Soviet Government, with the understanding that the said Declaration does not comprise any demand which prejudices the prerogatives of His Majesty as a sovereign ruler.\n\nThe Japanese Government hope sincerely that this understanding is warranted and desire keenly that an explicit indication to that effect will be speedily forthcoming.\n\nThe Japanese Government have the honor to request the Government of Switzerland to be good enough to forward immediately the above communications to the Governments of the United States and China.\n\n〔編注〕 합 제649호는 주스웨덴 오카모토 공사 앞으로도 송부되어 있다. 내용은 본전과 거의 같은 글이나, 요청처 국명이 「the Royal Swedish Government」, 전달처가 「the Governments of the Soviet Union and Great Britain」으로 되어 있다.\n\n---\n\n## 부기 (1) — 米、英、支「ポツダム」宣言ノ檢討 (20. 8. 9)\n\n〔쇼와 20년 8월 9일자, 조약국 제1과 작성〕\n\n이번 미·영·중 3국의 「포츠담」 공동선언은 그 내용이 반드시 전부의 점에 대하여 명백하지 아니한바, 위 선언의 표면에 나타나 있고 또는 이면에 잠복해 있는 적측 의도를 될 수 있는 한 명료하게 알아내기 위하여, 「카이로」 선언, 「크리미아」 선언 등과 대비하면서 이의 축조적(逐條的) 검토를 시도하고자 한다.\n\n### 前文 (전문)\n\n이번 선언은 13항으로 이루어지는바, 그 최초의 5항은 선언의 전문을 구성하는 것으로 인정해야 할 것이다. 위 전문에서 적측은 「연합군」의 위력을 과시하고, 독일 완패의 전례를 지적하며, 일본군의 궤멸 및 일본 국토의 황폐(荒癈)의 불가피성을 강조하고, 본 선언 각 조항의 급속하고도 전면적인 수락을 권고한 것으로서, 대개 위협적 언사의 나열에 지나지 않으며, 법률적으로는 반드시 중요성을 부여할 필요가 없다.\n\n다만 전문 제1항에서 「우리는 협의한 끝에 일본국에 대하여 전쟁을 종결할 기회를 공여할 것에 의견이 일치하였다」고 하여 감히 「항복」 또는 「무조건항복」을 권고한다고 말하지 아니한 점, 또 전문 제5항에서 「좌기는 우리의 조건이다」라고 하여 단지 「조건」이라는 말을 쓴 점, 그리고 또 이번 선언 전체를 통하여 「무조건항복」이라는 말을 사용한 것은 오직 한 군데 즉 본문 제8항에서 「일본국 군대의 무조건항복」이라고 하여 「군대」에 대하여만 쓰고 있는 점은, 어느 것이나 주의할 만하다.\n\n이는 적측의 정치적 함축을 나타내는 것으로 해석됨과 동시에, 이번 선언의 법률적 성질에 대하여 의문을 야기시키는 것이다.\n\n원래 「무조건항복의 조건」이라는 말은 그 자체가 모순을 품고 있다. 「크리미아」 선언에서도 「「나치스, 도이치」에 대하여 부과해야 할 무조건항복 조항은 …「도이치」국의 최종적 패배가 달성되기까지는 발표되지 아니할 것이다」라고 되어 있는 것과 같이, 상대국에 대하여 사전에 조건을 제시하는 일 없이 상대국의 무조건항복을 기다려 — 바꾸어 말하면 어떠한 조건을 부과하더라도 상대국이 이를 거부할 능력이 없는 데에 이르기를 기다려 — 비로소 일방적으로 조건을 부과하는 것을 상도(常道)로 한다. 이번 선언은 이와 취지를 달리하는 것으로서, 실질적으로는 사전에 조건을 제시한 화평 권고로 보아야 할 것이다.\n\n다만 적측으로서는 이른바 「일본국의 체면(面子)」을 살려주고자 함과 동시에 국내적 고려의 필요도 있으므로, 전문 말항에서 「우리는 이들 조건으로부터 이탈하는 일이 없을 것이며 또한 다른 선택을 허용하지 않는다. 지연(遲處〔遲延カ〕)을 수락할 수 없다」고 하여, 마치 무조건항복 조항의 부과 또는 최후통첩(通諜〔牒カ〕)적 색채(色採〔彩カ〕)를 부여하고 또 그와 같이 칭하고 있으나, 이는 이번 선언의 성질을 변경하는 것은 아니라고 인정된다.\n\n### 本文 (본문)\n\n이번 선언의 제6항 내지 제13항은 선언의 본문으로 인정해야 할 것으로서, 어느 것이나 이로써 전쟁을 종결시키고자 적측이 원하는 실질적 조건을 기재한다.\n\n#### 제1관 군국주의의 말살\n\n> 「우리는 무책임한 군국주의가 세계로부터 구축(驅遂〔逐カ〕)되지 않는 한 평화, 안전 및 정의의 신질서는 실현 불가능하다는 것을 주장하는 것이므로, 일본국 신민을 기만하여 이를 몰아 세계 정복의 거사에 나서게 한 자의 권력 및 세력은 영구히 말살되지 아니하면 아니 된다」\n\n본항 전단은 적측의 정치적 견해의 표시에 그치며, 법률적으로 의의가 있는 것은 본항 후단이다. 그리고 후단에서 「말살」되어야 할 대상으로서 「권력 및 세력」(authority and influence)이라는 막연한 표현을 쓴 것은 주의할 만하다.\n\n「크리미아」 선언에서는 「「도이치」 군국주의 및 「나치스」주의를 파쇄」하는 목적으로써 독일 군대의 무장 해제 및 해체, 독일 참모본부의 폐절, 일체의 전쟁범죄인의 재판 및 처벌, 「나치스」당 및 「나치스」 법제·조직 및 제도의 일소, 공공 제기관으로부터, 나아가 독일 국민의 문화적 및 경제적 생활로부터 일체의 「나치스」적 및 군국주의적 세력의 철거 등 상세하고 구체적인 조치를 예정하고 있다. 이번 선언 중에는 이에 대응하는 상세한 규정이 결여되어 있어, 본항의 「권력」이 황공하게도 천황을 포함하는 것인지 또는 정부 혹은 군사 당국자를 의미하는 데 그치는 것인지, 또 「세력」이 정당 기타 정치단체·사상단체 혹은 군수기업가·재벌 등도 포함하는 것인지 등 그 범위는 일체 불명확하다.\n\n적어도(尤モ) 「일본국 신민을 기만하여 이를 몰아 세계 정복의 거사에 나서게 한」이라는 자구로부터 판단하면, 본항은 전쟁책임자(war responsibles)라는 의미에서의 전쟁범죄인(국제법상의 전시범죄인과 구별할 것을 요한다)의 처벌을 노린 것으로 해석되며, 그리고 적측 견해에 의하면 전쟁책임자는 독일에서는 「나치스」, 이탈리아에서는 「파시스트」, 일본에서는 군벌로 삼고 있음에 비추어, 본항에 이른바 「권력 및 세력」은 「군사적 권력」 및 「군국주의적 세력」을 의미하는 것으로 일단 협의로 해석하지 못할 바는 아니다. 그러하나 적측 내부에 있어서의 우리 국체(國体)에 관한 논의, 전쟁책임자에 관한 논의 등이 아직 일정하지 아니한 현상에 비추어, 적측으로서는 오히려 장래의 입장이 구속되는 것을 피하려는 의미에서 의식적으로 본항과 같은 막연한 표현을 쓴 것으로 해석함이 타당할 것이다.\n\n#### 제2관 제국 영토의 보장점령\n\n> 「전기 신질서가 건설되고 또한 일본국의 전쟁 기도 능력이 파쇄되었다는 확증을 보기에 이르기까지, 연합국이 지정하는 일본국 영역 내의 제지점(諸地點)은 우리가 이에 제시하는 기본적 목표의 완수를 확보하기 위하여 점령되어야 할 것으로 한다」\n\n본항은 제국 영토의 보장점령에 관한 조항이다.\n\n점령의 범위는 이를 명정(明定)하고 있지 아니하나, 「일본국 영역 내의 제지점」 points(전문〔電文〕에 따라서는 이 말이 탈락되어 있는 것이 있다)라고 되어 있는 이상, 적측은 제국 영토의 광범한 지역의 점령을 의도하지 아니하고 오히려 군사적·정치적 또는 경제적 요점만의 점령에 그치고자 하는 것으로 인정된다. 즉 「크리미아」 선언에서 「…합의된 계획에 기하여 3국의 군대는 「도이치」의 각 분할 지구를 점령할 것이다」라고 정해지고 또한 독일 패전 후 현실로 독일 영토의 전면적 점령이 행해진 것과는 다른 취급을 제국의 경우에는 의도하고 있는 것으로 해석된다.\n\n점령의 목적은 본 선언이 제시하는 「기본적 목표의 완수를 확보하기 위하여」라고 하고 있는바, 위 기본적 목표란 본 선언의 주요 조항 즉 군국주의의 말살, 영토의 변경, 군대의 무장 해제, 전쟁범죄인의 처벌, 산업의 개편 등을 가리키는 것으로 인정된다.\n\n점령의 기간에 대하여는 「전기 신질서가 건설되고 또한 일본국의 전쟁 기도 능력이 파쇄되었다는 확증을 보기에 이르기까지」라고 되어 있는바, 위 기간에 대하여는 후술 제7관(평화적 경향을 가지는 책임 정부의 수립)의 조건을 아울러 고려할 것을 요한다.\n\n#### 제3관 영토조항\n\n> 「…「카이로」 선언의 제조항은 실시될 것이며, 또한 일본국의 주권은 혼슈, 홋카이도, 규슈 및 시코쿠와 우리가 지정하는 제소도(諸小島)에 한정될 것으로 한다」\n\n본항에서 명백한 바와 같이, 적측은 일본 항복의 새벽에는 제국 영토를 혼슈, 홋카이도, 규슈, 시코쿠 및 적측이 지정하는 제소도 minor islands에 한정하고자 하는 것이다. 그 나머지의 제국 영토 및 점령지에 대하여는 이의 규정을 「카이로」 선언에 양보하고 있는바, 「카이로」 선언에 의하면\n\n- イ、「1914년의 제1차 세계전쟁의 개시 이후에 일본국이 탈취하거나 또는 점령한 태평양에 있어서의 일체의 도서」는 이를 박탈하고\n- ロ、「만주, 대만, 팽호도와 같은 일본국이 청국인으로부터 도취(盜取)한 일체의 지역」은 이를 중화민국에 반환하고\n- ハ、「폭력 및 탐욕에 의하여 일본국이 약취한 다른 일체의 지역」(점령지를 의미하는 것일 것이다)으로부터 일본국을 구축(驅遂〔逐カ〕)하고\n- ニ、조선은 이를 「자유롭고 또한 독립된 것이 되게 한다」는 것으로 되어 있다.\n\n위의 가운데 ロ 및 ニ의 영토의 처분에 대하여는 의문이 없으나, イ 및 ハ에 속하는 지역의 처분 방법에 대하여는 「카이로」 선언도 이번 선언도 이를 명확히 하고 있지 아니하다. 다만 상항(桑港, 샌프란시스코) 회의 헌장의 규정에 비추어 보건대, 위 イ의 태평양 제도서는 본항에 의하여 일본국 주권 하에 잔치(殘置)되는 제소도 이외의 도서와 함께 이를 신탁통치령(統領〔治カ〕)으로 하고, 또 ハ의 남방 점령지는 이를 대개 원소유국에 복귀시킨 뒤 「주민의 복지 증진 및 전반적 향상」을 도모하여 「자치 내지 독립」으로 이끌고자 하는 것이 아닌가 하고 추측된다.\n\n이번 선언에 의하여도 전연 불명한 것은 가라후토(樺太) 남반의 운명이다. 가라후토 남반을 일본국 주권의 범위에 두어야 할 지역으로서 본항에 기재하지 아니하였으나, 그렇다고 하여 이를 일본국으로부터 탈취해야 할 지역에도 포함시키고 있지 아니하며, 또 가라후토를 「제소도」 안에 포함시켜 해석하는 것은 무리이므로, 가라후토 남반의 처분에 대하여는 고의로 규정을 회피한 것으로 해석하는 수밖에 없다.\n\n#### 제4관 일본국 군대의 무장 해제\n\n> 「일본국 군대는 완전히 무장을 해제당한 후 각자의 가정에 복귀하여 평화적·생산적 생업을 영위할 기회를 얻게 될 것이다」\n\n본항은 일본국 군대의 처치를 정한 것이다. 전단에서는 단지 일본국 군대의 무장 해제만을 규정하였다. 「크리미아」 선언에서는 독일 군대의 무장 해제 및 해체 외에, 참모본부의 폐절, 군사 시설의 철거 또는 파괴, 군수공업의 제거 또는 관리 등을 규정하였으나, 이번 선언은 이들에 언급하는 바가 없으며 또한 무장 해제에 대하여도 어떠한 방법으로써 이를 행할 것인가를 명확히 하지 아니하였다.\n\n후단은 무장 해제 후에 있어서의 일본국 군대의 취급을 규정하였다. 전쟁 종료 시에는 어떠한 군대라 하더라도 가정에 복귀하여 평소의 생업에 종사해야 할 것은 당연함에도 불구하고 특히 위에 언급한 것은, 우리 장병에 대한 심리적 영향을 노린 정치적 의도 외에, 법률적으로는 제국에 대하여는 독일의 경우와 같이 배상에 대신하는 노동력의 제공이라는 의미로써 병원(兵員)을 적국 내 노무를 위하여 납치해 갈 의도가 없음을 나타내는 것으로도 해석된다.\n\n#### 제5관 일본국 신민의 취급\n\n> 「우리는 일본인을 민족으로서 노예화하려 하거나 또는 국민으로서 파멸시키려 하는 의도를 가지지 아니한다. 적어도(尤モ) 포로를 학대한 자를 포함하는 일체의 전쟁범죄인은 엄중히 재판받아야 할 것으로 한다.\n>\n> 일본국 정부는 일본국 신민 사이에 있어서의 민주주의적 경향의 재생 및 강화를 방해하는 일체의 장애를 제거해야 할 것이며, 언론, 종교 및 사상의 자유와 기본적 인권의 존중을 확립해야 할 것으로 한다」\n\n본관은 적측의 일본국 신민에 대한 태도를 명확히 한 것인바, 제1항은 「트루먼」 대통령 취임 직후의 일본국 신민에 관한 성명을 그대로 채택해 넣은 것으로서, 다만 단서(但書)로서 전쟁범죄인의 처벌을 규정하였다. 여기에 전쟁범죄인의 일례로서 포로 학대자를 들고 있는바, 위로부터 판단하건대 본항은 전기 제1관의 설명에서 서술한 「전쟁책임자」인 권력자 내지 세력자는 물론, 또 이에 해당하지 아니하는 자라 하더라도 국제법 위반 행위가 있었던 「전시범죄인」은 이를 개인으로서 소추할 길을 연 것으로 인정된다.\n\n또한 「크리미아」 선언에서는 「우리들은 …일체의 전쟁범죄인을 재판에 부치고 또한 신속히 처벌할 …결심이다」라고 하여 독일의 전쟁범죄인은 이를 「연합국」 측에서 재판·처벌하는 것이라는 뜻을 명확히 하고 있으나(We are determined to ... bring all war criminals to justice and swift punishment), 본항에서는 어떤 자가 전쟁범죄인을 재판하는 것인가의 주격이 결여되어 있다(justice shall be meted out to all war criminals). 다만 이로써 재판을 일본 측의 손에 의하여 행하게 하려는 것이라고 속단할 수 없음은 물론이며, 결국 재판의 당사자·방법 등은 본항에 의하여는 이를 명확히 할 수 없다.\n\n제2항은 일본국 정부에 대하여 민주주의의 재생·강화와 자유 및 인권의 존중을 확립할 의무를 부과하려는 것인바, 「크리미아」 선언에서는 전기 제1관의 설명 중에 기재한 바와 같이 독일 민주화를 위한 조치는 「연합국」 측에서 이를 실시하는 것으로 되어 있음에 반하여, 본항에서 일본국의 경우는 이를 일본국 정부 자신의 손에 의하여 행하게 하려는 것이다.\n\n또 본항에서 「민주주의적 경향의 재생」이라는 자구를 쓴 것은, 적측에서 일본 국민은 원래 민주주의적 경향을 가졌던 것이라고 하는 견해를 지니고 있음을 증명하는 것에 가깝다.\n\n#### 제6관 일본국 산업의 취급\n\n> 「일본국은 그 국민 경제의 보지(保持) 및 물자에 의한 공정한 배상의 지불을 가능하게 하는 것과 같은 산업을 유지할 것을 허여받을 것이다. 다만(伯シ〔但シ〕) 전쟁을 목적으로 하는 재군비를 가능하게 하는 것과 같은 산업은 이에 한하지 아니한다.\n>\n> 위 목적을 위하여 원료 자원의 입수는 허여될 것이다. 적어도(尤モ) 위 입수는 원료 자원의 지배와는 구별되어야 할 것으로 한다. 일본국은 장래 세계 무역 관계에의 참가를 허여받는 일이 있을 것이다」\n\n본관은 일본국 산업의 취급에 관한 규정이다. 제1항에서 평화 산업의 허여를, 제2항에서 원료 자원의 입수 및 세계 무역에의 참가의 허여를 정한다. 제1항은 이면 해석을 하면 결국 전후 배상의 부과 및 군수 산업의 금절(禁絕)을 의미하는 것이나, 독일에 대한 「크리미아」 선언과 달리 본 선언의 어느 부분에서도 이를 직접 표면으로부터 규정하는 일 없이, 본항에서 문장의 기교(文章ノ綾)에 의하여 오히려 일본 국민에 대한 은혜인 것과 같은 규정으로 삼은 것은 적측의 정치적 고려를 말해주는 것이라 할 것이다. 또한 평화 산업 및 군수 산업의 한계는 본항의 규정만으로는 막연하고 불명확하다.\n\n제2항의 「원료 자원의 지배」란 결국 원료 자원 소재지의 영유 또는 그 개발 기업의 경영을 의미하는 것으로 해석해야 할 것이므로, 이를 금절하는 본항의 규정은 전기 영토조항과 어울려, 제국이 이번 전쟁 발발 후 대륙 및 점령지에서 새로이 착수한 개발 사업은 물론, 만철(滿鐵)을 비롯하여 만주·중국(만지滿支)에서 제국이 가지는 역사적 기업도 또한 그 막대한 투하 자본 및 시설과 함께 일체 이를 박탈하고자 하는 적측 의도를 미루어 알게 하는 것이다. 적어도(尤モ) 그때 위 투하 자본 및 시설의 평가(評價)를 현물 배상 안에 포함시킬 것인가 아닌가의 점은 독일의 경우에 대하여 문제로 되고 있는 것과 마찬가지로 문제가 될 수 있을 것이다.\n\n어느 쪽이든 본항의 「원료 자원의 입수」 access란 결국 외국으로부터의 수입을 의미함에 지나지 아니하며, 그리고 이의 수입이 허여된다 하더라도 수입을 행하기 위하여는 수출로써 결제하는 수밖에 없고, 이는 「세계 무역 관계에의 참가」 없이는 불가능함은 이치의 당연함이다. 따라서 본항도 실질적으로는 원료 자원 지배의 금절을 의미하며 조금도 은혜적 규정이 아니나, 「크리미아」 선언에서 독일의 원료 자원의 입수 또는 세계 무역에의 참가에 언급하는 일이 없는 것에 비하면 그래도 차이가 있다고 하지 아니할 수 없다.\n\n#### 제7관 연합국 점령군의 철수\n\n> 「전 제항의 목적이 달성되고 또한 일본국 신민의 자유로이 표명된 의사에 따라 평화적 경향을 가지는 책임 정부가 수립되기에 이르면, 연합국의 점령군은 즉시 일본국으로부터 철수해야 할 것으로 한다」\n\n본항은 전기 제2관에 의하여 일본국 영토 내의 제지점의 보장점령을 행하는 「연합국」 군대의 철수를 규정하는 것이다. 「크리미아」 선언에서 독일 영토의 점령 및 관리를 상세히 규정하였으나 점령군의 철수에 대하여는 아무것도 언급하는 바가 없는 것과 취지를 달리한다.\n\n또한 본항에서 「평화적 경향을 가지는 책임 정부의 수립」을 철수의 조건으로 삼고 있는 점은 주의를 요한다. 생각건대 본 선언의 제5관 및 제8관에서 일단 현재의 일본국 정부를 행동의 주체로서 인정하고 있으나, 적측에서는 결코 현 정부로써 만족하지 아니하고, 점령군의 철수를 위하여는 그들의 눈으로 보아 「평화적 경향」을 가진다고 인정되는 별개의 정부의 수립을 필요로 한다는 견해를 지니는 것으로 해석해야 하기 때문이다.\n\n#### 제8관 일본국 군대의 무조건항복\n\n> 「우리는 일본국 정부에 대하여 즉시 전 일본국 군대의 무조건항복을 선언하고, 또한 이에 관한 일본국 정부의 신의를 입증하기 위하여 적절 타당한 보장을 제공할 것을 요망한다.\n>\n> 일본국에 남겨진 다른 선택은 급속하고도 완전한 파괴를 받는 한 길이 있을 뿐이다」\n\n본관은 본 선언의 말문(末文)을 이루는 것으로도 보이며 마지막을 다시 위협적 언사로써 맺고 있는바, 실질적으로는 휴전 조건을 규정한 것으로 해석해야 할 것이다. 즉 앞의 제항은 어느 것이나 휴전 조건이라기보다 오히려 전쟁 종결의 새벽에 있어서의 강화 조건의 기초를 이루는 것으로 보이는 데 반하여, 본관 제1항은 「일본국 군대의 무조건항복」의 선언이라 하고 이의 보장의 제공이라 하여, 함께 이로써 전투 종지(cesser le feu)의 직접의 전제로 삼으려는 것으로 보이기 때문이다.\n\n또한 「일본국 군대의 무조건항복」이라는 말을 사용한 점에 대하여는 전문의 설명 중에 언급하였으나, 「카이로」 선언에는 명백히 「일본국의 무조건항복」이라는 말을 사용하고 있으며, 또 「크리미아」 선언에서도 「…「나치스, 도이치」에 대하여 함께 부과해야 할 무조건항복 조항」이라고 말하고 있어, 이번 선언에서 특히 무조건항복의 주체를 군대에 한정한 것은 주목할 만한 바이다.\n\n또 「일본국 정부의 신의를 입증하기 위한 적절 타당한 보장」이란 추상적인 표현으로서, 일본 측이 「적절 타당」하다고 인정하더라도 적측에서 불만족하게 여기는 일이 있을 수 있음을 유의할 필요가 있다.\n\n---\n\n## 부기 (2) — 「クリミヤ」宣言ト「ポツダム」宣言トノ比較檢討 (쇼 20. 8. 14)\n\n〔쇼와 20년 8월 14일자, 조약국 작성〕\n\n금년 2월의 대(對)독일 「크리미아」 선언과 이번 대(對)일본 「포츠담」 선언을 비교하건대, 양자는 어느 것이나 전쟁 종결 전에 적측의 독일 또는 일본에 대한 처리 방침을 선명(宣明)한 것이라는 점에서 공통성이 있으나, 그 내용을 자세히 검토하건대 양자 사이에는 그래도 현저한 차이가 있음이 인정된다.\n\n### 一、건전(建前, 원칙·표방) 상의 차이\n\n첫째로 양자 사이에는 건전상의 차이가 있다. 건전상의 차이는 다음 두 점에 대하여 존재한다.\n\n(一) 원래 「무조건항복의 조건」이라는 말은 그 자체가 모순을 품고 있는 것인바, 「크리미아」 선언에서는 「…「나치스」 독일에 대하여 부과해야 할 무조건항복 조항은 …「도이치」국의 최종적 패배가 달성되기까지는 발표되지 아니할 것이다」라고 하여, 독일에 대한 조건은 독일의 무조건항복을 기다려 비로소 일방적으로 이를 부과해야 한다는 뜻을 명확히 하였다. 그런데 이번 「포츠담」 선언에서는 「우리들은 협의한 끝에 일본국에 대하여 전쟁을 종결할 기회를 부여할 것에 의견이 일치하였다」(제1항)라고 하고, 「우리들의 조건은 다음과 같다」(제5항)라고 한다. 즉 「포츠담」 선언은 실질적으로는 사전에 조건을 제시한 화평 권고에 다름 아니라는 점에서 「크리미아」 선언의 건전과 큰 차이가 있다.\n\n(二) 「크리미아」 선언에서는 독일 정부를 전연 무시하고 있음에 반하여, 이번 「포츠담」 선언은 오히려 일본 정부를 상대로 하는 호소로서, 또한 일본 정부를 행동의 주체로서 인정하고(제10항 및 제13항), 일본의 국내 사항은 되도록 이를 일본 정부 자신으로 하여금 행하게 하려는 건전을 취하고 있다.\n\n### 二、영토의 점령\n\n(一) 「크리미아」 선언에서는 「합의된 계획에 기하여 3국의 군대는 「도이치」의 각 분할 지구를 점령할 것이다」라고 정해지고 또한 독일 항복 후 현실로 독일 영토의 전면적 점령이 행해진 것에 반하여, 「포츠담」 선언 중에는 「연합국이 지정해야 할 일본국 영역 내의 제지점은 우리들이 이에 제시하는 기본적 목적의 달성을 확보하기 위하여 점령될 것이다」(제7항)라고 되어 있는 대로 전면적 점령이 아니라 부분적 보장점령이며, 또한 점령 지역도 「지점」 point이라는 자구를 쓰는 이상 광범한 지역을 의미하지 아니하고 요점만의 점령을 의도하고 있는 것으로 판단된다.\n\n(二) 「크리미아」 선언에서는 독일 영토의 점령 및 관리에 대하여 상세히 규정하였음에도 불구하고 점령군의 철수에 대하여는 아무것도 언급하는 바가 없음에 반하여, 「포츠담」 선언에서는 동 선언의 목적이 달성되고 평화적 경향을 가지는 책임 정부가 수립되는 대로 즉시 철수해야 한다는 뜻을 규정하고 있다(제12항).\n\n### 三、군대의 귀환\n\n「포츠담」 선언에서는 전후 일본국 군대의 취급에 관하여 「각자의 가정에 복귀하여 평화적이고 또한 생산적인 생활을 영위할 기회를 얻게 될 것이다」(제9항)라고 규정하는바, 「크리미아」 선언에서는 독일 장병의 귀환에 대하여 아무것도 규정하는 바가 없다. 위 「포츠담」 선언의 규정은 일본 국내에 있는 군대는 물론이고 재외 일본군 장병도 또한 포로로 하거나 혹은 억류하는 일 없이 한결같이 귀향을 인정하려는 것으로 해석됨과 동시에, 제국에 대하여는 독일의 경우에 있어서와 같이 배상에 대신하는 노동력의 제공이라는 의미로써 병원을 적국 내 노무를 위하여 납치해 갈 의도가 없음을 나타내는 것으로 해석된다.\n\n### 四、민주주의의 부활\n\n「크리미아」 선언에서는 「나치스」주의 파쇄를 위한 수단으로서 「나치스」당 및 「나치스」 법제·조직 및 제도의 일소, 공공 제기관과 독일 국민의 문화적 및 경제적 생활로부터의 일체의 「나치스」적 세력의 철거 등 상세한 규정을 두었고, 또한 이들 조치는 「연합국」 측에서 이를 취한다는 뜻을 명확히 하고 있다. 「포츠담」 선언에서는 「일본국 정부는 일본국 국민 사이에 있어서의 민주주의적 경향의 부활 및 강화에 대한 일체의 장애를 제거해야 한다」(제10항)고 하여, 감히 민주주의화의 수단·방법에 대하여 지시를 하지 아니하였고, 또한 이의 조치는 「연합국」 측에서 하지 아니하고 일본국 정부 자신의 책임에 있어서 이를 하게 하는 것으로 하였다.\n\n### 五、경제조항\n\n「크리미아」 선언에서는 독일 군수공업의 파괴, 대(對)독일 배상의 부과를 규정하기에 급급함에 반하여, 「포츠담」 선언에서는 이를 표면으로부터 규정하는 것을 피하고, 오히려 「크리미아」 선언이 언급하고 있지 아니한 평화 산업의 유지, 원료·자원의 입수, 세계 무역에의 참가를 일본 국민에게 인정하는 취지를 규정하였다(제11항).\n\n---\n\n## 부기 (3) — 戰鬪停止ヘノ過程ニ於ケル諸問題ニ付テ (쇼 20. 8. 11)\n\n〔쇼와 20년 8월 11일자, 조약국 제1과·동 제2과 작성〕\n\n### 一、「포츠담」 선언에 대한 실질적 합의의 성립\n\n아측의 「포츠담」 선언 수락에 의하여 동 선언 각 조항의 내용 그 자체에 대하여는 피아(彼我) 사이에 실질적으로 합의가 성립한 것으로 보아야 할 것이다. 다만 이에 부수하여 아측이 붙인 양해사항에 대하여 아직 적측으로부터 어떠한 의사표시가 있을지 불명하므로, 위 합의는 최종적으로 확정되어 있지 아니한 형편이다.\n\n만일 상대방이 아측이 붙인 양해사항을 거부해 오는 경우에는, 아측의 「포츠담」 선언 수락은 해소되고 다시 위 수락 전의 백지 상태로 되돌아가는 것으로 보지 아니할 수 없다.\n\n따라서 「포츠담」 선언에 관한 피아의 합의가 최종적으로 확립되는 것은 (イ) 상대방이 아측 양해사항에 동의를 부여하는 경우이거나, 또는 (ロ) 완전한 동의를 부여하지는 아니하더라도 아측이 수락할 수 있는 조건을 붙여 와서 아측에서 이를 승인하는 경우에 한정되는 형편이다.\n\n### 二、「포츠담」 선언의 군사적 조항의 취급\n\n「포츠담」 선언의 조항 중에는 군사적 조항과 비군사적 조항이 있다. 전투 행위의 정지를 실현하기 위하여는 적어도 위 군사적 조항에 기하여 아측이 일정한 조치를 실행할 것을 전제로 한다.\n\n이에 각 조항에 대하여 어떠한 조치의 실행을 필요로 할 것인가의 점을 연구하건대,\n\n(一) 일본국 군대의 무조건항복의 선언(제13항)\n\n이에 대하여는 첫째로 어떤 자가 위 선언을 하여야 하는가의 문제가 있다. 「포츠담」 선언은 일본국 정부가 위 선언을 하는 것으로 하고 있으나, 반드시 우리 통수부가 위 선언을 하는 것을 금지하는 취지로는 해석되지 아니한다. 또 우리 국내법상의 관점으로 보면 위 선언과 같은 것은 통수 사항이므로 통수부가 이를 함이 본줄기이나, 정부가 이를 하더라도 반드시 위법은 아닐 것이다. 어느 쪽인가 하면 통수부가 선언하는 방법이 가장 무난할 것이다.\n\n다음으로 위 선언은 어떠한 형식으로 하여야 하는가의 문제가 있다. (イ) 특별한 선언문을 작성하여 이를 내외에 발표하거나 또는 상대방에게 수교하는 방법을 보통으로 하여야 할 것이나, (ロ) 휴전 협정 중에 선언을 대신하는 한 조항을 삽입하고 특히 선언을 하지 아니하는 방법도 있을 수 있으며, 또 나아가 (ハ) 8월 9일 아측의 「포츠담」 선언 수락의 의사표시에 의하여 위 선언은 완료되었다는 견해도 무리하게 말하자면 말하지 못할 바는 아닐 것이다. 아측의 선택은 (ハ)(ロ)(イ)의 순서여야 할 것이나, 위 선택은 아측에서 일방적으로 할 수 있는 것은 아닐 것이다.\n\n(二) 무조건항복의 성의의 보장(제13항)\n\n구체적으로 어떠한 보장을 필요로 할 것인가는 선언의 문면으로는 불명하다. 이에 대하여는 아무런 특수한 조치를 취하지 아니하고 무조건항복의 성의를 사실로써 보여 나가는 방법도 있을 것이다. 또 특수한 조치를 취하는 경우의 방법으로서는, 예를 들면 일본 측이 무조건항복의 선언에 위배한 경우 적측은 이에 대하여 자유 조치로 나올 수 있다고 하는 것과 같은 제재 규정을 두는 것을 아측에서 수락하는 방법도 있을 수 있을 것이다.\n\n(三) 일본국 군대의 무장 해제 및 철수(제9항)\n\n이에 대하여는 일반적인 정전 협정으로써 정함을 본줄기로 하고, 동시에 출선군(出先軍)에서 적측 현지군과 지방적 협정을 필요로 하는 경우도 있을 것이다. 이 경우 무기의 처분을 규정할 필요가 있다.\n\n일본 국내에 존재하는 군대의 무장 해제는 아측에서 자발적으로 이를 행함이 적당할 것이며, 상대방이 이에 동의를 부여하는 경우에 있어서도 이의 감독을 신청해 올 가능성이 있다. 또한 무기의 인도 및 파괴의 방법에 대하여 고려해 둘 필요가 있다.\n\n출선 군대의 철수에 관하여는 단지 적 현지군과의 사이뿐만 아니라 당해 지방 정권과 협정을 이룰 필요가 있을 것이다.\n\n또한 「포츠담」 선언의 조항을 떠나 다음 문제를 고려할 필요가 있다.\n\n(四) 전투 정지의 시기와 형식\n\n무조건항복의 선언과 동시에 자동적으로 전투가 정지될 것이라는 양해를 사전에 아측으로부터 구하여야 할 것인가, 또는 위 선언을 한 후 (イ) 일반적 정전 협정을 체결할 것인가, 또는 (ロ) 그 사이에 잠정적 정전을 일단 피아 간에 약정할 것인가, 혹은 (ハ) 그러한 약정을 전연 행하지 아니하고 묵묵한 가운데 쌍방이 사실상 정전의 상태에 들어가는 것으로 할 것인가의 문제.\n\n(五) 이상 각 항의 약정을 행하는 경우, 정부가 이에 간여하는 경우는 물론 통수부가 이에 당하는 경우에도 외무성 기타의 계관(係官)이 이에 참가할 것인가 아닌가의 문제, 참가한다고 하면 그 자격의 문제.\n\n### 三、비군사적 조항의 취급\n\n아측으로서는 전투 정지를 행하기 위한 전제로서 군사적 조항에 관한 조치(그것도 되도록 적은 조치)만으로써 족하도록 몰아가야 할 필요가 있다. 다만(伯シ〔但シ〕) 적측으로부터 군사적 조항 이외의 조항에 관한 조치도 전투 정지의 전제로서 요구해 올 가능성이 있다.\n\n이에 「포츠담」 선언의 비군사적 조항에 대하여 검토하건대,\n\n(一) 제국 영토의 보장점령(제7항)\n\n이에 대하여는 아측으로서는 상대방의 의사표시를 기다리는 수밖에 없으며, 만일 전투 정지의 전제로서 보장점령의 실행을 요구해 오는 경우에는 이에 응하여 필요한 편의 공여, 협력을 할 필요가 있고 또한 그때 어느 정도의 협정을 맺을 필요가 있을 것이다.\n\n(二) 영토조항(제8항)\n\n포기해야 할 영토의 인도를 상대방의 신청을 기다려 할 것인가 혹은 자발적으로 행할 것인가의 문제가 있다. 실제로는 대강(大綱)의 가협정을 체결하고, 상세는 주민의 국□ 재산 등의 문제와 함께 결국 강화 조약을 기다리는 수밖에 없다.\n\n(三) 전쟁범죄인의 처벌(제10항)\n\n위에 대하여는 일본이 일방적으로 처치하는 것을 상대방이 인정할 것인가 아닌가 의문이다. 전쟁범죄인의 선정, 특별재판소의 설치, 범죄인 인도의 요부(要否) 등 허다한 문제가 있으나, 결국 상대방의 태도를 보아 교섭 사항으로서 남기도록 몰아가는 수밖에 없을 것이다.\n\n(四) 기타의 정치조항\n\n군국주의의 말살(제6항), 민주주의의 재생(제10항), 언론·종교·사상의 자유의 확립(제10항) 등은 우리 국내 시정 방침에 관한 것으로서, 일본 정부가 자발적으로 조치한다는 건전으로 나아가도 좋을 것이며, 일반적으로 순연한 내정에 관하여는 상대방의 간섭을 되도록 적게 하도록 조치할 필요가 있다.\n\n(五) 경제적 조항\n\n(イ) 배상(제11항) — 배상에 대하여는 후일의 결정을 기다리는 형편이나, 당장 우리 재외 자산의 처리, 포기해야 할 영토에 존재하는 재산의 처리 등이 문제가 될 수 있으며, 또한 이를 현물 배상에 포함시킬 것을 인정하게 하도록 몰아감이 좋을 것이다.\n\n(ロ) 군수 산업의 금절(제11항) — 이에 대하여는 금절되어야 할 산업의 범위, 금절의 방법 등이 문제가 되나 교섭 사항으로서 남김이 좋을 것이다. 군수 산업의 시설, 원료·자재 등은 배상의 목적물이 될 가능성이 많다. 또 상대방이 산업 관리를 주장할 가능성이 있다. 이를 위하여 배상위원회와 함께 산업감리위원회의 형성이 예견된다.\n\n이상을 개괄하여 말하면, 순군사적 사항 이외는 상대방의 신청을 기다려 순서를 좇아 되도록 서서히 행함이 유리할 것이다.\n\n### 四、아측 양해사항의 취급\n\n경우에 따라서는 아측 양해사항에 대하여 상대방이 일정한 조건을 제출해 오고, 위 조건의 실시로써 전투 정지의 전제로 삼아 올 가능성이 있다.\n\n위 조건이 단적으로 명시되어 아측의 수락의 의사표시만으로써 일을 마칠 수 있다면 좋으나, 위 조건이 묵시적 내지 추상적이어서 아측으로서 즉시 수락 내지 실시를 곤란하게 하는 것과 같은 경우에 있어서는, 아측으로서는 다시 장래의 조건을 붙여 일의 해결을 도모하지 아니하면 아니 되는 사태에 이르는 일이 있을 수 있을 것이다. 어느 쪽이든 본건의 취급 방식은 상대방 회답의 내용 여하에 의하여 결하는 수밖에 없다.\n", "secondary": "1086昭和20年8月10日岡本公使宛（電報）在スイス加瀨公使、在スウエーデンポツダダ宣言受諾に関する申入れを米英中ソ四カ国に伝達すべく任国に依賴方訓令\n\n別電の昭和二十年八月十日發東鄕外務大臣より在スイス加瀨公使、在スウエーデン岡本公使宛合\n\n第六四八号\n\n右申入れ\n\n二昭和二十年八月十日發東鄕外務大臣より在ス\n\nイス加瀨公使宛合第六四九号\n\n右申入れ英訳文\n\n付記の昭和二十年八月九日付、条約局第一課作成\n\n「米、英、支「ポツダム」宣言ノ檢討」\n\n二昭和二十年八月十四日付、条約局作成\n\n「「クリミヤ」宣言ト「ポツダム」宣言トノ比\n\n較檢討」\n\n三昭和二十年八月十一日付、条約局第一課・同\n\n第二課作成\n\n「戰鬪停止ヘノ過程ニ於ケル諸問題ニ付テ」\n\n本省8月10日前6時45分發\n\n合第六四七號（緊急）\n\n戰爭ノ慘禍ヨリ人類ヲ救ハントスル大御心ニ副ヒ奏ランカ爲帝國政府ハ瑞西國政府及瑞典國政府ニ對シ別電合第六四八號（右英譯又別電合第六四九號）ノ通帝國政府ノ意圖ヲ主要交戰國ニ對シ傳達方依賴スル一方在京蘇聯大使ヲ通シ直接蘇聯政府ニ對シ右趣旨ヲ傳達スルコトニ決定セリ就テハ在瑞西公使ヨリハ米國政府及支那政府ニ對シ在瑞典公使ヨリハ英國政府及蘇聯政府ニ對シ最モ速カニ右傳達方○\n\n竝ニ相手方ノ速答ヲ得ル樣幹旋方夫々任國政府ニ對シ申入レラレ結果大至急御囘電相成度\n\n本電及別電宛先在瑞西公使、在瑞典公使\n\n（別電の）\n\n本省8月10日前9時00分發\n\n合第六四八號（緊急）\n\n帝國政府ニ於テハ人類ヲ戰爭ノ慘禍ヨリ免レシメンカ爲速カニ平和ヲ招來センコトヲ祈念シ給フ天皇陛下ノ大御心ニ從ヒ曩ニ大東亞戰爭ニ對シテ中立關係ニ在ル「ソヴイエト」聯邦政府ニ對シ幹旋ヲ依賴セルカ不幸ニシテ右帝國政府ノ平和招來ニ對スル努力ハ結實ヲ見ス玆ニ於テ帝國政府ハ前顯天皇陛下ノ平和ニ對スル御祈念ニ基キ卽時戰爭ノ慘禍ヲ除キ平和ヲ招來センコトヲ欲シ左ノ通決定セリ帝國政府ハ昭和二十年七月二十六日米、英、支三國首膽ニ依リ共同ニ決定發表セラレ爾後蘇聯邦政府ノ參加ヲ見タル對本邦共同宣言ニ擧ケラレタル條件中ニハ天皇ノ國家統治ノ大權ヲ變更スルノ要求ヲ包含シ居ラサルコトノ了解ノ下ニ帝國政府ハ右宣言ヲ受諾ス\n\n帝國政府ハ右ノ了解ニ誤リナク貴國政府カ其ノ旨明確ナル意思ヲ速ニ表明セラレンコトヲ切望ス\n\n帝國政府ハ□□□瑞典國政府瑞西國政府□□□ニ對シ速カニ右ノ次第ヲ□□□英國米國政府及蘇聯政府及支那政府邦政府□□□ニ傳達方ヲ要請スルノ光榮ヲ有ス（別電二）\n\n本省8月10日前9時00分發\n\n合第六四九號（緊急）\n\nIn obedience to the gracious command of His Majesty the Emperor who, ever anxious to enhance the cause of world peace, desires earnestly to bring about an early termination of hostilities with a view to saving mankind from the calamities to be imposed upon them by further continuation of the war, the Japanese Government asked several weeks ago the Soviet Government, with which neutral relations then prevailed, to render good offices in restoring peace vis- □a□ vis the enemy Powers. Unfortunately, these efforts in the interest of peace having failed, the Japanese Government, in conformity with the august wish of His Majesty to restore the general peace and desiring to put an end to the untold sufferings entailed by war as quickly as possible, have decided upon the following: The Japanese Government are ready to accept the terms enumerated in the Joint Declaration which was issued at Potsdam on July 26th, 1945 by the heads of the Governments of the United States, Great Britain and China, and later subscribed by the Soviet Government, with the understanding that the said Declaration does not comprise any demand which prejudices the prerogatives of His Majesty as a sovereign ruler. The Japanese Government hope sincerely that this understanding is warranted and desire keenly that an explicit indication to that effect will be speedily forthcoming. The Japanese Government have the honor to request the Government of Switzerland to be good enough to forward immediately the above communications to the Governments of the United States and China.\n\n編注合第六四九号は在スウエーデン岡本公使宛にあ送付されている。内容は本電とほぼ同文であるが、要請先、国名が「theRoyalSwedishGovernment」、伝達先が「the Governments of the Soviet Union and Great Britain」となっている。\n\n（付記の）\n\n米、英、支「ポツダム」宣言ノ檢討二十、八、九\n\n今次米英支三國ノ「ポツダム」共同宣言ハ其ノ内容必シモ全部ノ點ニ付明白ナラザル處右宣言ノ表面ニ現ハレ又ハ裏面ニ伏在スル敵側意圖ヲ出來得ル限リ明瞭ニ知悉センガ爲「カイロ」宣言、「クリミヤ」宣言等ト對比シツツ之ガ遂條的檢討ヲ試ミントス\n\n前又\n\n今次宣言ハ十三項ヨリ成ル處其ノ最初ノ五項ハ宣言ノ前又ヲ構成スルモノト認ムベキモノナリ、右前又ニ於テ敵側ハ「聯合軍」ノ威力ヲ誇示シ、獨逸完敗ノ前例ヲ指摘シ、日本軍ノ遭滅及日本國土ノ荒癈ノ不可避性ヲ强調シ、本宣言各條項ノ急速且全面的ノ受諾ヲ勸告セルモノニシテ、慨ネ威嚇的言辭ノ羅列ニ過ギズ、決律的ニハ必シモ重要性ヲ附スルノ要ナシ\n\n○○○\n\n唯前又第一項ニ於テ「吾人ハ協議ノ上日本國ニ對シ戰爭ヲ○○\n\n終結スルノ機會ヲ供與スルコトニ意見一致セリ」ト爲シ敢テ「降伏」又ハ「無條件降伏」ヲ勸告スト謂ハザリシ點、○○\n\n又前又第五項ニ於テ「左記ハ吾人ノ條件ナリ」ト單ニ「條件」ナル語ヲ用ヒタル點、而シテ又今次宣言全体ヲ通ジ「無條件降伏」ナル語ヲ使用セルハ唯一箇所卽チ本又第八○○\n\n項ニ於テ「日本國軍隊ノ無條件降伏」ト「軍隊」ニ付テノミ用ヒ居ル點ハ執レモ注意ニ値ス\n\n右ハ敵側ノ政治的含蓄ヲ示スモノト解セラルルト共ニ今次宣言ノ決律的性質ニ付疑問ヲ惹起セシムルモノナリ\n\n元來「無條件降伏ノ條件」ナル語ハ夫レ自体矛盾ヲ包藏ス、「クリミヤ」宣言ニ於テモ」「ナチス、ドイツ」ニ對シ課ス○○○○○○○○\n\nベキ無條件降伏條項ハ：「ドイツ」國ノ最終的敗北ガ達成○○○○○○○○○○○○○○○\n\nセラルル迄ハ發表セラレザルベシ」トアル如ク、對手國ニ對シ事前ニ條件ヲ提示スルコトナク對手國ノ無條件降伏ヲ俟チ、換言セバ如何ナル條件ヲ課スルモ對手國ガ之ヲ拒否スル能力ナキニ立至ルヲ俟チ始メテ一方的ニ條件ヲ課スルヲ常道トス、今次宣言ハ右トハ趣ヲ異ニスルモノニシテ實質的ニハ事前ニ條件ヲ提示セル和平勸告ト見ルベキモノナリ\n\n唯敵側トシテハ所謂「日本國ノ面子」ヲ救ハント欲スルト同時ニ國内的考慮ノ要モアルニ付、前又未項ニ於テ「吾人ハ此等條件ヨリ逸脫スルコトナカルベク且他ノ撰擇ヲ許サズ遲處ヲ受諾シ得ズ」ト爲シ恰モ無條件降伏條項ノ賦課又（牒カ）（杉カ）\n\nハ最後通諜的色採ヲ與ヘ又斯ク稱シ居ルモ、右ハ今次宣言ノ性質ヲ變更スルモノニ非ズト認メラル\n\n本又\n\n今次宣言ノ第六項乃至第十三項ハ宣言ノ本又ト認ムベキモノニシテ何レモ之ヲ以テ戰爭ヲ終結セシメント敵側ノ欲スル實質的條件ヲ記載ス\n\n第一款軍國主義ノ抹殺\n\n（遂カ）\n\n「吾人ハ無靑任ナル軍國主義ガ世界ヨリ驅遂セラレザル限リ平和、安全及正義ノ新秩序ハ實現不可能ナルコトヲ主張スルモノナルガ故ニ日本國臣民ヲ欺瞞シ之ヲ驅ツテ世界征服ノ擧ニ乘出サシメタル者ノ權力及勢力ハ永久ニ抹殺セラレザルベカラズ」\n\n本項前段ハ敵側ノ政治的見解ノ表示ニ止マリ、決律的ニ意義アルハ本項後段ナリ、而シテ後段ニ於テ「抹殺」セラルベキ對象トシテ「權力及勢力」（authorityandinfluence）ナル漠然タル表現ヲ用ヒタルハ注意ニ値ス\n\n「クリミヤ」宣言ニ於テハ」「ドイツ」軍國主義及「ナチス」主義ヲ破摧」スル目的ヲ以テ獨軍隊ノ武裝解除及解体、獨參謀本部ノ廢絕、一切ノ戰爭犯罪人ノ裁判及處罰、「ナチス」黨及「ナチス」決制、組織及制度ノ一掃、公共諸機關ヨリ、玆ニ獨國民ノ又化的及經濟的生活ヨリ一切ノ「ナチス」的及軍國主義的勢力ノ撤去等詳細具体的措置ヲ予定シ居レリ、今次宣言中ニハ右ニ對應スル詳細ノ規定ヲ欠除シ本項ノ「權力」ガ畏クモ天皇ヲ包含スルヤ又ハ政府或ハ軍事當局者ヲ意味スルニ止マルヤ又「勢力」ガ政黨其ノ他政治傳体、思想傳体或ハ軍需企業家、財閥等ヲモ包含スルモノナリヤ等其ノ節圍ハ一切不明確ナリ\n\n犬モ「日本國臣民ヲ欺瞞シ之ヲ驅ツテ世界征服ノ擧ニ乘リ出サシメタル」ナル字句ヨリ判斷セバ、本項ハ戰爭靑任者W□rresponsiblesノ意味ニ於ケル戰爭犯罪人（國際決上ノ戰時犯罪人ト區別スルヲ要ス）ノ處罰ヲ狙ヒトスルモノト解セラレ、而シテ敵側見解ニ依レバ戰爭靑任者ハ獨ニ於テハ「ナチス」、伊ニ於テハ「フアシスト」、日本ニ於テハ軍閥ト爲シ居ルニ鑑ミ本項ニ所謂「權力及勢力」ハ「軍事的權力」及「軍國主義的勢力」ヲ意味スルモノト一應狹義ニ解シ得ザルニ非ズ、然レ共敵側内部ニ於ケル我國体ニ關スル論議、戰爭靑任者ニ關スル論議等未ダ一定シ居ラザル現狀ニ鑑ミ、敵側トシテハ學ロ將來ノ立場ヲ拘束セラルルヲ避クル意味ニ於テ意識的ニ本項ノ如キ漠然タル表現ヲ用ヒタルモノト解スルヲ安當トスベシ\n\n第二款帝國領土ノ保障占領\n\n「前記新秩序ガ建設セラレ且日本國ノ戰爭企圖能力ガ破摧セラレタル旨ノ確證ヲ見ルニ至ル迄聯合國ノ指定スル日本國領域内ノ諸地點ハ吾人ノ玆ニ提示スル基本的目標ノ完遂ヲ確保スル爲占領セラルベキモノトス」\n\n本項ハ帝國領土ノ保障占領ニ關スル條項ナリ\n\n○○\n\n占領ノ節圍ハ之ヲ明定シ居ラザルモ「日本國領域内ノ諸地○\n\n點」points（電又ニ依リテハ此ノ語ノ脫落シ居ルモノアリ）トアル以上、敵側ハ帝國領土ノ廣汎ナル地域ノ占領ヲ意圖セズ學ロ軍事的、政治的又ハ經濟的要點ノミノ占領ニ止メント欲スルモノト認メラル、卽チ「クリミヤ」宣言ニ於テ」合意セラレタル計畫ニ基キ三國ノ軍隊ハ「ドイツ」ノ各分割地區ヲ占領スベシ」ト定メラレ且獨敗戰後現實ニ獨領土ノ全面的占領行ハレタルト異ナレル取扱ヲ帝國ノ場合ニハ意圖シ居ルモノト解セラル\n\n占領ノ目的ハ本宣言ノ提示スル「基本的目標ノ完遂ヲ確保スル爲」ト爲シ居ル處右基本的目標トハ本宣言ノ主要條項卽チ軍國主義ノ抹殺、領土ノ變更、軍隊ノ武裝解除、戰爭犯罪人ノ處罰、産業ノ改編等ヲ指スモノト認メラル\n\n占領ノ期間ニ付テハ「前記新秩序ガ建設セラレ且日本國ノ戰爭企圖能力ノ破摧セラレタル旨ノ確證ヲ見ルニ至ル迄」トアル處右期間ニ付テハ後述第七款（平和的傾向ヲ有スル靑任政府ノ樹立）ノ條件ヲ倂セ考慮スルヲ要ス\n\n第三款領土條項\n\n」「カイロ」宣言ノ諸條項ハ實施セラルベク且日本國ノ主權ハ本州、北海道、九州及四國竝ニ吾人ノ指定スル諸小島ニ限定セラルベキモノトス」\n\n本項ニ於テ明カナル如ク敵側ハ日本降伏ノ曉ニ於テハ帝國領土ヲ本州、北海道、九州、四國及敵側ノ指定スル諸小島minorislandsニ限定セント欲スルモノナリ、爾余ノ帝國領土及占領地ニ付テハ之ガ規定ヲ「カイロ」宣言ニ讓リ居ル處「カイロ」宣言ニ依レバ\n\nイ、「千九百十四年ノ第一次世界戰爭ノ開始以後ニ於テ日本國ガ奪取シ又ハ占領シタル太平洋ニ於ケル一切ノ島嶼」ハ之ヲ剝奪シ\n\nロ、「滿洲、臺灣、澎湖島ノ如キ日本國ガ淸國人ヨリ盜取シタル一切ノ地域」ハ之ヲ中華民國ニ返還シ\n\nハ、「暴力及貪欲ニ依リ日本國ガ略取シタル他ノ一切ノ地域」（占領地ヲ意味スルモノナルベシ）ヨリ日本國ヲ（遂カ）\n\n驅遂シ\n\nニ、朝鮮ハ之ヲ「自由且獨立ノモノタラシムル」コトトナリ居レリ\n\n右ノ中ロ、及ニ、ノ領土ノ處分ニ付テハ疑問ナキモイ、及ハ、ニ屬スル地域ノ處分方決ニ付テハ「カイロ」宣言モ今次宣言モ之ヲ明カニシ居ラズ、唯桑港會議憲章ノ規定ニ顧ミルニ右イ、ノ太平洋諸島嶼ハ、本項ニ依リ日本國主權ノ（治カ）\n\n下ニ殘置セラルル諸小島以外ノ島嶼ト共ニ、之ヲ信託統領領ト爲シ、又ハ、ノ南方占領地ハ之ヲ慨ネ原所有國ニ復歸セシメタル上「仕民ノ福□增進及全般的向上」ヲ計リ「自治乃至獨立」ヘ導カント欲スルモノニ非ズヤト推測セラル今次宣言ニ依ルモ全然不明ナルハ樺太南半ノ連命ナリ、樺太南半ヲ日本國主權ノ節圍ニ置カルベキ地域トシテ本項ニ記載セザリシモサリトテ之ヲ日本國ヨリ奪取スベキ地域ニモ包含セシメ居ラズ、又樺太ヲ「諸小島」ノ中ニ含メ解釋スルハ無理ナルニ付、樺太南半ノ處分ニ付テハ故意ニ規定ヲ囘避セルモノト解スルノ外ナシ\n\n第四款日本國軍隊ノ武裝解除\n\n「日本國軍隊ハ完全ニ武裝ヲ解除セラレタル後各自ノ家庭ニ復歸シ平和的、生産的生業ヲ營ムノ機會ヲ得シメラルベシ」\n\n本項ハ日本國軍隊ノ處置ヲ定メタルモノナリ、前段ニ於テハ單ニ日本國軍隊ノ武裝解除ノミヲ規定セリ、「クリミヤ」宣言ニ於テハ獨軍隊ノ武裝解除及解体ノ外、參謀本部ノ癈絕、軍事施設ノ撤去又ハ破壞、軍需丁業ノ除去又ハ管理等ヲ規定セルモ今次宣言ハ之等ニ觸ルルトコロナク且武裝解除ニ付テモ如何ナル方決ヲ以テ之ヲ行フヤヲ明カニセズ後段ハ武裝解除後ニ於ケル日本國軍隊ノ取扱ヲ規定セリ、戰爭終了ノ際ハ何レノ軍隊ト雖モ家庭ニ復歸シ平素ノ生業ニ從事スベキハ當然ナルニ拘ラズ、特ニ右ニ言及セルハ我將兵ニ對スル心理的影響ヲ狙ヒタル政治的意圖ノ外決律的ニハ帝國ニ對シテハ獨ノ場合ノ如ク暗償ニ代ル勞働力ノ提供ノ意味ヲ以テ兵員ヲ敵國内勞務ノ爲拉シ去ルノ意圖ナキヲ示スモノトモ解セラル\n\n第五款日本國臣民ノ取扱\n\n「吾人ハ日本人ヲ民族トシテ奴隸化セントシ又ハ國民トシテ破滅セシメントスルノ意圖ヲ有セズ犬モ俘虜ヲ虐待セル者ヲ含ム一切ノ戰爭犯罪人ハ嚴重ニ裁カルベキモノトス\n\n日本國政府ハ日本國臣民ノ間ニ於ケル民主主義的傾向ノ再生及强化ヲ妨グル一切ノ障碍ヲ除去スベク言論、宗敎及思想ノ自由竝ニ基本的人權ノ尊重ヲ確立スベキモノトス」\n\n本款ハ敵側ノ日本國臣民ニ對スル態度ヲ明カニセルモノナル處第一項ハ「トルーマン」大統領就任直後ノ日本國臣民ニ關スル聲明ヲ其ノ儘採リ入レタルモノニシテ、唯伯書トシテ戰爭犯罪人ノ處罰ヲ規定セリ、玆ニ戰爭犯罪人ノ一例トシテ俘虜虐待者ヲ擧ゲ居ル處右ヨリ判斷スルニ本項ハ前記第一款ノ說明ニ述ベタル「戰爭靑任者」タル權力者乃至勢力者ハ勿論又之ニ談當セザル者ト雖モ國際決遲反行爲アリタル「戰時犯罪人」ハ之ヲ個人トシテ訴追スルノ途ヲ開キタルモノト認メラル\n\n○○\n\n尙「クリミヤ」宣言ニ於テハ「我等ハ：一切ノ戰爭犯罪人ヲ裁判ニ付シ且速ニ處罰スル：決心ナリ」ト爲シ獨ノ戰爭犯罪人ハ之ヲ「聯合國」側ニ於テ裁判、處罰スルモノナル旨明カニシ居ルモ（We are determined to ... bring all war criminals to justice and swift punishment),）、本項ニ於テハ何人ガ戰爭犯罪人ヲ裁クモノナルヤノ主格ヲ欠除シ居レリ（justice shall be meted out to all war criminals).）、伯シ之ヲ以テ裁判ヲ日本側ノ手ニ依リ行ハシメントスルモノト速斷スルヲ得ザルコト勿論ニシテ結局裁判ノ當事者、方決等ハ本項ニ依リテハ之ヲ明カニシ得ズ\n\n第二項ハ日本國政府ニ對シ民主主義ノ再生、强化竝ニ自由及人權ノ尊重ヲ確立スルノ義務ヲ課セントスルモノナル處、「クリミヤ」宣言ニ於テハ前記第一款ノ說明中ニ記載セル如ク、獨逸民主化ノ爲ノ措置ハ「聯合國」側ニ於テ之ヲ實施スルコトトナリ居ルニ反シ、本項ニ於テ日本國ノ場合ハ之ヲ日本國政府自身ノ手ニ依リ行ハシメントスルモノナリ、○○\n\n又本項ニ於テ「民主主義的傾向ノ再生」ナル字句ヲ用ヒタルハ敵側ニ於テ日本國民ハ元來民主主義的傾向ヲ有シタルモノナリトスル見解ヲ持シ居ルヲ證スルニ似タリ\n\n第六款日本國産業ノ取扱\n\n「日本國ハ其ノ國民經濟ノ保持及物資ニ依ル公正ナル暗償ノ支拂ヲ可能ナラシムルガ如キ産業ヲ維持スルコトヲ許與セラルベシ伯シ戰爭ヲ目的トスル再軍備ヲ可能ナラシムルガ如キ産業ハ此ノ限リニ非ズ\n\n右目的ノ爲原料資源ノ入手許與セラルベシ犬モ右入手ハ原料資源ノ支配トハ區別セラルベキモノトス日本國ハ將來世界貿易關係ヘノ參加ヲ許與セラルルコトアルベシ」本款ハ日本國産業ノ取扱ニ關スル規定ナリ、第一項ニ於テ平和産業ノ許與ヲ、第二項ニ於テ原料資源ノ入手及世界貿易ヘノ參加ノ許與ヲ定ム、第一項ハ裏面解釋ヲ爲サバ結局戰後暗償ノ賦課及軍需産業ノ禁絕ヲ意味スルモノナルモ、獨ニ對スル「クリミヤ」宣言ト異リ、本宣言ノ何レノ部分ニ於テモ之ヲ直接表面ヨリ規定スルコトナク、本項ニ於テ又章ノ綾ニ依リ却テ日本國民ニ對スル恩惠ナルカノ如キ規定ト爲セルハ、敵側ノ政治的考慮ヲ物語ルモノト謂フベシ\n\n尙平和産業及軍需産業ノ限界ハ本項ノ規定ノミニテハ漠然トシ不明確ナリ\n\n○○\n\n第二項ノ「原料資源ノ支配」トハ結局原料資源ノ所在地ノ領有又ハ之ガ開發企業ノ經營ヲ意味スルモノト解スベキニ依リ、之ヲ禁絕スル本項ノ規定ハ、前記領土條項ト相俟チ、帝國ガ今次戰爭勃發後大陸及占領地ニ於テ新ニ着手セル開發事業ハ勿論、滿鐵始メ滿支ニ於テ帝國ノ有スル歷史的企業モ亦其ノ莫大ナル投下資本及施設ト共ニ一切之ヲ剝奪セントスル敵側意圖ヲ推知セシムルモノナリ、犬モ其ノ際右投下資本及施設ノ評償ヲ現物暗償ノ中ニ包含セシムルヤ否ヤノ點ハ獨ノ場合ニ付問題トナリ居ルト同樣問題トナリ得ベシ\n\n何レニスルモ本項ノ「原料資源ノ入手」accessトハ結局外國ヨリノ輸入ヲ意味スルニ過ギズ、而シテ之ガ輸入ヲ許與セラルルトスルモ輸入ヲ行ハンガ爲ニハ輸出ヲ以テ決濟スルノ外ナク、右ハ「世界貿易關係ヘノ參加」ナクシテ不可能ナルコト理ノ當然ナリ、從テ本項モ實質的ニハ原料資源支配ノ禁絕ヲ意味シ何等恩惠的規定ニ非ザルモ、「クリミヤ」宣言ニ於テ獨ノ原料資源ノ入手又ハ世界貿易ヘノ參加ニ言及スルコトナキニ比シ猶差異アリト謂ハザルベカラズ第七款聯合國占領軍ノ撤收\n\n「前諸項ノ目的ガ達成セラレ且日本國臣民ノ自由ニ表明セル意思ニ從ヒ平和的傾向ヲ有スル靑任政府ガ樹立セラルルニ於テハ聯合國ノ占領軍ハ直ニ日本國ヨリ撤收スベキモノトス」\n\n本項ハ前記第二款ニ依リ日本國領土内ノ諸地點ノ保障占領ヲ行フ「聯合國」軍隊ノ撤收ヲ規定スルモノナリ、「クリミヤ」宣言ニ於テ獨領土ノ占領及管理ヲ詳細規定セルモ占領軍ノ撤收ニ付テハ何等觸ルルコトナキト趣ヲ異ニス\n\n尙本項ニ於テ「平和的傾向ヲ有スル靑任政府ノ樹立」ヲ撤收ノ條件ト爲シ居ル點注意ノ要アリ、蓋シ本宣言ノ第五款及第八款ニ於テ一應現在ノ日本國政府ヲ行動ノ主体トシテ認メ居ルモ、敵側ニ於テハ決シテ現政府ヲ以テ滿足セズ占領軍ノ撤收ノ爲ニハ彼等ノ眼ヨリ目シテ「平和的傾向」ヲ有スト認メラルル別個ノ政府ノ樹立ヲ必要トストノ見解ヲ持スルモノト解スベキヲ以テナリ\n\n第八款日本國軍隊ノ無條件降伏\n\n「吾人ハ日本國政府ニ對シ直ニ全日本國軍隊ノ無條件降伏ヲ宣言シ且右ニ關スル日本國政府ノ信義ヲ立證スル爲適切安當ナル保障ヲ提供センコトヲ要望ス\n\n日本國ニ殘サレタル他ノ撰擇ハ急速且全的破壞ヲ受クルノ一途アルノミトス」\n\n本款ハ本宣言ノ未又ヲ爲スモノトモ見ラレ最後ヲ再ビ威嚇的言辭ヲ以テ結ビ居ル處實質的ニハ休戰條件ヲ規定セルモノト解スベシ、卽チ前諸項ハ何レモ休戰條件ト謂ハンヨリ學ロ戰爭終結ノ曉ニ於ケル講和條件ノ基礎ヲ爲スモノト見ラルルニ反シ、本款第一項ハ「日本國軍隊ノ無條件降伏」ノ宣言ト謂ヒ之ガ保障ノ提供ト謂ヒ共ニ之ヲ以テ戰鬪終止cesserlefeuノ直接ノ前提ト爲サントスルモノト見ラルルヲ以テナリ\n\n○○\n\n尙「日本國軍隊ノ無條件降伏」ナル語ヲ使用セル點ニ付テハ前又ノ說明中ニ觸レタルモ、「カイロ」宣言ニハ明白ニ○\n\n「日本國ノ無條件降伏」ナル語ヲ使用シ居リ又「クリミヤ」○○○○○○\n\n宣言ニ於テモ」「ナチス、ドイツ」ニ對シ共ニ課スベキ無條件降伏條項」ト謂ヒ居リ、今次宣言ニ於テ特ニ無條件降伏ノ主体ヲ軍隊ニ限定セルハ注目ニ値スルトコロナリ○○○○\n\n又「日本國政府ノ信義ヲ立證スル爲適切安當ナル保障」トハ抽象的ノ表現ニシテ日本側ガ「適切安當」ト認ムルモ敵側ニ於テ不滿足トスルコトアリ得ベキヲ留意スルノ要アリ（付記二）\n\n「クリミヤ」宣言ト「ポツダム」宣言トノ比較檢討\n\n昭、二十、八、十四\n\n本年二月ノ對獨「クリミヤ」宣言ト今次對日「ポツダム」宣言トヲ比較スルニ兩者ハ何レモ戰爭終結前ニ於テ敵側ノ獨又ハ日ニ對スル處理方針ヲ宣明セルモノナル點ニ於テ共通性アルモ、其ノ内容ヲ此細ニ檢討スルニ兩者ノ間ニ猶顯者ナル差異アルヲ認メラル\n\n一、建前上ノ差異\n\n第一ニ兩者ノ間ニ建前上ノ相異アリ、建前上ノ相異ハ左ノ二點ニ付テ存ス\n\n一（一）元來「無條件降伏ノ條件」ナル語ハ夫レ自体矛盾ヲ包藏スルモノナル處「クリミヤ」宣言ニ於テハ」「ナチス」獨逸ニ對シ課スベキ無條件降伏條項ハ：「ドイツ」○○○○○○○○○○○○○○\n\n國ノ最終的敗北ガ達成セラルル迄ハ發表セラレザルベシ」ト爲シ、獨ニ對スル條件ハ獨ノ無條件降伏ヲ俟チ始メテ一方的ニ之ヲ課スベキ旨明カニセリ、然ルニ今次「ポツダム」宣言ニ於テハ「吾等ハ協議ノ上日本國○○○○○○○○○○\n\nニ對シ戰爭ヲ終結スルノ機會ヲ與フルコトニ意見一致セリ」（第一項）トシ「吾等ノ條件ハ左ノ如シ」（第五項）ト爲ス、卽チ「ポツダム」宣言ハ實質的ニハ事前ニ條件ヲ提示セル和平勸告ニ外ナラザル點ニ於テ「クリミヤ」宣言ノ建前ト大ナル差異アリ\n\n二（一）「クリミヤ」宣言ニ於テハ獨逸政府ヲ全然無視シ居ルニ反シ今次「ポツダム」宣言ハ學ロ日本政府ヲ對手トスル呼ビ掛ケニシテ且日本政府ヲ行動ノ主体トシテ認メ（第十項及第十三項）日本ノ國内事項ハ成ルベク之ヲ日本政府自身ヲシテ行ハシメントスル建前ヲ執リ居レリ\n\n二、領土ノ占領\n\n一（一）「クリミヤ」宣言ニ於テハ「合意セラレタル計畫ニ基キ三國ノ軍隊ハ「ドイツ」ノ各分割地區ヲ占領スベシ」○○○\n\nト定メラレ且獨降伏後現實ニ獨領土ノ全面的占領行ハレタルニ反シ、「ポツダム」宣言中ニハ「聯合國ノ指○○○\n\n定スベキ日本國領域内ノ諸地點ハ吾等ノ玆ニ提示スル基本的目的ノ達成ヲ確保スル爲占領セラルベシ」（第○○○○○○○\n\n七項）トアル通全面的占領ニ非ズシテ部分的保障占領○○\n\nニシテ且占領地域モ「地點」pointナル字句ヲ用フル以上廣汎ナル地域ヲ意味セズ要點ノミノ占領ヲ意圖シ居ルモノト判斷セラル\n\n二（一）「クリミヤ」宣言ニ於テハ獨領土ノ占領及管理ニ付詳細規定セルニ拘ラズ占領軍ノ撤收ニ付テハ何等觸ルルトコロナキニ反シ、「ポツダム」宣言ニ於テハ同宣言ノ目的ガ達成セラレ平和的傾向ヲ有スル靑任政府ノ樹立次第直ニ撤收スベキ旨規定シ居レリ（第十二項）\n\n三、軍隊ノ歸還\n\n「ポツダム」宣言ニ於テハ戰後日本國軍隊ノ取扱ニ關シ「各自ノ家庭ニ復歸シ平和的且生産的ノ生活ヲ營ムノ機會ヲ得シメラルベシ」（第九項）ト規定スル處「クリミヤ」宣言ニ於テハ獨將兵ノ歸還ニ付何等規定スルトコロナシ、\n\n右「ポツダム」宣言ノ規定ハ日本國内ニ在ル軍隊ハ固ヨリ在外日本軍將兵モ亦捕虜トシ若ハ抗留スルコトナク一樣ニ歸鄕ヲ認メントスルモノト解セラルルト共ニ、帝國ニ對シテハ獨ノ場合ニ於ケル如ク暗償ニ代ル勞働力ノ提供ノ意味ヲ以テ兵員ヲ敵國内勞務ノ爲拉シ去ルノ意圖ナキヲ示スモノト解セラル\n\n四、民主主義ノ復活\n\n「クリミヤ」宣言ニ於テハ「ナチス」主義破摧ノ爲ノ手段トシテ「ナチス」黨及「ナチス」決制、組織及制度ノ一掃、公共諸機關竝ニ獨國民ノ又化的及經濟的生活ヨリノ一切ノ「ナチス」的勢力ノ撤去等詳細規定ヲ設ケ且之等措置ハ「聯合國」側ニ於テ之ヲ執ル旨明カニシ居レリ、「ポツダム」宣言ニ於テハ「日本國政府ハ日本國國民ノ間ニ於ケル民主主義的傾向ノ復活及强化ニ對スル一切ノ障礙ヲ除去スベシ」（第十項）ト爲シ敢テ民主主義化ノ手段方決ニ付指示ヲ爲サズ且之ガ措置ハ「聯合國」側ニ於テ爲サズ日本國政府自身ノ靑任ニ於テ之ヲ爲サシムルモノトセリ\n\n□、經濟條項\n\n「クリミヤ」宣言ニ於テハ獨軍需丁業ノ破壞、對獨暗償ノ賦課ヲ規定スルニ急ナルニ反シ、「ポツダム」宣言ニ於テハ之ヲ表面ヨリ規定スルヲ避ケ却テ「クリミヤ」宣言ノ觸レ居ラザル平和産業ノ維持、原料、資源ノ入手、世界貿易ヘノ參加ヲ日本國民ニ認ムルノ趣旨ヲ規定セリ（第十一項）\n\n（付記三）\n\n戰鬪停止ヘノ過程ニ於ケル諸問題ニ付テ\n\n昭、二十、八、十一\n\n一、「ポツダム」宣言ニ付テノ實質的合意ノ成立\n\n我方ノ「ポツダム」宣言受諾ニ依リ同宣言各條項ノ内容其ノモノニ付テハ彼我ノ間ニ實質的ニ合意成立セルモノト見ルベキナリ、唯之ニ附隨シ我方ノ附シタル了解事項ニ付未ダ敵側ヨリ如何ナル意思表示アルヤ不明ナル爲右合意ハ最終的ニ確定シ居ラザル次第ナリ\n\n萬一先方ガ我方ノ附シタル了解事項ヲ拒否シ來ル場合ハ我方ノ「ポツダム」宣言受諾ハ解消シ再ビ右受諾前ノ白紙ノ狀態ニ立チ還ルモノト見ザルベカラズ\n\n從テ「ポツダム」宣言ニ關スル彼我ノ合意ガ最終的ニ確立スルハ(イ)先方ガ我方了解事項ニ同意ヲ與フル場合カ又ハ(ロ)完全ナル同意ヲ與ヘザルモ我方ノ受諾シ得ル條件ヲ附シ來リ我方ニ於テ之ヲ承認スル場合ニ限定セラルル次第ナリ\n\n二、「ポツダム」宣言ノ軍事的條項ノ取扱\n\n「ポツダム」宣言ノ條項中ニハ軍事的條項ト非軍事的條項アリ、戰鬪行爲ノ停止ヲ實現スル爲ニハ少クモ右軍事的條項ニ基キ我方ガ一定ノ措置ヲ實行スルコトヲ前提トス\n\n仍テ各條項ニ付如何ナル措置ノ實行ヲ必要トスベキヤノ點ヲ硏究スルニ\n\n一（一）日本國軍隊ノ無條件降伏ノ宣言（第十三項）之ニ付テハ第一ニ何人ガ右宣言ヲ爲スベキヤノ問題ア○○\n\nリ、「ポツダム」宣言ハ日本國政府ガ右宣言ヲ爲スコトトシ居ルモ必シモ我統帥府ガ右宣言ヲ爲スコトヲ禁止スル趣旨トハ解セラレズ、又我國内決上ノ觀點ヨリセバ右宣言ノ如キハ統帥事項ナルヲ以テ統帥府ガ之ヲ爲スヲ本筋トスルモ政府ガ之ヲ爲スモ必シモ遲決ニハ非ザルベシ、何レカト謂ハバ統帥府ガ宣言スルノ方決最モ無難ナルベシ\n\n次ニ右宣言ハ如何ナル形式ニ於テ爲スベキヤノ問題アリ、(イ)特別ノ宣言又ヲ作成シ之ヲ内外ニ發表スルカ又ハ先方ニ手交スルカノ方決ヲ普通トスベキモ(ロ)休戰協定中ニ宣言ニ替ル一項ヲ插入シ特ニ宣言ヲ爲サザル方決モアリ得ベク更ニ又(ハ)八月九日ノ我方ノ「ポツダム」宣言受諾ノ意思表示ニ依リ右宣言ハ完了セリトノ見解モ無理ニ云ヘハ云ヘザルニ非ルベシ、我方ノ撰擇ハ(ハ)(ロ)(イ)ノ順序ナルベキモ右撰擇ハ我方ニ於テ一方的ニ爲シ得ザルベシ\n\n二（一）無條件降伏ノ誠意ノ保障（第十三項）\n\n具体的ニ如何ナル保障ヲ必要トスベキヤ宣言ノ又面ニテハ不明ナリ、之ニ付テハ何等特殊ナ措置ヲ執ラズ無條件降伏ノ誠意ヲ事實ヲ以テ示シ行クノ方決モアルベシ、又特殊ノ措置ヲ執ル場合ノ方決トシテハ例ヘバ日本側ガ無條件降伏ノ宣言ニ反背セル場合敵側ハ右ニ對シ自由措置ニ出ゾルヲ得ト謂フガ如キ制裁規定ヲ設クルコトヲ我方ニ於テ受諾スルノ方決モアリ得ベシ\n\n三（一）日本國軍隊ノ武裝解除及撤收（第九項）\n\n之ニ付テハ一般的ノ停戰協定ヲ以テ定ムルヲ本筋トシ同時ニ出先軍ニ於テ敵側現地軍ト地方的協定ヲ必要トスル場合モアルベシ、此ノ場合武器ノ處分ヲ規定スルノ要アリ\n\n日本國内ニ存スル軍隊ノ武裝解除ハ我方ニ於テ自發的ニ之ヲ行フヲ適當トスベク先方之ニ同意ヲ與フル場合ニ於テモ之ガ監督方ヲ申出デ來ル可能性アリ、且武器ノ引渡及破壞ノ方決ニ付考慮シ置クノ要アリ\n\n出先軍隊ノ撤收ニ關シテハ單ニ敵現地軍トノ間ノミナラズ當談地方政權ト協定ヲ遂グルノ要アルベシ\n\n尙「ポツダム」宣言ノ條項ヲ離レ次ノ問題ヲ考慮スルノ要アリ\n\n四（一）戰鬪停止ノ時期ト形式\n\n無條件降伏ノ宣言ト同時ニ自動的ニ戰鬪停止セラルベシトノ了解ヲ事前ニ我方ヨリ求ムベキカ、又ハ右宣言ヲ爲シタル後(イ)一般的停戰協定ヲ締結スルカ又ハ(ロ)其ノ間ニ暫定的停戰ヲ一應彼我ノ間ニ取極ムルカ若ハ(ハ)斯カル取極ヲ全然行ハズ暗默ノ間ニ双方事實上停戰ノ狀態ニ入ルコトトスルカノ問題\n\n五（一）以上各項ノ取極ヲ行フ場合政府ガ之ニ干與スル場合ハ勿論統帥府ガ之ニ當ル場合モ外務省其ノ他ノ係官ガ之ニ參加スルヤ否ヤノ問題、參加ストセバ其ノ資格ノ問題\n\n三、非軍事的條項ノ取扱\n\n我方トシテ
