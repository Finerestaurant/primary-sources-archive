cident and given this extreme Soviet sensitivity towards their frontiers, operations of the character proposed might well convince the Kremlin of the need to take protective measures against their possible violations and injury and thus lead to a reoecupation of North Korea by Soviet armed forces. In this connection, one cannot exclude the possibility that they might place Soviet strategic bombing planes at the disposition of North Korean forces for attacks against UN forces in Korea and even our bases in Japan.\n\nIn short, the bombing of Rashin or of any other place of equal proximity to the Soviet or Manchurian frontier runs the pressing danger of causing the Soviet Union to react in the very way we wish to avoid. It is therefore the Department’s opinion that before a decision is made, the specific military advantages which might be expected to accrue from the proposed attack on Rashin should be carefully weighed against the risk of the grave political and military consequences outlined above. The Department of Defense has indicated that Rashin is believed to afford storage for about 28% of the petroleum supplies for North Korea, but the significance of this is not clear in view of the distance which separates Rashin from the fighting front and the town’s proximity to Soviet territory which itself must offer extensive facilities for storage and stockpiling. [주1]\n\nDean Acheson\n\n[723면]", "notes": ["[주1] 애치슨은 9월 11일 트루먼 대통령을 만나 이 각서를 두고 떠났으며, 이후 그들의 대화에 관해 다음 비망록을 구술했다. \"나는 이 각서를 대통령에게 두고 가서 그것에 관해 그와 간략히 상의했다. 그는 우리 견해 쪽으로 강하게 기울어 있으며, 브래들리 장군 거의 그 생각이라고 믿는다. 나는 국방부가 대통령에게 보고할 때 이 점을 염두에 둘 수 있도록 각서 사본을 국방부에 보냈다고 말했다.\" (795.00/9–1150) 국방부는 합동참모본부가 이미 9월 8일에 맥아더에게 당분간 나진에 대한 추가 공격을 하지 말기를 바란다고 통보했다는 취지의 정보를 제공했다. 9월 26일에 합동참모본부는 기본 목표 지령을 철회함으로써 폭격 계획 자체를 전면 중단시켰다. (Schnabel, Policy and Direction, 346쪽 참조.)"], "warn": false, "pages": ["50-722", "50-723"], "search": "Acheson, Dean 애치슨 Truman, Harry S. 트루먼 MacArthur, Douglas 맥아더 Bradley, Omar 브래들리"}, {"id": "50-d512", "order": 28, "date": "1950-09-14", "group": "C", "eyebrow": "50-d512 · Memorandum Prepared in the Department of State", "title": "국무부에서 작성한 각서", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-09-14"}, {"k": "시각", "v": null}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "795.00/9–1450", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d512"}], "summary": "3국 예비회담에서 합의된 38선 처리 방침을 국무장관 설명용으로 간추린 문서. 개정된 미국 입장(NSC 81/1)을 포함한다.", "points": ["유엔군의 38선 이북 진입은 원칙적으로 사전 유엔 지시가 필요하며, 38선 이남 작전에 부수한 전술적 행동은 예외로 한다.", "소련 또는 중국 공산군이 38선까지 북한을 점령했거나, 주요 전투 부대가 유엔군과 교전했거나 교전 의도가 명백하면 38선 이북으로 가지 않는다.", "유엔 총회는 조속히 한국에 관한 광범한 목표를 정하고, 독립·통일을 겨냥한 기존 결의 이행의 필요성을 강조해야 한다.", "현 대한민국 정부의 연속성과 38선 이남 주권은 계속 인정하고, 유엔 감시 아래 치른 기존 선거의 유효성에 이의를 제기하지 않는다.", "38선 이북 점령 목적의 작전은 유엔 회원국과 협의·승인을 거친 후에만 실시하며, 롤백을 위한 상륙·공수·지상 작전은 위험을 고려해 워싱턴의 추가 승인을 받는다."], "primary": "top secret\n\n[워싱턴,] 1950년 9월 14일.\n\nSFM D–7/3a 개정판\n\n9월 외상회의\n\n국무장관 브리핑을 위한 한국 관련 요약\n\n첨부된 브리핑 문건은 NSC 81/1에서 확정된 미국의 입장을 포함하도록 개정되었다.[주1][주2]\n\n[727면]\n\n[부속서]\n\n국무장관 브리핑을 위한 한국 관련 요약\n\n3국 예비토의에서 다음 주요 사항에 관해 대체로 합의가 이루어졌다:\n\n1. 한국 문제에 관해 유엔에서 현재의 인상적인 수준의 일치를 유지하기 위해 모든 노력을 기울여야 한다.\n\n2. 유엔군은 사전 유엔 지시 없이 38선 이북으로 진격하도록 투입되어서는 안 된다. 이는 38선 이남 작전에 부수한 전술적 행동을 배제하는 것이 아니다.\n\n3. 소련 또는 중국 공산군이 38선까지 북한을 점령한 경우, 또는 소련이나 중국 공산군의 주요 전투 부대가 유엔군을 상대로 교전을 벌였거나 교전 의도가 명백한 경우 유엔군은 38선 이북으로 진격해서는 안 된다.\n\n4. 유엔 총회는 한국에 관한 자신의 광범한 목표와 의도를 조속히 수립해야 하며, 한국의 독립과 통일 달성을 지향한 기존 유엔 결의들을 이행할 필요성을 강조해야 한다.\n\n5. 선거 실시를 포함하여 독립적이고 통일된 한국 수립과 관련된 문제에 관해 유엔에 권고하기 위해, 높은 비율의 아시아 회원국을 포함한 고위급 대표들로 구성된 위원회를 구성해야 한다.\n\n6. 교전 종료 후 재조정 기간 동안 강력한 아시아 병력 참여를 포함한 유엔군이 한국에 주둔해야 한다.\n\n7. 한국 정부에 대한 유엔의 계속된 정치·경제 원조가 필요할 것이다.\n\n현재의 대한민국 정부의 향후 권한과 관할과 관련하여 영국 및 프랑스와 다음 취지의 합의를 도모해야 한다:\n\n(a) 38선 이남 한국에 대한 대한민국의 연속성과 주권은 계속 인정되어야 한다.\n\n(b) 유엔 감시 아래 대한민국이 이전에 실시한 선거의 유효성은 문제 삼지 않아야 한다.\n\n(c) 기회가 오면, 그 지역에서 대한민국의 권한을 궁극적으로 확장하기 위해 38선 이북 한국에서 유엔 감시 아래 선거를 실시해야 한다.\n\n위 2항과 관련하여, NSC 81/1에서 확정된 미국의 입장은 다음과 같이 요약될 수 있다:\n\n북한 점령을 목적으로 하는 38선 이북 작전은 유엔 회원국과 협의하고 승인을 얻은 후에만 실시될 것이다. 유엔군은 현재 북한군을 이 선 너머로 철수시키거나 이들을 격멸하기 위해 38선 이북에서 작전을 수행할 법적 근거를 갖는다. 그러나 유엔군 사령관은 롤백을 위한 상륙 작전, 공수 작전 또는 지상 작전을 포함한 그러한 작전을 개시하기 전에, 관련된 위험을 고려하여 워싱턴으로부터 추가 승인을 획득해야 한다.\n\n[728면]\n\n[주1] 8월 28일자 문건 SFM D–7/3a의 본문은 p. 653 참조.\n[주2] 9월 9일자, p. 712.", "secondary": "top secret\n\n[Washington,] September 14, 1950.\n\nSFM D–7/3a Revised\n\nSeptember Foreign Ministers Meetings\n\nsummary for briefing of the secretary on korea\n\nThe attached brief has been revised [주1] to include a statement of the U.S. position as established in NSC 81/1. [주2]\n\n[727면]\n\n[Annex]\n\nSummary for Briefing of the Secretary on Korea\n\nDuring the preliminary tripartite discussions general agreement was reached on the following main points:\n\n1.\n\nEvery effort should be made to maintain the present impressive degree of unanimity in the UN on the Korean question.\n\n2.\n\nUN forces should not be committed to proceed north of the 38th Parallel without prior UN direction. This would not preclude tactical operations incident to actions south of the 38th Parallel.\n\n3.\n\nUN forces should not proceed north of the 38th Parallel if Soviet or Chinese Communist forces have occupied North Korea to the 38th Parallel or if major Soviet or Chinese Communist combat units have engaged or clearly intend to engage in hostilities against UN forces.\n\n4.\n\nThe GA should formulate its broad objectives and intentions with respect to Korea at an early date, emphasizing the necessity of implementing previous UN resolutions directed to the achievement of the independence and unification of Korea.\n\n5.\n\nA commission of representatives of senior rank with a high percentage of Asian members should be formed to make recommendations to the UN on problems relating to the establishment of an independent and unified Korea, including the holding of elections.\n\n6.\n\nUN forces with strong Asian participation should be retained in Korea during the period of readjustment following the cessation of hostilities.\n\n7.\n\nContinued UN political and economic assistance to the Korean Government will be necessary.\n\nAgreement with the British and French should be sought as to the future authority and competence of the present Government of the Republic of Korea in the following sense:\n\n(a)\n\nThe continuity and sovereignty of the ROK should continue to be recognized over Korea south of the 38th Parallel.\n\n(b)\n\nThe validity of the elections previously held by the ROK under UN supervision should not be challenged.\n\n(c)\n\nElections under UN supervision should be held when opportunity offers, in Korea north of the 38th Parallel for the ultimate extension of the authority of the ROK in that area.\n\nWith reference to paragraph 2 above, the U.S. position as established in NSC 81/1 may be summarized as follows:\n\nOperations north of the 38th Parallel for the purpose of the occupation of North Korea would be undertaken only after consultation with and approval of United Nations members. The UN forces now have a legal basis for conducting operations north of the 38th Parallel to compel the-withdrawal of the North Korean forces behind this line or to defeat these forces. However, the UN Commander, before undertaking such operations, including amphibious and airborne landings or ground operations in pursuance of a rollback, would, in view of the risks involved, obtain further authorization from Washington.\n\n[728면]", "notes": ["[주1] 1950년 8월 28일자 SFM D–7/3a 문건. FRUS 1950 제7권 653면에 수록되어 있다.", "[주2] 1950년 9월 9일자 NSC 81/1 문건. 같은 책 712면에 수록되어 있다."], "warn": false, "pages": ["50-727", "50-728"], "search": ""}, {"id": "50-d528", "order": 29, "date": "1950-09-22", "group": "D", "eyebrow": "50-d528 · Memorandum by Mr. John Foster Dulles, Consultant to the Secretary of State, to the Secretary of State", "title": "국무장관 고문 덜레스가 국무장관에게 보낸 각서", "badge": "secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-09-22"}, {"k": "시각", "v": null}, {"k": "발신", "v": "John Foster Dulles, Consultant to the Secretary of State 덜레스(국무장관 고문)", "txt": true}, {"k": "수신", "v": "the Secretary of State 국무장관", "txt": true}, {"k": "장소", "v": "New York"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "795.00/9–2250", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d528"}], "summary": "덜레스가 유엔 총회에서 한국 통일이라는 정치 목표를 내걸 경우 소련과 중공의 군사적 개입을 불러올 위험을 경고하고, 미국은 먼저 나서지 말고 인도 등에 주도권을 넘기라고 조언한다.", "points": ["군사 작전과 정치 목표는 분리될 수 없으며, 군사적으로 달성할 수 없는 정치 목표를 총회가 무책임하게 내걸지 않도록 미국이 경계해야 한다.", "유엔의 한국 통일 시도는 소련이 뤼순과 블라디보스토크에 가까운 지역으로 미국의 영향력과 군사력이 확장되는 것으로 받아들여 중공군과 소련군의 강력한 반격을 초래할 수 있다.", "그렇다고 유엔이나 미국이 통일 한국의 이상을 부인할 수도 없다. 그렇게 하면 남북한 전체 조선인의 지지와 호의를 잃는다.", "미국은 군사력을 제공하는 주된 책임을 지고 있으므로, 공개적으로 부인할 수도 없고 군사적으로 뒷받침하지도 못할 정치 목표를 유엔 총회에 먼저 제안해서는 안 된다.", "인도에 더 많은 책임을 맡기는 방안을 검토하라. 인도가 달성하기 어려운 목표를 제안하면 병력 제공을 요구하고, 조선인이 불충분하다고 여길 목표를 제안하면 인도의 위신만 깎인다.", "인도가 공산주의자들의 통제 하에 놓일 조건으로 통일을 제안할 위험은 있으나, 어떤 평화적 조건에서도 선거를 하면 인구의 3분의 2인 남쪽의 압도적 반공 표 때문에 공산당이 통제하기는 어렵다."], "primary": "비밀\n US/A/2543 US/S/1437\n\n[뉴욕,] 1950년 9월 22일.\n\n제목: 한국\n\n유엔이 한국의 장래 군사 및 정치 전개에 대해 책임을 느끼고 또 행사해야 한다는 것은 의심할 여지 없이 타당하다. 그러나 이 문제는 매우 신중하게 다루어야 한다:\n\n1.\n\n군사 작전은 한 구획(안전보장이사회)에서 다루고 정치 목표는 다른 구획(총회)에서 다루는 것은 비현실적이며 때로는 위험하기까지 하다. 두 문제는 떼려야 뗄 수 없이 연결되어 있다. 군사 작전은 정치 목표를 달성하도록 설계되어야 하며, 다른 한편으로 정치 목표는 그것을 달성할 힘이 있는지를 고려해야 한다. 유엔 조직의 성격상 어느 정도 분리가 불가피할 수 있으나, 미국은 총회가 — 소련을 상대로 한 전면전에서 승리하지 않는 한 — 군사적으로 달성할 수 없는 정치 목표를 무책임하게 내걸지 않도록 경계해야 한다.\n\n2.\n\n우리는 현재로서는 한국에 국한된 유엔의 조치로 한국을 “통일”하는 것이 가능할지 알 수 없다. 그렇게 되면 소련이 자국의 영향권 및 군사력으로 간주할 지역이 뤼순과 블라디보스토크에 매우 가까운 곳까지 확장되는 결과를 낳을 것이며, 그러한 지역이 적대 세력의 수중에 들어갈 경우 소련의 동부 주요 기지 두 곳을 무력화하거나 파괴할 수도 있다. 이러한 결과를 암시하는 듯한 어떤 노력도 중공군과 소련군의 매우 강력한 대응에 직면할 수 있으며, 현실적으로 그에 맞설 수 없을 뿐 아니라 그 시도를 감행하는 것은 머나먼 아시아 대륙의 한 지역에 미군을 집중시키는 결과를 초래하여 세계 다른 곳에서의 우리의 모든 목표를 위태롭게 할 것이다.\n\n3.\n\n다른 한편으로, 유엔도 미국도 통일 한국이라는 이상을 부인할 수는 없다. 그렇게 하는 것은 남쪽은 물론 북쪽까지도 포함한 전체 조선인의 호의와 지지를 잃는 일이 될 터인데, 통일이야말로 조선인이 이해하고 또 열광적이고 희생적인 노력으로 뒷받침할 유일한 쟁점이기 때문이다.\n\n4.\n\n이러한 상황에서 군사력을 제공하는 주된 책임을 지고 있는 미국은, 우리가 공개적으로 부인할 수도 없으면서 또한 우리가 뒷받침할 수도 없는 정치 목표를 유엔 총회에서 제안하는 데 앞장서지 말아야 한다고 생각된다. 나는 이 점에 있어 미국이 기다리는 게임을 하면서 정치 목표에 관해서는 다른 나라들이 주도권을 잡도록 해야 한다고 제안한다. 인도에 더 많은 [752면] 책임을 맡기는 방안을 모색하는 것이 유용할 수 있다. 인도가 달성하기 어려운 정치 목표를 제안한다면, 우리는 인도에 이 목표 달성을 돕기 위한 병력을 제공하라고 요구할 수 있다. 인도가 조선인들이 불충분하다고 여기고 유엔 정책의 후퇴를 수반하는 정치 목표를 제안한다면, 그것은 인도의 위신에 타격을 줄 것이지 우리의 위신에는 타격을 주지 않을 것이다.\n\n물론 인도가 공산주의 세력의 통제 아래 놓일 가능성이 높은 조건으로 한국의 통일을 제안할 위험은 있다. 그러나 남쪽이 인구의 3분의 2를 차지하고 있다는 사실에 비추어 보면, 거의 모든 평화적 조건 하에서 실시되는 선거는 공산주의에 반대하는 압도적인 남쪽의 표를 낳을 것이고, 이는 북쪽의 거의 만장일치에 가까운 공산주의 표로도 뒤집을 수 없을 것이기 때문에, 어떻게 그러한 상황이 발생할 수 있을지 알기 어렵다. 또한, 한국 전체는 대체로 미국의 경제 원조에 의존하게 될 것이다.\n\n물론 그 투표 결과가 의회 내에 강력한 공산주의 소수파 대표를 탄생시켜 장래의 문제를 야기할 가능성도 있다. 그러나 일단 비공산주의 세력이 우세한 통제 아래 통일 정부가 수립되고 유엔과 미국의 경제 원조가 제공된다면, 전복 활동과 폭력적인 권력 탈취 시도에 대한 보호 장치가 마련된다는 전제 하에 공산주의 세력은 위축될 것으로 보인다.", "secondary": "secret \n US/A/2543 US/S/1437\n\n[New York,] September 22, 1950.\n\nSubject: Korea\n\nIt is no doubt sound that the United Nations should feel and exercise responsibility for the future military and political developments in Korea. However, this needs to be handled with great discretion:\n\n1.\n\nIt is unrealistic and sometimes dangerous when the military operations are dealt with in one compartment (Security Council) while political objectives are in another compartment (General Assembly). The two problems are inextricably related. A military operation should be designed to achieve political objectives and, on the other hand, political objectives should take account of whether there is the power to achieve them. The nature of U.N. organization may require a measure of separation, but the U.S. must be on its guard lest the General Assembly irresponsibly lay down political objectives which could not be achieved militarily, unless by victory over Russia in a general war.\n\n2.\n\nWe cannot know now whether it will be possible to “unify” Korea by United Nations action localized to Korea. That would involve an extension of what the Soviet Union would regard as U.S. influence and force into areas very close to Port Arthur and Vladivostok and which, if held by unfriendly elements, could neutralize or destroy these two main Soviet eastern bases. Any effort which seemed to imply this result might be met by Chinese Communist and Soviet force so strong that, as a practical matter, it could not be matched and commitment to attempt it would involved such concentration of U.S. forces in a remote Asiatic land area that it would endanger all of our objectives elsewhere in the world.\n\n3.\n\nOn the other hand, neither the U.N. nor the U.S. can repudiate the ideal of a united Korea. To do that would be to alienate the good will and support of all the Korean people, south as well as north, as unity is the one issue that the Korean people understand and will back with enthusiastic and sacrificial effort.\n\n4.\n\nUnder these circumstances it seems that the U.S., which has the primary responsibility for supplying the military force, should not take the initiative in the U.N. Assembly to propose political objectives which we cannot publicly repudiate but which, also, we may not be able to back up. I suggest that the U.S. should, in this respect, play a waiting game and let others take the initiative with respect to political objectives. It might be useful to explore putting more responsibility on [752면] India. If it proposes political objectives which will be difficult to obtain, then we can ask India to supply forces to help achieve these objectives. If India proposes political objectives which the Koreans will deem inadequate and involve a reversal of U.N. policy, then that will hurt India’s prestige and not ours.\n\nThere is, of course, the danger that India might propose a unity of Korea under conditions which would make it likely that that unity would be controlled by communist elements. However, it is not easy to see how this could be in view of the fact that under almost any peaceful conditions an election would give an overwhelming vote in the south against communism which, since the south represents two-thirds of the population, could not be overcome even by an almost unanimous communist vote in the north. Also, all Korea will depend largely on U.S. economic aid.\n\nThe vote might, of course, result in a strong communist minority representation in the Assembly which would be a cause of future trouble. But presumably, once a united government was established under predominantly non-communist control, and with U.N.–U.S. economic aid, the communist strength would recede, provided there were protection against subversive effort and a violent seizure of power.", "notes": [], "warn": false, "pages": ["50-752"], "search": "John Foster Dulles 덜레스(John Foster Dulles)"}, {"id": "50-d530", "order": 30, "date": "1950-09-22", "group": "D", "eyebrow": "50-d530 · Draft Memorandum by Mr. John P. Davies of the Policy Planning Staff", "title": "정책기획실 존 P. 데이비스의 초안 각서", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-09-22"}, {"k": "시각", "v": null}, {"k": "발신", "v": "John P. Davies, 정책기획실", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "795.00/9–2250", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d530"}], "summary": "데이비스가 크렘린이 북한 방어를 포기하고 불개입을 택했다고 분석하고, 북한 주민을 향한 평화·통일 조건 선언이 필요하다고 제안한다.", "points": ["크렘린은 유엔군이 밀려나지 않을 것과 북한만으로는 방어가 불가능함을 깨달았다.", "소련은 북한 방어에 개입하는 첫 번째 선택 대신, 한국 분쟁에 불개입하는 두 번째 선택을 했다.", "크렘린이 북한 상실을 각오했다면, 우리를 깊숙이 유인해 타격하려 하거나 시간을 끌며 북한 저항을 연장하려 할 것이다.", "소련이 북한을 포기할 경우, 북한 지도부와 주민 사이에 균열이 생길 수 있다.", "평화, 보복 배제, 통일이라는 대안을 북한 군인과 주민에게 제시해야 하며, 신중한 군사적 탐색 후 선언하거나 즉시 발표해야 한다."], "primary": "일급비밀\n\n[워싱턴,] 1950년 9월 22일.\n\n지난 몇 주 동안의 어느 시점에—늦어도 지난주까지는—다음이 크렘린에 분명해졌음이 틀림없다. (1) 우리가 한반도에서 밀려나지 않을 것, (2) 한반도 전체를 자기 통제 아래 두려는 도박은—적어도 이번 회에서는—실패했다는 것, (3) 북한만으로는 북한 지역을 지켜낼 수 없다는 것이다.\n\n그 결정의 순간에 크렘린에는 두 가지 기본 선택이 있었다.\n\n어떤 형태로든 북한 방어에 스스로 개입하는 것이 하나였다 (북경은 분명히 불 속의 밤을 꺼내려 하지 않았다). 이는 38선이 격화된 쟁점이 되기 훨씬 전에 분명한 경고가 되어, 유엔이 6월 25일 이전의 현상 회복 이상을 시도하지 않는다는 데 동의할 시간을 주고, 소련이 현지에서 신중하고 세밀하게 자체 병력을 배치할 수 있게 해주었을 것이다. 그러나 크렘린이 미국인의 변덕스러운 기질이라고 여길 수밖에 없는 점을 고려할 때, 그러한 행동은 소련의 계산으로는 미국과의 전쟁 위험 또한 수반했을 것이다. 나아가 그러한 행동은 아무리 포장해도 소련의 대의에 불리한 세계적 정치 파장을 낳았을 것이다.\n\n크렘린의 두 번째 선택은 한국 분쟁에 개입하지 않는 것이었다. 선택된 것은 이것이었다. 그렇게 함으로써 크렘린은 유엔군이 38선 이북으로 진격하는 것을 막을 수 있는 최적의 기회를 포기했다. 북한을 지키기 위한 결정적 행동을 미루는 것이 그러한 행동의 위험을 줄이거나 정치적 불이익을 최소화할 것이라고 믿을 만한 확실한 이유는 없었다. 오히려 시간이 흐를수록 뒤따르는 직접 개입의 위험과 정치적 손실은 증가할 것이라고 상정해야 했다.\n\n반대 증거가 없는 한, 따라서 우리는 다음과 같은 두 가지 대안적 결론을 끌어낼 수 있다 (이는 북경에도 마찬가지로 적용된다). 첫째, 크렘린이 북한을 유지하기로 결심했다면 현재의 행로는 미국과의 전쟁 위험이 증가하는 것을 의도적으로 감수하고 있다는 것이다. 둘째, 크렘린이 아제르바이잔의 경우처럼 북한의 상실을 받아들일 준비가 되어 있다는 것이다—단, 심각한 미국과의 전쟁 위험을 수반하지 않는다고 판단되는 개입 기회가 우연히 생기지 않는 한 말이다.\n\n[754면]\n\n첫 번째 대안의 논리적 전개는, 크렘린이 우리를 과도한 개입과 과도한 확장 속으로 한반도 깊숙이 유인한 다음 압도적 병력으로 타격하려 할지도 모른다는 것이다. 우리가 항상 경계해야 할 가능성이다. 그러나 이는 우리가 한국 분쟁에 참여했을 때 감수했던 위험이다. 어둡고 위협적인 불확실성이 닥칠 때 신중함과 지혜의 역할은 조용히 그리고 자신 있게 자신의 일을 추진하는 것인 상황이 인간사에는 존재한다.\n\n우리가 의심할 이유가 있듯이, 크렘린이 한국을 잃을 각오가 되어 있다는 근본적 결정을 내렸다 해도, 그것이 결코 러시아 지도자들이 가만히 앉아서 붕괴를 수수방관하리라는 뜻은 아니다. 그들은 유연하고 기회주의적인 정치-군사적 관점에서 생각하고 계획하고 움직이기 때문에, 현 군사작전의 최종 국면뿐 아니라 미래에도 계속 기회를 노리며 게임을 할 것이다.\n\n이 경우 크렘린은 가능한 한 북한의 저항을 오래 끌려 할 것으로 예상할 수 있다. 모스크바가 북경에 북한을 구원하라고 압박해 왔다면, 그 압박은 유지될 공산이 크다. 한편 소련과 위성국 정부들은 유엔과 다른 경로를 통해, 그리고 협박과 거래 제안을 통해 북한을 보존하는 방식으로 적대행위를 종식시키려 할 것이다. 38선 이북으로 진격하는 데 대한 어떤 망설임의 기색도 이용될 것이다. 그리고 북한군의 최종적 패배가 다가옴에 따라, 크렘린은 토착 정치적 앞잡이 대부분과 회수 가능한 군사 요소들을 소련과 만주로 철수시킬 것이다. 우리가 한국 분쟁이 끝나고 승리를 거두었다고 생각한 후에도, 이들 요소와 그 후계자들은 국경 너머에서 한국을 상대로 선동, 파괴 공작, 폭력 행위에 투입될 것이다. 이는 소련 체제가 존재하고 한국이 그 체제로부터 독립되어 있는 한 계속될 것이다.\n\n보다 먼 미래에 대한 예측은 여기까지다. 이제 현 상황으로 돌아가자. 크렘린이 북한을 운명에 맡길 준비가 되어 있다면, 북한의 토착 지도자들과 주민 대중 사이에는 분열을 일으킬 만한 조건이 존재할 것이다. 정권은 자신이 지배해 온 주민을 배신한 처지에 있다. 일부 지도자가 끝까지 싸우는 상징적 희생을 할 수도 있겠지만, 대부분은 소련과 만주로 도피할 궁리를 하며 뒤를 돌아볼 것이기 때문이다. 북한 군인과 민간인 대다수에게는 도피할 가능성도 없거나 고향 땅을 떠나고 싶은 마음도 없다. 평균적 군인과 시민이 이 사실을 완전히 깨닫게 되면, 북한에 존재하는 응집력은 심각하게 [755면] 약화될 것이다. 그들이 지금 마주한 모든 것—패배, 보복, 소멸—에 대한 희망적 대안을 본다면, 현재 그들과 지도자들 사이에 존재하는 심리적 유대감은 무너질 것이다.\n\n이 상황에서 지금 빠진 것은 우리 측에서 북한 군인과 시민 대중에게 평화, 보복 배제, 통일, 그리고 견딜 만한 미래의 삶이라는 대안을 제시하는 선언이다. 그러나 이 순간 그러한 제안을 내놓는 데는 일정한 위험이 따른다. 평화, 해방, 통일을 위한 조건의 천명은 유엔—우리를 포함한—이 북한에서 그 조건들을 이행하겠다는 약속을 함축한다. 그 자체로 그렇게 하는 이들, 즉 우리—나아가 우리 동맹국들은 더욱 그러하다—가 소련이 북한 방어를 결의한다고 선언할 경우 기꺼이 이행하지 않으려 할 약속이 된다. 따라서 신중하고 확실한 행로는 38선 훨씬 이북에서 탐색적 군사행동으로 소련(과 중국)의 의도를 시험하고, 반응이 없으면 그 군사적 거점을 유지·확대하면서 동시에 평화, 해방, 통일을 위한 조건을 발표하는 것이다.\n\n그러한 탐색적 행동이 앞으로 이삼 일 안에 가능하다면, 조건의 선언은 미룰 수 있을 것이다. 그러나 가능하지 않다면, 우리는 그 선언을 즉시 해야 한다. 적의 저항을 줄이고, 미군의 생명을 구하고, 분쟁의 기간을 단축할 가능성이 관련된 위험과 어려움을 능가한다.", "secondary": "top secret\n\n[Washington,] September 22, 1950.\n\nAt some time during the past several weeks—but not later than last week—it must have become evident to the Kremlin that (1) we would not be thrown off the Korean peninsula, (2) the gamble for bringing all of Korea under its control was lost—at least for this inning—and (3) it could not count on its North Korean stooges alone to hold North Korea.\n\nAt that time of decision the Kremlin had two basic choices.\n\nIt could have in one form or another committed itself to the defense of North Korea (Peiping apparently having declined to snatch the chestnut from the fire). This would have been a clear warning well in advance of the 38 parallel’s becoming an inflamed issue, allowing the United Nations time to reconcile itself to attempting no more than the restoration of the status quo ante June 25, and enabling the U.S.S.R. to make on the ground careful and detailed dispositions of its own. However, given what the Kremlin must regard as the mercurial American temperament, such action, in Soviet calculations, would have also involved the risk of war with the United States. Furthermore, such action, no matter how dressed up, would have had world-wide political repercussions unfavorable to the Soviet cause.\n\nThe second choice for the Kremlin was to remain uncommitted in the Korean conflict. This was the choice which was made. In so doing, the Kremlin abandoned the optimum opportunity for guaranteeing that UN forces would be prevented from pressing north of the 38th, parallel. There could have been no solid reason to believe that delay in moving decisively to hold North Korea would lessen the risks or minimize the political disadvantages of such action. Bather, it was to be assumed that with the passage of time the risks and political losses from subsequent direct intervention would increase.\n\nIn the absence of evidence to the contrary, we are therefore warranted in drawing the following two alternative conclusions (which are likewise applicable to Peiping). The first is that, if the Kremlin is, determined to retain North Korea, its present course involves a deliberate acceptance of increasing risks of war with the United States. The second is that the Kremlin is prepared to accept the loss of North Korea, as it did that of Azerbaijan—unless by chance an opportunity appears for intervention without what it would consider serious risks, of war with the United States.\n\n[754면]\n\nThe logical development of the first alternative would be that the Kremlin may be seeking to lure us into over-commitment and overextension deep into the peninsula, whereupon it would strike with overwhelming force. This is a possibility against which we must ever be on guard. It is a risk, however, which we accepted when we joined in the Korean conflict. It is one of the situations in human affairs when, threatened by dark and menacing uncertainties, the part of both prudence and wisdom is to proceed confidently and quietly about one’s own business.\n\nIf, as we have reason to suspect, the Kremlin has made the fundamental decision that it is prepared to lose Korea, it by no means follows that the rulers of Russia will sit back and passively watch the collapse. Because they think, plan and operate in flexible, opportunistic politico-military terms they will keep playing the game for the breaks, not only in the final phases of the current military operations but on into the future.\n\nIn this contingency we may expect the Kremlin to attempt to prolong North Korean resistance as long as possible. If Moscow has been pressing Peiping to go to the rescue of North Korea, that pressure is likely to be maintained. Meanwhile, the Soviet and Satellite governments may be expected to seek, through the United Nations and other channels and by means of intimidation and offers of a deal, to bring hostilities to an end in such a fashion as to preserve North Korea. Any signs of hesitation over advancing north of the 38th parallel would be exploited. And as the final defeat of the North Koreans approaches, the Kremlin would withdraw most of the its native political stooges and such military elements as can be salvaged across the frontiers into the USSR and Manchuria. After we consider the North Korean conflict to be over and victory won, these elements and their successors will be employed for agitation, subversion and violence across the borders against Korea. This will continue so long as the Soviet system exists and Korea remains independent of it.\n\nSo much for a projection into the more distant future. Let us now return to the present situation. If the Kremlin is prepared to leave North Korea to its fate, a potentially divisive condition would exist between the native rulers of North Korea and the mass of the population. The regime is in the position of having betrayed the people it has dominated. For, although there may be some symbolic sacrifices by some of the leaders fighting to the bitter end, most of them will be looking over their shoulders for escape to USSR and Manchuria. For the great bulk of the North Korean soldiery and civil population there is either no possibility of escape or no desire to leave their native land. Once the average soldier and average citizen fully realizes this, such solidarity as exists amongst the North Koreans will be greatly [755면] strained. If they see a hopeful alternative to all that confronts them now—defeat, reprisals and extinction—such psychological bonds as now exist between them and their rulers will give way.\n\nWhat is now missing in this situation is a declaration from our side putting forward to the mass of North Korean soldiery and citizens an alternative—peace, no reprisals, unification and a tolerable future existence. But to advance such a proposal at this moment involves certain risks. A statement of the conditions for peace, liberation and unification implies an undertaking on the part of the United Nations, including ourselves, to fulfill those terms in North Korea. As such, it is a commitment on the part of those who make it, a commitment which we—and even more our allies—would not be willing to fulfill were the USSR to announce its determination to defend North Korea. Therefore, the cautious and sure course would be one whereby we would test Soviet (and Chinese) intentions by a probing military action well north of the 38th parallel and, if there were no reaction, to hold and expand that military position while simultaneously announcing the conditions for peace, liberation and unification.\n\nIf such a probing action can be undertaken two or three days hence, the proclamation of conditions might be delayed. But, if not, we should make the announcement forthwith. The probabilities of reducing enemy resistance, saving American lives and shortening the duration of the conflict outweigh the possible risks and difficulties involved.", "notes": [], "warn": false, "pages": ["50-754", "50-755"], "search": "John P. Davies 존 P. 데이비스"}, {"id": "50-d545", "order": 31, "date": "1950-09-26", "group": "C", "eyebrow": "50-d545 · Draft Memorandum by Mr. Robert G. Hooker of the Policy Planning Staff  An unsigned manuscript note in source text read: “Not considered by Staff”.", "title": "정책기획실 Robert G. Hooker의 각서 초안", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-09-26"}, {"k": "시각", "v": null}, {"k": "발신", "v": "Hooker, Robert G. (정책기획실)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서 초안"}, {"k": "원문출처", "v": "795.00/9–2650", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d545"}], "summary": "유엔군이 38선 이북으로 진격할 경우 동시에 취할 정치적 조치를 제안한다. 한국 중립화 방안을 총회에 제안하고, 일본 평화조약에 침략 방지 조항을 명시하겠다고 알리는 것이 골자다.", "points": ["유엔 지상군이 38선을 넘기로 결정하면, 그에 앞서 또는 동시에 정치적 조치를 취해야 한다고 주장한다.", "소련과 중공에 미국의 실제 의도(침략 의사 없음)를 가능한 한 실질적으로 확신시킬 필요가 있다고 본다.", "첫째 조치로 유엔 총회에 한국 중립화를 제안한다. 비무장화는 아니며, 유엔 회원국과 중공이 참여하는 컨소시엄으로 구현한다.", "중립화 컨소시엄 실행 또는 한국 내 선거 시행 중 더 늦은 시점까지 미군을 제외한 유엔군이 주둔하여 유엔 결의 이행을 보장하도록 총회에 제안한다.", "둘째 조치로 대일전 참전국을 일본의 미래 침략으로부터 보장하는 규정을 일본 평화조약에 포함시키겠다고 적절한 방식으로 알려야 한다고 본다.", "이런 정치적 조치 없이 유엔군이 38선을 넘는 것은 경솔하며, 진정으로 도발적일 수 있다고 적고 있다.", "Malik 발언(고위급 평화 회담 관심 표명)과 이에 대한 국무부 대변인의 논평(말보다 행동 요구)이 상황 판단의 배경 중 하나다."], "primary": "top secret\n\n[워싱턴,] 1950년 9월 26일.\n\n**유엔군이 38도선 이북으로 이동할 경우 취할 제안된 정치적 조치**\n\n가까운 미래에 한국의 평화와 안전 회복을 위한 조건을 제시해야 할 필요성, 지상군을 38도선 이북으로 이동시킬지에 대한 조기 결정을 내려야 할 필요성, 그리고 오늘 아침 신문에서 본 Mali—k의 볼티모어 모임 발언 [주2] 이 맞물려, 우리는 단호하고 결단력 있게 움직여야 할 뿐 아니라 소련과 중공에 우리의 실제 의도에 관해 가능한 모든 확신을 주도록 계산된 방식으로 움직여야 하는 상황에 놓여 있다.\n\n그러므로 지상군을 38도선 이북으로 보내기로 결정한다면, 우리는 그와 동시에 또는 약간 먼저 다음의 조치를 취해야 한다고 제안한다.\n\n(1)\n\n총회에 정식으로 다음을 제안한다. (a) 한국을 중립화하되, 영구적으로든 수년 동안이든 비무장화해서는 안 되며, 그러한 중립화는 유엔 참가국들과 중공이 당사국이 되는 컨소시엄에 담겨야 한다. (b) 그러한 컨소시엄의 실행 시 또는 한국에서의 선거 실시 시 중 더 늦은 때가 올 때까지, 미군은 포함되지 않는 유엔군이 유엔 결의의 이행을 보장할 목적으로 한국에 남아 있도록 총회에 정식으로 제안한다.\n\n(2)\n\n미국이 대일 전쟁 참전국들을 일본의 미래의 어떤 침략으로부터도 보장하는 규정을 일본 평화조약에 포함시킬 것을 주장하리라는 점을 어떤 적절한 방식으로 알린다.\n\n위의 제안들은, 유엔 지상군이 38도선 이북으로 가는 것이, 동시에 우리가 가능한 한 멀리 나아가 소련과 중공에게, 가능한 한 실질적인 방식으로, 미국이 대한민국 사태를 침략 목적으로 이용하거나 나중에 침략을 준비하기 위한 기지로 한국을 사용할 의도가 없다는 확신을 전달하지 않는다면, 진정으로 도발적이지 않다 하더라도 경솔한 일일 것이라는 확신에 기초한 것이다.\n\n----- 각주 -----\n[주1] 원문의 서명 없는 자필 주에는 \"직원이 검토하지 않음\"이라고 적혀 있다.\n[주2] Malik 은 미국과 소련 간의 고위급 평화 회담에 대한 자국 정부의 관심을 표명한 바 있다. 국무부 대변인은 이에 논평하면서 한국과 다른 곳의 평화를 확보하려면 말이 아니라 행동이 필요하다고 촉구했다.", "secondary": "top secret\n\n[Washington,] September 26, 1950.\n\nSuggested Political Actions To Be Taken in the Event U.N. Troops Move North of the 38th Parallel\n\nThe necessity for offering terms for the restoration of peace and security in Korea in the near future, and for making an early decision on whether to move ground troops north of the 38th parallel, together [784면] with Malik’s statement to the Baltimore group noted in this morning’s papers, [주2] all create a situation in which we must move not only firmly and decisively, but in a manner calculated to convey all possible reassurance to the U.S.S.R. and Communist China as to our real intentions.\n\nIt is therefore suggested that, if the decision is made to send ground troops north of the 38th parallel, we should take the following steps concurrently or slightly in advance:\n\n(1)\n\nPropose formally before the General Assembly that (a) Korea should be neutralized, but not be demilitarized, either permanently or for a period of several years, such neutralization to be embodied in a consortium to which the U.N. powers and Communist China should be parties; (b) propose formally before the General Assembly that pending the execution of such a consortium or the holding of elections in Korea, whichever shall occur later, U.N. forces, in which U.S. forces shall not be included, shall remain in Korea for the purpose of assuring the implementation of the U.N. resolutions.\n\n(2)\n\nMake known in some appropriate manner that the U.S. will insist upon provisions in the Japanese peace treaty guaranteeing the participants in the war against Japan against any future aggression by Japan.\n\nThe above suggestions are based upon the conviction that it would be imprudent if not genuinely provocative, if U.N. ground forces go north of the 38th parallel, unless at the same time we go as far as we can to convey to the U.S.S.R. and Communist China, in as substantive a manner as possible, assurance that the U.S. does not intend to use the Korean episode for purposes of aggression or to use Korea as a base to prepare later aggression.", "notes": ["[주1] 원문의 서명 없는 자필 주: \"Not considered by Staff\"은 초안이 정책기획실 내 공식 검토를 거치지 않았음을 뜻한다.", "[주2] \"Baltimore group\"은 당시 볼티모어에서 열린 모임으로 추정된다. 말리크(Yakov Malik)는 소련의 유엔 대사다."], "warn": false, "pages": ["50-784"], "search": "Hooker, Robert G. (정책기획실) Malik, Yakov (소련 유엔대사)"}, {"id": "50-d553", "order": 32, "date": "1950-09-27", "group": "B", "eyebrow": "50-d553 · The Secretary of Defense (Marshall) to the President", "title": "마셜 국방장관이 대통령에게 보낸 각서", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-09-27"}, {"k": "시각", "v": null}, {"k": "발신", "v": "Marshall 국방장관 마셜", "txt": true}, {"k": "수신", "v": "Truman 대통령 트루먼", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "795B.5/9–2750", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d553"}], "summary": "마셜이 38선 이북 작전을 허용하는 유엔군사령관 지시안을 트루먼의 승인에 올렸다.", "points": ["마셜이 유엔군사령관 지시안 초안을 대통령 승인에 첨부했다.", "이 지시는 NSC 81/1의 주된 군사적 측면을 이행하려는 것이다.", "국무장관과 마셜이 동의했으며, 합동참모본부가 작성하고 국무부가 마지막 문단을 제안했다.", "승인되면 유엔군사령관은 38도선 이북에서 북한군을 격멸하기 위한 군사 작전을 수행할 수 있다.", "작전 수행에는 지시 제2항의 조건들이 적용된다."], "primary": "top secret\n\nWashington, 1950년 9월 27일.\n\n친애하는 대통령 각하: 한국에서의 향후 행동 방침에 대한 합의된 미국 정책을 담은 NSC 81/1의 주된 군사적 측면을 이행하는 유엔군사령관 [793면] 지시안 초안을 각하의 승인을 위해 첨부합니다.\n\n국무장관과 저는 이 지시에 동의했으며, 이는 국무부가 제안한 마지막 문단을 제외하고 합동참모본부가 작성했습니다. [주1]\n\n각하의 승인이 있으면 유엔군사령관은 이 지시 제2항에 명시된 조건에 따라 북한군을 격멸하기 위해 38도선 이북에서 필요한 군사 작전을 수행할 수 있게 됩니다. [주2]\n\n충성스러운 마음으로,\n\nG. C. Marshall", "secondary": "top secret\n\nWashington, September 27, 1950.\n\nDear Mr. President: I am attaching, for your approval, a draft directive to the Commander of the United Nations’ Forces in Korea [793면] implementing the primarily military aspects of NSC 81/1 which contains the agreed U.S. policy on future courses of action in Korea.\n\nThe Secretary of State and I have concurred in this directive, which was prepared by the Joint Chiefs of Staff except for the final paragraph proposed by the Department of State. [주1]\n\nYour approval would permit the Commander of the United Nations’ Forces in Korea to conduct the necessary military operations north of the 38° to destroy North Korean forces, subject to the conditions specified in paragraph 2 of the directive. [주2]\n\nFaithfully yours,\n\nG. C. Marshall", "notes": ["[주1] 트루먼 대통령에게 제출된 지시안 초안의 본문은 9월 26일자 뉴욕행 전문 317호와 뉴욕발 전문 615호에 담긴 대로이다. pp. 781, 785.", "[주2] 이 지시는 1950년 9월 27일 트루먼 대통령의 승인을 받았고, 같은 날 합참이 전문 92801호로 맥아더 장군에게 송부했다."], "warn": false, "pages": ["50-793"], "search": "Marshall, George C. 마셜 Truman, Harry S. 트루먼 MacArthur, Douglas 맥아더"}, {"id": "50-d577", "order": 33, "date": "1950-09-30", "group": "D", "eyebrow": "50-d577 · Memorandum by the Director of the Office of Chinese Affairs (Clubb) to the Assistant Secretary of State for Far Eastern Affairs (Rusk)  The memorandum was also addressed to the Deputy Assistant Secretary of State for Far Eastern Affairs (Merchant).", "title": "중국담당국장 클러브가 극동담당 차관보 러스크에게 보낸 각서", "badge": "secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-09-30"}, {"k": "시각", "v": null}, {"k": "발신", "v": "중국담당국장 클러브(O. Edmund Clubb)", "txt": true}, {"k": "수신", "v": "극동담당 차관보 러스크(Dean Rusk), 극동담당 부차관보 머천트(Livingston T. Merchant)", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "795.001/9–3050", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d577"}], "summary": "포로 신문 보고를 근거로 북한군 내에 중국 공산군 출신 부대가 편입되어 있다고 보고한다.", "points": ["극동군 총사령부(GHQ FEC) 정보 분석에 따르면 중공군 제164사단과 제166사단이 1949년 8~9월 신의주와 나남을 통해 북한으로 이동하여 북한군 제5사단과 제6사단으로 각각 재편성되었다.", "이들 부대는 이동 전에는 만주에서 국민당군과 싸운 제3·제4 독립사단으로, 중공군에서 복무하던 조선인들로 구성되어 있었다.", "중공군 부대 자체가 북한으로 옮겨간 것은 1949년이지만, 이후에도 귀환한 조선인이 있다는 북경의 최근 발표와 이 보고는 연결될 수 있다.", "광저우 부시장이 마카오 비밀회의에서 유엔군이 제2전선을 열면 마오쩌둥이 인도차이나를 침공하고 동시에 타이완을 공격할 가능성이 있다고 발언했다는 별도 보고도 주목된다.", "저우언라이가 '한국군이 만주 국경까지 밀리면 국경 밖에서 싸우겠다'고 말했다는 보고 등으로 볼 때 중공 당국은 한국 정세에 깊이 우려하고 있으며 유엔군의 만주 국경 진출을 정권에 대한 심각한 위협으로 간주한다.", "중공군이 공개적으로 개입할지 최종 결정은 유엔군이 38선을 넘겠다고 위협할 때까지 내려지지 않을 수 있다."], "primary": "[Washington,] September 30, 1950.\n\nSubject: Chinese Communist Troops—Korea\n\nReference: CA Memo 9/27/50: “Chinese Communist Intentions”\n\nGHQ FEC reports: “An analysis of Korean PW reports reveals conclusively that the Chinese Communist 164th and 166th Divisions were moved into North Korea, via Sinuiju and Nanam, during Aug and Sep 49, and were redesignated as the North Korean 5th and 6th Divisions, respectively. These divisions, prior to their transfer to North Korea, were composed of Koreans serving with the Chinese Communist Army, and as the 3rd and 4th Independent Divisions, fought against the Nationalists in Manchuria.” [주*]\n\nAlthough this transfer took place in 1949, this report can be related to the recent Peiping admission that Koreans had returned from China to their homeland to participate in its defense and construction. It is of course possible, as implicit in the Peiping statement, that other Koreans have returned home at more recent dates.\n\nNote the further report [주†] that Canton Deputy Mayor Ku Ta-tsun stated at a secret conference in Macao on Aug. 4 that if UN forces opened a second front in Korea Mao Tse-tung would invade Indo-China and probably attack Taiwan at the same time; and, “part of the Communist offensive would be the capturing of military materiel in Hong Kong …”. A source comment cited by GHQ FEC was that the report that Chou En-lai had told a conference that if the Koreans were pushed back to the Manchurian frontier China’s policy would be to fight outside her borders and not wait for the enemy to come inside, and other reports, “indicate that Chinese Communist authorities are deeply concerned over the course of events in Korea and would regard the advance of UN forces to the Manchurian border as a serious threat to their regime. The final decision on whether the Chinese Communists will resort to overt participation in Korea may not be made until UN forces threaten to cross the 38th Parallel.”\n\n[830면]", "secondary": "secret\n\n[Washington,] September 30, 1950.\n\nSubject: Chinese Communist Troops—Korea\n\nReference: CA Memo 9/27/50: “Chinese Communist Intentions”\n\nGHQ FEC reports: “An analysis of Korean PW reports reveals conclusively that the Chinese Communist 164th and 166th Divisions were moved into North Korea, via Sinuiju and Nanam, during Aug and Sep 49, and were redesignated as the North Korean 5th and 6th Divisions, respectively. These divisions, prior to their transfer to North Korea, were composed of Koreans serving with the Chinese Communist Army, and as the 3rd and 4th Independent Divisions, fought against the Nationalists in Manchuria.” [주*]\n\nAlthough this transfer took place in 1949, this report can be related to the recent Peiping admission that Koreans had returned from China to their homeland to participate in its defense and construction. It is of course possible, as implicit in the Peiping statement, that other Koreans have returned home at more recent dates.\n\nNote the further report [주†] that Canton Deputy Mayor Ku Ta-tsun stated at a secret conference in Macao on Aug. 4 that if UN forces opened a second front in Korea Mao Tse-tung would invade Indo-China and probably attack Taiwan at the same time; and, “part of the Communist offensive would be the capturing of military materiel in Hong Kong …”. A source comment cited by GHQ FEC was that the report that Chou En-lai had told a conference that if the Koreans were pushed back to the Manchurian frontier China’s policy would be to fight outside her borders and not wait for the enemy to come inside, and other reports, “indicate that Chinese Communist authorities are deeply concerned over the course of events in Korea and would regard the advance of UN forces to the Manchurian border as a serious threat to their regime. The final decision on whether the Chinese Communists will resort to overt participation in Korea may not be made until UN forces threaten to cross the 38th Parallel.”\n\n[830면]", "notes": ["[주1] 이 각서는 극동담당 부차관보 머천트(Livingston T. Merchant)에게도 발송되었다.", "[주*] Information Summary #2929, 9/16/50, China, Manchuria, p. 5. [원문 각주]", "[주†] 같은 글, p. 6. [원문 각주]"], "warn": false, "pages": ["50-830"], "search": "클러브(O. Edmund Clubb) 러스크(Dean Rusk) 머천트(Livingston T. Merchant) Ku Ta-tsun Mao Tse-tung 마오쩌둥(毛澤東) Chou En-lai 저우언라이(周恩來)"}, {"id": "50-d593", "order": 34, "date": "1950-10-03", "group": "D", "eyebrow": "50-d593 · Memorandum by the Deputy Director of the Office of Northeast Asian Affairs (Johnson) to the Assistant Secretary of State for Far Eastern Affairs (Rusk)", "title": "동북아시아국 부국장(존슨)이 극동담당 국무차관보(러스크)에게 보낸 각서", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-10-03"}, {"k": "시각", "v": null}, {"k": "발신", "v": "동북아시아국 부국장 존슨(U. Alexis Johnson)", "txt": true}, {"k": "수신", "v": "극동담당 국무차관보 러스크(Dean Rusk)", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "795.00/10–350", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d593"}], "summary": "저우언라이의 경고를 전부 허풍으로 볼 수 없다며, 38선 이북에서는 한국군만 운용할 가능성을 타진하자고 제안한다.", "points": ["런던발 1934호 전문(10월 3일)에 언급된 저우언라이의 성명은 영국의 한국 결의안에 대한 결정적 조치를 막으려는 허풍 요소가 크지만, 전적으로 허풍이라고 가정할 수는 없다.", "맥아더 장군은 아직 38선 이북에 유엔군을 투입하지 않았으며, 한국군만으로도 군사 작전이 가능할지 시험하고 있는 것으로 보인다.", "북한 평정 작전을 전적으로 한국군이 수행하고 미국은 현재의 군수·전술 공중 및 해군 지원을 계속하는 방안을 진지하게 검토할 가치가 있다.", "이 방안은 작전에 대한 유엔의 우산을 유지하면서도 중국의 허풍을 시험하는 중대한 위험을 줄여준다.", "한국군 단독 점령은 우리가 기대했던 것보다 훨씬 유혈이 낭자하겠지만, 유엔한국위원단과 한국군에 배속된 미국 고문들이 어느 정도 억제력을 행사할 수 있을 것이다.", "국방부에 즉시 요청하여 (1) 38선 이북 유엔군 운용에 관한 맥아더 장군의 현재 의도와 (2) 이 작전을 수행할 한국군의 능력에 대한 그의 평가를 확인하자고 제안한다."], "primary": "top secret\n\n[워싱턴,] 1950년 10월 3일.\n\n건명: 한국 분쟁에 대한 중국의 개입 위협.\n\n참조: 10월 3일자 런던발 1934호. 저우언라이에 돌려진 성명(statement)에는 영국 측 한국 결의안에 대한 결정적 조치를 미연에 막으려는 허풍(bluff)의 요소가 의심할 여지 없이 크게 들어 있으나, 우리가 그것이 전적으로 허풍이라고 가정할 수 있다고는 보지 않는다.\n\n불행히도 이유는 분명하지 않지만, 맥아더 장군은 지금까지 38선 이북에 어떤 유엔군도 투입하지 않았다. 만일 그가 그렇게 했더라면 중국에 대한 우리의 입장은 훨씬 강했을 것이다. 그가 38선 이북에서 한국군을 시험하고 있는 것으로 보이는데, 이는 38선 이북에 유엔군을 투입하는 것이 군사적으로 반드시 필요하지는 않을 수도 있다는 생각에서 비롯된 듯하다. 우리는 38선 이북에서 유엔군을 사용하는 데 공개적으로 매인 바가 없으므로, 현재의 군수 및 전술적 공중·해군 지원을 계속하여 유엔의 우산(umbrella)을 유지하면서도 북한 평정을 전적으로 한국군이 수행할 가능성을 더 검토해볼 충분한 가치가 있을 수 있다. 이렇게 하면 작전에 대한 유엔의 우산을 유지하면서도 중국의 허풍을 시험해보아야 하는 중대한 위험을 줄일 수 있을 것이다. 이는 북한에 대한 사실상(de facto)의 한국 통제를 확대하게 되겠지만, 유엔 기구가 작동할 때까지 이승만이 법률상(de jure) 통제를 확대하는 것을 억제하는 데 심각한 어려움을 겪지는 않으리라 본다. 한국군 부대만으로 점령하는 것이 우리가 기대했던 것보다 훨씬 유혈이 낭자하겠지만, 유엔한국위원단과 한국군 부대에 배속된 미국 고문들은 어느 정도 억제력을 행사할 수 있을 것이다. 이 방안은 또한 진정한 유엔의 북한 점령을 수행하는 데 따르는 엄청난 복잡성을 피할 수 있다는 추가적인 이점도 있다.\n\n귀하께서 매슈스 국장에게 다음 사항을 즉시 국방부에 요청하도록 건의하실 것을 제안한다. (1) 38선 이북에서의 유엔군 운용에 관한 맥아더 장군의 현재 의도와 (2) 이 작전을 수행할 한국군의 능력에 대한 그의 평가가 무엇인지 확인할 것.\n\n[850면]", "secondary": "top secret\n\n[Washington,] October 3, 1950.\n\nSubject: Threat of Chinese Intervention in Korean Conflict.\n\nReference London’s 1934 of October 3. Although the statement attributed to Chou En-lai undoubtedly contains a large element of bluff directed at forestalling decisive action on the UK resolution on Korea, I do not feel that we can assume it is entirely bluff.\n\nFor reasons which are not clear, unfortunately General Mac Arthur has not thus far committed across the 38th parallel any UN forces. If he had done so, the position vis-à-vis the Chinese would be much stronger. It appears that he may be testing ROK forces north of 38 with the thought that it might not be militarily necessary to commit UN forces north of the 38th. We are not openly committed to the use of UN forces across the 38th and it may, therefore, be well worthwhile further to explore the possibility of using entirely ROK forces for the subjugation of North Korea, of course, continuing our present logistic and tactical Air and Naval support, thus maintaining the UN umbrella. This would maintain the UN umbrella over the operation while reducing the grave risk of calling the Chinese bluff. Although this would extend de facto ROK control over North Korea, I do not think we would encounter serious difficulty in restraining Rhee from extending de jure control until the UN machinery had operated. While occupation by exclusively ROK units would be much more sanguinary than we had hoped, the UN Commission and American advisors attached to the ROK units should be able to exercise some restraining influence. This also has the added advantage of avoiding the great complexities of carrying out genuine UN occupation of North Korea.\n\nI suggest that you recommend to Mr. Matthews that we immediately request Defense to ascertain (1) what General Mac Arthur’s present intentions are with regard to the use of UN forces north of 38 and (2) his assessment of the capabilities of ROK troops to carry out this operation.\n\n[850면]", "notes": [], "warn": false, "pages": ["50-850"], "search": "Johnson, U. Alexis 존슨(U. Alexis Johnson) Rusk, Dean 러스크(Dean Rusk) Chou En-lai 저우언라이(周恩來) MacArthur, Douglas 맥아더(Douglas MacArthur) Rhee, Syngman 이승만(李承晩) Matthews, H. Freeman 매슈스(H. Freeman Matthews)"}, {"id": "50-d603", "order": 35, "date": "1950-10-04", "group": "E", "eyebrow": "50-d603 · Memorandum of Conversations, by the Assistant Secretary of State for Far Eastern Affairs (Rusk)", "title": "러스크(Dean Rusk) 극동담당 차관보의 대화 비망록", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-10-04"}, {"k": "시각", "v": null}, {"k": "발신", "v": "Rusk, Dean — 러스크(Dean Rusk), 국무부 극동담당 차관보", "txt": true}, {"k": "수신", "v": "기록용", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "회담 비망록"}, {"k": "원문출처", "v": "795.00/10–450", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d603"}], "summary": "영국 대사가 한국군의 38선 이북 진출과 그 지시 계통을 밤중에 러스크에게 캐묻다. 러스크는 맥아더가 38선 이북 작전을 승인받았으며 구체적 작전 계획은 워싱턴이 검토했다고 알린다.", "points": ["프랭크스 영국 대사가 밤중에 러스크를 대사관으로 불러 런던이 긴급히 제기한 네 가지 질문에 대한 답변을 구한다.", "첫째, 한국군이 실제 38선 이북에 있으며 유엔군사령부의 지시에 따라 진출했는가. 러스크는 동해안 쪽에 있다고 확인하나 구체적 지시를 받았는지는 모른다고 답한다.", "둘째, 한국군 외에 38선 이북에 들어간 유엔군이 있는가. 지상군은 없으나 항공 및 해상 작전은 계속 중이라고 답한다.", "셋째, 맥아더의 38선 이북 작전이 6월 27일 안보리 결의에 의해 포괄되는가. 러스크는 적군이 계속 싸우고 있으므로 군사적으로 필요하며, 결의 자체가 정치적 통일을 목표로 한 점령을 의미하지는 않는다고 답한다.", "넷째, 맥아더가 38선 이북 진출 지시를 받았는가. 러스크는 작전정책지시가 내려졌고 맥아더의 계획이 일반 승인되었으나, 실행 전 워싱턴의 최종 확인이 필요한지는 자신이 알지 못한다고 답한다.", "프랭크스가 맥아더의 계획에 관한 기밀 정보를 이미 알고 있음을 암시하자, 러스크는 대통령과 합참이 작전 경과에 대한 지속적 책임과 감독을 행사하고 있음을 상기시킨다."], "primary": "top secret\n\n[워싱턴,] 1950년 10월 4일.\n\n주제: 한국 작전\n\n참석자: Oliver Franks 경—영국 대사\n\nArthur W. Tedder 경—영국 대사관\n\nDean Rusk—국무부 차관보\n\nOliver Franks 경이 어젯밤 사무실로 전화를 걸어, 자신과 Tedder 경을 보러 잠시 들를 수 있겠느냐고 물었다. 그는 그 이례적인 시간에 국무부로 오는 것을 원치 않았는데, 언론이 우연히 알게 될 경우 추측을 불러일으키지 않기 위해서였다.\n\n내가 대사관에 도착했을 때, 영국 대사와 Tedder 경, Graves 씨는 런던에서 온 몇몇 전보를 검토하고 있었다. 그들의 당면한 관심사는 런던이 한국에서의 작전에 관해 가장 긴급한 기준으로 제기한 몇 가지 질문에 대한 답변을 제공하는 것이었다. 대사는 자신이 어떤 정책 문제도 제기할 의사가 없으며 어떤 의견 차이가 존재함을 시사하려는 것도 아니고, 단지 런던이 답변을 원하는 구체적 질문들에 어떻게 답해야 할지 알고 싶을 뿐이라고 지적했다. 그는 런던이 관련 문제들에 대해 어떻게 생각할지에 관해 아무런 암시도 받지 못했다고 말했다.\n\n[860면]\n\n첫 번째 질문은 한국군이 실제로 38선 이북에 있는지, 그리고 그들이 유엔군사령부의 지시에 따라 38선 이북으로 진출했는지였다. 나는 우리 정보에 따르면 한국군이 동해안을 따라 실제로 38선 이북에 있으며, 이 진격이 최초의 언론 보도가 시사했던 만큼 멀리 초기에는 침투하지 못했으나, 그들이 얼마나 빠르게 이동 중인지 내가 알지 못하며 그들이 정확히 어디 있는지 말할 수 없다고 답변했다. [주1] 나는 이들 병력이 유엔군사령부의 구체적 지시에 따라 38선을 넘었는지에 관한 정확한 정보를 가지고 있지 않지만, 그들이 유엔군사령부의 일반적인 추격 지시에 따라 작전 중일 것이라고 생각한다고 덧붙여 말했다.\n\n두 번째 질문은 한국군 이외의 유엔군 병력이 38선 이북에 있는지였다. 나는 우리의 현재 정보로는 한국군 이외의 유엔군 지상군은 38선 이북에 없으며, 서울과 38선 사이에서 미군이 상당한 저항에 직면했지만, 38선 이북에 대한 항공 및 해상 작전은 계속되고 있으며 기습 및 파괴 부대는 작전 전반에 걸쳐 그래 왔듯이 물론 언제든지 상륙할 수 있다고 답변했다. [주2]\n\n세 번째 질문은 맥아더 장군의 38선 이북 작전이 6월 27일 안전보장이사회 결의에 의해 포괄된다는 것이 미국의 견해인지 여부였다. 나는 우리가 맥아더 장군의 38선 이북 군사 작전이 6월 27일 결의에 의해 포괄된다고 간주하며, 여전히 유엔군을 향해 총격을 가하는 적군이 야전에 존재하고, 이 군대는 할 수만 있으면 남한 전역에서 계속 작전 중이며, 미국인 전쟁 포로를 내놓기를 거부했고, 전투를 계속할 모든 징후를 보이고 있다고 말했다. 이러한 상황에서 우리는 맥아더 장군이 그에게 적절해 보이는 방식으로 전투를 계속하는 것이 군사적으로 필요하다고 간주하며 38선 자체가 장벽이 되지는 않을 것이라고 말했다. 그러나 나는 우리가 6월 27일 결의 자체가 특정한 정치적 결과를 가져올 목적으로 한국 전체를 점령하는 쪽을 바라보는 광범위한 정치-군사적 목표를 나타낸다고 간주하지는 않는다고 말했다. 이것은, 우리가 생각하기에, 현재 제1위원회에서 검토 중인 종류의 추가적인 유엔 조치로부터 [861면] 뒤따를 것이다.\n\n마지막 질문은 맥아더 장군이 38선 이북으로 진격하라는 지시를 받았는지, 그리고 그 지시의 성격이 무엇인지였다. 외무성의 전보는 도쿄 주재 Gascoigne(영국) [주3] 이 맥아더 장군으로부터 대통령의 구체적 지시 없이는 38선 이북에서 작전하지 말라는 엄격한 지시를 받고 있다는 정보를 받았다고 밝혔다. Oliver Franks 경은 그런 다음 자신이 \"일정한 시간\" 내에 실행하기 위해 마련된 특정 계획들에 관해 내가 알아야 한다고 생각하며, Gascoigne의 보고와 이 정보가 어떻게 들어맞는지 분명하지 않다고 말했다. 그는 비록 출처나 경로를 밝히지는 않았지만, 훌륭한 정보를 입수했음이 분명해질 정도로 그러한 계획들의 내용을 충분히 개괄했다. 나는 그에게 맥아더 장군이 38선 이북에서의 작전을 허용하는 작전정책지시를 받았으며, 워싱턴이 그 계획들이 실행되기 전에 유엔에서의 상황과 러시아 및 중국 측면을 잘 살펴볼 수 있도록 그러한 작전을 위한 그의 계획을 승인을 위해 워싱턴으로 회부하도록 요청받았다고 말했다. 나는 그에게 맥아더 장군이 그러한 계획들을 제출했고 그가 일반 승인을 받았다고 말했으나, 맥아더 장군이 그의 계획을 실행하기 전에 워싱턴으로부터 최종 결정을 받아야 할 필요가 있을지 여부는 그에게 말해줄 수 없었다. 나는 그에게 이것은 그 문제가 내가 뉴욕에 있는 동안 매우 높은 수준에서 처리되었기 때문에 내가 알지 못하는 사항이지만, 대통령과 합동참모본부가 한국에서의 작전 경과에 대해 지속적인 책임과 감독을 행사하고 있음을 그에게 상기시켰다.\n\nOliver Franks 경은 내가 제공한 정보가 런던에 도움이 될 것이며 Bevin 씨와 Dening 씨가 수요일에 도착할 때까지 그들에게 \"씹을\" 거리를 줄 것이라고 생각한다고 말했다. 나는 Oliver Franks 경에게 Dening 씨가 내가 뉴욕에서 그에게 제공한 이러한 문제들에 관한 상당한 배경 지식을 가지고 있으며, 이것이 Dening 씨가 도착하면 외무성에 가장 유용할 것이라고 생각한다고 말했다.\n\nOliver Franks 경은 그런 다음 나에게 맥아더 장군이 그의 계획을 실행하기 전에 워싱턴과의 추가적인 확인이 필요한지에 관한 그 특정 쟁점에 대해 수요일 아침 [주4] 에 추가 정보를 줄 수 있는지 물었다. 나는 그에게 수요일 아침에 내 소식을 듣게 될 것이라고 말했다.\n\n[862면]\n\n위 사항을 Matthews 씨와 논의한 후, 나는 10월 5일[4일?] 아침에 영국 대사에게 전화를 걸어 그에게 말했다—\n\n(1)\n우리는 한국군이 유엔군사령부의 구체적 명령에 따라 38선 이북으로 이동했는지 알지 못하지만 한국군이 일반적인 추격 지시를 받았을 것으로 추정하며, 구체적 지시가 발령되었든 아니든 유엔군사령부가 그들의 작전에 책임이 있다고 본다.\n\n(2)\n우리는 맥아더 장군이 유엔군과 함께 38선 이북으로 이동하기 전에 워싱턴과 최종 확인을 해야 하는지 알지 못하지만, 워싱턴은 일일 단위로 상황을 추적하고 있다. 어쨌든 Tedder 경이 Bradley 장군과 대화를 나누는 것이 유용할 수 있으며, 대사도 이에 동의했다.\n\nDean Rusk\n\n----- 각주 -----\n[주1] 한국군 정찰대가 9월 30일에 38선을 넘었고, 한국군은 그 후 이틀 동안 대규모로 국경을 넘어 진격했다. 10월 3일, 맥아더 장군은 38선 돌파에 대한 최초의 공식 공개 발표를 했다. (Appleman, South to the Naktong, North to the Yalu, p. 615)\n[주2] 미군은 10월 7일에 북한으로 진입했고 10월 9일에 38선 이북에서 북쪽으로 전투를 시작했다. (Ibid., p. 623)\n[주3] Alvary Gascoigne, 주일 영국 정치대표.\n[주4] 10월 4일.", "secondary": "top secret\n\n[Washington,] October 4, 1950.\n\nSubject: Korean Operations\n\nParticipants: Sir Oliver Franks—British Ambassador\n\nLord Arthur W. Tedder—British Embassy\n\nDean Rusk—Assistant Secretary of State\n\nSir Oliver Franks called me at the office last night and asked if I could drop out to see him and Lord Tedder. He preferred not to come to the Department at that unusual hour in order not to arouse speculation if the press happened to get hold of it.\n\nWhen I arrived at the Embassy, the British Ambassador, Lord Tedder and Mr. Graves were going over some telegrams from London. Their immediate concern was to provide the answers to some questions which London had raised on a most urgent basis about the operations in Korea. The Ambassador pointed out that he did not wish to raise any questions of policy nor to indicate that any difference of opinion existed, but merely wished to know how to reply to the specific questions on which London wished answers. He had no indication of what London might think about the matters involved.\n\n[860면]\n\nThe first question was whether South Korean forces are in fact north of the 38th parallel and whether they went north of the parallel in pursuance to a directive from the Unified Command. I replied that our information is that South Korean forces are in fact north of the 38th parallel along the east coast, that this advance had not penetrated initially as far as the first press reports had indicated, but that I did not know how rapidly they were moving and could not say exactly where they are. [주1] I stated further that I did not have precise information as to whether these forces crossed the parallel in pursuance to a specific directive from the Unified Command but that I supposed they were operating under general pursuit directives from the Unified Command.\n\nThe second question was whether any United Nations forces other than South Koreans were north of the 38th parallel. I replied that our present information is that no United Nations ground forces other than South Koreans are beyond the 38th parallel, that considerable resistance has been encountered by American forces between Seoul and the parallel, but that air and naval operations north of the 38th parallel were continuing and that raiding and demolition parties might of course be going ashore at any time as they had been throughout the operations. [주2]\n\nThe third question was whether it is the United States view that operations by General MacArthur north of the 38th parallel are covered by the Security Council Resolution of June 27. I stated that we considered military operations by General MacArthur north of the 38th parallel to be covered by the June 27 Resolution, that there is a hostile army in the field which is still shooting at United Nations forces, that this army continues to operate throughout South Korea wherever it can do so, that it has refused to disgorge its American prisoners of war, and that it shows every indication of continuing the fight. In this circumstance we consider it militarily necessary for General MacArthur to continue the fight in whatever way seems appropriate to him and the 38th parallel would not itself impose a barrier, I stated, however, that we did not consider the June 27 Resolution in itself to represent a broad political-military objective looking toward the occupation of all of Korea for the purpose of bringing about a particular political result. This, we thought, would follow [861면] from further United Nations action of the sort now being considered by Committee 1.\n\nThe final question was whether General MacArthur had received instructions to go north of the 38th parallel and the nature of these instructions. The telegram from the Foreign Office stated that Gascoigne (UK) in Tokyo [주3] had been informed by General MacArthur that he was under strict instructions not to operate north of the 38th parallel without a specific directive from the President. Sir Oliver then said he thought that I ought to know that he knew about certain plans which were in existence for execution within a “finite time”, and that he was not clear how Gascoigne’s report and this information fitted together. He outlined the content of such plans sufficiently to make it evident that he had received excellent information, although he did not disclose the source or the channel. I told him that General MacArthur had received an operational policy directive which permitted operations north of the 38th parallel, that he had been asked to refer his plans for such operations back to Washington for approval in order that Washington could take a good look at the situation in the United Nations and the Russian and Chinese aspects before the plans were executed. I told him that General MacArthur had submitted such plans and that he had been given general approval although I could not tell him whether it would be necessary for General MacArthur to get a final word from Washington before carrying out his plans. I told him this was a matter of ignorance on my part since the matter had been handled on a very high level while I was in New York, but I reminded him that the President and the Joint Chiefs of Staff exercised continuing responsibility and supervision for the source [course] of operations in Korea.\n\nSir Oliver stated that he thought the information I had provided would be helpful to London and would give them something to “chew” on pending the arrival of Mr. Bevin and Mr. Dening on Wednesday. I told Sir Oliver I felt that Mr. Dening had very considerable background on these matters which I had given him in New York and which would be most useful to the Foreign Office upon Mr. Dening’s arrival.\n\nSir Oliver then asked me whether I could give him any further information on Wednesday morning [주4] on the particular point as to whether General MacArthur requires any further check with Washington before carrying out his plans. I told him that I would let him hear from me on Wednesday morning.\n\n[862면]\n\nAfter talking the above over with Mr. Matthews, I called the British Ambassador on the morning of October 5 [4?] and told him—\n\n(1)\n\nWe do not know whether the South Koreans moved north of the 38th Parallel on specific order of the Unified Command but presumed the South Koreans had a general pursuit directive and that the Unified Command was responsible for their operations whether a specific directive was issued or not.\n\n(2)\n\nWe do not know whether General MacArthur would be required to make a last minute check with Washington before moving north of the 38th Parallel with United Nations forces, but that Washington was following the situation on a day-to-day basis; in any event, it might be useful for Lord Tedder to have a talk with General Bradley, to which the Ambassador agreed.\n\nDean Rusk", "notes": ["[주1] 한국군 정찰대가 9월 30일에 38선을 넘었고, 한국군은 그 후 이틀 동안 대규모로 국경을 넘어 진격했다. 10월 3일, 맥아더 장군은 38선 돌파에 대한 최초의 공식 공개 발표를 했다. (Appleman, South to the Naktong, North to the Yalu, p. 615)", "[주2] 미군은 10월 7일에 북한으로 진입했고 10월 9일에 38선 이북에서 북쪽으로 전투를 시작했다. (Ibid., p. 623)", "[주3] Alvary Gascoigne, 주일 영국 정치대표.", "[주4] 10월 4일."], "warn": false, "pages": ["50-860", "50-861", "50-862"], "search": "Franks, Oliver — 프랭크스(Oliver Franks) 경, 영국 대사 Tedder, Arthur W. — 테더(Arthur W. Tedder) 경, 영국 대사관 Rusk, Dean — 러스크(Dean Rusk), 국무부 극동담당 차관보 Graves, Mr. — 그레이브스 씨 MacArthur, Douglas — 맥아더(Douglas MacArthur) 장군, 유엔군사령관 Gascoigne, Alvary — 개스코인(Alvary Gascoigne), 주일 영국 정치대표 Bevin, Ernest — 베빈(Ernest Bevin), 영국 외무장관 Dening, Esler — 데닝(Esler Dening) Matthews, H. Freeman — 매슈스(H. Freeman Matthews) Bradley, Omar — 브래들리(Omar Bradley) 장군, 합동참모본부 의장 Truman, Harry S. — 트루먼(Harry S. Truman) 대통령"}, {"id": "50-d640", "order": 36, "date": "1950-10-07", "group": "B", "eyebrow": "50-d640 · Resolution 376 (V), Adopted by the United Nations General Assembly, October 7, 1950", "title": "1950년 10월 7일 유엔 총회가 채택한 결의 376(V)", "badge": null, "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-10-07"}, {"k": "시각", "v": null}, {"k": "발신", "v": "유엔 총회", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "장소", "v": "Lake Success"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "결의"}, {"k": "원문출처", "v": "", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d640"}], "summary": "유엔 총회가 한국의 통일·독립·민주 정부 수립을 위한 선거 실시와 경제 부흥, 그리고 이를 감독할 '유엔 한국통일부흥위원단' 설치를 결의한다.", "points": ["한국 전역의 안정을 보장하기 위한 모든 적절한 조치를 취할 것을 권고한다.", "유엔의 주관 하에 선거를 포함한 모든 구성적 행위를 통해 통일·독립·민주 정부를 수립할 것을 권고한다.", "남·북한 주민의 모든 부문 및 대표 단체가 유엔 기관과 협력할 것을 촉구한다.", "통일·독립·민주 정부 수립과 안정 보장이라는 목표 달성 이후에는 유엔군이 한국 어느 지역에도 잔류하지 않을 것을 권고한다.", "호주, 칠레, 네덜란드, 파키스탄, 필리핀, 태국, 터키로 구성된 '유엔 한국통일부흥위원단(United Nations Commission for the Unification and Rehabilitation of Korea)'을 설치한다.", "경제사회이사회에 적대 행위 종료 후 구호 및 부흥 계획을 수립할 것과, 한국의 경제 발전 및 사회 진보를 위한 장기적 조치의 연구를 신속히 진행할 것을 요청한다."], "primary": "1950년 10월 7일\n\n총회는,\n\n1947년 11월 14일 결의(112(II)), 1948년 12월 12일 결의(195(III)), 1949년 10월 21일 결의(293(IV))에 유의하고,\n\n유엔 한국위원단의 보고서를 접수 및 검토하였으며,\n\n언급된 결의들에 명시된 목표들이 완전히 달성되지 못했으며, 특히 한국의 통일이 아직 이루어지지 않았고 북한으로부터의 무력 공격을 통해 대한민국 정부를 무력으로 소멸시키려는 시도가 있었음에 유의하고,\n\n1948년 12월 12일 총회가 선언한 바, 유엔 조선임시위원단이 관찰하고 협의할 수 있었으며 한국 주민의 대다수가 거주하는 한국의 그 지역에 대해 효과적인 통제와 관할권을 가지는 합법 정부(대한민국 정부)가 수립되었으며, 이 정부는 해당 지역 유권자의 자유 의사가 타당하게 표출된 선거에 기반을 두고 있고 동 위원단이 그 선거를 참관하였으며, 이것이 한국 내에서 그러한 유일한 정부임을 상기하고,\n\n유엔 회원국들이 무력 공격을 격퇴하고 그 지역의 국제 평화와 안전을 회복하기 위해 필요할 수 있는 지원을 대한민국에 제공하라는 1950년 6월 25일자 안전보장이사회 결의에 뒤이은, 1950년 6월 27일자 안전보장이사회 권고에 따라 유엔군이 현재 한국에서 작전 중임을 유념하며,\n\n언급된 총회 결의들의 본질적 목표가 통일되고 독립적이며 민주적인 한국 정부의 수립이었음을 상기하여,\n\n1. 다음을 권고한다.\n\n(a)\n한국 전역에 걸쳐 안정된 상태를 보장하기 위한 모든 적절한 조치가 취해질 것.\n\n(b)\n주권 국가인 한국에 통일되고 독립적이며 민주적인 정부를 수립하기 위하여, 선거의 실시를 포함한 모든 구성적 행위가 유엔의 주관 하에 취해질 것.\n\n[905면] (c)\n남북한 한국 주민의 모든 부문 및 대표 단체가 평화의 회복, 선거의 실시 및 통일 정부의 수립에 있어 유엔 기관들과 협력하도록 요청될 것.\n\n(d)\n위 (a)와 (b)에 명시된 목표를 달성하는 데 필요한 범위 외에는, 유엔군이 한국의 어느 지역에도 잔류하지 않을 것.\n\n(e)\n한국의 경제 부흥을 달성하기 위한 모든 필요한 조치가 취해질 것.\n\n2. 다음을 결의한다.\n\n(a)\n호주, 칠레, 네덜란드, 파키스탄, 필리핀, 태국 및 터키로 구성되며, '유엔 한국통일부흥위원단'으로 알려질 위원단을 설치하여 (i) 현 유엔 한국위원단이 지금까지 수행해 온 기능을 인수하고, (ii) 통일되고 독립적이며 민주적인 전한국 정부의 수립을 실현하는 데 있어 유엔을 대표하며, (iii) 경제사회이사회의 권고를 접수한 후 총회가 결정하는 대로 한국에서의 구호 및 부흥과 관련된 책임을 수행하도록 한다. 유엔 한국통일부흥위원단은 가능한 한 조속히 한국으로 진행하여 그 기능을 수행하기 시작하여야 한다.\n\n(b)\n유엔 한국통일부흥위원단이 한국에 도착할 때까지, 동 위원단에 대표된 정부들은 상기 권고사항에 비추어 유엔통합사령부와 협의하고 조언하기 위하여 유엔 소재지에서 회합하는 대표들로 구성된 임시위원회를 구성하여야 하며, 동 임시위원회는 총회가 이 결의를 승인하는 즉시 기능을 시작하여야 한다.\n\n(c)\n동 위원단은 차기 총회 정기 회기 및 본 결의의 주제를 심의하기 위해 소집될 수 있는 그 이전의 임시 회기에 보고서를 제출하여야 하며, 적절하다고 판단하는 임시 보고서를 회원국에 전달하도록 사무총장에게 제출하여야 한다.\n\n총회는 나아가,\n\n현재의 적대 행위 종식 시에 한국 경제를 부흥시키는 과업이 막대한 규모일 것이라는 사실을 유념하여,\n\n3. 경제사회이사회가 전문 기구들과 협의하여 적대 행위 종료 시의 구호 및 부흥을 위한 계획을 수립하고, 총회가 이 결의를 채택한 날로부터 3주 이내에 총회에 보고하도록 요청한다.\n\n4. 또한 경제사회이사회가 한국의 경제 발전 [906면] 및 사회 진보를 촉진하기 위한 장기적 조치에 관한 연구를 신속히 진행하고, 그동안 기술 지원 요청을 결정하는 당국들에 그러한 지원을 한국에 제공하는 것이 시급하고 특별히 필요함을 환기시키도록 권고한다.\n\n5. 유엔 한국위원단 위원들이 그 중요하고 어려운 임무를 수행함에 있어 제공한 봉사에 감사를 표한다.\n\n6. 사무총장에게 유엔 한국통일부흥위원단에 필요한 경우 기술 고문을 포함한 적절한 직원과 편의를 제공하도록 요청하며, 사무총장이 동 위원단 각 회원국 대표 및 대리 대표 각 1인의 경비와 일당을 지급하도록 승인한다.", "secondary": "October 7, 1950\n\nThe General Assembly\n\nHaving regard to its resolutions of 14 November 1947 (112(II)), of 12 December 1948 (195(III)), and of 21 October 1949 (293 (IV));\n\nHaving received and considered the Report of the United Nations Commission on Korea;\n\nMindful of the fact that the objectives set forth in the resolutions referred to have not been fully accomplished and in particular that the unification of Korea has not yet been achieved, and that an attempt has been made by an armed attack from North Korea to extinguish by force the Government of the Republic of Korea;\n\nRecalling the General Assembly declaration of 12 December 1948 that there has been established a lawful government (the Government of the Republic of Korea) having effective control and jurisdiction over that part of Korea where the United Nations Temporary Commission on Korea was able to observe and consult and in which the great majority of the people of Korea reside; that this government is based on elections which were a valid expression of free will of the electorate of that part of Korea and which were observed by the Temporary Commission; and that this is the only such government in Korea;\n\nHaving in mind that United Nations armed forces are at present operating in Korea in accordance with the recommendations of the Security Council of 27 June 1950, subsequent to its resolution of 25 June 1950, that Members of the United Nations furnish such assistance to the Republic of Korea as may be necessary to repel the armed attack and to restore international peace and security in the area;\n\nRecalling that the essential objective of the resolutions of the General Assembly referred to was the establishment of a unified, independent and democratic Government of Korea;\n\n1. Recommends that\n\n(a)\n\nAll appropriate steps be taken to ensure conditions of stability throughout Korea,\n\n(b)\n\nAll constituent acts be taken, including the holding of elections, under the auspices of the United Nations for the establishment of a unified, independent and democratic Government in the sovereign State of Korea,\n\n[905면] (c)\n\nAll sections and representative bodies of the population of Korea, South and North, be invited to co-operate with the organs of the United Nations in the restoration of peace, in the holding of elections and in the establishment of a unified Government,\n\n(d)\n\nUnited Nations forces should not remain in any part of Korea otherwise than so far as necessary for achieving the objectives specified at (a) and (b) above,\n\n(e)\n\nAll necessary measures be taken to accomplish the economic rehabilitation of Korea;\n\n2. Resolves that\n\n(a)\n\nA Commission consisting of Australia, Chile, Netherlands, Pakistan, Philippines, Thailand and Turkey, to be known as the United Nations Commission for the Unification and Rehabilitation of Korea be established to (i) assume the functions hitherto exercised by the present United Nations Commission in Korea, (ii) represent the United Nations in bringing about the establishment of a unified, independent and democratic Government of all Korea, (iii) exercise such responsibilities in connexion with relief and rehabilitation in Korea as may be determined by the General Assembly after receiving the recommendations of the Economic and Social Council. The United Nations Commission for the Unification and Rehabilitation of Korea should proceed to Korea and begin to carry out its functions as soon as possible;\n\n(b)\n\nPending the arrival in Korea of the United Nations Commission for the Unification and Rehabilitation of Korea, the Governments represented on the Commission should form an interim committee composed of representatives meeting at the Seat of the United Nations to consult with and advise the United Nations Unified Command in the light of the above recommendations; the interim committee should begin to function immediately upon the approval of this resolution by the General Assembly;\n\n(c)\n\nThe Commission shall render a report to the next regular session of the General Assembly and to any prior special session which might be called to consider the subject matter of the present resolution, and shall render such interim reports as it may deem appropriate to the Secretary-General for transmission to Members;\n\nThe General Assembly furthermore,\n\nMindful of the fact that at the end of the present hostilities the task of rehabilitating the Korean economy will be of great magnitude;\n\n3. Requests the Economic and Social Council, in consultation with the specialized agencies, to develop plans for relief and rehabilitation on the termination of hostilities and to report to the General Assembly within three weeks of the adoption of this resolution by the General Assembly;\n\n4. Also recommends the Economic and Social Council to expedite the study of long-term measures to promote the economic development [906면] and social progress of Korea and meanwhile to draw the attention of the authorities which decide requests for technical assistance to the urgent and special necessity of affording such assistance to Korea;\n\n5. Expresses its appreciation of the services rendered by the members of the United Nations Commission on Korea in the performance of their important and difficult task;\n\n6. Requests the Secretary-General to provide the United Nations Commission for the Unification and Rehabilitation of Korea with adequate staff and facilities, including technical advisers as required; and authorizes the Secretary-General to pay the expenses and per diem of a representative and alternate from each of the States members of the Commission.", "notes": [], "warn": false, "pages": ["50-905", "50-906"], "search": ""}, {"id": "50-d644", "order": 37, "date": "1950-10-07", "group": "B", "eyebrow": "50-d644 · The Deputy Secretary of Defense (Lovett) to the President  The source text bears the manuscript notation: “Approved 10/8/50 Harry S. Truman”.", "title": "러벳 국방차관이 대통령에게 보낸 서한", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-10-07"}, {"k": "시각", "v": null}, {"k": "발신", "v": "Lovett, Robert A. 러벳(국방차관)", "txt": true}, {"k": "수신", "v": "Truman, Harry S. 트루먼 대통령", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "서한"}, {"k": "원문출처", "v": "Department of Defense Files", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d644"}], "summary": "중국 공산군의 개입 가능성에 대비해 맥아더에게 보낼 지시안을 대통령에게 승인 요청한다.", "points": ["중국 공산군이 사전 발표 없이 개입할 경우 맥아더가 취할 조치가 기존 NSC 81/1과 시행 지령에 구체적으로 명시되지 않았다.", "합참은 현재 한국 상황으로 볼 때 그러한 개입이 가능하며, 따라서 맥아더가 이 비상사태에 대비한 지시를 받아야 한다고 본다.", "합참은 NSC 73/4에 따라 첨부된 지시안을 맥아더에게 송부하는 것을 대통령에게 승인 요청한다.", "국무장관과 국방장관도 이 지시안에 동의하며 대통령의 승인을 권고한다."], "primary": "top secret\n\n워싱턴, 1950년 10월 7일\n\n대통령 각하: 중국의 한국 내 군사 개입 가능성에 관한 맥아더 장군 앞 지시 초안을 각하의 재가를 위해 이에 송부합니다.\n\n합동참모본부는 국방장관에게, 한국에서의 미국 행동 방침에 관한 NSC 81/1에도, 각하께서 1950년 9월 27일 재가하신 그에 기초한 시행 지령에도, 중국 공산군이 사전 발표 없이 한국에 개입할 경우 맥아더 장군이 취해야 할 행동이 구체적으로 규정되어 있지 않다고 조언하였습니다. 합동참모본부는 현재 한국에 존재하는 상황에 비추어 그러한 개입이 가능하며, 따라서 맥아더 장군이 그러한 비상사태에 대비한 적절한 지시를 받아야 한다고 믿고 있습니다.\n\n[912면]\n\n합동참모본부는 「한국 상황에 비추어 소련의 향후 움직임 가능성에 대한 미국의 입장과 행동」에 관한 NSC 73/4에 따라 [주2], 각하의 재가를 조건으로 첨부된 지시를 맥아더 장군에게 송부할 권한을 부여받기를 권고합니다.\n\n국무장관과 국방장관은 이 첨부된 지시에 동의하며, 각하의 재가를 권고합니다. [주3]\n\n충심으로 경의를 표하며,\n\n각하께 충성스러운,\n\n로버트 A. 러벳", "secondary": "top secret\n\nWashington, 7 October 1950.\n\nDear Mr. President: There is forwarded herewith, for your approval, a draft directive to General MacArthur regarding possible Chinese military intervention in Korea.\n\nThe Joint Chiefs of Staff have advised the Secretary of Defense that neither NSC 81/1, on United States courses of action in Korea, nor the implementing directive based thereon, which you approved on 27 September 1950, specifically provide for the action General MacArthur should take if the Chinese Communists intervene, without prior announcement, in Korea. The Joint Chiefs of Staff believe that such intervention is possible in the light of conditions obtaining presently in Korea, and that, therefore, General MacArthur should receive appropriate instructions for such a contingency.\n\n[912면]\n\nThe Joint Chiefs of Staff recommend that they be authorized to forward the attached directive to General MacArthur, subject to your approval, in accordance with NSC 73/4, “The Position and Actions of the United States with Respect to Possible Further Soviet Moves in the Light of the Korean Situation.” [주2]\n\nThe Secretaries of State and Defense concur in this attached directive, and recommend your approval. [주3]\n\nWith great respect,\n\nFaithfully yours,\n\nRobert A. Lovett", "notes": ["[주1] 원본에는 'Approved 10/8/50 Harry S. Truman'이라는 자필 메모가 있다.", "[주2] 본문 및 관련 문서는 제1권에 수록될 예정이다.", "[주3] 첨부 문서에도 위 각주 1의 메모가 있다. 이 지시는 10월 9일 JCS 전보 93709로 맥아더 장군에게 송부되었다(915면 참조)."], "warn": false, "pages": ["50-912"], "search": "Lovett, Robert A. 로버트 A. 러벳 MacArthur, Douglas 더글러스 맥아더 Truman, Harry S. 해리 S. 트루먼"}, {"id": "50-d665", "order": 38, "date": "1950-10-12", "group": "D", "eyebrow": "50-d665 · Memorandum by the Central Intelligence Agency", "title": "중앙정보국 각서", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-10-12"}, {"k": "시각", "v": null}, {"k": "발신", "v": "중앙정보국(Central Intelligence Agency)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "795.00/10–1250", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d665"}], "summary": "중앙정보국이 중국 공산군의 전면 개입 위협을 추정한다. 1950년 내 개입 가능성은 낮고 당분간 은밀한 지원에 그칠 것이라고 본다.", "points": ["중국 공산군은 공군·해군이 없어도 효과적 개입이 가능하나 결정적 승리를 보장할 수는 없다.", "저우언라이의 성명, 만주로의 병력 이동, 선전 공세에도 불구하고 전면 개입 의도를 보여주는 확실한 징후는 없다.", "개입하여 유엔군을 패배시키면 공산 중국의 위신이 크게 오르고 아시아 제1 강국이 된다.", "개입이 결정적 승리로 이어지지 않더라도 대외 전쟁을 경제 개혁 실패의 구실로 쓸 수 있다.", "유엔군이 완승하면 공산 진영 전체에 큰 타격이기에 이를 막아야 하는 유인이 있다.", "중국은 미국과의 전쟁을 두려워하며, 전면전은 국내 체제의 존립 자체를 위태롭게 한다.", "소련이 제공할 공군 엄호와 해군 지원 없이는 개입 비용이 극도로 크고, 그러한 지원이 반드시 주어지리라 볼 수 없다.", "1950년 중 전면 개입은 소련이 세계 대전을 결심하지 않는 한 일어날 가능성이 낮으며, 계속 은밀한 지원에 그칠 것이다."], "primary": "top secret\n\n[워싱턴,] 1950년 10월 12일.\n\nA. 중국 공산군의 전면적 한국 개입 위협 [주1]\n\ni. 문제 제기\n\n1. 중국 공산군의 한국 전면 개입 위협을 추정한다.\n\nii. 능력\n\n2. 현재 필요한 공군과 해군 지원이 없는 중국 공산군 지상군은 한국 분쟁에 효과적으로 개입할 능력이 있으나, 반드시 결정적으로 개입할 수 있는 것은 아니다.\n\niii. 의도에 영향을 미치는 요소\n\n3. 의도에 관한 징후. 저우언라이의 성명, 만주로의 부대 이동, 잔학 행위와 국경 침범에 대한 선전적 비난에도 불구하고, 중국 공산군이 실제로 한국에 전면 개입할 의사를 갖고 있다는 납득할 만한 징후는 없다.\n\n4. 중국 공산군의 개입에 유리한 요소.\n\na.\n\n개입하여 유엔군이 패배할 경우: (1) 공산 중국의 위신이 크게 올라 아시아 제1 강국임을 확인시켜 주며; (2) 중소 추축 안에서의 공산 중국 위상이 함께 높아져 세계 공산주의에 큰 이득이 되고; (3) 서구식 민주주의 국가와 국경을 맞댈 가능성을 없애며; (4) 압록강변 만주 측 발전 전력을 계속 확보할 수 있다.\n\nb.\n\n개입하여 유엔군이 결정적 패배를 당하지 않더라도: (1) 중국 공산당이 전에 발표한 경제 개혁의 실패를 대외 전쟁 탓으로 설명할 수 있으며; (2) 아시아의 반서방 추세에 부합하고 거기에 강한 자극을 줄 수 있으며; (3) 소련의 최대한 군사·경제 원조 요구를 정당화할 수 있다.\n\nc.\n\n최종 승리의 보장 여부와 무관하게 개입은 세계 공산주의, 특히 소련의 대의에 도움이 될 수 있다. 이 개입으로 서방 진영이 극동에서 값비싸고 결말이 나지 않을 가능성이 있는 전쟁에 휘말리기 때문이다.\n\n[934면] d.\n\n공산주의 대의 일반, 특히 중소 진영은 유엔군이 한국에서 완전한 승리를 거둘 경우, 비공산 세계와의 투쟁에서 큰 후퇴를 맞을 전망에 직면한다.\n\n5. 중국 공산군의 개입에 반대하는 요소.\n\na.\n\n중국 공산당은 미국과의 전쟁 결과를 두려워하는 것이 틀림없다. 국내 문제가 너무나 방대하여, 미국과의 전쟁에서 받게 될 부담과 물질적 피해로 체제의 국내 사업 전체와 경제가 위태로워질 것이다. 반공 세력이 고무되고 체제의 존립 자체가 위험에 빠질 것이다.\n\nb.\n\n개입은 중국의 유엔 가입과 안전보장이사회 의석 획득 가능성을 극히 낮출 것이다.\n\nc.\n\n강력한 소련 공군 엄호와 해군 지원 없이는 공개 개입에 막대한 비용이 든다. 그러한 소련의 지원은 그 자체가 소련의 개입이기에 주어지지 않을 수 있다.\n\nd.\n\n대규모 소련 원조를 받으면 베이징이 소련 지원에 더 의존하게 되고 만주에 대한 소련 통제가 중국 공산당이 달갑게 여기지 않을 수준으로 커질 것이다.\n\ne.\n\n실패할 경우, 중국이 소련의 앞잡이 노릇을 했다는 이유로 중국 국민의 분노에 베이징이 노출될 것이다.\n\nf.\n\n군사적 관점에서 보아 한국 개입에 가장 유리한 시기는 이미 지났다.\n\ng.\n\n계속된 은밀한 지원은 공개 개입의 위험과 불리를 피하면서 그 이점 대부분을 제공한다. 은밀한 지원으로 중국 공산당은 다음을 할 수 있다:\n\n(1)\n\n유엔을 더 적대시하는 것을 피하고 미국과의 전쟁 위험을 줄인다;\n\n(2)\n\n표면적으로 평화를 지지하면서 중국이 이끄는 아시아 인민의 “혁명 투쟁”을 추진한다;\n\n(3)\n\n나중에 지원을 포기할지, 한국에서의 중국 공산군 필요에 알맞은 은밀 지원을 계속할지를 선택할 수 있는 행동의 자유를 유지한다;\n\n(4)\n\n미국과의 전쟁 위험을 감수하지 않고 중국 내 공산주의자들과 대체로 아시아의 “한국 지원” 요구를 충족시킨다.\n\niv. 중국 공산군 행동의 개연성\n\n6. 중국 공산군의 전면적 한국 개입은 계속해서 가능한 상황으로 보아야 하지만, 알려진 모든 요소를 고려하면 소련이 세계 대전을 결심하지 않는 한 그러한 행동이 1950년에 일어날 개연성은 낮다는 결론에 이른다. 이 기간 중 개입은 아마도 계속 북한에 은밀한 지원을 하는 데 그칠 것이다.\n\n[935면]\n\n----- 각주 -----\n[주1] 이 문서는 웨이크섬 회담의 논의 안건이 될 수 있는 사항들에 관해 러스크 씨의 지시로 작성된 배경 자료 브리핑 북에 포함된 것이다. 브리핑 북의 사본은 백악관과 회담의 다른 참가자들에게 전달되었다.", "secondary": "top secret\n\n[Washington,] 12 October 1950.\n\nA. Threat of Full Chinese Communist Intervention in Korea [주1]\n\ni. statement of the problem\n\n1. To estimate the threat of full-scale Chinese Communist intervention in Korea.\n\nii. capabilities\n\n2. The Chinese Communist ground forces, currently lacking requisite air and naval support, are capable of intervening effectively, but not necessarily decisively, in the Korean conflict.\n\niii. factors bearing on intent\n\n3. Indications of Intentions. Despite statements by Chou En-lai, troop movements to Manchuria, and propaganda charges of atrocities and border violations, there are no convincing indications of an actual Chinese Communist intention to resort to full-scale intervention in Korea.\n\n4. Factors Favoring Chinese Communist Intervention.\n\na.\n\nIntervention, if resulting in defeat of UN forces, would: (1) constitute a major gain in prestige for Communist China, confirming it as the premier Asiatic power; (2) constitute a major gain for World Communism with concomitant increase in Communist China’s stature in the Sino-Soviet axis; (3) result in the elimination of the possibility of a common frontier with a Western-type democracy; and (4) permit the retention of sources of Manchurian electric power along the Yalu River.\n\nb.\n\nIntervention, even if not resulting in a decisive defeat of UN forces, would: (1) enable the Chinese Communists to utilize foreign war as an explanation for failure to carry out previously announced economic reforms; (2) be consistent with and furnish strong impetus to anti-Western trends in Asia; and (3) justify a claim for maximum Soviet military and/or economic aid to China.\n\nc.\n\nIntervention, with or without assurance of final victory, might serve the cause of World Communism, particularly the cause of the Soviet Union, in that it would involve the Western bloc in a costly and possibly inconclusive war in the Far East.\n\n[934면] d.\n\nThe Communist cause generally and the Sino-Soviet bloc particularly face the prospect of a major set-back in the struggle with the non-Communist world if UN forces are permitted to achieve complete victory in Korea.\n\n5. Factors Opposing Chinese Communist Intervention.\n\na.\n\nThe Chinese Communists undoubtedly fear the consequences of war with the US. Their domestic problems are of such magnitude that the regime’s entire domestic program and economy would be jeopardized by the strains and the material damage which would be sustained in war with the US. Anti-Communist forces would be encouraged and the regime’s very existence would be endangered.\n\nb.\n\nIntervention would minimize the possibility of Chinese membership in the UN and of a seat on the Security Council.\n\nc.\n\nOpen intervention would be extremely costly unless protected by powerful Soviet air cover and naval support. Such Soviet aid might not be forthcoming because it would constitute Soviet intervention.\n\nd.\n\nAcceptance of major Soviet aid would make Peiping more dependent on Soviet help and increase Soviet control in Manchuria to point probably unwelcome to the Chinese Communists.\n\ne.\n\nIf unsuccessful, Chinese intervention would lay Peiping open to Chinese resentment on the grounds that China would be acting as a Soviet catspaw.\n\nf.\n\nFrom a military standpoint the most favorable time for intervention in Korea has passed.\n\ng.\n\nContinued covert aid would offer most of the advantages of overt intervention while avoiding its risks and disadvantages. Covert aid would enable the Chinese Communists to:\n\n(1)\n\nAvoid further antagonizing of the UN and reduce risk of war with the US;\n\n(2)\n\nPromote the China-led Asiatic peoples’ “revolutionary struggle,” while ostensibly supporting peace;\n\n(3)\n\nMaintain freedom of action for later choice between abandonment of aid or continuing such covert aid as might be appropriate to Chinese Communist needs in Korea;\n\n(4)\n\nSatisfy the “aid Korea” demand in Communist circles in China and Asia generally, without risking war with the US.\n\niv. probability of chinese communist action\n\n6. While full-scale Chinese Communist intervention in Korea must be regarded as a continuing possibility, a consideration of all known factors leads to the conclusion that barring a Soviet decision for global war, such action is not probable in 1950. During this period, intervention will probably be confined to continued covert assistance to the North Koreans.\n\n[935면]", "notes": ["[주1] 이 문서는 웨이크섬 회담의 논의 안건이 될 수 있는 사항들에 관해 러스크 씨의 지시로 작성된 배경 자료 브리핑 북에 포함된 것이다. 브리핑 북의 사본은 백악관과 회담의 다른 참가자들에게 전달되었다."], "warn": false, "pages": ["50-934", "50-935"], "search": "저우언라이(Chou En-lai, 周恩來) 러스크(Rusk)"}, {"id": "50-d680", "order": 39, "date": "1950-10-15", "group": "E", "eyebrow": "50-d680 · Substance of Statements Made at Wake Island Conference on 15 October 1950", "title": "1950년 10월 15일 웨이크섬 회담에서 오간 발언의 요지", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-10-15"}, {"k": "시각", "v": "0736"}, {"k": "발신", "v": "Bradley, Omar N. (합동참모본부 의장, 육군 원수)", "txt": true}, {"k": "수신", "v": "편집자 주: 워싱턴 측 배석자들의 기록에서 브래들리가 편집함", "txt": true}, {"k": "장소", "v": "Wake Island"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "회담 비망록"}, {"k": "원문출처", "v": "Executive Secretariat Files: Lot 59D–95 (Wake Island Conference October 1950)", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d680"}], "summary": "웨이크섬에서 트루먼 대통령과 맥아더 장군이 한국의 부흥과 선거, 유엔의 역할을 논의한다. 맥아더는 공식 저항이 추수감사절까지 끝날 것이며, 연간 1억 5천만 달러 수준의 원조면 충분하다고 말한다.", "points": ["맥아더, 북·남한 전역의 공식 저항이 추수감사절까지 종료될 것이며 크리스마스까지 8군을 일본으로 철수시키고 10군단과 유엔군 분견대만 남기기를 희망한다고 발언.", "맥아더, 한국 재건 비용을 연간 1억 5천만 달러 정도로 추정. ECA의 추산인 9억 달러나 15억 달러는 지나치게 높으며, 한국이 실제 흡수·지출할 수 있는 한계가 그 정도라는 견해.", "무초 대사, 물질적 재건보다 정신적·심리적 재건에 중점을 두어야 한다고 강조. 공산주의 치하에 5년간 완전히 지배당한 북한 지역에 첫 진입한 만큼 교육과 정보 분야가 중요.", "트루먼, 확성기 트럭의 효과를 언급하며 이를 이용해 두 번 당선되었다고 농담.", "맥아더, 6만 명의 포로가 제네바 협약에 따라 급여를 받으며 잘 지내고 있으며, 그들 사이에 남북한 이념적 분열이나 블록은 존재하지 않는다고 평가.", "무초, 유엔 결의가 전국적 선거를 요구하는 것으로 해석될지가 문제이며, 국회의원들을 무시할 수 없는 과제라고 지적. 지방선거나 도지사 선거는 가능할 것으로 전망.", "해리먼, 유럽과 아시아 양쪽에서 프랑스의 핵심적 위치를 강조하며 인도차이나 문제에 대한 깊은 숙고를 촉구하다.", "트루먼 대통령이 수년간의 노력에도 프랑스가 인도차이나에서 태도를 바꾸지 않는 것이 가장 낙담스러운 문제라고 말하다.", "라드포드 제독, 인도차이나로 가기를 꺼리는 프랑스 함정들을 관찰한 경험을 언급하다.", "맥아더와 트루먼이 필리핀 상황에 대해 논의하고, 대통령이 키리노 대통령을 소환하는 방안을 언급하다.", "대만에 대한 완전한 의견 일치를 재확인하다.", "브래들리 장군, 유엔군 추가 제공의 정치적 유용성과 군사적 무용함을 지적하며, 워싱턴에서 판단할 사안이라고 하다.", "맥아더, 유엔군이 군사적으로 쓸모없으며 행동을 보지 못할 것이라고 단언하다.", "러스크, 인도군과 파키스탄군을 완충 병력으로 배치하는 네루의 구상을 소개하자, 맥아더가 군사적으로 방어 불가능한 계획이라고 일축하다.", "맥아더가 비한국군의 조속한 철수와 한국군이 자국 문제를 스스로 처리할 능력이 있다고 강조하다.", "맥아더, 유엔이 이승만 정부를 북한과 동등하게 대우하는 결의안을 보고 불안을 느꼈으며, 이 정부를 실망시키면 안 된다고 주장하다.", "트루먼 대통령이 반드시 이승만 정부를 지원해야 하며 반대 선전은 '지옥에나 가라'고 강하게 말하다."], "primary": "**일시:** 1950년 10월 15일 오전 7시 36분, 웨이크섬\n**등급:** top secret\n\n**편집:** 육군 원수 Omar N. Bradley(합동참모본부 의장), 워싱턴 측 배석자들이 기록한 노트에서 편집함 [주1]\n\n배석자는 다음과 같다:\n\n대통령\n\n육군 원수 Douglas MacArthur\n\nArthur W. Radford 제독, 미 태평양 함대 사령관\n\nJohn Muccio 대사\n\nFrank Pace 육군장관\n\nA. L. Hamblen 대령\n\nPhilip C. Jessup 대사(무임소)\n\nOmar N. Bradley 육군 원수\n\nDean Rusk 국무차관보\n\nW. Averell Harriman 씨\n\n회담은 7시 36분에 시작되었다.\n\n대통령이 MacArthur 장군에게 한국과 관련된 부흥 상황을 설명해줄 것을 요청했다.\n\n[949면]\n\n**MacArthur 장군:** 군사 작전이 종료될 때까지는 불가능합니다. 공식적인 저항은
