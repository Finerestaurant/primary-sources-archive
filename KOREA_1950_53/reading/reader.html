추수감사절까지 북한과 남한 전역에서 끝날 것으로 생각합니다. 남한에는 저항이 거의 남아 있지 않습니다—약 1만 5천 명 정도이며—우리가 섬멸하지 못하는 자들은 겨울이 처리할 것입니다. 현재 수용소에 약 6만 명의 포로를 보유하고 있습니다.\n\n북한에서는 불행하게도 그들이 가망 없는 희망을 쫓고 있습니다. 보충병으로 훈련된 약 10만 명의 병력이 있습니다. 훈련도, 지휘도, 장비도 열악하지만 완고하여 그들을 섬멸해야 하는 것이 내 심기에는 거슬립니다. 그들은 단지 체면을 유지하기 위해 싸우고 있을 뿐입니다. 동양인은 체면을 잃느니 죽는 쪽을 택합니다.\n\n나는 지금 제1기병사단을 이끌고 평양으로 향하는 전선을 밀고 올라가고 있습니다. 전차와 트럭 부대를 편성해서 곧바로 도로를 따라 평양을 점령하는 방안을 고려 중입니다. 이는 향후 48시간 내에 입수되는 정보에 달려 있습니다. 우리는 이미 원산을 점령했습니다. X 군단을 상륙시키고 있으며, 이 부대가 1주일 안에 평양을 점령할 것입니다. 북한군은 이전에 저질렀던 것과 똑같은 실수를 저지르고 있습니다. 종심 방어를 배치하지 않았습니다. 간격이 봉쇄되면 남쪽에서 일어났던 것과 같은 일이 북쪽에서도 일어날 것입니다.\n\n나는 크리스마스까지 제8군을 일본으로 철수시킬 수 있기를 희망합니다. 그러면 재편된 X 군단이 남게 되며, 이 부대는 제2사단, 제3사단 및 유엔군 분견대로 구성됩니다. 유엔이 연초까지 선거를 실시하기를 희망합니다. 군사 점령으로 얻는 것은 아무것도 없습니다. 모든 점령은 실패입니다. (대통령이 동의하며 고개를 끄덕였다.) 선거가 실시된 후에는 모든 점령군을 철수시키고자 합니다. 한국은 우리의 장비를 갖춘 약 10개 사단을 보유해야 하며, 소규모이지만 유능한 공군과 소규모이지만 유능한 해군이 이를 보완해야 합니다. 그렇게 한다면 한국을 안전하게 할 뿐만 아니라 중국 공산군의 남하에 대한 엄청난 억지력이 될 것입니다. 이는 웃어넘길 수 있는 위협이 아닙니다. 다시 한 번 나는 군대가 총성이 멈추는 순간 철수하고 민간인이 인수해야 한다는 사실을 강조합니다.\n\n한국은 가난한 땅입니다. 오랫동안 낙후되어 왔으며 적은 돈으로도 큰 효과를 볼 수 있습니다. 집들은 진흙과 대나무로 지어집니다. 무너져도 2주면 다시 지을 수 있습니다. ECA가 재건 비용을 추산했는데 9억 달러로 추정되었습니다. 현지에서 이루어진 또 다른 추산으로는 약 15억 달러로 책정되었습니다. 나는 이 추산치들이 지나치게 높다고 생각합니다. 한국에서 연간 1억 5천만 달러를 훨씬 넘는 돈을 흡수하고 지출할 수 있다고 생각하지 않습니다. 3년 동안 그 정도 규모라면 한국을 제 궤도에 올려놓을 것이며, 한국이 자립할 수 있게 할 뿐만 아니라 더 높은 생활 수준을 제공할 것이라고 생각합니다. 3년에서 5년에 걸쳐 5억 달러를 투입하면 파괴를 보상하고도 남을 것입니다.\n\n[950면]\n\n**Muccio 대사:** 장군께서 중요한 지적을 하셨습니다. 한국의 흡수 능력은 제한되어 있습니다. 이는 경제 분야와 다른 분야에 모두 적용됩니다. 우리는 물질적 재건보다 정신적·심리적 재건을 더 강조해야 합니다. 북부 지역은 5년 동안 완전한 지배 아래 있었습니다. 우리가 공산주의자들이 지배하던 지역으로 진입한 것은 이번이 처음입니다. 도전적인 기회를 맞고 있습니다. 나는 물질적 재건보다 교육과 정보 분야를 더 강조하기를 원합니다. 한국의 경제는 기본적으로 매우 단순합니다. 연간 1억 5천만 달러가 한국이 흡수할 수 있는 전부라는 점에 장군과 동의합니다. (MacArthur 장군을 향해) 그 추산치에 군대 비용이 포함되어 있습니까?\n\n**MacArthur 장군:** 아닙니다. 장비와 군대는 포함되어 있지 않습니다.\n\n**Pace 장관:** 대통령께서 보내신 지령은 충분히 포괄적입니까?\n\n**MacArthur 장군:** 그렇습니다.\n\n**Pace 장관:** 일반적으로 이 기간 동안 육군의 중대하고 전반적인 소요는 무엇입니까? 우리는 심각한 재정 상황에 처해 있습니다. 12월에 추가 예산의 형태로 우리의 결산일이 다가올 것입니다.\n\n**MacArthur 장군:** 당신이 우리에게 40일을 주었고, 필요하다면 60일을 주었습니다. 60일 안에 그 추산치를 내겠습니다. 지금부터 약 30일 후가 될 것입니다. 아시다시피 이는 어느 정도 추측에 기반한 작업이 될 것이지만, 오차 25% 이내로 정확할 것입니다.\n\n**Pace 장관:** 육군의 책임이 끝날 때, 육군이 심리적 재건에 도움을 제공할 수 있습니까? KMAG은 계속되어야 합니까?\n\n**MacArthur 장군:** KMAG 요원들은 훌륭했습니다. 군사 고문단에 관한 한, 무기한 지속되어야 한다고 생각합니다. 그 집단에 높은 찬사를 보내고 싶습니다. 500명의 장교와 병사가 무기한 지속되어야 한다고 생각합니다. 재건 초기에는 민간 재건이 조직될 때까지 육군이 계속해야 할 것입니다. 가능한 한 빨리 조직되어야 합니다. 유엔이 인수해야 합니다. 한국에서 근무할 유능한 인력을 구하는 것은 어려운 일이 될 것입니다. 좋은 곳이 아닙니다.\n\n**Pace 장관:** 재건 기간에 Walker 장군이 민간 리더십을 맡을 한국군 인사들의 리더십 자질을 평가할 수 있을 것입니다.\n\n**MacArthur 장군:** Muccio 씨가 이것에 관해 나보다 더 잘 알고 있으며, 대사관은 한국인들에 대한 철저한 지식을 가지고 있습니다.\n\n**Muccio 대사:** 한국인들은 매우 완고합니다. 그들은 너무 오랫동안 휘둘려 왔기 때문에 그런 것을 좋아하지 않습니다. 그들은 우리가 한국을 원하지 않는다고 확신하고 있습니다. 군사 고문단은 젊은 한국인들을 훈련시키는[951면] 훌륭한 일을 해냈습니다. 그들은 중국식, 일본식 훈련을 받은 구식 한국인들을 밀어냈습니다. 구식 한국인들에게는 희망이 없지만, 젊은이들에게는 큰 희망이 있습니다.\n\n**Rusk 씨:** KMAG을 유엔 작전으로 전환하는 것은 바람직하지 않습니까? 그것이 그 효과를 망칠까요?\n\n**MacArthur 장군:** 정치적 관점에서는 괜찮겠지만, 군사적으로는 교리의 통일성이 있어야 합니다. 다른 나라들은 우리와 다른 교리를 가지고 있을 수 있습니다.\n\n**Bradley 장군:** 그것은 그리스에서 통하지 않았습니다. 우리가 모든 것을 인수해야 했습니다.\n\n**Rusk 씨:** 소수의 다른 국적자를 활용하거나 유엔이 미국에 계약 기준으로 인수하도록 요청하는 방식으로 해결할 수 있을지도 모릅니다. 제가 가진 또 다른 질문은, 우리는 구호와 재건에 대한 군의 책임이 종료되기를 바라며, 또한 미국의 작전이 유엔으로 이관되기를 바란다는 것입니다. 반면에 유엔은 전에 한 번도 해본 적이 없는 일을 하려고 하고 있습니다. 전에 같은 규모로 수행된 적이 없는 책임들을 떠맡게 될 것입니다. ECA와 같은 조직이 대기하면서 일부 책임을 재개해야 할 필요가 있을 수 있습니다. 유엔이 인수하기 전에 국가의 기본 시설—철도, 수도 등—이 적절히 가동될 것이라고 가정하는 것이 타당합니까?\n\n**MacArthur 장군:** 상당 부분이 그렇게 될 것이라고 생각합니다. 양호한 상태로 되돌려 놓기 위해서는 할 일이 많이 남을 것이라고 생각합니다. 육군은 도시를 점령하는 즉시 시설을 가동시키지만 이는 일시적인 것일 뿐입니다. ECA가 그 일을 계속하고 있습니다. 대통령께서 지난주에 Foster 씨 [주2] 에게 서한을 보내 장기 재건을 진행하라고 지시하셨습니다. ECA는 계속 기능해야 합니다.\n\n**Muccio 대사:** 중공업, 철도 및 공공시설은 한국인들이 인수해야 하며 유엔이 들어올 때까지 기다려서는 안 됩니다. 부산에서 영등포까지의 철도는 1주일 안에 운행이 재개되었습니다.\n\n**대통령:** 공공시설과 철도는 어떻습니까?\n\n**MacArthur 장군:** 공공시설을 다시 가동하는 데는 의심할 여지 없이 시간이 걸릴 것입니다. ECA는 계속 기능하고 있습니다.\n\n**Muccio 대사:** 육군은 철도를 개통하는 데 잘 해냈습니다. ECA가 도왔습니다. 육군은 수단을 가지고 있었고 ECA와 함께 상수도와 열차를 가동시키는 훌륭한 일을 해냈습니다. 철도 회사와 함께해온 운수 전문가 집단이 가장 큰 도움이 되었습니다. 다행히도 우리에게는 상수도 시설의 신규 개발을 담당했던 ECA 직원이 있었고, 그는 짧은 시간 안에 서울에 수도를 통하게 했습니다. 상당한 수의 새 기관차가 반입되었습니다.\n\n[952면]\n\n**Pace 장관:** ECA와 육군의 협력 측면에서 우리가 당신을 돕기 위해 할 수 있는 일이 있습니까?\n\n**MacArthur 장군:** 전쟁 역사상 어느 사령관도 워싱턴의 모든 기관들로부터 내가 받은 것보다 더 완전하고 적절한 지원을 받은 적이 없습니다.\n\n**Jessup 대사:** 필요 규모에 관해 제안하셨던 수치와 관련하여, 거기에는 북한의 산업 시설 재건 비용이 포함되어 있습니까?\n\n**MacArthur 장군:** 그렇습니다, 군수품 제조는 제외하고 말입니다. 그 공장들은 포함시키지 않을 것입니다.\n\n**Bradley 장군:** 철도 재건과 관련하여, 나는 유럽에서 조종사들이 움직이는 모든 것을 쏘아대고 우리가 나중에 사용할 막사를 폭격해서 많은 어려움을 겪었습니다. 같은 문제에 직면하고 있습니까?\n\n**MacArthur 장군:** 나도 마찬가지입니다 (웃음).\n\n**Rusk 씨:** 상대방이 시설을 어느 정도나 뜯어가고 있습니까?\n\n**MacArthur 장군:** 어느 정도 뜯어가고 있습니다. 인천에서 최소한 20대의 평판 화차를 보았는데, 거기에는 그들이 반출하지 못한 화려한 공장 기기들이 실려 있었습니다. 북한군은 남한에 통상적인 약탈 이상을 할 만큼 오래 있지 못했습니다. 그러나 북한의 산업은 심각하게 손상되지 않았다고 생각합니다.\n\n**Harriman 씨:** 심리적 재건에 관해 좀 더 들을 수 있을까요?\n\n**Muccio 대사:** 한국인들을 더 많이 끌어들여야 합니다. 그들은 우리보다 자기 민족을 더 잘 압니다. 우리는 그들에게 라디오와 교과서, 그리고 과학적 지도를 제공해야 합니다. 모든 학교와 마을 중심지에 라디오나 확성기를 설치하면 매우 효과적인 체계를 구축할 수 있습니다. 나는 확성기 트럭을 운용했는데 아주, 아주 효과적이었습니다. 신문도 라디오 방송도 없는 상황에서 우리는 그것들을 농촌 지역과 마을 중심지로 보냈습니다.\n\n**대통령:** 나는 확성기 트럭을 신뢰합니다. 그것으로 두 번 당선되었습니다. (웃음)\n\n**Harriman 씨:** 남한과 북한 주민들 사이의 심리적 차이는 어떻습니까?\n\n**Muccio 대사:** 한국인은 한국인입니다. 그들 사이에 근본적인 차이는 없습니다. 어차피 80퍼센트가 농민입니다. 소수의 정치가와 지식인들을 제외하면 남한과 북한 주민들 사이에 근본적인 분열은 없습니다.\n\n**Harriman 씨:** 월남한 2백만 명은 어떻습니까?\n\n**Muccio 대사:** 그들은 대체로 재산이 어느 정도 있는 사람들이었습니다. 그들은 북한으로 돌아갈 것이며 우리에게 큰 도움이 될 것입니다.\n\n**Bradley 장군:** 지금 보유하고 있는 6만 명의 포로를 어떻게 하실 생각입니까?\n\n[953면]\n\n**MacArthur 장군:** 그들은 온 한국에서 가장 행복한 한국인들입니다. 생전 처음으로 배불리 먹고 청결해졌습니다. 이가 제거되었고, 제네바 협약에 따라 급여를 받는 좋은 일자리를 얻었습니다. 진정한 분열은 없다고 생각하지만, 그들의 태도는 오직 그들 위에 펄럭이는 깃발 때문일 뿐입니다. 이념의 차이는 없으며, 남한과 북한의 블록도 없습니다.\n\n**대통령:** 이승만은 선거라는 발상을 어떻게 받아들일까요?\n\n**MacArthur 장군:** 좋아하지 않을 것입니다.\n\n**Muccio 대사:** 지난 선거는 정직한 선거였습니다, 극동에서 지금까지 치러진 어떤 선거 못지않게 정직했습니다. 어떻게 그것을 무시하겠습니까? 나는 새 위원단이 그것을 전국적 선거를 요구하는 것으로 해석하지 않기를 바랍니다. 국회의원들을 어떻게 무시할 것인가가 주요 문제입니다. 결의안은 여러 방식으로 해석될 수 있도록 문구가 작성되어 있습니다. 지방 선거나 도지사 선거는 한 번도 실시된 적이 없습니다. 이런 것들은 실시될 수 있을 것입니다.\n\n러스크 씨: 우리는 현 한국 정부의 토대를 허물어선 안 됩니다. 남측에서 지방선거와 보궐선거를 치르고 북측에서 선거를 치르면, 그때쯤이면 1952년 전국 선거가 거의 임박했을 것입니다. 상당한 인내가 필요하리라 생각합니다.\n\n해리먼 씨: 선거 사이의 과도기는 어떻게 합니까?\n\n맥아더 장군: 북한은 군정 하에 놓이게 됩니다. 유엔 결의는 가능한 곳에서는 지방 정부를 유지하도록 요구하고 있습니다. 이것은 불가능할 것입니다. 우리는 그들이 도주하거나 살해되리라 예상합니다. 지방 정부는 대한민국 관리들이 추천한 지방 관리를 임명하여 유지될 것입니다.\n\n무초 대사: 북한에서 어떤 통화를 사용할지, 어떤 토지개혁법을 존치할지의 문제도 있습니다.\n\n맥아더 장군: 과도기 동안 군이 토지 보유, 은행, 통화를 동결할 것입니다. 민간 정부가 인수할 때까지 북한에서는 북한 통화를 그대로 통용시키고, 달러나 대한민국 원에 대한 환율은 정하지 않을 것입니다.\n\n대통령: 중국이나 소련의 간섭 가능성은 얼마나 됩니까?\n\n맥아더 장군: 아주 적습니다. 첫째 달이나 둘째 달에 간섭했더라면 결정적이었을 것입니다. 이제 우리는 그들의 개입을 더는 두려워하지 않습니다. 더는 모자를 손에 쥐고 서 있지 않습니다. 중국군은 만주에 30만 명이 있습니다. 이 중 기껏해야 10만~12만5천 명이 압록강을 따라 배치되어 있을 것입니다. 압록강을 건널 수 있는 것은 5만~6만 명에 불과합니다. 그들에게는 공군이 없습니다. 이제 우리는 한국에 공군 기지를 확보했으므로, 중국군이 평양까지 내려오려 든다면 최대의 살육이 벌어질 것입니다.\n\n[954면]\n\n소련의 경우는 조금 다릅니다. 그들은 시베리아에 공군을 보유하고 있고, 꽤 좋은 편이며, 일부 제트기와 B-25, B-29기를 갖춘 우수한 조종사들이 있습니다. 공중에 1,000대의 항공기를 띄울 수 있고, 소련 제5함대와 제7함대에서 200~300대를 더 보탤 수 있습니다. 아마 우리 공군의 상대는 아닐 것입니다. 소련은 북한에 투입할 지상군이 없습니다. 야전에 병력을 투입하는 데 어려움을 겪을 것입니다. 1개 사단을 건너게 하는 데 6주가 걸리고, 6주면 겨울이 옵니다. 유일한 다른 조합은 소련 공군이 중국 지상군을 지원하는 것입니다. 소련 공군은 묵덴과 하얼빈을 잇는 반원형으로 배치되어 있지만, 소련 공군과 중국 지상군 간의 협조는 너무나 허술해서 소련 공군이 우리를 폭격하는 것만큼 자주 중국군을 폭격할 것이라고 나는 믿습니다. 근접지원은 아주 어려운 일입니다. 우리 해병대는 완벽하게 해냅니다. 그들은 그렇게 훈련받았습니다. 우리 공군과 지상군은 해병대만큼은 못하지만 효과적입니다. 훈련되지 않은 공군과 지상군 간에는 상당한 합동 훈련 없이는 공중 엄호가 불가능합니다. 나는 중국 공산군 지상군과 소련 공군으로는 전혀 되지 않으리라 생각합니다. 우리가 최고입니다.\n\n해리먼 씨: 전범들은 어떻게 됩니까?\n\n맥아더 장군: 전범들은 건드리지 마십시오. 효과가 없습니다. 뉘른베르크 재판도 도쿄 재판도 억지력이 되지 못했습니다. 나는 내 고유 권한으로 잔학 행위를 저지른 자들을 처리할 수 있고, 체포하는 대로 군사위원회에서 즉결 재판할 작정입니다.\n\n대통령: 다른 주제입니다만—일본 강화 조약을[주3] 소련과 공산 중국을 제외하고 추진하는 방안에 대해 어떻게 생각하십니까?\n\n맥아더 장군: 당장 회의를 소집하고 그들을 초청하겠습니다. 그들이 들어오지 않으면, 계속 진행하십시오. 조약 초안이 마련된 뒤 그들에게 초안을 제시하고, 서명하지 않으면, 조약을 진행하십시오. 일본인은 조약을 받을 자격이 있습니다.\n\n대통령: 우리 군대가 철수할 때 일본의 안전보장에 어떤 영향이 있겠습니까?\n\n맥아더 장군: 경찰예비대라는 명목으로, 일본을 방위하기 위해 4개 사단의 일본군을 편성 중입니다. 국무부가 마련한 현재의 조약 초안은 매우 훌륭합니다. 합동참모본부와의 마찰 끝에 다이아몬드처럼 빛날 때까지 다듬어졌습니다. 이 초안은 유엔이 스스로 할 수 있게 될 때까지 미국이 유엔의 대리 기관으로서 행동하여 일본의 안전을 보장하도록 규정할 것입니다.\n\n대통령: 일본이 스스로 방위할 수 있을 때까지 우리가 일본에 3, 4개 사단을 유지해야 합니까?\n\n[955면]\n\n맥아더 장군: 수년간 유지해야 한다고 말씀드리겠습니다. 현재 일본은 전시 법규에 따라 그 병력들을 위해 아주 많은 물자를 제공하고 있습니다. 연간 3억 달러를 내놓고 있습니다. 여기에는 막사, 전기 등이 포함됩니다. 강화 조약이 체결되면 이것이 바뀌어야 한다고 나는 생각합니다. 군대가 자체 경비를 부담해야 합니다. 우리가 임대료 등을 지불해야 합니다. 일본인들은 이 사단들의 유지비를 그들이 부담할 필요가 없다면 반대하지 않을 것입니다.\n\n브래들리 장군: 우리 군대가 자리를 비운 동안 신의를 저버리지 않은 일본인들은 군대가 한국에서 귀환했을 때 그들에게서 다른 대우를 받으리라 기대할까요?\n\n맥아더 장군: 오마, 군대와 일본인들 사이에는 완전한 동지애가 있습니다. 일본인들은 우리 군대를 좋아합니다. 나는 군대의 주둔이 번영을 의미한다고 생각합니다. 그들이 돈을 쓰고 많은 것을 들여옵니다. 제8군은 1월에 점령 임무에서 빠졌습니다. 그들이 돌아오면 점령과는 아무 상관이 없을 것입니다.\n\n브래들리 장군: 제8군이 곧 일본으로 귀환합니다. 우리는 유럽에 추가 병력을 보내야 하는 문제를 안고 있습니다. 현재로는 4월이 되어야 1개 사단을 유럽에 보낼 수 있습니다. 제2사단이나 제3사단을 1월까지 유럽으로 보낼 수 있도록 해줄 수 있습니까?\n\n맥아더 장군: 예, 1월까지 1개 사단을 내놓겠습니다. 제2사단을 선택하길 권합니다. 노련한 사단이고, 더 잘 훈련되어 있어, 더 좋은 인상을 줄 것입니다.\n\n페이스 장관: 가리오아(GARIOA)는 강화 조약과 함께 종료됩니까?\n\n맥아더 장군: 예, 일본은 1952년이면 조약이 있든 없든 자급자족할 것입니다.\n\n페이스 장관: SCAP는 강화 조약 이후에도 계속되어야 합니까?\n\n맥아더 장군: SCAP는 완전히 종료되어야 합니다. 나는 이 군대들이 미국 본토의 군대처럼 국방부가 직접 통제해야 한다고 생각하며, 일본과의 관계는 미국의 주둔지들과 같아야 한다고 봅니다. 정치적 측면과는 아무 상관이 없어야 한다고 생각합니다. SCAP는 완전히 중단되어야 합니다. 나는 덜레스 씨에게 그것을 일본인들에게 납득시킬 수 있다고 말했습니다. 아시다시피, 카를로스 로물로와 몇몇 다른 이들이 원하는 식으로 그들을 생가죽을 벗긴다면, 그들로부터 아무것도 얻을 수 없을 것입니다. 국무부가 마련한 문안은 대단히 훌륭한 조약이라고 생각합니다.\n\n러스크 씨: 한국에서 일본으로 복귀하는 그 군대들과 관련하여, 이상적으로는 한국에서의 군사 점령이 종료되기 전에 강화 조약을 체결해야 합니다만, 귀관의 한국 작전이 외교관들이 조약을 체결할 수 있는 속도보다 빠르게 진행되고 있습니다.\n\n[956면]\n\n맥아더 장군: 성탄절까지 제8군을 복귀시켰으면 합니다.\n\n러스크 씨: 그 시한에는 맞출 수 없습니다. 일본인들에게 우리가 강화 조약을 체결할 것임을 알리고 군대의 복귀를 원활히 하기 위해 그들에게 조약에 관한 성명을 발표해야 하지 않겠습니까?\n\n맥아더 장군: 좋은 생각입니다. 지난 1월에 그런 취지의 성명을 어느 정도 했습니다. 이번 1월에도 어떻게든 또 그들의 등을 긁어주겠습니다.\n\n해리먼 씨: 한국에서 돌아오면 점령 경비 일부를 우리가 지불하기 시작해야 합니까?\n\n맥아더 장군: 애버렐, 그렇게 해야 합니다. 그렇게 하면 GARIOA를 중단할 수 있습니다. 우리는 투입하는 것보다 더 많이 빼내고 있습니다. 우리가 조약을 체결하지 않은 것은 일본인의 잘못이 아닙니다. 우리가 투입하는 것보다 더 많이 빼내고 있다는 것은 부당한 일입니다. 조약 체결을 막는 것은 연합국 간의 불화입니다. 3년 전에 일본인들은 우리가 요구한 모든 것을 다 해주었고, 우리는 그들에게 도의적 의무가 있습니다. 우리가 일본에서 군대 비용의 일부를 GARIOA 자금 대신 우리가 부담한다면, 효과적으로 마련될 수만 있다면 이것이 만족스러운 방안이 될 수도 있습니다.\n\n페이스 장관: 확실히 고려할 가치가 있고 심리적 이점이 클 것이 틀림없다고 생각합니다. 우리는 국방부 내부의 문제도 있고 의회 세출위원회와의 문제도 있습니다. 최종 견해는 아니지만, 제 개인 의견으로는 고려해봐야 한다고 생각합니다.\n\n맥아더 장군: 귀관이 옳다고 확신합니다. 의회는 좋아하지 않을 것입니다. 방문했던 모든 의회 단체들은 일본 경제에서 더 많은 것을 삼키고 싶어 했습니다.\n\n대통령: 장군과 국무부가 함께 협의하여 방안을 마련하고 승인을 위해 내게 가져오십시오.\n\n페이스 장관: 혹은 부승인을 위해서겠지요. (웃음)\n\n대통령: 장군, 태평양 조약[주4]이나 대서양의 것과 유사한 다른 협정의 가능성에 대한 의견을 듣고 싶습니다.\n\n맥아더 장군: 태평양 조약은 대단한 것이겠지만, 태평양 국가들의 동질성 결여로 인해 발효시키기가 매우 어려울 것입니다. 트루먼 독트린과 같은 발표를 대통령께서 하셔서 그것이 약탈 국가들에 대한 경고가 된다면, 엄청난 효과가 있을 것입니다. 그들은 지극히 비동질적이어서 조약을 체결하는 것이 불가능합니다. 그들은 군사력을 보유하고 있지 않습니다. 오직 미국만이 군사력을 보유하고 있습니다. 그들이 원하는 전부는 미국으로부터의 안전보장입니다. 대통령께서는 이번 회담에 뒤이어 힘찬 선언을 하셔야 합니다. 나는 [957면] 이 시점에, 군사적 성공과 대통령의 순방 이후라면, 태평양 조약보다 더 큰 성공을 거둘 수 있으리라 생각합니다.\n\n래드퍼드 제독: 지난 5월 퀴리노가 소집한 회담[주5] 때 저는 마닐라에 있었습니다. 회의에는 참석하지 않았지만 여러 대표들과 이야기를 나누었습니다. 대체로 맥아더 장군이 지적한 것과 같은 느낌이었습니다. 그들은 서로 단결할 수 있다고 느끼지는 않았으나, 어떤 발표가 있기 전에 미리 알기를 원했습니다. 진심으로 동의할 테지만 사전 협의를 받고 싶어 하리라고 확신합니다. 그런 선언을 유엔 연설에 넣을 수 있다고 생각하며, 그들이 사전 협의를 받을 수 있다면, 처음부터 관여했다고 느낄 것입니다. 조치를 취하지 않으면 6개월 안에 평화가 다시 깨질 것입니다. 우리는 냉엄한 현실을 직시해야 합니다. 평화를 유지하려면 한국에서 따랐던 정책을 계속해야 합니다. 인도차이나의 상황은 우리가 무엇을 할 수 있는지, 무엇을 해야 하는지에 관해 가장 난해한 문제입니다.\n\n해리먼 씨: 트루먼 독트린이라고 말씀하실 때, 직접적인 외부 침략을 말씀하시는 겁니까, 아니면 인도차이나에서 계속되어 왔고 이전에 그리스에서 일어나 트루먼 독트린의 적용 대상이 되었던 그런 종류의 일을 말씀하시는 겁니까?\n\n맥아더 장군: 직접적 침략을 말하는 것입니다. 인도차이나 상황은 난해합니다.[주6] 프랑스군은 그곳에 최정예 15만 명을 주둔시키고 있고, 최고의 명성을 가진 장교가 지휘하고 있습니다. 병력은 우리가 방어선에 보유했던 것의 두 배이고, 상대하는 적은 북한군이 보유했던 것의 절반입니다. 왜 소탕하지 못하는지 이해할 수 없습니다. 4개월이면 소탕할 수 있을 텐데, 최근 우리는 궤멸을 목격했습니다. 이것은 훨씬 더 심각한 우려의 문제를 제기합니다. 프랑스 육군의 능력과 수준은 무엇인가? 1차 세계대전에서는 그들은 훌륭했습니다. 2차 세계대전에서는 형편없었습니다. 현재의 프랑스군 병사는 의심스럽습니다. 프랑스가 싸우지 않는다면 유럽 방위가 그들에게 달려 있기 때문에 우리는 곤경에 처합니다. 그들은 프랑스 육군의 정수를 인도차이나에 두고 있으면서 싸우고 있지 않습니다. 만일 이것이 사실이라면 우리가 아무리 많은 보급품을 쏟아부어도 소용이 없을 수 있습니다. 영토 상실 자체는 아무것도 아니지만, 프랑스의 실패는 이것보다 더 광범위한 문제입니다. 나는 도무지 이해할 수 없습니다.\n\n대통령: 나도 도무지 이해할 수 없습니다.\n\n래드퍼드 제독: 프랑스는 현지 인도차이나인들로부터 대중적 지지를 전혀 받지 못하는 듯합니다. 프랑스는 현지 병력을 훈련시켜야 합니다. 나머지 동남아시아—버마, 시암—는 중국 공산군이 침략 정책을 추구할 경우 완전히 무방비 상태입니다. 우리는 아마도 다른 어느 곳보다 인도차이나에서 원조할 여지가 더 있을 것입니다. 우리는 프랑스의 기백을 북돋워야 합니다.\n\n[958면]\n\n해리먼 씨: 프랑스는 유럽과 아시아 양쪽에서 핵심 위치를 점하고 있습니다. 이탈리아에서 프랑스군이 잘 싸웠다고 현지에 갔던 장교들에게 들은 적이 있습니다. 이것은 우리가 깊이 숙고해야 할 문제입니다. 프랑스는 인도차이나에 대한 그들의 태도를 바꾸어야만 합니다.\n\n대통령: 우리는 인도차이나와 관련하여 프랑스를 수년간 설득해 왔지만 성공하지 못했습니다.\n\n브래들리 장군: 프랑스군 일부는 지난 전쟁 때 잘 싸웠습니다. 제2프랑스기갑사단이 내 지휘 아래 있었는데 아주 잘 싸웠지만, 그들은 싸움을 계속하기 위해 프랑스를 탈출한 선발된 사람들이었습니다. 그들을 기준으로 모든 프랑스군의 전투를 판단할 수는 없습니다.\n\n대통령: 이것이야말로 우리가 직면한 가장 낙담스러운 일입니다. 제섭 씨와 다른 이들이 프랑스가 인도네시아에서 네덜란드가 했던 일을 하도록 설득하려고 혼신의 힘을 다했지만, 프랑스는 들으려 하지 않았습니다. 프랑스 총리가 나를 만나러 온다면, 그는 아주 노골적인 이야기를 듣게 될 것입니다. 그에게 기분 나쁜 소리를 할 작정입니다. 그가 그런 말을 듣기 싫다면 그를 내게서 멀리 떼어 놓는 편이 좋을 겁니다.\n\n래드퍼드 해군 제독: 최근 하와이에 프랑스 함정이 몇 척 있었습니다. 인도차이나로 가고 싶어 하지 않고 질질 끄는 인상을 받았습니다. 내가 초대했더라면 진주만에 6개월은 머물렀을 겁니다.\n\n대통령: 맥아더 장군과 필리핀 상황에 대해 꽤 긴 시간 이야기했습니다.[주7] 장군은 도지 씨[주8]가 이 상황을 해결하는 데 도움이 될 수 있을 것이라고 제안했습니다. 그를 그곳에 보낼 수만 있다면 일이 해결되리라 생각합니다.\n\n페이스 장관: 그를 빼낼 수 있을까요?\n\n맥아더 장군: 그는 지금 일본에서 일을 하고 있으며, 그 일을 마치고 약 2, 3개월 후면 빼낼 수 있을 겁니다.\n\n대통령: 맥아더 장군이 키리노를 부르라고 제안했습니다. 아마 그를 불러 우리가 무엇을 원하는지 말해야 할지도 모르겠습니다. 그것이 옳은 일인지 확신할 수 없습니다.\n\n맥아더 장군: 만약 그에게 5천만 달러를 주려는 거라면, 그래야 한다고 생각합니다 (웃음).\n\n대통령: 맥아더 장군과 나는 포모사에 대해 충분히 이야기를 나누었습니다. 그 주제를 다시 다룰 필요는 없습니다. 장군과 나는 완전히 의견이 일치합니다.\n\n브래들리 장군: 유엔의 추가 병력 제공 제의와 관련하여, 그들 중 일부가 군사적 가치에 비해 더 많은 문제를 일으키는 것은 아닙니까? 정치적으로는 훌륭합니다. 일부 제의는 여전히 모호한 형태입니다. 어떤 부대는 2월이나 3월에 한국에 도착할 예정입니다. 대부분의 경우 우리가 그들의 수송, 유지, 훈련 비용을 부담해야 하며, 맥아더 장군이 11월까지 군사 작전을 종결할 것으로 예상하는 마당에, 계속 그들을 설득할 가치가 있습니까, 아니면 상징적인 병력만 요청해야 합니까?\n\n맥아더 장군: 그들은 군사적 관점에서 쓸모가 없으며 아마도 절대 실전을 겪지 못할 것입니다. 정치적 관점에서는 유엔의 색채를 부여합니다. 나는 이 두 가지 고려사항 사이의 균형을 워싱턴에서 결정해야 한다고 생각합니다. 내가 할 수 있는 일이 아닙니다.\n\n브래들리 장군: 아마도 유엔의 색채를 유지하되 비용을 줄일 수 있을 것입니다. 예를 들어, 추가 훈련을 위해 1개 여단을 오키나와로 파견하자고 제안한 캐나다의 경우처럼 상징적인 부대만 두는 것입니다.\n\n제섭 대사: 캐나다 외무장관 피어슨 씨가 말하기를, 캐나다는 한국에 군대를 보내는 것을 선호하지 않지만 국제적 복무에 배치하는 것에는 기꺼이 응할 것이며, 아마도 유럽에 배정할 수도 있다고 했습니다.\n\n래드퍼드 해군 제독: 캐나다는 일부 대표 병력이 있습니다. 한국에 구축함 세 척을 보냈습니다.\n\n맥아더 장군: 그들의 복무는 탁월했습니다.\n\n러스크 씨: 얼마 전 바즈파이가 네루가 마음속에 굴리던 어떤 제안에 대해 헨더슨에게 말했습니다. 바로 인도군과 파키스탄군을 한-만 및 한-소 국경을 따라 배치하여 이들 국가들과 주한 미군 사이의 완충 역할을 하게 하는 것이었습니다. 그들이 이야기하고 있을 때, 네루가 바즈파이를 부르러 보냈고, 잠시 후 그가 돌아와 말하기를 네루가 그 구상 전체를 취소했다고 했습니다. 네루가 나중에 이 안이나 이와 비슷한 것을 다시 꺼내 올 경우를 대비해 생각해 봐야 할 것 같습니다. 맥아더 장군이 그러한 계획이 위험하다고 생각하실지 궁금합니다.\n\n맥아더 장군: 군사적 관점에서 방어가 불가능할 겁니다. 나는 그곳에 한국군을 배치할 것입니다. 그들이 완충 병력이 될 것입니다. 나머지 병력은 평양에서 북쪽으로 20마일 되는 지점에서 함흥에 이르는 선 이남으로 철수시킬 것입니다. 나는 비한국군을 가능한 한 빨리 한국에서 모두 철수시키고 싶습니다. 그들은 선거 직후에 곧 이동해야 합니다. 한국군이 상황을 감당할 수 있습니다. 아시아에서 가장 큰 재앙은 이승만 정부에 대한 일부 유엔의 반대로 인해 한국인들이 우리에게서 등을 돌리는 경우일 것입니다. 그들은 그들 자신의 군사 문제를 충분히 처리할 능력이 있습니다. 우리가 그들을 우리에게서 돌아서게 만든다면 유감스러운 일일 것입니다. 나는 그들을 북한과 정확히 똑같은 기준으로 다루려는 유엔 결의안을 본 이후로 불안에 떨어 왔습니다. 무초 대사가 말했듯이, 한국인들은 민감한 민족이며 우리가 쉽게 그들을 우리에게서 등을 돌리게 만들 수 있습니다. 그토록 잘 버텨왔고 그렇게 큰 타격을 받은 정부를 권좌에서 몰아내고 북한인들과 똑같이 대우하는 것은 나쁜 일일 것입니다. 우리는 이 정부를 지지해왔으며 그렇게 하는 과정에서 2만 7천 명의 사상자를 냈습니다. 그들은 유엔의 후원 아래 정당하게 선출된 정부이며 실망시켜서는 안 됩니다.\n\n대통령: 이것은 그렇게 할 수도 없고 그렇게 해서도 안 됩니다. 우리는 이 정부를 지지할 것을 반드시 주장해야 합니다.\n\n러스크 씨: 우리는 유엔에서 우리의 관점을 설명하고 설득해왔지만, 이승만 정부에 대항하는 효과적인 선전 공세가 있어 일부 유엔 대표단에 영향을 미쳤습니다.\n\n대통령: 우리가 이승만 정부를 지원하고 있으며 선전은 “지옥에나 가라”는 점을 분명히 해야 합니다.\n\n우리가 실제로 다룰 수 있었던 것보다 이렇게 많은 주제를 다루었다는 것을, 여기 오지 않은 사람이라면 아무도 믿지 않을 것입니다. 열두 시에 점심 식사를 위해 헤어지고, 그동안 성명서[주9]를 준비하고 참모들 간의 대화를 계속할 수 있겠습니다. 그런 다음 두 분에게 훈장을 두 개 수여하고 점심 식사 후에 모두 떠날 수 있을 것입니다.\n\n맥아더 장군: 괜찮으시다면, 저는 가능한 한 빨리 돌아가고 싶습니다. 편찮으시지만 않다면 점심 식사 전에 떠나고 싶습니다.\n\n대통령: 이것으로 주요 안건들을 다룬 것 같습니다. 페이스 장관님, 더 다루실 사항이 있으십니까?\n\n페이스 장관: 예, 대통령님, 하지만 맥아더 장군님과 따로 다룰 수 있습니다. 그리고 브래들리 장군님도 아마 몇 가지 있으실 겁니다.\n\n대통령: 성명서는 준비되는 대로 제출되어야 하며 맥아더 장군께서는 즉시 귀환하실 수 있습니다. 이것은 매우 만족스러운 회담이었습니다.\n\n공식 회담은 웨이크 섬 시간으로 0912시에 종료되었다. 이후 한 시간 반 동안 두 그룹의 여러 구성원들 사이에 비공식 논의가 계속되었다.", "secondary": "Wake Island, October 15, 1950\n\ntop secret\n\nCompiled by General of the Army Omar N. Bradley, Chairman of the Joint Chiefs of Staff, From Notes Kept by the Conferees From Washington [주1]\n\nThe following were at the table:\n\nThe President\n\nGeneral of the Army Douglas MacArthur\n\nAdmiral Arthur W. Radford, Commander-in-Chief U.S. Pacific Fleet\n\nAmbassador John Muccio\n\nSecretary of the Army Frank Pace\n\nColonel A. L. Hamblen\n\nAmbassador at Large Philip C. Jessup\n\nGeneral of the Army Omar N. Bradley\n\nAssistant Secretary of State Dean Rusk\n\nMr. W. Averell Harriman\n\nThe conference opened at 0736.\n\nThe President asked General MacArthur to state the rehabilitation situation with reference to Korea.\n\n[949면]\n\nGeneral. MacArthur: It cannot occur until the military operations have ended. I believe that formal resistance will end throughout North and South Korea by Thanksgiving. There is little resistance left in South Korea—only about 15,000 men—and those we do not destroy, the winter will. We now have about 60,000 prisoners in compounds.\n\nIn North Korea, unfortunately, they are pursuing a forlorn hope. They have about 100,000 men who were trained as replacements. They are poorly trained, led and equipped, but they are obstinate and it goes against my grain to have to destroy them. They are only fighting to save face. Orientals prefer to die rather than to lose face.\n\nI am now driving with the First Cavalry Division up the line to Pyongyang. I am thinking of making up a tank and truck column and sending it up the road to take Pyongyang directly. It depends on the Intelligence we get in the next 48 hours. We have already taken Wonsan. I am landing the X Corps which will take Pyongyang in one week. The North Koreans are making the same mistake they have made before. They have not deployed in depth. When the gap is closed the same thing will happen in the north as happened in the south.\n\nIt is my hope to be able to withdraw the Eighth Army to Japan by Christmas. That will leave the X Corps, which will be reconstituted, composed of the Second and Third Divisions and U.N. detachments. I hope the United Nations will hold elections by the first of the year. Nothing is gained by military occupation. All occupations are failures. (The President nodded agreement.) After elections are held I expect to pull out all occupying troops. Korea should have about ten divisions with our equipment, supplemented by a small but competent Air Force and also by a small but competent Navy. If we do that, it will not only secure Korea but it will be a tremendous deterrent to the Chinese Communists moving south. This is a threat that cannot be laughed off. Again I emphasize the fact that the military should get out the minute the guns stop shooting and civilians take over. Korea is a land of poverty. It has been knocked down for a long time and a little money goes a long way. Houses are made of mud and bamboo. When knocked down they can be put up in two weeks. An estimate was made by ECA of the cost of rehabilitation and it was estimated to be $900,000,000. Another estimate was made locally and it placed the cost at about 1½ billion dollars. I believe these estimates are far too high. I do not believe that you can absorb and spend in Korea much more than $150,000,000 a year. I believe three years of that will place Korea on its feet and not only make Korea self-sustaining but give a higher living standard. I believe that half a billion dollars spread over three to five years will more than make up the destruction.\n\n[950면]\n\nAmbassador Muccio: The General has made an important point. Korea’s capacity to absorb is limited. This applies to the economic field and to other fields. We should emphasize the mental and psychological rehabilitation more than the economic. The northern area has been under complete domination for five years. This is the first time we have moved into an area that has been dominated by Communists. We have a challenging opportunity. I want to see more emphasis on the education and information field than in the material rehabilitation. The economy of Korea is basically a very simple one. I believe with the General that $150,000,000 a year is all she can absorb. (Turning to General MacArthur) Is the cost of the Armed Forces included in that estimate?\n\nGeneral MacArthur: No. Equipment and military forces are not included.\n\nSecretary Pace: Is the directive The President sent sufficiently comprehensive?\n\nGeneral MacArthur: Yes.\n\nSecretary Pace: What, generally, are the critical and over-all requirements of the Army during this period? We are in a critical financial situation. Our day of reckoning is going to come in the form of a supplemental in December.\n\nGeneral MacArthur: You gave us 40 days, 60 if necessary. We will have that estimate in 60 days. That will be about 30 days from now. This, you understand, is going to be some speculative guess work, but will be accurate to within 25%.\n\nSecretary Pace: When the Army’s responsibility ends, could the Army provide aid in psychological rehabilitation? Should KMAG continue?\n\nGeneral MacArthur: The KMAG group has been wonderful. As far as the military mission is concerned, I think it should be continued indefinitely. I want to pay high tribute to that group. I believe that 500 officers and men should be continued indefinitely. At the start of rehabilitation the Army will have to continue until the civil rehabilitation is organized. It should be organized as rapidly as possible. The United Nations should take it over. You will have a hard job getting good men to serve in Korea. It is not a nice place.\n\nSecretary Pace: In the period of rehabilitation General Walker can assess the leadership qualities of the ROK men to take over civilian leadership.\n\nGeneral MacArthur: Mr. Muccio knows more about this than I do and the Embassy has a thorough knowledge of the Koreans.\n\nAmbassador Muccio: The Koreans are very obstinate. They have been pushed around so long they don’t like it. They are convinced that we do not want Korea. The Mission has done a great job training the [951면] young Koreans. They have pushed aside the old Chinese and Japanese trained Koreans. There is no hope in the old Koreans, but in the young ones there is great hope.\n\nMr. Rusk: Is it undesirable to turn KMAG into a U.N. operation? Would that spoil its effect?\n\nGeneral MacArthur: From a political point of view it would be O.K., but militarily there must be unity of doctrine. The others may have different doctrines than we have.\n\nGeneral Bradley: It didn’t work in Greece. We had to take it all over.\n\nMr. Rusk: We might be able to work it out by using small numbers of other Nationals or by getting the U.N. to ask the U.S. to take it on a contract basis. The other question I had was that we would like to see military responsibility for relief and rehabilitation end, and would also like to see the U.S. operation moved over to the U.N. On the other hand, the U.N. is trying to do something it has never done before. It is going to have some responsibilities never before undertaken on the same scale. It may be necessary for an organization like ECA to stand by and resume some of the responsibilities. Is it fair for us to assume that the basic installations of the country—railroads, water, etc.—will be in adequate use before the U.N. take over?\n\nGeneral MacArthur: I believe a good deal of that will be done. I believe lots will remain to be done to put them back in good condition. The Army, the minute it takes a city, gets them going but it is only temporary. ECA is continuing to do that. The President sent a letter last week to Mr. Foster [주2] and told them to go ahead with the long-term rehabilitation. ECA should continue to function.\n\nAmbassador Muccio: Heavy industries, railroads and utilities should be taken over by the Koreans and not wait for the United Nations to get in. The railroad from Pusan to Yongdungpo was put in operation within one week.\n\nThe President: What about utilities and railroads?\n\nGeneral MacArthur: It will undoubtedly take time to put utilities back in operation. The ECA is continuing to function.\n\nAmbassador Muccio: The Army has done well opening railroads. ECA has helped. The Army has had the means and has done a great job with ECA, putting water and trains in operation. A group of transportation men who have been with the railroad company have been most helpful. Fortunately, we had an ECA man who had worked on new development for water works and within a short while he had water running in Seoul. A considerable number of new locomotives have been brought in.\n\n[952면]\n\nSecretary Pace: Is there anything in terms of ECA and Army cooperation that we might do to help you?\n\nGeneral MacArthur: No commander in the history of war has ever had more complete and adequate support from all agencies in Washington than I have.\n\nAmbassador Jessup: In regard to the figures which you suggested on the needs, does that include the cost of reconstructing industrial plants in the north?\n\nGeneral MacArthur: Yes, except munitions making. Those plants I would not include.\n\nGeneral Bradley: In regard to the reconstruction of the railroads, I had a lot of trouble in Europe, with pilots shooting up everything that moved and bombing the barracks that we were going to use later. Are you faced with the same thing?\n\nGeneral MacArthur: Me too (laughter).\n\nMr. Rusk: To what extent is the other side stripping plants?\n\nGeneral MacArthur: They have to some extent. In Inchon I saw at least 20 flat cars which were loaded up with orated factory gadgets which they had not been able to get out. The North Koreans were not in the south long enough to do more than ordinary looting. I believe, however, that industry has not been seriously damaged in North Korea.\n\nMr. Harriman: Could we hear more about psychological rehabilitation?\n\nAmbassador Muccio: Bring in the Koreans more. They know their own people better than we do. We should provide them with radios and text books and also scientific guidance. We could set up a very effective system with a radio or loudspeaker in every school and village center. I had sound trucks which were very, very effective. With no newspapers and radio service, we sent them out to rural districts and village centers.\n\nThe President: I believe in sound trucks. I won two elections with them. (Laughter)\n\nMr. Harriman: What about the psychological differences between North and South Koreans?\n\nAmbassador Muccio: Koreans are Koreans. There is no basic difference between them. 80% of them are farmers, anyway. There is no basic schism between North and South Koreans except for a few politicos and intellectuals.\n\nMr. Harriman: What about the 2,000,000 who came down south?\n\nAmbassador Muccio: They were, generally, people of some means. They will be going back to North Korea and will be very helpful to us.\n\nGeneral Bradley: What can you do with the 60,000 prisoners you now have?\n\n[953면]\n\nGeneral MacArthur: They are the happiest Koreans in all Korea. For the first time they are well fed and clean. They have been de-loused and have good jobs for which they are being paid under the Geneva Convention. I believe there is no real split, but their attitude is due only to the banner that flies over them. There is no difference in ideology and there are no North and South Korean blocs.\n\nThe President: How will Syngman Rhee take the idea of the election?\n\nGeneral MacArthur: He won’t like it.\n\nAmbassador Muccio: The last election was an honest election, about as honest as any ever held in the Far East. How are you going to ignore that? I hope the new Commission will not interpret that as requiring a nationwide election. How you are going to ignore members of the National Assembly is a major problem. The resolution was so worded that it could be interpreted in different ways. There have never been local elections or elections for provincial governors. These could be held.\n\nMr. Rusk: We must not undermine the present Korean government. I think it may be possible to have your local and by-elections in the south and elections in the north, and then it will be almost time for the 1952 elections throughout the country. I think it will require a good deal of patience.\n\nMr. Harriman: How about the interim period between elections?\n\nGeneral MacArthur: North Korea will be under military control. The U.N. resolution calls for the maintenance of local governments wherever possible. This will not be possible. We expect them to either flee or be killed. Local government will be maintained by appointing local officials recommended by ROK officials.\n\nAmbassador Muccio: There is also the problem of currency to use and what land reform laws to retain in North Korea.\n\nGeneral MacArthur: In the interim the military will freeze land tenure, banks and currency. I will keep the North Korean currency in effect in North Korea without setting a rate to the dollar or ROK won until the civilian government can take over.\n\nThe President: What are the chances for Chinese or Soviet interference?\n\nGeneral MacArthur: Very little. Had they interfered in the first or second months it would have been decisive. We are no longer fearful of their intervention. We no longer stand hat in hand. The Chinese have 300,000 men in Manchuria. Of these probably not more than 100/125,000 are distributed along the Yalu River. Only 50/60,000 could be gotten across the Yalu River. They have no Air Force. Now that we have bases for our Air Force in Korea, if the Chinese tried to get clown to Pyongyang there would be the greatest slaughter.\n\n[954면]\n\nWith the Russians it is a little different. They have an Air Force in Siberia and a fairly good one, with excellent pilots equipped with some jets and B–25 and B–29 planes. They can put 1,000 planes in the air with some 2/300 more from the Fifth and Seventh Soviet Fleets. They are probably no match for our Air Force. The Russians have no ground troops available for North Korea. They would have difficulty in putting troops into the field. It would take six weeks to get a division across and six weeks brings the winter. The only other combination would be Russian air support of Chinese ground troops. Russian air is deployed in a semicircle through Mukden and Harbin, but the coordination between the Russian air and the Chinese ground would be so flimsy that I believe Russian air would bomb the Chinese as often as they would bomb us. Ground support is a very difficult thing to do. Our Marines do it perfectly. They have been trained for it. Our own Air and Ground Forces are not as good as the Marines but they are effective. Between untrained Air and Ground Forces an air umbrella is impossible without a lot of joint training. I believe it just wouldn’t work with Chinese Communist ground and Russian air. We are the best.\n\nMr. Harriman: What about war criminals?\n\nGeneral MacArthur: Don’t touch the war criminals. It doesn’t work. The Nurnberg trials and Tokyo trials were no deterrent. In my own right I can handle those who have committed atrocities and, if we catch them, I intend to try them immediately by military commission.\n\nThe President: Another subject—What is your idea about a Japanese peace treaty [주3] without including Russia and Communist China?\n\nGeneral MacArthur: I would call a conference at once and invite them. If they don’t come in, go ahead. After the treaty is drawn up, submit to them a draft of the treaty and if they don’t sign, go ahead with the treaty. The Japanese deserve a treaty.\n\nThe President: What would the effect on Japanese security be when our troops leave?\n\nGeneral MacArthur: Under the name of Police Reserve, we are organizing four divisions of Japanese troops to secure Japan. The present draft of the treaty by the State Department is very good. After friction with the Joint Chiefs of Staff it has been polished until it shines like a diamond. It will call for the security of Japan to be secured by the United Nations with the United States acting as the agency of the U.N. until the U.N. is in a position to do it itself.\n\nThe President: Would we have to maintain three or four divisions in Japan until the Japanese can secure themselves?\n\n[955면]\n\nGeneral MacArthur: I should say that they would have to be maintained there for several years. At the present time the Japanese, in accordance with the laws of war, furnish a great many things for those troops. They put up $300,000,000 a year. This includes barracks, lights, etc. When this treaty of peace is made I believe this should be changed. The troops should pay their way. We should pay rental, etc. The Japs would not object if they didn’t have to pay the bill for the support of these divisions.\n\nGeneral Bradley: Will the Japanese who have kept the faith while our troops were gone expect to receive different treatment from the troops when they return from Korea?\n\nGeneral MacArthur: Omar, there is complete camaraderie between the troops and the Japanese. The Japanese like our troops. I think that the presence of the troops means prosperity. They spend money and bring in so much. The Eighth Army was pulled out of occupation in January. When they come back they will have nothing to do with occupation.\n\nGeneral Bradley: The Eighth Army is returning to Japan soon. We have the problem of getting additional troops to Europe. As it now stands it will be April before we can get a division into Europe. Could the Second or the Third Division be made available to be sent over to Europe by January?\n\nGeneral MacArthur: Yes, I will make one available by January. I would recommend that the Second Division be selected, as it is a veteran division, better trained, and would make a better impression.\n\nSecretary Pace: Would GARIOA end with the peace treaty?\n\nGeneral MacArthur: Yes, Japan will be self-sufficient in 1952, treaty or no treaty.\n\nSecretary Pace: Should SCAP continue after the treaty of peace?\n\nGeneral MacArthur: SCAP should completely cease. I think these troops should be directly controlled by the Department of Defense, just like troops in the United States, and their relationship with the Japanese should be the same as garrisons in America. I don’t think they should have anything to do with political aspects. SCAP should discontinue entirely. I told Mr. Dulles I believe I could sell that to the Japanese. Understand, if you skin them alive as Carlos Romulo, and some of the other boys want to, you won’t be able to get anything from them. I think the text drawn up by the State Department is a very fine treaty.\n\nMr. Rusk: In connection with those troops moving back from Korea to Japan, ideally, we should have a peace treaty before military occupations in Korea wind up, but your operations in Korea are going faster than the diplomats can go in getting a treaty.\n\n[956면]\n\nGeneral MacArthur: I hope to get the Eighth Army back by Christmas.\n\nMr. Rusk: We cannot meet that. Should you let the Japs know we are going to have a peace treaty and make a statement to the Japs about the treaty to facilitate the return of the troops?\n\nGeneral MacArthur: Your thought is a good one. Last January I made some statement along those lines. This January I will scratch their backs again somehow.\n\nMr. Harriman: Should we begin to pay some of the expenses of occupation on return from Korea?\n\nGeneral MacArthur: Averell, that is what we should do. If we do this we can stop the GARIOA. We are taking more out than we are putting in. It is not the Japs’ fault that we do not have a treaty. It is an iniquitous thing that we are taking more out than we are putting in. It is a breach among the allies which prevents a treaty. Three years ago they did everything we asked and we have a moral obligation to them. If we pay our way in Japan for part of the cost of the troops in lieu of GARIOA funds, this might be a satisfactory arrangement if it can be worked out;\n\nSecretary Pace: I certainly think it merits consideration and no doubt it would have great psychological benefits. We have both internal problems in the Department of Defense and also with the Appropriations Committees of Congress. This isn’t a final view, but my personal opinion is that it should be given consideration.\n\nGeneral MacArthur: I am sure that you are right. Congress will not like it. All Congressional groups who came over wanted to swallow up more from the Japanese economy.\n\nThe President: You and State get together and work it out and bring it to me for approval.\n\nSecretary Pace: Or disapproval. (Laughter)\n\nThe President: I would like to hear your views, General, on a possible Pacific pact [주4] or some other arrangements similar to that in the Atlantic.\n\nGeneral MacArthur: A Pacific pact would be tremendous, but due to the lack of homogeneity of the Pacific nations, it would be very difficult to put into effect. If the President would make an announcement like the Truman Doctrine, which would be a warning to the predatory nations, it would have a great effect. It is not possible to get a pact, since they are so nonhomogeneous. They have no military forces. Only the United States has the forces. All they want is the assurance of security from the United States. The President should follow up this conference with a ringing pronouncement. I believe [957면] that at this time, after the military successes and the President’s trip, it would have more success than a Pacific pact.\n\nAdmiral Radford: I was in Manila last May during the conference Quirino called. [주5] I didn’t attend the meetings but I spoke to a number of delegates. There was generally the same feeling that General MacArthur brought out. They didn’t feel they could get together but they would like to know in advance of any announcement. I am sure they would heartily agree but would like to be consulted. I believe such a pronouncement could be included in the U.N. speech and if they could be consulted, they would feel they were in on the ground floor. The peace will be upset again in six months if you do not k you should (laughter).\n\nThe President: General MacArthur and I have talked fully about Formosa. There is no need to cover that subject again. The General and I are in complete agreement.\n\nGeneral Bradley: With regard to the offers of additional troops from the United Nations, are not some of them more trouble than [959면] they are worth militarily? Politically they are fine. Some of the offers are still in nebulous form. Some are due to arrive in Korea in February or March. In most cases it will be necessary for us to pay for their transportation, maintenance and training and inasmuch as General MacArthur expects to have concluded military operations by November, is it worthwhile to continue working on them or should we ask only for token forces?\n\nGeneral MacArthur: They are useless from the military point of view and probably would never see action. From the political point of view, they give a United Nations flavor. I think that the balance between these two considerations should be struck in Washington. I cannot do it.\n\nGeneral Bradley: Perhaps the United Nations flavor could be retained but the cost reduced by having only token units as, for example, from Canada, which had proposed to send a brigade to Okinawa for further training.\n\nAmbassador Jessup: Mr. Pearson, the Canadian Minister of External Affairs, has said that the Canadians would prefer not to send troops to Korea but were willing to put them into international service, possibly to earmark them for Europe.\n\nAdmiral Radford: The Canadians have some representation. They have three destroyers in Korea.\n\nGeneral MacArthur: Their services have been excellent.\n\nMr. Rusk: Not long ago Bajpai spoke to Henderson about a suggestion Nehru was turning over in his mind. This would be placing Indian and Pakistani troops along the Korean-Manchurian and Korean-Soviet frontier to act as a buffer between these countries and the U.S. Forces in Korea. While they were talking, Nehru sent for Bajpai who returned shortly thereafter saying that Nehru had dropped the whole idea. We might think this over in case Nehru comes up with it or something similar in the future. I wonder if General MacArthur thinks such a plan would be dangerous.\n\nGeneral MacArthur: It would be indefensible from a military point of view. I am going to put South Korean troops up there. They will be the buffer. The other troops will be pulled back south of a line from 20 miles north of Pyongyang to Hamhung. I want to take all non-Korean troops out of Korea as soon as possible. They ought to move out soon after the elections. The ROK troops can handle the situation. The greatest calamity in Asia would be if the Koreans should turn against us as a result of some UN opposition to the Rhee Government. They are quite capable of handling their own military [960면] affairs. It would be a pity if we turned them against us. I have been shaking in my boots ever since I saw the UN resolution which would treat them exactly on the same basis as the North Koreans. As Ambassador Muccio has said, the Koreans are a sensitive people and we might easily turn them against us. It would be bad to turn out of office a government which had stood up so well and taken such a beating, and to treat them just like the North Koreans. We have supported this government and suffered 27,000 casualties in doing so. They are a government duly elected under United Nations auspices and should not be let down.\n\nThe President: This cannot be done and should not be done. We must insist on supporting this government.\n\nMr. Rusk: We have been working and explaining our point of view in the United Nations but there has been an effective propaganda campaign against the Rhee Government which has infected some of the UN delegations.\n\nThe President: We must make it plain that we are supporting the Rhee Government and propaganda can “go to hell”.\n\nNo one who was not here would believe we have covered so much ground as we have been actually able to cover. We might break up to have luncheon at twelve o’clock and in the meantime a communiqué [주9] could be prepared and talks among the members of the staff can be carried on. Then I want to award a couple of medals to a couple of people and we can all leave after luncheon.\n\nGeneral MacArthur: If it’s all right, I am anxious to get back as soon as possible and would like to leave before luncheon if that is convenient.\n\nThe President: I believe this covers the main topics. Secretary Pace, did you have anything else to take up?\n\nSecretary Pace: Yes, sir, but I can take them up separately with General MacArthur, and I imagine General Bradley has some also.\n\nThe President: The communiqué should be submitted as soon as it is ready and General MacArthur can return immediately. This has been a most satisfactory conference.\n\nThe formal conference ended at 0912, Wake Island time. Informal discussions continued for one and one-half hours between various members of the two groups.\n\n[961면]", "notes": ["[주1] 본 회담 비망록은 워싱턴 측에서 회담에 배석한 인사들의 기록을 Bradley 합참의장이 편집한 것이다. 따라서 MacArthur 장군 측 배석자들의 기록은 포함되어 있지 않을 가능성에 유의해야 한다.", "[주2] 당시 ECA 청장을 지낸 William C. Foster로 추정된다.", "[주3] 대일 강화 조약: 1951년 9월 8일 샌프란시스코에서 조인된 「일본국과의 평화조약」.", "[주4] 태평양 조약: 1951년 9월 1일 체결된 ANZUS 조약을 거쳐, 1954년 9월 8일 동남아시아 집단 방위 조약(SEATO)이 체결됨.", "[주5] 엘피디오 퀴리노 필리핀 대통령이 1950년 5월 태평양 조약을 모색하기 위해 소집한 바기오 회의를 말한다.", "[주6] 1950년 10월 초 프랑스가 철수한 까오방 지역에서 발생한 일련의 군사적 패배에 관한 보고에 대한 언급인 듯하다.", "[주7] 관련 문서는 vol. vi, pp. 1399 ff. 참조.", "[주8] Joseph M. Dodge, 연합국최고사령관(일본) 재정 고문.", "[주9] 948면 각주 1 참조."], "warn": false, "pages": ["50-949", "50-950", "50-951", "50-952", "50-953", "50-954", "50-955", "50-956", "50-957", "50-958", "50-959", "50-960", "50-961"], "search": "Truman, Harry S. (대통령) MacArthur, Douglas (육군 원수, 극동군사령관) Bradley, Omar N. (육군 원수, 합동참모본부 의장) Radford, Arthur W. (제독, 미 태평양 함대 사령관) Muccio, John (주한대사) Pace, Frank (육군장관) Hamblen, A. L. (대령) Jessup, Philip C. (무임소 대사) Rusk, Dean (국무차관보) Harriman, W. Averell Rhee, Syngman 이승만(李承晩) Walker, Walton (중장, 제8군 사령관) Foster, William C. (ECA 청장) Rusk 러스크 Harriman 해리먼 MacArthur 맥아더 Muccio 무초 Truman 트루먼 Bradley 브래들리 Pace 페이스 Radford 래드퍼드 Quirino 퀴리노 Dulles 덜레스 Romulo 로물로 Radford 래드퍼드, 미 해군 제독 Jessup 제섭 Dodge 도지(Joseph M. Dodge) Pace 페이스, 미 육군 장관 Quirino 키리노, 필리핀 대통령 Pearson 피어슨, 캐나다 외무장관 Bajpai 바즈파이, 인도 외무차관 Henderson 헨더슨 Nehru 네루, 인도 총리 Muccio 무초, 주한미국대사 Rhee 이승만(李承晩)"}, {"id": "50-d701", "order": 40, "date": "1950-10-21", "group": "F", "eyebrow": "50-d701 · The Ambassador in Korea (Muccio) to the Secretary of State", "title": "주한대사(무초)가 국무장관에게 보낸 전보", "badge": "secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-10-21"}, {"k": "시각", "v": "received October 21—11:49 p.m."}, {"k": "발신", "v": "Muccio 무초", "txt": true}, {"k": "수신", "v": "the Secretary of State 국무장관", "txt": true}, {"k": "장소", "v": "Seoul"}, {"k": "전문번호", "v": "284"}, {"k": "종류", "v": "전보"}, {"k": "원문출처", "v": "7956.00/10–2150: Telegram", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d701"}], "summary": "북한 통치와 선거에 대한 이승만의 견해를 무초가 7개 항으로 정리해 보고한다.", "points": ["이승만은 유엔 군당국이 북한 통치에 공산주의자나 공산정권 기구를 일시적으로라도 쓰는 데 단호히 반대한다.", "이승만은 자신이 북한 관리를 직접 임명하려는 것이 아니라 유엔한국통일부흥위원단의 선거 관찰과 공정한 절차를 요구한다.", "이승만이 공개 발언을 할 정도로 강경해진 직접 원인은 주한미군이 작성한 북한 행정 관련 비밀 문서를 입수했기 때문이다.", "무초는 이승만이 그 문서를 보지 않았더라면 유엔 원칙에 도전하는 듯한 선언까지 하지는 않았을 것이라고 본다."], "primary": "비밀(secret)\n\n서울, 1950년 10월 21일.\n[10월 21일 오후 11시 49분 접수]\n\n284. 국무부 전보 215호(10월 18일) 관련. 대통령과 참조 전보의 주제를 여러 차례 논의한 데 더해, 주한대사관 전보 278호(10월 20일)로 보고한 바와 같이, 노블이 오늘 이승만 대통령과 같은 주제로 길게 논의하였다. 배경 정보로 전달하는 그의 견해는 핵심이 다음과 같다:\n\n(1)\n\n대한민국 정부는 시종일관 유엔조선임시위원단(UNCOK)에 따라 행동할 것을 결의하고 있다.\n\n(2)\n\n북한 출신 이전 피난민들이 귀향하지 않기를 기대하는 것은 불가능하다. 그 경우 그들은 북한에서 중요한 역할을 맡을 것으로 예상되어야 하며, 이들은 대한민국 국민이다.\n\n(3)\n\n대통령은 북한 관리를 자신이 직접 임명하겠다고 주장하지 않는다. 그는 나(무초), 맥아더, 또는 유엔위원단 중 누군가가 유엔한국통일부흥위원단(UNCURK)이 한국인의 바람에 따라 자유로운 분위기 속에서 선거 실시를 관찰하기 위해 올 것이라는 성명을 발표해 주기를 바란다. 그는 그러한 선거가 사전에 공산주의자들을 권력의 자리에 임명하여 최종 선거 결과를 좌우할 수 있는 상태로 만드는 식으로 편향되지 않는다면, 그 결과를 전적으로 받아들일 용의가 있다고 말한다.\n\n(4)\n\n그는 유엔 군당국이 공산주의자, 전직 공산주의자, 또는 전직 공산정부 기구를 북한 통치에 이용하는 것에, 그것이 아무리 일시적이라 할지라도 변함없이 반대한다.\n\n(5)\n\nUP 통신 보도에 언급된 도지사들에 관해서는, 그들이 전쟁 훨씬 이전에 임명된 사람들이라고 말했다. 만약 그들이 북쪽으로 간다면 자신의 책임 아래 그리하는 것이며, 권력을 얻거나 유지하려면 그 지역 주민의 지지와 승인을 얻어야 한다. 그는 그들이 대한민국 정부 관리로서 가는 것은 아닐 것이라고 말한다. 대통령은 북한 출신 인사 중 도지사직을 포함한 여러 북한 관직에 적임인 자가 누구인지 조사하도록 지시했다고 말한다. 그는 그러한 정보를 주로 남한에 오래전부터 설립된 북한 단체들에 의존하며, 북한의 모든 도에 그러한 단체가 있다고 말한다. 그가 이 정보를 입수하면, 선발과 임명을 위해 각 후보직마다 아마 세 명의 이름을 유엔군사령관(CINCUNC)에게 제공할 것이다.\n\n(6)\n\n사전에 협의하지 않았다면, 대한민국 정부가 유엔임시위원단의 결정에 완전히 일치하여 행동할 것으로 기대해서는 안 된다. 대한민국 정부는 명백히 이해당사자이기 때문이다.\n\n(7)\n\n대한민국 정부는 북한에 어떤 군정도 수립하는 데 변함없이 반대한다. 이승만은 이미 서울에서 전직 주한미군정청(USAMGIK) 장교들[991면]이 과거 그들을 섬겼으며 실제로는 대한민국에 적대적인 인물들 중에서 그러한 군정 업무를 위한 인원을 모집하고 있다고 주장한다.\n\n이어진 대화에서 대통령은 10월 9일자 '민사 명령 26 A'라는 제목의 북한 행정에 관한 극동미육군(EUSAK) 일급비밀 문서 사본을 가지고 있음이 드러났다.[주1] 대화를 통해, 이 문서의 내용을 알고 있다는 점이 그가 우려하는 주된 원천이며 공산주의자들이 북한에서 유임되거나 일부 경우 권력에 복귀할 수도 있고, 또는 대한민국의 이익과 바람에 전혀 주의를 기울이지 않을지도 모른다는 공포의 원천임이 드러났다. 나는 이승만 대통령이, 그가 말하기를 한국 정부 내에 널리 알려져 있고 그 내용이 조만간 공산주의자들에게 알려질까 두렵다고 한 이 문서의 내용을 알지 못했더라면, 한국 문제의 올바른 해결을 내다보며 유엔이 정한 원칙에 대한 반항으로 해석되어 온 성명들을 발표할 정도로 동요하지는 않았을 것이라고 믿는다.\n\n도쿄에 정보 제공 목적으로 번호 없이 재전송.\n\n무초(Muccio)\n\n----- 각주 -----\n[주1] 북한 통치에 관한 지령 초안을 말한다. 육군부가 10월 3일 작성한 초안 문서의 각주 2, 857면을 보라.", "secondary": "secret\n\nSeoul, October 21, 1950. \n [Received October 21—11:49 p. m.]\n\n284. ReDeptel 215, October 18. In addition to several discussions subject matter reftel with President, as reported Embtel 278, October 20, same subject discussed by Noble with President Rhee lengthily today. His views transmitted for background information are essentially as follows:\n\n(1)\n\nGOK determined act accordance with UNCOK throughout.\n\n(2)\n\nImpossible expect former refugees from North Korea not go home; in that case they should be expected play significant role North Korea, and they are ROK citizens.\n\n(3)\n\nPresident does not insist on his appointment officials in North Korea. He does want some statement, either from me, from MacArthur, or UN Commission that UNCURK will come to Korea to observe conduct elections in accordance with desires Korean people in free atmosphere. He states he is entirely willing accept results such elections if they are not previously prejudiced by appointment Communists to positions power from which they can control eventual elections results.\n\n(4)\n\nHe is unalterably opposed to use by UN military authorities of Communists, former Communists, or former Communist government machinery for rule in North Korea, however temporary.\n\n(5)\n\nAs regards provincial governors mentioned in UP story, he said they were appointed long before war; if they go north they do so on own responsibility; for them to gain or maintain power they must secure support and approval of local inhabitants. He says they will not be going as GOK officials. President says he has ordered investigation what persons of North Korea origin would-be acceptable for various North Korean posts, including governorships; that the relies primarily for such information on North Korean organizations long established in South; says are such organizations for every North Korean province. When he has this information he will supply it to CINCUNC, perhaps three names for each potential post, for selection and appointment.\n\n(6)\n\nGOK should not be expected to act completely accord with UN Interim Committee decisions if GOK not previously consulted, since GOK obviously interested party.\n\n(7)\n\nGOK unalterably opposed establishment any military government North Korea; Rhee alleges there are former USAMGIK officers [991면] in Seoul already engaged recruiting staff for such service from among persons formerly serving them who actually are hostile to ROK.\n\nSubsequent conversation disclosed President possessed copy EUSAK top secret document re administration North Korea, dated October 9, “Civil Affairs Order 26 A”. [주1] Conversation disclosed his knowledge contents this document was chief source of concern and his fear Communists would be retained and possibly restored to power in some cases in North Korea, or that no attention would be paid to interests or desires of ROK. I believe were it not for President Rhee’s knowledge contents this document, which Rhee said was generally known in Korean Government and whose contents he feared would speedily become known to Communists, that he would not have become so upset as to make declarations which have been construed as being defiance of principles laid down by UN looking forward towards proper solution Korean question.\n\nRepeated info Tokyo unnumbered.\n\nMuccio", "notes": ["[주1] 지시하는 육군부 문서는 50-d679다.", "EUSAK은 Eighth United States Army in Korea로, 주한미군을 뜻한다."], "warn": false, "pages": ["50-991"], "search": "Muccio 무초 Noble 노블 Syngman Rhee 이승만(李承晩) MacArthur 맥아더"}, {"id": "50-d731", "order": 41, "date": "1950-11-01", "group": "D", "eyebrow": "50-d731 · Memorandum by the Director of the Central Intelligence Agency (Smith) to the President", "title": "중앙정보국장 스미스가 대통령에게 보낸 각서", "badge": "secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-11-01"}, {"k": "시각", "v": null}, {"k": "발신", "v": "중앙정보국장 Smith 스미스", "txt": true}, {"k": "수신", "v": "대통령", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "795.00/11–150", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d731"}], "summary": "스미스 중앙정보국장이 중공군 1만 5천~2만 명이 북한에서 유엔군과 교전 중이며 제한적 완충지대를 구축하려는 의도로 보인다고 보고했다.", "points": ["중공군 1만 5천~2만 명이 태스크포스 편제로 북한에서 유엔군과 교전 중이며 본대는 만주에 남아 있다.", "압록강 안둥-신의주 지역에서 소련식 제트기가 포착되어 소련이 병참 및 방공을 지원할 가능성이 제기된다.", "신의주의 라디오 방송이 수풍 지역 보호를 위한 의용군을 발표했고 만주 접경에 인민해방군이 집결했다고 강조했다.", "중공의 개입 목표는 만주 국경의 안전 보장과 수풍 발전 체계에서 만주 산업으로의 전력 공급 유지를 위한 제한된 방역선을 구축하는 것이다.", "유엔의 명확한 목표 규정에도 불구하고 중공은 진심으로 만주 침공을 두려워하는 것으로 보인다.", "한국군 장성이 만주 송전을 전면 차단하겠다고 최근 발언한 것도 중공의 우려를 키웠을 수 있다."], "primary": "secret\n\nWashington, 1950년 11월 1일.\n\n제목: 중공의 한국 개입.\n\n새로 보충되고 재무장한 북한군 부대가 한국 전선에 등장했으며, 중공군 역시 유엔군과 교전 중임이 확실히 밝혀졌다. 현재 야전의 추산으로는 1만 5천에서 2만 명 사이의 중공군이 편성된 태스크포스 단위 부대로 북한에서 작전 중이며, 모체 부대들은 만주에 남아 있다. 안둥-신의주 지역에서 소련제 제트기가 탐지되었다는 현 시점의 보고들은 소련이 적어도 만주 국경의 병참 제공권 방어를 맡고 있을 가능성을 시사한다. 또한 10월 31일 북한 임시 수도 신의주에서 나온 라디오 방송이 \"수풍 수력발전 지대 보호 의용군\"이 진격하는 유엔군으로부터 그 지역을 보호하기 위해 결성되었다고 발표했다. 방송은 만주의 산업에 있어 수풍 수력발전 체계의 중요성을 강조했고 중국 인민해방군 병력이 수풍 지대의 만주 측 연안을 따라 집결해 있다고 지적했다.\n\n이와 같은 일련의 사건과 보고들은 중공이 전면전으로 번질 위험이 커짐에도 불구하고 북한군에 대한 지원과 원조를 증대하기로 결정했음을 나타낸다. 중공이 소련의 지시 아래 한국에 전면 개입하는 데 몰두하고 있을 가능성을 배제할 수는 없다고 하더라도, 현재 보이는 그들의 주요 동기는 압록강 이남에 제한된 \"방역선(cordon sanitaire)\"을 구축하려는 데 있는 듯하다. 그러한 무인 지대를 구축하려는 중공의 일차적 목표는 아마 (a) 중국이 침략자로 [1026면] 규정한 유엔군으로부터 만주 국경의 안전을 보장하는 것, (b) 만주의 산업에 필수적인 수풍 수력발전 체계로부터의 지속적인 전력 공급을 보장하는 것일 터이다. 중공의 직접적 이해가 걸려 있는 이 앞선 고려사항들은 북한이 계속 저항할 수 있도록 도와 국제 공산주의를 더욱 촉진하려는 일반적 바람과도 부합할 것이다.\n\n중공은 유엔이 목표를 명확히 규정하고 있음에도 진심으로 만주 침공을 두려워하는 듯하다. 무커덴(현 선양)에서 산업 기계류와 민간인을 빼내고 있다는 보고는 그러한 두려움의 결과일 수 있다. 다만 이 철수가 유엔군이 한국에 개입한 중공군에 대한 보복 조치를 취할 가능성을 앞서서 예상하려는 시도일 가능성도 있다. 발전기가 압록강 남한 쪽에 위치한 수풍 수력발전 체계는 남만주 전력의 상당 부분과 뤼순 항 해군기지 지구 전력의 대부분을 공급한다. 지금까지 유엔은 유엔군이 점령한 이후 수풍 전력의 배분에 관해 어떤 성명도 내지 않았으며, 한국군의 한 장성이 최근 만주 송전을 전면 차단하겠다고 발언한 것이 중공의 불안을 키웠을 수 있다.\n\nWalter B. Smith", "secondary": "secret\n\nWashington, 1 November 1950.\n\nSubject: Chinese Communist Intervention in Korea.\n\nFresh, newly-equipped North Korean troops have appeared in the Korean fighting, and it has been clearly established that Chinese Communist troops are also opposing UN forces. Present field estimates are that between 15,000 and 20,000 Chinese Communist troops organized in task force units are operating in North Korea while the parent units remain in Manchuria. Current reports of Soviet-type jet aircraft in the Antung-Sinuiju area indicate that the USSR may be providing at least logistic air defense for the Manchurian border. In addition, a radio broadcast of 31 October from the emergency North Korean capital of Sinuiju announced that a “Volunteer Corps for the Protection of the Suiho Hydroelectric Zone” has been formed to protect that area from the advancing UN forces. The broadcast emphasized the importance of the Suiho hydroelectric system to the industries of Manchuria and pointed out that Chinese People’s Liberation Forces are concentrated along the Manchurian side of the Suiho zone.\n\nThis pattern of events and reports indicates that Communist China has decided, regardless of the increased risk of general war, to provide increased support and assistance to North Korean forces. Although the possibility can not be excluded that the Chinese Communists, under Soviet direction, are committing themselves to full-scale intervention in Korea, their main motivation at present appears to be to establish a limited “cordon sanitaire” south of the Yalu River. Primary objectives of the Chinese Communists in attempting to establish such a no man’s land would probably be: (a) to guarantee security of the Manchurian border from UN forces which the Chinese have labelled [1026면] as invaders; and (b) to insure continued flow of electric power from the vital Suiho hydroelectric system to the industries of Manchuria. The preceding considerations, which are of direct concern to Communist China, would also be in line with the general desire to further international Communism by helping the North Koreans prolong their resistance.\n\nThe Chinese Communists probably genuinely fear an invasion of Manchuria despite the clear-cut definition of UN objectives. The reported evacuation of industrial machinery and civilian personnel from Mukden could be the consequence of such a fear although the possibility exists that this evacuation has been undertaken in an effort to anticipate possible retaliatory action by UN forces following Chinese Communist intervention in Korea. The Suiho hydroelectric system, with generator located on the Korean side of the Yalu River, provides a large part of South Manchuria’s electricity and most of the power for the Port Arthur naval base area. To date, the UN has made no statement regarding the distribution of Suiho power after UN forces take possession, and Chinese Communist apprehension may have been increased by the recent statement of a South Korean general that all power to Manchuria would be cut off.\n\nWalter B. Smith", "notes": [], "warn": false, "pages": ["50-1026"], "search": "Smith 스미스 Walter B. Smith 월터 B. 스미스"}, {"id": "50-d736", "order": 42, "date": "1950-11-03", "group": "D", "eyebrow": "50-d736 · Memorandum by the Assistant Secretary of State for Public Affairs (Barrett) to the Assistant Secretary of State for Far Eastern Affairs (Rusk)", "title": "공보담당 국무차관보(배럿)가 극동담당 국무차관보(러스크)에게 보낸 각서", "badge": "secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-11-03"}, {"k": "시각", "v": null}, {"k": "발신", "v": "Barrett, Edward W. (공보담당 국무차관보)", "txt": true}, {"k": "수신", "v": "Rusk, Dean (극동담당 국무차관보)", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "795.00/11–350", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d736"}], "summary": "배럿이 북한 내 중국군 문제에 관해, 최근 중공의 선전전 양상만으로도 이미 보도된 18,000명 규모가 아니라 십만 단위의 ‘의용군’ 투입을 준비 중이라고 판단한다.", "points": ["중공의 매우 이례적인 최근 선전전을 유일한 근거로 판단을 내렸다.", "최소한의 시나리오는 미군을 수개월간 한국에 묶어두기 위해 십만 명 규모의 ‘의용군’을 구축하는 것이다.", "최악의 시나리오는 수십만 병력의 공개적 투입을 구축하며 미국과의 전면전을 각오하는 것이다.", "중공이 자국민을 심리적으로 전면전에 대비시키고 있다고 본다.", "현재 보도된 18,000명의 ‘의용군’ 규모로 개입을 제한할 계획은 아닌 것으로 보인다."], "primary": "secret(2급비밀)\n\n[워싱턴,] 1950년 11월 3일\n\n제목: 북한 내 중국군\n\n수일간 북한 내 중국군 문제에 관해 지나치게 동요하는 듯 보였기에, 이제 정말로 경고론자로 비칠 위험을 무릅쓰려 한다. 오로지 최근 며칠간의 매우 이례적인 중국 공산당의 선전 활동만을 근거로 볼 때, 우리가 보기에:\n\n1. 적어도 중국은 매우 대규모(아마도 십만 명가량)의 “의용군”을 한국에 구축하고 있으며, 그 목적은 아마도 수개월 동안 우리를 한국에 발이 묶이게 하려는 것이다.\n\n2. 최대치는 중국이 수십만 병력의 공개적 투입을 구축하고 있으며, 이것이 중국과 우리 사이의 전면전을 의미할 것이라는 점을 충분히 예상하고 있다는 것이다(이를 위해 그들은 자국민을 심리적으로 준비시키고 있다).\n\n선전만을 근거로 보더라도, 그들은 자신들의 개입 규모를 현재 보도된 18,000명의 “의용군”과 같이 그 정도로 작은 병력으로 제한할 계획이 아닌 것으로 보인다.\n\n에드워드 W. 배럿", "secondary": "secret\n\n[Washington,] November 3, 1950.\n\nSubject: Chinese in North Korea\n\nHaving appeared unduly disturbed over the Chinese in North Korea subject for several days, I’ll now risk seeming really alarmist. Solely on the basis of the very unusual Chinese Communist propaganda campaign of recent days, it seems to us that:\n\n1. At the very least the Chinese are building up to very large numbers (perhaps a hundred thousand or so) “volunteers” in Korea, with the probable purpose of keeping us bogged down in Korea for many months.\n\n2. At the most they are building up to open employment of hundreds of thousands of Chinese troops in Korea with a full expectation that this will mean general war between the Chinese and ourselves (for which they are preparing their own people psychologically).\n\nOn the basis of propaganda alone, it would appear that they are not planning to limit their participation to anything like as small a force as the presently reported 18,000 “volunteers”.\n\nEdward W. Barrett", "notes": [], "warn": false, "pages": [], "search": "Barrett, Edward W. 배럿 Rusk, Dean 러스크"}, {"id": "50-d745", "order": 43, "date": "1950-11-04", "group": "C", "eyebrow": "50-d745 · Memorandum by the Director of the Policy Planning Staff (Nitze)", "title": "정책기획실장 니츠의 각서", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-11-04"}, {"k": "시각", "v": null}, {"k": "발신", "v": "Nitze (Paul H. Nitze, 정책기획실장)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "Policy Planning Staff Files", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d745"}], "summary": "니츠가 국방부 로퍼 장군과 한국에서의 원자폭탄 사용 가능성을 논의한 기록. 전술적 사용은 효과가 제한적이고 소련 개입을 촉발할 위험이 있으며, 전략적 사용은 대규모 민간인 희생과 소련의 참전을 거의 확실시한다. 유엔 동의 여부가 도덕적 명분을 좌우할 변수로 제기된다.", "points": ["한국에서 원자폭탄을 전술적으로 사용할 경우 병력 집결지나 포병 지원 진지가 표적이 되며, 이런 표적은 유엔군의 기동으로 인위적으로 조성해야 한다.", "만들 수 있는 표적이 적어 사용할 수 있는 폭탄 수도 극히 제한적이며, 민간인 대량 희생은 없을 것이다.", "전술적 사용이 추가적인 중국군 개입을 억제할 가능성은 있으나, 현 상황에서 군사적 결정타가 되기는 어렵다.", "소련이 전쟁에 개입할 심각한 가능성이 있으며, 아시아 민중을 결집시켜 미국에 등을 돌리게 할 것이다.", "묵덴·푸순·안산·하얼빈·다롄 등 만주 도시에 대한 전략적 사용은 대규모 민간인을 살상하고 소련의 참전을 거의 확실하게 만들 것이다.", "유엔의 동의를 사전에 얻으면 도덕적 명분을 유지할 수 있으나, 유엔에서의 공개 토론은 적에게 군사적으로 유리한 정보를 제공할 것이다."], "primary": "극비(TOP SECRET)\n\n[워싱턴,] 1950년 11월 4일\n\n국방부의 로퍼 장군[주1]이, 중국 공산군의 한국에서의 군사 행동에 대응하여 미국이 원자폭탄을 사용할 가능성에 관한 문제를 논의하기 위해, 본인의 요청으로 오늘 국무부에 왔다.\n\n만약 한국에서 폭탄이 사용된다면, 이는 병력 집결지와 포병 지원 진지에 대한 전술적 목적을 위한 것일 터이다. 그러한 표적에 대해서는 효과가 입증될 것이다. 그러나 그러한 표적은 정상적으로는 발생하지 않을 것이며, 유엔군의 전술 기동을 통해 조성되어야 할 것이다. 조성할 수 있는 표적이 적을 것이므로, 극소수의 원자폭탄만이 사용될 수 있을 것이다. 순수한 군사적 [1042면] 효과 외에도, 이러한 목적으로의 폭탄 사용은 중국의 추가적인 참전에 대한 억지력이 될 수도 있을 것이다. 만약 폭탄이 전술적 목적으로 사용된다면, 민간인 생명의 대규모 파괴는 없을 것 같다.\n\n현재의 상황에서 원자폭탄이 한국에서 군사적으로 결정적일 것으로 보이지 않으며, 그 사용이 소련을 전쟁으로 끌어들일 심각한 가능성이 존재한다. 더욱이, 그 사용은 아시아의 여러 민족을 우리에게 대항하여 결집시키는 데 도움이 될 것이다.\n\n만약 묵덴, 푸순, 안산, 하얼빈, 다롄과 같은 만주의 도시들에 대한 공격을 통해 폭탄이 전략적 목적으로 사용된다면, 이 조치는 많은 민간인의 파괴를 초래할 것이며 소련을 거의 확실하게 전쟁으로 끌어들일 것이다.\n\n만약 우리가 한국 지역에서 원자폭탄의 사용을 고려한다면, 그곳의 군사 행동이 유엔의 주관 하에 있다는 점과, 그 사용이 세계적인 파장을 불러일으킬 것이라는 점, 그리고 우리가 유엔의 동의를 얻어서만 사용해야 하는지에 대한 의문이 있다는 점을 명심해야 한다. 사전에 유엔의 동의를 얻는 것은 폭탄 사용에 있어 세계의 도덕적 세력을 우리 편으로 유지하게 할 수 있는 반면, 사용에 대한 일방적인 결정은 우리를 불리한 도덕적 위치에 남겨둘 수 있다. 다른 한편으로, 유엔에서 이 문제의 토론에 수반되는 공개성은 우리의 적대자에게 군사적 가치가 있을 것이다.\n\n폴 H. 니츠", "secondary": "top secret\n\n[Washington,] November 4, 1950.\n\nGeneral Loper of the Defense Department [주1] came to the State Department today at my request to discuss the question of possible U.S. use of atomic bombs to counter Chinese Communist military action in Korea.\n\nIf the bomb were used in Korea it would be for tactical purposes against troop concentrations and artillery support positions. Against such targets it should prove effective. However, such targets would probably not come about normally; they would have to be created by tactical maneuvers of U.N. forces. Very few atomic bombs could be used as few targets could be created. In addition to the purely military [1042면] effect, use of the bomb for these purposes might prove a deterrent against further Chinese participation. If the bomb were used for tactical purposes, it is unlikely that there would be large destruction of civilian life.\n\nIt does not appear that in present circumstances the atomic bomb would be militarily decisive in Korea, and there is a serious possibility that its use might bring the Soviet Union into the war. Furthermore, its use would help arouse the peoples of Asia against us.\n\nIf the bomb should be used for strategic purposes through attacks on such Manchurian cities as Mukden, Fushun, Anshan, Harbin and Dairen, this action would result in the destruction of many civilians and would almost certainly bring the Soviet Union into the war.\n\nIf we should consider the use of the atomic bomb in the Korean area, we should keep in mind that the military actions there are under U.N. auspices, that its use would have world-wide repercussions, and that there is a question whether we should use it only with U.N. concurrence. Obtaining U.N. concurrence beforehand might keep the moral forces of the world with us in the use of the bomb, whereas a unilateral decision to use it might leave us in a disadvantageous moral position. On the other hand, the publicity attending debate of this question in the United Nations would be of military value to our adversary.\n\nPaul H. Nitze", "notes": ["[주1] 허버트 B. 로퍼 준장(Herbert B. Loper)은 미 육군 참모총장 병참실 원자력 담당 보좌관이었다."], "warn": false, "pages": ["50-1042"], "search": "Nitze, Paul H. (Paul H. Nitze, 정책기획실장) Loper, Herbert B. (Herbert B. Loper, 육군 준장, 원자력 담당 보좌관)"}, {"id": "50-d757", "order": 44, "date": "1950-11-06", "group": "B", "eyebrow": "50-d757 · Memorandum of Conversations, by the Secretary of State", "title": "국무장관의 대화 비망록", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-11-06"}, {"k": "시각", "v": "오전 10시경 시작, 오전 11시 15분 종료"}, {"k": "발신", "v": "애치슨 국무장관", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "비망록"}, {"k": "원문출처", "v": "795.00/11–650", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d757"}], "summary": "신의주 압록강 다리 폭격 명령을 재가 직전에 보류한 과정을 애치슨이 기록한다. 영국과의 사전 협의 약속, 유엔 제소, 중대한 군사적 필요성의 부재가 근거였다.", "points": ["공군은 동부 표준시 오후 1시 신의주–안둥 압록강 다리 폭격을 위해 이륙할 예정이었다. 한국 쪽을 노리되 만주 쪽 오폭 위험이 크다는 점이 러벳에게서 제기되었다.", "러스크는 만주 쪽 영향이 미칠 작전은 영국과 협의하겠다는 약속을 들었다. 영국 내각은 그날 아침 중공 정권에 대한 태도를 전면 재검토 중이었다.", "미국은 이미 중공군 개입에 관한 맥아더 보고를 유엔 안보리에 제출했고 긴급 회의를 요청한 상태였다. 중공군에 철수를 촉구하는 결의안을 내어 유엔 지지를 얻은 뒤 행동하려는 구상이었다.", "러스크·러벳·애치슨은 작전 보류에 전적으로 합의했다. 마셜 국방장관도 아군을 위협하는 대규모 도하가 없는 한 이 작전은 현명하지 않다고 보았다.", "애치슨이 캔자스시티의 트루먼에게 전화했다. 대통령은 아군 안전이 즉각 위협받지 않는다면 작전을 보류하는 것이 타당하며, 합참이 맥아더에게서 절박한 사유를 먼저 확인해야 한다고 했다.", "러벳은 합참에 이 입장을 전달했고, 작전 전체가 보류되어 11시 40분 도쿄로 전문이 발송되었다. 만주 국경 5마일 이내 표적 공격 금지, 상황 평가 및 작전 사유 요청, 영국과의 협의 약속 환기가 담겼다."], "primary": "top secret\n\n[워싱턴,] 1950년 11월 6일\n\n국무장관 애치슨, 국방차관 러벳, 딘 러스크 씨 간 회의 비망록\n\n오늘 오전 10시 직후 로버트 러벳 씨가 스트레이트마이어 장군으로부터의 긴급 전문을 가지고 펜타곤에서 건너왔다. 이 전문은 공군이 동부 표준시 오늘 오후 1시에 신의주(한국)에서 안둥(만주)으로 건너는 압록강 다리를 파괴하기 위한 폭격 임무로 이륙하라는 명령을 받았다고 보고했다. 무선 유도 폭탄을 사용할 예정이며 다리의 한국 쪽을 폭격하려 할 것이라고 했다.\n\n러벳 씨는 작전적 관점에서 이 작전이 달성할 결과가 교통을 중대하게 차단할지 의심스럽고, 만주 쪽의 안둥시와 다른 지점들을 폭격할 위험성이 매우 크다는 견해를 표명했다.\n\n러스크 씨는 우리가 만주 쪽에 대한 공격을 수반할 수 있는 조치를 취하기 전에 영국과 협의하겠다는 약속을 영국에 대해 지고 있다고 설명했다. 또한 영국 내각이 중공 정권에 대한 전체 태도를 재검토하기 위해 오늘 아침 회의를 열고 있으며 우리 측의 신중하지 못한 조치가 중대한 결과를 초래할 수 있다고 말했다. 그는 또 우리가 중공군 개입에 관한 맥아더 장군의 보고를 유엔 안전보장이사회에 제출했으며, [1056면] 내일이나 수요일에 긴급 회의를 요청하여 중국 측에 한국에서의 활동을 중단하라고 요구하는 결의안을 제출할 예정이어서, 이로써 중국 측이 유엔 조치를 거부할 경우 필요할 수 있는 어떤 조치에 대해서도 유엔의 지지를 얻으려 시도하고 있다고 러벳 씨에게 알렸다. 또한 중소 조약에 따른 소련의 개입 가능성도 언급했다.\n\n약간의 논의 끝에 우리 모두는 이 조치의 사유가 더 명확히 알려질 때까지 연기되어야 한다는 데 전적으로 합의했다.\n\n러벳 씨가 마셜 장군에게 전화했고, 마셜 장군은 우리 부대의 안전을 위협하는 강을 건너는 대규모 이동이 없는 한 이 조치는 현명하지 않다는 데 동의했다. 러벳 씨는 핀레터 씨에게 전화하여 위에 적시한 대로 러스크 씨가 진술한 사실들을 합참에 전달하라고 지시하고, 자신이 국무장관과 이야기했으며 국무장관은 상황이 매우 중대하여 이 문제를 대통령 앞에 제출하고 대통령의 지시를 받을 때까지 조치를 연기해야 한다고 믿고 있음을 덧붙이라고 했다. 그는 이것이 가능한 한 빨리 이루어져야 하며 추가 전문이 발송될 것이라고 덧붙이라고 했다.\n\n나는 이어서 캔자스시티의 대통령에게 전화하여 위에 개괄한 대로 이 문제를 제출했다. 대통령은 우리 부대의 안전에 대한 즉각적이고 중대한 위협 때문에 필요하다면 그 조치를 재가할 것이라고 말했다. 나는 이 문제에 관해 우리가 가진 정보는 어제의 맥아더 장군 보고 외에는 없으며 그 보고에는 강을 건너는 추가 이동에 대한 어떤 진술도 없고 중국 쪽의 예비대에 관한 내용만 있다고 지적했다. 대통령은 내가 맥아더 장군에게 전화하여 사실이 무엇인지 확인해 보라고 제안했다. 나는, 그리고 대통령도 동의하기로, 군사 주제에 관한 통신은 군 조직을 통해야 한다고 생각했다. 대통령은 내게 그가 돌아올 때까지 이 문제를 러벳 씨와 내가 최선이라고 생각하는 방식으로 처리하라고 말하고, 필요하면 전화로 연락할 수 있으며 우리 부대의 안전이 위태롭게 되어서는 안 된다고 덧붙였다. 그는 위의 요건과 합치되게 연기할 수 있다면 그렇게 하는 것이 중요하다는 데 동의했다. 나는 대통령의 입장을 요약한 별첨 문서를 러벳 씨에게 건넸고, 그는 그것을 합참에 읽어 주기 위해 즉시 떠났다.\n\n우리의 회의는 오전 11시 15분, 비행기들이 한국으로 이륙하기 한 시간 사십오 분 전에 종료되었다. 러벳 씨가 합참이 취한 조치를 내게 알려 줄 것이다.\n\n러스크 씨가 나중에 러벳 씨에게 전화하여 우리가 다리만 논의하고 있었는지 아니면 신의주 지역의 나머지 임무도 비행할 것인지 물었다. 러벳 씨는 전체 임무가 [1057면] 연기되고 있으며 11시 40분에 도쿄로 전문이 발송되어 맥아더 장군에게 만주 국경 5마일 이내의 표적을 공격하지 말라고 명령하고 그 지역의 신의주 및 압록강 다리에 대한 임무의 상황 평가와 사유를 질의했다고 말했다. 이 전문은 또한 만주에 영향을 미치는 작전에 관해 영국과 협의하겠다는 우리의 약속도 언급했다. [주1]\n\n[부속서]\n\n국무장관의 비망록\n\ntop secret\n\n[워싱턴,] 1950년 11월 6일\n\n캔자스시티의 대통령과의 전화 통화 요약\n\n대통령은 제안된 압록강 다리 폭격에 뒤따를 수 있는 중대한 국제적 복잡성을 인지한다. 대통령은 이 조치가 우리 부대를 보호하기 위해 즉각적으로 필요하다면 기꺼이 이 복잡성을 감수할 것이다.\n\n대통령은 이러한 상황에서 합참이 맥아더 장군으로부터 작전의 긴박한 사유가 무엇인지 알아야 한다고 믿는다. 작전을 우리의 국제적 약속이 이행될 때까지 기다릴 수 있다면 그것이 우리를 가장 유리한 입장에 놓을 것이다.\n\n딘 애치슨\n\n----- 각주 -----\n[주1] 11월 6일 오전 11시 47분에 발송된 합참 전문 95878을 보라, 이하.", "secondary": "top secret\n\n[Washington,] November 6, 1950.\n\nMemorandum of Conference Between Secretary Acheson, [Deputy] Under Secretary of Defense Lovett, and Mr. Dean Rusk\n\nShortly after ten o’clock this morning Mr. Robert Lovett came over from the Pentagon with an urgent message from General Stratemeyer. This message reported that the Air Forces had been ordered to take off at one o’clock p. m. EST today on a bombing mission to take out the bridge across the Yalu River from Sinuiju (Korea) to Antung (Manchuria). They were to use radio controlled bombs and would attempt to bomb on the Korean side of the bridge.\n\nMr. Lovett expressed his view that from an operational standpoint he doubted whether the results to be achieved would importantly interrupt traffic and that the danger of bombing the city of Antung and other points on the Manchurian side of the River were very great.\n\nMr. Rusk explained that we had a commitment with the British not to take action which might involve attacks on the Manchurian side of the River without consultation with them. He also said that the British Cabinet was meeting this morning to reconsider their whole attitude toward the Chinese Communist Government and that ill-considered action on our part might have grave consequences. He also told Mr. Lovett that we had filed General MacArthur’s report concerning Chinese intervention with the United Nations Security Council and had asked for an urgent meeting tomorrow or Wednesday at which we were going to present a resolution calling on the Chinese to cease activities in Korea, thus attempting to get UN support for [1056면] any action which might be necessary in the event of their refusal to accept the UN action. He also mentioned the possibility of Russian involvement under the Sino-Russian Treaty.\n\nAfter some discussion we all thoroughly agreed that this action should be postponed until the reasons for it were more clearly known.\n\nMr. Lovett telephoned General Marshall, who agreed that the action was unwise unless there was some mass movement across the River, which threatened the security of our troops. Mr. Lovett called Mr. Finletter and instructed him to tell the Joint Chiefs the facts which Mr. Rusk had stated, as set forth above, and to add that he had talked with the Secretary of State, who believed that the situation was so grave that the action should be postponed until the matter had been laid before the President and his instructions had been received. He was to add that this was to be done as soon as possible and that another message would be sent.\n\nI then telephoned the President in Kansas City and laid the matter before him, as outlined above. The President said that he would approve the action if it was necessary because of an immediate and serious threat to the security of our own troops. I pointed out that we had no information on this matter beyond General MacArthur’s report of yesterday, which contained no statement of any further movements across the river, but only of reserves on the Chinese side. The President suggested that I call General MacArthur and ascertain what the facts were. I thought, and he agreed, that communications on military subjects should be through the Military Establishment. The President told me to handle the matter until his return in the way Mr. Lovett and I thought best, adding that he would be available on the telephone if necessary and that the security of our troops should not be jeopardized. He agreed on the importance of postponing the action if that could be done consistently with the requirement above. I gave Mr. Lovett the attached summary of the President’s position, and he left immediately to read it to the JCS.\n\nOur conference terminated at 11:15 a. m., one and three-quarters hours before the planes were to take off for Korea. Mr. Lovett will inform me of the action taken by the JCS.\n\nMr. Rusk later called Mr. Lovett to inquire whether we had been discussing the bridge only or whether the rest of the mission in the Sinuiju area would be flown. Mr. Lovett said that the entire mission [1057면] was being postponed and that a message went to Tokyo at 11:40 ordering General MacArthur not to attack targets within five miles of the Manchurian border and asking his estimate of the situation and reasons for the mission against Sinuiju and the Yalu Bridge in that area. The message also referred to our commitment to consult with the British in regard to operations affecting Manchuria. [주1]\n\n[Annex]\n\nMemorandum by the Secretary of State\n\ntop secret\n\n[Washington,] November 6, 1950.\n\nSummary of Telephone Conversation With the President at Kansas City\n\nThe President recognizes the great international complications which may follow the proposed bombing of the Yalu River bridge. He is willing to face these complications if the step is immediately necessary to protect our forces.\n\nHe believes under the circumstances that the Joint Chiefs should know from General MacArthur what the pressing reasons are for the operation. If the operation can wait until our international commitments are fulfilled, that would put us in the best position.\n\nDean Acheson", "notes": ["[주1] 원문 'infra'는 이 책(FRUS 1950 제7권)의 뒷부분에 실린 문서를 가리킨다."], "warn": false, "pages": ["50-1056", "50-1057"], "search": "Acheson 애치슨 Lovett 러벳 Dean Rusk 딘 러스크 Stratemeyer 스트레이트마이어 Marshall 마셜 Finletter 핀레터 Truman 트루먼 MacArthur 맥아더"}, {"id": "50-d798", "order": 45, "date": "1950-11-09", "group": "D", "eyebrow": "50-d798 · Memorandum by the Director of the Central Intelligence Agency (Smith) to the National Security Council  This memorandum was read at the 71st meeting of the National Security Council on November 9; for an account of that meeting, see Truman, Years of Trial and Hope, pp. 378–380.", "title": "스미스 중앙정보국장이 국가안전보장회의에 보낸 각서", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-11-09"}, {"k": "시각", "v": null}, {"k": "발신", "v": "스미스 중앙정보국장(Walter B. Smith)", "txt": true}, {"k": "수신", "v": "국가안전보장회의(National Security Council)", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "795.00/11–950", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d798"}], "summary": "중앙정보국이 소련이 직접 군사 개입할 증거는 없지만 한반도 상황에 전면전 위험을 감수할 만한 중요성을 부여하고 있다고 추정했다", "points": ["소련이 조선에 자국 군대를 공개적으로 투입할 뜻이 있다는 증거는 현재로선 불충분하다.", "그러나 중공군에 물자를 지원하며 투입한 것은 소련이 한반도 상황을 전면전 위험을 감수할 정도로 중요하게 본다는 뜻이다.", "미국이 중공군의 북조선 개입을 이유로 전면전을 일으키지는 않으리라고 소련은 판단하는 듯하다.", "전면전의 주요 위험은 소련이 주도권을 쥐고 있다는 점이며, 소련 정부가 한반도-중국 상황을 이유로 전면전을 일으키기로 결정하지는 않았을 가능성이 크다.", "압록강 이북의 부대 집결지나 비행장을 공격하거나 적기를 중국 영토까지 추격하는 행동이, 이 상황이 러시아를 끌어들인 전면전으로 번질 이미 상당한 위험을 더 키우지는 않을 것이다.", "크렘린의 전쟁 여부에 관한 근본 결정이 이런 국지적 도발에 좌우될 가능성은 거의 없지만, 그러한 도발은 한반도 내 중공군의 반응 규모를 크게 키울 공산이 있다."], "primary": "top secret\n\n워싱턴, 1950년 11월 9일.\n\n현 상황에서 중앙정보국은 정보자문위원회의 동의를 얻어 이전에 합의된 추정들(J.I.C. 531/10 [주2] 및 N.I.E. 2 [주3])을 아래와 같이 재천명하는 바이다.\n\n1.\n\n현재까지 소련이 조선에 소련군을 공개적으로 투입할 의사가 있음을 시사하는 증거는 불충분하다. 그러나 소련의 물자 지원을 받는 중국 공산군의 투입은 소련이 조선의 상황을 전면전의 위험을 감수할 만큼 충분히 중요하게 간주하고 있음을 시사한다.\n\n2.\n\n소련은 북조선에서의 중국 공산군 개입 및 그에 대한 대응과 관련하여 미국이 전면전을 일으키지는 않을 것이라고 간주할 가능성이 높다. 전면전의 주된 위험은 크렘린이 계속해서 쥐고 있는 소련의 주도권 행사에 있다. 소련 정부가 조선-중국 상황을 놓고 직접 전면전을 일으키기로 아직 결정하지 않았을 가능성이 높다. 가까운 장래에 그들이 그러한 결정을 내리지 않을 공산이 크다. 그들이 어느 시점에 전면전을 일으키기로 결정할 것인지는 정보로는 현재 가늠할 수 없다.\n\n압록강 이북의 부대 집결지나 비행장을 공격하거나 적 항공기를 중국 영토 내로 추격하는 유엔군의 행동은, 상황이 러시아를 수반하는 전면전으로 악화될 수도 있는 이미 상당한 위험을 증가시키지는 않을 것이라는 것이 우리의 견해이다. 달리 말하면, 전쟁을 하느냐 마느냐 하는 크렘린의 근본 결정은 이 지역에서의 이러한 국지적 도발에 거의 좌우되지 않을 것이라는 말이다. 그러나 그러한 도발은 아마도 한반도 내에서의 중국 공산군의 반응 규모를 실질적으로 증가시킬 것이다. (국가정보평가 2호 7항 참조.)\n\n월터 B. 스미스\n\n[1123면]\n\n----- 각주 -----\n[주1] 이 각서는 11월 9일 제71차 국가안전보장회의에서 낭독되었다. 회의 내용에 대해서는 트루먼, 『Years of Trial and Hope』 378~380쪽 참조.\n[주2] 미인쇄. 미-영 합동정보위원회 작업 관련 문서는 제3권에 수록될 예정.\n[주3] 1950년 11월 8일자, 1101면.", "secondary": "top secret\n\nWashington, 9 November 1950.\n\nIn the present situation, the Central Intelligence Agency, with the concurrence of the Intelligence Advisory Committee, would restate previously agreed estimates (J.I.C. 531/10 [주2] and N.I.E. 2 [주3] ) in the following terms:\n\n1.\n\nTo date there is insufficient evidence to indicate that the USSR intends to commit Soviet forces overtly in Korea. However, the commitment of Chinese Communist forces, with Soviet material aid, indicates that the USSR considers the Korean situation of sufficient importance to warrant the risk of general war.\n\n2.\n\nThe probability is that the Soviet Union considers that the U.S. will not launch a general war over Chinese Communist intervention in North Korea and the reaction thereto. The principal risk of general war is through the exercise of Soviet initiative which the Kremlin continues to hold. The probability is that the Soviet Government has not yet made a decision directly to launch a general war over the Korean-Chinese situation. There is a good chance that they will not in the immediate future take such a decision. At what point they will take a decision to launch a general war is not now determinable by Intelligence.\n\nIt is our opinion that action by U.N. forces to attack troop concentrations or air fields north of the Yalu River, or to pursue enemy aircraft into Chinese territory would not increase the already substantial risk that the situation may degenerate into a general war involving Russia. In other words, the Kremlin’s basic decision for or against war would hardly be influenced by this local provocation in this area. However, such provocation would probably materially increase the extent of Chinese Communist reaction in Korea proper. (See par. 7, National Intelligence Estimate No. 2.)\n\nWalter B. Smith\n\n[1123면]", "notes": ["[주1] 이 각서는 11월 9일 제71차 국가안전보장회의에서 낭독되었다. 회의 내용에 대해서는 트루먼, 『Years of Trial and Hope』 378~380쪽 참조.", "[주2] 미인쇄. 미-영 합동정보위원회 작업 관련 문서는 제3권에 수록될 예정.", "[주3] 1950년 11월 8일자, 1101면."], "warn": false, "pages": ["50-1123"], "search": "스미스(Walter B. Smith) 트루먼(Harry S. Truman)"}, {"id": "50-d844", "order": 46, "date": "1950-11-16", "group": "E", "eyebrow": "50-d844 · The British Embassy to the Department of State  A note on the source text indicated that this document was delivered to Mr. Merchant’s office by Mr. Graves of the British Embassy on November 17.", "title": "베빈 외상이 11월 16일자로 프랭크스 경에게 보낸 전문", "badge": "secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-11-16"}, {"k": "시각", "v": null}, {"k": "발신", "v": "베빈(Mr. Bevin, 영국 외상)", "txt": true}, {"k": "수신", "v": "프랭크스 경(Sir Oliver Franks, 주미 영국 대사)", "txt": true}, {"k": "장소", "v": "London"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "전보"}, {"k": "원문출처", "v": "795.00/11–1750", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d844"}], "summary": "베빈이 만주 국경 침범이 필요할 수 있다는 미국의 제안을 지지할 수 없다고 밝혔다. 분쟁 확대로 이어질 위험이 크다고 보았다.", "points": ["베빈은 만주 국경 침범 가능성을 시사한 미국의 제안을 검토한 끝에 지지할 수 없다고 결론 내렸다.", "그 제안은 분쟁의 확산이라는 바로 그 피하고자 하는 결과를 초래할 개연성이 크므로 대단히 위험한 가능성을 품고 있다고 평가했다.", "프랭크스에게 가능한 한 빨리 애치슨 국무장관에게 이 견해를 전달하라고 지시했다.", "영국 참모본부도 테더 경에게 별도로 전문을 보내고 있음을 이해하고 있다고 덧붙였다."], "primary": "[주1]\n\n**비밀**\n\n**베빈 외상이 11월 16일자로 프랭크스 경에게 보낸 전문**\n\n나는 주런던 미국 대사가 내게 준 비망록[주2]을 검토했으며, 만주 국경 침범이 필요할 수 있다는 미국 측 제안을 지지할 수 없음을 유감스럽게 생각한다. 내 생각에 그 제안은 대단히 위험한 가능성을 품고 있다. 우리가 피하고자 하는 바로 그것, 즉 분쟁의 확산이라는 결과를 초래할 개연성이 크기 때문이다.\n\n그대는 가능한 한 빨리 나의 견해를 애치슨 씨에게 전달해야 한다. 나는 참모본부가 테더 경에게 전문을 보내고 있는 것으로 안다.\n\n워싱턴, [1950년 11월 17일.]", "secondary": "November 16, 1950\n\nsecret\n\nMessage From Mr. Bevin to Sir Oliver Franks Dated 16th November\n\nI have now considered the memorandum given to me by American Ambassador in London [주2] and regret that I cannot endorse the United States suggestion that violation of the Manchurian border may be necessary. To my thinking, the suggestion has potentialities of great danger, for it is likely to result in the very thing which we want to avoid, namely the spreading of the conflict.\n\nYou should convey my views to Mr. Acheson as soon as possible. I understand that the C
