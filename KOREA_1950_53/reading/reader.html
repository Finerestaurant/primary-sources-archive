, "docs": [["cairo-1943", "d307"]]}, {"id": "1943-11-1", "date": "1943-11", "arc": "korea-div", "docs": [["cairo-1943", "d308"]]}, {"id": "1943-11-25", "date": "1943-11-25", "arc": "korea-div", "docs": [["cairo-1943", "d309"]]}, {"id": "1943-11-27", "date": "1943-11-27", "label": "카이로 선언", "arc": "korea-div", "bar": true, "key": true, "where": "카이로", "note": "미·영·중 3국 수뇌가 대일 전후 처리를 합의해 발표했다. 조선에 관한 대목은 「적당한 시기에(in due course) 자유롭고 독립된 나라가 되게 한다」였다. 이 묶음이 좇는 문구가 여기서 태어난다."}, {"id": "1943-11-28", "date": "1943-11-28", "label": "테헤란 회담", "arc": "wwii", "bar": true, "where": "테헤란", "note": "루스벨트·처칠·스탈린의 첫 3자 회담. 유럽 제2전선(노르망디)의 시기가 정해졌고, 스탈린은 독일 항복 뒤 대일전 참전을 처음으로 시사했다."}, {"id": "1944-06-06", "date": "1944-06-06", "label": "노르망디 상륙", "arc": "wwii", "bar": true, "note": "연합군이 프랑스 북부에 상륙해 서부 제2전선이 열렸다. 유럽 전쟁의 승패가 사실상 이때 갈렸고, 미국 안에서 「그다음은 일본」이라는 계산이 본격화된다."}, {"id": "1944-07-25", "date": "1944-07-25", "label": "항복문서 완성", "arc": "wwii", "bar": true, "key": true, "where": "런던 유럽자문위원회", "note": "유럽자문위원회가 「독일의 무조건 항복」 본문을 확정했다. 독일이 항복하기 아홉 달 전이고, 파리가 해방되기 한 달 전이다. 이 뒤의 넉 달은 새로 쓰는 것이 아니라 손질하는 기간이며, 정작 1945년 5월 7일 랭스에서는 지연을 우려해 이 문서 대신 간이 「항복문서」를 쓴다."}, {"id": "1944-10-20", "date": "1944-10-20", "label": "레이테 상륙", "arc": "wwii", "bar": true, "where": "필리핀", "note": "맥아더가 필리핀 탈환에 착수했다. 뒤이은 레이테만 해전에서 일본 연합함대가 무너져, 일본 본토와 남방 자원지대를 잇는 해상 수송로가 끊긴다."}, {"id": "1944-12-22", "date": "1944-12-22", "arc": "wwii", "docs": [["machinery-1945", "d486"]]}, {"id": "1944-12-28", "date": "1944-12-28", "arc": "wwii", "docs": [["surrender-1945", "d368"]]}, {"id": "1945-01", "date": "1945-01", "arc": "wwii", "docs": [["surrender-1945", "d340"]]}, {"id": "1945-01-03", "date": "1945-01-03", "arc": "wwii", "docs": [["surrender-1945", "d370"]]}, {"id": "1945-01-04", "date": "1945-01-04", "arc": "wwii", "docs": [["machinery-1945", "d130"]]}, {"id": "1945-01-25", "date": "1945-01-25", "arc": "wwii", "docs": [["machinery-1945", "d139"]]}, {"id": "1945-02-04", "date": "1945-02-04", "label": "얄타 회담", "arc": "korea-div", "bar": true, "key": true, "where": "크림반도 얄타", "note": "루스벨트·처칠·스탈린의 두 번째 3자 회담. 소련의 대일 참전 조건이 비밀협정으로 정해졌고, 루스벨트가 스탈린에게 조선의 신탁통치를 꺼내며 「20년에서 30년」이라 말했다. 카이로의 「적당한 시기」에 처음으로 숫자가 붙은 자리다."}, {"id": "1945-02-08", "date": "1945-02-08", "arc": "korea-div", "docs": [["yalta-1945", "d393"]]}, {"id": "1945-02-08-1", "date": "1945-02-08", "arc": "wwii", "docs": [["machinery-1945", "d149"]]}, {"id": "1945-03-09", "date": "1945-03-09", "arc": "wwii", "docs": [["mofa-1945", "d949"]]}, {"id": "1945-03-10", "date": "1945-03-10", "label": "도쿄 대공습", "arc": "wwii", "bar": true, "note": "B-29 편대의 야간 소이탄 공습으로 도쿄 시가지가 불탔다. 하룻밤 사망자가 10만 명 안팎으로 추정된다. 일본 안에서 본토 방위가 불가능하다는 인식이 퍼지기 시작한다."}, {"id": "1945-03-14", "date": "1945-03-14", "arc": "wwii", "docs": [["machinery-1945", "d488"]]}, {"id": "1945-03-18", "date": "1945-03-18", "arc": "wwii", "docs": [["field-1945", "tf58-2"]]}, {"id": "1945-03-23", "date": "1945-03-23", "arc": "wwii", "docs": [["machinery-1945", "d161"]]}, {"id": "1945-03-30", "date": "1945-03-30", "arc": "wwii", "docs": [["machinery-1945", "d165"]]}, {"id": "1945-04", "date": "1945-04", "arc": "wwii", "docs": [["surrender-1945", "d343"]]}, {"id": "1945-04-01", "date": "1945-04-01", "label": "오키나와 전투", "arc": "wwii", "bar": true, "note": "미군이 오키나와에 상륙해 6월까지 싸웠다. 사상자 규모가 본토 상륙전의 비용을 가늠하는 근거가 되어, 원폭 사용과 소련 참전 요청 양쪽의 논거로 쓰인다."}, {"id": "1945-04-05", "date": "1945-04-05", "arc": "wwii", "docs": [["machinery-1945", "d172"]]}, {"id": "1945-04-06", "date": "1945-04-06", "arc": "wwii", "docs": [["field-1945", "tf58-3"]]}, {"id": "1945-04-11", "date": "1945-04-11", "arc": "wwii", "docs": [["field-1945", "tf58-4"]]}, {"id": "1945-04-12", "date": "1945-04-12", "label": "루스벨트 사망", "arc": "wwii", "bar": true, "note": "루스벨트가 급서하고 트루먼이 승계했다. 트루먼은 얄타의 비밀협정도 원폭 개발도 취임 뒤에야 통보받았다. 조선 신탁통치 구상을 밀던 사람이 사라진 자리다."}, {"id": "1945-04-14", "date": "1945-04-14", "arc": "wwii", "docs": [["machinery-1945", "d178"]]}, {"id": "1945-04-15", "date": "1945-04-15", "arc": "wwii", "docs": [["machine -04-1", "date": "1945-05-04", "arc": "wwii", "docs": [["veday-1945", "d562"]]}, {"id": "1945-05-04-2", "date": "1945-05-04", "arc": "wwii", "docs": [["veday-1945", "d212"]]}, {"id": "1945-05-07", "date": "1945-05-07", "arc": "wwii", "docs": [["veday-1945", "d566"]]}, {"id": "1945-05-07-1", "date": "1945-05-07", "arc": "wwii", "docs": [["veday-1945", "d567"]]}, {"id": "1945-05-08", "date": "1945-05-08", "label": "독일 항복", "arc": "wwii", "bar": true, "key": true, "where": "랭스 · 베를린", "note": "5월 7일 새벽 2시 41분 랭스에서 서명이 끝났으나, 발표는 8일까지 묶여 있었다. 스탈린은 동부전선에서 항복 명령이 이행될지 확실치 않다며 소련의 발표를 9일로 미뤘고, 8일 밤 베를린에서 다시 서명한다. 그날 서명한 것은 유럽자문위원회가 여덟 달 다듬어 온 항복문서가 아니라 초기 군사 조항만 담은 간이 문서였다.", "docs": [["veday-1945", "d224"]]}, {"id": "1945-05-10", "date": "1945-05-10", "arc": "wwii", "docs": [["mofa-1945", "d951"]]}, {"id": "1945-05-10-1", "date": "1945-05-10", "arc": "wwii", "docs": [["veday-1945", "d357"]]}, {"id": "1945-05-11", "date": "1945-05-11", "arc": "wwii", "docs": [["surrender-1945", "d349"]]}, {"id": "1945-05-11-1", "date": "1945-05-11", "arc": "wwii", "docs": [["field-1945", "tf58-5"]]}, {"id": "1945-05-12", "date": "1945-05-12", "arc": "wwii", "docs": [["veday-1945", "d235"]]}, {"id": "1945-05-18", "date": "1945-05-18", "arc": "wwii", "docs": [["mofa-1945", "d953"]]}, {"id": "1945-05-21", "date": "1945-05-21", "arc": "wwii", "docs": [["surrender-1945", "d355"]]}, {"id": "1945-05-28", "date": "1945-05-28", "arc": "wwii", "docs": [["surrender-1945", "d379"]]}, {"id": "1945-06-22", "date": "1945-06-22", "arc": "wwii", "docs": [["surrender-1945", "d358"]]}, {"id": "1945-06-27", "date": "1945-06-27", "arc": "wwii", "docs": [["surrender-1945", "d385"]]}, {"id": "1945-06-30", "date": "1945-06-30", "arc": "wwii", "docs": [["mofa-1945", "d960"]]}, {"id": "1945-07-16", "date": "1945-07-16", "arc": "wwii", "docs": [["surrender-1945", "d361"]]}, {"id": "1945-07-17", "date": "1945-07-17", "label": "포츠담 회담", "arc": "wwii", "bar": true, "where": "베를린 근교 포츠담", "note": "트루먼·처칠(뒤에 애틀리)·스탈린의 회담. 회담 중 원폭 실험 성공이 보고되고, 대일 최후통첩의 문안이 다듬어진다."}, {"id": "1945-07-21", "date": "1945-07-21", "arc": "wwii", "docs": [["mofa-1945", "d964"]]}, {"id": "1945-07-26", "date": "1945-07-26", "label": "포츠담 선언", "arc": "wwii", "bar": true, "note": "미·영·중 명의로 일본에 무조건 항복을 요구했다. 제8항에 「카이로 선언의 조항은 이행되어야 한다」고 못박아, 조선 독립 약속이 항복 조건 안으로 들어온다. 일본은 이를 묵살(黙殺)한다고 발표했다."}, {"id": "1945-07-27", "date": "1945-07-27", "arc": "wwii", "docs": [["mofa-1945", "d1079"]]}, {"id": "1945-08", "date": "1945-08", "arc": "korea-div", "docs": [["frus-1945", "d771"]]}, {"id": "1945-08-02", "date": "1945-08-02", "arc": "wwii", "docs": [["surrender-1945", "d364"]]}, {"id": "1945-08-04", "date": "1945-08-04", "arc": "wwii", "docs": [["surrender-1945", "d390"]]}, {"id": "1945-08-06", "date": "1945-08-06", "label": "히로시마", "arc": "wwii", "bar": true, "key": true, "note": "히로시마에 원자폭탄이 투하됐다. 트루먼은 같은 날 성명을 내 「이제껏 없던 폭탄」임을 알리고 항복하지 않으면 파멸이 이어질 것이라 경고했다.", "disp": "08.06", "docs": [["surrender-1945", "d401"]]}, {"id": "1945-08-08", "date": "1945-08-08", "label": "소련 참전", "arc": "wwii", "bar": true, "note": "소련이 일본에 선전포고하고 이튿날 만주로 진공했다. 얄타에서 약속한 「독일 항복 뒤 3개월」을 지킨 날짜다. 미국이 조선에 지상군을 두려면 시간이 없다는 것이 이날 분명해진다.", "disp": "08.08", "docs": [["surrender-1945", "d402"]]}, {"id": "1945-08-09", "date": "1945-08-09", "label": "나가사키", "arc": "wwii", "bar": true, "note": "나가사키에 두 번째 원자폭탄이 투하됐다. 같은 날 밤 어전회의가 열려 국체 유지를 조건으로 한 항복 제의가 정해진다.", "docs": [["mofa-1945", "d1085"]]}, {"id": "1945-08-10", "date": "1945-08-10", "disp": "08.10", "arc": "wwii", "docs": [["surrender-1945", "d406"]]}, {"id": "1945-08-10-1", "date": "1945-08-10", "disp": "08.10 06:45", "arc": "wwii", "docs": [["mofa-1945", "d1086"]]}, {"id": "1945-08-10-2", "date": "1945-08-10", "disp": "08.10 18:00", "arc": "wwii", "docs": [["mofa-1945", "d1091"]]}, {"id": "1945-08-11", "date": "1945-08-11", "label": "38선 획정", "arc": "korea-div", "bar": true, "key": true, "note": "일반명령 제1호(SWNCC 21/5)가 고쳐지면서 조선이 북위 38도로 갈렸다. 한 문서의 b항과 f항, 다섯 조항 사이에 조선이 둘로 나뉘어 적혔다. 합참이 든 이유는 미군에게 경성의 의 권한이 발효되고, 일반명령 제1호가 법적 효력을 갖는다."}, {"id": "1945-09-08", "date": "1945-09-08", "label": "미군 인천 상륙", "arc": "wwii", "bar": true, "key": true, "note": "하지 중장의 제24군단이 인천에 상륙해 이튿날 조선총독부의 항복을 받았다. 미군정이 시작된다. 닷새 뒤 하지는 카이로의 「in due course」가 조선어로 「수일 내」로 옮겨져 퍼져 있었다는 것을 알게 된다."}, {"id": "1945-09-09", "date": "1945-09-09", "arc": "korea-div", "docs": [["scap-0141", "1"]]}, {"id": "1945-09-13", "date": "1945-09-13", "arc": "korea-div", "docs": [["scap-0141", "2"]]}, {"id": "1945-09-24", "date": "1945-09-24", "arc": "korea-div", "docs": [["scap-0141", "2-B"]]}, {"id": "1945-09-27", "date": "1945-09-27", "disp": "09.27", "arc": "wwii", "docs": [["surrender-1945", "d507"]]}, {"id": "1945-10-10", "date": "1945-10-10", "disp": "10.10", "arc": "wwii", "docs": [["surrender-1945", "d526"]]}, {"id": "1945-11-13", "date": "1945-11-13", "arc": "wwii", "docs": [["field-1945", "toyoda-2"]]}, {"id": "1945-11-13-1", "date": "1945-11-13", "arc": "wwii", "docs": [["field-1945", "toyoda-5"]]}, {"id": "1945-11-14", "date": "1945-11-14", "arc": "wwii", "docs": [["field-1945", "toyoda-7"]]}, {"id": "1945-11-14-1", "date": "1945-11-14", "arc": "wwii", "docs": [["field-1945", "toyoda-8"]]}, {"id": "1945-11-23", "date": "1945-11-23", "disp": "11.23", "arc": "wwii", "docs": [["surrender-1945", "d488"]]}, {"id": "1945-12-27", "date": "1945-12-27", "label": "모스크바 3상회의", "arc": "wwii", "bar": true, "key": true, "note": "미·영·소 외상이 조선에 최대 5년의 신탁통치를 두고 미소공동위원회를 설치하기로 합의했다. 카이로의 「적당한 시기」가 마침내 문서상의 기한이 된 자리이자, 조선 안에서 신탁통치 반대 운동이 폭발한 계기다."}, {"id": "1946-01", "date": "1946-01", "arc": "korea-div", "docs": [["scap-0141", "6"]]}, {"id": "1946-03-20", "date": "1946-03-20", "label": "1차 미소공동위", "arc": "wwii", "bar": true, "where": "서울", "note": "임시정부 수립을 협의할 미소공동위원회가 열렸다. 어느 정당·사회단체와 협의할 것인가를 두고 갈라져 5월에 결렬된다."}, {"id": "1946-04", "date": "1946-04", "arc": "korea-div", "docs": [["scap-0141", "7-J"]]}, {"id": "1946-10-01", "date": "1946-10-01", "label": "대구 10월 사건", "arc": "wwii", "bar": true, "note": "식량 공출과 경찰에 대한 항의가 대구에서 시작해 남한 전역으로 번졌다. 미군정이 계엄을 선포하고 진압했다. 점령 1년 만에 통치의 정당성이 시험대에 오른 사건이다."}, {"id": "1947-05-21", "date": "1947-05-21", "label": "2차 미소공동위", "arc": "wwii", "bar": true, "where": "서울", "note": "미소공동위원회가 다시 열렸으나 같은 쟁점에서 다시 갈라져 10월에 사실상 끝난다. 미국은 이 무렵부터 조선 문제를 유엔으로 넘기는 쪽으로 방향을 바꾼다."}, {"id": "1947-09-17", "date": "1947-09-17", "label": "한국 문제 유엔 이관", "arc": "korea-div", "bar": true, "key": true, "note": "미국이 조선 문제를 유엔 총회에 상정했다. 4개국 신탁통치라는 전시 구상이 공식적으로 폐기되고, 처리의 무대가 미소 양자에서 유엔으로 옮겨간다."}, {"id": "1948-01-08", "date": "1948-01-08", "label": "유엔한국임시위원단 입국", "arc": "korea-div", "bar": true, "note": "유엔한국임시위원단(UNTCOK)이 서울에 들어왔다. 소련이 북위 38도 이북 입경을 거부해, 감시할 수 있는 지역에서만 선거를 치른다는 결론으로 이어진다."}, {"id": "1948-02", "date": "1948-02", "arc": "korea-div", "docs": [["ndl-091", "D024"]]}, {"id": "1948-04", "date": "1948-04", "arc": "korea-div", "docs": [["ndl-091", "D014"]]}, {"id": "1948-04-02", "date": "1948-04-02", "arc": "korea-div", "docs": [["korea-1948-50", "48-d776"]]}, {"id": "1948-04-28", "date": "1948-04-28", "arc": "korea-div", "docs": [["korea-1948-50", "48-d790"]]}, {"id": "1948-05-10", "date": "1948-05-10", "label": "5·10 총선거", "arc": "wwii", "bar": true, "key": true, "note": "남한만의 제헌국회 선거가 치러졌다. 좌익과 김구·김규식 계열이 불참했다. 분단이 절차를 갖춘 사실이 되는 날이다."}, {"id": "1948-05-11", "date": "1948-05-11", "arc": "korea-div", "docs": [["korea-1948-50", "48-d797"]]}, {"id": "1948-05-15", "date": "1948-05-15", "arc": "korea-div", "docs": [["korea-1948-50", "48-d801"]]}, {"id": "1948-08-09", "date": "1948-08-09", "arc": "korea-div", "docs": [["korea-1948-50", "48-d862"]]}, {"id": "1948-08-15", "date": "1948-08-15", "label": "대한민국 정부 수립", "arc": "korea-div", "bar": true, "key": true, "note": "대한민국 정부가 수립되고 미군정이 끝났다. 카이로에서 「in due course」라고 적힌 지 4년 9개월 뒤다. 북에서는 9월 9일 조선민주주의인민공화국이 수립된다."}, {"id": "1948-08-17", "date": "1948-08-17", "arc": "korea-div", "docs": [["korea-1948-50", "48-d872"]]}, {"id": "1948-12-12", "date": "1948-12-12", "label": "유엔총회 결의 195(III)", "arc": "korea-div", "bar": true, "where": "파리 유엔총회", "note": "유엔 총회가 대한민국 정부를 위원단이 감시할 수 있었던 지역의 합법 정부로 승인했다. 「조선 전역의 유일 합법 정부」라는 뒷날의 표현과 결의문의 문언은 같지 않다.", "docs": [["korea-1948-50", "48-d924"]]}, {"id": "1948-12-17", "date": "1948-12-17", "arc": "korea-div", "docs": [["korea-1948-50", "48-d926"]]}, {"id": "1948-12-22", "date": "1948-12-22", "arc": "korea-div", "docs": [["korea-1948-50", "48-d928"]]}, {"id": "1949-03-22", "date": "1949-03-22", "arc": "korea-div", "docs": [["korea-1948-50", "49-d209"]]}, {"id": "1949-06-11", "date": "1949-06-11", "arc": "korea-div", "docs": [["korea-1948-50", "49-d262"]]}, {"id": "1949-06-26", "date": "1949-06-26", "label": "김구 피살", "arc": "korea-div", "bar": true, "key": true, "where": "서울 경교장", "note": "한국독립당 위원장 김구가 육군 소위 안두희의 총에 죽었다. 무초는 이튿날 「공식·비공식 여러 경로에서 지금까지 모은 바」로 시작하는 전문을 올린다 — 전날 첫 전문에는 아무 세부사항이 없었다."}, {"id": "1949-06-27", "date": "1949-06-27", "arc": "korea-div", "docs": [["korea-1948-50", "49-d265"]]}, {"id": "1949-06-27-1", "date": "1949-06-27", "arc": "korea-div", "docs": [["korea-1948-50", "49-d266"]]}, {"id": "1949-06-29", "date": "1949-06-29", "label": "주한미군 철수 완료", "arc": "korea-div", "bar": true, "key": true, "where": "서울", "note": "전투부대 철수가 끝나고 군사고문단(KMAG) 약 500명만 남았다. 철수 날짜를 이승만과 매듭짓는 일이 1949년 전반기 대사관 전문의 주된 내용이었다."}, {"id": "1949-10-01", "date": "1949-10-01", "label": "중화인민공화국 수립", "arc": "korea-div", "bar": true, "where": "베이징", "note": "국공내전이 사실상 끝났다. 무초는 다섯 달 전 이승만에게 중국의 결과가 조선에 당장 자국을 남기지는 않으리라고 말했었다."}, {"id": "1950-01-12", "date": "1950-01-12", "label": "애치슨 연설", "arc": "korea-div", "bar": true, "key": true, "where": "워싱턴 내셔널프레스클럽", "note": "애치슨이 미국의 태평양 방위선을 알류샨–일본–류큐–필리핀으로 그었다. 조선은 그 선 안에 들지 않았다. 이승만이 아홉 달 전 무초에게 우려한 바로 그 이야기다."}, {"id": "1950-01-20", "date": "1950-01-20", "arc": "korea-div", "docs": [["korea-1948-50", "50-d3"]]}, {"id": "1950-06-09", "date": "1950-06-09", "arc": "korea-div", "docs": [["korea-1948-50", "50-d46"]]}, {"id": "1950-06-14", "date": "1950-06-14", "arc": "korea-div", "docs": [["korea-1948-50", "50-d53"]]}, {"id": "1950-06-19", "date": "1950-06-19", "arc": "korea-div", "docs": [["korea-1948-50", "50-d57"]]}, {"id": "1950-06-23", "date": "1950-06-23", "arc": "korea-div", "docs": [["korea-1948-50", "50-d58"]]}, {"id": "1950-06-25", "date": "1950-06-25", "label": "한국전쟁 발발", "arc": "korea-war", "bar": true, "key": true, "where": "38선 전역", "note": "북한군이 38선 전역에서 남침했다. 유엔 안전보장이사회는 같은 날 결의 82호로 적대행위 중지와 38선 이북으로의 철수를 요구했다.", "docs": [["korea-1950-53", "50-d62"]]}, {"id": "1950-06-27", "date": "1950-06-27", "label": "안보리 결의 83호", "arc": "korea-war", "bar": true, "key": true, "where": "뉴욕 유엔 안보리", "note": "안보리가 회원국에 대한민국을 돕는 데 필요한 지원을 권고했다. 소련 대표는 중국 대표권 문제로 회의를 비우고 있어 거부권이 행사되지 않았다.", "docs": [["korea-1950-53", "50-d130"]]}, {"id": "1950-07-07", "date": "1950-07-07", "arc": "korea-war", "docs": [["korea-1950-53", "50-d238"]]}, {"id": "1950-09-15", "date": "1950-09-15", "label": "인천 상륙", "arc": "korea-war", "bar": true, "key": true, "where": "인천", "note": "미 제10군단이 인천에 상륙했다. 9월 28일 서울을 되찾고, 10월 1일 국군이 38선을 넘는다."}, {"id": "1950-09-30", "date": "1950-09-30", "arc": "korea-war", "docs": [["korea-1950-53", "50-d577"]]}, {"id": "1950-10", "date": "1950-10", "arc": "korea-war", "docs": [["korea-1950-53", "50-d640"]]}, {"id": "1950-10-03", "date": "1950-10-03", "arc": "korea-war", "docs": [["korea-1950-53", "50-d593"]]}, {"id": "1950-10-12", "date": "1950-10-12", "arc": "korea-war", "docs": [["korea-1950-53", "50-d665"]]}, {"id": "1950-10-15", "date": "1950-10-15", "arc": "korea-war", "docs": [["korea-1950-53", "50-d680"]]}, {"id": "1950-10-19", "date": "1950-10-19", "label": "중공군 압록강 도하", "arc": "korea-war", "bar": true, "key": true, "where": "압록강", "note": "중국인민지원군이 압록강을 건너기 시작했다. 10월 25일 첫 공세가 시작되고, 전쟁의 성격이 바뀐다."}, {"id": "1950-11", "date": "1950-11", "arc": "korea-war", "docs": [["korea-1950-53", "50-d877"]]}, {"id": "1950-11-01", "date": "1950-11-01", "arc": "korea-war", "docs": [["korea-1950-53", "50-d731"]]}, {"id": "1950-11-03", "date": "1950-11-03", "arc": "korea-war", "docs":
