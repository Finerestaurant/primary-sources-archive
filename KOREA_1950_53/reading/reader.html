경험이 없으며, 그들의 사기와 규율이 실제 전투에서 완전히 불균등한 장비 상황을 견뎌내지 못할 것이라는 사실을 저울질하지 않은 것으로 보인다.\n\nd)\n\n도쿄 연합군 최고사령부는 신속하게 보고받지 못했고, 보고받았을 때도 서울이 적의 수중에 떨어지기 직전인 사흘째가 되어서야 공격을 심각하게 평가했다. 이 공격이, 남한이 가할 수 있는 어떤 저항에 맞서 그 성공을 보장해 줄 소련의 계획, 준비 및 지원 없이 자행된 순수한 북한의 모험이라고 가정한 것으로 보인다.\n\n앞서 언급된 결함들은 원한다면 정황을 통해 입증될 수 있다. 아마도 그것들이 결과를 결정적으로 좌우하지는 않았을 것이다. 동일한 결함이 다른 곳에도 존재할 가능성이 있고 시정 조치가 바람직할 수 있기 때문에 언급해 둔다.\n\n3. 이 공격으로 대표되는 소련의 정책은 아마도 전 지구적 성격의 계획에 그 기원을 두고 있을 것이다. 한 가지 가능한 지역적 요인, 즉 남한 실험의 점증하는 성공은 위에서 언급한 바 있다. 이 공격이 일본과 관련하여 진행 중이던 계획들을 혼란에 빠뜨리기 위해 고안되었을 가능성도 있다. 사실상, 이 공격은 일본에서 군사적 요인에 새로운 중요성을 부여하고, 정치적·경제적·사회적 자치로의 이행을 어렵게 만드는 효과를 가지고 있는데, 이 이행은 국민들 사이에서 커져 가는 반감, 그리고 아마도 적대감을 막는 데 필요했다. 이는 공산주의가 일본을 극동에서 미국의 강점이 아니라 약점으로 만들 기회를 제공할 수 있다.\n\n4. 한국에 대한 공격에 대한 미국의 대응, 특히 한국, 대만 및 인도차이나에 관한 대통령 성명과 유엔의 뒷받침을 받은 신속한 실행은 매우 높은 수준의 정치력을 보여주었다. 이 중대한 결정들이 내려진 속도는 인상적일 수밖에 없다. 이 조치는 소련 공산주의자들이, 만약 저지되지 않는다면 미국에 불리한 조건에서 제3차 세계대전을 초래할 가능성이 높은 호전적 침략 노선을 추구하는 것을 멈추게 할 최선의 기회를 제공한다.\n\nJohn Foster Dulles\n\n----- 각주 -----\n[주1] 덜레스 씨는 일본과 한국 여행을 마치고 6월 29일 워싱턴으로 돌아왔다. 원본 문서는 덜레스 씨를 수행했던 앨리슨 씨가 6월 29일 고문(케넌)에게 전달한 이 각서의 사본이다.", "secondary": "secret\n\n[Washington,] June 29, 1950. [주1]\n\nNotes on Korea\n\n1. The South Korean nation was rapidly developing as a free society binder the guidance of an excellent U.S. mission and with some material aid from the U.S.\n\nWhat happened there cannot be blamed on internal abuses or failures. On the contrary, if there is any local explanation of the attack, it would be that the Soviet Communists were worried by the success of the South Korean experiment in free government and felt that they had to snuff it out as a dangerous moral salient on the otherwise communist-dominated mainland of North Asia.\n\n2. The large initial success of the attack was contributed to by the following causes:\n\na)\n\nThe South Korean military forces, by U.S. decision, were without combat planes, tanks and heavy artillery although the enemy to our knowledge possessed these in substantial quantity and good quality.\n\nb)\n\nThere was failure to evaluation properly the intelligence information. It showed that over several weeks there had been a gradual concentration of large troop and tank formations. But there continued to be a fixed idea on our side that there would not be more than border raids in strength.\n\n[238면] c)\n\nThere was a mood of complacency on the part of U.S. military advisers, induced by over-confidence in the morale and discipline of the South Korean troops. They seem not to have weighed the fact that the South Korean troops were without battle experience and their morale and discipline could not, in actual combat, survive a totally unequal matériel situation.\n\nd)\n\nGHQ Tokyo was not informed promptly, and when informed did not evaluate the attack as serious until the third day when Seoul was within the enemy grasp. It seems to have been assumed that the attack was a purely North Korean adventure, carried out without the Soviet planning, preparation and backing which would assure its success as against any resistance that the South Koreans could interpose.\n\nThe foregoing deficiencies can be substantiated circumstantially if desired. Perhaps they did not decisively affect the outcome. They are noted because it is possible that the same deficiencies exist elsewhere and that corrective measures may be desirable.\n\n3. Presumably the Soviet policy represented by the attack has its origin in planning of a global nature. One possible local factor, namely the growing success of the South Korean experiment, has been noted above. It is also possible that the attack was designed to throw out of gear the planning under way in relation to Japan. In fact, the attack does have the effect of giving renewed importance in Japan to military factors and making difficult a transition to political, economic and social autonomy, a transition needed to prevent growing antagonism and perhaps hostility on the part of the people. This could give Communism an opportunity to make Japan a point of U.S. weakness rather than of strength in the Far East.\n\n4. The response of the U.S. to the Korean attack, notably the President’s statement in relation to Korea, Formosa and Indo-China and its prompt execution with U.N. backing, represented statesmanship of a very high order. The rapidity with which these major decisions were taken cannot but be impressive. The action provides the best chance of causing the Soviet Communists to pause in pursuing a course of militant aggression which, if left unchecked, would make probable a Third World War under conditions disadvantageous to the United States.\n\nJohn Foster Dulles", "notes": [], "warn": false, "pages": ["50-238"], "search": "John Foster Dulles 덜레스 Allison 앨리슨 Kennan 케넌"}, {"id": "50-d225", "order": 9, "date": "1950-07-06", "group": "E", "eyebrow": "50-d225 · The British Embassy to the Department of State", "title": "영국 대사관이 국무부에 보낸 각서", "badge": "secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-07-06"}, {"k": "시각", "v": null}, {"k": "발신", "v": "영국 대사관", "txt": true}, {"k": "수신", "v": "미국 국무부", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "795.00/7–650", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d225"}], "summary": "영국 외무부가 워싱턴 주재 영국 대사관에 켈리 대사와 그로미코 면담 결과를 애치슨 국무장관에게 전달하고 속의를 요청하는 전문을 발송했다.", "points": ["영국은 소련의 회답을 가장 신중하게 고려해야 하며, 미국 정부와 논의 없이 모스크바에서 추가 조치를 취하지 않을 것이라고 밝혔다.", "영국 여론은 소련이 한국에서 선을 넘었다고 인식하고 있으며, 평화로 이어질 수 있는 움직임에는 진지한 고려를 기대할 것이라고 강조했다.", "켈리-그로미코 회담의 세부 내용이 언론에 누설되어서는 안 된다는 점을 애치슨에게 강조하라고 지시했다.", "애틀리 총리가 트루먼 대통령에게 보내는 한국 상황의 군사적·정치적 함의에 관한 메시지를 별도 전문으로 송부한다고 통보했다."], "primary": "워싱턴, 1950년 7월 6일\n\n기밀(secret)\n\n1950년 7월 6일자 외무부 발 워싱턴 주재 영국 대사관 앞 전문에서 발췌\n\n애치슨 장관에게 켈리의 보고문[주1]을 직접 전달하고, 나를 대신하여 다음과 같은 취지로 말씀드리기 바랍니다.\n\n2. 애치슨 장관은 미국 측이 소련 정부에 접촉한 이후 우리가 소련 정부에 대해서도 이와 나란히 접촉하기로 결정했음을 기억하실 것입니다. 이번 소련의 회답은 분명히 가장 신중한 검토를 필요로 하며, 우리는 미국 정부와 논의하지 않고 모스크바에서 더 이상의 조치를 취하지 않을 것입니다. 그동안 애치슨 장관의 반응이 어떠한지를 알고 싶습니다.\n\n3. 이곳의 일반 여론은 러시아인들 스스로도 한국에서 자신들이 선을 넘었다는 점을 인식하고 있다고 대체로 믿고 있습니다. 따라서 그들은 평화로 이어질 수 있는 어떠한 움직임에 대해서도 가장 진지한 검토가 이루어지기를 기대할 것이며, 정부로서는 어제 의회 토론에서 입증된 국가의 전면적인 지지를 상실할 수 있는 어떠한 방식으로도 행동하지 않도록 신중을 기해야 할 것입니다.\n\n[314면]\n\n4. 켈리와 그로미코의 대화 세부 내용이 언론에 누설되지 않도록 하는 것이 지극히 중요하다는 점을 애치슨 장관에게 강조해 주시기 바랍니다. 우리는 켈리가 이미 모스크바에서 언론에 밝힌 것 이상으로 설명하는 것을 거부하고 있습니다.\n\n5. 이어지는 내 전문에서 한국 사태의 군사적·정치적 함의에 관하여 수상이 대통령에게 보내는 메시지[주2]를 전달합니다. 애치슨 장관이 켈리의 보고서를 보는 것과 같은 시점에 이 메시지를 보기를 바랍니다. 수상의 메시지는 우리가 어떤 일에도 우연에 맡겨서는 안 된다고 생각하고 있음을 미국 측에 나타낼 것입니다. 그러나 수상의 메시지에 담긴 제안이 그로미코의 접근에 우리가 어떤 회답을 해야 할지 신중하게 저울질하는 일의 중요성을 떨어뜨려서는 안 된다고 나는 생각합니다.\n\n----- 각주 -----\n[주1] 7월 6일자 켈리 대사가 그로미코와의 면담에 관해 외무부로 보낸 전문의 본문은 이 영국 대사관 각서와 함께 국무부로 전달되었으나 인쇄하지 않는다. 켈리 대사 메시지의 요지는 앞의 모스크바 발 제54호 전문에 담겨 있으며, 또한 1950년 7월 20일 하원에서 행한 애틀리 수상의 성명에도 요약되어 있다. 해당 성명은 British Cmd. 8078, Korea No. 1 (1950): Summary of Events Relating to Korea, 1950, p. 27에 인쇄되어 있다.\n[주2] 아래 문서.", "secondary": "Washington, July 6, 1950\n\nsecret\n\nExtract From Telegram From the Foreign Office to the British Embassy, Washington, Dated July 6th, 1950\n\nI think that you should at once communicate the text of Kelly’s report [주1] to Mr. Acheson personally and speak to him from me in the following sense.\n\n2. He will remember that we decided to make a parallel approach to the Soviet Government after the United States had approached them. This Soviet response clearly needs the most careful consideration, and we shall not make any further move in Moscow without discussion with the United States Government. Meanwhile it would be very helpful to us to know what Mr. Acheson’s reaction is.\n\n3. Have in mind that the public here in the main believe that the Russians themselves recognise that they have overstepped the mark in Korea. They will therefore expect the most serious consideration to be given to any move which might lead to peace, and the Government for their part are bound to be careful not to act in any way which might lose them the unanimous support of the country which was demonstrated in yesterday’s debate in Parliament.\n\n[314면]\n\n4. Please impress on Mr. Acheson that it is of the utmost importance that details of Kelly’s conversation with Gromyko should not be allowed to leak to the press. We are refusing to enlarge on what Kelly has already given out to the press in Moscow.\n\n5. In my immediately following telegram I am transmitting a message from the Prime Minister to the President [주2] regarding the military and political implications of the Korea situation. I am anxious that Mr. Acheson should see this message at the same time as he sees Kelly’s report. The Prime Minister’s message will indicate to the United States that we think that nothing should be left to chance. But I do not think that the proposals in the Prime Minister’s message should detract from the importance of weighing carefully what reply we should give to Gromyko’s approach.", "notes": [], "warn": false, "pages": ["50-314"], "search": "Acheson 애치슨 Kelly 켈리 Gromyko 그로미코 Attlee 애틀리 Truman 트루먼"}, {"id": "50-d226", "order": 10, "date": "1950-07-06", "group": "E", "eyebrow": "50-d226 · The British Prime Minister (Attlee) to President Truman", "title": "애틀리 영국 총리가 트루먼 대통령에게", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-07-06"}, {"k": "시각", "v": null}, {"k": "발신", "v": "애틀리(Attlee, 영국 총리)", "txt": true}, {"k": "수신", "v": "트루먼(Truman) 대통령", "txt": true}, {"k": "장소", "v": "London"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "서한"}, {"k": "원문출처", "v": "795.00/7–650", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d226"}], "summary": "애틀리가 트루먼에게 한국 사태에 대비한 공동 전략 협의를 제안한다.", "points": ["한국 사태가 전개되면서 군사적 문제뿐 아니라 광범위한 정치적 함의가 생길 것이다.", "소련이 직접 드러나지 않고 서방에 큰 부담을 지우는 방식을 다른 동아시아 지역에서도 쓸 수 있다.", "말라야의 공산주의 활동이 이미 한국 사태에 맞춰 강화된 것으로 보이며, 중국의 홍콩 공격 가능성도 배제할 수 없다.", "소련의 도발이 동아시아에만 그치지 않을 수 있다. 페르시아와 그리스 등도 위험 지점이 될 수 있다.", "양국 대표가 만나 소련이 채택할 행로를 검토하고 공동 대응 계획을 협의할 것을 제안한다.", "워싱턴에서 테더 경을 통해 논의하고 영국 합참 대표와 국무부도 참여시키자.", "회담의 존재나 회담 중 내용은 전혀 공개하지 않는 데 동의할 것이라고 믿는다."], "primary": "top secret\n\n애틀리 씨가 대통령에게 보내는 전문\n\n1. 한국의 상황이 전개되면서 우리가 직면하게 될 문제들에 대해 깊이 숙고해 왔습니다. 이러한 문제들은 물론 일차적으로 군사적인 것이지만, 점점 더 광범위한 정치적 함의를 띠게 될 가능성이 있습니다.\n\n2. 그 함의는 우리가 한국의 상황이 어떻게 전개되기를 바라는지뿐만 아니라, 상황이 전개됨에 따른 러시아의 반응에도 관련될 것입니다. 러시아의 반응은 극동에서만 예상되는 것이 아닙니다. 우리는 소비에트 정부가 우리에게 문제를 일으킬 수 있는 세계의 다른 지역들에 대해서도 어느 정도 숙고해 왔습니다.\n\n3. 우리가 우려하고 있는 한국 상황의 특별한 측면은, 러시아가 서방 열강으로 하여금 그들 자신이 노골적인 역할을 하지 않은 채 막대한 개입을 떠안게 했다는 점이며, 극동의 다른 지역들도 그들에게 동일한 전술이 열려 있습니다. 대통령께서는 이미 인도차이나와 대만에 대한 우려를 표명하셨습니다. 말라야에서 공산주의자에게서 영감을 받은 활동이 이미 한국 사태에 보조를 맞추어 강화되었다고 볼 만한 이유가 있습니다. 그리고 우리는 중국이 홍콩을 공격할 가능성도 무시할 수 없습니다.\n\n4. 그러나 나아가, 우리는 러시아의 이러한 활동들이 동아시아에 국한될 것이라고 확신할 수 없습니다. 대통령의 군사 고문들이 페르시아가 다시 위험 지점이 될 수 있다는 견해를 이미 표명했다고 알고 있습니다. 기회를 틈타 그리스에서 불씨를 되살리지 않을지도 고려해야 합니다. 그 밖에도 분쟁 가능성이 있는 다른 지역들이 있을 수 있습니다.\n\n[315면]\n\n5. 모든 우발 상황에 대해 사전에 정확히 대비할 수 있는 사람은 아무도 없습니다. 그러나 우리가 가능한 한 앞을 내다보고, 추가적인 사태 발발 시 이 지역들에 대한 공동 정책에 관해 어느 정도 합의에 도달해야 한다는 데 동의해 주시기를 바랍니다.\n\n6. 따라서 저는 대통령께, 양국 정부 대표들이 만나 소비에트 정부가 채택할 가능성이 가장 큰 행동 방침이 무엇인지 검토하고 이에 대응하기 위해 우리가 채택해야 할 계획을 탐색적으로 논의할 것을 제안하고 싶습니다. 우리 사이에는 이미 광범위한 분야에 걸쳐 계획이 협의되어 있지만, 상세한 계획을 적용해야 할 분야를 확대해야 할 때가 온 것 같습니다. 다른 정부들, 특히 프랑스도 관련될 수 있으나, 상황이 요구할 때 그때 통보하면 충분할 것입니다.\n\n7. 따라서 대통령께서 적절한 미국 당국자들에게 워싱턴에서 테더 경과 이 문제들을 논의하도록 권한을 부여해 주시기를 제안하고 싶습니다. 이 제안을 승인해 주시면, 저는 여기에서의 우리의 생각에 관해 테더 경에게 조언할 영국 합동참모본부 대표를 보낼 것을 제안할 생각입니다.\n\n8. 그러한 회담은 정치적 함의를 무시할 수 없다고 생각합니다. 따라서 대통령께서 국무부가 이 회담에 함께해야 한다고 제안하실지 듣고 싶습니다. 그렇게 되면, 물론 테더 경에게도 적절한 정치적 조언을 받을 수 있도록 조처하겠습니다.\n\n9. 제 동료들과 저는 미국 정부와 가능한 한 가장 긴밀한 이해에 도달하는 것에 매우 큰 중요성을 부여하며, 그렇게 함으로써 우리 모두가 서로가 이 중대한 문제들에 접근하는 방식을 이해하고 있다는 완전한 확신 속에 계획을 세울 수 있게 되기를 바랍니다. 따라서 대통령께서 이 제안에 대해 빠르고 긍정적인 회답을 주실 수 있기를 깊이 바랍니다.\n\n10. 대통령께서는 제안된 회담에 관해 회담 전이나 회담 도중에 아무런 공개도 있어서는 안 된다는 점에 동의하시리라고 확신합니다.\n\n[런던,] 1950년 7월 6일.", "secondary": "top secret\n\nMessage From Mr. Attlee to the President\n\nI have been giving much thought to the problems which are likely to face us as the situation in Korea develops. These problems are of course primarily military but they are likely to have increasingly wide political implications.\n\n2. The implications will concern not only the way in which we should like to see the situation in Korea develop but also the reactions of the Russians as it develops. Russian reactions may be expected not only in the Far East; we have been giving some thought to other parts of the world where the Soviet Government may cause trouble for us.\n\n3. A particular aspect of the situation in Korea which is causing us concern is that the Russians have involved the Western Powers in a heavy commitment without themselves playing an overt part, and there are other areas in the Far East where the same tactics are open to them. You have already made known your concern with Indo-China and Formosa. There is some reason to think that Communist-inspired activities in Malaya have already been stepped up in tune with the Korean affair. And we can not ignore the possibility of a Chinese attack on Hongkong.\n\n4. But further, we can not be sure that these activities on the part of Russia will be confined to East Asia. I understand your Military Advisers have already expressed the view that Persia may again become a danger spot. We should consider whether the opportunity may not be taken of relighting the fire in Greece. And there may be other areas of potential trouble.\n\n[315면]\n\n5. No-one can attempt to provide precisely in advance for every eventuality. But I hope you will agree with me that we should look ahead as far as we can and reach some agreement as to our common policy in these areas in the event of further outbreaks.\n\n6. I would like to propose to you therefore that representatives of our two Governments should meet to consider what courses of action are most likely to be adopted by the Soviet Government and should have an exploratory discussion of the plans we should adopt to meet them. Plans have already been concerted between us over a wide field but I think that the time may have come for extending the area to which our detailed plans should apply. Other Governments, in particular the French, may be concerned but it will suffice if they are informed as and when the situation demands.\n\n7. I would therefore like to suggest to you that you should authorise the appropriate United States authorities to discuss these problems with Lord Tedder in Washington. If you approve this suggestion, I should propose to send a representative of the United Kingdom Chiefs of Staff to advise Lord Tedder on our thinking here.\n\n8. It seems to me that such talks cannot ignore the political implications. I should therefore be glad to hear whether you would propose that the Department of State should be associated with these talks. If so, I should of course arrange for Lord Tedder also to be supplied with appropriate political advice.\n\n9. My colleagues and I attach very great importance to reaching the closest possible understanding with the United States Government so that we can both plan in full confidence that we understand each other’s approach to these weighty problems. I therefore deeply hope that you will be able to give me an early and favourable reply to this suggestion.\n\n10. I am sure you will agree that there should be no publicity about the proposed talks either before or while they take place.\n\n[London,] 6th July, 1950.", "notes": [], "warn": false, "pages": ["50-315"], "search": "애틀리(Clement Attlee, 영국 총리) 트루먼(Harry S. Truman, 미국 대통령) 테더 경(Lord Tedder)"}, {"id": "50-d238", "order": 11, "date": "1950-07-07", "group": "B", "eyebrow": "50-d238 · Resolution Adopted by the United Nations Security Council, July 7, 1950  U.N. document S/1588. This resolution was adopted at the 476th meeting of the Security Council which met from 3 to 4:45 p. m. on July 7. It was introduced by the Representatives of France and the U.K. and was approved by a vote of 7 (including the U.S.) to 0, with 3 abstentions (Egypt, India, Yugoslavia), and 1 member absent (U.S.S.R.). For the record of the meeting, see U.N. document S/PV.476.", "title": "1950년 7월 7일 유엔 안전보장이사회가 채택한 결의", "badge": null, "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-07-07"}, {"k": "시각", "v": null}, {"k": "발신", "v": "유엔 안전보장이사회(Security Council)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "장소", "v": "Lake Success"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "성명"}, {"k": "원문출처", "v": "U.N. document S/1588. This resolution was adopted at the 476th meeting of the Security Council which met from 3 to 4:45 p. m. on July 7. It was introduced by the Representatives of France and the U.K. and was approved by a vote of 7 (including the U.S.) to 0, with 3 abstentions (Egypt, India, Yugoslavia), and 1 member absent (U.S.S.R.). For the record of the meeting, see U.N. document S/PV.476.", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d238"}], "summary": "미국을 사령관으로 하는 통합사령부를 창설하고 유엔기를 사용할 권한을 부여한다.", "points": ["북한군의 대한민국 무력 공격이 평화의 파괴라고 규정한다.", "무력 공격을 격퇴하고 국제 평화와 안전을 회복하는 데 필요한 원조를 회원국에 권고한 점을 상기시킨다.", "원조를 제공하는 모든 회원국의 군대와 지원을 미국 산하 통합사령부에 제공할 것을 권고한다.", "미국이 통합사령부 사령관을 지명하도록 요청한다.", "통합사령부가 북한군에 대한 작전 과정에서 참전국 국기와 함께 유엔기를 사용할 수 있도록 승인한다.", "통합사령부의 조치에 관한 적절한 보고를 안보리에 제공하도록 미국에 요청한다."], "primary": "1950년 7월 7일\n\n안전보장이사회는\n\n북한군의 대한민국에 대한 무력 공격이 평화의 파괴를 구성한다고 결정하였고,\n\n유엔 회원국이 무력 공격을 격퇴하고 이 지역의 국제 평화와 안전을 회복하는 데 필요한 원조를 대한민국에 제공할 것을 권고하였음을 상기하며,\n\n1.\n\n각국 정부와 유엔 회원국 국민이 대한민국이 무력 공격에 맞서 스스로 방어하고 이를 통해 이 지역의 국제 평화와 안전을 회복하도록 지원하라는 1950년 6월 25일 및 27일 결의에 신속하고도 적극적인 지지를 보내온 것을 환영한다.\n\n2.\n\n유엔 회원국이 대한민국에 대한 원조 제공 의사를 유엔에 전달해 왔음에 주목한다.\n\n3.\n\n앞서 언급된 안전보장이사회 결의에 따라 군대와 기타 원조를 제공하는 모든 회원국은 그러한 군대와 기타 원조를 미국 산하의 통합사령부에 제공할 것을 권고한다.\n\n4.\n\n미국이 위 군대의 사령관을 지명할 것을 요청한다.\n\n5.\n\n통합사령부가 북한군에 대한 작전 과정에서 재량에 따라 참전하는 여러 국가의 국기와 함께 유엔기를 사용하는 것을 승인한다.\n\n6.\n\n통합사령부 하에 취해진 조치의 경과에 관한 적절한 보고를 안전보장이사회에 제공할 것을 미국에 요청한다.", "secondary": "July 7, 1950\n\nThe Security Council\n\nHaving determined that the armed attack upon the Republic of Korea by forces from North Korea constitutes a breach of the peace,\n\nHaving recommended that Members of the United Nations furnish such assistance to the Republic of Korea as may be necessary to repel the armed attack and to restore international peace and security in the area,\n\n1.\n\nWelcomes the prompt and vigorous support which governments and people of the United Nations have given to its Resolutions of 25 and 27 June 1950 to assist the Republic of Korea in defending itself against armed attack and thus to restore international peace and security in the area;\n\n2.\n\nNotes that Members of the United Nations have transmitted to the United Nations offers of assistance for the Republic of Korea;\n\n3.\n\nRecommends that all Members providing military forces and other assistance pursuant to the aforesaid Security Council resolutions make such forces and other assistance available to a unified command under the United States;\n\n4.\n\nRequests the United States to designate the commander of such forces;\n\n5.\n\nAuthorizes the unified command at its discretion to use the United Nations flag in the course of operations against North Korean forces concurrently with the flags of the various nations participating;\n\n6.\n\nRequests the United States to provide the Security Council with reports as appropriate on the course of action taken under the unified command.", "notes": [], "warn": false, "pages": [], "search": ""}, {"id": "50-d257", "order": 12, "date": "1950-07-10", "group": "C", "eyebrow": "50-d257 · Memorandum by the Joint Chiefs of Staff to the Secretary of Defense (Johnson)", "title": "합동참모본부가 국방장관(Johnson)에게 보낸 각서", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-07-10"}, {"k": "시각", "v": null}, {"k": "발신", "v": "합동참모본부", "txt": true}, {"k": "수신", "v": "국방장관(Johnson)", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "795.00/7–1050.", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d257"}], "summary": "소련군이 한국 전투에 개입할 경우 미국의 행동 방침에 대한 합참의 권고. 대규모 소련 전투부대가 개입하거나 개입 의사를 분명히 하면 한국에서의 약속을 최소화하고 전면 동원을 포함한 전쟁 계획 실행을 준비해야 한다고 본다.", "points": ["합참은 소련군이 대규모 전투부대로 미군 또는 우호군에 대항해 교전하거나 그 의사를 분명히 할 때 한국 전투에 들어온 것으로 간주해야 한다고 본다.", "정치적 고려 때문에 결정적이지 않은 작전 지역에 과도한 미군 병력과 자원을 투입하게 될 것을 우려한다.", "소련이 세계대전을 결정하면 현재의 미군 배치와 약속을 역이용하여 소련의 전체 전략을 더 효과적으로 만들 수 있다고 경고한다.", "한국은 전략적 중요성이 낮고 소련이 선택한 지역이므로, 소련이 개입하면 미군은 한국에서의 약속을 최소화하고 전쟁 계획(전면 동원 포함)을 준비해야 한다.", "이 문제는 지속적으로 연구 중이며 상황 전개에 따라 적절한 권고를 제출할 것이다."], "primary": "**일급 비밀**\n\n워싱턴, 1950년 7월 10일.\n\n건명: 소련군이 한국 전투에 개입할 경우 미국의 행동 방침\n\n1.\n\n1950년 6월 30일자 각서에 따라,[주1] 합동참모본부는 소련군이 한국 전투에 개입할 경우 미국이 채택할 행동 방침에 관한 권고를 이에 제출한다.\n\n2.\n\n합동참모본부는 소련의 주요 전투부대가 한국 전투에서 미군 및/또는 우호군에 대항해 교전하거나 교전 의사를 분명히 표시할 때 소련군이 한국 전투에 개입한 것으로 간주해야 한다고 생각한다. 그러나 합동참모본부는 정치적 고려 때문에 결정적이지 않을 작전 지역에 미군 병력과 자원을 과도하게 투입하게 될 것을 우려한다. 소련이 세계대전을 감행하기로 결정할 경우, 소련은 그러한 미군의 배치와 약속을 역이용할 수 있는 위치에 서게 되어 소련의 전체 전쟁 전략을 더욱 효과적으로 만들 수 있을 것이다.\n\n3.\n\n세계대전의 예비 단계 또는 초기 단계에서 미국이 전략적 중요성이 낮은 지역, 그것도 소련이 선택한 지역에서 소련을 상대로 대규모 병력을 투입하는 것은 군사적으로 현명하지 못할 것이다. 따라서 한국 전투 지역에서의 군사 작전 중 어느 때라도 소련의 주요 전투부대가 미군 및/또는 우호군에 대항해 교전하거나 교전 의사를 분명히 표시할 경우, 미국은 한국에서의 약속을 최소화하고 전쟁 계획을 실행할 준비를 해야 한다. 이 준비에는 전면 동원의 개시가 포함되어야 한다.\n\n4.\n\n앞의 단락들과 관련하여, 합동참모본부는 자체 지시에 따라 그 안에 제시된 사항들을 지속적으로 연구 중이며 상황 전개에 따라 적절한 권고를 적시에 제출할 것임을 알려드린다.[주2]\n\n합동참모본부를 대표하여:\n\nOmar N. Bradley\n합동참모본부 의장\n\n[347면]", "secondary": "top secret\n\nWashington, July 10, 1950.\n\nSubject: U.S. Courses of Action in the Event Soviet Forces Enter Korean Hostilities\n\n1.\n\nIn accordance with your memorandum dated 30 June 1950, [주1] the Joint Chiefs of Staff submit herewith their recommendations as to the course of action to be adopted by the United States in the event that Soviet forces enter Korean hostilities.\n\n2.\n\nThe Joint Chiefs of Staff are of the opinion [that] the USSR armed forces should be considered to have entered Korean hostilities when major Soviet combat units engage or clearly indicate their intention of engaging in hostilities against U.S. and/or friendly forces in the Korean hostilities. The Joint Chiefs of Staff are concerned, however, lest political considerations demand excessive commitments of United States military forces and resources in those areas of operations which would not be decisive. In the event the USSR should decide to undertake global war, that nation would be in a position to exploit such United States deployments and commitments and could thus render more effective Soviet over-all war strategy.\n\n3.\n\nPreliminary to, or in the initial stages of a global war, it would be militarily unsound for the United States to commit large forces against the USSR in an area of slight strategic importance, as well as one of Soviet choice. Therefore, if major USSR combat units should at any time during military operations in the Korea area of hostilities engage or clearly indicate their intention of engaging in hostilities against U. S. and/or friendly forces the U. S. should prepare to minimize its commitment in Korea and prepare to execute war plans. These preparations should include initiation of full-scale mobilization.\n\n4.\n\nIn connection with the preceding paragraphs, the Joint Chiefs of Staff would advise that, by their direction, the matters set forth therein are being kept under continuing study with a view to timely submission in accordance with development of suitable recommendations. [주2]\n\nFor the Joint Chiefs of Staff: \n\n\nOmar N. Bradley\n\nChairman Joint Chiefs of Staff\n\n[347면]", "notes": ["[주1] 인쇄되지 않음.", "[주2] 이 각서는 Johnson 국방장관의 동의 표시와 함께 NSC 사무국장(Lay)에게 송부되었다. Lay는 이를 NSC 76으로 하여 7월 21일자로, 7월 27일로 예정된 제62차 NSC 회의에서 검토하도록 제출했다(NSC 파일). NSC 76에 대한 국무부 논평은 7월 25일자 NSC 76/1의 첨부 문서, 475면 참조."], "warn": false, "pages": ["50-347"], "search": "Johnson, Louis A. Bradley, Omar N. Lay, James S. Jr."}, {"id": "50-d297", "order": 13, "date": "1950-07-15", "group": "A", "eyebrow": "50-d297 · The Ambassador in Korea (Muccio) to the Secretary of State", "title": "무초 주한대사가 국무장관에게 보낸 전보", "badge": "secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-07-15"}, {"k": "시각", "v": "발신: 1950-07-15; 수신: 1950-07-16 오전 4:17"}, {"k": "발신", "v": "Muccio 무초(주한대사)", "txt": true}, {"k": "수신", "v": "Secretary of State 국무장관", "txt": true}, {"k": "장소", "v": "Taegu"}, {"k": "전문번호", "v": "43"}, {"k": "종류", "v": "전보"}, {"k": "원문출처", "v": "795.00/7–1550: Telegram", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d297"}], "summary": "대한민국 정부가 대구로 이전하고 있다. 무초가 각 부처 배치, 내무장관 경질, 대통령의 대전 복귀 압박과 육군참모총장 진급 상황을 보고한다.", "points": ["대통령·외무·내무·재무·문교 등 대부분의 각료가 대구 도청사에 합류했다.", "이승만은 사기 진작을 위해 대전으로 돌아가길 강력히 원했으나 워커 장군의 설득으로 대구에 머물기로 했다.", "무능했던 백성욱 내무장관을 경질하고 초대 경찰총수였던 조병옥을 기용했다.", "정일권을 소장으로 승진시켜 채병덕 소장 등 타 장성들에 대한 지휘권을 확립했다.", "한국군 사령부와 정부의 후퇴 모양새가 국민의 심리적 지지를 약화시키고 게릴라전과 전복을 부활시킬 가능성을 우려하고 있다."], "primary": "secret\npriority\n\n대구, 1950년 7월 15일.\n[7월 16일 오전 4:17 접수]\n\n43. 대한민국 정부가 대구에 자리잡고 있다. 현재 이곳에 있는 이들은 다음과 같다: 대통령, 외무장관, 내무장관, 재무장관, 문교[400면]장관, 체신장관, 상공장관, 농림장관, 교통장관, 사회장관, 보건후생장관, 행정관리국장, 공보국장. 국무총리 겸 국방장관은 오늘 이곳에 도착할 예정이지만 대전으로 돌아갈 가능성이 있다. 조선은행에 자리잡은 재무장관을 제외하고는 모든 장관이 도청사에 자리잡았다. 한데 모여 전황 소식에만 집중하는 대신 분산하여 사무소를 내면 보다 정상적인 정부 업무를 수행할 수 있도록 설득하기를 바란다.\n\n내무장관 백성욱이 오늘 조병옥으로 교체되었다. 조병옥은 미군정 시절 전 조선경찰 총책임자였다. 조병옥의 능력과 정력, 용기는 이번 위기에서 대게릴라 작전을 포함한 경찰 지휘에 탁월한 효과를 낼 것으로 기대된다. 백 전 장관은 완전히 무능한 것으로 드러났다. 공보국장 Clarence Ryee는 무능을 이유로 「병가(sick leave)」를 얻어 부산으로 보내졌다. 외무장관 임병직이 비공식적으로 공보국장직을 추가로 맡게 되었으며, 그의 지명을 비공식으로 추천했던 스튜어트와 긴밀히 협력할 것이다.\n\n대사관이 대통령을 설득하여 대전을 떠난 이래로 사기 진작을 위해 정부를 통솔하고 전선 가까이에서 자신을 국민에게 보여주기 위해 대통령은 계속해서 복귀를 주장해 왔다. 대통령은 7월 9일 본인의 권고로 대구에 머물렀으나 이는 그의 의사에 강력히 반한 것이었다. 그 이후로는 대전으로 돌아가겠다고 가장 강경하게 주장해 왔다. 오늘 워커 장군은 대통령이 이곳에 머물며 활동하는 것이 대전으로 돌아가는 것보다 전쟁 수행에 더 도움이 된다고 설득했으며, 대통령은 이 권고를 받아들인 듯하다.\n\n참모총장 정일권이 소장으로 진급하여, 다른 소장들, 특히 정일권의 명령을 받아들이길 꺼려했던 「Flk」 Chaf [「비만」 채(Chae)?] [주1] 장군에 대한 지휘권을 확립하는 데 도움이 되었다. 정일권은 아마도 워커 장군의 사령부 근처인 대구에 본부를 유지하겠지만, 한국군의 사기 진작을 위해서는 대부분의 시간을 금천이나 그보다 전방에 있는 전진 사령부에서 보낼 가능성이 높다. 대한민국은 한국군 사령부와 정부가 후퇴하는 듯한 인상 때문에 국민의 심리적 지지가 약화되고, 사람들의 무관심을 초래하거나 게릴라전 및 전복이 다시 일어날 것을 상당히 우려하고 있다.\n\n정보 차원에서 무번호로 도쿄에 재전송됨.\n\n무초\n\n[401면]", "secondary": "secret \n priority\n\nTaegu, July 15, 1950.\n[Received July 16—4:17 a.m.]\n\n43. ROK Government establishing Taegu. Following now here: President, Foreign Minister, Home Minister, Finance Minister, Educational [400면] Minister, Communications Minister, Commerce Minister, Agricultural Minister, Transportation Minister, Social Affairs Minister, Public Health and Welfare Minister, Directors Bureaus Administration, Public Information. Prime Minister-Defense Minister expected here today but possibly returning Taejon. Except Finance Minister who established at Bank Chosun, all ministers established Provincial Government building; hoping persuade disperse office enable conduct more normal government business instead congregating together devoting attention war news.\n\nHome Minister Paek Sung Ok replaced today by Chough Pyung Ok, former chief national police USAMGIK. Chough’s ability, energy courage expected have excellent effect leading police, including antiguerilla operations, this crisis. Paek proved utterly incapable. Director Public Information Clarence Ryee being given “sick leave” sent Pusan owing incompetence; Foreign Minister Ben Limb unofficially being given additional duty Director Public Information, will work closely with Stewart, who informally recommended his designation.\n\nEver since Embassy persuaded President leave Taejon, President has been insisting on returning, both to head government and show self to people near front for morale purposes. President was stopped Taegu July 9 by my advice but strongly against his will; since then has been most insistent upon returning Taejon. Today General Walker persuaded President his presence, activities Taegu more helpful war effort than return Taejon; President appears accept this advice.\n\nChief Staff Chung Il Kwan promoted Major General, easing his command position relative other major generals, especially “Flk” Chaf [“Fat” Chae?] [주1] who has shown reluctance accept Chung’s orders. Chung probably will maintain headquarters Taegu near General Walker’s headquarters, but for morale purposes of Korean army likely spend most time advance headquarters at Kumchon, or forward. ROK considerable concern lest psychological support Korean people be undermined by appearance retreat Korean Army command and government, causing either popular indifference or resurgence guerilla warfare and subversion.\n\nRepeated information Tokyo unnumbered.\n\nMuccio\n\n[401면]", "notes": ["[주1] 정일권이 대한민국 육군 참모총장 자리를 교체한 채병덕 장군을 가리키는 것으로 추정된다."], "warn": false, "pages": ["50-400", "50-401"], "search": "Muccio 무초(주한대사) Secretary of State 국무장관 Syngman Rhee 이승만(李承晩) Paek Sung Ok 백성욱(白性郁) Chough Pyung Ok 조병옥(趙炳玉) Chae Byong Duk 채병덕(蔡秉德) Chung Il Kwan 정일권(丁一權) General Walker 워커 장군 Ben Limb 임병직(林炳稷) Clarence Ryee Stewart 스튜어트"}, {"id": "50-d302", "order": 14, "date": "1950-07-17", "group": "E", "eyebrow": "50-d302 · The Indian Ambassador (Pandit) to the Secretary of State", "title": "판디트 주미 인도 대사가 국무장관에게", "badge": null, "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-07-17"}, {"k": "시각", "v": null}, {"k": "발신", "v": "주미 인도 대사 판디트(Vijaya Lakshmi Pandit)", "txt": true}, {"k": "수신", "v": "국무장관 애치슨(Dean Acheson)", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "서한"}, {"k": "원문출처", "v": "330/7–1750", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d302"}], "summary": "네루 인도 총리가 스탈린과 주고받은 서한 전문을 전달하며 중국의 안전보장이사회 참여를 조건 없는 해결 방안으로 제시한다.", "points": ["중국 안보리 진출과 소련 복귀가 심의를 방해할 수 있다는 우려 때문에 안보리의 완전한 대표성을 회복시키지 말아야 한다는 주장을 네루가 반박한다.", "북한군의 38선 복귀 같은 사전 조건을 고수하면 서방 열강이 평화적 해결을 바라지 않는다는 증거로 비칠 수 있다고 본다.", "중국과 소련이 안보리 복귀 후에도 비합리적으로 나오면 세계 여론이 그들에게 책임을 물을 것이라고 주장한다.", "모스크바가 위신 손상 없이 현재의 얽힘에서 빠져나올 길을 찾고 있다는 것이 네루의 솔직한 믿음이다.", "중국 정부의 안보리 진입과 소련의 복귀를 조건 없이 허용하면 한국 문제를 평화적으로 해결할 실질적 기회가 있다고 제안한다.", "스탈린은 안보리를 통한 평화적 해결의 타당성에 동의하며 5대 강국 대표의 참여가 불가결하다고 답신한다."], "primary": "워싱턴, 1950년 7월 17일\n\n친애하는 국무장관님: 인도 총리로부터 귀하께 보내는 메시지의 전문을 동봉하는 영광을 갖습니다. 또한 스탈린 원수께서 총리에게 보내신 메시지와 그에 대한 총리의 답신 전문도 동봉합니다.\n\n드림〔이하 생략〕\n\n비자야 락슈미 판디트\n\n[408면]\n\n〔부속서 1〕\n\n인도 총리가 미합중국 국무장관 딘 애치슨 각하께 보내는 메시지 전문\n\n나는 스탈린 원수의 답신[주1]이 매우 고무적이라고 생각합니다. 중국의 안전보장이사회 진입과 소련의 복귀로 인해 심의가 방해될 수 있다는 우려 때문에 이사회의 완전한 대표적 성격을 회복시키지 말아야 한다는 주장은, 내가 이미 설명한 이유 때문에, 받아들여서는 안 됩니다. 북한군의 38선 복귀 같은 조건을 모스크바나 베이핑이 사전에 이행할 것을 고집하는 것은 서방 열강이 평화적 해결을 바라지 않는다는 증거로 쌍방이 주장할 수 있습니다. 반면, 중국과 소련이 이사회 진입 후 비합리적임이 드러나면, 세계 여론은 그 결과에 대한 책임을 그들에게 물을 것입니다. 베이핑 정부가 안전보장이사회에 들어가고 소련이 자리를 되찾도록 조건을 고집하지 않고 허용함으로써 한국 문제를 평화적으로 해결할 실질적 기회가 있으며, 모스크바가 위신 손상 없이 현재의 얽힘에서 빠져나올 길을 찾고 있다는 것이 나의 솔직한 믿음입니다. 이것은 신념의 행위일지 모르나, 대안들의 중대함이 이를 정당화해 주는 듯합니다. 사안의 긴급성에 비추어 가능한 한 가장 빠른 답변을 주시면 감사하겠습니다.\n\n드림〔이하 생략〕\n\n자와할랄 네루\n\n〔부속서 2〕\n\n스탈린 원수가 인도 총리에게 보내는 메시지 전문[주2]\n\n나는 귀하의 평화 구상을 환영합니다. 나는 중국 인민 정부를 포함한 5대 강국 대표들의 참여가 불가결하다는 전제 하에 안전보장이사회를 통한 한국 문제의 평화적 해결이 타당하다는 귀하의 견해에 전적으로 동의합니다. 나는 한국 문제의 조속한 해결에 도달하기 위해서는 안전보장이사회에서 한국인 대표들의 의견을 청취하는 것이 타당할 것이라고 생각합니다.\n\n경의를 표하며,\n\nJ. 스탈린\n\n소련 총리\n\n[409면]\n\n〔부속서 3〕\n\n인도 총리가 스탈린 원수에게 보내는 메시지 전문[주3]\n\n각하의 신속하고 고무적인 답신에 깊이 감사드립니다. 나는 즉시 관계된 다른 정부들과 연락하고 있으며, 조만간 다시 각하께 연락드릴 수 있기를 희망합니다.\n\n경의를 표하며,\n\n자와할랄 네루", "secondary": "Washington, July 17, 1950.\n\nMy Dear Mr. Secretary of State: I have the honour to enclose text of a message for you from the Prime Minister of India. Also enclosed is the text of Marshal Stalin’s message to the Prime Minister and his reply thereto.\n\nWith [etc.]\n\nVijaya Lakshmi Pandit\n\n[408면]\n\n[Enclosure 1]\n\nText of Message From Prime Minister of India to Hon’ble Dean Acheson, Secretary of State, United States of America\n\nI consider Marshal Stalin’s reply [주1] most encouraging. I have already explained why, in my opinion, the apprehension that the entry of China into the Security Council and return of Soviets may possibly lead to obstruction of proceedings should not be allowed to stand in the way of restoring to the Council its full representative character. Insistence on prior fulfilment by Moscow or Peiping of conditions such as return of North Korean forces to 38th parallel may be pleaded by both as evidence of lack of desire of the Western Powers for a peaceful settlement. On the other hand, if Soviets and China prove unreasonable after entry into the Council, world opinion will hold them responsible for consequences; My honest belief is that Moscow is seeking a way out of the present entanglement without loss of prestige and that there is a real chance of solving the Korean problem peacefully by enabling the Peiping Government to enter and Soviet Union to resume its place in the Security Council without insistence on conditions. This may be an act of faith but the gravity of alternatives seems to justify it. In view of urgency of the matter I shall be grateful for earliest possible answer.\n\nWith [etc.]\n\nJawaharlal Nehru\n\n[Enclosure 2]\n\nText of Message From Marshal Stalin to Prime Minister of India [주2]\n\nI welcome your peace initiative. I fully share your point of view as to the expediency of a peaceful settlement of the Korean question through the Security Council, the participation of the representatives of the Five Great Powers including the People’s Government of China being indispensible. I believe that to reach an early settlement of the Korean question it would be expedient in the Security Council to hear representatives of the Korean people.\n\nWith respects,\n\nJ. Stalin\n\nPrime Minister of Soviet Union\n\n[409면]\n\n[Enclosure 3]\n\nText of Message From Prime Minister of India to Marshal Stalin [주3]\n\nI am most grateful for Your Excellency’s prompt and encouraging response. I am communicating immediately with the other governments concerned and hope to be able to approach Your Excellency again soon.\n\nWith respects,\n\nJawaharlal Nehru", "notes": ["[주1] 아래의 부속서 2.", "[주2] 이 메시지는 7월 13일자 네루의 통신(7월 14일 모스크바 발 전보 124호 각주 2, 379면 참조)에 대한 답신으로 7월 16일 인도 정부에 접수되었다(7월 16일 뉴델리 발 전보 97호, 401면 참조).", "[주3] 위 부속서 2에 수록된 스탈린 대원수의 메시지에 대한 답신으로 7월 16일 소련 정부에 전달되었다."], "warn": false, "pages": ["50-408", "50-409"], "search": "판디트(Vijaya Lakshmi Pandit) 애치슨(Dean Acheson) 네루(Jawaharlal Nehru) 스탈린(J. Stalin)"}, {"id": "50-d326", "order": 15, "date": "1950-07-19", "group": "F", "eyebrow": "50-d326 · The President of the Republic of Korea (Rhee) to President Truman  The source text is the original of this letter as transmitted by Ambassador Muccio to Mr. Acheson tinder a covering note, not printed, on July 19; a copy of the text was also sent in telegram 60 from Taegu (not printed), July 19, which, however, was delayed in transmission and not received in the Department of State until July 23.", "title": "대한민국 대통령(이승만)이 트루먼 대통령에게", "badge": "restricted", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-07-19"}, {"k": "시각", "v": null}, {"k": "발신", "v": "이승만 대통령 (President Syngman Rhee)", "txt": true}, {"k": "수신", "v": "트루먼 대통령 (President Truman)", "txt": true}, {"k": "장소", "v": "Taegu"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "서한"}, {"k": "원문출처", "v": "795.00/7–1950", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d326"}], "summary": "이승만이 트루먼에게 미국의 지원에 감사하고 한반도 통일의 당위성과 한국군 증강 필요성을 호소함.", "points": ["미국의 신속하고 지속적인 원조와 트루먼의 용기 있는 지도력에 깊은 감사를 표함.", "미군 사상자에 대한 애도를 표하며, 그들의 희생이 한국의 자유를 위한 것이자 세계 시민으로서의 행위였음을 강조함.", "38선 분할은 한국인의 의사와 무관한 군사적 결정의 결과였으며, 북한은 소련의 지도 아래 만들어진 공산 정권임을 지적함.", "현 상황에서 원상회복(status quo ante)을 시도하는 것은 어리석은 일이며, 제국주의적 침략의 암 덩어리를 영원히 제거할 때가 왔음을 주장함.", "이 전쟁은 남북 간의 분쟁이 아니라 소수의 공산주의자와 압도적 다수의 한국 국민 사이의 분쟁임을 천명함.", "한반도 통일 미만의 결과는 있을 수 없으며, 한국 정부의 동의 없는 어떤 미래의 협정도 구속력이 없을 것이라는 입장을 명확히 함.", "충분한 병력과 물자가 도착하여 반격으로 전환해 승리의 북진을 시작할 수 있기를 기원한다고 밝힘."], "primary": "restricted\n\n[대구,] 1950년 7월 19일.\n\n친애하는 대통령 각하: 이 절망적인 시기에 귀하께서 한국에 원조를 제공하기 위해 신속하고도 지속적으로 취하신 조치에 대하여, 저 자신과 한국의 모든 국민과 정부를 대표하여 깊은 감사를 표할 길이 없습니다. 또한 자유의 대의이기도 한 한국의 대의에 대해 국제연합을 통해 그 많은 자유 국가들이 지지를 보내준 데 대해 깊이 감사하면서도, 우리는 이 어지러운 위기의 시기에 귀하의 용기 있는 지도력이 없었다면 그 어떤 지지도 원조도 없었을 것임을 너무나 잘 알고 있습니다.\n\n이곳에서 미군 전투 사상자가 증가하고 있다는 소식을 접하며 깊은 비통함을 느낍니다. 그 많은 이들이 고국에서 그토록 멀리 떨어진 이 땅에서 자유를 위해 목숨을 바쳐야 했다는 것은 비극적인 일입니다. 우리 군대가 조국에서, 조국을 위해 싸우고 있기에, 아무리 잔혹하다 해도 우리 자신의 전투 사상자 소식을 접하는 편이 귀국의 사상자 소식을 듣는 것보다 견디기 쉽습니다. 이곳 한국에서 전사하거나 부상당한 미군 병사의 모든 어머니와 아버지, 아내와 자녀, 그리고 형제자매에게, 미국의 위대한 전통 속에서 잔혹한 침략자에 맞서 약자를 수호하러 와서 자유와 자유가 이 지상에서 사라지지 않도록 싸우고 생명의 피를 바친 이들의 용기와 희생을 한국인은 결코 잊을 수 없으리라는 사실을 조금이라도 위로가 되도록 전할 수 있기를 바랍니다. 대통령 각하, 위대한 조국의 이 군인들은 미국인으로서 살고 죽었으나, 그들은 조국에 대한 사랑을 넘어 세계 시민으로서 목숨을 바쳤습니다. 공산 나치(Comminazis)가 자유 국가들의 독립을 더 파괴하도록 내버려 두는 것이 모든 국가, 심지어 미국 자체에 대한 공격의 길을 열어주는 것임을 알았기 때문입니다.\n\n[429면]\n\n아시다시피, 한국 민족은 자신들의 의사에 반하여 분단되었습니다. 이는 한국인은 전혀 관여하지 않은 1945년의 38선에 관한 군사적 결정의 결과였습니다. 이 분단으로 인해 북쪽에서는 소련의 지도와 지휘 아래 한국의 전통과 정서에 완전히 이질적인 공산 정권이 발달할 수 있었습니다. 그 지역의 군사, 경찰, 재정 권력을 완전히 장악한 공산주의자들은 소련의 지도를 받아 한국뿐 아니라 미국과 대부분의 국제연합 회원국에 그토록 잔혹한 피해를 입힌 무시무시한 군대를 창설할 수 있었습니다. 소련이 후원하는 북한 정권이 6월 25일 이른 아침에 대한민국 방위군을 일제히 공격했을 때, 그들은 자유 한국과 예속 한국 사이의 정치적·군사적 분할선으로서 38선을 유지하겠다는 그 어떤 주장도 종결시켜 버렸습니다.\n\n원상회복을 시도한 후, 적이 재편성·재훈련·재무장할 시간을 가졌을 때 그들의 기분에 따라 추가 공격을 기다리는 것은 완전히 어리석은 일일 것입니다. 제국주의적 침략이라는 암 덩어리, 곧 세계 공산주의자들이 우리 조국의 품 안에서 인위적으로 키운 악성 종양을 단번에 영원히 도려낼 때가 왔습니다.\n\n북한 주민들은 남한 주민들과 동일한 민족입니다. 외국에서 훈련받고 외국의 지도를 받는 극소수의 예외를 제외하고는 모두 태어난 땅에 충성합니다. 이 전쟁은 남과 북 사이의 분쟁이 아닙니다. 이 전쟁은 우연히 우리나라 절반을 장악하게 된 소수의 공산주의자들과, 그들이 어디에 살든 압도적 다수의 한국 국민 사이의 분쟁입니다.\n\n대한민국 정부와 국민은 지금이 한국을 통일해야 할 때라고 생각하며, 이 위대한 한국인들과 그들의 강력한 우방들의 희생으로 통일 미만의 결과가 나오는 것은 상상할 수도 없는 일입니다. 대통령 각하께서도 스스로 같은 결론에 도달하셨으리라 확신합니다만, 저는 이 정부의 입장을 귀하께 분명히 밝히고자 합니다. 한국 정부는 다른 국가나 국가 집단이 대한민국 정부의 동의와 승인 없이 한국에 관해 맺은 미래의 어떤 협정이나 양해도 구속력이 없는 것으로 간주할 것입니다. 귀하께서 최근 발표하신 성명들로 미루어 볼 때, 저는 이것이 미국 정부의 입장이기도 하다고 믿습니다.\n\n저는 매일 우리 군대의 공동 승리와, 미 공군 전투기들이 적을 찾아내어 파괴할 수 있도록 맑은 하늘과, 우리가 공세로 전환하여 단단한 [430면] 적군의 외피를 돌파하고 승리의 북진을 시작할 수 있도록 가능한 한 조속히 충분한 병력과 물자가 도착하기를 기도합니다. 저는 우리 대의의 궁극적 승리에 추호의 의심도 없습니다. 저는 정의(right)도 힘(might)도 모두 우리 편에 있음을 알고 있습니다. [주2]\n\n계속하여 변함없이 따뜻한 개인적 인사를 드리며,\n\n진심을 다하여,\n\n이승만\n\n----- 각주 -----\n[주1] 원문은 무초 대사가 7월 19일 애치슨 국무장관에게 보낸 비인쇄 설명 각서와 함께 송부한 이 서한의 원본이다. 또한 대구에서 발송된 59호 전문(7월 19일, 비인쇄)으로도 전문 사본이 송부되었으나, 이는 전송이 지연되어 7월 23일에야 국무부에 접수되었다.\n[주2] 트루먼 대통령의 답신은 8월 10일 대구행 68호 전문, 553쪽을 참조하라.", "secondary": "restricted\n\n[Taegu,] July 19, 1950.\n\nDear Mr. President: I can not find words to express, for myself and for all the people and Government of Korea, our profound gratitude for your prompt and continued actions in bringing aid to Korea in these desperate days. While we deeply appreciate the support of so many free nations, through the United Nations, to the cause of Korea, which also is the cause of freedom, we know full well that without your courageous leadership in a time of bewildering crisis there would have been no support and no aid.\n\nI am deeply moved as I learn of increasing American battle casualties here. It is a tragic thing that so many men should have had to give their lives for liberty in this land so far from their own. It is easier for me to accept word of our own battle casualties than of yours, cruel as ours have been, since our forces are fighting in and for their native land. I wish I could convey to every mother and father and wife and child, and sister and brother of an American soldier killed or wounded here in Korea even some slight comfort through the knowledge that no Korean can ever forget the courage and sacrifice of these men who in the great traditions of the United States of America have come to the defense of the weak against the cruel aggressor, and have fought and given their life’s blood that liberty and freedom should not perish from the earth. These soldiers of your great country, Mr. President, have lived and died as Americans, but they have given their lives even beyond love of country as citizens of the world, knowing that to permit the further destruction of the independence of free nations by the Comminazis is to clear the way to assault upon every nation, even the United States itself.\n\n[429면]\n\nAs you know, the Korean people were divided against their will: as a result of military decisions in 1945 regarding the 38th Parallel, to which no Korean was a party. This division permitted the development in the north, under Soviet direction and leadership, of a communist regime wholly alien to Korean traditions and feelings. With absolute control of the military, police and fiscal powers in that region of Korea, the communists, with Soviet direction, were able to create the formidable force which has caused such cruel damage not only to Korea but also to the United States and most members of the United Nations. When the Soviet sponsored regime in North Korea simultaneously attacked the defense forces of the Republic of Korea in the early morning of June 25, they ended any possible claim to the maintenance of the 38th Parallel as a political or military dividing line between free and slave Korea.\n\nIt would be utter folly to attempt to restore the status quo ante, and then to await the enemy’s pleasure for further attack when he had had time to regroup, retrain and reequip. The time has come to cut out once and for all the cancer of imperialist aggression, the malignant growth artificially grown within the bosom of our country by the world communists.\n\nThe people of North Korea are the same as the people of South Korea. All are loyal to the land of their birth with the very few minor exceptions of foreign trained and foreign directed communists. This war is not a conflict between North and South; it is a conflict between the few who are communists, who by an accident got control of half of our country, and the overwhelming mass of the citizens of Korea, wherever they may live.\n\nThe Government and the people of the Republic of Korea consider this is the time to unify Korea, and for anything less than unification to come out of these great sacrifices of Koreans and their powerful allies would be unthinkable. I am sure, Mr. President, that you have come to the same conclusion yourself, but I wish to make clear to you the position of this Government. The Korean Government would consider as without binding effect any future agreement or understanding made regarding Korea by other states or groups of states without the consent and approval of the Government of the Republic of Korea. From statements which you have made recently I believe that this also is the position of the Government of the United States.\n\nDaily I pray for the joint success of our arms, for clear skies so that the planes of the United States Airforce may search out and destroy the enemy, and for the earliest possible arrival of sufficient men and material so that we can turn to the offensive, break through the hard [430면] crust of enemy forces and start the victorious march north. I have no slightest doubt in the ultimate victory of our cause; I know that both right and might are on our side. [주2]\n\nWith ever continued warm personal regards,\n\nSincerely yours,\n\nSyngman Rhee", "notes": ["\"Comminazis\"는 당시 공산주의자와 나치를 결합한 조어로, 이승만이 직접 사용한 표현이다. 원문의 \"communists\"와 구별되는 정치적 수사이므로 그대로 음차하여 병기했다.", "\"right\"과 \"might\"의 대비는 영어 원문의 두운을 살린 표현이다. 한국어로 명확히 구분하여 번역했다."], "warn": false, "pages": ["50-429", "50-430"], "search": "이승만(李承晩, Syngman Rhee) 트루먼 (Harry S. Truman) 무초 (John J. Muccio) 애치슨 (Dean Acheson)"}, {"id": "50-d361", "order": 16, "date": "1950-07-27", "group": "C", "eyebrow": "50-d361 · Memorandum by the Director of the Office of Northeast Asian Affairs (Allison) to the Assistant Secretary of State for Far Eastern Affairs (Rusk)", "title": "동북아시아국장(앨리슨)이 극동담당 차관보(러스크)에게 보낸 각서", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-07-27"}, {"k": "시각", "v": null}, {"k": "발신", "v": "John M. Allison 앨리슨(Allison), 동북아시아국장", "txt": true}, {"k": "수신", "v": "Dean Rusk 러스크(Rusk), 극동담당 차관보", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "795.00/7–2750", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d361"}], "summary": "38선 이북 진격에 관한 정책기획실 문서에 대한 수정 의견. 분석 부분을 고쳐야 하지만 결론·권고는 현재로서 합리적인 선까지 나아갔다고 본다.", "points": ["정책기획실 문서가 이전 초안보다 낫고, 사소한 수정만 하면 FE가 지지할 수 있다.", "5쪽 13항의 첫 문장에서 'The possibility cannot be ignored that there might…'로 바꾸어야 한다. 현행 문구는 편향된 시각을 준다.", "16항에서 소련 위성국의 불만이 '있을 수 있다'가 아니라 '이미 드러나기 시작하고 있다'로 고쳐야 한다.", "결론·권고는 개인적으로 바라는 만큼까지는 가지 않았지만 현재 합리적으로 기대할 수 있는 선까지는 갔다.", "이 문서는 '북한에 대한 향후 미국 정책'을 검토하라는 대통령의 요청을 완전히 충족하지 못한다. 38선 문제만이 전부가 아니다.", "차관보 회의에서 FE는 이 문서에 동의하지만, 보다 넓은 한국 정책 연구가 계속되어야 한다는 점을 지적해야 한다."], "primary": "비밀\n\n[워싱턴,] 1950년 7월 27일\n\n건명: 7월 28일 차관 주재 회의에서 논의될 정책기획실 한국 문제 문서 [주1] [주2]\n\n어제 말씀드렸듯이, 38선 이북으로의 진격과 관련한 미국의 정책이 무엇이어야 하는지에 대한 현 정책기획실 문서는 이전 초안들보다 훨씬 낫고, 극동국(FE)으로서도 사소한 수정만 거치면 지지할 수 있다고 생각합니다. 제가 제안하는 이 수정 사항들은 결론·권고 부분이 아니라 문서의 분석 부분에 관한 것입니다.\n\n저는 5쪽의 13항이 현재 상태로는 편향된 시각을 제시하고 있다고 보며, 이 항의 첫 문장 첫 세 단어를 삭제하고 다음 문구로 대체할 것을 제안합니다: “다음과 같은 가능성을 배제할 수 없다… (The possibility cannot be ignored that there might…)”\n\n14항에는 5쪽 아래에서 세 번째 줄의 “모든(every)” 다음에 “합리적인(reasonable)”이라는 단어를 삽입할 것을 제안합니다.\n\n\\[481면] 16항에 대해서는 제가 진실한 상황이라고 믿는 바에 부합하도록 다음과 같은 수정을 제안합니다. 16항 두 번째 줄에서 “있을 수도 있다(might be)”라는 단어들을 삭제하고 그 자리에 “이미 드러나기 시작하고 있다(is already beginning to show)”를 삽입한 다음, 뒤따르는 단어 “불만인(dissatisfied)”을 “불만(dissatisfaction)”으로 바꾸십시오. 16항 두 번째 문장에서는 네 번째 단어인 “~일 수도 있다(might)”를 삭제하고 “충분히 ~일 수 있다(may well)”로 대체하십시오.\n\n결론·권고는 괜찮다고 생각합니다. 제가 개인적으로 바라는 만큼까지 나아가지는 않았지만, 그럼에도 불구하고 현재로서 합리적으로 기대할 수 있는 한도까지는 나아갔다고 봅니다.\n\n제 의견으로는 현 문서가 대통령의 요청, 즉 국가안전보장회의가 대통령의 검토를 위해 “북한에 대한 향후 미국 정책”에 관한 보고서를 준비해야 한다는 요청을 완전히 충족시키지 못하고 있습니다. 북한군이 38선으로 밀려난 후 추구해야 할 정책에 특별히 주의가 환기된 것은 사실이지만, 문제는 그것만이 전부가 아닙니다. 차관 주재 회의에서 귀하께서는 FE가 현 문서에 동의하기는 하지만 그럼에도 불구하고 향후 대한(對韓) 정책의 전체 문제에 대한 연구가 계속되어야 한다고 느끼며, 이보다 넓은 문제에 관해서는 지난 월요일에 귀하께서 관련 각 부서에 발송한 각서에 따라 FE가 계속하여 실행 책임을 지게 될 것임을 귀하께서 이해하고 계심을 지적하실 것을 제안합니다. [주3]", "secondary": "top secret\n\n[Washington,] July 27, 1950.\n\nSubject: Policy Planning Staff Paper on Korea [주1] to be Discussed at Under Secretary’s Meeting, July 28. [주2]\n\nAs I mentioned to you yesterday, the present Policy Planning Staff paper on the problem of what US policy should be regarding advance beyond the 38th parallel is much better than previous drafts and I believe can be supported by FE with only minor changes. These changes which I suggest are in the Analysis part of the paper rather than in the Conclusions and Recommendations.\n\nI believe that paragraph 13 on page 5, as it now stands, gives a slanted view of the situation and I suggest that the first three words of the first sentence of this paragraph be eliminated and that the following words be substituted: “The possibility cannot be ignored that there might…”\n\nIt is suggested that in paragraph 14 the word “reasonable” be inserted in the third line from the bottom of page 5 after the word “every”.\n\nThe following changes are suggested in paragraph 16 in order to bring it into line with what I believe to be the true situation. In the second line of paragraph 16, cross out the words “might be” and insert [481면] instead “is already beginning to show” and then change the next word from “dissatisfied” to “dissatisfaction”. In the second sentence of paragraph 16, cross out the fourth word, “might”, and substitute “may well”.\n\nI believe the Conclusions and Recommendations are all right and, while they do not go as far as I personally would like, nevertheless I believe they do go as far as we can reasonably expect at the present time.\n\nThe present paper does not, in my opinion, entirely comply with the President’s request, which was that the National Security Council should prepare for his consideration a report on the “Future United States Policy with Respect to North Korea”. While it is true that special attention was called to the policy to be pursued after the North Korean forces had been driven back to the 38th parallel, there is much more to the problem than just that. It is suggested that you point out at the Under Secretary’s Meeting that, while FE goes along with the present paper, it nevertheless feels that continued studies should be made on the whole question of future US policy toward Korea and that on this broader question you understand that FE will continue to have action responsibility in accordance with the memorandum you sent out last Monday to the various Offices concerned. [주3]", "notes": ["[주1] 7월 25일자 각서 초안, 469면 참조.", "[주2] 하문, 486면.", "[주3] 앨리슨이 북한에 대한 향후 미국 정책에 관한 국무부 연구의 조정 담당관으로 지명된, 인쇄되지 않은 러스크의 7월 22일(토요일)자 각서를 가리킨다(795.00/7–2250)."], "warn": false, "pages": ["50-481"], "search": "John M. Allison 앨리슨 Dean Rusk 러스크"}, {"id": "50-d377", "order": 17, "date": "1950-07-30", "group": "E", "eyebrow": "50-d377 · The Prime Minister of India (Nehru) to the Secretary of State", "title": "인도 총리(네루)가 국무장관에게", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-07-30"}, {"k": "시각", "v": null}, {"k": "발신", "v": "네루(Jawaharlal Nehru), 인도 총리", "txt": true}, {"k": "수신", "v": "애치슨(Dean Acheson), 국무장관", "txt": true}, {"k": "장소", "v": "New Delhi"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "서한"}, {"k": "원문출처", "v": "795.00/7–3050", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d377"}], "summary": "네루가 중국 대표권 문제와 한국 사태 수습을 위한 인도의 외교적 노력을 설명하며 미국과의 협력 의지를 재확인한다.", "points": ["네루는 애치슨의 솔직한 서한에 감사하며, 엄격히 개인적이고 비밀인 기반 위에서 답신한다고 전제한다.", "중국 인민정부 승인 문제에 대해, 인도는 공산주의나 그 정책을 승인해서가 아니라 중국 대륙에 대한 실질적 통치 권한이라는 사실과 동남아시아 대중의 심리에 기초해 승인했다고 설명한다.", "동남아시아에서는 민족주의와 식민 통치 간의 정치적 갈등 속에 공산주의가 민족주의와 결탁하고 있으며, 토지 개혁이 절실한 농업 국가들에서는 그러한 개혁을 실행하는 정권이 호소력을 지닌다고 진단한다.", "중국 승인 거부는 4억 5천만 인구를 유엔 밖에 두는 결과를 초래하며, 이는 유엔의 대표성을 훼손하고 세계 평화 유지에 반한다는 확신에서 안전보장이사회 참여를 지속적으로 지지해왔다고 밝힌다.", "중국이 인도가 보기에 침략 행위를 저지를 경우 북한에 취한 것과 동일한 태도를 취할 것이지만, 현재 판단으로는 신중국이 전쟁의 위험을 감수하기보다 경제·사회 재건을 위한 평화 노선을 택할 가능성에 무게를 둔다.", "인도는 이미 북경 주재 대사에게 트루먼 대통령의 대만 관련 성명을 전달했고, 무력 충돌 지역 확대를 피하도록 중국을 설득하는 노력을 지속할 것임을 약속한다.", "북경 정권에 대한 견해 차이에도 불구하고, 한국의 적대 행위를 종식하고 세계의 항구적 평화를 확보하려는 인도의 대미 협력 열망에는 변함이 없다고 강조한다."], "primary": "top secret\n\n[뉴델리, 1950년 7월 30일. [주1] ]\n\n친애하는 국무장관님, 뉴델리 주재 귀국 대사를 통해 7월 26일 저에게 전달된 서한에 깊이 감사드립니다. [주2]\n\n2. 긴급하고 염려스러운 용무가 산적한 와중에 시간을 내어 그처럼 상세히 [500면] 써주신 데 대해 진심으로 감사드리며, 솔직하게 써주신 데 또한 기쁘게 생각합니다. 그것은 우리가 비록 항상 의견을 같이하지는 못할지라도 오직 그러한 토대 위에서만 서로를 이해할 수 있기 때문입니다.\n\n3. 귀하의 서한에서 비롯된 두 가지 점에 대해서만 다소 상세히 살피는 것이 바람직하다고 생각하며, 귀하 자신의 표현을 빌자면 “엄격히 개인적이고 비밀인 기반 위에서” 그리하고자 합니다.\n\n4. 첫째는 중국 인민정부에 관한 것입니다. 귀하는 작년에 이 정부의 승인 문제를 두고 우리가 나눈 대화를 언급하셨습니다. 저는 당시 저희 관점을 설명드렸고, 제가 말씀드린 바를 요약하는 것이 의미 있다고 생각합니다.\n\n저희의 승인은 공산주의나 북경 정부의 모든 정책에 대한 찬동에 기초한 것이 아닙니다. 그것은 중국의 압도적 대부분을 차지하는 중국 대륙에 대한 통치 권한이라는 사실에 관한 저희 견해, 그리고 동남아시아 대다수 민중의 심리에 대한 저희 평가에 부합하는 것입니다. 혁명의 과정이 이들 국가 대부분—인도네시아, 인도차이나, 말라야, 버마가 이에 대한 풍부한 증거를 제시합니다—에서 진행 중입니다. 이는 정치적이며 동시에 경제적입니다. 넓게 보아 정치적 갈등은 민족주의의 충동과 식민 통치 사이의 갈등입니다. 공산주의자들은 특히 식민주의가 민족주의적 염원에 완강히 저항해온 나라들에서 민족주의 안에서 동맹자를 찾았습니다. 공산주의 전체주의의 정치적 해악은 지금까지 이 동맹에 장애가 되지 않았으며, 외국 지배로부터의 자유를 향한 민중의 자연스러운 갈망이 충족되지 않는 한 앞으로도 장애가 되지 않을 공산이 큽니다. 나아가 제가 언급한 모든 나라가 압도적으로 농업 경제에 기초하고 있으며 토지 개혁이 절실한 요구인 만큼, 그러한 개혁을 성공적으로 수행하는 어떤 정권이든 공감을 불러일으키기 마련입니다. 저희는 중국 인민정부에 대한 승인을 보류하는 것이 이들 대단히 중요한 고려 사항들을 외면하는 것이며, 우리와—역사적이고 거의 태곳적이라 할 우정을 가진—중국 사이뿐 아니라 현재 자신들의 자유를 위해 투쟁하고 있는 동남아시아의 민중들과 인도 사이에도 간극을 만들어낸다고 느꼈습니다. 우리의 지정학적 위치와 처지에 비추어, 신중국의 승인은 불가피했을 뿐 아니라 절박했습니다. 안전보장이사회에 중국을 참여시키기 위한 저희의 최근 노력—이미 귀하께 설명드렸듯이 지난 6개월 남짓 일관되고 확산되어온 노력—은 그러한 조치가 유엔을 대표성 있는 기구로 보존하고 세계 평화를 유지하는 데 필수적이라는 진실한 확신에서 비롯된 것입니다. 4억 5천만 인구의 국가가 그 기구 밖에 남아 있는 한, 그 기구를 완전히 대표성을 갖춘 것으로 간주할 수 없다는 점에 [501면] 귀하께서 동의하시리라 생각합니다. 이러한 견해는 중국에 의한 것이든 어느 다른 국가에 의한 것이든 침략을 묵인하는 것과는 전혀 무관합니다. 중국이 저희 의견으로 침략에 해당하는 행위에 나설 경우, 저희는 북한에 대해 취했던 것과 동일한 태도를 중국에 대해서도 주저 없이 취할 것입니다. 북경 주재 저희 대사로부터 받은 보고들은, 기회가 주어진다면 신중국은 스스로의 의지로든 타인의 요구에 의해서든 전쟁의 위험을 무릅쓰기보다는 자국의 경제·사회 재건에 그토록 긴요한 평화를 위해 자신만의 노선을 취하고 이를 위해 노력할 것이라는 결론으로 저를 이끌었습니다. 그러나 무슨 이유에서든 그녀가 국제공동체 밖에 머물도록 방치된다면 그러한 기회는 좀처럼 오지 않을 것입니다. 저는 귀하의 정보 출처에 감히 이의를 제기할 생각은 없지만, 자연스럽게도 저 자신의 출처에 따라야만 합니다.\n\n5. 둘째 사항은 귀하께서 포르모사에 관한 대통령의 성명을 북경 주재 저희 대사에게 알리고 당국이 한국 사태에 개입하거나 포르모사에 대한 공격을 피하도록 설득하는 저희의 노력을 지속해 달라고 요청하신 부분입니다. 포르모사에 관한 대통령의 성명은 워싱턴 주재 저희 대사를 통해 입수하는 즉시 북경 주재 저희 대사에게 전달되었습니다. 파니카르 대사는 한국 분쟁이 시작된 지 며칠 지나지 않아 무력 충돌 지역을 확대할 수 있는 행동을 피하는 것이 세계 평화를 위해 필수적이라는 점을 중국 인민정부에 강조하도록 지시받았습니다. 저희가 이 노력을 지속하리라는 점을 확신하셔도 됩니다.\n\n6. 결론적으로, 북경 정권에 대한 저희의 관점 차이가 한국의 적대 행위를 종식하고 세계의 항구적 평화를 확보하기 위한 양국 간의 협력에 대한 저희의 열망을 조금도 훼손하지 않음을 알아주시기 바랍니다. [주3]\n\n(서명 생략)\n\nJawaharlal Nehru", "secondary": "top secret\n\n[New Delhi, July 30, 1950. [주1] ]\n\nMy Dear Mr. Secretary of State, Very many thanks for your letter which was conveyed to me on the 26th July by your Ambassador in New Delhi. [주2]\n\n2. It was indeed good of you to have found time, in the midst of your urgent and anxious preoccupations to write to me so fully, I [500면] am also happy that you have written frankly, because it is only on this basis that we can understand each other, even though we may not always agree.\n\n3. There are only two points, arising out of your letter, on which I think it desirable to dwell in some detail, and I shall do so, to quote your own words “on a strictly personal and confidential basis.”\n\n4. The first relates to the People’s Government of China. You have referred to our conversations last year on the subject of the recognition of this Government. I explained to you then our point of view, and I think it worth while to recapitulate what I said.\n\nOur recognition is not based either on approval of Communism or all the policies of the Peiping Government; it conforms to our views of the facts of authority over Continental China, which is far the greater part of China, and to our appraisal of the psychology of the majority of the peoples of Southeast Asia. A process of revolution is at work in most of these countries; Indonesia, Indo-China, Malaya and Burma offer abundant proof of this. It is both political and economical. In broad terms the political conflict is one between the urge of nationalism and Colonial rule. Communists have found an ally in nationalism especially in those countries where the resistance of Colonialism to nationalist aspirations has proved obdurate. The political evil of Communist totalitarianism has not proved an obstacle to this alliance so far nor is it likely to prove so in future as long as a people’s natural longing for freedom from foreign domination is not satisfied. Moreover since all the countries that I have mentioned have a predominantly agricultural economy and land reform is their crying need, any regime which carries out such reforms successfully is bound to make a sympathetic appeal. We felt withholding of recognition from the People’s Government of China would be to ignore these highly important considerations and to create a gulf not only between ourselves and China with whom we have a historical, almost immemorial, friendship but also misunderstanding between India and the peoples of Southeast Asia who are now struggling for their freedom. For us, situated as we are, and where we are, the recognition of the New China was not only inevitable but urgent. Our latest effort to seat China in the Security Council, an effort which, as I have already explained to you has been consistent and spreading over the last six months or so was prompted by the honest conviction that such a step was necessary to preserve the United Nations as a representative organisation and to maintain world peace. I think you will agree that so long as a nation of 450 million people remains outside the organisation, the organisation cannot be regarded as fully representative. [501면] This view has nothing to do with the condonation of aggression whether by China or by any other country. Were China to resort to acts which in our opinion constitute aggression we should not hesitate to adopt the same attitude towards China as we have towards North Korea. The reports that we have received from our Ambassador in Peiping have led me to the conclusion that given the chance the New China will take a line of its own and work for peace so vital to its economic and social reconstruction rather than try the hazards of war, of its own will or at someone else’s behest. But that chance can scarcely come if she is for whatever reasons kept out of the Community of Nations. I do not presume to challenge your sources of information but quite naturally have to be guided by my own.\n\n5. My second point deals with your request to apprise our Ambassador in Peiping of the President’s statement with respect to Formosa and to continue our endeavour to persuade authorities there that they avoid intervention in the Korean situation or an attack on Formosa. The President’s statement about Formosa was repeated to our Ambassador in Peiping as soon as we received it from our Ambassador in Washington. Mr. Panikkar was advised in the first few days after the conflict in Korea started to impress upon the People’s Government of China the necessity in the interests of world peace of avoiding action that might extend the area of armed conflict. You may rest assured that we shall persist in this endeavour.\n\n6. In conclusion I should like you to know that the divergence of our views on the Peiping regime detracts in no way from our desire for cooperation between our two countries to terminate the hostilities in Korea and to ensure for the world lasting peace. [주3]\n\nWith [etc.]\n\nJawaharlal Nehru", "notes": ["[주1] 인도 대사(판디트)가 7월 30일자 공한(미인쇄)에 첨부하여 국무장관에게 전달함.", "[주2] 7월 27일 오전 4시 17분 접수된 뉴델리발 제210호 전보(478면) 참조.", "[주3] 7월 31일, 애치슨 장관은 트루먼 대통령을 만나 네루의 메시지와 관련된 대화 내용을 다음과 같이 간략히 기록으로 남겼다: “나는 네루가 내게 보낸 마지막 공한에 대해 대통령께 보고하였으며, 대통령은 이 공한이 네루의 견해가 올바른 방향으로 발전하고 있음을 보여준다고 생각하였다.” (795.00/7–3150)"], "warn": false, "pages": ["50-500", "50-501"], "search": "네루(Jawaharlal Nehru) 애치슨(Dean Acheson) 트루먼(Harry S. Truman) 파니카르(K. M. Panikkar)"}, {"id": "50-d398", "order": 18, "date": "1950-08-07", "group": "A", "eyebrow": "50-d398 · Memorandum of Conversation, by Mr. W. Averell Harriman, Special Assistant to the President", "title": "해리먼 대통령 특별보좌관의 대화 비망록", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-08-07"}, {"k": "시각", "v": null}, {"k": "발신", "v": "W. Averell Harriman 해리먼(대통령 특별보좌관)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "장소", "v": "Taegu"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "회담 비망록"}, {"k": "원문출처", "v": "795.00/8–750", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d398"}], "summary": "해리먼이 대구에서 무초 대사를 만나 한국군의 사기, 정부의 동향, 후방 상황을 전해 듣는다.", "points": ["무초는 트루먼 대통령에게 존경을 표할 뿐 따로 요청은 없다고 말한다.", "한국군은 개전 초기 탱크와 중화기에 밀렸을 때도 잘 싸웠고 항복한 부대는 없다.", "이승만은 전황에 따라 기복이 심하다.", "남한 주민들은 선적, 철도 운행, 치안 유지에 전폭 협력하며 대규모 파괴공작은 없었다.", "미군기가 서울 상공에 나타날 때마다 환호성이 들렸고, 100만 명이 아군과 함께 남하했다.", "적진 후방에 잔류한 한국 경찰 일부가 게릴라 활동을 하고 있다.", "부산의 미군 방송은 출력이 약해 개선이 필요하다."], "primary": "**[발췌]**\n\n나는 워커 장군 사령부에서 무초를 만났다. 나는 무초가 원하는 바가 있을지도 모른다는 생각에 그가 대통령께 전하고 싶은 말이 있는지 물었다. 그는 “대통령께서 취하신 입장에 대하여 내가 얼마나 큰 존경심을 가지고 있는지 말씀드려 달라”고 답했다. 그가 원하는 것은 없었다. 그는 남한이 우리에게 보여준 강한 지지를 설명했다. 그들의 군대는 탱크에 돌파당하고 중화기에 압도된 초기 공세 때조차 잘 싸웠다. 중대 단위까지도 항복한 한국군 부대는 없었다. 군의 사기는 좋았고 [528면] 잘 싸우고 있었다. 정부의 사기는 더 나았으나 이승만은 변덕스러워 전황의 맥박에 따라 기복이 있었다. 남한 국민들은 우리에게 전폭적인 지원을 하고 있는데, 우리 배에 짐을 싣고 철도를 운영하고 있으며 남한 경찰은 질서를 유지하고 있었다. 북측으로부터의 공산주의자 침투에도 불구하고 주요 파괴공작 행위는 발생하지 않았으며, 우리 비행기가 올 때마다 서울에서 환호성이 들렸다는 보고도 있다. 100만 명의 한국인들이 우리 군대와 함께 돌아왔다. 승리한다면 모두가 그 대열에 올라탈 것이다. 선거가 공산주의자가 아닌 결과로 이어지리라는 데 그의 마음속에 의심의 여지는 없었다. 후방에 남아 있던 한국 경찰 일부는 적진 후방에서 게릴라 활동을 하고 있다. 무초는 삐라 문안을 도쿄로 보내고 라디오용 자료도 보낸다. 일부 좋은 성과가 있었으나 충분치는 않다. 무엇보다 가장 좋은 것은 좋은 전황 소식일 것이다. 부산에서의 우리 라디오 방송은 약한 반면, 북한군은 모든 강력한 라디오를 보유하고 있다. 그는 지금 부산에 더 나은 라디오 방송을 요청하고 있다. 무초에게는 약 10명의 참모가 있는데 모두 훌륭하고 건강도 좋다…", "secondary": "[Extract]\n\ntop secret\n\n[Taegu, August 7, 1950.]\n\nI saw Muccio at General Walker’s Headquarters. I asked him whether he wanted me to give the President any message, having in mind that there might be something that Muccio might want. He answered, “Tell him what great admiration I have for the stand that he has taken”. There was nothing he wanted. He explained the strong support the South Koreans had given us. Their armies had fought well, even during the first attack when they were over-run by tanks and overwhelmed by heavy artillery. No ROK unit had surrendered, even down to company. The morale of the Army was good, and they were [528면] fighting well. The morale of the Government was better, but Syngman Rhee was erratic, had his ups and down with the pulse of battle. The South Korean people were giving us full support, loading our ships, running the railroads, and South Korean police were maintaining order. No acts of major sabotage, in spite of Communist infiltration from the North, had occurred, and there were reports of cheering in Seoul whenever our planes came over. A million Koreans had come back with our troops. If there was victory, everyone would jump on the bandwagon. No doubt was in his mind as to the non-Communist outcome of an election. Some of the ROK police which had stayed behind were doing guerrilla work behind the enemy lines. Muccio sends texts for leaflets to Tokyo and data for radio. There has been some good work done, but not enough. The best thing of all would be good war news. Our radio is weak in Pusan, whereas the North Koreans have all the strong radios. He is now asking for a better radio in Pusan. Muccio has a staff of about 10, all of whom are good and their health is good…\n\n. . . . . . . . . . . . . .", "notes": ["원문 발췌 부분에 말줄임표로 생략된 부분이 표시되어 있다."], "warn": false, "pages": ["50-528"], "search": "W. Averell Harriman 해리먼 Muccio 무초(John J. Muccio) Walker 워커 Truman 트루먼 Syngman Rhee 이승만(李承晩)"}, {"id": "50-d425", "order": 19, "date": "1950-08-14", "group": "D", "eyebrow": "50-d425 · Memorandum by the Counselor (Kennan) to the Secretary of State", "title": "고문(케넌)이 국무장관에게 보낸 각서", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-08-14"}, {"k": "시각", "v": null}, {"k": "발신", "v": "Kennan 케넌(고문)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "795.00/8–1450", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d425"}], "summary": "케넌이 나진 폭격을 계기로 소련의 극동 전략적 이익을 침해하는 행위가 불러올 소련의 극단적 반응을 경고한다.", "points": ["케넌은 8월 8일 각서에서 소련이 한국 전역이 자국 국경에 근접한 것을 우려한다고 지적한 바 있다.", "8월 12일 B-29 편대가 소련 국경에서 17마일 떨어진 북한 항구 나진을 폭격했다.", "뉴욕 헤럴드 트리뷴의 도쿄발 기사는 나진이 소련의 극동 전략, 특히 잠수함 기지로서 중요하며, 이번 공격의 진짜 목적이 소련의 전략적 지위를 손상시키려는 것이라고 보도했다.", "폭격기의 속도와 구름 낀 날씨를 고려하면 소련 영공을 침범하거나 소련 쪽에 피해를 입혔을 가능성을 배제할 수 없다.", "이러한 행위는 소련이 보기에 미국이 한국전을 구실로 소련의 전략적 능력을 약화시키려 한다는 증거로 비칠 것이다.", "이로 인해 소련의 북한 재진입, 전략폭격기 운용, 혹은 주요 적대행위 개시 시점에 대한 소련의 계산 변화 등 극단적 반응에 대비해야 한다."], "primary": "top secret\n\n[워싱턴,] 1950년 8월 14일.\n\n이 각서는 현재의 소련 의도 패턴을 종합 정리한 8월 8일자 나의 각서를 보충하는 것이다. [주1]\n\n그 각서 5항에서 소련 지도자들이 한국에서의 작전이 자신들의 국경에 근접해 있다는 점과, 적대행위 지역의 확대로 그들의 군사적 이익에 상상할 수 있는 직접적 피해가 발생할 수 있다는 점에 대해 반드시 느끼고 있을 우려로 주의를 환기했음을 상기하실 것이다.\n\n[575면]\n\n그 각서 7항 (c)에서는 또한 남한에서의 적대행위로 인해 소련의 극동 군사 기구에 추가로 직접적인 손해가 발생한다면 소련군의 북한 재진입을 앞당길 수 있다고 지적한 바 있다.\n\n맥아더 장군 사령부의 8월 13일 발표에 따르면, 8월 12일 B-29 폭격기 편대 세 차례의 공습으로 북한 항구인 나진(Rashin)의 군사(해군 포함) 목표물이 공격받았다. 한 커뮤니케에서는 이곳을 소련 국경에서 불과 17마일 떨어진 곳으로 기술하고 있다. 한 커뮤니케에 따르면 이 공격은 짙은 구름을 뚫고 레이더 유도로 이루어졌으며, 500톤의 고성능 폭탄이 투하되었다.\n\n오늘 자 뉴욕 헤럴드 트리뷴 1면에 실린, 8월 13일 도쿄에서 발송된 앤설 E. 탤버트 기자의 기사가 내 눈에 들어왔다. 이 기사는 (a) 나진이 \"소련에 막대한 장래적 중요성을 지닌다\"고 말한다. (b) 소련 해군이 이곳을 잠수함 기지로 사용해 왔다. (c) 블라디보스토크와 다른 소련 극동 항구들은 연중 일부 기간 동안 결빙되는 반면 여순과 다롄은 잠수함 기지로서 입지가 좋지 않기 때문에, 이 점에서 나진이 소련에 특히 중요하다. (d) \"공식적으로는\" 이 공격이 한국 전선으로의 보급로를 차단하기 위해 기획되었지만, 실제로 그러한 보급품 대부분은 \"전투가 시작되기 전에 이미 나진을 통과한 것으로 믿어지며\", 원산과 청진 사이에서 같은 날 실시된 정찰 비행에서 \"구간 전체에 걸쳐 움직이는 보급 열차나 그 밖의 철도 교통이 단 하나도 발견되지 않았다……\"고 적고 있다. (수일 전부터 요청해 왔음에도 불구하고 우리는 국무부를 위해 맥아더 장군 사령부로부터 그러한 정찰 비행과 그 결과에 관해 어떤 정보도 얻을 수 없었다.)\n\n이 항공기들의 운항 속도와 구름 낀 날씨 속에서 폭격했다는 사실을 고려할 때, 그들이 소련 국경을 넘어 비행했을 뿐만 아니라 실제로 소련 쪽에 피해를 입혔을 가능성이 얼마나 쉬웠는지는 명백하다. 이와는 별개로, 이 지점이 블라디보스토크 항만 입구에서 100마일이 채 못 되는 거리이며, 소련 당국이 그 부근에서의 실제 폭격은 말할 것도 없고 어떤 정찰 활동에 대해서조차 병적으로 예민하다는 점을 기억해야 한다. 이에 더하여, 검열이 시행된다는 발표가 있고 난 3, 4일 후에 맥아더 장군 사령부가 넘긴 것으로 보이는 이 기사는 나진과 남한에서의 적대행위와의 관계는 우리 폭격의 구실에 불과했으며, 진짜 이유는 극동에서 소련의 전략적 지위에 손상을 가하려는 욕구였다는 점을 전적으로 분명하게 드러내고 있다.\n\n이러한 상황으로 인해 위에서 인용한 8월 8일자 나의 분석 중 해당 대목들의 중요성과 현실성이 급격히 높아졌다고 나는 믿는다. [576면] 우리 측의 이러한 행동에 비추어 볼 때—소련 당국에게는 남한에서의 적대행위를 그 지역에서 소련의 전략적 능력을 약화시키려는 목적으로 이용하려는 의도적 결정의 증거로밖에 보일 수 없는—우리는 8월 8일 내가 제시한 분석을 상당히 넘어서는, 따라서 그 분석과 완전히 일치하지는 않는 소련의 극단적 반응에 언제라도 대비해야 한다. 이 상황에 비추어, 소련군의 북한 재진입이 언제라도 일어날 수 있다. 또는 소련 정부가 명목상 전략폭격기를 북한 측에 넘겨주고 우리 군대와 일본 내 우리 기지에 대한 작전을 개시하는 것과 같은 다른 국지적 조치를 취할 수도 있다. 우리는 또한 이러한 증거가—그들에게는 한국전을 은폐물로 삼아 심각한 분규의 더욱 높아진 위험을 무릅쓰면서까지 그들의 전략적 이익에 손상을 가하려는 미국의 의도 증거로 비칠 수밖에 없는 이 증거가—주요 적대행위를 회피할 가능성, 그러한 적대행위의 예상 시기, 그리고 완전한 회피라는 계속된 희망에 기초한 관망 정책 대비 소련이 그러한 적대행위를 먼저 개시하는 것의 상대적 이점에 대한 그들의 판단에 자연히 영향을 미칠 가능성도 배제할 수 없다. [주2]\n\nGeorge F. Kennan", "secondary": "top secret\n\n[Washington,] August 14, 1950.\n\nThis memorandum is supplementary to my memorandum of August 8 containing a round-up of the present pattern of Soviet intentions. [주1]\n\nYou will recall that attention was drawn in paragraph five of that memo to the concern which the Soviet leaders must feel over the proximity of the operations in Korea to their own frontiers and over the direct damage which could conceivably be done to their military interests by an extension of the area of hostilities.\n\n[575면]\n\nIn paragraph 7(c) of that memo it was also pointed out that any further direct detriment to the Soviet military establishment in the Far East resulting from hostilities in South Korea might be expected to hasten a re-entry of the Bed Army into North Korea.\n\nAccording to releases from General MacArthur’s Headquarters of August 13, attacks were made August 12 by three sweeps of B–29 bombers on military (including naval) targets at Najin (Rashin), a North Korean port described in one communique as only 17 miles from the Soviet border. The attacks were made, one communique states, through heavy cloud cover, by radar guidance, and 500 tons of high explosives were dropped.\n\nThere has now come to my attention a front page story in today’s New York Herald Tribune by Ansel E. Talbert, despatched from Tokyo on August 13. This story states (a) that Rashin is “of tremendous future importance to the Soviet Union”; (b) that the Soviet Navy has been using it as a submarine base; (c) that it is particularly important to them in this respect because Vladivostok and other Soviet Far Eastern ports are ice-bound part of the year, whereas Port Arthur and Dairen are poorly situated as submarine bases; and (d) that although “officially” the attack was designed to interdict the flow of supplies to the front in Korea, actually most such supplies “are believed to have passed through Najin before the fighting began”, and reconnaissance flights conducted the same day between Wonsan and Seishin “disclosed not a single supply train or any other rail traffic moving along the entire stretch …” (Despite requests of several days’ standing we have been unable to get any information out of General MacArthur’s Headquarters for the Department about such reconnaissance flights and their results.)\n\nGiven the speed at which these planes operate, and the fact that they were bombing through an overcast, it is obvious how easily they could not only have overflown the Soviet frontier but actually have inflicted damage on the Soviet side of it. Aside from this, we must remember that this point is less than 100 miles from the entrance to the roadstead of Vladivostock and that the Soviet authorities are pathologically sensitive even to any reconnaissance activities, let alone actual bombings, in that vicinity. On top of this, we have the story apparently passed by General MacArthur’s Headquarters three or four days after the announcement that censorship had been imposed, making it entirely plain that the relationship of Rashin to the hostilities in South Korea was only a pretext for our bombing and that the real reason for it was the desire to injure the Soviet strategic position in the Far East.\n\nIt is my belief that this drastically heightens the importance and actuality of the passages in my analysis of August 8, cited above. In [576면] the light of this conduct on our part, which can only appear to the Soviet authorities as evidence of a deliberate decision to exploit the South Korean hostilities for the purpose of reducing Soviet strategic capabilities in the area, we must be prepared at any time for extreme Soviet reactions going considerably beyond, and therefore not fully in accordance with, the analysis I gave on August 8. In the light of this situation, it is entirely possible that a Soviet military re-entry into North Korea might occur at any time; or the Soviet Government might take other local measures, such as putting strategic bombing planes nominally at North Korean disposal, and beginning operations with them against our forces and our bases in Japan. We also cannot exclude the possibility that this evidence, as it must appear to them, of a United States intent to damage their strategic interests under cover of the Korean war, even at the price of greater heightened danger of serious complications, will naturally affect their estimate of the possibility of avoiding major hostilities, of the likely timing of such hostilities, and of the relative advantages of a Soviet initiation of such hostilities as opposed to a waiting policy based on the continued hope of avoiding them altogether. [주2]\n\nGeorge F. Kennan", "notes": ["[주1] 원문은 제1권 수록 예정.", "[주2] 이 문서의 사본이 8월 15일 매슈스 국무차보에 의해 번스 장군에게 송부되었는데, 번스 장군의 특별한 주의를 케넌 씨 각서의 마지막 문단으로 특히 환기시키는 첨부 메모가 딸려 있었다 (795.00/8–1550)."], "warn": false, "pages": ["50-575", "50-576"], "search": "Kennan 케넌 MacArthur 맥아더 Ansel E. Talbert 앤설 E. 탤버트 Matthews 매슈스 Burns 번스"}, {"id": "50-d445", "order": 20, "date": "1950-08-18", "group": "D", "eyebrow": "50-d445 · Memorandum Prepared in the Central Intelligence Agency", "title": "중앙정보국 작성 각서", "badge": "secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-08-18"}, {"k": "시각", "v": null}, {"k": "발신", "v": "중앙정보국(Central Intelligence Agency)", "txt": true}, {"k": "수신", "v": "국가안전보장회의(National Security Council)", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "795.00/8–1850", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d445"}], "summary": "유엔군의 북한 전역 군사 점령이 가져올 이득과 위험을 견준 CIA 판단서.", "points": ["북한 침공이 성공하면 소련에 대규모 외교적 패배를 안기고 유엔과 미국의 위신을 높이며 전략적 완충지를 제공한다.", "그러나 많은 비공산 유엔 회원국이 소련의 강력한 반격 위험 때문에 이 노선을 지지하지 않을 것이 거의 확실하다.", "중공군과의 교전 가능성이 있으며 소련은 이를 미국과 동맹국 사이를 갈라놓을 기회로 이용할 것이다.", "소련은 북한 침공을 극동 안보에 대한 전략적 위협으로 간주해 소련군과의 교전으로 이어질 수 있으며, 소련은 현재 총력전에 높은 준비 태세를 갖추고 있다.", "북한 점령이 한국의 평화나 진정한 통일을 보장하지 않으며, 이승만 정권의 인기 부족으로 인해 계속된 군사·경제 지원이 필요할 것이다."], "primary": "secret\n\n워싱턴, 1950년 8월 18일. [주1]\n\n제목: 유엔의 전(全)한국 군사 정복의 바람직함에 영향을 미치는 요인들\n\n결론\n\n유엔군의 북한 침공은 성공할 경우 미국에 여러 중요한 이점을 가져다줄 수 있지만, 현재로서는 그러한 행동 노선에 중대한 위험이 따를 것으로 보인다. 미국이 모든 비공산 유엔 회원국의 협력을 기대할 수 없고 중공군 및 소련군과의 교전에 휘말릴 수도 있기 때문에, 이 작전의 군사적 성공은 결코 보장되지 않는다. 더욱이 그러한 상황에서는 총력전이 발발할 중대한 위험이 있을 것이다.\n\n[601면]\n\n논의\n\n유엔군의 성공적인 북한 침공은 여러 중요한 이점을 가져올 수 있다:\n\n1.\n\n유엔군의 북한 정복은 소련에게 중대한 외교적 패배가 될 것이다. 이는 비공산권 세계 전체에 깊은 영향을 미칠 것이며 유럽과 아시아 위성국가들 모두의 반공주의자들에게 새로운 희망을 줄 것이다. 소련의 지배로부터 위성국 하나를 되찾는 것은 그 지리적 위치나 정치적 중요성과 무관하게 서방 세계의 결정적 승리가 될 것이다.\n\n2.\n\n유엔군이 거둔 군사적 승리는 유엔의 위신을 크게 높일 것이며 특히 유엔군의 주요 참가국으로서 미국에 위신을 가져다줄 것이다. 서유럽과 근동의 국가들은 유엔을 세계 평화를 위한 실질적 힘으로, 그리고 공산주의 침략을 저지하려는 미국의 결의와 능력을 더욱 신뢰하게 될 것이다.\n\n3.\n\n유엔의 한국 군사 정복은 소련으로부터 일본을 위협할 수 있는 전략적 전초기지를 빼앗을 뿐만 아니라 서방 열강에게 완충 지역과 공산주의 점령 영토로의 쐐기를 제공할 것이다.…\n\n4.\n\n38도선에서의 자의적인 한국 분단의 제거와 북한 정권의 축출은 한국의 경제적·정치적 통일을 가져올 기회를 제공할 것으로 보인다. 한국의 통일은 한국민의 염원, 미국의 공표된 정책, 그리고 유엔의 권고에 부합할 것이다.\n\n그러나 이러한 이점들에 더하여, 북한 침공은 미국에 다음과 같은 중대한 위험을 수반할 것이다:\n\n1.\n\n미국이 이러한 행동 노선에 대해 동맹국들과 유엔 내 기타 비소비에트 국가들의 지지를 확보할 수 있을지는 의문이다. 유엔의 많은 비공산 회원국들은 소련의 강력한 역공 위험을 수반하는 어떠한 행동에도 거의 확실히 반대할 것이다. 한국에서 미국과 함께 참전하고 있는 국가들은 한국에 깊이 개입되거나 그들을 총력전에 더 가까이 데려갈 수 있는 행동을 취하기를 원치 않는다. 그들은 아마도 유엔군이 북한 해방에 전념하도록 되어 있지 않으며 안전보장이사회의 결의가 북한 정복에 적절한 법적 근거를 제공하지 않는다는 입장을 취할 것이다. 결과적으로 미국의 행동은 소련에게 미국을 서유럽 동맹국들로부터 떼어놓으려는 시도를 할 수 있는 강력한 쐐기를 제공할 것이다. 그것은 또한 아시아 국가들, 특히 습관적으로 서방의 동기를 불신하는 인도에 심각한 반향을 일으킬 것이며, 많은 아시아인들에게 미국이 결국 아시아에서 사리 추구 정책을 펴는 침략 국가라는 확신을 줄 수도 있다.\n\n2.\n\n침공군이 중공군과의 교전에 휘말릴 수 있다. 북한군이 남한에서 패배하고 있음이 명백해짐에 따라 중국군은 38도선 이북에 방어 진지를 구축할 가능성이 충분히 있다. 미국과 중국 간의 교전 발발을 환영할지 모르는 소련은 [602면] 이렇게 해서 미국과 동맹국들 사이의 쐐기를 더욱 깊이 박을 추가 기회를 얻게 될 것이다. 소련은 전투의 어느 단계에서든 중공군을 이용할 수 있겠지만, 그들의 참가는 특히 유엔 회원국들이 미국의 정책에 대한 지지를 법적으로 중단할 수 있는 38도선에서 특별히 유용할 것이다.\n\n3.\n\n소련이 북한 침공을 소비에트 극동의 안전에 대한 전략적 위협으로 간주할 것이기 때문에, 침공군은 직·간접적으로 소련군과의 교전에 휘말릴 수 있다. 소련은 현재 총력전에 높은 준비 태세를 갖추고 있으며, 크렘린은 미국의 동원이 시작된 상황에서 소련이 지금이 훗날보다 미국과의 전면적인 힘의 시험에 더 잘 준비되어 있다고 계산할 가능성이 충분히 있다. 따라서 소련은 38도선에 소련군을 배치하고, 미국이 아시아 대부분을 한국에서의 미국-유엔의 대의로부터 멀어지게 할 조건하에 소련군에 대해 교전을 개시하도록 만들 수 있다. 이는 남한이 미국의 지도 아래 북한과 다른 평화 애호 민족들에게 침략을 개시했다는 선전 주제를 충분히 이용하도록 허용하고, 소련으로 하여금 미국의 산업 동원 효과가 그 지역들의 방어 능력에 느껴지기 전에 유럽과 근동의 대부분을 무력화하고 정복할 수 있게 할 것이다.\n\n소련이 유엔의 북한 정복 시도를 서방에 대한 총력전 개시의 구실로 이용하지 않기로 선택한다 해도, 크렘린은 어떤 방법으로든 유엔의 북한 점령을 저지할 준비가 되어 있을 가능성이 크다. 유엔에서의 거부권과 미국을 침략 행위로 비난할 기회를 충분히 이용함과 더불어, 소련은 유엔의 통신을 차단하고 지상 진격을 저지하며 유엔의 항공 및 해군 우세를 무력화하기에 충분한 지상, 항공 또는 해군 지원을 제공할 가능성이 충분히 있다. 그러한 행동과 동시에 소련은 북한으로의 진격으로 얻을 수 있는 이점을 상쇄하고 유엔의 군사 능력을 더욱 긴장시키기 위해 다른 곳에서 새로운 제한적 침략을 개시할 가능성이 충분히 있다. 소련이 그러한 위험을 감수할 준비가 되어 있지 않다는 보장은 없다.\n\n4.\n\n북한 정복이 한국 전역의 평화나 진정한 통일을 보장하지는 않을 것이다. 소련 최고 사령부는 북한군의 상당 부분을 만주나 소련 영내로 철수시키려 시도할 것이 거의 확실하다. 소련은 이 지역들로부터 침략과 침투를 계속 위협할 수 있으며, 그렇게 함으로써 대규모 미군 또는 유엔군의 계속적 주둔을 필요로 할 정도의 불안정을 조성할 수 있다. 더욱이 이승만과 그의 정권은 다수는 아닐지라도 많은 비공산 한국인들 사이에서 인기가 없다. 그의 정권을 재수립하고 그 권위와 민중적 지지 기반을 한국 전역으로 확대하는 것은 불가능하지는 않더라도 어려울 것이다. 이것이 가능하다 해도, 그 정권은 지속적인 미국 또는 유엔의 군사적·경제적 지원을 필요로 할 정도로 매우 불안정할 것이다. 하나의 대안으로 유엔 감시하의 자유 선거 결과 새로운 정부가 수립된다 해도, 공산주의자들이 그러한 정부의 통제권이나 강력한 발언권을 얻지 못하리라는 보장은 없다. 또 다른 대안으로 유엔의 통제와 미국의 참여 아래 장기간의 신탁통치가 수립된다 해도 불안정은 계속될 것이며, [603면] 아마도 비공산 한국인들조차 독립을 외부 통제로 대체하는 것에 반발할 것이다. 더욱이 한국은 다시 한 번 국제 정치의 앞잡이가 될 것이며, 그 궁극적 지위는 대표자들이 신탁통치를 감독한 국가들의 상대적 힘과 야망에 달려 있게 될 것이다.\n\n----- 각주 -----\n[주1] 원본 문서에는 이 날짜가 본 문서가 국가안전보장회의(NSC)에서 접수된 날짜라고 표시되어 있다.", "secondary": "secret\n\nWashington, August 18, 1950. [주1]\n\nSubject: Factors Affecting the Desirability of a UN Military Conquest of all of Korea\n\nConclusions\n\nAlthough an invasion of North Korea by UN forces could, if successful, bring several important advantages to the US, it appears at present that grave risks would be involved in such a course of action. The military success of the operation is by no means assured because the US cannot count on the cooperation of all the non-Communist UN members and might also become involved in hostilities with Chinese Communist and Soviet troops. Under such circumstances there would, moreover, be grave risk of general war.\n\n[601면]\n\nDiscussion\n\nA successful invasion of North Korea by UN armed forces could bring several important advantages:\n\n1.\n\nThe conquest of North Korea by UN forces would represent a major diplomatic defeat for the USSR. It would have a profound effect on the entire non-Communist world and would give renewed hope to anti-Communists in both the European and the Asian Satellite states. The recovery of a Satellite from Soviet domination, regardless of its geographical position or political importance, would be a decisive victory for the Western world.\n\n2.\n\nThe military victory achieved by the UN forces would greatly increase the prestige of the UN and particularly would bring prestige to the US as the chief participant in the UN forces. The countries of Western Europe and the Near East would place greater reliance in the UN as a practical force for world peace and in the determination and ability of the US to stem Communist aggression.\n\n3.\n\nUN military conquest of Korea would not only deny the USSR a strategic outpost from which to threaten Japan, but it would provide the Western Powers with a buffer area and a wedge into Communist held territory.…\n\n4.\n\nThe elimination of the arbitrary division of Korea at the 38th parallel and the expulsion of the North Korean regime would appear to provide an opportunity to bring about the economic and political unification of the country. Korean unity would be in accord with the wishes of the Korean people, the announced policy of the US, and the recommendations of the UN.\n\nIn addition to these advantages, however, an invasion of North Korea would involve certain grave risks for the US:\n\n1.\n\nIt is doubtful whether the US could secure the support of its allies and of other non-Soviet nations in the UN for such a course of action. Many non-Communist members of the UN would almost certainly be opposed to any action which would involve the risk of strong counteraction by the USSR. The nations participating with the US in Korea do not wish to become deeply involved in Korea or to take action which might bring them nearer to a general war. They would probably take the position that the UN forces are not committed to the liberation of North Korea and that the SC’s resolutions do not provide an adequate legal basis for the conquest. Consequently, US action would provide the USSR with a strong wedge for attempting to separate the US from its Western European allies. It would also have serious repercussions among Asian nations, particularly India, which is habitually distrustful of Western motives, and might convince many Asians that the US is, after all, an aggressive nation pursuing a policy of self-interest in Asia.\n\n2.\n\nThe invading forces might become involved in hostilities with the Chinese Communists. As it became apparent that the North Koreans were being defeated in South Korea, the Chinese might well take up defensive positions north of the 38th parallel. The USSR, which might welcome the outbreak of hostilities between the US and [602면] China, would thus have an additional opportunity of driving the wedge more deeply between the US and its allies. The USSR might use Chinese Communist troops at any stage in the fighting, but their participation would be especially useful at the 38th parallel where UN members could legally discontinue their support of the US policy.\n\n3.\n\nInasmuch as the USSR would regard the invasion of North Korea as a strategic threat to the security of the Soviet Far East, the invading forces might become involved, either directly or indirectly, in hostilities with Soviet forces. The USSR is now in a high state of readiness for general hostilities, and the Kremlin might well calculate that, with US mobilization set in motion, the USSR is better prepared now than it would be later for a full-fledged test of strength with the US. It could
