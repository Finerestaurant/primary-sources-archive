therefore place Soviet forces on the 38th parallel and oblige the US to initiate hostilities against Soviet forces under conditions which would alienate most of Asia from the US–UN cause in Korea, permit full exploitation of the propaganda theme that the South Koreans under US guidance opened the aggression against the North Koreans and other peace-loving peoples, and enable the USSR to neutralize and conquer most of Europe and the Near East before the impact of US industrial mobilization could be felt upon the defensive capability of those areas.\n\nEven if the USSR should not choose to utilize a UN attempt to conquer North Korea as a pretext for the inauguration of general hostilities against the west, it is probable that the Kremlin would be prepared by one method or another to prevent UN occupation of North Korea. Along with exploiting fully its veto power in the UN and the opportunity for charging the US with aggressive action, the USSR might well provide sufficient ground, air, or naval assistance to interdict UN communications, halt the ground advance, and neutralize UN air and naval superiority. Concurrent with such action, the USSR might well inaugurate new limited aggressions elsewhere in order to offset the advantages which might be gained by an advance into North Korea and to strain further UN military capabilities. There is no assurance that the USSR is unprepared to assume such risks.\n\n4.\n\nThe conquest of North Korea would not provide assurance of peace throughout the country or of true unification. The Soviet high command would almost certainly attempt to withdraw into Manchuria or into the USSR a large portion of the North Korean forces. From these areas the USSR might continue to threaten aggression and infiltration and thus produce such instability as to require the continuing presence of large numbers of US or UN forces. Moreover, Syngman Rhee and his regime are unpopular among many—if not a majority—of non-Communist Koreans. To re-establish his regime and extend its authority and its base of popular support to all of Korea would be difficult, if not impossible. Even if this could be done, the regime would be so unstable as to require continuing US or UN military and economic support. If, as one alternative, a new government should be formed consequent to a UN-supervised free election, there is no assurance that the Communists would not win either control of or a powerful voice in such a government. If, as another alternative, a prolonged trusteeship under UN control and with US participation were established, instability would, nevertheless continue, with probably even [603면] the non-Communist Koreans reacting against the substitution of outside control for independence. Furthermore, Korea once more would become the catspaw of international politics, and its ultimate status would be dependent upon the comparative strength and ambitions of the countries whose representatives supervised the trust administration.", "notes": [], "warn": false, "pages": ["50-601", "50-602", "50-603"], "search": ""}, {"id": "50-d403", "order": 21, "date": "1950-08-20", "group": "E", "eyebrow": "50-d403 · Extracts of Memorandum of Conversations, by Mr. W. Averell Harriman, Special Assistant to the President, With General MacArthur in Tokyo an August 6 and 8, 1950  The source text in the Department of States files, an unsigned typewritten document, bore the heading “Notes Dictated by Mr. Harriman on August 20 Concerning His Conversations With General MacArthur [Extracts]”. At the conclusion of the document, the following note was typed: [“Note: This copy (no carbons) was made from rough, largely unedited notes dictated by Mr. Harriman. Some liberties have consequently been taken with the format and the spelling of the original. The wording, however, is not changed, except that a few queries of clarifications have been inserted in brackets.]” A fuller version of Mr. Harriman’s memorandum is printed in Truman, Years of Trial and Hope, pp. 349–353.", "title": "해리먼 대통령 특별보좌관이 1950년 8월 6일과 8일 도쿄에서 맥아더 장군과 나눈 대화 비망록 발췌", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-08-20"}, {"k": "시각", "v": null}, {"k": "발신", "v": "Harriman, W. Averell 해리먼(대통령 특별보좌관)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "비망록"}, {"k": "원문출처", "v": "795.00/8–850", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d403"}], "summary": "해리먼이 도쿄에서 맥아더와 북한군 조기 섬멸 필요성, 유엔 지상군 증원 요청, 일본과 대만 문제를 논의한다.", "points": ["맥아더는 북한군을 조기에 섬멸해야 하며 느린 병력 증강은 정치·군사적으로 위험하다고 주장한다.", "소련과 중국 공산군이 직접 개입할 의도는 현재 없다고 보나, 시간을 끌면 북한군이 크게 강화될 것이라고 우려한다.", "맥아더는 가능한 한 많은 유엔 지상군, 3만에서 4만 명을 요청하며 중화기 없이 소화기만 갖춘 대대 단위로도 신속히 받겠다고 말한다.", "일본인들은 한국 전쟁에 대한 미국의 행동을 소련 침략으로부터 자국을 방어해 줄 것이라는 신호로 받아들여 안도했다고 평가한다.", "서울에 이승만 정부가 재수립되면 2개월 내 유엔 감시 선거를 통해 비공산 세력이 압승할 것이라고 확신한다."], "primary": "2급 비밀\n\n[워싱턴,] 1950년 8월 20일.\n\n. . . . . [주2]\n\n우리의 한국 내 행동에 대한 일본인들의 반응은 안도감이었다. 그들은 이를 우리가 러시아의 침략으로부터 그들을 강력하게 방어할 것이라는 의미로 해석했기 때문이다. 그들은 우리의 일시적 어려움에 동요하지 않았다. 기습 공격으로 인한 군사적 어려움을 이해했기 때문이다. 그들의 자존심은 대부분의 미군을 철수함으로써 보여준, 그들에 대한 “그의” 신뢰로 인해 고양되었다. 일본 내 무질서의 위험 없이 그들 모두를 철수할 수도 있었다.\n\n. . . . . [주2]\n\n나는 오전에 맥아더와 2시간 반 동안 대화를 나누었고, [주3] 전원이 맥아더 장군 부처와 함께 점심을 했으며, 이어서 오후 5시 30분부터 7시 30분까지 2시간 동안 추가 대화를 가졌다.\n\n[543면]\n\n화요일 아침, [주4] 한국에서 돌아온 후, 나는 떠나기 전에 4시간 동안 추가 대화를 나누었다.\n\n첫 2시간 반 동안은 리지웨이 장군과 노스태드 장군이 참여한 군사 논의가 포함되었다. [주5] 알몬드 장군도 배석했다.\n\n나는 대화를 시간순으로 나누지 않고 대체로 주제별로 나누고자 한다.\n\n군사 (한국). 일요일 아침의 첫 대화는 그가 보는 군사 상황을 다루었다.\n\n나는 그에게 대통령이 맥아더가 원하는 바를 알기를 원하며, 가능한 한 전적으로 그를 지원할 준비가 되어 있다고 전하라고 나에게 요청했다고 설명했다. 나는 맥아더에게 한국 결정의 현명함에 대해 어떤 의문이라도 가지고 있는지 물었다. 그는 “전혀 없다”고 대답했다. 대통령의 성명은 훌륭했다. 그것은 공산주의 지배로부터 세계를 구할 역사적 결정이며, 역사에 그렇게 기록될 것이다. 지상군 투입은 필수적이었고, 승리는 신속히 달성되어야 한다.\n\n맥아더는 북한군이 가능한 한 조기에 섬멸되어야 하며, 느린 병력 증강을 기다릴 수 없다는 확고한 신념을 피력했다. 그는 그러한 방침의 정치적·군사적 위험성, 즉 미국을 포함한 유엔 내에서 올 낙담, 동양 민족들과 중국 공산군 및 러시아인들에게 미칠 영향을 강조했다. 그는 러시아와 중국 공산군이 북한군을 크게 강화할 수 있을 것이며, 시간이 본질적이지 않으면 재앙은 아닐지라도 중대한 어려움이 앞에 놓여 있다고 우려했다.\n\n(그의 군사적 평가는 리지웨이가 작성하고 그와 노스태드, 그리고 내가 서명한 합참 앞으로의 성명을 포함하여 별도의 비망록에서 다룬다.)\n\n그는 러시아인들이 현재 직접 개입하거나 일반 전쟁에 휘말릴 의도가 있다고 믿지 않았다. 그는 중국 공산군에 대해서도 마찬가지라고 믿었다. 러시아인들은 북한군을 조직하고 장비를 갖추었으며, 붉은 군대에서 싸운 소련의 조선계 주민들 중에서 훈련된 인원 일부를 공급했다. 중국 공산군은 만주에서 중국 공산군과 함께 싸웠던 병사들의 이송에 협력했다. 이들은 부대 단위로 온 것이 아니라 만주에서 제대하여 북한으로 수송된 후 북한군으로 재편성되었다. 그들의 지휘는 활발했다. 다수의 러시아 [544면] 장교들이 참관인으로 활동하고 있었으나 의심할 여지없이 지시를 내리고 있었다. 그들의 전술은 능숙했으며, 그들은 그의 군사 경험상 어떤 군대 못지않게 유능하고 강인했다.\n\n. . . . . [주6]\n\n맥아더는 가능한 한 최대의 유엔 지상군, 3만 내지 4만 명을 원한다. 그는 대대(1,000명)를 그들이 올 수 있는 한 최대한 신속히, 소화기만 갖추어도 받아들일 것이다. 실제로 중화기도 환영하겠지만, 필요가 너무 커서 소화기만 있어도 받아들일 것이다. 그는 영국이 홍콩이나 말라야에서 1개 여단을 보내야 하며, 영국 본토에서 대체될 수 있다고 생각한다. 프랑스는 인도차이나에서 약간의 병력을 보낼 수 있을 것이다. 파키스탄과 터키에서 1개 여단이 온다면 대단히 환영할 것이다. 캐나다도 약간의 병력을 보내야 한다. 그는 다음 주에 도착할 멘지스에게 적극적으로 설득할 생각이었다. 그는 동양 군대의 가치를 인정하면서도, 시암(타이)에 대해서는 좋은 말이 없었다. 그는 필리핀이 당장 어떤 병력이라도 빼낼 수 있을지 확신하지 못했다.\n\n그는 일단 승리만 하면 정치적 결과에 대해 의심을 품지 않았다. 승리는 동양에서 강력한 자석이며, 한국인들은 자유를 원한다. 이승만 정부가 서울에 재수립되면, 유엔 감시 선거는 2개월 내에 실시될 수 있으며, 그는 비공산 정당들의 압승을 의심치 않는다. 북한 주민들도 러시아나 공산군의 간섭이 없다고 확신하게 되면 비공산 정부에 투표할 것이다. 그는 현재 북한에 100석을 부여하고 있는 헌법을 변경할 필요가 없다고 말했다. 한국은 동양의 비공산 운동을 안정화하는 데 강력한 영향력이 될 수 있다.\n\n. . . . . [주6]\n\n[여기에 중국과 대만에 관한 논의가 이어진다. 제6권 256면에 인쇄되어 있다.]", "secondary": "top secret\n\n[Washington,] August 20, 1950.\n\n. . . . . [주2]\n\nThe reaction among the Japanese to our action in Korea was one of relief, as they interpreted it to mean that we would vigorously defend them against Russian invasion. They were not disturbed by our temporary difficulties, since they understood the military difficulties caused by the surprise attack. Their pride had been aroused by “his” confidence in them, shown by the withdrawal of most of the American troops. He could withdraw them all without danger of disorder in Japan.\n\n. . . . . [주2]\n\nI had a 2½ hour talk with MacArthur in the morning; [주3] lunch with him and Mrs. MacArthur for the entire party, and then a further 2-hour talk from 5:30 to 7:30 in the afternoon.\n\n[543면]\n\nOn Tuesday morning, [주4] after my return from Korea, we had a further four-hour talk before my departure.\n\nThe first 2½ hours included a military discussion at which Generals Ridgway and Norstad participated. [주5] General Almond also was present.\n\nI will not attempt to divide the conversations chronologically, but largely by subjects.\n\nMilitary (Korea). Our first talk on Sunday morning covered the military situation as he saw it.\n\nI explained to him that the President had asked me to tell him that he wanted to know what MacArthur wanted, and was prepared to support him as fully as possible. I asked MacArthur whether he had any doubts about the wisdom of the Korean decision. He replied, “absolutely none”. The President’s statement was magnificent. It was an historic decision which would save the world from Communist domination, and would be so recorded in history. The commitment of our ground forces was essential, and victory must be attained rapidly.\n\nMacArthur described his firm conviction that the North Korean forces must be destroyed as early as possible and could not wait for a slow build-up. He emphasized the political and military dangers of such a course; the discouragement that would come among the United Nations including the U.S.; the effect on Oriental peoples as well as on the Chinese Communists and the Russians. He feared that Russia and the Chinese Communists would be able to greatly strengthen the North Korean forces and that time was of the essence, or grave difficulties, if not disaster, were ahead.\n\n(His military appraisal is dealt with in a separate memorandum, including the statement to the Joint Chiefs prepared by Ridgway, and signed by him, Norstad and myself.)\n\nHe did not believe that the Russians had any present intention of intervening directly, or becoming involved in a general war. He believed the same was true of the Chinese Communists. The Russians had organized and equipped the North Koreans, and had supplied some of the trained personnel from racial Koreans of the Soviet Union who had fought in the Red Army forces. The Chinese Communists had cooperated in the transfer of soldiers who had fought with the Chinese Communist forces in Manchuria. These had not come over as units, but had been released in Manchuria, and reorganized into North Korean forces after they had been transported to North Korea. Their leadership was vigorous. A number of Russian [544면] officers were acting as observers but undoubtedly giving direction. Their tactics had been skillful, and they were as capable and tough as any army in his military experience.\n\n. . . . . [주6]\n\nMacArthur wants maximum UN ground forces possible, as many as 30 or 40,000. He will take battalions (1,000 men) just as fast as they can come, with only their small arms. Actually, heavier artillery would be welcome, but the need is so great that he would take them with their small arms only. He feels the British should send a brigade from Hong Kong or Malaya, thinks it could be replaced from the United Kingdom. The French could send some forces from Indochina; a brigade from Pakistan and Turkey would be most welcome. Canada should send some troops. He was going to work on Menzies when he arrived the following week. He didn’t have a good word to say about the Siamese, although he recognized the value of Eastern troops. He wasn’t sure the Philippines could spare anything just now.\n\nHe has no doubts of the political outcome, once there is victory. Victory is a strong magnet in the East, and the Koreans want their freedom. When Syngman Rhee’s Government is reestablished in Seoul, the UN–supervised election can be held within two months, and he has no doubt of an overwhelming victory for the non-Communist parties. The North Koreans will also vote for a non-Communist Government when they are sure of no Russian or Communist intervention. He said there was no need to change the Constitution, which now provides for 100 seats for the North. Korea can become a strong influence in stabilizing the non-Communist movement in the East.\n\n. . . . . [주6]\n\n[Here follows discussion of China and Formosa printed in volume VI, page 256.]", "notes": ["[주1] 국무부 철에 있는 원본 문서로서 서명 없는 타자문서는 “1950년 8월 20일 맥아더 장군과의 대화에 관하여 해리먼 씨가 구술한 비망록 [발췌]”라는 제목을 달고 있다. 문서 말미에 다음과 같은 주가 타자되어 있다: [“주: 이 사본(카본 없음)은 해리먼 씨가 구술한, 대체로 편집되지 않은 거친 비망록에서 작성되었다. 따라서 원본의 형식과 철자에 약간의 자유를 두었다. 그러나 몇몇 명료화를 위한 질문을 괄호 안에 삽입한 것을 제외하고는 표현은 변경되지 않았다.]” 해리먼 씨 비망록의 보다 완전한 판본은 Truman, Years of Trial and Hope, pp. 349–353에 인쇄되어 있다.", "[주2] 원문에 표시된 생략.", "[주2] 원문에 표시된 생략.", "[주3] 8월 6일.", "[주4] 8월 8일.", "[주5] 상기 참조.", "[주6] 원문에 표시된 생략.", "[주6] 원문에 표시된 생략."], "warn": false, "pages": ["50-543", "50-544"], "search": "Harriman, W. Averell 해리먼 MacArthur, Douglas 맥아더 Ridgway, Matthew B. 리지웨이 Norstad, Lauris 노스태드 Almond, Edward M. 알몬드 Menzies, Robert 멘지스"}, {"id": "50-d456", "order": 22, "date": "1950-08-21", "group": "C", "eyebrow": "50-d456 · Draft Memorandum Prepared by the Policy Planning Staff", "title": "정책기획실이 작성한 각서 초안", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-08-21"}, {"k": "시각", "v": null}, {"k": "발신", "v": "정책기획실(Policy Planning Staff)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서 초안"}, {"k": "원문출처", "v": "795.00/8–2150", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d456"}], "summary": "유엔군의 공세 전환 이전에 소련이 북한군의 38선 철수를 제안하는 특정 상황에 대비하여 정책기획실이 마련한 정전 조건 초안.", "points": ["북한군이 안전보장이사회의 정전 명령을 따르도록 한다.", "개편된 유엔한국위원단(UNCOK)이 38선 일대에 감시팀을 파견한다.", "한국군 이외의 유엔군은 36도선 이남에 머물고, 한국군은 38선까지 북한군을 추격한다.", "북한군은 해산시키고 무기는 선거 완료 시까지 유엔한국위원단이 보관한다.", "유엔한국위원단이 북한 지역의 선거를 감독하며, 선거 지원과 질서 유지를 위해 한국 경찰대가 북한에 들어간다.", "미국은 주저 없이 철수하겠다는 태도를 취하며, 한국에 주둔 중인 미군을 다른 유엔 회원국 군대로 교체하는 방안을 환영한다."], "primary": "**일급비밀**\n\n[워싱턴,] 1950년 8월 21일. [주1]\n\n**유엔군의 공세 개시 이전에 한국 분쟁 해결을 위해 제안될 조건**\n\n아래 조건들은 오직 하나의 특수한 상황―전세가 역전되기 전에 소련 측이 모스크바와(또는) 베이징이 북한군의 38도선 철수를 포함하는 해결안을 협상할 준비가 되어 있다는 신호를 보내는 경우―에 대처하기 위해 고안된 것이다.\n\n1. 침략군은 안전보장이사회의 정전 명령에 따를 것이다.\n\n2. 새로운 책임을 수행하도록 개편된 유엔한국위원단(UNCOK)은 북한군이 유엔한국위원단이 결정한 위치로 철수하는 것을 감시하고, 남한 주민과 재산의 반출을 저지하며, 철수 상황을 유엔한국위원단에 매일 두 차례 보고하기 위해, 38도선을 따라 주요 지점에 항공편으로 팀들을 즉시 파견해야 한다.\n\n3. 한국군(ROK) 이외의 유엔군은 36도선 이남에 머물러야 한다.\n\n4. 한국군은 북한군의 철수를 따라가되 38도선을 넘지 말아야 한다. 대한민국 정부는 물론 수도로 귀환하여 대한민국에 대한 통치권을 재개할 것이다.\n\n5. 한국군이 38도선상에 진지를 점령하면 유엔한국위원단 팀들은 아래에 명시된 장차의 유엔 조치를 위한 기초 작업을 준비하기 위해 북한으로 들어가야 한다.\n\n6. 북한군은 해산되어야 하며, 그들의 무기는 아래 항에서 논의되는 선거가 완료될 때까지 유엔한국위원단의 관리하에 두어야 한다. 선거 완료 시점에 유엔한국위원단은 새 중앙 정부에 무기를 인계할 것이다. 그때까지 북한의 민간 당국은 법과 질서의 유지에 책임을 져야 한다.\n\n7. 유엔한국위원단은 북한에서 선거를 감독하여야 하며, 그 선거는 대한민국 정부에 대한 그쪽 반토막 나라의 대표성을 마련해 줄 것이다. 유엔한국위원단의 요청에 따라, 한국 경찰대는 선거 수행을 지원하고 유엔한국위원단의 통제 아래 질서 유지의 책임을 맡기 위해 북한에 들어가야 한다.\n\n8. 한편, 한국 영토에 무력 병력을 보유할 생각이 전혀 없는 미국으로서는, 특히 아시아 회원국들처럼 유엔의 대한(對韓) 결의를 지지해 온 다른 유엔 회원국 부대가 36도선 이남의 자국 군대를 대체하는 것을 환영할 것이다.\n\n9. 전한국 정부가 수립되면 유엔군은 신속히 철수해야 한다. 단, 한국 정부가 유엔군 주둔 유지를 요청하고 유엔이 이에 동의하는 경우는 예외로 한다. [주2]\n\n[617면]", "secondary": "top secret\n\n[Washington,] August 21, 1950. [주1]\n\nProposed Terms for a Settlement of the Korean Conflict Prior to the Assumption of the Offensive by UN Forces\n\nThe following terms are devised to meet only one particular contingency: an indication from the Soviet side, before the tide of battle has turned, that Moscow and/or Peiping are prepared to negotiate a settlement involving the withdrawal of the North Koreans to the 38 parallel.\n\n1.\n\nThe invading forces would obey a Security Council order for a cease-fire.\n\n2.\n\nAn UNCOK, revised to meet its new responsibilities, should forthwith dispatch by air teams to key positions along the 38 parallel to observe the North Korean withdrawal to positions determined by [616면] UNCOK, to inhibit removal of South Korean persons and property and to report twice daily to UNCOK on the withdrawal.\n\n3.\n\nUN Forces, other than ROK, should remain south of the 36 parallel.\n\n4.\n\nROK forces should follow the North Korean withdrawal up to but not beyond 38 parallel. The ROK Government would, of course, return to the capital and resume governing authority over the ROK.\n\n5.\n\nWhen ROK forces take up positions on the 38 parallel, UNCOK teams should proceed into North Korea to prepare the groundwork for forthcoming UN action, set forth below.\n\n6.\n\nThe North Korean forces should be demobilized and their arms placed under the custody of UNCOK pending the completion of the elections discussed in the following paragraph, at which time UNCOK would turn over the weapons to the new national government. Meanwhile the North Korean civil authorities should be held responsible for the maintenance of law and order.\n\n7.\n\nUNCOK should supervise an election in North Korea which would provide for representation from that half of the country in the Government of the Republic. As requested by UNCOK, ROK constabulary units should enter North Korea to assist in conducting the elections and to assume, under the control of UNCOK, responsibility for the maintenance of order.\n\n8.\n\nMeanwhile, having no disposition to retain armed forces on Korean soil, the United States would welcome the replacement of its troops south of the 36 parallel by units of other UN member nations which have supported the United Nations resolutions on Korea, particularly Asian members.\n\n9.\n\nWith the establishment of an all-Korean Government UN forces should promptly be withdrawn, unless the Korean Government requests and the UN agrees that they should be retained. [주2]\n\n[617면]", "notes": ["[주1] 정책기획실의 필립 와츠(Philip Watts)가 8월 22일자로 히커슨(Hickerson) 국무차관보에게 보낸 표지 메모에 따르면, 이 문서는 러스크(Rusk), 히커슨, 본브라이트(Bonbright), 그리고 아마도 정책기획실의 니츠(Nitze)와 데이비스(Davies)가 참여한 8월 21일 회의에서 논의된 각서의 두 번째 초안이었다.", "[주2] 8월 22일, 에머슨(Emmerson)은 이 정책기획실의 각서 초안에 관해 다음과 같은 메모를 러스크(Rusk) 국무차관보에게 보냈다: \"존 데이비스가 제안하기를—그리고 나도 동의하는데—이것을 로이 헨더슨(Loy Henderson)에게 전문으로 보내면서 이 내용을 바지파이(Bajpai)에게 비밀리에 전달하도록 제안하자고 합니다. 이것이 베이징의 귀에 들어가면 러시아인들을 짜증나게 하고 분열을 촉진하며, 어쩌면 중국 공산당의 흥미를 끌 수도 있을 것입니다. 어떻게 생각하십니까?\" (795.00/8–2250) 러스크의 답변에 관해서는 708쪽에 있는 그의 9월 8일자 각서를 보라."], "warn": false, "pages": ["50-616", "50-617"], "search": "Rusk 러스크 Hickerson 히커슨 Bonbright 본브라이트 Nitze 니츠 Davies 데이비스 Philip Watts 필립 와츠 Emmerson 에머슨 Loy Henderson 로이 헨더슨 Bajpai 바지파이"}, {"id": "50-d485", "order": 23, "date": "1950-09-01", "group": "C", "eyebrow": "50-d485 · Memorandum by the Executive Secretary of the National Security Council (Lay)", "title": "국가안전보장회의 사무국장이 제출한 한국 관련 평화 공세에 관한 비망록", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-09-01"}, {"k": "시각", "v": null}, {"k": "발신", "v": "Lay, James S., Jr. 국가안전보장회의(NSC) 사무국장", "txt": true}, {"k": "수신", "v": "국가안전보장회의(NSC)", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "Executive Secretariat Files: NSC 80", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d485"}], "summary": "육·해·공군 장관들이 한국에서의 군사적 교착이 가져올 심리·외교적 파장에 대비하라고 촉구하는 각서를 NSC에 회람한다. 이 의제는 10월 12일 회의에서 취소되었다.", "points": ["소련이 평화·미국의 침략·내전을 두고 대대적인 선전 공세를 퍼붓고 있고, 인도 등 유엔 회원국들도 적대행위를 조기에 끝낼 길을 찾고 있다.", "중공군이나 소련군의 대규모 개입이 없다면 몇 주 안에 군사적 교착 상태가 올 수 있으며, 이는 수개월 지속될 가능성이 있다.", "미군과 한국군의 저항을 무효화하고 미국의 이익을 해칠 타협 요구가 통제 불능으로 커질 수 있다.", "장관들은 심리·외교 전선에서의 정책 지침 마련을 NSC에 거의 즉각 요청할 것을 강력히 권고한다.", "이 프로젝트는 1950년 10월 12일 제69차 NSC 회의에서 취소되었다(주1)."], "primary": "**NSC 80**\n\n워싱턴, 1950년 9월 1일.\n\n한국 관련 평화 공세에 관해 국가안전보장회의 사무국장이 제출한 비망록\n\n국방장관의 권고와 대통령의 동의에 따라, 이 주제에 관한 합동 참모 [684면] 장관들의 동봉된 각서를 국가안전보장회의와 재무장관에게 정보 제공 목적으로 회람하고, NSC 사무국이 회의 심의를 위한 보고서 작성에 사용하도록 회부한다.\n\nJames S. Lay, Jr.\n\n[별첨]\n\n국방장관 앞 각서\n\n워싱턴, 1950년 8월 24일.\n\n건명: 한국 관련 평화 공세\n\n진술\n\n1. 지난 몇 주 동안 한국에서의 타협을 압박하는 윤곽이 드러났다. 소련은 평화, 미국의 침략, 내전에 관해 엄청난 말폭탄을 퍼붓고 있다. 인도를 비롯한 유엔 회원국들은 적대행위를 가능한 한 빨리 끝낼 방법을 찾고 있다. 이와 같은 노력과 더불어 증가하는 사상자 명단은, 능숙하게 관리되지 않으면 미군과 한국군의 영웅적 저항을 무효화하고 미국의 이익을 훼손할 타결을 향한 통제 불능의 요구로 비화할 수 있다.\n\n2. 중공군이나 소련군의 대규모 한국 개입이 없다면 몇 주 안에 군사적 교착 상태가 전개될 수 있다. 이 교착 상태는 수개월 지속될 가능성이 있다. 이는 우리 부대와 미국 국민, 유엔의 대의에 어두운 전망이다. 이러한 가능성에 대비하여, 충분히 검토된 정책 지침에 기초한 심리 및 외교 전선에서의 적극적인 조치를 미국이 거의 즉각 취해야 한다.\n\n권고\n\n우리는 귀하가 국가안전보장회의 사무국에 한국에서의 교착 상태가 초래하는 심리적·외교적 영향을 상쇄하기 위해 취할 행동 방침에 관한 보고서를 작성하도록 요청할 것을 강력히 촉구한다. 그러한 조치는 대통령의 승인하에, 한국에서의 성공적 공세를 개시할 충분한 군사력을 확보할 때까지의 간극을 메우기 위한 목적으로 취해질 것이다. [주1]\n\nFrank Pace, Jr.  \n육군장관\n\nDan A. Kimball  \n해군장관 대리\n\nThomas K. Finletter  \n공군장관\n\n[685면]", "secondary": "top secret \n NSC 80\n\nWashington, September 1, 1950.\n\nNote by the Executive Secretary to the National Security Council on Peace Offensive Concerning Korea\n\nOn the recommendation of the Secretary of Defense and with the concurrence of the President, the enclosed memorandum by the Joint [684면] Secretaries on the subject is circulated herewith for the information of the National Security Council and the Secretary of the Treasury and referred to the NSC Staff for use in the preparation of a report for Council consideration.\n\nJames S. Lay, Jr.\n\n[Enclosure]\n\nMemorandum for the Secretary of Defense\n\nWashington, August 24, 1950.\n\nSubject: Peace Offensives Concerning Korea\n\nStatement\n\n1. The past few weeks have produced the outline of the pressures for compromises in Korea. The Soviets have plunged into an avalanche of words on peace, U.S. aggression, and civil war. India, and other UN members, are seeking ways to end hostilities as soon as possible. Unless skillfully managed, these and other efforts plus growing casualty lists may build up into an uncontrollable demand for a settlement that would nullify the heroic resistance of American and South Korean troops and injure U.S. interests.\n\n2. In a few weeks, barring large-scale entry of Chinese Communist or Soviet forces into Korea, a military stalemate may develop. This stalemate possibly could last several months. It is a bleak prospect for our troops, the American people, and the UN cause. In anticipation of this possibility, vigorous action on the psychological and diplomatic front, based on well-considered policy directives, should be undertaken by the United States almost immediately.\n\nRecommendation\n\nWe strongly urge that you request the National Security Council staff to prepare a report on the courses of action to be taken to offset the psychological and diplomatic effects of a stalemate in Korea. Such actions would be taken, on the President’s approval, with a view to bridging the gap until sufficient military force is available to launch a successful offensive in Korea. [주1]\n\nFrank Pace, Jr.\n\nSecretary of the Army \n\n\nDan A. Kimball\n\nActing Secretary of the Navy \n\n\nThomas K. Finletter\n\nSecretary of the Air Force\n\n[685면]", "notes": ["[주1] 1950년 10월 12일 제69차 회의에서 국가안전보장회의는 NSC 고위 실무진의 권고에 따라 이 프로젝트를 취소하기로 합의했다(NSC 조치 번호 369c)."], "warn": false, "pages": ["50-684", "50-685"], "search": "Lay, James S., Jr. 제임스 레이 Pace, Frank, Jr. 프랭크 페이스 주니어 Kimball, Dan A. 댄 킴볼 Finletter, Thomas K. 토머스 핀레터"}, {"id": "50-d488", "order": 24, "date": "1950-09-02", "group": "F", "eyebrow": "50-d488 · The Ambassador in Korea (Muccio) to the Secretary of State", "title": "주한대사 무초가 국무장관에게 보낸 전보", "badge": "confidential", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-09-02"}, {"k": "시각", "v": null}, {"k": "발신", "v": "주한대사 무초(John J. Muccio)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "장소", "v": "Pusan"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "전보"}, {"k": "원문출처", "v": "795B.00/9–250", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d488"}], "summary": "무초가 이승만에게 국회와의 충돌을 합리적으로 다루도록 설득한 대화 내용을 전송한다.", "points": ["국회가 압도적 표결로 신성모 국무총리 겸 국방장관과 조병옥 내무장관의 해임을 요구하는 결의안을 채택하여 대통령과 국회의 갈등이 정점에 달했다.", "무초는 이승만에게 지도자들이 책임 있는 인물들을 '찔러대는' 행태와 군·경에 정쟁을 주입하는 시도에 깊은 실망을 표했다.", "무초는 수원과 대전에서 미국이 빠질 수도 있었던 순간들을 상기시키며, 지금의 지원이 정당화되려면 모든 한국인이 함께 힘을 모아야 한다고 강조했다.", "무초는 유엔한국위원단의 세 번째 보고서가 한국에 더 유리할 것이며, 53개 회원국의 지지가 도덕적·물질적·군사적 지원으로 이어지고 있다고 지적하며, 한국 정치인들이 이 신뢰를 무효화하지 말아야 한다고 말했다.", "노블은 대화에 앞서 국회의장 신익희와 수석부의장 장택상을 만나 같은 견해를 전달했고, 이들은 당분간 공개적인 입법부-행정부 충돌을 막기 위해 영향력을 행사하기로 합의했다.", "이승만은 이후 국회에서 우호적이고 유화적인 태도로 연설했으나, 질의응답 시간에 평정을 잃고 가혹한 발언을 하여 이전 연설의 좋은 효과를 부분적으로 상쇄했다.", "신익희와 장택상의 지도 아래 국회는 예산안을 통과시키고 당분간 논쟁을 억누르기로 했다."], "primary": "confidential\n\n부산, 1950년 9월 2일.\n\n[번호 없음]\n\n제목: 대사, 이승만 대통령, 노블 박사 간 대화 비망록 송부\n\n대사관은 1950년 9월 1일자로 대사, 이승만 대통령, 노블 박사 간에 이루어진 대화 비망록을 송부한다.\n\n대사는 정부가 대전에 수립된 이후로 동일한 취지의 의견을 대통령과 다른 관리들에게 반복적으로 전달해왔으나, 이번 대화의 직접적인 목적은 방금 정점에 달한 국회와의 갈등을 대통령이 합리적으로 처리하도록 주지시키기 위한 것이었다. 그 갈등은 국회가 국무총리 겸 국방장관 신성모 해군 대령과 내무장관 조병옥 박사를 해임할 것을 대통령에게 요구하는 결의안을 압도적 표결로 채택함으로써 불거졌다. 대사는 또한 노블 씨를 보내 이 문제를 국회의장 신익희 및 수석부의장 장택상과 논의하도록 했다. 노블 씨는 이 대화에 기술된 것과 유사한 견해를 제시했으며, 두 국회 지도부 인사는 당분간 공개적인 입법부-행정부 간 충돌을 막기 위해 자신들의 영향력을 행사하기로 합의했다.\n\n[695면]\n\n위에 기술된 대화에 이어, 대통령은 국회로 가서 약 한 시간 동안 우호적이고 유화적인 태도로 그들에게 연설하기로 결정했고 실제로 그렇게 했다. 동시에 대통령은 왜 두 장관의 해임 요구를 수용하는 것이 불가능하다고 생각하는지 설명했다. 그는 또한 4명의 국회의원을 제5차 유엔 총회 한국 대표단의 일원으로 임명한다고 발표했는데, 이는 국회의원들에 의해 유화적 제스처로 받아들여졌다. 불행하게도, 연설 후 이어진 질의응답 시간에 대통령은 평정을 잃고 국회에 대해 거친 발언을 하여 이전 연설의 좋은 효과를 부분적으로 상쇄시켰다. 그러나 신익희와 장택상의 지도 아래 국회는 예산안을 통과시키고 당분간 논쟁을 억누르기로 했다.\n\n[첨부]\n\n주한대사 (무초) 작성 대화 비망록\n\nconfidential\n\n부산, 1950년 9월 1일.\n\n참석자: 대사\n\n이승만 대통령\n\n노블 박사\n\n장소: 이승만 대통령 집무실\n\n나는 이승만 대통령에게 부산에 도착하자마자 스스로 지도자임을 자부하는 사람들이—정부 안팎에서—책임 있는 지위에 있는 인물들을 \"찔러대는\" 것을 발견하고 얼마나 실망했는지 말했다. 나는 국가의 생명 자체가 위태로운 때에 군과 경찰에 이기적인 정치적 논쟁을 주입하려는 시도를 특히 개탄스럽게 생각했다.\n\n나는 이승만에게 이것이 공적으로나 개인적으로나 나를 거슬리게 했음을 상기시켰다. 지난 2년 동안 두 번에 걸쳐 나는 미국의 대한 원조 지속에 반대하는 쪽으로 내 영향력을 행사할 기회가 있었기 때문이다. 6월 25일의 충격 이래, 군사 원조가 도착하기 전에 미국이 그럴듯하게 빠져나가 이 반도를 운명에 내맡길 수 있었던 순간이 적어도 두 번 있었다. 수원에서 그렇게 할 수도 있었고, 며칠 뒤 대전에서도 그렇게 하는 것은 쉬운 일이었을 것이다. 나는 우리가 그때 버텨낸 것을 기쁘게 생각한다. 나는 트루먼 대통령이 침략을 저지하기 위해 공군 및 해군 지원을, 그리고 이틀 후에는 지상군 지원을 보내기로 한 대담하고 단호한 결정을 내린 것을 자랑스럽게 생각한다. 동시에 나는 투입되고 있는 생명과 노력에 대해 미국 국민에게 막중한 책임을 느끼며, 모든 한국인들이 함께 힘을 모아 최선을 다하고 그렇게 함으로써 받은 지원을 정당화할 수 있고 또 그렇게 할 것이라는 확신을 표현하기를 기대하지 않을 수 없다.\n\n[696면]\n\n그런 다음 나는 유엔한국위원단이 첫 번째와 두 번째 보고서에서 한국과 이곳에서 이루어지고 있는 일에 대해 잘 평가해주었다고 언급했다. 나는 세 번째 보고서가 방금 서명되었으며 [주1] 이는 한국에 더욱 유리한 것이라고 알고 있다고 들었다. 나는 53개 회원국이 한국이 미국의 지원을 받으며 행한 일을 지지했다는 사실에 감격한다고 계속 말했다. 이 국가들 중 다수는 도덕적 지지만을 보내는 것이 아니라 현재 물질적·군사적 지원을 제공하고 있다. 유엔한국위원단의 보고서는 한국의 편에 서도록 세계 여론을 결집하는 데 결정적 역할을 했다. 나는 대표단 또한 한국 정치인들이 자신들이 한국에 표명한 신뢰를 무효로 만들지 않기를 바란다는 점을 알고 있다.\n\n당연히, 사랑하는 이들을 이곳에서 싸우도록 보내고 있는 전 세계 사람들은 자신들이 왜 여기 있으며 한국인들은 무엇을 하고 있는지를 알고 싶어 할 것이다. 우호적이든 적대적이든 전 세계 사람들의 눈이 한국에 쏠려 있다. 대통령과 그의 모든 각료들, 국회, 그리고 정부 안팎의 시민 지도자들은 자신들이 유리 어항 속에서 살고 있음을 자각해야 한다. 어떤 이들은 자신들의 사악한 술책을 계속하다가도 빠져나갈 수 있다고 느낄지 모른다. 그들은 설령 빠져나갈 수 있다고 생각할지라도 결코 그럴 수 없다는 점을 분명히 알아야 한다.\n\n이 기본 개요는 나와 내 참모들이 정부 안팎의 한국인들과 가진 대화들에서 사용되었다.\n\nJ. J. 무초\n\n----- 각주 -----\n[주1] 1949년 12월 15일부터 1950년 9월 4일까지의 기간을 다루는 UNCOK의 세 번째 보고서는 후자의 날짜로 유엔 사무총장에게 송부되었다. 유엔 문서 A/1350 참조.", "secondary": "confidential\n\nPusan, September 2, 1950.\n\n[Unnumbered]\n\nSubject: Transmittal of Memorandum of Conversation of the Ambassador, President Rhee, and Dr. Noble\n\nThe Embassy transmits a memorandum of conversation of the Ambassador, President Rhee, and Dr. Noble, which took place September 1, 1950.\n\nAlthough the Ambassador had conveyed substantially the same ideas to the President and other officials repeatedly since the Government had been established at Taejon, the immediate purpose of this conversation was to impress the President with reasonable handling of a conflict with the National Assembly which had just come to a head by adoption, by overwhelming vote, by the National Assembly of a Resolution calling upon the President to discharge the Prime Minister—Defense Minister, Captain Shin Sung Mo, and the Home Minister, Dr. Chough Pyung Ok. The Ambassador had also sent Mr. Noble to discuss this question with the Chairman of the National Assembly, Shin Ik Hi, and the senior Vice-Chairman, Chang Taik San. Mr. Noble had presented views similar to those described in the conversation and the two National Assembly officers had agreed that for the time being they would use their influence to stop any public legislature-executive conflict.\n\n[695면]\n\nFollowing the conversation described above, the President decided to go, and did go, before the National Assembly and addressed them for about an hour in a friendly and conciliatory manner, while at the same time explaining why he found it impossible to accede to their request to discharge the two ministers. He also announced the appointment of four members of the National Assembly as part of the Korean Delegation to the Fifth General Assembly of the UN, which was taken by the Assemblymen as a conciliatory gesture. Unfortunately, in the question and answer period following his speech the President lost his temper and made some harsh statements about the Assembly which partially undid the good effect of his previous speech. Under the leadership of Shin Ik Hi and Chang Taik San, however, the Assembly proceeded to pass the budget and suppress the controversy for the present.\n\n[Enclosure]\n\nMemorandum of Conversation, by the Ambassador in Korea (Muccio)\n\nconfidential\n\nPusan, September 1, 1950.\n\nParticipants: Ambassador\n\nPresident Rhee\n\nDr. Noble\n\nLocation: President Rhee’s Office\n\nI told President Rhee how disappointed I was upon arrival at Pusan to find men—both in and outside the Government—who pride themselves in being leaders, “knifing” men in responsible positions. I considered particularly deplorable attempts to inject selfish political bickerings into the army and police at a time when the very life of the state was at stake.\n\nI reminded Rhee that this jarred me officially and personally, as twice in the past two years I had had the opportunity of throwing my weight against continuance of U.S. aid to Korea. Since the blow of June 25, there were at least two times before military aid arrived that the U.S. could have run out plausibly and left the peninsula to its fate. It would have been easy to have done that at Suwon and, a few days later, at Taejon. I am delighted that we hung on at that time. I am proud that President Truman made his bold, forthright decision to send air and sea support and two days later ground support to stop the aggression. At the same time, I feel a tremendous responsibility to the American people for the lives and effort being expended and cannot but expect all Koreans to work together and do their best expressing confidence they could and would thereby be justifying the support received.\n\n[696면]\n\nI then mentioned that the UN Commission on Korea in its first, two reports had done well by Korea and by what was being done here. I understood that the third report had just been signed [주1] and that it was even more favorable to Korea. I continued that I was thrilled that 53 member states have endorsed what Korea, supported by the United States, had done. Many of these states were not only giving their moral support, but were coming now with material and military. The reports of the United Nations Commission on Korea had played a vital role in mobilizing world opinion on the side of Korea. I know that the delegates also hope that the Korean politicos will not nullify the confidence they have expressed in Korea.\n\nNaturally, people throughout the world who are sending their loved-ones to fight here are going to be eager to know why they are here and what the Koreans are doing. The eyes of the people of the world, friendly and unfriendly, are on Korea. He, all the members of his cabinet, the National Assembly, and civic leaders—both in and outside of the Government—must be aware that they are living in a goldfish bowl. Some may feel that they can continue their sinister manipulating and get away with it. They had better be aware that even though they think they can get away with it, they cannot.\n\nThis general outline was used in conversations that I and members of my Staff have had with Koreans, both in and out of the Government.\n\nJ. J. M[uccio]", "notes": [], "warn": false, "pages": ["50-695", "50-696"], "search": "Muccio, John J. 무초 (주한대사) Rhee, Syngman 이승만(李承晩) 대통령 Noble, Harold J. 노블 박사 Shin Sung Mo 신성모(申性模) 국무총리 겸 국방장관 Chough Pyung Ok 조병옥(趙炳玉) 내무장관 Shin Ik Hi 신익희(申翼熙) 국회의장 Chang Taik San 장택상(張澤相) 국회 수석부의장 Truman, Harry S. 트루먼 대통령"}, {"id": "50-d500", "order": 25, "date": "1950-09-07", "group": "C", "eyebrow": "50-d500 · Memorandum by the Joint Chiefs of Staff to the Secretary of Defense  This memorandum was circulated to the NSC on September 8 by the Executive Secretary (Lay).", "title": "합동참모본부가 국방장관에게 보낸 각서", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-09-07"}, {"k": "시각", "v": null}, {"k": "발신", "v": "Omar N. Bradley 합동참모본부의장", "txt": true}, {"k": "수신", "v": "국방장관", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "Executive Secretariat Files: NSC 80 Series", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d500"}], "summary": "합동참모본부는 NSC 81이 38선에서 전선을 안정시킨다는 구상을 전제로 하므로 비현실적이라고 반박하고, 북한군 격멸을 최우선 목표로 하여 38선 이북에서도 작전이 이뤄질 것이라 판단한다.", "points": ["합참은 NSC 81의 38선 전선 안정화 구상이 비현실적이라고 평가한다.", "북한군 전력이 38선 이남에서 분쇄된 이후에는 38선 이북에서도 작전이 필요하다고 본다.", "38선 이북 지상 작전은 한국군이 수행해야 하며, 게릴라전 성격이 될 것으로 예상한다.", "맥아더는 한국군 병력을 증강할 계획을 갖고 있다.", "적대 행위 중단 후 유엔군의 점령은 38선 이남 주요 도시로 한정하고 가능한 한 조기에 종료하며, 모든 미군은 실행 가능한 대로 조기에 철수해야 한다고 합참과 맥아더가 합의했다.", "맥아더는 이승만과 협의하여, 서울 재입성 즉시 전쟁 범죄자를 제외한 대사면과 총선거 실시 후 전한국 단일 정부 수립에 합의했다고 보고한다.", "합참은 NSC 81을 이 원칙들을 반영하여 다시 작성하고, NSC 81을 대체하여 국가안전보장회의에서 심의할 것을 제안한다."], "primary": "top secret\n\nWashington, 1950년 9월 7일.\n\n제목: 한국에 관한 미국의 행동 방침.\n\n귀하의 1950년 9월 1일자 각서와 관련하여, 합동참모본부는 NSC 81을 검토하였으며, 이 문서에 개괄된 기본 문제에 대한 접근 방식이 38선에서 전선을 안정화하는 것을 구상하고 있으므로 비현실적이라는 의견이다.\n\n합동참모본부는, 위원 중 두 사람이 맥아더(MacArthur) 장군과 협의한 후, 달성해야 할 최초의 목표가 북한군의 격멸이라는 그의 견해에 동의한다. 우리는 북한군의 전력이 분쇄된 이후에는—이는 북위 38도 이남에서 발생할 것으로 예상된다—이어서 작전이 38선 이북과 이남 양쪽에서 일어나야 한다고 믿는다. 그러한 지상 작전은 한국군이 수행해야 하는데, 그 이유는 작전이 아마도 게릴라 성격을 띨 것으로 가정되기 때문이다. 맥아더 장군은 한국군 병력을 증강할 계획을 가지고 있어서, 그때쯤이면 그들이 이 상황에 대처하기에 충분할 것이다.\n\n합동참모본부와 맥아더 장군은 실제 적대 행위가 중단된 이후 유엔군의 한국 점령은 38선 이남의 주요 도시로 한정되어야 하며 유엔군에 의한 점령은 가능한 한 조기에 종료되어야 한다는 데 동의한다. 이와 관련하여 모든 미군은 실행 가능한 대로 조기에 한국에서 철수해야 한다고 본다. 그러한 조치는 아시아 전체에 대한 우리의 입장에 매우 중요할 것이다.\n\n[708면]\n\n우리가 이해하기로는, 맥아더 장군은 이승만(Syngman Rhee)과의 협의를 통해, 유엔이 승인한 유일한 정부인 대한민국 정부가 실행 가능한 대로 조기에 서울에 다시 수립되어야 한다는 데 합의했다. 맥아더 장군은 이승만 씨와의 사이에, 이승만 씨가 서울에 재입성하는 즉시 전쟁 범죄자를 제외한 모든 사람에게 일반 사면을 실시하고, 한국 국회의 100석 공석을 채우기 위한 총선거를 소집하며, 그 후 전한국을 위한 단일 정부를 수립할 것이라는 이해에 도달했다고 말한다.\n\n합동참모본부는 NSC 81이 앞서 말한 원칙들을 반영하여 다시 작성되고, NSC 81을 대신하여 그 개정안이 국가안전보장회의에서 심의될 것을 제안한다.\n\n합동참모본부를 대표하여:\n\nOmar N. Bradley", "secondary": "top secret\n\nWashington, September 7, 1950.\n\nSubject: U.S. Courses of Action With Respect to Korea.\n\nWith reference to your memorandum of 1 September 1950, the Joint Chiefs of Staff have considered NSC 81 and are of the opinion that the approach to the basic problem as outlined in this paper is unrealistic since that approach envisages the stabilization of a front on the 38th parallel.\n\nThe Joint Chiefs of Staff, after consultation by two of its members with General MacArthur, agree with his concept that the initial objective to be attained is the destruction of North Korean forces. We believe, after the strength of the North Korean forces has been broken, which it is anticipated will occur south of 38th degrees North, that subsequently operations must take place both north and south of the 38th parallel. Such operations on the ground should be conducted by South Korean forces since it is assumed that the actions will probably be of a guerrilla character. General MacArthur has plans for increasing the strength of the South Korean forces so that they should be adequate at the time to cope with this situation.\n\nThe Joint Chiefs of Staff and General MacArthur agree that the occupation of Korea by U.N. forces subsequent to the cessation of actual hostilities should be limited to the principal cities south of the 38th parallel and that any occupation by U.N. forces should be terminated as early as possible. In this connection it is considered that all United States forces should be removed from Korea as early as practicable. Such action will be of great importance to our position with respect to all of Asia.\n\n[708면]\n\nIt is our understanding that General MacArthur, in consultation with Syngman Rhee, has agreed that the government of the Republic of Korea, the only government recognized by the United Nations, should be re-established in Seoul as early as practicable. General MacArthur states that he has reached an understanding with Mr. Rhee that he, Mr. Rhee, upon re-entry into Seoul will immediately grant a general amnesty to all except war criminals and that he will call for a general election to fill the 100 vacant seats in the Korean Parliament, and thereafter set up a single government for all Korea.\n\nThe Joint Chiefs of Staff suggest that NSC 81 be redrafted to reflect the foregoing principles and that the redraft, in lieu of NSC 81, be considered by the National Security Council.\n\nFor the Joint Chiefs of Staff:\n\nOmar N. Bradley", "notes": ["[주1] 이 각서는 9월 8일 레이(Lay) 사무국장에 의해 국가안전보장회의에 회람되었다."], "warn": false, "pages": ["50-708"], "search": "Omar N. Bradley 오마 브래들리 MacArthur 맥아더 Syngman Rhee 이승만(李承晩) Lay 레이"}, {"id": "50-d505", "order": 26, "date": "1950-09-09", "group": "B", "eyebrow": "50-d505 · Report by the National Security Council to the President  A memorandum dated September 11 by the Executive Secretary (Lay) to the National Security Council read as follows: “The President has this date approved the Conclusions contained in the reference report on the subject and directed their implementation by all appropriate executive departments and agencies of the U.S. Government.” This memorandum was annexed to the Source text. (NSC files)", "title": "국가안전보장회의가 대통령에게 올린 보고서", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-09-09"}, {"k": "시각", "v": null}, {"k": "발신", "v": "국가안전보장회의(National Security Council)", "txt": true}, {"k": "수신", "v": "대통령", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "보고서"}, {"k": "원문출처", "v": "Executive Secretariat Files: NSC 81/1", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d505"}], "summary": "38선 이북에서의 유엔군 작전의 조건과 한계를 설정하고, 소련 또는 중공군의 개입 시나리오별 대응 지침을 제시한다.", "points": ["유엔군의 정치적 목표는 1947~1949년 총회 결의에 따른 완전한 독립과 통일이며, 미국은 이를 지지하지만 일반전쟁의 실질적 위험을 감수해서는 안 된다.", "소련이 수동적으로 관망할 가능성은 낮으며, 북한 재점령이나 협상을 시도할 수 있다. 일반전쟁 회피를 위해 유리한 협상안에 대비해야 한다.", "중공군이 북한을 점령할 가능성도 배제할 수 없다. 소련은 북한군 패배를 막고 미중 간 전쟁을 유발하기 위해 중공군의 개입을 종용할 수 있다.", "소련·중공의 주요 병력이 북한에 진입하거나 의사를 밝히지 않은 경우, 유엔군 사령관은 북한군 격멸을 위한 38선 이북 작전을 승인받을 수 있다. 단, 만주·소련 국경을 넘어서는 안 되며, 소련 접경 지역과 만주 국경 지대에는 비한국인 부대를 배치하지 않는다.", "소련 또는 중공군이 북한을 점령할 경우 38선 이북의 지상 작전은 중단하고 38선까지 재점령한다. 북한 내 소련·중공군이 탐지되더라도 항공·해상 작전은 중단하지 않는다.", "소련 또는 중공군 주요 부대가 38선 이남에서 공공연히 또는 은밀히 투입될 경우, 유엔군 사령관은 방어 태세를 유지하고 상황을 악화시키지 말며 워싱턴에 보고해야 한다. 이 경우 미국은 세계대전이 임박했다는 가정 하에 행동해야 한다.", "포로 심문·교육·훈련을 심리전과 통일 과업에 활용하고, 북한 주민의 자발적 편입을 장려하며, 유엔군의 점령은 해방의 성격을 띠어야 한다.", "적대행위 종료 후 한국 통일은 유엔 감시 하의 비밀·보통선거로 이루어지며, 통일 정부 수립까지 유엔군을 주둔시키되 가능한 한 조기에 철수한다."], "primary": "**NSC 81/1**\n\n[워싱턴, 1950년 9월 9일]\n\n**한국에 관한 미국의 행동 방침**\n\n**문제**\n\n1. 한국에 관한 어떤 미국의 행동 방침이 미국의 국익을 증진하는 데 가장 적합할지 결정한다.\n\n**분석**\n\n2. 현재 한국에서의 유엔 조치는 1950년 6월 25일 및 6월 27일자 안전보장이사회 결의에 따라 취해지고 있다. 6월 25일 결의는 “즉각적인 적대행위 중지”를 요구하고, “북한 당국이 그들의 무장 병력을 38선으로 즉시 철수할 것”을 촉구했으며, 모든 유엔 회원국이 “이 결의의 [713면] 집행에 있어 유엔에 모든 지원을 제공하고 북한 당국에 지원을 제공하는 것을 삼갈 것”을 촉구했다. 6월 27일 결의는 북한 당국이 6월 25일 결의를 준수하지 않았음을 주목하고, “유엔 회원국들이 무력 공격을 격퇴하고 이 지역의 국제 평화와 안전을 회복하는 데 필요한 지원을 대한민국에 제공할 것”을 권고했다.\n\n3. 세 번째 결의(1950년 7월 7일)에서 안전보장이사회는 미국[유엔]에 한국 작전에 참가하는 모든 유엔 회원국 군대의 사령관을 지명할 것을 요청하고, 이들 군대가 유엔기를 게양할 것을 승인했다. 이 결의에 따라 맥아더 장군이 주한 유엔군 사령관으로 지명되었다. 대한민국도 자국 군대를 맥아더 장군의 지휘 하에 두었다.\n\n4. 한국에서 유엔의 정치적 목표는 1947년 11월 14일, 1948년 12월 12일, 1949년 10월 21일자 총회 결의에 따라 한국의 완전한 독립과 통일을 달성하는 것이다.\n\n5. 미국은 이 정치적 목표를 강력히 지지해왔다. 현재 한국에서의 유엔 조치가 소련 또는 중공과의 일반전쟁 위험을 실질적으로 증가시키지 않고 이 정치적 목표를 달성할 수 있다면, 유엔 조치를 이 결론까지 밀어붙이는 것을 주장하는 것이 우리의 이익에 부합할 것이다. 그러나 일반전쟁의 실질적 위험을 수반하는 조치를 한국에서 취하는 것은 우리의 국익에 부합하지 않을 것이며, 아마도 다른 우방 유엔 회원국들도 자신들의 이익에 부합한다고 보지 않을 것이다. 더 나아가, 비록 우리 판단으로는 그러한 조치가 일반전쟁의 실질적 위험을 수반하지 않는다 하더라도, 유엔의 대다수 회원국의 지지를 받지 못하는 조치를 한국에서 취하는 것은 우리의 국익에 부합하지 않을 것이다.\n\n6. 유엔군이 전선을 안정시키고, 북한군을 격퇴하며, 38선에 접근함에 따라, 미국과 안전보장이사회 결의를 지지하는 다른 유엔 회원국들이 취하는 결정과 조치, 그리고 크렘린이 취하는 결정이 적대행위가 북한군에 대한 작전에 국한될지, 아니면 제3차 세계대전의 위험이 크게 증가하도록 확산될지를 결정할 것이다.\n\n7. 소련이 한국의 전부 또는 대부분이 자국의 통제를 벗어나는 상황의 출현을 수동적으로 받아들일 것 같지는 않다. 단, 소련이 이를 방지할 수 있고 일반전쟁의 실질적 위험을 수반하지 않는 조치를 취할 수 있다고 믿거나, 현재 그러한 위험을 감수할 준비가 되어 있는 경우는 예외다. 소련은 유엔군이 [714면] 38선에 도달하기 전에 북한을 재점령하는 위험을 무릅쓰거나, 북한 정권과 소련군이 “북조선인민공화국” 영토 방위에 투입되도록 하는 약정을 체결하기로 결정할 수도 있다. 다른 방안으로 소련은 38선 이남에서 적대행위가 여전히 진행 중인 동안 협상에 의한 해결을 향한 어떤 움직임을 개시할 수도 있다. 일반전쟁 회피의 중요성을 고려할 때, 우리는 우리에게 유리한 해결을 협상할 준비가 되어 있어야 한다. 그러한 해결은 침략자가 침략을 반복하도록 유인하고 유엔의 권위와 힘을 훼손할 유리한 위치에 침략자를 남겨두어서는 안 된다.\n\n8. 정치적으로 가능성은 낮지만, 중공군이 북한을 점령하는 데 사용될 가능성도 있다. 비록 소련이 아마도 한국을 자국의 직접적인 이익권으로 간주할지라도 마찬가지다. 마찬가지로, 소련 또는 중공군이 한반도 남부에서의 전투에 주요 부대 단위로 공공연히 투입될 가능성도 있다. 이에 대한 소련의 결정은 소련 또는 중공, 또는 양자가 이 목표를 위해 현시점에서 일반전쟁에 참여할 준비가 되어 있는지에 달려 있다. 소련은 비록 이것이 일반전쟁의 가능성을 증가시키겠지만, 북한군의 패배를 막고 또한 우리가 강력하게 대응할 경우 미국과 중공 간의 전쟁을 유발할 목적으로 중공을 한국 전역에 끌어들이도록 설득하려 할 가능성이 있다.\n\n9. 소련 또는 중공이 북한을 재점령하거나, 유엔군이 38선에 도달하기 전에 유엔군의 북한 점령을 저지하려는 의도를 다른 어떤 방식으로도 표시하지 않을 가능성은 있으나 정치적으로는 일어날 법하지 않다. 이렇게 일어날 법하지 않은 상황에서는, 소련이 북한에 대한 통제 상실의 대가를 치르더라도 불간섭 정책을 따르기로 결정했다고 믿을 어떤 이유가 있을 것이다. 오로지 이 상황에서만 유엔 지상군은 일반전쟁의 위험을 크게 증가시키지 않고 북한에서 작전을 수행하거나 북한을 점령할 수 있을 것이다. 현시점에서 이 위험을 평가하기는 어려우며, 38선 이북으로 주요 병력을 이동시키는 우리의 조치는 소련이 어떤 방식으로든 거의 확실하게 대응할 상황을 만들어낼 것이다. 대한민국(ROK) 군대만이 38선 이북의 한국에서 작전을 수행하거나 점령한다면 일반적대행위의 위험은 감소할 것이나, 소련이나 중공의 개입 가능성은 배제되지 않을 것이다. 유엔 작전이 한국의 만주 또는 소련 국경을 넘어 확장되는 것은 허용되어서는 안 된다. 소련에 접한 북동부 도나 [715면] 만주 국경을 따라 위치한 지역에서 사용될 수 있는 어떠한 유엔 지상군에도 비한국인 부대를 포함시키지 않는 것이 정책이 되어야 한다.\n\n10. 9항에 언급된 상황에서, 38선 이북에서 취해질 수 있는 어떤 조치에 대해서도 유엔 회원국 다수의 지지를 확보하는 것의 중요성과, 38선 너머 지상 공세로 군사 투쟁을 새로운 단계로 이끄는 것을 피하기 위해 합리적인 모든 노력을 다했음을 분명히 보여주는 기록을 수립하는 것의 이점을 모두 염두에 두는 것이 바람직할 것이다. 따라서 유엔군이 주도권을 잡고 북한군을 격퇴·격멸하기 시작한 이후 어떤 시점에서 항복 조건을 제시해야 한다. 그러한 조건의 북한 측 수락 여부 문제는 물론 당시 존재하는 모든 정황 하에서의 자국의 이익에 대한 평가에 비추어 소련이 결정할 것이다.\n\n11. 유엔군은 안전보장이사회 결의에 의해 북한군을 38선 이북으로 철수시키도록 강제할 것이 분명히 위임되어 있으며, 이 임무 달성에 필요한 38선 이북에서의 군사 조치를 취할 법적 근거는 분명히 존재한다.\n\n12. 이 임무의 달성을 넘어서는 38선 이북에서의 군사 조치, 예를 들어 대한민국 아래에서의 한국 통일이라는 정치적 목표를 달성하기 위한 조치는 기존 안전보장이사회 결의에 의해 명확히 승인되어 있지 않다. 따라서 이 정치적 목표를 촉진하기 위한 군사 조치에 대한 유엔의 승인은 그러한 조치를 개시하기 위한 전제 조건이다. 그러한 승인이 forthcoming하지 않거나, 소련이 이러한 정치적 목표의 달성을 저지할 의도를 발표하거나 이를 위한 군사 조치를 취할 경우, 그 달성은 실현 가능하지 않을 것이다. 유엔군을 한국에 무기한 묶어두는 교착 상태나 6월 25일 이전의 현상으로 복귀하는 것은 바람직하지 않다는 점이 인식되어야 할 것이다.\n\n13. 소련의 북한 지배는 소비에트 세계 전역에 잘 알려진 경찰 및 선전 통제의 패턴을 가져왔다. 통일된 한국의 존속과 안정이 장기적으로 주로 한국인 자신에게 달려 있어야 하므로, 유엔의 과업에는 북한 주민을 유엔 헌장에 명시된 국제적 행동 기준을 수용하는 자유민의 전망으로 재정향시키는 일이 포함될 것이다.\n\n**결론** [주2]\n\n14. 한국에서의 향후 행동 방침에 관한 최종 결정은 현시점에서 내려질 수 없다. 왜냐하면 미국의 국익을 가장 잘 [716면] 증진할 행동 방침은 소련 및 중공의 조치, 우방 유엔 회원국과의 협의 및 동의, 그리고 일반전쟁의 위험에 대한 평가에 비추어 결정되어야 하기 때문이다.\n\n15. 유엔군은 북한군을 38선 이북으로 철수시키도록 강제하거나 이들 군대를 격멸하기 위해 38선 이북에서 작전을 수행할 법적 근거를 가지고 있다. 유엔군 사령관은 북한군을 격멸할 목적으로 한국에서 38선 이북으로의 격퇴를 수행하기 위한 상륙 및 공중 강습이나 지상 작전을 포함한 군사 작전을 수행할 권한을 부여받을 것이 예상된다. 단, 그러한 작전 시점에 소련이나 중공의 주요 병력이 북한에 진입한 바 없고, 진입 의사가 발표된 바 없으며, 북한에서 우리의 작전에 군사적으로 대응하겠다는 위협도 없었을 것을 조건으로 한다. 그러한 작전은 소련과의 주요 전쟁 위험을 수반하고 다른 우방 정부의 이익에 직접적으로 관련될 것이므로, 유엔군 사령관은 그러한 계획을 실행에 옮기기 전에 대통령 당시 관련된 다양한 요소들을 고려할 수 있도록 대통령의 승인을 얻어야 한다. 유엔 작전이 한국의 만주 또는 소련 국경을 넘어 확장되는 것은 허용되어서는 안 된다. 소련에 접한 북동부 도나 만주 국경을 따라 위치한 지역에서 사용될 수 있는 어떠한 유엔 지상군에도 비한국인 부대를 포함시키지 않는 것이 정책이 되어야 한다.\n\n16. 이와 동시에 합동참모본부는 주한 유엔군 사령관에게 북한의 점령 가능성에 대비한 계획을 수립하도록 지시할 권한을 부여받아야 한다. 그러나 그러한 계획의 실행은 미국 대통령의 명시적 승인이 있을 때만 이루어져야 하며, 유엔 회원국들과의 사전 협의와 그들의 승인에 달려 있을 것이다.\n\n17. 유엔군 사령관은 소련 또는 중공군에 의한 북한 점령 시 38선 이북에서의 어떠한 지상 작전도 수행해서는 안 되며, 38선까지 한국을 재점령해야 한다. 38선 이북의 항공 및 해상 작전은 단지 표적 지역에서 소련 또는 중공 군대의 존재가 탐지되었다는 이유만으로 중단되어서는 안 된다. 만약 소련 또는 중공이 사전에 북한을 재점령할 의사를 발표하고 그들의 군대가 공격받아서는 안 된다는 경고를 명시적으로든 묵시적으로든 보낸다면, 한국의 통일과 독립을 달성하기 위한 유엔 조치에 소련(또는 중공)의 협력을 확보하겠다는 명시적 목적으로 이 문제를 즉시 안전보장이사회에 회부해야 한다. 그러한 협력은 forthcoming하지 않을 것이므로, [717면] 유엔 다수의 의지를 무시한 데 대해 소련(또는 중공)을 규탄하는 것을 확보하기 위한 시도가 총회에서 이루어져야 한다. 38선 이북에서의 조치는 개시되거나 지속되어서는 안 되며, 이미 38선 이북에 유엔군이 있다면 워싱턴으로부터의 추가 지시가 있을 때까지 철수할 준비를 해야 한다. 소련의 38선까지의 점령에는 북한군의 38선 이북으로의 철수가 수반될 것으로 가정된다. 그렇지 않다면 이 지역에서의 유엔 군사 작전의 성격에 관한 새로운 결정이 내려져야 할 것이다.\n\n18. 38선 이남에서의 소련 주요 부대의 공공연하거나 은밀한 투입 시, 유엔군 사령관은 방어를 맡고, 상황을 악화시키는 어떠한 움직임도 취하지 않으며, 워싱턴에 보고할 것이다. 유엔군이 38선 이북에서 작전 중이고 소련 주요 부대가 공공연히 투입될 경우에도 동일한 조치가 취해져야 한다. 이 두 경우 중 어느 하나에서 미국은 상식적인 신중함에 따라 세계대전이 아마도 임박했다는 가정 하에 진행해야 할 것이다. 그러면 미국은 즉시 다음의 조치들을 취해야 한다:\n\na.\n\n상황에 비추어 행동을 국지화하고, 정치적 조치로 침략을 중단시키며, 그럼에도 전쟁이 뒤따를 경우 자유 세계의 단결을 보장하기 위해 외교적 조치와 유엔 제소를 포함한 모든 노력을 기울인다. 그러한 조치의 목표는 다음과 같다:\n\n(1)\n\n미국이 평화적 해결을 선호하며, 미국이 다른 유엔 회원국과 공동으로 그러한 해결을 수용할 조건을 세계에 분명히 한다.\n\n(2)\n\n필요하다면 침략에 대한 군사적 반대에 미국과 동참할 의사가 있는지 유엔 회원국들과 협의한다.\n\nb.\n\n소련 최고 지도자에 대한 직접 접근 가능성을 고려한다.\n\nc.\n\n계획의 완벽한 조정을 위해 선별된 동맹국들과 협의한다.\n\nd.\n\n세계대전의 비상사태에 대비할 수 있는 최선의 위치에 자국을 두며, 따라서 비상 전쟁 계획을 실행할 준비를 한다. 그러나 선택의 여지가 있는 한, 당시 존재하는 상황에 비추어 자국에게 가장 유리한 순간과 방식으로만 전면 적대행위에 돌입해야 한다.\n\ne.\n\n전략적 중요성이 거의 없는 지역에서의 미군의 군사적 약속을 최소화하면서, 미국의 국가 전쟁 계획 실행에 가장 기여하는 정도와 방식으로 침략과 관련된 조치를 취한다.\n\n19. 38선 이남에서의 중공 주요 부대의 공공연하거나 은밀한 투입 시:\n\na.\n\n미국은 스스로 중공과의 일반전쟁에 휘말리는 것을 허용해서는 안 된다.\n\n[718면] b.\n\n유엔 군대의 조치가 성공적인 저항의 합리적 가능성을 제공하는 한, 유엔군 사령관은 그러한 조치를 계속하고 중공에 대해 한국 외부에서 적절한 항공 및 해상 조치를 취할 권한을 부여받아야 한다. 후자의 조치는 추가적인 미국의 행동 방침을 결정하기 위해 당시 존재하는 여건에 비추어 미국의 군사적 약속을 검토할 때까지 계속되어야 한다.\n\nc.\n\n미국은 중공을 침략자로 규탄할 목적으로 이 문제를 안전보장이사회에 회부해야 한다.\n\n20. 38선 이남에서 소규모 소련 또는 중공 부대를 은밀히 투입하려는 시도 시, 유엔군 사령관은 그 행동을 계속해야 한다.\n\n21. 미국은 모든 정보 매체를 사용하여, 전쟁의 희생자가 된 한국 민중이 품을 수밖에 없는 비통함과 분노를 미국으로부터 돌려, 파괴적 충돌에 책임이 있는 당사자로서 조선 공산주의자, 소련, 그리고 그들이 수행하는 역할에 따라 중공을 향하도록 하기 위한 집중적 노력을 즉시 해야 한다. 현지 사령관과 주한 미국 대사관이 그들의 현재 선전 및 정보 프로그램을 증강할 수 있도록 특별 지원이 제공되어야 한다. 대한민국 정부는 선전 산출을 증가시키도록 장려되어야 하며, 이 노력에 물질적 지원을 받아야 한다.\n\n22. 북한 주민의 재정향을 이루고, 야전에서의 적군 이탈을 유발하며, 북한인 요원들이 국가 통일을 지향하는 활동에 참여하도록 훈련시키기 위해서는 다음의 조치들이 적절할 것이다:\n\na.\n\n포로 수용소로 이송된 이후의 포로 처우가 그들의 심리전 목적 및 위에 명시된 과업을 위한 활용, 훈련 및 사용을 지향해야 한다는 원칙을 수립한다.\n\nb.\n\n현재 한국에서 우리 수중에 있는 포로들을 위한 심문, 교화 및 훈련 센터를 시험 공장 규모로 즉시 설립한다. 이 프로젝트 담당 인력은 한국 또는 극동 경험, 언어 자격, 기질적 적성을 고려하여 최대한의 주의를 기울여 선발되어야 한다. 독일 및 일본 전쟁 포로의 교화에 관한 제2차 세계대전 경험, 그리스에서의 경험, 그리고 탈출한 소련 억류자들에 대한 최근 경험을 충분히 활용해야 한다.\n\n23. 북한군의 최종적 퇴각이나 급작스러운 붕괴 가능성에 대비하여, 미국은 특정 우방 유엔 회원국들과 북한군에 제시할 조건을 즉시 논의해야 한다. 이는 조건이 거부되고 소련 또는 중공군과의 충돌에 대한 [719면] 실질적 위험의 증거가 없을 경우, 한국에서 유엔의 정치적 목표를 달성하기 위한 38선 이북에서의 조치에 대한 지지를 구축하는 역할을 할 것이다. 제시된 조건이 수락되지 않는다면, 유엔군 사령관은 적군이 38선 너머로 퇴각하기 전에 가능한 한 많은 적을 격멸하려는 노력을 계속해야 하며, 지시가 있을 경우에만 북한을 점령할 목적으로 38선 이북에서 주력 부대로 작전을 계속해야 한다.\n\n24. 북한을 점령하기 위한 작전이 수행될 경우, 유엔군 사령관은 대한민국 정부와 협의하여 38선 이북의 점령 지역을 그 관할에 복속시키는 시기와 방법을 결정해야 한다. 그는 유엔군 사령관으로서 국제법에 따른 경우를 제외하고는 북한의 군대, 관리 및 주민에 대한 보복을 금지하고, 이 지령의 준수를 확보하기 위해 자신의 권한 내에 있는 조치를 취해야 한다.\n\n25. 38선 이북에서의 임무를 수행함에 있어 유엔군의 일반적 태도는 보복보다는 해방의 태도여야 한다. 북한의 더 넓은 지역들이 대한민국으로 자발적으로 편입되도록 장려하는 노력이 이루어져야 한다. 유엔군은 과도기에 안정적 영향력을 행사하려고 노력해야 한다. 그들은 한국 어느 지역에서의 유엔 점령이 지니는 비공격적이고 일시적인 성격을 강조하는 방식으로 행동하도록 노력해야 하며, 비한국인 군대는 실행 가능한 대로 조속히 철수되어야 한다.\n\n26. 북한군의 조직적 무장 저항이 실질적으로 종식되면, 미국은 자국 군대의 조속한 철수를 포함하여 한국에 대한 유엔의 책임 중 자국의 몫을 줄이려고 노력하고 그렇게 하고자 하는 바람을 발표해야 한다. 단, 유엔에 대한 약속을 이행할 의사가 없음을 암시해서는 안 된다. 유엔 한국 위원단 또는 이를 대신할 기구가 수립한 원칙 아래 운용되는 대한민국 군대가 먼저 남은 북한 부대의 무장 해제와 항복 조건의 집행에 나서야 한다. 게릴라 활동은 주로 대한민국 군대가 최소한의 유엔 파견대 참여로 처리해야 한다. 단, 한국군 혼자서 게릴라 활동에 대처할 능력이 없음이 입증될 경우는 예외다.\n\n27. 미국은 대한민국 정부가 한국 내에서 문제를 일으키려는 공산주의자들의 노력에 대해 강력한 조치를 취해야 할 것이며, 이 조치들에서 미국의 지원을 필요로 할 수도 있음을 인식해야 한다. 동시에, 미국은 공산주의 위협을 관리 가능한 수준으로 축소하기 위해 사회적·경제적 개혁이 필요할 것임을 인식해야 한다.\n\n[720면]\n\n28. 미국은 유엔에서 적대행위 종료 후 기간 동안 한국에서의 유엔 활동을 규율할 다음 원칙들의 채택을 주창해야 한다:\n\na.\n\n한국의 통일은 유엔의 주관 하에 실시될 보통 성인 선거권에 기반한 자유로운 비밀 투표 선거에서 선택된 한국 국민의 대표들에 의해 마련되어야 한다.\n\nb.\n\n대한민국 정부는 서울에 재수립되어 한국의 유일한 합법 정부로 승인되어야 하며, 한국 통일과 관련하여 발생하는 문제들에 관해 협의되어야 한다. 그 정부는 보복의 정신을 제거하는 것이 바람직함을 충분히 고려하여 권력을 행사할 것이 기대되어야 한다.\n\nc.\n\n통일되고 독립된 한국이 직면할 것이 확실한 막대한 경제적, 사회적, 정치적 문제들의 해결에 기여할 의무가 유엔 회원국들에게 있다. 유엔의 아시아 회원국들은 한국에 대한 특별한 지역적 관심을 고려하여 지원 계획에 실질적인 기여를 하도록 촉구되어야 한다.\n\n29. 위의 원칙들에 일치하여, 미국은 다음의 조치들을 취해야 한다:\n\na.\n\n한국에서 필요한 조치에 대한 유엔의 지지를 확보하고 공고히 하기 위해 외교 경로와 유엔 안전보장이사회 및 총회를 통해 적극적인 조치를 취한다.\n\nb.\n\n이전의 유엔 결의의 일반적 틀 내에서 그리고 미국이 그러한 해결의 기초가 되어야 한다고 믿는 유엔 헌장 및 일반적 목표와 원칙에 일치하는 방식으로 한국 문제의 해결을 추구하겠다는 결의를 유엔에서 발표할 준비를 갖춘다.\n\nc.\n\n그러한 발표가 이루어질 때, 미국은 위에 열거된 원칙들에 따라 한국의 장래에 관해 연구하고 총회에 권고할 적절한 유엔 기구의 창설을 권고하거나 다른 국가들이 권고하도록 촉구해야 한다. 인도 대표가 그러한 기구의 의장으로 활동하는 것이 적절할 수도 있다.\n\n30. 미국은 유엔 한국 위원단 또는 이를 대신할 기구가 수립될 경우 그 기구가 한국 문제에 대한 계속적인 심의 임무를 부과받도록 하고, 대한민국이 필요로 하는 군사 및 국내 치안 병력의 규모와 성격에 관한 권고를 하도록 지시받을 것을 촉구해야 한다. 미국은 유엔 한국 위원단이 대한민국과 소련을 포함한 다른 국가들이 개별적으로 어떠한 침략도 삼가기로 하는 정치적 약속을 수반하는 한국의 영구 중립화의 바람직성을 고려해야 한다고 권고해야 한다. 유엔의 보장 문제는 연구되어야 하지만 이 단계에서 이 점에 대한 미국의 어떠한 약속도 이루어져서는 안 된다.\n\n[721면]\n\n31. 미국은 유엔군이 통일되고 독립된 국가가 확고하게 수립될 때까지, 그리고 오직 그때까지만 한국에 유지되어야 한다고 촉구해야 하며, 재개된 침략이나 내부 분쟁을 억제할 목적으로 미군을 유엔군의 파견대로 활용할 수 있도록 준비되어 있어야 한다. 이들 군대는 실행 가능한 대로 조속히 한국에서 철수되어야 한다. 그 동안, 그리고 어쨌든 우리 군대의 수는 가능한 한 감축되어야 하며, 그들은 바람직하게는 일부 아시아 파견대를 포함한 다른 유엔 파견대와 함께만 복무해야 한다.\n\n----- 각주 -----\n[주1] 9월 11일자로 행정간사(레이)가 국가안전보장회의에 보낸 각서에는 다음과 같이 적혀 있었다. “대통령은 금일 해당 주제에 관한 참조 보고서에 포함된 결론을 승인하고 모든 관련 행정부처 및 미국 정부 기관이 이를 이행하도록 지시하였다.” 이 각서는 원문 문서에 부속되어 있었다. (NSC 파일)\n[주2] 결론의 요지는 9월 15일 육군부에 의해 맥아더 장군에게 전달되었다. 청문회, 718면 참조.", "secondary": "top secret \n NSC 81/1\n\n[Washington, September 9, 1950.]\n\nUnited States Courses of Action With Respect to Korea\n\nthe problem\n\n1. To determine what United States course of action with respect to Korea would be best calculated to advance the national interests of the United States.\n\nanalysis\n\n2. The present United Nations action in Korea is being taken in pursuance of the Security Council resolutions of June 25 and June 27, 1950. The Resolution of June 25 called for “the immediate cessation of hostilities”, called upon “the authorities of North Korea to withdraw forthwith their armed forces to the thirty-eighth parallel”, and called upon all U.N. members “to render every assistance to the United [713면] Nations in the execution of this resolution and to refrain from giving assistance to the North Korean authorities.” The Resolution of June 27 noted the failure of the North Korean authorities to comply with the resolution of June 25 and recommended that “the Members of the United Nations furnish such assistance to the Republic of Korea as may be necessary to repel the armed attack and to restore international peace and security in the area.”\n\n3. In a third resolution (July 7, 1950), the Security Council requested the United Nations [States] to designate a Commander for all the forces of the members of the United Nations in the Korean operation, and authorized that these forces fly the U.N. flag. In response to this resolution, General MacArthur has been designated Commander of the U.N. forces in Korea. The Republic of Korea has also placed its forces under General MacArthur’s command.\n\n4. The political objective of the United Nations in Korea is to bring about the complete independence and unity of Korea in accordance with the General Assembly resolutions of November 14, 1947, December 12, 1948, and October 21, 1949.\n\n5. The United States has strongly supported this political objective. If the present United Nations action in Korea can accomplish this political objective without substantially increasing the risk of general war with the Soviet Union or Communist China, it would be in our interest to advocate the pressing of the United Nations action to this conclusion. It would not be in our national interest, however, nor presumably would other friendly members of the United Nations regard it as being in their interest, to take action in Korea which would involve a substantial risk of general war. Furthermore, it would not be in our national interest to take action in Korea which did not have the support of the great majority of the United Nations, even if, in our judgment, such action did not involve a substantial risk of general war.\n\n6. As U.N. forces succeed in stabilizing the front, driving back the North Korean forces, and approaching the 38th parallel, the decisions and actions taken by the United States and other U.N. members which are supporting the Security Council resolutions, and those taken by the Kremlin, will determine whether hostilities are confined to operations against the North Koreans or spread so that the danger of a third world war is greatly increased.\n\n7. It is unlikely that the Soviet Union will passively accept the emergence of a situation in which all or most of Korea would pass from its control, unless it believes that it can take action which would prevent this and which would not involve a substantial risk of general war or unless it is now prepared to accept such risk. The Soviet Union may decide that it can risk reoccupying Northern Korea before [714면] United Nations forces have reached the 38th parallel, or the conclusion of an arrangement with the North Korean regime under which Soviet forces would be pledged to the defense of the territory of the “People’s Republic of Northern Korea”. Alternatively, the Soviet Union might initiate some move toward a negotiated settlement while hostilities are still in progress south of the 38th parallel. In view of the importance of avoiding general war, we should be prepared to negotiate a settlement favorable to us. Such a settlement should not leave the aggressor in an advantageous position that would invite a repetition of the aggression and that would undermine the authority and strength of the United Nations.\n\n8. Although politically unlikely, it is possible that Chinese Communist forces might be used to occupy North Korea, even though the Soviet Union probably regards Korea as being in its own direct sphere of interest. Similarly, it is also a possibility that Soviet or Chinese Communist forces may be openly employed in major unite in the fighting in the southern part of the peninsula. Soviet decision in this regard would depend on whether the USSR or the Chinese Communists or both are ready to engage in general war at this time for this objective. It is possible that the Soviet Union, although this would increase the chance of general war, may endeavor to persuade the Chinese Communists to enter the Korean campaign with the purpose of avoiding the defeat of the North Korean forces and also of fomenting war between the United States and the Chinese Communists should we react strongly.\n\n9. It is possible, but politically improbable, that no action will be taken by the Soviet Union or by the Chinese Communists to re-occupy Northern Korea or to indicate in any other way an intention to prevent the occupation of Northern Korea by United Nations forces before the latter have reached the 38th parallel. In this unlikely contingency there would be some reason to believe that the Soviet Union had decided to follow a hands-off policy, even at the expense of the loss of control of Northern Korea. Only in this contingency could the U.N. ground forces undertake to operate in or to occupy Northern Korea without greatly increasing the risk of general war. It is difficult to appraise this risk at this time, and our action in moving major forces north of the 38th parallel would create a situation to which the Soviet Union would be almost certain to react in some manner. If only the Republic of Korea (R.O.K.) forces operate in or occupy Korea north of the 38th parallel, the risk of general hostilities would be reduced, although the possibility of Soviet or Chinese Communist intervention would not be precluded. U.N. operations should not be permitted to extend across the Manchurian or USSR borders of Korea. It should be the policy not to include any non-Korean units in any U.N. ground forces which may be used in the north-eastern province [715면] bordering the Soviet Union or in the area along the Manchurian border.\n\n10. It will be desirable to bear in mind in the contingency stated in paragraph 9 both the importance of securing support of the majority of U.N. members for any action that might be taken north of the 38th parallel and the advantage of establishing a record that will clearly show that every reasonable effort has been made to avoid carrying the military struggle into a new phase by a land offensive beyond the 38th parallel. Therefore, at some point after the U.N. forces begin to take the initiative and to drive back and destroy the North Korean forces, terms of surrender should be offered. The question of the acceptance of such terms by the North Koreans would of course be determined by the USSR in the light of its appraisal of its interests under all the circumstances then existing.\n\n11. The U.N. forces are clearly committed by the Security Council resolutions to compel the withdrawal of the North Korean forces behind the 38th parallel and there is a clear legal basis for taking such military actions north of the 38th parallel as are necessary in accomplishing this mission.\n\n12. Military actions north of the 38th parallel which go beyond the accomplishment of this mission as, for example, to accomplish the political objective of unifying Korea under the Republic of Korea, are not clearly authorized by existing Security Council resolutions. Accordingly, United Nations approval for military actions in furtherance of this political objective is a prerequisite to their initiation. Should such approval not be forthcoming, or should the USSR announce its intention, or take military action, to prevent the accomplishment of this political objective, its accomplishment would not be feasible. It would have to be recognized that a stalemate freezing the U.N. forces indefinitely in Korea or returning to the status quo ante June 25, would be undesirable.\n\n13. Soviet domination of North Korea has brought with it the pattern of police and propaganda control well known throughout the Soviet world. Since the existence and stability of a unified Korea must in the long run depend largely upon the Korean people themselves, the tasks of the United Nations will include the reorientation of the North Korean people toward the outlook of free peoples who accept the standards of international behavior set forth in the United Nations Charter.\n\nconclusions [주2]\n\n14. Final decisions cannot be made at this time concerning the future course of action in Korea, since the course of action which will best [716면] advance the national interest of the United States must be determined in the light of: the action of the Soviet Union and the Chinese Communists, consultation and agreement with friendly members of the United Nations, and appraisal of the risk of general war.\n\n15. The United Nations forces have a legal basis for conducting operations north of the 38th parallel to compel the withdrawal of the North Korean forces behind this line or to defeat these forces. It would be expected that the U.N. Commander would receive authorization to conduct military operations, including amphibious and airborne landings or ground operations in pursuance of a roll-back in Korea north of the 38th parallel, for the purpose of destroying the North Korean forces, provided that at the time of such operations there has been no entry into North Korea by major Soviet or Chinese Communist forces, no announcement of intended entry, nor a threat to counter our operations militarily in North Korea. Since such operations would involve a risk of major war with the Soviet Union and would directly involve the interests of other friendly governments, the U.N. Commander should, prior to putting any such plan into execution, obtain the approval of the President in order that he may give consideration at the time to the various elements involved. U.N. operations should not be permitted to extend across the Manchurian or USSR borders of Korea. It should be the policy not to include any non-Korean units in any U.N. ground forces which may be used in the north-eastern province bordering the Soviet Union or in the area along the Manchurian border.\n\n16. Concurrently the Joint Chiefs of Staff should be authorized to direct the Commander of the U.N. forces in Korea to make plans for the possible occupation of North Korea. However, the execution of such plans should take place only with the explicit approval of the President of the United States, and would be dependent upon prior consultation with and the approval of members of the U.N.\n\n17. The United Nations Commander should undertake no ground operations north of the 38th parallel in the event of the occupation of North Korea by Soviet or Chinese Communist forces, but should reoccupy Korea up to the 38th parallel. Air and naval operations north of the 38th parallel should not be discontinued merely because the presence of Soviet or Chinese Communist troops is detected in a target area. If the Soviet Union or the Chinese Communists should announce in advance their intention to reoccupy North Korea and give warning, either explicitly or implicitly, that their forces should not be attacked, the matter should be immediately referred to the Security Council with the stated purpose of securing the cooperation of the Soviet Union (or the Chinese Communists) in U.N. action to achieve the unity and independence of Korea. Since such cooperation would not be forthcoming, [717면] an attempt should then be made in the General Assembly to secure the condemnation of the Soviet Union (or the Chinese Communists) for flouting the will of the U.N. majority. Action north of “the 38th parallel should not be initiated or continued, and if any U.N. forces are already north of the 38th parallel they should prepare to withdraw pending further directives from Washington. It is assumed that Soviet occupation down to the 38th parallel would be accompanied by the withdrawal of North Korean forces behind the 38th parallel. Otherwise new decisions would have to be made as to the nature of U.N. military operations in the area.\n\n18. In the event of the open or covert employment of major Soviet units south of the 38th parallel, the U.N. Commander will assume the defense, make no move to aggravate the situation, and report to Washington. The same action should be taken in the event that U.N. forces are operating north of the 38th parallel and major Soviet units are openly employed. In either of these events the United States in common prudence would have to proceed on the assumption that global war is probably imminent. The United States should then take steps immediately to:\n\na.\n\nMake every effort in the light of the circumstances to localize the action, to stop the aggression by political measures and to ensure the unity of the free world if war nevertheless follows, such measures to include direct diplomatic action and resort to the United Nations with the objectives of:\n\n(1)\n\nMaking clear to the world United States preference for a peaceful settlement and the conditions upon which the United States would, in concert with other members of the United Nations, accept such a settlement.\n\n(2)\n\nConsulting with members of the United Nations regarding their willingness to join with the United States in military opposition, if necessary, to the aggression.\n\nb.\n\nGive consideration to the possibility of a direct approach to the highest Soviet leaders.\n\nc.\n\nConsult with selected allies to perfect coordination of plans.\n\nd.\n\nPlace itself in the best possible position to meet the eventuality of global war, and therefore prepare to execute emergency war plans; but should, in so far as it has any choice, enter into full-scale hostilities only at the moment and in the manner most favorable to it in the light of the situation then existing.\n\ne.\n\nWhile minimizing United States military commitments in areas of little strategic significance, take action with reference to the aggression to the extent and in the manner best contributing to the implementation of United States national war plans.\n\n19. In the event of the open or covert employment of major Chinese Communist units south of the 38th parallel:\n\na.\n\nThe United States should not permit itself to become engaged in a general war with Communist China.\n\n[718면] b.\n\nAs long as action by U.N. military forces offers a reasonable chance of successful resistance, the U.N. Commander should continue such action and be authorized to take appropriate air and naval action outside Korea against Communist China. The latter action should be continued pending a review of U.S. military commitments in the light of conditions then existing to determine further U.S. courses of action.\n\nc.\n\nThe United States should take the matter to the Security Council with the purpose of condemning the Chinese Communists as aggressors.\n\n20. In the event of an attempt to employ small Soviet or Chinese Communist units covertly south of the 38th parallel, the United Nations Commander should continue the action.\n\n21. The United States should immediately make an intensive effort, using all information media, to turn the inevitable bitterness and resentment of the war-victimized Korean people away from the United States and to direct it toward the Korean Communists, the Soviet Union, and, depending on the role they play, the Chinese Communists, as the parties responsible for the destructive conflict. Special assistance should be given to the field commander and the U.S. Embassy in Korea to augment their present propaganda and information programs. The Government of the R.O.K. should be encouraged to increase its propaganda output and should be given material assistance in this effort.\n\n22. In order to effect the reorientation of the North Korean people, to cause defection of enemy troops in the field, and to train North Korean personnel to participate in activities looking to unification of the country, the following steps would be appropriate:\n\na.\n\nEstablish the principle that the treatment of POW’s, after their transfer to places of internment, shall be directed toward their exploitation, training and use for psychological warfare purposes, and for the tasks specified above.\n\nb.\n\nSet up immediately on a pilot-plant scale an interrogation, indoctrination and training center for those POW’s now in our hands in Korea. Personnel in charge of this project must be selected with the greatest care, taking into consideration Korean or Far Eastern experience, language qualifications, and temperamental aptitude. Full advantage should be taken of World War II experience in the indoctrination of German and Japanese prisoners of war, of experiences in Greece, and of recent experience with escaped Soviet detainees.\n\n23. In preparation for the possible eventual retreat or sudden collapse of North Korean forces, the United States should immediately discuss with certain friendly members of the United Nations the terms to be offered the North Korean forces. This will serve to develop support for action north of the 38th parallel to accomplish the political objective of the United Nations in Korea in the event that the terms are rejected and there is no evidence of a substantial risk of a clash [719면] with Soviet or Chinese Communist forces. If the terms offered are not accepted, the U.N. Commander should continue his efforts to destroy as many of the enemy as possible before they retreat across the 38th parallel and only if so directed should continue operations north of the 38th parallel with major forces for the purpose of occupying North Korea.\n\n24. If operations are undertaken to occupy northern Korea, the United Nations Commander should, in consultation with the Government of the R.O.K., determine the timing and method of subjecting occupied territory north of the 38th parallel to its jurisdiction. He should forbid, as commander of the U.N. forces, reprisals against the forces, officials, and populace of North Korea, except in accordance with international law, and take such measures as are within his power to secure compliance with this directive.\n\n25. In performing their mission beyond the 38th parallel, the general posture of the United Nations forces should be one of liberation rather than retaliation. An effort should be made to encourage the voluntary adherence of ever larger areas of North Korea to the R.O.K. The United Nations forces should attempt to exert a stabilizing influence during the transition period. They should endeavor to conduct themselves in such a way as to emphasize the non-aggressive and temporary nature of the U.N. occupation in any part of Korea, and non-Korean forces should be removed as soon as practicable.\n\n26. When organized armed resistance by the North Korean forces has been brought substantially to an end, the United States should attempt to reduce its share of the U.N. responsibilities for Korea, including withdrawal of its own forces as soon as practicable, and announce its desire to do so, without, however, implying any unwillingness to fulfill its U.N. commitments. The R.O.K. forces, operating under principles established by the U.N. Commission for Korea, or such body as may be established to take its place, should take the lead in disarming remaining North Korean units and enforcing the terms of surrender. Guerrilla activity should be dealt with primarily by the forces of the Republic of Korea with minimum participation by U.N. contingents, unless the Korean forces alone should prove unable to cope with the guerrilla activities.\n\n27. The United States should recognize that the Government of the R.O.K. will have to take strong measures against Communist efforts to cause trouble in Korea and that it may require support in these measures from the United States. At the same time, the United States should recognize that social and economic reforms will be necessary in order to reduce the Communist menace to manageable proportions.\n\n[720면]\n\n28. The United States should advocate in the United Nations the adoption of the following principles to govern the action of the United Nations in Korea in the post-hostilities period:\n\na.\n\nThe unification of Korea should be arranged by representatives of the Korean people chosen in free secret-ballot elections on the basis of universal adult suffrage, the elections to be held under the auspices of the United Nations.\n\nb.\n\nThe Government of the R.O.K. should be re-established in Seoul and recognized as the only lawful government in Korea and should be consulted on problems arising in connection with the unification of Korea. That Government should be expected to exercise its powers with full regard to the desirability of eliminating the spirit of vengeance.\n\nc.\n\nAn obligation rests upon the members of the United Nations to contribute to the solution of the tremendous economic, social and political problems certain to confront a unified and independent Korea. Asiatic members of the United Nations should be urged to make a substantial contribution to the assistance program in view of their special regional interest in Korea.\n\n29. In consonance with the above principles, the United States should take the following steps:\n\na.\n\nTake vigorous action through diplomatic channels and in the United Nations Security Council and General Assembly to assure and solidify United Nations support of necessary action in Korea.\n\nb.\n\nBe prepared to announce in the United Nations its determination to seek a solution of the Korean problem within the general framework of previous United Nations Resolutions and in a manner consistent with the United Nations Charter and the general aims and principles which the United States believes should underlie such a solution.\n\nc.\n\nWhen such an announcement is made, the United States should recommend or urge others to recommend the creation of an appropriate United Nations body which would study and make recommendations to the General Assembly on the future of Korea in accordance with the principles enumerated above. It might be appropriate for the representative of India to act as chairman of such a body.\n\n30. The United States should urge that the U.N. Commission on Korea or such body as may be established to take its place be charged with continuing consideration of Korean problems and instructed to make recommendations as to the size and character of the military and internal security forces needed by the R.O.K. The U.S. should recommend that the U.N. Commission should consider the desirability of permanent neutralization of Korea accompanied by political undertakings by the R.O.K. and by other states separately, including the USSR, to refrain from any aggression. The question of U.N. guarantee should be studied but no U.S. commitment on this point should be made at this stage.\n\n[721면]\n\n31. The United States should urge that U.N. forces be retained in Korea until and only until a unified and independent state has been firmly established and should be prepared to make available United States forces as a contingent of the U.N. forces for the purpose of deterring renewed aggression or internal strife. These forces should be removed from Korea as early as practicable. Meanwhile, and in any event, the number of our forces should be reduced so far as possible, and they should serve only in conjunction with other U.N. contingents, preferably including some Asiatic contingents.", "notes": [], "warn": false, "pages": ["50-713", "50-714", "50-715", "50-716", "50-717", "50-718", "50-719", "50-720", "50-721"], "search": "맥아더(Douglas MacArthur) 레이(James S. Lay, Jr.)"}, {"id": "50-d506", "order": 27, "date": "1950-09-11", "group": "B", "eyebrow": "50-d506 · Memorandum by the Secretary of State to the President", "title": "국무장관이 대통령에게 보낸 각서", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-09-11"}, {"k": "시각", "v": null}, {"k": "발신", "v": "Acheson 애치슨(국무장관)", "txt": true}, {"k": "수신", "v": "Truman 트루먼(대통령)", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "795.00/9–1150", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d506"}], "summary": "애치슨이 나진 폭격이 초래할 정치적 위험을 따지며, 군사적 이득과 심각한 정치·군사적 결과의 위험을 저울질하기 전에 결정을 내리지 말라고 권고한다.", "points": ["나진은 소련 국경에서 17마일 떨어진 곳으로, 이에 대한 폭격은 심각한 위험을 수반한다.", "대통령이 승인한 맥아더 지령은 작전기가 소련 및 만주 국경에 'well clear(충분히 떨어져)' 있을 것을 명시했으며, 이는 단순한 영공 침범 회피 이상의 의미다.", "크렘린은 소련 국경 지역, 특히 블라디보스토크 주변에 거의 병적인 민감성을 보이며, 작전은 국경 침범이나 그렇게 믿어지는 사건을 유발해 예측 불가능한 결과를 낳을 수 있다.", "국경 침범이 없더라도, 이러한 작전은 소련으로 하여금 북한을 재점령하거나 전략폭격기를 북한군에 제공하는 등의 보호 조치를 취하게 만들 수 있다.", "국방부는 나진이 북한 석유 공급량의 약 28%를 저장하고 있다고 보지만, 전선과의 거리와 소련령의 광범위한 저장 시설을 고려할 때 그 중요성은 명확하지 않다."], "primary": "top secret\n\nWashington, 1950년 9월 11일.\n\n제목: 나진(Rashin) 폭격 제안을 둘러싼 고려사항\n\n미국의 현 정책은 군사적으로나 정치적으로나 한국 분쟁의 국지화와 불필요한 적대 행위 확대 혹은 전면전 발발의 회피를 지향하고 있다는 것이 우리의 이해다. 이 점에 대해 어떤 의견 대립이 있다면 지체 없이 분명히 해야 한다. 국무부가 군사 작전의 진행을 어떤 식으로든 저해할 의도가 없다는 것은 명백하지만, 동시에 제안된 군사 행동이 이 정책에 영향을 미칠 수 있는 정치적 위험과 발생 가능한 결과를 평가하려고 시도하는 것이 국무부의 의무다.\n\n소련 영토에서 불과 17마일 떨어진 도시인 나진을 다시 폭격하자는 제안은 국무부의 견해로는 심각한 위험을 수반하는 작전이다. 38도선 이북 한국의 특정 군사 목표물에 대한 폭격 작전을 승인하는, 대통령이 재가한 맥아더 장군에 대한 지령에는 그러한 작전에 참여하는 비행기들이 소련과 만주 국경에 'well clear(충분히 떨어져)' 있어야 한다는 단서가 포함되어 있다. 소련 국경에 'well clear' 하게 있으라는 이 명령은 그 문구 자체로 볼 때 단순히 그러한 국경의 침범을 피하라는 명령 이상이다. 그런 정도라면 그렇게 명시되었을 것이다.\n\n크렘린은 소련 국경 지역에 대해 강렬하고 거의 병적인 민감성을 지니고 있다. 이는 극동 지역, 특히 블라디보스토크 인근에 대해 항상 그러했다. 후자는 소련 당국이 소련의 안보에 중대한 중요성을 지닌다고 간주하는 지역이다. 그 부근에서의 어떤 성격의 군사 작전이든 그들에게 가장 깊은 우려를 안기고 지속적인 경계 상태에 두지 않을 수 없다. 제안된 작전에 수반되는 구체적인 위험으로는, 현대 항공전이 수행되는 고속과 고고도에 의해 결코 줄어들지 않는 것이지만, 국경 침범이나 아니면 단순히 국경 침범이 가능했다는 소련 측의 확신만으로도 현지 소련 지휘관들이 우리 비행기를 요격하려 들도록 유도할 수 있다는 점이다. 이는 헤아릴 수 없는 결과를 초래할 사건을 낳을 수 있다. 적어도 말하자면, 현재의 격앙된 여론 상태를 고려할 때 이는 미국과 소련 양국 모두에 가장 심각한 파장을 일으킬 것이다. 우리 비행기들의 만주 국경 침범 혐의와 황해에서의 소련 비행기 격추 사건이 잇따라 발생한 직후라면 이는 추가적인 충격을 가질 것이다.\n\n그러나 사건이 발생하지 않고 소련의 국경에 대한 이러한 극도의 민감성을 감안하더라도, 제안된 성격의 작전은 크렘린으로 하여금 침범과 피해 가능성에 대비한 보호 조치를 취할 필요성을 확신시키고 따라서 소련 군대의 북한 재점령으로 이어지게 할 수 있다. 이와 관련하여, 그들이 소련의 전략폭격기를 북한군의 처분에 맡겨 한국의 유엔군과 심지어 일본의 우리 기지에 대한 공격에 사용하게 할 가능성도 배제할 수 없다.\n\n요컨대, 나진이나 소련 혹은 만주 국경에 그와 동등하게 근접한 다른 어떤 장소에 대한 폭격은 소련이 바로 우리가 피하고자 하는 방식으로 대응하도록 만들 절박한 위험을 안고 있다. 그러므로 결정이 내려지기 전에, 나진에 대한 제안된 공격에서 기대될 수 있는 구체적인 군사적 이점을 위에 개략적으로 서술한 중대한 정치적·군사적 결과의 위험에 견주어 신중히 저울질해야 한다는 것이 국무부의 의견이다. 국방부는 나진이 북한 석유 공급량의 약 28%를 위한 저장 시설을 제공하는 것으로 믿어진다고 밝혔으나, 나진과 전투 전선 사이의 거리, 그리고 자체로도 저장과 비축을 위한 광범위한 시설을 제공하고 있을 소련 영토와의 근접성을 고려하면 이것의 중요성은 명확하지 않다. [주1]\n\nDean Acheson", "secondary": "top secret\n\nWashington, September 11, 1950.\n\nSubject: Considerations Surrounding Proposed Bombing of Rashin (Najin)\n\nIt is our understanding that the present policy of the United States, both military and political, is directed toward a localization of the conflict in Korea and the avoidance of any unnecessary extension of hostilities or the outbreak of a general war. If there is any lack of agreement on this point, it should be clarified without delay. It is obviously not the intention of the Department of State in any way to inhibit the progress of military operations, but at the same time it is the duty of the Department to attempt to assess the political risks and possible consequences of proposed military actions as they might affect this policy.\n\nThe proposal to again bomb Rashin, a town but seventeen miles from Soviet territory, is an operation which in the opinion of the Department entails serious risks. The directive to General MacArthur, approvided by the President, which authorizes bombing operations, against specified military targets in Korea north of the 38th parallel contains a stipulation that planes engaged in such operations should stay “well clear” of the Soviet and Manchurian frontiers. This injunction to stay “well clear” of the Soviet frontier is by its terms more than an injunction simply to avoid a violation of those frontiers, or it would have been so stated.\n\nThe Kremlin has an intensive and almost pathological sensitivity regarding Soviet frontier areas. This has always been true with respect to the Far Eastern area and especially the immediate surroundings of Vladivostok. The latter is an area which Soviet authorities consider of vital importance to the security of the Soviet Union. Military operations of any character in that vicinity cannot but give them deepest concern and keep them in a state of constant alert. A specific risk involved in the proposed operation, by no means lessened by the [722면] high speeds and high altitudes at which modern air warfare is conducted, is that either a violation or merely a Soviet conviction that a violation of the frontier was possible would induce the local Soviet commanders to endeavor to intercept our planes. This could well produce an incident with incalculable consequences. To say the least it would have most serious repercussions in both the United States and the Soviet Union given the present inflamed state of opinion. It would enjoy additional impact following so closely on the alleged violation of the Manchurian frontier by our planes and the recent episode involving the shooting down of the Soviet plane in the Yellow Sea.\n\nYet even in the absence of an in
