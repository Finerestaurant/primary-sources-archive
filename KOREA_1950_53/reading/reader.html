hiefs of Staff are telegraphing to Lord Tedder.\n\nWashington, [November 17, 1950.]", "notes": ["[주1] 원문 자료에는 이 문서가 11월 17일 프랭크스 경에 의해 상무부(Mr. Merchant) 사무실로 전달되었다고 적혀 있다.", "[주2] 인쇄되지 않은 이 비망록은 11월 13일 오후 7시 런던에 보낸 제2487호 전문(1144면)에 기초한 것이다."], "warn": false, "pages": [], "search": "베빈(Mr. Bevin, 영국 외상) 프랭크스 경(Sir Oliver Franks, 주미 영국 대사) 애치슨(Mr. Acheson, 미국 국무장관) 테더 경(Lord Tedder) Merchant(Mr. Merchant, 미국 국무부)"}, {"id": "50-d847", "order": 47, "date": "1950-11-17", "group": "D", "eyebrow": "50-d847 · Memorandum of Conversation, by the Ambassador in Korea (Muccio)  This memorandum was transmitted to the Department under cover of a letter to Mr. Rusk, not printed, which was received on December 4. The letter indicated that the conversation took place on the evening of November 16.", "title": "대화 비망록, 주한대사(무초) 작성", "badge": "secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-11-17"}, {"k": "시각", "v": null}, {"k": "발신", "v": "Muccio 주한대사", "txt": true}, {"k": "수신", "v": "국무부", "txt": true}, {"k": "장소", "v": "Tokyo"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "회담 비망록"}, {"k": "원문출처", "v": "795.00/11–1750", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d847"}], "summary": "맥아더가 무초에게 중공군은 3만을 넘지 못했고 곧 시작될 총공세로 10일 안에 전 지역을 확보한 뒤 8군을 일본으로 철수시키겠다고 말하다.", "points": ["맥아더는 중공군의 동기를 크렘린과는 독립적으로 움직이는 자체 제국주의적 야망으로 해석했다.", "맥아더는 국경을 넘은 중공군 병력을 2만5천에서 3만 명 이하로 확신했다. 은밀한 수단으로는 더 이상 넘어올 수 없었다고 보았다.", "압록강 철교의 한국 쪽 끝을 파괴하라는 승인을 마침내 받았으며, 현 전선과 국경 사이 좁은 지역의 모든 자원도 파괴 중이다.", "11월 24일에 총공세를 시작해 10일 안에 북한군과 중공군이 점령한 전 지역을 소탕할 것이라고 말했다.", "목표 달성 즉시 전 한국군 포로에게는 다시 싸우면 비정규군으로 취급된다는 경고와 함께 석방하고, 중국군 포로는 모두 국경으로 데려가 북쪽으로 보내며, 제8군을 일본으로 철수시킬 계획이다.", "잔여 지역 안정화는 제10군단, 유엔 회원국 부대 및 한국군에 맡길 계획이다."], "primary": "secret\n\n[도쿄,] 1950년 11월 17일.\n\n건명: 북한 군사작전\n\n참석자: 맥아더 장군\n\n무초 대사\n\n맥아더 장군은 북한에서의 중공 동기에 관한 자신의 결론을 상세히 개괄했다. 이 결론은 주로 크렘린과 독립적으로 행동하는 중공의 제국주의적 야망을 반영한 것이었다. 장군은 시볼드 씨가 11월 14일자 비망록에 기록한 것과 유사한 선에서 계속 말했다.\n\n장군이 이어 말하기를, 중공군이 2만5천 명, 그리고 확실히 3만 명을 넘지 않는 병력을 국경 너머로 보냈다고 자신한다는 것이었다. 그들이 사용한 은밀하고 비밀스러운 수단으로는 더 많은 병력을 넘길 수 없었을 것이다. 만약 공개적으로 이동했다면 우리 공군과 정보당국에 탐지되었을 것이라고 했다.\n\n이어 장군은 마침내 압록강 철교의 한국 쪽 끝을 파괴하라는 승인을 받았다고 말했다. 공군은 그 임무에 집중하고 있으며 동시에 우리 현 위치와 국경 사이의 좁은 구역에 있는 모든 자원을 파괴하고 있다고 했다. 불행하게도 이 지역은 사막으로 변할 것이라고 덧붙였다.\n\n장군은 총공세를 준비 중이며 [주2] 북한군과 중공군 수중에 여전히 남아 있는 전 지역이 10일 안에 소탕될 것이라고 확신한다고 말했다. 즉각적인 목표를 달성하면 다음과 같이 할 계획이라고 밝혔다.\n\n1.\n\n모든 한국인 포로를, 다시 전투에 참여할 경우 비정규군으로 취급될 것이라는 경고와 함께 석방한다. 물론 이렇게 가석방된 포로의 시민권 회복 문제는 대한민국이 결정할 사안이다.\n\n[1176면] 2.\n\n모든 중국인 포로를 국경으로 데려가 석방한 후 선 너머로 보낸다.\n\n3.\n\n한국에서의 군사작전 종료를 세계에 더욱 강조하는 추가 조치로서, 즉시 제8군에 일본 귀환을 명령하고 상황의 안정화는 제10군단, 유엔 회원국 부대 및 대한민국 국군에 맡긴다.\n\nJ. J. M[uccio]\n\n----- 각주 -----\n[주1] 이 비망록은 12월 4일 접수된 러스크 씨 앞 서한(미인쇄)의 부속문서로 국무부에 송부되었다. 서한에는 이 대화가 11월 16일 저녁에 이루어졌다고 명시되어 있었다.\n[주2] 11월 18일자 전문 C–69211에서 맥아더 장군은 합참에 공세가 11월 24일에 개시될 것이라고 통보했다. Appleman, *South to the Naktong, North to the Yalu*, 774쪽 참조.", "secondary": "secret\n\n[Tokyo,] November 17, 1950.\n\nSubject: North Korean Military Action\n\nParticipants: General MacArthur\n\nAmbassador Muccio\n\nGeneral MacArthur outlined in considerable detail his conclusions as to Chinese Communist motives in North Korea. These reflected mainly Chinese Communists imperialistic aspirations acting independently of the Kremlin. The General went on along lines similar to those recorded by Mr. Sebald in his Memo of November 14.\n\nThe General continued that he was sure the Chinese Communists had sent 25,000, and certainly no more that 30,000, soldiers across the border. They could not possibly have got more over with the surreptitiously covert means used. If they had moved in the open, they would have been detected by our Air Forces and our Intelligence.\n\nThe General then went on that he had finally received authorization to knock out the Korean end of the bridges across the Yalu; the Air Force was concentrating on doing so and, at the same time, destroying all resources in the narrow stretch between our present positions and the border. Unfortunately, this area will be left a desert.\n\nThe General stated that he is mounting an all out offensive [주2] and is certain that the whole area still in the hands of North Koreans and Chinese Communists would be cleared within ten clays. Upon attaining our immediate objectives, he plans to:\n\n1.\n\nRelease all Korean Prisoners of War with the admonition that if any should resume fighting, they will be subject to treatment as irregular forces. The question of the restoration of civil rights to these paroled Prisoners of War, of course, would be a matter for determination by ROK.\n\n[1176면] 2.\n\nHe will take all Chinese Prisoners of War to the border, release them, and send them across the line.\n\n3.\n\nAs a further means of emphasizing to the world the end of the Korean Military Action, he will, at once, order the Eighth Army back to Japan, leaving the stabilization of the situation to the Tenth Corps, UN National Units, and the ROK Forces.\n\nJ. J. M[uccio]", "notes": [], "warn": false, "pages": ["50-1176"], "search": "MacArthur 맥아더 Muccio 무초 Sebald 시볼드 Rusk 러스크"}, {"id": "50-d877", "order": 48, "date": "1950-11-24", "group": "D", "eyebrow": "50-d877 · Memorandum by the Central Intelligence Agency", "title": "중앙정보국 각서", "badge": "secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-11-24"}, {"k": "시각", "v": null}, {"k": "발신", "v": "중앙정보국(Central Intelligence Agency)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "795.00/11–2450", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d877"}], "summary": "NIE-2/1은 중공군의 개입 규모와 목적을 재평가하며, 전면 공세 개시 여부는 아직 단정할 수 없다고 판단했다.", "points": ["중공은 북한에서 현상 유지 작전을 펼치면서 만주의 병력을 유지·증강하고, 위협과 외교로 유엔군 철수를 얻어내려 할 것이다.", "외교적 철수에 실패하면 중공의 개입은 늘어난다. 은밀하고 소모적인 작전으로 유엔군을 묶어두고 북한 정권의 외형을 유지하려 할 것이다.", "중공이 전면 공세에 나섰는지 현재 증거로는 판단할 수 없다. 중공은 유엔군을 한반도에서 몰아낼 군사력은 없지만, 장기 소모전으로 방어 진지에 묶어 결국 철수하게 만들 능력은 있다.", "중공의 개입이 지속되는 한 소련은 장비, 항공기, 기술 고문과 필요시 '의용군'까지 지원을 계속하거나 늘릴 것이다.", "중국의 선전은 미군의 행동을 중국에 대한 공격으로 규정하며 '조선 인민 지원'을 통한 전면적 희생을 요구하고 있으나, 정부 차원의 공식 행동 방침은 아직 표명되지 않았다."], "primary": "비밀\n\n[워싱턴,] 1950년 11월 24일.\n\nNIE–2/1\n\n국가정보판단(National Intelligence Estimate) [주*]\n\n중국 공산군의 한국 개입\n\n문제\n\n1. 북한에 대한 중국 공산군 개입의 규모와 목적을 재평가한다.\n\n결론\n\n2. 중국 공산군은 다음을 동시에 수행할 것이다:\n\n가. 북한에서 중국-북한군의 현상 유지 작전을 계속한다.\n\n나. 만주에서의 군사력을 유지 또는 증강한다.\n\n다. 위협과 외교적 수단으로 유엔군의 한국 철수를 얻어내려 한다.\n\n3. 이 수단으로 유엔군 철수를 얻어내지 못할 경우, 중국의 한국 개입은 증가할 것이다. 최소한 중국은, 인정하지 않은 채로, 유엔군을 한국에 묶어두고 장기 소모전에 빠뜨리며 북한 정권이 존속하는 외형을 유지하기 위한 작전을 점증하는 규모로 수행할 것이다. 현재 입수 가능한 증거로는 중국 공산군이 아직 전면 공세에 전념하고 있는지 여부를 단정할 수 없다. 이들은 결국 유엔군의 한국 철수를 초래하기 위한 작전에 착수할 수도 있다. 이들은 유엔군을 한반도에서 몰아낼 군사적 능력은 갖추지 못했으나, 유엔군을 방어 진지로 후퇴시켜 장기적이고 결론이 나지 않는 작전에 묶어둘 능력은 있으며, 공산측은 이것이 결국 유엔의 한국 철수로 이어질 것이라고 계산할 수도 있다고 판단된다.\n\n4. 중국의 개입이 지속되는 한, 소련은 장비, 항공기, 기술 고문을 제공하고, 더 복잡한 장비를 운용하는 데 필요하면 '의용군'까지도 제공함으로써 중국에 대한 지원을 계속하고 아마도 증대시킬 것이다.\n\n5. 전면전이 발발할 위험은 이미 존재한다. 소련 지도자들은 이 가능성을 과소평가할 수도 있지만, 그들은 이를 감안해왔고 이에 대처할 준비가 되어 있다고 느끼는 것으로 보인다.\n\n토의\n\n6. 중국의 한국 개입에 관한 즉각적인 상황은 다음과 같다:\n\n가. 현재까지 한국 내 중국군의 군사 활동만으로는 주요 공세 작전 계획의 존재를 입증하기에 충분하지 않다.\n\n나. 만주와 중국 기타 지역에서 진행 중인 군사 준비는 한국에서의 공세적이든 만주에서의 방어적이든 장기간 지속되는 주요 작전을 뒷받침하기에 충분한 규모이다.\n\n다. 당 지도부와 가까운 인사들의 견해를 포함한 중국 국내의 지배적 여론은 적대 행위, 특히 중국의 만주 도시들에 대한 광범위한 공습에 대한 예상을 반영하는 것으로 보인다.\n\n라. 중국 정부나 중국의 선전은 지금까지 한국에서의 구체적 행동 방침에 중국 정부를 결박하지 않았다. 한국 지원 준비에 관한 논의는 오로지 '의용군' 행동의 관점에서만 이루어졌다.\n\n마. 중국의 선전 담당자들은 지난 3주 동안 미국의 한국 군사 행동이 중국을 겨냥한 공격이라는 주장을 중심으로 집중적 캠페인을 벌여왔으며, '조선 인민 지원'을 통해 이 위협을 맞아 패퇴시키기 위한 전면적 희생을 요구해왔다. 이 캠페인의 하위 주제는 중국과의 전쟁에서 미국이 무력하다는 것이다.\n\n바. 중국의 선전이나 공식 성명에서 한국 지원의 목적이 발전소 보호, 국경 완충 지대 설정, 유엔군의 38선 후퇴 등 제한적인 목표를 가진 것이라는 암시는 없었다. 사실 이 목표들 중 어느 것도 중국에 의해 언급된 바 없다. 모든 [1222면] 중국의 정식 표명은 한국에서 외국 군대의 철수를 이루어야 할 필요성의 관점에서 이루어졌다.\n\n사. 유엔에 대표단을 파견하기로 한 중국의 결정은 한국에 관한 중국의 의도에 대해 결정적인 시사를 주지 않는 방식으로 발표되었다. 대표단은 안전보장이사회 밖에서 마련되기만 하면 한국에 관한 외교적 해결에 도달할 용의가 있다고 보도되었다. 조건은 제시된 바 없으며, 중국이 한국에서의 외국 군대 철수보다 적은 것을 수용할 것이라는 징후는 아직 없다.\n\n아. 소련 언론은 북한에 대한 중국의 지원을 긍정적으로 보도했다. 소련의 공식 성명과 선전은 북한의 투쟁을 공산주의 대의 일반과 동일시했다. 그러나 어느 쪽도 소련이 북한과 중국에 대한 정신적 지원을 넘어 어떤 구체적인 행동 방침에도 관여되어 있음을 시사하지 않았다.\n\n7. 소련이 한국에 관한 중국 지도부의 결정에서 수행한 역할에 대한 신뢰할 만한 정보는 없지만, 중국의 한국 개입은 소련의 목표를 촉진한다. 소련이 중국을 지원하겠다는 공개적인 약속을 하지는 않았지만, 소련 공군에서 차출된 항공기가 만주와 한국 상공에서 증가하는 숫자로 관측되어 왔다. 소련 선전은 최근 일본에 의한 또는 일본과 직·간접적으로 연계된 어떤 세력에 의한 침략 시 중국을 지원할 중·소조약에 따른 소련의 의무에 주목해왔다. 소련 관리들과 선전은 최근 미국이 한국에서 일본군을 사용하고 있다는 주장과 미국이 일본을 침략 기지로 삼을 준비를 하고 있다는 주장을 강조해왔다.\n\n----- 각주 -----\n[주*] 국무부, 육군부, 해군부, 공군부의 정보기관들이 이 판단 작성에 참여했으며 이에 동의한다. 본 문서는 1950년 11월 21일 현재 입수 가능한 정보에 기초하고 있다. [원문의 각주]", "secondary": "secret\n\n[Washington,] 24 November, 1950.\n\nNIE–2/1\n\nNational Intelligence Estimate [주*]\n\nchinese communist intervention in korea\n\nThe Problem\n\n1. To re-estimate the scale and purpose of Chinese Communist intervention in North Korea.\n\nConclusions\n\n2. The Chinese Communists will simultaneously:\n\na.\n\nMaintain Chinese-North Korean holding operations in North Korea.\n\nb.\n\nMaintain or increase their military strength in Manchuria.\n\nc.\n\nSeek to obtain UN withdrawal from Korea by intimidation and diplomatic means.\n\n3. In case of failure to obtain UN withdrawal by these means, there will be increasing Chinese intervention in Korea. At a minimum, the Chinese will conduct, on an increasing scale, unacknowledged [1221면] operations designed to immobilize UN forces in Korea, to subject them to prolonged attrition, and to maintain the semblance of a North Korean state in being. Available evidence is not conclusive as to whether or not the Chinese Communists are as yet committed to a full-scale offensive effort. Eventually they may undertake operations designed to bring about the withdrawal of UN forces from Korea. It is estimated that they do not have the military capability of driving the UN forces from the peninsula, but that they do have the capability of forcing them to withdraw to defensive positions for prolonged and inconclusive operations, which, the Communists might calculate, would lead to eventual UN withdrawal from Korea.\n\n4. So long as Chinese intervention continues, the USSR will continue and possibly increase its support to the Chinese by furnishing equipment, planes, technical advisers, and conceivably, “volunteers” as necessary to man the more intricate equipment.\n\n5. The risk that a general war will develop already exists. The Soviet rulers may underrate this possibility but they appear to have allowed for it and to feel prepared to cope with it.\n\nDiscussion\n\n6. The immediate situation with regard to Chinese intervention in Korea is as follows:\n\na.\n\nThe military activity of Chinese troops in Korea so far is not in itself sufficient to demonstrate the existence of a plan for major offensive operations.\n\nb.\n\nMilitary preparations being carried out in Manchuria and elsewhere in China are on a scale sufficient to support major operations of prolonged duration, either offensively in Korea or defensively in Manchuria.\n\nc.\n\nPrevailing opinion in China, including opinion in circles close to Party leadership, appears to reflect expectations of hostilities, including expectations of extensive air attacks on Chinese, particularly Manchurian cities.\n\nd.\n\nNeither the Chinese Government nor Chinese propaganda has thus far committed the Chinese Government to a specific line of action in Korea. Discussion of preparation for support of Korea has been only in terms of “volunteer” action.\n\ne.\n\nChinese propagandists for the past three weeks have been carrying on an intensive campaign centering on the charge that US military action in Korea is an attack aimed at China and have called for all-out sacrifices to meet and defeat this threat through “support of the Korean people.” A sub-theme of the campaign has been American impotence in a war with China.\n\nf.\n\nThere has been no suggestion in Chinese propaganda or official statements that the Chinese support of North Korea has a limited objective such as protecting power plants, establishing a buffer zone on the border, or forcing the UN forces back to the 38th Parallel. In fact, none of these objectives has been mentioned by the Chinese. All [1222면] Chinese formulations have been in terms of the necessity of bringing about a withdrawal of foreign forces from Korea.\n\ng.\n\nThe Chinese decision to send a delegation to the UN has been announced in such a manner as to give no conclusive indication of Chinese intentions with regard to Korea. The delegation has been reported to be willing to reach a diplomatic settlement on Korea so long as it is arranged outside the Security Council. No terms have been suggested, and there are as yet no indications that the Chinese would accept less than the withdrawal of foreign troops from Korea.\n\nh.\n\nThe Soviet press has reported with approval, Chinese support of North Korea. Soviet official statements and Soviet propaganda have identified the struggle of the North Koreans with the Communist cause generally. However, neither source indicated that the USSR is in any way committed to any specific line of action beyond moral support of North Korea and of China.\n\n7. While there is no reliable intelligence regarding the role that the Soviet Union has played in decisions reached by Chinese leaders in regard to Korea, Chinese intervention in Korea furthers Soviet objectives. Although the USSR has made no open committment to support the Chinese, planes drawn from the Soviet air force have been observed in increasing numbers in Manchuria and over Korea. Soviet propaganda has recently called attention to Soviet obligations under the Sino-Soviet treaty to support China in case of aggression by Japan or by any power directly or indirectly associated with Japan. Soviet officials and propaganda have recently stressed alleged US use of Japanese troops in Korea and US preparations to use Japan as a base for aggression.", "notes": [], "warn": false, "pages": ["50-1221", "50-1222"], "search": ""}, {"id": "50-d878", "order": 49, "date": "1950-11-24", "group": "B", "eyebrow": "50-d878 · The Chief of Staff, United States Army (Collins), to the Commander in Chief, United Nations Command (MacArthur)", "title": "미 육군참모총장(콜린스)이 유엔군사령관(맥아더)에게", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-11-24"}, {"k": "시각", "v": null}, {"k": "발신", "v": "합참의장을 대리하여 육군참모총장 콜린스(Collins) 발신", "txt": true}, {"k": "수신", "v": "유엔군사령관 맥아더(MacArthur)", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": "WAR 97287"}, {"k": "종류", "v": "전보"}, {"k": "원문출처", "v": "795.00/11–2430: Telegram", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d878"}], "summary": "합참이 만주 국경으로의 진격이 불러올 전면전 위험에 대한 유엔 회원국들의 우려를 전하고, 정치·군사적 긴장을 낮추기 위한 잠정 방안을 제시하며 맥아더의 견해를 묻는다.", "points": ["유엔 회원국들은 맥아더의 군대가 만주·소련 국경 전체를 압박함으로써 중공군과 대규모 충돌이 발생할 경우 전면전으로 비화할 가능성에 대한 우려가 커지고 있다.", "워싱턴 회의에서 맥아더의 임무 자체를 변경하지 않으면서도 분쟁 확대 위험을 줄이는 방안을 모색하기로 합의했다.", "제안된 방안은 압록강 계곡을 내려다보는 지형을 확보한 뒤 그 이상의 진격을 멈추는 선에서 한국군을 주축으로 방어선을 편성하는 것이다.", "이 방안은 청진에 전초를 둔 채 동해안으로 연장되며, 유엔군의 군사 임무 달성에 중대한 지장을 주지 않을 것으로 판단된다.", "유엔군은 북한의 모든 수력발전 시설을 보존하도록 노력하고, 유엔한국통일부흥위원단(UNCURK)이 적절한 시기에 전력의 공평한 배분을 협상할 것이다.", "중공군이 압록강을 넘어 공격하지 않을 경우, 북한에서의 선거와 통일을 유엔의 조치에 따라 진행하며, 동북 지역의 최종 처리는 추후 논의한다.", "이 방안은 중국 공산군에게 체면을 잃지 않고 만주로 철수할 출구를 줄 수 있으며, 블라디보스토크 안보에 대한 소련의 우려를 덜어줄 수 있다."], "primary": "top secret\noperational immediate\n\n워싱턴, 1950년 11월 24일\n\nWAR 97287. 육군참모총장 콜린스 발신. 합참으로부터 다음과 같음: 당신의 군대가 한국과 만주-소련 간의 국경 전체를 직접 압박하여 진격한 결과 중공군과 대규모 충돌이 발생할 경우, 이것이 전면적인 충돌을 유발할 가능성에 대해 다른 유엔 회원국들이 커져가는 우려를 표시하고 있다. 이는 유엔 내에서의 지지 상실로 이어져 미국만 홀로 남게 될 뿐만 아니라, 군사적 성격의 증가된 위험도 수반할 것이다. 유엔 내에서는 당신의 군대와 국경 사이에 비무장 지대를 설정하여 이를 통해 만주에 대한 유엔의 군사 행동에 대한 중공의 두려움과, 이에 상응하는 블라디보스토크에 관한 소련 측의 민감성을 줄이고자 하는 희망에서 비롯된 일부 정서가 존재하므로, 유엔에서의 제안들은 당신의 북진에 대해 달갑지 않은 제한을 가할 수도 있다.\n\n목요일[화요일?][주1] 국무장관, 국방장관, 합동참모본부 및 기타 관료들이 참석한 회의가 이곳에서 전개되고 있는 상황을 검토하기 위해 열렸다.\n\n정치적·군사적 견해의 합의는 당신의 임무에 변경이 있어서는 안 된다는 것이었으나, 통일 한국의 수립을 가능하게 하는 동시에 보다 광범위한 개입의 위험을 줄일 수 있는 행동 방침을 수립하기 위해 최고 정부 차원의 즉각적인 조치가 취해져야 한다는 것이었다. 당신의 다가오는 공격이 성공할 것이라는 가정 하에,[주2] 당신이 어떤 경우에든 취하기를 원할 수도 있을, 베이징 및 소련과의 긴장을 완화하고 견고한 유엔 전선을 유지하는 정치적 행동에 도움이 될 수 있는 군사적 조치가 무엇인지를 찾아내기 위한 탐색적 논의가 이루어졌다. 다음은 그러한 조치를 모색한 내용이다:\n\n1. 압록강까지 또는 그 부근까지 진격한 후, 압록강 하구에서부터 대략 현재 제17보병연대가 점령하고 있는 위치까지, 압록강 계곡으로부터의 접근로를 내려다보는 지형에 병력을 배치하여 그렇게 달성한 진지를 확보할 수도 있을 것이다. 이 병력은 주로 한국군이 될 것이며, 다른 유엔군은 설정된 전선의 확보를 보장하기 위해 대비 태세의 집단으로 배치될 것이다. 물론, 이는 효과적인 적의 저항이 중지되는 것에 달려 있을 것이다.\n\n2. 위의 진지는 청진에 전초를 두고 제17보병연대 진지로부터 대략 동쪽으로 일반적인 선을 따라 동해까지 연장될 것이며, 청진은 현재로서 당신의 동북쪽 진격의 한계가 될 것이다.\n\n3. 위의 사항은 당신의 군사 임무 달성에 중대한 영향을 미치지 않을 것으로 생각되었다.\n\n4. 유엔군은 북한의 모든 수력발전 시설을 보존하기 위한 모든 노력을 계속할 것이다. 이 시설들의 파괴는 적군의 저항에 부수적으로 발생하는 경우에만 일어날 수 있을 뿐이다.\n\n5. 유엔한국통일부흥위원단(UNCURK)은 적절한 시기에 수력 전력의 공평한 배분을 보장하기 위해 적절한 대표자들과 협상에 들어갈 것이다.\n\n6. 중국군이 압록강을 넘어 대규모로 다시 공격하지 않을 경우, 북한에서의 질서 있는 선거와 국가 통일이 유엔의 조치에 따라 진행될 수 있다.\n\n7. 극도로 민감한 동북 지역의 궁극적인 처리는 유엔의 추가적인 절차를 기다릴 것이다.\n\n전장의 사령관 입장에서 이 행동 방침이 부족한 점이 많을 수 있음을 인식하지만, 받아들여야 할 다른 고려 사항들이 있을 수 있으며 위의 절차가 당신의 군사 임무 달성에 중대한 영향을 미치지 않을 것이라고 생각된다. 동시에 이는 중국 공산군이 체면을 잃지 않고 만주로 철수할 수 있는 출구를 제공할 수도 있으며, 블라디보스토크의 안보에 관한 소련의 우려를 덜어줄 수도 있다. 이러한 우려가 중국 공산군으로 하여금 한국에 개입하도록 하는 소련의 압력의 근원일 수도 있다.\n\n위 사항은 우리가 당신의 의견을 평가받고자 하는 행동 방침으로 제안된 것이다. 만약 실행 가능한 것으로 입증된다면, 이러한 행동 방침의 발표 여부와 발표 방법이라는 두 번째 문제가 제기될 것이다. 이는 당신의 작전을 저해하지 않으면서도 중국과 소련이 유엔의 의도를 오해할 수 없는 방식으로 해결되어야 할 것이다. 그러한 발표의 시기와 주체에 대한 당신의 견해를 알려주기 바란다.\n\n이러한 구상들에는 많은 정치적·군사적 함의가 수반되고, 다른 국가들도 관련될 것이므로, 당신의 견해에 대한 추가적인 숙고, 대통령의 최종 결정, 그리고 아마도 특정 다른 정부들과의 논의를 위한 충분한 기회가 주어질 때까지는 이 방향으로의 어떤 조치도 고려되지 않고 있다. [육군참모총장]\n\n[\n\n콜린스\n\n]", "secondary": "top secret \n operational immediate\n\nWashington, 24 November 1950.\n\nWAR 97287. From CSUSA sgd Collins. Following from JCS: Other members of United Nations indicate growing concern over the possibilities of bringing on a general conflict should a major clash develop with Chinese Communist forces as a result of your forces advancing squarely against the entire boundary between Korea and Manchuria–USSR. This might not only result in loss of support within United Nations and leave US standing alone but would also involve increased risks of a military nature. Proposals in UN may suggest unwelcome restrictions on your advance to the north since some sentiment exists in UN for establishing a demilitarized zone between your [1223면] forces and the frontier in the hope of thereby reducing Chinese Communist fear of UN military action against Manchuria and the corresponding sensitivity on the part of the USSR with respect to Vladivostok.\n\nA meeting was held Thursday [Tuesday?] [주1] with Secretaries of State and Defense, The Joint Chiefs of Staff and other officials to review the situation developing here.\n\nThe consensus of political and military opinion was that there should be no change in your mission, but that immediate action should be taken at top governmental level to formulate a course of action which would permit the establishment of a unified Korea and at the same time reduce risk of more general involvement. On the assumption that your coming attack will be successful, [주2] exploratory discussions were had to discover what military measures, which you might in any event wish to take, might lend themselves to political action which would reduce tension with Peiping and the Soviet Union and maintain a solid UN front. The following represent a search for such measures:\n\n1.\n\nAfter advancing to or near the Yalu, you might secure the position which you had thus achieved by holding forces on terrain dominating the approaches from the Valley of the Yalu, from its mouth to approximately the position now held by the 17th Infantry. These forces would be principally ROK troops while other UN forces would be grouped in positions of readiness to insure the holding of the established line. This, of course, would be contingent on the cessation of effective enemy resistance.\n\n2.\n\nThe above position would be extended to the Japan Sea along a general line approximately east from the 17th Infantry’s position with an outpost at Chongjin, which would be the limit for the present of your advance to the northeast.\n\n3.\n\nIt was thought that the above would not seriously affect the accomplishment of your military mission.\n\n4.\n\nUN forces would continue to make every effort to spare all hydro-electric installations in North Korea; destruction of these facilities could result only as incident to resistance from enemy forces.\n\n5.\n\nUNCURK would, at the appropriate time, enter into negotiations with appropriate representatives to insure an equitable distribution of hydro-electric power.\n\n[1224면] 6.\n\nIn the event that the Chinese forces did not again attack in force across the Yalu, the conduct of orderly elections in North Korea and the unification of the country could proceed in accordance with UN action.\n\n7.\n\nUltimate handling of the extremely sensitive Northeast Province would await further UN procedures.\n\nWhile it is recognized that from the point of view of the Commander in the field this course of action may leave much to be desired, it is felt that there may be other considerations which must be accepted and that the above procedure would not seriously affect the accomplishment of your military mission. At the same time it might well provide an out for the Chinese Communists to withdraw into Manchuria without loss of face and might lessen the concern of the Russians as to the security of Vladivostok. This concern may be at the root of Russian pressure on the Chinese Communists to intervene in Korea.\n\nThe above is suggested as a course of action upon which we would appreciate your comments. If it should prove feasible the second question would arise as to whether and how such a course of action might be announced. This would have to be worked out in such a way as not to impede your operations, but in such a way that the Chinese and Russians could not mistake UN intentions. Your views as to timing and source of such an announcement would be appreciated.\n\nSince there are many political and military implications involved in these ideas and since other nations would be involved, no action along these lines is contemplated until full opportunity has been given for further consideration of your views, final decision by the President, and possibly discussion with certain other governments. [CSUSA.]\n\n[\n\nCollins\n\n]", "notes": ["[주1] 11월 21일 화요일에 열린 회의에 관한 제섭(Jessup) 씨의 대화 비망록 1204면을 참조. 11월 23일 목요일(추수감사절)에 열린 회의 기록은 발견되지 않음.", "[주2] 맥아더 장군은 11월 24일 유엔군 공세 개시를 참관하기 위해 한국으로 날아갔다. 그는 이 자리에서 다음과 같이 끝맺는 성명을 발표했다: \"만약 이번 [공격이] 성공한다면, 이는 모든 실질적인 목적상 전쟁을 종결시키고, 한국에 평화와 통일을 회복시키며, 유엔군의 신속한 철수를 가능하게 하고, 한국 국민과 국가로 하여금 완전한 주권과 국제적 평등을 완전히 떠맡을 수 있게 할 것이다. 이것이 바로 우리가 싸우는 목표이다.\" (Appleman, South to the Naktong, North to the Yalu, 774면 및 Hearings, 3491면 참조.)"], "warn": false, "pages": ["50-1223", "50-1224"], "search": "Collins 콜린스 MacArthur 맥아더 Jessup 제섭"}, {"id": "50-d883", "order": 50, "date": "1950-11-25", "group": "A", "eyebrow": "50-d883 · The Commander in Chief, United Nations Command (MacArthur) to the Joint Chiefs of Staff", "title": "유엔군사령관(맥아더)가 합동참모본부에 보낸 전보", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-11-25"}, {"k": "시각", "v": null}, {"k": "발신", "v": "MacArthur, Commander in Chief, United Nations Command", "txt": true}, {"k": "수신", "v": "Joint Chiefs of Staff", "txt": true}, {"k": "장소", "v": "Tokyo"}, {"k": "전문번호", "v": "C–69808"}, {"k": "종류", "v": "전보"}, {"k": "원문출처", "v": "795.00/11–2550: Telegram", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d883"}], "summary": "맥아더가 압록강 이남 방어선 설정이 군사적으로 불가능하며 북진을 멈추는 것이 오히려 재앙을 초래할 것이라고 답신했다.", "points": ["맥아더는 전날 압록강을 직접 정찰한 결과 강 이남의 고지대에서 북한으로 통하는 접근로를 효과적으로 통제하는 것은 절대 불가능하다고 단언했다.", "압록강이라는 자연 방어선을 포기하는 것은 군사적으로나 정치적으로 방어할 수 없으며, 공개된 목표인 북한 경계 이남의 모든 적군 섬멸을 완수하지 못하면 한국인에게는 배신으로, 중국과 아시아에는 공산주의 침략에 대한 유화로 비칠 것이라고 주장했다.", "소련과 중국의 선전선을 분석한 결과 유엔군의 압록강 남안 통제에 대한 주요 우려는 거의 발견되지 않았다고 평가했다.", "수풍댐 수력발전 시설 문제는 영미 측의 추측에 불과하며 실제로 소련이나 중국의 공식 불만이 접수된 바 없다고 지적하며 수력발전 이슈는 매우 빈약한 근거에 기초하고 있다고 결론 내렸다.", "중공군이 우리가 부산 교두보에 포위당했을 때 개입했다면 지금보다 위험이 훨씬 컸을 것이며, 현 임무를 단호히 완수하는 것이 소련과 중국의 침략 기도를 저지할 유일한 희망이라고 주장했다.", "작전 목표 달성 후에는 즉시 미군을 일본으로 철수시키고 포로를 귀가시키며 한국의 통일과 정부 수립을 유엔 당국의 조언과 원조 아래 한국인에게 맡기겠다는 계획을 밝혔다."], "primary": "top secret / operational immediate\n\nTokyo, 1950년 11월 25일.\n[11월 25일 오전 6시 11분 접수]\n\nC–69808. 귀신 W–97287에 대한 답신. [주1] 한국 분쟁의 확산을 제한할 방안을 찾는 데 깔린 우려를 충분히 이해하며 여기도 같은 생각이나, 제안된 접근법은 원하는 결과를 달성하는 데 실패할 뿐 아니라 우리가 피하려는 바로 그 결과를 불러일으킬 것으로 생각된다.\n\n우선 군사적 관점에서 볼 때 어제 압록강 방면을 직접 정찰한 결과 제안된 대로 강 이남의 고지를 장악한 지대에서 정지하여 [1232면] 북한으로 통하는 접근로를 효과적으로 통제할 위치를 확보한다는 것은 전적으로 불가능하다. 서쪽의 저지대에서 중앙과 동쪽의 험준한 지대에 이르는 지형은 우리가 어떤 이유로든 압록강 방어선 자체의 천연 방어 이점을 희생할 경우 그러한 방어 체계에 적합하지 않다. 압록강은 한국 전역에서 다른 어떤 자연 방어선에서도 찾을 수 없는 이점을 지닌 방어선이다. 한국의 영토 보전을 지키는 이 천연 방벽을 포기하는 것은 군사적으로도 정치적으로도 방어(防禦)할 수 없는 일일 것이다.\n\n나아가 우리가 공개적이고 거듭 천명한 목표, 즉 통일과 평화를 한국 전역에 회복하는 데 필수적인 한국 북방 경계 이남의 모든 적군을 섬멸한다는 목표를 완수하지 않고 군사 작전을 추진하는 데 실패하는 것은 무엇이든 가장 비참한 결과를 초래할 것이다. 한국인은 이를 자신들의 주권과 영토 보전, 그리고 유엔이 그들을 위해 체결한 엄숙한 서약에 대한 배신으로 간주할 것이며, 중국과 아시아의 모든 다른 민족들은 공산주의 침략에 대한 유화(宥和)에서 비롯된 약함으로 볼 것이다. 11월 9일 나의 메시지 C–68572에서 지적한 바와 같이, [주2] 그러한 행동은 국제적 불법과 침략에 대한 찬사가 되어 더 많은 국제적 불법과 침략을 부추길 뿐이다. 더욱이 두 나라 사이에 존재하는 정치적 긴장은 도적단의 습격과 밀수 같은 불법적인 국경 사건을 최소화하기 위해 국제 경계를 폐쇄할 것을 요구하며, 우리가 직접 통제하지 못하는 국경 지대가 존재할 경우 그러한 조치를 취할 수 없다.\n\n소련과 북경의 선전선(宣傳線)을 연구한 결과 유엔군이 압록강 남안을 통제할 가능성에 대한 주요 우려는 거의 나타나지 않는다. 북한의 수력발전 시설에 관해 언급된 것조차 대부분 영국-미국 측 추측의 산물이며, 소련이나 중국의 어떤 발언에서도 거의 반영되지 않는다. 실제로 이 시설들과 그 전력 생산물의 해외 배분에 관한 우리 정보로는 이 전력원에 대한 의존이 중국의 한국 내 공격적 움직임을 초래한 근본 원인의 주요 요소임을 확증하지 못한다. 따라서 X 군단의 통제 아래 들어온 이후 창준(長津)의 이 수력발전 시설들이 우리 군이 도착하기 전에 이미 한 달간 완전히 가동이 중단되었고 주요 기계와 기타 장비의 상당 부분이 제거·분산되었으며 아직 작동이 재개되지 않았음에도, 그에 따른 전력 상실에 대해 소련이나 중국 쪽에서 항의의 표시는 전혀 나오지 않았다. 이러한 사실적 고려를 감안할 때 [1233면] 수력발전 문제는 가장 빈약한 근거에 기초하고 있다는 결론에 도달하게 된다.\n\n중국 공산군의 한국 분쟁 참가는 우리가 병력을 투입할 당시 우리가 알면서 감수한 위험이었다. 그들이 우리가 부산 교두보 방어선 뒤에 포위되어 있던 때 참가했더라면 위험은 지금보다 훨씬 더 심각했을 것이다. 지금은 우리가 주도권을 쥐고 있고 그들의 적대적 움직임을 저지할 지역이 훨씬 더 좁다. 우리 병력은 전 국경 지역을 점령하는 데 투입되어 있으며, 실제로 동쪽에서는 이미 압록강의 한 구역을 점령했으나 두드러지는 정치적·군사적 소련이나 중국의 반응은 없었다. 우리는 중국이나 소련 영토의 어떤 부분에 대해서도 침략적 의도를 전혀 품고 있지 않다는 점을 반복적으로 또 공개적으로 분명히 밝혀 왔다. 나의 계획은 우리가 압록강을 따라 진지를 공고히 할 수 있게 되는 대로 미군을 가능한 한 대한민국군으로 교체하고 다음을 시행하는 명령을 공개적으로 발표하는 것이다.\n\n(1)\n\n미군의 일본 귀환;\n\n(2)\n\n모든 전쟁포로의 귀가 석방;\n\n(3)\n\n한국의 통일과 민정(民政) 회복을 유엔 당국의 조언과 원조 아래 한국인에게 맡김.\n\n나는 우리의 군사 목표가 달성되는 대로 이 계획을 신속히 시행하면 중국의 이성(理性)에 실질적으로 호소할 수 있으리라고 믿는다. 만일 그렇지 않다면 결과적인 상황은 우리의 군사 조치를 현 임무 이전에서 정지시킨다고 해서 영향을 받을 성질의 것이 아니다. 현 임무를 단호히 완수하고 공개적으로 거듭 그려 온 우리의 군사 사명을 달성하는 것만이 소련과 중국의 침략 기도가 정치적 이유로 인해 그들이 물러설 수 없는 진로로 접어들기 전에 저지될 수 있는 최선의—사실상 유일한—희망이다.\n\n----- 각주 -----\n[주1] 11월 24일자, 1222면.\n[주2] 앞 1107면.", "secondary": "top secret \n operational immediate\n\nTokyo, 25 November 1950.\n[Received November 25—6:11 a. m.]\n\nC–69808. Reurmsg W–97287. [주1] The concern underlying the search for the means to confine the spread of the Korean conflict is fully understood and shared here, but it is believed that the suggested approach would not only fail to achieve the desired result but would be provocative of the very consequences we seek to avert.\n\nIn the first place from a military standpoint my personal reconnaisance of the Yalu River line yesterday demonstrated conclusively that it would be utterly impossible for us to stop upon commanding [1232면] terrain south of the river as suggested and there be in a position to hold under effective control its lines of approach to North Korea. The terrain ranging from the lowlands in the west to the rugged central and eastern sectors is not adaptable to such a system of defense were we, for any reason, to sacrifice the natural defense features of the river line itself, features to be found in no other natural defense line in all of Korea. Nor would it be either militarily or politically defensible to yield this natural protective barrier safeguarding the territorial integrity of Korea.\n\nMoreover any failure on our part to prosecute the military campaign through to the achievement of its public and oft repeated objective of destroying all enemy forces south of Korea’s northern boundary as essential to the restoration of unity and peace to all of Korea would be fraught with most disastrous consequences. It would be regarded by the Korean people as a betrayal of their sovereign and territorial integrity and of the solemn undertaking the United Nations entered into in their behalf, and by the Chinese and all the other peoples of Asia as weakness reflected from the appeasement of Communist aggression. As pointed out in my message C–68572 of 9 November, [주2] such action as tribute to international lawlessness and aggression would but encourage further international lawlessness and aggression. Furthermore, the political tension existing between the two countries requires that the international boundary be closed to reduce to a minimum lawless border incidents including bandit raids and smuggling and such action could not be effected if there existed a border zone beyond our immediate control.\n\nStudy of the Soviet and Peiping propaganda line discloses little to suggest any major concern over the potentiality of United Nations control of the southern banks of the Yalu River. Even what has been said concerning the hydroelectric facilities in North Korea is for the most part a product of British-American speculation, finding little reflection in any Soviet or Chinese utterances. Indeed, our info on these facilities and the disposition abroad of their power output fails to confirm that dependence upon this source of power is a major factor in the basic causes giving rise to the Chinese aggressive moves in Korea. Thus despite the fact that these hydro-electric facilities at Changjun brought under control of the X Corps had been closed down completely for a full month prior to the arrival of our forces with much of the vital machinery and other equip removed and dispersed and are not yet restored to operation, no suggestion of complaint has emanated from Soviet or Chinese sources over the deprivation of power consequent thereto. In view of these factual considerations one is brought to [1233면] the conclusion that the issue of hydro-electric power rests upon the most tenuous of grounds.\n\nThe entry of Chinese Communists into the Korean conflict was a risk we knowingly took at the time we committed our forces. Had they entered at the time we were beleaguered behind our Pusan perimeter beachhead, the hazard would have been far more grave than it is now that we hold the initiative and have a much smaller area within which to interdict their hostile moves. Our forces are committed to seize the entire border area, and indeed in the east have already occupied a sector of the Yalu River with no noticeable political or military Soviet or Chinese reaction. We have repeatedly and publicly made it unmistakably clear that we entertain no aggressive designs whatsoever against any part of Chinese or Soviet territory. It is my plan just as soon as we are able to consolidate positions along the Yalu River to replace as far as possible American Forces with those of the Republic of Korea and publicly announce orders effecting:\n\n(1)\n\nThe return of American Forces to Japan;\n\n(2)\n\nThe parole of all prisoners of war to their homes;\n\n(3)\n\nThe leaving of the unification of Korea and the restoration of the civil processes of government to the people, with the advice and assistance of The United Nations authorities.\n\nI believe that the prompt implementation of this plan as soon as our military objectives have been reached will effectively appeal to reason in the Chinese mind. If it will not, then the resulting situation is not one which might be influenced by bringing to a halt our military measures short of present commitments. By resolutely meeting those commitments and accomplishing our military mission as so often publicly delineated lies best—indeed only—hope that Soviet and Chinese aggressive designs may be checked before these countries are committed to a course from which for political reasons they cannot withdraw.", "notes": ["[주1] W–97287은 합참이 맥아더에게 보낸 전보로, 압록강 남안 약간 남쪽에 방어선을 설정하여 중국의 우려를 완화하는 방안을 타진한 내용이다.", "[주2] C–68572는 11월 9일 맥아더가 합참에 보낸 전보로, 38선 이북으로의 진격을 멈추는 것이 아시아에서 '공산주의 침략에 대한 유화'로 비칠 것이라고 주장했다.", "전보 머리말의 `operational immediate`는 긴급도를 나타내는 군사통신 표시다. 본문 머리에 원문 그대로 두었다.", "본문에 언급된 'Changjun(창준)'은 수풍(水豐)댐을 가리킬 가능성이 있다. 당시 미군이 장진호 인근 수력발전 시설을 언급한 것으로 보이나, 원문 표기를 그대로 옮겼다.", "원문 `[1232면]`과 `[1233면]`은 FRUS 원본 쪽수 표시다. 그대로 살렸다."], "warn": false, "pages": ["50-1232", "50-1233"], "search": "MacArthur 더글러스 맥아더"}, {"id": "50-d906", "order": 51, "date": "1950-11-30", "group": "A", "eyebrow": "50-d906 · The Commander in Chief, United Nations Command (MacArthur) to the Joint Chiefs of Staff", "title": "유엔군사령관(맥아더)이 합동참모본부에 보낸 전보", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-11-30"}, {"k": "시각", "v": "received November 30—1:39 a. m."}, {"k": "발신", "v": "MacArthur, Commander in Chief, United Nations Command (유엔군사령관 맥아더)", "txt": true}, {"k": "수신", "v": "Joint Chiefs of Staff (합동참모본부)", "txt": true}, {"k": "장소", "v": "Tokyo"}, {"k": "전문번호", "v": "C 50095"}, {"k": "종류", "v": "전보"}, {"k": "원문출처", "v": "795.00/11–3050: Telegram", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d906"}], "summary": "맥아더가 10군단과 8군의 전선 연결이 병력 부족과 지형 문제로 불가능하다고 보고한다. 10군단의 측면 압박이 적 6~8개 사단을 묶어 두고 있다고 평가했다.", "points": ["10군단이 함흥-원산 지역으로 후퇴할 것이라고 명시했다. 포위 섬멸을 막으라는 지시를 내렸다.", "적군이 10군단의 측면 위협에 대응하느라 6~8개 사단을 투입했으며, 이 병력은 그렇지 않았으면 8군에 사용되었을 것이라고 판단했다.", "한반도의 좁은 목 부분을 가로지르는 물리적으로 연속된 전선의 구상은 전선의 길이, 병력 부족, 남북을 가르는 산맥으로 인한 병참 문제 때문에 전혀 실행 불가능하다고 단언했다.", "이 회신은 11월 29일 오후 2시 30분에 발송된 합참의 질의(JCS 97592)에 대한 답변이다."], "primary": "top secret\nflash(초긴급)\n\nTokyo, 30 November 1950.\n[Received November 30—1:39 a. m.]\n\nC 50095. Re JCS 97592. [주1] 10군단은 지리적으로 8군의 우측면을 압박하는 적군의 주요 보급선을 위협하고 있다. 이 위협은 무평리(無坪里) 북쪽까지 이르는 곳부터 원산 구역에서 서쪽으로 뻗은 도로망까지 군단 전 서측면에 걸친 부대들의 진출로 더욱 두드러진다. 이 위협에 대응하여 현재 적군은 보고된 바에 따르면 6개 내지 8개 사단을 투입하고 있으며, 이들 병력은 그렇지 않았더라면 8군에 대항하여 사용할 수 있었을 것이다. 적군의 남하 진출은 10군단의 이 같은 위협이 저지되거나 무력화될 때까지는 안전하게 이루어질 수 없었을 것이다. 한반도의 좁은 목 부분을 가로질러 8군과 10군단의 병력을 실질적으로 연속된 전선으로 물리적 [1260면] 결합시키려는 어떤 구상도, 그 전선의 길이, 우리 병력의 수적 열세, 그리고 그러한 전선을 남북으로 가르는 산악 분수령 때문에 발생하는 병참상의 문제들로 인해 전혀 실행 불가능하다.\n\n10군단은 적의 압력이 증가함에 따라 함흥-원산 구역으로 그 진지를 축소할 것이다. 군단장은 그의 병력이 조금씩 고립되어 포위 섬멸당할 어떠한 가능성에 대해서도 그것을 막도록 명령받았다. 지리적으로 그의 부대들이 상당히 널리 퍼져 있는 것처럼 보이지만, 실제 지형 조건 때문에 적군이 그로부터 어떤 실질적인 이점을 취하는 것은 극히 어렵다.\n\n----- 각주 -----\n[주1] 11월 29일 오후 2시 30분 발송, 1253면.", "secondary": "top secret \n flash\n\nTokyo, 30 November 1950.\n[Received November 30—1:39 a. m.]\n\nC 50095. Re JCS 97592. [주1] The X Corps geographically threatens the main supply lines of the enemy forces bearing upon the right flank of the Eighth Army. This threat is emphasized by thrusts from elements of the Corps all along its west flank as far north as Mupyong-Ni and as far south as the roadnets west from the Wonsan sector. This threat is now being met by the enemy commitment of a reported 6 to 8 Divisions which otherwise would have been available for use against the Eighth Army. The enemy’s penetration southward could not be safely accomplished until this threat of the X Corps is contained or nullified. Any concept of actual physical combination of the forces of the Eighth Army and X Corps in a practically continuous line across the narrow neck of Korea is quite impracticable due to the length of that line, the numerical weakness [1260면] of our forces, and the logistical problems due to the mountainous divide which splits such a front from north to south.\n\nThe X Corps will contract its position, as enemy pressure develops, into the Hamhung–Wonsan sector. The Corps Commander has been enjoined against any possibility of piecemeal isolation and trapping of his forces. While geographically his elements seem to be well extended, the actual conditions of terrain make it extremely difficult for an enemy to take any material advantage thereof.", "notes": [], "warn": false, "pages": ["50-1260"], "search": "MacArthur 맥아더"}, {"id": "50-d918", "order": 52, "date": "1950-12-03", "group": "E", "eyebrow": "50-d918 · Memorandum by Mr. Lucius D. Battle, Special Assistant to the Secretary of State, of a Meeting Held on November 30, 1950", "title": "1950년 11월 30일 회의에 관한 국무장관 특별보좌관 루시어스 D. 배틀의 비망록", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-12-03"}, {"k": "시각", "v": null}, {"k": "발신", "v": "Lucius D. Battle, 국무장관 특별보좌관", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "회담 비망록"}, {"k": "원문출처", "v": "795.00/12–350", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d918"}], "summary": "애치슨 국무장관이 러벳 국방부 차관에게 현재 한국의 위기 속에서 미국이 나아갈 방향을 즉시 결정해야 한다고 말한 회의를 배틀이 기록했다.", "points": ["애치슨 장관은 현재 한국의 위기에서 어디로 갈지 즉시 결정하는 것이 필수적이며, 이를 위한 프로그램을 즉시 마련해야 한다고 강조했다.", "애치슨은 첫 번째 단계는 중국군을 저지하는 것이며, 그렇지 않으면 다른 어떤 논의도 무의미하다고 말했다.", "한국에 분산된 미군을 모아 적절한 장소를 찾아 방어선을 구축하고, 시간이 지나면 그 방어선이 '신성성'을 얻을 수 있을 것이라고 보았다.", "러벳은 정전 결의안의 가능성을 언급했고, 이에 대해 유엔에서 매우 불안해하는 이들이 많아 정전이 유엔의 조치로 성사될 수 있으나, 어떤 종류의 정전을 언제 원하는지 시급히 고려해야 한다는 논의가 있었다.", "애치슨은 우리의 전력을 강화할 수 있는 종류의 정전이 바람직하며, 정전이 수락되면 마셜의 전술을 써서 준수 여부를 확인할 팀을 구성하는 방안을 제안했다."], "primary": "top secret\n\n[워싱턴,] 1950년 12월 3일.\n\n국무장관은 11월 30일 목요일 오후, 자신의 요청으로 러벳 씨를 만났다.\n\n면담 후, 장관은 이에 관해 국무부의 몇몇 사람들과 이야기했다. 그는 러벳 씨에게 현재의 한국 위기 속에서 우리가 어디로 나아갈지를 결정하기 위해 즉각 조치를 취하는 것이 필수적이라고 말했다고 전했다. 그는 다음 날 아침 스미스 장군, 해리먼 씨, 합동참모본부, 마셜 장군과 러벳 씨, 그리고 국무부의 특정 인사들이 참석하는 회의를 소집하자고 제안했다. 그 목적은 이 그룹의 지난 회의에서 남겨진 문제들을 다루기 위한 것이었다.\n\n장관은 우리가 즉시 프로그램을 마련하는 것이 절박하다고 말했다. 그는 늦어도 월요일까지는 안전보장[1271면]이사회에 제출된 6개국 결의안에 대해 거부권이 행사될 것으로 예상할 수 있다고 말했다. (나는 회의 도중에 소환되어 그날 오후 그 결의안에 거부권이 행사되었다는 통보를 받았고, 이를 그룹에 다시 보고했다)\n\n장관은 러벳 씨에게 첫 번째 단계는 중국군을 저지하는 것이라고 말했다. 그는 우리가 그렇게 할 수 없다면 다른 어떤 논의도 소용없다고 말했다. 그는 현재 한국에서 우리 군대가 심하게 분산되어 있다고 지적했다. 그는 우리가 적절한 장소를 찾아 그곳을 지켜야 한다고 말했다. 그런 다음 우리는 그 진지에 신성성을 부여하려 노력해야 하며, 그 신성성은 시간의 경과에 의해 뒷받침될 것이라고 했다. 그는 우리가 동맹국들을 규합하여 그들에게 우리가 불어넣을 수 있는 모든 기백을 불어넣어야 한다고 말했다. 그는 이를 위해서는 우리에게 프로그램이 반드시 있어야 한다고 지적했다.\n\n장관은 우리가 가능한 한 적은 비용으로 그 진지를 유지하려 노력해야 한다고 말했다.\n\n러벳 씨는 정전 결의안의 가능성을 언급했다. 유엔에는 매우 초조해하는 사람들이 많으며 아마도 유엔의 조치로서 정전이 성사될 수 있을 것이라고 지적되었다. 만일 그것이 우리가 원하는 것이라면, 누군가 틀림없이 그것을 제안할 것이며 우리는 어떤 종류의 정전을 언제 원하는지 등을 시급히 고려해야 한다. 장관은 우리 스스로를 강화할 수 있도록 해주는 그런 종류의 정전을 확보하는 것이 바람직하다고 지적했다. 장관은 만약 정전이 수락된다면, 마셜 전술을 써서 준수를 보장하기 위한 팀 집단을 구성하는 방안을 고려하자고 제안했다. 이 팀 중 하나는 중국 공산군 측, 하나는 유엔 사절단 측, 하나는 맥아더 장군의 사령부 측에서 나오는 것이다. 장관은 중국 공산군이 정전에 동의하도록 하는 것이 어려울 수도 있다고 지적했다.\n\n다음 날 아침 펜타곤에서 열리는 회의를 위한 조치가 취해졌다. 이 회의에 대한 기록은 제섭 씨가 작성했다. [주1]\n\nL. D. B[attle]", "secondary": "top secret\n\n[Washington,] December 3, 1950.\n\nThe Secretary saw Mr. Lovett on Thursday afternoon, November 30, at the Secretary’s request.\n\nFollowing the meeting, he talked to several people in the Department about it. He said that he had told Mr. Lovett it was essential that action be taken immediately to determine where we went in light of the present Korean crisis. He suggested a meeting the following morning at which General Smith, Mr. Harriman, the Joint Chiefs of Staff, General Marshall and Mr. Lovett, as well as certain people in the Department, would be present. The purpose was to take up questions left over from the last meeting of this group.\n\nThe Secretary said that it was imperative that we get a program immediately. He said that we could expect a veto not later than Monday of the six power resolution presented before the Security [1271면] Council. (I was called out during the course of the meeting and informed that the resolution had been vetoed that afternoon, which I reported back to the group).\n\nThe Secretary told Mr. Lovett that the first step was to stop the Chinese. He said that there was no use discussing anything else unless we could do that. He pointed out that our troops were at present badly dispersed in Korea. He said we must find a place which was suitable and hold it. We should then try to get sanctity to that position, a sanctity which would be aided by the passage of time. He said we must get our allies together and put all the backbone we could in them. He pointed out we must have a program in order to do this.\n\nThe Secretary said we must try to maintain the position at as little cost as possible.\n\nMr. Lovett mentioned the possibility of a cease fire resolution. It was pointed out there were many very nervous people in the United Nations and that a cease fire could probably be obtained as a United Nations move. If that is what we want, someone would undoubtedly propose it and we must consider urgently what kind of cease fire, when we want it, etc. The Secretary pointed out that it was desirable to get the kind of cease fire which allowed us to strengthen ourselves. The Secretary suggested consideration of using, if the cease fire were accepted, the Marshall tactic of getting a group of teams to assure compliance. One of these teams would be from the Chinese Communists, one from the United Nations Mission and one from General MacArthur’s headquarters. The Secretary pointed out that it might be difficult to get the Chinese Communists to agree to a cease fire.\n\nArrangements were made for the meeting at the Pentagon the following morning. A record of this meeting was prepared by Mr. Jessup. [주1]\n\nL. D. B[attle]", "notes": ["[주1] 1276쪽의 1950년 12월 1일자 제섭 씨의 대화 비망록을 참고하라."], "warn": false, "pages": ["50-1271"], "search": "Dean Acheson 딘 애치슨 (국무장관) Robert A. Lovett 로버트 A. 러벳 (국방부 차관) Walter Bedell Smith 월터 비델 스미스 (육군 중장, CIA 국장) W. Averell Harriman W. 애버렐 해리먼 (대통령 특별보좌관) George C. Marshall 조지 C. 마셜 (국방장관) Douglas MacArthur 더글러스 맥아더 (유엔군사령관/극동군사령관) Philip C. Jessup 필립 C. 제섭 (국무부 특별 무임소대사) Lucius D. Battle 루시어스 D. 배틀 (국무장관 특별보좌관)"}, {"id": "50-d947", "order": 53, "date": "1950-12-03", "group": "A", "eyebrow": "50-d947 · The Commander in Chief, United Nations Command (MacArthur) to the Joint Chiefs of Staff", "title": "유엔군사령관(맥아더)이 합동참모본부에 보낸 전보", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-12-03"}, {"k": "시각", "v": "received December 3—3:51 a. m."}, {"k": "발신", "v": "MacArthur, Commander in Chief, United Nations Command (맥아더, 유엔군사령관)", "txt": true}, {"k": "수신", "v": "Joint Chiefs of Staff (합동참모본부)", "txt": true}, {"k": "장소", "v": "Tokyo"}, {"k": "전문번호", "v": "C–50332"}, {"k": "종류", "v": "전보"}, {"k": "원문출처", "v": "795.00/12–350: Telegram", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d947"}], "summary": "맥아더가 8군의 평양 사수 불가능과 서울 방면으로의 철수 불가피성을 보고하고, 대규모 지상군 증원 없이는 계속된 철수나 교두보 방어 외에 대안이 없다고 판단한다.", "points": ["8군이 평양을 지킬 수 없으며 적의 압박이 가해지면 의심의 여지 없이 서울 지역으로 물러나야 할 것이다.", "8군과 10군단을 합치려는 시도는 실행 가능하지도 않고 이득도 없다. 병력 부족과 보급선 분리로 인해 오히려 이동의 자유를 해칠 뿐이다.", "한반도 허리를 가로지르는 방어선은 아군의 수적 열세와 험준한 산악 지형 때문에 성립할 수 없다. 7개 사단으로 약 120마일의 전선을 방어하는 것은 야간 침투에 취약한 종심 없는 선이 될 것이다.", "중국군의 노골적인 참전으로 전쟁의 기본 성격이 완전히 바뀌었다. 현재 약 26개 사단이 전선에 투입되었고, 후방에 최소 20만 명이 추가로 전투에 투입되는 중이며, 그 배후에는 중공의 전체 군사 잠재력이 있다.", "지형 때문에 아군 제공권의 효과가 감소하고 해군의 화력 지원 및 상륙 기동도 제한된다. 전황은 갈수록 지상군 간 전투 효율의 대결 양상이 되고 있다.", "즉각적이고 대규모인 지상군 증원이 없다면 이 사령부는 거듭된 철수로 저항력을 잃거나 교두보 거점으로 물러나 연명하는 것 외에는 방어 이상의 희망이 없다.", "소규모인 이 사령부가 현재 사실상 중국 전체와 선전포고 없는 전쟁을 벌이고 있으며, 즉각적인 조치 없이는 성공을 정당화할 수 없고 점진적 소모 끝에 최종 궤멸에 이를 것이 합리적으로 예상된다.", "미군 사단들은 각각 약 5천 명이 정원 미달이고 5개월의 거의 끊임없는 전투로 정신적 피로와 신체적 손상을 입었다. 반면 중국군 부대는 신선하고 완전히 편제되고 훌륭히 훈련·장비되어 최상의 상태다.", "이 상황은 전혀 새로운 강대국을 상대로 한 전혀 새로운 전쟁으로 평가되어야 하며, 북한군만을 염두에 둔 기존 작전 지침은 사건에 의해 완전히 구식이 되었다."], "primary": "top secret\nflash(초긴급)\n\n도쿄, 1950년 12월 3일.\n[12월 3일 오전 3시 51분 접수]\n\nC–50332. 참조 JCS 97772. [주1] 10군단은 가능한 한 신속히 함흥 지역으로 철수 중이다. 8군 내 상황은 점점 더 위중해지고 있다. 워커 장군은 평양 지역을 지킬 수 없으며 적의 압박이 가해지면 의심의 여지 없이 서울 지역으로 철수할 수밖에 없을 것이라고 보고했고, 나는 그의 판단에 동의한다. 8군과 10군단의 병력을 합치려는 시도는 실행 가능하지도 않고 그로 인해 어떤 이득도 발생하지 않을 것이다. 양 부대 모두 완전한 수적 열세에 있으며 따라서 이들이 합류한다 해도 추가적인 전력을 창출하지 못할 뿐만 아니라, 두 개의 분리된 해상 보급로와 기동로에서 비롯되는 자유로운 이동의 흐름을 실제로 위태롭게 할 것이다.\n\n내가 앞서 보고한 대로, 한반도의 허리를 가로지르는 방어선을 구축하는 것은 실행 가능하지 않다. 관련된 거리와 연계하여 고려할 때 우리 병력의 수적 취약성 때문에, 그리고 방어선의 두 부분을 각 지역 내 항구들로부터 보급해야 하기 때문에, 또한 남북으로 뻗은 험준한 산악 지형이 이 지역을 두 개의 구획으로 나누어 놓기 때문에 그렇다. 이러한 방어선은 항공 직선거리로 약 120마일, 도로 거리로 약 150마일에 달한다. 만일 내가 운용할 수 있는 7개 사단의 미군 전 병력을 이 방어선을 따라 배치한다면, 이는 한 개 사단이 약 20마일의 전면을 방어해야 한다는 뜻이 될 것인데, 그러한 전면을 상대하는 것은 최대 강점이 험준한 지형을 통한 야간 침투 잠재력인 적의 대단히 우세한 수에 대항해서이다. 종심 없는 그러한 방어선은 힘이 거의 없을 것이며, 방어적 개념으로서 침투를 초래하고 이로 인해 포위 및 분할 격멸을 자초할 것이다. 이러한 개념은 상대적으로 약한 북한군에 대해서는 실행 가능했을 것이지만, 중국군 전 병력을 상대로는 불가능하다.\n\n나는 중국군의 위장 없는 참전이 초래한 근본적 변화들에 대해 완전한 이해가 존재한다고 생각하지 않는다. 이미 약 26개 사단 규모로 추산되는 중국 부대가 전투 대열에 있으며, 최소 20만 명 이상의 추가 병력이 적 후방에 있고 현재 전투에 투입되는 중이다. 이에 더하여 북한군 잔여 부대가 후방에서 재편성 중이며, 물론 이 모든 것 뒤에는 중공 중국의 전체 군사적 잠재력이 버티고 있다.\n\n[1321면] 지형은 적 보급 체계를 특정 통로로 몰아넣고 차단하는 데 있어 우리 제공 지원의 효과를 감소시키는 성질을 지니며, 적의 분산 전술을 돕는 데 기여한다. 이는 현재의 국제적 경계라는 제한과 함께, 우리의 우세한 공군력에 당연히 발생할 정상적 이익을 엄청나게 축소시킨다.\n\n적이 내륙에 집중함에 따라 해군의 잠재력은 효과 면에서 크게 감소한다. 상륙 기동은 더 이상 실행 가능하지 않고 해군 함포 사격 지원의 효과적 이용은 제한된다.\n\n따라서 우리 연합 전력의 잠재력은 크게 감소하며, 비교는 점점 더 지상군 간 상대적 전투 효율의 비교가 되어간다.\n\n그러므로 만일 최대 규모의 지상군 증원이 신속히 제공되지 않는다면, 이 사령부는 매번 철수 이후 저항력이 감소한 채 거듭된 철수를 강요당하거나, 아니면 어느 정도 장기적 저항을 보장하기는 하나 방어 이상의 희망은 거의 주지 못할 교두보 거점 진지를 취하도록 강요당할 것이라는 점이 명백히 분명하다.\n\n이 작은 사령부는 실제로 현재 여건 하에서 선전포고 없는 전쟁에서 중국 전체와 맞서고 있으며, 어떤 긍정적이고 즉각적인 조치가 취해지지 않는 한 성공에 대한 희망은 정당화될 수 없고, 꾸준한 소모가 최종적 궤멸로 이어지는 것이 합리적으로 예상될 수 있다.\n\n사령부는 지금까지 양호한 사기와 현저한 능률을 보여주었으나, 5개월 동안 거의 끝나지 않는 전투에 종사해 왔으며 정신적으로 피로하고 육체적으로 소모된 상태다. 현재 우리가 운용할 수 있는 대한민국 군대의 전투 효율은 무시할 만하며, 경찰 및 헌병 용도로라면 어느 정도 효과가 있을 것이다. 다른 외국군 파견 부대들은 그들의 전투 효율이 어떻든 간에 병력이 너무 적어 거의 영향력을 행사하지 못한다. 제1해병사단을 제외하고 내가 운용할 수 있는 각 미군 사단은 이제 정원 대비 약 5천 명이 미달이며, 그들이 완전한 규정 병력 수를 충족한 적은 한 번도 없었다. 중국군 부대는 신선하고, 완전히 편제되어 있으며, 훌륭히 훈련되고 장비되었으며, 실제 작전을 위한 최상의 컨디션에 있는 것으로 보인다.\n\n이곳의 상황에 대한 일반적 평가는, 대단한 군사력을 지닌 전혀 새로운 강대국을 상대로 한, 전혀 새로운 조건 하에서의 전혀 새로운 전쟁이라는 기초 위에서 보아야만 한다.\n\n적으로서의 북한군에 기초하여 내가 작전을 수행 중인 지침들은 사건에 의해 완전히 구식이 되었다. 우리의 상대적으로 작은 군대가 이제 [1322면] 광범위한 소비에트 물자의 보급으로 증강된 중공 국가의 전면적 공격력과 맞서고 있다는 사실이 명백히 이해되어야 한다. 북한군에 대한 작전에 적합하여 큰 성공을 거둔 전략적 개념은 그러한 전력에 대한 계속적 적용이 가능한 것이 아니다. 이는 이와 관련된 현실들에 충분히 부응할 수 있는 정치적 결정과 그 이행을 위한 전략적 계획을 요구한다. 이에 있어 시간이 본질적이다. 매 시간이 적의 전력은 증가하고 우리의 것은 감소하는 것을 목격하기 때문이다.\n\n----- 각주 -----\n[주1] 11월 30일 오전 3시 33분에 접수된 도쿄 발 전보 C–50107의 각주 1을 볼 것, 1260면.", "secondary": "top secret \n flash\n\nTokyo, 3 December 1950.\n[Received December 3—3:51 a. m.]\n\nC–50332. Ref JCS 97772. [주1] The X Corps is being withdrawn into the Hamhung area as rapidly as possible. The situation within the Eighth Army becomes increasingly critical. General Walker reports, and I agree with his estimate, that he cannot hold the Pyongyang area and under enemy pressure, when exerted, will unquestionably be forced to withdraw to the Seoul area. There is no practicability, nor would any benefit accrue thereby, to attempt to unite the forces of the Eighth Army and the X Corps. Both forces are completely outnumbered and their junction would, therefore, not only not produce added strength, but actually jeopardize the free flow of movement that arises from the two separate logistical lines of naval supply and maneuver.\n\nAs I previously reported, the development of a defense line across the waist of Korea is not feasible because of the numerical weakness of our forces as considered in connection with the distances involved; by the necessity of supplying the two parts of the line from ports within each area; and by the division of the area into two compartments by the rugged mountainous terrain running north and south. Such a line is one of approximately 120 air miles with a road distance of approximately 150 miles. If the entire United States Force of seven divisions at my disposal were placed along this defensive line it would mean that a division would be forced to protect a front of approximately 20 miles against greatly superior numbers of an enemy whose greatest strength is a potential for night infiltration through rugged terrain. Such a line with no depth would have little strength, and as a defensive concept would invite penetration with resultant envelopment and piecemeal destruction. Such a concept against the relatively weaker North Korean Forces would have been practicable, but against the full forces of the Chinese Army is impossible.\n\nI do not believe that full comprehension exists of the basic changes which have been wrought by the undisguised entrance of the Chinese Army into the combat. Already Chinese troops to the estimated strength of approximately 26 divisions are in line of battle with an additional minimum of 200,000 to the enemy rear and now in process of being committed to action. In addition to this, remnants of the North Korean Army are being reorganized in the rear and there stands, [1321면] of course, behind all this the entire military potential of Communist China.\n\nThe terrain is of a nature to diminish the effectiveness of our air support in channelizing and interrupting the enemy supply system; it serves to aid the enemy in his dispersion tactics. This, together with the present limitation of international boundary, reduces enormously the normal benefit that would accrue to our superior air force.\n\nWith the enemy concentration inland, the Navy potential is greatly diminished in effectiveness; amphibious maneuver is no longer feasible and effective use of naval gunfire support is limited.\n\nThe potentials, therefore, of our combined strength are greatly reduced and the comparison more and more becomes one of relative combat effectiveness of ground forces.\n\nIt is clearly evident, therefore, that unless ground reinforcements of the greatest magnitude are promptly supplied, this Command will be either forced into successive withdrawals with diminished powers of resistance after each such move, or will be forced to take up beachhead bastion positions which, while insuring a degree of prolonged resistance, would afford little hope of anything beyond defense.\n\nThis small command actually under present conditions is facing the entire Chinese nation in an undeclared war and unless some positive and immediate action is taken, hope for success cannot be justified and steady attrition leading to final destruction can reasonably be contemplated.\n\nAlthough the command up to the present time has exhibited good morale and marked efficiency, it has been in almost unending combat for five months and is mentally fatigued and physically battered. The combat effectiveness of the Republic of Korea Forces now at our disposal is negligible; for police and constabulary uses they would have some effectiveness. The other foreign army contingents, whatever their combat efficiency may be, are in such small strength as to exercise little influence. Each United States division at my disposal other than the First Marine Division is now approximately 5,000 men understrength and at no time have they achieved their full authorized numerical complement. The Chinese troops are fresh, completely organized, splendidly trained and equipped and apparently in peak condition for actual operations.\n\nThe general evaluation of the situation here must be viewed on the basis of an entirely new war against an entirely new power of great military strength and under entirely new conditions.\n\nThe directives under which I am operating based upon the North Korean Forces as an enemy are completely outmoded by events. The fact must be clearly understood that our relatively small force now [1322면] faces the full offensive power of the Chinese Communist nation augmented by extensive supply of Soviet materiel. The strategic concept suitable for operations against the North Korean Army which was so successful is not susceptible to continued application against such power. This calls for political decisions and strategic plans in implementation thereof, adequate fully to meet the realities involved. In this, time is of the essence as every hour sees the enemy power increase and ours decline.", "notes": [], "warn": false, "pages": ["50-1321", "50-1322"], "search": "MacArthur 맥아더 Walker 워커 Joint Chiefs of Staff 합동참모본부"}, {"id": "50-d951", "order": 54, "date": "1950-12-03", "group": "E", "eyebrow": "50-d951 · Memorandum of Conversation, by the Director of the Executive Secretariat (McWilliams)", "title": "대화 비망록, 행정사무국장(맥윌리엄스) 작성", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-12-03"}, {"k": "시각", "v": "대략 정오"}, {"k": "발신", "v": "행정사무국장 맥윌리엄스(McWilliams)", "txt": true}, {"k": "수신", "v": "기록", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "회담 비망록"}, {"k": "원문출처", "v": "795.00/12–350", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d951"}], "summary": "군의 판단은 8군이 부산까지 철수할 수 있도록 저지선을 잡는다는 것이다. 케넌은 소련의 장기 계획이 아니라 즉흥 대응으로 보며 제3차 세계대전을 불가피하다고 보지 않는다.", "points": ["한국 군사 상황은 극도로 위험하지만 재앙 직전은 아니다.", "8군 주력은 필요시 부산으로 퇴각해 철수할 수 있도록 저지선을 편다.", "10군단 주력은 함흥에 집결하여 필요시 철수한다.", "한국군은 버리지 않고 남쪽으로 수송해 해산시키거나 한국 밖으로 데려간다.", "군 일각에서는 전면적인 중국 봉쇄와 주요 도시 집중 폭격을 거론한다.", "케넌은 최근 사태가 소련의 치밀한 계획이 아니라 상황에 따라 즉흥적으로 대응한 결과라고 본다.", "제섭은 정부 관리들의 느슨한 발언을 막기 위해 대통령이 연설·기자회견·인터뷰를 금지하도록 촉구한다."], "primary": "---\n\ntop secret\n\n[워싱턴,] 1950년 12월 3일.\n\n제목: 매슈스 씨 사무실에서 대략 정오에 열린 한국 관련 회의.\n\n참석자: 웨브, 매슈스, 제섭, 니츠, 케넌, 히커슨, 러스크, 배럿, 맥윌리엄스 제씨\n\n매슈스, 러스크, 제섭 및 니츠 제씨는 방금 국방장관과 그 보좌관들이 참석한 가운데 국방부에서 열린 회의에서 국무장관과 함께 돌아왔다. 매슈스 씨의 보고에 따르면, 군의 현재 생각은 한국의 군사 상황이 극도로 위험하기는 하지만 아직 재앙 직전의 상황은 아니라는 것이다. 필요할 경우 8군 주력이 부산 지역으로 퇴각하여 그곳에서 철수할 수 있도록 저지 진지들을 구축할 수 있을 것으로 생각되었다. 10군단 주력은 함흥 지역에 집결하라는 명령을 받았으며, 필요할 경우 그곳에서 철수할 예정이다. 군의 생각은 가능한 한 오래 계속 싸워야 하며 부득이한 경우에만 철수해야 한다는 것이다. 또한 한국군 병력을 우리 군대가 버려서는 안 되며, 남쪽으로 수송하여 해산시킨 뒤 각자 고향으로 잠입하게 하거나 한국 밖의 어떤 지점으로 데려가야 한다는 것이 그들의 생각이다. 군 관계자들은 중국과의 완전한 전쟁에 휩쓸리는 것은 현명하지 못하다는 점에 우리와 동의했으나, 해군과 공군은 철수할 경우 중국 공산군에게 그들의 행동에 대한 대가를 치르게 하는 어떤 조치를 취해야 한다고 믿고 있다. 이는 전면 봉쇄와 중국 주요 도시들에 대한 집중 공습의 형태를 띨 수 있다. 이것은 현시점에서는 결정 사항이 아니라 단지 국방부 일부 인사들의 생각을 나타내는 것일 뿐이다.\n\n이 회의에서는 소련의 의도와 능력에 관한 최신 국가 정보 판단서에 대한 논의도 있었다. 케넌 씨는 그것을 검토했지만 전적으로 동의하지는 않는다고 말했다. 그는 지난 몇 주간의 사건들이 소련의 치밀한 계획의 결과라고 믿지 않으며, 그들이 상황에 따라 즉흥적으로 대응해 왔고, 일련의 유리한 사건들을 통해 자신들이 애초에 바랐던 것보다 [1336면] 훨씬 더 유리한 위치에 서게 되었다고 생각한다고 말했다. 그는 또한 제3차 세계 대전이 불가피하다고 아직 믿지 않으며, 또 다른 한국 사태가 다른 곳에서 발생할 가능성이 높다고 믿지 않는다고 말했다.\n\n회의가 끝나갈 무렵 제섭 박사는 검열과 언론의 추측성 보도 문제에 대해 크게 우려하고 있다고 말했다. 그는 현시점에서 최악의 상황은 정부 관리들의 경솔한 발언이라고 생각했으며, 대통령에게 모든 개인의 연설, 기자 회견, 인터뷰를 중단시키라는 명령을 내리도록 요청할 것을 촉구했다. 그는 국무부에서 특파원들이 선정된 관리들을 만나 배경 설명을 듣도록 해 온 프로그램을 즉시 중단해야 하며, 대통령과 국무장관의 기자 회견에 사전에 질문을 제출하도록 하는 방안을 고려해야 한다고 말했다. 배럿 씨와 웨브 씨는 모두 이 문제에 주의를 기울이겠다고 말했다. [주1]\n\n----- 각주 -----\n[주1] 12월 5일 트루먼 대통령은 모든 각료와 행정부의 특정 다른 관리들에게 “외교 또는 군사 정책에 관한 공개 연설의 수를 줄이라”는 지령을 내렸다. 이 지령은 “외교 정책에 관한 연설, 보도 자료 또는 기타 공개 성명”은 사전에 국무부와, 군사 정책에 관한 그러한 성명은 국방부와 사전에 조율해야 한다는 필요성을 명시했다. 대통령은 또한 해외 주재 관리들, “군 지휘관과 외교 대표들을 포함하여, 공개 성명에 극도의 주의를 기울이고, 일상적인 성명을 제외한 모든 성명을 해당 부처와 조율하며, 미국 내 신문, 잡지 또는 기타 홍보 매체와 군사 또는 외교 정책에 관해 직접 소통하는 것을 삼가도록 명령해야 한다”는 지시를 내렸다. 이 지령은 12월 6일 합참에 의해 맥아더 장군에게 전달되었다. 전문은 청문회 기록물, 3536면을 보라.\n\n---", "secondary": "top secret\n\n[Washington,] December 3, 1950.\n\nSubject: Meeting in Mr. Matthews’ office, at approximately 12:00 Noon, re Korea.\n\nParticipants: Messrs. Webb, Matthews, Jessup, Nitze, Kennan, Hickerson, Rusk, Barrett, McWilliams\n\nMessrs. Matthews, Rusk, Jessup and Nitze had just returned from a meeting in the Pentagon attended by the Secretary with the Secretary of Defense and his advisers. Mr. Matthews reported that the current thinking of the military was that while the military situation in Korea was extremely dangerous, it was not yet bordering on a catastrophe. It was felt that blocking positions could be established to enable the bulk of the 8th Army to retreat, if necessary, to the Pusan area, where they could be evacuated. The bulk of the 10th Corps has been ordered to concentrate in the Hamhung area, where they will be evacuated if necessary. It is the feeling of the military that we should continue to fight as long as possible and only evacuate in event of necessity. It is also their feeling that the South Korean troops should not be abandoned by our forces, but should either be transported to the south where they could disband and infiltrate back to their homes or be taken to some point outside Korea. The military people agreed with us that it would be unwise to engage in a complete war with the Chinese, but the Navy and Air Force believe that we should take some action in the event of evacuation to repay the Chinese Communists for their deeds. This might take the form of a complete blockade and a concentrated air effort over the major cities of China. This is not, at the moment, a decision, but merely represents thinking of some of the people at the Pentagon.\n\nThere was some discussion in this meeting of the latest national intelligence estimate on Soviet intentions and capabilities. Mr. Kennan said that he had looked it over but did not entirely agree with it. He said he did not believe the events of the past few weeks were the result of a master plan by the Soviets, but that they had been playing the situation by ear and through a series of favorable events had found themselves in a much more advantageous position [1336면] than they had ever hoped. He also said that he did not yet believe that World War III was inevitable and he did not believe that another Korea is likely to break out in another place.\n\nToward the close of the meeting Dr. Jessup said that he was greatly concerned over the matter of censorship and press speculation. He thought that the worst thing that could happen at this point was loose statements by Government officials, and he urged that the President be asked to issue an order stopping all speechmaking, press conferences, and interviews by individuals. He said he thought that the program which has been going on in the Department of having correspondents see selected officials for background should be stopped at once, and that consideration should be given to having questions submitted in advance of their press conferences to the President and the Secretary. Mr. Barrett and Mr. Webb both said they would give attention to this matter. [주1]", "notes": ["[주1] 트루먼 대통령의 12월 5일 지령은 이 회의에서 논의된 우려에 대한 직접적인 후속 조치다."], "warn": false, "pages": ["50-1336"], "search": "맥윌리엄스(McWilliams, 행정사무국장) 웨브(Webb, 국무차관) 매슈스(Matthews, 국무부) 제섭(Jessup) 니츠(Nitze) 케넌(Kennan) 히커슨(Hickerson) 러스크(Rusk) 배럿(Barrett) 트루먼(Truman, 대통령) 맥아더(MacArthur, 유엔군사령관)"}, {"id": "50-d1003", "order": 55, "date": "1950-12-07", "group": "E", "eyebrow": "50-d1003 · Memorandum for the Record by the Ambassador at Large (Jessup)", "title": "대사 제섭의 기록용 비망록", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-12-07"}, {"k": "시각", "v": null}, {"k": "발신", "v": "Jessup, Ambassador at Large / Arneson, Special Assistant to the Secretary of State", "txt": true}, {"k": "수신", "v": "The Record / Mr. Battle, Secretary's Office", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "비망록"}, {"k": "원문출처", "v": "S/AE Files", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d1003"}], "summary": "트루먼이 애틀리에게 원폭 사용을 영국과 협의 없이 결정하지 않겠다고 말한 기록과, 이후 미국이 영국의 사전동의 조항을 폐기하고 공동성명으로 대체한 경위를 정리한 1953년 비망록", "points": ["트루먼 대통령은 1950년 12월 7일 애틀리 수상에게 원폭 사용을 영국과 협의하지 않겠다고 구두로 약속했으나, 문서화는 거부했다.", "애치슨 국무장관은 1953년 비망록에서 이 약속이 그대로 남아 있지 않으며, 공동성명이 공식 입장이라고 정리했다.", "러벳 국방장관은 1948년 모더스 비벤디로 퀘벡 협정의 영국 사전동의 조항이 폐기되었다고 지적했다.", "미국은 영국 회의록에 남은 트루먼의 첫 발언을 삭제하라고 요구했으나 영국은 자체 보관본에는 남겼다.", "애치슨의 입장서는 원폭 사용에 어떤 약속도 하지 말고, 사용을 원치 않으며, 영국과 보조를 맞추겠다는 점을 강조하라고 권고했다."], "primary": "top secret\n\n[워싱턴,] 1950년 12월 7일\n\n1950년 12월 7일 목요일, 백악관 각료실에서 열린 대통령과 수상 간 회담 발췌\n\n(이 정보는 회담 공식 기록에 포함되지 않았다.)\n\n대통령은 수상과 방금 대화를 나누었으며 원자폭탄과 그 사용에 관해 논의했다고 말했다. 대통령은 애틀리 씨에게 영국과 미국 정부는 이 문제에 있어 항상 동반자였으며, 영국과 협의 없이는 폭탄 사용을 고려하지 않을 것임을 상기시켰다. 수상은 이 합의를 문서화해야 하는지 물었고, 대통령은 아니라고, 문서화하지 않을 것이며, 사람의 말이 신뢰할 수 없다면 그것을 종이에 적는다고 해서 더 나아지는 것이 아니라고 답했다. 수상은 감사를 표했다.\n\n필립 C. 제섭\n\n이 사본은 국무장관실에서 배틀 씨가 보관할 단일 사본이다. [주1]\n\n[부속서]\n\n국무장관 특별보좌관 R. 고든 아니슨 씨의 기록용 비망록 [주2]\n\ntop secret\n\n[워싱턴,] 1953년 1월 16일.\n\n건명: 1950년 12월 트루먼-애틀리 회담: 원자무기 사용\n\n1.\n영국이 원자무기 사용 문제를 제기할 것에 대비하여 애치슨 국무장관이 대통령과 논의한 입장은 첨부 A에 있다. [주3]\n\n2.\n1950년 12월 7일 목요일, 백악관 각료실에서 열린 트루먼-애틀리 회담 제5차 회의 중, 대통령은 첨부 B에 반영된 취지에 따라 이 주제에 관해 발언했다. [주4]\n\n[1463면] 3.\n1950년 12월 8일 제6차 회의가 시작될 때, [주5] 애치슨 국무장관은 아니슨 씨에게 백악관으로 와서 공동성명에서 원자무기에 관해 무엇을 말해야 할지 조언해 달라고 요청했다.\n\n4.\n정오 12시가 조금 지나 대통령은 잠시 회의에서 물러나 자신의 집무실로 가서 애치슨 국무장관, 러벳 국방장관, 스나이더 재무장관, 해리먼 씨, 아니슨 씨와 공동성명에 포함될 문구를 논의했다. 논의 중 러벳 장관은 퀘벡 협정 [주6]이 미국이 원자무기를 사용하기 전에 영국의 동의를 얻도록 규정했음을 상기시켰다. 의회 원자력 합동위원회 위원들, 특히 밴덴버그 상원의원과 히컨루퍼 상원의원은 이 조항에 매우 우려했으며 이를 폐기하기 위한 조치를 취할 것을 가장 강력히 촉구했었다. 퀘벡 협정을 다른 약정으로 대체하기 위한 협상이 1947년 말에 착수되었으며 [주7] (당시 러벳 씨는 국무차관이었다), 이 협상의 주된 목적은 영국의 동의에 관한 조항을 종료시키는 것이었다. 그 결과인 1948년 1월 7일자 모더스 비벤디는 [주8] 무엇보다도 원자무기 사용에 관한 약속이 더 이상 효력이나 효과를 갖지 않도록 규정했다. 논의가 진행되면서 아니슨 씨가 문구 초안을 작성했고 이는 이후 1950년 12월 8일 최종 공동성명에 포함되었다. 대통령은 제안된 문구를 승인하고 애치슨 국무장관에게 이에 대한 영국의 수락을 받도록 요청했다.\n\n5.\n애치슨 국무장관은 올리버 프랭크스 경과 이 문제를 논의했고, 영국의 동의 하에 이 두 문장이 성명의 끝에서 두 번째 단락으로 삽입되었다. (첨부 C). [주9] 제6차 회의 미국 측 회의록은 다음과 같이 기술한다:\n\n\"대통령은 이어서 자신과 수상이 합의했으며 성명에 포함될 예정인 문장이 두어 개 더 있다고 말했다. 그런 다음 대통령은 최종 성명에 나타난 대로 원자폭탄을 다루는 문장들을 읽어 주었다. 대통령은 우리가 이를 삽입할 적절한 위치를 찾아야 한다고 말했다.\"\n\n6.\n이후 회의록을 비교하는 과정에서 웨인 잭슨 씨는 영국 측 제5차 회의록에 대통령이 이 주제에 관해 한 최초의 발언과 같은 취지의 대목이 포함되어 있음을 알게 되었다 [1464면] (첨부 A). [주10] 대통령이 이를 정정했고 그 정정이 회의 자체의 기록에 대한 변경을 구성하므로 이 진술은 삭제되어야 한다는 점이 당시 지적되었다. 이 문제에 관한 미국의 입장은 공동성명의 문안에 반영된 대로임이 지적되었다. (이 점에 관한 제섭 대사의 비망록은 첨부 D를 보라.) [주11]\n\n7.\n이후 영국대사관 F. W. 마튼 씨와의 대화에서 아니슨 씨는 동일한 점을 지적할 기회가 있었는데, 즉 대통령이 합의하고 애틀리 수상이 수락한 미국의 공식 입장은 공동성명의 끝에서 두 번째 단락에 명시된 대로이며 — 그 이상도 이하도 아니라는 것이었다.\n\n[하위부속서]\n\n트루먼-애틀리 회담을 위해 작성된 입장서\n\n원자폭탄 사용\n\n현재 입장\n\n대통령은 (a) 법적으로 오직 자신만이 사용을 승인할 수 있으며, (b) 사용을 승인한 바 없다는 점을 분명히 해 왔다.\n\n대통령 기자회견에서의 질문과 답변을 다루는 언론의 선정적인 보도는 대통령이 중국에서의 폭탄 사용을 적극적으로 고려하고 있다는 인상을 주었다. [주12]\n\n영국의 입장\n\n폭탄은 협의 없이 — 그리고 아마도 합의 없이 — 그들 및 아마도 다른 나라들과 사용되어서는 안 된다는 것. 아마도 또한 그들은 중국에서의 사용에 강력히 반대할 것이다.\n\n[1465면]\n\n기타 요소\n\n이는 대통령이 알고 있는 사항들이다.\n\n애틀리 논의를 위한 권고\n\n(a)\n미국의 행동을 제한하는 어떠한 약속도 하지 말 것.\n\n(b)\n폭탄을 사용하기를 원하지 않는다는 우리의 바람을 강조할 것.\n\n(c)\n그 사용이 모두에게 끔찍한 결과를 초래하리라는 우리의 인식과 우리의 큰 책임감을 강조할 것. 이 점에서 우리는 실로 세계의 미래를 위한 수탁자이다.\n\n(d)\n영국과 보조를 맞춰 나아가고자 하는 우리의 바람과 기대를 강조할 것. (이 문제에서 그들의 역할이 이를 요구한다.)\n\n(e)\n예비 논의 후 필요하다면 우리 입장에 대한 추가 검토를 착수할 것.\n\n----- 각주 -----\n[주1] 원문에 있는 주.\n[주2] 아니슨 씨는 이전에 국무차관 특별보좌관이었으며, 1950년 11월 13일부로 애치슨 씨의 원자력 문제 특별보좌관직을 맡았다. 1953년 1월 16일에도 동일한 직책을 유지하고 있었다.\n[주3] 아래의 이 문서 하위부속서를 보라.\n[주4] 위의 제섭 씨 비망록을 보라.\n[주5] 아래, 1468면.\n[주6] 본문은 Foreign Relations, The Conferences at Washington and Quebec, 1943, 1117면.\n[주7] Foreign Relations, 1947, vol. i, pp. 781 ff를 보라.\n[주8] ibid., 1948, vol. i, Part 2, pp. 677 ff를 보라.\n[주9] 성명은 12월 8일 제6차 회의 회의록 부속서로 인쇄되어 있다, 1476면.\n[주10] 추정컨대 언급은 첨부 B, 즉 이 주제에 관한 트루먼 대통령의 \"최초 발언\"을 반영한 1462면의 제섭의 12월 7일자 비망록을 가리키는 것임.\n[주11] 1951년 1월 9일자 제섭 씨의 기록용 비망록은 다음과 같다: \"트루먼-애틀리 회담 회의록에 관해 영국 측과 논의하는 중, 웨인 잭슨 씨는 그들이 자체 파일에 보관하고 있는 제5차 회의록에 대통령이 원자폭탄 주제에 관해 한 최초의 발언이 포함되어 있다는 통보를 받았다. 우리는 대통령이 이를 정정했고 그 정정이 회의 자체의 기록에 대한 변경을 구성하므로 이 진술은 삭제되어야 한다고 주장했다. 그들은 그들의 파일 사본에 관한 한 이 주장을 받아들이지 않았지만, 그들이 우리와 교환하는 회의록 사본에서는 이 단락이 삭제되어 있다.\"\n[주12] 11월 30일 트루먼 대통령의 기자회견에 관한 편집자 주를 보라, 1261면.", "secondary": "top secret\n\n[Washington,] December 7, 1950.\n\nExcerpt From Meeting Between the President and Prime Minister in the Cabinet Room of the White House, Thursday, December 7, 1950\n\n(This information not incorporated in official account of meetings.)\n\nThe President said he had just talked with the Prime Minister and that they had discussed the atomic bomb and its use. The President reminded Mr. Attlee that the Governments of the United Kingdom and the United States had always been partners in this matter and that he would not consider the use of the bomb without consulting with the United Kingdom. The Prime Minister asked whether this agreement should be put in writing, and the President replied no that it would not be in writing, that if a man’s word wasn’t any good it wasn’t made any better by writing it down. The Prime Minister expressed his thanks.\n\nPhilip C. Jessup\n\nThis is single copy to be retained by Mr. Battle in the Secretary’s office. [주1]\n\n[Annex]\n\nMemorandum for the Record, by Mr. R. Gordon Arneson, Special Assistant to the Secretary of State [주2]\n\ntop secret\n\n[Washington,] January 16, 1953.\n\nSubject: Truman–Attlee Conversations of December 1950: Use of Atomic Weapons\n\n1.\n\nThe position which Secretary Acheson discussed with the President, in anticipation of the British raising the question of the use of atomic weapons, is attached at Tab A. [주3]\n\n2.\n\nIn the course of the Fifth Meeting of the Truman–Attlee conversations in the Cabinet Room of the White House, Thursday, December 7, 1950, the President spoke to the subject along the lines reflected in Tab B. [주4]\n\n[1463면] 3.\n\nAs the Sixth Meeting began on December 8, 1950, [주5] Secretary Acheson called for Mr. Arneson to join him at the White House to advise him as to what should be said in the Joint Communiqué concerning atomic weapons.\n\n4.\n\nShortly after 12 o’clock noon the President withdrew briefly from the meeting and went to his office to discuss with Secretary Acheson, Secretary Lovett, Secretary Snyder, Mr. Harriman, and Mr. Arneson the language to be incorporated in the Joint Communiqué. During the discussion, Secretary Lovett recalled that the Quebec Agreement [주6] had provided that the United States had to obtain United Kingdom consent before using the atomic weapon. Members of the Joint Congressional Committee on Atomic Energy, particularly Senator Vandenberg and Senator Hickenlooper, had been very disturbed at this provision and had urged most strongly that steps be taken to abrogate it. Negotiations were undertaken at the end of 1947 [주7] (Mr. Lovett was then Under Secretary of State) to supplant the Quebec Agreement with other arrangements. A salient objective of these negotiations was to terminate the provision concerning United Kingdom consent. The resultant Modus Vivendi of January 7, 1948, [주8] provided, among other things, that the commitment concerning use of atomic weapons was to have no further force or effect. As the discussion proceeded, Mr. Arneson drafted the language which was subsequently incorporated in the final Joint Communiqué of December 8, 1950. The President approved the suggested language and asked Secretary Acheson to secure British acceptance thereof.\n\n5.\n\nSecretary Acheson discussed the matter with Sir Oliver Franks and, with British concurrence, these two sentences were inserted as the penultimate paragraph of the Communiqué. (Tab C). [주9] The United States Minutes of the Sixth Meeting state:\n\n“The President then said there were a couple more sentences on which he and the Prime Minister had agreed and which were to be included in the communiqué. He then read the sentences dealing with the atomic bomb as they appear in the final communiqué. The President said we should find the proper place to insert them.”\n\n6.\n\nIn the course of subsequent comparison of minutes of the meetings, Mr. Wayne Jackson learned that the British Minutes of the Fifth Meeting included a passage along the lines of the first statement which [1464면] the President made on the subject. (Tab A). [주10] The point was made at that time that this statement should be deleted since the President had corrected it and his correction constituted a change in the record of the conference itself. It was pointed out that the United States position on this matter was as reflected in the text of the Joint Communiqué. (For Ambassador Jessup’s note on this point, see Tab D.) [주11]\n\n7.\n\nIn subsequent conversations with Mr. F. W. Marten of the British Embassy, Mr. Arneson had occasion to make the same point, namely that the official United States position as agreed by the President and as accepted by Prime Minister Attlee, was set forth in the penultimate paragraph of the Joint Communiqué—no more and no less.\n\n[Subannex]\n\nPosition Paper Prepared for the Truman–Attlee Talks\n\nUse of Atomic Bomb\n\npresent position\n\nThe President has made clear (a) that by law only he can authorize its use, and (b) that he has not authorized its use.\n\nThe sensational action by the press in dealing with the questions and answers at the President’s press conference [주12] has given the impression that the President is actively considering use of the bomb in China.\n\nbritish position\n\nThat the bomb should not be used without consultation—and probably without agreement—with them and perhaps others. Probably, also, they are strongly opposed to its use in China.\n\n[1465면]\n\nother factors\n\nThese are known to the President.\n\nrecommendations for attlee discussions\n\n(a)\n\nThat no commitment be made restricting the action of the U.S.\n\n(b)\n\nThat our desire not to use the bomb be stressed.\n\n(c)\n\nThat our realization of the dire consequences for all of its use be stressed and our great sense of responsibility. We are, indeed, trustees for the future of the world in this respect.\n\n(d)\n\nThat our desire and expectation to move in step with the British be stressed. (Their role in this matter requires this.)\n\n(e)\n\nThat, if necessary after the preliminary discussions, further consideration of our position be undertaken.", "notes": ["이 문서는 1950년 12월 7일 트루먼-애틀리 회담에서 있었던 원폭 사용 약속을 둘러싼 구두 합의와, 이후 이를 문서로 공식화하는 과정에서 발생한 이견을 보여준다. 특히 트루먼이 애틀리에게 약속한 '영국과의 사전 협의'가 1948년 모더스 비벤디로 이미 폐기된 의무였으며, 미국은 이를 공동성명의 모호한 문구로 대체하려 했음을 1953년 시점에서 재확인하는 것이 주된 골자다."], "warn": false, "pages": ["50-1463", "50-1464", "50-1465"], "search": "Truman 트루먼 Attlee 애틀리 Jessup, Philip C. 필립 제섭 Battle 배틀 Arneson, R. Gordon R. 고든 아니슨 Acheson 애치슨 Lovett 러벳 Snyder 스나이더 Harriman 해리먼 Vandenberg 밴덴버그 Hickenlooper 히컨루퍼 Franks, Sir Oliver 올리버 프랭크스 경 Jackson, Wayne 웨인 잭슨 Marten, F. W. F. W. 마튼"}, {"id": "50-d1099", "order": 56, "date": "1950-12-29", "group": "B", "eyebrow": "50-d1099 · The Joint Chiefs of Staff to the Commander in Chief, Far East (MacArthur)  The source text is a copy of this message sent on January 2, 1951 to Mr. Rusk fry Col. L. K. Ladue, Deputy Secretary of the JCS.", "title": "합동참모본부가 극동군사령관(맥아더)에게 보낸 전문", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-12-29"}, {"k": "시각", "v": null}, {"k": "발신", "v": "합동참모본부(Joint Chiefs of Staff)", "txt": true}, {"k": "수신", "v": "극동군사령관 맥아더(Commander in Chief, Far East, MacArthur)", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": "JCS 99935"}, {"k": "종류", "v": "전보"}, {"k": "원문출처", "v": "795.00/12–2950: Telegram", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d1099"}], "summary": "합참이 한국은 큰 전쟁을 치를 곳이 아니라며 맥아더에게 단계적 철수 방침을 내렸다.", "points": ["현재의 모든 판단으로 볼 때 중공군은 유엔군을 한국에서 몰아낼 능력을 갖추었다.", "한국은 큰 전쟁을 치를 곳이 아니다. 또한 일반 전쟁의 위협이 커지는 상황에서 남은 지상군을 한국에 투입해서는 안 된다.", "맥아더의 기본 지령을 수정하여, 아군 안전을 최우선으로 하며 연속된 진지에서 방어하도록 지시한다.", "아군이 금강 부근까지 밀리고 중공군이 아군을 몰아낼 능력을 명백히 보이면, 일본으로의 철수를 개시하라는 명령을 내릴 필요가 있을 것이다.", "일본 방어라는 지속적 주요 임무에 비추어, 철수 개시를 결정할 조건에 대한 맥아더의 견해를 요청한다."], "primary": "top secret\noperational immediate\n\n[워싱턴,] 1950년 12월 29일.\n\n[JCS 99935.] 합참으로부터 맥아더 귀관 앞. 이 전문은 이곳에서 최고 수준의 보안을 유지하며 취급되었으며, 그 내용은 당분간 귀관과 귀관의 참모장, 리지웨이 장군[주2]과 그의 참모장에게만 국한할 것을 권고함. 전문 내용은 다음과 같음.\n\n이용 가능한 모든 판단으로 볼 때, 중국 공산군은 마음만 먹으면 유엔군을 한국에서 몰아낼 능력을 갖추고 있는 것으로 보인다. 이러한 능력의 실행은 적에게 너무 큰 대가를 치르게 하여 포기하게 만들거나, 상당한 규모의 추가 미군을 그 전역에 투입함으로써 저지될 수 있겠지만, 후자는 일본의 안전을 포함한 다른 임무를 심각하게 위태롭게 할 것이다. 다른 유엔 회원국으로부터 한국을 위한 상당한 추가 병력을 얻는 것은 현실적으로 불가능하다. 우리는 한국이 큰 전쟁을 치를 곳이 아니라고 믿는다. 더 나아가, 우리는 일반 전쟁의 위협이 증가하고 있는 상황에서 가용한 나머지 지상군을 한국의 중국 공산군에 대항하여 투입해서는 안 된다고 믿는다. 그러나 심각한 손실을 초래하지 않고 달성할 수 있다면, 한국의 어떤 진지에서 중국-북한의 침략에 성공적으로 저항하고 중국 공산군의 군사적·정치적 위신을 실추시키는 것은 우리의 국익에 대단히 중요할 것이다.\n\n무력 공격을 격퇴하고 그 지역의 국제 평화와 안전을 회복하는 데 필요한 지원을 대한민국에 제공하라는 귀관의 기본 지령은 현재 정세에 비추어 수정이 필요하다.\n\n이제 귀관에게, 귀관의 CX 50635[주3]에서 일반적으로 개괄된 바와 같이 연속된 진지에서 방어하도록 지시하며, 아군 부대의 안전을 최우선으로 고려하는 조건 하에 한국의 적대 세력에게 가능한 한 피해를 입힐 것을 지시한다. 재래식 수단과 비재래식 수단을 모두 포함하여, 지속적인 저항을 위해 한국 측의 기여를 최대한 동원하려는 모든 노력이 계속되어야 한다.\n\n[1626면]\n\n상황의 전개로 인해 우리가 한국에서 철수해야 할 수도 있으므로, 특히 일본에 대한 지속적인 위협을 고려할 때, 질서 있는 철수를 위한 우리의 마지막 합리적 기회를 사전에 결정하는 것이 중요하다. 우리가 보기에, 만약 귀관이 금강 부근의 진지와 그곳에서 대체로 동쪽으로 이어지는 선까지 밀려나고, 그 후 중국 공산군이 우리를 한국에서 몰아낼 명백한 능력을 갖추고 귀관의 진지에 대규모 병력을 집결시킨다면, 그러한 조건 하에서는 귀관에게 일본으로의 철수를 개시하도록 지시할 필요가 있을 것이다.\n\n철수 개시 결정을 판가름할 위에 개괄된 조건들에 대한 귀관의 견해를 요청하며, 특히 오직 제8군 소속 부대만이 가용한 일본 방어라는 귀관의 지속적 주요 임무에 비추어 견해를 밝혀주기 바란다.\n\n귀관의 견해를 접수한 후, 귀관이 철수를 개시해야 할 조건에 관한 명확한 지령이 주어질 것이다.\n\n----- 각주 -----\n[주1] 원본 텍스트는 1951년 1월 2일 러스크 씨에게 합참 부서기장 L. K. 라두 대령을 통해 발송된 이 전문의 사본이다.\n[주2] 육군 중장 매슈 B. 리지웨이는 월턴 H. 워커 장군의 사고사 이후 제8군 사령관직을 맡기 위해 12월 26일 한국에 도착했다.\n[주3] 인쇄되지 않음. 이 전문의 요지는 『합동참모본부 조치 기록』 74면에 다음과 같이 기술되어 있다: \"1950년 12월 7일, 극동군사령관은 필요시 부산 지역까지 연속된 진지에서 철수하라는 지시를 내렸으며, 제8군은 포위될 위험을 무릅쓰지 않는 한 가능한 한 오래 서울 지역을 확보하고, 제10군단은 흥남 지역에서 철수하여 최종적으로 제8군에 재합류하도록 하였다. 이 계획은 1950년 12월 8일 합동참모본부의 승인을 받았다.\"", "secondary": "top secret \n operational immediate\n\n[Washington,] December 29, 1950.\n\n[JCS 99935.] From JCS personal for MacArthur. This Message has been handled here with the ultimate of security and it is suggested that the contents thereof be confined, for the present, to you and your Chief of Staff and to General Ridgway [주2] and his Chief of Staff. Message follows:\n\nIt appears from all estimates available that the Chinese Communists possess the capability of forcing United Nations forces out of Korea if they choose to exercise it. The execution of this capability might be prevented by making the effort so costly to the enemy that they would abandon it, or by committing substantial additional United States forces to that theater thus seriously jeopardizing other commitments including the safety of Japan. It is not practicable to obtain significant additional forces for Korea from other members of the United Nations. We believe that Korea is not the place to fight a major war. Further, we believe that we should not commit our remaining available ground forces to action against Chinese Communist forces in Korea in face of the increased threat of general war. However, a successful resistance to Chinese-North Korean aggression at some position in Korea and a deflation of the military and political prestige of the Chinese Communists would be of great importance to our national interests, if this could be accomplished without incurring serious losses.\n\nYour basic directive to furnish such assistance to the Republic of Korea as may be necessary to repel the armed attack and to restore international peace and security in that area requires modification in the light of the present situation.\n\nYou are now directed to defend in successive positions, as generally outlined in your CX 50635, [주3] inflicting such damage to hostile forces in Korea as is possible, subject to the primary consideration of the safety of your troops. Every effort should be continued to mobilize the maximum Korean contribution to sustained resistance, including both conventional and unconventional means.\n\n[1626면]\n\nSince developments may force our withdrawal from Korea, it is important, particularly in view of the continued threat to Japan, to determine, in advance, our last reasonable opportunity for an orderly evacuation. It seems to us that if you are forced back to positions in the vicinity of the Kum River and a line generally eastward therefrom, and if thereafter the Chinese Communists mass large forces against your positions with an evident capability of forcing us out of Korea, it then would be necessary, under these conditions, to direct you to commence a withdrawal to Japan.\n\nYour views are requested as to the above-outlined conditions which should determine a decision to initiate evacuation, particularly in light of your continuing primary mission of defense of Japan for which only troops of the Eighth Army are available.\n\nFollowing the receipt of your views you will be given a definite directive as to the conditions under which you should initiate evacuation.", "notes": ["[주2] 리지웨이의 한국 도착일을 원문은 12월 26일로 적고 있다. 리지웨이는 12월 26일 오전 도쿄에 도착하여 맥아더를 만난 후 당일 한국으로 이동했다.", "[주3] 원문의 'CX 50635'는 극동군사령부(CINCFE)의 전문 번호 체계로 보이며, 편집자 주에서 그 핵심 내용을 '부산 지역까지의 단계적 철수 계획'으로 밝히고 있다."], "warn": false, "pages": ["50-1626"], "search": "맥아더(Douglas MacArthur) 리지웨이(Matthew B. Ridgway) 러스크(Dean Rusk) 라두(L. K. Ladue) 워커(Walton H. Walker)"}]</script>
