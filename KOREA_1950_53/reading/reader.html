<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전쟁의 세 해 — 열람기</title>
<style>
:root{
  --bg:#eef1f4; --panel:#f7f9fa; --edge:#ccd4da; --edge-soft:#dde4e9;
  --ink:#16202a; --ink-2:#4a5b68; --ink-3:#71828f;
  --stamp:#8c2f39;            /* 기밀등급 도장의 자주색 */
  --link:#2f5d86;
  --a:#4a7c59; --b:#8a6d3b; --c:#3f6d8c; --d:#7a4a6b; --e:#5a6f7d; --x:#8a8f94;
  --term-line:#9db0c2; --term-bg:rgba(47,93,134,.05);
  --term-line-go:#7fa3c4; --term-bg-go:rgba(47,93,134,.10);
  --term-bg-on:rgba(47,93,134,.17);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",
         -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
    --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
    --stamp:#c9707a; --link:#7fb0da;
    --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
    --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
    --term-bg-on:rgba(127,176,218,.22);
    --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
  }
}
:root[data-theme="dark"]{
  --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
  --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
  --stamp:#c9707a; --link:#7fb0da;
  --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
  --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
  --term-bg-on:rgba(127,176,218,.22);
  --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--link)}

.wrap{display:grid;grid-template-columns:minmax(300px,25%) 1fr;height:100vh}

/* 좁은 화면 — 목록을 위로 접어 올리면 본문이 설 자리가 없다.
   목록은 서랍으로 빼고 화면 전부를 문서에 준다. */
.mbar{display:none}
.scrim{display:none}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;grid-template-rows:1fr;padding-top:44px}
  .mbar{display:flex;align-items:center;gap:10px;
    position:fixed;top:0;left:0;right:0;height:44px;z-index:30;padding:0 12px;
    background:var(--panel);border-bottom:1px solid var(--edge)}
  .mbar button{background:var(--term-bg-go);border:1px solid var(--term-line-go);
    color:var(--link);border-radius:999px;padding:3px 11px;cursor:pointer;
    font:inherit;font-size:12px;font-family:var(--mono);white-space:nowrap}
  .mbar-t{font-size:12.5px;font-weight:650;color:var(--ink-2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail{position:fixed;top:0;bottom:0;left:0;z-index:40;
    width:min(88vw,340px);max-height:none;
    transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:0 0 30px rgba(0,0,0,.35)}
  body.railopen .rail{transform:none}
  .scrim{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45);border:0;padding:0}
  body.railopen .scrim{display:block}
  .toolbar{padding:7px 16px;gap:8px}
  .toolbar #themeBtn{display:none}
  .mbar-t{flex:1}
  .mbar-th{padding:3px 9px;font-size:13px}
  .seg button{padding:4px 9px;font-size:11.5px}
  .srcline{padding:10px 16px 0}
}
@media(prefers-reduced-motion:reduce){.rail{transition:none}}

/* ── 좌측 목록 ─────────────────────────────── */
.rail{border-right:1px solid var(--edge);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
.rail-head{padding:14px 14px 10px;border-bottom:1px solid var(--edge-soft);
  display:flex;flex-direction:column;gap:8px}
/* 문서철에 들어오면 나갈 길이 있어야 한다 */
.home{display:inline-flex;align-items:center;gap:5px;text-decoration:none;
  color:var(--link);font-size:11.5px;font-family:var(--mono);
  letter-spacing:.04em;width:fit-content;
  background:var(--term-bg-go);border:1px solid var(--term-line-go);
  border-radius:999px;padding:2px 10px 2px 8px}
.home:hover{background:var(--term-bg-on);border-color:var(--link)}
.home span{font-size:12px;line-height:1}
.brand{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font-weight:400;letter-spacing:0;text-transform:none;
  color:var(--ink-3);font-size:11.5px;margin-top:2px}
input[type=search]{width:100%;padding:7px 10px;border:1px solid var(--edge);
  border-radius:3px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
input[type=search]:focus,button:focus-visible,.item:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--edge);background:transparent;color:var(--ink-2);
  border-radius:999px;padding:2px 9px;font-size:11.5px;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sortbar{display:flex;gap:10px;font-size:11.5px;color:var(--ink-3);align-items:center}
.sortbar button{background:none;border:none;color:var(--ink-3);cursor:pointer;
  font:inherit;padding:0;border-bottom:1px solid transparent}
.sortbar button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.list{overflow-y:auto;flex:1;min-height:0}
.item{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--edge-soft);border-left:3px solid transparent;
  padding:9px 13px;cursor:pointer;font:inherit;color:inherit}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--bg);border-left-color:var(--ink)}
.item.tA{border-left-color:var(--a)} .item.tB{border-left-color:var(--b)}
.item.tC{border-left-color:var(--c)} .item.tD{border-left-color:var(--d)}
.item.tE{border-left-color:var(--e)} .item.tX{border-left-color:var(--x)}
.item-top{display:flex;justify-content:space-between;gap:8px;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.item-sum{font-size:12.5px;line-height:1.45;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 제목이 「국무장관이 주한대사에게」 꼴이라 무엇을 읽는 것인지 알 수 없다.
   요지 한 줄을 옅게 깔아 준다. 목록이 길어지지 않도록 두 줄에서 자른다. */
.item-hint{font-size:11.5px;line-height:1.4;margin-top:3px;color:var(--ink-3);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── 우측 본문 ─────────────────────────────── */
.main{overflow-y:auto;min-height:0}
.toolbar{position:sticky;top:0;z-index:5;background:var(--panel);
  border-bottom:1px solid var(--edge);padding:8px 26px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px}
.toolbar .grow{flex:1}
.seg{display:flex;border:1px solid var(--edge);border-radius:3px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 11px;cursor:pointer;
  font:inherit;font-size:12px;color:var(--ink-2);border-right:1px solid var(--edge)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.srcline{padding:10px 26px 0;font-size:11px;color:var(--ink-3);line-height:1.5}

/* ── 연대 바 ───────────────────────────────
   5년 반을 한 줄에 욱여넣으면 1945년 8월 열흘은 0.5% 밖에 안 된다. 그래서
   줄을 늘여 놓고 **띠 자체를 움직인다** — 지금 읽는 문서의 날짜가 늘 정중앙이다.
   문서를 옮기면 띠가 미끄러지고, 사건 이름은 겹치지 않게 위아래로 층을 나눈다. */
.chrono{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
  width:min(940px,calc(100vw - 48px));z-index:20;user-select:none;
  border:1px solid var(--edge);border-radius:8px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 20px rgba(0,0,0,.10);
  transition:box-shadow .2s ease}
.chrono:hover{box-shadow:0 6px 26px rgba(0,0,0,.18)}
/* 옅어지는 것은 **내용**이지 판이 아니다. 판까지 투명해지면 뒤의 본문이
   비쳐 들어와 글자가 서로를 밟는다. */
.chrono-track{opacity:.5;transition:opacity .2s ease}
.chrono:hover .chrono-track{opacity:1}

/* 띠가 지나가는 창. 손으로도 밀 수 있게 진짜 가로 스크롤을 쓴다 */
.chrono-vp{position:relative;overflow-x:auto;overflow-y:hidden;
  height:var(--chH,92px);border-radius:8px;cursor:grab;
  scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain}
.chrono-vp::-webkit-scrollbar{display:none}
.chrono-vp.drag{cursor:grabbing}
/* 안쪽 띠. 양옆 여백은 창의 절반 — 첫 문서도 마지막 문서도 가운데에 설 수 있게 */
.chrono-track{position:relative;height:100%;margin:0 var(--chPad,0px)}
/* 시간 축 — 층의 한가운데 */
.chrono-track::before{content:"";position:absolute;
  left:calc(0px - var(--chPad,0px));right:calc(0px - var(--chPad,0px));
  top:var(--axis,46px);height:1px;background:var(--edge)}

/* 연도 — 해가 바뀌는 자리에 선을 긋고, 그 선부터가 그 해다.
   이름표는 창 왼쪽에 들러붙는다. 1945년 한복판을 보고 있어도 「1945」가 남는다. */
.cy{position:absolute;top:0;bottom:0;
  border-left:1px solid color-mix(in srgb,var(--ink-3) 50%,transparent)}
.cy.alt{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.cy b{position:absolute;bottom:3px;font-family:var(--mono);font-size:11px;
  font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;
  line-height:1;letter-spacing:.06em;white-space:nowrap;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px}
/* 달·분기 눈금 — 해 안에서 어디쯤인지. 분기는 조금 길게 */
/* 1px 짜리 표는 좌표에 걸터앉혀야 한다. 왼쪽 모서리를 좌표에 맞추면 표가
   반 픽셀 오른쪽에 서서, 같은 날짜의 점과 어긋나 보인다. 아래 실·표도 같다. */
.cq{position:absolute;top:calc(var(--axis,46px) - 1.5px);width:1px;height:4px;
  margin-left:-.5px;background:var(--edge);opacity:.7}
.cq.q{top:calc(var(--axis,46px) - 2.5px);height:6px;opacity:1}
.cq[hidden]{display:none}

/* 배율 — 5년 반을 한눈에 볼 때와 8월 열흘을 벌려 볼 때가 같을 수 없다 */
.chrono-zoom{position:absolute;right:6px;top:5px;z-index:3;display:flex;gap:3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-zoom,.chrono-zoom:focus-within{opacity:1}
.chrono-zoom button{width:19px;height:19px;padding:0;line-height:1;
  font-family:var(--mono);font-size:12px;color:var(--ink-2);cursor:pointer;
  background:var(--panel);border:1px solid var(--edge);border-radius:3px}
.chrono-zoom button:hover:not(:disabled){color:var(--link);border-color:var(--link)}
.chrono-zoom button:disabled{opacity:.35;cursor:default}
.chrono-scale{position:absolute;right:6px;bottom:3px;z-index:3;
  font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.03em;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-scale{opacity:1}

/* 사건 점 — 이름에서 내려오는 실보다 위다. 실이 점 위를 지나가면
   점이 실에 꿰뚫린 것처럼 보이고, 어느 것이 사건 자리인지 흐려진다. */
.cm{position:absolute;top:calc(var(--axis,46px) - 3px);width:7px;height:7px;
  margin-left:-3.5px;border-radius:50%;background:var(--ink-3);z-index:2;
  border:1.5px solid var(--panel);cursor:help;
  transition:background .15s ease,transform .15s ease}
.cm.key{background:var(--stamp);width:9px;height:9px;margin-left:-4.5px;
  top:calc(var(--axis,46px) - 4px)}
.cm:hover{background:var(--link);transform:scale(1.45)}

/* 사건 이름 — 층(lane)을 나눠 위아래로 흩는다. 여기서 겹침이 풀린다 */
.cl{position:absolute;transform:translateX(-50%);white-space:nowrap;z-index:1;
  font-family:var(--mono);font-size:10px;line-height:1.1;color:var(--ink-2);
  letter-spacing:.01em;padding:1px 4px;border-radius:2px;cursor:help;
  background:color-mix(in srgb,var(--panel) 70%,transparent)}
.cl.key{color:var(--stamp)}
.cl:hover,.cl:focus-visible{color:var(--link);outline:0;
  background:color-mix(in srgb,var(--link) 12%,var(--panel))}
/* 이름에서 축까지 내려/올려 긋는 실 — 어느 점의 이름인지 알아보게 */
.cl::after{content:"";position:absolute;left:calc(50% - .5px);width:1px;
  background:var(--edge)}
.cl.up::after{top:100%;height:var(--leg,0px)}
.cl.dn::after{bottom:100%;height:var(--leg,0px)}

/* 지금 읽는 문서가 놓인 자리. 문서를 고르면 이 표가 창 한가운데로 온다.
   손으로 띠를 밀면 표는 제 날짜에 남는다 — 표는 시간에 박혀 있지 창에 박혀 있지 않다. */
.chrono-cursor{position:absolute;top:0;bottom:0;width:1px;z-index:3;
  margin-left:-.5px;background:var(--stamp);pointer-events:none}
/* 가상 요소는 위의 *{box-sizing:border-box}가 닿지 않는다 — 여기서 직접 잡아 주지
   않으면 테두리 2px 만큼 표시가 축 아래·오른쪽으로 밀려 앉는다. */
.chrono-cursor::before{content:"";position:absolute;box-sizing:border-box;
  left:-6px;top:calc(var(--axis,46px) - 6px);width:13px;height:13px;
  border-radius:50%;background:var(--stamp);border:2px solid var(--panel)}
/* 날짜는 맨 아래, 표 바로 밑에 — 위쪽은 사건 이름 층에 내준다 */
.chrono-date{position:absolute;bottom:2px;transform:translateX(-50%);
  font-family:var(--mono);font-size:10px;color:var(--stamp);
  font-variant-numeric:tabular-nums;background:var(--panel);
  padding:0 5px;border-radius:2px;white-space:nowrap;z-index:3}
.chrono[data-nodate="1"] .chrono-cursor,
.chrono[data-nodate="1"] .chrono-date{display:none}

/* 좁은 화면에서도 연대 바는 남긴다 — 이 화면의 절반은 「언제인가」이다.
   폭을 화면 끝까지 늘리고, 손가락으로 미는 것이 이미 되므로 줌 단추는 접는다. */
@media(max-width:900px){
  .chrono{bottom:8px;width:calc(100vw - 16px);border-radius:6px}
  .chrono-zoom{display:none}
  .chrono-track{opacity:1}
}
@media(prefers-reduced-motion:reduce){.chrono-track{transition:none}}

/* 아래쪽 여백은 떠 있는 연대 바가 마지막 문단을 덮지 않을 만큼 */
article{max-width:none;padding:26px 26px 190px}
@media(max-width:900px){article{padding:18px 16px 170px}}

/* ── 앞뒤로 넘기기 ─────────────────────────────
   목록을 다시 열지 않고도 이어 읽을 수 있어야 한다. */
.steps{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;
  margin-top:34px;padding-top:18px;border-top:1px solid var(--edge)}
.step{display:flex;flex-direction:column;gap:2px;text-align:left;
  border:1px solid var(--edge);border-radius:5px;background:transparent;
  padding:9px 12px;cursor:pointer;font:inherit;color:var(--ink-2);min-width:0}
.step.next{text-align:right;align-items:flex-end}
.step:hover{border-color:var(--link);color:var(--ink);background:var(--term-bg)}
.step-k{font-family:var(--mono);font-size:11px;color:var(--link);letter-spacing:.04em}
.step-d{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.step-t{font-size:13px;line-height:1.4;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.step.empty{display:flex;align-items:center;justify-content:center;border-style:dashed;
  color:var(--ink-3);font-size:12px;font-family:var(--mono);cursor:default}
.steps .step-n{align-self:center;font-family:var(--mono);font-size:11.5px;
  color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}

@media(max-width:900px){
  .steps{grid-template-columns:1fr;gap:8px}
  .steps .step-n{order:-1;text-align:center}
  .step.next{text-align:left;align-items:flex-start}
}
.doc-head{border-bottom:1px solid var(--edge);padding-bottom:14px;margin-bottom:18px}
h1{font-size:19px;margin:0 0 4px;line-height:1.35;text-wrap:balance;font-weight:650}
.docid{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  letter-spacing:.04em;font-variant-numeric:tabular-nums}
.stamp{display:inline-block;border:1.5px solid var(--stamp);color:var(--stamp);
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:1px 6px;
  border-radius:2px;transform:rotate(-1.2deg);margin-left:8px;vertical-align:2px}
.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:3px 20px;margin-top:10px;font-size:12.5px}
.meta div{display:flex;gap:7px}
/* 참석자 명단처럼 긴 값. 좁은 칸에 넣으면 한 글자씩 세로로 눌린다 */
.meta div.wide{grid-column:1/-1}
.meta b{color:var(--ink-3);font-weight:500;min-width:52px;font-size:11.5px}
.meta span{font-family:var(--mono);font-size:12px}
.meta span.txt{font-family:var(--sans);font-size:12.5px}

.points{margin:16px 0;padding:12px 16px;border-left:2px solid var(--edge);
  background:var(--panel);border-radius:0 3px 3px 0}
.points li{margin:3px 0}
.points ul{margin:0;padding-left:18px}

.cols{display:grid;gap:26px}
.cols.two{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.cols.two{grid-template-columns:1fr}}
.pane h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 8px;font-weight:600}
.body{white-space:pre-wrap;word-break:break-word}

/* 호버 카드 — 링크 위에 머물면 그 문서가 무엇인지 미리 보여 준다.

<script id="data" type="application/json">[{"id": "50-d62", "order": 1, "date": "1950-06-25", "group": "A", "eyebrow": "50-d62 · The Ambassador in Korea (Muccio) to the Secretary of State", "title": "주한대사 무초(Muccio)가 국무장관에게 보낸 전보", "badge": null, "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-06-25"}, {"k": "시각", "v": "발신: 1950년 6월 25일 오후 1시 (WKST). 수신: 1950년 6월 24일 오후 11시 47분 (EST)"}, {"k": "발신", "v": "주한대사 무초(Muccio)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "장소", "v": "Seoul"}, {"k": "전문번호", "v": "926"}, {"k": "종류", "v": "전보"}, {"k": "원문출처", "v": "795.00/6–2550: Telegram", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d62"}], "summary": "무초가 6월 25일 새벽 북한군의 전면 남침 개시를 알리며 대사관 방송으로 발표할 내용을 보고한다.", "points": ["북한군이 6월 25일 오전 4시 38선 여러 지점에서 대한민국 방어 진지에 도발 없는 공격을 시작했다.", "대사관 라디오 WVTP를 통해 오후 1시 특별 발표가 이루어질 예정이다.", "한국 방위군과 관리들은 상황을 침착하고 능숙하게 처리하고 있다.", "북한 공산군이 전면전을 의도했는지 아직 판단할 수 없다고 밝혔다.", "대사관 직원들에게 불필요한 외출을 자제하고 자택이나 근무지에 머물 것을 권고했다.", "전보는 극동군사령관(CINCFE)에게도 정보용으로 재발송되었다."], "primary": "niact(야간긴급) \n plain(평문)\n\n서울, 1950년 6월 25일.\n[6월 24일 오후 11시 47분 수신]\n\n926. 오늘 오후 1시에 대사관 라디오를 통해 다음과 같은 발표가 이루어질 예정임.\n\n“특별 발표가 있겠습니다. 잠시 기다려 주십시오.\n\nWVTP는 대사의 승인을 받아 다음과 같이 발표합니다.\n\n오늘 오전 4시, 북한 공산군이 38도선 여러 지점에서 대한민국 방어 진지에 도발 없는 공격을 개시했습니다. 현재 38도선 여러 지점에서 교전이 진행 중입니다.\n\n한국 방위군은 북측의 침략에 저항하기 위해 준비된 진지로 이동하고 있습니다. 한국 관리들과 보안군은 상황을 침착하고 능숙하게 처리하고 있습니다. 우려할 이유는 없습니다. 북한 공산군이 전면전을 일으키려 했는지는 아직 판단할 수 없습니다. 새로운 상황은 본 방송을 통해 정기적으로 보도할 예정입니다. WVTP에 계속 주파수를 맞춰 주십시오.\n\n대사관 직원들은 가급적 불필요한 외출을 삼가시기 바랍니다. 대사는 대사관 직원들이 상황에 따라 자택이나 근무지에 머물 것을 요청합니다. 다음 발표는 오늘 오후 3시에 있겠습니다.”\n\n정보용으로 극동군사령관(CINCFE)에게 재발송함.\n\n무초\n\n주: 6월 24일 자정 12시 러스크(Rusk) 씨에게 사전 송부. 1950년 6월 25일 오전 1시 육군부 및 도쿄로 중계. CWO/FED.", "secondary": "niact \n plain\n\nSeoul, June 25, 1950.\n[Received June 24—11:47 p. m.]\n\n926. Following announcement is being made over mission radio at 1 p.m. today.\n\n“Stand by for a special announcement.\n\nWVTP has been authorized by the Ambassador to make the following announcement:\n\nAt 4 o’clock this morning North Korean armed forces began unprovoked attacks against defense positions of the Republic of Korea at several points along the 38th degree parallel. Fighting is now in progress at several points along the parallel.\n\nKorean defense forces are taking up prepared positions to resist Northern aggression. Both Korean officials and the security forces are handling the situation calmly and with ability. There is no reason for alarm. As yet it cannot be determined whether the Northern Communists intended to precipitate all out warfare. New developments will be reported regularly over this station. Please keep tuned to WVTP.\n\nMission personnel are advised to travel about as little as necessary. The Ambassador requests that Mission personnel remain at home or at their posts, as the situation may dictate. Our next announcement will be heard at three o’clock this afternoon.”\n\nRepeated info CINCFE.\n\nMuccio\n\nNote: Advance copy to Mr. Rusk 12 midnight June 24. Relayed to Army Department and Tokyo 1 a. m. 6/25/50 CWO/FED.\n\n[128면]", "notes": [], "warn": false, "pages": ["50-128"], "search": "무초(John J. Muccio) 러스크(Dean Rusk)"}, {"id": "50-d84", "order": 2, "date": "1950-06-25", "group": "E", "eyebrow": "50-d84 · Resolution Adopted by the United Nations Security Council, June 25, 1950  U.K. document S/1501. This resolution was adopted shortly before 6 p. m. at which time the 473rd meeting concluded. The vote was 9 in favor to 0 opposed, with 1 member abstaining (Yugoslavia) and 1 member absent (U.S.S.R.).", "title": "1950년 6월 25일 국제연합 안전보장이사회 채택 결의", "badge": null, "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-06-25"}, {"k": "시각", "v": null}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "장소", "v": "Lake Success"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "결의"}, {"k": "원문출처", "v": "U.K. document S/1501. This resolution was adopted shortly before 6 p. m. at which time the 473rd meeting concluded. The vote was 9 in favor to 0 opposed, with 1 member abstaining (Yugoslavia) and 1 member absent (U.S.S.R.).", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d84"}], "summary": "안보리가 북한군의 대한민국 공격을 평화 파괴로 규정하고 즉각 적대행위 중지 및 38선 이북 철수를 요구한 결의.", "points": ["대한민국 정부가 유엔 감시 아래 자유 의사로 선출된 한반도 유일 합법 정부임을 재확인했다.", "북한군의 무력 공격을 평화 파괴 행위로 규정했다.", "북한 당국에 즉각 적대행위 중지 및 38선 이북으로의 무장 병력 철수를 요구했다.", "유엔한국위원단에 상황 권고안 송부, 북한군 철수 감시, 결의 이행 상황 보고를 지시했다.", "모든 회원국에 결의 이행 지원 및 북한 당국에 대한 지원 금지를 요청했다.", "표결 결과는 찬성 9, 반대 0, 기권 1(유고슬라비아), 결석 1(소련)이었다."], "primary": "1950년 6월 25일\n\n안전보장이사회는,\n\n1949년 10월 21일 총회 결의[주2]에서 다음과 같이 판명한 점을 상기하고— 즉, 대한민국 정부는 “국제연합 조선임시위원단이 관찰하고 협의할 수 있었으며 조선 민중의 대다수가 거주하는 조선의 그 지역에 대해 효과적인 통제와 관할권을 가지는” 합법적으로 수립된 정부이며, “이 정부는 조선의 그 지역 유권자의 자유 의사의 유효한 표명이며 임시위원단이 관찰한 선거에 기초하고 있으며”, “이 정부만이 조선에서 그러한 정부”라는 점;\n\n1948년 12월 12일[주3] 및 1949년 10월 21일 총회 결의에서, 회원국들이 조선의 완전한 독립과 통일을 가져오기 위해 국제연합이 추구한 결과를 훼손하는 행위를 삼가지 않을 경우 뒤따를 수 있는 결과에 대해 표명된 우려; 그리고 국제연합 조선위원단이 보고서에 기술한 상황이 대한민국과 조선 민중의 안전과 복지를 위협하며 그곳에서 공공연한 군사 충돌로 이어질 수 있다고 표명된 우려를 유념하고;\n\n북한으로부터의 군대에 의한 대한민국에 대한 무력 공격을 중대한 우려를 가지고 주목하고,\n\n이 행동이 평화의 파괴에 해당한다고 결정하며,\n\nI. 적대 행위의 즉각적인 중지를 요청하고;\n\n북한 당국에 그들의 무장 병력을 38선으로 즉시 철수할 것을 요구한다.\n\n[156면]\n\nII. 국제연합 조선위원단에 다음을 요청한다.\n\n(a) 상황에 관한 충분히 숙고된 권고를 가능한 한 빨리 송부할 것;\n\n(b) 북한군의 38선 철수를 감시할 것; 그리고\n\n(c) 본 결의의 이행에 관해 안전보장이사회에 계속 보고할 것.\n\nIII. 모든 회원국에 본 결의의 이행에 있어 국제연합에 모든 지원을 제공하고 북한 당국에 지원을 제공하는 것을 삼갈 것을 요청한다. [주4]", "secondary": "June 25, 1950\n\nThe Security Council\n\nRecalling the finding of the General Assembly in its resolution of 21 October 1949 [주2] that the Government of the Republic of Korea is a lawfully established government “having effective control and jurisdiction over that part of Korea where the United Nations Temporary Commission on Korea was able to observe and consult and in which the great majority of the people of Korea reside; and that this Government is based on elections which were a valid expression of the free will of the electorate of that part of Korea and which were observed by the Temporary Commission; and that this is the only such Government in Korea”;\n\nMindful of the concern expressed by the General Assembly in its resolutions of 12 December 1948 [주3] and 21 October 1949 of the consequences which might follow unless Member States refrained from acts derogatory to the results sought to be achieved by the United Nations in bringing about the complete independence and unity of Korea; and the concern expressed that the situation described by the United Nations Commission on Korea in its report menaces the safety and well being of the Republic of Korea and of the people of Korea and might lead to open military conflict there;\n\nNoting with grave concern the armed attack upon the Republic of Korea by forces from North Korea,\n\nDetermines that this action constitutes a breach of the peace,\n\nI. Calls for the immediate cessation of hostilities; and\n\nCalls upon the authorities of North Korea to withdraw forthwith their armed forces to the thirty-eighth parallel;\n\n[156면]\n\nII. Requests the United Nations Commission on Korea\n\n(a)\n\nTo communicate its fully considered recommendations on the situation with the least possible delay;\n\n(b)\n\nTo observe the withdrawal of the North Korean forces to the thirty-eighth parallel; and\n\n(c)\n\nTo keep the Security Council informed on the execution of this resolution;\n\nIII. Calls upon all Members to render every assistance to the United Nations in the execution of this resolution and to refrain from giving assistance to the North Korean authorities. [주4]", "notes": ["[주2] 본문은 Foreign Relations, 1949, vol. vii, Part 2, 1090면에 수록.", "[주3] 본문은 Department of State Bulletin, 1948년 12월 19일자, 760면에 수록; 관련 문서는 Foreign Relations, 1948, vol. vi, 1079면 이하 참조.", "[주4] 본 결의 채택 후, 안전보장이사회는 유고슬라비아 대표(Nincic, 닌치치)가 제출한 다음과 같은 결의안 초안(S/1500)에 대해 표결했다: “안전보장이사회는, 조선에서의 적대 행위 발발을 중대한 우려를 가지고 주목하고, 사건의 시비를 판단할 수 있도록 하는 모든 필요한 정보를 얻고자 하여, 적대 행위의 즉각적인 중지와 병력 철수를 요청하며, 북한 정부가 안전보장이사회에 자국의 입장을 진술하도록 초청한다.” 유고슬라비아 결의안 초안은 찬성 1(유고슬라비아), 반대 6(미국 포함), 기권 3(이집트, 인도, 노르웨이), 결석 1(소련)로 부결되었다. 제473차 회의에서 안전보장이사회는 이의 없이 대한민국 대표(Chang, 장면)가 이사회 테이블의 자리에 앉는 것을 허용했다."], "warn": false, "pages": ["50-156"], "search": "Nincic 닌치치 Chang Myun 장면(張勉)"}, {"id": "50-d86", "order": 3, "date": "1950-06-25", "group": "E", "eyebrow": "50-d86 · Memorandum of Conversation, by the Ambassador at Large (Jessup)", "title": "대사대리(제섭)의 대화 비망록", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-06-25"}, {"k": "시각", "v": "오후 7시 45분"}, {"k": "발신", "v": "제섭(Philip C. Jessup), 대사대리", "txt": true}, {"k": "수신", "v": "기록용", "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "회담 비망록"}, {"k": "원문출처", "v": "795.00/6–2550", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d86"}], "summary": "개전 당일 밤 블레어하우스에서 대통령과 국무·국방 수뇌가 무기 지원과 제7함대 이동을 정한다.", "points": ["한국에 대한 무기 및 장비 지원을 승인하고, 맥아더에게 한국으로 조사단을 파견할 권한을 준다.", "서울에서 여성과 어린이를 철수시키는 데 항공 엄호를 제공하며, 철수를 방해하는 북한 전차나 공군을 타격할 권한을 공군에 부여한다.", "대통령이 제7함대에 대만으로 진주하여 중국 본토의 대만 공격을 저지하고, 동시에 대만의 중국 본토 공격도 저지하도록 명령한다.", "공군에 극동의 모든 소련 공군 기지를 제거할 계획을 준비하라고 명령하지만, 실행 명령은 아니다.", "참석자들은 제한된 개입을 지지하면서도 지상군 투입에는 반대했으며, 소련이 개입하지 않는다는 가정하에 신속한 조치를 강조한다.", "트루먼 대통령은 유엔 결의가 무시될 때까지 추가 조치를 기다리며, 화요일 의회 연설 전까지 대외비를 철저히 유지하라고 지시한다."], "primary": "top secret / limited distribution\n\n[워싱턴,] 1950년 6월 25일.\n\n건명: 한국 상황\n\n참석자: 대통령\n\n애치슨 국무장관\n페이스 육군장관\n\n존슨 국방장관 [주1]\n핀레터 공군장관 [주3]\n\n매슈스 해군장관 [주2]\n브래들리 장군 [주4]\n\n웹 씨 } 국무부\n\n러스크 씨\n\n히커슨 씨\n\n제섭 씨\n\n셔먼 제독 [주5]\n\n밴덴버그 장군 [주6]\n\n콜린스 장군 [주7]\n\n위에 열거된 사람들이 오후 7시 45분 블레어하우스에서 대통령과 만찬을 가졌다. 만찬 전에 브래들리 장군이 맥아더 장군이 작성한 비망록을 읽어 주었는데, 거기서 그는 공산주의자들에게 대만을 넘겨주지 않는 것의 중요성에 대한 자신의 견해를 강조했다. [주8]\n\n만찬 후 테이블에 둘러앉아 토론이 시작되었다. 대통령이 국무장관에게 토론을 시작하라고 요청했다.\n\n애치슨 씨는 대통령이 고려해야 한다고 생각하는 여러 문제를 요약했다. 첫째는 맥아더 장군에게 현재 MDAP 계획에 따라 승인된 탄약 공급을 넘어서는 무기와 기타 장비를 한국에 공급할 권한을 부여하는 문제였다. 그는 이것이 이루어져야 한다고 권고했다. 그는 서울에서 여성과 어린이를 철수시키는 데 항공 엄호를 제공하고, 우리 공군이 [158면] 철수를 방해하는 북한 전차나 공군을 제거할 권한을 부여받아야 한다고 제안했다. 그런 다음 그는 안전보장이사회가 채택한 결의를 언급하며, 이 결의 또는 추가적인 안보리 결의에 따라 우리가 한국에 어떤 추가 지원을 제공할 수 있을지 고려해야 한다고 제안했다. 이어서 그는 대통령이 제7함대에 대만으로 진주하여 본토의 대만 공격을 저지하라고 명령해야 한다고 제안했다. 동시에 대만에서 본토를 공격하는 작전도 저지되어야 한다고 말했다. 그는 추가 조치가 결정될 때까지 맥아더 장군이 대만에 가는 것을 권고하지 않는다고 말했다. 그는 미국이 총통과 엮여서는 안 된다고 말했다. 그는 대만의 미래 지위는 유엔에 의해 결정될 수 있다고 생각했다.\n\n대통령이 “또는 대일강화조약에 의해서”라고 끼어들었다.\n\n애치슨 씨는 마지막으로 인도차이나에 대한 우리의 원조를 확대해야 한다고 제안했다.\n\n브래들리 장군은 우리가 어딘가에 선을 그어야 한다고 말했다.\n\n대통령은 이에 동의한다고 말했다.\n\n브래들리 장군은 러시아가 아직 전쟁할 준비가 되어 있지 않다고 말했다. 한국 상황은 다른 어느 곳 못지않게 선을 긋는 행동을 취할 좋은 기회를 제공하며, 그는 애치슨 씨가 제안한 조치들에 동의했다. 그는 제트기가 북한 전차를 발견하지 못하더라도 그 상공을 비행하는 것만으로도 한국군의 사기에 큰 영향을 줄 것이라고 말했다. 그는 해군 작전이 동해안에서 도움이 될 수 있다고 말했다. 그는 한국군이 사용할 훈련을 받지 못한 장비를 보내는 것의 가치에 의문을 제기했다. 이와 관련하여 F-51을 언급했다. 그는 우리가 유엔에 대한 원조라는 명분으로 행동해야 한다고 말했다. 그는 현재 수빅 만에 있는 함대 부대를 이동시켜야 한다고 제안했다. 그는 그들이 실제로 사격할 필요는 없겠지만 북한의 상륙 부대를 겁줘서 쫓을 수 있을 것이라고 생각했다. 그는 특히 대규모 병력이 관련될 경우 지상군을 투입하는 것이 바람직한지 의문을 제기했다.\n\n콜린스 장군이 도쿄와의 원격회담에 관해 보고했다. 맥아더 장군이 탄약과 함께 박격포, 포병 등을 수송 중이다. 이 보급품은 한국군이 이미 10일분 보급품을 보유하고 있는 기간 내에 그들에게 도착할 것이다. 일본에서 한국 조종사들이 몰고 돌아갈 수 있도록 F-51을 사용할 수 있다. 한국 조종사들은 김포에서 비행기를 타고 올 것이다. 콜린스 장군은 맥아더에게 한국으로 조사단을 파견할 권한을 줄 것을 촉구했다.\n\n셔먼 제독은 러시아가 지금 전쟁을 원하지 않지만, 만약 원한다면 전쟁을 치를 것이라고 말했다. 현재 한국 상황은 우리가 행동할 소중한 기회를 제공한다. 한국은 일본에 대한 전략적 위협이다. 이것이 그가 전쟁 중에 [159면] 우리의 일본 공격을 계획할 때 연구에서 도달한 결론이었다. 그는 도쿄에서 조사단을 파견하고 KMAG의 병력을 증강하는 데 찬성했다. 그는 바다가 대한민국을 공격하는 수단으로 사용되는 것을 막아야 한다고 생각했다. 이것이 국무장관이 밝힌 견해의 논리적 귀결이었다. 대만에 관해서는, 우리의 입장을 일본에서의 우리의 일반적인 점령 지위에 맞춰 조정해야 한다고 생각했다. 그는 맥아더가 SCAP로서 그 상황에 적합하다고 생각했다. 그는 브래들리 장군이 그랬듯이, 대만 작전에서 우리는 군사 행동에 대한 보장을 양쪽 모두에 적용해야 한다는 점, 즉 대만에 대한 공격뿐 아니라 대만으로부터의 공격도 막아야 한다는 점에 동의했다. 그렇지 않으면 우리의 행동을 정당화할 수 없다고 말했다. 그는 함대를 필리핀에서 올라오게 하는 데 이틀 걸릴 것이라고 말했다. 우리가 그러한 행동을 하지 않기로 결정한다면 함대를 사용할 필요는 없지만, 이동은 지금 명령해야 한다고 말했다. 그는 또한 본토에서 진주만까지, 예를 들어 적어도 항공모함 한 척을 이동시키길 원했다.\n\n대통령이 극동의 러시아 함대 전력에 관해 묻자 셔먼 제독이 그에게 상세한 내용을 알려 주었다.\n\n밴덴버그 장군은 우리가 북한을 저지해야 한다는 데 동의했지만, 러시아가 싸우지 않을 것이라는 가정에 우리의 행동을 기초하지는 않을 것이라고 말했다. 그는 북한 공군만 개입된다면 우리 공군으로 북한 전차를 제거할 수 있다고 말했다. 그러나 러시아 제트기가 투입될 수 있으며, 그들은 훨씬 더 가까운 기지에서 작전할 것이라고 말했다. 대만에 관해서는 모든 장소가 상호 연관되어 있다고 지적했다. 따라서 대만은 다른 장소와의 관계에서만 중요하다는 것이었다.\n\n대통령이 극동의 러시아 공군 전력에 관해 물었다.\n\n밴덴버그 장군이 그에게 정보를 제공했는데, 여기에는 상하이에 상당수의 러시아 제트기가 배치되어 있다는 사실이 포함되었다.\n\n대통령이 우리가 극동에 있는 그들의 기지를 제거할 수 있느냐고 물었다.\n\n밴덴버그 장군은 시간이 좀 걸릴 수 있다고 답했다. 그는 원자폭탄을 사용한다면 가능하다고 말했다.\n\n페이스 씨는 한국에 지상군을 투입하는 것이 바람직한지에 관해 의문을 표했다. 그는 신속성의 필요성과 맥아더 장군이 조치를 취하도록 독려할 필요성을 강조했다.\n\n매슈스 씨도 신속한 조치의 필요성을 강조하며, 우리가 대중의 승인을 얻을 것이라고 말했다.\n\n핀레터 씨는 우리의 철수를 보호하는 데 필요한 만큼 나아가야 한다고 말했다. 그는 국무장관이 제안한 추가 항목들에 대해서는 다소 의문을 표했다. 그는 러시아가 개입하지 않는다면 극동의 우리 군대로 충분하다고 말했다. 그는 그날 밤에는 필요한 결정만 내려야 한다고 조언했다. 그는 맥아더 장군이 단순한 철수를 넘어서는 행동을 할 권한을 부여받아야 한다고 생각했다. [160면] 그는 두 차례 세계대전 사이의 상황과의 유사성을 강조했다. 그는 우리의 행동이 평화를 유지할 것이라는 희망을 가지고 계산된 위험을 감수해야 한다고 생각했다.\n\n존슨 씨는 맥아더 장군에 대한 지시에 관한 애치슨 씨의 첫 번째 권고에는 동의했지만, 지시 사항이 구체적이어서 그에게 지나친 재량을 주지 않도록 해야 한다고 생각했다. 그는 대통령의 권한을 맥아더 장군에게 실질적으로 위임해서는 안 된다고 생각했다. 그는 오키나와 남쪽 류큐 열도의 세 섬을 언급했는데, 이곳은 며칠 안에 공군 기지로 사용할 수 있도록 준비될 수 있다고 말했다. 그는 그곳이 이미 우리 관할 아래에 있다는 사실을 지적하며, 대만 상황은 그곳에서 처리할 수 있다고 말했다. 그는 핀레터 씨가 표명한 견해에 동의했다. 그는 한국에 지상군을 투입하는 것에 반대했다.\n\n웹 씨, 제섭 씨, 러스크 씨, 히커슨 씨는 애치슨 씨의 발언을 보충하는 짤막한 논평을 했다.\n\n대통령은 다음과 같은 명령을 내려야 한다는 자신의 결정을 확인했다.\n\n1.\n\n맥아더 장군은 제안된 보급품을 한국군에 보낼 것.\n\n2.\n\n맥아더 장군은 한국으로 조사단을 파견할 것.\n\n3.\n\n지시된 함대 부대는 일본으로 파견될 것.\n\n4.\n\n공군은 극동의 모든 소련 공군 기지를 쓸어버릴 계획을 준비할 것. 이것은 행동 명령이 아니라 계획을 수립하라는 명령이었다.\n\n5.\n\n소련의 다음 행동이 일어날 개연성이 가장 높은 장소를 신중하게 계산할 것. 국무부와 국방부가 완전한 조사를 실시해야 한다.\n\n그는 우리가 전적으로 유엔을 위해 일하고 있다고 강조했다. 유엔 명령이 무시될 때까지 우리는 추가 조치를 기다릴 것이라고 말했다.\n\n그는 국무부가 화요일에 [주9] 그가 직접 의회에서 행할 연설을 위한 성명을 준비하기를 바랐는데, 거기에는 정확히 어떤 조치가 취해졌는지가 명시될 것이었다. 그는 국무부가 최고의 두뇌를 동원하기를 바랐으며, 거기에는 그런 인재가 많다고 말했다.\n\n그는 아직 맥아더를 한국의 총사령관으로 임명할 준비가 되지 않았다고 말했다.\n\n그는 이 순간 우리의 행동은 유엔과 한국에 국한될 것이라고 말했다.\n\n그는 우리 공군이 필요시 전차를 파괴하면서 철수 엄호를 계속 제공할 것이라고 말했다.\n\n그는 더 많은 바주카포와 가능하다면 무반동총을 더 보낼 수 있는지 물었다.\n\n브래들리 장군은 무반동총은 우리가 가용할 수 있는 것이 거의 없으며 탄약도 부족하다고 말했다.\n\n[161면]\n\n대통령은 소련의 다음 가능한 움직임에 대한 조사를 하는 것의 중요성을 다시 강조했다. 그는 또한 화요일에 자신이 연설하기 전까지는 누구도 언론에 어떤 성명도 발표해서는 안 된다고 강조했다. 이 문제와 관련하여 누설이 전혀 없어야 하는 것이 절대적으로 중요하며, 모두가 조심하기를 바랐다. 언론에 백그라운드 논평조차 해서는 안 되었다.\n\n애치슨 씨는 자신과 존슨 장관이 내일 의회 세출위원회에 출석할 예정임을 지적하며, 한국 상황에 관해 어떤 성명을 발표해야 하는지 궁금해했다. 대통령은 그 자리에서 두 장관 누구도 이 문제에 관해 논평하지 말아야 한다고 생각한다고 말했다.\n\n셔먼 제독이 캘리포니아에서 진주만으로 함대 부대를 이동시키는 것을 승인받았는지 문의했다.\n\n대통령은 승인했다고 말했다.\n\n추가 질문에 답하여, 대통령은 필요하다면 우리 항공 엄호가 북한 전차에 대해 조치를 취해야 한다고 말했다.\n\n[부속서]\n\n대만에 관한 비망록, 육군 원수 더글러스 맥아더, 극동군 총사령관 겸 연합국 최고사령관, 일본\n\ntop secret\n\n[도쿄,] 1950년 6월 14일.\n\n1.\n\n중국 공산당이 중국 본토 전체를 집어삼킬 군사적 능력을 갖추었음이 명백히 드러난 1948년 가을 이래, 나는 대만의 미래 지위에 관해 우려해 왔으며, 대만이 미국에 적대적인 세력에 의해 지배되도록 허용된다면 미국의 전략적 이익이 심각한 위험에 처할 것이라고 확신해 왔다. [주10] 지난 18개월 동안 본 사령부를 방문한 미국 정부의 저명한 민간 및 군 관계자들과의 개인적인 대화에서 나는 대만이 잠재적 적대 세력의 수중에 떨어지거나, 미국에 잠재적으로 적대적인 세력에게 대만의 군사적 이용을 허용할 정권의 수중에 떨어지도록 허용해서는 안 된다는 전제를 되풀이해 왔다. 지난 5월 29일 나는 합동참모본부에 중국 공산당이 대만을 점령할 경우 초래될 전략적 결과에 대한 나의 평가를 보냈다.\n\n2.\n\n극동 사령부의 전선이자 미국의 서쪽 전략 국경은 오늘날 알류샨 열도에서 필리핀 군도를 잇는 연안 도서에 [162면] 놓여 있다. 지리적으로나 전략적으로 대만은 이 연안 진지에서 떼어낼 수 없는 일부이며, 이 진지는 적대 행위 발생 시 동아시아 주변부의 군사 작전을 결정적으로 통제할 수 있다. 전쟁 발발 시, 이 선상에 배치된 미국 타격 부대는 공산주의자들이 이용할 수 있는 제한된 통신 수단을 차단하고, 소련이 동아시아와 동남아시아의 천연자원을 착취하는 능력을 거부하거나 상당히 감소시킬 능력을 가질 것이다. 미국의 이 본질적인 능력은 우호적이거나 중립적인 세력이 대만을 보유하는 데 크게 의존한다.\n\n3.\n\n대만의 지리적 위치는, 미국에 비우호적인 세력의 수중에 들어갈 경우, 현재 일본, 오키나와, 필리핀을 중심으로 하는 우리 진지 바로 그 중심부에 적의 돌출부를 구성한다. 현재 대만에는 황해와 말라카 해협 사이의 아시아 본토 어느 유사한 집중 지역보다도 더 큰 작전용 항공 및 해군 기지가 집중되어 있다. 중국 국민당군이 현재 활용하지 않고 있는 제2차 세계 대전 당시 일본의 시설을 공격적으로 이용함으로써 상대적으로 짧은 시간 내에 추가 기지를 개발할 수 있다. 대만 기지는 중국 본토의 어느 지점보다 오키나와에 100마일 더 가깝고, 공산군이 획득할 수 있는 어떤 다른 지역보다 클라크 필드와 마닐라에 150마일 더 가깝다. 현재 대만에서 이용 가능한 그러한 시설을 활용하는 적군은 중국 본토에 기반을 둔 작전과 비교할 때 오키나와에 투사할 수 있는 항공 노력을 100퍼센트 증가시킬 수 있으며, 동시에 현재 아시아 본토에 기반을 둔 전투기의 사정거리 밖에 있는 필리핀의 우리 시설에 대해 전투기 계열의 항공기로 파괴적인 공습을 가할 수 있다.\n\n4.\n\n지리적 위치와 기지 잠재력의 결과로, 미국에 적대적인 군사 세력이 대만을 이용하는 것은 미국 최전선 진지의 중부 및 남부 측면의 전략적 중요성을 상쇄하거나 무색하게 만들 수도 있다. 공산주의자들의 수중에 있는 대만은 소련의 공세 전략을 달성하고 동시에 오키나와와 필리핀에 기반을 둔 미군의 반격 작전을 좌절시키기에 이상적으로 위치한 가라앉지 않는 항공모함이자 잠수함 모선에 비유될 수 있다. 이 가라앉지 않는 항공모함-모선은 제트 전투기에서 B-29급 폭격기에 이르는 10개에서 20개의 항공대를 운용할 수 있을 뿐만 아니라, 소련 아시아 해군의 주력을 이루는 단거리 연안 잠수함을 위한 전진 작전 시설을 제공할 능력이 있다. 만약 대만이 중국 공산당에 의해 획득되고 그곳의 기지가 소련에 [163면] 제공된다면, 러시아는 10척 또는 20척의 항공모함과 그 지원 부대에 상응하는 전력을 비교할 수 없을 정도로 낮은 비용으로 획득하고 유지할 수 있는 추가적인 “함대”를 얻는 셈이 될 것이다.\n\n5.\n\n워싱턴과 도쿄의 군 정보 기관이 모두 동의한 극동 지역의 소련 공군 및 잠수함 자원에 대한 현재의 평가로 볼 때, 러시아는 현재 위치에서 남쪽으로 병력을 확장하면서도 연해주와 중국 해안 지역 모두에서 여전히 위압적인 수준의 군사력을 유지할 능력이 있다고 나는 확신한다. 소련-중국 공산당 군중이 임시변통이나 유럽으로부터의 중요 물자 수입을 통해 신속하게 병참 요구를 충족시킬 수 있는 능력은 톈진에서 중국 남부 국경까지 이어지는 군사 활동을 통해 매일 입증되고 있다. 시베리아 횡단 철도의 종착지를 남쪽으로 옮기는 데 대한 소련의 관심은 믿을 만한 관찰자들에 의해 보고되었으며, 그들의 정보는 바이칼 호수 부근에서 중국을 관통하여 남쪽으로, 그리고 러시아 투르키스탄의 알마아타 부근에서 동쪽으로 철도가 연장되고 있음을 나타낸다. 상하이 부근의 시베리아 횡단 철도 종착역은 대만에 대한 병참 증강에 실질적으로 도움이 될 것이다. 적대 행위가 실제로 발발하기 전까지는, 미군은 공산주의자들이 그 지역을 획득할 경우 대만에 필수 군수 물자를 비축하는 것을 막을 수 없을 것이다.\n\n6.\n\n역사적으로 대만은 남쪽 지역을 향한 군사적 침략의 발판으로 사용되어 왔다. 가장 주목할 만하고 최근의 사례는 제2차 세계 대전 당시 일본의 대만 이용이었다. 1941년 태평양 전쟁 발발 시, 대만은 다양한 일본 침공 호송대의 집결 지역이자 지원 기지로서 중요한 역할을 했다. 루손 섬 링가옌 만에 상륙한 병력의 주력은 지룽, 가오슝, 그리고 펑후 제도에서 출발했다. 일본 육군과 해군의 지원 항공 부대는 남부 대만을 따라 위치한 가오슝, 헝춘, 그리고 타이중의 비행장에 기반을 두었다. 가오슝은 또한 1942년 2월 자바 침공을 위한 집결 지역으로 사용되었다. 1942년부터 1944년까지 대만은 일본에서 오키나와와 필리핀을 거쳐 동남아시아로 뻗어 있는 수송 및 통신망의 핵심 연결 고리였다. 1944~45년에 대만은 필리핀 지역을 사수하기 위한 지상 최대 작전에 대비하여 필리핀에 배치된 부대와 항공 증원군의 핵심 집결 지점이었다. 미 항공모함 부대가 서태평양으로 진출함에 따라, 대만의 항공 기지는 일본군의 방어 계획에서 점점 더 큰 역할을 맡게 되었다. 1945년 1월 루손 침공 이후, 일본 항공군은 대만 [164면] 비행장으로 철수하여 전진 작전 진지를 확보하고 우리의 진격 부대에 대항하는 데 사용했다. 대만의 군사적 유용성은 1941년 일본이 류큐 열도뿐만 아니라 중국의 동부 주변부 전체를 지배했다는 사실에 의해 극명하게 부각된다.\n\n7.\n\n그 군사적 가치 외에도, 대만은 800만 이상의 자국 인구를 위한 식량 면에서 자급자족했을 뿐만 아니라 1910년 이래 무역수지 흑자를 기록하며 수출을 해 왔다. 평상시 대만은 일반적으로 식량이 부족한 지역에서 식량 잉여 지역의 위치를 차지했다. 전쟁 전 대만의 쌀과 밀 수출은 수입을 연간 약 60만 미터톤 초과했다. 유능한 정치 및 경제 고문들이 다시 한 번 대만을 번영하는 경제 단위로 만들 수 없다고 믿을 이유가 없다. 그러한 요소, 특히 식량 잉여의 가용성은 현재 미국의 지원에 크게 의존하고 있는 동양 국가들의 경제 재건에 상당히 중요할 수 있다.\n\n8.\n\n대만은 동양의 다른 지역들 못지않게 서구 이념에 중요한 정치적 지역을 대표한다. 대만인들은 인종적으로 동질적인 집단으로, 개인으로서 외부 혈통의 침입에 저항해 왔다. 비록 제2차 세계 대전의 결과로 대만이 중국에 약속되었지만, 이 약속은 현재 존재하는 것과 완전히 다른 정치적 상황에 조응하여 주어졌다. 공산주의 경찰 국가의 명령에 얽매이지 않는 분위기 속에서 대만인들에게 그들 자신의 정치적 미래를 개발할 기회를 제공해야 할 도덕적 근거는 충분하다. 도덕적 함의뿐만 아니라 이 지역이 중국 주변부와 그 부근의 위험에 처한 다른 민족들과 지리적으로 근접해 있다는 점을 고려할 때, 대만의 미래 지위는 공산주의와 서구 사이에서 선택을 해야 했거나 곧 해야 할 국가 집단들의 정치적 정렬을 결정하는 중요한 요소가 될 수 있다.\n\n9.\n\n대만의 궁극적인 운명이 크게 미국에 달려 있다는 데는 의심의 여지가 없다. 극동에서 미국의 정치-군사적 전략적 위치가 포기되지 않는다면, 가까운 장래에 공산주의 팽창을 저지할 선이 그어져야 할 때가 반드시 올 것임은 명백하다. 동양에서 미국의 적절한 태세를 회복하는 수단으로서, 미국이 대만의 공산 세력 지배를 막기 위한 조치를 개시해야 한다는 점은 내게 명백하다. 나는 우리의 영향권에 아직 열려 있는 지역들에 적절한 조치를 취하지 못하는 것이 동양의 어느 지역에 관해서든 근본적인 오류일 것임을 마찬가지로 확신한다.\n\n10.\n\n이 시점에서 나는 대만이 잠재적 적대 세력의 수중에 떨어지거나, 적대 세력에게 대만의 군사적 이용을 허용할 세력의 수중에 떨어지는 것을 막기 위해 취해야 할 정확한 정치적, 경제적, 군사적 조치들을 권고할 수 없다. [165면] 필요 조건에 대한 현실적인 평가는 경험 있는 군사, 경제 및 정치 관찰자들이 수행하는 현장 조사에 기초할 수밖에 없다는 것이 나의 확고한 신념이다. 나는 1949년 12월 23일 합동참모본부가 한 권고, 즉 극동 총사령관이 공격으로부터 대만을 방어하기 위해 대만에 필요한 군사 원조의 필요성과 규모에 관한 즉각적인 조사를 실시해야 한다는 취지의 권고에 전적으로 동의한다. [주11] 이 권고는 당시 국가안전보장회의에서 받아들여지지 않은 것으로 보이지만, 나는 합참이 1950년 5월 4일에 이 권고를 재확인했음을 주목한다.\n\n11.\n\n대만은 아직 공산주의 지배에 넘어가지 않았다. 현재 편성 및 장비를 갖춘 중국 국민당군이 대만 섬의 군사적 또는 정치적 정복을 막을 능력과 의지에 관해서는 상반된 보고가 있다. 나는 대만의 공산주의 지배를 막는 데 비용이 얼마일지 예측할 수 없지만, 그러한 사건이 발생할 경우 비용이 얼마일지는 합동참모본부에 조언한 바 있다. 그러나 나는 비우호적인 세력의 대만 지배가 미국에 최악의 재앙이 될 것이며, 시간이 본질적이라는 점을 확신한다. 나는 극동 총사령관이 공산 세력의 대만 지배를 막기 위한 군사적, 경제적 및 정치적 필요 조건에 대한 조사를 지체 없이 개시하도록 권한을 부여받고 지시받아야 하며, 그러한 조사 결과가 대만에 관한 미국의 국가 정책의 기초로서 분석되고 조치되어야 한다고 강력히 믿는다.\n\n더글러스 맥아더", "secondary": "top secret \n limited distribution\n\n[Washington,] June 25, 1950.\n\nSubject: Korean Situation\n\nParticipants: The President\n\nSecretary Acheson Secretary Pace\n\nSecretary Johnson [주1] Secretary Finletter [주3]\n\nSecretary Matthews [주2] General Bradley [주4]\n\nMr. Webb } State Dept.\n\nMr. Rusk\n\nMr. Hickerson\n\nMr. Jessup\n\nAdmiral Sherman [주5]\n\nGeneral Vandenberg [주6]\n\nGeneral Collins [주7]\n\nThe persons listed above met with the President for dinner at Blair House at 7:45 PM. Before dinner General Bradley read a memorandum prepared by General MacArthur in which he emphasized his views about the importance of denying Formosa to the Communists. [주8]\n\nAfter dinner the discussion began around the table. The President called on the Secretary of State to open the discussion.\n\nMr. Acheson summarized the various problems which he thought the President should consider. The first point was the question of authorizing General MacArthur to supply Korea with arms and other equipment over and above the supplies of ammunition presently authorized under the MDAP program. He recommended that this be done. He suggested that our air cover should be used to aid in the evacuation of the women and children from Seoul and that our air force [158면] should be authorized to knock out northern Korean tanks or air force interfering with the evacuation. He then mentioned the resolution adopted by the Security Council and suggested that consideration should be given to what further assistance we might render to Korea in pursuance of this or a supplementary Security Council resolution. He next suggested that the President should order the Seventh Fleet to proceed to Formosa and prevent an attack on Formosa from the mainland. At the same time operations from Formosa against the mainland should be prevented. He said that he did not recommend that General MacArthur should go to Formosa until further steps had been decided upon. He said that the United States should not tie up with the Generalissimo. He thought that the future status of Formosa might be determined by the UN.\n\nThe President interposed “or by the Japanese Peace Treaty”.\n\nMr. Acheson finally suggested that our aid to Indochina should be stepped up.\n\nGeneral Bradley said that we must draw the line somewhere.\n\nThe President stated he agreed on that.\n\nGeneral Bradley said that Russia is not yet ready for war. The Korean situation offered as good an occasion for action in drawing the line as anywhere else and he agreed with the actions suggested by Mr. Acheson. He said that jets flying over her would have a great morale effect on the South Koreans even if they were unable to spot the North Korean tanks. He said that naval action could help on the East Coast. He questioned the value of sending materiel which the Koreans were not trained to use. He mentioned the F–51’s in this connection. He said that we should act under the guise of aid to the United Nations. He proposed that we should move fleet units now in Subic Bay. He thought it would probably not be necessary for them to shoot but that they might frighten off the North Korean amphibious forces. He questioned the advisability of putting in ground units particularly if large numbers were involved.\n\nGeneral Collins reported on a telecon with Tokyo. General MacArthur is shipping the mortars, artillery, and so on with ammunition. These supplies will reach the Koreans within the ten-day period for which they already have supplies. The F–51’s available in Japan for Korean pilots to fly back. The Korean pilots will be flown from Kimpo. General Collins urged that authority be given MacArthur to send a survey group to Korea.\n\nAdmiral Sherman said that the Russians do not want war now but if they do they will have it. The present situation in Korea offers a valuable opportunity for us to act. Korea is a strategic threat to Japan; this was the conclusion which he reached in his studies during [159면] the war when we were planning our attacks on Japan. He favored sending a survey group from Tokyo and increasing the strength of KMAG. He thought we should stop the use of the sea as a means of attack on South Korea. This was the logical corollary of the views stated by the Secretary of State. On Formosa he thought we must adjust our position to our general occupation position in Japan. He thought that MacArthur fitted into that situation as SCAP. He agreed, as had General Bradley, that in the Formosa operation we must apply our guarantees against military action both ways, that is to prevent attacks from Formosa as well as on Formosa. We could not otherwise justify our action. He said it would take two days to bring the fleet up from the Philippines. It need not be used if we decided against such action but the movement should be ordered now. He wished also to move some ships from the mainland as far as Pearl Harbor, for example, at least one carrier.\n\nThe President asked about Russian fleet strength in the Far East and Admiral Sherman gave him the details.\n\nGeneral Vandenberg agreed that we must stop the North Koreans but he would not base our action on the assumption that the Russians would not fight. He said that we could knock out the North Korean tanks with our air if only the North Korean air force is involved. However, Russian jets might come into action and they would be operating from much closer bases. In regard to Formosa he pointed out that all places were interrelated. Formosa was therefore important only in relation to other places.\n\nThe President asked about Russian air strength in the Far East.\n\nGeneral Vandenberg gave him the information including the fact that a considerable number of Russian jets are based on Shanghai.\n\nThe President asked whether we could knock out their bases in the Far East.\n\nGeneral Vandenberg replied that this might take some time. He said it could be done if we used A-Bombs.\n\nMr. Pace expressed doubts about the advisability of putting ground forces into Korea. He stressed the need for speed and for encouraging General MacArthur to take action.\n\nMr. Matthews also stressed the need for prompt action and said that we would get popular approval.\n\nMr. Finletter said we should go as far as necessary in protecting our evacuation. He expressed some doubt on the additional items which had been suggested by the Secretary of State. He said our forces in the Far East were sufficient if the Russians do not come in. He advised that only the necessary decisions be made that night. He thought that General MacArthur should be authorized to go beyond a mere evacuation. [160면] He stressed the analogy to the situation between the two world wars. He thought we should take calculated risks hoping that our action will keep the peace.\n\nMr. Johnson agreed with Mr. Acheson’s first recommendation concerning instructions to General MacArthur but thought the instructions should be detailed so as not to give him too much discretion. He thought there should not be a real delegation of Presidential authority to General MacArthur. He mentioned the three islands south of Okinawa in the Ryukyus which could be made ready in a few days as air bases. He pointed to the fact that they are already under our jurisdiction and said that the Formosan situation could be handled from them. He agreed with the views that had been expressed by Mr. Finletter. He was opposed to committing ground troops in Korea.\n\nMr. Webb, Mr. Jessup, Mr. Rusk and Mr. Hickerson made brief comments in amplification of Mr. Acheson’s statements.\n\nThe President confirmed his decision that the following orders should be sent:\n\n1.\n\nGeneral MacArthur was to send the suggested supplies to the Koreans.\n\n2.\n\nGeneral MacArthur was to send a survey group to Korea.\n\n3.\n\nThe indicated elements of the fleet were to be sent to Japan.\n\n4.\n\nThe Air Force should prepare plans to wipe out all Soviet air bases in the Far East. This was not an order for action but an order to make the plans.\n\n5.\n\nCareful calculation should be made of the next probable place in which Soviet action might take place. A complete survey should be made by State and Defense Departments.\n\nHe stressed that we are working entirely for the United Nations. We would wait for further action until the UN order is flouted.\n\nHe wished the State Department to prepare a statement for a message for him to deliver in person to Congress on Tuesday [주9] indicating exactly what steps had been taken. He wished the Department to put its best brains on it and said that there were plenty of them there.\n\nHe said he was not yet ready to put MacArthur in as Commander-in-Chief in Korea.\n\nHe said our action at this moment would be confined to the United Nations and to Korea.\n\nHe said that our air was to continue to give cover for evacuation destroying tanks if necessary.\n\nHe asked whether more bazookas and possibly recoilless rifles could be sent.\n\nGeneral Bradley said that on the recoilless rifles we had few available and that there was also a shortage of ammunition.\n\n[161면]\n\nThe President again emphasized the importance of making the survey of possible next moves by the Soviet Union. He also emphasized that no statement whatever was to be made by any one to the press until he speaks on Tuesday. It was absolutely vital that there should be no leak in regard to this matter and he wished everyone to be careful. They should not even make any background comment to the press.\n\nMr. Acheson pointed out that he and Secretary Johnson were scheduled to appear before the Congressional Appropriations Committee tomorrow and wondered whether any statements should be made on the Korean situation. The President said that he thought no comment on this question should be made by either of the Secretaries at that time.\n\nAdmiral Sherman inquired whether he had been authorized to move fleet units from California to Pearl Harbor.\n\nThe Presidint said that he was.\n\nIn response to further questions The President said that our air cover should take action against North Korean tanks if this were necessary.\n\n[Annex]\n\nMemorandum on Formosa, by General of the Army Douglas MacArthur, Commander in Chief, Far East, and Supreme Commander, Allied Powers, Japan\n\ntop secret\n\n[Tokyo,] 14 June 1950.\n\n1.\n\nSince the fall of 1948 when the military capability of the Chinese Communist to engulf all of the mainland of China became clearly evident I have been concerned as to the future status of Formosa and I have been convinced that the strategic interests of the United States will be in serious jeopardy if Formosa is allowed to be dominated by a power hostile to the United States. [주10] In my personal conversations with distinguished civilian and military representatives of the Government of the United States who have visited this Headquarters during the past eighteen months I have reiterated the premise that Formosa should not be allowed to fall into the hands of a potential hostile power or of a regime which would grant military utilization of Formosa to a power potentially hostile to the United States. On the 29th of May last I forwarded to the Joint Chiefs of Staff my estimate of the strategic consequences which would result from the capture of Formosa by the Chinese Communists.\n\n2.\n\nThe front line of the Far East Command as well as the western strategic frontier of the United States rests today on the littoral islands [162면] extending from the Aleutians through the Philippine Archipelago. Geographically and strategically Formosa is an integral part of this offshore position which in the event of hostilities can exercise a decisive degree of control of military operations along the periphery of Eastern Asia. In the event of a war United States striking forces based on this line would have the capability to interdict the limited means of communication available to the Communists and deny or materially reduce the ability of the USSR to exploit the natural resources of East and Southeast Asia. This essential capability on the part of the United States is dependent to a large degree upon the retention of Formosa by a friendly or a neutral power.\n\n3.\n\nThe geographic location of Formosa is such that in the hands of a power unfriendly to the United States it constitutes an enemy salient in the very center of that portion of our position now keyed to Japan, Okinawa, and the Philippines. At the present time there is on Formosa a concentration of operational air and naval bases which is greater than any similar concentration on the Asiatic mainland between the Yellow Sea and the Strait of Malacca. Additional bases can be developed in a relatively short time by an aggressive exploitation of World War II Japanese facilities not now utilized by the Chinese Nationalist Forces. Formosa bases are 100 miles closer to Okinawa than any point on the Chinese mainland and are 150 miles closer to Clark Field and Manila than any other area which could be acquired by Communist military forces. An enemy force utilizing those installations currently available on Formosa could increase by 100 percent the air effort which could be directed against Okinawa as compared to operations based in China proper and at the same time could direct damaging air attacks with fighter type aircraft against our installations in the Philippines which are currently beyond the range of fighters based on the mainland of Asia.\n\n4.\n\nAs a result of its geographic location and base potential, utilization of Formosa by a military power hostile to the United States may either counterbalance or overshadow the strategic importance of the central and southern flank of the United States front line position. Formosa in the hands of the Communists can be compared to an unsinkable aircraft carrier and submarine tender ideally located to accomplish Soviet offensive strategy and at the same time checkmate counteroffensive operations by United States Forces based on Okinawa and the Philippines. This unsinkable carrier-tender has the capacity to operate from ten to twenty air groups of types ranging from jet fighters to B–29 type bombers as well as to provide forward operating facilities for the short-range coastal submarines which are predominant in the Russian Asiatic Navy. If Formosa should be acquired by the Chinese Communists and bases thereon made available [163면] to the USSR, Russia will have acquired an additional “fleet” which will have been obtained and can be maintained at an incomparably lower cost to the Soviets than could its equivalent of ten or twenty aircraft carriers with their supporting forces.\n\n5.\n\nCurrent estimates of Soviet air and submarine resources in the Far East agreed to by both Washington and Tokyo military intelligence agencies satisfy me that the Russians have the capability to extend their forces southward from their present positions and still maintain an imposing degree of military strength in both the Maritime Provinces and the Chinese seaboard. The ability of the USSR–Chinese Communist hordes to meet promptly logistic requirements either by improvisation or by the import of critical materials from Europe is being demonstrated daily by military activities extending from Tientsin to the southern border of China. The interest of the USSR in the southward displacement of termini of the Trans-Siberian Railroad has been reported by competent observers whose information indicated that rail lines are being extended through China southward from the vicinity of Lake Baikal and eastward from Russia Turkestan in the vicinity of Alma Ata. A trans-Siberian railhead in the vicinity of Shanghai would materially assist in the logistic build-up of Formosa. Pending the actual outbreak of hostilities United States military forces will be unable to prevent the stockpiling of essential military supplies on Formosa if that area is acquired by the Communists.\n\n6.\n\nHistorically Formosa has been used as a springboard for military aggression directed against areas to the south. The most notable and recent example was the utilization of Formosa by the Japanese in World War II. At the outbreak of the Pacific War in 1941, Formosa played an important part as a staging area and supporting base for the various Japanese invasion convoys. The main strength of the forces which landed at Lingayen Gulf on Luzon were staged from Keelung, Takao, and the Pescadores. The supporting air forces of Japan’s army and navy were based on fields situated along Southern Formosa at Takao, Koshun, and Taichu. Takao also served as a staging area for the invasion of Java in February 1942. From 1942 through 1944 Formosa was a vital link in the transportation and communications chain which stretched from Japan through Okinawa and the Philippines to Southeast Asia. In 1944—45 Formosa was the key staging point for troops and air reinforcements deployed to the Philippines in preparation for the all-important operation to hold the Philippine areas. As the United States carrier forces advanced into the Western Pacific, the air bases on Formosa assumed an increasingly greater role in the defense scheme of the Japanese. After the invasion of Luzon in January 1945 the Japanese air forces withdrew to Formosan [164면] fields to take up forward operational positions to be used against our advancing forces. The military utility of Formosa is sharply underlined by the fact that Japan in 1941 controlled not only the Ryukyus but the entire eastern periphery of China.\n\n7.\n\nIn addition to its military value, Formosa has not only been self-sufficient as regards food for its own population of more than eight million but it has exported since 1910 with a favorable balance of external trade. In normal times Formosa held the position of a food surplus area in a generally food-scarce locality. Its prewar export of rice and wheat exceeded imports by approximately 600,000 metric tons annually. There is no reason to believe that able political and economic advisors cannot once more establish Formosa as a prosperous economic unit. Such a factor, particularly the availability of a food surplus, may be of considerable importance in reestablishing the economies of those Oriental nations now largely dependent upon United States assistance.\n\n8.\n\nFormosa represents a political area of no less importance to western ideology than other areas in the Orient. The Taiwanese are a homogeneous racial group who as individuals have resisted the intrusion of foreign blood. Although Formosa was promised to China as a consequence of World War II this promise was given in consonance with a political situation entirely different than that which now exists. There is every basis from a moral standpoint to offer to the Taiwanese an opportunity to develop their own political future in an atmosphere unfettered by the dictates of a Communist police state. In view of the moral implications, as well as the geographic proximity of this area to other endangered peoples on and near the periphery of China, the future status of Formosa can well be an important factor in determining the political alignment of those national groups who have or must soon make a choice between Communism and the West.\n\n9.\n\nThere can be no doubt but that the eventual fate of Formosa largely rests with the United States. Unless the United States’ political-military strategic position in the Far East is to be abandoned, it is obvious that the time must come in the foreseeable future when a line must be drawn beyond which Communist expansion will be stopped. As a means of regaining a proper United States posture in the Orient it is apparent to me that the United States should initiate measures to prevent the domination of Formosa by a Communist power. I am equally certain that it would be a fundamental error with regard to any part of the Orient to fail to take appropriate measures in those areas still open to our influence.\n\n10.\n\nAt this time I am unable to recommend the exact political, economic and military measures which should be taken to prevent the [165면] fall of Formosa either into the hands of a potential hostile power or into the hands of a power who will grant military utilization of Formosa to a hostile power. It is my firm conviction that a realistic estimate of requirements can only be based upon a physical survey of the area made by experienced military, economic and political observers. I concur whole-heartedly with the recommendations made by the Joint Chiefs of Staff on 23 December 1949 [주11] to the effect that the Commander-in-Chief Far East should make an immediate survey of the need and extent of the military assistance required in Formosa in order to hold Formosa against attack. Although this recommendation was apparently not acceptable at the time to the National Security Council, I note that the Joint Chiefs reaffirmed this recommendation on 4 May 1950.\n\n11.\n\nFormosa has not yet fallen to Communist domination. There are conflicting reports as to the capability and will of the Chinese Nationalist Forces as now constituted and equipped to prevent either the military or political conquest of the island of Formosa. I cannot predict what the cost may be of preventing Communist domination of that island, although I have advised the Joint Chiefs of Staff what the cost may be if such an event transpires. I am satisfied, however, that the domination of Formosa by an unfriendly power would be a disaster of utmost importance to the United States, and I am convinced that time is of the essence. I strongly believe that the Commander-in-Chief Far East should be authorized and directed to initiate without delay a survey of the military, economic and political requirements to prevent the domination of Formosa by a Communist power and that the results of such a survey be analyzed and acted upon as a basis for United States national policy with respect to Formosa.\n\nDouglas MacArthur", "notes": ["[주1] 루이스 A. 존슨 국방장관.", "[주2] 프랜시스 P. 매슈스 해군장관.", "[주3] 토머스 K. 핀레터 공군장관.", "[주4] 오마 N. 브래들리 육군 원수, 합동참모본부 의장.", "[주5] 포레스트 P. 셔먼 해군 대장, 해군참모총장.", "[주6] 호이트 S. 밴덴버그 공군 대장, 미 공군 참모총장.", "[주7] J. 로턴 콜린스 육군 대장, 미 육군 참모총장.", "[주8] 맥아더 장군의 비망록은 이 문서의 부속서로 인쇄되어 있다. 이 비망록은 극동 시찰을 마치고 막 귀국한 브래들리 장군과 존슨 장관이 일본에서 가지고 온 것이었다.", "[주9] 6월 27일.", "[주10] 대만에 관한 미국의 정책에 대한 문서는 Foreign Relations, 1950, vol. vi, pp. 256 이하를 참조.", "[주11] 전문은 Foreign Relations, 1949, vol. ix, p. 460 수록."], "warn": false, "pages": ["50-158", "50-159", "50-160", "50-161", "50-162", "50-163", "50-164", "50-165"], "search": "제섭(Philip C. Jessup) 대사대리 트루먼(Harry S. Truman) 대통령 애치슨(Dean Acheson) 국무장관 페이스(Frank Pace Jr.) 육군장관 존슨(Louis A. Johnson) 국방장관 핀레터(Thomas K. Finletter) 공군장관 매슈스(Francis P. Matthews) 해군장관 브래들리(Omar N. Bradley) 합참의장 웹(James E. Webb) 국무차관 러스크(Dean Rusk) 국무차관보 히커슨(John D. Hickerson) 국무차관보 셔먼(Forrest P. Sherman) 해군참모총장 밴덴버그(Hoyt S. Vandenberg) 공군참모총장 콜린스(J. Lawton Collins) 육군참모총장 맥아더(Douglas MacArthur) 극동군사령관"}, {"id": "50-d90", "order": 4, "date": "1950-06-26", "group": "A", "eyebrow": "50-d90 · The Ambassador in Korea (Muccio) to the Secretary of State", "title": "주한대사(무초)가 국무장관에게 보낸 전보", "badge": null, "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-06-26"}, {"k": "시각", "v": "[Received June 26—6:02 a. m.]"}, {"k": "발신", "v": "주한대사 무초(Muccio)", "txt": true}, {"k": "수신", "v": "국무장관", "txt": true}, {"k": "장소", "v": "Seoul"}, {"k": "전문번호", "v": "951"}, {"k": "종류", "v": "전보"}, {"k": "원문출처", "v": "795.00/6–2650: Telegram", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d90"}], "summary": "국회가 미국 대통령과 의회, 유엔 총회에 원조를 호소하고 정부 지지를 확인했다. 무초가 호소문과 서울 전황을 보고한다.", "points": ["국회는 비교적 차분한 분위기 속에서 미국 대통령·의회·유엔 총회에 원조를 호소했다.", "국회는 만장일치로 위기 상황에서 정부 지지를 확인하고, 전선 시찰과 긴급 군사자금 승인을 의결했다.", "국회는 이후 비공개 회의로 전환하여 대통령·국방장관·내무장관으로부터 상황을 청취했다.", "미국 대통령과 의회에 대한 호소문은 북한군의 남침을 알리고, 방위력 구축 노력을 상기시키며 효과적이고 시의적절한 원조를 요청한다.", "유엔 총회에 대한 메시지는 북한의 무력 침략을 규탄하고, 한국과 세계 평화를 위한 즉각적이고 효과적인 조치를 호소한다."], "primary": "평문\n\n서울, 1950년 6월 26일.\n[6월 26일 오전 6시 2분 접수]\n\n951. 오늘 아침 비교적 차분한 분위기 속에서 열린 국회는 미국 대통령, 의회 및 유엔 총회에 원조를 호소했으며, 이 위기 상황에서 정부를 지지함을 이의 없이 확인했다. 또한 전투 지역의 군인과 민간인에 대한 구호 및 격려를 의결하고, 국회 대표단의 전선 방문을 승인했으며(의원 3명이 자원), 특별 긴급 군사 기금 설치를 승인했다. 이어 비공개 회의로 전환해 대통령, 국방장관 및 내무장관으로부터 상황을 청취했다.\n\n미국 대통령과 의회에 대한 호소문 번역문은 다음과 같다:\n\n“6월 25일 이른 아침을 기해 북한 공산군이 남측에 대한 무력 침략을 개시했습니다. 각하와 미 의회는 오늘날과 같은 사태를 예상한 우리 국민이 동방에서 민주주의의 보루를 확보하고 세계 평화에 기여하기 위해 강력한 국방력을 구축해 왔다는 사실을 이미 알고 계실 것입니다. 저희를 해방시키고 우리 공화국을 수립하는 데 없어서는 안 될 원조를 주신 데 다시 한번 감사드립니다. 이 국가적 위기에 직면하여 용감히 싸우면서, 저희는 증대된 지원을 호소하는 동시에 세계 평화를 파괴하는 이 행위를 막기 위해 효과적이고 시의적절한 원조를 더하여 주실 것을 요청합니다.”\n\n유엔 총회(UNCOK 경유)에 보내는 메시지 번역문은 다음과 같다:\n\n“6월 25일 이른 아침을 기해 북한 공산군이 38선 전 지역에 걸쳐 무력 침략을 개시했습니다. 자위를 위해 우리의 용감하고 애국적인 육군과 해군이 영웅적 방어 작전을 개시했습니다. 반란군의 이 야만적이고 불법적인 행위는 용서받을 수 없는 죄악을 범한 것입니다. 3천만 한국인을 대표하는 저희는 [168면] 침략에 맞선 우리의 방어적 싸움이 우리 국민과 정부로서는 불가피한 대응임을 유엔 총회가 깨닫기를 바랍니다. 또한 한국뿐만 아니라 세계의 평화를 사랑하는 국민들을 위해 평화와 안보를 확보하기 위한 즉각적이고 효과적인 조치를 취해 주실 것을 호소합니다.”\n\n극동군사령관에게 참고 반복 송신함.", "secondary": "plain\n\nSeoul, June 26, 1950.\n[Received June 26—6:02 a. m.]\n\n951. National Assembly meeting in relatively calm spirit this morning appealed to President US, Congress and UN General Assembly for aid, and without dissent affirmed Assembly support of government in this crisis. Also voted for relief and encouragement of soldiers and civilians in battle area, authorized Assembly delegation to visit front lines (3 members volunteered) and approved establishment special emergency military fund. Then went into closed session to hear President, Defense Minister and Home Minister on situation.\n\nTranslation of appeal to President US and Congress follows:\n\n“Beginning early morning 25 June, North Korean Communist Army began armed aggression against South. Your Excellency and Congress of US already aware of fact that our people, anticipating incident such as today’s, established strong national defense force in order to secure bulwark of democracy in the east, and to render service to world peace. We again thank you for your indispensable aid in liberating us and in establishing our Republic. As we face this national crisis, putting up brave fight, we appeal for your increasing support and ask that you at same time extend effective and timely aid in order to prevent this act of destruction of world peace.”\n\nTranslation message to UN General Assembly (through UNCOK) follows:\n\n“Beginning early morning 25 June North Korean Communist Army began armed aggression throughout 38th parallel area. For self protection our brave and patriotic army and navy opened heroic defense operations. This savage and unlawful act of rebel force is commission of unpardonable sin. We, representing 30 million Koreans, [168면] hope UNGA realized our defensive fight against aggression is inevitable reaction of our people and government. We also appeal for your immediate and effective steps to secure peace and security, not only for Korea but also for peace loving people of world.”\n\nRepeated info CINCFE.", "notes": ["원문 첫머리에 `plain`이라 표시되어 있다. 암호를 걸지 않은 평문 전보임을 뜻한다."], "warn": false, "pages": ["50-168"], "search": "무초(John J. Muccio) 신성모(申性模) 조병옥(趙炳玉)"}, {"id": "50-d119", "order": 5, "date": "1950-06-27", "group": "B", "eyebrow": "50-d119 · Statement Issued by the President  Copies of the statement (Korean Conflict) were distributed to the participants in the meeting at the White House (see supra) which terminated at approximately noon.", "title": "대통령 성명", "badge": null, "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-06-27"}, {"k": "시각", "v": null}, {"k": "발신", "v": "트루먼 대통령 (President Truman)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "성명"}, {"k": "원문출처", "v": "", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d119"}], "summary": "트루먼이 한국에 대한 해공군 지원, 대만해협 중립화, 필리핀 및 인도차이나에 대한 군사원조 가속화를 명령한 6월 27일 성명이다.", "points": ["북한의 침공에 맞서 한국 정부군을 엄호·지원하도록 미 해공군에 명령했다.", "공산주의가 전복을 넘어 무력 침공과 전쟁을 사용하게 되었다고 규정했다.", "대만에 대한 공격을 막기 위해 제7함대에 명령하고, 대만의 중국 정부에는 대륙에 대한 해공 작전 중지를 촉구했다.", "대만의 장래 지위는 태평양 안보 회복, 대일 강화, 또는 유엔의 심의를 기다려야 한다고 못 박았다.", "필리핀 주둔 미군 증강과 대(對)필리핀 군사원조 가속화를 지시했다.", "인도차이나의 프랑스 및 연합국 군대에 대한 군사원조 가속화와 군사사절단 파견을 지시했다.", "유엔 안전보장이사회에 이 조치들을 보고하라고 오스틴 대사에게 훈령했다."], "primary": "[워싱턴,] 1950년 6월 27일\n\n한국에서는 국경 습격을 방지하고 국내 치안을 유지하기 위해 무장한 정부군이 북한으로부터 침공해 온 군대의 공격을 받았다. 국제연합 안전보장이사회는 침공군에게 적대행위를 중지하고 38도선으로 철수할 것을 요구했다. 그들은 이에 응하지 않았을 뿐만 아니라 오히려 공격을 계속했다. 안전보장이사회는 모든 국제연합 회원국에게 이 결의 이행에 있어 국제연합에 모든 지원을 제공할 것을 요구했다. 이러한 상황에서 나는 미 공군 및 해군 부대에 한국 정부군에게 엄호와 지원을 제공하라고 명령했다.\n\n한국에 대한 공격은 공산주의가 독립국가들을 정복하기 위해 전복 수단을 넘어서서 이제 무력 침공과 전쟁을 사용할 것임을 의심의 여지없이 분명히 드러냈다. 공산주의는 국제 평화와 안전을 유지하기 위해 발한 국제연합 안전보장이사회의 명령을 무시했다. 이러한 상황에서 공산군이 포르모사를 점령하는 것은 태평양 지역의 안전과 그 지역에서 합법적이고 필수적인 임무를 수행하는 미군에 대한 직접적인 위협이 될 것이다.\n\n[203면]\n\n따라서 나는 포르모사에 대한 어떠한 공격도 방지하도록 제7함대에 명령했다. 이 조치의 필연적 귀결로서 나는 포르모사에 있는 중국 정부에 대륙에 대한 모든 해공 작전을 중지할 것을 촉구한다. 제7함대가 이 이행을 감독할 것이다. 포르모사의 장래 지위 결정은 태평양의 안전이 회복되고, 대일 강화가 이루어지거나, 또는 국제연합이 심의할 때까지 기다려야 한다.\n\n나는 또한 필리핀 주둔 미군을 증강하고 필리핀 정부에 대한 군사원조를 가속화하라고 지시했다.\n\n나는 마찬가지로 인도차이나에 있는 프랑스 및 인도차이나 연합국 군대에 대한 군사원조 제공을 가속화하고 그 군대들과 긴밀한 업무 관계를 구축할 군사사절단을 파견하라고 지시했다.\n\n나는 모든 국제연합 회원국이 국제연합 헌장을 무시한 이번 한국에서의 최신의 침략 행위의 결과를 신중하게 고려할 것임을 알고 있다. 국제 문제에서 무력의 통치로 돌아가는 것은 광범위한 영향을 미칠 것이다. 미국은 법의 통치를 계속 옹호할 것이다.\n\n나는 안전보장이사회의 미국 대표인 오스틴 대사에게 이 조치들을 이사회에 보고하라고 훈령했다.", "secondary": "[Washington,] June 27, 1950.\n\nIn Korea the Government forces, which were armed to prevent border raids and to preserve internal security, were attacked by invading forces from North Korea. The Security Council of the United Nations called upon the invading troops to cease hostilities and to withdraw to the 38th parallel. This they have not done, but on the contrary have pressed the attack. The Security Council called upon all members of the United Nations to render every assistance to the United Nations in the execution of this resolution. In these circumstances I have ordered United States air and sea forces to give the Korean Government troops cover and support.\n\nThe attack upon Korea makes it plain beyond all doubt that Communism has passed beyond the use of subversion to conquer independent nations and will now use armed invasion and war. It has defied the orders of the Security Council of the United Nations issued to preserve international peace and security. In these circumstances the occupation of Formosa by Communist forces would be a direct threat to the security of the Pacific area and to United States forces performing their lawful and necessary functions in that area.\n\n[203면]\n\nAccordingly I have ordered the Seventh Fleet to prevent any attack on Formosa. As a corollary of this action I am calling upon the Chinese Government on Formosa to cease all air and sea operations against the mainland. The Seventh Fleet will see that this is done. The determination of the future status of Formosa must await the restoration of security in the Pacific, a peace settlement with Japan, or consideration by the United Nations.\n\nI have also directed that United States Forces in the Philippines be strengthened and that military assistance to the Philippine Government be accelerated.\n\nI have similarly directed acceleration in the furnishing of military assistance to the forces of France and the Associated States in Indo China and the dispatch of a military mission to provide close working relations with those forces.\n\nI know that all members of the United Nations will consider carefully the consequences of this latest aggression in Korea in defiance of the Charter of the United Nations. A return to the rule of force in international affairs would have far reaching effects. The United States will continue to uphold the rule of law.\n\nI have instructed Ambassador Austin, as the representative of the United States to the Security Council, to report these steps to the Council.", "notes": ["[주1] 이 성명(한국 분쟁) 사본은 정오 무렵 끝난 백악관 회의(상기 참조) 참석자들에게 배포되었다."], "warn": false, "pages": ["50-203"], "search": "트루먼(Harry S. Truman) 대통령 오스틴(Warren R. Austin) 유엔 대사"}, {"id": "50-d130", "order": 6, "date": "1950-06-27", "group": "E", "eyebrow": "50-d130 · Resolution Adopted by the United Nations Security Council, June 27, 1950  U.N. document S/1511. This resolution was adopted shortly before 11:50 p. m., at which time the meeting rose. The vote was 7 (including the U.S.) in favor, to 1 (Yugoslavia) opposed, with 2 (Egypt and India) not voting, and 1 (U.S.S.R.) member absent.", "title": "1950년 6월 27일 유엔 안전보장이사회 채택 결의", "badge": null, "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-06-27"}, {"k": "시각", "v": null}, {"k": "발신", "v": "유엔 안전보장이사회(Security Council)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "장소", "v": "Lake Success"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "결의"}, {"k": "원문출처", "v": "U.N. document S/1511. This resolution was adopted shortly before 11:50 p. m., at which time the meeting rose. The vote was 7 (including the U.S.) in favor, to 1 (Yugoslavia) opposed, with 2 (Egypt and India) not voting, and 1 (U.S.S.R.) member absent.", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d130"}], "summary": "북한군의 무력 공격을 격퇴하기 위해 회원국이 대한민국에 원조할 것을 권고하는 6월 27일 안보리 결의.", "points": ["북한군의 대한민국에 대한 무력 공격이 평화의 파괴를 구성한다고 결정했다.", "북한 당국에 적대 행위 즉각 중지와 38선으로의 무력 철수를 촉구했으나 이를 따르지 않았음을 기록했다.", "회원국이 무력 공격을 격퇴하고 이 지역의 국제 평화와 안전을 회복하는 데 필요한 원조를 대한민국에 제공할 것을 권고했다.", "찬성 7(미국 포함), 반대 1(유고슬라비아), 기권 2(이집트, 인도), 소련 불참으로 채택되었다."], "primary": "1950년 6월 27일\n\n**안전보장이사회는**\n\n북한군의 대한민국에 대한 무력 공격이 평화의 파괴를 구성한다고 결정하였고,\n\n적대 행위의 즉각적인 중지를 촉구하였으며,\n\n북한 당국에 그들의 무력을 38선으로 즉시 철수할 것을 촉구하였고,\n\n북한 당국이 적대 행위를 중지하지도, 그들의 무력을 38선으로 철수하지도 않았으며 국제 평화와 안전을 회복하기 위해 긴급한 군사 조치가 필요하다는 점을 국제연합한국위원단의 보고에서 주목하였으며,\n\n평화와 안전을 확보하기 위한 즉각적이고 효과적인 조치를 취해 달라는 대한민국의 국제연합에 대한 호소를 주목하였고,\n\n이에 유엔 회원국이 무력 공격을 격퇴하고 이 지역의 국제 평화와 안전을 회복하는 데 필요한 그러한 원조를 대한민국에 제공할 것을 **권고한다.** [주2]\n\n[212면]", "secondary": "June 27, 1950\n\nThe Security Council\n\nHaving determined that the armed attack upon the Republic of Korea by forces from North Korea constitutes a breach of the peace;\n\nHaving called for an immediate cessation of hostilities; and\n\nHaving called upon the authorities of North Korea to withdraw forthwith their armed forces to the 38th parallel; and\n\nHaving noted from the report of the United Nations Commission for Korea that the authorities in North Korea have neither ceased hostilities nor withdrawn their armed forces to the 38th parallel, and that urgent military measures are required to restore international peace and security; and\n\nHaving noted the appeal from the Republic of Korea to the United Nations for immediate and effective steps to secure peace and security,\n\nRecommends that the Members of the United Nations furnish such assistance to the Republic of Korea as may be necessary to repel the armed attack and to restore international peace and security in the area. [주2]\n\n[212면]", "notes": ["[주2] 이 결의 채택 후, 안전보장이사회는 유고슬라비아 대표(베블러)가 제출한 결의안 초안(S/1509)에 대한 표결을 실시했다. 그 초안은 적대 행위의 종식을 위한 안보리의 촉구를 재차 확인하고, 양 당사자 간 중재 절차를 개시하며, 북한 대표를 국제연합에 초청하여 중재 절차에 참여시키도록 하는 내용이었다. 유고슬라비아의 결의안 초안은 찬성 1(유고슬라비아), 반대 7(미국 포함), 기권 2(이집트, 인도), 소련 불참 1이라는 표결 결과로 채택되지 못했다."], "warn": false, "pages": ["50-212"], "search": "Bebler 베블러(유고슬라비아 대표)"}, {"id": "50-d132", "order": 7, "date": "1950-06-28", "group": "B", "eyebrow": "50-d132 · Memorandum of a Meeting in the Office of the Under Secretary of State (Webb)  The meeting took place at 9:30 a. m. It was one of a number of regularly held meetings ordinarily attended by Under Secretary of State Webb and other high officials of the Department of State such as Assistant Secretaries and Special Assistants; on this occasion, Mr. Acheson was present.", "title": "국무차관(웹) 집무실 회의 비망록", "badge": "top secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-06-28"}, {"k": "시각", "v": "오전 9시 30분"}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": "M–212"}, {"k": "종류", "v": "회담 비망록"}, {"k": "원문출처", "v": "Lot File 53D–250", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d132"}], "summary": "서울 상실과 북한군 전차 규모를 놓고 국무부 수뇌가 정세를 점검한 6월 28일 회의 기록.", "points": ["국무장관은 한국 공격 소식 이후 국무부 직원들의 신속한 대응과 국방부·의회와의 협력을 높이 평가했다.", "첩보에 따르면 서울은 상실된 것으로 보이며, 북한군은 소련제 중형전차 약 100대를 보유하고 있다.", "한국군 사기는 양호하며 항복 사례는 아직 보고되지 않았고, 후방 게릴라 활동도 없다.", "통신 불량과 중앙 정보평가 부재로 상황 보고에 혼선이 있으며, 낙관적 보고는 도쿄 주재 한국 공사에게서 주로 나왔다.", "두 번째 유엔 결의안이 인도와 이집트의 기권 속에 통과되었고, 이들 국가의 찬성을 기다리기보다 어제 표결을 강행했다.", "여러 대사들의 반응은 대체로 호의적이었고, 인도의 판디트 여사는 예상 밖으로 수용적이었으며, 라틴아메리카 국가들도 사전 통보에 감사를 표했다."], "primary": "top secret\nUM M–212\n\n[워싱턴,] 1950년 6월 28일.\n\n국무장관은 한국 공격 소식 이후 국무부 직원들과 그들이 일한 속도에 국무부가 자부심을 가질 만하다고 말했다. 그는 특히 국방부 및 의회와 이루어낸 훌륭한 협력을 언급했다.\n\n암스트롱 씨는 오늘 아침 7시 도쿄와의 전화 협의 결과 입수 가능한 최신 첩보를 종합하여 보고했다. [주2] 서울이 상실된 것은 사실인 듯하나, 비행장이 공산군 수중에 있는지 여부는 확실하지 않다. 미 정보 당국은 북한군이 소련제 중형전차 약 100대를 보유하고 있으며 주로 서울로 이어지는 남쪽 계곡에서 작전 중인 것으로 추정한다. 또한 구형 경수륙양용전차도 다수 보유하고 있다. 보고에 따르면 한국군의 사기는 양호하며 [213면] 현재까지 항복한 자는 없는 것으로 파악된다. 한국군 후방에서 게릴라 활동은 없다. 동해안에 3건의 상륙이 보고되었으며, 이 중 2건은 저지 중이고 나머지 1건은 보고되지 않았다. 북한군의 군수 계획에 관한 첩보는 없다. 유엔군 최고사령관은 대통령 성명과 유엔 결의문을 담은 전단을 항공으로 남북한 전역에 살포하고 있다. 일본 언론의 반응이 매우 호의적이어서 유엔군 최고사령부는 일본 신문 25만 부도 한국에 투하하고 있다.\n\n상황 보고의 혼선은 열악한 통신과 한국 내에서 첩보 보고를 평가할 중앙 부대의 부재 때문이다. 낙관적 보고는 대부분 도쿄 주재 한국 공사에게서 나온다는 점도 지적되었다. 유엔군 최고사령부는 선발 제대를 한국에 파견 중이나, 아직 상황을 개선하지는 못했다. 미군 항공기는 한국 내 활주로를 제한적으로만 사용할 수 있기 때문에 일본 기지에서 작전 중이다. 제7함대의 소재는 보고되지 않았다.\n\n히커슨 씨는 인도와 이집트가 불참한 가운데 두 번째 유엔 결의안이 통과된 경과를 보고했다. 그는 양국 대표 모두 호의적인 연설을 했으며, 그들 정부로부터 훈령을 받기를 바라는 마음에 최종 표결을 가능한 한 늦추었다고 설명했다. 그러나 인도와 이집트가 우리 결의안에 찬성하기를 기다리기보다 어쨌든 어제 표결을 해야 한다고 결정했다.\n\n국무장관은 우리의 결정을 통보받았을 때 여러 대사들의 반응이 어떠했는지 물었다. 전반적으로 호의적이었다는 답변이 나왔다. 인도의 판디트 여사가 우리 예상을 뒤엎고 매우 수용적이고 협조적이었으며, 인도네시아 대사도 기뻐했고, 덴마크는 큰 기쁨을 표하라는 훈령을 받았다. 라틴아메리카 국가들은 사전 통보를 받은 것에 감사를 표했으며, 그 중 절반가량이 이미 우리의 조치에 대한 찬성을 표명했다. [주3] 암스트롱 씨는 전 세계적 반응에 관한 보고서가 작성 중이며, 반응은 대체로 호의적인 듯하다고 말했다. 맥폴 씨는 의회의 반응이 좋았으나, 좌파의 마칸토니오와 우파의 왓킨스 상원의원 및 켐 상원의원은 예외였다고 말했다. [주4]\n\n[214면]", "secondary": "top secret \n UM M–212\n\n[Washington,] June 28, 1950.\n\nThe Secretary stated that the Department could be proud of its personnel and the speed with which they worked following news of the Korean attack. He particularly noted the excellent cooperation achieved with Defense and the Congress.\n\nMr. Armstrong gave a round-up of the latest intelligence available as a result of Telecon with Tokyo at 7 this morning. [주2] It is apparently true that Seoul is lost, but it is not sure whether the air field is in Communist hands or not. U.S. intelligence estimates that the North Koreans have some 100 medium tanks of Soviet make operating primarily in the valley leading south to Seoul. They also have a number of old light amphibious tanks. Reports indicate that the morale of [213면] South Korean troops is good and so far as we know none has surrendered yet. There is no guerrilla activity behind the South Korean lines. Three amphibious landings have been reported on the East coast, two of which are being contained and the third is unreported. We have no intelligence of any logistic planning by the North Korean forces. SCAP is distributing by air over both North and South Korea pamphlet containing the President’s announcement and the UN resolution. The reaction in the Japanese press has been so favorable that SCAP is also dropping 250,000 copies of Japanese newspapers into Korea.\n\nThe confusion in the reports of the situation are due to the poor communications and to the lack of a central unit in Korea to evaluate intelligence reports. It was also pointed out the optimistic reports came largely from the Korean Minister in Tokyo. SCAP is sending a forward echelon unit into Korea, but this has not yet been able to improve the situation. U.S. planes are operating from Japanese fields since they could make only limited use of airstrips in South Korea. The whereabouts of the Seventh Fleet was not reported.\n\nMr. Hickerson reported on the passage of the second UN resolution with India and Egypt not participating. He indicated that the representatives of both countries had made favorable speeches and that a final vote had been delayed as long as possible in the hope that they would receive instructions from their Governments. It was decided, however, that a vote should be taken yesterday in any event rather than waiting in the hope of Indian and Egyptian approval of our resolution.\n\nThe Secretary asked what the reactions of the various Ambassadors had been when they were informed of our decision. He was told that they were generally favorable; that Madame Pandit of India was, to our surprise, very receptive and cooperative; that the Indonesian Ambassador was also pleased and the Danes were under instructions to express their great pleasure. The Latin American countries appreciated being informed in advance and about half of them have already expressed their approval of our action. [주3] Mr. Armstrong stated that a report was being compiled on world-wide reaction, which seemed to be generally favorable. Mr. McFall stated that the reception in Congress had been good with the exception of Marcantonio on the left and Senators Watkins and Kem on the right. [주4]\n\n[214면]", "notes": ["[주1] 회의는 오전 9시 30분에 열렸다. 이 회의는 정례 회의 중 하나로, 평소에는 웹 국무차관과 차관보 및 특별보좌관 등 국무부 고위 관료들이 참석했다. 이날은 애치슨 씨가 참석했다.", "[주2] 인쇄되지 않음.", "[주3] 6월 28일 미주기구(OAS) 평의회 특별 회의는 만장일치로 다음과 같이 결의했다. “1. 유엔의 권한 있는 기관들의 결정에 대한 확고한 지지를 선언한다. 2. 이 자리에서 미주 국가들을 결속하는 대륙적 연대의 서약을 엄숙히 재확인한다.” (Annals of the Organization of American States, 1950 (워싱턴, 범미연합, 발행 연도 미상), 222쪽).", "[주4] 뉴욕주 미국노동당의 비토 마칸토니오 하원의원과 유타주의 아서 V. 왓킨스 공화당 상원의원, 미주리주의 제임스 P. 켐 공화당 상원의원을 가리킨다."], "warn": false, "pages": ["50-213", "50-214"], "search": "Webb 웹(James E. Webb) Acheson 애치슨(Dean Acheson) Armstrong 암스트롱(W. Park Armstrong, Jr.) Hickerson 히커슨(John D. Hickerson) Pandit 판디트(Vijaya Lakshmi Pandit) McFall 맥폴(John K. McFall) Marcantonio 마칸토니오(Vito Marcantonio) Watkins 왓킨스(Arthur V. Watkins) Kem 켐(James P. Kem)"}, {"id": "50-d157", "order": 8, "date": "1950-06-29", "group": "C", "eyebrow": "50-d157 · Memorandum by Mr. John Foster Dulles, Consultant to the Secretary of State", "title": "한국에 관한 비망록", "badge": "secret", "list_right": "1950 VII", "meta": [{"k": "일자", "v": "1950-06-29"}, {"k": "시각", "v": null}, {"k": "발신", "v": "John Foster Dulles 덜레스(국무장관 고문)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "장소", "v": "Washington"}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "원문출처", "v": "S/P Files: Lot 64D563", "txt": true}], "links": [{"k": "FRUS", "text": "1950 VII 원문", "url": "https://history.state.gov/historicaldocuments/frus1950v07/d157"}], "summary": "덜레스가 남침의 원인을 분석하고 미국의 대응을 평가하는 각서. 소련이 남한의 자유정부 실험을 위협으로 간주해 제거하려 했을 것이라고 본다.", "points": ["남침의 지역적 원인은 소련 공산주의자들이 남한의 자유정부 실험이 성공하는 것을 두려워한 데 있다고 분석한다.", "한국군의 전투기·전차·중화기 부재, 정보 판단 실패, 군사고문단의 안이한 태도, 도쿄 사령부의 상황 인식 지연을 남침 초기 대규모 성공의 원인으로 지목한다.", "이러한 결함들이 다른 지역에도 존재할 가능성이 있으며 시정 조치가 바람직하다고 지적한다.", "침공이 일본의 자치로의 이행을 어렵게 만들어 공산주의에 기회를 줄 수 있다고 분석한다.", "트루먼 대통령의 성명과 유엔의 뒷받침을 받은 신속한 대응을 매우 높은 수준의 정치력으로 평가한다.", "이 조치가 소련의 침략적 행로를 멈추게 할 최선의 기회를 제공한다고 본다."], "primary": "secret\n\n[워싱턴,] 1950년 6월 29일. [주1]\n\n한국에 관한 비망록\n\n1. 남한은 우수한 미국 사절단의 지도 아래, 그리고 미국의 일부 물자 원조와 함께 자유 사회로 빠르게 발전하고 있었다.\n\n그곳에서 발생한 일을 내부의 부패나 실패 탓으로 돌릴 수는 없다. 오히려, 공격에 대한 어떤 현지적 설명이 있다면, 그것은 소련 공산주의자들이 자유 정부라는 남한의 실험이 성공하는 것을 우려했고, 그렇지 않으면 공산주의가 지배하는 북아시아 본토에 위험한 도덕적 돌출부로서 이를 반드시 진압해야 한다고 느꼈다는 것일 것이다.\n\n2. 공격의 초기 대규모 성공에는 다음과 같은 원인들이 기여했다.\n\na)\n\n남한 군대는 미국의 결정에 따라 전투기, 전차 및 중화기를 보유하지 못했다. 적은 우리가 아는 한 상당한 양과 우수한 품질의 이것들을 보유하고 있었음에도 불구하고 말이다.\n\nb)\n\n정보를 적절하게 평가하는 데 실패했다. 정보는 수 주에 걸쳐 대규모 병력과 전차 부대가 점진적으로 집결해 왔음을 보여주었다. 그러나 우리 측에는 국경 습격 이상의 병력 규모는 없을 것이라는 고정관념이 계속해서 존재했다.\n\n[238면] c)\n\n미군 고문단 측에 남한 군대의 사기와 규율에 대한 과도한 자신감에서 비롯된 안일한 분위기가 있었다. 그들은 남한 군대가 전투
