Matthews: I think that’s wise unless the delay is too long. If the delay is too long then I think we’d better go ahead and continue discussions in the EAC. Don’t you agree?\n\nWinant: Yes I agree to that.\n\nMatthews: Yes.\n\nWinant: But I think it is worth waiting four or five days to get it.\n\n. . . . . . .\n\n[116면]", "notes": ["[주26] 독일 문제를 다룬 이 대서양 횡단 통화의 다른 발췌는 206면을 보라."], "warn": false, "pages": ["116"], "search": "Winant 위넌트(주영대사) Matthews 매슈스(유럽국장) Gousev 구세프(주영 소련대사, 유럽자문위원회 소련 대표) Eden 이든(영국 외무장관) Molotov 몰로토프 Stalin 스탈린"}, {"id": "d209", "order": 209, "date": "1945-05-04", "group": "D", "eyebrow": "d209 · The Secretary of War (Stimson) and the Secretary of the Navy (Forrestal) to the Secretary of State", "title": "육군장관(스팀슨)과 해군장관(포레스털)이 국무장관에게", "badge": null, "list_right": "문서 209", "meta": [{"k": "일자", "v": "1945-05-04"}, {"k": "시각", "v": "Washington, 4 May 1945."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 Control (Germany)/5–445", "txt": true}, {"k": "발신", "v": "The Secretary of War (Stimson) and the Secretary of the Navy (Forrestal) 육군장관 스팀슨과 해군장관 포레스털 (실제 서명: H. Struve Hensel 해군차관보, Henry L. Stimson 육군장관)", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "서한"}], "links": [{"k": "FRUS", "text": "문서 209 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d209"}], "summary": "독일 내 프랑스 점령지대에 관한 아이젠하워의 수정 권고에 합동참모본부가 동의하며 이를 EAC 교섭의 토대로 삼을 것을 권고한다. 코블렌츠 동쪽 교두보는 프랑스가 요구하면 주라는 것이다.", "points": ["합동참모본부가 첨부된 아이젠하워 전문의 권고에 동의하며, 이를 EAC 교섭의 토대로 삼을 것을 권고한다.", "헤센나사우주 코블렌츠 동쪽의 라인강 교두보(운터베스터발트크라이스, 운터란크라이스, 장크트고아르스하우젠크라이스)는 프랑스가 요구하면 주어야 한다는 것이 합동참모본부의 판단이다.", "이 결정은 5월 1일자 육군·해군 장관 서한 제7b(3)항 마지막 두 문장과 제8항을 대체한다.", "[첨부] 아이젠하워의 수정 권고다. 종전 권고는 병참과 천연자원에 관한 상세 연구 없이 이루어졌다.", "뷔르템베르크주에서는 카를스루에·슈투트가르트·울름을 잇는 아우토반과 철도 남쪽 지역을 프랑스에 주어도 무방하다(레온베르크·뵈블링겐·뉘르팅겐·괴핑겐·울름 및 뮌징겐의 아우토반 북동쪽 부분은 미국 측 포함).", "린다우 크라이스는 프랑스령 오스트리아 지대로 가는 회랑으로 프랑스에 양여할 수 있다.", "바덴주에서는 철도·아우토반 통과 교통·카를스루에시 북쪽 유전·항만 및 통신 시설의 통제를 위해 만하임과 카를스루에 베치르크를 보유하는 것이 가장 바람직하다. 카를스루에는 최후의 수단으로만 내주고, 만하임은 어떤 경우에도 포기할 수 없다.", "라인강 동쪽 교두보를 주어야 한다면 코블렌츠 동쪽 헤센나사우 지역을 택하며, 비스바덴이나 마인츠 부근의 교두보에는 동의할 수 없다.", "오해가 없도록 이 수정 견해를 국무부 경로로 캐퍼리 대사에게 최종 훈령으로 전달할 것을 요구한다."], "primary": "워싱턴, 1945년 5월 4일.\n\n장관 귀하: 합동참모본부는 첨부한 사본의 독일 내 프랑스 지대에 관한 아이젠하워 장군의 전문에 담긴 권고에 동의하며, 그것이 유럽자문위원회에서의 교섭의 토대로 사용될 것을 권고합니다. 합동참모본부는 헤센나사우주 코블렌츠 동쪽의 라인강 교두보, 즉 운터베스터발트크라이스, 운터란크라이스 및 장크트고아르스하우젠크라이스로 이루어진 지역을, 프랑스 측이 요구한다면 그들에게 주어야 한다고 봅니다.\n\n이 결정은 이 문제에 관하여 1945년 5월 1일 육군장관과 해군장관이 국무장관에게 발송한 서한의 제7b(3)항 마지막 두 문장 및 제8항의 언급을 대체합니다. [주3]\n\n경구,\n\nH. 스트루브 헨셀(H Struve Hensel)\n\n[주4]\n\n\n헨리 L. 스팀슨(Henry L. Stimson)\n\n육군장관\n\n[첨부]\n\n**아이젠하워가 합동참모본부에 보내는 전언**\n\n주제는 독일 내 프랑스 지대임.\n\n1.\n\n독일 내 프랑스 지대에 관한 본인의 종전 권고는 문제된 지역의 병참상의 고려와 천연자원에 대한 상세한 연구 없이 이루어진 것이었음. 이 연구들이 이제 이루어졌으므로 본인은 권고를 다음과 같이 바꾸고자 함.\n\n2.\n\n카를스루에–슈투트가르트 [262면] 및 울름을 잇는 아우토반과 철도 남쪽의 뷔르템베르크주 지역을, 다음 크라이스 경계로 획정하여 프랑스 측에 주는 것은 우리에게 무방함. 즉 레온베르크, 뵈블링겐, 뉘르팅겐, 괴핑겐, 울름, 그리고 뮌징겐 가운데 아우토반 북동쪽 부분은 미국 측에 포함함. 또한 린다우 크라이스는 프랑스령 오스트리아 지대로 가는 회랑으로서 프랑스 측에 양여될 수 있음.\n\n3.\n\n바덴주에서는 철도, 아우토반을 통한 통과 도로 교통, 카를스루에시 북쪽의 유전, 항만 및 통신 시설의 통제를 위하여 만하임과 카를스루에의 베치르크를 우리가 보유하는 것이 가장 바람직함. 카를스루에 베치르크는 오직 최후의 수단으로만 내주어야 하며, 만하임 베치르크는 어떠한 사정에서도 포기할 수 없음.\n\n4.\n\n라인강 동쪽의 교두보를 부여하여야 한다면 본인은 헤센나사우주 코블렌츠 동쪽의, 운터베스터발트크라이스, 운터란크라이스, 장크트고아르스하우젠크라이스로 이루어진 지역을 선호함. 비스바덴이나 마인츠 부근의 어떠한 교두보에도 동의할 수 없음.\n\n5.\n\n오해가 없도록, 여기에 표명된 수정된 견해가 국무부 경로를 통하여 캐퍼리 대사에게 최종 훈령으로 전달될 것을 요청함.\n\n6.\n\n그러나 본인은 캐퍼리 대사와 개인적으로 대화하였으며, 그는 본인의 견해와 우리의 군사적 요구를 이해하고 있음. 그리고 머피가 교섭 중 계속 연락을 유지할 것임.", "secondary": "Washington, 4 May 1945.\n\nDear Mr. Secretary: The Joint Chiefs of Staff concur in the recommendation of General Eisenhower in the attached copy of his cable on the subject of the French zone in Germany and recommend that it be used as a basis for negotiation in the European Advisory Commission. The Joint Chiefs of Staff consider that the bridgehead of the Rhine east of Koblenz in the State of Hessen-Nassau comprising Unterwester Waldkreis, Unterlahn Kreis and Sankt Goarshausen Kreis should be given to the French if they ask for it.\n\nThis decision supersedes the remarks in the last two sentences of paragraph 7b (3) and paragraph 8 of the letter dispatched to the Secretary of State by the Secretaries of War and the Navy on 1 May 1945 on this matter. [주3]\n\nSincerely yours,\n\nH Struve Hensel\n\n[주4] \n\n\nHenry L. Stimson\n\nSecretary of War\n\n[Enclosure]\n\nMessage to Joint Chiefs of Staff from Eisenhower\n\nSubject is French zone in Germany.\n\n1.\n\nMy previous recommendations concerning French zone in Germany were made without detailed study of logistical considerations and natural resources in the area under consideration. These studies have now been made, and I wish to change my recommendation to the following:\n\n2.\n\nIt is satisfactory to us to give the French the area in the state of Wurttemberg south of the Autobahn and railway connecting Karlsruhe-Stuttgart [262면] and Ulm as denned by the following Kreis boundaries: Leonberg, Boblingen, Nurtigen, Goppingen, Ulm, and that portion of Munsingen northeast of Autobahn, inclusive to United States. Also the Kreis of Lindau can be conceded to the French as a corridor to the French Austrian zone.\n\n3.\n\nIn the state of Baden it is most desirable that we retain the Bezirke of Mannheim and Karlsruhe for control of railways, through road traffic via the Autobahn, oil fields north of city of Karlsruhe, port and signal installations. Only as a last resort should the Bezirk of Karlsruhe be released, and under no circumstances can we relinquish the Bezirk of Mannheim.\n\n4.\n\nIf a bridgehead east of the Rhine must be granted I favor the area east of Koblenz in the state of Hessen Nassau, comprising Unterwester Waldkries, Unterlahn Kreis, Sankt Goarshausen Kreis. Can not agree to any bridgehead in the vicinity of Wiesbaden or Mainz.\n\n5.\n\nIn order that there be no misunderstanding request that amended view as expressed herein be transmitted as ultimate instructions to Ambassador Caffery through State Department channels.\n\n6.\n\nI have, however, had a personal conversation with Ambassador Caffery, who understands my views and our military requirements, and Murphy will be in constant touch during negotiations.", "notes": ["[주3] 5월 1일자 서한은 수록하지 않았다. 다만 249면 각주 86을 보라.", "[주4] 해군차관보."], "warn": true, "pages": ["262"], "search": "Stimson 스팀슨(육군장관) Forrestal 포레스털(해군장관) H. Struve Hensel H. 스트루브 헨셀(해군차관보) Eisenhower 아이젠하워 Caffery 캐퍼리(주프랑스대사) Murphy 머피(대독일 정치고문) Marshall 마셜(첨부 전문의 원 수신자로 d211에 언급)"}, {"id": "d211", "order": 211, "date": "1945-05-04", "group": "A", "eyebrow": "d211 · The Ambassador in France (Caffery) to the Secretary of State", "title": "주프랑스대사(캐퍼리)가 국무장관에게", "badge": null, "list_right": "문서 211", "meta": [{"k": "일자", "v": "1945-05-04"}, {"k": "시각", "v": "Paris, May 4, 1945—1 p.m. [Received 8:44 p.m.]"}, {"k": "장소", "v": "Paris", "txt": true}, {"k": "전문번호", "v": "2342"}, {"k": "원문출처", "v": "740.00119 (Control) Germany/5–445: Telegram", "txt": true}, {"k": "발신", "v": "The Ambassador in France (Caffery) 주프랑스대사 캐퍼리", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 211 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d211"}], "summary": "아이젠하워와 베델 스미스가 제시한 군사적 고려에 비추어, 아이젠하워 전문에 적힌 지역을 그 조건대로 프랑스에 제안하는 데 동의한다고 회신한다.", "points": ["국무부 5월 1일자 179[1799]호에 대한 회신이다. 전보에 나타난 번호 오기를 편집자가 대괄호로 바로잡았다.", "아이젠하워 장군과 베델 스미스가 제시한 군사적 고려를 염두에 두고 충분히 검토한 끝에, 어제 오후 발신된 「주제는 독일 내 프랑스 지대, 마셜 장군 개인 앞」이라는 제목의 아이젠하워 전문에 적힌 지역을 그 전문의 조건대로 프랑스에 제안하는 데 동의한다.", "헤센나사우주 코블렌츠 동쪽에 언급된 교두보가 포함되기를 바란다고 덧붙인다.", "카를스루에 베치르크는 오직 최후의 수단으로만 프랑스에 내주어야 한다는 점에 유의하고 있다고 밝힌다."], "primary": "파리, 1945년 5월 4일 오후 1시.\n [접수 오후 8시 44분]\n\n2342. 국무부 5월 1일자 179[1799]호. [주8] 아이젠하워 장군과 베델 스미스(Bedell Smith)가 제시한 군사적 고려를 염두에 두고 충분히 검토한 끝에, 본관은 어제 오후 발신된 「주제는 독일 내 프랑스 지대, 마셜(Marshall) 장군 개인 앞」이라는 제목의 아이젠하워 장군의 전문[주9]에 제시된 지역을, 그 전문에 제시된 조건 아래 프랑스 측에 제안하는 데 동의한다.\n\n본관은 헤센나사우주 코블렌츠 동쪽에 언급된 교두보가 포함되기를 바란다.\n\n본관은 카를스루에 베치르크가 오직 최후의 수단으로만 프랑스 측에 내주어져야 한다는 점에 유의하고 있다.\n\n캐퍼리(Caffery)", "secondary": "Paris, May 4, 1945—1 p.m. \n [Received 8:44 p.m.]\n\n2342. Department’s 179 [1799], May 1. [주8] Having in mind the military considerations set out by General Eisenhower and Bedell Smith, and after due consideration I agree that we offer the French the area as set out in General Eisenhower’s telegram [주9] sent yesterday afternoon entitled “subject is French zone in Germany, personal for General Marshall,” under the conditions set out in that telegram.\n\nI trust that the bridgehead mentioned east of Koblenz in the State of Hessen Nassau will be included.\n\nI note that the Bezirk of Karlsruhe should be released to the French only as a last resort.\n\nCaffery", "notes": ["[주8] 260면 각주 1을 보라.", "[주9] 앞, 261면."], "warn": false, "pages": [], "search": "Caffery 캐퍼리(주프랑스대사) Eisenhower 아이젠하워 Bedell Smith 베델 스미스(SHAEF 참모장) Marshall 마셜(육군참모총장)"}, {"id": "d212", "order": 212, "date": "1945-05-04", "group": "C", "eyebrow": "d212 · Memorandum of a Trans-Atlantic Telephone Conversation Between the Ambassador in the United Kingdom (Winant), in London, and the Director of the Office of Europeom Affairs (Matthews), in Washington May 1943  Transmitted to the Department in despatch 25876, October 3, 1945, from London, not printed. For another extract from the record of this conversation, dealing with Austrian matters, see p. 115.", "title": "런던의 주영대사(위넌트)와 워싱턴의 유럽국장(매슈스) 사이의 대서양 횡단 전화 통화 비망록", "badge": null, "list_right": "문서 212", "meta": [{"k": "일자", "v": "1945-05-04"}, {"k": "시각", "v": null}, {"k": "장소", "v": "London — Washington (대서양 횡단 전화)", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 EAC/10–345", "txt": true}, {"k": "발신", "v": "런던의 주영대사 위넌트(John G. Winant)", "txt": true}, {"k": "수신", "v": "워싱턴의 유럽국장 매슈스(H. Freeman Matthews)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전화 비망록"}], "links": [{"k": "FRUS", "text": "문서 212 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d212"}], "summary": "항복문서 원본과 프랑스를 넷째 당사국으로 넣은 수정안이 SHAEF에 제대로 전달되었는지, 그리고 얄타에서 넣은 \"분할(dismemberment)\"이라는 낱말을 어떻게 다룰지를 두고 위넌트와 매슈스가 나눈 통화.", "points": ["이 문서가 실제로 쓰일 것인가를 의심한다. 위넌트는 \"항복문서의 대체물로 쓰일 수도 있는 선언(proclamation)\"을 지금 작업 중이라고 말한다. 사흘 뒤 랭스에서 실제로 항복문서는 쓰이지 않았다", "위넌트: 항복문서 원본이 연합참모본부를 통해 SHAEF로 전달된 적이 있는지 확신하지 못하며, SHAEF가 가진 사본은 EAC에서 자신들이 보낸 것뿐인 것으로 안다", "매슈스: 프랑스를 넷째 당사국으로 넣는 최근 수정안의 원본은 아직 워싱턴에 도착하지 않았다", "위넌트: 항복문서가 선언보다 더 단단한 법적 기초를 준다는 점이 양해되어야 한다고 못박는다", "낱말 하나를 두고 다툼이 벌어진다. \"dismemberment(분할)\"이다. 이 낱말은 얄타에서 넣었으며 EAC의 관할 밖에서 이루어진 일이다", "EAC가 넘긴 수정안에 들어간 것은 프랑스를 넷째 당사국으로 넣는 것뿐이고 \"분할\"이라는 낱말은 들어 있지 않다", "소련이 시간을 끈다. 위넌트가 4월 12일 분할위원회(이든·구세프·위넌트 셋뿐)에서 프랑스에 알리는 문제를 제기했으나 러시아 측은 알리는 데 동의한 적이 없다", "3월 29일자 제3278호에 담긴 구세프의 대이든 서한이다. 소련 정부는 크림회담의 분할 결정을 독일 분할의 의무적 계획이 아니라, 다른 수단이 불충분한 것으로 드러날 경우 독일을 무해하게 만들 목적으로 압력을 행사할 하나의 가능성으로 이해한다", "위넌트의 논거: 해당 조항에 그냥 \"분할\"이라는 낱말을 넣으면 그것은 어떤 의미에서 강행적(mandatory)이 된다. 매슈스: 그것은 의도가 아니었다. 4개 정부에 대해 강행적인 것이 아니라, 4개 정부가 분할하기로 결정할 경우 독일에 대해 강행적이라는 뜻이다", "영국은 오늘로서는 \"분할\" 대신 \"필요하다면, 분할(if necessary, dismemberment)\"이라는 어구를 선호한다. 매슈스는 얄타에서 합의된 형태가 아니며 러시아가 반대할 수 있으니 합의한 대로 고수하는 게 낫겠다고 답한다", "결론이다. 선언에는 \"분할\"을 넣을 필요가 없다고 보되, 러시아가 고집하면 별개다. 그리고 러시아가 그 낱말을 원한다면 프랑스에 알리는 일도 러시아가 하게 해야 한다", "독일 통제기구 요약본 공표 문제다. 육군부가 공표하고 싶어 하나, 구세프는 본국의 재량을 아직 받지 못했고 다른 연합국 정부들에 먼저 알리기 전에는 공표하지 않기로 영·프·미가 뜻을 같이했다", "위넌트는 러시아어를 아는 모즐리를 SHAEF로 보내 러시아어 본문을 읽을 수 있는 사람이 그곳에 있게 하겠다고 제안하고 매슈스가 동의한다"], "primary": "1945년 5월 4일\n\n[발췌]\n\n위넌트 씨: 항복문서(Surrender Instrument)에 관하여 말씀드리고자 했습니다. 연합참모본부를 통하여 SHAEF로 사본이 보내졌는지 여쭙고 싶었습니다.\n\n매슈스 씨: 항복문서의 사본 말입니까?\n\n위넌트 씨: 그렇습니다. 제가 알기로 그들이 가지고 있는 사본이라고는 우리가 유럽자문위원회로부터 그들에게 보내 준 것뿐입니다. 그 문서의 변경에 관하여 어떤 조치가 취해졌는지 여쭙고 싶었습니다. 우리가 프랑스를 넷째 당사국(fourth Power)으로 넣었을 때 말입니다.\n\nM. 귀하가 보냈다고 하신 원본의 사본을 우리는 아직 받지 못했습니다.\n\nW. 몇 달 전에 우리는 원(原)항복문서를 귀하에게 보냈습니다. 최근 며칠 사이에는 프랑스를 넷째 당사국으로 넣는 그 문서의 수정안을 귀하에게 보냈습니다.\n\n[267면]\n\nM. 그렇습니다. 그런데 원본에 관한 한, 우리가 아직 받지 못한 것은 바로 그 수정안입니다.\n\nW. 알겠습니다. 수정안이 들어간 이 문서는 유럽자문위원회에서 마련된 다음, 수락과 조치를 위하여 우리 각국 정부에 보내진 것입니다.\n\nM. 그렇습니다. 최근의 수정안은 원본으로는 받지 못했습니다. 받는 대로 보내겠습니다.\n\nW. 원본 문서 자체가 귀하 쪽에서 SHAEF로 보내진 적이 한 번이라도 있는지 궁금합니다.\n\nM. 아닙니다, 원본은 아닙니다. 사본은 합동참모본부로 보내진 것으로 압니다.\n\nW. 그렇군요. 연합참모본부가 원본 문서를 SHAEF로 보낸 적이 있는지 저는 확신하지 못하겠습니다.\n\nM. 기꺼이 알아보고 그들이 보냈는지 아닌지 확인하겠습니다.\n\nW. 그 문서는 수정안과 함께 연합참모본부가 SHAEF로 보내야 합니다.\n\nM. 그렇습니다. 그것을 아주 기꺼이 알아보고, CCS가 SHAEF로 보냈는지 확인하겠습니다.\n\nW. 그렇습니다. 제가 알기로는 그것이 이루어지지 않았습니다.\n\nM. 물론 정부 간 협정으로서의 실제 원본은 국무부 문서고에 보관될 것입니다만, 그 사본은 CCS가 보냈어야 합니다.\n\nW. 그렇습니다, 그것이 이루어졌어야 한다고 봅니다. 이루어졌을 수도 있으나, 제가 알기로는 이루어지지 않았습니다.\n\nM. 그들이 당장 보내도록 할 수 있는지 알아보겠습니다.\n\nW. 그리고 \\\"분할(dismemberment)\\\"이라는 낱말을 넣음으로써 이루어진 그 문서의 수정은 얄타에서 이루어졌고 유럽자문위원회의 관할 밖에 있는 일이었습니다. 제가 아는 한 러시아 측은 프랑스에 통고하는 데 결코 동의한 바가 없습니다.\n\nM. 그 변경에 대하여 말입니까?\n\nW. 그렇습니다. 프랑스 측은 파리에서 우리 쪽 캐퍼리를 통하여 통보받은 것으로 압니다.\n\nM. 러시아 측이 EAC에서 프랑스에 알리는 데 동의한 적이 없다는 말씀입니까?\n\nW. 그게, 그들은 그 특별위원회에서 동의하지 않았습니다. 그들은 분할위원회에서 동의하지 않았고, 제가 그 논점을 제기한 것이 바로 거기입니다. 그 위원회는 이든과 구세프와 저로만 한정된 위원회입니다.\n\nM. 그러나 저는 그 \\\"분할\\\"이라는 낱말이 들어간 항복문서 수정안이 네 위원을 가진 EAC의 승인을 받은 것으로 생각했습니다.\n\nW. 잘 알아듣지 못했습니다, 닥(Doc). 제가 말씀드리려 한 것을 다시 말씀드리겠습니다. 저는 프랑스에 알리는 문제를 4월 12일 [268면] 분할에 관한 특별위원회에서 제기했습니다. 그 위원회는 이든과 구세프와 저로 구성되어 있습니다. 우리 각자는 그 문제를 검토해 보기로 동의했습니다만, 제가 아는 한 러시아 측은 프랑스에 통고하는 데 결코 동의한 바가 없습니다.\n\nM. 즉, 그들은 \\\"분할\\\"이라는 낱말을 넣은 것을 프랑스에 통고하는 데 결코 동의한 적이 없다는 말씀이지요?\n\nW. 그렇습니다.\n\nM. 그러나 저는 이제 네 위원을 가지게 된 EAC가, 귀하가 우리에게 보낸 항복문서에 \\\"분할\\\"이라는 낱말을 넣는 것을 승인했다고 생각했습니다.\n\nW. 아닙니다, 그렇지 않습니다. 유일한 추가는 프랑스를 넷째 당사국으로 넣는 것뿐입니다.\n\nM. 그렇군요. 거기에 \\\"분할\\\"이라는 낱말은 들어 있지 않다는 말씀이지요?\n\nW. \\\"분할\\\"이라는 낱말은 들어 있지 않습니다. 그리고 저는 그 점에 관하여도 분명한 양해가 있어야 한다고 생각했습니다. \\\"우리는 지금 항복문서의 대체물로 쓰일 수도 있는 선언(proclamation)을 작업하고 있습니다. 저는 항복문서가 그 선언보다 우리에게 더 단단한 법적 기초를 준다는 것이 양해되어야 한다고 봅니다. 그 점이 양해되어야 한다고 생각합니다. 우리가 이미 합의를 얻어 놓은 전문(前文)을 붙인 그 선언을 사용한다면, \\\"분할\\\"이라는 낱말을 넣을 필요는 없다고 봅니다.\n\nM. 그것이 러시아 측에 받아들여질 수 있겠습니까?\n\nW. 왜냐하면 우리는 전문에서 지위나 경계를 변경할 권리를 유보하고 있기 때문입니다. 만일 귀하가 항복문서를 사용하고자 하신다면, 그것이 즉시 SHAEF에 전달되기를 바라시게 될지도 모릅니다. 이곳에는 프랑스를 넷째 당사국으로 넣은 사본이 준비되어 있고, \\\"분할\\\"이라는 낱말이 들어간 사본과 들어가지 않은 사본이 다 있습니다. 또한 이곳에는 그것을 아주 짧은 시간 안에 SHAEF로 가져다줄 수 있는 항공기도 한 대 있습니다.\n\nM. 말씀을 들으니, SHAEF는 이미 귀하 쪽으로부터 사본을 받았으나 CCS로부터는 받지 못했다는 것으로 이해됩니다만?\n\nW. 그렇습니다. 그것은 우리가 마련하였고 몇 달 전에 정부 간 합의가 이루어진 원본 문서의 사본입니다. 그러나 제가 알기로 그들은 그 뒤로 각국 정부로부터 아무것도 받지 못했습니다. 그리고 수정안이 나온 뒤로 우리에게서도 아무것도 받지 못했습니다.\n\nM. 그렇다면 귀하가 그것을 즉시 SHAEF로 보내시는 것이 현명한 예방책이 되겠다고 생각합니다.\n\nW. 저는 본국 정부와 그 밖의 정부들이 프랑스를 넷째 당사국으로 넣는 것을 승인했는지, 또한 \\\"분할\\\"이라는 낱말을 넣는 것에 관하여 각국 정부의 태도가 어떠한지를 확실히 해 두고 싶습니다. 아시다시피 유럽자문위원회는 어디까지나 자문 기관일 뿐입니다. 그래서 저는 조치를 취하기 전에 권한을 얻고자 합니다.\n\n[269면]\n\nM. 그렇다면 이렇게 말씀드릴 수 있습니다. 세 정부는 얄타에서 프랑스를 넷째 당사국으로 넣는 것과 \\\"분할\\\"이라는 낱말을 사용하는 것에 분명하게 합의하였습니다.\n\nW. 그 사실과 \\\"분할\\\"이라는 낱말을 넣은 것을 프랑스에 알리는 문제에 관하여 제가 러시아 측과 이야기해도 되겠습니까?\n\nM. 그렇게 하십시오.\n\nW. 우리가 조치를 취하기 전에 제가 그것을 구세프와 논의해야 한다고 봅니다. 그 점에 동의하시겠습니까? M. 그렇습니다, 동의합니다.\n\nW. 영국 측은 오늘로서는 \\\"분할\\\"이라는 낱말 대신에 \\\"필요하다면, 분할(if necessary, dismemberment)\\\"이라는 어구를 쓰는 것을 선호합니다.\n\nM. 글쎄요, 그것은 얄타에서 합의된 형태가 아니었습니다. 그리고 러시아 측이 거기에 반대할 수도 있다고 생각합니다.\n\nW. 알겠습니다.\n\nM. 우리는 거기서 합의한 바를 고수하는 편이 낫겠다고 생각합니다.\n\nW. 3월 29일자 귀하 앞 저의 전문 제3278호를 보셨는지 궁금합니다. 그것은 분할위원회의 입장을 진술한 것입니다. 그리고 그 전보 안의 진술은 합의된 것입니다. 그것은 구세프가 진술한 바와 같은, 분할에 관한 소련 측의 해석을 보여 줍니다.\n\nM. 그렇습니다. \\\"분할\\\"을 넣은 배경은, 우리가 원한다면 독일을 상대하면서 분할할 권리를 갖게 되리라는 것을 독일인들에게 보이려는 데 있었습니다.\n\nW. 저는 이것이 매우 중요하다고 봅니다. 그 전문에서 구세프는 이든에게, 소련 정부는 독일의 분할에 관한 크림회담의 결정을 독일 분할의 의무적 계획으로서가 아니라, 다른 수단이 불충분한 것으로 드러날 경우 독일을 무해하게 만들 목적으로 독일에 압력을 행사할 하나의 가능성으로 이해한다고 진술하고 있습니다. 만일 귀하가 그 낱말이 놓이기로 되어 있던 바로 그 조항에 \\\"분할\\\"이라는 낱말을 그냥 넣는다면, 그것은 어떤 의미에서 강행적(mandatory)인 것이 됩니다.\n\nM. 그것은 의도한 바가 아니었습니다.\n\nW. 그리고 그것을 한정할 수 있는 유일한 것은 뒤따르는 문장뿐입니다. 그것은 \\\"그들이 장래의 평화와 안전을 위하여 필요하다고 인정하는 바에 따라\\\"라고 되어 있습니다.\n\nM. 제 기억으로 그것은 같은 문장의 일부입니다.\n\nW. 그렇습니다. 다만 제가 방금 인용해 드린, 구세프가 이든에게 쓴 서한의 그 문단과 관련하여 새로운 판단을 얻으실 수 있도록 그 대목을 다시 한 번 읽어 보시기를 바랍니다. 저는 귀하가 스테티니어스 씨에게 전화를 걸어 그로 하여금 이든 및 몰로토프와 그 문제를 논의하게 하고 싶으실지도 모른다고 생각했습니다.\n\nM. 그러면 제가 배경을 말씀드리겠습니다. 그 낱말은 네 정부에 대하여 강행적인 것으로서가 아니라, 네 정부가 분할하기로 결정할 경우 [270면] 독일인들에 대하여 강행적인 것으로서 거기에 넣어진 것입니다. 그리고 그것은 세 정부의 정식 합의에 의하여 거기에 넣어졌습니다. 우리가 그것을 되돌려 바꿀 수는 없다고 봅니다.\n\nW. 알겠습니다. 이제 문제는 우리가 그것을 그 선언에 넣어야 하는가 하는 것입니다. 저는 그럴 필요가 있는지 의심스럽습니다.\n\nM. 러시아 측이 그것을 고집하지 않는 한, 그것이 필요하다고는 생각하지 않습니다.\n\nW. 지금까지 아무런 고집도 없었고 그에 대한 언급도 없었습니다.\n\nM. 그렇다면 저라면 언급하지 않겠습니다. 그것으로 충분하다고 봅니다.\n\nW. 좋습니다, 닥.[주11] 다른 한 가지에 관하여도 말씀드리고자 했습니다. 귀하가 독일의 통제기구에 관한 요약본을 공표하고 싶어 하신다는 전문[주12]을 받았습니다.\n\nM. 그것을 공표하고자 하는 것은 육군부입니다.\n\nW. 그렇군요. 우리는 다른 연합국 정부들에 줄 요약본을 이제 막 마련해 놓았습니다. 그런데 구세프는 자기 정부가 그것을 허용할 재량을 아직 자신에게 주지 않았다고 우리에게 말했습니다. 그리고 우리 나머지는 다른 연합국 정부들에 알리기 전에는, 그들에게 그와 비슷한 문서를 주기 전에는 요약본을 공표해서는 안 된다고 봅니다.\n\nM. 그것이 아주 온당하다고 생각합니다. 우리가 귀하와 협의한 것은, 독일에 관한 계획이 무엇인지 알고자 하는 여론이 매우 강해지고 있다고 육군부가 느꼈기 때문입니다. 그래서 이쪽에서는 무엇인가를 공표하는 것이 바람직하겠다는 것입니다. 우리는 다른 당사자들과의 협의 없이는 아무것도 공표되어서는 안 된다는 입장을 취했습니다. 그래서 귀하에게 그 전보를 보낸 것입니다.\n\nW. 영국과 프랑스와 우리는 그 점에 뜻을 같이하고 있습니다. 구세프는 자기 정부로부터 회신을 들을 때까지 다른 연합국 정부들에 요약본을 주는 것을 미루어 달라고 요청했습니다. 그리고 그것이 이루어지면, 그는 또한 그때에 비슷한 요약본의 공표를 허용해 달라고 자기 정부에 요청해 두었습니다. 앞으로 사나흘 안에 그에 관하여 무슨 소식을 전해 드릴 수 있기를 바랍니다.\n\nM. 그러면 괜찮겠다고 생각합니다.\n\n. . . . . . .\n\nW. 잠깐만요, 닥. 방금 이곳에서 모즐리와 이야기를 나누었습니다. 그는 우리가 러시아 측에 알리고 그들이 프랑스에 알리는 데 동의하기 전에는 \\\"분할\\\"이라는 낱말을 항복문서에 넣어서는 안 된다고 봅니다.\n\nM. 그렇습니다. 그들이 프랑스에 알려야 한다는 데에는 저도 동의합니다. 그러나 그것을 넣는다는 결정은 세 정부의 정식 결정이었습니다. 그렇더라도 우리는 EAC의 넷째 구성체인 프랑스에 알려야 합니다.\n\nW. 러시아 측은 아직 프랑스에 알리는 데 동의하지 않았습니다.\n\n[271면]\n\nM. 그러면 우리가 그것을 고집해야 한다고 봅니다. 그들이 그 \\\"분할\\\"이라는 낱말이 들어가기를 원한다면, 우리는 그들이 그것을 프랑스에 통보하게 해야 합니다.\n\nW. 그것이 제가 취할 입장입니다. 또 한 가지가 있습니다. 만일 항복문서의 문제가 제기되거나 선언의 발포 문제가 제기될 경우, 저는 모즐리에게 SHAEF로 건너가 그들을 돕게 하면 어떨까 생각했습니다. 그가 러시아어를 알기 때문입니다. 러시아어 본문을 읽을 수 있는 사람이 그곳에 있어야 한다고 봅니다.\n\nM. 그것은 우리에게 아주 만족스러운 일이 되겠습니다.\n\nW. 좋습니다, 닥. 대단히 고맙습니다.\n\nM. 안녕히 계십시오.\n\nW. 안녕히 계십시오.", "secondary": "May 4, 1945\n\n[Extracts]\n\nMr. Winant: I wanted to talk to you about the Surrender Instrument. I wanted to ask you if copies had been sent through the Combined Chiefs of Staff to SHAEF?\n\nMr. Matthews: Copies of the Surrender Instrument?\n\nMr. Winant: Yes. My understanding is that the only copies that they have we forwarded to them from the European Advisory Commission. I wanted to ask you what had been done about the changes in the Instrument? When we added France as a fourth Power?\n\nM. We have not received your copies yet of the original, which you said you have forwarded.\n\nW. Months ago we sent you the original Instrument. Within the last few days we have sent you the amendments to the Instrument which add France as a fourth Power.\n\n[267면]\n\nM. Yes. Well, it’s the amendments which we have not yet received, as far as the original copies are concerned.\n\nW. I understand. This document with the amendments was worked out in the European Advisory Commission and then forwarded to our respective Governments for acceptance and action.\n\nM. Yes. The recent amendments have not been received in the original. They will be forwarded as soon as they are received.\n\nW. I wondered if the original document itself had ever been forwarded to SHAEF by you?\n\nM. No, not the original. I think copies were forwarded to the JCS.\n\nW. I see. I’m not certain that the Combined Chiefs of Staff have ever forwarded the original document to SHAEF.\n\nM. I will be glad to look into this and see whether they have or not.\n\nW. That document should be forwarded by the Combined Chiefs of Staff, with the amendments, to SHAEF.\n\nM. Yes. I’ll be very glad to look into that, and see if they have been forwarded by the CCS to SHAEF.\n\nW. That’s right. I understand that that has not been done.\n\nM. Of course the actual original, as a government agreement, would be retained in the Department’s archives, but copies of it should have been forwarded by CCS.\n\nW. Yes, I think that should have been done. It may have been done, but I understand it has not been done.\n\nM. I will see if we can get them to send them right away.\n\nW. Then the amendment to the Instrument by the addition of the word “dismemberment” was accomplished at Yalta and was entirely outside of the jurisdiction of the European Advisory Commission. So far as I know the Russians have never agreed to notify the French.\n\nM. Of the change?\n\nW. Yes. I understand that the French were informed through Caffery, by us in Paris.\n\nM. The Russians have never agreed in the EAC to inform the French?\n\nW. Well, they didn’t agree in that special committee. They didn’t agree in the Dismemberment Committee, where I raised the point. That is the committee which is limited to Eden, Gousev and myself.\n\nM. But I thought the amendment to the Surrender Instrument, which contained that word “dismemberment” had been approved by the EAC with its four members.\n\nW. I couldn’t get that, Doc. I’d like to restate what I was trying to say to you. I raised the point of informing the French in the [268면] special Committee on Dismemberment on April 12. That committee is composed of Eden, Gousev and myself. Each of us agreed to take the matter under consideration, but so far as I know, the Russians have never agreed to notify the French.\n\nM. That is, they have never agreed to notify the French of the addition of the word “dismemberment”?\n\nW. That’s right.\n\nM. But I thought that the EAC, which now has four members, had approved the addition of the word ‘dismemberment’ in the Surrender Instrument that you have forwarded to us.\n\nW. No, it does not. The only addition is to include the French as the fourth Power.\n\nM. I see. It does not include the word “dismemberment”?\n\nW. It does not include the word “dismemberment”. And I thought that there should be a clear understanding on that also. “We are now working on the proclamation, which might be used as a substitute for the Surrender Instrument. I believe it should be understood that the Surrender Instrument gives us a firmer legal base than the proclamation. I think that should be understood. If we use the proclamation with the preamble on which we have gotten agreement, I do not think you need to include the word “dismemberment”.\n\nM. Is that acceptable to the Russians?\n\nW. Because we reserve the right to change the status or boundaries in the preamble. It might be, if you wanted to use the Surrender Instrument, that you would want it immediately communicated to SHAEF. We have copies of it ready here, with the inclusion of the French as a fourth Power, and copies with and without the word “dismemberment”. We have, also, a plane here which could get it to SHAEF within a very short time.\n\nM. As I understand from what you say, SHAEF has already received copies from you, but not from the CCS?\n\nW. Yes, sir. That’s copies of the original document which we have worked out and on which there was governmental agreement some months ago. But they have received nothing, as I understand it, since, from the Governments. And they have received nothing from us since the amendment.\n\nM. Then I should think it would be a wise precaution for you to send it to SHAEF immediately.\n\nW. I want to be sure that the Government at home and the other Governments have approved of the inclusion of France as a fourth Power and, also, what the attitude of the Governments is in relation to the inclusion of the word “dismemberment”. Because, you see, the European Advisory Commission is simply advisory. And I would like to get authority before I take action.\n\n[269면]\n\nM. Well, I can tell you that the three Governments definitely agreed at Yalta to the inclusion of France as a fourth Power and to the use of the word “dismemberment”.\n\nW. May I talk to the Russians about informing the French of that fact and the inclusion of the word “dismemberment”?\n\nM. Yes.\n\nW. I think I should take that up with Gousev before we take action. Would you agree to that? M. Yes, we would agree.\n\nW. The British would prefer today the use of—in place of the word “dismemberment”—the phrase “if necessary, dismemberment”.\n\nM. Well, that was not the form in which it was agreed at Yalta. And I think the Russians might object to that.\n\nW. I understand.\n\nM. I think we had better stick by what we agreed there.\n\nW. I wonder if you have seen my message to you, 3278 of March 29? It states the position of the Committee on Dismemberment. And the statement within that cable was agreed upon. It shows the Soviet interpretation in relation to dismemberment as stated by Gousev.\n\nM. Yes. The background of the inclusion of “dismemberment” was to show the Germans we would have the right in dealing with the Germans to dismember if we wish to.\n\nW. I think it is very important because in that message Gousev states to Eden that the Soviet Government understand the decision of the Crimea Conference, regarding the dismemberment of Germany, not as an obligatory plan for the dismemberment of Germany, but as a possibility for exerting pressure on Germany with the object of rendering her harmless in the event of other means proving inadequate. If you would simply include the word “dismemberment” in the particular article where it was to be placed, it is in a sense mandatory.\n\nM. That was not the intention.\n\nW. And its only possible qualification is in the sentence that follows. That reads, “as they deem requisite for future peace and security”.\n\nM. That is part of the same sentence as I recall it.\n\nW. That is right. I’d just like you to read that over in order to get a fresh judgment on it, in relation to the paragraph in the letter that Gousev wrote to Eden, which I have just quoted to you. I thought you might want to call up Mr. Stettinius and perhaps have him discuss the problem with Eden and Molotov.\n\nM. Well, I can give you the background. That word was put in there, not as mandatory on the four Governments, but mandatory [270면] upon the Germans if the four Governments decided to dismember. And it was put in there by formal agreement of the three Governments. I don’t think we can go back and change that.\n\nW. I understand. Now the question is, whether we have to include it in the proclamation. I doubt if we do.\n\nM. I don’t think that is necessary, unless the Russians insist on it.\n\nW. So far there has been no insistence and no mention of it.\n\nM. Then I would not mention it. I think that’s good enough.\n\nW. All right, Doc. [주11] I wanted to talk to you about one other thing. I got a message [주12] saying you’d like to publish summary of the control machinery in Germany.\n\nM. That’s the War Department that wants to publish it.\n\nW. Yes. We have just worked out a summary to be given to the other Allied governments. And Gousev has told us that his government has not yet given him freedom of action to permit that. And the rest of us feel that we should not publish a summary until we have informed, until we have given some similar document to the other Allied governments.\n\nM. I think that is quite proper. We consulted you because the War Department felt that public opinion is becoming so strong to know what plans are with regard to Germany. And it would be advisable over here to publish something. We took the position that nothing should be published without consultation with the other parties. That is why we sent you the telegram.\n\nW. The British, the French and ourselves are in agreement on that. Gousev has asked to delay until—delay giving a summary to the other Allied governments until he hears from his government. Then, if that’s done, and he has also asked his government when that is done to permit publication of a similar summary. And I hope to give you some word on it in the next three or four days.\n\nM. Well, I think that would be all right, sir.\n\n. . . . . . .\n\nW. Just a minute, Doc. I was just talking with Mosely here. He feels that we shouldn’t put the word “dismemberment” into the surrender instrument until we have told the Russians and they have agreed to tell the French.\n\nM. Yes. Well, I agree that they should tell the French. But the decision to include it was a formal decision by the three governments. But we should tell the French as the fourth body to the EAC.\n\nW. The Russians haven’t as yet agreed to tell the French.\n\n[271면]\n\nM. Well, I think that we should insist on that. If they want the word “dismemberment” in that we should let them inform the French of it.\n\nW. That is the position I will take. One other thing. I thought if the question of the surrender instrument came up, or if the question of the issuance of the proclamation was to come up, I would ask Mosely to go over to SHAEF in order that he might help them, because of his knowledge of the Russian language. I believe we should have somebody there who can read the Russian text.\n\nM. That will be quite satisfactory to us.\n\nW. All right, Doc. Thank you ever so much.\n\nM. Good-bye.\n\nW. Good-bye.", "notes": ["[주10] 런던발 1945년 10월 3일자 공문 제25876호로 국무부에 송부됨. 인쇄하지 않음. 이 통화 기록 중 오스트리아 문제를 다룬 또 다른 발췌는 115면을 볼 것.", "[주11] 이 어구부터 전화 통화의 기록은 740.00119 Control (Germany)/5–445 로 별도 편철된 같은 통화의 다른 녹취록에서 이어진다.", "[주12] 런던 앞 1945년 5월 2일자 전보 제3450호. 인쇄하지 않음. 279면 각주 30을 볼 것."], "warn": true, "pages": ["267", "268", "269", "270", "271"], "search": "위넌트(John G. Winant) — 주영대사, EAC 미국 대표. 기록에서 \"W.\" 매슈스(H. Freeman Matthews) — 국무부 유럽국장. 기록에서 \"M.\", 위넌트가 \"Doc\"이라 부른다 구세프(Fedor T. Gousev) — EAC 소련 대표 이든(Anthony Eden) — 영국 외무장관 스테티니어스(Edward R. Stettinius, Jr.) — 국무장관 몰로토프(Vyacheslav M. Molotov) — 소련 외무인민위원 캐퍼리(Jefferson Caffery) — 주프랑스대사 모즐리(Philip E. Mosely) — EAC 미국 대표단 정치고문"}, {"id": "d213", "order": 213, "date": "1945-05-04", "group": "D", "eyebrow": "d213 · The Assistant Chief of the Division of British Commonwealth Affairs (Parsons) to the Ambassador in Canada (Atherton)", "title": "영연방문제과 차석과장(파슨스)이 주캐나다 대사(애서턴)에게", "badge": null, "list_right": "문서 213", "meta": [{"k": "일자", "v": "1945-05-04"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.0011 EW/5–445", "txt": true}, {"k": "발신", "v": "파슨스(J. Graham Parsons) — 영연방문제과 차석과장(Assistant Chief of the Division of British Commonwealth Affairs)", "txt": true}, {"k": "수신", "v": "애서턴(Ray Atherton) — 주캐나다 대사(Ambassador in Canada)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "서한"}], "links": [{"k": "FRUS", "text": "문서 213 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d213"}], "summary": "독일 항복문서와 그에 근거한 선언문에서 캐나다의 군사적 기여를 어떻게 인정할 것인가를 둘러싼 캐나다의 불만과, 유럽자문위원회 넉 나라의 권한을 다른 참전국의 위임에 걸리게 하려는 스트랭의 막판 수정안에 미국이 반대하는 이유를 설명한 사신이다.", "points": ["피어슨과 리드가 여러 달에 걸쳐 독일 항복문서 및 관련 문서의 수정을 얻어내려 애써 왔으며, 캐나다의 자존심이 깊이 걸려 있고 오타와 정부 상층부에 상당한 감정이 쌓여 있다.", "캐나다는 미국의 입장을 거의 전적으로 유럽자문위원회의 영국 대표를 통해서만 전해 들었고, 그 결과 미국이 이 불만족스러운 상황의 책임을 대부분 뒤집어쓰고 있다.", "「이 열한 시」에 스트랭이 EAC 교섭에 돌연 수정안을 들이밀었다. 승리에 군사적으로 기여한 모든 연합국이 EAC 네 개 회원국의 항복 선언문 서명을 「수권(授權)」하는 형식으로 바꾸자는 것이다. 그는 자치령들과 인도를 대변하고 있음이 분명하다.", "프랑스는 이에 동조하고 소련은 수정안을 모스크바로 회부하기만 하여, 영국은 자치령들에 대하여 부러운 처지가 되고 미국은 난처해졌다.", "미국이 위넌트 대사에게 통보한 세 가지: (1) 캐나다 등 병력 기여국이 항복문서와 그에 근거한 선언문의 문안을 열람하는 데 찬성, (2) 그들의 가입(adherence)을 초청하는 데 동의, (3) 선언문에서 독일 격파에 병력을 기여한 다른 국가들을 더 구체적으로 언명하는 데 반대하지 않음.", "문안 수정에는 매우 실제적으로 반대한다. EAC 4개국이 다른 국가들의 「권한으로」 행동한다는 형식은 앞으로의 모든 결정에 그 국가들의 동의를 받아야 함을 함축하게 되며, 이미 복잡하고 어려운 4개국 군정에 다시 네댓 나라의 동의 요건을 더하면 거의 불가능해진다."], "primary": "워싱턴, 1945년 5월 4일.\n\n레이 귀하: 여러 달에 걸쳐(원문 「Qver」[sic]) 마이크 피어슨(Lester B. Pearson)[주13] 이, 그리고 그 뒤를 이어 에스코트 리드(Escott Reid)[주14] 가, 캐나다의 군사적 기여가 더 큰 인정을 받을 수 있도록 독일 항복문서 및 관련 문서들의 수정을 얻어내고자 애써 왔습니다. 짐작하시겠지만 캐나다의 자존심이 깊이 걸린 문제이며, 오타와의 정부 상층부에 상당한 감정이 쌓여 있는 것도 의심할 여지가 없습니다. 더욱이 사태가 진행되면서, 캐나다인들이 여전히 매우 불만족스럽다고 여기는 이 상황에 대한 책임을 우리가 대부분 떠안게 된 것으로 짐작합니다.\n\n지미 던(Jimmy Dunn)과 오간 한 차례의 서한 교환을 빼면, 캐나다 측이 우리 입장에 대하여 가진 관념은 거의 전적으로 EAC의 영국 대표를 통해 얻은 것이라고 나는 봅니다. 다시 말해, 이것은 오타와의 한쪽 학파가 「미국이 또다시 캐나다를 영국의 품으로 밀어 넣고 있다」고 불평할 수 있고, 다른 쪽 학파는 「이런 문제에서는 캐나다가 영국과 발을 맞추어야 한다는 우리 견해가 옳다」고 다시 말할 수 있는 상황 하나가 더 생긴 것이 아닌가 걱정됩니다.\n\n이 열한 시(at this eleventh hour)에 스트랭(Sir William Strang)이 EAC 교섭에 돌연 수정안 하나를 집어넣었습니다. 승리에 군사적으로 기여하는 모든 연합국이 EAC 4개 회원국의 항복 선언문 서명을 수권(authorize)하도록 하자는 것입니다. 그가 자치령들과 인도를 대변하여 말하고 있다는 것은 뚜렷이 드러났습니다. 캐나다인들이 누구보다도 그를 밀고 있음이 틀림없습니다.\n\n[272면]\n\n스트랭이 자기 수정안이 통과되리라는 희망을 조금이라도 가졌으리라고는 생각하기 어렵습니다. 그러나 분명히 그것은 영국을 자치령들에 대하여 부러운 자리에 놓아 주고, 우리는 난처한 자리에 놓기 십상입니다 — 더구나 프랑스가 이에 동조하였고 러시아 측은 그 수정안을 모스크바로 회부하기만 하였으니 더욱 그렇습니다.\n\n이 문제에 관하여 우리는 훌륭하고 건전한 입장을 갖고 있습니다. 나는 그것이 영국을 통해서만 캐나다인들에게 걸러져 전해져서는 안 된다고 봅니다. 그래서 나는 귀하께 보내는 이 편지의 승인을 구하고 있습니다. 귀하께서 오타와의 적절한 자리에 우리 입장의 이유와 캐나다의 입장에 대한 우리의 공감을 기록으로 남겨 주실 수 있도록 말입니다. 내가 샌프란시스코[주16] 에 있는 잭[주15] 에게 쓰지 않고 귀하께 쓰는 것은 — 그가 그곳에서 수상[주17] 과 노먼[주18] 에게 말할 수 있음에도 — 캐나다에 대한 이 몸짓이 중요하기는 하나, 캐나다인들이 우리 입장의 수정을 다시 밀어붙일 수 있는 별도의 통로를 열어 주고 싶지는 않기 때문입니다.\n\n스트랭의 수정안에 대한 답으로 우리는 위넌트 대사에게 이렇게 통보하였습니다. (1) 캐나다와 그 밖에 병력을 기여한 나라들이 항복문서와 그에 근거한 선언문의 문안을 열람하도록 하는 데 찬성한다, (2) 그들의 가입(adherence)을 초청하는 데 동의한다, (3) 독일의 패배에 병력을 기여한 다른 국가들을 선언문에서 더 구체적으로 인정하는 데는 반대하지 않겠다.\n\n그러나 우리는 EAC 4개국이 다른 국가들의 권한으로 행동하게 되도록 문안을 고치는 데는 매우 실제적인 반대 이유가 있습니다. 그러한 입장은 앞으로의 모든 결정에서 우리가 그 다른 국가들의 동의를 얻어야 함을 함축하게 됩니다. 네 나라가 나누어 맡는 군정의 과업은 그 자체로도 충분히 복잡하고 어려운데, 거기에 넷 또는 다섯 나라의 동의라는 요건을 더할 필요는 없습니다. 이미 어렵고 가시밭 같은 과업을 거의 불가능하게 만들리라는 데에는 웬만큼 사리 있는 사람이면 누구나 동의하리라고 우리는 봅니다. 또 그 어려움을 아는 사람들, 그리고 굳이 끼어들 필요가 없는 사람들 가운데 위신 때문이 아니라면 정말로 끼어들고 싶어 할 이가 많을지도 의심스럽습니다.\n\n위에 번호를 붙인 세 가지 항목을, 캐나다의 입장에 대한 우리의 이해의 표시로서, 또 그들이 [273면] 정당하게 누릴 자격이 있는 인정을 그들에게 주고자 하는 우리의 뜻으로서 귀하께서 강조해 주신다면 매우 도움이 되리라 생각합니다. 배경을 아시고, 우리로부터 직접 말이 없을 때 우리 입장이 캐나다인들에게 어떻게 비칠지를 이해하시는 귀하의 한마디는 분명한 이점이 될 것입니다.\n\n경구,\n\nJ. 그레이엄 파슨스(J. Graham Parsons)", "secondary": "Washington, May 4, 1945.\n\nDear Ray: Qver many months Mike Pearson [주13] with Escott Reid [주14] following up has been endeavoring to secure a modification of the surrender instrument for Germany and related documents so that the military contribution of Canada to the victory might receive greater recognition. As you can imagine, Canadian pride is deeply involved and no doubt there has been considerable feeling in high government circles in Ottawa. I gather, furthermore, that as the matter has developed we have acquired most of the responsibility in Canadian eyes for what they still consider to be a highly unsatisfactory situation.\n\nAside from one exchange of letters with Jimmy Dunn, the Canadian conception of our position has, I believe, been gained almost entirely through the British representative on the EAC. In other words, I fear that this is one more situation in which one school at Ottawa can complain that again we are driving Canada into the arms of the British and the other school can again say that their view is right that Canada should line up with the British on matters of this kind.\n\nAt this eleventh hour Strang has suddenly introduced into the EAC negotiations an amendment whereby all the allies contributing militarily to the victory would authorize signature of the surrender proclamation by the four member powers of EAC. It has been clearly evident that he is speaking on behalf of the dominions and India. No doubt the Canadians are pushing him more than anyone.\n\n[272면]\n\nI should doubt if Strang had any hope of his amendment succeeding, but obviously it puts the British in an enviable position vis-à-vis the dominions and is likely to put us in an unenviable position especially as the French went along and the Russians simply referred the amendment to Moscow.\n\nWe have a good and sound position on this matter. I believe it should not be filtered through to the Canadians by the British alone and I am, therefore, seeking approval of this letter to you so that you may record in the proper quarters in Ottawa the reasons for our position and our sympathy for that of Canada. I am writing to you rather than to Jack [주15] at San Francisco [주16] where he could speak to the Prime Minister [주17] and to Norman, [주18] because I believe that while the gesture to Canada is important we do not want to open up a separate channel through which the Canadians could press again for a modification of our stand.\n\nIn response to Strang’s amendment, we have told Ambassador Winant that (1) we approve letting the Canadians and the others contributing military forces see the text of the surrender instrument and the proclamation based on it, (2) we agree to invite their adherence, and (3) we would not object to more specific acknowledgment in the proclamation of the other powers contributing military force to the defeat of Germany.\n\nWe have, however, a very practical objection to amending the text so that the four powers on EAC would be acting with the authority of the other powers. Such a position would imply that in all future decisions we would have to have the concurrence of the other powers. The task of military government shared by four powers is complex and difficult enough without adding a requirement for the concurrence of four or five additional powers. It seems to us that any reasonable person would agree that an already difficult and thorny task would be made well nigh impossible and we should doubt whether many who realize the difficulties and who do not have to be involved would really wish to be except for prestige reasons.\n\nI think it would be most helpful if you would emphasize the three numbered points above as a mark of our appreciation of the Canadian position and our desire to give them the recognition to which they are [273면] rightly entitled. A word from you, with your knowledge of the background and understanding of how our position might appear to the Canadians in the absence of direct word from us, should be of definite advantage.\n\nSincerely yours,\n\nJ. Graham Parsons", "notes": ["[주13] 레스터 B. 피어슨(Lester B. Pearson), 주미 캐나다 대사.", "[주14] 캐나다 대사관 1등서기관.", "[주15] 존 D. 히커슨(John D. Hickerson), 유럽국 부국장으로 추정됨.", "[주16] 1945년 4월 25일부터 6월 26일까지 열린 샌프란시스코 유엔 회의에 관한 자료는 제1권 1면 이하 참조.", "[주17] 캐나다 수상 겸 추밀원 의장 겸 외무장관 윌리엄 매켄지 킹(William Mackenzie King). 샌프란시스코 회의 캐나다 대표단 단장을 맡았다.", "[주18] 노먼 A. 로버트슨(Norman A. Robertson), 캐나다 외무차관이자 샌프란시스코 회의 캐나다 대표단 선임고문으로 추정됨."], "warn": false, "pages": ["272", "273"], "search": "J. Graham Parsons 파슨스 — 영연방문제과 차석과장 Ray Atherton 애서턴 — 주캐나다 대사 Lester B. \"Mike\" Pearson 피어슨 — 주미 캐나다 대사 Escott Reid 리드 — 캐나다 대사관 1등서기관 James C. \"Jimmy\" Dunn 던 Sir William Strang 스트랭 — EAC 영국 대표 John G. Winant 위넌트 — 주영대사 John D. Hickerson 히커슨 William Mackenzie King 매켄지 킹 — 캐나다 수상 Norman A. Robertson 로버트슨 — 캐나다 외무차관"}, {"id": "d214", "order": 214, "date": "1945-05-04", "group": "D", "eyebrow": "d214 · The Ambassador in the United Kingdom (Winant) to the Secretary of State", "title": "주영대사(위넌트)가 국무장관에게", "badge": null, "list_right": "문서 214", "meta": [{"k": "일자", "v": "1945-05-04"}, {"k": "시각", "v": "[Received May 8.]"}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "No. 22879"}, {"k": "원문출처", "v": "740.00119 E.A.C./5–445", "txt": true}, {"k": "발신", "v": "위넌트(John G. Winant) — 주영대사. 실제 서명은 대사를 대리하여 모즐리(Philip E. Mosely), 유럽자문위원회 미국 대표단 정치고문", "txt": true}, {"k": "수신", "v": "국무장관(The Secretary of State)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "서한"}], "links": [{"k": "FRUS", "text": "문서 214 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d214"}], "summary": "유럽자문위원회 의장이 연합국협의위원회 의장에게 보낸 1945년 5월 1일자 서한 사본을 송부하는 공문으로, 그 서한은 협의위원회가 제기한 질문들에 대한 위원회의 회답이자 이후 연합국 정부들과의 협의를 규율하는 훈령이다.", "points": ["동봉 서한은 1945년 5월 2일 EAC 비공식 회의에서 승인되었으며, 협의위원회가 3월 14일 보고서에서 제기한 질문들에 대한 위원회의 회답을 담고 있다.", "이 서한은 위원회가 연합국협의위원회에 내리는 훈령을 이루며, 위원회가 연합국 정부 대표들과 벌일 이후의 협의를 규율한다.", "제3항: 독일 내 점령지대에 관한 협정의 요약을 관계국 대표들에게 전달할 권한을 부여하되, 프랑스에 지대를 할당한다는 크림 회담의 결정을 고려한 1944년 9월 12일 협정 요약 초안을 제출하도록 한다.", "제4항: 독일 통제기구에 관한 협정의 요약도 마찬가지로 전달 권한을 부여하되, 통제기구에 프랑스가 참여한다는 크림 회담 결정을 고려한 1944년 11월 14일 협정 요약 초안을 제출하도록 한다.", "제7항: 벨기에·룩셈부르크·네덜란드 정부가 4개국에 외교 경로로 각서를 보내왔으므로, 그 각서를 검토할 때까지 세 정부에 대한 회답 결정을 미룬다.", "제8항: 노르웨이 정부 대표들에게는 그 제안을 적절한 군사 경로로 추진하도록 알릴 권한을 부여한다.", "제9항: 체코슬로바키아 정부의 희망은 특별한 주의를 받을 만하다는 데 위원회도 협의위원회와 견해를 같이하며 더 검토하겠다고 한다."], "primary": "제22879호\n\n런던, 1945년 5월 4일.\n[5월 8일 접수.]\n\n각하: 삼가 유럽자문위원회 의장이 E.A.C. 연합국협의위원회 의장에게 보낸 1945년 5월 1일자 서한 사본 2부를 동봉합니다. 1945년 5월 2일에 열린 비공식 회의에서 위원회가 승인한 이 서한에는, E.A.C. 연합국협의위원회가 그 보고서에서 위원회에 제기하였던 질문들에 대한 위원회의 회답이 담겨 있습니다. 그 보고서는 1945년 3월 17일자 대사관 공문 제21791호로 국무부에 송부되었습니다.\n\n동봉 서한은 위원회가 그 연합국협의위원회에 내린 훈령을 이루며, 협의위원회가 연합국 정부 대표들과 벌일 이후의 협의를 규율합니다.\n\n경구,\n\n대사를 대리하여:\n\n\n필립 E. 모즐리(Philip E. Mosely)\n\n유럽자문위원회 미국 대표단 정치고문\n\n[동봉]\n\n유럽자문위원회\n\n유럽자문위원회 의장이 연합국협의위원회 의장에게 보낸 1945년 5월 1일자 서한 사본[주19]\n\n샥신 씨 귀하: 아시는 바와 같이, 유럽자문위원회는 1945년 4월 6일과 25일에 열린 비공식 회의에서, 1945년 3월 14일 회의에서 채택되어[P12/60/45][주19a] 귀하가 1945년 3월 16일자 서한과 함께 제출한 연합국협의위원회의 보고서를 검토하였습니다.\n\n[274면]\n\n위원회는 보고서 제II부에 담긴 협의위원회의 권고들에 관하여 다음과 같은 결론에 이르렀습니다:—\n\n제3항\n\n위원회는 협의위원회가 관계 정부 대표들에게 「독일 내 점령지대에 관한 협정」의 요약을 전달할 권한을 부여하며, 프랑스에 한 지대를 할당하여야 한다는 크림 회담의 결정을 고려하여 1944년 9월 12일 협정의 요약 초안을 협의위원회가 위원회의 승인을 받도록 제출하여 주면 좋겠습니다.\n\n제4항\n\n위원회는 협의위원회가 관계 정부 대표들에게 「독일 내 통제기구에 관한 협정」의 요약을 전달할 권한을 부여하며, 통제기구에 프랑스가 참여하는 문제에 관한 크림 회담의 결정을 고려하여 1944년 11월 14일 협정의 요약 초안을 협의위원회가 위원회의 승인을 받도록 제출하여 주면 좋겠습니다.\n\n제5항 및 제6항\n\n위원회는 협의위원회의 권고를 승인합니다.\n\n제7항\n\n위원회는 벨기에·룩셈부르크·네덜란드 정부가 이 항에서 제기된 문제에 관하여 외교 경로를 통해 위원회에 대표를 두고 있는 네 정부 앞으로 각서[주20] 를 보내왔음을 통보받았습니다. 이 각서에 대한 검토가 이루어질 때까지, 위원회는 세 정부에 보낼 회답에 관한 결정을 미루기로 하였습니다.\n\n제8항\n\n위원회는 협의위원회의 권고를 승인하며, 협의위원회가 노르웨이 정부 대표들에게 그들의 제안은 적절한 군사 경로를 통하여 추진되어야 한다고 알릴 권한을 부여합니다. 아울러 협의위원회는 1945년 4월 14일 노르웨이 외무장관이 위원회 의장에게 보낸 서한[P12H/6/45][주21] 을 검토하여 그에 대한 회답에 관한 권고를 하도록 요청받습니다.\n\n[275면]\n\n제9항\n\n위원회는 이 항에서 언급된 체코슬로바키아 정부의 희망이 특별한 주의를 받을 만하다는 협의위원회의 견해에 동의하며, 이를 더 검토하겠습니다.\n\n경구,\n\n마시글리(Massigli)\n\n런던, 1945년 5월 2일.", "secondary": "No. 22879\n\nLondon, May 4, 1945.\n[Received May 8.]\n\nSir: I have the honor to enclose two copies of a letter dated May 1, 1945, from the Chairman of the European Advisory Commission to the Chairman of the Allied Consultation Committee of the E.A.C. This letter, which was approved by the Commission at an informal meeting held on May 2, 1945, contains the replies of the Commission to the questions which were raised with the Commission by the E.A.C. Allied Consultation Committee in its report, which was transmitted to the Department with the Embassy’s despatch No. 21791 of March 17, 1945.\n\nThe enclosed letter constitutes an instruction issued by the Commission to its Allied Consultation Committee, governing the Committee’s further consultation with representatives of the Allied Governments.\n\nRespectfully yours,\n\nFor the Ambassador: \n\n\nPhilip E. Mosely\n\nPolitical Adviser, U.S. Delegation European Advisory Commission\n\n[Enclosure]\n\nEuropean Advisory Commission\n\nCopy of a Letter Dated 1st May, 1945, from the Chairman, European Advisory Commission, to the Chairman, Allied Consultation Committee [주19]\n\nDear Mr. Saksin: As you are aware, the European Advisory Commission has considered, at its informal meetings held on 6th and 25th April, 1945, the report of the Allied Consultation Committee adopted at a meeting held on 14th March, 1945 [P12/60/45] [주19a] , which you submitted with your letter of 16th March,. 1945.\n\n[274면]\n\nThe Commission has reached the following conclusions on the recommendations of the Committee in Part II of its report:—\n\nParagraph 3\n\nThe Commission authorizes the Committee to communicate to the representatives of the Governments concerned a Summary of the Agreement on Zones of Occupation in Germany, and will be glad if the Committee will submit for its approval a draft Summary of the Agreement of 12th September, 1944, taking into account the decision of the Crimea Conference that a zone should be allotted to France.\n\nParagraph 4\n\nThe Commission authorizes the Committee to communicate to the representatives of the Governments concerned a Summary of the Agreement on Machinery of Control in Germany, and will be glad if the Committee will submit for its approval a draft Summary of the Agreement of 14th November, 1944, taking into account the decision of the Crimea Conference on the participation of France in the control machinery.\n\nParagraphs 5 and 6\n\nThe Commission approves the recommendations of the Committee.\n\nParagraph 7\n\nThe Commission is informed that the Belgian, Luxembourg and Netherlands Governments have addressed a Memorandum [주20] to the four Governments represented on the Commission through the diplomatic channel, on the question raised in this paragraph. Pending consideration of this Memorandum, the Commission has decided to defer a decision on the reply to be returned to the three Governments.\n\nParagraph 8\n\nThe Commission approves the recommendation of the Committee, and authorizes the Committee to inform the representatives of the Norwegian Government that their proposals should be pursued through appropriate military channels. The Committee is also invited to consider the letter addressed to the Chairman of the Commission by the Norwegian Minister of Foreign Affairs on 14th April, 1945 [P12H/6/45] [주21] and to make recommendations as to the reply to be returned to it.\n\n[275면]\n\nParagraph 9\n\nThe Commission agrees with the Committee that the wishes of the Czechoslovak Government mentioned in this paragraph deserve special attention and will give further consideration to them.\n\nYours sincerely,\n\nMassigli\n\nLondon , 2 May, 1945.", "notes": ["[주19] 수신인은 게오르기 필리포비치 샥신(Georgi Filipovich Saksin), 주런던 소련대사관 참사관이자 연합국협의위원회 소련 대표. 협의위원회 의장직은 네 대표가 돌아가며 맡았다.", "[주19a] 대괄호는 원문에 있는 것이다.", "[주20] 4월 23일 룩셈부르크발 공문 제148호, 237면 참조.", "[주21] 대괄호는 원문에 있는 것이다. 노르웨이 외무장관 서한의 요약은 4월 20일 런던발 전보 제4078호, 234면 참조."], "warn": false, "pages": ["274", "275"], "search": "John G. Winant 위넌트 — 주영대사 Philip E. Mosely 모즐리 — EAC 미국 대표단 정치고문 Georgi Filipovich Saksin 샥신 — 연합국협의위원회 소련 대표 René Massigli 마시글리 — EAC 의장(프랑스 대표)"}, {"id": "d561", "order": 561, "date": "1945-05-04", "group": "A", "eyebrow": "d561 · The Acting Secretary of State to the Minister in Sweden (Johnson)", "title": "국무장관 대리가 주스웨덴 공사(존슨)에게", "badge": null, "list_right": "문서 561", "meta": [{"k": "일자", "v": "1945-05-04"}, {"k": "시각", "v": "Washington, May 4, 1945—7 p.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "813"}, {"k": "원문출처", "v": "740.00110 EW/5–245: Telegram", "txt": true}, {"k": "발신", "v": "그루(Joseph C. Grew) — 국무장관 대리(The Acting Secretary of State)", "txt": true}, {"k": "수신", "v": "존슨(Herschel V. Johnson) — 주스웨덴 공사(The Minister in Sweden)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 561 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d561"}], "summary": "베르나도테–힘러 회담이 성급하게 공개되어 스웨덴 정부가 우려한 데 대하여 유감을 전하되, 그 누설이 미국 측에서 비롯된 것이 아님을 날짜별로 짚어 반박하라는 훈령이다.", "points": ["권터 씨에게 베르나도테–힘러 회담에 대한 성급한 보도가 스웨덴 정부에 걱정거리가 된 데 대하여 미국의 진심 어린 유감을 표하라고 지시한다.", "다만 미국과 스웨덴의 언론 자유와 국내외의 강한 관심을 감안하면 풍문의 보도를 막기란 사실상 불가능하다고 덧붙이라 한다.", "스웨덴 언론 자신이 베르나도테 백작의 활동을 여러 주에 걸쳐 크게 다루었고, 4월 24일에는 《엑스프레센》이 덴마크 주둔 독일 고위 장교들이 「권한 있는 스웨덴 대표」와 항복 조건을 교섭해 왔다고 보도하였음을 지적하라 한다.", "이어 4월 26일 룩셈부르크 라디오가 독일이 두 서방 연합국에 무조건항복을 제의하였으나 거절당하였다고 보도하였고 BBC가 이를 받아 재방송하였다.", "코널리 상원의원의 4월 28일 샌프란시스코 발언은 정보 출처나 관련 인물을 전혀 밝히지 않았다고 지적한다.", "SCAEF(연합국원정군최고사령관)의 5월 2일 성명은 히틀러의 죽음과 되니츠의 권력 승계에 관한 독일 측 보도, 그리고 4월 30일 스웨덴 외무성의 발표 뒤에 나온 것이며, 히틀러 순교 전설이 만들어지는 것을 막으려는 뜻이었다고 설명한다."], "primary": "워싱턴, 1945년 5월 4일—오후 7시.\n\n813. 귀하는 베르나도테–힘러 회담(Bernadotte–Himmler conversations)에 주어진 성급한 보도가 그 정부에 걱정거리가 된 데 대하여 권터 씨(Mr. Günther)에게 우리의 진심 어린 유감을 전하여 주기 바랍니다(귀 전보 제1640호, 5월 2일 오후 9시[주61] ). 그러나 이 나라와 국외에서 현재의 정치·[775면]군사 정세에 쏠린 강렬한 관심과, 미국과 스웨덴의 언론 자유를 고려하면, 풍문의 게재를 막는 것은 사실상 불가능합니다. 이와 관련하여 귀하는 다음과 같이 지적하여도 좋습니다 — 스웨덴 신문들은 지난 여러 주 동안 억류된 덴마크인과 노르웨이인의 석방과 관련한 베르나도테 백작의 활동에 상당한 지면을 할애하여 왔고, 4월 24일에는 그가 덴마크에 있다는 기사가 스웨덴 언론에 실린 바로 그날 《엑스프레센(Expressen)》이 덴마크 주둔 독일 고위 장교들이 「권한 있는 스웨덴 대표(authorized Swedish representative)」와 항복 조건을 교섭해 왔다는 보도를 실었습니다(귀 전보 제1516호, 4월 24일[주62] ). 이어 4월 26일에는 독일이 두 서방 연합국에 무조건항복을 제의하였으나 그 제의가 거절되었다는 룩셈부르크 라디오 보도가 나왔고, 이를 BBC가 받아 재방송하였습니다.\n\n코널리(Tom Connally) 상원의원의 4월 28일 샌프란시스코 발언[주63] 에 관하여는, 그가 자신의 정보 출처나 관련 인물에 대하여 아무런 시사도 하지 않았음을 지적하여도 좋습니다. SCAEF의 5월 2일 성명[주64] 은 히틀러의 죽음과 되니츠의 권력 승계에 관한 독일 측 보도가 나온 뒤, 그리고 베르나도테와 힘러의 회담을 요약한 4월 30일 스웨덴 외무성의 발표[주65] 가 있은 뒤에 나온 것입니다. 그것은 히틀러 순교라는 독일식 전설이 만들어지는 것을 막으려는 뜻에서 나왔습니다. 끝으로, 국무장관 대리의 보도자료[주66] 는 이미 공개된 몇몇 사태를 제 빛 아래 놓아 현존하는 혼란을 걷어 내고 상황을 제 자리에 놓았을 뿐입니다.\n\n그루(Grew)", "secondary": "Washington, May 4, 1945—7 p.m.\n\n813. You are requested to express to Mr. Günther our sincere regret that premature publicity given to the Bernadotte–Himmler conversations has been the source of concern to his government (your 1640, May 2, 9 p.m. [주61] ). Taking into consideration, however, the intense public interest in this country and abroad in current political and [775면] military developments, and the freedom of the press in the United States and Sweden, it is practically impossible to prevent the publication of rumors. In this connection, you may remark that Swedish newspapers have devoted considerable space in the past several weeks to Count Bernadotte’s activities in connection with the release of interned Danes and Norwegians, and that on April 24, the same day on which an account of his presence in Denmark appeared in the Swedish press, Expressen published a report that high German officers in Denmark had been negotiating surrender terms with an “authorized Swedish representative” (your 1516, April 24 [주62] ). This was followed on April 26 by a Luxembourg radio report, which was picked up and rebroadcast by the BBC, that the Germans had offered to surrender unconditionally to the two Western Allies but that the offer had been rejected.\n\nWith respect to Senator Connally’s statements at San Francisco [주63] on April 28, you may point out that he gave no indication of the source of his information or the personalities involved. SCAEF’s statement on May 2 [주64] was issued subsequent to German reports concerning Hitler’s death and the assumption of power by Dönitz and after the Swedish Foreign Office release of April 30 summarizing Bernadotte’s conversations with Himmler. [주65] It was made with a view to preventing the creation of a German legend of Hitler’s martyrdom. Finally, the Acting Secretary’s press release [주66] merely placed in their proper light certain developments which had become public to clear up existing confusion and put the situation in its proper perspective.\n\nGrew", "notes": ["[주61] 인쇄하지 않음. 이 전보에서 공사는 스웨덴 외무성 차관과의 대화를 보고하였는데, 보헤만 씨는 샌프란시스코에서 힘러의 제의에 주어진 보도가 노르웨이와 덴마크에서의 독일군 항복(capitulation) 가능성을 해쳤다는 견해를 밝혔다. 그는 또 아이젠하워 장군이 힘러–베르나도테 회담에 관하여 방금 낸 공보에 대하여도 이야기하였다. 그는 「쓰라린 어조로」, 샌프란시스코에서 일어난 일과 아이젠하워의 공보는 「우리가 알게 된 바를 귀측에 말하도록 우리를 격려하지 않는다」고 끝맺었다. 존슨 공사는 보고를 이렇게 마무리하였다. 「보헤만이 노르웨이와 덴마크에 관한 스웨덴의 희망과 계획에 차질이 생긴 데 대한 실망의 감정적 긴장 속에서 말한 것이기는 하나, 이곳 공식 인사들 사이에서 베르나도테–힘러 회담에 주어진 보도가 매우 심각한 실책으로 여겨지고 있는 것은 사실이다.」 (800.414/5–245)", "[주62] 인쇄하지 않음. 4월 24일자 언론 보도였다.", "[주63] 텍사스주 출신 상원 외교위원장이자 유엔 회의 대표인 톰 코널리 상원의원은 독일의 항복이 임박하였다고 시사한 바 있다. 《뉴욕 타임스》 1945년 4월 29일자 1면 8단 참조.", "[주64] 5월 2일 아이젠하워 장군은 힘러–베르나도테 회담의 몇몇 세부를 언론에 공개하였다. 같은 신문 1945년 5월 3일자 10면 5단 참조.", "[주65] 같은 신문 1945년 4월 30일자 1면 7단.", "[주66] 《Department of State Bulletin》 1945년 5월 6일자 863면."], "warn": false, "pages": ["775"], "search": "Joseph C. Grew 그루 — 국무장관 대리 Herschel V. Johnson 존슨 — 주스웨덴 공사 Christian Günther 권터 — 스웨덴 외무장관 Folke Bernadotte 베르나도테 백작 Heinrich Himmler 힘러 Karl Dönitz 되니츠 Adolf Hitler 히틀러 Tom Connally 코널리 — 미국 상원의원 Dwight D. Eisenhower 아이젠하워 Erik Boheman 보헤만 — 스웨덴 외무차관"}, {"id": "d562", "order": 562, "date": "1945-05-04", "group": "A", "eyebrow": "d562 · The Ambassador in France (Caffery) to the Secretary of State", "title": "주프랑스대사(캐퍼리)가 국무장관에게", "badge": null, "list_right": "문서 562", "meta": [{"k": "일자", "v": "1945-05-04"}, {"k": "시각", "v": "Paris, May 4, 1945—2 p.m. [Received 10:07 p.m.]"}, {"k": "장소", "v": "Paris", "txt": true}, {"k": "전문번호", "v": "2345"}, {"k": "원문출처", "v": "740.00119 EW/5–445: Telegram", "txt": true}, {"k": "발신", "v": "캐퍼리(Jefferson Caffery) — 주프랑스대사. 본문은 머피(Robert Murphy)가 매슈스(H. Freeman Matthews) 앞으로 보낸 것", "txt": true}, {"k": "수신", "v": "국무장관(The Secretary of State)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 562 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d562"}], "summary": "함부르크 서북방 독일군의 항복 교섭이 상당히 진전되었음을 알리면서, 카이텔의 서명으로 항복문서가 충분한가, 아이젠하워가 자기 책임으로 전면 항복을 받을 수 있는가를 둘러싼 영·미 간 견해차를 전한다.", "points": ["SHAEF 대표들이 카이텔의 밀사 및 부슈 장군과 접촉하여 함부르크 서북방(덴마크를 포함하는 듯한) 독일군의 항복(capitulation)을 논의 중이며 교섭은 상당히 진전된 것으로 이해된다. 아직 노르웨이는 포함되지 않았다.", "네덜란드에서는 독일군과의 군사 교섭에 새로운 진전이 없음에도 암묵적 양해로 사실상 정지 상태가 유지되고 있다.", "미군 G-3은 유럽의 전쟁이 이번 주말이면 끝날 수 있다고 보나 체코슬로바키아 정세는 아직 판단하기 이르다고 한다.", "항복은 일련의 지역별 항복(regional capitulations)으로 진행되고 있으나 전면 항복(general surrender)도 언제든 올 수 있다.", "영국 정치고문 스틸은 자국 정부가 「항복문서에 카이텔의 이름만으로는 충분하지 않고 히틀러나 힘러의 이름이 필요하였을 것」으로 본다고 말한다. 곧 누가 무슨 자격으로 서명하는가의 문제이다.", "아이젠하워 장군이 자기 책임으로 전면 항복을 받아들일 능력이 있다는 견해가 여기 있으나, 스틸은 정부들이 먼저 협의를 받아야 한다며 이에 반대한다.", "영국 외무성이 자기 제안으로 스틸에게 독일어와 러시아어로 된 항복 조건 사본을 보내고 있다. 머피는 3월에 EAC 미국 대표단에 이 문안들을 요청하였으나 그때는 준비되지 않았고, 다시 위넌트 대사에게 요청하고 있다."], "primary": "파리, 1945년 5월 4일—오후 2시.\n [오후 10시 07분 접수.]\n\n2345. 매슈스(Matthews)에게, 머피(Murphy)로부터. SHAEF(연합국원정군최고사령부) 대표들이 카이텔[주67] 의 밀사 한 사람 및 부슈 장군[주68] 과 접촉하여, 함부르크 서북방[776면] — 덴마크도 포함되는 듯한 — 독일군의 항복(capitulation)에 관하여 협의하여 왔습니다. 항복 논의는 상당히 진전된 것으로 이해됩니다.[주69] 아직은 노르웨이가 거기에 포함되지 않은 듯합니다. 네덜란드에서는 그곳 독일군과의 군사 교섭에 더 이상 아무런 진전이 없음에도 불구하고 암묵적 양해를 통하여 사실상 정지 상태가 유지되고 있습니다. 미군 G–3은 유럽에서의 전쟁이 이번 주말까지 끝날 수도 있다고 보는 듯하나, 체코슬로바키아 정세를 가늠하기에는 아직 너무 이릅니다. 항복은 일련의 지역별 항복(regional capitulations)[주70] 을 통하여 진행되고 있으나, 전면 항복(general surrender) 또한 언제든지 올 수 있습니다.\n\n영국 정치고문[주71] 은 자기 정부가 항복문서에 카이텔의 이름이 들어가는 것만으로는 충분하지 않다고, 히틀러나 힘러의 이름이 필요하였을 것이라고 여긴다고 단언합니다. 다만 사정이 달라진 지금은 어떻게 될지 그도 확신하지 못합니다. 이곳에는 아이젠하워 장군이 자기 책임으로 전면 항복을 받아들일 수 있다는 견해가 있습니다. 스틸(Steel)은 이 견해에 반대하며, 정부들이 먼저 협의를 받아야 한다고 주장합니다.\n\n외무성은 자기 제안으로 스틸에게 독일어와 러시아어로 된 항복 조건[주72] 사본을 보내고 있습니다. 지난 3월에 우리는 EAC 대표단에 이 문안들을 나에게 보내 달라고 요청하였으나 그때는 아직 준비되어 있지 않았습니다. 지금 다시 위넌트 대사에게 요청하고 있습니다.\n\n[이 전보의 나머지는 제IV권 447면 참조.]\n\n[머피(Murphy)]\n 캐퍼리(Caffery)", "secondary": "Paris, May 4, 1945—2 p.m. \n [Received 10:07 p.m.]\n\n2345. For Matthews from Murphy. SHAEF representatives have been in touch with an emissary from Keitel [주67] and also with General Busch [주68] regarding the capitulation of German forces to the northwest [776면] of Hamburg, including apparently Denmark. Surrender discussions are understood to be fairly well advanced. [주69] They do not as yet apparently include Norway. In Holland a standstill exists in effect through tacit understanding despite the fact that there is nothing further on the military discussions with the Germans there. American G–3 seems to think that the war in Europe may be over by the end of the week, although it is still too early to estimate the Czechoslovakian situation. Surrender is progressing through a series of regional capitulations [주70] but a general surrender may also come at any time.\n\nBritish Political Adviser [주71] asserts that his Government considers that Keitel’s name to a surrender instrument would not suffice and that those of Hitler or Himmler would have been required, but he is not sure what the situation would be under the changed circumstances. There is a view here that General Eisenhower is capable of accepting general surrender on his own responsibility. Steel objects to this view maintaining that the governments should be consulted first.\n\nForeign Office, on its own suggestion, is sending Steel a copy of the surrender terms [주72] in German and Russian. In March we requested our EAC delegation to let me have these texts but they were not then ready. I am again asking Ambassador Winant for them.\n\n[For the remainder of this telegram, see volume IV, page 447.]\n\n[Murphy] \n Caffery", "notes": ["[주67] 육군원수 빌헬름 카이텔(Generalfeldmarschall Wilhelm Keitel), 독일 국방군 최고사령부(OKW) 총장.", "[주68] 육군원수 에른스트 부슈(Generalfeldmarschall Ernst Busch), 독일 서북부 총사령관(OB Nordwest).", "[주69] 당시 뤼네부르크에서 독일 밀사들과 제21집단군 사령관 몽고메리 원수 사이에 진행되던 논의를 가리킨다. 네덜란드·서북독일·덴마크 주둔 독일군의 지역 항복은 5월 5일에 서명되었다.", "[주70] 5월 4일부터 7일까지 교섭된 여러 지역 항복의 자세한 내용은 Pogue, 《The Supreme Command》 480–483면 참조.", "[주71] 크리스토퍼 E. 스틸(Christopher E. Steel).", "[주72] 1944년 7월 25일 유럽자문위원회가 승인한 독일 항복문서(Instrument of Surrender for Germany)의 문안은 1944년 7월 25일 유럽자문위원회 제7차 정식회의 의사록 부속서 2, 《Foreign Relations》 1944년 제1권 256면 참조. 유럽자문위원회에서 교섭된 항복문서를 짧은 항복 문서로 대체한 데 관한 자료는 앞의 282–296면 여러 곳 참조. 베를린 비준(ratification) 의식의 자세한 내용은 Pogue, 《The Supreme Command》 490–494면 참조."], "warn": false, "pages": ["776"], "search": "Jefferson Caffery 캐퍼리 — 주프랑스대사 Robert Murphy 머피 — 대독일 정치고문 H. Freeman Matthews 매슈스 — 국무부 유럽국장 Wilhelm Keitel 카이텔 Ernst Busch 부슈 Adolf Hitler 히틀러 Heinrich Himmler 힘러 Dwight D. Eisenhower 아이젠하워 Christopher E. Steel 스틸 — 영국 정치고문 John G. Winant 위넌트 — 주영대사 Bernard L. Montgomery 몽고메리 — 제21집단군 사령관"}, {"id": "d862", "order": 862, "date": "1945-05-04", "group": "A", "eyebrow": "d862 · The Acting Secretary of State to the Ambassador in France (Caffery)", "title": "국무장관 대리가 주프랑스대사(캐퍼리)에게", "badge": null, "list_right": "문서 862", "meta": [{"k": "일자", "v": "1945-05-04"}, {"k": "시각", "v": "Washington, May 4, 1945—4 p.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "1855"}, {"k": "원문출처", "v": "800.414/5–445: Telegram", "txt": true}, {"k": "발신", "v": "그루(Joseph C. Grew) — 국무장관 대리(The Acting Secretary of State)", "txt": true}, {"k": "수신", "v": "캐퍼리(Jefferson Caffery) — 주프랑스대사(The Ambassador in France)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 862 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d862"}], "summary": "중립국과 여타 미주 공화국에 있는 독일 문서고에 대한 접근 확보에 프랑스 정부도 미·영·소 3국과 함께 참여하도록 초청하라는 훈령이다.", "points": ["국무부는 프랑스 정부가 미국·영국·소련 세 정부와 함께 중립국 및 여타 미주 공화국에 있는 독일 문서고에 대한 접근 확보에 나서도록 초청하기를 바란다.", "국무부는 아울러 프랑스 정부가 해당국 주재 자국 대표들에게 다른 세 나라의 조치를 지원하도록 훈령을 내리기를 희망한다.", "독일 문서고에 대한 접근은 적의 첩보망을 파괴하려는 노력에서 큰 값어치가 있는 문서와 기록을 얻게 해 줄 것이라고 국무부가 이미 지적한 바 있다."], "primary": "워싱턴, 1945년 5월 4일—오후 4시.\n\n1855. 3월 31일 오후 3시자 국무부 회람전보 재송(Redeptelcirc March 31, 3 p.m.). 국무부는 귀하가 프랑스 정부에 대하여, 중립국들과 여타 미주 공화국들에 있는 독일 문서고에 대한 접근을 확보하는 일에 미합중국·연합왕국·소비에트사회주의공화국연방 정부들과 함께 참여하도록 초청하기를 바랍니다.\n\n이와 관련하여 국무부는 프랑스 정부가 중립국들과 여타 미주 공화국들에 있는 자국 대표들에게 해당국에서 다른 세 나라의 조치를 지원하도록 훈령을 내려 주기를 희망합니다.\n\n국무부가 이전에 지적한 바와 같이, 독일 문서고에 대한 접근은 적의 첩보망을 파괴하려는 노력에서 큰 값어치를 지닌 문서와 기록을 이용할 수 있게 해 줄 것입니다.\n\n그루(Grew)", "secondary": "Washington, May 4, 1945—4 p.m.\n\n1855. Redeptelcirc March 31, 3 p.m. The Department desires that you invite the French Government to associate itself with the governments of the United States of America, the United Kingdom, and the Union of Soviet Socialist Republics in obtaining access to German archives in neutral countries and the other American Republics.\n\nIn this connection the Department hopes that the French Government will issue instructions to its representatives in the neutral countries and the other American Republics to support the action of the three other powers in the countries concerned.\n\nAs the Department has previously pointed out access to German archives should make available documents and records of great value in the effort to destroy the enemy’s intelligence network.\n\nGrew", "notes": [], "warn": false, "pages": [], "search": "Joseph C. Grew 그루 — 국무장관 대리 Jefferson Caffery 캐퍼리 — 주프랑스대사"}, {"id": "d917", "order": 917, "date": "1945-05-04", "group": "A", "eyebrow": "d917 · The Chargé in the Soviet Union (Kennan) to the Secretary of State", "title": "주소련 대리대사(케넌)가 국무장관에게", "badge": null, "list_right": "문서 917", "meta": [{"k": "일자", "v": "1945-05-04"}, {"k": "시각", "v": "Moscow, May 4, 1945—2 p.m. [Received May 4—11:30 a.m.]"}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": "1458"}, {"k": "원문출처", "v": "740.00119 EW/5–445: Telegram", "txt": true}, {"k": "발신", "v": "케넌(George F. Kennan) — 주소련 대리대사(The Chargé in the Soviet Union)", "txt": true}, {"k": "수신", "v": "국무장관(The Secretary of State)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 917 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d917"}], "summary": "배상위원회에 폴란드와 유고슬라비아 대표를 넣는 문제에 관하여 비신스키가 로버츠에게 보낸 5월 2일자 회답의 내용을 보고한다.", "points": ["로버츠가 5월 2일자 비신스키 서한을 어제 받았다. 이는 배상위원회에 폴란드·유고슬라비아 대표를 포함시키는 데 반대한 클라크 커의 4월 14일자 서한에 대한 회답이다.", "비신스키는 두 나라의 포함을 강하게 지지하며, 폴란드와 유고슬라비아 대표가 「프랑스 대표와 동시에, 위원회 사업의 맨 처음부터」 위원회에 참여해야 한다고 소련 정부가 여긴다고 밝혔다.", "그는 최근 사태에 비추어 이 문제가 특히 긴급하고 첨예한 성격을 띠고 있다고 지적하고, 크림에서 채택된 원칙에 기초하여 계획을 세우는 일이 시급하다고 하였다.", "비신스키는 영국 정부가 지체 없이 대표를 임명하여 위원회의 사업 개시를 늦추지 말 것을 요청하며 끝맺었다.", "케넌은 아직 같은 서한을 받지 못하였으며, 자신이 4월 30일 비신스키에게 보낸 서한이 로버츠 앞 회답이 기초되던 무렵에 도착하여 해리먼 대사의 4월 9일자 서한에 대한 같은 취지의 회답 작성을 늦추게 하였을 수 있다고 본다."], "primary": "모스크바, 1945년 5월 4일—오후 2시.\n [5월 4일—오전 11시 30분 접수.]\n\n1458. 4월 28일 오후 7시자 국무부 전보 제970호에 관하여(ReDeptel 970, April 28, 7 p.m.). 로버츠(Roberts)는 어제 비신스키(Vyshinski)로부터 배상 문제에 관한 5월 2일자 서한을 받았습니다. 이 서한은 배상위원회(Reparations Commission)에 폴란드[및] 유고슬라비아 대표를 포함시키는 데 반대를 표한 클라크 커(Clark Kerr)의 4월 14일자 서한에 대한 회답입니다.\n\n비신스키는 그 회답에서 이 나라들의 포함을 강력히 지지하는 태도를 취하며, 소비에트 정부는 폴란드와 유고슬라비아 대표가 「프랑스 대표와 동시에, 위원회 사업의 맨 처음부터 위원회에 자리를 잡아야 한다」고 여긴다고 밝히고 있습니다. 이어 그는 이 문제가, 특히 최근의 사태에 비추어, 각별히 긴급하고 첨예한 성격을 띠어 가고 있다고 지적합니다. 그는 「이 문제에 관한 행동에서 있을 수 있는 어긋남을 피하기 위하여 … [주73] 그것은 이미 충분히 복잡한 전후 유럽의 경제 문제의 해결을 [1206면] 한층 더 어렵게 만들 것이므로」 크림에서 채택된 원칙에 기초하여 계획을 세우는 일이 시급히 필요하다고 봅니다. 그는 영국 정부가 지체 없이 자국 대표를 임명하여 위원회 사업의 개시를 늦추지 말 것을 요청하면서 끝맺고 있습니다.\n\n나는 아직 같은 취지의 서한을 받지 못하였습니다. 참조 전보에 따라 내가 4월 30일 비신스키에게 보낸 서한[주74] 은 아마도 그가 로버츠에게 보낼 서한을 기초하고 있던 바로 그 무렵에 그에게 닿았을 것입니다. 그 때문에 그가 이 문제에 관한 해리먼(Harriman) 대사의 4월 9일자 서한[주75] 에 대한 같은 취지의 회답을 최종적으로 기초하는 일을 미루었을 수도 있습니다. 어쨌든 나는 머지않아 로버츠 앞으로 보낸 것과 비슷한 서한을 받으리라 예상합니다.\n\n케넌(Kennan)", "secondary": "Moscow, May 4, 1945—2 p.m. \n [Received May 4—11:30 a.m.]\n\n1458. ReDeptel 970, April 28, 7 p.m. Roberts received yesterday a letter dated May 2 from Vyshinski on the subject of reparations. This letter is in reply to one addressed to Vyshinski on April 14 by Clark Kerr, voicing objection to the inclusion on Reparations Commission of representatives of Poland [and] Yugoslavia in the Commission.\n\nIn his reply Vyshinski takes strong stand in favor of inclusion of these countries, stating that the Soviet Government deems that Polish and Yugoslav representatives “must take their places on the Commission from the very beginning of its work simultaneously with the representative of France.” He then points out that this question, especially in view of recent events, [is] assuming a particularly urgent and acute character. He finds it urgently necessary to work out a plan on the basis of the principles adopted at the Crimea “in order to avoid possible divergencies in action on this question … [주73] which [1206면] would render still more difficult the solution of the already sufficiently complicated economic questions of postwar Europe.” He ends by requesting the British Government to appoint its representative without delay and thus not to delay initiation of the work of the Commission.\n\nI have not yet received a similar letter. My letter of April 30 [주74] sent to Vyshinski in pursuance to Department’s telegram under reference probably reached him just about the time his letter to Roberts was being drafted. It may have caused him to delay final drafting of a similar reply to Ambassador Harriman’s letter of April 9 [주75] on this subject. In any case, I expect that I will receive shortly a letter similar to that addressed to Roberts.\n\nKennan", "notes": ["[주73] 원 전보에 생략이 표시되어 있다.", "[주74] 인쇄하지 않음.", "[주75] 인쇄하지 않았으나 4월 10일자 전보 제1110호, 1194면 및 각주 50 참조."], "warn": false, "pages": ["1206"], "search": "George F. Kennan 케넌 — 주소련 대리대사 Andrey Y. Vyshinski 비신스키 — 소련 외무인민위원 대리 Frank K. Roberts 로버츠 — 주소련 영국대사관 대리대사 Sir Archibald Clark Kerr 클라크 커 — 주소련 영국대사 W. Averell Harriman 해리먼 — 주소련 미국대사"}, {"id": "d91", "order": 91, "date": "1945-05-05", "group": "A", "eyebrow": "d91 · The Chargé in the Soviet Union (Kennan) to the Secretary of State", "title": "주소련 대리대사(케넌)가 국무장관에게", "badge": null, "list_right": "문서 91", "meta": [{"k": "일자", "v": "1945-05-05"}, {"k": "시각", "v": "Moscow, May 5, 1945—5 p.m. [Received May 5—11 a.m.]"}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": "1477"}, {"k": "원문출처", "v": "863.01/5–545: Telegram", "txt": true}, {"k": "발신", "v": "케넌(George F. Kennan) — 주소련 대리대사(The Chargé in the Soviet Union)", "txt": true}, {"k": "수신", "v": "국무장관(The Secretary of State)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 91 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d91"}], "summary": "오스트리아 렌너 정부 수립이라는 소련의 일방적 조치에 대하여 프랑스 대사가 데카노조프에게 항의한 내용을 보고한다.", "points": ["프랑스 대사(카트루)가 2~3일 전 데카노조프와 오스트리아 렌너 정부 수립 문제를 이야기하였다.", "그는 소련 당국이 취한 일방적 조치에 대한 자국 정부의 불만을 표하고, 「지방 행정기구와 오스트리아 독립의 즉각적 표명이 필요하였다」는 데카노조프의 변명을 유효한 것으로 받아들이기를 거부하였다.", "그는 임시정부를 세우지 않고도 지방 행정기구를 세우는 일은 충분히 가능하였다고 지적하였다.", "그는 렌너 정부의 권위가 오스트리아의 다른 점령지대에서 인정되지 않을 경우 생겨날 함의에 주의를 환기하였다.", "대사는 오스트리아와 중부 유럽에서 연합국 공동책임(collective Allied responsibility)의 원칙을 지키는 일이 중요함을 자국 정부에 강조하고 단호한 태도를 취할 것을 촉구하였다."], "primary": "모스크바, 1945년 5월 5일—오후 5시.\n [5월 5일—오전 11시 접수.]\n\n1477. 프랑스 대사[주27] 가 2, 3일 전 데카노조프(Dekanozov)[주28] 와 오스트리아 렌너(Renner) 정부의 수립에 관하여 이야기하였습니다. 그는 소련 당국이 취한 일방적 조치에 대한 자국 정부의 불만을 표명하였고, 소련 당국이 지방 행정기구와 오스트리아 독립의 즉각적인 표명이 필요하다고 여겼다는 데카노조프의 변명을 유효한 것으로 받아들이기를 거부하였습니다. 그는 임시정부를 세우지 않고도 지방 행정기구를 세우는 일은 충분히 가능하였을 것이라고 지적하였습니다. 그는 렌너 정부의 권위가 오스트리아의 다른 점령지대에서 인정되지 않을 경우 생겨날 함의에 주의를 환기하였습니다. 대사는 오스트리아와 중부 유럽에서 연합국 공동책임(collective Allied responsibility)의 원칙을 유지하는 일이 중요함을 자국 정부에 강조하였고, 단호한 노선을 취할 것을 촉구하였습니다.\n\n케넌(Kennan)", "secondary": "Moscow, May 5, 1945—5 p.m. \n [Received May 5—11 a.m.]\n\n1477. French Ambassador [주27] spoke 2 or 3 days ago with Dekanozov [주28] concerning establishment of the Renner Government in Austria. He expressed his Government’s dissatisfaction with the unilateral action which had been taken by the Soviet authorities and refused to accept as valid Dekanozov’s excuses that the Soviet authorities found need of a local administration and of an immediate demonstration of Austrian independence. He pointed out that it would have been quite possible to establish a local administration without establishing a provisional government. He invited attention to the implications which would arise if the authority of Renner Government were not to be recognized in the other zones of occupation in Austria. The Ambassador has stressed to his Government the importance of the maintenance of the principle of collective Allied responsibility in Austria and Central Europe and has urged that a firm line be taken.\n\nKennan", "notes": ["[주27] 조르주 알베르 쥘리앵 카트루 장군(Gen. Georges Albert Julien Catroux).", "[주28] 블라디미르 게오르기예비치 데카노조프(Vladimir Georgyevich Dekanozov), 소련 외무인민위원 대리."], "warn": false, "pages": [], "search": "George F. Kennan 케넌 — 주소련 대리대사 Georges Catroux 카트루 — 주소련 프랑스대사 Vladimir G. Dekanozov 데카노조프 — 소련 외무인민위원 대리 Karl Renner 렌너 — 오스트리아 임시정부 수반"}, {"id": "d210", "order": 210, "date": "1945-05-05", "group": "C", "eyebrow": "d210 · Note by the Secretary General of the European Advisory Commission (Donaldson) of the Twelfth Meeting of the Allied Consultation Committee, European Advisory Commission, Held at Lancaster House, London, May 4, 1945,11 a.m.  Copy transmitted to the Department by the Ambassador in the United Kingdom in his despatch 22932. May 7; received May 14.", "title": "유럽자문위원회 사무총장(도널드슨)의 기록 — 1945년 5월 4일 오전 11시 런던 랭커스터 하우스에서 열린 유럽자문위원회 연합국협의위원회 제12차 회의", "badge": null, "list_right": "문서 210", "meta": [{"k": "일자", "v": "1945-05-05"}, {"k": "시각", "v": "회의는 1945년 5월 4일 오전 11시 개최. 기록의 일부는 5월 5일자, 부속서는 5월 4일자"}, {"k": "장소", "v": "London (Lancaster House)", "txt": true}, {"k": "전문번호", "v": "E.A.C.(A.C.C.) 45 12th Meeting"}, {"k": "원문출처", "v": "740.00119 EAC/5–745", "txt": true}, {"k": "발신", "v": "도널드슨(E. P. Donaldson) — 유럽자문위원회 사무총장(Secretary General of the European Advisory Commission)", "txt": true}, {"k": "수신", "v": "유럽자문위원회(기록). 사본은 주영대사가 5월 7일자 공문 제22932호로 국무부에 송부, 5월 14일 접수", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회의록"}], "links": [{"k": "FRUS", "text": "문서 210 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d210"}], "summary": "연합국협의위원회가 독일 점령지대 협정과 통제기구 협정의 요약 초안을 각각 승인하여 유럽자문위원회에 제출하기로 결정한 회의의 기록이며, 두 요약 초안이 부속서로 붙어 있다.", "points": ["협의위원회는 후드 경이 3월 10일에 마련한 통제기구 협정 요약 초안과 4월 17일 회람된 독일 점령에 관한 의정서 요약 재초안을 토의의 기초로 받아들이기로 하였다.", "「독일 점령에 관한 협정」의 요약 초안을 여러 문안 수정과 함께 승인하여 부속서 I의 형태로 EAC에 제출하기로 결정하였다.", "「독일 통제기구에 관한 협정」의 요약 초안도 승인하여 부속서 II의 형태로 제출하기로 하였다.", "미국 대표단은 신 제4항에 대한 대안 문안을 제안하였다. 조정위원회가 통제이사회를 대신하여 통제참모부를 통해 이사회 결정을 집행하고 독일 중앙행정기관의 활동을 일상적으로 감독·통제한다는 안이다.", "프렌치 준장은 조정위원회의 임무를 더 충실히 규정하려면 1944년 11월 14일 협정 제5조의 문안을 넣어야 한다고 제안하였고, 샥신은 이 항을 아예 빼는 편이 낫다고 보았다. 협의위원회는 원 초안을 유지하되 「독일 중앙행정부(German Central Administration)」를 「독일 중앙기관(German central organs)」으로 바꾸기로 하였다.", "의장은 원 초안 제8항이 1944년 11월 14일 협정에는 없고 첨부 보고서에서 따온 내용을 담고 있다고 지적하며 삭제를 제안하였다. 후드 경은 삭제에 동의하되, 「항복문서(Instrument of Surrender)의 서명 시에 네 정부가 그 문서로 떠맡는 권한의 행사와 관련하여 다른 국제연합 정부들과 협의할 의향임을 공개 성명으로 발표하는 문제」를 구두로 제기할 권리를 유보하고자 하였다. 곧 항복 서명이라는 계기 자체를 다른 연합국에 대한 언질과 묶는 문제이다.", "부속서 I: 독일은 1937년 12월 31일 당시의 국경 안에서 점령을 위하여 네 지대로 나뉜다. 동부지대는 소련, 서북지대는 영국, 서남지대는 미국, 서부지대는 프랑스다. 「대베를린」 지역은 네 나라 군대가 함께 점령하고 네 명의 사령관으로 이루어진 연합관리기구(러시아어로 코멘다투라)를 둔다.", "부속서 II: 독일이 무조건항복의 기본 요구를 이행하는 기간 동안 최고권력은 네 나라 총사령관이 각자의 지대에서, 또 독일 전체에 관한 문제에서는 공동으로 행사하며, 네 총사령관이 함께 통제이사회를 이룬다. 이사회의 결정은 만장일치여야 한다."], "primary": "E.A.C.(A.C.C.) 45 제12차 회의\n\n출석:\n\n샥신(G. F. Saksin) 씨 (의장)\n\n후드 자작(Viscount Hood)  드 뢰스 백작(Count de Leusse)\n\nF. G. 프렌치 준장(Brigadier F. G French)\n\nV. 마이어 준장(Brigadier-General V. Meyer)\n\nP. 모즐리(P. Mosely) 씨\n\n사무국:\n\nE. P. 도널드슨(E. P. Donaldson) 씨\n\nT. A. 마르첸코(T. A. Marchenko) 씨\n\nE. A. 페이턴스미스(E. A. Paton-Smith) 씨\n\n독일 통제기구 및 점령지대에 관한 협정들의 요약\n\n협의위원회는 후드 경(Lord Hood)이 3월 10일에 마련한 [263면] 통제기구 협정 요약 초안[P26/33/45][주5a] 과 4월 17일에 회람된 독일 점령에 관한 의정서 요약의 재초안[P9/38/45][주6] 을 토의의 기초로 받아들이기로 합의하였다.\n\n1. 독일의 점령\n\n협의위원회는 여러 문안 수정과 함께 「소비에트사회주의공화국연방·연합왕국·미합중국 정부 및 프랑스공화국 임시정부 간의 독일 점령에 관한 협정의 요약 초안」을 승인하고, 이를 첨부된 형태[부속서 I]로 유럽자문위원회에 제출하기로 결정하였다.\n\n2. 독일의 통제기구\n\n협의위원회는 「소비에트사회주의공화국연방·연합왕국·미합중국 정부 및 프랑스공화국 임시정부 간의 독일 통제기구에 관한 협정의 요약 초안」의 문안을 승인하고, 이를 첨부된 형태[부속서 II]로 유럽자문위원회에 제출하기로 결정하였다.\n\n토의 중 미국 대표단은 신 제4항에 대한 대안으로 다음 문안을 제안하였다:—\n\n「조정위원회(Co-ordinating Committee)는 통제이사회를 대신하여, 그리고 통제참모부(Control Staff)를 통하여, 통제이사회의 결정을 집행하고 독일 중앙행정기관 및 기구들의 활동에 대한 일상적 감독과 통제를 행사한다.\n\n「통제참모부는 그에 대응하는 독일의 여러 부(部) 및 독일 중앙기구들에 대하여 통제를 행사하고, 통제이사회와 조정위원회에 조언한다.」\n\n프렌치 준장은 조정위원회의 임무를 더 충실히 규정하려는 것이라면 1944년 11월 14일 협정 제5조의 문안을 넣어야 한다고 제안하였다. 샥신 씨는 이 항을 아예 빼는 편이 낫겠다고 생각하였다. 협의위원회는 신 제4항의 원 초안을 유지하되 「독일 중앙행정부(the German Central Administration)」를 「독일 중앙기관(German central organs)」으로 바꾸기로 합의하였다.\n\n의장은 원 초안 제8항에 1944년 11월 14일 협정에는 나오지 않고 첨부 보고서에서 따온 내용이 들어 있다고 지적하였다. 그는 이를 삭제하자고 제안하였다. 후드 경은 삭제에 동의하겠으나, 항복문서(Instrument of Surrender)의 서명 시에 네 정부가 그 문서로써 떠맡는 권한의 행사와 관련하여 다른 국제연합(United Nations) 정부들과 협의할 의향임을 밝히는 공개 성명을 발표하는 문제를 [264면] 구두로 제기할 권리는 유보하고자 한다고 말하였다.\n\n런던, 1945년 5월 5일.\n\n[부속서 1]\n\n소비에트사회주의공화국연방·연합왕국·미합중국 정부 및 프랑스공화국 임시정부 간의 독일 점령에 관한 협정의 요약 초안[주7]\n\nP9/40/45\n\n1. 독일은 1937년 12월 31일 당시의 국경 안에서, 점령을 목적으로 네 개 지대로 나뉘며 각 지대는 다음과 같이 각 강국에 하나씩 할당된다:—\n\n동부지대는 소비에트사회주의공화국연방에;\n\n서북지대는 연합왕국에;\n\n서남지대는 미합중국에;\n\n서부지대는 프랑스에.\n\n각 지대의 점령군은 책임 강국이 지명하는 총사령관의 지휘 아래 둔다. 네 강국은 각기 재량으로, 자국 총사령관의 지휘 아래 점령 임무에 배정된 병력 가운데, 독일에 대한 군사작전에 적극적으로 참가한 다른 연합국 병력에서 온 보조부대를 포함시킬 수 있다.\n\n2. 「대베를린(Greater Berlin)」 지역은 네 강국 각각의 군대가 점령한다. 각 총사령관이 임명하는 네 명의 사령관(Commandant)으로 구성되는 연합관리기구(Inter-Allied Governing Authority, 러시아어로 코멘다투라 Komendatura)를 두어 그 행정을 공동으로 지휘하게 한다.\n\n런던, 1945년 5월 4일.\n\n[부속서 2]\n\n소비에트사회주의공화국연방·연합왕국·미합중국 정부 및 프랑스공화국 임시정부 간의 독일 통제기구에 관한 협정의 요약 초안[주7]\n\nP26/39/45\n\n독일이 무조건항복(unconditional surrender)의 기본 요구를 이행하고 있는 기간에는, 독일에서의 최고권력을 소비에트·영국·미국·프랑스 총사령관들이 각자의 정부의 훈령에 따라 각기 [265면] 자기 점령지대에서, 그리고 독일 전체에 관한 문제에서는 공동으로 행사한다. 네 총사령관은 함께 통제이사회(Control Council)를 구성한다.\n\n2. 통제이사회는 그 결정이 만장일치여야 하며, 각 점령지대에서 총사령관들의 행동에 적절한 통일성을 확보하고, 독일 전체에 관한 주요 문제들에 대하여 합의된 결정에 이른다.\n\n3. 통제이사회 아래에, 네 총사령관 각각의 대표 한 사람으로 구성되는 상설 조정위원회와, 다음 부(部)들로 조직되는 통제참모부를 둔다(이 부들은 경험에 비추어 조정될 수 있다):\n\n군사; 해군; 공군; 수송; 정치; 경제; 재정; 배상·인도(引渡) 및 원상회복; 내무 및 통신; 법무; 전쟁포로 및 실향민; 인력.\n\n각 부에는 네 나라가 각기 한 사람씩 지명하는 네 명의 부장(部長)을 둔다. 각 부의 참모진에는 군인뿐 아니라 민간인도 포함될 수 있으며, 특별한 경우에는 개인 자격으로 임명된 다른 국제연합 국민도 포함될 수 있다.\n\n4. 조정위원회와 통제참모부의 임무는 통제이사회에 조언하고, 이사회의 결정을 집행하여 이를 독일 중앙기관에 전달하며, 후자의 일상 활동을 감독하고 통제하는 것이다.\n\n5. 가장 큰 이해관계를 가진 다른 국제연합 정부들과의 연락은, 그 정부들이 통제이사회에 군사사절단(민간인 구성원을 포함할 수 있다)을 임명함으로써 이루어진다. 이 사절단들은 적절한 경로를 통하여 통제기관에 접근할 수 있다.\n\n6. 국제연합 기구들은 통제이사회가 독일에서 활동하도록 허용하는 경우, 연합국 통제기구에 종속되며 그에 대하여 책임을 진다.\n\n7. 「대베를린」 지역의 행정은 연합관리기구가 지휘하며, 이 기구는 통제이사회의 일반적 지휘 아래 운영되고 네 명의 사령관으로 구성된다. 이들은 돌아가며 수석사령관을 맡는다. 이들은 현지 독일 기관들의 활동을 감독하고 통제할 기술참모진의 보좌를 받는다.\n\n8. 위에 개괄한 조치들은 독일 항복 직후의 점령기간, 곧 독일이 무조건항복의 기본 요구를 이행하는 기간 동안 운영된다. 그 이후 기간에 관한 조치는 별도 협정의 대상으로 한다.\n\n런던, 1945년 5월 4일.\n\n[266면]", "secondary": "E.A.C.(A.C.C.) 45 12th Meeting\n\nPresent:\n\nMr. G. F. Saksin (in the Chair)\n\nViscount Hood Count de Leusse\n\nBrigadier F. G French\n\nBrigadier-General V. Meyer\n\nMr. P. Mosely\n\nSecretariat:\n\nMr. E. P. Donaldson\n\nMr. T. A. Marchenko\n\nMr. E. A. Paton-Smith\n\nSummary of the Agreements on Machinery of Control in Germany and Zones of Occupation\n\nThe Committee agreed to accept as a basis for discussion the draft summary of the Agreement on Control Machinery prepared by Lord [263면] Hood on 10th March [P26/33/45] [주5a] and the redraft of the summary of the Protocol on the Occupation of Germany circulated on 17th April [P9/38/45]. [주6]\n\n1. Occupation of Germany\n\nThe Committee approved with a number of drafting amendments a “draft summary of the Agreement between the Governments of the Union of Soviet Socialist Republics, the United Kingdom, the United States of America and the Provisional Government of the French Republic on the occupation of Germany” and decided to submit it in the form attached [Annex I] to the European Advisory Commission.\n\n2. Control Machinery in Germany\n\nThe Committee approved the text of a “draft summary of the Agreement between the Governments of the Union of Soviet Socialist Republics, the United Kingdom, the United States of America and the Provisional Government of the French Republic on Control Machinery in Germany” and decided to submit it in the form attached [Annex II] to the European Advisory Commission.\n\nIn discussion, the U.S. Delegation proposed as an alternative to new paragraph 4 the following text:—\n\n“The Co-ordinating Committee, acting on behalf of the Control Council and through the Control Staff, will carry out the decisions of the Control Council and exercise day to day supervision and control of the activities of the German central administrative bodies and institutions.\n\n“The Control Staff will exercise control over the corresponding German ministries and German central institutions, and advise the Control Council and the Co-ordinating Committee.”\n\nBrigadier French suggested that if the duties of the Co-ordinating Committee were to be more fully defined, the text of Article 5 of the Agreement of 14th November, 1944, should be incorporated. Mr. Saksin thought that it would be better to omit this paragraph altogether. The Committee agreed to retain the original draft of new paragraph 4 with the substitution of “German central organs” for “the German Central Administration”.\n\nThe Chairman pointed out that paragraph 8 of the original draft included matter which did not appear in the Agreement of 14th November, 1944, but was taken from the covering report. He suggested that this should be omitted. Lord Hood said that he would agree to omit this, but would wish to reserve the right to raise orally the question of the issue of a public statement at the time of the signature of the Instrument of Surrender regarding the intention of the [264면] four Governments to consult with the Governments of other United Nations in connection with the exercise of the powers assumed by them in that Instrument.\n\nLondon , 5 May, 1945.\n\n[Annex 1]\n\nDraft Summary of the Agreement Between the Governments of the Union of Soviet Socialist Republics, the United Kingdom, the United States of America, and the Provisional Government of the French Republic on the Occupation of Germany [주7]\n\nP9/40/45\n\n1. Germany, within her frontiers as they were on 31st December, 1937, will, for the purposes of occupation, be divided into four zones, one to be allotted to each Power as follows:—\n\nan eastern zone to the Union of Soviet Socialist Republics;\n\na north-western zone to the United Kingdom;\n\na south-western zone to the United States of America;\n\na western zone to France.\n\nThe occupying forces in each zone will be under a Commander-in-Chief designated by the responsible Power. Each of the four Powers may, at its discretion, include among the forces assigned to occupation duties under the command of its Commander-in-Chief, auxiliary contingents from the forces of any other Allied Power which has actively participated in military operations against Germany.\n\n2. The area of “Greater Berlin” will be occupied by forces of each of the four Powers. An Inter-Allied Governing Authority (in Russian, Komendatura) consisting of four Commandants, appointed by their respective Commanders-in-Chief, will be established to direct jointly its administration.\n\nLondon , 4 May, 1945.\n\n[Annex 2]\n\nDraft Summary of the Agreement Between the Governments of the Union of Soviet Socialist Republics, the United Kingdom, the United States of America, and the Provisional Government of the French Republic on Control Machinery in Germany [주7]\n\nP26/39/45\n\nIn the period when Germany is carrying out the basic requirements of unconditional surrender, supreme authority in Germany will be exercised, on instructions from their Governments, by the Soviet, British, United States and French Commanders-in-Chief, each in his [265면] own zone of occupation, and also jointly, in matters affecting Germany as a whole. The four Commanders-in-Chief will together constitute the Control Council.\n\n2. The Control Council, whose decisions shall be unanimous, will ensure appropriate uniformity of action by the Commanders-in-Chief in their respective zones of occupation and will reach agreed decisions on the chief questions affecting Germany as a whole.\n\n3. Under the Control Council, there will be a permanent Co-ordinating Committee composed of one representative of each of the four Commanders-in-Chief and a Control Staff organised in the following Divisions (which are subject to adjustment in the light of experience):\n\nMilitary; Naval; Air; Transport; Political; Economic; Finance; Reparation, Deliveries and Restitution; Internal Affairs and Communications; Legal; Prisoners of War and Displaced Persons; Man-power.\n\nThere will be four heads of each Division, one designated by each Power. The staffs of the Divisions may include civilian as well as military personnel, and may also in special cases include nationals of other United Nations appointed in a personal capacity.\n\n4. The functions of the Co-ordinating Committee and of the Control Staff will be to advise the Control Council, to carry out the Council’s decisions and to transmit them to German central organs, and to supervise and control the day-to-day activities of the latter.\n\n5. Liaison with the other United Nations Governments chiefly interested will be established through
