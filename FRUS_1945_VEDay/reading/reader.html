ot looked upon with favor. Mixed occupation is difficult of administration especially where differences of languages and legal concepts are involved. With occupation forces of different nationalities in the same area, an unfriendly or uncooperative population is in an ideal position to play one nationality off against the other and will be quick to take advantage of the situation. This suggestion would require submission to and acceptance by both the British and U.S.S.R. as well and could not be agreed to by the United States alone. Furthermore, it would require reopening and revising the entire theory of occupation as developed to date under the existing protocols. On the other hand no military objection is perceived to a French zone of occupation of Vorarlberg and Tirol in Austria.\n\n12.\n\nAny occupation of Germany or Austria by the French should be subject to all of the general conditions to which the United States, United Kingdom and the U.S.S.R. have already subscribed.\n\nFor the State-War-Navy Coordinating Committee: \n\n\nH. Freeman Matthews\n\nActing Chairman", "notes": ["[주85] 인쇄하지 않음. 이 서한은 런던발 2월 8일 오후 9시자 전보 1400호(182면)의 요지를 되풀이한 것이다.", "[주86] 이 소견과 결론은 1945년 4월 27일자 육군장관 및 해군장관 앞 합동참모본부 각서(인쇄하지 않음)에 담겨 있었으며, 이것이 국무·육군·해군 3부조정위원회의 심의를 위해 회람되면서 1945년 4월 28일자 문서 SWNCC 44/1(인쇄하지 않음)의 부속문서가 되었다. 1945년 5월 3일자 SWNCC 44/2(인쇄하지 않음)에 따르면, 3부조정위원회는 1945년 5월 1일 비공식 의결로 SWNCC 44/1을 승인하였고, 그 부속문서에 담긴 내용이 국무장관에게 전달되었다(EAC 편철)."], "warn": false, "pages": ["249", "250", "251", "252"], "search": "Matthews 매슈스(H. Freeman Matthews, 국무·육군·해군 3부조정위원회 의장 대리) Winant 위넌트(주영대사) Eisenhower 아이젠하워"}, {"id": "d199", "order": 199, "date": "1945-04-30", "group": "D", "eyebrow": "d199 · The United States Political Adviser for Germany (Murphy) to the Director of the Office of European Affairs (Matthews)", "title": "대독일 정치고문(머피)이 유럽국장(매슈스)에게", "badge": null, "list_right": "문서 199", "meta": [{"k": "일자", "v": "1945-04-30"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Versailles ?", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 Control (Germany)/4–3045", "txt": true}, {"k": "발신", "v": "The United States Political Adviser for Germany (Murphy) 대독일 정치고문 머피", "txt": true}, {"k": "수신", "v": "The Director of the Office of European Affairs (Matthews) 유럽국장 매슈스", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "서한"}], "links": [{"k": "FRUS", "text": "문서 199 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d199"}], "summary": "머피가 매슈스에게 사신(私信)으로, 라인강 우안의 프랑스 점령지대에 관한 SHAEF의 기술적 검토를 전하면서 프랑스에는 바덴 남부 두 관구만 내주자는 SHAEF 안(案)을 전적으로 지지한다고 밝힌 편지다.", "points": ["「발췌」로 실린 사신(私信)이며, 4월 한 달 사이 대독일 정치고문실이 런던에서 베르사유의 SHAEF 본부로 옮겨졌다.", "SHAEF는 프랑스에 바덴의 남부 두 관구, 곧 프라이부르크와 콘스탄츠만 제시할 것을 강력히 권한다.", "더 주어야 한다면 코블렌츠 동쪽의 운터베스터발트·운터란·장크트고아르스하우젠 크라이스로 이루어진 작은 교두보를, 그래도 부족하면 카를스루에 관구를 내줄 수 있다는 순서를 제시했다.", "머피는 프랑스가 라인란트 일부·자르·팔츠·바덴 일부를 받는다면 감당할 수 있는 만큼은 다 받는 것이며 받을 자격이 있는 만큼도 다 받는 것이라고 썼다.", "캐퍼리는 앞으로 여러 달 동안 미군이 프랑스의 통과 시설에 의존해야 하므로 프랑스에 잘 대해 주어야 한다고 주장했다.", "머피는 소련은 프랑스에 아무것도 주지 않으며, 영국은 애초에 자기가 가질 뜻이 없던 땅을 유럽자문위원회에 요구해 두었다가 프랑스에 넘기는 「멋진 몸짓」을 했다고 적었다.", "부속문서인 스미스 중장의 각서는 프랑스 지대를 통과하는 미군 통행권의 명확한 보장, 그리고 미군이 라인강에 건설한 교량에 대한 배타적 권리 유지가 필수적이라고 강조한다."], "primary": "[발췌]\n\n[베르사유?,[주87] ] 1945년 4월 30일.\n\n독(Doc)에게. 라인강 우안(右岸)에, 지금까지 미국에 할당되어 있던 지대에서 떼어 내어 설치할 프랑스 점령지대의 기술적 측면에 관하여 4월 29일 SHAEF G–4[주88]가 작성한 각서 사본을 동봉하네.\n\n. . . . . . .\n\n제프 캐퍼리(Jeff Caffery)가 프랑스와의 교섭을 맡는다는 착상은 좋은 생각이라고 보네. 그가 어제 전보를 받은 뒤, 위넌트 씨를 대리하는 마이어(Meyer) 장군과 SHAEF G–4를 대리하는 휘플(Whipple) 대령을 포함하여 우리는 그와 만나 기술적 측면을 논의했네. SHAEF는 프랑스에 [253면] 바덴의 남부 두 관구, 곧 프라이부르크와 콘스탄츠만을 제시할 것을 강력히 권하고 있네. 프랑스에 영토를 더 주어야 할 것 같으면, 운터베스터발트, 운터란, 장크트고아르스하우젠의 크라이스(Kreise)를 포함하는 코블렌츠 동쪽의 작은 교두보를 제시할 수 있을 것이네. 그보다 더 나아가야 한다면, 바덴의 한 관구, 곧 카를스루에를 제시할 수 있을 것이네. 그러나 우리 점령군으로서는 카를스루에 관구(Bezirk)가 제공하는 항만·통신·수송 시설을 쓸 수 있는 것이 실로 바람직하네. 이 문제에 관한 연구를 동봉하네. 그것을 꼼꼼히 읽어 보면 바덴의 북부 두 관구, 곧 카를스루에와 만하임을 보유하려는 우리 SHAEF 당국의 바람이 한낱 변덕 이상의 것에 근거하고 있으며 그 뒤에 매우 실제적인 고려가 깔려 있음이 드러나리라 보네. 개인적으로 나는 그 생각을 전적으로 지지하네. 프랑스가 라인란트의 일부, 자르, 팔츠, 그리고 바덴의 일부를 받게 된다면, 그들은 감당할 수 있는 만큼은 거의 다 받는 것이며 자격이 있는 만큼도 분명히 하나도 빠짐없이 다 받는 것이라고 나는 느끼네.\n\n제프 캐퍼리는, 앞으로 여러 달 동안 우리 군대가 통과 시설을 프랑스에 의존하게 될 것이므로 그들에게 잘 대해 주어야 한다는 점을 지적했네. 우리는 프랑스의 시설에 의존하게 될 것이고, 나는 우리가 그들에게 잘 대해 주고 있다고 생각하네. 사실 우리는 지금 그들에게 그토록 많이, 다른 어느 나라보다도 훨씬 많이 주고 있으므로, 프랑스는 지극히 공정한 현재의 SHAEF 제안에 기꺼이 따라와야 마땅하다고 나는 느끼네. 소련은 물론 그들에게 아무것도 주지 않네. 영국은 라인란트의 일부, 자르, 팔츠를 그들에게 주는 멋진 몸짓을 할 수 있었는데, 이제는 영국이 애초에 바로 그 목적으로 그 땅을 유럽자문위원회(EAC)에 요구했었다는 것이 분명해졌네. 영국이 그 땅을 자기가 가질 뜻은 애초에 없었다는 것이 명백하기 때문이네.\n\n모쪼록 잘 지내게.\n\n언제나 그대의 벗,\n\n밥(Bob)\n\n[부속문서]\n\n연합국원정군최고사령부 참모장(스미스)이 유럽자문위원회 미국 대표(위넌트)의 군사고문 빈센트 마이어 준장에게 보내는 각서\n\n1945년 4월.\n\n**1.**\n\n귀하의 구두 요청에 따라, 점령지대에 관한 프랑스 측 특정 제안이 함축하는 바를 특히 미군의 군사적 소요에 비추어 연구하였다.\n\n**2.**\n\n헤센나사우, 오버헤센, 헤센다름슈타트를 프랑스에 이양하는 문제에 관한 한 프랑스 제안은 승인되지 않을 것이며 이 주(州)들은 미국 점령지대의 일부로 남으리라고 상정한다. 그렇다면 남는 것은 [254면] 바덴주와 그 일부 지역들, 그리고 라인강 동쪽 교두보를 달라는 프랑스 측 요구를 들어줄 수 있는지의 문제뿐이다.\n\n**3.**\n\n이 세 지역 각각을 내놓는 데 관계된 고려 사항들은 첨부한 부속서 A 및 B에 요약되어 있다.[주89]\n\n**4.**\n\n프랑스에는 바덴의 남부, 곧 콘스탄츠와 프라이부르크 관구(Bezirke)만을 주는 것이 바람직하다고 여겨진다(첨부 지도 참조[주90]). 최종적 타협으로 카를스루에 관구를 보탤 수 있을 것이나, 만하임 관구를 미국 지대에 보유하는 것이 필수적이라는 귀하의 견해는 강력히 지지된다.\n\n**5.**\n\n정치적 이유로 프랑스에 라인강 동안(東岸)의 교두보를 주어야 한다면, 헤센나사우주 안, 코블렌츠 동쪽의 운터베스터발트, 운터란, 장크트고아르스하우젠 크라이스(Kreise)로 이루어진 지역(첨부 지도 참조[주90])이 가장 덜 문제되는 것으로 여겨진다. 이 문제를 미국 지휘관과 프랑스 지휘관 사이에서 결정하도록 하자는 합동참모본부의 권고(전문 W–72518[주90])를 받아들이는 것은 실행 가능하다고 여겨지지 않는다.\n\n**6.**\n\n어떠한 경우에도, 미국 지대에 접한 프랑스 지대의 어느 부분이든 미국이 통과할 권리를 보장하는 명확한 합의를 프랑스와 맺는 것이 필수적이다. 이는 미국 병참선을 브레멘으로 옮기기 전만이 아니라 그 이후에도, 프랑스 항구들로의 재배치에 따르는 막대한 수송량을 감당하기 위해 긴요하다. 또한 우리가 라인강 위에 건설한 교량과 독일에 건설한 통신 시설에 대한 배타적 권리도 계속 보유해야 한다.\n\nW. B. 스미스(W. B. Smith)\n\n미 육군 중장", "secondary": "[Extracts]\n\n[Versailles ?, [주87] ] April 30, 1945.\n\nDear Doc: I enclose a copy of a memorandum prepared on April 29 by G–4 SHAEF [주88] regarding the technical aspects of a French occupational zone on the right bank of the Rhine which would be taken out of the zone heretofore allocated to the United States.\n\n. . . . . . .\n\nI think that the idea of having Jeff Caffery conduct the negotiations with the French is a good one. After he received the telegram yesterday we met with him, including General Meyer representing Mr. Winant and Colonel Whipple representing G–4 SHAEF, to discuss the technical aspects. SHAEF urges that the French be offered only [253면] the two southern provinces of Baden, namely Freiburg and Konstanz. If it seems necessary to give the French additional territory, they could be offered a small bridgehead east of Koblenz which would include the Kreise of Unterwesterwald, Unterlahn, and Sankt Goarshausen. If it is necessary to go further, they could be offered a province in Baden, namely Karlsruhe. However it is really desirable for our occupational forces to have available the port, communications, and transport facilities offered by the Bezirk of Karlsruhe. A study of this matter is enclosed. I think a careful reading of it will prove the desire of our SHAEF authorities to retain the two northern provinces of Baden, namely Karlsruhe and Mannheim, is founded on more than a whim and has back of it very practical considerations. Personally I support the idea fully. I feel that if the French are going to receive part of the Rhineland, the Saar, the Palatinate, and part of Baden they are getting about as much as they can handle and certainly every bit as much as they are entitled to.\n\nJeff Caffery made the point that we will be dependent on the French for transit facilities for our forces for a good many months to come and that it is necessary to be nice to them. We will be dependent on French facilities and I think we are being nice to them. In fact, we are giving them so much now and so much more than anybody else that I feel the French should be glad to come along with us on the present SHAEF proposal which is eminently fair. The Soviets of course give them nothing. The British have been able to make a nice gesture giving them part of the Rhineland, the Saar, and the Palatinate, which it is now clear the British asked EAC for originally for that very purpose as it is apparent that they never intended to keep it themselves.\n\nAll the best to you.\n\nYours ever,\n\nBob\n\n[Enclosure]\n\nMemorandum by the Chief of Staff, Supreme Headquarters, Allied Expeditionary Force (Smith), to Brigadier General Vincent Meyer, Military Adviser to the United States Representative on the European Advisory Commission (Winant)\n\nApril 1945.\n\n1.\n\nIn accordance with your verbal request, a study has been made of the implications of certain French proposals for a zone of occupation, with particular reference to US military requirements.\n\n2.\n\nIt is assumed that the French proposal, so far as the transfer of Hessen Nassau, Ober Hessen and Hessen Darmstadt to France is concerned, will be disapproved, and that these States will remain part of the US Zone of Occupation. There remains then only the [254면] State of Baden and portions thereof to be considered, together with the feasibility of acceding to the French request for a bridgehead east of the Rhine.\n\n3.\n\nConsiderations pertaining to the release of each of these three areas are summarized in Annexes A and B attached. [주89]\n\n4.\n\nIt is considered desirable that the French be given only the southern part of Baden (Bezirke of Konstanz and Freiburg, see attached map [주90] ). As a final compromise the Bezirke of Karlsruhe might be added; but your view that the retention of Mannheim Bezirke in the US Zone is essential is strongly supported.\n\n5.\n\nIf for political reasons, it is necessary to give the French a bridgehead on the east bank of the Rhine, the area comprising the Kreise of Unterwesterwald, Unterlahn and Sankt Goarshausen (see map attached [주90] ) east of Koblenz in the State of Hessen Nassau is considered least objectionable. To accept the JCS recommendation (cable W–72518 [주90] ) that the matter be decided between US and French Commanders is not considered practicable.\n\n6.\n\nIn any event, it is essential that a clear agreement be made with the French guaranteeing US right of passage through any part of the French zone lying contiguous to the US Zone. This is vital, not only prior to the transfer of the US line of communication to Bremen, but also thereafter to carry the great load of traffic incident to redeployment to the French ports. We must also retain the exclusive rights to bridges we have constructed over the Rhine and communications we have built in Germany.\n\nW. B. Smith\n\nLieutenant General, U. S. Army", "notes": ["[주87] 4월 한 달 동안 대독일 미국 정치고문실은 런던에서 베르사유의 SHAEF 본부(SHAEF Main)로 이전하였다.", "[주88] SHAEF의 보급부(Supply Division).", "[주89] 둘 다 인쇄하지 않음.", "[주90] 국무부 편철에서 찾지 못함.", "[주90] 국무부 편철에서 찾지 못함.", "[주90] 국무부 편철에서 찾지 못함."], "warn": false, "pages": ["253", "254"], "search": "Murphy 머피(대독일 정치고문, 편지 서명은 「Bob 밥」) Matthews 매슈스(유럽국장, 편지 호칭은 「Doc 독」) Caffery 캐퍼리(주프랑스대사, 편지에서는 「Jeff 제프」) Meyer 마이어(빈센트 마이어 준장, 유럽자문위원회 미국 대표의 군사고문) Whipple 휘플(SHAEF G–4 대령) Smith 스미스(W. B. Smith, SHAEF 참모장, 중장) Winant 위넌트(주영대사)"}, {"id": "d915", "order": 915, "date": "1945-04-30", "group": "A", "eyebrow": "d915 · The Ambassador in the United Kingdom (Winant) to the Secretary of State", "title": "주영대사(위넌트)가 국무장관에게", "badge": null, "list_right": "문서 915", "meta": [{"k": "일자", "v": "1945-04-30"}, {"k": "시각", "v": "London, April 30, 1945—8 p.m. [Received 9:15 p.m.]"}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "4389"}, {"k": "원문출처", "v": "740.00119 EW/4–3045: Telegram", "txt": true}, {"k": "발신", "v": "The Ambassador in the United Kingdom (Winant) 주영대사 위넌트", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 915 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d915"}], "summary": "홀패치가 영국 배상위원회 대표단의 모스크바 출발을 위원회 구성 문제가 매듭지어질 때까지 미루고 미국 대표단과 시기를 맞추자는 데 개인적으로 동의했으며, 다른 연합국을 끌어들이기 전에 4대 통제국 사이의 합의를 먼저 이루어야 한다는 영국 관리들의 견해를 전한 전보다.", "points": ["홀패치는 영국 대표단이 위원회 구성 문제가 정리될 때까지 모스크바로 떠나지 않고 출발 시기를 미국 대표단과 맞추자는 제안에 개인적으로 동의했다.", "영국 관리들은 다른 연합국을 끌어들이기 전에 네 통제국 사이의 합의를 먼저 이루는 데 집중하는 것이 필수적이라고 본다.", "배상은 다른 모든 연합국에 어느 정도씩 영향을 주므로 한둘만 초청하기 어렵고, 그렇다고 모두를 초청할 수도 없다는 것이다.", "4국 합의가 이루어진 뒤에는 (a) 연합국들에게 배정될 총량의 나라별 분배, (b) 인도(引渡)의 조직과 시기를 논의할 협의 기구가 필요해진다.", "(b)를 위해서는 반영구적 기구가 필요하다고 보았다. 통제 당국이 독일에서 배상을 뽑아내더라도 받는 쪽의 인도 조직까지 스스로 정할 수는 없기 때문이다.", "국무부 4월 28일자 3347호의 모든 요점에 영국이 동의할 가능성이 높으나, 모스크바 앞 970호의 끝에서 두 번째 단락 마지막 문장은 예외라고 결론지었다."], "primary": "런던, 1945년 4월 30일 오후 8시.\n [접수 오후 9시 15분]\n\n4389. 1. 홀패치(Hall-Patch)는 오늘 오후 펜로즈(Penrose)와의 대화에서, 배상위원회에 파견되는 영국 대표단이 위원회의 구성 문제가 매듭지어질 때까지 모스크바로 떠나지 말아야 하며 그 출발 시기를 미국 대표단의 출발과 맞추어 정해야 한다는 제안에 개인적으로 동의한다고 밝혔다. 그는 이 문제를 각료들과 정리해야 하겠으나 그들이 동의하리라는 것을 거의 확신한다고 덧붙였다(국무부 4월 28일 오후 7시자 3347호 참조[주70]).\n\n[1203면]\n\n2. 홀패치는, 영국 관리들이 어느 연합국이든 끌어들이기에 앞서 먼저 네 통제국 사이의 합의를 얻는 데 집중하는 것이 필수적이라고 여긴다고 말했다. 이 단계 동안 다른 어떤 유럽 연합국이든 모스크바로 초청하는 것은 바람직하지 않다고 홀패치는 생각한다. 배상은 다른 모든 연합국에 어느 정도씩 영향을 미치므로, 그들 전부를 초청하지 않고 하나 또는 몇몇만 초청하기는 어려울 것이기 때문이다. 4국 합의가 이루어지면, 그 합의를 다른 연합국들과 논의하고 (a) 그들에게 제공될 총 배정량의 나라별 분배, (b) 인도(引渡)의 조직과 시기를 결정하기 위하여 어떤 협의 기구를 채택할 것인가 하는 문제가 제기될 것이다. (a)와 (b) 두 가지 모두에 대하여, 관계된 모든 연합국이 온전히 대표되는 어떤 형태의 기구가 있어야 한다고 홀패치는 말했다. (b)를 위해서는 반영구적 기구가 필요하리라고 그는 생각한다. 통제 당국이 독일로부터 배상을 뽑아내는 일은 맡겠지만, 그들만으로는 받는 쪽에서의 인도 조직을 정할 수 없기 때문이다. (a)에 관하여 그는 다른 연합국들 사이의 분배를 곧 모스크바에 앉게 될 기구에서 다루어야 하는지 의문시한다. 아마도 그것은 (b)에 따라 설치되어야 할 기구에서 할 수 있을 것이라고 그는 덧붙였으나, 이 문제들은 신중히 검토되어야 할 것이다.\n\n3. 이 대화에서 나오는 결론은, 모스크바 앞 국무부 970호의 끝에서 두 번째 단락의 마지막 문장을 제외하고는, 모스크바 앞 국무부 970호에서 제기된 요점들을 포함하여 4월 28일자 국무부 3347호에 언급된 모든 요점에 영국이 동의할 개연성이 있어 보인다는 것이다. 홀패치가 각료들과 이 문제를 정리하는 대로 곧바로 알리겠다.\n\n파리에 229호로, 모스크바에 152호로 반복 전달함.\n\n위넌트(Winant)", "secondary": "London, April 30, 1945—8 p.m. \n [Received 9:15 p.m.]\n\n4389. 1. Hall-Patch, in a conversation with Penrose this afternoon, expressed his personal agreement with the suggestion that the United Kingdom Delegation to the Reparations Commission should not leave for Moscow until the question of the composition of the Commission has been settled, and that its time of departure should be arranged to coincide with that of the United States delegation. He added that he would have to clear the matter with Ministers but he was almost certain that they would agree (reDepts 3347, April 28, 7 p.m. [주70] ).\n\n[1203면]\n\n2. Hall-Patch said that United Kingdom officials consider it to be essential to concentrate first on obtaining agreement among the four controlling powers before bringing in any of the Allies. During this stage Hall-Patch thinks it would be undesirable to invite any other European Allies to Moscow. Since reparation affects all the other Allies in some degree so would be difficult to invite one or a few without inviting all of them. When four-power agreement is reached the question will arise what machinery for consultation with the other Allies shall be adopted to discuss the agreement with them and to decide (a) allocation among them of the overall allocation to be made available to them, (b) the organization and timing of deliveries. For both (a) and (b), Hall-Patch said, there must be some form of machinery on which all the Allies concerned are fully represented. For (b) he thinks that semi-permanent machinery will be necessary. Though the control authorities will deal with the extraction of reparation from Germany they cannot by themselves determine the organization of deliveries at the receiving end. As regards (a) he doubts whether allocation between the other Allies should be dealt with on the body about to sit in Moscow. Possibly, he added, it can be done on the body that will have to be set up under (b), but these matters will have to be considered carefully.\n\n3. The conclusion from this conversation is that it seems probable that the United Kingdom will agree with all the points mentioned in Department’s 3347, April 28 including the points raised in Department’s 970 to Moscow with the exception of the last sentence in the penultimate paragraph of Department’s 970 to Moscow. We will inform you immediately when Hall-Patch has cleared the matter with Ministers.\n\nRepeated to Paris as 229 and Moscow as 152.\n\nWinant", "notes": ["[주70] 1201면 각주 65 참조."], "warn": false, "pages": ["1203"], "search": "Winant 위넌트(주영대사) Hall-Patch 홀패치(영국 외무부 관리) Penrose 펜로즈(주영 미국대사관)"}, {"id": "d81", "order": 81, "date": "1945-05-01", "group": "A", "eyebrow": "d81 · The Acting Secretary of State to the Ambassador in the United Kingdom (Winant)", "title": "국무장관 대리가 주영대사(위넌트)에게", "badge": null, "list_right": "문서 81", "meta": [{"k": "일자", "v": "1945-05-01"}, {"k": "시각", "v": "Washington, May 1, 1945—3 p.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "3400"}, {"k": "원문출처", "v": "740.019 EAC/4–45: Telegram", "txt": true}, {"k": "발신", "v": "The Acting Secretary of State (Grew) 국무장관 대리 그루", "txt": true}, {"k": "수신", "v": "The Ambassador in the United Kingdom (Winant) 주영대사 위넌트", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 81 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d81"}], "summary": "오스트리아 점령지대에 관한 소련의 수정안 가운데 다뉴브강 이북 상(上)오스트리아와 부르겐란트의 소련 지대 편입에는 군사적 이의가 없으나, 빈 4국 분할 지역을 1938년 이전의 빈 시역으로 한정하자는 소련안은 미군 몫의 비행장이 하나도 남지 않으므로 수락할 수 없다는 미국 정부의 견해를 전한 전보다.", "points": ["다뉴브강 이북 상(上)오스트리아 지방과 부르겐란트의 슈타이어마르크 부분을 소련 지대로 하자는 소련 수정안에는 군사적 이의가 없다.", "4국 부대가 점령할 빈 지역을 1938년 이전의 빈 시역으로 한정하자는 소련안은 수락할 수 없다.", "1938년 이전 빈 시역을 나눌 경우 소련 점령 예정 구역에 그 안의 유일하게 알려진 비행장이 들어 있어, 대(大)빈 지역의 알려진 비행장 다섯 곳이 모두 소련 통제 아래 놓이게 된다.", "미국은 4월 5일자 서한에 담긴 대(大)빈 분할안을 밀어붙여야 한다고 보았다. 비행장 배분이 더 공평해지기 때문이다.", "다뉴브강 이북 상오스트리아를 소련 지대에 넣는 데 미국이 동의하는 것을, 대빈 분할에 관한 미국안에 소련의 동의를 얻어 내는 지렛대로 쓸 수 있으리라고 제안했다.", "이 견해들은 4월 22일 육군부가 매크니 장군에게 보낸 72646호 전보보다 앞선 것으로, 그 전보에서는 빈의 미국 지대에 적절한 부대 시설을 갖춘 비행장 하나가 반드시 포함되어야 하나 그 비행장이 있는 가우나 구역 전체를 고집할 필요는 없다는 쪽으로 수정되었다."], "primary": "워싱턴, 1945년 5월 1일 오후 3시.\n\n3400. 합동참모본부와 육군부·해군부는 이제, 귀하의 4월 4일 자정자 3449호(Cornea 205)에 기술된, 오스트리아 점령지대에 관한 유럽자문위원회 내 영국 제안을 수정하자는 소련 대표의 제의를 검토하였다. 우리 정부의 견해는 다음과 같다.\n\n**1.**\n\n다뉴브강 이북의 상(上)오스트리아 지방 부분과 부르겐란트의 슈타이어마르크 부분을 소련 지대의 일부로 하자는 소련 수정안에는 아무런 군사적 이의가 없다.\n\n**2.**\n\n그러나 빈 지역에서 4국 부대가 점령할 구역을 1938년 이전의 빈시(市)로 한정하자는 소련 제안은 수락할 수 없다. 빈시만을 세분하자는 애초의 소련 제안을 검토하면서, 육군장관과 해군장관은 1월 4일자 서한[주8]에서 빈의 미국 세분 구역이 그 구역 안에 미군을 위한 충분한 항공 시설을 두려면 시(市) 경계 너머로 충분히 뻗어 나가야 한다는 점을 지적하였다. 그들은 또한 대(大)빈의 세분에 관한 영국 제안에 대한 소견을 담은 4월 5일자 서한[주9]에서, 미국 세분 구역에 미군을 위한 충분한 항공 시설이 포함되어야 한다고 밝혔다. 이 서한에는 미군에 적합한 항공 시설을 제공할 대빈 세분에 관한 미국안이 포함되어 있었다. 1938년 이전 빈시를 나누는 것은 빈 지역의 미군에게 알려진 항공 시설을 전혀 보장해 주지 못할 것이다. 지금 소련 점령용으로 제안된 세분 구역이 그 지역 안에 알려진 유일한 비행장을 품고 있기 때문이다. 그러한 분할은 대빈 지역에 있는 것으로 알려진 다섯 개 비행장 전부가 소련의 통제 아래 놓이는 결과를 낳을 것이다. 위에서 언급한 4월 5일자 서한에서 제안한 대로 대빈을 나눌 것을 미국이 밀어붙여야 한다고 여겨진다. 그러한 분할이 비행장의 보다 공평한 배분을 가져올 것이기 때문이다.\n\n다뉴브강 이북 상오스트리아 지역을 소련 지대에 포함시키는 데 미국이 동의하는 것을, 대빈의 분할에 관한 미국 제안에 소련의 동의를 얻어 내는 근거로 삼을 수 있으리라고 본다.\n\n위의 견해는 육군부가 4월 22일 [108면] 매크니(McNarney) 장군에게 72646호로 보낸 전보[주10]에 앞서 합동참모본부가 표명한 것이다. 그 전보는, 유럽자문위원회에서 빈의 지대 설정에 관하여 아직 매듭짓지 못한 사항들을 검토한 뒤 최종 승인을 위해 정부에 제출할 권고안을 마련하도록 매크니 장군에게 빈으로 가거나 대표를 보내라고 지시한 것이었다. 그 전보에서 앞서 말한 합동참모본부의 견해는, 적절한 부대 시설을 갖춘 비행장 하나가 반드시 빈의 미국 지대의 일부를 이루어야 하되, 그럴 경우 그 비행장이 위치할 수 있는 가우(Gau) 전체나 구역 전체를 고집할 필요는 없다고 매크니 장군에게 지시하는 만큼 수정되었다.\n\n런던에 국무부 3400호로 발송하고, 카세르타의 에르하르트 앞 미국 정치고문실에 국무부 415호로 반복 전달함.\n\n그루(Grew)", "secondary": "Washington, May 1, 1945—3 p.m.\n\n3400. The Joint Chiefs of Staff and the War and Navy Departments have now considered the proposal of the Soviet representative to amend the British proposal in the European Advisory Commission for zones of occupation in Austria described in your 3449 April 4, midnight, Cornea 205. The views of this Government are as follows:\n\n1.\n\nThere are no military objections to the Soviet amendment that the part of the province of Upper Austria north of the Danube River and the Styrian part of Burgenland be made parts of the Soviet zone.\n\n2.\n\nHowever, the Soviet proposal that the area to be occupied by the quadripartite forces in the Vienna area should be limited to the pre-1938 City of Vienna is not acceptable. In consideration of the original Soviet proposal for subdivision of only the City of Vienna, the Secretaries of War and Navy pointed out in a letter of January 4 [주8] that the U.S. subdivision in Vienna must extend sufficiently beyond the city limits to provide adequate air facilities for U.S. forces within the U.S. subdivision. They also stated in a letter of April 5 [주9] containing comments on the British proposal for subdivision of Greater Vienna that the U.S. subdivision must include adequate air facilities for U.S. forces. This letter included a U.S. proposal for subdivision of Greater Vienna that would provide suitable air facilities for U.S. forces. Division of the pre-1938 City of Vienna will not assure any known air facilities to the U.S. forces in the Vienna area, in as much as the subdivision now proposed for Soviet occupation contains the only known airfield within the area. Such a division would result in all five of the airfields known to be in the Greater Vienna area being under Soviet control. It is believed that the U.S. should press for the division of Greater Vienna as proposed in the letter of April 5 which is mentioned, in as much as such a division would result in a more equitable distribution of airfields.\n\nIt is suggested that U.S. agreement to the inclusion of that area of Upper Austria north of the Danube River in the Soviet zone could probably be used as a basis for getting Soviet agreement to the U.S. proposal on the division of Greater Vienna.\n\nThe foregoing views were expressed by the Joint Chiefs of Staff prior to a telegram addressed by the War Department to General [108면] McNarney on April 22 as number 72646, [주10] instructing him to go or send a representative to Vienna to arrive at recommendations for submission to the Government for final approval after consideration in the European Advisory Commission of points relating to the zoning of Vienna not yet settled. In that telegram the foregoing views of the Joint Chiefs of Staff were modified to the extent of instructing General McNarney that an airfield with adequate supporting facilities must be an integral part of the United States zone in Vienna, but that in that case it would not be necessary to insist on the entire Gau or the entire district in which the airfield might be located.\n\nSent to London as Department’s no. 3400; repeated to AmPolAd, Caserta, for Erhardt, as Department’s no. 415.\n\nGrew", "notes": ["[주8] 이 서한의 요지는 런던 앞 1월 5일자 전보 117호(3면)에 인용된 합동참모본부의 견해를 참조.", "[주9] 이 서한의 요지는 런던 앞 4월 5일자 전보 2658호(45면)에 인용된 합동참모본부의 견해를 참조.", "[주10] 인쇄하지 않음. 96면 각주 80 참조."], "warn": false, "pages": ["108"], "search": "Grew 그루(국무장관 대리) Winant 위넌트(주영대사) McNarney 매크니(Joseph T. McNarney 장군) Erhardt 에르하르트(오스트리아 문제 미국 정치고문)"}, {"id": "d82", "order": 82, "date": "1945-05-01", "group": "A", "eyebrow": "d82 · The Chargé in the Soviet Union (Kennan) to the Secretary of State", "title": "주소련 대리대사(케넌)가 국무장관에게", "badge": null, "list_right": "문서 82", "meta": [{"k": "일자", "v": "1945-05-01"}, {"k": "시각", "v": "Moscow, May 1, 1945—10 p.m. [Received May 1—6:45 p.m.]"}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": "1431"}, {"k": "원문출처", "v": "740.00119 E.A.C./5–145: Telegram", "txt": true}, {"k": "발신", "v": "The Chargé in the Soviet Union (Kennan) 주소련 대리대사 케넌", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 82 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d82"}], "summary": "오스트리아 임시정부 수립에 관해 소련이 협의하지 않은 데 항의하고 미국 대표를 즉시 빈으로 보내겠다는 서한을 비신스키에게 보내면서, 소련은 유럽자문위원회가 점령지대를 확정할 때까지 연합국 대표의 빈 입성을 허용하지 않겠다는 입장을 되풀이했다고 보고한 전보다.", "points": ["영국 대리대사도 같은 훈령을 받아, 케넌은 국무부 4월 30일 오후 9시자 981호에 따라 비신스키에게 서한을 보내고 있다.", "소련은 유럽자문위원회가 점령지대 문제를 매듭지을 때까지 미국 대표들의 빈 입성을 허용하지 않겠다는 결정을 고수한다.", "비신스키의 각서는 「미국·영국·프랑스 장교들」이 EAC가 「오스트리아와 빈」의 점령지대 배분을 정한 뒤에 「임시 통제기구」의 사업에 참여하러 빈에 올 수 있다고 적었다.", "비신스키는 4월 25일자 각서에서 언급한 이 문제 결정의 시급성을 되풀이하고, 톨부힌 원수에게 그에 상응하는 지시가 내려졌다고 덧붙였다.", "케넌은 그 마지막 대목을, EAC 합의가 이루어지는 즉시 미국 대표들을 받아들이도록 원수에게 지시가 내려졌다는 뜻으로 받아들였다.", "케넌은 서한에서, 4월 29일 구두로 전달받고 오늘 각서로 되풀이된 통고에 대해 본국의 구체적 반응은 아직 받지 못했으나 지금까지 받은 훈령으로 보아 미국 정부는 연합국 대표들이 즉시 빈으로 가야 한다고 여전히 여긴다고 밝혔다."], "primary": "모스크바, 1945년 5월 1일 오후 10시.\n [접수 5월 1일 오후 6시 45분]\n\n1431. 영국 대리대사도 비슷한 훈령을 받았으므로, 나는 오스트리아 임시정부에 관하여 러시아 측이 우리와 협의하지 않은 일 및 우리 대표가 즉시 빈으로 가야 한다는 우리의 희망에 관하여, 국무부 4월 30일 오후 9시자 981호의 취지에 따라 오늘 비신스키(Vyshinski)에게 서한을 보낸다.\n\n언급한 국무부 전보에는, 유럽자문위원회가 점령지대에 관한 조치를 끝마칠 때까지 우리 대표들을 빈에 들이지 않겠다는 소련의 결정에 관한 나의 4월 29일 오후 6시자 1413호를 국무부가 받았는지 여부가 나타나 있지 않다. 나는 오늘 이 입장을 되풀이하는 각서를 비신스키로부터 받았다. 이 각서에서 비신스키는, 유럽자문위원회가 「오스트리아와 빈」의 점령지대 배분을 정하게 되면 「미국·영국·프랑스 장교들」이 「임시 통제기구」의 사업에 참여하기 위해 빈으로 올 수 있다고 밝히고 있다. 이어 그는 4월 25일자 각서(주소련대사관 4월 25일 오후 7시자 1348호 참조)에 담긴, 이 문제에 관한 결정의 시급성에 대한 언급을 되풀이한다. 그는 톨부힌(Tolbukhin) 원수에게 그에 상응하는 지시가 내려졌다고 덧붙인다. 나는 이 마지막 말이, 유럽자문위원회가 합의에 이르는 즉시 우리 대표들을 받아들일 조치를 취하도록 원수가 지시받았다는 뜻이라고 받아들인다.\n\n[109면]\n\n국무부가 언급된 훈령을 기초할 당시 나의 4월 29일 오후 6시자 1413호를 보았는지 확실치 않으므로, 나는 서한에서 비신스키에게, 4월 29일 나에게 구두로 전달되고 오늘 받은 각서에서 되풀이된 통고에 대하여 우리 정부의 구체적 반응은 아직 받지 못하였으나 지금까지 내가 받은 훈령들로 보아 우리 정부는 연합국 대표들이 즉시 빈으로 가야 한다고 여전히 여기고 있다고 밝히고 있다.\n\n국무부에 1431호로 발송하고, 카세르타의 에르하르트 앞에 79호, EAC를 위해 런던에 187호, 파리에 89호로 반복 전달함.\n\n케넌(Kennan)", "secondary": "Moscow, May 1, 1945—10 p.m. \n [Received May 1—6:45 p.m.]\n\n1431. The British Chargé having received similar instructions, I am addressing a letter to Vyshinski today along the lines of the Department’s 981, April 30, 9 p.m., concerning Russian failure to consult us with respect to the Provisional Government in Austria and our desire that our representative should proceed at once to Vienna.\n\nThe Department’s telegram under reference does not indicate whether the Department had received my 1413, April 29, 6 p.m. concerning the Soviet decision not to admit our representatives to Vienna until EAC has completed action on zones of occupation. I have today received a note from Vyshinski reiterating this position. In this note Vyshinski states that “the American, British and French officers” may come to Vienna to participate in the work of “the provisional control mechanism” when EAC shall have determined the distribution of the zones of occupation “of Austria and Vienna”. He then repeats the reference contained in his note of April 25 (ReEmbs 1348, April 25, 7 p.m.) to the urgency of a decision in this question. He adds that corresponding instructions have been given to Marshal Tolbukhin. I take it that this last means that the Marshal has been directed to make arrangements to admit our representatives as soon as EAC has reached its agreement.\n\n[109면]\n\nIn view of the uncertainty as to whether the Department had seen my 1413, April 29, 6 p.m. at the time when it drafted its instruction under reference, I am stating to Vyshinski in my letter that while I have not had a specific reaction from my Government to the communication made to me orally on April 29 and repeated in his note received today, the instructions which I have received to date indicate that my Government still considers it necessary that the Allied representatives should proceed at once to Vienna.\n\nSent Department as 1431, repeated to Caserta for Erhardt as 79; London for EAC as 187; and Paris as 89.\n\nKennan", "notes": [], "warn": false, "pages": ["109"], "search": "Kennan 케넌(주소련 대리대사) Vyshinski 비신스키(소련 외무인민위원 대리) Tolbukhin 톨부힌(소련 원수) Erhardt 에르하르트(오스트리아 문제 미국 정치고문)"}, {"id": "d200", "order": 200, "date": "1945-05-01", "group": "A", "eyebrow": "d200 · The Ambassador in the United Kingdom (Winant) to the Secretary of State", "title": "주영대사(위넌트)가 국무장관에게", "badge": null, "list_right": "문서 200", "meta": [{"k": "일자", "v": "1945-05-01"}, {"k": "시각", "v": "London, May 1, 1945—noon. [Received May 1—10:25 a.m.]"}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "4390 (Cornea 226)"}, {"k": "원문출처", "v": "740.00119 EAC/5–145: Telegram", "txt": true}, {"k": "발신", "v": "The Ambassador in the United Kingdom (Winant) 주영대사 위넌트", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 200 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d200"}], "summary": "영국 대표단이 캐나다의 강한 압력을 받아, 독일 패배에 관한 연합국 선언 전문(前文)에 「독일의 패배에 적극 참가한 다른 국제연합국들」을 넣는 수정안을 유럽자문위원회에 내겠다고 통고했다는 보고다.", "points": ["스트랭이 모즐리에게 비공식으로, 영국 대표단이 유럽자문위원회에 낼 중요한 추가 문구를 알렸다.", "전문 제4단락의 「각자의 정부의 권한에 따라 그리고 국제연합국들의 이익을 위하여 행동하며」를 「각자의 정부 및 독일의 패배에 적극 참가한 다른 국제연합국들의 권한에 따라 그리고 모든 국제연합국들의 이익을 위하여 행동하며」로 바꾸자는 것이다.", "스트랭은 이 추가를 강력히 주장하라는 자국 정부의 직접 훈령을 받았으며, 이 결정은 캐나다의 강한 압력 아래 이루어졌다고 밝혔다.", "캐나다 정부는 항복문서나 선포문이 현재 문언 그대로 나오면 항의 성명을 낼 뜻이라고 한다. 4대국 이외 국제연합국들의 기여가 제대로 인정되지 않았다는 것이다.", "이 문구를 넣으면 항복문서의 실제 본문을 유럽 국제연합국 정부들, 자치령들, 브라질에 제출하고 그들을 대신해 서명할 권한을 받아야 하게 된다고 스트랭은 답했다.", "항복문서 제12조 (b)의 「추가 요구 사항」도 마찬가지로 모든 서명 위임 정부의 승인을 받아야 하느냐는 물음에 스트랭은 아마 그렇게 될 것이라고 답했다.", "위넌트는 이 제안이 유럽자문위원회에 제출될 때 논평을 보류하겠다고 했으며, 군사 상황의 전개상 이 영국 수정안을 검토할 여유가 없을지도 모른다고 덧붙였다."], "primary": "런던, 1945년 5월 1일 정오.\n[접수 5월 1일 오전 10시 25분]\n\n4390. Cornea 226. 나의 4월 2일자 공문 제22112호[주91]로 송부한, 독일의 패배에 관한 영국 측 연합국 선언 초안과 관련하여, 스트랭(Strang)은 그가 유럽자문위원회에 제출하려는 중요한 추가 문구를 모즐리(Mosely)에게 비공식으로 알려 왔다. 전문(前文) 제4단락에서 영국 대표단은 「각자의 정부의 권한에 따라 그리고 국제연합국들의 이익을 위하여 행동하며」라는 말을 「각자의 [255면] 정부 및 독일의 패배에 적극적으로 참가한 다른 국제연합국들의 권한에 따라 그리고 모든 국제연합국들의 이익을 위하여 행동하며」라는 말로 바꾸자고 제안할 것이다.\n\n스트랭은 이 추가를 강력히 주장하라는 자국 정부의 직접 훈령을 받고 있으며, 이 결정은 캐나다의 강한 압력 아래 내려진 것이라고 밝혔다. 그가 말하기로, 캐나다 정부는 항복문서 또는 항복 선포문이 현재의 문언대로 나올 경우 항의 성명을 낼 뜻이며, 그 문언은 독일의 패배에 4대 강국 이외의 국제연합국들이 한 기여를 충분히 인정하지 않는다고 캐나다는 여긴다고 한다.\n\n모즐리가 캐묻자 스트랭은, 이 추가 문언은 항복문서의 실제 본문을 유럽 국제연합국 정부들, 자치령들[of?] 및 브라질에 제출하고 그들을 대신하여 문서에 서명할 권한을 그들로부터 받는 일을 요구하게 될 것이라고 밝혔다. 인도(印度) 정부와도 마찬가지로 협의하게 될지에 대해서는 확신하지 못하였다. 이 수정이 항복문서 제12조 (b)에 예정된 「추가 요구 사항」도 마찬가지로, 자기들을 「대신하여」 문서에 서명하도록 권한을 부여한 모든 정부의 승인을 받아야 함을 뜻하는지 묻자, 스트랭은 아마 그렇게 될 것이라고 밝혔다.\n\n캐나다 대사가 국무부에 행한 진술을 보고한 국무부 3월 23일 오전 11시자 2233호에 비추어, 나는 이 제안이 유럽자문위원회에 제출될 때 논평을 보류하겠다. 군사 정세의 전개가 이 영국 수정안의 검토를 허락하지 않을 수도 있다. 이 수정안은 항복문서를 교섭하는 동안 장황하게 논쟁되었고 현재의 문언 쪽으로 확정적으로 결정되었던 문제를 다시 여는 것이다.\n\n위넌트(Winant)", "secondary": "London, May 1, 1945—noon.\n[Received May 1—10:25 a.m.]\n\n4390. Cornea 226. In connection with the UK draft Allied declaration regarding the defeat of Germany, transmitted in my despatch No. 22112 of April 2, [주91] Strang has informed Mosely informally of an important addition which he intends to present in the European Advisory Commission. In the fourth paragraph of the preamble the UK Delegation will propose that the words “acting by authority of their respective governments and in the interests of the United Nations” be replaced by the words “acting by authority of their respective [255면] governments and others of the United Nations which have actively participated in the defeat of Germany and in the interests of all the United Nations”.\n\nStrang stated that he is under direct instruction of his Government to urge this addition and that this decision was taken under strong Canadian pressure. The Canadian Government, he said, intends to issue a statement of protest if the instrument or proclamation of surrender is issued in its present language, which it feels, gives inadequate recognition to the contribution made by United Nations other than the four major powers to Germany’s defeat.\n\nWhen questioned by Mosely, Strang stated that this additional language would require submitting the actual text of the surrender instrument to the Governments of the European United Nations, if [of?] the Dominions and Brazil and receiving from them authorization to sign the instrument on their behalf. He was uncertain whether the Government of India would be similarly consulted. Asked whether this amendment meant that the “additional requirements” foreseen in article 12 (b) of the surrender instrument would have to be similarly approved by all governments authorizing signature of the instrument “on their behalf”, Strang stated that this would presumably be the case.\n\nIn view of Department’s 2233, March 23, 11 a.m., reporting the representations made by the Canadian Ambassador to the Department, I shall withhold comment on this proposal when it is presented in the European Advisory Commission. The military developments may not permit consideration of this UK amendment; the latter reopens a question which was argued at great length during the negotiation of the surrender instrument and was definitely decided in favor of the present wording.\n\nWinant", "notes": ["[주91] 공문 22112호는 인쇄하지 않음. 영국 초안 및 3월 30일자 각서의 본문은 208면 참조."], "warn": false, "pages": ["255"], "search": "Winant 위넌트(주영대사) Strang 스트랭(William Strang, 유럽자문위원회 영국 대표) Mosely 모즐리(Philip E. Mosely, 유럽자문위원회 미국 대표단)"}, {"id": "d201", "order": 201, "date": "1945-05-01", "group": "A", "eyebrow": "d201 · The Ambassador in France (Gaffery) to the Secretary of State", "title": "주프랑스대사(캐퍼리)가 국무장관에게", "badge": null, "list_right": "문서 201", "meta": [{"k": "일자", "v": "1945-05-01"}, {"k": "시각", "v": "Paris, May 1, 1945—noon. [Received May 1—10:45 a.m.]"}, {"k": "장소", "v": "Paris", "txt": true}, {"k": "전문번호", "v": "2247"}, {"k": "원문출처", "v": "740.00119 Control (Germany)/5–145: Telegram", "txt": true}, {"k": "발신", "v": "The Ambassador in France (Caffery) 주프랑스대사 캐퍼리", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 201 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d201"}], "summary": "머피와 SHAEF 장교들이 캐퍼리를 찾아와, 미국 지대에서 떼어 낼 프랑스 점령지대는 국무부 1740호가 기술한 것보다 훨씬 줄여야 한다는 의견을 설명했고, 캐퍼리는 국무부의 새 지시가 올 때까지 모든 조치를 보류하겠다고 답했다는 보고다.", "points": ["레버 씨와의 어제 저녁 대화에 관한 보고다.", "국무부 4월 28일자 1740호에 대한 조치를 미뤄 달라는 요청이 있은 뒤, 머피 대사가 전화로 EAC의 마이어 장군과 SHAEF 장교 몇 사람을 데리고 와서 그 요청의 이유를 설명하겠다고 알려 왔다.", "머피와 장교들은 미국 지대에서 떼어 낼 프랑스 점령지대가 국무부 1740호에 기술된 것이 아니라 상당히 축소되어야 한다는 의견을 밝혔다.", "캐퍼리는 국무부로부터 다시 연락을 받을 때까지 모든 조치를 보류하겠다고 답했다.", "각주에 따르면, 4월 30일 대서양 횡단 전화 통화에서 레버가 프랑스의 점령지대 수락 상황을 물었고, 캐퍼리는 SHAEF가 입장을 바꾸어 바덴·뷔르템베르크·지크마링겐 전부를 프랑스에 할당하는 데 더는 동의하지 않는다고 보고했다."], "primary": "파리, 1945년 5월 1일 정오.\n[접수 5월 1일 오전 10시 45분]\n\n2247. 어제 저녁 레버(Reber) 씨와 나눈 대화에 관하여.[주92] 국무부 [256면] 4월 28일자 1740호에 대한 조치를 미뤄 달라는 요청(나의 4월 29일자 2211호[주93]) 이후, 머피 대사가 나에게 전화하여, 그 유예 요청이 이루어진 까닭을 나에게 설명하기 위해 EAC의 마이어(Meyer) 장군과 SHAEF의 장교 몇 사람을 데리고 오라는 요청을 받았다고 알려 왔다. 머피 대사와 그와 함께 온 장교들은, 그들의 의견으로는 미국 지대에서 떼어 낼 프랑스 점령지대로 제시된 것이 국무부 1740호에 기술된 지역이어서는 안 되며 상당히 축소되어야 한다고 나에게 설명하였다.\n\n머피와 그와 함께 온 장교들에게 나는, 국무부로부터 다시 연락을 받을 때까지 모든 조치를 보류하겠다고 답하였다.\n\n캐퍼리(Caffery)", "secondary": "Paris, May 1, 1945—noon.\n[Received May 1—10:45 a.m.]\n\n2247. My conversation last evening with Mr. Reber. [주92] Following the request (my 2211, April 29 [주93] ) to delay action on Department’s [256면] 1740, April 28, Ambassador Murphy telephoned me that he had been asked to bring General Meyer of EAC and several officers from SHAEF to see me to explain why the request had been made to delay action. Ambassador Murphy and the officers with him explained to me that in their opinion the suggested French occupied zone to be taken out of the American zone should not be that described in the Department’s 1740, but considerably reduced.\n\nIn reply to Murphy and the officers with him I stated that I would withhold all action until I heard again from the Department of State.\n\nCaffery", "notes": ["[주92] 4월 30일의 대서양 횡단 전화 통화에서, 유럽국장(매슈스)의 특별보좌관 새뮤얼 레버(Samuel Reber) 씨가 주프랑스대사에게 국무부 4월 28일자 전보 1740호에 기술된 대로의 독일 내 점령지대를 프랑스가 수락하는 문제의 상황을 물었다. 캐퍼리 대사는 SHAEF가 입장을 바꾸어 바덴, 뷔르템베르크, 지크마링겐 전부를 프랑스에 할당하는 데 더 이상 동의할 뜻이 없다고 보고하였다(740.00119 Control (Germany)/4–3045).", "[주93] 인쇄하지 않음. 이 전보는 베델 스미스 중장을 거쳐 접수된 런던의 위넌트 대사의 요청에 비추어 국무부 4월 28일자 전보 1740호에 대한 조치를 미루고 있다고 보고한 것이다(740.00119 Control (Germany) 4–2945)."], "warn": false, "pages": ["256"], "search": "Caffery 캐퍼리(주프랑스대사) Reber 레버(Samuel Reber, 유럽국장 특별보좌관) Murphy 머피(대독일 정치고문) Meyer 마이어(빈센트 마이어 준장) Matthews 매슈스(유럽국장) Bedell Smith 베델 스미스(중장) Winant 위넌트(주영대사)"}, {"id": "d202", "order": 202, "date": "1945-05-01", "group": "A", "eyebrow": "d202 · The Ambassador in the United Kingdom (Winant) to the Secretary of State", "title": "주영대사(위넌트)가 국무장관에게", "badge": null, "list_right": "문서 202", "meta": [{"k": "일자", "v": "1945-05-01"}, {"k": "시각", "v": "London, May 1, 1945—midnight. [Received 11:14 p.m.]"}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "4419 (Cornea 227)"}, {"k": "원문출처", "v": "740.00119 EAC/5–145: Telegram", "txt": true}, {"k": "발신", "v": "The Ambassador in the United Kingdom (Winant) 주영대사 위넌트", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 202 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d202"}], "summary": "5월 1일 밤 유럽자문위원회에서 스트랭이 독일 무조건항복문서를 독일에 제시하기 전에 유럽 연합국 정부들에 보여 승인을 받자고 거듭 주장했고, 마시글리가 이를 지지했으며 구세프는 본국에 다시 물어보겠다고 했고 위넌트는 입장을 유보했다는 보고다.", "points": ["스트랭은 독일 무조건항복문서의 본문을 독일에 제시하기 전에 유럽 연합국 정부들에 보이고 승인을 받자고 강력히 주장했다. 그렇게 하면 4국의 입지가 더 강해진다는 것이다.", "마시글리가 영국 제안을 지지했고, 구세프는 본국 정부에 이 문제를 다시 제기하겠다고 약속했으며, 위넌트는 국무부 1월 11일 자정자 244호에 따라 입장을 유보했다.", "협의 대상으로 스트랭이 든 것은 (1) EAC 협의위원회가 그 대표들과 만나 온 유럽 연합국들(구세프의 요청으로 그 협의에서 배제된 폴란드는 이렇게 피해 간다), (2) 영국 자치령들과 인도, (3) 「아마도」 브라질이다.", "「적극적」 연합국들도 항복 선포문에 서명하느냐는 위넌트의 물음에 스트랭은 아니라고 답했다.", "스트랭은 캐나다 같은 나라의 여론을 위해, 그 정부들이 나중에 항복 조건에 관해 협의를 받았고 승인했다고 말할 수 있는 것이 중요하다고 느꼈다.", "어느 연합국 정부가 협의를 받고 승인을 거부하면 4국의 처지가 어떻게 되느냐는 물음에, 스트랭은 이미 요약본을 근거로 협의를 받았으므로 승인이 나오리라 확신한다고 했다.", "위넌트는, 영국이 자치령과 서유럽 연합국들의 승인을 얻지 않는 데서 오는 악영향을 매우 불안해하고 있으나, 스트랭 수정안의 넓은 문언은 「적극적 연합국들」이 앞으로 독일에 부과할 모든 조건과 요구에 직접 발언권을 요구할 길을 열어 준다고 논평했다."], "primary": "런던, 1945년 5월 1일 자정.\n[접수 오후 11시 14분]\n\n4419. Cornea 227. 오늘 밤 유럽자문위원회 회의에서 스트랭은, 독일 무조건항복문서의 본문을 독일 측에 제시하기에 앞서 유럽 연합국 정부들에 보이고 그 문서에 대한 그들의 승인을 확보하자고 다시 한번 강력히 요청하였다. 스트랭은 그러한 승인을 받으면 4개 연합국이 더 강한 처지에 서게 되리라고 여긴다. 마시글리(Massigli)가 영국 제안을 지지하였다. 구세프(Gousev)는 이 문제를 자국 정부에 다시 제기하겠다고 약속하였다. 국무부 1월 11일 자정자 244호에 따라 나는 입장을 유보하였다.\n\n협의 문제에 관한 논의는 뒤에, 스트랭이 나의 5월 1일 정오자 4390호로 송부한 독일 항복에 관한 영국 측 선포문 초안 제4단락에 대한 자신의 수정안을 정식으로 제출하면서 다시 이어졌다. 어떤 연합국 정부들이 협의 대상이 되느냐는 구세프의 물음에 스트랭은 다음을 들었다 — (1) 유럽자문위원회 협의위원회가 그 대표들과 회합해 온 유럽 연합국들. 이로써 구세프의 요청에 따라 그 협의에서 배제되었던 폴란드는 비껴 가게 된다. (2) 영국 자치령들과 인도(印度). (3) 「아마도」 브라질.\n\n「적극적(active)」 연합국들도 항복 선포문에 서명하게 되느냐는 나의 물음에 스트랭은 아니라고 답하였다. 그러나 그는 캐나다와 같은 나라들의 여론을 위해서는 그 정부들이 나중에 자신들이 항복 조건에 관하여 협의를 받았고 이를 승인하였다고 말할 수 있는 것이 중요하리라고 느꼈다. 어느 연합국 정부든 협의를 받고 그 문서의 승인을 거부할 경우 4개국 정부의 처지가 어떻게 되겠느냐는 나의 거듭된 물음에 대하여, 스트랭은 그들이 이미 [257면] 그 문서의 요약본을 근거로 협의를 받은 바 있으므로 승인이 나오리라고 확신한다고 느꼈다.\n\n항복문서에도 비슷한 수정이 필요하겠느냐는 구세프의 물음에 스트랭은 확답을 삼갔으나, 그러한 추가로 문서가 「크게 개선될」 것이라는 견해를 밝혔다. 영국이 자치령들과 서유럽 연합국들 사이에서, 그들의 항복문서 승인을 확보하지 않는 데서 오는 나쁜 영향을 매우 불안해하고 있음은 분명하다. 다른 한편으로, 선포문 초안에 대한 스트랭 수정안의 넓은 문언은 「적극적 연합국들」이 앞으로 독일에 부과될 모든 조건과 요구 사항에 직접적인 발언권을 요구할 길을 열어 줄 것이다.\n\n위넌트(Winant)", "secondary": "London, May 1, 1945—midnight.\n[Received 11:14 p.m.]\n\n4419. Cornea 227. At tonight’s meeting of the European Advisory Commission Strang again made a strong plea for showing the text of the German unconditional surrender instrument to the European Allied Governments and securing their approval of the instrument prior to presenting it to the Germans. Strang feels that the 4 Allies will be in a stronger position if such approval is received. Massigli supported the British proposal. Gousev promised to raise the question again with his Government. In accordance with Department’s 244 January 11, midnight I reserved my position.\n\nFurther discussion of the question of consultation followed later when Strang formally introduced his proposed amendment to the fourth paragraph of the United Kingdom draft proclamation on German surrender, transmitted in my 4390, May 1, noon. Asked by Gousev what Allied Governments would be consulted, Strang listed (1) European Allies with whose representatives the EAC Consultation Committee has been meeting, thus avoiding the Poles who were excluded from such consultation at Gousev’s request; (2) British Dominions and India, (3) “maybe” Brazil.\n\nTo my question as to whether the “active” Allies would also sign the surrender proclamation, Strang answered in negative. He felt, however, that it would be important for public opinion in such countries as Canada for their Governments to be able to say afterwards that they had been consulted on surrender terms and had approved. To my further question regarding position of the 4 governments if any Allied Government, when consulted, refused to approve the instrument, Strang felt sure that their approval would be forthcoming [257면] since they had already been consulted on basis of a summary of the instrument.\n\nAsked by Gousev whether a similar amendment would be required in the surrender instrument Strang declined to commit himself, but expressed view that instrument would be “greatly improved” by such an addition. It is apparent that the British are very uneasy over the bad effect among the Dominions and the western European Allies of neglecting to secure their approval of the surrender instrument. On the other hand, the broad language of Strang’s amendment to the draft proclamation would open the way for the “active Allies” to demand a direct voice in all future terms and requirements to be imposed on Germany.\n\nWinant", "notes": [], "warn": false, "pages": ["257"], "search": "Winant 위넌트(주영대사) Strang 스트랭(유럽자문위원회 영국 대표) Massigli 마시글리(유럽자문위원회 프랑스 대표) Gousev 구세프(F. T. Gousev, 유럽자문위원회 소련 대표)"}, {"id": "d203", "order": 203, "date": "1945-05-01", "group": "A", "eyebrow": "d203 · The Ambassador in the United Kingdom (Winant) to the Secretary of State", "title": "주영대사(위넌트)가 국무장관에게", "badge": null, "list_right": "문서 203", "meta": [{"k": "일자", "v": "1945-05-01"}, {"k": "시각", "v": "London, May 1, 1945—midnight. [Received May 1—11:16 p.m.]"}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "4420 (Cornea 228)"}, {"k": "원문출처", "v": "740.00119 EAC/5–145: Telegram", "txt": true}, {"k": "발신", "v": "The Ambassador in the United Kingdom (Winant) 주영대사 위넌트", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 203 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d203"}], "summary": "독일에 항복문서에 서명할 능력이 있는 중앙 권력이나 당국이 없을 경우에 대비하여 항복문서를 대신할 선포문 초안을 준비하기로 유럽자문위원회가 만장일치로 원칙 합의했다는 보고다.", "points": ["독일에 항복문서에 서명할 능력이 있는 중앙 권력이나 당국이 없을 경우 항복문서 대신 발표할 수 있는 선포문 초안을 준비하기로 만장일치로 원칙 합의했다.", "무조건항복문서는 4개국 사이에서는 계속 유효하다는 점이 만장일치로 재확인되었다.", "스트랭은 4월 2일자 공문 22112호로 송부한 선포문 초안 EAC 45/28과, 전범 체포에 관한 추가를 제안한 4월 20일자 EAC 45/42를 함께 제시했다.", "스트랭은 영국 측 선포문 전문(前文) 초안 첫 문장 끝에 「그리고 무조건 항복하였다」는 말을 넣자고도 제안했다.", "그는 5월 1일 정오자 4390호가 보고한 수정안, 곧 「적극적」 연합국들이 4국의 선포문 서명을 위임하도록 하는 수정안을 정식 제출했다.", "위넌트는 독일 측 서명이 없을 경우에 대비해 그러한 선포문을 마련해 두는 것이 시급하고, 대체 선포문을 이미 승인된 항복문서와 되도록 가깝게 만드는 것이 바람직하다고 강조했다.", "위원회는 5월 3일 회의에서 선포문 초안과, 위넌트가 기회 있을 때마다 조속한 검토를 촉구해 온 미국 측 일반지령을 다루기로 했다."], "primary": "런던, 1945년 5월 1일 자정.\n[접수 5월 1일 오후 11시 16분]\n\n4420. Cornea 228. 오늘 밤 유럽자문위원회 회의에서, 독일에 항복문서에 서명할 능력이 있는 중앙 권력이나 당국이 없을 경우 항복문서를 대신하여 발표할 수 있는 선포문 초안을 준비하기로 만장일치로 원칙 합의되었다. 무조건항복문서는 4개 열강 사이에서 계속 효력을 가진다는 점이 만장일치로 재확인되었다.\n\n스트랭은 나의 4월 2일자 공문 제22112호로 송부한 자신의 선포문 초안 EAC 45/28을, 전쟁범죄인의 체포에 관한 추가를 제안한 4월 20일자 자신의 EAC 45/42[주94]와 함께 제시하였다. 그는 또한 선포문에 대한 영국 측 전문(前文) 초안의 첫 문장 끝에 「그리고 무조건 항복하였다」는 말을 추가할 것을 제안하였다. 그는 나의 5월 1일 정오자 4390호로 보고한 수정안, 곧 「적극적」 연합국들이 4개 열강의 선포문 서명을 위임하도록 하는 수정안을 정식으로 제출하였다. 후자의 수정안에 관한 논의는 나의 5월 1일 자정자 4419호에 보고하였다. 논의에서 나는 독일 측의 서명이 없을 경우에 대비하여 그러한 선포문을 마련해 두는 일의 시급함과, 그 대체 선포문을 이미 승인된 항복문서와 되도록 가깝게 만드는 일의 바람직함을 강조하였다.\n\n5월 3일 회의에서 위원회는 선포문 초안과, 내가 기회 있을 때마다 조속한 검토를 촉구해 온 미국 측 일반지령을 다룰 예정이다.\n\n위넌트(Winant)\n\n[258면]", "secondary": "London, May 1, 1945—midnight.\n[Received May 1—11:16 p.m.]\n\n4420. Cornea 228. At tonight’s meeting of the EAC it was unanimously agreed in principle to prepare a draft proclamation which could be issued in place of the surrender instrument in case there should be no central power or authority in Germany capable of signing the surrender. It was unanimously reaffirmed that the unconditional surrender instrument remains in force as among the 4 powers.\n\nStrang advanced his draft proclamation, EAC 45/28 transmitted in my despatch No. 22112 of April 2, together with his EAC 45/42 of April 20 [주94] proposing an addition regarding apprehension of war criminals. He also proposed addition of words “and have unconditionally surrendered” at end of first sentence of United Kingdom draft preamble to the proclamation. He presented formally an amendment, reported in my 4390, May 1, noon to provide for “active” Allies to authorize signature of the proclamation by the 4 powers. Discussion of latter amendment reported in my 4419, May 1, midnight. In the discussion I stressed the urgency of having such a proclamation ready in case there were no German signature, and the desirability of making the substitute proclamation as nearly as possible like the already approved surrender instrument.\n\nAt the May 3 meeting the Commission plans to consider the draft proclamation and the United States general directive, for whose early consideration I have been pressing on every occasion.\n\nWinant\n\n[258면]", "notes": ["[주94] EAC 45/28의 본문은 208면 참조. 공문 제22112호와 E.A.C.(45) 42는 둘 다 인쇄하지 않음."], "warn": false, "pages": ["258"], "search": "Winant 위넌트(주영대사) Strang 스트랭(유럽자문위원회 영국 대표)"}, {"id": "d204", "order": 204, "date": "1945-05-01", "group": "A", "eyebrow": "d204 · The Ambassador in the United Kingdom (Winant) to the Secretary of State", "title": "주영대사(위넌트)가 국무장관에게", "badge": null, "list_right": "문서 204", "meta": [{"k": "일자", "v": "1945-05-01"}, {"k": "시각", "v": "London, May 1, 1945—midnight. [Received May 1—11:16 p.m.]"}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "4421"}, {"k": "원문출처", "v": "740.00119 EAC/5–145: Telegram", "txt": true}, {"k": "발신", "v": "The Ambassador in the United Kingdom (Winant) 주영대사 위넌트", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 204 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d204"}], "summary": "유럽자문위원회가 독일 무조건항복문서에 프랑스 서명자를 넣는 의정서와, 독일 통제기구 협정에 프랑스를 추가하는 의정서를 4개국 정부에 제출하기로 승인했다는 보고다.", "points": ["오늘 EAC가 4개국 정부에 제출할 두 가지를 승인했다.", "(1) 독일 무조건항복문서에 프랑스 서명자를 넣는 의정서.", "(2) 독일 통제기구 협정에 기존 3개 연합국에 더하여 프랑스를 추가하는 의정서.", "원본은 항공편으로 국무부에 보낸다.", "파리에 232호로 반복 전달되었다."], "primary": "런던, 1945년 5월 1일 자정.\n[접수 5월 1일 오후 11시 16분]\n\n4421. 오늘 유럽자문위원회는 4개국 정부에 제출할 것으로 (1) 독일 무조건항복문서에 프랑스 서명자를 넣는 의정서[주95]와 (2) 독일 통제기구 협정에 다른 3개 연합국에 더하여 프랑스를 추가하는 의정서[주96]를 승인하였다. 원본은 항공편으로 국무부에 보낸다.\n\n파리에 232호로 반복 전달함.\n\n위넌트(Winant)", "secondary": "London, May 1, 1945—midnight.\n[Received May 1—11:16 p.m.]\n\n4421. Today the EAC approved for submission to the four Governments (1) a protocol including the French signatories to the instrument of unconditional surrender of Germany [주95] and (2) a protocol adding France to the other three Allies in the control machinery agreement for Germany. [주96] Originals by air to Department.\n\nRepeated Paris as 232.\n\nWinant", "notes": ["[주95] 바로 다음 문서.", "[주96] 독일 통제기구에 관한 1944년 11월 14일자 협정의 수정에 관한 미국·소련·영국 정부 및 프랑스 공화국 임시정부 사이의 협정 본문은 국무부 『조약 및 기타 국제문서 시리즈』 제3070호, 또는 『미국 조약 및 기타 국제협정』(워싱턴, 정부인쇄국, 1956) 제5권(제2부) 2072면 참조."], "warn": false, "pages": [], "search": "Winant 위넌트(주영대사)"}, {"id": "d205", "order": 205, "date": "1945-05-01", "group": "E", "eyebrow": "d205 · Agreement Between the Governments of the United States of America, the Union of Soviet Socialist Republics, the United Kingdom, and the Provisional Government of the French Republic Regarding Amendments to the “Unconditional Surrender of Germany” (of 25th July, 1944)  Transmitted to the Department as enclosure to despatch 22804, May 2, from London; received May 9. Regarding the approval of this agreement by the Four Powers, see telegram 5226, May 25, from London, p. 306.", "title": "「독일의 무조건 항복」(1944년 7월 25일자)에 대한 수정에 관한 미합중국·소비에트사회주의공화국연방·영국 정부 및 프랑스 공화국 임시정부 사이의 협정", "badge": null, "list_right": "문서 205", "meta": [{"k": "일자", "v": "1945-05-01"}, {"k": "시각", "v": "London, 1st May, 1945."}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 E.A.C./5–245", "txt": true}, {"k": "발신", "v": "The European Advisory Commission 유럽자문위원회", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "협정"}], "links": [{"k": "FRUS", "text": "문서 205 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d205"}], "summary": "1944년 7월 25일자 「독일의 무조건 항복」 문서에 프랑스 공화국을 넷째 서명 당사국으로 넣기 위한 네 가지 수정 조항으로, 1945년 5월 1일 유럽자문위원회가 만장일치로 채택했다.", "points": ["전문(前文) 제2단락의 세 열강 이름에 「프랑스 공화국」을 추가한다.", "제12조 (a)의 첫 문장의 세 열강 이름에 「프랑스 공화국」을 추가한다.", "제14조를 고쳐, 문서를 영어·프랑스어·러시아어·독일어로 작성하되 영어·프랑스어·러시아어만을 정본으로 하고, 조항의 의미에 관한 문제가 생기면 연합국 대표들의 결정을 최종으로 한다.", "연합국 대표 서명란에 프랑스 대표 서명을 위한 넷째 줄을 추가한다.", "1945년 5월 1일 유럽자문위원회 회의에서 만장일치로 채택되었으며, 네 대표 위넌트·구세프·스트랭·마시글리가 서명했다."], "primary": "런던, 1945년 5월 1일.\n\n**I**\n\n전문(前文) 제2단락에서 세 열강의 이름에 「프랑스 공화국」을 추가한다.\n\n**II**\n\n제12조 (a)의 첫 문장에서 세 열강의 이름에 「프랑스 공화국」을 추가한다.\n\n**III**\n\n제14조는 다음과 같이 한다.\n\n이 문서는 영어, 프랑스어, 러시아어 및 독일어로 작성된다. 영어, 프랑스어 및 러시아어본만이 [259면] 정본이다. 이 문서의 어느 규정의 의미에 관하여 문제가 생기는 경우, 연합국 대표들의 결정을 최종적인 것으로 한다.\n\n**IV**\n\n연합국 대표들의 서명을 위해 지정된 자리에 프랑스 대표의 서명을 위한 넷째 줄을 추가한다.\n\n1944년 7월 25일자 「독일의 무조건 항복」에 대한 수정에 관한 미합중국·소비에트사회주의공화국연방·영국 정부 및 프랑스 공화국 임시정부 사이의 협정의 위 본문은 1945년 5월 1일에 열린 회의에서 유럽자문위원회가 작성하여 만장일치로 채택한 것이다.\n\n유럽자문위원회 미합중국 정부 대표: 유럽자문위원회 사회주의공화국연방[원문 「Soviet」 누락] 정부 대표: 유럽자문위원회 영국 정부 대표: 유럽자문위원회 프랑스 공화국 임시정부 대표:\n\n존 G. 윌넌트(John G. Wlnant)  F. T. 구세프(F. T. Gousev)  윌리엄 스트랭(William Strang)  마시글리(Massigli)", "secondary": "London, 1st May, 1945.\n\nI\n\nIn the second paragraph of the preamble add “the French Republic” to the names of the three Powers.\n\nII\n\nIn the first sentence of Article 12 (a) add “the French Republic” to the names of the three Powers.\n\nIII\n\nArticle 14 will read as follows:—\n\nThis instrument is drawn up in the English, French, Russian and German languages. The English, French and Russian are the only [259면] authentic texts. In case of any question as to the meaning of any of the provisions of this Instrument, the decision of the Allied Representatives shall be final.\n\nIV\n\nIn the place designated for the signatures of the Allied Representatives add a fourth line for the signature of the French Representative.\n\nThe above text of the Agreement between the Governments of the United States of America, the Union of Soviet Socialist Republics, the United Kingdom and the Provisional Government of the French Republic regarding Amendments to the “Unconditional Surrender of Germany” of 25th July, 1944 has been prepared and unanimously adopted by the European Advisory Commission at a meeting held on 1st May, 1945.\n\nRepresentative of the Government of the United States of America on the European Advisory Commission: Representative of the Government of the Union of Socialist Republics on the European Advisory Commission: Representative .of the Government of the United Kingdom on the European Advisory Commission: Representative of the Provisional Government of the French Republic on the European Advisory Commission:\n\nJohn G. Wlnant F. T. Gousev William Strang Massigli", "notes": ["[주97] 런던발 5월 2일자 공문 22804호의 부속문서로 국무부에 송부됨. 5월 9일 접수. 이 협정의 4개국 승인에 관하여는 런던발 5월 25일자 전보 5226호(306면) 참조."], "warn": false, "pages": ["259"], "search": "Winant 위넌트(주영대사, 유럽자문위원회 미국 대표) Gousev 구세프(유럽자문위원회 소련 대표) Strang 스트랭(유럽자문위원회 영국 대표) Massigli 마시글리(유럽자문위원회 프랑스 대표)"}, {"id": "d692", "order": 692, "date": "1945-05-01", "group": "A", "eyebrow": "d692 · The Ambassador in France (Caffery) to the Secretary of State", "title": "주프랑스대사(캐퍼리)가 국무장관에게", "badge": null, "list_right": "문서 692", "meta": [{"k": "일자", "v": "1945-05-01"}, {"k": "시각", "v": "Paris, May 1, 1945—5 p.m. [Received 9:24 p.m.]"}, {"k": "장소", "v": "Paris", "txt": true}, {"k": "전문번호", "v": "2252"}, {"k": "원문출처", "v": "740.0011 E.W./5–145: Telegram", "txt": true}, {"k": "발신", "v": "The Ambassador in France (Caffery) 주프랑스대사 캐퍼리 — 머피 발신분 전달", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 692 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d692"}], "summary": "SHAEF 합동정보위원회가 점령지 독일 주민의 태도를 분석했다. 무기력하고 순종적이어서 당장의 대규모 치안 문제는 없으나, 전혀 뉘우침이 없고 자기 지도자들의 행위에 무지하며 연합국과 러시아 사이를 이간하려 든다는 머피의 보고다.", "points": ["SHAEF 합동정보위원회는 독일 주민의 태도를 지금까지 무기력하고 순종적이라 분석했고, 당장의 대규모 치안 문제는 없다고 본다.", "연합국의 방대한 전쟁물자·집적소·송유관·통신에 대한 심각한 파괴 행위는 보고되지 않았고, 많은 경우 독일 민간인과 야전 지휘관들까지 시설 파괴 명령에 불복했다.", "반면 독일인들은 전혀 뉘우치지 않고 지도자들의 행위와 유럽이 독일에 품은 증오에 대해 상상할 수 없을 만큼 무지하다.", "보통의 독일인은 독일이 군사적으로 패배했다는 것은 알지만 정복당했다는 것은 인정하지 않으며, 많은 이가 자신을 위에서 강요된 전쟁의 참화에서 「해방된」 자로 여긴다.", "뒤스부르크와 에센에서는 미군이 환호로 맞아졌고, 아이들은 연합군에게 V 표시를 보낸다.", "강제수용소와 SS의 잔학 행위를 안다고 인정하는 이는 거의 없으며, 그들 눈에 독일이 저지른 유일한 범죄는 전쟁에 진 것이다.", "「뮌스터 대주교」[원문 「Minister」]는 모든 실향민을 러시아인이라 부르며 연합국이 이 「열등한 민족들」로부터 독일을 지켜 주어야 한다고 요구했다고 인용된다.", "교육받은 층에서는 벌써 연합국과 러시아 사이의 마찰을 고소해하고 있으며, 연합국-러시아 관계를 해치고 양쪽을 이간하려 온갖 짓을 할 것이 분명하다.", "가장 첨예한 문제는 여전히 연합국이 맡고 있는 백만 명 넘는 실향민 문제이며, 식량은 당장은 버티고 있다.", "나치의 위협은 연합국을 위해 일하는 독일인 관리들에게 별 효과가 없었고, 아헨 시장 암살 뒤에도 사임자는 없었으며 늑대인간 사건은 더 보고되지 않았다."], "primary": "파리, 1945년 5월 1일 오후 5시.\n [접수 오후 9시 24분]\n\n2252. 머피로부터. SHAEF 합동정보위원회는 독일 주민 대다수의 태도를 지금까지 무기력하고 순종적인 것으로 분석한다. 당장의 장래에 대규모 치안 문제는 없다고 여겨진다. 연합국의 방대한 전쟁물자와 집적소에 대해서도, 연합국의 송유관과 통신에 대해서도 심각한 파괴 행위는 보고된 바 없다. 많은 경우 독일 민간 주민은 물론 야전 지휘관들까지 시설을 파괴하라는 명령에 불복하였다.\n\n다른 한편으로 독일 국민은 전혀 뉘우치는 기색이 없으며, 자기 지도자들의 행적과 유럽에서 독일이 어떤 증오를 받고 있는지에 대해 상상할 수 없을 만큼 무지 속에 잠겨 있는 듯하다. 그들은 또한 외국인 노동자와 실향민의 처지에 무관심하며, 독일이 전쟁에 책임이 있고 이제 그 악행 때문에 고통을 받아야 한다는 말에는 오만한 분개를 드러낸다. 보통의 독일인은 독일이 군사적으로 패배하였음은 깨닫고 있으나 정복당하였다는 것은 인정하지 않는다. 많은 이가 자신들을 위로부터 강요된 전쟁의 참화로부터 해방된 자로 여기며, 그 전쟁에 대해 자신들에게는 책임이 없다고 여긴다. 아이들은 연합군 병사들에게 V 표시를 보내며, 뒤스부르크와 에센에서 미군은 환호로 맞아졌다. 나치 지배의 10년 동안 독일인들은 옆 거리에서 무슨 일이 벌어지는지에 대해 눈을 감는 습관을 익혔다. 강제수용소와 SS의 잔학 행위에 대해 알고 있었다고 인정하는 사람은 거의 없으며 그들은 책임을 부인한다. 그들은 대체로 군정에 협력하고 자기 도시를 재건하는 데 지나칠 만큼 열심인 듯하다. 그들이 보기에 독일이 저지른 유일한 범죄는 전쟁에 진 것이다.\n\n많은 이가 지난 몇 해 동안의 사건들에 대해 아무것도 몰랐다고 주장하며, 미국이 자기들에게 선전포고를 했고 영국과 프랑스가 여러 해 동안 독일을 공격하려 획책해 왔다고 믿는다고 말한다. 그들은 외국인 노동자들이 자기 물건을 약탈하고 그들을 먹여야 한다는 데 마음 상해한다. 민스터[주35] 대주교마저 모든 실향민을 [938면] 러시아인이라 부르며 연합국이 이 「열등한 민족들」로부터 독일을 보호해 주어야 한다고 요구했다고 인용된다.\n\n교육받은 계층 사이에서는 러시아인들과의 관계에서 연합국이 부딪히는 어려움을 두고 벌써 고소해하는 기색이 있으며, 그들이 연합국과 러시아의 관계를 해치고 한쪽을 다른 쪽에 맞붙여 이간하기 위해 할 수 있는 모든 일을 하리라는 것은 분명하다. 지금까지 교회들은 주도적으로 나서는 기색이 없으나, 개별적으로는 사제들이 작은 공동체 대부분에서 임시로 시장(Burgomeister) 노릇을 해 왔다. 미국에서 악명 높던 트란스오체안 선전 기관에 몸담았다가 최근 독일 외무부의 미국 담당과장이었고 지금은 붙잡힌 차프(Zapp) 씨는, 개신교 목사들에게서도 심지어 가톨릭 사제들에게서도 기대할 것이 거의 없다고 생각한다고 말하였다.\n\n나치의 위협은 연합국을 위해 일하는 독일인 관리들에게 별 효과가 없었던 듯하다. 아헨 시장의 암살[주36]로 사임한 자는 없었으며 더 이상의 늑대인간(werewolf) 사건은 보고되지 않았다.\n\n가장 첨예한 문제는 여전히 실향민 문제이며, 그 가운데 백만 명이 넘는 이들을 연합국이 맡고 있다. 당장으로서는 식량 공급이 버티고 있다. [머피.]\n\n캐퍼리(Caffery)", "secondary": "Paris, May 1, 1945—5 p.m. \n [Received 9:24 p.m.]\n\n2252. From Murphy. SHAEF joint intelligence committee analyses the attitude of the bulk of the German population thus far as apathetic and docile. It is considered that there is no large scale security problem for the immediate future. No serious act of sabotage has been reported against the vast masses of Allied war material and dumps or against Allied pipe lines and communications. In many cases German civilian population and even field commanders have disobeyed orders to destroy installations.\n\nOn the other hand the German people seem utterly unrepentant and sunk in inconceivable ignorance of the deeds of their leaders and the hatred with which Germany is regarded in Europe. They are also indifferent to the plight of foreign workers and displaced persons and manifest arrogant indignation at the suggestion that Germany was responsible for the war and that she should now suffer for her misdeeds. The average German realizes that Germany is militarily defeated but does not admit that she is conquered. Many regard themselves as liberated from the horrors of war imposed on them from above for which, they consider themselves not responsible. Children give the V sign to Allied troops and in Duisburg and Essen United States troops were received with cheers. During 10 years of Nazi rule Germans have acquired the habit of shutting their eyes as to what went on in the next street. Few admit knowledge of concentration camps and SS atrocities and they disown responsibility. They seem generally only too anxious to help military government and to rehabilitate their towns. In their eyes the only crime Germany has committed is to lose the war.\n\nMany profess ignorance of events during the past years stating the belief that United States declared war on them and that Great Britain and France were plotting for years to attack Germany. They are grieved when foreign workers loot their goods and have to be fed. Even the Archbishop of Minister [주35] is quoted as referring to all displaced [938면] persons as Russians and demanding that the Allies should afford Germany protection from these “inferior peoples.”\n\nAmong the educated groups there is already gloating over difficulties confronting the Allies in their dealings with the Russians and it is clear that they will do all they can to poison Allied-Russian relations and play one off against the other. So far churches show no signs of taking initiative though individually priests have served temporarily in most of small communities as burgomeisters. Herr Zapp, late of notorious Transocean propaganda service in the United States and recently head of the Section for American Affairs in the German Foreign Office, now captured, said that he thought little could be expected from Protestant pastors or even from Catholic priests.\n\nNazi threats seem to have had little effect on German officials working for the Allies. The assassination of the Mayor, of Aachen [주36] caused no resignations and no further werewolf incidents have been reported.\n\nMost acute problem still that of the displaced persons of whom over a million are in charge of the Allies. Temporarily food supplies are holding out. [Murphy.]\n\nCaffery", "notes": ["[주35] 뮌스터 주교 클레멘스 그라프 폰 갈렌(Clemens Graf von Galen).", "[주36] 아헨의 비(非)나치 시장 프란츠 오펜호프(Franz Oppenhof)는 3월 말 군복을 입은 독일 낙하산병 세 명에게 살해되었다."], "warn": false, "pages": ["938"], "search": "Murphy 머피(대독일 정치고문) Caffery 캐퍼리(주프랑스대사) von Galen 폰 갈렌(뮌스터 주교 클레멘스 그라프 폰 갈렌) Oppenhof 오펜호프(프란츠 오펜호프, 아헨 시장) Zapp 차프(전 트란스오체안 선전 기관, 독일 외무부 미국 담당과장)"}, {"id": "d860", "order": 860, "date": "1945-05-01", "group": "B", "eyebrow": "d860 · The British Embassy to the Department of State", "title": "영국대사관이 국무부에", "badge": null, "list_right": "문서 860", "meta": [{"k": "일자", "v": "1945-05-01"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "862.414/5–145", "txt": true}, {"k": "발신", "v": "The British Embassy 영국대사관", "txt": true}, {"k": "수신", "v": "The Department of State 국무부", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 860 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d860"}], "summary": "베를린 함락을 신호로 재외 독일 공관이 문서를 모두 소각하라는 지시를 받았다고 볼 근거가 있으므로, 중립국 정부들이 미리 조치에 나서도록 미·영·프가 함께 교섭하자고 제안한 각서(aide-mémoire)다.", "points": ["영국 정부는 재외 독일 공관에 「베를린의 함락을 신호로 모든 문서를 소각하라」는 지시가 내려졌을 수 있다고 볼 근거를 가지고 있다.", "유럽 중립국 주재 영국 공관장들은 미국 동료에게 이를 알리고 그가 하는 교섭을 지원하도록 권한을 받았으며, 프랑스 정부도 자발적으로 동참을 제의했다.", "적대행위는 항복문서의 서명으로 끝나거나, 완전한 독일 패배를 근거로 연합국 정부들이 발표하는 일방적 선언으로 끝날 것이며, 어느 쪽이든 4개 연합국이 독일 정부가 가졌던 모든 권한을 포함한 최고 권한을 인수한다는 내용이 담길 것이다.", "스위스·포르투갈 같은 정부는 이미 소멸한 것으로 상정되는 독일 정부를 대신해 행동할 권한을 밝히는 정식 문서를 요구할 수 있으나, 그런 문서를 주겠다고 약속해야 할지는 의문이라고 했다.", "시기가 결정적이다. 사후에 정식 문서를 제시하려 하면 그 사이 독일 공관들이 본국의 최종 붕괴를 알고 문서를 파기·분산시켜 버릴 것이기 때문이다.", "따라서 중립국 정부들이 「우리가 정하는 시점」에 조치할 것을 미리 약속하고, 그 근거는 나중에 제시하도록 해야 한다는 것이다.", "대상은 해당국의 모든 외교·영사 공관과 스페인의 나치당 사무소 같은 준(準)공적 기관 전부를 포함하기를 바라나, 보호국(스위스)이 관리 중인 로마의 독일 대사관에까지 확대하는 데는 반대한다.", "리스본 주재 영국 대사가 살라자르에게 나치 약탈품 확보의 전망을 언급하자고 권고했으나, 영국은 주재국 정부가 발견된 자산이나 귀중품으로 이득을 볼 것이라는 암시를 주고 싶지 않다고 했다. 세이프헤이븐 문제 전반에 바람직하지 않은 정책을 떠안게 될 수 있기 때문이다.", "제3자를 통해 독일 공관 내 협력자를 끌어들이는 방안도 검토했으나 널리 쓰기에는 시간이 부족하며, 성공하려면 협력자에게 실효 있는 유인을 제시해야 하리라고 보았다."], "primary": "각서(Aide-Mémoire)\n\n제목: 중립국 내 독일 공유재산\n\n영국 정부는 재외 독일 공관에 베를린의 함락을 신호로 모든 문서를 소각하라는 지시가 내려졌을 수 있다고 믿을 만한 근거를 얼마간 가지고 있다.\n\n**2.**\n\n유럽 중립국 주재 영국 공관장들은 이에 관하여 미국 동료에게 알리도록 요청받았으며, 그가 행하는 어떠한 교섭이든 지원할 권한을 받았다.\n\n**3.**\n\n프랑스 정부도 이제 자발적으로, 이 문제에 관하여 중립국 정부들에 하는 어떠한 접촉에든 프랑스 대표들이 동참할 것을 제의하였다.\n\n**4.**\n\n한편 외무부는 관계된 영국 공관들에 보낸 추가 전보에서 다음의 고려 사항들에 주의를 환기하였다 — (요약 전달)\n\n**A.**\n\n교섭의 법적 근거. 우리가 받은 보고에 따르면, 예컨대 스위스와 포르투갈 정부는 사리상(ex hypothesi) 이미 소멸한 독일 정부를 대신하여 행동할 권한을 인수하였음을 밝히는 어떤 정식 문서를 요구할 수 있다. 적대행위는 항복문서의 서명에 의하여, 또는 완전한 독일 패배를 근거로 연합국 정부들이 발하는 일방적 선언에 의하여 종결될 것이다. 어느 경우든 그 문서는 4개 연합국이 독일 정부가 보유하던 모든 권한을 포함하여 독일에 관한 최고 권한을 인수한다는 내용을 담을 것이다. 따라서 그것은 연합국이 중립국 내 독일 공관들에 그 뒤의 명령을 내릴 수 있게 해 줄 것이다. 그러나 우리의 교섭에서 그러한 문서가 나올 수 있다고 상정하고, 그러한 문서가 기록하게 될 상황을 내다보고 미리 조치를 준비해 달라고 주재국 정부에 요청할 수는 있겠지만, 우리가 그 문서를 제공하겠다고 약속해야 할지는 [1141면] 의문이다. 시기의 문제가 결정적이다. 실제에 있어, 사태가 벌어진 뒤에, 그러면서도 관계된 독일 공관들이 자국 정부의 최종적 붕괴를 알고서 우리의 요청에 따라 주재국 정부가 취할 조치를 앞질러 우리가 찾아내기를 바라는 것들을 파기하거나 흩어 버리기 전에, 그러한 문서를 정식으로 주재국 정부에 제시한다는 것은 전혀 불가능할 것이기 때문이다. 그러므로 중립국 정부들은 우리가 정하는 시점에 조치를 취하겠다고 스스로 약속하고, 그러한 조치의 근거는 우리가 나중에 입증하도록 허용하여야 한다. 국무부가 동의한다면, 영국 대표들은 이 논거들을 그들의 재량으로 사용할 권한을 받게 될 것이다.\n\n**B.**\n\n제안된 조치가 어떤 독일 기관들을 포괄해야 하는지 우리는 정해야 한다. 우리로서는 해당국 안의 모든 외교 공관과 영사 공관, 그리고 스페인의 나치당 사무소와 같은 모든 준(準)공적 기관을 포함시키고자 한다. 세부 사항은 아마도 각 수도의 연합국 대표들이 개별적으로 정하도록 맡길 수 있을 것이다.\n\n**C.**\n\n다른 한편으로 우리는 현재 보호국의 관리 아래 있는 로마 주재 대사관으로까지 조치를 확대하는 데 반대한다. 우리는 값어치 있는 것이 남아 있는 경우 스위스가 파괴 행위를 의도하거나 용인하리라고 의심하지 않는다. 더욱이 우리는 적어도 이 단계에서는 보호국이 잠정적으로 그 임무를 계속하는 것을 단념시킬 어떠한 조치도 취하고 싶지 않다.\n\n**D.**\n\n리스본 주재 영국 대사는, 겉보기에 미국 동료의 동의를 얻어, 독일 공관들 안의 나치 약탈품을 확보할 전망을 살라자르 박사[주25]에게 언급하자고 권고하였다. 우리는 주재국 정부들이 발견되는 어떠한 자산이나 귀중품으로부터 이득을 얻으리라는 암시를 주지 않기를 선호한다. 그런 암시는 세이프헤이븐(Safehaven) 문제 전반에 걸쳐 우리를 바람직하지 않은 정책에 묶어 놓을 수 있기 때문이다.[주26]\n\n**E.**\n\n우리는 주재국 정부에 대한 접근과 나란히 쓸 수 있는 방법으로, 제3자를 통한 연줄을 이용하여 독일 공관 안의 있을 수 있는 협력자들로 하여금 문서를 파괴 행위로부터 지켜 내게 하거나 나아가 우리가 공관 구내로 들어가는 것을 돕게 하는 시도를 검토하였다. 이 방법을 널리 쓸 시간이 있는지는 의심스러우나, 몇몇 경우에는 이미 시도되고 있다. 국무부도 이 방법이 성공하려면 협력자들에게 어떤 실효 있는 유인이 제시되어야 하리라는 데 동의할 것이다.\n\n워싱턴, 1945년 5월 1일.", "secondary": "Aide-Mémoire\n\nSubject: German Official Property in Neutral Countries\n\nHis Majesty’s Government have some reason to believe that instructions may have been issued to German Missions abroad that the fall of Berlin should be a signal to burn all the archives.\n\n2.\n\nThe Heads of His Majesty’s Missions in European neutral countries have been requested to inform their United States colleague accordingly and have been authorised to support him in any representations which he makes to Governments still entertaining German Missions.\n\n3.\n\nThe French Government have also now spontaneously proposed that French representatives should join in any approach to neutral Governments on this question.\n\n4.\n\nMeanwhile, in a further telegram despatched to His Majesty’s Missions concerned, the Foreign Office have drawn attention to the following considerations—(Paraphrase)\n\nA.\n\nLegal basis of representations. Some formal document assuming powers to act on behalf of ex-hypothesi defunct German Government may, according to our reports, be required by e.g. Swiss and Portuguese Governments. Hostilities will be brought to an end either by signature of an instrument of surrender or by a unilateral declaration issued by Allied Governments on basis of a complete German defeat. In either case document will provide assumption by four Allied powers of supreme authority with regard to Germany including all powers possessed by the German Government. It will thus enable Allies to issue subsequent orders to German Missions in neutral countries. But, while our representations might assume that such a document could be available and request the action to be prepared by Host Governments in anticipation of a situation which such an instrument would record, it is questionable whether we should [1141면] promise to furnish it. The question of timing is vital because it would, in practice, be quite impossible to present such a document in due form to Host Government after the event and yet before German Missions concerned learned of their Government’s final collapse and forestalled the action to be taken by Host Governments at our request by destroying or dispersing what we hoped to find. Neutral Governments must therefore be prepared to commit themselves to action at a moment to be defined by us and allow us to substantiate grounds for such action later. His Majesty’s Representatives will, if the State Department agree, be authorized to use these arguments at their discretion.\n\nB.\n\nWe must decide what German establishments should be covered by proposed action. For our own part we should like to include all diplomatic and Consular Missions in country concerned and all semiofficial establishments such as Nazi Party offices in Spain. Details could perhaps be left to Allied Representatives in each capital to decide individually.\n\nC.\n\nOn the other hand we deprecate extending action to Embassy in Rome now in custody of protecting power. We do not suspect Swiss of intending or permitting sabotage if anything of value remains. Moreover we do not at any rate at this stage want to take any action to discourage protecting power from provisionally continuing its duties.\n\nD.\n\nHis Majesty’s Ambassador in Lisbon has recommended, apparently with the concurrence of his United States colleague mentioning to Dr. Salazar [주25] the prospect of securing Nazi loot in German Missions. We should prefer to give no hint that Host Governments would profit by any assets or valuables discovered, as this might commit us to an undesirable policy over general Safehaven questions. [주26]\n\nE.\n\nWe have considered, as a possible parallel method to approach to Host Governments, an attempt to use contacts through third parties with possible collaborators in German Missions to induce the latter to preserve documents from sabotage or even facilitate our entry into Missions’ premises. It is doubtful whether there is time for this method to be used widely though it is being tried already in certain cases. State Department may agree that, for it to be successful, collaborators would have to be offered some effective inducement.\n\nWashington , May 1, 1945.", "notes": ["[주25] 안토니우 드 올리베이라 살라자르(Antonio de Oliveira Salazar), 포르투갈 각료회의 의장 겸 외무장관.", "[주26] 이 주제에 관한 문서는 제2권 852면 이하 참조."], "warn": false, "pages": ["1141"], "search": "Salazar 살라자르(안토니우 드 올리베이라 살라자르, 포르투갈 각료회의 의장 겸 외무장관)"}, {"id": "d83", "order": 83, "date": "1945-05-02", "group": "A", "eyebrow": "d83 · The United States Political Adviser on Austrian Affairs (Erhardt) to the Secretary of State", "title": "오스트리아 문제 미국 정치고문(에르하르트)이 국무장관에게", "badge": null, "list_right": "문서 83", "meta": [{"k": "일자", "v": "1945-05-02"}, {"k": "시각", "v": "Caserta, May 2, 1945—9 p.m. [Received May 2—1:25 p.m.]"}, {"k": "장소", "v": "Caserta", "txt": true}, {"k": "전문번호", "v": "1866"}, {"k": "원문출처", "v": "740.00119 Control (Austria)/5–245: Telegram", "txt": true}, {"k": "발신", "v": "The United States Political Adviser on Austrian Affairs (Erhardt) 오스트리아 문제 미국 정치고문 에르하르트", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 83 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d83"}], "summary": "카세르타에 도착한 프랑스 대표단과 빈 파견단 문제를 논의한 결과, 프랑스는 빈시(市)보다 넓은 가우 빈을 분할 대상으로 선호하고 대표단을 군인 급으로 맞추려 하며 지위와 대우의 동등을 고수하라는 드골의 지시를 받았다고 보고한 전보다.", "points": ["프랑스 대표단이 지난 일요일(4월 29일) 카세르타에 도착했고, 연합군총사령부(AFHQ)가 미국 기획단 막사 구역에 사무실과 시설을 내주었다.", "보데의 제안으로 프랑스·영국·미국이 플로리 장군 사무실에서 만나 빈 파견단 문제를 논의했다.", "프랑스 군부는 빈에서 세분할 지역으로 좁은 시(市) 경계보다 가우 빈(Gau Vienna)을 선호한다. 자국 부대를 위한 충분한 공간과 시설 요건에 가장 잘 맞기 때문이다.", "프랑스는 이 파견단의 임무를 주로 빈의 지대 설정에 관한 권고를 내는 것으로 국한해 생각한다.", "보데는 미국과 영국의 파견단이 군인 급이라는 사실을 파리가 이해하고 있는지 확신하지 못하며, 당분간 자기 대신 셰리에르 준장이 대표단을 이끄는 편이 현명하다고 보고 파리에 훈령을 요청하는 전보를 치고 있다.", "드골 장군은 보데에게 지위와 대우의 동등을 고수하라고 지시했다."], "primary": "카세르타, 1945년 5월 2일 오후 9시.\n [접수 5월 2일 오후 1시 25분]\n\n1866. 프랑스 대표단이 지난 일요일[주11] 카세르타에 도착하였다. 연합군총사령부(AFHQ)는 그들에게 미국 기획단(American Planning Group) 막사 구역에 사무실과 시설을 제공하였다. 보데(Baudet)의 제안으로 프랑스, 영국 및 우리 측의 회합이 플로리(Flory) 장군의 사무실에서 열려 빈 파견단 문제를 논의하였다. 표명된 프랑스 측 견해는 다음과 같다.\n\n**1.**\n\n빈에서 세분될 지역 문제에 관하여, 프랑스 군부는 시(市)의 좁은 경계보다 가우 빈(Gau Vienna)을 선호한다. 그것이 자국 부대를 위한 충분한 공간과 시설이라는 요건을 가장 잘 충족시킬 것이기 때문이다.\n\n**2.**\n\n임무 범위에 관하여, 프랑스 측은 이 파견단을 주로 빈의 지대 설정에 관한 권고를 작성하는 데 국한된 것으로 생각한다.\n\n**3.**\n\n보데 씨는 미국과 영국의 파견단이 군인 급(級)이라는 것을 파리가 이해하고 있는지 확신하지 못한다고 말하였다. 그는 당분간 자기 대신 셰리에르(Cherriere) 준장이 대표단을 이끄는 편이 더 현명하리라고 믿었다. 그는 이 점에 관한 훈령을 구하러 파리에 전보를 치고 있다.\n\n**4.**\n\n드골 장군[주12]은 보데 씨에게 지위와 대우의 동등을 고수하라고 지시하였다.\n\n국무부에 발송하고, 런던에 182호, 파리에 96호로 반복 전달함.\n\n[에르하르트(Erhardt)]\n\n[110면]", "secondary": "Caserta, May 2, 1945—9 p.m. \n [Received May 2—1:25 p.m.]\n\n1866. The French Delegation reached Caserta last Sunday. [주11] They have been given offices and facilities by AFHQ in the hut area of the American Planning Group. At Baudet’s suggestion a meeting of the French, British and ourselves was held in General Flory’s office to discuss the mission to Vienna. The French views expressed were:\n\n1.\n\nOn the matter of the area to be subdivided in Vienna, the French military prefer Gau Vienna to the narrower limits of the city because it will best meet their requirements for adequate space and facilities for their troops.\n\n2.\n\nWith regard to terms of reference, the French envisage the mission as one mainly confined to making recommendations in the zoning of Vienna.\n\n3.\n\nMr. Baudet said he was not sure that Paris understood that the American and British missions were on a military level. He believed it wiser for the time being, that Brigadier General Cherriere instead of himself should head the delegation. He is telegraphing Paris for instructions on this point.\n\n4.\n\nGeneral de Gaulle [주12] had instructed Mr. Baudet to stand for equality of status and treatment.\n\nSent Department, repeated London as 182, and Paris as 96.\n\n[Erhardt]\n\n[110면]", "notes": ["[주11] 4월 29일.", "[주12] 샤를 드골(Charles de Gaulle) 장군, 프랑스 임시정부 수반."], "warn": false, "pages": ["110"], "search": "Erhardt 에르하르트(오스트리아 문제 미국 정치고문) Baudet 보데(프랑스 대표단) Flory 플로리(장군, AFHQ) Cherriere 셰리에르(프랑스 준장) de Gaulle 드골(프랑스 임시정부 수반)"}, {"id": "d84", "order": 84, "date": "1945-05-02", "group": "A", "eyebrow": "d84 · The Chargé in the Soviet Union (Kennan) to the Secretary of State", "title": "주소련 대리대사(케넌)가 국무장관에게", "badge": null, "list_right": "문서 84", "meta": [{"k": "일자", "v": "1945-05-02"}, {"k": "시각", "v": "Moscow, May 2, 1945—2 p.m. [Received May 2—10:45 a.m.]"}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": "1432"}, {"k": "원문출처", "v": "863.01/5–245: Telegram", "txt": true}, {"k": "발신", "v": "The Chargé in the Soviet Union (Kennan) 주소련 대리대사 케넌", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 84 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d84"}], "summary": "오스트리아 임시정부 수립에 대한 대소련 항의는 기록을 남기는 의미밖에 없으며, 미국의 영향력은 오히려 서방이 점령할 지대를 얼마나 잘 운영하느냐에 달려 있다는 케넌의 의견이다.", "points": ["비신스키에게 전달한 항의는 「기록을 위한 것」으로 보아야 하며, 그 효과에 과도한 기대를 걸지 않는다고 케넌이 못박는다.", "소련은 이런 종류의 반응에 익숙하고, 미국이 싫어할 조치를 취할 때 미리 그 반응을 셈에 넣어 할인해 둔다고 본다.", "모스크바에서의 의견 표명이나 빈에 도착한 미국 대표의 언동만으로는 소련이 임시정부 지지를 철회하게 만들 수 없다.", "앞으로 오스트리아 정세에 미칠 미국의 영향력은, 서방 연합국과 함께 점령할 지대에서 보여 줄 정력·능률·목적의 일관성에 달려 있다.", "빈과 소련 점령지대에서만 권위를 인정받는 「소련에 휘둘리는(Soviet-ridden)」 임시정권은 오래 성공하기 어렵다. 나머지 지역이 더 질서 있고 번영한다면 더욱 그렇다.", "빈에 대표를 보내고 4개국 통제기구 원칙에 매달려 얻을 이익이 정확히 무엇인지 다시 신중히 따져 볼 것을 제안한다.", "빈에 도착한 대표가 소련의 기정사실(fait accompli)을 수동적으로 받아들이든 무력하게 항의하든, 결과는 똑같이 그들의 현지 위신과 영향력에 도움이 되지 않는다."], "primary": "모스크바, 1945년 5월 2일 오후 2시.\n [접수 5월 2일 오전 10시 45분]\n\n1432. 본관 전보 1431호(5월 1일 오후 10시, 카세르타·런던·파리로 전달)를 참조하기 바란다. 국무부 981호(4월 30일 오후 9시) 및 그에 따라 본관이 비신스키(Vyshinski)에게 행한 통보, 특히 임시정부 수립을 다룬 대목과 관련하여 다음과 같이 말하고자 한다.\n\n본관은 이 통보가 기록을 남기기 위한 것이며, 그것이 러시아인들에게 미칠 효과에 대해 우리가 과도한 희망을 품고 있지는 않다고 상정한다. 러시아인들은 이런 종류의 반응에 익숙해져 있고, 우리에게 거슬릴 것을 알면서 행동에 나설 때에는 아마 미리 그것을 셈에 넣어 할인해 둘 것이다. 모스크바에서의 그러한 견해 표명이나, 우리 대표들이 빈에 가게 된다면 그곳에서 말하거나 행할 그 무엇이든, 그것만으로 러시아인들이 이 임시정권에 대한 지지를 철회하게 만들기에 족하리라고는 도저히 생각하기 어렵다 — 그들이 그 정권을 계속 마음에 들어 하는 한 그렇다. 이 점에 관하여, 본관은 1944년 11월 3일 오후 5시자 본관 전보 4214호(카세르타로 18호, 런던으로 247호로 전달)에 다시 한 번 주의를 환기한다. [주13]\n\n이제부터 오스트리아의 전반적인 정치 정세에 우리의 영향력을 미치게 할 최선의 가능성은, 본관의 의견으로는, 우리가 서방 연합국과 함께 우리가 점령하게 될 오스트리아의 지대들에서 발휘할 수 있는 정력과 능률과 목적의 일관성의 정도, 그리고 사람들이 어느 정도의 확신과 안전감을 가지고 장래를 마주할 수 있게 해 줄 만한 떳떳한 여건을 그곳에 만들어 낼 수 있는 정도에 달려 있다. 빈과 러시아 점령지대에서만 그 권위가 인정되는, 소련에 휘둘리는 임시정권은 오래 성공하기 어려울 것이다. 나라의 나머지 부분이 더 질서 있고 번영한 것으로 드러난다면 특히 그러하다.\n\n이러한 사정에서, 본관은 우리 대표들을 빈에 보내고 4개국 통제기구의 원칙을 고수함으로써 우리가 얻으리라 기대하는 이익이 정확히 무엇인지를 다시 한 번 신중히 검토하고자 하게 되리라고 생각한다. 그때 우리는 우리 대표들이 일단 빈에 도착한 뒤 러시아 측의 기정사실을 수동적으로 받아들이든 그에 대해 무력하게 불평하든, 그 결과는 그들의 현지 위신과 사태의 그 이후 전개에 영향을 미칠 그들의 능력에 똑같이 도움이 되지 않으리라는 점을 유념해야 한다.\n\n국무부로 1432호로 발신, 카세르타의 에어하트(Erhardt) 앞 80호, 런던 188호, 파리의 리버(Reber) 앞 90호로 전달.\n\n케넌(Kennan)\n\n[111면]", "secondary": "Moscow, May 2, 1945—2 p.m. \n [Received May 2—10:45 a.m.]\n\n1432. ReEmbs 1431, May 1, 10 p.m., repeated to Caserta, London and Paris. With further reference to the Department’s 981, April 30, 9 p.m. and the communication I have made to Vyshinski pursuant thereto and particularly to the passages dealing with the establishment of the provisional government, I wish to say the following.\n\nI assume that this communication is being made for the record and that we are not entertaining any inordinate hopes as to its effect on the Russians. The latter are accustomed to this sort of reaction and probably discount it in advance when they take action they know will be distasteful to us. It is scarcely conceivable that any such expression of views in Moscow or anything our representatives might say or do in Vienna, if and when they get there, would alone suffice to induce the Russians to withdraw support of this provisional regime, as long as they continue to find it to their liking. In this respect, I invite attention once more to my 4214, November 3, 5 p.m., 1944 repeated to Caserta as 18 and to London as 247. [주13]\n\nFrom now on our best chance of making our influence felt on the general political situation in Austria will lie, in my opinion, in the degree of energy, efficiency and singleness of purpose which we are able to develop, together with our western Allies, in the zones of Austria we may occupy, and the extent to which we are able to create creditable conditions there which will permit people to face the future with some sense of confidence and security. A Soviet-ridden provisional regime whose authority was acknowledged only in Vienna and the Russian zone of occupation could hardly be successful for long, particularly if the remainder of the country were to turn out to be more orderly and prosperous.\n\nIn these circumstances I think we will wish to consider carefully once again the precise advantages we expect to gain by sending our representatives to Vienna and clinging to the principle of a quadruple control mechanism. In this we should bear in mind that whether our representatives, once arrived in Vienna, accept passively the Russian fait accompli or complain ineffectively against it, the result will be equally unhelpful to their local prestige and to their ability to influence the further course of events.\n\nSent Department as 1432, repeated to Caserta for Erhardt as 80, London as 188 and Paris for Reber as 90.\n\nKennan\n\n[111면]", "notes": ["[주13] Foreign Relations, 1944, vol. i, p. 467."], "warn": false, "pages": ["111"], "search": "Kennan 케넌(주소련 대리대사) Vyshinski 비신스키(소련 외무인민위원 대리) Erhardt 에어하트(카세르타 주재 미국 정치고문) Reber 리버"}, {"id": "d85", "order": 85, "date": "1945-05-02", "group": "B", "eyebrow": "d85 · Memorandum by Admiral William D. Leahy, Chief of Staff to the Commander in Chief of the Army and Navy, to the Director of the Office of European Affairs (Matthews)", "title": "육해군 최고사령관 참모장 리히 제독이 유럽국장(매슈스)에게 보내는 각서", "badge": null, "list_right": "문서 85", "meta": [{"k": "일자", "v": "1945-05-02"}, {"k": "시각", "v": "Washington, May 2, 1945. (인용된 처칠 전문은 1 May 1945자)"}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "인용 전문 번호 29 (처칠 → 트루먼)"}, {"k": "원문출처", "v": "740.00119 Control (Austria)/5–245", "txt": true}, {"k": "발신", "v": "Admiral William D. Leahy, Chief of Staff to the Commander in Chief of the Army and Navy 육해군 최고사령관 참모장 리히 제독", "txt": true}, {"k": "수신", "v": "The Director of the Office of European Affairs (Matthews) 유럽국장 매슈스", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 85 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d85"}], "summary": "빈 파견을 막는 소련 태도에 항의하는 처칠의 트루먼 앞 개인 전문 29호를, 회답 초안 작성을 위해 국무부에 전달한다.", "points": ["처칠이 위넌트로부터 미국 측 항의문 사본을 받았고, 그에 전적으로 동의하며 영국 대표에게도 같은 항의를 하도록 훈령했다고 밝힌다.", "영국 대표는 별도의 통보도 하게 되어 있다. 4월 13일 해리먼에게 준 초청에도 불구하고 소련이 이제 빈 파견을 EAC의 지대·잠정 통제기구 합의 이후로 미루려 한다는 것이다.", "연합국 사절단이 빈에 도착해 현지 사정을 직접 확인하기 전에는 EAC가 빈의 지대와 잠정 통제기구에 관해 어떤 합의에도 이를 수 없다고 지적한다.", "그 결과 완전한 교착이 생겼고, 소련 정부가 오스트리아를 단독으로 장악한 상태가 된다고 본다.", "톨부힌 원수에게 필요한 훈령을 내려 연합국 사절단이 이탈리아에서 즉시 비행해 들어갈 수 있게 하라고 요구한다.", "처칠은 트루먼이 동의한다면 미국 대리대사가 영국 동료를 지원하도록 훈령해 줄 것을 바란다.", "[주15] 트루먼의 회답은 처칠의 29호에 전적으로 동의하며, 승인 여부를 알려 주면 모스크바로 전문을 보내겠다고 맺는다."], "primary": "워싱턴, 1945년 5월 2일.\n\n수상 처칠(Churchill)로부터 온 다음 전언을 참고 및 회답 초안 작성을 위해 전달한다.\n\n「수상이 트루먼(Truman) 대통령에게, 개인 및 극비, 제29호, 귀하의 제19호 관련. [주14] (1945년 5월 1일)\n\n1.\n\n본인은 이제 위넌트(Winant) 대사로부터, 귀하가 모스크바 주재 귀국 대표에게 우리 대리대사와 협의한 뒤 소련 정부에 전달하도록 훈령한 항의문의 사본을 받았습니다. [주14a] 본인은 이 항의에 전적으로 동의하며, 모스크바 주재 우리 대표에게도 유사한 항의를 하도록 훈령되어 있습니다.\n\n2.\n\n그는 또한 다음의 별도 통보를 하게 되어 있습니다. 시작\n\n1. 폐하의 정부는, 귀하가 4월 13일 해리먼(Harriman) 씨에게 초청을 하였음에도 불구하고 소련 정부가 이제는 빈의 대표 지대 및 잠정 통제기구에 관하여 EAC에서 합의가 이루어질 때까지는 연합국 사절단이 빈으로 가는 데 동의하지 않으려 한다는 것을, 모스크바 주재 영국 대리대사로부터 듣고 크게 우려하고 있습니다. 연합국 사절단이 빈에 도착하여 그곳의 사정을 스스로 확인할 수 있게 되기 전에는, EAC가 빈의 지대와 잠정 통제기구에 관하여 어떠한 합의에 이르는 것도 불가능합니다. 따라서 소련이 그들의 빈행을 허락하기를 거부한 결과 완전한 교착이 빚어졌고, 소련 정부가 오스트리아를 단독으로 장악하게 되어 있습니다.\n\n「2. 그러므로 우리는 연합국 대표들이 즉시 빈으로 갈 수 있도록 허용되어, 그 나라의, 특히 빈 자체의 점령과 통제에 관한 사항들이 현지에서 타결될 수 있게 하는 것이 긴요하다고 봅니다. 우리는 연합국 사절단이 이탈리아에서 즉시 비행해 들어갈 수 있도록 톨부힌(Tolbukhin) 원수에게 필요한 훈령이 내려질 것을 요구합니다. 끝.」\n\n3.\n\n대통령 각하, 본인은 이것이 귀하의 견해에 부합하리라 믿으며, 그렇다면 귀하의 대리대사에게 그의 영국 동료를 지원하도록 훈령해 주시기를 바랍니다.」 [주15]\n\n윌리엄 D. 리히(William D. Leahy)\n\n[112면]", "secondary": "Washington, May 2, 1945.\n\nThe following message from Prime Minister Churchill is forwarded for information and for preparation of a draft reply:\n\n“Prime Minister to President Truman, personal and Top Secret, Number 29, your Number 19. [주14] (1 May 1945)\n\n1.\n\nI have now received from Ambassador Winant a copy of the protest which you have instructed your representative at Moscow to deliver to the Soviet Government after concerting with our Chargé d’Affaires, [주14a] I am in entir
