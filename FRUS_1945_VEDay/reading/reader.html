1"}, {"k": "원문출처", "v": "863.01/4–2645: Telegram", "txt": true}, {"k": "발신", "v": "The Chargé in the Soviet Union (Kennan) 주소련 대리대사 케넌", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 65 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d65"}], "summary": "소련 정부가 카를 레너의 오스트리아 임시정부 구성을 방해하지 않기로 했다는 4월 24일자 비신스키 통첩의 전문을 전한다.", "points": ["비신스키의 4월 24일자 통첩을 소련 정부의 지시에 따라 전달한다는 형식이다.", "붉은 군대가 오스트리아 영토에 들어가자 전 오스트리아 공화국 총리이자 자유오스트리아평의회 마지막 의장이던 카를 레너가 소련군 사령부에 접촉해, 오스트리아의 해방과 독립국가 회복에 모든 원조를 제공할 준비가 되어 있다고 밝혔다.", "레너는 독일에 의해 해산된 오스트리아 자유국민평의회의 마지막 의장으로서 정부를 구성할 법적 권리가 있다고 주장했다.", "레너는 붉은 군대가 해방한 지역에 남아 있는 전(前) 오스트리아 의회 의원들을 소집해 임시정부 구성 문제를 결정하려 하며, 모든 정당과 무당파 인사가 들어와야 한다는 견해다.", "국토 대부분이 독일에 점령되어 있고 남성 전체와 여성 상당수가 독일에 의해 끌려갔으므로 국민의회 선거는 불가능하다는 것이 레너의 논거다.", "소련 정부는 오스트리아 임시정부 창설이 연합국의 대의에 실질적 도움이 될 수 있다는 전제 위에서, 레너와 다른 정치인들의 임시정부 구성 작업을 방해하지 않는 것이 가능하다고 본다.", "동일한 내용의 서한이 영국 대리대사에게도 발송되었다.", "1945년 4월 27일 레너를 총리로 하는 오스트리아 임시정부가 구성되고 오스트리아 공화국 재건이 선포되었다.[주78]"], "primary": "모스크바, 1945년 4월 26일 오후 6시.\n [접수 4월 26일 오후 3시 50분]\n\n1361. 4월 24일자 비신스키[원문 표기 Yyshinski]의 통보가 방금 접수되었는데, 그는 소련 정부로부터 다음을 통보하도록 지시받았다고 밝히고 있다.\n\n「붉은 군대가 오스트리아 영토에 진입하자, 전(前) 오스트리아 공화국 총리이자 자유오스트리아평의회의 마지막 의장인 카를 레너(Karl Renner)가 소련군 사령부에 접촉하여, 연합국이 오스트리아를 해방하고 독립된 오스트리아 국가를 회복하는 데 온갖 원조를 제공할 준비가 되어 있다고 밝혔다.\n\n「소련군이 오스트리아 수도 빈에 진입한 뒤 카를 레너는 임시 오스트리아 정부를 구성하고자 하는 자신의 희망을 소련군 사령부에 알렸다. 이와 관련하여 카를 레너는, 독일인들에 의해 해산된 오스트리아 자유국민평의회의 마지막 의장인 자신에게 그러한 정부를 구성할 법적 권리가 있다고 말했다. 그는 붉은 군대가 해방한 오스트리아 영토에 남아 있는 전 오스트리아 의회 의원들을 소집하여, 그들과 함께 임시 오스트리아 정부의 구성 문제를 결정하고자 하며, 그의 의견으로는 그 정부에는 오스트리아의 모든 정당의 대표와 무당파 인사들이 들어가야 한다는 것이다.\n\n「카를 레너는 이러한 정부 조직 방식이 현재로서는 유일하게 가능한 방식이라고 여긴다. 오스트리아 영토의 대부분이 독일군에 점령되어 있고, 붉은 군대가 해방한 오스트리아 영토에서는 남성 인구 전체와 여성 인구의 상당 부분이 독일인들에 의해 끌려갔다는 사실에 비추어, 현재로서는 국민의회 선거를 실시하는 것이 불가능하기 때문이다.\n\n「오스트리아 임시정부의 창설이 오스트리아를 독일의 예속에서 완전히 해방하기 위한 싸움에서 연합국의 대의에 실질적인 도움이 될 수 있다는 전제 위에서, 소련 정부는 카를 레너[95면]와 그 밖의 오스트리아 정치인들이 오스트리아 임시정부를 구성하는 작업을 방해하지 않는 것이 가능하다고 여긴다.[주78]\n\n「대리대사께서는 위의 내용을 귀 정부에 알려 주시기 바랍니다.\n\n「나는 영국 대리대사에게도 같은 내용의 서한을 보내고 있습니다.」\n\n케넌(Kennan)", "secondary": "Moscow, April 26, 1945—6 p.m. \n [Received April 26—3:50 p.m.]\n\n1361. Communication has just been received from Yyshinski dated April 24 in which he states that he has been directed by the Soviet Government to communicate the following.\n\n“Upon entry of the Red Army onto territory of Austria the former Chancellor of the Austrian Republic and last President of the Free Austrian Council, Karl Renner, addressed himself to the Soviet Command stating that he was prepared to extend every aid to the Allies in liberating and restoring an independent Austrian state.\n\n“After the entry of Soviet forces into the Austrian capital Vienna Karl Renner informed the Soviet command of his desire to form a provisional Austrian government. In this connection Karl Renner stated that he, as the last President of the Free National Council of Austria which had been dissolved by the Germans, had the legal right to form such a government. He proposes to call together the former Deputies of the Austrian Parliament who have remained in the territory of Austria freed by the Red Army and together with them to decide the question of the composition of a provisional Austrian government into which, in his opinion, representatives of all the political parties of Austria and of non-party elements should enter.\n\n“Karl Renner considers that this means of organizing a government is at the present time the only possible one inasmuch as it is not possible at present to conduct elections to the National Assembly in view of the fact that the greater part of Austrian territory is occupied by the Germans and the entire male population and a considerable part of the female population of the Austrian territory freed by the Red Army has been driven off by the Germans.\n\n“On the assumption that the creation of a provisional Austrian government can be of substantial help to the cause of the Allies in the battle for the complete liberation of Austria from German dependence, the Soviet Government considers it possible not to hinder Karl Renner [95면] and other political figures of Austria in their work of forming a provisional Austrian government. [주78]\n\n“I request you please Mr. Chargé d’Affaires, to bring the above to the knowledge of your government.\n\n“I am sending a letter of similar content to the British Chargé as well.”\n\nKennan", "notes": ["[주77] 이 전보의 본문은 4월 28일 국무부 전보 제393호로 카세르타에, 국무부 제3324호로 런던에, 국무부 제1739호로 파리에 재전송되었다. 이 전보에 인용된 소련 정부 각서는 주소련 대사가 4월 26일 오후 8시 빈 주재 오스트리아 문제 담당 미국 정치고문 앞 전보 제65호로 요약했으나 국무부에는 재전송되지 않았다(빈 대사관 파일).", "[주78] 1945년 4월 27일 카를 레너를 총리로 하는 오스트리아 임시정부가 구성되었고 오스트리아 공화국의 재건이 선포되었다. 새 정부의 구성 경위와 진용, 그리고 선언문의 본문에 관하여는 Österreichisches Jahrbuch 1945–1946 Nach Amtlichen Quellen(빈, 1947), pp. 7–12 참조."], "warn": false, "pages": ["95"], "search": "Kennan 케넌(주소련 대리대사) Vyshinski 비신스키 Karl Renner 카를 레너(전 오스트리아 공화국 총리)"}, {"id": "d66", "order": 66, "date": "1945-04-26", "group": "A", "eyebrow": "d66 · The Chargé in the Soviet Union (Kennan) to the Secretary of State", "title": "주소련 대리대사(케넌)가 국무장관에게", "badge": null, "list_right": "문서 66", "meta": [{"k": "일자", "v": "1945-04-26"}, {"k": "시각", "v": "Moscow, April 26, 1945—7 p.m. [Received April 26—4:10 p.m.]"}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": "1363"}, {"k": "원문출처", "v": "740.00119 Control (Austria)/4–2645: Telegram", "txt": true}, {"k": "발신", "v": "The Chargé in the Soviet Union (Kennan) 주소련 대리대사 케넌", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 66 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d66"}], "summary": "케넌이 비신스키 서한의 「유럽자문위원회에서 소련 측이 내놓은 제안에 부합하게」라는 문구에 특히 주의를 환기하며, 빈에 가는 미국 장교들이 소련 제안의 틀 안에서만 논의할 수 있으리라 경고한다.", "points": ["비신스키 서한 중 「유럽자문위원회에서 소련 측이 심의를 위해 내놓은 제안에 부합하게」라는 표현에 특별히 주의를 환기한다.", "이 문구와 다른 경우에 관찰된 소련의 관행에 비추어, 빈에 가는 우리 장교들은 소련 지휘관이 오스트리아와 빈의 점령지대 획정 문제를 오직 이미 유럽자문위원회에 제출된 소련 제안의 토대 위에서, 그 일반적 틀 안에서만 논의할 권한을 가지고 있으리라 예상해야 한다.", "국무부에 1363호로 발송, 카세르타의 에르하르트 앞으로 64호로 재전송."], "primary": "모스크바, 1945년 4월 26일 오후 7시.\n [접수 4월 26일 오후 4시 10분]\n\n1363. 본 대사관 제1348호, 4월 25일 오후 7시, 국무부 앞, 카세르타에 63호로 재전송한 건에 대하여. 임시 관리기구의 업무에 참여할 미국 장교들을 빈으로 파견하는 문제에 관한 비신스키의 서한과 관련하여, 나는 비신스키가 「유럽자문위원회에서 심의하도록 소련 측이 내놓은 제안에 부합하게」라는 말을 쓴 데 특별히 주의를 환기하고자 한다.\n\n이 표현과, 다른 경우들에서 관찰된 소련의 관행에 비추어 볼 때, 우리 장교들이 빈에 갔을 때 소련 지휘관은 오스트리아와 빈에서의 점령지대 획정[원문 표기 delimination] 문제를 오직 이미 유럽자문위원회에 제출된 소련 측 제안의 토대 위에서, 그리고 그 일반적 틀 안에서만 논의할 권한을 가지고 있으리라고 예상해도 좋을 것이다.\n\n국무부에 1363호로 발송, 카세르타의 에르하르트 앞으로 64호로 재전송.\n\n케넌(Kennan)", "secondary": "Moscow, April 26, 1945—7 p.m. \n [Received April 26—4:10 p.m.]\n\n1363. ReEmbs 1348, April 25, 7 p.m. to Department, repeated to Caserta as 63. With respect to Vyshinski’s letter concerning the despatch to Vienna of American officers to participate in the work of the provisional control machinery I wish to invite particular attention to Vyshinski’s use of the words “in conformity with the proposals advanced from the Soviet side for consideration in the EAC.”\n\nIn view of this wording and of Soviet practice as observed on other occasions our officers may expect when they go to Vienna that the Soviet commander will have authority to discuss the questions of delimination of zones of occupation in Austria and Vienna only on the basis of and within the general framework of the Soviet proposals already advanced in EAC.\n\nSent Department as 1363, repeated to Caserta for Erhardt as 64.\n\nKennan", "notes": [], "warn": false, "pages": [], "search": "Kennan 케넌(주소련 대리대사) Vyshinski 비신스키 Erhardt 에르하르트(오스트리아 문제 담당 미국 정치고문)"}, {"id": "d67", "order": 67, "date": "1945-04-26", "group": "A", "eyebrow": "d67 · The Chargé in the Soviet Union (Kennan) to the Secretary of State", "title": "주소련 대리대사(케넌)가 국무장관에게", "badge": null, "list_right": "문서 67", "meta": [{"k": "일자", "v": "1945-04-26"}, {"k": "시각", "v": "Moscow, April 26, 1945—8 p.m. [Received April 26—5 p.m.]"}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": "1364"}, {"k": "원문출처", "v": "863.01/4–2645: Telegram", "txt": true}, {"k": "발신", "v": "The Chargé in the Soviet Union (Kennan) 주소련 대리대사 케넌", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 67 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d67"}], "summary": "케넌이 레너의 임시정부 구상을 논평하며, 빈 지역에 남은 전직 의원은 급진 좌파뿐일 것이므로 대표성 있는 오스트리아 정부가 나오기 어렵다고 본다.", "points": ["오스트리아 좌파 세력 대부분이 빈 관구에 집중되어 있었다.", "그곳의 비좌파 인사 상당수는 붉은 군대 진입 후 러시아군뿐 아니라 오스트리아 파르티잔과 공산 세력의 손에 무슨 일을 당할지 우려하여 달아난 것으로 추정된다.", "따라서 오늘날 빈 지역에서 찾을 수 있는 전직 의회 의원은 급진 좌파 성향의 인사 외에는 많지 않으리라고 보아야 한다.", "남성 인구 전체가 강제로 끌려갔다는 비신스키 자신의 진술도 이를 뒷받침한다.", "레너의 이름과 연륜이 오스트리아 사회에서 존경을 받는다 하더라도, 현 조건에서 붉은 군대가 해방한 지역에서 대표성 있는 오스트리아 정부에 준하는 것을 그가 결집해 낼 가능성은 낮다.", "남성 인구 전체와 여성 인구의 상당 부분이 독일에 의해 끌려갔다는 비신스키의 진술은, 이 대사관이 소련 당국으로부터 오스트리아 사정에 관해 받은 최초의 정보다."], "primary": "모스크바, 1945년 4월 26일 오후 8시.\n [접수 4월 26일 오후 5시]\n\n1364. 본 대사관 제1361호(국무부 앞) 및 대사관 제65호(카세르타의 에르하르트 앞)[주79]에 대하여. 레너에 의한 오스트리아 임시정부 구성에 관한 소련 측 통보와 관련하여, 국무부는 [96면] 오스트리아 좌파 세력의 대부분이 빈 관구에 집중되어 있었다는 점, 그리고 그곳의 비좌파 인사 가운데 매우 큰 비율이 붉은 군대 진입 이후 러시아군뿐 아니라 오스트리아 파르티잔과 공산 세력의 손에 자신들에게 무슨 일이 닥칠지 염려하여 달아났으리라고 추정된다는 점에 유의할 것이다. 그러므로 오늘날 빈 지역에서 급진 좌파 성향의 인사가 아닌 전직 의회 의원을 많이 찾아낼 수 있으리라고 상정해서는 안 된다. 이는 남성 인구 전체가 강제 이송되었다는 비신스키 자신의 진술로도 더욱 뒷받침된다. 따라서 레너의 이름과 연륜이 오스트리아 사회에서 어느 정도 존경을 자아낼 수 있는가와 무관하게, 현재의 조건 아래에서 붉은 군대가 해방한 영토에서 그가 대표성 있는 오스트리아 정부에 준하는 어떠한 것도 결집해 낼 가능성은 높지 않다.\n\n소련 점령지역의 남성 인구 전체와 여성 인구의 상당 부분이 독일인들에 의해 끌려갔다는 비신스키의 진술은, 본 대사관이 오스트리아의 사정에 관하여 소련 당국으로부터 받은 최초의 어떠한 종류의 정보이기도 하다.\n\n케넌(Kennan)", "secondary": "Moscow, April 26, 1945—8 p.m. \n [Received April 26—5 p.m.]\n\n1364. ReEmbs 1361 to Department and Embassy’s 65 to Caserta for Erhardt. [주79] With respect to Soviet communication about formation of provisional government hi Austria by Renner, the Department [96면] will note that most of the Austrian left wing elements were concentrated in the Vienna District and of the non-left wing elements there a very large proportion presumably fled out of apprehension over what might happen to them after the entry of the Red Army at the hands not only of the Russian forces but also of Austrian Partisans and Communist elements. It is not to be supposed therefore that many former parliamentary Deputies could be found in the Vienna area today other than those of a radical left wing persuasion. This is further supported by Vyshinski’s own statement that the entire male population has been deported. Thus regardless of the extent to which Renner’s name and age might inspire respect in Austrian circles it is not likely that he would be able to mobilize under existing conditions anything resembling a representative Austrian government in the territory liberated by the Red Army.\n\nVyshinski’s statement that the entire male population and a considerable part of the female population of the Soviet occupied area have been driven off by the Germans is the first information of any sort this Embassy has had from Soviet authorities on conditions in Austria.\n\nKennan", "notes": ["[주79] 94면의 각주 77 참조."], "warn": false, "pages": ["96"], "search": "Kennan 케넌(주소련 대리대사) Vyshinski 비신스키 Karl Renner 카를 레너 Erhardt 에르하르트"}, {"id": "d68", "order": 68, "date": "1945-04-26", "group": "A", "eyebrow": "d68 · The United States Political Adviser on Austrian Affairs (Erhardt) to the Secretary of State", "title": "오스트리아 문제 담당 미국 정치고문(에르하르트)이 국무장관에게", "badge": null, "list_right": "문서 68", "meta": [{"k": "일자", "v": "1945-04-26"}, {"k": "시각", "v": "Caserta, April 26, 1945—9 p.m. [Received April 26—9:20 a.m.]"}, {"k": "장소", "v": "Caserta", "txt": true}, {"k": "전문번호", "v": "1733"}, {"k": "원문출처", "v": "740.019 Control (Austria)/4–2645: Telegram", "txt": true}, {"k": "발신", "v": "The United States Political Adviser on Austrian Affairs (Erhardt) 오스트리아 문제 담당 미국 정치고문 에르하르트", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 68 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d68"}], "summary": "카세르타의 군 대표들이 모든 점령군의 지위 평등에 관한 합의 없이 빈에 사절단을 보내는 것이 과연 옳은지 의문을 품고 있으며, 알렉산더는 빈 시가 아니라 「빈 관구」 전체를 논의 대상으로 삼자고 주장한다는 보고.", "points": ["빈으로 갈 연합국 사절단에 관한 4월 25일자 합참의 대(對)매크나니 전보 W 72646을 국무부가 읽어야 한다.[주80]", "매크나니 장군은 이 문제를 알렉산더 원수와 논의했고, 매크나니가 합참에 보내는 FX–65623호가 오늘 밤 발송된다.", "알렉산더 원수는 영국 참모총장들에게 병행 훈령을 보내는데, 다만 그는 빈에서의 논의를 시(市)라는 좁은 범위가 아니라 「빈 관구(Gau Vienna)」를 대상으로 하도록 촉구하고 있다.", "영국 외무부도 동의하여, 알렉산더 원수는 지금 빈으로 가지 않기로 결정되었다.", "카세르타의 군 대표들은 대체로, 모든 점령군의 지위 평등(equality of status)에 관한 일반적 합의가 이루어지기 전에 대표들을 빈에 보내는 것이 과연 타당한지 의문을 품고 있다.", "그들이 염두에 둔 것은 내부 도심(Innere Stadt)·비행장·시설의 공동 점령과 사용, 통과권, 모든 인원의 이동의 자유다.", "알렉산더는 러시아 측이 지금 빈 관구에서의 지위 평등을 수용하지 않는다면 사절단 파견이 부적절하다고 영국 참모총장들에게 알리려 했으나 매크나니의 입장에 설득되어 그만두었다.[주81]", "국무부에 발송, 런던에 171호로 재전송."], "primary": "카세르타, 1945년 4월 26일 오후 9시.\n [접수 4월 26일 오전 9시 20분]\n\n1733. 국무부는 빈으로 갈 것이 제안된 연합국 사절단에 관하여 합동참모본부가 매크나니 장군에게 보낸 4월 25일자 W 72646호[주80]를 읽어야 한다. 매크나니 장군은 이 문제를 알렉산더 원수와 논의했고, 매크나니 장군이 합동참모본부에 보내는 FX–65623호 전문이 오늘 밤 발송된다.\n\n원수는 영국 참모총장단에 병행하는 훈령을 보내고 있는데, 다만[원문 expecting, excepting?] 그는 빈에서의 논의가 시(市)라는 더 좁은 범위가 아니라 빈 관구(Gau Vienna)를 대상으로 이루어지도록 촉구하고 있다. 원수가 지금은 빈으로 가지 않는 것으로 결정되었으며, 내가 들은 바로는 영국 외무부도 이에 동의한다.\n\n국무부가 알아 두어야 할 것은, 카세르타의 군 대표들이 대체로 [97면] 모든 점령군의 지위 평등에 관한 일반적 합의가 이루어지기에 앞서 대표들을 빈으로 보내는 것이 과연 타당한지 의문을 품는 쪽으로 기울어 있다는 점이다. 그들이 염두에 두고 있는 것은 내부 도심(Innere Stadt), 비행장, 시설의 공동 점령과 사용, 통과권, 그리고 모든 인원의 이동의 자유를 포함한다. 원수와 매크나니 장군은 언제나 이 점들을 특별히 강력하게 주장해 왔다. 바로 오늘도 알렉산더는 빈 관구를 강하게 주장했으며, 러시아 측이 빈 관구에서의 지위 평등을 지금 받아들이지 않는다면 사절단을 빈에 파견하는 것은 바람직하지 않다고 여긴다는 뜻을 영국 참모총장단에 알리고자 했으나, 이 문제에 관한 매크나니 장군의 입장에 설득되어 단념했다.[주81]\n\n국무부에 발송, 런던에 171호로 재전송.\n\n[에르하르트]", "secondary": "Caserta, April 26, 1945—9 p.m. \n [Received April 26—9:20 a.m.]\n\n1733. The Department should read W 72646 of April 25 from Joint Chiefs of Staff for General McNarney [주80] in regard to the proposed Allied Mission to proceed to Vienna. General McNarney discussed this subject with Field Marshal Alexander and a message, No. FX–65623 from General McNarney to Joint Chiefs of Staff, is going out tonight.\n\nThe Field Marshal is sending a parallel instruction to the British Chiefs of Staff expecting [excepting?] that he is urging that the discussions in Vienna be upon Gau Vienna rather than the narrower limits of the city. It has been decided and the British Foreign Office concurs, so I am told, that the Field Marshal will not now proceed to Vienna.\n\nThe Department should know that the military representatives in Caserta are, in general, disposed to question the advisability of having [97면] representatives proceed to Vienna before a general agreement is reached on the equality of status of all occupying forces. What they have in mind includes joint occupation and use of the Innere Stadt, airports, facilities, transit rights and freedom of movement of all personnel. The Field Marshal and General McNarney have always been especially insistent on these points. Even today Alexander argued strongly for Gau Vienna and he wished, until dissuaded by General McNarney’s position on the subject, to inform the British Chiefs of Staff that unless equality of status in the Vienna Gau was accepted by the Russians now he felt it would be inadvisable to despatch a mission to Vienna. [주81]\n\nSent Department, repeated London as 171.\n\n[Erhardt]", "notes": ["[주80] 수록하지 않음. 국방부가 제공한 정보에 따르면 이 전문은 합동참모본부가 육군부를 통해 발송한 것으로 4월 24일자다. 이 전보의 요약은 5월 1일 오후 3시 런던 앞 국무부 전보 제3400호의 마지막 문단(107면) 참조.", "[주81] 에르하르트 씨는 4월 28일 오후 12시자 전보 제1792호에서, 영국 참모총장단이 위에 요약한 알렉산더 원수의 견해에 동의했으며 영국 참모총장단이 알렉산더에게 빈 사절단에 관하여 톨부힌 원수와 협의하도록 지시했다고 보고했다(740.00119 Control (Austria)/4–2845)."], "warn": true, "pages": ["97"], "search": "Erhardt 에르하르트(오스트리아 문제 담당 미국 정치고문) McNarney 매크나니 Alexander 알렉산더(원수) Tolbukhin 톨부힌(원수)"}, {"id": "d69", "order": 69, "date": "1945-04-26", "group": "A", "eyebrow": "d69 · The Ambassador in France (Caffery) to the Secretary of State", "title": "주프랑스대사(캐퍼리)가 국무장관에게", "badge": null, "list_right": "문서 69", "meta": [{"k": "일자", "v": "1945-04-26"}, {"k": "시각", "v": "Paris, April 26, 1945—9 p.m. [Received 9:45 p.m.]"}, {"k": "장소", "v": "Paris", "txt": true}, {"k": "전문번호", "v": "2131"}, {"k": "원문출처", "v": "740.00119 Control (Austria)/4–2645: Telegram", "txt": true}, {"k": "발신", "v": "The Ambassador in France (Caffery) 주프랑스대사 캐퍼리", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 69 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d69"}], "summary": "스탈린의 제안에 따라 미·영 대표단과 함께 빈으로 갈 프랑스 대표단 7명의 명단과 이동·통신 관련 요청을 전한다.", "points": ["스탈린의 제안에 따라 미국·영국 대표단과 함께 빈으로 갈 프랑스 대표단의 구성을 프랑스 외무부가 통보해 왔다.", "대표단은 7명이다. 단장 필리프 보데(공사 개인 자격), 로베르 뤼크(대사관 서기관), 마들렌 르 브르통(비서), 폴 셰리에르 준장, 베크 대위, 피에르 몰레 중위, 앙드레 마르벨(프랑스 여군).", "대표단은 수송이 마련되면 토요일[4월 28일] 오후나 일요일 오전에 파리를 떠나 카세르타로 갈 준비가 되어 있다.", "보데는 소지할 프랑스 프랑을 이탈리아와 오스트리아의 적절한 통화로 바꿀 수 있는지, 그리고 빈에서의 통신 시설 사정을 문의했다.", "그는 암호책을 가지고 가며, 빈에서 암호로 본국 정부와 통신하고 외교행낭으로 문서를 보낼 수 있으리라 상정하고 있다.", "캐퍼리는 일요일에 ATC 편으로 대표단이 카세르타로 갈 수 있게 주선하고 있다.", "카세르타에 41호로 발송, 런던에 252호로 재전송."], "primary": "파리, 1945년 4월 26일 오후 9시.\n [접수 오후 9시 45분]\n\n2131. 에르하르트 앞. 프랑스 외무부가 방금, 스탈린의 제안에 따라 미국 및 영국 대표단과 함께 빈으로 갈 프랑스 대표단의 구성을 나에게 알려 왔다. 7명으로 이루어진 대표단은 다음과 같다. 필리프 보데(Philippe Baudet), 공사의 개인 직급을 가진 대표단장, 로베르 뤼크(Robert Luc), 대사관 서기관, 마들렌 르 브르통(Madelaine Le Breton) 양, 비서, 폴 셰리에르(Paul Cherriere) 준장, 베크(Becque) 대위, 피에르 몰레(Pierre Mollet) 중위, 앙드레 마르벨(Andree Marvelle) 양(프랑스 여군 WAC).\n\n보데는 또한, 수송편이 마련될 수 있다면 대표단이 토요일[주82] 오후나 일요일 오전에 파리를 떠나 카세르타로 갈 준비가 되어 있으리라고 나에게 알려 왔다. 그는 자신이 지참할 프랑스 프랑에 대하여 이탈리아와 오스트리아에서 적절한 통화를 얻을 수 있는지 문의했으며, 빈에 머무는 동안의 통신 시설에 관하여 입수 가능한 정보가 있으면 고맙겠다고 했다. 그는 암호책을 지참하고 있으며, 빈에서 자국 정부와 암호로 통신할 수 있고 또한 빈에서 외교행낭으로 외교 문서를 보내는 것도 가능하리라고 상정하고 있다.\n\n[98면]\n\n프랑스 대표단은 일요일에 카세르타로 갈 준비가 되어 있다고 알려 왔으며, 나는 그날 그들이 ATC 편으로 그곳에 갈 수 있도록 주선하고 있다.\n\n카세르타에 41호로 발송, 런던에 252호로 재전송.\n\n캐퍼리(Caffery)", "secondary": "Paris, April 26, 1945—9 p.m. \n [Received 9:45 p.m.]\n\n2131. For Erhardt. The Foreign Ministry has just informed me of the composition of the French delegation which will proceed to Vienna with the American and British delegations in accordance with Stalin’s proposal. The delegation consisting of seven members is as follows: Philippe Baudet, Chief of the delegation with personal rank of Minister, Robert Luc, Secretary of Embassy, Miss Madelaine Le Breton, secretary, Brigadier General Paul Cherriere, Captain Becque, Lieutenant Pierre Mollet, Miss Andree Marvelle (French WAC).\n\nBaudet has also informed me that the delegation will be prepared to leave Paris for Caserta on Saturday [주82] afternoon or Sunday morning if transportation can be arranged. He has requested information as to whether he can obtain the appropriate currency in Italy and Austria for French francs which he will carry with him and he will also appreciate having any available information relating to the communications facilities while in Vienna. He is bringing with him codes and assumes that he may communicate from Vienna with his Government by cipher and that it will also be possible to send diplomatic correspondence from Vienna by pouch.\n\n[98면]\n\nThe French delegation has indicated that it will be ready to proceed to Caserta on Sunday and I am arranging for them to proceed there by ATC on that day.\n\nSent Caserta as 41; repeated London as 252.\n\nCaffery", "notes": ["[주82] 4월 28일."], "warn": false, "pages": ["98"], "search": "Caffery 캐퍼리(주프랑스대사) Erhardt 에르하르트 Stalin 스탈린 Philippe Baudet 필리프 보데 Robert Luc 로베르 뤼크 Madelaine Le Breton 마들렌 르 브르통 Paul Cherriere 폴 셰리에르 Becque 베크 Pierre Mollet 피에르 몰레 Andree Marvelle 앙드레 마르벨"}, {"id": "d193", "order": 193, "date": "1945-04-26", "group": "A", "eyebrow": "d193 · President Truman to the British Prime Minister (Churchill)", "title": "트루먼 대통령이 영국 총리(처칠)에게", "badge": null, "list_right": "문서 193", "meta": [{"k": "일자", "v": "1945-04-26"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "13"}, {"k": "원문출처", "v": "Department of Defense Files: Telegram", "txt": true}, {"k": "발신", "v": "President Truman 트루먼 대통령", "txt": true}, {"k": "수신", "v": "The British Prime Minister (Churchill) 영국 총리 처칠", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 193 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d193"}], "summary": "트루먼이, 소련 지대에 들어가 있는 군대가 미군이므로 점령지대 철수 합의는 3국 간의 것이어야 한다며, 처칠이 스탈린과 자신에게 보낼 전문의 초안을 제시한다.", "points": ["지금 소련 지대에 있는 군대가 미군이라는 사실에 비추어, 독일과 오스트리아의 전후 점령지대로의 철수에 관한 어떠한 합의도 3국 간(tripartite)이어야 한다는 것이 트루먼의 견해다.", "제시된 초안 제2항: 최우선 과제는 독일군의 최종 격파이며, 이 기간 3국 군대 사이의 경계는 현지 지휘관이 작전상 고려에 따라 정한다. 최종 점령지대 밖의 영토를 점령하게 되는 것은 불가피하다.", "제3항: 전투가 끝나면 베를린과 빈에 연합국통제위원회를 세우고 각국 군대를 재배치해 각자의 점령지대를 인수한다. 독일의 지대 획정은 이미 결정되었고, 오스트리아의 지대는 스탈린이 제안한 빈 회합에서 지체 없이 합의해야 한다.", "제4항: 「이제 서명된 항복문서(signed instrument of surrender)는 나오지 않을 것으로 보인다」. 그럴 경우 각국 정부는 즉시 연합국통제위원회를 설치하고, 합의된 점령지대로의 병력 철수에 관한 세부 조정을 그 위원회에 맡겨야 한다.", "제5항: 아이젠하워에게 이미 보낸 훈령이다. (a) 양군의 혼선과 상대 점령지역으로의 확대를 막기 위해 양측은 만나는 지점에서 그대로 정지한다. (b) 적대행위 종료 후에는 지대 경계와 무관하게 군사적 필요에 따라 배치하되, 큰 조정은 사전에 연합참모본부의 승인을 얻는다.", "제6항: 스탈린도 자기 현지 지휘관들에게 유사한 훈령을 내려 달라는 요청.", "처칠에게서 위 전문을 받는 즉시 트루먼은 스탈린에게 전적으로 동의한다고 알리겠다고 했다.", "처칠은 4월 27일 제18호 전보에서 위 전문을 스탈린에게 보냈다고 회신하며, 힘러-베르나도테 접촉에 대해 세 나라가 신속히 일치된 견해를 알린 데 스탈린이 만족한 듯하다고 덧붙였다.[주79]"], "primary": "[워싱턴,] 1945년 4월 26일.\n\n13. 귀하의 제13호에 관하여, 특히 현재 소련 지대에 있는 군대가 미군이라는 사실에 비추어 볼 때, 독일과 오스트리아에서 지정된 전후(post hostility) 점령지대로의 철수에 관하여 체결되는 어떠한 합의도 3국 간의 것이어야 한다고 나에게는 여겨집니다.\n\n따라서 나는 귀하가 스탈린 원수와 나에게 다음 전문을 보내 주실 것을 고려해 주시기를 제안합니다.\n\n「1. 영미군은 곧 독일에서 소련군과 접촉하게 될 것이며, 독일의 저항이 종말에 다가감에 따라 미합중국, 영국 및 [245면] 소련은 각자의 군대가 독일과 오스트리아에서 점령하게 될 지대의 점령을 위한 질서 있는 절차를 정할 필요가 있게 되었다.\n\n2. 우리의 당면 과제는 독일군의 최종적 격파다. 이 기간 동안 3개 연합국 군대 사이의 경계는 현지 지휘관들이 결정해야 하며, 작전상의 고려와 요구에 따라 정해질 것이다. 이 국면에서 우리 군대가 최종적인 점령지대의 경계 밖에 있는 영토를 점령하고 있게 되는 것은 불가피하다.\n\n3. 전투가 끝나면 다음 과제는 베를린과 빈에 연합국통제위원회를 설치하고, 연합국 군대를 재배치하여 각자의 점령지대를 인수하는 것이다. 독일에서의 지대 획정은 이미 결정되었으며, 오스트리아에서 점령할 지대에 관하여는 귀하가 제안한 빈에서의 다가올 회합에서 지체 없이 합의에 이르러야 한다.\n\n4. 이제는 서명된 항복문서(signed instrument of surrender)가 나오지 않을 것으로 보인다. 그러할 경우 각국 정부는 즉시 연합국통제위원회를 설치하기로 결정하고, 합의된 점령지대로의 병력 철수를 위한 세부 조정 작업을 그 위원회에 맡겨야 한다.\n\n5. 위 제2항에서 언급한 사태의 요구, 즉 전술적 지대에 관한 긴급하고 잠정적인 조치에 부응하기 위하여 아이젠하워 장군에게 훈령이 발송되었다. 그 내용은 다음과 같다.\n\n(a)\n\n두 군대 사이의 혼선을 피하고 어느 한쪽이 상대가 이미 점령한 지역으로 확장해 들어가는 것을 막기 위하여, 양측은 서로 만나는 그 자리에서 정지해야 한다. 다만 어느 쪽이든 현지 지휘관의 판단으로 잔존 저항을 처리하기 위해 필요한, 후방이나 측방으로의 조정은 예외로 한다.\n\n(b)\n\n어느 지역에서 적대행위가 그친 뒤의 병력 조정에 관하여는, 귀 부대는 지대 경계와 무관하게 군사적 요구에 따라 배치되어야 한다. 귀관은 사태의 긴급성이 허용하는 한, 작전상·행정상 이유에 따른 국지적 조정과 달리 주요한 조정에 앞서 연합참모본부의 승인을 얻어야 한다.\n\n6. 귀하도 현지의 자국 지휘관들에게 유사한 훈령을 내려 주시기를 요청한다.」\n\n귀하로부터 위 전문을 접수하는 대로 나는 즉시 스탈린 원수에게 이에 전적으로 동의한다고 알리겠습니다.[주79]\n\n[246면]", "secondary": "[Washington,] 26 April 1945.\n\n13. Referring to your Number 13, it appears to me, particularly in view of the fact that the Armies now in the Soviet zone are American, that any agreement entered into regarding withdrawal to the designated post hostility zones of occupation in Germany and Austria should be tripartite.\n\nI therefore suggest for your consideration that you address the following message to Marshal Stalin and to me:\n\n“1. The Anglo-American armies will soon make contact in Germany with Soviet forces, and the approaching end of German resistance makes it necessary that the United States, Great Britain, and [245면] the Soviet Union decide upon an orderly procedure for the occupation by their forces of the zones which they will occupy in Germany and in Austria.\n\n2. Our immediate task is the final defeat of the German Army. During this period the boundaries between the forces of the three Allies must be decided by Commanders in the field, and will be governed by operational considerations and requirements. It is inevitable that our armies will in this phase find themselves in occupation of territory outside the boundaries of the ultimate occupational zones.\n\n3. When the fighting is fininshed, the next task is for the Allied Control Commissions to be set up in Berlin and Vienna, and for the forces of the Allies to be redisposed and to take over their respective occupational zones. The demarcation of the zones in Germany has already been decided upon and it is necessary that we shall without delay reach an agreement on the zones to be occupied in Austria at the forthcoming meeting proposed by you in Vienna.\n\n4. It appears now that no signed instrument of surrender will be forthcoming. In this event governments should decide to set up at once the Allied Control Commissions, and to entrust to them the task of making detailed arrangements for the withdrawal of the forces to their agreed occupational zones.\n\n5. In order to meet the requirements of the situation referred to in paragraph 2 above, namely the emergency and temporary arrangements for the tactical zones, instructions have been sent to General Eisenhower. These are as follows:\n\n(a)\n\nTo avoid confusion between the two armies and to prevent either of them from expanding into areas already occupied by the other, both sides should halt as and where they meet, subject to such adjustments to the rear or to the flanks as are required, in the opinion of the local commanders on either side, to deal with any remaining opposition.\n\n(b)\n\nAs to adjustments of forces after cessation of hostilities in an area, your troops should be disposed in accordance with military requirements regardless of zonal boundaries. You will, in so far as permitted by the urgency of the situation, obtain the approval of the Combined Chiefs of Staff prior to any major adjustment in contrast to local adjustments for operational and administrative reasons.\n\n6. It is requested that you will issue similar instructions to your commanders in the field.”\n\nUpon the receipt of the above message from you, I will at once inform Marshal Stalin that I am in full agreement therewith. [주79]\n\n[246면]", "notes": ["[주79] 처칠 총리는 4월 27일 트루먼 대통령 앞 전보 제18호에서 위에 인용된 전문을 스탈린 원수에게 보냈다고 밝혔다. 처칠은 다음과 같은 논평을 덧붙였다. 「내 생각에 스탈린은 힘러-베르나도테 접촉에 관한 우리의 자발적 견해를 우리가 그토록 신속히 한목소리로 알린 데 대해 흡족해하고 있습니다. 설사 짧은 지연이나 차질이 있더라도, 우리 모든 군대는 훨씬 유리한 위치에 서게 될 것입니다. 이 삼각 관계의 일을 우리가 이처럼 수월하게 처리하도록 촉진해 주신 데 대해 깊이 감사드립니다.」(국방부 파일)"], "warn": false, "pages": ["245", "246"], "search": "Truman 트루먼 Churchill 처칠 Stalin 스탈린 Eisenhower 아이젠하워 Himmler 힘러 Bernadotte 베르나도테"}, {"id": "d350", "order": 350, "date": "1945-04-26", "group": "B", "eyebrow": "d350 · Memorandum by the Acting Secretary of State to President Truman", "title": "국무장관 대리가 트루먼 대통령에게 보내는 각서", "badge": null, "list_right": "문서 350", "meta": [{"k": "일자", "v": "1945-04-26"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 Control (Germany)/4–2645", "txt": true}, {"k": "발신", "v": "The Acting Secretary of State (Joseph C. Grew) 국무장관 대리 조지프 C. 그루", "txt": true}, {"k": "수신", "v": "President Truman 트루먼 대통령", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 350 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d350"}], "summary": "독일 문제 비공식정책위원회가 3월 23일 정책각서에 기초해 개정한 독일 군정 지령을 대통령의 재가를 받고자 제출한다.", "points": ["독일 문제 비공식정책위원회(Informal Policy Committee on Germany)가 독일 군정을 위한 개정 지령을 대통령의 재가를 받고자 제출한다.", "개정 지령은 루스벨트 대통령이 재가한 3월 23일자 정책각서에 기초하여 작성되었다.", "3월 23일 각서는 위넌트 대사에 의해 유럽자문위원회에 제출되어, 영국·소련·프랑스와의 합의 의정서로 교섭에 부쳐졌다.", "위원회는 이 지령이 3월 23일 각서의 원칙을 충실히 수행하며, 독일이 다시 세계 평화의 위협이 되는 것을 막을 실효 있는 초기 조치의 토대를 제공한다고 본다.", "개정 지령은 군사적 관점에서의 검토를 위해 합동참모본부에 제출되고 있으며, 그 뒤 독일에서 패전 직후 초기 시기의 기본 문서로 아이젠하워 장군에게 전달될 것이다.", "이 지령은 이중의 목적을 지닌다. 아이젠하워에게 독일 통제이사회의 미국 위원으로서의 지침이 되고, 동시에 미국 지대의 통치 지침이 된다.", "대통령이 재가하면 위원회는 대통령의 지휘 아래 배상 문제를 포함한 대독일 기본정책의 수립을 계속하겠다.", "위원회 서명자: 리오 크롤리, 윌리엄 L. 클레이턴, 존 J. 매클로이, 랠프 A. 바드, 헨리 모겐소 2세.[주22]"], "primary": "워싱턴, 1945년 4월 26일.\n\n독일 문제 비공식정책위원회[주22]는 루스벨트 대통령이 재가한 3월 23일자 정책각서에 기초하여 작성한, 독일 군정을 위한 개정 지령을 각하의 재가를 받고자 제출합니다. 3월 23일자 각서는 위넌트 대사에 의해 유럽자문위원회에 제출되어 영국, 소련 및 프랑스와의 합의 의정서 [484면] 로서 교섭에 부쳐졌습니다. 3월 23일자 각서와 개정 지령의 사본을 첨부합니다.[주23]\n\n위원회의 의견으로는, 개정 지령은 3월 23일자 각서에 제시된 원칙들을 충실히 수행하는 정책과 조치들을 담고 있습니다. 위원회는 이 지령이 독일이 다시 세계 평화에 대한 위협이 되는 것을 방지할 실효 있는 초기 조치의 토대를 제공한다고 믿습니다.\n\n개정 지령은 군사적 관점에서의 검토를 위하여 합동참모본부에 제출되고 있습니다. 그 뒤에는 독일에서 패전 직후의 초기 시기를 위한 기본 문서로서 아이젠하워 장군에게 전달될 것입니다. 이 지령은 이중의 목적에 쓰이도록 만들어졌습니다. 즉 독일 통제이사회의 미국 측 위원으로서 그가 따를 지침으로 현재까지 정리된 우리 정부의 정책을 그에게 제시하며, 또한 미국 지대의 통치에서도 그를 인도하게 될 것입니다.\n\n각하께서 재가하신다면, 독일 문제 비공식정책위원회는 각하의 지휘 아래 배상이라는 계류 중인 문제를 포함하여 독일 처리에 관한 우리 정부의 기본 정책을 계속 발전시켜 나가겠습니다.\n\n조지프 C. 그루(Joseph C. Grew)", "secondary": "Washington, April 26, 1945.\n\nThe Informal Policy Committee on Germany [주22] is presenting to you, for your approval, a revised directive for the military government of Germany prepared on the basis of the policy memorandum of March 23, which was approved by President Roosevelt. The memorandum of March 23 has been introduced into the European Advisory Commission by Ambassador Winant for negotiation as a protocol of agreement [484면] with the U.K., the U.S.S.R. and France. Copies of the memorandum of March 23 and the revised directive are attached. [주23]\n\nIn the opinion of the committee the revised directive embodies policies and measures which faithfully carry out the principles set forth in the memorandum of March 23. The committee believes that this directive furnishes the basis for effective initial action to prevent Germany from again becoming a threat to world peace.\n\nThe revised directive is being submitted to the Joint Chiefs of Staff for consideration from the military point of view. Thereafter it will be transmitted to General Eisenhower as the basic instrument for the initial post-defeat period in Germany. The directive is designed to serve a dual purpose in that it will give him this Government’s policy as formulated to date for his guidance as American member of the Control Council in Germany and will likewise guide him in the administration of the U.S. zone.\n\nIf you approve, the Informal Policy Committee on Germany will continue, under your direction, to develop basic policies of this Government for the treatment of Germany, including the pending matter of reparation.\n\nJoseph C. Grew", "notes": ["[주22] 이 문서 말미에는 위원회 위원들의 다음 서명이 나타나 있다. 리오 크롤리(Leo Crowley), 윌리엄 L. 클레이턴(William L. Clayton), 존 J. 매클로이(John J. McCloy), 랠프 A. 바드(Ralph A. Bard), 헨리 모겐소 2세(Henry Morgenthau, Jr.).", "[주23] 3월 23일자 각서는 471면 참조. 개정 지령은 바로 다음 문서 참조."], "warn": false, "pages": ["484"], "search": "Grew 그루(국무장관 대리) Truman 트루먼 Roosevelt 루스벨트 Winant 위넌트(주영대사) Eisenhower 아이젠하워 Leo Crowley 리오 크롤리 William L. Clayton 윌리엄 L. 클레이턴 John J. McCloy 존 J. 매클로이 Ralph A. Bard 랠프 A. 바드 Morgenthau 모겐소"}, {"id": "d351", "order": 351, "date": "1945-04-26", "group": "E", "eyebrow": "d351 · Directive to Commander in Chief of United States Forces of Occupation Regarding the Military Government of Germany  The covering sheet of the document bears the following notation by the Secretaries of the Informal Policy Committee on Germany: “The attached directive has been approved by the Informal Policy Committee on Germany”.", "title": "독일 군정에 관하여 미국 점령군 총사령관에게 내리는 지령", "badge": null, "list_right": "문서 351", "meta": [{"k": "일자", "v": "1945-04-26"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "IPCOG 1"}, {"k": "원문출처", "v": "740.00119 Control (Germany)/4–2645", "txt": true}, {"k": "발신", "v": "미국 정부 — 비공식 대독일정책위원회(Informal Policy Committee on Germany, IPCOG) 승인, 합동참모본부(Joint Chiefs of Staff)를 통하여 하달", "txt": true}, {"k": "수신", "v": "독일 주둔 미국 점령군 사령관(Commanding General of the United States forces of occupation in Germany)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "지령"}], "links": [{"k": "FRUS", "text": "문서 351 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d351"}], "summary": "패전 직후 초기 점령기에 독일 주둔 미군 사령관이 통제이사회 미국 대표로서, 또 미국 점령지대의 군정 책임자로서 따라야 할 정치·경제·재정 기본 정책을 조항별로 규정한 지령이다(뒷날 JCS 1067로 불리는 문서).", "points": ["이 지령은 종전의 JCS 1067을 폐지하고 그것을 대신하며, 연합국원정군최고사령부(SHAEF)의 통합지휘가 끝난 뒤부터 적용된다. 또한 초기 패전 후 시기에 한한 정책이지 대독일 최종 정책의 표명이 아니라고 못 박는다.", "군정의 권원은 독일의 무조건항복 또는 완전한 패배에 있으며, 항복문서에 정식 서명이 뒤따르지 않더라도 그 문서의 정책을 점령지대에서 실행하라고 지시한다(제2항 a).", "연합국의 으뜸 목표는 독일이 다시는 세계 평화의 위협이 되지 못하게 하는 것이며, 그 수단으로 나치즘·군국주의의 모든 형태의 제거, 전쟁범죄자의 즉각 체포, 독일의 산업적 무장해제와 비무장화, 전쟁수행능력에 대한 계속적 통제, 민주적 기초 위의 독일 정치생활 재건 준비를 든다(제4항 c).", "독일의 생활수준을 인접 연합국(United Nations) 가운데 어느 한 나라보다도 높게 떠받치는 조치는 일절 취하지 않는다(제5항 a, 제21항).", "비나치화: 나치당과 그 부속조직의 해산, 형식적 참여자를 넘어선 당원·나치즘 및 군국주의의 적극 지지자의 공직 및 준공공·민간 요직에서의 축출, 행정상의 필요·편의·편법을 이유로 한 유임 금지(제6항 c).", "체포 대상 범주를 지위별로 열거하되(게슈타포·SD·무장친위대·참모본부 장교·지구지도자 이상 당간부 등), 재산이나 정치적·산업적 지위에 따른 차별 대우를 금지한다(제8항).", "경제: 독일 경제의 지방분권화, 무기·항공기·상선·합성고무 및 석유·알루미늄·마그네슘의 생산 금지, 철강·화학·공작기계 등의 생산 및 설비 복구 금지와 배상 이전을 위한 설비 보전, 카르텔 금지와 독일 산업 소유·지배의 분산(제18항, 제30항, 제32항, 제36항, 제37항).", "재정: 연합군 군표(Allied Military mark)와 라이히스마르크의 1대 1 등가 법화 인정, 라이히스마르크 대 달러의 일반 환율 공표 금지, 나치 관련 자산과 강박에 의한 이전 재산·문화재의 압류 및 동결(제45항, 제48항 e)."], "primary": "IPCOG 1\n\n1945년 4월 26일.\n\n**1. 이 지령의 목적과 범위:**\n\n이 지령은 JCS 1067을 폐지하며, 독일 주둔 미국 점령군 사령관인 귀관에게 하달된다. 귀관은 그 자격으로 통제이사회의 미국 위원으로 복무할 것이며, 아울러 점령과 행정을 위하여 미국에 배정된 지대 또는 지대들에서 군정의 시행을 책임진다. 이 지령은 연합국원정군최고사령관의 통합지휘가 종료된 뒤 그 두 자격에서 귀관을 이끌 기본 정책들의 개요를 밝힌 것이다.\n\n이 지령은 패전 직후의 초기 시기에 관련된 정책들을 제시한다. 그러한 것으로서 이 지령은 전후 세계에서 독일을 어떻게 다룰 것인가에 관한 본국 정부의 궁극적 정책 표명이 되고자 함이 아니다. 따라서 이 지령이 적용되는 [485면] 기간 동안 귀관은 귀관의 지대 안의 경제·산업·재정·사회·정치 상황에 대한 조사가 끊임없이 이루어지도록 하고, 그 조사의 결과 및 다른 지대들에서 이루어진 그 밖의 조사 결과가 합동참모본부를 거쳐 본국 정부에 제공되도록 보장하여야 한다. 이러한 조사는 여기 제시된 통제 조치들의 변경을 결정하는 근거가 되도록, 또한 미국의 기본 목표를 촉진할 정책의 점진적 수립과 발전의 근거가 되도록 하는 방식으로 수행되어야 한다. 필요에 따라 합동참모본부가 보충 지령을 귀관에게 내릴 것이다.\n\n통제이사회의 위원으로서 귀관은 이 지령에 제시된 원칙과 정책을 다른 점령국들이 채택하도록 촉구할 것이며, 통제이사회의 합의가 있기까지는 귀관의 지대에서 그것들을 따를 것이다. 영국·소련·프랑스 점령군 총사령관들에게도 실질적으로 이와 비슷한 지령이 내려지리라고 예상된다.\n\n## 제1부\n\n### 일반 및 정치\n\n**2. 군정의 근거**\n\n**a.**\n\n독일에서 군정의 권리·권력·지위는 독일의 무조건항복 또는 완전한 패배에 근거한다. 무조건항복문서(Instrument of Unconditional Surrender)의 본문은 부록 「A」에 있다. [주25] 귀관은 독일의 패배에 뒤이어 그 문서의 정식 서명이 이루어지지 않더라도, 그 문서에 제시된 정책들이 귀관의 점령지대에서 시행되도록 보장할 것이다.\n\n**b.**\n\n아래 제3항의 규정을 조건으로 하여, 귀관은 그 지위에 의하여 귀관 휘하 부대가 점령한 지역에서 최고의 입법·행정·사법 권한을 부여받는다. 이 권한은 넓게 해석될 것이며, 군사적 긴급사태 및 확고한 군정의 목표와 관련하여 귀관이 필요하거나 적절하거나 바람직하다고 여기는 모든 조치를 취할 권한을 포함한다.\n\n**c.**\n\n귀관은 귀관의 지대에서 지금까지 연합군 사령관들이 발한 포고·명령·훈령을, 귀관이 정하는 변경을 조건으로 하여, 계속 효력을 갖게 하는 포고를 발할 것이다. 연합국원정군최고사령관이 부여한 행위의 권한은, 이 지령이나 이후의 지령과 어긋나지 않는 한, 귀관에게도 적용되는 것으로 볼 수 있다.\n\n[486면]\n\n**3. 통제이사회와 점령지대:**\n\n**a.**\n\n네 명의 총사령관이 공동으로 행동하여 독일 내 통제이사회를 구성하며, 통제이사회는 부록 「B」의 독일 통제기구에 관한 협정에 따라 독일에 대한 최고의 통제기관이 된다. [주26] 군정의 시행을 위하여 독일은 네 개의 점령지대로 나뉘었다. 지대에 관하여 합의된 의정서는 부록 「C」에 있다. [주27]\n\n**b.**\n\n독일 전체에 영향을 미치는 사항에 관하여 정책·절차 및 행정관계를 수립할 통제이사회의 권한은 독일 전역에서 최상위의 것이 된다. 귀관은 통제이사회에서 합의된 정책들을 귀관의 지대에서 실행하고 뒷받침할 것이다. 그러한 합의된 정책이 없을 경우 귀관은 이 지령 및 합동참모본부의 다른 지령에 따라 행동할 것이다.\n\n**c.**\n\n독일 내 사무의 행정은 정치적·행정적 구조의 지방분권화와 지방 책임의 발달을 지향하여야 한다. 이를 위하여 귀관은 독일 행정의 광역·지방·시읍 기관의 자율성을 장려할 것이다. 독일의 경제 구조 또한 분권화되어야 한다. 다만 통제이사회는 여기 제시된 목적의 달성에 요구되는 최소한도로 (a) 철도·통신·전력과 같은 필수적 국가 공공역무, (b) 재정 및 외교, (c) 필수 물자의 생산과 배급에 대하여 중앙집권적 행정을 허용하거나 중앙통제를 설치할 수 있다.\n\n**d.**\n\n통제이사회는 지대들 사이에 필수 물자를 공평하게 배분하도록 하는 절차를 채택하여야 하며, 귀관은 귀관의 지대에서 이를 촉진할 것이다. 통제이사회의 상충하는 정책이 없는 한, 귀관은 특정 지대들에 특별히 관련되는 사항에 관하여 한 명 이상의 지대 사령관과 직접 교섭할 수 있다.\n\n**e.**\n\n지대 간 여행 및 민간인 이동에 관한 통일된 정책과 절차가 통제이사회에서 수립되기까지는, 어떠한 민간인도 귀관의 허가 없이 귀관의 지대를 떠나거나 들어오도록 허용되지 아니하며, 귀관의 지대 안의 어떠한 독일인도 귀관이 승인한 특정 목적을 제외하고는 독일을 떠나도록 허용되지 아니한다.\n\n**f.**\n\n각 지대의 군정 요원은, 독일 중앙행정기구가 있을 경우 그 부처의 광역 및 지방 지부를 상대하는 요원을 포함하여, 그 지대 사령관의 권한으로 [487면] 선발되어야 한다. 다만 다른 세 지대의 사령관이 연락장교를 보낼 수 있다. 각 총사령관은 독일 전역에 걸쳐 자기 휘하 군대의 구성원과 이들을 수행하는 민간인에 대하여 배타적 관할권을 갖는다.\n\n**g.**\n\n통제이사회는 오스트리아와 독일 사이의 모든 정부적·행정적 연결의 단절과 오스트리아 내 독일 경제력의 제거를 촉진할 책임을 져야 한다. 이러한 목적을 실현하려는 오스트리아 내 연합국 행정당국의 노력에 모든 지원이 주어져야 한다.\n\n**4. 독일 군정의 기본 목표:**\n\n**a.**\n\n독일의 무자비한 전쟁수행과 광신적인 나치의 저항이 독일 경제를 파괴하였고 혼란과 고통을 피할 수 없게 만들었다는 것, 그리고 독일인은 스스로 자초한 일에 대한 책임을 면할 수 없다는 것을 독일인들에게 똑똑히 깨우쳐야 한다.\n\n**b.**\n\n독일은 해방을 위하여 점령되는 것이 아니라 패배한 적국으로서 점령된다. 귀관의 목적은 억압이 아니라 어떤 중요한 연합국의 목표를 실현하기 위하여 독일을 점령하는 데 있다. 점령과 행정을 수행함에 있어 귀관은 공정하되 단호하고 초연하여야 한다. 귀관은 독일 관리 및 주민과의 친교(fraternization)를 강력히 억제할 것이다.\n\n**c.**\n\n연합국의 으뜸 목표는 독일이 다시는 세계 평화에 대한 위협이 되지 못하게 막는 것이다. 이 목표를 이루는 데 긴요한 조치는 모든 형태의 나치즘과 군국주의의 제거, 전쟁범죄자의 즉각적 체포와 처벌, 독일의 산업적 무장해제와 비무장화 및 독일의 전쟁수행능력에 대한 계속적 통제, 그리고 민주적 기초 위에서 독일 정치생활을 궁극적으로 재건하기 위한 준비이다.\n\n**d.**\n\n그 밖의 연합국 목표는 배상 및 원상회복(restitution) 계획을 관철하는 것, 나치 침략으로 황폐해진 나라들을 위한 구호를 제공하는 것, 그리고 국제연합(United Nations) 여러 나라의 전쟁포로와 실향민이 보호되고 송환되도록 보장하는 것이다.\n\n**5. 경제 통제:**\n\n**a.**\n\n통제이사회의 위원으로서, 또 지대 사령관으로서 귀관은 다음 원칙에 따를 것이다. 즉 독일 경제에 대한 통제는 위 제4항에 열거된 목표를 이루는 데 필요한 한도에서, 또한 점령군의 안전을 지키고 그 필요를 충족시키며 기아나 점령군을 위태롭게 할 만한 질병과 소요를 막는 데 요구되는 재화와 역무의 생산·유지를 보장하는 데 긴요한 한도에서 부과될 수 있다. 배상 계획의 실행으로든 그 밖의 방법으로든, 독일 또는 귀관의 지대의 기본 생활 조건을 인접한 국제연합 국가들 가운데 어느 한 나라에 존재하는 수준보다 높게 [488면] 떠받치는 결과를 낳을 어떠한 조치도 취해지지 아니한다.\n\n**b.**\n\n귀관 또는 통제이사회가 정하는 통제를 부과하고 유지함에 있어, 독일 당국으로 하여금 실행 가능한 최대한도로 그러한 통제를 공포하고 그 시행을 떠맡도록 명하여야 한다. 그리하여 그러한 통제의 시행에 대한 책임과 그 통제가 무너질 경우의 책임이 독일 국민 자신과 독일 당국에 있다는 것을 독일 국민에게 똑똑히 깨우쳐야 한다.\n\n**6. 비나치화:**\n\n**a.**\n\n나치당과 그 예하 조직(formations), 부속 단체 및 감독 하의 조직들, 그리고 당의 지배 수단으로 세워진 모든 나치 공공기관을 해산하고 어떠한 형태로도 그 부활을 금지하는 포고를 통제이사회가 공포하여야 한다. 귀관은 그 정책이 귀관의 지대에서 신속히 실행되도록 보장할 것이며, 그러한 조직이 지하·위장 또는 비밀의 형태로 다시 결성되는 것을 막기 위하여 온갖 노력을 다할 것이다. 해산된 당 조직이 맡던 비정치적 사회역무 가운데 유지함이 바람직한 것에 대한 책임은 통제이사회가 적절한 중앙기관에, 귀관이 적절한 지방기관에 이전할 수 있다.\n\n**b.**\n\n국가사회주의의 정치 구조와 히틀러 체제의 기초를 세우려 한 법률들, 그리고 인종·국적·신조 또는 정치적 의견을 이유로 차별을 설정하는 모든 법률·명령·규칙은 통제이사회가 폐기하여야 한다. 귀관은 귀관의 지대에서 그것들을 효력 없게 만들 것이다.\n\n**c.**\n\n나치당의 활동에 형식적 참여자 이상이었던 모든 당원, 나치즘 또는 군국주의의 모든 적극적 지지자, 그리고 연합국의 목적에 적대적인 그 밖의 모든 자는 공직에서, 그리고 다음과 같은 준공공 및 민간 기업의 요직에서 축출되고 배제될 것이다. (1) 시민·경제·노동 단체, (2) 독일 정부나 그 하부기관이 주된 재정적 이해를 갖는 회사 및 그 밖의 조직, (3) 공업·상업·농업·금융, (4) 교육, (5) 신문·출판사 및 그 밖의 보도·선전 전파 기관. 다음에 해당하는 자는 당 활동의 형식적 참여자 이상이며 나치즘 또는 군국주의의 적극적 지지자로 취급된다. 즉 (1) 당 및 그 예하 조직에서, 또는 군국주의 교의를 조장하는 조직에서 지방에서 전국에 이르는 어느 수준에서든 직책을 맡았거나 그 밖에 활동한 자, (2) 나치의 범죄, 인종 박해 또는 차별을 승인하였거나 이에 적극적으로 가담한 자, (3) 나치즘 [489면] 또는 인종적·군국주의적 신조를 공공연히 신봉한 자, (4) 나치당 또는 나치 관리와 지도자들에게 상당한 정신적·물질적 지원이나 어떠한 종류의 정치적 조력을 자발적으로 제공한 자이다. 그러한 자는 행정상의 필요·편의 또는 편법을 이유로 위에 열거된 어느 고용 범주에도 유임되지 아니한다.\n\n**d.**\n\n나치당과 그 예하 조직, 부속 단체 및 감독 하의 조직들이 소유하거나 지배하는 부동산 및 동산, 그리고 제8항의 규정에 따라 체포 대상이 되는 모든 자가 소유하거나 지배하는 부동산 및 동산으로서 귀관의 지대 안에서 발견되는 것은, 그 최종 처분에 관한 통제이사회 또는 상급 당국의 결정이 있을 때까지 귀관의 통제 아래 놓일 것이다.\n\n**e.**\n\n나치가 창설한, 또는 독일 군국주의를 영속시키는 데 바쳐진 모든 문서고·기념물·박물관은 귀관의 통제 아래 놓일 것이며, 그 재산은 통제이사회가 처분을 결정할 때까지 보관된다.\n\n**f.**\n\n귀관은 다음에 속하거나 다음이 지배하는 기록·설계도·서적·문서·서류·문서철 및 과학·산업 기타 정보와 자료를 파괴로부터 지켜 내고 귀관의 통제 아래 두기 위하여 특별한 노력을 기울일 것이다.\n\n**(1)**\n\n독일 중앙정부와 그 하부기관, 독일 군사조직, 군사 연구에 종사하는 조직, 그리고 그 밖에 적절하다고 여겨지는 정부기관;\n\n**(2)**\n\n나치당과 그 예하 조직, 부속 단체 및 감독 하의 조직들;\n\n**(3)**\n\n보안경찰과 정치경찰을 포함한 모든 경찰 조직;\n\n**(4)**\n\n나치당이나 그 요원이 지배하는 것을 포함한 주요 경제 조직과 산업 시설;\n\n**(5)**\n\n인종적·정치적·군국주의적 또는 그와 유사한 연구나 선전에 전념하는 연구소와 특별 부서.\n\n**7. 비무장화:**\n\n**a.**\n\n귀관은 귀관의 지대에서 준군사조직을 포함한 독일 군대의 모든 부대가 그 자체로 해산되고, 그 인원이 무조건항복문서 또는 귀관에게 하달될 다른 지령에 제시된 정책과 절차에 따라 신속히 무장해제되고 통제되도록 보장할 것이다. 최종 처분에 앞서, 귀관은 제8항의 규정에 포함되는 모든 군인을 체포하여 구금할 것이다.\n\n**b.**\n\n통제이사회는 참모본부(General Staff), 독일 장교단, 예비군단 및 육군사관학교를 포함한 모든 군사 및 준군사 조직과, 독일에서 군사적 전통을 살아 있게 하는 데 이바지할 수 있는 모든 단체의 완전한 해산을 선포하여야 하며, 귀관은 귀관의 지대에서 이를 실행할 것이다.\n\n**[490면] c.**\n\n귀관은 모든 무기·탄약 및 전쟁 도구를 압수하거나 파괴하고 그 생산을 중지시킬 것이다.\n\n**d.**\n\n귀관은 이 지령의 다른 곳에 제시된 대로 독일의 전쟁수행능력을 파괴하기 위한 적절한 조치를 취할 것이다.\n\n**8. 전쟁범죄 혐의자와 보안 목적의 체포:**\n\n**a.**\n\n귀관은 아돌프 히틀러(Adolf Hitler), 그의 주요 나치 동료들, 그 밖의 전쟁범죄자들, 그리고 잔학행위나 전쟁범죄를 수반하거나 그러한 결과를 낳은 나치의 기도를 계획하거나 수행하는 데 가담한 모든 자를 찾아내어 체포하고, 그 처분에 관한 추가 지시를 받을 때까지 구금할 것이다.\n\n**b.**\n\n자유롭게 두면 귀관의 목표 달성을 위태롭게 할 모든 자 또한 체포되어 귀관이 설치할 적절한 준사법기관에 의한 재판이 있을 때까지 구금될 것이다. 이 정책을 수행하기 위하여 체포할 자의 범주를 일부 열거하면 다음과 같다.\n\n**(1)**\n\n나치당과 그 예하 조직, 부속 단체 및 감독 하의 조직들의 간부로서 지구지도자(Ortsgruppenleiter)와 그에 상당하는 계급의 간부에 이르기까지의 자;\n\n**(2)**\n\n게슈타포(Gestapo)와 친위대 보안부(Sicherheitsdienst der S.S.)를 포함한 정치경찰의 모든 구성원;\n\n**(3)**\n\n무장친위대(Waffen S.S.)의 장교와 부사관, 그리고 친위대의 다른 부문의 모든 구성원;\n\n**(4)**\n\n참모본부단(General Staff Corps) 장교 전원;\n\n**(5)**\n\n중위 이상의 계급, 또는 그에 상당하는 권한 있는 지위를 가진 경찰 간부;\n\n**(6)**\n\n장교 계급을 가진 돌격대(SA) 장교;\n\n**(7)**\n\n모든 부처의 주요 관리와 그 밖의 고위 정치 관리로서 도시 및 농촌 시읍면장(buergermeister)과 그에 상당하는 계급의 관리에 이르기까지의 자, 그리고 독일이 점령한 나라들의 행정에서 민간이든 군이든 그와 비슷한 지위를 가졌던 자;\n\n**(8)**\n\n다음 분야에서 중요하고 요긴한 지위를 가진 나치와 나치 동조자. (a) 전국 및 관구(Gau) 단위의 시민·경제 조직, (b) 정부가 주된 재정적 이해를 갖는 회사 및 그 밖의 조직, (c) 공업·상업·농업·금융, (d) 교육, (e) 사법, (f) 신문·출판사 및 그 밖의 보도·선전 전파 기관. 반대되는 증거가 없는 한 그러한 지위를 가진 자는 누구든 나치 또는 나치 동조자라고 일반적으로 추정하여도 좋다;\n\n**(9)**\n\n인민법원(Volksgerichtshof), 특별법원(Sondergerichte) 및 나치 체제가 만든 그 밖의 특별재판소의 모든 판사·검사·직원;\n\n**(10)**\n\n독일의 전쟁수행을 지원하여 자국 법률을 위반한 범죄를 저질렀다고 여겨지는 국제연합 국가 또는 그 준회원국의 모든 국민;\n\n**(11)**\n\n합동참모본부가 귀관에게 제출할 명부에 이름이나 직명이 오른 자, 또는 그와 같이 별도로 귀관에게 통보되는 이름의 자.\n\n[491면]\n\n귀관이 독일에서 부딪히는 상황에 비추어 이러한 범주에 드는 어떤 자들에게 이 조치를 즉시 적용하는 것이 실행 가능하지 않다고 판단할 경우, 귀관은 그 이유와 권고를 합동참모본부를 거쳐 본국 정부에 보고하여야 한다. 바람직하다고 판단하면 귀관은 보고한 사건에 관하여 합동참모본부의 결정이 통보될 때까지 그 체포를 미룰 수 있다. 어떠한 경우에도 체포된 자들 사이에 재산 또는 정치적·산업적 기타 지위나 직위를 근거로 하여 체포의 방법이나 구금의 조건에서 차별을 두거나 특별한 배려를 하여서는 아니 된다. 귀관은 재량으로 정보수집 기타 군사상의 이유에서 바람직하다고 여기는 예외를 둘 수 있다.\n\n**9. 정치 활동:**\n\n**a.**\n\n귀관이 허가하지 않는 한 어떠한 종류의 정치 활동도 용인되지 아니한다. 귀관은 귀관의 군정이 어떠한 정치 집단에도 얽매이지 않도록 보장할 것이다.\n\n**b.**\n\n귀관은 나치·군국주의 또는 범게르만주의 교의를 어떠한 형태로든 유포하는 것을 금지할 것이다.\n\n**c.**\n\n군사적이든 정치적이든, 민간의 것이든 체육의 것이든, 독일인의 어떠한 행진도 귀관은 허용하지 아니한다.\n\n**d.**\n\n군사적 이해가 침해되지 않는 한도에서, 그리고 앞의 세 세항과 제10항의 규정을 조건으로 하여, 언론·출판 및 종교 예배의 자유는 허용될 것이다. 군사적 필요와 어긋나지 않는 한 모든 종교 기관은 존중될 것이다.\n\n**10. 공보와 공공정보의 통제:**\n\n통제이사회의 위원으로서 귀관은 (a) 독일 내 공공정보 매체의 통제, (5) [sic] 외국 특파원의 인가, (c) 언론 검열, (d) 통제이사회 사항을 다루는 공식 보도문의 발표에 관하여 통일된 또는 조율된 정책에 대한 합의를 얻도록 노력할 것이다. 이 사항들에 관한 미국의 정책은 귀관에게 따로 보내질 것이며, 귀관은 통제이사회에서의 교섭에서 그것을 따를 것이다.\n\n**11. 독일 법원(German Cowts [sic]):**\n\n**a.**\n\n인민법원(Volksgerichtshof)과 특별법원(Sondergerichte)을 포함한 모든 특별재판소, 그리고 나치당과 그 예하 조직, 부속 단체 및 감독 하의 조직들의 모든 법원과 심판소는 즉시 폐지될 것이다.\n\n**b.**\n\n군정의 명령으로 이미 재설치된 것을 제외한 모든 통상의 형사·민사·행정 법원은 폐쇄될 것이다. 모든 나치적 요소와 인적 요소를 제거한 뒤 [492면] 귀관은 귀관의 지대 경계 안에서 관할권을 행사할 법원에 대하여 귀관이 적절하다고 여기는 규정·감독·통제 아래 업무를 재개하도록 허용할 것이다. 귀관의 지대 경계를 넘는 영역에 대하여 관할권을 행사할 법원은 통제이사회의 명시적 허가가 있어야만, 그리고 그 규정·감독·통제 아래에서만 다시 열릴 것이다. 독일 법원의 판결을 재심하고 거부할 권한은 감독과 통제의 권한에 포함된다.\n\n**12. 경찰:**\n\n형사경찰(Reichskriminal polizei)을 제외한 보안경찰(Sicherheitspolizei)의 모든 요소, 예컨대 비밀국가경찰(게슈타포, Geheime Staatspolizei) 및 친위대 보안부(Sicherheitsdienst der S.S.)는 폐지될 것이다. 형사경찰과 일반경찰은 나치 인원을 숙청한 뒤 군정의 통제와 감독 아래 활용될 것이다.\n\n**13. 정치범:**\n\n군사적 보안과 관계 당사자들의 이익을 조건으로 하여, 귀관은 인종·국적·신조 또는 정치적 의견을 이유로 억류되거나 구금된 자로서 귀관의 지대 안에서 발견되는 모든 사람을 석방하고 이들을 실향민으로 대우할 것이다. 귀관은 인종적·종교적 또는 정치적 박해라는 상당한 의심이 있을 수 있는 범죄 혐의의 유죄 판결로서, 귀관의 지대 안에 수감된 자들이 아직 형기를 다 채우지 않은 것들에 대하여 재심의 절차를 마련하여야 한다.\n\n**14. 교육:**\n\n**a.**\n\n연합국 당국이 이미 재설치한 것을 제외한 귀관의 지대 안의 모든 교육기관은 폐쇄될 것이다. 아돌프 히틀러 학교(Adolf Hitler Schulen), 나폴라(Napolas), 오르덴스부르크(Ordensburgen)와 같은 나치 교육기관의 폐쇄, 그리고 다른 교육기관 안의 나치 조직의 폐쇄는 영구적인 것이 될 것이다.\n\n**b.**\n\n나치와 군국주의 교의를 완전히 제거하고 민주적 이념의 발달을 장려하기 위하여, 독일 교육에 대한 조율된 통제 체계와 재정향(reorientation)의 적극적 계획이 수립될 것이다.\n\n**c.**\n\n귀관은 나치 인원을 제거한 뒤 될 수 있는 대로 이른 시기에 초등학교(Volksschulen)·중등학교(Mittelschulen)·직업학교(Berufsschulen)의 재개교를 허용할 것이다. 나치 및 군국주의 교의로부터 자유롭지 않은 교과서와 교육과정은 사용되지 아니한다. 통제이사회는 중등 상급학교·대학 및 그 밖의 고등교육기관의 재개교를 내다보는 계획을 마련하여야 한다. 나치적 요소와 인원이 제거된 뒤, 그리고 통제이사회가 그러한 계획을 수립하기까지 귀관은 귀관의 지대 안에서 잠정 계획을 세워 시행할 수 [493면] 있으며, 어떠한 경우에도 군정의 시행과 점령의 목적에 당장 긴요하거나 유용하다고 귀관이 여기는 훈련을 제공하는 기관과 학과의 재개를 허용할 수 있다.\n\n**d.**\n\n군정이 독일 학교의 교파적 관리 문제나 독일 학교에서의 종교 교육에 개입하는 것은 의도된 바가 아니다. 다만 종교 교육과 그러한 학교의 운영이 인원과 교육과정의 숙청에 관하여 이미 마련되었거나 앞으로 마련될 연합국의 규정에 부합하도록 보장하는 데 필요한 한도에서는 그러하지 아니하다.\n\n**15. 예술과 문서고:**\n\n위 제6항의 규정을 조건으로 하여, 귀관은 역사적 문서고·박물관·도서관 및 예술품을 보존하기 위하여 모든 합리적인 노력을 기울일 것이다.\n\n## 제2부\n\n### 경제\n\n#### 일반 목표와 통제 방법\n\n**16.** 귀관은 이 지령 제4항 및 제5항에 제시된 기본 목표를 달성하는 방식으로 독일 경제가 운영되고 통제되도록 보장할 것이다. 경제 통제는 이 목표를 이루는 데 필요한 한도에서만 부과될 것이다. 다만 귀관은 독일의 산업적 무장해제를 이루는 데 필요한 한도까지는 남김없이 통제를 부과할 것이다. 이러한 목표를 수행하는 데 필요한 경우를 제외하고, 귀관은 (a) 독일의 경제 재건을 내다보는 어떠한 조치도, (b) 독일 경제를 유지하거나 강화하려는 어떠한 조치도 취하지 아니한다.\n\n**17.** 이 지령 제4항 및 제5항에 제시된 목표를 이행하는 데 요구되는 조치의 성공적 실행을 위태롭게 하지 않는 한도에서 최대한, 귀관은 독일 당국과 기관을 활용할 것이며, 이들이 그 임무를 수행하도록 보장하는 데 필요한 만큼 이들을 감독하고 불이행에 대하여 처벌할 것이다.\n\n이 목적을 위하여 귀관은 긴요하다고 여기는 독일 기관과 행정 부서에 적절한 권한을 부여할 것이다. 다만 귀관은 비나치화 및 나치 조직·기관·원리·특징·관행의 해체 또는 제거에 관한 이 지령의 규정을 언제나 엄격히 지켜야 한다.\n\n필요한 한도에서 귀관은 제19항, 제20항, 제30항, 제31항, 제32항, 제39항, 제40항의 규정과 산업적 무장해제 목표의 달성에 필요한 그 밖의 조치를 실행하거나 그 실행을 보장하기 위하여, 독일 당국과 기관에 의존하지 않는 행정기구를 설치할 것이다.\n\n[494면]\n\n**18.** 독일 경제의 구조와 행정을 가능한 최대한도로 분권화하기 위하여 귀관은\n\n**a.**\n\n필수적인 공익사업과 공업·농업 활동을 유지하거나 복구하는 데 요구되는 조치가 될 수 있는 대로 지방과 광역 단위로 취해지도록 보장하고;\n\n**b.**\n\n독일 경제에 대한 통제의 중앙집권적 시행이 이 지령 제4항 및 제5항에 열거된 목표의 달성에 명백히 긴요한 경우를 제외하고는, 통제이사회에서 그러한 중앙집권적 시행의 설치를 결코 제안하거나 승인하지 아니한다. 행정의 분권화가 통제이사회에서 경제 정책에 관하여 실행 가능한 최대한의 합의에 이르는 것을 방해하도록 허용되어서는 아니 된다.\n\n**19.** 귀관은 이 지령 제4항 및 제5항에 열거된 목표를 수행하는 데 필요한 통계 기록과 보고를 마련하거나 그 유지를 보장할 것이다.\n\n**20.** 귀관은 점령의 목표를 이루는 데 도움이 될 적절한 조사를 시작할 것이다. 특히 귀관은 귀관의 지대 안의 보급품·장비·자원에 대한 조사를 신속히 착수할 것이다. 귀관은 다른 점령지대에서도 비슷한 조사를 실시하는 데 대하여 통제이사회의 신속한 합의를 얻도록 노력할 것이며, 이 조사와 앞으로 여러 지대에서 실시될 다른 조사들의 방법과 결과를 조율하기 위한 적절한 조치를 촉구할 것이다. 귀관은 통제이사회, 미국 [배상위원회(Separation [sic] Commission) 대표 및 그 밖의 적절한 당국에 중간 보고 등을 통하여 얻은 정보를 수시로 알릴 것이다.\n\n#### 독일의 생활수준\n\n**21.** 귀관은 기아나 광범위한 질병, 또는 점령군을 위태롭게 할 만한 민간의 소요를 막는 데 필요한 물자 소요를 산정할 것이다. 그러한 산정은 독일인이 자신의 노동과 자원으로 스스로를 부양할 책임을 지는 것을 내용으로 하는 계획에 근거할 것이다. 귀관은 수입을 엄격히 제한할 수 있도록, 또 잉여가 점령군과 실향민 및 국제연합 국가의 전쟁포로에게, 그리고 배상에 쓰일 수 있도록, 독일의 자원이 남김없이 활용되고 소비가 최소한으로 억제되도록 보장하기 위하여 실행 가능한 모든 경제적·경찰적 조치를 취할 것이다. 귀관은 독일의 기본 생활수준을 인접한 국제연합 국가들 가운데 어느 한 나라에 존재하는 수준보다 높게 떠받치는 결과를 낳을 어떠한 조치도 취하지 아니할 것이며, 그러한 조치가 그 어느 나라의 수준을 높이는 데 이바지할 경우에는 독일 국민의 기본 생활수준이 인접한 국제연합 국가들 가운데 어느 한 나라에 존재하는 수준보다 높지 않도록 보장하는 적절한 조치를 취할 것이다.\n\n**22.** 귀관은 통일된 배급 기준이 독일 전역에 적용될 것, 필수 품목이 [495면] 지대들 사이에 공평하게 배분될 것, 순잉여는 연합국들에 수출될 수 있도록 할 것, 수입은 독일 전체의 순부족분에 국한할 것을 통제이사회에 촉구할 것이다.\n\n#### 노동, 보건 및 사회보험\n\n**23.** 귀관은 피고용인이 민주적 노선에 따라 스스로 조직하는 것을 허용할 것이다. 다만 어떠한 가면 아래에서든 나치 또는 군국주의의 영향이 존속되는 것이나 점령군의 목표와 활동에 적대적인 집단이 존속되는 것을 막는 데 필요한 안전장치를 조건으로 한다.\n\n**24.** 귀관은 임금·노동시간·노동조건에 관한 피고용인과 고용주 사이의 자유로운 단체교섭과 노사분쟁의 해결을 위한 기구의 설치를 허용할 것이다. 단체교섭은 귀관의 지시로 마련되거나 되살아난 임금·노동시간 기타 통제가 있다면 그것을 조건으로 한다.\n\n**25.** 이 지령 제48항의 규정을 조건으로 하여, 귀관은 차별 없는 사회보험 및 빈민구제 제도를 유지하거나 재수립하도록 독일 당국에 지시할 권한을 갖는다.\n\n**26.** 귀관은 독일 당국이 이용할 수 있는 보건 역무와 시설을 유지하거나 재수립하도록 지시할 권한을 갖는다.\n\n#### 농업, 공업 및 국내 상업\n\n**27.** 귀관은 독일인이 그 처분 아래 있는 모든 수단을 써서 농업 생산을 최대화하고 농업 생산물의 수집과 배급을 위한 효과적인 기구를 될 수 있는 대로 빨리 세우도록 요구할 것이다.\n\n**28.** 귀관은 독일 당국에 대하여 대토지 소유지와 공유지를 독일인 및 그 밖의 사람들의 수용과 정착을 쉽게 하거나 농업 생산을 늘리는 방식으로 활용하도록 지시할 것이다.\n\n**29.** 귀관은 독일의 전쟁수행이나 독일 경제에 긴요하였던 대규모 독일 산업회사와 동업조합 및 연구단체의 모든 공장·장비·특허 및 그 밖의 재산과 모든 장부·기록을 독일인에 의한 파괴로부터 지키고, 이 지령과 다른 지령 또는 통제이사회가 정하는 처분이 있을 때까지 유지할 것이다. 귀관은 그러한 기업의 연구 및 실험 시설에 각별한 주의를 기울일 것이다.\n\n**30.** 독일을 무장해제하기 위하여 통제이사회(the Countrol [sic] Council)는\n\n**a.**\n\n모든 무기·탄약·전쟁 도구, 그리고 모든 종류의 항공기와 그것에 장착하기 위하여 특별히 설계되거나 생산된 모든 부품·구성품·원료의 생산과 수입 기타 방법에 의한 취득 및 개발을 막아야 하며;\n\n**b.**\n\n상선·합성고무 및 합성석유·알루미늄·마그네슘, 그리고 앞으로 귀관이 지시를 받게 될 그 밖의 제품과 장비의 생산을 막아야 하며;\n\n**[496면] c.**\n\n이 항에 언급된 품목의 생산에 사용되는 모든 시설을 압수하고 보전하여 다음과 같이 처분하여야 한다.\n\n**(1)**\n\n배상에 필요한 것은 모두 철거하여 옮긴다;\n\n**(2)**\n\n배상용으로 이전되지 않은 것으로서 이 항에 명시된 품목의 생산에 특별히 적합하게 되어 있고 독일인에게 허용되는 산업에서 일반적으로 쓰이는 형태가 아닌 것은 모두 파괴한다(의심스러운 경우에는 파괴하는 쪽으로 해결한다);\n\n**(3)**\n\n나머지는 귀관에게 보내질 지시에 따라 처분하도록 보유한다.\n\n통제이사회에서 합의가 이루어지기까지 귀관은 귀관 자신의 지대에서 이러한 조치를 취할 것이다. 귀관은 합동참모본부를 거친 본국 정부의 명시적 승인 없이는 세항 a와 b에 담긴 금지와 세항 c의 지시의 집행을 미루지 아니할 것이다.\n\n**31.** 무장해제의 추가 조치로서 통제이사회는\n\n**a.**\n\n처음에는 모든 연구 활동을 금지하고, 공중보건의 보호에 필요하다고 여겨지는 것을 제외한 모든 실험실·연구기관 및 그와 비슷한 기술 조직을 폐쇄하여야 하며;\n\n**b.**\n\n독일 전쟁기구의 구축과 관련된 일을 해 온 모든 실험실과 관련 기관을 폐지하되, 귀관의 기술 조사(youx [sic] technological investigations)에 관심이 가는 실험실은 처음에는 보전하고 그러한 인원은 억류하며, 그 뒤 그 장비를 철거하거나 파괴하여야 하며;\n\n**c.**\n\n과학 연구의 재개는 개별 사안에 대하여, 계획된 연구가 독일의 장래 전쟁수행능력에 어떤 식으로도 이바지하지 않으리라는 점이 면밀한 조사로 확인된 뒤에만, 그리고 (1) 허용되는 연구의 구체적 종류를 규정하고, (2) 이전에 독일 전쟁 연구에서 요직에 있던 자는 누구든 이후의 연구 활동에서 배제하며, (3) 잦은 검열을 마련하고, (4) 연구 결과의 자유로운 공개를 요구하며, (5) 규정을 위반할 때마다 해당 기관의 영구 폐쇄를 포함한 엄중한 처벌을 부과하는 적절한 규정 아래에서만 허용하여야 한다.\n\n통제이사회에서 합의가 이루어지기까지 귀관은 귀관 자신의 지대에서 그러한 조치를 채택할 것이다.\n\n**32.** 배상에 관하여, 그리고 전쟁 생산에 이용될 수 있는 독일 산업의 통제 또는 제거에 관하여 연합국의 최종 합의가 이루어지기까지 통제이사회는\n\n**a.**\n\n이 지령 제4항 및 제5항에 명시된 목적을 위한 경우를 제외하고, 철과 강철, 화학제품, 비철금속(알루미늄과 마그네슘은 제외), 공작기계, 무선 및 전기 장비, 자동차, 중기계 및 그 주요 부품의 생산을 금지하고 막아야 하며;\n\n**b.**\n\n이 지령 제4항 및 제5항에 명시된 목적을 위한 경우를 제외하고, 그러한 산업의 공장과 장비의 복구를 금지하고 막아야 하며;\n\n**[497면] c.**\n\n그러한 산업의 공장과 장비를 배상 계정으로 이전하기 위하여 보전하여야 한다.\n\n통제이사회에서 합의가 이루어지기까지 귀관은 귀관 자신의 지대에서 그러한 조치를 시행할 것이다.\n\n**33.** 통제이사회는 제30항 및 제32항에 언급된 것 이외의 시설을 경공업 소비재 생산으로 전환하는 것을 허용하는 정책을 채택하여야 한다. 다만 그러한 전환이 배상 계정에 따른 이후의 공장·장비 철거를 방해하지 않고, 이 지령 제4항 및 제5항에 명시된 목적에 필요한 범위를 넘는 수입을 요구하지 않아야 한다. 통제이사회에서 합의가 이루어지기까지 귀관은 귀관의 지대에서 그러한 전환을 허용할 수 있다.\n\n**34.** 제30항 및 제32항의 규정을 조건으로 하여, 통제이사회는 이 지령 제4항 및 제5항에 밝힌 목적을 위하여 필요한 최소한도로 다음을 쉽게 하기 위한 실행 가능한 모든 조치가 취해지도록 보장하여야 한다.\n\n**a.**\n\n필수적인 운수 역무와 공익사업의 수리와 복구;\n\n**b.**\n\n민간 주민에게 요구되는 최소한의 거처의 응급 수리와 건설;\n\n**c.**\n\n배상을 위하여, 귀관의 부대를 위하여, 그리고 이 지령 제21항의 규정을 조건으로 하여 독일 국민을 위하여 필요한 석탄 및 그 밖의 재화와 역무의 생산.\n\n귀관은 통제이사회에서 합의가 이루어지기까지 귀관 자신의 지대에서 그러한 조치가 취해지도록 보장할 것이다.\n\n**35.** 지대 사령관의 자격에서, 또 통제이사회 위원의 자격에서 귀관은 이 지령 제4항 및 제5항에 제시된 목적에 긴요한 재화와 역무의 공평한 지대 간 배분과 이동을 마련하기 위한 조치를 취할 것이다.\n\n**36.** 귀관은 모든 카르텔 또는 그 밖의 사적 사업 협정, 그리고 생산·가격·기술 정보와 공정의 배타적 교환·판매 구역 할당을 포함한 시장 조건의 규제를 내용으로 하는 경제단체(Wirtschaftsgruppen)와 같은 공적 또는 준공적 성격의 것을 포함한 카르텔 유사 조직을 금지할 것이다. 이러한 조직들이 수행해 온 필요한 공적 기능은 될 수 있는 대로 빨리 승인된 공공기관이 흡수하여야 한다.\n\n**37.** 독일 산업의 소유와 지배를 분산시키는 것이 본국 정부의 정책이다. 이 정책을 수행하는 데 도움이 되도록 귀관은 기업 결합체와 풀, 합병, 지주회사 및 겸임 이사제에 대한 조사를 실시하고 그 결과를 권고와 함께 합동참모본부를 거쳐 본국 정부에 알릴 것이다. 귀관은 다른 점령지대 [498면] 에서도 이 조사를 실시하는 데 대하여 통제이사회의 합의를 얻도록 노력할 것이며, 여러 지대에서 이루어지는 이 조사의 방법과 결과를 조율하도록 촉구할 것이다.\n\n**38.** 제4항 a를 충분히 고려하면서, 통제이사회는 점령의 목표 달성을 명백히 위태롭게 할 성질이나 규모의 인플레이션을 막거나 억제하는 데 명백히 필요한 정책을 채택하여야 한다. 특히 통제이사회는 독일 당국에 대하여 물가와 임금에 대한 통제를 유지하거나 수립하고 이를 위하여 필요한 재정·금융 조치를 취하도록 지시하고 그 권한을 부여하여야 한다. 통제이사회에서 합의가 이루어지기까지 귀관은 귀관 자신의 지대에서 필요하다고 여기는 조치가 취해지도록 보장할 것이다. 인플레이션의 방지나 억제가 물자 수입의 추가 근거가 되어서는 아니 되며, 배상·비무장화·산업적 무장해제 계획의 이행에 따른 생산시설의 철거·파괴 또는 축소를 제한하는 추가 근거가 되어서도 아니 된다.\n\n#### 전력, 운수 및 통신\n\n**39.** 통제이사회 위원으로서, 또 지대 사령관으로서 귀관은 다음을 보장하기 위한 적절한 조치를 취할 것이다.\n\n**a.**\n\n전력·운수·통신 시설이 이 지령 제4항 및 제5항에 밝힌 목표를 수행하는 방식으로 운용될 것;\n\n**b.**\n\n독일인이 모든 종류의 항공기를 생산·정비·운용하는 것이 금지되고 저지될 것.\n\n귀관은 전력·운수·통신에 대한 중앙집권적 통제와 행정이 제4항 및 제5항에 밝힌 목표를 위하여 명백히 필요한 정도를 판단하고, 통제이사회가 그 정도의 중앙집권적 통제와 행정을 수립하도록 촉구할 것이다.\n\n#### 대외무역과 배상\n\n**40.** 통제이사회는 외국과의 모든 재화 및 역무 거래에 대하여 중앙집권적 통제를 수립하여야 한다. 통제이사회에서 합의가 이루어지기까지 귀관은 귀관 자신의 지대에서 적절한 통제를 부과할 것이다.\n\n**41.** 통제이사회 위원으로서, 또 지대 사령관으로서 귀관은 다음을 보장하기 위한 적절한 조치를 취할 것이다.\n\n**a.**\n\n대외무역 통제가 이 지령 제4항 및 제5항에 밝힌 목표를 수행하도록 설계될 것;\n\n**b.**\n\n독일에 허용되고 공급되는 수입품이 제4항 및 제5항에 밝힌 목표에 불가피하게 필요한 것에 국한될 것;\n\n**c.**\n\n국제연합 국가 이외의 나라로의 수출은 연합국 정부들이 특별히 허가하지 않는 한 금지될 것.\n\n[499면]\n\n**42.** 통제이사회 위원으로서, 또 지대 사령관으로서 귀관은 독일 기업이 국제 카르텔이나 그 밖의 제한적 계약 및 협정에 참여하는 것을 금지하고, 그러한 카르텔·계약·협정에 대한 기존의 모든 독일 측 참여를 신속히 종료하도록 명하는 정책을 채택할 것이다.\n\n**43.** 귀관은 연합국의 협정에 담긴 배상 및 원상회복 계획을 귀관의 지대에서 수행할 것이며, 그러한 계획의 실행을 보장하기 위하여 독일 전역에 적용할 필요가 있을 정책과 조치에 관하여 통제이사회에서 합의를 구할 것이다.\n\n## 제3부\n\n### 재정\n\n**44.** 귀관은 이 지령의 다른 곳에 밝힌 원칙들을 재정 분야에 온전히 적용할 것이며, 이 지령 제4항 및 제5항에 밝힌 목적을 수행하는 데 필요한 통일된 재정 정책을 통제이사회가 채택하도록 노력할 것이다. 귀관은 이 지령에 명시된 목적을 위하여 필요한 한도를 제외하고는 독일의 재정 구조를 유지·강화 또는 운영하기 위한 어떠한 조치도 취하지 아니한다.\n\n**45.** 통제이사회는 제4항 및 제5항에 제시된 목적에 요구되는 한도에서 독일 내 통화의 발행과 발행량 및 신용 공여를 다음 원칙에 따라 규제하고 통제하여야 한다.\n\n**a.**\n\n미군과 그 밖의 연합군은 연합군 군표(Allied Military mark)와 그들이 보유한 라이히스마르크 지폐 또는 주화를 사용할 것이다. 현재 독일에서 유통되는 연합군 군표와 라이히스마르크 지폐 및 주화는 구별 없이 법화가 되며, 연합군 군표 1에 라이히스마르크 1의 비율로 서로 교환된다. 라이히스크레디트카센샤인(Reichskreditkassenscheine)과 그 밖의 독일 군표는 독일에서 법화가 되지 아니한다.\n\n**b.**\n\n라이히스방크, 렌텐방크 또는 그 밖의 은행이나 기관은 법화가 되는 은행권과 통화를 발행하도록 허가되거나 요구될 수 있다. 그러한 허가 없이는 어떠한 독일 정부계 또는 민간 은행이나 기관도 은행권이나 통화를 발행하도록 허용되지 아니한다.\n\n**c.**\n\n독일 당국은 점령군의 모든 경비를 충당하기에 충분한 액수의 라이히스마르크 통화나 신용을 무상으로 제공하도록 요구될 수 있다. 그 경비에는 연합군 군정의 비용이 포함되며, 배상 또는 원상회복의 목적으로 연합국 당국이 징발·압수 또는 그 밖의 방법으로 취득하는 사유재산에 대하여 보상이 이루어지는 한도에서 그 비용도 포함된다.\n\n통제이사회에서 합의가 이루어지기까지 귀관은 귀관 자신의 지대에서 이러한 정책을 따를 것이다.\n\n어떤 이유로든 [500면] 연합군 군표와 라이히스마르크의 충분한 공급이 이루어지지 않거나 그러한 통화의 사용이 바람직하지 않다고 판명되는 경우에 귀관이 사용할 통화에 관하여 귀관은 별도의 지시를 받을 것이다.\n\n귀관은 추가 지시를 받을 때까지 귀관의 지대에서 한편의 라이히스마르크와 다른 한편의 미국 달러 및 그 밖의 통화 사이의 일반 환율을 발표하거나 설정하지 아니할 것이다. 다만 귀관의 지대에서 병사의 급여와 군의 회계 목적에만 쓰일 환율은 별도로 귀관에게 통보될 것이다.\n\n**46.** 통제이사회의 합의된 정책이 있다면 그것을 조건으로 하여, 귀관은 다음 조치를 취할 권한과, 점령의 목적을 이루는 데 필요하다고 여기는 그 밖의 재정 조치를 시행할 권한을 갖는다.\n\n**a.**\n\n사유 또는 공유 증권이나 부동산 또는 그 밖의 재산의 이전이나 그 밖의 거래를 금지하거나 이에 관한 규정을 정하는 것.\n\n**b.**\n\n은행을 폐쇄하는 것. 다만 귀관이 만족스러운 통제를 도입하고 나치 및 그 밖의 바람직하지 않은 인원을 제거하며 아래 제48항 e에 따라 동결할 계좌의 결정을 위한 지시를 내리는 데 필요한 기간에 한한다.\n\n**c.**\n\n증권거래소·보험회사 및 그와 비슷한 금융기관을 귀관이 적절하다고 여기는 기간 동안 폐쇄하는 것.\n\n**d.**\n\n일반적 또는 제한적 지불유예(모라토리엄)를 설정하는 것. 다만 이 지령 제4항 및 제5항에 밝힌 목표를 수행하는 데 명백히 필요한 한도에 그친다.\n\n**47.** 될 수 있는 대로 이른 시기에 국내 공채의 원리금 지급을 부분적으로 또는 완전히 재개하는 것이 바람직하다고 여겨진다. 통제이사회는 그러한 재개의 시기와 방법을 결정하여야 한다.\n\n**48.** 통제이사회의 합의된 정책이 있다면 그것을 조건으로 하여,\n\n**a.**\n\n귀관은 다음을 금지할 것이다.\n\n**(1)**\n\n모든 군인 연금 또는 그 밖의 급여와 수당의 지급. 다만 수급자의 노동 능력을 제한하는 신체적 장애에 대한 보상은 제외하되, 그 지급률은 비군사적 원인에서 생긴 그에 상당하는 신체적 장애에 대한 지급률 가운데 가장 낮은 것보다 높지 아니하여야 한다.\n\n**(2)**\n\n다음의 이유로 부여되거나 수여된 모든 공적 또는 사적 연금 및 그 밖의 급여와 수당의 지급:\n\n**(a)**\n\n과거 나치당과 그 예하 조직, 부속 단체 또는 감독 하의 조직들의 구성원이었거나 그에 복무한 것을 이유로 한 것,\n\n**(b)**\n\n제6항에 따라 관직이나 지위에서 축출된 자에게 지급되는 것, 그리고\n\n**(c)**\n\n제8항에 따라 체포되어 구금된 자에게 그 체포 기간 동안 지급되는 것, 또는 그 뒤 유죄 판결을 받은 경우에는 영구적으로 지급되는 것.\n\n**b.**\n\n귀관은 인종·국적·[501면] 신조 또는 정치적 의견을 이유로 어떤 사람들을 유리하게 또는 불리하게 차별하는 조세 기타 재정 분야에 관한 모든 법률과 관행이 그러한 차별을 없애는 데 필요한 한도에서 개정·정지 또는 폐기되도록 보장하는 데 필요한 조치를 취할 것이다.\n\n**c.**\n\n귀관은 조세 제도의 회복과 조세 수입의 유지를 포함하여, 제4항 및 제5항에 밝힌 목표의 달성을 촉진할 조세 및 그 밖의 공공재정 분야의 조치를 취할 책임을 독일 당국에 지울 것이다.\n\n**d.**\n\n귀관은 독일의 공공지출이 제4항 및 제5항에 밝힌 목표와 어긋나지 않도록 보장하기 위하여 이에 대한 전반적 감독을 행할 것이다.\n\n**e.**\n\n귀관은 다음 범주에 드는 모든 금·은·통화·증권·금융기관의 계좌·신용·유가서류 및 그 밖의 모든 자산을 압류하거나 동결할 것이다.\n\n**(1)**\n\n다음의 어느 하나가 직접 또는 간접으로, 전부 또는 일부를 소유하거나 지배하는 재산:\n\n**(a)**\n\n독일 라이히, 또는 어느 주(Lander)·관구(Gaue) 또는 도(province), 어느 군(Kreis)·시읍면 또는 그와 비슷한 지방 하부기관, 또는 그것들의 어떠한 기관이나 조직체. 위의 어느 것의 지배 아래 있는 모든 공익사업체·기업·공공법인 또는 독점체를 포함한다;\n\n**(b)**\n\n1939년 9월 1일 이후 어느 때든 국제연합의 어느 나라와 전쟁 상태에 있었던 다른 나라들의 정부·국민 또는 거주자. 그들이 점령한 지역의 정부·국민·거주자를 포함한다;\n\n**(c)**\n\n나치당과 그 예하 조직, 부속 단체 및 감독 하의 조직들, 그 간부와 주요 구성원 및 지지자;\n\n**(d)**\n\n군정이 금지하거나 해산한 모든 조직·클럽 또는 그 밖의 단체;\n\n**(e)**\n\n국제연합 국가 및 중립국 정부와 독일 밖의 독일인을 포함한, 비독일 국적의 부재 소유자;\n\n**(f)**\n\n나치당이 그 이익을 도모하거나 그 활동을 감추기 위하여 이용한, 공적 예배·자선·교육 또는 예술과 학문에 바쳐진 모든 기관;\n\n**(g)**\n\n제8항의 규정에 따라 체포 대상이 되는 자, 그리고 명부에 포함시키는 등의 방법으로 군정이 지정한 그 밖의 모든 자.\n\n**(2)**\n\n강박에 의한 이전, 또는 몰수·처분·약탈의 부당한 행위의 대상이 되었던 재산. 그것이 법령에 따른 것이든 법의 형식을 갖춘 체하는 절차에 따른 것이든 그 밖의 것이든 묻지 아니한다.\n\n**(3)**\n\n소유자가 누구인지를 묻지 아니하고, 가치 있거나 중요한 예술품 또는 문화재.\n\n귀관은 압류되거나 동결된 자산이 귀관이 발할 인가나 그 밖의 지시에 따라 허용되는 방법으로만 처리되도록 보장하는 조치를 취할 것이다. 특히 위 (1) (a)에 따라 동결된 재산의 경우, 귀관은 [502면] 그 재산을 감시 아래 두면서도 이 지령에 부합하는 사용을 허용하는 인가 조치를 채택하도록 할 것이다. 위 (2)에 따라 동결된 재산의 경우, 귀관은 제4항 및 제5항에 밝힌 목표에 부합하게, 또한 나치와 군국주의의 영향을 감추는 일을 막기 위한 적절한 안전장치를 조건으로 하여, 신속한 원상회복을 위한 조치를 마련할 것이다.\n\n**49.** 수출입에서 생기는 것을 포함한 모든 외환 거래는 독일이 전쟁수행능력을 키우는 것을 막고 이 지령에 제시된 그 밖의 목표를 이루려는 목적으로 통제된다. 이러한 목적을 실현하기 위하여 통제이사회는\n\n**a.**\n\n독일 안팎에 있는 모든 독일의 (공적·사적) 외환과 온갖 종류의 대외자산을 찾아내어 특별기관의 점유와 통제 아래 두어야 한다.\n\n**b.**\n\n규정이나 인가로 허용되는 경우를 제외하고, 금·은·외환에 관한 모든 거래와 어떠한 종류의 모든 외환 거래를 금지하여야 한다. 수출로 얻은 외환은 이 지령 제4항 및 제5항에 밝힌 목표를 달성하는 데 직접 필요한 수입의 결제에 쓸 수 있게 하고, 통제이사회나 그 밖의 적절한 당국이 승인한 목적을 제외하고는 외환 자산의 다른 어떠한 지출도 허가하지 아니하여야 한다.\n\n**c.**\n\n다음을 포함한 모든 외환 거래에 대하여 실효성 있는 통제를 수립하여야 한다.\n\n**(1)**\n\n독일 안의 사람과 독일 밖의 사람 사이의 재산에 관한 거래;\n\n**(2)**\n\n독일 안의 어떤 사람이 독일 밖의 어떤 사람에게 지고 있거나 앞으로 지게 될 채무와 관련된 거래; 그리고\n\n**(3)**\n\n외환 자산이나 그 밖의 형태의 재산을 독일로 반입하거나 독일에서 반출하는 것과 관련된 거래.\n\n통제이사회에서 합의가 이루어지기까지 귀관은 귀관의 지대에서 위 세항 a, b, c에 밝힌 조치를 취할 것이다. 그에 따라 귀관은 귀관의 지대에서 세항 a에 규정된 대로 모든 독일의 외환과 대외자산을 귀관의 관할 안에 귀관이 설치하는 특별기관의 점유와 통제 아래 둘 것이다. 귀관은 같은 목적의 비슷한 기관이 다른 점령지대에도 설치되도록, 또 그것들이 될 수 있는 대로 빨리 점령지역 전체를 아우르는 하나의 기관으로 통합되도록 노력할 것이다. 아울러 귀관은 모든 독일의 외환과 대외자산에 관하여 본국 정부에 상세한 보고를 제공할 것이다.\n\n**50.** 어떠한 외국인이나 외국 정부도 독일 또는 독일인에게 신용을 공여하는 것은 허용되지 아니한다. 다만 통제 [503면] 이사회가 특별한 긴급사태에서 그러한 신용 공여를 허가할 수 있다.\n\n**51.** 귀관이 라이히스방크나 그 밖의 은행 또는 어떠한 공적·사적 기관에 신용을 제공하는 일은 예상되지 아니한다. 만일 귀관의 견해로 그러한 조치가 긴요하게 된다면 귀관은 적절하다고 여기는 긴급 조치를 취할 수 있으나, 어떠한 경우에도 그 사실을 통제이사회에 보고할 것이다.\n\n**52.** 귀관은 귀관의 지대에서 군정의 재정 운용을 나타내는 데 필요한 회계와 기록을 유지할 것이며, 통제이사회가 요구하는 정보를 제공할 것이다. 여기에는 귀관의 부대에 의한 통화 사용, 정부 간 결제, 점령 비용, 그리고 귀관의 부대가 참여하는 작전이나 활동에서 생기는 그 밖의 지출에 관한 정보가 포함된다.", "secondary": "IPCOG 1\n\nApril 26, 1945.\n\n1. The Purpose and Scope of this Directive:\n\nThis directive rescinds JCS 1067 and is issued to you as Commanding General of the United States forces of occupation in Germany. As such you will serve as United States member of the Control Council and will also be responsible for the administration of military government in the zone or zones assigned to the United States for purposes of occupation and administration. It outlines the basic policies which will guide you in those two capacities after the termination of the combined command of the Supreme Commander, Allied Expeditionary Force.\n\nThis directive sets forth policies relating to Germany in the initial post-defeat period. As such it is not intended to be an ultimate statement of policies of this Government concerning the treatment of Germany in the post-war world. It is therefore essential that, during the [485면] period covered by this directive, you assure that surveys are constantly maintained of economic, industrial, financial, social and political conditions within your zone and that the results of such surveys and such other surveys as may be made in other zones are made available to your Government, through the Joint Chiefs of Staff. These surveys should be developed in such manner as to serve as a basis for determining changes in the measures of control set forth herein as well as for the progressive formulation and development of policies to promote the basic objectives of the United States. Supplemental directives will be issued to you by the Joint Chiefs of Staff as may be required.\n\nAs a member of the Control Council you will urge the adoption by the other occupying powers of the principles and policies set forth in this directive and, pending Control Council agreement, you will follow them in your zone. It is anticipated that substantially similar directives will be issued to the Commanders in Chief of the U.K., USSR and French forces of occupation.\n\nPart I\n\nGeneral and Political\n\n2. The Basis of Military Government\n\na.\n\nThe rights, power and status of the military government in Germany are based upon the unconditional surrender or total defeat of Germany. The Text of the Instrument of Unconditional Surrender is at Appendix “A”. [주25] You will assure that the policies set forth in that Instrument are carried out in your zone of occupation even though the defeat of Germany is not followed by a formal signing of the Instrument.\n\nb.\n\nSubject to the provisions of paragraph 3 below, you are, by virtue of your position, clothed with supreme legislative, executive, and judicial authority in the areas occupied by forces under your command. This authority will be broadly construed and includes authority to take all measures deemed by you necessary, appropriate or desirable in relation to military exigencies and the objectives of a firm military government.\n\nc.\n\nYou will issue a proclamation continuing in force such proclamations, orders and instructions as may have heretofore been issued by Allied Commanders in your zone, subject to such changes as you may determine. Authorizations of action by the Supreme Commander, Allied Expeditionary Force, may be considered as applicable to you unless inconsistent with this or later directives.\n\n[486면]\n\n3. The Control Council and Zones of Occupation:\n\na.\n\nThe four Commanders-in-Chief, acting jointly, will constitute the Control Council in Germany which will be the supreme organ of control over Germany in accordance with the agreement on Control Machinery in Germany at Appendix “B”. [주26] For purposes of administration of military government, Germany has been divided into four zones of occupation. The agreed protocols on zones are at Appendix “C”. [주27]\n\nb.\n\nThe authority of the Control Council to formulate policy and procedures and administrative relationships with respect to matters affecting Germany as a whole will be paramount throughout Germany. You will carry out and support in your zone the policies agreed upon in the Control Council. In the absence of such agreed policies you will act in accordance with this and other directives of the Joint Chiefs of Staff.\n\nc.\n\nThe administration of affairs in Germany shall be directed towards the decentralization of the political and administrative structure and the development of local responsibility. To this end you will encourage autonomy in regional, local and municipal agencies of German administration. The German economic structure shall also be decentralized. The Control Council may, however, to the minimum extent required for the fulfillment of purposes set forth herein, permit centralized administration or establish central control of (a) essential national public services such as railroads, communications and power, (b) finance and foreign affairs, and (c) production and distribution of essential commodities.\n\nd.\n\nThe Control Council should adopt procedures to effectuate, and you will facilitate in your zone, the equitable distribution of essential commodities between the zones. In the absence of a conflicting policy of the Control Council, you may deal directly with one or more zone commanders on matters of special concern to such zones.\n\ne.\n\nPending the formulation in the Control Council of uniform policies and procedures with respect to inter-zonal travel and movement of civilians, no civilians shall be permitted to leave or enter your zone without your authority, and no Germans within your zone shall be permitted to leave Germany except for specific purposes approved by you.\n\nf.\n\nThe military government personnel in each zone, including those dealing with regional and local branches of the departments of any central German administrative machinery, shall be selected by authority [487면] of the Commander of that zone except that liaison officers may be furnished by the Commanders of the other three zones. The respective Commanders-in-Chief shall have exclusive jurisdiction throughout the whole of Germany over the members of the armed forces under their command and over the civilians who accompany them.\n\ng.\n\nThe Control Council should be responsible for facilitating the severance of all governmental and administrative connections between Austria and Germany and the elimination of German economic influences in Austria. Every assistance should be given to the Allied Administration in Austria in its efforts to effectuate these purposes.\n\n4. Basic Objectives of Military Government in Germany:\n\na.\n\nIt should be brought home to the Germans that Germany’s ruthless warfare and the fanatical Nazi resistance have destroyed the German economy and made chaos and suffering inevitable and that the Germans cannot escape responsibility for what they have brought upon themselves.\n\nb.\n\nGermany will not be occupied for the purpose of liberation but as a defeated enemy nation. Your aim is not oppression but to occupy Germany for the purpose of realizing certain important Allied objectives. In the conduct of your occupation and administration you should be just but firm and aloof. You will strongly discourage fraternization with the German officials and population.\n\nc.\n\nThe principal Allied objective is to prevent Germany from ever again becoming a threat to the peace of the world. Essential steps in the accomplishment of this objective are the elimination of Nazism and militarism in all their forms, the immediate apprehension of war criminals for punishment, the industrial disarmament and demilitarization of Germany, with continuing control over Germany’s capacity to make war, and the preparation for an eventual reconstruction of German political life on a democratic basis.\n\nd.\n\nOther Allied objectives are to enforce the program of reparations and restitution, to provide relief for the benefit of countries devastated by Nazi aggression, and to ensure that prisoners of war and displaced persons of the United Nations are cared for and repatriated.\n\n5. Economic Controls:\n\na.\n\nAs a member of the Control Council and as zone commander, you will be guided by the principle that controls upon the German economy may be imposed to the extent that such controls may be necessary to achieve the objectives enumerated in paragraph 4 above and also as they may be essential to protect the safety and meet the needs of the occupying forces and assure the production and maintenance of goods and services required to prevent starvation or such disease and unrest as would endanger these forces. No action will be taken in execution of the reparations program or otherwise which [488면] would tend to support basic living conditions in Germany or in your zone on a higher level than that existing in any one of the neighboring United Nations.\n\nb.\n\nIn the imposition and maintenance of such controls as may be prescribed by you or the Control Council, German authorities will to the fullest extent practicable be ordered to proclaim and assume administration of such controls. Thus it should be brought home to the German people that the responsibility for the administration of such controls and for any breakdowns in those controls will rest with themselves and German authorities.\n\n6. Denazification:\n\na.\n\nA Proclamation dissolving the Nazi Party, its formations, affiliated associations and supervised organizations, and all Nazi public institutions which were set up as instruments of Party domination, and prohibiting their revival in any form, should be promulgated by the Control Council. You will assure the prompt effectuation of that policy in your zone and will make every effort to prevent the reconstitution of any such organization in underground, disguised or secret form. Responsibility for continuing desirable non-political social services of dissolved Party organizations may be transferred by the Control Council to appropriate central agencies and by you to appropriate local agencies.\n\nb.\n\nThe laws purporting to establish the political structure of National Socialism and the basis of the Hitler regime and all laws, decrees and regulations which establish discriminations on grounds of race, nationality, creed or political opinions should be abrogated by the Control Council. You will render them inoperative in your zone.\n\nc.\n\nAll members of the Nazi party who have been more than nominal participants in its activities, all active supporters of Nazism or militarism and all other persons hostile to Allied purposes will be removed and excluded from public office and from positions of importance in quasi-public and private enterprises such as (1) civic, economic and labor organizations, (2) corporations and other organizations in which the German government or subdivisions have a major financial interest, (3) industry, commerce, agriculture, and finance, (4) education, and (5) the press, publishing houses and other agencies disseminating news and propaganda. Persons are to be treated as more than nominal participants in Party activities and as active supporters of Nazism or militarism when they have (1) held office or otherwise been active at any level from local to national in the party and its subordinate organizations, or in organizations which further militaristic doctrines, (2) authorized or participated affirmatively in any Nazi crimes, racial persecutions or discriminations, (3) been avowed believers in Nazism [489면] or racial and militaristic creeds, or (4) voluntarily given substantial moral or material support or political assistance of any kind to the Nazi Party or Nazi officials and leaders. No such persons shall be retained in any of the categories of employment listed above because of administrative necessity, convenience or expediency.\n\nd.\n\nProperty, real and personal, owned or controlled by the Nazi Party, its formations, affiliated associations and supervised organizations, and by all persons subject to arrest under the provisions of paragraph 8, and found within your zone, will be taken under your control pending a decision by the Control Council or higher authority as to its eventual disposition.\n\ne.\n\nAll archives, monuments and museums of Nazi inception, or which are devoted to the perpetuation of German militarism, will be taken under your control and their properties held pending decision as to their disposition by the Control Council.\n\nf.\n\nYou will make special efforts to preserve from destruction and take under your control records, plans, books, documents, papers, files, and scientific, industrial and other information and data belonging to or controlled by the following:\n\n(1)\n\nThe Central German Government and its subdivisions, German military organizations, organizations engaged in military research, and such other governmental agencies as may be deemed advisable;\n\n(2)\n\nThe Nazi Party, its formations, affiliated associations and supervised organizations;\n\n(3)\n\nAll police organizations, including security and political police;\n\n(4)\n\nImportant economic organizations and industrial establishments including those controlled by the Nazi Party or its personnel;\n\n(5)\n\nInstitutes and special bureaus devoting themselves to racial, political, militaristic or similar research or propaganda.\n\n7. Demilitarization:\n\na.\n\nIn your zone you will assure that all units of the German armed forces, including para-military organizations, are dissolved as such, and that their personnel are promptly disarmed and controlled in accordance with policies and procedures set forth in the Instrument of Unconditional Surrender or in other directives which may be issued to you. Prior to their final disposition, you will arrest and hold all military personnel who are included under the provisions of paragraph 8.\n\nb.\n\nThe Control Council should proclaim, and in your zone you will effectuate, the total dissolution of all military and paramilitary organizations, including the General Staff, the German Officers Corps, the Reserve Corps and military academies, together with all associations which might serve to keep alive the military tradition in Germany.\n\n[490면] c.\n\nYou will seize or destroy all arms, ammunition and implements of war and stop the production thereof.\n\nd.\n\nYou will take proper steps to destroy the German war potential, as set forth elsewhere in this directive.\n\n8. Suspected War Criminals and Security Arrests:\n\na.\n\nYou will search out, arrest, and hold, pending receipt by you of further instructions as to their disposition, Adolf Hitler, his chief Nazi associates, other war criminals and all persons who have participated in planning or carrying out Nazi enterprises involving or resulting in atrocities or war crimes.\n\nb.\n\nAll persons who, if permitted to remain at large would endanger the accomplishment of your objectives will also be arrested and held in custody until trial by an appropriate semi-judicial body to be established by you. The following is a partial list of the categories of persons to be arrested in order to carry out this policy:\n\n(1)\n\nOfficials of the Nazi Party and its formations, affiliated associations, and supervised organizations, down to and including Local Group Leaders (Ortsgruppenleiter) and officials of equivalent rank;\n\n(2)\n\nAll members of the political police, including the Gestapo and Sicherheitsdienst der S.S.;\n\n(3)\n\nThe officers and non-commissioned officers of the Waffen S.S. and all members of the other branches of the S.S.;\n\n(4)\n\nAll General Staff Corps officers;\n\n(5)\n\nOfficials of the police holding a rank, or equivalent positions of authority, above that of Lieutenant;\n\n(6)\n\nOfficers of the SA holding commissioned rank;\n\n(7)\n\nThe leading officials of all ministries and other high political officials down to and including urban and rural buergermeister and officials of equivalent rank, and those persons who have held similar positions, either civil or military, in the administration of countries; occupied by Germany;\n\n(8)\n\nNazis and Nazi sympathizers holding important and key positions in (a) National and Gau civic and economic organizations; (b) corporations and other organizations in which the government has a major financial interest; (c) industry, commerce, agriculture, and finance; (d) education; (e) the judiciary; and (f) the press, publishing houses and other agencies disseminating news and propaganda. It may generally be assumed in the absence of evidence to the contrary that any persons holding such positions are Nazis or Nazi sympathizers;\n\n(9)\n\nAll judges, prosecutors and officials of the People’s Court (Volksgerichtshof), Special Courts (Sondergerichte) and other extraordinary courts created by the Nazi regime;\n\n(10)\n\nAny national of any of the United Nations or associated states who is believed to have committed offenses against his national law in support of the German war effort;\n\n(11)\n\nAny other person whose name or designation appears on lists, to be submitted to you by the J.C.S. or whose name may be so notified, to you separately.\n\n[491면]\n\nIf in the light of conditions which you encounter in Germany, you believe that it is not immediately feasible to subject certain persons within these categories to this treatment, you should report your reasons and recommendations to your government through the Joint Chiefs of Staff. If you believe it desirable, you may postpone the arrest of those whose cases you have reported, pending a decision communicated to you by the J.C.S. In no event shall any differentiation be made between or special consideration be accorded to persons arrested, either as to manner of arrest or conditions of detention, upon the basis of wealth or political, industrial, or other rank or position. In your discretion you may make such exceptions as you deem advisable for intelligence or other military reasons.\n\n9. Political Activities:\n\na.\n\nNo political activities of any kind shall be countenanced unless authorized by you. You will assure that your military government does not become committed to any political group.\n\nb.\n\nYou will prohibit the propagation in any form of Nazi, militaristic or pan-German doctrines.\n\nc.\n\nNo German parades, military or political, civilian or sports, shall be permitted by you.\n\nd.\n\nTo the extent that military interests are not prejudiced and subject to the provisions of the three preceding subparagraphs and of paragraph 10, freedom of speech, press and religious worship will be permitted. Consistent with military necessity, all religious institutions will be respected.\n\n10. Public Relations and Control of Public Information:\n\nAs a member of the Control Council, you will endeavor to obtain agreement for uniform or coordinated policies with respect to (a) control of public information media in Germany, (5) accrediting of foreign correspondents, (c) press censorship, and (d) issuance of official news communiqués dealing with Control Council matters. U.S. policies in these matters will be sent to you separately and you will be guided by these in your negotiations on the Control Council.\n\n11. German Cowts:\n\na.\n\nAll extraordinary courts, including the Volksgerichtshof (People’s Court) and the Sondergerichte (Special Courts), and all courts and tribunals of the Nazi Party and of its formations, affiliated associations and supervised organizations will be abolished immediately.\n\nb.\n\nAll ordinary criminal, civil and administrative courts, except those previously re-established by order of the military government,, will be closed. After the elimination of all Nazi features and personnel [492면] you will permit those which are to exercise jurisdiction within the boundaries of your zone to resume operations under such regulations, supervision and control as you may consider appropriate. Courts which are to exercise jurisdiction over territory extending beyond the boundaries of your zone will be reopened only with the express authorization of the Control Council and under its regulation, supervision and control. The power to review and veto decisions of German courts shall be included within the power of supervision and control.\n\n12. Police:\n\nWith the exception of the Reichskriminal polizei (Criminal Police) all elements of the Sicherheitspolizei (Security Police), e.g., Geheime Staatspolizei (Gestapo), and the Sicherheitsdienst der S.S. will be abolished. Criminal and ordinary police will be purged of Nazi personnel and utilized under the control and supervision of the military government.\n\n13. Political Prisoners:\n\nSubject to military security and the interests of the individuals concerned, you will release all persons found within your zone who have been detained or placed in custody on grounds of race, nationality, creed or political opinions and treat them as displaced persons. You should make provision for the review of convictions of alleged criminal offenses about which there may be substantial suspicion of racial, religious or political persecution, and in which sentences of imprisonment have not been fully served by persons imprisoned within your zone.\n\n14. Education:\n\na.\n\nAll educational institutions within your zone except those previously re-established by Allied authority will be closed. The closure of Nazi educational institutions such as Adolf Hitler Schulen, Napolas and Ordensburgen, and of Nazi organizations within other educational institutions will be permanent.\n\nb.\n\nA coordinated system of control over German education and an affirmative program of reorientation will be established designed completely to eliminate Nazi and militaristic doctrines and to encourage the development of democratic ideas.\n\nc.\n\nYou will permit the reopening of elementary (Volksschulen), middle (Mittelschulen) and vocational (Berufsschulen) schools at the earliest possible date after Nazi personnel has been eliminated. Textbooks and curricula which are not free of Nazi and militaristic doctrine shall not be used. The Control Council should devise programs looking toward the reopening of secondary schools, universities and other institutions of higher learning. After Nazi features and personnel have been eliminated and pending the formulation of such programs by the Control Council, you may formulate and put into effect [493면] an interim program within your zone and in any case may permit the reopening of such institutions and departments which offer training which you consider immediately essential or useful in the administration of military government and the purposes of the occupation.\n\nd.\n\nIt is not intended that the military government will intervene in questions concerning denominational control of German schools, or in r
