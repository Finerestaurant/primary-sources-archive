월 10일.\n\n참석자: 대통령\n\nJ. C. 홈스 장군[주32]\n\n윌리엄 필립스(William Phillips) 씨[주33]\n\n국무장관 대리 그루(Grew) 씨\n\n나는 오늘 아침 홈스 장군 및 필립스 씨와 함께 대통령을 방문하여 다음의 문제들을 다루었다.\n\n1. 독일의 전후 처리. 나는 독일의 전후 처리에 관한 유럽 주둔 총사령관에게 보낼 우리 지령이 합동참모본부가 아직 검토 중인 한두 가지 사소한 점을 제외하고는 이제 완성되었으며, 오늘 오후에는 그 문서를 대통령의 승인을 받도록 제출할 수 있게 되기를 바란다고 말했다. 나는 또한 이 문제에 관한 우리 계획을 공표하라는 여론의 큰 압력을 받고 있으며, 대통령이 그 문서를 승인하고 그것이 아이젠하워 장군에게 보내진 [509면] 뒤에는 그 문서의 요지를 이른 시일 안에 공표할 수 있을 것이라고 말했다. 대통령은 이에 동의하고, 이미 자기 앞에 와 있던 예비 문서들을 살펴보았다고 말하면서 우리에게 그 계획의 요점을 말해 달라고 청했다. 홈스 장군은 그 계획의 주된 목적이 독일에서 전쟁 수단을 제조할 수 있는 산업들을 제거하는 데 있다고 말했다. 대통령은 여기에 중공업뿐 아니라 경공업도 포함되는지 물었다. 홈스 장군은 모겐소 씨가 합성석유 공장들이 파괴되기를 바라고 있으나, 아이젠하워 장군이 미국에서 대량의 석유를 들여와야 하는 대신 그 공장들을 쓸 수 있는 동안에는 그것들을 파괴하는 것이 현명하지 못하리라는 것이 우리의 입장이라고 말했다. 대통령은 이 점에서 자기는 모겐소 씨와 전적으로 견해를 달리한다고 말했다. 대통령은 오후 내내 집무실에 있을 터이니 문서가 준비되는 대로 클레이턴(Clayton) 씨와 내가 그것을 가지고 와서 직접 자기 앞에 내놓아 주면 좋겠다고, 그러면 지체 없이 그것을 검토하겠다고 말했다.\n\n대통령은 독일에서 난장판 같은 시기가 끝나는 대로 독일에 대한 통치상의 통제가 그 이행이 효율적으로 이루어질 수 있는 한 신속히 민간의 손에 있게 되기를 바란다고 말했다. 대통령은 군이 군사작전의 필요를 넘어서는 통치상의 책임을 져서는 안 된다는 것이 우리의 전통이라고 일반적으로 말했다.\n\n. . . . . . .\n\n조지프 C. 그루(Joseph C. Grew)", "secondary": "[Extract]\n\n[Washington,] May 10, 1945.\n\nParticipants: The President\n\nGeneral J. C. Holmes [주32]\n\nMr. William Phillips [주33]\n\nActing Secretary, Mr. Grew\n\nI called on the President this morning with General Holmes and Mr. Phillips and took up the following problems:\n\n1. Post-war Treatment of Germany. I said that our directive to the Commander-in-Chief in Europe on the post-war treatment of Germany was now completed with the exception of one or two minor points still under consideration by the Joint Chiefs of Staff and that I hoped the paper would be ready this afternoon to submit to the President for his approval. I also said that we are under great pressure from the public to publish our plans in this respect and that after the President had approved the document and after it had been sent [509면] to General Eisenhower we could give publicity to the substance of the paper at an early date. The President agreed and said that he had already looked at the preliminary documents which were already before him and he asked us to give him the highlights of the plan. General Holmes said that the main purpose of the plan was to eliminate such industries in Germany as might be able to manufacture the implements of war. The President asked whether this included light as well as heavy industries. General Holmes observed that Mr. Morgenthau desired to have the synthetic oil plants destroyed but our position is that it would be unwise to destroy them as long as General Eisenhower might have use of them instead of having to import large quantities of oil from the United States. The President said that in this respect he entirely disagreed with Mr. Morgenthau. The President said that he would be in his office all the afternoon and that as soon as the paper is ready he would be glad to have Mr. Clayton and myself bring it over and lay it before him personally and he would make a point of studying it without delay.\n\nThe President said that as soon as the rough and tumble period is over in Germany he wants Governmental control of Germany to be in civilian hands as rapidly as the transition can be efficiently brought about. The President made a general statement that it is in our tradition that the military should not have governmental responsibilities beyond the requirements of military operations.\n\n. . . . . . .\n\nJoseph C. Grew", "notes": ["[주32] 국무부 차관보 줄리어스 C. 홈스(Julius C. Holmes).", "[주33] 국무장관 특별보좌관."], "warn": false, "pages": ["509"], "search": "Truman 트루먼(대통령) Grew 그루(국무장관 대리) Holmes 홈스(국무부 차관보 줄리어스 C. 홈스) Phillips 필립스(윌리엄 필립스, 국무장관 특별보좌관) Morgenthau 모겐소(재무장관) Eisenhower 아이젠하워 Clayton 클레이턴(국무부 차관보)"}, {"id": "d356", "order": 356, "date": "1945-05-10", "group": "B", "eyebrow": "d356 · Memorandum by the Joint Chiefs of Staff to the Secretary of War (Stimson) and the Secretary of the Navy (Forrestal)  Transmitted as an annex to a memorandum from the Secretary of the State-War-Navy Coordinating Committee (Charles W. McCarthy) to Assistant Secretary of State Clayton. The memorandum read in part as follows: “Attached hereto is a copy of a memorandum from the Joint Chiefs of Staff to the Secretaries of War and the Navy containing certain amendments to the Directive to Commander-in-Chief of U.S. Forces of Occupation regarding the Military Government of Germany, which were accepted by the Informal Policy Committee on Germany at its meeting on 4 May 1945.”", "title": "합동참모본부가 육군장관(스팀슨)과 해군장관(포레스털)에게 보내는 각서", "badge": null, "list_right": "문서 356", "meta": [{"k": "일자", "v": "1945-05-10"}, {"k": "시각", "v": "Washington, 10 May 1945."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 Control (Germany)/5–1045", "txt": true}, {"k": "발신", "v": "The Joint Chiefs of Staff 합동참모본부 (서명: William D. Leahy 리히 해군원수)", "txt": true}, {"k": "수신", "v": "The Secretary of War (Stimson) 육군장관 스팀슨 및 The Secretary of the Navy (Forrestal) 해군장관 포레스털", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 356 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d356"}], "summary": "합동참모본부가 IPCOG 1에 담긴 미 점령군 총사령관에 대한 독일 군정 지령에 군사적 관점에서 이의가 없다고 하면서, 세 가지 수정을 조건으로 붙인 것이다.", "points": ["합동참모본부는 IPCOG 1에 담긴 미 점령군 총사령관에 대한 독일 군정 지령의 군사적 함의를 재검토했고, 5월 2일자 서한의 수정안 대신 다음 수정이 이루어진다면 군사적 관점에서 이의가 없다고 했다.", "제30항 끝에, 총사령관의 재량으로 합성고무·합성석유·알루미늄·마그네슘의 생산을 지령 제4·5항의 목적을 채우는 데 필요한 최소한도로 허용할 수 있게 하는 단서를 넣는다.", "제32항 마지막 문장에, 지령 제4·5항의 목적에 필요한 생산을 검토·결정할 기회를 가진 뒤라는 조건을 덧붙인다.", "제34항 c에서 「용역(services)」 다음에 제30·32항에 명시된 물자를 제외한다는 괄호 문구를 넣고, 「배상, 귀관의 병력을 위하여, 그리고 이 지령 제21항의 규정에 따라 독일 국민을 위하여」라는 문구를 「이 지령 제4·5항에 제시된 목적을 위하여」로 바꾼다.", "이 수정들은 5월 4일 독일에 관한 비공식정책위원회 회의에서 받아들여진 것이라고 첨부 각서가 밝히고 있다.[주34]"], "primary": "워싱턴, 1945년 5월 10일.\n\n합동참모본부는 육군장관과 해군장관이 국무장관에게 다음과 같이 알릴 것을 권고한다.\n\n「합동참모본부는 IPCOG 1에 담긴, 독일의 군정에 관한 미국 점령군 총사령관에 대한 지령안의 군사적 함의를 [510면] 재검토했다. 합동참모본부는 1945년 5월 2일자 서한[주35]에 담긴 수정들을 대신하여 다음의 수정들이 이루어진다면, 군사적 관점에서 그 지령에 아무런 이의가 없다고 본다.\n\n「가. 제30항 마지막 문장 끝의 마침표를 지우고 다음을 덧붙일 것. 『다만, 귀관의 재량으로, 귀관이 제출할 수 있는 연기 권고에 대하여 합동참모본부가 조치를 취할 때까지, 합성고무 및 합성석유, 알루미늄, 마그네슘의 생산을 이 지령 제4항 및 제5항에 제시된 목적을 충족하는 데 필요한 최소한도로 허용할 수 있다.』\n\n「나. 제32항 마지막 문장의 마침표를 지우고 다음의 말을 덧붙일 것. 『귀관이 이 지령 제4항 및 제5항에 제시된 목적을 위하여 필요한 생산을 검토하고 결정할 기회를 가진 즉시.』\n\n「다. 제34항 c의 『용역(services)』이라는 말 다음에 『(제30항 및 제32항에 명시된 물자는, 생산을 용이하게 하기 위한 조치가 합동참모본부를 통하여 본국 정부에 의해 명시적으로 승인되지 않는 한, 제외한다)』라는 말을 덧붙일 것. 또한 『배상, 귀관의 병력을 위하여, 그리고 이 지령 제21항의 규정에 따라 독일 국민을 위하여』라는 말을 지우고 『이 지령 제4항 및 제5항에 제시된 목적을 위하여』라는 말로 대체할 것.」\n\n합동참모본부를 대리하여:\n\n\n윌리엄 D. 리히(William D. Leahy),\n 해군원수, 미국 해군, 육해군 총사령관 참모장", "secondary": "Washington, 10 May 1945.\n\nThe Joint Chiefs of Staff recommend that the Secretary of War and the Secretary of the Navy inform the Secretary of State as follows:\n\n“The Joint Chiefs of Staff have reconsidered the military implications of the proposed directive to the Commander in Chief, United States Forces of Occupation regarding the military government of [510면] Germany contained in IPCOG 1. The Joint Chiefs of Staff perceive no objections to the directive from a military point of view provided the following amendments are made in lieu of those contained in the letter dated 2 May 1945: [주35]\n\n“a. Delete the period at the end of the last sentence, paragraph 30, and add the following: ‘except that, in your discretion, you may permit the production of synthetic rubber and oil, aluminum and magnesium, to the minimum extent necessary to meet the purposes stated in paragraphs 4 and 5 of the directive pending action by the Joint Chiefs of Staff upon such recommendation for postponement as you may make.’\n\n“b. Delete the period and add the following words to the last sentence of paragraph 32: ‘as soon as you have had an opportunity to review and determine production necessary for the purposes stated in paragraphs 4 and 5 of this directive.’\n\n“c. After the word ‘services’ in paragraph 34 c, add the words ‘(excluding goods specified in paragraphs 30 and 32 unless measures to facilitate production are specifically approved by this Government through the Joint Chiefs of Staff).’ Also delete the words ‘reparation, for your forces and, subject to the provisions of paragraph 21 of this directive, for the German people’ and substitute the words ‘the purposes outlined in paragraphs 4 and 5 of this directive.’ ”\n\nFor the Joint Chiefs of Staff: \n\n\nWilliam D. Leahy\n\n, \n Fleet Admiral, U.S. Navy, Chief of Staff to the Commander in Chief of the Army and Navy", "notes": ["[주34] 국무·육군·해군 3부조정위원회 간사(찰스 W. 매카시Charles W. McCarthy)가 국무부 차관보 클레이턴에게 보낸 각서의 부속서로 송부되었다. 그 각서에는 일부 다음과 같이 적혀 있었다. 「여기 첨부한 것은 합동참모본부가 육군 및 해군 장관에게 보낸 각서의 사본으로서, 독일의 군정에 관한 미 점령군 총사령관에 대한 지령에 가하는 일정한 수정들을 담고 있으며, 이 수정들은 1945년 5월 4일 회의에서 독일에 관한 비공식정책위원회가 받아들인 것이다.」", "[주35] 인쇄하지 않음."], "warn": false, "pages": ["510"], "search": "Leahy 리히(해군원수, 육해군 총사령관 참모장) Stimson 스팀슨(육군장관) Forrestal 포레스털(해군장관) McCarthy 매카시(찰스 W. 매카시, SWNCC 간사) Clayton 클레이턴(국무부 차관보)"}, {"id": "d357", "order": 357, "date": "1945-05-10", "group": "C", "eyebrow": "d357 · Memorandum of Conversation, by the Acting Secretary of State", "title": "국무장관 대리의 대화 비망록", "badge": null, "list_right": "문서 357", "meta": [{"k": "일자", "v": "1945-05-10"}, {"k": "시각", "v": "[Washington,] May 10, 1945. (오후 두 번째 회담 — “a second conference this afternoon”)"}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 E.W./5–1045", "txt": true}, {"k": "발신", "v": "The Acting Secretary of State (Grew) 국무장관 대리 그루", "txt": true}, {"k": "수신", "v": "기록 (국무부 편철)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "대화 비망록"}], "links": [{"k": "FRUS", "text": "문서 357 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d357"}], "summary": "같은 날 오후 두 번째 회담에서 대통령이 독일 전후 처리 지령의 최종안에 직접 승인을 써넣었다.", "points": ["그루가 같은 날 오후 모겐소 재무장관, 벨 재무차관, 클레이턴, 필립스와 함께 대통령을 두 번째로 만났다.", "클레이턴이 유럽 주둔 총사령관에 대한 독일 전후 처리 지령의 최종 초안을 대통령에게 제출하며, 이것이 이제 위원회 전원과 합동참모본부의 승인을 받았다고 말했고 모겐소도 동의했다.", "그루가 공표를 요구하는 이른 압력 문제를 제기하자, 대통령은 문서를 훑어 연합국을 난처하게 할 수 있는 내용을 걸러낼 시간을 가진 뒤에 공표해야 한다고 보았다.", "대통령이 그 문서에 승인을 써넣었고, 클레이턴은 새 사진복사본을 만들어 되도록 빨리 대통령에게 보내기로 했다."], "primary": "[발췌]\n\n[워싱턴,] 1945년 5월 10일.\n\n참석자: 대통령, 재무장관 모겐소, 차관 벨,[주36] 클레이턴 씨와 필립스 씨; 국무장관 대리 그루 씨\n\n나는 오늘 오후 모겐소 장관, 재무차관 벨 씨, 클레이턴 씨 및 필립스 씨와 함께 두 번째 회담을 위하여 대통령에게 갔다.\n\n(1) 클레이턴 씨는 독일의 전후 처리에 관한 유럽 주둔 총사령관에 대한 지령의 [511면] 최종 초안을 대통령에게 제출하면서, 그것이 이제 위원회의 전 위원과 합동참모본부의 승인을 받았다고 말했다. 모겐소 씨도 이에 동의했다. 나는 공표를 요구하는 이른 압력의 문제를 제기했는데, 그는 우리가 그 문서를 훑어보고 그 공표가 우리 연합국들에게 난처함을 안길 수 있는 내용을 걸러낼 시간을 가진 뒤에 곧바로 공표해야 한다고 생각했다. 대통령은 그 문서에 자신의 승인을 써넣었다. 클레이턴 씨는 그 문서의 사진복사본을 새로 만들어 되도록 빨리 대통령에게 보내기로 했다.\n\n. . . . . . .\n\n조지프 C. 그루(Joseph C. Grew)", "secondary": "[Extract]\n\n[Washington,] May 10, 1945.\n\nParticipants: The President, Secretary of the Treasury Morgenthau, Under Secretary Bell, [주36] Messrs. Clayton and Phillips; Acting Secretary, Mr. Grew\n\nI went to the President for a second conference this afternoon with Secretary Morgenthau, Mr. Bell, Under Secretary of the Treasury, Mr. Clayton and Mr. Phillips.\n\n(1) Mr. Clayton presented to the President the final draft of the directive to the Commander-in-Chief in Europe for the post-war [511면] treatment of Germany which Mr. Clayton said had now been approved by all members of the Committee and by the Joint Chiefs of Staff. Mr. Morgenthau concurred. I raised the question of early public pressure to publish and he thought that this should be done as soon as we had time to go through the paper and eliminate any of its contents the publication of which might cause embarrassment to our Allies. The President wrote his approval on the document. Mr. Clayton undertook to have a new photostat made of the document and sent to him as soon as possible.\n\n. . . . . . .\n\nJoseph C. Grew", "notes": ["[주36] 재무차관 대니얼 W. 벨(Daniel W. Bell)."], "warn": false, "pages": ["511"], "search": "Truman 트루먼(대통령) Grew 그루(국무장관 대리) Morgenthau 모겐소(재무장관) Bell 벨(대니얼 W. 벨, 재무차관) Clayton 클레이턴(국무부 차관보) Phillips 필립스(윌리엄 필립스)"}, {"id": "d693", "order": 693, "date": "1945-05-10", "group": "D", "eyebrow": "d693 · The United States Political Adviser for Germany (Murphy) to the Secretary of State", "title": "대독일 정치고문(머피)이 국무장관에게", "badge": null, "list_right": "문서 693", "meta": [{"k": "일자", "v": "1945-05-10"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Versailles", "txt": true}, {"k": "전문번호", "v": "No. 351"}, {"k": "원문출처", "v": "740.00119 Control (Germany)/5–1045", "txt": true}, {"k": "발신", "v": "The United States Political Adviser for Germany (Murphy) 대독일 정치고문 머피", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "서한"}], "links": [{"k": "FRUS", "text": "문서 693 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d693"}], "summary": "머피가 4월 29일자 유럽전역사령부 문서를 송부하면서, 부군정장관·미국 통제이사회단과 전역참모부 사이의 관계가 클레이 중장 한 사람에게 세 직책을 겸하게 함으로써 정리되었다고 보고한 것이다.", "points": ["1945년 4월 29일 유럽전역사령부에서 발표된 「부군정장관 및 미국 통제이사회단(독일)과 전역참모부의 관계」 문서를 송부한다.[주37]", "클레이 중장이 부군정장관, 참모차장, 미국 통제이사회단 사령관의 세 직책을 겸함으로써 전역참모부와 미국 통제이사회단이 한 사람의 조정된 통제 아래 놓인다.", "통제이사회가 활동을 시작하기 전에 SHAEF가 해체될 경우, 미국 통제이사회단이 유럽전역사령관 참모부의 전방 제대로 간주된다.[주39]", "통제이사회가 설치된 뒤에도 미국 통제이사회단은 부군정장관 아래에서 미국의 정책을 세워 통제이사회에 제시하고, 연합국 통제기구의 합의로 대체되지 않는 한 미국 지대에 적용한다.", "미국 통제이사회단과 독일 관리들 사이, 그리고 미국 통제이사회단과 전역참모부 사이의 통신 경로 문제는 직접 통신과 전역 지휘 계통 사용을 모두 인정하는 「상당히 관대한 정신」으로 해결되었다.", "머피는 국무부 인원이 미국 통제이사회단에 배속된 성격을 고려하여 이 보고서를 국무부 안에서도 제한적으로만 회람하고, 외부 부처·기관과 내용을 논의할 때는 출처 언급을 피할 것을 건의했다."], "primary": "제351호\n\n[베르사유,] 1945년 5월 10일.\n\n각하: 삼가 1945년 4월 29일 유럽전역사령부(European Theater of Operations)에서 발표된 「부군정장관 및 미국 통제이사회단(독일)과 전역참모부의 관계(The Relationship of the Deputy Military Governor and the US Group Control Council (Germany) to the Theater Staff)」라는 제목의 문서 사본 한 부를 여기 송부하는 영광을 누립니다.[주37]\n\n이 문서를 살펴보면, 통제이사회와 전역(지대) 참모부의 관계 문제를 둘러싸고 있던 여러 어려움이 예비적 계획의 범위에서는 만족스럽게 해결되었음이 분명합니다. 클레이(Clay) 중장 한 사람에게 부군정장관, 참모차장, 미국 통제이사회단 사령관이라는 세 직책을 겸하게 함으로써, 미국 통제이사회단은 물론 전역참모부까지 한 사람의 조정된 통제 아래 놓이게 될 것입니다. 따라서 (첨부 문서 제6항[주38] 참조) 통제이사회가 활동을 시작하기 전에 SHAEF(연합국원정군최고사령부)가 [939면] 해체될 경우,[주39] 미국 통제이사회단은 유럽전역사령관 참모부의 전방 제대(前方梯隊)로 간주되리라 예상됩니다. 그런 경우 미국 지대에 적용할 정책의 수립은 미국 통제이사회단을 통하여, 그리고 다른 참모 부서들과 조정하여, 부군정장관의 책임이 될 것입니다.\n\n마찬가지로, 통제이사회가 설치된 뒤에도 미국 통제이사회단은 부군정장관 아래에서 일하면서 통제이사회에 제시할, 그리고 연합국 통제기구의 합의에 의하여 대체되지 않는 한 미국 지대에 적용할 미국의 정책들을 수립하게 될 것입니다. (제9항 c 참조.[주40])\n\n한편으로는 미국 통제이사회단과 독일 관리들 사이의, 다른 한편으로는 미국 통제이사회단과 전역참모부 사이의 통신 경로라는 성가신 문제는, 직접 통신과 전역 지휘 계통의 사용을 아울러 인정함으로써 상당히 관대한 정신으로 해결되었습니다. (제9항 d, 제9항 c 및 제12항 참조.)\n\n저는 첨부 문서에 명시된 조치들이 점령 독일의 미국 지대에서 정책의 수립과 그 집행에 관계하게 될 여러 집단의 노력을 만족스럽게 조정할 것이며, 그러한 집단들 사이의 마찰이나 경쟁의 여지를 모두 없애리라고 믿습니다. 이 사절단도 그 문서의 기초 과정에서 자문을 받았습니다.[주41]\n\n[940면]\n\n국무부 인원이 미국 통제이사회단에 배속된 성격에 비추어, 저는 이 보고서를 국무부 안에서 제한적으로만 회람하시고, 그 내용을 외부의 어떤 부처나 기관과 논의하실 경우에는 출처에 대한 언급을 피하실 것을 건의드립니다.\n\n경구,\n\n로버트 머피(Robert Murphy)", "secondary": "No. 351\n\n[Versailles,] May 10, 1945.\n\nSir: I have the honor to transmit herewith a copy of a paper issued from Headquarters of the European Theater of Operations on April 29, 1945, on the subject of “The Relationship of the Deputy Military Governor and the US Group Control Council (Germany) to the Theater Staff.” [주37]\n\nFrom a study of this document, it is apparent that the many difficulties which have surrounded the question of the relationship of the Control Council to the Theater (Zone) Staff have been satisfactorily resolved so far as preliminary planning goes. By combining in the person of Lieutenant General Clay the three offices of Deputy Military Governor, Deputy Chief of Staff, and Commanding General of US Group CC, the Theater Staff as well as the US Group CC would come under the coordinated control of one person. Thus it is anticipated (see Par. 6 of the enclosed paper [주38] ) that if SHAEF is [939면] dissolved before the Control Council begins to operate, [주39] the US Group CC will be regarded as the forward echelon of the staff of the Commanding General of the European Theater of Operations. In such case the development of policy for application in the U. S. Zone will be the responsibility of the Deputy Military Governor through the US Group CC and in coordination with other staff divisions.\n\nSimilarly, even after the establishment of the Control Council, the US Group CC, working under the Deputy Military Governor, will develop American policies for presentation to the Control Council and for application in the U. S. Zone when not superseded by agreement of the Allied control authority. (See Par. 9c. [주40] )\n\nThe troublesome question of channels of communication between US Group CC and German officials on the one hand and US Group CC and the Theater Staff on the other has been resolved in a rather liberal spirit by authorizing direct communication as well as the use of theater command channels. (See Pars. 9d, 9c, and 12.)\n\nIt is my belief that the arrangements specified in the enclosed paper will satisfactorily coordinate the efforts of the several groups which will be concerned with the development of policies and their execution in the U. S. Zone of occupied Germany and will remove all suggestion of friction or competition between such groups. This Mission was consulted in the drafting of the paper. [주41]\n\n[940면]\n\nIn view of the nature of the assignment of the Department’s personnel to US Group CC, I wish to suggest that this report be given only limited circulation within the Department and that if its contents are discussed with any outside department or agency, reference to source be avoided.\n\nRespectfully yours,\n\nRobert Murphy", "notes": ["[주37] 인쇄하지 않음.", "[주38] 제6항은, 연합국 통제기구의 설치에 앞서 SHAEF가 종료될 경우 「미국 통제이사회단(독일)은 유럽전역 미육군사령관 참모부의 전방 제대이며, 독일 내 연합국 통제기구의 설치에 관한 사항을 처리한다. 부군정장관은 유럽전역 미육군사령관을 대표하며, 미국 통제이사회단(독일)이 연합국 통제기구를 이룰 다른 나라 구성체들과 접촉을 유지하는 일을 감독한다. 연합국 통제기구가 설치될 때까지, 미국의 견해에 부합하는, 미국 지대에 적용할 정책의 수립은 미국 통제이사회단(독일)을 활용하고 다른 참모 부서들과 조정하는 부군정장관의 책임이 된다」고 예상했다.", "[주39] SHAEF는 7월 14일 해체되었다. 연합국 통제이사회는 7월 30일 첫 공식 회의를 열었다. 이 회의에 관한 보고는 머피의 7월 30일자 전보 제234호, 820면 참조.", "[주40] 제9항 c는 다음과 같다. 「다자간 합의가 이루어질 때까지, 승인된 미국의 견해에 부합하는 독일에 관한 정책의 수립은 미국 통제이사회단(독일)을 사용하고 전역참모 부서들을 조정하는 부군정장관의 책임이다. 그렇게 수립된 정책은 유럽전역 미육군사령관의 승인을 받으면 미국 통제이사회단(독일)이 다른 점령국 대표들과의 교섭에서 활용하며, 연합국 통제기구의 합의로 대체되지 않는 한 미국 지대에서의 활동을 규율한다.」", "[주41] 5월 25일 머피 씨에게 보낸 서한에서 제임스 W. 리들버거(James W. Riddleberger)는 위 제안들에 대한 국무부의 만족을 표했다. 그는 미국 통제이사회단과 전역참모부 사이의 조정이 결여될 수 있다는 우려가 가라앉았다고 말했다. 「우리는 특히 이 구상에서 부군정장관이 맡은 이중의 역할에 만족하며, 미국 통제이사회단과 전역참모부의 상응하는 직책들을 한 사람이 겸하게 하는 정책이 … 널리 실천되기를 바랍니다.」 (740.00119 Control (Germany)/5–2545) 이에 대한 답으로 머피 씨는 6월 21일 리들버거 씨에게 아이젠하워 장군이 그 제안들에 최종 승인을 내렸다고 보고했다. 「물론 이 관계에는 처음에는 그리 원활하게 굴러가지 않을 몇 가지 측면이 있습니다. 지금 상태로는 지대 내의 군정은 여전히 유럽전역 미육군(ETOUSA)의 G–5[민사부]에 있습니다. 클레이 장군은 부군정장관이며, 보시다시피 통상의 지휘 계통과 G–5의 기술 계통을 아울러 사용하여 참모차장 G–5를 통해 직접 조정을 확보할 책임을 지고 있습니다. 그러나 사령관의 참모장이 그와 관련하여 일정한 지휘 권한을 행사하게 될 것입니다. 이 관계는 실무에서 다듬어 나가야 할 것입니다. 쉽게 말하자면 이는 누가 ETOUSA G–5의 우두머리가 될 것인가 하는 문제로 귀결됩니다.」 (740.00119 Control (Germany)/6–2145)"], "warn": false, "pages": ["939", "940"], "search": "Murphy 머피(대독일 정치고문 로버트 머피) Clay 클레이(루셔스 D. 클레이 중장, 부군정장관) Riddleberger 리들버거(제임스 W. 리들버거) Eisenhower 아이젠하워"}, {"id": "d863", "order": 863, "date": "1945-05-10", "group": "A", "eyebrow": "d863 · The Minister in Ireland (Gray) to the Secretary of State", "title": "주아일랜드 공사(그레이)가 국무장관에게", "badge": null, "list_right": "문서 863", "meta": [{"k": "일자", "v": "1945-05-10"}, {"k": "시각", "v": "Dublin, May 10, 1945—6 p.m. [Received 8:34 p.m.]"}, {"k": "장소", "v": "Dublin", "txt": true}, {"k": "전문번호", "v": "112"}, {"k": "원문출처", "v": "701.6241D/5–1045: Telegram", "txt": true}, {"k": "발신", "v": "The Minister in Ireland (Gray) 주아일랜드 공사 그레이", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 863 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d863"}], "summary": "아일랜드 정부가 더블린의 독일 공사관 열쇠와 재산 목록을 국제연합국을 대표하는 미국 공사에게 넘기기로 한 경과를 보고한 것이다.", "points": ["5월 5일 토요일까지 아일랜드 정부가 문서고를 온전히 확보할 가망이 있는 동안에는 독일 공사관을 해임할 뜻이 없음이 분명해지자, 그레이는 마피와 협의한 뒤 외무부 사무차관 J. P. 월시에게 보낼 편지를 기초했다.", "그 편지는 아일랜드가 여전히 독일 정부를 외교적으로 존속하는 것으로 인정하는 이상 문서고를 쓸 만한 상태로 확보할 가능성은 이미 없어졌다며, 야밤의 전화 연락 제의를 사양하는 형식을 취했다.", "편지의 목적은 독일 공관 건물을 넘겨받는 일의 중요성을 낮추고, 동시에 VE데이가 발표되는 대로 독일 재산을 넘기겠다던 월시의 약속을 기록에 남겨 두려는 것이었다. 그레이는 「그의 말과 나의 말」 외에 증거가 없었다.", "5월 10일 오전 11시 30분 면담에서 월시는 이의를 제기하지 않고, 이날 오후 4시에 열쇠와 재산 목록을 넘기겠다고 약속했다.", "월시가 제안하고 그레이가 마피와 협의해 채택한 수령 문구는 「국제연합국이 독일 정부의 권한과 재산을 인수했다」고 아일랜드 정부에 통고하는 형식이었다.", "그레이는 프랑스 공사에게도 통보하여 그 문구에 대한 승인을 받았고, 인수에는 미·영·프 대표와 아일랜드 외무부 대표가 함께 참여하며 아일랜드 정부가 추후 통지가 있을 때까지 경찰 보호를 제공한다.", "월시는 독일 측으로부터 금고에는 소액의 현금과 공사관 회계장부 외에 아무것도, 곧 암호나 기밀 자료는 남아 있지 않다고 들었다고 알렸다. 예상대로였다.", "그레이는 5월 5일 독일 하사관 3명을 태우고 저먼스타운에 착륙한 JU 88 항공기의 점유도 요구하여 인정받았다."], "primary": "더블린, 1945년 5월 10일 오후 6시.\n [접수 오후 8시 34분]\n\n112. 5월 5일 오후 3시자 본 공사관 전보 106호[주28] 참조. 5월 5일 토요일까지 아일랜드 정부가 문서고를 온전한 상태로 찾아낼 가망이 있는 동안에는 독일 공관을 해임할 뜻이 없음이 분명해졌으므로, 나는 마피(Maffey)[주29]와 협의한 뒤 외무부 사무차관 J. P. 월시(J. P. Walshe)에게 보낼 다음의 편지를 기초했다.\n\n「더블린, 1945년 5월 5일.\n\n친애하는 조(Joe)에게: 아시다시피 나는 지난 수요일[주30] 우리 대화 중에 귀하가 친절히도, 독일 정부가 외교적 대표의 목적상 더 이상 존재하지 않는다고 선언하기로 한 귀하의 결정을 알려 주고 또 국제연합국을 대표하는 나에게 독일 공사관의 열쇠를 넘겨 주기 위하여, 밤중이라도 [1143면] 즉시 전화를 걸어 주겠다고 하신 제의를 고맙게 여겼습니다. 그러나 귀하가 아직 독일 정부를 외교적으로 존속하는 것으로 인정하고 계시므로, 나는 국제연합국에 쓸모가 있을 만한 상태의 문서고를 찾아낼 가능성이 이제는 더 이상 존재하지 않는다고 느끼며, 우리 둘 다 밤중의 조치를 머리에 두지 않고 잠을 즐겼으면 합니다.\n\n나는 다음 주에 잠시 쉬려고 며칠 시골로 갈까 합니다. 이 문제에 관하여 조치를 취할 준비가 되시거든 내 비서 몽고메리 콜러데이(Montgomery Colladay) 씨에게 알려 주시면, 그가 나를 대신하여 국제연합국의 여러 대표들에게 알릴 것입니다. 이 공사관은 언제든 전화로 나에게 연락할 수 있으며, 나는 아주 짧은 시간 안에 더블린에 올 수 있습니다.\n\n경구, 데이비드 그레이(David Gray)」\n\n5월 7일 월요일 업무 개시와 동시에 인편으로 보낸 이 편지의 목적은, 아일랜드 정부가 우리에게 협조하기를 거절한 뒤 독일 공관 건물의 점유를 얻어내는 일의 중요성을 최소화하는 한편, VE데이가 발표되는 대로 독일 재산을 나에게 넘겨 주겠다고 월시 씨가 자기 정부를 대신하여 한 약속에 대한 나의 주장을 기록에 남겨 두려는 데 있었다. 나에게는 그의 말에 맞설 나의 말밖에 없었다.\n\n오늘 아침 나는 11시 30분에 그를 만나기로 약속을 잡았다. 어제 평문(en clair)으로 제111호[주31]로 타전해 드린 아일랜드 정보국의 공식 발표에 비추어, 나는 아일랜드 정부가 나에게 한 월시의 약속을 회피하고 독일 공사가 요청한 대로 독일 이익의 보호국으로 행동하겠다고 고집할 준비가 되어 있는지 확신할 수 없었다. 그러나 월시는 아무런 이의도 제기하지 않았고, 오늘 오후 4시에 열쇠와 재산 목록을 나에게 넘겨 주기로 약속했다. 그는 나에게 어떤 형태로든 수령증을 달라고 청하면서 하나의 문안을 제안했는데, 나는 마피와 협의한 뒤 다음과 같이 그것을 채택했다.\n\n「더블린, 1945년 5월 10일.\n\n본인은 본국 정부로부터, 국제연합국이 독일 정부의 권한과 재산을 인수하였음을 아일랜드 정부에 통고할 권한을 부여받았다. 따라서 본인은 이제 국제연합국을 대표하여 더블린 노섬벌랜드로 58번지에 있는 독일 공사관 건물과 그 안의 물건들을 인수할 준비가 되어 있다.\n\n주아일랜드 미국 공사」\n\n나는 프랑스 공사에게도 통보하여 이 문안에 대한 그의 승인을 얻었다. 콜러데이와 매케널리(McEnelly)[주32]를 보내고 있으며, 이들은 영국 대표부의 우드하우스(Woodhouse) 준장 및 프랑스 공관의 부영사 한 사람, 그리고 열쇠를 지닌 외무부 대표 한 사람과 함께 [1144면] 건물을 인수할 것이다. 아일랜드 정부는 추후 통지가 있을 때까지 경찰의 보호를 제공할 것이다. 콜러데이의 보고는 뒤따를 것이다. 월시는 나에게, 독일 측으로부터 들은 바로는 금고에는 소액의 현금과 공사관 회계장부 외에는 아무것도, 곧 암호나 기밀 자료는 남아 있지 않다고 알렸다. 이는 예상한 바와 같다.\n\n나는 또한 5월 5일 독일군 하사관 3명을 태우고 저먼스타운(Germanston)에 착륙한 JU 88 항공기의 점유를 요구하여 그것을 인정받았다 (5월 7일 오후 4시자 본 공사관 전보 107호[주33] 참조).\n\n그레이(Gray)", "secondary": "Dublin, May 10, 1945—6 p.m. \n [Received 8:34 p.m.]\n\n112. ReLegtel 106, May 5, 3 p.m. [주28] It being evident by Saturday May 5 that the Irish Government did not intend to dismiss the German mission while there might be a chance of finding the archives intact, I drafted the following letter to J. P. Walshe, Secretary of External Affairs, after consultation with Maffey: [주29]\n\n“Dublin, May 5, 1945.\n\nDear Joe: As you know I was appreciative of your kind offer made during our conversation last Wednesday [주30] to call me on the telephone [1143면] immediately, even in the night, to apprise me of your decision to declare the German Government no longer existent for purposes of diplomatic representation and to hand me, as representing the United Nations, the keys to the German Legation. However, since you still recognize the German Government as diplomatically extant, I feel that there no longer exists a possibility of finding the archives in a condition that would be of use to the United Nations, and I suggest that both of us enjoy our sleep without having immediate nocturnal action on our minds.\n\nI hope to get to the country for a few days next week for a bit of rest, and if you will notify my secretary, Mr. Montgomery Colladay, when you are ready to act in this matter, he will notify the various representatives of the United Nations on my behalf. This Legation can always reach me by telephone, and in a very short time I can be in Dublin.\n\nYours Sincerely, David Gray”\n\nThe purpose of this letter which I sent by hand at opening of business Monday May 7 was to minimize the importance of obtaining possession of the German premises after the refusal of the Irish Government to cooperate with us and also to register on the record my claim as to the promise of Mr. Walshe on behalf of his Government to turn over German property to me as soon as VE-day was announced. I had only his word as against mine.\n\nThis morning I made an appointment to see him at 11:30 o’clock. In view of the official announcement of the Irish Bureau of Information telegraphed to you en clair yesterday as No. 111, [주31] 1 was uncertain whether Irish Government was prepared to evade Walshe’s promise to me and insist on acting as protecting power for German interests as German Minister requested. However, Walshe made no objection and promised to deliver keys and inventory to me at 4 p.m. today. He asked me to give him a receipt of some sort and suggested a formula which after consultation with Maffey I adopted as follows:\n\n“Dublin, May 10, 1945.\n\nI am authorized by my Government to inform the Irish Government that the United Nations have assumed the powers and property of the Government of Germany. I am, therefore, now prepared, on behalf of the United Nations, to take over the premises of the German Legation located at 58 Northumberland Road, Dublin, and the contents thereof.\n\nAmerican Minister to Ireland”\n\nI also notified French Minister and obtained his approval to formula. Am sending Colladay and McEnelly [주32] who, with Brigadier Woodhouse of British representation and a Vice Consul from French mission together with a representative from External Affairs with [1144면] the keys, will take over premises. Irish Government will provide police protection till further notice. Colladay’s report will follow. Walshe informed me that he understood from Germans that there was nothing left in safe but a small sum in cash and the Legation accounts, that is no codes or confidential data. This is as was expected.\n\nI further claimed and was accorded possession of the JU 88 airplane which landed at Germanston on May 5 with 3 German noncommissioned officers (ReLegtel 107, May 7, 4 p.m. [주33] )\n\nGray", "notes": ["[주28] 인쇄하지 않음.", "[주29] 존 마피(John Maffey), 주아일랜드 영국 대표.", "[주30] 5월 2일.", "[주31] 인쇄하지 않음. 독일 공사가 공사관 건물을 비우고 있다는 기사가 더블린 신문들에 실렸다고 보고한 것이다 (740.00119 Control (Germany)/5–945).", "[주32] 토머스 매케널리(Thomas McEnelly), 더블린 주재 총영사.", "[주33] 인쇄하지 않음."], "warn": true, "pages": ["1143", "1144"], "search": "Gray 그레이(데이비드 그레이, 주아일랜드 미국 공사) Walshe 월시(J. P. 월시, 아일랜드 외무부 사무차관) Maffey 마피(존 마피, 주아일랜드 영국 대표) Colladay 콜러데이(몽고메리 콜러데이, 공사 비서) McEnelly 매케널리(토머스 매케널리, 더블린 주재 총영사) Woodhouse 우드하우스(영국 대표부 준장)"}, {"id": "d232", "order": 232, "date": "1945-05-11", "group": "A", "eyebrow": "d232 · The Acting Secretary of State to the Ambassador in the United Kingdom (Winant)", "title": "국무장관 대리가 주영대사(위넌트)에게", "badge": null, "list_right": "문서 232", "meta": [{"k": "일자", "v": "1945-05-11"}, {"k": "시각", "v": "Washington, May 11, 1945—4 p.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "3690 (파리에 2005호로 재발신)"}, {"k": "원문출처", "v": "740.00119 Control (Germany)/5–1045: Telegram", "txt": true}, {"k": "발신", "v": "The Acting Secretary of State (Grew) 국무장관 대리 그루", "txt": true}, {"k": "수신", "v": "The Ambassador in the United Kingdom (Winant) 주영대사 위넌트", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 232 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d232"}], "summary": "프랑스 점령지대 문제를 파리에서 다시 교섭할 것이 아니라 런던의 유럽자문위원회에서 즉시 밀고 나가라는 훈령이다.", "points": ["국무부는 캐퍼리가 프랑스 정부에 예정된 지대를 설명한 이상 파리에서 프랑스 지대에 관한 추가 교섭이 있으리라고는 생각하지 않았다.", "위넌트는 즉시 마시글리에게 이 지대를 알리고, 5월 5일 오후 7시자 국무부 3546호에 지시된 대로 교섭을 진행하라는 요청을 받았다.", "카를스루에 관구(Bezirk of Karlsruhe)에 관하여, 교섭의 신속한 성공에 긴요하다면 위넌트가 그 지역을 프랑스에 제시해도 좋다.", "이 문제를 유럽자문위원회에서 되도록 빨리 밀고 나가는 것이 중요하다.", "[점령지대 획정과 관련된 문서로, 지대 경계가 어디서 어떻게 움직였는가를 보여준다.]"], "primary": "워싱턴, 1945년 5월 11일 오후 4시.\n\n3690. 5월 10일 오후 10시자 귀 전보 4710호[주43] 참조. 국무부는 캐퍼리(Caffery)가 프랑스 정부에 그에 예정된 지대를 설명한 이상 파리에서 독일 내 프랑스 지대에 관한 추가 교섭이 있으리라고는 생각하지 않았다. 귀하는 즉시 마시글리에게 이 지대를 알리고, 5월 5일 오후 7시자 국무부 3546호에 지시된 대로 교섭을 진행할 것을 요청받는다.\n\n귀하는 카를스루에 관구(Bezirk)에 관한 캐퍼리의 런던 앞 282호[주44]를 보았을 것이다. 이 지역은 교섭의 신속한 성공에 긴요하다면 귀하가 프랑스 측에 제시해도 좋다.\n\n이 문제를 유럽자문위원회에서 되도록 신속히 밀고 나가는 것이 중요하다.\n\n파리에 2005호로 재발신.\n\n그루(Grew)\n\n[288면]", "secondary": "Washington, May 11, 1945—4 p.m.\n\n3690. ReUrtel 4710, May 10, 10 p.m. [주43] The Department had not contemplated that there would be further negotiations in Paris respecting the French zone in Germany once that Caffery had described to the French Government the zone envisaged for it. You are requested immediately to inform Massigli of this zone and to proceed with the negotiations as indicated in Department’s 3546, May 5, 7 p.m.\n\nYou will have observed Caffery’s 282 to London [주44] with respect to Bezirk of Karlsruhe. This area should be offered by you to the French if essential to the prompt success of the negotiations.\n\nIt is important that this matter be pushed forward as promptly as possible in the EAC.\n\nRepeated to Paris as 2005.\n\nGrew\n\n[288면]", "notes": ["[주43] 인쇄하지 않음. 독일 내 지대 배정 처리의 완결에 관하여 파리로부터의 소식을 기다리고 있다고 보고한 것이다 (740.00119–Control (Germany)/5–1045).", "[주44] 파리발 5월 6일자 전보 2410호와 같음, 278면."], "warn": false, "pages": ["288"], "search": "Grew 그루(국무장관 대리) Winant 위넌트(주영대사) Caffery 캐퍼리(주프랑스대사) Massigli 마시글리(유럽자문위원회 프랑스 대표)"}, {"id": "d233", "order": 233, "date": "1945-05-11", "group": "A", "eyebrow": "d233 · The Ambassador in the United Kingdom (Winant) to the Secretary of State", "title": "주영대사(위넌트)가 국무장관에게", "badge": null, "list_right": "문서 233", "meta": [{"k": "일자", "v": "1945-05-11"}, {"k": "시각", "v": "London, May 11, 1945—9 p.m. [Received May 11—8:50 p.m.]"}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "4726 (Special German Series No. 12)"}, {"k": "원문출처", "v": "740.00119 EW/5–1145: Telegram", "txt": true}, {"k": "발신", "v": "The Ambassador in the United Kingdom (Winant) 주영대사 위넌트", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 233 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d233"}], "summary": "위넌트가 머피와 전화로 통화하여 두 사람 사이에 조정 문제에 관한 이견이 없음을 확인했고, 자신의 앞선 전보가 SHAEF가 서명한 「간이 항복 조항」 제4조를 가리킨 것이었음을 밝힌 것이다.", "points": ["위넌트가 5월 10일 오후 7시자 머피의 런던 앞 290호를 받은 뒤(머피가 런던에 재발신하면서 국무부 앞 전보번호를 표시하지 않았다[주45]) 머피 대사에게 전화를 걸었다.", "통화 결과 두 사람이 조정(coordination) 문제에 관하여 서로 이견이 없음을 확인했다.", "머피는 위넌트의 5월 6일 오후 4시자 4600호가 SHAEF가 서명한 「간이 항복 조항(brief surrender terms)」 제4조를 가리킨 것임을 이해하지 못하고 있었다.", "위넌트는 4600호를 보낼 당시, 사용될 간이 항복 조항의 초안이 이미 통합참모본부에 송부되었다고 들은 상태였다."], "primary": "런던. 1945년 5월 11일 오후 9시.\n [접수 5월 11일 오후 8시 50분]\n\n4726. 특별 독일 시리즈 제12호. 5월 10일 오후 7시자 머피의 런던 앞 290호를 받은 뒤(머피가 런던으로 재발신하면서 국무부 앞 전보의 번호를 표시하지 않았다[주45]) 나는 머피 대사에게 전화를 걸었고, 우리가 조정 문제에 관하여 서로 이견이 없음을 알게 되었다. 그는 나의 언급(나의 5월 6일 오후 4시자 4600호)이 SHAEF가 서명한 간이 항복 조항의 제4조를 가리킨 것임을 이해하지 못하고 있었다. 내가 4600호를 보냈을 때 나는 사용될 간이 항복 조항의 초안이 이미 통합참모본부(Combined Chiefs of Staff)에 송부되었다고 들은 상태였다.\n\n위넌트(Winant)", "secondary": "London . May 11, 1945—9 p.m. \n [Received May 11—8:50 p.m.]\n\n4726. Special German Series No. 12. After receiving Murphy’s 290 to London May 10, 7 p.m. (number of Murphy’s message to Department was not indicated in his repeat to London [주45] ) I called up Ambassador Murphy by telephone and I find that we are not in disagreement in regard to coordination. He had not understood that my reference (my 4600 May 6, 4 p.m.) was to article 4 of the brief surrender terms signed by SHAEF. When I sent my 4600 I had been told that the draft of the brief surrender terms to be used had already been forwarded to the Combined Chiefs of Staff.\n\nWinant", "notes": ["[주45] 전보 2517호, 284면 참조."], "warn": false, "pages": [], "search": "Winant 위넌트(주영대사) Murphy 머피(대독일 정치고문)"}, {"id": "d234", "order": 234, "date": "1945-05-11", "group": "A", "eyebrow": "d234 · The United States Political Adviser for Germany (Murphy) to the Secretary of State", "title": "대독일 정치고문(머피)이 국무장관에게", "badge": null, "list_right": "문서 234", "meta": [{"k": "일자", "v": "1945-05-11"}, {"k": "시각", "v": "Paris, May 11, 1945—4 p.m. [Received 11:37 p.m.]"}, {"k": "장소", "v": "Paris", "txt": true}, {"k": "전문번호", "v": "2528"}, {"k": "원문출처", "v": "740.00119 Control (Germany)/5–1145: Telegram", "txt": true}, {"k": "발신", "v": "The United States Political Adviser for Germany (Murphy) 대독일 정치고문 머피", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 234 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d234"}], "summary": "제1프랑스군이 라인강 좌안의 네 개 군(Landkreise) 철수 요구를 거부하며, 정부 간 합의가 있을 때까지 그 지역을 점령해야 한다는 프랑스 정부의 견해를 밝힌 것이다.", "points": ["제6집단군이 SHAEF에 보고하기를, 제15군이 라인란트주를 통제하게 되므로 제1프랑스군에게 베르크차베른·란다우·게르머스하임·슈파이어의 군(Landkreise)에서 철수(evacuate)할 것을 요청했다고 한다.", "제6집단군의 두 번째 요청에 대해 제1프랑스군은 프랑스 정부의 견해라며, 프랑스가 라인강 좌안의 장래에 직접적인 이해관계가 있고 군사적 편의만으로 그 문제를 결정해서는 안 된다고 답했다.", "파리·워싱턴·런던·모스크바 정부 간 합의로 문제가 해결될 때까지 프랑스는 문제의 지역을 점령할 수밖에 없다는 것이 프랑스 측 입장이다.", "요약의 마지막 문장은 전신 오류로 보여 「Because the area is to be eventually regretable [apparent garble].」로 남아 있다.", "SHAEF는 프랑스 지대에 관한 결정이 날 때까지 이 문제를 그대로 두려는 태도다. 곧 점령지대로의 부대 철수가 지대 획정 결정에 묶여 있다.", "FRUS 편집자 주는 합의된 점령지대로의 연합군 철수(withdrawal) 문제에 관한 영국 측 견해로 처칠이 트루먼에게 보낸 5월 11일자 제40호·제41호와 5월 12일자 제44호 전문을 가리킨다."], "primary": "파리, 1945년 5월 11일 오후 4시.\n [접수 오후 11시 37분]\n\n2528. 제6집단군이 SHAEF에 보고한 바에 따르면, 제15군이 라인란트주(Rhineland Province)를 통제하게 되므로 제1프랑스군에게 베르크차베른(Bergzabern), 란다우(Landau), 게르머스하임(Germersheim) 및 슈파이어(Speyer)의 군(Landkreise)에서 철수할 것을 요청했다고 한다. 제6집단군의 두 번째 요청에 대한 회답으로 제1프랑스군은 다음이 그 요지에 있어 프랑스 정부의 견해라고 밝혔다.\n\n요약 시작. 프랑스는 라인강 좌안의 장래에 직접적인 이해관계를 가지고 있다. 군사적 편의만으로 그 문제를 결정해서는 안 된다. 파리, 워싱턴, 런던 및 모스크바의 정부들 사이의 합의로 그 문제가 해결될 때까지, 프랑스는 문제의 지역을 점령할 수밖에 없다. 그 지역이 장차 유감스러울[명백한 전신 오류] 것이기 때문에. 요약 끝.\n\nSHAEF는 프랑스 지대에 관한 결정이 날 때까지 이 문제를 그대로 두려는 태도다.\n\n[머피]\n\n[합의된 점령지대로의 연합국 군대 철수 문제에 관한 영국 측 견해에 대해서는, 처칠 총리가 트루먼 대통령에게 보낸 5월 11일자 제40호, 5월 11일자 제41호, 5월 12일자 제44호 전문을 『베를린(포츠담) 회담』 제1권 5–9면에서 볼 것.]\n\n[289면]", "secondary": "Paris, May 11, 1945—4 p.m. \n [Received 11:37 p.m.]\n\n2528. Sixth Army Group has reported to SHAEF that since Fifteenth Army is to control Rhineland Province, First French Army was asked to evacuate the Landkreise of Bergzabern, Landau, Germersheim and Speyer. In reply to a second request from Sixth Army Group, First French Army stated the following, in substance, were the views of the French Government:\n\nBegin summary. France is directly concerned in the future of the left bank of the Rhine; military conveniences alone must not dictate that question. Until the matter is settled by agreement between the Governments at Paris, Washington, London and Moscow, France is obliged to occupy the area in question. Because the area is to be eventually regretable [apparent garble]. End summary.\n\nSHAEF is disposed to let the matter rest pending decision on the French zone.\n\n[Murphy]\n\n[For the British view regarding the question of the withdrawal of Allied military forces into the agreed zones of occupation, see Prime Minister Churchill’s messages No. 40, May 11, No. 41, May 11, and No. 44, May 12, to President Truman, Conference of Berlin (Potsdam), volume I, pages 5–9.]\n\n[289면]", "notes": [], "warn": true, "pages": ["289"], "search": "Murphy 머피(대독일 정치고문) Churchill 처칠(영국 총리) Truman 트루먼(대통령)"}, {"id": "d94", "order": 94, "date": "1945-05-12", "group": "A", "eyebrow": "d94 · The British Prime Minister (Churchill) to President Truman", "title": "영국 총리(처칠)가 트루먼 대통령에게", "badge": null, "list_right": "문서 94", "meta": [{"k": "일자", "v": "1945-05-12"}, {"k": "시각", "v": "London, 12 May 1945."}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "43"}, {"k": "원문출처", "v": "740.00119 Control (Austria)/5–1245: Telegram", "txt": true}, {"k": "발신", "v": "The British Prime Minister (Churchill) 영국 총리 처칠", "txt": true}, {"k": "수신", "v": "President Truman 트루먼 대통령", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 94 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d94"}], "summary": "소련이 연합국 대표단의 빈 입성을 계속 막고 있는 데 대하여, 처칠이 트루먼에게 스탈린 앞으로 공동 또는 병행 전문을 보낼 것을 제안하며 그 문안을 제시한 것이다.", "points": ["빈으로 향하는 연합국 사절단에 관한 소련 정부의 최근 회답은 전혀 만족스럽지 못하며, 러시아 측이 이런 식으로 우리 대표들을 빈에서 계속 배제하는 것은 도저히 받아들일 수 없다.", "처칠은 빈의 지대 문제를 유럽자문위원회에서 매듭짓는 데는 전적으로 동의하나, 우리 대표들이 먼저 현지 조사를 할 수 있어야 한다고 고집해야 한다고 보며, 알렉산더 원수도 같은 견해를 강하게 지니고 있다.", "외교적 차원에서 교착에 이르렀으므로, 트루먼이 스탈린 원수에게 공동 또는 병행 전문을 보낼 용의가 있는지 묻는다.", "제안된 문안: 4월 13일 해리먼에게 초청을 보냈음에도 소련 정부가 아직 연합국 대표들의 빈행을 거부하고 있음에 놀랐다는 것.", "비신스키가 영국 대리대사 앞 서한에서 든 사실(독일과 베를린의 점령지대가 연합군이 독일 영토에 들어가기 전 유럽자문위원회에서 3자 기초로 확정되었다는 것)은 소련군이 해방한 빈에 연합국 대표들이 가는 것을 거부하는 데 아무 관련이 없다고 본다.", "지대 문제의 최종 결정을 유럽자문위원회에서 빈으로 옮길 뜻은 없으나, 소련 대표 자신이 제안된 소련 지대의 일부가 파괴되었음을 발견하고 위원회에 낸 권고를 고친 바 있으니, 영국 측도 자기 제안에 관한 요인들을 현지에서 살펴볼 권리가 충분히 있다는 것.", "따라서 유럽자문위원회에서의 신속한 합의를 위하여 톨부힌 원수에게 필요한 지시를 내려 연합국 대표들이 즉시 빈으로 날아갈 수 있게 해 달라고 요청한다."], "primary": "런던, 1945년 5월 12일.\n\n43. 빈으로 향하는 우리 사절단에 관한 소련 정부의 최근 회답은 전혀 만족스럽지 못합니다. 러시아 측이 이런 식으로 우리 대표들을 빈에서 계속 배제한다는 것은 도저히 받아들일 수 없는 일입니다. 나는 빈의 [119면] 지대 문제가 유럽자문위원회에서 매듭지어지는 데 아무 이의가 없습니다만, 우리 대표들이 먼저 현지에서 조사를 할 수 있도록 허용되어야 한다고 우리가 고집해야 한다고 봅니다. 알렉산더(Alexander) 원수도 같은 견해를 매우 강하게 지니고 있습니다. 우리가 이제 외교적 차원에서 교착에 이르렀으므로, 귀하는 다음과 같은 취지로 스탈린 원수에게 공동 전문 또는 병행 전문을 보낼 용의가 있으시겠습니까? —\n\n1.\n\n「귀하가 4월 13일 해리먼(Harriman) 씨에게 초청을 보냈음에도 불구하고 소련 정부가 아직도 연합국 대표들이 빈으로 가는 것을 허용하기를 거절하고 있다는 것을 알고 나는 놀랐습니다. 비신스키(Vyshinski) 씨가 영국 대리대사 앞 서한에서 주의를 환기시킨 사실, 곧 독일과 베를린의 점령지대가 연합군이 독일 영토에 들어가기 전에 유럽자문위원회에서 3자 기초로 확정되었다는 사실은, 소련군이 해방한 빈으로 연합국 대표들이 가는 것을 소련 정부가 거절하는 데 아무런 관련이 없어 보입니다. 나는 비신스키 씨가 시사한 바와 같이 지대 문제의 최종 결정을 유럽자문위원회에서 빈으로 옮기려는 뜻은 조금도 없습니다. 그러나 유럽자문위원회의 소련 대표가 제안된 소련 지대의 일부가 파괴되었음을 발견하였기 때문에 위원회에 낸 자신의 권고를 고칠 일이 있었던 만큼, 우리 역시 위원회에서의 우리 자신의 제안에 관계되는 요인들을 현지에서 살펴볼 기회를 가질 자격이 충분히 있다고 느끼게 됩니다.」\n\n2.\n\n「따라서 유럽자문위원회에서의 합의를 신속히 매듭짓기 위하여 — 귀하도 이것이 매우 바람직하다는 데 틀림없이 동의하시리라 믿습니다 — 나는 연합국 대표들이 즉시 빈으로 날아갈 수 있도록 톨부힌(Tolbukhin) 원수에게 필요한 지시가 내려지기를 요청합니다.」\n\n총리", "secondary": "London, 12 May 1945.\n\n43. The latest reply of the Soviet Government about our missions proceeding to Vienna is wholly unsatisfactory. It is quite unacceptable that the Russians should continue in this manner to exclude our representatives from Vienna. I am perfectly willing that the question [119면] of zones in Vienna should be concluded in the EAC, but I feel that we should insist that our representatives should first be allowed to make a survey on the spot. Field Marshal Alexander holds the same view very strongly. As we have now reached a deadlock on the diplomatic level, would you now be willing to send either a joint or parallel message to Marshal Stalin on the following lines:—\n\n1.\n\n“I am surprised to learn that, despite the invitation you extended to Mr. Harriman on April 13th, the Soviet Government are still refusing to allow Allied representatives to proceed to Vienna. The fact, to which M. Vyshinski has drawn attention in a letter to the British Chargé d’Affaires, that the zones of occupation in Germany and Berlin were established on a tripartite basis by the EAC before Allied troops entered German territory seems to me to have no relevance to the refusal of the Soviet Government to allow the representatives of their Allies to proceed to Vienna which has been liberated by Soviet forces. I have no wish, as suggested by M. Vyshinski, to transfer the ultimate decision of the zones question from the EAC to Vienna. But, the Soviet representative on the EAC having had occasion to alter his own recommendations to the Commission because of the discovery that part of the proposed Soviet zone had been destroyed, makes me feel that we too are fully entitled to have the opportunity to examine on the spot the factors bearing on our own proposals in the Commission.”\n\n2.\n\n“In order therefore to facilitate a rapid conclusion of the agreements in the EAC, which you will I am sure agree to be very desirable, I request that the necessary instructions may be issued to Marshal Tolbukhin so that Allied representatives may fly at once to Vienna.”\n\nPrime", "notes": [], "warn": false, "pages": ["119"], "search": "Churchill 처칠(영국 총리) Truman 트루먼(대통령) Stalin 스탈린 Alexander 알렉산더(해럴드 알렉산더 원수) Harriman 해리먼(주소련대사) Vyshinski 비신스키(소련 외무인민위원 대리) Tolbukhin 톨부힌(소련 원수)"}, {"id": "d235", "order": 235, "date": "1945-05-12", "group": "B", "eyebrow": "d235 · Memorandum by the Acting Secretary of State to President Truman  Handwritten endorsement at bottom of memorandum reads: “Approved May 14, 1945 Harry Truman”.", "title": "국무장관 대리가 트루먼 대통령에게 보내는 각서", "badge": null, "list_right": "문서 235", "meta": [{"k": "일자", "v": "1945-05-12"}, {"k": "시각", "v": "Washington, May 12, 1945."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 EW/5–1445", "txt": true}, {"k": "발신", "v": "The Acting Secretary of State (Grew) 국무장관 대리 그루", "txt": true}, {"k": "수신", "v": "President Truman 트루먼 대통령", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 235 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d235"}], "summary": "5월 7일의 간이 「항복문서(Act of Military Surrender)」는 초기 군사 조항만을 담았으므로, 4개국의 최고권한 인수를 정식으로 선언하는 포고(선언)를 발하도록 승인해 달라는 건의다.", "points": ["독일군의 완전한 항복(full capitulation)을 즉시 확보하는 것이 바람직했기 때문에, 연합국원정군 최고사령관과 소련군 최고사령부는 유럽자문위원회가 준비하고 각국 정부가 승인한 무조건 항복 문서를 사용할 때 있을 수 있는 지연의 위험을 무릅쓰는 대신, 5월 7일의 간이 「항복문서(Act of Military Surrender)」를 독일 측에 부과했다.", "그 문서와 그 이튿날 베를린에서 서명된 유사한 문서는 우리의 승리에 따르는 초기 군사 조항만을 규정했다. 두 문서의 층위가 여기서 명시된다.", "따라서 이제 더 나아간 규정을 두고, 미국·영국·소련 정부와 프랑스 임시정부가 이미 합의한 대로 독일에 관한 최고권한을 인수함을 정식으로 선언하는 포고를 발하는 것이 순서다.", "유럽자문위원회가 그 목적에 쓸 포고문의 본문을 구성 정부들에 권고했으며, 이 본문은 위원회가 준비한 무조건 항복 문서를 손질한 것으로 4개 정부가 이미 받아들인 정책과 표현이라는 이점이 있다.", "그루는 그 본문[주47]을 첨부하고, 독일을 점령 중인 4개국 군 사령관들의 서명 아래 포고로 발할 것에 대한 대통령의 승인을 건의한다.", "각서 하단에는 「1945년 5월 14일 승인 해리 트루먼」이라는 친필 배서가 있다.[주46]"], "primary": "워싱턴, 1945년 5월 12일.\n\n독일군의 완전한 항복(capitulation)을 즉시 확보하는 것이 바람직했으므로, 연합국원정군 최고사령관과 소련군 최고사령부는 유럽자문위원회가 준비하고 그곳에 대표를 낸 정부들이 승인한 무조건 항복 문서(instrument of unconditional surrender)를 사용하는 데 따를 수 있는 지연을 무릅쓰는 대신, 5월 7일의 간이 「항복문서(Act of Military Surrender)」를 독일 측에 부과했습니다.\n\n그 문서와 그 이튿날 베를린에서 서명된 유사한 문서는 우리의 승리에 부수하는 초기의 군사적 규정만을 두었습니다. 그러므로 이제, 더 나아간 규정을 두고 또 미국·영국·소련 정부와 프랑스 임시정부가 이미 합의한 바와 같이 독일에 관한 최고권한의 인수를 정식으로 선언할 포고(proclamation)를 발하는 일로 나아가는 것이 순서입니다.\n\n유럽자문위원회는 이러한 목적에 쓰일 포고문의 본문을 그 구성 정부들에 권고했습니다. 이 본문은 위원회가 준비한 무조건 항복 문서를 손질한 것으로서, 4개 정부가 이미 받아들인 정책과 표현이라는 이점을 지니고 있습니다.\n\n위원회가 제출한 대로의 본문 한 부[주47]를 첨부하며, 그것을 현재 독일을 점령하고 있는 4개국 군대의 사령관들의 서명을 얹어 포고로 발하는 데 대한 각하의 승인을 건의드립니다.\n\n조지프 C. 그루(Joseph C. Grew)", "secondary": "Washington, May 12, 1945.\n\nBecause of the desirability of immediately securing a full capitulation of the German armies the Supreme Commander of the Allied Expeditionary Force and the Soviet High Command imposed on the Germans the brief “Act of Military Surrender” of May 7 rather than risk the delay possibly involved in making use of the instrument of unconditional surrender which had been prepared by the European Advisory Commission and approved by the Governments there represented.\n\nThat Act and the similar document signed in Berlin on the day following made only the initial military provisions incident to our victory. It is now in order, therefore, to proceed with the issuance of a proclamation which will make further stipulations and which will formally announce the assumption of supreme authority with respect to Germany by the Governments of the United States, the United Kingdom and the Soviet Union and the Provisional Government of France as has been previously agreed.\n\nThe European Advisory Commission has recommended to its constituent Governments the text of a proclamation designed to serve these purposes. This text represents an adaptation of the instrument of unconditional surrender prepared by the Commission and has the advantage of policy and phraseology already accepted by the four Governments.\n\nI append a copy of the text [주47] as submitted by the Commission and recommend your approval of its being issued as a proclamation above the signatures of the commanding officers of the armed forces of the four Powers now occupying Germany.\n\nJoseph C. Grew", "notes": ["[주46] 각서 하단의 친필 배서에는 「1945년 5월 14일 승인 해리 트루먼(Approved May 14, 1945 Harry Truman)」이라고 적혀 있다.", "[주47] 인쇄하지 않음. 1945년 6월 5일 베를린에서 4개국이 서명한 선언의 본문은 국무부 『조약 및 기타 국제협정 총서(TIAS)』 제1520호 또는 60 Stat. 1649 참조."], "warn": false, "pages": [], "search": "Grew 그루(국무장관 대리) Truman 트루먼(대통령)"}, {"id": "d236", "order": 236, "date": "1945-05-12", "group": "C", "eyebrow": "d236 · Memorandum of Telephone Conversation, by the Director of the Office of European Affairs (Matthews)", "title": "유럽국장(매슈스)의 전화 대화 비망록", "badge": null, "list_right": "문서 236", "meta": [{"k": "일자", "v": "1945-05-12"}, {"k": "시각", "v": "[Washington,] May 12, 1945. (오전 통화 — “telephoned me this morning”)"}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 Control (Germany)/5–1245", "txt": true}, {"k": "발신", "v": "The Director of the Office of European Affairs (Matthews) 유럽국장 매슈스 (기록자)", "txt": true}, {"k": "수신", "v": "기록 (국무부 편철)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전화 비망록"}], "links": [{"k": "FRUS", "text": "문서 236 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d236"}], "summary": "맥클로이가 랭스와 베를린에서 서명된 항복문서가 유럽자문위원회에서 8개월간 다듬은 문서가 아니라 완전히 새 문서였다는 사실을 뒤늦게 알고 당혹과 분노를 표한 통화 기록이다.", "points": ["맥클로이는 샌프란시스코에서 돌아와[주48] 랭스와 베를린에서 서명된 항복문서가 유럽자문위원회에서 8개월에 걸쳐 공들여 교섭한 그 문서가 아니라 완전히 새로운 문서였음을 알고 당혹스럽고도 몹시 언짢다고 말했다.", "4개 정부와 합동참모본부의 정식 승인을 받은 그 문서가 그저 잊히고 무시되었다는 것이 그로서는 도무지 믿기지 않는다고 했다.", "맥클로이가 읽어 준 아이젠하워 장군의 전보에 따르면, SHAEF의 G–5(민사부) 사람들과 상의하는 대신 문제를 G–3(작전부)과 G–1(인사부), 그리고 배경을 전혀 모르는 스파츠 장군 같은 사람들의 손에 맡겼다고 되어 있었다.", "맥클로이는 베델 스미스 장군이 그 문서를 잘 알고 있었는데 어떻게 간과할 수 있었는지, 또 밥 머피가 왜 상의를 받지 않았는지 이해할 수 없다고 했다. 연합국 내부가 아니라 미국 내부의 실책이 드러나는 대목이다.", "맥클로이는 이 중대한 실수에 대해 사과하고, 유럽자문위원회에서 교섭된 정부 간 합의에 어긋날 수 있는 다른 문서의 서명이나 포고의 발표가 없도록 아이젠하워 장군에게 전보를 보내겠다고 약속했다.", "그는 또한 합의된 항복문서에 독일의 서명을 여전히 강요할 것인지, 아니면 그 조항에 기초하여 4개 정부가 발할 포고안으로 그 목적과 통제기구 설치에 충분한지를 신중히 검토해야 한다고 했다.", "매슈스는 위넌트가 유럽자문위원회에서 후자의 기초 위에 교섭 중이며, 완성된 본문이 합의되는 대로 맥클로이가 그것을 신중히 살펴보게 될 것이라고 말했다."], "primary": "[워싱턴,] 1945년 5월 12일.\n\n맥클로이(McCloy) 씨가 오늘 아침 나에게 전화를 걸어, 샌프란시스코[주48]에서 돌아와 보니 랭스(Rheims)와 베를린 [290면] 양쪽에서 서명된 항복문서가 유럽자문위원회에서 8개월에 걸쳐 그토록 세심하고 공들여 교섭한 그 문서가 아니라 완전히 새로운 문서였음을 알게 되어 몹시 당혹스럽고 또 몹시 언짢다고 말했다. 그는 4개 정부와 합동참모본부의 정식 승인을 받은 이 문서가 그저 잊히고 무시되었다는 것이 자기로서는 도무지 믿을 수 없는 일이라고 말했다. 그는 나에게 아이젠하워 장군의 전보 하나를 읽어 주었는데, 거기에는 SHAEF의 G–5[주49] 사람들과 상의하는 대신 문제를 G–3[주50]와 G–1[주51], 그리고 그 배경을 전혀 알지 못하는 스파츠(Spaatz) 장군[주52] 같은 사람들의 손에 맡겼다고 되어 있었다. 맥클로이 씨는 베델 스미스(Bedell Smith) 장군이 그 문서를 잘 알고 있었으므로 그가 어떻게 그것을 간과할 수 있었는지 여전히 이해할 수 없으며, 또 밥 머피(Bob Murphy)가 왜 상의 대상이 되지 않았는지도 이해할 수 없다고 말했다. 맥클로이 씨는 어쨌든 이 중대한 간과에 대하여 사과하고 싶다고 하면서, 유럽자문위원회에서 교섭된 정부 간 합의에 어긋날 수 있는 다른 문서가 서명되거나 포고가 발표되는 일이 없도록 하기 위하여 아이젠하워 장군에게 전보를 보내겠다고 약속했다. 그는 또한, 우리가 합의된 항복문서에 대한 독일 측의 서명을 여전히 강요해야 할 것인지, 아니면 그 조항에 기초하여 4개 정부가 발하기로 되어 있는 포고안이 그 목적과 통제기구의 설치를 위하여 충분할 것인지를 신중히 검토해 보아야 한다고 생각한다고 말했다. 나는 그에게 위넌트가 후자의 기초 위에서 유럽자문위원회에서 교섭 중이며, 완성된 본문이 합의되는 대로 그가 그것을 신중히 살펴보게 될 것이라고 말했다.", "secondary": "[Washington,] May 12, 1945.\n\nMr. McCloy telephoned me this morning and said that he was both much embarrassed and much annoyed to find on his return from San [290면] Francisco [주48] that the instrument of surrender which had been signed both at Rheims and at Berlin was a brand new document and not the one so carefully and painstakingly negotiated over a period of eight months in the European Advisory Commission. He said it was simply incredible to him that this document, which had the formal approval of the four governments and the Joint Chiefs of Staff, had been simply forgotten and ignored. He read me a telegram from General Eisenhower which indicated that instead of consulting the G–5 [주49] people at SHAEF, they had put the matter in the hands of G–3 [주50] and G–1 [주51] and people like General Spaatz [주52] who knew none of the background. Mr. McCloy said he still could not understand how General Bedell Smith could have overlooked the document because he was familiar with it, nor did he understand why Bob Murphy had not been consulted. Mr. McCloy said that in any event he wished to apologize for this serious oversight and promised to send a telegram to General Eisenhower to make sure that no other documents are signed or proclamations issued which may run counter to the governmental agreements negotiated in the European Advisory Commission. He also said that he thought we should examine carefully to see whether we should still force a German signature of the agreed surrender document or whether the proposed proclamation to be issued by the four governments based on those terms may be adequate for the purpose and for the setting up of the control machinery. I told him that Winant was negotiating in the EAC on the latter basis and that he would look into it carefully as soon as the completed text has been agreed upon.", "notes": ["[주48] 육군차관보 존 J. 맥클로이(John J. McCloy)는 샌프란시스코 국제연합 회의의 미국 대표단 고문으로 일했다. 이 회의에 관한 문헌은 제1권 1면 이하 참조.", "[주49] SHAEF의 민사부(Civil Affairs Division).", "[주50] SHAEF의 작전부(Operations Division).", "[주51] SHAEF의 인사부(Personnel Division).", "[주52] 칼 스파츠(Carl Spaatz) 장군, 미국 전략공군 사령관."], "warn": false, "pages": ["290"], "search": "McCloy 맥클로이(존 J. 맥클로이, 육군차관보) Matthews 매슈스(H. 프리먼 매슈스, 국무부 유럽국장) Eisenhower 아이젠하워 Spaatz 스파츠(칼 스파츠 장군) Bedell Smith 베델 스미스(월터 베델 스미스 장군, SHAEF 참모장) Murphy 머피(로버트 「밥」 머피, 대독일 정치고문) Winant 위넌트(주영대사)"}, {"id": "d694", "order": 694, "date": "1945-05-12", "group": "A", "eyebrow": "d694 · The United States Political Adviser for Germany (Murphy) to the Secretary of State", "title": "대독일 정치고문(머피)이 국무장관에게", "badge": null, "list_right": "문서 694", "meta": [{"k": "일자", "v": "1945-05-12"}, {"k": "시각", "v": "[Versailles ?] May 12, 1945. [Received May 22—11 a.m.]"}, {"k": "장소", "v": "Versailles [?]", "txt": true}, {"k": "전문번호", "v": "A–17"}, {"k": "원문출처", "v": "740.00119 Control (Germany)/5–1245: Airgram", "txt": true}, {"k": "발신", "v": "The United States Political Adviser for Germany (Murphy) 대독일 정치고문 머피", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 694 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d694"}], "summary": "SHAEF가 제21·12·6집단군에 내린 지시의 요지로, 지방 차원뿐 아니라 지역 차원에서도 독일인 행정기구를 신속히 재건하라는 것이다.", "points": ["SHAEF가 제21·12·6집단군에 최근 내린 지시의 요지를 국무부에 참고로 알린다. 그 지시는 지방 차원은 물론 지역 차원에서도 독일인 행정 조직을 신속히 세우도록 명한다.", "독일 군정의 진짜 목적은 연합국 군 인원이 통치 책임을 떠맡아 수행하는 것이 아니라, 나치와의 밀접한 관계로 제거된 자들을 뺀 독일인 인력과 민간기관이 통치 기능을 수행하도록 보장하는 통제를 독일 정부 위에 세우는 것이다.", "적대행위가 그친 만큼 독일의 행정 기능을 과거의 정치적 통제에서 떼어내어 재건하는 일이 더욱 긴요해졌다.", "지역 군정팀을 즉시 발족·운용하고, 지역 차원의 독일 행정기구를 재건하는 임무를 부여한다.", "지역 차원에서 수송의 효율적 이용, 식량 배급, 군의 필요와 독일 내 최소한의 필수 민수를 충당할 산업 생산 재개 같은 당면 문제를 처리하도록 독일 행정기구를 세우는 것이 특히 중요하다.", "독일 행정기구를 재건할 때 가장 유력한 점령지대 경계를 고려해야 하며, 이 행정 기능의 재건은 **연합군이 각자의 지대로 물러날 때(as the Allied Armies retire to their respective zones)** 지대 사이에 행정 책임이 분리될 수 있도록 해야 한다. 지대로의 철수가 행정 재건의 전제로 명시된다.", "책임 부대의 경계는 군 행정상 가능한 한 군정의 지역 행정 경계 및 독일 행정단위의 지역 경계에 맞추어 조정해야 한다.", "지역 간 왕래·통신을 막는 제한은 군사적 보안과 부합하는 한도까지 해제하고, 그에 따라 민정 수행 책임을 독일 행정기관에 넘기며, 군정 사무소들끼리는 지휘 계통과 무관하게 민정 문제에 관해 직접 통신할 권한을 준다.", "군에서 낼 수 있는 것보다 훨씬 많은 인력이 필요하므로, 이미 확립된 정책의 완전한 집행을 보장할 통제 아래 자격 있는 독일인 실무진을 신속히 만들어야만 독일 통치가 가능하다."], "primary": "[베르사유?] 1945년 5월 12일.\n[접수 5월 22일 오전 11시]\n\nA–17. 아래에 국무부의 참고를 위하여 SHAEF가 최근 제21집단군, 제12집단군 및 제6집단군에 내린 지시의 요지를 적는다. 이 지시들은 지방 차원뿐 아니라 지역 차원에서도 독일인 행정 조직을 신속히 수립할 것을 명하고 있다.\n\n독일에서 군정의 진정한 목적은 연합국의 군 인원으로 통치의 책임을 떠맡아 수행하는 데 있는 것이 아니라, 나치와의 긴밀한 관계 때문에 제거된 자들을 제외한 독일인 인력과 민간기관이 통치의 기능을 확실히 수행하도록 만들 통제를 독일 정부 위에 세우는 데 있다.\n\n적대행위가 그침에 따라, 그러한 기능에 대한 과거의 정치적 통제를 없애면서 독일의 행정 기능을 다시 세우는 일이 더욱 긴요해진다.\n\n이를 이루기 위하여 다음이 요망된다.\n\n1.\n\n아직 지역 군정팀이 설치되지 않은 곳에서는 그러한 팀을 즉시 발족시켜 운용하고, 지역 차원에서 독일의 행정 기구를 재건하는 임무를 부여해야 한다.\n\n2.\n\n지역 차원의 당면 문제들 — 이용 가능한 수송 수단의 효과적 활용, 식량의 배급, 그리고 군사적 필요를 충당하고 독일 내 최소한의 필수적인 민수 소요를 공급할 산업 생산의 재개를 포함한다 — 을 효과적으로 처리할 수 있도록 독일의 행정 기구를 세우는 일이 특히 중요하다.\n\n3.\n\n독일의 행정 기구를 재건할 때에는 점령지대들 사이의 가장 유력한 경계를 고려해야 하며, 이러한 행정 기능의 재건은 [941면] 연합국 군대가 각자의 지대로 물러날 때 (지대가 설정되었을 때) 각 점령지대 사이에 행정상의 책임이 분리될 수 있도록 하는 것이어야 한다.\n\n4.\n\n책임 있는 군 부대의 경계는 군의 행정상 가능한 한도까지 군정의 지역 행정 경계 및 독일 행정단위의 지역 행정 경계에 부합하도록 조정되어야 한다.\n\n5.\n\n독일의 행정단위들이 가능한 한 최대의 능률로 움직일 수 있게 하기 위하여, 지역 간의 왕래와 통신을 허용하지 않는 제한들을 군사적 보안과 부합하는 한도까지 해제하는 것이 긴요하다. 이러한 제한이 해제됨에 따라, 군정의 명령 아래, 그리고 군정이 마련할 수 있는 표본 점검 제도에 따라 민정의 기능을 수행할 책임은 독일의 행정기관들에 넘겨져야 한다.\n\n6.\n\n이것이 이루어지도록 하기 위하여, 그렇게 재건된 독일의 행정기관들에 격려를 주고 군정의 설치된 사무소들을 통하여 지역 간에 서로 통신하는 것을 허용해야 하며, 또한 이 군정 사무소들에는 그들이 어느 군 지휘관에게 소속되어 있는지와 상관없이 민정의 문제에 관하여 서로 직접 통신할 권한을 주어야 한다.\n\n7.\n\n독일을 성공적으로 통치하는 데에는 군의 원천에서 낼 수 있는 것보다 훨씬 많은 인원이 필요할 것이며, 그것은 독일의 처리에 관하여 현재 확립된 정책들의 완전한 집행을 보장할 만한 통제 아래 자격 있는 독일인 실무진을 신속히 만들어냄으로써만 이루어질 수 있다.\n\n머피(Murphy)", "secondary": "[Versailles ?] May 12, 1945.\n[Received May 22—11 a.m.]\n\nA–17. There is given here below for the Department’s information the substance of instructions recently issued by SHAEF to the 21st, 12th and 6th Army Groups. These instructions order the rapid establishment of German administrative staffs on regional as well as local levels.\n\nThe real purpose of Military Government in Germany is not to take over and carry out the responsibilities of government with Allied military personnel but to set up controls over German Government which will make sure that the functions of government will be carried out by German personnel and civil agencies, excluding those who have, because of close Nazi ties, been removed.\n\nIt becomes even more imperative, with the cessation of hostilities, to re-establish German administrative functions doing away with the past political control of such functions.\n\nTo bring this about, the following are desired:\n\n1.\n\nRegional Teams of Military Government should be activated and employed immediately where such teams have not yet been established, and given the mission to re-establish, at the regional level, the German administrative machinery.\n\n2.\n\nIt is particularly important that German administrative machinery be set up to permit the handling, in an effective way, of immediate problems at the regional level, to include effective utilization of available transport, distribution of food, and the re-establishment of industrial production to take care of military needs and to provide the minimum essential civil requirements in Germany.\n\n3.\n\nConsideration must be given, in re-establishing German administrative machinery, to the most likely boundaries between Zones of Occupation; and re-establishment of these administrative functions [941면] should permit a separation of administrative responsibility between the respective Zones of Occupation (when established) as the Allied Armies retire to their respective zones.\n\n4.\n\nBoundaries of responsible military units should, to the full extent feasible with Army administration, be adjusted to conform to the regional administrative boundaries for Military Government, and to the regional administrative boundaries of the German administrative units.\n\n5.\n\nIt is essential, in order that the German administrative units may operate with the greatest efficiency possible, that those restrictions which do not permit inter-area travel and communication be lifted to the full extent consistent with military security. As these restrictions are lifted, responsibility for carrying out the functions of civil government under the orders of Military Government and subject to such spot-check system as may be instituted by Military Government, should be exchanged to German administrative agencies.\n\n6.\n\nIn order that this may be effected, the German administrative agencies so re-established should be given encouragement, and permitted to communicate inter-regionally through the established offices of Military Government, and these latter offices should be given authorization to communicate directly with each other, regardless of the Military Commander to which they are responsible, on problems of civil government.\n\n7.\n\nFar more personnel than can be made available from military sources will be required for the successful government of Germany, and it can be carried out only through the prompt creation of qualified German staffs under such controls as will insure, for the treatment of Germany, the full execution of the presently established policies.\n\nMurphy", "notes": [], "warn": false, "pages": ["941"], "search": "Murphy 머피(대독일 정치고문)"}]</script>
<script id="conf" type="application/json">{"pages": {"dir": "../pages", "ext": "png", "label": "원본 지면", "thumbs": "../thumbs", "thumb_ext": "jpg"}, "chrono": {"from": "1941-09-01", "to": "1953-12-31", "note": "열람기 아래쪽에 늘 떠 있는 연대 바의 눈금이다. 문서 하나를 읽을 때 그것이 어느 시점의 것인지 잡아 준다. 문서철을 가리지 않고 공용으로 쓴다. note 는 사건에 마우스를 올렸을 때 뜨는 요약이다 — 두세 문장을 넘기지 마라.", "events": [{"date": "1941-11-26", "label": "헐 노트", "key": true, "where": "워싱턴 국무부", "note": "미국이 협정 기초안의 개요를 일본에 건넸다. 문서 머리에는 「극비, 잠정적이며 구속력 없음」이라 적혀 있고 최후통첩이라는 말은 없다. 그러나 구루스는 그 자리에서 사실상 끝을 뜻하는 것으로 해석될 수 있다고 말했다."}, {"date": "1941-12-07", "label": "진주만 공습", "key": true, "where": "오아후", "note": "하와이 시각 오전 7시 48분 공습이 시작됐다. 워싱턴 시각으로 오후 1시 20분이다. 그 한 시간 뒤인 오후 2시 20분, 노무라와 구루스가 14부 각서를 들고 국무부에 들어왔다. 각서에 선전포고 문언은 없었다."}, {"date": "1941-12-08", "label": "대일 선전포고", "where": "워싱턴 의회", "note": "루스벨트가 의회에서 12월 7일 이래 전쟁 상태가 존재함을 선언해 줄 것을 요청했고, 합동결의가 그날 채택됐다."}, {"date": "1943-11-27", "label": "카이로 선언", "key": true, "where": "카이로", "note": "미·영·중 3국 수뇌가 대일 전후 처리를 합의해 발표했다. 조선에 관한 대목은 「적당한 시기에(in due course) 자유롭고 독립된 나라가 되게 한다」였다. 이 묶음이 좇는 문구가 여기서 태어난다."}, {"date": "1943-11-28", "label": "테헤란 회담", "where": "테헤란", "note": "루스벨트·처칠·스탈린의 첫 3자 회담. 유럽 제2전선(노르망디)의 시기가 정해졌고, 스탈린은 독일 항복 뒤 대일전 참전을 처음으로 시사했다."}, {"date": "1944-06-06", "label": "노르망디 상륙", "note": "연합군이 프랑스 북부에 상륙해 서부 제2전선이 열렸다. 유럽 전쟁의 승패가 사실상 이때 갈렸고, 미국 안에서 「그다음은 일본」이라는 계산이 본격화된다."}, {"date": "1944-07-25", "label": "항복문서 완성", "key": true, "where": "런던 유럽자문위원회", "note": "유럽자문위원회가 「독일의 무조건 항복」 본문을 확정했다. 독일이 항복하기 아홉 달 전이고, 파리가 해방되기 한 달 전이다. 이 뒤의 넉 달은 새로 쓰는 것이 아니라 손질하는 기간이며, 정작 1945년 5월 7일 랭스에서는 지연을 우려해 이 문서 대신 간이 「항복문서」를 쓴다."}, {"date": "1944-10-20", "label": "레이테 상륙", "where": "필리핀", "note": "맥아더가 필리핀 탈환에 착수했다. 뒤이은 레이테만 해전에서 일본 연합함대가 무너져, 일본 본토와 남방 자원지대를 잇는 해상 수송로가 끊긴다."}, {"date": "1945-02-04", "label": "얄타 회담", "key": true, "where": "크림반도 얄타", "note": "루스벨트·처칠·스탈린의 두 번째 3자 회담. 소련의 대일 참전 조건이 비밀협정으로 정해졌고, 루스벨트가 스탈린에게 조선의 신탁통치를 꺼내며 「20년에서 30년」이라 말했다. 카이로의 「적당한 시기」에 처음으로 숫자가 붙은 자리다."}, {"date": "1945-03-10", "label": "도쿄 대공습", "note": "B-29 편대의 야간 소이탄 공습으로 도쿄 시가지가 불탔다. 하룻밤 사망자가 10만 명 안팎으로 추정된다. 일본 안에서 본토 방위가 불가능하다는 인식이 퍼지기 시작한다."}, {"date": "1945-04-01", "label": "오키나와 전투", "note": "미군이 오키나와에 상륙해 6월까지 싸웠다. 사상자 규모가 본토 상륙전의 비용을 가늠하는 근거가 되어, 원폭 사용과 소련 참전 요청 양쪽의 논거로 쓰인다."}, {"date": "1945-04-12", "label": "루스벨트 사망", "note": "루스벨트가 급서하고 트루먼이 승계했다. 트루먼은 얄타의 비밀협정도 원폭 개발도 취임 뒤에야 통보받았다. 조선 신탁통치 구상을 밀던 사람이 사라진 자리다."}, {"date": "1945-04-25", "label": "힘러의 항복 제의", "key": true, "where": "뤼베크 · 스톡홀름", "note": "힘러가 4월 24일 새벽 뤼베크에서 베르나도테 백작을 만나, 서부전선만 아이젠하워에게 항복하겠다며 스웨덴 정부에 전달을 부탁했다. 히틀러가 뇌출혈로 이미 죽었거나 이틀을 넘기지 못한다는 말도 함께 전해진다. 트루먼과 처칠은 전화로 3국 동시 무조건항복 외에는 없다고 못 박는다."}, {"date": "1945-04-30", "label": "히틀러 자살", "where": "베를린 총통관저", "note": "베를린 지하에서 히틀러가 자살하고 되니츠가 승계한다. 되니츠는 전쟁을 계속하겠다고 말했고, 연합국은 히틀러가 순교자로 남는 전설이 만들어지지 않도록 5월 2일 성명을 낸다."}, {"date": "1945-05-02", "label": "베를린 함락", "note": "소련군이 베를린을 함락했다. 이틀 전 히틀러가 자살했고 남은 것은 항복 절차뿐이었다. 미국 문서에 히틀러의 죽음은 부고가 아니라 「항복문서에 서명할 능력이 있는 중앙 권력이 없을 경우」라는 가정으로 나타난다.", "where": "베를린"}, {"date": "1945-05-08", "label": "독일 항복", "key": true, "note": "5월 7일 새벽 2시 41분 랭스에서 서명이 끝났으나, 발표는 8일까지 묶여 있었다. 스탈린은 동부전선에서 항복 명령이 이행될지 확실치 않다며 소련의 발표를 9일로 미뤘고, 8일 밤 베를린에서 다시 서명한다. 그날 서명한 것은 유럽자문위원회가 여덟 달 다듬어 온 항복문서가 아니라 초기 군사 조항만 담은 간이 문서였다.", "where": "랭스 · 베를린"}, {"date": "1945-07-17", "label": "포츠담 회담", "where": "베를린 근교 포츠담", "note": "트루먼·처칠(뒤에 애틀리)·스탈린의 회담. 회담 중 원폭 실험 성공이 보고되고, 대일 최후통첩의 문안이 다듬어진다."}, {"date": "1945-07-26", "label": "포츠담 선언", "note": "미·영·중 명의로 일본에 무조건 항복을 요구했다. 제8항에 「카이로 선언의 조항은 이행되어야 한다」고 못박아, 조선 독립 약속이 항복 조건 안으로 들어온다. 일본은 이를 묵살(黙殺)한다고 발표했다."}, {"date": "1945-08-06", "label": "히로시마", "key": true, "note": "히로시마에 원자폭탄이 투하됐다. 트루먼은 같은 날 성명을 내 「이제껏 없던 폭탄」임을 알리고 항복하지 않으면 파멸이 이어질 것이라 경고했다."}, {"date": "1945-08-08", "label": "소련 참전", "note": "소련이 일본에 선전포고하고 이튿날 만주로 진공했다. 얄타에서 약속한 「독일 항복 뒤 3개월」을 지킨 날짜다. 미국이 조선에 지상군을 두려면 시간이 없다는 것이 이날 분명해진다."}, {"date": "1945-08-09", "label": "나가사키", "note": "나가사키에 두 번째 원자폭탄이 투하됐다. 같은 날 밤 어전회의가 열려 국체 유지를 조건으로 한 항복 제의가 정해진다."}, {"date": "1945-08-11", "label": "38선 획정", "key": true, "note": "일반명령 제1호(SWNCC 21/5)가 고쳐지면서 조선이 북위 38도로 갈렸다. 한 문서의 b항과 f항, 다섯 조항 사이에 조선이 둘로 나뉘어 적혔다. 합참이 든 이유는 미군에게 경성의 항만과 교통 지역을 주기 위해서였다."}, {"date": "1945-08-15", "label": "일본 항복", "key": true, "note": "일본이 포츠담 선언 수락을 방송으로 알렸다. 전날 밤 일부 장교들이 방송을 막으려 궁성을 봉쇄하고 총리 관저를 습격했으나 실패했고, 아나미 육군대신은 새벽에 자결했다."}, {"date": "1945-09-02", "label": "항복문서 조인", "where": "도쿄만 미주리함", "note": "도쿄만의 미주리함 위에서 항복문서에 서명했다. 이 문서로 연합국최고사령관(SCAP)의 권한이 발효되고, 일반명령 제1호가 법적 효력을 갖는다."}, {"date": "1945-09-08", "label": "미군 인천 상륙", "key": true, "note": "하지 중장의 제24군단이 인천에 상륙해 이튿날 조선총독부의 항복을 받았다. 미군정이 시작된다. 닷새 뒤 하지는 카이로의 「in due course」가 조선어로 「수일 내」로 옮겨져 퍼져 있었다는 것을 알게 된다."}, {"date": "1945-12-27", "label": "모스크바 3상회의", "key": true, "note": "미·영·소 외상이 조선에 최대 5년의 신탁통치를 두고 미소공동위원회를 설치하기로 합의했다. 카이로의 「적당한 시기」가 마침내 문서상의 기한이 된 자리이자, 조선 안에서 신탁통치 반대 운동이 폭발한 계기다."}, {"date": "1946-03-20", "label": "1차 미소공동위", "where": "서울", "note": "임시정부 수립을 협의할 미소공동위원회가 열렸다. 어느 정당·사회단체와 협의할 것인가를 두고 갈라져 5월에 결렬된다."}, {"date": "1946-10-01", "label": "대구 10월 사건", "note": "식량 공출과 경찰에 대한 항의가 대구에서 시작해 남한 전역으로 번졌다. 미군정이 계엄을 선포하고 진압했다. 점령 1년 만에 통치의 정당성이 시험대에 오른 사건이다."}, {"date": "1947-05-21", "label": "2차 미소공동위", "where": "서울", "note": "미소공동위원회가 다시 열렸으나 같은 쟁점에서 다시 갈라져 10월에 사실상 끝난다. 미국은 이 무렵부터 조선 문제를 유엔으로 넘기는 쪽으로 방향을 바꾼다."}, {"date": "1947-09-17", "label": "한국 문제 유엔 이관", "key": true, "note": "미국이 조선 문제를 유엔 총회에 상정했다. 4개국 신탁통치라는 전시 구상이 공식적으로 폐기되고, 처리의 무대가 미소 양자에서 유엔으로 옮겨간다."}, {"date": "1948-01-08", "label": "유엔한국임시위원단 입국", "note": "유엔한국임시위원단(UNTCOK)이 서울에 들어왔다. 소련이 북위 38도 이북 입경을 거부해, 감시할 수 있는 지역에서만 선거를 치른다는 결론으로 이어진다."}, {"date": "1948-05-10", "label": "5·10 총선거", "key": true, "note": "남한만의 제헌국회 선거가 치러졌다. 좌익과 김구·김규식 계열이 불참했다. 분단이 절차를 갖춘 사실이 되는 날이다."}, {"date": "1948-08-15", "label": "대한민국 정부 수립", "key": true, "note": "대한민국 정부가 수립되고 미군정이 끝났다. 카이로에서 「in due course」라고 적힌 지 4년 9개월 뒤다. 북에서는 9월 9일 조선민주주의인민공화국이 수립된다."}, {"date": "1948-12-12", "label": "유엔총회 결의 195(III)", "where": "파리 유엔총회", "note": "유엔 총회가 대한민국 정부를 위원단이 감시할 수 있었던 지역의 합법 정부로 승인했다. 「조선 전역의 유일 합법 정부」라는 뒷날의 표현과 결의문의 문언은 같지 않다."}, {"date": "1949-06-26", "label": "김구 피살", "key": true, "where": "서울 경교장", "note": "한국독립당 위원장 김구가 육군 소위 안두희의 총에 죽었다. 무초는 이튿날 「공식·비공식 여러 경로에서 지금까지 모은 바」로 시작하는 전문을 올린다 — 전날 첫 전문에는 아무 세부사항이 없었다."}, {"date": "1949-06-29", "label": "주한미군 철수 완료", "key": true, "where": "서울", "note": "전투부대 철수가 끝나고 군사고문단(KMAG) 약 500명만 남았다. 철수 날짜를 이승만과 매듭짓는 일이 1949년 전반기 대사관 전문의 주된 내용이었다."}, {"date": "1949-10-01", "label": "중화인민공화국 수립", "where": "베이징", "note": "국공내전이 사실상 끝났다. 무초는 다섯 달 전 이승만에게 중국의 결과가 조선에 당장 자국을 남기지는 않으리라고 말했었다."}, {"date": "1950-01-12", "label": "애치슨 연설", "key": true, "where": "워싱턴 내셔널프레스클럽", "note": "애치슨이 미국의 태평양 방위선을 알류샨–일본–류큐–필리핀으로 그었다. 조선은 그 선 안에 들지 않았다. 이승만이 아홉 달 전 무초에게 우려한 바로 그 이야기다."}, {"date": "1950-06-25", "label": "한국전쟁 발발", "key": true, "where": "38선 전역", "note": "북한군이 38선 전역에서 남침했다. 유엔 안전보장이사회는 같은 날 결의 82호로 적대행위 중지와 38선 이북으로의 철수를 요구했다."}, {"date": "1950-06-27", "label": "안보리 결의 83호", "key": true, "where": "뉴욕 유엔 안보리", "note": "안보리가 회원국에 대한민국을 돕는 데 필요한 지원을 권고했다. 소련 대표는 중국 대표권 문제로 회의를 비우고 있어 거부권이 행사되지 않았다."}, {"date": "1950-09-15", "label": "인천 상륙", "key": true, "where": "인천", "note": "미 제10군단이 인천에 상륙했다. 9월 28일 서울을 되찾고, 10월 1일 국군이 38선을 넘는다."}, {"date": "1950-10-19", "label": "중공군 압록강 도하", "key": true, "where": "압록강", "note": "중국인민지원군이 압록강을 건너기 시작했다. 10월 25일 첫 공세가 시작되고, 전쟁의 성격이 바뀐다."}, {"date": "1951-04-11", "label": "맥아더 해임", "key": true, "where": "워싱턴", "note": "트루먼이 맥아더를 유엔군사령관·극동군사령관에서 해임했다. 전쟁을 중국으로 넓힐 것인가를 두고 갈린 끝이다."}, {"date": "1951-07-10", "label": "정전회담 개시", "key": true, "where": "개성", "note": "개성에서 정전회담이 시작됐다. 회담장은 10월에 판문점으로 옮겨지고, 조인까지 다시 두 해가 걸린다."}, {"date": "1953-06-18", "label": "반공포로 석방", "where": "부산·논산 등 포로수용소", "note": "이승만이 유엔군에 알리지 않고 반공포로 약 2만 5천 명을 풀어 주었다. 포로 송환 문제는 정전회담이 가장 오래 붙들려 있던 대목이다."}, {"date": "1953-07-27", "label": "정전협정 조인", "key": true, "where": "판문점", "note": "정전협정이 조인됐다. 대한민국은 서명하지 않았다. 평화조약이 아니라 군사적 정전이며, 그 상태가 지금까지 이어진다."}, {"date": "1953-10-01", "label": "한미상호방위조약 조인", "key": true, "where": "워싱턴", "note": "한미상호방위조약이 조인됐다(발효는 이듬해 11월 17일). 1949년 6월 철수로 비었던 자리를 조약이 대신한다."}]}, "terms": {"_": [{"w": "W. Walton Butterworth, Jr.", "k": "_:26", "href": null}, {"w": "Archibald J. K. Clark Kerr", "k": "_:83", "href": null}, {"w": "Edward R. Stettinius, Jr.", "k": "_:19", "href": null}, {"w": "Sir Archibald Clark Kerr", "k": "_:83", "href": null}, {"w": "Fedor Tarasovich Gousev", "k": "_:32", "href": null}, {"w": "William H. Draper, Jr.", "k": "_:56", "href": null}, {"w": "H. Merrell Benninghoff", "k": "_:100", "href": null}, {"w": "E. Allan Lightner, Jr.", "k": "_:133", "href": null}, {"w": "Lord Louis Mountbatten", "k": "_:137", "href": null}, {"w": "Franklin D. Roosevelt", "k": "_:5", "href": null}, {"w": "W. Walton Butterworth", "k": "_:26", "href": null}, {"w": "Vyacheslav M. Molotov", "k": "_:51", "href": null}, {"w": "James W. Riddleberger", "k": "_:109", "href": null}, {"w": "Henry Morgenthau, Jr.", "k": "_:142", "href": null}, {"w": "Dwight D. Eisenhower", "k": "_:14", "href": null}, {"w": "Joseph W. Ballantine", "k": "_:15", "href": null}, {"w": "Winston S. Churchill", "k": "_:18", "href": null}, {"w": "Everett F. Drumright", "k": "_:34", "href": null}, {"w": "George Atcheson, Jr.", "k": "_:49", "href": null}, {"w": "Archibald Clark Kerr", "k": "_:83", "href": null}, {"w": "John Gilbert Winant", "k": "_:2", "href": null}, {"w": "W. Averell Harriman", "k": "_:25", "href": null}, {"w": "H. Freeman Matthews", "k": "_:29", "href": null}, {"w": "Walter Bedell Smith", "k": "_:53", "href": null}, {"w": "Charles E. Saltzman", "k": "_:58", "href": null}, {"w": "Andrey Y. Vyshinski", "k": "_:85", "href": null}, {"w": "Herschel V. Johnson", "k": "_:91", "href": null}, {"w": "Albert C. Wedemeyer", "k": "_:93", "href": null}, {"w": "George S. Patterson", "k": "_:118", "href": null}, {"w": "John Carter Vincent", "k": "_:129", "href": null}, {"w": "Charles W. McCarthy", "k": "_:131", "href
