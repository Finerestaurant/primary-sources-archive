 the appointment by such Governments of military missions (which may include civilian members) to the Control Council. These missions will have access through the appropriate channels to the organs of control.\n\n6. United Nations organisations will, if admitted by the Control Council to operate in Germany, be subordinate to the Allied control machinery and answerable to it.\n\n7. The administration of the “Greater Berlin” area will be directed by an Inter-Allied Governing Authority, which will operate under the general direction of the Control Council, and will consist of four Commandants, each of whom will serve in rotation as Chief Commandant. They will be assisted by a technical staff which will supervise and control the activities of the local German organs.\n\n8. The arrangements outlined above will operate during the period of occupation immediately following German surrender, when Germany is carrying out the basic requirements of unconditional surrender. Arrangements for the subsequent period will be the subject of a separate agreement.\n\nLondon , 4 May, 1945.\n\n[266면]", "notes": ["[주5] 사본은 주영대사가 5월 7일자 공문 제22932호로 국무부에 송부하였다. 5월 14일 접수.", "[주5a] 이 문서 전체에서 대괄호는 원문에 있는 것이다.", "[주6] 둘 다 인쇄하지 않음.", "[주7] 1945년 5월 4일에 열린 연합국협의위원회 회의에서 채택되었다.", "[주7] 1945년 5월 4일에 열린 연합국협의위원회 회의에서 채택되었다."], "warn": false, "pages": ["263", "264", "265", "266"], "search": "E. P. Donaldson 도널드슨 — EAC 사무총장 G. F. Saksin 샥신 — 연합국협의위원회 소련 대표, 이 회의 의장 Viscount Hood 후드 자작 — 영국 대표 Count de Leusse 드 뢰스 백작 — 프랑스 대표 Brigadier F. G. French 프렌치 준장 Brigadier-General V. Meyer 마이어 준장 Philip E. Mosely 모즐리 — 미국 대표 T. A. Marchenko 마르첸코 — 사무국 E. A. Paton-Smith 페이턴스미스 — 사무국"}, {"id": "d215", "order": 215, "date": "1945-05-05", "group": "A", "eyebrow": "d215 · The Acting Secretary of State to the Ambassador in France (Caffery)", "title": "국무장관 대리가 주프랑스대사(캐퍼리)에게", "badge": null, "list_right": "문서 215", "meta": [{"k": "일자", "v": "1945-05-05"}, {"k": "시각", "v": "Washington, May 5, 1945—10 a.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "1869"}, {"k": "원문출처", "v": "740.00119 Control (Germany)/5–545: Telegram", "txt": true}, {"k": "발신", "v": "그루(Joseph C. Grew) — 국무장관 대리(The Acting Secretary of State)", "txt": true}, {"k": "수신", "v": "캐퍼리(Jefferson Caffery) — 주프랑스대사(The Ambassador in France)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 215 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d215"}], "summary": "합동참모본부가 아이젠하워의 프랑스 점령지대 획정안에 동의하였음을 알리고, 카를스루에를 포함시키도록 조정한 뒤 프랑스 당국에 비공식으로 통보하라고 지시한다.", "points": ["합동참모본부는 코블렌츠 교두보와 린다우 군(Kreis)을 포함하는 아이젠하워 장군의 프랑스 점령지대 획정안에 동의한다고 알려 왔다.", "국무부는 카를스루에를 포함시키는 것이 매우 중요하다고 보며, 아이젠하워가 그렇게 하는 데 동의한다면 육군성은 카를스루에를 프랑스 지대에 넣는 것을 받아들일 준비가 되어 있다.", "캐퍼리는 이 점에 관하여 만족스러운 조정을 이루도록 노력하고, 그 다음 이 결정을 미국 정부가 자기 점령지대의 그 부분을 프랑스에 넘기는 데 동의한 것으로서 적절한 프랑스 당국에 비공식으로 전달하여도 좋다.", "위넌트는 캐퍼리로부터 소식을 듣는 대로 협정 의정서를 준비하도록 훈령을 받고 있다."], "primary": "워싱턴, 1945년 5월 5일—오전 10시.\n\n1869. 합동참모본부(Joint Chiefs of Staff)는 코블렌츠(Coblentz)의 교두보와 린다우(Lindau) 군(Kreis)을 포함하게 될 아이젠하워 장군의 독일 내 프랑스 점령지대 획정안에 동의한다고 우리에게 알려 왔습니다. 우리는 카를스루에(Karlsruhe)를 포함시키는 것이 매우 중요하다고 여기며, 아이젠하워 장군이 그렇게 하여야 한다는 데 동의한다면 육군성은 카를스루에를 프랑스 지대에 포함시키는 것을 받아들일 준비가 되어 있습니다. 이 점에 관하여 만족스러운 조정에 이르도록 노력하여 주기 바랍니다. 그런 뒤에 귀하는 이 결정을, 우리 정부가 자기 점령지대의 그 부분을 프랑스에 넘기는 데 동의한 것으로서, 적절한 프랑스 당국에 비공식으로 알려도 좋습니다. 위넌트에게는 귀하로부터 소식을 듣는 대로 협정 의정서를 준비하도록 훈령이 내려지고 있습니다.\n\n그루(Grew)", "secondary": "Washington, May 5, 1945—10 a.m.\n\n1869. The Joint Chiefs of Staff have informed us that they agree with General Eisenhower’s proposed delineation of the French zone of occupation in Germany, which would include the bridgehead at Coblentz and the Kreis of Lindau. We feel that it is most important to include Karlsruhe and the War Department is prepared to accept inclusion of Karlsruhe in the French zone if General Eisenhower agrees that this should be done. Please endeavor to reach a satisfactory adjustment of this point. You may then communicate this decision informally to the appropriate French authorities as representing this government’s agreement to cede that portion of its zone of occupation to the French. Winant is being instructed to prepare the protocol of agreement as soon as he hears from you.\n\nGrew", "notes": [], "warn": false, "pages": [], "search": "Joseph C. Grew 그루 — 국무장관 대리 Jefferson Caffery 캐퍼리 — 주프랑스대사 Dwight D. Eisenhower 아이젠하워 John G. Winant 위넌트 — 주영대사"}, {"id": "d216", "order": 216, "date": "1945-05-05", "group": "A", "eyebrow": "d216 · The Acting Secretary of State to the Ambassador in the United Kingdom (Winant)", "title": "국무장관 대리가 주영대사(위넌트)에게", "badge": null, "list_right": "문서 216", "meta": [{"k": "일자", "v": "1945-05-05"}, {"k": "시각", "v": "Washington, May 5, 1945—7 p.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "3546"}, {"k": "원문출처", "v": "740.00119 Control (Germany)/5–545: Telegram", "txt": true}, {"k": "발신", "v": "그루(Joseph C. Grew) — 국무장관 대리(The Acting Secretary of State)", "txt": true}, {"k": "수신", "v": "위넌트(John G. Winant) — 주영대사(The Ambassador in the United Kingdom)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 216 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d216"}], "summary": "합동참모본부가 미국 지대에서 프랑스 지대로 넘길 구역의 범위에 관한 견해를 바꾸어 아이젠하워의 5월 3일 획정안을 승인하였음을 알리고, 캐퍼리의 통보를 받는 대로 프랑스 측과 의정서를 교섭하라고 지시한다.", "points": ["합동참모본부는 미국 점령지대에서 프랑스 점령지대로 넘길 구역의 범위에 관한 견해를 바꾸었으며, 이제 아이젠하워 장군이 5월 3일에 제안한 획정을 승인한다.", "캐퍼리는 아이젠하워 장군과 몇몇 구역을 명확히 한 뒤 이 새 제안을 프랑스 정부에 비공식으로 전달하도록 훈령을 받았다.", "위넌트는 캐퍼리로부터 소식을 듣는 대로 프랑스 측 동료와 의정서를 교섭하되, (1) 캐퍼리가 설명할 구역과 (2) 4월 27일자 합동참모본부 각서에 표명된 견해에 근거하여야 한다.", "다만 그 각서의 제7항 b (3)의 마지막 두 문장과 제8항에 담긴 진술은 이제 대체되었으므로 제외한다."], "primary": "워싱턴, 1945년 5월 5일—오후 7시.\n\n3546. 4월 28일 오후 3시자 국무부 전보 제3332호에 관하여. 합동참모본부는 미합중국 점령지대에서 독일 내 프랑스 점령지대로 넘길 구역의 범위에 관한 견해를 바꾸었으며, 이제 아이젠하워 장군이 5월 3일에 제안한 획정[주22] 을 승인합니다.\n\n캐퍼리에게는 아이젠하워 장군과 몇몇 구역을 명확히 한 다음 이 새 제안을 프랑스 정부에 비공식으로 전달하도록 훈령이 내려졌습니다.\n\n캐퍼리로부터 소식을 듣는 대로, 귀하가 프랑스 측 동료와 다음 두 가지에 근거하여 의정서를 교섭하기를 바랍니다. (1) [276면] 캐퍼리가 귀하에게 설명할 구역, 그리고 (2) 4월 27일자 합동참모본부 각서[주23] 에 표명되어 4월 30일자 국무부 항공우편 훈령 제5389호[주24] 로 귀하에게 보낸 견해. 다만 제7항 b (3)의 마지막 두 문장과 제8항에 담긴 진술은 이제 대체되었으므로 제외합니다.\n\n그루(Grew)", "secondary": "Washington, May 5, 1945—7 p.m.\n\n3546. Department’s 3332, April 28, 3 p.m. The Joint Chiefs of Staff have altered their views as to the extent of the area to be transferred from the United States to the French zone of occupation in Germany and now approve a delineation proposed by General Eisenhower on May 3 [주22]\n\nCaffery has been instructed to clarify certain areas with General Eisenhower and then informally to communicate this new proposal to the French Government.\n\nAs soon as you hear from Caffery it is desired that you negotiate with your French colleague a protocol based on (1) the area to be [276면] described to you by Caffery and (2) the views expressed in memorandum of the Joint Chiefs of Staff dated April 27 [주23] and sent to you in Department’s air mail instruction 5389, April 30, [주24] except for statements contained in the last two sentences of paragraph 7b (3) and paragraph 8 which have now been superseded.\n\nGrew", "notes": ["[주22] 아이젠하워 장군이 합동참모본부에 보낸 전문, 261면 참조.", "[주23] 각주 86, 249면 참조.", "[주24] 인쇄하지 않음."], "warn": false, "pages": ["276"], "search": "Joseph C. Grew 그루 — 국무장관 대리 John G. Winant 위넌트 — 주영대사 Jefferson Caffery 캐퍼리 — 주프랑스대사 Dwight D. Eisenhower 아이젠하워"}, {"id": "d217", "order": 217, "date": "1945-05-05", "group": "A", "eyebrow": "d217 · The Ambassador in the United Kingdom (Winant) to the Secretary of State", "title": "주영대사(위넌트)가 국무장관에게", "badge": null, "list_right": "문서 217", "meta": [{"k": "일자", "v": "1945-05-05"}, {"k": "시각", "v": "London, May 5, 1945—8 p.m. [Received May 5—3:55 p.m.]"}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "4580 (Special German Series 7)"}, {"k": "원문출처", "v": "740.00119 EAC/5–545: Telegram", "txt": true}, {"k": "발신", "v": "위넌트(John G. Winant) — 주영대사(The Ambassador in the United Kingdom)", "txt": true}, {"k": "수신", "v": "국무장관(The Secretary of State) — 국무장관 대리와 매슈스 씨 앞", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 217 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d217"}], "summary": "처칠이 EAC 회의 도중 스트랭을 불러 항복문서와 항복 선언문을 논의하였음을 알리고, 항복문서 제12조 A항에 들어간 낱말 하나를 프랑스에 통보할 것인가에 대한 구세프의 개인적 견해를 전한다.", "points": ["「신속한 조치에 감사한다」는 인사로 시작한다. 랭스 서명 이틀 전 문안 조정이 시간 단위로 오갔음을 보여 준다.", "수상(처칠)이 위넌트 일행이 오늘 오후 유럽자문위원회 회의에 있는 동안 스트랭을 불러들여 항복문서(surrender instrument)와 항복 선언문(surrender declaration)을 논의하였다.", "위넌트는 그 전에 구세프를 만났고, 구세프는 위넌트가 어젯밤 전화 통화에서 제기한 문제에 관하여 자국 정부에 타전하였다.", "구세프는 개인적으로는 항복문서 제12조 A항에 추가된 낱말을 프랑스 측에 통보하여야 한다고 느끼는 한편, 선언문 초안 전문(前文)의 표현 때문에 그 문서에서는 그 추가된 낱말을 빼도 된다는 위넌트의 견해에 개인적으로 동의한다고 말하였다."], "primary": "런던, 1945년 5월 5일—오후 8시.\n [5월 5일—오후 3시 55분 접수.]\n\n4580. 국무장관 대리와 매슈스(Matthews) 씨 앞. 특별 독일 시리즈 제7호(Special German Series 7). 신속한 조치에 감사드립니다. 오늘 오후 우리가 유럽자문위원회 회의에 있는 동안, 수상(the Prime Minister)이 항복문서(the surrender instrument)와 항복 선언문(the surrender declaration)을 논의하고자 윌리엄 스트랭 경(Sir William Strang)을 불러들였습니다.\n\n나는 그에 앞서 구세프(Gousev)를 만났고, 그는 내가 어젯밤 전화 통화에서 제기한 문제와 관련하여 자국 정부에 타전하였습니다. 구세프는 나에게, 개인적으로는 프랑스 측에 항복문서 제12조 A항(article 12 A of the instrument)에 추가된 낱말을 통보하여야 한다고 느끼며, 다른 한편으로는 선언문 초안 전문(前文)의 표현 때문에 그 문서에서는 그 추가된 낱말을 빼도 된다는 나의 견해에 개인적으로 동의한다고 말하였습니다.\n\n위넌트(Winant)", "secondary": "London, May 5, 1945—8 p.m. \n [Received May 5—3:55 p.m.]\n\n4580. For the Acting Secretary and Mr. Matthews. Special German Series 7. Thanks for prompt action. The Prime Minister sent for Sir William Strang while we were at the European Advisory Commission meeting this afternoon, to discuss the surrender instrument and the surrender declaration.\n\nI had previously seen Gousev and he has wired his Government in relation to the question that I brought up in my telephone conversation last night. Gousev told me that personally he felt that the French should be notified of the additional word in article 12 A of the instrument, while on the other hand he personally agreed with me that because of the wording of the preamble to the draft declaration the additional word could be omitted in that latter document.\n\nWinant", "notes": [], "warn": false, "pages": [], "search": "John G. Winant 위넌트 — 주영대사 Joseph C. Grew 그루 — 국무장관 대리 H. Freeman Matthews 매슈스 Winston Churchill 처칠 — 영국 수상 Sir William Strang 스트랭 — EAC 영국 대표 Fedor T. Gousev 구세프 — EAC 소련 대표(주영 소련대사)"}, {"id": "d218", "order": 218, "date": "1945-05-05", "group": "B", "eyebrow": "d218 · Memorandum by the Acting Secretary of State to President Truman", "title": "국무장관 대리가 트루먼 대통령에게 보내는 각서", "badge": null, "list_right": "문서 218", "meta": [{"k": "일자", "v": "1945-05-05"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 EAC/5–145", "txt": true}, {"k": "발신", "v": "그루(Joseph C. Grew) — 국무장관 대리(The Acting Secretary of State)", "txt": true}, {"k": "수신", "v": "트루먼 대통령(President Truman)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 218 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d218"}], "summary": "항복문서에서 캐나다가 받는 인정이 부족하다는 캐나다의 항의를 배경으로, 대통령 명의로 매켄지 킹 수상에게 축전을 보낼 것을 건의하고 그 초안을 제시한다.", "points": ["캐나다 정부는 여러 달 동안 독일 항복문서와 그에 근거한 선언문들에서 캐나다에 주어지는 인정이 부족하다고 항의해 왔다.", "캐나다의 요구에 대한 반대의 책임은 대체로 미국 정부에 돌아가고 있으나, 미국의 입장은 「유럽자문위원회의 네 강국이 캐나다와 다른 참전 연합국들과 협의할 필요 없이 결정을 실행할 수 있어야 한다」는 건전하고 실제적인 고려에 근거한 것이다.", "캐나다는 5개 사단의 고도로 기계화된 육군, 항공승무원 수로 사실상 영국 공군의 절반에 이르는 공군, 대서양 호송 임무의 큰 몫을 감당한 해군으로 군사적 승리에 기여하였다.", "고 루스벨트 대통령과 매켄지 킹 수상의 긴밀한 관계에 비추어, 초안 전문(電文)을 대통령 명의로 보낼 것을 건의하며 발송 여부를 알려 달라고 한다.", "전문 초안은 네덜란드·덴마크·북부 독일 주둔 독일군의 항복(capitulation)으로 유럽에서 캐나다 육군의 전투가 최종 승리로 끝났음을 축하하는 내용이다.", "첨부된 쪽지에 따르면 5월 7일 대통령이 이 전문을 승인하였고, 트루먼의 5월 7일자 전문과 매켄지 킹의 5월 8일자 회답은 5월 10일에 언론에 공개되었다."], "primary": "워싱턴, [1945년 5월 5일].\n\n캐나다 정부는 몇 달 동안, 독일 항복문서(the surrender instrument for Germany)와 그에 근거한 선언문들에서 캐나다에 주어질 인정이 부족하다고 여겨 이에 항의하여 왔습니다. 이 캐나다 측 요구에 대한 반대의 책임은 대체로 우리 정부에 돌려지고 있습니다. 그러나 우리 입장은, 유럽자문위원회의 네 강국이 캐나다와 그 밖의 참전 연합국들과 협의할 필요 없이 결정을 실행할 수 있어야 한다는 건전하고 실제적인 고려에 근거한 것입니다.\n\n캐나다는 5개 사단의 고도로 기계화된 육군, 항공승무원 수에서 사실상 EAF[주25] 의 절반에 이르는 [277면] 공군, 그리고 대서양 호송 임무의 큰 몫을 감당해 온 해군으로 이 군사적 승리에 기여하였습니다.\n\n이 문제에 관한 캐나다의 민감함과 캐나다 군대의 성공에 대한 캐나다인들의 크나큰 자부심에 비추어, 다음 전문이 시의적절하리라고 생각됩니다. 고 루스벨트 대통령과 매켄지 킹 수상의 긴밀한 관계에 비추어, 아래에 인용한 전문 초안을 각하의 명의로 하는 것이 좋겠다고 건의합니다. 이 전문을 보내기를 바라시는지 알려 주시겠습니까?[주26]\n\n(오타와, 애서턴 대사 앞.)\n\n대통령으로부터의 다음 전문을 즉시 수상에게 전달하도록 요청하기 바랍니다:\n\n네덜란드·덴마크 및 북부 독일 주둔 독일군의 항복(capitulation)으로써, 유럽에서 캐나다 육군이 벌인 전투들은 최종 승리로 끝났습니다. 캐나다 군대의 감동적인 성취에 대한 나의 가장 따뜻한 축하를 받아 주시기 바라며, 독일의 군사적 패배에 우리 캐나다 전우들이 이룬 뚜렷한 기여에 경의를 표하고자 하는 나의 뜻을 미국 국민이 함께 나누고 있음을 믿어 주시기 바랍니다.\n\n조지프 C. 그루(Joseph C. Grew)", "secondary": "Washington, [May 5, 1945].\n\nThe Canadian Government has for some months protested what it considers the lack of recognition to be accorded Canada in the surrender instrument for Germany and the proclamations based thereon. This Government is largely blamed for the opposition to the Canadian representations although our position has been based on the sound practical consideration that the four powers on the European Advisory Commission must be free to carry out decisions without the necessity of consulting Canada and other fighting allies.\n\nCanada has contributed to the military victory with a five division, highly mechanized army, an air force virtually half the EAF [주25] in [277면] aircrew strength and a navy which has handled a large proportion of the Atlantic convoy work.\n\nIn view of the sensitiveness of Canada on this subject and the tremendous Canadian pride in the success of Canadian arms, it is felt that the following message would be timely. It is suggested that the draft message quoted below be in your name in view of the close association between the late President Roosevelt and Prime Minister Mackenzie King. May I be informed if you wish us to send the message? [주26]\n\n(To Ambassador Atherton, Ottawa.)\n\nPlease request that the following from the President be delivered at once to the Prime Minister:\n\nWith the capitulation of the German Armies in the Netherlands, Denmark and Northern Germany, the battles of the Canadian Army in Europe have ended in final victory. Please accept my warmest congratulations on the stirring achievements of Canadian arms and be assured that the American people share with me the desire to pay tribute to the signal contribution which our Canadian comrades have made to the military defeat of Germany.\n\nJoseph C. Grew", "notes": ["[주25] 영국 공군(Royal Air Force).", "[주26] 이 문서에 첨부되어 국무장관 특별보좌관 윌리엄 필립스(William Phillips) 씨가 머리글자로 서명한 쪽지의 내용은 다음과 같다. 「5월 7일. 파슨스 씨. 대통령이 매켄지 킹 앞 이 전문을 승인하였습니다. 즉시 발송하기 바랍니다.」 트루먼 대통령의 5월 7일자 전문과 매켄지 킹 수상의 1945년 5월 8일자 회답은 5월 10일 언론에 공개되었으며 《Department of State Bulletin》 1945년 5월 13일자 903면에 실려 있다."], "warn": false, "pages": ["277"], "search": "Joseph C. Grew 그루 — 국무장관 대리 Harry S. Truman 트루먼 — 대통령 Franklin D. Roosevelt 루스벨트 — 고 대통령 William Mackenzie King 매켄지 킹 — 캐나다 수상 Ray Atherton 애서턴 — 주캐나다 대사 William Phillips 필립스 — 국무장관 특별보좌관 J. Graham Parsons 파슨스"}, {"id": "d219", "order": 219, "date": "1945-05-05", "group": "B", "eyebrow": "d219 · Memorandum by the Acting Secretary of State to President Truman", "title": "국무장관 대리가 트루먼 대통령에게 보내는 각서", "badge": null, "list_right": "문서 219", "meta": [{"k": "일자", "v": "1945-05-05"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 Control (Austria)/S–545", "txt": true}, {"k": "발신", "v": "그루(Joseph C. Grew) — 국무장관 대리(The Acting Secretary of State)", "txt": true}, {"k": "수신", "v": "트루먼 대통령(President Truman)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 219 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d219"}], "summary": "오스트리아와 체코슬로바키아에서 소련의 일방적 조치가 잇따르는 데 맞서, 미군을 프라하를 지나는 몰다우강 전선까지 진격시켜 대소 교섭력을 확보할 것을 합동참모본부에 긴급 검토하도록 건의한다.", "points": ["미국 정부는 오스트리아와 체코슬로바키아에 관하여 소련의 진정한 협력을 기대할 온갖 이유와 권리가 있었으나, 지금까지 받은 것은 소련의 일방적 조치들뿐이다.", "그 일방적 조치로 세 가지를 든다. 미국과 협의 없는 오스트리아 정부 승인, 빈의 미국 지대 내 비행장에 대한 동의 거부, 미국 대사관이 체코슬로바키아 정부 소재지로 가는 것에 대한 허가 거부.", "이 문제들을 미국에 만족스럽게 해결하려면 「어느 정도 힘든 흥정(hard bargaining)」이 필요해질 것으로 보이며, 현재의 군사 정세가 그 흥정의 좋은 재료가 되나 즉각적인 조치가 있어야 한다.", "미군이 프라하를 관통하는 몰다우강까지 밀고 나간다면 러시아 측에 대하여 강력한 교섭 지위를 얻게 된다. 이 강은 미군이 더 북쪽에서 멈춘 엘베강의 연장이다.", "미국 제3군은 이미 다뉴브강을 따라 상부 오스트리아의 상당 부분을 내려갔으며 그곳은 미국 점령지대가 될 것으로 보이는데, 러시아 측은 다뉴브강 이북의 상부 오스트리아를 자기들에게 양보해 주기를 바라고 있다.", "미군이 몰다우강 전 유역까지 진출한다면 오스트리아와 체코슬로바키아 양쪽에서 소련 정부를 상대로 대등한 지위에 서게 되며, 그렇지 않으면 소련 정부는 지금까지처럼 계속 미국의 항의를 무시할 것이다.", "다만 그 결정이 무엇보다 군사적 고려에 근거하여야 함을 충분히 인정하면서 이 정치적 함의를 제출한다고 끝맺는다."], "primary": "[워싱턴,] 1945년 5월 5일.\n\n우리 정부는 지금 오스트리아와 체코슬로바키아와 관련하여 중대한 정치 문제들에 부딪혀 있습니다. 이 문제들에 관하여 우리는 소련의 진정한 협력을 기대할 온갖 이유와 권리가 있었습니다. 그런데 그 대신 우리가 지금까지 겪은 것은 소련 측의 일방적 행위들입니다. 곧 우리와 협의 없이 이루어진 오스트리아 정부 승인, 빈의 미국 지대 안에 비행장을 두는 데 대한 동의 거부, 그리고 우리 대사관이 체코슬로바키아 정부의 소재지로 가는 것에 대한 허가 거부입니다.[주27]\n\n따라서 이 문제들이 우리에게 만족스러운 방식으로 해결되기까지에는 어느 정도 힘든 흥정이 필요해지리라고 보입니다. 현재의 군사 정세와 거기서 열려 보이는 가능성은, 즉각적인 조치를 취하기만 한다면, 그러한 흥정을 위한 좋은 재료를 제공합니다. 그러므로 합동참모본부(Joint Chiefs of Staff)에 다음 사항을 긴급히 검토하도록 요청할 것을 건의합니다.\n\n미국 군대가 프라하를 관통하여 흐르는 몰다우강(Moldau River)까지 밀고 나간다면, 이는 우리에게 [278면] 러시아 측에 대한 강력한 교섭 지위를 줄 것입니다. 이 강은 우리가 더 북쪽에서 멈춘 엘베강의 연장입니다. 더욱이 미국 제3군은 이제 다뉴브강을 따라 상부 오스트리아의 상당 부분을 내려갔으며, 그곳은 아마도 오스트리아 내 우리 점령지대에 들어갈 것입니다. 그러나 러시아 측은 다뉴브강 이북의 그 상부 오스트리아 부분을 자기들에게 양보해 주기를 바라고 있습니다. 우리는 미국 군대가 몰다우강의 전 유역에 이르기까지 진출할 것을 제안합니다. 그렇게 할 수 있다면 우리는 오스트리아와 체코슬로바키아 양쪽에서 소련 정부를 상대할 때 대등한 지위에 서게 될 것입니다. 그렇지 않으면 소련 정부는 아마도 지금까지 해 온 것처럼 오스트리아와 체코슬로바키아 두 문제 모두에서 우리의 항의를 계속 무시할 것입니다.\n\n이 상황에 얽힌 정치적 함의에 관한 위의 논의를 제출하면서도, 나는 그 결정이 무엇보다 군사적 고려에 근거하여야 하리라는 점을 충분히 인식하고 있습니다.\n\n조지프 C. 그루(Joseph C. Grew)", "secondary": "[Washington,] May 5, 1945.\n\nThis Government is now faced with major political problems in connection with Austria and Czechoslovakia on which we had every reason and right to expect real Soviet cooperation with us. Instead, we have so far had unilateral acts on the part of the Soviet Union, i.e., a recognition of an Austrian Government without consultation with us, refusal to agree to an airfield in the United States zone in Vienna, and a refusal to permit our Embassy to go to the seat of the Czechoslovak Government. [주27]\n\nIt therefore seems that some hard bargaining is going to become necessary before these problems are settled in a manner satisfactory to us. The present military situation and its apparent possibilities offer some good material for such bargaining, provided immediate action is taken. It is therefore suggested that the Joint Chiefs of Staff be asked to consider urgently the following:\n\nIf the American Armies pushed on to the Moldau River which runs through Prague, this would give us a strong bargaining position with [278면] the Russians. This river is a continuation of the Elbe where we have stopped farther north. Furthermore, the United States Third Army has now gone down the Danube through a good part of Upper Austria, which will presumably be in our zone of occupation in Austria. The Russians would, however, like to have us concede to them that part of Upper Austria north of the Danube. We propose that American forces advance to the Moldau River throughout its length. If they could do so we shall then be in a position of equality in both Austria and Czechoslovakia in dealing with the Soviet Government. Otherwise the Soviet Government will probably continue as it has done to the present to disregard our protests with respect to both Austria and Czechoslovakia.\n\nI submit the foregoing discussion of the political implications involved in this situation while fully realizing that the decision will no doubt have to be based primarily upon military considerations.\n\nJoseph C. Grew", "notes": ["[주27] 체코슬로바키아–미국 관계에 관한 자료는 제IV권 420면 이하 참조."], "warn": false, "pages": ["278"], "search": "Joseph C. Grew 그루 — 국무장관 대리 Harry S. Truman 트루먼 — 대통령"}, {"id": "d563", "order": 563, "date": "1945-05-05", "group": "A", "eyebrow": "d563 · The Minister in Sweden (Johnson) to the Secretary of State", "title": "주스웨덴 공사(존슨)가 국무장관에게", "badge": null, "list_right": "문서 563", "meta": [{"k": "일자", "v": "1945-05-05"}, {"k": "시각", "v": "Stockholm, May 5, 1945—2 p.m. [Received May 5—11:29 a.m.]"}, {"k": "장소", "v": "Stockholm", "txt": true}, {"k": "전문번호", "v": "1700"}, {"k": "원문출처", "v": "740.00119 EW/5–545: Telegram", "txt": true}, {"k": "발신", "v": "존슨(Herschel V. Johnson) — 주스웨덴 공사(The Minister in Sweden)", "txt": true}, {"k": "수신", "v": "국무장관(The Secretary of State)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 563 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d563"}], "summary": "셸렌베르크가 SHAEF와 접촉하여 전 전선에서의 총항복 문제를 다루고 그것이 아직 명령되지 않은 이유를 설명하고자 한다는 보헤만의 전언을 보고한다.", "points": ["보헤만이 맬릿과 존슨에게, 셸렌베르크가 되니츠와 힘러 그리고 이른바 독일 정부가 어제 보헤미아로 갈 뜻이었다고 믿는다고 말하였다.", "셸렌베르크는 나아가 전 전선에서의 총항복(total capitulation on all fronts) 문제를 다루고 그러한 항복이 지금까지 명령되지 않은 까닭을 설명하기 위하여 SHAEF와 접촉하고 싶다는 뜻을 밝혔다.", "그가 든 이유는 보헤미아 보호령에 있는 600만~800만 명의 독일 민간인의 존재이며, 되니츠는 어떻게든 이들을 구하고 싶어 한다는 것이다.", "이 설명에 따르면 되니츠는 이 사람들이 연합군 전선을 통과하여 서쪽으로 새어 나가도록 허용되기를 바라는 것으로 보인다."], "primary": "스톡홀름, 1945년 5월 5일—오후 2시.\n [5월 5일—오전 11시 29분 접수.]\n\n1700. 보헤만(Boheman)이 맬릿(Mallet)과 나에게, 셸렌베르크(Schellenberg)[주73] 가 되니츠와 힘러 그리고 이른바 독일 정부가 어제 보헤미아로 갈 [777면] 뜻이었다고 믿는다는 말을 하였습니다. 셸렌베르크는 나아가, 전 전선에서의 총항복(total capitulation on all fronts) 문제를 제기하고 그러한 항복이 어찌하여 지금까지 명령되지 않았는지를 설명하기 위하여 SHAEF와 접촉하고 싶다는 뜻을 밝혔습니다(본관 전보 제1699호, 5월 5일 오후 2시[주74] ). 그가 그 이유로 내세운 것은 보헤미아 보호령에 있는 600만 내지 800만 명의 독일 민간인의 존재이며, 되니츠는 어떻게든 이들을 구하고 싶어 한다는 것입니다. 이 설명에 따르면 되니츠는 분명히 이 사람들이 연합군 전선을 통하여 서쪽으로 새어 나가도록 허용되기를 바라고 있습니다.\n\n존슨(Johnson)", "secondary": "Stockholm, May 5, 1945—2 p.m. \n [Received May 5—11:29 a.m.]\n\n1700. Boheman informed Mallet and me that Schellenberg [주73] expressed belief Dönitz and Himmler and so-called German Government [777면] intended yesterday to go Bohemia. Schellenberg has further expressed wish to get in touch with SHAEF in order to take up question of total capitulation on all fronts and to explain why such capitulation has hitherto not been ordered (my 1699, May 5, 2 p.m. [주74] ) He advanced as a reason the presence of 6 to 8 million German civilians in the protectorate of Bohemia which Dönitz somehow would like to save. According to this account Dönitz evidently hopes these people will be permitted to filter westward through the Allied lines.\n\nJohnson", "notes": ["[주73] 셸렌베르크 장군은 이때 노르웨이 주둔 독일군의 항복(capitulation)을 주선하기 위하여 스웨덴을 방문 중이었다. 이 임무에 관한 자료는 제V권 56면 이하 참조.", "[주74] 인쇄하지 않음. 이 전보는 셸렌베르크 장군이 노르웨이 주둔 독일군의 항복을 교섭할 되니츠 제독의 전권을 지니고 스웨덴에 도착하였음을 국무부에 알린 것이다(740.00119 EW/5–545)."], "warn": false, "pages": ["777"], "search": "Herschel V. Johnson 존슨 — 주스웨덴 공사 Erik Boheman 보헤만 — 스웨덴 외무차관 Sir Victor Mallet 맬릿 — 주스웨덴 영국공사 Walter Schellenberg 셸렌베르크 Karl Dönitz 되니츠 Heinrich Himmler 힘러"}, {"id": "d564", "order": 564, "date": "1945-05-05", "group": "A", "eyebrow": "d564 · The Ambassador in France (Caffery) to the Secretary of State", "title": "주프랑스대사(캐퍼리)가 국무장관에게", "badge": null, "list_right": "문서 564", "meta": [{"k": "일자", "v": "1945-05-05"}, {"k": "시각", "v": "Paris, May 5, 1945—midnight. [Received May 5—8:47 p.m.]"}, {"k": "장소", "v": "Paris", "txt": true}, {"k": "전문번호", "v": "2408"}, {"k": "원문출처", "v": "740.00119 E.W./5–545: Telegram", "txt": true}, {"k": "발신", "v": "캐퍼리(Jefferson Caffery) — 주프랑스대사. 본문은 머피(Robert Murphy)가 매슈스(H. Freeman Matthews) 앞으로 보낸 것", "txt": true}, {"k": "수신", "v": "국무장관(The Secretary of State)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 564 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d564"}], "summary": "되니츠와 부슈의 대표들이 SHAEF에서 북부 독일군 잔여 병력의 항복을 논의 중이며, 소련 고등사령부와의 합의로 소련 장교(수슬로파로프)가 참가하고 연합국의 입장은 소련에 대하여도 동시에 무조건항복하는 것이라고 보고한다.", "points": ["되니츠 제독과 부슈 장군의 대표들이 지금 SHAEF에서 노르웨이를 포함한 북부 독일군 잔여 병력의 항복을 논의하고 있다.", "소련 고등사령부와의 합의에 따라 러시아 장교들(수슬로파로프 장군)이 참가하고 있으며, 연합국의 입장은 영·미 측에 대하여만이 아니라 러시아 측에 대하여도 무조건항복한다는 것이다. 「누구에게 항복하는가」가 이 시점의 쟁점이다.", "이 회담은 밤새 이어질 수 있고 독일 측이 서명하리라는 보장은 없는데, 그들은 러시아 측을 빼고 SHAEF에 대한 항복을 교섭하기를 바랐던 것으로 보인다.", "그러나 되니츠와 전신으로 협의한 뒤 아마도 내일 서명하리라고 믿어진다.", "케셀링도 전권대표를 보낼 허가를 요청하였고, 러시아 측과 우리 측에 동시에 무조건항복할 준비가 되어 있다는 조건으로 접수하겠다고 통보받았다. 그렇지 않으면 개별 부대 지휘관들에게 지역 항복이 이루어질 것이다."], "primary": "파리, 1945년 5월 5일—자정.\n[5월 5일—오후 8시 47분 접수.]\n\n2408. 머피(Murphy)로부터 매슈스(Matthews)에게. 되니츠 제독과 부슈 장군의 대표들이 지금 SHAEF에 와서, 노르웨이를 포함한 북부 독일군 잔여 병력의 항복을 논의하고 있습니다. 소련 고등사령부와의 합의에 따라 러시아 장교들(수슬로파로프 장군[주75] )이 참가하고 있으며, 연합국의 입장은 영·미 측에 대하여만이 아니라 러시아 측에 대하여도 무조건항복(unconditional surrender)한다는 것입니다. 이 회담은 밤새 이어질 수도 있습니다. 독일 측이 서명하리라는 보장은 없으며 — 그들은 아무래도 러시아 측을 빼고 SHAEF에 대한 항복을 교섭하기를 바랐던 것으로 보입니다 — 그러나 되니츠와 전신으로 협의한 뒤 아마도 내일 서명하리라고 믿어집니다.\n\n케셀링(Kesselring) 또한 전권대표를 보낼 허가를 요청하였으며, 러시아 측과 우리 측에 동시에 무조건항복할 준비가 되어 있다는 조건으로 접수하겠다는 통보를 받았습니다. 그렇지 않으면 개별 부대 지휘관들에게 지역 항복(local surrenders)이 이루어질 것입니다. [머피(Murphy).]\n\n캐퍼리(Caffery)", "secondary": "Paris, May 5, 1945—midnight.\n[Received May 5—8:47 p.m.]\n\n2408. From Murphy for Matthews. Representatives of Admiral Dönitz and General Busch are now at SHAEF discussing surrender of balance of German forces in the north including Norway. By agreement with the Soviet High Command Russian officers (General Suslaparoff [주75] ) are participating and the Allied position is unconditional surrender to the Russians as well as the Anglo-American side. These conversations may go on thru the night and while there is no assurance the Germans will sign, as they apparently hoped to negotiate a surrender to SHAEF without the Russians, it is believed that after telegraphic consultation with Dönitz they will sign probably tomorrow.\n\nKesselring also has requested permission to send plenipotentiaries and has been informed they will be received on condition that they prepared to surrender unconditionally simultaneously to the Russians and to ourselves. Otherwise local surrenders will be effected to the individual unit commanders. [Murphy.]\n\nCaffery", "notes": ["[주75] 소장 이반 수슬로파로프(Maj. Gen. Ivan Susloparov), SHAEF 주재 소련 군사사절단장."], "warn": false, "pages": [], "search": "Jefferson Caffery 캐퍼리 — 주프랑스대사 Robert Murphy 머피 — 대독일 정치고문 H. Freeman Matthews 매슈스 Karl Dönitz 되니츠 Ernst Busch 부슈 Ivan Susloparov 수슬로파로프 — SHAEF 주재 소련 군사사절단장 Albert Kesselring 케셀링"}, {"id": "d220", "order": 220, "date": "1945-05-06", "group": "A", "eyebrow": "d220 · The Ambassador in France (Caffery) to the Secretary of State", "title": "주프랑스대사(캐퍼리)가 국무장관에게", "badge": null, "list_right": "문서 220", "meta": [{"k": "일자", "v": "1945-05-06"}, {"k": "시각", "v": "Paris, May 6, 1945—1 p.m. [Received 7:20 p.m.]"}, {"k": "장소", "v": "Paris", "txt": true}, {"k": "전문번호", "v": "2410"}, {"k": "원문출처", "v": "740.00119 Control (Germany)/5–645: Telegram", "txt": true}, {"k": "발신", "v": "캐퍼리(Jefferson Caffery) — 주프랑스대사(The Ambassador in France)", "txt": true}, {"k": "수신", "v": "국무장관(The Secretary of State)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 220 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d220"}], "summary": "드골에게 프랑스 점령지대에 관한 미국 측 구상을 비공식으로 미리 알려 주고 지도를 그려 보인 경과를 보고한다.", "points": ["프랑스 점령지대가 정해지기 전에 프랑스와 협의해 달라는 잔느네의 긴급 요청을 염두에 두고, 캐퍼리는 오늘 아침 드골에게 프랑스 점령지대 문제가 EAC에서 이해당사자들 사이에 논의될 것이며 사전 정보로서 미국 측 구상을 비공식으로 알린다고 말하였다.", "국무부 5월 5일자 제1869호에 제시된 지대를 지도로 그려 보이되, 카를스루에 관구(Bezirk)는 빼고 필요하다면 위넌트가 그것도 제시하도록 남겨 두었다.", "아이젠하워 장군은 카를스루에를 프랑스 지대에 포함시킬 수 있다는 데 동의하나, 다만 교섭의 성공을 확보하는 데 꼭 필요한 경우에 한한다.", "드골이 제기한 유일한 물음은 「바덴과 뷔르템베르크를 각각 둘로 자르면 행정상의 어려움은 어떻게 되는가」였고, 캐퍼리는 그것이 넘을 수 없는 어려움이라고는 보지 않는다고 답하였다.", "드골은 매우 상냥하였으나 아무런 언질도 주지 않았다."], "primary": "파리, 1945년 5월 6일—오후 1시.\n [오후 7시 20분 접수.]\n\n2410. 프랑스 점령지대가 확정되기 전에 프랑스 측과 협의해 달라는 잔느네(Jeanneney)[주29] 의 긴급한 요청을 염두에 두고, 나는 오늘 아침 드골(de Gaulle)에게 프랑스 점령지대 문제는 EAC에서 이해관계 당사자들이 논의할 사안이며, 사전 정보로서 이 문제에 관한 우리의 구상을 비공식으로 그에게 알려 주는 것이라고 말하였습니다. 나는 그에게 국무부 5월 5일자 제1869호에 제시된 지대를 보여 주는 지도를 그려 보이되, 카를스루에 관구(Bezirk)만은 빼고 그것은 필요하다면 위넌트가 함께 제시하도록 남겨 두었습니다.\n\n아이젠하워 장군은 카를스루에를 프랑스 지대에 포함시킬 수 있다는 데 나와 견해를 같이하되, 다만 교섭의 성공을 확보하는 데 꼭 필요한 경우에 한한다는 것입니다.\n\n드골이 제기한 유일한 물음은 「바덴과 뷔르템베르크를 각각 둘로 자른다면 그곳 행정의 어려움은 어찌 되는가?」였습니다. 나는 그것이 넘을 수 없는 어려움이라고는 보지 않는다고 말하였습니다. 그는 매우 상냥하였으나 아무런 언질도 주지 않았습니다.\n\n(국무부 제2410호; 런던에 부연본 제282호로 재송.)\n\n캐퍼리(Caffery)\n\n[279면]", "secondary": "Paris, May 6, 1945—1 p.m. \n [Received 7:20 p.m.]\n\n2410. Having in mind Jeanneney’s [주29] urgent request that the French be consulted before the French occupation zone was fixed I told de Gaulle this morning that the matter of the French occupation zone is to be discussed by the interested parties in the EAC and that as advance information was giving him informally our ideas on the subject. I had sketched for him a map showing the zone set out in the Department’s 1869 of May 5 with the exception of the Bezirk of Karlsruhe leaving that to Winant to offer also if necessary.\n\nGeneral Eisenhower agrees with me that Karlsruhe can be included in the French zone but only if essential to secure the success of the negotiations.\n\nThe only question that de Gaulle raised was “what about the difficulties of administration in Baden and in Wurttemberg if you cut them each in two?” I told him that I did not consider that an insurmountable difficulty. He was very affable but did not commit himself.\n\n(Department 2410; repeated London paraphrase 282).\n\nCaffery\n\n[279면]", "notes": ["[주29] 쥘 잔느네(Jules Jeanneney), 프랑스 국무장관(Frpnch[sic] Minister of State)."], "warn": false, "pages": ["279"], "search": "Jefferson Caffery 캐퍼리 — 주프랑스대사 Jules Jeanneney 잔느네 — 프랑스 국무장관 Charles de Gaulle 드골 Dwight D. Eisenhower 아이젠하워 John G. Winant 위넌트 — 주영대사"}, {"id": "d221", "order": 221, "date": "1945-05-06", "group": "A", "eyebrow": "d221 · The Ambassador in the United Kingdom (Winant) to the Secretary of State", "title": "주영대사(위넌트)가 국무장관에게", "badge": null, "list_right": "문서 221", "meta": [{"k": "일자", "v": "1945-05-06"}, {"k": "시각", "v": "London, May 6, 1945—2 p.m. [Received May 6—10:40 a.m.]"}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "4599 (Cornea 229)"}, {"k": "원문출처", "v": "740.00119 EAC/5–645: Telegram", "txt": true}, {"k": "발신", "v": "위넌트(John G. Winant) — 주영대사(The Ambassador in the United Kingdom)", "txt": true}, {"k": "수신", "v": "국무장관(The Secretary of State)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 221 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d221"}], "summary": "독일 통제기구에 관한 공개 성명에 앞서 EAC 경로로 이해관계가 큰 연합국 정부들에 먼저 통보하기로 한 EAC의 합의와, 소련 대표가 아직 본국의 동의를 받지 못한 사정을 보고한다.", "points": ["국무부 5월 2일 오후 7시자 제3450호를 받고, 위넌트는 5월 3일 EAC 회의에서 독일 통제기구 조치의 공표 문제를 최우선 사안으로 제기하며 조속한 공개 성명의 필요를 강조하였다.", "5월 4일 회의에서 영국 대표는 자국 정부가 요약의 공표에 원칙적으로 동의한다고 밝혔다. 구세프와 마시글리는 아직 5월 3일 요청에 대한 본국의 반응을 받지 못하였다.", "5월 3일 회의에서 EAC는 공개 성명을 내기에 앞서 EAC 경로를 통하여 이해관계가 가장 큰 연합국 정부들에 통제 조치를 알리는 것이 필수적이라는 데 만장일치의 뜻을 보였다.", "통제기구와 점령지대 조치의 요약을, 항복문서 요약에 관하여 EAC 연합국협의위원회가 협의해 온 유럽 연합국 정부들에 주기로 합의되었다.", "5월 4일 EAC 회의에서 두 요약의 연합국 정부 통보가 승인되었고 미국·영국·프랑스 대표가 이 통보에 찬성하였다. 구세프는 두 요약을 연합국들에 전달하는 데 대한 본국 정부의 동의를 받지 못하였다.", "위넌트는 3~4일 안에 통보가 이루어지기를 바라며, 그 뒤 EAC가 연합국 정부들의 감정을 상하지 않도록 다소 다르게 표현된 통제기구 조치 요약을 공표용으로 승인하리라고 내다본다."], "primary": "런던, 1945년 5월 6일—오후 2시.\n [5월 6일—오전 10시 40분 접수.]\n\n4599. 코니아(Cornea) 제229호. 5월 2일 오후 7시자 국무부 제3450호[주30] 를 받고, 나는 5월 3일 유럽자문위원회 회의에서 독일 통제기구 조치의 공표 문제를 최우선 사안으로 제기하고 조속한 공개 성명의 필요성을 강조하였습니다.\n\n5월 4일 회의에서 연합왕국 대표는 자국 정부가 요약의 공표에 원칙적으로 동의한다고 밝혔습니다. 구세프와 마시글리는 5월 3일 나의 요청에 대한 자국 정부의 반응을 아직 받지 못하였습니다.\n\n5월 3일 회의에서 EAC는, 공개 성명을 내기에 앞서 EAC 경로를 통하여 가장 이해관계가 큰 연합국 정부들에 통제 조치를 알리는 것이 필수적이라고 만장일치로 느꼈습니다. 통제기구와 점령지대 조치의 요약을, EAC 연합국협의위원회가 항복문서 요약에 관하여 협의해 온 유럽 연합국 정부들에 주어야 한다는 데 합의가 이루어졌습니다.\n\n5월 4일 EAC 회의에서 통제기구 요약과 점령 조치 요약이 유럽 연합국 정부들에 통보하기 위하여 승인되었고, 이 통보는 미국·연합왕국·프랑스 대표가 찬성하였습니다. 구세프는 이 두 요약을 연합국들에 전달하는 데 대한 자국 정부의 동의를 받지 못하였습니다.\n\n나는 이 요약들의 연합국 통보가 3~4일 안에 이루어질 수 있기를 바랍니다. 그 뒤 EAC가 통제기구 조치의 요약을, 아마도 연합국 정부들의 민감함을 건드리지 않도록 다소 다르게 표현하여, 공표용으로 승인하게 되리라고 내다봅니다.\n\n위넌트(Winant)\n\n[280면]", "secondary": "London, May 6, 1945—2 p.m. \n [Received May 6—10:40 a.m.]\n\n4599. Cornea 229. On receiving Department’s 3450, May 2,7 p.m., [주30] I raised the question of publicity on control machinery arrangements for Germany as a matter of first priority in the European Advisory Commission meeting of May 3 stressing the need for an early public statement.\n\nAt the May 4 meeting the United Kingdom Representative stated that his Government agreed in principle to publication of a summary. Gousev and Massigli have not yet received the reactions of their Governments to my May 3 request.\n\nAt May 3 meeting it was the unanimous feeling of the EAC that it is essential to inform the most interested Allied Governments of control arrangements through the EAC channel prior to issuing a public statement. It was agreed that summaries of the control machinery and occupation zones arrangements ought to be given to the European Allied Governments with whom the EAC Allied Consultation Committee has consulted regarding the summary of the surrender instrument.\n\nAt May 4 EAC meeting summaries of the control machinery and one of occupation arrangements were approved for communication to the European Allied Governments and this communication was approved by the United States, United Kingdom and French representatives. Gousev has not received the consent of his Government to transmit these two summaries to the Allies.\n\nI hope the communication of the summaries to the Allies can be carried out within 3 or 4 days. I anticipate that the EAC will then approve for publication a summary of control machinery arrangements probably worded somewhat differently in order not to offend the susceptibilities of the Allied Governments.\n\nWinant\n\n[280면]", "notes": ["[주30] 인쇄하지 않음. 육군성이 독일 통제기구 조치에 관한 요약 성명을 되도록 빨리 발표하고자 한다고 보고하면서, 위넌트에게 그러한 발표에 이의가 있는지 유럽자문위원회 동료들과 긴급히 협의하도록 지시한 전보였다(740.00119 EAC/5–245)."], "warn": false, "pages": ["280"], "search": "John G. Winant 위넌트 — 주영대사 Fedor T. Gousev 구세프 — EAC 소련 대표 René Massigli 마시글리 — EAC 프랑스 대표"}, {"id": "d222", "order": 222, "date": "1945-05-06", "group": "A", "eyebrow": "d222 · The Ambassador in the United Kingdom (Winant) to the Secretary of State", "title": "주영대사(위넌트)가 국무장관에게", "badge": null, "list_right": "문서 222", "meta": [{"k": "일자", "v": "1945-05-06"}, {"k": "시각", "v": "London, May 6, 1945—4 p.m. [Received May 6—12:15 p.m.]"}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "4600"}, {"k": "원문출처", "v": "740.00119 EW/5–645: Telegram", "txt": true}, {"k": "발신", "v": "위넌트(John G. Winant) — 주영대사(The Ambassador in the United Kingdom)", "txt": true}, {"k": "수신", "v": "국무장관(The Secretary of State) — 국무장관 대리 그루와 매슈스 씨에게만", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 222 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d222"}], "summary": "항복 요건에 관하여 런던에서 완전한 조율과 합의가 이루어졌음을 알리는 짧은 전보로, 랭스 서명 전날에 보내진 것이며 뒤에 편집자가 5월 7일 랭스 서명과 5월 8일 베를린 비준을 알리는 주기(注記)를 덧붙였다.", "points": ["위넌트는 항복 요건(surrender requirements)에 관하여 이곳에서 완전한 조율과 합의가 이루어졌음을 그루와 매슈스에게만 알린다.", "그는 수상(처칠)과 베델 스미스 중장 두 사람 모두와 이야기를 나누었다. 랭스에서 실제 서명을 받게 될 참모장과 총리 양쪽이다.", "그는 트루먼 대통령과 마셜 장군이 이 전문의 사본을 보았으면 좋겠다고 덧붙인다.", "편집자 주기: 1945년 5월 7일 프랑스 랭스(Rheims)에서 독일 최고사령부가 연합국원정군최고사령관과 소련 고등사령부에 무조건항복하였다.", "편집자 주기: 모든 독일 군대의 무조건항복에 대한 비준(ratification)은 1945년 5월 8일 베를린에서 최고연합사령부들에 대하여 이루어졌다. 편집자는 랭스를 「항복」, 베를린을 「비준」으로 부른다.", "5월 7일과 5월 8일 「군사항복문서(Acts of Military Surrender)」의 문안은 국무부 Executive Agreement Series 제502호 또는 59 Stat. (제2부) 1857 참조."], "primary": "런던, 1945년 5월 6일—오후 4시.\n [5월 6일—오후 12시 15분 접수.]\n\n4600. 국무장관 대리 그루와 매슈스 씨에게만. 항복 요건(surrender requirements)에 관하여 이곳에서 완전한 조율과 합의가 이루어졌음을 두 분께 알려 드리고 싶었습니다. 나는 수상(the Prime Minister) 및 베델 스미스(Bedell Smith) 중장 두 분과 모두 이야기를 나누었습니다. 트루먼 대통령과 마셜(Marshall) 장군께서 이 전문의 사본을 보시게 되면 고맙겠습니다.\n\n위넌트(Winant)\n\n[1945년 5월 7일 프랑스 랭스(Rheims)에서 독일 최고사령부가 연합국원정군최고사령관과 소련 고등사령부에 무조건항복하였다. 모든 독일 군대가 최고연합사령부들에 대하여 행한 무조건항복의 비준(ratification)은 1945년 5월 8일 베를린에서 이루어졌다. 5월 7일과 5월 8일 군사항복문서(Acts of Military Surrender)의 문안은 국무부 Executive Agreement Series 제502호 또는 59 Stat.(제2부) 1857면 참조. 독일 항복에 이르는 교섭에 관한 자료는 뒤의 717면 이하 참조.]", "secondary": "London, May 6, 1945—4 p.m. \n [Received May 6—12:15 p.m.]\n\n4600. For Acting Secretary Grew and Mr. Matthews only. I wanted you to know that there was complete coordination and agreement here on surrender requirements. I have had talks with both the Prime Minister and with Lt. General Bedell Smith. I would appreciate President Truman and General Marshall seeing a copy of this message.\n\nWinant\n\n[On May 7, 1945, at Rheims, France, the German High Command surrendered unconditionally to the Supreme Commander, Allied Expeditionary Force, and the Soviet High Command. The ratification of the unconditional surrender of all German Armed Forces to the Supreme Allied Commands took place in Berlin on May 8, 1945. For texts of the Acts of Military Surrender of May 7 and May 8, see Department of State Executive Agreement Series No. 502, or 59 Stat, (pt. 2) 1857. For documentation regarding the negotiations leading to the surrender of Germany, see post, pages 717 ff.]", "notes": [], "warn": false, "pages": [], "search": "John G. Winant 위넌트 — 주영대사 Joseph C. Grew 그루 — 국무장관 대리 H. Freeman Matthews 매슈스 Winston Churchill 처칠 — 영국 수상 Walter Bedell Smith 베델 스미스 — SHAEF 참모장 Harry S. Truman 트루먼 — 대통령 George C. Marshall 마셜"}, {"id": "d565", "order": 565, "date": "1945-05-06", "group": "A", "eyebrow": "d565 · The Ambassador in France (Caffery) to the Secretary of State", "title": "주프랑스대사(캐퍼리)가 국무장관에게", "badge": null, "list_right": "문서 565", "meta": [{"k": "일자", "v": "1945-05-06"}, {"k": "시각", "v": "Paris, May 6, 1945—11 p.m. [Received May 6—7:30 p.m.]"}, {"k": "장소", "v": "Paris", "txt": true}, {"k": "전문번호", "v": "2426"}, {"k": "원문출처", "v": "740.00119 E.W./5–645: Telegram", "txt": true}, {"k": "발신", "v": "캐퍼리(Jefferson Caffery) — 주프랑스대사. 본문은 머피(Robert Murphy)가 매슈스(H. Freeman Matthews) 앞으로 보낸 것", "txt": true}, {"k": "수신", "v": "국무장관(The Secretary of State)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 565 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d565"}], "summary": "요들이 전권을 지니고 SHAEF에 도착하였으며 서명은 일요일 밤이나 월요일 아침에 이루어지리라 본다는, 랭스 서명 몇 시간 전의 보고이다.", "points": ["요들 원수[원문 Field Marshal]가 오늘 오후 제21집단군 사령부에서 SHAEF에 도착하였다.", "그는 독일군의 항복을 위한 전권(full powers)을 지닌 것으로 이해된다. 서명 자격이 곧 쟁점이었던 만큼 중요한 대목이다.", "SHAEF 장교들은 성공적 결말을 낙관하는 편이며, 첫인상은 독일 측이 무조건항복(unconditional surrender)을 하기로 결정하였다는 것, 그리고 그들의 으뜸 관심사는 되도록 많은 병력을 러시아 측 손에 넘어가지 않게 구하는 데 있다는 것이다.", "이 항복은 남북 전 지역을 아우를 것이며, 머피는 일요일 밤이나 월요일 아침에 서명되리라 본다. 실제로는 5월 7일 월요일 새벽 02시 41분에 서명되었다."], "primary": "파리, 1945년 5월 6일—오후 11시.\n [5월 6일—오후 7시 30분 접수.]\n\n2426. 매슈스(Matthews)에게, 머피(Murphy)로부터. 요들 원수[주76] 가 오늘 오후 제21집단군 사령부에서 SHAEF에 도착하였습니다. 그는 [778면] 독일군의 항복을 위한 전권(full powers)을 지니고 있는 것으로 이해됩니다. SHAEF 장교들은 성공적인 결말을 낙관하는 편이며, 그들이 받은 첫인상은 독일 측이 무조건항복(unconditional surrender)을 하기로 결정하였다는 것, 그리고 그들의 으뜸가는 관심사는 되도록 많은 병력이 러시아 측의 손에 떨어지지 않도록 구하는 데 있다는 것입니다. 이 항복은 남북 전 지역을 아우를 것이며, 나는 일요일 밤이나 월요일 아침에 서명되리라고 봅니다. [머피(Murphy).]\n\n캐퍼리(Caffery)", "secondary": "Paris, May 6, 1945—11 p.m. \n [Received May 6—7:30 p.m.]\n\n2426. For Matthews from Murphy. Field Marshal Jodl [주76] arrived at SHAEF this afternoon from 21st Army Group Headquarters. He [778면] is understood to possess full powers for the surrender of German forces. SHAEF officers are inclined to be optimistic of a successful outcome and the first impression they have is that the German’s have decided upon unconditional surrender and that their primary concern is to save as many of their forces as possible from falling into Russian hands. The surrender will embrace the entire area north and south and I believe it will be signed Sunday night or Monday morning. [Murphy.]\n\nCaffery", "notes": ["[주76] 상급대장 알프레트 요들(Generaloberst Alfred Jodl), 독일 국방군 작전참모부장."], "warn": false, "pages": ["778"], "search": "Jefferson Caffery 캐퍼리 — 주프랑스대사 Robert Murphy 머피 — 대독일 정치고문 H. Freeman Matthews 매슈스 Alfred Jodl 요들"}, {"id": "d765", "order": 765, "date": "1945-05-06", "group": "A", "eyebrow": "d765 · The Ambassador in France (Caffery) to the Secretary of State", "title": "주프랑스대사(캐퍼리)가 국무장관에게", "badge": null, "list_right": "문서 765", "meta": [{"k": "일자", "v": "1945-05-06"}, {"k": "시각", "v": "Paris, May 6, 1945—7 p.m. [Received 8 p.m.]"}, {"k": "장소", "v": "Paris", "txt": true}, {"k": "전문번호", "v": "2419"}, {"k": "원문출처", "v": "862.01/5–645: Telegram", "txt": true}, {"k": "발신", "v": "캐퍼리(Jefferson Caffery) — 주프랑스대사(The Ambassador in France)", "txt": true}, {"k": "수신", "v": "국무장관(The Secretary of State)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 765 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d765"}], "summary": "서부 자유독일위원회(CALPO) 안의 사회주의자 대다수가 공산주의자의 지나친 지배를 이유로 탈퇴하였다는 소식을 전한다.", "points": ["CALPO(서부 자유독일위원회)와 긴밀히 접촉하는 소식통이 대사관에 알려 온 바이다.", "그 안의 사회주의자 대다수가 위원회에 대한 공산주의자의 지나치게 과도한 지배를 이유로 탈퇴하였다."], "primary": "파리, 1945년 5월 6일—오후 7시.\n [오후 8시 접수.]\n\n2419. CALPO(서부 자유독일위원회, Free Germany Committee of the West)와 긴밀히 접촉하고 있는 한 소식통이 대사관에 알려 온 바에 따르면, 그 안의 사회주의자 대부분이 위원회에 대한 공산주의자의 지나치게 과도한 지배 때문에 그 구성원 자격을 포기하였다고 합니다.\n\n캐퍼리(Caffery)", "secondary": "Paris, May 6, 1945—7 p.m. \n [Received 8 p.m.]\n\n2419. The Embassy is informed by a source in close contact with CALPO (Free Germany Committee of the West) that most of the Socialists therein have renounced their membership owing to the too excessive Communist domination of the Committee.\n\nCaffery", "notes": [], "warn": false, "pages": [], "search": "Jefferson Caffery 캐퍼리 — 주프랑스대사"}, {"id": "d855", "order": 855, "date": "1945-04-06", "group": "A", "eyebrow": "d855 · The Secretary of State to Certain Diplomatic Representatives  Sent to all American diplomatic representatives except those at Madrid, Lisbon, Bern, Stockholm, Dublin, Vatican City, and Kabul.", "title": "국무장관이 일부 재외 외교대표에게", "badge": null, "list_right": "문서 855", "meta": [{"k": "일자", "v": "1945-04-06"}, {"k": "시각", "v": "Washington, April 6, 1945—8 a.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "800.414/4–645: Circular telegram", "txt": true}, {"k": "발신", "v": "스테티니어스(Edward R. Stettinius, Jr.) — 국무장관(The Secretary of State)", "txt": true}, {"k": "수신", "v": "일부 재외 외교대표(Certain Diplomatic Representatives) — 마드리드·리스본·베른·스톡홀름·더블린·바티칸시국·카불을 제외한 모든 미국 외교대표", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 855 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d855"}], "summary": "3월 31일 회람전보에 제시된 일방적 절차는 수신자들이 주재하는 나라에는 적용되지 않으며 참고용일 뿐이나, 그 나라들이 독일 기록을 어떻게 처분하는지는 계속 보고하라는 회람전보이다.", "points": ["3월 31일 오후 3시자 국무부 회람전보에 개괄된 일방적 절차(unilateral procedure)는 수신자들이 신임장을 낸 나라들에는 적용되지 않으며, 그 언급은 참고용일 뿐이다.", "다만 수신자들은 주재국이 그러한 기록을 어떻게 처분하는지를 국무부에 계속 알려야 한다."], "primary": "워싱턴, 1945년 4월 6일—오전 8시.\n\n3월 31일 오후 3시자 국무부 회람전보(Deptelcirc March 31, 3 p.m.)에 개괄된 일방적 절차는 귀하가 신임장을 낸 나라들에는 적용되지 않으며, 그 언급은 오직 귀하의 참고를 위한 것이었습니다. 다만 귀하는 귀하가 신임장을 낸 나라들이 그러한 기록을 어떻게 처분하는지를 국무부에 계속 알려야 합니다.\n\n스테티니어스(Stettinius)", "secondary": "Washington, April 6, 1945—8 a.m.\n\nThe unilateral procedure outlined in Deptelcirc March 31, 3 p.m. does not apply in countries to which you are accredited and reference was for your information only. However, you should keep the Department informed of any disposition made of such records by the countries to which you are accredited.\n\nStettinius", "notes": ["[주18] 마드리드·리스본·베른·스톡홀름·더블린·바티칸시국·카불을 제외한 모든 미국 외교대표에게 발송."], "warn": true, "pages": [], "search": "Edward R. Stettinius, Jr. 스테티니어스 — 국무장관"}, {"id": "d92", "order": 92, "date": "1945-05-07", "group": "A", "eyebrow": "d92 · The Chargé in the Soviet Union (Kennan) to the Secretary of State", "title": "주소련 대리대사(케넌)가 국무장관에게", "badge": null, "list_right": "문서 92", "meta": [{"k": "일자", "v": "1945-05-07"}, {"k": "시각", "v": "Moscow, May 7, 1945—8 p.m. [Received May 7—5:40 p.m.]"}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": "1490"}, {"k": "원문출처", "v": "740.00119 Control (Austria)/5–745: Telegram", "txt": true}, {"k": "발신", "v": "케넌(George F. Kennan) — 주소련 대리대사(The Chargé in the Soviet Union)", "txt": true}, {"k": "수신", "v": "국무장관(The Secretary of State)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 92 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d92"}], "summary": "연합국 대표들의 빈행에 소련이 이의를 제기하지는 않되 오스트리아 점령지대 획정은 오로지 EAC의 소관이라며 빈에서의 협의를 거부한 비신스키의 5월 6일자 서한을 보고한다.", "points": ["연합국 대표들이 더 지체 없이 빈으로 비행할 수 있도록 톨부힌 원수에게 훈령을 내려 달라는 요청에 대한 회답으로, 5월 6일자 비신스키 서한을 받았다.", "비신스키는 소련 정부가 통제기구 참여를 위하여 미국 대표들이 빈으로 가는 데 대하여 전에도 이의를 제기하지 않았고 지금도 이의가 없다고 밝혔다.", "다만 그런 동의를 줄 때 소련 정부는 대표들이 도착할 무렵이면 점령지대 문제에 필요한 합의가 이루어지고 지대 자체가 EAC에 의하여 획정되어 있으리라 믿었다는 것이다. 그런데 유감스럽게도 지대는 아직 획정되지 않았다.", "점령지대 문제를 빈에서 논의하도록 옮기자는 제안은 소련 정부가 보기에 받아들일 수 없다. 세 나라 지도자가 합의한 대로 이런 성질의 문제는 전적으로 EAC의 소관이기 때문이다.", "비신스키는 「우리 대표들이 빈에 도착하기 전에는 빈 점령지대에 관한 EAC의 협의가 성공적으로 마무리되지 않을 것」이라는 케넌 서한의 진술은 설득력이 없다고 하였다.", "그 근거로, 독일과 베를린의 점령지대는 연합군이 독일 영토에 들어가기 전에 EAC가 정하였음을 지적하는 것으로 충분하다고 끝맺었다.", "이 전보는 국무부에 제1490호로, 카세르타의 에르하르트에게 제89호로, 런던 EAC 앞으로 제195호로 발송되었다."], "primary": "모스크바, 1945년 5월 7일—오후 8시.\n [5월 7일—오후 5시 40분 접수.]\n\n1490. 5월 3일 정오자 국무부 전보 제995호, 카세르타의 에르하르트(Erhardt) 앞 제425호에 관하여(ReDeptel 995, May 3, noon, 425 to Caserta for Erhardt). 연합국 대표들이 더 이상 지체 없이 빈으로 비행할 수 있도록 톨부힌(Tolbukhin) 원수에게 훈령을 내려 달라는 요청을 담은 나의 서한에 대한 회답으로, 나는 이제 비신스키(Vyshinski)의 5월 6일자 서한을 받았습니다. 그 서한은, 통제기구에 참여하기 위하여 우리 대표들이 빈으로 가는 데 대하여 소비에트 정부가 전에도 이의를 제기하지 않았고 지금도 이의가 없다고 밝히고 있습니다. 그러나 비신스키는 이어, 그러한 동의를 줄 때 소비에트 정부는 대표들이 도착할 무렵이면 점령지대 문제에 관한 필요한 합의가 이루어져 있고 그 지대들 자체도 EAC에 의하여 획정되어 있으리라고 확신하였다고 말합니다. 유감스럽게도 그 지대들은 아직 획정되지 않았습니다. 점령지대 문제를 빈에서의 검토로 옮기자는 제안은 소비에트 정부가 보기에 받아들일 수 없습니다. [117면] 이러한 성질의 문제는, 세 나라 지도자들이 합의한 바와 같이[주29] , 전적으로 EAC의 권한에 속하기 때문입니다.\n\n비신스키는 이어, 우리 대표들이 빈에 도착하기 전에는 빈의 점령지대에 관한 EAC 안에서의 협의가 성공적으로 마무리되지 못하리라는 나의 서한 속 진술은 설득력이 없다고 말합니다. 독일과 베를린의 점령지대가 연합군이 독일 영토에 들어가기 전에 EAC에 의하여 정해졌다는 점을 지적하는 것으로 충분하다고 그는 끝맺습니다.\n\n국무부에 제1490호로 발송, 카세르타의 에르하르트에게 제89호로, 런던 EAC 앞으로 제195호로 재송.\n\n케넌(Kennan)", "secondary": "Moscow, May 7, 1945—8 p.m. \n [Received May 7—5:40 p.m.]\n\n1490. ReDeptel 995, May 3, noon, 425 to Caserta for Erhardt. In reply to my letter incorporating the request that instructions be issued to Marshal Tolbukhin that Allied representatives be permitted to fly to Vienna without further delay, I have now received a letter from Vyshinski dated May 6, stating that the Soviet Government does not object as it has not objected previously to our representatives proceeding to Vienna to participate in the control machinery. However, continues Vyshinski, in giving such agreement the Soviet Government was confident that by the time the representatives arrived the necessary agreement would have been reached on the question of zones of occupation and the zones themselves would have been delimited by the EAC. Unfortunately the zones have not yet been delimited. The proposal to transfer the question of zones of occupation for consideration in Vienna is inacceptable in the opinion of the Soviet Government [117면] since questions of this nature, as was agreed by the leaders of the three states, [주29] are entirely within the competence of the EAC.\n\nVyshinski continues that the statement in my letter to the effect that the conversations in the EAC regarding zones of occupation in Vienna would not be successfully concluded until our representatives arrived in Vienna was unconvincing. It was sufficient to point out, he concluded, that the zones of occupation in Germany and Berlin were set up by the EAC before Allied troops entered German territory.\n\nSent to Department as 1490, repeated to Caserta for Erhardt as 89 and to London for EAC as 195.\n\nKennan", "notes": ["[주29] 1943년 11월 1일 모스크바 회담에서 합의된 유럽자문위원회의 위임 사항 문안은 《Foreign Relations》 1943년 제1권 756면 참조."], "warn": false, "pages": ["117"], "search": "George F. Kennan 케넌 — 주소련 대리대사 Andrey Y. Vyshinski 비신스키 — 소련 외무인민위원 대리 Fyodor I. Tolbukhin 톨부힌 — 소련 원수 John G. Erhardt 에르하르트 — 카세르타"}, {"id": "d223", "order": 223, "date": "1945-05-07", "group": "A", "eyebrow": "d223 · The Acting Secretary of State to the Ambassador in the United Kingdom (Winant)", "title": "국무장관 대리가 주영대사(위넌트)에게", "badge": null, "list_right": "문서 223", "meta": [{"k": "일자", "v": "1945-05-07"}, {"k": "시각", "v": "Washington, May 7, 1945—5 p.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "3582"}, {"k": "원문출처", "v": "740.00119 EAC/5–745: Telegram", "txt": true}, {"k": "발신", "v": "그루(Joseph C. Grew) — 국무장관 대리(The Acting Secretary of State)", "txt": true}, {"k": "수신", "v": "위넌트(John G. Winant) — 주영대사(The Ambassador in the United Kingdom)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 223 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d223"}], "summary": "통제기구 요약의 연합국 통보를 서두르라고 재촉하면서, 워싱턴의 압력이 시간마다 커져 EAC가 하루 이틀 안에 합의하지 못하면 육군성이 독자적으로 요약을 발표할 수도 있다고 알린다.", "points": ["공개 성명에 앞서 EAC 경로로 가장 이해관계가 큰 연합국 정부들에 통제 조치를 알린다는 코니아 제229호의 절차가 바람직하다는 데는 동의한다.", "그러나 이곳의 압력이 시간마다 커지고 있으며(the pressure here is becoming hourly greater), 특파원들이 육군성에 「EAC가 이 문제에 합의하지 못한 것 아니냐」고 넌지시 말할 지경에 이르렀다.", "불리한 보도를 피하기 위하여, EAC가 승인한 통제기구 및 점령 조치의 요약을 즉시 유럽 연합국 정부들에 통보할 수 있기를 바란다.", "최선을 다해 이 일을 서두르고, 어떤 조치가 취해지면 즉시 알려 달라고 한다.", "EAC가 하루 이틀 안에 통제기구 조치 요약의 공표에 합의하지 못하면 육군성이 이곳에서 요약을 발표하지 않을 수 없게 될지 모른다. 발표 시점을 둘러싼 압박이 랭스 서명 당일에 정점에 이르렀음을 보여 준다."], "primary": "워싱턴, 1945년 5월 7일—오후 5시.\n\n3582. 공개 성명을 내기에 앞서 EAC 경로를 통하여 가장 이해관계가 큰 연합국 정부들에 통제 조치를 알린다는, 귀하의 코니아(Cornea) 제229호에 개괄된 절차가 바람직하다는 데에는 우리도 동의합니다. 그러나 이곳의 압력은 시간마다 커지고 있으며, 특파원들이 육군성에 EAC가 이 문제에 관하여 합의에 이르지 못한 것이 아니냐고 넌지시 말할 지경에까지 이르렀습니다.\n\n따라서 불리한 보도를 피하기 위하여, EAC가 승인한 통제기구 및 점령 조치의 요약이 즉시 유럽 연합국 정부들에 통보될 수 있기를 바랍니다. 이 일을 서두르는 데 최선을 다하여 주시고, 어떤 조치가 취해지는 대로 즉시 우리에게 알려 주기 바랍니다. EAC가 하루 이틀 안에 통제기구 조치에 관한 요약의 공표에 합의하지 못한다면, 육군성이 이곳에서 요약을 발표하지 않을 수 없게 될지도 모릅니다.\n\n그루(Grew)\n\n[281면]", "secondary": "Washington, May 7, 1945—5 p.m.\n\n3582. While we agree to the desirability of the procedure outlined in your Cornea 229 of informing the most interested Allied Governments of control arrangements through the EAC channel prior to issuing a public statement, the pressure here is becoming hourly greater and has reached a point where the correspondents are intimating to the War Department that the EAC has not been able to reach agreement on this matter.\n\nTo avoid adverse publicity, we therefore hope that summaries of the control machinery and occupation arrangements approved by the EAC can be communicated to the European Allied Governments at once. Please do your utmost to expedite this matter, informing us immediately when any action is taken. If the EAC cannot agree to the publication of a summary on control machinery arrangements within a day or two, the War Dept may be compelled to issue a summary here.\n\nGrew\n\n[281면]", "notes": [], "warn": false, "pages": ["281"], "search": "Joseph C. Grew 그루 — 국무장관 대리 John G. Winant 위넌트 — 주영대사"}, {"id": "d353", "order": 353, "date": "1945-05-07", "group": "A", "eyebrow": "d353 · The Ambassador in the United Kingdom (Winant) to the Secretary of State", "title": "주영대사(위넌트)가 국무장관에게", "badge": null, "list_right": "문서 353", "meta": [{"k": "일자", "v": "1945-05-07"}, {"k": "시각", "v": "London, May 7, 1945—10 p.m. [Received May 7—8:11 p.m.]"}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "4628 (Cornea 230)"}, {"k": "원문출처", "v": "740.00119 EAC/5–745: Telegram", "txt": true}, {"k": "발신", "v": "주영대사 위넌트(John G. Winant, The Ambassador in the United Kingdom)", "txt": true}, {"k": "수신", "v": "국무장관(The Secretary of State)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 353 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d353"}], "summary": "5월 3일 유럽자문위원회 회의에서 미국 초안 「일반지령」 제1항을 두고 구세프·스트랭·마시글리와 벌인 논쟁을 보고한 전보로, 통제이사회에서 합의가 이루어지지 않을 경우 각 지대 사령관이 독자로 행동할 수 있는가가 쟁점이 되었다.", "points": ["구세프와 스트랭은 미국 「일반지령」의 몇몇 대목이 얄타 회담의 결정과 어긋난다고 강하게 주장하였고, 위넌트는 그 지령이 얄타 결정에 근거하며 그 범위 안에 들도록 기초되었다고 맞섰다. 세 나라의 해석이 처음부터 갈렸다.", "쟁점의 핵심: 「일반지령」 제1항 둘째 문장은 연합국의 합의된 정책이 없는 경우를 상정하는데, 통제기구협정에는 그런 규정이 없다. 스트랭은 이 문장이 합의가 없을 때 각국 정부에 자기 지대에서 완전한 행동의 자유를 주는 것인지, 그리하여 어느 한 사령관이 통제이사회의 합의를 무산시켜 자기 지대에서 완전한 행동의 자유를 얻을 수 있게 되는 것인지 물었다.", "위넌트는 많은 경우 조치를 정지시킬 수 없으며, 합의된 정책이 없으면 사령관은 자국 정부의 훈령에 따라 자기 지대에서 행동하여야 한다고 강조하였다. 미국이 지대별 독자 행동의 여지를 명문으로 남기려 한 대목이다.", "마시글리와 스트랭은 반대로 합의 실패 시 문제를 각국 정부에 회부하고 그동안 조치를 정지시켜야 한다고 보았으며, 마시글리는 「독일 전체에 영향을 미치는 사항」이라면 네 사령관의 통일된 행동이 필요하다고 했다.", "스트랭은 통제기구협정이 「합의된 결정」을 전제하는 데 반해 미국 지령은 「합의가 없는 경우」를 상정한다는 중요한 차이를 지적하고, 미국 지령이 「덜 낙관적(less optimistic)」이라고 결론지었다.", "스트랭은 제1항을 통째로 빼자고 제안하였고, 마시글리는 (1) 이사회에서 합의에 이르도록 최선을 다하고 (2) 불일치는 각국 정부에 회부하며 (3) 그런 뒤에야 자기 지대에서 독자로 행동하도록 둘째 문장을 고쳐 쓰자고 하였다.", "구세프가 제1항 토의에 눈에 띄게 참여하지 않자, 위넌트는 미국 정부가 승인된 대로의 통제기구협정을 전폭 지지하며 「일반지령」의 어떤 것도 그 협정과 모순되거나 그것을 약화시키려는 뜻이 아니라고 토의 끝에 다시 밝혔다."], "primary": "런던, 1945년 5월 7일 오후 10시.\n[접수 5월 7일 — 오후 8시 11분]\n\n4628. Cornea 230. 유럽자문위원회(EAC)는 5월 3일 회의에서 4월 6일자 EAC 45/30으로 회람된 미국 초안 「일반지령(General Directive)」을(4월 20일자 정오표를 포함하여) 상세히 검토하기 시작하였다. [주28] 토의를 열면서 구세프(Gousev)와 스트랭(Strang)은 「일반지령」의 몇몇 점이 얄타 회담의 결정들과 부합하지 아니한다는 견해를 힘주어 밝혔다. 나는 「일반지령」이 얄타 결정에 근거하고 있으며 그 범위 안에 들도록 기초되었다고 주장하였다.\n\n제1항. 구세프는 이 항이 통제기구협정(control machinery agreement) 제1조에 이미 담겨 있는데 어찌하여 새로운 서술이 필요한가고 물었다. 스트랭 또한 통제기구협정이 이 주제에 관하여 필요한 것을 다 말하였다고 여겼으며 이 항이 필요하다고 보지 아니하였다. [나는] 총사령관들에게 보내는 지령에는 이 항을 넣어 두는 것이 도움이 된다고 대답하였다.\n\n스트랭은 제1항이 통제이사회가 「계획을 발의하고 합의된 결정에 이른다(to initiate plans and reach agreed decisions)」고 규정한 통제기구협정 제3조와 부합하지 아니한다고 다투었다. 그는 「일반지령」 제1항에 쓰인 「정책을 정식화한다(to formulate policy)」는 표현이 통제기구협정을 논의하는 동안 제안되었다가 부결되었던 것임을 상기시켰다. 그는 어떤 차이를 의도한 것인지 물었다. 나는 어떤 차이도 의도되지 아니하였다고 말하고, 제1항의 자구를 통제기구협정과 맞추기 위하여 그 항을 다시 기초하는 문제를 검토하겠다고 제의하였다.\n\n스트랭은 제1항 둘째 문장이 통제기구협정을 넘어선다고 지적하였다. 곧 통제기구협정은 합의된 연합국 정책이 없는 경우의 사태에 관하여 구체적으로 규정하고 있지 아니하다는 것이다. 그는 통제이사회의 만장일치 결정에 관한 규정을 논의할 때, 통제이사회가 합의된 [505면] 정책에 이르지 못하면 총사령관들이 그 문제를 자국 정부에 회부하리라는 것이 비공식으로 양해되었었다고 상기시켰다. 스트랭은 이 문장이 합의된 정책이 없을 때 각국 정부에게 자기 지대에서 완전한 행동의 자유를 주는 것인지, 그리고 그렇게 되면 어느 한 총사령관이 통제이사회의 합의를 부정하고 그리하여 자기 지대에서 완전한 행동의 자유를 얻을 수 있게 되는 것인지 물었다.\n\n마시글리(Massigli) [주29] 는 이사회에서 합의에 이르지 못하면 다투어진 문제가 각국 정부에 회부되고 그동안 조치는 정지되리라고 보았다. 스트랭은 그것이 「독일 전체에 영향을 미치는 사항」에 적용되는 한에서는 이 해석에 동의하였다. 나는 많은 경우 조치를 정지시킬 수 없으며 합의된 정책이 없을 때에는 사령관이 자국 정부의 훈령에 따라 자기 지대에서 행동하여야 할 것임을 강조하였다. 마시글리는 이와 달리, 이사회에 올라올 만큼 중요한 원칙 문제라면 그로써 네 사령관 모두의 통일된 행동이 요구된다고 여겼다.\n\n스트랭은 통제기구협정과 미국 「일반지령」 사이에 하나의 중요한 차이가 있다고 주장하였다. 곧 전자는 합의된 결정을 전제하는 데 견주어 후자는 합의된 결정이 없는 경우를 상정한다는 것이다. 그는 미국 「일반지령」이 「덜 낙관적(less optimistic)」이라고 결론지었다. 마시글리는 미국 지령이 합의된 결정에 이르고 엇갈리는 견해를 조정하여야 할 지상의 필요를 사령관들에게 각인시키지 아니한 점에서 잘못되었다고 여겼다. 그는 둘째 문장을 다시 적어, 사령관들은 첫째로 이사회에서 합의에 이르도록 할 수 있는 모든 것을 다 하여야 하고, 둘째로 불일치는 자국 정부에 회부하여야 하며, 셋째로 그런 뒤에야 비로소 자기 지대에서 독자로 행동하도록 규정할 것을 제안하였다.\n\n스트랭은 통제기구협정에서 이미 말한 것에 무엇인가를 덧붙일 필요가 있는지 물었다. 그는 제1항을 통째로 빼고, 총사령관들이 합의하지 못할 경우 자국 정부와 협의하면서 통제협정을 운영해 나가도록 맡겨 두자고 제안하였다. 구세프가 제1항 토의에 자못 두드러지게 참여하지 아니한 것을 보아, 나는 이 부분의 토의를 마치면서, 미국 정부는 승인된 대로의 통제기구협정을 전폭 지지하며[to] 「일반지령」의 어떤 것도 그 협정과 모순되거나 그것을 약화시키려는 뜻이 아니라고 다시 밝혔다.\n\n미국 「일반지령」에 관한 그 이상의 토의는 나의 다음 전보 4629번을 보라. [주30] 이 전보는 머피에게 전하도록 파리에 나의 249번으로 반복 발신하였다.\n\n국무부에 4628번으로 발신하고, 머피 대사에게 전하도록 파리에 나의 248번으로 반복 발신하였다.\n\n위넌트\n\n[506면]", "secondary": "London, May 7, 1945—10 p.m. \n [Received May 7—8:11 p.m.]\n\n4628. Cornea 230. At its May 3 meeting the European Advisory Commission began the detailed consideration of the US draft General Directive circulated as EAC 45/30 of April 6, with corrigendum of April 20. [주28] In opening the discussion Gousev and Strang stated emphatically their views that certain points in the General Directive are not in accord with the decisions of the Yalta Conference. I maintained that the General Directive is based on and drafted to fall within the scope of the Yalta decisions.\n\nParagraph 1. Gousev stated that this paragraph was incorporated in article 1 of the control machinery agreement and asked why any new statement was needed. Strang also felt that the control machinery agreement had said all that was necessary on this subject and saw no need for this paragraph. [I] replied that in a directive addressed to the Commanders in Chief it was helpful to have this paragraph included.\n\nStrang contended that paragraph 1 was not in accord with article 3 of the control machinery agreement which states that the Control Council is “to initiate plans and reach agreed decisions”. He recalled that the expression “to formulate policy” used in paragraph 1 of the General Directive had been proposed during discussion of the agreement on control machinery and had been rejected. He asked whether a difference was intended. I stated that no difference was intended and offered to consider a redrafting of paragraph 1 to bring its wording into line with the control machinery agreement.\n\nStrang pointed out that the second sentence of paragraph 1 goes beyond the control machinery agreement in that the latter does not provide specifically for the contingency of there being no agreed Allied policy. He recalled that in discussing the provision for unanimous decisions by the Control Council it had been informally understood that if the Control Council failed to reach an agreed [505면] policy the Commanders in Chief would refer the matter to their governments. Strang asked whether this sentence gives complete liberty of action to each government in its zone in absence of agreed policies and whether any one Commander in Chief would then be able to negate agreement in the Control Council and thus to obtain complete liberty of action in his zone.\n\nMassigli [주29] felt that failure to agree in the Council would mean that the question in dispute would be referred to the governments and that action would meanwhile be suspended. Strang agreed with this interpretation in so far as it applied to “matters affecting Germany as a whole”. I emphasized that in many instances action could not be suspended and that in absence of an agreed policy the Commander would have to act in his zone on instructions from his own government. Massigli felt on the other hand that any matter of principle important enough to come before the Council would thereby require uniform action by all four Commanders.\n\nStrang alleged one important difference between the control machinery agreement and the US General Directive; the former assumes agreed decisions while the latter postulates the case of no agreed decision. He concluded that the US General Directive was “less optimistic”. Massigli felt that the US Directive erred in not impressing on the Commanders the paramount necessity for reaching agreed decisions and reconciling divergent views. He proposed recording the second sentence to provide that the Commanders must, first, do everything possible to reach agreement in the Council and second refer disagreements to their governments; and, third, only later act independently in their zones.\n\nStrang asked whether it was necessary to add anything to what had been said in the control machinery agreement. He proposed omitting paragraph 1 entirely, and leaving it to the Commanders in Chief to work the control agreement, consulting their governments in case they cannot agree. In view of Gousev’s rather marked non-participation in discussion of paragraph 1, I again stated at the close of this part of the discussion that the US Government gives full support of [to] the control machinery agreement as approved and that nothing in the General Directive is intended to contradict or weaken that agreement.\n\nFor further discussion of the US General Directive see my following telegram 4629, [주30] repeated to Paris for Murphy as my 249.\n\nSent to Department as 4628, repeated to Paris for Ambassador Murphy as my 248.\n\nWinant\n\n[506면]", "notes": ["[주28] 1945년 4월 20일자 유럽자문위원회 미국 대표(위넌트)의 비망록 — 4월 21일 런던발 공한 22568호로 국무부에 전달되었다 — 에서 패전 직후 초기 시기 독일의 처리에 관한 미국 초안 일반지령 본문의 빠진 부분이 바로잡혔다(740.00119 EAC/4–2145). 480면 각주 20에 밝혀 둔 바와 같이, E.A.C.에 제출된 실제 미국 초안 일반지령은 서두의 한 항이 빠진 것을 제외하고는 루스벨트 대통령이 승인한 3월 23일자 비망록과 동일하였으므로 인쇄하지 아니하였다. 따라서 위넌트 대사의 이 전보와 바로 다음 전보에서 초안 일반지령 제1항에 관한 항 번호는 3월 23일자 비망록의 제2항을 가리키며, 초안 일반지령 제2항은 3월 23일자 비망록의 제3항을 가리키게 되고, 이하 마찬가지이다.", "[주29] 르네 마시글리(Rene Massigli), 유럽자문위원회 프랑스 대표.", "[주30] 바로 아래 문서."], "warn": false, "pages": ["505", "506"], "search": "John G. Winant 위넌트 (주영대사, 유럽자문위원회 미국 대표) Fedor T. Gousev 구세프 (유럽자문위원회 소련 대표) William Strang 스트랭 (유럽자문위원회 영국 대표) Rene Massigli 마시글리 (유럽자문위원회 프랑스 대표) Robert Murphy 머피 (대독일 정치고문) Franklin D. Roosevelt 루스벨트 (각주)"}, {"id": "d354", "order": 354, "date": "1945-05-07", "group": "A", "eyebrow": "d354 · The Ambassador in the United Kingdom (Winant) to the Secretary of State", "title": "주영대사(위넌트)가 국무장관에게", "badge": null, "list_right": "문서 354", "meta": [{"k": "일자", "v": "1945-05-07"}, {"k": "시각", "v": "London, May 7, 1945—10 p.m. [Received 11:11 p.m.]"}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "4629 (Comea 231)"}, {"k": "원문출처", "v": "740.00119 E.A.C./5–745: Telegram", "txt": true}, {"k": "발신", "v": "주영대사 위넌트(John G. Winant, The Ambassador in the United Kingdom)", "txt": true}, {"k": "수신", "v": "국무장관(The Secretary of State)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 354 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d354"}], "summary": "앞 전보에 이어 5월 3일 유럽자문위원회 회의에서 미국 초안 「일반지령」 제2항부터 제5항까지, 곧 독일의 정치적·경제적 분권화와 경제 통제, 생활수준 상한을 두고 오간 토의를 보고한 전보이다.", "points": ["구세프는 제2항 첫 문장이 독일 행정기구를 현재의 나치 형태 그대로 존치하는 것을 함축하며 나치 법률과 제도를 폐지하기로 한 얄타 결정에 관하여 아무 말도 하지 않는다고 이의를 제기하였다.", "마시글리는 독일 정치구조의 분권화 또는 연방화 원칙에 프랑스가 찬성한다고 밝혔다. 공화국 시절과 히틀러 아래에서 쌓아 올려진 완전한 중앙집권적 정치구조는 패전으로 이미 무너졌으며, 그것을 되살리는 것은 잘못일 것이라고 하였다.", "위넌트는 「외교(foreign affairs)」라는 말을, 통상의 대외정치정책이라는 뜻이 아니라 경제관계와 재외 독일 국민·재산의 통제를 포함하는 「국제관계(international relations)」로 해석한다고 밝혔다.", "「독일 경제 또한 분권화된다」는 구절은 산업의 지리적 재배치가 아니라, 경제에 대한 통제를 분산하고 거대 집중·독점·카르텔이 독일 경제를 지배하는 힘을 없애며 나치가 세운 중앙 경제통제를 가능한 한 많이 제거하는 장기 정책을 뜻한다고 설명하였다.", "구세프는 제4항의 「통제가 부과될 수 있다(controls may be imposed)」는 표현에 강하게 반대하였다. 「may」는 통제가 「부과될 수도 있고 아니 될 수도 있다」는 뜻이라는 것이며, 전쟁에 쓰일 수 있는 모든 생산의 제거 또는 통제를 요구한 얄타 선언이 훨씬 명확하다고 하였다.", "마시글리는 본국 정부의 훈령에 따라 제4항을 「독일 경제는 필요한 모든 통제에 종속될 것이며, 특히」 A와 B에 열거된 통제를 받는다고 시작하도록 제안하였다.", "생활수준에 관하여 위넌트는, 독일의 수준은 이웃 국제연합 국가들 가운데 가장 낮은 수준과 같을 수도 있고 그보다 더 낮을 수도 있으나 어떤 경우에도 그 가장 낮은 수준보다 높을 수는 없다는 것이 자신의 이해라고 밝혔다.", "미국 「일반지령」에 관한 토의는 유럽자문위원회의 이른 회의에서 계속하기로 합의되었다."], "primary": "런던, 1945년 5월 7일 오후 10시.\n[접수 오후 11시 11분]\n\n4629. Comea 231. 5월 3일 유럽자문위원회 회의에서 이루어진 미국 「일반지령」에 관한 그 이상의 토의. 5월 7일 오후 10시 국무부 앞 나의 4628번을 보라 — 머피에게 전하도록 파리에 나의 248번으로 반복 발신하였다.\n\n「일반지령」 제2항. 구세프는 첫 문장이 독일 행정기구를 현재의 나치 형태 그대로 존치하는 것을 함축하며 나치 법률과 제도를 폐지하기로 한 얄타 결정에 관하여 아무것도 말하지 아니한다는 이유로 이의를 제기하였다. 나는 이 점들이 「일반지령」 제6항, 제8항, 제9항에서 다루어졌음을 지적하고 얄타의 자구를 넣겠다고 제의하였다. 마시글리는 독일 정치구조의 분권화 또는 연방화 원칙에 프랑스가 찬성한다는 뜻을 밝혔다. 그는 공화국 시절과 히틀러 아래에서 아울러 쌓아 올려진 완전히 중앙집권적인 정치구조를 되살리는 것은 잘못일 것이라고 여겼으며, 더욱이 그 구조는 패전으로 이미 해체되었다고 하였다.\n\n스트랭은 얄타 선언과 영국 초안 지령 제1호 제3항에 근거하여 점령의 목적을 밝히는 서술로 이 지령을 시작할 것을 제안하였다. [주31]\n\n스트랭은 이 항에 나오는 「외교(foreign affairs)」라는 말에 관하여 묻고, 독일에 무슨 「외교」가 있겠는가고 따졌다. 나는 이것을 경제관계와 재외 독일 국민 및 재산의 통제를 포함하는 「국제관계(international relations)」를 뜻하는 것으로 해석하며, 대외정치정책이라는 통상의 뜻에서의 「외교」는 아니라고 하였다.\n\n마시글리는 이 항에서 말하는 「통제(controls)」가 연합국의 통제인가 독일의 통제인가고 물었다. 나는 연합국의 통제를 뜻하되 어떤 통제는 더 직접적으로, 다른 통제는 더 간접적으로 행사될 수 있다고 말하였다. 스트랭은 A, B, C 아래 제시된, 통제가 허용되는 목적들의 목록이 한정적인 성격인지 예시적인 성격인지 물었다. 나는 이 통제들이 아마도 처음부터 긴요할 것이라고 말하였다. 스트랭은 둘째 문장을 「허용하거나 설치할 수 있다(may permit or establish)」 대신 「허용하거나 설치한다(shall permit or establish)」로 고치고, 열거가 망라적인 것을 뜻하지 아니함을 나타내기 위하여 「중앙통제를 설치한다」는 말 뒤에 「특히(in particular)」라는 말을 넣을 것을 제안하였다. 구세프는 「독일 경제 또한 분권화된다」는 말의 뜻을 따져 물었다. 그는 이것이 경제 자체의 분권화를 뜻하는지 아니면 [507면] 경제 행정의 분권화를 뜻하는지 물었다. 나는 이 말이 그가 처음에 이해한 바와 같은 산업의 지리적 재배치를 상정한 것이 아니라, 오히려 경제에 대한[of] 통제를 분권화하고, 거대한 집중·독점·카르텔이 독일 경제를 지배하는 힘을 제거하며, 나치가 세운 중앙 경제통제를 가능한 한 많이 없애는 장기 정책이라고 설명하였다.\n\n스트랭은 경제적 분권화가 정치구조의 분권화와 나란한 경제행정의 분권화를 함축하는지, 그리고 각 연방 정치단위마다 그에 대응하는 경제단위를 갖게 되는지 물었다. 그는 하나의 중앙통제 대신에 여러 개의 연방적 또는 지역적 경제통제가 있게 되는가고 물었다. 나는 대답으로 위험한 경제력 집중을 해체할 필요를 다시 강조하였다. 영국 대표단은 중앙집권적 통제 가운데 문제되는 부분만을 폐지하려는 것인지, 아니면 쓸모 있는 통제 기능은 지역 및 지방 당국으로 옮기려는 것이기도 한지 물었다. 나는 어떤 통제는 전쟁 목적으로 만들어진 것이므로 폐지될 것이며, 다른 통제는 민간의 필요에 이바지하도록 구성 연방주(federal states)의 통제 아래 놓일 수도 있다고 말하였다. 스트랭은 제2항의 목표를 다음과 같이 다시 정리하였다. 곧 정치적 분권화에 뒤이은 경제적 분권화, 그리고 너무 많은 산업을 그 통제 아래 모아 놓은 산업단체들의 해체이다. 마시글리는 「일반지령」의 이 부분에 대한 검토를 쉽게 하도록 미국 대표단이 설명 비망록을 제공해 줄 것을 요청하였다.\n\n지령 제3항에는 아무 의견도 나오지 아니하였다.\n\n제4항. 구세프는 「통제가 부과될 수 있다(controls may be imposed)」는 말에 강하게 반대하였다. 그는 「할 수 있다(may)」는 말이 통제가 「부과될 수도 있고 부과되지 아니할 수도 있다」는 것을 함축한다고 말하였다. 그의 의견으로는, 전쟁 목적에 쓰일 수 있는 모든 생산의 제거 또는 통제를 요구한 얄타 선언이 훨씬 더 명확하다는 것이다. 그는 산업의 매우 큰 부분이 전쟁 목적에 쓰일 수 있음을 지적하고, 이러한 산업들은 반드시 통제되어야 한다고 말하였다.\n\n마시글리는 본국 정부의 훈령에 따라 제4항을 다음의 말로 시작할 것을 제안하였다. 곧 「독일 경제는 필요한 모든 통제에, 특히」 A와 B 아래 열거된 통제에 「종속될 것이다」.\n\n스트랭은 제4항에서 연합국의 통제를 뜻하는 것인지 물었다. 나는 제4항에서는 연합국의 통제를 뜻하며 대체로 말하여 제5항에서는 독일의 통제를 뜻한다고 밝혔다.\n\n마시글리는 제4항 둘째 문장이 독일의 생활수준이 이웃한 어느 국제연합 국가의 생활수준과 같을 수 있다는 뜻인지 물었다. 나는 이 말이 독일의 수준은 이웃한 가장 낮은 수준과 같을 수 있고, 가장 낮은 수준보다 더 낮을 수도 있으나, 어떤 경우에도 그 가장 낮은 수준보다 높을 수는 없다는 뜻이라는 것이 나의 이해라고 말하였다. [508면]\n\n수입 대금의 지불을 수출에 대한 제1순위 부담으로 취급한다는 문장에 관하여, 마시글리와 스트랭은 이것이 「허가된 수입(authorized imports)」을 가리키는 것인지 물었다. 나는 수입과 수출이 모두 통제될 것이므로 그러하다고 말하였다.\n\n제4항의 마지막 문장에 관하여 마시글리는 독일의 배상을 받는 나라들이 그만큼 「독일 경제에 의존하게」 되는 것이 아닌가고 물었다. 나는 이 말을 다른 나라들이 앞으로 또는 장기적으로 독일 경제에 의존하게 되는 일은 피하여야 한다는 뜻으로 해석하였다.\n\n제5항. 마시글리는 「그러한 통제의 행정을 떠맡는다(assume administration of such controls)」는 표현이 독일 당국에 큰 권한을 준다고 여겼다. 그는 「행정(administration)」 대신에 「시행(execution)」이라는 말을 넣을 것을 제안하였다.\n\n미국 「일반지령」에 관한 토의는 유럽자문위원회의 이른 회의에서 계속하기로 합의되었다.\n\n국무부에 발신하고, 머피 대사에게 전하도록 파리에 나의 249번으로 반복 발신하였다.\n\n위넌트", "secondary": "London, May 7, 1945—10 p.m. \n [Received 11:11 p.m.]\n\n4629. Comea 231. Further discussion of US General Directive in May 3 meeting of the European Advisory Commission. See my 4628, May 7, 10 p.m. to Department, repeated to Paris for Murphy as my 248.\n\nParagraph 2 of the General Directive. Gousev objected to the first sentence on grounds that it implies retention of the German administrative machine in its present Nazi form and says nothing about Yalta decisions to abolish Nazi laws and institutions. I pointed out that these points were covered in paragraphs 6, 8 and 9 of the General Directive and offered to include the Yalta wording. Massigli expressed French support for the principle of decentralization or federalization of the German political structure. He felt it would be a mistake to restore the completely centralized political structure which had been built up under both the Republic and Hitler, especially since that structure had disintegrated in defeat.\n\nStrang proposed that the Directive begin with a statement of the purposes of occupation, based on the Yalta declaration and on paragraph 3 of the United Kingdom draft Directive No. 1. [주31]\n\nStrang asked about the reference to “foreign affairs” in this paragraph, and questioned whether Germany would have any “foreign affairs”. I interpreted this to mean “international relations” including economic relations and control of German Nationals and property abroad, but not “foreign affairs” in the usual sense of foreign political policy.\n\nMassigli asked if the “controls” referred to in this paragraph were Allied or German controls. I stated that Allied controls were meant but that some controls might be exercised more directly and others more indirectly. Strang asked whether the list of purposes for which controls were permitted, as set forth under A, B and C, is exclusive or illustrative in character. I stated that these controls would probably be essential from the beginning. Strang proposed that the second sentence read: “shall permit or establish” instead of “may permit or establish”, and that the words “in particular” be inserted after the words “establish central control”, in order to indicate that the enumeration is not intended to be exhaustive. Gousev questioned the meaning of the words “German economy shall also be decentralized”. He asked whether this meant decentralization of the economy itself or [507면] decentralization of the administration of the economy. I explained that these words did not envisage geographical redistribution of industry which he had at first understood, but rather a long term policy of decentralizing the control or [of] economy, removing the power of great concentrations, monopolies and cartels to dominate German economy, eliminating as many as possible of the central economic controls established by the Nazis.\n\nStrang asked whether economic decentralization implied decentralization of the economic administration parallel with the decentralization of the political structure and whether each federal political unit would have a corresponding economic unit. He asked whether in place of a single central control there would be a number of federal or regional economic controls. In reply I again stressed the need for breaking up dangerous concentrations of economic power. The United Kingdom delegation asked whether it was intended merely to abolish the objectionable parts of centralized control or also to transfer any useful functions of control to regional and local authorities. I stated that some controls would be abolished as they had been created for war purposes; others might be placed under the control of the component federal states to serve civilian needs. Strang restated the objectives of paragraph 2 as follows: Economic decentralization to follow political decentralization; breaking up industrial associations which had gathered too many industries under their control. Massigli requested the United States delegation to provide an explanatory memorandum to facilitate consideration of this part of the General Directive.\n\nParagraph 3 of the directive met with no comment.\n\nParagraph 4. Gousev took strong exception to the words “controls may be imposed”. He stated that the word “may” implied that controls “may or may not” be imposed. In his opinion, the Yalta declaration, which called for the elimination or control of all production that can be used for war purposes, is much more definite. He pointed out that a very large part of industry can be used for war purposes, and stated that these industries must be controlled.\n\nOn instructions from his Government, Massigli proposed that paragraph 4 begin with the following words: “German economy will be subjected to all necessary controls, particularly” those enumerated under A and B.\n\nStrang asked whether Allied controls were meant in paragraph 4. I indicated that Allied controls were meant in paragraph 4 and, generally speaking, German controls in paragraph 5.\n\nMassigli asked whether the second sentence of paragraph 4 meant that Germany’s standard of living could be equal to that of any neighboring United Nation. I stated my understanding that these words mean that Germany’s standard may be equal to the lowest [508면] neighboring standard, lower than the lowest but in no case higher than the lowest.\n\nWith regard to the sentence about treating payment for imports as a first charge on exports, Massigli and Strang asked whether this referred to “authorized imports”. I stated that this was the case since both imports and exports would be controlled.\n\nRegarding the last sentence of paragraph 4 Massigli asked whether countries receiving German reparations would not be “dependent on German economy” to that extent. I interpreted these words to mean that future or long range dependence of other countries on German economy should be avoided.\n\nParagraph 5. Massigli felt that the expression “assume administration of such controls” gave great power to the German authorities. He suggested that the word “execution” be substituted for “administration”.\n\nIt was agreed to continue the discussion of the US General Directive at an early meeting of the EAC.\n\nSent to Department, repeated to Paris for Ambassador Murphy as my 249.\n\nWinant", "notes": ["[주31] 항복 후 시기 독일에 관한 영국 초안 일반지령의 본문은 Foreign Relations, 1944, vol. i, p. 226 참조."], "warn": false, "pages": ["507", "508"], "search": "John G. Winant 위넌트 (주영대사, 유럽자문위원회 미국 대표) Fedor T. Gousev 구세프 (유럽자문위원회 소련 대표) William Strang 스트랭 (유럽자문위원회 영국 대표) Rene Massigli 마시글리 (유럽자문위원회 프랑스 대표) Adolf Hitler 히틀러 Robert Murphy 머피 (대독일 정치고문)"}, {"id": "d566", "order": 566, "date": "1945-05-07", "group": "C", "eyebrow": "d566 · Memorandum of Telephone Conversation, by the Acting Secretary of State", "title": "국무장관 대리의 전화 통화 비망록", "badge": null, "list_right": "문서 566", "meta": [{"k": "일자", "v": "1945-05-07"}, {"k": "시각", "v": "[Washington,] May 7, 1945—1:45 p.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 EW/5–745", "txt": true}, {"k": "발신", "v": "국무장관 대리 그루(Joseph C. Grew, The Acting Secretary of State) — 기록자", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전화 비망록"}], "links": [{"k": "FRUS", "text": "문서 566 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d566"}], "summary": "리히 제독이 국무장관 대리 그루에게 전화하여 유럽전승기념일(V–E Day) 발표를 둘러싼 혼란의 경위를 알려 주었다. 처칠은 당장 발표하려 하고 스탈린은 답이 없으며 드골은 독자로 발표하려 한다. 그루가 그 통화를 받아 적은 비망록이다.", "points": ["리히 제독은 유럽전승기념일 발표를 둘러싼 상황이 「지독하게 혼란스럽다(terribly confused)」고 말하였다.", "미국은 스탈린 및 처칠과 이튿날 아침 9시에 발표하기로 하는 합의를 맺어 두고 있었다. 그런데 처칠이 이날 「불같이 화를 내며(raised the devil)」 당장 발표하여야 한다면서 이날 정오에 발표하겠다고 하였다.", "대통령(트루먼)은 그때 발표하기를 거절하고, 스탈린 및 처칠과 9시에 발표하기로 짜 두었으니 스탈린의 동의 없이는 그 합의를 어길 수 없다고 하였다. 미국이 발표를 늦춘 근거는 소련과의 합의였다.", "스탈린과 연락을 대려고 애썼으나, 그가 조건을 알지 못하여 아직 발표할 수 없다는 막연한 생각 말고는 아무것도 받은 것이 없었다. 소련 쪽의 침묵이 발표 시각을 붙들어 두고 있었다.", "리히는 그 뒤 BBC를 통하여 처칠이 3시에 발표할 것이라는 말을 들었다고 하였고, 드골은 2시에 발표할 것이라고도 들었다고 하였다. 그는 드골을 통제할 수 있는 사람은 아무도 없으며 이런 행동이 그다운 짓이라고 하였다. 그루는 동의하면서 드골이 「말썽꾸러기 아이(naughty boy)처럼 굴고 있다」고 말하였다.", "리히는 20분쯤 전에 대통령과 이야기하였는데 이튿날 아침 9시로 확정된 것으로 여긴다고 하였고, 이 일이 중단되는 유일한 길은 스탈린이 아직 발표하지 말아 달라고 요청하는 것뿐이라고 하였다.", "아이젠하워는 아무 발표도 하지 않았고 지킬 수 있는 한 비밀로 지켜 왔으며 여기(워싱턴)에서 공표되기 전에는 아무 발표도 하지 않겠다고 말하였다. 그루는 AP를 통하여 새어 나간 것으로 안다고 하였고, 리히는 독일인들이 평문(平文)으로 자유로이 그 이야기를 하고 있어 누구나 알고 있다고 하였다."], "primary": "[워싱턴,] 1945년 5월 7일 오후 1시 45분.\n\n리히(Leahy) 제독이 나에게 전화하여, 유럽전승기념일(V–E Day) 발표에 관한 상황이 지독하게 혼란스럽다고 말하고 가장 최근 정보의 배경을 내가 알아 두기를 바란다고 하였다. 그는 우리가 스탈린 및 처칠과 내일 아침 9시에 발표하기로 하는 합의를 맺어 두었으나, 처칠이 오늘 불같이 화를 내며 자기는 당장 발표하여야 한다고 말하고 오늘 정오에 발표하기를 바랐다고 하였다. [주77] 리히 제독은 대통령이 그때 발표하기를 거절하고, 스탈린 및 처칠과 9시에 발표하기로 짜 두었으므로 스탈린의 동의 없이는 그 합의를 어길 수 없다고 말하였다고 하였다. 리히 제독은 그들이 스탈린과 연락을 대려고 애써 왔으나 그가 조건을 알지 못하며 아직은 발표할 수 없다는 막연한 생각 말고는 지금까지 그에게서 아무것도 받은 것이 없다고 하였다. 리히 제독은 그 뒤에 BBC를 통하여 처칠이 3시에 발표할 것이라는 말을 들었다고 하였다. 그는 또 드골이 2시에 발표할 것이라는 말도 들었다고 하였다. 그는 아무도 드골을 통제하지 못하며 이러한 행동은 그에게 전형적인 것이라고 말하였다. 나는 리히 제독의 말에 동의하고, 드골이 꼭 말썽꾸러기 아이처럼 굴고 있다고 말하였다. 리히 제독은 20분쯤 전에 대통령과 이야기하였으며 내일 아침 9시로 확정된 것으로 생각한다고 하였다. 그는 이 일이 중단될 유일한 길은 스탈린이 우리에게 아직 발표하지 말아 달라고 요청하는 것뿐이라고 하였다. 리히 제독은 또 아이젠하워와도 연락을 대었는데 그는 아무 발표도 하지 아니하였고 지킬 수 있는 한 그것을 비밀로 지켜 왔다고 말하였다고 하였다. 그는 여기에서 공표되기 [779면] 전에는 아무 발표도 하지 아니하겠다고 말하였다고 한다. 나는 그것이 AP를 통하여 새어 나갔다고 들었다고 말하였다. [주78] 리히 제독은 독일인들이 평문(平文)으로 그것에 관하여 거리낌 없이 이야기하고 있으므로 누구나 다 알고 있다고 말하였다. 나는 어쨌든 이 일 전체에 관하여 언짢아할 사람은 신문기자들뿐일 것이라고 말하였다.", "secondary": "[Washington,] May 7, 1945—1:45 p.m.\n\nAdmiral Leahy telephoned me and said that the situation on the announcement of V–E Day was terribly confused and he wanted me to know the background of the latest information. He stated that we have an agreement with Stalin and Churchill to make the announcement at 9 o’clock tomorrow morning but Churchill today raised the devil because he said he had to make the announcement right away and wanted to make it at noon today. [주77] Admiral Leahy said the President declined to do it then and said that he had arranged with Stalin and Churchill to announce it at 9 o’clock and he could not violate his agreement without the assent of Stalin. Admiral Leahy said they had been trying to get in touch with Stalin but so far have had nothing from him except the vague thought that he doesn’t know the terms and can’t make an announcement as yet. Admiral Leahy said he had heard later through BBC that Churchill was going to make the announcement at 3 o’clock. He said that he also had heard that de Gaulle is going to announce it at 2 o’clock. He stated that nobody has any control over de Gaulle and that this action was typical of him. I agreed with Admiral Leahy and remarked that de Gaulle was acting just like a naughty boy. Admiral Leahy said he spoke to the President about 20 minutes ago and thought it was definite for 9 o’clock tomorrow morning. He said that the only way the thing would be stopped would be for Stalin to ask us not to announce it yet. Admiral Leahy also said that he had been in touch with Eisenhower who said he had made no announcement and has kept it as secret as it could be kept. He said he would not make any announcement until [779면] it was released here. I said I understood it had leaked through AP. [주78] Admiral Leahy said the Germans are talking freely in plain language about it so everyone knows it. I said at any rate the only people who would be displeased about the whole thing would be the newspapermen.", "notes": ["[주77] 5월 7일 오전 10시 10분과 오전 11시 10분에 리히 제독과 처칠 총리 사이에 이루어진 전화 통화의 녹취록, 그리고 유럽전승기념일 발표에 따르는 혼란에 관한 그 밖의 자세한 사정은 Leahy, I Was There, pp. 357–362 참조.", "[주78] 연합통신(Associated Press)."], "warn": false, "pages": ["779"], "search": "Joseph C. Grew 그루 (국무장관 대리, 이 비망록의 기록자) William D. Leahy 리히 (제독, 대통령 참모장) Harry S. Truman 트루먼 (대통령) Joseph Stalin 스탈린 Winston Churchill 처칠 (영국 총리) Charles de Gaulle 드골 Dwight D. Eisenhower 아이젠하워"}, {"id": "d567", "order": 567, "date": "1945-05-07", "group": "D", "eyebrow": "d567 · Marshal Stalin to President Truman  Reprinted from Stalin’s Correspondence, vol. ii, p. 230.", "title": "스탈린 원수가 트루먼 대통령에게", "badge": null, "list_right": "문서 567", "meta": [{"k": "일자", "v": "1945-05-07"}, {"k": "시각", "v": "Moscow, May 7, 1945."}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "Reprinted from Stalin’s Correspondence, vol. ii, p. 230.", "txt": true}, {"k": "발신", "v": "스탈린 원수(Marshal Stalin)", "txt": true}, {"k": "수신", "v": "트루먼 대통령(President Truman)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "서한"}], "links": [{"k": "FRUS", "text": "문서 567 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d567"}], "summary": "독일 항복을 5월 8일 오전 9시(워싱턴 시간)에 발표하겠다는 트루먼의 5월 7일자 통지에 대하여, 스탈린이 동부전선에서 항복 명령이 이행될지 확실하지 않다는 이유로 소련 정부의 발표를 5월 9일 모스크바 시간 오후 7시로 미루고자 한다고 답한 편지이다.", "points": ["붉은군대 최고사령부는 무조건항복에 관한 독일 최고사령부의 명령이 동부전선의 독일군에 의하여 이행되리라고 확신하지 못한다. 스탈린이 내세운 문제는 항복문서의 법적 유효성이 아니라 그 명령의 실제 이행 여부이다.", "따라서 소련 정부가 오늘 독일의 항복을 발표하면 「난처한 처지에 놓이고 소련 대중을 그르치게(mislead the Soviet public)」 될까 두렵다고 하였다. 대외 문제가 아니라 국내 여론을 앞세웠다.", "동부전선의 독일군 저항은 누그러지지 않고 있으며, 감청한 무선 전문으로 판단컨대 상당한 규모의 독일군 집단이 저항을 계속하고 되니츠의 항복 명령에 따르지 않겠다는 뜻을 명시적으로 밝혔다고 하였다.", "이 때문에 소련군 사령부는 독일의 항복이 실제로 효력을 발생할 때까지 기다리고자 하며, 정부의 항복 발표를 5월 9일 모스크바 시간 오후 7
