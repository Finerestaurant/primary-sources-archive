ndon as Department’s no. 3343; repeated to Caserta for Erhardt as Department’s no. 399.\n\nGrew", "notes": [], "warn": false, "pages": [], "search": "Grew 그루(국무장관 대리) Winant 위넌트(주영대사) Erhardt 에어하트(오스트리아 문제 담당 미국 정치고문)"}, {"id": "d194", "order": 194, "date": "1945-04-28", "group": "D", "eyebrow": "d194 · The American Chargé in the Soviet Union (Kennan) to the Assistant People’s Commissar for Foreign Affairs of the Soviet Union (Vyshinski)", "title": "주소련 미국 대리대사(케넌)가 소련 외무인민위원 대리(비신스키)에게", "badge": null, "list_right": "문서 194", "meta": [{"k": "일자", "v": "1945-04-28"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": "No. 225 (대통령 메시지 번호)"}, {"k": "원문출처", "v": "740.00119 Control (Austria)/4–2845", "txt": true}, {"k": "발신", "v": "The American Chargé in the Soviet Union (Kennan) 주소련 미국 대리대사 케넌", "txt": true}, {"k": "수신", "v": "The Assistant People’s Commissar for Foreign Affairs of the Soviet Union (Vyshinski) 소련 외무인민위원 대리 비신스키", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "서한"}], "links": [{"k": "FRUS", "text": "문서 194 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d194"}], "summary": "트루먼이 스탈린에게, 독일과 오스트리아에서 각국 군대가 자기 점령지대로 들어가는 질서 있는 절차에 관한 처칠의 4월 27일자 메시지에 전적으로 동의한다고 전했다.", "points": ["케넌이 대통령의 메시지(제225호, 스탈린 원수 앞 개인·극비)를 비신스키를 통해 전달했다.", "트루먼은 처칠로부터 스탈린과 자기 앞으로 보낸 4월 27일자 메시지를 받았다.", "그 메시지는 독일과 오스트리아에서 각국 군대가 점령할 지대로 들어가는 질서 있는 절차(orderly procedure)에 관한 것이다.", "트루먼은 그 메시지에 전적으로 동의하며, 처칠에게도 마찬가지로 동의를 알리겠다고 했다."], "primary": "모스크바, 1945년 4월 28일.\n\n비신스키 씨 귀하. 본인은 대통령이 스탈린 원수에게 보내는 다음 메시지를 전달하도록 훈령받았습니다.\n\n「제225호, 대통령이 스탈린 원수에게 보내는 개인 및 극비 문서:\n\n「본인은 처칠 총리로부터, 우리 군대가 독일과 오스트리아에서 점령하게 될 지대들로 들어가는 질서 있는 절차에 관하여 귀하와 본인 앞으로 보낸 4월 27일자 메시지를 받았습니다.\n\n「본인은 처칠 총리가 우리 두 사람 앞으로 보낸 위 메시지에 전적으로 동의하며, 총리에게도 마찬가지로 본인의 동의를 알리겠습니다.」\n\n이 메시지가 스탈린 원수에게 전달되도록 조치하여 주시면 감사하겠습니다.\n\n경구,\n\n조지 F. 케넌(George F. Kennan)", "secondary": "Moscow, April 28, 1945.\n\nDear Mr. Vyshinski: I have been instructed to effect transmission of the following message for Marshal Stalin from the President:\n\n“No. 225, Personal and top secret for Marshal Stalin from the President:\n\n“I have received from Prime Minister Churchill a message dated April 27, addressed to you and to myself, with respect to an orderly procedure for the occupation by our forces of the zones which they will occupy in Germany and Austria.\n\n“I am in full agreement with the message referred to above, addressed to both of us by Prime Minister Churchill, and I will inform the Prime Minister likewise of my agreement thereto.”\n\nI would be grateful if you would be good enough to see that this message is transmitted to Marshal Stalin.\n\nSincerely yours,\n\nGeorge F. Kennan", "notes": [], "warn": false, "pages": [], "search": "Kennan 케넌(주소련 대리대사) Vyshinski 비신스키(소련 외무인민위원 대리) Truman 트루먼(대통령) Stalin 스탈린 Churchill 처칠(영국 총리)"}, {"id": "d195", "order": 195, "date": "1945-04-28", "group": "A", "eyebrow": "d195 · The Acting Secretary of State to the Ambassador in France (Caffery)", "title": "국무장관 대리가 주프랑스대사(캐퍼리)에게", "badge": null, "list_right": "문서 195", "meta": [{"k": "일자", "v": "1945-04-28"}, {"k": "시각", "v": "Washington, April 28, 1945—3 p.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "1740"}, {"k": "원문출처", "v": "740.00119 Control (Germany)/4–2545: Telegram", "txt": true}, {"k": "발신", "v": "The Acting Secretary of State (Grew) 국무장관 대리 그루", "txt": true}, {"k": "수신", "v": "The Ambassador in France (Caffery) 주프랑스대사 캐퍼리", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 195 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d195"}], "summary": "합동참모본부가 우선 바덴만 프랑스 점령지대로 넘기자고 제안했으니, 프랑스가 바덴만으로 만족할지 즉시 비공식으로 타진하라는 훈령이다.", "points": ["4월 25일 오후 9시자 대사관 2110호를 참조한다.", "합동참모본부는 미국 정부가 처음에는 바덴을 프랑스 점령지대로 내주겠다고 제의할 것을 제안했다.", "다만 통과권을 충분히 보장한다면 뷔르템베르크와 지그마링겐을 프랑스에 주는 데에도 압도적인 군사적 목표[이의?]는 없다고 본다.", "국무부는 캐퍼리가 프랑스 측에 바덴으로 족한지를 즉시 비공식으로 타진하기를 바란다.", "프랑스 정부가 바덴만으로는 만족하지 않을 것이 유력해 보이므로, 위넌트가 마시글리와 뷔르템베르크·지그마링겐 편입을 논의할 권한을 받게 되리라고 시사해도 좋다.", "EAC에서 프랑스 지대 교섭을 되도록 빨리 매듭짓기 위하여 문의 결과를 위넌트에게 즉시 알리고 국무부에도 반복 발송하라."], "primary": "워싱턴, 1945년 4월 28일 오후 3시.\n\n1740. 4월 25일 오후 9시자 대사관 2110호 참조. 합동참모본부는 우리 정부가 처음에는 바덴을 프랑스 점령지대로 내주겠다고 제의할 것을 제안하였다. 그러나 그들은 통과권을 충분히 보장한다면 뷔르템베르크와 지그마링겐을 프랑스에 주는 데에 압도적인 군사적 목표[이의?]는 없다고 본다.\n\n국무부는 귀하가 바덴으로 족하겠는지를 프랑스 측에 즉시 비공식으로 타진하기를 바란다. 유력해 보이는 대로 프랑스 정부가 바덴만으로는 만족하지 아니한다면, 귀하는 위넌트가 마시글리와 더불어 뷔르템베르크 및 지그마링겐을 프랑스 지대에 포함시키는 문제를 논의할 권한을 받게 되리라고 시사하여도 좋다. EAC에서의 프랑스 지대에 관한 교섭이 되도록 빨리 매듭지어질 수 있도록, 귀하의 문의 결과를 위넌트에게 즉시 알리고 (국무부에도 반복 발송하라).\n\n그루(Grew)\n\n[247면]", "secondary": "Washington, April 28, 1945—3 p.m.\n\n1740. Re Embs 2110, April 25, 9 p.m. The Joint Chiefs of Staff have proposed that initially this Government offer to release Baden to the French zone of occupation. They see no overriding military objectives [objections?], however, to giving to the French, with adequate safeguards of transit rights, Wurttemberg and Sigmaringen.\n\nThe Department wishes you informally to sound out the French immediately on whether Baden would suffice. If, as appears probable, the French Government would not be satisfied with Baden alone, you may indicate that Winant will be authorized to discuss with Massigli the inclusion of Wiirttemberg and Sigmaringen in the French zone. Please inform Winant immediately (repeating to Department) of the result of your inquiry so that the negotiations in the EAC on the French zone may be concluded as soon as possible.\n\nGrew\n\n[247면]", "notes": [], "warn": false, "pages": ["247"], "search": "Grew 그루(국무장관 대리) Caffery 캐퍼리(주프랑스대사) Winant 위넌트(주영대사) Massigli 마시글리(주영 프랑스대사)"}, {"id": "d196", "order": 196, "date": "1945-04-28", "group": "A", "eyebrow": "d196 · The Acting Secretary of State to the Ambassador in the United Kingdom (Winant)", "title": "국무장관 대리가 주영대사(위넌트)에게", "badge": null, "list_right": "문서 196", "meta": [{"k": "일자", "v": "1945-04-28"}, {"k": "시각", "v": "Washington, April 28, 1945—3 p.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "3332"}, {"k": "원문출처", "v": "740.00119 Control (Germany)/4–2S45: Telegram", "txt": true}, {"k": "발신", "v": "The Acting Secretary of State (Grew) 국무장관 대리 그루", "txt": true}, {"k": "수신", "v": "The Ambassador in the United Kingdom (Winant) 주영대사 위넌트", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 196 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d196"}], "summary": "독일 내 프랑스 점령지대에 관한 합동참모본부 견해를 발췌해 전하고, 캐퍼리의 대프랑스 타진 결과를 기다린 뒤에 마시글리와 이야기하라고 지시했다.", "points": ["합동참모본부가 독일 내 프랑스 점령지대에 관한 견해를 제출했고 오늘 항공우편으로 송부한다.", "발췌: 통과권을 적절히 보장한다면 바덴주·뷔르템베르크주·지그마링겐주를 프랑스에 주는 데 압도적인 군사적 이의는 없다.", "다만 미국 활동이 나중에 뮌헨 지역에 집중될 수 있으므로 뷔르템베르크와 지그마링겐은 보유하는 것이 군사적으로 바람직하다.", "프랑스는 바덴주만 받고도 만족할 수 있으므로 처음에는 그 지역만 내주겠다고 제의할 것을 권고한다.", "무엇을 주든, 미국 지대에 접하고 그 서쪽에 있는 프랑스 지대의 어느 부분이든 통행권을 보장하는 명확한 협정이 필요하며, 특히 미군이 라인강에 놓은 교량과 독일에 구축한 통신 시설에 대한 배타적 권리가 필요하다.", "국무부는 캐퍼리에게 바덴만의 할양으로 만족할지 프랑스 정부에 즉시 타진하여 즉시 위넌트에게 알리도록 지시하고 있다.", "위넌트는 캐퍼리의 보고를 기다린 뒤에 마시글리와 이야기하고, 국무부에 다시 물을 것 없이 캐퍼리가 프랑스가 수락하리라고 알려 온 만큼의 지역을 마시글리에게 제의해야 한다."], "primary": "워싱턴, 1945년 4월 28일 오후 3시.\n\n3332. 합동참모본부가 독일 내 프랑스 점령지대에 관한 견해를 제출하였으며, 이는 오늘 항공우편으로 송부된다. 미국 지대에서 프랑스에 내줄 영토에 관한 부분의 발췌는 다음과 같다.\n\n「통과권에 관하여 적절한 보장이 있다면 바덴주, 뷔르템베르크주 및 지그마링겐주를 프랑스에 주는 데 압도적인 군사적 이의는 없다. 다만 미국의 활동이 나중에 뮌헨 지역에 집중될 수 있으므로 뷔르템베르크와 지그마링겐은 보유하는 것이 군사적으로 바람직하다. 그러나 프랑스는 바덴주만 받고도 만족할 수 있으므로, 처음에는 그 지역만을 내주겠다고 프랑스 측에 제의할 것을 권고한다. 바덴주에 더하여 뷔르템베르크주와 지그마링겐주를 프랑스에 주든 아니 주든, 미국 지대에 접하여 그 서쪽에 놓인 프랑스 지대의 어느 부분이든 이를 통과할 권리를, 특히 미군이 라인강에 가설한 교량들과 미군이 독일에 구축한 통신 시설에 대한 배타적 권리를 보장하는 명확한 협정을 프랑스와 맺을 필요가 있을 것이다.」\n\n국무부는 캐퍼리에게, 바덴만의 할양으로 만족할 것인지를 프랑스 정부에 즉시 타진하여 그 결과를 귀하에게 즉시 알리도록 지시하고 있다. 귀하는 마시글리와 이야기하기에 앞서 캐퍼리의 보고를 기다리기 바란다. 그런 다음 귀하는 프랑스가 수락하리라고 캐퍼리가 알려 오는 만큼의, 합동참모본부가 언급한 지역을 국무부에 다시 문의할 필요 없이 마시글리에게 제의하여야 한다.\n\n그루(Grew)", "secondary": "Washington, April 28, 1945—3 p.m.\n\n3332. The Joint Chiefs of Staff have submitted their views with respect to the French zone of occupation in Germany, which are being transmitted by air mail today. The following is an excerpt respecting the territory to be released from the United States zone to the French:\n\n“There are no overriding military objections to giving to the French, with proper safeguards with regard to transit rights, the State of Baden, the State of Wurttemberg and the Province of Sigmaringen although it is militarily desirable to retain Wurttemberg and Sigmaringen since U.S. activities may, at a later date, be centered in the Munich area. However, the French may be satisfied with receiving the State of Baden only and it is recommended that the release of that area alone be proposed initially to the French. Regardless ,of whether or not the State of Wurttemberg and the Province of Sigmaringen, in addition to the State of Baden, are given to the French, it will be necessary to have a clear agreement with the French guaranteeing rights of passage through any part of the French zone lying contiguous to and west of the U.S. zone, particularly exclusive rights to the bridges which the American forces have built over the Rhine and the communication facilities which the American forces have built in Germany.”\n\nThe Department is instructing Caffery to sound out the French Government immediately as to whether the cession of Baden alone would be satisfactory and to inform you at once of the result of his inquiry. It is desired that you await Caffery’s report before talking with Massigli. You should then offer Massigli such of the area referred to by the Joint Chiefs of Staff as Caffery indicates will be acceptable to the French without further reference to the Department.\n\nGrew", "notes": [], "warn": false, "pages": [], "search": "Grew 그루(국무장관 대리) Winant 위넌트(주영대사) Caffery 캐퍼리(주프랑스대사) Massigli 마시글리(주영 프랑스대사)"}, {"id": "d557", "order": 557, "date": "1945-04-28", "group": "D", "eyebrow": "d557 · The Chairman of the Council of Peopled Commissars of the Soviet Union (Stalin) to President Truman  This message was delivered to the Department by the Soviet Chargé, Novikov, on April 29. A translation for the President was sent to the White House Map Room at 3:50 p.m. It was repeated to the Secretary of State in telegram 5, April 29, 7:36 p.m., to San Francisco.", "title": "소련 인민위원회의 의장(스탈린)이 트루먼 대통령에게", "badge": null, "list_right": "문서 557", "meta": [{"k": "일자", "v": "1945-04-28"}, {"k": "시각", "v": "Received April 27; 대통령용 번역문은 4월 29일 오후 3시 50분 백악관 지도실로 송부"}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 E.W./4–2845", "txt": true}, {"k": "발신", "v": "The Chairman of the Council of People’s Commissars of the Soviet Union (Stalin) 소련 인민위원회의 의장 스탈린", "txt": true}, {"k": "수신", "v": "President Truman 트루먼 대통령", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "서한"}], "links": [{"k": "FRUS", "text": "문서 557 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d557"}], "summary": "스탈린이, 존슨 공사에게 내린 훈령을 알린 트루먼의 메시지를 4월 27일 받았다고 하며, 독일 군대의 무조건 항복을 받아내겠다는 미·영의 결정이 독일 측 제안에 대한 유일하게 옳은 회답이라고 답했다.", "points": ["스탈린은 존슨 씨에게 내린 훈령을 담은 트루먼의 메시지를 4월 27일에 받았다고 했다.", "스탈린은 독일 군대의 무조건 항복(unconditional surrender)을 받아내겠다는 트루먼과 처칠의 결정이, 자기 생각으로는 독일 측 제안에 대한 유일하게 옳은 회답이라고 했다.", "이 메시지는 4월 29일 소련 대리대사 노비코프가 국무부에 전달했다.", "대통령용 번역문은 같은 날 오후 3시 50분 백악관 지도실로 보내졌다.", "4월 29일 오후 7시 36분자 전보 5호로 샌프란시스코의 국무장관에게 반복 발송되었다."], "primary": "[모스크바,] 1945년 4월 28일.\n\n존슨 씨에게 귀하가 내린 훈령에 관한 통보를 담은 귀하의 메시지[주49]를 4월 27일에 받았습니다. 이 메시지에 감사드립니다.\n\n독일 군대의 무조건 항복(unconditional surrender)을 받아내기 위하여 귀하와 처칠 씨가 내린 결정은, 본인의 의견으로는 독일 측 제안들에 대한 유일하게 옳은 회답입니다.", "secondary": "[Moscow,] April 28, 1945.\n\nYour message, [주49] containing the communication concerning the instructions you gave to Mr. Johnson, was received April 27. Thank you for this message.\n\nThe decisions taken by you and Mr. Churchill, to obtain the unconditional surrender of the German armed forces, is, in my opinion, the only correct reply to the German proposals.", "notes": ["[주48] 이 메시지는 1945년 4월 29일 소련 대리대사 노비코프가 국무부에 전달하였다. 대통령을 위한 번역문은 오후 3시 50분에 백악관 지도실로 송부되었다. 이는 4월 29일 오후 7시 36분자 전보 5호로 샌프란시스코의 국무장관에게 반복 발송되었다.", "[주49] 스톡홀름 주재 존슨 공사에게 내린 훈령을 인용한 4월 26일자 전보 7호, 768면을 보라. 그 훈령의 사본은 4월 27일 트루먼 대통령이 스탈린 총리에게 전달하였다."], "warn": false, "pages": [], "search": "Stalin 스탈린(소련 인민위원회의 의장) Truman 트루먼(대통령) Churchill 처칠(영국 총리) Johnson 존슨(주스웨덴공사) Novikov 노비코프(소련 대리대사)"}, {"id": "d818", "order": 818, "date": "1945-04-28", "group": "A", "eyebrow": "d818 · The Ambassador in France (Caffery) to the Secretary of State", "title": "주프랑스대사(캐퍼리)가 국무장관에게", "badge": null, "list_right": "문서 818", "meta": [{"k": "일자", "v": "1945-04-28"}, {"k": "시각", "v": "Paris, April 28, 1945—1 p.m. [Received 5:30 p.m.]"}, {"k": "장소", "v": "Paris", "txt": true}, {"k": "전문번호", "v": "2176"}, {"k": "원문출처", "v": "862.414/4–2845: Telegram", "txt": true}, {"k": "발신", "v": "The Ambassador in France (Caffery) 주프랑스대사 캐퍼리 (머피 발신)", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 818 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d818"}], "summary": "하르츠 산중의 성들에서 발견된 200~400톤의 독일 외무성 문서를 미국 지대의 마르부르크 대학으로 옮길 것을 제안했다.", "points": ["머피 발신. 4월 27일 오후 8시자 2133호와 4월 27일 오전 9시자 2135호를 참조한다.", "본 사절단 요원 2명과 영국 요소 통제이사회 대표가 200~400톤의 독일 외무성 문서를 초벌로 조사했다.", "발견된 문서의 절반은 팔켄슈타인 성, 약 30퍼센트는 데게너스하우스 성, 나머지는 부르크 팔켄슈타인과 슈톨베르크 성에 있었고, 모두 가이스부르크 부근 하르츠 산중에 있다.", "보안과 충분한 조사를 위하여 문서를 미국 지대의 마르부르크 대학으로 옮길 것을 제안한다.", "왕복문서의 대부분은 1943년 이전 것이며 방공협정(반코민테른협정) 원본이 포함되어 있다.", "문서는 발렌틴 박사와 폰 그리스하임 남작이 관리하고 있었는데, 이들이 자진하여 미군 부대장에게 문서의 소재를 알렸다."], "primary": "파리, 1945년 4월 28일 오후 1시.\n [접수 오후 5시 30분]\n\n2176. 머피 발신. 4월 27일 오후 8시자 본직의 2133호 및 4월 27일 오전 9시자 2135호[주57]와 관련하여, 본 사절단 요원 2명과 영국 요소 통제이사회 대표가 200톤에서 400톤에 이르는 독일 외무성 문서를 초벌로 조사하였다. 발견된 문서의 절반은 팔켄슈타인 성(城)에, 약 30퍼센트는 데게너스하우스 성에, 나머지는 부르크 팔켄슈타인과 슈톨베르크 성에 있었으며, 모두 가이스부르크 부근 하르츠 산중에 위치한다. 보안을 위하여, 또 충분한 조사를 용이하게 하기 위하여 이 문서들을 미국 지대에 있는 마르부르크 대학으로 옮길 것이 제안된다. 왕복문서의 대부분은 1943년 이전의 것이며 방공협정(반코민테른협정) 원본을 포함한다. 이 문서들은 발렌틴 박사와 폰 그리스하임 남작이 관리하고 있었는데, 이들은 자진하여 미군 부대장에게 문서의 소재를 알렸다. [머피.]\n\n캐퍼리(Caffery)", "secondary": "Paris, April 28, 1945—1 p.m. \n [Received 5:30 p.m.]\n\n2176. From Murphy. With reference to my telegrams Nos. 2133, April 27, 8 p.m. and 2135, April 27,9 a.m. [주57] two members of this Mission and representative of British Element Control Council have made initial inspection of between 200 and 400 tons German Foreign Office archives, half of which discovered were in the Castle of Falkenstein, about 30 percent in the Schloss Degenershaus and the remainder in the Burg Falkenstein and Schloss Stolberg, all located in the Harz mountains near Geisburg. For security and to facilitate adequate examination it is proposed to move the archives so [to] the University of Marburg in the American zone. The bulk of the correspondence is pre-1943 and includes the original anti-Comintern pact. The archives were in charge of Dr. Valentin and Baron von Griesheim who voluntarily informed the American troop commander of whereabouts of the archives. [Murphy.]\n\nCaffery", "notes": ["[주57] 둘 다 인쇄하지 않음."], "warn": true, "pages": [], "search": "Caffery 캐퍼리(주프랑스대사) Murphy 머피(대독일 미국 정치고문) Dr. Valentin 발렌틴 박사 Baron von Griesheim 폰 그리스하임 남작"}, {"id": "d914", "order": 914, "date": "1945-04-28", "group": "A", "eyebrow": "d914 · The Acting Secretary of State to the Ambassador in the Soviet Union (Harriman)  This telegram was repeated to London as Department’s 3347 with the following paragraph added: “Since your 3384, April 16, indicates full British support of French claim to membership on the Reparations Commission, it is hoped that the British Foreign Office will follow the same policy as the United States and will not have the British delegation leave for Moscow until the question of the composition of the Reparations Commission has been settled.” (740.00119 EW/4–2845)", "title": "국무장관 대리가 주소련대사(해리먼)에게", "badge": null, "list_right": "문서 914", "meta": [{"k": "일자", "v": "1945-04-28"}, {"k": "시각", "v": "Washington, April 28, 1945—7 p.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "970"}, {"k": "원문출처", "v": "740.00119 EW/4–2345: Telegram", "txt": true}, {"k": "발신", "v": "The Acting Secretary of State (Grew) 국무장관 대리 그루", "txt": true}, {"k": "수신", "v": "The Ambassador in the Soviet Union (Harriman) 주소련대사 해리먼", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 914 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d914"}], "summary": "폴리를 대사급 배상위원회 미국 위원으로 임명했음을 알리고, 프랑스를 배상위원회 원(原)위원으로 넣어야 한다는 미국 입장을 마이스키에게 전하도록 지시했다.", "points": ["대통령이 민주당 전국위원회 재무담당 에드윈 W. 폴리를 대사의 지위로 배상위원회 미국 위원에 임명했고, 루빈이 공사의 지위로 그를 보좌한다.", "마이스키가 루빈의 계획을 물어 온 것을 계기로 다음을 알려도 좋다고 했다.", "1. 미국 대표단의 출발 날짜는 아직 확정되지 않았다.", "2. 몰로토프가 4월 1일자 서한에서 프랑스 대표를 넣는 것이 타당하다고 했음에도 소련 정부가 프랑스에 모스크바 파견 초청을 하지 않은 이유를 미국 정부는 이해하지 못한다.", "3. 독일 배상 계획 집행을 책임질 통제위원회 구성국의 하나인 프랑스가 원(原)위원으로서 그 최초 형성에 참여해야 한다고 미국 정부는 강하게 느낀다.", "4. 해리먼의 4월 10일[9일]자 서한에 대한 조속한 회답을 바란다.", "독일 통제위원회 구성국 이외의 유엔을 처음부터 배상위원회에 넣을 이유가 없고, 독일에게 고통을 겪은 어느 한 나라를 우대할 이유도 없다는 점을 특히 거듭 강조하라고 했다.", "영국은 대표단장을 선정했으나 발표하지 않았고 5월 첫째 주 후반 영국을 떠날 예정이며, 폴리는 배상위원회의 최초 구성 문제가 타결될 때까지 출발하지 않을 생각이다."], "primary": "워싱턴, 1945년 4월 28일 오후 7시.\n\n970. 대통령은 민주당 전국위원회 재무담당인 에드윈 W. 폴리를 대사의 지위로 배상위원회 미국 위원에 임명하였다.[주66] 루빈 씨가 공사의 지위로 그를 보좌할 것이다.\n\n마이스키가 루빈의 계획에 관하여 물으면서 귀하에게 배상위원회 문제를 제기하였으므로(귀하의 4월 23일자 전보 1317호[주67]), 귀하는 그에게 다음과 같이 알려도 좋다.\n\n1\n\n미국 대표단의 출발 날짜는 아직 확정되지 아니하였다.\n\n2\n\n미국 정부는 어찌하여 소련 정부가 프랑스 정부에 모스크바로 대표를 보내라는 초청을 하지 아니하였는지 [1202면] 이해하지 못한다. 더구나 몰로토프 씨는 그 서한(귀하의 4월 1일자 전보 1003호)에서 프랑스 대표를 포함시키는 것이 타당하다고 여긴다고 해리먼 대사에게 알린 바 있다.\n\n3\n\n미국 정부는 독일 배상 계획의 집행에 책임을 지게 될 통제위원회 구성국의 하나인 프랑스가 배상위원회의 원(原)위원의 하나로서 그 계획의 최초 형성에 참여하여야 한다고 강하게 느낀다.\n\n4\n\n미국 정부는 위와 같은 취지의 해리먼 대사의 4월 10일[9일]자 서한[주68]에 대한 조속한 회답을 바란다.\n\n귀하는 국무부 전보 816호 및 856호[주69]에 담긴 논거 가운데 적절하다고 여기는 것을 어느 것이든 사용하되, 특히 독일 통제위원회 구성국 이외의 유엔 가운데 어느 나라를 처음부터 배상위원회에 포함시켜야 할 이유도, 독일의 손에 고통을 겪은 어느 한 나라를 우대하여야 할 이유도 귀국 정부는 알지 못한다는 점을 거듭 강조하라. 이는 위원회가 다른 나라들에 직접 관계되는 사항이 논의될 때 그 나라들에 대표를 보내어 위원회에 배석하도록 초청장을 내는 것을 결코 배제하지 아니한다.\n\n귀하의 참고를 위하여 비밀히 알리건대, 영국 측은 대표단장을 선정하였으나 아직 발표하지 아니하였으며, 그 대표단은 잠정적으로 5월 첫째 주 후반에 영국을 떠날 계획이라고 한다. 국무부는 미국 대표단의 출발을 영국 대표단의 출발과 맞추려 하고 있으나, 폴리는 배상위원회의 최초 구성 문제가 타결될 때까지는 떠날 생각이 없다.\n\n그루(Grew)", "secondary": "Washington, April 28, 1945—7 p.m.\n\n970. The President has appointed Edwin W. Pauley, Treasurer of Democratic National Committee, as the American member of the Reparations Commission with the rank of Ambassador. [주66] Mr. Lubin will be his associate with the rank of Minister.\n\nSince Maiski raised with you (reurtel 1317, April 23 [주67] ) the question of the Reparations Commission by asking about Lubin’s plans, you may inform him that:\n\n1\n\nThe date of the American delegation’s departure has not definitely been fixed.\n\n2\n\nThe United States Government does not understand why the Soviet Government has not issued an invitation to the French Government [1202면] to send a representative to Moscow especially since Mr. Molotov in his letter (reurtel 1003, April 1) informed Ambassador Harriman that he considered it expedient to include a French representative.\n\n3\n\nThe United States Government feels strongly that France as one of the Control Commission powers who will be responsible for the execution of the German reparations program should participate in its initial formulation as one of the original members of the Reparations Commission.\n\n4\n\nThe United States Government hopes for an early reply to Ambassador Harriman’s letter of April 10 [9] [주68] in the above sense.\n\nYou should use any of the arguments in Department’s telegrams 816 and 856 [주69] which you deem appropriate, reiterating especially that your Government sees no reason why any of the United Nations other than members of the German Control Commission should be included in the first instance in the Reparations Commission or why preference should be shown to any one nation which has suffered at the hands of Germany. This does not in any way preclude the issuance by the Commission of invitations to other nations to send representatives to sit with the Commission when matters directly affecting them are under discussion.\n\nFor your confidential information it is understood that the British have selected but not announced the head of their delegation which is tentatively planning to leave England late in first week of May. Department is attempting to have the American delegation’s departure coincide with the British departure but Pauley does not contemplate leaving until the question of the initial composition of Reparations Commission has been settled.\n\nGrew", "notes": ["[주65] 이 전보는 다음 문단을 덧붙여 국무부 3347호로 런던에 반복 발송되었다. 「귀하의 4월 16일자 3384호가 프랑스의 배상위원회 위원 자격 요구에 대한 영국의 전면적 지지를 시사하고 있으므로, 영국 외무부도 미국과 같은 방침을 따라 배상위원회의 구성 문제가 타결될 때까지 영국 대표단을 모스크바로 출발시키지 아니하기를 바란다.」 (740.00119 EW/4–2845)", "[주66] 4월 27일자 트루먼 대통령의 임명 서한은 폴리 씨가 국무장관에게 보낸 9월 14일자 서한에 인용되어 있다. 1290면.", "[주67] 인쇄하지 않음.", "[주68] 인쇄하지 않음. 다만 모스크바발 4월 10일 오전 10시자 전보 1110호를 보라. 1194면.", "[주69] 각각 4월 7일자 및 4월 13일자. 1192면 및 1196면."], "warn": false, "pages": ["1202"], "search": "Grew 그루(국무장관 대리) Harriman 해리먼(주소련대사) Edwin W. Pauley 에드윈 W. 폴리(배상위원회 미국 위원) Lubin 루빈 Maiski 마이스키(소련) Molotov 몰로토프(소련 외무인민위원) Truman 트루먼(대통령)"}, {"id": "d73", "order": 73, "date": "1945-04-29", "group": "A", "eyebrow": "d73 · The Chargé in the Soviet Union (Kennan) to the Secretary of State", "title": "주소련 대리대사(케넌)가 국무장관에게", "badge": null, "list_right": "문서 73", "meta": [{"k": "일자", "v": "1945-04-29"}, {"k": "시각", "v": "Moscow, April 29, 1945—6 p.m. [Received April 29—1:45 p.m.]"}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": "1413"}, {"k": "원문출처", "v": "740.00119 EAC/4–2945: Telegram", "txt": true}, {"k": "발신", "v": "The Chargé in the Soviet Union (Kennan) 주소련 대리대사 케넌", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 73 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d73"}], "summary": "소련 정부는 미국 사절단의 빈 이동이 EAC에서 그 도시의 점령지대가 확정된 뒤에야 가능하다고 통고했다.", "points": ["케넌이 다른 용무로 외무인민위원부를 찾았을 때 미국과 과장 대리가 이 문제를 꺼냈다.", "미국 정부가 점령지대를 정하고 통제 기구 수립에 참여할 공식 사절단을 빈에 보내려 한다는 점에 관하여, 본국 정부의 훈령에 따라 통고했다.", "우리 일행의 빈 이동은 「EAC가 그 도시의 점령지대를 확정한 뒤에 이루어질 수 있다」는 것이다.", "소련 정부는 3대 연합국 정부가 이를 EAC 소관으로 결정했다고 보며, EAC가 이 문제를 마무리하기 전에 우리 일행이 빈에 도착하는 것은 시기상조이고 바람직하지 않다고 여긴다.", "구세프가 이제 EAC에서 이 문제를 즉시 더 논의할 수 있게 하는 훈령을 받았다고 시사했으며, 그곳에서 논의를 진행하는 데 어려움이 없으리라고 보았다.", "국무부에 발송, 카세르타의 에어하트에게 70호, EAC를 위해 런던에 185호로 반복 발송."], "primary": "모스크바, 1945년 4월 29일 오후 6시.\n [접수 4월 29일 오후 1시 45분]\n\n1413. 오늘 오후 본인이 다른 용무로 외무인민위원부를 방문하였을 때, 미국과(課) 과장 대리는 그 기회를 빌려, 점령지대를 정하고 통제 기구의 수립에 참여할 공식 일행을 빈에 파견하려는 우리 정부의 의사를 언급하면서, 본국 정부의 훈령에 따라 우리 일행의 빈으로의 [101면] 이동은 「EAC가 그 도시의 점령지대를 확정한 뒤에 이루어질 수 있다」고 본인에게 통고하였다. 그는 3대 연합국 정부가 이 문제를 EAC의 소관으로 하기로 결정하였다고 소련 정부가 여기고 있으며, EAC가 이 주제에 관한 조치를 완료하기 전에는 우리 일행이 빈에 도착하는 것이 시기상조이며 바람직하지 아니하다고 설명하였다.\n\n그는 구세프가 이제 이 문제를 EAC에서 즉시 더 논의할 수 있게 하는 훈령을 받았다고 시사하였으며, 그곳에서 논의를 진행하는 데 우리가 아무런 어려움도 겪지 아니하리라고 생각한다고 하였다.\n\n국무부에 발송, 카세르타의 에어하트에게 70호로, EAC를 위하여 런던에 185호로 반복 발송.\n\n케넌(Kennan)", "secondary": "Moscow, April 29, 1945—6 p.m. \n [Received April 29—1:45 p.m.]\n\n1413. When I visited the Foreign Affairs Commissariat this afternoon on another matter the acting chief of the American Section took the occasion to refer to the intention of our Government to send an official group to Vienna to arrange zones of occupation and to participate in establishment of machinery of control and informed me under instructions of his Government that the movement of our party to [101면] Vienna “can be carried out after EAC has fixed the zones of occupation for that city”. He explained that the Soviet Government considered that the three major Allied Governments had decided that this should be matter for EAC and that until EAC had completed its action on this subject the arrival of our group in Vienna would be premature and undesirable.\n\nHe indicated that Gousev now had instructions which would permit him to proceed immediately to the further discussion of this matter in EAC and he thought we would have no difficulty in getting on with the discussions there.\n\nSent to Department, repeated to Caserta for Erhardt as 70 and to London for EAC as 185.\n\nKennan", "notes": [], "warn": false, "pages": ["101"], "search": "Kennan 케넌(주소련 대리대사) Gousev 구세프(EAC 소련 대표) Erhardt 에어하트(오스트리아 문제 담당 미국 정치고문)"}, {"id": "d197", "order": 197, "date": "1945-04-29", "group": "A", "eyebrow": "d197 · The Ambassador in the United Kingdom (Winant) to the Secretary of State", "title": "주영대사(위넌트)가 국무장관에게", "badge": null, "list_right": "문서 197", "meta": [{"k": "일자", "v": "1945-04-29"}, {"k": "시각", "v": "London, April 29, 1945—4 p.m. [Received April 29—10:55 a.m.]"}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "4347"}, {"k": "원문출처", "v": "740,00119 Control (Germany)/4–294S: Telegram", "txt": true}, {"k": "발신", "v": "The Ambassador in the United Kingdom (Winant) 주영대사 위넌트", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 197 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d197"}], "summary": "독일 내 프랑스 지대 구분의 병참 문제를 논의하기 위해 마이어 장군을 프랑스로 보냈으며, 국무부 훈령을 받고 즉시 마이어·불·크로퍼드 장군이 캐퍼리 대사와 협의하도록 주선했다고 보고했다.", "points": ["던 국무차관보와 매슈스 앞이다.", "독일 내 프랑스 지대 구분의 즉각적 타결이 필요하리라 보고, 지난주 스미스 장군과 연락하여 그의 제안으로 마이어 장군을 프랑스로 보내 이 문제를 논의하게 했다.", "이 대화에서 프랑스에 배정될 지대 구역과 관련된 병참 문제들이 드러났다.", "오늘 아침 4월 28일 오후 3시자 3332호로 JCS 견해와 캐퍼리에게 프랑스 정부와 협의하도록 요청한다는 내용을 받고 다시 스미스 장군과 연락했다.", "마이어 장군이 불 장군·크로퍼드 장군과 함께 즉시 캐퍼리 대사와 협의하도록 주선했으며, 이 조치는 스미스 장군이 캐퍼리 대사에게 설명했다.", "클레이 장군과도 긴밀히 연락 중이며, 클레이가 미국 통제이사회 그룹 사무총장으로 쓸 해먼드 대령의 전출을 요청해 왔다."], "primary": "런던, 1945년 4월 29일 오후 4시.\n [접수 4월 29일 오전 10시 55분]\n\n4347. 던 국무차관보와 매슈스 앞. 독일 내 프랑스 지대 구분을 즉시 타결할 필요가 있으리라 예상하고, 또한 이 주제에 관하여 [248면] 완전히 정통해 있어야 할 필요를 인식하여, 본인은 지난주 스미스 장군과 연락하였고 그의 제안에 따라 마이어 장군을 프랑스로 보내어 이 문제를 그와 논의하게 하였다.\n\n이 대화에서 프랑스에 배정될 지대 구역과 관련된 병참 문제들이 드러났다.\n\n독일 내 프랑스 점령지대에 관한 합동참모본부의 견해를 전달하고, 귀하가 캐퍼리 대사에게 이 문제를 프랑스 정부와 협의하도록 요청하고 있다고 설명한 귀하의 메시지(4월 28일 오후 3시자 3332호)를 오늘 아침 받자마자, 본인은 다시 스미스 장군과 연락하였다. 우리는 마이어 장군이 불 장군[주81] 및 크로퍼드 장군[주82]과 함께 즉시 캐퍼리 대사와 협의하도록 주선하였다. 이 조치는 스미스 장군이 캐퍼리 대사에게 설명하였다.\n\n아울러 우리가 클레이 장군[주83]과 긴밀히 연락하고 있다는 사실도 귀하가 알아 두고 싶어 하리라 생각한다. 그는 미국 그룹 통제이사회의 사무총장 직무를 맡기기 위하여 해먼드 대령[주84]을 자기 밑으로 전출시켜 줄 수 있겠는지 본인에게 물어 왔다.\n\n위넌트(Winant)", "secondary": "London, April 29, 1945—4 p.m. \n [Received April 29—10:55 a.m.]\n\n4347. To Assistant Secretary Dunn and Matthews. Anticipating the need of immediate settlement of the French zoning in Germany and recognizing the necessity of being completely informed on this [248면] subject, I got in touch with General Smith last week and, on his suggestion I sent General Meyer to France to discuss this problem with him.\n\nThese conversations developed logistical problems that related to the zoning area to be assigned to France.\n\nAs soon as I received your message (3332, April 28, 3 p.m.) this morning forwarding the JCS views with respect to the French zone of occupation in Germany and explaining that you were asking Ambassador Caffery to take this matter up with the French Government, I again got in touch with General Smith. We arranged that General Meyer with General Bull [주81] and General Crawford [주82] would immediately consult with Ambassador Caffery. These arrangements have been explained to Ambassador Caffery by General Smith.\n\nI thought that you might also like to know that we are in close liaison with General Clay. [주83] He has asked me if I would release Colonel Hammond [주84] for assignment to duty with him to act as Secretary General of the United States Group, Control Council.\n\nWinant", "notes": ["[주81] 해럴드 불(Harold Bull) 소장, SHAEF G–3(작전)부장.", "[주82] 로버트 W. 크로퍼드(Robert W. Crawford) 소장, SHAEF G–4(보급)부장.", "[주83] 루셔스 D. 클레이(Lucius D. Clay) 육군 중장, 미국 부(副)군정장관 겸 미국 그룹 통제이사회(독일) 사령관.", "[주84] 토머스 W. 해먼드 2세(Thomas W. Hammond, Jr.) 대령, 유럽자문위원회 미국 대표 보좌 군사고문."], "warn": false, "pages": ["248"], "search": "Winant 위넌트(주영대사) Dunn 던(국무차관보) Matthews 매슈스(유럽국장) Walter Bedell Smith 스미스(SHAEF 참모장) Meyer 마이어(장군) Caffery 캐퍼리(주프랑스대사) Bull 불(SHAEF G–3부장) Crawford 크로퍼드(SHAEF G–4부장) Clay 클레이(미국 부군정장관) Hammond 해먼드(대령)"}, {"id": "d558", "order": 558, "date": "1945-04-29", "group": "A", "eyebrow": "d558 · Mr. Alexander C. Kirk, Political Adviser on the Staff of the Supreme Allied Commander, Mediterranean Theater, to the Acting Secretary of State", "title": "지중해전역 연합국최고사령관 막료 정치고문 알렉산더 C. 커크가 국무장관 대리에게", "badge": null, "list_right": "문서 558", "meta": [{"k": "일자", "v": "1945-04-29"}, {"k": "시각", "v": "Caserta, April 29, 1945—midnight. [Received April 30—11:47 a.m.]"}, {"k": "장소", "v": "Caserta", "txt": true}, {"k": "전문번호", "v": "1806"}, {"k": "원문출처", "v": "740.00119 EW/4–2945: Telegram", "txt": true}, {"k": "발신", "v": "Mr. Alexander C. Kirk, Political Adviser on the Staff of the Supreme Allied Commander, Mediterranean Theater 지중해전역 연합국최고사령관 막료 정치고문 알렉산더 C. 커크", "txt": true}, {"k": "수신", "v": "The Acting Secretary of State 국무장관 대리", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 558 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d558"}], "summary": "독일 전권대표들이 카세르타에서 무조건 항복 조건에 서명했으며, 그 문서는 5월 2일에 발효한다고 보고했다.", "points": ["독일 전권대표들이 합동참모본부 앞 전보 Naf 897호에 담긴 무조건 항복(unconditional surrender) 조건에 사소한 변경을 가하여 서명했다.", "그들은 오늘 오후 이곳을 떠났다.", "이 문서(instrument)는 5월 2일에 발효한다.", "각주에 따르면 서명은 워싱턴 시간 4월 29일 오전 8시 카세르타에서 이루어졌고, 서명자는 독일 남서부 총사령관과 이탈리아 주둔 친위대 최고사령관을 대표하는 전권대표들이었으며, 이는 현지 항복문서(instrument of local surrender)였다.", "항복 지역은 이손초강 동쪽의 베네치아줄리아 일부를 제외한 이탈리아 전역과 오스트리아 서부 전역 및 중부 일부였다."], "primary": "카세르타, 1945년 4월 29일 자정.\n [접수 4월 30일 오전 11시 47분]\n\n1806. 독일 전권대표들이 합동참모본부 앞 전보 Naf 897호[주51](3월 26일자 본직의 1175호[주52] 참조)에 담긴 무조건 항복 조건[주50]에 사소한 변경 몇 가지를 가하여 서명하였다. 그들은 오늘 오후 이곳을 떠났다. 이 문서는 5월 2일에 발효하게 되어 있다. 4월 27일자 본직의 1754호와 4월 29일 로마발 국무부 앞 1073호[주53]를 참조하라.\n\n커크(Kirk)\n\n[773면]", "secondary": "Caserta, April 29, 1945—midnight. \n [Received April 30—11:47 a.m.]\n\n1806. The German plenipotentiaries signed the terms of unconditional surrender [주50] as contained in telegram Naf 897 [주51] to Combined Chiefs of Staff (see our 1175 of March 26 [주52] ) with certain minor changes. They left here this afternoon. Instrument is to go into effect on May 2nd. Refer our 1754 of April 27 and Rome’s 1073, April 29 to Department. [주53]\n\nKirk\n\n[773면]", "notes": ["[주50] 독일 남서부 총사령관과 이탈리아 주둔 친위대 최고사령관을 대표하는 독일 전권대표들이 워싱턴 시간 4월 29일 오전 8시 카세르타에서 현지 항복문서(instrument of local surrender)에 서명하였다. 항복된 영역은 이손초강 동쪽의 베네치아줄리아 일부를 제외한 이탈리아 전역과 오스트리아 서부 전역 및 중부의 일부를 포함하였다.", "[주51] 알렉산더 원수가 3월 23일에 보낸 이 전보는 그가 독일 측에 서명하게 하려는 간략한 항복문서의 개요를 밝힌 것이다. (육군부 문서철에서 얻은 사본.) 이탈리아 주둔 독일군의 현지 항복문서와 연합국 장교들과 독일 전권대표들 사이의 네 차례 회합 의사록은 국무부, The United States and Italy, 1936–46. Documentary Record (Washington, Government Printing Office, 1946), 127–152면에 인쇄되어 있다. 아울러 5월 2일 트루먼 대통령과 그루 국무장관 대리가 발표한 성명, 그리고 트루먼 대통령이 알렉산더 원수와 마크 W. 클라크 장군에게 보낸 메시지도 같은 책 125–127면을 보라.", "[주52] 인쇄하지 않음. 독일인 전쟁포로에 관한 항복 지령 초안을 서술한 것이다 (740.00119 EW/3–2645).", "[주53] 후자는 인쇄하지 않음. 항복 논의가 성공적으로 마무리되었다고 보고한 것이다 (740.00119 EW/4–2945)."], "warn": false, "pages": ["773"], "search": "Kirk 커크(지중해전역 연합국최고사령관 막료 정치고문) Alexander 알렉산더(원수) Truman 트루먼(대통령) Grew 그루(국무장관 대리) Mark W. Clark 마크 W. 클라크(장군)"}, {"id": "d559", "order": 559, "date": "1945-04-29", "group": "D", "eyebrow": "d559 · The American Chargé in the Soviet Union (Kennan) to the Assistant People’s Commissar for Foreign Affairs of the Soviet Union (Vyshinshy)", "title": "주소련 미국 대리대사(케넌)가 소련 외무인민위원 대리(비신스키)에게", "badge": null, "list_right": "문서 559", "meta": [{"k": "일자", "v": "1945-04-29"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": "No. 226"}, {"k": "원문출처", "v": "740.00119 EW/4–2945", "txt": true}, {"k": "발신", "v": "The American Chargé in the Soviet Union (Kennan) 주소련 미국 대리대사 케넌", "txt": true}, {"k": "수신", "v": "The Assistant People’s Commissar for Foreign Affairs of the Soviet Union (Vyshinsky) 소련 외무인민위원 대리 비신스키", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "서한"}], "links": [{"k": "FRUS", "text": "문서 559 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d559"}], "summary": "이탈리아 주둔 독일군의 현지 항복 발표는 알렉산더가 적절하다고 여기는 시점에 하고 다른 곳에서 먼저 발표하지 말자는 트루먼의 제안을 스탈린에게 전달했다.", "points": ["케넌이 대통령이 스탈린에게 보내는 메시지(개인·극비)를 비신스키를 통해 전달했다.", "그 메시지는 트루먼이 처칠에게 보낸 메시지의 본문을 담고 있다.", "알렉산더 원수의 Naf 934호와 관련하여, 이탈리아 주둔 독일군이 영미 연합군에 현지 항복(local surrender)한 사실의 발표를 알렉산더가 적절하고 옳다고 여기는 시점에 그가 하도록 제안했다.", "첫 발표는 다른 어느 곳에서도 하지 말 것을 제안했다.", "처칠이 동의한다면 알렉산더에게 그에 따라 지시해 달라고 했다.", "각주에 따르면 Naf 934호(4월 29일자)는 독일 전권대표들이 항복 조건을 수락했다고 보고한 것이다."], "primary": "제226호\n\n모스크바, 1945년 4월 29일.\n\n비신스키 씨 귀하. 본인은 대통령이 스탈린 원수에게 보내는 다음 메시지를 전달하도록 지시받았습니다.\n\n「스탈린 원수 앞, 대통령으로부터. 개인 및 극비. 「다음은 본인이 처칠 총리에게 보낸 메시지의 본문입니다.\n\n「『알렉산더 원수의 Naf 934호[주54]와 관련하여 본인은, 이탈리아 주둔 독일군이 영미 연합군에 현지 항복(local surrender)한 사실의 발표를 알렉산더가 적절하고 옳다고 여기는 시점에 그가 하도록 하고, 첫 발표를 다른 어느 곳에서도 하지 아니할 것을 제안합니다.\n\n「『동의하신다면 알렉산더에게 그에 따라 지시하여 주시기 바랍니다.』\n\n(서명) 트루먼.」\n\n이 메시지를 스탈린 원수에게 전달하여 주시면 감사하겠습니다.\n\n경구,\n\n조지 F. 케넌(George F. Kennan)", "secondary": "No. 226\n\nMoscow, April 29, 1945.\n\nDear Mr. Vyshinski: I have been directed to effect transmission of the following message from the President to Marshal Stalin:\n\n“To Marshal Stalin from the President. Personal and Top Secret. “The following is the text of a message I have sent to Prime Minister Churchill:\n\n“‘I suggest, with reference to Marshal Alexander’s Naf 934, [주54] that the announcement of the local surrender of German armies in Italy to combined Anglo-American forces be made by Alexander at a time that is in his opinion suitable and correct, and that the first announcement be not made elsewhere.\n\n“‘If you agree, please instruct Alexander accordingly.’\n\n(Signed) Truman.”\n\nI would be grateful if you would be good enough to transmit this message to Marshal Stalin.\n\nSincerely yours,\n\nGeorge F. Kennan", "notes": ["[주54] 인쇄하지 않음. 4월 29일자인 이 전문은 독일 전권대표들이 항복 조건을 수락하였다고 보고한 것이다. 육군부 문서철에서 얻은 사본."], "warn": false, "pages": [], "search": "Kennan 케넌(주소련 대리대사) Vyshinsky 비신스키(소련 외무인민위원 대리) Truman 트루먼(대통령) Stalin 스탈린 Churchill 처칠(영국 총리) Alexander 알렉산더(원수)"}, {"id": "d74", "order": 74, "date": "1945-04-30", "group": "A", "eyebrow": "d74 · The Ambassador in the United Kingdom (Winant) to the Secretary of State", "title": "주영대사(위넌트)가 국무장관에게", "badge": null, "list_right": "문서 74", "meta": [{"k": "일자", "v": "1945-04-30"}, {"k": "시각", "v": "London, April 30, 1945—7 p.m. [Received 8:52 p.m.]"}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "4376"}, {"k": "원문출처", "v": "863.01/4–3045: Telegram", "txt": true}, {"k": "발신", "v": "The Ambassador in the United Kingdom (Winant) 주영대사 위넌트", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 74 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d74"}], "summary": "영국 외무부의 워너가, 소련이 카를 레너를 앞세워 오스트리아 임시정부를 세운 방식에 전혀 만족하지 않는다고 말했다.", "points": ["워너는 외무부가 소련이 카를 레너를 수반으로 하는 오스트리아 임시정부를 세운 방식에 전혀 만족하지 않는다고 했다.", "외무부의 견해는 워싱턴 주재 영국대사관을 통해 국무부에 전달되었고, 모스크바 주재 영·미 대사관에 보낼 훈령이 워싱턴에서 국무부와 영국대사관 사이에 마련되고 있다고 했다.", "며칠 전 모스크바 주재 영국대사관이 들은 대로, 소련군이 오스트리아에 들어간 이래 줄곧 러시아 측이 레너와 접촉해 왔다는 점을 외무부는 특히 걱정스럽게 여긴다.", "이 정부를 세우고 승인한 러시아 측의 비밀스럽고 일방적인 행동이 남긴 불행한 인상에 대해 러시아 측이 의심할 여지가 없도록 해야 한다고 했다.", "워너는 레너가 정부에 존중받을 만한 외양을 주기 위해 뽑혔을 뿐이며, 그 나이의 사람이 정부에서 능동적 역할을 하리라 기대할 수 없고, 실제 일은 젊고 활동적인 공산주의자들이 할 것이라고 했다.", "모스크바에 151호로 반복 발송."], "primary": "런던, 1945년 4월 30일 오후 7시.\n [접수 오후 8시 52분]\n\n4376. 오늘 우리가 워너[주88]와 나눈 이야기에서 워너는, 카를 레너를 수반으로 하는 오스트리아 임시정부를 러시아 측이 세운 방식에 외무부가 전혀 만족하지 아니한다고 말하였다. 그는 외무부의 견해가 워싱턴 주재 영국대사관을 통하여 국무부에 알려졌으며, 모스크바 주재 영국 및 미국 대사관에 보낼 훈령이 워싱턴에서 국무부와 영국대사관 사이에 마련되고 있다고 덧붙였다.\n\n워너는 이어, 며칠 전 모스크바 주재 영국대사관이 들은 바와 같이 러시아군이 오스트리아에 들어간 이래로 줄곧 러시아 측이 레너와 접촉하여 왔다는 사실을 외무부가 특히 걱정스럽게 여긴다고 하였다. 그는 계속하여, 오스트리아에 이 정부를 세우고 승인한 러시아 측의 비밀스럽고 일방적인 행동이 남긴 불행한 인상에 대하여 러시아 측이 의심할 여지를 남겨서는 아니 된다고 말하였다.\n\n워너는 레너가 그 정부에 존중받을 만한 외양을 주기 위하여 뽑혔을 뿐이라고 믿는다고 말하였다. 그만한 나이의 사람이 정부에서 능동적인 역할을 하리라고는 기대할 수 없다는 것이다. 워너는 실제 일은 젊고 활동적인 공산주의자들이 하게 되리라고 결론지었다.\n\n모스크바에 151호로 반복 발송.\n\n위넌트(Winant)\n\n[102면]", "secondary": "London, April 30, 1945—7 p.m. \n [Received 8:52 p.m.]\n\n4376. In a talk we had with Warner [주88] today, Warner said that the Foreign Office not at all pleased with the way the Russians had handled the setting up of the Provisional Government in Austria headed by Karl Renner. He added that the views of the Foreign Office had been made known to the Department through the British Embassy at Washington, and that instructions to the British and American Embassies in Moscow are being worked out in Washington between the Department and the British Embassy.\n\nThe Foreign Office, Warner continued, found it particularly disturbing that the Russians, as the British Embassy in Moscow had been told only a few days ago, had been in touch with Renner ever since Russian troops entered Austria. The Russians, he went on to say, must not be left in doubt about the unfortunate impression made by their secretive and unilateral action in setting up and recognizing this Government in Austria.\n\nRenner, Warner said he believed, was selected merely to give the Government an air of respectability. A man of his age could not be expected to take an active part in the Government. The real work, Warner concluded, would be done by young, active Communists.\n\nRepeated to Moscow as 151.\n\nWinant\n\n[102면]", "notes": ["[주88] 크리스토퍼 F. A. 워너(Christopher F. A. Warner), 영국 외무부 북유럽부 담당 차관."], "warn": false, "pages": ["102"], "search": "Winant 위넌트(주영대사) Warner 워너(영국 외무부 북유럽부 담당 차관) Karl Renner 카를 레너(오스트리아 임시정부 수반)"}, {"id": "d75", "order": 75, "date": "1945-04-30", "group": "A", "eyebrow": "d75 · The British Prime Minister (Churchill) to President Truman", "title": "영국 총리(처칠)가 트루먼 대통령에게", "badge": null, "list_right": "문서 75", "meta": [{"k": "일자", "v": "1945-04-30"}, {"k": "시각", "v": null}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "No. 25"}, {"k": "원문출처", "v": "740.00119 Control (Austria)/5–145: Telegram", "txt": true}, {"k": "발신", "v": "The British Prime Minister (Churchill) 영국 총리 처칠", "txt": true}, {"k": "수신", "v": "President Truman 트루먼 대통령", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 75 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d75"}], "summary": "오스트리아 임시정부 수립 발표와 빈 비행 허가 거부를 두고, 러시아가 먼저 도착한 것을 이용해 우리가 가기 전에 나라를 「조직」하려 한다고 우려하며 스탈린에게 공동 메시지를 보내자고 제안했다.", "points": ["처칠은 오스트리아에서 일이 돌아가는 방식을 매우 우려한다고 했다.", "오스트리아 임시정부 수립 발표와 우리 사절단의 빈 비행 허가 거부가 겹쳐, 러시아가 오스트리아에 먼저 도착한 것을 고의로 이용해 우리가 가기 전에 나라를 「조직(organise)」하려 하는 것이 아닌가 두렵다고 했다.", "지금 우리 두 사람이 강경한 태도를 취하지 않으면 나치로부터의 해방 기간에 오스트리아에서 어떠한 영향력도 행사하기 매우 어려워지리라고 보았다.", "바로 다음 전보(제26호)의 문안대로 스탈린에게 메시지를 보내는 데 함께해 주겠느냐고 물었다."], "primary": "제25호\n\n[런던,] 1945년 4월 30일.\n\n본인은 오스트리아에서 일이 돌아가는 방식을 매우 우려하고 있습니다. 오스트리아 임시정부의 수립 발표와 아울러 우리 사절단이 빈으로 비행하는 것을 허가하지 아니한 일은, 러시아 측이 오스트리아에 먼저 도착한 것을 고의로 이용하여 우리가 그곳에 가기 전에 그 나라를 「조직(organise)」하려는 것이 아닌가 하는 두려움을 본인에게 안겨 줍니다.\n\n본인이 보기에는 지금 우리 두 사람이 강경한 태도를 취하지 아니한다면, 오스트리아가 나치로부터 해방되는 기간에 그곳에서 어떠한 영향력이라도 행사하기가 매우 어려워질 것입니다. 본인의 바로 다음 전보[주89]에 담긴 문안대로 스탈린에게 메시지를 보내는 데 귀하도 함께해 주시겠습니까?", "secondary": "No. 25\n\n[London,] April 30, 1945.\n\nI am much concerned about the way things are going in Austria. The announcement of formation of a Provisional Austrian Government, together with refusal of permission to our Missions to fly into Vienna, makes me fear that the Russians are deliberately exploiting their arrival first into Austria to “organise” the country before we get there.\n\nIt seems to me that unless we both take a strong stand now we shall find it very difficult to exercise any influence in Austria during the period of her liberation from the Nazis. Would you be willing to join me in sending Stalin a message in terms of my immediately following telegram? [주89]", "notes": ["[주89] 아래 문서."], "warn": false, "pages": [], "search": "Churchill 처칠(영국 총리) Truman 트루먼(대통령) Stalin 스탈린"}, {"id": "d76", "order": 76, "date": "1945-04-30", "group": "A", "eyebrow": "d76 · The British Prime Minister (Churchill) to President Truman", "title": "영국 총리(처칠)가 트루먼 대통령에게", "badge": null, "list_right": "문서 76", "meta": [{"k": "일자", "v": "1945-04-30"}, {"k": "시각", "v": null}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "No. 26"}, {"k": "원문출처", "v": "740.00119 Control (Austria)/5–145: Telegram", "txt": true}, {"k": "발신", "v": "The British Prime Minister (Churchill) 영국 총리 처칠", "txt": true}, {"k": "수신", "v": "President Truman 트루먼 대통령", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 76 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d76"}], "summary": "스탈린에게 보낼 공동 메시지 문안이다. 빈의 지대와 통제 기구가 EAC에서 합의될 때까지 연합국 사절단의 빈 파견을 허용하지 않겠다는 소련 입장과 임시정부 수립 발표에 유감을 표하고, 톨부힌에게 즉시 비행 허가 지시를 내려 달라고 요청한다.", "points": ["4월 13일 해리먼에게 초청이 있었는데도, 빈의 각 지대와 임시 통제 기구에 관한 EAC 합의가 이루어질 때까지 소련 정부가 연합국 사절단의 빈 파견에 동의하지 않는다는 소식을 모스크바 대리대사로부터 듣고 매우 우려했다.", "고려할 시간을 달라는 요청에도 불구하고 빈에서 오스트리아 임시정부가 수립되었다는 발표가 나온 데 대해서도 불쾌하게 놀랐다.", "독일과 마찬가지로 오스트리아의 처우도 그 나라를 점령·통제할 4대국 공동의 관심사라는 것이 우리의 이해였다.", "점령·통제, 특히 빈 자체에 관한 사항에서 EAC의 최종 타결이 이루어지기 전에, 영국·미국·프랑스 대표들이 빈으로 가서 현지 사정을 보고할 수 있어야 한다고 본다.", "연합국 사절단이 이탈리아에서 즉시 비행해 들어갈 수 있도록 톨부힌 원수에게 필요한 지시를 내려 주기 바란다."], "primary": "제26호\n\n[런던,] 1945년 4월 30일.\n\n다음은 본인의 바로 앞 전보에서 언급한 메시지입니다.\n\n시작.\n\n우리는 4월 13일 해리먼 씨에게 초청이 있었음에도 불구하고, 빈의 각 지대와 임시 통제 기구에 관하여 유럽자문위원회(E.A.C.)에서 합의가 이루어질 때까지는 소련 정부가 연합국 사절단의 빈 파견에 동의하지 아니하리라는 것을 모스크바 주재 우리 대리대사로부터 듣고 매우 우려하였습니다. 우리는 또한 이 문제를 고려할 시간을 달라는 우리의 요청에도 불구하고 빈에서 오스트리아 임시정부가 수립되었다는 발표가 있은 데 대하여 불쾌하게 놀랐습니다.\n\n독일의 경우와 마찬가지로 오스트리아의 처우도, 그 나라들을 점령하고 통제하게 될 4대국 공동의 관심사라는 것이 우리의 이해였습니다. 우리는 그 나라, 특히 빈 자체의 점령과 통제에 관한 사항에서 E.A.C.의 최종 타결이 이루어지기 전에, 영국·미국·프랑스 대표들이 빈으로 나아가 그곳의 사정을 보고할 수 있도록 허용되는 것이 긴요하다고 여깁니다. 연합국 사절단이 이탈리아로부터 즉시 비행하여 들어갈 수 있도록 귀하가 톨부힌 원수에게 필요한 지시를 내려 주시기를 바랍니다.\n\n[103면]", "secondary": "No. 26\n\n[London,] April 30, 1945.\n\nFollowing is message referred to in my immediately preceding telegram:\n\nBegins.\n\nWe have been much concerned to hear from our Chargé d’Affaires in Moscow that, despite invitation extended to Mr. Harriman on April 13th, the Soviet Government will not agree to Allied Missions proceeding to Vienna until agreement has been reached in E.A.C. regarding respective zones in Vienna and provisional control machinery. We have also been disagreeably surprised by announcement of the setting up in Vienna of a provisional Austrian Government, despite our request for time to consider the matter.\n\nIt has been our understanding that treatment of Austria, as of Germany, is a matter of common concern to the Four Powers who are to occupy and control those countries. We regard it as essential that British, American and French representatives should be allowed to proceed to Vienna in order to report on conditions there before any final settlement is reached in E.A.C. on matters affecting occupation and control of the country and especially of Vienna itself. We hope you will issue the necessary instructions to Marshal Tolbukhin in order that Allied Missions may fly in at once from Italy.\n\n[103면]", "notes": [], "warn": false, "pages": ["103"], "search": "Churchill 처칠(영국 총리) Truman 트루먼(대통령) Harriman 해리먼(주소련대사) Tolbukhin 톨부힌(소련 원수)"}, {"id": "d77", "order": 77, "date": "1945-04-30", "group": "C", "eyebrow": "d77 · Memorandum of Conversation, by the Director of the Office of European Affairs (Matthews)", "title": "유럽국장(매슈스)의 대화 비망록", "badge": null, "list_right": "문서 77", "meta": [{"k": "일자", "v": "1945-04-30"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 Control (Austria)/4–3045", "txt": true}, {"k": "발신", "v": "The Director of the Office of European Affairs (Matthews) 유럽국장 매슈스", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "대화 비망록"}], "links": [{"k": "FRUS", "text": "문서 77 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d77"}], "summary": "그루가 대통령에게 소련의 사주로 오스트리아 정부가 수립되었다고 보고하고, 승인하지 않는다는 성명 초안을 대통령이 즉석에서 그대로 승인했으며, 대통령은 정부의 구성이 아니라 소련의 일방적 절차에 대해 항의하라고 지시했다.", "points": ["참석자는 대통령, 그루 국무장관 대리, 윌리엄 필립스, H. 프리먼 매슈스.", "그루는 명백히 러시아의 사주 아래 오스트리아에 정부가 수립되었다고 대통령에게 말했다.", "언론 보도 외에 우리가 가진 정보는, 레너가 정부를 구성할 계획이고 소련은 그 행정에 반대할 뜻이 없다는 4월 27일자 소련 정부의 통보뿐이었다.", "영국 외무부는 이미 신정부를 승인하지 않는다는 성명을 냈고, 그루는 우리도 비슷한 성명을 내야 한다고 보았다.", "그루가 읽은 성명 초안을 대통령은 즉석에서 (한 자도 고치지 않고) 승인했고, 그 성명은 뒤에 국무부가 발표했다.", "총리가 모스크바에 강력히 항의하고자 대통령에게 스탈린 앞 공동 메시지를 제안했음을 알렸고, 그루는 모스크바에 대한 표명 여부를 물었다.", "그루는 오스트리아 정부의 구성과, 모스크바에서 훈련된 공산주의자들이 내무 및 교육·종교 장관을 맡은 사실을 간략히 설명했다.", "대통령은 협의 없이 일방적으로 행동한 소련 정부의 절차에 항의하는 데는 동의하되 정부의 구성에 관하여는 논평하지 말라고 했으며, 항의는 모스크바 대사관이 전달하고 사본을 위넌트에게 보내 처칠에게 전하도록 했다.", "대통령은 리히 제독에게, 총리의 개인 메시지에 대하여 모스크바 대사관을 통해 처리하고 있으며 위넌트에게 우리 전보 사본을 주도록 지시했다고만 회답하라고 했다."], "primary": "[워싱턴,] 1945년 4월 30일.\n\n참석자: 대통령\n\n국무장관 대리 그루\n\n윌리엄 필립스 씨[주90]\n\nH. 프리먼 매슈스 씨\n\n그루 씨는 대통령에게, 명백히 러시아의 사주 아래 오스트리아에 정부가 수립되었다고 말하였다. 언론 보도에 실린 것 외에 우리가 가진 유일한 정보는, 널리 알려진 오스트리아 사회당 지도자이자 전(前) 수상인 레너가 정부를 구성할 계획이며 소련 측은 그의 행정에 반대할 의사가 없다는 취지로 4월 27일 소련 정부로부터 받은 통보뿐이었다.[주91] 그루 씨는 이어, 영국 외무부가 이미 신정부를 승인하지 아니한다는 성명을 발표하였다고 하면서 (그는 통신 속보를 읽어 주었다) 우리도 비슷한 취지의 성명을 내야 한다고 생각한다고 말하였다. 이어 그루 씨가 성명 초안을 읽자 대통령은 즉석에서 (한 자도 고치지 아니하고) 이를 승인하였으며, 그 성명은 뒤에 국무부가 발표하였다.[주92]\n\n그루 씨는 계속하여, 총리가 모스크바에 강력한 항의를 제기할 뜻이며 대통령에게 스탈린 앞 메시지에 함께해 줄 것을 요청하였다고 말하였다.[주92a] 그루 씨는 우리가 모스크바에 어떤 표명을 하여야 한다는 데 대통령이 동의하는지 물었다. 그는 대통령에게 오스트리아 정부의 구성과, 모스크바에서 훈련된 공산주의자들이 내무장관과 교육·종교장관이라는 요직을 쥐고 있는 것으로 보인다는 사실을 간략히 설명하였다.[주93] 대통령은 협의 없이 일방적으로 행동한 소련 정부의 절차에 대하여는 우리가 항의하여야 한다는 데 동의하나, 그 정부의 구성에 관하여는 논평하지 말라고 말하였다. 그는 이 항의를 모스크바 주재 우리 대사관이 전달하고 그 사본을 위넌트에게 보내어 [104면] 처칠 총리에게 전달하도록 할 것을 요청하였다. 그는 리히 제독[주94]에게, 대통령 앞으로 온 총리의 개인 메시지에 대하여는 우리가 모스크바 대사관을 통하여 이 문제를 처리하고 있으며 위넌트에게 우리 전보의 사본을 총리에게 주도록 지시하고 있다는 것만을 진술하여 회답하라고 지시하였다. (이 지시들은 오늘 오후에 이행되었다.)[주94a]\n\nH. 프리먼 매슈스(H. Freeman Matthews)", "secondary": "[Washington,] April 30, 1945.\n\nParticipants: The President\n\nActing Secretary of State Grew\n\nMr. William Phillips [주90]\n\nMr. H. Freeman Matthews\n\nMr. Grew told the President that a government had been set up in Austria obviously under Russian instigation. The only information which we had other than that contained in the press was a notification received on April 27 from the Soviet Government to the effect that Renner, a well known Austrian Socialist leader and former Chancellor, was planning to form a government and that the Soviet did not intend to oppose his administration. [주91] Mr. Grew continued that the British Foreign Office had already issued a statement declining to recognize the new government (he read the ticker report) and he thought we should get out a statement along similar lines. Mr. Grew then read a draft statement which the President promptly approved (without change) and which was subsequently issued by the Department. [주92]\n\nMr. Grew continued that the Prime Minister proposed to register a strong protest at Moscow and asked the President to join him in a message to Stalin. [주92a] Mr. Grew asked whether the President agreed that we should make some representations to Moscow. He outlined briefly to the President the composition of the Austrian Government and the fact that Moscow-trained Communists seemed to hold the key positions of Minister of Interior and Minister of Education and Religion. [주93] The President said that he agreed that we should protest against the procedure of the Soviet Government hi acting unilaterally without consultation but not to comment on the composition of the Government. He requested that this protest be delivered by our Embassy at Moscow and a copy sent to Winant to communicate to [104면] Prime Minister Churchill. He told Admiral Leahy [주94] to reply to the Prime Minister’s personal message to the President merely stating that we were taking it up through our Moscow Embassy and that Mr. Winant was being directed to give him a copy of our telegram. (These directions were carried out this afternoon.) [주94a]\n\nH. Freeman Matthews", "notes": ["[주90] 국무장관 특별보좌관.", "[주91] 모스크바발 4월 26일 오후 6시자 전보 1361호로 전달된 비신스키의 통보를 가리키는 것으로 보인다. 94면.", "[주92] 아래 문서.", "[주92a] 여기서 가리키는 것은 4월 30일 처칠이 트루먼 대통령에게 보낸 제25호 및 제26호 메시지이다. 위 문서들.", "[주93] 오스트리아 내무담당 국무비서(Staatssekretär für Inneres) 프란츠 호너(Franz Honner)와 국민계몽·교육·종교담당 국무비서(Staatssekretär für Volksaufklärung, Unterricht und Kultusangelegenheiten) 에른스트 피셔(Ernst Fischer).", "[주94] 윌리엄 D. 리히(William D. Leahy) 제독, 미 육해군 총사령관 막료장.", "[주94a] 소련 정부에 대한 항의의 본문은 4월 30일 모스크바 앞 전보 981호를 보라. 아래. 대통령이 요청한 취지의 처칠 총리 앞 회답은 그의 제19호 메시지로 발송되었으며 인쇄하지 않았다."], "warn": false, "pages": ["104"], "search": "Truman 트루먼(대통령) Grew 그루(국무장관 대리) William Phillips 윌리엄 필립스(국무장관 특별보좌관) Matthews 매슈스(유럽국장) Renner 레너(오스트리아 임시정부 수반) Churchill 처칠(영국 총리) Stalin 스탈린 Winant 위넌트(주영대사) Leahy 리히(제독)"}, {"id": "d78", "order": 78, "date": "1945-04-30", "group": "B", "eyebrow": "d78 · Statement by the Acting Secretary of State  Typed heading to the statement reads: “For attribution to the Acting Secretary of State but not for quotation.”", "title": "국무장관 대리의 성명", "badge": null, "list_right": "문서 78", "meta": [{"k": "일자", "v": "1945-04-30"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.019 Control (Austria)/5–445", "txt": true}, {"k": "발신", "v": "The Acting Secretary of State (Grew) 국무장관 대리 그루", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 78 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d78"}], "summary": "미국 정부는 카를 레너를 수반으로 하는 오스트리아 임시정부를 승인하지 않으며, 이 문제 전체를 소련 정부와 논의하고 있다고 밝혔다.", "points": ["타자로 친 표제에 「국무장관 대리의 발언으로 귀속시키되 직접 인용은 불가」라고 적혀 있다.", "국무부가 카를 레너 박사를 수반으로 하는 오스트리아 신임시정부를 오스트리아의 임시 당국으로 승인하는지, 또 그 수립에 관한 공식 확인을 받았는지 물음을 받았다.", "국무장관 대리는 카를 레너를 수반으로 하는 오스트리아 임시정부가 빈에서 구성되었다는 모스크바발 언론 보도를 보았으나 미국 정부는 아직 이를 확인받지 못했다고 답했다.", "4월 27일에 소련 정부로부터 레너 박사가 오스트리아 임시정부 구성을 제안하였고 소련 정부는 이를 방해할 뜻이 없다는 통보를 받았다고 했다.", "미국 정부는 이 오스트리아 임시정부를 승인하지 않는다.", "이 문제 전체를 지금 빈을 점령하고 있는 소련 정부와 논의하고 있다."], "primary": "[워싱턴,] 1945년 4월 30일.\n\n국무부가 카를 레너 박사를 수반으로 하는 오스트리아 신(新)임시정부를 오스트리아의 임시 당국으로 승인하는지, 또는 국무부가 그 수립에 관한 어떠한 공식 확인이라도 받았는지 묻자, 국무장관 대리는 카를 레너를 수반으로 하는 오스트리아 임시정부가 빈에서 구성되었다는 모스크바발 언론 보도에 유의하였으나 미국 정부는 아직 이 사태 진전에 관한 확인을 받지 못하였다고 말하였다. 국무장관 대리는 또한 4월 27일에 소련 정부로부터 레너 박사가 오스트리아 임시정부의 구성을 제안하였으며 소련 정부는 이 사태 진전을 방해할 의사가 없다는 통보를 받았다고 말하였다. 그는 미국 정부가 이 오스트리아 임시정부를 승인하지 아니하며, 이 문제 전체를 지금 그 군대가 빈을 점령하고 있는 소련 정부와 논의하고 있다고 덧붙였다.", "secondary": "[Washington,] April 30, 1945.\n\nAsked whether the State Department recognized the new provisional government of Austria headed by Dr. Karl Renner as temporary authority in Austria, or whether the Department had received any official confirmation of its formation, the Acting Secretary of State said that he had noted press reports emanating from Moscow that a provisional Austrian government headed by Karl Renner had been formed at Vienna but added that the United States Government has not yet had confirmation of this development. The Acting Secretary also said that on April 27 notification was received by the Soviet Government that the formation of a provisional Austrian government had been proposed by Dr. Renner and the Soviet Government was not disposed to hinder this development. He added that the United States Government does not recognize this provisional Austrian Government and that the whole question is being taken up with the Government of the USSR whose troops are now in occupation of Vienna.", "notes": ["[주95] 이 성명의 타자로 친 표제에는 「국무장관 대리의 발언으로 귀속시키되 직접 인용은 하지 말 것」이라고 적혀 있다."], "warn": false, "pages": [], "search": "Grew 그루(국무장관 대리) Karl Renner 카를 레너(오스트리아 임시정부 수반)"}, {"id": "d79", "order": 79, "date": "1945-04-30", "group": "A", "eyebrow": "d79 · The Acting Secretary of State to the Chargé in the Soviet Union (Kennan)", "title": "국무장관 대리가 주소련 대리대사(케넌)에게", "badge": null, "list_right": "문서 79", "meta": [{"k": "일자", "v": "1945-04-30"}, {"k": "시각", "v": "Washington, April 30, 1945—9 p.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "981"}, {"k": "원문출처", "v": "863.01/4–2645: Telegram", "txt": true}, {"k": "발신", "v": "The Acting Secretary of State (Grew) 국무장관 대리 그루", "txt": true}, {"k": "수신", "v": "The Chargé in the Soviet Union (Kennan) 주소련 대리대사 케넌", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 79 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d79"}], "summary": "협의 없이 오스트리아 임시정부가 수립된 데 대한 미국의 항의 문안이다. 얄타의 해방유럽선언 정신에 따라 협의를 준비하던 중 언론으로 알게 되었다며, 연합국 대표의 즉시 빈 파견과 EAC 의정서의 지체 없는 완성을 요구했다.", "points": ["영국 동료와 협의를 마친 뒤 소련 정부에 다음과 같이 통고하라는 훈령이다.", "미국 정부는 얄타의 해방유럽선언 정신에 따라 열린 마음과 신의로 레너의 제안에 관해 소련 정부와 협의할 준비를 하고 있었는데, 소련 점령 지역에 이미 오스트리아 임시정부가 수립되었음을 언론을 통해 알고 놀랐다.", "이러한 사태는 소련 당국이 충분히 알고 허가해야만 그 지역에서 일어날 수 있는 일이다.", "그럼에도 소련은 1361호로 전한 빈약한 정보 이상으로 우리와 협의하거나 알리지 않았고, 레너 임시정권 수립에 앞서 우리와 조율할 시간을 주지도 않았으며, 우리는 그 내용을 오로지 언론으로만 알았다.", "우리는 「4대국이 승인하는 오스트리아 정부가 수립될 때까지」 오스트리아의 최고 권한이 EAC에 제출된 통제 기구 제안에 따라 연합국 군정을 통해 4대국이 평등하게 공동으로 행사한다는 것이 소련 정부의 의사로 남아 있다고 본다.", "이러한 사태에 비추어, 스탈린이 제안한 대로 연합국 대표들이 즉시 빈으로 가고 점령지대 및 통제 기구에 관한 의정서가 EAC에서 지체 없이 완성되는 일이 더욱 필요하다.", "런던에 3395호로 반복 발송하며 총리에게 알리라는 지시를 붙였고, 파리에 1777호, 카세르타의 에어하트에게 411호로 반복 발송했다."], "primary": "워싱턴, 1945년 4월 30일 오후 9시.\n\n981. 귀하의 영국 측 동료와 협의를 마친 뒤, 귀하의 4월 26일 오후 6시자 1361호 및 국무부의 4월 28일 오후 7시자 972호[주96]와 관련하여 소련 정부에 다음과 같이 통고하라.\n\n[105면]\n\n해방 유럽에 관한 얄타 선언[주97]의 정신에 따라 우리 정부는 열린 마음으로, 또 신의를 가지고 레너의 제안에 관하여 소련 정부와 협의할 준비를 하고 있던 차에, 오스트리아의 소련 점령 지역에 이미 오스트리아 임시정부가 수립되었다는 사실을 언론을 통하여 알고 놀랐다. 이러한 사태 진전은 소련 당국이 충분히 알고 허가하여야만 그 지역에서 일어날 수 있는 것이다. 그럼에도 소련 당국은 귀하의 1361호로 전달된 빈약한 정보 이상으로 우리와 협의하거나 우리에게 알리지 아니하였으며, 레너의 임시정권이 수립되기에 앞서 우리가 그들과 조율할 시간을 주지도 아니하였다. 우리는 그 자세한 내용을 오로지 언론을 통하여서만 알게 되었다.\n\n우리는 오스트리아의 최고 권한이, 현재 유럽자문위원회에 제출되어 있는 통제 기구 제안에 구상된 연합국 간 군정을 통하여 「4대국이 승인하는 오스트리아 정부가 수립될 때까지」 4대국이 평등의 기초 위에서 공동으로 행사하리라는 것이 소련 정부의 의사로 여전히 남아 있다고 본다.\n\n오스트리아에 관한 한 크림 선언에 따라 소련 당국과 효과적으로 협력할 수 있도록 하기 위하여, 이러한 사태 진전에 비추어 스탈린 원수가 제안한 대로(대사관의 4월 13일 자정자 1162호) 연합국 대표들이 즉시 빈으로 나아가는 일과, 점령지대 및 통제 기구에 관한 의정서들이 EAC에서 지체 없이 완성되는 일이 더욱더 필요하다.\n\n런던에 3395호로 반복 발송하며 총리에게 알리도록 지시하였다. 파리에 1777호로, 카세르타의 에어하트에게 411호로도 반복 발송하였다.\n\n그루(Grew)", "secondary": "Washington, April 30, 1945—9 p.m.\n\n981. After concerting with your British colleague please inform the Soviet Government as follows with reference your 1361, April 26, 6 p.m. and Dept’s 972, April 28, 7 p.m. [주96]\n\n[105면]\n\nIn the spirit of the Yalta declaration on liberated Europe [주97] this Government was preparing with an open mind and in good faith to consult with the Soviet Government about Renner’s proposal, when it was surprised to learn through the press that a provisional Austrian government had already been formed in the Soviet-occupied part of Austria. This development could occur in that area only with the full knowledge and permission of the Soviet authorities. Yet they failed to consult us or inform us beyond the meager information conveyed in your 1361, or to allow time for us to concert with them prior to the establishment of Renner’s provisional regime, the details of which we have learned solely from the press.\n\nWe assume that it remains the intention of the Soviet Government that supreme authority in Austria will be exercised by the four powers acting jointly on a basis of equality, through the inter-allied military government envisaged in the proposals for control machinery now before the European Advisory Commission “until the establishment of an Austrian government recognized by the four powers”.\n\nIn order that we may collaborate with the Soviet authorities effectively in accordance with the Crimea declaration as far as Austria is concerned it is, in view of this development, all the more necessary that allied representatives proceed at once to Vienna as suggested by Marshal Stalin (Embassy’s 1162, April 13, midnight) and that the protocols on zones of occupation and control machinery be completed in EAC without delay.\n\nRepeated to London as no. 3395 with instructions to inform the Prime Minister; repeated also to Paris as no. 1777, and to Caserta for Erhardt as no. 411.\n\nGrew", "notes": ["[주96] 인쇄하지 않은 4월 28일 모스크바 앞 전보 972호는, 오스트리아 임시정부 수립 제안에 관한 통보를 미국 정부가 검토 중이며, 4대국 모두가 합의하기 전에는 어느 나라도 오스트리아 정부를 승인하지 아니하리라고 미국 정부가 여긴다는 점을 소련 정부에 알리도록 대리대사에게 지시하였다 (740.00119 Control (Austria)/4–2845).", "[주97] 해방 유럽에 관한 선언(Declaration on Liberated Europe)은 1945년 2월 12일 언론에 공개된 크림회담 보고서의 제5부로 포함되었다. 본문은 Conferences at Malta and Yalta, 971면을 보라."], "warn": false, "pages": ["105"], "search": "Grew 그루(국무장관 대리) Kennan 케넌(주소련 대리대사) Renner 레너(오스트리아 임시정부 수반) Stalin 스탈린 Churchill 처칠(영국 총리) Erhardt 에어하트(오스트리아 문제 담당 미국 정치고문)"}, {"id": "d80", "order": 80, "date": "1945-04-30", "group": "A", "eyebrow": "d80 · The Chargé in the Soviet Union (Kerman) to the Secretary of State", "title": "주소련 대리대사(케넌)가 국무장관에게", "badge": null, "list_right": "문서 80", "meta": [{"k": "일자", "v": "1945-04-30"}, {"k": "시각", "v": "Moscow, April 30, 1945—9 p.m. [Received 10:45 p.m.]"}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": "1424"}, {"k": "원문출처", "v": "863.01/4–3045: Telegram", "txt": true}, {"k": "발신", "v": "The Chargé in the Soviet Union (Kennan) 주소련 대리대사 케넌", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 80 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d80"}], "summary": "오스트리아 임시정부에서 공산주의자가 내무 장관직을 쥔 사실의 의미를 짚으며, 동유럽·중유럽 전역에서 러시아가 경찰 기구 장악을 첫째 목표로 삼아 온 사례를 열거했다.", "points": ["오스트리아 임시정부 구성에서 공산주의자가 내무부를 계속 쥔 사실의 중요성에 주의를 환기했다.", "러시아는 지배적 영향력을 행사하려는 모든 지역에서 내부 행정·경찰 기구, 특히 비밀경찰의 장악을 첫째가는 주요 목표로 삼는 것이 이제 확립된 관행이다.", "러시아인의 사고는 경찰 기구(공개·비밀 모두)의 장악이 권력 투쟁의 절반을 이긴 것이고, 선거를 포함한 공적 생활의 다른 모든 발현은 결국 이 권한으로 빚어낼 수 있다는 믿음에 기운다.", "핀란드는 레이노, 폴란드는 라드키에비치(NKVD 직속 대표로 널리 여겨짐), 체코슬로바키아는 노세크, 루마니아는 게오르게스쿠(법무부 파트라슈카누가 뒷받침), 헝가리는 에르데이 페렌츠다. 모두 공산주의자이거나 공산 세력의 중심이다.", "불가리아 유고프와 유고슬라비아 제체비치는 상세 정보가 없으나 공산주의자가 아니더라도 최소한 전적으로 믿을 만한 인물로 여겨질 것이라고 보았다.", "오스트리아 임시정부에서 공산주의자로 공표된 인원이 셋뿐이라 해도, 러시아가 지배적 영향력을 갖지 못하는 항구적 오스트리아 정부를 기꺼이 받아들이리라는 표시로 보아서는 안 된다.", "내무부 유지와 청년 교육 장악, 그리고 노령 총리의 관방에 활동적이고 빈틈없는 공산주의자를 둔 것은 이곳에서 든든한 진지로 여겨질 것이며, 장래에 모스크바는 늘 그렇듯 「시세가 감당하는 만큼」 값을 매길 것이다."], "primary": "모스크바, 1945년 4월 30일 오후 9시.\n [접수 오후 10시 45분]\n\n1424. 오스트리아에 방금 수립된 임시정부의 구성과 관련하여, 본인은 공산주의자가 내무부의 소관을 계속 쥐고 있는 사실의 중요성에 주의를 환기하고자 한다. 지배적 영향력을 행사하고자 하는 모든 지역에서 내부 행정 및 경찰 기구, 특히 비밀경찰의 장악을 첫째가는 주요 목표로 삼는 것은 이제 확립된 러시아의 관행이다. 러시아인의 사고는 이 나라의 정치적 경험에 뿌리를 둔 다음과 같은 믿음에 기울어 있다 — 즉 [106면] 공개·비밀 양쪽의 경찰 기구를 장악하는 것은 권력 투쟁에서 절반을 이긴 것이며, 선거를 포함한 공적 생활의 다른 모든 발현은 결국 이 권한으로 빚어낼 수 있다는 것이다.\n\n국무부는 러시아 측이 최근 지배적 영향력을 추구해 온 동유럽과 중유럽의 다른 모든 나라에서도 이 정책이 반영되어 있음을 보게 되리라고 본인은 생각한다. 핀란드에서는 최근에야 내무부가 어느 공산주의자(레이노)[주98]의 손에 온전히 넘어갔다. 폴란드에서는 경찰을 통제하는 공안 행정이 라드키에비치[주99]의 수중에 있는데, 그는 출신이 불분명한 공산주의자로서 이곳에서는 러시아 NKVD[주1]의 직접적인 대표이며 정부 내 동료들로부터 독립하여 자기 분야에서 유례없는 권한을 행사한다고 널리 믿어지고 있다. 새 체코슬로바키아 정부에서 내무부를 맡은 노세크[주2]는 창당 이래로 체코 공산당원이었다. 루마니아에서는 게오르게스쿠[주3] 역시 공산주의자이며, 법무부를 쥐고 있는 같은 당원 파트라슈카누[주4]가 그를 뒷받침하고 있다. 헝가리 내무장관 에르데이 페렌츠 박사는 본인이 이해하기로 헝가리 임시정부 내 공산주의 부문의 중심이다. 불가리아의 유고프[주5]와 유고슬라비아의 제체비치[주6]에 관하여는 상세한 정보가 없으나, 그들이 공산주의자가 아니라 하더라도 적어도 공산주의자들이 전적으로 믿을 만한 사람으로 여긴다는 사실이 밝혀지리라고 본인은 생각한다.\n\n따라서 모스크바가 오스트리아 임시정부에서 공산주의자로 공공연히 지목된 인원 셋만으로 만족하였다 하더라도, 이는 러시아 측이 스스로 지배적 영향력이라 여기는 것을 갖지 못하는 항구적 오스트리아 정부를 기꺼이 받아들일 용의가 있다는 표시로 받아들여져서는 아니 된다. 현재의 새 정권에서 내무부의 보유와 아울러 청년 교육의 장악, 그리고 노령의 총리 관방에 활동적이고 빈틈없는 공산주의자[주7]를 둔 것은 이곳에서 든든한 진지로 여겨질 것이다. 장래에 관하여 모스크바는 늘 그러하듯 「시세가 감당하는 만큼」 값을 매길 것이다.\n\n카세르타의 에어하트에게 76호로 반복 발송.\n\n케넌(Kennan)\n\n[107면]", "secondary": "Moscow, April 30, 1945—9 p.m. \n [Received 10:45 p.m.]\n\n1424. With respect to the composition of the Provisional Government which has just been set up in Austria, I wish to invite attention to the significance of the Communist retention of the portfolio of the Ministry of the Interior. It is now established Russian practice to seek as a first and major objective, in all areas where they wish to exercise dominant influence, control of the internal administrative and police apparatus, particularly the secret police. The Russian mind is partial to the belief, founded in the political experience of [106면] this country, that control of the police establishment, both open and secret, is half the battle won in the struggle for power, and that all other manifestations of public life including elections can eventually be shaped by this authority.\n\nThe Department will see this policy reflected, I believe, in every one of the other countries in Eastern and Central Europe in which the Russians have recently sought dominant influence. In Finland the Ministry of the Interior has only recently been taken over entirely by a Communist (Leino). [주98] In Poland the administration of public security which controls the police is in the hands of Radkiewicz, [주99] a Communist of obscure origin widely believed here to be a direct representative of the Russian NKVD [주1] and to exercise a unique authority in his field, independent of his colleagues in the Government. Nosek [주2] who was given the Interior Ministry in the new Czechoslovak Government has been a member of the Czech Communist Party since its inception. In Rumania, Georgescu [주3] is also a Communist and is backed by a fellow party member, Patrascanu, [주4] who holds the Ministry of Justice. The Hungarian Minister of the Interior, Dr. Erdei Ferec is, as I understand it, the strength of the Communist sector of the Hungarian Provisional Government. About Yugov [주5] in Bulgaria and Zagevich [주6] in Yugoslavia I have no detailed information but I think it will be found that if they are not Communists they are at least regarded by the latter as entirely reliable people.\n\nIf, therefore, Moscow has contented itself with only three members of the Austrian Provisional Government openly designated as Communists, this should not be taken as an indication that the Russians would be prepared to accept willingly a permanent Austrian Government in which they would not have what they consider a controlling influence. In the present new regime retention of the Ministry of the Interior together with control of education of the youth and an active and watchful Communist [주7] in the chancery of the elderly Premier will be considered here as a solid position. For the future Moscow will charge as usual what the traffic will bear.\n\nRepeated to Caserta for Erhardt as 76.\n\nKennan\n\n[107면]", "notes": ["[주98] 위리외 레이노(Yrjö Leino).", "[주99] 스타니스와프 라드키에비치(Stanislaw Radkiewicz), 폴란드 공안부 장관.", "[주1] 소련 내무인민위원부(Narodnyi Kommissariat Vnutrennykh Del).", "[주2] 바츨라프 노세크(Václav Nosek), 체코슬로바키아 내무장관.", "[주3] 테오하리 게오르게스쿠(Teohari Georgescu), 루마니아 내무장관.", "[주4] 루크레치우 파트라슈카누(Lucretiu Patrascanu), 루마니아 법무장관.", "[주5] 안톤 유고프(Anton Yugov), 불가리아 내무장관.", "[주6] 블라다 제체비치(Vlada Zečevič), 유고슬라비아 임시정부 내무장관.", "[주7] 레너 총리가 창설한 「내각회의(Kabinettsrat)」의 세 구성원 가운데 하나인 요한 코플레니히(Johann Koplenig)를 가리킨다. 설명은 Österreichisches Jahrbuch, 1945–1946, 9면을 보라."], "warn": false, "pages": ["106", "107"], "search": "Kennan 케넌(주소련 대리대사) Leino 레이노(핀란드 내무장관) Radkiewicz 라드키에비치(폴란드 공안부 장관) Nosek 노세크(체코슬로바키아 내무장관) Georgescu 게오르게스쿠(루마니아 내무장관) Patrascanu 파트라슈카누(루마니아 법무장관) Erdei Ferec 에르데이 페렌츠(헝가리 내무장관) Yugov 유고프(불가리아 내무장관) Zečevič 제체비치(유고슬라비아 내무장관) Koplenig 코플레니히(오스트리아 공산당) Renner 레너(오스트리아 임시정부 수반)"}, {"id": "d198", "order": 198, "date": "1945-04-30", "group": "B", "eyebrow": "d198 · Memorandum by the State-War-Navy Coordinating Committee to the Acting Secretary of State", "title": "국무·육군·해군 3부조정위원회가 국무장관 대리에게 보내는 각서", "badge": null, "list_right": "문서 198", "meta": [{"k": "일자", "v": "1945-04-30"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740w00119 Control (Germany)/4–3045", "txt": true}, {"k": "발신", "v": "The State-War-Navy Coordinating Committee 국무·육군·해군 3부조정위원회(SWNCC)", "txt": true}, {"k": "수신", "v": "The Acting Secretary of State 국무장관 대리", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 198 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d198"}], "summary": "프랑스가 요구한 독일 점령지대 안(案)에 대해 합동참모본부와 3부조정위원회가 공동으로 검토한 결과, 라인강 동쪽의 헤센과 프랑크푸르트·카셀은 미국 지대에 남겨야 하며 프랑스에는 바덴 정도를 우선 제시하라고 권고한 문서다.", "points": ["프랑스 안(案)은 현재 형태로는 병참상 중대한 군사적 반대에 부딪히며, 그대로 받아들이면 독일·오스트리아 주둔 미군의 군사적 지원에 매우 해롭다고 판단했다.", "라인강 서쪽 지대 할당 자체에는 이의가 없으나 그 지역은 현행 의정서상 영국 몫이므로, 프랑스의 요구는 미국이 아니라 영국 정부에 제기하는 것이 마땅하다고 했다.", "쾰른시(市)는 라인강 양안에 걸쳐 있는데, 동안(東岸) 부분은 미·영의 철도 병참선에 긴요하므로 프랑스 지대에 들어가는 범위는 서안(西岸)으로 한정되어야 한다.", "코블렌츠는 영국과 미국 사이의 환적 지점이므로, 라인강 동쪽 부분을 프랑스에 할당해서는 안 된다고 했다.", "카셀과 프랑크푸르트암마인은 브레멘·브레머하펜에서 들어오는 보급망의 핵심 결절점이므로 반드시 미국 지대에 남아야 한다.", "바덴은 네 개의 소구역(Landeskommissarbezirke)으로 나누어 검토했다. 콘스탄츠와 프라이부르크는 내줄 수 있고, 카를스루에는 큰 문제가 없으며, 만하임은 통과 통행권이 확실히 보장되는 조건에서만 가능하다.", "프랑스가 요구한 오스트리아의 「혼합 점령」은 행정이 어렵고 주민이 점령국들을 이간할 여지를 주므로 찬성하지 않으나, 포어아를베르크와 티롤의 프랑스 지대에는 군사적 반대가 없다.", "아이젠하워 장군은 프랑크푸르트시가 자신의 사령부 부지 요건을 채우는 미국 지대 내 유일한 곳이라고 밝혔다.", "「대(大)베를린」 지대를 포츠담까지 넓히는 데에는 군사적 필요나 이점이 없다고 보았다."], "primary": "워싱턴, 1945년 4월 30일.\n\n국무·육군·해군 3부조정위원회는, 귀하가 1945년 3월 3일 육군장관과 해군장관에게 각각 보낸 동일 내용의 서한[주85]에 제시된 바, 독일 내 프랑스 점령지대에 관한 프랑스 정부의 제안 및 오스트리아 점령 참가에 관한 프랑스 측 의견을 검토하였다. 아울러 1945년 3월 23일자 위넌트 대사의 대(對)국무부 전보(Cornea 197)에 기술된, 영국 지대의 일부를 프랑스에 이양하겠다는 영국 측 제안도 함께 검토하였다. 이 사안들은 합동참모본부와 협력하여 연구되었으며, 다음의 소견과 결론은 [249면] 합동참모본부와 국무·육군·해군 3부조정위원회가 함께 동의한 것이다.[주86]\n\n**1.**\n\n프랑스로서는 프랑스 지대가 프랑스 국경에 접해 있는 것이 바람직하다는 점은 인정되나, 현재의 제안은 특히 병참의 관점에서 중대한 군사적 반대를 받는다고 여겨지며, 그 제안을 현재 형태 그대로 수락하는 것은 독일 및 오스트리아 주둔 미국 점령군에 대한 군사적 지원에 매우 해로울 것으로 판단된다.\n\n**2.**\n\n라인강 서쪽 지대의 할당을 요구하는 프랑스 제안의 그 부분에 대해서는 아무런 이의가 없으나, 이 지역은 현행 의정서상 영국에 할당되어 있으므로 그 점에 관한 프랑스의 요구는 미국보다 영국 정부에 제기하는 것이 더 온당하다는 점을 지적한다. 이와 관련하여, 프랑스 제안이 라인강 서쪽 프랑스 지대의 북쪽 경계를 정하지 않고 있음을 지적한다. 어떤 합의가 이루어지기 전에 이 경계는 명확히 획정되어야 한다. 쾰른 및 아헨 관구(Bezirke)의 북쪽 경계보다 북으로 프랑스 지대를 확장하는 것은 저지대 항구들로부터 미국 지대와 영국 지대 양쪽으로 향하는 교통의 흐름을 차단할 것이므로 수락할 수 없다. 쾰른시는 라인강 양안에 걸친 지역으로 이루어져 있으며, 동안(東岸) 부분에는 라인강 동안을 따라 이어지는 미국과 영국의 철도 병참선 양쪽에 긴요한 철도 시설이 포함되어 있다. 프랑스 제안의 문언은 쾰른시 가운데 라인강 서안에 있는 부분만을 프랑스 지대에 넣으려는 뜻으로 보이나, 이는 명확히 되어야 하며 라인강 서안에 있는 시(市) 부분으로 분명히 한정되어야 한다. 그렇지 않으면 라인강 동안을 따르는 미국과 영국의 철도 연락선의 긴요한 고리 하나가 차단될 것이다.\n\n**3.**\n\n코블렌츠 행정관구(Regierungsbezirk)를 프랑스 지대에 넣자는 영국 측 제안에 관하여는, 이 지역 가운데 라인강 동쪽에 있는 부분은 프랑스에 할당되어서는 안 된다는 것이 미국의 견해다. 쾰른에 관하여 논한 것과 같은 고려가 코블렌츠 지역에는 더욱 강하게 적용되기 때문이다. [250면] 게다가 코블렌츠시는 영국과 미국 사이의 환적 지점이다. 이곳을 프랑스의 통제 아래 두는 것은 이미 복잡한 작전 상황의 어려움을 실질적으로 가중시켜 아마도 운용 불가능한 지경에 이르게 할 것이다.\n\n**4.**\n\n처음에 미국 점령군은 독일 진입 중에 설치된 병참선을 통해 보급을 받을 것이며, 여기에 저지대 항구들(안트베르펜과 로테르담)로부터의 병참선이 보태질 것이다. 브레멘과 브레머하펜 항이 가동되면 미군의 주 보급은 브레멘과 브레머하펜에서 영국 지대를 지나 카셀을 경유하여 독일 내 미국 지대의 여러 배급 거점으로 보내지고, 거기서 독일과 오스트리아 전역에 주둔한 부대에 배분될 것이다. 민간 구호물자의 배급도 같은 경로를 따를 것이다. 카셀과 프랑크푸르트암마인은 이 배급망의 핵심 결절점이다. 미국 점령군을 성공적으로 지원하기 위해서는 이 핵심 도시들이 미국 지대에 남는 것이 필수적이다. 이 보급 경로가 계속 이용 가능해야 하기 때문이다.\n\n**5.**\n\n라인강 동쪽 독일 내 지대에 관한 프랑스 제안은 바덴, 헤센, 헤센나사우(제안서에는 바덴, 헤센, 헤센카셀, 헤센다름슈타트로 기술되어 있다)의 독일 주(州)들을 프랑스에 할당하게 되며, 핵심 결절 도시인 카셀과 프랑크푸르트암마인, 그리고 거기서 뷔르템베르크와 바이에른으로 뻗어 나가는 교통망을 미국이 아닌 프랑스의 통제 아래 놓이게 할 것이다.\n\n**6.**\n\n프랑스 제안은 라인강이 흐르는 지역을 포함하고 있는 만큼, 미군이 이 강에 접근하지 못하게 만들 것이다. 라인강 수계 항구들의 보유는 이 강을 이용하는 데 필수적이다. 여러 지역 사이에 오가야 하는 석탄과 그 밖의 대량 화물은 통상 라인강 수계로 운송된다. 철도 체계가 파괴된 상황을 고려하면, 남서부 지대에서 미국 점령군을 지원하고 민간 경제를 유지하는 데 라인강 수계의 이용은 필수적일 것이다.\n\n**7.**\n\n프랑스 제안은, 프랑스에 점령지대가 할당되어야 하고 그것이 영국 지대와 미국 지대에서 떼어 만들어져야 한다고 합의한 얄타 의정서에 부합한다. 프랑스 제안에 관하여 도달한 결론은 간략히 다음과 같다.\n\n**a.**\n\n헤센과 헤센나사우는 미국 점령군을 지원하기 위한 미국 지대의 미국 통제에 필수적이며, 핵심 결절 도시인 카셀과 프랑크푸르트암마인을 품고 있다. 병참상의 이유로, 미국 지대와 그 기지 항구인 브레멘·브레머하펜 사이의 병참선에 가급적 방해가 없어야 함이 절대적이다. [251면] 미군을 지원하기 위해 조직 구조가 다르고 언어가 다른 두 나라의 군대를 상대해야 한다면 극히 곤란한 병참 상황이 빚어질 것이다. 미국 지대의 주된 행정 구역까지 다른 나라 군대의 통제 아래 놓인다면 상황은 아마도 운용 불가능해질 것이다.\n\n**b.**\n\n바덴을 프랑스 지대에 넣자는 제안은, 바덴이 나뉘어 있는 네 개의 더 작은 지리적 구역(Landeskommissarbezirke)에 관하여 검토되어야 할 문제들을 제기한다.\n\n**(1)**\n\n콘스탄츠와 프라이부르크는 미국 지대에서 내놓을 수 있다.\n\n**(2)**\n\n카를스루에는 프랑스 지대에 포함되더라도 그다지 심각한 문제를 낳지 않을 것이다.\n\n**(3)**\n\n만하임은 프랑크푸르트암마인과 슈투트가르트 사이의 교통을 차단하는데, 이 두 곳은 모두 미국의 중요한 행정·배급 거점이며, 만하임은 미국 지대에 필수적인 시설들을 품고 있다. 합동참모본부는 병참상의 이유로, 이 지역의 프랑스 점령은 미군 지휘관이 필요하다고 판단하는 만큼의 통과 통행권이 명백하게(unequivocal) 미군에게 부여된다는 조건에서만 이루어질 수 있다고 확신한다. 그러한 조치가 성사될 수 있다면 이 지역을 프랑스 지대에 넣는 데 심각한 반대는 없다.\n\n**c.**\n\n국무부의 의견으로는, 근본 쟁점은 크림 회담에서 한 약속을 이행하는 것, 그리고 보다 당면한 군사적 필요만이 아니라 우리 정부의 장기적 정치적 이익을 지키는 것이다.\n\n**8.**\n\n통행권에 관한 적절한 안전장치를 갖춘다면, 바덴주(州)와 뷔르템베르크주 및 지크마링겐 지방을 프랑스에 주는 데 압도적인 군사적 반대는 없다. 다만 뒷날 미국의 활동이 뮌헨 지역에 집중될 수 있으므로 뷔르템베르크와 지크마링겐은 보유하는 것이 군사적으로 바람직하다. 그러나 프랑스는 바덴주만 받고도 만족할 수 있을 것이므로, 처음에는 그 지역만 내놓겠다고 프랑스에 제의할 것을 권고한다. 바덴주에 더하여 뷔르템베르크주와 지크마링겐 지방을 프랑스에 주든 안 주든, 미국 지대에 접하고 그 서쪽에 놓인 프랑스 지대의 어느 부분이든 통과할 권리를 보장하는 명확한 합의를 프랑스와 맺을 필요가 있을 것이다. 특히 미군이 라인강 위에 건설한 교량들과 미군이 독일에 건설한 통신 시설에 대한 배타적 권리가 그러하다.\n\n**9.**\n\n아이젠하워 장군은 프랑크푸르트시가 자신의 장래 사령부 부지로서의 요건을 충족하는, 미국 지대 안에서 찾아낸 유일한 곳이라고 말하였다. 이러한 이유로 [252면] 프랑크푸르트와 그 주변의 상당한 지역이 미국 지대에 남으리라는 보장을 확보하기 위한 조치가 취해져야 한다.\n\n**10.**\n\n「대(大)베를린」 지대를 포츠담까지 넓히는 데에는 아무런 군사적 필요나 이점이 인정되지 않으나, 이는 일차적으로 소련의 관심사이며 관계된 모든 열강의 고려를 요하는 문제임을 지적한다.\n\n**11.**\n\n오스트리아를 지대별이 아니라 혼합하여 점령하자는 프랑스 측 의견은 호의적으로 보이지 않는다. 혼합 점령은 행정하기 어려우며, 특히 언어와 법 관념의 차이가 얽힐 때 그러하다. 서로 다른 국적의 점령군이 같은 지역에 있으면, 비우호적이거나 비협조적인 주민은 한 국적을 다른 국적에 맞붙여 이간하기에 이상적인 위치에 서게 되고 그 상황을 재빨리 이용할 것이다. 이 의견은 영국과 소련에도 제출하여 그들의 수락을 받아야 하는 것이므로 미국 단독으로 동의할 수 없다. 나아가 이는 현행 의정서들 아래에서 지금까지 발전시켜 온 점령의 이론 전체를 다시 열어 고쳐야 하는 일이 될 것이다. 반면 오스트리아의 포어아를베르크와 티롤에 프랑스 점령지대를 두는 데에는 아무런 군사적 반대가 인정되지 않는다.\n\n**12.**\n\n프랑스에 의한 독일 또는 오스트리아의 어떠한 점령도 미국·영국·소련이 이미 승인한 일반 조건 전부에 따라야 한다.\n\n국무·육군·해군 3부조정위원회를 대표하여,\n\nH. 프리먼 매슈스(H. Freeman Matthews)\n\n의장 대리", "secondary": "Washington, April 30, 1945.\n\nThe State-War-Navy Coordinating Committee has considered the proposals of the French Government for a French zone of occupation of Germany, together with French suggestions for participation in the occupation of Austria as set forth in your identical letters to the Secretary of War and the Secretary of the Navy of March 3, 1945. [주85] The British proposal on transfer to the French of a part of the British zone, as described in Ambassador Winant’s cable to the Department of State of March 23, 1945 (Cornea 197) has also been considered. These matters have been studied in collaboration with the Joint Chiefs of Staff and the following comments and conclusions are concurred in by [249면] the Joint Chiefs of Staff and the State-War-Navy Coordinating Committee: [주86]\n\n1.\n\nWhile the desirability to the French of having the French zone adjacent to the French border is recognized, it is believed that the present proposal is subject to grave military objections, particularly from a logistical point of view, and it is considered that acceptance of the proposal in its present form would be highly prejudicial to the military support of the United States forces of occupation in Germany and Austria.\n\n2.\n\nNo objection is perceived to that portion of the French proposal which requests the allocation of a zone west of the Rhine but it is noted that this area is under the present protocol allocated to the British, and therefore the French request in that particular is more properly addressed to the British Government rather than the United States. In this connection it is noted that the French proposal does not define the northern boundary of the French zone west of the Rhine. Before any agreement is reached this boundary should be clearly delineated. Any extension of the French zone north of the northern boundaries of the Bezirke of Cologne and Aachen would intercept the flow of communication from the lowland ports to both the United States and British zones and would not be acceptable. The city of Cologne comprises an area on each bank of the Rhine; the portion on the east bank includes railroad facilities which are vital to both the United States and British lines of rail communications along the east bank of the Rhine. While the terms of the French proposals indicate that only that part of the city of Cologne which lies on the west bank of the Rhine is intended for inclusion in the French zone, this should be clarified and definitely limited to such portions of the city as lie on the west bank of the Rhine. Otherwise, a vital link in United States and British rail communication along the east bank of the Rhine will be intercepted.\n\n3.\n\nAs for the British proposal to include the Regierungsbezirk of Koblenz within the French zone, it is the view of the U.S. that the portion of this area which lies east of the Rhine should not be allocated to the French as the same considerations discussed with respect to Cologne apply with even greater force to the Koblenz area. In [250면] addition, the city of Koblenz is a transfer point between the British and the U.S. To put it under French control would materially increase the difficulties of an already complicated operational situation to the extent that it would probably become unworkable.\n\n4.\n\nInitially the United States occupational forces will be supplied over lines established during the entry into Germany which will be supplemented by lines from the lowland ports (Antwerp and Rotterdam) . After the ports of Bremen and Bremerhaven become operative, the main supplies for the United States forces will be routed from Bremen and Bremerhaven through the British zones via Kassel and thence to various distribution centers in the United States zone in Germany from which supplies will be distributed to troops stationed throughout Germany and Austria. Distribution of civil relief will follow the same channels. Kassel and Frankfurt am Main are key focal points in this distribution net. For the successful support of the United States forces of occupation, it is essential that these key cities remain in the United States zone since continued availability of these channels of supply is essential.\n\n5.\n\nThe French proposal for a zone in Germany east of the Rhine would allocate to the French the German provinces of Baden, Hessen and Hessen-Nassau (described in the proposal as Baden, Hessen, Hessen-Kassel and Hessen-Darmstadt) and would place under French and not United States control the key focal cities of Kassel and Frankfurt am Main, and the communications radiating therefrom to Wurttemberg and Bavaria.\n\n6.\n\nThe French proposal, incorporating as it does the area through which the Rhine flows, would deny the United States forces access to this river. Possession of ports of the Rhine system is essential to the use of the river. Coal and other bulk commodities which must be exchanged between the various areas are ordinarily transported by the Rhine river system. In view of the disrupted railway system, use of the Rhine system will be essential for support of United States occupational forces and maintenance of civilian economy in the southwestern zone.\n\n7.\n\nThe French proposal is in accord with the Yalta protocol whereby it was agreed that a zone of occupation should be allocated to France and that it would be formed out of the British and American zones. The conclusions reached with respect to the French proposal are briefly as follows:\n\na.\n\nHessen and Hessen-Nassau are essential to U.S. control of the American zone for the support of its occupational forces and contain the key focal cities of Kassel and Frankfurt am Main. For logistical reasons it is imperative that there be as little interference as possible with the lines of communication between the U.S. zone and its base ports of Bremen-Bremerhaven. The necessity of dealing with the [251면] forces of two nations with different organizational structures and different languages in order to support the U.S. forces would create an extremely difficult logistical situation. If the principal administrative district for the U.S. zone were also to be in the control of the force of another country the situation would probably become unworkable.\n\nb.\n\nThe proposal to include Baden in the French zone presents problems which must be examined with respect to the four smaller geographical areas (Landeskommissarbezirke) into which Baden is divided:\n\n(1)\n\nKonstanz and Freiburg can be released from the U.S. zone.\n\n(2)\n\nKarlsruhe would not present any very serious problem were it to be included in the French zone.\n\n(3)\n\nMannheim intercepts the communications between Frankfurt am Main and Stuttgart both of which are important U.S. administrative and distribution points and contains installations essential to the U.S. zone. The Joint Chiefs of Staff are convinced that for logistical reasons the occupation of this area by the French could take place only on the condition that unequivocal rights of through passage be granted the U.S. forces to the extent the commander of the U.S. forces deems necessary. If such arrangements can be effected there is no serious objection to inclusion of this area in the French zone.\n\nc.\n\nThe basic issue, in the opinion of the Department of State, is to carry out the commitment made at the Crimea Conference and to protect the long-range political interests of this government as well as the more immediate military needs.\n\n8.\n\nThere are no overriding military objections to giving to the French, with proper safeguards with regard to transit rights, the State of Baden, the State of Wurttemberg and the Province of Sigmaringen although it is militarily desirable to retain Wurttemberg and Sigmaringen since U.S. activities may, at a later date, be centered in the Munich area. However, the French may be satisfied with receiving the State of Baden only and it is recommended that the release of that area alone be proposed initially to the French. Regardless of whether or not the State of Wurttemberg and the Province of Sigmaringen, in addition to the State of Baden, are given to the French, it will be necessary to have a clear agreement with the French guaranteeing rights of passage through any part of the French zone lying contiguous to and west of the U.S. zone, particularly exclusive rights to the bridges which the American forces have built over the Rhine and the communication facilities which the American forces have built in Germany.\n\n9.\n\nGeneral Eisenhower has stated that the City of Frankfurt is the only location he has found in the U.S. zone that fills the requirements as the future site for his headquarters. For this reason arrangements [252면] should be made for the assurance that Frankfurt and reasonable surrounding territory will remain in the U.S. zone.\n\n10.\n\nNo military necessity or advantage is perceived in enlarging the “Greater Berlin” zone to include Potsdam but it is noted that this is a matter primarily of concern to the U.S.S.R. and requires consideration of all powers concerned.\n\n11.\n\nThe French suggestion for a mixed rather than a zonal occupation of Austria is n
