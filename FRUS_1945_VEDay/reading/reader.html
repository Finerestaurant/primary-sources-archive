e agreement with this protest and our representative in Moscow is instructed to make a similar protest.\n\n2.\n\nHe is further to make the following separate communication: begins\n\n1. His Majesty’s Government are much concerned to hear from the British Chargé d’Affaires in Moscow that despite the invitation you extended to Mr. Harriman on April 13, the Soviet Government will not now agree to the Allied missions proceeding to Vienna until agreement has been reached in the EAC regarding representative zones in Vienna and the provisional control machinery. It is impossible for the EAC to reach any agreement about the zones in Vienna and the provisional control machinery until the Allied missions have reached Vienna and have been able themselves to ascertain the conditions there. The results of the Soviet refusal to allow them to go to Vienna have thus produced a complete deadlock and leave the Soviet Government in sole control of Austria.\n\n“2. We therefore regard it as essential that the Allied representatives should be allowed to proceed at once to Vienna and thus enable a settlement to be reached on matters affecting the occupation and control of the country, and especially of Vienna itself, on the spot. We request that the necessary instructions be issued to Marshal Tolbukhin in order that the Allied missions may fly in at once from Italy. Ends.”\n\n3.\n\nI trust, Mr. President, that this will be in accordance with your views and that if so you will instruct your Chargé d’Affaires to support his British colleague.” [주15]\n\nWilliam D. Leahy\n\n[112면]", "notes": ["[주14] 제19호 전보는 수록하지 않았다. 다만 104면 각주 94a를 보라.", "[주14a] 4월 30일자 모스크바 앞 전보 981호, 104면을 보라.", "[주15] 국무부가 제안한 대로 된 트루먼 대통령의 처칠 수상 앞 회답은 일부 다음과 같다. 「1. 본인은 귀하의 제29호에 전적으로 동의하며, 이에 따라 모스크바 주재 미국 대리대사는 그의 영국 동료와 협의한 뒤 소련 정부에 다음 전언을 전달하도록 훈령받고 있습니다.」 소련 정부 앞 전언은 5월 3일자 주소련 대리대사 앞 국무부 전보 995호, 113면에 실려 있다. 트루먼 대통령의 수상 앞 전언은 다음과 같이 끝맺는다. 「이것이 승인되는지를 알려 주시면 본인은 그 전언을 모스크바로 보내겠습니다.」 (740.00119 Control (Austria)/5–245)"], "warn": false, "pages": ["112"], "search": "Leahy 리히(육해군 최고사령관 참모장) Matthews 매슈스(유럽국장) Churchill 처칠(영국 수상) Truman 트루먼(미국 대통령) Winant 위넌트(주영대사) Harriman 해리먼(주소련대사) Tolbukhin 톨부힌(소련 원수)"}, {"id": "d206", "order": 206, "date": "1945-05-02", "group": "D", "eyebrow": "d206 · The Chairman of the Council of Peoples’ Commissars of the Soviet Union (Stalin) to President Truman  Marshal Stalin sent substantially the same message to Prime Minister Churchill; for text, see Churchill, Triumph and Tragedy, p. 518.", "title": "소련 인민위원회의 의장(스탈린)이 트루먼 대통령에게", "badge": null, "list_right": "문서 206", "meta": [{"k": "일자", "v": "1945-05-02"}, {"k": "시각", "v": "May 2, 1945."}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00/119 E. W./5–445", "txt": true}, {"k": "발신", "v": "The Chairman of the Council of Peoples' Commissars of the Soviet Union (Stalin) 소련 인민위원회의 의장 스탈린", "txt": true}, {"k": "수신", "v": "President Truman 트루먼 대통령", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "서한"}], "links": [{"k": "FRUS", "text": "문서 206 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d206"}], "summary": "소련군과 연합군이 만날 때 소련군 지휘부가 즉시 미·영군 지휘부와 접촉하여 잠정 전술 분계선과 독일군 저항 진압 조치를 합의하도록 지시했다고 통보한다.", "points": ["4월 28일 독일·오스트리아 점령 절차에 관한 처칠의 전언에 트루먼이 동의한 데 대한 회답이다.", "소련 최고사령부가 이미 지시를 내렸다고 밝힌다. 소련군과 연합군이 만나면 소련군 지휘부가 즉시 미군 또는 영국군 지휘부와 접촉한다.", "합의 사항 두 가지: (1) 잠정 전술 분계선의 확정, (2) 그 잠정 분계선 안에서 독일군의 모든 저항을 진압하기 위한 조치.", "[주98] 스탈린이 처칠에게도 실질적으로 같은 내용의 전언을 보냈다.", "엘베강 회동 이후 미·소 양군의 현지 접촉 절차를 다룬 문서다."], "primary": "1945년 5월 2일.\n\n본인은, 4월 28일 독일 및 오스트리아의 점령 절차 문제에 관한 처칠(W. Churchill) 수상의 전언에 귀하가 동의를 표명한 전언을 받았습니다. [주99]\n\n본인은 다음과 같이 말씀드려야 하겠습니다. 소련 최고사령부는, 소련군이 연합군과 만날 때 소련군 지휘부가 즉시 미군 또는 영국군 지휘부와 접촉하고 다음 사항에 합의하도록 지시를 내렸습니다.\n\n1.\n\n잠정 전술 분계선의 확정, 그리고\n\n2.\n\n그들의 잠정 분계선의 한계 안에서 독일군의 모든 저항을 진압하기 위한 조치의 실시.\n\n[260면]", "secondary": "May 2, 1945.\n\nI have received your message, in which you express your agreement with the message of Prime-Minister W. Churchill on the question of the occupation procedure of Germany and Austria, on April 28th. [주99]\n\nI have to say that the Soviet Supreme Command has given instructions that upon meeting of Soviet troops with the Allied troops the Soviet Command immediately establish contact with the Command of the American or British troops and that they agree on:\n\n1.\n\nDetermination of a temporary tactical demarcation line, and\n\n2.\n\nUndertaking of measures for suppression within the limits of their temporary demarcation line of any resistance of German troops.\n\n[260면]", "notes": ["[주98] 스탈린 원수는 처칠 수상에게도 실질적으로 같은 전언을 보냈다. 원문은 Churchill, Triumph and Tragedy, p. 518을 보라.", "[주99] 언급된 전언은 트루먼 대통령이 스탈린 원수에게 보낸 제225호로, 4월 28일자 케넌의 비신스키 앞 각서(246면)에 인용되어 있다."], "warn": false, "pages": ["260"], "search": "Stalin 스탈린(소련 인민위원회의 의장) Truman 트루먼(미국 대통령) Churchill 처칠(영국 수상)"}, {"id": "d207", "order": 207, "date": "1945-05-02", "group": "A", "eyebrow": "d207 · The Acting Secretary of State to the Ambassador in the United Kingdom (Winant)", "title": "국무장관 대리가 주영대사(위넌트)에게", "badge": null, "list_right": "문서 207", "meta": [{"k": "일자", "v": "1945-05-02"}, {"k": "시각", "v": "Washington, May 2, 1945—7 p.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "3449"}, {"k": "원문출처", "v": "740.00119 EAC/5–145: Telegram", "txt": true}, {"k": "발신", "v": "The Acting Secretary of State (Grew) 국무장관 대리 그루", "txt": true}, {"k": "수신", "v": "The Ambassador in the United Kingdom (Winant) 주영대사 위넌트", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 207 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d207"}], "summary": "EAC 교섭에서 항복문서에 근거한 포고문을 SCAEF와 소련 최고사령부가 적절하다고 볼 때 즉시 발할 수 있게 준비해 두는 것이 근본 고려사항이며, 이 늦은 시점에 항복문서 본문을 다시 열어 논의할 뜻은 없다고 밝힌다.", "points": ["EAC 교섭의 근본 고려사항은, SCAEF(연합국원정군최고사령관)와 소련 최고사령부가 적절하다고 판단하는 즉시 포고문을 발할 수 있도록 준비해 두는 것이다.", "독일 격파에 병력을 낸 유엔 각국 정부에 항복문서와 그에 근거한 포고문의 본문을 보여 주고 가입을 권유하는 데 찬성한다.", "그러나 이 늦은 시각에 항복문서 본문에 대한 검토를 다시 열거나, EAC에 직접 대표되어 있지 않은 유엔 국가들과의 교섭으로 포고문 합의를 지연시키는 데는 응할 뜻이 없다.", "4대국 이외 유엔 국가들의 기여를 포고문에서 더 구체적으로 인정하는 데는 이견이 없다.", "다만 제12조 (b)의 「추가 요구사항」에 통제이사회에 대표되지 않은 유엔 국가들의 동의가 필요하다는 뜻을 함축하는 수정안은, 통제이사회와 지대 사령관들의 업무를 매우 심각하게 복잡하게 만들 것이다.", "군정의 실무적 필요상, 4개 점령국이 독일에서 취할 여러 조치를 그 밖의 유엔 국가들이 공식 수권하는 일은 배제된다고 확신한다.", "따라서 영국 대표단이 영국 초안 포고문 제4항에 넣자고 제안한 문구는 미국 입장에서 바람직하지 않다."], "primary": "워싱턴, 1945년 5월 2일 오후 7시.\n\n3449. 귀하의 5월 1일 정오자 4390호, 5월 1일 자정자 4419호 및 4420호에 대한 회답으로, 국무부의 의견은 다음과 같다.\n\n1.\n\nEAC 교섭에서의 근본 고려사항은, 예정된 포고문을 SCAEF와 소련 최고사령부가 적절하다고 판단하는 즉시 발할 수 있도록 준비해 두는 데 있어야 한다.\n\n2.\n\n우리는 독일의 격파에 군사력을 기여한 유엔 각국 정부에 항복문서 및 그에 근거한 포고문의 본문을 보여 주는 데 찬성하며, 그들의 가입을 권유하는 데 동의한다. 그러나 우리는 이 늦은 시각에 항복문서 본문에 대한 검토를 다시 여는 데에도, EAC에 직접 대표되어 있지 않은 유엔 국가들과의 교섭으로 포고문 본문에 관한 EAC의 합의를 지연시키는 데에도 응할 뜻이 없다.\n\n3.\n\n우리는 4대국 이외 유엔 국가들의 기여를 포고문에서 보다 구체적으로 인정하는 데 이의를 보지 않는다(국무부 3월 23일 오전 11시자 2233호 참조). 그러나 우리는, 제12조 (b)에 상정된 「추가 요구사항」에 통제이사회에 대표되어 있지 않은 유엔 국가들의 동의가 필요하다는 것을 함축하게 될 포고문 제안 본문의 수정은, 통제이사회와 지대 사령관들의 업무에 매우 심각한 복잡성을 더하게 되리라고 본다. 우리는 군정의 실무적 필요가, 4개 점령국이 독일에서 취할 여러 조치를 이들 다른 유엔 국가들이 공식으로 수권하는 일을 배제한다고 확신한다.\n\n4.\n\n따라서 영국 대표단이 영국 초안 포고문의 제4항에 삽입하자고 제안한 표현은 우리 관점에서 바람직하지 않다.\n\n그루(Grew)", "secondary": "Washington, May 2, 1945—7 p.m.\n\n3449. It is the opinion of the Department, in response to your 4390, May 1, noon, 4419 and 4420 May 1, midnight, that\n\n1.\n\nThe basic consideration in the EAC negotiations should be to have the projected proclamation ready to be issued as quickly as SCAEF and the Soviet High Command consider it appropriate;\n\n2.\n\nWe approve showing the texts of the surrender instrument and of the proclamation based on it to the Governments of the United Nations contributing military forces to the defeat of Germany and we agree to inviting their adherence. We would not, however, at this late hour be willing to reopen consideration of the text of the surrender instrument or to delay agreement in the EAC on the text of the proclamation by negotiations with the United Nations not directly represented there.\n\n3.\n\nWe see no objection to making a more specific acknowledgment in the proclamation of the contributions of the United Nations other than the four major powers (refer Department’s 2233, March 23, 11 a.m.). We feel, however, that a modification of proposed text of the proclamation which would imply the necessity for the concurrence of United Nations not represented on the Control Council in the “additional requirements” envisaged in article 12 (b) would add a most serious complexity to the work of the Control Council and of the zone commanders. We are persuaded that the practical necessities of military government preclude the formal authorization by these other United Nations of the various measures to be taken in Germany by the four Occupying Powers.\n\n4.\n\nThe phraseology proposed by the UK Delegation for insertion in the fourth paragraph of the British draft proclamation is, therefore, undesirable from our point of view.\n\nGrew", "notes": [], "warn": false, "pages": [], "search": "Grew 그루(국무장관 대리) Winant 위넌트(주영대사)"}, {"id": "d208", "order": 208, "date": "1945-05-02", "group": "A", "eyebrow": "d208 · The Ambassador in France (Caffery) to the Secretary of State", "title": "주프랑스대사(캐퍼리)가 국무장관에게", "badge": null, "list_right": "문서 208", "meta": [{"k": "일자", "v": "1945-05-02"}, {"k": "시각", "v": "Paris, May 2, 1945—8 p.m. [Received May 2—6:17 p.m.]"}, {"k": "장소", "v": "Paris", "txt": true}, {"k": "전문번호", "v": "2290"}, {"k": "원문출처", "v": "740.00119 Control (Germany)/5–245: Telegram", "txt": true}, {"k": "발신", "v": "The Ambassador in France (Caffery) 주프랑스대사 캐퍼리", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 208 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d208"}], "summary": "SHAEF 전방사령부로 날아가 아이젠하워와 프랑스 점령지대 문제를 논의했으며, 바덴·뷔르템베르크·지그마링겐 전부를 넘기면 미군 병참선에 상당한 문제가 생길 수 있다는 재검토 결과를 보고한다.", "points": ["국무부 5월 1일자 1799호에 따라, 캐퍼리가 이날 오후 SHAEF 전방사령부(랭스)로 비행해 아이젠하워를 만났다.", "최초의 SHAEF 제안은 바덴·뷔르템베르크·지그마링겐을 프랑스에 넘기는 데 큰 이의가 없다는 것이었다.", "그 뒤 더 완전한 연구가 이루어졌고, 이 지역 전부를 넘기면 남부 미국 점령지대 미군의 보급·통신선에 상당한 복잡함이 생길 수 있다는 결과가 나왔다.", "아이젠하워가 계속 검토 중이며 내일 최종 견해를 알려 주기로 했다.", "[주2] SHAEF 전방사령부는 프랑스 「Keims」(랭스의 오식)에 있었다."], "primary": "파리, 1945년 5월 2일 오후 8시.\n [접수 5월 2일 오후 6시 17분]\n\n2290. 국무부 5월 1일자 1799호. [주1] 본관은 오늘 오후 프랑스 지대 문제를 논의하고자 [261면] 아이젠하워(Eisenhower) 장군이 있는 SHAEF 전방사령부[주2]로 비행해 갔다. 그는 본관에게, 바덴·뷔르템베르크·지그마링겐을 프랑스에 양여하는 데 큰 이의는 없다는 취지의 최초 SHAEF 제안이 합동참모본부에 제출된 이래, 한층 더 나아간 보다 완전한 연구가 이루어졌으며, 그 결과 이 지역 전부를 양여하는 것은 남부 미국 점령지대에 있는 미군의 보급 및 통신선에 상당한 복잡함을 빚을 수 있는 것으로 나타났다고 말했다. 그는 이 문제를 더 검토하고 있으며 내일 그에 관한 최종 견해를 본관에게 알려 주기로 하였고, 본관은 물론 받는 대로 그것을 전보로 보내겠다.\n\n캐퍼리(Caffery)", "secondary": "Paris, May 2, 1945—8 p.m. \n [Received May 2—6:17 p.m.]\n\n2290. Department’s 1799, May 1. [주1] I flew to SHAEF Forward [주2] this afternoon to discuss the question of the French zone with General [261면] Eisenhower. He said to me that since the first SHAEF proposal was submitted to the Joint Chiefs of Staff indicating there was no great objection to ceding Baden, Württemburg, and Sigmaringen to the French, a further and more complete study had been made from which it appeared that to cede all this area might create considerable complications with the supply and communications lines of the American forces in the southern US zone of occupation. He is studying the matter further and will let me have his final views on the matter tomorrow and I will, of course, cable them as soon as I receive them.\n\nCaffery", "notes": ["[주1] 수록하지 않았다. 이 전보는 제안된 프랑스 점령지대의 변경을 아이젠하워 장군이 선호하는 이유에 대한 충분한 설명을 얻어 국무부에 시급히 전보로 보내도록 지시한 것이다(740.00119 Control (Germany)/5–145).", "[주2] 프랑스 Keims의 SHAEF 전방사령부."], "warn": false, "pages": ["261"], "search": "Caffery 캐퍼리(주프랑스대사) Eisenhower 아이젠하워(연합국원정군최고사령관)"}, {"id": "d385", "order": 385, "date": "1945-05-02", "group": "A", "eyebrow": "d385 · The Ambassador in Yugoslavia (Patterson) to the Secretary of State", "title": "주유고슬라비아대사(패터슨)가 국무장관에게", "badge": null, "list_right": "문서 385", "meta": [{"k": "일자", "v": "1945-05-02"}, {"k": "시각", "v": "Belgrade, May 2, 1945. [Received May 2—1:35 p.m.]"}, {"k": "장소", "v": "Belgrade", "txt": true}, {"k": "전문번호", "v": "61"}, {"k": "원문출처", "v": "863.01/5–245: Telegram", "txt": true}, {"k": "발신", "v": "The Ambassador in Yugoslavia (Patterson) 주유고슬라비아대사 패터슨", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 385 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d385"}], "summary": "소련 장교가 미국 군사사절단에 건넨, 카를 레너 국가수상 명의의 4월 28일자 빈 발신 「통고」의 독일어 원문 번역을 보고한다. 오스트리아 공화국 재건과 임시정부 수립을 알리고 승인을 요청하는 문서다.", "points": ["소련 장교가 미국 군사사절단에 넘긴, 스테티니어스 장관 편으로 미국 정부 앞으로 된 봉투를 파우치로 발송했다.", "안에는 같은 수신처로 된 4월 28일 빈 발신, 카를 레너 박사가 국가수상(State Chancellor) 자격으로 서명한 타자본 「통고(notification)」가 들어 있다.", "붉은군대의 승리로 빈과 오스트리아 상당 부분이 독일제국 군대로부터 해방되어 완전한 정치적 자결권을 되찾았다고 주장한다.", "크림회담과 1943년 10월 모스크바회담의 결정에 의거해, 오스트리아 각 정당 대표들이 오스트리아 공화국을 자주 독립국으로 수립하고 임시정부를 구성하기로 결정했다고 밝힌다.", "레너의 이력을 열거한다. 1918~1920년 공화국 국가수상, 1919년 생제르맹 강화대표단 의장, 1928~1934년 마지막 민주적 대의기관 의장.", "「부활한 국가(resurrected state)」의 승인과 지원을 요청하며 끝맺는다.", "[주16] 이 「통고」 원본은 5월 11일에야 국무부에 접수되었다."], "primary": "베오그라드, 1945년 5월 2일.\n[접수 5월 2일 오후 1시 35분]\n\n61. 소련 장교가 우리 군사사절단에 건넨, 스테티니어스(Stettinius) 장관 편으로 미국 정부 앞으로 된 봉투를 파우치로 발송하였다. 그 안에는 같은 수신처가 적히고, 4월 28일 빈에서 작성되었으며, 카를 레너(Karl Renner) 박사가 국가수상으로서 서명한 타자본 「통고」가 들어 있다. [주16] 다음은 독일어에서 옮긴 우리의 번역이다.\n\n「붉은군대의 승리에 찬 진격으로 수도 빈과 오스트리아의 상당 부분이 독일제국의 군대로부터 해방됨에 따라, 우리는 다시금 완전한 정치적 자결권을 소유하게 되었으며, 크림회담[주17] 및 1943년 10월 모스크바회담[주18]의 결정에 의거하여, 이 나라 모든 정당의 대표들은 오스트리아 공화국을 자주적이고 독립된 국가로 수립하기로, 그리고 오늘 그 활동을 개시한 임시정부를, 총리 카를 레너 박사 — 전 공화국 국가수상(1918~1920), [566면] 생제르맹 강화대표단 의장(1919), 그리고 민주적 대의기관의 마지막 의장(1928~1934)[주19] — 아래 구성하기로 결정하였다.\n\n정부는 이로써 위의 사항을 귀하에게 통고하며, 부활한 국가의 승인을 요청하고, 이 무거운 과업의 수행에 귀하가 지원을 베풀어 주시기를 희망한다.」\n\n패터슨(Patterson)", "secondary": "Belgrade, May 2, 1945.\n[Received May 2—1:35 p.m.]\n\n61. Have forwarded by pouch an envelope addressed to the United States Government in care of Secretary Stettinius, which was handed to our military mission by a Soviet officer. It contains a typewritten “notification” bearing the same address, dated Vienna April 28 and signed by Dr. Karl Renner as State Chancellor. [주16] Following is our translation from the German:\n\n“Due to the victorious advance of the Red Army by which the capital city of Vienna and a considerable portion of Austria has been liberated from the armies of the German Reich, we have again come into the possession of our full political self determination and relying on the decisions of the Crimean Conference [주17] and Moscow Conference of October 1943, [주18] the representatives of all political parties of the country have decided to establish the Austrian Republic as an autonomous and independent state, to form a temporary government, which has started its activities today, under Dr. Karl Renner, Premier, formerly State Chancellor of the Republic (1918–1920) Chairman of [566면] the peace delegation for St. Germain (1919) and last President of a democratic representation (1928–1934). [주19]\n\nThe Government notifies you herewith of the above asking for the recognition of the resurrected state and hoping that you will give your support to it, in the fulfillment of the hard task.”\n\nPatterson", "notes": ["[주16] 이 「통고」는 수록하지 않았으며, 5월 11일 국무부에 접수되었다. 레너 정부의 구성에 관한 자료는 94~116면 여러 곳을 보라.", "[주17] 크림회담에서 오스트리아에 관해 내려진 결정은 Foreign Relations, The Conferences at Malta and Yalta, 1945, p. 999의 색인 Austria 항목을 보라.", "[주18] 1943년 10월 18일~11월 1일 모스크바에서 열린 3국 외상회의가 발표한 오스트리아에 관한 선언의 원문은 Foreign Relations, 1943, vol. i, p. 761을 보라.", "[주19] 레너 박사는 오스트리아 의회 하원인 국민의회(Nationalrat)의 의장이었다."], "warn": false, "pages": ["566"], "search": "Patterson 패터슨(주유고슬라비아대사) Stettinius 스테티니어스(국무장관) Karl Renner 카를 레너(오스트리아 임시정부 총리, 국가수상)"}, {"id": "d560", "order": 560, "date": "1945-05-02", "group": "A", "eyebrow": "d560 · The Minister in Sweden (Johnson) to the Secretary of State", "title": "주스웨덴공사(존슨)가 국무장관에게", "badge": null, "list_right": "문서 560", "meta": [{"k": "일자", "v": "1945-05-02"}, {"k": "시각", "v": "Stockholm, May 2, 1945—2 a.m. [Received May 2—1:19 a.m.]"}, {"k": "장소", "v": "Stockholm", "txt": true}, {"k": "전문번호", "v": "1626"}, {"k": "원문출처", "v": "740.0011 EW/5–245: Telegram", "txt": true}, {"k": "발신", "v": "The Minister in Sweden (Johnson) 주스웨덴공사 존슨", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 560 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d560"}], "summary": "독일군을 스웨덴으로 철수시켜 무장해제하려던 스웨덴의 노력이 실패한 것으로 보이며, 그 한 원인이 힘러의 서방 연합국 앞 항복 제의가 샌프란시스코에서 새어 나간 데 있다고 보고한다.", "points": ["독일군을 스웨덴으로 철수시켜 그곳에서 무장해제한 뒤 연합국에 인도하려던 스웨덴의 노력이 실패한 것으로 스웨덴 외무성 고위 관리들이 보고 있다.", "실패가 예상되는 한 가지 이유로, 힘러가 서방 연합국에 항복(capitulation)을 제의한 것과 관련해 샌프란시스코에서 정보가 새어 나간 일이 꼽힌다.", "그 누설로 광범한 라디오 보도가 나왔고, 이것이 힘러의 신용을 떨어뜨렸다는 것이다.", "또 다른 이유로는 히틀러의 사망설과 되니츠의 승계, 그리고 전쟁을 계속하겠다는 되니츠의 언명이 거론된다.", "폴케 베르나도테 백작이 이날 스웨덴에 돌아와, 대통령의 전언을 전달했으나 회답이 없었다고 알려 왔다.", "베스트 박사가 덴마크 행정을 덴마크 당국에 넘겼고 독일군이 셸란섬에서 철수 중이라는 소문이 무성하나, 폰 포스트도 덴마크 지하운동 대표들도 확인하지 못했다.", "노르웨이의 독일 당국이 그리니 수용소 수감자 석방을 명령했다는 소문도 있었으나, 밤늦게 독일 정세의 전개를 이유로 그 명령이 철회되었다는 소식이 들어왔다.", "예정된 참모회담을 가능한 한 이른 날짜에 여는 것이 중요하다는 의견이다.", "[주56] 그루가 4월 28일 전보 29호에서, 힘러 관련 정보가 「어느 고위 영국 소식통」을 통해 미국 내에서 UP에 흘러간 데 대해 특파원들이 격분하고 있다고 보고한 대목이 실려 있다."], "primary": "스톡홀름, 1945년 5월 2일 오전 2시.\n [접수 5월 2일 오전 1시 19분]\n\n1626. 본 공사관 1610호, 4월 30일 오후 7시. [주55] 독일군을 스웨덴으로 철수시켜 이곳에서 무장해제한 뒤 종국에는 연합국에 인도하려던 스웨덴의 노력은, 현재 스웨덴 외무성 고위 관리들에 의해 실패한 것으로 여겨지고 있다. 이 예견된 실패의 한 원인은, 힘러(Himmler)가 서방 연합국에 항복(capitulation)을 제의한 것과 관련하여 샌프란시스코에서 정보가 누설된 데 있다고 한다. [주56] 그 누설은 광범위한 라디오 보도로 이어졌고, [774면] 그것이 힘러의 신용을 떨어뜨렸다. 또 하나의 원인으로 거론되는 것은 히틀러가 사망했다는 것과 되니츠(Dönitz)가 그 뒤를 이었다는 것[주57], 그리고 전쟁을 계속하겠다는 그의 언명이다. 폴케 베르나도테(Folke Bernadotte) 백작이 오늘 스웨덴으로 돌아와, 자신이 대통령의 전언을 전달하였으나(공사관 1575호, 4월 27일 오후 6시) 회답이 없었다고 본관에게 알려 왔다.\n\n오늘 베스트(Best) 박사[주58]가 덴마크의 행정을 덴마크 당국에 넘겼으며 독일군이 셸란섬에서 철수하고 있다는 취지의 소문이 수없이 돌았으나, 덴마크에 있는 폰 포스트(Von Post)[주59]도 이곳의 덴마크 지하운동 대표들도 이 정보를 확인하지 못하였다.\n\n오늘 아침에는 또 노르웨이의 독일 당국이 그리니(Grini)의 수감자들을 석방하도록 명령하였다는 소문도 있었다. 밤늦게, 이 이른바 명령이 독일에서의 사태 전개를 이유로 철회되었다는 소식이 들어왔다.\n\n본관의 의견으로는, 예정된 참모회담(공사관 1606호, 4월 30일 오후 3시[주60])이 실행 가능한 가장 이른 날짜에 열리는 것이 중요하다.\n\n존슨(Johnson)", "secondary": "Stockholm, May 2, 1945—2 a.m. \n [Received May 2—1:19 a.m.]\n\n1626. Legs 1610, April 30, 7 p.m. [주55] Sweden’s efforts to get German troops to evacuate into Sweden to be disarmed here and eventually to be turned over to the Allies are presently believed by high officials of the Swedish Foreign Office to have failed. One reason for this anticipated failure is said to be the leakage of information at San Francisco [주56] relative to Himmler’s offer of capitulation to the Western Allies. The leakage resulted in widespread radio publicity [774면] which discredited Himmler. Another given reason is the alleged death of Hitler with the succession of Dönitz [주57] and his stated determination to continue the war. Count Folke Bernadotte returned to Sweden today and advised me that he had delivered the President’s message (Legation’s 1575, April 27, 6 p.m.) and there had been no reply.\n\nThere have been countless rumors today to the effect that Dr. Best [주58] has turned the administration of Denmark over to the Danish authorities and that the German troops are evacuating the island of Zealand but neither Von Post [주59] who is in Denmark nor representatives of the Danish underground here have been able to confirm this information.\n\nThere were also rumors this morning that the German authorities in Norway had ordered the release of the prisoners at Grini. Late tonight word was received that this alleged order had been countermanded by reason of the developments in Germany.\n\nIn my opinion it is important that the contemplated staff talks (Legs 1606, April 30, 3 p.m. [주60] ) take place at the earliest practicable date.\n\nJohnson", "notes": ["[주55] 수록하지 않았다. 이 전보는 덴마크에서 스웨덴 관리들과 독일 군 당국 사이에 덴마크와 노르웨이로부터 독일군을 철수시키기 위한 대화가 진행되고 있음을 보고한 것이다(740.0011 EW/4–3045).", "[주56] 국무장관 대리가 샌프란시스코의 국무장관에게 보낸 4월 28일 오후 7시 50분자 전보 29호(수록하지 않음)에서, 그루 씨는 「어느 고위 영국 소식통」이 UP통신에 힘러가 최근 스웨덴 정부를 통해 히틀러가 24시간을 더 살지 못할 수도 있다고 알려 왔다고 말했다는 취지의, 샌프란시스코발로 언론에 실린 발표에 대해 언급하였다. 「이곳의 언론 특파원들은 그러한 선정적인 뉴스가 미국 내에서 영국 소식통으로부터 흘러나온 데 대해 물론 매우 분개하고 있으며, 전모가 결국 알려지면 매우 나쁜 감정이 생길 수도 있습니다. 귀하는 이 문제를 이든을 통해 알아보고자 하실 수도 있겠습니다. 대통령과 상의한 뒤 본인은 언론에 지금은 할 말이 없다고 알렸습니다.」 그는 또한 국무부도 백악관도 항복 제의 소문에 대해 아무런 논평도 하지 않고 있다고 보고하였다(740.00119 EW/4–2845).", "[주57] 독일제국 총통 겸 수상 아돌프 히틀러는 4월 30일 자살하였다. 그 전날 작성한 정치적 유언에서 그는 해군원수 카를 되니츠를 제국 대통령 겸 육군상으로 하는 후계 정부를 지명하였다. 5월 1일 독일 국민을 향한 라디오 방송에서 이 사실들이 공표되었다.", "[주58] 카를 R. W. 베스트(Karl R. W. Best), 덴마크 주재 제국 전권대표.", "[주59] C. 에리크 폰 포스트(C. Eric von Post), 스웨덴 외무성 정무국장.", "[주60] 제5권, 81면."], "warn": false, "pages": ["774"], "search": "Johnson 존슨(주스웨덴공사) Himmler 힘러 Hitler 히틀러 Dönitz 되니츠 Folke Bernadotte 폴케 베르나도테 백작 Best 베스트(덴마크 주재 제국 전권대표) Von Post 폰 포스트(스웨덴 외무성 정무국장) Grew 그루(국무장관 대리) Eden 이든(영국 외무장관)"}, {"id": "d802", "order": 802, "date": "1945-05-02", "group": "B", "eyebrow": "d802 · Memorandum by the United Kingdom Representative on the European Advisory Commission (Strang)  Copy transmitted to the Department in despatch 22877, May 4, from London; received May 8.", "title": "유럽자문위원회 영국 대표(스트랭)의 각서", "badge": null, "list_right": "문서 802", "meta": [{"k": "일자", "v": "1945-05-02"}, {"k": "시각", "v": "2 May, 1945. (부속서 말미 서명일: London, 30 April, [2 May?] 1945.)"}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "E.A.C. (45) 47"}, {"k": "원문출처", "v": "740.00119 EAC/5–445", "txt": true}, {"k": "발신", "v": "The United Kingdom Representative on the European Advisory Commission (Strang) 유럽자문위원회(EAC) 영국 대표 스트랭", "txt": true}, {"k": "수신", "v": "유럽자문위원회 동료 위원들", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 802 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d802"}], "summary": "독일 항복 후 외국의 독일 내 대표 방식에 관한 영국 대표단의 제안이다. 「주된 이해관계를 가진」 유엔 국가는 군사사절단, 나머지 연합국과 중립국은 「민간기관」으로 대표하게 하자는 것이다.", "points": ["독일 항복 후 영·미·소 3국 정부와 프랑스공화국 임시정부는 각기 총사령관이 통제이사회 구성원 자격으로, 그리고 그 참모진이 독일에서 자국을 대표한다.", "독일 통제기구에 관한 협정 제8조에 따라 「주된 이해관계를 가진」 다른 유엔 국가들은 통제이사회에 군사사절단을 파견해 연락을 확보한다. 어느 정부가 이에 해당하는지는 아직 정해지지 않았다.", "영국 대표단은 영·미·소·프 4국이 공동으로 초청장을 보내되, 독일 통제기구 협정에 딸린 EAC 보고서 제9항의 「공개 성명」 발표보다 늦지 않게 보낼 것을 제안한다.", "초청 대상으로 오스트레일리아, 벨기에, 브라질, 캐나다, 중국, 체코슬로바키아, 그리스, 인도, 룩셈부르크, 네덜란드, 뉴질랜드, 노르웨이, 폴란드, 남아프리카, 유고슬라비아 15개국을 든다.", "나머지 유엔 국가들은 군사사절단이 정당화되지 않으므로 「민간기관(Civil Agencies)」을 지명하도록 권유한다. 외교사절단 칭호는 지위가 더 높아지므로 바람직하지 않다.", "중립국 사절단도 독일에 남도록 허용하되 역시 「민간기관」으로 분류하며, 칠레처럼 독일과 관계가 없는 나라도 관계를 유지한 나라보다 불리한 처지에 놓여서는 안 된다.", "군사사절단은 연합국 통제기구를 통하거나 그 허가 없이는 독일 당국과 교섭할 수 없고, 민간기관에는 그 제한이 더욱 강하게 적용되어야 한다.", "연합국 대표는 행낭과 암호로 본국 정부와 통신할 권리를 가지나, 중립국 민간기관에는 적어도 초기 단계에서 이 권리를 주어서는 안 된다.", "중립국 영사관은 점령군 사령관들에게 곤란을 줄 수 있으므로 되도록 이른 시기에 폐쇄하는 것이 바람직하며, 뒤에 필요하면 베를린의 사절단·민간기관이 현지 대리인을 지명하되 영사 칭호는 주지 않는다.", "오스트리아의 사정은 전전 이래 빈에 외교사절단이 없었다는 점에서 다르나, 적어도 초기 단계에는 대체로 독일과 같은 방침을 제안한다."], "primary": "E.A.C. (45) 47\n\n1945년 5월 2일.\n\n**항복 후 독일에 있어서의 외국의 대표**\n\n본인은 유럽자문위원회의 심의를 위하여, 항복 후 독일에 있어서의 외국의 대표에 관한 제안을 담은 각서를 동료 위원들에게 회람한다. 본인은 위원회가 이 제안들을 조속히 검토할 수 있기를 희망한다.\n\nW[illiam] S[trang]\n\n런던, 1945년 4월 30일, [5월 2일?]\n\n[부속서]\n\n**항복 후 독일에 있어서의 외국의 대표**\n\n1. 독일 항복 후, 영국·미합중국·소비에트사회주의공화국연방의 각 정부 및 프랑스공화국 임시정부는 통제이사회의 구성원 자격에 있어서의 [1085면] 각자의 총사령관과 그 참모진에 의하여 독일에서 대표된다. 독일 통제기구에 관한 협정[주7] 제8조에서 「주된 이해관계를 가진 다른 유엔 국가의 정부들과의 필요한 연락은, 그러한 정부들이 통제이사회에 군사사절단(민간인 구성원을 포함할 수 있다)을 임명함으로써 확보되며, 그 사절단은 적절한 경로를 통하여 통제 기관에 접근할 수 있다」고 합의된 바 있다. 따라서 그러한 유엔 국가의 정부들은 그들의 군사사절단에 의하여 독일에서 대표될 것이다. 어느 정부들이 그렇게 대표될 것인지는 아직 결정되지 않았다.\n\n**주된 이해관계를 가진 유엔 국가**\n\n2. 영국 대표단은, 「주된 이해관계를 가진」 것으로 인정되는 유엔 국가들에게 통제이사회에 군사사절단을 임명하도록 하는 초청을 영국·미합중국·소비에트사회주의공화국연방 및 프랑스가 공동으로 보낼 것을 제안한다. 그러한 초청은, 독일 통제기구에 관한 협정을 다루는 유럽자문위원회 보고서[주8](E.A.C. (44) 제11차 회의) 제9항에 규정된 「공개 성명」의 발표보다 늦지 않게 보내져야 한다. 영국 대표단은 이 초청이 다음 각국 정부에 보내질 것을 제안한다.\n\n오스트레일리아\n\n벨기에\n\n브라질\n\n캐나다\n\n중국\n\n체코슬로바키아\n\n그리스\n\n인도\n\n룩셈부르크\n\n네덜란드\n\n뉴질랜드\n\n노르웨이\n\n폴란드\n\n남아프리카\n\n유고슬라비아.\n\n**그 밖의 유엔 국가**\n\n3. 나머지 유엔 국가들의 경우에는 군사사절단에 의한 독일 내 대표가 정당화될 수 없어 보인다. 동시에, 그들에게 어떠한 성격의 대표도 거부하는 것은 불가능해 보인다. 아래에서 우리가 제안하는 대로 중립국들에게 어느 정도의 대표가 허용된다면 더욱 그러하다. 따라서 영국 대표단은, 이들 나머지 유엔 국가의 정부들에게 독일에서 자국을 대표할 「민간기관(Civil Agencies)」을 지명하도록 권유할 것을 제안한다. 이들 기관에 외교사절단의 칭호를 부여하는 것은 바람직하지 않을 것이다. 외교[1086면]사절단은 통상 주재국 내의 다른 어떤 외국 기관보다도 높은 지위를 누리기 때문이다. 군소 연합국의 대표들에게 군사사절단으로 대표될 「주된 이해관계를 가진 유엔 국가」의 대표들보다 높은 지위를 부여하는 것은 명백히 불가능할 것이다.\n\n**중립국**\n\n4. 중립국의 독일 내 대표 문제가 남아 있다. 영국 대표단은, 부분적으로 이탈리아에서 얻은 경험에 근거하여, 중립국 대표들이 독일에 있으면서 현지에서 자국의 이익을 돌보는 편의가 대체로 그들의 존재가 야기할 수 있는 어떠한 불편도 상당히 능가한다는 견해를 취한다. 따라서 영국 대표단은 중립국 사절단이 독일에 잔류하도록 허용될 것을 제안한다. 다만 그들 역시 「민간기관」으로 분류되어야 한다. 예컨대 칠레처럼 독일과 관계가 없는 중립국들은, 관계를 유지해 온 나라들보다 불리한 처지에 놓일 수 없다. 따라서 그들에게는 요청이 있을 경우 다른 중립국들에 대하여 정해지는 것과 동일한 편의를 누리도록 허용되어야 한다.\n\n**특권과 면제**\n\n5. 주된 이해관계를 가진 유엔 국가의 군사사절단은 연합국 통제기구를 통하거나 그 허가에 의하지 아니하고는 어떠한 독일 당국과도 교섭할 자격을 갖지 아니한다. 동일한 제한이 군소 연합국 및 중립국의 민간기관에는 더욱더 강하게 부과되어야 한다. 그러나 그들은 통상 외교 대표가 누리는 면제의 일정한 범위 — 그 범위는 통제이사회가 정한다 — 를, 예컨대 현지 과세와 체포로부터의 면제를 누릴 자격이 있어야 한다. 연합국의 대표들은, 군사사절단에 속하든 민간기관에 속하든, 행낭과 암호로 자국 정부와 통신할 권리를 가져야 한다. 그러나 이 권리는 적어도 초기 단계에서는 중립국의 민간기관에 부여되어서는 아니 된다.\n\n**영사관**\n\n6. 적대행위가 종결될 때 독일에 남아 있을 영사관은 구적국 및 중립국의 영사관뿐일 것이다. 전자의 처리는 본 각서의 범위 밖이다. 중립국 영사관에 관하여, 영국 대표단은 그것들이 점령군 사령관들에게 곤란거리가 될 소지가 다분하며 따라서 가능한 한 이른 시기에 폐쇄하는 것이 바람직하다는 견해를 취한다. 뒤에 특정 외국이 독일의 다른 지방에 대표를 두는 것이 편리하다고 판명될 경우에는, 베를린에 있는 그러한 국가의 군사사절단이나 민간기관이 현지 대리인을 지명하도록 허용함으로써 필요한 [1087면] 조치를 취할 수 있을 것이다. 이들에게는 영사의 칭호가 주어져서는 아니 된다. 그것은 예컨대 영사인가장(exequatur) 같은 수많은 기술적 난점을 일으킬 것이기 때문이다.\n\n**오스트리아**\n\n7. 오스트리아[주9]의 사정은 여러 면에서 다르다. 전쟁 전 이래로 빈에는 물론 외교사절단이 없었기 때문이다. 그러나 영국 대표단은, 독일 항복 후 오스트리아에 있어서의 외국의 대표가 적어도 초기 단계에서는 대체로 위에서 독일에 관하여 제안한 것과 동일한 방침에 따를 것을 제안한다.", "secondary": "E.A.C. (45) 47\n\n2 May, 1945.\n\nRepresentation of Foreign Countries in Germany After Surrender\n\nI circulate to my colleagues, for consideration by the European Advisory Commission, a memorandum making proposals for the representation of foreign countries in Germany after surrender. I hope the Commission will be able to give early consideration to these proposals.\n\nW[illiam] S[trang]\n\nLondon, 30 April, [2 May?] 1945.\n\n[Annex]\n\nRepresentation of Foreign Countries in Germany After Surrender\n\n1. After the German surrender, the Governments of the United Kingdom, the United States of America and the Union of Soviet Socialist Republics, and the Provisional Government of the French Republic, will be represented in Germany by their respective Commanders-in-Chief [1085면] in their capacity as members of the Control Council, and their staffs. It has been agreed in Article 8 of the Agreement on Control Machinery in Germany [주7] that “The necessary liaison with Governments of other United Nations chiefly interested will be ensured by the appointment by such Governments of military missions (which may include civilian members) to the Control Council, having access, through the appropriate channels, to the organs of control.” Such United Nations’ Governments will thus be represented in Germany by their military missions. It has not yet been decided which Governments shall be so represented.\n\nUnited Nations chiefly interested\n\n2. The United Kingdom Delegation proposes that an invitation to the United Nations accepted as “chiefly interested” to appoint military missions to the Control Council should be sent jointly by the United Kingdom, the United States of America, the Union of Soviet Socialist Republics and France. Such an invitation should be sent not later than the issue of the “public statement” provided for in paragraph 9 of the Report by the European Advisory Commission [주8] covering their Agreement on Control Machinery in Germany (E.A.C. (44) 11th Meeting). The U.K. Delegation would suggest that this invitation should be addressed to the Governments of:—\n\nAustralia\n\nBelgium\n\nBrazil\n\nCanada\n\nChina\n\nCzechoslovakia\n\nGreece\n\nIndia\n\nLuxembourg\n\nThe Netherlands\n\nNew Zealand\n\nNorway\n\nPoland\n\nSouth Africa\n\nYugoslavia.\n\nOther United Nations\n\n3. Representation in Germany by military missions does not seem justifiable in the case of the remaining United Nations. At the same time, it would seem impossible to refuse them representation of any character, more particularly if, as we suggested below, neutral states are to be allowed some degree of representation. The United Kingdom Delegation accordingly suggests that the Governments of these remaining United Nations should be invited to nominate “Civil Agencies” to represent them in Germany. It would be undesirable to accord the title of diplomatic mission to these agencies, as a diplomatic [1086면] mission normally enjoys a higher status than that of any other foreign agency in the country of residence. It would clearly be impossible to give a higher status to the representatives of the minor Allies than to those of “the United Nations chiefly interested”, which would be represented by military missions.\n\nNeutral States\n\n4. There remains the question of the representation in Germany of neutral states. The United Kingdom Delegation, basing its view in part on experience gained in Italy, takes the view that on the whole the convenience of having neutral representatives in Germany to look after their national interests on the spot would substantially outweigh any inconvenience that their presence might cause. The United Kingdom Delegation accordingly proposes that neutral missions should be allowed to remain in Germany; but they too should be classified as “Civil Agencies”. Those neutral states e.g. Chile, which have no relations with Germany, could not be placed in a worse position than those which have maintained relations. They should therefore be permitted on request to enjoy the same facilities as those determined for other neutral states.\n\nPrivileges and Immunities\n\n5. The military missions of the United Nations chiefly interested will not be entitled to deal with any German authorities except through or with the permission of the Allied Control Machinery. The same restriction should a fortiori be placed on the Civil Agencies of the lesser Allies and of neutral states. They should, however, be entitled to a certain measure, to be determined by the Control Council, of the immunities normally enjoyed by diplomatic representatives; e.g. immunity from local taxation and arrest. The representatives of Allied states, whether in military missions or Civil Agencies, should have the right to communicate with their Governments by bag and cypher. This right should not however be granted to the Civil Agencies of neutral states, at any rate in the early stages.\n\nConsulates\n\n6. The only consulates which will be found in Germany on the conclusion of hostilities will be those of ex-enemy and neutral states. The treatment of the former is outside the scope of the present memorandum. As to neutral consulates, the United Kingdom Delegation takes the view that they might well prove an embarrassment to the Commanders of forces of occupation and that it would therefore be desirable to close them down at the earliest possible moment. If it were later found convenient that certain foreign states should have representatives in other parts of Germany, the necessary steps could [1087면] be taken by permitting the military missions or Civil Agencies of such states in Berlin to nominate local agents. These should not have the title of consul, as that would raise numerous technical difficulties, e.g. their exequatur.\n\nAustria\n\n7. The position in Austria [주9] is in many respects different, as there have of course been no diplomatic missions in Vienna since before the war. But the United Kingdom Delegation proposes that the representation of foreign countries in Austria after Germany’s surrender should, in the early stages at least, be broadly speaking on the same lines as is proposed above for Germany.", "notes": ["[주6] 사본은 런던발 5월 4일자 공문 22877호로 국무부에 전달되었고, 5월 8일 접수되었다.", "[주7] 1944년 11월 14일 런던에서 서명된 미국·영국·소련 간의 협정. Department of State, Treaties and Other International Acts Series (TIAS) No. 3070; United States Treaties and Other International Agreements (UST), vol. 5, pt. 2, p. 2062.", "[주8] 1944년 11월 14일자 유럽자문위원회가 미국·영국·소련 정부에 제출한 보고서. Foreign Relations, 1944, vol. i, p. 404.", "[주9] 오스트리아의 점령지대 및 통제기구에 관한 협정의 유럽자문위원회 내 교섭에 관한 자료는 559면 이하를 보라."], "warn": false, "pages": ["1085", "1086", "1087"], "search": "Strang 스트랭(유럽자문위원회 영국 대표)"}, {"id": "d86", "order": 86, "date": "1945-05-03", "group": "C", "eyebrow": "d86 · Memorandum of a Meeting Held at San Francisco, May 1945, 11 a.m.  This was one of a series of meetings held at the Fairmont Hotel between the Secretary of State, the British Foreign Secretary, and the Soviet Foreign Commissar and their advisers, during the United Nations Conference on International Organization, held at San Francisco, April 25–June 26, 1945. For documentation regarding this Conference, see vol. i, pp. 1 ff", "title": "샌프란시스코에서 열린 회합의 비망록, 1945년 5월 오전 11시", "badge": null, "list_right": "문서 86", "meta": [{"k": "일자", "v": "1945-05-03"}, {"k": "시각", "v": "May 1945, 11 a.m. (원문에 날짜의 일자가 빠져 있다)"}, {"k": "장소", "v": "San Francisco", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "860C.00/5–245", "txt": true}, {"k": "발신", "v": "미국·영국·소련 3국 외상 회합 기록 (작성자 표시 없음)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회의록"}], "links": [{"k": "FRUS", "text": "문서 86 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d86"}], "summary": "오스트리아 임시정부가 영·미 정부와의 협의 없이 수립된 문제를 두고 스테티니어스·이든과 몰로토프가 주고받은 발췌 기록이다.", "points": ["장관(스테티니어스)이 세 번째 문제로, 영·미 정부와의 협의 없이 수립된 오스트리아 임시정부 문제를 든다.", "몰로토프는 그 정부들에게 「통보되었다」고 답하고, 이든은 통보받은 것은 맞으나 협의는 없었다고 응수한다.", "몰로토프가 이 정부에 무슨 이의가 있느냐고 되묻고, 레너에게 그 정부가 항구적이라고 알린 바는 없다고 한다.", "이든은 우리가 소련 정부에 이 정부 수립을 진행하지 말고 협의를 허용해 달라고 요청했었다고 지적한다.", "이든이 「아주 솔직히 말하겠다」며, EAC에서 점령지대가 합의되기 전에는 우리 사람들이 빈에 갈 수 없다는 것이 러시아 측 입장인데 그것은 옳지 않고 즉시 가야 한다고 말한다.", "몰로토프는 빈이 빠르게 함락되어 행정기구를 세울 필요가 있었다고 해명하고, 모스크바에 알리겠으며 아무 장애도 제기되지 않으리라 본다고 답한다.", "장관은 이 문제가 EAC에 걸려 있었는데 소련 정부가 일방적으로(unilaterally) 진행했다고 지적한다."], "primary": "1945년 5월 오전 11시.\n\n[발췌] [주17]\n\n참석: 국무장관 / 그로미코(Gromyko) 대사[주19]\n\n이든(Eden) 씨 / 소볼레프(Sobolev) 씨\n\n몰로토프(Molotov) 씨 / 파블로프(Pavlov) 씨[주20]\n\n던(Dunn) 씨 / 포드체로프(Podtserob) 씨[주21]\n\n해리먼(Harriman) 대사 / 루엘린 E. 톰프슨(Llewellyn E. Thompson) 씨[주22]\n\nA. 캐도건(Cadogan) 경[주18]\n\n. . . . . . .\n\n장관은 세 번째 문제가 영국 및 미국 정부와의 협의 없이 수립된 오스트리아 임시정부의 문제라고 말했다.\n\n몰로토프 씨는 그 정부들에게 통보되었다고 말했다.\n\n이든 씨는 우리가 통보받았다는 데는 동의하였으나, 협의는 없었다고 말했다.\n\n몰로토프 씨는 이 정부에 무슨 이의가 있는지 물었다. 그는 레너(Renner)에게 그의 정부가 항구적이라고 알린 바는 없다고 말했다.\n\n이든 씨는 우리가 소련 정부에 이 정부의 수립을 진행하지 말고 협의를 허용해 줄 것을 요청하였다고 말했다.\n\n몰로토프 씨는 사태를 어떻게 개선할 수 있겠는지 물었다.\n\n이든 씨는 우리는 우리 사람들이 빈으로 가기를 원한다고 말했다.\n\n몰로토프 씨는 그것은 조처될 수 있다고 답하였다.\n\n장관은 그 문제가 EAC에 걸려 있었는데도 소련 정부가 일방적으로 진행하였다고 말했다.\n\n몰로토프 씨는 빈이 빠르게 함락되었으며 행정기구를 세우는 것이 필요하였다고 말했다.\n\n이든 씨는 이 문제에 관하여 아주 솔직히 말하고 싶다고 하였다. 러시아 측 입장은 EAC가 [113면] 점령지대에 관하여 합의할 때까지는 우리 사람들이 빈에 갈 수 없다는 것이다. 우리는 그것이 옳지 않으며 그들이 즉시 가야 한다고 생각한다.\n\n몰로토프 씨는 자신이 모스크바에 알리겠다고 하였으며, 어떠한 장애도 제기되지 않으리라 여긴다고 말했다.", "secondary": "May 1945, 11 a.m.\n\n[Extract] [주17]\n\nPresent: The Secretary of State Ambassador Gromyko [주19]\n\nMr. Eden Mr. Sobolev\n\nMr. Molotov Mr. Pavlov [주20]\n\nMr. Dunn Mr. Podtserob [주21]\n\nAmbassador Harriman Mr. Llewellyn E. Thompson [주22]\n\nSir A. Cadogan [주18]\n\n. . . . . . .\n\nThe Secretary said the third problem was that of the Provisional Austrian Government which had been set up without consultation with the British and American Governments.\n\nMr. Molotov said that these Governments had been informed.\n\nMr. Eden agreed that we had been informed, but said that there had been no consultations.\n\nMr. Molotov inquired if there were any objection to this Government. He said that they had not informed Renner that his Government was permanent.\n\nMr. Eden said we had asked the Soviet Government not to proceed with the setting up of this Government but to allow consultation.\n\nMr. Molotov asked how the situation could be improved.\n\nMr. Eden said we desire our people to proceed to Vienna.\n\nMr. Molotov replied that this could be arranged.\n\nThe Secretary said that the matter had been before the EAC, but the Soviet Government had proceeded unilaterally.\n\nMr. Molotov said that Vienna had been captured quickly and that it had been necessary to set up an administration.\n\nMr. Eden said he wished to speak quite frankly on the matter. The Russian position is that our people can not go to Vienna until the EAC [113면] has agreed upon zones of occupation. We think that is not right and that they should proceed at once.\n\nMr. Molotov said he would inform Moscow and he felt that no obstacles would be raised.", "notes": ["[주16] 이것은 1945년 4월 25일~6월 26일 샌프란시스코에서 열린 국제기구에 관한 유엔회의 기간 중 국무장관, 영국 외무장관 및 소련 외무인민위원과 그 보좌진 사이에 페어몬트 호텔에서 열린 일련의 회합 가운데 하나이다. 이 회의에 관한 자료는 제1권 1면 이하를 보라.", "[주17] 폴란드를 다룬 이 비망록의 다른 부분은 제5권 272면을 보라.", "[주19] 안드레이 안드레예비치 그로미코, 주미 소련대사.", "[주20] 블라디미르 니콜라예비치 파블로프, 소련 외무인민위원부 번역·통역관 겸 몰로토프 외무인민위원의 비서.", "[주21] 보리스 표도로비치 포드체로프, 몰로토프 외무인민위원의 비서 겸 번역관.", "[주22] 샌프란시스코회의 미국 대표단 정무·연락관.", "[주18] 알렉산더 M. G. 캐도건 경, 영국 외무성 사무차관."], "warn": true, "pages": ["113"], "search": "Stettinius 스테티니어스(국무장관, 「장관」) Eden 이든(영국 외무장관) Molotov 몰로토프(소련 외무인민위원) Gromyko 그로미코(주미 소련대사) Sobolev 소볼레프 Pavlov 파블로프 Dunn 던 Podtserob 포드체로프 Harriman 해리먼(주소련대사) Llewellyn E. Thompson 루엘린 E. 톰프슨 Cadogan 캐도건(영국 외무성 사무차관) Renner 레너(오스트리아 임시정부 총리)"}, {"id": "d87", "order": 87, "date": "1945-05-03", "group": "A", "eyebrow": "d87 · The Acting Secretary of State to the Chargé in the Soviet Union (Kennan)  Handwritten marginal note reads: “Admiral Leahy telephoned the President’s approval of this message. H F[reeman] M[atthews]”", "title": "국무장관 대리가 주소련 대리대사(케넌)에게", "badge": null, "list_right": "문서 87", "meta": [{"k": "일자", "v": "1945-05-03"}, {"k": "시각", "v": "Washington, May 3, 1945—noon."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "995"}, {"k": "원문출처", "v": "740.019 Control (Austria)/4–2545: Telegram", "txt": true}, {"k": "발신", "v": "The Acting Secretary of State (Grew) 국무장관 대리 그루", "txt": true}, {"k": "수신", "v": "The Chargé in the Soviet Union (Kennan) 주소련 대리대사 케넌", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 87 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d87"}], "summary": "빈으로 연합국 대표를 즉시 보내자던 스탈린·비신스키의 제안이 뒤집힌 데 놀랐으며, 톨부힌 원수에게 즉시 비행 허가 훈령을 내려 줄 것을 소련 정부에 통보하도록 지시한다.", "points": ["영국 동료와 협의한 뒤 소련 정부에 통보하라는 훈령이다.", "4월 13일 스탈린의 제안과 4월 25일 비신스키의 확인에 따라 미·영 정부는 대표들이 카세르타에서 출발하도록 계획했고, 프랑스 정부도 대표를 그곳에 합류시켰다.", "그런데 EAC에서 지대가 합의되기 전에는 미국 및 연합국 대표의 빈 도착이 바람직하지 않다는 소련 측 시사를 뒤늦게 받고 크게 놀랐으며, 태도 변화의 이유를 이해할 수 없다고 밝힌다.", "EAC는 빈의 현지 사정에 대한 정보 부족 때문에도 빈 지대 획정에 합의하지 못하고 있다.", "소련 대표 자신도 제안한 소련 지대의 일부가 전투로 파괴된 것이 밝혀져 권고안을 고쳐야 했던 일이 이미 있었다고 지적한다.", "소련이 현지 조사를 허용하지 않는 것이 EAC 합의의 신속한 타결을 막고 있다는 것이다.", "톨부힌 원수에게 연합국 대표가 즉시 빈으로 비행할 수 있도록 적절한 훈령이 내려지기를 희망한다.", "[주23] 여백에 자필로 이렇게 적혀 있다. 「리히 제독이 이 전언에 대한 대통령의 승인을 전화로 알려 왔음. H F[reeman] M[atthews]」"], "primary": "워싱턴, 1945년 5월 3일 정오.\n\n995. 귀하의 영국 동료와 협의한 뒤 소련 정부에 다음과 같이 통보하기 바란다.\n\n미국·영국·프랑스 대표가 각기의 점령지대를 정하기 위하여 즉시 빈으로 가야 한다는 스탈린 원수의 제안(귀하의 4월 13일 자정자 1162호) 및 비신스키의 확인(귀하의 4월 25일 오후 7시자 1348호)에 따라, 영국 및 미국 정부는 각자의 대표가 카세르타에서 출발하도록 계획을 세웠으며, 프랑스 정부는 빈으로 가는 도중 그곳에서 그들과 합류하도록 대표를 보냈다. 따라서 우리는, 유럽자문위원회에서 지대가 합의된 이후까지는 미국 및 연합국 대표의 빈 도착이 바람직하지 않으리라는 소련 정부의 그 후의 시사(귀하의 4월 29일 오후 6시자 1413호 및 5월 1일 오후 10시자 1431호)를 받고 크게 놀랐으며, 이러한 태도 변화의 이유를 이해할 수 없다.\n\n유럽자문위원회는 빈의 지대 획정에 합의하지 못하여 왔는데, 그 한 원인은 그곳의 사정에 관한 정보의 부족이다. 소련 대표는, 제안된 소련 지대의 일부가 전투로 파괴되었다는 것이 밝혀졌기 때문에 유럽자문위원회에서 자신의 권고안을 고쳐야 할 일이 이미 있었다. 우리가 유럽자문위원회에서 낸 우리 자신의 제안에 관계되는 요소들을 현지에서 검토하는 것도 그에 못지않게 중요하다. 소련이 이를 허용하려 하지 않는 것은 그리하여 유럽자문위원회에서의 신속한 합의 타결을 가로막고 있다.\n\n따라서 우리는 연합국 대표들이 즉시 빈으로 비행할 수 있도록 톨부힌 원수에게 적절한 훈령이 내려지기를 희망한다.\n\n모스크바로 국무부 995호로 발신, 런던으로 3451호, 파리로 1827호, 카세르타의 AmPolAd 에어하트 앞 425호로 전달.\n\n그루(Grew)\n\n[114면]", "secondary": "Washington, May 3, 1945—noon.\n\n995. After concerting with your British colleague please inform the Soviet Government as follows:\n\nFollowing Marshal Stalin’s suggestion (your no. 1162 April 13, midnight) and Vyshinski’s confirmation (your no. 1348, April 25, 7 p.m.) that American, British and French representatives proceed immediately to Vienna to settle the respective zones of occupation, the British and American Governments made plans for their representatives to proceed from Caserta and the French Government sent representatives to join them there en route to Vienna. We were therefore greatly surprised to receive the Soviet Government’s subsequent intimation that the arrival of American and Allied representatives in Vienna would be undesirable until after the zones have been agreed to in the European Advisory Commission (your no. 1413 April 29, 6 p.m. and your no. 1431 May 1, 10 p.m.) and are unable to understand the reasons for this change in attitude.\n\nThe European Advisory Commission has been unable to agree on the zoning of Vienna, partly through lack of information about conditions there. The Soviet representative has already had occasion to alter his own recommendations in the European Advisory Commission because of the discovery that part of the proposed Soviet zone had been destroyed in battle. It is equally important that we examine on the spot the factors bearing on our own proposals in the European Advisory Commission. Soviet unwillingness to permit this thus is blocking rapid conclusion of the agreements in the European Advisory Commission.\n\nWe therefore hope that appropriate instructions will be issued to Marshal Tolbukhin that the Allied representatives may fly to Vienna immediately.\n\nSent to Moscow as Department’s no. 995; repeated to London as no. 3451; to Paris as no. 1827, and to AmPolAd, Caserta for Erhardt as no. 425.\n\nGrew\n\n[114면]", "notes": ["[주23] 여백의 자필 기재는 다음과 같다. 「리히 제독이 이 전언에 대한 대통령의 승인을 전화로 알려 왔음. H F[reeman] M[atthews]」"], "warn": false, "pages": ["114"], "search": "Grew 그루(국무장관 대리) Kennan 케넌(주소련 대리대사) Stalin 스탈린 Vyshinski 비신스키 Tolbukhin 톨부힌 Leahy 리히 Matthews 매슈스(유럽국장) Erhardt 에어하트"}, {"id": "d88", "order": 88, "date": "1945-05-03", "group": "A", "eyebrow": "d88 · The Chargé in the Soviet Union (Kennan) to the Secretary of State", "title": "주소련 대리대사(케넌)가 국무장관에게", "badge": null, "list_right": "문서 88", "meta": [{"k": "일자", "v": "1945-05-03"}, {"k": "시각", "v": "Moscow, May 3, 1945—noon. [Received May 3—9:55 a.m.]"}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": "1447"}, {"k": "원문출처", "v": "740.00119 Control (Austria)/5–345: Telegram", "txt": true}, {"k": "발신", "v": "The Chargé in the Soviet Union (Kennan) 주소련 대리대사 케넌", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 88 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d88"}], "summary": "오스트리아 임시정부에 관한 항의에 대해, 소련군은 현지인으로 구성된 행정기구 없이는 활동할 수 없으며 뒤에 연합국 통제위원회가 설치될 것이라는 비신스키의 회답을 받았다고 보고한다.", "points": ["국무부 4월 28일자 972호와 4월 30일자 981호에 따라 4월 30일과 5월 1일 비신스키에게 보낸 두 통의 서한에 대한 회답이 방금 접수되었다.", "비신스키는 오스트리아 영토에서 작전 중인 소련군이 현지 시민으로 구성된 행정기구의 조직 없이는 지낼 수 없다고 말한다.", "그러한 조직이 오스트리아 내 모든 비파시스트 민주 정당 지도자들의 합의로 오스트리아 임시정부의 형태로 만들어졌다는 것이다.", "뒤에 기존 합의에 따라 오스트리아 정부에 대한 필요한 통제를 수행할 연합국 통제위원회가 설치될 것임은 말할 나위도 없다고 맺는다.", "비신스키 서한의 정확한 원문은 별도 전문으로 국무부에만 보낸다(다음 문서 d89)."], "primary": "모스크바, 1945년 5월 3일 정오.\n[접수 5월 3일 오전 9시 55분]\n\n1447. 본관 전보 1431호(5월 1일 오후 10시, 국무부 앞. 카세르타로 79호, 런던으로 187호, 파리로 89호로 전달)를 참조하기 바란다. 국무부 전보 972호(4월 28일 오후 7시)[주23a] 및 981호(4월 30일 오후 9시)에 따라 본관이 4월 30일과 5월 1일 비신스키에게 보낸 두 통의 서한에 대한 회답 통보가 방금 접수되었다.\n\n비신스키는, 오스트리아 영토에서 작전 중인 소련군은 현지 시민들로 구성된 행정기구의 조직 없이는 지낼 수 없다고 진술한다. 바로 그러한 조직이, 그는 이어 말하기를, 오스트리아 내 모든 비(非)파시스트 민주 정당 지도자들 사이의 합의에 의하여 오스트리아 임시정부의 형태로 창설되었다는 것이다. 뒤에 기존의 합의에 따라 오스트리아 정부에 대하여 필요한 통제를 수행할 연합국 통제위원회가 설치되리라는 것은 말할 나위도 없다고 그는 끝맺는다.\n\n비신스키 서한의 정확한 원문은 별도의 전문으로 국무부에만 보내는 중이다. [주24]\n\n국무부로 1447호로 발신, 카세르타의 에어하트 앞 85호, 런던의 EAC 앞 193호, 파리의 리버[주25] 및 머피 앞 94호로 전달.\n\n케넌(Kennan)", "secondary": "Moscow, May 3, 1945—noon.\n[Received May 3—9:55 a.m.]\n\n1447. ReEmbs 1431 May 1, 10 p.m. to Department repeated to Caserta as 79, London as 187 and Paris as 89. Communication has just been received from Vyshinski in reply to the two letters which I addressed to him on April 30 and May 1 pursuant to Department’s telegrams 972 April 28, 7 p.m. [주23a] and 981 April 30, 9 p.m.\n\nVyshinski states that the Soviet forces operating on Austrian territory cannot get along without the organization of an administration composed of local citizens, just such an organization he continues has been created in the form of the Provisional Austrian Government by agreement between leaders of all non-Fascist democratic parties in Austria. It goes without saying, he concludes, that later in accordance with the existing agreement an Allied Control Commission will be set up which will carry out the necessary control over the Austrian Government.\n\nExact text of Vyshinski’s letter is being sent to Department only, in a separate message. [주24]\n\nSent Department as 1447 repeated to Caserta for Erhardt as 85 London for EAC as 193 and Paris for Reber [주25] and Murphy as 94.\n\nKennan", "notes": ["[주23a] 수록하지 않았다. 다만 104면 각주 96을 보라.", "[주24] 바로 다음 문서.", "[주25] 새뮤얼 리버(Samuel Reber). 1944년 8월 14일부터 1945년 4월 25일 국무부 서유럽국으로 전보될 때까지 미국 대독일 정치고문(머피) 사절단 참사관."], "warn": false, "pages": [], "search": "Kennan 케넌(주소련 대리대사) Vyshinski 비신스키 Erhardt 에어하트 Reber 리버 Murphy 머피(대독일 정치고문)"}, {"id": "d89", "order": 89, "date": "1945-05-03", "group": "A", "eyebrow": "d89 · The Chargé in the Soviet Union (Kennan) to the Secretary of State", "title": "주소련 대리대사(케넌)가 국무장관에게", "badge": null, "list_right": "문서 89", "meta": [{"k": "일자", "v": "1945-05-03"}, {"k": "시각", "v": "Moscow, May 3, 1945—10 p.m. [Received May 3—4:35 p.m.] (인용 서한은 5월 2일자)"}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": "1453"}, {"k": "원문출처", "v": "863.01/5–345: Telegram", "txt": true}, {"k": "발신", "v": "The Chargé in the Soviet Union (Kennan) 주소련 대리대사 케넌", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 89 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d89"}], "summary": "오스트리아 임시정부 조직에 관한 비신스키의 5월 2일자 서한 전문을 그대로 옮겨 보고한다.", "points": ["앞선 전보(1447호)에서 요지만 전한 비신스키 서한의 전문이다. 서한 날짜는 5월 2일이다.", "비신스키는 4월 30일과 5월 1일자 케넌의 각서 접수를 확인한다.", "오스트리아 영토에서 독일 침략자와 싸우는 소련군은 해방된 오스트리아 영토에 현지 인사들로 이루어진 행정기구를 조직하지 않을 수 없다고 진술한다.", "오스트리아 내 모든 기존 비파시스트 민주 정당 지도자들 사이의 합의에 따라 그러한 조직이 오스트리아 임시정부라는 「모습으로(in the guise of)」 창설되었다고 한다.", "뒤에 양국 정부 간의 합의에 따라 4개국 대표로 구성되는 연합국 위원회가 오스트리아 영토에 설치되어 오스트리아 정부에 필요한 통제를 가하게 되리라는 것은 말할 나위도 없다고 맺는다."], "primary": "모스크바, 1945년 5월 3일 오후 10시.\n [접수 5월 3일 오후 4시 35분]\n\n1453. 오스트리아 임시정부의 조직에 관하여 별도 전문으로 보고한 대로, 본관이 방금 비신스키로부터 받은 5월 2일자 서한의 원문은 다음과 같다.\n\n「귀하의 4월 30일 및 5월 1일자 각서의 접수를 확인하면서, 본인은 다음과 같이 진술하여야 하겠습니다. 오스트리아 영토에서 독일 침략자에 맞서 싸우고 있는 소련군은 오스트리아의 해방된 영토에 현지 인사들로 이루어진 행정기구를 조직하는 일을 하지 않을 수 없습니다. [115면] 오스트리아 내에 존재하는 모든 비(非)파시스트 민주 정당의 지도자들 사이의 합의에 따라, 그러한 조직이 오스트리아 임시정부라는 모습으로 창설되었습니다. 뒤에 우리 두 정부 사이의 합의에 따라, 오스트리아 영토에 4개국 정부의 대표들로 구성되는 연합국 위원회가 창설되어 오스트리아 정부에 대한 필요한 통제를 행하게 되리라는 것은 말할 나위도 없습니다.」\n\n케넌(Kennan)", "secondary": "Moscow, May 3, 1945—10 p.m. \n [Received May 3—4:35 p.m.]\n\n1453. There follows the text of a letter dated May 2 which I have just received from Vyshinski, as reported in a separate message concerning the organization of the Provisional Austrian Government:\n\n“Acknowledging receipt of your notes of April 30 and May 1, I have to state that the Soviet armies fighting on Austrian territory against the German invaders cannot dispense with organizing on the liberated territory of Austria an administration of local persons. [115면] According to agreement among the leaders of all existing non-Fascist democratic parties in Austria, such an organization was created in the guise of the Provisional Austrian Government. It goes without saying that later on in conformity with the agreement between our Governments, there will be created on Austrian territory from representatives of the four Governments, an Allied Commission which will effect the necessary control over the Austrian Government.”\n\nKennan", "notes": [], "warn": false, "pages": ["115"], "search": "Kennan 케넌(주소련 대리대사) Vyshinski 비신스키"}, {"id": "d861", "order": 861, "date": "1945-05-03", "group": "A", "eyebrow": "d861 · The Acting Secretary of State to Diplomatic Representatives in the American Republics", "title": "국무장관 대리가 아메리카 각 공화국 주재 외교대표들에게", "badge": null, "list_right": "문서 861", "meta": [{"k": "일자", "v": "1945-05-03"}, {"k": "시각", "v": "Washington, May 3, 1945—9 a.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "800.414/5–345: Circular telegram", "txt": true}, {"k": "발신", "v": "The Acting Secretary of State (Grew) 국무장관 대리 그루", "txt": true}, {"k": "수신", "v": "Diplomatic Representatives in the American Republics 아메리카 각 공화국 주재 외교대표", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 861 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d861"}], "summary": "독일 문서고 접근에 관한 회람 전보들에 대한 해명 요청이 많아, 미국이 자국 내 독일 문서고를 압수할 것이며 스위스가 항의해도 권리를 주장하겠다는 방침을 지침으로 통보한다.", "points": ["4월 25일 오후 2시자 회람 및 그 이전 회람들에 대해 독일 문서고 접근을 둘러싼 해명 요청이 다수 접수되었다.", "미국은 자국 내 독일 문서고를 압수하는 조치를 취할 뜻이다.", "보호국인 스위스 정부가 그 조치에 항의할 경우, 4월 7일 오후 2시자 국무부 회람 전보에 밝힌 이유로 문서고에 대한 우리의 권리를 주장할 뜻이다.", "영국 정부에는 자국 대표들이 독일 문서고 접근 요구에 관한 미국 측 조치를 지원하도록 훈령을 내려 줄 것을 요청했다."], "primary": "워싱턴, 1945년 5월 3일 오전 9시.\n\n국무부는 독일 문서고에 대한 접근에 관한 4월 25일 오후 2시자 회람 및 그 이전의 회람들의 결과로 해명을 요청하는 문의를 다수 받았으며, 귀하의 지침을 위하여 다음 정보를 제공한다.\n\n[1142면]\n\n미국은 이 나라 안에 있는 독일 문서고를 압수하는 조치를 취할 뜻이며, 만일 보호국인 스위스 정부가 그러한 조치에 항의한다면 우리는 4월 7일 오후 2시자 국무부 회람 전보에 제시한 이유로 그 문서고에 대한 우리의 권리를 주장할 뜻이다. [주27]\n\n영국 정부에는 그 대표들이 독일 문서고에 대한 접근을 요구하는 귀하의 조치를 지원하도록 훈령을 발하여 줄 것을 요청하였다.\n\n그루(Grew)", "secondary": "Washington, May 3, 1945—9 a.m.\n\nThe Department has received numerous requests for clarification as a result of its circular of April 25, 2 p.m. and previous circulars regarding access to German archives and the following information is given for your guidance:\n\n[1142면]\n\nThe United States intends to take action to seize German archives in this country and if the Swiss Government as protecting power protests such action we intend to insist upon our right to the archives [주27] for the reasons set forth in the Deptelcirc April 7, 2 p.m.\n\nThe British Government has been requested to issue instructions to its representatives to support your action in requesting access to German archives.\n\nGrew", "notes": ["[주27] 스위스 정부의 보호 아래 있는 독일 재산 및 문서고에 관한 요청은 1945년 5월 9일자 국무부 보도자료를 보라. Department of State Bulletin, May 13, 1945, p. 900."], "warn": false, "pages": ["1142"], "search": "Grew 그루(국무장관 대리)"}, {"id": "d878", "order": 878, "date": "1945-05-03", "group": "C", "eyebrow": "d878 · Memorandum of Conversation, Held in San Francisco May 3, 1945", "title": "1945년 5월 3일 샌프란시스코에서 열린 대화 비망록", "badge": null, "list_right": "문서 878", "meta": [{"k": "일자", "v": "1945-05-03"}, {"k": "시각", "v": "San Francisco, May 3, 1945 (본문 중 「오후 5시」에 비도 면담 예정 언급)"}, {"k": "장소", "v": "San Francisco", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "500.CC/5–345", "txt": true}, {"k": "발신", "v": "미·영·소 3국 대표 회합 기록 (작성자 표시 없음)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "대화 비망록"}], "links": [{"k": "FRUS", "text": "문서 878 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d878"}], "summary": "전쟁범죄자 처리에 관한 미국 안(국제군사재판소 설치와 나치 조직 자체를 범죄적 공모로 기소하는 방안)을 로젠먼 판사가 제시하고 이든과 몰로토프가 응답한 기록이다.", "points": ["스테티니어스 장관이 미국의 전범 정책이 확정되었고, 대통령이 연방대법관 잭슨을 전범 재판 소추 책임자인 미국 대표로 임명했다고 알린다.", "프랑스 외무장관 비도를 이 회합에 부르는 문제가 논의되고, 시간상 불가능하므로 전문가급 대표에게 맡기되 프랑스 대표가 합류할 수 있게 하기로 합의한다.", "로젠먼 판사가 미국 안을 제시한다. 민간 법정이 아닌 국제군사재판소를 설치하고, 독일 통제이사회 4개국이 각 1명씩 재판관을 낸다.", "동시에 4개국 각 1명으로 된 위원회를 즉시 조직해 증거 수집과 재판 준비에 착수하며, 그 위원들이 재판소에서 소추 역할을 맡는다.", "범죄자 범주를 (a) 최상층 나치 (b) 범행지 국가로 송환될 자 (c) 지리적 위치가 없는 범죄를 저지른 자 (d) 증인이 죽거나 증거가 남지 않아 입증할 수 없는 다수(게슈타포와 SS 대원 등)로 나눈다.", "미국의 해결책은 개인이 아니라 나치 조직 자체를 재판에 부쳐, 세계 지배·소수자 박해·조약 파기·타국 침략·범죄 실행의 범죄적 공모로 유죄를 선고하고, 자발적 가입자는 그 자체로(ipso facto) 전쟁범죄자가 되게 하는 것이다.", "유죄자를 반드시 모두 사형에 처하려는 것은 아니나, 최소한 독일이 약탈한 나라들을 재건하기 위한 중노동형에 처하고자 한다고 밝힌다.", "이든은 영국 전시내각이 원래 최상층 나치 7~8명을 사법 절차로 재판하지 않는다는 입장이었으나 그들 다수가 이미 죽어 입장이 크게 바뀌었으며, 두 대(大)동맹국이 사법 재판을 원한다면 따르겠다고 말한다.", "몰로토프는 중요한 제안이니 크게 주목해야 한다면서도, 촉박한 통고로는 논평이 어렵다며 자국 정부의 견해 표명 권리를 유보하고 문서 검토 시간을 요청한다.", "전문가급 대표로 몰로토프는 골룬스키와 아루튜냔을, 이든은 맬킨 경을, 장관은 로젠먼 판사와 해크워스(병이 낫지 않으면 던)를 지명한다."], "primary": "샌프란시스코, 1945년 5월 3일\n\n참석\n\n미국 / 영국 / 러시아\n\n스테티니어스(Stettinius) 씨 / 이든(Eden) 씨[주74] / 몰로토프(Molotov) 씨[주75]\n\n로젠먼(Rosenman) 판사 / Wm. 맬킨(Malkin) 경 / 그로미코(Gromyko) 대사\n\n해리먼(Harriman) 대사 / A. 캐도건(Cadogan) 경 / 소볼레프(Sobolev) 씨\n\n매클로이(McCloy) 씨 / 파블로프(Pavlov) 씨\n\n던(Dunn) 씨 / 골룬스키(Golunsky) 씨\n\n커터(Cutter) 대령\n\n웩슬러(Wechsler) 씨\n\n볼렌(Bohlen) 씨\n\n요스트(Yost) 씨\n\n노이스(Noyes) 씨\n\n[1162면]\n\n1.\n\n장관은 전쟁범죄자에 관한 미국의 정책이 확정되었으며, 대통령이 아주 최근에 미합중국 연방대법원 대법관 잭슨(Jackson) 씨를 전쟁범죄자 재판의 소추를 맡을 미국 대표로 임명하였다고 말하였다. 그는 대통령이 유럽 전쟁에 관계된 4대 강국의 대표들과 이 문제를 다루도록 로젠먼 판사에게 샌프란시스코로 오라고 요청하였다고 말하였다. 이 회합은 그 목적으로 소집된 것이었다. 장관은 프랑스 외무장관 비도(Bidault)를 이 회합에 참석시키는 것이 적절할지, 아니면 오늘 늦게나 내일 다른 회합에 그를 부르는 것이 좋을지 물었다. 비도가 논의에 참여할 만한 시간에 회합에 닿을 수 없다는 것, 그리고 외무장관들이 이 문제들을 전문 대표들의 손에 맡기고 프랑스 대표가 그들과 합류할 수 있게 하는 것이 가능하리라는 데 의견이 모아졌다.\n\n2\n\n로젠먼 판사는, 전쟁범죄자의 처리에 관한 미국의 제안을, 미국과 함께 독일 통제이사회에 대표되는 4개국인 영국·소련·프랑스의 외무장관들 앞에 제시하도록 대통령이 자신을 이곳에 보냈다고 말하였다. 그는 이 문제가 샌프란시스코회의의 의제와는 무관하며, 자신이 이곳에 보내진 것은 오로지 네 외무장관이 이곳에 와 있다는 기회 때문임을 알고 있다고 하였다. 그는 이것이 외무장관들의 공식 회합이 아님을 알고 있다고 하였다. 그는 미국 정부가 전쟁범죄자 처리 계획에 관하여, 그리고 이 문제들을 다룰 기구에 관하여 결정에 이르렀다고 말하였다. 모스크바 선언에서는 전쟁범죄자가 그 범죄가 저질러진 나라로 재판을 위하여 송환되리라고 밝혀졌다. 그 선언은 또한 지리적 위치가 없는 범죄의 경우에는 적절한 절차를 연합국과의 추후 논의에 맡기기로 한다고 언급하였다. 미국은 이 문제들을 매듭짓는 데 큰 관심을 가지고 있으며 합의가 신속히 이루어져야 한다고 여긴다.\n\n3\n\n로젠먼 판사는 미국의 제안을 다음과 같이 요약하였다. 우리는 민간 법정이 아니라 국제군사재판소가 조직되어야 한다고 믿는다. 이 법정은 독일 통제이사회에 대표되는 4개 강국의 대표 각 1인으로 구성되어야 한다. 또한 증거의 수집과 앞으로 있을 재판의 준비에 착수할, 4개 강국의 대표 각 1인으로 이루어진 위원회가 즉시 조직되어야 한다. 우리의 생각은 이 위원회의 대표들이 국제군사재판소에서 사건을 다투는 소추인의 자격으로 활동하리라는 것이었다. 대통령은 이 목적으로 이미 잭슨 대법관을 임명하였다.\n\n[1163면] 4\n\n로젠먼 판사는 관계된 범죄자에 몇 가지 범주가 있다고 말하였다.\n\n(a)\n\n최상층 나치들이 있다. 우리는 종래 이들을 히틀러, 괴링, 괴벨스, 무솔리니, 그 밖의 두셋으로 보아 왔다. 이제는 우리가 이들을 상대할 필요가 없게 될 듯도 하다.\n\n(b)\n\n또한 그들의 범죄가 저질러진 나라로 송환될 범죄자들이 있다.\n\n(c)\n\n그 범죄가 지리적으로 위치를 갖지 않는 그 밖의 자들이 있다.\n\n(d)\n\n범죄를 저질렀으나 증인이 죽었거나 증거가 더 이상 남아 있지 않다는 사실 때문에 입증될 수 없는 수많은 다른 자들이 있을 것이다. 그는 예로, 의심의 여지 없이 범죄를 저질렀으나 우리가 그것을 입증할 수 없을 게슈타포와 SS 부대의 경우를 들었다.\n\n(e)\n\n이러한 범죄들은 찾아내어 처벌되어야 한다는 것이 미국의 믿음이다. 유죄자를 처벌하는 것의 도덕적 가치 때문만이 아니라, 이자들이 틀림없이 장래 나치당의 핵심을 이루고 장래의 어떠한 봉기든 이끌게 될 것이기 때문이기도 하다.\n\n5\n\n로젠먼 판사는 우리가 이 난점을 풀리라고 여기는 방안을 가지고 있다고 말하였다. 우리는 개인이 아니라 나치 조직 그 자체를 재판에 부쳐, 세계를 지배하고 소수자를 박해하고 조약을 파기하고 다른 나라들을 침략하고 범죄를 저지르기 위한 범죄적 공모에 가담한 것으로 그 조직들과 그 모든 구성원을 유죄로 선고할 것을 제안한다. 우리는 이 조직들에 이러한 범죄로 유죄를 선고할 수 있다고 확신한다. 일단 그 조직들이 유죄임이 입증되면, 그 조직에 자발적으로 가입한 각 사람은 그 자체로(ipso facto) 전쟁범죄를 저지른 것이 된다. 우리가 유죄인 자들 모두를 반드시 사형에 처하고자 하는 것은 아니나, 우리는 적어도 그들에게 독일인들이 약탈한 나라들을 재건하기 위한 중노동형을 선고하기를 분명히 원한다.\n\n6\n\n로젠먼 판사는 우리가 4개 강국에 제출할 우리의 견해에 관한 각서를 준비하였다고 말하였다. [주76] 러시아어 번역본도 만들어졌으나 검토가 필요하다. 그는 참석자 전원에게 이 각서 사본을 나누어 주었다. 로젠먼 판사는 우리가 또한 협정 각서 초안[주77]을 준비하였으며, 이를 4개 강국과의 논의의 토대로서 다른 정부들에 제시하고자 한다고 말하였다. 그는 이 사본들도 나누어 주었다.\n\n7\n\n장관은 우리가 더 나아가기 전에 프랑스를 이 논의에 참여시키는 문제를 매듭짓고자 한다고 말하였다. 몰로토프 씨와 이든 씨는 프랑스를 참여시키는 데 이의가 없다고 말하였다. 비도를 이 회합에 부르는 것이 불가능하므로, 장관은 자신이 오늘 오후 5시에 그를 만날 예정이라면서, 자신이 그에게 이 회합에서 있었던 모든 일을 알리고 우리 전문가들과 만날 수 있는 프랑스 대표를 [1164면] 임명해 달라고 요청해도 괜찮겠는지 물었다. 이에 합의되었다.\n\n8\n\n이든 씨는 런던의 자기 동료들이 얼마 전부터 이 전쟁범죄 문제를 검토해 오고 있다고 말하였다. 그들의 입장은 주요 전쟁범죄자들, 즉 최상층 나치 7~8명은 사법 절차로 재판되어서는 안 된다는 것이었다. 그러나 이들 최상층 나치 가운데 다수가 이미 죽었고 앞으로 며칠 안에 틀림없이 더 많이 죽으리라는 사실 때문에 그들의 입장은 최근 크게 바뀌었다. 전시내각은 그 범죄에 지리적 위치가 없는 가장 악명 높은 나치들에 대한 정식 국가 재판에는 여전히 이의를 보고 있다. 그러나 만일 두 대(大)동맹국이 그러한 자들에 대한 사법 재판을 분명히 원한다면, 영국은 그 문제에서 그들에게 따를 용의가 있다. 다만 그들은 제안된 절차를 검토하고자 한다. 전시내각은 게슈타포와 그 밖의 유사한 나치 조직의 구성원들을 범죄적 공모로 유죄 선고하기 위하여 로젠먼 판사가 개진한 절차 제안에는 찬성하였다. 그들은 그 제안들을 상세히 검토하고자 한다. 그는 영국 측이 이해하기로는 독일 내에서 저질러진 통상의 전쟁범죄는 4개 연합국의 통상 군사법정으로 처리되리라고 말하였다. 이것으로 많은 수의 사건이 처리될 것이다. 또한 그 범죄가 저질러진 나라로 송환될 범죄자들의 사건도 많은 수에 이를 것이다. 그는 정식 국가 재판으로 다루어지는 사람의 수가 적을수록 좋다고 여긴다고 하였다.\n\n9\n\n몰로토프 씨는 로젠먼 판사가 대단히 중요한 문제에 관하여 제안을 하였으며 우리가 그것에 크게 주목하여야 한다고 여긴다고 말하였다. 그는 제출된 문서들에 관하여 자국 정부의 견해를 표명할 권리를 유보하면서, 이렇게 촉박한 통고로는 어떠한 논평도 하기 어렵다고 말하였다. 그는 문서들을 검토할 시간을 요청하였고, 검토를 마친 뒤에는 전문가들이 이 문제들을 논의하는 것이 적절하리라 생각한다고 하였다.\n\n10\n\n장관은 로젠먼 판사가 낸 제안들이 미국 정부의 전폭적인 지지를 받고 있다고 말하고, 세 정부가 대표를 임명하여 가능한 한 빨리 만나 이 문제들을 기술적 차원에서 논의할 것을 제안하였다. 그들이 외무장관 회합이 유용하겠다는 지점에 이르면 그때 회합을 소집할 수 있을 것이다. 몰로토프 씨는 자신을 대표하도록 골룬스키 씨와 아루튜냔(Arutiunian) 씨[주78]를 임명하였다. 이든 씨는 자신을 대표하도록 Wm. 맬킨 경을 임명하였고, 장관은 미국을 대표하도록 로젠먼 판사와 해크워스(Hackworth) 씨를 임명하였다(해크워스 씨가 제때 회복하지 못할 경우에는 던 씨가 그 자리를 대신한다). 그는 자신이 비도에게 이 회합에 관하여 알리겠으며 프랑스 대표의 이름을 뒤에 다른 이들에게 알려 주겠다고 말하였다.\n\n[1165면]", "secondary": "San Francisco, May 3, 1945\n\nPresent\n\nAmerican British Russian\n\nMr. Stettinius Mr. Eden [주74] Mr. Molotov [주75]\n\nJudge Rosenman Sir Wm. Malkin Ambassador Gromyko\n\nAmbassador Harriman Sir A. Cadogan Mr. Sobolev\n\nMr. McCloy Mr. Pavlov\n\nMr. Dunn Mr. Golunsky\n\nCol. Cutter\n\nMr. Wechsler\n\nMr. Bohlen\n\nMr. Yost\n\nMr. Noyes\n\n[1162면]\n\n1.\n\nThe Secretary stated that the U.S. policy on War Criminals had been established and that the President had just recently appointed Mr. Jackson, Justice of the U.S. Supreme Court as the U.S. representative to take charge of the prosecution of the trials of War Criminals. He said that the President had asked Judge Rosenman to come to San Francisco to take this matter up with the representatives of the four major powers involved in the European war. This meeting had been called for this purpose. The Secretary asked whether it would be appropriate to have Bidault, the French Foreign Minister at this meeting or whether he should be asked to another meeting later today or tomorrow. It was agreed that Bidault could not reach the meeting in time to participate in the discussion, and that it might be possible for the foreign secretaries to leave these matters in the hands of technical representatives with whom the French representative could associate himself.\n\n2\n\nJudge Rosenman stated that he had been sent here by the President to place the U.S. proposals for the treatment of war criminals before the Foreign Ministers of the United Kingdom, U.S.S.R., and France who with the United States were the four powers represented on the Control Council for Germany. He realized that this question was not germane to the business of the San Francisco Conference and that he had been sent here merely because of the opportunity which was presented while the four Foreign Ministers were here. He realized that this was not an official meeting of the Foreign Ministers. He stated that the U.S. Government had reached a decision in regard to the plans of the Treatment of War Criminals and also with regard to the organization to handle these matters. In the Moscow Declaration, it was stated that war criminals would be returned for trial to the country in which his crime was committed. The Declaration had also mentioned that in the case of crimes which had no geographical location, the proper procedure would be left for further discussion with the Allies. The U.S. is very much interested in settling these matters and feels that an agreement must be reached promptly.\n\n3\n\nJudge Rosenman summarized the American proposal as follows: We believe that there should be organized an international military tribunal rather than a civilian tribunal. This court should consist of one representative of each of the four powders represented on the Control Council for Germany. There should also be organized immediately a committee of one representative of each of the four powers to start collecting evidence and preparing for the trials to come. It was our thought that the representatives on this committee would act in the capacity of council to try the cases before the international military tribunal. The President had already appointed Justice Jackson for this purpose.\n\n[1163면] 4\n\nJudge Rosenman said there were several categories of criminals concerned:\n\n(a)\n\nthere were the top Nazis. We had formerly considered these to be Hitler, Goering, Goebbels, Mussolini, and two or three others. It now looked as though we might not have to concern ourselves with these men.\n\n(b)\n\nthere were also the criminals which were going to be returned to the country where their crimes had been committed.\n\n(c)\n\nthere were others whose crimes were not geographically located.\n\n(d)\n\nthere would be numerous others who had committed crimes but could not be proven because of the fact that the witnesses were dead or there was no evidence still in existence. He gave, for example, the case of Gestapo and SS troops who had undoubtedly committed crimes but we would not be able to prove them.\n\n(e)\n\nIt was the U.S. belief that these crimes must be sought out and punished, not only to punish the guilty for its moral value but also because these men would certainly provide the nucleus of a future Nazi party and would lead any future uprising.\n\n5\n\nJudge Rosenman stated that we had a plan which we felt would solve this difficulty. We proposed to place on trial the Nazi organizations themselves rather than the individuals and to convict them and all their members of engaging in a criminal conspiracy to control the world, to persecute minorities, to break treaties, to invade other nations and to commit crimes. We are convinced we can convict these organizations of these crimes. Once having proved the organizations to be guilty, each person who had joined the organization voluntarily would ipso facto be guilty of a war crime. While we do not necessarily want to put all the guilty persons to death, we would definitely want to sentence them at least to hard labor to rehabilitate the countries which the Germans had despoiled.\n\n6\n\nJudge Rosenman stated that we had prepared a memorandum on our views to be submitted to the four powers. [주76] The Russian translation had been made which, however, should be checked. He handed copies of these memoranda to all present. Judge Rosenman stated that we had also prepared a draft memorandum of agreement [주77] which he desired to present to the other Governments as a basis for discussion with the four powers. He also handed out copies of these.\n\n7\n\nThe Secretary stated that before we proceeded further, he wanted to settle the matter of bringing the French into these discussions. Mr. Molotov and Mr. Eden stated that they had no objection to bringing the French in. Since it was impossible to bring Bidault into this meeting, the Secretary suggested that he was seeing him at 5 p.m. this afternoon and asked whether it would be all right for him to inform him of all that had taken place at this meeting and to ask him [1164면] to appoint a French representative who could meet with our experts. This was agreed.\n\n8\n\nMr. Eden stated that his colleagues in London had been considering this matter of war crimes for some time. Their position was that the major war criminals, the top 7 or 8 Nazis, should not be tried by judicial procedures. Their position had, however, recently changed greatly due to the fact that many of these top Nazis had already been killed and no doubt many more would be killed within the next few days. The War Cabinet still saw objections to a formal state trial of war criminals for the most notorious Nazis whose crimes had no geographic location. If, however, their two great Allies definitely wanted a judicial trial of such men, the British were willing to bow to them in the matter. They would, however, like to review the proposed procedure. The War Cabinet favored the proposed procedure as outlined by Judge Rosenman for a criminal conspiracy to convict members of the Gestapo and other similar Nazi organizations. They would like to review the proposals in detail. He stated that the British understood that the normal military courts of the four Allies would be used to take care of the ordinary war crimes committed inside Germany. This would take care of a large number of cases. There would also be a large number of cases of criminals who would be returned to the country where their crimes were committed. He felt that the smaller the number of people who were dealt with by a formal state trial, the better.\n\n9\n\nMr. Molotov stated that he felt Judge Rosenman had made proposals on a matter of great importance and that we should pay great attention to them. He reserved the right to express the views of his Government on the documents which had been submitted, stating that it was difficult to make any comment on such short notice. He asked for time to study the documents and thought that after they had done so, it might be appropriate to have the experts discuss the questions.\n\n10\n\nThe Secretary stated that the proposals Judge Rosenman had made had the full support of the American Government and suggested that the three Governments appoint representatives to meet as soon as possible to discuss these matters on a technical level. When they had reached the point where other Foreign Ministers meetings would be useful they could be called. Mr. Molotov appointed Mr. Golunsky and Mr. Arutiunian [주78] to represent him. Mr. Eden appointed Sir Wm. Malkin to represent him, and the Secretary appointed Judge Rosenman and Mr. Hackworth to represent the U.S. (Mr. Dunn to take Mr. Hackworth’s place if the latter did not get well in time). He said he would tell Bidault of this meeting and would advise the others later of the name of the French representative.\n\n[1165면]", "notes": ["[주74] 앤서니 이든, 영국 외무장관, 샌프란시스코회의 영국 대표단장.", "[주75] 뱌체슬라프 미하일로비치 몰로토프, 소련 외무인민위원, 샌프란시스코회의 소련 대표단장.", "[주76] 원문은 Report of Robert H. Jackson, pp. 28–38을 보라.", "[주77] 같은 책, 23면.", "[주78] A. A. 아루튜냔, 샌프란시스코회의 소련 대표단 고문."], "warn": false, "pages": ["1162", "1163", "1164", "1165"], "search": "Stettinius 스테티니어스(국무장관, 「장관」) Rosenman 로젠먼(판사) Harriman 해리먼(주소련대사) McCloy 매클로이 Dunn 던 Cutter 커터(대령) Wechsler 웩슬러 Bohlen 볼렌 Yost 요스트 Noyes 노이스 Eden 이든(영국 외무장관) Malkin 맬킨(경) Cadogan 캐도건(경) Molotov 몰로토프(소련 외무인민위원) Gromyko 그로미코 Sobolev 소볼레프 Pavlov 파블로프 Golunsky 골룬스키 Jackson 잭슨(연방대법관) Bidault 비도(프랑스 외무장관) Hackworth 해크워스 Arutiunian 아루튜냔 Hitler 히틀러 Goering 괴링 Goebbels 괴벨스 Mussolini 무솔리니"}, {"id": "d916", "order": 916, "date": "1945-05-03", "group": "A", "eyebrow": "d916 · The Chargé in the Soviet Union (Kennan) to the Secretary of State", "title": "주소련 대리대사(케넌)가 국무장관에게", "badge": null, "list_right": "문서 916", "meta": [{"k": "일자", "v": "1945-05-03"}, {"k": "시각", "v": "Moscow, May 3, 1945—1 p.m. [Received May 3—12:05 p.m.]"}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": "1448"}, {"k": "원문출처", "v": "740.00119 EW/5–345: Telegram", "txt": true}, {"k": "발신", "v": "The Chargé in the Soviet Union (Kennan) 주소련 대리대사 케넌", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 916 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d916"}], "summary": "독일 배상에 관한 새 지령이 마무리되는 중이라는 소식에 맞추어, 소련의 배상 관행에 관한 여섯 항의 잠정 결론을 보낸다. 소련은 배상 협정의 유무와 상관없이 일방적으로 설비를 반출할 것이라는 전망이다.", "points": ["어떠한 배상 타결이 이루어지기 전에 이미 상당 부분의 독일 자산이 「전리품(war trophies)」 등의 명목으로 소련 지대에서 반출되어 있을 것이다.", "소련 정부는 배상 협정의 존재 여부와 무관하게 일방적으로 공장·설비·자재를 반출할 뜻임이 발칸과 이미 점령한 독일 지역의 모든 증거로 명백하다.", "그 반출에 관한 정말로 상세하거나 신뢰할 만한 정보는 결코 얻지 못할 것이다. 소련의 경제 정보 비공개는 전통과 정책 양쪽에 뿌리를 두고 있다.", "소련 지대에서 위원회 대표의 감독 활동은 허용되더라도 방해받을 것이고, 이동의 자유와 정보 접근도 쉽게 주어지지 않을 것이다.", "소련은 자기 지대에서 서방 국가로의 배상 인도에는 오직 엄격한 대가(quid pro quo) 방식으로만, 그것도 응한다면 응할 것이다.", "소련은 배상위원회를 패전 적국의 희생으로 소련 경제를 강화하는 기관으로 볼 것이며, 소련과 동유럽 위성국의 희생이 서방보다 훨씬 컸다고 주장할 것이다.", "위원회가 서방 지대에서 동유럽으로의 인도 문제에 집중해야 한다는 입장을 취할 것이고, 그것을 협상 지렛대로 보류하지 않는 한 자기 지대에서의 중요한 인도에 응하기를 꺼릴 것이다.", "독일 공업설비의 해체 원칙은 열렬히 받아들일 것이나(그것이 기본 전쟁 목적의 하나이므로), 배상 타결을 기다리지 않고 자기 지대에서 착수할 것이다.", "소련 당국이 이미 폴란드에 할양한 지역과 나머지 독일 영토를 날카롭게 구별하고 배상위원회에도 그렇게 하라고 요구할 가능성이 있다.", "적대행위 종결 시점에 존재하는 독일 자산에서 주로 배상을 취한다는 미국 주장을 소련이 받아들이리라 기대하기 어렵다. 패전국 생활수준이 승전국을 넘어서지 못하게 한다는 방침은 공공연하거나 위장된 무거운 공납의 부과를 뜻한다."], "primary": "모스크바, 1945년 5월 3일 오후 1시.\n [접수 5월 3일 오후 12시 5분]\n\n1448. 본관은 최근의 정보 전보에서 독일 배상에 관한 새로운 지령이 마무리되고 있음을 알게 되었다. 소련의 관행 일반과 특히 배상 관행에 관하여 우리가 지금까지 보아 온 바에 근거한, 배상에 대한 러시아 측 태도에 관한 다음의 잠정적 결론들이 이와 관련하여 국무부에 유용할 수 있겠다. 이것들은 물론 그 후의 경험에 비추어 수정될 여지가 있으며, 또한 러시아인들이 문서상 동의하도록 유도될 수 있는 바가 아니라 소련의 실제 관행이 어떠하리라는 것을 가리킨다.\n\n[1204면]\n\n1\n\n어떠한 배상 타결이든 그것이 이루어질 무렵이면 기존 독일 자산의 상당 부분이 전리품(war trophies)의 명목으로든 다른 명목으로든 이미 소련 지대에서 반출되어 있을 것이다. 발칸 국가들과 러시아인들이 이미 점령한 독일 내 지역에서 나온 모든 이용 가능한 증거는, 소련 정부가 배상 협정의 존재 여부와 상관없이 일방적으로, 자신이 접근할 수 있고 소련 또는 위성 지역의 경제에 유용하리라 여기는 적국 내의 공업 설비·기계·자재를 반출해 나갈 뜻임을 명백히 보여 준다.\n\n2\n\n우리는 이 반출에 관하여 정말로 상세하거나 신뢰할 만한 정보를 얻기는 아마 결코 불가능할 것이다. 소련 당국의 경제 활동에 관한 정보 공개를 소련이 꺼리는 것은 전통과 정책 양쪽에 뿌리를 두고 있으며, 본 대사관의 경험에서나 유럽의 여러 연합국 공동 경제 통제기구의 설치를 위한 논의에서나 충분히 드러난 바 있다. 소련 점령지대 내에서의 소련의 행동을 위원회가 파악하거나 통제하려는 시도는 러시아 측의 반대와 의심에 부딪힐 것이다. 소련 지대에서 위원회 대표들의 감독 활동은, 설령 허용된다 하더라도 방해받을 것이며, 그러한 대표들에게 이동의 자유와 정보에 대한 접근이 선뜻 주어지지는 않을 것이다.\n\n3\n\n러시아인들은 자기 지대에서 서방 국가들로 배상물을 인도하는 데는, 만일 응한다 하더라도, 오로지 엄격한 대가(quid pro quo)의 방식으로만 동의할 것이다. 그들은 배상위원회를 무엇보다도 패전 적국의 희생 위에서 소련 경제를 강화하기 위한 기관으로 여길 것이다. 그들은 소련과 동유럽의 소련 위성국들의 희생이 서방 국가들의 희생을 훨씬 능가한다고 주장할 것이다. 그들은 아마도 위원회가 서방 지대들로부터 동유럽으로 어떻게 인도를 실현할 것인가의 문제에 집중해야 한다는 입장을 취할 것이다. 후자가 협상 지렛대로 보류되지 않는 한, 러시아인들은 자기 지대에서의 어떠한 중요한 인도에도 동의하기를 꺼릴 것이다.\n\n4\n\n만일 이 기초 위에서 상호 인도가 마련된다면 러시아인들은 자기들에게 유리한 상당한 불균형을 요구할 것이다. 이 또한 동유럽 국가들의 희생이 더 크다는 명제에 근거할 것이다.\n\n5\n\n러시아인들이 독일 공업설비의 해체 원칙을 열렬히 받아들이리라 예상할 수 있다. 그것이 그들의 기본적인 전쟁 목적 가운데 하나이기 때문이다. 그들은 자기 지대에서 이 방향으로 조치를 취하기에 앞서 배상 타결을 기다리지 않을 것이며, 나중에 이 점에 관하여 어떠한 배상위원회의 지도에도 선뜻 따르지 않을 것이다. [1205면] 전쟁 중에 파괴되지 않은 소련 지대의 공업 설비 가운데 상당 부분이, 항구적인 배상 기구가 활동을 시작할 무렵이면 이미 해체되어 있는 것으로 드러날 수 있다. 여기서도 이 문제에 관한 정확한 정보를 얻는 데 어려움이 있을 수 있다. 러시아인들이 여기서 소련 당국에 의하여 이미 폴란드에 할당된 지역과 독일의 나머지 영토 사이에 날카로운 구별을 짓고 — 그리고 배상(Separations)위원회에도 그렇게 하기를 요구할 — 가능성이 있다. [주71]\n\n6\n\n러시아인들이, 배상은 주로 적대행위의 종결 시점에 존재하는 독일 자산으로부터 취하여져야 한다는 우리의 명제를 받아들이리라고는 거의 기대할 수 없다. 그들은 패전국의 생활수준이 승전국의 그것을 넘어서서는 안 된다는 결의를 분명히 밝혀 왔다. 소련의 생활수준을 중부 유럽의 수준까지 끌어올리는 것이 여러 해 동안 불가능할 것이므로, 이 정책의 시행은 소련 점령 기간 중에나 그 후에나 공공연하거나 위장된 무거운 공납의 부과를 뜻하게 될 것이다.\n\n국무부로 1448호로 발신, 파리의 머피[주72] 앞 95호로 전달.\n\n케넌(Kennan)", "secondary": "Moscow, May 3, 1945—1 p.m. \n [Received May 3—12:05 p.m.]\n\n1448. I note from a recent information telegram that a new directive on German reparations is being completed. The following tentative conclusions on Russian attitude toward reparations, based on what we have seen thus far of Soviet practices in general and reparations practices in particular may be useful to the Department in this connection. They are, of course, open to revision in the light of subsequent experience; and they refer to probable actual Soviet practices rather than what the Russians may be induced to agree to on paper.\n\n[1204면]\n\n1\n\nBy the time any reparations settlement can be arrived at a considerable portion of existing German assets will already have been removed from the Soviet zone in the guise of war trophies or otherwise. All available evidence from the Balkan countries and from areas already occupied by the Russians in Germany plainly shows that the Soviet Government intends to proceed unilaterally regardless of existence or non-existence of a reparations agreement in removing industrial plants, equipment and materials in enemy countries to which it has access and which it feels might be useful to the economy of the Soviet Union or satellite areas.\n\n2\n\nWe will probably never be able to obtain really detailed or reliable information concerning these removals. Soviet reluctance to disclose information regarding economic operations by Soviet authorities is rooted in both tradition and policy and has been amply apparent both in the experience of this Embassy and in the discussions for the establishment of various inter-Allied economic controls in Europe. Attempts by the Commission to determine or control Soviet actions in the Soviet zone of occupation will probably meet with opposition and suspicion on the Russian side. Supervisory activities by representatives of the Commission in the Soviet zone, if permitted at all, will be obstructed and such representatives will not readily be granted freedom of movement and access to information.\n\n3\n\nThe Russians will consent to make available reparations deliveries from their zone to Western countries only, if at all, on a strictly quid pro quo basis. They will regard the Reparations Commission primarily as an agency for strengthening Soviet economy at the expense of defeated enemy countries. They will insist that the sacrifices of the Soviet Union and Soviet satellite countries in eastern Europe have far outweighed those of the Western countries. They will probably take the position that the Commission should concentrate on the question of how to make available deliveries from the Western zones to Eastern Europe. Unless the latter are withheld as a bargaining lever the Russians will probably balk at agreeing to any important deliveries from their zone.\n\n4\n\nIf counter deliveries are worked out on this basis the Russians will demand a considerable disproportion in their favor. This again will be based on the thesis of greater sacrifice of the Eastern European countries.\n\n5\n\nThe Russians may be expected to accept enthusiastically the principle of dismantling German industrial equipment since that is one of their basic war aims. They will not await a reparations settlement before taking steps in this direction in their own zone and will not readily submit, at a later date, to guidance from any Reparations Commission in this respect. A good deal of the industrial plant in the [1205면] Soviet zone which has not been destroyed during the war may prove to have been already dismantled by the time a permanent reparations body begins to function. Again there may be difficulties in getting accurate information on this subject. It is possible that the Russians make here a sharp distinction—and demand that the Separations Commission do likewise—between the areas which have already been allotted to Poland by the Soviet authorities and the remaining territory of Germany. [주71]\n\n6\n\nThe Russians can hardly be expected to accept our thesis that reparations should be derived principally from German assets existing at the termination of hostilities. They have made clear their determination that the standard of living in defeated countries is not to surpass that of the victors. Since it will not be possible for years to raise the Soviet standard of living to that of central Europe, the implementation of this policy will mean the imposition of heavy tribute, open or disguised, both during and after the period of Soviet occupation.\n\nSent Department as 1448, repeated to Paris for Murphy [주72] as 95.\n\nKennan", "notes": ["[주71] 모스크바발 4월 18일자 전보 1251호 및 1252호, 5월 4일자 1467호를 보라. 각각 제5권 229면, 231면, 277면.", "[주72] 로버트 D. 머피 대사, 미국 대독일 정치고문(USPolAd). 그 사무소는 베르사유에 있었다."], "warn": false, "pages": ["1204", "1205"], "search": "Kennan 케넌(주소련 대리대사) Murphy 머피(대독일 정치고문)"}, {"id": "d90", "order": 90, "date": "1945-05-04", "group": "C", "eyebrow": "d90 · Memorandum of Trans-Atlantic Telephone Conversation Between the Ambassador in the United Kingdom (Winant), in London, and the Director of the Office of European Affairs (Matthews), in Washington, May 4, 1945  For other extracts from this trans-Atlantic conversation dealing with German problems, see p. 206", "title": "런던의 주영대사(위넌트)와 워싱턴의 유럽국장(매슈스) 사이의 대서양 횡단 전화 통화 비망록, 1945년 5월 4일", "badge": null, "list_right": "문서 90", "meta": [{"k": "일자", "v": "1945-05-04"}, {"k": "시각", "v": "May 4, 1945"}, {"k": "장소", "v": "London / Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 Control (Germany)/5–445", "txt": true}, {"k": "발신", "v": "The Ambassador in the United Kingdom (Winant), in London 런던의 주영대사 위넌트", "txt": true}, {"k": "수신", "v": "The Director of the Office of European Affairs (Matthews), in Washington 워싱턴의 유럽국장 매슈스", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전화 비망록"}], "links": [{"k": "FRUS", "text": "문서 90 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d90"}], "summary": "군사사절단이 빈에 도착할 때까지 빈 지대 논의를 미루기로 한 방침을 확인하나, 소련이 문제가 해결될 때까지 사절단이 가서는 안 된다는 입장을 취해 교착에 빠졌음을 매슈스가 알린다.", "points": ["위넌트가 먼저 말을 꺼낸다. 군사사절단이 갈 때까지 빈 지역 문제 논의를 미루어 왔다는 것이다.", "매슈스가 「빈으로, 그렇습니다」라고 받는다.", "위넌트는 구세프가 두세 차례 이 문제를 제기했지만, 사절단이 현지를 살펴볼 기회를 가질 때까지는 미루는 것이 현명하다고 여전히 생각한다고 말한다.", "매슈스가 「불행히도 우리는 그 점에서 난관에 부딪힌 것 같습니다」라며, 소련이 문제가 해결될 때까지 사절단이 빈에 가서는 안 된다는 입장을 취해 일종의 교착에 이르렀고, 모스크바에 긴급히 제기했으나 아직 회답이 없다고 알린다.", "위넌트는 외무성의 이든을 통해, 몰로토프가 스탈린에게 파견을 허용하도록 건의했다고 들었다고 말하고, 매슈스가 「그렇습니다」라고 확인한다.", "위넌트는 회답을 받을 때까지 빈 지역 타결과 런던의 공군 문제를 더 밀고 나가지 말자고 제안한다.", "매슈스는 지연이 너무 길지 않다면 현명하다고 보되, 너무 길어지면 EAC에서 논의를 계속하는 편이 낫겠다며 「동의하지 않으십니까?」라고 되묻는다.", "위넌트가 동의하고, 다만 「나흘이나 닷새는 기다려 볼 만하다」고 말하며 이 대목을 맺는다."], "primary": "1945년 5월 4일\n\n[발췌]\n\n. . . . . . .\n\n위넌트: 한 가지 여쭙고 싶습니다. 우리는 군사사절단이 갈 때까지 빈의 지역 문제 논의를 미루어 왔습니다.\n\n매슈스: 빈으로, 그렇습니다.\n\n위넌트: 구세프(Gousev)가 두세 차례 이 문제를 제기하기는 했습니다만, 저는 군사사절단이 현지를 살펴볼 기회를 가질 때까지는 당분간 미루는 것이 현명하다고 여전히 생각합니다.\n\n매슈스: 불행히도 우리는 그 점에서 난관에 부딪힌 것 같습니다. 러시아 측이 이제 문제가 해결될 때까지는 군사사절단이 빈에 가서는 안 된다는 입장을 취하여, 우리는 일종의 교착에 이르렀습니다. 우리는 이 문제를 모스크바에 긴급히 제기하였습니다만 아직 그들의 회답을 받지 못하였습니다.\n\n위넌트: 그런데 저는 외무성의 이든을 통하여, 몰로토프가 그들이 가도록 허용할 것을 스탈린에게 건의하였다고 알고 있습니다.\n\n매슈스: 그렇습니다.\n\n위넌트: 그래서 저는 우리가 그들의 회답을 받을 때까지는 빈 지역의 타결과 이곳 런던의 공군 문제를 더 밀고 나가지 말아야 한다고 생각하였습니다.\n\n매슈스: 지연이 너무 길지만 않다면 저도 그것이 현명하다고 생각합니다. 만일 지연이 너무 길어진다면 그때는 우리가 그대로 나아가 EAC에서 논의를 계속하는 편이 낫겠습니다. 동의하지 않으십니까?\n\n위넌트: 예, 저도 그에 동의합니다.\n\n매슈스: 예.\n\n위넌트: 다만 저는 그것을 얻기 위하여 나흘이나 닷새는 기다려 볼 만하다고 생각합니다.\n\n. . . . . . .\n\n[116면]", "secondary": "May 4, 1945\n\n[Extract]\n\n. . . . . . .\n\nWinant: I want to ask you, we have delayed discussing the question of areas in Vienna until after the military mission has gone on.\n\nMatthews: To Vienna, yes.\n\nWinant: Although two or three times Gousev has raised the question, I still think it wise to delay at present until the military mission has had a chance to look over the ground.\n\nMatthews: Unfortunately, we seem to have struck a snag in that. The Russians have now taken the position that the military mission should not go to Vienna until the question is settled and so we have reached a sort of an impasse. We have taken it up urgently with Moscow but have not yet gotten their answer.\n\nWinant: Well, I understand through Eden in the Foreign Office that Molotov has recommended to Stalin that they be permitted to go.\n\nMatthews: That is correct.\n\nWinant: And so I thought we should wait until we get their reply before we pursue that settlement of the Vienna area and the question of the Air Force here in London.\n\n
