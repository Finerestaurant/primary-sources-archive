시로 미루기를 바란다고 하였다.", "[주81] 그러나 트루먼은 5월 8일 워싱턴 시간 오전 8시 15분에 독일이 전 전선에서 항복하였다는 정식 발표를 하였고, 그날 늦게 그로미코 소련대사에게 다음의 전언을 건넸다. 스탈린의 전문은 그날 새벽 1시에 백악관에 접수되었으나 자기에게 이르렀을 때에는 준비가 이미 너무 진척되어 발표 연기를 고려할 수 없었다는 것이다. 발표 시각의 어긋남은 이 「이르렀을 때에는 이미 늦었다」는 데서 확정되었다."], "primary": "모스크바, 1945년 5월 7일.\n\n독일의 항복을 발표하는 데 관한 귀하의 5월 7일자 전언을 [주80] 받았습니다. 붉은군대 최고사령부는 무조건항복에 관한 독일 최고사령부의 명령이 동부전선의 독일군에 의하여 이행되리라고 확신하지 못하고 있습니다. 그러므로 우리는 소련 정부가 오늘 독일의 항복을 발표할 경우 우리가 난처한 처지에 놓이고 소련 대중을 그르치게 될까 두렵습니다. 동부전선의 독일군 저항이 누그러지고 있지 아니하며, 감청한 무선 전문으로 판단하건대 상당한 규모의 독일군 집단이 저항을 계속하고 되니츠(Dönitz)의 항복 명령에 따르지 아니하겠다는 뜻을 명시적으로 밝혔다는 것을 유념하여야 합니다.\n\n이러한 까닭에 소련군 사령부는 독일의 항복이 효력을 발생할 때까지 기다리고, 정부의 항복 발표를 5월 9일 모스크바 시간 오후 7시로 미루고자 합니다. [주81]", "secondary": "Moscow, May 7, 1945.\n\nI am in receipt of your message of May 7, [주80] about announcing Germany’s surrender. The Supreme Command of the Red Army is not sure that the order of the German High Command on unconditional surrender will be executed by the German armies on the Eastern Front. We fear, therefore, that if the Government of the U. S. S. R. announces today the surrender of Germany we may find ourselves in an awkward position and mislead the Soviet public. It should be borne in mind that the German resistance on the Eastern Front is not slackening but, judging by the intercepted radio messages, a considerable grouping of German troops have explicitly declared their intention to continue the resistance and to disobey Dönitz’s surrender order.\n\nFor this reason the Command of the Soviet troops would like to wait until the German surrender takes effect and to postpone the Government’s announcement of the surrender till May 9, 7 p.m. Moscow time. [주81]", "notes": ["[주80] 제260호 전보. 이 전보에서 트루먼 대통령은 스탈린 원수가 동의한다면 5월 8일 워싱턴 시간 오전 9시에 독일의 항복을 발표하겠다는 뜻을 밝혔다. 본문은 위의 책 229면 참조.", "[주81] 5월 8일 워싱턴 시간 오전 8시 15분에 트루먼 대통령은 독일이 전 전선에서 항복하였다는 정식 발표를 하였다. 그날 늦게 그는 소련대사 그로미코에게 다음의 전언을 건넸다. “스탈린 원수에게, 나에게 보낸 그의 전언이 오늘 새벽 1시에 백악관에 접수되었음을 알려 주시기 바랍니다. 그러나 그 전언이 나에게 이르렀을 때에는 준비가 이미 너무 많이 진척되어 있어서 독일 항복에 관한 나의 발표를 연기하는 것을 고려할 수 없었습니다.”"], "warn": false, "pages": [], "search": "Joseph Stalin 스탈린 (소련 인민위원회의 의장) Harry S. Truman 트루먼 (대통령) Karl Dönitz 되니츠 Andrey A. Gromyko 그로미코 (주미 소련대사, 각주)"}, {"id": "d568", "order": 568, "date": "1945-05-07", "group": "A", "eyebrow": "d568 · The Chargé in the Soviet Union (Kennan) to the Secretary of State", "title": "주소련 대리대사(케넌)가 국무장관에게", "badge": null, "list_right": "문서 568", "meta": [{"k": "일자", "v": "1945-05-07"}, {"k": "시각", "v": "Moscow, May 7, 1945—2 p.m. [Received 3:15 p.m.]"}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": "1487"}, {"k": "원문출처", "v": "740.00119 EW/5–745: Telegram", "txt": true}, {"k": "발신", "v": "주소련 대리대사 케넌(George F. Kennan, The Chargé in the Soviet Union)", "txt": true}, {"k": "수신", "v": "국무장관(The Secretary of State)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 568 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d568"}], "summary": "소련 언론이 이탈리아와 서부전구에서의 독일군 항복과 독일 저항의 전반적 붕괴를 눈에 띄게 무성의하고 눈에 안 띄게 다루고 있음을 지적하고, 그 까닭을 케넌이 나름대로 풀이한 전보이다.", "points": ["이탈리아와 서부전구에서의 독일군 항복 소식은 소련 일간지의 사소한 뒷면 기사로만 실렸고, 어떤 종류의 논평도 붙지 않았으며, 독자의 주의를 끌도록 따로 다루어지지도 않았다.", "케넌이 보기에 가장 그럴듯한 설명은, 소련 지도부가 그 소식을 아주 감추지는 못하면서도 큰 규모의 현지 항복이 오로지 우리(서방) 군대에게만 이루어지고 자기들 군대에게는 이루어지지 않았다는 사실을 달가워하지 않는다는 것이다. 연합국끼리의 경쟁 심리를 드러낸 대목이다.", "또한 중부 유럽 사람들 사이에서 서방 나라들의 군대가 소련군보다 덜 두려워지고 덜 미움받는다는 암시가 나오는 것을 바라지 않는다고 보았다.", "그리고 자기들 전선을 포함한 모든 전선에서 완전한 항복과 저항 중지를 발표할 수 있게 되고 그것을 주로 붉은군대의 영웅적 노력 덕으로 돌릴 수 있게 되기까지는, 독일의 와해가 어느 정도인지 대중의 주의를 끌지 않기로 택하였다고 보았다.", "[주82] 케넌은 5월 8일 정오 전보 1492호에서 소련 정부가 항복문서의 서명을 발표하지 않는 것에 관하여 더 논평하며, 러시아에서는 평화도 다른 모든 것과 마찬가지로 오직 칙령(ukase)으로만 올 수 있으며 적대행위의 종식은 사태의 참된 흐름이 아니라 크렘린의 결정으로 정해져야 한다고 하였다.", "[주82] 케넌은 나아가, 독일인이 러시아에 대답하여야 할 작은 잘못들 가운데 크렘린이 고르지 않은 시각과 장소에서 항복해 버린 그 제멋대로임(willfulness)이 적지 않은 것일지 모른다고 비꼬았다.", "[주82] 5월 9일 정오 모스크바발 전보 1519호는 독일의 무조건항복이 5월 9일 새벽 2시 라디오 방송으로 모스크바에 알려졌다고 보고하였다. 소련의 발표 시각을 확정해 주는 기록이다."], "primary": "모스크바, 1945년 5월 7일 오후 2시.\n[접수 오후 3시 15분]\n\n1487. 이탈리아와 서부전구에서의 독일군 항복 및 그곳에서의 독일 저항의 전반적 붕괴를 소련 언론이 눈에 띄게 무성의하고 눈에 잘 띄지 않게 다루고 있음을 지적한 나의 여러 전보들에 주의를 환기하고자 한다. 이러한 사건들의 소식은 일간지의 사소한 뒷면 기사로만 소련 [780면] 대중에게 제공되었으며, 어떠한 종류의 논평도 따르지 아니하였고, 독자들의 주의를 끌도록 어떤 식으로든 따로 다루어지지도 아니하였다.\n\n승리의 소식을 내보내는 데에서 나타나는 이 극도의 조심스러움을 무엇이 지시하고 있는지 그 동기를 확실히 알 수는 없다 — 그 승리라면 소련 정부와 대중 모두에게 매우 흡족하리라고 생각할 만한 것인데도 그러하다. 내 의견으로 가장 그럴듯한 설명은 이러하다. 곧 소련 지도자들은 그 소식을 아주 감추어 두지는 못하면서도, 큰 규모의 현지 항복들이 오로지 우리 군대에게만 이루어지고 자기들 군대에게는 이루어지지 아니하였다는 사실을 달가워하지 아니한다는 것이다. 그리고 그들은 중부 유럽 여러 민족들 사이에서 서방 나라들의 군대가 소련군보다 덜 두려워지고 덜 미움받는다고[than?] 하는 암시가 나오는 것을 바라지 아니한다는 것이다. 또한 그들은 자기들 전선을 포함한 모든 전선에서 완전한 항복과 저항의 중지를 발표할 수 있게 되고 이것을 주로 붉은군대의 영웅적 노력 덕분으로 돌릴 수 있게 되기까지는, 독일 와해의 온전한 정도에 자기들 대중의 주의를 끌지 아니하기로 택한다는 것이다. [주82]\n\n국무부에 1487번으로 발신하고, 레버와 머피에게 전하도록 파리에 101번으로 반복 발신하였다.\n\n케넌", "secondary": "Moscow, May 7, 1945—2 p.m. \n [Received 3:15 p.m.]\n\n1487. I wish to invite attention to my several telegrams pointing out the markedly casual and inconspicuous treatment which the Soviet press has given to the surrenders of German forces in Italy and in the Western Theater and the general crumbling of German resistance there. News of these events has been made available to the Soviet [780면] public only in minor back page items in the daily press, has been accompanied by no editorial comment of any sort and has not been singled out in any way for the attention of the readers.\n\nIt is not possible to be sure of the motives dictating this extreme reserve in releasing news of victories which one might have thought would be highly gratifying to both the Soviet Government and public. The most likely explanation, in my opinion, is that the Soviet leaders, while not daring to withhold the news entirely are not happy over the fact that the big local surrenders have been exclusively to our forces and not to theirs; that they do not wish it to be suggested that the forces of the Western nations are less feared and hated that [than?] the Soviet forces among the peoples of central Europe and that they choose not to draw the attention of their public to the full extent of German disintegration until they are able to announce complete surrender and cessation of resistance on all fronts, including their own, and to attribute this primarily to the heroic efforts of the Red Army. [주82]\n\nSent Department as 1487, repeated to Paris for Reber and Murphy as 101.\n\nKennan", "notes": ["[주82] 5월 8일 정오 모스크바발 전보 1492호에서 케넌 씨는 소련 정부가 항복문서의 서명을 발표하지 아니한 데 관하여 더 논평하면서 다음과 같이 지적하였다. “이러한 사태에 대한 공식 해명은 의심할 여지 없이 동유럽에서 소련군에 맞선 저항이 아직 여기저기 남아 있다는 것이 되겠으나, 나는 참된 설명이 더 깊은 곳에 있다고 생각한다. 러시아에서는 평화도 다른 모든 것과 마찬가지로 오직 칙령(ukase)에 의하여서만 올 수 있으며, 적대행위의 종식은 사태의 참된 흐름이 아니라 크렘린의 결정에 의하여 정하여져야 한다. 연기가 걷힌 뒤에 독일인이 러시아에 대답하여야 할 작은 잘못들 가운데, 크렘린이 고르지 아니한 시각과 장소에서 항복해 버린 그 제멋대로임이 아마도 적지 아니한 것일지 모른다.” (740.00119 EW/5–845) 5월 9일 정오 모스크바발 전보 1519호는 독일의 무조건항복이 5월 9일 새벽 2시에 라디오 방송을 통하여 모스크바에 알려졌다고 보고하였다(740.00119 EW/5–945)."], "warn": false, "pages": ["780"], "search": "George F. Kennan 케넌 (주소련 대리대사) Samuel Reber 레버 (파리, 각주 아닌 본문의 수신자 표시) Robert Murphy 머피 (대독일 정치고문)"}, {"id": "d569", "order": 569, "date": "1945-05-07", "group": "A", "eyebrow": "d569 · The Ambassador in France (Caffery) to the Secretary of State", "title": "주프랑스대사(캐퍼리)가 국무장관에게", "badge": null, "list_right": "문서 569", "meta": [{"k": "일자", "v": "1945-05-07"}, {"k": "시각", "v": "Paris, May 7, 1945—10 p.m. [Received May 7—6:33 p.m.]"}, {"k": "장소", "v": "Paris", "txt": true}, {"k": "전문번호", "v": "2447"}, {"k": "원문출처", "v": "740.0011 EW/5–745: Telegram", "txt": true}, {"k": "발신", "v": "주프랑스대사 캐퍼리(Jefferson Caffery, The Ambassador in France) — 본문은 머피(Murphy)가 매슈스(Matthews) 앞으로 보낸 것", "txt": true}, {"k": "수신", "v": "국무장관(The Secretary of State)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 569 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d569"}], "summary": "아이젠하워 장군이 자신의 연합국 사령부에 맡겨진 임무가 이제 완수되었음을 연합참모본부에 알렸다는 사실을, 머피가 매슈스 앞으로 보내어 캐퍼리를 거쳐 전한 짧은 전보이다.", "points": ["아이젠하워 장군이 연합참모본부(Combined Chiefs of Staff)에 자기의 연합국 사령부에 맡겨진 임무가 이제 완수되었다고 통보하였다. 유럽에서의 전쟁 종결을 알리는 군사적 통고이다.", "런던 시각으로는 이미 5월 7일 새벽 랭스에서의 서명이 끝난 뒤이며, 이 전보는 파리 5월 7일 오후 10시에 발신되어 워싱턴에 같은 날 오후 6시 33분에 접수되었다. 발신 시각이 접수 시각보다 늦게 표시된 것은 시차 때문이다.", "[주83] 1945년 5월 7일 프랑스 랭스에서 독일 최고사령부는 연합국원정군최고사령관과 소련 최고사령부에 무조건항복하였다.", "[주83] 모든 독일군의 최고 연합국 사령부들에 대한 무조건항복의 「비준(ratification)」은 1945년 5월 8일 베를린에서 이루어졌다. 편집자는 5월 8일의 절차를 새로운 항복이 아니라 「비준」이라 부르고 있다.", "[주83] 5월 7일과 5월 8일의 군사항복문서(Acts of Military Surrender) 본문은 Department of State Executive Agreement Series No. 502 또는 59 Stat. (pt. 2) 1857 참조."], "primary": "파리, 1945년 5월 7일 오후 10시.\n[접수 5월 7일 — 오후 6시 33분]\n\n2447. 머피(Murphy)로부터 매슈스(Matthews) 앞. 아이젠하워 장군이 연합참모본부에 그의 연합국 사령부에 맡겨진 임무가 이제 완수되었음을 통보하였다. [주83] [머피.]\n\n캐퍼리\n\n[781면]", "secondary": "Paris, May 7, 1945—10 p.m. \n [Received May 7—6:33 p.m.]\n\n2447. From Murphy for Matthews. General Eisenhower has informed Combined Chiefs of Staff that the mission entrusted to his Allied Command has now been completed. [주83] [Murphy.]\n\nCaffery\n\n[781면]", "notes": ["[주83] 1945년 5월 7일 프랑스 랭스(Reims)에서 독일 최고사령부는 연합국원정군최고사령관과 소련 최고사령부에 무조건항복하였다. 모든 독일 군대의 최고 연합국 사령부들에 대한 무조건항복의 비준(ratification)은 1945년 5월 8일 베를린에서 이루어졌다. 5월 7일과 5월 8일의 군사항복문서(Acts of Military Surrender) 본문은 Department of State Executive Agreement Series No. 502 또는 59 Stat. (pt. 2) 1857 참조. 자세한 사정은 Pogue, The Supreme Command, p. 485 참조."], "warn": false, "pages": ["781"], "search": "Jefferson Caffery 캐퍼리 (주프랑스대사) Robert Murphy 머피 (대독일 정치고문) H. Freeman Matthews 매슈스 (국무부 유럽국장) Dwight D. Eisenhower 아이젠하워 (연합국원정군최고사령관)"}, {"id": "d918", "order": 918, "date": "1945-05-07", "group": "D", "eyebrow": "d918 · The Acting Secretary of State to President Truman", "title": "국무장관 대리가 트루먼 대통령에게", "badge": null, "list_right": "문서 918", "meta": [{"k": "일자", "v": "1945-05-07"}, {"k": "시각", "v": "Washington, May 7, 1945."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "Pauley Files", "txt": true}, {"k": "발신", "v": "국무장관 대리 그루(Joseph C. Grew, The Acting Secretary of State)", "txt": true}, {"k": "수신", "v": "트루먼 대통령(President Truman)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "서한"}], "links": [{"k": "FRUS", "text": "문서 918 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d918"}], "summary": "배상 문제에 관한 폴리(Edwin W. Pauley)의 임무와 관련하여, 그의 대외 교섭이 국무장관의 직접 감독 아래 수행되지 않으면 국무장관이 자신의 책무를 제대로 다할 수 없다는 국무부의 견해를 그루가 대통령에게 아뢴 편지이다.", "points": ["그루는 스테티니어스 국무장관이 샌프란시스코에 가 있는 동안, 자신이 아는 장관의 견해를 대통령에게 전하지 않는다면 직무를 소홀히 하는 것이 되리라고 썼다.", "이 문제에 개인적인 쟁점은 전혀 없으며, 폴리도 국무장관과 긴밀히 조화롭게 협력할 뜻임을 확언하였다고 밝혔다. 그러면서도 조직과 절차의 원칙 문제로 몰아간다.", "4월 27일자 위임장은 폴리를 대통령의 개인 대표로 지정하여, 배상 방식과 방법의 탐구·수립·교섭, 다른 이해관계국과의 교섭, 독일배상위원회의 미국 및 대통령 개인 대표, 그리고 관할 사항 전부에 관한 대통령에 대한 직접 보고를 맡겼다.", "그루는 이 훈령이 국무장관의 책무에서 대외교섭의 감독을 떼어 내려는 뜻으로 읽히면 해로운 결과가 나온다고 지적하고, 대통령이 이미 국무장관에게 크림(얄타) 협정의 이행이라는 직접 책임을 맡겼으며 배상은 그 중요한 일부라고 상기시켰다.", "핵심 요구: 배상위원회 미국 대표는 국무장관의 감독 아래 행동하고, 대통령에게 직접 보내는 보고와 동시에 국무장관에게도 보고하며, 대통령의 지휘를 조건으로 국무장관의 훈령을 따르도록 지시되어야 한다는 것이다.", "과거에도 혼란이 일어났으며, 대외 관계에서 미국의 대표가 분산되면 앞으로도 반드시 혼란이 생긴다고 하였다.", "그루는 폴리에게 보내는 훈령에 명확히 하는 조항을 넣는 것을 고려해 보시라고 아뢰면서도, 훈령을 그대로 두기로 결정하신다면 국무부의 모두가 충실하고 기꺼이 그 뜻을 받들겠다고 맺었다.", "[주79] 5월 7일자 대화 비망록에서 그루는, 대통령이 그날 아침 회견에서 이 편지를 건네받고 읽은 뒤 폴리가 떠나기 전에 이 문제를 정리하겠다고 말하였다고 적었다."], "primary": "워싱턴, 1945년 5월 7일.\n\n대통령 각하: 에드윈 W. 폴리(Edwin W. Pauley) 씨와 본부의 관리들 사이에 매우 유익한 회담이 여러 차례 있은 뒤에, 이 편지의 목적은 폴리 씨의 임무에 관하여 우리가 근본적으로 중요하다고 믿는 몇 가지 고려사항을 각하 자신의 뜻과 결정에 온전히 따르면서 크나큰 존경으로 각하의 개인적 유의에 올리는 데 있습니다. 스테티니어스 장관이 자리를 비운 터에 [주76] 제가 그의 견해로 알고 있는 바를 각하께 비추어 드리지 아니한다면 저의 직무를 소홀히 하는 것이 될 것입니다. 그리하여 각하께서 가장 좋다고 생각하시는 어떠한 결정에 이르시든 그에 앞서 이 견해들을 앞에 두시게 하려는 것입니다.\n\n제가 폴리 씨에게 말씀드렸고 또 각하께 확언하고자 하는 바와 같이, 이 문제에는 어떠한 개인적 쟁점도 관련되어 있지 아니합니다. 폴리 씨는 특히 외국과의 교섭이 관련되거나 각하의 지휘 아래 우리 대외정책의 실행과 관계되는 사항에서, 서로 돕는다는 바탕 위에서 국무장관과 긴밀한 조화와 협력 속에 일하겠다는 그의 뜻을 우리에게 확언하였습니다.\n\n따라서 이 편지의 목적은, 제가 말씀드린 바와 같이 국무장관이 그에게 맡겨진 책무를 떠맡고 각하의 지휘 아래 그 임무를 수행하는 데 근본적으로 중요하다고 여기는 몇 가지 조직과 절차의 원칙을 각하 앞에 놓아 드리는 데 있습니다.\n\n4월 27일자 편지에서 [주77] 폴리 씨는, 이번 전쟁에서 침략국들로부터 배상을 받아 내는 방식과 방법을 탐구하고 수립하고 교섭하는 데에서 [1207면] 각하를 대표하고 각하를 돕는 각하의 개인 대표로 지정되었으며, 이 문제에서 다른 이해관계국들을 상대할 때 각하를 대표하고, 독일배상위원회(German Reparations Commission)의 위원으로서 미국과 대통령 개인을 대표하며, 그의 관할에 속하는 모든 사항에 관하여 각하께 직접 보고하도록 되어 있습니다.\n\n저는 각하께서 누구보다 먼저, 이 훈령이 국무장관의 책무로부터 이 중요한 분야에서 각하의 지휘 아래 이루어지는 외국과의 교섭에 대한 감독이나 각하의 검토를 위한 정책과 방법의 정식화 — 이는 필연코 우리 대외정책의 다른 국면들과 긴밀히 통합되어야 합니다 — 를 떼어 내려는 뜻이었다는 어떠한 함축도 해로운 결과를 낳는다는 것을 알아보시리라고 확신합니다. 대통령께서는 사실 국무장관에게, 각하의 지휘 아래 크림 협정 — 배상 문제는 그 중요한 일부입니다 — 을 이행할 직접적인 책임과 임무를 맡기셨습니다.\n\n그렇다면 필연코 다음의 물음이 생깁니다. 곧 배상위원회의 우리 대표가 국무장관의 감독 아래 행동하고, 각하께서 폴리 씨로 하여금 각하께 직접 보내게 하시는 보고와 동시에 국무장관에게도 보고하며, 각하의 지휘를 조건으로 국무장관의 훈령에 따르도록 지시되지 아니하는 한, 국무장관이 이렇게 그에게 부여된 책무와 임무를 온당하고 넉넉하게 수행할 수 있겠는가 하는 것입니다. 과거에도 혼란이 빚어졌거니와, 외국을 상대하는 데에서 미국의 대표가, 그리고 대통령의 지휘 아래 이루어지는 미국 대외관계의 정식화와 감독이 분산된다면 앞으로도 반드시 혼란이 일어날 것입니다.\n\n배상을 포함하여 패전 후 독일의 처리와 관계되는 이러한 책무들을 국무장관은 재무부·육군부·해군부 및 대외경제행정처(Foreign Economic Administration)와 긴밀히 협력하여, 루스벨트 대통령이 준 권한 아래 수행하여 왔으며, 각하께서는 「독일 군정에 관하여 미국 점령군 총사령관에게 내리는 지령」 초안이 각하의 승인을 받고자 제출되었던 4월 27일에 그 권한을 다시 확인하셨습니다. [주78]\n\n모든 대사의 경우와 마찬가지로 폴리 씨는 대통령의 개인 대표입니다. 그러나 다른 대사들의 경우와 같이 폴리 씨의 외국과의 교섭이 국무장관의 직접 감독 아래 — 곧 대통령의 지휘 아래 국무장관이 정식화한 미국의 대외정책을 해석하면서, 그리고 [1208면] 국무장관이 그 진행을 끊임없이 자세히 대통령께 보고하고 모든 중요한 사안마다 대통령의 지침을 구하면서 — 수행되지 아니한다면, 국무장관은 외국 정부와의 교섭 수행에 대한 그의 책무를 다하고 대통령에 대한 그의 임무를 질서 있게 이행하는 데 요구되는 직접적이고 긴요한 권한을 사실상 빼앗기게 되리라는 것이 분명해 보입니다.\n\n위의 고려사항들이 각하의 승인을 받는다면, 각하께서는 폴리 씨에게 내리시는 훈령에 명확히 하는 조항을 넣는 것을 고려하고자 하실 수도 있겠습니다. 그러나 만일 폴리 씨에게 보내는 훈령 편지를 그대로 두는 것이 각하의 결정이시라면, 각하의 뜻이 국무부의 우리 모두에 의하여 충실하고 기꺼이 받들어지리라는 것을 부디 확신하여 주시기 바랍니다. [주79]\n\n충심으로,\n\n조지프 C. 그루", "secondary": "Washington, May 7, 1945.\n\nDear Mr. President: After several very helpful talks between Mr. Edwin W. Pauley and officers of this Department, the purpose of this letter is to bring to your personal attention, with great respect and in full deference to your own wishes and decision, certain considerations regarding Mr. Pauley’s mission which we believe to be of fundamental importance. In the absence of Secretary Stettinius, [주76] I should be remiss were I to fail to reflect to you what I know to be his views, so that you may have these views before you in coming to whatever decision you may think best.\n\nAs I have said to Mr. Pauley and wish to assure you, there is no personal issue whatever involved in this matter. Mr. Pauley has assured us of his intention to work in close harmony and cooperation with the Secretary of State on a basis of mutual helpfulness, especially in matters involving negotiation with foreign countries or having to do with the implementation of our foreign policy under your direction.\n\nThe purpose of this letter, therefore, is to lay before you certain principles of organization and procedure which, as I have said, the Secretary of State regards as of fundamental importance in undertaking the responsibilities and in carrying out the duties, under your direction, with which he is charged.\n\nIn the letter of April 27 [주77] Mr. Pauley is designated as your personal representative to represent and assist you in exploring, developing [1207면] and negotiating the formulae and methods of exacting reparations from the aggressor nations in the current war; to represent you in this matter in dealing with other interested nations; to represent the United States and the President personally as a member of the German Reparations Commission; and on all matters within his jurisdiction to report to you personally.\n\nI am sure that you would be the first to recognize the harmful results of any implication that these instructions were intended to remove from the responsibilities of the Secretary of State the supervision, under your direction, of negotiations with foreign nations in this important field, or the formulation for your consideration of the policies and methods to be employed, which must of necessity be closely integrated with other phases of our foreign policy. The President has, in fact, charged the Secretary of State with the direct responsibility and duty of implementing, under your direction, the Crimean agreements of which the subject of reparations is an important part.\n\nThe question then inevitably arises whether the Secretary of State, unless our representative on the Reparations Commission is directed to act under the supervision of the Secretary, to report to him, simultaneously with such reports as you may wish Mr. Pauley to send directly to you, and to be guided by the Secretary’s instructions subject to your direction, can properly and adequately fulfill the responsibilities and duties thus conferred upon him. Confusion has resulted in the past and would inevitably arise in future if there were to be any diffusion of the representation of the United States in dealing with foreign countries and in the formulation and supervision, under the President’s direction, of the foreign relations of the United States.\n\nThese responsibilities, as they relate to the post-defeat treatment of Germany including reparations, the Secretary of State has been carrying out in close cooperation with the Treasury, War, and Navy Departments and the Foreign Economic Administration under an authorization from President Roosevelt, which you reaffirmed on April 27 at the time the draft “Directive to Commander-in-Chief of United States Forces of Occupation Regarding Military Government in Germany” was submitted to you for your approval. [주78]\n\nAs in the case of all Ambassadors, Mr. Pauley is the personal representative of the President. Yet unless, as in the case of other Ambassadors, Mr. Pauley’s negotiations with foreign countries were to be carried on under the direct supervision of the Secretary of State, interpreting the foreign policy of the United States as formulated by the Secretary under the direction of the President, to whom the [1208면] Secretary would report the proceedings constantly and in detail seeking the President’s guidance on every important issue, it appears to be clear that the Secretary would in effect be deprived of the direct and essential authority called for in the fulfillment of his responsibilities for the conduct of negotiations with foreign governments and in the orderly discharge of his duties to the President.\n\nShould the foregoing considerations meet with your approval, you may wish to consider the insertion of a clarifying clause in your instructions to Mr. Pauley. If however your decision is to leave the letter of instructions to Mr. Pauley as it is, please be assured that your wishes will be loyally and cheerfully observed by all of us in the Department of State. [주79]\n\nFaithfully yours,\n\nJoseph C. Grew", "notes": ["[주76] 스테티니어스 국무장관은 4월 25일부터 6월 26일까지 열린 국제기구에 관한 국제연합회의(샌프란시스코 회의)의 미국 대표단 단장으로 샌프란시스코에 있었다. 이 회의에 관한 문서는 제1권 1면 이하 참조.", "[주77] 9월 14일 폴리 씨가 국무장관에게 보낸 편지에 인용되어 있다. 1290면.", "[주78] 4월 27일자 국무장관 대리의 대화 비망록, 503면 참조.", "[주79] 5월 7일자 대화 비망록에서 그루 국무장관 대리는, 그날 아침 회견에서 이 편지가 대통령에게 건네졌을 때 대통령이 이를 읽고 나서 폴리 씨가 떠나기 전에 이 문제를 정리하겠다고 말하였다고 적었다(740.00119 EW/5–745)."], "warn": false, "pages": ["1207", "1208"], "search": "Joseph C. Grew 그루 (국무장관 대리) Harry S. Truman 트루먼 (대통령) Edwin W. Pauley 폴리 (배상 문제에 관한 대통령 개인 대표) Edward R. Stettinius, Jr. 스테티니어스 (국무장관) Franklin D. Roosevelt 루스벨트 (전 대통령)"}, {"id": "d919", "order": 919, "date": "1945-05-07", "group": "C", "eyebrow": "d919 · Memorandum by Mr. Charles E. Bohlen, Assistant to the Secretary of State, of Conversation Held at San Francisco, May 7, 1945", "title": "국무장관 보좌관 찰스 E. 볼렌의, 1945년 5월 7일 샌프란시스코에서 있었던 대화의 비망록", "badge": null, "list_right": "문서 919", "meta": [{"k": "일자", "v": "1945-05-07"}, {"k": "시각", "v": "San Francisco, May 7, 1945"}, {"k": "장소", "v": "San Francisco", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "500.CC/5–745", "txt": true}, {"k": "발신", "v": "국무장관 보좌관 찰스 E. 볼렌(Charles E. Bohlen, Assistant to the Secretary of State) — 기록자", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "대화 비망록"}], "links": [{"k": "FRUS", "text": "문서 919 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d919"}], "summary": "샌프란시스코에서 몰로토프와 폴리·해리먼이 배상위원회의 착수 시기, 프랑스의 참가, 그리고 소련 점령지대에서 독일 물자와 설비가 러시아로 옮겨지고 있다는 문제를 두고 나눈 대화의 비망록이다.", "points": ["참석자: 몰로토프, 폴리, 해리먼 대사, 볼렌, 그로미코 대사, 파블로프.", "몰로토프는 소련 정부가 배상위원회의 사업을 가장 중요하게 여기며 그것이 곧 시작되기를 바란다고 하였고, 영국이 아직 대표를 임명하지 않았다고 지적하였다.", "폴리는 미국이 자기 점령지대에서 독일 물자나 설비를 요구하는 다른 유럽 나라들의 모든 요청을 거절해 왔다고 하였다. 지대마다 따로 다른 정책을 펴는 것은 잘못이라고 여겼기 때문이다.", "몰로토프는 얄타에서 소련과 미국 대표는 쉽게 합의하였으나 영국과는 어려움이 있었다고 폴리에게 상기시켰다. 연합국 사이의 갈라짐을 소련 쪽에서 짚어 낸 대목이다.", "프랑스 참가에 관하여 해리먼은 프랑스가 독일 통제이사회의 일원이 될 터이니 논리에도 맞고 일도 빨라진다고 하였으나, 몰로토프는 반대하지는 않되 폴란드와 「얄타[유고슬라비아]」도 프랑스 못지않게 대표될 권리가 있다면서 세 나라로 하는 본디의 크림 규정대로 나아가는 것이 최선이라고 하였다.", "가장 날카로운 대목이다. 폴리는 미국 지대에서는 배상 범주에 들 수 있는 어떤 독일 물자도 반출을 허용하지 않고 있는데 소련 지대에서는 독일 물자와 설비가 러시아로 옮겨지고 있다는 보고를 받았다고 말하였다. 연합국끼리의 불신이 직접 터져 나온 대목이다.", "몰로토프는 전쟁 수행에 필요한 것은 무엇이든 가져가고 있는 것으로 안다고 답하였고, 유럽에서 전쟁이 끝났으니 그 필요도 없어졌으리라는 폴리의 말에는 그렇게 빨리 그치지는 않을 것이라며 소련 산업이 이 전쟁에서 매우 크게 입은 손상을 들었다.", "몰로토프는 소련 지대의 반출에 관하여 자세한 정보가 없어 구체적으로 답할 수 없다고 하면서, 위원회가 빨리 일을 시작하면 현재의 반출 문제에 관한 합의된 정책을 만들 수 있을 것이며 개인적으로는 이것이 매우 사소한 문제라고 여긴다고 하였다."], "primary": "샌프란시스코, 1945년 5월 7일\n\n참석: 몰로토프 씨 [주80] · 폴리 씨\n\n해리먼 대사 · 볼렌 씨\n\n그로미코 대사 [주81] · 파블로프 씨 [주82]\n\n**몰로토프 씨** 인사말을 주고받은 뒤에 몰로토프 씨는 폴리 씨가 모스크바로 떠날 예정인지 물었다. 그는 자기 정부가 배상위원회(Reparation Commission)의 사업에 가장 큰 중요성을 두고 있으며 그것이 곧 시작되기를 바란다고 덧붙였다.\n\n**폴리 씨**는 곧 그렇게 되기를 바란다고 대답하고, 국무부와 그 밖의 곳에서 연구가 이루어지고 있으며 배상 문제에 관한 보고서가 대통령에게 제출되었다고 하였다. [주83]\n\n**몰로토프 씨**는 영국이 아직 그들의 대표를 임명하지 아니하였다고 말하였다.\n\n**폴리 씨**는 이어 지금 우리 앞에 놓인, 배상과 관련된 여러 급박한 현안이 있다고 말하였다. 그는 우리 점령지대에서 독일에 대한 세계적 배상정책을 두기로 한 우리의 결정 때문에, 다른 유럽 나라들로부터 우리 사령관들이 받고 있던 [1209면] 독일 물자나 설비에 대한 모든 요구와 요청이 거절되어 왔다고 말하였다. 서로 다른 점령지대에서 따로따로 다른 정책을 펴는 것은 잘못일 것이라고 우리는 여겼기 때문이라고 하였다.\n\n**몰로토프 씨**는 얄타 협정에서 좋은 전반적 바탕이 마련되었으니 필요한 것이라고는 위원회가 일을 시작하는 것뿐이라고 대답하였다.\n\n**폴리 씨**는 얄타에서의 논의를 잘 알고 있다고 대답하였다.\n\n**몰로토프 씨**는 그렇다면 폴리 씨는 얄타에서 소련과 미국의 대표들은 쉽게 합의에 이르렀으나 영국과는 어려움이 있었다는 사실을 알고 있는 것이라고 말하였다.\n\n**폴리 씨**는 모스크바의 위원회가 아주 빨리 완전한 합의에 이를 수 있기를, 그리고 그런 뒤에는 어쩌면 독일로 옮겨 갈 수 있기를 바란다고 말하였다. 평가의 문제라든가 독일 민간인의 최소 필요에 대한 검토와 같이, 현지에서 살펴보는 것이 가장 좋은 실제적 문제가 여럿 있기 때문이라고 하였다. 그러므로 그는 모스크바의 회합이 빨리 끝나고 위원회가 독일 안의 서로 받아들일 만한 어떤 곳으로 옮겨 가기를 바란다고 하였다.\n\n**몰로토프 씨**는 모스크바에서 시작하여 크림 결정의 이행을 밀고 나가야 한다고 여기지만, 그런 뒤에 위원회가 독일로 나아가는 것이 바람직하다고 판단한다면 심각한 반대는 없을 것이라고 말하였다. 그러나 그는 위원회가 모스크바에서 아직 일을 시작조차 하지 아니하였다는 점을 다시 지적하여야 하겠다고 덧붙이고, 폴리 씨가 위원회의 착수를 가로막는 어떤 어려움이라도 보고 있는지 물었다.\n\n**폴리 씨**는 미국 정부에 관한 한 아무 어려움도 없으며 곧 모스크바로 떠날 수 있기를 바란다고 대답하였다.\n\n**해리먼 대사**는 프랑스가 모스크바 위원회에 대표를 보내기를 영국 정부와 미국 정부가 바라고 있음을 언급하였다. 그는 프랑스가 독일 통제이사회의 일원이 될 터이므로 이것이 논리에 맞을 뿐 아니라, 독일에서는 프랑스가 통제이사회의 일원으로서 관여하게 될 것이므로 일을 크게 앞당기기도 하리라고 여긴다고 말하였다. 만일 프랑스가 첫 단계에 대표를 보내지 아니한다면, 모스크바에서 있었던 일에 관하여 프랑스 정부에 장황한 설명을 하여야 하게 될 뿐이라고 하였다.\n\n**몰로토프 씨**는 소련 정부가 프랑스의 참가에 반대하지는 아니하나, 폴란드와 얄타[유고슬라비아]도 프랑스 못지않게 대표될 권리가 있다고 여긴다고 대답하였다. 그는 자기 의견으로는 모스크바 위원회에 세 강국을 두도록 규정한 본디의 크림 규정대로 나아가는 것이 가장 좋겠다고 덧붙였다.\n\n[1210면]\n\n**폴리 씨**는 이어, 우리 점령지대에서는 배상의 범주에 들 수 있는 어떤 독일 물자도 독일 밖으로 이전되지 아니하게 하는 원칙을 채택하고 있는 터에, 소련 점령지대에서는 독일 물자와 설비가 러시아로 옮겨지고 있다는 보고를 받았다고 말하였다.\n\n**몰로토프 씨**는 전쟁 수행에 필요한 것은 무엇이든 가져가고 있는 것으로 짐작한다고 말하였다.\n\n**폴리 씨**는 이제 유럽에서 전쟁이 끝났으니 그 물자와 설비를 반출할 필요도 더는 없으리라고 여긴다고 말하였다.\n\n**몰로토프 씨**는 그 필요가 그렇게 빨리 그치리라고 생각하지 아니한다고 말하고, 미국 정부는 소련이 전시 생산을 계속 유지하는 것이 소련에 중요하다고 여기지 아니하는가고 물었다. 그는 소련 산업이 이번 전쟁 동안 매우 크게 손상을 입었다고 덧붙였다.\n\n**폴리 씨**는 미국 또한 아직 태평양의 전쟁을 이겨야 하므로 큰 필요가 있으나, 그럼에도 통일된 정책을 위하여 우리는 어떠한 독일 물자도 우리 점령지대에서 다른 나라로 옮겨지도록 허용하기를 삼가 왔다고 대답하였다. 그는 그러나 몰로토프 씨의 말로 미루어, 우리 지대의 사령관들이 전쟁에 쓰일 수 있는 물자를 반출하고자 한다면 아무 반대도 없으리라고 짐작한다고 말하였다.\n\n**몰로토프 씨**는 미국 사령관들이 전쟁을 위하여 필요한 것을 가져가고 있는 것으로 짐작한다고 말하였다. 그는 소련 지대에서의 반출에 관하여는 자세한 정보가 없으므로 이 문제에 관하여 어떠한 구체적인 답도 줄 수 없다고 덧붙였다. 그는 위원회가 빨리 일을 시작할 수 있다면 현재의 반출이라는 이 문제에 관하여 합의된 정책을 마련할 수 있으리라고 여기며, 개인적으로는 이것이 매우 사소한 문제라고 생각한다고 덧붙였다.\n\n**폴리 씨**는 끝으로, 준비의 마지막 작업을 마치는 대로 되도록 빨리 떠나기를 바란다고 말하였다.", "secondary": "San Francisco, May 7, 1945\n\nPresent: Mr. Molotov [주80] Mr. Pauley\n\nAmbassador Harriman Mr. Bohlen\n\nAmbassador Gromyko [주81] Mr. Pavlov [주82]\n\nMr. Molotov After an exchange of amenities, Mr. Molotov inquired whether Mr. Pauley expected to leave for Moscow. He added that his Government attached the greatest importance to the work of the Reparation Commission and hoped it would soon get started.\n\nMr. Pauley replied that he hoped it would be soon and that studies were being made in the State Department and elsewhere and a report had been submitted to the President on the subject of Reparations. [주83]\n\nMr. Molotov remarked that the British had not yet appointed their representative.\n\nMr. Pauley then said there were a number of current pressing problems involving reparations which were facing us at this time. He said that because of our decision to have a world reparation policy for Germany in our zones of occupation, all demands and requests for [1209면] German material or equipment which our Commanders were receiving from other European countries had been refused since we felt it would be a mistake to pursue separate policies in the different zones of occupation.\n\nMr. Molotov replied that a good overall basis had been established in the Yalta Agreement and all that was necessary was for the Commission to get to work.\n\nMr. Pauley replied that he was familiar with the discussions at Yalta.\n\nMr. Molotov then said in that case Mr. Pauley was aware of the fact that the Soviet and American representatives at Yalta found it easy to agree but that there had been difficulties with the British.\n\nMr. Pauley said that he hoped that the Commission in Moscow could come to a complete agreement very quickly and then possibly move into Germany because there were a number of practical questions which could be best examined on the spot such as the problem of evaluation and the consideration of the minimum needs of the German civilian population. He, therefore, hoped that the meeting in Moscow could be completed quickly and the Commission adjourned to some mutually acceptable place in Germany.\n\nMr. Molotov said that he felt they should start in Moscow and get on with the implementation of the Crimea decision but that if the Commission then considered it desirable to proceed to Germany there would be no serious objection. He added, however, that he must again point out that the Commission had not even started its work in Moscow and inquired whether Mr. Pauley saw any difficulties in the way of the Commission getting to work.\n\nMr. Pauley replied that in so far as the U.S. Government was concerned there were no difficulties and he hoped that soon he could start for Moscow.\n\nAmbassador Harriman mentioned the desire of the British and American Governments to have France represented on the Moscow Commission. He said that this was not only logical since France was to be a member of the Control Council for Germany, but he felt it would also speed the work very much since in Germany itself France would be involved as a member of the Control Council. If France was not represented at the first phase it would only mean that long explanations of what had happened in Moscow would have to be given to the French Government.\n\nMr. Molotov replied that the Soviet Government was not against French participation but felt that Poland and Yalta [Yugoslavia] had no less right to be represented than France. He added that in his opinion, it would be best to go forward on the original Crimea provision which provided for the three powers on the Moscow Commission.\n\n[1210면]\n\nMr. Pauley then said that while in our zones we were adopting the principle of not allowing any German material which might fall in the category of reparations to be transferred from Germany, we had reports that in the Soviet Zone, German material and equipment were being moved to Russia.\n\nMr. Molotov said that he assumed that whatever was needed for the prosecution of the war was being taken.\n\nMr. Pauley said that now that the war in Europe was over he presumed that the need to remove this material and equipment would no longer be present.\n\nMr. Molotov said he did not think the need would stop as quickly as that and inquired whether the U.S. Government did not think it was important to the Soviet Union to keep up its war production. He added that the Soviet industry had suffered very greatly during this war.\n\nMr. Pauley replied that the U.S. also had great need since it still had the war in the Pacific to win but nevertheless for the sake of unified policy we had refrained from allowing any German material to be moved from our zone of occupation to other countries. He said he assumed from Mr. Molotov’s remarks that there would be no objection, however, if the Commanders in our zone desired to remove material which could be used for the war.\n\nMr. Molotov said he assumed the U.S. Commanders were taking what they needed for war. He added that in regard to removal in the Soviet zone, he had no detailed information and, therefore, could not give any concrete answers on the subject. He added that he felt if the Commission could get to work quickly they could work out an agreed policy on this question of present removals which he personally felt was a very small matter.\n\nMr. Pauley in conclusion said that he hoped to leave as soon as he could complete the final work of preparation.", "notes": ["[주80] 몰로토프 씨는 국제기구에 관한 국제연합회의의 소련 대표단 단장이었다.", "[주81] 안드레이 안드레예비치 그로미코(Andrey Andreyevich Gromyko), 주미 소련대사로서 국제기구에 관한 국제연합회의 소련 대표단의 일원이었다.", "[주82] 블라디미르 니콜라예비치 파블로프(Vladimir Nikolayevich Pavlov), 소련 인민위원회의 의장 스탈린 원수의 개인 비서 겸 통역.", "[주83] 1945년 5월 18일자 배상에 관한 연합국위원회 미국 대표를 위한 훈령, 1222면 참조."], "warn": false, "pages": ["1209", "1210"], "search": "Charles E. Bohlen 볼렌 (국무장관 보좌관, 이 비망록의 기록자) Vyacheslav M. Molotov 몰로토프 (소련 외무인민위원, 소련 대표단 단장) Edwin W. Pauley 폴리 (배상 문제에 관한 대통령 개인 대표) W. Averell Harriman 해리먼 (주소련 대사) Andrey A. Gromyko 그로미코 (주미 소련대사) Vladimir N. Pavlov 파블로프 (스탈린의 개인 비서 겸 통역) Joseph Stalin 스탈린 (각주)"}, {"id": "d93", "order": 93, "date": "1945-05-08", "group": "A", "eyebrow": "d93 · The Acting Secretary of State to the Chargé in the Soviet Union (Kennan)", "title": "국무장관 대리가 주소련 대리대사(케넌)에게", "badge": null, "list_right": "문서 93", "meta": [{"k": "일자", "v": "1945-05-08"}, {"k": "시각", "v": "Washington, May 8, 1945—7 p.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "1035 (런던에 3622번, 파리에 1941번, 에르하르트에게 전하도록 카세르타에 446번으로 반복 발신)"}, {"k": "원문출처", "v": "863.01/5–845: Telegram", "txt": true}, {"k": "발신", "v": "국무장관 대리 그루(Joseph C. Grew, The Acting Secretary of State)", "txt": true}, {"k": "수신", "v": "주소련 대리대사 케넌(George F. Kennan, The Chargé in the Soviet Union)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 93 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d93"}], "summary": "오스트리아 문제를 다룬다. 소련이 협의 없이 오스트리아 전체를 대표한다고 주장하는 정부의 수립을 허용한 데 대한 항의, 그리고 빈의 점령지대 획정에서 다섯 비행장을 모두 소련 지대에 두려는 주장에 대한 반박을 소련 정부에 전하도록 지시한 전보이다.", "points": ["미국이 이의를 제기한 것은 붉은군대 점령지역에 현지인 행정을 두는 것 자체가 아니라, 소련 정부가 우리와 미리 협의하지 않은 채 미군 점령지역을 포함한 오스트리아 전체를 대표한다고 주장하는 정부의 수립을 허용한 데 있다고 못 박는다.", "실효 있는 협의는 연합국 대표들이 빈에 도착하여 공동 통제가 시작될 때에야 비로소 가능하다고 하였다.", "그때까지 각 점령국이 자기가 소탕한 지역을 홀로 관리하는 동안, 미국은 물론 빈 지역에서 취해지는 조치와 관련이 없으며 그에 대한 아무 책임도 지지 않는다고 하였다.", "빈의 다섯 비행장을 모두 소련 지대에 두게 될 지대 획정 주장은 「부당하고 설명할 수 없는 것(unreasonable and inexplicable)」으로 보이며, 소련 정부가 이 태도를 고집한다면 그것이 협정의 완결을 늦추고자 하는 것이라고 결론지을 수밖에 없다고 하였다. 이 묶음에서 미국이 소련의 의도를 가장 직설로 의심한 대목 가운데 하나이다.", "비신스키는 연합국 대표들이 지대가 유럽자문위원회에서 합의된 뒤에야 빈에 와야 한다고 밝혔는데, 이는 그의 앞선 편지와 대표들이 빈에 가서 지대를 정하자던 스탈린 원수 자신의 본디 제안을 뒤집는 것이라고 지적하였다.", "빈의 지대 획정을 현지 조사 없이 베를린처럼 할 수 있으리라는 비신스키의 제안에 대하여, 다른 세 대표는 이미 오래전부터 바로 그렇게 할 준비가 되어 있었으며 이를 거부해 온 것은 오직 소련 정부뿐이라고 반박한다. 소련은 1945년의 빈이 아니라 1938년의 빈을 나누려 한다는 것이다.", "연합국 사이의 협의가 있기까지는 어떠한 정부도 미군 점령지역을 포함한 오스트리아 전체를 대표하는 것으로 볼 수 없다고 끝맺는다."], "primary": "워싱턴, 1945년 5월 8일 오후 7시.\n\n1035. 귀하의 5월 3일 오후 10시자 1453호. 소련 정부에, 우리가 소련 점령지역 오스트리아에서 현지인에 의한 행정의 필요를 설명한 비신스키(Vyshinski)의 편지에 유의하였음을 알리고, 아울러 이 기회에 오스트리아에서의 사태 전개를 다음과 같이 되짚어 보고자 한다는 뜻을 전하기 바란다.\n\n우리는 붉은군대가 점령한 지역에 어떤 형태로든 토착 현지 행정을 둘 필요가 있음을 충분히 인정한다. 미군이 점령한 지역에서도 우리가 그것이 바람직하다고 여겨 온 바와 같다. 그것에 이의를 제기하려는 것이 우리의 뜻이 아니었으며, 우리가 이의를 제기한 것은 소련 정부가 우리와 미리 협의하지 아니한 채 미군이 점령한 지역을 포함하여 오스트리아 전체를 대표한다고 주장하는 정부의 수립을 허용한 데 대한 것이었다. 실효 있는 협의는 연합국 대표들이 빈에 도착하여 공동 통제가 시작되었을 때에야 비로소 가능할 것이다.\n\n그때까지는, 각 점령국이 자기가 소탕한 지역을 홀로 관리하고 있는 동안, 미국은 물론 빈 지역에서 취하여지는 조치와 관련되지 아니하며 그에 대한 어떠한 책임도 지지 아니한다. 미국은 공동 통제의 시기에 연합국위원회가 기능하기 시작할 때 오스트리아 임시 국민정부의 문제를 기꺼이 검토할 것이다.\n\n오스트리아 전역의 점령이 지금 매우 빠르게 진행되고 있으므로, 지금 유럽자문위원회(EAC)에 계류 중인 통제기구 및 점령지대에 관한 완전한 의정서들이 합의되는 대로 곧 그것을 발효시키는 것이 바람직해질 수도 있다.\n\n[118면]\n\n유럽자문위원회의 미국 대표는 이미 빈에서 미국의 지대 획정상의 필요를, 전투의 피해를 입은 뒤 지대로 나눌 지역의 실제 상태를 현지에서 살펴보지 아니하고 서술할 수 있는 한도 안에서 잘[weir, sic] 밝혀 두었다. 이러한 요구사항들은 전적으로 합리적이며 정당한 것으로 보인다. 알맞은 비행장과 그 부속 시설은 우리 통신의 독자성을 보장하고 빈에 주둔하는 우리 병력의 유지를 가능하게 하기 위하여 반드시 빈의 미국 지대의 필수 부분이 되어야 한다. 따라서 빈의 다섯 비행장을 모두 소련 지대에 두게 될 지대 획정을 고집하는 것은 우리에게 부당하고 설명할 수 없는 일로 보이며, 소련 정부가 이러한 태도를 고집한다면 우리는 소련 정부가 협정의 완결을 늦추고자 한다고 결론지을 수밖에 없을 것이다.\n\n우리는 이제 (대사관의 5월 7일 오후 8시자 1490호) 연합국 대표들이 유럽자문위원회에서 지대들이 합의된 뒤에야 빈에 도착하여야 한다는 비신스키의 진술을 받았다. 이는 그의 앞선 편지와, 대표들이 빈으로 가서 지대를 정하도록 하자던 스탈린 원수의 본디 제안을 뒤집는 것이다.\n\n비신스키는 유럽자문위원회가 베를린에 대하여 그리하였듯이 현지 조사 없이 빈을 지대로 나누는 것이 가능하여야 한다고 말한다. 유럽자문위원회의 다른 세 대표는 모두 얼마 전부터 바로 그렇게 할 — 곧 「대베를린(Greater Berlin)」이 나누어진 것과 똑같이 「대빈(Greater Vienna)」이라고 알려진 현재의 수도를 나눌 — 준비가 되어 있었다. 이를 거부하면서 그 대신 1945년의 빈이 아니라 1938년의 빈을 나누려고 해 온 것은 오직 소련 정부뿐이다.\n\n소련 정부가 소련 대표에게, 미국 지대 안의 비행장을 포함하여 그곳 모든 점령군의 정당한 필요를 충족시킬 오늘날의 수도 「대빈」의 분할에 이를 만큼의 충분한 재량을 줌으로써 유럽자문위원회에서 지대 획정 작업을 다시 시작할 수 있게 하지 아니하는 한, 유럽자문위원회에서 합의에 이르기는 어렵다.\n\n그동안, 연합국 사이의 협의가 있기까지는 어떠한 정부도 미군이 점령한 지역을 포함하여 오스트리아 전체를 대표하는 것으로 볼 수 없다.\n\n모스크바에 국무부 1035호로 발신하고, 런던에 3622호로, 파리에 1941호로, 에르하르트(Erhardt)에게 전하도록 카세르타에 446호로 반복 발신하였다.\n\n그루", "secondary": "Washington, May 8, 1945—7 p.m.\n\n1035. Your 1453, May 3, 10 p.m. Please inform the Soviet Government that we have noted Vyshinski’s letter explaining the need for an administration of local persons in the Soviet-occupied area of Austria, and wish to take this occasion to review developments in Austria as follows:\n\nWe fully appreciate the need to have some native local administration in the areas occupied by the Red Army, as we have found desirable in areas occupied by the American Army. It was not our intention to object to this but rather to the Soviet Government’s permitting the establishment of a government claiming to represent all of Austria, including areas occupied by U.S. forces, without prior consultation with us. Effective consultation will be possible only when Allied representatives have arrived in Vienna and joint control has begun.\n\nUntil then, while each occupying power is administering alone the area it has cleared, the United States is of course not associated with, and accepts no responsibility for, measures taken in the Vienna area. It will be glad to consider the question of a provisional Austrian national government when the Allied Commission begins to function in the period of joint control.\n\nThe occupation of all of Austria is now proceeding so rapidly that it may soon become desirable to place in effect the complete protocols on control machinery and zones of occupation now pending in EAC as soon as they can be agreed.\n\n[118면]\n\nThe American representative in EAC has already stated the zoning needs of the United States in Vienna as weir as they can be described without examining on the spot the actual condition of the area to be zoned following the damage of battle. These requirements appear to be entirely reasonable and justified. A suitable airport with supporting facilities must be an integral part of the U.S. zone in Vienna to assure our independence of communications and make possible the maintenance of our forces in Vienna. Insistence on zoning which would place all five Vienna airdromes in the Soviet zone thus seems to us unreasonable and inexplicable, and were the Soviet Government to persist in this attitude we could only conclude that it desired to delay completion of the agreements.\n\nWe have now received (Embassy’s 1490 May 7, 8 p.m.) Vyshinski’s statement that Allied representatives should not arrive in Vienna until after the zones have been agreed in EAC, thus reversing this earlier letter and Marshal Stalin’s original suggestion that the representatives proceed to Vienna to establish the zones.\n\nVyshinski suggests it should be possible for EAC to zone Vienna as it did Berlin without examination on the spot. All three of the other representatives in EAC have for some time been prepared to do just this, i.e., subdivide the present capital, known as “Greater Vienna” just as “Greater Berlin” was subdivided. It is the Soviet Government alone which has been refusing to do this, seeking instead to subdivide the Vienna of 1938 rather than the Vienna of 1945.\n\nUnless the Soviet Government will make it possible to resume the work on zoning in EAC by giving the Soviet representative sufficient latitude to arrive at a subdivision of the present-day capital “Greater Vienna” which will satisfy the legitimate needs of all the occupation forces there, including an airdrome in the U.S. zone, it is difficult to arrive at agreement in EAC.\n\nMeanwhile, pending consultation among the Allies no government can be considered to represent all of Austria including areas occupied by U.S. forces.\n\nSent to Moscow as Department’s no. 1035; repeated to London as no. 3622; to Paris as no. 1941, and to Caserta for Erhardt as no. 446.\n\nGrew", "notes": [], "warn": false, "pages": ["118"], "search": "Joseph C. Grew 그루 (국무장관 대리) George F. Kennan 케넌 (주소련 대리대사) Andrey Y. Vyshinski 비신스키 (소련 외무인민위원 대리) Joseph Stalin 스탈린 John G. Erhardt 에르하르트 (카세르타)"}, {"id": "d224", "order": 224, "date": "1945-05-08", "group": "A", "eyebrow": "d224 · The Ambassador in the United Kingdom (Winant) to the Secretary of State", "title": "주영대사(위넌트)가 국무장관에게", "badge": null, "list_right": "문서 224", "meta": [{"k": "일자", "v": "1945-05-08"}, {"k": "시각", "v": "London, May 8, 1945—6 p.m. [Received May 9—3:32 p.m.]"}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "4657 (Cornea 232)"}, {"k": "원문출처", "v": "740.00119 EAC/5–845: Telegram", "txt": true}, {"k": "발신", "v": "주영대사 위넌트(John G. Winant, The Ambassador in the United Kingdom)", "txt": true}, {"k": "수신", "v": "국무장관(The Secretary of State)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 224 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d224"}], "summary": "독일 통제기구에 관한 즉각적인 공개 성명을 낼 것인가를 두고 구세프와 급히 협의한 결과를 보고한 전보로, 구세프는 붉은군대에 맞선 적대행위가 아직 계속되는 마당에 그것은 이르며 항복선언이 먼저 나와야 한다고 하였다.", "points": ["국무부의 5월 7일 오후 5시자 3582호를 받고 위넌트는 독일 통제기구 조치에 관한 즉각적인 공개 성명 문제로 구세프와 급히 협의하였다.", "구세프는 위넌트가 5월 4일 이 문제를 꺼낸 뒤로 본국 정부와 협의해 두었다.", "구세프는 자기가 아는 바로는 붉은군대에 맞선 적대행위가 아직 계속되고 있으므로, 얄타 코뮈니케에 담긴 통제기구에 관한 서술을 넘어서는 것은 아직 이르다고 강하게 여긴다고 하였다. 5월 8일 저녁, 곧 서방이 이미 전승을 발표한 시점에도 소련은 전쟁이 끝나지 않았다는 입장을 유지하고 있었다.", "구세프는 또 거의 완성된 연합국 선언(Allied declaration)이 통제기구에 관한 어떠한 추가 성명보다도 먼저 나와야 한다고 여겼다. 발표의 순서 자체가 쟁점이었다.", "구세프는 통제기구에 관한 그러한 성명은 제안된 독일 항복에 관한 연합국 선언이 나온 바로 뒤에 이어져야 한다고 믿는다고 하였다.", "위넌트는 이튿날까지 네 강국 모두의 완전한 합의로 그 선언을 완성하기를 바란다고 하였다."], "primary": "런던, 1945년 5월 8일 오후 6시.\n[접수 5월 9일 — 오후 3시 32분]\n\n4657. Cornea 232. 국무부의 5월 7일 오후 5시자 3582호를 받고, 나는 독일에 관한 통제기구 조치에 대한 즉각적인 공개 성명 문제로 구세프와 급히 협의하였다. 구세프는 내가 5월 4일 이 문제를 제기한 뒤로 자기 정부와 협의해 왔다. 그는 자기가 아는 바로는 붉은군대에 맞선 적대행위가 아직 계속되고 있는 터에, 얄타 코뮈니케에 담긴 통제기구에 관한 서술을 넘어서는 것은 아직 이르다고 강하게 여긴다. [주31] 그는 또 거의 완성된 연합국 선언이 통제기구에 관한 어떠한 추가 성명보다도 먼저 발표되어야 한다고 여긴다. 그는 또한 통제기구에 관한 그러한 성명이 제안된 독일 항복에 관한 연합국 선언이 나온 바로 뒤에 이어져야 한다고 믿는다는 뜻을 밝혔다. 나는 네 강국 모두의 완전한 합의로 그 선언을 내일까지 완성하기를 바란다.\n\n위넌트", "secondary": "London, May 8, 1945—6 p.m. \n [Received May 9—3:32 p.m.]\n\n4657. Cornea 232. On receiving Department’s 3582, May 7, 5 p.m., I consulted Gousev urgently about an immediate public statement on control machinery arrangements for Germany. Gousev has consulted his Government since I raised the question on May 4. He feels strongly that while hostilities are still continuing against the Red Army according to his information, it is premature to go beyond the statement on control machinery contained in the Yalta Communiqué. [주31] He also feels that the Allied declaration which is nearly completed should be issued prior to any additional statement on control machinery. He also stated his belief that such a statement on control machinery should follow very shortly upon issuance of the proposed Allied declaration on German surrender. I hope to complete the declaration, with full agreement by all four powers, by tomorrow.\n\nWinant", "notes": ["[주31] Conferences at Malta and Yalta, 1945, p. 970."], "warn": false, "pages": [], "search": "John G. Winant 위넌트 (주영대사, 유럽자문위원회 미국 대표) Fedor T. Gousev 구세프 (유럽자문위원회 소련 대표)"}, {"id": "d225", "order": 225, "date": "1945-05-08", "group": "A", "eyebrow": "d225 · The Acting Secretary of State to the United States Political Adviser for Germany (Murphy)  Sent through the American Embassy at Paris. The Mission of the United States Political Adviser for Germany was located at SHAEF Main, Versailles.", "title": "국무장관 대리가 대독일 미국 정치고문(머피)에게", "badge": null, "list_right": "문서 225", "meta": [{"k": "일자", "v": "1945-05-08"}, {"k": "시각", "v": "Washington, May 8, 1945—7 p.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "1935 (에르하르트에게 전하도록 카세르타에 443호로 반복 발신)"}, {"k": "원문출처", "v": "740.0011 EW/5–845: Telegram", "txt": true}, {"k": "발신", "v": "국무장관 대리 그루(Joseph C. Grew, The Acting Secretary of State)", "txt": true}, {"k": "수신", "v": "대독일 미국 정치고문 머피(Robert Murphy, The United States Political Adviser for Germany)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 225 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d225"}], "summary": "소련이 미군을 붙들어 두고 남은 적 점령지를 되도록 많이 차지한 뒤 그 점령 사실을 유럽에서의 정치적 목적에 이용하려 한다고 보고, 군사 당국이 경계선을 정할 때 이러한 정치적 고려를 염두에 두게 하라고 지시한 전보이다.", "points": ["국무부는 러시아 측이 우리 군대를 뒤로 물러서 있게 하는 동안 소련군이 남은 적 점령지를 되도록 많이 차지하려 애쓰는 것으로 보이며, 그런 뒤 소련 점령이라는 사실을 유럽에서 러시아의 정치적 목적을 밀고 나가는 데 이용하고 있다고 본다. 미국 정부가 소련의 의도를 명시적으로 의심한 문서이다.", "그리고 먼저 차지하였다는 것을 근거로 삼아 전후 협력을 위한 온당한 편의를 우리에게 주는 데 동의하기를 거부하고 있다고 하였다.", "실례로, 빈을 국제적 점령을 위하여 나누는 데에서 다섯 비행장 가운데 어느 것도, 또 알맞은 병력 휴양지도 다른 연합국 어느 쪽에도 배정하기를 지금 거부하고 있다는 점을 들었다.", "또한 우리의 군·민 대표가 지대로 나눌 지역을 조사하러 빈에 가는 것도, 체코슬로바키아 정부와 연락하러 코시체에 가는 것도 허용하기를 거부하였다고 하였다.", "서로 다가가고 있는 소련군과 연합군 사이의 경계선 획정은 본디 군사 당국이 군사적 고려에 따라 우선적으로 결정하여야 할 문제라고 인정하면서도, 국무부는 머피와 에르하르트가 이러한 정치적 고려를 군사 당국 앞에 계속 놓아 두기를 바란다고 하였다.", "곧 우리 군대가 남은 적 지역을 얼마나 점령하는가에 따라, 적대행위 종식 후의 점령과 소련 당국과의 그 밖의 관계에서 이러한 심각한 장애를 줄이는 데 도움이 될 수 있다는 점을 지적하라는 것이다. 전투가 끝나기도 전에 전후의 지분을 계산하고 있다."], "primary": "워싱턴, 1945년 5월 8일 오후 7시.\n\n1935. 러시아 측은 소련군이 아직 적의 수중에 남아 있는 영토를 되도록 많이 점령하는 동안 우리 군대는 뒤로 물러나 있게 하려고 애쓰는 것으로 보이며, 그런 다음 소련이 점령하였다는 사실을 유럽에서 러시아의 정치적 목적을 밀고 나가는 데 이용하면서, 먼저 차지하였다는 것을 근거로 전후 협력을 위한 온당한 편의를 우리에게 주는 데 동의하기를 거부하고 있다. 예를 들어 그들은 국제적 점령을 위하여 빈을 나누려는 계획에서 다섯 비행장 가운데 어느 하나도, 또 알맞은 병력 휴양지도 다른 어느 연합국에게 배정하는 데 지금 동의하기를 거부하고 있으며, 우리의 군·민 대표가 지대로 나눌 지역을 조사하러 빈에 가는 것도, 체코슬로바키아 정부와 연락하러 코시체(Kosice)에 가는 것도 허용하기를 거부하여 왔다.\n\n서로 다가가고 있는 소련군과 연합군 사이의 경계선 획정은 물론 본디 군사 당국이 군사적 고려에 따라 우선적으로 결정하여야 할 문제이기는 하나, [282면] 국무부는 군사 당국이 이러한 결정을 내릴 때 머피와 에르하르트가 이러한 정치적 고려를 그들 앞에 계속 놓아 두기를 바란다. 곧 우리 군대가 아직 적의 수중에 남아 있는 영토를 어느 정도까지 점령하는가에 따라, 적대행위 종식 후의 우리 점령과 소련 당국과의 그 밖의 관계에서 이와 같은 심각한 장애를 최소한으로 줄이는 데 도움이 될 수 있다는 점을 지적하기 바란다.\n\n에르하르트에게 전하도록 카세르타에 443호로 반복 발신하였다.\n\n그루", "secondary": "Washington, May 8, 1945—7 p.m.\n\n1935. The Russians apparently endeavor to have our armies hold back while Soviet troops occupy as much as possible of the remaining enemy-held territory, and then use the fact of Soviet occupation to further Russian political aims in Europe, refusing on the basis of prior possession to agree to accord us proper facilities for post-war cooperation. As examples, they are now refusing to agree to allot any of the five Vienna airfields or adequate troop recreation areas to any of the other Allies in the projected subdivision of Vienna for international occupation and have refused to permit our military and civil representatives to go to Vienna to survey the areas to be zoned, or to Kosice to communicate with the Czechoslovak Government.\n\nWhile the demarcation of lines between the Soviet and Allied forces now approaching each other is a question which must naturally be decided primarily on military considerations by military authorities, [282면] the Department hopes that as the latter make these decisions Murphy and Erhardt will keep these political considerations before them, pointing out that the extent to which our own troops occupy the remaining enemy territory may help to minimize serious handicaps like these in our post-hostilities occupation and other relations with the Soviet authorities.\n\nRepeated to Caserta for Erhardt as No. 443.\n\nGrew", "notes": ["[주32] 파리 주재 미국 대사관을 거쳐 발송되었다. 대독일 미국 정치고문실은 베르사유의 연합국원정군최고사령부 본부(SHAEF Main)에 있었다."], "warn": false, "pages": ["282"], "search": "Joseph C. Grew 그루 (국무장관 대리) Robert Murphy 머피 (대독일 미국 정치고문) John G. Erhardt 에르하르트 (카세르타)"}, {"id": "d920", "order": 920, "date": "1945-05-08", "group": "A", "eyebrow": "d920 · The Chargé in the Soviet Union (Kennan) to the Secretary of State", "title": "주소련 대리대사(케넌)가 국무장관에게", "badge": null, "list_right": "문서 920", "meta": [{"k": "일자", "v": "1945-05-08"}, {"k": "시각", "v": "Moscow, May 8, 1945—midnight. [Received May 8—6:50 a.m.]"}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": "1516 (파리에 109호로 반복 발신)"}, {"k": "원문출처", "v": "740.00119 E.W./5–845: Telegram", "txt": true}, {"k": "발신", "v": "주소련 대리대사 케넌(George F. Kennan, The Chargé in the Soviet Union)", "txt": true}, {"k": "수신", "v": "국무장관(The Secretary of State)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 920 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d920"}], "summary": "배상위원회에 폴란드 대표를 받아들이는 문제에 관하여 영국 대리대사 로버츠가 비신스키의 5월 2일자 편지에 답한 내용을 보고한 전보이다.", "points": ["로버츠는 비신스키의 5월 2일자 편지에 답하여, 이 단계에서 영국 정부가 배상위원회에 폴란드 대표를 받아들이지 못하게 하는 이유들을 소련 정부가 알고 있다고 밝혔다.", "설령 위원회가 열릴 때까지 받아들일 만한 폴란드 정부가 세워졌다 하더라도, 영국 정부는 폴란드와 유고슬라비아가 대표되는 반면 노르웨이·그리스·네덜란드처럼 그 청구가 그에 못지않게 정당하다고 영국 정부가 여기는 다른 나라들은 배제되는 위원회의 사업에 참가하는 데 동의할 수 없다고 하였다.", "따라서 영국 정부는 독일을 통제하게 될 네 강국만이 위원회에 처음부터 대표를 두어야 한다는 견해를 그대로 지킨다고 하였다. 프랑스의 참가를 지지하는 앞선 영·미의 입장(d919 해리먼의 발언)과 이어지는 논리이다.", "이 전보의 시각 표기는 발신 5월 8일 자정, 접수 5월 8일 오전 6시 50분으로, 접수가 발신보다 앞선 것처럼 적혀 있다(모스크바 시간과 워싱턴 시간의 차이)."], "primary": "모스크바, 1945년 5월 8일 자정.\n[접수 5월 8일 — 오전 6시 50분]\n\n1516. 대사관 5월 4일 오후 2시자 1458호 참조. 로버츠(Roberts)가 비신스키의 5월 2일자 편지에 답하여, 이 단계에서 영국 정부가 배상위원회에 폴란드 대표를 받아들이지 못하게 하는 이유들을 소련 정부가 알고 있다고 밝혔다. 설령 위원회가 열릴 때까지 받아들일 만한 폴란드 정부가 세워졌다 하더라도, 영국 정부는 폴란드와 유고슬라비아가 대표되는 한편 [1211면] 노르웨이·그리스·네덜란드와 같이 그 청구가 그에 못지아니하게 정당하다고 영국 정부가 여기는 다른 나라들은 배제되는 그러한 위원회의 사업에 참가하는 데 동의할 수 없다고 하였다. 따라서 영국 정부는 독일을 통제하게 될 네 강국만이 위원회에 처음부터 대표를 두어야 한다는 견해를 그대로 지킨다고 하였다.\n\n국무부에 1516호로 발신하고, 파리에 109호로 반복 발신하였다.\n\n케넌", "secondary": "Moscow, May 8, 1945—midnight. \n [Received May 8—6:50 a.m.]\n\n1516. ReEmbtel 1458, May 4, 2 p.m. Roberts has replied to Vyshinski’s letter of May 2 stating that the Soviet Government is aware of the reasons which prevent the British Government from accepting a Polish representative on the Reparations Commission at this stage. Even if an acceptable Polish Government had been formed by the time the Commission met, the British Government could not agree to participate in the work of a commission where Poland and Yugoslavia were represented while other countries like [1211면] Norway, Greece and the Netherlands, whose claims the British Government considered no less good, were excluded. The British Government accordingly adhered to its view that only the four powers who will be controlling Germany should have initial representation on the Commission.\n\nSent to Department as 1516; repeated to Paris as 109.\n\nKennan", "notes": [], "warn": false, "pages": ["1211"], "search": "George F. Kennan 케넌 (주소련 대리대사) Frank K. Roberts 로버츠 (주소련 영국 대리대사) Andrey Y. Vyshinski 비신스키 (소련 외무인민위원 대리)"}, {"id": "d226", "order": 226, "date": "1945-05-09", "group": "A", "eyebrow": "d226 · The Acting Secretary of State to the Ambassador in the United Kingdom (Winant)  Telegram 1950, May 9, 3 p.m., to the Ambassador in France repeated the substance of this telegram and asked the United States Political Adviser for Germany for any information he could supply on the surrender instrument (740.00119 EW/5–445).", "title": "국무장관 대리가 주영대사(위넌트)에게", "badge": null, "list_right": "문서 226", "meta": [{"k": "일자", "v": "1945-05-09"}, {"k": "시각", "v": "Washington, May 9, 1945—3 p.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "3630"}, {"k": "원문출처", "v": "740.00119 EW/5–645: Telegram", "txt": true}, {"k": "발신", "v": "국무장관 대리 그루(Joseph C. Grew, The Acting Secretary of State)", "txt": true}, {"k": "수신", "v": "주영대사 위넌트(John G. Winant, The Ambassador in the United Kingdom)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 226 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d226"}], "summary": "유럽자문위원회에서 교섭되고 각국 정부의 승인을 받은 항복문서가 어찌하여 5월 8일 베를린의 서명에 쓰이지 않았는지, 앞으로 그것을 어떻게 활용할 것인지 급히 회신하라고 위넌트에게 재촉한 전보이다.", "points": ["국무부는 위넌트의 5월 6일 오후 4시자 4600호 사본을 대통령과 마셜 장군에게 즉시 전달하였다.", "런던에서 항복 요건에 관하여 완전한 조율과 합의가 이루어졌다는 소식은 반가웠으나, 그 뒤의 정보를 애타게 기다려 왔다고 하였다. 워싱턴이 항복문서의 실제 사정을 모르고 있었음을 드러낸다.", "위넌트와 총리 및 베델 스미스 장군 사이의 대화 요지를, 그리고 유럽자문위원회에서 위넌트가 교섭하고 각국 정부가 승인한 항복문서를 활용하기 위하여 어떤 조치가 상정되어 있는지를 급히 타전하라고 요청하였다.", "육군부는 그 항복문서의 사용에 관하여, 또는 어제 베를린에서의 서명에 그것이 쓰이지 않은 까닭에 관하여 아무런 정보도 갖고 있지 않다고 밝혔다. 국무부도 육군부도 실제로 서명된 문서가 무엇인지 파악하지 못하고 있었다.", "머피가 5월 4일 파리에서, 위넌트에게 그 본문을 요청하고 있으며 영국 외무부가 사본을 연합국원정군최고사령부에 보내고 있다고 알려 왔다고 상기시켰다.", "[주34] 5월 9일 오후 3시자 주프랑스대사 앞 1950호 전보는 이 전보의 요지를 되풀이하면서, 대독일 미국 정치고문에게 항복문서에 관하여 제공할 수 있는 정보가 있으면 알려 달라고 요청하였다."], "primary": "워싱턴, 1945년 5월 9일 오후 3시.\n\n3630. 우리는 귀하의 5월 6일 오후 4시자 4600호의 사본을 대통령과 마셜(Marshall) 장군에게 즉시 전달하였다. 런던에서 항복 요건에 관하여 완전한 조율과 합의가 이루어졌다는 소식을 듣고 우리는 기뻤으나, 이 문제에 관한 그 뒤의 정보를 애타게 기다려 왔다.\n\n귀하와 총리 및 베델 스미스(Bedell Smith) 장군 사이의 대화의 요지를, 그리고 귀하가 유럽자문위원회에서 교섭하고 각국 정부가 승인한 항복문서(surrender instrument)를 활용하기 위하여 어떤 조치가 상정되어 있는지를 긴급히 타전하기 바란다. 육군부는 그 항복문서의 사용에 관하여, 또는 어찌하여 그것이 어제 베를린에서의 서명에 쓰이지 아니하였는지에 관하여 아무런 정보도 갖고 있지 아니하다고 밝히고 있다.\n\n머피는 5월 4일 파리에서 [주35] 귀하에게 그 본문을 요청하고 있다고 타전하였으며, 영국 외무부가 사본을 연합국원정군최고사령부(SHAEF)에 보내고 있다고 아울러 알려 왔다.\n\n위의 사항에 관한 귀하의 긴급한 논평이 있으면 매우 고맙겠다.\n\n그루", "secondary": "Washington, May 9, 1945—3 p.m.\n\n3630. We promptly transmitted to the President and General Marshall a copy of your 4600, May 6,4 p.m. While we were glad to hear that there has been complete coordination and agreement in London on surrender requirements, we have been anxiously awaiting further information on the subject.\n\nPlease cable urgently the substance of your conversation with the Prime Minister and General Bedell Smith, and also what arrangements are contemplated for utilizing the surrender instrument negotiated by you in EAC and approved by the Governments. The War Department states it has no information on the use of the surrender instrument or why it was not used for the signatures yesterday in Berlin.\n\nMurphy cabled from Paris on May 4 [주35] that he was asking you for the text and further advised that the British Foreign Office was sending a copy to SHAEF.\n\nYour urgent comment on the foregoing would be greatly appreciated.\n\nGrew", "notes": ["[주34] 5월 9일 오후 3시자 주프랑스대사 앞 1950호 전보는 이 전보의 요지를 되풀이하면서, 대독일 미국 정치고문에게 항복문서에 관하여 제공할 수 있는 정보가 있으면 알려 달라고 요청하였다(740.00119 EW/5–445).", "[주35] 2345호 전보, 775면."], "warn": false, "pages": [], "search": "Joseph C. Grew 그루 (국무장관 대리) John G. Winant 위넌트 (주영대사, 유럽자문위원회 미국 대표) Harry S. Truman 트루먼 (대통령) George C. Marshall 마셜 (장군) Winston Churchill 처칠 (영국 총리) Walter Bedell Smith 베델 스미스 (연합국원정군최고사령부 참모장) Robert Murphy 머피 (대독일 미국 정치고문)"}, {"id": "d227", "order": 227, "date": "1945-05-09", "group": "A", "eyebrow": "d227 · The Acting Secretary of State to the Ambassador in the United Kingdom (Winant)", "title": "국무장관 대리가 주영대사(위넌트)에게", "badge": null, "list_right": "문서 227", "meta": [{"k": "일자", "v": "1945-05-09"}, {"k": "시각", "v": "Washington, May 9, 1945—7 p.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "3657"}, {"k": "원문출처", "v": "740.00119 Control (Germany)/5–945: Telegram", "txt": true}, {"k": "발신", "v": "국무장관 대리 그루(Joseph C. Grew, The Acting Secretary of State)", "txt": true}, {"k": "수신", "v": "주영대사 위넌트(John G. Winant, The Ambassador in the United Kingdom)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 227 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d227"}], "summary": "미국 여론의 압력 때문에 육군부가 더는 미룰 수 없다고 하여, 5월 11일 금요일 정오에 스팀슨 장관이 독일 통제이사회 미국 대표단의 조직을 밝히는 성명을 낼 것임을 유럽자문위원회 동료들에게 알리라고 지시한 전보이다.", "points": ["독일 군정에 관한 우리 조직 계획을 미국 대중에게 어느 정도 알리라는 압력이 너무 커져서 육군부가 이 문제에 관한 공개 성명을 더는 미룰 수 없다고 여기게 되었다고 하였다. 구세프가 아직 이르다고 반대해 온 바로 그 성명이다(d224).", "따라서 유럽자문위원회의 동료들에게, 5월 11일 금요일 정오 열두 시에 스팀슨 장관이 독일 통제이사회 미국 대표단의 조직을 개관하는 성명을 낼 것임을 알리라고 지시하였다.", "그 성명은 미국 대표단이 12개 주요 부문으로 나뉜다는 것과 각 부문의 일반적 기능을 밝히되, 다른 점령국들의 비슷한 조직 문제에는 아무런 언급도 하지 않을 것이라고 하였다. 다른 세 나라의 동의를 기다리지 않고 미국만의 조직을 발표하는 방식으로 소련의 반대를 우회한 것이다.", "성명 시각을 정오로 못 박아 사전에 통고하도록 한 점에서, 발표 시각을 둘러싼 이 며칠의 다툼이 통제기구 문제에도 그대로 이어지고 있음이 드러난다.", "[주36] 1945년 5월 11일자 성명의 본문은 Department of State Bulletin, 1945년 5월 13일자, 900면 또는 The Axis in Defeat 60면에 있다."], "primary": "워싱턴, 1945년 5월 9일 오후 7시.\n\n3657. 국무부 5월 7일자 전보 제3582호. 독일 군정을 위한 우리의 조직 계획을 미국 대중에게 어느 정도 알리라는 압력이 너무나 커져서 [283면] 육군부는 이 문제에 관한 공개 성명을 더는 미룰 수 없다고 여기고 있다. 그러므로 귀하는 유럽자문위원회의 동료들에게, 5월 11일 금요일 정오 열두 시에 스팀슨(Stimson) 장관이 독일 통제이사회 미국 대표단의 조직을 개관하는 성명을 발표할 것임을 알리기 바란다. 그 성명은 미국 대표단이 12개 주요 부문으로 나뉜다는 것과 각 부문의 일반적 기능을 밝히겠으나, 다른 점령국들의 비슷한 조직 문제에 관하여는 아무런 언급도 하지 아니할 것이다. [주36]\n\n그루", "secondary": "Washington, May 9, 1945—7 p.m.\n\n3657. Department’s telegram No. 3582, May 7. The pressure to give the American public some indication of our organizational plans for the military government of Germany has become so great that the [283면] War Department feels that it can no longer delay a public statement on the subject. You should therefore inform your colleagues on the European Advisory Commission that at twelve noon, Friday, May 11, a statement will be issued by Secretary Stimson which gives an outline of the organization of United States group of the Control Council for Germany. The statement will indicate the division of the United States group into 12 major divisions and the general functions of each but will make no reference to the question of similar organization by the other occupying powers. [주36]\n\nGrew", "notes": ["[주36] 1945년 5월 11일자 성명의 본문은 Department of State Bulletin, 1945년 5월 13일자, 900면 또는 The Axis in Defeat(국무부 간행물 제2423호) 60면 참조."], "warn": false, "pages": ["283"], "search": "Joseph C. Grew 그루 (국무장관 대리) John G. Winant 위넌트 (주영대사, 유럽자문위원회 미국 대표) Henry L. Stimson 스팀슨 (육군장관)"}, {"id": "d228", "order": 228, "date": "1945-05-10", "group": "A", "eyebrow": "d228 · The Ambassador in the United Kingdom (Winant) to the Secretary of State", "title": "주영대사(위넌트)가 국무장관에게", "badge": null, "list_right": "문서 228", "meta": [{"k": "일자", "v": "1945-05-10"}, {"k": "시각", "v": "London, May 10, 1945—1 p.m. [Received May 10—9:19 a.m.]"}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "4668 (Special German Series No. 9)"}, {"k": "원문출처", "v": "740.00119 EAC/5–1045: Telegram", "txt": true}, {"k": "발신", "v": "주영대사 위넌트(John G. Winant, The Ambassador in the United Kingdom)", "txt": true}, {"k": "수신", "v": "국무장관(The Secretary of State) — 국무장관 대리와 매슈스 씨 앞", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 228 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d228"}], "summary": "유럽자문위원회가 오랜 교섭 끝에 마련한 무조건항복문서 대신 어찌하여 짧은 군사항복문서가 쓰였는지, 그리고 그 제4조를 통하여 무조건항복문서 또는 선언이 뒤에 쓰일 길을 어떻게 열어 두었는지를 위넌트가 해명한 전보이다. 이 묶음에서 랭스 문서의 층위를 가장 직접 다룬 문서이다.", "points": ["5월 4일 매슈스와의 전화 통화에서 위넌트는 연합국원정군최고사령부(SHAEF)가 네 정부 사이에 합의된 항복문서의 정본을 연합참모본부를 통하여 받지 못하였다고 설명하였다.", "5월 5일 토요일 그는 군사항복이 임박하였다는 말을 들었고, 그날 밤늦게 매우 짧은 형식의 무조건항복문서가 쓰일 것이며 그 문서의 승인을 군사 경로를 통하여 워싱턴과 런던에 요청하고 있다는 말을 들었다.", "그때 유럽자문위원회는 5월 1일자 프랑스 수정안을 넣어 무조건항복문서를 의결하였으나 그 수정안은 아직 각국 정부의 승인을 기다리고 있었고, 얄타에서 「분할(dismemberment)」이라는 낱말을 넣기로 세 정부가 합의하였음에도 러시아 측은 그 추가를 프랑스에 알리는 데 동의하지 않고 있었다.", "무조건항복문서의 완전한 본문은 그 낱말이 든 것과 들지 않은 것 두 벌이 런던에 대기되어 있었으나, 위넌트가 아는 한 항복문서에 서명할 권한이 네 정부로부터 위임되어 있지 않았다.", "그러나 위넌트는 그것이 짧은 항복 형식으로 결정한 까닭은 아니라고 밝힌다. 독일이 이미 무너져 실효 있는 저항을 계속할 수 없음이 알려져 있었고 빠른 항복이 인명을 구하리라는 것, 그리고 완전한 패배를 더 단순하게 승인받는 편이 논란과 지체가 가장 적으리라고 여겨졌다는 것이 까닭이었다.", "위넌트가 총리 및 베델 스미스 장군과 나눈 대화의 목적은 이 짧은 문서가 뒤에 무조건항복문서나 유럽자문위원회가 마련한 선언을 쓰는 것을 가로막지 않도록 확실히 해 두는 데 있었다. 네 강국이 길고 고통스러운 교섭 끝에 이룬 합의의 정도를 온전히 보전하려 한 것이다.", "군사항복문서 제4조는 항복문서에 담긴 조건이나 그에 근거한 선언을 뒤에 부과할 길을 온전히 열어 두도록 문언이 짜였으며, 그 조항이 들어간 뒤에야 위넌트는 5월 6일 오후 4시자 4600호를 보냈다.", "구세프는 자기 정부가 무조건항복문서를 쓰는 것보다 선언(declaration) 쪽을 선호한다고 밝혔으며, 위넌트는 그 선언이 네 점령국에 똑같이 구속력이 있고 독일에 네 강국의 의사를 부과할 든든한 바탕이 된다고 본다.", "선언에는 「분할」이라는 낱말이 들어 있지 않다. 이미 네 대표단이 합의한 대로, 선언의 전문(前文)이 독일의 일부 또는 전부의 장래 지위를 네 정부가 뒤에 결정하도록 규정하고 있기 때문이다."], "primary": "런던, 1945년 5월 10일 오후 1시.\n[접수 5월 10일 — 오전 9시 19분]\n\n4668. 국무장관 대리와 매슈스(Matthews) 씨 앞. 특별 독일 계열 제9호(Special German Series No. 9). 국무부의 5월 9일 오후 3시자 3630호에 답하면서, 나는 배경으로 5월 4일 금요일 매슈스 씨와 나눈 전화 통화를 언급한다. 그 통화에서 나는 연합국원정군최고사령부(SHAEF)가 네 정부 사이에 합의된 항복문서(surrender instrument)의 정본을 연합참모본부(Combined Chiefs of Staff)를 통하여 받지 못하였다고 설명하였다.\n\n5월 5일 토요일 나는[May 51 got word, sic] 군사항복이 임박하였다는 말을 들었으며, 그날 밤늦게 매우 짧은 형식의 무조건항복이 쓰일 것이며 이 문서에 대한 승인을 군사 경로를 통하여 워싱턴과 런던에 요청하고 있다는 말을 들었다. 그때 유럽자문위원회는 5월 1일자 프랑스 수정안을 넣어 무조건항복문서를 의결하여 두었으나, 그 수정안들은 각국 정부의 승인을 기다리고 있었다. 마찬가지로 「분할(dismemberment)」이라는 낱말을 넣는 데 관하여 얄타에서 세 정부 사이에 합의가 이루어졌음에도, 러시아 측은 이 추가를 프랑스 측에 알리는 데 동의하지 아니하였다. 무조건항복문서의 완전한 본문 사본이, 그 낱말이 덧붙은 것과 덧붙지 아니한 것 두 벌 모두, 이곳에 마련되어 있었으나, 내가 이해한 바로는 항복문서에 서명할 권한이 네 정부에 의하여 위임되어 있지 아니하였다.\n\n그러나 내가 이해하기로 이것이 더 짧은 형식의 항복으로 결정한 까닭은 아니었다. 독일이 무너졌으며 실효 있는 저항을 계속할 수 없다는 것, 그리고 빠른 항복이 인명을 구하리라는 것이 알려져 있었다. 완전한 패배를 더 단순하게 승인받는[284면] 편이 논란과 지체가 가장 적으리라고 생각되었으며, 그리하여 더 짧은 문서가 쓰였다.\n\n총리 및 베델 스미스 장군과 나눈 나의 대화는, 이 더 짧은 문서가 뒤에 무조건항복문서나 유럽자문위원회가 마련한 선언을 쓰는 것을 가로막지 아니하도록 확실히 해 두려는 것이었다. 나는 오랜 고통스러운 교섭 끝에 네 강국이 이 문서들에서 이루어 낸 합의의 정도가 온전히 보전되도록 확실히 하고자 하였다. 총리와 스미스 장군이 모두 그렇게 양해하였으며, 군사문서 제4조는 그 항복문서에 담긴 조건이나 그 항복문서에 근거한 선언을 뒤에 부과할 길을 온전히 열어 두는 방식으로 문언이 짜였다. 그 조항이 들어간 뒤에야 나는 5월 6일 오후 4시자 나의 4600호를 보냈다. 그때 연합국원정군최고사령부와 총리가 모두 이 조항을 넣는 데 합의하였기 때문이다.\n\n어젯밤 나는 5월 9[8]일 오후 6시자 나의 4657호로, 짧은 군사문서 제4조에 따라 네 정부가 발표할 무조건항복선언의 정확한 자구에 관하여 오늘 완전한 합의를 얻기를 바란다고 귀하에게 알렸다. 구세프는 자기 정부가 무조건항복문서를 쓰는 것보다 그 선언 쪽을 선호한다고 우리에게 말하였다. 우리는 그 선언이 네 점령국에 똑같이 구속력이 있으며 네 강국의 의사를 독일에 부과할 든든한 바탕이 된다고 믿는다.\n\n나는 오늘 아침, 우리가 이미 합의에 이른 선언의 각 조항을 타전한다. 오늘 유럽자문위원회 회의가 끝난 뒤에 전문(前文)을 타전하겠는데, 전문에는 아직 두 가지 점이 정하여지지 아니한 채 남아 있다. 5월 4일 대화에서 매슈스 씨에게 말한 바와 같이, 그 선언에는 「분할」이라는 낱말이 전혀 언급되어 있지 아니하다. 이미 네 대표단이 합의한 대로 선언의 전문이 독일의 일부 또는 전부의 장래 지위를 네 정부가 뒤에 결정하도록 규정하고 있기 때문이다.\n\n위넌트", "secondary": "London, May 10, 1945—1 p.m. \n [Received May 10—9:19 a.m.]\n\n4668. For the Acting Secretary and Mr. Matthews. Special German Series No. 9. In replying to Department’s 3630 May 9, 3 p.m., I refer to my telephone conversation with Mr. Matthews on Friday May 4 as background. In that conversation I explained that SHAEF had not received through the Combined Chiefs of Staff an authoritative copy of the surrender instrument as agreed among the four Governments.\n\nOn Saturday May 51 got word that a military surrender was imminent, and late that evening I was told that a very brief form of unconditional surrender was to be used and that approval of this instrument was being asked in Washington and London through military channels. At that time, although the European Advisory Commission had passed on the unconditional surrender instrument with the inclusion of the French amendments of May 1, these amendments were awaiting governmental approval. Likewise, although agreement had been reached by the three governments at Yalta on the inclusion of the word “dismemberment”, the Russians had not agreed to informing the French of this addition. Copies of the full text of the unconditional surrender instrument, in two sets both with and without the additional word, were being held available here, but, as I understood it, authority to sign the surrender instrument had not been delegated by the four Governments.\n\nThis was not the reason, however, as I understand it, for deciding on the briefer form of surrender. It was known that Germany was smashed and incapable of continued effective resistance and that a quick surrender would save life. It was thought that a simpler acknowledgment [284면] of complete defeat could be obtained with least controversy and delay, and therefore the briefer document was used.\n\nMy conversations with the Prime Minister and General Bedell Smith were to make certain that this briefer instrument did not preclude the later use of the unconditional surrender instrument or of the declaration prepared by the EAC. I wanted to make certain that the degree of agreement reached in these papers by the four powers after long and painful negotiation would be fully preserved. It was so understood by both the Prime Minister and General Smith and article four of the military instrument was worded in such a manner as to leave the way fully open for the imposition of the terms contained in the instrument or in the declaration based on the instrument. It was after inclusion of that article that I sent my 4600, May 6, 4 p.m., as both SHAEF and the Prime Minister were then agreed on the inclusion of this article.\n\nLast night I informed you in my 4657, May 9 [8], 6 p.m. that we hope to get complete agreement today on the exact wording of a declaration of unconditional surrender, to be issued by the four governments under article 4 of the brief military instrument. Gousev has stated to us that his Government prefers the declaration to the use of the unconditional surrender instrument. We believe the declaration to be equally binding on the four occupying powers and to be a solid basis for the imposition of the will of the four powers on Germany.\n\nI am cabling this morning the articles of the declaration on all of which we have already reached agreement. After today’s meeting of the EAC I will cable you the preamble, on which two points remain to be settled. As I stated to Mr. Matthews in my conversation of May 4, the declaration contains no mention of the word “dismemberment” since the preamble of the declaration, as has already been agreed by the four delegations, provides for the later determination by the four Governments of the future status of any or all parts of Germany.\n\nWinant", "notes": [], "warn": false, "pages": ["284"], "search": "John G. Winant 위넌트 (주영대사, 유럽자문위원회 미국 대표) Joseph C. Grew 그루 (국무장관 대리) H. Freeman Matthews 매슈스 (국무부 유럽국장) Winston Churchill 처칠 (영국 총리) Walter Bedell Smith 베델 스미스 (연합국원정군최고사령부 참모장) Fedor T. Gousev 구세프 (유럽자문위원회 소련 대표)"}, {"id": "d229", "order": 229, "date": "1945-05-10", "group": "A", "eyebrow": "d229 · The United States Political Adviser for Germany (Murphy) to the Secretary of State", "title": "대독일 미국 정치고문(머피)이 국무장관에게", "badge": null, "list_right": "문서 229", "meta": [{"k": "일자", "v": "1945-05-10"}, {"k": "시각", "v": "Paris, May 10, 1945—7 p.m. [Received May 10—5:35 p.m.]"}, {"k": "장소", "v": "Paris", "txt": true}, {"k": "전문번호", "v": "2517 (위넌트에게 전하도록 런던에 반복 발신)"}, {"k": "원문출처", "v": "740.00119 EW/5–1045: Telegram", "txt": true}, {"k": "발신", "v": "대독일 미국 정치고문 머피(Robert Murphy, The United States Political Adviser for Germany)", "txt": true}, {"k": "수신", "v": "국무장관(The Secretary of State)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 229 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d229"}], "summary": "연합국원정군최고사령부는 위넌트가 보고한 런던에서의 완전한 조율과 합의를 알지 못하며, 연합참모본부로부터 유럽자문위원회가 교섭한 항복 조건에 관한 지령을 받은 적이 없어 긴박한 사정 아래 최고사령부 장교들이 짧은 항복문서를 기초하였다고 보고한 전보이다. 위넌트의 해명(d228)과 정면으로 어긋난다.", "points": ["연합국원정군최고사령부(SHAEF)는 위넌트 대사가 보고한, 독일 항복 요건에 관한 런던에서의 완전한 조율과 합의에 관하여 통보받지 못하였다. 위넌트가 「완전한 조율과 합의」라고 한 것을 최고사령부는 모르고 있었다.", "참모장이 머피에게 알린 바로는, 최고사령부는 유럽자문위원회에서 교섭된 항복 조건에 관한 지령을 연합참모본부로부터 한 번도 받은 적이 없다.", "안타깝게도 이 문제에 관한 합동참모본부 문서가 얼마 전에 접수되어 있었고 그것이 값진 길잡이가 되었을 터인데도 완전히 간과되었다. 문서가 있었으나 아무도 보지 않았다는 것이다.", "연합참모본부의 지령이 없고 사정이 긴박하였던 까닭에, 짧은 항복문서는 최고사령부 장교들이 기초하여 군사 상황에 가장 알맞은 것으로 연합참모본부·영국 참모본부·소련 최고사령부에 보고하였다.", "총리가 항복문서 사본을 요청하자 최고사령부는 연합참모본부에 보고한 그 본문을 참조하도록 안내하였다.", "최고사령부는 유럽자문위원회에서 교섭된 항복 조건에 관하여 아무런 구체적 계획도 없다고 밝히면서, 다만 그 문서에 담겨 있으나 항복 조건이나 그에 딸린 훈령에 들어 있지 않은 항목은 독일 최고사령부에 대한 추가 훈령의 대상으로 삼는 것이 좋겠다고 제안한다."], "primary": "파리, 1945년 5월 10일 오후 7시.\n[접수 5월 10일 — 오후 5시 35분]\n\n2517. 국무부의 5월 9일 오후 3시자 1950호 [주38] 와 나의 5월 9일 오후 9시자 2493호 [주39] 를 참조한다. 연합국원정군최고사령부(SHAEF)는 위넌트 대사가 보고한, 독일에 대한 항복 요건에 관한 [285면] 런던에서의 완전한 조율과 합의에 관하여 통보받지 못하였다. 참모장이 나에게 알린 바에 따르면, 연합국원정군최고사령부는 유럽자문위원회에서 교섭된 항복 조건이라는 주제에 관하여 연합참모본부로부터 지령을 받은 적이 한 번도 없다. 안타깝게도 이 문제에 관한 합동참모본부(JCS) 문서 하나가 얼마 전에 접수되었고 그것이 값진 길잡이가 되었을 터인데도 완전히 간과되었다. 연합참모본부의 지령이 없고 사정이 긴박하였던 까닭에, 짧은 항복문서는 연합국원정군최고사령부 장교들에 의하여 기초되었으며 군사 상황에 가장 알맞은 것으로서 연합참모본부와 영국 참모본부 및 소련 최고사령부에 보고되었다. 총리가 항복문서 사본을 요청하자 연합국원정군최고사령부는 연합참모본부에 보고된 그 본문을 참조하도록 안내하였다. 최고사령부는 유럽자문위원회에서 교섭된 항복 조건에 관하여 아무런 구체적 계획도 갖고 있지 아니하다고 밝히면서, 다만 그 문서가 다루고 있으나 항복 조건이나 그에 딸린 훈령에는 들어 있지 아니한 항목은 독일 최고사령부에 대한 추가 훈령의 대상으로 삼아도 좋을 것이라고 제안한다.\n\n위넌트에게 전하도록 런던에 반복 발신하였다.\n\n[머피]", "secondary": "Paris, May 10, 1945—7 p.m. \n [Received May 10—5:35 p.m.]\n\n2517. Reference is made to Department’s 1950, May 9, 3 p.m. [주38] and my 2493, May 9, 9 p.m. [주39] SHAEF is not informed regarding the [285면] complete coordination and agreement in London reported by Ambassador Winant on surrender requirements for Germany. The Chief of Staff informs me that SHAEF has never received a directive from the Combined Chiefs of Staff on the subject of surrender terms negotiated in the EAC. Unfortunately a JCS paper on this subject which was received some time ago and which would have been a valuable guide was completely overlooked. In the absence of a Combined Chiefs of Staff directive and in view of the urgent circumstances, the short surrender document was drafted by SHAEF officers and reported to the Combined Chiefs of Staff, the British Chiefs of Staff and the Soviet High Command as best suited to the military situation. The Prime Minister requested a copy of the instrument of surrender and was referred by SHAEF to the text as reported to the Combined Chiefs of Staff. Supreme Headquarters states that it has no specific plans regarding the surrender terms negotiated in the EAC but suggests that any items covered by that document and not included in the terms of surrender or in the instructions which accompanied them could well be made the subject of additional instructions to the German High Command.\n\nRepeated to London for Winant.\n\n[Murphy]", "notes": ["[주38] 282면 각주 34 참조.", "[주39] 인쇄하지 아니함. 5월 8일 베를린에서의 군사항복문서 서명에 관하여 연합국원정군최고사령부로부터 얻은 잡다한 정보를 보고한 것이다(740.00119–EW/5–945)."], "warn": false, "pages": ["285"], "search": "Robert Murphy 머피 (대독일 미국 정치고문) John G. Winant 위넌트 (주영대사) Winston Churchill 처칠 (영국 총리) Walter Bedell Smith 베델 스미스 (연합국원정군최고사령부 참모장 — 본문에는 「참모장」으로만 나온다)"}, {"id": "d230", "order": 230, "date": "1945-05-10", "group": "A", "eyebrow": "d230 · The Ambassador in the United Kingdom (Winant) to the Secretary of State", "title": "주영대사(위넌트)가 국무장관에게", "badge": null, "list_right": "문서 230", "meta": [{"k": "일자", "v": "1945-05-10"}, {"k": "시각", "v": "London, May 10, 1945—8 p.m. [Received May 10—5:30 p.m.]"}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "4688 (Comea 234)"}, {"k": "원문출처", "v": "740.00119 EAC/5–1045: Telegram", "txt": true}, {"k": "발신", "v": "주영대사 위넌트(John G. Winant, The Ambassador in the United Kingdom)", "txt": true}, {"k": "수신", "v": "국무장관(The Secretary of State)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 230 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d230"}], "summary": "영국 대표가 1944년 11월 14일 유럽자문위원회 보고서 제9항을 실행하는 데 관한 비망록을 회람하여, 네 점령국이 독일에 대한 최고 권한을 행사함에 있어 다른 국제연합 국가 정부들과 협의할 뜻임을 공개 성명으로 밝힐 것을 제안하였다고 보고한 전보이다.", "points": ["유럽자문위원회 영국 대표가 1944년 11월 14일자 유럽자문위원회 보고서 제9항을 실행하는 데 관한 비망록을 회람하였다. 그 보고서는 독일 통제기구에 관한 협정을 전달한 것이다.", "영국은 네 점령국이 독일에 관한 최고 권한을 행사하는 것과 관련하여, 네 정부가 다른 국제연합(United Nations) 나라들의 정부와 협의할 뜻임을 공개 성명으로 밝힐 것을 제안한다.", "네 정부가 항복문서(surrender instrument)를 발표하느냐 항복선언(surrender declaration)을 발표하느냐에 따라 자구를 알맞게 고치도록 제안되어 있다. 이 시점에도 어느 문서를 쓸 것인지가 아직 정해지지 않았음을 보여 준다.", "완전한 본문은 항공편으로 보낸다고 하였다.", "[주41] 이 영국 대표의 비망록은 E.A.C. (45) 52, 1945년 5월 7일자 문서로 지정되었으며, 5월 10일 런던발 공한 22957호로 국무부에 전달되었다. 둘 다 인쇄하지 않았다."], "primary": "런던, 1945년 5월 10일 오후 8시.\n[접수 5월 10일 — 오후 5시 30분]\n\n4688. Comea 234. 유럽자문위원회의 영국 대표가 독일 통제기구에 관한 협정을 전달한 1944년 11월 14일자 유럽자문위원회 보고서 제9항을 [주40] 실행하는 데 관한 비망록을 회람하였다. 영국은 네 점령국이 독일에 관하여 최고 권한을 행사하는 것과 관련하여 네 정부가 다른 국제연합(United Nations) 국가들의 정부와 협의할 뜻임을 밝히는 공개 성명이 있어야 한다고 제안한다. 네 정부가 항복문서(surrender instrument)를 발표하느냐 항복선언(surrender declaration)을 발표하느냐에 따라 자구를 알맞게 고칠 것이 제안되어 있다. 완전한 본문은 항공편으로 보낸다. [주41]\n\n위넌트\n\n[286면]", "secondary": "London, May 10, 1945—8 p.m. \n [Received May 10—5:30 p.m.]\n\n4688. Comea 234. The UK Representative on the European Advisory Commission has circulated a memorandum regarding giving effect to paragraph 9 of the report of the EAC of Nov. 14, 1944, [주40] transmitting the agreement on control machinery in Germany. UK proposes that a public statement be made that in connection with the exercise by the four occupying powers of supreme authority with respect to Germany the four Governments intend to consult with the Governments of other United Nations. Suitable modification of wording is proposed, depending on whether the surrender instrument or the surrender declaration is issued by the four Governments. Full text by air. [주41]\n\nWinant\n\n[286면]", "notes": ["[주40] Foreign Relations, 1944, vol. i, p. 404.", "[주41] 유럽자문위원회 영국 대표의 이 비망록은 E.A.C. (45) 52, 1945년 5월 7일자 문서로 지정되었으며, 5월 10일 런던발 공한 22957호로 국무부에 전달되었다. 둘 다 인쇄하지 아니하였다(740.00119 EAC/5–1045)."], "warn": false, "pages": ["286"], "search": "John G. Winant 위넌트 (주영대사, 유럽자문위원회 미국 대표) William Strang 스트랭 (유럽자문위원회 영국 대표 — 본문에는 「영국 대표」로만 나온다)"}, {"id": "d231", "order": 231, "date": "1945-05-10", "group": "A", "eyebrow": "d231 · The Ambassador in the United Kingdom (Winant) to the Secretary of State", "title": "주영대사(위넌트)가 국무장관에게", "badge": null, "list_right": "문서 231", "meta": [{"k": "일자", "v": "1945-05-10"}, {"k": "시각", "v": "London, May 10, 1945—10 p.m. [Received May 10—7:25 p.m.]"}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "4709 (Comea 237)"}, {"k": "원문출처", "v": "740.00119 EAC/5–1045: Telegram", "txt": true}, {"k": "발신", "v": "The Ambassador in the United Kingdom (Winant) 주영대사 위넌트", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 231 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d231"}], "summary": "유럽자문위원회에서 독일 패전 선언의 전문(前文) 문구와, 어느 연합국 정부들에게 선언을 알리고 가입시킬 것인가를 두고 오간 논의를 보고한 것이다.", "points": ["위넌트는 5월 4일 유럽자문위원회(EAC) 회의에서 선언 전문 제4항의 문구가 15개 안팎의 연합국 정부를 4대 강국과 같은 지위에 놓는 것 같다고 이의를 제기하고, 4강·「적극적으로 참전한」 국제연합국·그 밖의 국제연합국 사이에 선을 긋는 대안 문구를 제시했다.", "스트랭은 미국안을 받아들였으나 구세프는 여러 이의를 제기하다가 5월 10일에야 미국 문구든 원래 문서의 문구든 받아들이겠다고 했다.", "위원회는 시간이 없어 「동의(concurrence)」를 기다릴 수 없다고 결론짓고, 동의에 관한 언급을 빼고 원래 문서의 문구로 되돌리기로 합의했다.", "위넌트는 국무부 훈령 3449호에 따라, 병력을 제공한 정부들을 독일에 선언을 공포하기 전에 미리 통보하여 선언에 가입하도록 초청할 것을 촉구했다.", "스트랭은 협의 대상으로 (1) 항복문서 요지에 관해 이미 협의한 유럽 연합국, (2) 영 자치령과 인도, (3) 브라질을 제안했고, 구세프는 즉시 바르샤바의 폴란드 정부[주42]를 가입국에 넣자고 제안했다.", "구세프는 소련이 인도와 외교관계가 없어도 통보에 지장이 없듯, 바르샤바 정부와 여러 연합국 사이에 외교관계가 없는 것도 통보의 장애가 되지 않는다고 논변했다.", "위넌트는 4대 연합국이 각자 어느 정부에 선언을 개별 통보하고 어느 정부를 가입에 초청할지 스스로 정하자는 착상을 「제안이 아닌 시사」로 내놓았고, 마시글리가 이를 지지했으며 구세프는 대안 없이 반대했다.", "위넌트는 폴란드 문제가 끼어든 데다 시간 문제까지 겹쳐, 전문에서 「적극적」 국제연합국 언급을 넣으려는 노력을 접는 편이 현명하다고 본다."], "primary": "런던, 1945년 5월 10일 오후 10시.\n [접수 5월 10일 오후 7시 25분]\n\n4709. Comea 237. 국무부의 5월 2일 오후 7시자 3449호는 독일 패전에 관한 선언을 두고 연합국 정부들과 협의하는 문제를 논의하는 데 매우 요긴했다. 5월 4일의 유럽자문위원회 회의에서 나는 선언 전문(前文) 제4항의 문구가 15개 안팎의 연합국 정부를 4대 강국과 같은 자리에 놓으려는 경향이 있다고 이의를 제기하고, 다음과 같은 문구를 제안했다. 「각자의 정부의 권한에 의하여, 그리고 독일의 패배에 적극적으로 참여한 다른 국제연합국들의 동의를 얻어, 또한 국제연합국들의 이익을 위하여 행동하며」. 이 초안은 4대 강국과 「적극적」 국제연합국, 그리고 그 밖의 국제연합국 사이에 더 뚜렷한 선을 그은 것이었다. 스트랭(Sir William Strang)은 이를 받아들였으나, 구세프(Fedor T. Gousev)는 오늘에 이르기까지 여러 가지 이의를 제기했고, 오늘에서야 이 미국 문구든 원래 문서의 문구든 어느 쪽이라도 받아들일 뜻이 있다고 밝혔다.\n\n「적극적」 연합국들과 협의하여 그들의 동의를 얻어내는 데 쓸 수 있는 절차를 오늘 더 검토한 끝에, 위원회는 시간이 그러한 동의를 기다리는 것을 허락하지 않는다는 결론에 이르렀다. 이에 따라 동의에 관한 언급을 빼고 원래 문서의 문구로 되돌아가기로 합의되었다. 국무부의 3449호에 따라 나는, 병력을 제공한 정부들에게 독일인들에게 선언을 공포하기에 앞서 그 선언을 통보함으로써 그 정부들이 선언에 가입하도록 초청할 것을 촉구했다.\n\n협의할 연합국 정부들에 관하여 스트랭은 다음을 제안했다. (1) 항복문서 요지에 관하여 이미 협의한 유럽의 연합국들, (2) 영 자치령들과 인도, (3) 브라질. 구세프는 즉각 바르샤바의 폴란드 정부[주42]를 가입 정부들에 포함시킬 것을 제안했다. 그는 그 정부와 여러 연합국 정부들 사이에 외교관계가 없다는 사실이 그 정부에 통보하는 데 아무런 장애가 되지 않는다고, 소련이 외교관계를 가지고 있지 않은 인도의 경우에도 그것이 장애가 되지 않은 것과 마찬가지라고 논변했다.\n\n나는 하나의 제안으로서가 아니라 시사로서, 4대 연합국 정부가 각기 독일의 패배에 적극적으로 참여한 정부들 가운데 어느 정부에 선언을 개별적으로 [287면] 통보하고자 하는지, 또 어느 정부를 선언에 가입하도록 초청하고자 하는지를 스스로 정하자는 뜻을 내놓았다. 이 절차가 4개 정부의 공동행동이 아니라 개별행동이 될 것이라는 구세프의 반대에 대하여, 스트랭은 그것이 공동합의에 기초하여 취해지는 개별행동을 뜻한다고 지적했다. 마시글리(René Massigli)는 나의 시사를 지지했다. 구세프는 아무런 반대 제안도 내놓지 않은 채 그에 대한 반대를 표명했다.\n\n나는 다른 연합국들의 동의에 관한 논의에 폴란드 문제가 끼어든 것이, 시간이라는 요소에 더하여, 선언의 전문에 「적극적」 국제연합국에 관한 어떠한 언급이든 넣으려는 노력을 포기하는 편이 현명하도록 만든다고 믿는다. 유럽자문위원회가 폴란드를 포함하게 될 가입국 명단에 합의할 수 없는 이상, 나는 (1) 각 주요 연합국이 개별적으로 통보한다는 나의 시사가 4개 정부에 권고되거나, 아니면 (2) 유럽자문위원회가 다른 연합국 정부들에게 본문을 통보하고 그들의 가입을 얻는 절차에 관한 어떠한 합의된 권고도 없이 선언 초안을 4개 정부에 넘기게 되어, 결국 각 정부가 다른 세 정부와 상관없이 스스로 적절하다고 여기는 가입을 자유로이 초청하게 되리라고 본다. 지금 열려 있는 두 절차 가운데 첫째 것이 모든 점에서 더 나아 보인다.\n\n위넌트(Winant)", "secondary": "London, May 10, 1945—10 p.m. \n [Received May 10—7:25 p.m.]\n\n4709. Comea 237. Department’s 3449, May 2, 7 p.m., has been most helpful in discussion of consultation with the Allied Governments concerning the declaration on Germany’s defeat. At May 4 meeting of the European Advisory Commission I objected to the wording of paragraph 4 of the preamble to the declaration as tending to place the 15 or so Allied Governments on the same footing as the four major powers, and proposed the following wording: “Acting by authority of their respective governments and with the concurrence of others of the United Nations which have actively participated in the defeat of Germany and in the interests of the United Nations”. This draft drew a clearer line between the four powers, the “active” United Nations and the rest of the United Nations. It was accepted by Strang, but Gousev raised various objections to it until today, when he expressed a willingness to accept either this US wording or the words of the original instrument.\n\nOn further consideration today of the possible procedures for consulting the “active” Allies and for securing their concurrence, the Commission came to the conclusion that time does not permit of awaiting such concurrence. It was accordingly agreed to omit the reference to concurrence and to revert to the wording of the original instrument. In accordance with Department’s 3449 I urged that Governments which have contributed military forces be invited to adhere to the declaration by communicating it to them in advance of publishing it to the Germans.\n\nWith regard to the Allied Governments to be consulted, Strang proposed the following: (1) the European Allies already consulted concerning the summary of the surrender instrument; (2) British Dominions and India; (3) Brazil. Gousev at once proposed inclusion of the Polish Government in Warsaw [주42] among the adhering governments. He argued that absence of diplomatic relations between that government and several of the Allied Governments was no obstacle to informing it, as it was no bar in the case of India, with which the USSR has no diplomatic relations.\n\nI put forward the suggestion, not as a proposal, that each of the four Allied Governments decide to which Governments, among those which had participated actively in Germany’s defeat, it wished to [287면] communicate the declaration individually and which it wished to invite to adhere to the declaration. To Gousev’s objection that this procedure would represent individual action rather than joint action by the four governments, Strang pointed out that it represented individual action taken on the basis of joint agreement. Massigli supported my suggestion. Gousev expressed objection to it without making any counter suggestion.\n\nI believe that the injection of the Polish question into the discussion of concurrence by other Allies, in addition to the time factor, makes it wise to abandon the effort to include in the preamble to the declaration any reference to the “active” United Nations. Since the EAC cannot agree on a list of adherences which would include Poland, I assume that (1) my suggestion of individual communication by each major ally will be recommended to the four governments, or (2) the EAC will forward the draft declaration to the four governments without any agreed recommendation regarding procedure for communicating the text of other Allied Governments and for their adherence to it, thus leaving each government free to invite such adherences as it considers appropriate without reference to the other three governments. Of the two procedures now open, the first seems preferable in all respects.\n\nWinant", "notes": ["[주42] 폴란드 임시 거국통일정부 수립에 관한 미국·영국·소련 사이의 교섭에 관한 문헌은 제5권 110면 이하 참조."], "warn": false, "pages": ["287"], "search": "Winant 위넌트(주영대사) Strang 스트랭(유럽자문위원회 영국 대표) Gousev 구세프(유럽자문위원회 소련 대표) Massigli 마시글리(유럽자문위원회 프랑스 대표)"}, {"id": "d355", "order": 355, "date": "1945-05-10", "group": "C", "eyebrow": "d355 · Memorandum of Conversation, by the Acting Secretary of State", "title": "국무장관 대리의 대화 비망록", "badge": null, "list_right": "문서 355", "meta": [{"k": "일자", "v": "1945-05-10"}, {"k": "시각", "v": "[Washington,] May 10, 1945. (오전 면담 — “I called on the President this morning”)"}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 Control (Germany)/5–1045", "txt": true}, {"k": "발신", "v": "The Acting Secretary of State (Grew) 국무장관 대리 그루", "txt": true}, {"k": "수신", "v": "기록 (국무부 편철)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "대화 비망록"}], "links": [{"k": "FRUS", "text": "문서 355 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d355"}], "summary": "그루가 홈스·필립스와 함께 대통령을 만나 독일 전후 처리 지령의 완성 상황을 보고하고, 대통령이 군정의 조속한 민간 이양 의사를 밝힌 기록이다.", "points": ["유럽 주둔 총사령관에게 보낼 독일 전후 처리 지령이 합동참모본부가 검토 중인 한두 가지 사소한 점만 빼고 완성되었다.", "그루는 계획을 공표하라는 여론의 압력이 크며, 대통령 승인과 아이젠하워 발송 뒤에는 요지를 조기에 공표할 수 있다고 했고 대통령이 동의했다.", "홈스는 계획의 주된 목적이 전쟁 수단을 제조할 수 있는 독일 산업을 제거하는 데 있다고 설명했고, 대통령은 경공업도 포함되는지 물었다.", "모겐소는 합성석유 공장의 파괴를 바랐으나 국무부 입장은 아이젠하워가 그 공장들을 쓸 수 있는 한 파괴는 현명하지 않다는 것이었고, 대통령은 이 점에서 모겐소와 전적으로 견해가 다르다고 했다.", "대통령은 독일에서 「난장판 같은 시기(rough and tumble period)」가 끝나는 대로 독일에 대한 통치 권한이 효율적으로 이행될 수 있는 한 신속히 민간의 손에 넘어가기를 바란다고 했다.", "대통령은 군이 군사작전의 필요를 넘어서는 통치 책임을 져서는 안 된다는 것이 미국의 전통이라고 일반론으로 말했다."], "primary": "[발췌]\n\n[워싱턴,] 1945년 5
