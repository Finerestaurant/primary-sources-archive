<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>독일 항복 — 열람기</title>
<style>
:root{
  --bg:#eef1f4; --panel:#f7f9fa; --edge:#ccd4da; --edge-soft:#dde4e9;
  --ink:#16202a; --ink-2:#4a5b68; --ink-3:#71828f;
  --stamp:#8c2f39;            /* 기밀등급 도장의 자주색 */
  --link:#2f5d86;
  --a:#4a7c59; --b:#8a6d3b; --c:#3f6d8c; --d:#7a4a6b; --e:#5a6f7d; --x:#8a8f94;
  --term-line:#9db0c2; --term-bg:rgba(47,93,134,.05);
  --term-line-go:#7fa3c4; --term-bg-go:rgba(47,93,134,.10);
  --term-bg-on:rgba(47,93,134,.17);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",
         -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
    --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
    --stamp:#c9707a; --link:#7fb0da;
    --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
    --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
    --term-bg-on:rgba(127,176,218,.22);
    --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
  }
}
:root[data-theme="dark"]{
  --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
  --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
  --stamp:#c9707a; --link:#7fb0da;
  --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
  --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
  --term-bg-on:rgba(127,176,218,.22);
  --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--link)}

.wrap{display:grid;grid-template-columns:minmax(300px,25%) 1fr;height:100vh}

/* 좁은 화면 — 목록을 위로 접어 올리면 본문이 설 자리가 없다.
   목록은 서랍으로 빼고 화면 전부를 문서에 준다. */
.mbar{display:none}
.scrim{display:none}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;grid-template-rows:1fr;padding-top:44px}
  .mbar{display:flex;align-items:center;gap:10px;
    position:fixed;top:0;left:0;right:0;height:44px;z-index:30;padding:0 12px;
    background:var(--panel);border-bottom:1px solid var(--edge)}
  .mbar button{background:var(--term-bg-go);border:1px solid var(--term-line-go);
    color:var(--link);border-radius:999px;padding:3px 11px;cursor:pointer;
    font:inherit;font-size:12px;font-family:var(--mono);white-space:nowrap}
  .mbar-t{font-size:12.5px;font-weight:650;color:var(--ink-2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail{position:fixed;top:0;bottom:0;left:0;z-index:40;
    width:min(88vw,340px);max-height:none;
    transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:0 0 30px rgba(0,0,0,.35)}
  body.railopen .rail{transform:none}
  .scrim{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45);border:0;padding:0}
  body.railopen .scrim{display:block}
  .toolbar{padding:7px 16px;gap:8px}
  .toolbar #themeBtn{display:none}
  .mbar-t{flex:1}
  .mbar-th{padding:3px 9px;font-size:13px}
  .seg button{padding:4px 9px;font-size:11.5px}
  .srcline{padding:10px 16px 0}
}
@media(prefers-reduced-motion:reduce){.rail{transition:none}}

/* ── 좌측 목록 ─────────────────────────────── */
.rail{border-right:1px solid var(--edge);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
.rail-head{padding:14px 14px 10px;border-bottom:1px solid var(--edge-soft);
  display:flex;flex-direction:column;gap:8px}
/* 문서철에 들어오면 나갈 길이 있어야 한다 */
.home{display:inline-flex;align-items:center;gap:5px;text-decoration:none;
  color:var(--link);font-size:11.5px;font-family:var(--mono);
  letter-spacing:.04em;width:fit-content;
  background:var(--term-bg-go);border:1px solid var(--term-line-go);
  border-radius:999px;padding:2px 10px 2px 8px}
.home:hover{background:var(--term-bg-on);border-color:var(--link)}
.home span{font-size:12px;line-height:1}
.brand{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font-weight:400;letter-spacing:0;text-transform:none;
  color:var(--ink-3);font-size:11.5px;margin-top:2px}
input[type=search]{width:100%;padding:7px 10px;border:1px solid var(--edge);
  border-radius:3px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
input[type=search]:focus,button:focus-visible,.item:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--edge);background:transparent;color:var(--ink-2);
  border-radius:999px;padding:2px 9px;font-size:11.5px;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sortbar{display:flex;gap:10px;font-size:11.5px;color:var(--ink-3);align-items:center}
.sortbar button{background:none;border:none;color:var(--ink-3);cursor:pointer;
  font:inherit;padding:0;border-bottom:1px solid transparent}
.sortbar button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.list{overflow-y:auto;flex:1;min-height:0}
.item{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--edge-soft);border-left:3px solid transparent;
  padding:9px 13px;cursor:pointer;font:inherit;color:inherit}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--bg);border-left-color:var(--ink)}
.item.tA{border-left-color:var(--a)} .item.tB{border-left-color:var(--b)}
.item.tC{border-left-color:var(--c)} .item.tD{border-left-color:var(--d)}
.item.tE{border-left-color:var(--e)} .item.tX{border-left-color:var(--x)}
.item-top{display:flex;justify-content:space-between;gap:8px;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.item-sum{font-size:12.5px;line-height:1.45;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 제목이 「국무장관이 주한대사에게」 꼴이라 무엇을 읽는 것인지 알 수 없다.
   요지 한 줄을 옅게 깔아 준다. 목록이 길어지지 않도록 두 줄에서 자른다. */
.item-hint{font-size:11.5px;line-height:1.4;margin-top:3px;color:var(--ink-3);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── 우측 본문 ─────────────────────────────── */
.main{overflow-y:auto;min-height:0}
.toolbar{position:sticky;top:0;z-index:5;background:var(--panel);
  border-bottom:1px solid var(--edge);padding:8px 26px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px}
.toolbar .grow{flex:1}
.seg{display:flex;border:1px solid var(--edge);border-radius:3px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 11px;cursor:pointer;
  font:inherit;font-size:12px;color:var(--ink-2);border-right:1px solid var(--edge)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.srcline{padding:10px 26px 0;font-size:11px;color:var(--ink-3);line-height:1.5}

/* ── 연대 바 ───────────────────────────────
   5년 반을 한 줄에 욱여넣으면 1945년 8월 열흘은 0.5% 밖에 안 된다. 그래서
   줄을 늘여 놓고 **띠 자체를 움직인다** — 지금 읽는 문서의 날짜가 늘 정중앙이다.
   문서를 옮기면 띠가 미끄러지고, 사건 이름은 겹치지 않게 위아래로 층을 나눈다. */
.chrono{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
  width:min(940px,calc(100vw - 48px));z-index:20;user-select:none;
  border:1px solid var(--edge);border-radius:8px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 20px rgba(0,0,0,.10);
  transition:box-shadow .2s ease}
.chrono:hover{box-shadow:0 6px 26px rgba(0,0,0,.18)}
/* 옅어지는 것은 **내용**이지 판이 아니다. 판까지 투명해지면 뒤의 본문이
   비쳐 들어와 글자가 서로를 밟는다. */
.chrono-track{opacity:.5;transition:opacity .2s ease}
.chrono:hover .chrono-track{opacity:1}

/* 띠가 지나가는 창. 손으로도 밀 수 있게 진짜 가로 스크롤을 쓴다 */
.chrono-vp{position:relative;overflow-x:auto;overflow-y:hidden;
  height:var(--chH,92px);border-radius:8px;cursor:grab;
  scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain}
.chrono-vp::-webkit-scrollbar{display:none}
.chrono-vp.drag{cursor:grabbing}
/* 안쪽 띠. 양옆 여백은 창의 절반 — 첫 문서도 마지막 문서도 가운데에 설 수 있게 */
.chrono-track{position:relative;height:100%;margin:0 var(--chPad,0px)}
/* 시간 축 — 층의 한가운데 */
.chrono-track::before{content:"";position:absolute;
  left:calc(0px - var(--chPad,0px));right:calc(0px - var(--chPad,0px));
  top:var(--axis,46px);height:1px;background:var(--edge)}

/* 연도 — 해가 바뀌는 자리에 선을 긋고, 그 선부터가 그 해다.
   이름표는 창 왼쪽에 들러붙는다. 1945년 한복판을 보고 있어도 「1945」가 남는다. */
.cy{position:absolute;top:0;bottom:0;
  border-left:1px solid color-mix(in srgb,var(--ink-3) 50%,transparent)}
.cy.alt{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.cy b{position:absolute;bottom:3px;font-family:var(--mono);font-size:11px;
  font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;
  line-height:1;letter-spacing:.06em;white-space:nowrap;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px}
/* 달·분기 눈금 — 해 안에서 어디쯤인지. 분기는 조금 길게 */
/* 1px 짜리 표는 좌표에 걸터앉혀야 한다. 왼쪽 모서리를 좌표에 맞추면 표가
   반 픽셀 오른쪽에 서서, 같은 날짜의 점과 어긋나 보인다. 아래 실·표도 같다. */
.cq{position:absolute;top:calc(var(--axis,46px) - 1.5px);width:1px;height:4px;
  margin-left:-.5px;background:var(--edge);opacity:.7}
.cq.q{top:calc(var(--axis,46px) - 2.5px);height:6px;opacity:1}
.cq[hidden]{display:none}

/* 배율 — 5년 반을 한눈에 볼 때와 8월 열흘을 벌려 볼 때가 같을 수 없다 */
.chrono-zoom{position:absolute;right:6px;top:5px;z-index:3;display:flex;gap:3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-zoom,.chrono-zoom:focus-within{opacity:1}
.chrono-zoom button{width:19px;height:19px;padding:0;line-height:1;
  font-family:var(--mono);font-size:12px;color:var(--ink-2);cursor:pointer;
  background:var(--panel);border:1px solid var(--edge);border-radius:3px}
.chrono-zoom button:hover:not(:disabled){color:var(--link);border-color:var(--link)}
.chrono-zoom button:disabled{opacity:.35;cursor:default}
.chrono-scale{position:absolute;right:6px;bottom:3px;z-index:3;
  font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.03em;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-scale{opacity:1}

/* 사건 점 — 이름에서 내려오는 실보다 위다. 실이 점 위를 지나가면
   점이 실에 꿰뚫린 것처럼 보이고, 어느 것이 사건 자리인지 흐려진다. */
.cm{position:absolute;top:calc(var(--axis,46px) - 3px);width:7px;height:7px;
  margin-left:-3.5px;border-radius:50%;background:var(--ink-3);z-index:2;
  border:1.5px solid var(--panel);cursor:help;
  transition:background .15s ease,transform .15s ease}
.cm.key{background:var(--stamp);width:9px;height:9px;margin-left:-4.5px;
  top:calc(var(--axis,46px) - 4px)}
.cm:hover{background:var(--link);transform:scale(1.45)}

/* 사건 이름 — 층(lane)을 나눠 위아래로 흩는다. 여기서 겹침이 풀린다 */
.cl{position:absolute;transform:translateX(-50%);white-space:nowrap;z-index:1;
  font-family:var(--mono);font-size:10px;line-height:1.1;color:var(--ink-2);
  letter-spacing:.01em;padding:1px 4px;border-radius:2px;cursor:help;
  background:color-mix(in srgb,var(--panel) 70%,transparent)}
.cl.key{color:var(--stamp)}
.cl:hover,.cl:focus-visible{color:var(--link);outline:0;
  background:color-mix(in srgb,var(--link) 12%,var(--panel))}
/* 이름에서 축까지 내려/올려 긋는 실 — 어느 점의 이름인지 알아보게 */
.cl::after{content:"";position:absolute;left:calc(50% - .5px);width:1px;
  background:var(--edge)}
.cl.up::after{top:100%;height:var(--leg,0px)}
.cl.dn::after{bottom:100%;height:var(--leg,0px)}

/* 지금 읽는 문서가 놓인 자리. 문서를 고르면 이 표가 창 한가운데로 온다.
   손으로 띠를 밀면 표는 제 날짜에 남는다 — 표는 시간에 박혀 있지 창에 박혀 있지 않다. */
.chrono-cursor{position:absolute;top:0;bottom:0;width:1px;z-index:3;
  margin-left:-.5px;background:var(--stamp);pointer-events:none}
/* 가상 요소는 위의 *{box-sizing:border-box}가 닿지 않는다 — 여기서 직접 잡아 주지
   않으면 테두리 2px 만큼 표시가 축 아래·오른쪽으로 밀려 앉는다. */
.chrono-cursor::before{content:"";position:absolute;box-sizing:border-box;
  left:-6px;top:calc(var(--axis,46px) - 6px);width:13px;height:13px;
  border-radius:50%;background:var(--stamp);border:2px solid var(--panel)}
/* 날짜는 맨 아래, 표 바로 밑에 — 위쪽은 사건 이름 층에 내준다 */
.chrono-date{position:absolute;bottom:2px;transform:translateX(-50%);
  font-family:var(--mono);font-size:10px;color:var(--stamp);
  font-variant-numeric:tabular-nums;background:var(--panel);
  padding:0 5px;border-radius:2px;white-space:nowrap;z-index:3}
.chrono[data-nodate="1"] .chrono-cursor,
.chrono[data-nodate="1"] .chrono-date{display:none}

/* 좁은 화면에서도 연대 바는 남긴다 — 이 화면의 절반은 「언제인가」이다.
   폭을 화면 끝까지 늘리고, 손가락으로 미는 것이 이미 되므로 줌 단추는 접는다. */
@media(max-width:900px){
  .chrono{bottom:8px;width:calc(100vw - 16px);border-radius:6px}
  .chrono-zoom{display:none}
  .chrono-track{opacity:1}
}
@media(prefers-reduced-motion:reduce){.chrono-track{transition:none}}

/* 아래쪽 여백은 떠 있는 연대 바가 마지막 문단을 덮지 않을 만큼 */
article{max-width:none;padding:26px 26px 190px}
@media(max-width:900px){article{padding:18px 16px 170px}}

/* ── 앞뒤로 넘기기 ─────────────────────────────
   목록을 다시 열지 않고도 이어 읽을 수 있어야 한다. */
.steps{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;
  margin-top:34px;padding-top:18px;border-top:1px solid var(--edge)}
.step{display:flex;flex-direction:column;gap:2px;text-align:left;
  border:1px solid var(--edge);border-radius:5px;background:transparent;
  padding:9px 12px;cursor:pointer;font:inherit;color:var(--ink-2);min-width:0}
.step.next{text-align:right;align-items:flex-end}
.step:hover{border-color:var(--link);color:var(--ink);background:var(--term-bg)}
.step-k{font-family:var(--mono);font-size:11px;color:var(--link);letter-spacing:.04em}
.step-d{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.step-t{font-size:13px;line-height:1.4;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.step.empty{display:flex;align-items:center;justify-content:center;border-style:dashed;
  color:var(--ink-3);font-size:12px;font-family:var(--mono);cursor:default}
.steps .step-n{align-self:center;font-family:var(--mono);font-size:11.5px;
  color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}

@media(max-width:900px){
  .steps{grid-template-columns:1fr;gap:8px}
  .steps .step-n{order:-1;text-align:center}
  .step.next{text-align:left;align-items:flex-start}
}
.doc-head{border-bottom:1px solid var(--edge);padding-bottom:14px;margin-bottom:18px}
h1{font-size:19px;margin:0 0 4px;line-height:1.35;text-wrap:balance;font-weight:650}
.docid{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  letter-spacing:.04em;font-variant-numeric:tabular-nums}
.stamp{display:inline-block;border:1.5px solid var(--stamp);color:var(--stamp);
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:1px 6px;
  border-radius:2px;transform:rotate(-1.2deg);margin-left:8px;vertical-align:2px}
.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:3px 20px;margin-top:10px;font-size:12.5px}
.meta div{display:flex;gap:7px}
/* 참석자 명단처럼 긴 값. 좁은 칸에 넣으면 한 글자씩 세로로 눌린다 */
.meta div.wide{grid-column:1/-1}
.meta b{color:var(--ink-3);font-weight:500;min-width:52px;font-size:11.5px}
.meta span{font-family:var(--mono);font-size:12px}
.meta span.txt{font-family:var(--sans);font-size:12.5px}

.points{margin:16px 0;padding:12px 16px;border-left:2px solid var(--edge);
  background:var(--panel);border-radius:0 3px 3px 0}
.points li{margin:3px 0}
.points ul{margin:0;padding-left:18px}

.cols{display:grid;gap:26px}
.cols.two{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.cols.two{grid-template-columns:1fr}}
.pane h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 8px;font-weight:600}
.body{white-space:pre-wrap;word-break:break-word}

.mdh{display:block;font-weight:700;margin:20px 0 6px;letter-spacing:-.01em}

/* 호버 카드 — 링크 위에 머물면 그 문서가 무엇인지 미리 보여 준다.
   열람기와 같은 토큰(--panel, --edge, --ink…)을 쓰므로 별도 팔레트가 없다.
   토큰을 정의하지 않은 페이지에 얹으려면 그 값들만 채워 주면 된다. */

.hc {

  z-index: 60;
  width: min(400px, calc(100vw - 32px));
  background: var(--panel);
  border: 1px solid var(--edge);
  border-radius: 4px;
  box-shadow: 0 6px 28px rgba(16, 26, 38, .16), 0 1px 3px rgba(16, 26, 38, .1);

  font-size: 13.5px;

.hc-route {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  margin: 0 0 8px;
  line-height: 1.5;
}

.hc p.sum {
  margin: 0;
  /* 요약이 길 수 있다. 넘치면 자른다 — 카드는 미리보기지 본문이 아니다 */
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;

}

.hc-foot {

  font-family: var(--mono);

@media (hover: none) { .hc { display: none } }
@media (prefers-reduced-motion: reduce) {
  .hc { transition: none }

<script id="data" type="application/json">[{"id": "d64", "order": 64, "date": "1945-04-25", "group": "A", "eyebrow": "d64 · The Chargé in the Soviet Union (Kennan) to the Secretary of State  The text of this telegram was repeated on April 27 to London as Department’s No. 3291 and to Caserta as No. 391.", "title": "주소련 대리대사(케넌)가 국무장관에게", "badge": null, "list_right": "문서 64", "meta": [{"k": "일자", "v": "1945-04-25"}, {"k": "시각", "v": "Moscow, April 25, 1945—7 p.m. [Received April 25—5:35 p.m.]"}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": "1348"}, {"k": "원문출처", "v": "740.00119 Control (Austria)/4–2545: Telegram", "txt": true}, {"k": "발신", "v": "The Chargé in the Soviet Union (Kennan) 주소련 대리대사 케넌", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 64 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d64"}], "summary": "소련 정부가 빈에 미국 장교를 파견하는 데 이의가 없다고 통보했으며, 오스트리아와 빈의 점령지대 획정을 서두르자고 요구했다.", "points": ["비신스키가 서한으로, 소련 정부는 임시 관리기구 업무에 참여할 미국 장교 몇 명을 빈으로 파견하는 데 이의가 없다고 알려 왔다.", "소련 정부는 오스트리아와 빈의 점령지대 획정을 서두르는 것을 극히 중요하다고 본다.", "다만 논의는 「유럽자문위원회에서 소련 측이 심의를 위해 내놓은 제안에 부합하게」 이루어져야 한다고 못 박았다.", "전리품 장비(trophy equipment)의 긴급 반출에는 어떠한 장애도 두어서는 안 된다는 것이 소련 정부의 입장이다.", "이 전보 본문은 4월 27일 런던에 국무부 제3291호로, 카세르타에 제391호로 재전송되었다.[주76]"], "primary": "모스크바, 1945년 4월 25일 오후 7시.\n [접수 4월 25일 오후 5시 35분]\n\n1348. 국무부 전보 제907호, 4월 19일 오전 11시에 대하여. 나는 비신스키(Andrey Y. Vyshinski)로부터 서한을 접수했는데, 그는 소련 정부가 임시 관리기구(provisional control machinery)의 업무에 참여할 미국 장교 여러 명을 빈으로 파견하는 데 이의가 없다고 밝히고 있다. 비신스키는, 소련 정부가 오스트리아와 빈에서의 점령지대 획정을 서두르는 일과 유럽자문위원회(EAC)에서 심의하도록 소련 측이 내놓은 제안에 부합하게 임시 관리기구의 조직 계획을 논의하는 일을 극히 중요하다고 여긴다고 말한다.\n\n[94면]\n\n정치·경제 문제, 특히 각종 장비의 반출 문제에 관하여 비신스키는, 대(對)독일 전쟁에 쓰일 수 있는 전리품 장비의 긴급한 반출에는 어떠한 장애도 놓여서는 안 된다는 것이 소련 정부의 견해라고 말한다.\n\n케넌(Kennan)", "secondary": "Moscow, April 25, 1945—7 p.m. \n [Received April 25—5:35 p.m.]\n\n1348. ReDeptel 907, April 19, 11 a.m. I have received a letter from Vyshinski stating that the Soviet Government has no objection to the dispatch to Vienna of several American officers to participate in the work of the provisional control machinery. Vyshinski states that the Soviet Government considers it extremely important to expedite the delimitation of the zones of occupation in Austria and in Vienna and to discuss plans for the organization of the provisional control machinery in conformity with the proposals advanced from the Soviet side for consideration in the European Advisory Commission.\n\n[94면]\n\nConcerning political and economic questions and particularly questions of the removal of various types of equipment, Vyshinski states that the Soviet Government considers that no obstacles should be placed in the way of the urgent removal of trophy equipment which might be used in the war against Germany.\n\nKennan", "notes": ["[주76] 이 전보의 본문은 4월 27일 런던에 국무부 제3291호로, 카세르타에 제391호로 재전송되었다."], "warn": false, "pages": ["94"], "search": "Kennan 케넌(주소련 대리대사) Vyshinski 비신스키(소련 외무인민위원 대리)"}, {"id": "d190", "order": 190, "date": "1945-04-25", "group": "A", "eyebrow": "d190 · The Ambassador in France (Caffery) to the Secretary of State", "title": "주프랑스대사(캐퍼리)가 국무장관에게", "badge": null, "list_right": "문서 190", "meta": [{"k": "일자", "v": "1945-04-25"}, {"k": "시각", "v": "Paris, April 25, 1945—9 p.m. [Received April 25—6 55 p.m.]"}, {"k": "장소", "v": "Paris", "txt": true}, {"k": "전문번호", "v": "2110"}, {"k": "원문출처", "v": "740.00119 Control (Germany)/4–2545: Telegram", "txt": true}, {"k": "발신", "v": "The Ambassador in France (Caffery) 주프랑스대사 캐퍼리", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 190 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d190"}], "summary": "쥐앵 장군이 프랑스 점령지대 요구를 축소할 용의가 있음을 시사했다. 라인강 동쪽 헤센 지역을 포기하고 남부의 바덴과 비스바덴 교두보로 만족하겠다는 것이다.", "points": ["프랑스 총참모장 쥐앵 장군이 미국 고위 장교와의 대화에서 밝힌 내용을 국무부에 「극비 정보」로 보고한 것이다.", "프랑스가 독일 내 자국 지대 제안을 낼 당시, 미국 지대가 동쪽으로 소련 지대까지 뻗고 북쪽에서 병참선이 이어진다는 사실을 몰랐다고 한다.", "프랑스는 헤센다름슈타트의 비행장을 미국이 보유하려는 뜻은 이해할 수 있다고 했다.", "프랑스는 라인강 동쪽의 헤센나사우·오버헤센·헤센다름슈타트를 프랑스 점령지대에 넣자는 제안을 이제 철회할 용의가 있다.", "남부에서는 바덴으로 만족하되, 비스바덴 지역에서는 라인강을 건너는 교두보가 필요하다는 것이다."], "primary": "파리, 1945년 4월 25일 오후 9시.\n [접수 4월 25일 오후 6시 55분]\n\n2110. 다음은 국무부만의 극비 정보로 보내는 것이다.\n\n쥐앵 장군[주72]은 어느 미국 고위 장교와의 대화 중에, 프랑스 측이 독일 내 자국 지대에 관한 제안을 제출했을 당시 미국 지대가 동쪽으로 소련 지대까지 뻗어 있고 북쪽으로부터 병참선이 이어져 있다는 사실을 알지 못했다고 말했다. 더욱이 프랑스 측은 헤센다름슈타트의 비행장들을 우리가 계속 보유하려는 뜻은 이해할 수 있다고 했다. 쥐앵이 내비친 바에 따르면, 프랑스 측은 이제 헤센나사우, 오버헤센 및 라인강 동쪽의 헤센다름슈타트를 프랑스 점령지대에 포함시키자는 제안을 철회할 용의가 있다. 쥐앵의 의견으로는, 프랑스 측은 남부에서는 바덴으로 만족하겠으나 비스바덴 지역에서는 라인강을 건너는 교두보를 필요로 할 것이라고 한다.\n\n캐퍼리(Caffery)", "secondary": "Paris, April 25, 1945—9 p.m. \n [Received April 25—6 55 p.m.]\n\n2110. Following is for the most secret information of the Department:\n\nGeneral Juin [주72] in the course of a conversation with a high American officer stated that when the French submitted their proposals regarding their zone in Germany, they were not aware that the United States zone extended eastward to the Soviet zone with a line of communications from the north. The French could, moreover, understand our desire to retain airfields in Hessen-Darmstadt. According to the indication given by Juin, the French would be willing now to withdraw their proposal to include in the French zone of occupation Hessen-Nassau, Oberhessen and Hessen-Darmstadt east of the Rhine. In Juin’s opinion, the French would be content in the south with Baden, but in the Wiesbaden area, they would require a bridgehead across the Rhine.\n\nCaffery", "notes": ["[주72] 알퐁스 피에르 쥐앵(Alphonse Pierre Juin) 장군, 프랑스 총참모장."], "warn": false, "pages": [], "search": "Caffery 캐퍼리(주프랑스대사) Juin 쥐앵(프랑스 총참모장)"}, {"id": "d191", "order": 191, "date": "1945-04-25", "group": "B", "eyebrow": "d191 · The Department of State to the British Embassy", "title": "국무부가 영국대사관에게", "badge": null, "list_right": "문서 191", "meta": [{"k": "일자", "v": "1945-04-25"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 EAC/10–1944", "txt": true}, {"k": "발신", "v": "The Department of State 국무부", "txt": true}, {"k": "수신", "v": "The British Embassy 영국대사관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 191 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d191"}], "summary": "국무부는 영국 정부가 단서를 붙여 1944년 11월 15일 국무부 각서의 제안을 수락한 것을 환영하며, 이탈리아 정부와 독일 항복 처리에 관한 미·영의 의도를 모스크바·파리에서 통보하도록 대사들에게 훈령한다고 회답했다.", "points": ["국무부는 1945년 4월 5일자 영국대사관 각서를 검토했고, 영국 정부가 일정한 단서를 붙여 1944년 11월 15일자 국무부 각서의 제안을 수락할 수 있는 처지임을 환영한다.", "미국 정부는 영국 정부가 제시한 단서들을 수락한다.", "모스크바와 파리 주재 미국 대사들이 각기 영국 동료와 협의하여, 이탈리아 정부 문제와 독일 항복 처리(surrender arrangements for Germany)에 관한 미·영 양국 정부의 의도를 주재국 정부에 통보하도록 훈령을 받고 있다.", "미·영·소·프 네 나라 대표가 이탈리아 측의 견해를 접수하면, 미국 정부는 이를 유럽자문위원회(EAC) 주재 자국 대표에게 전달하여 위원회에 회부해 심의하게 할 뜻이다."], "primary": "각서(Memorandum)\n\n국무부는 1945년 4월 5일자 영국대사관 각서를 신중히 검토하였으며, 영국 정부가 일정한 단서(provisos)를 붙이는 것을 조건으로 1944년 11월 15일자 국무부 각서[주72a]에 제시된 제안을 수락할 수 있는 처지에 있음을 기쁘게 여긴다. 미합중국 정부는 영국 정부가 제시한 단서들을 수락한다.\n\n영국대사관 각서의 제안에 따라, 모스크바 및 파리 주재 미합중국 대사들은 각기 자국의 영국 측 동료와 협의하여, 이탈리아 정부 및 독일에 대한 항복 처리(the surrender arrangements for Germany)에 관한 미·영 양국 정부의 의도를 각자가 신임장을 제정한 정부에 알리도록 훈령을 받고 있다.[주73]\n\n미합중국, 영국, 소비에트사회주의공화국연방 및 프랑스 임시정부의 대표들이 이탈리아 측의 견해를 접수하게 되면, [243면] 미합중국 정부는 이를 유럽자문위원회 주재 자국 대표에게 전달할 뜻이며, 그 대표가 이를 위원회에 제출하여 심의하게 할 것이다.\n\n워싱턴, 1945년 4월 25일.", "secondary": "Memorandum\n\nThe Department of State has carefully considered the memorandum of the British Embassy of April 5, 1945, and is pleased to note that, subject to certain provisos, the British Government is in a position to accept the suggestions put forward in the memorandum of the Department of November 15, 1944. [주72a] The Government of the United States accepts the provisos suggested by the British Government.\n\nIn accordance with the suggestion in the memorandum of the British Embassy, the Ambassadors of the United States at Moscow and at Paris are being instructed to concert with their respective British colleagues to inform the governments to which they are accredited of the intentions of the United States and British Governments regarding the Italian Government and the surrender arrangements for Germany. [주73]\n\nWhen the Italian views have been received by the representatives of the United States, United Kingdom, Union of Soviet Socialist Republics, and Provisional Government of France, the Government of the [243면] United States intends to forward them to its representative on the European Advisory Commission who will introduce them into the Commission for consideration.\n\nWashington , April 25, 1945.", "notes": ["[주72a] Foreign Relations, 1944, vol. i, p. 83.", "[주73] 4월 20일 오후 7시 모스크바 앞 전보 제921호, 232면 참조."], "warn": false, "pages": ["243"], "search": ""}, {"id": "d192", "order": 192, "date": "1945-04-25", "group": "D", "eyebrow": "d192 · The United States Political Adviser for Germany (Murphy) to the Director of the Office of European Affairs (Matthews)", "title": "대독일 미국 정치고문(머피)이 유럽국장(매슈스)에게", "badge": null, "list_right": "문서 192", "meta": [{"k": "일자", "v": "1945-04-25"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Paris", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 Control (Germany)/4–2545", "txt": true}, {"k": "발신", "v": "The United States Political Adviser for Germany (Murphy) 대독일 미국 정치고문 머피", "txt": true}, {"k": "수신", "v": "The Director of the Office of European Affairs (Matthews) 유럽국장 매슈스", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "서한"}], "links": [{"k": "FRUS", "text": "문서 192 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d192"}], "summary": "머피가 소련이 자국 점령지대에서 다른 연합국을 배제하고 일방적으로 행동하고 있다는 우려를 사신(私信)으로 전하면서, 미군의 소련 지대 점령이 협상력을 높였으나 아이젠하워는 조기 철수 쪽으로 기울어 있다고 알린다.", "points": ["소련이 자국 점령지대에서 다른 연합국 대표를 가능한 한 완전히 배제하려 한다는 확신이 현지에서 커지고 있다.", "그 결과 소련 지대 내 미국 시민과 재산을 보호하기도 어렵고, 통제이사회(Control Council) 정책이 실제로 이행되는지 확인하기도 어려울 것이다.", "소련이 독일 영토의 행정권을 폴란드 임시정부와 「자유독일운동」에 넘기고 있는 데 대한 우려.", "미군이 소련 지대의 상당 부분을 점령한 것은 우리의 협상력을 높여 준다. 그러나 미군 당국은 배치가 군사적으로 가능해지는 대로 소련 지대를 비울 뜻이다.", "영국은 아이젠하워에게 철수를 서두르지 말라는 견해를 제시했으나, 아이젠하워는 소련군과의 충돌을 피하려는 성향이고 점령 부담·실향민 문제 등 실무적 이유로 영국 제안에 반대하는 쪽으로 기운다.", "소련 실향민 100만~200만 명이 우리 손에 들어올 수 있다는 것이 「타는 듯한 현안」의 하나다.", "SHAEF의 송환 담당관 437명 가운데 192명이 소련 측이며, 소련 정부는 곧 300명을 더 내보내겠다고 했다.", "소련 장교의 무단 군사지역 방문, 소련 실향민에게 소련 당국 외에는 복종하지 말라고 선동하는 일 등의 마찰이 있었으나 최근 크게 나아졌다."], "primary": "파리, 1945년 4월 25일.\n\n친애하는 닥(Doc)에게: 점령 이후 독일 관리 문제에 관한 소련의 의도를 두고 이곳의 몇몇 사람이 품고 있는 우려를 국무부도 적어도 어느 정도는 함께하고 있으리라 확신합니다. 소련이 자국 점령지대에서 다른 연합국 대표들을 가능한 한 완전히 배제하려 한다는 확신이 이쪽에서 점점 커지고 있는 듯합니다. 그 결과, 그 지대 안에 있을지 모르는 미국 시민과 재산을 보호하는 일조차 어려울 수 있고, 하물며 그 지대의 사태 전개를 따라가거나 통제이사회의 정책이 실제로 시행되도록 담보하는 일은 더욱 그러할 것입니다. 소련이 독일 영토에 대한 행정권을 폴란드 임시정부[주74]와 자유독일운동[주75] 양쪽에 넘기고 있는 조치를 여러분 모두가 얼마나 주의 깊게 지켜보고 있을지 짐작이 갑니다.\n\n지금 미국 통제이사회단(US Group CC)에 놓인 사정으로 말하자면, 이 조직은 여러 달 동안 제 능력이 닿는 한 러시아 측 대표와의 접촉을 촉구해 왔으나, 우리는 지금까지 소련으로부터 아무런 협조도 받지 못했고 그들 쪽에서 통제이사회의 실효 있는 구성원으로 움직이겠다는 진정한 의사의 조짐도 보지 못했습니다. 다른 한편, 루마니아·불가리아[주76] 및 그 밖의 곳에서 벌어지고 있는 일에 관하여 국무부가 정보 시리즈(Information Series)로 우리에게 보내 주는 자료도 고무적이지 못합니다.\n\n최근 보고몰로프[주77]와 나눈 대화에서, 그가 동부 점령 독일에서의 러시아의 운영에 관해 아는 바가 별로 없을 수는 있다 하더라도, 그들이 일방적 기초 위에서 움직이고 있다는 점만은 분명했습니다.\n\n우리 군이 소련 지대의 상당 부분을 점령하고 있다는 사실은 우리의 교섭상 지위를 향상시켜 줍니다. 그러나 [244면] 우리 군 당국의 의도는 병력 배치가 군사적으로 실행 가능해지는 대로 러시아 지대에서 철수하는 것입니다. 아이젠하워 장군에게 제시된 영국 측 견해는 우리가 병력 철수를 서둘러서는 안 된다는 취지였다고 나는 이해하고 있습니다. 아이젠하워 장군의 성향은 러시아군과의 어떠한 충돌도 피하려는 것이며, 점령 부담, 실향민 보호에 얽힌 방대한 문제, 군정 등에 관련된 실무적 이유에서 영국 측 제안에 반대하는 쪽이라고 봅니다.\n\n우리가 실제로 독일에서 이 문제와 맞붙고 러시아 측 상대역들과 접촉하게 되었을 때 반가운 놀라움이 몇 가지 있기를 바랍니다. 직접 접촉을 방해하는 일만 생기지 않는다면 의혹과 오해의 일부는 풀릴 수 있으리라고 확신합니다.\n\n아시다시피 타는 듯한 현안 가운데 하나는 러시아인 실향민[주78]의 보호 문제이며, 그 가운데 아마도 100만 내지 200만 명이 우리 손에 들어올 것입니다. 우리 SHAEF 장교들이 실향민 업무에 종사하는 소련 대표들과 충실히 협력해 왔음을 나는 확인하고 있습니다. 현재 SHAEF에서 활동하는 송환 담당관 437명 가운데 192명이 소련 측입니다. 최근 소련 정부는 주로 해방된 자국민 가운데서 뽑아 300명을 추가로 내놓겠다고 밝혔습니다. 프랑스 정부에 파견된 드라군(Dragun) 장군 휘하의 소련 군사사절단은 SHAEF 당국으로부터 충분하고 실효 있는 협조를 받고 있습니다. 이 협조는 때때로 소련 장교들의 무단 군사지역 방문, 소련 실향민들에게 소련 당국 외에는 어떤 권력에도 복종하지 말라고 부추기는 일 등에서 비롯된 어려움을 겪기도 했으나, 최근 이 사정은 크게 개선되었습니다.\n\n언제나 당신의 벗,\n\n밥(Bob)", "secondary": "Paris, April 25, 1945.\n\nDear Doc: I am sure that the Department shares to a degree at least the apprehension of some of us over here regarding Soviet intentions in respect of the administration of Germany after occupation. The conviction seems to be growing on this side that they want to exclude other Allied representatives from the Soviet zone of occupation as completely as possible. It may be difficult, as a result, to protect whatever American citizens and property there may be in that zone, much less to follow developments in the zone or to ensure that Control Council policies are actually carried out. I can imagine how carefully you are all following the Soviet action in transferring administrative power over German territory to both the Provisional Polish Government [주74] and to the Free Germany Movement. [주75]\n\nAs matters now rest with the US Group CC which for months has been urging to the extent of its ability contact with Russian representatives, we have had thus far no assistance from the Soviet Union and no indication of a real intention on their part to operate as an effective element of the Control Council. On the other hand, the data which the Department sends to us in the Information Series regarding what is happening in Rumania, Bulgaria [주76] and elsewhere is not encouraging.\n\nIn a recent conversation with Bogomolov [주77] it was obvious that while he might possess but little information regarding Russian operations in Eastern occupied Germany, it was clear that they are operating on a unilateral basis.\n\nThe occupation by our forces of a considerable portion of the Soviet zone gives us an improved bargaining position. However, it is [244면] the intention of our military authorities to evacuate the Russian zone as soon as deployment becomes militarily practicable. I gather that a British view presented to General Eisenhower was to the effect that we should not be in a hurry to withdraw our troops. I believe that General Eisenhower’s tendency is to avoid any conflict with the Russian forces and to disapprove the British suggestion for practical reasons relating to occupational burdens, the vast problem connected with the care of displaced persons, military governments, etc.\n\nI hope that we may have some agreeable surprises when we actually come to grips with the problem in Germany and are placed in contact with our Russian opposite numbers. I am confident that some of the doubt and misunderstanding may be cleared up if nothing happens to interfere with direct contact.\n\nAs you know, one of the burning issues is the care of Russian displaced persons [주78] of whom possibly one or two millions will fall into our hands. I find that our SHAEF officers have cooperated loyally with the Soviet representatives engaged in displaced persons duty. Of 437 repatriation officers now operating out of SHAEF, 192 are Soviet. Recently the Soviet Government stated it would soon make available an additional 300. drawn principally from liberated citizens. The Soviet Military Mission under General Dragun, accredited to the French Government, receives full and effective cooperation from SHAEF authorities. This cooperation has at times been attended by difficulties resulting from unauthorized visits by Soviet officers to military zones, exhortation to Soviet displaced persons not to obey any authority but Soviet, etc. but lately this situation has vastly improved.\n\nYours ever,\n\nBob", "notes": ["[주74] 폴란드 국경 획정과 독일 영토에 대한 행정권의 폴란드 이양에 관한 미국의 관심을 다룬 문서는 제5권 110면 이하 참조.", "[주75] 소련 내에 억류된 독일군 포로들로 소련이 후원하여 조직한 단체. 이 주제에 관한 문서는 1033면 이하 참조.", "[주76] 불가리아 및 루마니아 연합국통제이사회에 대한 미국의 참여에 관한 문서는 각기 제4권 135면 이하, 제5권 464면 이하 참조.", "[주77] 알렉산드르 예프레모비치 보고몰로프(Alexander Efremovich Bogomolov), 주프랑스 소련대사.", "[주78] 러시아인 실향민에 관한 문서는 제5권 1067면 이하 참조."], "warn": false, "pages": ["244"], "search": "Murphy 머피(대독일 미국 정치고문) Matthews 매슈스(유럽국장, 애칭 Doc 닥) Bogomolov 보고몰로프(주프랑스 소련대사) Eisenhower 아이젠하워 Dragun 드라군(소련 군사사절단장)"}, {"id": "d509", "order": 509, "date": "1945-04-25", "group": "A", "eyebrow": "d509 · The Minister in Switzerland (Harrison) to the Secretary of State", "title": "주스위스 공사(해리슨)가 국무장관에게", "badge": null, "list_right": "문서 509", "meta": [{"k": "일자", "v": "1945-04-25"}, {"k": "시각", "v": "Bern, April 25, 1945. [Received April 25—5 p.m.]"}, {"k": "장소", "v": "Bern", "txt": true}, {"k": "전문번호", "v": "2438"}, {"k": "원문출처", "v": "711.62114A/4–2545: Telegram", "txt": true}, {"k": "발신", "v": "The Minister in Switzerland (Harrison) 주스위스 공사 해리슨", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 509 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d509"}], "summary": "스위스 외무부가 연합군 진격 시 포로를 수용소에 남겨 두라는 미국의 요구를 베를린에 타전하고, 독일 측 제안과 미국의 수락을 담은 각서를 베른 주재 독일공사관에 전달했다고 보고한다.", "points": ["스위스 외무부의 4월 24일자 각서에 따르면, 문제의 전언은 베를린 주재 스위스공사관으로 타전되었다.", "이에 더하여 외무부는 국무부의 희망에 따라, 독일 측 제안의 조건과 그에 대한 미국의 수락을 담은 각서(aide-mémoire)를 베른 주재 독일공사관에 전달했다.", "그 각서는 4월 21일자이며 같은 날 독일공사관에 전달되었다.", "국무부의 원 훈령(1507호, 4월 19일)은 연합군이 진격할 때 모든 전쟁포로를 수용소에 그대로 두어야 한다고 독일 정부에 알리라는 것이었다.[주12]"], "primary": "베른, 1945년 4월 25일.\n[접수 4월 25일 오후 5시]\n\n2438. 귀 제1507호, 4월 19일자에 대하여.[주12] 4월 24일자 외무부 각서는 그 전언이 베를린 주재 스위스공사관으로 타전되었다고 밝히고 있다. 이에 더하여, 국무부의 희망에 따라 외무부는 독일 측 제안의 조건과 미합중국이 이를 수락한 사실을 담은 각서(aide-mémoire)를 베른 주재 독일공사관에 전달하였다. 4월 21일자인 이 각서는 같은 날 독일공사관에 전달되었다.\n\n해리슨(Harrison)\n\n독일의 항복으로 이어진 교섭 및 유럽에서의 적대행위 종결[주13]", "secondary": "Bern, April 25, 1945.\n[Received April 25—5 p.m.]\n\n2438. Your 1507, April 19th. [주12] Foreign Office note April 24 states message telegraphed Swiss Legation Berlin. Additionally, in accordance desire of Department, Foreign Office transmitted aide-mémoire containing terms of German proposal and acceptance thereof by United States to German Legation Bern. This aide-mémoire dated April 21 delivered same day German Legation.\n\nHarrison\n\nNegotiations leading to the surrender of Germany; termination of hostilities in Europe [주13]", "notes": ["[주12] 수록하지 않음. 이 전보는 연합국이 진격함에 따라 모든 전쟁포로를 수용소에 그대로 남겨 두어야 한다는 뜻을 독일 정부에 알리도록 공사에게 훈령한 것이다(711.62114A/4–1145).", "[주13] 앞선 관련 문서에 관하여는 Foreign Relations, 1944, vol. i, pp. 100 ff.; 또한 앞의 160면 이하 참조. 독일 항복에 관한 추가 자료는 Forrest C. Pogue, The Supreme Command(미 육군 공간사 United States Army in World War II: The European Theater of Operations, 워싱턴, 정부인쇄국, 1954), pp. 475 ff.에 실려 있다."], "warn": false, "pages": [], "search": "Harrison 해리슨(주스위스 공사)"}, {"id": "d548", "order": 548, "date": "1945-04-25", "group": "A", "eyebrow": "d548 · The Minister in Sweden (Johnson) to the Secretary of State", "title": "주스웨덴 공사(존슨)가 국무장관에게", "badge": null, "list_right": "문서 548", "meta": [{"k": "일자", "v": "1945-04-25"}, {"k": "시각", "v": "Stockholm, April 25, 1945—3 a.m. [Received 8:40 a.m.]"}, {"k": "장소", "v": "Stockholm", "txt": true}, {"k": "전문번호", "v": "1528"}, {"k": "원문출처", "v": "740.00119 EW/4–2545: Telegram", "txt": true}, {"k": "발신", "v": "The Minister in Sweden (Johnson) 주스웨덴 공사 존슨", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 548 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d548"}], "summary": "힘러가 4월 24일 새벽 뤼베크에서 베르나도테 백작을 만나 서부전선 전체의 항복을 아이젠하워에게 하겠다는 뜻을 스웨덴 정부를 통해 전해 달라고 요청했다는 보고.", "points": ["스웨덴 외무장관 귄테르가 4월 24일 밤 11시에 영국 공사와 미국 공사를 불러, 독일에서 막 돌아온 베르나도테 백작 및 보에만과 함께 만났다.", "힘러와 베르나도테의 회담은 4월 24일 오전 1시 뤼베크에서 이루어졌다.", "힘러는 히틀러가 위중하여 이미 죽었거나 이틀 넘게 살지 못할 것이라 말했고, 셸렌베르크는 히틀러가 뇌출혈을 앓고 있다고 전했다.", "힘러는 히틀러가 끝났으므로 이제 자신이 완전한 권한을 가지고 행동할 수 있는 위치라고 주장했다.", "힘러의 요청: 스웨덴 정부가 개입하여 자신과 아이젠하워 장군의 회담을 주선할 것. 목적은 네덜란드를 포함한 서부전선 전체에서 항복(capitulate)하는 것이다.", "베르나도테는 노르웨이와 덴마크가 포함되지 않으면 이 요청을 전달할 뜻이 없다고 했고, 힘러는 노르웨이·덴마크 주둔군에게 미·영·스웨덴군에 항복하도록 명령하겠다고 답했다.", "힘러는 동부전선에서는 적어도 한동안 계속 싸우기를 바랐다. 베르나도테는 그것이 실행 불가능하며 연합국이 받아들이지 않으리라고 했다.", "힘러는 민간인을 위해 러시아군보다 연합국이 먼저 북·서부 독일(예컨대 메클렌부르크)에 들어오기를 바라는 인상이었다.", "말렛과 존슨은 힘러의 동부전선 항복 거부가 서방 연합국과 러시아 사이를 이간하려는 마지막 시도로 보인다고 지적했고, 귄테르와 보에만은 그 동기를 배제할 수는 없으나 그럼에도 큰 이득이라고 반박했다.", "스웨덴이 소련에 직접 알릴 수 없는 유일한 이유는 힘러가 이 정보를 서방 연합국 전용으로 못 박았기 때문이며, 미·영이 소련에 전달하는 것은 자유라고 했다.", "이 전보는 오후 4시 22분에 샌프란시스코의 국무장관에게 재전송되었고, 트루먼 대통령에게는 오후 2시 이후에야 전달된 것으로 보인다.[주18]"], "primary": "스톡홀름, 1945년 4월 25일 오전 3시.\n [접수 오전 8시 40분[주18]]\n\n1528. 귄테르(Günther) 외무장관이 오늘 저녁 11시에 영국 공사[주19]와 나를 불러, 그 자신과 보에만 씨[주20], 그리고 독일에서 막 돌아온 베르나도테 백작[주21]과 자리를 함께하게 했다. [760면] 베르나도테 백작은 4월 23일 덴마크 국경 가까운 플렌스부르크에 있었다. 독일 동부전선 어딘가에 있던 힘러가 베르나도테 백작을 긴급히 만나고 싶다는 전언을 보내 왔고, 백작은 뤼베크에서 그를 만나겠다고 말했다. 이 회담은 4월 24일 오전 1시에 이루어졌다. 베르나도테가 전하는 바로는, 힘러는 지쳐 있었고 독일이 끝났음을 인정하면서도 침착하고 조리가 있었다. 힘러는 히틀러가 몹시 위중하여 이미 죽었을 수도 있고 이틀 이상 살아 있으리라 기대할 수 없다고 그에게 말했다(힘러의 심복 참모 셸렌베르크 장군[주22]은 히틀러가 뇌출혈을 앓고 있다고 베르나도테에게 말했다). 힘러는, 히틀러가 아직 활동하고 있었다면 자신이 지금 취하려는 조치를 취할 수 없었을 것이나, 히틀러가 끝난 이상 자신이 행동할 수 있는 완전한 권한을 가진 위치에 있다고 말했다. 그는 베르나도테 백작에게, 자신이 아이젠하워 장군과 만나도록 스웨덴 정부가 주선에 나서 달라는 요청을 스웨덴 정부에 전달해 달라고 청했다. 이 회담의 목적은 (네덜란드를 포함한) 서부전선 전체에서 항복(capitulate)하는 것이었다. 베르나도테는 그러한 회담은 필요하지 않으며 힘러가 그저 자기 부대에 항복을 명령하면 될 일이라고 말했고, 노르웨이와 덴마크가 항복에 포함되지 않는다면 이 요청을 스웨덴 정부에 전달할 뜻이 없다고 했다. 덴마크와 노르웨이에서 독일이 어떻게, 누구에게 항복할 것인가에 관한 특수한 기술적 조치 때문에, 아이젠하워 장군과 힘러의 회담에 어느 정도 의의가 있을 수도 있겠다고 베르나도테는 말했다. 힘러는 노르웨이와 덴마크의 자기 부대에 미군, 영국군 또는 스웨덴군에 항복하도록 명령하겠다고 말했다. 그는 동부전선에서는 적어도 한동안 계속 싸울 수 있기를 바랐다. 베르나도테는 그것이 실제로 실행하기 어려울 것이며 연합국에게 받아들여지지 않으리라고 말했다. 베르나도테는, 힘러가 민간 주민을 위하여 러시아군보다 연합국이 먼저 북부 및 서부 독일로, 이를테면 (힘러가 언급한 지역인) 메클렌부르크로 들어오기를 바라고 있다는 인상을 받았다.\n\n셸렌베르크 장군은 덴마크 국경에 가까운 플렌스부르크에서 베르나도테가 전해 줄 수 있는 어떤 소식이든 애타게 기다리고 있다. 그는 힘러와 시간 단위로 연락하고 있으며, 보내고자 하는 어떤 전언이든 즉시 그에게 전달되도록 할 수 있다.\n\n귄테르 씨는 이 정보가 대단히 중요하므로 미국 정부와 영국 정부에 즉시 전달되어야 한다고 생각했다.\n\n[761면]\n\n빅터 말렛 경과 나는 둘 다, 힘러가 동부전선에서 실제로 항복을 명령하기를 거부하는 것은 서방 연합국과 러시아 사이에 불화를 뿌리려는 마지막 시도로 보인다고 지적했다. 나치가 모든 연합국에게 동시에 항복해야 한다는 것은 명백하기 때문이다. 귄테르 씨와 보에만 씨는 그러한 동기를 배제할 수 없다고 인정하면서도, 나치 수뇌가 서부전선 전체와 노르웨이·덴마크의 모든 부대에 항복을 명령하리라는 사실은 러시아를 포함한 모든 연합국에게 큰 이익임에 틀림없으며 실제로 이른 시일 안의 전면 항복으로 이어질 것이라고 지적했다. 어떻든 귄테르 씨는 베르나도테 백작의 정보가 영국 및 미국 정부에 전달되어야 한다고 생각했으며, 스웨덴 정부에 관한 한 그 두 정부가 이를 소련 정부에 전달하는 것은 전적으로 자유라고 했다. 스웨덴은 연합국 사이에 불화를 뿌리려는 어떠한 시도를 조장하는 도구가 결코 되지 않을 것이며 그렇게 여겨지지도 않을 것이기 때문이다. 스웨덴 정부가 이 정보를 소련 정부에 직접 전달할 수 없는 유일한 이유는, 힘러가 베르나도테 백작에게 이것이 오로지 서방 연합국만을 위한 것이라고 못 박았기 때문이다.\n\n베르나도테 백작은, 힘러의 이 제안에 아무런 반응도 나오지 않는다면 아마도 불필요한 고통과 인명 손실이 많이 뒤따르게 되리라는 의견이다.\n\n존슨(Johnson)", "secondary": "Stockholm, April 25, 1945—3 a.m. \n [Received 8:40 a.m. [주18] ]\n\n1528. Foreign Minister Günther sent for the British Minister [주19] and me at 11 o’clock this evening to meet with him, Mr. Boheman, [주20] [and] Count Bernadotte [주21] who has just returned from Germany. [760면] Count Bernadotte was on April 23 at Flensburg near Danish border. Himmler who was at some point on German eastern front sent word that he wanted to see Count Bernadotte urgently and the latter said that he would meet him at Lübeck. This meeting took place at 1 o’clock in the morning April 24. Bernadotte reports that Himmler although tired and admitting that Germany was finished, was calm and coherent. Himmler told him that Hitler was so ill that he might be already dead or could not be expected to live more than 2 days longer (General Schellenberg, [주22] Himmler’s confidential staff officer, told Bernadotte that Hitler was suffering from brain hemorrhage). Himmler said that while Hitler was still active he would not have been able to take the step he now proposed to take but as Hitler was finished he, Himmler, is in a position of full authority to act. He asked Count Bernadotte to forward to the Swedish Government his request that the Swedish Government should intervene in order to arrange for him to meet General Eisenhower. The purpose of this meeting would be to capitulate on the whole western front (including the Netherlands). Bernadotte remarked that such a meeting was not necessary as Himmler could simply order his troops to capitulate and that he was not willing to forward this request to the Swedish Government if Norway and Denmark were not included in the capitulation. Because of special technical arrangements in regard to how and to whom Germany would capitulate in Denmark and Norway Bernadotte remarked that in his opinion there might be some point to a meeting between General Eisenhower and Himmler. Himmler said that he would order his troops in Norway and Denmark to surrender to American, British or Swedish troops. He hoped to be able to continue to fight on the eastern front at least for a time. Bernadotte said that this would be scarcely possible to put in practice and would not be acceptable to the Allies. Bernadotte had the impression that Himmler hopes the Allies would be the first to enter into northern and western Germany into Mecklenburg for instance, which district was mentioned by Himmler) rather than the Russians for the sake of the civilian population.\n\nGeneral Schellenberg is in Flensburg near the Danish border eagerly waiting to hear anything which Bernadotte can convey to him. He is in hourly contact with Himmler and could ensure immediate delivery to him of any message it may be desired to send.\n\nMr. Günther thought this information was of such importance that it should be communicated at once to the American and British Governments.\n\n[761면]\n\nBoth Sir Victor Mallet and I remarked that Himmler’s refusal actually to order surrender on the eastern front looked like a last attempt to sow discord between the western Allies and Russia because obviously the Nazis would have to surrender simultaneously to all the Allies. Mr. Günther and Mr. Boheman while admitting this motive could not be excluded pointed out that the fact that the Nazi chief would order capitulation of all troops on the whole Western Front and in Norway and Denmark must be of great advantage to all the Allies including Russia and would in fact lead to early total capitulation. In any case Mr. Günther thought that Count Bernadotte’s information should be passed on to the British and American Governments who were, as far as the Swedish Government was concerned, at complete liberty to transmit it to the Soviet Government as Sweden would in no way be or thought to be an instrument in promoting any attempt to sow discord between the Allies. The only reason the Swedish Government could not convey this information directly to the Soviet Government was because Himmler had stipulated to Count Bernadotte that it was exclusively for the western Allies.\n\nCount Bernadotte is of the opinion that if no reaction at all is forthcoming to this proposal of Himmler’s it would probably result in a lot of unnecessary suffering and loss of human life.\n\nJohnson", "notes": ["[주18] 이 전보는 당시 샌프란시스코에서 국제연합 회의에 참석 중이던 국무장관에게 오후 4시 22분에 재전송되었다. 트루먼 대통령에게는 오후 2시 이후에야 전달된 것으로 보인다. 처칠 총리와의 전화 대화 녹취(762면)를 보라. 또한 Leahy, I Was There, p. 355를 대조하라. 거기에는 그루 국무장관 대리가 총리와의 전화 대화가 끝난 직후 대통령에게 이 전보를 전달했다고 적혀 있다.", "[주19] 빅터 A. L. 말렛(Sir Victor A. L. Mallet) 경.", "[주20] 에리크 C. 보에만(Erik C. Boheman), 스웨덴 외무부 차관.", "[주21] 폴케 베르나도테(Folke Bernadotte) 백작, 스웨덴 적십자사 총재. 1945년 그의 독일 내 활동에 관하여는 Count Folke Bernadotte, The Curtain Falls, 에리크 레벤하우프트 백작 옮김(뉴욕, Knopf, 1945) 참조.", "[주22] 발터 셸렌베르크(Walter Schellenberg), 제국보안본부 제6국(Amt VI) 국장."], "warn": false, "pages": ["760", "761"], "search": "Johnson 존슨(주스웨덴 공사) Günther 귄테르(스웨덴 외무장관) Mallet 말렛(주스웨덴 영국 공사) Boheman 보에만(스웨덴 외무부 차관) Bernadotte 베르나도테(스웨덴 적십자사 총재) Himmler 힘러 Hitler 히틀러 Schellenberg 셸렌베르크 Eisenhower 아이젠하워"}, {"id": "d549", "order": 549, "date": "1945-04-25", "group": "A", "eyebrow": "d549 · The British Prime Minister (Churchill) to President Truman  Neither the time of dispatch nor the time of receipt is indicated on the file copy of this telegram. In his memoirs Prime Minister Churchill suggests that it was sent in the morning, London time (Churchill, Triumph and Tragedy, p. 536). The transcript of the telephone conversation between Mr. Churchill and President Truman, infra, indicates that this telegram had not been received in Washington by 2:10 p.m., Washington time (8:10 p.m. London time). The paraphrase here reproduced was transmitted to H. Freeman Matthews, Director of the Office of European Affairs, by Michael Wright, First Secretary of the British Embassy in Washington, on April 26.", "title": "영국 총리(처칠)가 트루먼 대통령에게", "badge": null, "list_right": "문서 549", "meta": [{"k": "일자", "v": "1945-04-25"}, {"k": "시각", "v": "발송·접수 시각이 파일 사본에 표시되어 있지 않다. 처칠은 회고록에서 런던 시간으로 오전에 발송되었다고 시사한다.[주23]"}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "16"}, {"k": "원문출처", "v": "740.00119 EW/4–2645", "txt": true}, {"k": "발신", "v": "The British Prime Minister (Churchill) 영국 총리 처칠", "txt": true}, {"k": "수신", "v": "President Truman 트루먼 대통령", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 549 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d549"}], "summary": "처칠이 힘러-베르나도테 회담 보고를 받고 즉시 전시내각을 소집해 스탈린에게 보낼 전문을 승인받았음을 알리고, 트루먼도 같은 취지로 타전해 주기를 바란다고 요청한다.", "points": ["트루먼도 몇 시간 전에 스톡홀름 주재 미국 공사의 힘러-베르나도테 회담 보고를 받았을 것으로 본다.", "처칠은 즉시 전시내각을 소집했고, 내각은 스탈린 원수에게 보내는 전문을 즉각 승인했다. 그 전문은 통상 경로로 트루먼에게도 재전송된다.", "트루먼도 스탈린과 영국에 같은 취지로 타전해 주기를 바란다.", "힘러가 「누구든 그럴 수 있는 만큼」 독일 국가를 대변하고 있으므로, 스웨덴 정부를 통해 그에게 보낼 회답은 원칙상 3대국의 문제다. 어느 한 나라도 단독 교섭에 들어갈 수 없다.", "다만 이 사실은 아이젠하워 장군이나 알렉산더 원수가 현지에서 발생하는 국지적 항복(local surrenders)을 접수할 권한을 조금도 폐기하지 않는다."], "primary": "[런던,] 1945년 4월 25일.\n\n16. 귀하도 몇 시간 전에 귀국 대사가 스톡홀름에서 보낸, 베르나도테와 힘러의 회담에 관한 보고를 받았을 것으로 봅니다. 나는 즉시 전시내각을 소집했고, 내각은 우리가 스탈린 원수에게 보내며 통상 경로를 통해 귀하에게도 재전송하는 다음 전문을 즉각 승인했습니다. 우리는 귀하도 스탈린 원수와 우리에게 같은 취지로 타전하는 것이 가능하기를 바랍니다. 힘러가 누구든 그럴 수 있는 만큼은 명백히 독일 국가를 대변하고 있으므로, 스웨덴 정부를 통해 그에게 보내야 할 회답은 원칙상 3대국의 문제입니다. 우리 가운데 어느 누구도 단독 교섭에 들어갈 수 없기 때문입니다. 그러나 이 사실은 [762면] 아이젠하워 장군이나 알렉산더 원수가 현지에서 발생하는 국지적 항복(local surrenders)을 접수할 권한을 어떤 식으로도 폐기하지 않습니다.", "secondary": "[London,] April 25, 1945.\n\n16. You will no doubt have received some hours ago the report from Stockholm by your Ambassador on Bernadotte-Himmler talks. I called the War Cabinet together at once and they approved immediately following message which we are sending to Marshal Stalin and repeating through usual channels to you. We hope that you will find it possible to telegraph to Marshal Stalin and to us in the same sense. As Himmler is evidently speaking for the German State, as much as anybody can, the reply that should be sent him through Swedish Government is in principle a matter for triple powers, since no one of us can enter into separate negotiations. This fact however in no [762면] way abrogates General Eisenhower’s or Field Marshal Alexander’s authority to accept the local surrenders as they occur.", "notes": ["[주23] 이 전보의 파일 사본에는 발송 시각도 접수 시각도 표시되어 있지 않다. 처칠 총리는 회고록에서 런던 시간으로 오전에 발송되었다고 시사한다(Churchill, Triumph and Tragedy, p. 536). 처칠 씨와 트루먼 대통령의 전화 대화 녹취(바로 다음 문서)는 이 전보가 워싱턴 시간 오후 2시 10분(런던 시간 오후 8시 10분)까지 워싱턴에 접수되지 않았음을 보여 준다. 여기 수록한 의역본(paraphrase)은 1945년 4월 26일 워싱턴 주재 영국대사관 1등서기관 마이클 라이트(Michael Wright)가 유럽국장 H. 프리먼 매슈스에게 전달한 것이다."], "warn": false, "pages": ["762"], "search": "Churchill 처칠 Truman 트루먼 Stalin 스탈린 Himmler 힘러 Bernadotte 베르나도테 Eisenhower 아이젠하워 Alexander 알렉산더(원수)"}, {"id": "d550", "order": 550, "date": "1945-04-25", "group": "C", "eyebrow": "d550 · Transcript of Trans-Atlantic Telephone Conversation Between President Truman and British Prime Minister Churchill  The time when this conversation took place is not indicated on the transcript. Prime Minister Churchill (Triumph and Tragedy, p. 536) states that it took place on April 25 at 8:10 p.m., London time. Admiral Leahy (I Was There, p. 415) says that it occurred shortly after 2 p.m., Washington time. The Department of State press release of May 2 giving a chronological account of the Himmler surrender offer places the conversation in the “early afternoon” of April 25 (Department of State Bulletin, May 6, p. 863). Corrections (except in cases of minor variations) have been supplied by the Editors on the basis of the related texts in Stalin’s Correspondence, vol. i, pp. 332 ff., and Churchill, Triumph and Tragedy, pp. 534 ff.", "title": "트루먼 대통령과 영국 총리 처칠의 대서양 횡단 전화 대화 녹취", "badge": null, "list_right": "문서 550", "meta": [{"k": "일자", "v": "1945-04-25"}, {"k": "시각", "v": "April 25, 1945, 2:10 p.m. (워싱턴 시간 / 런던 시간 8:10 p.m.)"}, {"k": "장소", "v": "Washington — London", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 B.W./4–2545", "txt": true}, {"k": "발신", "v": "President Truman 트루먼 대통령", "txt": true}, {"k": "수신", "v": "The British Prime Minister (Churchill) 영국 총리 처칠", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전화 비망록"}], "links": [{"k": "FRUS", "text": "문서 550 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d550"}], "summary": "힘러의 서부전선 단독 항복 제의를 두고 트루먼과 처칠이 통화하여, 3대국에 대한 동시 무조건항복 외에는 받아들일 수 없다는 데 합의하고 각자 스탈린에게 같은 취지로 타전하기로 한다.", "points": ["통화 시각은 녹취에 표시되어 있지 않으나 워싱턴 시간 오후 2시 10분(런던 시간 오후 8시 10분)으로 보인다.[주24]", "트루먼은 통화 시점에 스톡홀름 전보를 아직 받지 못했고, 그러한 제안이 존재한다는 짧은 전언만 가지고 있었다. 「지금 귀하에게서 받고 있는 것 외에는 다른 정보가 없습니다.」", "처칠이 스톡홀름 주재 영국대사의 전보를 전화로 읽어 준다(녹취에는 낭독 부분이 일부만 남아 있다).", "트루먼: 「그는 러시아, 귀국, 미국 세 정부 모두에 항복하도록 강제되어야 한다고 봅니다. 조각조각의 항복(piecemeal surrender)은 고려조차 해서는 안 됩니다.」", "처칠: 힘러 같은 자에게 조각난 항복은 안 된다. 힘러가 「누구든 그럴 수 있는 만큼」 독일 국가를 대변하므로 교섭은 세 정부와 이루어져야 한다.", "다만 국지적 항복(local surrender)을 아이젠하워가 접수할 권한은 여전하다는 점을 처칠이 확인하고 트루먼이 동의한다.", "처칠은 트루먼의 회답을 기다리며 스탈린 앞 전보를 약 두 시간 붙들고 있다가 이미 발송했다고 밝힌다.", "트루먼은 처칠이 스탈린에게 보낸 전문을 천천히 다시 읽어 달라고 두 번 청하며, 같은 취지의 전문을 자신도 즉시 보내겠다고 한다.", "힘러의 동부전선 항복 거부는 서방 연합국과 러시아를 이간하려는 마지막 시도로 보인다는 데 두 사람이 일치한다.", "엘베강 합류(link-up)를 알리는 녹음 성명은 예정대로 발표하기로 한다.[주30a]", "처칠: 「폴란드 문제에 관하여 귀하가 하신 모든 일에 전적으로 동의합니다. 우리는 손을 맞잡고 함께 걷고 있습니다.」 이어서 「사실 나는 귀하의 지도를 따르며, 이 문제에서 무엇을 하시든 뒷받침하겠습니다.」", "대화를 끝맺는 것은 트루먼이다. 「고맙습니다. 안녕히 주무십시오.」"], "primary": "1945년 4월 25일, 오후 2시 10분.\n\n**처칠:** 대통령 각하이십니까?\n\n**트루먼:** 대통령입니다, 총리 각하.\n\n**처칠:** 목소리를 듣게 되어 얼마나 기쁜지 모르겠습니다.\n\n**트루먼:** 대단히 고맙습니다. 저도 각하의 목소리를 듣게 되어 기쁩니다.\n\n**처칠:** 프랭클린과는 여러 차례 이야기를 나누었습니다만 …[주25] 귀국 대사가 스톡홀름에서 보낸 보고를 받으셨습니까?\n\n**트루먼:** 예, 받았습니다.[주26]\n\n**처칠:** 그 제안에 관한 것 말입니다.\n\n**트루먼:** 예. 그런 제안이 존재한다는 짧은 전언만 받았습니다.\n\n**처칠:** 예, 물론 그것은 …[주25] 우리는 그것이 매우 좋아 보인다고 생각했습니다.\n\n**트루먼:** 그에게 항복시킬 것이 있기는 합니까?\n\n**처칠:** 나는 전시내각을 소집했고, 그들은 내가 스탈린에게 알리고자 타전하는 것과 통상 경로를 통해 우리 소식을 귀하에게 재전송하는 것에 반대했습니다[승인했습니까?].\n\n**트루먼:** 그가 항복시킬 것이 무엇입니까? 그것은 모든 것, 노르웨이, 덴마크, 이탈리아, 네덜란드를 뜻합니까?\n\n**처칠:** 그들은 이탈리아와 유고슬라비아를 언급했습니다. 우리는 모든 것을 언급했고 거기에 덴마크와 노르웨이를 넣도록 포함시켰습니다. 서부전선의 모든 것입니다. 그러나 그는 동부전선에서는 항복하겠다고 제의하지 않았습니다. 그래서 우리는 아마도 그것을 스탈린에게 보고할 필요가 있으리라고 생각했습니다. 즉, 우리 견해로는 항복이 동시적이어야 하며 우리 조건에 동의해야 한다고 말입니다.\n\n**트루먼:** 나는 그가 러시아, 귀국, 그리고 미합중국 세 정부 모두에게 항복하도록 강제되어야 한다고 봅니다. 우리는 조각조각의 항복(piecemeal surrender)은 고려조차 해서는 안 된다고 생각합니다.\n\n**처칠:** 아닙니다, 아닙니다, 아닙니다. 힘러 같은 자에게 조각난 항복은 안 됩니다. 힘러는 누구든 그럴 수 있는 만큼은 [763면] 독일 국가를 대변하게 될 것입니다. 그러므로 우리는 그의 교섭이 세 정부와 더불어 이루어져야 한다고 생각했습니다.\n\n**트루먼:** 옳습니다. 바로 그것이 내가 느끼는 그대로입니다.\n\n**처칠:** 물론 나는 그것이 전선에서의 국지적 항복, 힘러의 연합 전선에서의 항복이라는 점을 압니다. 그리고 아이젠하워는 여전히 그 항복을 받을[take?] 권한을 가지고 있으니, 그렇다면 그는 항복하기를 바랄 것입니다.\n\n**트루먼:** 예, 물론입니다.\n\n**처칠:** 그 점을 이해하십니까?\n\n**트루먼:** 이해합니다. 그가 독일 정부 전체를 대변하고 있다면, 거기에는 모든 것의 항복이 포함되어야 하고, 그것은 세 정부 모두에 대한 것이어야 합니다.\n\n**처칠:** 물론입니다. 우리가 실제로 보낸 것은, 폐하의 정부에 관한 한 3대 강국에 대한 동시적 무조건항복에 못 미치는 어떤 것도 문제가 될 수 없다는 내용이었습니다.\n\n**트루먼:** 좋습니다. 그것에 동의합니다.\n\n**처칠:** 러시아 측에 이미 무엇인가 말씀하셨습니까?\n\n**트루먼:** 아닙니다, 하지 않았습니다. 나는 귀하로부터 소식을 듣기를 기다리고 있었습니다. 스톡홀름에서 온 전언을 아직 받지 못했습니다. 지금 귀하가 나에게 주고 계신 이 정보가 이 문제에 관하여 내가 가진 유일한 정보이며, 그 밖에는 귀하의 대화가 귀하가 스톡홀름에서 받은 전언에 근거한 것이라는 통보를 받았을 뿐입니다.\n\n**처칠:** 그렇습니까.\n\n**트루먼:** 나는 지금 귀하로부터 받고 있는 것 외에는 다른 정보가 없습니다.\n\n**처칠:** 알겠습니다. 스톡홀름 주재 우리 대사가 나에게 보낸 전언을 드릴 수 있습니다. 읽어 드릴까요?\n\n**트루먼:** 그렇게 해 주신다면 대단히 고맙겠습니다.\n\n**처칠:** 예. 조금 깁니다. 들어오는 대로 잘 들리지 않으면 말씀해 주십시오.\n\n잘 들으셨습니까?\n\n**트루먼:** 예, 들었습니다.\n\n[764면]\n\n**처칠:** 그리고 힘러 참모진의 피니스베르크[셸렌베르크] 장군이 베르나도테에게 그것이 뇌출혈이라고 말했습니다.\n\n4. 그 진술에서 [힘러는] 히틀러가 아직 활동하고 있었다면 자신이 지금 제안하는 조치들을 취할 수 없었을 것이나, 히틀러 씨가 끝난 이상 자신이 이제 행동할 완전한 권한을 가진 위치에 있다고 [말했습니다]. 그리고 그는 베르나도테에게, 서부전선 전체에서 항복(capitulate)하기 위하여 자신이 아이젠하워 장군과 만날 수 있도록 스웨덴 정부가 주선해 주었으면[줄 수 있었으면] 하는 자신의 희망을 그들에게 전달해 달라고 청했습니다. 베르나도테는 (베르나도테는 스웨덴 사람이고 스웨덴 적십자 사람입니다) 힘러가 그저 자기 부대에 항복을 명령하면 될 일이므로 그러한 회담은 필요하지 않다고 말했습니다. 그 발표는 그에게 요구했습니다[그는 …할 뜻이 없었습니다] 힘러의 요청을 스웨덴 정부에 전달하는 것을, 그리고 노르웨이와 덴마크가 이 항복에 포함된다면[포함되지 않는 한]. 만일 그러하다면, 독일군이 그 두 나라에서 무기를 내려놓게 될 경우 아이젠하워 및 드골[주28]과 특수한 기술적 조치를 마련해야 할 수도 있으므로 회담에 어느 정도 의의가 있을 수 있다는 것이었습니다. 그러자 그는 덴마크와 노르웨이의 부대에 영국군, 미군 또는 스웨덴군 어느 쪽에든 항복하도록 명령할 준비가 되어 있다고 답했습니다.\n\n5. 그는 거기서[힘러는?] 동부전선에서 적어도 한동안 저항을 계속하기를 바라고 있는데, 베르나도테는 그에게 그것이 거의 불가능하며 실제로 연합국에게 받아들여지지 않으리라고 말했습니다. 힘러는 예컨대 민간 주민을 구하기 위하여 러시아군이 아니라 서방 연합국이 먼저 이 조치를 취하기를[메클렌부르크에 들어오기를] 바란다고 언급했습니다.\n\n6. 그러고 나서 그는, 힘러의 참모장교 슈틴스베르크[셸렌베르크] 씨가 무엇인가 소식을 듣기를 애타게 기다리고 있으며 전하고자 하는 어떤 전언이든 힘러에게 즉시 전달되도록 하고 있다[할 수 있다]고 말했습니다. 베르나도테는 [우리에게] 연합국으로부터 아무런 반응도 나오지 않는다면 그것은 불필요한 고통과 인명 손실을 많이 뜻하게 될지 모른다고 말했습니다. 외무장관은 …[주29]에서, 이것은 대단히 중요한 소식이므로 자신이 미국 측 동료와 나에게(즉 영국 대사에게) 즉시 알려야 한다고 생각했다고 설명했습니다. 괜찮으시겠습니까?\n\n나는 나의 미국 측 동료와 내가, 추축국이 동부전선에서 항복하기를 꺼리는[힘러가 항복을 거부하는] 것은 서방 연합국과 러시아 사이에 불화를 뿌리려는 마지막 시도로 보인다고 지적했다고 썼습니다. 명백히 나치는 모든 연합국에게 동시에 항복해야 할 것입니다.\n\n**트루먼:** 옳습니다. 바로 그것이 내가 느끼는 그대로입니다. 그는 모든 연합국에게 한꺼번에 항복해야 합니다.\n\n[765면]\n\n**처칠:** 외무장관과 정부[보에만 씨]는 그러한 동기를 배제할 수 없다고 인정하면서도, 나치 수뇌가 서부전선 전체와 노르웨이, 덴마크의 모든 부대에 항복을 명령하리라는 사실은 러시아를 포함한 모든 연합국에게 큰 이익이 될 수 있으며 실제로 이른 시일 안의 전면 항복으로 이어지리라고 지적했습니다. (이것은 모두 여전히 스웨덴 사람들이 하는 말입니다.) 그리고 그들은 어떻든[주29a] 외무장관이 이 점, 이 조항을 정리하기를 바랐다고 말합니다. 그는 이를 영국 및 미국 정부에 전달하라고 했으며, 스웨덴 정부에 관한 한 그 두 정부가 이를 소련 정부에 전달하는 것은 전적으로 자유라고 했습니다. 스웨덴 정부는 연합국 사이에 불화를 뿌리려는 어떠한 시도를 조장하는 도구가 결코 되지 않을 것이며 그럴 뜻도 없다고 했습니다. 소련 정부에 직접 알리지 않는 유일한 이유는 힘러가 이 정보를 오로지 서방 연합국만을 위한 것이라고 못 박았기 때문이었습니다. (그는 미국 측 동료가 그렇게 말하는 전보를 보내고 있다면 하고 말했습니다.) 물론 우리는 그것에 구속되지 않으며, 내 의견으로는 스탈린에게 알리는 것이 우리의 의무입니다.\n\n**트루먼:** 나도 그렇게 생각합니다. 스탈린에게 통지하셨습니까?\n\n**처칠:** 나는 귀하에게 보낸 전보에 대한 회답을 받기를 바라며 약 두 시간 동안 그것을 붙들고 있었습니다만, 이제 그 전보를 내보냈습니다. 이것이 내가 보낸 전보입니다.\n\n**트루먼:** 좋습니다. 그러면 귀하가 스탈린에게 통지하시고, 나도 우리 사이의 이 대화에 관하여 즉시 같은 일을 하겠습니다.\n\n**처칠:** 바로 그렇습니다. 내가 스탈린에게 말한 내용은 다음과 같으며[주30], 나는 이를 귀하에게도 타전했습니다. 바로 뒤따르는 전보는 내가 스웨덴 주재 영국대사로부터 방금 그대로 받은 것입니다.\n\n미합중국 대통령도 이 소식을 가지고 있습니다. 나는 귀하가 그것을 받으셨으리라 생각했습니다. 귀하의 전보가 도달하지 않았군요.\n\n**트루먼:** 예, 나는 아직 내 전보를 받지 못했습니다.\n\n**처칠:** 폐하의 정부에 관한 한, 3대 강국에 대한 동시적 무조건항복에 못 미치는 어떤 것도 [그렇게 마련하는] 문제가 될 수 없습니다.\n\n**트루먼:** 그것에 전적으로 동의합니다.\n\n**처칠:** 우리는 힘러에게 다음과 같이 알려야 한다고 봅니다. 독일 국민[군대]은 개인으로서든 부대로서든 어디에서나 그 자리의 연합국 군대나 대표에게 스스로 항복해야 한다. 그렇게 되기까지 저항이 계속되는 모든 방면과 모든 전역에서 연합국의 공격은 [766면] 최대의 힘으로 수행될 것이다.\n\n위 전보의 어떤 내용도 우리 연설[합류에 관한 성명들]의 발표에 영향을 주어서는 안 됩니다.[주30a] 나는 그것을 몇 분 전에 내보냈고, 나에게서 가는 다음 전보와 함께 귀하에게 보내려던 참이었습니다, 아시겠습니까. 내가 귀하에게 읽어 드린 그것 말입니다. 나는 즉시 전시내각을 소집했고, 그들은 내가 방금 읽어 드린 이 전보를 승인했습니다.\n\n**트루먼:** 나도 그것을 승인합니다.\n\n**처칠:** 내가 스탈린에게 보낸 그것 말입니다.\n\n**트루먼:** 나는 귀하가 스탈린에게 보낸 그 전보를 승인하며, 나도 즉시 정확히 같은 취지로 스탈린에게 타전하겠습니다.[주31]\n\n**처칠:** 대단히 고맙습니다. 그것이 바로 내가 바라던 바입니다. 우리는 귀하가 스탈린 원수와 우리에게 같은 취지로 타전하는 것이 가능하기를 바랐습니다.\n\n**트루먼:** 총리 각하, 스탈린에게 보내신 전문을 다시 한 번, 내가 여기서 받아적을 수 있도록 천천히 되풀이해 주시겠습니까?\n\n**처칠:** 나는 이미 한 시간 반도 더 전에 미국대사관을 통해 그렇게 했으며, 그것은 거의 곧바로 귀하에게 도달할 것입니다. 오늘 스톡홀름에서 내가 받은 전보도 보내 드릴까요?\n\n**트루먼:** 그래 주시면 매우 좋겠습니다.\n\n**처칠:** 그렇게 하겠습니다. 곧 받으실 것입니다. 나에게서 가는 것, 내가 방금 내보낸 그것을 받으실 것입니다.\n\n**트루먼:** 나는 귀하가 스탈린에게 보내신 것을 되풀이해 주셔서, 내가 그와 실질적으로 같은 것을 그에게 보낼 수 있기를 바랍니다.\n\n**처칠:** 좋습니다. 나는 …할 수 있기를 바랍니다——\n\n**트루먼:** 천천히 해 주시겠습니까, 총리 각하?\n\n**처칠:** 전보는 곧바로 뒤따릅니다. 긴 것입니다.[주31a]\n\n**트루먼:** 대단히 감사합니다.\n\n**처칠:** 나는 스웨덴 주재 영국대사로부터 방금 받았습니다. 미합중국 대통령도 그 소식을 가지고 있습니다(그것이 내가 생각한 바입니다). 국가 역사[폐하의 정부]에 관한 한, 3대 강국에 대한 동시적 무조건항복 이외의[에 못 미치는] 어떤 것도 문제가 될 수 없습니다. 우리는 힘러에게 다음과 같이 알려야 한다고 봅니다. 독일 국민[군대]은 개인으로서든 부대로서든 어디에서나 그 자리의 연합국 군대나 대표에게 스스로 항복해야 한다. 그렇게 되기까지 저항이 계속되는 모든 방면과 모든 전역에서 연합국의 공격은 최대의 힘으로 수행될 것이다. 위 전보의 어떤 내용도 우리 연설(?)의 발표에 영향을 주어서는 안 된다. [767면] (그것은 온전합니다), [합류에 관한 성명들.] 그것이 내가 보낸 것이며, 아마 반 시간쯤 전이라고 생각합니다.\n\n**트루먼:** 대단히 감사합니다. 나도 즉시 그에게 하나 보내겠습니다. 그리고 이 문제로 나에게 말씀해 주신 것을 참으로 고맙게 여깁니다.\n\n**처칠:** 기쁩니다. 나는 우리가 상당히 잘 의견이 일치하리라고 확신하고 있었으며, 스탈린도 「나도 동의한다」고 회신해 오기를 바랍니다. 그렇게 되면 우리는 스톡홀름의 우리 대표들에게, 그 전언을 힘러에게 전달하겠다고 베르나도테에게 알리도록 권한을 줄 수 있을 것입니다. 우리 셋이 모두 그 점에 합의하기 전에는 그것에 관해 아무것도 할 수 없기 때문입니다.\n\n**트루먼:** 좋습니다.\n\n**처칠:** 귀하는 나의 본문과 귀하 자신의 본문을 가지고 계시니, 스탈린이 무어라 하는지 봅시다.\n\n**트루먼:** 좋습니다.\n\n**처칠:** 참으로 대단히 감사합니다.\n\n**트루먼:** 감사합니다.\n\n**처칠:** 유럽에서의 합류(link-up)에 관하여 우리가 하기로 했던 그 연설들을 기억하십니까?\n\n**트루먼:** 방금 하신 말씀을 알아듣지 못했습니다, 총리 각하.\n\n**처칠:** 무슨 말인지 아실 것입니다. 그 연설, 이미 작성되어 있는 그 성명들 말입니다. 나는 그것들이 어떻든 예정대로, 합류가 이루어지는 즉시 발표되어야 한다고 생각합니다.\n\n**트루먼:** 그 점에서 귀하가 옳다고 생각합니다. 나도 동의합니다.\n\n**처칠:** 무엇이든 적을 무찌르는 데 도움이 됩니다.\n\n**트루먼:** 그 말에 동의합니다.\n\n**처칠:** 좋습니다. 우리의 첫 대화가 6월 초에 관한 것이 되어 기쁩니다. 아주 좋은 소식입니다.\n\n**트루먼:** 머지않아 언젠가 뵙기를 바랍니다.\n\n**처칠:** 나도 그럴 작정입니다. 그 일에 관하여 곧 몇 통의 전보를 보내 드리겠습니다. 폴란드 문제에 관하여 귀하가 하신 모든 일에 전적으로 동의합니다. 우리는 손을 맞잡고 함께 걷고 있습니다.\n\n**트루먼:** 그렇습니다, 나는 바로 그것을 계속하고자 합니다.\n\n**처칠:** 사실 나는 귀하의 지도를 따르며, 그 문제에서 귀하가 무엇을 하시든 뒷받침하고 있습니다.\n\n**트루먼:** 감사합니다. 안녕히 주무십시오.", "secondary": "April 25, 1945, 2:10 p.m.\n\nChurchill: Is that you, Mr. President?\n\nTruman: This is the President, Mr. Prime Minister.\n\nChurchill: How glad I am to hear your voice.\n\nTruman: Thank you very much, I am glad to hear yours.\n\nChurchill: I have several times talked to Franklin, but … [주25] have you received the report from Stockholm by your ambassador?\n\nTruman: Yes, I have. [주26]\n\nChurchill: On that proposal?\n\nTruman: Yes. I have just a short message saying that there was such a proposal in existence.\n\nChurchill: Yes, it’s of course … [주25] we thought it looked very good.\n\nTruman: Has he anything to surrender?\n\nChurchill: I called the War Cabinet together and they opposed [approved?] my telegraphing to tell Stalin and also repeating our news through the usual channels to you.\n\nTruman: What has he to surrender? Does that mean everything, Norway, Denmark, Italy, and Holland?\n\nChurchill: They mentioned Italy, and Yugoslavia. We mentioned everything and have included that to take in Denmark and Norway. Everything on the Western Front, but he hasn’t proposed to surrender on the Eastern Front. So we thought perhaps it would be necessary to report it to Stalin that is, of course, to say that in our view the surrender must be simultaneous to agree to our terms.\n\nTruman: I think he should be forced to surrender to all three governments, Russia, you, and the United States. I don’t think we ought to even consider a piecemeal surrender.\n\nChurchill: No, no, no. Not a piecemeal surrender to a man like Himmler. Himmler will be speaking for the German state as much [763면] as anybody can. And therefore we thought that his negotiations must be carried on with the three governments.\n\nTruman: That’s right, that’s the way I feel exactly.\n\nChurchill: I see, of course, that’s local surrender on the front, Himmler’s allied front. And then Eisenhower is still authorized to make [take?] the surrender, well, then he will wish to surrender.\n\nTruman: Yes, of course.\n\nChurchill: You understand that?\n\nTruman: I understand that. If he is speaking for the German government as a whole, that ought to include the surrender of everything, and it ought to be to all three governments.\n\nChurchill: Certainly, what we actually sent was that there could be no question as far as His Majesty’s Government is concerned of anything less than unconditional surrender simultaneously to the three major powers.\n\nTruman: All right. I agree to that.\n\nChurchill: Have you said anything to the Russians yet?\n\nTruman: No I haven’t. I was waiting to hear from you. I haven’t received the message from Stockholm. This information that you are giving me now is the only information that I have on the subject, except that I was informed that your conversation was based on a message that you had from Stockholm.\n\nChurchill: Yes.\n\nTruman: I have no other information except what I am receiving now from you.\n\nChurchill: I see. I can give you the message which our ambassador in Stockholm sent me. Would you like me to read it to you?\n\nTruman: I would appreciate it very much if you will.\n\nChurchill: Yes. It is a little long. Tell me if you don’t hear it as it comes.\n\nCould you hear that all right?\n\nTruman: Yes, I could hear.\n\n[764면]\n\nChurchill: And General Finisberg [Schellenberg] of Himmler’s staff told Bernadotte that it was hemorrhage of the brain.\n\n4. In that statement, [Himmler stated] that while Hitler was still active he would not have been able to take the steps he now proposed but that as Herr Hitler was finished he was now in a position of full authority to act. He then asked Bernadotte to forward to the Swedish Government his desire that they could [should] make arrangements in order to arrange for him to meet General Eisenhower in order to capitulate on the whole Western Front. Bernadotte remarked that such a meeting (Bernadotte is a Swede, a Swedish Red Cross man) was not necessary in that Himmler could simply order his troops to surrender. That announcement asked him [He was not willing] to forward Himmler’s request to the Swedish Government, and that [unless] Norway and Denmark were included in this capitulation. If this were the case, there might be some point in a meeting because special technical arrangements might have to be made with Eisenhower and de Gaulle [주28] if the Germans were to lay down their arms in those two countries. He then replied that he was prepared to order the troops in Denmark and Norway to surrender to either British, American, or Swedish troops.\n\n5. He in there [Himmler?] hopes to continue resistance on the Eastern Front at least for a time, which Bernadotte told him was hardly possible, in fact, that it would not be acceptable to the Allies. Himmler mentioned, for instance, that he hoped that the Western Allies rather than the Russians would be first to make this step [to enter Mecklenburg] in order to save the civilian populations.\n\n6. Then he said that Himmler’s staff officer, Herr Stinsberg [Schellenberg] was eagerly awaiting to hear something and was putting through [could ensure] immediate delivery to Himmler any message which it might be desired to convey. Bernadotte remarked to [us] that if no reaction at all was forthcoming from the Allies that may mean a lot of unnecessary suffering and loss of human life. The Minister of Foreign Affairs at … [주29] explained that he thought this was such an important piece of news that he ought to communicate it to my United States colleague and me (that’s the British Ambassador) immediately. Is it okay with you?\n\nI wrote that my United States colleague and I remarked that in [the] reference to the Axis unwillingness [to Himmler’s refusal] to surrender on the Eastern Front looks like a last attempt to sow discord between the Western Allies and Russia. Obviously the Nazi would have to surrender to all the Allies simultaneously.\n\nTruman: That is right. That is exactly the way I feel. He ought to surrender to all the Allies at once.\n\n[765면]\n\nChurchill: The Minister for Foreign Affairs and Government [Mr. Boheman], while admitting that this motive could not be excluded, pointed out that the fact that the Nazi chiefs would order capitulation of all troops on the whole Western Front, and in Norway, and Denmark might be of great advantage for all the Allies, including Russia and would in fact lead to early total capitulation. (These are all [still] the Swedes talking), and they say in any case, [주29a] the Minister for Foreign Affairs hoped to clear this up, this provision. He said pass it on to the British and United States Governments who were, as far as the Swedish Government were concerned, at complete liberty to transmit it to the Soviet Government. That the Swedish Government would in no way be, or propose to be, an instrument in promoting any attempt to sow discord between the Allies. The only reason for not informing the Soviet Government directly was because Himmler had stipulated that this information was exclusively for the Western Allies. (He said that if the United States colleague is sending a telegram to say so.) Of course we are not bound by that, and it’s our duty to tell Stalin, in my opinion.\n\nTruman: I think so, too. Have you notified Stalin?\n\nChurchill: I held it up for about two hours, hoping to get an answer to the telegram I sent you, but I have now released the telegram. This is the telegram I have sent.\n\nTruman: All right, then you notify Stalin, and I shall do the same immediately of this conversation between us.\n\nChurchill: Exactly. Here is what I have said to Stalin [주30] and I have telegraphed it over to you. The telegram immediately following is one I have just received exactly from the British Ambassador in Sweden.\n\nThe President of the United States has the news also. I thought you had gotten it. Your telegram has not gotten thru.\n\nTruman: No, I haven’t received my telegram as yet.\n\nChurchill: There can be no question as far as His Majesty’s Government is concerned, arranging thus an [of anything less than] unconditional surrender simultaneously to the three major powers.\n\nTruman: I agree to that fully.\n\nChurchill: We consider Himmler should be told that German folk [forces] either as individuals or in units should everywhere surrender themselves to the Allied troops or representatives on the spot. Until this happens, the attack of the Allies upon them on all sides and in all [766면] theaters where resistance continues will be prosecuted with the utmost vigor.\n\nNothing in the above telegram should affect the release of our oration [orations on the link-up.] [주30a] I sent it off a few minutes ago and I was sending it to you with the following telegram from me, you see. That which I read you. I called the War Cabinet together at once and they approved of this telegram I’ve just read you.\n\nTruman: I approve of it too.\n\nChurchill: The one I sent to Stalin.\n\nTruman: I approve of that telegram you sent to Stalin, and I shall immediately wire Stalin on exactly the same line. [주31]\n\nChurchill: Thank you so much. That is exactly what I wanted. We hoped you would find it possible to telegraph to Marshal Stalin and to us in the same sense.\n\nTruman: Mr. Prime Minister, would you please repeat your message to Stalin and repeat it slowly so I can take it down here.\n\nChurchill: I have already done so through the American Embassy over an hour and a half ago, and it should be with you almost immediately. Would you like me to send you also the telegram I got from Stockholm today?\n\nTruman: I would very much.\n\nChurchill: I will. You will get it very soon. You will get the one from me, the one I just sent out.\n\nTruman: I would like for you to repeat the one which you sent to Stalin so I can send one substantially like it to him.\n\nChurchill: Good. I hope I may——\n\nTruman: Would you do it slowly, please, Mr. Prime Minister?\n\nChurchill: The telegram immediately follows: It is a long one. [주31a]\n\nTruman: I thank you very much.\n\nChurchill: I have just received from the British Ambassador in Sweden. The President of the United States has the news also (that is what I thought). There can be no question as far as state history [H.M.G.] is concerned about anything else but [less than] unconditional surrender simultaneously to the three major powers. We consider Himmler should be told that German folk [forces] either as individuals or in units should everywhere surrender themselves to the Allied troops or representatives on the spot. Until this happens, the attack of the Allies upon them on all sides and in all theaters where resistance continues will be prosecuted with the utmost vigor. Nothing in the above telegram should affect the release of our oration (?). [767면] (That is intact), [orations on the link-up.] That is what I sent I think, about half an hour ago.\n\nTruman: Thank you very much. I shall get one off immediately to him, and I certainly do appreciate your talking to me on it.\n\nChurchill: I’m delighted. I am so sure we would be pretty well in agreement, and I hope that Stalin will wire back and say, “I agree too.” In which case we could authorize our representatives, in Stockholm, to tell Bernadotte that you will pass on the message to Himmler. Because nothing can be done about that until we are all three agreed on it.\n\nTruman: All right.\n\nChurchill: You have my text and your own, and let’s see what Stalin says.\n\nTruman: All right.\n\nChurchill: Thank you very much, indeed.\n\nTruman: Thank you.\n\nChurchill: You remember those speeches we were going to make about the link-up in Europe?\n\nTruman: I didn’t understand that last statement, Mr. Prime Minister.\n\nChurchill: You know what I am talking about, the speech, the statements that are written. Well, I think they should be let out just as they would be anyhow as soon as the link-up occurs.\n\nTruman: I think you’re right on that. I agree on that.\n\nChurchill: Anything helps to beat the enemy.\n\nTruman: I agree with that.\n\nChurchill: Good. I rejoice that our first conversation will be about the first of June. It’s very good news.\n\nTruman: I hope to see you some day soon.\n\nChurchill: I am planning to. I’ll be sending you some telegrams about that quite soon. I entirely agree with all that you’ve done on the Polish situation. We are walking hand in hand together.\n\nTruman: Well, I want to continue just that.\n\nChurchill: In fact, I am following your lead, backing up whatever you do on the matter.\n\nTruman: Thank you. Good night.", "notes": ["[주24] 이 대화가 이루어진 시각은 녹취에 표시되어 있지 않다. 처칠 총리(Triumph and Tragedy, p. 536)는 4월 25일 런던 시간 오후 8시 10분에 이루어졌다고 밝힌다. 리히 제독(I Was There, p. 415)은 워싱턴 시간 오후 2시 직후에 있었다고 말한다. 힘러의 항복 제의에 관한 연대기적 서술을 담은 5월 2일자 국무부 보도자료는 이 대화를 4월 25일 「이른 오후」에 놓는다(Department of State Bulletin, 5월 6일, 863면). (사소한 이문(異文)의 경우를 제외한) 교정은 Stalin’s Correspondence, vol. i, pp. 332 ff. 및 Churchill, Triumph and Tragedy, pp. 534 ff.의 관련 본문에 근거하여 편집자가 붙인 것이다.", "[주25] 원래의 대화 녹취에 표시된 누락 부분.", "[주26] 759면의 각주 18 참조.", "[주25] 원래의 대화 녹취에 표시된 누락 부분.", "[주28] 샤를 드골(Charles de Gaulle), 프랑스 임시정부 수반.", "[주29] 원래의 대화 녹취에 점(…)으로 표시된 부분.", "[주29a] Stalin’s Correspondence에 실린 본문에서 이 대목과 이어지는 두 문장은 다음과 같이 되어 있다. 「어떻든 외무장관은 베르나도테의 정보가 영국 및 미국 정부에 전달되어야 한다고 생각했으며, 스웨덴 정부에 관한 한 그 두 정부가 이를 소련 정부에 전달하는 것은 전적으로 자유였다. 스웨덴 정부는 연합국 사이에 불화를 뿌리려는 어떠한 시도를 조장하는 도구가 결코 되지 않을 것이며 그렇게 여겨지지도 않을 것이기 때문이다.」", "[주30] 처칠 총리가 스탈린 원수에게 보낸 본문은 ibid., vol. i, p. 332 참조. 발췌본은 Churchill, Triumph and Tragedy, p. 537에 실려 있다.", "[주30a] 연합군과 소련군이 독일에서 합류할 때 방송하기로 되어 있던, 트루먼 대통령·처칠 총리·스탈린 원수의 녹음 성명을 가리킨다.", "[주31] 바로 다음 문서 참조.", "[주31a] 이 문장은 「The telegram immediately following——」이 되어야 한다."], "warn": true, "pages": ["763", "764", "765", "766", "767"], "search": "Truman 트루먼 Churchill 처칠 Stalin 스탈린 Himmler 힘러 Hitler 히틀러 Bernadotte 베르나도테 Schellenberg 셸렌베르크 Eisenhower 아이젠하워 de Gaulle 드골 Boheman 보에만 Roosevelt 루스벨트(「프랭클린」)"}, {"id": "d551", "order": 551, "date": "1945-04-25", "group": "A", "eyebrow": "d551 · The Acting Secretary of State to the Secretary of State  Secretary of State Stettinius was attending the United Nations Conference on International Organization in San Francisco; for documentation, see vol. i, pp. 1 ff.", "title": "국무장관 대리가 국무장관에게", "badge": null, "list_right": "문서 551", "meta": [{"k": "일자", "v": "1945-04-25"}, {"k": "시각", "v": "Washington, April 25, 1945—6:12 p.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "26"}, {"k": "원문출처", "v": "740.00119 EW/4–2545: Telegram", "txt": true}, {"k": "발신", "v": "The Acting Secretary of State (Grew) 국무장관 대리 그루", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관 (샌프란시스코 체재 중)[주32]", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 551 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d551"}], "summary": "펜타곤에서 대통령·합참과 회의하고 처칠과 통화한 뒤, 트루먼이 스탈린에게 보낸 전문을 전한다. 유일하게 받아들일 수 있는 조건은 3국 전 전선에 대한 무조건항복뿐이라는 내용이다.", "points": ["펜타곤 청사에서 대통령 및 합동참모본부와 회의를 하고, 그 뒤 처칠과 전화 대화를 한 다음 대통령이 스탈린에게 전문을 보냈으며 처칠과 아이젠하워에게 재전송했다.", "제1항: 힘러가 히틀러의 무능력으로 인한 부재 중에 독일 정부를 대변하여, 네덜란드·덴마크·노르웨이를 포함한 서부전선의 모든 독일군을 항복시키겠다는 제의를 스웨덴 정부에 해 왔다.", "제2항: 영·소 양국 정부와의 합의에 비추어, 받아들일 수 있는 유일한 항복 조건은 소련·영국·미국 3국에 대한 전 전선에서의 무조건항복(unconditional surrender)뿐이라는 것이 미국 정부의 견해다.", "제3항: 독일이 제2항의 조건을 수락한다면 즉시 모든 전선에서 현지 지휘관들에게 항복해야 한다(should surrender).", "제4항: 스탈린이 제2·3항에 동의하면, 대통령은 주스웨덴 공사에게 힘러의 대리인에게 그렇게 알리도록 지시하겠다.", "이 전문은 육군 경로를 통해 육군부 전보 제72808호로 모스크바에, 제72816호로 런던에 발송되었다.[주33][주34]"], "primary": "워싱턴, 1945년 4월 25일 오후 6시 12분.\n\n26. 내가 배석한 가운데 펜타곤 청사에서 대통령 및 합동참모본부와 회의를 하고, 이어 [768면] 처칠과 전화 대화를 한 뒤, 대통령으로부터 스탈린에게 다음 전문이 발송되었고[주33] 처칠[주34]과 아이젠하워에게 재전송되었다.\n\n「1. 나는 주스웨덴 미국 공사로부터, 힘러가 히틀러의 무능력으로 인한 부재 중에 독일 정부를 대변하여, 네덜란드·덴마크·노르웨이를 포함한 서부전선의 모든 독일군을 항복시키겠다는 제의를 가지고 스웨덴 정부에 접근했다는 보고를 받았다.\n\n2. 영국 및 소련 정부와의 우리 합의에 좇아, 받아들일 수 있는 유일한 항복 조건은 소련, 영국 및 미합중국에 대하여 모든 전선에서 행하는 무조건항복뿐이라는 것이 미합중국 정부의 견해다.\n\n3. 독일 측이 위 제2항의 조건을 수락한다면, 그들은 모든 전선에서 즉시 전장의 현지 지휘관들에게 항복하여야 한다.\n\n4. 귀하가 위 제2항 및 제3항에 동의한다면, 나는 주스웨덴 미국 공사에게 힘러의 대리인에게 그렇게 알리도록 지시하겠다.」\n\n이는 이미 귀하에게 재전송된 스톡홀름 제1528호, 4월 25일 오전 3시에 관한 것이다.\n\n그루(Grew)", "secondary": "Washington, April 25, 1945—6:12 p.m.\n\n26. After conference at Pentagon Building with the President and the Joint Chiefs of Staff at which I was present and after a telephone [768면] conversation with Churchill, the following message has been sent from the President to Stalin [주33] and repeated to Churchill [주34] and Eisenhower:\n\n“1. I am informed by the American Minister to Sweden that Himmler speaking for the German Government in the absence of Hitler due to incapacity approached the Swedish government with an offer to surrender all the German forces on the western front including Holland, Denmark, and Norway.\n\n2. In keeping with our agreement with the British and Soviet Governments it is the view of the United States Government that the only acceptable terms of surrender are unconditional surrender on all fronts to the Soviet, Great Britain and the United States.\n\n3. If the Germans accept the terms of paragraph 2 above they should surrender on all fronts at once to the local commanders in the field.\n\n4. If you are in agreement with paragraphs 2 and 3 above I will direct my minister in Sweden to so inform Himmler’s agent.”\n\nThis refers to Stockholm’s 1528, April 25, 3 a.m., which has already been repeated to you.\n\nGrew", "notes": ["[주32] 스테티니어스 국무장관은 샌프란시스코에서 열린 국제기구에 관한 국제연합 회의에 참석 중이었다. 관련 문서는 제1권 1면 이하 참조.", "[주33] 육군 경로를 통해 4월 25일자 육군부 전보 제72808호로 모스크바 주재 대리대사에게 발송되었으며, 스탈린 원수에게 전달하라는 지시가 붙었다(740.00119 EW/4–2545).", "[주34] 육군 경로를 통해 4월 25일자 육군부 전보 제72816호로 런던 주재 대사에게 발송되었으며, 처칠 총리에게 전달하라는 지시가 붙었다(740.00119 EW/4–2545)."], "warn": false, "pages": ["768"], "search": "Grew 그루(국무장관 대리) Truman 트루먼 Stalin 스탈린 Churchill 처칠 Eisenhower 아이젠하워 Himmler 힘러 Hitler 히틀러 Stettinius 스테티니어스(국무장관)"}, {"id": "d858", "order": 858, "date": "1945-04-25", "group": "A", "eyebrow": "d858 · The Acting Secretary of State to Diplomatic Representatives in the American Republics", "title": "국무장관 대리가 아메리카 공화국 주재 외교대표들에게", "badge": null, "list_right": "문서 858", "meta": [{"k": "일자", "v": "1945-04-25"}, {"k": "시각", "v": "Washington, April 25, 1945—2 p.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "800.414/4–2545: Circular telegram", "txt": true}, {"k": "발신", "v": "The Acting Secretary of State (Grew) 국무장관 대리 그루", "txt": true}, {"k": "수신", "v": "Diplomatic Representatives in the American Republics 아메리카 공화국 주재 외교대표들", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 858 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d858"}], "summary": "독일 문서고 접근을 확보하기 위해 적기라고 판단되는 때에 착수할 권한을 부여하되, 공식 교섭에 앞서 영국 측 동료에게 알리고 함께 행동하라는 회람 전보.", "points": ["4월 7일 오후 2시자 국무부 회람 전보에 대한 후속 지시다.", "독일 문서고(German archives)에 대한 접근을 얻기 위하여 최적이라고 판단되는 시점에 착수할 권한을 부여한다.", "다만 어떠한 공식 교섭에 나서기에 앞서 영국 측 동료에게 알려야 하며, 그와 함께 행동해야 한다."], "primary": "워싱턴, 1945년 4월 25일 오후 2시.\n\n4월 7일 오후 2시자 국무부 회람 전보에 대하여. 귀하는 독일 문서고에 대한 접근을 얻기 위하여 가장 적절하다고 판단되는 시점에 착수할 권한을 부여받는다. 다만 어떠한 공식적 교섭에 나서기에 앞서 귀하의 영국 측 동료에게 알려야 하며, 그와 함께 행동하여야 한다.\n\n그루(Grew)", "secondary": "Washington, April 25, 1945—2 p.m.\n\nReDeptelcirc April 7, 2 p.m. You are authorized to proceed at the moment that you think best in order to obtain access to German archives. Prior to making any official approach, however, you should inform your British colleague and should act in conjunction with him.\n\nGrew", "notes": [], "warn": false, "pages": [], "search": "Grew 그루(국무장관 대리)"}, {"id": "d65", "order": 65, "date": "1945-04-26", "group": "A", "eyebrow": "d65 · The Chargé in the Soviet Union (Kennan) to the Secretary of State  The text of this telegram was repeated to Caserta in Department’s telegram 393, April 28, to London as Department’s No. 3324, and to Paris as Department’s No. 1739. The note of the Soviet Government quoted in this telegram was summarized by the Ambassador in the Soviet Union in his telegram 65, April 26, 8 p.m. to the United States Political Adviser on Austrian Affairs in Vienna, not repeated to the Department (Vienna Embassy Files).", "title": "주소련 대리대사(케넌)가 국무장관에게", "badge": null, "list_right": "문서 65", "meta": [{"k": "일자", "v": "1945-04-26"}, {"k": "시각", "v": "Moscow, April 26, 1945—6 p.m. [Received April 26—3:50 p.m.]"}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": "136
