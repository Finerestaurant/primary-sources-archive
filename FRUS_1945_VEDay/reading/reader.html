eligious instruction in German schools, except insofar as may be necessary to insure that religious instruction and administration of such schools conform to such Allied regulations as are or may be established pertaining to purging of personnel and curricula.\n\n15. Arts and Archives:\n\nSubject to the provisions of paragraph 6 above, you will make all reasonable efforts to preserve historical archives, museums, libraries and works of art.\n\nPart II\n\nEconomic\n\nGeneral Objectives and Methods of Control\n\n16. You will assure that the German economy is administered and controlled in such a way as to accomplish the basic objectives set forth in paragraphs 4 and 5 of this Directive. Economic controls will be imposed only to the extent necessary to accomplish these objectives, provided that you will impose controls to the full extent necessary to achieve the industrial disarmament of Germany. Except as may be necessary to carry out these objectives, you will take no steps (a) looking toward the economic rehabilitation of Germany, or (b) designed to maintain or strengthen the German economy.\n\n17. To the maximum extent possible without jeopardizing the successful execution of measures required to implement the objectives outlined in paragraphs 4 and 5 of this directive you will use German authorities and agencies and subject them to such supervision and punishment for non-compliance as is necessary to ensure that they carry out their tasks.\n\nFor this purpose you will give appropriate authority to any German agencies and administrative services you consider essential; provided, however, that you will at all times adhere strictly to the provisions of this directive regarding denazification and dissolution or elimination of Nazi organizations, institutions, principles, features, and practices.\n\nTo the extent necessary you will establish administrative machinery, not dependent upon German authorities and agencies, to execute or assure the execution of the provisions of paragraphs 19, 20, 30, 31, 32, 39 and 40 and any other measures necessary to an accomplishment of your industrial disarmament objectives.\n\n[494면]\n\n18. In order to decentralize the structure and administration of the German economy to the maximum possible extent, you will\n\na.\n\nensure that the action required to maintain or restore essential public utilities and industrial and agricultural activities is taken as far as possible on a local and regional basis;\n\nb.\n\non no account propose or approve in the Control Council the establishment of centralized administration of controls over the German economy except where such centralization of administration is clearly essential to the fulfilment of the objectives listed in paragraphs 4 and 5 of this directive. Decentralization in administration should not be permitted to interfere with attainment of the largest practicable measure of agreement on economic policies in the Control Council.\n\n19. You will institute or assure the maintenance of such statistical records and reports as may be necessary in carrying out the objectives listed in paragraphs 4 and 5 of this directive.\n\n20. You will initiate appropriate surveys which may assist you in achieving the objectives of the occupation. In particular you will promptly undertake surveys of supplies, equipment and resources in your zone. You will endeavor to obtain prompt agreement in the Control Council to the making of similar surveys in the other zones of occupation, and you will urge appropriate steps to coordinate the methods and results of these and other future surveys conducted in the various zones. You will keep the Control Council, United States [Representative on the Separation Commission and other appropriate authorities, currently apprised of the information obtained by means of intermediate reports or otherwise.\n\nGerman Standard of Living\n\n21. You will estimate requirements of supplies necessary to prevent starvation or widespread disease or such civil unrest as would endanger the occupying forces. Such estimates will be based upon a program whereby the Germans are made responsible for providing for themselves, out of their own work and resources. You will take all practicable economic and police measures to assure that German resources are fully utilized and consumption held to the minimum in order that imports may be strictly limited and that surpluses may be made available for the occupying forces and displaced persons and United Nations prisoners of war, and for reparation. You will take no action that would tend to support basic living standards in Germany on a higher level than that existing in any one of the neighboring United Nations and you will take appropriate measures to ensure that basic living standards of the German people are not higher than those existing in any one of the neighboring United Nations when such measures will contribute to raising the standards of any such nation.\n\n22. You will urge upon the Control Council that uniform ration scales be applied throughout Germany, that essential items be distributed [495면] equitably among the zones, that net surpluses be made available for export to Allied countries, and that imports be limited to the net deficits of Germany as a whole.\n\nLabor, Health, and Social Insurance\n\n23. You will permit the self-organization of employees along democratic lines, subject to such safeguards as may be necessary to prevent the perpetuation of Nazi or militarist influence under any guise or the continuation of any group hostile to the objectives and operations of the occupying forces.\n\n24. You will permit free collective bargaining between employees and employers regarding wage, hour and working conditions and the establishment of machinery for the settlement of industrial disputes. Collective bargaining shall be subject to such wage, hour and other controls, if any, as may be instituted or revived by your direction.\n\n25. Subject to the provisions of paragraph 48 of this directive you are authorized to direct German authorities to maintain or reestablish non-discriminatory systems of social insurance and poor relief.\n\n26. You are authorized to direct the German authorities to maintain or re-establish such health services and facilities as may be available to them.\n\nAgriculture, Industry and Internal Commerce\n\n27. You will require the Germans to use all means at their disposal to maximize agricultural output and to establish as rapidly as possible effective machinery for the collection and distribution of agricultural output.\n\n28. You will direct the German authorities to utilize large-landed estates and public lands in a manner which will facilitate the accommodation and settlement of Germans and others or increase agricultural output.\n\n29. You will protect from destruction by the Germans, and maintain for such disposition as is determined by this and other directives or by the Control Council, all plants, equipment, patents and other property, and all books and records of large German industrial companies and trade and research associations that have been essential to the German war effort or the German economy. You will pay particular attention to research and experimental establishments of such concerns.\n\n30. In order to disarm Germany, the Countrol Council should\n\na.\n\nprevent the production, acquisition by importation or otherwise, and development of all arms, ammunition and implements of war, as well as all types of aircraft, and all parts, components and ingredients specially designed or produced for incorporation therein;\n\nb.\n\nprevent the production of merchant ships, synthetic rubber and oil, aluminum and magnesium and other products and equipment on which you will subsequently receive instructions;\n\n[496면] c.\n\nseize and safeguard all facilities used in the production of any of the items mentioned in this paragraph and dispose of them as follows:\n\n(1)\n\nremove all those required for reparation;\n\n(2)\n\ndestroy all those not transferred for reparation if they are especially adapted to the production of the items specified in this paragraph and are not of a type generally used in industries permitted to the Germans (cases of doubt to be resolved in favor of destruction);\n\n(3)\n\nhold the balance for disposal in accordance with instructions which will be sent to you.\n\nPending agreement in the Control Council you will take these measures in your own zone. You will not postpone enforcement of the prohibitions contained in subparagraphs a and b and the instructions in subparagraph c without specific approval of your government through the Joint Chiefs of Staff.\n\n31. As an additional measure of disarmament, the Control Council should\n\na.\n\nprohibit initially all research activities and close all laboratories, research institutions and similar technical organizations except those considered necessary to the protection of public health;\n\nb.\n\nabolish all those laboratories and related institutions whose work has been connected with the building of the German war machine, safeguard initially such laboratories and detain such personnel as are of interest to youx technological investigations, and thereafter remove or destroy their equipment;\n\nc.\n\npermit the resumption of scientific research in specific cases, only after careful investigation has established that the contemplated research will in no way contribute to Germany’s future war potential and only under appropriate regulations which (1) define the specific types of research permitted, (2) exclude from further research activity any persons who previously held key positions in German war research, (3) provide for frequent inspection, (4) require free disclosure of the results of the research and (5) impose severe penalties, including permanent closing of the offending institution, whenever the regulations are violated.\n\nPending agreement in the Control Council you will adopt such measures in your own zone.\n\n32. Pending final Allied agreements on reparation and on control or elimination of German industries that can be utilized for war production, the Control Council should\n\na.\n\nprohibit and prevent production of iron and steel, chemicals, non-ferrous metals (excluding aluminum and magnesium), machine tools, radio and electrical equipment, automotive vehicles, heavy machinery and important parts thereof, except for the purposes stated in paragraphs 4 and 5 of this directive;\n\nb.\n\nprohibit and prevent rehabilitation of plant and equipment in such industries except for the purposes stated in paragraphs 4 and 5 of this directive; and\n\n[497면] c.\n\nsafeguard plant and equipment in such industries for transfer on reparation account.\n\nPending agreement in the Control Council, you will put such measures into effect in your own zone.\n\n33. The Control Council should adopt a policy permitting the conversion of facilities other than those mentioned in paragraphs 30 and 32 to the production of light consumer goods, provided that such conversion does not prejudice the subsequent removal of plant and equipment on reparation account and does not require any imports beyond those necessary for the purposes specified in paragraphs 4 and 5 of this directive. Pending agreement in the Control Council, you may permit such conversion in your zone.\n\n34. Subject to the provisions of paragraphs 30 and 32, the Control Council should assure that all feasible measures are taken to facilitate, to the minimum extent necessary for the purposes outlined in paragraphs 4 and 5 of this directive\n\na.\n\nrepairs to and restoration of essential transportation services and public utilities;\n\nb.\n\nemergency repair and construction of the minimum shelter required for the civilian population;\n\nc.\n\nproduction of coal and any other goods and services required for reparation, for your forces and, subject to the provisions of paragraph 21 of this directive, for the German people.\n\nYou will assure that such measures are taken in your own zone pending agreement in the Control Council.\n\n35. In your capacity as zone commander and as member of the Control Council you will take steps to provide for the equitable interzonal distribution and the movement of goods and services essential to the purposes set forth in paragraphs 4 and 5 of this directive.\n\n36. You will prohibit all cartels or other private business arrangements and cartel-like organizations, including those of a public or quasi-public character such as the Wirtschaftsgruppen providing for the regulation of marketing conditions, including production, prices, exclusive exchange of technical information and processes, and allocation of sales territories. Such necessary public functions as have been discharged by these organizations shall be absorbed as rapidly as possible by approved public agencies.\n\n37. It is the policy of your government to effect a dispersion of the ownership and control of German industry. To assist in carrying out this policy you will make a survey of combines and pools, mergers, holding companies and interlocking directorates and communicate the results, together with recommendations, to your government through the Joint Chiefs of Staff. You will endeavor to obtain agreement in the Control Council to the making of this survey in the other zones [498면] of occupation and you will urge the coordination of the methods and results of this survey in the various zones.\n\n38. With due regard to paragraph 4 a, the Control Council should adopt such policies as are clearly necessary to prevent or restrain inflation of a character or dimension which would definitely endanger accomplishment of the objectives of the occupation. The Control Council, in particular, should direct and empower German authorities to maintain or establish controls over prices and wages and to take the fiscal and financial measures necessary to this end. Pending agreement in the Control Council you will assure that such measures as you consider necessary are taken in your own zone. Prevention or restraint of inflation shall not constitute an additional ground for the importation of supplies, nor shall it constitute an additional ground for limiting removal, destruction or curtailment of productive facilities in fulfillment of the program for reparation, demilitarization and industrial disarmament.\n\nPower, Transportation and Communications\n\n39. Both as member of the Control Council and zone commander you will take appropriate steps to ensure that\n\na.\n\npower, transportation and communications facilities are directed in such a way as to carry out the objectives outlined in paragraphs 4 and 5 of this directive;\n\nb.\n\nGermans are prohibited and prevented from producing, maintaining or operating all types of aircraft.\n\nYou will determine the degree to which centralized control and administration of power, transportation and communications is clearly necessary for the objectives stated in paragraphs 4 and 5 and urge the establishment of this degree of centralized control and administration by the Control Council.\n\nForeign Trade and Reparation\n\n40. The Control Council should establish centralized control over all trade in goods and services with foreign countries. Pending agreement in the Control Council you will impose appropriate controls in your own zone.\n\n41. Both as member of the Control Council and as zone commander you will take appropriate steps to ensure that\n\na.\n\nthe foreign trade controls are designed to carry out the objectives stated in paragraphs 4 and 5 of this directive;\n\nb.\n\nimports which are permitted and furnished to Germany are confined to those unavoidably necessary to the objectives stated in paragraphs 4 and 5;\n\nc.\n\nexports to countries other than the United Nations are prohibited unless specifically authorized by the Allied governments.\n\n[499면]\n\n42. Both as member of the Control Council and as zone commander you will adopt a policy which would forbid German firms to participate in international cartels or other restrictive contracts and arrangements and order the prompt termination of all existing German participations in such cartels, contracts and arrangements.\n\n43. You will carry out in your zone such programs of reparation and restitution as are embodied in Allied agreements and you will seek agreement in the Control Council on any policies and measures which it may be necessary to apply throughout Germany in order to ensure the execution of such programs.\n\nPart III\n\nFinancial\n\n44. You will make full application in the financial field of the principles stated elsewhere in this directive and you will endeavor to have the Control Council adopt uniform financial policies necessary to carry out the purposes stated in paragraphs 4 and 5 of this directive. You will take no steps designed to maintain, strengthen or operate the German financial structure except in so far as may be necessary for the purposes specified in this directive.\n\n45. The Control Council should regulate and control to the extent required for the purposes set forth in paragraphs 4 and 5 the issue and volume of currency and the extension of credit in Germany and in accordance with the following principles:\n\na.\n\nUnited States forces and other Allied forces will use Allied Military marks and Reichsmark currency or coins in their possession. Allied Military marks and Reichsmark currency and coin now in circulation in Germany will be legal tender without distinction and will be interchangeable at the rate of 1 Allied Military mark for 1 Reichsmark. Reichskreditkassenscheine and other German military currency will not be legal tender in Germany.\n\nb.\n\nThe Reichsbank, the Rentenbank or any other bank or agency may be permitted or required to issue bank notes and currency which will be legal tender; without such authorization no German governmental or private bank or agency will be permitted to issue bank notes or currency.\n\nc.\n\nThe German authorites may be required to make available Reichsmark currency or credits free of cost and in amounts sufficient to meet all the expenses of the forces of occupation, including the cost of Allied Military Government and including to the extent that compensation is made therefor, the cost of such private property as may be requisitioned, seized, or otherwise acquired, by Allied authorities for reparations or restitution purposes.\n\nPending agreement in the Control Council you will follow these policies in your own zone.\n\nYou will receive separate instructions relative to the currency which you will use in the event that for any reason adequate supplies of [500면] Allied Military marks and Reichsmarks are not available, or if the use of such currency is found undesirable.\n\nYou will not announce or establish in your zone, until receipt of further instructions, any general rate of exchange between the Reichsmark on the one hand and the U.S. dollar and other currencies on the other. However, a rate of exchange to be used exclusively for pay of troops and military accounting purposes in your zone will be communicated separately to you.\n\n46. Subject to any agreed policies of the Control Council, you are authorized to take the following steps and to put into effect such further financial measures as you may deem necessary to accomplish the purposes of your occupation:\n\na.\n\nTo prohibit, or to prescribe regulations regarding, transfer or other dealings in private or public securities or real estate or other property.\n\nb.\n\nTo close banks, but only for a period long enough for you to introduce satisfactory control, to remove Nazi and other undesirable personnel, and to issue instructions for the determination of accounts to be blocked under sub-paragraph 48 e below.\n\nc.\n\nTo close stock exchanges, insurance companies, and similar financial institutions for such periods as you deem appropriate.\n\nd.\n\nTo establish a general or limited moratorium or moratoria only to the extent clearly necessary to carry out the objectives stated in paragraphs 4 and 5 of this directive.\n\n47. Resumption of partial or complete service on the internal public debt at the earliest feasible date is deemed desirable. The Control Council should decide the time and manner of such resumption.\n\n48. Subject to any agreed policies of the Control Council,\n\na.\n\nYou will prohibit:\n\n(1)\n\nthe payment of all military pensions, or other emoluments or benefits, except compensation for physical disability limiting the recipient’s ability to work, at rates which are no higher than the lowest of those for comparable physical disability arising from non-military causes.\n\n(2)\n\nthe payment of all public or private pensions or other emoluments or benefits granted or conferred:\n\n(a)\n\nby reason of membership in or services to the former Nazi Party, its formations, affiliated associations or supervised organizations,\n\n(b)\n\nto any person who has been removed from an office or position in accordance with paragraph 6, and\n\n(c)\n\nto any person arrested and detained in accordance with paragraph 8 during the term of his arrest, or permanently, in case of his subsequent conviction.\n\nb.\n\nYou will take such action as may be necessary to insure that all laws and practices relating to taxation or other fields of finance, which discriminate for or against any persons because of race, nationality, [501면] creed or political opinion, will be amended, suspended, or abrogated to the extent necessary to eliminate such discrimination.\n\nc.\n\nYou will hold the German authorities responsible for taking such measures in the field of taxation and other fields of public finance, including restoration of the tax system and maintenance of tax revenues, as will further the accomplishment of the objectives stated in paragraphs 4 and 5.\n\nd.\n\nYou will exercise general supervision over German public expenditures in order to ensure that they are consistent with the objectives stated in paragraphs 4 and 5.\n\ne.\n\nYou will impound or block all gold, silver, currencies, securities, accounts in financial institutions, credits, valuable papers, and all other assets falling within the following categories:\n\n(1)\n\nProperty owned or controlled directly or indirectly, in whole or in part, by any of the following:\n\n(a)\n\nThe German Reich, or any of the Lander, Gaue or provinces, any Kreis, Municipality or other similar local subdivision; or any agency or instrumentality of any of them including all utilities, undertakings, public corporations or monopolies under the control of any of the above;\n\n(b)\n\nGovernments, nationals or residents of other nations, including those of territories occupied by them, at war with any of the United Nations at any time since 1 September 1939;\n\n(c)\n\nThe Nazi Party, its formations, affiliated associations and supervised organizations, its officials, leading members and supporters;\n\n(d)\n\nAll organizations, clubs or other associations prohibited or dissolved by military government;\n\n(e)\n\nAbsentee owners, of non-German nationality including United Nations and neutral governments and Germans outside of Germany;\n\n(f)\n\nAny institution dedicated to public worship, charity, education or the arts and sciences which has been used by the Nazi Party to further its interests or to cloak its activities;\n\n(g)\n\nPersons subject to arrest under provisions of paragraph 8, and all other persons specified by military government by inclusion in lists or otherwise.\n\n(2)\n\nProperty which has been the subject of transfer under duress or wrongful acts of confiscation, disposition or spoliation, whether pursuant to legislation or by procedure purporting to follow forms of law or otherwise.\n\n(3)\n\nWorks of art or cultural material of value or importance, regardless of the ownership thereof.\n\nYou will take such action as will insure that any impounded or blocked assets will be dealt with only as permitted under licenses or other instructions which you may issue. In the case particularly of property blocked under (1) (a) above, you will proceed to adopt [502면] licensing measures which while maintaining such property under surveillance would permit its use in consonance with this directive. In the case of property blocked under (2) above, you will institute measures for prompt restitution, in conformity with the objectives stated in paragraphs 4 and 5 and subject to appropriate safeguards to prevent the cloaking of Nazi and militaristic influence.\n\n49. All foreign exchange transactions, including those arising out of exports and imports, shall be controlled with the aim of preventing Germany from developing a war potential and of achieving the other objectives set forth in this directive. To effectuate these purposes the Control Council should\n\na.\n\nSeek out and reduce to the possession and control of a special agency all German (public and private) foreign exchange and external assets of every kind and description located within or outside Germany.\n\nb.\n\nProhibit, except as authorized by regulation or license, all dealings in gold, silver, foreign exchange, and all foreign exchange transactions of any kind. Make available any foreign exchange proceeds of exports for payment of imports directly necessary to the accomplishment of the objectives stated in paragraphs 4 and 5 of this directive, and authorize no other outlay of foreign exchange assets except for purposes approved by the Control Council or other appropriate authority.\n\nc.\n\nEstablish effective controls with respect to all foreign exchange transactions, including:\n\n(1)\n\nTransactions as to property between persons inside Germany and persons outside Germany;\n\n(2)\n\nTransactions involving obligations owed by or to become due from any person in Germany to any person outside Germany; and\n\n(3)\n\nTransactions involving the importation into or exportation from Germany of any foreign exchange asset or other form of property.\n\nPending agreement in the Control Council, you will take in your zone the action indicated in subparagraphs a, b and c above. Accordingly, you will in your zone reduce to the possession and control of a special agency established by you, within your Command, all German foreign exchange and external assets as provided in subparagraph a. You will endeavor to have similar agencies for the same purpose established in the other zones of occupation and to have them merged as soon as practicable in one agency for the entire occupied territory. In addition you will provide full reports to your government with respect to all German foreign exchange and external assets.\n\n50. No extension of credit to Germany or Germans by any foreign person or Government shall be permitted except that the Control [503면] Council may in special emergencies grant permission for such extensions of credit.\n\n51. It is not anticipated that you will make credits available to the Reichsbank or any other bank or to any public or private institution. If, in your opinion, such action becomes essential, you may take such emergency actions as you may deem proper, but in any event, you will report the facts to the Control Council.\n\n52. You will maintain such accounts and records as may be necessary to reflect the financial operations of the military government in your zone and you will provide the Control Council with such information as it may require, including information in connection with the use of currency by your forces, any governmental settlements, occupation costs, and other expenditures arising out of operations or activities involving participation of your forces.", "notes": ["[주24] 이 문서의 표지에는 비공식 대독일정책위원회 간사들이 다음과 같이 적어 놓았다. “첨부한 지령은 비공식 대독일정책위원회의 승인을 받았다”.", "[주25] 1944년 7월 25일 유럽자문위원회(EAC)가 승인한 독일 항복문서(Instrument of Surrender)의 본문은 Foreign Relations, 1944, vol. i, p. 256 참조.", "[주26] 1944년 11월 14일 런던에서 서명된, 독일 통제기구에 관한 미국·영국·소련 사이의 협정 본문은 TIAS 3070 또는 5 UST (pt. 2) 2062 참조.", "[주27] 1944년 9월 12일 런던에서 서명된, 독일의 점령지대 및 「대베를린」 행정에 관한 미국·영국·소련 사이의 의정서 본문은 TIAS 3071 또는 5 UST (pt 2) 2078 참조."], "warn": false, "pages": ["485", "486", "487", "488", "489", "490", "491", "492", "493", "494", "495", "496", "497", "498", "499", "500", "501", "502", "503"], "search": "Adolf Hitler 아돌프 히틀러"}, {"id": "d496", "order": 496, "date": "1945-04-26", "group": "A", "eyebrow": "d496 · The Ambassador in the United Kingdom (Winant) to the Secretary of State", "title": "주영대사(위넌트)가 국무장관에게", "badge": null, "list_right": "문서 496", "meta": [{"k": "일자", "v": "1945-04-26"}, {"k": "시각", "v": "London, April 26, 1945. [Received April 26—4:30 p.m.]"}, {"k": "장소", "v": "London", "txt": true}, {"k": "전문번호", "v": "4266"}, {"k": "원문출처", "v": "762.00114/4–2645: Telegram", "txt": true}, {"k": "발신", "v": "The Ambassador in the United Kingdom (Winant) 주영대사 위넌트", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 496 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d496"}], "summary": "처칠이 하원에서, 포로 처우에 관한 연합국의 대독 경고는 유엔 소속 포로·피추방자에 국한되지 않고 무국적 유대인과 정치범을 포함한 모든 수감자에게 미친다고 밝혔다.", "points": ["1945년 4월 26일 오후 처칠이 하원에서 한 발언을 위넌트가 보고한 것이다.", "연합국의 대독 경고는 「원칙상」 유엔 소속 포로와 피추방자에게만 한정되지 않는다.", "무국적 유대인과 정치범을 포함한 모든 수감자에게 그 경고가 미친다.", "영국 정부는 다른 유엔 정부들과 함께, 인종이나 종교를 이유로 수감된 사람들에 대한 학대의 책임을 적에게 묻겠다는 뜻을 거듭 선언해 왔다고 했다.", "말미의 대괄호 편집자 주는 5월 15일 그루 국무장관 대리가 베른 공사에게, 미국인 포로·민간인 억류자 수용소를 찾아간 스위스 대표들의 「비상한 노고」에 미국 정부의 「감사」를 스위스 정부에 전하라고 지시한 사실을 전한다."], "primary": "런던, 1945년 4월 26일.\n [접수 4월 26일 오후 4시 30분]\n\n4266. 오늘 오후 총리는 하원에서, 포로 처우에 관한 연합국의 대독 경고가 [710면] 원칙상 유엔의 포로 및 피추방자에게만 한정되는 것이 아니라 무국적 유대인과 정치범을 포함한 모든 수감자에게까지 미친다고 말하였다. 총리는 영국 「정부가 여타 유엔 정부들과 함께, 인종 또는 종교를 이유로 수감되어 온 사람들에 대한 학대에 관하여 적에게 책임을 물을 의사를 거듭 선언하여 왔다」고 덧붙였다.\n\n위넌트(Winant)\n\n[1945년 5월 15일 베른 앞 전보 1807호에서 그루(Grew) 국무장관 대리는 주스위스공사에게, 미국인 전쟁포로와 민간인 억류자들이 수용되어 있던 수용소들로 「막대한 개인적 고초와 위험을 무릅쓰고」 나아가 준 「스위스 대표들이 베푼 비상한 노고」에 대하여, 또한 스위스 대표들이 「미국인과 그 밖의 연합국 국민들이 해방군에게 안전하게 인도되도록 하는 데」 한 역할에 대하여, 미국 정부의 「깊은 감사」를 스위스 정부에 표명하라고 지시하였다. (762.00114/4–3045)]\n\n연합군이 진격하는 동안 전쟁포로를 수용소에 그대로 둔다는 독일 측 제안의 수락 — 단, 연합국이 그 포로들을 현역 복무로 복귀시키지 않기로 동의할 것을 조건으로", "secondary": "London, April 26, 1945.\n[Received April 26—4:30 p.m.]\n\n4266. This afternoon Prime Minister stated in House of Commons that Allied warning to Germany about care of prisoners was not in [710면] principle limited to Allied prisoners and deportees of United Nations but extended to all prisoners including stateless Jews and political prisoners. Prime Minister added that British “Government in common with the other Governments of the United Nations have repeatedly declared their intention to hold the enemy responsible for the maltreatment of persons who have been imprisoned on grounds of race or religion”.\n\nWinant\n\n[In telegram 1807, May 15, to Bern, Acting Secretary of State Grew instructed the Minister in Switzerland to express to the Swiss Government the “grateful appreciation” of the United States Government for “the extraordinary services rendered by Swiss representatives” in going forward “under conditions of great personal hardship and danger” to the camps at which were held American prisoners of war and civilian internees, and also for the part that the Swiss representatives played “in bringing about the safe delivery of American and other Allied nationals to the liberating forces.” (762.00114/4–3045)]\n\nAcceptance of German proposal that prisoners of war be left in camps as Allies advanced, provided Allies agreed not to return prisoners to active duty", "notes": [], "warn": true, "pages": ["710"], "search": "Winant 위넌트(주영대사) Churchill 처칠(영국 총리) Grew 그루(국무장관 대리)"}, {"id": "d552", "order": 552, "date": "1945-04-26", "group": "A", "eyebrow": "d552 · The Acting Secretary of State to the Secretary of State", "title": "국무장관 대리가 국무장관에게", "badge": null, "list_right": "문서 552", "meta": [{"k": "일자", "v": "1945-04-26"}, {"k": "시각", "v": "Washington, April 26, 1945—2:26 p.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "7"}, {"k": "원문출처", "v": "740.00119 EW/4–2645: Telegram", "txt": true}, {"k": "발신", "v": "The Acting Secretary of State (Grew) 국무장관 대리 그루", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관 (샌프란시스코)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 552 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d552"}], "summary": "힘러가 서부전선에서만 항복(capitulate)하겠다고 타진한 데 대하여, 스탈린은 소련 전선을 포함한 전 전선에서의 무조건 항복을 요구하는 트루먼의 회답안이 「절대적으로 옳다」고 답했고, 대통령은 곧바로 스톡홀름 공사에게 그 취지의 회답을 지시했다.", "points": ["소련 대리대사 노비코프가 4월 26일 정오에 스탈린의 메시지를 그루에게 전달했고, 그루는 즉시 대통령에게 가져갔다.", "스탈린은 힘러가 「서부전선에서 항복(capitulate)」할 의사라는 통보에 감사하고, 소련 전선을 포함한 전 전선에서의 무조건 항복(unconditional surrender) 노선에 따른 회답이 절대적으로 옳다고 했다.", "스탈린은 러시아인들이 독일에 대한 공격을 계속할 것을 서약한다고 했으며, 같은 문제로 연락해 온 처칠에게도 같은 취지로 답했다고 알렸다.", "대통령은 즉시 주스웨덴공사에게 전보하여, 힘러의 대리인에게 「독일의 유일하게 수락 가능한 항복 조건은 소련 정부·영국·미국에 대한 전 전선에서의 무조건 항복뿐」임을 통고하게 했다.", "위 조건이 수락되면 독일군은 전 전선에서 즉시 현지 야전 지휘관들에게 항복해야 한다(should surrender at once).", "저항이 계속되는 모든 전역에서는 완전한 승리를 거둘 때까지 연합국의 공격이 강력히 수행될 것이다."], "primary": "워싱턴, 1945년 4월 26일 오후 2시 26분.\n\n7. 4월 25일자 본인의 26호를 참조하라. 스탈린 원수가 대통령에게 보내는 다음 메시지가 오늘 정오에 소련 대리대사[주35]에 의하여 본인에게 전달되었으며, 본인은 이를 즉시 대통령에게 가져갔다.\n\n「귀하의 4월 26일자 메시지[주36]를 받았다. 힘러가 서부전선에서 항복(capitulate)할 의사라는 정보를 알려 준 데 대하여 감사한다. 소련 전선을 포함한 전 전선에서의 무조건 항복(unconditional surrender) 노선에 따른 귀하의 회답안은 절대적으로 옳다고 본다. 귀하의 제안의 정신대로 행동해 줄 것을 요청하며, 우리 러시아인들은 독일군에 대한 공격을 계속할 것을 서약한다.\n\n귀하의 참고를 위하여, 같은 문제로 본인에게 연락해 온 처칠 총리에게도 본인이 유사한 회답을 주었음을 알려 두고자 한다.」\n\n대통령은 즉시 다음 전보를 스톡홀름 주재 우리 공사에게 보냈다.[주37] [769면]\n\n「귀하의 4월 25일 오전 3시자 [1528]호에 대한 회답. 힘러의 대리인에게 독일의 유일하게 수락 가능한 항복 조건은 소련 정부, 영국 및 미국에 대한 전 전선에서의 무조건 항복뿐임을 통고하라.\n\n위에 적시한 항복 조건이 수락된다면, 독일군은 즉시 전 전선에서 현지 야전 지휘관들에게 항복해야 한다.\n\n저항이 계속되는 모든 전역에서는 완전한 승리가 달성될 때까지 그들에 대한 연합국의 공격이 강력하게 수행될 것이다.」\n\n그루(Grew)", "secondary": "Washington, April 26, 1945—2:26 p.m.\n\n7. Reference my 26, April 25. The following message from Marshal Stalin for the President was handed to me at noon today by the Soviet Chargé d’Affaires [주35] and taken by me immediately to the President:\n\n“I have received your message of April 26. [주36] Thank you for your information of the intention of Himmler to capitulate on the Western front. I consider your proposed reply to Himmler along the lines of unconditional surrender on all fronts, including the Soviet front, absolutely correct. I ask you to act in the spirit of your proposal, and we, Russians, pledge to continue our attacks against the Germans.\n\nFor your information I wish you to know that I have given a similar reply to Premier Churchill who communicated with me on the same question.”\n\nThe President immediately sent the following telegram to our Minister in Stockholm: [주37] [769면]\n\n“Replying to your [1528] April 25, 3 A.M., inform Himmler’s agent that the only acceptable terms of surrender by Germany are unconditional surrender on all fronts to the Soviet Government, Great Britain and the United States.\n\nIf the above stated terms of surrender are accepted the German Forces should surrender on all fronts at once to the local commanders in the field.\n\nIn all theaters where resistance continues the attack of the Allies upon them will be vigorously prosecuted until complete victory is attained.”\n\nGrew", "notes": ["[주35] 니콜라이 바실리예비치 노비코프(Nikolay Vasilyevich Novikov).", "[주36] 바로 앞 문서를 보라.", "[주37] 1945년 4월 26일 오후 1시 스톡홀름 앞 전보 754호로 발송되었다."], "warn": false, "pages": ["769"], "search": "Grew 그루(국무장관 대리) Stalin 스탈린(소련 인민위원회의 의장) Truman 트루먼(대통령) Himmler 힘러 Churchill 처칠(영국 총리) Novikov 노비코프(소련 대리대사) Johnson 존슨(주스웨덴공사)"}, {"id": "d859", "order": 859, "date": "1945-04-26", "group": "C", "eyebrow": "d859 · Memorandum of Conversation, by Mr. Oscar S. Straus, Division of Foreign Activity Correlation", "title": "대외활동조정과 오스카 S. 스트라우스의 대화 비망록", "badge": null, "list_right": "문서 859", "meta": [{"k": "일자", "v": "1945-04-26"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "862.414/4–2645", "txt": true}, {"k": "발신", "v": "Mr. Oscar S. Straus, Division of Foreign Activity Correlation 대외활동조정과 오스카 S. 스트라우스", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "대화 비망록"}], "links": [{"k": "FRUS", "text": "문서 859 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d859"}], "summary": "중립국 소재 독일 대사관·영사관 등의 문서 확보 작업을 영국과 공조하기로 하고, 소련에도 이를 알려 카불과 스톡홀름에서 함께 하도록 초청하기로 했다.", "points": ["매슈스(EUR)의 요청으로 우리 계획을 영국 측과 맞추기 위해 영국대사관 2등서기관 매클린을 국무부로 불렀다.", "4월 25일 오후 5시 컬버트슨의 사무실에서 회합이 열렸다.", "중립국 소재 독일 대사관·영사관 및 그 밖의 관청에 있는 정보를 확보하는 노력에 영국이 협조해 주기를 국무부가 바란다고 매클린에게 알렸다.", "매클린은 더블린 공사와 리스본 대사가 현지에서 영국 동료들과 협의했으므로 3월 31일 오후 3시자 국무부 회람전보의 내용을 이미 알고 있었다.", "스톡홀름 공사관과 여타 아메리카 공화국 주재 공관들에 보낼 전보가 준비되어 있으며, 매클린이 협력에 찬성하고 즉시 런던 외무부에 타전하겠다고 하자 회합이 끝난 뒤 그 전보들이 발송되었다.", "국무부는 소련 정부에도 3월 31일 회람전보의 조치를 알려야 하며, 카불과 스톡홀름의 소련 대표들이 미·영 측과 함께하도록 초청해야 한다고 보았고, 매클린도 이 절차에 동의했다."], "primary": "[워싱턴,] 1945년 4월 26일.\n\n참석자: 폴 컬버트슨 씨—EUK[주21]\n\n해럴드 모즐리 씨—EUR\n\nD. D. 매클린 씨—영국대사관 2등서기관\n\nO. S. 스트라우스 씨—FC\n\n우리 계획을 영국 측 계획과 맞추자는 매슈스 씨(EUR)[주22]의 요청에 따라 매클린 씨에게 국무부로 와 줄 것을 청하였다.\n\n이에 따라 4월 25일 오후 5시 컬버트슨 씨의 사무실에서 회합이 열렸으며, 이 자리에서 매클린 씨는 중립국들에 있는 독일 대사관, 영사관 및 그 밖의 정부 관청들에 들어 있는 정보를 입수하려는 시도에 영국이 협조해 주기를 국무부가 바라고 있다는 사실을 통고받았다. 매클린 씨는 3월 31일 오후 3시자 국무부 회람전보를 이미 알고 있었는데, 이는 우리 더블린 공사[주23]와 리스본 대사[주24]가 각각 현지에서 영국 측 동료와 협의하였으므로 런던 외무부가 그 내용을 통보받았기 때문이다.\n\n매클린 씨는 스톡홀름 주재 미국 공사관과 여타 아메리카 공화국 주재 우리 공관들 앞으로, 이 문제에서 영국 측 동료들과 협력하여 행동하도록 지시하는 전보들이 작성되어 발송 준비가 되어 있으며, 그 밖의 활동 중인 중립국들에 있는 우리 공관들에도 유사한 훈령이 기초되어 있다는 사실을 통고받았다. 매클린 씨는 이 협력 조치에 찬성하고, 즉시 그 취지로 런던 [1140면] 외무부에 타전하겠다고 말하였다. 이에 따라 회합이 끝날 무렵 국무부의 전보들이 여타 아메리카 공화국 주재 우리 공관들과 스톡홀름 주재 미국 공사관 앞으로 발송되었다.\n\n동시에 매클린 씨는, 3월 31일자 국무부 회람전보에서 제안된 조치를 소련 정부에 알려야 한다고 국무부가 여기고 있음을 통고받았다. 마찬가지로 국무부는 카불과 스톡홀름 주재 소련 대표들이 원하는 정보를 얻으려는 노력에서 미국 및 영국 측 상대와 손을 잡도록 소련 정부를 초청하여야 한다고 여겼다. 매클린 씨는 이 절차에 동의하고 이 내용을 런던 외무부에 전달하겠다고 말하였다.", "secondary": "[Washington,] April 26, 1945.\n\nParticipants: Mr. Paul Culbertson—EUK [주21]\n\nMr. Harold Moseley—EUR\n\nMr. D. D. Maclean—Second Secretary, British Embassy and\n\nMr. O. S. Straus—FC\n\nAt Mr. Matthews’ (EUR) [주22] request that our program be correlated with the British, Mr. Maclean was asked to come to the Department.\n\nAccordingly, a meeting was held in Mr. Culbertson’s office at 5:00 p.m. on April 25 and at this time Mr. Maclean was informed that it is the desire of the Department that Great Britain assist in the attempt to obtain information contained in German embassies, consulates, and other governmental offices in neutral countries. Mr. Maclean was familiar with the Department’s circular telegram of March 31, 3 p.m. since the Foreign Office in London had been informed of the context through the Minister at Dublin [주23] and the Ambassador at Lisbon [주24] since our Minister and Ambassador respectively, had conferred with their British colleague on the spot.\n\nMr. Maclean was informed that telegrams were prepared and were ready to send out to the American Legation at Stockholm and to our missions in the other American Republics instructing them to act in this matter in conjunction with their British colleagues and that similar instructions had been drafted to our missions in the remainder of the active neutral countries. Mr. Maclean approved of the cooperative action and stated that he would immediately telegraph the Foreign [1140면] Office at London in this sense. Accordingly, at the end of the meeting the Department’s telegrams were released to our missions in the other American Republics and to the American Legation at Stockholm.\n\nAt the same time Mr. Maclean was informed that the Department felt that the Soviet Government should be apprised of the action proposed in the Department’s circular telegram of March 31. Likewise, the Department felt that the Soviet Government should be invited to have its representatives in Kabul and Stockholm associate themselves with their American and British counterparts in an effort to obtain the desired information. Mr. Maclean agreed to the procedure and stated that he would relay this information to the Foreign Office at London.", "notes": ["[주21] 유럽국(Office of European Affairs).", "[주22] H. 프리먼 매슈스(H. Freeman Matthews), 유럽국장.", "[주23] 데이비드 그레이(David Grey).", "[주24] 허먼 B. 배럭(Herman B. Baruch)."], "warn": false, "pages": ["1140"], "search": "Oscar S. Straus 오스카 S. 스트라우스(FC) Paul Culbertson 폴 컬버트슨(EUK) Harold Moseley 해럴드 모즐리(EUR) D. D. Maclean 도널드 D. 매클린(영국대사관 2등서기관) H. Freeman Matthews 매슈스(유럽국장) David Grey 데이비드 그레이(주아일랜드공사) Herman B. Baruch 허먼 B. 배럭(주포르투갈대사)"}, {"id": "d70", "order": 70, "date": "1945-04-27", "group": "A", "eyebrow": "d70 · The United States Political Adviser on Austrian Affairs (Erhardt) to the Secretary of State", "title": "오스트리아 문제 담당 미국 정치고문(에어하트)이 국무장관에게", "badge": null, "list_right": "문서 70", "meta": [{"k": "일자", "v": "1945-04-27"}, {"k": "시각", "v": "Caserta, April 27, 1945—1 p.m. [Received 8:37 p.m.]"}, {"k": "장소", "v": "Caserta", "txt": true}, {"k": "전문번호", "v": "1761"}, {"k": "원문출처", "v": "740.00119 Control (Austria)/4–2745: Telegram", "txt": true}, {"k": "발신", "v": "The United States Political Adviser on Austrian Affairs (Erhardt) 오스트리아 문제 담당 미국 정치고문 에어하트", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 70 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d70"}], "summary": "빈 주재 소련 사령관이 EAC의 소련 측 제안 테두리 안에서만 빈의 지대 구분을 논의할 권한을 갖는다면 미·소의 입장 차가 너무 커서 의견 일치의 전망이 없다고 보고했다.", "points": ["에어하트가 매크나니·플로리 두 장군과 함께 비신스키의 회답 및 레너의 임시정부 구성 제안에 관한 모스크바 전보들을 검토했다.", "소련 사령관이 EAC에 제출된 소련 제안의 틀 안에서만 빈 지대 구분을 논의할 권한을 갖는다면, 미·소 입장이 너무 벌어져 의견 일치의 전망이 없다고 보았다.", "미국은 비행장 확보를 포기할 수 없는데, EAC의 소련 제안은 소련 통제 아래 아스페른을 사용하게 하거나 툴른 비행장을 미·영·프에 배정하는 것뿐이며 둘 다 수락할 수 없다.", "군 당국은 이 최신 정보가, 점령국 간 지위 평등 원칙을 처음부터 확고히 세우지 않으면 오스트리아에서도 도나우 지역에서 겪은 어려움이 되풀이될 조짐이라고 본다.", "국무부에 1761호로 발송, 런던에 174호, 모스크바에 150호로 반복 발송했다."], "primary": "카세르타, 1945년 4월 27일 오후 1시.\n [접수 오후 8시 37분]\n\n1761. 본인은 매크나니 장군 및 플로리 장군과 더불어, 빈에 미국 사절단을 파견하는 문제에 관한 비신스키의 회답을 전한 모스크바 전보들과 아울러 레너가 내놓은 임시정부 구성 제안에 관하여 논의하였다. 만일 빈 주재 소련 사령관이 EAC에 제출된 소련 측 제안을 바탕으로 하여 그 테두리 안에서만 빈의 지대 구분을 논의할 권한을 갖게 된다면, 미국과 소련의 입장은 너무나 동떨어져 있어 의견의 일치를 볼 전망이 없다고 보는 것이 합당할 듯하다. 미국은 비행장 하나를 확보하는 일을 포기할 수 없는데, 본인이 아는 한 EAC에서의 소련 측 제안은 소련의 통제 아래 아스페른을 사용하게 하거나 툴른 비행장을 미국·영국·프랑스에 배정하는 것 외에는 우리에게 아무것도 주지 않으며, 두 제안 모두 수락할 수 없는 것이다.\n\n군 당국은 모스크바에서 온 이 최신 정보가, 점령국들 사이의 지위 평등이라는 원칙이 맨 처음부터 확고히 수립되지 않는 한 도나우 지역 전반에서 겪은 어려움 가운데 일부가 오스트리아에서 되풀이될 조짐이라고 보고 있다.\n\n국무부에 1761호로 발송, 런던에 174호로 반복 발송. 모스크바에는 150호로.\n\n[에어하트(Erhardt)]", "secondary": "Caserta, April 27, 1945—1 p.m. \n [Received 8:37 p.m.]\n\n1761. I have talked over with Generals McNarney and Flory Moscow’s telegrams giving Vyshinski’s reply concerning despatch of an American Mission to Vienna, and also the proposal advanced by Renner to form a Provisional Government. It seems reasonable to suppose that if the Soviet Commander in Vienna is to have authority to discuss zoning of Vienna only on the basis and within the framework of Soviet proposals advanced in the EAC, the US and Soviet positions are so divergent that there is offered no prospect for a meeting of minds, since the US cannot forego obtaining an airport and the Soviet proposals in the EAC, so far as I know, do not provide anything for us except the use of Aspern under Soviet control or the allocation to the US, UK and France of Tulln airport, both proposals being unacceptable.\n\nThe military view this latest information from Moscow as portending a repetition in Austria of some of the difficulties experienced in the Danubian area generally unless at the very beginning there is firmly established the principle of equality of status among the occupying powers.\n\nSent Department as 1761, repeated to London as 174. To Moscow as 150.\n\n[Erhardt]", "notes": [], "warn": false, "pages": [], "search": "Erhardt 에어하트(오스트리아 문제 담당 미국 정치고문) McNarney 매크나니(미군 장군) Flory 플로리(준장) Vyshinski 비신스키(소련 외무인민위원 대리) Renner 레너(오스트리아)"}, {"id": "d71", "order": 71, "date": "1945-04-27", "group": "A", "eyebrow": "d71 · The United States Political Adviser on Austrian Affairs (Erhardt) to the Secretary of State", "title": "오스트리아 문제 담당 미국 정치고문(에어하트)이 국무장관에게", "badge": null, "list_right": "문서 71", "meta": [{"k": "일자", "v": "1945-04-27"}, {"k": "시각", "v": "Caserta, April 27, 1945—11 p.m. [Received 11:59 p.m.]"}, {"k": "장소", "v": "Caserta", "txt": true}, {"k": "전문번호", "v": "1762"}, {"k": "원문출처", "v": "740.00119 Control (Austria)/4–2745: Telegram", "txt": true}, {"k": "발신", "v": "The United States Political Adviser on Austrian Affairs (Erhardt) 오스트리아 문제 담당 미국 정치고문 에어하트", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 71 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d71"}], "summary": "빈 사절단에 관하여 매크나니가 플로리 준장에게 준 지침의 요점 여덟 가지를 보고했다. 빈 대관구의 지대 구분 교섭에서 네 점령국의 평등을 기본 원칙으로 삼으라는 것이다.", "points": ["국무부는 빈 사절단에 관한 합동참모본부의 4월 26일자 대(對)매크나니 전보 W–73445호를 보아야 한다.", "플로리는 매크나니의 대표로서 프랑스·소련·영국과 빈 대관구의 지대 구분 및 내부 시가지 시설 배분을 교섭하며, 최종 조치는 각 층위에서 취한다.", "교섭의 기준은 JCS 1169/9와 JCS 전문 WX72646이다.", "대안(對案)에 넣어야 할 네 가지: (a) 빈 대관구 분할의 기본 원칙은 네 점령국 간의 평등, (b) 내부 시가지 시설의 만족스러운 배분, (c) 미국 지대는 란트슈트라세·비덴·파보리텐·지머링·슈베하트, (d) 네 나라 모두 오스트리아 전역에서 타국 지대 상공·지상 통과권을 완전히 인정받을 것.", "플로리의 대안은 미국 지대에 관한 미국 측 제안으로만 제출하고 타국 지대는 포함하지 않되, 다른 곳에 충분한 항공 시설이 갖추어질 때까지 미국 비행장 시설을 나머지 세 점령국이 더 넓게 이용할 수 있게 한다는 조건은 붙일 수 있다.", "합의에 이르기 위해 슈베하트·츠뵐팍싱 비행장 너머의 슈베하트 구역에 대한 요구는 포기할 수 있다.", "플로리의 상대역 윈터턴이 방금 소장으로 승진했고, 필리프 보데가 이끄는 7인의 프랑스 대표단이 일요일(4월 29일) 카세르타에 도착한다."], "primary": "카세르타, 1945년 4월 27일 오후 11시.\n [접수 오후 11시 59분]\n\n1762. 국무부는 빈 사절단에 관한, 합동참모본부가 매크나니 장군에게 보낸 4월 26일자 전보 W–73445호[주83]를 보아야 한다. 이와 관련하여 매크나니 장군은 [99면] 플로리 준장에게 지침이 될 지령을 주었는데, 그 요점은 다음과 같다.\n\n1.\n\n플로리는 매크나니의 대표로서 프랑스·소련·영국 측과 빈에 관하여, 즉 빈 대관구(Gau Vienna)의 지대 구분과 내부 시가지의 시설 배분에 관하여 교섭한다. 최종적인 조치는 각 층위에서 취한다.\n\n2.\n\n교섭의 기준으로 플로리는 JCS 1169/9[주84]와 JCS 전문 WX72646[주85]의 지침을 따른다.\n\n3.\n\n플로리는 자기에게 제시된 제안들을 검토하고 소련 측의 허가를 얻어 빈의 지대들을 살펴본다. 제시된 제안이 제2항에 규정된 원칙에 완전히 부합한다면 플로리는 매크나니가 합동참모본부에 권고하고 이를 EAC로 전달하기 위한 기초로서 그 제안에 동의할 수 있다. 제안이 제2항에 부합하지 않으면 플로리는 다음 네 가지 사항의 요지를 포함하여 서면으로 대안(對案)을 제출한다. (a) 빈 대관구의 세분(細分)을 규율하는 기본 원칙은 네 점령국 간의 평등일 것, (b) 내부 시가지의 시설을 만족스럽게 배분할 것, (c) 미국 지대는 란트슈트라세, 비덴, 파보리텐, 지머링 및 슈베하트의 각 구(區)로 할 것, (d) 점령에 참가하는 네 나라 각각은 오스트리아 전역에 걸쳐 다른 나라 지대 위를 지상 및 항공으로 통과할 완전한 권리를 인정받을 것.\n\n플로리가 내놓는 어떠한 대안에도, 빈 점령에 대한 연합국의 참가와 빈 대관구의 분할이 평등의 원칙에 입각한다는 취지의 진술을 포함시키기로 하였다.\n\n4.\n\n플로리의 대안은 미국 지대에 관한 미국 측 제안으로서 제시되며 다른 나라들의 지대는 포함하지 아니한다. 다만 다른 곳에 충분한 항공 시설이 마련될 때까지는 미국 비행장의 시설을 나머지 세 점령국이 더 넓은 기초 위에서 이용할 수 있게 한다는 것은 조건으로 붙일 수 있다.\n\n5.\n\n합의에 이르기 위하여 플로리는 슈베하트 및 츠뵐팍싱 비행장 너머에 있는 슈베하트 구역에 대한 요구를 포기할 수 있다.\n\n6.\n\n플로리는 항상 매크나니에게 보고하며, 이 지령이 다루지 않은 사항에 대하여는 훈령을 요청한다.\n\n7.\n\n플로리는 매크나니 본인이 빈으로 와야 한다고 생각하거나 교섭의 어느 단계에서든 회담을 종결하여야 한다고 판단하면 매크나니에게 알린다.\n\n8.\n\n다른 나라 대표들이 교섭의 범위를 벗어나는 사항을 제기하면 플로리는 그러한 사항을 논의할 권한은 있으나 아무런 약속도 하지 아니한다.\n\n플로리의 상대역인 윈터턴[주86]이 방금 소장(少將)으로 승진하였다. 맥이 윈터턴을 수행할 것이며 본인은 물론 플로리를 수행할 것이다.\n\n[100면]\n\n필리프 보데가 이끄는 7인으로 이루어진 프랑스 대표단이 일요일[주87]에 카세르타에 도착한다.\n\n[에어하트(Erhardt)]", "secondary": "Caserta, April 27, 1945—11 p.m. \n [Received 11:59 p.m.]\n\n1762. The Department should see a telegram from the Joint Chiefs of Staff to General McNarney, No. W–73445 of April 26 [주83] relative to mission to Vienna. In this connection General McNarney has [99면] given Brigadier General Flory a directive for guidance the main points of which are:\n\n1.\n\nFlory, as McNarney’s representative, will negotiate with French, Soviets and British on Vienna on zoning of Gau Vienna, and allocating facilities in the inner city. Final action will be taken at each level.\n\n2.\n\nAs a basis for his negotiations Flory is to be guided by JCS 1169/9 [주84] and JCS message WX72646. [주85]\n\n3.\n\nFlory is to examine proposals presented to him and with Soviet permission look over the Vienna zones. If proposals presented are in full accord with principles laid down in paragraph 2 Flory can agree to them as a basis for McNarney’s recommendations to Joint Chiefs for transmission to the EAC. If proposals are not in line with paragraph 2 Flory is to submit counter proposals in writing, including substance of following four points: (a) equality between four occupying powers will be the basic principle governing the subdivision of Gau Vienna; (b) there will be a satisfactory allocation of the facilities of the inner city; (c) the US zone will be districts of Landstrasse, Wieden, Favoriten, Simmering and Schwechat; and (d) each of the four nations participating in the occupation will be accorded full rights of transit by ground and air over the zones of the other nations throughout Austria.\n\nAny counter proposal made by Flory was also to include a statement to effect that Allied participation in occupation of Vienna and division of Vienna Gau are based on principle of equality.\n\n4.\n\nFlory’s counter proposals will be offered as American proposals for American zones and will not include zones of other countries, except that it can be stipulated that facilities of the United States airfield will be available to other three occupying powers on a larger basis until adequate air facilities may be available elsewhere.\n\n5.\n\nTo arrive at agreement Flory could waive claim to Schwechat district lying beyond Schwechat and Zwolfaxing airfields.\n\n6.\n\nFlory is to keep McNarney informed at all times and is to request instructions on matters not covered by this directive.\n\n7.\n\nFlory is to advise McNarney if he thinks the latter should come to Vienna himself or if he believes the conversations should be ended at any stage of the negotiations.\n\n8.\n\nIf other representatives bring up matters outside of scope of negotiations Flory is authorized to discuss such matters but to make no commitment.\n\nWinterton, [주86] Flory’s opposite number, has just been made a Major General. Mack will accompany Winterton and I of course shall accompany Flory.\n\n[100면]\n\nThe French delegation consisting of seven people and headed by Philippe Baudet is arriving in Caserta Sunday. [주87]\n\n[Erhardt]", "notes": ["[주83] 국무부 문서철에서 찾지 못하였다.", "[주84] 인쇄하지 않음. 1945년 3월 29일자 「미국의 오스트리아 점령지대 수락(Acceptance by the United States of Zone of Occupation in Austria)」이라는 제목의 이 합동참모본부 문서에 담긴 권고는 4월 5일 오후 8시 런던 앞 전보 2658호로 전달되었다. 45면.", "[주85] 인쇄하지 않음. 이 전보의 요약은 5월 1일 오후 3시 런던 앞 전보 3400호의 마지막 항을 보라. 107면.", "[주86] T. J. W. 윈터턴(T. J. W. Winterton) 소장, 오스트리아 통제위원회 영국 요소의 부(副)판무관(군사).", "[주87] 4월 29일."], "warn": false, "pages": ["99", "100"], "search": "Erhardt 에어하트(오스트리아 문제 담당 미국 정치고문) McNarney 매크나니(미군 장군) Flory 플로리(준장) Winterton 윈터턴(영국 통제위원회 부판무관) Mack 맥(영국) Philippe Baudet 필리프 보데(프랑스 대표단장)"}, {"id": "d352", "order": 352, "date": "1945-04-27", "group": "C", "eyebrow": "d352 · Memorandum of Conversation, by the Acting Secretary of State", "title": "국무장관 대리의 대화 비망록", "badge": null, "list_right": "문서 352", "meta": [{"k": "일자", "v": "1945-04-27"}, {"k": "시각", "v": "10:10 a.m. (대통령 접견 시각)"}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.00119 Control (Germany)/4–2545", "txt": true}, {"k": "발신", "v": "The Acting Secretary of State (Grew) 국무장관 대리 그루", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "대화 비망록"}], "links": [{"k": "FRUS", "text": "문서 352 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d352"}], "summary": "전후 독일 처리 지령을 다듬기 위한 비공식 위원회가 4월 27일 오전 10시 10분에 대통령을 만나 문서들을 제출했고, 대통령은 오스트리아에 대해서도 같은 연구를 하되 독일과 오스트리아의 처우는 상당히 달라야 한다고 분명히 했다.", "points": ["참석자는 대통령, 모겐소 장관, 클레이턴, 매클로이, 바드, 크롤리, 그리고 국무장관 대리 그루.", "대통령은 4월 27일 오전 10시 10분에 이 비공식 위원회를 접견했다.", "위원회 위원장인 그루가 회합의 목적을 설명하고, 클레이턴이 군사·정치, 경제·재정 국면을 다룬 문서들을 대통령에게 설명했다.", "대통령은 이 문제에 큰 관심을 보이며 위원회가 합의한 문서들을 직접 검토하겠다고 했고, 문서들이 그 즉시 그에게 건네졌다.", "대통령은 전후 오스트리아 처리에 관해서도 같은 연구를 하기를 바란다고 했으나, 독일과 오스트리아의 처우는 상당히 달라야 한다는 점을 분명히 했다."], "primary": "[워싱턴,] 1945년 4월 27일.\n\n참석자: 대통령\n\n모겐소 장관\n\n클레이턴 씨\n\n매클로이 씨\n\n바드 씨\n\n크롤리 씨\n\n국무장관 대리 그루 씨\n\n대통령은 오늘 아침 10시 10분에, 전후 독일 처리를 위한 지령을 다듬을 목적으로 설치된 비공식 위원회를 접견하였다. 이 위원회는 모겐소 장관, 클레이턴 씨, 매클로이 씨, 바드 씨, 크롤리 씨 및 본인으로 이루어져 있다. 위원회의 위원장으로서 본인은 대통령에게 이 회합의 목적을 말씀드리고, 이어 클레이턴 씨에게 이 문제의 군사·정치 국면과 경제·재정 국면을 다루어 작성된 문서들을 대통령에게 설명하도록 청하였다. 대통령은 이 문제에 깊은 관심이 있으며 위원회가 합의한 문서들을 몸소 검토하고 싶다고 말하였고, 그 문서들은 그 자리에서 대통령에게 건네졌다. 클레이턴 씨의 물음에 대하여 대통령은, 전후 오스트리아의 처우에 관하여도 위원회가 같은 연구를 수행해 준다면 기쁘겠다고 말하면서, 다만 독일과 오스트리아의 처우는 상당히 달라야 한다는 점을 분명히 하였다.\n\n조지프 C. 그루(Joseph C. Grew)\n\n[504면]", "secondary": "[Washington,] April 27, 1945.\n\nParticipants: The President\n\nSecretary Morgenthau\n\nMr. Clayton\n\nMr. McCloy\n\nMr. Bard\n\nMr. Crowley\n\nActing Secretary, Mr. Grew\n\nThe President this morning at 10:10 received the informal committee set up for the purpose of elaborating the directives for dealing with post-war Germany composed of Secretary Morgenthau, Mr. Clayton, Mr. McCloy, Mr. Bard, Mr. Crowley and myself. As Chairman of the Committee, I told the President the purpose of the meeting and then asked Mr. Clayton to explain to the President the papers which had been drawn up covering the military and political, economic and financial phases of the problem. The President said that he was keenly interested in this matter and that he wished personally to study the papers agreed upon by the Committee, which were then handed to him. In reply to a question from Mr. Clayton, the President said that he would be glad to have the Committee pursue the same studies in connection with the treatment of post-war Austria, but he made it clear that the treatment of Germany and Austria should be quite different.\n\nJoseph C. Grew\n\n[504면]", "notes": [], "warn": false, "pages": ["504"], "search": "Truman 트루먼(대통령) Morgenthau 모겐소(재무장관) Clayton 클레이턴(국무차관보) McCloy 매클로이(육군차관보) Bard 바드(해군차관보) Crowley 크롤리(대외경제국장) Grew 그루(국무장관 대리)"}, {"id": "d553", "order": 553, "date": "1945-04-27", "group": "A", "eyebrow": "d553 · Mr. Alexander C. Kirk, Political Adviser on the Staff of the Supreme Allied Commander, Mediterranean Theater, to the Acting Secretary of State", "title": "지중해전역 연합국최고사령관 막료 정치고문 알렉산더 C. 커크가 국무장관 대리에게", "badge": null, "list_right": "문서 553", "meta": [{"k": "일자", "v": "1945-04-27"}, {"k": "시각", "v": "Caserta, April 27, 1945—3 p.m. [Received April 27—10:02 a.m.]"}, {"k": "장소", "v": "Caserta", "txt": true}, {"k": "전문번호", "v": "1754"}, {"k": "원문출처", "v": "740.0011 EW/4–2745: Telegram", "txt": true}, {"k": "발신", "v": "Mr. Alexander C. Kirk, Political Adviser on the Staff of the Supreme Allied Commander, Mediterranean Theater 지중해전역 연합국최고사령관 막료 정치고문 알렉산더 C. 커크", "txt": true}, {"k": "수신", "v": "The Acting Secretary of State 국무장관 대리", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 553 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d553"}], "summary": "이탈리아 주둔 독일군의 현지 항복 서명을 위해 볼프 장군 일행이 카세르타로 오는 문제를 다룬 군 전보들을 국무부가 육군부를 통해 파악하도록 알리고, 이 극비 사안을 국무부에 계속 보고하지는 않겠다고 했다.", "points": ["3월 26일 오후 3시자 1166호를 참조하라고 했다.", "마셜 장군이 모스크바 딘 사절단 앞 Naf 933호(합동참모본부에도 반복 발송)와 합동참모본부가 알렉산더 원수에게 보낸 Fan 532호에 관하여 국무장관에게 계속 알려 줄 것으로 본다고 했다.", "대표들이 오늘 저녁 카세르타에 도착할 예정이고, 소련 군 관계자들의 참석이 주선되고 있다.", "커크는 별도 지시가 없는 한 이 극도로 비밀스러운 사안을 국무부에 수시로 보고하지 않겠다고 했다.", "각주에 따르면 볼프 장군과 폰 슈바이니츠 중령이 이탈리아 주둔 적군의 현지 항복(local surrender)에 서명하러 연합군최고사령부로 오게 되어 있었고, 스위스에서는 흥정이나 교섭이 있어서는 안 되며 독일 측이 즉시 카세르타로 오지 않으면 접촉을 끊기로 되어 있었다.", "알렉산더는 소련 총참모부에 이 사실을 알리되 합동참모본부가 붙인 조건과 이 접근이 독일 측 발의로 이루어졌다는 점을 강조하도록 요청했고, 최근 연합군최고사령부 소련 총참모부 대표로 지명된 키슬렌코 장군이 교섭에 초청될 것임을 알리도록 했다."], "primary": "카세르타, 1945년 4월 27일 오후 3시.\n [접수 4월 27일 오전 10시 2분]\n\n1754. 3월 26일 오후 3시자 본직의 1166호[주38]를 참조하라. 마셜 장군이 모스크바 주재 딘의 사절단 앞 Naf 933호[주39](합동참모본부에도 반복 발송)와 합동참모본부가 알렉산더 원수에게 보낸 Fan 532호[주40]에서 다룬 사안에 관하여 귀하에게 계속 알려 드릴 것으로 본인은 생각한다.\n\n대표들은 오늘 저녁 카세르타에 도착할 것으로 예상되며, 소련 군 관계자들의 참석이 주선되고 있다.\n\n귀하가 달리 지시하지 않는 한 본인은 이 극도로 비밀스러운 사안을 국무부에 수시로 보고하는 일을 삼가겠으며, 귀하가 향후의 진전에 관하여 육군부와 긴밀히 연락하시리라 생각한다.\n\n커크(Kirk)\n\n[770면]", "secondary": "Caserta, April 27, 1945—3 p.m. \n [Received April 27—10:02 a.m.]\n\n1754. Re our 1166, March 26, 3 p.m. [주38] I assume General Marshall will keep you informed on matter covered in Naf 933 to Deane’s mission at Moscow [주39] repeated to Combined Chiefs of Staff and Fan 532 from Combined Chiefs of Staff to Field Marshal Alexander. [주40]\n\nRepresentatives are expected at Caserta this evening and presence of Soviet military officials is being arranged.\n\nI shall refrain from keeping Department currently posted on this highly secret matter unless you direct otherwise and presume you will keep in close touch with War Department for further developments.\n\nKirk\n\n[770면]", "notes": ["[주38] 인쇄하지 않음. 734면 각주 65에 서술된 정보를 전달한 육군 전문들에 국무부의 주의를 환기한 것이다.", "[주39] 알렉산더 원수가 4월 27일 모스크바 주재 미·영 군사사절단장들과 합동참모본부에 보낸 이 전보는, 후자가 Fan 532호로 내린 훈령에 따라 발송되었다. 아래 각주 40을 보라. 알렉산더 원수는 볼프 장군과 폰 슈바이니츠 중령이 이탈리아 주둔 적군의 현지 항복(local surrender)에 서명하기 위하여 연합군최고사령부로 오도록 조치가 취해지고 있다고 진술하였다. 합동참모본부의 지시대로 스위스에서는 어떠한 흥정이나 교섭도 있어서는 아니 되며, 독일 측이 즉시 카세르타로 오지 아니하면 접촉은 즉각 끊어질 것이었다. 알렉산더 원수는 군사사절단들이 이 사태 진전을 소련 총참모부에 알리되, 합동참모본부가 붙인 조건과 이 접근이 독일 측의 발의로 이루어졌다는 사실을 아울러 강조해 줄 것을 요청하였다. 그는 또한 최근 연합군최고사령부 주재 소련 총참모부 대표로 지명된 키슬렌코 장군이 카세르타에서 성사될 수 있는 교섭에 초청되리라는 점을 소련 당국에 알려 줄 것을 요청하였다. (육군부 문서철에서 얻은 사본.)", "[주40] 합동참모본부가 4월 26일에 보낸 이 전보는 알렉산더 원수가 일정한 조건 아래 볼프 장군과 폰 슈바이니츠 중령을 카세르타로 데려오도록 허가한 것이다. 합동참모본부는 또한 그에게, 알렉산더 원수가 뒤에 Naf 933호에서 사용한 문구대로 소련 총참모부에 알리도록 지시하였다. (육군부 문서철에서 얻은 사본.)"], "warn": false, "pages": ["770"], "search": "Kirk 커크(지중해전역 연합국최고사령관 막료 정치고문) Marshall 마셜(미 육군참모총장) Deane 딘(모스크바 주재 미 군사사절단장) Alexander 알렉산더(원수) Wolff 볼프(독일 장군) von Schweinitz 폰 슈바이니츠(독일 중령) Kislenko 키슬렌코(소련 장군)"}, {"id": "d554", "order": 554, "date": "1945-04-27", "group": "A", "eyebrow": "d554 · The Acting Secretary of State to the Secretary of State", "title": "국무장관 대리가 국무장관에게", "badge": null, "list_right": "문서 554", "meta": [{"k": "일자", "v": "1945-04-27"}, {"k": "시각", "v": "Washington, April 27, 1945—10:15 a.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "2"}, {"k": "원문출처", "v": "740.0011 EW/4–2745: Telegram", "txt": true}, {"k": "발신", "v": "The Acting Secretary of State (Grew) 국무장관 대리 그루", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 554 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d554"}], "summary": "영미군과 소련군이 토르가우에서 합류했음을 대통령·총리·스탈린이 오늘 정오에 공동 발표한다고 알렸다.", "points": ["발표 시각은 4월 27일 정오이다.", "대통령, 총리, 스탈린 세 사람이 동시에 공개 발표한다.", "발표 내용은 독일 내 영미군과 소련군이 토르가우에서 합류했다는 것이다."], "primary": "워싱턴, 1945년 4월 27일 오전 10시 15분.\n\n2. 오늘 정오에 대통령, 총리 및 스탈린이 독일 내 영미군과 소련군이 토르가우에서 합류하였다는 공개 발표를 할 것이다.\n\n그루(Grew)", "secondary": "Washington, April 27, 1945—10:15 a.m.\n\n2. Public announcement will be made at noon today by the President, the Prime Minister, and Stalin that the Anglo-American and Soviet forces in Germany have joined at Torgau.\n\nGrew", "notes": [], "warn": false, "pages": [], "search": "Grew 그루(국무장관 대리) Truman 트루먼(대통령) Churchill 처칠(영국 총리) Stalin 스탈린"}, {"id": "d555", "order": 555, "date": "1945-04-27", "group": "A", "eyebrow": "d555 · The Minister in Sweden (Johnson) to the Secretary of State", "title": "주스웨덴공사(존슨)가 국무장관에게", "badge": null, "list_right": "문서 555", "meta": [{"k": "일자", "v": "1945-04-27"}, {"k": "시각", "v": "Stockholm, April 27, 1945—6 p.m. [Received April 27—4:09 p.m.]"}, {"k": "장소", "v": "Stockholm", "txt": true}, {"k": "전문번호", "v": "1575"}, {"k": "원문출처", "v": "740.00119 EW/4–2745: Telegram", "txt": true}, {"k": "발신", "v": "The Minister in Sweden (Johnson) 주스웨덴공사 존슨", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 555 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d555"}], "summary": "무조건 항복 요구를 담은 대통령의 회답을 전날 밤 11시 30분 스웨덴 외무부에 전달했고, 베르나도테 백작이 오늘 아침 힘러의 대리인이 있다는 플렌스부르크로 떠났다고 보고했다.", "points": ["대통령 앞 전보이며, 여백의 기입에 「오후 5시 45분 국무장관 대리에게 보임」이라 적혀 있다.", "4월 26일 오후 1시자 국무부 754호로 전달된 훈령을 전날 밤 11시 30분에 스웨덴 외무부 사무총장 보헤만과 폴케 베르나도테 백작에게 전달했다.", "귄테르 외무장관과 즉시 전화로 연락했고 보헤만이 그에게 메시지를 가져갔다.", "해군 경로를 통한 같은 훈령은 보헤만과 연락한 뒤에 접수되었다.", "베르나도테는 오늘 아침 힘러의 대리인이 있다는 플렌스부르크로 떠났으며, 회답은 스웨덴 정부의 아무런 논평 없이 전달될 것이다.", "베르나도테는 개인적 조언으로, 이 회답이 최종적인 것으로 여겨져야 하며 즉시 이에 따라 행동해야 한다고 말할 것이라고 보헤만이 전했다."], "primary": "스톡홀름, 1945년 4월 27일 오후 6시.\n [접수 4월 27일 오후 4시 9분]\n\n1575. 대통령 앞.[주41] 국무부 4월 26일 오후 1시자 754호[주42]로 전달된 귀하의 훈령은 어젯밤 11시 30분에 스웨덴 외무부 사무총장 보헤만 씨와 폴케 베르나도테 백작에게 전달되었다. 우리는 귄테르 외무장관과 즉시 전화로 연락하였고 보헤만이 그에게 메시지를 가져갔다. 해군 경로를 통한 같은 훈령은 본인이 보헤만과 연락한 뒤에 접수되었다. 본인은 오늘, 베르나도테가 힘러의 대리인이 있는 것으로 알려진 플렌스부르크로 오늘 아침 떠났다는 통보를 받았다. 회답은 스웨덴 정부의 아무런 논평 없이 그에게 전달될 것이다. 보헤만이 본인에게 말하기를, 베르나도테는 이 회답이 최종적인 것으로 여겨져야 하며 즉시 이에 따라 행동하여야 한다는 개인적 조언을 덧붙일 것이라고 하였다.\n\n존슨(Johnson)", "secondary": "Stockholm, April 27, 1945—6 p.m. \n [Received April 27—4:09 p.m.]\n\n1575. For the President. [주41] Your instructions conveyed in Department of State’s 754, April 26, 1 p.m., [주42] were communicated at 11:30 last night to Mr. Boheman, Secretary General Swedish Foreign Office and Count Folke Bernadotte. We were in immediate telephone contact with Foreign Minister Günther and Boheman took the message to him. The same instructions through Navy channels were received after I had communicated with Boheman. I have been informed today that Bernadotte left this AM for Flensburg where Himmler’s agent is supposed to be. The reply will be delivered to him without any comment from the Swedish Government. Boheman told me Bernadotte will give personal advice that reply must be regarded as final and should be acted on at once.\n\nJohnson", "notes": ["[주41] 여백의 기입에 「오후 5시 45분 국무장관 대리에게 보임」이라고 적혀 있다.", "[주42] 인쇄하지 않음. 다만 국무장관 대리가 샌프란시스코의 국무장관에게 보낸 4월 26일 오후 2시 26분자 전보 7호를 보라. 768면."], "warn": false, "pages": [], "search": "Johnson 존슨(주스웨덴공사) Boheman 보헤만(스웨덴 외무부 사무총장) Folke Bernadotte 폴케 베르나도테(백작) Günther 귄테르(스웨덴 외무장관) Himmler 힘러"}, {"id": "d556", "order": 556, "date": "1945-04-27", "group": "D", "eyebrow": "d556 · Mr. Jacob Beam  Foreign Service Officer on the staff of the U.S. Political Adviser for Germany. to Mr. Robert D. Murphy, United States Political Adviser for Germany", "title": "대독일 미국 정치고문 막료 외무직원 제이컵 빔이 대독일 미국 정치고문 로버트 D. 머피에게", "badge": null, "list_right": "문서 556", "meta": [{"k": "일자", "v": "1945-04-27"}, {"k": "시각", "v": null}, {"k": "장소", "v": "[Reims ?]", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "Flies of the U.S. High Commissioner for Germany, Frankfurt, 1944–1949: 820—Military Affairs, General", "txt": true}, {"k": "발신", "v": "Mr. Jacob Beam, Foreign Service Officer on the staff of the U.S. Political Adviser for Germany 대독일 미국 정치고문 막료 외무직원 제이컵 빔", "txt": true}, {"k": "수신", "v": "Mr. Robert D. Murphy, United States Political Adviser for Germany 대독일 미국 정치고문 로버트 D. 머피", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "서한"}], "links": [{"k": "FRUS", "text": "문서 556 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d556"}], "summary": "네덜란드 문제다. SHAEF가 자이스잉크바르트와 네덜란드 지하조직 경로로 접촉하여 독일 점령 아래 남은 네덜란드에서 「현상 정지(standstill)」를 교섭하고 있다는 극비 경위를 알렸다.", "points": ["SHAEF가 네덜란드 지하조직 경로로 자이스잉크바르트와 접촉하여, 아직 독일 점령 아래 있는 네덜란드에서의 「현상 정지(standstill)」 제안을 내놓았다.", "연합국 측은 그레베선(線)을 넘지 않고, 네덜란드 항구의 독일군에 대한 폭격과 해군 작전을 중지하며, 네덜란드 지하조직의 행동을 중단시키기로 한다.", "독일 측은 병력에게 「현상 정지」 상태로 머물도록 명령하고 네덜란드인에 대한 보복을 삼가며, 독일 전역에서 저항이 그치면 독일군이 항복(surrender)하는 것으로 양해한다.", "아직 정해지지 않은 쟁점은 식량 보급 문제다. 베른하르트 공의 강력한 요청으로 SHAEF는 공중 투하를 원하나 독일 측은 보증 아래 철도·도로 수송을 제안한다.", "자이스잉크바르트는 내일(토요일) 아메르스포르트에서 SHAEF 대표들과 만날 대표를 보내겠다는 전언을 보내왔고, 애초에는 스미스 장군과 스트롱 장군이 SHAEF를 대표할 예정이었다.", "자이스잉크바르트나 네덜란드 주둔 독일인들의 장래에 관하여는 아무런 약속도 하지 않는 것으로 보인다.", "소련 측은 모스크바의 딘을 통해 수시로 통보받고 있으며, 빔은 국무부에 이 문제를 올리기 전에 합동참모본부(CCS) 앞 전보 발송을 기다리는 편이 낫겠다고 했다."], "primary": "[랭스?] 1945년 4월 27일\n\n밥에게. 네덜란드 문제[주44]의 전모를 알아냈는데 그 성격이 매우 비밀스러운 것이다.\n\n[771면]\n\nSHAEF(연합국원정군최고사령부)는 네덜란드 지하조직 경로를 통하여 자이스잉크바르트[주44a]와 접촉해 왔으며, 아직 독일 점령 아래 있는 네덜란드에서의 「현상 정지(standstill)」에 관한 제안들이 제출되었다. 우리 측에서는 그레베선(線) 너머로 나아가지 아니하고, 네덜란드 항구의 독일군에 대한 폭격과 해군 작전을 중지하며, 네덜란드 지하조직의 행동을 중단시키기로 동의한다. 독일 측에서는 자기 병력에게 「현상 정지」 상태로 머물도록 명령하고 네덜란드인에 대한 보복을 삼가기로 한다. 독일 전역에서 저항이 그치면 독일군은 항복(surrender)하는 것으로 양해된다. 아직 결정되지 않은 점은 식량 보급 문제이다. 베른하르트 공의 강력한 요청에 따라 SHAEF는 항공기로 보급품을 투하하기 시작하고 그 투하 지점을 무선으로 평문(平文)으로 알리고자 한다. 반면 독일 측은 보증 아래 철도 및 도로 수송으로 보급품을 보낼 것을 제안한다.\n\n지금까지의 요체는 위와 같다. 자이스잉크바르트는 「현상 정지」를 논의하기 위하여 내일(토요일) 아메르스포르트에서 SHAEF 대표들과 만날 대표들을 보낼 용의가 있다는 전언을 보내왔다. 당초에는 스미스 장군[주45]과 스트롱 장군이 SHAEF를 대표하기로 계획되어 있었으나 이 점에 관한 최신 상황은 본인도 모른다.\n\n자이스잉크바르트에게 그의 장래나 네덜란드에 있는 독일인들의 장래에 관하여 아무런 약속도 하지 않을 것으로 보인다. 소련 측은 모스크바의 딘을 통하여 수시로 통보받아 왔다. 최신 세부 사항을 CCS(연합참모본부)에 알리는 전보가 기초되었다. 우리의 동의는 요청되지 않았으며, 본인 생각으로는 이 문제를 국무부에 올리기 전에 CCS 앞 전보가 발송되기를 기다리는 편이 나을 듯하다. CCS는 수시로 통보받아 왔으나, 아직 완전히 결정되지 않은 가장 최근의 진전만은 예외이다. 전보가 발송되면 G–3[주46]가 본인에게 그 전보 참조번호를 알려 줄 것이므로 우리는 이를 국무부에 전달할 수 있을 것이다.[주47]\n\n충심으로,\n\n제이크 빔(Jake Beam)\n\n[772면]", "secondary": "[Reims ?] 27 April [1945]\n\nDear Bob: I have got the whole story on the Dutch affair [주44] and it is of a very secret nature.\n\n[771면]\n\nSHAEF has been in touch with Seyss-Inquart [주44a] through Dutch underground channels and proposals have been put forward for a “standstill” in the Netherlands still under German occupation. On our side we would agree not to go beyond the Grebbe Line, to cease bombing and naval action against the Germans in Dutch ports, and to call off action by the Dutch underground. On their side the Germans would order their troops to remain in a “standstill” status, and would refrain from reprisals against the Dutch. It would be understood that the German troops would surrender when resistance ceased throughout Germany. A point not yet decided is the matter of food supplies. Upon the insistence of Prince Bernhard, SHAEF would like to begin dropping supplies by air, announcing in clear on the wireless the fields to which they would be sent. The Germans on the other hand suggest the despatch of the supplies by rail and road transport, under guarantees.\n\nThe above is the essence of the matter so far. Seyss-Inquart has sent a message that he would be willing to send representatives tomorrow (Sat) to meet SHAEF representatives at Amersfoort to discuss the “standstill”. It had originally been planned that Gen. Smith [주45] and Gen. Strong would represent SHAEF but I don’t know what is the latest on this.\n\nApparently no commitments would be made to Seyss-Inquart about his future or that of the Germans in Holland. The Russians have been currently informed through Deane in Moscow. A cable has been drafted setting forth the latest details to the CCS. Our concurrences were not asked for and I think maybe we had better await the sending of the cable to CCS before taking the matter up with the Department. The CCS have been kept currently informed, except for the very latest developments which are still not entirely settled. G–3 [주46] will give me the cable reference number when sent, so that we can relay it to the Department. [주47]\n\nFaithfully,\n\nJake Beam\n\n[772면]", "notes": ["[주43] 대독일 미국 정치고문 막료 외무직원.", "[주44] 독일 점령 아래 있던 서부 네덜란드 민간 주민을 위한 식량 구호 계획의 준비에 관한 논의를 가리킨다. 이 주제에 관한 문서는 제5권 1면 이하를 보라.", "[주44a] 아르투어 자이스잉크바르트(Arthur Seyss-Inquart), 점령 네덜란드 제국판무관.", "[주45] 월터 베델 스미스(Walter Bedell Smith) 육군 중장, SHAEF 참모장.", "[주46] SHAEF 작전부(Operations Division).", "[주47] 파리발 4월 28일 자정자 전보 2199호를 보라. 제5권 23면. 5월 1일 자이스잉크바르트와 연합국 장교들 사이의 회담 결과, 그리고 자이스잉크바르트가 서부 네덜란드를 연합국에 항복시키기를 거부한 일에 관하여는 파리발 5월 2일 오후 4시자 전보 2279호를 보라. 같은 책 23면. 또한 Walter Bedell Smith, Eisenhower’s Six Great Decisions (New York: Longman’s 1956), 197–200면의 회담 서술도 보라."], "warn": false, "pages": ["771", "772"], "search": "Jacob Beam 제이컵(제이크) 빔 Robert D. Murphy 머피(대독일 미국 정치고문) Seyss-Inquart 자이스잉크바르트(점령 네덜란드 제국판무관) Prince Bernhard 베른하르트 공 Walter Bedell Smith 스미스(SHAEF 참모장) Strong 스트롱(장군) Deane 딘(모스크바 주재 미 군사사절단장)"}, {"id": "d912", "order": 912, "date": "1945-04-27", "group": "A", "eyebrow": "d912 · The Chargé in the Soviet Union (Kennan) to the Secretary of State", "title": "주소련 대리대사(케넌)가 국무장관에게", "badge": null, "list_right": "문서 912", "meta": [{"k": "일자", "v": "1945-04-27"}, {"k": "시각", "v": "Moscow, April 27, 1945—1 p.m. [Received April 27—8:23 a.m.]"}, {"k": "장소", "v": "Moscow", "txt": true}, {"k": "전문번호", "v": "1381A"}, {"k": "원문출처", "v": "740.00119 EW/4–2745: Telegram", "txt": true}, {"k": "발신", "v": "The Chargé in the Soviet Union (Kennan) 주소련 대리대사 케넌", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 912 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d912"}], "summary": "배상 문제가 타결되기도 전에 소련이 독일 자재·설비를 압류해 본국으로 실어 나르고 있다는 추가 증거를, 우크라이나·동폴란드·백러시아를 다녀온 미국 관찰자의 목격담으로 보고했다.", "points": ["대사관 전보 3월 14일 오후 2시[자정]자 755호와 4월 6일 오전 10시[오후]자 1057호를 참조한다.", "우크라이나·동폴란드·백러시아를 돌아보고 막 모스크바로 돌아온 유능한 미국 공식 관찰자의 목격이 추가 증거다.", "각종 중고 독일 기계·설비가 대규모로 동쪽으로 이동하고 있음을 보고했다.", "터릿 선반을 실은 열차 두 편성, 강철 궤조와 봉재 한 편성, 동프로이센에서 온 탈곡기 한 편성, 농용 짐수레 한 편성 등을 목격했다.", "러시아 궤간에서 조정 없이는 쓸 수 없는 프랑스·독일·이탈리아 차량은 평판차에 실려 동쪽으로 옮겨지고 있었다.", "대사관에 들어오는 모든 정보는 러시아 측이 쓸모 있다고 여기는 독일 자재·설비·물자를 거리낌 없이 압류해 소련으로 실어 나르고 있음을 보여 준다."], "primary": "모스크바, 1945년 4월 27일 오후 1시.\n [접수 4월 27일 오전 8시 23분]\n\n1381A. 대사관 전보 3월 14일 오후 2시[자정]자 755호 및 4월 6일 오전 10시[오후]자 1057호 참조. 어떠한 배상 타결에 앞서 독일의 자재나 설비를 압류하여 소련으로 실어 나르는 소련의 정책에 관한 추가 증거는, 우크라이나·동폴란드·백러시아를 두루 여행하고 방금 모스크바로 돌아온 유능한 미국 공식 관찰자의 관찰에서 얻어진다. 그는 온갖 종류의 중고 독일 기계와 설비가 동쪽으로 대규모로 이동하고 있다고 보고한다. 예컨대 그는 터릿 선반을 실은 온전한 열차 두 편성, 강철 궤조와 봉재를 실은 열차 한 편성, 동프로이센에서 온 탈곡기를 실은 열차 한 편성, 농용 짐수레를 실은 열차 한 편성 등을 목격하였다. 조정을 거치지 않고서는 러시아 궤간에서 사용할 수 없는 프랑스·독일·이탈리아 차량은 평판차에 실려 동쪽으로 옮겨지고 있었다. 대사관에 들어오는 모든 정보는 러시아 측이 자기들에게 쓸모가 있으리라 여기는 독일의 자재, 설비 또는 물자라면 무엇이든 거리낌 없이 압류하여 소련으로 수송하고 있음을 보여 준다.\n\n케넌(Kennan)", "secondary": "Moscow, April 27, 1945—1 p.m. \n [Received April 27—8:23 a.m.]\n\n1381A. ReEmbtel 755 March 14, 2 p.m. [midnight] and 1057 April 6, 10 a.m. [p.m.]. Additional evidence of Soviet policy of seizing and removing to Soviet Union German material or equipment in advance of any reparation settlement is given by observations of a competent official American observer who has just returned to Moscow from trip through Ukraine, eastern Poland and White Russia. He reports extensive movement eastward of used German machinery and equipment of all kinds. He observed, for example, two entire trains loaded with turret lathes, one trainload of steel rails and bars, one of threshing machines from East Prussia, one of farm wagons, etc. French, German and Italian rolling stock which could not be used on Russian gauge without adjustment was being moved east on flat cars. All information reaching Embassy indicates that Russians are seizing and transporting to Soviet Union without compunction any German materials, equipment or supplies which they feel could be of use to them.\n\nKennan", "notes": [], "warn": false, "pages": [], "search": "Kennan 케넌(주소련 대리대사)"}, {"id": "d913", "order": 913, "date": "1945-04-27", "group": "A", "eyebrow": "d913 · The Acting Secretary of State to the Ambassador in the United Kingdom (Winant)", "title": "국무장관 대리가 주영대사(위넌트)에게", "badge": null, "list_right": "문서 913", "meta": [{"k": "일자", "v": "1945-04-27"}, {"k": "시각", "v": "Washington, April 27, 1945—7 p.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "3315"}, {"k": "원문출처", "v": "740.00119 EAC/4–1345: Telegram", "txt": true}, {"k": "발신", "v": "The Acting Secretary of State (Grew) 국무장관 대리 그루", "txt": true}, {"k": "수신", "v": "The Ambassador in the United Kingdom (Winant) 주영대사 위넌트", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 913 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d913"}], "summary": "약탈 금(金)에 관한 국무부 견해다. 식별 가능한 금은 원상회복 대상이나, 식별할 수 없는 금으로 대체하는 데까지 확대해서는 안 되며 독일에서 회수된 금은 반증이 없는 한 식별 불가능한 것으로 추정해야 한다.", "points": ["EAC의 원상회복(restitution) 논의에서 약탈 금 문제가 나올 수 있으며, 제3군이 라이히스방크 금을 발견하여 문제가 더 두드러질 수 있다.", "(1) 1944년 2월 22일 금 선언은 서명한 유엔이 점령국들에서 가져간 금에 대한 독일의 권원을 인정하지 않는다고 명시했다.", "(2) 국무부가 작성한 배상 문서들은 독일에서 발견된 약탈 금이 원상회복 대상이 아니라 비례 배분 대상이라고 했다.", "(3) 금 이전이 무효로 간주된다는 공개 선언은 독일에서 발견된 식별 가능한 약탈 금이 여전히 그 원래 소유자·국가의 재산으로 여겨진다는 뜻이므로, 배상 문서의 견해를 수정할 필요가 있다.", "(4) 따라서 EAC 논의에서는 금도 다른 재산과 마찬가지로 식별 가능하면 원상회복 대상이라는 원칙을 견지하되, 원상회복은 식별 가능한 약탈 재산의 반환에 한정하고 식별 불가능한 금으로 약탈 금을 대체하는 데까지 확대해서는 안 된다.", "이 원칙을 적용하면 어떤 나라는 금을 되찾고 다른 나라는 못 찾는 결과가 생길 수 있으므로, 국무부는 독일에서 회수된 금은 설득력 있는 반증이 없는 한 식별 불가능한 것으로 추정해야 한다고 본다."], "primary": "워싱턴, 1945년 4월 27일 오후 7시.\n\n3315. 귀하의 4월 13일자 전보 3781호, Comea 216호 참조. 약탈 금(金) 문제가 원상회복에 관한 EAC 논의에서 제기될 수 있음에 유의한다. 제3군이 라이히스방크의 금을 발견함으로써 금 문제가 더 두드러질 수 있다. 귀하의 지침을 위하여 국무부의 견해는 다음과 같다.\n\n(1)\n\n1944년 2월 22일자 금 선언[주62]은 이에 서명한 유엔이, 점령국들로부터 가져간 금에 대한 독일의 권원(title)을 인정하지 아니하리라는 점을 명시적으로 밝혔다.\n\n(2)\n\n국무부에서 작성되어 귀하도 사본을 가지고 있는 배상 문서들은, 독일에서 발견된 약탈 금이 원상회복의 대상이 되지 아니하고 비례 배분될 것이라고 밝혔다. (부처간배상위원회 최종보고서 ECEFP D–19/44[주63] 제2부 10면, 그리고 「요약: 배상·원상회복 등에 관한 보고서」 ECEFP D–37/44[주64] 11면 (g)항을 보라.)\n\n[1201면] (3)\n\n국무부가 배상 문서들에서 표명한 견해를 수정할 필요가 있어 보인다. 금의 이전이 무효로 간주되리라는 공개 발표는, 독일에서 발견된 식별 가능한 약탈 금이 그것을 빼앗긴 사람들 또는 나라들의 재산으로 여전히 간주된다는 뜻으로 보이기 때문이다. 이처럼 연합국들의 재산이라고 선언된 금을 비례 배분하려 드는 것은 정치적으로 보나 다른 면으로 보나 실행 가능해 보이지 아니한다.\n\n(4)\n\n따라서 EAC와의 논의를 위하여 귀하는, 금도 다른 재산과 마찬가지로 식별 가능하다면 원상회복의 대상이 된다는 원칙을 견지하여야 한다. 다만 특히 이 경우에 원상회복은 식별 가능한 약탈 재산을 반환하는 데 한정되어야 하며, 해당 국가의 재산이었음을 식별할 수 없는 금으로 약탈 금을 대체하는 데까지 확대되어서는 아니 된다는 점을 분명히 해 두는 것이 중요해 보인다. 위와 같이 규정된 원상회복 원칙을 적용하면 어느 한 나라는 자기 금 보유고를 되찾고 다른 나라는 되찾지 못하는 결과가 생길 수 있으므로, 국무부는 독일에서 회수된 금이 설득력 있는 반증이 제시되지 아니하는 한 식별 불가능한 것으로 추정되어야 한다고 본다.\n\n그루(Grew)", "secondary": "Washington, April 27, 1945—7 p.m.\n\n3315. Reurtel 3781, April 13, Comea 216. It is noted that the question of looted gold may come up in the EAC discussions on restitution. The gold question may be accentuated by the discovery of the Reichsbank gold by the Third Army. For your guidance, the Department’s views are as follows:\n\n(1)\n\nThe Gold Declaration of February 22, 1944 [주62] indicated explicitly that United Nations subscribing thereto would not recognize the German title to gold taken from the occupied countries.\n\n(2)\n\nThe reparation documents prepared in the Department, of which you have copies, indicated that looted gold found in Germany would not be subject to restitution but would be prorated. (See final report of Interdivisional Reparation Committee, ECEFP D–19/44, [주63] Part 2, page 10; and Summary: Report on Reparation, Restitution, et cetera, ECEFP D–37/44, [주64] page 11 para (g)).\n\n[1201면] (3)\n\nIt seems necessary to revise the views of the Department as expressed in the reparation documents, since the public announcement that transfers of gold would be regarded as invalid would seem to mean that looted and identifiable gold found in Germany is still regarded as the property of the persons or countries from whom it was taken. It does not seem politically or otherwise feasible to attempt to prorate gold which is thus declared to be the property of Allied countries.\n\n(4)\n\nFor purposes of your discussions with EAC, therefore, you should adhere to the principle that gold, like other property, is subject to restitution if identifiable. However, it seems important to make the point that in this case especially restitution should be limited to the returning of identifiable looted property and should not be extended to cover the replacement of looted gold by gold which cannot be identified as having been the property of the country in question. Since the application of the restitution principle as above defined may result in one country recovering its stock of gold while another does not, Department believes gold recovered in Germany should be presumed to be unidentifiable unless convincing evidence to the contrary can be presented.\n\nGrew", "notes": ["[주62] 본문은 Foreign Relations, 1944, 제2권 213면 또는 9 Federal Register 2096을 보라.", "[주63] 인쇄하지 않음.", "[주64] Foreign Relations, 1944, 제1권 287면, 295면."], "warn": false, "pages": ["1201"], "search": "Grew 그루(국무장관 대리) Winant 위넌트(주영대사)"}, {"id": "d72", "order": 72, "date": "1945-04-28", "group": "A", "eyebrow": "d72 · The Acting Secretary of State to the Ambassador in the United Kingdom (Winant)", "title": "국무장관 대리가 주영대사(위넌트)에게", "badge": null, "list_right": "문서 72", "meta": [{"k": "일자", "v": "1945-04-28"}, {"k": "시각", "v": "Washington, April 28, 1945—8 p.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "3343"}, {"k": "원문출처", "v": "740.00119 Control (Austria)/4–2845: Telegram", "txt": true}, {"k": "발신", "v": "The Acting Secretary of State (Grew) 국무장관 대리 그루", "txt": true}, {"k": "수신", "v": "The Ambassador in the United Kingdom (Winant) 주영대사 위넌트", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 72 원문", "url": "https://history.state.gov/historicaldocuments/frus1945v03/d72"}], "summary": "합동참모본부는 오스트리아를 지대별이 아니라 혼합 점령하자는 프랑스 제안에 반대하나, 포어아를베르크와 티롤을 프랑스 점령지대로 하는 데에는 군사적 이의가 없다고 본다.", "points": ["합동참모본부는 오스트리아의 지대 점령 대신 혼합 점령을 하자는 프랑스 제안을 달갑게 보지 않는다.", "혼합 점령은 특히 언어와 법 관념이 다를 때 행정이 어렵다.", "같은 지역에 여러 국적의 점령군이 있으면 비우호적이거나 비협조적인 주민이 한 국적을 다른 국적에 맞붙이기 좋은 위치에 서게 되고 이를 재빨리 이용할 것이다.", "이 제안은 영국과 소련의 제출·수락도 필요하며 미국 혼자 동의할 수 없다.", "또한 기존 의정서들 아래 지금까지 발전해 온 점령 이론 전체를 다시 열어 고쳐야 할 것이다.", "반면 포어아를베르크와 티롤을 프랑스 점령지대로 하는 데에는 군사적 이의가 없다.", "프랑스의 독일 또는 오스트리아 점령은 미·영·소가 이미 서명한 일반 조건 전부를 따라야 한다.", "런던에 국무부 3343호로 발송, 카세르타의 에어하트에게 399호로 반복 발송."], "primary": "워싱턴, 1945년 4월 28일 오후 8시.\n\n3343. 합동참모본부는 오스트리아를 지대별로 점령하는 대신 혼합 점령하자는 프랑스 측 제안을 달갑게 여기지 아니한다. 혼합 점령은 특히 언어와 법 관념의 차이가 개재될 때 행정하기가 어렵다. 서로 다른 국적의 점령군이 같은 지역에 있으면 비우호적이거나 비협조적인 주민은 한 국적을 다른 국적에 맞붙이기에 더할 나위 없이 좋은 위치에 서게 되며, 재빨리 그 상황을 이용할 것이다. 이 제안은 영국과 소련에도 제출되어 수락되어야 할 것이며, 미국 혼자서 동의할 수 있는 것이 아니다. 더욱이 그것은 기존 의정서들 아래 지금까지 발전되어 온 점령 이론 전체를 다시 열어 개정할 것을 요구하게 될 것이다. 다른 한편, 오스트리아의 포어아를베르크와 티롤을 프랑스 점령지대로 하는 데에는 아무런 군사적 이의도 인정되지 아니한다. 프랑스에 의한 독일 또는 오스트리아의 어떠한 점령도 미국·영국·소련이 이미 서명한 일반 조건 전부에 따라야 한다.\n\n런던에 국무부 3343호로 발송, 카세르타의 에어하트에게 국무부 399호로 반복 발송.\n\n그루(Grew)", "secondary": "Washington, April 28, 1945—8 p.m.\n\n3343. The Joint Chiefs of Staff do not look with favor upon the French suggestion for a mixed rather than a zonal occupation of Austria. Mixed occupation is difficult of administration especially where differences of languages and legal concepts are involved. With occupation forces of different nationalities in the same area, an unfriendly or uncooperative population is in an ideal position to play one nationality off against the other and will be quick to take advantage of the situation. This suggestion would require submission to and acceptance by both the British and U.S.S.R. as well and could not be agreed to by the United States alone. Furthermore, it would require reopening and revising the entire theory of occupation as developed to date under the existing protocols. On the other hand no military objection is perceived to a French zone of occupation of Vorarlberg and Tirol in Austria. Any occupation of Germany or Austria by the French should be subject to all of the general conditions to which the United States, United Kingdom and the U.S.S.R. have already subscribed.\n\nSent to Lo
