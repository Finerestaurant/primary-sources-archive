」", "[도장·결재] 0139면 하단 손글씨: 사본 배분표(제6군 61 / 제8군 62 / 극동공군 63 / 서태평양미육군 64 / 제24군단 65 / 부관부 기록과 66)와 '첨부물 사본 및 부본은 정부부로'", "[도장·결재] 0139면 좌하단 연필 정리기호: '1-B'로 읽히나 0141면의 '1-R'과 같은 필체 — '1-R'로 본다", "[도장·결재] 0140면 고무인(세로, 우상단): 「GHQ / AGO RECORDS / 5 JAN 1946」, 옆에 손글씨 '014.1 Korea 6-D', 'T.S'", "[도장·결재] 0140면 취소선 메모: 1946년 1월 6일 정부부 참고 송부 기록(전문은 본문 참조) — 전체에 가로줄이 그어져 폐기 표시", "[도장·결재] 0140면 좌하단 연필 정리기호: '1-R'(역시 'B'처럼 보임)", "[도장·결재] 0141면 고무인(세로, 우상단): 「GHQ / AGO RECORDS / 5 JAN 1946」, 옆에 손글씨 '014.1 / 5-D Korea', 'T.S.'", "[도장·결재] 0141면 발송 고무인: 「MAILED 1720 JAN 5 '46 / ADV. ECH. AG. - GHQ.」", "[도장·결재] 0141면 우측 세로 고무인: 'AG RECORDS COPY'", "[도장·결재] 0141면 좌하단 연필 정리기호: '1-R'", "편철 메모 — 0139면부터 첨부물 성격 — SCAP 이 각 예하부대로 Corrigendum 을 전달한 14 Dec 45 서한과 그에 대한 1st Ind(2 Jan 46, Pacific Air Command)·2nd Ind(5 Jan 46, GHQ SCAP). 0139 하단 손글씨는 'R'이 'B'처럼 보이나 0141 의 '/-R' 과 동일 필체."], "note": "번역자 주 — 0138면 문서철 표기는 원본에 'OPD 914.1 TS (3 Dec 45)'로 타자되어 있다. 본문 안의 다른 참조는 모두 '014.1'이므로 '9'는 원저자의 타자 오류로 보이나, 숫자열은 고치지 않고 읽은 그대로 두었다.\n\n0139면 발신 서한 자체는 12월 14일자이나, 본 색인 항목(1-R)의 기준 날짜는 색인이 채택한 육군부 각서 날짜 1945년 12월 3일이다. 즉 0139~0141면은 이 기호로 함께 묶인 후속 편철물이다.\n\n0140면 기본 문서 인용 행에는 취소선으로 지운 대목이 있다(날짜로 보이는 문구). 지운 글자는 [판독불가].\n\n0140면 하단의 취소선 메모는 전체에 줄이 그어졌으나 아래 글씨가 판독된다. 마지막 낱말('Envelope' 다음)은 [판독불가].\n\n첨부물인 SWNCC 176/8 정오표 본체는 이 문서철에 편철되어 있지 않다 — 남은 것은 송부장과 배서뿐이다.\n\n'1st Ind.' / '2nd Ind.'는 미 육군 문서의 배서(indorsement) 제도로, 원 서한 뒤에 회신을 차례로 덧붙여 되돌리는 방식이다. 번역에서는 '제1차 배서'·'제2차 배서'로 옮겼다.\n\n0140면 발신 기관명이 기본 서한의 수신처(극동공군, FEAF)와 다른 '태평양항공사령부(Pacific Air Command)'인 것은, 1945년 12월 6일 FEAF가 PACUSA로 개편된 사정과 관계된 것으로 보이나 문서 안에는 그 설명이 없다.", "warn": false, "pages": ["0138", "0139", "0140", "0141"], "search": "헐(J. E. Hull, John Edwin Hull) — 중장, 육군부 작전국 참모차장 소여(Hugh Sawyer) — 중령, 전략·정책단 부실무장교 페어(Harold Fair) — 중령, 총사령부 부관 대리 맥글러핸(G. W. McGlughan) — 소령, 태평양항공사령부 부관 대리 포스턴(Robert E. Poston, Jr.) — 항공대 소위, 극동공군 부관 대리(1945년 11월 3일 수령 서명자) 맥아더(Douglas MacArthur) — SCAP 1-R Memo-Basic initial Directive for Civil Affaris in Korea. (SWNCC 176/8)."}, {"id": "1-Q", "order": 117, "date": "1945-11-24", "group": "B", "eyebrow": "편철 1-Q · 0142–0142면", "title": "조선의 수출입 절차 및 회계에 관한 계획", "badge": "Top Secret", "list_right": "1-Q", "meta": [{"k": "일자", "v": "1945-11-24"}, {"k": "발신", "v": "연합국최고사령관(SCAP)", "txt": true}, {"k": "수신", "v": "제24군단장(COMGEN 24TH CORPS)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "CA 55226"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0142–0142 (1면)"}, {"k": "건명", "v": "Plan for procedure and accounting for Korean exports and imports", "txt": true}, {"k": "색인 요지", "v": "CA 55226-Desire plan for procedure & accounting for Korean exports & emports be submitted.", "txt": true, "wide": true}], "summary": "연합국최고사령관은 SWNCC 176/8의 해당 조항들을 근거로 제24군단장에게 조선의 수출입 절차와 회계에 관한 계획을 조속히 제출하라고 지시하며, 대일본 수출입은 다른 나라와의 수출입과 분리해 회계 처리하라고 명한다.", "points": ["근거는 1945년 10월 13일자 SWNCC 176/8 : 제2부 제11항 A(4) 및 B, 제23항, 제25항 C·D·E, 제41항.", "조선의 수출과 수입에 관한 절차 및 회계 계획을 본 사령부에 조속히 제출할 것을 요망한다.", "일본으로의 수출과 일본으로부터의 수입은 다른 나라와의 수출입과 분리하여 회계 처리해야 한다.", "기안은 경제과학국(ESS), 승인은 경제과학과장 크레이머 대령, 증명은 부관감 피치 준장.", "사본은 G-4(통제·정책)와 ESS(1부 반환)에 배포."], "primary": "1945년 10월 13일자 SWNCC-176/8 참조 : 제2부 제11항 A(4) 및 B; 제23항; 제25항 C, D, E; 제41항.\n\n조선의 수출과 수입에 관한 절차 및 회계 계획을 본 사령부에 조속히 제출할 것을 요망함. 일본으로의 수출 및 일본으로부터의 수입은 다른 나라들로의 수출 및 다른 나라들로부터의 수입과 분리하여 회계 처리하여야 함.\n\n(CA 55226)\n\n증명 : B. M. 피치(B. M. Fitch), 준장, 미육군, 부관감\n승인 : R. C. 크레이머(R. C. Kramer), 대령, 참모부, 경제과학과장", "secondary": "REFER SUGAR WILLIAM NAN CHARLIE CHARLIE ONE SEVEN SIX DASH EIGHT CMA ONE THREE OCTOBER ONE NINE FOUR FIVE CLN PART TWO PAR ELEVEN ABLE FOUR AND BAKER SMCLN PAR TWO THREE SMCLN PAR TWO FIVE CHARLIE CMA DOG CMA EASY SMCLN PAR FOUR ONE PD IT IS DESIRED THAT A PLAN FOR PROCEDURE AND ACCOUNTING FOR KOREAN EXPORTS AND IMPORTS BE SUBMITTED THIS HEADQUARTERS EARLIEST PD EXPORTS TO AND IMPORTS FROM JAPAN SHOULD BE ACCOUNTED FOR SEPARATELY FROM EXPORTS TO AND IMPORTS FROM OTHER COUNTRIES PD  CA 55226\n\nESS/IE-RCK/MAE/pl\nDATE: 24 NOVEMBER 1945 OFFICIAL:                          Approved by:\nB. M. FTICH                        R. C. KRAMER\nBrigadier General, U.S. Army       Colonel, GSC Adjutant General                   Chief, Econ & Sc Sec Copies to:\nG-4 (Control & Policy)\nESS (return 1 copy)", "notes": ["[도장·결재] 우측 상단 고무인 : 'GHQ. AFPAC / AGO RECORDS', 날짜 '26 NOV 1945'; 그 위 손글씨 '014.1 Korea', 'T.S.'", "[도장·결재] 우측 상단 전신 정리번호 : '260103'", "[도장·결재] 본문 옆 손글씨 : 'SWNCC-176/8 - 014.1 Korea'", "[도장·결재] 본문 밑줄(잉크) : 'IT IS DESIRED THAT A PLAN FOR PROCEDURE AND ACCOUNTING FOR KOREAN EXPORTS AND IMPORTS BE SUBMITTED THIS HEADQUARTERS EARLIEST' 구간, 'CA 55226'에 표시", "[도장·결재] 서명란 자필 서명 2개 (B. M. Fitch 이니셜, Kramer 서명)", "[도장·결재] 서명란 아래 손글씨 : 'G-4 concurs' 및 이니셜 'LAP'", "[도장·결재] 상·하단 고무인 : 'TOP SECRET' (4회)", "[도장·결재] 하단 우측 고무인 : 'AG RECORD COPY'", "[도장·결재] 좌측 하단 연필 편철기호 : '1-Q'", "편철 메모 — 전문 발신일은 24 NOVEMBER 1945(접수 스탬프 26 NOV 1945). 색인은 '26 Nov 46'으로 적혀 있어 색인 쪽 연도가 오타(45가 맞음)임이 이 면으로 확인된다."], "note": "번역자 주 — **날짜 주의.** 색인에는 이 문서가 '26 Nov 46'으로 적혀 있으나 이는 원본 색인 쪽의 오타다. 원본 전문지(pages/0142.jpg)에는 발신일이 'DATE: 24 NOVEMBER 1945'로 타자되어 있고, 부관부 접수 도장이 '26 NOV 1945'이며, 전신 정리번호도 '260103'(26일 01시 03분)이다. 따라서 실제 연도는 1945년이며 date 를 1945-11-24 로 잡았다. 원문 표기는 en 과 date_note 에 그대로 살렸다.\n\n전문 머리는 음성문자 철자다 : 'SUGAR WILLIAM NAN CHARLIE CHARLIE'=SWNCC, 'ABLE'=A, 'BAKER'=B, 'CHARLIE'=C, 'DOG'=D, 'EASY'=E, 'SMCLN'=세미콜론, 'CLN'=콜론, 'CMA'=쉼표, 'PD'=마침표.\n\n서명란의 'B. M. FTICH'는 원저자 오타(FITCH)이므로 en 에서는 고치지 않았다. 'COMGEN 24TH CORPS'는 제24군단장(하지)이다.", "warn": false, "pages": ["0142"], "search": "B. M. 피치(B. M. Fitch) — 준장, 부관감 (원문에 'B. M. FTICH'로 오타) R. C. 크레이머(R. C. Kramer) — 대령, 참모부, 경제과학과장 1-Q CA 55226-Desire plan for procedure & accounting for Korean exports & emports be submitted."}, {"id": "1-P", "order": 116, "date": "1945-11-01", "group": "A", "eyebrow": "편철 1-P · 0143–0143면", "title": "조선 민사에 관한 기본 초기 지령(SWNCC 176/8)", "badge": "Top Secret", "list_right": "1-P", "meta": [{"k": "일자", "v": "1945-11-01"}, {"k": "발신", "v": "연합국최고사령관총사령부(GENERAL HEADQUARTERS, SUPREME COMMANDER FOR THE ALLIED POWERS), APO 500", "txt": true}, {"k": "수신", "v": "제6군사령관(APO 442) · 제8군사령관(APO 343) · 극동공군사령관(APO 925) · 서태평양미육군사령관(APO 707)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "AG 014.1 (1 Nov 45)GS"}, {"k": "종류", "v": "서한"}, {"k": "면", "v": "0143–0143 (1면)"}, {"k": "건명", "v": "Basic Initial Directive for Civil Affairs in Korea, (SWNCC 176/8).", "txt": true}, {"k": "색인 요지", "v": "Ltr-Basic initial directive for civil affairs in Korea. (SWNCC 176/8).", "txt": true, "wide": true}], "summary": "맥아더 명의로 「조선 민사에 관한 기본 초기 지령」(SWNCC 176/8, 1945년 10월 13일자) 1부씩을 제6군·제8군·극동공군·서태평양미육군 4개 사령부에 참고용으로 송부한 서한이다.", "points": ["송부물은 1945년 10월 13일자 「조선 민사에 관한 기본 초기 지령」(SWNCC 176/8) 1부(1통)다.", "수신 4개 사령부에는 '참고용'(for your information)으로만 보낸다.", "제24군단장에게는 이미 '참고 및 준거용'(for information and guidance)으로 사본이 송부돼 있다.", "맥아더 대장의 명에 의하여, 부관부 차장 해럴드 페어 중령이 서명.", "발송 도장 'MAILED 1130 NOV 3 '45 ADV. ECH. AG.-GHQ.' — 실제 발송은 11월 3일 11시 30분.", "여백의 손글씨 배포표: 제6군 172, 서태평양미육군 173, 극동공군 174, 제8군 175 (배포 문서번호)."], "primary": "**연합국최고사령관총사령부**\n\nAG 014.1 (1945년 11월 1일)GS  ·  APO 500, 1945년 11월 1일\n\n건명: 조선 민사에 관한 기본 초기 지령(SWNCC 176/8).\n\n수신: 제6군사령관, APO 442.\n제8군사령관, APO 343.\n극동공군사령관, APO 925.\n서태평양미육군사령관, APO 707.\n\n1. 귀 사령부의 참고를 위하여 1945년 10월 13일자 「조선 민사에 관한 기본 초기 지령」(SWNCC 176/8) 1부(1통)를 이에 송부한다.\n\n2. 본 문서의 사본은 참고 및 준거를 위하여 제24군단장에게 송부되었다.\n\n맥아더 대장의 명에 의하여:\n\n해럴드 페어(HAROLD FAIR)\n중령, 부관부(A.G.D.)\n부관부 차장\n\n첨부 1건: 위에 표시한 바와 같음.", "secondary": "TOP SECRET\n\nGENERAL HEADQUARTERS\nSUPREME COMMANDER FOR THE ALLIED POWERS\n\nAG 014.1 (1 Nov 45)GS APO 500, 1 November 1945.\n\nSUBJECT: Basic Initial Directive for Civil Affairs in Korea, (SWNCC 176/8).\n\nTO : Commanding General, Sixth Army, APO 442.\nCommanding General, Eighth Army, APO 343.\nCommanding General, Far East Air Force, APO 925. Commanding General, United States Army Forces, Western Pacific, APO 707.\n\n1. Transmitted herewith for your information is one (1) copy of \"Basic Initial Directive for Civil Affairs in Korea\", (SWNCC 176/8), dated 13 October 1945.\n\n2. Copies of this document have been transmitted to the Commanding General, XXIV Corps, for information and guidance.\n\nBy command of General MacARTHUR:\n\nHAROLD FAIR, Lt. Col., A.G.D., Asst. Adjutant General 1 Incl:\nAs indicated above.\n\nTOP SECRET", "notes": ["[도장·결재] 우측 상단 고무인: 'GHQ AGO RECORDS 6 NOV 1945' — 총사령부 부관부 기록과 접수 도장. 도장 옆 손글씨 '014.1 Korea'(파일 분류번호 가필)", "[도장·결재] 우측 여백 세로 인쇄: 'AG RECORDS COPY'", "[도장·결재] 우측 하단 세로 대형 고무인: 'AG RECORD COPY'", "[도장·결재] 좌측 하단 발송 도장: 'MAILED 1130 NOV 3 '45  ADV. ECH. AG.-GHQ.'", "[도장·결재] 좌측 하단 손글씨 배포표: 'To: CG 6th Army — File no.(Dist) 172 / CG AFWESPAC — 173 / CG FEAF — 174 / CG 8th Army — 175'", "[도장·결재] 본문 하단 원형 고무인 1개 — 잉크가 흐려 [판독불가]", "[도장·결재] 면 하단 좌측 연필: '1-P' (편철기호), 그 위에 원문자 '(5)'로 보이는 표기", "[도장·결재] 상단·하단 'TOP SECRET' 고무인 각 2회(활자체·타자체 중첩)", "[도장·결재] 본문 첫 수신처 'Commanding General, Sixth Army, APO 442.' 옆 손글씨 사선 표시 및 본문 1항 위 손글씨 [판독불가]"], "note": "번역자 주 — SWNCC 176/8 은 규칙에 따라 번역하지 않고 그대로 두었다. 발송 도장의 시각 숫자('1130')와 날짜('NOV 3')가 겹쳐 찍혀 OCR 은 'MAILED 11 30 NOV 3 45'로 흩어져 읽혔다. 원면 확인 결과 발송 도장은 11월 3일, 서한 일자는 11월 1일로 이틀 차이가 있다. 우측 여백에 연필 서명 형태의 표기('AN' 또는 이니셜)가 있으나 판독하지 못했다.", "warn": false, "pages": ["0143"], "search": "맥아더(General MacARTHUR) — 더글러스 맥아더 해럴드 페어(HAROLD FAIR) — 중령, 부관부 차장 1-P Ltr-Basic initial directive for civil affairs in Korea. (SWNCC 176/8)."}, {"id": "1-O", "order": 115, "date": "1945-10-17", "group": "C", "eyebrow": "편철 1-O · 0144–0145면", "title": "조선 민사에 관한 기본 초기 지령", "badge": "Top Secret", "list_right": "1-O", "meta": [{"k": "일자", "v": "1945-10-17"}, {"k": "발신", "v": "육군부 참모본부 작전부(War Department General Staff, Operations Division), 워싱턴 25, D.C.", "txt": true}, {"k": "수신", "v": "태평양미육군총사령관(CINCAFPAC), 도쿄, 일본", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "OPD 014.1 TS (17 Oct 45)"}, {"k": "종류", "v": "각서"}, {"k": "면", "v": "0144–0145 (2면)"}, {"k": "건명", "v": "Basic Initial Directive for Civil Affairs in Korea", "txt": true}, {"k": "색인 요지", "v": "MEMO-Basic initial directive for civil affairs in Korea. (SWNCC 176/8).", "txt": true, "wide": true}], "summary": "육군부 작전부장 헐 중장이 조선 민사에 관한 기본 초기 지령(SWNCC 176/8)의 첨부물을 참고 및 준거용으로 태평양미육군총사령관에게 송부하며, 같은 문서를 주소련 미군사사절단장과 중국전구 미군사령관에게도 보냈음을 통보한 각서(사본).", "points": ["위 건명에 관한 첨부물들을 '귀관의 참고와 준거를 위하여' 송부한다.", "SWNCC 176/8은 주소련 미군사사절단장(Commanding General, U.S. Military Mission, U.S.S.R.)과 중국전구 미군사령관(Commanding General, U.S. Forces, China Theater)에게도 이미 송부되었다.", "발신 명의는 육군부 작전부(OPD) 참모차장 J. E. 헐 중장, 실무 서명은 전략정책반 부집행장교 휴 소여 중령.", "첨부 1건: SWNCC 176/8, 사본 61호~66호.", "첨부물 SWNCC 176/8 본문은 이 문서철에 편철되지 않았다 — '1 Incl' 옆에 자필로 'not recorded'(기록되지 않음)라고 적혀 있고, 별지 기록용 쪽지에는 '본 각서는 반출되어 참모장실로 보내졌음'이라 타자되어 있다.", "면 우측 여백에 GHQ가 1945년 10월 26일 접수하여 'AG RECORD COPY'로 편철하였음이 찍혀 있다."], "primary": "**사본(COPY)**\n\n육군부\n육군부 참모본부\n작전부\n워싱턴 25, D.C.\n\nOPD 014.1 TS (17 Oct 45)  1945년 10월 17일\n\n**태평양미육군총사령관 각하(도쿄, 일본)께 드리는 각서**\n\n**건명: 조선 민사에 관한 기본 초기 지령.**\n\n1. 위 건명에 관한 첨부물들을 귀관의 참고와 준거를 위하여 송부함.\n\n2. SWNCC 176/8은 주소련 미군사사절단장 및 중국전구 미군사령관에게 송부되었음.\n\nJ. E. 헐(J. E. HULL)\n중장, 참모본부\n작전부(OPD) 참모차장\n\n/서명/ 휴 소여(Hugh Sawyer)\n/타자/ 휴 소여(HUGH SAWYER)\n중령, 참모본부\n부집행장교\n전략정책반\n\n첨부 1건\nSWNCC 176/8, 사본 61호~66호\n\n---\n\n**[별지 — 기록용 쪽지]**\n\n**기록용 쪽지(NOTE FOR RECORD)**\n\nSWNCC 176/8\n\n날짜: 1945년 10월 13일\n\n건명: 조선 민사에 관한 기본 초기 지령\n\n본 각서는 반출되어 참모장실로 보내졌음.", "secondary": "COPY\n\nTOP SECRET\n\nWAR DEPARTMENT\nWar Department General Staff Operations Division Washington 25, D.C.\n\nOPD 014.1 TS (17 Oct 45)  17 October 1945 MEMORANDUM FOR THE COMMANDER IN CHIEF, U.S. ARMY FORCES, PACIFIC, TOKYO, JAPAN:\n\nSUBJECT: Basic Initial Directive for Civil Affairs in Korea.\n\n1. The inclosures pertaining to the above subject are forwarded for your information and guidance.\n\n2. SWNCC 176/8 has been forwarded to the Commanding General, U. S. Military Mission, U.S.S.R. and to the Commanding General, U. S. Forces, China Theater.\n\nJ. E. HULL\nLieutenant General, GSC Assistant Chief of Staff, OPD\n\n/s/ Hugh Sawyer\n/t/ HUGH SAWYER Lt Colonel, GSC Asst Executive Officer Strategy & Policy Group 1 Incl SWNCC 176/8, Cys 61----66 incl\n\nTOP SECRET\n\n---\n\n[INCLOSURE SLIP]\n\nNOTE FOR RECORD\n\nSWNCC 176/8\n\nDATE: 13 Oct 45 SUBJ: Basic Initial directive for civil affairs in korea\n\nTHIS MEMO PULLED AND SENT TO O OF C/S", "notes": ["[도장·결재] [0144] 좌상단 타자: COPY (사본)", "[도장·결재] [0144] 상하단 고무인: TOP SECRET", "[도장·결재] [0144] 우측 여백 세로 고무인: GHQ AGO RECORDS 26 OCT 1945 (총사령부 부관부 기록과 1945년 10월 26일 접수)", "[도장·결재] [0144] 위 접수인 옆 자필: 014.1 Korea (편철 분류번호)", "[도장·결재] [0144] 건명 오른쪽 자필 괄호: (SWNCC 176/8)", "[도장·결재] [0144] '1 Incl' 옆 자필: not recorded (기록되지 않음)", "[도장·결재] [0144] 날짜 오른쪽 여백 자필 검인(체크) 표시", "[도장·결재] [0144] 우측 여백 세로 고무인: AG RECORD COPY (부관부 기록 보존용 사본)", "[도장·결재] [0144] 우하단 고무인: COPY", "[도장·결재] [0144] 좌하단 자필 회부 메모: (C-in-C) / C/S } INFO — 총사령관·참모장 참고 회부, 이어 'Gov't Copy'(정부 사본)로 읽히는 어구, '26-Oct-45', 그 아래 이니셜 '[판독불가, F.H.G. 로 읽힘]'", "[도장·결재] [0144] 좌하단 연필: 1-O", "[도장·결재] [0145] 타자 표제: NOTE FOR RECORD (기록용 쪽지)", "[도장·결재] [0145] 타자 회부 표시: THIS MEMO PULLED AND SENT TO O OF C/S — 본 각서는 반출되어 참모장실로 보내졌음", "[도장·결재] [0145] 좌하단 연필: 1-O", "편철 메모 — 0145면은 첨부물(NOTE FOR RECORD 슬립)."], "note": "번역자 주 — 0144면은 육군부가 보낸 각서의 정서 사본(COPY)이고, 0145면은 그 첨부물 자리를 대신하는 기록용 쪽지다. 첨부물 본체인 SWNCC 176/8(사본 61~66호)은 이 문서철에 없다 — 0144면 자필 'not recorded'와 0145면 타자 'THIS MEMO PULLED AND SENT TO O OF C/S'가 그 사정을 말해 준다.\n\n원문 표기를 그대로 둔 것: 'inclosures'(당시 군 문서 관용 철자, 오늘날 enclosures), 0145면 건명의 소문자 'korea'.\n\n0144면 좌하단의 자필 회부 메모는 필기가 흐려 판독이 확실치 않다. 'C-in-C'와 'C/S'를 묶어 'INFO'(참고 회부)로 표시하고 그 아래 사본 처리와 '26-Oct-45' 및 이니셜을 적은 것으로 읽었으나, 중간 어구와 이니셜은 확정하지 못했다.\n\n0144면 우상단 접수인은 겹쳐 찍혀 'GHQ AGO RECORDS'와 '26 OCT 1945'가 세로로 갈라져 보인다. OCR(ocr/0144.txt)이 이를 'GHO 2 6 OCT /1945 ... AGO RECORDS'로 흩어 읽은 것은 판독 오류이며 원본 스캔에서 확인하여 바로잡았다.\n\n색인·문서 배정상 이 건의 날짜는 10월 17일(각서 기안일)이며, 첨부 쪽지의 13 Oct 45는 SWNCC 176/8 자체의 날짜다.", "warn": false, "pages": ["0144", "0145"], "search": "J. E. 헐(J. E. Hull) — 중장, 육군부 작전부(OPD) 참모차장 휴 소여(Hugh Sawyer) — 중령, 전략정책반 부집행장교 1-O MEMO-Basic initial directive for civil affairs in Korea. (SWNCC 176/8)."}, {"id": "1-N", "order": 114, "date": "1945-10-29", "group": "A", "eyebrow": "편철 1-N · 0146–0146면", "title": "조선 민사에 관한 기본 초기 지령(SWNCC 176/8)", "badge": "Top Secret", "list_right": "1-N", "meta": [{"k": "일자", "v": "1945-10-29"}, {"k": "발신", "v": "연합국최고사령관총사령부(GENERAL HEADQUARTERS, SUPREME COMMANDER FOR THE ALLIED POWERS), APO 500", "txt": true}, {"k": "수신", "v": "제24군단장(Commanding General, XXIV Corps), APO 235", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "AG 014.1(29 Oct 45)GS"}, {"k": "종류", "v": "서한"}, {"k": "면", "v": "0146–0146 (1면)"}, {"k": "건명", "v": "Basic Initial Directive for Civil Affairs in Korea (SWNCC 176/8)", "txt": true}, {"k": "색인 요지", "v": "Ltr-Basic initial dir for Civ Aff in Korea (SWNCC 176/8).", "txt": true, "wide": true}], "summary": "맥아더 명의로 「조선 민사에 관한 기본 초기 지령」(SWNCC 176/8, 1945년 10월 13일자) 2부(사본 63번·64번)를 제24군단장에게 참고 및 준거용으로 송부한 서한이다.", "points": ["송부물은 1945년 10월 13일자 「조선 민사에 관한 기본 초기 지령」 2부, 사본번호 63번과 64번이다.", "수신처는 조선을 점령한 제24군단의 사령관이며, 용도는 '참고 및 준거'(information and guidance)다 — 4개 사령부에 '참고용'으로만 보낸 1-P와 대비된다.", "맥아더 대장의 명에 의하여, 부관부 차장 H. W. 앨런 대령이 서명.", "발송 도장 'MAILED 1410 OCT 29 '45 ADV. ECH. AG.-GHQ.' — 서한 일자와 같은 날 14시 10분 발송.", "여백 손글씨 기록용 쪽지: '10월 29일 민정부(Govt Sec)에서 부관부로 R/S(라우팅 슬립), 서명 및 발송 요(sig & disp), /s/ WEC'."], "primary": "**연합국최고사령관총사령부**\n\nAG 014.1(1945년 10월 29일)GS  ·  APO 500, 1945년 10월 29일\n\n건명: 조선 민사에 관한 기본 초기 지령(SWNCC 176/8)\n\n수신: 제24군단장, APO 235.\n\n귀 부대의 참고 및 준거를 위하여 1945년 10월 13일자 「조선 민사에 관한 기본 초기 지령」 2부(사본번호 63번 및 64번)를 이에 송부한다.\n\n맥아더 대장의 명에 의하여:\n\nH. W. 앨런(H. W. ALLEN)\n대령, 부관부(A.G.D.)\n부관부 차장\n\n첨부 1건: 위에 표시한 바와 같음.", "secondary": "TOP SECRET\n\nGENERAL HEADQUARTERS\nSUPREME COMMANDER FOR THE ALLIED POWERS\nAPO 500\n\nWEC/jmh AG 014.1(29 Oct 45)GS 29 October 1945\n\nSUBJECT: Basic Initial Directive for Civil Affairs in Korea (SWNCC 176/8)\n\nTO : Commanding General, XXIV Corps, APO 235.\n\nTransmitted herewith for your information and guidance are two (2) copies (numbers 63 and 64) of \"Basic Initial Directive for Civil Affairs in Korea\", dated 13 October 1945.\n\nBy command of General MacARTHUR:\n\nH. W. ALLEN, Colonel, A.G.D., Asst. Adjutant General 1 Incl:\nAs indicated above.\n\nTOP SECRET", "notes": ["[도장·결재] 우측 상단 고무인: 'GHQ AGO RECORDS 31 OCT 1945'(세로) — 총사령부 부관부 기록과 접수 도장. 옆에 손글씨 '014.1 Korea'", "[도장·결재] 우측 여백 세로 인쇄: 'AG Records Copy'", "[도장·결재] 좌측 하단 발송 도장: 'MAILED 1410 OCT 29 '45  ADV. ECH. AG.-GHQ.'", "[도장·결재] 본문 우측 여백 상단 손글씨: 'Rec'd [판독불가]' 및 'Hd. for WEC'로 읽히는 가필", "[도장·결재] 일자 옆 손글씨 이니셜 서명 [판독불가]", "[도장·결재] 발송 도장 우측 손글씨: 'R/S, 29 Oct 45 — Govt Sect to AG — sig & disp.  WEC'", "[도장·결재] 좌측 하단 손글씨: 'Note for record: R.S. to AG from Govt Sec, 29 Oct for sig & disp.  /s/ WEC.' 아래 이니셜 서명", "[도장·결재] 결재란 H. W. ALLEN 이름 위에 자필 서명", "[도장·결재] 본문 좌하단 원형 고무인(흐림) — [판독불가]", "[도장·결재] 면 하단 좌측 연필: '1-N' (편철기호), 우측 여백 연필 '9A2'로 읽히는 표기", "[도장·결재] 머리 우측 타자: 'WEC/jmh' (기안자/타자수 이니셜)", "[도장·결재] 상단·하단 'TOP SECRET' 고무인 각 2회"], "note": "번역자 주 — SWNCC 176/8 은 번역하지 않고 그대로 두었다. 이 면에는 손글씨 '기록용 쪽지'(Note for record)가 두 군데 겹쳐 적혀 있는데, 같은 내용(10월 29일 민정부→부관부 라우팅 슬립, 서명·발송 요, WEC)을 옮겨 적은 것으로 보인다. 우측 여백의 연필 '9A2'는 사본번호 또는 정리번호로 추정되나 확정하지 못했다.", "warn": false, "pages": ["0146"], "search": "맥아더(General MacARTHUR) — 더글러스 맥아더 H. W. 앨런(H. W. ALLEN) — 대령, 부관부 차장 WEC — 민정부(Government Section) 소속 기안자 이니셜. 성명 미상 1-N Ltr-Basic initial dir for Civ Aff in Korea (SWNCC 176/8)."}, {"id": "1-M", "order": 113, "date": "1945-12-04", "group": "D", "eyebrow": "편철 1-M · 0147–0147면", "title": "조선 민사(民事)를 위한 기본 초기 지령", "badge": "Top Secret", "list_right": "1-M", "meta": [{"k": "일자", "v": "1945-12-04"}, {"k": "발신", "v": "육군참모총장(WARCOS)", "txt": true}, {"k": "수신", "v": "태평양미육군총사령관 전방지휘소(CINCAFPAC ADV)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "JCS 1483/15"}, {"k": "종류", "v": "라우팅 슬립"}, {"k": "면", "v": "0147–0147 (1면)"}, {"k": "건명", "v": "Basic Initial Directive for Civil affairs in Korea", "txt": true}, {"k": "색인 요지", "v": "Memo-Basic initial Directive for Civil Affairs in Korea. JCS 1483/15.", "txt": true, "wide": true}], "summary": "JCS 1483/15(조선 민사를 위한 기본 초기 지령, 1945년 12월 4일자) 본체 각서가 참모장실로 반출되었음을 알리는 기록용 쪽지 한 장만 문서철에 남아 있다.", "points": ["문서철의 이 자리에는 본문 각서가 아니라 'NOTE FOR RECORD'(기록용 쪽지) 한 장만 편철되어 있다.", "쪽지에 적힌 것은 문서번호 JCS 1483/15, 일자 1945년 12월 4일, 건명 '조선 민사를 위한 기본 초기 지령'뿐이다.", "하단에 '이 각서는 반출되어 참모장실로 보내졌음(THIS MEMO PULLED AND SENT TO O OF C/S)'이라고 타자되어 있다.", "즉 원 각서는 이 문서철에서 빠져 참모장실(Office of the Chief of Staff)로 넘어갔고, 그 사실만 기록으로 남았다."], "primary": "기록용 쪽지(NOTE FOR RECORD)\n\nJCS 1483/15\n일자: 1945년 12월 4일\n건명: 조선 민사를 위한 기본 초기 지령(Basic Initial Directive for Civil affairs in Korea)\n\n이 각서는 반출되어 참모장실로 보내졌음.", "secondary": "NOTE FOR RECORD\n\nJCS 1483/15\nDATE: 4 Dec 45 SUBJ: Basic Initial Directive for Civil affairs in Korea\n\nTHIS MEMO PULLED AND SENT TO O OF C/S", "notes": ["[도장·결재] 상단 좌우에 편철용 천공 2개", "[도장·결재] 좌하단 연필 일련번호: 1-M ('/-M' 으로 읽힘)", "[도장·결재] 그 밖의 접수 도장·손글씨 결재 없음", "편철 메모 — 본문 각서는 O of C/S 로 빠지고 NOTE FOR RECORD 슬립만 남았다."], "note": "번역자 주 — 1) 본체 각서가 빠지고 대체 쪽지만 남은 면이다. 'O OF C/S' 는 'Office of the Chief of Staff'(참모장실)로 읽었다. 2) 건명의 'Civil affairs' 는 원본에서 'affairs' 만 소문자로 타자돼 있다. 원문 표기 그대로 두었다. 3) 문서번호 JCS 1483/15 는 번역하지 않고 그대로 두었다. 4) 이 쪽지는 도장이 전혀 찍혀 있지 않다 — 없는 것을 지어내지 않았다.", "warn": false, "pages": ["0147"], "search": "1-M Memo-Basic initial Directive for Civil Affairs in Korea. JCS 1483/15."}, {"id": "1-L", "order": 112, "date": "1945-11-12", "group": "A", "eyebrow": "편철 1-L · 0148–0148면", "title": "조선의 민사 행정", "badge": "Top Secret", "list_right": "1-L", "meta": [{"k": "일자", "v": "1945-11-12"}, {"k": "발신", "v": "연합국최고사령관총사령부(GENERAL HEADQUARTERS, SUPREME COMMANDER FOR THE ALLIED POWERS), APO 500", "txt": true}, {"k": "수신", "v": "제24군단장(Commanding General, XXIV Corps), APO 235", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "AG 014.1 (12 Nov 45) G-S"}, {"k": "종류", "v": "서한"}, {"k": "면", "v": "0148–0148 (1면)"}, {"k": "건명", "v": "Civil Affairs Administration in Korea", "txt": true}, {"k": "색인 요지", "v": "Ltr-Civil affairs Adm in Korea.", "txt": true, "wide": true}], "summary": "연합국최고사령관총사령부가 SWNCC 79/1 사본 제80호와 SWNCC 101/4 사본 제62호를 전달하는 1945년 10월 27일자 육군부 각서의 사본을 제24군단장에게 참고 및 지침용으로 회부하는 한 장짜리 서한.", "points": ["1945년 10월 27일자 육군부 각서 사본을 동봉한다.", "그 각서는 SWNCC 79/1의 사본 제80호와 SWNCC 101/4의 사본 제62호를 전달하는 것이다.", "제24군단장에게 참고 및 지침(information and guidance)용으로 회부한다.", "맥아더 장군의 명에 의함. 부관보 해럴드 페어(Harold Fair) 중령 서명.", "동봉물 1건: CINCAFPAC 앞 육군부 각서 사본, SWNCC 79/1 1부 및 SWNCC 101/4 1부 동봉.", "기록용 각서(Memorandum for Record): 민정부(Govt Sect)에서 부관부(AG)로 서명·발송을 위한 회부용지(R/S)가 왔고, 회부용지에 '작전 담당 참모차장실의 승인을 받았음'이라는 기재와 W.E.C. 의 이니셜이 있었다."], "primary": "연합국최고사령관총사령부\nAPO 500\n1945년 11월 12일\nAG 014.1 (12 Nov 45) G-S\n\n건명: 조선의 민사 행정.\n\n수신: 제24군단장, 군사우편번호 235.\n\n동봉한 것은 1945년 10월 27일자 육군부 각서의 사본으로, 이는 SWNCC 79/1의 사본 제80호와 SWNCC 101/4의 사본 제62호를 전달하는 것이며, 귀관의 참고와 지침을 위하여 회부한다.\n\n맥아더(MacArthur) 장군의 명에 의하여:\n\n해럴드 페어(HAROLD FAIR),\n중령, 부관부(A.G.D.),\n부관보\n\n동봉물 1건:\nCINCAFPAC 앞 육군부(WD) 각서 사본, SWNCC 79/1 1부 및 SWNCC 101/4 1부 동봉.\n\n기록용 각서(Memorandum for Record):\n민정부(Govt Sect)에서 부관부(AG)로 서명 및 발송을 위한 회부용지(R/S)가 왔으며, 회부용지에 다음 기재가 있었다 — '작전 담당 참모차장실(Office of the Deputy Chief of Staff for Operations)의 승인을 받았음.' W.E.C. 의 이니셜이 기재됨.", "secondary": "TOP SECRET\n\nGENERAL HEADQUARTERS\nSUPREME COMMANDER FOR THE ALLIED POWERS\nAPO 500, 12 November 1945 AG 014.1 (12 Nov 45) G-S\n\nSUBJECT: Civil Affairs Administration in Korea.\n\nTO : Commanding General, XXIV Corps, APO 235.\n\nInclosed is copy of War Department Memorandum, dated 27 October 1945, transmitting Copy No. 80 of SWNCC 79/1 and Copy No. 62 of SWNCC 101/4, forwarded for your information and guidance.\n\nBy command of General MacARTHUR:\n\nHAROLD FAIR, Lt. Col., A.G.D., Asst. Adjutant General 1 Incl:\nCopy WD Memo to CINCAFPAC, inclosing one cy SWNCC 79/1 and one cy SWNCC 101/4.\n\nMemorandum for Record:\n\nR/S frm Govt Sect to AG for Signature and Dispatch, with Note on R/S: \"Approval of the Office of the Deputy Chief of Staff for Operations has been obtained.\" initialed by W.E.C.", "notes": ["[도장·결재] 접수 도장(우상단): GHQ AGO RECORDS 12 NOV 1945", "[도장·결재] 도장 위 손글씨: '014.1 Korea' + 서명(판독불가)", "[도장·결재] 문서기호 옆 손글씨: 'G-S'", "[도장·결재] 우측 여백 세로 도장: 'AG RECORDS'", "[도장·결재] 발송 도장(중하단): 'MAILED  30 NOV 21 45  ADV. ECH. AG.-GHQ'(앞의 '12'로 읽히는 숫자가 겹쳐 찍혀 있음)", "[도장·결재] 기록용 각서 아래 손글씨 서명(이니셜, 판독불가) — 'initialed by W.E.C.' 옆", "[도장·결재] 우측 여백 손글씨(판독불가)", "[도장·결재] 좌하단 원문자 '①'", "[도장·결재] 하단 도장: TOP SECRET (상·하단 각 2회, 일부는 뒷면 비침)", "[도장·결재] 우하단 흐린 원형 도장: 'CINCAFPAC ... A.G.'(판독 불확실)", "[도장·결재] 좌하단 연필 일련번호: 1-L"], "note": "번역자 주 — 1) 발송 도장의 날짜가 '12 3 0 NOV 21 45' 처럼 겹쳐 찍혀 있어 '30 NOV 1945'로 읽었으나 확실치 않다. 원본 대조 대상. 2) 'Inclosed'/'inclosing' 은 당시 군 문서의 표기다(현행 enclosed). 고치지 않았다. 3) 문서번호 SWNCC 79/1, SWNCC 101/4 는 번역하지 않고 그대로 두었다. 사본 번호(제80호·제62호)도 그대로다. 4) 'R/S' 는 Routing Slip(회부용지)로 읽었다. 5) 실제 동봉물(육군부 각서 및 SWNCC 문서 2건)은 이 면에 함께 편철되어 있지 않다. 6) 이 면 전체가 흐린 사본이라 여백 표시 여러 개가 판독되지 않아 confidence 를 medium 으로 두었다.", "warn": true, "pages": ["0148"], "search": "맥아더(Douglas MacArthur — 원문 'General MacARTHUR') 해럴드 페어(Harold Fair — 원문 'HAROLD FAIR, Lt. Col., A.G.D., Asst. Adjutant General') W.E.C. (이니셜만 기재된 인물 — 회부용지 결재자) 1-L Ltr-Civil affairs Adm in Korea."}, {"id": "1-K", "order": 111, "date": "1945-10-27", "group": "D", "eyebrow": "편철 1-K · 0149–0151면", "title": "조선 민사행정의 구조와 구성(SWNCC 79/1); 조선의 임시 국제기구(SWNCC 101/4)", "badge": "Top Secret", "list_right": "1-K", "meta": [{"k": "일자", "v": "1945-10-27"}, {"k": "발신", "v": "육군부 부관감(AGWAR)", "txt": true}, {"k": "수신", "v": "태평양미육군총사령관 전진지휘소(CINCAFPAC ADV)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "SWNCC 79/1 · SWNCC 101/4"}, {"k": "종류", "v": "첨부물"}, {"k": "면", "v": "0149–0151 (3면)"}, {"k": "건명", "v": "Structure and composition of civil affairs administration in Korea (SWNCC 79/1); A temporary international authority in Korea (SWNCC 101/4)", "txt": true}, {"k": "색인 요지", "v": "MEMO-Structure and composition of civil affairs Adm in Korea. (SWNCC 79/1).", "txt": true, "wide": true}], "summary": "SWNCC 79/1 「조선 민사행정의 구조와 구성」과 SWNCC 101/4 「조선의 임시 국제기구」의 본체 각서는 참모장실로 반출되고, 그 자리를 표시하는 기록용 쪽지 두 장과 1945년 11월 4일자 부관부 라우팅 슬립 한 장만 편철되어 있다.", "points": ["본체 각서 두 건 모두 편철되어 있지 않다 — 쪽지에 「THIS MEMO PULLED AND SENT TO O OF C/S」(이 각서는 빼내어 참모장실로 보냄)라고 적혀 있다.", "SWNCC 79/1 (1945년 9월 27일) — 건명 「조선 민사행정의 구조와 구성」.", "SWNCC 101/4 (1945년 10월 24일) — 건명 「조선의 임시 국제기구(A temporary international authority in Korea)」. 즉 신탁통치 기구에 관한 문서다.", "함께 편철된 라우팅 슬립(0151)은 1945년 11월 4일자 부관부 발행으로, 총사령관 (1) → 참모장 (2) → 작전담당 부참모장 (3) → 정부과장 (4)의 순서로 회부하고, 용도는 「정보」와 「열람 후 반송」에 표시되어 있다.", "라우팅 슬립에는 편철기호가 없어 1-K 로의 배정은 편철 위치에 따른 추정이다."], "primary": "## 1. 기록용 쪽지 (0149)\n\n**기록용 쪽지(NOTE FOR RECORD)**\n\nSWNCC 79/1\n\n일자: 1945년 9월 27일\n\n건명: 조선 민사행정의 구조와 구성\n\n이 각서는 빼내어 참모장실로 보냄.\n\n(하단 연필: 1-K)\n\n## 2. 기록용 쪽지 (0150)\n\n**기록용 쪽지(NOTE FOR RECORD)**\n\nSWNCC 101/4\n\n일자: 1945년 10월 24일\n\n건명: 조선의 임시 국제기구\n\n이 각서는 빼내어 참모장실로 보냄.\n\n(하단 연필: 1-K)\n\n## 3. 라우팅 슬립 (0151)\n\n**1급비밀**\n\n연합국최고사령관 겸 태평양미육군총사령부 전진제대\n\n**라우팅 슬립**\n\n발신: 부관부(A.G.) — 1945년 11월 4일\n\n수신:\n- 총사령관 …… (1)\n- 참모장 …… (2)\n- 작전담당 부참모장 …… (3)\n- 정부과장 …… (4)\n\n용도:\n- 정보 …… ✓\n- 열람 후 반송 …… ✓\n\n(좌하단 연필: 051000)", "secondary": "## 1. Note for Record (0149)\n\nNOTE FOR RECORD\n\nSWNCC 79/1\n\nDATE: 27 Sep 45 SUBJ: Structure and composition of civil affairs administration in Korea\n\nTHIS MEMO PULLED AND SENT TO O OF C/S\n\n[pencil: 1-K]\n\n## 2. Note for Record (0150)\n\nNOTE FOR RECORD\n\nSWNCC 101/4\n\nDATE: 24 Oct 45 SUBJ: A Temporary international authority in Korea\n\nTHIS MEMO PULLED AND SENT TO O OF C/S\n\n[pencil: 1-K]\n\n## 3. Routing Slip (0151)\n\nGENERAL HEADQUARTERS\nSUPREME COMMANDER FOR THE ALLIED POWERS\nAND\nUNITED STATES ARMY FORCES, PACIFIC\nADVANCE ECHELON\n\nROUTING SLIP\n\nFROM: A. G.        4 NOV 1945\n\nTO:\nCommander-in-Chief    (1)\nChief of Staff        (2)\nD C/S for Opns        (3)\nC Govt Sec            (4)\n[remaining printed addressees unmarked: Military Secretary / Aides-de-Camp / G-1 / G-2 / G-3 / G-4 / Adjutant General / C Signal O / C Engineer / Antiaircraft O / Public Relations O / Inspector General / Judge Advocate / C QM O / C Ord O / C Surgeon / C Counter Intel O / C Publ Health & Welfare / Fiscal Director / C of I & E Services / C Econ & Sc Sec / Gen Procurement Agent / C Natural Resources / C Stat & Reports / C Legal Sec / Headquarters Commandant / PHILOSCAP]\n\nFOR:\nInformation  ✓ [Note &] Return  ✓ [unmarked: Approval / Comment or Concurrence / Initials / Issuance of Orders / Necessary Action / Distribution Desired / Signature / Dispatch / Attachment of Reference / File]\n\nTOP SECRET\n\n[pencil, lower left: 051000]", "notes": ["[도장·결재] (0149·0150) 하단 연필 편철기호: 「1-K」", "[도장·결재] (0151) 부관부 대형 고무인: 「A. G.」, 날짜 「4 NOV 1945」", "[도장·결재] (0151) 하단 「TOP SECRET」 고무인", "[도장·결재] (0151) 수신 항목 옆 자필 서명·이니셜 3점 [판독불가] — 참모장·정부과·하단 각 1점", "[도장·결재] (0151) 상단 자필 「3」 및 서명 [판독불가]", "[도장·결재] (0151) 좌하단 연필: 「051000」", "[도장·결재] (0151) 편철기호 없음", "면 배정 신뢰도 medium — 0149·0150 두 NOTE FOR RECORD 하단에 모두 '1-K'(SWNCC 79/1 27 Sep 45, SWNCC 101/4 24 Oct 45). 색인 1-K(27 Oct 45, AGWAR→CINCAFPAC ADV, SWNCC 79/1)와 일치. 다만 0151 은 기호가 없어 배치가 추정", "편철 메모 — 본문 각서는 O of C/S 로 빠지고 NOTE FOR RECORD 두 장만 남았다. 0151 은 편철기호가 없는 GHQ SCAP/AFPAC ADV routing slip(1945년 11월)으로, 이 문서철의 다른 routing slip(0155=1-H, 0157=1-G)이 모두 해당 문서 바로 뒤에 붙어 있는 편철 관행과 위치(0150 뒤, 0152=1-J 앞)를 근거로 1-K 에 넣었다 — 확정은 아님."], "note": "번역자 주 — 1) 본체 각서 두 건이 모두 반출되어 이 문서철에는 남아 있지 않다. 남은 것은 자리표시 쪽지 2장과 라우팅 슬립 1장이다. 2) 0151 라우팅 슬립에는 편철기호가 없다. 1-K 로 묶은 것은 편철 위치(0150 뒤, 0152=1-J 앞)와 이 문서철의 편철 관행(라우팅 슬립이 해당 문서 바로 뒤에 붙는다)에 따른 추정이며 확정이 아니다. 다만 슬립의 날짜(1945년 11월 4일)가 SWNCC 101/4(10월 24일)·색인 일자(10월 27일) 직후이고 회부처에 정부과(Govt Sec)가 들어 있어 조선 민사행정 건과 어긋나지 않는다. 3) 색인 1-K 의 발신·수신(AGWAR→CINCAFPAC ADV)은 쪽지에 적혀 있지 않다 — 색인 항목에서 가져온 것이다. 4) SWNCC 79/1, SWNCC 101/4 는 문서번호이므로 번역하지 않았다. 5) 0150 원문은 'A Temporaty'로 오타가 있고 OCR 은 날짜를 '24 vet 45'로 읽었으나 24 Oct 45 다. 6) 0149·0150 원문 'NOTE FOR REOCRD'/'REGORD'는 원본 타자 상태와 OCR 오독이 겹친 것으로, 양식은 'NOTE FOR RECORD'다.", "warn": true, "pages": ["0149", "0150", "0151"], "search": "1-K MEMO-Structure and composition of civil affairs Adm in Korea. (SWNCC 79/1)."}, {"id": "1-J", "order": 110, "date": "1945-10-25", "group": "D", "eyebrow": "편철 1-J · 0152–0152면", "title": "조선 민사행정의 구조와 구성", "badge": null, "list_right": "1-J", "meta": [{"k": "일자", "v": "1945-10-25"}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "라우팅 슬립"}, {"k": "면", "v": "0152–0152 (1면)"}, {"k": "건명", "v": "Structure and composition of civil affairs administration of Korea", "txt": true}, {"k": "색인 요지", "v": "MEMO-Structure and composition of Civil affairs administration in Korea, ref SWNCC 79/1.", "txt": true, "wide": true}], "summary": "J.C.S. 1483/9(1945년 9월 28일자, 조선 민사행정의 구조와 구성) 각서가 참모장실로 반출되었음을 알리는 기록용 쪽지.", "points": ["본문 각서는 이 문서철에 없다 — 'THIS MEMO PULLED AND SENT TO O OF C/S'(본 각서는 반출되어 참모장실로 보내졌음).", "반출된 문서는 J.C.S. 1483/9, 날짜 1945년 9월 28일.", "건명은 '조선 민사행정의 구조와 구성'.", "남은 것은 이 NOTE FOR RECORD 슬립 한 장뿐이며, 좌하단에 연필로 '1-J'가 적혀 있다."], "primary": "**기록용 쪽지(NOTE FOR RECORD)**\n\nJ.S.C. 1483/9\n\n날짜: 1945년 9월 28일\n\n건명: 조선 민사행정의 구조와 구성\n\n본 각서는 반출되어 참모장실로 보내졌음.", "secondary": "NOTE FOR RECORD\n\nJ.S.C. 1483/9\n\nDATE: 28 Sep 45 SUBJ: Structure and composition of civil affairs. administration of Korea\n\nTHIS MEMO PULLED AND SENT TO O OF C/S", "notes": ["[도장·결재] 타자 표제: NOTE FOR RECORD (기록용 쪽지)", "[도장·결재] 타자 회부 표시: THIS MEMO PULLED AND SENT TO O OF C/S — 본 각서는 반출되어 참모장실(Office of Chief of Staff)로 보내졌음", "[도장·결재] 좌하단 연필: 1-J", "편철 메모 — 본문 각서는 O of C/S 로 빠지고 NOTE FOR RECORD 슬립만 남았다. 슬립의 날짜(28 Sep 45)는 JCS 문서 자체의 날짜이고 색인 날짜(25 Oct 45)는 발신일."], "note": "번역자 주 — 문서번호가 원문에 'J.S.C. 1483/9'로 타자되어 있다. 통상 표기는 J.C.S.(합동참모본부) 1483/9이며 색인도 그렇게 적고 있으나, 원저자의 오타이므로 en 에는 타자된 그대로 두었다. 건명 중간의 마침표('civil affairs. administration')도 타자 그대로다. 이 면에는 TOP SECRET 고무인이 없다 — 본문 각서가 빠져나간 뒤 남은 대체 쪽지이기 때문으로 보인다. 상단에 편철용 천공 두 개.", "warn": false, "pages": ["0152"], "search": "1-J MEMO-Structure and composition of Civil affairs administration in Korea, ref SWNCC 79/1."}, {"id": "1-I", "order": 109, "date": "1945-10-17", "group": "D", "eyebrow": "편철 1-I · 0153–0153면", "title": "조선 민사에 관한 기본 초기지령 (J.C.S. 1483/15)", "badge": "Top Secret", "list_right": "1-I", "meta": [{"k": "일자", "v": "1945-10-17"}, {"k": "발신", "v": "합동참모본부, 워싱턴(JCS WASH)", "txt": true}, {"k": "수신", "v": "태평양미육군총사령관(CINCAFPAC)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "J.C.S. 1483/15"}, {"k": "종류", "v": "첨부물"}, {"k": "면", "v": "0153–0153 (1면)"}, {"k": "건명", "v": "Basic initial directive for civil affairs in Korea (J.C.S. 1483/15)", "txt": true}, {"k": "색인 요지", "v": "MEMO-Basic initial directive for civil affairs in Korea. (JCS 1483/15).", "txt": true, "wide": true}], "summary": "조선 민사에 관한 기본 초기지령 J.C.S. 1483/15(1945년 10월 17일)의 본체 각서는 참모장실로 반출되었고, 그 자리를 표시하는 기록용 쪽지 한 장만 편철되어 있다.", "points": ["본체 각서는 편철되어 있지 않다 — 「THIS MEMO PULLED AND SENT TO O OF C/S」(이 각서는 빼내어 참모장실로 보냄).", "문서번호 J.C.S. 1483/15, 일자 1945년 10월 17일.", "건명은 「조선 민사에 관한 기본 초기지령」 — 남조선 군정의 근거가 된 지령 계통의 문서다.", "이 문서철에 남은 것은 145자 분량의 쪽지 한 장뿐이다."], "primary": "**기록용 쪽지(NOTE FOR RECORD)**\n\nJ.C.S. 1483/15\n\n일자: 1945년 10월 17일\n\n건명: 조선 민사에 관한 기본 초기지령\n\n이 각서는 빼내어 참모장실로 보냄.\n\n(좌하단 연필 편철기호: 1-I)", "secondary": "NOTE FOR RECORD\n\nJ.C.S. 1483/15\n\nDATE: 17 Oct 45 SUBJ: Basic initial directive for civil affairs in Korea\n\nTHIS MEMO PULLED AND SENT TO O OF C/S\n\n[pencil, lower left: 1-I]", "notes": ["[도장·결재] 좌하단 연필 편철기호: 「1-I」 (OCR 은 「I-L」로 오독)", "편철 메모 — 본문 각서는 O of C/S 로 빠지고 NOTE FOR RECORD 슬립만 남았다."], "note": "번역자 주 — 1) 본체 각서가 반출되어 이 문서철에는 자리표시 쪽지 한 장만 남았다. 실제 지령 내용은 여기서 확인할 수 없다. 2) OCR 은 문서번호를 'j,c,S, K473.ks'로 읽었으나 색인 및 편철 맥락상 J.C.S. 1483/15 다. 문서번호는 번역하지 않고 그대로 두었다. 3) 편철기호 손글씨는 OCR 이 'I-L'로 읽었으나 앞뒤(0152=1-J, 0154=1-H)의 역순 배열상 1-I 다. 4) 발신·수신(JCS WASH → CINCAFPAC)은 쪽지에 적혀 있지 않고 색인 항목에서 가져온 것이다.", "warn": false, "pages": ["0153"], "search": "1-I MEMO-Basic initial directive for civil affairs in Korea. (JCS 1483/15)."}, {"id": "1-H", "order": 108, "date": "1945-10-16", "group": "D", "eyebrow": "편철 1-H · 0154–0155면", "title": "조선 내 특정 일본인 관리의 즉시 파면", "badge": "Top Secret", "list_right": "1-H", "meta": [{"k": "일자", "v": "1945-10-16"}, {"k": "발신", "v": "육군부 부관감(AGWAR)", "txt": true}, {"k": "수신", "v": "태평양미육군총사령관 전진지휘소(CINCAFPAC ADV)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "JCS 1483/6 (관련: JCS 1483/4)"}, {"k": "종류", "v": "첨부물"}, {"k": "면", "v": "0154–0155 (2면)"}, {"k": "건명", "v": "Immediate Removal of certain Japanese officials in Korea", "txt": true}, {"k": "색인 요지", "v": "MEMO-Immediate removal of certain Japanese Official in Korea.", "txt": true, "wide": true}], "summary": "「조선 내 특정 일본인 관리의 즉시 파면」에 관한 합동참모본부 문서 JCS 1483/6의 각서 본체는 참모장실로 반출되고, 문서철에는 그 사실을 적은 기록용 쪽지와 1945년 10월 회부전표만 남았다.", "points": ["건명은 「조선 내 특정 일본인 관리의 즉시 파면(Immediate Removal of certain Japanese officials in Korea)」이다.", "문서번호는 JCS 1483/6, 쪽지에 적힌 날짜는 1945년 9월 15일이다.", "각서 본체는 '빼내어 참모장실로 보냈음(this memo PULLED AND SENT TO O OF C/S)'이라고만 적혀 있고 문서철에 없다.", "0155면 회부전표(부관부 발)는 참모장(1) → 작전담당 참모차장(2) → G-2(3) → 정부부(4) 순으로 회부되었다.", "회부전표의 '용건' 란에는 '정보', '필요 조치', '열람 후 반송'에 표시가 있다.", "회부전표 상단 오른쪽에 손글씨 'D C/S Opns', 우상단에 부기 번호 '64A'가 적혀 있다."], "primary": "**[0154면 — 기록용 쪽지]**\n\n기록용 쪽지(NOTE FOR RECORD)\n\nJCS 1483/6\n\n일자: 1945년 9월 15일\n\n건명: 조선 내 특정 일본인 관리의 즉시 파면(Immediate Removal of certain japanese officials in Korea)\n\n이 각서는 빼내어 참모장실로 보냈음.\n\n**[0155면 — 회부전표]**\n\n총사령부\n연합국최고사령관 및\n미육군 태평양 전진제대\n\n회부전표(ROUTING SLIP)\n\n발: 부관부(A. G.)  ·  1945년 10월 27일\n\n수신처(회부 순서): 참모장 (1) — 작전담당 참모차장 (2) — G-2 (3, 이니셜 서명) — 정부부(C Govt Sec) (4, 이니셜 서명)\n\n용건 표시: 정보 ✓  ·  필요 조치 ✓  ·  열람 후 반송 ✓", "secondary": "[0154]\nNOTE FOR RECORD\n\nJCS 1483/6\nDATE: 15 Sep 45 SUBJ: Immediate Removal of certain japanese officials in Korea this memo PULLED AND SENT TO O OF C/S\n\n[0155]\nGENERAL HEADQUARTERS\nSUPREME COMMANDER FOR THE ALLIED POWERS\nAND\nUNITED STATES ARMY FORCES, PACIFIC\nADVANCE ECHELON\n\nROUTING SLIP\n\nFROM: A. G.        27 OCT 1945\n\nTO: Chief of Staff (1) ... D C/S for Opns (2) ... G-2 (3) [initialed] ... C Govt Sec (4) [initialed]\n[unmarked: Commander-in-Chief, Military Secretary, Aides-de-Camp, G-1, G-3, G-4, Adjutant General, C Signal O, C Engineer, Antiaircraft O, Public Relations O, Inspector General, Judge Advocate, C QM O, C Ord O, C Surgeon, C Counter Intel O, C Publ Health & Welfare, Fiscal Director, C I & E Services, C Econ & Sc Sec, Gen Procurement Agent, C Natural Resources, C Stat & Reports, C Legal Sec, Headquarters Commandant, FLTLOSCAP]\n\nFOR: Information [check] ... Necessary Action [check] ... Note & Return [check]\n\n[handwritten, top right] D C/S Opns ... 64A", "notes": ["[도장·결재] 0154면 좌하단 연필 정리기호: '1-H'", "[도장·결재] 0155면 우상단 손글씨: '64A'(부기 번호)", "[도장·결재] 0155면 표제 옆 손글씨: 'D C/S Opns'", "[도장·결재] 0155면 회부란 손글씨 숫자: 참모장 옆 '(1)'과 이니셜, 작전담당 참모차장 옆 '(2)'와 이니셜, G-2 옆 '(3)'과 서명, 정부부 옆 '(4)'와 이니셜", "[도장·결재] 0155면 'FOR' 란 체크 표시: Information, Necessary Action, Note & Return 세 항목", "[도장·결재] 0155면 우하단 서명 이니셜(판독불가)", "[도장·결재] 0155면 좌하단 연필 정리기호: '1-H'", "[도장·결재] 상단 여백(마이크로필름 촬영 시 삽입): 'Declassified E.O. 12065 Section 3/402/ NNDG NO. 775091'", "편철 메모 — 0155면은 첨부물(GHQ SCAP/AFPAC ADV routing slip, 21 Oct 1945). 본문 각서는 O of C/S 로 빠졌다."], "note": "번역자 주 — **이미 번역해 둔 `../FRUS_1945_Korea`의 d777(SWNCC가 특정 일본인 관리의 파면을 권고한 각서)과 짝이 되는 지시 계통이다.** 국무부 쪽에서 권고가 올라간 것이 합참 문서 JCS 1483 계열로 내려와 태평양미육군총사령부에 전달된 경로를 보여 준다. 같은 배치의 `1-C`(0165면, CAX 52020)가 그 지시를 제24군단에 하달한 실제 전문이다.\n\n**각서 본체는 이 문서철에 없다.** 남은 것은 '참모장실로 반출했다'는 기록용 쪽지와 회부전표뿐이다.\n\n0154면 'JCS 1483/6'의 마지막 숫자는 타자가 겹쳐 흐리다. '6'으로 읽었으나 확신은 낮다(색인은 JCS 1483/6·1483/4 두 문서번호를 함께 든다).\n\n원저자 표기는 그대로 두었다 — 건명의 'japanese'가 소문자, 'this memo'가 소문자로 시작.\n\n0155면 회부전표 날짜의 손글씨는 '27 OCT 1945'로 읽었다. OCR은 '21 OCT'로 읽었고 `raw/documents.json`도 21일로 적었으나, 원본 스캔에서는 두 번째 자릿수가 '7'에 가깝다. 원본 대조 대상으로 남겨 둔다.", "warn": true, "pages": ["0154", "0155"], "search": "1-H MEMO-Immediate removal of certain Japanese Official in Korea."}, {"id": "1-G", "order": 107, "date": "1945-09-25", "group": "B", "eyebrow": "편철 1-G · 0156–0157면", "title": "조선 민사에 관한 지령안(案)에 대한 주한미군사령관 보고 요약", "badge": "Top Secret", "list_right": "1-G", "meta": [{"k": "일자", "v": "1945-09-25"}, {"k": "발신", "v": "태평양미육군총사령관 전진지휘소(CINCAFPAC (ADVANCE))", "txt": true}, {"k": "수신", "v": "육군참모총장(WARCOS)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "CA 52293"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0156–0157 (2면)"}, {"k": "건명", "v": "Summary of report from CG USAFIK re proposed directive for civil affairs in Korea", "txt": true}, {"k": "색인 요지", "v": "CA 52293 - Ref TFGCG 81, Summary of report from USAFIK re proposed JCS directive for civil affairs in Korea.", "txt": true, "wide": true}], "summary": "도쿄가 주한미군사령관의 보고를 요약해 워싱턴에 올린 전문으로, 합참의 조선 민사 지령안 가운데 상당 부분은 이미 부분적으로 시행되고 있으나 완전 실시를 위해서는 정치·재정·노동물가·산업통상·농업 다섯 분야의 유자격 고문과 참모를 대폭 증원해야 하며, 연방 각 부처에서 인력을 선발할 것을 건의한다.", "points": ["제1부 : 주한미군사령관의 보고 요약이다.", "합동참모본부(JCS)의 조선 민사(civil affairs) 지령안의 많은 조항은 이미 부분적으로 시행되었다.", "조선 정세가 복잡하여, 해당 지령을 완전히 실시하려면 유자격 고문과 참모를 실질적으로 증원해야 한다.", "필요 분야를 점령지 중요도 순으로 열거 : 정치 — 정부 재편과 조선의 정치·경제적 통일에 영향을 미치는 대(對)소련 교섭을 보조.", "재정 — 당면한 인플레이션 상황과 조선 금융제도의 재편을 보조.", "노동 및 물가 — 건전한 유통과 경제의 창출을 위해.", "산업 및 통상 — 특히 일본의 관(官)·민(民) 투자의 청산이 중요하다.", "농업 — 소작(tenantry) 및 일본인 지배 토지의 재분배 계획을 보조.", "긴급하고 갈래가 많은 문제들의 수준이 높아, 연방 각 부처(Federal Bureaus)에서 유자격자를 선발(screening)하는 것이 정당하고 또 불가피하다. 이들은 긴급히 즉시 필요하다.", "제2부 : 본관은 위 보고에 동의하며, 곧 보낼 상세 소요에 맞추어 선발을 즉시 개시할 것을 건의한다.", "첨부 라우팅 슬립(1945년 9월 25일, 군정부 발신)에 'CA 52293' 고무인과 결재 표시가 있다."], "primary": "**제1부.** 주한미군사령관(CG USAFIK)의 보고 요약은 다음과 같음.\n\n조선 민사(civil affairs)에 관한 합동참모본부(JCS) 지령안의 많은 조항은 이미 부분적으로 시행되었음. 조선 정세가 복잡하기 때문에, 해당 지령을 완전히 실시하려면 다음 분야에서 유자격 고문 및 참모를 실질적으로 증원하는 것이 필요함. 아래는 점령 지역에서의 중요도 순임.\n\n- **정치** : 정부 재편을 보조하고, 조선의 정치적·경제적 통일에 영향을 미치는 소련 측과의 교섭을 보조하기 위함.\n- **재정** : 당면한 인플레이션 상황에 대처하고 조선 금융제도를 재편하는 것을 보조하기 위함.\n- **노동 및 물가** : 건전한 유통 구조와 경제를 만들기 위함.\n- **산업 및 통상** : 특히 일본의 관(官)·민(民) 투자를 청산하는 데 중요함.\n- **농업** : 소작(tenantry) 및 일본인이 지배하던 토지의 재분배 계획을 보조하기 위함.\n\n긴급하고 갈래가 많은 문제들이 그 수준이 매우 높아, 연방 각 부처에서 유자격 인물을 선발하는 것이 정당하며 또한 불가피함. 이들은 긴급히, 즉시 필요함.\n\n**제2부.** 본관은 위 보고에 동의하며, 곧 귀측에 보낼 상세 소요를 충족하기 위하여 선발을 즉시 개시할 것을 건의함.\n\n(CA 52293)\n\n증명 : B. M. 피치(B. M. Fitch), 준장, 미육군, 부관감\n승인 : W. E. 크리스트(W. E. Crist), 준장, 미육군, 군정장관실 수석장교\n\n---\n\n**[첨부 — 라우팅 슬립, 태평양미육군총사령부, 1945년 9월 25일]**\n\n발신 : 군정부(Military Govt Section)\n수신 : 총사령관 / 군사비서 / 부관(副官) / 참모장 / 참모차장 — 이 다섯 항목에 잉크로 크게 표시가 그어져 있음. '부관감(Adjutant General)' 항목에 체크.\n용건 : '승인(Approval)'에 '1', '서명(Signature)'과 '발송(Dispatch)'에 체크.\n고무인 : 'CA 52293'\n손글씨 이니셜 : 'WEC' 외 1개 [판독불가], 좌측 하단 '2/3'", "secondary": "PART ONE SMCLN SUMMARY OF REPORT FROM CHARLIE GEORGE USAFIK FOLLOWS SMCLN MANY PROVISIONS JIG CHARLIE SUGAR PROPOSED DIRECTIVE FOR CIVIL AFFAIRS IN KOREA HAVE ALREADY BEEN PUT INTO PARTIAL EFFECT PD DUE TO COMPLEXITY KOREAN SITUATION CMA FULL IMPLEMENTATION SUBJECT DIRECTIVE NECESSITATES SUBSTANTIAL INCREASE IN QUALIFIED ADVISORS AND STAFF IN THE FOLLOWING CATAGORIES LISTED IN PRIORITY OF OCCUPATION AREA IMPORTANCE CLN POLITICAL TO ASSIST IN GOVERNMENTAL REORGANIZATION AND IN NEGOTIATION WITH RUSSIANS AFFECTING POLITICAL AND ECONOMIC UNITY OF KOREA SMCLN FINANCIAL TO ASSIST IN IMMEDIATE INFLATIONARY CONDITIONS AND REORGANIZATION OF KOREAN FINANCIAL SYSTEM SMCLN LABOR AND PRICE FOR CREATION OF SOUND MARKETING AND ECONOMY SMCLN INDUSTRIAL AND COMMERCIAL WITH PARTICULAR IMPORTANCE TO LIQUIDATION OF JAPANESE GOVERNMENTAL AND PRIVATE INVESTMENTS SMCLN AGRICULTURAL TO ASSIST WITH PLANS FOR TENANTRY AND REDISTRIBUTION OF JAPANESE CONTROLLED LANDS PD URGENT AND RAMIFIED PROBLEMS ARE OF SUCH HIGH LEVEL AS WARRANT AND NECESSITATE SCREENING FEDERAL BUREAUS FOR QUALIFIED INDIVIDUALS CMA WHO ARE URGENTLY AND IMMEDIATELY REQUIRED PD PART TWO SMCLN ITEM CONCUR IN ABOVE REPORT AND RECOMMEND IMMEDIATE INITIATION OF SCREENING TO MEET DETAILED REQUIREMENTS TO BE FORWARDED YOU SOON ( CA 52293 )\n\nOFFICIAL:                              APPROVED:\nB. M. FITCH                            W. E. CRIST\nBrigadier General, U. S. Army          Brigadier General, U. S. Army Adjutant General                       Chief Military Government Officer ---\n\n[ATTACHMENT — ROUTING SLIP]\nGENERAL HEADQUARTERS, UNITED STATES ARMY FORCES, PACIFIC ROUTING SLIP        25 Sep 1945\nFROM: Military Govt Section\nTO: Commander-in-Chief / Military Secretary / Aides-de-Camp / Chief of Staff / Deputy Chief of Staff [heavy ink mark across these five]; Adjutant General [check]\nFOR: Approval [\"1\"] / Signature [check] / Dispatch [check] [stamp] CA 52293 [initials] WEC + [illegible]", "notes": ["[도장·결재] 0156 우측 고무인 : 'GHQ / AGO RECORDS COPY', 날짜 '27 SEP 1945'; 그 위 손글씨 '014.1 KOREA'", "[도장·결재] 0156 우측 상단 손글씨 : '25' (타자된 '24 SEPTEMBER 1945' 위에 덧씀) 및 '25/051' (정리 시각군)", "[도장·결재] 0156 우측 여백 손글씨 이니셜 [판독불가]", "[도장·결재] 0156 본문 밑줄(잉크) : 'CLN POLITICAL TO ASSIST IN GOVERNMENTAL REORGANIZATION AND IN NEGOTIATION WITH RUSSIANS' 및 'FINANCIAL' 행", "[도장·결재] 0156 서명란 위 자필 이니셜 : 'CHS' 및 W. E. Crist 서명", "[도장·결재] 0156 하단 손글씨 : 'copy returned'", "[도장·결재] 0156 하단 우측 큰 손글씨 : 'AG FILE'", "[도장·결재] 0156 상·하단 고무인 : 'TOP SECRET'", "[도장·결재] 0157 라우팅 슬립 손글씨 : 날짜 '25 Sep 1945', 발신 'Military Govt Section'", "[도장·결재] 0157 고무인 : 'CA 52293'", "[도장·결재] 0157 손글씨 이니셜 : 'WEC' 및 1개 더 [판독불가], 좌측 하단 '2/3'", "[도장·결재] 0156·0157 좌측 하단 연필 편철기호 : '1-G'", "편철 메모 — 0157면은 첨부물(AFPAC AGO routing slip, 25 Sep 1945)."], "note": "번역자 주 — 전문 머리는 음성문자 철자다 : 'CHARLIE GEORGE USAFIK'=CG USAFIK(주한미군사령관), 'JIG CHARLIE SUGAR'=JCS(합동참모본부), 'ITEM'=I, 'SMCLN'=세미콜론, 'CLN'=콜론, 'CMA'=쉼표, 'PD'=마침표.\n\n원저자 오타 'CATAGORIES'(categories)는 고치지 않았다.\n\n날짜 : 본문 머리는 '24 SEPTEMBER 1945'로 타자되었으나 그 위에 손글씨로 '25'가 덧쓰여 있고, 첨부 라우팅 슬립도 25 Sep 1945, 색인도 25 Sep 이므로 date 를 1945-09-25 로 잡고 원문 표기는 date_note 에 남겼다.\n\n'SCREENING FEDERAL BUREAUS' 는 미국 연방 각 부처를 뒤져 유자격 민간 전문가를 선발한다는 뜻이다. 'Federal Bureaus'를 '연방수사국' 따위로 오해해서는 안 된다.\n\n0157면은 본문 없는 회부 쪽지이나 'CA 52293' 고무인과 결재 이니셜이 남아 있어 첨부로 옮겼다. 0157 라우팅 슬립의 수신처 다섯 항목은 굵은 잉크 표시로 덮여 어느 것이 선택된 것인지 특정하기 어렵다.", "warn": false, "pages": ["0156", "0157"], "search": "B. M. 피치(B. M. Fitch) — 준장, 부관감 W. E. 크리스트(W. E. Crist) — 준장, 군정장관실 수석장교 1-G CA 52293 - Ref TFGCG 81, Summary of report from USAFIK re proposed JCS directive for civil affairs in Korea."}, {"id": "1-F", "order": 106, "date": "1945-09-23", "group": "B", "eyebrow": "편철 1-F · 0158–0158면", "title": "귀 WX 68170에 대하여 — 귀 WX 61967에 관한 의견 및 동의는 9월 13일자 본 CA 51904로 이미 송신하였음", "badge": "Top Secret", "list_right": "1-F", "meta": [{"k": "일자", "v": "1945-09-23"}, {"k": "발신", "v": "태평양미육군총사령관 전방지휘소(CINCAFPAC ADV)", "txt": true}, {"k": "수신", "v": "육군참모총장(WARCOS)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "CA 52208"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0158–0158 (1면)"}, {"k": "건명", "v": "Reference WX 68170 — comment and concurrence on WX 61967 was transmitted in CA 51904 of 13 September", "txt": true}, {"k": "색인 요지", "v": "CA 52208 - Ref WX 68170, Our comment & concurrence on WX 61967 was transmitted by CA 51904.", "txt": true, "wide": true}], "summary": "태평양미육군총사령관 전방지휘소가 육군참모총장의 전문 WX 68170에 답하여, 그가 요구한 WX 61967에 대한 의견과 동의는 이미 9월 13일자 CA 51904로 송신했다고 통지한 작전우선순위 전문.", "points": ["발신 태평양미육군총사령관 전방지휘소, 수신 육군참모총장, 취급 등급 작전우선순위(OPERATIONAL PRIORITY).", "귀 전문 WILLIAM XRAY 68170(WX 68170)에 대한 회신이다.", "귀 전문 WILLIAM XRAY 61967(WX 61967)에 관한 본직의 의견 및 동의는 9월 13일자 CHARLIE ABLE 51904(CA 51904)로 이미 송신하였다.", "본문 전체가 통신용 철자법(WILLIAM XRAY, CHARLIE ABLE, NOUGHT 등)으로 숫자를 풀어 적었다.", "인증은 부관감보 해럴드 페어(Harold Fair) 중령.", "여백 자필로 사본을 참모장실 및 군정부(Mil Govt)에 '교부함(furnished)'이라 적혀 있다."], "primary": "**작전우선순위**\n\nCA 52208\n\n귀 전문 윌리엄 엑스레이 육 팔 일 칠 공(WX 68170)에 대하여. 귀 전문 윌리엄 엑스레이 육 일 구 육 칠(WX 61967)에 관한 본직의 의견 및 동의는 9월 13일자 본직의 찰리 에이블 오 일 구 공 사(CA 51904)로 귀관에게 송신하였음.\n\n인증:\n\n해럴드 페어(HAROLD FAIR)\n중령, 부관병과\n부관감보", "secondary": "TOP SECRET\n\nOP\n\nOPERATIONAL PRIORITY\n\nCS  RKS/fh 23 SEPTEMBER 1945\n\nFROM: CINCAFPAC ADV\n\nTO : WARCOS\n\nCA 52208\n\nYOUR WILLIAM XRAY SIX EIGHT ONE SEVEN NOUGHT PD ( ) OUR COMMENT AND CONCURRENCE ON YOUR WILLIAM XRAY SIX ONE NINE SIX SEVEN WAS TRANSMITTED TO YOU IN OUR CHARLIE ABLE FIVE ONE NINE NOUGHT FOUR ON THIRTEEN SEPTEMBER\n\nOFFICIAL:\n\nHAROLD FAIR\nLt Col, AGD Asst Adj Gen Copy to: C/S\n\nWX 68170\n\nTOP SECRET\n\nThe making of an exact copy of this message is forbidden[.] Such extracts as are absolutely necessary will be made and marked consistent with its classification", "notes": ["[도장·결재] 상단 고무인: TOP SECRET", "[도장·결재] 상단 고무인: OPERATIONAL PRIORITY (작전우선순위)", "[도장·결재] 좌측 고무인: OP", "[도장·결재] 우상단 자필: 230353Z — 발신 시각군(23일 0353 Z시). 끝 두 글자는 겹쳐 써서 확실치 않다", "[도장·결재] 우측 여백 세로 고무인: AG(O) RECORDS 25 SEP 1945 (부관부 기록과 1945년 9월 25일 접수)", "[도장·결재] 위 접수인 옆 자필: 014.1 Korea (편철 분류번호)", "[도장·결재] 접수인 옆 자필: TS (Top Secret)", "[도장·결재] 전문번호 오른쪽 큰 자필 결재 서명 1개(판독불가)", "[도장·결재] 'OFFICIAL:' 옆 자필 이니셜 서명 1개(판독불가)", "[도장·결재] 하단 자필: '& Mil Govt — furnished' (군정부에도 교부함). 타자된 'Copy to: C/S'에 이어 붙인 것", "[도장·결재] 하단 고무인: TOP SECRET", "[도장·결재] 하단 고무인(주의문): The making of an exact copy of this message is forbidden. Such extracts as are absolutely necessary will be made and marked consistent with its classification — 본 전문의 정확한 사본 작성은 금지된다. 절대로 필요한 발췌만 작성하되 그 등급에 맞게 표시할 것", "[도장·결재] 하단 타자: WX 68170 (참조 전문번호)", "[도장·결재] 우하단 자필: AG File (부관부 편철)", "[도장·결재] 좌하단 연필: 1-F"], "note": "번역자 주 — 전문 머리의 'CS RKS/fh'는 기안·타자자 표시로 보이나 확정하지 못했다.\n\n원문 본문에 'PD'(period, 마침표) 다음 여는 괄호가 있고 그에 대응하는 닫는 괄호가 전문번호 'CA 52208' 도장 오른쪽에 찍혀 있다. 즉 'CA 52208'이 괄호 안에 후기(後記)로 삽입된 형태이며, 이 전문번호는 타자가 아니라 별도 번호 도장으로 찍혔다. en 에는 괄호를 빈 채로 두고 전문번호를 앞줄에 따로 뽑았다.\n\n숫자는 통신용 철자법 그대로 옮겼다. NOUGHT = 0. 어떤 숫자도 '바로잡지' 않았다.\n\nOCR(ocr/0158.txt)의 '1946', 'PROM', 'MARCOS', 'CINCAPPAC', 'HAROLD FK', 'SIX OBE WINE SIX SEVEN', 'SOUGHT POUR', '95 CFP 1945'는 모두 판독 오류다. 원본 스캔에서 각각 1945 / FROM / WARCOS / CINCAFPAC / HAROLD FAIR / SIX ONE NINE SIX SEVEN / NOUGHT FOUR / 25 SEP 1945 로 확인했다.\n\n본문에 언급된 WX 68170·WX 61967·CA 51904의 내용은 이 면에 없다. 하단에 타자된 'WX 68170'은 회신 대상 전문번호를 편철용으로 적어 둔 것이다.\n\nconfidence 를 medium 으로 둔 것은 자필 결재 서명 두 개와 시각군 끝자리를 판독하지 못했기 때문이다.", "warn": true, "pages": ["0158"], "search": "해럴드 페어(Harold Fair) — 중령, 부관병과, 부관감보 1-F CA 52208 - Ref WX 68170, Our comment & concurrence on WX 61967 was transmitted by CA 51904."}, {"id": "1-E", "order": 105, "date": "1945-09-22", "group": "B", "eyebrow": "편철 1-E · 0159–0162면", "title": "WX 61967 참조 — 지령안 조항에 대한 동의 및 추가 고문·전문가 요청", "badge": "Top Secret", "list_right": "1-E", "meta": [{"k": "일자", "v": "1945-09-22"}, {"k": "발신", "v": "주한미군사령관(CG USAFIK)", "txt": true}, {"k": "수신", "v": "태평양미육군총사령관 전진지휘소(CINCAFPAC ADV)", "txt": true}, {"k": "참조", "v": "처리(ACTION): 군정장관(C MIL GOVT O) · 참조(INFORMATION): 총사령관(COMMANDER-in-CHIEF), 참모장(CHIEF OF STAFF)", "txt": true}, {"k": "전문번호", "v": "TFGCG 81 (원본 타자 표기 'TCGCG-81' / 'TCGCG 81')"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0159–0162 (4면)"}, {"k": "건명", "v": "Ref WX 61967 — concurrence in provisions of proposed directive; request for additional advisers and experts", "txt": true}, {"k": "색인 요지", "v": "TFGCG 81 - Ref WX 61967, Concur in provisions of the directive summarized in ref.", "txt": true, "wide": true}], "summary": "하지의 사령부가 워싱턴의 민사행정 지령안(WX 61967)에 그 모든 목표를 포함하여 동의한다고 회신하면서, 38도 이남의 정부와 경제를 최소한이나마 재편하려면 정치·금융·임금물가·산업상업·농업 다섯 분야의 기술고문과 전문가가 반드시 필요하다고 우선순위를 매겨 요청한 전문.", "points": ["본 사령부는 참조 전문에 요약된 지령의 조항에 그 모든 목표를 포함하여 동의한다.", "그 조항의 상당 부분은 특별한 지시 없이도 군사적 필요에 따라 우리 통제 하의 지역에서 이미 대체로 시행되고 있다.", "가용 인원이 제한되어 있으므로 제안된 정책은 넓고 일반적인 방식으로만 적용될 수 있음이 명백하다.", "지령을 원하는 대로 수행하려면 인원의 상당한 증원과 더 완전하고 근본적인 정책 지시가 함께 필요하다.", "38도 이남의 정부와 경제를 최소한이나마 재편하는 데도 많은 기술고문과 전문가가 필수적이다.", "(A) 추가 정치고문과 참모 — 명확한 정책 지시를 갖추고 러시아와의 교섭을 도와 조선의 정치적·경제적 통일을 지키게 할 것. 나라의 자의적 분단 문제가 중요하고 절박하다.", "(B) 금융 전문가와 참모 — 당면한 인플레이션 문제를 자문하고, 조선을 궁극적으로 엔 블록(Yen Bloc)에서 분리할 목적으로 조선 금융제도 연구에 착수할 것.", "(C) 임금·물가 경제학자 — 인플레이션과 소비재 부족이라는 현 조건 위에서 적정 임금·물가 수준을 정하여, 심각한 파업·무질서·기아 없이 시장과 소상공업이 유지되도록 할 것. 이 활동은 결국 건전한 조선 경제 창출을 겨냥한 다른 활동과 합쳐질 것이다.", "(D) 산업·상업 전문가와 참모 — 금융 전문가와 협력하여 조선의 복잡한 산업·상업 구조를 풀 것. 특히 일본인 투자(정부·민간 양쪽)의 질서 있는 청산에 유의할 것.", "(E) 농업 전문가 — 오로지 일본제국의 이익을 위해 만들어진 현행 농산물(특히 쌀) 통제를 자유로운 조선인 기업 하의 반통제 상태로 전환하는 것을 도울 것. 농업금융·소작 전문가는 대일본인 대지주가 지금 보유한 토지의 재분배 계획을 세울 수 있다.", "본 사령부는 당면한 필요와 장기 계획을 함께 생각하고 있다.", "눈앞의 긴급 문제 해결을 도울 기술 인력이 즉시 필요하고, 워싱턴에서 검토 중인 것으로 아는 고위 정책 지시를 토대로 조선 경제의 구조를 세울 참모진도 필요하다.", "가까운 장래에 본 사령부가 필요로 할 인원의 상세한 조사표를 위 요강에 따라 작성 중이며 곧 송부하겠다.", "여기에 언급한 인력의 대부분은 현재 가용한 군정 요원의 수준을 넘어서며 아마도 민간인일 것이다.", "그동안 각 연방 부처가 위 범주의 인원 선별 작업에 착수할 수 있도록 육군참모총장에게 통보해 줄 것을 요청한다."], "primary": "WX-61967 참조. 본 사령부는 참조 전문에 요약된 지령의 조항에 그 모든 목표를 포함하여 동의한다. 그 조항들은 특별한 지시가 없었음에도 군사적 필요에 의하여 우리 통제 하의 지역에서 이미 대체로 시행되어 왔다. 가용 인원이 제한되어 있는 만큼 제안된 정책들은 넓고 일반적인 방식으로만 적용될 수 있음이 명백하다. 바라는 지령들을 수행하려면 인원의 상당한 증원과 아울러 더 완전하고 근본적인 정책 지시가 필요할 것이다. 현재로서는 38도선 이남의 정부와 경제를 최소한이나마 재편하는 일을 해내기 위해서도 많은 기술고문과 전문가가 필수적이다. 이 수준에서 본 그 중요도의 우선순위에 따라 열거하면 다음과 같다.\n\n(A) 추가 정치고문과 참모진. 명확한 정책 지시를 갖추어, 조선의 정치적·경제적 통일을 보존하려는 노력 가운데 러시아 측과의 교섭을 보조하게 할 것. 나라의 자의적 분단에 관한 문제들은 중요하고도 절박하다.\n\n(B) 금융 전문가와 참모진. 인플레이션 등 당면 문제에 관하여 자문하고, 조선을 궁극적으로 엔 블록(Yen Bloc)에서 분리할 것을 내다보며 조선 금융제도에 대한 연구에 착수할 것.\n\n(C) 임금·물가 경제학자. 인플레이션과 소비재 부족에 관한 현재의 조건을 토대로 만족스러운 임금 및 물가 수준을 정하여, 심각한 파업·무질서·기아 없이 시장 거래와 소규모 상업이 계속되도록 보장할 것. 이러한 활동은 결국 건전한 조선 경제의 창출을 겨냥한 다른 활동들과 합쳐지게 될 것이다.\n\n(D) 산업·상업 전문가와 참모진. 금융 전문가들과 협력하여 조선의 복잡한 산업·상업 체계를 풀어낼 것. 특히 정부와 민간 양쪽의 일본인(Jap) 투자를 질서 있게 청산하는 데 유의할 것.\n\n(E) 농업 전문가. 오로지 일본제국의 이익을 위하여 만들어진 현행 농산물 — 특히 쌀 — 의 엄격한 통제를, 자유로운 조선인 기업 하의 반(半)통제 상태로 전환하는 일을 보조할 것. 농업 금융 및 소작 문제 전문가들은 현재 일본인 대지주가 보유한 토지의 재분배 계획을 세울 수 있을 것이다.\n\n위에서 보듯 본 사령부는 당면한 필요와 장기적 계획을 함께 놓고 생각하고 있다. 우리는 눈앞의 긴급한 문제들을 푸는 데 도움이 될 추가 기술 인력이 즉시 필요하며, 아울러 워싱턴에서 검토 중인 것으로 아는 고위 정책 지시를 토대로 조선 경제의 구조를 세울 참모진도 필요하다. 위 요강에 따라 가까운 장래에 본 사령부가 필요로 할 인원에 대한 상세한 조사표를 작성 중이며 곧 송부할 것이다. 이와 관련하여, 여기에 언급된 인력의 대부분은 현재 가용한 군정 요원의 수준을 넘어서며 아마도 민간인일 것임을 강조한다. 그때까지 각 연방 부처가 위에 언급된 범주의 인원에 대한 선별 작업에 착수할 수 있도록 육군참모총장(WARCOS)에게 통보하여 줄 것을 요청한다.\n\n(서명 없음)", "secondary": "[A. \"CORRECTED COPY\" — pages 0159–0160, GHQ AGO RECORDS 26 SEP 1945, COPY NO. 6]\n\nTOP SECRET / PRIORITY\n25 September 1945 \"CORRECTED COPY\"\n\nTO   : CINCAFPAC ADV\nFROM : CG USAFIK\nNR   : TCGCG-81 Reference WX-61967. This Hq concurs in the provisions of the directive as summarized in reference including all its objectives. The provisions thereof have already largely been put in effect in areas under our control by virtue of military necessity without specific instructions. Obviously with the limited personnel available the proposed policies could only be applied in a broad and general way. To accomplish the desired directives will require a considerable augmentation in personnel as well as more complete and fundamental policy instructions. At present in order to accomplish even a minimum of reorganization of the government and the economy south of the 38 parallel many technical advisers and experts are essential. In order of their priority of importance viewed from this level they are: (A) Additional political advisers and staff furnished with definite policy directives to assist in negotiations with the Russians in endeavoring to preserve the political and economic unity of Korea. Problems concerning the arbitrary division of the country are important and pressing. (B) Banking experts and staff to advise on the immediate problems of inflation etcetera and to commence studies of the Korean financial system with a view to ultimate separation of Korea from the Yen Bloc. (C) Wage and price economists who on the basis of present conditions regarding inflation and scaricity of consumer goods can establish satisfactory wage and price scales to insure the continuance of marketing and small businesses without serious strikes disorder and starvation. Such activities will eventually merge with others aimed at the creation of a sound Korean economy. (D) Industrial and commercial experts and staff to cooperate with the financial experts in untangling the complicated industrial and commercial setup in Korea, with particular reference to the orderly liquidation of Jap investments both Government and private. (E) Agricultural experts to assist in transforming the present rigid control of agricultural products, especially rice, which was created solely for the benefit of the Japanese Empire, to a semi controlled status under free Korean enterprise. Experts in farm financing and in tenantry could plan a program for the redistribution of lands now held by large Japanese land holders. From the above it will be noted that this Hq is thinking [page 2] both in terms of immediate necessities, and of long range planning. We need additional technical personnel immediately to assist in solving the urgent problems before our eyes, as well as a staff to erect the structure of Korean economy on the basis of high policy directives which we understand are under consideration in Washington. A detailed survey of the personnel needed by this Hq in the very near future, in accordance with the above outline is being prepared and will be forwarded shortly. In this connection it isemphasized that most types of personnel mentioned herein are above the level of now available Military Government personnel and will probably be civilians. In the meantime it is requested that WARCOS be notified in order that the various Federal Bureaus can commence screening activities for personnel in the categories mentioned above.\n\nNO SIG\n\nTOO: 220309 Z\nMCN: Y-0025 NOTE: Corrected Copy received in the AG Office, ADV CINCAFPAC 251415. DISTRIBUTION:\nACTION COPY TO: C MIL GOVT O INFORMATION COPIES TO: COMMANDER-in-CHIEF, CHIEF OF STAFF 3844   TOP SECRET   COPY NO. 6\n\nTHE MAKING OF AN EXACT COPY OF THIS MESSAGE IS FORBIDDEN\n\n[B. FIRST-RECEIVED COPY — pages 0161–0162, GHQ AGO RECORDS 24 SEP 1945, COPY NO. 8. Garbled groups shown as received; underscoring in the original marks the portions for which service was requested.]\n\nTOP SECRET / PRIORITY\n23 September 1945\n\nTO   : CINCAFPAC ADV\nFROM : CG USAFIK\nNR   : TCGCG 81 Reference WX 61967. This Hq concurs in the provisions of the directive as summarized in reference including all its objectives. The provisions thereof have already largely been put in effect in areas under our control by virtue of Military necessity without specific instructions. Obviously with the limited personnel available the proposed policies could only be applied in a broad and general way. To accomplish the desired directives will require a considerable augmentation in personnel as well as more complete and fundamental policy instructions. At present in order to accomplish even a minimun of reorganization of the Government and the economy CQSYH YX the 38 PU A/INETHGANYKSLHEEEEE WORR technical advisers and experts are EVSVNTNAD. In order of their priority of importance viewed from this level they are: (A) Additional political advisers and staff furnished with definite policy directives to assist in negotiations with the Russians in endeavoring to preserve the political and economic unity of Korea. Problems concerning the arbitrary division of the country are important and pressing. (B) BRAPCTC XDJERTY and staff to advise on the immediate problems of inflation etcetera and to commence studies of the Korean financial system with a view to ultimate separation of Korea from the YUN IILOC. (C) Wage and price economists JTUO on the basis of present conditions regarding inflation and scarcity of consumer goods can establish satisfactory wage and price scales to insure the continuance of marketing and small businesses without serious strikes disorder and starvation. Such activities will eventually merge with others aimed at the creation of a sound Korean economy. (D) Industrial and commercial experts and staff to cooperate with the financial experts in untangling the complicated industrial and commercial setup in Korea, with particular reference to the orderly liquidation of Jap investments both Government and private. (E) Agricultural experts to assist in transforming the present rigid control of agricultural products, especially rice, which was created solely for the benefit of the Japanese Empire, to a semi controlled status under free Korean enterprise. Experts in farm financing [page 2] and in tenantry could plan a program for the redistribution of lands now held by large Japanese landholders. From the above it will be noted that this Hq is thinking both in terms of immediate necessities, and of long range planning. We need additional technical personnel immediately to assist in solving the urgent problems before our eyes, as well as a staff to erect the structure of Korean economy on the basis of high policy directives which we understand are under consideration in Washington. A detailed survey of the personnel needed by this Hq in the very near future, in accordance with the above outline is being prepared and will be forwarded shortly. In this connection it is emphasised that most types of personnel mentioned herein are above the level of now available Military Government personnel and will probably be civilians. In the meantime it is requested that WARCOS be notified in order that the various Federal Bureaus can commence screening activities for personnel in the categories mentioned above.\n\nNO SIG\n\nTOO: 220309 Z\nMCN: Y-0025 NOTE: Service has been requested for underscored portions. DISTRIBUTION:\nACTION COPY TO: C MIL GOVT O INFORMATION COPIES TO: COMMANDER-in-CHIEF, CHIEF OF STAFF 3844   TOP SECRET   COPY NO. 8 [handwritten] (SEE CORRECTED COPY ABOVE)\n\nTHE MAKING OF AN EXACT COPY OF THIS MESSAGE IS FORBIDDEN", "notes": ["[도장·결재] 0159면 고무인(우상단, 세로): 「GHQ / AGO RECORDS / 26 SEP 1945」, 옆에 손글씨 '014.1 Korea'", "[도장·결재] 0159면 하단: 'TOP SECRET' 고무인 2개, 'A. G. FILE' 고무인, 'COPY NO.' 란에 손글씨 '6'", "[도장·결재] 0159면 본문 밑줄: 'as summarized in', 'south of the 38 parallel many ... are essential. In order of their priority of', 'level they are', 'Banking experts', 'etcetera and to commence', 'who on the basis of present conditions regarding', 'consumer' 등에 손으로 밑줄 — 최초 수신본에서 깨져 재조회(service)를 요청했던 대목을 정정본에서 표시한 것", "[도장·결재] 0159·0160·0161·0162면 좌하단 연필 정리기호: '1-E'", "[도장·결재] 0160면 우하단: 'COPY NO.' 란에 손글씨 '6'", "[도장·결재] 0161면 고무인(우상단, 세로): 「GHQ / AGO RECORDS / 24 SEP 1945」, 옆에 손글씨 '014.1 Korea'", "[도장·결재] 0161면 본문 밑줄: 깨진 전신 부호군 'CQSYH YX ... WORR', 'EVSVNTNAD', 'In order of their priority of importance viewed from this level', 'BRAPCTC XDJERTY', 'YUN IILOC', 'JTUO', 'conditions' 등에 손으로 밑줄 — 재조회 요청 대목 표시", "[도장·결재] 0161면 하단 손글씨: '(SEE CORRECTED COPY ABOVE)' — 정정본이 앞면에 편철되어 있음을 가리킴", "[도장·결재] 0161면 하단: 'A. G. FILE' 고무인, 'COPY NO.' 란에 손글씨 '8'", "[도장·결재] 0162면 우하단: 'A. G. FILE' 고무인, 그 아래 손글씨 '8'(COPY NO.)", "[도장·결재] 상단 여백(마이크로필름 촬영 시 삽입): 'Declassified E.O. 12065 Section 3/402/ NNDG NO. 775091'", "편철 메모 — 같은 전문이 두 벌 편철돼 있다. 0159~0160 은 'CORRECTED COPY'(25 Sep 45 접수), 0161~0162 는 최초 수신본(24 Sep 45 접수, 밑줄 부분 재조회 요청 주기). dupes.json 에는 잡히지 않았으나 내용은 동일."], "note": "번역자 주 — **두 사본의 차이 — 같은 전문(TFGCG 81, TOO 220309 Z, MCN Y-0025)이 두 벌 편철돼 있고 문면이 다르다.**\n\n번역 본문(`ko`)은 지시대로 정정본(CORRECTED COPY, 0159~0160면)을 따랐다. `en`에는 두 벌을 모두 실었다.\n\n1) 성격 — 0161~0162면이 **먼저 도착한 수신본**(GHQ AGO RECORDS 접수 도장 24 SEP 1945, COPY NO. 8)이고, 0159~0160면이 **정정본**(표제에 따옴표까지 붙여 '\"CORRECTED COPY\"'라 타자, 접수 도장 26 SEP 1945, COPY NO. 6)이다.\n\n2) **최초 수신본은 전신 부호군이 깨져 있다.** 깨진 대목에는 손으로 밑줄이 그어져 있고, 말미 주기에 'Service has been requested for underscored portions.'(밑줄 부분에 대해 재조회를 요청함)라고 적혀 있다. 정정본 말미 주기는 이와 달리 'Corrected Copy received in the AG Office, ADV CINCAFPAC 251415.'(정정본을 25일 1415에 부관부에서 접수)이다.\n\n3) **깨진 곳과 정정 결과** — 정정본을 대조하면 다음과 같다.\n   · 'the economy CQSYH YX the 38 PU A/INETHGANYKSLHEEEEE WORR technical advisers and experts are EVSVNTNAD' → 'the economy south of the 38 parallel many technical advisers and experts are essential'\n   · '(B) BRAPCTC XDJERTY and staff' → '(B) Banking experts and staff'\n   · 'separation of Korea from the YUN IILOC' → 'separation of Korea from the Yen Bloc'\n   · '(C) Wage and price economists JTUO on the basis' → '(C) Wage and price economists who on the basis'\n   즉 **깨진 것은 요청 항목의 핵심 낱말들이다.** 「38도선 이남」이라는 지리적 범위, 「필수적」이라는 강도, 「금융 전문가」라는 요청 대상, 「엔 블록」이라는 분리 대상 — 정정본이 오기 전까지 도쿄는 하지가 무엇을 얼마나 급하게 요구하는지 읽을 수 없었던 셈이다.\n\n4) **날짜 표기가 다르다.** 속면 표제가 최초본은 'DATED 23 SEPTEMBER 1945', 정정본은 'DATED 22 SEPTEMBER 1945'이다. 두 벌 다 우상단 처리일자는 '25 September 1945'로 타자되어 있고 TOO는 220309 Z로 같다. 발신 시각(22일 0309Z)에 비추면 정정본의 22일이 맞다. 숫자는 고치지 않고 읽은 그대로 두었다.\n\n5) 사소한 차이 — 최초본 'Military necessity'(대문자) / 정정본 'military necessity', 최초본 'minimun'·'emphasised'·'landholders' / 정정본 'minimum'·'isemphasized'(띄어쓰기 누락)·'land holders', 최초본 'scarcity' / 정정본 'scaricity'(정정본 쪽이 오타), 전문번호 표기 'TCGCG 81' / 'TCGCG-81'.\n\n6) 최초본 하단에는 손글씨로 '(SEE CORRECTED COPY ABOVE)'라 적혀, 부관부가 두 벌을 한 묶음으로 편철하면서 어느 쪽이 유효한지 표시해 두었다.\n\n**그 밖의 표기** — 전문번호는 원본에 'TCGCG'로 타자되어 있으나 색인과 문서철 관례상 TFGCG의 오타로 보인다. 읽은 그대로 en에 남기고 msg_nr에 병기했다.\n\n본문 (D)항의 'Jap investments'는 멸칭이다. 원문 그대로 옮겼다(한국어 본문 '일본인(Jap) 투자').\n\n원저자 오타는 고치지 않았다 — 'scaricity'(정정본), 'isemphasized'(정정본), 'minimun'·'emphasised'(최초본), 'etcetera'(=et cetera).", "warn": false, "pages": ["0159", "0160", "0161", "0162"], "search": "하지(John R. Hodge) — CG USAFIK. 전문에 서명은 없다('NO SIG'), 발신자 표시로만 나온다. 1-E TFGCG 81 - Ref WX 61967, Concur in provisions of the directive summarized in ref."}, {"id": "1-D", "order": 104, "date": "1945-09-22", "group": "B", "eyebrow": "편철 1-D · 0163–0164면", "title": "WX 61967에 대한 긴급 회신 요구 — 조선 지령을 즉시 발령할 예정", "badge": "Top Secret", "list_right": "1-D", "meta": [{"k": "일자", "v": "1945-09-22"}, {"k": "발신", "v": "워싱턴(WASHINGTON) — 마셜(MARSHALL)", "txt": true}, {"k": "수신", "v": "태평양미육군총사령관 전진제대(CINCAFPAC ADV, 맥아더), 태평양미육군총사령관(CINCAFPAC)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "WX 68170"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0163–0164 (2면)"}, {"k": "건명", "v": "Request urgent reply to WX 61967; proposed to issue Korea directive immediately", "txt": true}, {"k": "색인 요지", "v": "WX 68170 - Req your reply to WX 61967; propose to issue immediately directive on Korea.", "txt": true, "wide": true}], "summary": "9월 9일자 WX 61967에 요약된 조선 지령을 즉시 발령할 것을 제안하며, 그 전문에 대한 긴급 회신을 요구한 두 줄짜리 독촉 전문이다.", "points": ["9월 9일자 WX 61967에 요약된 조선 지령을 즉시(immediately) 발령할 것이 제안되었다.", "WX 61967에 대한 긴급 회신(urgent reply)을 요구한다.", "서명 없음(No Sig) — 워싱턴 마셜 발신.", "이 전문은 CINCAFPAC이 TOO 221845Z로 재암호화하여 CINCAFPAC ADV에 조치용으로 전달했다.", "같은 전문의 사본 2부(COPY NO. 7, COPY NO. 6)가 나란히 편철되어 있으며, 사본 6은 본문 첫 문장에 'now'가 더 들어 있다."], "primary": "9월 9일자 WX 61967에 요약된 조선에 관한 지령을 즉시 발령할 것이 제안되고 있음. WX 61967에 대한 귀관의 긴급 회신을 요구함.\n\n서명 없음(No Sig)\n\n[비고] 이 전문은 CINCAFPAC이 TOO 221845Z로 재암호화하여 CINCAFPAC ADV에 조치용으로 전달함.\n\n[배포] 조치 사본 — 민사행정관실(C MIL GOVT O) / 정보 사본 — 총사령관(COMMANDER-in-CHIEF), 참모장(CHIEF OF STAFF)\n\n---\n\n**[같은 전문의 다른 사본, 0164면 · COPY NO. 6]**\n\n9월 9일자 WX 61967에 요약된 조선에 관한 지령을 즉시 발령할 것이 현재 제안되고 있음. WX 61967에 대한 귀관의 긴급 회신을 요구함.\n\n서명 없음(No Sig)\n\n[배포] 정보 사본 — 총사령관(COMMANDER-in-CHIEF), 참모장(CHIEF OF STAFF)", "secondary": "[0163 — COPY NO. 7]\nIt is proposed to issue immediately directive on Korea summarized in WX 61967 of 9 September. Request your urgent reply to WX 61967.\n\nNo Sig.\n\nTOO: 221440 Z\nMCN: Y-0002 NOTE: This message re-enciphered by CINCAFPAC under TOO 221845Z and passed to CINCAFPAC ADV for action.\n\nDISTRIBUTION:\nACTION COPY TO: C MIL GOVT O INFORMATION COPIES TO: COMMANDER-in-CHIEF / CHIEF OF STAFF\n\n[0164 — COPY NO. 6]\nIt is now proposed to issue immediately directive on Korea summarized in WX 61967 of 9 September. Request your urgent reply to WX 61967.\n\nNo Sig.\n\nTOO: 221443 Z\nMCN: ZUO C 142 DISTRIBUTION:\nINFORMATION COPIES TO: COMMANDER-in-CHIEF / CHIEF OF STAFF", "notes": ["[도장·결재] 0163 우측 여백 접수 도장 — 'GHQ AGO RECORDS 23 SEP 1945', 그 옆 세로 손글씨 '014.1 Korea'(밑줄)", "[도장·결재] 0163 상하단 'TOP SECRET' 도장 · 'OPERATIONAL PRIORITY' 타자 · 좌하단 타자 '3821' · 하단 'A. G. FILE' 도장 · 'COPY NO. 7'", "[도장·결재] 0164 상단 접수 도장 — 'GHQ AGO RECORDS 23 SEP 1945', 그 옆 손글씨 '014.1 Korea'", "[도장·결재] 0164 좌하단 타자 '3744' · 하단 'A. G. FILE' 도장 · 'COPY NO. 6'", "[도장·결재] 두 면 하단 인쇄 문구 'THE MAKING OF AN EXACT COPY OF THIS MESSAGE IS FORBIDDEN'", "[도장·결재] 두 면 좌하단 연필 편철기호 '1-D'", "편철 메모 — 같은 전문의 두 부(COPY NO. 7 / COPY NO. 6). dupes.json 에는 잡히지 않았다."], "note": "번역자 주 — 0163과 0164는 같은 전문의 서로 다른 사본이나 완전히 동일하지 않다. 0164(사본 6)에는 첫 문장에 'now'가 있고(It is now proposed), TOO가 221443Z, MCN이 ZUO C 142이며 조치 사본 배포란이 없다. 0163(사본 7)은 TOO 221440Z, MCN Y-0002이고 재암호화 비고와 민사행정관실 조치 사본 배포가 붙어 있다. 두 사본의 차이를 지우지 않고 그대로 옮겼다. OCR은 0163의 전문번호를 'NEX 63270'으로 오독했으나 원본 이미지에는 'WX 68170'으로 명확하다.", "warn": false, "pages": ["0163", "0164"], "search": "마셜(George C. Marshall) — 발신 명의 맥아더(Douglas MacArthur) — 수신 명의 1-D WX 68170 - Req your reply to WX 61967; propose to issue immediately directive on Korea."}, {"id": "1-C", "order": 103, "date": "1945-09-17", "group": "B", "eyebrow": "편철 1-C · 0165–0165면", "title": "조선 내 일본인 관리의 조속한 파면 (WX 61967 참조)", "badge": "Top Secret", "list_right": "1-C", "meta": [{"k": "일자", "v": "1945-09-17"}, {"k": "발신", "v": "태평양미육군총사령관 전진지휘소(CINCAFPAC, ADV)", "txt": true}, {"k": "수신", "v": "제24군단장(CG, XXIV Corps) — 우선(PRIORITY)", "txt": true}, {"k": "참조", "v": "태평양미육군총사령부 마닐라(CINCAFPAC, MANILA) — 군정부(MIL GOVT SEC)로 전달 — 우선(PRIORITY)", "txt": true}, {"k": "전문번호", "v": "CAX 52020"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0165–0165 (1면)"}, {"k": "건명", "v": "Removal of Japanese officials in Korea as soon as possible (ref WX 61967)", "txt": true}, {"k": "색인 요지", "v": "CAX 52020 - Ref WX 61967, Removal of Jap officials in Korea as soon as possible.", "txt": true, "wide": true}], "summary": "이미 파면된 총독 아베와 총독부 국장들에 더하여, 육군부가 정치적 이유로 도지사 및 도경찰부장의 조속한 해임을 권고하며, 국무·육군·해군 3부는 이들 일본인 관리의 근무가 기술적 능력 때문에 필요하다고 보지 않는다고 통보하고, 부일협력 조선인 행정관과 그 밖의 일본인 관리도 가능한 한 신속히 파면하라고 지시한 발신 전문.", "points": ["귀관이 이미 파면한 총독 아베(Abe)와 총독부 국장들에 더하여, 육군부는 정치적 이유로 도지사 및 도경찰부장의 조속한 해임을 권고한다 — 아직 실행되지 않았다면.", "국무부·육군부·해군부는 위에 든 일본인 관리들의 근무가 기술적 능력 때문에 필요하다고 보지 않는다.", "부일협력 조선인 행정관 및 그 밖의 일본인 관리의 파면도 가능한 한 신속히 이루어져야 한다.", "지령안 WX 61967(전문에서는 'WILLIAM XRAY SIX ONE NINE SIX SEVEN'으로 철자 호출) 요약본 제2항을 참조하라.", "그 요약본 5부를 최단 시일의 항공 파발로 귀 사령부에 송부 중이다.", "발신 명의: 부관 B. M. 피치 준장, 승인 군정장관 W. E. 크리스트 준장."], "primary": "귀관이 이미 파면한 총독 아베(Abe) 및 총독부 국장들에 더하여, 육군부는 정치적 이유로 도지사(GOVERNORS OF PROVINCES) 및 도경찰부장(PROVINCIAL CHIEFS OF POLICE)을 그 직에서 조속히 해임할 것을 권고함. 아직 시행되지 않았다면 그러하다. 마침표. 국무부, 육군부 및 해군부는 위에 거명된 일본인 관리들의 근무가 기술적 능력 때문에 필요하다고는 보지 않음. 마침표. 또한 부일협력 조선인 행정관 및 그 밖의 일본인 관리의 파면도 가능한 한 신속히 이루어져야 함. 마침표. 지령안 — 반복함, 지령안 — WX 61967 요약본의 제2항을 참조할 것. 그 요약본 5부를 참고용으로 최단 시일의 항공 파발편으로 귀관에게 송부 중임.\n\nCAX 52020\n\n공식:\n[서명] B. M. 피치(B. M. FITCH)\n준장, 미육군, 부관\n\n승인:\n[서명] W. E. 크리스트(W. E. CRIST)\n준장, 미육군, 군정장관", "secondary": "TOP SECRET\nGENERAL HEADQUARTERS\nUNITED STATES ARMY FORCES PACIFIC\n\nOUTGOING MESSAGE\nWEC/HES/hac 16 SEPTEMBER 1945\n\nFROM: CINCAFPAC, ADV\nTO  : CG, XXIV CORPS .......................... PRIORITY\nINFO: CINCAFPAC, MANILA (PASS TO MIL GOVT SEC) ...... PRIORITY\n\nIN ADDITION TO GOVERNOR GENERAL ABE AND BUREAU CHIEFS OF THE GOVERNMENT GENERAL CMA WHICH YOU HAVE ALREADY REMOVED CMA WAR DEPARTMENT ADVISES FOR POLITICAL REASONS EARLIEST RELIEF FROM OFFICE OF GOVERNORS OF PROVINCES AND PROVINCIAL CHIEFS OF POLICE CMA IF NOT ALREADY ACCOMPLISHED PD THE STATE CMA WAR AND NAVY DEPARTMENTS DO NOT BELIEVE THE SERVICES OF JAPANESE OFFICIALS NAMED ABOVE ARE NECESSARY BECAUSE OF TECHNICAL ABILITIES PD ALSO REMOVAL OF COLLABORATIONIST KOREAN ADMINISTRATORS AND OTHER JAPANESE OFFICIALS SHOULD BE ACCOMPLISHED AS RAPIDLY AS POSSIBLE PD REFERENCE IS MADE TO PROPOSED RPT PROPOSED DIRECTIVE WILLIAM XRAY SIX ONE NINE SIX SEVEN CMA PARAGRAPH TWO OF SUMMARY CMA FIVE COPIES OF WHICH ARE BEING FURNISHED YOU BY EARLIEST AIR COURIER FOR YOUR INFORMATION\n\nCAX 52020\n\nOFFICIAL:\n[signed] BEG B. M. FITCH, Brigadier General, U. S. Army, Adjutant General.\n\nApproved by:\n[signed] WEC W. E. CRIST, Brigadier General, U. S. Army, Chief Military Government Officer.\n\nTOP SECRET", "notes": ["[도장·결재] 고무인(우상단, 세로): 「GHQ / AGO RECORDS / 19 SEP 1945」, 옆에 손글씨 '014.1 Korea'", "[도장·결재] 손글씨(도장 아래): '170625 Z' — 발신 시각(TOO)을 손으로 적어 넣음", "[도장·결재] 손글씨(본문 말미): 'CAX 52020' — 전문 일련번호를 손으로 기입", "[도장·결재] 손글씨 서명: 'BEG'(부관 피치 대리 서명), 'WEC'(승인, 크리스트)", "[도장·결재] 손글씨(하단): 'Copies furnished MG C/S' — 군정부·참모장에 사본 교부", "[도장·결재] 손글씨(우하단): 'AG FILE'", "[도장·결재] 하단 중앙 'TOP SECRET' 고무인(상단에도 겹쳐 찍힘)", "[도장·결재] 좌하단 연필 정리기호: '1-C'(원본에서는 '/-C'처럼 보임)", "[도장·결재] 상단 여백(마이크로필름 촬영 시 삽입): 'Declassified E.O. 12065 Section 3/402/ NNDG NO. 775091'"], "note": "번역자 주 — **같은 배치의 `1-H`(0154~0155면, JCS 1483/6 「특정 일본인 관리의 즉시 파면」)와 짝을 이루는 실제 하달 전문이다.** 이미 번역해 둔 `../FRUS_1945_Korea`의 d777(SWNCC 권고 각서)에서 시작된 계통이 여기서 제24군단에 도달한다.\n\n**날짜에 불일치가 있다.** 본문에는 '16 SEPTEMBER 1945'로 타자되어 있으나, 손으로 적힌 발신 시각은 170625 Z이고 부관부 접수 도장은 19 SEP 1945다. 색인과 `raw/documents.json`은 17일로 잡는다. 숫자는 고치지 않고 읽은 그대로 두었으며, 타자 날짜(16일)는 기안일, 170625 Z가 실제 발신 시각으로 보인다.\n\n전문 부호는 그대로 두고 번역에서 풀어 옮겼다 — 'CMA' = comma(쉼표), 'PD' = period(마침표), 'RPT' = repeat(반복). 'WILLIAM XRAY SIX ONE NINE SIX SEVEN'은 음성 알파벳으로 철자한 'WX 61967'이다.\n\n원문 전체가 대문자 전신문이고 타자가 흐려 OCR 오독이 많았으나, 원본 스캔에서 전 행 판독했다.\n\n좌상단 발신 참조 'WEC/HES/hac'는 기안·타자자 이니셜이다.\n\n'GOVERNMENT GENERAL'은 조선총독부, 'GOVERNORS OF PROVINCES'는 도지사, 'PROVINCIAL CHIEFS OF POLICE'는 도경찰부장으로 옮겼다.", "warn": false, "pages": ["0165"], "search": "아베(阿部信行, Nobuyuki Abe) — 조선총독. 전문에는 'GOVERNOR GENERAL ABE'로만 표기 피치(Burdette M. Fitch) — 준장, 태평양미육군 부관 크리스트(William E. Crist) — 준장, 군정장관 1-C CAX 52020 - Ref WX 61967, Removal of Jap officials in Korea as soon as possible."}, {"id": "1-B", "order": 102, "date": "1945-09-14", "group": "B", "eyebrow": "편철 1-B · 0166–0166면", "title": "조선 내 일본인 관리의 파면", "badge": "Top Secret", "list_right": "1-B", "meta": [{"k": "일자", "v": "1945-09-14"}, {"k": "발신", "v": "워싱턴(합동참모본부) — WASHINGTON (THE JOINT CHIEFS OF STAFF)", "txt": true}, {"k": "수신", "v": "태평양미육군총사령부(GHQ AFPAC, 맥아더)", "txt": true}, {"k": "참조", "v": "총사령관(COMMANDER-in-CHIEF) · 참모장(CHIEF OF STAFF). 처리용 사본은 민정관(C MIL GOVT)에게", "txt": true}, {"k": "전문번호", "v": "W 64366"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0166–0166 (1면)"}, {"k": "건명", "v": "Removal of Japanese officials in Korea", "txt": true}, {"k": "색인 요지", "v": "W 64366 - Removal of Jap officials in Korea.", "txt": true, "wide": true}], "summary": "주한 미군사령관이 조선총독과 일본인 관리들을 잠정 유임시키기로 했다는 보도로 여론이 악화되자, 합동참모본부가 아베 총독·총독부 각 국장·도지사·도경찰부장을 즉시 파면하고 그 밖의 일본인 및 부일협력 조선인 행정관도 가급적 빨리 파면하라고 지시한 전문이다.", "points": ["미국 내에서 '주한 미군사령관이 일본인 총독과 관리들을 잠정 유임시키기로 했다'는 보도가 나와 여론이 나빠졌다.", "보도가 사실이라면, 국무·육군·해군 3부는 아래 열거한 일본인 관리들의 근무가 기술적 자격 때문에 불가결하다고 보지 않는다.", "지령안 요약(WX 61987) 제2항을 참조하라고 지시했다.", "'정치적 이유로' 즉시 파면함이 상당하다 — 아베(ABE) 총독, 총독부 각 국장(Chiefs of all Bureaus), 도지사(Provincial Governors), 도경찰부장(Provincial Police Chiefs).", "나아가 그 밖의 일본인 및 부일협력 조선인 행정관의 파면도 가급적 신속히 진행해야 한다.", "서명 없음(No Sig).", "총사령부 주기: 이 전문은 태평양미육군총사령관이 TOO 150545 Z 로 재암호화하여 연합국최고사령관(SCAP)에게 처리하도록 넘겼다."], "primary": "최근 주한 미군사령관이 일본인 조선총독과 그 밖의 조선 내 일본인 관리들을 잠정적으로 유임시키기로 결정하였다는 보도로 인하여 불리한 여론이 일어났음. 그 보도가 사실이라면, 국무·육군·해군 3부는 아래에 열거하는 일본인 관리들의 근무가 기술적 자격을 이유로 불가결하다고는 보지 아니함. 지령안 요약 WX 61987 제2항을 참조할 것. 정치적 이유에서 귀관은 다음 자들을 즉시 그 직에서 파면함이 상당함. 아베(ABE) 총독, 총독부 각 국장, 도지사 및 도경찰부장. 귀관은 나아가 그 밖의 일본인 및 부일협력 조선인 행정관의 파면을 가급적 신속히 진행하여야 함.\n\n서명 없음\n\n주기: 본 전문은 태평양미육군총사령관이 TOO 150545 Z 로 재암호화하여 처리를 위해 연합국최고사령관에게 넘겼음.", "secondary": "GENERAL HEADQUARTERS, U.S. ARMY FORCES, PACIFIC\nADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\n\nINCOMING MESSAGE\n\nTOP SECRET\n\nTOP SECRET\nPRIORITY\n15 SEPTEMBER 1945\n\nTO : GHQ AFPAC (MACARTHUR)\nFROM : WASHINGTON (THE JOINT CHIEFS OF STAFF)\nNR : W 64366 Unfavorable publicity has resulted from recent report that the US Commander in Korea has decided temporarily to retain in Office the Japanese Governor General and other Japanese Officials in Korea. If report is correct State War Navy do not believe that the services of the Japanese Officials named below are essential by reason of technical qualifications. Refer to paragraph 2 of summary of proposed directive WX 61987. For political reasons it is advisable that you should remove from office immediately: Governor-General ABE Chiefs of all Bureaus of the Government-General Provincial Governors and Provincial Police Chiefs. You should furthermore proceed as rapidly as possible with the removal of other Japanese and Collabarationist Korean Administrators.\n\nNo Sig\n\nTOO: 142112 Z\nMCN: Y 89 NOTE: This message re-enciphered by CINCAFPAC under TOO 150545 Z and passed to SCAP for Action.\n\nDISTRIBUTION:\nACTION COPY TO:\nC MIL GOVT\nINFORMATION COPIES TO:\nCOMMANDER-in-CHIEF\nCHIEF OF STAFF\n\n2316\n\nPRIORITY\nTOP SECRET\n\nCOPY NO. 6\nA. G. FILE\n\nTHE MAKING OF AN EXACT COPY OF THIS MESSAGE IS FORBIDDEN\n\nAFPAC AGO Form No. 108 1259--QM Printing Plant--7-17-45--210M", "notes": ["[도장·결재] 우측 상단 고무인(세로): 'GHQ AGO RECORDS 16 SEP 1945' — 총사령부 부관부 기록과 접수 도장. 옆에 손글씨 '014.1 Korea'", "[도장·결재] 'TOP SECRET' 고무인 상·하 각 1회, 그 밖에 인쇄된 'TOP SECRET' 다수", "[도장·결재] 우측 하단 인쇄·기입: 'COPY NO. 6'", "[도장·결재] 우측 하단 대형 고무인: 'A. G. FILE'", "[도장·결재] 면 하단 좌측 연필: '1-B' (편철기호)", "[도장·결재] 좌측 하단 인쇄: 'AFPAC AGO Form No. 108'", "[도장·결재] 본문 좌측 여백에 짧은 연필 사선 표시 1개", "[도장·결재] 하단 좌측 타자 숫자 '2316'(전신 정리번호로 추정)", "편철 메모 — 면에 찍힌 날짜는 15 SEPTEMBER 1945(접수 16 Sep), 발신 TOO 는 14 Sep 45."], "note": "번역자 주 — 원문의 오타 'Collabarationist'(=Collaborationist)는 고치지 않고 그대로 두었다. 전문 용지에 타자된 날짜 '15 SEPTEMBER 1945'는 총사령부 처리일이고, 발신 시각(TOO) 142112 Z 는 9월 14일이다. 색인·문서 배정은 발신일 기준 1945-09-14 를 취하였다. 참조 전문번호 'WX 61987'은 읽은 그대로 두었다. 전문 본문에는 마침표가 거의 없고 문장이 이어져 있어, 한국어에서는 원문의 문장 구분을 그대로 따랐다. 이 지시는 SWNCC 가 같은 취지를 권고한 각서(FRUS 1945 d777)의 실제 지휘계통 발령분에 해당한다.", "warn": false, "pages": ["0166"], "search": "맥아더(MACARTHUR) — 태평양미육군총사령관 아베(ABE) — 아베 노부유키, 조선총독 1-B W 64366 - Removal of Jap officials in Korea."}, {"id": "1-A", "order": 101, "date": "1945-09-13", "group": "B", "eyebrow": "편철 1-A · 0167–0167면", "title": "W 59252 및 WX 61967 관련 — 전반적 내용에 동의함", "badge": "Top Secret", "list_right": "1-A", "meta": [{"k": "일자", "v": "1945-09-13"}, {"k": "발신", "v": "태평양미육군총사령관 전진제대(CINCAFPAC ADV)", "txt": true}, {"k": "수신", "v": "육군참모총장(WARCOS)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "C.A 51904"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0167–0167 (1면)"}, {"k": "건명", "v": "Ref W 59252 & WX 61967 — general content concurred in", "txt": true}, {"k": "색인 요지", "v": "CA 51904 - Gen'l content concurred in, tho believed pref to issue proposed directives. (Ref W 59252 & WX 61967).", "txt": true, "wide": true}], "summary": "육군부가 보낸 두 지령안(W 59252, WX 61967)을 이 사령부에 대한 구체적 명령이 아니라 정책 지침으로서의 일반 지령으로 발령하는 편이 낫겠다는 의견을 붙이되, 그 전반적 내용에는 동의한다고 회신한 전문이다.", "points": ["회신 대상은 W 59252(일본 민사행정 계열)와 WX 61967(조선 민사행정 지령안) 두 건이다.", "두 지령안을 '이 사령부에 대한 구체적 명령'이 아니라 '정책 지침을 위한 일반 지령'으로 발령하는 편이 바람직하다고 본다.", "다만 전반적 내용(general content)에는 동의한다.", "발신 4일 만에 나온 1차 회신으로, 이후 1-D(9월 22일)의 독촉으로 이어진다."], "primary": "귀 전문 윌리엄 오 구 이 오 이(W 59252) 및 윌리엄 엑스레이 육 일 구 육 칠(WX 61967)에 담긴 지령안을 이 사령부에 대한 구체적 명령이 아니라 정책 지침을 위한 일반 지령으로서 발령하는 편이 바람직하리라고 사료되나, ( C.A 51904 ) 전반적 내용에는 동의함.\n\n인증(OFFICIAL):\n해럴드 페어(HAROLD FAIR), 중령, 부관부(AGD), 부관보(Asst Adj Gen)\n\n[배포] CINC(총사령관) / C/S(참모장) / DC/S(참모차장) — 전령 편(Via Courier)\n[참조] W-59252 및 WX-61967", "secondary": "ALTHOUGH IT IS BELIEVED IT WOULD BE PREFERABLE TO ISSUE THE PROPOSED DIRECTIVES CONTAINED IN YOUR WILLIAM FIVE NINE TWO FIVE TWO AND WILLIAM XRAY SIX ONE NINE SIX SEVEN AS GENERAL DIRECTIVES FOR THE POLICY GUIDANCE OF THIS HEADQUARTERS RATHER THAN AS SPECIFIC ORDERS CMA ( C.A 51904 ) THE GENERAL CONTENT IS CONCURRED IN\n\nOFFICIAL:\nHAROLD FAIR\nLt Col, AGD, Asst Adj Gen.\n\nDISTRIBUTION:\nCINC\nC/S\nDC/S - Via Courier\n\nW-59252 & WX-61967", "notes": ["[도장·결재] 좌상단 도장 'COPY' · 상단 'TOP SECRET' 도장 · 하단 'TOP SECRET' 도장과 'COPY' 도장", "[도장·결재] 우측 여백 접수 도장 — 'GHQ AGO RECORDS 14 SEP 1945', 그 옆 손글씨 '014.1 Korea'", "[도장·결재] 본문 위 손글씨 편철기호 — '384.1 TS' 및 '014.1 Korea'(밑줄)", "[도장·결재] 우측 중단 손글씨 — 'COPY FILED 384.1'", "[도장·결재] 타자 표시 'PRIORITY  XXX' · 'XXX' · 'CS  RKS/fh'", "[도장·결재] 좌하단 연필 편철기호 '1-A'(면에는 '/-A'로 보인다)"], "note": "번역자 주 — 본문이 음성 문자(WILLIAM=W, XRAY=X)로 전문번호를 풀어 쓴 평문 전보다. 한국어에서는 뜻이 통하도록 숫자를 병기했다. 'CMA'는 전신 부호로 쉼표를 뜻한다. 이 면은 원본이 아니라 사본(COPY)이다.", "warn": false, "pages": ["0167"], "search": "해럴드 페어(Harold Fair) — 중령, 부관보 1-A CA 51904 - Gen'l content concurred in, tho believed pref to issue proposed directives. (Ref W 59252 & WX 61967)."}, {"id": "1", "order": 100, "date": "1945-09-09", "group": "B", "eyebrow": "편철 1 · 0168–0171면", "title": "조선의 미국 점령지역 민사행정을 위한 지령안", "badge": "Top Secret", "list_right": "1", "meta": [{"k": "일자", "v": "1945-09-09"}, {"k": "발신", "v": "워싱턴(WASHINGTON) — 서명 WARCOS(육군참모총장)", "txt": true}, {"k": "수신", "v": "태평양미육군총사령관(CINCAFPAC) 및 태평양미육군총사령관 전진제대(CINCAFPAC ADV ECH)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "WX 61967"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0168–0171 (4면)"}, {"k": "건명", "v": "Proposed directive for administration of Civil Affairs in United States-Occupied portions of Korea", "txt": true}, {"k": "색인 요지", "v": "WX 61967 - Proposed directive for admin of Civil Affairs in US occupied portions of Korea.", "txt": true, "wide": true}], "summary": "부처 합동 위원회가 작성해 합동참모본부가 심의 중인 조선 미국 점령지역 민사행정 지령안의 요지를 통보하고, 정책의 초기 지침으로 삼는 동시에 현지 사령부의 의견을 요구한 전문이다.", "points": ["지령안은 부처 합동 위원회(interdepartmental committee)가 작성했고 합동참모본부가 심의 중이다. 이 전문은 그 요약이며, 초기 지침 제공과 의견 청취를 동시에 노린다.", "국무부는 아직 조선의 세부 사항에 관해 소련(또는 다른 나라)과 어떤 조정도 하지 않았다. 따라서 조선 전역의 정상적 경제·정치 관계 회복은 군 수준의 대(對)러시아 연락에 의존할 수밖에 없다.", "국무부의 현재 구상: 2개 지대(zone)의 초기 기간 → 미·소·중·영 4개국 공동관리 아래의 중앙집권적 행정 → 다시 같은 4개국의 국제신탁통치(International Trusteeship).", "점령의 목적 4가지 — 일본군 항복 이행 보장, 조선을 일본의 사회·경제·재정 지배로부터 완전 분리, 건전한 조선 경제 발전 촉진, 자유·독립·책임 있는 조선의 회복으로 이어질 지방 자치정부 수립 육성.", "기존 정부의 지방·지역·중앙 기구를 최대한 활용하되, 일본인과 일본 국가주의·침략의 옹호자였던 조선인은 최대한 신속히 공직·주요 사기업의 책임·영향력 있는 자리에서 배제한다. 다만 대체할 유자격자가 없으면 기술 자격을 이유로 잠정 유임할 수 있다.", "법과 질서의 회복·유지, 정부 기록의 파괴 방지, 조선의 실체법·절차법 존속(점령 목적을 위태롭게 하는 법령, 특히 인종·국적·신조·정치를 이유로 자유를 제약하는 법령은 폐지), 민·형사 법원 존속, 폐지 법령만으로 구금된 자의 석방.", "일본의 초국가주의 단체·비밀 애국단체와 그 계열 조직을 전부 해산한다.", "장교와 병사는 조선인을 대함에 있어 미국과 국제연합에 대한 신뢰가 생기도록 하여야 한다.", "미국 및 다른 국제연합 정부의 민간 기관 대표는 사령관의 승인 없이 조선에서 활동할 수 없다.", "무장해제·복원, 전범 용의자 및 비일본 외국인과 그 재산의 처리는 일본 본토와 동일하게 한다.", "일본의 군국주의·국가주의 이데올로기와 선전을 제거하고, 통신·보도매체에 대해서는 보안과 점령 목적 달성에 필요한 최소한의 통제·검열만 행하며, 민주적 정치 활동과 노동·산업·농업의 민주적 조직을 장려하고, 신앙의 자유를 즉시 선포한다.", "학교는 가능한 한 빨리 존속·재개하고 부적격 교사를 조선인 후임으로 교체하며, 역사적·문화적·종교적 물건을 최대한 보존한다.", "경제: 식량·연료 등 필수재 생산 극대화, 배급 기구 유지·수립, 어업 재가동, 군수 생산 중지와 일본 대기업 재산 보전, 조선의 세계 무역 참가 장려(단 국제 카르텔 참가는 저지).", "수입 책임은 최소화한다. 미국은 병력과 점령 목적을 위태롭게 할 질병·소요를 막는 데 필요한 필수 품목만 책임지며, 그 이상은 합동참모본부에 건의하여야 한다.", "금융: 전쟁 자금 조달·식민지 금융 지배가 주목적이었던 일본계 은행 지점 폐쇄, 증권·부동산 거래 규제, 모라토리엄, 증권거래소·보험회사 폐쇄, 금지 단체 관련 연금 지급 금지, 금·은·백금·통화·유가증권 및 일본 관공서·금지 단체 자산의 동결·압류, 외국환 거래 전면 통제와 대일 신용 공여 금지."], "primary": "부처 합동 위원회가 작성한 지령안 PCT, 즉 조선의 미국 점령지역 민사행정을 위한 지령안이 현재 합동참모본부에서 심의 중이다. 이 전문에는 그 지령안의 요약이 담겨 있으며, 이는 심의 중인 정책에 관한 초기 지침을 제공하는 동시에 귀관의 의견을 얻으려는 목적에서다.\n\n국무부는 아직 조선에 관한 세부 사항에 대해 소련(또는 다른 나라들)과 어떠한 조정도 하지 않았으므로, 조선 전역에 걸친 정상적 경제·정치 관계의 재수립과 유지는 귀관이 군 수준에서 러시아 측과 기대할 수 있는 연락에 의존할 수밖에 없을 것이다. 국무부의 현재 생각은, 2개 지대를 두는 초기 기간에 뒤이어 실행 가능한 한 조속히 미·소·중·영 4개국 공동관리 아래의 중앙집권적 행정(Centralized Administration)이 이어져야 한다는 것이다. 그리고 그 다음에는 같은 4개국의 국제신탁통치(International Trusteeship)가 이어질 수 있다.\n\n아래에 요약한 지령은 여러 경우 장기적인 목표를 포함하고 있다. 다음 요약에 대한 귀관의 상세한 의견을 요구한다.\n\n**(A) 일반 및 정치**\n\n1. 점령의 목적은 다음과 같다.\n   (a) 조선에 있는 일본군(Jap Forces)의 항복 이행을 보장하는 것.\n   (b) 조선을 일본의 사회적·경제적·재정적 지배로부터 정치적·행정적으로 완전히 분리시키는 것.\n   (c) 건전한 조선 경제의 발전을 촉진하는 것. 그리고\n   (d) 자유롭고 독립되고 책임 있는 조선의 회복으로 이어지는 지방 자치정부의 수립을 육성하는 것.\n\n2. 귀관은 기존 정부의 지방·지역·중앙 기구를 최대한 활용하되, 점령 목적과 배치되는 기구는 제거할 것. 실행 가능한 한 신속히 모든 일본인, 그리고 일본 국가주의와 침략의 옹호자였거나 점령의 목표에 적의를 나타내는 모든 조선인은 공적 기업 또는 중요한 사적 기업에서 책임 있는 자리나 영향력 있는 자리로부터 배제될 것이다. 이들을 대체할 유자격 조선인이나 그 밖의 적합한 인원이 없는 경우에는, 기술적 자격 때문에 필수적이라고 인정되는 일본인 또는 친일 조선인(pro-Jap Koreans)을 보안상의 요소가 허락하는 한 책임 있는 자리에 잠정적으로 유임시켜도 좋다. 귀관은 필
