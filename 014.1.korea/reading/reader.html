"애치슨(Atcheson) 씨가 이 전문과 참조 전문들을 보았고 대체로 동의하고 있다."], "primary": "이 전문에 관해서는 이 주제에 대한 상세한 소견이 들어 있는 우리의 CA 52562 및 CA 52563을 보라. 귀 WX 71814 관련.\n\n국제 신탁통치가 수립되기 전 과도기 동안 하지(Hodge) 장군이 조선 주둔 소련군 사령관과 어떤 포괄적인 군사협력 계획을 만들어낼 실질적 가망은 거의 없다고 나는 예상한다. (CA 52748) 근본적 어려움은 편의의 문제가 아니라 근본 원칙의 문제다. 소련은 조선 전역에 공산주의를 수립하는 데 자기의 온 힘과 영향력을 던지기로 작정하고 있다. 소련이 그곳에서 움직이는 것은 일본 본토에서 그 행동을 규정하는 것과 정확히 똑같은 목적에서다(나의 CA 52443을 보라). 소련은 민주주의의 개념에 전적으로 반대하며, 이 이념의 충돌은 전선의 현지 군사령관들이 조정할 수 있는 것이 아니다. 현지 소련군 사령관에게 사실상 아무런 결정의 자유도 주어져 있지 않다는 것은 매우 명백하며, 그 결과 가능한 최대한의 행동의 자유를 부여받은 하지 장군은 완전히 발이 묶여 있다. 하지 장군은 온갖 노력과 접근을 다했으나, 소련 측의 협력과 조정에 관한 한 그의 노력은 성과가 없었다.\n\n이 문제는 소련 연락장교 데레뱐코(Derevyanko) 장군과 논의되었고, 소련 현지 사령관이 하지 장군과 협력하도록 권한을 부여하고 지시하는 조치를 모스크바에서 확보하도록 그에게 촉구했다. 이는 특히 조선 철도용 석탄 문제와 관련하여 강하게 압박한 것이다. 데레뱐코 장군은 모스크바로부터의 즉각적인 회답을 약속했으나 회답은 오지 않았다. 그는 1일에 모스크바로 떠났다.\n\n현지 수준에서 행동과 통제의 어느 정도 통일성을 확립하기 위해 온갖 노력을 기울일 것이나, 나는 이 문제 전체를 최고의 국제적 수준에서 지체 없이 처리할 것을 건의한다. 애치슨(Atcheson) 씨가 이 전문과 참조 전문들을 보았으며 대체로 동의하고 있다.\n\n인증(OFFICIAL): 해럴드 페어(HAROLD FAIR), 중령, 부관부(AGD), 부관보", "secondary": "041107  CS  RKS/fh  4 OCTOBER 1945\n\nRELATIVE TO THIS RADIO SEE OUR CHARLIE ABLE FIVE TWO FIVE SIX TWO AND CHARLIE ABLE FIVE TWO FIVE SIX THREE WHICH CONTAIN DETAILED COMMENTS ON THIS SUBJECT PD YOUR WILLIAM XRAY SEVEN ONE EIGHT ONE FOUR PD ITEM ANTICIPATE VERY LITTLE REAL PROSPECT THAT GENERAL HODGE WILL BE ABLE TO EVOLVE ANY COMPREHENSIVE MILITARY COOPERATION PLAN WITH THE RUSSIAN COMMANDER IN KOREA DURING THE TRANSITION PERIOD BEFORE THE ESTABLISHMENT OF THE INTERNATIONAL TRUSTEESHIP PD ( CA 52748 ) THE BASIC DIFFICULTY IS NOT ABLE QUESTION OF EXPEDIENT BUT OF FUNDAMENTAL PRINCIPLE PD RUSSIA IS DETERMINED TO THROW HER FULL POWER AND INFLUENCE UPON THE ESTABLISHMENT OF COMMUNISM THROUGHOUT KOREA PD SHE IS ANIMATED THERE BY EXACTLY THE SAME PURPOSE THAT DICTATES HER ACTIONS IN JAPAN PROPER PAREN SEE MY CHARLIE ABLE FIVE TWO FOUR FOUR THREE PAREN PD SHE IS UTTERLY OPPOSED TO THE DEMOCRATIC CONCEPT AND THIS CLASH IN IDEOLOGY CANNOT BE COMPOSED BY LOCAL MILITARY COMMANDERS IN THE FIELD PD IT IS VERY EVIDENT THAT THE LOCAL RUSSIAN COMMANDER HAS BEEN GIVEN PRACTICALLY NO LIBERTY OF DECISION AND AS ABLE CONSEQUENCE GENERAL HODGE CMA WHO HAS BEEN GIVEN THE MAXIMUM POSSIBLE FREEDOM OF ACTION CMA IS COMPLETELY HANDICAPPED PD GENERAL HODGE HAS MADE EVERY EFFORT AND ADVANCE BUT HIS EFFORTS HAVE BEEN UNPRODUCTIVE INSOFAR AS RUSSIAN COOPERATION AND COORDINATION ARE CONCERNED PD THE MATTER WAS DISCUSSED WITH THE RUSSIAN LIAISON OFFICER CMA GENERAL DEREVYANKO CMA WHO WAS URGED TO SECURE ACTION IN MOSCOW THAT WOULD AUTHORIZE AND DIRECT THE RUSSIAN FIELD COMMANDER TO COOPERATE WITH GENERAL HODGE PD THIS WAS PRESSED PARTICULARLY REGARDING THE MATTER OF COAL FOR THE KOREAN RAILROADS PD GENERAL DEREVYANKO PROMISED AN IMMEDIATE REPLY FROM MOSCOW BUT IT WAS NOT FORTHCOMING PD HE DEPARTED ON THE FIRST FOR MOSCOW PD EVERY EFFORT WILL BE MADE ON THE FIELD LEVEL TO ESTABLISH SOME UNIFORMITY OF ACTION AND CONTROL BUT ITEM RECOMMEND THAT THIS WHOLE QUESTION BE HANDLED WITHOUT DELAY ON THE HIGHEST INTERNATIONAL LEVEL PD MISTER ATCHESON HAS SEEN THIS AND THE REFERENCE DISPATCHES AND IS IN GENERAL CONCURRENCE\n\nOFFICIAL:  HAROLD FAIR, Lt Col, AGD, Asst Adj Gen Copy to: C/S (2)", "notes": ["[도장·결재] 접수 도장(0061): GHQ AGO RECORDS 7 OCT 1945", "[도장·결재] 도장 옆 손글씨: '014.1 Korea TS'", "[도장·결재] 손글씨 이니셜: 'RK'(사선과 함께)", "[도장·결재] 발신 전문번호 고무인: 'CA 52748'", "[도장·결재] 도장/손글씨: 'AG FILE'", "[도장·결재] 하단 좌측 손글씨: 'Copy furnished Mil Govt Sect 5 Oct 1945 per C/S.' — 서명 'R.E.M.' (군정부에 사본 교부, 참모장 지시에 따름)", "[도장·결재] 하단 좌측 고무인: 'RK 71814'(WX 71814 참조번호로 읽힘)", "[도장·결재] 2면(0062) 손글씨: 'Initialed by C/S'(참모장 결재)", "[도장·결재] 2면 'Copy to: C/S (2)' 옆 손글씨 체크 표시", "[도장·결재] 2면 손글씨: 'Copy furnished Mil Govt Sect 5 Oct 1945 per C/S.  R.E.M.'", "[도장·결재] 2면 인증란 손글씨 이니셜: 'JPL'", "[도장·결재] 각 면 상단: 'Declassified E.O. 12065 Section 3/402/ NNDG NO. [판독불가]' (해제 표시)", "[도장·결재] 각 면 하단 연필 일련번호: 4-E"], "note": "번역자 주 — 1) 이 전문은 평문 전신 방식으로 타자되어 있어 문장부호와 낱자가 낱말로 풀어 적혀 있다. PD=마침표, CMA=쉼표, PAREN=괄호, ABLE=a/A, ITEM=I, CHARLIE ABLE=CA, WILLIAM XRAY=WX. 영문(en)은 원본의 이 표기를 그대로 두었고 한국어 번역에서만 의미를 풀었다. 2) 참조 전문번호는 원문의 철자 표기를 숫자로 옮기면 CA 52562, CA 52563, CA 52443, WX 71814 다. 원본 여백에 손으로 '52443'의 'TWO'가 행 위에 삽입 정정돼 있다. 숫자열은 바로잡지 않고 읽은 그대로 두었다. 3) 'MISTER ATCHESON' 은 맥아더의 정치고문 George Atcheson, Jr. 로 읽힌다. 4) 원본 하단의 'RK 71814' 고무인은 'WX 71814'와 같은 번호로 보이나 앞 두 글자 판독이 확실치 않아 읽은 대로 두었다. 5) 문서철 대응: 이 전문의 참조 CA 52563 은 같은 문서철의 4-D 다.", "warn": false, "pages": ["0061", "0062"], "search": "하지(John R. Hodge — 원문 'GENERAL HODGE') 데레뱐코(Kuzma Derevyanko — 원문 'GENERAL DEREVYANKO') 애치슨(George Atcheson, Jr. — 원문 'MISTER ATCHESON') 해럴드 페어(Harold Fair — 원문 'HAROLD FAIR, Lt Col, AGD') 4-E CA 52748-Prospects of Military cooperation plan with Russians."}, {"id": "4-D", "order": 404, "date": "1945-10-01", "group": "B", "eyebrow": "편철 4-D · 0063–0064면", "title": "일본에 대한 태도와 조선의 독립 — 하지 장군 서한 요약", "badge": "Top Secret", "list_right": "4-D", "meta": [{"k": "일자", "v": "1945-10-01"}, {"k": "발신", "v": "태평양미육군총사령관 전방지휘소(CINCAFPAC ADV)", "txt": true}, {"k": "수신", "v": "육군참모총장(WARCOS)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "CA 52563"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0063–0064 (2면)"}, {"k": "건명", "v": "Summary of a letter just received from General Hodge — attitude toward the Japs, independence, division of Korea, Russian activity, military government, correspondents", "txt": true}, {"k": "색인 요지", "v": "CA 52563-Re attitude toward Japan and Independence in Korea.", "txt": true, "wide": true}], "summary": "맥아더 사령부가 하지에게서 방금 받은 서한을 5개 항으로 요약해 육군부에 타전한 것으로, 조선인의 일본인에 대한 태도와 독립에 대한 태도에 변화가 없고 연합국의 의도에 대한 뿌리 깊은 불신이 자라고 있으며, 38도선 분단이 조선을 하나의 국가로 통합하는 데 넘을 수 없는 장애가 되고 있고, 소련과의 협력 노력은 거의 성과가 없으며, 군정은 사소한 기능을 빼면 전면적이어야 할 것이라고 보고한다.", "points": ["제1항 총론 — 조선인의 'Japs'에 대한 태도에도, 독립에 대한 태도에도 변화가 없다.", "경성(Keijo) 지역의 조선인들은 표면상 안정되기 시작했다. 행렬과 시위가 줄고 목소리 높인 항의도 줄었다.", "그러나 연합국의 의도에 대한 뿌리 깊은 불신이 자라고 있고, 정책이 크게 다른 두 군대가 점령하는 두 점령지대로 38도선을 따라 조선이 분할된 데 대한 실질적 불만이 있다.", "지각 있는 조선인 다수는 이미 연합국이 조선이라는 국가를 세워 줄 의사가 없다는 결론에 이르렀다. 지금까지의 정책에 비추어 연합국의 조선 독립 약속이 진실하다고 믿게 할 근거가 거의 없다.", "많은 조선인이 이제 무수한 정당들의 제각각인 활동이 바람직하지 않다는 것을 깨닫는 듯하나, 실제로 그 수가 줄지는 않았고 다만 목소리를 내는 정도가 잦아들었을 뿐이다.", "파벌 간의 실무적 합의를 얻어내는 것도, 서로에 대한 교차하는 흐름과 의심을 털어내는 것도 불가능하다.", "제2항 조선의 분할 — 정책이 크게 다른 두 점령지대로의 분할이 조선을 하나의 국가로 통합하는 데 넘을 수 없는 장애를 이루고 있음이 갈수록 분명해진다. 전면적인 임시정부를 세우는 즉각적 조치가 나오지 않는 한 그렇다.", "미국의 체면을 지키면서 이 상황을 평화적으로 바로잡는 것은 극히 어려워 보인다.", "이 나라는 사람들을 일본인에게서 풀어 주는 것이면 무엇에든 받아들일 준비가 되어 있으나, 과거의 역사 때문에 지금은 어떤 형태의 민주적 정부에, 특히 미국에 가장 호의적이다.", "나아가 조선의 두 지역 어느 쪽도 완전한 상호 교류 없이는 조금도 자립할 수 없다. 현재로서는 38도선 이북에서 상당한 수의 피난민이 남으로 내려오는 것을 빼면 상호 교류가 없고, 그 반대는 사실이 아니다.", "제3항 소련의 동향 — 소련과 군사적 수준에서 어떤 실행 가능한 합의를 이루려는 노력이 계속되고 있으나 지금까지 거의 성과가 없다.", "현재까지의 유일한 성과는 함흥(Kanko) 포로수용소 수용자들을 빼낸 것으로, 교섭 시작 후 약 열흘이 지나서야, 그리고 조치 방식을 두고 많은 갈팡질팡 끝에 이루어졌다.", "38도선의 접촉 부대 관계는 소련군이 경성 이북 어느 지역의 전력을 끊은 것 말고는 9월 13일 이후 특별한 사건 없이 유지되어 왔다.", "제4항 군정 — 조선의 군정은 사소한 기능을 제외하면 전면적이어야 할 것으로 보인다. 믿을 수 없는 규모의 독직과 부패 행위가 드러나고 있고, 일본인 관리들은 빠르게 제거되고 있다.", "'조선인들은 대부분 신뢰할 수 없거나 사소한 자리 이외의 어떤 직위도 채울 능력이 없다.'", "제5항 특파원 — 종군 기자들의 태도는 눈에 띄게 개선되었다. 남아 있는 자들은 미국 시민으로서의 책임을 더 의식하고 있으나, 아직도 보도되면 이곳의 미국 임무를 위태롭게 할 수 있는 소련 관련 기사를 송고하는 경향이 남아 있다."], "primary": "하지(Hodge) 장군에게서 방금 받은 서한의 요약이 다음과 같다. (CA 52563)\n\n제1항 총론. 조선인들의 Japs 에 대한 태도에도, 독립에 대한 태도에도 아무런 변화가 없다. 경성(Keijo) 지역에서 조선인들은 표면상으로는 가라앉기 시작하고 있다. 행렬과 시위가 줄고, 목소리 높인 항의도 줄었다. 연합국의 의도에 대한 뿌리 깊은 불신이 자라나고 있고, 정책이 크게 다른 군대들이 점령하는 두 개의 점령지대로 38도선을 따라 조선을 분할한 데 대한 실질적인 불만이 있다. 지각 있는 조선인 다수는 연합국이 조선이라는 국가를 세워 줄 의사가 없다는 결론에 이미 도달했다. 지금까지의 정책에 비추어 볼 때, 조선의 독립에 관한 연합국의 약속이 진실하다고 그들이 믿게 할 만한 것이 거의 없다. 많은 조선인이 이제는 무수한 정당들의 제각각인 활동이 바람직하지 않다는 것을 깨닫는 것으로 보인다. 그러나 현재까지 이들이 실제로 줄어들지는 않았고, 다만 많은 이들의 목소리 표출이 잦아들었을 뿐이다. 파벌들 사이의 실무 합의를 얻어내는 것도, 서로에 대한 교차하는 흐름과 의심을 털어내는 것도 불가능하다.\n\n제2항 조선의 분할. 크게 다른 정책 아래 두 점령지대로 조선을 나눈 것이, 전면적인 임시정부를 수립하는 즉각적인 조치가 나오지 않는 한, 조선을 하나의 국가로 통합하는 데 넘을 수 없는 장애가 된다는 것이 갈수록 분명해진다. 미국의 체면을 지키면서 이 상황을 평화적으로 바로잡는 것은 극히 어려워 보인다. 이 나라는 사람들을 일본인으로부터 풀어 주는 것이라면 무엇이든 받아들일 만큼 무르익어 있으나, 과거의 역사 때문에 이들은 지금 어떤 형태의 민주적 정부에, 그리고 특히 미국에 대해 가장 호의적이다. 나아가 조선의 두 지역 어느 쪽도 완전한 상호 교류 없이는 조금이라도 자립할 수 없다. 현재로서는 38도선 이북에서 상당한 수의 피난민이 남으로 내려오고 있고 그 반대는 사실이 아니라는 것 말고는 상호 교류가 없다.\n\n제3항 소련의 동향. 소련 측과 군사적 수준에서 어떤 실행 가능한 합의를 세우려는 노력이 계속되고 있으나 지금까지 거의 결실이 없다. 현재까지의 유일한 성과는 함흥(Kanko) 포로수용소의 수용자들을 빼낸 것인데, 이는 교섭이 시작된 뒤 약 열흘이 지나서야, 그리고 조치 방식을 놓고 많은 갈팡질팡 끝에 이루어졌다. 38도선의 접촉 부대들의 관계는, 경성 이북 어느 지역에서 소련군이 전력을 끊은 것을 제외하면, 9월 13일 이후 특별한 사건 없이 유지되어 왔다.\n\n제4항 군정. 조선의 군정은 사소한 기능을 제외하면 전면적이어야 할 것으로 보인다. 믿을 수 없는 규모의 독직과 부패 행위가 드러나고 있다. 일본인 관리들은 빠르게 제거되고 있다. 조선인들은 대부분 신뢰할 수 없거나 사소한 직위 이외의 어떤 자리도 채울 능력이 없다.\n\n제5항 특파원. 종군 기자들의 태도는 눈에 띄게 개선되었다. 남아 있는 자들은 미국 시민으로서의 자기 책임을 더 의식하고 있다. 그러나 보도될 경우 이곳의 미국 임무를 위태롭게 할 수 있는 소련 관련 기사를 송고하는 경향이 아직 남아 있다.\n\n인증(OFFICIAL): 해럴드 페어(HAROLD FAIR), 중령, 부관부(A.G.D.), 부관보\n사본 배부: 참모장(C/S) 2부, 애치슨(Atcheson) 씨, 군정부(Mil Govt)", "secondary": "010533  1 OCT 1945\n\nTHERE FOLLOWS ABLE SUMMARY OF ABLE LETTER JUST RECEIVED FROM GENERAL HODGE PD ( CA 52563 ) PARA ONE GENERAL PD THERE IS NO CHANGE IN THE ATTITUDE OF KOREANS TOWARD THE JAPS NOR IN THEIR ATTITUDE TOWARD INDEPENDENCE PD IN THE KEIJO AREA KOREANS ARE BEGINNING TO SETTLE ON THE SURFACE PD THERE ARE FEWER PARADES AND DEMONSTRATIONS AND FEWER VOCAL REMONSTRANCES PD THERE IS ABLE GROWING CMA DEEP DASH SEATED DISTRUST OF ALLIED INTENTIONS CONCERNING CMA AND REAL DISSATISFACTION WITH THE DIVISION OF KOREA ALONG THE THREE EIGHT DEGREE LINE INTO TWO OCCUPATION ZONES OCCUPIED BY FORCES OF SUCH WIDELY DIVERGENT POLICIES PD MANY INTELLIGENT KOREANS HAVE ALREADY REACHED THE CONCLUSION THAT THE ALLIED POWERS HAVE NO INTENTION OF BUILDING UP A KOREAN NATION PD BASED UPON POLICIES TO DATE CMA THERE IS LITTLE TO ENCOURAGE THEM IN THE BELIEF THAT THE ALLIED PROMISE OF KOREAN INDEPENDENCE IS SINCERE PD MANY KOREANS NOW APPEAR TO REALIZE THAT THE WIDELY DIVERGENT ACTIVITIES BY THE MULTITUDINOUS POLITICAL PARTIES ARE UNDESIRABLE PD HOWEVER CMA THERE IS NO REAL REDUCTION OF THESE TO DATE EXCEPT THAT VOCAL EXPRESSION OF MANY IS LESSENING PD IT IS IMPOSSIBLE TO GET WORKING AGREEMENTS BETWEEN FACTIONS AND TO SHAKE OUT THE CROSS CURRENTS AND SUSPICIONS OF ONE AGAINST THE OTHER PD\n\nPARA TWO DIVISION OF KOREA PD IT IS EVER MORE APPARENT THAT DIVISION OF KOREA INTO TWO OCCUPATIONAL ZONES UNDER WIDELY DIVERGENT POLICIES POSES AN INSURMOUNTABLE OBSTACLE TO UNITING KOREA INTO ABLE NATION UNLESS IMMEDIATE ACTION IS FORTHCOMING TO ESTABLISH OVERALL PROVISIONAL GOVERNMENT PD THE PEACEFUL CORRECTION OF THE SITUATION CMA WITH CREDIT TO THE UNITED STATES CMA APPEARS HIGHLY IMPROBABLE PD THE COUNTRY IS RIPE FOR ANYTHING THAT RELEASES THE PEOPLE FROM THE JAPANESE CMA BUT BECAUSE OF PAST HISTORY THEY ARE NOW MOST FAVORABLE TOWARD SOME TYPE OF DEMOCRATIC GOVERNMENT AND PARTICULARLY TOWARD THE UNITED STATES PD FURTHERMORE NEITHER OF THE TWO SECTIONS OF KOREA IS IN ANY DEGREE SELF DASH SUPPORTING WITHOUT FULL RECIPROCITY PD AT PRESENT THERE IS NO RECIPROCITY EXCEPT THAT REFUGEES FROM NORTH OF THREE EIGHT DEGREES ARE COMING SOUTH IN CONSIDERABLE NUMBERS AND THE REVERSE IS NOT TRUE PD\n\nPARA THREE RUSSIAN ACTIVITY PD CONTINUING BUT SO FAR ALMOST UNFRUITFUL EFFORT IS BEING MADE TO ESTABLISH SOME SORT OF WORKABLE AGREEMENT WITH THE SOVIETS ON ABLE MILITARY LEVEL PD TO DATE CMA THE ONLY ACCOMPLISHMENT HAS BEEN TO GET OUT THE OCCUPANTS OF THE KANKO PRISONER OF WAR CAMP WHICH WAS ACCOMPLISHED APPROXIMATELY TEN DAYS AFTER NEGOTIATIONS WERE STARTED AND AFTER MUCH VACILATION ON ARRANGEMENTS PD RELATIONSHIPS OF CONTACT TROOPS ALONG THE THREE EIGHT DEGREE LINE HAVE BEEN WITHOUT UNUSUAL INCIDENTS SINCE ONE THREE SEPTEMBER EXCEPT THAT ELECTRIC POWER WAS TURNED OFF BY SOVIET FORCES IN AN AREA NORTH OF SEOUL PD\n\nPARA FOUR MILITARY GOVERNMENT PD IT APPEARS THAT MILITARY GOVERNMENT IN KOREA WILL HAVE TO BE COMPLETE EXCEPT FOR MINOR FUNCTIONS PD GRAFT AND CORRUPT PRACTICES ON AN UNBELIEVABLE SCALE ARE BEING UNCOVERED PD JAPANESE GOVERNMENTAL OFFICIALS ARE BEING RAPIDLY REMOVED PD THE KOREANS ARE MOSTLY UNTRUSTWORTHY OR INCAPABLE OF FILLING ANY EXCEPT MINOR POSITIONS PD\n\nPARA FIVE CORRESPONDENTS PD THE ATTITUDE OF NEWS CORRESPONDENTS HAS IMPROVED MATERIALLY PD THOSE REMAINING ARE MORE MINDFUL OF THEIR RESPONSIBILITIES AS AMERICAN CITIZENS CMA HOWEVER THERE IS STILL ABLE TENDENCY TO SEND IN RUSSIAN STORIES WHICH CMA IF PUBLISHED CMA MAY JEOPARDIZE THE AMERICAN MISSION HERE\n\nOFFICIAL:  HAROLD FAIR, Lt. Col., A.G.D., Asst Adjutant General. Copy to: C/S (2), Mr. Atcheson, Mil Govt.", "notes": ["[도장·결재] 고무인: '010533' + '1 OCT 1945' (발신 일시)", "[도장·결재] 손글씨 이니셜: 'RK'(사선과 함께)", "[도장·결재] 우상단 손글씨 큰 서명/이니셜(판독불가)", "[도장·결재] 접수 도장(0063): GHQ AGO RECORDS 2 OCT 1945", "[도장·결재] 도장 옆 손글씨: '014.1 Korea'", "[도장·결재] 고무인/타자: 'TOP SECRET', 'PRIORITY'", "[도장·결재] 손글씨: 'AG FILE'", "[도장·결재] 하단 손글씨: 'Copy furnished Mil Govt Sect 5 Oct 1945 per C/S.' — 서명 'R.E.M.'", "[도장·결재] 2면(0064) 하단 손글씨: 'Copies furnished'(큰 글씨) 및 'Copy furnished Mil Govt Sect 5 Oct 1945 per C/S.  R.E.M.'", "[도장·결재] 2면 인증란 옆 손글씨 이니셜(판독불가)", "[도장·결재] 각 면 상단: 'Declassified E.O. 12065 Section 3/402/ NNDG NO. [판독불가]'", "[도장·결재] 각 면 하단 연필 일련번호: 4-D", "편철 메모 — 0063 본문에 CA 58668 로 읽히는 전문번호가 있으나 OCR 오독으로 보임"], "note": "번역자 주 — 1) **차별적 표현**: 제1항의 'THE ATTITUDE OF KOREANS TOWARD THE JAPS' 에 일본인을 가리키는 멸칭 'Japs' 가 쓰였다. 부드럽게 고치지 않고 그대로 옮겼다. 2) **조선인의 자치 능력을 낮춰 보는 서술**: 제4항의 'THE KOREANS ARE MOSTLY UNTRUSTWORTHY OR INCAPABLE OF FILLING ANY EXCEPT MINOR POSITIONS'(조선인들은 대부분 신뢰할 수 없거나 사소한 직위 이외의 어떤 자리도 채울 능력이 없다)를 어조를 다듬지 않고 직역했다. 3) 평문 전신 표기: PD=마침표, CMA=쉼표, DASH=붙임표, ABLE=a/A, PARA=항. 'THREE EIGHT DEGREE'=38도, 'ONE THREE SEPTEMBER'=9월 13일. 영문(en)은 원본 표기를 그대로 두었다. 4) 전문번호는 원본 본문에 'CA 52563' 으로 뚜렷이 찍혀 있다. OCR 의 'CA 58668' 은 오독이다. 5) 제1항의 'DEEP-SEATED DISTRUST OF ALLIED INTENTIONS CONCERNING CMA AND REAL DISSATISFACTION WITH...' 는 'CONCERNING' 뒤에 목적어가 빠진 채 쉼표로 이어진다. 원본 그대로이며 전신 과정의 탈자로 보이나 보충하지 않았다. 6) 'VACILATION'(=vacillation) 은 원본 표기 그대로다. 7) 지명: 'KEIJO' 는 경성의 일본식 음독, 'KANKO' 는 함흥의 일본식 음독이다. 같은 전문 안에서 'SEOUL' 도 함께 쓰이고 있다 — 원문 표기 차이를 그대로 살렸다.", "warn": false, "pages": ["0063", "0064"], "search": "하지(John R. Hodge — 원문 'GENERAL HODGE') 애치슨(George Atcheson, Jr. — 원문 'Mr. Atcheson') 해럴드 페어(Harold Fair — 원문 'HAROLD FAIR, Lt. Col., A.G.D.') 4-D CA 52563-Re attitude toward Japan and Independence in Korea."}, {"id": "4-C", "order": 403, "date": "1945-10-01", "group": "B", "eyebrow": "편철 4-C · 0065–0066면", "title": "북조선에서의 소련 정치 활동에 관한 보고", "badge": "Top Secret", "list_right": "4-C", "meta": [{"k": "일자", "v": "1945-10-01"}, {"k": "발신", "v": "태평양미육군총사령관 전진지휘소(CINCAFPAC ADV)", "txt": true}, {"k": "수신", "v": "육군참모총장(WARCOS, 합동참모본부)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "CA - 52562 (중계된 하지 전문)"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0065–0066 (2면)"}, {"k": "건명", "v": "Rpts on Soviet political activity in North Korea", "txt": true}, {"k": "색인 요지", "v": "CA 52562-Rpts on Soviet political activity in North Korea.", "txt": true, "wide": true}], "summary": "조선의 하지 장군에게서 막 받은 전문을 태평양미육군총사령부가 워싱턴에 중계한 것으로, 북조선에서 소련군이 주민의 반대에도 공산주의를 퍼뜨리고 있으며 군사 차원의 미소 협조로는 근본 문제를 풀 수 없다고 보고한다.", "points": ["북조선의 소련 정치 활동에 관한 최초의 확인된 보고들이, 소련군이 주민의 반대에도 불구하고 공산주의를 퍼뜨리기 위해 온갖 수단을 쓰고 있다는 소문을 뒷받침한다.", "어느 읍에서는 일본 항복 후에 만들어져 성공적으로 운영되던 '자치위원회'(self-rule council)가 소련군 지휘관에 의해 강제로 '인민정치위원회'(peoples political committee)로 교체되었고, 그 안에서 조선인 공산주의자들이 지배적 지위를 얻었다 — 그들은 주민의 극히 작은 소수에 지나지 않는데도 그러하다.", "조선인 공산주의 단체는 조직이 허용된 반면, 반대편인 '민주당'(democratic party)은 강제 해산되었다.", "라디오·신문·살포 전단이 공산주의 선전에 쓰이고 있다.", "위 목격담을 전한 제보자는 북조선의 다른 지역에서도 비슷한 정치 활동이 벌어지고 있으며, 소련은 자기 점령지대를 공산화하기로 작정했다고 본다고 말한다.", "그러한 사정에 비추어, '군사 차원'(at the military level)에서 미소 지휘관 간 협조를 이루려는 노력이 폭넓은 원칙 문제에서 지속적 성과를 거둘 수 있으리라고는 보지 않는다.", "개별 사안으로 풀 수 있는 작은 문제는 여기서 그런대로 처리될 수 있을지 모르나, 국가 경제·정치 정책에 관련된 더 근본적인 문제는 워싱턴과 모스크바 사이의 고위 교섭 결과가 아니고서는 여기서 논의 단계에조차 이르지 못할 것으로 보인다.", "소련 연락단이 서울에 도착하였고, 주한미군사령관은 그 기회를 이용해 소련 치스티아코프 장군에게 상호 관심사를 논의할 회담을 초청하였다.", "2주 전 평양(Heijo)을 방문한 미국 측 일행이 구두로 낸 같은 취지의 초청은 수락도 회답도 받지 못하였다.", "국무부의 베닝호프(Benninghoff)가 이에 동의한다."], "primary": "조선의 하지(John R. Hodge) 장군으로부터 방금 다음 전문을 접수함(CA-52562). 인용 시작.\n\n북조선에서의 소련 정치 활동에 관한 최초의 확인된 보고들은, 주민의 반대에도 불구하고 소련군이 공산주의를 퍼뜨리기 위하여 가능한 모든 일을 하고 있다는 소문을 뒷받침함. 어느 읍에서는 일본의 항복 후에 창설되어 성공적으로 운영되던 「자치 평의회」가 소련군 지휘관에 의하여 「인민정치위원회」로 강제 교체되었고, 그 안에서 조선인 공산주의자들에게 지배적 지위가 부여되었음 — 그들이 주민 가운데 극히 작은 소수에 지나지 아니함에도 그러함. 어떤 조선인 공산주의 단체는 조직이 허용된 반면, 이에 반대하는 「민주당」은 강제로 해산되었음. 라디오·신문 및 살포된 전단이 공산주의 선전을 퍼뜨리는 데 사용되고 있음.\n\n위 목격 보고를 전한 제보자는 북조선의 다른 지역에서도 유사한 정치 활동이 벌어지고 있다고 말하며, 소련이 자기들의 점령지대를 공산화하기로 작정하였다고 믿고 있음.\n\n그러한 사정에 비추어, 미국과 소련 지휘관 사이에 「군사 차원」의 협조를 이루려는 노력이 폭넓은 원칙의 문제에서 지속적인 성공을 거둘 수 있으리라고는 생각되지 아니함. 그 자체의 시비에 따라 해결될 수 있는 작은 문제들은 여기서 그런대로 처리될 수 있을지 모르나, 국가의 경제 또는 정치 정책에 관련된 더 근본적인 사항들은 워싱턴과 모스크바 사이의 고위급 교섭의 결과가 아니고서는 이곳에서 논의의 단계에조차 이르지 못할 것으로 보임.\n\n소련 연락단이 서울(Seoul)에 도착하였으며, 주한미군사령관은 그 주재의 기회를 이용하여 소련의 치스티아코프(Chistiakov) 장군에게 상호 관심사를 논의하기 위한 회담을 초청하였음. 2주 전 평양(Heijo)을 방문한 미국 측 일행이 구두로 낸 같은 취지의 초청은 수락되거나 회답된 바가 없음. 국무부의 베닝호프(Benninghoff) 씨가 이에 동의함. 인용 끝.", "secondary": "OPERATIONAL PRIORITY\nTOP SECRET\n\nCS  RES/fh 1 OCTOBER 1945\n\nFROM: CINCAFPAC ADV\nTO : WARCOS (JOINT CHIEFS OF STAFF)\n\n010557 Z\n\nFOLLOWING MESSAGE JUST RECEIVED FROM GENERAL HODGE IN KOREA ( CA - 52562 ) CLN QUOTE FIRST AUTHENTICATED REPORTS OF SOVIET POLITICAL ACTIVITY IN NORTH KOREA SUBSTANTIATE RUMORS THAT THE SOVIET ARMY IS DOING EVERYTHING POSSIBLE TO SPREAD COMMUNISM DESPITE THE OBJECTIONS OF THE PEOPLE PD IN ONE TOWN ABLE SUCCESSFUL QUOTE SELF DASH RULE COUNCIL UNQUOTE CMA CREATED AFTER THE JAPANESE SURRENDER CMA WAS FORCIBLY REPLACED BY THE SOVIET COMMANDER WITH ABLE QUOTE PEOPLES POLITICAL COMMITTEE UNQUOTE IN WHICH KOREAN COMMUNISTS WERE GIVEN THE DOMINANT POSITION ALTHOUGH THEY ARE ONLY ABLE VERY SMALL MINORITY OF THE PEOPLE PD ABLE KOREAN COMMUNIST GROUP WAS PERMITTED TO ORGANIZE WHILE AN OPPOSITION QUOTE DEMOCRATIC PARTY UNQUOTE WAS FORCIBLY DISBANDED PD RADIO CMA PRESS AND DROPPED LEAFLETS ARE USED TO SPREAD COMMUNIST PROPAGANDA PARA INFORMANT GIVING ABOVE EYEWITNESS REPORT SAYS SIMILAR POLITICAL ACTIVITY TAKING PLACE IN OTHER AREAS IN NORTH KOREA CMA AND HE BELIEVES SOVIETS ARE DETERMINED TO COMMUNIZE THEIR ZONE OF OCCUPATION PARA IN VIEW OF SUCH CONDITIONS CMA IT IS NOT BELIEVED THAT EFFORTS QUOTE AT THE MILITARY LEVEL UNQUOTE TO BRING ABOUT COLLABORATION BETWEEN AMERICAN AND SOVIET COMMANDERS CAN ACHIEVE LASTING SUCCESS IN QUESTIONS OF BROAD PRINCIPLE PD SMALL PROBLEMS SUSCEPTIBLE OF SOLUTION ON THEIR MERIT MAY PERHAPS BE SATISFACTORILY HANDLED CMA BUT IT SEEMS UNLIKELY THAT MORE FUNDAMENTAL MATTERS INVOLVING NATIONAL ECONOMIC OR POLITICAL POLICIES WILL EVEN REACH THE STAGE OF DISCUSSION HERE EXCEPT AS THE RESULT OF HIGH LEVEL NEGOTIATIONS BETWEEN WASHINGTON AND MOSCOW PARA ABLE SOVIET LIAISON GROUP HAS ARRIVED IN SEOUL CMA AND COMGEN USAFIK HAS TAKEN OPPORTUNITY OF ITS PRESENCE TO INVITE SOVIET GENERAL CHISTIAKOV TO ABLE CONFERENCE TO DISCUSS PROBLEMS OF MUTUAL INTEREST PD ABLE SIMILAR INVITATION ISSUED ORALLY BY AMERICAN GROUP WHICH VISITED HEIJO TWO WEEKS AGO HAS NEVER BEEN ACCEPTED OR ANSWERED PD MISTER BENNINGHOFF STATE DEPARTMENT CONCURS UNQUOTE\n\nOFFICIAL:\nHAROLD FAIR\nLt Col, AGD Asst Adj Gen Copy to: C/S (2)\n\nTOP SECRET", "notes": ["[도장·결재] [0065] 우측 상단 고무인(세로): 'GHQ AGO RECORDS 2 OCT 1945', 도장 안 'TS'. 옆에 손글씨 '014.1 Korea'", "[도장·결재] [0065] 'TOP SECRET' 고무인 2회 및 'OP'(작전) 표시", "[도장·결재] [0065] 전신번호 '010557 Z' 위에 대형 자필 서명 [판독불가, 'Raw...'로 읽힘]", "[도장·결재] [0065] 'CA - 52562' 에 손글씨 밑줄 및 강조 표시", "[도장·결재] [0065] 하단 우측 손글씨: 'Copy furnished Mil Gov't. Sect. 5 Oct 1945 per C/S.  R.E.M.'(1945년 10월 5일 참모장 지시로 민정부에 사본 제공)", "[도장·결재] [0065] 하단 우측 대형 고무인: 'AG FILE'", "[도장·결재] [0065] 하단 좌측 연필: '4-C' (편철기호), 쪽 표시 '-1-'", "[도장·결재] [0066] 본문 첫 줄 우측 위에 손글씨 'CMA' 가필(전신 문언 'CMA'=쉼표 삽입 표시)", "[도장·결재] [0066] 서명란 'HAROLD FAIR' 위에 자필 서명 'R.E.M.'", "[도장·결재] [0066] 'Copy to: C/S (2)' 옆 자필 'furnished'(제공 완료)", "[도장·결재] [0066] 하단 우측 손글씨: 'Copy furnished Mil Gov't. Sect. 5 Oct 1945 per C/S.  R.E.M.'", "[도장·결재] [0066] 하단 좌측 연필: '4-C', 쪽 표시 '-2-'", "[도장·결재] 양면 상단 여백: 'Declassified E.O. 12065 Section 3/402/ NNDG NO. [판독불가]' — 비밀해제 표기"], "note": "번역자 주 — 전신 문언 부호는 원문대로 두되 한국어에서는 문장으로 풀었다 — PD=마침표, CMA=쉼표, CLN=콜론, PARA=단락 바꿈, QUOTE/UNQUOTE=인용 시작·끝, ABLE=관사 'a'를 뜻하는 음성문자. 0065·0066 원면에서 지명은 'SEOUL'과 'HEIJO'(평양의 일본식 음독)가 함께 쓰였다 — 원문 표기를 병기하였다. 다른 문서들이 경성을 'Keijo'로 적는 것과 달리 이 전문은 'SEOUL'을 썼다는 점 자체가 사료다. 이 전문은 하지의 TFGCG 94 를 CA 52562 로 중계한 것이다.", "warn": false, "pages": ["0065", "0066"], "search": "하지(General Hodge, John R. Hodge) — 주한미군사령관 치스티아코프(Soviet General Chistiakov) — 소련 제25군사령관 베닝호프(Mister Benninghoff) — 국무부 정치고문 해럴드 페어(HAROLD FAIR) — 중령, 부관부 차장 (전문 인증자) R.E.M. — 부관부 담당자 이니셜. 성명 미상 4-C CA 52562-Rpts on Soviet political activity in North Korea."}, {"id": "4-B", "order": 402, "date": "1945-10-01", "group": "C", "eyebrow": "편철 4-B · 0067–0070면", "title": "각서 — 조선에서의 미소(美蘇) 연락", "badge": "Top Secret", "list_right": "4-B", "meta": [{"k": "일자", "v": "1945-10-01"}, {"k": "발신", "v": "주도쿄 미국 정치고문실(Office of the U.S. Political Advisor) — 조지 애치슨 2세(George Atcheson, Jr.)", "txt": true}, {"k": "수신", "v": "연합국최고사령관 및 참모장(SUPREME COMMANDER AND CHIEF OF STAFF)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "각서"}, {"k": "면", "v": "0067–0070 (4면)"}, {"k": "건명", "v": "Memorandum — US-Soviet liaison in Korea", "txt": true}, {"k": "색인 요지", "v": "MEMO-Reg US-Soviet liaison in Korea.", "txt": true, "wide": true}], "summary": "주도쿄 미국 정치고문 애치슨은 하지의 비관적 판단(정부 간 합의 없이는 현지에서 근본적 개선을 기대하기 어렵다)에 동의하면서도, 조선에서의 미소 연락을 즉각 강화할 것을 건의하고 그 구체적 방안 두 갈래(현지 조치와 육군부 통보)를 제시한다.", "points": ["참조 문서는 WX 71814 및 TFGCG 94(1945년 9월 30일)이다.", "TFGCG 94 제3항에 나타난 하지의 견해 — 정부 간 합의 없이는 현지에서 근본적 개선을 이룰 희망이 거의 없다 — 에 동의한다.", "그러나 WX 71814 제1항의 제안, 즉 조선에서의 미소 연락 강화는 상황 완화를 위해 즉시 착수해야 한다고 본다.", "건의 1(a) : 고위 장교 1명을 조선에 파견해 미소 연락의 확대·강화를 담당하게 할 것.", "건의 1(b) : 연합국최고사령관이 도쿄 주재 소련 군사대표를 불러, 본국 정부와 극동 소련군 총사령관에게 요청해 조선 주둔 소련군 사령관이 미군 사령관과 협력하도록 지시하게 할 것. 두 지역(zone)의 행정 관행 통일, 현안의 신속한 해결, 상호 관심사의 지속적 해결을 위한 연락 강화가 목적이다. 미군 사령관에게도 같은 취지의 지시가 내려간다는 점을 소련 대표에게 알려도 좋다.", "건의 2(a) : 1(a)·(b)의 조치가 취해지고 있음을 육군부에 통보할 것.", "건의 2(b) : 연합국최고사령관이 TFGCG 94 제3항의 하지의 견해를 강력히 지지한다는 점을 통보할 것.", "건의 2(c) : 연합국최고사령관은 미국 정부가 소련 정부에 대해 두 지역의 실행 가능한 행정 통일을 지체 없이 이룰 필요가 있음을 통고하고, 소련군 사령관이 미군 사령관과 전면 협력하며 소련 측 연락을 강화하도록 지시할 것을 긴급히 요청하도록 건의한다.", "여백의 손글씨에 따르면 1(b)와 2(a)~(c)는 '이 각서를 쓰기 전에 이미 시행되었다'."], "primary": "**참조 : WX 71814 및 TFGCG 94, 1945년 9월 30일**\n\nTFGCG 94 제3항에 표명된 하지(General Hodge) 장군의 견해 — 즉 정부 간 합의 없이는 현지에서 근본적 개선을 이루어 낼 희망이 거의 없다는 것 — 에 우리는 동의하지만, 조선에서의 미소(美蘇) 연락 강화를 위한 WX 71814 제1항의 제안은 사태를 완화하기 위해 가능한 모든 것을 한다는 견지에서 즉각 착수되어야 한다고 본다.\n\n다음과 같이 구체적 건의를 제출한다.\n\n1. (a) 고위 장교 1명을 조선에 파견하여, 제안된 대로 또 제안된 목적을 위하여 미소 연락의 확대와 강화를 맡게 할 것.\n\n   (b) 하지 장군의 입장을 뒷받침한다는 견지에서, 연합국최고사령관이 이곳(도쿄)의 소련 군사대표를 불러들여, 그가 본국 정부와 극동 소련군 총사령관에게 다음을 촉구하도록 요청할 것을 고려할 것 — 조선 주둔 소련군 사령관에게, 두 지역(zone)에서 행정 관행의 통일을 얻어 낼 방도를 미군 사령관과 함께 강구하고, 현존 문제들을 신속히 해결하며, 상호 관심사가 되는 문제들을 계속 풀어 나가기 위하여 미소 연락을 강화하는 데 협력하라고 지시하도록 하는 것. (소련 대표에게는 미국 측 조선 주둔 사령관에게도 이와 유사한 지시가 내려가고 있다는 점을 아울러 알려 주어도 좋다.)\n\n2. 육군부(War Department)에 다음을 통보할 것.\n\n   (a) 위 1(a) 및 (b)에서 제안된 대로 조치가 취해지고 있다는 것.\n\n   (b) 연합국최고사령관은 TFGCG 94 제3항에 표명된 하지 장군의 견해를 강력히 지지한다는 것.\n\n   (c) 연합국최고사령관은, 미국 정부가 소련 정부에 대하여 두 지역에서 실행 가능한 행정상의 통일을 지체 없이 확보할 필요가 있음을 통고하고, 아울러 소련 정부가 소련군 사령관에게 다음을 지시하도록 긴급히 요청할 것을 건의한다는 것 — 곧 이 목적을 달성할 적절하고 실행 가능한 방도를 강구하는 데 미군 사령관과 전심으로 협력하고, 이 목적을 위하여, 또 현존하는 모든 문제의 해결과 장차 발생할 수 있는 상호 관심사의 지속적 해결을 위하여, 미군 사령부와의 소련 측 연락을 강화하라는 것.\n\n조지 애치슨 2세(George Atcheson, Jr.)\n\n---\n\n**[첨부 1 — 라우팅 슬립, 태평양미육군총사령부 전진지휘소, 1945년 10월 5일]**\n\n발신 : 군정부(Military Government)\n수신 : (인쇄된 배포처 목록. 잉크로 크게 표시가 그어져 있어 개별 수신처는 판독불가)\n용건 : (인쇄 항목 중 표시된 것 판독불가)\n\"열람함(Noted).\" — 서명 [판독불가]\n\n**[첨부 2 — 회부 쪽지, 태평양미육군총사령부, 1945년]**\n\n발신 : 참모장(CHIEF OF STAFF)\n수신 : 참모차장 / G-1 / G-2 / G-3 / G-4 참모부장 / 부관감 — 그리고 손글씨로 덧붙인 '정부부(Govt Sec)'\n용건 : '정보(Information)' 항목에 표시\n서명 : 중장, 미육군, 참모장 [자필 서명, 성명 인쇄 없음]", "secondary": "THE FOREIGN SERVICE OF THE UNITED STATES OF AMERICA\nOFFICE OF THE U.S. POLITICAL ADVISOR\nTokyo, October 1, 1945\n\nMEMORANDUM FOR: SUPREME COMMANDER AND CHIEF OF STAFF Reference WX 71814 and TFGCG 94  September 30, 1945 While we concur with General Hodge's views as expressed in 3rd papagraph of TFGCG 94 that there is lettle hope of working out fundamental improvement on the ground without inter-Governmental agreement, we believe that the suggestion in 1st paragraph of WX 71814 for the strengthening of U.S.-Soviet liaison in Korea should be undertaken at once with a view to doing everything possible to alleviate the situation.\n\nWe submit specific recommendations as follows:\n\n1. (a) That a high ranking officer be sent to Korea to undertake expansion and strengthening of United States-Soviet liaison as suggested and for the purposes suggested.\n\n(b) That, with a view to supporting General Hodge's position, the Supreme Commander consider calling in the Soviet military representative here and requesting that he urge his Government and the Commanding General of the Soviet Forces in the Far East to instruct the Soviet Commander in Korea to cooperate with the American Commander in working out means of obtaining uniformity of administrative practice in the two zones, the prompt settlement of existing problems and the strengthening of United States-Soviet liaison for the continued resolving of questions of mutual concern. (The Soviet representative might be informed also that similar instructions are being issued to the U. S. Commander in Korea.)\n\n2. That the War Department be informed\n\n(a) That action is being taken as suggested in 1 (a) and (b) above.\n\n(b) That SCAP strongly supports General Hodge's views as expressed in the third paragraph of TFGCG 94.\n\n(c) That SCAP recommends that the American Government inform the Soviet Government that it is necessary to obtain without delay practicable administrative uniformity in the two zones and urgently request that the Soviet Government instruct the Soviet Commander to cooperate whole-heartedly with the American Commander in working out appropriate and practicable means of achieving this objective, and to strengthen Soviet liaison with the American Command for this purpose, for the settlement of all existing problems and for the continued resolving of such problems of mutual concern as may arise in future.\n\nG.A.\nGeorge Atcheson, Jr., ---\n\n[ATTACHMENT 1 — ROUTING SLIP]\nGENERAL HEADQUARTERS, UNITED STATES ARMY FORCES, PACIFIC, ADVANCE ECHELON ROUTING SLIP        5 Oct 1945\nFROM: Military Government\nTO: [printed distribution list; heavy ink marks obscure the individual entries — illegible]\nFOR: [illegible]\n\"Noted.\"  [signature illegible]\n\n[ATTACHMENT 2 — ROUTING SLIP]\nGENERAL HEADQUARTERS, UNITED STATES ARMY FORCES, PACIFIC ________ 1945\nFROM: CHIEF OF STAFF\nTO: Deputy Chief of Staff / Asst Chief of Staff G-1 / G-2 / G-3 / G-4 / Adjutant General  — plus handwritten \"Govt Sec\"\nFOR: Comment / Nec Action / Note & Return / Information (marked) / File\n[signature]\nLieutenant General, U.S. Army, Chief of Staff.", "notes": ["[도장·결재] 0067 우측 상단 손글씨 : 'TOP SECRET' (밑줄), '48 A'", "[도장·결재] 0067 우측 상단 손글씨 이니셜 결재 : 'RK'", "[도장·결재] 0067 우측 고무인 : 'GHQ / AGO RECORDS', 날짜 '7 OCT 1945'; 그 위 손글씨 '014.1 Korea T.S.'", "[도장·결재] 0067 좌측 여백 손글씨(건의 1(b) 옆) : 'Done prior to writing of this Memo.' — '이 각서를 쓰기 전에 이미 시행됨'", "[도장·결재] 0067 좌측 여백 손글씨(건의 2 옆) : 'Done prior to writing of this Memo' — 같은 취지", "[도장·결재] 0067 우측 하단 손글씨 이니셜 [판독불가]", "[도장·결재] 0067·0068·0069·0070 좌측 하단 연필 편철기호 : '4-B'", "[도장·결재] 0068 서명란 자필 이니셜 : 'G.A.' (George Atcheson)", "[도장·결재] 0069 라우팅 슬립 손글씨 : 발신란 'Military Government', 날짜란 '5 Oct 1945', 하단 'Noted.' 및 자필 서명 [판독불가]. 배포처 목록 위에 잉크로 큰 표시가 그어져 있음", "[도장·결재] 0070 회부 쪽지 우측 상단 손글씨 : '48A' 및 체크 표시", "[도장·결재] 0070 수신처 목록에 손글씨로 추가 : 'Govt Sec'", "[도장·결재] 0070 'Information' 항목에 잉크 표시", "[도장·결재] 0070 하단 자필 서명(중장·참모장) 및 고무인 'TOP SECRET'", "[도장·결재] 상단 여백 : 'Declassified E.O. 12065 Section 3/402/ NNDG NO. 775041[?]' — 번호 일부 판독불가", "편철 메모 — 0069·0070 은 라우팅 슬립. 0070 은 연필 일련번호가 없어 인접 편철 기준으로 4-B 에 묶음"], "note": "번역자 주 — 원저자의 타자 오타는 고치지 않고 en 에 그대로 두었다 : 'papagraph'(paragraph), 'lettle'(little), 'contin[u]ed'(0068면에서 겹쳐 친 흔적). 0069·0070 두 면은 본문 없는 회부용 쪽지라 doc_type 상 각서 본문에 첨부로 붙여 옮겼다. 0070 은 연필 편철기호가 '4-B'로 읽히나 날짜란이 비어 있어 이 각서에 붙은 것으로 편철 순서에 따라 판단한 것이다. 0069 라우팅 슬립의 수신처는 굵은 잉크 표시로 덮여 개별 항목을 특정할 수 없어 [판독불가]로 두었다. 'zone'은 문맥상 38도선 남북의 미·소 점령지구를 뜻하나 원문 표현대로 '지역(zone)'으로 옮겼다.", "warn": false, "pages": ["0067", "0068", "0069", "0070"], "search": "조지 애치슨 2세(George Atcheson, Jr.) — 주도쿄 미국 정치고문 하지(John R. Hodge) — 원문에는 'General Hodge' 4-B MEMO-Reg US-Soviet liaison in Korea."}, {"id": "4-A", "order": 401, "date": "1945-10-01", "group": "B", "eyebrow": "편철 4-A · 0071–0073면", "title": "조선의 국제신탁통치", "badge": "Top Secret", "list_right": "4-A", "meta": [{"k": "일자", "v": "1945-10-01"}, {"k": "발신", "v": "워싱턴(WASHINGTON) — 서명 WARCOS(육군참모총장)", "txt": true}, {"k": "수신", "v": "태평양미육군총사령관 전진제대(CINCAFPAC ADV)", "txt": true}, {"k": "참조", "v": "태평양미육군총사령관(CINCAFPAC)", "txt": true}, {"k": "전문번호", "v": "WX 71814"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0071–0073 (3면)"}, {"k": "건명", "v": "International trusteeship for Korea", "txt": true}, {"k": "색인 요지", "v": "WX 71814-Reg international trusteeship for Korea.", "txt": true, "wide": true}], "summary": "국무·육군·해군 3부조정위원회(SWNCC)에 조선의 국제신탁통치를 조속히 설치하자는 제안이 올라와 있음을 알리고, 38선의 인위성을 인정하면서 군 수준 연락의 강화·확대로 두 지대의 행정을 통일해 나가는 방안에 대한 현지 사령부의 의견을 요구한 전문이다.", "points": ["국무·육군·해군 3부조정위원회(SWNCC)에 '조선에 국제신탁통치(international trusteeship)를 가능한 한 이른 시일에 설치해야 한다'는 제안이 계류 중이다.", "위원회는 미군과 러시아군 사이의 현 분할선이 '고도로 인위적(highly artificial)'이며 여러 이유로 조선 전체를 하나로 행정하는 편이 낫다고 인정했다.", "제안의 결론 — 현 군 수준 연락을 강화·확대하고, 필요하면 정부 간 교섭의 조력을 받아, 인위적 분할선의 폐해를 즉시 최소화하고 국가 행정의 중앙집권화를 촉진해야 한다.", "따라서 미국 점령군 사령관은 그 강화·확대된 연락을 통해 미·소 두 지대의 행정 관행이 최대한 균일해지도록 노력해야 한다.", "남조선의 행정 구조는 러시아 측과의 합의에 따라 조선 전역으로 손쉽게 확장할 수 있도록 편성되어야 한다.", "워싱턴이 요구한 것 — 현지 군 연락이 위 목표를 달성할 가망, 소련 지휘관들과 현재 시도 중인 조정의 내용과 성과, 앞으로의 전망, 정부 수준에서 개시할 것을 건의하는 구체적 교섭.", "국무부가 이 전문 작성에 관여했으며, 회신에 애치슨(Atcheson) 정치고문의 견해를 포함시켜 줄 것을 요망한다.", "말미의 비공개 견적 — 신탁통치 교섭이 1946년 초에 시작되기를 바라나, 실효적 4개국 신탁통치가 군정으로부터 조선의 감독을 넘겨받기까지는 1년이 걸릴 수도 있다. **이 견적은 러시아 측에 누설하지 않는다.**"], "primary": "국무·육군·해군 3부조정위원회(State-War-Navy Coordinating Committee)에는 현재 조선에 국제신탁통치(international trusteeship)를 가능한 한 이른 시일에 설치해야 한다는 제안이 올라와 있다. 위원회는 아울러 현재 미군과 러시아군 사이에서 조선을 나누고 있는 선이 고도로 인위적이며, 여러 이유에서 조선 전체를 하나로 행정하는 편이 바람직하다는 점도 인정하였다. 위원회에 올라온 제안은, 현재의 군 수준 연락을 강화·확대하되 필요한 경우 정부 간 교섭을 통한 조력을 받아, 이 인위적 분할선의 불이익을 가능한 한 즉시 최소화하고 이 나라 행정의 중앙집권화를 한층 촉진하는 조치를 취할 수 있도록 하여야 한다고 결론짓고 있다.\n\n따라서 이 제안은, 미국 점령군 사령관이 그와 같이 강화·확대된 연락을 통하여 미국 지대와 러시아 지대의 두 지대에서 행정 관행이 가능한 한 최대로 균일해지도록 노력할 것을 상정하고 있다. 또한 남조선의 행정 구조는 러시아 측과의 합의에 따라 조선 전체로 손쉽게 확장할 수 있도록 편성되어야 한다고 결론짓고 있다.\n\n위 사항에 대한 귀관의 의견을 제안 심의에 도움이 되도록 조속히 제출하기 바란다. 특히 현지의 군 연락이 위에 제시한 목표를 달성하는 데 어느 정도까지 성공을 기대할 수 있는지에 관한 의견을 바란다. 아울러 현재 조선에서 소련 지휘관들과 어떤 조정이 시도되고 있는지, 그 시도가 얼마나 성공적이었는지, 앞으로의 전망은 어떠한지, 그리고 정부 수준에서 착수할 것을 귀관이 건의하는 구체적 교섭은 무엇인지에 관한 정보를 요구한다.\n\n이 전문의 작성에는 국무부가 협의하였으며, 국무부는 귀관의 회신에 애치슨(Atcheson) 씨의 견해가 포함되기를 바란다.\n\n귀관의 참고를 위하여 덧붙이면, 신탁통치 교섭이 1946년 초에 개시되리라는 희망은 있으나, 실효적인 4개국 신탁통치가 군정(Military Government)으로부터 조선의 감독을 넘겨받기까지는 1년이 걸릴 수도 있다. 이 견적은 러시아 측에 누설하지 않는다.\n\nWARCOS(육군참모총장)\n\n[배포] 총사령관(COMMANDER-in-CHIEF) / 참모장(CHIEF OF STAFF) / 작전담당 참모차장 대리(ACTING DEPUTY CHIEF OF STAFF OPNS) / 정치고문(POLITICAL ADVISOR)", "secondary": "Now before the State-War-Navy Coordinating Committee is a proposal that an international trusteeship should be set up for Korea at the earliest practicable date. The committee has likewise recognized that the present line dividing Korea between United States and Russian Forces is highly artificial, and that for many reasons a single administration for the whole of Korea would be preferable. The proposal before the committee concludes that present liaison on a military level should be strengthened and expanded, with such assistance as may be necessary through governmental negotiations, to the end that measures may be taken at once to minimize as far as possible the disadvantages of this artificial dividing line, and to foster greater centralization in the administration of the country.\n\nAccordingly, the proposal contemplates that the United States Occupation Commander should seek, through such strengthened and expanded liaison, to ensure the greatest possible uniformity of administrative practice in the 2 zones, United States and Russian. It is also concluded that the administrative structure in southern Korea should be so arranged that it can be readily adapted to extension through the whole of Korea in agreement with the Russians.\n\nYour comments on the foregoing are requested at an early date to assist in consideration of the proposal, particularly as concerns the degree to which military liaison on the ground can be expected to succeed in achieving the objectives set forth above. Request information as to what coordination is now being attempted with Soviet Commanders in Korea, how successful these attempts have been, the prospects for the future, and specific negotiations you recommend be undertaken on a governmental level.\n\nState Department has been consulted in preparing this message and would appreciate inclusion of views of Mister Atcheson in your answer.\n\nFor your information, although there is hope that trusteeship negotiations may begin by early 1946, it may well be a year before an effective quadripartite trusteeship can take over supervision of Korea from the Military Government. This estimate will not be divulged to the Russians.\n\nWARCOS\n\nTOO: 301911 Z\nMCN: USF D 78 DISTRIBUTION:\nCOMMANDER-in-CHIEF\nCHIEF OF STAFF\nACTING DEPUTY CHIEF OF STAFF OPNS\nPOLITICAL ADVISOR", "notes": ["[도장·결재] 0071 우측 여백 접수 도장 — 'GHQ AGO RECORDS 3 OCT 1945', 그 옆 세로 손글씨 '014.1 Korea'", "[도장·결재] 0071 본문 우측 상단 손글씨 이니셜 'RK'(밑줄)", "[도장·결재] 0071 본문 말미 우측 손글씨 — 'Copy furnished Mil Govt Sec. 5 Oct 1945 per C/S.  R.E.M.'", "[도장·결재] 0071 하단 'TOP SECRET' 도장 · 'A. G. FILE' 도장 · 'COPY NO. 7' · 좌하단 'AFPAC AGO Form No. 108'", "[도장·결재] 0072 상단 접수 도장 — 'GHQ AFPAC AGO RECORDS 3 OCT 1945', 그 옆 손글씨 '014.1 Korea'와 이니셜", "[도장·결재] 0072·0073 본문 말미 우측 손글씨 — 'Copy furnished Mil Govt Sec. 5 Oct 1945 per C/S.  R.E.M.'", "[도장·결재] 0073 하단 손글씨 — 'See correction filed above'", "[도장·결재] 0073 면에는 다른 'INCOMING MESSAGE' 양식이 겹쳐 찍힌 자국이 남아 있다", "[도장·결재] 0072·0073 좌하단 타자 '5427' · 하단 'TOP SECRET' 도장 · 'A. G. FILE' 도장 · 'COPY NO.'(번호 미기재)", "[도장·결재] 각 면 좌하단 연필 편철기호 '4-A'", "[도장·결재] 각 면 하단 인쇄 문구 'THE MAKING OF AN EXACT COPY OF THIS MESSAGE IS FORBIDDEN'", "편철 메모 — 수신 접수는 2 October 1945"], "note": "번역자 주 — 0072와 0073은 같은 2면의 사본 두 부이며 본문 내용이 동일하다. 0073에만 'See correction filed above'라는 손글씨와 다른 양식이 겹쳐 찍힌 자국이 있다. 본문은 한 번만 옮기고 차이는 stamps_ko에 남겼다. OCR은 인명을 'Mister ltoneson'으로 오독했으나 원본 이미지에는 'Mister Atcheson'으로 읽힌다. 'trusteeship'은 신탁통치로, 'Military Government'는 군정으로 옮겼으며 원문에 'tutelage'는 나오지 않는다. TOO 301911Z는 9월 30일 발신을 가리켜 면의 타자 날짜(1 October 1945)와 하루 어긋나나 읽은 그대로 두었다.", "warn": false, "pages": ["0071", "0072", "0073"], "search": "애치슨(George Atcheson, Jr., 원문 'Mister Atcheson') — 총사령부 정치고문 4-A WX 71814-Reg international trusteeship for Korea."}, {"id": "4", "order": 400, "date": "1945-09-30", "group": "B", "eyebrow": "편철 4 · 0074–0074면", "title": "북조선에서의 소련 정치활동에 관한 보고", "badge": "Top Secret", "list_right": "4", "meta": [{"k": "일자", "v": "1945-09-30"}, {"k": "발신", "v": "제24군단장(CG 24TH CORPS)", "txt": true}, {"k": "수신", "v": "태평양미육군총사령관 전진지휘소(CINCAFPAC ADVANCE) — 처리(ACTION)", "txt": true}, {"k": "참조", "v": "총사령관(COMMANDER-in-CHIEF), 참모장(CHIEF OF STAFF), 정치고문(POLITICAL ADVISOR), 군정장관(C MIL GOVT O), 작전담당 참모차장 대리(ACTING DEPUTY CHIEF OF STAFF OPNS)", "txt": true}, {"k": "전문번호", "v": "TFGCG 94"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0074–0074 (1면)"}, {"k": "건명", "v": "Reports on Soviet political activity in North Korea", "txt": true}, {"k": "색인 요지", "v": "TFGCG 94-Rpts on Soviet political activity in North Korea.", "txt": true, "wide": true}], "summary": "북조선에서 소련군이 주민의 반대를 무릅쓰고 공산주의를 퍼뜨리고 있다는 최초의 확인된 보고를 전하고, '군사적 수준'의 미소 협력 노력만으로는 근본 문제를 해결할 수 없으며 워싱턴과 모스크바의 고위급 교섭이 있어야 한다고 판단한 전문.", "points": ["북조선에서의 소련 정치활동에 관한 최초의 확인된(authenticated) 보고들이, 소련군이 주민의 반대에도 불구하고 공산주의를 퍼뜨리기 위해 가능한 모든 일을 하고 있다는 소문을 뒷받침한다.", "어느 한 읍에서 일본 항복 후 만들어져 잘 운영되던 '자치회(Self-Rule Council)'가 소련군 사령관에 의해 강제로 '인민정치위원회(Peoples Political Committee)'로 교체되었고, 극소수에 불과한 조선인 공산주의자들이 지배적 지위를 받았다.", "조선인 공산주의 단체는 조직이 허용된 반면 반대 세력인 '민주당(Democratic Party)'은 강제로 해산되었다.", "라디오·신문·투하 전단이 공산주의 선전에 동원되고 있다.", "목격담을 전한 제보자는 북조선의 다른 지역에서도 유사한 정치활동이 진행 중이며 소련이 자기 점령지대를 공산화하기로 작정했다고 믿는다.", "이러한 조건에서는 '군사적 수준(At the Military level)'에서 미소 지휘관 간 협력을 이끌어내려는 노력이 넓은 원칙의 문제에서 지속적 성과를 거둘 수 없다고 본다.", "그 자체로 해결 가능한 작은 문제는 만족스럽게 처리될 수 있겠으나, 국가 경제·정치 정책이 걸린 근본 문제는 워싱턴과 모스크바의 고위급 교섭 결과가 아니고서는 이곳에서 논의 단계에조차 이르지 못할 것 같다.", "소련 연락단이 경성(Seoul)에 도착했고, 주한미군사령관은 그 기회에 소련 치스차코프(Chistiakov) 장군을 상호 관심사 협의를 위한 회담에 초청했다.", "2주 전 평양(Heijo)을 방문한 미국 측 일행이 구두로 낸 같은 취지의 초청은 수락도 회답도 받지 못했다.", "국무부의 베닝호프(Benninghoff)가 동의한다."], "primary": "북조선에서의 소련 정치활동에 관한 최초의 확인된(authenticated) 보고들은, 소련군이 주민의 반대에도 불구하고 공산주의를 퍼뜨리기 위하여 가능한 모든 일을 하고 있다는 소문을 뒷받침한다. 한 읍에서는 일본 항복 후에 만들어져 잘 운영되던 「자치회(Self-Rule Council)」가 소련군 사령관에 의하여 강제로 「인민정치위원회(Peoples Political Committee)」로 교체되었으며, 그 안에서 조선인 공산주의자들에게 지배적 지위가 주어졌다. 그들은 주민 가운데 극히 적은 소수에 지나지 않는데도 그러하다. 조선인 공산주의 단체는 조직하는 것이 허용된 반면, 반대 세력인 「민주당(Democratic Party)」은 강제로 해산되었다. 라디오, 신문 및 투하 전단이 공산주의 선전을 퍼뜨리는 데 쓰이고 있다.\n\n위 목격담을 전한 제보자는 북조선의 다른 지역에서도 유사한 정치활동이 진행되고 있다고 말하며, 소련이 자기 점령지대를 공산화하기로 작정하였다고 믿는다.\n\n이러한 조건에 비추어, 「군사적 수준(At the Military level)」에서 미국과 소련 지휘관 사이의 협력을 이끌어내려는 노력이 넓은 원칙의 문제에서 지속적인 성과를 거둘 수 있으리라고는 보이지 않는다. 그 자체의 시비로 해결이 가능한 작은 문제들은 아마도 만족스럽게 처리될 수 있을 것이나, 국가의 경제 또는 정치 정책이 걸린 더 근본적인 사안들은 워싱턴과 모스크바 사이의 고위급 교섭의 결과가 아니고서는 이곳에서 논의의 단계에조차 이르지 못할 것 같다.\n\n소련 연락단이 경성(Seoul)에 도착하였으며, 주한미군사령관(COMGEN USAFIK)은 그 주둔의 기회를 이용하여 소련의 치스차코프(Chistiakov) 장군을 상호 관심사를 협의할 회담에 초청하였다. 2주 전 평양(Heijo)을 방문한 미국 측 일행이 구두로 낸 같은 취지의 초청은 수락되지도 회답되지도 않았다. 국무부의 베닝호프(Benninghoff) 씨가 동의한다.", "secondary": "First authenticated reports of Soviet political activity in North Korea substantiate rumors that the Soviet Army is doing everything possible to spread Communism despite the objections of the people. In 1 town a successful \"Self-Rule Council\", created after the Japanese surrender, was forcibly replaced by the Soviet Commander with a \"Peoples Political Committee\" in which Korean Communists were given the dominant position although they are only a very small minority of the people. A Korean Communist group was permitted to organize while an opposition \"Democratic Party\" was forcibly disbanded. Radio, press and dropped leaflets are used to spread Communist propaganda.\n\nInformant giving above eyewitness report says similar political activity taking place in other areas in North Korea, and he believes Soviets are determined to Communize their zone of occupation.\n\nIn view of such conditions, it is not believed that efforts \"At the Military level\" to bring about collaboration between American and Soviet Commanders can achieve lasting success in questions of broad principle. Small problems susceptible of solution on their merit may perhaps be satisfactorily handled, but it seems unlikely that more fundamental matters involving national economic or political policies will even reach the stage of discussion here except as the result of high level negotiations between Washington and Moscow.\n\nA Soviet Liaison group has arrived in Seoul, and COMGEN USAFIK has taken opportunity of its presence to invite Soviet General Chistiakov to a conference to discuss problems of mutual interest. A similar invitation issued orally by American group which visited Heijo 2 weeks ago has never been accepted or answered. Mr Benninghoff State Department concurs.\n\nTOO: 300207 Z   MCN: Y-11 DISTRIBUTION: COMMANDER-in-CHIEF, CHIEF OF STAFF, POLITICAL ADVISOR, C MIL GOVT O, ACTING DEPUTY CHIEF OF STAFF OPNS NOTE: This message relayed to Joint Chiefs of Staff this date under serial number CA 52562 per instructions from Office of the Chief of Staff. 5315   OPERATIONAL PRIORITY   TOP SECRET\n\nTHE MAKING OF AN EXACT COPY OF THIS MESSAGE IS FORBIDDEN", "notes": ["[도장·결재] 고무인(우상단): 「GHQ / AGO RECORDS / 7 OCT 1945」 — 총사령부 부관부 기록과 1945년 10월 7일 접수", "[도장·결재] 손글씨(도장 옆): '014.1 Korea'", "[도장·결재] 손글씨(본문 우상단): 'RK' 이니셜", "[도장·결재] 손글씨(우하단): 'Copy furnished Mil Govt. Sec, 5 Oct 1945 per C/S', 서명 'R.E.M.' — 참모장 지시로 1945년 10월 5일 군정부에 사본 교부", "[도장·결재] 우하단 인쇄·손글씨: 'COPY NO.' 란에 '15', 'A. G. FILE'", "[도장·결재] 좌하단 연필 정리기호: '4'", "[도장·결재] 상단 여백(마이크로필름 촬영 시 삽입): 'Declassified E.O. 12065 Section 3/402/ NNDG NO. 775091'"], "note": "번역자 주 — 색인의 3행과 4행이 같은 전문(TFGCG 94)을 중복 기재했고, 3행은 폐기되고 4행에 다시 적혔다. 본 번역은 4행(면 0074)을 따른다.\n\n원문에 발신자 서명(HODGE 등)이 없다. 본문 안에서는 주한미군사령관을 3인칭 'COMGEN USAFIK'으로 지칭한다.\n\n지명 원표기는 일본식 음독이다 — 'Heijo'는 평양. 'Seoul'은 원문 그대로 경성을 가리킨다.\n\nNOTE의 재발송 대상은 원본에서 'Joint Chiefs of Staff'로 판독된다(OCR의 'NO SIG'는 도장 겹침에 의한 오독). 재발송 일련번호는 CA 52562.\n\n원본 좌상단 여백에 'Korean' 등 색인용 손글씨가 있으나 흐려 [판독불가].", "warn": false, "pages": ["0074"], "search": "치스차코프(Ivan M. Chistiakov) — 소련 제25군 사령관 베닝호프(H. Merrell Benninghoff) — 국무부 주한 정치고문 하지(John R. Hodge) — 본문의 COMGEN USAFIK, 서명은 없음 4 TFGCG 94-Rpts on Soviet political activity in North Korea."}, {"id": "3", "order": 300, "date": "1945-09-30", "group": "D", "eyebrow": "편철 3 · 0075–0075면", "title": "3행은 쓰지 않음", "badge": "Top Secret", "list_right": "3", "meta": [{"k": "일자", "v": "1945-09-30"}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "라우팅 슬립"}, {"k": "면", "v": "0075–0075 (1면)"}, {"k": "건명", "v": "Line 3 not used.", "txt": true}, {"k": "색인 요지", "v": "TFGCG 94 - Re Soviet political activity in North Korea, spread of Communism.", "txt": true, "wide": true}], "summary": "문서철 색인의 3행이 사용되지 않았음을 알리는 자필 한 줄짜리 대체 쪽지.", "points": ["본문은 자필로 'Line 3 not used.' 한 줄뿐이고 그 밖의 타자 내용은 없다.", "용지 상하단에 TOP SECRET 고무인이 찍혀 있어, 폐기지가 아니라 정식 편철 용지로 취급되었음을 보여준다.", "좌하단에 연필로 일련번호 '3'이 적혀 있다.", "색인에서 3행과 4행이 같은 전문(TFGCG 94, 1945-09-30)을 중복 기재한 이유가 이 쪽지다 — 3행 기재가 폐기되고 4행으로 다시 기재된 것으로 보인다."], "primary": "3행은 쓰지 않음.", "secondary": "Line 3 not used.", "notes": ["[도장·결재] 상단 고무인: TOP SECRET", "[도장·결재] 하단 고무인: TOP SECRET", "[도장·결재] 자필(잉크): Line 3 not used. — 3행은 쓰지 않음.", "[도장·결재] 좌하단 연필: 3", "면 배정 신뢰도 medium — 원본 이미지 좌하단 연필 '3', 본문은 자필 'Line 3 not used.' 뿐. 색인 3과 4가 동일한 TFGCG 94(1945-09-30)를 중복 기재한 것과 부합 — 색인 사본 sheet 1 의 3행이 폐기되고 sheet 2 의 4행으로 다시 기재된 것으로 보임", "편철 메모 — 실물 문서가 아니라 serial 3 자리를 채우는 백지 쪽지"], "note": "번역자 주 — OCR(ocr/0075.txt)은 'Line 3 not mad.'로 읽었으나 원본 스캔(pages/0075.jpg)에서 자필은 명백히 'Line 3 not used.'다. 용지 상단에 편철용 천공 두 개가 있다. 실물 문서가 아니라 색인 3행 자리를 채우는 대체 쪽지이므로 발신·수신·전문번호가 없다.", "warn": false, "pages": ["0075"], "search": "3 TFGCG 94 - Re Soviet political activity in North Korea, spread of Communism."}, {"id": "2-C", "order": 203, "date": "1945-09-28", "group": "B", "eyebrow": "편철 2-C · 0076–0077면", "title": "북조선의 정세", "badge": "Top Secret", "list_right": "2-C", "meta": [{"k": "일자", "v": "1945-09-28"}, {"k": "발신", "v": "태평양미육군총사령관 전진지휘소(CINCAFPAC ADV)", "txt": true}, {"k": "수신", "v": "육군참모총장(WARCOS)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "CA 52443"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0076–0077 (2면)"}, {"k": "건명", "v": "Conditions in North Korea", "txt": true}, {"k": "색인 요지", "v": "CA 52443-Conditions in North Korea.", "txt": true, "wide": true}], "summary": "도쿄는 합동참모본부 앞으로, 앞서 CA 52414로 보낸 북조선 정세에 관한 오스트레일리아 정보국원의 목격 보고를 상기시키면서, 도쿄에서 소련 군사사절단 및 말리크 전 대사와 여러 차례 회담한 결과 얻은 판단 — 소련의 목적은 일본과 조선에 민주주의가 아니라 공산주의 체제를 세우는 것이며 그 수단은 사회구조의 완전한 파괴라는 것 — 을 보고한다.", "points": ["합동참모본부 앞. 방금 접수한 북조선 정세 보고를 참고용으로 우리 전문 CA 52414에 실어 이미 전송했다.", "그 보고는 오스트레일리아 정보국(Australian Bureau of Information)의 레너드 바스델(Leonard Barsdell)이 작성한 목격자 진술이다.", "이와 관련하여, 도쿄 주재 소련 군사사절단 및 전 소련 대사 말리크(Malik)와 여러 차례 회담한 결과 일본과 조선에서의 소련의 계획에 대해 매우 분명한 인상을 얻었다.", "소련이 염두에 둔 주된 목적은 이곳에 민주주의 체제가 아니라 — '반복한다, 아니라' — 공산주의 형태의 정부를 수립하는 것으로 보였다.", "그 달성 수단에 대한 소련의 구상은 사회구조를 혼돈으로 완전히 환원시키는 것, 곧 절대적 해체와 대량 파괴를 포함한다.", "이 절멸의 과정 위에서, 짓이겨진 대중으로부터 가장 경직되고 우상파괴적인 재편성 과정을 거쳐 공산주의 사회를 세우려 한다.", "소련이 지난 10년간 지하로 내몰렸다가 지금 뚜렷한 부활 조짐을 보이는 일본 공산주의 진영과 접촉하고 있다고 확신한다.", "그들은 미국 점령의 질서 있고 잘 규율된 절차에 공공연히 조급해하며, 약탈·강간·민간인에 대한 일반적 폭력과 관련하여 미군 병사들이 보인 훌륭하고 모범적인 품행을 거의 경멸한다.", "직무상 그들의 태도는 비협조적이고 전제적이다.", "그들의 근본 목적을 뒷받침하는 공세적 행동을 예상할 수 있다고 본다 — 그 목적은 건전한 평화의 수립과 유지라기보다는 일본과 조선에 자신들의 생활철학을 강요하는 데 있다."], "primary": "합동참모본부 앞. 본관은 방금 접수한 **북조선의 정세에 관한 보고**를 귀측의 참고를 위하여 우리 전문 CA 52414 에 실어 이미 전송하였음. 그 보고는 오스트레일리아 정보국(Australian Bureau of Information)의 레너드 바스델(Leonard Barsdell)이 작성한 것으로 목격자의 기술임.\n\n이와 일반적으로 관련하여, 본관은 이곳의 소련 군사사절단 및 전(前) 소련 대사 말리크(Malik) 씨와 여러 차례 회담을 가지면서 일본과 조선에서의 소련의 계획에 대하여 매우 분명한 인상을 얻었음. 그들이 염두에 두고 있는 주된 목적은, 이곳에 민주주의적 형태의 정부가 아니라 — 반복한다, 아니라 — 공산주의적 형태의 정부를 수립하는 것으로 보였음. 그 달성 수단에 관한 그들의 구상은 사회구조를 혼돈으로 완전히 환원시키는 것, 곧 절대적 해체와 대량 파괴를 담고 있음. 이 절멸의 과정 위에서, 그들은 짓이겨진 대중으로부터 가장 경직되고 우상파괴적인 재편성 과정을 통하여 공산주의 사회를 수립하려 함. 본관은 그들이 지난 10년 동안 지하로 내몰렸다가 지금은 부활의 뚜렷한 조짐을 보이고 있는 일본 공산주의 진영과 접촉하고 있다고 확신함.\n\n그들은 우리 점령의 질서 있고 잘 규율된 절차에 대하여 공공연히 조급해하며, 약탈·강간 및 민간 주민에 대한 일반적 폭력과 관련하여 우리 병사들이 보인 훌륭하고 모범적인 품행을 거의 경멸하고 있음. 직무상으로 그들의 태도는 비협조적이며 전제적임. 본관은 귀측이 그들의 근본 목적을 뒷받침하는 공세적 행동을 예상해도 좋다고 봄. 그 근본 목적은 건전한 평화의 수립과 그 보전이라기보다는 — 반복한다, 그것이 아니라 — 일본과 조선에 자신들의 생활철학을 강요하는 데 있음.", "secondary": "FOR JOINT CHIEFS OF STAFF PD ITEM HAVE FORWARDED IN OUR CHARLIE ABLE FIVE TWO FOUR ONE FOUR FOR YOUR INFORMATION ABLE REPORT ON CONDITIONS IN NORTH KOREA WHICH HAS JUST BEEN RECEIVED PD IT WAS MADE BY LEONARD BARSDELL OF THE AUSTRALIAN BUREAU OF INFORMATION AND IS AN EYE WITNESS ACCOUNT PARA IN THIS GENERAL CONNECTION ABLE VERY DEFINITE IMPRESSION OF THE RUSSIAN PLAN IN JAPAN AND KOREA HAS BEEN OBTAINED BY ME IN ABLE NUMBER OF CONFERENCES WITH THE RUSSIAN MILITARY MISSION HERE AND WITH THE FORMER RUSSIAN AMBASSADOR MISTER MALIK PD THE PREDOMINANT PURPOSE THEY HAVE IN MIND SEEMED TO BE THE ESTABLISHMENT HERE NOT REPEAT NOT OF ABLE DEMOCRATIC BUT OF ABLE COMMUNISTIC TYPE OF GOVERNMENT PD THEIR CONCEPT OF THE MEANS OF ACCOMPLISHMENT EMBODIES THE COMPLETE REDUCTION OF THE SOCIAL STRUCTURE TO CHAOS CMA ABSOLUTE DISINTEGRATION AND MASS DESTRUCTION PD UPON THIS PROCESS OF ANNIHILATION THEY PROPOSE FROM THE MUTILATED MASSES TO ESTABLISH ABLE COMMUNISTIC SOCIETY BY THE PROCESSES OF THE MOST RIGID AND ICONOCLASTIC REGIMENTATION PD ITEM AM CONVINCED THAT THEY ARE IN CONTACT WITH THE JAPANESE COMMUNISTIC WING WHICH WAS FORCED UNDERGROUND DURING THE LAST DECADE BUT IS NOW SHOWING MARKED SIGNS OF REVIVAL PD THEY ARE OPENLY IMPATIENT WITH THE ORDERLY AND WELL REGULATED PROCESSES OF OUR OCCUPATION AND ALMOST SCORNFUL OF THE SPLENDID AND EXEMPLARY CONDUCT OF OUR SOLDIERY WITH REGARD TO LOOTING CMA RAPE AND GENERAL VIOLENCE AGAINST THE CIVIL POPULATION PD PROFESSIONALLY CMA THEIR ATTITUDE IS UNCOOPERATIVE AND AUTOCRATIC PD ITEM BELIEVE THAT YOU CAN ANTICIPATE AGGRESSIVE ACTION IN SUPPORT OF THEIR FUNDAMENTAL PURPOSE WHICH IS NOT REPEAT NOT SO MUCH THE ESTABLISHMENT OF ABLE SOUND PEACE AND ITS PRESERVATION AS IT IS THE IMPOSITION OF THEIR OWN PHILOSOPHY OF LIFE IN JAPAN AND KOREA\n\nOFFICIAL:\nHAROLD FAIR\nLt Col., A.G.D., Asst Adjutant General.\n\nDISTRIBUTION:\nCinC\nC/S", "notes": ["[도장·결재] 0076 우측 고무인 : 'GHQ / AGO RECORDS', 날짜 '1 OCT 1945', 'TS'; 그 위 손글씨 '014.1 Korea'", "[도장·결재] 0076 우측 상단 손글씨 이니셜 결재 : 'RK'", "[도장·결재] 0076 상단 타자 : 'CinC   NFF/vhl' (기안자 표시)", "[도장·결재] 0076 우측 손글씨 : '281205 Z' (발신 시각군) 및 'OK Mac[?]' — 뒷부분 판독 불확실", "[도장·결재] 0076 본문 옆 손글씨 : '014.1 Korea secret'", "[도장·결재] 0076 본문 밑줄(잉크) : 'CONDITIONS IN NORTH KOREA' 및 앞 두 행", "[도장·결재] 0076 하단 손글씨 : 'Copy furnished Mil Govt Sect. 5 Oct 1945 per C/S.' 및 이니셜 'R.E.M.'", "[도장·결재] 0076 하단 고무인 : 'AG FILE'", "[도장·결재] 0077 서명란 옆 손글씨 : 'EJP.' (HAROLD FAIR 이름 옆), 그리고 'Original initialed by RKS[?] + CinC' — 이니셜 판독 불확실", "[도장·결재] 0077 하단 손글씨 : 'Copy furnished Mil Govt. Sect. 5 Oct 1945 per C/S.' 및 이니셜 'R.E.M.'", "[도장·결재] 0076·0077 좌측 하단 연필 편철기호 : '2-C'", "[도장·결재] 0076·0077 상·하단 고무인 : 'TOP SECRET', 0076 에 'OPERATIONAL PRIORITY'"], "note": "번역자 주 — OCR(ocr/0076.txt, 0077.txt)이 전면 대문자 타자 탓에 심하게 무너져 있어 원본 스캔(pages/0076.jpg, 0077.jpg)에서 전문을 다시 판독했다. 전문은 음성문자 철자 방식이라 'ABLE'=A, 'ITEM'=I, 'PD'=마침표, 'CMA'=쉼표, 'PARA'=단락, 'CHARLIE ABLE FIVE TWO FOUR ONE FOUR'=CA 52414 이다. 판독이 갈리는 대목 : (1) 보고자 이름 — 'LEONARD BARSDELL'로 읽었으나 원본에서는 'LEOHARD/LECHARD'로도 보인다. (2) 'ICONOCLASTIC REGIMENTATION' 의 마지막 낱말 — 'REGIMENTATION'으로 읽었으나 확신할 수 없다. 이 두 곳 때문에 confidence 를 medium 으로 낮췄다. 본문 1인칭('ITEM AM CONVINCED', 'OBTAINED BY ME')은 도쿄의 발신자를 가리키며 소련 군사사절단·말리크와의 회담이 '이곳(HERE)'에서 이루어졌다고 하므로 도쿄 총사령부 측의 소견이나, 원문에 발화자가 명시돼 있지 않아 본문에서는 추측하지 않았다. 대소(對蘇) 인식이 노골적인 문서로, '절멸(ANNIHILATION)', '짓이겨진 대중(MUTILATED MASSES)' 같은 표현은 완화하지 않고 그대로 옮겼다.", "warn": true, "pages": ["0076", "0077"], "search": "레너드 바스델(Leonard Barsdell) — 오스트레일리아 정보국(Australian Bureau of Information) 말리크(Jacob Malik) — 원문 'FORMER RUSSIAN AMBASSADOR MISTER MALIK' 해럴드 페어(Harold Fair) — 중령, 부관부, 부(副)부관감 2-C CA 52443-Conditions in North Korea."}, {"id": "2-B", "order": 202, "date": "1945-09-24", "group": "A", "eyebrow": "편철 2-B · 0078–0086면", "title": "조선의 정세", "badge": "Top Secret (첨부물은 Secret)", "list_right": "2-B", "meta": [{"k": "일자", "v": "1945-09-24"}, {"k": "발신", "v": "주한미군사령부(HQ USAFIK), APO 235 — 존 R. 하지 중장", "txt": true}, {"k": "수신", "v": "태평양미육군총사령관(CINCAFPAC)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "서한"}, {"k": "면", "v": "0078–0086 (9면) · 사본 5면"}, {"k": "건명", "v": "Conditions in Korea", "txt": true}, {"k": "색인 요지", "v": "Ltr: Conditions in Korea.", "txt": true, "wide": true}], "summary": "하지 중장이 9월 13일자 보고에 이어 맥아더에게 올린 조선 정세 보고 — 38도선 분할이 조선을 하나의 국가로 통일하는 데 넘을 수 없는 장애이며 국제적 차원의 즉각적 조치가 없으면 미국의 명예를 지키며 평화적으로 바로잡는 것이 불가능하다고 경고하고, 아울러 첨부물로 호주인 특파원의 북조선 소련 점령 실태 목격 성명서를 붙였다.", "points": ["9월 13일자 같은 건명 서한에 대한 보충 보고로, 정세의 큰 변동이 아니라 그림이 더 드러난 것이라고 규정한다.", "인천·경성 지역은 표면상 가라앉았으나 38도선 분할과 연합국의 의도에 대한 뿌리 깊은 불신이 자라고 있으며, 지각 있는 조선인 다수는 연합국이 조선 국가를 세울 의사가 없다고 결론지었다.", "나이 든 조선인들은 러일전쟁 전 러·일 간의 같은 경계선 분할 잠정 합의를 상기하며 러시아가 옛 요구를 다시 관철하려 한다고 본다.", "하지의 핵심 판단: 두 점령지대 분할은 통일의 '넘을 수 없는 장애'이며, 공동 정책 아래 점령군이 전폭 지원하는 '전면적인 임시정부'를 세우는 국제적 조치가 즉각 나오지 않으면 미국의 명예를 지키며 평화적으로 바로잡을 수 없다.", "러시아를 제외한 어느 열강도 이 문제를 진지하게 생각한 바 있는지 의심스럽다고 적었다.", "조선은 일본제국의 일부였던 적이 없으며 그렇게 취급하면 조선인의 영원한 적의를 산다. 지금이 분파를 통합하고 민주주의 교육을 시작할 '수용적 국면'이다.", "두 지역 어느 쪽도 상호 교류 없이는 자립할 수 없는데, 현재 오가는 것은 38도선 이북에서 남하하는 피난민뿐이다.", "소련과의 군사적 교섭은 거의 결실이 없고, 유일한 성과는 함흥 포로수용소 수용자 인수였다. 경성 이북에서 소련군이 송전을 끊었다.", "군정은 당분간 '완전하고 전면적'이어야 한다. 총독부 골격은 예속민 착취용이라 민주적 통치에 부적합하고, 믿기 어려운 규모의 독직·부패가 드러나고 있다.", "조선인의 자치 능력에 대한 하지의 평가가 노골적이다 — '대부분 신뢰할 수 없거나 사소한 자리 외에는 채울 능력이 없다', '교육받은 조선인조차 몽상가이자 공상가'.", "제40사단 전투단 1개가 9월 22일 인천 도착, 철도로 부산 이동 중. 부산항 개방과 석탄 확보가 관건이며 석탄이 없으면 38도선 이남 철도가 멎는다.", "부산 장악 즉시 일본군 송환을 개시하되 육상 수송 제약으로 선박 능력에 못 미칠 수 있다.", "압수 무기·탄약 처리가 중대 문제 — 소화기가 조선인 손에 들어가지 않게 하는 것은 '절대적'이며, 탄약 집적소 경비에 병력이 소모된다.", "특파원들의 러시아 관련 기사가 미국의 임무를 위태롭게 할 수 있으므로 태평양미육군 검열관에게 삭제하도록 주의를 줄 것을 요청 — 언론 검열 요청이 명시되어 있다.", "건의: (가) 9월 13일자 서한의 건의 재차 제기, (나) 조선에서 인수한 모든 무기·탄약의 파기 또는 영구 사용 불능화 권한 부여.", "[첨부물] 호주 정보부 총사령부 주재 대표 레너드 E. 바스델이 1945년 9월 15~22일 함흥·흥남에서 직접 목격한 소련군 실태 — 무차별 약탈·강간·강도, 루블-조선엔 1대 1 강제 교환, 40년 만에 조선인과 일본인이 러시아인에 맞서 가까워지는 현상, 소수 공산주의자의 러시아군 이용과 반대자 축출, 현지 징발로 연명하는 소련군, 38도선 이북으로의 전차·중장비 남하, 남하 피난민 행렬, 흥남 카바이드·화학공장의 조업 정지(1만 명 고용에서 4명), 흥남 포로수용소의 급식·송환 방치.", "[첨부물] 바스델의 결론: '조선은 두 동강 나고 있다. 북부 지대 사람들은 러시아인들을 두려워하고, 산업은 멎어 있으며, 유일한 바람은 되도록 빨리 미군 지대로 남하하는 것인 듯하다.'"], "primary": "**최고 기밀(TOP SECRET)**\n\n주한미군사령부\n군사우편번호 235\n\n1945년 9월 24일\n\n**건명: 조선의 정세**\n\n**수신: 태평양미육군총사령관**\n\n1. 같은 건명의 1945년 9월 13일자 본직의 서한을 참조바람. 본 서한은 그에 대한 보충이다. 정세의 주된 변화는 큰 변동이라기보다는 그림이 한층 더 드러나는 성격의 것이다.\n\n2. 일본인(Japs)에 대한 조선인의 태도, 그리고/또는 독립에 대한 그들의 태도에는 변화가 없다. 인천(Jinsen)-경성(Seoul/Keijo) 지역에서 조선인들은 표면상 가라앉기 시작하고 있다. 행렬과 시위가 줄었고 소리 높인 항의도 줄었다. 그러나 연합국의 의도에 대한 뿌리 깊은 불신이 자라나고 있으며, 조선을 38도선을 따라 정책이 그토록 크게 어긋나는 군대가 각각 점령하는 두 개의 점령지대로 분할한 데 대한 실질적인 불만이 자라나고 있다. 지각 있는 조선인 다수는 연합국 열강이 조선 국가를 세울 의사가 없다는 결론에 이미 도달하였다. 나이 든 조선인들은 러일전쟁(Russo-Jap War) 전에 러시아와 일본 사이에 같은 경계선을 따라 조선을 분할하기로 한 잠정 합의가 있었음을 상기하며, 러시아가 다시 그 옛 요구를 관철하려 든다고 믿는다. 지금까지의 정책에 비추어 볼 때, 조선 독립에 관한 연합국의 약속이 진실하다는 믿음을 그들에게 북돋울 만한 것은 거의 없다. 북조선에서 흘러나오는 정보는 어느 호주인 특파원이 본직에게 제시한 첨부 성명의 내용과 같은 선상에 있다.\n\n3. 무수한 정당들의 크게 엇갈리는 활동이 바람직하지 않다는 인식이 많은 조선인들 사이에서 자라나고 있는 것으로 보인다. 그러나 지금까지 이들이 실제로 줄어든 바는 없고, 다만 다수의 소리 높인 표현이 잦아들고 있을 뿐이다. 분파들 사이에 실무적 합의를 이끌어 내는 일, 그리고 서로에 대한 알력과 의심을 털어 내는 일은 여전히 불가능하다.\n\n4. 본직은 크게 어긋나는 정책 아래 조선을 두 개의 점령지대로 분할한 현 상태가 조선을 하나의 국가로 통일하는 데 넘을 수 없는 장애를 이룬다고 본다. 본직의 의견으로는, 연합국 열강은 이 분할로써 미국의 명예를 지키면서 평화적으로 바로잡는 것이 불가능한 상황을 만들어 냈다 — 공동의 정책 아래 점령군의 전폭적 지원을 받는 전면적인 임시정부를 세우기 위한 국제적 차원의 즉각적 조치가 나오지 않는 한 그러하다. 러시아를 제외한 어느 열강도 여기에 걸린 문제들을 진지하게 생각해 본 적이 있는지 의심스럽다. 조선은 일본제국의 일부가 아니며, 일본의 완전한 지배가 없었다면 결코 그 일부였던 적이 없다. 조선을 그렇게 취급하는 나라들에 대한 조선인의 영원한 적의를 사지 않고서는 그렇게 취급할 수 없다. 이 나라는 자신들을 일본인으로부터 벗어나게 해 주는 것이라면 무엇이든 받아들일 만큼 무르익어 있으나, 지난 역사 때문에 지금은 어떤 형태든 민주적 정부에, 특히 미국에 가장 호의적이다. 일본의 지배가 무너진 직후인 이 수용적 국면이야말로 분파들을 통합하고 민주주의의 형성 교육을 시작할 때이다. 대립하는 이념 아래 나라를 두 부분으로 갈라놓은 상태를 지속하는 것은 치명적일 것이다. 더욱이 두 지역 어느 쪽도 서로 간의 완전한 상호 교류 없이는 조금도 자립할 수 없다. 현재로서는 상호 교류가 없고, 다만 38도선 이북에서 피난민이 상당수 남하하고 있을 뿐이며 그 반대는 사실이 아니다.\n\n5. 군사적 차원에서 소련 측과 어떤 형태로든 실행 가능한 합의를 이루려는 노력이 계속되고 있으나 지금까지는 거의 결실이 없다. 현재까지 유일한 성과는 함흥(Kanko) 포로수용소 수용자들을 빼내 온 것인데, 이는 교섭 개시 약 열흘 뒤에, 그것도 절차를 두고 숱한 역화(逆火)와 갈팡질팡 끝에 이루어졌다. 교환할 연락반의 보고 일자와 장소에 관해서는 아직도 러시아 측의 회답을 기다리고 있다. 38도선을 따라 접촉하는 부대 간의 관계는 지난번 보고 이후 이례적인 사건이 없었으나, 다만 경성 이북의 한 지역에서 소련군이 송전을 끊은 일이 있다.\n\n6. 현시점에서 조선의 「군정(Military Government)」은 당분간 사소한 기능을 제외하고는 완전하고 전면적인 것이 되어야 할 것으로 보인다. 이곳의 종래 정부 조직 속으로 들어가 볼수록, 그 골격이 일차적으로 일본인의 지배와 예속민 착취를 위해 세워진 것이며 그 대부분이 민주적 통치에는 부적합함을 알게 된다. 믿기 어려운 규모의 독직과 부패 행위가 드러나고 있다. 정부 기구에 있던 일본인들은 거의 전부 주저앉았고, 도움이 되지 않으므로 급속히 제거되고 있다. 조선인들은 대부분 신뢰할 수 없거나 사소한 자리 외에는 채울 능력이 없다. 일반적으로 말하여 모두가, 심지어 교육받은 조선인들조차 몽상가이자 공상가로, 일을 어떻게 해내야 하는지에 관한 실제적 착상이 거의 없다. 그들의 정치사상은 쓸 만하다기보다 이상주의적이다. 우리 군정 요원을 늘리고 점령을 남부 전 도(道)로 확대할 수 있게 되면 더 분명한 그림이 드러나기를 바란다.\n\n7. 제40사단의 전투단 1개가 9월 22일 인천(Inch'on)에 도착하여 경장비 부대를 철도로 순차 부산(Fusan)에 이동시키고 있다. 사단은 열흘 내지 열이틀 안에 조선 내 집결을 마쳐야 하나, 부산항이 열리지 않는 한 그곳으로의 이동을 완료하기까지는 여러 날이 더 걸릴 것이다. 철도 시설은 제한되어 있고, 현재까지 우리가 이동할 수 있는 도로를 찾지 못했다. 본직은 최소한 전차상륙함(LST)이라도 부산에 들어갈 수 있도록 해군을 압박하고 있으며, 그렇게 되면 인천에서 환적할 수 있다. 석탄을 곧 확보하지 못하면 38도선 이남의 철도는 머지않아 운행을 중단할 수밖에 없게 될 것이다.\n\n8. 제40사단이 부산을 장악하는 대로, 본직은 일본군 부대를 항구를 통과시킬 수 있는 한 신속히 일본으로 이동시키기 시작할 것이다. 육상 수송의 제약 때문에 이 흐름은 이용 가능한 선박 수송 능력에 미치지 못할 수도 있다.\n\n9. 압수한 무기와 탄약 저장물의 처리 문제가 점점 더 중요해지고 있다. 모든 종류의 소화기(小火器)를 조선인의 손에 들어가지 않게 하는 일은 절대적으로 필요하다. 파괴 공작자를 막기 위해 탄약 집적소를 경비하는 데 다른 용도로 필요한 상당수의 병력이 소모되고 있다. 조선에서는 전투정보상 가치가 있을 소수 품목을 제외하고 탄약을 파기해야 한다고 본다.\n\n10. 특파원들의 태도는 실질적으로 개선되었다. 바람직하지 못한 유치한 부류는 대부분 더 자극적인 활동 무대로 옮겨 갔다. 남은 이들은 더 사려 깊고 미국 시민으로서의 책임을 더 의식하고 있다. 그럼에도 이들이 러시아 관련 기사를 송고하는 경향이 여전히 있는데, 그것이 게재될 경우 이곳 미국의 임무를 위태롭게 할 수 있다. 이곳의 태평양미육군(USAFPac) 검열관들에게 위험하다고 판단되는 그러한 기사를 일체 삭제하도록 귀 사령부가 주의를 주어야 한다고 본다. 특파원들은 미국 시민이 알아야 한다는 태도를 취한다. 본직도 원칙적으로는 동의하나, 시기상조의 비판적 기사는 지금으로서는 위험하다고 본다.\n\n**건의:**\n\n가. 참조 서한에 담긴 건의를 거듭 제기한다.\n\n나. 나아가 조선에서 인수한 모든 무기와 탄약을 파기하거나 영구히 사용 불능으로 만들 권한을 부여할 것을 건의한다. 이는 미군 병력의 소요를 크게 덜어 줄 것이다.\n\n[서명] 존 R. 하지\n존 R. 하지(JOHN R. HODGE)\n미육군 중장, 사령관\n\n첨부 1건 —\n  특파원 성명서\n\n---\n\n# [첨부물 — 특파원 성명서]\n\n**기밀(SECRET)**\n\n## 러시아의 북조선 점령\n\n던컨 싱클레어(Duncan Sinclair) 대령의 허가를 받아, 나는 1945년 9월 15일 미국 포로수용반(POW Recovery Unit) 대원 네 명과 동행하여 러시아 점령하 조선의 함흥(Kanko) 비행장으로 갔다.\n\n이번 여행의 목적은 그 비행장에서 8마일쯤 떨어진 흥남(Konan) 포로수용소의 영국·호주 포로들을 면담하고 그 조사 내용을 호주 정부에 보고하는 것이었다.\n\n나는 러시아 측에 나를 호주 종군기자로 소개하였고, 그 지역에서 이레 동안 머무르는 사이 어떤 방식으로도 저지받지 않았다.\n\n첫날의 조사가 매우 많은 것을 드러냈으므로, 나는 조사를 더 멀리까지 밀고 나가 러시아의 북조선 점령에 관한 진상을 알아보기로 결심하였다.\n\n내가 기록하고자 하는 바는 사실에 근거한 것이며 내가 직접 본 것에 근거한 것이지, 내가 들은 것에 근거한 것이 **아니다**.\n\n내가 알아낸 바는 이러하다:—\n\n1) 러시아인들은 만주 국경에서부터 함흥·흥남 공업지구 이남 지역에 이르기까지 조선인과 일본인의 재산을 가리지 않고 광범위하게 약탈하고 있으며, 무력으로 조선인과 일본인 양쪽을 상대로 강간과 강도를 자행하고 있다.\n\n2) 러시아인들은 함흥과 흥남에서 조선 엔(Korean Yen)을 러시아 루블 및 코페이카(?)로 바꿔치우고 있으며, 교환 비율은 1대 1이다.\n\n3) 함흥과 흥남에서 러시아인들의 태도는 40년 만에 처음으로 일본인과 조선인을 한데 묶어 놓고 있다.\n\n4) 함흥과 흥남 인구의 약 10분의 1을 차지하는 공산주의자들은 러시아인의 도래를 이용하고 있으며, 자기들의 목적을 이루기 위해 러시아인을 쓰고 있다.\n\n5) 러시아인들은 자신들이 점령한 땅에 기대어 먹고살고 있으며, 자기네 보급품은 쌀·[겹쳐 친 글자]·콩가루·쌀빵과 약간의 채소(주로 배추)로 이루어진 얼마 안 되는 양만 쓰고 있다.\n\n6) 러시아인들은 남쪽으로 — 즉 함흥·흥남 이남 지역으로 — 전차·기관총·대형 트럭 같은 중장비와 장비를 들여오고 있다.\n\n7) 러시아의 점령은 수천 명의 조선인과 일본인을 미군 지대로 남하하게 몰아가고 있다. 또 하나의 결과는 산업 활동이 거의 완전히 멎은 데서 나타난다.\n\n8) 흥남 수용소의 포로들은 수용소를 스스로 운영하도록 허용되었으나 러시아 측은 식량을 거의 주지 않고 대부분 알아서 살아가도록 내버려 두었으며, 미국 포로수용반 대원들이 요청하기 전까지는 포로 송환을 위해 아무것도 하지 않았다.\n\n**1)** ....이레 연속으로 나는 함흥·흥남 지구와 그 남쪽·북쪽 지역에서 러시아인들이 약탈하는 것을 보았다. 한 번은 내가 청하여 약탈대에 동행하는 것을 허락받았다. 방식은 이러하였다. 기관단총으로 무장한 러시아인들이 조선인 또는 일본인의 집으로 차를 몰고 가서 공중에 몇 발을 쏘고는 집으로 밀고 들어가, 찾아낼 수 있는 여자들(대개 어린 처녀들)을 끌어내어 가구며 눈에 든 다른 물건들과 함께 트럭에 싣고 자기네 병영으로 몰고 간다. 하루나 이틀 뒤면 그 처녀들은 거리에 내던져진다.\n\n내가 약탈대에 동행한 그날, 러시아인이 울고 있는 어린 처녀를 끌어내기에 나는 항의하였다. 그들은 웃으면서 내게 총을 의미심장하게 흔들어 보이고는 하던 일을 계속하였다. 그들은 어린 처녀만 끌어낸 것이 아니라 사진기 한 대, 기모노 두 벌, 방석 몇 개, 그리고 게이샤를 본뜬 작은 장식물 몇 개도 들고 나왔다.\n\n그들은 대개 밤에 약탈하였고 누가 끼어들려 하면 호전적으로 굴었다.\n\n일본인들이 쫓겨난 뒤로 인근의 조선인·일본인 여자 수백 명이 포로들을 먹이는 것을 도왔다. 처음에는 건전한 방식으로 포로들과 물물교환을 하여, 포로들이 조선 엔을 주고 달걀·토마토·감자 따위 — 삼 년 반 동안 맛보지 못한 음식 — 를 샀다. 그러나 시간이 지나면서 여자들은 아무 대가도 바라지 않고 포로들에게 음식을 가져다주게 되었다. 그들은 포로들이 자기네 친구이고 러시아인들이 자기네 적이라고 말하였다.\n\n일본어를 잘하는 포로들은 일본인 집과 조선인 집, 특히 일본인 집에 초대를 받는 일이 많았다. 러시아인들이 그들이 들어가는 것을 보면 자기들도 들어가겠다고, 그리고 여자를 내놓으라고 요구하곤 하였다. 내가 수용소에 있던 어느 날 밤 상황이 어찌나 험악해졌던지 수용소장(스코틀랜드 글래스고 출신 조지 킨로크(George Kinloch) 대위)은 그 뒤로 밤에 나가는 것을 금하였다. 그의 조치는 내 생각에 현명하였다. 포로들은 한 사람도 빠짐없이 국적을 가리지 않고 어떤 여자든 지키려고 나섰을 터이고, 그리 되었더라면 유혈로 이어졌을지도 모르기 때문이다.\n\n다른 경우들에는 러시아인들이 조선인이나 일본인을 일부러 수레에서 밀쳐 내고 멍에에서 소를 풀어 끌고 가는 것을 보았다. 아마도 잡아먹으려는 것이었으리라.\n\n러시아인들에게는 공포 행위가 예사인 듯하다. 그들은 일본인에게서 징발한 트럭을 타고 기관단총으로 무장한 채 사람 많은 구역으로 달려들어 군중이 비명을 지르며 흩어질 때까지 몇 발씩 쏘아 댄다.\n\n**2)** ....9월 18일 러시아인들은 돌연 조선 엔을 루블로 바꾸기 시작하였다(물론 일본 엔은 조선에서 휴지다). 이 사정을 듣고 나는 차를 얻어 타고 함흥으로 들어가 알아보았다. 시드니 출신의 빌 파이크(Bill Pyke) 하사라는 포로가 다가와 조선 엔을 주고 방금 받았다는 루블 한 움큼을 보여 주었다. 그는 1대 1 비율로 바꿔 주었다고 말하였다. 또 러시아인들이 조선인들에게 돈을 강제로 바꾸게 하고 있다고도 말하였다.\n\n나는 교차로 근처에서 빈둥거리는 러시아인에게 다가가 1엔짜리 지폐 다섯 장을 내밀었다. 그는 즉시 내 팔을 붙들어 러시아군 위병소로 밀어 넣었고, 그곳에서 내 엔은 손에서 낚아채이고 루블이 대신 쥐여졌다.\n\n이튿날 나는 함흥의 장터에 가서 러시아인들이 종이 루블을 자루째 들고 다가와 사람들에게 엔을 내놓으라고 강요하는 것을 보았다. 어느 경우에나 교환 비율은 1대 1이었다. 조선인들은 분명 러시아 돈을 원하지 않았고, 몇 사람은 내게 다가와 루블을 내밀며 손짓으로 엔을 달라는 뜻을 나타냈다. 나는 수용소로 돌아와 영국인 장교 몇에게 새 환율 이야기를 하였다. 그들은 앞서 말한 비율로 엔을 루블로 바꿀 수 있다면 지금 당장 엔을 바꾸는 것이 이익이 되겠다는 데 동의하였다. 그들은 1,500엔가량을 가지고 가서 같은 액수를 루블로 받았다. (옛 환율로는 …… 1934년경 …… 루블은 영국 시장에서 2실링 4펜스, 호주 시장에서 2실링 8펜스쯤이었다. 이는 1달러의 3분의 1을 조금 넘는 값이다. 다시 말해 루블은 조선 엔의 세 배쯤 값이 나간다.\n\n이 결과를 시험해 보려고 나는 어느 조선 여인에게서 사과 하나를 반 엔(50전)에 샀다. 이튿날 나는 그동안 러시아인들이 그 여인의 돈을 루블로 바꾸게 했음을 알고 같은 자리를 찾아갔는데, 값으로 반 루블을 불렀다. 반 루블이 없어서 나는 그 여인에게 50전을 내밀었다. 여인은 문밖을 살피더니 서둘러 지폐를 받고 사과를 주었다. 그때 나는 통역을 데리고 있었다. 그는 일본어로 말하였다.\n\n포로들은 자기네 루블을 호주 돈이나 영국 돈으로 바꾸기를 바라고 있다. 반값(옛 환율)으로라도 바꿀 수 있다면 상당한 이익을 볼 것이다.\n\n**3)** .... 흥남에서 나는 어느 일본인 집을 방문하여 차를 대접받았다. 같은 집에 머무는 조선인 두 사람을 소개받았다. 그 일본인은 자기와 두 조선인이 상인이라고 말하였다. 전쟁 동안에는 서로 적이었으나 러시아인들이 온 뒤로는 친구가 되었고, 앞으로 무슨 일이 있어도 친구로 지내며 사이좋게 장사할 작정이라고 하였다. 나는 그들이 진심으로 하는 말이라고 충분히 확신하였다. 그때 수용소장 킨로크 대위가 나와 함께 있었다. 그가 조선인들의 말을 통역하였고, 일본인은 영어를 하였다.\n\n함흥에서도 같은 것을 보았다 — 조선인과 일본인이 러시아인에 맞서 서로 가까워지는 것을.\n\n포로수용소에는 조선인·일본인 여자들이 날마다 선물을 들고 찾아왔다. 이는 마지막 사흘 동안 특히 두드러졌다. 조선 여인과 일본 여인이 서로에게 선물을 나눠 주어 저마다 포로들에게 같은 값어치의 물건을 줄 수 있게 하는 광경을 흔히 볼 수 있었다.\n\n가장 많은 것을 드러낸 장면은 9월 21일, 포로들이 귀향길의 첫 구간으로 러시아 트럭에 실려 함흥역으로 갈 때였다고 생각한다. 삼엄한 러시아군 경계 아래였음에도 — 트럭마다 기관단총으로 무장한 러시아인 두 명이 탔다 — 조선인과 일본인들이 길가에 늘어서서 손을 흔들며 환호하였다. 몇몇은 드러내 놓고 울었고, 많은 이들이 성조기와 태극기를 흔들었다. 역에서도 마찬가지였다. 러시아인들이 군중을 멀리 떼어 놓았는데도 주민들은 열차가 떠날 때 환호하고 박수를 쳤다. 참으로 감동적이었다. 그들은 포로들을 자기네 친구로 여겼다. 특히 여자들은 곤경에 처했을 때 포로들에게 도움을 청하곤 하였다.\n\n여기에 덧붙이자면, 수용소 군의관인 캐나다인 조지 모리스(George Morris) 대위 — 싱가포르에서 포로가 되기 전에는 인도 의무부대에 배속되어 있었다 — 는 포로들이 수용소를 스스로 맡게 된 뒤로 날마다 수십 명의 일본인·조선인 여자와 아이들을 치료하였다. 그는 누구도 물리치지 않았다. 이는 포로들이 떠날 때까지 계속되었다. 그의 이름이 널리 퍼져 10마일 떨어진 곳에서까지 여자들이 그를 찾아왔다.\n\n**4)** ....러시아 점령하 조선의 공산주의 세력은 작지만 목소리가 매우 큰 소수파다. 그것은 자기 목적을 이루기 위해 러시아인을 이용하고 있다. 예컨대 나는 조선인 공산주의자들이 러시아인 두 명을 뒷배로 세우고 어느 조선인에게 반공주의자냐고 묻는 것을 보았다. 그가 공산주의자들과 아무 관계가 없다고 부인하자 그는 붙들려 몸수색을 당하고 돈을 빼앗겼으며 함흥에서 나가라는 명령을 받았다. 그때 오간 말을 알아듣고 내게 옮겨 준 포로가 함께 있었다. 우리는 그 무리를 따라가 또 다른 조선인이 자기 집에서 쫓겨나는 것을 보았다. 이튿날 내가 다시 가 보니 공산주의 조선인들이 그 집을 차지하고 있었고, 원래 주인은 입은 옷 말고는 아무것도 없이 쫓겨나 있었다.\n\n나는 이런 사례의 증거를 많이 보았다. 모든 경우에 러시아인들이 적극적으로 관여했음을 확인할 수 있었다.\n\n또 나는 러시아인들이, 내 생각으로는 어리석게도 러시아가 조선을 차지하는 데 찬성하지 않는다고 말한 어느 조선인을 집에서 쫓아내는 것을 보았다. 내가 확인한 여러 사례에서, 당사자가 명시적 발언으로든 암시로든 친러시아가 아니라고 말한 경우에는 즉시 집에서 쫓겨나 남으로 가라는 말을 들었음을 확인할 수 있었다.\n\n나는 함흥을 막 벗어난 곳에서 남쪽으로 걸어가고 있던 조선인 두 사람, 둘 다 노인인 이들을 면담하였다. 통역을 통해 그들은 러시아인들에게 집에서 쫓겨났다고 말하였다. 입은 옷과 30엔이 그들의 전 재산이었다.\n\n**5)** ....러시아인들은 무차별적인 강탈로 필요한 식량을 전부 얻는다. 나는 어느 날 함흥 시내를 되는대로 돌아다니는 러시아군 순찰대에 실제로 동행하였다. 갑자기 트럭이 어느 농가 쪽으로 방향을 틀더니 러시아인들이 우르르 뛰어내려 총을 쏘기 시작하였다. 그들은 기관단총 여러 정의 탄창을 한꺼번에 맞은 돼지 다섯 마리를 들고 돌아왔다.\n\n트럭은 계속 갔다. 닭장을 하나 들러 닭 몇 마리를 거둬들였다. 주인의 의사는 묻지 않았다. 그것은 명백한 강도짓이었다.\n\n나는 러시아인들이 채소밭에 들어가, 값을 치르지 않으면 자기와 가족이 굶는다는 농부의 애원에도 아랑곳없이 밭을 몽땅 걷어 가는 것을 보았다. 그러나 러시아인들은 걷어 가는 식량에 값을 치르지 않는다. 적어도 나는 그들이 값을 치르는 것을 본 적이 없고, 조선인들도 러시아인들이 가져간 가축과 채소에 대해 아무것도 받지 못했다고 내게 말하였다.\n\n어느 날 나는 함흥의 러시아군 사령부에서 그들과 점심을 먹었다. 그곳은 말로 못 할 만큼 더러웠다. 음식은 쌀과 배춧국, 그리고 일종의 부침개였다. 그들은 물론 통역을 통해, 조선인들에게서 가져온 닭과 돼지고기는 전날 밤 큰 잔치에서 다 먹어 치웠다고 내게 말하였다. 또 자기네 식량 대부분이 조선인들에게서 나온다고, 자기들은 쌀과 약간의 곡물가루, 아주 적은 채소만 가지고 왔을 뿐이라고 말하였다.\n\n**6)** .... 러시아 전차와 대형 트럭, 그 밖의 기동 장비가 함흥을 지나 남쪽으로 이동하고 있다. 내가 그 지역에 있는 동안 날마다 병력과 장비를 실은 열차가 남하하는 것을 보았다. 오늘 열차에서는 38도선 바로 위 지점들에 러시아 장비·차량·보급품 따위가 집적되어 있는 것을 보았다. 전쟁이 끝난 마당에 왜 전차를 들여오는지 나로서는 이해할 수 없다. 일본인들은 잠잠하다. 어차피 싸울 무기가 없다. 러시아인들이 평화 초기에 그렇게 만들어 놓았다. 일본인 수용을 위한 큰 억류소들이 설치되고 있다. 내가 듣기로 그 수용소에서 러시아인들은 넉넉한 양의 쌀을 지급한다고 하나, 내가 본 만주 국경에서 돌아오는 일본인들은 굶주려 있어서 어느 포로가 작은 사탕 하나를 내밀자 떼로 달려들 뻔하였다. 전에 호주에서 양모 매입상을 했다는, 영어를 훌륭하게 하는 어느 일본인은 24시간 동안 아무것도 먹지 못했고 사흘 동안 거의 먹지 못했다고 말하였다. 그는 러시아인들이 — 대개 젊은 농민들이었다 — 자기들을 가축처럼 몰고 왔다고 하였다. 러시아인들은 먹을 것이 넉넉하고 말을 탄 반면 일본인들은 빈속으로 발을 맞춰야 했다는 것이다.\n\n**7)** ....함흥에서 미군 전선에 이르기까지 온 노선을 따라 조선인과 일본인 피난민의 물결이 남쪽으로 이어지고 있다. 내가 면담한 몇 사람은 두려워하는 러시아인들에게서 달아나는 중이라고 말하였다. 그들의 유일한 바람은 미군 점령하의 조선에 닿는 것이었다. 나는 이 행렬을 함흥을 막 벗어난 곳에서 보았고, 만주 국경에서 함흥으로 들어오는 것도 보았으며, 남쪽으로 200마일쯤 떨어진 미군 지대로 들어서는 것도 보았다. 그 행렬이 그 거리 내내 끊이지 않고 이어진다고 말하려는 것은 아니지만, 의미심장한 일이다. 조선인에 대한 러시아인들의 태도는 산업, 특히 함흥과 흥남 일대의 산업에 영향을 미쳤다. 내가 9월 20일과 21일 흥남의 큰 카바이드 공장을 방문했을 때 여섯 기의 노(爐) 가운데 하나만 가동 중이었고 그나마 반쯤만 돌아가고 있었다. 21일에는 몇 마일에 걸친 공장 구내에서 겨우 네 사람을 헤아렸을 뿐이다. 일본인들이 차지하고 있을 때 이 공장은 1만 명가량을 고용하고 있었다. 화학공장도 마찬가지다. 9월 21일 몇몇 조선인이 걸어 다니는 것을 빼면 온 구내가 놀고 있었다. 조선인들 말로는, 러시아인들이 예상대로 공장을 접수하면 자기들은 낮은 삯에 고된 노동을 강요받으리라는 것이다. 그들은 러시아인 밑에서 일하고 싶지 않기 때문에, 러시아인들이 굳이 공장을 다시 돌리려 들지 않기를 [바라며] 일을 놀리고 있다.\n\n**8)** ....러시아인들이 흥남 포로수용소에서 일본인들을 쫓아낸 8월 29일부터 포로들이 인천(Jinsen)으로 떠난 9월 21일까지, 러시아 측이 수용소에 공급한 식량은 쌀·기장·일본제 통조림 생선 사흘분 배급과 돼지 한 마리, 작은 소 두 마리가 전부였다. 포로들은 B29기의 투하 보급과 수용소 인근 조선인·일본인에게서 얻을 수 있는 것에 의존해야 했다.\n\n러시아인들은 포로 송환을 위해 아무것도 하지 않았다. 온갖 것을 약속했으나 아무 일도 일어나지 않았다. 첫 번째 사건은 B29기 한 대가 야크(Yak) 전투기에 사실상 격추당했을 때 일어났다. 두 번째 사건은 우리 일행이 도착하여 포로들에게 이삼 일 안에 모두 귀향길에 오를 것이라고 알렸을 때 일어났다. 그들이 실제로 움직이기까지는 이레가 걸렸다. 러시아인들 덕분이다.\n\n러시아인들이 마침내 움직였을 때는 요란하게 생색을 냈다.\n\n내 총평은 이러하다. 내가 본 러시아인들은 가난한 농민 부류로, 지저분하고 단정치 못했으며 조직도 지휘도 없었다. 옷차림이나 얼굴·목의 때로 보아 몇 달째 씻지 않은 자들도 있었다. 그들은 모두 호전적으로, 얼마간 허세를 부리며 행동했으나 열등감을 지니고 있음이 쉽사리 보였다. 그들이 하는 일에는 어떤 방식도 없었다. 약탈할 때 — 꽤 자주 그랬는데 — 그것은 아주 무차별적이었다.\n\n러시아인들 가운데 더러는 몽골인처럼, 오히려 타타르인처럼 생겼다. 그들은 파리가 사방에 들끓는 더러움 속에서 밥을 먹었고, 장교들조차 그러했으며, 몇 달째 빨지 않은 옷을 입고 있었다.\n\n몇몇은 베를린 지구에서 막 돌아왔다고 내게 말하였다. 그것으로 옷의 상태는 설명될지 몰라도 피부의 때는 설명되지 않는다. 훈장을 단 자들이 많았다. 몇몇은 모스크바 전투에서 싸웠다고 하였고, 몇몇은 그곳의 독일군이 패퇴할 때 스탈린그라드에 있었다고 하였다.\n\n함흥과 흥남에서 내가 간 곳마다 주민들은 미국인들이 들어와 접수하기를 바라고 있었다. 일본인과 조선인 모두 이를 원한다. 내가 그곳에 있는 동안 날마다 미국이 40도선까지 이 나라를 접수할 것이라는 소문이 빠르고 무성하게 나돌았다.\n\n자기네 정치적 목적을 위해 러시아를 열렬히 지지하는 소수를 제외하면, 사람들은 친미적이며 미국이 조선 전체를 접수하기를 바라고 있다.\n\n두 지대를 관찰한 바로부터 나는 조선이 두 동강 나고 있다고 단언한다. 북부 지대의 사람들은 러시아인들을 두려워하고 있고, 산업은 멎어 있으며, 유일한 바람은 되도록 빨리 미군 지대로 남하하는 것인 듯하다.\n\n/서명/ 레너드 E. 바스델(Leonard E. Barsdell)\n\n레너드 E. 바스델\n호주 정보부(Department of Information) 총사령부 주재 대표", "secondary": "TOP SECRET\n\nHEADQUARTERS\nUNITED STATES ARMY FORCES IN KOREA\nAPO 235\n\n24 September 1945\n\nSUBJECT: Conditions in Korea.\n\nTO : Commander-in-Chief, United States Army Forces, Pacific.\n\n1. Reference is made to my letter 13 September 1945, same subject. This is supplemental thereto. The principal changes in conditions are in the nature of a further unfolding of the picture rather than in the way of any great shifts.\n\n2. There is no change in the attitude of Koreans toward the Japs and/or in their attitude toward independence. In the Jinsen-Seoul (Keijo) area Koreans are beginning to settle on the surface. There are fewer parades and demonstrations and fewer vocal remonstrances. However, there is a growing deep-seated distrust of Allied intentions concerning, and real dissatisfaction with the division of Korea along the 38° line into two occupation zones occupied by forces with such widely divergent policies. Many intelligent Koreans have already reached the conclusion that the Allied Powers have no intention of building up a Korean nation. Older Koreans recall a tentative agreement between Russia and Japan before the Russo-Jap War for division of Korea along same boundary, and believe Russia is again making a bid for its old demand. Based upon policies to date there is little to encourage them in the belief that the Allied promise of Korean independence is sincere. Information coming out of Northern Korea is along the line of the attached statement presented to me by an Australian news correspondent.\n\n3. There appears to be a growing realization on the part of many Koreans that the widely divergent activities by the multitudinous political parties are undesirable. However, there is no real reduction of these to date except that vocal expression of many is lessening. It is still impossible to get working agreements between factions and to shake out the cross-currents and suspicions of one against the others.\n\n4. I consider the current division of Korea into two occupational zones under widely divergent policies to pose an insurmountable obstacle to uniting Korea into a nation. In my opinion the Allied Powers, by this division, have created a situation impossible of peaceful correction with credit to the United States unless immediate action on an international level is forthcoming to establish an overall provisional government which will be fully supported by the occupation forces under common policy. It appears doubtful if any of the Powers with the exception of Russia has given serious thought to the problems involved. Korea is not and without full Japanese control was never a part of the Japanese Empire, and cannot be so treated without the everlasting enmity of Koreans toward those nations who so treat them. The country is ripe for anything that releases them from the Japanese, but because of past history are now most favorable toward some type of democratic government and particularly toward the United States. During this receptive phase immediately following the breach of Japanese control is the time to unite factions and begin formative education in democracy. Continuation of separation of the country into two parts under opposed ideologies will be fatal. Furthermore, neither of the two sections is in any degree self-supporting without full reciprocity between them. At present there is no reciprocity except that refugees from north of 38° are coming south in considerable numbers and the reverse is not true.\n\n5. Continuing, but so far almost unfruitful effort is being made to establish some sort of workable agreement with the Soviets on a military level. To date the only accomplishment has been to get out the occupants of the Kanko Prisoner of War camp which was accomplished approximately ten days after negotiations were started and after much backfiring and vacilation on arrangements. I am still awaiting word from Russians on dates and places for reporting of exchanged liaison parties. Relationships of contact troops along the 38° line have been without unusual incidents since last report except that electric power was turned off by Soviet forces in an area north of Seoul.\n\n6. It appears at this time that the \"Military Government\" in Korea will for the time being have to be complete and entire except for minor functions. As we get into the structure of what was the government here, we find that the framework was built primarily for Japanese control and exploitation of a subject people and most of it is unsuitable for democratic rule. Graft and corrupt practices on an unbelievable scale are being uncovered. The Japanese in the governmental setup have almost all folded and are being rapidly removed as of little assistance. The Koreans are mostly untrustworthy or incapable of filling any except minor positions. Generally speaking, all, even the educated Koreans, are dreamers and visionaries with few practical ideas of how to do things. Their political ideas are more idealistic than usable. As we are able to increase our Military Government personnel and increase our occupation to include all the southern provinces, it is hoped that a clearer picture may unfold.\n\n7. One combat team of the 40th Division arrived at Inch'on on 22 September and is moving light forces by increment by rail to Fusan. The division should close in Korea within ten to twelve days, but unless the port at Fusan is opened, will not be able to complete its movement there for many days later. Rail facilities are limited and to date we have not found any road by which we can move. I am pressing the Navy to open Fusan to LST's at least, in which case I can transship from Inch'on. If coal cannot be obtained soon, the railways will soon be forced to suspend action south of 38°.\n\n8. As soon as the 40th Division establishes control of Fusan, I will start movement of Japanese forces to Japan as rapidly as they can be passed through the port. Because of limitations in land transport this flow may be less than the shipping capacity available.\n\n9. The problem of handling depossessed arms and ammunition stores is assuming more and more importance. The necessity for keeping all types of small arms out of the hands of Koreans is absolute. The guarding of ammunition dumps to keep out saboteurs consumes a considerable number of troops needed for other purposes. It is believed that in Korea munitions should be destroyed except such few items as may have combat intelligence value.\n\n10. The attitude of news correspondents has improved materially. Most of the undesirable juvenile minded ones have moved on to more exciting fields of endeavor. Those remaining are more thoughtful and more mindful of their responsibility as American citizens. There is still a tendency for them to send in Russian stories which if published may jeopardize the American mission here. It is believed USAFPac censors here should be warned by your headquarters to suppress all such as are considered dangerous. Correspondents take the attitude that United States citizens should be informed. I agree in principle, but believe premature critical stories are dangerous now.\n\nRecommendations:\n\na. Recommendations contained in reference letter are reiterated.\n\nb. It is further recommended that authority be granted for destruction of or rendering permanently useless all arms and munitions taken over in Korea. This will greatly relieve need for United States troops.\n\n[signed] John R. Hodge JOHN R. HODGE, Lieutenant General, U. S. Army, Commanding.\n\n1 Incl Statement of News Correspondent.\n\nTOP SECRET\n\n===================================================================== INCLOSURE - Statement of News Correspondent =====================================================================\n\nSECRET\n\nRussian Occupation of Northern Korea With the permission of Colonel Duncan Sinclair, I accompanied four members of an American POW Recovery Unit, on September 15, 1945, to Kanko strip in Russian-occupied Korea.\n\nThe object of my trip was to interview British and Australian prisoners' of war in Konan POW camp about eight miles from the strip, and report the nature of my findings to the Australian Government.\n\nI represented myself to the Russians as an Australian war correspondent, and during my seven days' sojourn in the area was not obstructed in any way.\n\nMy first days investigation was so revealing that I decided to pursue my inquiries further afield and learn the true facts about the Russian occupation of Northern Korea.\n\nWhat I wish to record is based on fact and what I saw personally and NOT on what I heard.\n\nThis is what I learned:-\n\n1) That the Russians, from the Manchurian border to areas below Kanko and Konan industrial districts, are indulging in widespread and indiscriminate looting of both Korean and Japanese property; and are indulging in rape and robbery of both Korean and Japanese by armed force.\n\n2) The Russians are substituting, in Kanko and Konan, Russian Roubles and Kopacs (?) for Korean Yen, the substitution being one for one.\n\n3) In Kanko and Konan the attitude of the Russians is bringing together Japs and Koreans...for the first time in 40 years.\n\n4) Communists, who represent about one-tenth of the population of Kanko and Konan, are taking advantage of the advent of the Russians and are using the Russians to further their ends.\n\n5) The Russians are living off the land they have occupied, and are using only meagre quantities of their own supplies which consist mainly of rice, [struck over], bean meal, rice bread, and a few vegetables, principally cabbages.\n\n6) The Russians are bringing south--that is, to areas below Kanko and Konan- Heavy armament and equipment, such as tanks, machine-guns, heavy trucks.\n\n7) The Russian occupation is forcing thousands of Koreans and Japanese to trek south to the American zone. Another result is seen in the almost complete cessation of industrial enterprises.\n\n8) The POWs in Konan camp were allowed to run the camp themselves but were given little food by the Russians who left them to fend for themselves for the most part, and did nothing, until representations were made by members of the American Recovery Unit, to repatriate the prisoners.\n\n1)....On seven successive days I saw Russians looting in Kanko and Konan districts, and areas to the south and north. On one occasion I asked, and was allowed to accompany a looting party. The procedure was this: The Russians, armed with tommy-guns, would drive up to a Korean or Japanese house, fire a few shots in the air, then break into the house, drag out what women (mostly young girls) they could find, put them into the truck along with furniture and any other articles that caught their eyes, and drive off to their barracks. After a day or two the girls are thrown on the street.\n\nOn the occasion I accompanied the lotting party I protested when the Russian brought forth a young girl in tears. They laughed, waved their guns at me significantly, and carried on with their business. They not only brought out a young girl; they brought out a camera, two kimonos, some cushions and some small ornaments representing geisha girls.\n\nThey usually looted at night and acted belligerently if anyone tried to interfere.\n\nMany hundreds of Korean and Japanese women in the vicinity helped feed the prisoners after the Japs were thrown out. At first they bartered with the prisoners in a healthy way, the latter paying in Korean yen for eggs, tomatoes, potatoes, etc.--food they hadn't tasted in three and a half years. As time went on, however, the women would bring food to the prisoners without seeking anything in return. They said the prisoners were their friends, and the Russians their enemies.\n\nMany prisoners, who spoke Japanese well, were asked to visit Jap and Korean homes, but more particularly Japanese. If Russians saw them entering they (the Russians) would demand entrance, too, and a woman. The position became so electric one night while I was at the camp that the camp commandant (Captain George Kinloch, of Glasgow, Scotland) henceforth denied the men to leave at night. His action, in my opinion, was a wise one, because the prisoners to a man would stand up to defend any woman, regardless of her nationality. And this may have led to bloodshed.\n\nOn other occasions I saw Russians deliberately knock a Korean or a Jap from his cart, remove the ox from the shafts and take it away, presumably to be killed for food.\n\nTerrorism seems to be the order of the day with the Russians. They go around in Jap-commandeered trucks, armed with tommy-guns, dash into a populous district and fire off several rounds until the crowd has fled screaming.\n\n2)....On September 18 the Russians suddenly began exchanging Roubles for Korean Yen (the Jap yen, of course, is worthless in Korea). When I heard of this circumstance I hitch-hiked into Kanko and made inquiries. A prisoner names Sergeant Bill Pyke, of Sydney, came up and showed me a handful of roubles he had just received for Korean yen. He said they had been exchanged at the rate of one for one. He also told me that the Russians were forcing the Koreans to exchange their money.\n\nI went up to a Russian lounging near an intersection and held out five single yen notes. He immediately grabbed my arm and propelled me to a Russian guard house where my yen were snatched from my hand and roubles thrust in.\n\nNext day I went to the market place in Kanko and saw Russians approach with bags of paper roubles and force the people to hand over their yen. In every case the rate of exchange was one for one. The Koreans obviously didn't want the Russian money and some came to me holding out the roubles and by signs indicated they wanted me to hand them yen. I returned to camp and told some of the British officers about the new exchange rate. They agreed that if they could get roubles for yen at the rate aforementioned they would be on a profit-making basis if they exchanged their yen forthwith. They took with them some 1500 yen and received a like sum in roubles. (at the old rate of exchange...about 1934...roubles were worth about 2/4d on the English market and about 2/8d on the Australian market. That is slightly more than one-third of a dollar. In other words the rouble is worth about three times that of the Korean yen.\n\nTo test the result of this I bought an apple from a Korean woman for half a yen (50 sen). Next day I visited the same place, knowing that the Russians in the meantime had made the woman exchange her money for roubles, and w[as] charged half a rouble. Not having a half rouble on me I offered the woman 50 sen. She looked out the door, then hurriedly took the note and gave me the apple. I had an interpreter with me at the time. He spoke in Japanese.\n\nThe prisoners hope to change their roubles for either Australian or English money. If they can at even half the price (the old rate) they will make a substantial profit.\n\n3).... At Konan I visited a Japanese house and was invited to drink tea. I was introduced to two Koreans who stayed in the same house. The Jap told me that he and the two Koreans were traders. During the war they were enemies, but since the coming of the Russians they were friends, and intended to be friends and trade amicably in the future no matter what happened. I was quite convinced they meant what they said. Captain Kinloch, the camp commandant was with me at the time. He translated for the Koreans, the Jap spoke English.\n\nAt Kanko I met the same thing--Koreans and Japs befriending each other against the Russians.\n\nAt the POW camp Korean and Japanese women visited the camp every day with presents. This became particularly noticeable the last three days. It was a common sight to see a Korean and a Jap woman issuing presents to each other so that they each would be able to give the prisoners the same value in tokens.\n\nI think the most revealing scene occurred on September 21 when the prisoners were taken in Russian trucks to Kanko
