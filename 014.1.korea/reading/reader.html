<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>014.1 Korea — 열람기</title>
<style>
:root{
  --bg:#eef1f4; --panel:#f7f9fa; --edge:#ccd4da; --edge-soft:#dde4e9;
  --ink:#16202a; --ink-2:#4a5b68; --ink-3:#71828f;
  --stamp:#8c2f39;            /* 기밀등급 도장의 자주색 */
  --link:#2f5d86;
  --a:#4a7c59; --b:#8a6d3b; --c:#3f6d8c; --d:#7a4a6b; --e:#5a6f7d; --x:#8a8f94;
  --term-line:#9db0c2; --term-bg:rgba(47,93,134,.05);
  --term-line-go:#7fa3c4; --term-bg-go:rgba(47,93,134,.10);
  --term-bg-on:rgba(47,93,134,.17);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",
         -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
    --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
    --stamp:#c9707a; --link:#7fb0da;
    --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
    --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
    --term-bg-on:rgba(127,176,218,.22);
    --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
  }
}
:root[data-theme="dark"]{
  --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
  --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
  --stamp:#c9707a; --link:#7fb0da;
  --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
  --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
  --term-bg-on:rgba(127,176,218,.22);
  --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--link)}

.wrap{display:grid;grid-template-columns:minmax(300px,25%) 1fr;height:100vh}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{max-height:42vh}
}

/* ── 좌측 목록 ─────────────────────────────── */
.rail{border-right:1px solid var(--edge);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
.rail-head{padding:14px 14px 10px;border-bottom:1px solid var(--edge-soft);
  display:flex;flex-direction:column;gap:8px}
/* 문서철에 들어오면 나갈 길이 있어야 한다 */
.home{display:inline-flex;align-items:center;gap:5px;text-decoration:none;
  color:var(--link);font-size:11.5px;font-family:var(--mono);
  letter-spacing:.04em;width:fit-content;
  background:var(--term-bg-go);border:1px solid var(--term-line-go);
  border-radius:999px;padding:2px 10px 2px 8px}
.home:hover{background:var(--term-bg-on);border-color:var(--link)}
.home span{font-size:12px;line-height:1}
.brand{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font-weight:400;letter-spacing:0;text-transform:none;
  color:var(--ink-3);font-size:11.5px;margin-top:2px}
input[type=search]{width:100%;padding:7px 10px;border:1px solid var(--edge);
  border-radius:3px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
input[type=search]:focus,button:focus-visible,.item:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--edge);background:transparent;color:var(--ink-2);
  border-radius:999px;padding:2px 9px;font-size:11.5px;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sortbar{display:flex;gap:10px;font-size:11.5px;color:var(--ink-3);align-items:center}
.sortbar button{background:none;border:none;color:var(--ink-3);cursor:pointer;
  font:inherit;padding:0;border-bottom:1px solid transparent}
.sortbar button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.list{overflow-y:auto;flex:1;min-height:0}
.item{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--edge-soft);border-left:3px solid transparent;
  padding:9px 13px;cursor:pointer;font:inherit;color:inherit}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--bg);border-left-color:var(--ink)}
.item.tA{border-left-color:var(--a)} .item.tB{border-left-color:var(--b)}
.item.tC{border-left-color:var(--c)} .item.tD{border-left-color:var(--d)}
.item.tE{border-left-color:var(--e)} .item.tX{border-left-color:var(--x)}
.item-top{display:flex;justify-content:space-between;gap:8px;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.item-sum{font-size:12.5px;line-height:1.45;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── 우측 본문 ─────────────────────────────── */
.main{overflow-y:auto;min-height:0}
.toolbar{position:sticky;top:0;z-index:5;background:var(--panel);
  border-bottom:1px solid var(--edge);padding:8px 26px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px}
.toolbar .grow{flex:1}
.seg{display:flex;border:1px solid var(--edge);border-radius:3px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 11px;cursor:pointer;
  font:inherit;font-size:12px;color:var(--ink-2);border-right:1px solid var(--edge)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.srcline{padding:10px 26px 0;font-size:11px;color:var(--ink-3);line-height:1.5}

/* ── 연대 바 ───────────────────────────────
   5년 반을 한 줄에 욱여넣으면 1945년 8월 열흘은 0.5% 밖에 안 된다. 그래서
   줄을 늘여 놓고 **띠 자체를 움직인다** — 지금 읽는 문서의 날짜가 늘 정중앙이다.
   문서를 옮기면 띠가 미끄러지고, 사건 이름은 겹치지 않게 위아래로 층을 나눈다. */
.chrono{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
  width:min(940px,calc(100vw - 48px));z-index:20;user-select:none;
  border:1px solid var(--edge);border-radius:8px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 20px rgba(0,0,0,.10);
  transition:box-shadow .2s ease}
.chrono:hover{box-shadow:0 6px 26px rgba(0,0,0,.18)}
/* 옅어지는 것은 **내용**이지 판이 아니다. 판까지 투명해지면 뒤의 본문이
   비쳐 들어와 글자가 서로를 밟는다. */
.chrono-track{opacity:.5;transition:opacity .2s ease}
.chrono:hover .chrono-track{opacity:1}

/* 띠가 지나가는 창. 손으로도 밀 수 있게 진짜 가로 스크롤을 쓴다 */
.chrono-vp{position:relative;overflow-x:auto;overflow-y:hidden;
  height:var(--chH,92px);border-radius:8px;cursor:grab;
  scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain}
.chrono-vp::-webkit-scrollbar{display:none}
.chrono-vp.drag{cursor:grabbing}
/* 안쪽 띠. 양옆 여백은 창의 절반 — 첫 문서도 마지막 문서도 가운데에 설 수 있게 */
.chrono-track{position:relative;height:100%;margin:0 var(--chPad,0px)}
/* 시간 축 — 층의 한가운데 */
.chrono-track::before{content:"";position:absolute;
  left:calc(0px - var(--chPad,0px));right:calc(0px - var(--chPad,0px));
  top:var(--axis,46px);height:1px;background:var(--edge)}

/* 연도 — 해가 바뀌는 자리에 선을 긋고, 그 선부터가 그 해다.
   이름표는 창 왼쪽에 들러붙는다. 1945년 한복판을 보고 있어도 「1945」가 남는다. */
.cy{position:absolute;top:0;bottom:0;
  border-left:1px solid color-mix(in srgb,var(--ink-3) 50%,transparent)}
.cy.alt{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.cy b{position:absolute;bottom:3px;font-family:var(--mono);font-size:11px;
  font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;
  line-height:1;letter-spacing:.06em;white-space:nowrap;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px}
/* 달·분기 눈금 — 해 안에서 어디쯤인지. 분기는 조금 길게 */
.cq{position:absolute;top:calc(var(--axis,46px) - 1.5px);width:1px;height:4px;
  background:var(--edge);opacity:.7}
.cq.q{top:calc(var(--axis,46px) - 2.5px);height:6px;opacity:1}
.cq[hidden]{display:none}

/* 배율 — 5년 반을 한눈에 볼 때와 8월 열흘을 벌려 볼 때가 같을 수 없다 */
.chrono-zoom{position:absolute;right:6px;top:5px;z-index:3;display:flex;gap:3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-zoom,.chrono-zoom:focus-within{opacity:1}
.chrono-zoom button{width:19px;height:19px;padding:0;line-height:1;
  font-family:var(--mono);font-size:12px;color:var(--ink-2);cursor:pointer;
  background:var(--panel);border:1px solid var(--edge);border-radius:3px}
.chrono-zoom button:hover:not(:disabled){color:var(--link);border-color:var(--link)}
.chrono-zoom button:disabled{opacity:.35;cursor:default}
.chrono-scale{position:absolute;right:6px;bottom:3px;z-index:3;
  font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.03em;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-scale{opacity:1}

/* 사건 점 */
.cm{position:absolute;top:calc(var(--axis,46px) - 3px);width:7px;height:7px;
  margin-left:-3.5px;border-radius:50%;background:var(--ink-3);z-index:1;
  border:1.5px solid var(--panel);cursor:help;
  transition:background .15s ease,transform .15s ease}
.cm.key{background:var(--stamp);width:9px;height:9px;margin-left:-4.5px;
  top:calc(var(--axis,46px) - 4px)}
.cm:hover{background:var(--link);transform:scale(1.45)}

/* 사건 이름 — 층(lane)을 나눠 위아래로 흩는다. 여기서 겹침이 풀린다 */
.cl{position:absolute;transform:translateX(-50%);white-space:nowrap;z-index:1;
  font-family:var(--mono);font-size:10px;line-height:1.1;color:var(--ink-2);
  letter-spacing:.01em;padding:1px 4px;border-radius:2px;cursor:help;
  background:color-mix(in srgb,var(--panel) 70%,transparent)}
.cl.key{color:var(--stamp)}
.cl:hover,.cl:focus-visible{color:var(--link);outline:0;
  background:color-mix(in srgb,var(--link) 12%,var(--panel))}
/* 이름에서 축까지 내려/올려 긋는 실 — 어느 점의 이름인지 알아보게 */
.cl::after{content:"";position:absolute;left:50%;width:1px;background:var(--edge)}
.cl.up::after{top:100%;height:var(--leg,0px)}
.cl.dn::after{bottom:100%;height:var(--leg,0px)}

/* 지금 읽는 문서가 놓인 자리. 문서를 고르면 이 표가 창 한가운데로 온다.
   손으로 띠를 밀면 표는 제 날짜에 남는다 — 표는 시간에 박혀 있지 창에 박혀 있지 않다. */
.chrono-cursor{position:absolute;top:0;bottom:0;width:1px;z-index:2;
  background:var(--stamp);pointer-events:none}
/* 가상 요소는 위의 *{box-sizing:border-box}가 닿지 않는다 — 여기서 직접 잡아 주지
   않으면 테두리 2px 만큼 표시가 축 아래·오른쪽으로 밀려 앉는다. */
.chrono-cursor::before{content:"";position:absolute;box-sizing:border-box;
  left:-6px;top:calc(var(--axis,46px) - 6px);width:13px;height:13px;
  border-radius:50%;background:var(--stamp);border:2px solid var(--panel)}
/* 날짜는 맨 아래, 표 바로 밑에 — 위쪽은 사건 이름 층에 내준다 */
.chrono-date{position:absolute;bottom:2px;transform:translateX(-50%);
  font-family:var(--mono);font-size:10px;color:var(--stamp);
  font-variant-numeric:tabular-nums;background:var(--panel);
  padding:0 5px;border-radius:2px;white-space:nowrap;z-index:2}
.chrono[data-nodate="1"] .chrono-cursor,
.chrono[data-nodate="1"] .chrono-date{display:none}

@media(max-width:900px){.chrono{display:none}}
@media(prefers-reduced-motion:reduce){.chrono-track{transition:none}}

/* 아래쪽 여백은 떠 있는 연대 바가 마지막 문단을 덮지 않을 만큼 */
article{max-width:none;padding:26px 26px 190px}
.doc-head{border-bottom:1px solid var(--edge);padding-bottom:14px;margin-bottom:18px}
h1{font-size:19px;margin:0 0 4px;line-height:1.35;text-wrap:balance;font-weight:650}
.docid{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  letter-spacing:.04em;font-variant-numeric:tabular-nums}
.stamp{display:inline-block;border:1.5px solid var(--stamp);color:var(--stamp);
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:1px 6px;
  border-radius:2px;transform:rotate(-1.2deg);margin-left:8px;vertical-align:2px}
.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:3px 20px;margin-top:10px;font-size:12.5px}
.meta div{display:flex;gap:7px}
/* 참석자 명단처럼 긴 값. 좁은 칸에 넣으면 한 글자씩 세로로 눌린다 */
.meta div.wide{grid-column:1/-1}
.meta b{color:var(--ink-3);font-weight:500;min-width:52px;font-size:11.5px}
.meta span{font-family:var(--mono);font-size:12px}
.meta span.txt{font-family:var(--sans);font-size:12.5px}

.points{margin:16px 0;padding:12px 16px;border-left:2px solid var(--edge);
  background:var(--panel);border-radius:0 3px 3px 0}
.points li{margin:3px 0}
.points ul{margin:0;padding-left:18px}

.cols{display:grid;gap:26px}
.cols.two{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.cols.two{grid-template-columns:1fr}}
.pane h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 8px;font-weight:600}
.body{white-space:pre-wrap;word-break:break-word}
/* 번역문에 마크다운이 섞여 들어온다 — 긴 문서는 옮긴 쪽이 소제목과 항목으로
   나눠 두어야 읽힌다. 본문은 pre-wrap 이므로 줄 단위로만 풀어 준다. */
.mdh{display:block;font-weight:700;margin:20px 0 6px;letter-spacing:-.01em}
.mdh.h1{font-size:17px} .mdh.h2{font-size:15.5px}
.mdh.h3,.mdh.h4,.mdh.h5,.mdh.h6{font-size:14px;color:var(--ink-2);
  letter-spacing:.04em}
.mdq{display:block;border-left:2px solid var(--edge);padding-left:13px;
  color:var(--ink-2);margin:6px 0}
.mdli{display:block;padding-left:17px;text-indent:-17px;margin:2px 0}
.mdli::before{content:"· ";color:var(--ink-3)}
.mdli[data-n]::before{content:attr(data-n) " ";color:var(--ink-3);
  font-family:var(--mono);font-size:12px}
.mdhr{border:0;border-top:1px solid var(--edge);margin:18px 0}
.body.en{font-family:var(--mono);font-size:12.5px;line-height:1.65;color:var(--ink-2)}
.body del{color:var(--ink-3)}
.body strong{font-weight:650}

.pagemark{display:block;margin:16px 0 6px;font-family:var(--mono);font-size:10.5px;
  color:var(--ink-3);letter-spacing:.06em;border-top:1px dashed var(--edge);padding-top:5px}
.pagemark.hit{cursor:zoom-in;text-decoration:underline;
  text-decoration-style:dotted;text-underline-offset:3px}
.pagemark.hit:hover{color:var(--link)}
.fnref{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);vertical-align:super}

/* 본문 속 용어 주석.
   앞서 --edge 로 밑줄을 그었더니 배경에 묻혀 아예 보이지 않았다.
   옅은 바탕을 깔아 「여기 무언가 있다」를 먼저 알리고, 점선으로 종류를 나눈다.
   다른 문서로 가는 것(a)과 설명만 뜨는 것(span)을 색으로 구분한다. */
.term{color:inherit;text-decoration:none;cursor:help;
  background:var(--term-bg);border-radius:2px;
  padding:0 2px;margin:0 -1px;
  border-bottom:1px dashed var(--term-line);
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
a.term{cursor:pointer;color:var(--link);
  background:var(--term-bg-go);border-bottom-color:var(--term-line-go)}
.term:hover{background:var(--term-bg-on);border-bottom-style:solid;
  border-bottom-color:var(--link);color:var(--link)}
.term:focus-visible{outline:2px solid var(--link);outline-offset:2px}

.fns{margin-top:24px;padding-top:14px;border-top:1px solid var(--edge-soft);
  font-size:12px;color:var(--ink-3);line-height:1.6}
.fns h2,.scans h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 9px;font-weight:600}
.fns div{margin:4px 0}
.note{margin-top:14px;font-size:12px;color:var(--ink-3);border-left:2px solid var(--edge);
  padding-left:11px}
.empty{padding:60px 26px;color:var(--ink-3)}
.warn{color:var(--stamp)}

/* ── 스캔 원본 ─────────────────────────────── */
.scans{margin-top:24px;padding-top:14px;border-top:1px solid var(--edge-soft)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{border:1px solid var(--edge);background:var(--panel);padding:0;cursor:zoom-in;
  border-radius:2px;overflow:hidden;line-height:0;position:relative}
.thumb:hover{border-color:var(--link)}
.thumb img{width:84px;height:110px;object-fit:cover;object-position:top center;
  display:block;background:var(--edge-soft)}
.thumb b{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.62);color:#fff;
  font-family:var(--mono);font-size:9.5px;font-weight:400;padding:1px 4px;
  letter-spacing:.04em;line-height:1.5}

/* ── 확대 뷰어 ─────────────────────────────── */
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,11,14,.94);
  display:none;flex-direction:column}
.lb[open]{display:flex}
.lb-bar{display:flex;align-items:center;gap:14px;padding:9px 16px;color:#c9d3db;
  font-size:12px;border-bottom:1px solid #2a343d;flex:none}
.lb-bar .grow{flex:1}
.lb-bar button{background:none;border:1px solid #3a464f;color:#c9d3db;
  border-radius:3px;padding:3px 11px;font:inherit;font-size:12px;cursor:pointer}
.lb-bar button:hover:not(:disabled){border-color:#7fb0da;color:#fff}
.lb-bar button:disabled{opacity:.35;cursor:default}
.lb-bar .pg{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lb-stage{flex:1;min-height:0;overflow:auto;display:flex;
  align-items:flex-start;justify-content:center;padding:16px}
.lb-stage img{max-width:100%;height:auto;background:#fff;box-shadow:0 2px 24px rgba(0,0,0,.5)}
.lb-stage.fit img{max-height:calc(100vh - 90px);width:auto}

/* 호버 카드 — 링크 위에 머물면 그 문서가 무엇인지 미리 보여 준다.
   열람기와 같은 토큰(--panel, --edge, --ink…)을 쓰므로 별도 팔레트가 없다.
   토큰을 정의하지 않은 페이지에 얹으려면 그 값들만 채워 주면 된다. */

.hc {
  position: fixed;
  z-index: 60;
  width: min(400px, calc(100vw - 32px));
  background: var(--panel);
  border: 1px solid var(--edge);
  border-radius: 4px;
  box-shadow: 0 6px 28px rgba(16, 26, 38, .16), 0 1px 3px rgba(16, 26, 38, .1);
  padding: 15px 17px 16px;
  font-size: 13.5px;
  line-height: 1.62;
  color: var(--ink-2);
  opacity: 0;
  transform: translateY(3px);
  transition: opacity .13s ease, transform .13s ease;
  pointer-events: none;
}
.hc[data-open] { opacity: 1; transform: none; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .hc {
    box-shadow: 0 6px 30px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
  }
}
:root[data-theme="dark"] .hc {
  box-shadow: 0 6px 30px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
}

.hc-top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: baseline;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 5px;
}
.hc-top .id { white-space: nowrap }

.hc h4 {
  margin: 0 0 7px;
  font-size: 14.5px;
  line-height: 1.42;
  font-weight: 640;
  color: var(--ink);
  text-wrap: balance;
}

/* 발신 → 수신. 문서철마다 있을 수도 없을 수도 있어 비면 통째로 빠진다 */
.hc-route {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  margin: 0 0 8px;
  line-height: 1.5;
}

.hc p.sum {
  margin: 0;
  /* 요약이 길 수 있다. 넘치면 자른다 — 카드는 미리보기지 본문이 아니다 */
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.hc ul {
  margin: 9px 0 0;
  padding-left: 16px;
  color: var(--ink-3);
  font-size: 12.5px;
}
.hc li {
  margin: 2px 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.hc-foot {
  margin-top: 11px;
  padding-top: 9px;
  border-top: 1px solid var(--edge-soft);
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-3);
  display: flex;
  justify-content: space-between;
  gap: 10px;
}
.hc-foot .go { color: var(--link) }

/* 손가락으로 쓰는 기기에는 호버가 없다. 링크는 그대로 동작하므로 카드만 뺀다 */
@media (hover: none) { .hc { display: none } }
@media (prefers-reduced-motion: reduce) {
  .hc { transition: none }
}

<script id="data" type="application/json">[{"id": "10", "order": 1000, "date": "1947-01-14", "group": "A", "eyebrow": "편철 10 · 0009–0015면", "title": "조선경비대의 창설과 장비", "badge": "Top Secret", "list_right": "10", "meta": [{"k": "일자", "v": "1947-01-14"}, {"k": "발신", "v": "주한미군사령부(HEADQUARTERS, UNITED STATES ARMY FORCES IN KOREA), 사령관실, APO 235", "txt": true}, {"k": "수신", "v": "극동군총사령관(Commander-in-Chief, Far East), APO 500", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "TFXAG 381 · 배서 파일번호 AG 014.12 (14 Jan 47) GC"}, {"k": "종류", "v": "서한"}, {"k": "면", "v": "0009–0015 (7면)"}, {"k": "건명", "v": "Establishment and Equipment of Korean Constabulary", "txt": true}, {"k": "색인 요지", "v": "Ltr:- Establishment & Equipment of Korean Constabulary.", "txt": true, "wide": true}], "summary": "주한미군사령부가 조선경비대(조선 국방군) 창설에 관한 자기 기록이 매우 불완전하다며 도쿄 극동군총사령부에 관련 전문 사본을 요청했고, 총사령부는 1945년 11월부터 1946년 1월까지의 관계 전문 9건을 사본으로 돌려주면서 38도 이남 조선의 국방군 창설 조치는 조선 독립 문제가 해결될 때까지 보류되며 관련 심사위원회 회의록도 계속 보류철에 둔다고 회신했다.", "points": ["주한미군사령부(USAFIK)는 조선경비대 창설에 관한 자기 기록이 '매우 불완전(very incomplete)'하다고 인정하고, 도쿄 총사령부에 남아 있는 자료를 요청했다.", "USAFIK 이 특정해 요청한 것은 두 건 — 비밀 전문 54290(1945년 11월 4일자, 042003 November 1945)과 SCAP WX 92187(1946년 1월 11일자, 110932/Z January 1946). 전자는 USAFIK 에서 이미 폐기(destroyed)되었다.", "1945년 11월 3일 USAFIK 이 비밀 전문 TFGCG 139(참모 검토서에서는 193)로 SCAP 에 조선군 창설 계획 착수 필요를 보고한 것이 이 사안의 출발점이다.", "1945년 11월 20일, 「38도 이북(원문은 South of 38 Degree North Latitude, 즉 이남) 조선의 국방 창설에 관한 장교심사위원회 승인 회의록」이 부록 1건과 함께 시크(Schick) 장군을 통해 GHQ AFPAC 으로 송부되었으나, USAFIK 에는 반송 기록도 보관 사본도 남아 있지 않다.", "극동군총사령부(GHQ FEC)는 제1 배서로 관계 문서 9건의 사본을 첨부해 USAFIK 에 반송했다 — 9 Incls.", "참조 전문 목록: TFGCG 139(45.11.3), CAX 54290(45.11.4), CAX 55238(45.11.25), JCS WX 92187(46.1.11), CAX 56830(46.1.11), CAX 56889(46.1.13), TFGCT 1948(46.1.19), CAX 57249(46.1.24), 제24군단 서한 AG 381(TFGCG)(45.11.20자, 배서에는 1946으로 오타).", "핵심 지침은 JCS 전문 WX 92187(1946.1.11)이다 — 조선 국립민간경찰(Korean National Civil Police)의 무장은 인가하되, 조선 국군(national armed forces) 창설은 조선 독립 이행을 위한 국제적 약속의 미해결 문제와 밀접히 연결돼 있으므로 보류한다.", "WX 92635(1946.1.12)는 주한미군사령부 야전명령 제1호(45.12.23) 제3항 d(8) — '남조선 군정은 자유롭고 독립된 국가의 존속을 보장하기 위해 조선군을 창설·유지한다' — 를 WX 92187 에 비추어 삭제할 것을 제안했고, TFGCT 1948(46.1.19)로 해당 조항이 폐지되었음이 보고되었다.", "1947년 1월 시점의 결론: '38도 이남 조선의 국군 지위를 바꿀 만한 일은 아무것도 일어나지 않았다.' 창설 조치는 계속 보류, 심사위원회 회의록은 보류철(suspense file)에 둔다.", "이 서한에는 편제표나 장비 목록이 붙어 있지 않다. 실제 편성·장비를 담은 것은 첨부된 9건의 참조 문서와 장교심사위원회 회의록이며, 이 문서철에는 그 본문이 없다."], "primary": "## 1. 기본 서한 (0009)\n\n**주한미군사령부 사령관실, APO 235 — 1947년 1월 14일**\n\n**건명: 조선경비대의 창설과 장비**\n\n**수신: 극동군총사령관, APO 500**\n\n1. 조선경비대 창설에 관한 본 사령부의 기록은 매우 불완전하며, 귀 사령부에 기록으로 남아 있는 자료 일체를 요청한다.\n\n2. 다음의 정보를 제공한다.\n\n   a. 본 사령부의 기록에 따르면 본건에 관하여 비밀 무선 TFGCG 제139호가 1945년 11월 3일 연합국최고사령관(SCAP)에게 발신되었다.\n\n   b. 본 사령부의 기록에 따르면 위 무선에 대한 회신인 비밀 전문 54290(1945년 11월 042003)이 접수되었으나 폐기되었다. 사본을 원한다.\n\n   c. 본 사령부의 기록에 따르면 1945년 11월 20일, 「북위 38도 이남 조선의 국방 창설에 관한 장교심사위원회 승인 회의록」이 부록 1건과 함께 시크(Schick) 장군에 의해 GHQ AFPAC 으로 송부되었다. 장교심사위원회 회의록이 반송되었다는 기록도, 보관 사본을 남겼다는 기록도 본 사령부에 없다.\n\n   d. 본 사령부의 기록에는 본건에 관한 SCAP 의 1급비밀 또는 비밀 무선 WX 92187(1946년 1월 110932/Z)이 언급되어 있다. 사본을 원한다.\n\n사령관을 대리하여:\n\n찰스 에니스(CHARLES ENNIS), 대령, 부관부(AGD)\n부관\n\n## 2. 자필 쪽지 (0010)\n\n1947년 1월 14일\n\n> 친애하는 [판독불가]에게\n> 이 문제로 우리를 좀 도와줄 수 있겠나. 내가 부임하기 전 일이라 기록에 없는 것이네.\n> 또 문제의 그 기록들은 지금쯤 비밀등급이 내려갔을지도 모르겠는데 — 나로서는 모르겠네.\n> 우리는 [판독불가] 파일뿐이니 좀 도와주게.\n> 고맙네.\n> 찰리(Charlie)\n\n(하단에 \"CHARLES ENNIS, AGD, [부]관\" 고무인이 찍혀 있다.)\n\n## 3. 제1 배서 (0011)\n\n**기본문서: 주한미군사령부 서한, 파일 AG 381 (TFXAG), 1947년 1월 14일자, 건명 「조선경비대의 창설과 장비」**\n\n**AG 014.12 (1947년 1월 14일) GC — 제1 배서**\n\n**극동군총사령부, APO 500 — 1947년 1월 25일**\n\n**수신: 주한미육군사령관, APO 235**\n\n1. 다음을 참조하라 —\n\n   a. USAFIK 무선 TFGCG 139, 1945년 11월 3일.\n   b. GHQ AFPAC 무선 CAX 54290, 1945년 11월 4일.\n   c. GHQ AFPAC 무선 CAX 55238, 1945년 11월 25일.\n   d. JCS 무선 WX 92187, 1946년 1월 11일.\n   e. GHQ AFPAC 무선 CAX 56830, 1946년 1월 11일.\n   f. GHQ AFPAC 무선 CAX 56889, 1946년 1월 13일.\n   g. USAFIK TFGCT 1948, 1946년 1월 19일.\n   h. GHQ AFPAC 무선 CAX 57249, 1946년 1월 24일.\n   i. 제24군단사령부 서한, 파일 AG 381 (TFGCG), 건명 「북위 38도 이남 조선의 국방 창설에 관한 장교심사위원회 승인 회의록」, 1946년[원문 그대로] 11월 20일자 — 본건에 관한 장교심사위원회의 승인 회의록을 송부한 것.\n\n2. 위에 열거한 참조 문서들의 사본을 송부하니, 조선 국립민간경찰대(Korean National Civil Police Force)의 창설과 장비에 관한 귀 사령부의 기록을 보완하라.\n\n3. 참조 d 가 북위 38도 이남 조선에서 국군(national armed forces)을 창설하는 조치를 조선 독립과 관련된 제반 문제가 해결될 때까지 유보하도록 지시하였으므로, 참조 i 의 심사위원회 회의록은 보류 상태(suspense status)에 두었다.\n\n맥아더 장군의 명에 의하여:\n\n부록 9건. 상기와 같음.\n\n조지 R. 코너(GEORGE R. CONNOR), 대령, 부관부(A.G.D.), 부관보\n\n## 4. 참모 검토서 (0012–0013)\n\n**JBY/lt — 1947년 1월 23일**\n\n**기록용 각서(MEMO FOR RECORD):**\n\n1. **기본 안건:** 본 건은 조선경비대 창설에 관한 USAFIK 의 자료 요청이다. USAFIK 서한 TFXAG 381, 건명 「조선경비대의 창설과 장비」, 1947년 1월 14일자는 CX 54290(1945년 11월 4일)과 WX 92187(1946년 1월 11일)의 사본을 특정하여 요청하고 있다. 아울러 이 서한은 상기 건에 관한 USAFIK 의 기록이 매우 불완전하므로 기록으로 남은 자료 일체를 요청한다고 밝히고 있다.\n\n2. 조선경비대의 창설과 장비에 관련된 참조 문서들의 요지는 다음과 같다.\n\n   a. TFGCG 193[원문 그대로], 1945년 11월 3일 — 조선군(Korean Military Forces) 창설에 관한 계획을 착수해야 한다는 USAFIK 의 견해를 SCAP 에 통보.\n\n   b. CAX 54290, 1945년 11월 4일 — TFGCG 193 에 동의하고, 주한미군사령관에게 그 계획을 제출하도록 요구.\n\n   c. 주한미군사령관은 북위 38도 이남 조선의 국방 창설을 연구하기 위해 임명된 장교심사위원회의 회의록에 포함된 형태로 조선군 창설 계획을 송부하였다. 이 심사위원회 회의록 — 파일 AG 381 (TFGCG), 건명 「북위 38도 이남 조선의 국방 창설에 관한 장교심사위원회 승인 회의록」, 1945년 11월 29일자[원문 그대로] — 은 본 사령부에 접수되었고, 그 회의록에 포함된 USAFIK 안을 개요로 정리한 무선 CAX 55328[원문 그대로]이 1945년 11월 25일 육군부에 발신되었다. 심사위원회 회의록은 육군부 회신을 받을 때까지 추가 검토를 위해 참모장이 G-3 로 반송하였다.\n\n   d. WX 92187, 1946년 1월 11일 — 조선 국립민간경찰의 무장을 인가하고, 그 편성·장비·기능에 관한 추가 정보를 요구. 이 전문은 또한 조선 국군 창설 문제는 조선 독립 이행을 위한 국제적 약속과 관련된 미해결 문제들과 밀접히 결부되어 있으므로 유보될 것이라고 명시하였다.\n\n   e. CAX 56830 — WX 92187 의 사본이 참고로 USAFIK 에 전달되었음을 통보. 이 전문은 USAFIK 이 경찰력의 무장을 진행하도록 인가하고, WX 92187 에 대한 회신의 기초로 삼을 민간경찰의 편성과 기능에 관한 정보를 요구하였다.\n\n   f. WX 92635, 1월 12일 — WX 92187 에 비추어 주한미군사령부 야전명령 제1호(1945년 12월 23일)의 제3항 d(8)을 삭제할 것을 제안. 이 세항은 남조선 군정이 자유롭고 독립된 국가로서 여러 나라 사이에 존속함을 보장하기 위하여 조선군을 창설·유지하도록 지시한 것이었다. CAX 56889(1월 13일)는 WX 92635 를 주한미군사령관에게 인용하며 적절한 조치를 요구하였다. TFGCT 1948(1월 19일)은 야전명령 제1호 제3항 d(8)이 폐지되었음을 통보하고 CAX 56830 이 요구한 정보를 송부하였다. 이 정보는 CAX 57249(1946년 1월 24일)로 육군부에 전달되었다.\n\n3. 북위 38도 이남 조선의 국군 지위를 바꿀 만한 일은 아무것도 일어나지 않았다. WX 92187(1946년 1월 11일)에 명시된 대로, 그러한 군대를 창설하는 조치는 조선 독립과 결부된 제반 문제가 해결될 때까지 유보될 것이다. 따라서 본건에 관한 심사위원회 회의록은 보류철에 그대로 두어야 한다.\n\n4. **권고 조치** — 앞의 전문들의 사본을 참고로 송부하는 제1 배서로써 기본 문서를 USAFIK 에 반송한다.\n\n5. **건의** — 첨부된 배서의 승인 및 발송.\n\n6. **종결** — 이로써 USAFIK 서한 TFXAG 381(1947년 1월 14일자, 건명 「조선경비대의 창설과 장비」)에 대한 G-3 조치를 완료한다.\n\nYOST - 22622\n담당 장교(Action Officer)\n\n## 5. 라우팅 슬립 (0014)\n\nGHQ, AFPAC / FEC 부관감실 라우팅 슬립, 1947년 1월 26일. 발신: AG-R DIST. (수취·용도 항목의 표시는 판독이 어려우며, 하단에 자필 서명 2점.)\n\n## 6. 라우팅 슬립 (0015)\n\n연합국최고사령관 겸 태평양미육군총사령부 라우팅 슬립. 발신: G-3, 1947년 1월 24일. 수신 표시: 부관(Adjutant General). 용도: 열람 후 반송(Note and Return). 서명: G-3 집행장교(G-3 EX O).", "secondary": "## 1. Basic letter (0009)\n\nTOP SECRET\n\nHEADQUARTERS\nUNITED STATES ARMY FORCES IN KOREA\nOffice of the Commanding General\nAPO 235\n\n14 JAN 1947\n\nTFXAG 381\n\nSUBJECT: Establishment and Equipment of Korean Constabulary\n\nTO: Commander-in-Chief Far East\nAPO 500\n\n1. Records at this headquarters relative to the establishment of Korean Constabulary are very incomplete and any material of record at your headquarters is requested.\n\n2. The following information is furnished:\n\na. Records of this headquarters show that a Secret Radio TFGCG No. 139 was transmitted to SCAP 3 November 1945 relative to this subject.\n\nb. Records of this headquarters show that a reply to the above radio, Secret, 54290, dated 042003 November 1945 was received but has been destroyed. A copy is desired.\n\nc. Records of this headquarters show that on 20 November 1945, approved proceedings of Board of Officers pertaining to establishment of National Defense of Korea, South of 38 Degree North Latitude with one inclosure were forwarded to GHQ AFPAC by General Schick. No record at this headquarters to show that proceedings of Board of Officers were returned or no copy retained on file.\n\nd. Records at this headquarters show reference to Top Secret or Secret Radio SCAP WX 92187 dated 110932/Z January 1946, relative to this subject. A copy is desired.\n\nFOR THE COMMANDING GENERAL:\n\nCHARLES ENNIS\nColonel, AGD Adjutant General\n\nTOP SECRET\n\n## 2. Handwritten note (0010)\n\n14/1/47 Dear [illegible], Can you help us out on this problem — something not of record before my time. Also records in question may now be down graded — I don't know. We have [illegible] files so give us some help. Thanks, Charlie [rubber stamp: CHARLES ENNIS / AGD / ...eral]\n\n## 3. First Indorsement (0011)\n\nTOP SECRET\n\nBASIC: Ltr, Hq USAFIK, File AG 381 (TFXAG), dated 14 Jan 47, subj: \"Establishment and Equipment of Korean Constabulary\".\n\nAG 014.12 (14 Jan 47) GC          1st Ind.\n\nGENERAL HEADQUARTERS, FAR EAST COMMAND, APO 500.          25 JAN 1947\n\nTO: Commanding General, United States Army Forces in Korea, APO 235.\n\n1. Reference is made to -\n\na. USAFIK radio TFGCG 139 of 3 November 1945.\nb. GHQ AFPAC radio CAX 54290 of 4 November 1945.\nc. GHQ AFPAC radio CAX 55238 of 25 November 1945.\nd. JCS radio WX 92187 of 11 January 1946.\ne. GHQ AFPAC radio CAX 56830 of 11 January 1946.\nf. GHQ AFPAC radio CAX 56889 of 13 January 1946.\ng. USAFIK TFGCT 1948 of 19 January 1946.\nh. GHQ AFPAC radio CAX 57249 of 24 January 1946.\ni. Headquarters XXIV Corps letter, file AG 381 (TFGCG) subject: \"Approved Proceedings of Board of Officers Pertaining to Establishment of National Defense of Korea South of 38° North Latitude\", dated 20 November 1946 forwarding approved proceedings of board of officers on this subject.\n\n2. Copies of the references listed above are forwarded to complete your records concerning the establishment and equipment of the Korean National Civil Police Force.\n\n3. Since reference d directed that action to establish national armed forces in Korea South of the 38 Degrees North Latitude be deferred pending settlement of problems in connection with Korean independence, the Board proceedings referred to in reference i have been placed in suspense status.\n\nBY COMMAND OF GENERAL MACARTHUR:\n\n9 Incls.\nAs listed.\n\nGEORGE R. CONNOR, Colonel, A. G. D., Asst. Adjutant General.\n\nTOP SECRET\n\n## 4. Memo for Record (0012-0013)\n\nTOP SECRET\n\nJBY/lt 23 Jan 47 MEMO FOR RECORD:\n\n1. BASIC ACTION: This action concerns USAFIK request for information relative to the establishment of Korean constabulary. USAFIK letter TFXAG 381, subject \"Establishment and Equipment of Korean Constabulary\", 14 Jan 47, specifically requests copy of CX 54290, 4 Nov 45, and WX 92187 of 11 Jan 46. In addition, this letter states that USAFIK records on the above subject are very incomplete and any material of record is requested.\n\n2. A brief of the references involved in the establishment and equipment of Korean constabulary follows:\n\na. TFGCG 193, 3 Nov 45, advised SCAP of USAFIK belief that planning should begin regarding the establishment of Korean Military Forces.\n\nb. CAX 54290, 4 Nov 45, concurred in TFGCG 193 and requested CG USAFIK to submit his plan.\n\nc. CG USAFIK forwarded his plan for the establishment of Korean Military Forces incorporated in the proceedings of a board of officers appointed for the purpose of making a study for the establishment of national defense in Korea South of the 38th degree North latitude. These Board proceedings, file AG 381 (TFGCG), subject: \"Approved proceedings of Board of Officers Pertaining to Establishment of National Defense of Korea South of 38° North Latitude\", dated 29 Nov 45, were received in this Headquarters and radio CAX 55328 of 25 Nov 45 was forwarded to the War Department outlining USAFIK plan included in these proceedings. The Board proceedings were returned to G-3 by C/S for further consideration pending receipt of War Department reply.\n\nd. WX 92187 of 11 Jan 46 authorized arming of Korean National Civil Police and requested further information concerning their organization, equipment and functions. This radio also stated that the matter of establishing Korean national armed forces is closely allied to unsettled problems in connection with International commitments for implementing Korean independence and will therefore be deferred.\n\ne. CAX 56830 advised USAFIK that a copy of WX 92187 had been passed to them for information. This radio authorized USAFIK to proceed with armament of police force and requested information concerning organization and functions of civil police to serve as basis of reply to WX 92187.\n\nf. WX 92635, 12 Jan, suggested that Para 3d (8) Field Order #1, Hq USAFIK, 23 Dec, be deleted in view of WX 92187. This sub-paragraph directed that the Military Government of Southern Korea establish and maintain Korean military forces to insure the continuation of a free and independent nation in the family of nations. CAX 56889 of 13 Jan quoted WX 92635 to CG USAFIK and requested appropriate action be taken. TFGCT 1948, 19 Jan, advised that Para 3d (8) Field Order #1 had been rescinded and forwarded information requested by CAX 56830. This information was forwarded to WD by CAX 57249, 24 Jan 46.\n\n3. Nothing has occurred to change the status of national armed forces in Korea South of the 38° North Latitude. As stated in WX 92187, 11 Jan 46, action to establish such forces will be deferred pending settlement of problems connected with Korean independence. The Board Proceedings on this subject should therefore remain in suspense file.\n\n4. RECOMMENDED ACTION - Return of basic correspondence to USAFIK by 1st Indorsement forwarding for their information copies of the foregoing radios.\n\n5. RECOMMENDATION - Approval and dispatch of attached indorsement.\n\n6. COMPLETION - This completes G-3 action on USAFIK letter TFXAG 381, dated 14 Jan 47, subject: \"Establishment and Equipment of Korean Constabulary\".\n\nYOST - 22622\nAction Officer\n\nTOP SECRET\n-2## 5. Routing Slip (0014)\n\nGHQ, AFPAC / FEC — ADJUTANT GENERAL'S OFFICE — Routing Slip.\nFROM: AG-R DIST      DATE: 26 JAN 1947 [check marks illegible; two handwritten initials at foot] AFPAC AGO Form No. 2 (10 May 46) AG-SAD/1063 ## 6. Routing Slip (0015)\n\nGENERAL HEADQUARTERS, SUPREME COMMANDER FOR THE ALLIED POWERS AND UNITED STATES ARMY FORCES, PACIFIC — Routing Slip.\nFROM: G-3      DATE: 24 Jan 47\nTO: Adjutant General [check]\nFOR: Note and Return [signed] W. A. / G-3 EX O\nTOP SECRET", "notes": ["[도장·결재] (0009) 사각 접수 도장: 「GHQ. SCAP / 014.1 Korea / 18 JAN 1947 / AG RECORDS」", "[도장·결재] (0009) 날짜 고무인: 「14 JAN 1947」", "[도장·결재] (0009) 우측 여백 세로 대형 도장: 「AG RECORD COPY」", "[도장·결재] (0009) 우상단 자필 편철 지시: 「091 Korea」, 「370.5」 (각각 사선으로 지워짐), 「file」", "[도장·결재] (0009) 좌측 여백 자필: 「091 Korea SCAP file 14」 — 2항 옆", "[도장·결재] (0009) 좌측 여백 자필: 「not in file in AG Records. Filed in G-3, Planning」 — 2항 b·c 옆", "[도장·결재] (0009) 본문 우측 자필: 「370.50F (TS-5)」", "[도장·결재] (0009) 좌하단 인쇄 처리란 자필: 「DATE 19 Jan 47 / Original sent to: ___ / For Action: AG ON(가로줄로 지움) / For Info: ___ / Copy to: ___ / By: [서명] per / Copy filed: ___」", "[도장·결재] (0009) 서명란 우측 자필: 「21 Jan 47 — action copy to Col. Dumas[판독 불확실] G-3, 21 Jan 47. Handcarried with supporting file. [서명] CWO, USA」", "[도장·결재] (0009) 우하단 연필 일련번호: 「10」", "[도장·결재] (0010) 고무인: 「CHARLES ENNIS / AGD / [Adjutant Gen]eral」, 자필 날짜 「14/1/47」", "[도장·결재] (0011) 사각 접수 도장: 「GHQ. SCAP / 014.1 Korea / 25 JAN 1947 / Record / AG RECORDS」", "[도장·결재] (0011) 날짜 고무인: 「25 JAN 1947」", "[도장·결재] (0011) 우측 여백 세로 도장: 「AG RECORD COPY」 및 「AG FILES」", "[도장·결재] (0011) 하단 발송 고무인: 「MAILED 1010 JAN 25 47 AG. - GHQ.」", "[도장·결재] (0011) 좌측 자필: 「√ NFF」, 우상단 자필 「AG」", "[도장·결재] (0014) 라우팅 슬립 인쇄 날짜란 자필/고무인: 「26 JAN 1947」, 하단 자필 서명 2점 [판독불가]", "[도장·결재] (0015) 라우팅 슬립: 발신 「G-3」, 날짜 「24 Jan 47」, 자필 서명 「W. A.[판독불가] / G-3 EX O」, 하단 「TOP SECRET」 고무인", "편철 메모 — 0009 USAFIK 기본 서한(AG 014.12), 0010 자필 쪽지, 0011 GHQ FEC 제1 배서(1st Ind), 0012~0013 참조 전문 요약 참모 검토서(23 Jan 47), 0014~0015 라우팅 슬립(1947-01-24/26). 0011·0012 OCR 은 기본 서한 날짜를 '24 Jan 47'로 읽으나 색인은 14 Jan 47"], "note": "번역자 주 — 1) 이 문서철의 마지막 문서이며, 편철된 낱장 7면 가운데 실제 본문은 0009(기본 서한)·0011(제1 배서)·0012~0013(G-3 참모 검토서)이고 0010은 자필 쪽지, 0014~0015는 라우팅 슬립이다. 2) 문서 안에 편제표·장비 목록은 없다. 본 건은 '기록 요청과 회신'이며, 실제 편성·장비 내용을 담은 것은 첨부된 9건의 참조 전문과 장교심사위원회 회의록이고 그 본문은 이 문서철에 편철돼 있지 않다. 3) 전문번호가 문서마다 어긋난다 — 기본 서한과 배서는 'TFGCG 139'인데 참모 검토서는 'TFGCG 193'; 배서는 'CAX 55238'인데 참모 검토서는 'CAX 55328'; 심사위원회 회의록 날짜도 배서 '20 November 1946'(연도는 1945의 오타로 보임), 기본 서한 '20 November 1945', 참모 검토서 '29 Nov 45'로 갈린다. 숫자는 읽은 그대로 두었다. 4) 기본 서한 2항 c 의 'National Defense of Korea, South of 38 Degree North Latitude'는 원문 그대로다(38도 이남). 5) 배서 2항은 건명과 달리 'Korean National Civil Police Force'(조선 국립민간경찰대)라고 쓰고 있다 — 총사령부가 이 사안을 '군대'가 아니라 '경찰'로 처리하고 있음을 보여주는 대목이라 그대로 옮겼다. 6) 0010 자필 쪽지의 수신자 이름과 한 구절('We have ___ files')은 필기체 판독이 되지 않아 [판독불가]로 두었다. 7) 0009 우측 자필 회부 표시의 'Col. Dumas'는 판독이 불확실하다.", "warn": false, "pages": ["0009", "0010", "0011", "0012", "0013", "0014", "0015"], "search": "찰스 에니스(Charles Ennis) — 대령, 주한미군사령부 부관. 기본 서한 서명자이자 0010 자필 쪽지('Charlie')의 필자 조지 R. 코너(George R. Connor) — 대령, 극동군총사령부 부관보. 제1 배서 서명자 시크 장군(General Schick) — 1945년 11월 20일 장교심사위원회 회의록을 GHQ AFPAC 으로 송부한 인물 (로런스 E. 시크Lawrence E. Schick 로 추정되나 원문에는 성만 있음) 요스트(Yost) — G-3 담당 장교, 참모 검토서 작성자 (내선 22622) 맥아더(General MacArthur) — 배서 발령 명의 두마(Col. Dumas?) — 0009 자필 회부 표시에 나오는 G-3 장교. 필적 판독 불확실 10 Ltr:- Establishment & Equipment of Korean Constabulary."}, {"id": "9", "order": 900, "date": "1946-03-29", "group": "B", "eyebrow": "편철 9 · 0016–0016면", "title": "소련군 사령관 정치고문 발라사노프의 개인적 견해", "badge": "Top Secret", "list_right": "9", "meta": [{"k": "일자", "v": "1946-03-29"}, {"k": "발신", "v": "주한미군사령관(CG USAFIK) — 하지", "txt": true}, {"k": "수신", "v": "연합국최고사령관(SCAP), 맥아더 앞", "txt": true}, {"k": "참조", "v": "총사령관(COMMANDER-in-CHIEF), 참모장(CHIEF OF STAFF), 부관부(AG), 정부부(C GOVT SEC)", "txt": true}, {"k": "전문번호", "v": "TFGCG 334"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0016–0016 (1면)"}, {"k": "건명", "v": "Personal views of Balasanov, Political Advisor to the Soviet Commanding General", "txt": true}, {"k": "색인 요지", "v": "TFGCG [?]4 - Personal views of Balasanov, Russian Polad", "txt": true, "wide": true}], "summary": "하지가 소련 대표단 만찬에서 소련 정치고문 발라사노프가 랭던에게 흘린 개인적 견해 다섯 가지 — 5월 말 임시정부 수립, 외국인 고문에 의한 통제·감독, 지대 간 통행 제한 해제, 후견 기간 중 주둔군 유지, 외교대표 파견 — 를 보고한 전문.", "points": ["3월 28일 저녁 소련 대표단을 위한 하지의 만찬 자리에서 랭던과 대화하던 중 발라사노프가 밝힌 견해다.", "(A) 소련 대표단은 임시정부 구성이 5월 말까지 완료될 것으로 추산한다.", "(B) 임시정부에 대한 통제와 감독은 아마도 외국인 고문(Foreign Advisors)만이 행사하게 될 것이다.", "(C) 임시정부 수립 후에는 지대 간 인원·물자 이동에 대한 모든 제한이 해제될 것으로 예상된다.", "(D) 군대는 (아마도 후견 기간 전체에 걸쳐) 민간 소요를 막기 위해 잔류할 것이다.", "(E) 임시정부에 외교대표가 신임장을 제정할 것으로 예견된다.", "하지는 이 견해가 랭던의 반응을 떠보려고 흘린 것일 수 있다고 단서를 달면서도, 국무부와 육군참모총장에게 참고가 될 수 있다고 판단했다.", "이 전문은 신호소를 거쳐 국무장관 앞으로 육군참모총장에게 재발송되었다."], "primary": "어젯밤 소련 대표단을 위한 나의 만찬회 석상에서 랭던(Langdon)과 대화를 나누던 중, 소련군 사령관의 정치고문 발라사노프(Balasanov)가 다음과 같은 개인적 견해를 내비쳤다. (A) 소련 대표단은 임시정부의 구성이 5월 말까지 완료될 것으로 추산했다. (B) 임시정부에 대한 통제와 감독은 아마도 외국인 고문(Foreign Advisors)에 의해서만 행사될 것이다. (C) 임시정부 수립 이후에는 지대(zone) 간 인원 및 물자의 이동에 대한 모든 제한이 철폐될 것으로 예상된다. (D) 군대는 (추정컨대 후견(Tutelary) 기간 전체에 걸쳐) 민간 소요를 방지하기 위하여 잔류할 것이다. (E) 임시정부에 외교대표(diplomatic representation)가 신임장을 제정하게 될 것으로 예견된다.\n\n이 견해들은 랭던의 반응을 얻어내기 위하여 흘린 것일 수도 있으나, 국무부 및 육군참모총장에게 관심거리가 될 수 있을 것이다.\n\nHODGE", "secondary": "In course of conversation with Langdon at my dinner party last evening for the Soviet Delegation, Balasanov, Political Advisor to the Soviet Commanding General, intimated the following personal views: (A) Soviet Delegation estimated formation of Provisional Government will be completed by end of May; (B) Control and supervision of the Provisional Government would probably be exercised only by Foreign Advisors; (C) It is expected that all restrictions on movement of persons and goods between zones will be removed after establishment of Provisional Government; (D) Troops will remain (presumably during entire Tutelary period) to prevent civil disturbances; (E) It is anticipated that diplomatic representation will be accredited to Provisional Government.\n\nWhile these views may have been intimated in order to obtain Langdons reactions, they may be of interest to State Department and WARCOS.\n\nHODGE\n\nINFORMATION: COMMANDER-in-CHIEF, CHIEF OF STAFF. AG. C GOVT SEC NOTE: This message has been passed to Signal Center for re-dispatch to WARCOS for SECSTATE for information.\nPRIORITY  TOP SECRET\n86466   TOO: 291055-I   MCN: TJC 20/29 Handling and transmission of the literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 44g and 53a (3) (Changes No. 3) of AR 380-5, 15 March 1944.\n\nTHE MAKING OF AN EXACT COPY OF THIS MESSAGE IS FORBIDDEN", "notes": ["[도장·결재] 고무인(우상단, 상자 안): 「GHQ. AFPAC / AGO RECORDS / 1 APR 1946」 — 총사령부 부관부 기록과 1946년 4월 1일 접수", "[도장·결재] 손글씨(도장 위·옆): '014.1 Korea', 'SCAP 33'", "[도장·결재] 손글씨(날짜 아래): 'X 014.1 Korea', 'X 042' — 상호참조 편철 지시, 그 아래 결재 이니셜(판독불가, 'McB'로 보임)", "[도장·결재] 우하단 인쇄·손글씨: 'COPY NO.' 란에 '11', 'A. G. FILE'", "[도장·결재] 좌하단 연필 이니셜: [판독불가]", "[도장·결재] 상단 여백(마이크로필름 촬영 시 삽입): 'Declassified E.O. 12065 Section 3/402/ NNDG NO. 775091'", "편철 메모 — 면 우하단 '11'은 사본번호(COPY NO.)이지 일련번호가 아님"], "note": "번역자 주 — 색인에서는 전문번호가 타자기로 덧쳐져 판독이 되지 않았으나, 원본 스캔(0016면) 상단 'NR : TFGCG 334'는 선명하게 판독된다. 전문번호는 TFGCG 334로 확정.\n\nOCR의 'TOCG 334'는 판독 오류다. 원저자 표기는 그대로 두었다 — 'Langdons'(어포스트로피 없음)는 원문 그대로.\n\n원문에 'Tutelary period'라 되어 있어 '후견 기간'으로 옮겼다(신탁통치 trusteeship와 구분).\n\n우하단 '11'은 사본번호(COPY NO.)이지 문서 일련번호가 아니다.", "warn": false, "pages": ["0016"], "search": "하지(John R. Hodge) — CG USAFIK, 발신자 맥아더(Douglas MacArthur) — SCAP, 수신자 랭던(William R. Langdon) — 주한 미국 정치고문 발라사노프(Gerasim M. Balasanov) — 소련군 사령관 정치고문 9 TFGCG [?]4 - Personal views of Balasanov, Russian Polad"}, {"id": "8-B", "order": 802, "date": "1946-02-25", "group": "D", "eyebrow": "편철 8-B · 0017–0017면", "title": "송부 서한", "badge": null, "list_right": "8-B", "meta": [{"k": "일자", "v": "1946-02-25"}, {"k": "발신", "v": "태평양미육군총사령관(CINCAFPAC)", "txt": true}, {"k": "수신", "v": "제24군단장(CG XXIV CORPS)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "J.C.S. 1483/24"}, {"k": "종류", "v": "라우팅 슬립"}, {"k": "면", "v": "0017–0017 (1면)"}, {"k": "건명", "v": "Letter of Transmittal", "txt": true}, {"k": "색인 요지", "v": "Ltr-Ltr of Transmittal, forwarding of Political policy for Korea.", "txt": true, "wide": true}], "summary": "J.C.S. 1483/24 「송부 서한」 각서가 참모장실로 반출되어 그 자리를 대신하는 기록용 쪽지만 편철된 면이다.", "points": ["본체는 1946년 2월 25일자 J.C.S. 1483/24, 건명 「송부 서한」(Letter of Transmittal)이다.", "그 각서는 편철에서 빼내어 참모장실(O of C/S)로 보내졌다.", "따라서 문서철에는 본문 없이 「기록용 쪽지」(NOTE FOR RECORD) 한 장만 남아 있다.", "면 하단에 연필로 편철기호 '8-B'."], "primary": "기록용 쪽지\n\nJ.C.S. 1483/24\n\n일자: 1946년 2월 25일\n\n건명: 송부 서한\n\n본 각서는 빼내어 참모장실로 보냈음", "secondary": "NOTE FOR RECORD\n\nJ.C.S. 1483/24\n\nDATE: 25 Feb 46 SUBJ: Letter of Transmittal\n\nTHIS MEMO PULLED AND SENT TO O OF C/S", "notes": ["[도장·결재] 면 하단 좌측 연필: '8-B' (편철기호)", "[도장·결재] 면 상단 여백(촬영 원판 상단): 'Declassified E.O. 12065 Section 3/402/ NNDG NO. [판독불가]' — 미국 국립문서기록관리청 비밀해제 표기", "[도장·결재] 타자 문구 '본 각서는 빼내어 참모장실로 보냈음'(THIS MEMO PULLED AND SENT TO O OF C/S) 자체가 반출 표시", "편철 메모 — 본체 문서는 O of C/S 로 반출되었고 대체 쪽지(NOTE FOR RECORD)만 편철됨"], "note": "번역자 주 — 문서번호 J.C.S. 1483/24 는 규칙에 따라 번역하지 않고 그대로 두었다. 원면에 접수 도장은 없고, 종이 상단에 서류 편철용 구멍 자국(검게 찍힌 두 점)만 보인다. 본문 각서가 없으므로 doc_type 을 '라우팅 슬립'으로 두었다(문서철에서는 반출 대체 쪽지 역할).", "warn": false, "pages": ["0017"], "search": "8-B Ltr-Ltr of Transmittal, forwarding of Political policy for Korea."}, {"id": "8-A", "order": 801, "date": "1946-02-12", "group": "C", "eyebrow": "편철 8-A · 0018–0023면", "title": "조선에 관한 정치 정책 (J.C.S. 1483/23, /25, /26)", "badge": "Top Secret", "list_right": "8-A", "meta": [{"k": "일자", "v": "1946-02-12"}, {"k": "발신", "v": "육군부 참모부, 워싱턴(WD GS WASH)", "txt": true}, {"k": "수신", "v": "태평양미육군총사령관 전진지휘소(CINCAFPAC ADV)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "J.C.S. 1483/23 · J.C.S. 1483/25 · J.C.S. 1483/26"}, {"k": "종류", "v": "각서"}, {"k": "면", "v": "0018–0023 (5면)"}, {"k": "건명", "v": "Political Policy for Korea (J.C.S. 1483/23, /25, /26)", "txt": true}, {"k": "색인 요지", "v": "MEMO-Political policy for Korea, JCS 1483/23, /25, &/26.", "txt": true, "wide": true}], "summary": "합동참모본부 문서 J.C.S. 1483/23·/25·/26 「조선에 관한 정치 정책」의 본체 각서는 참모장실로 반출되어 이 문서철에는 남아 있지 않고, 그 자리를 표시하는 기록용 쪽지 한 장과 1946년 2월 22일자 배포 라우팅 슬립 세 장, 그리고 슬립 뒷면의 자필 메모만 편철되어 있다.", "points": ["본체 각서는 편철되어 있지 않다 — 쪽지에 「THIS MEMO PULLED AND SENT TO O OF C/S」(이 각서는 빼내어 참모장실로 보냄)라고 적혀 있다.", "문서번호와 일자: J.C.S. 1483/23 (1946년 1월 29일), J.C.S. 1483/25 (1946년 1월 30일), J.C.S. 1483/26 (1946년 1월 30일).", "건명은 「조선에 관한 정치 정책(Political Policy for Korea)」 — J.C.S. 1483 계열은 조선 민사(civil affairs)에 관한 기본 지령 계통이다.", "라우팅 슬립 3장 모두 1946년 2월 22일자 GHQ SCAP/AFPAC 부관부 발행이며, 「Copies furnished interested staff sections, this headquarters」(본 사령부의 관계 참모부에 사본 배포)라고 적혀 있다. 한 장에는 「Five copies」(5부)라고 덧붙어 있다.", "슬립 뒷면 자필 메모: 「Bunker — 이건 전에 이미 총사령관께 올라간 적이 있는 것 같은데, G-3 에서 올라온 것일 수도 있네. 확인해 주게.」 — 총사령관 부관 로런스 벙커(Laurence Bunker)에게 보내는 사무 지시로 보인다."], "primary": "## 1. 기록용 쪽지 (0018)\n\n**기록용 쪽지(NOTE FOR RECORD)**\n\nJ.C.S. 1483/23 — 1946년 1월 29일\nJ.C.S. 1483/25 — 1946년 1월 30일\nJ.C.S. 1483/26 — 1946년 1월 30일\n\n일자:\n\n건명: 조선에 관한 정치 정책(Political Policy for Korea)\n\n이 각서는 빼내어 참모장실로 보냄.\n\n(좌하단 연필: 8-A)\n\n## 2. 라우팅 슬립 (0019 · 0020 · 0022)\n\n**1급비밀**\n\n연합국최고사령관 겸 태평양미육군총사령부 전진제대, 부관부(A.G.) 라우팅 슬립 — 1946년 2월 22일\n\n수신처 인쇄 목록: 총사령관, 참모장, 작전담당 부참모장, 군사비서관, 부관, G-1, G-2, G-3, G-4, 부관감, 화학장교, 병기장교, 통신장교, 공병감, 대공포장교, 감찰감, 공보장교, 헌병감, 군의감, 방첩장교, 공중보건복지부, 재무국장, 정보교육부, 경제과학과, 정부과, 조달관, 천연자원과, 통계보고과, 법무과, 사령부 위수사령관, 민간인사과, 국제검찰부 등.\n\n용도 인쇄 목록: 승인 / 의견 또는 동의 / 정보 / 서명날인 / 명령 발령 / 필요 조치 / 열람 후 반송 / 배포 요망 / 서명 / 발송 / 참조 첨부 / 편철.\n\n하단 인쇄: 「본 사령부의 관계 참모부에 사본 배포함(Copies furnished interested staff sections, this headquarters).」 (0022 에는 「5부(Five copies)」가 덧붙어 있다.)\n\n(각 장 하단 연필: 8-A)\n\n## 3. 라우팅 슬립 뒷면 자필 메모 (0023)\n\n(라우팅 슬립 한 장의 뒷면. 상단에 「W-95.」)\n\n> 벙커(Bunker)\n>\n> 이건 전에 한 번 총사령관께 올라간 적이 있는 것 같네. G-3 에서 올라온 것일 수도 있고. 확인해 주게 —", "secondary": "## 1. Note for Record (0018)\n\nNOTE FOR RECORD\n\nJ.C.S. 1483/23    29 Jan 46 J.C.S. 1483/25    30 Jan 46 J.C.S. 1483/26    30 Jan 46\n\nDATE:\n\nSUBJ: Political Policy for Korea\n\nTHIS MEMO PULLED AND SENT TO O OF C/S\n\n[pencil, lower left: 8-A]\n\n## 2. Routing Slips (0019, 0020, 0022)\n\nTOP SECRET\n\nGENERAL HEADQUARTERS\nSUPREME COMMANDER FOR THE ALLIED POWERS AND\nUNITED STATES ARMY FORCES, PACIFIC — ADVANCE ECHELON\n\nROUTING SLIP\n\nFROM: A.G.        22 FEB 1946\n\nTO: [printed distribution list] Commander-in-Chief / Chief of Staff / D C/S for Opns / Military Secretary / Aides-de-Camp / G-1 / G-2 / G-3 / G-4 / Adjutant General / C Chem O / C Ord O / C Signal O / C Engineer / Antiaircraft O / Public Relations O / Inspector General / C Provost Marshal / Surgeon / C Counter Intel O / C Publ Health & Welfare / Fiscal Director / C I & E Services / C Econ & Sc Sec / Gov't Sec / Gen Procurement Agent / C Natural Resources / C Stat & Reports / C Legal Section / Headquarters Commandant / O Civilian Personnel / Int'l Pros Sec / C QM O FOR: Approval / Comment or Concurrence / Information / Initials / Issuance of Orders / Necessary Action / Note & Return / Dist'n Desired / Signature / Dispatch / Attachment of Reference / File Copies furnished interested staff sections, this headquarters. [0022 adds:] Five copies\n\nTOP SECRET\n[pencil: 8-A]\n\n## 3. Handwritten note on reverse of a routing slip (0023)\n\nW-95.\n\nBunker Believe this has been sent in to CinC once before - it may have come up from G-3 - Please check -", "notes": ["[도장·결재] (0018) 좌하단 연필 편철기호: 「8-A」", "[도장·결재] (0019·0020·0022) 상하단 「TOP SECRET」 인쇄, 부관부 「A. G.」 대형 고무인, 날짜 고무인 「22 FEB 1946」", "[도장·결재] (0020·0022) 하단 연필 편철기호: 「8-A」", "[도장·결재] (0019·0020·0022) 인쇄 문구 「Copies furnished interested staff sections, this headquarters.」, 0022 에 자필 「Five copies」", "[도장·결재] (0022) 수신 항목 여백에 자필 체크·서명 [판독불가]", "[도장·결재] (0023) 상단 자필: 「W-95.」, 본문 자필 메모 4행", "편철 메모 — 본체 각서는 O of C/S 로 반출, NOTE FOR RECORD(0018)와 1946-02-22자 라우팅 슬립 3장(0019·0020·0022)만 편철. 0019 는 연필 일련번호가 보이지 않으나 동일 일자·동일 양식 슬립이라 8-A 로 묶음. 0023 은 라우팅 슬립 뒷면 자필 메모(\"Bunker — believe this has been sent in to CINC once before, it may have come up from G-3. Please check\")로 일련번호 없음(match 근거 약함)"], "note": "번역자 주 — 1) 본체 각서가 편철되어 있지 않으므로 「조선에 관한 정치 정책」의 실제 내용은 이 문서철에서 확인할 수 없다. 남은 것은 자리표시 쪽지 1장, 라우팅 슬립 3장, 슬립 뒷면 자필 메모 1장이다. 2) 문서번호 J.C.S. 1483/23, /25, /26 은 번역하지 않고 그대로 두었다. 3) 0019 에는 연필 편철기호가 보이지 않으나 날짜·양식이 동일하여 documents.json 이 8-A 로 묶었다. 0023 도 편철기호가 없어 배정 근거가 약하다. 4) 라우팅 슬립의 수신·용도 항목 체크 표시는 마이크로필름 상태가 나빠 어느 항목이 표시되었는지 확정할 수 없어 인쇄 목록만 옮겼다. 5) 0018 OCR 은 'NOTE PORT RECORD', 'FULLED'로 읽었으나 원본 양식은 'NOTE FOR RECORD', 'PULLED'다.", "warn": true, "pages": ["0018", "0019", "0020", "0022", "0023"], "search": "벙커(Bunker) — 자필 메모의 수신자. 맥아더 총사령관의 군사비서관 로런스 E. 벙커(Laurence E. Bunker) 대령으로 추정되나 원문에는 성만 있다 8-A MEMO-Political policy for Korea, JCS 1483/23, /25, &/26."}, {"id": "7-M", "order": 713, "date": "1946-05-12", "group": "B", "eyebrow": "편철 7-M · 0021–0025면", "title": "TFGCG 352에 대한 회신 의견", "badge": "Top Secret", "list_right": "7-M", "meta": [{"k": "일자", "v": "1946-05-12"}, {"k": "발신", "v": "워싱턴(육군참모총장, WARCOS)", "txt": true}, {"k": "수신", "v": "태평양미육군총사령관(CINCAFPAC) — 주한미군사령부로 전달할 것(PASS TO USAFIK)", "txt": true}, {"k": "참조", "v": "총사령관 · 참모장 · G-2 · 부관부(AG) · 민정부장(C GOVT SEC) · 외교부(DIPLOMATIC SEC)", "txt": true}, {"k": "전문번호", "v": "W 87750"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0021–0025 (2면) · 사본 1면"}, {"k": "건명", "v": "Comments re TFGCG 352", "txt": true}, {"k": "색인 요지", "v": "W 87750 - Comments re TFGCG 352.", "txt": true, "wide": true}], "summary": "미소 양군 동시 철수를 거론한 하지의 전문 TFGCG 352에 대해, 국무·육군·해군 3부가 철수 자체에는 동의하나 지금 미국이 먼저 철병을 제안해서는 안 된다고 못박고, 조선에서 목표를 달성할 때까지 남는다는 원칙을 굳게 지키라고 회신한 전문이다.", "points": ["하지가 처한 임무의 어려움은 워싱턴에서도 충분히 인식하고 있다.", "국무·육군·해군 3부는 '가능한 한 이른 시기에 소련군과 미군이 동시 철수하는 것이 바람직하다'는 점에서는 하지와 전적으로 의견이 같다.", "그러나 지금 시점에서 미국이 미소 점령군 공동 철수로 이어질 제안을 먼저 내놓아서는 안 되며, 그런 뜻을 품고 있다는 시사조차 있어서는 안 된다.", "철병을 고려한다는 낌새가 보이면 조선인과 소련은 이를 '미국이 스스로 떠맡은 책임에서 벗어나려 한다'는 뜻으로 해석할 것이다.", "'소련이 동시에 철수하지 않는 한 철수할 뜻이 없다'고 아무리 항변해도, 지금 통일과 자치를 위해 미국에 기대는 조선인들은 절망하여 소련 쪽에 붙어 안전을 구할 수 있다. 소련은 그런 해석을 부추길 것이고, 스스로도 비타협적 태도를 계속할 용기를 얻을 것이다.", "'설령 공산주의가 일시 지배권을 잡더라도 조선인은 그에 반란을 일으킬 것'이라는 하지의 진술에 대해 — 조선의 공산정권 뒤에는 소련의 군사력이 있음을 잊어서는 안 된다.", "미국이 조선을 일본의 지배에서 해방시켜 놓고 결국 소련에 의한(아무리 가려져 있더라도) 예속을 손쉽게 만들어 준 처지에 놓인다면 그야말로 매우 불행한 일이다.", "따라서 '조선에서 우리의 목표를 달성하는 데 필요한 만큼 오래 남을 준비가 돼 있다'는 원칙 위에 굳게 서야 한다.", "한편 하지가 보고한 조선의 변화된 정세에 비추어, 본국 정부는 현행 지령의 개정을 검토하고 있다.", "이 전문은 신호소로 넘겨져 주한미군사령관에게 처리용으로 재발신되었다."], "primary": "TFGCG 352 를 참조함. 하지(John R. Hodge) 장군이 직면한 임무의 어려움은 이곳에서도 충분히 이해하고 있음. 국무·육군·해군 3부는 소련군과 미군이 가능한 한 이른 시기에 조선에서 동시 철수함이 바람직하다는 점에 관하여 하지 장군과 전적으로 의견을 같이함. 그러나 현 시점에서 미국이 미·소 점령군의 공동 철수로 이어질 제안을 먼저 내놓아서는 아니 되며, 우리가 그러한 조치를 염두에 두고 있다는 어떠한 시사도 있어서는 아니 된다고 봄. 우리가 조선에서 병력 철수를 고려하고 있을지 모른다는 조짐이 보이면, 조선인과 소련은 이를 우리가 떠맡은 책임에서 스스로 벗어나려는 의사로 해석할 것임. 소련이 동시에 철수하지 않는 한 철수할 의사가 없다는 취지로 우리가 아무리 항변한다 하더라도, 지금 통일과 자치의 달성을 위하여 미국에 기대고 있는 조선인들은 절망하여 소련 편에 서는 것으로 안전을 구하려 할 수 있음. 소련은 아마도 그러한 해석을 조장할 것이며, 그들 자신도 비타협적 태도를 계속하도록 고무될 것임.\n\n\"설령 공산주의가 일시적으로 지배권을 얻는다 하더라도 조선인은 그에 반란을 일으킬 것\"이라는 하지 장군의 진술에 관하여는, 조선의 공산정권 배후에 소비에트 러시아의 군사력이 있으리라는 점을 기억하여야 함. 미국이 조선을 일본의 지배로부터 해방시켜 놓고서 결국 — 아무리 가려진 형태라 하더라도 — 소련에 의한 예속을 용이하게 하여 준 처지에 놓인다면 이는 매우 불행한 일이 될 것임.\n\n그러므로 우리는 조선에서 우리의 목적을 달성하는 데 필요한 기간만큼 머무를 준비가 되어 있다는 원칙 위에 계속 확고히 서야 함. 한편 하지 장군이 보고한 바 조선의 변화된 정세에 비추어, 본국 정부는 그가 현재 그 아래에서 활동하고 있는 지령들의 개정을 검토하고 있음.\n\n육군참모총장", "secondary": "GENERAL HEADQUARTERS, U.S. ARMY FORCES, PACIFIC\nADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\n\nINCOMING MESSAGE\n\nTOP SECRET\nPRIORITY\n12 May 1946\n\nFROM : WASHINGTON\nTO : CINCAFPAC (PASS TO USAFIK)\nNR : W 87750 Reference TFGCG 352. The difficulty of the task which faces General Hodge is fully appreciated here. The State, War and Navy Departments agree completely with him in regard to the desirability of simultaneous withdrawal of Soviet and United States Armed Forces from Korea at the earliest practicable date. It is believed, however, that at this time the US should not initiate proposals leading towards the joint withdrawal of the United States and Soviet occupation forces, or that there be any suggestion that we have such action in mind. Any indication that we may be considering troop withdrawals from Korea would probably be interpreted by the Koreans and Soviets as a desire on our part to rid ourselves of the responsibility we have assumed in Korea. Despite protestations we might make to the effect that we had no intention of withdrawing unless the Soviets withdrew simultaneously, those Koreans who now look to US for assistance in achieving unity and self-government would despair and possibly seek security by aligning themselves with the Soviets. The Soviets would probably foster such an interpretation, and would themselves be encouraged to continue their intransigeance.\n\nWith reference to General Hodge's statement \"that even though communism should get temporary control, the Koreans would revolt against it\", it must be remembered the Korean communist government would have the military might of Soviet Russia behind it. It would be most unfortunate if the US were to be placed in the position of having freed Korea from Japanese domination only to facilitate its subjugation, however veiled, by the Soviets.\n\nWe should, therefore, continue to stand firmly upon the principle that we are prepared to remain as long as necessary to achieve our objectives in Korea. Meanwhile, in view of changed conditions in Korea as reported by General Hodge, this government is giving consideration to the [-2-] revision of present directives under which he is operating.\n\nWAR COS\n\nINFORMATION: COMMANDER-in-CHIEF, CHIEF OF STAFF, G-2, AG, C GOVT SEC, DIPLOMATIC SEC NOTE: This message has been passed to Signal Center for re-dispatch to CG USAFIK for ACTION.\n\n25522\nPRIORITY\nTOP SECRET\nTOO: 112123 Z\nMCN: YFC 14/12\n\nCOPY NO. 16\nA. G. FILE\n\nHandling and transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) (2) (3), and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946.", "notes": ["[도장·결재] [0021] 우측 상단 사각 고무인: 'GHQ AFPAC AGO RECORDS' — 그 안에 손글씨 '014.1 Korea TS-S'", "[도장·결재] [0021] 'TOP SECRET' 고무인 2회(제목 위·아래)", "[도장·결재] [0021] 전문 머리 우측 손글씨 회부 표시: 'X 091 Korea / X 091. Russia / X 000.1' 및 그 아래 이니셜 서명 [판독불가]", "[도장·결재] [0021] NR 난 우측 손글씨: '014.1 Korea TS-S'", "[도장·결재] [0021] 'TFGCG 352' 밑줄(손글씨)", "[도장·결재] [0021] 우측 하단: 'COPY NO. 16', 대형 고무인 'A. G. FILE'", "[도장·결재] [0021] 면 하단 좌측 연필: '7-M', 그 위 표기 [판독불가]", "[도장·결재] [0025] 하단 좌측 연필: '7-M'", "[도장·결재] [0025] 'WASHINGTONS W 87750 dated 12 May 1946 cont;' 에 손글씨 밑줄", "[도장·결재] [0025] 하단 인쇄: 'COPY NO.'(번호 미기입), 'PRIORITY / TOP SECRET'", "편철 메모 — 0021 이 1면, 0025 가 2면. 0024 는 0021 의 사본(dupes.json)"], "note": "번역자 주 — 원문 표기 'intransigeance'(=intransigence), 'Weshould'(띄어쓰기 누락), 'WAR COS'(=WARCOS, 육군참모총장)는 고치지 않고 그대로 두었다. 전문 머리에 타자된 날짜는 12 May 1946 이나 발신 시각(TOO)은 112123 Z 로 5월 11일이다 — 숫자열은 손대지 않고 그대로 두었다. 0025 하단의 '25522'는 전신 정리번호로 보인다. 본문의 '-2-'는 면 구분 표시이므로 한국어 본문에는 옮기지 않았고 영문에만 위치 표시로 남겼다. 이 전문은 조선 관계 문서가 부관부 파일 014.1 Korea 외에 091 Korea·091 Russia·000.1 로도 교차 회부되었음을 손글씨로 보여 준다.", "warn": false, "pages": ["0021", "0025", "0024"], "search": "하지(General Hodge, John R. Hodge) — 주한미군사령관 7-M W 87750 - Comments re TFGCG 352."}, {"id": "7-L", "order": 712, "date": "1946-05-11", "group": "B", "eyebrow": "편철 7-L · 0026–0026면", "title": "모스크바로의 전문 전달 요청을 이행하겠음", "badge": "Top Secret", "list_right": "7-L", "meta": [{"k": "일자", "v": "1946-05-11"}, {"k": "발신", "v": "워싱턴(WASHINGTON) — 육군참모총장(WARCOS)", "txt": true}, {"k": "수신", "v": "태평양미육군총사령관(CINCAFPAC)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "W 87540"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0026–0026 (1면)"}, {"k": "건명", "v": "Will comply your request to pass messages to Moscow", "txt": true}, {"k": "색인 요지", "v": "W 87540 - Will comply your req to pass mesgs to Moscow.", "txt": true, "wide": true}], "summary": "육군부는 도쿄가 요청한 대로 전문을 모스크바로 전달하겠으며, 앞으로 조선에서의 소련 측과의 관계에 관한 전문에는 모스크바로 계속 보낼 것인지를 발신 시점에 명시해 달라고 요구한다.", "points": ["C 60607, TFGCG 352, W 86432을 참조한 회신이다.", "도쿄의 요청대로, 도쿄가 따로 중계를 요청하지 않았더라도 워싱턴이 모스크바에 중요하다고 판단하는 전문은 모스크바로 전달하겠다.", "환문(paraphrasing)과 재암호화를 최소로 줄이기 위해, 조선에서의 소련 측과의 관계에 관한 전문에는 모스크바로의 계속 전달 여부를 발신 때 표시해 달라.", "특히 소련과의 정부 간 교섭을 요청하는 전문이 그렇다.", "처리(ACTION)는 총참모부 비서실, 정보 배포는 총사령관·참모장·부관감·G-2·정부부·경제과학부·외교부."], "primary": "C 60607, TFGCG 352 및 W 86432 참조. 귀관이 모스크바로 전달해 달라고 요청하지 않았던 전문이라도 이곳(워싱턴)에서 모스크바에 중요하다고 판단되는 것은 모두 모스크바로 전달해 달라는 귀관의 요청을 이행하겠음. 환문(換文)과 재암호화를 최소한으로 줄이기 위하여, 조선에서의 소련 측과의 관계에 관한 모든 전문 — 특히 소련과의 정부 간 교섭을 요청하는 전문 — 에는 모스크바로의 계속 전달 여부를 표시해 줄 것을 요청함.\n\n육군참모총장(WARCOS)", "secondary": "Reference C 60607, TFGCG 352 and W 86432 will comply your request to pass to Moscow all your messages which are believed here of importance to Moscow which you had not requested be relayed there. To reduce paraphrasing and recoding to a minimum, request you indicate onward passage to Moscow on all messages concerning relations with Soviets in Korea, particularly messages in which governmental negotiation with Soviets is requested.\n\nWARCOS\n\nACTION: SECY GEN STAFF INFORMATION: COMMANDER-in-CHIEF, CHIEF OF STAFF, AG, G-2, GOVT SEC, ECON & SCI SEC, DIPLOMATIC SEC 24817    ROUTINE / TOP SECRET    TOO: 101745 Z    MCN: YE 16/11", "notes": ["[도장·결재] 우측 상단 고무인 : 'GHQ AFPAC / AGO RECORDS'", "[도장·결재] 고무인 옆 손글씨 : '014.1 Korea TS-3'", "[도장·결재] 상단 손글씨 편철 지시(연필/잉크) : 'X 091 Russia', 'X 311.23', 'X 483[?]' — 다른 문서철로의 상호참조 표시. 일부 판독불가", "[도장·결재] 우측 손글씨 결재 서명 1개 [판독불가]", "[도장·결재] 하단 고무인 : 'AG RECORD COPY'", "[도장·결재] 하단 우측 : 'COPY NO. 22'", "[도장·결재] 좌측 하단 연필 편철기호 : '7-L'", "[도장·결재] 본문 위에 겹쳐 찍힌 고무인 : 'TOP SECRET'", "[도장·결재] 상단 여백 : 'Declassified E.O. 12065 Section 3/402/ NNDG NO. 775041[?]' — 비밀해제 표기, 번호 일부 판독불가"], "note": "번역자 주 — 인쇄 양식의 하단 문구(전문 평문 취급 근거, AR 380-5, 6 March 1946)는 정형 문구라 en 에서 생략했다. 참조 전문번호 C 60607 / TFGCG 352 / W 86432 는 원본 그대로 옮겼다. 'TFGCG'는 주한미군사령부 발신 전문 접두어다.", "warn": false, "pages": ["0026"], "search": "7-L W 87540 - Will comply your req to pass mesgs to Moscow."}, {"id": "7-K", "order": 711, "date": "1946-05-02", "group": "B", "eyebrow": "편철 7-K · 0027–0027면", "title": "TFGCG 352 · W 81417 · C-59120 관련 — 건의를 조속히 검토할 것", "badge": "Top Secret", "list_right": "7-K", "meta": [{"k": "일자", "v": "1946-05-02"}, {"k": "발신", "v": "워싱턴(WASHINGTON) — 서명 WARCOS(육군참모총장)", "txt": true}, {"k": "수신", "v": "태평양미육군총사령관(CINCAFPAC) — 주한미군사령관에게 전달 요망(PASS TO CG USAFIK)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "W 86432"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0027–0027 (1면)"}, {"k": "건명", "v": "Reference TFGCG 352, W 81417 and C-59120 — recommendation will receive early consideration", "txt": true}, {"k": "색인 요지", "v": "W 86432 - Recommendation to rcvd consideration.", "txt": true, "wide": true}], "summary": "주한미군사령부의 건의(TFGCG 352)를 국무·육군·해군 3부가 조속히 검토할 것임을 알리고, 그 전문을 기왕의 방침에 따라 주(駐)모스크바 미국 무관에게 전달해 줄 것을 요구한 짧은 전문이다.", "points": ["참조 전문 — TFGCG 352, W 81417, C-59120.", "건의는 국무·육군·해군 3부가 조속히 검토할 것이다.", "W 81417과 귀 전문 C-59120으로 정해진 방침에 따라 TFGCG 352를 주모스크바 미국 무관에게 전달해 줄 것을 요구한다.", "취급 구분은 ROUTINE(보통)이며, 조치는 참모총국(SEC GEN STAFF)이 맡는다.", "면 하단 비고 — 'This message has ~~not~~ been passed'에서 'not'을 타자로 지워 이 전문이 실제로 전달되었음을 표시했다."], "primary": "TFGCG 352, W 81417 및 C-59120 참조.\n\n건의는 국무부·육군부·해군부의 조속한 검토를 받을 것임.\n\nW 81417 및 귀 전문 C-59120으로 확립된 방침에 따라 TFGCG 352를 주(駐)모스크바 미국 무관(US Military Attache Moscow)에게 전달해 줄 것을 요구함.\n\nWARCOS(육군참모총장)\n\n[조치] 참모총국(SEC GEN STAFF)\n[정보] 총사령관(COMMANDER-IN-CHIEF), 참모장(CHIEF OF STAFF), G-2, 부관부(AG), 정부과장(C GOVT SEC), 외교과(DIPLOMATIC SECTION)\n[비고] 이 전문은 전달되었음.", "secondary": "Reference TFGCG 352, W 81417 and C-59120.\n\nRecommendation will receive early consideration by State, War and Navy Departments.\n\nRequest you pass TFGCG 352 to US Military Attache Moscow in accordance with policy established by W 81417 and your C-59120.\n\nWARCOS\n\nACTION: SEC GEN STAFF INFORMATION: COMMANDER-IN-CHIEF, CHIEF OF STAFF, G-2, AG, C GOVT SEC, DIPLOMATIC SECTION NOTE: This message has [not — struck out] been passed.\n\nTOO: 012155 Z\nMCN: ZUB 6/2", "notes": ["[도장·결재] 우측 상단 접수 도장 — 'GHQ AFPAC AGO RECORDS', 그 안 손글씨 '014.1 Korea TS-3'", "[도장·결재] 전문번호 옆 손글씨 — '014.1 Korea', '334(s)'(두 번 기입)", "[도장·결재] 비고란 'NOTE: This message has not been passed.'에서 'not'을 타자로 지워 놓음", "[도장·결재] 비고란 옆 손글씨 — '[판독불가] G-4-C / R/C'", "[도장·결재] 좌하단 타자 '19351' · 하단 'TOP SECRET' 도장 · 'A. G. FILE' 도장 · 'COPY NO. 19'", "[도장·결재] 하단 인쇄 — 'Handling and transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) (2) (3), and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946.'", "[도장·결재] 좌하단 연필 편철기호 '7-K' 및 그 위 판독불가 연필 표시"], "note": "번역자 주 — 전문번호와 참조번호(TFGCG 352, W 81417, C-59120, W 86432)는 읽은 그대로 두었다. 비고란의 손글씨는 활자가 겹쳐 'G-4-C R/C'로 읽히나 앞부분은 판독하지 못했다.", "warn": false, "pages": ["0027"], "search": "7-K W 86432 - Recommendation to rcvd consideration."}, {"id": "7-J", "order": 710, "date": "1946-04-27", "group": "B", "eyebrow": "편철 7-J · 0028–0030면", "title": "조선의 정세", "badge": "Top Secret", "list_right": "7-J", "meta": [{"k": "일자", "v": "1946-04-27"}, {"k": "발신", "v": "제24군단장(CG 24 CORPS) — 하지", "txt": true}, {"k": "수신", "v": "연합국최고사령관(SCAP), 맥아더 장군 앞", "txt": true}, {"k": "참조", "v": "처리(ACTION): 참모부 서기장(SECY GEN STAFF) · 참조(INFORMATION): 총사령관, 참모장, G-2, 정부부(C GOVT SEC), 외교부(DIPLOMATIC SECTION)", "txt": true}, {"k": "전문번호", "v": "TFGCG 352"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0028–0030 (3면)"}, {"k": "건명", "v": "Conditions in Korea", "txt": true}, {"k": "색인 요지", "v": "TFGCG 352 - Conditions in Korea.", "txt": true, "wide": true}], "summary": "하지가 미·소 2국 점령이 계속되는 한 실효적인 조선 중앙정부는 결코 성립할 수 없다고 단언하고, 임시정부 수립 직후 미소 점령군을 1947년 1월 1일까지 공동 철수시키고 4개국 원조위원회와 상징적 주둔병력·고문만 남길 것을 긴급 건의한 전문.", "points": ["조선의 상황과 러시아의 책동·정치침투·공작 방식을 볼수록, 현재의 2국 점령이 계속되는 한 실효적으로 작동하는 조선 중앙정부는 결코 있을 수 없다고 확신하게 된다.", "러시아는 전쟁에 이르지 않는 범위에서 완전한 러시아 통제 공산주의 조선정부를 세우기 위해 할 수 있는 모든 일을 하고 있고 앞으로도 할 것이다.", "러시아의 힘의 원천 — 북조선의 강력한 군사력, 만주에서의 성공적 조종, 조선 전역의 완전히 통제되고 잘 조직된 공산주의 운동.", "조선인은 본래 공산주의에 맞지 않으나 내부 사정 때문에 공산주의의 화려한 겉치레가 무지하고 과거에 억압받던 대중에게 '거저 얻는 것'으로 비친다는 평가.", "공산주의가 일시적으로 지배권을 잡더라도 러시아 철수 후 조선인이 반란을 일으킬 것이나, 러시아군이 절반을 점령하고 있는 한 부득이 받아들일 것이다.", "자유주의적 민주정부(아마도 연립형)를 세운다 해도 러시아가 점령하는 한 38도 이북에서는 기능하지 못할 것이다.", "미소 이중점령이 하루씩 계속될수록 이 해방된 민족의 분단은 더 고착되고 회복·재건은 더 어려워진다.", "러시아군은 군사보안을 구실로 자기 지대에 등화관제 상태(blackout conditions)를 유지하고, 조선 경제에 무거운 부담이 되며, 조선인의 행동의 자유를 허용하지 않을 것이다.", "예견되는 결과는 두 가지 — 하나는 러시아와의 전쟁, 다른 하나는 아시아에서 미국인의 완전한 신용 실추.", "실패의 책임은 양국에 돌아가겠지만 러시아의 전 세계적 선전기구가 미국의 잘못이 크다고 세계에 믿게 하려 들 것이다.", "조선인이 우리의 정신적 기준으로 보아 좋은 정부를 이룰 수 있는지는 미결의 문제이나, 임시정부 수립을 도와 출발시키고 선별된 고문을 남겨두면 이중점령 하에서보다 훨씬 빨리 유능한 정부에 가까워질 것이다.", "점령군 철수 후 국지적 소요와 유혈이 있을 것이나, 조선 주권 수립 과정 어딘가에서 반드시 나타나야 할 국면이므로 감수해야 한다.", "긴급 건의: 조선 임시정부 수립·가동 후 최단 시일 내에 미소 점령군 철수의 기초를 국가 차원에서 마련하고, 4개국 원조위원회와 각국의 상징적 주둔병력을 경성에 남기며, 조선인 스스로 요청·희망하는 민간·군사 고문을 함께 둔다. 공동 철수는 1947년 1월 1일까지 완료되어야 한다.", "이 방침이 워싱턴의 현행 사고와 근본적으로 다를 수 있음을 인정하면서도, 조선에서의 임무를 성공적으로 마무리할 유일하게 건전한 기초라고 단언한다. 예하 선임 지휘관·참모·고문 전원이 동의한다."], "primary": "조선의 정세에 관한 종전의 전문들을 참조하기 바란다.\n\n이곳 상황을 오래 연구하고 러시아의 책동, 정치적 침투, 공작 방식을 더 많이 보고 알게 될수록, 현재와 같은 2개국 점령이 계속되는 한 실효적으로 작동하는 조선 중앙정부(Korean Central Government)는 결코 있을 수 없다는 확신이 더 굳어진다.\n\n러시아인은 완전한 러시아 통제 하의 공산주의 조선정부를 수립하기 위하여 전쟁에 이르지 않는 범위에서 자기 힘이 미치는 모든 일을 하고 있으며 앞으로도 계속할 것이다. 조선인에 대한 그들의 처신에도 불구하고, 그들은 북조선에서의 강력한 군사력, 만주에서의 성공적인 조종, 그리고 조선 전역에 걸친 완전히 통제되고 잘 조직된 공산주의 운동을 통하여 조선에서 큰 힘을 가지고 있다. 조선인은 일반적으로 본래 공산주의에 맞는 사람들이 아니나, 그 내부 사정이 이러하여 공산주의의 화려한 겉치레(fancy window dressing)가 무지하고 종래 억압받아 온 대중에게 아무것도 내놓지 않고 무엇인가를 얻게 해 주는 것으로 비친다. 나는 설령 공산주의가 일시적인 지배권을 얻는다 하더라도 러시아인이 철수한 뒤에는 조선인이 그것에 반란을 일으키리라 믿는다. 다만 공산주의자들이 자기 나라 절반에 대한 강력한 러시아 점령의 후원을 받는 동안에는 부득이 그것을 받아들일 것이다.\n\n만일 우리가 바라는 대로 자유주의적 민주정부(아마도 연립형)를 수립할 수 있다 하더라도, 러시아인이 점령하고 있는 한 그 정부가 38도 이북에서 기능하도록 허용되지 않으리라는 것을 나는 확신한다. 원하지 않는 경우, 즉 공산주의 조선정부가 수립되는 경우에는, 러시아인이 떠나는 즉시 그 정부가 사회주의적 민족주의(socialistic nationalism) 쪽으로 기울 것이라고 나는 믿는다. 어느 경우든 미국과 러시아에 의한 이중점령이 계속되는 한 조선은 결코 한 국가로서 발전할 수 없다. 그러한 점령이 하루씩 더할 때마다 이 해방된 민족에 대한 분단은 더욱 고착되고 그 회복과 재건은 더욱 어려워질 것이다. 러시아 군대가 점령하고 있는 한 그들은 군사적 보안을 구실로 자기 지대에 등화관제 상태(blackout conditions)를 유지할 것이며, 조선 경제에 무거운 부담이 될 것이고, 조선인에게 자기 뜻대로 일을 해 나갈 행동의 자유를 허용하지 않을 것이다.\n\n우리가 조선에 어떤 원조를 주든, 미국 군대가 이 해방된 나라에 대한 이중점령에 — 러시아인이 자기 군대에 대한 대립으로 여기는 형태로 — 남아 있는 한, 잘 조직된 (러시아계) 조선인 공산주의 조직들은 모든 면에서 이곳의 우리 병력과 우리의 노력을 끊임없이 잠식할 것이다. 예견되는 결과는 두 가지 중 하나다. 하나는 러시아와의 전쟁이고, 다른 하나는 아시아에서 미국인의 신용이 완전히 실추되는 것이다. 이중점령 기간 중 조선인이 자기 사무를 처리하는 데 성공하지 못한 책임은 물론 양국에 함께 돌아갈 것이나, 오늘날 전 세계적인 정치선전 기구를 가진 러시아인의 무자비하고 교묘한 선전은 미국에 대부분의 잘못이 있다고 세계가 믿게 만들려 할 것이다.\n\n조선 민족이 개인적 성실성의 결여, 다투기 좋아하는 기질, 싸움을 즐기는 태도를 지닌 채로 우리의 정신적 기준(our mental standards)에 비추어 좋은 정부를 어떤 상황에서든 이룰 수 있을지 여부는 미결의 문제다. 그러나 정부의 출발을 도와주고(임시정부의 구성) 그들을 돕도록 선별된 고문들을 남겨 둔다면, 이념과 목표가 크게 어긋나는 두 나라에 의한 이중점령 아래에서보다 그들이 고문과 함께 자기들 방식대로 하도록 맡겨 두는 편이 더 빨리 발전하고 유능한 정부에 더 가까워지리라는 것이 나의 의견이다.\n\n전면적 점령에서 군대가 철수한 뒤에는 얼마간의 국지적 소요와 유혈이 있을 것이 십중팔구다. 그러나 나는 어떤 사태가 벌어지든 이 국면은 조선의 주권을 수립하는 순서 중 어딘가에서 반드시 나타나야 하며 감수되어야 한다고 믿는다.\n\n나는 조선 임시정부가 수립되어 가동된 뒤 가능한 한 이른 시일에 시작하는 미소 점령군 철수를 위한 기초 작업을 국가 차원에서 마련할 것을 긴급히 건의한다. 그 뒤에는 4개국 원조위원회(4 power assisting commission)를 남기되 각국의 상징적 「LEMATION」 병력을 경성(Seoul)에 두고, 조선인 자신이 요청하고 희망하는 민간 및 군사 고문을 함께 둔다. 공동 철수는 1947년 1월 1일보다 늦지 않게 완료되어야 한다. 이러한 사고의 갈래와 건의는 워싱턴의 현재 사고에서 근본적으로 벗어난 것일 수 있으나, 그러한 조치야말로 조선에서 우리의 임무를 성공적으로 마무리할 유일하게 건전한 기초라는 것이 숙고 끝에 내린 나의 의견이다.\n\n나의 선임 지휘관들, 참모 장교들 및 고문들은 이 건의에 동의한다.\n\nHODGE", "secondary": "Reference is made to previous radios on subject of conditions in Korea.\n\nThe longer I study the situation here and the more I see and learn of the Russian intrigue, political penetration and methods on operation, the more convinced I am that there can never be an effective operative Korean Central Government so long as the current 2-nation occupation continues.\n\nThe Russians are doing and will continue to do everything in their power short of war to establish a full fledged Russian-controlled Communist Korean Government. In spite of their behavior toward the Koreans, they have great strength in Korea through their strong military power in north Korea, through their successful manipulations in Manchuria and through their fully controlled and well organized Communist movements throughout all of Korea. Koreans generally are not naturally suited to communism, but their internal condition is such that the fancy window dressing of communism appeals to the ignorant, formerly oppressed masses as enabling them to get something for nothing. I believe that even though communism should get temporary control, the Koreans would revolt against it after the Russians withdraw, although they would perforce accept it so long as the communists are backed by strong Russian occupation of half of their nation.\n\nIf, as we hope, we can establish a liberal democratic government (probably of a coalition type) I feel certain that it will not be allowed to function north of 38 degrees, so long as the Russians are in occupation. In the undesired case of a communist Korean government being established, I believe it would swing toward socialistic nationalism as soon as the Russians leave. In any case, Korea can never develop as a nation so long as the dual occupation by US and Russia continues. Each day of such occupation will make more permanent the division on this liberated nation and make its recovery and rehabilitation more difficult. So long as Russian troops are in occupation they will retain blackout conditions in their zone under guise of military security; will be a heavy burden on Korean economy, and will not allow Koreans freedom of action to follow their own pursuits.\n\nNo matter what assistance we give Korea, as long as American troops remain in dual occupation of this liberated country in what the Russians consider as in opposition to their troops, the well organized (Russian) Korean communist organizations will constantly undermine our forces and our efforts here in every respect. There are 2 alternate foreseeable results. 1 is war with Russia, the other is complete discrediting of Americans in Asia. The responsibility for any lack of success of the Koreans in handling their affairs during the dual occupation will of course desolve upon both nations, but the ruthless and clever propaganda of the Russians with their present world-wide political propaganda machine will attempt to make the world believe the US is mostly at fault.\n\nWhether or not the Korean people, with their lack of individual integrity, their disputive characteristics and their quarrelsome attitude can achieve a good government as judged by our mental standards under any circumstances is a moot question. However, it is my opinion that with an assisted start of a government (formation of a provisional government) and with selected advisors left to help them, they will develop faster and come nearer to a competent government if left to their own devices with advisors than they will ever do under a dual occupation by 2 nations whose idealogy and aims are widely divergent.\n\nIt is probable that following the withdrawal of troops from general occupation, there will be some local disorders and bloodshed. However, I believe that regardless of events, this phase will have to appear some where in the sequence of establishing Korean sovereignty and must be accepted.\n\nI urgently recommend that the ground work be laid on a national level for withdrawal of US-Soviet occupation forces starting at the earliest possible date after a Korean provisional government is established and operating, leaving behind a 4 power assisting commission with token \"LEMATION\" troops of each nation in Seoul, together with such civilian and military advisors as are requested and desired by the Koreans themselves. The joint withdrawal should be completed not later than January 1, 1947. This line of thought and recommendation may be a radical departure from present thinking in Washington, but it is my considered opinion that such action is the only sound basis for the successful conclusion of our mission in Korea.\n\nMy senior commanders, staff officers and advisors concur in this recommendation.\n\nHODGE\n\nACTION: SECY GEN STAFF INFORMATION: COMMANDER-in-CHIEF, CHIEF OF STAFF, G-2, C GOVT SEC, DIPLOMATIC SECTION NOTE: This message has been passed to Signal Center for re-dispatch to WARCOS, JOINT CHIEFS OF STAFF, and STATE DEPARTMENT for INFORMATION. 17052   TOO: 270140 Z   MCN: TJC 44/27 Handling and transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) (2) (3), and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946.", "notes": ["[도장·결재] 고무인(0028면 우상단, 상자 안): 「GHQ AFPAC / AGO RECORDS」, 그 옆 손글씨 '014.1 Korea', 상자 바깥 손글씨 'TS-5'", "[도장·결재] 손글씨 상호참조 지시(0028면 'TOP SECRET' 옆): 'X 014.1', 'X 091 Russia', 'X 091 Korea', 'X 091.4 Korea', 'X 092' — 그 아래 결재 이니셜(판독불가)", "[도장·결재] 0028면 우하단: 'COPY NO.' 란에 '18', 'A. G. FILE'", "[도장·결재] 0028·0029·0030면 좌하단 연필 정리기호: '7-J'", "[도장·결재] 0030면 NOTE 행 손글씨 추가: 'US MIL MIS Moscow'(재발송처 추가 기입), 그 아래 'per (i) G.L.C  R/C'", "[도장·결재] 상단 여백(마이크로필름 촬영 시 삽입): 'Declassified E.O. 12065 Section 3/402/ NNDG NO. 775091'", "편철 메모 — 3면짜리 장문 전문"], "note": "번역자 주 — 0030면 건의 문장 중 'token \"LEMATION\" troops'의 따옴표 안 낱말은 원본에서 따옴표로 묶여 타자된 채 밑줄이 그어져 있으며, 통신 중 문자가 깨진 것으로 보인다. 지어내지 않고 원문 그대로 두었다. 문맥상 각국의 소규모 상징적 주둔병력을 뜻한다.\n\n원저자 오타는 고치지 않았다 — 'desolve'(=devolve), 'idealogy'(=ideology), 'methods on operation'(=methods of operation), 'disputive'(=disputatious/disputive), 'bav e'(=have, 0030면 타자 띄어쓰기 오류).\n\n0029면 'Whether or not the Korean people, with their lack of individual integrity, their disputive characteristics and their quarrelsome attitude...' 및 '무지하고 종래 억압받아 온 대중'은 조선인의 자치 능력을 낮춰 보는 서술이다. 원문 그대로 옮겼고 다듬지 않았다.\n\n0028면 날짜의 앞자리가 흐려 '27 April 1946'의 '2'가 잘 보이지 않으나, TOO 270140 Z 및 MCN TJC 44/27과 일치한다.\n\n색인 상 발신자는 'CG 24 CORPS'로 되어 있어 그대로 두었다. 같은 하지가 문서에 따라 CG USAFIK / CG 24 CORPS 두 직함을 번갈아 쓴다.", "warn": false, "pages": ["0028", "0029", "0030"], "search": "하지(John R. Hodge) — CG 24 CORPS, 발신자 맥아더(Douglas MacArthur) — SCAP, 수신자 7-J TFGCG 352 - Conditions in Korea."}, {"id": "7-I", "order": 709, "date": "1946-03-18", "group": "A", "eyebrow": "편철 7-I · 0031–0033면", "title": "송부 서한", "badge": "Top Secret", "list_right": "7-I", "meta": [{"k": "일자", "v": "1946-03-18"}, {"k": "발신", "v": "태평양미육군총사령부(GHQ AFPAC), APO 500", "txt": true}, {"k": "수신", "v": "제24군단장(Commanding General, XXIV Corps), APO 235", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "AG 091.1 (18 Mar 46) AG-OS"}, {"k": "종류", "v": "서한"}, {"k": "면", "v": "0031–0033 (3면)"}, {"k": "건명", "v": "Letter of Transmittal", "txt": true}, {"k": "색인 요지", "v": "Ltr - Ltr of transmittal, (SWNCC 176/20, 176/21 w/dec amdng)", "txt": true, "wide": true}], "summary": "총사령부가 육군부 참모부 작전국의 1946년 3월 7일자 각서 「미소공동위원회 첫 회합을 위한 지침」을 부록 2건과 함께 제24군단장(하지)에게 참고로 송부한 서한이며, 함께 편철된 배포 라우팅 슬립과 SWNCC 176/20·176/21 자리표시 쪽지가 딸려 있다.", "points": ["송부된 것은 육군부 참모부 작전국(Operations Division, WDGS) 각서, 파일 OPD 092 Korea (7 Mar 46), 1946년 3월 7일자, 건명 「미소공동위원회 첫 회합을 위한 지침(Guidance for Initial Meeting of Joint Commission)」이며 부록 2건이 딸려 있다.", "수신은 제24군단장 — 즉 조선에 있는 하지 중장의 지휘부다. 총사령부는 정책 지침을 워싱턴에서 받아 경성으로 내려보내는 중계 역할을 하고 있다.", "맥아더 장군의 명에 의하여, 부관보 해럴드 페어(Harold Fair) 중령이 서명했다. 부록 1건(3부 작성).", "함께 편철된 라우팅 슬립(0032)은 같은 날짜(1946년 3월 18일)에 「G-2, G-3, 정부과, 통계보고과, 민사과[판독불확실], 제24군단장에게 사본 배포」라고 적고 있다.", "자리표시 쪽지(0033)는 이 사안의 워싱턴 쪽 문서번호를 SWNCC 176/21 (1946년 2월 21일)과 SWNCC 176/20 으로, 일자를 1946년 2월 14일로, 건명을 「미소공동위원회 첫 회합을 위한 지침」으로 적고 있으며, 해당 각서는 참모장실로 반출되었다."], "primary": "## 1. 송부 서한 (0031)\n\n**1급비밀**\n\nAG 091.1 (1946년 3월 18일) AG-OS\n\nAPO 500\n1946년 3월 18일\n\n**건명: 송부 서한(Letter of Transmittal)**\n\n**수신: 제24군단장, APO 235**\n\n귀하의 참고를 위하여, 육군부 참모부 작전국(워싱턴 25, D.C.)의 각서 사본 — 파일 OPD 092 Korea (1946년 3월 7일), 1946년 3월 7일자, 건명 「미소공동위원회 첫 회합을 위한 지침」 — 을 그에 딸린 부록 2건과 함께 동봉한다.\n\n맥아더 장군의 명에 의하여:\n\n해럴드 페어(HAROLD FAIR), 중령, 부관부(A.G.D.), 부관보\n\n부록 1건: 상기와 같음 (3부 작성)\n\n## 2. 라우팅 슬립 (0032)\n\n**1급비밀**\n\n연합국최고사령관 겸 태평양미육군총사령부 라우팅 슬립\n\n발신: 부관부(AG) — 1946년 3월 18일\n\n수신: 총사령관 (1), 부관 (2) 등 [체크 표시 일부만 판독됨]\n\n하단 자필: 「G-2, G-3, 정부과, 통계보고과, 민사과[판독불확실] 및 제24군단장에게 사본 배포함」\n\n## 3. 기록용 쪽지 (0033)\n\n**기록용 쪽지(NOTE FOR RECORD)**\n\nSWNCC 176/21 — 1946년 2월 21일\nSWNCC 176/20\n\n일자: 1946년 2월 14일\n\n건명: 미소공동위원회 첫 회합을 위한 지침\n\n이 각서는 빼내어 참모장실로 보냄.\n\n(좌하단 연필: 7-I)", "secondary": "## 1. Letter of Transmittal (0031)\n\nTOP SECRET\n\nAG 091.1 (18 Mar 46) AG-OS\n\nAPO 500\n18 March 1946\n\nSUBJECT: Letter of Transmittal.\n\nTO: Commanding General, XXIV Corps, APO 235.\n\nInclosed for your information is copy Memorandum, Operations Division, War Department General Staff, Washington 25, D. C., file OPD 092 Korea (7 Mar 46), 7 March 1946, subject: Guidance for Initial Meeting of Joint Commission, with two (2) inclosures thereto.\n\nBy command of General MacARTHUR:\n\nHAROLD FAIR, Lt Colonel, A.G.D., Asst Adjutant General.\n\n1 Incl:\nAs indicated above (in trip)\n\nMAILED 1650 Mar 18 '46 AG - GHQ\n\nTOP SECRET\n[pencil: 7-I]\n\n## 2. Routing Slip (0032)\n\nTOP SECRET\n\nGENERAL HEADQUARTERS\nSUPREME COMMANDER FOR THE ALLIED POWERS\nAND\nUNITED STATES ARMY FORCES, PACIFIC\n\nROUTING SLIP\n\nFROM: AG        18 MAR 1946\n\nTO: Commander-in-Chief (1) ... Adjutant General (2) ... [remaining check marks illegible]\n\nFOR: [printed list] Approval / Comment or Concurrence / Information / Initials / Note & Return / Necessary Action / Issuance of Orders / Dist'n Desired / Signature / Dispatch / File / Attachment of Reference Copies furnished G-2, G-3, Gov't Sec, Stat & Reports, Civ[il] Sec[?] and CG XXIV Corps\n\nTOP SECRET\n\n## 3. Note for Record (0033)\n\nNOTE FOR RECORD\n\nSWNCC 176/21   21 Feb 46\nSWNCC 176/20\n\nDATE: 14 Feb 46 SUBJ: Guidance for initial meetings of Joint commission\n\nTHIS MEMO PULLED AND SENT TO O OF C/S\n\n[pencil, lower left: 7-I]", "notes": ["[도장·결재] (0031) 사각 접수 도장: 「GHQ. AFPAC / 014.1 Korea / 21 MAR 1946 / AGO RECORDS」", "[도장·결재] (0031) 하단 발송 고무인: 「MAILED 1650 Mar 18 '46 AG - GHQ」", "[도장·결재] (0031) 우상단 자필 편철 지시: 「X 000.7 Korea / 091 / 091.1 / 091.4 / 09[1] / 334」 및 서명", "[도장·결재] (0031) 좌하단 자필 결재: 「File as Record Copy(가로줄로 지움) / Col Fair concurred / 22 Mar 46 / [서명] CB」", "[도장·결재] (0031) 좌하단 연필 편철기호: 「7-I」", "[도장·결재] (0032) 부관부 날짜 고무인 「18 MAR 1946」, 자필 「18/25」, 자필 배포 지시 1행", "[도장·결재] (0033) 좌하단 연필 편철기호: 「7-I」", "편철 메모 — 0032 는 배포 라우팅 슬립(CG XXIV Corps 포함), 0033 은 SWNCC 176/20·176/21 관련 NOTE FOR RECORD(연필 '7-I')"], "note": "번역자 주 — 1) 실제 정책 내용(작전국 각서와 부록 2건, SWNCC 176/20·176/21)은 이 문서철에 편철되어 있지 않다. 남은 것은 송부 서한·라우팅 슬립·자리표시 쪽지뿐이다. 2) 0031 의 서명란은 '1 Incl: As indicated above (in trip)'인데 본문은 '부록 2건(with two (2) inclosures thereto)'이라 한다 — 본문 각서 1건에 그 부록 2건이 딸린 구조로 읽힌다. 원문 그대로 두었다. 3) 0033 쪽지의 SWNCC 176/21 은 1946년 2월 21일, 각서 일자는 2월 14일로 적혀 있어 서로 어긋나지만 읽은 그대로 두었다. 4) 0033 원문은 'NOTE FORN RECORD', 'Guidande'로 오타가 나 있다 — 원저자의 오타이므로 en 에 그대로 두었다. 5) 0032 라우팅 슬립 하단 배포처 가운데 한 항목('Civ Sec' 또는 'Cub Sec')은 판독이 불확실하다.", "warn": false, "pages": ["0031", "0032", "0033"], "search": "해럴드 페어(Harold Fair) — 중령, 태평양미육군총사령부 부관보. 서한 서명자이자 0031 자필 결재에 언급된 「Col Fair」 맥아더(General MacArthur) — 서한 발령 명의 7-I Ltr - Ltr of transmittal, (SWNCC 176/20, 176/21 w/dec amdng)"}, {"id": "7-H", "order": 708, "date": "1946-03-04", "group": "B", "eyebrow": "편철 7-H · 0034–0035면", "title": "CA 57792에 대한 회신 — 귀관의 참고 및 지침용", "badge": "Top Secret", "list_right": "7-H", "meta": [{"k": "일자", "v": "1946-03-04"}, {"k": "발신", "v": "워싱턴(WASHINGTON) — 합동참모본부 발(FROM THE JOINT CHIEFS OF STAFF)", "txt": true}, {"k": "수신", "v": "연합국최고사령관(SCAP) — 맥아더 앞(TO MACARTHUR)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "W 98881"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0034–0035 (2면)"}, {"k": "건명", "v": "Reply to CA 57792, furnished for your information and guidance", "txt": true}, {"k": "색인 요지", "v": "W 98881 - Reply to CA 57792 for your info & guidance.", "txt": true, "wide": true}], "summary": "국무·육군·해군 3부에서 받은 CA 57792에 대한 회신을 전달한 것으로, 미소공동위원회 벽두에 조선인의 언론·출판·이동의 자유 합의를 요구하겠다는 하지의 결정을 승인하고, 소련이 응하지 않을 경우의 단계별 대응과 공개 성명 검토를 제시한다.", "points": ["곧 열릴 미소공동위원회 의사(議事) 벽두에 조선 내 조선인의 언론·출판·이동의 자유에 관한 합의를 밀어붙이도록 미국 대표단에 지시하겠다는 하지의 결정을 워싱턴에서 승인했다.", "소련이 처음에 그 조치에 동의하지 않을 경우, 위원회를 휴회로 몰아가기보다 하지는 다음 순서로 대응해야 한다 — (1) 언론·출판·이동의 자유에 관한 입장을 임시정부가 기능하기 시작하기 전의 최종 결정을 위해 유보할 것, (2) 위원회 위원과 그 참모가 조선 전역을 다니며 조선의 민주적 정당·사회단체와 협의할 수 있도록 이동에 관한 초기 합의를 밀어붙일 것, (3) 그런 다음 임시정부의 구조에 관한 심의로 나아갈 것.", "해리먼(Harriman) 대사가 건의하고 국무부가 동의한 바 — 언론·출판·이동의 자유 같은 문제를 위원회에서 논의하기 전에 정부 수준에서 제기해 봤자 얻을 것이 없다.", "소련 대표들이 방해로 나와 위 (1) 또는 (2)의 요구에도 응하지 않는 경우, 공동위원회 사업의 실효성을 해치지 않으면서 하지의 목적을 이루기 위해, 언론·출판·이동의 자유를 장려하려 한 시도를 밝히는 공개 성명을 정부에 요청하는 방안을 검토해도 좋다는 제안.", "그 공개 성명에서는 국제연합 헌장 제1조 제2항 — '사람들의 평등권 및 자결 원칙의 존중에 기초한 국가 간의 우호 관계를 발전시키며, 보편적 평화를 강화하기 위한 그 밖의 적절한 조치를 취한다' — 을 인용하게 될 것이다.", "서명 없음(NO SIG). 이 전문은 신호소로 넘겨져 주한미군사령관에게 조치용으로 재발송되었다."], "primary": "국무·육군·해군 3부로부터 접수한, 귀 전문 CA 57792에 대한 다음 회신을 귀관의 참고 및 지침용으로 송부함.\n\n\"공동위원회의 곧 열릴 의사(議事) 벽두에 조선 내 조선인의 언론·출판·이동의 자유에 관한 합의를 밀어붙이도록 미국 대표단에 지시하기로 한 하지 장군의 결정은 이곳에서 승인되었음. 소련 측이 처음에 그러한 조치에 동의하지 않을 경우, 위원회의 휴회를 강요하기보다 하지는 (1) 언론·출판·이동의 자유에 관한 자신의 입장을 임시정부가 기능하기 시작하기 전의 최종 결정을 위해 유보하고, (2) 위원회 위원과 그 참모가 조선 전역을 다니며 조선의 민주적 정당 및 사회단체와 협의할 수 있도록 이동에 관한 초기 합의를 밀어붙이며, (3) 그런 다음 임시정부의 구조에 관한 심의로 나아가야 함.\n\n해리먼 대사는 이곳에서 건의하였고 국무부도 이에 동의하는바, 언론·출판·이동의 자유 문제와 같은 사항을 위원회에서 논의하기에 앞서 정부 수준에서 제기하는 것으로는 얻을 것이 없음.\n\n공동위원회 사업의 실효성을 해치지 않으면서 동시에 하지의 목적을 달성하기 위하여, 위원회의 소련 대표들이 방해로 일관하고 위 (1) 또는 (2)에 따른 그의 요구에 동의하기를 거부하는 경우, 귀관은 언론·출판·이동의 자유를 장려하려는 귀관의 시도를 밝히는 성명을 귀 정부가 공표하도록 요청하는 방안의 타당성을 검토하기를 바랄 수도 있음. 그러한
