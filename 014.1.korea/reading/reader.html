 station on the first stage of their journey home. Although under heavy Russian guard--each truck carried two Russians armed with tommy-guns--Koreans and Japs lined the roads and waved and cheered. Some wept openly, and many waved American and Korean flags. It was the same at the station. Although the Russians kept the crowd at a distance the locals cheered and clapped as the train pulled out. It was really touching. They regarded the prisoners as their friends. The women especially, looked to them for assistance when they were in trouble.\n\nI might add at this juncture that the camp doctor, Captain George Morris, a Canadian, attached to the Indian Medical Service before being captured in Singapore, since The prisoners took over the camps themselves, daily treated dozens of Jap and Korean women and children. He refused no one. This went on until the prisoners left. His fame went abroad; so much so that he had women calling on him from 10 miles distant.\n\n4)....The Communist element in Russian-occupied Korea is small, but very vocal minority. It is using the Russians to further its own ends. For instance I saw Korean Communists, with two Russians for support, ask a Korean if he was anti-communist. When he denied having anything to do with the Communists he was seized and searched, his money was taken from him, and he was ordered out of Kanko. I had a POW with me at the time who understood what was said and repeated it to me. We then followed the party and saw another Korean forced from his house. When I returned next day Communistic Koreans had taken over the house and the former owner had been sent adrift with nothing but what he stood up in.\n\nI saw much evidence of this. In all cases I was able to check the Russians had played an active part.\n\nI also saw Russians eject from his house a Korean who, foolishly in my opinion, siad he was not in favor of Russia taking over Korea. In several cases I checked I was able to ascertain that where the person said he was not pro-Russian, either by actual statement or inference, he was ejected from his house forthwith and told to go south.\n\nI interviewed two Koreans, both old men, who were walking south, just out of Kanko. Through an interpreter they told me they had been forced from their homes by the Russians. All they stood up in and 30 yen represented their entire possessions.\n\n5)....The Russians, by indiscriminate robbery, obtain all the food they require. I actually accompanied a Russian patrol one day when it haphazardly moved around the city of Kanko. Suddenly the truck turned towards a farm, the Russians jumped out pellmell, and started shooting. They brought back five pigs that had received the combined magazines of several tommy-guns.\n\nThe truck continued on its way. A fowlyard was visited and several fowls collected. The owner was not consulted. It was plaon robbery.\n\nI have seen the Russians go into a field of vegetables and remove the lot, despite the farmer's entreaties that he and his family will starve unless they pay him. But the Russians don't pay for the food they collect. At least I have never seen them pay, and Koreans have told me they have received nothing for the animals and vegetables the Russians have taken.\n\nOne day I lunched with the Russians at their Kanko headquarters. The place was indescribably filthy. The food consisted of rice and cabbage soup and some sort of flapjacks. They told me, through an interpreter, of course, that all the chickens and pork taken from the Koreans, had been consumed the previous night at a big feast. They also told me that most of their food came from the Koreans; they brought very little with them, only rice and a little meal and a very few gegetables.\n\n6).... Russian tanks, heavy trucks and other mobile equipment are moving past Kanko southwards. Every day I was in the area I saw trainloads of men and equipment moving south. In the train today I saw accumulations of Russian equipment, vehicles, supplies, etc., at points just above the 38th parallel. Why they should bring in tanks now that the war is over is beyond my comprehension. The Japs are quiesant; they have no arms with which to fight, anyway. The Russians saw to that early in the peace. Big internment camps are being set up for the reception of the Japs. In these camps, I understand, the Russians supply them with an adequate allowance of rise, but Japs I saw returning from the Manchurian border were starving and nearly mobbed a POW when he held forth a small bar of candy. A Jap, a former wool buyer in Australia who spoke excellent English, said he had eaten nothing for 24 hours and very little in three days. He said Russians, mostly young peasants, had hearded them along like cattle. While the Russians had plenty to eat and rode horses, the Japs had to keep pace on empty stomachs.\n\n7)....All along the line, from Kanko to the American lines, there is a stream of Korean and Jap refugees trekking south. A few I interviewed said they were escaping from the Russians whom they feared. Their one desire was to get to American-occupied Korea. I saw this line just out of Kanko, I saw it coming into Kanko from the Manchurian border, and I saw it entering the American zone, some two hundred miles to the south. I don't suggest that the line stretches that distance without a break, but it is significant. The attitude of the Russians towards the Koreans has had its effect on the industrial enterprises, especially around Kanko and Konan. When I visited the big carbide works at Konan on September 20 and 21 only one of the six furnaces was in operation, and then only at half-cock. On the latter day I counted only four men on the premises which stretch for miles. When the Japs were in occupation the works occupied some 10,000 employees. The same applies to the chemical works. Apart from a few Koreans walking about the whole place was idle on Sept 21. The Koreans say that if the Russians take over the works, as they expect them to do, they will be forced to work hard at low rates of pay. They don't want to work for the Russians, so they are letting the work go idle in the [hope] the Russians won't bother to set them in motion again.\n\n8)....From August 29, when the Russians kicked out the Japs from the POW camp at Konan, until September 21 when the POWs left for Jinsen, the only food supplied by the Russians to the camp consisted of three days' rations of rice, millet, Jap tinned fish, a pig and two small oxen. The prisoners had to depend on the dropping of supplies by the B29's, and from what they could get from the Koreans and Japs in the vicinity of the camp.\n\nThe Russians did nothing to repatriate the prisoners. They promised all sorts of things but nothing happened. The first incident occurred when a B29 was virtually shot down by a Yak fighter. The second incident occurred when my party arrived and told the prisoners they would all be on the way home within two or three days. It was seven days before they moved, thanks to the Russians.\n\nWhen the Russians did act it was with ostentation.\n\nMy summing up is this: The Russians I saw were a poor peasant type, dirty and ill-kempt, without organization or leadership. Some hadn't washed for months by the look of their clothes or faces and necks. They all acted belligerently and with some show of bravado, but it was easy to see they had an inferiority complex. There was no method in anything they did. When they looted, which was pretty often, it was quite indiscriminately.\n\nSome of the Russians had a Mongol look, more like a Tartar. They ate in filth with flies everywhere, even the officers, and they dressed in clothes unwashed for months.\n\nSome told me they had just returned from the Berlin zone. That might account for the condition of their dress, but not for the dirt on their skin. Many supported medals. Some said they had fought in the battle for Moscow and a few said they were at Stalingrad when the Germans there were beaten.\n\nEverywhere I went in Kanko and Konan the inhabitants wanted to see the Americans come in and take over. Both Japs and Koreans want this. Rumors flew thick and fast every day I was there that the Americans were going to take over the country to the 40th parallel.\n\nThe people, except the few who ardently support the Russians to further their own political ends, are pro-American and would like America to take over the whole of Korea.\n\nFrom my observations of the two zones I say definitely that Korea is being torn in half. People in the northern zone are terrified of the Russians, industry is at a standstill, and the one desire, it seems, is to get south to the American zone as quickly as possible.\n\n/s/ Leonard E. Barsdell\n\nLeonard E. Barsdell Australian Rep. at GHQ for the Department of Information.", "notes": ["[도장·결재] [0078] 상하단 고무인: TOP SECRET", "[도장·결재] [0078] 우상단 연필: 32A", "[도장·결재] [0078] 우측 여백 세로 고무인: GHQ AGO RECORDS 28 SEP 1945 (총사령부 부관부 기록과 1945년 9월 28일 접수)", "[도장·결재] [0078] 접수인 옆 세로 자필: C/N. 1-M/S 로 읽히나 확실치 않음 [판독불가]", "[도장·결재] [0078] 우측 여백 자필: Noted by CinC & C/S — 총사령관 및 참모장 열람함. 그 아래 이니셜 서명 1개 [판독불가]", "[도장·결재] [0078] 우하단 자필: Returned to AG Records by [Wm?] Thomson, 3 Oct 45 — 1945년 10월 3일 톰슨이 부관부 기록과로 반환함. 성 앞의 이름은 판독이 확실치 않음", "[도장·결재] [0078] 본문 오른쪽 여백에 연필 괄호 표시 및 짧은 방주 1개 [판독불가]", "[도장·결재] [0078] 상단 편철용 천공 2개", "[도장·결재] [0078~0081] 각 면 좌하단 연필: 2-B", "[도장·결재] [0079] 상하단 고무인: TOP SECRET. 본문 오른쪽 여백에 연필 괄호 표시 여러 개(제3~5항 강조)", "[도장·결재] [0080] 상하단 고무인: TOP SECRET. 우측 여백에 연필 표시 2개 [판독불가]", "[도장·결재] [0081] 상하단 고무인: TOP SECRET. 서명란에 하지의 자필 서명 'John R. Hodge'", "[도장·결재] [0082] 상단 고무인: SECRET — 첨부물은 본문보다 한 등급 낮은 기밀로 표시되어 있다", "[도장·결재] [0082~0086] 각 면 좌하단 연필: 2-B", "[도장·결재] [0086] 서명 왼쪽에 원형 고무인 1개 — 좌우가 뒤집혀(배어 나온 상태로) 찍혔고 'GHQ AGO RECORDS'와 '28 SEP 1945'로 읽힌다", "[도장·결재] [0086] 타자 서명: /s/ Leonard E. Barsdell — 호주 정보부 총사령부 주재 대표", "편철 메모 — 0082면부터 첨부물 — 0081 말미 '1 Incl - Statement of News Correspondent'. 첨부는 Leonard B. Barsdell(호주 정보부 GHQ 주재 대표)의 'Russian Occupation of Northern Korea'(1945-09-15 Kanko/Konan 방문기) 5면(0082~0086), 하단 연필 '2-B'. 사본: 0087·0088=0078, 0089=0079, 0090=0080, 0091=0081 (첨부물 사본은 없음)"], "note": "번역자 주 — **구성.** 0078~0081면이 하지의 본문 서한 4면(쪽번호 -1- ~ -4-)이고, 0082~0086면이 첨부물 5면(쪽번호 -1- ~ -4- 및 서명면)이다. 본문 말미 '1 Incl - Statement of News Correspondent'가 그 경계다. 첨부물은 제2항 본문에서 하지가 '호주인 특파원이 본직에게 제시한 첨부 성명'이라 지칭한 바로 그 실물이다. 이 문서철에는 0087~0091면에 본문 사본이 더 있으나(0087·0088=0078, 0089=0079, 0090=0080, 0091=0081) 첨부물 사본은 없다.\n\n**FRUS 정서본(../FRUS_1945_Korea/raw/d783.txt, 895.01/9-2645)과의 차이.**\n1) 가장 큰 차이 — FRUS는 첨부물을 싣지 않았다. 각주 75에 'Copy not found attached'(사본이 첨부되어 있지 않음)라고만 적혀 있다. 여기 있는 0082~0086면 5면이 그 없어진 첨부물이다. 이 배치에서 새로 확보되는 사료의 대부분이 이것이다.\n2) FRUS는 본문 두 곳을 말줄임표로 잘라 냈다. 제6항의 '…' 자리에는 '믿기 어려운 규모의 독직과 부패 행위가 드러나고 있다. 정부 기구의 일본인들은 거의 전부 주저앉았고 도움이 되지 않아 급속히 제거되고 있다. 조선인들은 대부분 신뢰할 수 없거나 사소한 자리 외에는 채울 능력이 없다. 일반적으로 말하여 모두가, 심지어 교육받은 조선인들조차 몽상가이자 공상가로 일을 어떻게 해내야 하는지에 관한 실제적 착상이 거의 없다. 그들의 정치사상은 쓸 만하다기보다 이상주의적이다'가 들어간다. 제9항의 '…' 자리에는 '모든 종류의 소화기를 조선인의 손에 들어가지 않게 하는 일은 절대적으로 필요하다'가 들어간다. **두 대목 모두 조선인의 자치 능력과 무장에 관한 하지의 판단이며, FRUS가 인쇄에서 뺀 것이 정확히 그 부분이다.**\n3) 문면의 사소한 차이 — 원본 타자지는 'vacilation'(l 하나), FRUS는 'vacillation'으로 바로잡았다. 원본 'unsultable/unsuitable' 등 타자 상태는 원본대로 두었다.\n4) 표제 형식이 다르다. FRUS는 '하지 중장이 도쿄의 맥아더 원수에게 보낸 각서(Memorandum)'로 제목을 달았으나, 원본 타자지는 'TO: Commander-in-Chief, United States Army Forces, Pacific.'로 직위 앞으로 보낸 서한(letter)이며 하지 자신도 제1항에서 자기 문서를 'my letter'라 부른다. 즉 이 문서는 개인 각서가 아니라 지휘계통 공문이다.\n5) 원본에는 FRUS에 없는 여백 기록이 남아 있다 — 1945년 9월 28일 GHQ 부관부 기록과 접수인, 'Noted by CinC & C/S'(총사령관·참모장 열람), 10월 3일 부관부 기록과 반환 기록. 즉 맥아더 본인이 이 서한을 읽었음이 종이 위에 남아 있다.\n\n**표기와 어휘.** 원문의 'Japs'는 당대 미군 문서의 멸칭이며 그대로 옮겼다. 제6항의 조선인 자치 능력에 대한 서술과 첨부물의 러시아 병사에 대한 인종적 서술('몽골인처럼, 오히려 타타르인처럼')도 다듬지 않고 그대로 옮겼다. 지명은 원문이 일본식 음독을 쓴 것 자체가 사료이므로 병기하였다 — Keijo/Seoul 경성, Jinsen 인천, Fusan 부산, Kanko 함흥, Konan 흥남. 본문 제7항의 'Inch'on'은 같은 문서 안에서 조선식 표기와 일본식 표기가 뒤섞여 쓰인 예다(제2항 Jinsen, 제7항 Inch'on, 첨부물 8)항 Jinsen).\n\n**원저자의 오타는 고치지 않았다.** 본문: vacilation. 첨부물: 'prisoners' of war', 'A prisoner names Sergeant Bill Pyke'(named), 'lotting party'(looting), 'plaon robbery'(plain), 'siad'(said), 'gegetables'(vegetables), 'quiesant'(quiescent), 'rise'(rice), 'hearded'(herded), 'Kopacs (?)'(코페이카를 옮긴 것으로 보이며 물음표도 원문), 'since The prisoners took over the camps themselves'(어순이 어긋난 원문 그대로).\n\n**판독 관련.** 첨부물 5)항의 'mainly of rice, XXXX, bean meal'에서 XXXX 자리는 타자기로 겹쳐 쳐서 지운 낱말이라 읽을 수 없다 — en 에 [struck over], ko 에 [겹쳐 친 글자]로 표시했다. 7)항 끝의 'letting the work go idle in the [hope] the Russians won't bother...'는 원문에 'hope' 등 명사가 빠져 있어 문장이 통하지 않는다 — 원저자의 탈자로 보아 대괄호로 보충 표시했다. 첨부물 2)항의 여는 괄호 '(at the old rate of exchange...'는 원문에 닫는 괄호가 없다.\n0084면 '기차가 떠날 때 주민들이 환호하고 박수를 쳤다' 대목은 타자를 두 줄 겹쳐 친 흔적이 있어 OCR이 뭉갰다. 원본 스캔에서 두 줄을 분리하여 복원했다.\n서명은 타자·자필 모두 'Leonard E. Barsdell'이다(raw/documents.json 의 'Leonard B. Barsdell'은 중간 이니셜이 다르다). 0082면의 'Colonel Duncan Sinclair'는 OCR이 'Sinelsir'로 읽었으나 원본 스캔에서 Sinclair로 확인했다.\n\n**OCR 관련.** ocr/0078~0086.txt 는 macOS Vision 이 단(段)을 잘못 잡아 문장 순서가 크게 뒤섞여 있다(예: 0078면 '1. Reference is made to my letter 13 September / 1945, same subject.'가 앞뒤로 갈라짐). 본 번역의 en 은 OCR 이 아니라 pages/0078~0086.jpg 원본 스캔을 직접 판독하여 재구성한 것이며, 본문 부분은 FRUS 정서본과 대조하여 확인하였다.", "warn": false, "pages": ["0078", "0079", "0080", "0081", "0082", "0083", "0084", "0085", "0086", "0087", "0088", "0089", "0090", "0091"], "search": "존 R. 하지(John R. Hodge) — 미육군 중장, 주한미군사령관 레너드 E. 바스델(Leonard E. Barsdell) — 호주 정보부(Department of Information)의 총사령부 주재 대표, 첨부 성명서의 작성자 던컨 싱클레어(Duncan Sinclair) — 대령. 바스델의 함흥행을 허가 조지 킨로크(George Kinloch) — 대위, 스코틀랜드 글래스고 출신, 흥남 포로수용소장 조지 모리스(George Morris) — 대위, 캐나다인, 수용소 군의관, 인도 의무부대 배속 중 싱가포르에서 포로가 됨 빌 파이크(Bill Pyke) — 하사, 시드니 출신 포로 2-B Ltr: Conditions in Korea."}, {"id": "2-A", "order": 201, "date": "1945-09-18", "group": "B", "eyebrow": "편철 2-A · 0092–0097면", "title": "조선 정세 요약", "badge": "Top Secret", "list_right": "2-A", "meta": [{"k": "일자", "v": "1945-09-18"}, {"k": "발신", "v": "태평양미육군총사령관 전진지휘소(CINCAFPAC (ADV))", "txt": true}, {"k": "수신", "v": "육군참모총장(WARCOS)", "txt": true}, {"k": "참조", "v": "태평양미육군총사령부 마닐라(CINCAFPAC (MANILA))", "txt": true}, {"k": "전문번호", "v": "CAX 52058"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0092–0097 (6면)"}, {"k": "건명", "v": "Summary of conditions in Korea", "txt": true}, {"k": "색인 요지", "v": "CAX 52058 - Summary of conditions in Korea.", "txt": true, "wide": true}], "summary": "도쿄가 9월 17일까지 제24군단장실에서 올라온 보고들을 열 개 항목으로 요약해 워싱턴에 올린 전문으로, 남조선을 '불꽃만 닿으면 터질 화약통'으로 규정하고 일본인 관리 해임, 소련 측 활동, 정당 난립, 인원 부족, 통화 붕괴, 식량·산업·복원, 언론 문제를 차례로 보고한다.", "points": ["총론 : 남조선 정세는 불꽃 하나면 터질 화약통이며, 정책이 크게 다르고 공통 지휘계통도 없는 두 나라 군대가 조선을 갈라 점령한 것은 '있을 수 없는 상황'이다.", "제물포·서울 점령은 사고 없이 진행되었고 남조선 일본인은 항복해 지금까지는 협조적이나, 미군 남쪽 지역에서는 일본인이 조선인을 약탈·위협하고 있다.", "조선인의 대일 증오가 격렬하여 미군이 없었다면 보복이 일어났을 것이며, 8월 15일 이래 조선인은 생업을 놓고 장기 휴업 상태다.", "일본인 관리 해임 : 30년 지배로 자격 있는 조선인이 하급직 말고는 없어, 총독·경무국장·국장급 해임은 환영받았으나 대규모 해임은 실행 불가하고 일부 일본인을 군정 고문으로 유임해야 한다.", "소련 측 활동 : 38도 이남 방문 지역에서 소련군의 무차별 파괴·약탈이 있었고, 정치 공작원과 선동가가 미국의 신용을 떨어뜨리는 선전을 시작했다.", "경성에서 소련 영사와 접촉하고 소련군 사령부에 연락반을 설치했으며 전술 연락은 완전히 수립되었으나, 정치·경제 문제 참모 회담은 우호적이되 성과가 없었고 소련 측은 본국 훈령을 기다리는 것으로 보인다.", "정당 : 감정에 휩쓸린 정당들이 난립하며 일부는 공산주의, 일부는 충칭 임시정부 지지다. G-2가 조사 중이며, 임시정부와 김구·이승만 등을 불러들이는 것이 바람직할 수 있다는 징후가 있다.", "부역 혐의를 받는 연장·고학력 조선인들은 보수주의자로서 쓸모 있는 집단이 될 수 있다고 본다.", "인원 : 제24군단은 병력과 참모·군정 요원이 부족해 제한 지역에서만 작전 가능하며, 전 도(道) 확대가 절박하다. 미군은 아직 한 발도 쏘지 않았다.", "통화 : 조선 통화 제도는 철저히 파괴되었고, 일본인이 조선은행권 수십억 엔을 남발해 물가·임금이 폭등하고 암시장이 성행한다. 완전한 신통화 제도만이 재정 통제를 회복시킬 수 있다.", "식량 : 재고는 그런대로 있으나 배급이 무너졌고, 철도 연료는 열흘분뿐이며 소련 지구 북조선 탄광의 석탄 확보 교섭은 미타결이다.", "산업 : 군수산업 붕괴로 수십만 실업, 철도·공익사업 파업 우려. 독립을 '노동으로부터의 해방'으로 여기는 총파업성 휴업이 벌어지고 있다.", "복원 : 일본군 복원은 절대 불가능하며 편성 단위로 유지했다가 무장 해제 후 일본으로 송출해야 한다. 부산-규슈 연락선이 하루 6~7천 명을 수송 중이다.", "언론 : 신문 특파원들이 집단으로 처신이 나빴고, 조선인 급진 세력에 동조해 선동을 부추겼다고 볼 근거가 있다."], "primary": "다음은 조선 주둔 제24군단장실로부터 본 사령부가 접수한 보고들을, 9월 17일까지를 포함하여 요약한 것임.\n\n**1. 총론.** 남조선의 전반적 정세는 현재 불꽃 하나만 닿으면 터질 화약통으로 묘사되고 있음. 조선을 둘로 갈라, 서로 크게 어긋나는 정책 아래 움직이며 공통의 지휘계통도 없는 나라들의 군대가 나누어 점령하고 있는 것은 있을 수 없는 상황임. 제물포(Chemulpo)와 서울(Seoul)의 점령은 이렇다 할 사고 없이 진행되었음. 도쿄로부터 명령을 받은 남조선의 일본인들은 항복하였고 지금까지는 협조적으로 보임. 그러나 그들이 미군보다 남쪽에 있는 곳에서는, 일본인들이 조선인을 약탈하고 위협하고 있는 것으로 파악됨. 조선인들은 일본인을 믿을 수 없을 만큼 격렬하게 증오하고 있어, 미군이 그곳에 없었더라면 민간인이든 군인이든 가리지 않고 모든 '잽(Japs)'에게 무서운 보복을 가했을 것임. 8월 15일 항복이 발표된 이래 조선인들은 정상적인 생업에 아무 관심도 보이지 않은 채 장기간의 휴일 상태에 있음.\n\n**2. 일본인 관리의 해임.** 조선의 통치 문제는 상당 기간 복잡하고 곤란할 것임. 중요 관직과 관리(官吏) 전반을 일본인이 완전히 지배해 온 고도로 집중된 행정 30년은, 지방과 시(市)의 하급 직무를 제외하면 자격을 갖춘 조선인 인력을 하나도 남기지 않았음. 총독(Governor General), 경무국장(Police Commissioner), 각 국장(Bureau Chiefs) 및 그 밖의 몇몇 고위 관리를 해임한 것은 조선인들 사이에 호의적인 반응을 불러일으켰음. 그러나 받아들일 만한 조선인도 없고 군정 요원도 제한되어 있는 이 시점에서 일본인을 대규모로 해임하는 것은 실제로는 실행할 수 없음. 일부 일본인은 우리의 직접 군정(直接軍政)을 위한 고문으로 부득이 유임시켜야 할 것임.\n\n**3. 소련 측의 활동.** 면담한 사람들의 보고와 그 결과에 대한 목격자 진술에 근거할 때, 소련군은 38도 이남에서 그들이 다녀간 지역들을 무차별적으로 파괴·약탈·강탈하였음. (단락) 38도 이남으로의 월경은 드물게 있었을 뿐 그 밖에는 선(線)이 지켜져 왔음. 정치 공작원들은 우리 지역 전역에 자기들의 사상을 남겨 놓았고, 정치 선동가들은 우리의 활동을 방해하고 조선인 앞에서 미국의 신용을 떨어뜨리기 위하여 행진·시위와 그 밖의 선전을 시작하였음. 경성(Keijo/Seoul)에서 소련 영사와 접촉하였고, 경성의 소련군 사령부에 연락반을 설치하였음. 우리 관할이 될 지역을 한 번도 떠난 적이 없는 소련 총영사는 항복 조인식에 초청받았으나 참석을 거절하였고, 다만 며칠 뒤에 찾아왔음. 미군과 소련군 사이에 전술적 연락은 완전히 수립되었음. 긴밀히 통합되어 있던 이 나라가 갈라짐으로써 생긴 정치·경제 문제에 관하여 우호적이나 성과 없는 참모 회담이 이루어졌음. 소련 군당국은 훈령을 기다리고 있는 것으로 판단됨.\n\n**4. 정당.** 조선인들 자신이 너무 오랜 세월 짓밟혀 왔기 때문에, 지금은 물론 가까운 장래에도 이 상황과 그에 따르는 책임을 이성적으로 받아들이지 못함. 또 그들의 독립이 얼마나 즉각적인 것인지, 일본인들이 얼마나 빨리 쫓겨날 것인지에 대해서도 오해가 있어 왔음. 이미 이른바 지도자를 앞세운 정당들이 감정 속에서 태어나고 있음. 일부는 공산주의이고 다른 일부는 충칭(Chungking) 임시정부를 지지함. G-2(정보참모부)가 최근 우후죽순처럼 생겨난 여러 정당을 조사하고 있음. 그러나 여러 징후는 임시정부와 김구(KIN KOO), 이승만(Syngman Rhee) 및 그 계열의 인사들을 불러들이는 것이 바람직할 수 있음을 시사함. 나이가 더 많고 교육을 더 받은 일부 조선인들은 지금은 부역(collaboration) 혐의를 받고 있으나 보수주의자들이며, 쓸모 있는 집단으로 발전할 수 있음.\n\n**5. 인원.** 제24군단은 병력이 적고 유능한 참모와 군정 요원이 부족하여, 제한된 지역에서만 작전할 수밖에 없고 따라서 전체적 효과가 미미함. 우리 관할 안의 모든 도(道)로 확대할 필요가 절박함. 미군 병사들은 아직 한 발의 총도 쏘거나 주민 한 사람도 다치게 할 일이 없었으며, 가는 곳마다 질서를 회복하고 유지하였음. 이 두 사실은 모두 그들의 위신을 말해 주는 것임.\n\n**6. 통화 문제.** 조선의 통화 제도는 철저히 파괴되었으며, 8월 15일 수준으로 물가를 묶어 두는 조치를 시행하는 것은 불가능할 것임. (단락) 예금 인출 사태에 몰린 일본인들은 지난 몇 주 사이에 새로 인쇄한 조선은행권(Bank of Chosen notes) 수십억 엔을 발행하였고, 그 결과 임금과 물가가 폭등하고 암시장이 성행하고 있음. 미군에게는 허가 없이 현지에서 물자를 구매하는 것을 일절 삼가라는 명령이 내려졌으나, 완전히 새로운 통화 제도를 도입하는 것만이 재정 통제를 다시 세울 수 있음.\n\n**7. 식량.** 창고 재고로는 식량이 그런대로 충분히 있으나, 배급과 배급 통제가 심하게 무너져 있고 성공적인 회복은 기대하기 어려움. 철도의 마비와 자동차 수송 수단의 부족이 식량 이동을 저해함. 일본군 수송 수단을 복구하는 데 모든 지원을 하고 있으나, 철도 사정은 매우 심각하여 연료 재고가 열흘분밖에 없음. 남조선의 탄광은 생산을 하지 못하고 있고, 소련 지구에 있는 북조선 탄광에서 석탄을 얻기 위한 교섭은 아직 타결되지 않았음.\n\n**8. 산업.** 군수산업의 붕괴로 수십만 명이 실업 상태이며, 철도와 공익사업에서 파업이 우려됨. 직장을 지키고 조선인을 위하여 재건하자는 선전에도 불구하고, 독립을 노동으로부터의 해방과 동일시하는 많은 사람들에 의해 총파업성 휴업이 벌어지고 있음. 선동에 알맞은 상황이 조성되었으며, 원료의 부족과 석탄·주요 동력원이 소련 지구에 있다는 사정이 이를 더욱 악화시키고 있음.\n\n**9. 복원(復員).** 일본군과 일본인 주민 대다수가 일본으로 송출되기 전에는 조선에서 안정된 상태에 가까운 것은 아무것도 이룰 수 없음. 조선에 있는 일본군의 복원은 절대적으로 불가능함. 일본군은 편성된 부대 단위로 유지하다가, 무장 해제가 끝나는 대로 일본으로 송출해야 할 것임. 일본군은 조선에 남아 있는 한 마찰의 원인이 될 것임. 우리가 인수하여 감시 수용소에 넣고 먹이고 재우고 돌보지 않는 한 이곳에서 통제할 수 없음. 현재 부산(Fusan)에서 규슈(Kyushu)로 연락선이 운항 중이며, 하루 약 6천~7천 명을 수송할 수 있음. 연락선은 일본인을 일본으로, 조선인을 조선으로 거의 같은 비율로 실어 나르고 있음. 두 나라 국민이 귀국하려고 해협 양쪽 항구에 쌓이고 있으므로 이 운항은 계속되어야 한다고 봄. 이 교환은 먹이고 재워야 할 인원의 총수에는 영향을 주지 않으나, 각 지역에서 말썽을 일으킬 여지는 줄여 줌. 그러나 일본군을 조기에 본국으로 수송하고 그 이동을 항구에서 감독한다면 점령에 큰 도움이 될 것임.\n\n**10. 언론.** 조선을 취재하는 신문 특파원들은 집단으로서 처신이 나빴음. 그들은 우리의 상륙 이후 항공편으로 들어왔는데, 대부분 일본에서 왔고 현지 사정에 대한 지식도 없고 사전 교육도 받지 않은 채 미군 군복을 이용하여 지역을 휘젓고 다니며, 병사들에게는 금지된 개인적 비행(非行)을 저질렀음. 그들 가운데 일부는 조선인 급진 세력에 공공연히 동조함으로써, 조선인 집단 지도자들을 부추겨 모든 것을 뒤엎고 조선인이 즉시 모든 기능을 넘겨받게 하자는 선동에 더 힘쓰도록 만들었다고 볼 만한 근거가 있음. 그들은 실제 사정이 어떠한지 조금도 파악하기 전부터 본국(the Nation)과 총사령부, 그리고 점령에 관한 본 사령부의 모든 정책에 대하여 매우 비판적이었음. 이 후자의 사정은 그들이 전체 그림을 보기 시작하면서 서서히 바로잡히고 있음. 어느 한 무리는 오후에 항공편으로 도착하여 그날 저녁 기사를 송고하고 다음 날 아침 떠나면서, 조선 점령에 관하여 모든 것을 알게 되었다고 여겼음.\n\n증명 : B. M. 피치(B. M. Fitch), 준장, 미육군, 부관감\n승인 : W. E. 크리스트(W. E. Crist), 준장, 미육군, 군정장관실 수석장교(Chief Military Government Officer)", "secondary": "FOLLOWING IS A SUMMARY TO INCLUDE SEVENTEEN SEPTEMBER OF REPORTS RECEIVED IN THIS HEADQUARTERS FROM THE OFFICE OF THE COMMANDING GENERAL TWENTY FOURTH CORPS IN TWO'(=G-2). 2면(0093)의 머리 날짜가 '11 SEPTEMBER 1945'로 타자되어 있으나 나머지 다섯 면은 모두 '18 SEPT 45'이며 본문도 이어지므로 원본 오타로 판단, 표기 사실만 기록하고 date 는 1945-09-18 로 두었다. 3항의 'POLITICAL AGENTS HAVE CMA LEFT THEIR THOUGHTS' 는 쉼표(CMA)가 잘못 낀 원문 그대로다. 일본인 멸칭 'JAPS'(잽), 조선인의 자치 능력을 낮춰 보는 서술('짓밟혀 와서 이성적으로 받아들이지 못함', '감정 속에서 태어나는 정당')이 그대로 나오며 완화하지 않고 옮겼다.", "warn": false, "pages": ["0092", "0093", "0094", "0095", "0096", "0097"], "search": "김구(KIN KOO) — 원문 표기 'KIN KOO' 이승만(Syngman Rhee) B. M. 피치(B. M. Fitch) — 준장, 부관감 W. E. 크리스트(W. E. Crist) — 준장, 군정장관실 수석장교 2-A CAX 52058 - Summary of conditions in Korea."}, {"id": "2", "order": 200, "date": "1945-09-13", "group": "A", "eyebrow": "편철 2 · 0098–0105면", "title": "조선의 정세", "badge": "Top Secret", "list_right": "2", "meta": [{"k": "일자", "v": "1945-09-13"}, {"k": "발신", "v": "주한미군사령부(HEADQUARTERS, UNITED STATES ARMY FORCES IN KOREA), APO 235", "txt": true}, {"k": "수신", "v": "태평양미육군총사령관(Commander-in-Chief, United States Army Forces, Pacific)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "서한"}, {"k": "면", "v": "0098–0105 (8면) · 사본 25면"}, {"k": "건명", "v": "Conditions in Korea", "txt": true}, {"k": "색인 요지", "v": "Ltr - Conditions in Korea.", "txt": true, "wide": true}], "summary": "상륙 닷새째인 하지가 남조선을 \"불꽃만 튀면 터질 화약통\"이라 규정하고, 일본인 행정 잔류·통화 붕괴·소련군의 행태·정치 세력의 난립·석탄과 곡물 부족을 낱낱이 보고한 뒤, 조선의 장래에 관한 국제 정책 결정 기구와 명확한 훈령을 요구한 첫 정세 보고 서한이다.", "points": ["남조선은 불꽃 하나만 튀면 터질 화약통이다 — 카이로 선언의 'in due course'가 조선어 번역에서 '수일 내' 또는 '곧'으로 옮겨진 탓에 조선인들이 즉시 독립을 기대하고 있음을 오늘 알아냈다.", "일본군은 표면상 항복 조건을 받아들였으나, 미군이 아직 들어가지 못한 남쪽 지역에서는 조선인을 약탈하고 위협하고 있다. 조기 일본군 수송이 안 되면 수용소(concentration camps)에 넣어야 할 것이다.", "조선인의 대일 증오는 직접 보지 않고서는 믿기 어려울 정도이며, 기회만 주어지면 민간인·군인을 가리지 않고 무서운 보복을 가할 것이다. 다만 미군이 감시하는 한 실행하지는 않으리라 본다.", "정부에서 일본인을 몰아내는 일은 여론상 매우 바람직하나 실제로는 당분간 완결 불가능하다 — 조선인에게는 하급 이상의 관직을 맡을 자격자가 없고, 공익사업·통신을 운영할 기술자도 없다. 상급으로 올라간 조선인은 친일파로 간주되어 일본인만큼, 혹은 그 이상 미움을 받는다.", "가장 아픈 두 곳은 첫째 조선인이 일본인의 지배를 받는다는 것, 둘째 경찰과 경찰기구의 실태다. 아베 총독과 경무국장의 파면, 경성(Keijo) 지구 경찰의 대대적 개편이 성난 조선인을 상당히 누그러뜨릴 것이다 — 정부를 강화하지는 못하겠지만.", "정당·정치단체의 수는 알 수 없다. 어제 만난 정치 집단 대표 모임은 단체당 2명씩 등록시켰는데 참석자가 1,200명을 넘었다. 공통점은 일본인 재산 압수, 일본인 축출, 즉시 독립 세 가지뿐이고 그 이상은 자신들도 모른다.", "8월 15일 항복 발표 이래 조선인 대부분이 긴 휴일 상태다. 인천(Jinsen)–경성 지역에는 산업 활동이 전무하며, 이들은 지금 선동가에게 완전히 무르익은 상태다.", "통화 제도는 여전히 큰 물음표다. 조선은행권 수십억 엔이 8월 15일 이후 인쇄·배포되었고 일부는 일본에서 공수되었다. 경성의 한 공장이 일본군을 위해 수십억 엔을 찍었다는 미확인 보고가 있다. 완전히 새로운 통화 제도를 세우지 않고서는 지시받은 대로 8월 15일 공정 수준에 물가·임금을 고정하는 것은 사실상 불가능하며, 고정해 봐야 암시장만 키울 뿐 무력하다. 일본인이 조선의 통화 제도를 철저히 파괴한 것으로 보인다.", "소련군은 몇 차례 월경을 빼면 38도선을 존중해 왔다. 그러나 그들이 다녀간 지역에서 직접 얻은 정보에 따르면 일본인이든 조선인이든 개인의 신체·재산에 대한 권리를 전혀 존중하지 않았다 — 러시아군은 38도 이남의 방문 지역에서 무차별로 파괴·강간·약탈했다.", "지하 러시아 공산주의자들의 지도를 받는 잘 훈련된 선동가들이 우리 지역에 혼란을 일으켜 '미국은 이 지역을 통치할 수 없다'는 것을 조선인에게 증명하고 러시아식 '자유'와 통제를 요구하게 만들려 하고 있을 개연성이 높다. 우리의 낮은 병력과 확장 능력 부족은 그런 시도에 비옥한 토양이다.", "경성 주재 러시아 영사와 접촉했고 러시아군 사령부에 연락반을 두었다. 제7사단 부대가 경계선에서 러시아군과 접촉했다. 아직 아무 양해도 이루어지지 않았다. 러시아군이 38도 이남으로 전면 남진할 조짐은 없다.", "정책이 크게 다르고 공동 지휘부도 없는 두 나라 군대가 조선을 둘로 갈라 점령하는 것은 불가능한 상황이다. 남조선에 수도와 모든 통신망, 주요 곡창이 있고 북조선에 석탄 전부와 주요 전력원이 있다 — 어느 쪽도 다른 쪽 없이 굴러갈 수 없다.", "남조선의 두 가지 결정적 부족은 석탄과 식량 곡물이다. 철도를 돌릴 석탄은 열흘치뿐이며, 러시아와의 교섭에서 석탄 확보가 최우선이다. 곡물 부족은 작년 수확 후 일본이 막대한 쌀을 실어냈기 때문이다. 올해 작황은 훌륭하나 수확은 10~11월이다.", "자발적 실업자 외에 전시 산업 붕괴로 실직한 조선인이 수십만이다. 원료가 없어 모든 제조업이 멈췄고, 군수산업을 평시 산업으로 즉시 전환할 가능성도 없다. 겨울이 다가와 문제가 더 크다.", "일본군과 일본인 대부분을 일본으로 보내기 전에는 조선에 안정에 가까운 상태가 들어설 수 없다. 조선 내 일본군의 (현지) 복원은 절대 불가능하며, 부대 편성을 유지한 채 무장해제가 끝나는 대로 일본으로 실어 내야 한다. 부산(Fusan)–규슈 간 연락선이 하루 6,000~7,000명을 나르고 있다.", "가장 고무적인 단 하나의 요소는 나이 들고 교육받은 조선인 가운데 수백 명의 보수파가 있다는 점이다. 지금은 대일 협력 혐의를 받지만 실제로는 대부분 전쟁 중 일본의 혐의와 사상통제로 옥살이를 했고, 본관이 보기에 훌륭한 시민이다 — 다만 정부 운영에는 별 쓸모가 없다. 조선인 다수는 다른 어떤 것보다 중경(Chungking) 임시정부의 귀환을 지지하나, 의견이 워낙 갈려 과반에는 못 미치는 것으로 본다.", "본관은 혼자 힘으로는 고칠 수 없는 두 가지 크나큰 장애 아래 활동하고 있다. 첫째, 조선의 장래·국가의 처리·두 나라 점령에 의한 거의 완전한 분단의 해법·당면 군사적 필요를 넘어 앞으로 채택될 연합국 또는 미국의 정책에 관하여 아무 정보가 없다. 둘째, 이 사령부는 병력과 유능한 참모·군정 요원이 너무 모자란 채로 도착해 제한된 지역에서만, 전반적 효과 없이 활동할 수밖에 없다.", "미군은 일본군 병영 한복판까지도 아무 방해 없이 갈 수 있다고 본다. 그러나 아무리 소수라도 미군이 읍에 나타나면 주민은 즉시 경찰과 치안을 완전히 접수해 달라 기대하고, 그것이 조선인이 일본인을 상대로 행동을 개시하는 신호가 된다. 미군은 아직 한 발도 쏘거나 주민을 다치게 한 일 없이 가는 곳마다 질서를 회복·유지했다 — 그 위신이 매우 뜻깊다.", "부산에 2~3일 내로 정찰·시찰반을 보낸다. 40사단이 도착하는 대로 대부분을 부산으로 옮길 예정이며, 해군이 조기에 부산항을 소해·개항하는 것이 필수적이다. 제주(Saishu)에는 일본군 6만이 무장한 채 있으며, 준비되는 대로 항공편으로 무장해제·시찰반을 보낸다. 제17방면군 사령관은 실행 가능하다고 확언했다.", "조선을 취재하는 신문 특파원들은 집단으로 나쁘게 처신했다. 상륙 후 대개 일본에서 항공편으로 들어와 현지 사정을 모르고 아무 사전교육 없이 미군 군복을 이용해 지역을 휘젓고 다니며, 본관이 병사들에게 금지한 개인적 비행을 저질렀다. 그들 일부는 조선 급진파에 공공연히 동조해 조선인 지도자들을 더 큰 선동으로 부추긴 것으로 볼 만한 근거가 있다.", "권고 사항(19항): ① 조선의 정치·경제적 장래에 관한 국제 정책을 결정·발표할 국제 정책 수준의 통제 기구를 경성에 설치할 것 — 반드시 현지에서 기능해야 한다. ② 그때까지 조선의 장래에 관한 명확한 훈령을 줄 것, 또는 장래를 말할 권한이 있는 워싱턴 관리를 본관 참모진에 배속할 것. ③ 정무 경험이 있고 동양인을 아는 유력한 장교를 참모로 확보할 것. ④ 중경 임시정부를 연합국 후원 하의 임시정부로 조선에 돌아오게 하여, 점령 기간과 선거가 가능할 만큼 조선 민중이 안정될 때까지 명목상의 수반(figureheads) 노릇을 하게 하는 방안을 검토할 것. ⑤ 조선의 상공업 재건과 일본인 재산의 조선인 이양을 도울 미국 실업가에게 문을 열 것. ⑥ 일본인이 써 온 통화의 사용을 폐기하는 새 통화 정책을 조기에 수립할 것. ⑦ 조선에 대한 장래 정책에 모든 일본인의 역외 이송을 포함시킬 것. ⑧ 국제 무역을 조기에 재개할 것."], "primary": "**주한미군사령부**\nAPO 235\n\n1945년 9월 13일\n\n건명: 조선의 정세.\n\n수신: 태평양미육군총사령관.\n\n1. 본 서한은 조선의 정세에 관하여 간략하고 불완전한 그림을 제공할 것이다. 합리적인 시간 안에 읽을 수 있는 어떠한 문서도 그 전모를 다 담을 수는 없다.\n\n2. 표면상 일본 측은 항복 조건을 수락하였다. 점령 지역 안에서 그들은 철수와 무장해제에 협조하는 것처럼 보였다. 그러나 우리 남쪽의, 일본군이 있는 지역에서 들어오는 보고들은 그들이 조선인을 약탈하고 위협하며 전형적인 일본놈(Jap) 식으로 처신하고 있음을 시사한다. 조선인들은 우리 점령이 아직 부분적일 뿐이며 본관에게 전 지역에 걸쳐 배치할 병력이 없다는 사실을 이해하지 못한다. 이러한 상태는 아마도 전 지역에 걸쳐 존재할 것이다. 수송 수단이 확보되는 대로 광범위한 장거리 정찰을 개시할 것이다. 일본군을 일본으로 조기에 수송하도록 조치하지 못한다면 그들을 수용소(concentration camps)에 넣어야 하리라고 본관은 느낀다.\n\n3. 현재 남조선을 가장 잘 표현하는 말은, 이 지역이 불꽃 하나만 튀면 터질 화약통이라는 것이다. 본관은 오늘 조선어 번역문들이 — 포고문의 번역을 포함하여 — 카이로 협정에서 선언된 \"in due course\"(적절한 시기에)라는 말을 \"수일 내에\" 또는 \"곧\"이라는 말 내지 뜻으로 옮겨 놓았음을 발견하였다. 영어에 밝은 고학력 조선인들조차 본관이 카이로 협정의 영어 문언을 지적하자 크게 놀랐다. 이러한 까닭에 조선인들은 어째서 자신들이 완전한 독립을 부여받지 못하고 미군 도착 후 이삼 일 안에 온전히 자기들의 정부를 세우도록 허용되지 않았는지를 납득하지 못하여 왔다. 즉시 독립과 일본놈들(Japs)의 즉각적 일소라는 이 생각이 그들의 마음을 지배해 왔다. 조금이라도 지체가 있다는 사실에 대한 실망이 크다.\n\n4. 조선인들은 직접 보지 않고서는 믿기 어려울 만큼의 신랄함으로 일본놈들을 증오하며, 기회가 주어진다면 민간인과 군인을 가리지 않고 모든 일본놈에게 무서운 복수를 가할 것이다. 반면 미군이 감시하고 있는 한 그들이 이 복수를 실행에 옮기지는 않으리라고 본관은 믿는다.\n\n5. 현 정부에서 일본인을 배제하는 일은 여론의 관점에서 매우 바람직하나, 실제로는 앞으로 상당 기간 완결하기가 불가능할 것이다. 일본놈들은 명목상으로는 면직될 수 있으나 그래도 일은 하게 하여야 할 것이다. 조선인에게는 하급의 정부·도·시 직위 이상을 맡을 자격 있는 인원이 없다. 공익사업과 통신을 운영할 기술자도 없다. 또한 상급 직위로 올라간 조선인들은 친일파로 간주되어 일본놈들만큼, 아니 그보다 더 미움을 받는다. 가장 아픈 두 곳은 이러하다. 첫째는 조선인이 일본인의 지배를 받는다는 것이요, 둘째는 경찰과 경찰 기관에 관한 실태다. 아베(Abe) 총독의 파면과 경무국장의 파면에, 경성(Keijo) 지구 경찰의 대대적 개편이 뒤따른다면, 비록 그것이 정부를 강화하지는 못한다 하더라도, 격분한 조선인들을 누그러뜨리는 데 많은 도움이 되리라고 본다.\n\n6. 조선에는 알 수 없는 수의 정당 또는 정치 집단이 있다. 오랜 억압의 기간과 지하 활동의 곤란은 대부분의 일관된 정치 조류를 완전히 갈라놓았다. 평균 정도의 지능을 갖추고 다른 조선인 백 명을 아는 조선인이면 누구나 정당을 만들고 목청 높여 요구를 내놓을 수 있는 것으로 보인다. 본관은 어제 각 집단당 두 사람씩을 기준으로 정치 집단 대표들을 만났다. 이들은 강당에 들어오면서 소속 집단을 밝히고 등록되었다. 이 모임의 참석 인원은 1,200명이 넘었다. 이는 의견의 다양성이 어느 정도인지를 짐작하게 한다. 그들의 사고에서 거의 유일한 공통 조류는 일본놈 재산을 압수하고, 일본놈들을 조선에서 내보내며, 지금 당장 조선의 독립을 갖는다는 것이다. 그 세 가지를 넘어서서 자기들이 무엇을 원하는지 참으로 아는 자는 하나도 없다.\n\n7. 8월 15일 항복이 발표된 이래 거의 모든 조선인이 오랜 휴일을 보내 왔다. 그들이 생각하는 독립이란 일의 온갖 걱정으로부터의 해방이며 세계가 자기들을 먹여 살리리라는 것임이 분명하다. 미군이 이곳에 도착한 이래 인천(Jinsen)–경성(Keijo) 지역에는 산업 활동이 전혀 없었고 정상적인 생업으로 돌아가려는 관심도 거의 없었다. 모든 접촉과 선전에서 우리는 조선인이 자기 자리를 지키고 장래를 위하여, 또 조선인을 위하여 자기 나라를 세워 나가야 한다는 절대적 필요를 강조하여 왔다. 그들은 지금 일본놈들을 위하여 하는 일이 — 일본놈들이 모든 사업체를 소유하거나 지배하고 있으므로 — 자신들의 장래와 무슨 관계가 있는지를 납득하지 못한다. 언젠가는 본관이 그들에게 이 점을 깨닫게 할 수 있을지도 모른다. 그러나 현재로서 그들은 선동가들에게 완전히 무르익어 있다.\n\n8. 조선의 통화 제도는 여전히 커다란 물음표다. 본관의 몇 안 되는 조사관들이 실정을 파악하려고 전력을 다하고 있다. 불완전한 정보에 근거하건대 인플레이션은 이미 상당히 진행되어 통제가 불가능할 지경에 이른 것으로 보인다. 수십억 엔의 조선은행권이 나라 안에 배포되었는데 그 대부분은 8월 15일 이후에 인쇄·배포된 것이다. 일부는 이곳에서 인쇄되었고 일부는 우리가 도착하기 전에 일본에서 공수되었다. 경성의 어느 공장이 일본군을 위하여 수십억 엔의 조선은행권을 인쇄하였다는 보고들이 있다. 이는 조사 중이며 아직 확인되지 않았다. 그러나 물가와 임금에 대한 노동 측의 요구는 당장의 통제를 넘어 폭등하였다. 완전히 새로운 통화 제도를 시행하지 않고서는 지시받은 대로 8월 15일 공정 수준으로 물가와 임금을 고정하고 그것이 지켜지기를 기대하는 것은 사실상 불가능하다고 본다. 고정 자체는 물리적으로 달성할 수 있으나, 그것은 이미 확고히 자리 잡은 암시장을 더욱 키울 뿐 완전히 무력할 것이다. 일본놈들이 조선의 통화 제도를 철저히 파괴한 것으로 보인다.\n\n9. 몇 차례의 국경 침투를 제외하면 소련군은 38도 경계선을 존중하여 왔다. 그러나 러시아군이 다녀간 지역에서 아군 병사와 기자들이 직접 얻은 정보에 따르면, 그들은 일본인이든 조선인이든 어떠한 개인의 신체상·재산상 권리도 존중하지 않았다. 면담한 사람들의 보고와 그 결과에 대한 목격담에 근거하건대, 러시아군은 38도 이남에서 그들이 다녀간 지역을 무차별로 파괴하고 강간하고 약탈하고 노략질하였다. 그들의 공작원이 남조선 전역에 자기들의 정치사상을 퍼뜨리고 있다는 데에는 의문의 여지가 거의 없다. 평화적이기는 하나 몇 차례의 행진과 시위는 지상으로 드러난 공산주의 분자들의 것으로 보인다. 이들은 모든 일본인 재산의 **지금 당장**의 압수를 주장하며 치안에 대한 잠재적 위협이 된다. 사태의 추이로 보아, 지하의 러시아 공산주의자들이 지도하는 잘 훈련된 선동가들이 우리 지역에 혼란을 일으켜 미국이 이 지역을 통치할 수 없음을 조선인에게 증명하고 그들로 하여금 러시아식 \"자유\"와 통제를 요구하게 만들려는 시도를 벌이고 있을 개연성이 크다. 이곳의 낮은 병력 수준과 남부 지역 전반으로 통제를 신속히 확대할 능력의 결여에 비추어, 이러한 시도에는 비옥한 토양이 마련되어 있다.\n\n10. 본관은 경성 주재 러시아 영사와 접촉하였고, 현지 영사관원 한 사람을 대동시켜 러시아군 사령부에 연락반을 두고 있다. 제7사단 부대가 경계선을 따라 러시아군과 접촉하였다. 지금까지 아무런 양해에도 이르지 못하였으나, 머지않아 확실한 정보를 보고할 수 있기를 바란다. 러시아군이 38도 이남으로 전면적으로 남진하리라는 징후는 없다.\n\n11. 크게 상이한 정책 아래 움직이고 공동의 지휘부도 없는 두 나라의 군대가 조선을 두 부분으로 갈라 점령하는 것은 불가능한 상황이다. 남조선에는 수도가 있다. 모든 통신은 이 사실 위에 짜여 있다. 남조선에는 또한 주요 곡물 산지가 있는 반면, 북조선에는 석탄 전부와 주된 전력원이 있다. 어느 쪽도 다른 쪽과 무관하게 굴러갈 수 없다.\n\n12. 남조선에는 두 가지 결정적인 부족이 있으니, 곧 석탄과 식량 곡물이다. 석탄 부족은 석탄이 생산되는 북조선과 남조선 사이의 교통이 끊긴 데서 비롯한다. 현재 철도를 운행할 석탄은 열흘치로 추산된다. 러시아 측과의 교섭 가운데 석탄 확보가 최우선순위에 있다. 곡물 부족은 작년 수확 이후 일본이 막대한 양의 쌀을 실어 낸 데에 기인한다. 올해 곡물 작황은 훌륭하겠으나 수확기는 10월과 11월이라야 온다. 식량 배급은 현재 철도의 파행과 자동차 수송 수단의 부족으로 곤란하다. 러시아군의 공격 이전에는 일본군이 식량 배급을 지원하고 철도를 효율적으로 운용하였다. 우리는 배급에 얼마간 지원을 하고 있으며, 식량을 분배하는 데 있어 철수를 위한 당장의 소요를 넘는 일본군 수송 수단을 전부 가능한 한 신속히 복구하고 있다.\n\n13. 자발적 실업자 — 독립이란 곧 놀고 지내도 된다는 뜻으로 아는 자들을 포함하여 — 외에도, 전시 산업의 붕괴로 일자리를 잃은 조선인이 수십만에 이른다. 모든 종류의 제조업이 원료 부족으로 현재 정지 상태이며, 군수산업을 평시 제조업으로 전환함으로써 이를 즉시 바로잡을 가능성은 없다. 이것이 일본군의 통제에서 풀려난 조선인 문제와 겹쳐, 특히 겨울이 다가오는 터에 엄청난 문제를 이룬다.\n\n14. 본관의 의견으로는, 일본군과 일본인 주민 대부분이 일본으로 이송되기 전에는 조선에 안정에 가까운 상태가 성립될 수 없다. 조선에 있는 일본군의 (현지) 복원은 절대적으로 불가능하다. 그들은 부대 편성을 유지한 채로 두었다가 무장해제가 완료되는 대로 일본으로 실어 내야 할 것이다. 그들이 이곳에 있는 한 그것은 마찰의 원인이 될 것이다. 그들을 우리가 접수하여 감시 하의 수용소에 넣고 우리가 먹이고 재우고 돌보지 않는 한 이곳에서 통제할 수 없다. 현재 부산(Fusan)에서 규슈(Kyushu)로 하루 약 6,000명 내지 7,000명을 수송할 수 있는 연락선이 운항 중이다. 그것들은 일본인을 일본으로, 조선인을 조선으로 거의 같은 비율로 실어 나르고 있다. 이는 계속되어야 한다고 본다. 두 나라 국민이 해협 양편의 항구에 고향으로 가려고 몰려 쌓이고 있고, 이 교환은 먹이고 재워야 할 인원의 총량을 바꾸지는 못하나 각 지역에서 말썽을 일으킬 여력은 줄여 주기 때문이다. 다만 일본놈 군대를 조기에 본국으로 수송하되 항구에서 그 이동을 감독하도록 허용된다면 우리 노력에 큰 도움이 될 것이다.\n\n15. 가장 고무적인 단 하나의 요소는 나이 들고 교육받은 조선인들 가운데 수백 명의 보수적 인사가 있다는 사실이다. 지금 당장은 그들 다수가 일본놈들과의 협력 혐의를 받고 있으나, 이 감정은 빠르게 사라지리라고 본다. 실상 그들 대부분은 일본놈들의 혐의와 사상 통제 때문에 전쟁 중 여러 시기에 옥살이를 하였고, 본관이 보기에 훌륭한 시민이다 — 비록 정부 운영에는 별 쓸모가 없으나 그러하다. 확인할 수 있는 한, 다른 어떤 것보다도 중경(Chungking) 조선 정부의 귀환을 지지하는 조선인이 훨씬 많다. 그러나 의견의 폭이 워낙 넓은 까닭에 중경을 지지하는 자들도 과반에는 미치지 못하는 것으로 본다.\n\n16. 본관은 본관의 조치만으로는 바로잡을 수 없는 두 가지 크나큰 장애 아래에서 활동하고 있다. 첫째는, 조선 민중의 장래에 관하여, 이 나라가 어떻게 될 것인지에 관하여, 두 나라의 점령으로 인한 이제 거의 완전한 조선의 분단이 어떻게 해결될 것인지에 관하여, 또는 당장의 군사적 필요를 넘어 앞으로 점진적으로 채택될 수 있는 연합국 또는 미국의 어떠한 정책에 관하여도 본관에게 아무런 정보가 없다는 점이다. 둘째는, 이 사령부가 병력에서 너무 작고 유능한 참모와 군정 요원이 너무 모자란 채로 이곳에 도착하여, 제한된 지역에서만, 그리고 전반적으로는 거의 효과 없이 활동할 수밖에 없다는 점이다. 남조선의 모든 도(道)에 걸쳐 충분한 군정과 질서 유지에 족한 병력을 갖추고 가능한 한 신속히 확대해 나갈 긴급한 필요가 있다. 미군에 관한 한, 본관은 그들이 일본놈 군대 병영의 한복판에까지도 아무런 방해 없이 갈 수 있다고 믿는다. 그러나 아무리 소수라 하더라도 미군이 어느 읍에 나타나면 주민들은 즉시 그들이 경찰과 치안 유지를 전면적으로 접수해 주기를 기대하며, 그것은 조선인들이 일본 국민을 상대로 행동을 개시하는 신호가 된다. 미군의 위상으로 말하자면, 그들이 아직까지 한 발도 쏘거나 주민 하나 다치게 할 일이 없었고, 있는 곳마다 질서를 회복하고 유지할 수 있었다는 사실은 그들의 위신을 매우 뜻깊게 보여 준다. 그러나 이 임무에 지정된 전 병력이 가능한 한 조속히 조선으로 수송되는 것이 필수적이다.\n\n17. 본관은 앞으로 이삼 일 안에 부산에 정찰 및 시찰반을 보낸다. 여기에는 남조선 해군기지에 대한 해군 시찰반이 포함된다. 별도의 지령이 없는 한 본관은 제40사단이 도착하는 대로 그 대부분을 부산으로 이동시킬 것으로 예상한다. 다만 이와 관련하여, 제40사단이 인천의 기지들로부터 부산에서 유지될 수 있을지는 매우 의문스럽다. 해군이 조기에 부산항을 소해하고 개항하는 것이 필수적이라고 본다. 본관은 무장한 일본군 6만이 있는 조선 남쪽의 제주도(Saishu)에 준비가 갖추어지는 대로 항공편으로 무장해제 및 시찰반을 보낸다. 제17방면군 사령관은 이것이 실행 가능하리라고 본관에게 확언하였다. 본관의 의도는 일본군을 무장해제한 뒤 모든 무기를 현지에서 파괴하거나, 반출이 요구된다면 해군이 상륙 지점을 소해하고 LST를 들여보내 수거할 수 있을 때까지 보관하여 감시 하에 두는 것이다.\n\n18. 조선을 취재하는 신문 특파원들은 집단으로서 나쁘게 처신하였다. 그들은 우리 상륙 후 항공편으로, 대부분 일본에서 왔는데, 현지 사정에 대한 아무런 지식도 없고 사전 교육도 받지 않은 채 미군 군복을 이용하여 지역을 휘젓고 다니며 본관이 병사들에게 금지한 개인적 비행을 저질렀다. 그들 중 일부가 조선의 급진 분자들에게 공공연히 동조함으로써 조선인 집단 지도자들을 부추겨, 모든 것을 뒤엎고 조선인이 즉시 모든 기능을 접수하도록 선동하는 데 더 힘쓰게 만들었다고 볼 만한 근거가 있다. 그들은 실정을 조금이라도 엿보기도 전에 이 나라의 모든 정책, 총사령부(GHQ)의 정책, 점령에 관한 이 사령부의 정책을 신랄하게 비판하였다. 이 마지막 상태는 그들이 사정을 알아 가면서 지금 서서히 스스로 바로잡히고 있다. 어느 한 무리는 어느 날 오후 항공편으로 도착하여 그날 저녁 기사를 송고하고 이튿날 아침 떠났는데, 조선 점령에 관하여 다 안다고 여기고 있었다.\n\n19. 다음과 같이 권고한다.\n\n   가. 조선의 정치·경제적 장래에 관한 국제 정책을 수립하고 발표할 목적으로, 국제 정책 수준의 통제 기구를 경성에 설치할 것. 이 기구는 쓸모 있고 실효를 거두려면 현지에서 기능하여야 한다.\n\n   나. 권고 가가 실현될 때까지, 조선의 장래에 관한 정책에 대하여 본관에게 명확한 훈령을 줄 것, 또는 장래에 관하여 말할 권한을 부여받은 워싱턴 관리들을 본관의 참모진에 배속할 것. 이 방향의 권고는 본관의 국무부 대표도 이미 보고하였다.\n\n   다. 정무에 경험이 있고 동양인을 아는 유력한 장교들을 본관의 참모로 확보하도록 모든 노력을 기울일 것.\n\n   라. 중경의 망명 정부를 연합국의 후원 아래 임시정부로서 조선에 돌아오게 하여, 점령 기간 동안 그리고 조선 민중이 선거를 치를 수 있을 만큼 안정될 때까지 명목상의 수반 노릇을 하게 하는 방안을 검토할 것.\n\n   마. 조선의 상업과 산업을 재건하는 데 도움을 줄 수 있고 또 주려는 미국 실업가들에게 문을 열고, 일본인 재산을 조선인에게 이양하는 일을 그들이 돕게 할 것.\n\n   바. 일찍이 일본인이 사용하여 온 어떠한 통화의 사용도 폐기하는 새로운 통화 정책을 조기에 수립할 것.\n\n   사. 조선에 대한 장래 정책에 모든 일본 국민의 역외 이송을 포함시킬 것.\n\n   아. 국제 무역을 조기에 재개할 것.\n\n존 R. 하지(JOHN R. HODGE)\n미육군 중장, 사령관", "secondary": "TOP SECRET\n\nHEADQUARTERS\nUNITED STATES ARMY FORCES IN KOREA\nAPO 235\n\n13 September 1945\n\nSUBJECT: Conditions in Korea.\n\nTO : Commander-in-Chief, United States Army Forces, Pacific.\n\n1. This will give a brief and incomplete picture of conditions in Korea. No document readable within reasonable time can possibly give the full details.\n\n2. On the face the Japanese have accepted the terms of surrender. In the area of occupation they appeared to cooperate in withdrawal and disarming. However, reports come in from areas where they are to the south of us indicating that they are looting the Koreans, intimidating them and generally behaving in true Jap fashion. Koreans do not understand that our occupation is only piecemeal and that I do not have troops to spread over the entire area. This condition probably exists throughout the area. Extensive long-range patrols will start as soon as transportation becomes available. Unless I can arrange early transportation of the Japanese forces to Japan I feel it will be necessary to put them in concentration camps.\n\n3. The best way to describe southern Korea at present is to state that the area is a powder keg ready to explode upon application of a spark. I discovered today that Korean translations, including translations of the proclamations, have translated the words \"in due course\" announced in the Cairo Agreement to the words or meaning \"in a few days\" or \"very soon\". Well-educated Koreans familiar with English were greatly surprised when I pointed out the English wording of the Cairo Agreement. For this reason Koreans have not understood why they were not given complete independence and allowed to establish completely their own government within two or three days after arrival of American troops. This thought of immediate independence and immediate sweeping out of the Japs has dominated their minds. Disappointment in the fact that there is any delay is great.\n\n4. The Koreans hate the Japs with a bitterness unbelievable unless seen and given an opportunity they will wreak dire vengeance on all Japs, civilians and soldiers alike. On the contrary I do not believe that they will carry out this revenge so long as American troops are in surveillance.\n\n5. Removal of Japanese from the existing government is highly desirable from a standpoint of public opinion but practicably will be impossible to complete for some time to come. Japs can be relieved in name, but will be required to do work. The Koreans do not have qualified personnel to take over more than the low-level governmental, provincial and city jobs. Neither do they have technicians to operate utilities and communications. Also, such Koreans as have worked into higher levels are considered to be pro-Japanese and are hated as badly, if not worse, than are the Japs. The two sorest spots are: first, that Koreans are ruled by Japanese; second, the conditions as respects the police and the police departments. It is believed that the removal of Governor General Abe and the removal of the Police Commissioner, accompanied by a sweeping revision of police in the Keijo District will do a lot to mollify irate Koreans even though it will not strengthen the government.\n\n6. There are an unknown number of political parties or groups in Korea. The long period of suppression and difficulty of underground operations have completely split up most coherent political trends. It would appear that any Korean of average intelligence who knows a hundred other Koreans can form a political party and make vocal demands. I met representatives of political groupings yesterday based upon two persons per group. These were registered as they entered the auditorium designating the group from which attending. The number of persons attending this meeting was over 1,200. This gives some idea of the diversity of opinion. About the only common trend in their thought is to seize Jap property, get the Japs out of Korea and to have Korean independence right now. None of them really know what they want beyond those three things.\n\n7. Almost all Koreans have been on a prolonged holiday since surrender was announced on 15 August. It is apparent that their idea of independence is freedom of all cares of work and that the world will support them. Since arrival of American troops here there has been no show of industry in the Jinsen-Keijo area and but little interest in returning to any normal pursuits. In all contacts and propaganda we have stressed the absolute necessity for Koreans to stay on the job and build up their own country for the future and for Koreans. They cannot reconcile the fact that work they do for the Japs now (the Japs owning or controlling all businesses) has any bearing on their future. It may be that eventually I can get them to realize this. However, at present they are completely ripe for agitators.\n\n8. The monetary system in Korea is still a large questionmark. My few investigators are working full blast in attempt to find out what conditions are. Based upon incomplete information it would appear that inflation is already well underway to the extent that it may not be controllable. Several billion yen, Bank of Chosen, have been distributed in the country most of which has been printed and distributed since 15 August. Some was printed here and some flown from Japan before our arrival. There are reports indicating that a local plant in Keijo printed several billion Bank of Chosen yen for the Japanese Army. These are under investigation and have not been verified, however prices and labor demands for wages have skyrocketed beyond immediate control. It is considered virtually impossible effectively to peg prices and wages at the August 15 official level as directed with any hope of enforcement without instituting a completely new monetary system. The pegging can be physically accomplished but will only further foster a now well-established black market and will be completely impotent. It appears that the Japs have thoroughly sabotaged the Korean monetary system.\n\n9. Except for a few penetrations across the border Soviet forces have respected the 38 degree boundary. However, from information gained firsthand by troops and reporters in the areas visited by the Russians, they have not respected the rights of any individuals, in person or in property, either Jap or Koreans. Based on reports of persons interviewed and eyewitness accounts of results, the Russians have vandalized, raped, pillaged and looted indiscriminately areas south of 38 degrees where they have visited. There is little question but that their agents are leavening their political thought throughout southern Korea. Several parades and demonstrations, although peaceful, appear to be the above-ground communistic elements. These advocate seizure now of all Japanese property and constitute a possible threat to good order. From the trend of events, it is probable that well-trained agitators, directed by the underground Russian Communists, are operating in attempts to produce such chaos in our area as to prove to Koreans that the United States cannot administer the area and make them demand Russian \"freedom\" and control. In view of our low troop strength here and our lack of ability to expand control rapidly over the southern area there is fertile ground for these attempts.\n\n10. I have contacted the Russian Consul at Keijo and have a liaison party at Russian Headquarters at Kaijo accompanied by a member of the local consulate. Troops of the 7th Division have contacted Russian forces along the boundary line. So far no understandings have been reached but it is hoped that definite information can soon be given. There is no indication that the Russians will make a general advance south of 38.\n\n11. The splitting of Korea into two parts for occupation by forces of nations operating under widely divergent policies and with no common command is an impossible situation. Southern Korea contains the capital city. All communications are based upon this fact. Southern Korea also contains the principal cereal crop areas while Northern Korea contains all coal and primary sources of electric power. Neither section can operate independent of the other.\n\n12. There are two critical shortages in southern Korea, namely, coal and food cereals. The shortage of coal is due to lack of communications between southern and northern Korea where coal is produced. At present there is an estimated ten-day supply to run the railroads. Among negotiations with the Russians obtaining of coal has highest priority. Shortage of cereals is due to outshipping by Japan of tremendous quantities of rice after last year's crop. Cereal crops will be excellent this year but are not due for gathering until October and November. Food distribution is currently difficult due to disruption of railways and lack of motor transportation. Before the attack by the Russians the Japanese Army assisted in distribution of foods and handled the railroads in efficient fashion. We are lending some assistance to distribution and rehabilitating as rapidly as possible all Japanese Army transportation above their immediate needs for evacuation in getting food distributed.\n\n13. In addition to the voluntarily unemployed, including those whose idea of independence is that they may be idle, there are hundreds of thousands of Koreans out of work because of the collapse of war industries. Manufacturing of all types is now at a standstill for a lack of raw materials and there is no possibility of immediate correction through turning war industries into peacetime manufacturers. This, combined with the release of Koreans from Japanese Army control, amounts to a tremendous problem particularly with winter approaching.\n\n14. In my opinion nothing approaching stable conditions in Korea can be established until the Japanese Army and most of the Japanese population have been removed to Japan. Demobilization of the Japanese Army in Korea is absolutely impossible. It will have to be kept in formed bodies and removed to Japan beginning as soon as its disarmament is complete. It will be a source of irritation as long as here. It cannot be controlled here unless taken over and put in guarded camps where we have to feed, house and care for them. Ferries are now operating from Fusan to Kyushu capable of transporting about 6,000-7,000 individuals per day. They are carrying Japanese to Japan and Koreans to Korea at about equal rate. It is believed that these should be continued since nationals of the two nations are piling up in the ports on each side of the channel trying to get home and the exchange does not affect the balance of individuals to be fed and housed but does reduce the capacity in each area for making troubles. However, it would greatly assist our effort to be allowed to transport the Jap Army home at an early date, supervising this move at the port.\n\n15. The most encouraging single factor is the presence of several hundred conservatives among the older and educated Koreans. Right now many of them are suspected of collaboration with the Japs but it is believed this feeling will rapidly disappear. Actually, most of them served periods in prison at various times during the war because of Jap suspicions and thought control, and are in my opinion worthwhile citizens although of little use in government. So far as can be determined far more Koreans favor return of the Chungking Korean government than any other. However, due to wide diversity of opinion those favoring Chungking are believed to be short of a majority.\n\n16. I am operating under two tremendous handicaps neither of which can be corrected by my action alone. The first is that I have no information of the future of the Korean public, what is to happen to the nation, what will be the solution of the now almost complete division of Korea in the occupation by two nations or of any Allied or United States policies that may be progressively adopted beyond immediate military necessity. The second is that this command arrived here so small in strength and short in competent staff and military government personnel that it can only operate in limited areas and with little overall effect. There is urgent necessity for expanding throughout all provinces of southern Korea as rapidly as possible with adequate military government and sufficient troops to maintain order. Insofar as American troops are concerned I believe they can go anywhere without being disturbed, even into the center of Jap Army camps. However, when any American troops, no matter how small in number, appear in a town the population expects them immediately to take over full control of police and maintenance of order, and it is the signal for Koreans to begin action against Japanese nationals. As for the status of American troops, the fact that they have not yet been required to fire a shot or to injure an inhabitant and that they have been able to restore and maintain order wherever they are, is highly significant of their prestige. However, it is essential that the entire force designated for this mission be transported to Korea as early as possible.\n\n17. I am sending reconnaissance and inspection teams to Fusan within the next two or three days. This will include a Navy inspection team to the southern Korea Naval Base. Unless there is a further directive I expect to move most of the 40th Division to Fusan as soon as it arrives. In this connection, however, it is highly problematic as to whether or not the 40th Division can be maintained in Fusan from bases at Jinsen. It is believed essential that the Navy sweep and open the port of Fusan at an early date. I am sending by air a disarmament and inspection team to the island of Saishu south of Korea where there are 60,000 armed Japanese forces as soon as arrangements can be completed. The 17th Japanese Army Commander assures me that this will be feasible. My intention is to disarm the Japanese and either to destroy all armament in place or, if it is desired that it be brought out, to store and put it under guard until such time as the Navy can sweep landing areas and run in LSTs to pick it up.\n\n18. The newspaper correspondents covering Korea as a group have behaved badly. They arrived by air after our landing, most of them from Japan with no knowledge of the local situation and without orientation took advantage of the American uniform to run rampant over the area, committing acts of personal misbehavior that I have forbidden troops to do. There is reason to believe that by open sympathies with Korean radicals some of them have incited Korean group leaders to greater efforts at agitation for overthrow of everything and to have the Koreans take over all functions immediately. Before they got any glimmer of conditions as they existed, they were highly critical of all policies of the nation, of GHQ and of this headquarters relating to the occupation. This latter condition is now rectifying itself slowly as they begin to see the picture. One group arrived by air one afternoon, filed stories that evening and left the next morning, feeling that they knew all about the Korean occupation.\n\n19. It is recommended that:\n\na. A control group on an international policy level be established at Keijo for the purpose of establishing and announcing international policies concerning the political and economic future of Korea. This group must function on the ground to be worthwhile and effective.\n\nb. Pending consummation of recommendation a, I be given definite instructions as to policy with respect to the future of Korea or that Washington officials empowered to speak of the future be added to my staff. Recommendation along this line has also been forwarded by my State Department representative.\n\nc. Every effort be made to get high-powered officers for my staff who are experienced in governmental affairs and who know orientals.\n\nd. Consideration be given to returning the Chungking Government in exile to Korea as a provisional government under Allied sponsorship to act as figureheads during occupation and until Korean people stabilize to where there can be an election.\n\ne. The door be opened to American business men who can and will help reestablish Korean business and industry and assist in effecting transfer of Japanese property to Koreans.\n\nf. Early establishment of a new monetary policy abandoning the use of any currency that has formerly been used by the Japanese.\n\ng. Future policy for Korea include removal of all Japanese nationals from the area.\n\nh. International trade be reestablished at an early date.\n\nJOHN R. HODGE, Lieutenant General, U. S. Army, Commanding.\n\nTOP SECRET", "notes": ["[도장·결재] [0098] 우측 상단 고무인(세로): 'GHQ AGO RECORDS 15 SEP 1945' — 총사령부 부관부 기록과 접수 도장. 그 옆 손글씨 '014.1 Korea'(파일 분류번호 가필)", "[도장·결재] [0098] 우측 상단 모서리 연필: '9A'", "[도장·결재] [0098] 좌측 여백 손글씨 체크 표시(√ 또는 C 모양) 1개 — 일자 아래", "[도장·결재] [0098] 우측 여백 세로 연필: '1C4-8'로 읽히나 확실하지 않음 [판독불가]", "[도장·결재] [0098~0105] 각 면 상단·하단에 'TOP SECRET' 고무인, 상단에 편철 구멍 자국 두 개", "[도장·결재] [0098~0105] 각 면 좌측 하단 연필 편철기호 '2'", "[도장·결재] [0099] 본문 마지막 줄 'those two things'의 'two'를 지우고 그 아래 손글씨로 'three' 정정 — 문서 작성 후 손으로 고친 것", "[도장·결재] [0101] 본문 'seizure now of all Japanese property'의 'now'에 손글씨 밑줄", "[도장·결재] [0104] 우측 여백 손글씨 체크 표시(√) 1개 — 부산항 소해 대목 옆", "[도장·결재] [0104] 본문 'I am sending soon by air'에서 'soon'을 타자기로 지움(xxxx 처리)", "[도장·결재] [0105] 19항 각 권고 옆 우측 여백 손글씨 회부 표시: 가 — 'C/S' 및 [판독불가], 나 — 'Govt'(민정부), 다 — 'wire', 라 — 'Govt', 마 — 'Col. Kramer', 바 — 'Col. Kramer', 아 — 'Col. Kramer'", "[도장·결재] [0105] 19항 'a.' 앞과 'h.' 끝에 손글씨 인용부호 표시(권고 전체를 묶는 표시로 보임)", "[도장·결재] [0105] 하단 좌측 손글씨: 'Mil Gov't Sec R/S dtd 9/19/45 TO AG REC FOR FILE. BY ORDER OF GEN. CRIST.  /s/ CEG.' — 1945년 9월 19일자 민정부 라우팅 슬립으로 크리스트 장군의 명에 의해 부관부 기록과에 편철 회부", "[도장·결재] [0105] 하단 우측 손글씨: 'ORIG BUCK SLIP NOT AVAIL.  /s/ F.H.C.' / 'FILE.  /s/ H.F.' — 원 회부 쪽지(buck slip) 없음, 편철 지시", "[도장·결재] [0105] 서명란에 하지 자필 서명", "편철 메모 — dupes.json 기준 사본 세 벌(0106~0114, 0115~0122, 0123~0130). 0106 과 0107 은 둘 다 첫 면으로, 한 벌에 표지격 첫 면이 두 장 들어가 있다."], "note": "번역자 주 — 이 문서는 FRUS 에 수록되지 않았다. 널리 알려진 하지의 1945년 9월 24일자 서한(이 문서철의 2-B, FRUS 1945 d783)이 \"본관의 9월 13일자 서한\"이라며 참조하는 그 원편이 바로 이것이다.\n\n표기에 관하여 — 원문은 일본인을 가리켜 'Japanese'와 멸칭 'Jap/Japs'를 섞어 쓴다. 규칙에 따라 다듬지 않고, 'Japanese'는 '일본인/일본군'으로, 'Jap/Japs'는 멸칭임이 드러나도록 '일본놈(Jap)'으로 옮겼다. 또한 9항은 소련군의 강간·약탈을, 5·15항은 조선인의 통치 능력을 낮추어 보는 서술을 담고 있다 — 모두 원문 그대로 옮겼다.\n\n지명은 원문이 쓴 일본식 음독을 병기하였다 — 경성(Keijo), 인천(Jinsen), 부산(Fusan), 제주(Saishu), 규슈(Kyushu). 10항의 'Russian Headquarters at Kaijo'는 원문 그대로 'Kaijo'로 적혀 있는데, 같은 문장 앞부분의 'Keijo'(경성)를 잘못 친 오타로 보이나 고치지 않고 그대로 두었다(한국어 본문에서는 문맥상 러시아군 사령부로만 옮겼다).\n\n2항의 'concentration camps'는 이 시기 용법상 '집결·억류 수용소'를 뜻하나, 낱말 선택 자체가 사료이므로 '수용소(concentration camps)'로 원어를 병기하였다. 14항 'Demobilization'은 조선 현지에서의 복원(제대 해산)을 뜻한다.\n\n본문의 쪽번호(-1- ~ -8-)는 규칙에 따라 옮기지 않았다. 8면 전부의 판독은 OCR 이 아니라 pages/0098~0105.jpg 원본 스캔을 직접 대조하여 확정하였다 — OCR 은 행 순서가 뒤섞여 있어 신뢰할 수 없었다.\n\n0105 하단 손글씨의 일자는 '9/19/45'로 읽었다. 첫 글자가 같은 줄의 '4'(45의 4)와 획이 달라 '9'로 판단하였으나, '4/19/45'로 읽힐 여지도 있다 — 다만 그 경우 서한 작성(9월 13일)보다 앞서므로 성립하지 않는다.\n\n이 문서에는 사본 세 벌(0106~0114, 0115~0122, 0123~0130)이 문서철에 함께 편철되어 있다.", "warn": false, "pages": ["0098", "0099", "0100", "0101", "0102", "0103", "0104", "0105", "0106", "0107", "0108", "0109", "0110", "0111", "0112", "0113", "0114", "0115", "0116", "0117", "0118", "0119", "0120", "0121", "0122", "0123", "0124", "0125", "0126", "0127", "0128", "0129", "0130"], "search": "하지(JOHN R. HODGE) — 미육군 중장, 주한미군사령관 아베(Governor General Abe) — 아베 노부유키, 조선총독 크리스트(GEN. CRIST) — 윌리엄 E. 크리스트, 군정장관. 0105 하단 손글씨에 등장 크레이머(Col. Kramer) — 0105 여백 회부 표시에 등장하는 대령 2 Ltr - Conditions in Korea."}, {"id": "1-X", "order": 124, "date": "1946-05-22", "group": "B", "eyebrow": "편철 1-X · 0131–0131면", "title": "SFE 114/7(조선 대외통상) 처리를 진행할 것을 건의", "badge": "Top Secret", "list_right": "1-X", "meta": [{"k": "일자", "v": "1946-05-22"}, {"k": "발신", "v": "주한미군사령관(COMGEN USAFIK) — 번스와 마틴 앞(FOR BUNCE AND MARTIN)", "txt": true}, {"k": "수신", "v": "연합국최고사령관(SCAP)", "txt": true}, {"k": "참조", "v": "육군참모총장(WARCOS) 및 국무부(STATE DEPT)", "txt": true}, {"k": "전문번호", "v": "TFGCG 382 · MCN TJC 57"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0131–0131 (1면)"}, {"k": "건명", "v": "Suggest proceed to process SFE 114/7 (Korean foreign commerce)", "txt": true}, {"k": "색인 요지", "v": "TFGCG 382 - Suggest proceed to process SFE 114/71[?]", "txt": true, "wide": true}], "summary": "하지가 국무부 전문 제514호에 회신하여 SFE 114/7 의 처리를 진행할 것을 건의하고, 그 내용이 현재의 계획과 매우 부합하나 남조선에만 적용할지 조선 전역에 적용할지는 합참의 인가가 바람직하며 주한미군사령관이 재량으로 어느 쪽이든 택할 수 있게 해 달라고 요청한 짧은 전문이다.", "points": ["회신 대상은 국무부 일련번호 제514호(육군 서비스 전문 6944), 발신일시 162230Z, 접수시각 170807Z.", "SFE 114/7 의 처리를 그대로 진행할 것을 건의한다.", "SFE 114/7 은 현재의 계획과 매우 부합한다(원문 「Confirms closely」).", "다만 이를 남조선에만 시행할 것인지 조선 전역에 시행할 것인지에 관해서는 합동참모본부(JCS)의 인가를 받는 것이 바람직하다.", "주한미군사령관이 자기 재량으로 어느 쪽이든 할 수 있도록 자유를 줄 것을 권고한다.", "전문은 아서 C. 번스와 에드윈 M. 마틴을 지명 수신자로 삼고 있다 — 조선 대외통상·경제 문제를 다루던 실무자들이다.", "조치 배당은 외교과(Diplomatic Section)이며, 총사령관·참모장·G-4·부관·정부과장·경제과학과에 참고 배포되었다."], "primary": "국무부 일련번호 제514호(육군 서비스 전문 6944, 발신일시 162230Z, 접수시각 170807Z)에 대한 회신.\n\nSFE 114/7 의 처리를 진행할 것을 건의함. 현재의 계획과 매우 부합함. 다만 이를 남조선에만 시행할 것인지 조선 전역에 시행할 것인지에 관하여는 합동참모본부의 인가가 바람직함. 주한미군사령관이 자신의 재량으로 어느 쪽이든 할 수 있도록 할 것을 권고함.\n\n하지(HODGE)\n\n---\n\n조치: 외교과\n\n참고: 총사령관, 참모장, G-4, 부관, 정부과장, 경제과학과\n\n부기: 본 전문은 참고를 위하여 육군참모총장 및 국무부에 재발신하도록 통신소로 넘겨졌음.", "secondary": "GENERAL HEADQUARTERS, U.S. ARMY FORCES, PACIFIC\nADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\n\nINCOMING MESSAGE\n\nTOP SECRET\nPRIORITY                          22 May 1946\n\nFROM : COMGEN USAFIK (FOR BUNCE AND MARTIN)\nTO   : SCAP\nINFO : WARCOS AND STATE DEPT\nNR   : TFGCG 382 Rerad STATE SERIAL 514 (WAR SVC 6944) DTG 162230 Z TOO 170807 Z. Suggest proceed to process SFE 114/7. Confirms closely to present planning for which JCS authorization desirable whether put into effect for Southern Korea only or for whole country. Recommend COMGEN USAFIK be free to do either at his discretion.\n\nHODGE\n\nACTION: DIPLOMATIC SECT INFORMATION: COMMANDER-IN-CHIEF, CHIEF OF STAFF, G-4, AG, C GOVT SECT, ECON & SCI SECT, NOTE: This message has been passed to Signal Center for re-dispatch to WARCOS AND STATE DEPT for Information.\n\n31385   TOP SECRET   PRIORITY   MCN: TJC 57   TOO: 220750 Z Handling and transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) (2) (3), and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946.\n\nCOPY NO. 14", "notes": ["[도장·결재] 사각 접수 도장: 「GHQ. AFPAC / AGO RECORDS / 014.1」", "[도장·결재] 상단 여백 인쇄: 「Declassified E.O. 12065 Section 3/402/ NNDG NO. ____」 — 후대의 비밀해제 표시", "[도장·결재] 우상단 자필 편철 지시: 「X 091 Korea」, 「014.1 Korea TS」, 「440 SD Korea」[판독 일부 불확실] 및 서명·사선 표시", "[도장·결재] 인쇄 「COPY NO.」 옆 자필: 「14」", "[도장·결재] 하단 인쇄 「FILE」"], "note": "번역자 주 — 1) 「Confirms closely to present planning」은 문맥상 「Conforms closely to…」(현 계획과 매우 부합한다)로 읽히나, 원문 타자가 'Confirms'이므로 고치지 않고 그대로 두었다. 원본 확대로 확인했다. 2) 「Rerad」는 'Re your radio'의 전문 약어다. 3) SFE 114/7 은 극동소위원회(Subcommittee for the Far East) 문서번호이며 번역하지 않고 그대로 두었다. batches.json 의 건명은 이를 'SFE 114/71'로 적고 있으나 원본은 114/7 이다. 4) 수신자 「BUNCE」는 OCR 이 'BUNCH'로 읽었으나 원본 확대 확인 결과 BUNCE 다. 5) 조치 배당이 외교과이고 참고 배포에 경제과학과가 들어간 것으로 보아 조선 대외통상 정책 건임이 확인된다.", "warn": false, "pages": ["0131"], "search": "존 R. 하지(Hodge) — 주한미군사령관. 전문 서명자 아서 C. 번스(Bunce)로 추정 — 원문 표기 「BUNCE」. 조선 관계 경제고문. 원문에는 성만 있어 확정하지 않았다 에드윈 M. 마틴(Martin)으로 추정 — 원문 표기 「MARTIN」. 원문에는 성만 있어 확정하지 않았다 1-X TFGCG 382 - Suggest proceed to process SFE 114/71[?]"}, {"id": "1-W", "order": 123, "date": "1946-05-17", "group": "B", "eyebrow": "편철 1-W · 0132–0132면", "title": "초기 조선 대외무역 — SFE 114/7", "badge": "Top Secret", "list_right": "1-W", "meta": [{"k": "일자", "v": "1946-05-17"}, {"k": "발신", "v": "워싱턴 국무부(WASHINGTON — STATE DEPT) — 서명 애치슨(ACHESON)", "txt": true}, {"k": "수신", "v": "연합국최고사령관(SCAP) — 정치고문 앞, 폴리(Pauley) 앞, 마틴(Martin) 앞", "txt": true}, {"k": "참조", "v": "육군부 참모총장(WAR DEPT CHIEF OF STAFF). 배포: 총사령관, 참모장, G-4, 부관부(AG), 민정부(Govt Sec), 경제과학부(Econ & Sci Sec), 외교부(Diplomatic Sec)", "txt": true}, {"k": "전문번호", "v": "WAR SVC 6944 (162230 Z) / STATE SERIAL 514"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0132–0132 (1면)"}, {"k": "건명", "v": "Korean Foreign Commerce in initial period — SFE 114/7", "txt": true}, {"k": "색인 요지", "v": "SVC 6944 - 514 - Request further discussion on Korean economy.", "txt": true, "wide": true}], "summary": "SWNCC 실무반이 초기 조선 대외무역에 관한 SFE 114/7의 처리를 거부했음을 알리고, 폴리 사절단이 조선에 있는 동안 이 문제를 논의하며 SWNCC 176/8에 담긴 무역 관련 일반 서술이 주한미군 입장에서 충분한지 검토해 볼 것을 제안한다.", "points": ["SWNCC 실무반(working group)이 초기 조선 대외무역(Korean Foreign Commerce in initial period)에 관한 SFE 114/7의 처리를 거부하고 있다.", "거부 이유는 두 가지다 — 그 문서가 현행 절차의 즉각적 변경을 요구하지 않는다는 것, 그리고 통합된 조선 경제의 장래 전망이 이전보다 덜 밝다는 것이다.", "조선에 있는 동안 이 문제를 논의할 것을 제안한다.", "SWNCC 176/8에 담긴 무역에 관한 일반적 서술이 주한미군(USAFIK)의 관점에서 충분한지 검토해 보라.", "이 전문은 신호센터를 거쳐 주한미군사령관(폴리 앞, 마틴 앞)에게 조치용으로 재발송되었다."], "primary": "SWNCC 실무반은 초기(初期)의 조선 대외무역에 관한 SFE 114/7에 대해 조치 취하기를 거부하고 있다. 이유는 그 문서가 현행 절차의 즉각적인 변경을 필요로 하지 않는다는 것과, 통합된 조선 경제의 장래 전망이 이전보다 덜 유망하다는 것이다. 조선에 있는 동안 이 문제를 논의하고, SWNCC 176/8에 들어 있는 무역에 관한 일반적 서술이 주한미군(USAFIK)의 견지에서 충분한지 검토해 볼 것을 제안한다.\n\n애치슨(ACHESON)", "secondary": "SWNCC working group refusing take action on SFE 114/7 Korean Foreign Commerce in initial period for reason that paper necessitates no immediate change in current procedures and future outlook for integrated Korean economy now less promising than before. Suggest that while in Korea you discuss this matter and explore adequacy from standpoint of USAFIK of general statements on trade contained SWNCC 176/8.\n\nACHESON", "notes": ["[도장·결재] 접수 도장: GHQ AFPAC AGO RECORDS", "[도장·결재] 도장 안 손글씨: '014.1 Korea TS-S'", "[도장·결재] 여백 손글씨 회부 표시: 'X 372 Dipl. Sect.', 'X 091 Korea', 'X 091.31' — 이니셜 'McB'(판독 불확실)와 사선", "[도장·결재] 본문 오른쪽 여백 손글씨: '014.1 Korea TS-S'", "[도장·결재] 도장(하단): 'AG RECORD COPY'", "[도장·결재] 타자 회부 기재: '이 전문은 신호센터로 넘겨져 CG USAFIK(폴리 앞, 마틴 앞) 앞으로 재발송되었음 — 조치용(for Action)'", "[도장·결재] 상단: 'Declassified E.O. 12065 Section 3/402/ NNDG NO. [판독불가]'", "[도장·결재] 좌하단 연필 일련번호: 1-W", "[도장·결재] 전문 정리번호: 28698"], "note": "번역자 주 — 1) 문서번호 SFE 114/7(극동소위원회), SWNCC 176/8 은 번역하지 않고 그대로 두었다. 본문의 SWNCC 176/8 은 같은 문서철의 7-C·7-G 에 나오는 SWNCC 176/18 과 다른 번호다 — 원본에 176/8 로 뚜렷이 찍혀 있어 고치지 않았다. 2) 하단 주의 문구의 'AR 380-5, 6 March 1946' 은 다른 면들의 '15 Mar 1944' 판과 다른 개정판이다. 원문 그대로. 3) 서명 ACHESON 과 7-D 의 'Atcheson'(맥아더의 정치고문 George Atcheson, Jr.)은 다른 인물이다. 4) 도장의 접수 일자 숫자가 잉크에 묻혀 판독되지 않아 본문 타자 '17 May 1946' 만 기록했다.", "warn": false, "pages": ["0132"], "search": "애치슨(Dean Acheson — 원문 'ACHESON'. 국무부 발신 전문의 서명이므로 당시 국무차관 딘 애치슨으로 읽힌다) 폴리(Edwin W. Pauley — 원문 'PAULEY', 배상사절단장) 마틴(Martin — 원문 'MARTIN', 폴리 사절단 수행. 이름 미상) 1-W SVC 6944 - 514 - Request further discussion on Korean economy."}, {"id": "1-V", "order": 122, "date": "1946-05-15", "group": "B", "eyebrow": "편철 1-V · 0133–0133면", "title": "TFYMG 1728의 건의는 호의적으로 고려되지 않음", "badge": "Top Secret", "list_right": "1-V", "meta": [{"k": "일자", "v": "1946-05-15"}, {"k": "발신", "v": "연합국최고사령관(SCAP)", "txt": true}, {"k": "수신", "v": "주한미군사령관(COMGEN USAFIK)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "C-61010"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0133–0133 (1면)"}, {"k": "건명", "v": "Recommendation in TFYMG 1728 is not favorably considered", "txt": true}, {"k": "색인 요지", "v": "C 61010 - Recommendations your TFYMG 1728 not favorably consdrd.", "txt": true, "wide": true}], "summary": "주한미군사령부가 올린 전문 TFYMG 1728의 건의에 대해 호의적으로 고려되지 않는다고 통보한 두 줄짜리 회신 전문이다.", "points": ["회신 대상은 주한미군사령부 전문 TFYMG 1728이다.", "그 건의는 '호의적으로 고려되지 않는다(is not favorably considered)' — 즉 기각이다.", "부관감 피치(B. M. Fitch) 준장 명의의 인증으로 발송되었다.", "배포처에 경제과학국(ESS)·G-2·부관부·정부과(Govt Sec)·외교과(Dip Sec)가 들어 있다."], "primary": "귀 전문 태어·폭스·영·마이크·조지 일 칠 이 팔(TFYMG 1728) 관련, 건의는 호의적으로 고려되지 않음.\n\n인증(OFFICIAL):\nB. M. 피치(B. M. FITCH), 준장, 부관부(AGD), 부관감(Adjutant General)\n\n[배포] C/S(참모장) 2부 / ESS(경제과학국) / G-2 / AG(부관부) / Govt Sec(정부과) / Dip Sec(외교과)", "secondary": "REUR TARE FOX YOUNG MIKE GEORGE ONE SEVEN TWO EIGHT CMA RECOMMENDATION IS NOT FAVORABLY CONSIDERED PD\n\nOFFICIAL:\nB. M. FITCH\nBrigadier General, AGD Adjutant General DISTRIBUTION:\nC/S (2)\nESS\nG-2\nAG Govt Sec Dip Sec [foot of sheet] TFYMG 1728", "notes": ["[도장·결재] 상단 'TOP SECRET' 도장, 하단 'TOP SECRET' 도장", "[도장·결재] 우측 상단 접수 도장 — 'GHQ AFPAC AGO RECORDS', 그 안에 손글씨 '014.1 Korea TS-3'", "[도장·결재] 좌측 상단 타자 'R' · 'O C/S  PJM/djm  15 May 1946'", "[도장·결재] 본문 위 손글씨 편철기호 — '014.1 Korea (TS) / 1-V'", "[도장·결재] 발신 번호 손글씨(굵은 숫자) '150701'", "[도장·결재] 본문 안 손글씨 전문번호 'C-61010'", "[도장·결재] 면 하단 타자 참조 'TFYMG 1728' · 우하단 'A. G. FILE' 도장", "[도장·결재] 좌하단 연필 편철기호 '1-V'", "[도장·결재] 상단 여백 인쇄 — 'Declassified E.O. 12065 Section 3/402/ NNDG NO.'", "편철 메모 — OCR 상 전문번호 'C 61010' 은 판독되지 않았으나 발신·수신·날짜·참조(TFYMG 1728)가 색인과 일치."], "note": "번역자 주 — 이 면에는 'PULLED AND SENT TO O OF C/S' 같은 반출 표시나 'NOTE FOR RECORD' 쪽지가 없다. 실물은 SCAP이 주한미군사령관에게 보낸 짧은 발신 전문 한 장이다. 배포란의 'G-2'는 활자가 흐려 확신도가 낮으나 'G-2'로 읽었다. 본문은 음성 문자(TARE=T, FOX=F, YOUNG=Y, MIKE=M, GEORGE=G)로 전문번호 TFYMG 1728을 풀어 쓴 것이다. 'REUR'는 'Reference your', 'CMA'는 쉼표, 'PD'는 마침표를 뜻하는 전신 부호다. 전문번호 C-61010은 본문 안에 손글씨로 적혀 있다. 날짜가 색인(16 May)과 원본(15 May)이 어긋난다.", "warn": true, "pages": ["0133"], "search": "B. M. 피치(B. M. Fitch) — 준장, 부관감 1-V C 61010 - Recommendations your TFYMG 1728 not favorably consdrd."}, {"id": "1-U", "order": 121, "date": "1946-05-07", "group": "B", "eyebrow": "편철 1-U · 0134–0135면", "title": "조선 경제생활에 대한 일본인 지배의 청산 (SWNCC 176/8)", "badge": "Top Secret", "list_right": "1-U", "meta": [{"k": "일자", "v": "1946-05-07"}, {"k": "발신", "v": "주한미군사령관(CG USAFIK)", "txt": true}, {"k": "수신", "v": "연합국최고사령관(SCAP) — 국무부 및 SWNCC 앞으로 육군참모총장(WARCOS)에게 전달 요망", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "TFYMG 1728"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0134–0135 (2면)"}, {"k": "건명", "v": "Elimination of Japanese control of Korean economic life (SWNCC 176/8)", "txt": true}, {"k": "색인 요지", "v": "TFYMG 1728 - Elimination of Jap control of Korean econ life.", "txt": true, "wide": true}], "summary": "주한미군사령부는 SWNCC 176/8이 명한 대(對)일본 경제 종속 청산과 조선의 세계무역 참가를 실행할 준비가 되어 있음을 보고하고, 현행 지휘·보고 체계가 이를 심각하게 가로막고 있다며 SWNCC 176/8의 경제·재정 부분을 주한미군사령관 앞 별도 지령으로 재발령할 것 등 네 가지를 건의한다.", "points": ["SWNCC 176/8(1945년 10월 13일자 — 원문은 '1946'으로 오기) 제11항 A는 조선 경제생활에 대한 일본인 지배의 잔재를 모두 없애고 조선을 일본에 대한 경제적 종속에서 떼어 놓을 여건을 조성하라고 명한다.", "같은 문서 제11항 B는 통제를 조건으로 조선의 세계무역 참가를 장려하라고 명한다.", "제23항 A는 개별 승인을 조건으로 조선인이 해외 자산을 취득하는 것을 허용할 수 있음을 함축한다.", "제41항은 규정이나 허가에 의한 것 외의 외환 거래를 금지하고, 수출 대금은 합참을 통해 특별히 승인된 경우를 제외하고는 필수 수입에만 쓰이도록 하라고 명한다.", "본 사령부는 위 통제를 완전히 그리고 독자적으로 시행할 준비가 되어 있다.", "일반 환율이 정해지고 정상적 자유무역의 전제 조건이 갖추어지기까지는, 정부 간 무역을 보충하여 조선인 무역업자에게 허가를 주어 대외 거래를 성사시키게 하겠다. 육군부 승인 수출입 계획(USAMGIK 국가경제위원회가 확정)의 범위 안에서, USAMGIK 대외통상과 감독 아래, USAMGIK 해운국이 통제하는 선복(船腹)으로 한다.", "이에 부수하는 정부 간 교섭은 SWNCC 176/8 제25항 D에 지시된 경로를 통해 USAMGIK 외무처가 수행한다.", "직접 물물교환이 어려운 경우, 조선 수출품 판매로 얻은 미달러 신용은 USAMGIK 재무부가 신탁 보유하고, 승인된 필수 수입품 구매나 합참을 통해 추후 승인되는 목적(예 : 조선인 관리·기술자·학생의 해외 연수)에만 인출을 허용한다.", "건의 A : SWNCC 176/8의 제2부·제3부(경제 및 민간 보급·재정, 54~68쪽)를 조선 민사에 관한 기본 초기 지령에서 삭제하되, 태평양미육군총사령관(COMINCH AFPAC) 앞 지령의 일부로서 삭제하고 주한미군사령관 앞 별도 지령으로 재발령할 것.", "건의 B : 제2부·제3부가 다루는 사항에 관하여 본 사령부와 육군부 사이의 직접 통신을 인가할 것.", "건의 C : SWNCC 176/8 제33항에 따라 조선의 일반 환율에 관한 추가 훈령을 조속히 공포할 것. 위 절차 자체는 일반 환율 공표를 요하지 않으나 여건이 허락할 때 환율이 정해지면 수월해진다.", "건의 D : 미국 상업회사(United States Commercial Company) 대표를 즉시 본 사령부에 파견하여, 미국 시장에서 팔릴 조선 수출품의 판매 교섭을 돕게 할 것.", "위 건의는 군정장관의 무조건적 동의를 받았다."], "primary": "1945년 10월 13일자 SWNCC 176/8 제11항 A는 본관에게 조선 경제생활에 대한 일본인 지배의 모든 잔재를 없애고, 조선을 일본에 대한 경제적 종속에서 떼어 놓을 여건을 조성할 것을 명하고 있음. 같은 문서 제11항 B는 통제를 조건으로 조선의 세계무역 참가를 장려하도록 명함. 제23항 A는 개별 승인을 조건으로 조선인이 해외 자산을 취득하는 것을 허용할 수 있음을 함축함. 제41항은 규정이나 허가에 의하여 인가된 경우를 제외하고 외환 거래를 금지하며, 합동참모본부를 통하여 특별히 승인된 경우를 제외하고는 수출 대금이 필수 수입에만 쓰이도록 할 것을 명하고 있음.\n\n본 사령부는 위 인용 조항들이 요구하는 통제를 완전하게 또 독자적으로 시행할 준비가 되어 있음. 일반 환율의 설정과 정상적 자유무역의 전제가 되는 여건의 조성이 이루어지기까지는, 정부 대 정부의 무역을 보충하여 조선인 무역업자에게 허가를 내주어 대외 거래를 성사시키게 할 준비가 되어 있음 — 육군부가 승인하고 USAMGIK(주한미군정청) 국가경제위원회가 확정하는 수출입 계획의 범위 안에서, USAMGIK 대외통상과의 감독 아래, USAMGIK 해운국이 통제하는 선복(船腹)으로써 함. 그러한 무역에 부수하는 정부 간 교섭은 SWNCC 176/8 제25항 D에 지시된 경로를 통하여 USAMGIK 외무처가 수행할 것임.\n\n직접 물물교환이 실행 가능하지 않은 경우에는, 조선 수출품의 판매를 통하여 확보되는 미달러 신용을 USAMGIK 재무부가 신탁으로 보유하고, 승인된 필수 수입 물자의 구매 또는 합동참모본부를 통하여 추후 승인될 수 있는 그 밖의 목적(예컨대 조선인 관리·기술자·학생의 해외 연수)에 한하여 인출을 허용할 것을 제안함.\n\n현행 체제는 조선의 세계무역 참가 장려와 조선의 대일 경제 종속으로부터의 완전한 분리를 심각하게 저해하고 있음. 이 목적들을 가장 효과적으로 달성하기 위하여 다음의 건의를 귀 고려에 부침.\n\n**A.** SWNCC 176/8의 제2부 및 제3부(경제 및 민간 보급, 그리고 재정 — 54쪽부터 68쪽까지)를, 조선 민사(civil affairs)에 관한 기본 초기 지령에서, 태평양미육군총사령관(COMINCH AFPAC) 앞 지령의 일부인 한도에서 폐지하고, 주한미군사령관 앞 별도의 지령으로 재발령할 것.\n\n**B.** SWNCC 176/8 제2부 및 제3부가 다루는 사항에 관하여 본 사령부와 육군부 사이의 직접 통신을 인가할 것.\n\n**C.** SWNCC 176/8 제33항에 따라, 조선의 일반 환율에 관한 추가 훈령을 조속히 공포할 것. 위 제2부에 서술된 절차는 일반 환율의 공표를 요하지는 않으나, 여건이 허락할 때 그러한 환율이 설정되면 절차가 수월해질 것임. 이 절차들을 따르면서 얻는 경험은, 정상적 무역이 가능해질 때 조선에 값진 접촉선과 판로를 제공할 것임.\n\n**D.** 미국 상업회사(United States Commercial Company)의 대표를 즉시 본 사령부에 파견하여, 미국 시장에서 팔릴 수 있는 조선 수출 물자의 판매 교섭을 돕게 할 것.\n\n위 건의들은 군정장관(Military Governor)의 무조건적 동의를 받았음.\n\n서명 없음(No Sig)", "secondary": "Paragraph 11A of SWNCC 176/8 dated 13 October 1946 directs me to eliminate all vestiges of Japanese control over Korean economic life, and to foster conditions that will separate Korea from economic dependence upon Japan. Paragraph 11 B of same document directs that, subject to control, Korean participation in world trade will be encouraged. Paragraph 23 A implies that, subject for specific approval, Koreans may be permitted to acquire foreign assets. Paragraph 41 directs that foreign exchange transactions be prohibited except as authorized by regulation or license, and that proceeds of exports be made available for essential imports only, except as specifically approved through JCS.\n\nThis command is prepared to excercise completely and independently the controls required in the above citations. Pending establishment of a general rate of exchange and development of conditions prerequisite to normal free trade, we are prepared to supplement government-to-government trading by licensing Korean traders to consummate foreign transactions within the War Dept approved import-export programs fixed by USAMGIK National Economic Board, under supervision of USAMGIK Foreign Commerce Section and in bottoms controlled by USAMGIK Bureau of Marine Transportation. Inter-governmental negotiations incidental to such trade will be conducted by USAMGIK Office of Foreign Affairs through channels indicated in paragraph 25 D, SWNCC 176/8.\n\nWhere direct barter is not feasible, it is proposed that US dollar credits procured through sale of Korean exports will be held in trust by USAMGIK Department of Finance, and will be permitted to be withdrawn only for the purchase of approved essential import commodities or for such additional purpose as may eventually be approved through JCS (for examples, Foreign training of Korean officials, technicians and students).\n\n[CG USAFIK RADIO TFYMG 1728 DATED 6 MAY 1946 CONT'D:]\n\nPresent arrangements seriously impede the encouragement of Korean participation in world trade and the complete separation of Korea from economic dependence upon Japan. In order to achieve these objectives most effectively, the following recommendations are submitted for your consideration:\n\nA. That parts 2 and 3 (economic and civilian supply and financial, pages 54 to 68 inclusive) of SWNCC 176/8, basic initial directive for civil affairs in Korea, be rescinded as portion of the directive to COMINCH AFPAC, and be re-issued as separate directive to CG USAFIK.\n\nB. That direct communication between this headquarters and War Dept be authorized with respect to subjects covered in parts 2 and 3 of SWNCC 176/8.\n\nC. That in accordance with paragraph 33 of SWNCC 176/8, further instructions concerned general rate of exchange for Korea be promulgated earliest. Procedures outlined in part 2 above do not require the announcement of general exchange rate but might be facilitated by establishment of such rate when conditions warrant. Experience derived from following these procedures will provide contacts and market outlets which will be valuable to Korea when normal trade can be accomplished.\n\nD. That representative of United States Commercial Company be sent immediately to this headquarters to assist in negotiating for the sale of available Korean export commodities marketable in the United States.\n\nThe above recommendations have received unqualified concurrence from Military Governor.\n\nNo Sig ACTION: ECON & SCI SEC INFORMATION: COMMANDER-in-CHIEF, CHIEF OF STAFF, G-4, AG, C GOVT SEC, DIPLOMATIC SEC NOTE: This message has not been passed to WARCOS.\n\n22010    ROUTINE / TOP SECRET    TOO: 061520 Z    MCN: TJC 89/6", "notes": ["[도장·결재] 0134 우측 고무인 : 'GHQ AFPAC / AGO RECORDS'; 그 위 손글씨 '014.1 Korea TS-3'", "[도장·결재] 0134 우측 손글씨 편철 지시 : 'X 091 Korea', 'X 091.3 Korea', 'X 0[91].3 [Korea]' — 다른 문서철로의 상호참조. 마지막 항목 위에 서명 겹침, 일부 판독불가", "[도장·결재] 0134 본문 옆 손글씨 세로선 및 'SWNCC 176/8' 부분 잉크 밑줄", "[도장·결재] 0134 하단 우측 고무인 : 'A. G. FILE'", "[도장·결재] 0134 하단 우측 : 'COPY NO. 19'", "[도장·결재] 0134 좌측 하단 손글씨 이니셜 [판독불가]", "[도장·결재] 0134·0135 좌측 하단 연필 편철기호 : '1-U'", "[도장·결재] 0135 본문 위 주기(타자) : 'NOTE: This message has not been passed to WARCOS.' — 이 전문이 육군부로 넘어가지 않았다는 기록", "[도장·결재] 0134·0135 겹쳐 찍힌 고무인 : 'TOP SECRET', 'ROUTINE'", "[도장·결재] 상단 여백 : 'Declassified E.O. 12065 Section 3/402/ NNDG NO. 775041[?]' — 번호 일부 판독불가"], "note": "번역자 주 — 전문 접두어 판독 : 원본 스캔 pages/0134.jpg 및 0135.jpg 를 직접 확인한 결과 두 면 모두 **'TFYMG 1728'** — 세 번째 글자는 명백히 Y 다. 'TFGMG' 가 아니다. (같은 문서철의 다른 전문에는 'TFGCG' 접두어가 쓰이므로 혼동하기 쉽다.)\n\n원저자의 오류는 고치지 않았다 : (1) 'SWNCC 176/8 dated 13 October 1946' — SWNCC 176/8 은 1945년 10월 13일자이므로 연도가 원문 오기다. 한국어 본문에서는 1945년으로 옮기고 이 사실을 여기 적어 둔다. (2) 'excercise'(exercise). (3) 1면 머리의 날짜는 '7 May 1946'인데 2면 머리는 같은 전문을 'DATED 6 MAY 1946'이라 적고 있다 — 발신시각군(061520 Z)은 6일이므로 발신 6일·접수 7일로 보인다. 원문 표기를 모두 살렸고 date 는 색인과 1면 머리를 따라 1946-05-07 로 두었다.\n\n'USAMGIK' 은 주한미군정청(재조선미육군사령부군정청)이다. OCR 에 'USAGIK'로 나온 곳이 있으나 원본에서는 모두 USAMGIK 이다. 'bottoms'는 해운 용어로 선복(船腹)·선박을 뜻한다. 'COMINCH AFPAC'는 원문 표기 그대로 두었다(태평양미육군총사령관).", "warn": false, "pages": ["0134", "0135"], "search": "1-U TFYMG 1728 - Elimination of Jap control of Korean econ life."}, {"id": "1-S", "order": 119, "date": "1946-01-27", "group": "D", "eyebrow": "편철 1-S · 0136–0136면", "title": "라우팅 슬립 (전표 자체에는 건명이 타자되어 있지 않다). 색인 항목: SWNCC 176/8(조선 민사에 관한 기본 초기지령)을 개정하는 결정을 송부한 서한", "badge": "Top Secret", "list_right": "1-S", "meta": [{"k": "일자", "v": "1946-01-27"}, {"k": "발신", "v": "부관부(A.G.), 연합국최고사령관 겸 태평양미육군총사령부 전진제대", "txt": true}, {"k": "수신", "v": "총사령관 (1), 참모장 (2)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "라우팅 슬립"}, {"k": "면", "v": "0136–0136 (1면)"}, {"k": "건명", "v": "Routing slip (no subject typed on the sheet). Index entry: Letter, decision amending SWNCC 176/8 — basic initial directive for civi ": "태평양미육군총사령관(CINCAFPAC), 일본 도쿄", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "OPD 914.1 TS (3 Dec 45) · AG 014.1 (14 Dec 45)GS · AG 014.1 - SX · AG 014.1 (14 Dec 45)AG"}, {"k": "종류", "v": "각서"}, {"k": "면", "v": "0138–0141 (4면)"}, {"k": "건명", "v": "Basic Initial Directive for Civil Affairs in Korea — Corrigendum to SWNCC 176/8", "txt": true}, {"k": "색인 요지", "v": "Memo-Basic initial Directive for Civil Affaris in Korea. (SWNCC 176/8).", "txt": true, "wide": true}], "summary": "육군부 작전국이 「조선 민사에 관한 기본 초기 지령」(SWNCC 176/8)의 정오표 6부를 태평양미육군총사령관에게 참고용으로 송부한 각서와, 총사령부가 이를 예하 5개 사령부에 배포한 12월 14일자 서한 및 극동공군의 미수령 회신(1st Ind.)·총사령부의 조사 요구(2nd Ind.)를 함께 편철한 묶음.", "points": ["육군부 작전국이 SWNCC 176/8 정오표(Corrigendum) 6부(사본번호 61~66)를 태평양미육군총사령관에게 참고용으로 송부했다.", "그 지령 자체는 1945년 10월 17일자 각서(문서철 OPD 014.1 TS (17 Oct 45))로 이미 송부되어 있었다.", "총사령부는 1945년 12월 14일자 서한으로 정오표 1부씩을 제6군·제8군·극동공군·서태평양미육군·제24군단 다섯 사령부에 배포했다.", "정오표의 원자료 날짜는 1945년 11월 29일이며, 지령 본체는 1945년 11월 1일자 서한(AG 014.1(1 Nov 45)GS)으로 각 사령부에 보내진 바 있다.", "사본 배분: 제6군 61, 제8군 62, 극동공군 63, 서태평양미육군 64, 제24군단 65, 부관부 기록과 66. 첨부물 사본과 부본은 정부부(Govt Section)로도 갔다.", "1st Ind.(1946년 1월 2일, 태평양항공사령부): 기본 서한 제2항에 인용된 지령을 본 사령부는 수령하지 못했다.", "2nd Ind.(1946년 1월 5일, 총사령부 SCAP): 본 총사령부 기록상 그 지령은 1945년 11월 3일 극동공군 사령관에게 수령증 제174호로 송부되었고, 항공대 소위 로버트 E. 포스턴 2세(수령 담당 부관 대리)가 서명하고 받아 갔다.", "2nd Ind. 제2항: 문서가 귀 사령부에서 소재를 찾을 수 있는지 조사하여 본 총사령부에 보고할 것을 요구한다.", "0140면에는 취소선이 그어진 메모가 있다 — 1946년 1월 6일 정부부에 참고 송부, '이 사무실 기록상 기본 서한 제2항의 문서는 극동공군 배포센터(APO 925)가 151020/I에 제6호 항목으로 수령'."], "primary": "**[0138면 — 육군부 작전국 각서]**\n\n육군부\n육군부 참모본부 작전국\n워싱턴 25, D.C.\n\nOPD 914.1 TS (3 Dec 45)   1945년 12월 3일\n\n태평양미육군총사령관(일본 도쿄) 앞 각서:\n\n건명: 조선 민사에 관한 기본 초기 지령(Basic Initial Directive for Civil Affairs in Korea)\n\n1945년 10월 17일 각서로 귀관에게 송부된 바 있는 SWNCC 176/8 정오표(Corrigendum) 6부를 참고용으로 이에 첨부한다(문서철: OPD 014.1 TS (17 Oct 45)).\n\nJ. E. 헐(J. E. HULL)\n중장, 참모본부부\n작전국 참모차장\n\n[서명] 휴 소여(HUGH SAWYER)\n중령, 참모본부부\n전략·정책단 부실무장교\n\n첨부 1건\n  SWNCC 176/8 정오표, 사본번호 61~66\n\n**[0139면 — 총사령부 전달 서한]**\n\n총사령부\n연합국최고사령관\n\nAG 014.1 (14 Dec 45) GS   군사우편번호 500 · 1945년 12월 14일\n\n건명: 조선 민사에 관한 기본 초기 지령(SWNCC 176/8)\n\n수신:\n  제6군 사령관, APO 442\n  제8군 사령관, APO 343\n  극동공군 사령관, APO 925\n  서태평양미육군 사령관, APO 707\n  제24군단장, APO 235\n\n1. 1945년 11월 29일자 「조선 민사에 관한 기본 초기 지령」(SWNCC 176/8)의 정오표 1부를 참고용으로 이에 송부한다.\n\n2. 본 건 지령은 1945년 11월 1일자 본 총사령부 문서철 AG 014.1(1 Nov 45)GS 서한으로 위와 같은 건명으로 귀 사령부에 이미 송부되었다.\n\n연합국최고사령관을 대리하여:\n\n해럴드 페어(HAROLD FAIR)\n중령, 부관부\n부관 대리\n\n첨부 1건: 위에 적은 대로\n\n[손글씨] 사본 배분: 제6군 사령관 — 사본번호 61 / 제8군 사령관 — 62 / 극동공군 사령관 — 63 / 서태평양미육군 사령관 — 64 / 제24군단장 — 65 / 부관부 기록과 — 66. 첨부물 사본 및 부본은 정부부(Govt Section)로.\n\n**[0140면 — 제1차 배서(1st Ind.)]**\n\n기본 문서: 1945년 12월 14일자 총사령부(SCAP) 서한, 문서철 AG 014.1 (14 Dec 45)GS, 극동공군 사령관(APO 925) 앞, 건명 「조선 민사에 관한 기본 초기 지령(SWNCC 176/8)」.\n\nAG 014.1 - SX   제1차 배서\n\n태평양항공사령부 사령부, 미육군, APO 925.   1946년 1월 2일\n\n수신: 연합국최고사령관, APO 500\n\n제2항에 인용된 본 건 지령은 본 사령부에서 수령되지 않았음.\n\n사령관을 대리하여:\n\n[서명] G. W. 맥글러핸(G. W. McGLUGHAN)\n소령, 부관부\n부관 대리\n\n[취소선이 그어진 메모] 1946년 1월 6일. 다음 쪽지를 붙여 정부부에 참고로 보냄: 「이 사무실 기록상 기본 서한 제2항에 인용된 항목은 극동공군 배포센터(APO 925)가 151020/I에 제6호 항목으로 수령하였음. 봉투 [판독불가]」\n\n**[0141면 — 제2차 배서(2nd Ind.)]**\n\n기본 문서: 1945년 12월 14일자 총사령부(SCAP) 서한, 문서철 AG 014.1 (14 Dec 45)GS, 건명 「조선 민사에 관한 기본 초기 지령(SWNCC 176/8)」.\n\nAG 014.1 (14 Dec 45)AG   제2차 배서\n\n총사령부, 연합국최고사령관, APO 500.   1946년 1월 5일\n\n수신: 태평양항공사령부 사령관, 미육군, APO 925\n\n1. 본 총사령부의 기록에 따르면 기본 서한 제2항에 특정된 지령은 1945년 11월 3일 극동공군 사령관에게 수령증 제174호로 송부되었다. 그 문서는 항공대 소위 로버트 E. 포스턴 2세(Robert E. Poston, Jr.), 부관 대리가 서명하고 수령하였다.\n\n2. 그 문서를 귀 사령부에서 찾을 수 있는지 여부를 조사하여 본 총사령부에 보고할 것을 요구한다.\n\n맥아더 장군의 명에 따라:\n\n해럴드 페어(HAROLD FAIR)\n중령, 부관부\n부관 대리\n\n첨부 1건: 없음(n/c)", "secondary": "[0138]\nTOP SECRET\nBY AUTHORITY OF A.C. OF S., OPD  3 DEC 1945\n\nWAR DEPARTMENT\nWAR DEPARTMENT GENERAL STAFF\nOPERATIONS DIVISION\nWASHINGTON 25, D. C.\n\nOPD 914.1 TS (3 Dec 45)                3 December 1945 MEMORANDUM FOR THE COMMANDER IN CHIEF, U. S. ARMY FORCES, PACIFIC, TOKYO, JAPAN:\n\nSUBJECT: Basic Initial Directive for Civil Affairs in Korea Furnished herewith for information are six (6) copies of Corrigendum to SWNCC 176/8 which was forwarded to you by memo on 17 October 1945 (File: OPD 014.1 TS (17 Oct 45)).\n\nJ. E. HULL\nLieutenant General, GSC Assistant Chief of Staff, OPD\n/s/ HUGH SAWYER\nHUGH SAWYER\nLt Colonel, GSC Assistant Exec. Officer Strategy & Policy Group 1 Incl Corrigendum to SWNCC 176/8, Cys No. 61 thru 66\n\n[0139]\nTOP SECRET\nGENERAL HEADQUARTERS\nSUPREME COMMANDER FOR THE ALLIED POWERS\n\nAG 014.1 (14 Dec 45) GS            APO 500 14 December 1945\n\nSUBJECT: Basic Initial Directive for Civil Affairs in Korea. (SWNCC 176/8).\n\nTO: Commanding General, Sixth Army, APO 442.\nCommanding General, Eighth Army, APO 343.\nCommanding General, Far East Air Forces, APO 925. Commanding General, United States Army Forces, Western Pacific, APO 707. Commanding General, XXIV Corps, APO 235.\n\n1. Transmitted herewith for your information, one (1) copy of Corrigendum to \"Basic Initial Directive for Civil Affairs in Korea\", SWNCC 176/8, dated 29 November 1945.\n\n2. Subject directive forwarded your headquarters by letter, this Headquarters, file AG 014.1(1 Nov 45)GS, dated 1 November 1945, subject as above.\n\nFOR THE SUPREME COMMANDER:\n\nHAROLD FAIR, Lt. Col., A.G.D., Asst. Adjutant General.\n\n1 Incl:\nAs indicated above.\n\nMAILED 2040 DEC 14 '45  ADV. ECH. AG. - GHQ.\n\n[handwritten] Cys to: CG, 6th Army — Copy No 61 / CG, 8th Army — \" \" 62 / CG, FEAF — \" \" 63 / CG, AFWESPAC — \" \" 64 / CG, XXIV Corps — \" \" 65 / AG Records — \" \" 66. Copy of Incl & cc:.des to Govt Section\n\n[0140]\nTOP SECRET\nBASIC: Ltr, GHQ, SCAP, dtd 14 December 1945, file AG 014.1 (14 Dec 45)GS, to Commanding General, FEAF, APO 925, [struck out] subj: \"Basic Initial Directive for Civil Affairs in Korea. (SWNCC 176/8).\"\n\nAG 014.1 - SX                   1st Ind.\n\nHEADQUARTERS, PACIFIC AIR COMMAND, U. S. ARMY, APO 925.    2 Jan 1946.\n\nTO: Supreme Commander for the Allied Powers, APO 500.\n\nSubject directive quoted in paragraph 2, not received at this headquarters.\n\nFOR THE COMMANDING GENERAL:\n\n/s/ G. W. McGlughan\nG. W. McGLUGHAN Major, AGD, Asst. Adj. General.\n\n[struck-out note] NOTE: 6 Jan 46. Sent Govt Sec for info w/note: \"Records in this office indicate that item quoted in par. 2, basic was received by Distribution Center FEAF, APO 925 at 151020/I, as item No. 6. Envelope [illegible]\"\n\n[0141]\nTOP SECRET\nBASIC: Ltr, GHQ, SCAP, file AG 014.1 (14 Dec 45)GS, dtd 14 Dec 45, subject: \"Basic Initial Directive for Civil Affairs in Korea (SWNCC 176/8)\".\n\nAG 014.1 (14 Dec 45)AG          2nd Ind.\n\nGENERAL HEADQUARTERS, SUPREME COMMANDER FOR THE ALLIED POWERS, APO 500.   5 January 1946.\n\nTO: Commanding General, Pacific Air Command, United States Army, APO 925.\n\n1. Records of this headquarters indicate that directive identified in paragraph 2, basic letter, was forwarded to Commanding General, Far East Air Forces on 3 November 1945 as receipt No. 174. Document was signed for by Robert E. Poston, Jr., 2nd Lt., Air Corps, Acting Asst Adjutant General.\n\n2. Request investigation and report to this headquarters as to whether or not document can be located at your command.\n\nBy command of General MacARTHUR:\n\nHAROLD FAIR, Lt. Colonel, AGD., Asst Adjutant General.\n\n1 Incl:\nn/c.\n\nMAILED 1720 JAN 5 '46  ADV. ECH. AG. - GHQ.", "notes": ["[도장·결재] 0138면 우상단 고무인: 「TOP SECRET / BY AUTHORITY OF A.C. OF S., OPD / 3 DEC 1945 / Date · Initials」 — 작전국 참모차장 권한에 의한 등급 표시, 이니셜 손글씨(판독불가)", "[도장·결재] 0138면 고무인(세로): 「GHQ / AGO RECORDS / 16 DEC 1945」, 옆에 손글씨 '014.1 Korea'", "[도장·결재] 0138면 우측 세로 고무인: 'AG RECORDS COPY', 하단 중앙 'TOP SECRET' 고무인, 좌하단에 전시공채 광고 인쇄('FOR VICTORY BUY UNITED STATES WAR BONDS AND STAMPS')", "[도장·결재] 0138면 좌하단 연필 정리기호: '1-R'(첫 글자가 'ㅋ'처럼 흘려 써져 있음)", "[도장·결재] 0139면 우측 세로 고무인: 'AG RECORDS COPY', 하단 'TOP SECRET' 고무인", "[도장·결재] 0139면 발송 고무인: 「MAILED 2040 DEC 14 '45 / ADV. ECH. AG. - GHQ.
