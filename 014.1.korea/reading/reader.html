공개 성명에서는 국제연합 헌장 제1조 제2항이 인용될 것인바, 그 조항은 다음과 같음. \"사람들의 평등권 및 자결의 원칙에 대한 존중에 기초하여 국가 간의 우호 관계를 발전시키며, 보편적 평화를 강화하기 위한 그 밖의 적절한 조치를 취한다.\"\"\n\n서명 없음(NO SIG)\n\n[비고] 이 전문은 신호소(Signal Center)로 넘겨져 주한미군사령관(CG USAFIK)에게 조치용으로 재발송됨.\n\n[배포] 총사령관(COMMANDER IN CHIEF) / 참모장(CHIEF OF STAFF) / 정부과장(C GOVT SECT) / 정치고문(POLITICAL ADVISOR) / 부관부(AG)", "secondary": "The following reply to your CA 57792, received from the State, War and Navy Departments is furnished for your information and guidance.\n\n\"Decision of General Hodge to instruct the American Delegation to press for agreement on freedom of speech, press and travel within Korea of Koreans at the beginning of the forthcoming proceedings of the Joint Commission approved here. Should Soviets not agree initially to such action, rather than forcing an adjournment of The Commission, Hodge should (1) Reserve his position in respect to freedom of speech, press and travel for final decision prior to the time the Interim Government begins to function, (2) Press for initial agreement on travel by members of Commission and their Staff throughout Korea to consult with Korean Democratic Parties and Social Organizations, and (3) Then proceed with consideration of the structure of an Interim Government.\n\nAmbassador Harriman has recommended here, and the State Department concurs, that nothing would be gained by taking up such matters as the question of freedom of speech, press and travel on a Governmental level prior to the discussion of these topics in the Commission.\n\nIt is suggested that in order not to prejudice the effectiveness of the work of the Joint Commission, and at the same time to accomplish Hodges purpose should the Soviet Representatives in the Commission prove obstructionist and refuse to agree to his demands under (1) or (2) above, you may wish to consider the desirability of requesting your Government to make public a statement citing your attempts to encourage freedom of speech, press and travel. In such a public statement, reference would be made to para 2, article 1 of the charter of the United Nations which reads: \"To develop friendly relations among Nations based on respect for the principle of equal rights and self-determination of peoples, and to take other appropriate measures to strengthen Universal peace\".\"\n\nNO SIG\n\nNOTE: This msg has been passed to Signal Center for re-dispatch to CG USAFIK for ACTION.\n\nCOMMANDER IN CHIEF\nCHIEF OF STAFF\nC GOVT SECT\nPOLITICAL ADVISOR\nAG\n\nTOO: 010027 Z\nMCN: SB-36/01", "notes": ["[도장·결재] 0034 우측 상단 접수 도장 — 'GHQ AFPAC AGO RECORDS', 그 안 손글씨 '014.1 Korea (TS)'", "[도장·결재] 0034 전문번호 옆 손글씨 '014.1 Korea (TS)'", "[도장·결재] 0034 본문 손글씨 밑줄 — 'CA 57792'", "[도장·결재] 0034 좌하단 타자 'E. B. 69034' · 하단 'A. G. FILE' 도장 · 'NO SIG' 타자 · 'COPY NO.'(번호 판독불가, 손글씨 겹침)", "[도장·결재] 0035 좌하단 타자 '69034' · 하단 'COPY NO.'(번호 미기재)", "[도장·결재] 두 면 상하단 'TOP SECRET' 도장 · 'PRIORITY' 타자", "[도장·결재] 두 면 하단 인쇄 문구 'THE MAKING OF AN EXACT COPY OF THIS MESSAGE IS FORBIDDEN'", "[도장·결재] 두 면 좌하단 연필 편철기호 '7-H'", "편철 메모 — 0035 는 'NR W 98882 CONT'D' 로 읽히나 동일 전문의 2면이며 연필 '7-H'"], "note": "번역자 주 — 원문 오타를 고치지 않았다 — 'Hodges purpose'(소유격 아포스트로피 없음). 0035면의 전문번호는 원본 이미지에 'W 98881 CONT'D'로 명확하며(문서 목록의 'W 98882' 주석은 OCR 오독이다), 본문은 없고 배포처·비고·발신 제원만 있는 2면이다. 인용문 안에 다시 인용부호가 들어가 원문에서도 따옴표가 겹친다.", "warn": false, "pages": ["0034", "0035"], "search": "하지(John R. Hodge) — 주한미군사령관 해리먼(W. Averell Harriman) — 주소련 미국대사 맥아더(Douglas MacArthur) — 수신 명의 7-H W 98881 - Reply to CA 57792 for your info & guidance."}, {"id": "7-G", "order": 707, "date": "1946-02-20", "group": "B", "eyebrow": "편철 7-G · 0036–0036면", "title": "TFGCG 285 관련 — 귀관이 취한 조치를 승인함", "badge": "Top Secret", "list_right": "7-G", "meta": [{"k": "일자", "v": "1946-02-20"}, {"k": "발신", "v": "워싱턴(WASHINGTON) — 서명 WARCOS 육군참모총장", "txt": true}, {"k": "수신", "v": "태평양미육군총사령관(CINCAFPAC), 주한미군사령관(CG USAFIK)에게 전달할 것", "txt": true}, {"k": "참조", "v": "총사령관(Commander in Chief), 참모장(Chief of Staff), G-2, 부관부(AG), 민정부(C Govt Sect), 정치고문(Political Advisor)", "txt": true}, {"k": "전문번호", "v": "W 97763"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0036–0036 (1면)"}, {"k": "건명", "v": "Ref TFGCG 285 — Steps taken by you are approved", "txt": true}, {"k": "색인 요지", "v": "W 97763 - Steps taken by you re TFGCG 285 are approved.", "txt": true, "wide": true}], "summary": "육군부는 하지의 TFGCG 285(SWNCC 176/18 소견)에 대해 그가 취한 조치를 승인하고, 이승만·김구는 SWNCC 176/18이 말하는 좌우 극단주의자로 보지 않아도 좋다고 하며, 모스크바 코뮈니케의 '임시정부(Provisional Government)' 표현은 소련 정부에 변경을 요청하지 않기로 결정했다고 통보한다.", "points": ["하지가 TFGCG 285에서 보고한 조치를 워싱턴이 승인한다.", "이승만과 김구가 공산주의자를 포함한 모든 정당에게 받아들여지고 있다고 하지가 보고했으므로, SWNCC 176/18 규정상 이들을 좌우 어느 쪽의 극단주의자로도 보지 않을 수 있다.", "해당 규정의 취지는 어느 한 정당도 자기 이익만 추구하지 못하게 하려는 것이었다.", "'임시정부(Provisional Government)'라는 낱말이 모스크바 코뮈니케와 김구 집단 양쪽에 쓰이면서 생긴 혼선이 워싱턴에서도 상당히 논의되었다.", "코뮈니케 문언을 바꾸자고 소련 정부에 접근하지 않기로 결정했다.", "표현이 비슷한 것이 오히려 미측 교섭 지위에 해가 되지 않고 도움이 될 수도 있다는 것이 워싱턴의 판단이다.", "하지의 TFGCI 190은 소련이 교섭용으로 '중앙임시정부(Central Provisional Government)'를 세우려 하고 있음을 보여준다고 지적한다."], "primary": "TFGCG 285 참조. 귀관이 취한 조치를 승인한다.\n\n이승만(Symgman Rhee)과 김구(Kim Koo)가 공산주의자를 포함한 모든 정당에게 받아들여지고 있다고 귀관이 알려 왔으므로, 그들은 SWNCC 176/18의 규정상 우파에서든 좌파에서든 극단주의자가 아닌 것으로 [TGXOE — 판독불가] 또는 귀관이 그렇게 간주해도 좋다. 그 규정의 목적은 어느 한 정당도 자기의 이기적 이익을 밀고 나가도록 허용되지 않게 하려는 데 있었다.\n\n'임시정부(Provisional Government)'라는 낱말이 모스크바 코뮈니케와 김구의 집단 양쪽에 관련해 쓰이면서 생긴 혼란이 이곳에서도 상당히 논의되었다. 코뮈니케의 문언을 바꾸도록 소련 정부에 접근하지는 않기로 결정되었다. 표현이 비슷한 것이 귀관의 교섭 지위를 해치지 않을 것이며 오히려 개선할 수도 있다고 이곳에서는 보고 있다. 소련이 교섭 목적으로 '중앙임시정부(Central Provisional Government)'를 세우려 하고 있음을 보여주는 귀관의 TFGCI 190을 보라.", "secondary": "Ref TFGCG 285. Steps taken by you are approved.\n\nSince you have indicated that Symgman Rhee and Kim Koo, are accepted by all Parties including the Communists, they may TGXOE or be considered by you as not being extremists either on the right or left under the provisions of SWNCC 176/18. The purpose of the provision was to assure that no single party was allowed to further its own selfish interests.\n\nThere has been considerable discussion here of confusion arising from use of words \"Provisional Government\" in connection with both Moscow communique and Kim Koo's Group. It has been decided not to approach Soviet Government to change terms of communique. It is believed here that similarity of expressions will not hurt your bargaining position and may even improve it. See your TFGCI 190 which indicates that Soviets are attempting to establish a \"Central Provisional Government\" for bargaining purposes.\n\nWARCOS", "notes": ["[도장·결재] 접수 도장: GHQ AFPAC AGO RECORDS (월 표기는 잉크가 뭉개져 판독 어려움, 'MAR 1946'으로 읽힘)", "[도장·결재] 도장 위 손글씨: '014.1 Korea T.S. Scap'", "[도장·결재] 여백 손글씨 회부 표시: 'x 09/Korea', 'X 091.4', 'X 092' — 각 항목에 사선(회부 완료 표시)", "[도장·결재] 전문 번호 옆 손글씨: '014.1 Korea T.S. Scap' + 이니셜(판독불가)", "[도장·결재] 도장: A. G. FILE", "[도장·결재] 우하단 손글씨/타자: COPY NO 25", "[도장·결재] 타자 이니셜: 'E. B.' (2회)", "[도장·결재] 타자 회부 기재: '이 전문은 신호센터로 넘겨져 CG USAFIK 앞으로 재발송되었음 — 조치용(for action)'", "[도장·결재] 좌하단 연필 일련번호: 7-G"], "note": "번역자 주 — 1) 'they may TGXOE or be considered by you' 의 TGXOE 는 전신 수신 상의 오문(garble)으로 보인다. 원문에 그대로 남아 있어 고치지 않고 두었다. 2) 'Symgman Rhee' 는 원본 타자수의 오타다(통상 Syngman Rhee). 그대로 두었다. 3) 'TFGCI 190' 은 원본에 그대로 찍혀 있다 — 다른 전문의 접두어 TFGCG 와 다르나 숫자열·부호는 바로잡지 않았다. 4) 접수 도장의 월 표기가 '20 FEB 1946' 타자 접수일과 어긋나 보이나(MAR 로 읽힘) 잉크가 겹쳐 확실치 않아 판독한 대로 두었다.", "warn": false, "pages": ["0036"], "search": "이승만(Symgman Rhee — 원문 타자 표기. 통상 Syngman Rhee) 김구(Kim Koo) 7-G W 97763 - Steps taken by you re TFGCG 285 are approved."}, {"id": "7-F", "order": 706, "date": "1946-02-24", "group": "B", "eyebrow": "편철 7-F · 0037–0040면", "title": "조선의 최근 정치 정세", "badge": "Top Secret", "list_right": "7-F", "meta": [{"k": "일자", "v": "1946-02-24"}, {"k": "발신", "v": "주한미군사령관(CG USAFIK) 하지(HODGE)", "txt": true}, {"k": "수신", "v": "연합국최고사령관(SCAP) 맥아더 대장(GENERAL MACARTHUR)", "txt": true}, {"k": "참조", "v": "총사령관(Commander-in-Chief), 참모장(Chief of Staff), 부관부(AG), 민정부(C Govt Sect) — 배포처(DISTRIBUTION)", "txt": true}, {"k": "전문번호", "v": "TFGCG 302"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0037–0040 (4면) · 사본 2면"}, {"k": "건명", "v": "Recent Political Developments of Korea", "txt": true}, {"k": "색인 요지", "v": "TFGCG 302-Recent Political developments of Korea.", "txt": true, "wide": true}], "summary": "미소공동위원회를 앞둔 1946년 2월, 하지가 남조선 정계의 판도 변화 — 남조선대한국민대표민주의원 결성, 민주주의민족전선 결성, 2월 12일 북조선 중앙정부 수립 발표, 여운형의 좌경화 — 를 보고하고, 이 모든 것을 소련이 조선 임시정부를 공산주의자 손에 넣으려는 기획으로 규정하면서 일본인 재산 처리에 관한 미국의 확정 방침을 시급히 내려 달라고 요청하는 정세 보고 전문.", "points": ["1월 초부터 1월 말 모스크바 회의 세목에 관한 타스(Tass) 발표가 나오기까지 남조선의 공산주의 세력은 쇠퇴 중이었다.", "타스 발표와 소련 대표단의 경성 체류가 공산주의자들을 다소 강경하게 만들었으나, 한편으로는 공산주의자와 인민당 좌파를 부분적으로 갈라놓은 것으로 보인다.", "2월 초에 열린 비상국민회의(National Emergency Congress)에는 정식으로 공산주의자를 표방한 자들을 제외한 모든 세력이 대표를 보냈다. 공산주의자는 늘 그렇듯 자기 통제 아래 있지 않은 상대와의 협의를 거부했다.", "비상국민회의에서 주요 세력을 대표하는 협의체가 선출되었고, 2월 14일 그 첫 회합이 '남조선대한국민대표민주의원(Korean Representative Democratic Council of South Korea)'이라는 이름으로 열렸다. 주요 연사로 연설을 준비했던 인민당 지도자 여운형은 결석했다.", "이후 인민당은 민주의원 탈퇴를 발표했고, 인민당원 1명은 자신은 공산주의자가 아니라고 밝히며 민주의원을 공격했다.", "민주의원 제1차 공식 회합 다음 날, 공산주의자들은 공산당·인민당과 농민조합·노동조합·인민공화국 위원회 등 공산주의 통제하의 여러 단체를 모아 '민주주의민족전선(Democratic Peoples Front)' 대회를 열고, 민주의원을 파시스트·일본 부역자·비민주적·'인민 대중'에 대한 반역자로 규탄했다.", "2월 12일 소련은 북조선의 전 조선 중앙정부 수립을 완결했다고 발표했다. 그 정부와 국가평의회의 명단을 북조선에서 피난해 온 사정에 밝은 온건파들에게 검토시킨 결과, 명단은 전부 격렬한 공산주의자이거나 러시아·만주에서 데려온 무명의 조선인이라는 답이 나왔다.", "발표된 참가 정당은 민주당·연안·독립동맹·공산당이며, 민주당 소속으로 올라온 이름들은 북에서 민주 진영 지도자들을 갈아치우려고 소련이 지명한 공산주의 앞잡이(stooges)로 알려져 있다.", "연안독립동맹은 소련 통제 아래 훈련되고 활동하는 중국-만주-조선 공산주의 집단이며, 조선공산당은 완전히 소련의 통제 아래 있다.", "전날 현지 공산계 신문은 이제 북조선에 '인민' 정부가 서고 남조선에 '민주 전선'이 완성되었으니 조선 임시정부 문제는 그 둘을 단순히 합치기만 하면 된다고 발표했다 — 하지는 이를 결정적 증거로 본다.", "인민당은 새 정부 자리를 확실히 약속받고 소련이 지휘하는 공산주의자들에게 완전히 넘어갔다.", "2월 6일 남부 어느 도(道)의 공산주의자 집회에서 여운형이 주요 연사로 나서 자신이 진정한 공산주의자임을 공언하고, 미군과 군정을 깎아내리는 공작 방법을 길게 논했다는 정보가 신뢰할 만한 정보원에게서 방금 들어왔다 — 여운형이 완전한 공산주의자라는 첫 확증이다.", "처음부터 남조선의 공산주의자가 전체를 완전히 공산주의 통제 아래 두지 않는 한 어떤 집단과도 어떤 주제로든 손잡으리라는 실질적 희망의 징후는 없었다.", "북에서 크게 선전하는 새 정책에는 'Japs'와 조선인 양쪽의 토지 및 대규모 재산을 무상 몰수해 대중에게 무상 분배하는 것이 포함되어 있고(여러 보고에 따르면 이미 실행됨), 이는 다수의 빈궁한 조선인 농민·최근 귀환자·실업자의 마음에 가장 가까이 와닿는 사안이다.", "이와 관련하여 일본인 재산 처리에 관해 확정 방침을 발표하지 못하는 하지의 처지가 날로 더 큰 장애가 되고 있고, 목청 높은 공산주의자들의 공격 근거가 되고 있다.", "현재 만주에서의 공산주의 활동은 정치적 침투를 통해 동양 이 지역 전체를 지금 총력으로 장악하려는 구상과 잘 맞물린다.", "소련은 3개 정당의 이름으로 공산주의자를 위장하여 북조선용 집단을 세워 놓았다.", "공산주의자들은 '민주'를 표방하는 여러 단체를 그러모아 발언권을 주장하게 하고 있고, 우파와 중간파는 유력한 지도자들 아래 크게 결집했다.", "북조선에 대한 정보 차단(blackout)이 최근 크게 강화되었고, 공산주의자의 비자 없이 남에서 넘어간 여행자는 미국 스파이로 체포되고 있다.", "소련은 북조선의 민주적 대표로 자기들의 정부를 미국에 받아들이게 강요하는 한편, 남조선에서도 충분한 공산주의 대표를 내주게 만들어 조선 임시정부를 공산주의자 통제로 넘기려 할 것이 틀림없다.", "당분간 하지는 민주의원의 위신을 유지하고, 조선 민중의 전면적 지지를 얻으며, 공산주의자의 신용을 떨어뜨리는 데 온 힘을 쏟을 계획이다.", "그렇게 하면 미국의 진보·좌경 언론(liberal and pink press)이 자기 목을 조일 것이나, 지금 다른 현지 조치를 취하는 것은 치명적이라고 본다.", "한 걸음 전진의 방책으로, 남조선 내 일본인 재산의 최종 처리에 관한 미국 방침의 명확한 성명과 그것을 집행할 권한을 얻어내도록 압력을 넣어 달라고 긴급히 건의한다."], "primary": "건명은 조선의 최근 정치 정세다.\n\n1월 초부터 1월 말경 모스크바 회의 세목에 관한 타스(Tass)의 발표가 있기까지, 남조선의 공산주의는 쇠퇴하고 있었다. 타스 발표와 이곳 소련 대표단의 체류는 공산주의자들을 다소 굳어지게 했으나, 한편으로는 공산주의자를 인민당 좌파로부터 부분적으로 떼어놓은 것으로 보였다. 2월 초에 시작된 비상국민회의(National Emergency Congress)에는, 늘 그렇듯 자기들 통제 아래 있지 않은 어느 누구와도 협의하기를 거부한 정식으로 공표된 공산주의자들을 제외하고는 모든 곳에서 대표가 모였다. 이 비상회의의 결과로 (인민당을 포함하여) 주요 집단 전부를 대표하는 협의체가 선출되었다 조선공산당. 남조선대한국민대표민주의원(Korean Representative Democratic Council of South Korea)이라 불리는 이 선출된 협의체의 2월 14일 제1차 회합에서, 주요 연사로 연설을 준비했던 인민당 지도자 여운형(Lyah, Woon Heung)은 결석했으나 다른 대표들은 참석했다. 그 뒤 인민당은 협의체 탈퇴를 발표했다. 인민당원 한 명은 자신은 공산주의자가 아니라고 밝히면서 협의체를 공격했다. 그 다음 날 협의체의 제1차 공식 회합이 있었고, 공산주의자들은 공산당, 인민당, 그리고 농민조합·노동조합·인민공화국 위원회 등 공산주의자 통제하의 여러 다른 요소들과 함께 자기들의 '민주주의민족전선(Democratic Peoples Front)' 대회를 시작하여, 민주의원을 파시스트요 일본인 부역자(Jap collaborators)요 비민주적이며 '인민 대중(Masses of the Peoples)'에 대한 반역자라고 규탄했다.\n\n2월 12일 소련은 북조선의 완결된 전 조선 중앙정부를 발표했다. 그 정부와 국가평의회(State Council)의 명단은 지금 북조선에서 피난해 온 사정에 밝은 온건파들에 의해 이곳에서 검토되었다. 그들이 밝힌 바로는 모든 이름이 격렬한 공산주의자이거나 러시아 또는 만주에서 데려온 알려지지 않은 조선인이다. 발표된 대표 정당 명단은 민주당(Democratic), 연안(Yenan), 독립동맹(Independence League), 공산당(Communist)이다. 민주당 소속으로 올라 있는 이름들은 북에서 민주 진영 지도자들을 대체하기 위해 소련이 지명한 공산주의 앞잡이(Communist stooges)로 알려져 있다. 연안독립동맹은 소련 통제 아래 훈련되고 활동하는 중국-만주-조선 공산주의 집단이다. 조선공산당은 완전히 소련의 통제 아래 있다.\n\n어제 현지 공산계 신문에 이제 북조선에 '인민' 정부가 수립되고 남조선에 '민주 전선'이 완성되었으므로 조선 과도정부(Interim Korean Government) 문제는 그 둘을 단순히 합치는 일이라는 발표가 나옴으로써 그림은 완성되었다. 이 발표는 다른 모든 동향 및 활동과 함께, 이곳의 공산주의자 통제와 지도를 받는 '인민당'이 다가올 정부의 자리를 확실히 제의받고 소련이 지휘하는 공산주의자들에게 완전히 팔려 넘어갔다는 결정적 증거로 받아들여진다. 방금 신뢰할 만한 정보원에게서 늦은 정보가 들어왔는데, 그는 2월 6일 남부 여러 도(道) 가운데 [판독불가]에서 열린 공산주의자 집회에 참석했고 그 자리에서 인민당 지도자 여운형(Lyuh Woon Heung)이 주요 연사였다. 여운형은 자신의 입장이 진정한 공산주의자임을 공공연히 밝히고, 미군과 군정의 신용을 떨어뜨리는 공작 방법과 수단에 관하여 긴 논설을 폈다. 이것은 오랫동안 사실이라고 믿어져 왔으나, 여운형을 온전한 공산주의자로 확정한 최초의 실질적 확증이다. 처음부터 남조선의 공산주의자들이 전체가 완전히 공산주의 통제 아래 놓이지 않는 한 어떤 주제로든 어떤 집단과 손잡으리라는 실질적 희망을 가리키는 것은 아무것도 없었다. 북으로부터 크게 선전되고 있는 새 정부 정책에는 Japs 와 조선인 양쪽의 토지 보유와 광범한 재산을 곧바로 몰수하여 대중에게 무상 분배하는 것이 포함되어 있고(여러 보고에 따르면 이미 실행되었다), 이는 다수의 빈궁한 조선인 농민, 최근의 귀환자, 실업자의 마음에 가장 가까운 일이다. 이와 관련하여 일본인 재산의 처리에 관해 어떠한 확고한 방침도 발표하지 못하는 나의 처지는 날이 갈수록 더 큰 장애가 되고 목청 높은 공산주의자들이 비난을 퍼붓는 근거가 되고 있다. 현재 만주에서의 공산주의 활동은 정치적 침투를 통해 동양의 이 지역 전체를 완전히 장악하려고 지금 총력을 기울인다는 구상과 잘 들어맞는다.\n\n전체 그림은 다음과 같이 보인다.\n\n소련은 3개 정당의 이름 아래 공산주의자들을 위장하여 북조선을 위한 자기들의 집단을 세워 놓았다. 확실한 공산주의자로서 여운형이 이끄는 남조선의 '인민당'은 이제 공공연히 또 전면적으로 조선공산당에 완전히 팔려 넘어갔다. 이곳의 공산주의자들은 '민주'로 분류될 여러 다른 이름의 단체와 집단을 다수 그러모았고 이들은 자기들도 고려 대상이 되어야 한다고 주장할 것이며, 한편 우파와 중간파는 유력한 지도자들 뒤로 여러 집단이 크게 통합되는 과정을 거쳤다. 북조선에 대한 정보 차단은 최근 크게 강화되었다. 공산주의자의 비자 없이 남에서 간 여행자들은 미국 스파이로 체포되고 있다. 소련은 북조선의 민주적 대표로서 자기들의 정부를 우리가 받아들이도록 강요하는 한편, 남조선으로부터도 충분한 공산주의 측 대표를 내놓게 강요하여 조선 과도정부의 통제권을 공산주의자들이 쥐게 하려고 계획하고 있음이 틀림없다.\n\n당분간 나는 남조선대한국민대표민주의원의 위신을 유지하고, 조선 민중의 전면적 지지를 얻기 위해 온갖 노력을 기울이며, 공산주의자들의 신용을 떨어뜨릴 계획이다. 이렇게 하면 아마 미국의 진보 언론과 좌경 언론(liberal and pink press)이 내 목을 조를 것이나, 지금 다른 어떤 현지 조치를 취하더라도 치명적이 되리라고 본다.\n\n한 걸음 전진으로서 나는 남조선 내 일본인 재산(Jap property)의 최종 처리에 관한 미국 방침의 명확한 성명과 그것을 집행할 권한을 얻어내도록 압력을 가할 것을 긴급히 건의한다.\n\n하지(HODGE)", "secondary": "Subject is recent Political Developments of Korea.\n\nBeginning early Jan and until Tass announcement of details of Moscow conference near end of Jan, Communism in South Korea was on the wane. Tass announcement and presence of Russian Delegation here stiffened Communists some what but appeared partially to separate Communists from the peoples party Leftists. The National Emergency Congress starting in early February, drew Representatives from all but regularly announced Communists, who, as always, refused to confer with anyone not under their control. Resulting from the Emerg Congress was selected council representing all major groups (including Peoples Party) The Korean Communist Party. At the 1st meeting Feb 14 of this selected Council, called the Korean Representative Democratic Council of South Korea, Lyah, Woon Heung, the leader of the Peoples Party, who had prepared a talk as a principal speaker, was absent but other Representatives attended. Later Peoples Party announced their withdrawal from council. One mbr of Peoples Party struck at the council, announcing that he was not a Communist. The following day 1st Official meeting of Council, Communists started their \"Democratic Peoples Front\" convention with Communist Party, Peoples Party and various other Communist controlled elements such as Farmers Associations, Labor Unions, Peoples Republic Committees, etc, denouncing the Representative Council as fascist, Jap collaborators, undemocratic and traitorous to the \"Masses of the Peoples\".\n\nOn 12 Feb Russians announced complete all Korean Central Government of North Korea. List of names of that Government and State Council has been screened here by well informed moderates now refugees from North Korea. They announced that all names are either violent Communists or unknown Koreans brought in from Russia or Manchuria. Announced list of Parties represented are Democratic, Yenan, Independence League and Communist. Names listed as of Democratic Party are known to be Communist stooges named by Russians to replace the Democratic Leaders in North. Yenan Independence League is the Chinese - Manchurian - Korean Communist Group trained and operating under Russian Control. Korean Communist Party is under complete Russian control.\n\nPicture is complete by announcement yesterday in Local Communist Press that now the \"Peoples\" Government has been set up in North Korea and the \"Democratic front\" is perfected in South Korea the problem of an Interim Korean Government is a simple get together of the two. This statement, together with all the other trends and activities, is accepted as conclusive evidence that the Communistic Controls and lead \"Peoples Party\" here has completely sold out to the Russian Directed Communists by definite offers of positions in the coming Government. Late information has just come in from reliable informant who attended a Communist meeting in [illegible] of the South Provinces Feb 6 where Lyuh Woon Heung, leader of Peoples Party, was principal speaker. Lyuh openly announced his state as a true Communist and gave a long treatise on the methods of operations and means of discrediting the American Military and Military Government. Although this has long been believed to be true, it is the first real fix on Lyuh as a full fledged Communist. Since the beginning there has never been anything to indicate real hope of getting Communists in the South to join with any group on any subject unless the whole be completely under Communist Control. New Governmental Policies from North prominently announced include straight out confiscation of land holdings and extensive properties of both Japs and Koreans for free distribution to the masses, (already accomplished according to many reports), this being closest to the hearts of the large numbers of indigent Korean peasants recent repatriates and unemployed. In this connection my inability to announce any firm policy on disposition of Japanese property is growing daily as a greater handicap and source of charges by highly vocal Communists. Current Communistic activities in Manchuria tie in well with idea if an all out effort now to gain full control of this entire area of the Orient through political penetration.\n\nComplete picture appears as follows:\n\nRussians have set up their group for North Korea, camouflaging Communists under names of 3 parties. \"Peoples Party\" in south Korea headed by Lyuh as a definite Communist has now sold out completely to Korean Communist Party openly and in Toto. Communists here have gathered in many other named group to class as \"Democratic\" Societies and groups who will insist on being considered, while Rightist and Center have undergone great consolidation of groups behind outstanding leaders. Blackout over North Korea is recently greatly intensified. Travelers from south without Communist Visas being arrested as American Spies. Russians no doubt plan to force us to accept their Government as the Democratic representatives of north Korea while trying to force us to give enough Communistic representation from South Korea to gain control of Korean interim Government by Communists.\n\nFor the present I plan to keep up prestige of the Korean representative Democratic Council, make every effort to gain the full backing of the Korean people, and discredit the Communists. This will probably get liberal and pink press of US on my neck, but feel any other local action now would be fatal.\n\nAs one step forward I urgently recommend pressure to get positive statement of US Policy in final disposition of Jap property in south Korea and authority to carry it out.\n\nHODGE", "notes": ["[도장·결재] 접수 도장(0037 정정본 1면): GHQ AFPAC AGO RECORDS 25 FEB 1946", "[도장·결재] 도장 위 손글씨: '014.1 Korea'(이니셜 추정 서명 겹침)", "[도장·결재] 1면 표제 타자: 'CORRECTED COPY'(정정본)", "[도장·결재] 도장: A. G. FILE (0040 원본 1면)", "[도장·결재] COPY NO 12 (0037), COPY 15 (0040)", "[도장·결재] 3면 타자 주기: 'NOTE: Service has been requested for correction of underscored portions.'(밑줄 친 부분의 정정을 통신에 요청함)", "[도장·결재] 3면 타자 주기: '이 전문은 신호센터로 넘겨져 워싱턴 국무부(STATE DEPT WASHINGTON D C) 앞으로 재발송되었음 — 조치용(for Action)'", "[도장·결재] 각 면 하단 연필 일련번호: 7-F", "[도장·결재] 전문 정리번호(각 면): 63588", "편철 메모 — 3면짜리 전문이 두 벌 편철됨. 0037 은 'CORRECTED COPY' 로 표기된 1면, 0040 이 원본 1면. dupes.json 기준 0041=0038, 0042=0039 사본"], "note": "번역자 주 — 1) 이 전문은 문서철에 두 벌 편철돼 있다. 0037 이 'CORRECTED COPY'(정정본) 1면, 0040 이 원본 1면이며, 0038·0039 와 사본 0041·0042 가 2·3면이다. 본 번역은 0037(정정본)과 0038·0039 를 저본으로 하고, 판독이 어려운 곳은 사본 0041·0042 로 대조했다. 2) 3면 '...liberal and pink press of US on my neck...' 구절은 사본(0042)에서는 'US NON MY NEYL' 로 오문 수신되어 있고, 정정본에는 'on my neck' 으로 밑줄과 함께 정정돼 있다. 전문 하단에 '밑줄 친 부분의 정정을 통신에 요청함'이라는 주기가 있는 그 대목이다. 3) 1면 '...selected council representing all major groups (including Peoples Party) The Korean Communist Party.' 는 원문 그대로다. 문맥상 조선공산당을 '제외한다(excluding)'는 뜻으로 읽히나 원본에 그런 낱말이 없어 고치지 않고 직역했다. 전신 수신 과정의 탈자로 의심된다. 4) 2면 '...attended a Communist meeting in ___ of the South Provinces...' 는 원본 타자에 공백이 있고 'of the' 가 앞줄 끝에 겹쳐 찍혀 있다. 낱말 하나가 빠진 것으로 보여 [illegible]/[판독불가]로 두었다. 'one of the South Provinces' 로 추정되나 지어내지 않았다. 5) **차별적 표현**: 본문에 일본인을 가리키는 멸칭 'Japs'(2면 'properties of both Japs and Koreans', 3면 'final disposition of Jap property')와 'Jap collaborators'(1면)가 나온다. 부드럽게 고치지 않고 그대로 옮겼다. 6) 'Emerg Congress', 'mbr', 'thetwo', 'toconter'(=to confer) 등 전문 특유의 약자·붙임 오타는 원문 그대로 두되 영문에서는 판독 가능한 형태로만 정리했다. 7) 여운형의 로마자 표기가 면마다 다르다(Lyah/Lyuh). 원문 표기를 각각 기록했다. 8) 발신 시각 표기 'TOO : 221141 I' 는 22일 발신인데 본문 머리 날짜는 24 February 1946 이다. 숫자열은 읽은 그대로 두었다.", "warn": false, "pages": ["0037", "0038", "0039", "0040", "0041", "0042"], "search": "하지(John R. Hodge — 원문 'HODGE') 맥아더(Douglas MacArthur — 원문 'GENERAL MACARTHUR') 여운형(Lyuh Woon Heung — 1면 정정본은 'Lyah, Woon Heung', 2·3면은 'Lyuh Woon Heung') 7-F TFGCG 302-Recent Political developments of Korea."}, {"id": "7-E", "order": 705, "date": "1946-02-23", "group": "B", "eyebrow": "편철 7-E · 0043–0046면", "title": "여운형(Lyuh)과 좌익 인사들의 남조선 대표민주의원 불참, 민주주의민족전선의 결성, 그리고 북조선의 소련 후원 '정부' 수립", "badge": "Top Secret", "list_right": "7-E", "meta": [{"k": "일자", "v": "1946-02-23"}, {"k": "발신", "v": "주한미군사령관(CG USAFIK) — 제1면은 발신자 표시가 (BENNINGHOFF), 제2·3면은 (HODGE), 본문 서명은 HODGE", "txt": true}, {"k": "수신", "v": "연합국최고사령관(SCAP) — 국무부에 전달할 것(PASS TO STATE DEPT)", "txt": true}, {"k": "참조", "v": "총사령관, 참모장, 부관, 정부과장 앞 참고 배포. 국무부에는 통신실을 통해 재발신", "txt": true}, {"k": "전문번호", "v": "TFGCG 301 · MCN TJC-A-3-22"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0043–0046 (3면) · 사본 1면"}, {"k": "건명", "v": "Non-participation of Lyuh and other left-wing personalities in the Representative Democratic Council of South Korea; formation of the Democratic Peoples Front and of a Soviet-sponsored \"Government\" in North Korea", "txt": true}, {"k": "색인 요지", "v": "TFGCG 301-Re participation of Lyuh & left-wing personalities in democratic council of Korea.", "txt": true, "wide": true}], "summary": "하지 사령부는 여운형과 좌익 인사들이 남조선대표민주의원에서 이탈해 민주주의민족전선에 가담하고 북조선에 소련이 조종하는 공산 '정부'가 세워짐으로써 조선의 정치 균형이 뒤바뀌었으며, SWNCC 176/18 이 규정한 협의체를 우익 이외의 세력까지 포함해 구성하기는 사실상 불가능해졌다고 보고하고, 미소공동위원회를 앞두고 소련이 유리한 위치를 점했으나 김구·이승만의 대중적 기반과 조선인의 반공 정서가 미국 대표단에 유리하게 작용할 수 있다고 전망했다.", "points": ["여운형과 좌익 인사들이 남조선 대표민주의원에 불참(TFGCG 291)하고 새로 결성된 민주주의민족전선(democratic peoples front)에 가담했다.", "여기에 북조선의 소련 조종 공산 정부 수립이 겹치면서 조선의 정치 균형이 바뀌었다 — 주한미군사령관이 SWNCC 176/18 이 규정한 협의체를 '알려진 우익 집단 이외의 세력까지 대표하도록' 구성할 수 있을지 지극히 의심스러워졌다.", "하지 중장은 여운형과 공산주의자들까지 협력하도록 유도하는 노력을 계속하겠지만 '희망을 갖는 것은 비현실적'이다. 이 상황은 러시아 측의 '교묘하게 시점을 맞춘 책동'의 결과다.", "공산주의자들은 처음부터 남조선 협의체 구성에 협력하기를 거부했다(TFGCG 285). 2주 전 연안독립동맹(Yenan Independence Alliance)이 처음 경성에 나타났다 — 북조선에는 이미 얼마 전부터 존재했다.", "이 두 집단과 같은 성향의 다른 집단들이 결집해 민주주의민족전선을 결성했고, 첫 집회를 2월 15일에 열었다(TFGCG 291).", "민주주의민족전선은 스스로를 남조선 민주 정당·단체의 진정한 대표라 내세우고, 대표민주의원을 '반역자·일본 부역자·파시스트의 소굴(a hotbed of traitors, Jap collaborators and fascists)'이라 규탄한다.", "2월 21일자 공산계 신문들은 민족전선이 모스크바 코뮈니케가 규정한 민주주의 임시정부 수립에서 북조선의 새 '정부'와 협력할 것이라고 보도했다.", "최근의 확실한 정보로 인민당 지도자 여운형(Lyuh Woon Heung)이 정규 공산주의자임이 확정되었고, 이로써 인민당·조선인민공화국·조선공산당이 확실히 하나의 집단이며 모두 진정으로 공산주의적임이 확립되었다.", "북조선의 소련 후원 '정부'는 2월 12일 발표되었다. 요직은 모두 공산주의자와 연안파가 차지했고, 조만식(원문 'Cho Man SRK')을 비롯한 알려진 민주 인사들의 이름은 보이지 않는다. 조만식은 여전히 구금 중이며 소련이 그를 공동위원회에 출석시킬지 의심스럽다.", "38도선 이북의 '차단(Blackout)'은 전보다 엄격해졌다 — 소련이 특별히 지정한 자를 제외하고 남으로 오려 하거나 북으로 돌아가려는 조선인은 모두 투옥된다.", "따라서 소련은 공동위원회에 대해 강력한 위치에 있다. 소련은 북조선의 '협의체'가 될 '정부'를 세웠고, 미국 지역에서는 진정한 정당 연합의 형성을 저지하는 데 성공했다.", "하지 중장의 딜레마: 현 대표민주의원을 끝까지 밀면 '미국이 파시스트·친일파를 후원한다'는 비난을 받고, 진정한 연합체로 개조하려 하면 최종 대표기구가 너무 좌경화되어 북측 집단과 5 대 8(도 기준) 또는 2 대 1(인구 기준)로 만날 때 소련 후원 집단이 판을 지배하게 된다.", "소련의 두 조치는 시점이 의미심장하다 — 만주에 대한 소련 요구 발표 및 그곳의 전투 발발과 동시에 진행되었고, 백악관이 얄타에서의 대소 양보를 공개한 직후였다.", "다만 공산 측의 세력 증대 자체가 러시아가 상황을 우려해 비공산 세력의 성과를 상쇄해야 한다고 느꼈다는 징표다. 러시아는 김구(Kim Koo)와 이승만(Syngman Rhee)이 민중 속에 너무 깊이 뿌리내려 배제할 수 없음을 알고 있고, 미국의 정책과 행동이 조선인을 러시아보다 미국에 우호적으로 만들었으며 민중 전체가 반공적이라고 느끼고 있을 것이다.", "이 요인들은 공동위원회에서 미국 대표단의 힘이 될 것이며, 잘 쓰면 소련이 지배하는 임시정부의 출현을 막을 수 있다."], "primary": "1. 여운형(Lyuh)과 그 밖의 좌익 인사들이 남조선 대표민주의원에 참여하지 않은 것(TFGCG 291)과 그들이 뒤이어 최근 결성된 민주주의민족전선에 가담한 것은, 북조선에 소련이 조종하는 공산 정부가 수립된 것과 더불어 이곳의 정치적 균형을 바꾸어 놓았다. 이제 주한미군사령관이 SWNCC 176/18 에 규정된 협의체를, 알려진 우익 집단 이외의 어느 세력이라도 대표하는 형태로 모을 수 있을지 지극히 의심스러워 보인다. 하지(Hodge) 중장은 여운형을, 나아가 공산주의자들까지 자신에게 협력하도록 유도하려는 노력을 계속할 것이나, 희망을 갖는 것은 비현실적일 것이다. 이 사태는 명백히 러시아 측이 교묘하게 시점을 맞춘 책동으로 빚어진 것이다. (경성 정치고문 국무부 앞 제31호.)\n\n2. 이미 보고한 바와 같이(TFGCG 285), 공산주의자들은 처음부터 남조선 협의체(South Korea Consultative Group)의 구성에 협력하기를 거부해 왔다. 약 2주 전 연안독립동맹(Yenan Independence Alliance)이 경성에 처음 모습을 드러냈다 — 북조선에서는 얼마 전부터 존재해 왔다. 이 두 집단은 비슷한 성향의 다른 집단들과 함께 결집하여 민주주의민족전선을 결성하였고, 그 첫 집회는 2월 15일에 열렸다(TFGCG 291). 이 조직의 세력은 여운형과 그 추종자들이 대표민주의원에서 사퇴하고 뒤이어 새로 만들어진 좌익 결집체에서 직책을 받아들이면서 강화되었다. 이 민주주의민족전선은 스스로를 남조선 민주 정당 및 단체의 진정한 대표라고 내세우며, 대표민주의원을 반역자·일본 부역자·파시스트의 소굴이라고 규탄한다. 2월 21일자 공산계 신문들은 민족전선이 모스크바 코뮈니케에 규정된 민주주의 임시정부의 수립에서 북조선의 새 「정부」와 협력할 것이라고 보도하였다. 아주 최근의 신빙성 있는 정보는 인민당 지도자 여운형(Lyuh Woon Heung)이 정규 공산주의자임을 확정적으로 밝히고 있으며, 이로써 인민당·조선인민공화국·조선공산당이 확실히 하나의 집단이고 모두가 진정으로 공산주의적임이 확립되었다.\n\n3. 러시아가 후원하는 북조선 「정부」는 2월 12일에 발표되었다. 이에 관한 세부 사항은 입수되는 대로 송부하겠으나, 요직은 모두 공산주의자와 연안파가 차지하고 있는 것으로 보인다. 조만식(원문 표기 「Cho Man SRK」)을 비롯해 이곳에 알려진 민주 인사들의 이름은 [보이지 않는다]. 민주 진영 지도자들은 나타나지 않는다. 조만식은 여전히 구금 중이며, 러시아가 그가 공동위원회에 출석하도록 순순히 허용할지는 의심스럽다. 이와 관련하여 38도 이북의 「차단(Blackout)」은 전보다 엄격하다. 러시아가 특별히 지정한 자를 제외하고, 남쪽으로 오려 하거나 북쪽으로 돌아가려는 조선인은 모두 투옥된다.\n\n4. 따라서 러시아는 지금 공동위원회에 관하여 강력한 위치에 있다. 그들은 북조선의 「협의체(Consultative Group)」가 될 가능성이 큰 「정부」를 세워 두었다. 그들은 또한 미국 지역에서 정당들의 진정한 연합을 저지하는 데도 성공했다. 하지 중장은 이로써 현재의 대표민주의원을 끝까지 밀어붙이든가, 아니면 그것을 진정한 연합체로 바꾸려 애쓰든가 하는 딜레마에 놓였다. 첫째 대안을 택하면 그 결과는 미국이 파시스트·친일파 등을 후원한다는 비난을 받는 것이 될 터이고, 둘째 대안을 택하면 최종 대표기구가 너무 강하게 좌경화되어, 북에서 온 집단과 5 대 8 비율(도道 기준)이나 심지어 2 대 1 비율(인구 기준)로 만날 때 소련 후원 집단들이 판을 지배하게 될 공산이 매우 크다.\n\n5. 위에 기술한 소련의 두 조치는 그 시점이 의미심장하다. 두 조치는 만주에 관한 소련의 요구 발표 및 그 지역의 전투 발발과 동시에 전개되었고, 백악관이 얄타에서 소련에 준 양보를 공개한 직후에 뒤따랐다. 이러한 국제적 사건들은 조선인들을 깊이 동요시키고 격앙시켰다. 대다수 조선인은 러시아인을 두려워하고 싫어하지만, 소련의 호전성과 즉시 동원 가능한 군사력, 그리고 지리적 인접성에 압도되지 않을 수 없다. 물론 러시아인들은 이러한 심리적 요인들을 충분히 알고 있으며, 자기들에게 유리하게 이용할 것으로 예상된다.\n\n6. 공산 측의 위치가 1월보다 강해진 것은 사실이나, 바로 그 세력 증대야말로 러시아가 사태를 우려하고 있고 공산당 이외의 정파가 거둔 성과를 상쇄하기 위해 행동에 나설 수밖에 없다고 느낀다는 징표다. 러시아는 김구(Kim Koo)와 이승만(Syngman Rhee)이 민중 속에 너무나 강하게 뿌리내려 있어 밀어낼 수 없음을 알고 있다. 그들은 또한 대체로 남조선에서의 미국의 정책과 행동이 조선인으로 하여금 러시아인보다 미국인에게 더 호의를 갖게 만들었음도 알고 있다. 그들은 또한 민중 전체가 반공적이라고 느끼고 있을 것이다. 이러한 요인들은 공동위원회에서 미국 대표단에 힘을 보탤 것이며, 제대로 활용된다면 소련이 지배하는 임시정부의 출현을 막을 수 있을 것이다.\n\n하지(HODGE)", "secondary": "GENERAL HEADQUARTERS, U. S. ARMY FORCES, PACIFIC\nADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\n\nINCOMING MESSAGE\n\nTOP SECRET\nOPERATIONAL PRIORITY                    23 February 1946\n\nFROM : CG USAFIK (BENNINGHOFF)\nTO   : SCAP (PASS TO STATE DEPT)\nNR   : TFGCG 301\n\n1. The non participation of Lyuh and other left-wing personalities in the representative democratic council of South Korea (TFGCG 291) and their subsequent adherence to the recently formed democratic peoples front, together with the formation of a Soviet-manipulated communist government in North Korea, has altered the political balance here. It now seems extremely doubtful whether CG USAFIK can gather together a consultative group provided for in SWNCC 176/18 which would be representative of any but the known right-wing groups. Although Lt Gen Hodge will continue efforts to induce Lyuh, and even the communists, to cooperate with him, it would be unrealistic to be hopeful. This situation has obviously been brought about by adroitly-timed maneuvers by the Russians. (Polad Seouls Nr 31 to State).\n\n2. As has been reported (TFGCG 285), the communists have from the outset refused to cooperate in the formation of the South Korea Consultative Group. About 2 weeks ago the Yenan Independence Alliance made its first appearance in Seoul, although it had been existing north Korea for some time. These 2 groups, together with others of similar persuasion, have banded together and formed the democratic peoples front, the first rally which was held on February 15 (TFGCG 291). The strength of this organization was enhanced by the resignation of Lyuh and adherents from the representative council and subsequent acceptance of office in the newly created left-wing grouping. This democratic peoples front holds itself out as being truly representative of the Democratic parties and organization of South Korea and denounces the Representative council as being a hotbed of traitors, Jap collaborators and fascists. The communistic papers of February 21 stated that the peoples front will collaborate with the New \"Government\" of North Korea in the formation of the democratic provisional Government provided for in the Moscow communique. Very recent and reliable information definitely fixes Lyuh Woon Heung, leader of peoples party, as a regular communist, thus establishing the peoples party, Korean peoples republic and Korean communistic party as definitely 1 group, all truly communistic.\n\n3. The Russian sponsored \"Government\" of North Korea was announced February 12. Details there anent will be forwarded when available, but it appears that the key positions are all held by communists and the Yenan group. The names of Cho Man SRK and other known democrats here. Democratic leaders do not appear. Cho is still under arrest and it is doubtful whether the Russians will willingly permit his appearing before the Joint Commission. In this connection, the \"Blackout\" north of 38 is more stringent than before. All Korean, except those specifically designated by the Russians, who try to come south or who return to the North are thrown into prison.\n\n4. The Russians are, therefore, now in a strong position with respect to the Joint Commission. They have set up a \"Government\" which will probably also be the \"Consultative Group\" of North Korea. They have also been successful in preventing a true coalition of parties in the United States Zone. Lt Gen Hodge is thus faced with the dilemma of either backing his present representative council to the limit, or of striving to convert it into a true coalition and if the first alternative is chosen, the result will be that the United States is accused of backing fascists, pro-japs, etc, while if the 2nd alternative is chosen the result may very well be that the final representative council will be so strongly inclined to the left that when it meets with the group from the north on a 5 to 8 basis (By Provincemu) or even on a 2 to 1 basis (By population), the Soviet-sponsored groups will dominate the scene.\n\n5. The timing of the 2 soviet moves described above is significant. They developed simultaneously with the announcement of Soviet demands regarding Manchuria and the outbreak of fighting in that area, and followed closely the disclosure by the White House of concessions to the soviets at Yalta. These international events have profoundly stirred and agitated the Koreans. Most of them fear and dislike the Russians, but they cannot but be impressed by Soviet truculence, available military power and geographical propinquity. The Russians are, of course, fully aware of these psychological factors and may be expected to utilize them to their own advantage.\n\n6. Although the communist position is therefore stronger than in January, that very increase in strength is an indication that the Russians are concerned over the situation and feel compelled to take action to offset gains made by parties other than communist. The Russians know that Kim Koo and Syngman Rhee are so strongly entrenched with the people that they cannot be set aside. They also know that in general American policies and actions in South Korea have made the Korean more favorably disposed to the Americans than to the Russians. They also probably feel that the people as a whole are anti-communist. These factors will add strength to the American Delegation in the Joint Commission and if properly used may prevent the emergence of a Soviet Dominated Provisional Government.\n\nHODGE\n\nACTION: POLITICAL ADVISOR INFORMATION: COMMANDER-IN-CHIEF, CHIEF OF STAFF, AG, C GOVT SECT, NOTE: This message has been passed to Signal Center for re-dispatch to STATE DEPARTMENT for Information.\n\n63479          OPERATIONAL PRIORITY          TOP SECRET TOO/MCN : TJC-A-3-22   221140 I Handling and transmission of the literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 44g and 53a (3) (Changes No 3) of AR 380-5, 15 March 1944.\n\nTHE MAKING OF AN EXACT COPY OF THIS MESSAGE IS FORBIDDEN", "notes": ["[도장·결재] (0043) 사각 접수 도장: 「GHQ. AFPAC / 24 FEB 1946 / 014.1 Korea / AGO RECORDS」", "[도장·결재] (0043) 우측 자필 편철 지시: 「X 091.4」, 「091 Korea」(사선으로 지움), 「X 091 Korea」(지움), 「334」(지움), 그리고 「014.1 KOREA TS」", "[도장·결재] (0043) 하단 고무인: 「A. G. FILE」, 인쇄 「COPY NO」에 자필 「17」", "[도장·결재] (0043) 좌하단 연필 편철기호: 「7-E」", "[도장·결재] (0044·0046) 좌하단 연필 편철기호: 「7-E」", "[도장·결재] (0043·0044·0046) 각 면 상하단 「TOP SECRET」·「OPERATIONAL PRIORITY」 타자 표시, 하단 인쇄 「THE MAKING OF AN EXACT COPY OF THIS MESSAGE IS FORBIDDEN」", "[도장·결재] (0046) 하단 발신 표시: 「TOO/MCN : TJC-A-3-22   221140 I」, 통신소 번호 「63479」", "편철 메모 — 0043=1면, 0044=2면, 0046=3면(마지막). 0045 는 0044 의 사본"], "note": "번역자 주 — 1) 제1면(0043)의 발신자 표시는 「CG USAFIK (BENNINGHOFF)」이고 제2·3면(0044·0046)은 「CG USAFIK (HODGE)」다. 본문 서명은 HODGE. 정치고문 베닝호프가 기초하고 사령관 명의로 나간 전문으로 보이나 단정하지 않았다. 2) 「Cho Man SRK」는 원본 스캔을 확대해 확인한 결과 확실히 S·R·K 세 글자다. 문맥(북조선의 구금 중인 민주 진영 지도자)상 조만식(Cho Man Sik)이 거의 확실하나 전문 수신 타자의 오타로 보이므로 원어를 살리고 여기 적어 둔다. 3) 제3항의 「The names of Cho Man SRK and other known democrats here. Democratic leaders do not appear.」는 전문 수신 과정에서 문장이 깨진 대목이다(원래는 '…의 이름은 나타나지 않는다' 정도). 한국어 번역에서 [보이지 않는다]로 보완하고 표시했다. 4) 제4항의 「on a 5 to 8 basis (By Provincemu)」는 원본 확대 확인 결과 그대로다. 'Provincemu'는 'Provinces'의 전문 오타로 보이나 고치지 않았다. 비율 '5 to 8'도 그대로 두었다. 5) 「Jap collaborators」, 「pro-japs」 등 멸칭이 원문에 그대로 나온다. 번역에서도 다듬지 않고 '일본 부역자', '친일파'로 옮겼으며 원문 표기 사실을 여기 적어 둔다. 6) 「representative democratic council of South Korea」·「representative council」은 남조선 대표민주의원(1946.2.14 발족)을, 「democratic peoples front」는 민주주의민족전선(1946.2.15 결성)을 가리킨다. 7) 0045 면은 0044 의 사본이며 documents.json 이 copies 로 분류했다. 두 장을 대조해 판독했다. 8) 전문 원문에는 'TFGCG'가 'TPGCG'/'IPOCG' 등으로 OCR 오독되었으나 원본에서 TFGCG 로 확인했다.", "warn": false, "pages": ["0043", "0044", "0046", "0045"], "search": "여운형(Lyuh Woon Heung, 원문 「Lyuh」·「Lyuh Woon Heung」) — 인민당(peoples party) 지도자. 대표민주의원에서 사퇴하고 민주주의민족전선에 가담 존 R. 하지(Lt Gen Hodge) — 주한미군사령관. 전문 서명자 H. 메럴 베닝호프(Benninghoff) — 주한미군사령부 정치고문(국무부 파견). 제1면 발신자 표시에 이름이 올라 있고, 대응 전문은 「경성 정치고문 국무부 앞 제31호(Polad Seoul's Nr 31 to State)」로 병기됨 조만식(Cho Man Sik로 추정 — 원문 표기 「Cho Man SRK」) — 북조선의 민주 진영 지도자. 전문 시점에 구금 중 김구(Kim Koo) 이승만(Syngman Rhee) 7-E TFGCG 301-Re participation of Lyuh & left-wing personalities in democratic council of Korea."}, {"id": "7-D", "order": 704, "date": "1946-02-15", "group": "B", "eyebrow": "편철 7-D · 0047–0047면", "title": "CA 57792 관련 — 합참과 SWNCC를 통해 국무부 지침을 요청 중", "badge": "Top Secret", "list_right": "7-D", "meta": [{"k": "일자", "v": "1946-02-15"}, {"k": "발신", "v": "워싱턴(WASHINGTON) — 서명 WARCOS 육군참모총장", "txt": true}, {"k": "수신", "v": "태평양미육군총사령관(CINCAFPAC), 주한미군사령관(CG USAFIK)에게 전달할 것", "txt": true}, {"k": "참조", "v": "총사령관(Commander in Chief), 참모장(Chief of Staff), 부관부(AG), 민정부(C Govt Sect), 정치고문(Political Advisor)", "txt": true}, {"k": "전문번호", "v": "W 97127"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0047–0047 (1면)"}, {"k": "건명", "v": "Ref CA 57792 — State Dept guidance being requested through JCS and SWNCC", "txt": true}, {"k": "색인 요지", "v": "W 97127 - Ref CA 57792, SD guidance req through JCS & SWNCC.", "txt": true, "wide": true}], "summary": "CA 57792에 대해 국무부 지침을 합참과 SWNCC를 통해 요청 중이며, 그동안 국무부는 14일 도착 예정인 해리먼·애치슨과 협의할 예정이라는 짧은 통보.", "points": ["CA 57792를 참조한 회신이다.", "국무부 지침은 합동참모본부(JCS)와 국무·육군·해군 3부조정위원회(SWNCC)를 거쳐 요청되고 있다.", "그 사이 국무부는 14일 도착 예정인 해리먼(Harriman)과 애치슨(Atcheson)과 이 문제를 논의할 작정이다.", "이 전문은 CG USAFIK 로는 전달되지 않았다(This radio has not been passed to CG USAFIK)."], "primary": "CA 57792 참조. 국무부 지침을 합동참모본부(JCS)와 SWNCC를 통해 요청하고 있다. 그동안 국무부는 14일에 도착할 예정인 해리먼(Harriman) 및 애치슨(Atcheson)과 이 문제를 논의할 작정이다.", "secondary": "Ref CA 57792. State Dept guidance is being requested through JCS and SWNCC. Meanwhile State Dept intends to discuss with Harriman and Atcheson who are due to arrive on 14th.\n\nWARCOS", "notes": ["[도장·결재] 접수 도장: GHQ AFPAC AGO RECORDS 15 FEB 1946", "[도장·결재] 도장 안 손글씨: '014.1 Korea', 'Top Secret'", "[도장·결재] 전문번호 옆 손글씨: '014.1 KOREA'", "[도장·결재] 여백 손글씨 회부 표시: 'X 070 SD', 'X 97126'(끝자리 불확실) — 사선 표시", "[도장·결재] 도장: A. G. FILE", "[도장·결재] 타자 이니셜: 'E. B.'", "[도장·결재] 타자 기재: 'This radio has not been passed to CG USAFIK'(이 전문은 주한미군사령관에게 전달되지 않았음)", "[도장·결재] 우하단: COPY NO (번호는 흐려 판독불가, '7'로 읽힘)", "[도장·결재] 좌하단 연필 일련번호: 7-D"], "note": "번역자 주 — 1) 본문 하단 주의 문구에 'AR 380-15, 15 Mar 1944' 로 타자돼 있으나 다른 면들은 모두 'AR 380-5' 다. 원본 타자 오류로 보이나 고치지 않았다. 2) 'authroized'(=authorized) 도 원본 타자 오타. 3) 인명 Atcheson 은 국무장관 Dean Acheson 이 아니라 맥아더의 정치고문 George Atcheson, Jr. 로 읽힌다 — 원문 철자를 그대로 두었다.", "warn": false, "pages": ["0047"], "search": "해리먼(W. Averell Harriman — 원문 'Harriman') 애치슨(George Atcheson, Jr. — 원문 'Atcheson', 맥아더의 정치고문) 7-D W 97127 - Ref CA 57792, SD guidance req through JCS & SWNCC."}, {"id": "7-C", "order": 703, "date": "1946-02-13", "group": "B", "eyebrow": "편철 7-C · 0048–0049면", "title": "SWNCC 176/18에 대한 소견", "badge": "Top Secret", "list_right": "7-C", "meta": [{"k": "일자", "v": "1946-02-13"}, {"k": "발신", "v": "주한미군사령관(CG USAFIK) — 서명 하지(HODGE)", "txt": true}, {"k": "수신", "v": "연합국최고사령관(SCAP)", "txt": true}, {"k": "참조", "v": "총사령관(Commander-in-Chief), 참모장(Chief of Staff), 부관부(AG), 민정부(C Govt Sect), 정치고문(Political Advisor)", "txt": true}, {"k": "전문번호", "v": "TFGCG 285"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0048–0049 (2면)"}, {"k": "건명", "v": "Observations re SWNCC 176/18", "txt": true}, {"k": "색인 요지", "v": "TFGCG 285 - Observations re SWNCC 176/18.", "txt": true, "wide": true}], "summary": "하지가 세이어 중령이 가져온 SWNCC 176/18을 검토하고, 그 지령이 요구하는 '자문단(Consultative Group)' 구성의 실제 사정 — 굿펠로가 준비 중이며 2월 14일 공표 예정, 조선 정당의 불안정성, 좌우 극단주의자를 배제하라는 요구의 실행 불가능성, 이승만·김구 포함의 불가피성, 여운형과 김구의 임시정부 해산 문제 — 을 보고하고, 모스크바 코뮈니케의 '임시정부(Provisional Government)'라는 명칭을 '과도(Interim)' 등으로 바꾸어 달라고 요청하는 전문.", "points": ["하지는 세이어(Thayer) 중령이 가져온 SWNCC 176/18을 검토하고 소견을 제출한다.", "1. 하지의 지시 아래 굿펠로(Goodfellow)가 지령에 언급된 '자문단(Consultative Group)' 구성에 적극 관여해 왔고, 그 구성을 2월 14일 공표할 계획이다. 공개적으로 참가를 거부한 소련 지휘하의 공산주의자를 제외한 38도선 이남의 모든 중요 지도자가 포함될 것으로 본다.", "2. 약 30명 규모의 이 집단에는 저명한 학자이거나 정치적 영향력이 별로 없으나 조선인들이 서로 합의해 넣은 이들이 몇 명 있다. 이 '메우기(padding)'는 자문단이 지령에 따라 실제로 일을 시작하면 제거될 수 있고 더 유용한 인물로 교체될 수 있다.", "3. 조선 정당의 불안정성이 교란·혼란 요인이다. 정당이 정치적 신념보다 인적 관계에 주로 기초하고 있어 어떤 사람이 오늘은 지도자여도 추종자의 뜻을 따르지 않으면 다음 날 추종자를 잃는다. 이런 유동성 때문에 '자문단' 구성이 어렵고, 끊임없는 비판과 변동을 겪겠지만 위신을 세우고 기능하게 하려고 온 힘을 쏟겠다.", "4. 지령은 좌우 극단주의자가 아닌 강력하고 유능한 지도자를 다수 뽑으라고 요구하나 이는 어렵거나 불가능하다. 공산주의자들이 스스로 빠져나갔더라도 이승만과 김구를 넣는 것은 어떤 조선 사업이든 성공에 필수적이었다.", "이 두 사람은 옳든 그르든 일반적으로 '극우(Extreme Right Wing)'로 알려져 있고 공산주의자들은 파시스트라고 부르지만, 거의 모든 조선인이 그 이름을 떠받들고 있어 배제하면 어떤 정치적 기획도 자동으로 실패한다. 공산주의자들조차 정부 구성 '명단(slate)'에 이들을 넣어야 한다.", "5. 인민당의 여운형과 몇 사람을 넣는 것이 가능했다. 이들은 중도 좌파라 할 만하다. 여운형은 자기 당 안의 공산주의 세력에게 힘을 잃어 현재 위신이 불확실하나, '임시정부' 해산과 동시에 자기 당도 공개적으로 해산시키고 다른 이들과 함께 단결 선언에 참여할 수 있다면 영향력이 다시 커질 수 있다. 그의 주된 기반은 경성 등 대도시가 아니라 지방이다.", "6. 김구는 자기 '임시정부'를 해산하겠다고 약속했고 그렇게 된 듯 보이나, 그 약속은 집단 내 상당한 반대 끝에 나온 것이다. 이 해산이 진정한 것인지, 아니면 '정부'가 늘 자임해 온 전통적 권위를 지키려는 시도가 있을지는 두고 보아야 한다.", "이와 관련해 다음 달 공동위원회가 세울 조직을 가리키는 데 모스크바 코뮈니케가 '임시정부(Provisional Government)'라는 용어를 쓴 것이 조선인들 사이에 큰 혼란을 일으켰고, 김구 집단이 자기 정치적 목적에 이용해 왔다.", "따라서 가능하다면 새 조직의 명칭을 '과도(Interim)'나 그와 비슷한 것으로 바꾸는 조치를 취해 달라고 요청한다. '임시(Provisional)'라는 낱말이 모스크바 코뮈니케에 들어 있으므로 소련 정부에 대한 접근이 필요할 수도 있다.", "베닝호프(Benninghoff)도 이에 동의한다."], "primary": "세이어(Thayer) 중령이 가져온 SWNCC 176/18의 사본을 검토했으며, 그와 관련하여 다음 소견을 제출한다.\n\n1. 나의 지시 아래 굿펠로(Goodfellow) 씨가 지령에 언급된 '자문단(Consultative Group)'의 구성에 적극 관여해 왔다. 나는 이 단체의 구성을 2월 14일에 공표할 계획이다. 공개적으로 참가를 거부한 소련이 지휘하는 공산주의자들을 제외하고, 38도선 이남의 모든 중요한 지도자가 포함되는 것으로 믿어진다.\n\n2. 약 30명으로 이루어진 이 단체에는 저명한 학자이거나 그 밖에 정치적 영향력이 거의 없으면서도 조선인들 자신이 상호 합의로 넣은 사람이 몇 명 들어 있다. 이 채워 넣기는 이 단체가 지령의 조건 아래 일을 하게 되면 제거될 수 있고, 그 자리에 앉힐 더 유용한 인물을 찾을 수 있을 것이다.\n\n3. 교란과 혼란을 일으키는 요인 하나는 조선 정당의 불안정성이다. 정당은 정치적 신념과 확신보다는 주로 인적 관계에 기초하고 있다. 그래서 한 사람이 하루는 지도자였다가 추종자들의 뜻에 따르기를 거부하면 그 다음 날에는 추종자가 없어진다. 이러한 유동성(fteidity)이 '자문단'의 구성을 어렵게 만든다. 자문단은 아마 끊임없는 비판과 변동에 처하겠지만, 그 위신을 세우고 그것이 기능하게 하기 위해 온갖 노력을 기울일 것이다.\n\n4. 지령은 우파나 좌파의 극단주의자가 아닌, 강하고 유능한 지도자를 다수 선정할 것을 요구한다. 이것은 어렵고 불가능하지는 않더라도 달성하기 힘들 것이다. 위에서 말한 대로 공산주의자들은 (적어도 당분간은) 스스로를 배제해 버렸지만, 이승만(Syngman Rhee)과 김구(Kim Koo)를 포함시키는 것은 어떠한 조선 사업의 성공에도 필수적이었다. 이 사람들은 옳든 그르든 일반적으로 '극우(Extreme Right Wing)'로 알려져 있고, 공산주의자들은 이들을 파시스트라고 부른다. 그럼에도 그들의 이름은 거의 모든 조선인에게 대단히 떠받들어지고 있어서, 그들을 배제하면 어떠한 정치적 기도(企圖)도 자동적으로 실패하게 된다는 뜻이 된다. 공산주의자들조차 정부를 위한 자기들의 '명단(slate)'에 이들을 넣어야 한다.\n\n5. 인민당의 여운형(Lyuh Woon Hdung)과 그 밖의 몇 사람을 포함시키는 것이 가능했는데, 이들은 중도에서 상당히 왼쪽으로 분류될 만한 자들이다. 자기 당 안의 공산주의 세력에게 여운형이 권력을 잃은 것에 비추어, 현재 그의 위신은 불확실하다. 그러나 그가 '임시정부'와 동시에 자기 당을 공개적으로 해산시키는 데 성공하고, 다른 이들과 함께 단결의 공개 선언에 참여할 수 있다면 그의 영향력은 다시 커질 수 있다. 그의 주된 힘은 경성(Seoul)이나 다른 대도시가 아니라 지방에 있다.\n\n6. 김구는 자기의 '임시정부'를 해산하겠다고 약속했고 그렇게 된 것으로 보이지만, 이 약속은 그 집단 내부의 상당한 반대 끝에 나온 것이다. 이 해산이 진정한 것일지, 아니면 그 '정부'가 언제나 자임해 온 전통적 권위를 보존하려는 노력이 이루어질지는 두고 보아야 한다. 이와 관련하여, 다음 달에 열릴 공동위원회(Joint Commission)가 세우게 될 조직을 지칭하는 데 모스크바 코뮈니케에서 '임시정부(Provisional Government)'라는 용어를 쓴 것이 조선인들 사이에 상당한 혼란을 일으켜 왔고, 김구의 집단은 자기들의 정치적 목적을 위해 이를 이용해 왔다. 따라서 가능하다면 새 조직의 명칭을 '과도(Interim)'나 그와 비슷한 것으로 바꾸는 조치를 취해 줄 것을 요청한다. '임시(Provisional)'라는 낱말이 모스크바 코뮈니케에 나오는 만큼 소련 정부에 대한 접근이 필요할 수도 있다. 베닝호프(Benninghoff)도 동의한다.\n\n하지(HODGE)", "secondary": "I have studied SWNCC 176/18, copy of which was brought by LT Col Thayer, and submit the following observations in connection therewith:\n\n1. Under my direction, Mr Goodfellow has been actively engaged in the formation of the \"Consultative Group\" mentioned in the directive. I plan that the formation of this group will be made public on 14 Feb. It is believed to include all important leaders South of 38 degree parallel except Russian directed Communists who have publicly refused to participate.\n\n2. This Group of about 30 includes a few who are prominent scholars or who otherwise have little political influence, but who have been put in by the Koreans themselves by mutual consent. This padding may be eliminated when the Group is put to work under the terms of the directive, and more useful men may be found to put in their places.\n\n3. A disturbing and confusing factor is the instability of Korean Political Parties, which are largely based on personal relationships rather than on political beliefs and convictions. Thus, a man may be a leader 1 day and without a following the next, if he refuses to heed his followers. This fteidity make the formation of a \"Consultative Group\" difficult. It will probably be subject to constant criticism and change, but every effort will be made to give it prestige and to make it function.\n\n4. The directive calls for the selection of a majority of strong, competent leaders who are not extremists of the right or left. This will be difficult if not impossible to achieve. Although as described above, the Communists have eliminated themselves (at least for the time being), the inclusion of Syngman Rhee and Kim Koo was essential to the success of any Korean endeavor. These men, rightly or wrongly, are known generally as the \"Extreme Right Wing\", although the Communists call them Fascists. Nevertheless, their names are so revered by almost all Koreans that their exclusion would automatically mean the failure of any political undertaking. Even the Communists have to include them on their \"slate\" for a Government.\n\n5. It has been possible to include Lyuh Woon Hdung and a few others of the Peoples Party, who might be classed as well left of center. In view of Lyuh's loss of power to the Communist elements within his own Party, his prestige is at the moment problematical. However, if he can successfully get his Party to dissolve publicly, simultaneously with \"Provisional Government\", and join in a public declaration of unity with the others, his influence may again increase. His main strength is in the provinces rather than in Seoul and other large cities.\n\n6. Although Kim Koo has promised to dissolve his \"Provisional Government\", and such appears to have been done, this promise was made after considerable opposition within that Group. It remains to be seen whether this dissolution will be bonafide, or whether an effort will be made to preserve the traditional authority which the \"Government\" has always assumed. In this connection, the use of the term \"Provisional Government\" in the Moscow communique to designate the Organization to be set up by the Joint Commission meeting next month, has caused considerable confusion among Koreans and has been used by Kim Koo's Group for their own political ends. It is, therefor, requested that steps be taken, if at all possible, to change the designation of the new Organization to \"Interim\" or something similar. As the word \"Provisional\" appears in the Moscow communique, and approach to the Soviet Govt might be indicated. Benninghoff concurs.\n\nHODGE", "notes": ["[도장·결재] 접수 도장(0048): GHQ AFPAC AGO RECORDS 15 FEB 1946", "[도장·결재] 도장 안 손글씨: '014.1 Korea', 'Top Secret', 'Scap'", "[도장·결재] 여백 손글씨 회부 표시: 'X 091 KOREA', 'X 091.4', '091 (판독불가)' — 사선 표시", "[도장·결재] 도장: A. G. FILE (0048)", "[도장·결재] 타자 이니셜: 'E. B.' (0048)", "[도장·결재] 타자 회부 기재(0049): '이 전문은 신호센터로 넘겨져 WARCOS 앞으로 재발송되었음 — 참고용(for information)'", "[도장·결재] 우하단: COPY NO (번호 미기입)", "[도장·결재] 각 면 하단 연필 일련번호: 7-C", "[도장·결재] 전문 정리번호: 56131"], "note": "번역자 주 — 1) 문서번호 SWNCC 176/18 은 번역하지 않고 그대로 두었다. 원본 타자에는 'SWNCC 176/18' 로 찍혀 있으며 OCR 의 'SIC 178/18' 은 오독이다. 2) 3항의 'This fteidity' 는 원본 타자 그대로이며 밑줄이 그어져 있다(정정 요청 표시). 문맥상 'fluidity'(유동성)로 읽히나 원문을 고치지 않고 두고 번역에서는 '유동성(fteidity)'으로 병기했다. 3) 'therefor'(=therefore) 는 원저자 표기 그대로다. 4) 5항의 여운형 표기는 원본에 'Lyuh Woon Hdung' 으로 찍혀 있다(밑줄 있음). 같은 인물이 7-F 에서는 'Lyah/Lyuh Woon Heung' 으로 나온다. 5) 6항 '...and approach to the Soviet Govt might be indicated.' 의 'and' 는 문맥상 'an' 의 오타로 보이나 고치지 않았다. 6) 2면(0049) 하단 MCN 표기가 도장에 겹쳐 'TJC 2(판독불가)/15' 로만 읽힌다.", "warn": false, "pages": ["0048", "0049"], "search": "하지(John R. Hodge — 원문 'HODGE') 세이어(Thayer — 원문 'LT Col Thayer') 굿펠로(Preston Goodfellow — 원문 'Mr Goodfellow') 이승만(Syngman Rhee) 김구(Kim Koo) 여운형(Lyuh Woon Hdung — 원문 표기 그대로) 베닝호프(H. Merrell Benninghoff — 원문 'Benninghoff') 7-C TFGCG 285 - Observations re SWNCC 176/18."}, {"id": "7-A", "order": 701, "date": "1946-02-12", "group": "B", "eyebrow": "편철 7-A · 0050–0051면", "title": "조선 미소공동위원회의 임무 — 임시정부 구조 논의에 앞서 나라를 개방시키고 소련의 '차단'을 허무는 문제를 먼저 다루자는 하지의 제안", "badge": "Top Secret", "list_right": "7-A", "meta": [{"k": "일자", "v": "1946-02-12"}, {"k": "발신", "v": "태평양미육군총사령관(CINCAFPAC) — 맥아더", "txt": true}, {"k": "수신", "v": "육군참모총장(WARCOS) 겸 합동참모본부(JOINT CHIEFS OF STAFF)", "txt": true}, {"k": "참조", "v": "주한미군사령관(CG USAFIK) — 타자된 뒤 가로줄로 지워져 있다", "txt": true}, {"k": "전문번호", "v": "CA 57792 · MCN 120931"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0050–0051 (2면)"}, {"k": "건명", "v": "Task of Joint Commission in Korea — Hodge's proposal to open up the country and break down the Soviet \"blackout\" before taking up the structure of an interim government", "txt": true}, {"k": "색인 요지", "v": "CA 57792 - Task of Joint Commission in Korea.", "txt": true, "wide": true}], "summary": "맥아더가 하지의 전문을 그대로 인용해 합동참모본부에 올린 것으로, SWNCC 176/18 은 미소공동위원회의 가장 시급한 임무를 조선 임시정부 수립으로 규정했으나 그에 앞서 나라를 개방하고 소련의 '차단'을 허무는 것이 먼저이며, 미국 대표단이 언론·출판·이동의 완전한 자유를 강력히 요구하는 것으로 회의를 시작하고 그 해결이 날 때까지 임시정부 구조 논의를 미루도록 지시하겠다는 하지의 방침에 자신도 동의하니 정부의 견해를 지침으로 달라는 내용이다.", "points": ["하지는 SWNCC 176/18 이 공동위원회의 가장 시급한 임무를 임시 조선정부 창설로 규정하고 있음을 인정하면서도, 그 문제에 손대기 전에 먼저 나라를 개방하고 소련의 '차단(blackout)'을 허물어야 한다고 본다.", "최근 회담(예비회담)에서 이 문제에 관해 도달한 합의는 미국 관점에서 매우 불만족스러웠다 — 소련 대표단은 신문의 자유로운 유통, 모든 정파에게 동등하게 이용되는 통합 라디오망, 그리고 엄격한 허가제 밖의 조선인 지역 간 왕래를 검토하기조차 거부했다.", "이에 따라 하지는 미국 대표단에게, 조선 안에서 조선인의 언론·출판·이동의 완전한 자유를 강력히 요구하는 것으로 공동위원회 회의를 시작하도록 지시하겠다고 제안한다. 논거는 그것이 이루어지기 전에는 공동위원회가 조선의 정당과 지도자들을 자유롭게 협의하고 조선 민중이 자기 정부에 관해 무엇을 원하는지 알아낼 수 없다는 것 — 이는 모스크바 코뮈니케가 규정한 전제조건이다.", "하지는 이 점을 상당한 힘을 실어 밀어붙이고, 미국이 만족할 해결에 이를 때까지 임시정부 구조에 관한 공동 심의를 미루려 한다.", "이 방침이 승인되면, 국무부가 소련 정부에 다음을 통보해 줄 것을 제안한다 — 최근 경제회담에서 상당한 진전이 있었음에도 미국 정부는 조선인의 언론·이동의 자유가 여전히 크게 제한되어 있어 공동위원회가 조선 민중 각계각층의 요구와 열망을 제대로 평가하기 어렵다고 본다.", "소련 정부가 응하지 않더라도, 적어도 주한미군사령부에 더하여 미국 정부 자체가 기록으로 입장을 남기게 되고 공동위원회의 소련 대표단에게 미국의 관점을 미리 준비시키게 된다.", "미국 정부의 뒷받침이 있고 소련 대표단이 합의를 꺼리는 태도를 보이면, 하지는 남조선 협의체를 통해 조선 민중에게 '미국은 처음부터 38선의 장벽을 허물려 했으나 소련이 따라오지 않았다'는 사실을 신중히 알릴 수 있다고 본다. 그런 공개는 미국의 입지를 강화하고 소련 대표단이 미국의 요구에 응하게 만들 수도 있다.", "하지의 결론: 나라를 더 개방하고 미국의 진짜 목적을 민중에게 납득시킬수록, 소련이 지도하는 공산주의적 조선정부가 아니라 진정으로 민주적인 조선정부를 얻을 가능성이 커진다. 정치고문 베닝호프도 동의한다.", "맥아더: 「나는 하지의 제안에 동의하며 지침으로 삼을 정부의 견해를 요청한다.」"], "primary": "총사령관은 하지 장군으로부터 다음의 전문을 방금 접수하였다. 인용 —\n\n(CA 57792) SWNCC 176/18 은 다가올 미소공동위원회 회합의 가장 시급한 임무가 임시 조선정부의 창설이어야 한다고 밝히고 있으나, 본관은 그 문제에 손을 대기에 앞서 나라를 개방시키고 소련의 「차단(blackout)」을 허무는 일이 필요하리라고 본다. 이 점에 관하여 최근의 회담에서 도달한 합의는 미국의 관점에서 지극히 불만족스러웠다. 소련 대표단은 신문의 자유로운 유통, 모든 정파의 이익을 위한 동등한 기반 위의 통합 라디오망, 그리고 엄격한 허가제에 의하지 않는 조선인의 지역 간 왕래를 검토하는 것조차 거부하였다.\n\n따라서 본관은 미국 대표단에게, 조선 안에서 조선인의 언론·출판·이동의 완전한 자유에 대한 강력한 요구로써 공동위원회의 절차를 시작하도록 지시할 것을 제안한다. 그 근거는, 그것이 이루어지기 전에는 공동위원회가 조선의 여러 정당과 지도자들을 자유롭게 협의하지 못하고 조선 민중이 자신들의 정부에 관하여 무엇을 바라는지 알아낼 수 없으리라는 것이며, 이는 모스크바 코뮈니케에 명시된 하나의 전제조건이다.\n\n본관은 이 점을 상당한 힘을 실어 밀어붙일 준비가 되어 있으며, 미국에 만족스러운 해결에 이를 때까지 임시정부의 구조에 관한 위원회의 공동 심의를 미루려 한다.\n\n이 관점이 승인된다면, 본관은 국무부로 하여금 소련에 다음과 같이 통보하도록 요청할 것을 건의한다. 즉, 최근의 경제회담에서 상당한 진전이 이루어졌음에도 불구하고 미국 정부는 조선인들이 언론과 이동의 자유에서 여전히 크게 제약되어 있어 공동위원회가 조선 민중 각 계층의 요구와 열망을 제대로 평가하기 어려우리라고 본다는 것이다.\n\n소련 정부가 그러한 접근에 응하지 않을 수도 있으나, 적어도 그것은 주한미군사령부에 더하여 미국 정부까지 기록으로 입장을 남기게 하며, 공동위원회의 소련 대표단에게 우리의 관점을 미리 알려 두는 셈이 된다.\n\n위에 밝힌 본관의 입장이 미국 정부의 뒷받침을 받고 있고 공동위원회의 소련 대표단이 합의에 이르기를 꺼리는 태도를 보인다면, 본관은 남조선의 조선인 협의체를 통하여 조선 민중에게 미국이 처음부터 38도선의 장벽을 허물려고 노력해 왔으나 소련이 우리의 선도를 따르지 않았다는 사실을 신중하게 알릴 수 있을 것이다. 그러한 공개는 우리의 입지를 강화할 것이며, 소련 대표단으로 하여금 우리의 요구에 응하도록 만들 수도 있다.\n\n본관은 우리가 나라를 더 많이 개방하고 우리의 진정한 목적을 민중에게 납득시킬수록, 소련이 지도하는 공산주의적 조선정부가 아니라 진정으로 민주적인 조선정부를 이룰 가능성이 더 커진다고 확신한다. 베닝호프도 동의한다. 인용 끝.\n\n본관은 하지의 제안에 동의하며, 지침으로 삼을 정부의 견해를 요청한다.\n\n맥아더(MACARTHUR)", "secondary": "TOP SECRET\n\nOP\nOPERATIONAL PRIORITY\n\nC/S   SJC/eeh 12 FEBRUARY 1946\n\nFROM: CINCAFPAC.\nTO  : WARCOS (JOINT CHIEFS OF STAFF)                 120931\nINFO: CG USAFIK [struck out]\n\nITEM HAVE JUST RECEIVED THE FOLLOWING MESSAGE FROM GENERAL HODGE COLON QUOTE (CA 57792) ALTHOUGH SUGAR WILLIAM NAN NAN CHARLIE ONE SEVEN SIX SLANT ONE EIGHT STATES THAT THE MOST PRESSING TASK OF THE FORTHCOMING MEETING OF THE JOING COMMISSION SHOULD BE THE CREATION OF AN INTERIM KOREAN GOVERNMENT CMA ITEM FEEL THAT BEFORE THAT PROBLEM CAN BE FACED IT WILL BE NECESSARY TO OPEN UP THE COUNTRY AND BREAK DOWN THE SOVIET SUBQUOTE BLACKOUT PD END SUBQUOTE THE ARRANGEMENT IN THIS REGARD REACHED BY THE RECENT CONFERENCE WAS MOST UNSATISFACTORY FROM THE UNITED STATES STANDPOINT PD SOVIET DELEGATION REFUSED TO CONSIDER FREE CIRCULATION OF NEWSPAPERS CMA COMBINED RADIO NETWORK FOR BENEFIT ALL PARTIES ON EQUAL BASIS CMA AND TRAVEL OF KOREANS BETWEEN ZONES EXCEPT UNDER STRICT PERMIT SYSTEM PD ITEM ACCORDINGLY PROPOSE TO INSTRUCT AMERICAN DELEGATION TO BEGIN PROCEEDINGS OF JOINT COMMISSION WITH ABLE STRONG DEMAND FOR COMPLETE FREEDOM OF SPEECH CMA PRESS AND MOVEMENT WITHIN KOREA OF KOREANS CMA ON GROUNDS THAT UNTIL THAT IS ACCOMPLISHED JOINT COMMISSION WILL BE UNABLE FREELY TO CONSULT KOREAN PARTIES AND LEADERS AND TO LEARN DESIRES KOREAN PEOPLE REGARDING THEIR GOVERNMENT CMA ABLE PREREQUISITE STIPULATED IN MOSCOW COMMUNIQUE PD PARA ITEM AM PREPARED TO PRESS THIS POINT WITH CONSIDERABLE VIGOR AND TO POSTPONE JOINT CONSIDERATION BY THE COMMISSION OF STRUCTURE OF INTERIM GOVERNMENT UNTIL SOLUTION SATISFACTORY TO UNCLE SUGAR IS REACHED PD IF THIS VIEWPOINT IS APPROVED CMA ITEM SUGGEST ASKING STATE DEPT TO INFORM UNCLE SUGAR SUGAR ROGER THAT DESPITE CONSIDERABLE PROGRESS ACHIEVED BY RECENT ECONOMIC CONFERENCE CMA UNITED STATES GOVERNMENT FEELS THAT KOREANS ARE STILL SO RESTRICTED IN FREEDOM OF SPEECH AND MOVEMENT THAT JOINT COMMISSION WILL HAVE DIFFICULTY IN MAKING PROPER EVALUATION OF THE DESIRES AND ASPIRATIONS OF ALL CLASSES KOREAN PEOPLE PD PARA THE SOVIET GOVERNMENT MIGHT NOT RESPOND TO SUCH APPROACH BUT AT LEAST IT WOULD PUT THE UNITED STATES GOVERNMENT IN ADDITION TO USAFIK ON RECORD CMA AND WOULD PREPARE SOVIET DELEGATION IN JOINT COMMISSION OF OUR VIEWPOINT PD PARA IF MY POSITION OUTLINED ABOVE HAS BACKING OF UNITED STATES GOVERNMENT AND IF SOVIET DELEGATION IN JOINT COMMISSION DISPLAYS RELUCTANCE TO COME TO AGREEMENT CMA ITEM COULD DISCREETLY MAKE KNOWN TO KOREAN PEOPLE THROUGH THEIR CONSULTATIVE GROUP IN SOUTH KOREA THAT UNITED STATES HAS FROM BEGINNING TRIED TO BREAK DOWN BARRIER OF THREE EIGHT PARALLEL BUT THAT UNCLE SUGAR SUGAR ROGER HAS FAILED TO FOLLOW OUR LEAD PD SUCH DISCLOSURE SHOULD STRENGTHEN OUR HAND AND MIGHT CAUSE UNCLE SUGAR SUGAR ROGER DELEGATION TO ACCEDE TO OUR DESIRES PD ITEM AM CONVINCED THAT THE MORE WE OPEN UP THE COUNTRY AND CONVINCE THE PEOPLE OF OUR REAL AIMS CMA THE GREATER WILL BE THE CHANCES OF ACHIEVING TRULY DEMOCRATIC RATHER THAN ABLE SOVIET DIRECTED COMMUNISTIC KOREAN GOVERNMENT PD BENNINGHOFF CONCURS PD UNQUOTE ITEM AM IN AGREEMENT WITH HODGES SUGGESTION AND REQUEST THE GOVERNMENTS VIEWS FOR GUIDANCE\n\nMACARTHUR\n\nOFFICIAL:\n[signed] H. W. ALLEN Colonel, A.G.D.\nAsst Adjutant General DISTRIBUTION: C/S (2)\nC Govt Sec Political Adviser\n\nTOP SECRET\n-2-", "notes": ["[도장·결재] (0050) 사각 접수 도장: 「GHQ. AFPAC / 014.1 Korea TS / 13 FEB 1946 / AGO RECORDS」", "[도장·결재] (0050) 우측 하단 대형 고무인: 「AG RECORD COPY」", "[도장·결재] (0050) 본문 위 자필: 「SWNCC-176/18」 — 전문의 음성문자 표기(SUGAR WILLIAM NAN NAN CHARLIE ONE SEVEN SIX SLANT ONE EIGHT)를 문서번호로 풀어 적은 것", "[도장·결재] (0050) 본문 좌측 괄호 안 굵은 자필: 「CA 57792」 — 하지 전문의 번호를 손으로 써넣은 것", "[도장·결재] (0050) 상단 「TOP SECRET」에 자필 타원 표시와 연결선", "[도장·결재] (0050) 「INFO: CG USAFIK」 행이 통째로 가로줄로 지워져 있음", "[도장·결재] (0050·0051) 좌하단 연필 편철기호: 「7-A」 (0050 OCR 은 「7-H」로 오독)", "[도장·결재] (0050) 좌하단 자필 이니셜: 「E. B.」", "[도장·결재] (0050·0051) 상단 여백 인쇄: 「Declassified E.O. 12065 Section 3/402/ NNDG NO. ____」 — 후대의 비밀해제 표시", "편철 메모 — OCR 은 0050 의 연필을 '7-H'로 오독했으나 원본은 '7-A'"], "note": "번역자 주 — 1) 전문 본문은 전신 음성문자·기호 코드로 되어 있다 — CMA=쉼표, PD=마침표, PARA=단락 바꿈, ITEM=I(1인칭 '나'), ABLE=A(부정관사), COLON=콜론, QUOTE/UNQUOTE=인용 시작·끝, SUBQUOTE/END SUBQUOTE=인용 안의 인용, SUGAR WILLIAM NAN NAN CHARLIE ONE SEVEN SIX SLANT ONE EIGHT=SWNCC 176/18, UNCLE SUGAR=US(미국), UNCLE SUGAR SUGAR ROGER=USSR(소련), THREE EIGHT PARALLEL=38도선. 한국어 번역은 이 코드를 풀어 옮겼고, en 은 전문 표기를 그대로 살렸다. 2) 원문 타자의 오타 「JOING COMMISSION」(=JOINT)은 원본 확대로 확인했으며 고치지 않았다. 3) 전문번호 CA 57792 는 인쇄가 아니라 굵은 손글씨로 써넣은 것이며 앞의 두 글자('CA')는 잉크가 뭉개져 판독이 어렵다 — 색인 항목과 맞아 CA 57792 로 적었다. 4) 「INFO: CG USAFIK」가 지워져 있는 것은, 인용된 원 전문의 발신자가 하지 자신이므로 참조 수신에서 제외한 것으로 보인다. 5) 여기서 「최근 회담(the recent conference)」과 「최근 경제회담(recent economic conference)」은 1946년 1~2월의 미소 예비회담을 가리키는 것으로 읽히나, 원문에 명시가 없어 추정을 본문에 넣지 않았다.", "warn": false, "pages": ["0050", "0051"], "search": "존 R. 하지(General Hodge) — 주한미군사령관. 인용된 전문 CA 57792 의 발신자 더글러스 맥아더(MacArthur) — 태평양미육군총사령관. 이 전문의 발신 명의 H. 메럴 베닝호프(Benninghoff) — 주한미군사령부 정치고문. 하지의 방침에 동의 H. W. 앨런(H. W. Allen) — 대령, 부관보. 인증(OFFICIAL) 서명자 7-A CA 57792 - Task of Joint Commission in Korea."}, {"id": "7-B", "order": 702, "date": "1946-02-12", "group": "B", "eyebrow": "편철 7-B · 0052–0052면", "title": "TFGCG 281 관련 — 해당 전문을 배서(背書)를 붙여 육군부로 전송함", "badge": "Top Secret", "list_right": "7-B", "meta": [{"k": "일자", "v": "1946-02-12"}, {"k": "발신", "v": "태평양미육군총사령관(CINCAFPAC) — 맥아더(Douglas MacArthur)", "txt": true}, {"k": "수신", "v": "주한미군사령관(CG USAFIK)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "CA 57793"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0052–0052 (1면)"}, {"k": "건명", "v": "Ref TFGCG 281, indorsement to ref rad sent to WD", "txt": true}, {"k": "색인 요지", "v": "CA 57793 - Ref TFGCG 281, Indersement to ref rad sent to WD.", "txt": true, "wide": true}], "summary": "맥아더는 하지가 보낸 TFGCG 281(미소공동위원회 심의에서 취할 접근 방식)을 합동참모본부로 전송하면서, 하지의 제안에 동의하며 지침이 될 정부의 견해를 요청한다는 배서를 붙였음을 하지에게 통보한다.", "points": ["하지의 TFGCG 281 — 미소공동위원회(Joint Commission) 심의에서 사용할 접근 방식 — 을 합동참모본부에 무전으로 보냈다.", "다음의 배서를 붙였다 : '본관은 하지의 제안에 동의하며, 지침이 될 정부의 견해를 요청함.'", "이 전문 자체의 번호는 CA 57793.", "배포처는 참모장(2부), 정부부장, 정치고문."], "primary": "귀 TFGCG 281 — 공동위원회 심의에서 사용할 접근 방식 — 을 다음의 배서를 붙여 합동참모본부로 무전 송신하였음 (CA 57793) : 인용 시작 「본관은 하지(Hodge)의 제안에 동의하며, 지침이 될 정부의 견해를 요청함.」 인용 끝\n\n맥아더(MACARTHUR)", "secondary": "YOUR TARE FOX GEORGE CHARLIE GEORGE TWO EIGHT ONE REFERENCE APPROACH TO BE USED IN DELIBERATIONS JOINT COMMISSION RADIOED JOINT CHIEFS OF STAFF WITH FOLLOWING INDORSEMENT ( CA 57793 ) COLON QUOTE ITEM AM IN AGREEMENT WITH HODGES SUGGESTION AND REQUEST THE GOVERNMENTS VIEWS FOR GUIDANCE UNQUOTE\n\nMACARTHUR\n\nOFFICIAL:\nH. W. ALLEN\nColonel, A.G.D.\nAsst Adjutant General DISTRIBUTION:\nC/S (2)\nC Govt Sec Political Adviser", "notes": ["[도장·결재] 우측 상단 고무인 : 'GHQ. AFPAC / AGO RECORDS', 날짜 '13 FEB 1946'", "[도장·결재] 그 고무인 위 손글씨 : '014.1 Korea', 'T.S.'", "[도장·결재] 본문 옆 손글씨 : 'TFGCG-281', '014.1 Korea'", "[도장·결재] 상단 'TOP SECRET' 글자를 잉크로 동그라미 치고 선을 그어 본문으로 끌어내린 표시", "[도장·결재] 우측 상단 스탬프 번호 : '120933'", "[도장·결재] 본문 밑줄(잉크) : 'ITEM AM IN AGREEMENT WITH HODGES SUGGESTION AND REQUEST THE GOVERNMENTS VIEWS FOR GUIDANCE' 및 'TO BE USED IN DELIBERATIONS JOINT COMMISSION RADIOED JOINT CHIEFS OF STAFF' 구간", "[도장·결재] H. W. ALLEN 이름 위 자필 서명", "[도장·결재] 하단 고무인 : 'AG RECORD COPY'", "[도장·결재] 좌측 하단 연필 편철기호 : '7-B'", "편철 메모 — 편철 순서상 7-A(0050~0051) 뒤에 놓임"], "note": "번역자 주 — 전문은 음성문자 철자(TARE FOX GEORGE CHARLIE GEORGE = T-F-G-C-G)로 타전되었다. 'HODGES'는 원문 표기 그대로 두었다 — 실제 인물은 하지(John R. Hodge)로 소유격 'Hodge's'를 'HODGES'로 타전한 것이다. 문서 하단에 'TFGCG 281'이 다시 찍혀 있다.", "warn": false, "pages": ["0052"], "search": "하지(Hodge) — 원문 표기 'HODGES' 맥아더(MacArthur) H. W. Allen — 대령, 부관부, 부(副)부관감 7-B CA 57793 - Ref TFGCG 281, Indersement to ref rad sent to WD."}, {"id": "7", "order": 700, "date": "1946-02-11", "group": "B", "eyebrow": "편철 7 · 0053–0055면", "title": "미소공동위원회의 과업과 조선을 열어야 할 필요", "badge": "Top Secret", "list_right": "7", "meta": [{"k": "일자", "v": "1946-02-11"}, {"k": "발신", "v": "제24군단(XXIV CORPS) — 서명 하지(HODGE)", "txt": true}, {"k": "수신", "v": "연합국최고사령관(SCAP)", "txt": true}, {"k": "참조", "v": "비숍 정치고문 도쿄(BISHOP POLAD TOKYO)", "txt": true}, {"k": "전문번호", "v": "TFGCG 281"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0053–0055 (3면)"}, {"k": "건명", "v": "Task of Joint Commission and necessity to open up Korea", "txt": true}, {"k": "색인 요지", "v": "TFGCG 281-Re task of Joint Commission and necessity to open up Korea.", "txt": true, "wide": true}], "summary": "곧 열릴 미소공동위원회에서 임시정부 수립 문제를 다루기에 앞서 조선을 열고 소련의 '차단'을 깨야 한다고 보고, 언론·출판·이동의 자유를 강하게 요구하며 임시정부 구조 논의를 미루겠다는 하지의 방침을 상신하고 승인을 구한 전문이다.", "points": ["SWNCC 176/18은 곧 열릴 공동위원회 회의의 가장 시급한 과업이 조선 임시정부의 수립이라고 하고 있으나, 하지는 그 문제에 앞서 조선을 열고 소련의 '차단(blackout)'을 깨야 한다고 본다.", "최근 회담에서 이 문제에 관해 이루어진 합의는 미국 입장에서 극히 불만족스럽다. 소련 대표단은 신문의 자유로운 유통, 모든 정당에 균등하게 이로운 통합 라디오망, 엄격한 허가제 밖의 조선인 지대 간 왕래를 검토하기를 거부했다.", "따라서 하지는 미국 대표단에게 공동위원회 개시와 동시에 조선인의 조선 내 언론·출판·이동의 완전한 자유를 강하게 요구하도록 지시하려 한다. 그것이 이루어지기 전에는 위원회가 조선의 정당·지도자와 자유롭게 협의하고 조선인의 정부에 관한 희망을 알 수 없기 때문이며, 이는 모스크바 공보가 규정한 전제조건이다.", "미국에 만족스러운 해결이 나오기 전까지 위원회의 임시정부 구조 논의를 연기시킬 각오가 되어 있다.", "이 방침이 승인되면, 국무부가 소련에 대해 '최근 경제 회담의 상당한 진전에도 불구하고 조선인의 언론·이동의 자유가 여전히 제약되어 공동위원회가 각계 조선인의 희망과 열망을 제대로 평가하기 어렵다'고 통고하도록 요청할 것을 건의한다.", "소련이 응하지 않더라도 최소한 주한미군사령부에 더해 미국 정부까지 이 문제를 기록에 남기게 되고, 소련 대표단에 미국의 관점을 미리 알리는 효과가 있다.", "미국 정부의 뒷받침이 있고 소련 대표단이 합의를 꺼리면, 남조선의 협의 기구를 통해 조선인에게 '미국은 처음부터 38선의 장벽을 깨려 했으나 소련이 따르지 않았다'는 사실을 은밀히 알릴 수 있다. 이 공개는 미국의 입지를 강화하고 소련 대표단이 요구에 응하게 만들 수도 있다.", "나라를 열고 미국의 진의를 알릴수록, 소련이 세운 공산주의 조선 정부가 아니라 참으로 민주적인 조선 정부를 이룰 가능성이 커진다고 확신한다. 베닝호프(Benninghoff)도 동의한다."], "primary": "SWNCC 176/18은 곧 열릴 미소공동위원회 회의의 가장 시급한 과업이 조선 임시정부의 수립이어야 한다고 하고 있으나, 본관은 그 문제를 다루기에 앞서 이 나라를 열고 소련의 \"차단(blackout)\"을 깨는 것이 필요하리라고 본다. 이 점에 관하여 최근 회담에서 도달한 합의는 미국의 관점에서 극히 불만족스럽다. 소련 대표단은 신문의 자유로운 유통, 모든 정당에 균등한 기반 위에서 이로울 통합 라디오망, 그리고 엄격한 허가 제도를 벗어난 조선인의 지대 간 왕래를 검토하기를 거부하였다. 따라서 본관은 미국 대표단에게 공동위원회의 의사(議事)를 조선 내 조선인의 언론·출판·이동의 완전한 자유에 대한 강력한 요구로 시작하도록 지시할 것을 제안한다. 그것이 이루어지기 전까지는 공동위원회가 조선의 정당 및 지도자들과 자유롭게 협의하고 조선 국민이 자기 정부에 관하여 무엇을 바라는지 알아낼 수 없기 때문이며, 이는 모스크바 공보에 규정된 전제조건이다.\n\n본관은 이 점을 상당한 강도로 밀어붙이고, 미국에 만족스러운 해결에 이를 때까지 위원회의 임시정부 구조에 관한 공동 심의를 연기시킬 각오가 되어 있다. 이 견해가 승인된다면, 국무부에 요청하여 소련에 대해 다음과 같이 통고할 것을 건의한다 — 최근의 경제 회담으로 상당한 진전이 이루어졌음에도 불구하고, 미국 정부는 조선인의 언론과 이동의 자유가 여전히 심하게 제약되어 공동위원회가 조선 국민 각 계층의 희망과 열망을 제대로 평가하기 어려우리라고 본다.\n\n소련 정부가 그러한 접근에 응하지 않을 수도 있으나, 적어도 이는 주한미군사령부에 더하여 미국 정부까지 이 문제를 기록에 남기게 하고, 공동위원회의 소련 대표단에게 우리의 관점을 미리 알려 두는 효과가 있을 것이다.\n\n위에 밝힌 본관의 입장이 미국 정부의 뒷받침을 받고 있고 공동위원회의 소련 대표단이 합의에 이르기를 꺼리는 태도를 보인다면, 본관은 남조선의 협의 기구를 통하여 조선 국민에게 미국은 처음부터 38선의 장벽을 깨려고 노력해 왔으나 소련이 우리의 선도를 따르지 않았다는 사실을 은밀히 알릴 수 있을 것이다. 그러한 공개는 우리의 입지를 강화할 것이며 소련 대표단이 우리의 요구에 응하게 만들지도 모른다. 본관은 우리가 이 나라를 열고 국민에게 우리의 진정한 목적을 확신시킬수록, 소련이 세운 공산주의 조선 정부가 아니라 참으로 민주적인 조선 정부를 이룰 가능성이 커지리라고 확신한다. 베닝호프(Benninghoff)도 이에 동의한다.\n\n하지(HODGE)\n\n[배포·정보] 총사령관(COMMANDER-in-CHIEF) / 참모장(CHIEF OF STAFF) / 부관부(AG) / 정부과장(C GOVT SECT) / 정치고문(POLITICAL ADVISOR)\n\n---\n\n**[회부 쪽지 · 0055면]**\n\n연합국최고사령관총사령부 및 태평양미육군총사령부\n1946년 2월 17일\n발신: 부관감(ADJUTANT GENERAL)\n수신: 부관부 기록계 책임장교(OIC AG Records) — 손글씨\n편철 요망(For file) — 손글씨\nB. M. 피치(B. M. FITCH), 준장, 부관부(AGD) — 자필 서명", "secondary": "Although SWNCC 176/18 states that the most pressing task of the forthcoming meeting of the Joint Commission should be the creation of an interim Korean Government, I feel that before that problem can be faced it will be necessary to open up the country and break down the Soviet \"blackout\". The arrangement in this regard reached by the recent conference was most unsatisfactory from the United States standpoint. Soviet delegation refused to consider free circulation of newspapers, combined radio network for benefit all parties on equal basis, and travel of Koreans between zones except under strict permit system. I accordingly propose to instruct American delegation to begin proceedings of Joint Commission with a strong demand for complete freedom of speech, press and movement within Korea of Koreans, on grounds that until that is accomplished Joint Commission will be unable freely to consult Korean parties and leaders and to learn desires Korean people regarding their government, a prerequisite stipulated in Moscow communique.\n\nI am prepared to press this point with considerable vigor and to postpone joint consideration by the Commission of structure of interim government until solution satisfactory to US is reached. If this viewpoint is approved, I suggest asking State Dept to inform USSR that despite considerable progress achieved by recent economic conference, United States Govt feels that Koreans are still so restricted in freedom of speech and movement that joint commission will have difficulty in making proper evaluation of the desires and aspirations of all classes Korean people.\n\nThe Soviet Govt might not respond to such approach but at least it would put United States Govt in addition to USAFIK on record, and would prepare Soviet delegation in Joint Commission of our viewpoint.\n\nIf my position outlined above has backing of United States Govt, and if Soviet delegation in Joint Commission displays reluctance to come to agreement, I could discreetly make known to Korean people through their consultative group in South Korea that United States has from beginning tried to break down barrier of 38 parallel but that USSR has failed to follow our lead. Such disclosure should strengthen our hand and might cause USSR delegation to accede to our desires. I am convinced that the more we open up the country and convince the people of our real aims, the greater will be the chances of achieving truly democratic rather than a Soviet directed Communistic Korean Govt. Benninghoff concurs.\n\nHODGE\n\nINFORMATION:\nCOMMANDER-in-CHIEF\nCHIEF OF STAFF\nAG\nC GOVT SECT\nPOLITICAL ADVISOR\n\nTOO: 111110/I\nMCN: TJC A 14 ---\n\n[Routing slip, sheet 0055]\nGENERAL HEADQUARTERS\nSUPREME COMMANDER FOR THE ALLIED POWERS\nAND\nUNITED STATES ARMY FORCES, PACIFIC 17 FEB 1946\nFROM: ADJUTANT GENERAL\nTO: OIC AG Records [handwritten]\nFor file [handwritten]\nB. M. FITCH, Brigadier General, AGD. [signed]", "notes": ["[도장·결재] 0053 우측 여백 접수 도장 — 'GHQ. AFPAC AGO RECORDS 12 FEB 1946', 그 안 손글씨 '014.1 Korea'", "[도장·결재] 0053 본문 우측 손글씨 '×834'(선으로 그어 지움)", "[도장·결재] 0053 본문 연필 밑줄 — 'SWNCC 176/18', 'necessary to open up the country and break down the Soviet \"blackout\"' 부분", "[도장·결재] 0053 본문 위 손글씨 삽입 — 'country'(타자 위에 덧씀)", "[도장·결재] 0053 좌하단 타자 '54183' · 하단 'A. G. FILE' 도장 · 손글씨 'COPY NO. 17'", "[도장·결재] 0054 좌하단 타자 '54183' · 하단 'COPY NO.'(번호 미기재)", "[도장·결재] 0055 회부 쪽지 — 'FROM: ADJUTANT GENERAL / TO: OIC AG Records(손글씨) / For file(손글씨)', 날짜 '17 FEB 1946'(앞자리 손글씨), B. M. FITCH 자필 서명", "[도장·결재] 각 면 좌하단 연필 편철기호 '7'", "[도장·결재] 각 면 상하단 'TOP SECRET' 도장 · 'OPERATIONAL PRIORITY' 타자 · 하단 인쇄 'THE MAKING OF AN EXACT COPY OF THIS MESSAGE IS FORBIDDEN'", "편철 메모 — 0055 는 원본 이미지 하단에 연필 '7'이 있는 AG→OIC AG Records 'For file' 회부 쪽지(11 FEB 1946)"], "note": "번역자 주 — 0053면 OCR은 인쇄 상태가 나빠 크게 훼손되어 있어 원본 스캔(pages/0053.jpg)을 직접 읽어 교정했다. 0054면 마지막 문장은 'a Soviet directed Communistic Korean Govt'로 읽힌다(OCR은 'erected'로 오독). 0055면의 날짜는 인쇄된 'FEB 1946' 앞에 손글씨 숫자가 붙어 '17 FEB 1946'으로 읽히나 앞자리가 흐려 확신도가 낮다. 색인·배치표는 이 면을 11 FEB 1946으로 잡고 있다. 문서번호 SWNCC 176/18은 번역하지 않고 그대로 두었다. 원문 'Hodges purpose'(소유격 아포스트로피 없음, 0034의 인용문에도 같은 표기)는 이 면에는 없다.", "warn": false, "pages": ["0053", "0054", "0055"], "search": "하지(John R. Hodge) — 제24군단장, 발신자 베닝호프(H. Merrell Benninghoff) — 주한 정치고문 비숍(Max W. Bishop) — 도쿄 정치고문실(POLAD), 참조 수신처 B. M. 피치(B. M. Fitch) — 준장, 부관감(0055 회부 쪽지) 7 TFGCG 281-Re task of Joint Commission and necessity to open up Korea."}, {"id": "6", "order": 600, "date": "1946-01-16", "group": "C", "eyebrow": "편철 6 · 0056–0058면", "title": "조선의 경찰력 및 국방군", "badge": "Top Secret", "list_right": "6", "meta": [{"k": "일자", "v": "1946-01-16"}, {"k": "발신", "v": "육군부(WD WASH) — 합동참모본부 문서 JCS 1483/20", "txt": true}, {"k": "수신", "v": "태평양미육군총사령관 전진지휘소(CINCAFPAC ADV)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "JCS 1483/20"}, {"k": "종류", "v": "각서"}, {"k": "면", "v": "0056–0058 (3면)"}, {"k": "건명", "v": "Police Force and National Defense Forces for Korea", "txt": true}, {"k": "색인 요지", "v": "MEMO-Police force and National defense force for Korea. (JCS 1483/20).", "txt": true, "wide": true}], "summary": "「조선의 경찰력 및 국방군」에 관한 합동참모본부 문서 JCS 1483/20의 각서 본체는 참모장실로 반출되고, 문서철에는 그 사실을 적은 기록용 쪽지(NOTE FOR RECORD) 두 장(1945년 12월 30일자·1946년 1월 16일자)과 1946년 1월 26일자 회부전표만 남았다.", "points": ["건명은 「조선의 경찰력 및 국방군(Police Force and National Defense Forces for Korea)」이다.", "문서번호는 JCS 1483/20 — 조선 민사(civil affairs) 계통의 JCS 1483 시리즈다.", "0058면의 기록용 쪽지는 1945년 12월 30일자, 0056면의 기록용 쪽지는 1946년 1월 16일자로, 같은 문서번호에 두 개의 날짜가 붙어 있다.", "두 쪽지 모두 '이 각서는 빼내어 참모장실로 보냈음(THIS MEMO PULLED AND SENT TO O OF C/S)'이라고만 적혀 있다 — 각서 본체는 이 문서철에 없다.", "0057면 회부전표(1946년 1월 26일, 부관부 발)는 총사령관(1) → 참모장(2) → G-2(3) 순으로 회부되었고, '정보', '필요 조치', '열람 후 반송'에 표시가 있다.", "회부전표 하단 손글씨: '사본을 G-3·G-4와 정부부(Govt Sect)로 회부함'."], "primary": "**[0056면 — 기록용 쪽지]**\n\n기록용 쪽지(NOTE FOR RECORD)\n\nJCS 1483/20\n\n일자: 1946년 1월 16일\n\n건명: 조선의 경찰력 및 국방군(Police Force and National Defense Forces for Korea)\n\n이 각서는 빼내어 참모장실로 보냈음.\n\n**[0057면 — 회부전표]**\n\n총사령부 / 연합국최고사령관 및 태평양미육군 전진제대\n\n회부전표(ROUTING SLIP)\n\n발: 부관부(A. G.)  ·  1946년 1월 26일\n\n수신처(회부 순서): 총사령관 (1) — 참모장 (2) — G-2 (3)\n\n용건 표시: 정보 ✓  ·  필요 조치 ✓  ·  열람 후 반송 ✓\n\n[손글씨] 사본을 G-3·G-4와 정부부로 회부함\n\n**[0058면 — 기록용 쪽지]**\n\n기록용 쪽지(NOTE FOR RECORD)\n\nJ.C.S. 1483/20\n\n일자: 1945년 12월 30일\n\n건명: 조선의 경찰력 및 국방군(Police Force and National Defense Forces for Korea)\n\n이 각서는 빼내어 참모장실로 보냈음.", "secondary": "[0056]\nNOTE ROF RECORD\n\nJCS 1483/20\nDATE: 16 Jan 46 SUBJ  Police Forec and National Defense Forses for Korea\n\nTHIS MEMO PULLED AND SENT TO O OF C/S\n\n[0057]\nTOP SECRET\nGENERAL HEADQUARTERS\nSUPREME COMMANDER FOR THE ALLIED POWERS\nAND\nUNITED STATES ARMY FORCES, PACIFIC\nADVANCE ECHELON\n\nROUTING SLIP\n\nFROM: A. G.        26 JAN 1946\n\nTO: Commander-in-Chief (1) ... Chief of Staff (2) ... G-2 (3)\n[unmarked: Military Secretary, Aides-de-Camp, D C/S for Opns, G-1, G-3, G-4, Adjutant General, C Signal O, C Engineer, Antiaircraft O, Public Relations O, Inspector General, Int'l Pros Sec, C QM O, C Chem O, C Ord O, C Gov't Sec, C Surgeon, C Counter Intel O, C Publ Health & Welfare, Fiscal Director, C I & E Services, C Econ & Sc Sec, Gen Procurement Agent, C Natural Resources, C Stat & Reports, C Legal Section, Headquarters Commandant, O Civilian Personnel, FLTLOSCAP]\n\nFOR: Information [check] ... Necessary Action [check] ... Note & Return [check]\n\n[handwritten] Copy routed to G-3-4 and Govt Sect\n\nTOP SECRET\n\n[0058]\nNOTE FORN RECORD\n\nJ.C.S. 1483/20\nDATE: 30 Dec 45 SUBJ: Police Force and National Defense Forces for Korea\n\nTHIS MEMO PULLED AND SENT TO O OF C/S", "notes": ["[도장·결재] 0056면 좌하단 연필: '6'", "[도장·결재] 0057면 우상단 손글씨: '189-A'(부기 번호), 그 아래 결재 이니셜 여러 개(판독불가) — 'B'로 보이는 글자와 서명 두 개", "[도장·결재] 0057면 회부란 손글씨 숫자: 총사령관 옆 '(1)', 참모장 옆 '(2)'와 이니셜, G-2 옆 '(3)'과 이니셜", "[도장·결재] 0057면 'FOR' 란 체크 표시: Information, Necessary Action, Note & Return 세 항목에 연필 체크", "[도장·결재] 0057면 하단 손글씨: 'Copy routed to G-3-4 and Govt Sect', 그 오른쪽에 서명 이니셜(판독불가)", "[도장·결재] 0057면 좌하단 연필: '7'", "[도장·결재] 0058면 좌하단 연필: '7'로 보임(촬영 가장자리에 잘려 [판독불가])", "[도장·결재] 상단·하단 여백(마이크로필름 촬영 시 삽입): 'Declassified E.O. 12065 Section 3/402/ NNDG NO. 775091'", "편철 메모 — 본체 각서는 O of C/S 로 반출되어 NOTE FOR RECORD 만 편철. 0057 은 라우팅 슬립, 0058 은 같은 JCS 1483/20 의 30 Dec 45 자 NOTE FOR RECORD(별도 색인 항목 없음)"], "note": "번역자 주 — **이 문서철에서 가장 멀리 이어지는 문서다.** 건명 「조선의 경찰력 및 국방군」은 조선경비대(Korean Constabulary) 창설로 이어지는 계통의 출발점이며, 이미 번역해 둔 `../NDL_점령기자료`(1946.11~1948.4)가 통째로 이 주제의 후속이다. 다만 **정작 본체 각서는 이 문서철에 없다.** 남은 것은 '참모장실로 반출했다'는 기록용 쪽지 두 장과 회부전표 한 장뿐이므로, 정책 내용 자체는 이 문서철에서 복원되지 않는다. 내용 확인은 JCS 1483/20 원본(RG 218)이나 후속 문서로 대조해야 한다.\n\n원저자 오타는 고치지 않았다 — 0056면 표제 'NOTE ROF RECORD'(=FOR), 건명 'Police Forec'(=Force), 'Defense Forses'(=Forces); 0058면 표제 'NOTE FORN RECORD'.\n\n**면 배정에 유보를 둔다.** 0056면 좌하단 연필은 '6'이나, 0057면 좌하단 연필은 '7'로 읽히고 0058면도 '7'로 보인다. `raw/documents.json`은 세 면을 모두 serial 6에 묶었으나, 연필 정리기호만 보면 0057~0058면이 색인 7행에 속할 가능성이 있다. 세 면 모두 같은 JCS 1483/20 건이므로 내용상 묶어도 무방하나, 원본 대조 대상으로 남겨 둔다.\n\n0057면 회부전표의 날짜 '26 JAN 1946'은 손글씨이며 '26'이 확실하다. 0057면 우상단 '189-A'는 자신 없다.", "warn": true, "pages": ["0056", "0057", "0058"], "search": "6 MEMO-Police force and National defense force for Korea. (JCS 1483/20)."}, {"id": "5", "order": 500, "date": "1945-10-13", "group": "B", "eyebrow": "편철 5 · 0059–0059면", "title": "제24군단장의 고문회의 관계 요약 보고", "badge": "Top Secret", "list_right": "5", "meta": [{"k": "일자", "v": "1945-10-13"}, {"k": "발신", "v": "연합국최고사령관총사령부(GHQ SCAP)", "txt": true}, {"k": "수신", "v": "육군참모총장(WARCOS)", "txt": true}, {"k": "참조", "v": "태평양미육군총사령관(CINCAFPAC, 마닐라)", "txt": true}, {"k": "전문번호", "v": "CA X53231"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0059–0059 (1면)"}, {"k": "건명", "v": "Summary report from CG XXIV Corps re Advisory Council", "txt": true}, {"k": "색인 요지", "v": "CA 53231-Summery rpt received from CG XXIV CORPS in Korea re Advisory Council.", "txt": true, "wide": true}], "summary": "조선의 제24군단장이 보낸 요약 보고를 워싱턴에 중계한 발신 전문으로, 10월 5일 군정장관이 임명한 11인 조선인 고문회의의 출범과 미지근한 반응, 그리고 10월 9일 아널드 장군의 '군정이 38선 이남의 유일한 권위'라는 성명을 전한다.", "points": ["제1항 고문회의(Advisory Council) — 교육자·법률가·실업가·급진 및 보수 정치 지도자로 뽑힌 조선인 11명을 10월 5일 군정장관이 임명했다. 조선인의 정부 참여가 시작되었다는 의식을 일으키기 위한 것이다.", "김성수(원문 표기 KIG SUNG SOO)가 의장으로 선출되었다.", "고문회의에 '체면(FACE)'을 세워 주기 위한 홍보 활동이 계획되었다.", "대중과 정치 세력의 초기 반응은 미지근했다. 그 원인으로는 과거 일본 협력자 기구와의 연상, 그리고 각종 임시정부와 유사 단체들의 자기 잇속 챙기기가 꼽혔다.", "제2항 권위의 천명(Assertion of Authority) — 아널드(Arnold) 장군이 10월 9일 전 신문에 성명을 발표하여 군정이 38선 이남 조선의 유일한 권위임을 밝혔다.", "성명은 무책임한 정치 지망생들의 발언을 그치게 하도록 국민의 도덕적 영향력에 호소하면서, 악의적이고 교란적인 활동을 끝내기 위해 필요하면 무력을 쓸 뜻을 내비쳤다."], "primary": "다음은 조선에 있는 제24군단장으로부터 접수한 요약 보고임. 제1항 고문회의(Advisory Council). ( CA X53231 )\n\n교육자, 법률가, 실업가, 급진 및 보수 정치 지도자로 선발된 조선인 11명이 정부 참여가 시작되었다는 의식을 일으키기 위하여 10월 5일 군정장관에 의해 임명됨. 김성수(KIG SUNG SOO)가 의장으로 선출됨. 고문회의에 \"체면\"을 세워 주기 위한 홍보 활동이 계획됨. 대중과 정치 세력의 미지근한 초기 반응은 과거 일본 협력자 기구와의 연상 및 각종 임시정부와 유사 단체들의 자기 잇속 챙기기 탓으로 돌려짐.\n\n제2항 권위의 천명. 아널드 장군이 10월 9일 전 신문에 성명을 발표하여 군정이 38선 이남 조선의 유일한 권위임을 밝히고, 무책임한 정치 지망생들의 발언을 그치게 하도록 국민의 도덕적 영향력에 호소하면서, 악의적이고 교란적인 활동을 끝내기 위하여 필요하면 무력을 사용할 뜻을 내비침.\n\n인증(OFFICIAL):\nB. M. 피치(B. M. FITCH), 준장, 미육군, 부관감(Adjutant General)\n\n승인(APPROVED):\nW. E. 크리스트(W. E. CRIST), 준장, 미육군, 정부과장(Chief, Government Section)\n\n[배포] 참모차장(D C/S), G-1, G-2", "secondary": "FOLLOWING IS A SUMMARY REPORT RECEIVED FROM COMGEN TWENTY FOURTH CORPS IN KOREA PARA ONE ADVISORY COUNCIL PD ( CA X53231 )\n\nELEVEN KOREANS CMA SELECTED EDUCATORS CMA LAWYERS CMA BUSINESS MEN CMA RADICAL AND CONSERVATIVE POLITICAL LEADERS APPOINTED FIVE OCTOBER BY MILITARY GOVERNOR TO INITIATE CONSCIOUSNESS OF BEGINNING PARTICIPATION IN GOVERNMENT PD KIG SUNG SOO ELECTED CHAIRMAN PD PUBLICITY CAMPAIGN TO GIVE COUNCIL QUOTE FACE UNQUOTE PLANNED PD LUKEWARM INITIAL RESPONSE OF PUBLIC AND POLITICAL ELEMENTS ATTRIBUTED TO ASSOCIATION WITH FORMER JAPANESE COLLABORATIONIST COUNTERPART AND SELF SEEKING INTERESTS OF VARIOUS PROVISIONAL GOVERNMENTS AND SIMILAR BODIES PARA TWO ASSERTION OF AUTHORITY PD GENERAL ARNOLD PUBLISHED STATEMENT NINE OCTOBER ALL PAPERS THAT MILITARY GOVERNMENT WAS SOLE AUTHORITY KOREA SOUTH OF THIRTY EIGHTH PARALLEL AND CALLING UPON MORAL INFLUENCE OF PEOPLE TO STOP PRONOUNCEMENTS BY IRRESPONSIBLE POLITICAL ASPIRANTS CMA IMPLYING USE OF FORCE IF NECESSARY TO END MALICIOUS AND DISTRUBING ACTIVITIES\n\nOFFICIAL:\nB. M. FITCH\nBrigadier General, U. S. Army Adjutant General APPROVED:\nW. E. CRIST\nBrigadier General, U. S. Army Chief, Government Section Copies To:\nD C/S, G-1, G-2", "notes": ["[도장·결재] 상단 'TOP SECRET' 도장(두 겹) · 하단 'TOP SECRET' 도장", "[도장·결재] 우측 여백 접수 도장 — 'GHQ AGO RECORDS 12 OCT 1945'(연월일 일부 흐림), 그 옆 세로 손글씨 '014.1 Korea'", "[도장·결재] 발신 번호 손글씨(굵은 숫자) '131137'", "[도장·결재] 전문번호 손글씨 'CA X53231' — 인쇄된 괄호 안에 적음", "[도장·결재] 우측 여백 손글씨 '014.1 Korea' 및 세로로 쓴 판독불가 결재 메모 [판독불가]", "[도장·결재] 본문 밑줄(손) — 'SUMMARY REPORT ... PARA ONE', '(ADVISORY COUNCIL)' 부분에 원 표시", "[도장·결재] OFFICIAL 란 B. M. FITCH 자필 서명 · APPROVED 란 W. E. CRIST 자필 서명", "[도장·결재] 하단 손글씨 — 'approved by RKS' [판독불가 이니셜]", "[도장·결재] 우하단 도장 'AG RECORD COPY'", "[도장·결재] 좌하단 연필 편철기호 '5'", "[도장·결재] 상단 여백 인쇄 — 'Declassified E.O. 12065 Section 3/402/ NNDG NO.'"], "note": "번역자 주 — 평문 전보 부호를 그대로 두었다 — CMA는 쉼표, PD는 마침표, PARA는 항, QUOTE/UNQUOTE는 따옴표를 뜻한다. 한국어 번역에서는 이를 문장부호로 풀었다. 원문의 오타 'DISTRUBING'(=disturbing)은 고치지 않았다. 인명 'KIG SUNG SOO'는 김성수(金性洙)의 전신 표기로 보이며 원저자 표기를 그대로 두었다. 전문번호는 본문 안에 'CA X53231'로 손글씨 기입되어 있고 색인은 CA 53231로 잡고 있다. 면의 타자 날짜(12 October)와 발신 번호(131137)가 하루 어긋난다.", "warn": false, "pages": ["0059"], "search": "김성수(원문 표기 KIG SUNG SOO, 金性洙) — 고문회의 의장 아널드(Archibald V. Arnold, 원문 GENERAL ARNOLD) — 군정장관 B. M. 피치(B. M. Fitch) — 준장, 부관감 W. E. 크리스트(William E. Crist) — 준장, 정부과장 하지(John R. Hodge) — 원문에 이름은 없으나 발신 주체인 제24군단장 5 CA 53231-Summery rpt received from CG XXIV CORPS in Korea re Advisory Council."}, {"id": "4-F", "order": 406, "date": "1945-10-05", "group": "B", "eyebrow": "편철 4-F · 0060–0060면", "title": "조선 신탁통치 문제가 합동참모본부에서 검토 중임", "badge": "Top Secret", "list_right": "4-F", "meta": [{"k": "일자", "v": "1945-10-05"}, {"k": "발신", "v": "워싱턴(WASHINGTON) — 육군참모총장(WARCOS)", "txt": true}, {"k": "수신", "v": "태평양미육군총사령관 전진지휘소(CINCAFPAC ADV)", "txt": true}, {"k": "참조", "v": "마닐라(CINCAFPAC Manila)", "txt": true}, {"k": "전문번호", "v": "WX-72929"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0060–0060 (1면)"}, {"k": "건명", "v": "Korean trusteeship being considered by JCS", "txt": true}, {"k": "색인 요지", "v": "WX 72929-Korean Trusteeship being considered by JCS.", "txt": true, "wide": true}], "summary": "육군부는 조선 신탁통치 문제가 현재 합동참모본부에서 검토되고 있음을 도쿄에 통보하고, 앞서 보낸 WX-71814에 대한 의견을 조속히 회신하라고 요구한다.", "points": ["조선 신탁통치(Korean Trusteeship) 문제가 현재 합동참모본부에서 검토 중이다.", "WX-71814에 대한 태평양미육군총사령관의 의견을 조속한 시일 내에 회신할 것을 요구한다.", "작전 우선(OPERATIONAL PRIORITY) 등급으로 타전되었다.", "배포처는 총사령관, 참모장, 작전담당 참모차장 대리."], "primary": "조선 신탁통치 문제가 현재 합동참모본부에서 검토되고 있음. WX-71814에 대한 귀관의 의견을 조속한 시일 내에 회신 바람.\n\n육군참모총장(WARCOS)", "secondary": "Subject of Korean Trusteeship is now being considered by Joint Chiefs of Staff. Your comments on WX-71814 are desired at an early date.\n\nWARCOS\n\nTOO: 041839 Z\nMCN: USFA - 54 DISTRIBUTION:\nCOMMANDER-in-CHIEF\nCHIEF OF STAFF\nACTING DEPUTY CHIEF OF STAFF OPNS", "notes": ["[도장·결재] 우측 상단 고무인 : 'GHQ / AGO RECORDS', 날짜 '6 OCT 1945'", "[도장·결재] 그 옆 손글씨 : '014.1 Korea'", "[도장·결재] 본문 우측 손글씨 이니셜 결재 : 'RK' (그 아래 사선 표시)", "[도장·결재] 본문 상·하 고무인 : 'TOP SECRET' 및 'OPERATIONAL PRIORITY'", "[도장·결재] 하단 우측 : 'Copy No. 7'", "[도장·결재] 하단 인쇄 문구 : 'THE MAKING OF AN EXACT COPY OF THIS MESSAGE IS FORBIDDEN'", "[도장·결재] 하단 우측 고무인 : 'A.G. FI[LE]' (일부 잘림)", "[도장·결재] 좌측 하단 연필 편철기호 : '4-F'", "[도장·결재] 상단 여백 : 'Declassified E.O. 12065 Section 3/402/ NNDG NO. 775041[?]' — 번호 일부 판독불가"], "note": "번역자 주 — OCR(ocr/0060.txt)에는 본문 두 줄 중 첫 줄('Subject of Korean Trusteeship is now being considered by Joint')이 통째로 빠져 있어 원본 스캔(pages/0060.jpg)에서 직접 판독해 보완했다. 'trusteeship'은 신탁통치로 옮겼다(후견 tutelage 와 구분). 전문번호 WX-72929, 참조 전문 WX-71814 는 원본 표기 그대로다.", "warn": false, "pages": ["0060"], "search": "4-F WX 72929-Korean Trusteeship being considered by JCS."}, {"id": "4-E", "order": 405, "date": "1945-10-04", "group": "B", "eyebrow": "편철 4-E · 0061–0062면", "title": "소련과의 군사협력 계획 전망", "badge": "Top Secret", "list_right": "4-E", "meta": [{"k": "일자", "v": "1945-10-04"}, {"k": "발신", "v": "태평양미육군총사령관 전방지휘소(CINCAFPAC ADV)", "txt": true}, {"k": "수신", "v": "육군참모총장(WARCOS)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "CA 52748"}, {"k": "종류", "v": "전문"}, {"k": "면", "v": "0061–0062 (2면)"}, {"k": "건명", "v": "Prospects of a comprehensive military cooperation plan with the Russian commander in Korea", "txt": true}, {"k": "색인 요지", "v": "CA 52748-Prospects of Military cooperation plan with Russians.", "txt": true, "wide": true}], "summary": "맥아더 사령부는 국제 신탁통치가 수립되기 전 과도기 동안 하지가 조선 주둔 소련군 사령관과 포괄적 군사협력 계획을 이뤄낼 가망이 거의 없다고 보며, 그 이유는 편의의 문제가 아니라 근본 원칙의 문제 — 소련이 조선 전역에 공산주의를 세우려 전력을 기울이고 있다는 것 — 이므로 이 문제를 최고 수준의 국제적 차원에서 지체 없이 다룰 것을 건의한다.", "points": ["이 전문에 관해서는 이 문제를 상세히 논한 CA 52562와 CA 52563을, 그리고 육군부의 WX 71814를 참조하라.", "국제 신탁통치 수립 전 과도기 동안 하지 장군이 조선 주둔 소련군 사령관과 어떤 포괄적 군사협력 계획을 만들어낼 실질적 가망은 거의 없다고 본다.", "근본적 어려움은 편의(expedient)의 문제가 아니라 근본 원칙(fundamental principle)의 문제다.", "소련은 조선 전역에 공산주의를 수립하는 데 자신의 온 힘과 영향력을 쏟기로 작정하고 있다.", "소련이 조선에서 움직이는 목적은 일본 본토에서의 행동을 규정하는 목적과 정확히 같다(CA 52443 참조).", "소련은 민주주의 개념에 전적으로 반대하며, 이 이념적 충돌은 현지 군사령관들이 조정할 수 있는 것이 아니다.", "현지 소련군 사령관에게는 사실상 결정의 자유가 주어져 있지 않은 것이 매우 분명하고, 그 결과 최대한의 행동의 자유를 부여받은 하지 장군이 완전히 발이 묶여 있다.", "하지는 온갖 노력과 접근을 다했으나 소련 측의 협력·조정에 관한 한 성과가 없었다.", "이 문제는 소련 연락장교 데레뱐코(Derevyanko) 장군과 논의되었고, 소련 현지 사령관이 하지와 협력하도록 권한을 주고 지시하는 조치를 모스크바에서 얻어내도록 그에게 촉구했다.", "특히 조선 철도용 석탄 문제에 관해 이를 강하게 압박했다.", "데레뱐코는 모스크바로부터 즉각적인 회답을 약속했으나 회답은 오지 않았고, 그는 1일 모스크바로 떠났다.", "현지 수준에서 행동과 통제의 어느 정도 통일성을 세우도록 온갖 노력을 기울이겠으나, 이 문제 전체를 최고의 국제적 수준에서 지체 없이 처리할 것을 건의한다.",
