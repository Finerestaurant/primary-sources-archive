요한 경우 직접 행동을 취할 것.\n\n3. 귀관은 법과 질서의 회복 및 유지를 보장할 것. 귀관은 모든 정부 기록을 파괴로부터 보호할 것. 귀관은 실행 가능한 한 조선의 실체법 및 절차법을 존속시키되, 점령의 목표를 위태롭게 하는 모든 법률·법령 등, 특히 인종·국적·신조 또는 정치를 이유로 자유를 제약하는 법령은 폐지할 것. 귀관은 귀관이 정하는 통제 아래 민사·형사 법원을 존속시킬 것. 귀관은 위에서 폐기된 법률 또는 규정에만 근거하여 구금된 사람들을 석방할 것. 조선인 법원은 군사 점령에 주된 관련이 없는 사건에 대해 재판권을 행사한다.\n\n4. 귀관은 모든 일본의 초국가주의 영역 단체 및 비밀 애국단체와 그 계열 조직을 해산할 것.\n\n5. 귀관의 장교와 병사는 조선인을 대함에 있어 미국과 국제연합에 대한 신뢰가 생기도록 하여야 한다.\n\n6. 미국 또는 다른 국제연합 정부들의 민간 기관 대표는 귀관의 승인이 있는 경우를 제외하고는 조선에서 활동할 수 없다.\n\n7. 군대의 무장해제와 복원(復員)은 일본 본토에서와 같이 한다.\n\n8. 전범 용의자, 비일본계 외국인 및 그들의 재산에 대한 처우는 일본 본토에서와 같이 한다.\n\n9. (a) 국제연합의 모든 포로는 보호되고 송환될 것이다.\n   (b) 일본인 민간인은 귀관의 군사 점령 목표와 배치되지 않는 한 정상적인 활동을 계속해도 좋다.\n\n10. (a) 귀관은 모든 일본의 군국주의적·국가주의적 이데올로기와 선전을 제거할 것.\n    (b) 귀관은 통신 및 정보 매체에 대하여 보안과 귀관의 점령 목적 달성에 필요한 최소한의 통제와 검열만을 행할 것. 지침(gdls)에 따르는 것을 조건으로, 귀관은 정보의 배포와 민주적 이상 및 원칙의 보급을 촉진할 것.\n    (c) 보안상의 요소를 조건으로, 귀관은 민주적 정치 활동과 노동·산업·농업에서의 민주적 조직을 장려할 것.\n    (d) 귀관은 신앙의 자유를 즉시 선포하고, 보안과 점령의 목표를 조건으로 의견·언론·출판·집회의 자유를 즉시 선포할 것.\n\n11. (a) 학교는 가능한 한 조속히 존속되거나 재개될 것이다. 실행 가능한 한 모든 바람직하지 않은 교사는 해임되고 적합하고 유자격인 조선인 후임자로 교체될 것이다.\n    (b) 귀관은 모든 역사적·문화적·종교적 물건을 가능한 한 보존할 것.\n\n**(B) 경제 및 민간 보급**\n\n12. 조선의 경제 활동에 대한 통제는 귀관 부대의 소요를 충족하고 귀관의 점령 목적을 달성하는 데 필요한 만큼 부과될 것이다. 귀관은 가용한 모든 수단을 써서 식량·연료 및 그 밖의 필수 물자의 생산을 극대화하고, 그 수집과 배분을 위한 배급 또는 그 밖의 기구를 계속 운영하거나 새로 수립할 것. 귀관은 어업을 재가동하고 산업과 광업을 평화적 목적의 생산으로 전환하도록 장려할 것.\n\n13. 귀관은 탄약 및 전쟁 도구의 생산을 정지시키고, 공장·설비·특허·장부 및 기록을 포함한 일본 대(大)산업회사들의 모든 중요 재산을 보전할 것.\n\n14. 귀관은 기술적 조언과 그 밖에 긴급한 경우를 제외하고는 수입을 수반하지 않는 원조를 통하여 공중보건을 장려할 것.\n\n15. 조선의 세계 무역 관계 참여는 장려될 것이나, 이는 귀관의 통제를 조건으로 하며 그 통제는 귀관의 승인에 의해서만 외국 자산이 취득되도록 보장하고 조선이 국제 카르텔에 참여하는 것을 방지할 것이다.\n\n16. 귀관은 귀관의 점령 목적에 필요하지 않은 기술 연구를 폐쇄·보전하고, 귀관이 요구하는 조사를 위해 관계 인원을 억류할 것.\n\n17. 귀관은 조선의 자원을 극대화하고 수입에 대한 미국의 책임을 가능한 한 제한하기 위하여 필요한 모든 조치를 취할 것. 귀관은 귀관 부대와 점령의 목표를 위태롭게 할 질병 및 소요를 방지하는 데 필요한 필수 품목의 수입에 대해서만 책임을 진다. 이 경우 귀관은 귀관의 관할 아래 있는 다른 지역의, 또는 협정에 의하여 귀관의 관할 밖에 있는 인근 지역의 잉여물자를 활용할 것. 귀관의 점령 목적을 달성하기 위하여 추가 수입에 대한 책임을 져야 한다고 판단되면, 귀관은 즉시 합동참모본부에 건의를 제출할 것. 수입된 물자는 가능한 한 조선인 기구가 귀관이 만족하는 정책과 절차에 따라 배분할 것이다. 귀관은 군사적 필요가 요구할 때 물자를 직접 구호로 지급할 것.\n\n**(C) 재정** (WX 54175, 59010 및 60420 참조)\n\n18. 귀관은 전쟁 자금 조달 또는 식민지·점령지의 금융 자원 지배를 주된 목적으로 삼아 온 일본계 은행 및 그 밖의 기관의 모든 지점을 통제하고, 실행 가능한 한도에서 가능한 한 조속히 폐쇄할 것.\n\n19. 귀관은 점령 목적을 달성하는 데 필요한 재정 조치를 취할 것이며, 여기에는 다음이 포함된다.\n    (a) (제18항의 은행에 더하여) 통제를 도입하거나 문제 있는 인원을 제거하거나 동결 계획에 관련된 조치를 취하기 위한 목적에 한한 은행의 폐쇄 및 그 은행들의 가능한 한 신속한 재개.\n    (b) 사유 또는 공유 유가증권·부동산 및 그 밖의 재산 거래의 금지 또는 규제.\n    (c) 일반적 또는 제한적 모라토리엄의 설정. 그리고\n    (d) 귀관이 적절하다고 인정하는 기간 동안의 증권거래소·보험회사 및 유사 금융기관의 폐쇄.\n\n20. 귀관은 (신체 장애로 인한 것을 제외한) 군인 연금의 지급과 다음에 해당하는 모든 공적·사적 연금의 지급을 금지할 것.\n    (a) 금지된 국가주의 단체의 구성원이었음을 이유로 하는 것, 그리고\n    (b) 이 지령의 규정에 따라 억류되었거나 공직에서 해임된 자에 대한 것.\n\n21. 귀관은 모든 금·은·백금·통화·유가증권·신용·귀중 서류, 일본 중앙정부 또는 지방정부의 자산, 위 제4항에 따라 금지된 단체의 자산, 부당하게 압수되거나 이전된 재산, 문화적 또는 물질적 가치가 있는 미술품, 그리고 다음의 주체가 어떤 방식으로든 지배하는 재산을 압류하거나 동결할 것.\n    (a) 독일·이탈리아·불가리아·루마니아·헝가리의 정부·국민 또는 거주자. 여기에는 이들 나라 또는 일본이 이전에 점령했던 영역(조선은 제외)이 포함된다.\n    (b) 일본 국적의 부재 소유자. 또는\n    (c) 체포되거나 억류된 조선인. 이 모든 물건은 귀관의 지시와 엄격한 통제 아래에서만 처리될 것이다.\n\n22. 귀관은 모든 외국환 거래를 통제할 것이며, 귀관의 건의에 따라 합동참모본부가 인가하는 경우를 제외하고는 일본에 대한 어떠한 신용 공여도 허용하지 않을 것.\n\nWARCOS(육군참모총장)\n\n[배포] 총사령관(COMMANDER IN CHIEF) / 참모장(CHIEF OF STAFF) / 참모차장(DEPUTY CHIEF OF STAFF)", "secondary": "A proposed directive PCT prepared by an interdepartmental committee, for administration of Civil Affairs in United States-Occupied portions of Korea is now being considered by the Joint Chiefs of Staff. Summary of the proposed directive is contained in this message with a view to providing initial guidance concerning policies being considered and also for the purpose of obtaining your comments.\n\nSince no coordination with the USSR (or other nations) has been undertaken by the State Department as yet on detailed matters concerning Korea, dependence will have to be placed on such liaison as you can expect with the Russians on a military level for reestablishment and maintenance of normal economic and political relationships throughout the whole of Korea. The present thought of the State Department is that the initial period involving 2 zones should be followed as early as practicable by a Centralized Administration under US-USSR-CHINA-UK Quadripartite control. This may be followed in turn by an International Trusteeship of the same 4 powers.\n\nThe directive summarized below includes objectives which, in many cases, are long range. Request your detailed comments on the following summary:\n\n(A) General and political:\n\n1. Purposes of occupation are:\n(a) To insure compliance with the surrender of Jap Forces in Korea;\n(b) To effect complete political and administrative separation of Korea from Jap social, economic, and financial control;\n(c) To facilitate development of a sound Korean economy; and\n(d) To foster establishment of local self-government leading towards restoration of a free, independent and responsible Korea.\n\n2. You will utilize local, regional and National agencies of existing Government to maximum extent, eliminating those inconsistent with purposes of occupation. As rapidly as feasible all Japanese, and all Koreans who have been exponents of Japanese Nationalism and aggression, or who manifest hostility to the objectives of occupation, will be eliminated from positions of responsibility or influence in public or important private enterprise. Where no qualified Koreans or other suitable personnel are available to replace them, such Japanese or pro-Jap Koreans as are deemed essential by reason of their technical qualifications, may be temporarily continued in positions of responsibility, security factors permitting. You will take direct action where required.\n\n3. You will assure restoration and maintenance of law and order. You will protect against destruction all Government records. You will continue, so far as practical, substantial and procedured law in Korea, abolishing all laws, decrees, et cetera, which jeopardize objectives of occupation, particularly those restricting liberties on grounds of race, nationality, creed or politics. You will continue civil and criminal courts subject to such control as you may determine. You will release people held solely under laws or regulations abrogated above. Korean courts will exercise jurisdiction over cases not of predominant concern to military occupation.\n\n4. You will dissolve all Japanese ultra-nationalistic territory and secret patriotic societies and affiliates.\n\n5. Your officers and troops should so treat the Koreans as to develop confidence in the United States and the United Nations.\n\n6. Representatives of civilian agencies of United States or other United Nations governments shall not function in Korea except upon your approval.\n\n7. Disarmament and demobilization of troops will be as in Japan proper.\n\n8. Treatment of suspected war criminals, non-Japanese foreign nationals, and their property will be as in Japan proper.\n\n9. (a) All prisoners of war of the United Nations will be cared for and repatriated.\n(b) Civilian Japanese may continue normal activities consistent with objectives of your military occupation.\n\n10. (a) You will eliminate all Japanese militaristic and nationalistic ideology and propaganda.\n(b) You will exercise such minimum control and censorship over communications and media of information as are necessary for security and accomplishment of purposes of your occupation. Subject to gdls you will facilitate distribution of information and dissemination of democratic ideals and principles.\n(c) Subject to security factors you will encourage democratic political activity and democratic organizations in labor, industry and agriculture.\n(d) You will promptly proclaim freedom of religious worship, and, subject to security and objectives of occupation, freedom of opinion, speech, press and assembly.\n\n11. (a) Schools will be continued or reopened as soon as possible. If so far as practicable all undesirable teachers will be removed and replaced with suitable, qualified Korean successors.\n(b) You will preserve as far as possible all historical, cultural and religious objects.\n\n(B.) Economic and civilian supply:\n\n12. Control over Korean economic activity will be imposed as may be necessary to meet the needs of your forces and to accomplish the purposes of your occupation. You will use all available means to maximize production of feedstuffs, fuel and other essential goods, continuing or establishing rationing or other machinery for collection and distribution thereof. You will reactivate fishing and encourage conversion of industry and mining to production for peaceful purposes.\n\n13. You will suspend munition and implements of war production, safeguard all significant property of large Japanese Industrial Companies including plant, equipment, patents and books and records.\n\n14. You will encourage public health through technical advice and such other assistance as does not involve imports except in emergency.\n\n15. Korean participation in world trade relations will be encouraged, subject to your control, which will insure acquisition of foreign assets only by your approval and prevent Korean participation in international cartels.\n\n16. You will close and secure technological research not necessary for purposes of your occupation, and detain personnel for investigation you require.\n\n17. You will take all necessary measures to maximize Korean resources, to limit as far as possible United States responsibility for imports. You will be responsible for imports of only essential items as necessary to prevent such disease and unrest as would endanger your forces and the objectives of the occupation. In this event you will utilize surpluses in other areas under your jurisdiction or, by agreement, in nearby areas not under your jurisdiction. You will promptly submit recommendation to Joint Chiefs of Staff if you feel that you should assume responsibility for additional imports in order to accomplish the purposes of your occupation. Imported supplies will be distributed, in so far as possible, by Korean agencies, in accordance with policies and p[roce]ses satisfactory to you. You will issue supplies as direct relief when military necessity requires.\n\n(C). Financial (reference WX 54175, 59010 and 60420):\n\n18. You will control, and to the extent practicable, close as soon as possible all branches of Japanese banks and other institutions whose main purpose has been financing of the war or control of financial resources in colonial or occupied territories.\n\n19. You will take such financial measures as are necessary to accomplish purposes of occupation including:\n(a) Closing of banks (in addition to those in paragraph 18) only for purpose of introducing control, removing objectionable personnel or taking measures connected with blocking program, reopening these banks as promptly as possible;\n(b) Prohibition or regulation of dealings in private or public securities, real estate or other property;\n(c) Establishment of general or limited moratoria; and\n(d) Closing of stock exchanges, insurance companies and similar financial institutions for such periods as you deem appropriate.\n\n20. You will prohibit payment of military pensions (save for physical disability) and all public and private pensions:\n(a) By reason of membership in banned nationalistic societies, and\n(b) To persons interned or removed from office under provision of this directive.\n\n21. You will impound or block all gold, silver, platinum, currencies, securities, credits, valuable papers, assets of Japanese central or local government or societies prohibited by paragraph 4 above, property which has been wrongfully seized or transferred, works of art of cultural or material value, and property controlled in any manner by\n(a) Governments, nationals, or residents of Germany, Italy, Bulgaria, Rumania, Hungary including territories formerly occupied thereby or by Japan, except Korea,\n(b) Absentee owners of Jap nationality, or\n(c) Any Korean arrested or interned. All such items will be dealt with only under your instructions and strict control.\n\n22. You will control all foreign exchange transactions, and will allow no extension of credit to Japan, save as may be authorized by Joint Chiefs of Staff upon your recommendation.\n\nWARCOS\n\nTOO: 100703 I\nMCN: WVY 3/10 Y 125 DISTRIBUTION: COMMANDER IN CHIEF / CHIEF of STAFF / DEPUTY CHIEF OF STAFF", "notes": ["[도장·결재] 0168 우측 여백 접수 도장 — 'GHQ AGO RECORDS 11 SEP 1945', 그 옆 손글씨 '014.1 Korea'", "[도장·결재] 0168 하단 도장 'A. G. FILE' · 인쇄 'COPY NO.' 옆 손글씨 '7' · 좌하단 타자 '1452'", "[도장·결재] 각 면 하단 인쇄 문구 'THE MAKING OF AN EXACT COPY OF THIS MESSAGE IS FORBIDDEN' · 상하단 'TOP SECRET' 도장", "[도장·결재] 0168 좌측 여백 손글씨 십자표(+) 2개 — 제1항 (b)와 (c) 옆", "[도장·결재] 0169·0170 하단 도장 'A. G. FILE', 'COPY NO. 7'", "[도장·결재] 0170 좌측 여백 연필 표시 '×' — (B) 경제 및 민간 보급 항 옆", "[도장·결재] 0171 우하단 손글씨 — 'Par[s] 1, B & C extracted by ESS 13 Oct 45' 및 판독불가 서명 이니셜 [일부 판독불가]", "[도장·결재] 0171 하단 타자 배포처 — COMMANDER IN CHIEF / CHIEF of STAFF / DEPUTY CHIEF OF STAFF, 그 옆 'A. G. FILE' 도장과 'COPY NO. 7'", "[도장·결재] 각 면 좌하단 연필 편철기호 '1'", "편철 메모 — 이 문서철의 마지막 면(0171)에서 끝난다. 이 항목만 하단 편철기호가 없다(계열 본체 serial '1' 이라 기호 미표기)."], "note": "번역자 주 — 원문 오타·시대 표기를 그대로 두었다. (1) 'PCT'는 1면 첫 문장의 정체불명 약어로 원문 그대로 두었다. (2) 제3항 'substantial and procedured law'는 'substantive and procedural law'의 원저자 오기로 보이나 그대로 두었다. (3) 제4항 'ultra-nationalistic territory ... societies'는 'territorial'의 오기로 보이나 그대로 두었다. (4) 제10항 (b)의 'gdls'는 'guidance'류 약어로 보이나 확정하지 않고 그대로 두었다. (5) 제11항 (a) 'If so far as practicable'은 'In so far as'의 오기로 보이나 그대로 두었다. (6) 제17항 'policies and p[roce]ses' 부분은 원본에서 활자가 흐려 판독이 어려워 추정 부분을 대괄호로 표시했다. (7) 'Jap Forces', 'pro-Jap Koreans', 'Absentee owners of Jap nationality' 등 멸칭 'Jap'이 원문에 그대로 나오며 부드럽게 고치지 않고 옮겼다. (8) 1면 NR 란은 'WX 61967   9th'로 타자되어 있다. (9) 전문 머리의 참조 전문번호(WX 54175, 59010, 60420)는 읽은 그대로 두었다. (10) 이 4면(0168~0171)이 문서철의 마지막 면이며, 계열 본체이므로 하단 편철기호는 '1'이다.", "warn": false, "pages": ["0168", "0169", "0170", "0171"], "search": "WARCOS(육군참모총장) — 서명자 직명. 당시 조지 마셜(George C. Marshall) 1 WX 61967 - Proposed directive for admin of Civil Affairs in US occupied portions of Korea."}]</script>
<script id="conf" type="application/json">{"pages": {"dir": "../pages", "ext": "jpg", "label": "원본 스캔", "thumbs": "../thumbs", "thumb_ext": "jpg"}, "chrono": {"from": "1943-09-01", "to": "1948-12-31", "note": "열람기 아래쪽에 늘 떠 있는 연대 바의 눈금이다. 문서 하나를 읽을 때 그것이 어느 시점의 것인지 잡아 준다. 문서철을 가리지 않고 공용으로 쓴다. note 는 사건에 마우스를 올렸을 때 뜨는 요약이다 — 두세 문장을 넘기지 마라.", "events": [{"date": "1943-11-27", "label": "카이로 선언", "key": true, "where": "카이로", "note": "미·영·중 3국 수뇌가 대일 전후 처리를 합의해 발표했다. 조선에 관한 대목은 「적당한 시기에(in due course) 자유롭고 독립된 나라가 되게 한다」였다. 이 묶음이 좇는 문구가 여기서 태어난다."}, {"date": "1943-11-28", "label": "테헤란 회담", "where": "테헤란", "note": "루스벨트·처칠·스탈린의 첫 3자 회담. 유럽 제2전선(노르망디)의 시기가 정해졌고, 스탈린은 독일 항복 뒤 대일전 참전을 처음으로 시사했다."}, {"date": "1944-06-06", "label": "노르망디 상륙", "note": "연합군이 프랑스 북부에 상륙해 서부 제2전선이 열렸다. 유럽 전쟁의 승패가 사실상 이때 갈렸고, 미국 안에서 「그다음은 일본」이라는 계산이 본격화된다."}, {"date": "1944-10-20", "label": "레이테 상륙", "where": "필리핀", "note": "맥아더가 필리핀 탈환에 착수했다. 뒤이은 레이테만 해전에서 일본 연합함대가 무너져, 일본 본토와 남방 자원지대를 잇는 해상 수송로가 끊긴다."}, {"date": "1945-02-04", "label": "얄타 회담", "key": true, "where": "크림반도 얄타", "note": "루스벨트·처칠·스탈린의 두 번째 3자 회담. 소련의 대일 참전 조건이 비밀협정으로 정해졌고, 루스벨트가 스탈린에게 조선의 신탁통치를 꺼내며 「20년에서 30년」이라 말했다. 카이로의 「적당한 시기」에 처음으로 숫자가 붙은 자리다."}, {"date": "1945-03-10", "label": "도쿄 대공습", "note": "B-29 편대의 야간 소이탄 공습으로 도쿄 시가지가 불탔다. 하룻밤 사망자가 10만 명 안팎으로 추정된다. 일본 안에서 본토 방위가 불가능하다는 인식이 퍼지기 시작한다."}, {"date": "1945-04-01", "label": "오키나와 전투", "note": "미군이 오키나와에 상륙해 6월까지 싸웠다. 사상자 규모가 본토 상륙전의 비용을 가늠하는 근거가 되어, 원폭 사용과 소련 참전 요청 양쪽의 논거로 쓰인다."}, {"date": "1945-04-12", "label": "루스벨트 사망", "note": "루스벨트가 급서하고 트루먼이 승계했다. 트루먼은 얄타의 비밀협정도 원폭 개발도 취임 뒤에야 통보받았다. 조선 신탁통치 구상을 밀던 사람이 사라진 자리다."}, {"date": "1945-05-02", "label": "베를린 함락", "note": "소련군이 베를린을 함락했다. 이틀 전 히틀러가 자살했고, 남은 것은 항복 절차뿐이었다. 도쿄의 일본 지도부는 이 소식을 스위스·스웨덴 공관과 외신을 통해 받아 본다."}, {"date": "1945-05-08", "label": "독일 항복", "key": true, "note": "독일이 무조건 항복해 유럽 전쟁이 끝났다. 일본은 마지막 동맹을 잃었고, 소련은 대일전으로 병력을 돌릴 수 있게 됐다. 이 소식에 대한 일본 안팎의 반응이 이 묶음의 「기」에 해당한다."}, {"date": "1945-07-17", "label": "포츠담 회담", "where": "베를린 근교 포츠담", "note": "트루먼·처칠(뒤에 애틀리)·스탈린의 회담. 회담 중 원폭 실험 성공이 보고되고, 대일 최후통첩의 문안이 다듬어진다."}, {"date": "1945-07-26", "label": "포츠담 선언", "note": "미·영·중 명의로 일본에 무조건 항복을 요구했다. 제8항에 「카이로 선언의 조항은 이행되어야 한다」고 못박아, 조선 독립 약속이 항복 조건 안으로 들어온다. 일본은 이를 묵살(黙殺)한다고 발표했다."}, {"date": "1945-08-06", "label": "히로시마", "key": true, "note": "히로시마에 원자폭탄이 투하됐다. 트루먼은 같은 날 성명을 내 「이제껏 없던 폭탄」임을 알리고 항복하지 않으면 파멸이 이어질 것이라 경고했다."}, {"date": "1945-08-08", "label": "소련 참전", "note": "소련이 일본에 선전포고하고 이튿날 만주로 진공했다. 얄타에서 약속한 「독일 항복 뒤 3개월」을 지킨 날짜다. 미국이 조선에 지상군을 두려면 시간이 없다는 것이 이날 분명해진다."}, {"date": "1945-08-09", "label": "나가사키", "note": "나가사키에 두 번째 원자폭탄이 투하됐다. 같은 날 밤 어전회의가 열려 국체 유지를 조건으로 한 항복 제의가 정해진다."}, {"date": "1945-08-11", "label": "38선 획정", "key": true, "note": "일반명령 제1호(SWNCC 21/5)가 고쳐지면서 조선이 북위 38도로 갈렸다. 한 문서의 b항과 f항, 다섯 조항 사이에 조선이 둘로 나뉘어 적혔다. 합참이 든 이유는 미군에게 경성의 항만과 교통 지역을 주기 위해서였다."}, {"date": "1945-08-15", "label": "일본 항복", "key": true, "note": "일본이 포츠담 선언 수락을 방송으로 알렸다. 전날 밤 일부 장교들이 방송을 막으려 궁성을 봉쇄하고 총리 관저를 습격했으나 실패했고, 아나미 육군대신은 새벽에 자결했다."}, {"date": "1945-09-02", "label": "항복문서 조인", "where": "도쿄만 미주리함", "note": "도쿄만의 미주리함 위에서 항복문서에 서명했다. 이 문서로 연합국최고사령관(SCAP)의 권한이 발효되고, 일반명령 제1호가 법적 효력을 갖는다."}, {"date": "1945-09-08", "label": "미군 인천 상륙", "key": true, "note": "하지 중장의 제24군단이 인천에 상륙해 이튿날 조선총독부의 항복을 받았다. 미군정이 시작된다. 닷새 뒤 하지는 카이로의 「in due course」가 조선어로 「수일 내」로 옮겨져 퍼져 있었다는 것을 알게 된다."}, {"date": "1945-12-27", "label": "모스크바 3상회의", "key": true, "note": "미·영·소 외상이 조선에 최대 5년의 신탁통치를 두고 미소공동위원회를 설치하기로 합의했다. 카이로의 「적당한 시기」가 마침내 문서상의 기한이 된 자리이자, 조선 안에서 신탁통치 반대 운동이 폭발한 계기다."}, {"date": "1946-03-20", "label": "1차 미소공동위", "where": "서울", "note": "임시정부 수립을 협의할 미소공동위원회가 열렸다. 어느 정당·사회단체와 협의할 것인가를 두고 갈라져 5월에 결렬된다."}, {"date": "1946-10-01", "label": "대구 10월 사건", "note": "식량 공출과 경찰에 대한 항의가 대구에서 시작해 남한 전역으로 번졌다. 미군정이 계엄을 선포하고 진압했다. 점령 1년 만에 통치의 정당성이 시험대에 오른 사건이다."}, {"date": "1947-05-21", "label": "2차 미소공동위", "where": "서울", "note": "미소공동위원회가 다시 열렸으나 같은 쟁점에서 다시 갈라져 10월에 사실상 끝난다. 미국은 이 무렵부터 조선 문제를 유엔으로 넘기는 쪽으로 방향을 바꾼다."}, {"date": "1947-09-17", "label": "한국 문제 유엔 이관", "key": true, "note": "미국이 조선 문제를 유엔 총회에 상정했다. 4개국 신탁통치라는 전시 구상이 공식적으로 폐기되고, 처리의 무대가 미소 양자에서 유엔으로 옮겨간다."}, {"date": "1948-01-08", "label": "유엔한국임시위원단 입국", "note": "유엔한국임시위원단(UNTCOK)이 서울에 들어왔다. 소련이 북위 38도 이북 입경을 거부해, 감시할 수 있는 지역에서만 선거를 치른다는 결론으로 이어진다."}, {"date": "1948-05-10", "label": "5·10 총선거", "key": true, "note": "남한만의 제헌국회 선거가 치러졌다. 좌익과 김구·김규식 계열이 불참했다. 분단이 절차를 갖춘 사실이 되는 날이다."}, {"date": "1948-08-15", "label": "대한민국 정부 수립", "key": true, "note": "대한민국 정부가 수립되고 미군정이 끝났다. 카이로에서 「in due course」라고 적힌 지 4년 9개월 뒤다. 북에서는 9월 9일 조선민주주의인민공화국이 수립된다."}]}, "terms": {"_": [{"w": "S.E.R.I.A.L. 514", "k": "_:25", "href": "#1-W", "doc": "1-W"}, {"w": "S.W.N.C.C. 101/4", "k": "_:27", "href": "#1-K", "doc": "1-K"}, {"w": "S.W.N.C.C. 176/8", "k": "_:28", "href": "#1-T", "doc": "1-T"}, {"w": "S.W.N.C.C. 79/1", "k": "_:29", "href": "#1-K", "doc": "1-K"}, {"w": "T.F.Y.M.G. 1728", "k": "_:41", "href": "#1-U", "doc": "1-U"}, {"w": "J.C.S. 1483/15", "k": "_:13", "href": "#1-T", "doc": "1-T"}, {"w": "J.C.S. 1483/23", "k": "_:14", "href": "#8-A", "doc": "8-A"}, {"w": "J.C.S. 1483/24", "k": "_:15", "href": "#8-B", "doc": "8-B"}, {"w": "J.C.S. 1483/25", "k": "_:16", "href": "#8-A", "doc": "8-A"}, {"w": "J.C.S. 1483/26", "k": "_:17", "href": "#8-A", "doc": "8-A"}, {"w": "J.C.S. 1483/15", "k": "_:18", "href": "#1-M", "doc": "1-M"}, {"w": "J.C.S. 1483/20", "k": "_:19", "href": "#6", "doc": "6"}, {"w": "T.F.G.C.G. 281", "k": "_:31", "href": "#7", "doc": "7"}, {"w": "T.F.G.C.G. 285", "k": "_:32", "href": "#7-C", "doc": "7-C"}, {"w": "T.F.G.C.G. 301", "k": "_:33", "href": "#7-E", "doc": "7-E"}, {"w": "T.F.G.C.G. 302", "k": "_:34", "href": "#7-F", "doc": "7-F"}, {"w": "T.F.G.C.G. 334", "k": "_:35", "href": "#9", "doc": "9"}, {"w": "T.F.G.C.G. 352", "k": "_:36", "href": "#7-J", "doc": "7-J"}, {"w": "T.F.G.C.G. 382", "k": "_:37", "href": "#1-X", "doc": "1-X"}, {"w": "T.F.X.A.G. 381", "k": "_:40", "href": "#10", "doc": "10"}, {"w": "J.C.S.1483/15", "k": "_:13", <script>/* 호버 카드 — 링크에 머물면 그 문서의 요약을 미리 보여 준다.
 *
 *   <a href="cairo-1943/#d309" data-card="cairo-1943:d309">…<\/a>
 *   그리고 HoverCard.init(CARDS) 를 부른다.
 *
 * CARDS 는 { "문서철:문서id": {…} } 꼴이다. 값의 항목은 전부 없어도 된다 —
 * 없는 줄은 통째로 빠진다.
 *
 *   { title, date, route, sum, points: [], pages: 3, badge }
 *
 * 화면 밖으로 나가지 않게 자리를 잡고, 키보드 초점에도 뜬다.
 * 손가락으로 쓰는 기기(hover: none)에서는 CSS 가 카드를 감춘다 — 링크는 그대로다.
 */
window.HoverCard = (function () {
  var DATA = {}, el = null, cur = null, showT = 0, hideT = 0;
  var DELAY = 260, HIDE = 140;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function ensure() {
    if (el) return el;
    el = document.createElement('div');
    el.className = 'hc';
    el.setAttribute('role', 'tooltip');
    document.body.appendChild(el);
    return el;
  }

  function html(d) {
    var pts = (d.points || []).slice(0, 2).map(function (p) {
      return '<li>' + esc(p) + '<\/li>';
    }).join('');
    return '<div class="hc-top"><span>' + esc(d.date || '날짜 미상') + '<\/span>' +
             (d.badge ? '<span class="id">' + esc(d.badge) + '<\/span>' : '') +
           '<\/div>' +
           '<h4>' + esc(d.title || '') + '<\/h4>' +
           (d.route ? '<p class="hc-route">' + esc(d.route) + '<\/p>' : '') +
           (d.sum ? '<p class="sum">' + esc(d.sum) + '<\/p>' : '') +
           (pts ? '<ul>' + pts + '<\/ul>' : '') +
           (d.go === false && !d.pages ? '' :
             '<div class="hc-foot"><span>' +
               (d.pages ? esc(d.pages) + '면' : '') +
             '<\/span>' +
             (d.go === false ? '' : '<span class="go">눌러서 원문 보기 →<\/span>') +
             '<\/div>');
  }

  /* 링크 옆에 놓되 화면 밖으로 나가지 않게 민다. 위아래는 공간이 넓은 쪽으로. */
  function place(a) {
    var r = a.getBoundingClientRect();
    var w = el.offsetWidth, h = el.offsetHeight, m = 12;
    var top = r.bottom + 8;
    if (top + h > innerHeight - m && r.top - h - 8 > m) top = r.top - h - 8;
    top = Math.max(m, Math.min(top, innerHeight - h - m));
    var left = Math.min(r.left, innerWidth - w - m);
    el.style.top = top + 'px';
    el.style.left = Math.max(m, left) + 'px';
  }

  function show(a) {
    var d = DATA[a.dataset.card];
    if (!d) return;
    ensure();
    el.innerHTML = html(d);
    el.style.visibility = 'hidden';
    el.setAttribute('data-open', '');
    place(a);                    // 크기를 잰 뒤에 자리를 잡아야 한다
    el.style.visibility = '';
    cur = a;
  }

  function hide() {
    if (!el) return;
    el.removeAttribute('data-open');
    cur = null;
  }

  function bind(a) {
    function enter() {
      clearTimeout(hideT);
      clearTimeout(showT);
      showT = setTimeout(function () { show(a); }, DELAY);
    }
    function leave() {
      clearTimeout(showT);
      hideT = setTimeout(hide, HIDE);
    }
    a.addEventListener('mouseenter', enter);
    a.addEventListener('mouseleave', leave);
    a.addEventListener('focus', function () { clearTimeout(hideT); show(a); });
    a.addEventListener('blur', leave);
  }

  return {
    init: function (data, root) {
      // 덮어쓰지 않고 얹는다 — 본문 용어와 연대 바가 서로 다른 때에 init 을 부른다
      var add = data || {};
      for (var k in add) if (Object.prototype.hasOwnProperty.call(add, k)) DATA[k] = add[k];
      var scope = root || document;
      [].forEach.call(scope.querySelectorAll('[data-card]'), bind);
      addEventListener('scroll', function () { if (cur) place(cur); }, true);
      addEventListener('keydown', function (e) { if (e.key === 'Escape') hide(); });
    },
    hide: hide
  };
})();
</script>

/* 본문에서 특별 취급하는 것은 두 가지뿐이다.
   [1050면] → 원본 지면 구분선(스캔이 있으면 눌러서 열린다), [주74] → 각주 참조.
   d777처럼 편집 이력을 취소선·굵게로 복원한 문서가 있어 인라인 서식도 함께 푼다. */
function marks(t){
  const cls = PG ? 'pagemark hit' : 'pagemark';
  const tail = PG ? '면 · 원본 보기' : '면';
  return esc(t)
    .replace(/\[(\d+)면\]/g, `<span class="${cls}" data-pg="$1">$1${tail}</span>`)
    .replace(/\[주(\d+)\]/g, '<span class="fnref">$1</span>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

/* 줄머리의 마크다운. 번역이 길어지면 옮긴 쪽이 `## 소제목` 과 `- 항목` 으로
   나눠 두는데, 그대로 두면 우물정자와 붙임표가 본문에 그냥 찍힌다.
   본문 상자가 pre-wrap 이라 문단을 다시 짜지 않고 줄 단위로만 푼다. */
function blocks(t){
  const out = [];
  for (const line of String(t == null ? '' : t).split('\n')){
    let m;
    if ((m = /^(#{1,6})\s+(.*)$/.exec(line)))
      out.push(`<b class="mdh h${m[1].length}">${marks(m[2])}</b>`);
    else if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line))
      out.push('<hr class="mdhr">');
    else if ((m = /^\s*>\s?(.*)$/.exec(line)))
      out.push(`<span class="mdq">${marks(m[1])}</span>`);
    else if ((m = /^\s*(\d+)[.)]\s+(.*)$/.exec(line)))
      out.push(`<span class="mdli" data-n="${esc(m[1])}.">${marks(m[2])}</span>`);
    else if ((m = /^\s*[-*+]\s+(.*)$/.exec(line)))
      out.push(`<span class="mdli">${marks(m[1])}</span>`);
    else
      out.push(marks(line) + '\n');
  }
  return out.join('').replace(/\n$/, '');
}

const haystack = d => [d.id, d.date, d.title, d.eyebrow, d.summary, d.search,
    (d.points||[]).join(' '), (d.meta||[]).map(m=>m.v).join(' '),
    (d.notes||[]).join(' '), d.note, d.primary, d.secondary]
  .join(' ').toLowerCase();

function visible(){
  const q = state.q.trim().toLowerCase();
  let out = DOCS.filter(d => {
    if (state.groups.size && !state.groups.has(d.group)) return false;
    return !q || haystack(d).includes(q);
  });
  if (state.sort === 'date')
    out.sort((a,b) => (a.date||'9999').localeCompare(b.date||'9999') || a.order - b.order);
  else if (state.sort)
    out.sort((a,b) => a.order - b.order);
  return out;
}

function renderList(){
  const items = visible();
  $('#count').textContent = `${items.length}건`;
  $('#list').innerHTML = items.map(d => `
    <button class="item t${d.group||'X'}" data-id="${esc(d.id)}"
            aria-current="${state.cur===d.id}">
      <div class="item-top"><span>${esc(d.date||'날짜미상')}</span>
        <span>${esc(d.list_right||'')}</span></div>
      <div class="item-sum">${esc(d.title||d.id)}</div>
    </button>`).join('') ||
    '<div class="empty">해당하는 문서가 없다.</div>';
}

function pane(kind){
  const d = DOCS.find(x => x.id === state.cur);
  const txt = kind==='primary' ? d.primary : d.secondary;
  if (!txt) return '';
  const cls = kind==='primary' ? 'body' : 'body en';
  return `<div class="pane"><h2>${esc(CONF.panes[kind])}</h2>
    <div class="${cls}">${blocks(txt)}</div></div>`;
}

function renderDoc(){
  const d = DOCS.find(x => x.id === state.cur);
  if (!d){ $('#main').innerHTML =
    '<div class="empty">왼쪽에서 문서를 고르세요.</div>'; return; }

  const meta = (d.meta||[]).filter(m => m && m.v).map(m =>
    `<div class="${m.wide?'wide':''}"><b>${esc(m.k)}</b>` +
    `<span class="${m.txt?'txt':''}">${esc(m.v)}</span></div>`).join('')
    + (d.links||[]).filter(l => l && l.url).map(l =>
    `<div><b>${esc(l.k)}</b><span class="txt"><a href="${esc(l.url)}" target="_blank"
       rel="noopener">${esc(l.text||l.url)}</a></span></div>`).join('');

  const pts = (d.points||[]).length
    ? `<div class="points"><ul>${d.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>` : '';

  const cols = state.view==='both'
      ? `<div class="cols two">${pane('primary')}${pane('secondary')}</div>`
      : `<div class="cols">${pane(state.view)}</div>`;

  const fns = (d.notes||[]).length
    ? `<div class="fns"><h2>각주</h2>${d.notes.map(n=>`<div>${marks(n)}</div>`).join('')}</div>` : '';

  // 목록에는 작은 사본을 쓴다. 원본은 확대해 볼 때만 받는다 —
  // 84×110 으로 찍으면서 883KB 를 내려받던 것을 고친 것이다.
  const thumb = p => PG.thumbs
    ? `${PG.thumbs}/${p}.${PG.thumb_ext||'jpg'}` : `${PG.dir}/${p}.${PG.ext}`;
  const scans = (PG && (d.pages||[]).length)
    ? `<div class="scans"><h2>${esc(PG.label||'원본 지면')} ${d.pages.length}면</h2>
        <div class="thumbs">${d.pages.map(p=>
          `<button class="thumb" data-pg="${p}" title="${p}면 크게 보기">
             <img loading="lazy" src="${thumb(p)}" alt="${p}면 원본"><b>${p}</b>
           </button>`).join('')}</div></div>` : '';

  $('#main').innerHTML = `<article>
    <div class="doc-head">
      ${d.eyebrow?`<div class="docid">${esc(d.eyebrow)}</div>`:''}
      <h1>${esc(d.title||d.id)}
        ${d.badge?`<span class="stamp">${esc(d.badge)}</span>`:''}</h1>
      ${meta?`<div class="meta">${meta}</div>`:''}
    </div>
    ${d.summary?`<div class="points">${esc(d.summary)}</div>`:''}
    ${pts}${cols}${fns}${scans}
    ${d.note?`<div class="note">${esc(d.note)}</div>`:''}
    ${d.warn?`<div class="note warn">${esc(CONF.warn)}</div>`:''}
  </article>`;
  $('#main').scrollTop = 0;
  markTerms(d.id);
  markNow(d.date);
}

/* 본문 속 용어에 주석을 붙인다.
   HTML 문자열을 치환하면 이미 만들어 둔 태그(면 표시·각주·굵게) 안을 건드려
   깨진다. 그래서 다 그린 뒤 **텍스트 노드만** 훑는다. */
function markTerms(scope){
  const rules = (CONF.terms||{});
  const list = [].concat(rules['_']||[], rules[scope]||[]);
  if (!list.length) return;
  const roots = document.querySelectorAll('#main .body');
  roots.forEach(root => {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(n){
        // 이미 링크·주석·코드 안이면 건드리지 않는다
        if (n.parentElement.closest('a,.term,.pagemark,.fnref,code,del'))
          return NodeFilter.FILTER_REJECT;
        return n.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    const targets = [];
    while (walker.nextNode()) targets.push(walker.currentNode);
    targets.forEach(node => {
      let html = null, rest = node.nodeValue;
      for (const r of list){
        const i = rest.indexOf(r.w);
        if (i < 0) continue;
        html = html || document.createDocumentFragment();
        break;
      }
      if (!html) return;
      // 가장 먼저 나오는 것부터 차례로 잘라 붙인다
      const frag = document.createDocumentFragment();
      let s = node.nodeValue;
      let guard = 0;
      while (s && guard++ < 200){
        let best = null;
        for (const r of list){
          const i = s.indexOf(r.w);
          if (i >= 0 && (!best || i < best.i || (i === best.i && r.w.length > best.r.w.length)))
            best = {i, r};
        }
        if (!best){ frag.appendChild(document.createTextNode(s)); break; }
        if (best.i) frag.appendChild(document.createTextNode(s.slice(0, best.i)));
        // 지금 보고 있는 문서를 가리키는 번호는 링크로 만들지 않는다 — 제자리걸음이다
        const self = best.r.doc && best.r.doc === scope;
        const el = document.createElement(best.r.href && !self ? 'a' : 'span');
        el.className = 'term';
        el.textContent = best.r.w;
        el.dataset.card = best.r.k;
        if (best.r.href && !self) el.setAttribute('href', best.r.href);
        frag.appendChild(el);
        s = s.slice(best.i + best.r.w.length);
      }
      node.parentNode.replaceChild(frag, node);
    });
  });
  if (window.HoverCard) HoverCard.init(CONF.term_cards || {}, document.getElementById('main'));
}

/* ── 연대 바 ───────────────────────────────
   문서를 하나씩 읽다 보면 「얄타가 언제였더라」를 매번 놓친다.
   5년 반을 한 화면에 눌러 담으면 1945년 8월 열흘이 0.5%로 뭉개져 이름이 겹친다.
   그래서 셋으로 나눠 푼다.
     (1) 축을 길게 늘여 놓고 띠를 민다 — 지금 문서의 날짜가 늘 정중앙.
         띠는 진짜 가로 스크롤이라 손으로도 밀 수 있다.
     (2) 그래도 남는 겹침은 이름을 위아래 층으로 흩어 푼다.
     (3) 해가 바뀌는 자리에 선을 긋고, 이름표는 창 왼쪽에 들러붙인다 —
         1945년 한복판을 보고 있어도 「1945」가 떠나지 않는다.
   덕분에 사건 이름을 하나도 숨기지 않는다.

   자리는 전부 날짜에서 다시 계산한다. 그래야 배율을 바꿔도(줌) 같은 코드로
   다시 그릴 수 있다. 화면에 박아 둔 좌표는 없다. */
const CH = CONF.chrono;
const CH_STEPS = [0.6, 1.2, 2.5, 4, 8, 16, 32];  // 하루 몇 px
const CH_LANE = 14;    // 이름 한 층의 높이
const CH_GAP  = 5;     // 같은 층에서 이름끼리 띄울 최소 간격
let CH_PXD = 4;        // 기본 배율 — 창 하나에 대략 여덟 달
let chFrom=0, chEndT=0, chMarks=[], chBands=[], chTicks=[];
const chX = t => ((t - chFrom) / 86400000) * CH_PXD;

function initChrono(){
  const box = $('#chrono');
  if (!CH || !box){ if (box) box.hidden = true; return; }
  chFrom = Date.parse(CH.from);
  chEndT = Date.parse(CH.to);
  const track = $('#chronoTrack');

  // 연도는 「선」이다. 이 선부터 1944, 저 선부터 1945.
  // 한 해를 띠(band)로 잡아 두면 이름표를 그 띠 안에서 움직일 수 있다.
  const y0 = new Date(chFrom).getFullYear(), y1 = new Date(chEndT).getFullYear();
  for (let y = y0; y <= y1; y++){
    const el = document.createElement('div');
    el.className = 'cy' + (y % 2 ? ' alt' : '');
    el.innerHTML = '<b>' + y + '</b>';
    track.appendChild(el);
    chBands.push({el, tag: el.firstChild,
                  t0: Math.max(chFrom, Date.parse(y + '-01-01')),
                  t1: Math.min(chEndT,  Date.parse((y + 1) + '-01-01'))});

    ['02','03','04','05','06','07','08','09','10','11','12'].forEach(m => {
      const t = Date.parse(y + '-' + m + '-01');
      if (t < chFrom || t > chEndT) return;
      const q = document.createElement('div');
      q.className = 'cq' + (m === '04' || m === '07' || m === '10' ? ' q' : '');
      track.appendChild(q);
      chTicks.push({el: q, t});
    });
  }

  // 점과 이름을 한꺼번에 놓는다.
  // 점·이름 어느 쪽에 머물러도 그 사건이 무엇이었는지 카드로 뜬다 —
  // 이름 넉 자로는 「38선 획정」이 무슨 문서에서 어떻게 갈렸는지 알 수 없다.
  const cards = {};
  chMarks = CH.events.map(e => {
    const t = Date.parse(e.date), key = 'ch:' + e.date;
    cards[key] = {title: e.label, date: e.date, route: e.where || '',
                  sum: e.note || '', go: false};

    const dot = document.createElement('div');
    dot.className = 'cm' + (e.key ? ' key' : '');
    dot.dataset.card = key;
    track.appendChild(dot);

    const lab = document.createElement('div');
    lab.className = 'cl' + (e.key ? ' key' : '');
    lab.textContent = e.label;
    lab.dataset.card = key;
    lab.tabIndex = 0;
    track.appendChild(lab);
    return {t, dot, lab};
  });

  renderChrono();
  if (window.HoverCard) HoverCard.init(cards, track);
  // 글꼴이 늦게 오면 아까 잰 이름 너비가 틀린다 — 오고 나서 한 번 더 잰다
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderChrono);
}

/* 배율이 바뀔 때마다 날짜에서 자리를 다시 뽑는다 */
function renderChrono(){
  const track = $('#chronoTrack');
  if (!track || !chMarks.length) return;
  track.style.width = chX(chEndT) + 'px';
  chBands.forEach(b => {
    b.x0 = chX(b.t0); b.x1 = chX(b.t1);
    b.el.style.left  = b.x0 + 'px';
    b.el.style.width = (b.x1 - b.x0) + 'px';
  });
  // 달 눈금은 넉넉히 벌어졌을 때만. 좁을 때는 빗금처럼 보여 축을 더럽힌다
  chTicks.forEach(k => {
    k.el.style.left = chX(k.t) + 'px';
    k.el.hidden = !k.el.classList.contains('q') && CH_PXD < 4;
  });
  chMarks.forEach(m => {
    m.x = chX(m.t);
    m.dot.style.left = m.x + 'px';
    m.lab.style.left = m.x + 'px';
  });
  chMarks.sort((a, b) => a.x - b.x);
  layoutChrono();
  const t = Date.parse(chCur || '');
  if (!isNaN(t)){
    $('#chronoCursor').style.left = chX(t) + 'px';
    $('#chronoDate').style.left = chX(t) + 'px';
  }
  stickYears();

  // 지금 창에 얼마만큼의 시간이 들어와 있는지. 배율을 바꿀 때 유일한 길잡이다
  const vp = $('#chronoVp'), sc = $('#chronoScale');
  if (vp && sc){
    const d = vp.clientWidth / CH_PXD;
    sc.textContent = d >= 400 ? '창 폭 ' + (d / 365).toFixed(1) + '년'
                   : d >= 55  ? '창 폭 ' + Math.round(d / 30) + '달'
                              : '창 폭 ' + Math.round(d) + '일';
  }
  const z = $('#chronoZoom'), i = CH_STEPS.indexOf(CH_PXD);
  if (z){
    z.querySelector('[data-z="-1"]').disabled = i <= 0;
    z.querySelector('[data-z="1"]').disabled  = i >= CH_STEPS.length - 1;
  }
}

/* 줌. 창 안의 한 지점을 붙들어 두고 그 둘레를 늘이거나 줄인다 —
   붙들지 않으면 배율을 바꿀 때마다 보던 자리를 잃는다. */
function chZoom(dir, holdPx){
  const vp = $('#chronoVp');
  if (!vp) return;
  const i = CH_STEPS.indexOf(CH_PXD);
  const j = Math.max(0, Math.min(CH_STEPS.length - 1, i + dir));
  if (j === i) return;
  const pad = parseFloat(getComputedStyle(vp).getPropertyValue('--chPad')) || 0;
  const px = holdPx == null ? vp.clientWidth / 2 : holdPx;
  const hold = chFrom + ((vp.scrollLeft - pad + px) / CH_PXD) * 86400000;
  CH_PXD = CH_STEPS[j];
  renderChrono();
  vp.scrollLeft = pad + chX(hold) - px;
  stickYears();
}

function layoutChrono(){
  const box = $('#chrono'), items = chMarks;
  if (!box || !items.length) return;

  // 층 배정 — 왼쪽부터, 그 층의 마지막 이름과 안 겹치는 첫 층에 얹는다.
  // 층 0,1,2… 를 위·아래로 번갈아 내보내면 축을 사이에 두고 고르게 흩어진다.
  const ends = [];
  let lanes = 0;
  items.forEach(it => {
    const half = it.lab.offsetWidth / 2;
    let k = 0;
    while (k < ends.length && ends[k] > it.x - half) k++;
    ends[k] = it.x + half + CH_GAP;
    it.lane = k;
    lanes = Math.max(lanes, k + 1);
  });

  // 층 수가 정해져야 바 높이와 축의 자리가 나온다
  const up = Math.ceil(lanes / 2), dn = lanes - up;   // 위쪽이 한 층 더
  const axis = 12 + up * CH_LANE;                     // 위 여백 + 위층들
  const H    = axis + dn * CH_LANE + 26;              // 아래층들 + 연도·날짜 자리
  box.style.setProperty('--chH', H + 'px');
  box.style.setProperty('--axis', axis + 'px');

  items.forEach(it => {
    const side = it.lane % 2 === 0 ? 'up' : 'dn';     // 0,2,4…는 위 / 1,3,5…는 아래
    const row  = Math.floor(it.lane / 2);             // 축에서 몇 번째 층인가
    it.lab.classList.remove('up', 'dn');
    it.lab.classList.add(side);
    if (side === 'up'){
      it.lab.style.top = (axis - 8 - (row + 1) * CH_LANE) + 'px';
      it.lab.style.setProperty('--leg', (CH_LANE * row + 8) + 'px');
    } else {
      it.lab.style.top = (axis + 8 + row * CH_LANE) + 'px';
      it.lab.style.setProperty('--leg', (CH_LANE * row + 8) + 'px');
    }
  });
}

/* 연도 이름표를 창 왼쪽에 들러붙인다. 그 해의 띠가 창에 걸쳐 있는 동안은
   이름표가 띠를 벗어나지 않는 선에서 왼쪽 끝을 따라다닌다. */
function stickYears(){
  const vp = $('#chronoVp');
  if (!vp || !chBands.length) return;
  const pad = parseFloat(getComputedStyle(vp).getPropertyValue('--chPad')) || 0;
  const L = vp.scrollLeft - pad;                 // 창 왼쪽이 띠 좌표계에서 어디인가
  chBands.forEach(b => {
    const w = b.tag.offsetWidth;
    const x = Math.max(0, Math.min(L + 6 - b.x0, b.x1 - b.x0 - w - 2));
    b.tag.style.left = x + 'px';
  });
}

let chCur = null, chJump = null;
function markNow(date){
  const box = $('#chrono'), vp = $('#chronoVp');
  if (!CH || !box || !vp) return;
  chCur = date;
  const t = Date.parse(date || '');
  if (!date || isNaN(t)){ box.dataset.nodate = '1'; return; }
  delete box.dataset.nodate;

  // 창 절반만큼 양옆에 여백을 둬야 첫 문서도 마지막 문서도 가운데에 설 수 있다.
  // 양 끝을 붙잡지 않는다 — 붙잡으면 「가운데가 곧 지금」이라는 약속이 깨진다.
  const vpW = vp.clientWidth;
  box.style.setProperty('--chPad', (vpW / 2) + 'px');
  $('#chronoCursor').style.left = chX(t) + 'px';
  const dl = $('#chronoDate');
  dl.style.left = chX(t) + 'px';
  dl.textContent = date;

  // 곧바로 옮긴다. 부드럽게 미는 길(scrollTo behavior:'smooth' 도, CSS 의
  // scroll-behavior 도) 은 브라우저 설정에 따라 통째로 무시돼서, 띠가 아예
  // 안 움직인 적이 있다. 움직이지 않는 띠보다 툭 옮겨지는 띠가 낫다.
  clearTimeout(chJump);
  chJump = setTimeout(() => { vp.scrollLeft = chX(t); stickYears(); }, 0);
}

/* 손으로도 민다 — 세로 휠은 가로로 바꿔 주고, 끌어서도 옮길 수 있게 */
function initChronoScroll(){
  const vp = $('#chronoVp');
  if (!vp) return;
  vp.addEventListener('scroll', stickYears, {passive: true});
  vp.addEventListener('wheel', e => {
    // ⌘/Ctrl 을 누른 채 굴리면 배율. 손가락 아래 날짜를 붙들고 늘인다
    if (e.ctrlKey || e.metaKey){
      e.preventDefault();
      chZoom(e.deltaY < 0 ? 1 : -1, e.clientX - vp.getBoundingClientRect().left);
      return;
    }
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (!d) return;
    e.preventDefault();
    vp.scrollLeft += d;
  }, {passive: false});

  const z = $('#chronoZoom');
  if (z) z.addEventListener('click', e => {
    const b = e.target.closest('button[data-z]');
    if (b) chZoom(+b.dataset.z, null);
  });

  let down = false, x0 = 0, s0 = 0, moved = false;
  vp.addEventListener('pointerdown', e => {
    down = true; moved = false; x0 = e.clientX; s0 = vp.scrollLeft;
    vp.classList.add('drag');
  });
  vp.addEventListener('pointermove', e => {
    if (!down) return;
    if (Math.abs(e.clientX - x0) > 3){ moved = true; vp.setPointerCapture(e.pointerId); }
    if (moved) vp.scrollLeft = s0 - (e.clientX - x0);
  });
  const up = () => { down = false; vp.classList.remove('drag'); };
  vp.addEventListener('pointerup', up);
  vp.addEventListener('pointercancel', up);
}

function select(id){ state.cur=id; renderList(); renderDoc();
  history.replaceState(null,'','#'+id); }

$('#q').addEventListener('input', e => { state.q=e.target.value; renderList(); });
$('#list').addEventListener('click', e => {
  const b = e.target.closest('.item'); if (b) select(b.dataset.id); });
document.querySelectorAll('.chip[data-group]').forEach(c => c.addEventListener('click', () => {
  const k=c.dataset.group;
  state.groups.has(k)?state.groups.delete(k):state.groups.add(k);
  c.setAttribute('aria-pressed', state.groups.has(k));
  renderList();
}));
document.querySelectorAll('[data-sort]').forEach(b => b.addEventListener('click', () => {
  state.sort=b.dataset.sort;
  document.querySelectorAll('[data-sort]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  renderList();
}));
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
  state.view=b.dataset.view;
  document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  renderDoc();
}));
$('#themeBtn').addEventListener('click', () => {
  const r=document.documentElement;
  const dark=(r.getAttribute('data-theme')||
    (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark';
  r.setAttribute('data-theme', dark?'light':'dark');
});

// ── 확대 뷰어 ─── 스캔이 없는 자료에서는 통째로 건너뛴다
if (PG){
  let lbPages = [], lbAt = 0;
  const lb = $('#lb'), lbImg = $('#lbImg'), lbStage = $('#lbStage');
  const src = p => `${PG.dir}/${p}.${PG.ext}`;

  function lbShow(){
    const p = lbPages[lbAt];
    lbImg.src = src(p);
    lbImg.alt = `${p}면 원본`;
    $('#lbPg').textContent = `${p}면  (${lbAt+1}/${lbPages.length})`;
    $('#lbPrev').disabled = lbAt === 0;
    $('#lbNext').disabled = lbAt === lbPages.length - 1;
    $('#lbOpen').href = src(p);
    lbStage.scrollTop = 0;
  }
  function lbOpen(pg){
    const d = DOCS.find(x => x.id === state.cur);
    lbPages = (d && d.pages || []).slice();
    // 면 번호는 숫자일 수도 "0003" 같은 문자열일 수도 있다. 문자열로 맞춰 찾는다.
    lbAt = lbPages.map(String).indexOf(String(pg));
    if (lbAt < 0){ lbPages = [pg]; lbAt = 0; }
    lb.setAttribute('open',''); lbShow();
  }
  function lbClose(){ lb.removeAttribute('open'); lbImg.removeAttribute('src'); }
  function lbStep(n){
    const i = lbAt + n;
    if (i >= 0 && i < lbPages.length){ lbAt = i; lbShow(); }
  }

  $('#main').addEventListener('click', e => {
    const t = e.target.closest('.thumb,.pagemark.hit');
    if (t) lbOpen(t.dataset.pg);
  });
  $('#lbPrev').addEventListener('click', () => lbStep(-1));
  $('#lbNext').addEventListener('click', () => lbStep(1));
  $('#lbClose').addEventListener('click', lbClose);
  lb.addEventListener('click', e => { if (e.target === lb || e.target === lbStage) lbClose(); });
  $('#lbFit').addEventListener('click', e => {
    const fit = lbStage.classList.toggle('fit');
    e.target.setAttribute('aria-pressed', fit);
    e.target.textContent = fit ? '실제 크기' : '화면 맞춤';
  });
  addEventListener('keydown', e => {
    if (!lb.hasAttribute('open')) return;
    if (e.key === 'Escape') lbClose();
    else if (e.key === 'ArrowLeft') lbStep(-1);
    else if (e.key === 'ArrowRight') lbStep(1);
  });
}

state.cur = decodeURIComponent((location.hash||'').slice(1)) ||
            visible()[0]?.id || DOCS[0]?.id;
if (!DOCS.some(d => d.id === state.cur)) state.cur = DOCS[0].id;
initChrono(); initChronoScroll();
addEventListener('resize', () => { renderChrono(); markNow(chCur); });
renderList(); renderDoc();
</script>
</body></html>
