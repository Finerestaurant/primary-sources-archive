"면", "v": "0261–0261 (1면)"}, {"k": "건명", "v": null, "txt": true}], "summary": "Reply regarding Military Advisory Group for South Korea", "points": ["극동군 총사령부가 육군부에 주한 미군 군사고문단 관련 답신 전문(CX 57728)을 송부함.", "별도 전문(ZGCG 1497)이 CG USAFIK으로부터 발송되어 참조 전문의 제3부에 대한 답변으로 제출됨.", "전문의 주요 내용 전문(plain text)은 동일 등급 서신으로 취급 및 전송하는 것이 육군 규정 380-5에 의거 승인됨."], "primary": "[0261면]\n\n기밀해제\n해제권한 NND8X6527\n\n2급비밀(Top Secret)\n\n극동군 총사령부\n\n통신대 전문\n\n1947년 12월 31일\n\n발신: 극동군 총사령관(CINCFE)\n수신: 육군부(Department of the Army) 우선(PRIORITY)\n정보: 미 극동군 총사령관(GG USAFIK) 보통(ROUTINE)\n\n괄호 CX 57728 괄호. 참조부호 CSGPO, 제목은 남한 주둔 군사고문단(South Korea Military Advisory Group)임. 참조 극동군 전문(REFURAD) W 915 TO 0, 12월 3일자. 별도 발송되는 것은 ZGCG 1497, CG USAFIK 발신. 이는 참조 전문(URAD) 제3부에 대한 답신으로 제출된 것임. 인용된 참조자료가 DA에 모두 도착한 것은 아님.\n\n담당:\n육군부 헌병감실 대령 R. M. 레비, 부관감\n\n승인:\n참모부 G-3 차장보, 육군 준장 워드 H. 메리스\n\n배포처:\n극동군 총사령관\n참모장\nG-4\nG-3 (반납)\n\n주요 내용 전문의 동급 비밀 취급 서신으로서의 취급 및 전송은 육군성으로부터 육군 규정 380-5의 규정에 의거하여 승인되었음.\n\n2급비밀(Top Secret)\n\n정보 사본\n\n51/ CX 57728", "secondary": "[0261면]\n\nDECLASSIFIED\nAuthority NND8X6527\n\nTOP SECRET\n\nGENERAL HEADQUARTERS\nFAR EAST COMMAND\n\nSIGNAL CORPS MESSAGE\n\n31 December 1947\n\nFROM: CINCFE TO : DEPT OF ARMY PRIORITY\nINFO: CG USAFIK ROUTINE\n\nPAREN CX57728 PAREN FOR CHARLIE SUGAR GEORGE PETER OBOE FD SUBJECT MILITARY ADVISORY GROUP FOR SOUTH KOREA REFURAD WILLIAM NINE ONE FIVE TO ZERO OF THREE DECEMBER FD PASSED SEPARATELY IS ZEBRA GEORGE CHARLIE GEORGE ONE FOUR NINE SEVEN FROM CHARLIE GEORGE UNCLE SUGAR ABIE FOX ITEM KING WHICH IS SUBMITTED AS REPLY TO PART THREE OF URAD PD REFERENCES CITED NOT ALL TO DOG SLANT ABIE OR NEEDED\n\nOFFICIAL:\nR. M. LEVY, Colonel, AGD, Adjutant General.\n\nAPPROVED BY:\nWARD H. MARIS, Brigadier General, GSC, Assistant Chief of Staff, G-3.\n\nCopies to:\nC-in-C\nC/S\nG-4\nG-3 (Return)\n\nHandling and transmission of literal main text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of AR 380-5.\n\nTOP SECRET\n\nINFORMATION COPY\n\n51/ CX 57728", "notes": [], "note": "기계 판독 참고 — 전문 내용 중 호출부호 및 전문 번호 문자열은 음성 통신용 철자 알파벳으로 작성되어 있으나, 참조부호(CSGPO, ZGCG 등)가 실제로 그러한 문자열인지는 확실하지 않습니다. 인쇄된 문자열을 보존하여 그대로 기재했습니다.", "warn": false, "pages": ["0261"]}, {"id": "D036", "order": 35, "date": "1948-01-28", "group": "D", "eyebrow": "D036 · D. 장래 정책·철군", "title": "극동군사령관, 주한미군 철수 정책안과 군사고문단에 대한 군사적 의견 회신", "badge": "TOP SECRET", "list_right": "0262–0263", "meta": [{"k": "발신", "v": "CINCFE", "txt": true}, {"k": "수신", "v": "DEPT OF ARMY", "txt": true}, {"k": "참조", "v": "CG USAFIK", "txt": true}, {"k": "전문번호", "v": "CX 58237"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0262–0263 (2면)"}, {"k": "건명", "v": "Withdrawal from Korea", "txt": true}], "summary": "CINCFE military comments on proposed US withdrawal policy and advisory group, Korea", "points": ["극동군사령부는 1948년 8월 15일부터 11월 15일까지의 90일 철수 일정은 지나치게 낙관적이라고 평가했다.", "한국 내 외교 사절단의 군사 부문에 소규모 군사고문단을 포함시키는 제안에 동의한다고 밝혔다.", "요청된 극동 전구 능력 제공은 재편성 프로그램이 확정될 때까지 불가하며, 제24군단 외의 가용 병력은 미미할 것으로 예상된다.", "잉여 인원 중 희망자에 한해 극동 사령부 내 타 지역으로의 전출 조치를 취할 것임을 통보했다."], "primary": "[0262면]\n비밀해제\n해제권한 NND86527\n인편 전달\n\n극동군 총사령부\n극동군사령부 통신대 전문 GC-P IDS/ism\n1948년 1월 28일\n\n발신: 극동군사령관(CINCFE)        280557Z\n수신: 육군부                    통상\n정보: 주한미군사령관(CG USAFIK)     통상\n\n괄호 CX 58237 괄호, CSGPO 앞 (CHARLIE SUGAR GEORGE PETER OBOE) PD.\n참조 WARX 94049 (WILLIAM ABIE ROGER XRAY NINE FOUR ZERO FOUR NINE) PD 1항 PD 94049.\n\n본 사령부의 의견은 전적으로 군사적 측면에 국한될 것임. 이는 인용부호 \"정치, 경제, 문화, 사회 및 비군사적\" 인용부호 닫음 측면이 본 사령부의 권한 밖이기 때문임 PD. 군사적 측면에서, 제안된 정책에 대한 의견은 다음과 같음 A항 PD.\n\n90일 기간(1948년 8월 15일~1948년 11월 15일) 내의 점령군 철수 일정표는 지나치게 낙관적으로 보임 PD. 1947년 12월 8일자 CX 57175 (CHARLIE XRAY FIVE SEVEN ONE SEVEN FIVE) 로마자 3장 참조 PD. B항 PD. WARX 91520 (WILLIAM ABIE ROGER XRAY NINE ONE FIVE TO ZERO) 제3부에 대한 잠정 회신은 12월 23일자 ZGCG 1497 (ZEBRA GEORGE CHARLIE GEORGE ONE FOUR NINE SEVEN) 로마자 4장에 포함되어 있으며, 1월 3일자 CX 5778 (CHARLIE XRAY FIVE SEVEN SEVEN EIGHT)로 CSGPO에 전달됨 PD. 현재 수립 중인 계획(1월 9일자 CX 5786 TO 참조)으로 인해 장교 14명 및 사병 14명이라는 잠정 수치에 일부 수정이 있을 수 있으나, 어떤 경우에도 그 그룹 규모는 작을 것임 PD. 따라서 인용부호 \"결론\" 인용부호 닫음의 N항에서 제안된 바와 같이 외교 사절단의 군사 부문에 고문단을 포함시키는 것에 동의함.\n\n[0263면]\n비밀해제\n해제권한 NND86527\n인편 전달\n\nC항 PD. WARX 91520에서 요구한 확정된 극동 전구 능력은, 현재 처리 중인 재확립된 8 1/3 그룹 프로그램(괄호) 충족 능력이 결정될 때까지 제공될 수 없음 PD. 12월 26일자 WARX 93049 (WILLIAM ABLE ROGER XRAY NINE THREE ZERO FOUR NINE)에서 제공된 가정 하에서는, 제24군단(ROMAN TWENTY FOUR CORPS) 능력을 제외한 극동군(FEC) 자산은 무시할 수준일 것으로 예상됨 PD. 증강된 경찰 예비대를 위해 현재 준비 중인 계획(참조 CX 5786 TO)은 이 가정에 기초함 PD. 1월 23일 항공편으로 발송된, 제24군단 자원만 활용하는 WARX 91520의 A-2부 하 극동 전구 능력에 따름 PD. 3월 1일 이전까지는 제24군단 이외 부대에 대한 확정 능력을 DA(Dog slant Able)에 제공할 수 없을 것으로 추정됨 PD. D항 PD. 1948년 8월 15일 이후 잉여가 되며, 해외 근무 기간이 1년가량 남은 한국 내 부양가족 동반 장교들은 본인이 희망할 경우 극동 사령부 관할 타 지역에서 흡수될 것임 PD. 2항 PD. USAFIK의 SANA CC(Sugar Able Nan Able Charlie Charlie) 정책 문서에 대한 의견은 ZGCG 70(Zebra George Charlie George Seven Zero)에 의해 DA에 직접 송부되었음 PD.\n\n맥아더\n\n공식: 승인됨\n                                                         C. H. 마리스\n                                                         준장(GSC)\n                                                         작전참모부장(G-3)\n\n배포처:                                      1948년 1월 28일 참모장 승인\n참모장(C/S)  총사령관(C-in-C)  정보참모부(G-2)  작전참모부(G-3) (반납)  L.\n인사참모부(G-1)  군수참모부(G-4)\n\n13\n5 - I 58231", "secondary": "[0262면]\nDECLASSIFIED\nAuthority NND86527 By Hand\n\nGENERAL HEADQUARTERS\nFAR EAST COMMAND\nSIGNAL CORPS MESSAGE GC-P IDS/ism 28 January 1948\n\nFROM: CINCFE             280557Z\nTO: DEPT OF ARMY        ROUTINE\nINFO: CG USAFIK            ROUTINE\n\nPAREN CX 58237 PAREN FOR CHARLIE SUGAR GEORGE PETER OBOE PD\nREFERENCE WILLIAM ABIE ROGER XRAY NINE FOUR ZERO FOUR NINE PD PAR ONE PD 94049\n\nCOMMENTS OF THIS HEADQUARTERS WILL BE CONFINED ENTIRELY TO MILITARY\nFEATURES AS THE QTE POLITICAL CMA ECONOMIC CMA CULTURAL CMA SOCIAL CMA AND\nNON DASH MILITARY UNQTE ASPECTS DO NOT FALL WITHIN ITS PURVIEW PD MILITARILY\nCMA THE FOLLOWING ARE COMMENTS ON THE PROPOSED POLICY IN SUBPAR ABLE PD\n\nTIMETABLE FOR WITHDRAWAL OF OCCUPATION FORCES DURING ABLE NINE ZERO DAY\nPERIOD PAREN FIFTEEN AUG FOUR EIGHT DASH FIFTEEN NOV FOUR EIGHT PAREN APPEARS CX\nOPTIMISTIC PD SEE PART ROMAN THREE OF CHARLIE XRAY FIVE SEVEN ONE SEVEN FIVE\nOF EIGHT DEC FOUR SEVEN PD SUBPAR BAKER PD TENTATIVE REPLY TO PART THREE OF\nWILLIAM ABLE ROGER XRAY NINE ONE FIVE TO ZERO IS CONTAINED IN PART ROMAN\nFOUR OF ZEBRA GEORGE CHARLIE GEORGE ONE FOUR NINE SEVEN OF TWO THREE DEC\nPASSED TO CHARLIE SUGAR GEORGE PETER OBOE BY CHARLIE XRAY FIVE SEVEN SEVEN\nEIGHT OF THREE JAN PD SOME MODIFICATION OF TENTATIVE FIGURE OF ONE FOUR\nOFFICERS AND ONE FOUR EM MAY RESULT FROM PLAN BEING FORMULATED PAREN\nSEE CHARLIE XRAY FIVE SEVEN EIGHT SIX TO OF NINE JAN PAREN BUT IN ANY EVENT\nGROUP WOULD BE SMALL PD THEREFORE CMA CONCUR IN INCLUDING ADVISORY GROUP IN\nMILITARY SECTION OF DIPLOMATIC MISSION AS PROPOSED IN PAR NAN OF QTE\n\n[0263면]\nDECLASSIFIED\nAuthority NND86527 By Hand\n\nCONCLUSIONS ED UNQTE SUBPAR CHARLIE PD FIRM THEATER CAPABILITIES CALLED FOR\nBY WILLIAM ABLE ROGER XRAY NINE ONE FIVE TO ZERO CANNOT BE FURNISHED UNTIL\nCAPABILITIES FOR MEETING RE DASH ESTABLISHED EIGHT DASH ONE THIRD GROUP\nPROGRAM PAREN WHICH ARE CURRENTLY BEING PROCESSED PAREN HAVE BEEN DETERMINED\nPD IT IS EXPECTED THAT UNDER THE ASSUMPTIONS FURNISHED BY WILLIAM ABLE ROGER\nXRAY NINE THREE ZERO FOUR NINE OF TWO SIX DEC FOX EASY CHARLIE ASSETS EXCEPT\nFOR ROMAN TWENTY FOUR CORPS CAPABILITIES WILL BE NEGLIGIBLE PD PLAN NOW\nUNDER PREPARATION FOR AUGMENTED CONSTABULARY PAREN REF CHARLIE XRAY FIVE\nSEVEN EIGHT SIX TO PAREN IS BASED ON THIS ASSUMPTION PD THEATER CAPABILITIES\nUNDER PART TWO ABLE OF WILLIAM ABLE ROGER XRAY NINE ONE FIVE TO ZERO\nUTILIZING ROMAN TWENTY FOUR CORPS RESOURCES ONLY FORWARDED BY AIR COURIER\nTWO THREE JAN PD ESTIMATED THAT FIRM CAPABILITIES FOR OTHER THAN ROMAN TWENTY\nFOUR CORPS CANNOT BE FURNISHED TO DOG SLANT ABLE PRIOR TO ONE MARCH PD SUBPAR\nDOG PD OFFICERS WITH DEPENDENTS IN KOREA WHO BECOME SURPLUS ON OR AFTER ONE\nFIVE AUG FOUR EIGHT AND WHO WILL HAVE AS MUCH AS ONE YEAR REMAINING ON THEIR\nOVERSEAS TOUR WILL BE ABSORBED IN OTHER AREAS OF FOX EASY CHARLIE IF THEY SO\nDESIRE PD PAR TWO PD USAFIK COMMENTS ON REFERENCE SUGAR ABLE NAN ABLE CHARLIE\nCHARLIE POLICY PAPER FORWARDED TO DOG SLANT ABLE DIRECT BY ZEBRA GEORGE CHARLIE\nGEORGE SEVEN ZERO PD\n\nMACARTHUR\n\nOFFICIAL: APPROVED\nC. H. MARIS\nBrigadier General, GSC Assistant Chief of Staff, G-3 Copies to:                                      Approved by C/S 28 Jan 1948 C/S   C-in-C   G-2   G-3 (Return)   L.\nG-1   G-4\n\n13 5 - I 58231", "notes": [], "note": "기계 판독 참고 — OCR 오류가 많아 일부 약어 및 통신명(예: CSGPO)의 철자를 맥락에 따라 재구성함. 페이지 하단의 숫자 '13'과 '5 - I 58231'은 문서 관리 번호이며, 5-58231의 I 자리 오식 가능성 있음. 전체적인 전문 구조와 굵은 의미는 신뢰도 높으나, 통신 암호어(예: CHARLIE SUGAR GEORGE PETER OBOE)의 세부 철자 변환 과정에서 불확실성이 일부 존재함.", "warn": false, "pages": ["0262", "0263"]}, {"id": "D037", "order": 36, "date": "1948-01-27", "group": "X", "eyebrow": "D037", "title": "CINCFE에 WARX 94049 관련 논평 요청", "badge": "TOP SECRET", "list_right": "0264–0264", "meta": [{"k": "발신", "v": "CSGPO", "txt": true}, {"k": "수신", "v": "CINCFE", "txt": true}, {"k": "참조", "v": "CG USAFIK", "txt": true}, {"k": "전문번호", "v": "WARX 94729"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0264–0264 (1면)"}, {"k": "건명", "v": null, "txt": true}], "summary": "Request for CINCFE comments on WARX 94049", "points": ["CSGPO가 CINCFE에 WARX 94049에 대한 논평이 아직 접수되지 않았음을 통보하고 회신 일정을 문의함.", "본 전문은 육군 규정 380-5에 따라 의역을 생략하고 전문 자체를 2급 비밀로 취급·전송 실시.", "주한미군사령관에게는 참고 정보로만 배포되었으며, 실무 처리는 G-3(작전참모부)에 지시됨."], "primary": "[0264면]\n기밀해제\n근거 NND 86527\nCWH\n\n극동군 총사령부\n부관실\n무선 및 전신 센터\n수신 전문\n\n2급 비밀\n\n우선도\n\n1948년 1월 27일\n\n발신: 육군부 참모차장 작전기획실(CSGPO)\n수신: 극동군 총사령관(CINCFE)\n정보 배포: 주한 미군 사령관(CG USAFIK)\n전문 번호: WARX 94729\n\n참조: WARX 94049. 해당 전문에 대한 극동군 총사령관의\n논평이 아직 이곳에 접수되지 않았음.\n논평 발송 예정일을 알려주기 바람.\n\n무서명\n\n처리 부서: G-3(작전참모부)\n정보 배포 대상: 총사령관, 참모장\n\n1630\n\n처리 완료 1700\n\n처리 완료\n일자 1월 29일 수신 1월 21일 필리핀\n\n우선 발신 시각: 262341 Z\n전문 관리 번호: 69768\n\n\"의역 불필요. 2급 비밀 문서로 취급할 것.\n육군 규정 380-5호 제51항 1 및 제60항 a (4)에 의거.\"\n\n2급 비밀 사본\n\n5-4(2)(3)항 및 60-A (1)(2)(3)(4)항, 육군 규정 380-5호,\n1946년 3월 6일. 16-50735-1 GPO\n\n제16-C항, 18-E항, 53-A항, 53-D (1)항의 규정에 따라\n본 메시지의 축어적 평문을 동일 분류 등급의 문서로 취급 및\n전송하는 것이 전쟁부에 의해 승인되었음.\n사본 제 7호", "secondary": "[0264면]\nDECLASSIFIED\nAuthority NND 86527\nCWH\n\nGENERAL HEADQUARTERS, FAR EAST COMMAND\nADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\nINCOMING MESSAGE\n\nTOP SECRET\n\nPriority 27 Jan 48\n\nFROM: CSGPO\nTO: CINCFE\nINFO: CG USAFIK\nNR: WARX 94729 Reference WARX 94049. No CINCFE comments on subject message yet received here. Would appreciate advice as to date comments may be expected.\n\nNO SIG\n\nACTION: G-3 INFORMATION: COMMANDER IN CHIEF, CHIEF OF STAFF 1630\n\nACTION COMPLETED 1700\n\nACTION COMPLETED\nDATE 29 Jan recd 21 JAN PHI PRIORITY TOO: 262341 Z\nMCN: 69768 \"Paraphrase not required. Handle as TOP SECRET correspondence per par 51 1 and 60 a (4) AR 380-5.\"\n\nTOP SECRET copy 5-4(2)(3), and 60-A (1)(2)(3)(4), AR 380-5, 6 March 1946. 16-50735-1 GPO in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) Handling and transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department COPY No. 7", "notes": [], "note": "기계 판독 참고 — OCR 오기 'Promet'을 'Priority'로, 'GE AL'을 'GENERAL'로, 'CSGPO' 철자를 유추하여 복원함. 하단부 행 배치와 보안 문구 배치는 물리적 위치보다 정보 순서에 따라 정리함.", "warn": false, "pages": ["0264"]}, {"id": "D038", "order": 37, "date": "1948-01-29", "group": "X", "eyebrow": "D038", "title": "WARX 94049에 대한 육군성 답변 요청 관련 G-3 메모 (기 답신 완료 통보)", "badge": "TOP SECRET", "list_right": "0265–0267", "meta": [{"k": "발신", "v": "G-3 Action Officer (Smith)", "txt": true}, {"k": "수신", "v": "G-3", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "58237"}, {"k": "종류", "v": "memorandum"}, {"k": "면", "v": "0265–0267 (3면)"}, {"k": "건명", "v": null, "txt": true}], "summary": "D/A request for answer to WARX 94049 (G-3 memo noting prior reply sent)", "points": ["WARX 94049(웨더마이어발 맥아더·하지행 개인 전문)는 CX 58237로 이미 답신 완료되어 추가 조치 불필요하다는 1948년 1월 29일자 G-3 기록 메모.", "1948년 1월 22일자 제1차 추신에서 극동군 사령부는 한국군 장비 소모율을 주한 미군 기준에 병기·공병·통신 장비 10%를 추가하는 안을 육군성에 권고하고, 3월 1일까지 가용 물량 보고서 제출을 약속함."], "primary": "[0265면]\n기밀해제\n권한 NND 816527\n일급비밀\n1948년 1월 29일\n\n기록용 메모:\n제목: WARX 94049에 대한 육군성(DA) 답변 요청\n\n1. 기본 문서: 1월 26일자 WARX 94729. 이는 CINCFE(극동군 총사령관)의 WARX 94049 회신이 언제쯤 가능할지에 대한 정보를 요청한 것이다.\n\n2. WARX 94049는 웨더마이어가 맥아더와 하지(Hodge)에게 보낸 개인 일급비밀 전문(CX 58237, 1월 28일자)으로 답신되었다. 답신이 이미 발송되었으므로 기본 문서에 대한 별도 회신은 불필요하다.\n\n3. 권고: 본 기록용 메모를 G-3에서 확인하고 G-3 행정과에서 보관할 것을 권고한다.\n\n4. 완료: 이상으로 기본 문서(WARX 94729, 1월 26일)에 대한 G-3 조치를 완료한다.\n\n스미스(Smith) 286-5950\n담당관\n58237 \"G-3 파일 사본\"\n\n일급비밀\n\n[0266면]\n기밀해제\n권한 NND 86527\n\n일급비밀\n\n기본 문서: 제1차 추신, TONS L75, \"한국군 군수 소요\", AG 091(1948년 1월 8일)OD 비밀\n\n극동군 총사령부, APO 500, 1948년 1월 22일\n\n수신: 미 육군 참모본부 군수·보급·조달국장, 워싱턴 25, D.C. (G-3 사본)\n\n1. 남한 국군 창설에 관한 1947년 12월 4일자 육군성 전문 WAR 91520을 참조한다.\n\n2. 남한군의 연간 장비 소모율은 주한 미군과 동일하게 적용하되, 병기·공병·통신 장비에 한해 10%를 추가할 것을 권고한다. 이로써 상기 전문 파트 1A에 대한 답변을 갈음한다.\n\n3. 주한 미군 사령관이 작성하여 첨부문서 1호로 첨부된 보고서는 상기 전문 파트 2A에 대한 회신으로 송부한다. 중국 공군 8과 1/3 비행단 계획의 재개된 군사 단계 가용 물량이 확정되면(1947년 12월 30일자 육군성 전문 WX 93107 참조), 첨부된 보고서를 어느 정도까지 충족할 수 있을지 극동군 사령부의 자원을 검토할 것이다.\n\n4. 1947년 12월 26일자 WARX 93049로 수정된 WAR 91520 파트 2B에 대한 답변으로, 가용 물량을 확정하여 1948년 3월 1일까지 그 보고서를 송부할 수 있을 것으로 예상한다.\n\n총사령관을 대신하여:\n\nH. F. 저드슨 시니어(H. F. Judson Sr.)\nC. E. 슈가트(C. E. SHUGART)\n육군 장교단 대령, 부관감 대리\n\n분류 비밀: 변경됨\n권한\n\n첨부 1: 상동 (2부, 회수됨)\n첨부 제외 사본 배포처:\n총사령관\n참모장\nG-3\nJSPOG\nG-4 기획\nG-4 작전\n\n1948년 1월 30일 발송 AGGHQ\n비밀\n제1차 추신 첨부는 비밀로 유지\n- G-4 보급과 보관\n사본 번호 5\nG-3 파일 사본\n\n[0267면]\n기밀해제\n권한 NND 866527\n\n[판독불가]\nG-3 참모장 확인용 C/N, 48년\n주한 미 고문단 제안\n1월 18일, 참모장 승인 메모\n및 [판독불가]에 보관", "secondary": "[0265면]\nDECLASSIFIED\nAuthority NND 816527\nTOP SECRET\n29 January 1948 MEMO for RECORD:\nSUBJECT: D/A request for answer to WARX 94049\n\n1. BASIC: WARX 94729, of 26 Jan which requests info as to when CINCFE answer to WARX 94049 may be expected.\n\n2. WARX 94049 is a personal Top Secret radio from Wedemeyer to MacArthur and Hodge, and was answered by CX 58237 dtd 28 Jan. In view of fact answer already dispatched, it is not necessary to reply to basic.\n\n3. RECOMMEND: Recommend this M/R be noted by G-3 and filed by G-3 Admin.\n\nJOA 4. COMPLETION: This completes G-3 action on basic (WARX 94729/26 Jan).\n\nSmith 286-5950 Action Officer 58237 \"G-3 FILE COPY\"\n\nTOP SECRET\n\n[0266면]\nDECLASSIFIED\nAuthority NND 86527\n\nTOP SECRET\n\nBASIC: 1st Ind, TONS L75, \"Logistic Requirements for Korean Army,\" AG 091(8 Jan 48)OD SECRET GENERAL HEADQUARTERS, FAR EAST COMMAND, APO 500, 22 January 1948\n\nTO: Director of Service, Supply and Procurement, General Staff, United States Army, Washington 25, D.C.  COPY FOR G-3\n\n1. Reference is made to Department of Army radio WAR 91520, 4 December 1947, concerning establishment of South Korean Armed Forces.\n\n2. It is recommended that annual equipment rates for South Korean Army be the same for all technical service equipment as for United States Army Forces in Korea except for an additional ten percent (10%) for Ordnance, Engineer and Signal equipment. This answers Part 1A of the above referenced radio.\n\n3. The report prepared by the Commanding General, United States Army Forces in Korea, and attached as Inclosure 1, is forwarded in reply to Part 2A of above referenced radio. After establishment of availabilities for the reopened military phase of the Chinese Air Force 8-1/3 Group Program (see Department of Army radio WX 93107, 30 December 1947), the resources of the Far East Command will be screened to determine the extent the attached report can be supplied.\n\n4. It is estimated that availabilities can be determined and a report of same forwarded by 1 March 1948 in answer to Part 2B of WAR 91520 as amended by WARX 93049, dated 26 December 1947.\n\nFOR THE COMMANDER-IN-CHIEF:\n\nH. F. Judson Sr.\nC. E. SHUGART, Colonel, AGD.\nAsst Adj General Classification SECRET: changed to Authority 1 Incl: a/a (2 copies w/drawn)\nCopies (less incl.) furnished:\nC-in-C\nC/S\nG-3\nJSPOG\nG-4 P&P\nG-4 Opns MAILED 30 Jan 1948 AGGHQ\nSECRET\n1st Ind inclusure retained SECRET\n- in G-4 Section - Supply Copy No. 5 G-3 file copy\n\n[0267면]\nDECLASSIFIED\nAuthority NND 866527\n\n[illegible]\nC/N for G-3 C/S initial 48 Proposed US Advisory Group for Korea 18 Jan 48, memo for C/S approval and filed in [illegible]", "notes": [], "note": "기계 판독 참고 — 페이지 0267은 대부분 판독 불가 상태이며, 일부 필기 메모와 참모장 이니셜만 확인됨. 페이지 0266의 기본 문서 식별자 'BASIC: 1st Ind, TONS L75'에서 TONS L75는 문서 번호체계로 추정되나 정확하지 않을 수 있음. 페이지 0266 하단 배포처 목록의 'G-LL P&P'는 문맥상 'G-4 P&P'로 교정함.", "warn": false, "pages": ["0265", "0266", "0267"]}, {"id": "D039", "order": 38, "date": "1947-12-24", "group": "X", "eyebrow": "D039", "title": "남조선군 고문단 및 군수지원부대 편성", "badge": "SECRET", "list_right": "0268–0273", "meta": [{"k": "발신", "v": "CG USAFIK", "txt": true}, {"k": "수신", "v": "CINCFE (repeat to DA)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "ZGCG 1497"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0268–0273 (6면)"}, {"k": "건명", "v": null, "txt": true}], "summary": "Organization of South Korean Army advisory group and its logistic support units", "points": ["1947년 12월, USAFIK는 한국군 창설을 완료한 후 필요한 미군 고문단 규모를 61명의 장교, 99명의 사병 등 총 162명으로 건의함.", "고문단은 한국 경제의 취약성과 정치적 이유로 인해 숙소 외의 현지 물자 조달 없이 완전히 자급자족하는 파견단으로 설계됨.", "고문단의 자급자족을 위해 의무, 병기, 헌병, 통신 분야에서 가족을 포함한 미군 인원 지원용 최소한의 미국 근무 부대 편성을 요청함.", "의무 부대(78명)는 691명의 미군과 400명의 예상 가족 진료를 위해 서울에 병원, 부산에 진료소를 배치할 계획임.", "주한미군 철수 대비, 한국군 고문단을 위한 정밀 병참 및 수송 부대 소요 명세를 병과별로 제시했다.", "국가경찰은 임무 수행이 우수하나 민간 조직이므로 미군 철수 후 육군 고문 파견은 불필요하다고 권고했다.", "한국 해안경비대를 위해 해군 또는 해안경비대 출신 3명의 장교와 3명의 병사로 구성된 별도 고문단 신설을 제안했다.", "고문단 전체를 위한 편제 및 장비표(T/O&E)와 소요 장비 목록은 추후 항공 우편으로 송부할 예정이다."], "primary": "[0268면]\nDECLASSIFIED\nAuthority NND86527\n\n극동군 총사령부(GENERAL HEADQUARTERS, FAR EAST COMMAND)\n참모부장실(ADJUTANT GENERAL'S OFFICE) 전시참모부(WFS)\n무선·전보소(RADIO AND CABLE CENTER)\n\n수신 전문(INCOMING MESSAGE)\n\n발신 일시(TOO): 1947년 12월 24일\n\n발신: 한국 주둔 미 육군 사령관(CG USAFIK)\n수신: 극동군 총사령관(CINCFE) — 육군부(DA)로 재전송\n\nSECRET (2급 비밀)\n\n전문 번호(NR): ZGCG 1497\n\n제목: 남조선군(South Korean Army). 참조:\n가. CX 57425, 12월 18일;\n나. W 91520, 12월 3일;\n다. CX 57200;\n라. ZGCT 1472, 12월 12일.\n\n본 전문은 6부로 구성됨:\n\n제1부: 제안된 고문단(advisory group) 편성 계획은 한국 경제가 숙소와 공공요금 외에 소요되는 많은 물자 중 어떤 것도 조달할 능력이 없기 때문에, 초기에는 고문단이 자급자족(self-contained) 형태의 파견단이 될 것이라는 전제에 기초한다. 정치적 이유와 대부분의 경우 물자가 존재하지 않거나 부적합하다는 점 때문에 중국에서 그랬던 것처럼 고문단을 한국 경제에 부분적으로라도 의존하게 하는 것은 바람직하지 않다고 고려된다.\n\n제2부: 제안된 바와 같이 한국군이 편성되었고 동원 및 초기 교육이 완료되었다는 가정하에, 다음의 상설 고문단을 한국군을 위해 건의함:\n\n사령관 및 보좌관실(Commander and Aides Section): 소장(Maj Gen) 1; 대위(Capt) 1; 중위(Lt) 1; 속기사(Stenographer) 1; 5급 기술병(Tec 5): 서기 타자수(Clerk typist) 1. 장교 3명, 사병 3명 계.\n\n참모장(C/S): 대령(Col) 1; 중령(Lt Col) 1; 상사(MSgt): 주임 서기(Chief clerk) 1; 기술중사(TSgt): 속기사 1, 서기 타자수 1; 5급 기술병: 정보병 1, 일반 서기(Clerk general) 1, 서기 타자수 1, 암호병(Cryptographer) 1, 제도병(Draftsman) 1. 장교 2명, 사병 8명 계.\n\n작전참모(G-3): 대령 1; 중령 2; 소령(Maj) 1; 상사: 주임 서기 1; 기술중사: 일반 서기 1, 서기 타자수 1, 제도병 1. 장교 4명, 사병 4명 계.\n\n군수참모(G-4): 대령 1; 소령 1; 상사: 주임 서기 1; 기술중사: 보급 서기(Clerk supply) 1; 5급 기술병: 일반 서기 1, 서기 타자수 1. 장교 2명, 사병 4명 계.\n\n부관-인사참모(AG-G-1): 대령 1; 대위 1; 중위 1; 준위(WO) 1; 상사: 주임 서기 1; 기술중사: 우편병(Postal) 1; 하사(SSgt): 일반 서기 1; 5급 기술병: 기초 훈련병(Clerk basic) 2, 우편 서기(Clerk postal) 2, 서기 타자수 1. 장교 3명, 준위 1명, 사병 7명 계.\n\n포병(Artillery): 대령 1; 중령 1; 대위 1; 기술중사: 주임 서기 1; 5급 기술병: 일반 서기 1, 서기 타자수 1. 장교 3명, 사병 3명 계.\n\n[0269면]\nDECLASSIFIED\nAuthority NND 86527\n\nSECRET\n\nCG USAFIK 전문 번호 ZGCG 1497, 발신일 1947년 12월 24일, 계속:\n\n항공(Aviation): 중령 1; 대위 1; 기술중사: 주임 서기 1; 5급 기술병: 일반 서기 1, 서기 타자수 1. 장교 2명, 사병 3명 계.\n\n군목(Chaplain): 중령 2; 기술중사: 주임 서기 1; 5급 기술병: 일반 서기 1, 서기 타자수 1. 장교 2명, 사병 3명 계.\n\n공병(Engineer): 대령 1; 중령 1; 중위 1; 기술중사: 주임 서기 1; 5급 기술병: 일반 서기 1, 서기 타자수 1. 장교 3명, 사병 3명 계.\n\n재무(Finance): 중령 1; 대위 1; 중위 1; 기술중사: 주임 서기 1, 재무 서기(Clerk financial) 1; 5급 기술병: 재무 서기 1, 일반 서기 1, 서기 타자수 2. 장교 3명, 사병 6명 계.\n\n보병(Infantry): 대령 1; 중령 1; 대위 1; 기술중사: 주임 서기 1; 5급 기술병: 일반 서기 1, 서기 타자수 1. 장교 3명, 사병 3명 계.\n\n감찰(IG): 중령 1; 기술중사: 주임 서기 1; 5급 기술병: 일반 서기 1, 서기 타자수 1. 장교 1명, 사병 3명 계.\n\n법무(JA): 중령 1; 기술중사: 주임 서기 1; 5급 기술병: 일반 서기 1, 서기 타자수 1. 장교 1명, 사병 3명 계.\n\n의무(Medical): 대령 1; 중령 1; 소령 1; 대위 1; 중위 2; 기술중사: 주임 서기 1; 5급 기술병: 일반 서기 2, 서기 타자수 1. 장교 6명, 사병 4명 계.\n\n병기(Ordnance): 대령 1; 중령 2; 소령 1; 대위 1; 기술중사: 주임 서기 1; 5급 기술병: 일반 서기 2, 서기 타자수 1, 민간인(Civilian) 1 (탄약·화약·폭발물 안전 기술자). 장교 5명, 사병 4명, 민간인 1명 계.\n\n병참(QM): 대령 1; 소령 1; 대위 1; 기술중사: 주임 서기 1, [판독불가]; 하사: 보급 서기 1; 5급 기술병: 일반 서기 1, 서기 타자수 1. 장교 3명, 사병 5명 계.\n\n통신(Signal): 중령 1; 소령 1; 기술중사: 주임 서기 1, 유선반장(Wire chief) 1; 5급 기술병: 일반 서기 1, 서기 타자수 1. 장교 3명, 사병 4명 계.\n\n특별근무(Special Service): 대위 1; 중위 1; 기술중사: 주임 서기 1; 5급 기술병: 일반 서기 1, 서기 타자수 1, 영사병(Projectionist) 2. 장교 2명, 사병 5명 계.\n\n[0270면]\nDECLASSIFIED\nAuthority NND 86527\n\n극동군 총사령부\n참모부장실\n무선·전보소\n\n수신 전문\n\nSECRET\n\nCG USAFIK 전문 번호 ZGCG 1497, 발신일 1947년 12월 24일, 계속:\n\n수송(Transportation): 중령 1; 소령 1; 기술중사: 주임 서기 1; 5급 기술병: 일반 서기 1, 서기 타자수 1. 장교 2명, 사병 3명 계.\n\n본부 사령부(Hq Commandant): 중령 1; 소령 1; 기술중사: 주임 서기 1; 5급 기술병: 일반 서기 1, 서기 타자수 1, 기초 훈련병(Basic) 5. 장교 2명, 사병 8명 계.\n\n총 고문단 인원: 장교 61, 준위 1, 사병 99, 민간인 1. 총원 162명.\n\n상기 고문단은 2가지 기능을 수행함:\n가. 군에 대한 고문 부대(Advisory unit to the Army).\n나. 고문단 자체 행정 및 군수 지원을 위해 배속된 근무 부대 감독.\n\n제3부: 상기 고문단이 군수적으로 자급자족하기 위해 하기 3부에 열거된 근무 부대들은 다음의 가정하에 본 고문단을 적절히 지원하는 데 필요한 최소한의 병력으로 고려된다:\n가. 파견대원들이 가족(Dependents)을 동반할 것임.\n나. 한국 정부가 숙소와 공공요금 서비스를 제공할 것임.\n다. 한국 내 모든 통신에 대한 연락 서비스는 극동공군(FEAF)이 계속 담당할 것임.\n라. 다른 미군 관련 기관들은 본 고문단에 의존하지 않을 것임.\n\n병과별 부대 목록은 다음과 같음:\n\n가. 의무(Medical):\n   (1) 고정병원(Station hospital) (75병상) — 편제표(T/O & E) 8-560, 1944년 10월 28일, 변경 1, 3, 4항 1944년 12월 2일, 1945년 1월 25일, 1945년 3월 7일. 장교 7, 간호사 6, 사병 45, 총원 58.\n   (2) 일반 진료소(General dispensary) Type GB, 편제표(T/O & E) 8-500, 1945년 1월 18일, 변경 1항 1945년 3월 27일. 장교 7, 사병 명 및 병사 14명, 총원 15명. (d) 드럼 충전 분견대 유형 FE. 장교 1명 및 병사 27명, 총원 28명. (e) 취사반 유형 제1호 AH. 병사 4명, 총원 4명. (f) 취사반 유형 제5호 AL, 병사 12명, 총원 12명. 병참 총계 151명.\n상기 부대들은 고문단을 위한 1종, 2종, 3종, 4종 및 5종 보급품을 청구, 수령, 저장 및 불출하는 데 필요함. 판매 분견대는 또한 피엑스(PX, 주둔지 매점) 보급품을 판매할 것임. 육군 이외의 한국 내 공급원으로부터 고문단을 위한 식료품을 구매하는 것은 그 희소성과 낮은 품질로 인해 고려되지 않음. 제4부: 제안된 육군이 승인되지 않을 경우, 다음으로 구성된 고문단을 권고함: 8. 경비대 본부용, 장교 5명 및 병사 5명. 총 고문단 691명.\n529\n1920\n21 88643 (이면)\n22\n\"의역 불필요! TOP SECRET 통신문\n23\n육군규정 380-5, 51항 1호 및 60항 a (4)호에 의거.\"\n24 *...\n육군규정 380-5, 1946년 3월 6일, 16-C, 18-E, 53-A, 53-D (1), 5-E (2) (3), 및 60-A (1) (2) (3) (4)항의 규정에 따라, 본 전문 축어 평문의 취급 및 동일 등급 통신문으로서의 전송이 육군부에 의해 승인되었음. 사본 번호.\n25\n26 16-50735-1 GPO\n27 -5-\n\n[0273면]\n비밀해제:\n권한 NND 886527\nSECRET\n주한미군사령관 전문 번호 ZGCG 1497, 일자 1947년 12월 24일 계속:\n나. 각 연대별 (총 9개) 장교 1명 및 병사 1명. 총 장교 14명, 병사 14명. 본 부대의 소규모 특성으로 인해, 미 국무장관 혹은 군수 지원이 승인된 기타 국무부 관원의 참모진에 배속할 것을 권고함. 국가경찰은 잘 훈련되어 있으며 부여된 임무를 훌륭히 수행하고 있음. 그 직무가 민간 성격임을 고려하여 주한미군 철수 이후에는 미 육군 인원이 고문으로서 경찰 부대에 배속되지 않도록 권고함. 제5부: 고문단을 위한 제안 편제 및 장비표와 소요 장비는 최단 시일 내에 항공 우편으로 송부 예정. 제6부: 새 안건: 추가로 한국 해안경비대를 위해 다음으로 구성된 고문단을 승인할 것을 권고함. 인원은 해군, 해안경비대 또는 자격을 갖춘 민간인이어야 함: 장교 3명 및 병사 3명.\n서명 없음\n담당: 작전참모부(G-3)\n정보: 총사령관, 참모장, 군수참모부(G-4)\n조치 완료\n분류.\n권한 의거 .\n \n \n발신시각: 232320 Z\n통신관리번호: 68046\n\"의역 불필요. 육군규정 380-5, 51항 1호 및 60항 a (4)호에 의거 TOP SECRET 통신문으로 취급할 것.\"", "secondary": "[0268면]\nDECLASSIFIED\nAuthority NND86527 GENERAL HEADQUARTERS, FAR EAST COMMAND\nADJUTANT GENERAL'S OFFICE WFS\nRADIO AND CABLE CENTER\n\nINCOMING MESSAGE\n\nTOO: 24 Dec 47\n\nFROM: CG USAFIK\nTO: CINCFE repeat to DA\n\nSECRET\n\nNR: ZGCG 1497 Subject is South Korean Army. References are:\na. CX 57425, 18 Dec;\nb. W 91520, 3 Dec;\nc. CX 57200;\nd. ZGCT 1472, 12 Dec.\n\nThis radio in 6 parts:\n\nPart 1: The proposed organization of the advisory group is based on the premise that initially it will be a self-contained mission due to the inability of the Korean economy to furnish any of the many items required except billets and utilities. It is considered inadvisable to subsist even partially the group on the Korean economy as was done in China for political reasons and their non-existence or unsuitability for the most part.\n\nPart 2: Based on the assumption that the Korean Army as proposed has been organized and that mobilization and initial training are completed, the following permanent advisory group is recommended for the Korean Army:\n\nCommander and Aides Section: Maj Gen 1; Capt 1; Lt 1; Stenographer 1; Tec 5: Clerk typist 1. Total 3 off, 3 EM.\n\nC/S: Col 1; Lt Col 1; M Sgt: Chief clerk 1; T Sgt: Stenographer 1, Clerk typist 1; Tec 5: Intelligence 1, Clerk general 1, Clerk typist 1, Cryptographer 1, Draftsman 1. Total off 2, EM 8.\n\nG-3: Col 1; Lt Col 2; Maj 1; M Sgt: Chief Clerk 1; T Sgt: Clerk general 1, Clerk typist 1, Draftsman 1. Total off 4, EM 4.\n\nG-4: Col 1; Maj 1; M Sgt: Chief clerk 1; T Sgt: Clerk supply 1; Tec 5: Clerk general 1, Clerk typist 1. Total off 2, EM 4.\n\nAG - G-1: Col 1; Capt 1; Lt 1; WO 1; M Sgt: Chief clerk 1; T Sgt: Postal 1; S Sgt: Clerk general 1; Tec 5: Clerk basic 2, Clerk postal 2, Clerk typist 1. Total off 3, WO 1, EM 7.\n\nArtillery: Col 1; Lt Col 1; Capt 1; T Sgt: Chief clerk 1; Tec 5: Clerk general 1, Clerk typist 1. Total off 3, EM 3.\n\n[0269면]\nDECLASSIFIED\nAuthority NND 86527\n\nSECRET\n\nCG USAFIK MSG NBR ZGCG 1497 DTD 24 DEC 47 CONTINUED:\n\nAviation: Lt Col 1; Capt 1; T Sgt: Chief clerk 1; Tec 5: Clerk general 1, Clerk typist 1. Total off 2, EM 3.\n\nChaplain: Lt Col 2; T Sgt: Chief clerk 1; Tec 5: Clerk general 1, Clerk typist 1. Total off 2, EM 3.\n\nEngineer: Col 1; Lt Col 1; Lt 1; T Sgt: Chief clerk 1; Tec 5: Clerk general 1, Clerk typist 1. Total off 3, EM 3.\n\nFinance: Lt Col 1; Capt 1; Lt 1; T Sgt: Chief clerk 1, Clerk financial 1; Tec 5: Clerk financial 1, Clerk general 1, Clerk typist 2. Total off 3, EM 6.\n\nInfantry: Col 1; Lt Col 1; Capt 1; T Sgt: Chief clerk 1; Tec 5: Clerk general 1, Clerk typist 1. Total off 3, EM 3.\n\nIG: Lt Col 1; T Sgt: Chief clerk 1; Tec 5: Clerk general 1, Clerk typist 1. Total off 1, EM 3.\n\nJA: Lt Col 1; T Sgt: Chief clerk 1; Tec 5: Clerk general 1, Clerk typist 1. Total off 1, EM 3.\n\nMedical: Col 1; Lt Col 1; Maj 1; Capt 1; Lt 2; T Sgt: Chief clerk 1; Tec 5: Clerk general 2, Clerk typist 1. Total off 6, EM 4.\n\nOrdnance: Col 1; Lt Col 2; Maj 1; Capt 1; T Sgt: Chief clerk 1; Tec 5: Clerk general 2, Clerk typist 1, Civilian 1 (ammunition powder and explosives safety engineer). Total off 5, EM 4, civilian 1.\n\nQM: Col 1; Maj 1; Capt 1; T Sgt: Chief clerk 1, [illegible]; Sgt: Clerk supply 1; Tec 5: Clerk general 1, Clerk typist 1. Total off 3, EM 5.\n\nSignal: Lt Col 1; Maj 1; T Sgt: Chief clerk 1, Wire chief 1; Tec 5: Clerk general 1, Clerk typist 1. Total off 3, EM 4.\n\nSpecial Service: Capt 1; Lt 1; T Sgt: Chief clerk 1;\n\n[0270면]\nDECLASSIFIED\nAuthority NND 86527 GENERAL HEADQUARTERS, FAR EAST COMMAND\nADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\n\nINCOMING MESSAGE\n\nSECRET\n\nCG USAFIK MSG NBR ZGCG 1497 DTD 24 DEC 47 CONTINUED:\n\nSpecial Service (cont): Tec 5: Clerk general 1, Clerk typist 1, Projectionist 2. Total off 2, EM 5.\n\nTransportation: Lt Col 1; Maj 1; T Sgt: Chief clerk 1; Tec 5: Clerk general 1, Clerk typist 1. Total off 2, EM 3.\n\nHq Commandant: Lt Col 1; Maj 1; T Sgt: Chief clerk 1; Tec 5: Clerk general 1, Clerk typist 1, Basic 5. Total off 2, EM 8.\n\nTotal advisory group: Off 61, WO 1, EM 99, civilians 1. Aggregate 162.\n\nThe above advisory group will perform 2 functions:\na. Advisory unit to the Army.\nb. Responsible for its own administration and supervision of service units assigned for logistic support.\n\nPart 3: In order for the above advisory group to be logistically self-sufficient the service units listed in part 3 are considered the minimum necessary to properly support the advisory group, assuming that:\na. Dependents will accompany members of the group.\nb. The Korean Government will furnish quarters and utilities service.\nc. Courier service to all within Korea will be continued by FEAF.\nd. Other US agencies will not be dependent on the group.\n\nList of units by service follows:\n\na. Medical:\n(1) Station hospital (75 bed) TO & E 8-560 dtd 28 Oct 44 with changes 1, 3, and 4 dtd 2 Dec 44, 25 Jan 45, 7 Mar 45. 7 off, 6 nurses, 45 EM, aggregate 58.\n(2) General dispensary Type GB, TO & E 8-500 dtd 18 Jan 45 with change 1 dtd 27 Mar 45. 7 off, 13 EM, aggregate 20.\nTotal medical 78. The above medical units are required to provide medical care for 691 US Army personnel and an estimated 400 dependents. The hospital will be located in the Seoul area and the general dispensary in the Pusan area.\n\nb. Ordnance:\n(1) Automotive maintenance team Type DA. One off, 28 EM, aggregate 29.\n(2) [illegible] 5 EM. One off.\nTotal Ordnance 34. The above Ordnance units are necessary to provide Ordnance repair for vehicles, arms and Ordnance equipment for the group. Will stock and issue spare parts.\n\nc. Military Police:\n(1) Military Police company, T/O & E 19-57 dtd 2 Nov 44 with changes 1 and 2 dtd 2 Aug 45 and 28 Sep 45. Five off, 145 EM, aggregate 150.\n(2) Criminal investigation detachment, Type BI, T/O & E 19-500 dtd 25 Sep 45 with change 1 dtd 3 Jul 47. One off, 11 EM, aggregate 12.\nTotal Military Police 161. The above units are necessary to provide adequate security for the members of the group and accompanying dependents, security of storage and warehouse areas and criminal investigation of members of the advisory group only when required.\n\nd. Signal: The units listed below are taken from [illegible] dtd 12 Feb 45; 31 Mar 45, 23 Jun 45; [illegible]; 30 Mar 45, 28 Jun 45, [illegible]\n(1) Hq company column AC, 2 off, 9 EM, aggregate 11.\n(2) Depot team column CA 1 off, 8 EM, aggregate 9.\n(3) Radio team column EL 6 off, 34 EM, aggregate 40.\n(4) Code room team column EQ 3 off, 5 EM, aggregate 8.\n(5) Code equipment maintenance team column ER 1 off, 1 EM, aggregate 1.\n(6) Message center team column DB 3 off, 12 EM, aggregate 15.\n(7) Teletype team, 2 times column GI 4 EM, aggregate 8.\nTotal Signal 92. The above units are necessary to maintain communications between Pusan and Seoul, and Seoul and Far East Command. The existing Korean communication system will be utilized to the maximum.\n\n[0271면]\nDECLASSIFIED\nAuthority NND 86527\n\nSECRET\n\nCG USAFIK MSG NBR ZGCG 1497 DTD 24 DEC 47 CONTINUED:\n\n(e. Engineer: [illegible - page likely continues or is cut off])\n\n[0272면]\nDECLASSIFIED\nAuthority NND 886527 GEN HEADQUARTERS, FAR EAST COM\nADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\nINCOMING MESSAGE\nCG USAFIK MSG NBR ZGCG 1497 DTD 24 DEC 47 CONTINUED: and 10 EM (2 T Sgts, 1 S Sgt, 3 Tec 4's, 4 Tec 5's) (total Trans-portation 13) will be required to supervise the loading, tem-porary warehousing and shipment of equipment and supplies for the advisory group only. All labor details will be performed by contract labor. Quartermaster: with change 1 to 23 Nov 43. (1) Base depot, T/O & E, 10-367 dtd 26 Oct 43 Four off, 71 EM, aggregate 75. (2) The following units are taken from T/O & E 10-500 dtd 10 Jan 45: (a) Bakery detachment Type BF, 6 EM, ag-gregate 6. (b) Graves registration team Type GA. One off and 10 EM, aggregate 11. (c) Sales detachment Type BD. One off and 14 EM, aggregate 15. (d) Drum filling detachment Type FE. One off and 27 EM aggregate 28. (e) Mess team Type No 1 AH. Four EM aggregate 4. (f) Mess team Type No 5 AL, 12 EM, aggre-gate 12. Total Quartermaster 151. The above units are necessary to requisition, receive, store, and issue Class I, II, III, IV and V supplies for the advisory group. The sales detachment will also sell post ex-change supplies. The purchase of food stuffs for the group from Korean sources other than Army is not contemplated due to its scarcity and poor quality. Part 4: In the event the proposed Army is not approved, an advisory group consisting of the following is recommended: 8. For constabulary HQ, 5 off and 5 EM. Total advisory group 691.\n[0273면]\nDECLASSIFIED:\nAuthority NND 886527\nSECRET\nCG USAFIK MSG NBR ZGCG 1497 DTD 24 DEC 47 CONTINUED:\nb. For each regiment (total 9) 1 off and 1 EM. Total 14 off, 14 EM. Due to the small size of this unit, recommend it be attached to the staff of the US minister or such other State Department officers as are authorized for logistic support. The National Police are well trained and are performing their assigned mission in an excellent manner. Due to the fact that their duties are of a civil nature recommend that no US Army personnel be assigned to the unit as advisors subsequent to withdrawal of USAFIK. Part 5: Proposed T/O & E and equipment required for the advisory groups will be forwarded by airmail earliest. Part 6: New subject: Recommend in addition advisory group consisting of the following be authorized for the Korean Coast Guard. These personnel to be Navy, Coast Guard, or qualified civilians: Three off and 3 EM.\nNO SIG\nACTION : G-3 INFORMATION: COMMANDER IN CHIEF, CHIEF OF STAFF, G-4\nACTION COMPLETED\nClassification.\nauthority of EO\n\nTOO: 232320 Z\nMCN : 68046 \"Paraphrase not required Handle as TOP SECRET correspondence per para 51 1 and 60 a (4) AR 380-5.\"", "notes": [], "note": "기계 판독 참고 — Several sections are severely garbled, especially Ordnance sub-paragraph (2), Signal T/O&E dates, and the apparent continued text on page 0271 regarding Engineers which is cut off. These have been marked [illegible] or [판독불가] where unrecoverable. The subject line and document date are internally consistent; external date on top header strip states 1945-01-10 which is inconsistent with message date 1947-12-24 and likely an archival misfile annotation. The message is marked SECRET but handling caveats reference TOP SECRET correspondence, which may refer to the distribution procedures of the copy. / OCR 오류 다수 교정. 'with change 1 td 23 No 43'을 'with change 1 to 23 Nov 43'로 교정. 품목 코드 일부 불분명하나 원문 유지. 0272쪽에 'Total advisory group 691. 529' 등 문맥 파편화된 숫자열은 원문 그대로 보존.", "warn": false, "pages": ["0268", "0269", "0270", "0271", "0272", "0273"]}, {"id": "D040", "order": 39, "date": "1947-12-31", "group": "B", "eyebrow": "D040 · B. 한국군 창설·훈련", "title": "주한미군 군사고문단 규모 관련 G-3 회의록: 미육군성 회신에 162명 규모 권고", "badge": "TOP SECRET", "list_right": "0274–0275", "meta": [{"k": "발신", "v": "G-3", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "memorandum"}, {"k": "면", "v": "0274–0275 (2면)"}, {"k": "건명", "v": "Establishment of a South Korean Army", "txt": true}], "summary": "G-3 Memo for Record regarding recommendations on an advisory group for the South Korean Army", "points": ["주한미군사령부(USAFIK)는 초기 600명 규모 고문단 권고에서, 극동군사령부의 이의제기로 162명 고문단과 529명 지원병력으로 수정 권고함.", "G-3는 이 162명 수정안을 미육군성(D/A)의 남조선군 지원 계획을 위한 합리적 근거로 판단하고 극동군사령관의 공식 답변으로 전달할 것을 권고함.", "남조선군 장비 지원 능력에 관한 제1부 및 제2부 문제는 G-4에서 별도로 조치 중임.", "제안된 전문은 G-4의 동의를 받아 참모총장실의 승인을 거쳐 워싱턴으로 발송될 예정임."], "primary": "[0274면]\n기밀해제\n권한 NND8X6527\n2급비밀(TOP SECRET)\nBLP/sib\n1947년 12월 31일\n\n회의록(MEMO FOR RECORD):\n\n제목: 남조선군 창설.\n\n1. 근거(기본문서): 12월 3일자 워싱턴 전문(W) 91520. 제3부에서 남조선 주둔 군사고문단 또는 사절단의 구성 및 기능에 관한 극동군 총사령관(CINCFE)의 견해를 요청함.\n\n2. 참조:\n   가. 12월 9일자 CX 57200. 주한미군사령관(CG, USAFIK)에게 근거(기본문서) 제3부에 대한 권고안을 제출할 것을 지시함.\n   나. 12월 13일자 ZGCT 1472. 주한미군사령부가 600명의 고문단과 1,000명의 지원병력(안)을 극동군 총사령관에게 제출한 권고.\n   다. 12월 18일자 CX 57425. 참조 '나'의 주한미군사령부 권고 근거에 오류가 있음을 지적하고 추가 연구를 요청함.\n   라. 12월 23일자 주한미군사령부 권고 ZGCG 1497. 참조 '다'에 대한 답변으로 수정된 권고안을 제시함.\n\n3. 논의:\n   참조 '나'는 참조 '다'의 발송을 지지했던 12월 17일자 G-3 회의록에서 상세히 논의되었음.\n   참조 '라'는 당초 권고되었던 600명의 고문단과 1,000명의 지원병력 대신 총 162명의 고문단과 총 529명의 지원부대 지원을 제안하고 있음. 현재의 권고안은 전체 병력 규모 면에서 전적으로 합리적으로 보이며, 현시점에서 미육군성(D/A)의 기획을 위한 적절한 근거를 제공할 것임.\n   이 문제에 관해 명백히 부당한 주한미군사령부 권고에 의해 필요해진 경우를 제외하고는 극동군 총사령관의 직접적인 권고를 피하는 것이 바람직하므로, 참조 '라'를 근거(기본문서) 제3부에 대한 극동군 총사령관의 답변으로서 원본 형태 그대로 미육군성에 전달해야 한다고 사료됨.\n   근거(기본문서) 제1부 및 제2부는 제안된 남조선군 장비 지원과 관련된 전구 보급 능력 산정을 다루고 있음. 이 부분에 대한 답변을 제공하기 위해 G-4에서 별도 조치가 시작되었음. 근거(기본문서) 제3부가 다루는 주제는 현재로서는 관련이 없음.\n\n4. 권고:\n   가. G-3는 제안된 전문을 승인 및 G-3 발송 회부를 위해 참모총장비서실(CSGPO)로 전달하는 내용의 비망록(C/N)을 참모차장(D C/S)을 경유하여 참모총장(C/S)에게 기안함.\n   나. 제안된 전문의 CSGPO 승인을 조건으로, G-3 행정과에서 CSGPO 관련 미육군성으로 참조 '라' 전달 조치.\n\n5. 2급비밀(TOP SECRET)\n\n[0275면]\n기밀해제\n권한 NND8X6527\n2급비밀(TOP SECRET)\n\n5. 완료: 이것으로 근거(기본문서)에 대한 G-3 조치를 완료함. 근거(기본문서)에 대한 지속적 조치는 G-4에서 인수하였음. 참조 '라'(12월 24일 ZGCG 1497)에 대한 조치도 완료함.\n\n6. 합의: 제안된 전문에 대한 G-4의 합의가 해당 문서에 표시되어 있음.\n\n담당 장교\n[서명란]\n\n2급비밀(TOP SECRET)", "secondary": "[0274면]\nDECLASSIFIED\nAuthority NND8X6527\nTOP SECRET\nBLP/sib 31 December 1947 MEMO FOR RECORD:\n\nSUBJECT: Establishment of South Korean Army.\n\n1. BASIC: W 91520/3 December, which in Part 3 requests CINCFE views on composition and functions of a military advisory group or mission for South Korea.\n\n2. REFERENCES:\na. CX 57200/9 Dec, which directs CG, USAFIK to submit recommendations on Part 3 of Basic.\nb. ZGCT 1472/13 Dec, which submits USAFIK recommendations to CINCFE for an advisory group of 600 supported by 1000 service troops.\nc. CX 57425/18 Dec, which points out fallacies in basis on which USAFIK recommendations in ref b were based and requests further study.\nd. USAFIK recommendation ZGCG 1497/23 Dec, which in answer to ref c presents revised recommendations.\n\n3. DISCUSSION:\nRef b was discussed in detail in G-3 M/R dated 17 Dec which supported dispatch of ref c. Ref d proposes advisory group totaling 162, supported by service units totaling 529 as opposed to original recommendations for an advisory group of 600 supported by service troops totaling 1000. Current recommendation appears entirely reasonable from standpoint of total strength, and should provide an adequate basis for D/A planning at this time. Inasmuch as it is desirable to avoid direct CINCFE recommendations on this matter except where made necessary by obviously unsound USAFIK recommendations, it is believed that ref d should be passed to D/A in its original form as CINCFE answer to Part 3 of Basic. Parts 1 and 2 of Basic deal with computation of theater supply capabilities with respect to equipping proposed South Korean Army. Separate action has been initiated by G-4 to provide answers to this portion of Basic. Subject covered by Part 3 of Basic is not related at this time.\n\n4. RECOMMEND:\na. G-3 initial attached C/N to C/S (through D C/S) forwarding proposed radio to CSGPO for approval and return to G-3 for dispatch.\nb. Contingent on approval of proposed radio to CSGPO, G-3 Adm arrange to have ref d passed to D/A for CSGPO.\n\n5. TOP SECRET\n\n[0275면]\nDECLASSIFIED\nAuthority NND8X6527\nTOP SECRET\n\n5. COMPLETION: This completes G-3 action on Basic. Continuing action on Basic has been accepted by G-4. This also completes action on ref d (ZGCG 1497/24 Dec.).\n\n6. CONCURRENCE: G-4 concurrence in proposed radio is indicated thereon.\n\nAction Officer\n[signature block]\n\nTOP SECRET", "notes": [], "note": "기계 판독 참고 — OCR 오류로 보이는 부분(예: 'reconmendatioh' -> 'recommendation ZGCG 1497')을 문맥에 맞게 복원하고, 문서의 내용 흐름을 고려하여 참조 라(ref d)의 수정 권고안을 논리적으로 재구성하였음.", "warn": false, "pages": ["0274", "0275"]}, {"id": "D041", "order": 40, "date": "1947-12-09", "group": "D", "eyebrow": "D041 · D. 장래 정책·철군", "title": "CINCFE, WAR 91520에 대한 회신: 한국 내 장비 철수 및 소개(疏開) 소요 추정", "badge": "TOP SECRET", "list_right": "0276–0278", "meta": [{"k": "발신", "v": "CINCFE", "txt": true}, {"k": "수신", "v": "DA (CSGPO)", "txt": true}, {"k": "참조", "v": "CG USAFIK", "txt": true}, {"k": "전문번호", "v": "UX 57175 (reply to WAR 91520)"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0276–0278 (3면)"}, {"k": "건명", "v": "Withdrawal from Korea", "txt": true}], "summary": "CINCFE reply to WAR 91520: equipment withdrawal and evacuation estimates for Korea", "points": ["CINCFE는 현장 논의 결과, 극동군 소요 충당 및 미국 본토 반환을 위해 한국에서 약 19,000롱톤의 장비와 보급품을 철수할 계획이다.", "한국군에 조기 실용성이 없는 60개 특수 품목을 제외한 대부분의 장비는 한국 이전이 바람직하지 않다고 판단했다.", "철수에 소요되는 기간은 실제 이동 10~20일, 사전 선별 및 선적 준비에 90일로 예상된다.", "미군 철수 시 한국군에 불필요한 특수 장비 외 잔여 물자는 모두 한국 정부에 인도할 것을 권고했다."], "primary": "[0276면]\n군사기밀 해제\n해제 권한 NND 816527\n극동군 총사령부(GHQ/FEC)\n부관실\n무선·전보 통신실\n일급 기밀(TOP SECRET)\n수신 전문\n기밀(SECRET)\n1947년 12월 4일\n\n발신: 육군부(DA) (CSGPO)\n참조: CG USAFIK, CINCFE 조치 완료 B CX-57728 (030505)\n전문 번호: WAR 91520\n\n참조: WAR 89253; WAR 90136 및 USAFIK의 ZGCG 1396.\n\n11 한국 군대에 관하여, 남한 정부 수립 가능성에 비추어 아래 사항을 포함한 귀관의 의견과 권고를 요청함:\n\nA. 연간 장비 대체율.\n- USAFIK 문서 TFGCG 322, 1947년 11월 11일, 제목 \"제안된 한국군\"에 포함된 병력 기초 및 T/E(편제및장비표) 전제. 현재 귀 사령부에서 검토 중인 것으로 알고 있음.\n\n2부. 위 (B)항의 전구(戰區) 능력은 다음 전제에 기초하여 추산할 것:\n\nB. 한국 내 창고 재고 및 XXIV 군단 장비 이외의 전구 자원 활용.\nC. 한국 내 XXIV 군단 T/E 및 창고 재고 활용, 그리고 우선순위 2-A.\n\n3부. 귀관의 견해는 또한 군사 고문단 또는 사절단의 구성 및 기능에 관하여 다음 두 조건 하에서 요청됨:\n\n18 A. 미군 철수 이후, 남한 군대 창설 조치가 취해진 경우.\n19 B. 미군 철수 이후, 남한 군대 창설 조치가 없는 경우.\n\n조치 부서: G-3 계획\n정보: 총사령관\n\n발신시간(TOO) 032037-Z\n\"의역 불요. 일급 기밀(TOP SECRET) 통신으로서의 기밀(SECRET). MCN: 66888\n정보 사본 \n본 전문의 축어적 평문 취급 및 전송은 1946년 3월 6일자 육군 규정 380-5호 제16-C, 18-E, 53-A, 53-D (1) 및 60-A (1) (2) (3) (4)항 규정에 의거, 육군부가 동일 등급의 통신으로서 승인하였음.\n\n[0277면]\n군사기밀 해제\n해제 권한 NND86527\n일급 기밀(TOP SECRET)\n극동군 총사령부\n발신 전문\n1947년 12월 9일\n\n발신: CINCFE\n수신: 육군부 ... 정규 080415\n참조: CG USAFIK ... 정규\n\n전문 번호: UX 57175\n\nZEBRA GEORGE CHARLIE GEORGE ONE THREE NINE SIX(전문 번호 ZGCG 1396) 1947년 11월 TOO에 대한 CINCFE의 검토임 PD\n\n다음은 육군부 및 USAFIK 참모들과의 현장 논의 결과에 따른 제3절에 대한 의견임. PD 계획참모부장 통(Tonge) 장군이 제시된 내용에 동의함. PD\n\n제2부. PA 계획 기초로서 다음 장비와 보급품은 제브라(ZEBRA) 1호Z.I.(미국 본토)로 반환하거나 또는 FEC(극동군)의 소요를 충당하기 위해 한국에서 철수될 것임. 이는 부대 철수 여부와 관계없음. 대령(COLON) T/O&E 및 EST분: 4천(4,000) 롱톤. 병영(Post, Camp & Station)분: 부대 철수 시 5천(5,000) 롱톤으로 제한. 창고 재고분: 1만(10,000) 롱톤. PD\n\n기준은 상기 열거된 보급품 및 장비 수량이 1951년 6월 0일(50.6.0)까지 최대한 신속하게 이동되고, ECL(Easy Charlie)의 처분 수준 혹은 현재 Z.I.(미국 본토)로 반환되어야 하는 품목이어야 한다는 것임. 그리고 한국 측으로 이전하는 것은 바람직하지 않다고 판단됨. PD 단 60개 품목만이 다소 특수한 유형으로 한국군의 조기 효용성이 없다고 간주되어 Z.I.(미국 본토)로 반환할 필요가 있으며, 그 결과 제2부에 수록된 목록에서 삭제될 것임. PD\n\n정보 사본.\n\n[0278면]\n군사기밀 해제\n해제 권한 NND86527\n일급 기밀(TOP SECRET)\n\n육군부 (JCS) 앞 전문 (이어서)\n\n제3부. PA ZGCG 1396 제3절 제0항에 명시된 90일 대신에 상기 명시된 보급품 및 장비를 철수하는 데 최소 10일 내지 20일이 소요될 것으로 추산됨. PA 이동 개시 전 선별 및 선적 준비에 추가 90일이 소요될 것임. PD\n\n제4부. PA 제2부에 포함된 것 이외의 보급품 및 장비는 미군 철수 시 한국 정부에 인도할 것을 권고함. PD\n\n제5부. PA 제브라 전문(ZEBRA RADIO) 제3절 제0항에 열거된 병력(통스/TONGES)은 상기 제2부에 열거된 보급품 및 장비의 선적 개시 이전에 해제(철수)되어야 할 것임. PA\n\n공식 발송자: 승인자:\nR. M. 레비(LEVY) H. B. 이 스투드(E STEOD)\n부관실장, 대령(AGD) 참모차장보(G-4), 대령(GSC)\n\n배부처: 총사령관(CinC) SINC\n참모장(C/S)\n수송 G-3 과\n병기 과\n공병\nT12\nGIC", "secondary": "[0276면]\nDECLASSIFIED\nAuthority NND 816527 GENERAL HEADQUARTERS, FAR EAST COMMAND\nADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\nTOP SECRET\nINCOMING MESSAGE\nSECRET\n4 Dec 47\n\nFROM: DA (CSGPO)\nINFO: CG USAFIK, CINCFE ACTION COMPLETED B CX-57728 (030505)\nNR: WAR 91520 Refer WAR 89253; WAR 90136 and USAFIK'S ZGCG 1396.\n\n11 Korean Armed Forces, your comments and recommendations are requested to include: In light of possibility of establishment of South A. Annual equipment replacement rates.\n- assumption of troop basis and T/E contained in USAFIK's Letter TFGCG 322, 11 Nov 47, subj, \"Proposed Korean Army\" now understood to be under review in your headquarters.\n\nPart 2. Theatre capabilities in (B) above should be estimated on the following assumptions:\n\nB. Utilization of theatre resources other than Korea depot stocks and XXIV Corps equipment. C. Utilization of XXIV Corps, T/E and depot stocks in Korea or, and a priority of 2 A.\n\nPart 3. Your views are also requested on the composition and functions of a military advisory group or mission under two conditions:\n\n18 A. Subsequent to United States troop withdrawal and provision made for establishment of South Korean Armed Forces. 19 B. Subsequent to United States troop withdrawal with no provision for South Korean Armed Forces.\n\nACTION: G-3 Plans INFORMATION: COMMANDER IN CHIEF,\n\nTOO 032037-Z\n\"Paraphrase not required. SECRET as TOP SECRET correspondence. MCN: 66888 Info. Cy. sent to apt and 60 a (4) AR 380-5 Handling and transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946.\n\n[0277면]\nDECLASSIFIED\nAuthority NND86527\nTOP SECRET\nGENERAL HEADQUARTERS\nFAR EAST COMMAND\nOUTGOING MESSAGE\n9 December 1947\n\nFROM: CINCFE\nTO: DEPT OF ARMY ... ROUTINE 080415\nINFO: CG USAFIK ... ROUTINE\n\nNR: UX 57175\n\nLITEN GO GE UNCLE SUGAR EASY FOX ITEM KING RADIO ZIR. GEORGE CHARLIE GEORGE ONE THREE NINE SIX TOO NOVEMBER ONE NINE FOUR SEVEN PA\n\nTHE FOLLOWS COMMENTS ON SECTION III AS RESULT OF ON THE GROUND DISCUSSIONS BETWEEN DEPT OF THE ARMY SPARE A UNCLE SUGAR EASY FOX ITEM KING STAFF. PD GENERAL TONGE CONCURS IN CONTENTS PRESENTED PD\n\nPART II PA AS A PLANNING BASIS THE FOLLOWING EQUIPMENT AND SUPPLIES WOULD BE WITHDRAWN FROM KOREA FOR EITHER RETURN TO ZEBRA I EM AND SLANT OR TO MEET REQUIREMENTS OF FOX EASY CHARLIE CM I RESPECTIVE OF WHETHER TROOPS WITHDRAWN IS UNITS OF C. COLON TAPE OER AND EST FOUR ZERO ZERO ZERO LONG TONS CM POST CAP WITH STIPULATION TO FIVE C ZERO ZERO ZERO LONG TONS CM DEPOT STOCKS ONE TO ZERO CM ZERO ZERO ZERO ZERO LONG TONS PD\nCRITERIA IS THAT THE ABOVE 3-S DELINEATED QUANTITIES OF SUPPLIES AND EQUIPMENT WILL BE MOVED TO MOST ROTTE HELES WITHIN THE PERIOD ZERO JUNE FIVE ONE DISPOSITION LEVEL OF THE EASY CHARLIE OR IN IS CURRENTLY REQUIRED TO BE RETURNED TO THE ZEBRA I EM AND IS THOUGHT IT IS NOT DESIRABLE TO TRANSFER TO KOREAN POSTICE PO ONLY SIXTY ITEMS WITH PO SOMEWHAT SPECIAC TYPES OF EQUIPMENT AND SUPPLIES WHICH ARE NOT CONSIDERED TO BE OF EARLY UTILITY TO THE KOREAN ARMY ARE NECESSARY TO BE RETURNED TO THE ZEBRA I EM AND AS A RESULT WILL BE DELETED FROM LIST CONTAINED IN PART II PD\n\nINFORMATION COPY\n\n[0278면]\nDECLASSIFIED\nAuthority NND86527\nTOP SECRET\n\nRADIO TO DEPT OF THE ARMY (JCOS) CONTINUED\n\nPART III PA IT IS ESTIMATED A MINIMUM PERIOD OF ONE TO ZERO ROUGH DAYS WILL BE REQUIRED TO EVACUATE THE ABOVE STINTED RUNTS OF SUPPLIES AND EQUIPMENT INSTEAD OF THE NINE ZERO DAYS OUTLINED IN PARAGRAPH TO OF SECTION III OF ZEBRA GEORGE CHARLIE GEORGE ONE THREE NINE SIX PA AN ADDITIONAL NINE ZERO DAYS BEFORE MOVEMENT IS PROBABLY WILL BE REQUIRED FOR SECRETION AND PREPARATION FOR SHIPPING PD\n\nPART IV PA IT IS RECOMMENDED THAT SUPPLIES AND EQUIPMENT OTHER THAN TO IN IN PART II BE TURNED OVER TO KOREAN GOVERNMENT UPON TITLE UNCLE SUGAR TROOPS PT\n\nPART V PA TONGES LISTED IN PARAGRAPH OF SECTION III OF ZEBRA RADIO WOULD BE LIFTED PRIOR TO INITIATION SHIPPING OF SUPPLIES AND EQUIPMENT LISTED IN PART II ABOVE PA\n\nOFFICIAL: APPROVED:\nR. M. LEVY H. B. E STEOD\nAdjutant General Colonel, AGD Assistant Chief of Staff, G-4 Colonel, GSC Copies furnished: CinC SINC\nC/S\nTransp G-3 Sec Ord Sec Engr\nT12\nGIC", "notes": [], "note": "기계 판독 참고 — Original message contained phonetic alphabet (e.g., 'ZEBRA GEORGE CHARLIE GEORGE' for ZGCG) and garbled run-on text in parts due to encryption/decryption artifacts, which have been interpreted and reconstructed for readability. 'ROTTE HELES' interpreted as 'most readily' or 'most rapidly'. 'STINTED RUNTS' interpreted as 'stated amounts'.", "warn": false, "pages": ["0276", "0277", "0278"]}, {"id": "D042", "order": 41, "date": "1947-11-12", "group": "D", "eyebrow": "D042 · D. 장래 정책·철군", "title": "향후 대(對)한국 정책 및 주한미군 철수 계획에 관한 견해 요청", "badge": "TOP SECRET", "list_right": "0279–0286", "meta": [{"k": "발신", "v": "WAR (CSGPO)", "txt": true}, {"k": "수신", "v": "CINCFE", "txt": true}, {"k": "참조", "v": "CG USAFIK", "txt": true}, {"k": "전문번호", "v": "WX 90136"}, {"k": "종류", "v": "other"}, {"k": "면", "v": "0279–0286 (8면)"}, {"k": "건명", "v": "Future Policy in Korea", "txt": true}], "summary": "Request for views on future Korea policy and withdrawal planning", "points": ["전쟁부는 유엔 결의안 이행 또는 소련의 비협조라는 두 시나리오에 대비해 1948년 3분기로 예상되는 주한미군 철수에 앞서 한국 정책에 관한 주한미군사령관과 극동군총사령관의 견해를 요청했다.", "남한군 창설 문제는 별도 검토 중이며, 철수 전 완료가 바람직한 민간 사업(토지개혁 등)에 관한 정보도 함께 요구되었다.", "극동군사령부는 주한미군사령관이 이미 육군성에 직접 송부한 상세 견해에 대해 군수적 요소가 부정확하지 않는 한 별도 논평을 하지 않기로 결정했다.", "육군성의 재요청이 있을 경우에 대비해 호지(Hodge) 장군이 제시한 군수 제반 요소를 G-4 중심으로 검토하도록 지시했다.", "G-4는 호지 장군이 제시한 한국 내 미군 장비 철수 기간 90일을 낙관적으로 평가하며, 항만 용량과 선박 수송 일정을 고려할 때 4~6개월이 더 현실적이라고 판단한다.", "워싱턴 당국이 어떤 장비와 보급품을 한국에서 철수하고 남길지에 대한 주요 결정을 먼저 내려야만 구체적인 계획 수립이 가능하다고 지적한다.", "G-4는 호지 장군의 철수 물량 추정을 대체로 정확하다고 보았으며, 워싱턴이 주요 쟁점을 인지할 것이므로 별도 논평은 필수적이지 않다고 언급하면서도, 필요한 경우를 위한 예비 논평 문안을 제시한다."], "primary": "[0279면]\n비밀해제\n권한 NND86527\n극동사령부\n미태평양육군총사령부 인사행정참모실\n무선 및 전문 센터\n수신 전문\n일급비밀\n발신시각: 111804Z\n발신: 전쟁부 (CSGPO)\n수신: 극동군총사령관 (CINCFE)\n정보배포: 주한미군사령관 (CG USAFIK)\n전문번호: WX 90136\n\nSWNCC 176/30 문단 5 F에서 권고된 SANACC 극동소위원회가 장래의 한국 정책을 결정함에 있어, 특히 주한미군사령관의 상세한 견해와 논평을 연구하는 데 도움을 주기 위해, 다음과 같은 고려 사항에 비추어 향후 행동 방침 개발에 관한 주한미군사령관의 세부 견해와 귀관의 추가 논평을 보내주시면 감사하겠습니다.\n\n제2부. 두 가지 주요 대안이 고려됩니다. (A) 소련이 11월 5일자 국무부 전문 258호로 발송된 결의안을 통과시킨 유엔 결정에 협력하기를 거부할 가능성이 가장 높습니다. 이 경우 미국은 남한에서 가능한 한 그 결의안을 이행하기로 결정할 가능성이 큽니다. (B) 소련이 유엔 결정 이행에 협력할 경우입니다. 이 경우 미국은 결의안에 요약된 행동을 따를 것이며, 아래 제3부에서 언급된 귀관의 질서 있는 철수 개요 계획을 충분히 고려하여 적절한 지시가 발령될 것입니다.\n\n제3부. 양 대안 모두 남한 정부 혹은 통일 한국 정부 수립 직후, 아마도 1948년 3분기에 미군 철수 가능성을 포함합니다. 실제 철수 시기 결정은 분명히 소련의 행동, 북한군의 존재와 남한 주민의 기질에 영향을 받는 정세 전망을 포함한 전개 상황에 달려 있을 것입니다(주한미군사령관 ZGCG 1337). 이러한 고려 사항에 비추어, 그리고 시간 요소를 적절히 평가하고 상호 연관시키기 위해, 전보 요약과 함께 항공 우편으로 질서 있는 철수를 위한 개요 계획을 보내주시면 대단히 감사하겠습니다.\n\n\"의역 불필요. 일급비밀. 육군규정 380-5, 51 1항 및 60 a (4)항에 따라 일급비밀 문서로 취급.\"\n본 메시지의 문자 그대로의 평문을 동일 등급의 서신으로 취급 및 전송하는 것은 1946년 3월 6일자 육군규정 380-5의 16-C, 18-E, 53-A, 53-D (1) (2) (3), 60-A (1) (2) (3) (4)항 규정에 따라 전쟁부가 승인하였음.\n\n일급비밀\n\n\n[0280면]\n비밀해제\n권한 NND86527\n일급비밀 통상\n발신: 전쟁부 (CSGPO) 전문번호: WX 90136 _1947년 11월 12일_ 계속\n\n계획 수립에 도움이 되도록 다음 사항에 관한 논평과 정보를 요청합니다:\n토지 개혁, 귀속 재산 처리, 관개 사업 등 철수 전에 완료하는 것이 바람직한 사업 또는 프로그램.\n철수 전에 그러한 사업과 프로그램을 완료하는 데 필요한 시간, 인원 및 자재.\n\n제5부. 남한군 창설과 관련하여, 우리는 귀관의 56265를 충분히 고려 중이며, 우리의 WX 89253 및 89254로 요청한 추가 정보를 기다리고 있습니다.\n\n제6부, 국무부는 본 메시지에 동의합니다.\n\n조치: G-3\n정보배포: 총사령관, 참모장, G-1, G-2, G-4.\n\n통제번호(MCN): 65512\n\"의역 불필요. 일급비밀. 육군규정 380-5, 51 1항 및 60 a (4)항에 따라 일급비밀 문서로 취급.\"\n-2-\n\n\n[0281면]\n비밀해제\n권한 NND86527\n일급비밀\n\n1947년 12월 1일\n\n기록용 비망록\n건명: 향후 대한(對韓) 정책.\n\n1. 근거: 1947년 11월 12일자 WX 90136, 주한미군사령관의 장래 한국 정책에 관한 상세 견해와 극동군총사령관이 하고자 하는 추가 논평을 요청함.\n\n2. 참조:\na. 1947년 11월 21일자 주한미군사령관 전문 ZGCG 1396, 근거 전문이 요청한 상세 견해를 육군성 (합참 대상)에 직접 제출하고, 정보 참조로 극동군총사령관에게 송부.\nb. 1947년 11월 25일자 G-4 대 G-3 비망록, 건명: \"장래 한국 정책 결정을 위한 견해 및 논평\", 이는 참조 a 제III절에 제시된 군수 요소를 검토함.\n\n3. a. 극동군사령부(FEC) 참모장이 부참모장에게 보낸 비망록에서, 극동군총사령관은 군수 요소가 부정확하지 않는 한 근거 전문이나 참조 a에 대해 논평하지 않을 것이라고 밝힘.\nb. 부참모장이 G-3로 보낸 전표에서 G-4와 협조하여 참조 a 제III절을 검토한 후 부참모장과의 회의를 개최하도록 지시함.\nc. 참조 b는 극동군총사령관 논평의 타당성에 관해 부참모장과 회의하기 위한 기초로 G-4에 의해 작성됨. 11월 26일 회의가 열렸으며, 그 자리에서 극동군사령부 부참모장은 육군성의 재요청이 있기 전까지는 극동군총사령관의 논평은 송부하지 않을 것이며, 재요청 시에도 논평은 군수 요소 검토에 국한될 것이라고 밝힘.\nd. 이어서 극동군사령부 부참모장은 별도 조치로 제공될 가정에 기초하여, 극동군사령부 일반 및 특별참모부로 하여금 참조 a 제III절 검토를 개시하도록 지시함.\ne. ZGCG 1396을 기초로, G-3는 이 사령부 내에서 호지(Hodge) 장군이 개요한 군수 요소 검토를 위한 근거로 삼을 G-4 앞 공문(C/N)을 작성 중임. 주로 G-3의 가정 지침에 따라 G-4와 기술 부서들이 수행할 이 검토는, 육군성의 요청이 있을 경우 송부할 수 있는 논평을 준비하기 위해 마련됨.\nf. 육군성의 추가 조회가 있을 때까지 발신 전문은 작성되지 않을 것이므로, 근거 전문에 대한 조치는 완료된 것으로 간주할 수 있음.\n\n일급비밀\n\n\n[0282면]\n비밀해제\n권한 NND86527\n일급비밀\n\n4. 권고: G-3는 이 비망록을 참모장에게 회람하여 정보 제공하고, G-3 파일에 편철할 것. 참모장 파일 사본인 근거 및 참조들은 기록 목적으로 첨부되어 있음.\n\n5. 완료: 이로써 근거 전문에 대한 G-3 조치 완료. (F.S. 2020)\n\nPAIGE - 26-5947\n참모장 1947년 12월 2일 확인\n\n일급비밀\n\n[0283면]\n비밀해제\n권한 NND 846527\n\n2급 비밀(Top Secret)\n\n극동군 총사령부\n참모부 G-4\n1947년 11월 25일\n\n메모 수신: 참모차장, G-3\n\n제목: 향후 한국 정책 결정을 위한 견해 및 논평\n\n1. 주한미군사령관 무선 전문 ZGCG 1396을 참조하여, G-4는 다음과 같은 논평을 제출합니다:\n\n2. 호지(Hodge) 장군이 참조 무선 전문 제3절에서 제출한 군수 데이터는 전반적으로 대체로 정확한 것으로 간주됩니다. 이 데이터를 상세히 분석하고 연구할 시간이 부족합니다.\n\n3. 호지 장군이 제시한 장비 철수 소요 기간, 즉 90일은 다소 낙관적인 것으로 보입니다. 호지 장군이 한국에서 철수 대상으로 열거한 장비에 여러 요소를 적용하면, 90일 동안 반출해야 할 화물은 435,000 중량톤(M/T)이 됩니다. 따라서 G-4는 발생 가능한 여러 부정확성을 보정하기 위해 총 500,000 중량톤이라는 수치를 설정합니다. 극동군 총사령부(GHQ) 수송 담당관이 보고한 인천항과 부산항의 현재 항만 처리 능력에 근거하면, 이 화물 이동에 사용할 수 있는 월간 항만 용량은 145,000 중량톤이 될 것입니다(부산 60,000 -- 인천 85,000). 이 가용량은 현재 수준의 민간 반입 화물이 지속됨을 전제로 합니다. 3개월 동안 500,000 중량톤을 처리하려면 월 167,000 중량톤의 이동이 필요합니다. G-4는 이 작은 부족분은 민간 화물을 처리하는 항만 부분을 일부 전용하여 충당할 수 있을 것으로 봅니다. 그러나 항만 용량만이 유일한 고려 사항은 아닙니다. 지속적인 선적이 가능하도록 대량의 대양 항해 선박을 확보하고 일정을 조정하는 훨씬 더 어려운 문제가 남아 있습니다.\n\n[0284면]\n2급 비밀(Top Secret)\n\n[판독불가] TOO [판독불가]\n\n[판독 불가 또는 중복 페이지 -- OCR 완전 왜곡, 내용 복구 불가]\n\n[0285면]\n비밀해제\n권한 NND886527\n\n2급 비밀(Top Secret)\n\n위와 같은 이유로, G-4는 워싱턴 당국의 결정이 이 정도의 화물을 반출해야 하는 것이라면, 90일 기간 내에 이동을 완료하기보다는 4개월 내지 6개월의 기간을 계획하는 것이 나을 것이라고 생각합니다.\n\n4. 주한미군 철수 시 어떤 보급품과 장비를 한국에 남길지에 대한 국무부-육군부 합동 결정이 없는 상황에서, 호지 장군이 한국에서 반출할 장비에 대해 세운 가정은 그가 활용할 수 있는 유일한 것입니다. G-4는 주한미군 철수 시 한국 내의 중요 공용 보급품과 장비는 모두 남겨질 것이라는 결정이 내려질 가능성이 크다고 항상 생각해 왔습니다. 호지 장군이 문단 10 e에서 전투 차량 6,000롱톤을 남길 것을 제안한 점이 주목됩니다. 이 사항은 육군부에서 명백히 인지할 것입니다.\n\n5. G-4는 호지 장군의 무선 전문 제3절과 관련하여 육군부에 어떤 논평을 하는 것이 필수적이라고 생각하지 않습니다. 워싱턴 당국이 그의 가정이 지닌 중요한 특징과 그들 측의 결정 필요성을 쉽게 인식할 것이기 때문입니다. 그들은 G-4가 제시하는 소요 기간, 즉 그것이 낙관적이라는 점에 대해서는 같은 결론에 도달하지 않을 수도 있습니다.\n\n위 사항을 고려하여, G-4는 아래와 같은 논평 문안을 제시하지만, 워싱턴이 문제를 이해하는 데 필수적이라고 하여 이 논평을 보낼 것을 권고하지는 않습니다. 어느 수준에서든 포괄적인 계획에 착수하기 전에, 먼저 한국에서 어떤 장비와 보급품을 철수하고 철수하지 않을 것인지에 대한 워싱턴 측의 주요 결정이 있어야 한다는 점을 워싱턴 당국이 인식할 것이라는 점은 G-4에 명백해 보입니다. 전술한 바에 따른 가능한 논평으로 다음을 제시합니다:\n\n\"(ZGCG 1396의) 제3절과 관련하여, 그 안에 제시된 전반적 추정치는 주한미군 철수 시 어떤 보급품과 장비를 반출하고 반출하지 않을 것인지에 대한\n\n[0286면]\n비밀해제\n권한 NND 886527\n\n2급 비밀(Top Secret)\n\n주요 결정이 내려졌을 때 예비 계획을 수립하기에 충분히 정확한 것으로 보입니다. 표시된 톤수의 철수 예상 기간, 즉 90일은 낙관적인 기간으로 사료됩니다. 항만 처리 능력과, 이동을 위한 중단 없는 화물 운송 흐름을 확보하고 일정을 짜야 할 필요성을 고려할 때, 4개월 내지 6개월의 기간 추정이 더 현실적입니다.\"\n\nH. E. 이스트우드\n육군 참모단 대령\n참모차장, G-4\n\n2급 비밀(Top Secret)", "secondary": "[0279면]\nDECLASSIFIED\nAuthority NND86527\nFAR EAST COMMAND\nGENERAL HEADQUARTERS, U. S. ARMY FORCES, PACIFIC ADJUTANT GENERAL'S OFFICE VWD dwo\nRADIO AND CABLE CENTER\nINCOMING MESSAGE\nTOP SECRET\nTOO: 111804Z\nFROM : WAR (CSGPO)\nTO : CINCFE\nINFO : CG USAFIK\nNR : WX 90136 To assist the Far East Sub-committee of SANACC, recommended in para 5 F of SWNCC 176/30, in determination future Korea policy, specifically study the detailed views and comments of CG USAFIK and such additional comments as you desire to make on the development of a future course of action would be appreciated in light of following considerations.\n\nPart 2. Two major alternatives contemplated, (A) most probable being Soviet refusal to cooperate with UN decision passing resolution transmitted by State Tel 258 dta 5 Nov. In this case most likely US will decide implement resolution insofar as possible in South Korea, or (B) Soviet cooperation in implementation of UN decision. In such case US will follow action outlined in resolution and appropriate directives will be issued taking due consideration of your outline plan for an orderly withdrawal referred to in part 3 below.\n\nPart 3. Either alternative will include possibility US withdrawal soon after establishment South Korean or United Korean Govt, perhaps third quarter 1948. Actual determination time of such withdrawal obviously will depend on developments including Soviet action, outlook as affected by presence North Korean Army and temper South Koreans (CG USAFIK ZGCG 1337). In light of these considerations, and to properly evaluate and correlate time factors, would greatly appreciate outline plan for an orderly withdrawal by air mail with telegraphic summary.\n\n\"Paraphrase not required. Top secret Handle AS TOP SECRET correspondence per para 51 1 and 60 a (4) AR 380-5.\" Handling and transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) (2) (3), and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946.\n\nTOP SECRET\n\n[0280면]\nDECLASSIFIED\nAuthority NND86527\nTOP SECRET ROUTINE\nFROM : WAR (CSGPO) NR : WX 90136 _12 NOV 47 CONTINUED As aid in planning, comments and info requested on: Projects or programs desirable be completed before withdrawal, such as land reform, disposition of vested property, irrigation projects, etc. Time, personnel and materials required to complete, before withdrawal, such projects and programs.\n\nPart 5. With regard to the establishment South Korean Armed Forces, we are giving full consideration your 56265 and awaiting further info requested our WX 89253, and 89254.\n\nPart 6, State concurs this message.\n\nACTION: G-3 INFORMATION: COMMANDER IN CHIEF, CHIEF OF STAFF, G-1, G-2, G-4.\n\nMCN: 65512 \"Paraphrase not required Top secret Handle as TOP SECRET correspondence 51 1 and 60 a (4) AR 380-5.\" -2-\n\n[0281면]\nDECLASSIFIED\nAuthority NND86527\nTOP SECRET\n\n1 December 1947\n\nMEMO FOR RECORD\nSUBJECT: Future Policy in Korea.\n\n1. BASIC: WX 90136/12 Nov, requesting detailed views of CG, USAFIK on future Korean Policy with such additional comments as CINCFE desires to make.\n\n2. REFERENCES:\na. USAFIK rad ZGCG 1396/21 Nov, which submits directly to D/A (for JCS), info to CINCFE, the detailed views requested by basic.\nb. G-4 Memo for G-3 atd 25 Nov, subj: \"Views and Comments for the Determination of Future Korean Policy,\" which reviews logistic factors set forth in Section III, ref a.\n\n3. a. Memo from C/S to D C/S, FEC stated that CINCFE would make no comment on basic or ref a unless logistic factors were incorrect.\nb. Routing slip from D C/S to G-3 directed review of Section III, ref a, in conjunction with G-4, to be followed by conference with D C/S.\nc. Ref b was prepared by G-4 as basis for conference with D C/S re advisability of CINCFE comment. Conference was held on 26 Nov, at which time D C/S, FEC stated that no CINCFE comments would be forwarded to DA unless again requested, in which case comments would be limited to review of logistic factors.\nd. D C/S, FEC then directed initiation of a review of Section III, ref a, by FEC General and Special Staff, based on assumptions to be furnished by separate action.\ne. Using ZGCG 1396 as a basis, G-3 is initiating a C/N to G-4 which will serve as a basis for review within this Headquarters of the logistic factors outlined by General Hodge. This review, which will be primarily by G-4 and the technical services based on G-3 guidance in assumptions, will be designed to prepare comments which can be forwarded to D/A if requested.\nf. Since no outgoing dispatch will be initiated pending receipt of further inquiry from D/A, action on basic can be considered complete.\n\nTOP SECRET\n\n[0282면]\nDECLASSIFIED\nAuthority NND86527\nTOP SECRET\n\n4. RECOMMEND: G-3 forward this M/R to C/S for information and G-3 file. C/S file copies of basic and refs are attached for record purposes.\n\n5. COMPLETION: This completes G-3 action on basic. (F.S. 2020)\n\nPAIGE - 26-5947\nNOTED 12/2/47\nBY C/S\n\nTOP SECRET\n\n[0283면]\nDECLASSIFIED\nAuthority NND 846527\n\nTOP SECRET\n\nGENERAL HEADQUARTERS FAR EAST COMMAND\nG-4 Staff Section 25 November 1947\n\nMEMORANDUM FOR: Assistant Chief of Staff, G-3\n\nSUBJECT: Views and Comments for the Determination of Future Korea Policy\n\n1. Reference CG USAFIK Radio ZGCG 1396, G-4 submits the following comments:\n\n2. The logistic data submitted by General Hodge in Section III of reference Radio is considered to be essentially accurate in over-all terms. Time is not available to subject this data to detailed analysis and study.\n\n3. The time element for withdrawal of the equipment as indicated by General Hodge, namely, ninety (90) days, is believed to be on the optimistic side. Applying factors to the equipment General Hodge lists for withdrawal from Korea, there will be 435,000 M/T to be out-shipped in ninety (90) days. G-4 sets an over-all figure, therefore, of 500,000 M/T to compensate for various probable inaccuracies. Based on current port performance of the Ports of Inchon and Pusan as reported by the Transportation Officer, GHQ, there should be a monthly port capacity of 145,000 M/T available for movement of this cargo (Pusan 60,000 -Inchon 85,000). This availability visualizes a continuation of civilian input cargo at current rates. A requirement for 500,000 M/T in three months will require a monthly movement of 167,000 M/T. G-4 believes that this small deficit could be covered by encroachment on that part of the port handling civilian type cargo. However, port capacity is not the sole consideration. There remains the much more difficult feature of procuring and scheduling trans-oceanic shipping in such quantities that continuous out-loading would be possible.\n\n[0284면]\nTOP SECRET\n\n[illegible] TOO [illegible]\n\n[page unreadable or duplicate -- OCR completely garbled, content cannot be recovered]\n\n[0285면]\nDECLASSIFIED\nAuthority NND886527\n\nTOP SECRET\n\nFor the above reasons, G-4 feels that should the decision of Washington authorities be such that this amount of cargo must be out-shipped, it will be better to plan on a period of from four (4) to six (6) months to accomplish the movement, rather than in a ninety (90) day period.\n\n4. The assumptions which General Hodge makes as to the equipment to be out-shipped from Korea are the only ones available to him in the absence of a State-War decision as to what supplies and equipment will be left in Korea when U. S. Forces are withdrawn. G-4 has always felt that the probable critical common-purpose supplies and equipment in Korea will be left upon the withdrawal of U. S. Forces therefrom. It is noted that General Hodge in paragraph 10 e proposes to leave 6,000 long tons of combat vehicles. This feature will be apparent to the Department of the Army.\n\n5. G-4 does not believe that it is essential to make any comment to the Department of the Army relative to Section III of General Hodge's radio, inasmuch as Washington authorities will readily recognize the significant features of his assumptions and the need for decision on their part. They may not arrive at the same conclusion with respect to the time period which G-4 advances, namely, that it is optimistic.\n\nConsidering the above, G-4 offers a possible comment as indicated below, but does not recommend making comment as an essential to an understanding of the problem by Washington. It appears obvious to G-4 that Washington authorities will recognize that before any comprehensive planning can be entered into on any level there first must be major decisions on the part of Washington as to what equipment and supplies shall and shall not be withdrawn from Korea. As a possible comment under the foregoing the following is offered:\n\n\"With reference to Section III (Of ZGCG 1396)\nthe over-all estimates made therein appear to be sufficiently correct on which to initiate preliminary planning when major decisions have been made with respect to what supplies and equipment of the\n\n[0286면]\nDECLASSIFIED\nAuthority NND 886527\n\nTOP SECRET\n\nU. S. Forces shall and shall not be out-shipped from Korea upon withdrawal of forces therefrom. The estimated time of such out-shipment, namely, ninety (90) days, of the tonnages as indicated is believed to be an optimistic time period.\nTaking into consideration port performance and the necessity to secure and schedule an uninterrupted flow of cargo transportation for the movement, it is felt that a time period estimate of from four (4) to six (6) months is more realistic.\"\n\nH. E. EASTWOOD\nColonel, GSC Assistant Chief of Staff, G-4\n\nTOP SECRET", "notes": [], "note": "기계 판독 참고 — Page 0279 contains apparent scanning artifacts ('200c IN MING MESSAGE', 'SEKISUI JUSHI', ruler marks, 'VWD dwo') which have been discarded. The phrase 'TOO: 111804Z' (Time of Origin) was reconstructed from the '111804 Z' visible at bottom of page 0280 and placed at header of 0279. On page 0282, 'PAIGE - 26-5947' appears to be an internal file notation and has been kept as-is. / 페이지 0284는 OCR 결과 극도로 왜곡되어 복구가 불가능합니다. 페이지 전체가 판독 불가로 표시되며, 복원된 영문에서 제외하였습니다. 미확인 텍스트는 중복판 또는 전송 헤더로 추정됩니다. 0283 페이지에 'M/I'로 잘못 인식된 부분은 문맥상 중량톤 'M/T'로 수정했습니다(4군데). 0285 페이지의 'fort at'은 'felt that'의 오식으로 추정되어 수정했습니다. 'has sumptions' 및 'or'의 경우 불완전한 행 구분으로 인한 오류로 보이나 전후 맥락을 통해 추정 복원했습니다.", "warn": false, "pages": ["0279", "0280", "0281", "0282", "0283", "0284", "0285", "0286"]}, {"id": "D043", "order": 42, "date": "1947-11-22", "group": "D", "eyebrow": "D043 · D. 장래 정책·철군", "title": "주한미군사령관의 철수, 남한 경비대 창설 및 경제·정치 계획에 관한 견해", "badge": "TOP SECRET", "list_right": "0287–0298", "meta": [{"k": "발신", "v": "CG USAFIK", "txt": true}, {"k": "수신", "v": "DA (JCS) SEU", "txt": true}, {"k": "참조", "v": "CINCFE, WAR (STATE DEPT) cance", "txt": true}, {"k": "전문번호", "v": "ZGCG 1396"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0287–0298 (12면)"}, {"k": "건명", "v": "Withdrawal from Korea", "txt": true}], "summary": "CG USAFIK's views on withdrawal, South Korean security force, and economic/political planning", "points": ["주한미군사령관은 소련의 유엔 위원회 보이콧으로 인한 독립 남한 정부 수립을 상정하고 1948년 3/4분기 미군 철수 준비와 남한 경비대 창설을 제안한다.", "남한의 경제적 안정을 위해 1948년 이후 수년간 미국 주도의 대규모 원조가 필요하며, 원조 통제권을 유엔이 아닌 미국이 직접 행사해야 한다고 역설한다.", "신생 남한 정부에 설치할 외교 사절단은 정치·경제·군사·정보 부서를 두어야 하며, 특히 군사 부서는 군사 고문 기능을 수행해야 한다.", "남한 단독 정부 수립 시 이승만 그룹의 압도적 승리를 우려하며, 북한 지역의 민족 감정 고취를 통한 남북 통합 가능성을 신중하게 거론한다.", "귀속재산 처리는 한국인들의 비협조로 지연되고 있으며, 법적 권리 및 향후 통제 방안 결정이 필요하다.", "전력, 관개, 경제 개발 사업의 진척은 물자와 인력이 적시에 지원되어야만 철수 시한 전에 완료될 수 있다.", "남한에 대한 경제 지원의 중단은 즉각적인 경제 붕괴를 초래할 것이며, 앞으로도 상당 기간 미국의 재정적 관여는 불가피하다.", "미군정 재산 처리, 회계 정산, 그리고 향후 남북한 통합 시의 권력 이양 및 경제 통합 문제가 주요 현안으로 제시된다.", "주한미군 철수 계획 A(1), A(2), B(1), B(2)에 따른 병력 및 장비 철수 세부 톤수를 추계함.", "미군 철수 후 한국 경제 지원 및 한국군 편성 지원을 위해 철수가 불가능한 대부분의 잉여 물자와 장비를 한국 정부에 인계할 것을 권고함.", "제한적인 철도 역량과 인천항의 경직된 물동량으로 인해 대규모 물자 반출이 사실상 불가능할 것으로 평가됨.", "한국 정부군 창설 및 훈련 계획에 관한 제4절은 별도 문서로 제출 중이며, 군정 장관과 정치 고문이 이 답신에 동의함."], "primary": "[0287면]\n비밀해제\n권한 NND8X6527\n극동사령부\n미국 육군 태평양 총사령부 부관부 무선·전보 센터\n\n우선 1947년 11월 22일\n발신: 주한미군사령관\n수신: 육군성 (합참) SEU\n통보: 극동군 총사령관, 전쟁성 (국무부) 취소\n전문번호: ZGCG 1396 D.Y.\n\n참조 WX 90136, 111834/Z. 본인의 견해와 논평은 다음과 같음.\n\n제1절. 요청된 일반 논평과 관련하여, 소련이 한국에 대한 유엔 위원회(UNTCOK)를 거의 확실하게 지속적으로 보이콧할 것이기에, 미국은 독립된 남한의 수립을 상정해야 하며, 그 정부는 가능하다면 유엔으로부터 즉각적인 승인을 받아야 할 것이라고 본다. 다만 소련과 그 위성국들 및 미국에 적대적인 기타 국가나 집단들은 소련을 자극하지 않기 위해 이에 동조하지 않을 것이다. 참조 전문의 1항부터 5항까지에 구상된 계획은 주한미군 철수 시점(지금으로부터 약 1년 후)까지만을 다루므로, SANACC 극동 소위원회가 SWNCC 176/30 5항(F)에 따른 향후 정책을 결정하기 위해 고려해야 할 수많은 문제들이 존재한다. 철수 전인 내년까지 완료될 수 있는 임시방편들로는 새로운 남한 국가의 경제적 안정과 정치적 안보를 확보하기에는 턱없이 부족하기 때문이다. 따라서 오늘날 내가 상황을 전망하는 바(향후 사건의 전개에 따라 많은 변경이 필요할 수 있음을 인지하면서), 이곳의 미국 대표들에 대한 지침이 될 우리의 수정된 정책의 몇 가지 핵심 사항은 다음과 같다.\n\n1. WX 90136의 2항부터 5항까지에 상정된 대로, 우리는 그 안에 언급된 전개 가능성을 조건으로 1948년 3/4분기까지의 병력 철수 준비, 무장된 남한 경비대 창설, 그리고 1948년 말까지\n\n77945 (뒷면)\n우선 비밀\n#의역 불요. AR 380-5 51조 1항 및 60조 a (4)항에 의거, 최고비밀(TOP SECRET) 서신으로 취급할 것. 사본 10 - GINDER 대령\n동일 등급의 서신으로서 본 전문의 축자적 평문 취급 및 전송은 1946년 3월 6일 AR 380-5, 16-C, 18-E, 53-A, 53-D (1) (2) (3) 및 60-A (1) (2) (3) (4)항의 규정에 따라 육군성에 의해 승인되었음. 사본 번호 12\n\n[0288면]\n비밀해제\n권한 NND8X6527\n최고비밀(TOP SECRET)\n주한미군사령관 전문 번호 ZGCG 1396, 1947년 11월 22일자, 계속:\n\n가능한 한 많은 필수 경제 계획 및 사업의 신속한 완료 또는 거의 완료를 추진해야 한다. 이 계획을 추진함에 있어 우리는 기존 지침이 워싱턴의 훈령에 의해 구체적으로 무효화되지 않고 적용 가능한 한 계속해서 이에 따를 것이다.\n\n2. 남한의 경제 역량에 대해 SANACC에 이미 제출된 다양한 보고서들이, 상당한 원조와 지원이 이루어지지 않는 한 남한은 경제적 혼란과 그에 뒤따르는 정치적 혼란을 피할 수 없음을 명백히 보여주므로, 1948년 이후 여러 해 동안 필요한 가장 필수적인 경제 사업과 그 실행 방안에 대한 추가 연구를 매년 단위로 수행해야 한다. 이때 남한이 독립됨으로 인해 강한 민족주의 감정과 자존심, 그리고 소련의 책략으로 인해 특별한 안전장치가 고안될 필요가 있다는 점을 고려해야 하며, 비록 성공적이지 못할 수 있음을 예견해야 할지라도 그러하다. 이러한 안전장치의 관리에 있어 나는 물질적·재정적 지원 양면에서 아마 유일한 공급원이 될 미국이 유엔보다는 (남한 관리들과 협력하여) 책임 기관이 되어야 한다고 권고한다. 국제 기구인 유엔이 그러한 책임을 맡는다면, 마치 UNRRA가 그랬듯이, 소련이 통제하는 집단들이 국가를 장악하고 있다는 것이 대단히 명백해졌을 때에도 남한에 대한 원조와 지원을 지속적으로 제공해야 하는 처지에 놓일 수 있다. 바꿔 말해, 미국의 향후 원조 및 지원에 관한 한, 우리는 미국이 적을 지원하는 물자를 넘겨주도록 묶어버릴 수 있는 국제 기구에 그러한 통제 권한을 부여하는 것을 피해야 한다.\n\n3. SANACC 소위원회는 새로운 정부가 수립될 때 남한에 외교 사절단을 설치할 준비를 고려해야 한다. 그 사절단의 틀 안에는 통상적인 정무 부서뿐만 아니라, 충분한 인력을 갖춘 유능한 경제 부서, 통상적인 무관 업무뿐만 아니라 군사 문제를 정리하고 새로운 정부가 반대하지 않는 한(이 점에서 유엔의 지원을 선호할 가능성도 있음) 새로운 남한 경비대에 대한 군사 고문 기능을 수행할 인력을 갖춘 군사 부서, 그리고 마지막으로 피할 수 없는 소련의 선전에 맞설 견고한 정보 부서가 있어야 한다. 이 목적을 위해 이 전문의 제2절에서 언급된 대로 서울에서 추가 부지를 취득하기 위한 즉각적인 조치가 취해져야 한다.\n\n우선 최고비밀(TOP SECRET)\n\"의역 불요. AR 380-5 51조 1항 및 60조 a (4)항에 의거, 최고비밀(TOP SECRET) 서신으로 취급할 것.\" -2-\n\n[0289면]\n비밀해제\n권한 NND8X6527\n미국 육군 태평양 총사령부 부관부\n무선·전보 센터\n\n수신 전문\n\n우선\n주한미군사령관 전문 번호 ZGCG 1396, 1947년 11월 22일자, 계속:\n\n본 전문의 제2절.\n\n4. 우리는 우리의 권한, 재산, 새로운 정부가 원할 수 있는 운영 인력 및 기타 여러 관련 사항들을 새로운 정부에 이양하기 위한 계획 작업을 시작해야 한다. 이 모든 것은 물론 유엔 결의에 규정된 대로 유엔 위원회(UNTCOK)가 연락 기관 역할을 하면서 이루어질 것이다. 이와 관련하여, 사전에 혹은 추후 어느 단계에서라도 미국 재산이 적의 수중에 들어갈 수 있다는 것이 명백할 경우, 어떠한 미국 재산도 남한 정부에 넘겨지지 않도록 하는 것을 변함없는 원칙으로 확립해야 한다. 마찬가지로 예방 조치로서, 우리가 동의하지 않는 한 남한 정부에 이양된 미국 재산을 본래 의도를 훼손하는 방식으로 양도, 매각, 이전해서는 안 된다는 서약에 서명하도록 남한 정부에 일반적으로 요구해야 할 것이다.\n\n5. 향후 어떠한 계획 수립에서도 SANACC는 소련과 미국 사이에서 현재 진행 중인 투쟁이 언제라도 우리가 일부 사업을 지연시키거나 연기하고 다른 사업을 서두르며 소련의 위협에 대응하기 위한 새로운 사업을 고안해야만 하는 국면에 도달할 가능성, 거의 확실성에 대비해야 한다. 예를 들어, 우리가 한국에서 철수하기 전에 북중국과 만주의 상황이 중국 중앙정부를 지원하기 위해 미국이 적극적인 행동에 나설 정도로 전개된다면, 한국으로부터의 계속된 철수는 어리석음의 극치일 것이다. 앞으로 한 해 안에 이러한 성격의 수많은 우발 상황들이 발생할 수 있다. 따라서 우리의 계획은 무엇보다도 유동성과 적응성을 구상해야 한다.\n\n6. 유엔의 감시 하에 선거를 하고 남한 정부를 수립하는 것을 상정하는 한, 우리는 극복할 수 없는 어려움은 예상하지 않는다. 사령부는 유엔 위원회(UNTCOK)와 한국인들에게 가능한 모든 지원을 제공할 것이다.\n\n77945 (뒷면)\n우선 비밀(SECRET)\n\"의역 불요. AR 380-5 51조 1항 및 60조 a (4)항에 의거, 최고비밀(TOP SECRET) 서신으로 취급할 것. 동일 등급의 서신으로서 본 전문의 축자적 평문 취급 및 전송은 1946년 3월 6일 AR 380-5, 16-C, 18-E, 53-A, 53-D (1) (2) (3) 및 60-A (1) (2) (3) (4)항의 규정에 따라 육군성에 의해 승인되었음. 사본 번호 [공란]\n\n[0290면]\n비밀해제\n권한 NND8X6527\n우선 최고비밀(TOP SECRET)\n주한미군사령관 전문 번호 ZGCG 1396, 1947년 11월 22일자, 계속:\n\n이승만과 그의 그룹이 다소 골칫거리일 수 있으나, 우리가 즉각적이고 궁극적인 선거 목표를 알고 있는 지금 그를 통제할 수 있기를 희망한다. 좌파가 선거를 보이콧할 것으로 가정하면, 이승만과 그의 그룹이 새 의회의 다수 의석을 차지할 가능성이 높다. 우리는 적절한 감독과 감시를 통해 상당한 수의 다른 우파 및 중도파 인사들이 선출되어 건전한 영향력을 구성하기를 바란다. 이는 바람직한 일인데, 이승만으로의 압도적 승리는 우리조차(소련은 말할 것도 없이) 반동적이며 파시스트적인 정부라고 부를 만한 것을 수립하게 되어 대처하기가 매우 어렵거나 불가능할 수 있기 때문이다.\n\n7. 소련이 유엔 위원회(UNTCOK)의 북한 진입을 허용하거나 그 지역이 통일된 조선 수립에 참여하는 것을 허용할 것이라고 확신하지는 못하지만, 유엔 주관 하에 남한 정부의 조직이 진행되면 북한 주민들의 민족 감정이 고취되고 소련으로 하여금 두 지역의 합병을 위한 남한 당국에의 접촉을 허용하도록 압력이 충분히 가해질 가능성이 있다. 그러한 전개는 소련군이 북한에서 철수할 경우 더 일어나기 쉽다. 그러한 접촉이 이루어진다면, 우리의 계획을 수정할 필요가 있을 수 있다. 이와 관련하여, 유엔 위원회(UNTCOK)가 도착한 후 소련 사령관과 북한 당국이 유엔 결의를 수락하도록 지속적으로 촉구하는 것이 바람직하다고 생각된다. 소련군이 일방적으로 철수한다면 그러한 노력이 결실을 맺을 수도 있다. 그러나 소련이 북한에 그들의 위성 세력을 구축한 이상, 그들이 결코 남한과 합류하는 것을 허용하지 않을 가능성이 높으며, 오로지 전쟁의 행운만이 남북의 통일을 서방식 또는 소련식 민주주의로 실현시킬 것이라고 간주해야 한다.\n\n제2절 - 경제.\n\n8. 참조 4항, 특정 질문들에 대한 답변은 다음과 같다. 토지개혁: 귀속 농지의 처분을 위해 특히 조선중앙토지행정처(KILA)의 토지개혁 입법을 지지하는 것이 바람직하다. 계획은 1948년 가을까지 완전히 완료되지는 않을 가능성이 높지만, 대부분의 토지가 [1948년 말까지] 개인 소유로 이전될 것을 희망한다.\n\n77945 우선\n\"의역 불요. AR 380-5 51조 1항 및 60조 a (4)항에 의거, 최고비밀(TOP SECRET) 서신으로 취급할 것.\"\n\n비밀(SECRET)\n\n[0291면]\n기밀해제 •\n권한 NND 816527\n\n극동군사령부\n태평양 미 육군 총사령부 본부, 부관 감실\n무선 및 전보 센터\n\n1급 비밀\n수신 전문\n\n1급 비밀    우선\n\n미 극동군 총사령부 전문 번호 ZGCG 1396, 일자 1947년 11월 22일, 계속:\n\n그 시점까지. 2.E 귀속재산 처리: 현재 재산 관리관은 72명의 미군 인력을 보유하고 있으며 남조선 내 단 2개 도에서만 귀속재산 전체 목록 조사를 완료했습니다. 8개월 내에 이 목록 조사를 완료하려면 총 약 200명의 미군 인력이 필요할 것입니다. 처분 절차가 3개월 이상 수립되었음에도 불구하고 도시 주택이나 소규모 사업체의 매각은 거의 발생하지 않았습니다. 처분의 어려움은 많은 한국인들이 자신들이 완전한 권력을 잡고 미국의 감독 없이 이들 재산을 처분할 수 있을 때까지 프로그램을 보류하려는 욕구에 있는 것으로 보입니다. 1948년 9월까지 귀속재산 목록 조사를 완료하는 것은 가능할 것이나, 농지를 제외한 매각에 있어서는 거의 진전이 없을 것으로 예상됩니다. 미국이 귀속재산을 한국 정부에 이전할 법적 권리에 대한 문제가 고려되어야 합니다. 이는 평화 조약 또는 일본 정부와 그 국민의 한국 내 재산에 대한 권리를 박탈하는 일본 의회의 조치를 통해 달성될 수 있습니다. 이 두 조치 중 하나라도 취해지지 않을 경우, 미국은 모든 재산을 한국 정부에 귀속시켜야 합니까, 아니면 미국 또는 유엔 기관을 통해 통제를 유지해야 합니까? 통제 또는 관리를 유지하는 문제는 권력을 획득할 수 있는 어느 집단의 손에 거대한 전리품 체제가 성장할 가능성과 특히 관련이 있습니다. 여기에는 외국 기업에 대한 재산 및 권리의 매각 가능성이 포함되며, 이는 수입품 대금을 지불하거나 정부가 전복될 위험이 있을 경우 해외 도피처를 마련하기 위해 외화를 획득하려는 목적입니다. 귀속재산이 한국 정부에 이전되지 않거나 통제 조건 하에 이전될 경우, 통제 또는 관리를 행사할 기관과 그 기관의 한국 정부와의 관계가 고려되어야 합니다. 주한 미 대표부의 숙소로 필요한 귀속재산은 즉시 매각되거나 미국 정부에 할당되어야 합니다.\n\n77945 (계속)\n우선    비밀\n\n\"의역 불필요. 육군 규정 380-5의 51조 1항 및 60조 a (4)항에 의거하여 1급 비밀 서신으로 취급할 것.\"\n\n이 전문의 문자 그대로의 평문을 동일 등급의 서신으로 취급 및 전송하는 것은 1946년 3월 6일자 육군 규정 380-5의 16-C, 18-E, 53-A, 53-D (1) (2) (3) 및 60-A (1) (2) (3) (4)항의 규정에 따라 육군부에 의해 승인되었습니다.\n\n1급 비밀    사본 번호.\n\n[0292면]\n기밀해제 •\n권한 NND8X6527\n\n비밀\n우선\n\n미 극동군 총사령부 전문 번호 ZGCG 1396, 일자 1947년 11월 22일, 계속:\n\n2.F 관개: 현재 약 50개의 주요 관개 사업이 건설 중이며, 그중 14개는 귀관의 전문에 명시된 날짜까지 완료될 예정입니다. 시멘트, 철근 및 다이너마이트 수입이 촉진된다면 명시된 시기까지 추가로 10개의 사업이 완료될 수 있을 것으로 추산합니다. 나머지 사업들은 1949년과 1950년에 완료될 예정입니다.\n\n기타 경제 개발: 1948년 가을까지 섬유 산업 재건을 거의 완료하는 것이 가능할 것입니다. 재건 프로그램에서 요청된 자금, 자재 및 핵심 인력이 가용해진다면, 명시된 날짜까지 탄광 및 기타 중요한 개별 공장 및 광산, 예컨대 Sandong 중석 광산의 재건에 있어 상당한 진전이 이루어질 것입니다.\n\n5. 전력: 현재 상황으로는 남조선이 이 지역에서 사용된 과거 및 현재의 전력에 대한 대가로 북조선이 요구하는 물자를 제공하는 것은 불가능합니다. 평양 주재 연락 장교는 송전 시설 부족으로 인해 장래에 가용 전력이 감소할 것이라는 통보를 받았습니다. 북조선으로부터의 전력은 언제든지 차단될 수 있으며 이는 남조선의 생산에 재앙적인 영향을 미칠 것입니다. 철수 결정 시 철수 이전에 최대한의 작업을 달성하기 위해 남조선 전력원을 보완할 해군 전력선 확보를 고려해야 합니다. Glen R. Evans는 11월 16일 워싱턴으로 일시 출장(TDY) 명령을 받고 Morton 장군 호를 타고 출항했습니다. 그가 이 문제를 위원회와 상세히 논의할 수 있을 것입니다. 다음을 권고합니다:\n\n6. 미군정 재산: a. 민간 보급 프로그램에 따라 한국으로 반입된 모든 보급품 및 장비의 소유권을 한국 정부에 이전할 것;\nb. FLC 차관으로 구매된 장비 및 보급품은 차관 협상 타결을 조건으로 한국 정부에 할당할 것;\nc. CINCFE가 한국에 배정한 해사 위원회 소속 8척의 발틱 선박, 101대의 기관차 및 기타 현재 군정청에 대여 중인 기타 장비는\n\n77945 우선\n\n\"의역 불필요. 육군 규정 380-5의 51조 1항 및 60조 a (4)항에 의거하여 1급 비밀 서신으로 취급할 것.\" -6-\n\n[0293면]\n기밀해제\n권한 NND8X6527\n\n극동군사령부\n태평양 미 육군 총사령부 본부, 부관 감실\n무선 및 전보 센터\n\n1급 비밀\n수신 전문\n\n1급 비밀    우선\n\n미 극동군 총사령부 전문 번호 ZGCG 1396, 일자 1947년 11월 22일, 계속:\n\n비우호국에 의한 사용이 방지될 수 있다는 확실한 보장이 있을 경우에만 한국에 유지할 것. 인력 및 자재: 사업 완료에 필요한 추가 자재 및 인력의 추정치는 이미 제출된 재건 프로그램에 포함되어 있습니다. 일부 핵심 민간 인력은 가족 도착 지연으로 인해 현재 한국을 떠나고 있습니다. 군정청이 가속화된 프로그램을 달성하려면, 현재 워싱턴에 계류 중인 핵심 인력 소요 요청을 1948년 3월 1일까지 충원하기 위해 강력한 모집 활동을 전개해야 합니다. 위원회는 국무부 Owen I. Jones와 협의하여 가용성 및 재정 지원 가능성에 비추어 인력 및 자재 소요를 검토할 것을 권고합니다.\n\n8. 재정 지원: 경제 지원이 갑자기 철회될 경우 남조선은 경제적 붕괴에 직면할 것입니다. 외환 부족으로 인해 일본으로부터의 석탄 수입이 중단되고, 10일 후에는 철도 운행이 실질적으로 중단될 것입니다. 석유 제품 수입 감소는 자동차 운송을 마비시키고 어업에 심각한 타격을 줄 것이며, 이로 인해 한국 정부가 식량 수집 및 분배 프로그램을 유지하는 것이 불가능해질 수 있습니다. 심각한 정치적 결과가 뒤따를 것임은 의심의 여지가 없습니다. SKIG에 의해 수출이 추진되고 있지만, 기본적인 필수 수입을 충당할 만한 충분한 물량에 도달할 가능성은 없습니다. (육군부 Draper 차관에게 제출된 5개년 재건 프로그램 참조). 남조선의 한국 군 병력 증강은 예산 불균형을 심화시키고 인플레이션 압력을 가중시킬 것입니다. 이에 대응하기 위해서는 세제 개혁과 조세 징수가 강조되어야 합니다. 무상 원조 또는 재건 프로그램에 따른 보급의 지속은 이러한 인플레이션 압력을 상쇄하고 경제를 안정시키는 데 크게 기여할 것입니다. 따라서 미국이 남조선에 대해 재정적으로 관여해야 하는지, 그리고 그 기간이 얼마나 되어야 하는지에 대한 문제를\n\n77945 우선\n\n\"의역 불필요. 육군 규정 380-5의 51조 1항 및 60조 a (4)항에 의거하여 1급 비밀 서신으로 취급할 것.\" -7-\n\n이 전문의 문자 그대로의 평문을 동일 등급의 서신으로 취급 및 전송하는 것은 1946년 3월 6일자 육군 규정 380-5의 16-C, 18-E, 53-A, 53-D (1) (2) (3) 및 60-A (1) (2) (3) (4)항의 규정에 따라 육군부에 의해 승인되었습니다.\n\n1급 비밀    사본 번호.\n\n[0294면]\n기밀해제\n권한 NND886527\n\n비밀    우선\n\n미 극동군 총사령부 전문 번호 ZGCG 1396, 일자 1947년 11월 22일, 계속:\n\n고려해야 합니다. 만약 대남조선 경제 지원을 계속하기로 결정된다면, 자금을 한국 정부에 자유롭게 넘겨줄 것인지, 아니면 미국 또는 유엔 기관이 긴밀히 감독하거나 관리할 것인지 고려해야 하며, 후자의 경우 그러한 기관과 한국 정부와의 관계 및 그 특정 권한을 정의해야 합니다. 9. 회계 정산:\na. GARIOA 및 FLC 구매를 통한 민간 보급품 판매로 인한 원화 수입은 조선은행의 별도 제한 계정에 보유됨;\nb. USAFIK의 점령 비용에 대한 원화 지출은 조선은행으로부터 차입함;\nc. 한국 신탁 계정에 보유된 달러 수익은 한국 제품 수출 및 수익자 부담(pay as you go) 예치금에서 발생할 것임;\n지난 2년간 USAMGIK 운영 예산의 균형 부족으로 조선은행에 초과 인출이 발생했습니다. 이들 4개의 계정을 FLC 차관 및 SCAP에 대한 채무와 함께 종합적으로 고려하여 단일 최종 정산 협상을 벌일 것을 권고합니다. 이 정산 조건은 미국 또는 유엔이 바람직하다고 간주할 수 있는 향후의 재정적 약속 및 통제와 관련하여 고려되어야 합니다. 10. 남북한 통합: 통일된 한국이 수립될 경우, 모든 무상 원조 프로그램은 경제적 요구사항과 정치적 현실의 변화에 비추어 수정되어야 합니다. 또한 한국 정부의 권력 인수 절차와 남북한의 경제 및 행정을 통합하는 문제에 대해서도 고려해야 합니다. 이러한 문제들은 미소공동위원회 제3분과위원회가 작성한 \"잠정 정부의 권력 인수 절차\"라는 문건에 요약되어 있으며, 5부가 미 극동군 사령관 전문의 첨부물로 합동참모본부에 송부되었습니다. 철수가 지연될 경우, 이 문건에서 제기된 문제들이 해결되어야 할 것입니다.\n\n제3절\n\n항 A. 한국으로부터의 질서 있는 철수와 관련하여, 계획은 전술 부대 및 예비 필수 근무 부대를 (1) FEC, 또는 (2) 미국 본토(ZI)로 철수시키는 것에 기초합니다. 항 B\n\n77945 우선\n\n\"의역 불필요. 육군 규정 380-5의 51조 1항 및 60조 a (4)항에 의거하여 1급 비밀 서신으로 취급할 것.\" -8-\n\n[0295면]\n기밀해제\n권한 NND8X6527\n극동사령부\n미태평양육군총사령부 인사참모부\n무선 및 전신 중계소\n2급 비밀 긴급\n수신 전문\n\n주한미군사령관 메시지 번호 ZGCG 1396, 1947년 11월 22일자 (계속):\n\n및 부산(釜山)을 통해 90일간 철수한다. 군무원 가족 및 민간인은\n병력 철수 개시 최소 90일 전부터 선박 확보 상황에 따라\n철수한다.\n\n3. 계획 A(1)에 따르면, 모든 T/O&E 장비 및\n사용 가능한 기지·주둔지·시설 재산 중, 한국 내에서 사용되어\n전쟁부가 승인한 것을 제외한 나머지가 전투 부대와 함께 철수한다.\nT/O&E 11톤.\n총 철수 선적 중량은 120,000 중량톤이며, 321,000\n용적톤이다. 이전 수치에 포함되지 않은 가재도구 및 개인 소지품\n총 20,000 중량톤, 즉 60,000 용적톤.\n자가용 - 4,000 중량톤, 즉 10,000 용적톤.\n병력 수화물 - 2,000 중량톤, 즉 3,000 용적톤.\n총 인원 철수 수치로는 34,000 중량톤,\n즉 75,000 용적톤을 고려해야 한다.\n\n4. 계획 A(2)에 따르면 T/O&E 재산만이\n계획 A(1)에 열거된 톤수로 부대와 함께 철수한다.\n\n5. 계획 B(1) 및 B(2)에 따르면 필수 개인 장비만이\n반출되거나 개인과 함께 이동한다.\n관련 총 중량, 2,200 중량톤, 즉 5,500 용적톤.\n어떤 계획이든 추가로 수송할 품목:\n병력 수화물 - 4,000 중량톤, 즉 10,000 용적톤.\n자가용 - 2,000 중량톤, 즉 8,600 용적톤.\n가재도구 및 군무원 가족 수화물 -\n2,300 중량톤, 즉 6,100 용적톤.\n\n6. 태평양 지역 내 미군이 필요로 하지 않는 미 재산 및 장비의\n잔여분은 한국 정부에 인계할 것을 권고한다. 현재 한국 내\n모든 장비의 선적 중량은 625,000 중량톤, 즉 1,500,000\n용적톤이다.\n\n7. 현재 보유 중인 모든 탄약류는 총 16,000 중량톤,\n즉 17,000 용적톤이며, 이 중량은 이전 톤수 수치에 포함되지 않았다.\n만약 한국군이 내 전문 ZGCQ 1293(210825/2) 및\n1947년 11월 1일자 내 서한 TA 32의 방침에 따라 승인된다면,\n한국군에 필요한 탄약과 승인된 무기는 한국 정부에\n인계해야 한다. 사용 가능한 탄약의 나머지는 반출하거나\n폐기한다. 사용 불가능한 탄약은 폐기한다.\n\n8. 어떠한 가정 하에서도, 모든 1종, 3종 및\n공병 건설 자재는 이전 수치에 포함되지 않았다.\n\n[0296면]\n기밀해제\n권한 NND8X6527\n2급 비밀 긴급\n\n주한미군사령관 메시지 번호 ZGCG 1396, 1947년 11월 22일자 (계속):\n\n이러한 재고는 소진될 것이며 모든 잔여분은\n한국 정부에 인계될 것으로 가정한다. 보유 중인\n거의 모든 유형의 장비와 재고는 비록 새롭고 불가피하게\n취약한 정부 하에서 일부 부실한 행정이 발생할 수 있음에도\n한국 경제에 큰 도움이 될 것이다. 만약 승인된다면,\n한국 정부군의 편성과 훈련은 잉여 재고나\n부대 보유 탄약, 혹은 둘 다를 제공함으로써\n크게 가속화될 것이다. 한국에서 철수할 경우,\nT/O&E 및 기지·주둔지·시설 재산이 부대와 함께 철수한다는\n가정 하에, 다음의 것들이 적절한 조치 하에\n한국에 이양되도록 남을 것으로 추정된다.\n여기에는 민간 보급 프로그램이나 FLC 협정을 통해\n한국을 위해 획득된 물자는 포함되지 않는다.\n\n건설 자재 - 270,000 중량톤.\n중장비 - 200,000 중량톤.\n내역: 측량 장비 - 400 중량톤; 도선 및 교량 장비 - 8,000 중량톤;\n암석 분쇄기, 저상 트레일러, 기중기, 도로 롤러 및\n트랙터를 포함한 중건설 장비 - 172,000 중량톤;\n펌프, 발전기 및 동력 공구 - 18,000 중량톤;\n수공구 및 편성 세트 - 1,600 중량톤.\n공병 예비 부속 - 18,000 중량톤.\n병기 예비 부속 - 24,000 중량톤.\n전 유형 3,200대 차량, 중량 23,000 중량톤,\n이 중 약 6,000 중량톤은 전투 차량임.\n후자의 최종 처분은 현재 검토 중인 결정에 따를 것임.\n전투 식량을 포함한 식량 - 7,600 중량톤.\n전투 식량 외 품목은 주로 통조림 육류 및 우유임.\n개인용 병참 피복 및 장비,\n두 품목 모두 약 50,000 세트. 중량 3,000 중량톤.\n추가로 벽 로커, 철제 간이 침대 등 기지·주둔지·시설\n병참 장비 5,000 중량톤.\n침대, 실험실 장비 및 고정 시설을 포함한\n약 2,100 중량톤의 기타 의료 보급품.\n\n[0297면]\n기밀해제\n권한 NND8X6527\n극동사령부\n미태평양육군총사령부 인사참모부\n무선 및 전신 중계소\n2급 비밀 긴급\n수신 전문\n\n주한미군사령관 메시지 번호 ZGCG 1396, 1947년 11월 22일자 (계속):\n\n1. 보급품 및 장비 철수와 관련하여,\n저는 채택된 전반적 철수 정책이 태평양 지역 내 다른 곳에서\n절실히 필요하지 않거나 우리가 미국에 적대적인 기관의\n손에 넘어가길 원치 않는 모든 것을 제외하고는\n한국에 남겨 한국 정부에 인계하는 것을 구상할 것을 권고한다.\n\n이곳의 경제 상황은 무기와 탄약을 제외하고는\n우리가 가진 거의 모든 것이 한국에서 유용한 목적에\n사용될 수 있는 상황이다. 대부분의 보급품과 장비는\n항구에 도달하기 위해 광범위한 철도 수송이 필요한 지역에 있으며,\n과도한 수송을 피하려면 그 대부분은 제한적이고 경직된\n인천항을 통과해야만 할 것이다.\n가용 연료와 시스템 운영에 대한 한국인의 의지 및 능력을 포함한\n철도 상황은 합리적인 시간 내에 철수하여 이익이 될 것으로\n여겨지는 대량의 군수 물자를 반출한다는 것이\n사실상 불가능할 정도이다. 지금도 우리는 자체 보급품과 장비,\n그리고 지역 경제에 필수적인 물자의 이동을 유지하는 데\n큰 어려움을 겪고 있다.\n\n한국 정부군 또는 보안 부대의 편성 및 훈련에 관한\n제4절은 별도로 제출한다.\n\n제5절, 본 답신의 성격상 그러한 조치를 요할\n별도 요청이 없는 한 항공 우편은 후속하지\n않을 것이다. 정치 고문 번스(POLAD Bunce)와 군정 장관\n동의함.\n\n[0298면]\n[판독불가: 심하게 손상된 OCR 조각. 한영 혼용 전신 테스트 패턴 혹은 스캔 잡음으로 보임]\n\n---\n군사규칙(AR) 380-5, 51 1항 및 60 a (4)항에 따라 2급 비밀 문서로 취급.\n\n본 전문의 원문을 동일 등급의 문서로 취급하고 전송하는 것은\n전쟁부가 1946년 3월 6일자 군사규칙(AR) 380-5, 16-C, 18-E,\n53-A, 53-D (1) (2) (3) 및 60-A (1) (2) (3) (4)항의 규정에 따라 승인하였음.\n2급 비밀", "secondary": "[0287면]\nDECLASSIFIED\nAuthority NND8X6527 GENERAL HEADQUARTERS, U. S. ARMY FORCES, PACIFIC ADJUTANT GENERAL'S OFFICE RADIO AND CABLE CENTER PRIORITY 22 Nov 47\nFROM: CG USAFIK\nTO: DA (JCS) SEU\nINFO: CINCFE, WAR (STATE DEPT) cance\nNR: ZGCG 1396 D.Y.\n\nReference WX 90136, 111834/Z. My views and comments are as follows:\n\nSection I. As regards general comment requested, I feel that due to almost certain continuing boycott by Soviets of UN Commission to Korea, US must envisage establishment of an independent South Korea, the government of which should if possible receive immediate recognition by UN though the Soviet Union, its satellites and other states or groups hostile to US will refuse to follow suit in order not to offend the Soviets. As program contemplated by paragraphs a through 5 of reference radio covers only the period up to withdrawal of US troops (approximately one year from now), there are numerous problems that Far East Subcommittee of SANACC must consider in ord
