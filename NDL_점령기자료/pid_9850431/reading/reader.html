34종합병원(34th General Hospital)\n나. 학급 정원: 25명\n다. 과정 기간: 160시간 (4주)\n라. 교관: 미군 장교 5명\n   미군 사병 10명\n마. 정규 교육 종료 시 학생들은 미군 병원에서 현장 실습(on-the-job training)을 수행한다.\n\n2급 비밀(TOP SECRET)\n\n[0259면]\n기밀해제\n권한 NND86527\n2급 비밀\n\n부록 # 1\n공병학교\n\n1. 목적:\n공병 부대 내 장교들에게 그들의 책임과 임무에 관한 교육을 제공한다.\n\n2. 범위:\n가. 전술 및 기술. (기초만).\n나. 참모 업무 및 야외 명령.\n다. 장비 운용 및 정비.\n라. 행정. (기초).\n마. 도구 사용법.\n바. 야전 임시 조치.\n\n3. 입교 자격:\n공병으로 배속된 장교. 가능하다면 사전에 공학 지식을 갖출 것.\n\n4. 일반 사항:\n가. 위치: 영등포(永登浦)\n나. 수용 인원: 60명\n다. 교육 기간: 240시간 (6주)\n라. 교관: 미국인 장교\n         미국인 사병\n\n2급 비밀\n\n[0260면]\n기밀해제\n권한 NND86527\n2급 비밀\n\n부록 # 13\n헌병감(Provost Marshal) 학교\n\n1. 목적:\n헌병 부대 장교들에게 전술 및 기술에 관한 교육을 제공한다.\n\n2. 범위:\n가. 수사.\n나. 국내 소요 진압.\n다. 교통 통제.\n라. 보안 조치.\n마. 부대 이동 (도보 및 차량).\n\n3. 입교 자격:\n헌병 부대에 배속된 장교.\n\n4. 일반 사항:\n가. 학교 위치: 서울(Seoul)\n나. 수용 인원: 30명\n다. 교육 기간: 4주\n라. 교관: 미국인 장교 2명\n         미국인 사병 4명\n\n2급 비밀", "secondary": "[0128면]\nDECLASSIFIED\nAuthority NND886527\nTOP SECRET\n\nGENERAL HEADQUARTERS\nFAR EAST COMMAND\nG-3 Training Sec\n353. 1 December 1947\n\nMEMORANDUM FOR: Assistant Chief of Staff, G-3\nSUBJECT: Notes on South Korean Army (For Trip to Korea).\n\n1. One of the assumptions on which the plan was based was that XXIV Corps would not drop below 15 Nov 47 levels in personnel or training. In view of the new manning level reductions, and of General Hodge's protest against reduction to levels where the XXIV Corps cannot carry out even housekeeping, occupation, and security missions (ZOCG 1410 CG USAFIK to CINCFE, 27 Nov 47), should this forecasted picture of XXIV Corps' ineffectiveness be used as basis for radio to DA to indicate inability of FEC to train South Korean Army?\n\n2. The outline of courses for officers' schools submitted by XXIV Corps indicates considerable stress on tactics. It is believed that, particularly in the lower level schools, technique of weapons should comprise the bulk of the course. For example, the Artillery School should stress gunnery with plenty of actual firing. In the Command and Staff School and in the Regimental-Battalion Commanders' School, enough technique should be included to give a sound idea of characteristics of weapons and the building of fire plans, both defensive and offensive.\n\n3. Recent information indicates that the Korean Coast Guard Communications School has graduated 70 Constabulary officers and that it has a capacity for 100 enlisted men.\n\na. Is the Constabulary continuing to send officers as students?\nb. Are enlisted men from the Constabulary attending as students?\nc. What sort of a pool of communications personnel will be established in the Constabulary by 31 March 1948?\nd. What are the scope and length of present courses?\ne. Are there possibilities for expansion?\n\n[0129면]\nDECLASSIFIED\nAuthority NND886527\nTOP SECRET\n\nMEMORANDUM FOR: ACS, G-3 (Cont'd)\n\n4. Does General Hodge plan to issue U.S. weapons to the Constabulary in the near future?\n5. What are the prospects for forming a corps of interpreters to assist in U.S. efforts to train an Army?\n6. Is there any clearer picture of the ability of the Korean Army's prospects of establishing an adequate medical service?\n7. Is any research being made as to MOS and SSN needed in Advisory Group?\n8. In general, what aspects of the study brought back by Major Smith, G-3 office, appear impracticable with the assumptions.\n\na. That 15 Nov levels in personnel and training can be maintained.\nb. That levels of personnel and training will be as forecast in radio mentioned in paragraph 1, above.\n9. Has any provision been made for loyalty screening of Korean Army personnel?\n10. Has consideration been given to modifications of T/O&E tables to fit capabilities and limitations of the Korean people. Believe this must be done by persons familiar with the Korean people before the training program is drafted or for instructing Army technicians?\n\nA. M. PARSONS\nColonel, GSC\n\nTOP SECRET\n\n[0130면]\nDECLASSIFIED\nAuthority NND886527\nTOP SECRET\n\nGENERAL HEADQUARTERS\nFAR EAST COMMAND G-3 Section STAFF STUDY 19 November 1947\nTRAINING OF THE SOUTH KOREAN ARMY\n\nTHE PROBLEM\n1. To evaluate the practicability of training a South Korean Army within restricted time limits.\n\nFACTS BEARING ON THE PROBLEM\n2. a. By Top Secret Radio ZGCG 1293, 22 October 1947, CG USAFIK estimates that, provided equipment is available:\n(1) The complete organization could be trained basically in 8-12 months.\n\nb. On 1 November 1947, G-3 XXIV Corps, submitted an outline plan. this plan was incomplete as to training.\n\nc. On 12 November 1947, Major Smith, G-3 representative XXIV Corps, arrived with a more complete plan for training and organization (Appendix A and Annex 1, Appendix A).\n\nASSUMPTIONS\n3. For assumptions see Appendix B.\n\nDISCUSSION\n4. For list of foreseeable problems and obstacles, see Appendices C and D.\n\nb. Method of attack of problem.\n(1) The problem is replete with imponderables, lack of factual data which could be acquired within required time limits, and complicated by a multitude of factors. Therefore, the problem was attacked as shown in (2), (3), and (4) below:\n\n[0131면]\nDECLASSIFIED\nAuthority NND886527\nTOP SECRET\n\n(2) Between 1 Nov 47 and 12 Nov 47, Training Division drew up a phasing plan based on training a South Korean Army and making it operational in about 7 months.\n(3) XXIV Corps prepared a similar plan based on completion of basic training in 8 to 12 months.\n(4) A comparison of the two plans, subsequent discussions of points of difference and reconciliation of various features led to certain conclusions and resulted in the building of another phasing plan shown in Appendix D.\n\n5. a. Analysis of the original Training Division Plan showed conclusively that it was beyond the capabilities of the XXIV Corps and the Korean people.\nb. Analysis of the XXIV Corps' Plan indicated that it was based on a more realistic evaluation of XXIV Corps' capabilities, but that:\n(1) Mobilization of the first increment (Army Hq, Army Troops, and three divisions) would take place simultaneously with the inception of officers' schools. This would provide no framework of trained cadre or specialized personnel upon which to hang the organization of units.\n(2) The phasing was not as rapid as it should be considering probable limitations as to time.\n(3) Capabilities for officers' schools and cadre training were not exploited fully.\n6. A new plan, evolved from reconciliation and further study (Appendix D) attempts revised phasing with full exploitation of XXIV Corps' capabilities. It is based on the assumptions in Appendix B. It provides:\n\na. Pre-mobilization school training for a limited number of officers.\nb. Pre-mobilization cadre training for NCOs for 6 weeks for the first increment.\nc. Organization of essential service units prior to mobilization of supported combat units.\nd. Fourteen weeks of basic training for divisions and 12 weeks unit training.\ne. A second increment of 3 divisions to follow the first increment at a ten-week interval.\n\nTOP SECRET\n\n[0132면]\nDECLASSIFIED • Authority NND846527\nTOP SECRET\n\nof the first increment operational on the 30th week and the second increment operational on the 40th week after mobilization. This is at the end of the unit training phase.\n7. The plan has many glaring weaknesses.\nAlthough the foreseeable capabilities of the XXIV will be utterly inadequate. For example, although the tech- Corps are fully, perhaps overly, exploited, the school system nical services alone need school training for 1,890 officers, only 854 can be given courses ranging from four to six weeks. At the present security classification, requirements and possibilities for training liaison plane pilots have not been evolved because advice of the Air Force cannot be sought.\nOne hundred and twenty officers, only, on the Army-Division level, can be given eight weeks of command and staff training. It appears that, of the 234 Communications and Signal Officers required for the proposed force, all can be given short courses at the Korean Coast Guard Communications School.\nAgainst requirements of 5113, about 400 enlisted specialists, only, can receive training in courses averaging three months. Of 19,717 EM who should have some form of technical school training, varying from 2nd Echelon Motor Mechanics to highly technical Signal Courses, about 1,074 can be given school training in short courses. This training can be given only after officers schools have ceased. Initial classes for EM in Ordnance, Engineer, and Quartermaster Schools cannot start until M plus 91.\nIn view of the dearth of qualified medical doctors in Korea, the training of Medical Units to standards approaching U.S. standards appears to be a matter of years, not months.\nCONCLUSIONS\n8. That the plan of phasing of training as outlined in Appendix E is the best that can be adopted on the basis of present assumptions and limitations; and should not be changed unless there is no change in the assumptions on which it is based.\n\n- 4 -\nTOP SECRET\n\n[0133면]\nDECLASSIFIED\nAuthority NND886527\n\nTOP SECRET\n\nThe above plan can be used as an evaluating factor in determining desirability of organizing a South Korean Army and as a basis for more detailed planning if such organization becomes an actuality.\nThe implementation of such a plan will result in:\n(1) A fair degree of infantry combat effectiveness to include the battalion.\n(2) A lesser degree of artillery combat effectiveness.\n(3) A low degree of proficiency in signal communications.\n(4) Probably a poor standard of maintenance of automotive, ordnance, engineer and signal equipment.\n(5) A very sketchily trained group of higher command and staff personnel whose capacity for absorption of this training is an unknown quantity.\n(6) An army in which lack of properly trained technicians will make the performance of essential supporting services in all echelons an extremely doubtful possibility.\n\nWith M minus 42 days set at six weeks after determination of policy.\n\nRECOMMENDATIONS\n9. That the conclusions reached in paragraph 8 above be considered among other factors in determining the desirability of forming a South Korean Army.\n\nCONCURRENCES\n10. G-3 XXIV Corps (Major J. W. Smith).\n\nARTHUR M. PARSONS, Colonel, GSC.\n\n- 5 -\nTOP SECRET\n\n[0134면]\nDECLASSIFIED\nAuthority NND 886527\n\nTOP SECRET\n\nAPPENDIX A - Schools For Constabulary Officers ANNEX I - Organization (Proposed Army)\nAPPENDIX B - Assumptions Upon Which The Plan In Appendix E Is Based APPENDIX C - Specific Problems Considered In This Study APPENDIX D - Obstacles To Training A South Korean Army APPENDIX E - Chronological Plan For Phasing Of Training Of A South Korean Army ANNEX I - Phasing Chart ANNEX 2 - Capabilities of XXIV Corps For Conducting Officers' Schools. ANNEX 3 - Estimated Capabilities of XXIV Corps For Cadre Training ANNEX 4 - Analysis Of The Specialist Training Situation TAB A - Specialist Requirements ANNEX 5 - Estimate On Advisory Group\n\nTOP SECRET\n\n[0135면]\nDECLASSIFIED • Authority NND 816527\nTOP SECRET\n\nAPPENDIX A\n\nSchools For Constabulary Officers In the event the Korean Army organization is approved there will be an immediate requirement for a large number of officers to fill command, technical and staff positions, from army to company level.\nThere are at present sufficient officers in the Korean Constabulary to fill the command, technical and staff positions in the army headquarters and in two (2) divisions. These officers have received excellent training in the constabulary and it is believed that an intensive course of instruction in special schools established by the U. S. Army will fit them for duty in these positions.\nSpecial schools will be established on a temporary basis to train these officers for duties set out above, and to develop a system of schools which will serve as a basis for future schools to be operated and supervised by the Koreans after evacuation by United States troops. These schools will be operated and supervised by appropriate major commanders who will furnish instructor personnel, training material to include buildings, areas, and ranges. Additional ranges and training areas required will be made available. Training films and strips, actual demonstrations and practical work will be utilized to the maximum. Maximum use will be made of U. S. unit sponsoring similar unit in Korean Army. Personnel to operate the schools will be those now assigned to Korea. It is anticipated that additional personnel from other sources may not be available, and all plans contained herein are based on that contingency. Supplies and other equipment to run the schools will come from stocks now physically present in Korea. Requisitions for this special project will be prepared only on a basis of absolute necessity. Every effort will be made to avoid call on other sources.\nThe locale of the schools will be as shown in inclosure one. The schools insofar as is practicable will be operated and supervised by the Commanding General 6th Infantry Division.\n\nCourses of instruction will of necessity be condensed. They will be drawn up to give the Korean officers the basic requirements of their job in the army.\n\nTOP SECRET\nAPPENDIX A\n\n[0136면]\nDECLASSIFIED\nAuthority NND86527\nTOP SECRET\n\n1. The following tactical schools will be established:\na. Command and Staff (Div and Army level).\nb. Regimental and Battalion Commanders (Inf, Artillery).\nc. Company officers (Infantry).\nd. Battalion and Battery officers (Artillery).\n\n2. The following technical schools will be established:\na. Engineer.\nb. Medical.\nc. Quartermaster.\nd. Ordnance.\ne. Signal.\nf. Military Police.\n\nFor details of each school see Annex 1.\n\nTOP SECRET\n\n[0137면]\nDECLASSIFIED\nAuthority NND86527\nTOP SECRET\n\nANNEX # 1 a Command And Staff School\n\n1. Purpose:\nTo provide instruction for selected officers in their responsibilities and duties in command and staff positions on the Army and Division level. To insure that each officer will have a basic knowledge of the staff principles and organization of the Korean Army.\n\n2. Scope:\nThe subjects to be taught will be similar to those taught at Leavenworth. They will of necessity be on a reduced scale and modified to suit conditions as they exist in Korea.\n\n3. Prerequisites:\nOfficers will be carefully selected for their potential suitability for duty prior to attending schools.\n\n4. General:\na. Location: Pusan\nb. Class Capacity: Sixty (60) students\nc. Duration of Course: Three (3) months\nd. Instructors: Ten (10) field grade U.S. officers Fifteen (15) enlisted men 20 22 23 24\nTOP SECRET 02\n26 6-A 27\n\n[0138면]\nDECLASSIFIED\nAuthority NND86527\nTOP SECRET\nANNEX # 1 b Regimental and Battalion Commanders School (Infantry and Artillery Officers).\n1. Purpose:\na. To provide instruction for selected officers in their responsibilities and duties as Regimental and Battalion Commanders.\nb. To prepare officers for duty as members of staffs of the regiment; to prepare officers for duty as commanders of reinforced battalions and regimental combat teams.\nc. To develop understanding and teamwork among the officers of the Infantry and other officers of the Army.\n2. Scope:\na. Organization, equipment, technique and tactical employment of all units of the Infantry.\nb. Organization, equipment, and tactical employment of other units that make up the regimental and battalion combat team.\nc. Leadership.\nd. Combat intelligence and counter intelligence.\ne. Communications.\nf. Troop movements (foot, motor and rail).\ng. Methods of instruction.\nh. Domestic disturbances.\n3. Prerequisites:\nOfficers to attend will be those selected for command and staff positions in regiments and battalions.\n4. General:\na. Location: Fusan\nb. Class Capacity: 100\nc. Duration of Course: Three (3) months\nd. Instructors: Five (5) field grade U.S. officers Fifteen (15) company grade U.S. officers Fifteen (15) enlisted men\nTOP SECRET\n\nDECLASSIFIED\nAuthority NND816527\nTOP SECRET\n\nANNEX # 1 c Company Officers Course (Infantry Officers)\n\n1. Purpose:\nTo provide instruction for officers of company grade in their responsibilities and duties within the Infantry; and the employment of Infantry in the regimental and battalion combat teams.\n\n2. Scope:\na. Tactics and technique of all weapons and equipment authorized the Infantry.\nb. Tactics and technique of units of the Infantry up to and including the battalion.\nc. Staff duties and field orders.\nd. Domestic disturbances.\n\n3. Prerequisites:\nOfficers of company grade assigned to Infantry will attend.\n\n4. General:\na. Location: Pusan\nb. Class Capacity: 100 students\nc. Duration of course: 45 days\nd. Instructors: 10 U. S. officers, 10 U. S. enlisted men\n\nTOP SECRET\n\n[0140면]\nTOP SECRET\n\nANNEX # 1 Battalion And Battery School (Field Artillery Officers)\n\n1. Purpose:\na. To provide instruction for officers of the Artillery in their responsibilities and duties.\nb. To provide in addition instruction for officers who will be assigned to cannon companies of the Infantry Regiments.\nc. To teach the employment of artillery.\n\n2. Scope:\na. Tactics and technique to include the battalion with sufficient background on Division Artillery to insure understanding.\nb. Command and staff duties.\nc. Field orders.\nd. Basic knowledge of individual and crew served weapons.\n\n3. Prerequisites:\na. Officers assigned to artillery and cannon companies.\n\n4. General:\na. Location: Chinhae\nb. Class Capacity: 100\nc. Duration of course: Two (2) months\nd. Instructors: Ten (10) US Artillery officers Thirty (30) US enlisted men\n\nTOP SECRET\n\n[0141면]\nDECLASSIFIED • Authority NND86527\nTOP SECRET\nANNEX #1 Communications School\n\n1. Purpose:\nTo provide instruction for selected officers in the technique, characteristics, installations and maintenance of communications systems authorized for the Korean Army.\n\n2. Scope:\na. Review of basic electricity.\nb. Study of wire communication equipment and practical work in installation, maintenance and operation of telephones, switchboards, and allied equipment in communication nets.\nc. Working knowledge of radio theory to provide an understanding of AM and FM radio transmission and reception.\nd. Study of radio sets, test equipment and auxiliaries.\ne. Message center operation.\nf. Preparation of SOI's, line route maps, traffic and circuit diagrams.\ng. International Morse Code, Radio and telephone procedure, visual signalling instruction.\nh. Duties of Communication personnel, methods of training.\ni. Signal supply organization.\n\n3. Prerequisites:\nOfficer to have a desire to attend course. Should have current or contemplated assignment as communications staff officer.\n\n4. General:\na. Location: Chinhae, Korea\nb. Class capacity: Sixty (60) students.\nc. Duration of course: Three (3) months.\nd. Instructors: Five (5) U. S. officers Ten (10) U. S. enlisted men.\n\nTOP SECRET\n\n[0142면]\nDECLASSIFIED\nAuthority NND 886527\nTOP SECRET\n\nANNEX # 1 Ordnance Maintenance School\n\n1. Purpose:\nTo provide instruction for selected officers in Motor Transport and Motor Vehicle Maintenance of vehicles common to all arms.\n\n2. Scope:\na. Preventive maintenance.\nb. Use of tools.\nc. Welding.\nd. Trouble shooting.\ne. Operations and maintenance of vehicles.\nf. Field expedients.\ng. Administration.\nh. Driver selection and training.\ni. Loading of vehicles.\nj. Shop procedure and inspections.\nk. Maintenance and repair of weapons and instruments.\n\n3. Prerequisites:\nOfficer to have a desire to attend course. Should have current or contemplated assignment as maintenance officer.\n\n4. General:\na. Location: Ascom City\nb. Class Capacity: 60 students\nc. Duration of course: 240 hours (6 weeks)\nd. Instructors: 5 U. S. officers 15 U. S. enlisted men\ne. Upon completion of course, students will perform on-the-job training in Ordnance units.\n\nTOP SECRET\n\n[0143면]\nDECLASSIFIED\nAuthority NND886527\nTOP SECRET\n\nANNEX #1 Quartermaster School\n\n1. Purpose:\nTo provide instruction for officers in the responsibilities and duties in Quartermaster units.\n\n2. Scope:\na. Components of the ration. (Korean)\nb. Operation of Depots.\nc. Operation of railheads.\nd. Classes of supply. (Korean)\ne. Administration.\nf. Upon completion of course, students will perform on-the-job training in the QM Depots.\n\n3. Prerequisites:\nOfficers assigned to Quartermaster units.\n\n4. General:\na. Location of school: Ascom City\nb. Class capacity: 60 students\nc. Duration of courses: 240 hours (6 weeks)\nd. Instructors: 5 U. S. officers 10 U. S. enlisted men\n\nTOP SECRET\n\n[0144면]\nDECLASSIFIED\nAuthority NND886527\nTOP SECRET\nANNEX #1 Medical Department School\n\n1. Purpose:\nTo provide instruction for Medical Officers in the responsibilities and duties in Medical units.\n\n2. Scope:\na. Evacuation.\nb. Administration.\nc. Operation, clearing and collecting units.\nd. Field hospitals.\ne. Staff duties and field orders.\n\n3. Prerequisites:\nMedical officers assigned to Medical units.\n\n4. General:\na. Location of School: Seoul - 34th General Hospital\nb. Class capacity: 25 students.\nc. Duration of course: 160 hours (4 weeks)\nd. Instructors: 5 U.S. officers 10 U.S. enlisted men\ne. When formal instruction is completed students will perform on-the-job-training in the U.S. Hospitals.\n\nTOP SECRET\n\n[0145면]\nDECLASSIFIED\nAuthority NND886527\nN TOP SECRET\nANNEX # 11 Engineer School\n1. Purpose:\nTo provide instruction for officers in their responsibilities and duties in the Engineer units.\n2. Scope:\na. Tactics and techniques, (Basic only).\nb. Staff duties and field orders.\nc. Operations and maintenance of equipment.\nd. Administration, (Basic).\ne. Use of tools.\nf. Field expedients.\n3. Prerequisites:\nOfficers assigned to Engineers. To possess prior knowledge of engineering if possible.\n4. General:\na. Location: Tongdong Po\nb. Class Capacity: 60 students\nc. Duration of course: 240 hours (6 weeks)\nd. Instructors: 5 U. S. officers, 20 enlisted men\nTOP SECRET\n02 6 11\n\n[0146면]\nDECLASSIFIED\nAuthority NND886527\nTOP SECRET\nN ANNEX # 1 1 Provost Marshal's School\n1. Purpose:\nTo provide instruction for officers in the tactics and techniques of Military Police units.\n2. Scope:\na. Investigations.\nb. Domestic disturbances.\nc. Traffic control.\nd. Security measures.\ne. Troop movements (foot and motor).\n3. Prerequisites:\nOfficer assigned to Military Police units.\n4. General:\na. Location of School: Seoul\nb. Class capacity: 30 students\nc. Duration of course: Four (4) weeks\nd. Instructors: 2 U. S. officers 4 U. S. enlisted men\n\n[0147면]\nDECLASSIFIED\nAuthority NND886527\nTOP SECRET\nPROPOSED ARMY\nConsisting of:\nNAME                WO    EM    AGG\nHeadquarters Army                174             38    938  1150\n(6) Infantry Division (Each)    (4548 758 300 50 71148 11858 12666 75996)\n\nService Units:\nSignal Units                           50              4   1065  1119 Ordnance Units                        104             12   2314  2418 Medical Units                         677*            12   2424  3073 Engineer Units                        108              5   2910  3023 Military Police Units                  58              2   1238  1298 Quartermaster Units                   103              0   2519  2622\nTOTAL                                5822            373  84556 90699\n* Contains 321 Nurses, 3 Dietitians and 2 PTA's\n\nTOP SECRET 02\nAppendix A Annex 1\n\n[0148면]\nDECLASSIFIED\nAuthority NND886527\nTOP SECRET\nORDNANCE UNITS\nUNIT                                                  T/O & E DATED           TOTAL\nTwo (2) Ord HAM Cos                             9-197   27 May 44        404 Four (4) Ord MAM Cos                            9-7     5 Feb 45        464 0-1    24 Sep 45 One (1) Base Arm Maint Bn    6        1       -         6 per Medical Depot Co           12        1       -        12 per Hospital Train              -        -                 None per Mob Surgical Hosp          12        -                 None per Evac Hosp                  12        4       -        48 per General Hosp               12        -       -         per MP Bn Med Det               6        2       -        12 per Sig Bn Med Det              6        1       -         6 per Army Hq Med Det             -        -       -         NOTE: The above medical cadres will strain XXIV Corps capabilities to the utmost and are probably beyond the optimum to be expected.\n\nTOP SECRET\n\n[0157면]\nDECLASSIFIED\nAuthority NND 886527\nTOP SECRET\n\nANALYSIS OF THE SPECIALIST TRAINING SITUATION\n\n1. Korea is a country almost devoid of technical specialists among the civil population. Under the Japanese regime, practically all civil skills of technical nature were exclusively restricted to the Japanese who, since the war, have been repatriated to Japan. Thus, among the Koreans, there is no pool of skilled personnel upon which to draw for an army or for instruction of army specialists. Attention is invited to Tab A of this annex tabulating specialist requirements.\n\n2. In the formation of a Korean Army within restricted time limits, the initial U.S. effort (XXIV Corps) must be directed toward setting up and carrying out the training of officers and the training of cadres within its capabilities as shown in Annexes 2 and 3 Appendix B.\n\n3. As these schools progress, with first, second, and third courses completed, Korean officers can be integrated into these schools as instructors. With these and what U.S. technical personnel become available some expansion of schools may be possible. Nevertheless, capacity will remain limited and will never approach the required amount. Under the phasing plan, which represents an optimum of effort with the means available, school training for Ordnance, Engineer, and Quartermaster enlisted specialists cannot begin until M plus\n137. For those requiring school training among the 7,000 enlisted medical specialists, schools cannot begin until M plus 16 and approximately 130 can be given 4 weeks of school training.\n\n4. The officer specialist situation is bad in all technical aspects.\n\na. Medical.\n(1) There are 2,800 registered doctors in South Korea against an estimated 20,000,000 population, or one doctor to 7,000 inhabitants. U.S. Ideal standards require a ratio of one to 1,250 (actually there is a ratio of one to 1,500). There is no breakdown on ages of doctors or other pertinent data.\n(2) There are 500 dentists or a ratio of one to 40,000 against the U.S. Ideal of one to 500 (actual ratio one to 1,800).\n\nTOP SECRET                               appendix E    02\n\n[0158면]\nDECLASSIFIED\nAuthority NND 886527\nTOP SECRET\n\n(3) The South Korean Army T/O&E requires 580 doctors and 170 dentists. No consideration is taken of specific specialties.\n(4) Not considered for purposes of this study are 2,400 so-called \"partially trained\"\ndoctors.\n(5) There are 200 registered nurses in South Korea and 2,000 \"practical\" nurses. T/O&E requirements are 321 registered nurses for medical units of the proposed Army.\n\nb. Communications.\nSeventy Constabulary officers have graduated from the Korean Coast Guard Communications School. This school has a capacity of 60 officers and 100 EM. If a South Korean Army is formed there will be a small backlog of officers and enlisted men who will have had some communications training. Assuming that training continues and that courses are of three months' duration, all of the requirement of 234 Communications and Signal Corps officers can be accommodated. However, the background of electrical engineering and practical experience in electrical and electronic skills required will be almost nil.\n\nc. Summary. The technical services require 1,820 officer specialists. Capacities of officers' schools in the phasing plan total 910. Detailed breakdown is as follows:\n\n(1) Of 234 Communications and Signal Officers, all can be given 3-months' schooling.\n(2) Of 345 Ordnance Officer specialists, 183 can be given 6-weeks' school training.\n(3) Of 154 Engineer Officers, all can be given 6-weeks' school training.\n(4) Of 862 Medical Corps Officers, 156 can be given 4-weeks' school training.\n(5) Of 235 Quartermaster Officer specialists, 183 can be given 6-weeks' school training.\n\n5. Enlisted Specialist Situation.\nOf the 19,717 enlisted specialists ranging from 2d Echelon Motor Mechanics to highly technical Communications specialists, approximately the same number of EM can be given school training as the number of officers shown in paragraph 4c above.\n\nTOP SECRET\n\n[0159면]\nDECLASSIFIED\nAuthority NND 886527\nTOP SECRET\n\n4, above, AFTER the officers' schools are completed. Above this an additional 200 Communications specialists can be given school training.\n\n5. b. (1) The difficulty of the task can be exemplified by the following:\n\nEnlisted  Estimated  Length Arm or Specialist School                    Service   Requirements  Capacity  Course Engineer Ordnance                            2632      731          180       6 weeks Medical Signal Communications             7000         5113        400       180       4 weeks 12 weeks Miscellaneous Quartermaster                  4855      852          180       6 weeks On-the-Job\n\n(2) In estimating the efficacy of such a program, lack of a pool of civilian-skilled personnel from which to draw and the obstacles of the language barrier must not be underestimated.\n\n(3) It follows that, even if pushed with utmost vigor, on-the-job training, decentralized as it must be and up against a language barrier, will not produce brilliant results.\n\nIn cadre training, superimposed on units of the XXIV Corps, the following NCOs or potential NCOs would receive 6 weeks of training spread in 3 increments extending from M-42 to M plus 84:\n\n2727  Infantry 1022  Field Artillery 1656  Engineers 1173  Ordnance 915   Quartermaster 465   Signal 135   Military Police 399   Medical NOTE: For breakdown see Annex 3 Appendix E.\n\n6. A comparison of the capacities listed in paragraphs 3, 4, and 5 above against the detailed breakdown of requirements shown in Tab A of this Annex will indicate the inadequacy of capabilities for training specialists, and by implication, the resultant deficiencies in services and maintenance. Attention again is invited to the prospect of an appalling deficiency in medical and communications services.\n\nTOP SECRET\n\n[0160면]\nDECLASSIFIED\nAuthority NND 886527\nTOP SECRET\n\nConclusion - That even to approach U.S. standards of maintenance, medical, engineer, and communications services is a matter of years rather than months of training for a Korean Army.\n\nTOP SECRET\n\n[0161면]\nDECLASSIFIED\nAuthority NND 886527\nTOP SECRET\n\nPHASE CHART\nMOBILIZATION TRAINING PERIOD\n\n1. SCHOOLS\na. ORDNANCE          1. OFFICER\n2. ENLISTED\nb. QUARTERMASTER     1. OFFICER\n2. ENLISTED\nc. MEDICAL           1. OFFICER\n2. ENLISTED\nd. ENGINEER          1. OFFICER\n2. ENLISTED\ne. MILITARY POLICE   1. OFFICER\n2. ENLISTED\nf. COMMAND AND STAFF\ng. REGIMENTAL AND BATTALION COMMANDERS\nh. COMPANY OFFICERS\ni. ARTILLERY SCHOOL   A. BATTALION AND BATTERY OFFICERS\nB. ENLISTED\nj. COMMUNICATIONS    1. OFFICER\n2. ENLISTED\n\n2. CADRE TRAINING\n\n3. RECRUITING\n\n4. MOBILIZATION TRAINING\nA. HQ ARMY AND 3 DIVISIONS   BASIC TRAINING\nB. REMAINDER OF 3 DIVISIONS  BASIC TRAINING\nC. SERVICE UNITS             UNIT TRAINING\n\nUNITS ARE OPERATIONAL\nCOMBINED ARMS PHASE BEGINS\nSAME AS ABOVE\n\nADVISORY GROUP FORMATION PERIOD\nASSUMES DUTIES\nM-DAY\n\nACTIVATIONS\nA. ARMY HEADQUARTERS\nB. 3 DIVISIONS\nC. [Illegible]\nD. SERVICE UNITS\n* PERFORMS SERVICE FUNCTIONS, BASIC & ON-THE-JOB TRAINING AS PRACTICABLE\n\nCADRES\nA. FOR DIVISIONS\nB. FOR SERVICE UNITS\n\n*MOBILE SURGICAL AND GENERAL HOSPITALS WILL NOT BE ACTIVATED DUE TO LACK OF QUALIFIED PERSONNEL\n\nTOP SECRET\n\n[0162면]\nDECLASSIFIED\nAuthority NND 886527 [Illegible - page appears blank except for header and numbers 19 20 21]\n\n[0163면]\nDECLASSIFIED\nAuthority NND886527\n\nMEDICAL UNITS\nUNIT                        T/O & E       DATED          TOTAL\nOne  (1) Hq & Hq Det Med Gp  8-22         5 Mar 45        36 Three (3) Med Amb Co, Mtr (Sep) 8-317 c-1 20 May 43 5 Aug 43    267 One  (1) Med Clr Co (Sep)      8-284 c-1  2 Aug 45 4 Sep 45    112 Six  (6) Mob Surg Hosp         8-571       23 Aug 45      744 One  (1) Gen Hosp (1000 bed)   8-550 c-1 c-2 c-3 c-4     3 Jul 44 19 Aug 44 28 Dec 44 2 Mar 45 25 Jan 45 24 Aug 45    588 Four (4) Evac Hosp (400 bed)   8-581       25 Mar 44      1184 One  (1) Med Dep Co            8-667       1 Dec 44       133 One  (1) Hosp Train            8-520 c-1 c-2 12 Feb 44 29 Jun 44 25 Jan 45    49\nTOTAL MEDICAL                                            3113\n\n[0164면]\nDECLASSIFIED\nAuthority NND886527\nTOP SECRET\n\nASSUMPTIONS UPON WHICH THE PLAN IN APPENDIX E IS BASED\n\n1.  That the formation of an advisory group of approximately 300 officers and 300 EM over and above FEC ceilings is possible.  For breakdown see Annex 5 Appendix E.\n\n2.  That the XXIV Corps will be maintained at 15 Nov 47 levels in personnel and training.\n\n3.  That a corps of about 600 satisfactory interpreters can be formed.\n\n4.  That the organization of the proposed force will be as shown in Annex I, Appendix A.\n\n5.  That the U.S., once committed to this policy, will go \"all out\" in the necessary equipment, funds, and personnel required.\n\n6.  That equipment enough for training purposes can be made available at the proper time.\n\n7.  That the present Korean constabulary will form the cadre for this force.\n\n8.  That preliminary training, particularly officer and cadre training from M-42 to M-Day will be under auspices of XXIV Corps.\n\n9.  That by M-42, the Korean constabulary will be filled to 25,000 and trained in the care and use of M-1 rifle, BARs, sub-machine guns, and HMGs.\n\n10. That sufficient troop housing for Army Hq, Army Service Troops, and 3 divisions will be available by M-Day.\n\n11. That officers' schools and cadre training can begin under XXIV Corps at M-42.\n\n12. That the best source of officers (for planning purposes) will be by promotion throughout all ranks of constabulary.\n\n13. That present constabulary NCOs must rise to the responsibilities of company or battery commander level.\n\n14. That U.S. standards cannot be hoped for within the period of time available prior to withdrawal of XXIV Corps.\n\nTOP SECRET appendix e\n\n[0165면]\nDECLASSIFIED\nAuthority NND886527\nTOP SECRET\n\n15. That the pool from which technicians or specialists must be drawn (the Korean people) is almost completely lacking in the skills required, particularly in the medical and signal aspects of the problem.\n\n16. That adequate processes for screening personnel for the particular type of loyalty needed, will be available.\n\n17. That Army Hq, vitally essential service units, and 3 divisions will be the first increment of activation.\n\n18. That the remainder of the force will comprise the 2nd increment.\n\nTOP SECRET\n\n[0166면]\nDECLASSIFIED\nAuthority NND886527\nTOP SECRET\n\nSPECIFIC PROBLEMS CONSIDERED IN THIS STUDY\n\n1.  Formation of a corps of interpreters.\n\n2.  Formation of a U.S. training advisory group to complement XXIV Corps effort.\n\n3.  Training of officers.\na. Schools for higher command and staff.\nb. Schools for lower level officers.\nc. Cadre training.\n\n4.  Training of NCOs.\na. Formation of cadres.\nb. Cadre training.\n\n5.  Input of fillers and initiation of MTP training.\n\n6.  Modification of MTPs (not a part of this study).\n\n7.  Phasing of training.\n\n8.  Gradual transfer of responsibility for training to Korean Army.\n\n9.  Specialist training - the worst bottleneck.\na. On-the-Job.\nb. School training.\n\n10. Training areas, aids, school facilities.\n\n11. Phasing of activations of units.\n\nTOP SECRET\n6A appendix c\n\n[0167면]\nTOP SECRET\n\nOBSTACLES TO TRAINING A SOUTH KOREAN ARMY\n\n1. Lack of good training areas, facilities, and training aids including rifle and artillery ranges.\n\n2. The language barrier.\n\n3. The lack of unified loyalty to Korea as a nation among the Korean population.\n\n4. The imposition of technical training on soldiery drawn from a people entirely unversed in modern technical skills.\n\n5. The constantly diminishing strength of the XXIV Corps including reduction in numbers of specialists and experienced NCOs.\n\n6. Use of deserted factory buildings as troop billets. Many Korean troops will be located in areas not best suited for training.\n\n7. Present almost complete unfamiliarity with U.S. weapons and equipment.\n\n8. Probable attempts to vitiate or sabotage the program by dissidents.\n\n9. Difficulties of transportation and poor condition of roads.\n\n10. The necessity for keeping at least 7,000 constabulary operational while the remainder form the framework of an Army.\n\n11. The lack of technical school capacity within XXIV Corps and within Korea.\n\nTOP SECRET\n\nappendit D\n\n[0168면]\nTOP SECRET\n\nA Chronological Plan for Phasing of Training of a South Korean Army.\n\nThe period covered is from approximately 6 weeks prior to M-Day to 40 weeks after M-Day.\n\nTOP SECRET\n\nappendid E\n\n[0169면]\nDECLASSIFIED:\nAuthority NND 886527\nTOP SECRET\n\nFirst Phase - Pre-Mobilization Training Starts at M-42 and Continues to M-Day (exclusive).\n\n1. Preparation of housing, supply maintenance, and training facilities begins. This continues throughout training period.\n\n2. A corps of interpreters previously formed reports to assigned stations on M-42.\n\n3. Augmented by 20 officers from XXIV Corps sources prior to M-4.\nGroup of officers acting presently as advisory group is increased to an advisory group of 300 U.S. officers and 300 enlisted men over and above U.S. ceilings. Selection, shipment from ZI, orientation and assignment is completed by M-Day. The officers in 3, above, will be added to this group. See Appendix H.\n\n4. First Session Command and Staff School starts (8 weeks course) on M-42.\n\n5. Officers Branch and Technical Schools start on M-42.\n\n6. Cadre training superimposed on XXIV Corps starts on M-42.\n\n7. At end of 4th week, first session of medical officers school ends and graduates revert to Korean constabulary.\n\n8. At beginning of 5th week, second session of medical school starts.\n\n9. At end of 6 weeks, following are completed:\na. First session of officers schools of services (Engineer, Ordnance, QM, Military Police).\nb. First session of Infantry Company Officers' School.\nc. First sessions of branch and service cadre training.\nd. All graduates report to new units.\n\n[0170면]\nDECLASSIFIED\nAuthority NND 886527\n\nTOP SECRET\n\nM-Day. Second Phase - Training After M-Day.\n\n1. Advisory group takes up duties in connection with organization and preparation for training.\n\n2. Graduates of first session of officers schools and cadre training take stations, organize cadres, and, in service units, prepare to receive fillers.\n\n3. M-Day for all service units occurs during 1st week and input of fillers begins.\n\n4. During this first week all service units, with exception of certain medical units (for whom personnel cannot be made available), are organized. About 5000 of available 18000 constabulary must be utilized in these service units, since their service functions will start almost at once.\n\n5. Second session company officers course begins on M-Day, and second session of medical officers and technical schools begin on M-Day.\n\n6. Second session cadre training begins on M-Day.\n\n7. First sessions of other schools continue.\n\n8. Beginning with 2d week, service units start service functions, particularly supply functions, and, concurrently carry on such specialist on-the-job and basic training as is possible.\n\n9. At end of 2d week, the following schools complete sessions and graduates revert to Korean Army units:\na. Command and staff school 1st session\nb. Artillery school\nc. Regimental and bn comdrs school\nd. Medical officers school, 2d session\n\n10. At beginning of 3d week, the following schools begin new sessions:\na. Command and Staff 2d and last under XXIV Corps\nb. Regimental and Bn comdrs \" \" \" \"\nc. Artillery 2d Session\nd. Medical Officer 3d Session\n\n[0171면]\nDECLASSIFIED\nAuthority NND 886527\n\nTOP SECRET\n\n11. 4th week is activation week for Army Hq, Army Special Troops, and 3 Divisions. Fillers are received. Note: Cadres for these units have had 3 weeks to prepare for reception.\n\n12. 5th week: MTP training for above units begins under modified MTP's.\n\n13. At end of 6th week the following complete:\na. Ordnance School 2d session\nb. QM School \"\nc. Engr School \"\nd. MP School 2d and last session\ne. Co. Officers School 2d session\nf. Medical School 3d session\ng. Communications School 1st session\nh. Cadre Tng 2d session\n\n14. Graduates revert to activated Korean units for training on the job.\n\n15. 7th week:\na. All above schools, except MP, start new sessions.\nb. Cadre training starts 3d session.\nc. Individual specialist on-the-job training starts in all units.\n\n16. 10th week the following schools complete:\na. Command and Staff last session\nb. Regimental and battalion comdrs\nc. Artillery 2d session\nd. Medical 4th session\n\n[0172면]\nDECLASSIFIED\nAuthority NND 886527\n\nTOP SECRET\n\n17. Graduates revert to Korean Army activated units for on-the-job training.\n\n18. 11th week, Medical School starts 5th session and Artillery School its 3d session.\n\n19. 12th week. The following complete sessions:\na. Ordnance School 3d session\nb. QM School 3d session\nc. Engineer School 3d session\nd. Co Officers 3d session\ne. Cadre training 3d session Note: From this time on, schools should be largely under Korean auspices and 13th week school training for enlisted specialists begins in the facilities of the officers' schools as follows:\na. Ordnance School\nb. Quartermaster School\nc. Engineer School\n\n20. 13th week. This is the 9th week of MTP training for first three Divisions. Cadres are formed and report to stations of new units.\n\n21. 14th week, Last three Divisions are activated and filled.\n\n22. 14th week. Medical School ends its 5th session.\n\n23. 15th week. Medical School starts 6th session.\n\n24. 15th week. MTP training of last three Divisions begins and, with a time lag of 10 weeks, follows the MTP pattern of the first three Divisions.\n\n25. At end of 18th week the following will have been completed:\na. First three Divisions - Basic Training Phase - 14 weeks\nb. Communications Officers School 2d session\nc. Ordnance Enlisted Specialists School 1st session\nd. QM Enlisted Specialists School 1st session\n\nTOP SECRET\n\n[0173면]\nDECLASSIFIED\nAuthority NND86527\nTOP SECRET\n\ne. Engr Enlisted Specialist School 1st session\nf. Artillery Officers School 3d session\ng. Medical Officers School 4th session Note: No foreseeable estimate as to training phase of service-type units can be given, as they will be forced to carry on service functions concurrently with on-the-job training. The lack of school training facilities for enlisted specialists complicates their problem enormously.\n\n26. At the beginning of the 19th week of Mobilization Training the following schools start 1st and 2d sessions. The capacities and lengths of courses cannot be foreseen because there is no way to estimate the potential of the Korean Army in instructor pools, expansion of school facilities, or capacity for organization and administration of the force.\n\na. Ordnance enlisted specialists 2d session\nb. QM enlisted specialists\nc. Engineer specialists\nd. Artillery specialists 1st session\ne. Communications specialists \" \"\n\n27. First three Divisions begin unit training.\n\n28. 28th week. Last three Divisions complete Basic Training Phase of 14 weeks.\n\n29. 29th week. Last three Divisions enter unit training phase.\n\n30. 30th week. First three Divisions complete unit training phase and become operational. Training is continued into the combined arms phase while operational duties are carried on.\n\n31. 40th week. Last three divisions complete unit training phase.\n\nWith the multitude of imponderables involved, the above phasing plan represents an optimum if all factors are favorable. The implementation of such a plan probably would result in a fair level of infantry training, a lower level of artillery training, and an exceedingly low level in technically skilled specialist\nTOP SECRET\n\n[0174면]\nDECLASSIFIED\nAuthority NND86527\nTOP SECRET\n\nCOMPOSITE LIST OF OFFICER AND ENLISTED SPECIALISTS\nRequired for Six Divisions & Army Hg & Service Units\n\nENGINEER OFFICER SPECIALISTS  70  84  154\nENGINEER ENLISTED SPECIALISTS  181  450  731\nSIGNAL OFFICER SPECIALISTS  56  168  224\nSIGNAL ENLISTED SPECIALISTS  629  4484  5113\nORDNANCE OFFICER SPECIALISTS  135  210  345\nORDNANCE ENLISTED SPECIALISTS  1768  864  2632\nMEDICAL OFFICER (DOCTOR) SPECIALISTS  474  276  750\nMEDICAL OFFICER (NON-DOCTOR) SPECIALISTS  55  57  112\nNURSE SPECIALISTS  321  0  321\nMEDICAL ENLISTED SPECIALISTS  892  6108  7000\nMILITARY POLICE OFFICER SPECIALISTS  34  36  70\nMILITARY POLICE ENLISTED SPECIALISTS  [illegible]  6  [illegible]\nQUARTERMASTER OFFICER SPECIALISTS  109  126  235\nQUARTERMASTER ENLISTED SPECIALISTS  [illegible]  852  852\nMISCELLANEOUS ENLISTED SPECIALISTS  1099  3756  4855\n\nTOP SECRET\n\n[0175면]\nDECLASSIFIED\nAuthority NND86527\n\nMEDICAL OFFICER SPECIALISTS\nTOP SECRET\n\nN.  SSN  DESCRIPTION  Required for Service Type Medical Units and Army Hg  Required for Non-Medical Service Units  Required for One Division  Required for Three Divisions  Required for Six Divisions  Total Required 1  2252  PSYCHOLOGIST  1  1 2  2431  MED er, the breakdown does show the numbers by arms and services as the best estimate that can be made at this time. Enlisted men are requested on the basis of one per officer.\n\n3. Breakdown:\n\nCOMBAT UNITS\nUnit                               Korean Army    U.S. Off   U.S. EM   Total Arm or Branch (Int  10)\nInf Div                             Inf             80 (Div Hg)                                          (Ima) Div Arty                            FA              18 Inf Regt                            Inf Arty Bns                            FA Ord Co                              Ord               2         6 QM Co                               QM Ren Trp                             Ren Sig Co                              Sig MP Co                               MP Med Bn                              Med Engr Bn                             Engr Total 6 Div  150       150       300\n\nSERVICE UNITS\nSig Units                           Sig              12 Medical                             Med               2 Ordnance                            Ord              12 Military Police                     MP                5 Engineers                           Engr             14\n\nTOP SECRET\n\nA-appendi-annel 5\n\n[0193면]\nDECLASSIFIED\nAuthority NND 886527\nTOP SECRET\n\nSERVICE UNITS (CONTD)\n* Unit Arm or Branch Total 6    6    12 Total Combat Units 150      Total Sv Units 150 Total Army Hq     10        Total  300 73       73      146 Total for Units    233      233     466\n\nSCHOOLS\nLO              C & S       Branch Immaterial 9    18 Med Co    Off Course Regtl & Bn O Arty        QM Sig    Ord  Med FA     Sig  Int Ord    QM   Inf MP                  MP      Engr Engr                        Engr 10                        4 67 67 134 Total Advisory 300 300 600 SL Group 9 L 8 L 10761\nSZ        02\n\nTOP SECRET\n\n[0194면]\nDECLASSIFIED:\nAuthority NND86527\nTOP SECRET\nG-3 Training 20 Nov 47 MEMO FOR RECORD:                   200c/ AMP/vh\nSUBJECT: Staff Study on Training of the South Korean Army\n\n1. BASIC ACTION: Need, as expressed by Plans Division, G-3, for such a study to assist in preparing recommendation for higher policy.\n\n2. a. By Top Secret Rad ZGCG 1293, 22 Oct 47, CG USAFIK estimates that, if equipment is available, Army Hq, Army Service Troops and 3 Divisions could be trained basically in 5 months, and that the complete organization could be trained basically in 8-12 months.\nb. On 1 Nov 47, G-3 XXIV Corps presented an outline plan which was incomplete as to training. G-3 Ing prepared a plan between 1 and 12 Nov 47.\nc. On 12 Nov 47 G-3 XXIV Corps representative (Maj J. W. Smith) arrived with a more complete plan for training and organization.\n\n3. Basic action study eliminates both G-3 Ing Plan and XXIV Corps plan because of weakness in both and creates a new plan (Appendix E, basic action). Study summarizes the provisions of the new plan, lists its weaknesses and itemizes probable results if it is implemented. Study recommends that the probable results of implementation be considered among other factors in determining the desirability of forming a South Korean Army.\n\n4. RECOMMENDED ACTION: Review of Staff Study, approval of its conclusions and recommendation and forward to Plans Div, G-3, for their info and assistance in preparing recommendations on this subject.\n\n5. CONCURRENCES: Major J. W. Smith, G-3, XXIV Corps.\n\n6. RECOMMENDATION: Indicate approval of study by initialing R/S and fwa to Plans Div.\n\n7. COMPLETION: No action is charged to G-3 in this matter.\n\nParsons 26-5952 02 6-A                        TOP SECRET\n\n[0195면]\nDECLASSIFIED\nAuthority NND8X6527\nTOP SECRET\nAnnex B\nPRELIMINARY ASPECTS CONCERNING\nPROPOSED PLANS FOR TRAINING\nA SOUTH KOREAN ARMY\n17 November 1947\n1. At the request of Col Biddle, the following notes are furnished him for information only. They cannot be considered conclusive because:\na. They are based on many imponderables and assumptions.\nb. Studies on this subject and information required are, as yet, incomplete.\nc. They represent merely current thinking and do not constitute a plan.\n2. Assumption:\na. That the formation of an advisors group of approximately 300 officers and 300 EM over and above FEC ceilings is possible. For breakdown see Annex 5, Appendix I.\nb. That the XXIV Corps will be maintained at 15 Nov 47 levels in personnel and training.\nc. That a corps of about 600 satisfactory interpreters can be formed.\nd. That the organization of the proposed force will be as shown in Inclosure I.\ne. That the US, once committed to this policy, will go \"all out\" in the necessary equipment, funds, and personnel required.\nf. That equipment enough for training purposes can be made available at the proper time.\ng. That the present Korean constabulary will form the cadre for this force.\nh. That preliminary training, particularly officer and cadre training from M-42 to M-Day will be under auspices of XXIV Corps.\ni. That by M-42, the Korean constabulary will be filled to 25,000 and trained in the care and use of M-1 rifles, BARs, sub-machine guns, and IMs.\nTOP SECRET\n\n[0196면]\nDECLASSIFIED\nAuthority NND8X6527\nTOP SECRET\nj. That sufficient troop housing for Army HQ, Army Service Troops, and 3 Divisions will be available M-Day.\nk. That officers' schools and cadre training can begin under XXIV Corps at M minus 42.\nl. That the best source of officers (for planning purposes) will be by promotion throughout all ranks of Constabulary.\nm. That present constabulary NCOs must rise to the responsibilities of company or battery commander level.\nn. That US standards cannot be hoped for within the period of time available prior to withdrawal of XXIV Corps.\no. That the pool from which technicians or specialists must be drawn (the Korean people) is almost completely lacking in the skills required, particularly in the medical and signal aspects of the problem.\np. That adequate processes for screening personnel, for the particular type of loyalty needed, will be available.\nq. That Army Hq, vitally essential service units, and 3 Divisions will be the first increment of activation.\nr. That the remainder of the force will comprise the 2d increment.\n3. A plan prepared to estimate the possibilities of making such a force operational within 7 months at about 30% US standards showed conclusively that it was beyond present capabilities of FEC, the XXIV Corps, or the XXIV Corps plus the advisory group of 300 officers and 300 EM.\n4. The XXIV Corps' plan based on completion of basic training for the 1st increment in 5 months, and completion of basic training for all in 8-12 months, was on too slow a time schedule, required revised phasing, and did not exploit fully the capabilities of XXIV Corps at present strength levels.\n5. Studies are under way toward reconciliation of the two plans and evolving a more satisfactory phasing plan. Such agreements as have been reached tentatively, particularly in training from M-42 to M-Day are appended as Inclosure 2.\n6. General Comment:\nFrom the standpoint of these notes, no comment is made as to the impact of a training program on a politically precarious situation.\nTOP SECRET\n\n[0197면]\nDECLASSIFIED\nAuthority NND8X6527\nTOP SECRET\nThe supply and equipment problem is one of the imponderables at present.\nThe diminishing troop strength of XXIV Corps and the fading probability of that strength being maintained are factors which lessen the prospect of successful accomplishment of the training mission. To even approach US standards in medical units and signal communications appears a matter of years, not months. The question of higher levels of ordnance and engineer specialist skills presents somewhat similar problems. It is believed that a fair level of infantry training, and a lower level of artillery training can be reached within required time limits, but the capacity of the Korean for command at the combined arms level is an imponderable which only time will resolve.\n\nARTHUR M. PARSONS, Colonel, GSC.\n\n2 Incls 1. Proposed South Korean Army\n2. Capabilities of XXIV Corps for Conducting Officers' Schools\nTOP SECRET\n\n[0198면]\nDECLASSIFIED\nAuthority NND8X6527\nTOP SECRET\nPROPOSED SOUTH KOREAN ARMY\nThe general concept of possible employment of South Korean Forces envisages ground operations of a local nature requiring a force capable of defending the frontier against organized attack, preventing infiltration into South Korea, and guarding important installations and activities against attack and sabotage. Six standard U.S. Infantry Divisions (Modified) are considered a minimum. Proposed composition of recommended combat troops is as follows:\n\n1 Hq and Hq Co and Special Troops Army (-Chaplains and Chaplains assistants)..........................1150 6 Infantry Divisions Modified @ 12666 each......75996 Consist:\nHq Div (-Chaplain and Chaplain Assts) T/O&E 7-1 with C-2 (Includes Liaison Aircraft)...............171 Hq Co (-Chaplain) (-15 men from defense plat)\n(Includes Liaison Aircraft)...................268 3 Inf Regts (Modified) @ 2845 each..............8535 Consist:    Hq Co T/O&E 7-12-0S (Liaison Aircraft)..106 Sv Co T/O&E 7-13-0S (-8 men from Hq Co & Regt Hq Plat)...................107 Atta Medic T/O&E 7-11-0S...........136 Cannon Company....................114 Antitank Company..................159 3 Inf Bn T/O&E 7-15 (Mod) @ 741 each..2223 Consist:\nHq Co (-Antitank Platoon).........83 Hv Weapons Co T/O&E 7-18..........160 3 Rifle Cos (9 man squad) @ 166 each..498 Med Bn...........................................443 Engineer Bn (Includes Liaison Aircraft)..........637 Cav Ren Troop (Mez)..............................149 Hq Div Arty (Med Det)............................159 3 105mm How Bns (Truck Drawn) @ 497 each.........1491 Ord Maint Co.....................................150 QM Company.......................................186 MP Company.......................................176 Band............ . . . 1044 12509 Aggregate Total  . . . . . . . . . . . . . . . . . . . . 90699\n\n[0201면]\nDECLASSIFIED\nAuthority NND 846527\nTOP SECRET\n\nHEADQUARTERS\nUNITED STATES ARMY FORCES IN KOREA\nAPO 235\n\nTRCG 322                                                              11 November 1947 014.12\nSUBJECT: Proposed Korean Army\nTO: Commander-in-Chief Far East Command\nAPO 500\n\nMy previous comments and recommendations on the formation of a Korean Army are included in USAFIK radio ZGCT 1293 (210825/Z).\n\nThe attached proposed Korean Army organization is based in general on standard United States Army units and is considered suitable for operations on terrain as exists in Korea. Major changes are:\na. The Infantry squad is reduced to nine (9) men.\nb. Recoilless 57mm and 75mm rifles are deleted.\nc. Artillery, cannon and anti-tank guns are towed.\nd. The 155mm Howitzer Battalion is deleted from Division Artillery.\n\nThe general concept of possible employment of South Korean forces envisages ground operations primarily of a defensive nature which will require a force capable of defending the 38° Parallel against an organized attack from the north, controlling infiltration into South Korea, guarding vital installations and activities against attack and sabotage.\n\nAn organization of this type, armed with United States weapons and equipment, although numerically inferior in number should be capable of defending South Korea from an attack by organized hostile elements of other Koreans.\n\nIt is believed that this unit may well form the nucleus for the Korean National Army when the occupying forces are withdrawn as it is a voluntary organization as opposed to conscription in the North Korean Peoples Army\n\nTS-32-8\nTOP SECRET Copy #/\n\n[0202면]\nDECLASSIFIED\nAuthority NND 846527\nTOP SECRET\n\n[Page content is a mirror-image reversed and garbled version of page 0201; no new text recoverable]\n\nTS-32-8\nTOP SECRET Copy #/\n\n[0203면]\nDECLASSIFIED\nAuthority NND86527\n for enlisted men see AR 615-26, for officers see TM 12-406 and 12-407.\n\nTOP SECRET\n\n[0247면]\nDECLASSIFIED\nAuthority NND 016527\nTOP SECRET\n\nPROPOSED INFANT REGIMENT\n\n26 FEB 48\n\nTOP SECRET\n\n199 5WO R69R-EM AGG 2845 CANNON ANTI-TANK 46 20 MEDICAL COMPANY 71305 ROFEB 14 DTO 30 JUNE 14 *PEE 44 WICH TOTE FORE T-HOS RGEES 41 WICH TONE 9-1405 ARER DID SO VUNE 14 REFEB 44 TOVE 7-1905 WICH\nI0-0 IRCHEM AGE I-EM ANGUA 290A4.66 LAGG\n\nTOP SECRET\n\nTOP SECRET\n\n30 45 & JUNE S4 AGG 60 AND 19g 466-83\n\nTOP SECRET\n\n[0248면]\nDECLASSIFIED\nAuthority NND 8X6527\n\n[0249면]\nDECLASSIFIED\nAuthority NND86527\n\nTOP SECRET\n\nSchools for Constabulary Officers In the present Korean Army organization as approved, there will be an immediate requirement for a large number of officers to fill command, technical, and staff positions, primarily up to company level. There are at present sufficient officers in the Korean Constabulary to fill the command and staff positions in the army headquarters and in two (2) divisions. These officers have received excellent training in the Constabulary and it is believed that an intensive course of instruction in schools established and operated by the U.S. Army will fit them for duty in these positions.\n\nTo train these officers for duties set out above, and to develop a system of schools that will serve as a basis for future schools to be operated and supervised by the Koreans after evacuation by United States troops, special schools will be established on a temporary basis. These schools will be operated and supervised by appropriate major commanders who will furnish instructor personnel, training material to include War Department publications, training aids, buildings, areas, and ranges. All school facilities now utilized by U.S. Army personnel will be made available and practice will be utilized to the maximum. Training films and similar actual demonstrations will be used. Additional ranges and training areas required will where possible utilize land not suited for cultivation, mountainous and swamp areas. Maximum use will be made of the assets of the U.S. units sponsoring similar units in the Korean Army.\n\nSupplies and other equipment to run the schools will come from stocks not physically present in Korea. Requisitions for this special project will be prepared only on a basis of absolute necessity. Every effort will be made to obtain [illegible] from other sources.\n\nThe locations of the schools will be as shown in the accompanying annex.\n\nThe following schools insofar as practicable will be operated and supervised by the Commanding General of each Infantry Division. They will prepare the officer for his specific job in the army.\n\n1. The following tactical schools will be established.\na. Command and Staff (Div and Army levels).\nb. Regimental and Battalion Commanders (Infantry, Artillery).\n\nTOP SECRET\n\n[0250면]\nDECLASSIFIED\nAuthority NND 846527\n\nTOP SECRET\n\n(Schools for Constabulary Officers, Continued)\n\nc. Company officers (Infantry).\nd. Battalion and Battery officers (Artillery).\n\n2. The following technical schools will be established:\na. Engineer.\nb. Medical.\nc. Quartermaster.\nd. Ordnance.\ne. Signal.\nf. Military Police.\n\nFor details of each school see Annex L.\n\nTOP SECRET\n\n[0251면]\nDECLASSIFIED\nAuthority NND 816527\nTOP SECRET\nANNEX # Command And Staff School\n1. Purpose:\nTo provide instruction for selected officers in their responsibilities and duties in command and staff positions on the Army and Division level.\nTo insure that each officer will have a basic knowledge of the staff principles and organization of the Korean Army.\n2. Scope:\nThe subjects to be taught will be similar to those taught at Leavenworth. They will of necessity be on a reduced scale and modified to suit conditions as they exist in Korea.\n3. Prerequisites:\nOfficers will be carefully selected for their potential suitability for staff duty prior to attending schools.\n4. General:\na. Locations: Pusan\nb. Class Capacity: Sixty (60) students\nc. Duration of Course: Three (3) months\nd. Instructors: Ten (10) field grade U.S. officers, Fifteen (15) enlisted men\nTOP SECRET\n\n[0252면]\nDECLASSIFIED\nAuthority NND 846527\nTOP SECRET\nANNEX # 1 Regimental And Battalion Commanders School (Infantry And Artillery Officers)\n\n1. Purpose:\na. To provide instruction for selected officers in their responsibilities and duties as Regimental and Battalion Commanders.\nb. To prepare officers for duty as members of staffs to include the regiment; to prepare officers for duty as commanders of reinforced battalions and regimental combat teams.\nc. To develop understanding and teamwork among the officers of the Infantry and other officers of the army.\n\n2. Scope:\na. Organization, equipment, technique and tactical employment of all units of the Infantry.\nb. Organization, equipment, and tactical employment of other units that make up the regimental and battalion combat team.\nc. Leadership.\nd. Combat intelligence and counter intelligence.\ne. Communications.\nf. Troop movements (foot, motor and rail).\ng. Methods of instruction.\nh. Domestic disturbances.\n\n3. Prerequisites:\nOfficers to attend will be those selected for command and staff positions in regiments and battalions.\n\n4. General:\na. Location: Pusan\nb. Class Capacity: 100\nc. Duration of Course: Three (3) months\nd. Instructors: Five (5) field grade U. S. officers, five (5) company grade U. S. officers, fifteen (15) enlisted men\n\nTOP SECRET\n\n[0253면]\nDECLASSIFIED\nAuthority NND886527\nTOP SECRET\nANNEX # 2 Company Officers Course (Infantry Officers)\n\n1. Purpose:\nTo provide instruction for officers of company grade in their responsibilities and duties within the Infantry, and the employment of Infantry in the regimental and battalion combat teams.\n\n2. Scope:\na. Tactics and technique of all weapons and equipment authorized the Infantry.\nb. Tactics and technique of units of the Infantry up to and including the battalion.\nc. Staff duties and field orders.\nd. Domestic disturbances.\n\n3. Prerequisites:\nOfficers of company grade assigned to Infantry will attend.\n\n4. General:\na. Location: Pusan\nb. Class Capacity: 100 students\nc. Duration of course: 45 days\nd. Instructors: 10 U. S. officers, 10 U. S. enlisted men\n\nTOP SECRET\n\n---\n[0254면]\nDECLASSIFIED\nAuthority NND8X6527\nTOP SECRET\nANNEX # 1 d Battalion And Battery School (Field Artillery Officers)\n\n1. Purpose:\na. To provide instruction for officers of the Artillery in their responsibilities and duties.\nb. To provide in addition instruction for officers who will be assigned to cannon companies of the Infantry Regiment.\nc. To teach the employment of artillery.\n\n2. Scope:\na. Tactics and technique to include the battalion with sufficient background on Division Artillery to insure understanding.\nb. Command and staff duties.\nc. Field orders.\nd. Basic knowledge of individual and crew served weapons.\n\n3. Prerequisites:\nOfficers assigned to artillery and cannon companies.\n\n4. General:\na. Location: Chinhae (Chinhae)\nb. Class Capacity: 100\nc. Duration of course: Two (2) months\nd. Instructors: Ten (10) U.S. Artillery officers Thirty (30) U.S. enlisted men\n\nTOP SECRET\n\n[0255면]\nDECLASSIFIED\nAuthority NND886527\nTOP SECRET\nANNEX # 1 Communications School\n1. Purpose:\nTo provide instructions for selected officers in the technique, characteristics, installations and maintenance of communications systems authorized for the Korean Army.\n2. Scope:\na. Review of basic electricity.\nb. Study of wire communication equipment and practical work in installation, maintenance and operation of telephones, switchboards, and allied equipment in communication nets.\nc. Working knowledge of radio theory to provide an understanding of AM and FM radio transmission and reception.\nd. Study of radio sets, test equipment and auxiliaries.\ne. Message center operation.\nf. Preparation of SOI's, line route maps, traffic and circuit diagrams.\ng. Radio and telephone procedure, visual signalling and international Morse Code.\nh. Duties of Communication personnel, methods of instruction.\ni. Signal supply organization.\n3. Prerequisites:\nOfficer to have a desire to attend course. Should have current or contemplated assignment as communications staff officer.\n4. General:\na. Location: Chinhae, Korea\nb. Class capacity: Sixty (60) students.\nc. Duration of course: Three (3) months.\nd. Instructors: Ten (10) U. S. enlisted men Five (5) U. S. officers\nTOP SECRET\n\n[0256면]\nDECLASSIFIED\nAuthority NND8X6527\n\nTOP SECRET\n\nANNEX # 12 Ordnance Maintenance School\n\n1. Purpose:\nTo provide instruction for selected officers in Motor Transport and Motor Vehicle Maintenance of vehicles common to all arms.\n\n2. Scope:\na. Preventive maintenance.\nb. Use of tools.\nc. Welding.\nd. Trouble shooting.\ne. Operations and maintenance of vehicles.\nf. Field expedients.\ng. Administration.\nh. Driver selection and training.\ni. Loading of vehicles.\nj. Shop procedure and inspections.\nk. Maintenance and repair of weapons and instruments.\n\n3. Prerequisites:\nOfficer to have a desire to attend course. Should have current or contemplated assignment as maintenance officer.\n\n4. General:\na. Location: Ascom City\nb. Class capacity: 60 students\nc. Duration of course: 240 hours (6 weeks)\nd. Instructors: 5 U.S. officers 15 U.S. enlisted men Upon completion of course, students will perform on-the-job training in ordnance units.\n\nTOP SECRET\n\n[0257면]\nDECLASSIFIED\nAuthority NND86527\n\nTOP SECRET\n\nANNEX # 13 Quartermaster School\n\n1. Purpose:\nTo provide instruction for officers in the responsibilities and duties in Quartermaster units.\n\n2. Scope:\na. Components of the ration. (Korean)\nb. Operation of Depots.\nc. Operation of railheads.\nd. Classes of supply. (Korean)\ne. Administration.\nUpon completion of course, students will perform on-the-job training in the QM Depot.\n\n3. Prerequisites:\nOfficers assigned to quartermaster units.\n\n4. General:\na. Location of school: Ascom City\nb. Class capacity: 60 students\nc. Duration of course: 240 hours (6 weeks)\nd. Instructors: 5 U.S. officers 10 U.S. enlisted men\n\nTOP SECRET\n\n[0258면]\nDECLASSIFIED\nAuthority NND 886527\nTOP SECRET\nANNEX # 1 to Medical Department School\n\n1. Purpose:\nTo provide instruction for Medical Officers in the responsibilities and duties in Medical units.\n\n2. Scope:\na. Evacuation.\nb. Administration.\nc. Operation, clearing and collecting units.\nd. Field hospitals.\ne. Staff duties and field orders.\n\n3. Prerequisites:\nMedical officers assigned to Medical units.\n\n4. General:\na. Location of School: Seoul - 34th General Hospital\nb. Class capacity: 25 students\nc. Duration of course: 160 hours (4 weeks)\nd. Instructors: 5 U.S. officers 10 U.S. enlisted men\ne. When formal instruction is completed students will perform on-the-job training in the U.S. Hospitals.\n\nTOP SECRET\n\n[0259면]\nDECLASSIFIED\nAuthority NND86527\nTOP SECRET\n\nANNEX # 1 Engineer School\n\n1. Purpose:\nTo provide instruction for officers in their responsibilities and duties in the Engineer units.\n\n2. Scope:\na. Tactics and techniques. (Basic only).\nb. Staff duties and field orders.\nc. Operations and maintenance of equipment.\nd. Administration. (Basic).\ne. Use of tools.\nf. Field expedients.\n\n3. Prerequisites:\nOfficers assigned to Engineers. To possess prior knowledge of engineering if possible.\n\n4. General:\na. Location: Yongdong Po\nb. Class capacity: 60 students\nc. Duration of course: 240 hours (6 weeks)\nd. Instructors: U. S. officers U. S. enlisted men\n\nTOP SECRET\n\n[0260면]\nDECLASSIFIED\nAuthority NND86527\nTOP SECRET\n\nANNEX # 13 Provost Marshal's School\n\n1. Purpose:\nTo provide instruction for officers in the tactics and techniques of Military Police units.\n\n2. Scope:\na. Investigations.\nb. Domestic disturbances.\nc. Traffic control.\nd. Securi
