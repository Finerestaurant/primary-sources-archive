NND 86527 Top Secret [stamped over with SECRET]\nGENERAL HEADQUARTERS\nFAR EAST COMMAND\nOUTGOING MESSAGE GC-P BLP/sib/mrs 22 February 1948\n\nFROM: CINCFE\nTO: DEPT OF ARMY, CG USAFIK .. PRIORITY PRIORITY 220801Z\n\nCX 58800\n\nReference WX 95935 of 14 Feb. This radio in two parts.\n\nPart I. FOR CSGPO.\n1. USAFIK rad ZGCG 1497 repeated to D/A 16 Feb. However, reference Part III of WX 91520 and par 1b of ourad CX 58237, recent USAFIK recommendation based on 50,000 constabulary modifies estimated Advisory Group total from 14 off and 14 EM as stated in ZGCG 1497 to 25 off and 30 EM, in which CINCFE concurs.\n2. In view desirability of reducing military contingent to minimum stated in par 1, recommend entire Diplomatic Mission including Advisory Group be supported by State Dept civilian personnel without augmentation by Army service elements.\n\nPart II. For CG USAFIK. Desire you furnish time and deficiency estimates called for by par 2 reference radio for analysis by this Hq with respect to other programs. Assumed here that these queries apply to replacement and maintenance supplies as well as ammunition.\n\nOFFICIAL changed to SECRET by authority of DOD Dir 5200.9\nR. L. TAYLOR\nColonel, AGD, Adjutant General.\n\nClassification cancelled or changed to ______________ by authority of ______________ APPROVED BY:\nH. I. HARRIS, Brigadier General, GSC, Assistant Chief of Staff, G-3.\n\nCopies to:\nC-in-C\nC/S\nG-2\nG-3 (Return)\nG-4\n\nApproved by C/S 21 Feb 48\n\nCX 58800", "notes": [], "note": "기계 판독 참고 — Part 3 table reconstructed from OCR spanning pages 0085–0087, with headers implied (Col 1=Weapon/Ammo, Col 2=Total Reqmts, Col 3=Shortage). Page 0085 carrier line '12383 THE 1' at bottom appears to be teletype artifact left in place. 'SEKISUI JUSHI' and 'Judson_St. Korea DY —CWO USA' are photographic ruler/annotation artifacts and were discarded. / 제2부(Part II)의 참조 전문(WX 95935)과 주한미군사령부 전문(ZGCG 1497, WX 91520 등)의 구체적 내용은 본 전문 내에 포함되어 있지 않습니다. 문서 상단의 'Top Secret' 분류 도장 위에 'SECRET'로 정정된 흔적이 양쪽 페이지(0088, 0089)에서 모두 확인됩니다.", "warn": false, "pages": ["0084", "0085", "0086", "0087", "0088", "0089"]}, {"id": "D024", "order": 23, "date": "1948-02-16", "group": "D", "eyebrow": "D024 · D. 장래 정책·철군", "title": "남조선경비대 증강 및 육군부의 남한군 창설 계획 포기", "badge": "TOP SECRET", "list_right": "0090–0092", "meta": [{"k": "발신", "v": "G-3", "txt": true}, {"k": "수신", "v": "C/S", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "memorandum"}, {"k": "면", "v": "0090–0092 (3면)"}, {"k": "건명", "v": "Withdrawal from Korea", "txt": true}], "summary": "Augmentation of South Korean Constabulary and DA abandonment of South Korean Army program", "points": ["육군부(D/A)는 제안되었던 남한군 창설 계획을 공식적으로 포기하고, 극동군사령관(CINCFE)이 제안한 남조선경비대(Constabulary) 증강 방안에 동의하였다.", "주한미군사령관(USAFIK)은 미군 철수 시 경비대가 6개월간 운용될 수 있는 탄약 및 보급품 수준을 확보하는 문제와 관련하여 제24군단의 지원 능력을 검토해야 한다.", "워싱턴은 5만 명 규모의 경비대에 대한 군사 고문단(KMAG) 규모와 성격을 재검토 중이며, 극동군사령부는 국무부 산하의 민간 군수 지원 기관 설립을 권고할 예정이다.", "육군부의 남한군 프로그램 포기는 과도한 초기 구상에서 현실적인 경비대 증강으로의 정책 전환을 의미하며, 이는 한반도 내 미군 철수 계획과 직접적으로 연동되어 있다."], "primary": "[0090면]\n기밀해제\n권한 NND 846527\nTOP SECRET (최고비밀)\n\n극동군사령부\n연락전표\n(첨부된 서류에서 분리하지 말 것)\n문서번호: 제목: 남조선경비대 증강\n메모번호: 발신: G-3 수신: C/S (참모장) 일자: 1948년 2월 17일\n\n1. 2월 14일자 WX 95935에 대한 회신 무선 전문 초안이 승인 및 G-3 발송을 위해 여기에 첨부되어 송부됩니다. 이 초안은 D/A(육군부)가 남한군 창설 제안을 포기하고 현재 남조선경비대 증강을 위한 CINCFE(극동군총사령관)의 제안된 기초 방안에 동의했음을 나타냅니다.\n\nWX 95935는 6개월분의 탄약 및 교체·정비 보급품 비축 문제를 제기하고 있으며, 이는 제24(XXIV)군단의 능력에 관해 CG, USAFIK(주한미군사령관)에게 추가 질의가 필요합니다. 이는 이 문제가 또한 검토 중임을 시사합니다. 제안된 고문단에 관한 정보의 재송신 요청이 접수되었습니다. 50,000명 규모의 제안된 경비대 조직에 대한 고문단 관련 수정 추정치가 재송신 요청된 정보의 일자 이후에 CG, USAFIK로부터 접수되었으므로, D/A에 제공되어야 합니다.\n\n첨부 1건:\nWX 95935에 대한 제안된 무선 회신\n참고문서 및 관련 문서 포함\n\nw.H.M.\n\n1948년 2월 22일자로 승인 설정됨.\n\nTOP SECRET (최고비밀)\n\n[0091면]\n기밀해제:\n권한 NND86527\nTOP SECRET (최고비밀)\n\nBLP/sib\n200cl 1948년 2월 16일\n\n기록용 메모:\n\n제목: 남조선경비대 증강.\n\n1. 기본 문서: 1948년 2월 14일자 WX 95935, 내용:\n   a. CINCFE가 CX 57862(참고 a)에서 기술한 계획 기초 방안에 합리적인 탄약 비축 규정 포함을 조건으로 동의함.\n   b. 증강된 경비대가 USAFIK 비축 물자로 지원 가능한 기간 및 철수 시 6개월분의 탄약과 보급 수준을 확립하는 데 필요한 부족분을 충당하는 것이 FEC(극동군사령부) 프로그램에 미치는 영향에 대한 설명 요청.\n   c. 이 계획의 조기 승인을 검토 중임을 명시.\n   d. 12월 23일자 ZGCG 1497(참고 d)의 재송신 요청, 이는 1월 3일자 CX 57728(참고 e)로 D/A에 전달되었음.\n\n2. 참조: 별첨(Tab) 참조.\n\n3. 논의:\n   a. CX 57862(참고 a)에 대한 D/A의 동의는 D/A가 지나치게 야심 찬 남한군 프로그램을 포기하고 CINCFE가 강력히 지지해야 할 현실적인 접근 방식을 채택했음을 의미함.\n   b. 탄약 보급 문제는 제24군단 철수 시 6개월분의 비축 물자를 확립할 수 있는 USAFIK 및 FEC의 능력에 대해 기본 문서 2항의 질의에 답변함으로써 자동으로 해결될 것임.\n   c. (D/A가 제공한 보급 가정 하에서) FEC의 능력은 미미한 것으로 추산되었지만, 기본 문서는 증강이 실행될 경우 6개월분의 탄약 및 보급 수준 확립이 정비 및 교체 물자 비축을 가능하게 하기 위해 다른 잠정적 프로그램보다 우선될 수 있음을 암시한다는 점에 주목해야 함. 장비의 최초 지급은 USAFIK의 능력 범위 내에 있음; 6개월분의 보급 수준을 충족시키는 USAFIK의 능력은 알려지지 않음. G-4는 3월 1일(참고 I)까지 FEC의 6개월분 보급 수준 확립이 다른 프로그램에 미칠 영향을 기술할 준비가 되어 있을 것이지만, CG, USAFIK의 그의 능력에 대한 보고를 필요로 할 것임.\n\nTOP SECRET (최고비밀)\n\n[0092면]\n기밀해제:\n권한 NND 886527\nTOP SECRET (최고비밀)\n\n   d. ZGCG 1497(참고 d)의 재송신 요청은 제안된 프로그램에 대한 고문단 문제가 현재 검토 중임을 나타냄(참고 c). ZGCG 1497은 남한군 프로그램이 승인되지 않을 경우, 장교 1명과 사병 14명으로 구성된 소규모 경비대 고문단을 주한 미국 공사 또는 국무부 사절단 직원에 부속시킬 것을 권고했음. CX 58237(참고 1)(\"최고 책임자만 열람\" 전문에 대한 답신)은 경비대 증강 계획으로 인해 이 수치들이 수정될 수 있다고 밝힘.\n   e. CINCFE는 50,000명의 경비대를 권고했고, 고문단(장교 25명, 사병 30명)이 필요했지만, 이 고문단과 외교 사절단을 지원하기 위한 육군 군수 조직을 추가로 권고했음. 육군이 궁극적으로 그러한 지원을 제공해야 할 수도 있지만, 민간인화된 군수 지원 기관을 설립하는 것이 실행 불가능하다고 판단될 때까지 이 해결책을 제안해서는 안 됨. 그러한 지원 마련에 대한 기본 책임은 국무부에 맡겨야 하며, 국무부는 다른 해결책이 실현 가능하지 않을 경우 육군 기관 설립을 위해 D/A와 협상할 수 있음.\n   f. ZGCG 1497은 2월 16일에 재송신되었음.\n\n4. 지시된 조치:\n   a. 고문단에 관한 권고 사항의 수정을 D/A에 통보하고 국무부 산하의 민간인화된 군수 기관을 권고할 것.\n   b. 기본 문서에 대한 CINCFE 회신의 기초로서 제24군단의 탄약 및 보급 능력에 관한 USAFIK의 의견을 요청할 것.\n\n5. 권고: G-3는 첨부된 연락 메모에 서명하여 C/S에게 발송, 승인 및 G-3로의 반환을 요청하며, D/A 및 CG, USAFIK에 보낼 제안된 무선 전문 초안을 통해 4항에 개략된 조치를 이행할 것.\n\n6. 합의: 제안된 무선 전문에 대한 G-4의 합의는 G-3 승인 후, C/S로 발송되기 전에 초안에 대해 획득될 것임.\n\n7. 완료: 이로써 기본 문서에 대한 G-3의 조치는 완료되지만 본 사령부에서의 최종 조치는 아님. G-3 행정 부서는 이에 대한 G-4의 합의를 바탕으로 조치 변경을 수행할 것임.\n\n기록용 추가 메모: 1948년 2월 22일\n1948년 2월 21일 C/S 승인.\n계획 부서(Col Paige)에 통보됨.\n무선 전문 2월 22일 발송됨.\n이로써 G-3의 이 건 조치 완료.\n\n조치 담당 장교: Col Ham; G-3\n기안자: Paige\n\n/서명/ 2월 24일 09:00까지 승인 요망. 작성자 545 ??? (판독불가)\n\nTOP SECRET (최고비밀)", "secondary": "[0090면]\nDECLASSIFIED\nAuthority NND 846527\nTOP SECRET\n\nGENERAL HEADQUARTERS\nFAR EAST COMMAND\nCHECK SHEET\n(Do not remove from attached sheets)\nFile No: Subject: Augmentation of South Korean Constabulary Note No. From: G-3 To: C/S Date: 17 Feb 48\n\n1. Forwarded herewith for approval and return to G-3 for dispatch is a proposed radio reply to WX 95935/14 Feb, which indicates that D/A has abandoned the proposal to establish a South Korean Army and now concurs in CINCFE's proposed basis for augmenting the South Korean Constabulary.\n\nWX 95935 raises the question of establishment of a six-month stock of ammunition and replacement and maintenance supplies, which requires further queries to CG, USAFIK on XXIV Corps capabilities. It indicates that this subject is also under consideration. A request to retransmit information on a proposed advisory group has been received. Since revised estimates on the advisory group for the proposed constabulary organization of 50,000 have been received from CG, USAFIK subsequent to the date of the information requested for retransmission, D/A should be furnished.\n\n1 Incl:\nPrpsd rad reply to WX 95935 w/M/R and associated refs.\n\nw.H.M.\n\nSets app by as at oghs, 22 Feb.\n\nTOP SECRET\n\n[0091면]\nDECLASSIFIED:\nAuthority NND86527\nTOP SECRET\n\nBLP/sib 200cl 16 Feb 48 MEMO FOR RECORD:\n\nSUBJECT : Augmentation of South Korean Constabulary.\n\n1. BASIC: WX 95935/14 Feb, which:\na. Concurs in planning basis stated by CINCFE in CX 57862 (ref a) contingent on inclusion of provision for establishing reasonable ammunition reserve.\nb. Requests statement of length of time augmented constabulary could be supported by USAFIK stocks and effect on FEC programs of meeting deficiencies to extent necessary to establish a six-month ammo and supply level on withdrawal.\nc. States that consideration being given to early authorization of project.\nd. Requests retransmission of ZGCG 1497/23 Dec (ref d), which was passed to D/A by CX 57728/3 Jan (ref e).\n\n2. REFERENCES: See Tab.\n\n3. DISCUSSION:\na. D/A concurrence in CX 57862, (ref a) represents D/A abandonment of overly-ambitious South Korean Army program and adoption of a realistic approach which CINCFE should vigorously support.\nb. Question of ammo supply will automatically be answered by reply to queries in par 2 of Basic requesting statement of USAFIK and FEC capabilities to establish 6-month stocks on withdrawal of XXIV Corps.\nc. It should be noted that whereas FEC capabilities (under supply assumptions furnished by D/A) were estimated as being negligible, Basic infers that, if augmentation is implemented, establishment of a 6-month ammo and supply level may be given priority over other tentative programs to permit establishment of maintenance and replacement stocks. Initial issue of equipment is within USAFIK capabilities; USAFIK capabilities to meet 6-month supply level are not known. G-4 will be prepared by 1 March (ref I) to state effect which FEC establishment of 6-month supply level would have on other programs but will require a report from CG, USAFIK on his capabilities.\n\nTOP SECRET\n\n[0092면]\nDECLASSIFIED:\nAuthority NND 886527\nTOP SECRET\n\nd. Request for retransmission of ZGCG 1497 (ref d) indicates that question of Advisory Group for proposed program is now being considered (ref c). ZGCG 1497 recommended that in event South Korean Army program is not approved, a small Constabulary Advisory Group of 1 off and 14 EM be attached to staff of US minister or State Dept mission. CX 58237 (ref 1) (in answer to an \"eyes only\" message) stated that plan for augmentation of constabulary might result in revision of these figures.\ne. CINCFE recommended a 50,000 Constabulary, required Advisory Group (25 off, 30 EM) but further recommended an Army logistic organization to support this group and the diplomatic mission. While the Army may eventually be required to furnish such support, this solution should not be proposed until it has been determined that it is impracticable to establish a civilianized logistic support agency. Basic responsibility for arranging such support should be left with the State Dept, which can negotiate with D/A for establishment of an Army agency if no other solution appears practicable.\nf. ZGCG 1497 has been retransmitted, 16 Feb.\n\n4. INDICATED ACTION:\na. Advise D/A of revision in recommendations on Advisory Group and recommend civilianized logistic agency under State Dept.\nb. Request USAFIK comments on XXIV Corps ammo and supply capabilities as basis for CINCFE reply to Basic.\n\n5. RECOMMEND: G-3 initial attached C/N forwarding to C/S, for approval and return to G-3 for dispatch, a draft proposed radio to D/A and CG, USAFIK accomplishing action outlined in par 4.\n\n6. CONCURRENCES: G-4 concurrence in proposed radio will be obtained on draft after G-3 approval and prior to dispatch to C/S.\n\n7. COMPLETION: This completes G-3 action on Basic but is not final by this Hq. G-3 Admin to accomplish change of action based on G-4 concurrence hereon.\n\nSUPPLEMENTAL MEMO FOR RECORD: 22 February 1948 Approved by C/S, 21 February 1948 Plans (Col Paige) advised.\nRadio dispatched 22 February.\nThis completes G-3 action in this matter.\n\nAction Officer: Col Ham; G-3 By: Paige\n\n/s/ app by 0900, 24 Feb. By 545 ??? (not legible)\n\nTOP SECRET", "notes": [], "note": "기계 판독 참고 — OCR errors corrected: 'ZGG 1497' to 'ZGCG 1497' based on consistency within document. 'UMI' removed. 'Curad' in context 'Curad CX 58237' corrected to 'CX 58237' based on context. 'toe stablish' corrected to 'to establish'. 'BE 0-4' retained as illegible. Handwritten notes in the supplement section were partially illegible.", "warn": false, "pages": ["0090", "0091", "0092"]}, {"id": "D025", "order": 24, "date": "1948-02-15", "group": "D", "eyebrow": "D025 · D. 장래 정책·철군", "title": "주한미군 철수 계획 기준 및 조선 경비대 탄약 유지 문제", "badge": "SECRET", "list_right": "0093–0093", "meta": [{"k": "발신", "v": "CSGPO (Department of the Army)", "txt": true}, {"k": "수신", "v": "CINCFE", "txt": true}, {"k": "참조", "v": "CG USAFIK", "txt": true}, {"k": "전문번호", "v": "WX 95935"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0093–0093 (1면)"}, {"k": "건명", "v": "Withdrawal from Korea", "txt": true}], "summary": "Planning basis for withdrawal and ammunition sustainment for Korean Constabulary", "points": ["육군부는 주한미군 철수 시 조선 경비대에 무기뿐 아니라 충분한 탄약을 인계해야 한다는 조건으로 철수 계획 기준에 동의함.", "USAFIK 보급품만으로는 증강된 경비대를 6개월 이상 지원하기 어려울 것으로 예상되며, 극동사령부 차원의 추가 지원 소요를 질의함.", "육군부는 철수 계획 추진을 위한 조기 승인을 검토 중임."], "primary": "[0093면]\nDECLASSIFIED\n권한 NND86527\n극동군 총사령부 행정참모부 문서과\n전문 송수신소\n수신 전문 ECR\n1948년 2월 15일\n발신: CSGPO (육군부)\n수신: CINCFE (극동군 총사령관)\n참조: CG USAFIK (주한미군 사령관)\n전문번호: WX 95935\n\n등급 '제한' 취소 또는 '비밀'로 변경\n절취 X 85304 -- 오전 6시 48분 H. F CAO. Judson Si. LISA\n\n귀관 CX 58437 참조. 귀관 CX 5786-에 개요된 계획 기준은\n만족스러우며 다음 추가 요소를 포함하는 조건으로 동의함.\n즉, 철수 시 경비대를 유지할 수 있는 합리적 양의 탄약을\n인계하여, 철수 시 육군이 무기만 두고 탄약은 두지 않았다는\n비판을 차단할 것.\n\nCX 57862에 명시된 보급 가정 하에, 증강된 경비대가\n현 경비대 소모율을 가정할 때 USAFIK 보급품으로\n얼마나 오래 지원될 수 있는가? USAFIK 보급품이 상기\n6개월간 경비대를 지원하기에 불충분하다고 가정할 때,\nFEC (극동사령부) 자원으로부터 얼마의 지원이 필요하며\n그 소요가 다른 계획들에 미칠 영향은 무엇인가?\n\n가능한 한 빠른 시일 내에 이 계획을 추진하도록 승인하는\n것의 바람직함이 검토 중임. 신규 사항. 3항 W 91520에\n회신하는 CG USAFIK ZGCG 1497을 재송신 바람. 등급.\n\n개정 2 (1948년 2월 24일) 권한\n조치: G-4\n정보: 총사령관, 참모장, G-2, G-3\n\n07613 우선순위 TOO: MCN: 70965 141522 7\n\n\"의역 불필요\"\n제51항 1 및 60항 a에 따라 비밀 서신 취급\n\n비밀\n본 전문의 축어 평문 취급 및 전송은 1946년 3월 6일자 육군규정 380-5,\n제16-C, 18-E, 53-A, 53-D (1) (2) (3), 및 60-A (1) (2) (3) (4)항의\n규정에 따라 동일 등급의 서신으로서 육군부에 의해 승인되었음. 사본 번호 20\n16-50735-1\n16일 그에게 전달됨 7월", "secondary": "[0093면]\nDECLASSIFIED\nAuthority NND86527 GENERAL HEADQUARTERS, FAR EAST COMMAND ADJUTANT GENERAL'S OFFICE IND WPS\nRADIO AND CABLE CENTER\nINCOMING MESSAGE ECR\n15 Feb 48\nFROM : CSGPO\nTO : CINCFE\nINFO : CG USAFIK\nNR : WX 95935 Restricted Classification cancelled or changed to Secret Cut X 85304 -- 6 am 48 H. F CAO. Judson Si. LISA Refers your CX 58437. Planning basis outlined your CX 5786- satisfactory and concurred in subject to inclusion of additional factor of transferring upon withdrawal a reasonable quantity of ammunition to sustain constabulary and preclude criticism that upon withdrawal army left weapons but no ammunition.\n\nUnder supply assumptions stated CX 57862 how long could the augmented constabulary be supported by USAFIK stocks assuming existing constabulary consumption rates? Assuming USAFIK stocks inadequate to support constabulary over a 6 months period as above how much assistance is required from FEC sources and what would be effect on other programs to that requirement?\n\nDesirability of issuing authorization to proceed this implementation at earliest possible date under consideration. New subject. Please repeat CG USAFIK ZGCG 1497 which replies to Part 3 W 91520. Classification.\n\nREV ISE 2 (24 Feb 48) authority ACTION : G-4 INFORMATION: COMMANDER IN CHIEF, CHIEF OF STAFF, G-2, G-3 07613 PRIORITY TOO: MCN: 70965 141522 7 \"Paraphrase not requir* per para 51 1 and 60 a SECRET FOr STORT correspondence\n\nSECRET\nCorrect Handling and transmission of literal plain text of this message as correspond in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) ence of the same classification has been authorized by the War Department COPY No. 20\n(2) (3), and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946. 16-50735-1 Ts to him on the 16 \"Jul", "notes": [], "note": "기계 판독 참고 — OCR 오류로 인해 일부 발신자명(H. F CAO. Judson Si. LISA)과 원본 전문번호(CX 5786-)의 마지막 자리가 불확실함. 전문의 'Paraphrase not requir' 및 'FOr STORT' 부분도 OCR 절단으로 추정됨.", "warn": false, "pages": ["0093"]}, {"id": "D026", "order": 25, "date": "1947-12-03", "group": "D", "eyebrow": "D026 · D. 장래 정책·철군", "title": "주한미군 철수에 대비한 남조선 경비대 증강 계획 및 탄약 보급 문제", "badge": "SECRET", "list_right": "0094–0097", "meta": [{"k": "발신", "v": "Department of the Army (CSGPO)", "txt": true}, {"k": "수신", "v": "CINCFE", "txt": true}, {"k": "참조", "v": "CG USAFIK", "txt": true}, {"k": "전문번호", "v": "WX 95935"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0094–0097 (4면)"}, {"k": "건명", "v": "Withdrawal from Korea", "txt": true}], "summary": "Planning for augmentation of South Korean Constabulary and supply of ammunition upon US withdrawal", "points": ["육군부는 CINCFE의 남조선 경비대 증강 계획 기준(CX 57862)에 동의하면서도, 철수 시 경비대용 탄약 확보 조항을 포함할 것을 조건으로 요구했다.", "CINCFE는 경비대 증강의 최대 실현 가능 규모로 50,000명을 제시했으며, 그 근거로 보급 한계, 훈련 자원 부족, 유능한 한국인 지휘관 부재, 언어 장벽 등을 들었다.", "경비대 증강은 1차 7,300명(A일), 2차 7,300명(A+60일), 3차 10,400명(A+105일)의 3단계로 나누어 점진적으로 편성될 계획이었다.", "초기에는 일본제 무기와 주한미군 잉여 장비로 무장하고, 점차 미군 장비로 대체할 계획이었으며, 철수 후 남을 군사 고문단은 소규모로 제안되었다."], "primary": "[0094면]\n해제\n권한 NND8$6527\n\n극동군 총사령부(GHQ/FEC)\n부관실(Adjutant General's Office)\n무선·전보 센터\n\n수신 전문\n\n발신: 육군부 통신실(CSGPO)\n수신: 극동군 사령관(CINCFE)\n정보: 주한 미군 사령관(CG USAFIK)\n번호: WX 95935\n\n귀 전문 CX 58437 참조. 귀 CX 57862에 개괄된 계획 기준은 만족스럽고 동의하나, 철수 시 경비대 유지를 위해 합리적인 양의 탄약을 이전하여, 철수 후 육군이 무기만 남기고 탄약을 남기지 않았다는 비판을 배제하도록 한다는 추가 요소를 포함한다는 조건부임.\n\nCX 57862에 명시된 보급 가정 하에, 현 경비대 소비율을 가정할 때 증강된 경비대를 주한 미군 재고로 얼마나 오래 지원할 수 있는가? 주한 미군 재고가 위와 같이 수개월 기간 동안 경비대를 지원하기에 부족하다고 가정할 때, 극동군(FEC) 출처로부터 얼마나 많은 지원이 필요하며, 그 요구를 충족시키기 위해 다른 계획에 어떤 영향을 미치겠는가?\n\n가능한 한 빠른 시일 내에 시행하는 것을 고려 중임. 이 새로운 사안에 대해 진행 허가를 발부하는 것이 바람직함. 본부 전문 Part 3 W 91520에 대한 회신인 CG USAFIK ZOCG 1497을 재송신 바람.\n\n조치: G-3\n정보: 총사령관, 참모총장, G-2, G-4\n\n대외비(Top Secret) 통신 511항 및 60a항에 의거\n(220801)\n비밀 등급 부여 사본 — 1946년 3월 6일자 AR 380-5의 16-C, 18-E, 53-A, 53-D (1) (2) (3) 및 60-A (1) (2) (3) (4)항 규정에 따라 동일 등급의 전문 평문 취급 및 전송이 육군부에 의해 승인되었음.\n\n[0095면]\n해제\n권한 NND8X6527\n\n대외비(TOP SECRET)\n\nG-3 비망록 첨부 문서, 1948년 2월 16일자\n제목: \"남조선 경비대 증강\"\n기본: WX 95935 / 2월 14일, 비망록 1항에 요약.\n\n추가 참조:\na. CX 57862/1948년 1월 9일, 남한을 위한 실현 가능한 군사 계획에 대한 CINCFE의 구상을 수립하고, CG USAFIK에게 현 경비대의 단계적 증강을 위한 개요 계획을 요청함.\nb. CX 58437/1948년 2월 6일, 50,000명으로의 증원을 현 경비대의 최대 실현 가능 증강으로 간주할 것을 권고하고, 상세 계획 확정을 위한 추가 조치 이전에 CX 57862(참조 a)에 명시된 잠정 계획 기준에 대한 육군부의 확인을 요청함.\nc. W 91520/1947년 12월 3일, 제3부에서 한국으로부터 XXIV 군단 철수 이후 군사 고문단 또는 임무단의 구성 및 기능에 대한 CINCFE의 견해를 요청함. (첨부 안 됨.)\n(1) 100,000명 규모의 남한군 창설.\n(2) 남한군이 창설되지 않을 경우의 남조선 경비대를 위함. 이 후자의 조건 하에, CG USAFIK는 장교 1명과 사병 14명으로 구성된 군사 고문단을 권고함 (첨부 안 됨).\nd. CX 57728/1948년 1월 3일\ne. CX 58237, \"직접 열람\" 전문으로 제공된 남한 관련 제안 정책 문서의 군사적 측면에 대한 CINCFE의 논평을 제공함. 이 무전에서 CINCFE는 외교 사절단의 군사 부문에 경비대를 위한 소규모 고문단을 포함하는 데 동의하였고, 경비대 증강 제안을 고려할 때 USAFIK의 장교 14명 및 사병 14명 추정치의 일부 수정이 필요할 수 있으나 어떤 경우에도 그 그룹은 소규모일 것이라고 밝힘.\nf. 주한미군사령부 서신, 1948년 2월 3일자, 파일 TEGCT 322, \"남조선 경비대\", 첨부 2호, 50,000명 규모의 남조선 경비대 편성·장비표(T/O&E) 제안과 XXIV 군단 철수 후 경비대를 지도하고 지원할 고문단 제안을 정보 제공 목적으로 전달함.\n\n대외비(TOP SECRET)\n\n[0096면]\n해제\n권한 NND 8X6527\n\n극동군 총사령부(GHQ/FEC)\n통신대(SIGNAL CORPS) 전문\n\n1948년 2월 6일\n\n발신: 극동군 사령관(CINCFE)\n수신: 육군부\n정보: 주한 미군 사령관(CG USAFIK)\n\n(CX 58437) SCrO, 한국 경비대 관련 WARX 93049 제2부 및 CX 57862 참조.\n\n1. WARX 93049 제2부 관련, 계획 수립 목적상 50,000명으로의 증원을 현 경비대의 최대 실현 가능 증강으로 간주할 것을 권고함. 권고의 근거는 다음과 같음:\na. CX 57862에 명시된 요구사항과 가정을 적용하여, CG, USAFIK는 50,000명으로의 증원이 최대의 바람직하고 실현 가능한 증강이라고 간주함.\nb. WARX 93049 및 WAR 91520에 명시된 보급 가정 하에, 균형 잡힌 장비 계획에 기여할 수 있는 극동군의 능력(XXIV 군단의 능력을 넘어서는)은 무시할 만할 것으로 예상됨.\nc. 증강에 적용되는 요소는 보급에만 국한되지 않고 훈련 자원, 유능한 한국인 지휘관의 확보, 언어 장벽, 그리고 XXIV 군단의 감소된 역량을 포함함.\n\n2. CX 57862에서 요구된 USAFIK 개요 계획은 다음과 같이 요약됨:\na. 현 경비대의 병력을 2배로 증원하고 [판독불가] 및 각각 3개 연대(연대 병력 2,840명)로 구성된 2개 여단과 필요한 지원 부대로 편성함. 모든 장비는 USAFIK 자원에서 제공함(초기에는 일본제 무기와 1948년 12월 31일자 USAFIK 요구 기준 잉여 미군 장비를 지급하고, 추후 USAFIK 철수 시 장비가 가용해지는 대로 일본제 무기를 미군 장비로 대체함). 증강은 다음과 같은 단계적 활성화를 통해 달성함: 1차 증원(7,300명)은 권한 수신 즉시 (A일); 2차 증원(7,300명)은 A+60일; 3차 증원(10,400명)은 A+105일.\n\n3. 상세 계획 확정을 위한 추가 조치 이전에 CX 57862에 명시된 잠정 계획 기준에 대한 육군부의 확인을 요청함.\n\n공식:\n서명/R. M. 레비(R. M. Levy)\n대령, 부관감실(AGD)\n부관감(Adjutant General)\n\n승인자\n서명/워드 H. 매리스(Ward H. Maris)\n준장, 참모단(GSC)\n참모차장, G-3\n\n배포처:\n총사령관(C-in-C)\n참모총장 경유, 1948년 2월 6일 승인.\n\n(회송)\n\n1946년 3월 6일자 AR 380-5, 16-C, 18-E, 53-A 및 60-A (1) (2) (3) (4)항 규정에 따라 동일 등급의 전문 평문 취급 및 전송이 육군부에 의해 승인되었음.\n\n분류 취소 또는 [판독불가]로 변경됨, 권한 서명___", "secondary": "[0094면]\nDECLASSIFIED\nAuthority NND8$6527 GENERAL HEADQUARTERS, FAR EAST COMMAND\nADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\n\nINCOMING MESSAGE\n\nFROM : CSGPO\nTO : CINCFE\nINFO : CG USAFIK\nNR : WX 95935 Refers your CX 58437. Planning basis outlined your CX 57862 satisfactory and concurred in subject to inclusion of additional factor of transferring upon withdrawal a reasonable quantity of ammunition to sustain constabulary and preclude criticism that upon withdrawal army left weapons no ammunition.\n\nUnder supply assumptions stated CX 57862 how long could the augmented constabulary be supported by USAFIK stocks assuming existing constabulary consumption rates? Assuming USAFIK stocks inadequate to support constabulary over a months period as above how much assistance is required from FEC sources and what would be effect on other programs to meet that requirement?\n\nImplementation at earliest possible date under consideration. Desirability of issuing authorization to proceed this New subject. Please repeat CG USAFIK ZOCG 1497 which replies to Part 3 W 91520.\n\nACTION : G-3 INFORMATION : COMMANDER IN CHIEF, CHIEF OF STAFF, G-2, G-4 Top Secret correspondence per para 511 and 60 a (220801)\nRated Copy SECRET BY exence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) (2) (3), and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946.\n\n[0095면]\nDECLASSIFIED\nAuthority NND8X6527\n\nTOP SECRET\n\nTAB TO G-3 M/R DATED 16 FEBRUARY\nSUBJ, \"AUGMENTATION OF SOUTH KOREAN CONSTABULARY.\" BASIC: WX 95935/14 Feb, summarized in par 1 of M/R.\n\nADDITIONAL REFERENCES:\na. CX 57862/9 Jan 48, which establishes CINCFE concept of feasible military program for South Korea and requests from CG, USAFIK outline plan for phased augmentation of present Constabulary.\nb. CX 58437/6 Feb 48, which recommends that increase to 50,000 be considered maximum feasible augmentation of present Constabulary and requests D/A confirmation of tentative planning basis set forth in CX 57862 (ref a) prior to further action to finalize detailed plan.\nc. W 91520/3 Dec 47, which in Part 3 requests CINCFE views on the composition and functions of a Military Advisory Group or mission subsequent to withdrawal of XXIV Corps from South Korea. (Not tabbed.)\n(1) Establishment of South Korean Army of 100,000.\n(2) For South Korean Constabulary in event no South Korean Army is established. Under this latter condition, CG USAFIK recommended that 1 officers and 14 EM constitute the Military Advisory Group (not tabbed).\nd. CX 57728/3 Jan 48\ne. CX 58237, which furnishes CINCFE comments on military aspects of proposed policy paper on South Korea furnished by \"eyes only\" message. In this radio CINCFE concurred in including small advisory group for constabulary in military section of diplomatic mission, and stated that some modification of USAFIK estimate of 14 officers and 14 EM might be necessary in view of proposal to augment constabulary but that in any event the group would be small.\nf. Incl 2 to ltr, Hq, USAFIK, dated 3 Feb 48, file TEGCT 322, \"South Korean Constabulary,\" which forwards for information a proposed T/O&E for a South Korean Constabulary of 50,000 and a proposed advisory group to advise and assist Constabulary after withdrawal of XXIV Corps.\n\nTOP SECRET\n\n[0096면]\nDECLASSIFIED\nAuthority NND 8X6527\n\nGENERAL HEADQUARTERS\nFAR EAST COMMAND\nSIGNAL CORPS MESSAGE\n\n6 FEBRUARY 1948\n\nFROM : CINCFE\nTO : DEPT OF ARMY\nINFO: CG USAFIK (CX 58437) For SCrO, Korean Constabulary reference Part 2 WARX 93049 and CX 57862.\n\n1. Ref Part 2 WARX 93049 it is recommended that for planning purposes increase to 50,000 be considered maximum feasible augmentation of present constabulary. Basis for recommendation as follows:\na. Applying requirements and assumptions stated in CX 57862, CG, USAFIK considers increase to 50,000 to be maximum desirable and feasible augmentation.\nb. Under supply assumptions stated in WARX 93049 and WAR 91520, it is expected that FEC capabilities (beyond those of XXIV Corps) to contribute to a balanced equipment program will be negligible.\nc. Factors applying to augmentation not limited entirely to supply but include training resources, availability of competent Korean leadership, language barrier, and diminished capabilities of XXIV Corps.\n\n2. USAFIK outline plan called for in CX 57862 summarized as follows:\na. Double strength of present constabulary and organize into [illegible] and bi brigades each of 3 regiments (regimental strength 2840) plus necessary service troops; all equipment to be furnished from USAFIK resources (initially furnishing Jap weapons and U.S. equipment surplus to USAFIK\n\n[0097면]\n31 Dec 48 requirements, with later replacement of Jap weapons by U.S. arms as equipment becomes available due to withdrawal of USAFIK). Augmentation to be accomplished by phased activations as follows: 1st increment (7300) immediately on receipt of authority (A-day); 2d increment (7300) A plus 60; 3d increment (10,400) A plus 105.\n\n3. Request Dept of Army confirmation of tentative planning basis set forth in CX 57862 prior to further action to finalize detailed plans.\n\nOFFICIAL:\ns/R. M. LEVY Colonel, AGD Adjutant General\n\nAPPROVED BY\ns/WARD H. MARIS Brigadier General, GSC Assistant Chief of Staff, G-3 Copies to:\nC-in-C Appr. \"by C/s 6 Feb 48.\n\n(Return)\n\nHandling and transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946.\n\nClassification cancelled or changed to [illegible] authority by___", "notes": [], "note": "기계 판독 참고 — Page 0094 OCR quality was poor with many scanning artifacts (Sekisui ruler marks, stray dates like '15 Feb 48', edge text). Some text reconstructed from context. Page 0096, paragraph 2a had an illegible fragment due to original document creasing/scanning shadow that could not be recovered; marked as [illegible].", "warn": false, "pages": ["0094", "0095", "0096", "0097"]}, {"id": "D027", "order": 26, "date": "1948-02-04", "group": "A", "eyebrow": "D027 · A. 조선경비대 무장·증강", "title": "남조선경비대 증강 — 계획 기준 및 실현 가능성 검토", "badge": "TOP SECRET", "list_right": "0098–0103", "meta": [{"k": "발신", "v": "G-3 Section, GHQ/FEC", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "CX 58437 (related cable)"}, {"k": "종류", "v": "memorandum"}, {"k": "면", "v": "0098–0103 (6면)"}, {"k": "건명", "v": "Augmentation of South Korean Constabulary", "txt": true}], "summary": "Augmentation of South Korean Constabulary — planning basis and feasibility", "points": ["극동군총사령관(CINCFE)은 현 남조선경비대의 최대 증강 가능 규모를 50,000명으로 권고하고 있으나, 이는 보급 능력보다 훈련 자원, 한국인 지휘관 부족, 언어 장벽 등 비물자적 요인에 근거한 한계치이다.", "주한미군사령관은 5개 여단 규모의 50,000명 증강 개요 계획을 제시했으나, 극동군사령부(GHQ/FEC) G-3는 세부 수치의 불일치를 이유로 계획 원문 대신 요약본을 육군부에 제공해야 한다고 판단하고 있다.", "육군부의 보급 가정 하에서도 극동군사령부가 제24군단 능력 외에 추가로 제공할 수 있는 장비는 미미할 것으로 평가되며, 증강 계획은 제24군단 철수 결정과 연계되어 있다.", "일본제 무기로 훈련된 경비대의 증강 계획을 문제 삼을 근거는 없다고 평가했다.", "G-3는 육군성에 현 계획 현황을 알리고 세부 계획 전 기초 승인을 요청할 예정이었다.", "1947년 12월 육군성 전문은 현 미군 병력 규모 하에서는 남조선 경비대의 부분적 증강만이 유일한 실행 가능 프로그램이라고 결론지었다.", "합참은 1946년 1월 이미 극동군사령관에게 한국 국립 경찰의 무장을 승인한 바 있으며, 이 정책이 남조선 경비대 무장 정책의 기반이 되었다."], "primary": "[0098면]\n비밀해제\n권한 NND 886527\n2급비밀(TOP SECRET)\n\n극동군총사령부(GHQ/FEC)\n\n비밀 통신대 전문\n\n발신: 극동군총사령관(CINCFE)\n수신: 육군부(DEPT OF ARMY)\n참조: 주한미군사령관(CG USAFIK)\n\n(F CX 58437) CSGPO용. 한국 경비대 관련 참조: WARX 93049 Part 2 및 CX 57862.\n\n1. 참조 WARX 93049 Part 2와 관련하여, 계획 목적상 현 경비대의 최대 증강 가능 규모를 50,000명으로 산정할 것을 권고함. 권고 근거는 다음과 같음:\n\na. CX 57862에 명시된 요구조건과 가정사항을 적용한 결과, 주한미군사령관은 50,000명으로의 증강이 최대의 바람직하고 실현 가능한 증강이라고 판단함.\n\nb. WARX 93049 및 WAR 91520에 명시된 보급 가정에 따르면, 균형 잡힌 장비 프로그램에 기여할 수 있는 극동군사령부의 능력(제24군단의 능력을 넘어서는 부분)은 미미할 것으로 예상됨.\n\nc. 증강에 영향을 미치는 요소는 보급에만 국한되지 않으며, 훈련 자원, 유능한 한국인 지휘관 확보 가능성, 언어 장벽, 그리고 제24군단의 감소된 역량을 포함함.\n\n2. CX 57862에서 요청한 주한미군사령부(USAFIK) 개요 계획을 다음과 같이 요약함:\n\na. 현 경비대 병력을 2배로 증강하여 각각 3개 연대(연대 병력 2,840명)로 구성된 5개 여단과 필요 지원 부대로 편성함.\n\n[0099면]\n비밀해제\n권한 NND 886527\n2급비밀(TOP SECRET)\n\n모든 장비는 주한미군사령부 자원에서 조달함 (초기에는 일본제 무기 및 주한미군사령부의 1948년 12월 31일 기준 잉여 미군 장비를 지급하고, 주한미군사령부 철수에 따라 장비 확보가 가능해지면 추후 일본제 무기를 미군 장비로 대체함).\n\nb. 증강은 다음과 같은 단계적 창설로 달성함: 1차 증원(7,300명)은 승인 접수 즉시(D-일); 2차 증원(7,300명)은 D+60일; 3차 증원(28,000명)은 D+105일.\n\n3. 상세 계획을 최종 확정하는 추가 조치 이전에 육군부가 CX 57862에 제시된 잠정 계획 기준을 확인해줄 것을 요청함.\n\n공식 서명:\nR. M. 레비(R. M. LEVY)\n부관감(Adjutant General)\n\n승인자:\n워드 H. 매리스(WARD H. MARIS)\n대령, 부관감실(AGD)\n참모차장(G-3)\n준장, 참모단(GSC)\n\n배포처:\n총사령관(C-in-C)\n참모장(C/S)\n정보참모(G-2)\n작전참모(G-3, 반환)\n군수참모(G-4)\n부관처(AG)\n\n2급비밀(TOP SECRET)\n\n[0100면]\n비밀해제\n권한 NND 886527\n2급비밀(TOP SECRET)\n\n1948년 2월 4일\n\n기록용 내부 메모:\n\n제목: 남조선경비대 증강.\n\n1. 근거: WARX 93049/12월 26일자, Part 2에서 현 경비대의 최대 증강 가능 규모에 대한 극동군총사령관의 권고를 요청함. \"G-3 파일 사본\"\n\n2. 참조: 첨부 탭 4 참조.\n\n3. 논의:\n\na. 제안된 200,000명 규모의 남한군에 대한 기본 편성 요구사항이 워싱턴으로 송부되었을 때, 극동군총사령관은 육군부(참조 a)에 해당 프로그램이 실현 불가능하며, 극동군사령부의 예상 역량 내에서 가능한 유일한 프로그램은 현 경비대의 일부 증강뿐이라고 통보하였음. 이 진술은 확인된 보급 역량 부족뿐만 아니라, 감소된 제24군단 전력, 언어 장벽, 훈련의 어려움, 그리고 제24군단 철수 이후 한국 내 대규모 미군 개입을 지원할 수 없는 극동군사령부의 무능력과 같은 요소들에 근거한 것이었음. 동시에, 극동군총사령관은 완전한 남한군 프로그램에 대한 확실한 보급 능력 결정을 위해 육군부가 보급 가정사항을 명확히 해줄 것을 요구하였음.\n\nb. 근거 문서(기본)는 요구된 가정사항을 제공하며, 완전한 프로그램에 대한 확실한 보급 능력 정보가 여전히 필요함을 암시함. 그러나 원래 계획의 실현 불가능성에 대한 극동군총사령관의 진술(참조 a)을 인정하고, 남조선경비대 증강을 위한 실현 가능한 프로그램에 대한 구체적인 권고를 요청함.\n\nc. 이에 극동군총사령관은 주한미군사령관(참조 b)에게 본 사령부가 \"실현 가능성\" 판단 기준으로 수립한 특정 요구사항 및 가정에 기반한 권고와 개요 계획을 요청하였음. 주요 가정사항은 제24군단의 보급 능력을 보강할 수 있는 극동군사령부의 능력이 미미할 것이라는 것이었음.\n\nd. 주한미군사령관은 (참조 g에서) 현 25,000명의 경비대를 총 50,000명으로 증강(25,000명 증원)할 것을 권고하고, 증강을 달성하기 위한 개요 계획을 제시함. 참조 a에서 육군부가 제공한 보급 가정은, 기존에 승인된 25,000명을 초과하는 무장 병력 증가는 제24군단 철수에 대한 확고한 결정을 조건으로 한다는 종전에 발표된 정책에 따라, 증강 계획을 위한 제24군단의 T/O&E(편제 및 장비표) 장비 활용 가능성을 명시하고 있음에 유의해야 함.\n\n[0101면]\n비밀해제\n권한 NND 886527\n2급비밀(TOP SECRET)\n\ne. G-3은 제24군단 참모장과의 전화 통화(1월 31일 11:30)에서, 호지(Hodge) 장군이 참조 b에서 제공된 요구사항과 가정사항에 근거할 때 참조 g에서 권고된 증강이 \"최대의 실현 가능하고 바람직한\" 것이라고 간주하고 있음을 확인하였음.\n\nf. 처분 대상 물자 및 잉여 물자(참조 a 및 f)로 현 25,000명 규모의 경비대를 미군 무기 및 장비로 무장시키는 승인된 프로그램이 현재 진행 중임. 제24군단의 T/O&E 승인 장비(승인 전력 47,000명용)가 25,000명 증원에 필요한 물량을 상당히 초과하며 증강 계획에 모두 활용 가능하므로, 주한미군사령관이 상한선을 50,000명으로 권고한 것은 장비 이외의 요소에 기반한 것임이 명백함. 이는 앞서 언급한 전화 통화(e항) 중 \"실현 가능한(feasible)\"이라는 단어에 \"바람직한(and desirable)\"이라는 표현을 추가해 달라고 주한미군사령부가 요청함으로써 확인됨.\n\ng. 주한미군사령관에게 이 개요 계획(참조 g)을 더 정교화하도록 요구하기 전에, 육군부는 해당 개요 계획이 수립된 기준을 확인해 주어야 함. 만일 육군부가 증강 프로그램이 오직 확실한 보급 능력만을 기준으로 하여 다른 요소들을 전혀 고려하지 않기를 원한다면(이는 비현실적이고 실행 불가능함), 추가 계획 수립은 3월 1일 이후로 연기되어야 함. (참조 a에서 육군부에 지적했듯이, 그 날짜 전까지는 확실한 극동군사령부의 보급 능력을 판단할 수 없음.) 그러나 가능성이 높아 보이듯이, 육군부가 \"실현 가능성\"에 대한 극동군총사령관의 권고가 모든 관련 요소에 근거하기를 원한다면, 호지 장군이 권고한 50,000명은 그의 현지 능력을 초과하는 추가 장비 확보 가능성에 의해 반드시 수정되지는 않을 것임.\n\nh. 실제로, 참조 a에서 육군부가 제공한 보급 가정에 기초하여 한국 내 일반 보급 능력을 극동군사령부가 검토한 결과, 특정 품목에 대해서는 일정 추가 물량이 있을 수 있으나, 표준 장비 목록상 대부분의 품목에 대한 극동군사령부의 능력(제24군단 능력 이외)은 전무할 것임이 밝혀짐.\n\ni. 주한미군사령관의 개요 계획(참조 g)은 전반적인 의도와 범위는 명확하나, 완전히 일치하지 않는 특정 수치와 전력을 도입하여 육군부에 전달될 경우 문제를 혼란스럽게 만들 뿐임. 개요 계획에 대한 승인을 확보하기 위해 참조 g의 본문 대신 요약본을 육군부에 제공해야 함.\n\nj. 참조 g에 언급된 일본제 무기에 사용될 한국 내 탄약 확보 가능성 문제가 조사되었으며, 주한미군사령부가 아직도 한국 내 동굴에 보관 중인 불특정 다수의 일본제 탄약에 접근할 수 있는 것으로 보임. 일본제 무기는 오직 일시적 방편으로서, 제24군단 철수 이전 기간 동안만 지급될 것이므로,\n\n2급비밀(TOP SECRET)\n\n[0102면]\n기밀해제\n해제권한 NND8X6527\n2급비밀(TOP SECRET)\n\n현재 경비대는 애초에 일본제 무기로 장비 및 훈련을 받았으므로, 이를 근거로 하지(Hodge) 장군의 계획에 의문을 제기할 근거는 없는 것으로 보인다.\n\n지시된 조치: 참고 g 및 기본문서 제2부에 대한 회신으로서, 현시점의 계획 수립 현황을 육군성(D/A)에 통보하고 세부 계획을 수립하기 전에 계획의 기초에 대한 승인을 요청하는 것임.\n\n조정: 제안된 조치는 G-4(참고 h 참조)와 조정 완료되었다.\n\n완료: 이것으로 기본문서 제2부(WARX 93049/12월 27일)에 대한 G-3 조치가 완료됨. 제1부에 대한 조치 완료 책임은 G-4에 있으며, 해당 부서에 기본문서 조치가 부과됨. 본 건에 대한 향후 G-3 조치는 제안된 전문에 대한 육군성의 회신에 기초할 것임.\n\n본 정보/요청서(I/R)는 1월 23일자 ZGCT 74(참고 g)에 대한 G-3 조치도 완료함.\n\n[0103면]\n기밀해제\n해제권한 NND8X6527\n2급비밀(TOP SECRET)\n\n별첨 A\n정보/요청서(I/R) 첨부\n\n참고문헌:\n\na. 1947년 12월 8일자 CX 57200, 제안된 남조선군에 대해 논평하며, 예정된 주한미군 병력 하에서는 \"현(남조선) 경비대의 일부 증강 외에는 어떤 계획도 실현 불가능할 것\"이라고 진술.\n\nb. 1948년 1월 9일자 CX 57862, 주한미군사령관에게 해당 경비대의 소요 목록과 특정 보급 전제조건에 기초하여 경비대의 단계적 증강 개요 계획을 제출하도록 지시.\n\nc. 참고 b에서 제공된 소요 및 전제조건에 기초한 경비대 증강 계통도.\n\nd. 1947년 12월 3일자 WAR 91520, 제24(XXIV)군단의 전체 T/O&E 장비가 가용한 것으로 간주된다는 전제를 포함하여 남조선군 계획에 대한 기본 보급 전제조건을 설정.\n\ne. 1947년 11월 5일자 CX. 56612, 주한미군사령부가 무기 종류 및 인출 재고량에 대한 제한을 두어 현 경비대를 무장시키는 것을 승인.\n\nf. 1월 14일자 CX 57956, 주한미군사령부에 경비대용 장비(극동군사령부 내)의 가용성을 통보하고 (주한미군사령부가) 제공할 일자를 요청.\n\ng. 1948년 1월 28일자 CX. 58237, 남조선 군대 지원을 위한 극동군사령부의 군수 능력 판단을 위해 취해진 조치를 육군성에 통보하고, (제24군단 능력 이외의) 극동군사령부 자산은 무시할 수준일 것이라고 진술.\n\nh. (참고 e에 언급된 추가 참고문헌이나 관련 없음)\n\ni. 1946년 1월 11일자 WX 92187, 합참이 극동군사령관(옛 CINCAFPAC)에게 한국 국립 경찰 무장을 승인함. 이 정책은 참고문헌 e에서 육군성이 언급한 것임.\n\nj. 현 경비대에 보급할 장비 소요 및 청구서를 송부한 1월 18일자 주한미군사령부 서한 (파일 TFGDS 475).\n\n2급비밀(TOP SECRET)", "secondary": "[0098면]\nDECLASSIFIED\nAuthority NND 886527\nTOP SECRET\n\nGENERAL HEADQUARTERS\nFAR EAST COMMAND\n\nSECRET SIGNAL CORPS MESSAGE\n\nFROM: CINCFE\nTO: DEPT OF ARMY\nINFO: CG USAFIK (F CX 58437) For CSGPO. Korean Constabulary reference Part 2 WARX 93049 and CX 57862.\n\n1. Ref Part 2 WARX 93049 it is recommended that for planning purposes increase to 50,000 be considered maximum feasible augmentation of present constabulary. Basis for recommendation as follows:\n\na. Applying requirements and assumptions stated in CX 57862, CG, USAFIK considers increase to 50,000 to be maximum desirable and feasible augmentation.\n\nb. Under supply assumptions stated in WARX 93049 and WAR 91520, it is expected that FEC capabilities (beyond those of XXIV Corps) to contribute to a balanced equipment program will be negligible.\n\nc. Factors applying to augmentation not limited entirely to supply but include training resources, availability of competent Korean leadership, language barrier, and diminished capabilities of XXIV Corps.\n\n2. USAFIK outline plan called for in CX 57862 summarized as follows:\n\na. Double strength of present constabulary and organize into 5 brigades each of 3 regiments (regimental strength 2840) plus necessary\n\n[0099면]\nDECLASSIFIED\nAuthority NND 886527\nTOP SECRET\n\nservice troops; all equipment to be furnished from USAFIK resources (initially furnishing Jap weapons and U.S. equipment surplus to USAFIK 31 Dec 48 requirements, with later replacement of Jap weapons by U.S. arms as equipment becomes available due to withdrawal of USAFIK).\n\nb. Augmentation to be accomplished by phased activations as follows: 1st increment (7300) immediately on receipt of authority (A-day); 2d increment (7300) A plus 60; 3d increment (28,000) A plus 105.\n\n3. Request Dept of Army confirmation of tentative planning basis as set forth in CX 57862 prior to further action to finalize detailed plans.\n\nOFFICIAL:\n\nR. M. LEVY\nAdjutant General APPROVED BY:\n\nWARD H. MARIS\nColonel, AGD Assistant Chief of Staff, G-3 Brigadier General, GSC Copies to:\nC-in-C\nC/S\nG-2\nG-3 (Return)\nG-4\nAG\n\nTOP SECRET\n\n[0100면]\nDECLASSIFIED\nAuthority NND 886527\nTOP SECRET\n\n4 February 1948 MEMO FOR RECORD:\n\nSUBJECT: Augmentation of South Korean Constabulary.\n\n1. BASIC: WARX 93049/26 Dec, which in Part 2 requests CINCFE recommendations for maximum feasible augmentation of present Constabulary. \"G-3 FILE COPY\"\n\n2. REFERENCES: See Tab 4, attached.\n\n3. DISCUSSION:\n\na. When basic organizational requirements for the proposed 200,000 South Korean Army were forwarded to Washington, CINCFE advised D/A (ref a) that the program was not feasible and that the only program within projected FEC capabilities would be some augmentation of present Constabulary. This statement was based not only on known inadequacies in supply capabilities but on such factors as reduced XXIV Corps strength, language barriers, training difficulties, and FEC inability to support large-scale US military commitments in Korea after withdrawal of XXIV Corps. At the same time, CINCFE stated that determination of firm supply capabilities for the full South Korean Army program would require that D/A clarify supply assumptions.\n\nb. Basic furnishes required assumptions and infers that firm supply capabilities for full program are still desired; however, acknowledges CINCFE statement on infeasibility of original plan (ref a) and requests specific recommendations on a feasible program for augmenting the South Korean Constabulary.\n\nc. CINCFE then queried CG, USAFIK (ref b) for recommendations and an outline plan based on certain requirements and assumptions established by this Hq as a basis for determining \"feasibility\". Major assumption was that FEC ability to augment XXIV Corps supply capabilities would be negligible.\n\nd. CG, USAFIK (in ref g) recommends that augmentation consist of increasing present Constabulary of 25,000 to a total of 50,000 (an augmentation of 25,000), and presents an outline plan for accomplishing the augmentation. It should be noted that supply assumptions furnished by D/A in ref a specify availability of XXIV Corps T/O and E equipment for the augmentation plan, in keeping with previously announced policy that any increase in armed forces over the presently authorized 25,000 would be contingent on firm decision to withdraw XXIV Corps.\n\n[0101면]\nDECLASSIFIED\nAuthority NND 886527\nTOP SECRET\n\ne. G-3, in a telephone call to C/S, XXIV Corps (1130/31 Jan), confirmed fact that Gen Hodge considers that augmentation recommended in ref g to be \"the maximum feasible and desirable\" based on the requirements and assumptions provided in ref b.\n\nf. An approved program is now under way to equip the present Constabulary of 25,000 with US weapons and equipment from disposition levels and surpluses (refs a and f). Since XXIV Corps T/O&E authorized equipment (for 47,000 authorized strength) is considerably in excess of the requirements for the 25,000 augmentation and is all available for an augmentation plan, it is apparent that CG, USAFIK's recommendation for a ceiling of 50,000 is based on factors other than equipment. This is confirmed by USAFIK request during 'phone conversation (per e supra) that the words \"and desirable\" be added to the word \"feasible\".\n\ng. Prior to requiring CG, USAFIK to elaborate further on this outline plan (ref g), D/A should be requested to confirm basis upon which the outline plan was formulated. If the D/A desires that the augmentation program be based solely on firm supply capabilities, taking no cognisance of other factors (which is unrealistic and impracticable), further planning must be deferred until after 1 March. (As pointed out to D/A in ref a, firm FEC supply capabilities cannot be determined until this date.) If, however, as appears likely, D/A desires CINCFE recommendations on \"feasibility\" to be based on all pertinent factors, the 50,000 recommended by Gen Hodge would not necessarily be modified by additional availability of equipment beyond his local capabilities.\n\nh. Actually, on the basis of supply assumptions furnished by D/A in ref a, FEC examination of general supply capabilities in Korea indicates that although there may be some additional quantities of specific items, FEC capabilities (other than XXIV Corps capabilities) for the bulk of items on any standard equipment list will be zero.\n\ni. CG, USAFIK's outline plan (ref g), while clear as to over-all intent and scope, introduces certain figures and strengths which do not completely balance and which would serve only to confuse the problem if forwarded to D/A. For the purpose of securing clearance on the outline plan, D/A should be furnished a summary rather than the text of ref g.\n\nj. The question of the availability in Korea of ammunition for the Japanese arms mentioned in ref g has been investigated, and it appears that USAFIK has access to undetermined amounts of Japanese ammunition still stored in caves in Korea. Since Japanese arms would be issued only as a temporary expedient, during the period prior to departure of XXIV Corps,\n\nTOP SECRET\n\n[0102면]\nDECLASSIFIED\nAuthority NND8X6527\nTOP SECRET\n\nand since the present Constabulary was initially equipped and trained with Japanese weapons, it does not appear that there is any basis for questioning Gen Hodge's plan on this basis.\n\nINDICATED ACTION: Based on ref g and in response to Part 2 of Basic, to inform D/A of status of planning at this time and to request approval of the basis for planning prior to development of a detailed plan.\n\nCOORDINATION: Proposed action has been coordinated with G-4 (see ref h).\n\nCOMPLETION: This completes G-3 action on Part 2 of Basic (WARX 93049/27 Dec). Responsibility for completion of action on Part 1 rests with G-4, to which section Basic is charged for action. Further G-3 action on this subject will be based on D/A reply to proposed radio.\n\nThis I/R also completes G-3 action on ZGCT 74 of 23 Jan (ref g).\n\n[0103면]\nDECLASSIFIED\nAuthority NND8X6527\nTOP SECRET\n\nTab A to M/R REFERENCES:\n\na. CX 57200/8 Dec 47 which commented on proposed South Korean Army and stated that under projected U.S. strength \"no program other than some augmentation of present (South Korean) constabulary will be feasible\".\n\nb. CX 57862/9 Jan 48 which directed CG, USAFIK to submit outline plan for phased augmentation of constabulary based on list of requirements for such a constabulary and certain supply assumptions.\n\nc. Line plan for augmentation of constabulary based on requirements an assumptions provided in ref b.\n\nd. WAR 91520 of 3 Dec 47 which established basic supply assumptions for South Korean Army plan, including assumption that total XXIV Corps T/O&E equipment would be considered available.\n\ne. CX. 56612/5 Nov 47 which authorized USAFIK to arm present constabulary with limitations as to types of arms and stocks to be drawn.\n\nf. CX 57956/14 Jan which advised USAFIK as to availability of equipment (In FEC) for constabulary and called for date furnished by.\n\ng. CX. 58237/28 Jan 48 which advised D/A of action being taken to determine FEC logistic capabilities to support South Korean armed forces, and stated that FEC assets (other than XXIV Corps capabilities) would be negligible.\n\nh. (Following additional references mentioned in ref e but not pertinent)\n\ni. WX 92187/11 Jan 46 in which JCS authorized CINCFE (CINCAFPAC) to arm Korean National Civil Police. This policy is the one referred to by D/A in refs: e.\n\nj. USAFIK ltr dtd 18 Jan (file TFGDS 475) which forwarded requirements and requisitions for equipment to supply present constabulary.\n\nTOP SECRET", "notes": [], "note": "기계 판독 참고 — OCR-generated cable message CX 58437 (pages 0098-0099) has been reconstructed and integrated with the memorandum for record (pages 0100-0101) based on context. Minor OCR errors like 'avallability' and 'augentation' were corrected to 'availability' and 'augmentation'. The header '014.12 GC-P BLP/we' and other signal corps transmission metadata were preserved as read. / M/R 날짜가 1948년 1월 11일로 추정되나, 참고문헌(i)의 날짜(1946년), 본문의 ZGCT 74(1월 23일), 참고문헌(g)의 날짜(1948년 1월 28일) 등이 혼재되어 있어 본문이 여러 시점에 걸쳐 편집되었음을 시사함. OCR로 인해 'Gen'이 'Gen'으로, 'Japanese'가 'Japanese'로 읽혔을 가능성을 반영하여 모두 수정함.", "warn": false, "pages": ["0098", "0099", "0100", "0101", "0102", "0103"]}, {"id": "D028", "order": 27, "date": "1948-01-29", "group": "A", "eyebrow": "D028 · A. 조선경비대 무장·증강", "title": "남조선 경비대 증강 관련 — 참모장 승인을 위한 초안 전문 송부 체크 시트", "badge": "TOP SECRET", "list_right": "0104–0104", "meta": [{"k": "발신", "v": "G-3", "txt": true}, {"k": "수신", "v": "C/S", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "cover"}, {"k": "면", "v": "0104–0104 (1면)"}, {"k": "건명", "v": "Augmentation of South Korean Constabulary", "txt": true}], "summary": "Augmentation of South Korean Constabulary — Check Sheet forwarding draft radio to C/S", "points": ["1948년 1월 29일, 극동군사령부 작전참모부(G-3)가 남조선 경비대 증강 계획에 관한 육군부 전문을 송부하기 위해 참모장(C/S)의 승인을 요청함.", "체크 시트 상단에 명시된 기밀등급은 2급 비밀(TOP SECRET)이지만, 하단의 검열 및 분류 해제 도장에는 'UNCLASSIFIED'라 기재되어 있어, 해당 문서의 보안 분류가 사후 조정되었음을 시사함."], "primary": "[0104면]\nDECLASSIFIED\nAuthority NND86527\n\n극동군 총사령부(GENERAL HEADQUARTERS FAR EAST COMMAND)\n\n2급 비밀(TOP SECRET)\n체크 시트(CHECK SHEET)\n\n문서번호 ...\n발신: 작전참모부(G-3)\n수신: 참모장(C/S)\n일자: 1948년 1월 29일\n주제: 남조선 경비대 증강\n\n1. 상기 주제에 관한 육군부(Department of the Army) 앞 전문 초안을 승인 후 작전참모부로 반송하도록 별첨함.\n\n전문 초안 및\n\n[도장:] CG AFIE UNCL[ASS]IFIED 3A & 2D AGAC UNCLASSIFIED per auth\nby KE KING CWO USA - [판독불가] Dept APO 503\n\n[도장:] 첨부된 시트에서 분리하지 말 것\n\nSEKISUI JUSHI [스캔용 자 — 문서 내용 아님]\n\nSZ AGO Form No. 37 5177-64 ENGR-3-27-47-100,00€ [서식 인쇄 번호 — 문서 내용 아님]\n[판독불가] 15 SECE\n[판독불가] K", "secondary": "[0104면]\nDECLASSIFIED\nAuthority NND86527\nGENERAL HEADQUARTERS\nFAR EAST COMMAND\nTOP SECRET\nCHECK SHEET\n\nFile No... ... Japan APO 503 Subject: Augmentation of South Korean Constabulary Note No. ...\nFrom: G-3 To: C/S Date: 29 January 1948 1 Attached hereto for approval and return to G-3 for dispatch is proposed radio to Department of the Army, subject as above.\n\nDraft radio and [Stamp:] CG AFIE UNCL[ASS]IFIED 3A & 2D AGAC UNCLASSIFIED per auth by KE KING CWO USA - [illegible] Dept APO 503 [Stamp:] Do not remove from attached sheets SEKISUI JUSHI [scanning artifact — not part of document]\n\nSZ AGO Form No. 37 5177-64 ENGR-3-27-47-100,00€ [form printing number — not part of document content] [illegible] 15 SECE [illegible] K", "notes": [], "note": "기계 판독 참고 — The OCR output is heavily corrupted by scanning artifacts ('SEKISUI JUSHI', '200cm', form printing numbers, partially legible stamps). The soldier's name 'KE KING' and abbreviation 'CWO' (Chief Warrant Officer) are fairly certain. The stamp text mentioning declassification is reconstructed from typical GHQ/FEC marking conventions as the OCR fragments are garbled. The file number field and some margin markings at the bottom are unreadable.", "warn": false, "pages": ["0104"]}, {"id": "D029", "order": 28, "date": "1948-01-23", "group": "A", "eyebrow": "D029 · A. 조선경비대 무장·증강", "title": "남조선 경비대 5만 명 증강 권고 및 단계적 증강 계획", "badge": "TOP SECRET", "list_right": "0105–0106", "meta": [{"k": "발신", "v": "CG USAFIK", "txt": true}, {"k": "수신", "v": "CINCFE", "txt": true}, {"k": "참조", "v": "COMMANDER IN CHIEF, CHIEF OF STAFF, G-2, G-4", "txt": true}, {"k": "전문번호", "v": "ZGCT 74"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0105–0106 (2면)"}, {"k": "건명", "v": "Augmentation of South Korean Constabulary", "txt": true}], "summary": "Recommendation to Double South Korean Constabulary to 50,000 Men & Phased Augmentation Plan", "points": ["현재 25,000명 규모인 남조선 경비대를 50,000명(5개 여단)으로 증강할 것을 CINCFE에 권고함.", "증강은 1차(즉시), 2차(60일 후), 3차(45일 후)의 3단계로 나누어 연대 및 지원 부대를 창설하며, 초기에는 일본제 무기로 무장 후 미군 무기로 대체할 계획임.", "경비대 지급 무기는 기존 참조 전문에 명시된 종류로 제한되며, 제8군으로부터의 장비 대여는 불필요할 것으로 예상함."], "primary": "[0105면]\n2급 비밀 (TOP SECRET)\n\n극동군 총사령부\n부관실 무선·전신 센터\n\n수신 전문\n\n비밀 (SECRET)\n1948년 1월 23일\n\n발신: 주한 미군 사령관\n수신: 극동군 총사령관\n전문 번호: ZGCT 74\n\n본 전문은 2부로 구성됨. 제목은 한국 경비대임.\n\n참조:\n참조 공문(목록 및 발송 약호), 제목: \"한국 국립 경찰 및 경비대를 위한 무기 및 탄약.\"\n\n제1부. 현황. 경비대는 25,000명 규모로 편성되어 있음. 참조 공문에 명시된 바에 따라 현재 해당 부대에 미군 무기가 지급 중이며, 1948년 4월 15일 또는 그 이전에 지급이 완료될 것임.\n\n제2부. 경비대를 50,000명으로 증강하고, 3개 연대로 구성된 5개 여단과 필요한 지원 부대로 편성할 것을 권고함.\n증강은 다음과 같이 이루어져야 함:\n\n(1) 현 경비대(25,000명)에게 1948년 12월 31일 기준 주한 미군 잉여 물자 중 경비대에 적합한 모든 미군 보급품 및 장비를 즉시 지급할 것. 추가 장비는 주한 미군 철수에 따라 가용해지는 대로 지급할 것.\n\n(2) 여단, 연대 및 지원 부대를 다음과 같이 창설할 것:\n권한 수령 즉시 여단 본부 1개, 연대 2개(각 2,840명), 지원 부대 1,500명을 창설함. 이 부대들은 초기에 일본식 무기와 소수의 미군 훈련용 무기로 무장할 것. 일본식 무기는 주한 미군 철수로 미군 무기가 가용해지는 대로 대체할 것.\n(계속)\n\n수신\n98223\n\n2급 비밀 통신은 육군 규정 380-5에 의해 승인됨.\n\n[0106면]\n2급 비밀\n발신: 주한 미군 사령관 전문 번호: ZGCT 74 1948년 1월 23일 계속\n\n(3) 최초 증원 60일 후, 여단 본부 1개, 연대 2개 및 지원 부대 1,500명을 창설하며, 무기는 위 (1)항과 같이 지급할 것.\n\n(4) 2차 증원 45일 후, 여단 본부 1개, 연대 2개 및 잔여 지원 부대를 창설하며, 무기는 위 (1)항과 같이 지급할 것.\n\n경비대에 지급될 무기는 1948년 1월자 전문 C 57956에 명시된 것으로 제한될 것임.\n\n제8군으로부터의 장비 대여는 필요하지 않을 것으로 예상됨.\n\n서명 없음\n\n조치: G-3\n정보: 총사령관, 참모장, G-2, G-4\n\n조치 완료\n일자\n\n우선순위 발신 시각: 230130 Z\n통제 번호: 69579\n\n육군 규정 380-5, 51항 1 및 60항 a(4)에 의한 2급 비밀 통신.", "secondary": "[0105면]\nTOP SECRET\n\nGENERAL HEADQUARTERS, FAR EAST COMMAND\nADJUTANT GENERAL'S OFFICE RADIO AND CABLE CENTER\n\nINCOMING MESSAGE\n\nSECRET\n23 Jan 48\n\nFROM: CG USAFIK\nTO: CINCFE\nNR: ZGCT 74 This radio in 2 parts. Subject is Korean Constabulary.\n\nReferences:\nReference letter (list and dispatch symbols), subj: \"Weapons and Ammunition for the Korean National Police and Constabulary.\"\n\nPart 1. Present status. The Constabulary is organized at a strength of 25,000. US weapons are now being issued to subject unit as outlined in reference letter, and issue will be completed on or prior to 15 Apr 48.\n\nPart 2. It is recommended that the Constabulary be increased to a strength of 50,000, to be organized into 5 brigades of 3 regiments each with necessary service troops. Augmentation to be accomplished as follows:\n\n(1) Issue immediately to present Constabulary (25,000) all US supplies and equipment suitable for their use and which are excess to USAFIK requirements as of 31 Dec 48. Additional equipment to be issued as it becomes available due to evacuation of USAFIK.\n\n(2) Activate brigades, regiments and service troops as follows:\nOne brigade headquarters, two regiments (2840 each), and 1500 service troops immediately upon receipt of authority. These units will be armed initially with Japanese type weapons and a small number of US training weapons. Japanese weapons will be replaced by US weapons as they become available due to evacuation of USAFIK. (Over)\n\nRECEIVED\n98223 TOP SECRET correspondence authorized per AR 380-5.\n\n[0106면]\nTOP SECRET\nFROM: CG USAFIK NR: ZGCT 74 23 JAN 48 CONTINUED\n\n(3) One brigade headquarters, two regiments and 1500 service troops 60 days after initial increment, weapons will be issued as in (1) above.\n\n(4) One brigade headquarters, two regiments and remainder of service troops 45 days after second increment. Weapons will be issued as in (1) above.\n\nWeapons to be issued to the Constabulary will be restricted to those outlined in urad C 57956 Jan 48.\n\nIt is anticipated that no loan of equipment from Eighth Army will be required.\n\nNO SIG\n\nACTION: G-3 INFORMATION: COMMANDER IN CHIEF, CHIEF OF STAFF, G-2, G-4\n\nACTION COMPLETED\nDATE\n\nPRIORITY TOO: 230130 Z\nMCN: 69579 TOP SECRET correspondence per para 51 1 and 60 a (4) AR 380-5.", "notes": [], "note": "기계 판독 참고 — OCR 오류가 많았으나 문맥상 복원. 1월 23일 전문에 대해 'action completed' 도장의 날짜가 기입되지 않음. AR 380-5 인용 조항이 1면과 2면에서 약간 다르게 표기됨.", "warn": false, "pages": ["0105", "0106"]}, {"id": "D030", "order": 29, "date": "1948-01-09", "group": "D", "eyebrow": "D030 · D. 장래 정책·철군", "title": "남조선 야전군 대신 강화된 경비대 계획 수립 지시", "badge": "SECRET", "list_right": "0107–0109", "meta": [{"k": "발신", "v": "CINCFE", "txt": true}, {"k": "수신", "v": "CG USAFIK", "txt": true}, {"k": "참조", "v": "D/A", "txt": true}, {"k": "전문번호", "v": "CX 57862"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0107–0109 (3면)"}, {"k": "건명", "v": "Withdrawal from Korea", "txt": true}], "summary": "Directive to plan augmented South Korean Constabulary instead of a field army", "points": ["육군부와 극동군 총사령부는 남조선 방어용 야전군 창설 계획을 현실적 역량 부족으로 철회하고, 강화된 경비대(Constabulary)로 대체할 것을 지시함.", "경비대는 정부 충성, 내부 질서 유지, 국경 경비, 제한적 저항 능력을 갖추되, 북조선에 위협으로 비치지 않도록 평화적 성격을 명확히 해야 함.", "장비는 중화기·장갑차량까지 허용하나 야전포는 제외하며, 장비 이전은 주한 XXIV 군단의 철수 준비 태세를 유지하는 선에서 제한적으로 검토하도록 함."], "primary": "[0107면]\n기밀해제\n권한 NND 86527\n극동군 총사령부(GHQ/FEC)\nG-3\n통신대 메시지 GC-P BIP/sib\n1948년 1월 9일\n발신: 극동군 총사령관(CINCFE)\n수신: 주한 미군 사령관(CG USAFIK) 우선 090921\n\n정보: 육군부(D/A) ...... 정규\n\n(괄호) CX 57862 (괄호) 조치선 CHARLIE GEORGE UNCLE SUGAR ABIE FOX ITEM\nKING 정보선 CHARLIE SUGAR GEORGE PETER OBOE FD 참조 CHARLIE XRAY FIVE SEVEN IWO\nZERO ZERO OF NINE DEC 제목 남조선 군대 창설 FD 1항\nPD 육군부는 남조선 육군 창설 대신 경비대 증강을 검토 중이라고 밝힘 CMA 제한된\n전구(戰區) 역량에 근거함 참조 전문 1항에서 지적된 바 FD 본 사령부는 물리적 한계만으로도\n가까운 장래의 역량 내에서 실행 가능한 유일한 계획은 방어용 야전군 개념을 포기하고\n다음 요건을 충족시키기 위한 강화된 경비대 발전에 집중하는 것이라는 결론을 내리게 됨\n(괄호 ABLE) PD 수립된 민주적 남조선 정부에 충성하며 정치 파벌이나 개인에 의한\n쿠데타 시도 시 변절하지 않을 것 PD (괄호 BAKER) FD 정치적 분쟁 및 선동된\n혼란 상황에서 내부 질서 유지 능력 보유 FD (괄호 CHARLIE) FD 국경 순찰 유지 및\n북쪽으로부터의 침공에 명목상 저항 능력 보유 FD (괄호 DOG) PD 평화적 목적을\n명확히 표시하고 북조선에 대한 (인용) 위협 (인용 끝)을 구성한다는 주장에\n그럴듯한 근거를 제공하지 않도록 조직될 것\n본 메시지의 평문을 동일 등급\n서신으로 취급 및 전송하는 것은\n1946년 3월 6일자 AR 380-5,\n16-C, 53-D (1) (2) (3), 및 60-A (1) (2) 18-E, 33-A,\n97 (3) (4)항의 규정에 의거 SECRET CX 57862\n전쟁부의 승인을 받았음 Z\n\n[0108면]\n기밀해제\n권한 NND 886527\n\n비밀\nPD (IWO항) PD 사전 검토를 위해 요구되는 것은 위에 열거된 고려사항과 이전에 제공된\n보급 가정을 바탕으로 XXIV 군단의 역량 범위 내에서 현 경비대의 단계적 증강에 대한\n개요 계획임 PD 장비는 적절하다고 판단되는 경우 보병 중화기 CMA 기관포 CM/ 및\n장갑차량을 포함할 수 있으나 야전포 자체는 포함하지 말 것 FD 경비대 장비 지원은\n없는 것으로 가정함 PD 다만 CMA 무장 균형을 위한 소량의 특정 품목 요청은 검토할 것임\nPD 장비 이전 단계 설정 시 철수 준비 기간 중 XXIV 군단 전술 역량 유지 필요성을\n고려할 것 FD 이 목적을 위한 경우에만 CMA XXIV 군단 철수 시 제8군에 반납할\n장비에 대해 제8군 배치 수준에서 인출하는 것을 검토할 것임\n공식: 승인:\n서명 R. M. 레비, 서명 워드 H. 마리스,\nR. M. 레비, 워드 H. 마리스,\n부관. AGD 대령, G-3 참모차장보, GSC 준장,\n배포처:\n18 총사령관\n참모장\nG- (반납)\n1920 변경_\n22\n24\n25\n26 b - CX 57862\n27\nFORETT 8\n\n[0109면]\n기밀해제\n권한 NND86527\n\nG-3 G/S\nC/N\n전문 CX 57862 090948\nm/R 2 Janct\n8\n남조선 군대 창설\n8L\n검토/승인 및 전달 요망\n\nDZ mAG\nzz\n9Z", "secondary": "[0107면]\nDECLASSIFIED\nAuthority NND 86527\nGENERAL HEADQUARTERS\nFAR EAST COMMAND\nG-3\nSIGNAL CORPS MESSAGE GC-P BIP/sib 9 January 1948\nFROM: CINCFE\nTO : CG USAFIK PRIORITY 090921\n\nINFO: D/A . . ..... ROUTINE (PAREN) CX 57862 (PAREN) ACTION CHARLIE GEORGE UNCLE SUGAR ABIE FOX ITEM\nKING INFO CHARLIE SUGAR GEORGE PETER OBOE FD REFERENCE CHARLIE XRAY FIVE SEVEN IWO\nZERO ZERO OF NINE DEC SUBJECT ESTABLISHMENT SOUTH KOREAN ARMED FORCES FD PAR ONE\nPD DEPT OF ARMY STATES THAT CONSIDERATION ALSO BEING GIVEN TO AUGMENTATION OF\nCONSTABULARY IN LIEU OF ESTABLISHMENT SOUTH KOREAN ARMY CMA BASED ON LIMITED\nTHEATER CAPABILITIES POINTED OUT IN PART ROMAN ONE REFERENCE RADIO FD CONSIDERED\nHERE THAT PHYSICAL LIMITATIONS ALONE FORCE CONCLUSION THAT ONLY PRACTICABLE PLAN\nWITHIN FORESEEABLE CAPABILITIES IS TO ABANDON CONCEPT OF DEFENSIVE FIELD ARMY AND\nCONCENTRATE ON DEVELOPMENT OF AN AUGMENTED CONSTABULARY TO MEET FOLLOWING\nREQUIREMENTS (PAREN ABLE) PD LOYAL TO ESTABLISHED DEMOCRATIC SOUTH KOREAN\nGOVERNMENT AND NOT SUSCEPTIBLE TO DEFECTION IN EVENT OF ATTEMPTED COUP DETAT BY\nPOLITICAL FACTIONS OR INDIVIDUALS PD (PAREN BAKER) FD CAPABLE OF MAINTAINING INTERNAL\nORDER UNDER CONDITIONS OF POLITICAL STRIFE AND INSPIRED DISORDER FD (PAREN CHARLIE) FD\nCAPABLE OF MAINTAINING BORDER PATROLS AND OF OFFERING TOKEN RESISTANCE TO INVASION\nFROM THE NORTH FD (PAREN DOG) PD ORGANIZED TO INDICATE CLEARLY ITS PEACEFUL PURPOSE\nAND TO PROVIDE NO PLAUSIBLE BASIS FOR ALLEGATIONS OF ITS CONSTITUTING A (QUOTE)\nHandling and transmission of plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the pro- SECRET CX 57862 visions of paragraphs 16-C, 53-D (1) (2) (3), and 60-A (1) (2) 18-E, 33-A, 97 (3) (4), AR 380-5, 6 March 1946 Z\n\n[0108면]\nDECLASSIFIED\nAuthority NND 886527\n\nSECRET\nTHREAT (UNQUOTE) TO NORTH KOREA PD (PAR IWO) PD DESIRED FOR PRELIMINARY REVIEW IS\nOUTLINE PLAN FOR PHASED AUGMENTATION OF PRESENT CONSTABULARY BASED ON CONSIDERATIONS\nLISTED ABOVE AND WITHIN XXIV CORPS CAPABILITIES USING SUPPLY\nASSUMPTIONS PREVIOUSLY FURNISHED PD EQUIPMENT MAY INCLUDE INFANTRY HEAVY WEAPONS\nCMA CANNON CM/ AND ARMORED VEHICLES AS DEEMED APPROPRIATE BUT SHOULD NOT INCLUDE\nARTILLERY AS SUCH FD ASSUME NO/ ASSISTANCE IN EQUIPPING CONSTABULARY PD HOWEVER\nCMA CONSIDERATION WILL BE GIVEN TO REQUESTS FOR MINOR QUANTITIES OF SPECIFIC ITEMS\nTO BALANCE ARMAMENT PD PHASING OF EQUIPMENT TRANSFER SHOULD CONSIDER NECESSITY FOR\nMAINTAINING XXIV CORPS TACTICAL CAPABILITIES DURING PREPARATION\nFOR WITHDRAWAL FD FOR THIS PURPOSE ONLY CMA CONSIDERATION WILL BE GIVEN TO DRAWING\nON EIGHTH ARMY DISPOSITION LEVELS FOR EQUIPMENT TO BE RETURNED TO EIGHTH ARMY UPON\nXXIV CORPS WITHDRAWAL\nOFFICIAL: APPROVED BY:\n/s/ R. M. Levy, /s/ Ward H. Maris,\nR. M. LEVY, WARD H. MARIS, Adjutant General. Colonel, AGD, Assistant Chief of Staff, G-3, Brigadier General, GSC, Copies to:\n18 C-in-c\nC/S\nG- (Return)\n1920 changed to_ 22 24 25 26 b - CX 57862 27\nFORETT 8\n\n[0109면]\nDECLASSIFIED\nAuthority NND86527\n\nG-3 G/S\nC/N\nRadio CX 57862 090948 m/R 2 Janct 8 July Establish So Kean Armed Forces 8L Remarks for /s approval t fwd DZ mAG zz 9Z", "notes": [], "note": "기계 판독 참고 — 페이지 0107의 Authority 번호는 'NND 86527'로 표기되어 있으나, 페이지 0108에는 'NND 886527'로 오기된 듯함. 0109의 원문이 메모 형태로 빠르게 작성되어 'Remarks for /s approval t fwd' 등 비표준 약어 및 오기가 다수 포함됨.", "warn": false, "pages": ["0107", "0108", "0109"]}, {"id": "D031", "order": 30, "date": "1947-12-27", "group": "D", "eyebrow": "D031 · D. 장래 정책·철군", "title": "남한군 소요 및 경비대 증강에 관한 CINCFE 요청에 대한 워싱턴의 회신", "badge": "TOP SECRET", "list_right": "0110–0111", "meta": [{"k": "발신", "v": "DA (CSGPO)", "txt": true}, {"k": "수신", "v": "CINCFE", "txt": true}, {"k": "참조", "v": "COMMANDER IN CHIEF, CHIEF OF STAFF, G-3, JSPOG", "txt": true}, {"k": "전문번호", "v": "W 93049"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0110–0111 (2면)"}, {"k": "건명", "v": "Withdrawal from Korea", "txt": true}], "summary": "Response to CINCFE requests on South Korean Army requirements and constabulary augmentation", "points": ["워싱턴은 남한 과도 육군 창설 요청을 검토 중이며, 미국 본토 반환 물자나 극동군 보급품목의 전용은 불가하다고 못 박았다.", "남한 육군 계획보다 기존 육군부 계획(CX 57426)이 우선하며, 이에 따라 우선순위 2 A는 무효화되었다.", "남한 경비대의 최대한 증강을 위해 CINCFE 측에 구체적인 보급 가정과 권고안을 역문의했다."], "primary": "[0110면]\n해제\n권한 NND 816527\n\n극동군 총사령부\n부관실\n무선 및 전신 중계소\n\n일급비밀\n\n수신 전문\n\n1947년 12월 27일\n\n발신: 육군부 (CSGPO)\n수신: 극동군 총사령관\n전문 번호: W 93049\n\n참조 귀전문 CX 57483, CX 57426, WX 91520.\n\n제1부. 귀서한 \"남한 과도정부 육군 창설 소요\" 건에 대해 전면적 검토가 진행 중임. 극동군사령부 보급 역량 판단을 용이하게 하고 정부 결정에 필요한 모든 관련 요소가 갖춰지도록 계획을 완료하기 위해, 귀전문 CX 57483에 대해 동일 순서로 다음과 같이 회신함: 별지 3, 제3항, A부, 제1호 가목.\n(1) 현행 지침에 따라 미국 본토로 반환 중인 물자는 본 소요 충족에 적용 불가한 것으로 간주함.\n(2) 극동군 보급품목분류에서의 인출 권한은 없는 것으로 간주함.\n(3) 별지 3, 제3항, C부. 1951년 6월 30일까지 극동군 처분 수준 소요 대비 잉여 자산으로 간주함.\n\n별지 3, 제1항 나목, 제4항, A, B, C 각 세부 항목은 유효함.\n\n별지 3, 제1항 다목, CX 57426에서 언급된 육군부 계획이 남한 육군 계획보다 우선함. 상기 내용 및 우선순위 2 A의 부적합성에 관한 귀측 의견에 비추어, 당해 우선순위에 대한 이전 언급은 무시할 것.\n\n제2부. 남한 경비대 증강에 관한 귀측 건의 또한 검토 중이며, 현 경비대의 최대한 증강과 관련하여 모든 보급 가정에 관한 구체적 건의는 무엇인지 문의함.\n\n서명 없음\n\n(뒷면)\n89260\n\n\"육군규정 380-5 제51항 및 제60항 a호 (4)에 의거 의역 불필요.\" 일급비밀 문서\n\n본 전문의 문자 그대로의 평문 취급 및 동일 등급 문서로서의 전송은 1946년 3월 6일자 육군규정 380-5 제16-C항, 제18-E항, 제53-A항, 제53-D항 (1) (2) (3), 및 제60-A항 (1) (2) (3) (4)의 규정에 따라 육군부에 의해 허가되었음.\n\n16-50735-1 GPO\n\n[0111면]\n해제\n권한 NND86527\n\n비밀\n우선\n\n육군부 (CSGPO) 전문 번호 W 93049, 1947년 12월 27일자, 계속:\n\n권한 변경: 등급 취소 또는 비밀\n\n조치: G-4\n정보: 총사령관, 참모장, G-3, 합동전략기획운영단\n\n발신 시각: 26일 2247 Z\n전문통제번호: 68158\n\n\"육군규정 380-5 제51항 및 제60항 a호 (4)에 의거 의역 불필요\" 일급비밀 문서\n\n89260", "secondary": "[0110면]\nDECLASSIFIED\nAuthority NND 816527 GENERAL HEADQUARTERS, FAR EAST COMMAND\nADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\n\nTOP SECRET\n\nINCOMING MESSAGE\n\n27 Dec 47\n\nFROM: DA (CSGPO)\nTO: CINCFE\nNR: W 93049 Refers urads CX 57483, CX 57426, and WX 91520.\n\nPart 1. Full consideration is being given to urlet subj \"Requirements for establishment of a South Korean Interim Army.\" To facilitate determination of FEC supply capabilities and to complete necessary planning to assure that all pertinent factors are available for governmental decision, the following replies are furnished for urad CX 57483 in same order: Para 1 A, Inclosure 3, Para 3, Part A.\n(1) Assume property being returned to ZI under current instructions not applicable to meet requirements.\n(2) Assume no authorization for withdrawal from FLC.\n(3) Inclosure 3, Para 3, Part C. Assume as assets excesses to FEC disposition level requirements through 30 Jun 1951.\n\nPara 1 B, Inclosure 3, Para 4, Parts A, B and C Subpara are valid.\n\nPara 1 C, DA program referred to in CX 57426 takes precedence over South Korean Army program. In light of above and your comment on unsuitability of priority 2 A disregard previous reference to this priority.\n\nPart 2. Consideration is also being given to your recommendation on the augmentation of South Korean constabulary, and maximum feasible augmentation of the present constabulary utilizing in this regard, what are your specific recommendations for all supply assumptions?\n\nNO SIG\n\n(over)\n89260 \"Paraphrase not required per para 51 and 60 a (4) AR 380-5.\" TOP SECRET correspondence Handling and transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) (2) (3), and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946.\n\n16-50735-1 GPO\n\n[0111면]\nDECLASSIFIED\nAuthority NND86527\n\nSECRET\nPRIORITY\n\nDA (CSGPO) MSG NBR W 93049 DID 27 DEC 47 CONTINUED:\n\nauthority changed to Classification cancelled or SECRET ACTION: G-4 INFORMATION: COMMANDER IN CHIEF, CHIEF OF STAFF, G-3, JSPOG\n\nTOO: 262247 Z\nMCN: 68158 \"Paraphrase per para 51 not required and 60 a (4) AR 380-5\" TOP SECRET correspondence 89260", "notes": [], "note": "기계 판독 참고 — OCR 오류가 심한 헤더 부분을 문맥과 표준 양식에 맞춰 복원함. 'urlet'는 'your letter'의 오기, 'Subpara'는 'Subpara'로, 'FLC'는 'FLC (Federal Logistics Catalog)'로 추정되나 명확하지 않아 원문 그대로 유지.", "warn": false, "pages": ["0110", "0111"]}, {"id": "D032", "order": 31, "date": "1947-12-19", "group": "B", "eyebrow": "D032 · B. 한국군 창설·훈련", "title": "남한군 창설을 위한 군수 및 고문단 소요 관련 문의 및 해명", "badge": "SECRET", "list_right": "0112–0116", "meta": [{"k": "발신", "v": "CINCFE", "txt": true}, {"k": "수신", "v": "DEPT OF ARMY (first msg); CG USAFIK (second msg)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "C-57483 (first part); C-57425 (second part)"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0112–0116 (5면)"}, {"k": "건명", "v": "Establishment of a South Korean Army", "txt": true}], "summary": "Clarifying logistics and advisory group requirements for establishing a South Korean Army", "points": ["CINCFE는 남한군 초도 장비 공급과 관련, 워싱턴의 '우선순위 2A' 해석에 혼선을 보이며 명확한 지침을 요청했다.", "육군부에 보고된 군수 소요는 24군단 보유 자산을 기준으로 했으나, 현지 추정과 차이가 있어 항목별 변경 내역을 1월 10일까지 재보고할 것을 USAFIK에 지시했다.", "600명 규모 고문단이 24군단의 지원 없이 남한군을 동원/훈련할 수 있다는 주한미군사령부의 추정은 기존 합의와 배치되므로 해명을 요구했다.", "중국 고문단 사례를 들어 제안된 고문단 규모의 효율성을 문제 삼으며, 영구 고문단의 T/O&E 수립을 위한 전면 재검토를 지시했다.", "육군부 권고를 위한 기초 자료로 사용될 남한군 장비 소요에 관한 일급비밀 문서의 표지임.", "G-3 작전참모부 차장과 준장의 승인을 거쳐 총사령관, 참모장 등 관계 부서에 배포됨.", "문서에는 보안 취급 규정(육군규정 380-5 계열)이 적용되었음."], "primary": "[0112면]\n극동군 총사령부\n발신 전문\n1947년 12월 19일\n\n발신: 극동군 총사령관(CINCFE)\n수신: 육군부  비밀  우선 200417\n\n(C-57483) 수신처: CHAPTER SUGAR GEORGE PETER OBOE.\n제목:\n0 C MA 12월 4일자 및 제4장 0 C CHARLIE XRAY 5 007 200 C MA 12월 8일자, 그리고 극동군 총사령부\n서한 파일 AG 091(1947년 12월 4일) GC-P, 1947년 12월 5일자 CHARLIE SUGAR GEORGE PETER OBOE 앞,\n제목: '남한군 창설 소요' 인용.\n\n제1항. 남한군에 대한 초도 장비 공급을 위한 극동군 사령부의 능력을 판단하기 위해,\n귀 전문 WAR 915 INFO 0 C MA 제1부에서 요청된 바에 따라,\n동 전문 제2항 B에 포함된 가정에 기초하여, 상기 c항의 하위 단락을 요청함.\n상기 참조된 극동군 총사령부 서한, 제3부 별지 3의 3항에 열거된 요소들에 관한 육군부 지침.\n하위 단락 B. 동일 서한 별지 3의 4항에 포함된 가정 확인.\n하위 단락 C. 남한군 계획의 우선순위 및 육군부 계획에 관한 결정. 1947년 12월 18일자\n우리 전문 C X 57426 참조.\n\n제2항. 귀 전문 WAR 915 INFO 0의 제2부 B에서 인용된\n'우선순위 2A'는 여기서 이해되지 않음. 그러나 1947년 5월 1일자 전쟁부 병력 계획\n보충 제4장 공급의 상기 2항을 지칭하는 것으로 추정함.\n만약 이 추정이 맞다면, 그러한 우선순위는 다른 보급 계획들을 고려할 때 목적에 부합하는 것으로 믿어짐.\n\n[0113면]\nWAR 915 INFO 0 제2부 A항이\n현재 수립 중이며 조속히 송부될 것임.\n\n공식:\n/s/ R. L. Ivy\n대령, 부관감실\n부관감\n\n승인:\n/s/ H. L. Isbell, GSC\n참모차장보, G-4\n\n사본 제공:\n최고사령관\n참모장\n\n분류 해제 또는\n______로 변경\n권한자 ______\n\n/s/ H. F. Judson Sr. CWO USA\n일자: 12월 20일 오후\n\n[0114면]\n극동군 총사령부\n통신대 전문\n1947년 12월 18일\n\n발신: 극동군 총사령관(CINCFE)\n수신: 주한 미군 사령관(CG USAFIK)  우선 180617\n\n(C-57425) 제목은 남한군임. 참조는 다음과 같음.\n가. 12월 3일자 WILLIAM ABLE ROGER 915 INFO 0\n나. 12월 9일자 CHARLIE XRAY 5700\n다. 12월 13일자 ZEBRA GEORGE CHARLIE TARE 145 INFO.\n본 전문은 참조 전문 C에 대응하여 6부로 구성됨.\n\n제1부: 귀측 대표와 협의하여 작성되어 육군부에 제출된 군수 소요 양식은 총 소요를 표시하며,\n이에 대비하여 육군부에 보고된 24(X X)군단 자산 중 T/E와 1948년 12월 31일 배치 수준을 가정하여\n확보 가능한 것만 기재하였음. 귀측이 이전에 적합한 상태로 추정한 T/E 장비의 적용은\n따라서 육군부에 보고된 24(X X)군단 능력을 변경할 것임. 항목별 변경 사항은\n군수 소요 양식의 기재 사항과 일치하도록 1월 10일까지 항공 우편으로 송부 바람.\n\n제2부: 귀측 대표와 합의되어 참조 B 1부에 명시된 결론에 비추어,\n참조 C에서 언급된 600명의 고문단이 24(X X)군단의 지원 없이 제안된 남한군을 동원 및 훈련시킬 수 있다는 추론은\n이해되지 않음.\n\n[0115면]\n참조 A 제3부 A항은 귀측 계획에 따라 한국군이 동원 및 편성되고\n24(X X)군단이 철수한 이후의 지속 임무를 위한 고문단의 임무 및 기능(T/O&E)을 요구하는 것으로 해석됨.\n육군부에 제출된 보고서에서 언급된 고문단은 동원 및 훈련 단계만을 위한 것이며\n오로지 24군단의 증원만을 의도했음에 주목할 것. 육군부에 제공된 병과별 '세부 내역'은\n상설 고문단의 구성을 나타내기 위해 의도된 것이 아니며, 병과별 세부 내역도 구성과 기능의 만족스러운 지표가 아님.\n동원 및 초도 훈련 완료, 그리고 24(X X)군단 철수 이후 기간에 대한\n상설 고문단의 권장 T/O&E를 조기에 제출할 것을 요청함.\n\n제3부: 참조 C에서 제안된 고문단 증원안은 총 규모를 현재의 중국 주둔 고문단의 두 배로 만들며,\n중국 고문단은 낮은 비율의 근무 부대로 병참 자급이 가능하고, 훨씬 큰 규모의 부대에 기술 조언과 지원을 제공하며,\n추가로 자체 부양 가족을 유지하고 있음. 고문단 본연의 T/O&E 준비와 관련하여 이 문제의 재검토가 요망됨.\n\n제4부: 재검토 때까지 추가 준비 중단 제안 (위 제3부 참조).\n\n제5부: 현재 승인된 50,000명의 경찰 및 경비대는 규모가 아무리 작더라도\n장기 고문단의 설치를 정당화할 것으로 여겨짐. 남한군 계획이 승인되지 않을 경우\n경비대의 일부 추가 증원이 가정되므로, 귀측 권고안의 재고를 건의함.\n\n(C-57425)\n\n[0116면]\n비밀해제\n해제권한 NND 886527\n\n일급비밀\n\nPART ROMAN SIX CIN EQUIPMENT RITES PROPOSED TILL D USED AS BASIS FOR\nRECOMMENDATIONS TO DEPT OF ARMY\n(부서명 및 문서명 일부 판독불가 — 육군부 장비 권고안 기초 문서)\n\n공식:\n승인:\n\n[서명]\nR. M. LEVI,\n부관감실장.\n\n[서명]\nWARD H. MRIS,\n육군 대령, G-3 작전참모부 차장.\n\n[서명] 준장, GSC,\n\n배포처:\n총사령관\n참모장\nG-3 (반납)\nG-4\n10\n12\n15\n16\n17\n19\n20\n22\n23\n24\n25\n26\n\n문서 취급 및 전송 [판독불가]\n본문 평문 [판독불가]\n[판독불가]\n\n53-D (3) (4); 육군규정 및 1946년 3월 60-A (1) (2) -t, 18-E, 53-A,: C 57425", "secondary": "[0112면]\nGENERAL HEADQUARTERS\nFAR EAST COMMAND\nOUTGOING MESSAGE\n19 December 1947\n\nFROM: CINCFE\nTO : DEPT OF ARMY   SECRET   PRIORITY 200417 (C-57483) FOR CHAPTER SUGAR GEORGE PETER OBOE PD\nSUBJECT:\nTO 0 C MA FOUR DECEMBER FOUR SEVEN AND PART ROMAN IV 0 C CHARLIE XRAY FIVE\nZERO ZERO SEVEN TWO ZERO ZERO C MA EIGHT DECEMBER FOUR SEVEN SENTCOLN AND LETTER GENERAL\nHEADQUARTERS FAR EAST COMMAND FILE ABLE GEORGE ZERO NINE ONE (FOUR DECEMBER\nFOUR SEVEN) GEORGE CHARLIE HYPHEN PETER C MA TO CHARLIE SUGAR GEORGE PETER OBOE\nDATED FIVE DECEMBER FOUR SEVEN C MA SUBJECT QTE REQUIREMENTS FOR ESTABLISHMENT OF\nABLE SOUTH KOREAN ARMY PD UNQTE\n\nPARA ONE PD IN ORDER TO DETERMINE FAR EAST COMMAND\nCAPABILITIES FOR SUPPLY OF INITIAL EQUIPMENT TO SOUTH KOREAN ARMY AS REQUESTED IN\nPART ONE URAD WILLIAM ABLE ROGER NINE ONE FIVE INFO ZERO C MA BASED ON ASSUMPTION\nCONTAINED IN PARAGRAPH BAKER C MA PART TWO C M REQUEST CIN SUBPARA ABID PD\nDEPARTMENT OF ARMY INSTRUCTIONS RELATIVE TO FACTORS LISTED IN PARA THREE C MA\nINCLOSURE THREE C MA OF ABOVE REFERENCED GENERAL HEADQUARTERS FAR EAST COMMAND\nLETTER PD SUBPARA BAKER PD CONFIRMATION OF ASSUMPTIONS CONTAINED IN PARA FOUR C MA\nINCLOSURE THREE C MA SAME LETTER PD SUBPARA CHARLIE PD DECISION AS TO PRIORITY\nOF SOUTH KOREAN ARMY PROGRAM AND DEPARTMENT OF ARMY PROGRAM PD SEE OURAD CHARLIE\nXRAY FIVE SEVEN FOUR TWO SIX C MA ONE EIGHT DECEMBER FOUR SEVEN PD PARA TWO PD\nIN REFERENCE IN PART TWO BAKER URAD WILLIAM ABLE ROGER NINE ONE FIVE INFO ZERO TO\nQTE PRIORITY TWO ABLE UNQTE NOT RPT NOT UNDERSTOOD HERE BUT ASSUMED TO REFER TO\nPARA TWO ABID SECTION ROMAN IV SUPPLY SUPPLEMENT TO WAR DEPARTMENT TROOP PROGRAM\nONE MAY FOUR SEVEN PD IF ASSUMPTION IS CORRECT C MA SUCH A PRIORITY BELIEVED\nTO BE FOR PURPOSES IN VIEW OF OTHER SUPPLY PROGRAMS PD\n\n[0113면]\nPARA ABLE ONE PART TWO C MA OF WILLIAM ABLE ROGER NINE ONE FIVE INFO ZERO NOW BEING\nFORMULATED AND WILL BE FORWARDED SOONEST PD\n\nOFFICIAL:\n/s/ R. L. Ivy\nColonel, AGD Adjutant General Approved by:\n/s/ H. L. Isbell, GSC\nAsst C/S, G-4 Copies furnished:\nC-in-C\nC/S\n\nClassification cancelled or changed to _____ by authority of _____\n\n/s/ H. F. Judson Sr. CWO USA\nDate: 20 Dec PM\n\n[0114면]\nGENERAL HEADQUARTERS FAR EAST COMMAND\nSIGNAL CORPS MESSAGE\n18 December 1947\n\nFROM: CINCFE\nTO : CG USAFIK   PRIORITY 180617 (C-57425) SUBJECT IS SOUTH KOREAN ARMY P
