 및 발송.\n\n6. 완료 - 본 문서는 47년 1월 14일자 USAFIK 서한 IFAG 381, 제목: \"한국 경찰예비대 창설 및 장비\"에 대한 G-3 조치를 완료함.\n\n조치 장교 JOST - 22622\n\n일급비밀\n\n[0322면]\n기밀해제\n권한 NND 886527\n\n작전 우선\n1945년 11월 3일\n\n수신 : SCAP\n발신 : CO USAFIK\n전문번호 : TFGCG 193\n\n한국 군대의 창설에 관한 정책을 수립하고 착수할 시기가 도래했다고 믿는다. 무장하지 않은 퇴역 군인들로 구성된 민족주의적 성향의 사조직 군대가 이곳에서 생겨나기 시작하고 있다. 최선의 통제 방법은 이들의 에너지를 국가적 통제 하의 국가적 경로로 전환하는 것이다. 국가적 기반 위에서 질서를 유지하고, 이후 군대로 확장될 수 있는 국가 경찰예비대를 창설하는 것이 최선의 즉각적 조치라고 생각한다.\n\n전리품 목적으로 보존된, 파괴되지 않은 충분한 일본제 무기들이 경찰예비대를 일부 무장시킬 수 있을 정도로 여전히 존재한다. 현재 계획 하에서는 한국 군대의 최종 무장 및 장비에 관한 정책을 조기에 수립하기를 희망한다. 가용하더라도, 이러한 목적으로 일본제 무기를 사용하는 것은 현명하지 않다고 생각된다. 무기 성능이 열등하고, 현지에서의 수량이 부족하며, 이들을 사용할 경우 일본제 무기, 부품 및 탄약의 생산 지역 내 지속적 제조가 필요할 것이다. 한국 경찰예비대 및 차후의 군대는 이곳 및 태평양 지역 내 다른 곳의 재고 및 4종(Category IV) 부대에서 가용한 미군 잉여 무기로 무장할 것을 권고한다.\n\n서명 없음\n\nMGN: 030524 Z ZUG B 39\n\n배포:\n조치 사본:\nG-3\n정보 사본:\n총사령관\n참모장\nG-1\nG-2\n병기\n방첩대 민사과\n\n작전 우선\n비밀\n\n[0323면]\n기밀해제\n권한 NND 846527\n\n비밀(SECRET)\n총사령부\n미국 육군 태평양 부대\n통신대 전문\nGC-P SEO/ejd\nONL 우선순위 1945년 11월 4일\n발신: CINCAFPAC\n수신: CG USAFIK\n\n11월 3일자 귀관의 TARE FOX GEORGE CHARLIE GEORGE Lo 139호(CAX 54290)에 전반적으로 동의한다. 귀관의 계획을 준비하여 제출하기 바란다. 맥아더\n\n조치:\nJGA\n\n승인:\nB. M. 피치\n미 육군 준장\n부관\n\n승인:\nUM 조지 A. 레임\nW.E. 챔버스 대리\n준장, G.S.C.\n참모차장 G-3\n\n배포처:\n총사령관\n참모장\nG-2\nG-4\n병기과(Ord o)\nC 정부과(C Govt Sect)\nG-3 (회람용)\n\n비밀(SECRET)", "secondary": "[0315면]\nDECLASSIFIED\nAuthority NND 846527\n\nTOP SECRET\n\n6 July 1947\n\nMEMORANDUM FOR: Chief of Staff and Commander-in-Chief\n\nSUBJECT: USAFIK Radio 2000846 July 2, 1947; Gen Hodge's Estimate of the Current Situation in Korea\n\n1. General Hodge's radio, brief attached, (Tab A), presents his estimate of the present situation in Korea:\n\nHS \"....The Korean situation is more precarious today than at any time...\" ....Centering around re-convention of Joint Commission....Communist-controlled leftist wing is being greatly strengthened....\" \"....The increase creates a situation more and more hostile to American type of democracy...\" d. \"....The situation becomes more explosive each day....if the Joint Commission fails, terrorism by both factions may approach an oriental style civil war and early attempt by Communists to carry out their uprise of masses in South Korea....\"\n\n2. The USAFIK estimate agrees with a previous G-2 estimate of 31 March (Annex 2a Baker 61). In check sheet to JSPOG, 20 May 47 (Tab B), G-2 advised SPOG planners not to overstress direct Russian intervention from Korea, an overt act of warfare, considered unlikely at this time, but to accept that internal disorders in South Korea by Communist sponsored dissidents represent a greater menace and are more likely to occur.\n\n3. The general potentialities of the subversive movements in South Korea were previously set forth in Annex 2a Baker 61, 31 March 47, brief of which is attached. (Tab C)\n\n4. Maps attached as Tabs D and E shows Location of subversive actions, riots and disorders: Oct 46 to May 47. Collective areas of unrest and dissidence, and relative U.S. military and Korean police strength.\n\n5. This check sheet informs the Chief of Staff of G-2's concurrence with General Hodge's present estimate, reiterates G-2's previous views, and previous estimates on the same subject of 31 March 47 and 28 May 47.\n\n6. a. It is suggested that the practical aspects of Baker 61 be checked with a view to early execution.\nb. Attention is invited to G-2 USAFIK's letter protesting restriction on the use of confidential funds.\n\nC.A.W.\n\n5 Incls:\n1 - Brief of S radio USAFIK NO 200G846 2 - Check sheet G-3/JSPOG 3 - Brief of Annex Baker 61, 31 March 47 4 - Map: Locality of Subversive Action 5 - Map: Subversive Collective Areas Tabs A B C D E\n\nSPO\nTOP T/S 470/cy 3\n[0316면]\nDECLASSIFIED\nAuthority NND 846527 [Note: Page 0316 OCR is completely garbled. It appears to be a mirror image or severely corrupted scan of text possibly duplicating portions of page 0315 content. No coherent text could be recovered.]\n[0317면]\nDECLASSIFIED\nAuthority NND 846527\n\nTOP SECRET\n\nBASIC:\nAG 014.12 (24 Jan 47) GC 1st Ind.\n\nGENERAL HEADQUARTERS, FAR EAST COMMAND, APO 500.\n\nTO: Commanding General, United States Army Forces in Korea, APO 235.\n\n1. Reference is made to -\na. USAFIK radio TEGG 139 of 3 November 1945.\nb. GHQ AFPAC radio CAX 54290 of 4 November 1945.\nc. GHQ AFPAC radio CAX 55238 of 25 November 1945.\nd. JCS radio WX 92167 of 11 January 1946. 386.2 TS 7-1\ne. GHQ AFPAC radio CAX 56830 of 11 January 1946. 386.2 TS 7-1\nf. GHQ AFPAC radio CAX 56889 of 13 January 1946. 386.2 TS\ng. USAFIK IFCT 1948 of 19 January 1946.\nh. GHQ AFPAC radio CAX 57249 of 24 January 1946. 386.2 TS 7-2\ni. Headquarters XXIV Corps letter, file AG 381 (IFGCG)\nsubject: \"Approved Proceedings of Board of Officers Pertaining to Establishment of National Defense of Korea South of 38 Degrees North Latitude\", dated 20 November 1946 forwarding approved proceedings of board of officers on this subject.\n\n2. Copies of the references listed above are forwarded to complete your records concerning the establishment and equipment of the Korean National Civil Police Force.\n\n3. Since reference d directed that action to establish national armed forces in Korea South of the 38 Degrees North Latitude be deferred pending settlement of problems in connection with Korean independence, the Board proceedings referred to in reference i have been placed in suspense status.\n\nBY COMMAND OF GENERAL MACARTHUR:\n\n1 Incl.\nAs listed.\n\nC.E.\n[0318면]\nDECLASSIFIED\nAuthority NND 846527\n\nTOP SECRET\n\nUNITED STATES ARMY FORCES IN KOREA\nOffice of the Commanding General\nAPO 235\n\n14 JAN 1947\n\nSUBJECT: Establishment and Equipment of Korean Constabulary\n\nTO: Commander-In-Chief Far East\nAPO 500\n\n1. Records at this headquarters relative to the establishment of Korean Constabulary are very incomplete and any material of record at your headquarters is requested.\n\n2. The following information is furnished:\n\na. Records of this headquarters show that a Secret Radio TEGG No. 139 was transmitted to SCAP 3 November 1945 relative to this subject.\n\nb. Records of this headquarters show that a reply to the above radio, Secret, 54290, dated 042003 November 1945 was received but has been destroyed. A copy is desired.\n\nc. Records of this headquarters show that on 20 November 1945, approved proceedings of Board of Officers pertaining to establishment of National Defense of Korea, South of 38 Degree North Latitude with one (1) Inclosure were forwarded to GHQ AFPAC by General Schick. No record at this headquarters to show that proceedings of Board of Officers were returned or no copy retained on file.\n\nd. Records at this headquarters show reference to Top Secret or Secret Radio, SCAP this subject. A copy is desired. WX 92187 dated 110932Z January 1946, relative to this subject.\n\nFOR THE COMMANDING GENERAL:\n\nCHARLES ENNIS\nColonel, AGD Adjutant General\n\nTOP SECRET\n\n[0319면]\n(This page contains only scanning artifacts – SEKISUI JUSHI ruler, stray tick marks, garbled OCR fragments. No readable document content.)\n\n[0320면]\nDECLASSIFIED\nAuthority NND 886527\n\nTOP SECRET\nJBX/3.t 23 Jan 47 MEMO FOR RECORD:\n\n1. BASIC ACTIONS This action concerns USAFIK request for information relative to the establishment of Korean constabulary. USAFIK Letter IFAG 381, subject \"Establishment and Equipment of Korean Constabulary\", 14 Jan 47, specifically requests copy of CAX 54290, 4 Nov 45, and WX 92187 of 11 Jan 46. In addition, this letter states that USAFIK records on the above subject are very incomplete and any material of record is requested.\n\n2. A brief of the references involved in the establishment and equipment of Korean constabulary follows:\n\na. TFGCG 193, 3 Nov 45, advised SCAP of USAFIK belief that planning should begin regarding the establishment of Korean Military Forces.\n\nb. CAX 54290, 4 Nov 45, concurred in TFGCG 193 and requested CG USAFIK to submit his plan.\n\nc. Board of officers appointed for the purpose of making a study for the National Defense of Korea South of 38° North Latitude. These Board proceedings, file AG 381 (TFGCG), subject: \"Approved proceedings of Board of Officers Pertaining to Establishment of National Defense of Korea South of 38° North Latitude\", dated 20 Nov 45, were received in this Headquarters and radio CAX 55328 of 25 Nov 45 was forwarded to the War Department outlining USAFIK plan included in these proceedings. The Board proceedings were returned to G-3 by C/S for further consideration pending receipt of War Department reply.\n\nd. WX 92187 of 11 Jan 46 authorized arming of Korean National Civil Police and requested further information concerning their organization, equipment and functions. This radio also stated that the matter of establishing Korean national armed forces is closely allied to unsettled problems in connection with International commitments for implementing Korean independence and will therefore be deferred.\n\ne. CAX 56830 advised USAFIK that a copy of WX 92187 had been passed to them for information. This radio authorized USAFIK to proceed with armament of police force and requested information concerning\n\n[0321면]\nDECLASSIFIED\nAuthority NND 886527\n\nTOP SECRET\n\norganization and functions of civil police to serve as basis of reply to WX 92837.\n\nf. WX 92635, 12 Jan, suggested that Para 3d (8) Field Order #1, Hq USAFIK, 23 Dec, be deleted in view of WX 92887. This sub-paragraph directed that the Military Government of Southern Korea establish and maintain Korean military forces to insure the continuation of a free and independent nation in the family of nations. CAX 56889 of 13 Jan quoted WX 92635 to CG USAFIK and requested appropriate action be taken. TFGCT 1948, 19 Jan, advised that Para 3d (8) Field Order #1 had been rescinded and forwarded information requested by CAX 56830. This information was forwarded to WD by CAX 57249, 24 Jan 46.\n\n3. Nothing has occurred to change the status of national armed forces in Korea South of the 38° North Latitude. As stated in WX 92187, 11 Jan 46, action to establish such forces will be deferred pending settlement of problems connected with Korean independence. The Board Proceedings on this subject should therefore remain in suspense file.\n\n4. RECOMMENDED ACTION - Return of basic correspondence to USAFIK by 1st Indorsement forwarding for their information copies of the foregoing radios.\n\n5. RECOMMENDATION - Approval and dispatch of attached indorsement.\n\n6. COMPLETION - This completes G-3 action on USAFIK letter IFAG 381, dated 14 Jan 47, subject: \"Establishment and Equipment of Korean Constabulary\".\n\nAction Officer JOST - 22622\n\nTOP SECRET\n\n[0322면]\nDECLASSIFIED\nAuthority NND 886527\n\nOPERATIONAL PRIORITY\n3 November 1945\n\nTO : SCAP\nFROM : CO USAFIK\nNR : TFGCG 193 Believe time has come to formulate policies on and begin the establishment of Korean Military Forces. Private armies of unarmed veterans nationally inspired are beginning to spring up here. Best method of control is to divert energies into national channel under control. Consider best immediate action to be the establishment of a national constabulary for maintaining order on a national basis and from which Military forces may be expanded.\n\nThere are still undestroyed sufficient Japanese weapons saved for trophy purposes to partially arm a constabulary. Under current planning desire to establish early a policy for final armament and equipment of Korean forces. Even if available, it is believed unwise to use Japanese weapons for this purpose. Weapons are inferior, locally inadequate in quantity and their use will require continued manufacture in area of Japanese weapons, parts and ammunition. It is recommended that Korean constabulary and subsequent military forces be armed with surplus US weapons available here and elsewhere in Pacific from stock and category IV units.\n\nNO SIG\n\nMGN: 030524 Z ZUG B 39 DISTRIBUTION:\nACTION COPY TO:\nG-3\nINFORMATION COPIES TO:\nCOMMANDER-IN-CHIEF\nCHIEF OF STAFF\nG-1\nG-2\nORDNANCE\nC I GOVT SECT\n\nOPERATIONAL PRIORITY\nSECRET\n\n[0323면]\nDECLASSIFIED\nAuthority NND 846527\n\nSECRET\nGENERAL HEADQUARTERS\nUNITED STATES ARMY FORCES, PACIFIC\nSIGNAL CORPS MESSAGE\nGC-P SEO/ejd ONL PRIORITY 4 November 1945\nFROM: CINCAFPAC\nTO: CG USAFIK\n\nAM IN GENERAL ACCORD WITH YOUR TARE FOX GEORGE CHARLIE GEORGE\nLo ONE THREE NINE DATED THREE NOVEMBER PD (CAX 54290) PLEASE\nPREPARE AND SUBMIT YOUR PLAN MACARTHUR\n\nACTION:\nJGA\n\nAPPROVED:\nB. M. FITCH\nBrigadier General, U.S. Army Adjutant General APPROVED:\nUM GEORGE A. REIM\nfor W.E. CHAMBERS Brigadier General, G.S.C.\nAsst. Chief of Staff G-3 Copies to:\nCommander-in-Chief Chief of Staff\nG-2\nG-4\nOrd o C Govt Sect G-3 (Return)\n\nSECRET", "notes": [], "note": "기계 판독 참고 — Page 0316 OCR was completely garbled (mirror image or corrupt scan). Only the print header was partially recovered; no text content is readable. The attachment tabs (A, B, C, D, E) mentioned in the 6 July 1947 memo are not part of this chunk. / 0319면은 문서 내용이 완전히 판독 불가능했으며 스캔 인공물만 존재함. 0322면의 메시지 번호는 OCR에서 'T900G 139'로 읽혔으나, 본문 맥락과 0320면 참조에 따라 'TFGCG 193'으로 정정함. 0321면 'recommended appropriate'는 'recommended that appropriate'로 문맥을 따라 수정했으나 원문 그대로 유지했음. / 'TARE FOX GEORGE CHARLIE GEORGE Lo'는 음성통신용 철자 부호로 TFGCG로 재구성됨. 원문의 존재하지 않는 약어 'G-Д'는 획이 잘못 판독되어 'G-4'의 시릴문자 오기로 추정되나, 한국어 번역에는 원문 주석을 반영하여 'G-4'로 기술함. 'C Govt Sect'는 'Civil Government Section'으로 재구성.", "warn": false, "pages": ["0315", "0316", "0317", "0318", "0319", "0320", "0321", "0322", "0323"]}, {"id": "D054", "order": 53, "date": "1946-01-11", "group": "D", "eyebrow": "D054 · D. 장래 정책·철군", "title": "한국 국립 경찰 무장 요청 및 한국 국군 창설 보류", "badge": "TOP SECRET", "list_right": "0324–0326", "meta": [{"k": "발신", "v": "CINCAFPAC ADV", "txt": true}, {"k": "수신", "v": "WARCOS", "txt": true}, {"k": "참조", "v": "CINCAPPAC MANILA, CG, USAPIK", "txt": true}, {"k": "전문번호", "v": "NIX 92187"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0324–0326 (3면)"}, {"k": "건명", "v": "Withdrawal from Korea", "txt": true}], "summary": "Request to arm Korean National Civil Police and deferral of Korean National Armed Forces", "points": ["주한 미군 사령부는 1946년 1월까지 25,000명 규모의 한국 국립 경찰 무장을 위해 잉여 미군 장비 사용 권한을 요청함.", "주한 미군 사령관은 통제 불가능한 민간 무장 세력의 위협을 막기 위해 한국 국방군(육·해·공군 및 해안경비대) 창설이 필요하다는 견해를 피력함.", "연합국 신탁통치 기간 중 한국 군대 창설에 대한 상부의 조기 지침을 요청함.", "미 합참은 경찰 무장 요청은 승인했으나, 불확실한 국제 정세로 인해 한국 국군 창설 조치는 보류하고 해안경비대 임무에 대한 추가 정보를 요구함."], "primary": "[0324면]\n기밀해제\n권한 NND86527\n일급비밀\n\n사령부\n미국 육군 태평양 지역 사령부\n통신대 전문\n\nGC-P S50/ro2\n\n운영 우선순위 1945년 11월 25일\n\n발신: 극동 미 육군 총사령관 선발대\n수신: 육군부 참모차장\n참조: 마닐라 극동 미 육군 총사령부\n주한 미 육군 사령관\n\n제1부: 미국 점령 이후, 기존 정부 체계 내에서 경무장 한국 국립 경찰(경찰)의 재건이 미군 감독 하에 진행 중임. 이는 1945년 11월 3일자 귀 전문 W 806/5에 대한 회신임. (CAX 55238) 병력은 한국인으로 구성되며 1946년 1월 1일까지 계획 병력 25,000명에 도달할 것임. 경찰력의 지속적이고 강력한 발전 및 미군 무기와 장비로의 무장은 비상시 감독 및 증원을 제외한 한국 내 미군의 민간 경찰 기능을 덜어줄 것으로 믿음. 그러나 러시아와의 정세를 고려할 때, 해당 국가에 대한 최종 미국 정책이 결정될 때까지는 미군 2개 사단, 2개 항공단 및 지원 부대가 남한에 유지되어야 할 최소 병력임. 상기 개요대로 국내 재고 및 4종 보급 부대에서 가용한 잉여 미군 무기로 경찰력을 무장할 수 있는 권한을 요청함.\n\n제2부: 이와 관련하여 한국 군사력 창설에 관한 장기 정책 문제가 긴밀히 연관되어 필연적으로\n\n일급비밀\n\n[0325면]\n기밀해제\n권한 NND86527\n일급비밀\n\n검토되었음. 다음은 주한 미군 사령관의 견해임: \"민족주의적 영감을 받은 비무장 재향군인들의 사설 군대가 한국 내에서 생겨나기 시작했으며, 은밀히 또는 다른 방식으로 무장을 시도할 것이 확실함. 그러한 세력은 미군 철수 시 한국의 온전성에 위협이 될 것임. 가장 좋은 통제 방법은 한국인 지도부를 포섭하고 그들의 에너지를 미국의 통제 하에 국가적 경로로 전환하는 것임. 경찰 유형의 부대는 법 집행이라는 주요 임무의 지역적 성격과 관련 집단의 규모로 인해 문제에 대한 만족스러운 해결책을 제시하지 못함. 더 야심차지만 현실적인 계획은 완전한 한국 국방군(육군 및 항공군, 해군 및 해안경비대)을 창설하는 것임.\"\n\n그러한 계획은 궁극적인 한국 처리 방안을 위해 확립된 정책에 의해 필연적으로 좌우될 것임을 인지함. 따라서 연합국 신탁통치 기간 동안 한국에 어떤 국가 군대가 구상되고 있는지에 대한 조기 지침을 본 사령부에 제공해 주어, 현 시점에서 그러한 계획에 대한 추가 검토가 정당화되는지 여부를 결정할 수 있도록 요청함.\n\n공식:\n서명 /H. E. FITCH/\n미 육군 준장,\n부관.\n\n승인:\n서명 /George A. Rehm/\n서명 /C. A. RUSSELL/,\n참모장 예하 준장,\n참모처 차장, G-3.\n\n사본 발송 대상:\n총사령관\n참모장\nG-4 (3)\n정부 부서\n\nG-3 (반송)\n\n일급비밀\n\n[0326면]\n기밀해제\n권한 NND 846527\n일급비밀\n\n수신 전문\n일급비밀\n우선순위\n\n1946년 1월 11일\n\n수신: 도쿄 연합국 최고사령부 극동 미 육군 총사령관 (맥아더)\n발신: 워싱턴 (합동참모본부)\n\n전문 번호 NIX 92187\n\n국무부, 육군부 및 해군부는 귀하의 CAX 55238에 대해 다음과 같은 회신에 동의함: \"귀하의 요청대로 한국 국립 경찰을 미군 장비로 무장할 수 있는 권한을 부여함. 장비는 미군 프로젝트에 고용된 현지 민간인에게 제공되는 도구와 동일한 기준으로 제공되며, (1) 해당 경찰 병력의 임무 완료 시 또는 미군이 한국에서 철수할 때 중 먼저 발생하는 시점에 반환되거나, (2) 국제 신탁통치 설립 시 또는 완전히 독립된 한국 정부 수립 시 한국 행정부에 매각 또는 적절히 이관되어야 함.\"\n\n귀하가 한국 국립 경찰 병력을 위해 구상하는 기능. 제한된 전술 조직 및 훈련을 갖춘 경찰 부대 창설에 관해 귀하가 구상하는 조직, 장비 및 훈련에 대한 추가 정보를 요청함.\n\n한국 국군을 단독으로 창설하는 문제는 한국 독립 이행을 위한 국제적 공약과 관련된 미해결 문제들과 밀접하게 연관되어 있음. 따라서 그러한 병력 창설 조치는 보류될 것임. 이와 관련하여 제안된 해안경비대가 한국 해군의 핵심을 구성하기보다는 관례적인 연안 순찰 및 경찰 기능으로 제한되는지 여부에 대한 정보를 요청함.\"\n\n서명 없음\n발신 시간: 092143Z\n통신 통제 번호: SD 2\n주: 이 전문은 주한 미군 사령관과 마닐라 극동 미 육군 총사령부에 재발송하기 위해 통신 센터로 전달되었음.\n\n배부:\n조치 사본: G-3\n참고 사본 배부 대상:\n참모장\nG-2\n총사령관\n정부 부서\n\n총사령관\n\n일급비밀 우선순위\n\n본 전문 및 동일 등급의 통신문의 평문 취급 및 전송은 1944년 3월 15일자 육군 규정 380-5의 11g항 및 53a항 (3) (변경 번호 3) 규정에 따라 육군부에 의해 승인되었음.\n\n일급비밀", "secondary": "[0324면]\nDECLASSIFIED\nAuthority NND86527\nTOP SECRET\n\nGENERAL HEADQUARTERS\nUNITED STATES ARMY FORCES, PACIFIC\nSIGNAL CORPS MESSAGE\n\nGC-P S50/ro2\n\nOPNL PRIORITY 25 NOVEMBER 1945\n\nFROM: CINCAFPAC ADV\nTO: WARCOS\nINFO: CINCAPPAC MANILA CG, USAPIK Part 1: Since United States Occupation, rehabilitation of lightly armed Korean National Civil Police Force within existing structure of government has been in progress under United States supervision, reur W 806/5 of 3 November 1945. (CAX 55238) Force is composed of Koreans and will reach a planned strength of 25000 by 1 January 1946. Believe that continued vigorous development of force and equipping it with United States arms and equipment will relieve United States Forces of Civil Police functions in Korea other than supervision and reinforcement in emergency. However, in view of situation vis a vis Russia, two United States Divisions, two air groups, and supporting troops, comprise the minimum force that should be retained in South Korea until final United States policy with respect to that country is determined. Request authority to equip Police Force as outlined above with surplus United States weapons available here in stock and from class IV units.\n\nPart 2: In this connection closely related question of long range policy concerning establishment of Korean Military Forces has necessarily\n\nTOP SECRET\n\n[0325면]\nDECLASSIFIED\nAuthority NND86527\nTOP SECRET\n\nreceived consideration. Following are views of Commanding General USAPIK on subject: \"Private armies of unarmed veterans nationally inspired are beginning to spring up in Korea and will undoubtedly make every effort to arm secretly or otherwise. Such forces will be a threat to the integrity of Korea upon the withdrawal of United States Forces. Best method of control is to capture Korean leadership and divert energies into national channel under United States Control. Police type force does not offer satisfactory solution to problem due to the local nature of its primary mission of law enforcement and the size of the groups involved. A more ambitious but realistic program would be the establishment of complete Korean national defense forces (Army and Air, Navy and Coast Guard).\"\n\nIt is realized that such a program must necessarily be governed by policies established for the ultimate disposition of Korea. Consequently it is requested that this Headquarters be furnished early guidance as to what if any national armed forces are contemplated for Korea during the period of the Allied trusteeship in order to determine whether or not further consideration of such a plan is warranted at this time.\n\nOFFICIAL:\n/s/ H. E. FITCH\nBrigadier General, U.S. Army, Adjutant General.\n\nAPPROVED:\n/s/ George A. Rehm\n/s/ C. A. RUSSELL,\nBrigadier General, G.S.C., Asst. Chief of Staff, G-3.\n\nCOPIES TO:\nCinc\nC/S\nG-4 (3)\nGov Section G-3 (Return)\n\nTOP SECRET\n\n[0326면]\nDECLASSIFIED\nAuthority NND 846527\nTOP SECRET\n\nINCOMING MESSAGE\nTOP SECRET\nPRIORITY\n\n11 January 1946\n\nTO: GHQ TOKYO CINCAPPAC (MACARTHUR)\nFROM: WASHINGTON (JOINT CHIEFS OF STAFF)\n\nNR NIX 92187\n\nState, War and Navy Departments have agreed to the following reply to your CAX 55238: \"Authority is granted to arm Korean National Civil Police with U.S. equipment as requested by you. Equipment will be provided on the same basis as tools furnished to indigenous civilians employed on projects for U.S. forces and should be (1) Returned on completion of mission of this police force or at the time U.S. forces evacuate Korea, whichever occurs first, or (2) Sold or otherwise appropriately transferred to the Korean administration at the time of establishment of an International trusteeship or the establishment of a completely independent Korea.\n\nFunctions contemplated by you for the Korean Civil Police force. Further Information is requested as to the organization, equipment, and training you contemplate the establishment of Police units with limited tactical organization and training.\n\nThe matter of establishing Korean National armed forces singly is closely allied to unsettled problems connected with International commitments for implementing Korean independence. Action to establish such force will therefore be deferred. In this connection information is requested as to whether the proposed coast guard will be limited to customary inshore patrol and police functions rather than constituting a nucleus of a Korean Naval force.\"\n\nNO SIG\nREPT TOO: 092143Z\nMCN: SD 2 NOTE: This message has been passed to Signal Center for re-dispatch to CG USAPIK and CINCAPPAC MANILA for Information.\n\nDISTRIBUTION:\nAction copy to G-3 Information copies to:\nCHIEF OF STAFF\nG-2\nCOMD CINC\nGOVT SECT\n\nCOMMANDER-IN-CHIEF\n\nTOP SECRET PRIORITY\n\nHandling and transmission of the literal plain text of this message and correspondence of the same classification has been authorised by the War Department in accordance with the provisions of paragraphs 11g and 53a (3) (Changes No. 3) of AR 380-5, 15 March 1944.\n\nTOP SECRET", "notes": [], "note": "기계 판독 참고 — Declassification authority on page 0326 reads 'NND 846527' instead of 'NND86527' as on other pages, preserved as in OCR.", "warn": false, "pages": ["0324", "0325", "0326"]}, {"id": "D055", "order": 54, "date": "1946-01-11", "group": "X", "eyebrow": "D055", "title": "미 잉여 장비를 사용한 한국 경찰 무장 계획", "badge": "TOP SECRET", "list_right": "0327–0327", "meta": [{"k": "발신", "v": "CINCAFPAC ADV", "txt": true}, {"k": "수신", "v": "CG USAFIK", "txt": true}, {"k": "참조", "v": "CINCAFPAC MANILA", "txt": true}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0327–0327 (1면)"}, {"k": "건명", "v": null, "txt": true}], "summary": "Armament of Korean police force with surplus US equipment", "points": ["1946년 1월 11일, 미 육군 태평양 전력 사령부는 주한 미군 사령관에게 잉여 미군 장비를 활용한 한국 경찰 무장을 재량껏 진행하라고 지시했다.", "육군부의 추가 정보 요청에 대비해 민간 경찰의 조직, 장비, 기능 및 제안된 해안 경비대에 관한 정보를 요청했다."], "primary": "[0327면]\n비밀해제\n권한 NND886527\n\n2급 비밀 (TOP SECRET)\n\n사령부\n미 육군 태평양 전력\n통신대 전문\n\n1946년 1월 11일\n\nOPNI PRIORITY (작전우선)\n\n발신: CINCAFPAC ADV (미 육군 태평양 전력 사령관 전진)\n수신: CG USAFIK (주한 미 육군 사령관)\n정보참조: CINCAFPAC MANILA (미 육군 태평양 전력 사령관 마닐라)\n\n참고 전달: WILLIAM XRAY 92187호, 1월 11일. 재참조 CHARLIE ABLE XRAY 55238 PD.\n( CAX 56830 ) WILLIAM XRAY 92187호에서 승인된 바와 같이 귀관의 재량에 따라\n미국 잉여 장비를 사용한 경찰력 무장을 진행할 것. 문단: 민간 경찰력의 조직,\n장비 및 기능과 제안된 해안 경비대의 기능에 관한 추가 정보를 요청하는\n육군부 조회에 대한 회신의 기초가 되도록 정보를 요청할 것.\n\n공식: 승인:\nB. I. PRICE                  C. A. RUSSELL\n미 육군 준장                 미 육군 준장\n부관감                      참모차장, G-3\n\n2급 비밀 (TOP SECRET)", "secondary": "[0327면]\nDECLASSIFIED\nAuthority NND886527\n\nTOP SECRET\n\nGENERAL HEADQUARTERS\nUNITED STATES ARMY FORCES, PACIFIC\nSIGNAL CORPS MESSAGE\n\n11 JANUARY 1946\n\nOPNI PRIORITY\n\nFROM: CINCAFPAC ADV\nTO : CG USAFIK\nINFO: CINCAFPAC MANILA\n\nPASSED TO YOU FOR INFORMATION IS WILLIAM XRAY NINE-TWO ONE EIGHT SEVEN CHA\nONE ONE JANUARY CMA REFOURAD CHARLIE ABLE XRAY FIVE FIVE TWO THREE EIGHT PD\n( CAX 56830 ) PROCEED WITH ARMAMENT OF POLICE FORCE WITH SURPLUS UNITED\nSTATES EQUIPMENT AT YOUR DISCRETION AS AUTHORIZED BY WILLIAM XRAY NINE TWO\nONE EIGHT SEVEN PARA REQUEST INFORMATION TO SERVE AS BASIS FOR REPLY TO WAR\nDEPARTMENT QUERIES FOR FURTHER INFORMATION CONCERNING ORGANIZATION CMA\nEQUIPMENT AND FUNCTIONS OF CIVIL POLICE FORCE AND FUNCTIONS OF PROPOSED\nCOAST GUARD\n\nOFFICIAL: APPROVED:\nB. I. PRICE                  C. A. RUSSELL\nBrigadier General, U.S. Army Brigadier General, U.S.C. Adjutant General            Asst, Chief of Staff, G-3\n\nTOP SECRET", "notes": [], "note": "기계 판독 참고 — 연도가 1946으로 판독되나, 해당 문서군의 시기(1947-1948) 및 내용상 1946년 초 주둔 초기 단계의 건으로 보임. 전문 최상단 연도가 명확하지 않아 OCR 그대로 기재함. 일부 암호명(WILLIAM XRAY, CAX 호출부호)은 판독이 불완전하나 원문 그대로 보존함.", "warn": false, "pages": ["0327"]}, {"id": "D056", "order": 55, "date": "1946-01-13", "group": "X", "eyebrow": "D056", "title": "JCS 전문(WX) 92635호를 송부하며, USAFIK 야전명령 제1호 문단 삭제 및 한국군 승인 보류에 관한 전달표지", "badge": "TOP SECRET", "list_right": "0328–0328", "meta": [{"k": "발신", "v": "CINCAFPAC ADV", "txt": true}, {"k": "수신", "v": "CG USAFIK", "txt": true}, {"k": "참조", "v": "CINCAFPAC MANZLA", "txt": true}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "cover"}, {"k": "면", "v": "0328–0328 (1면)"}, {"k": "건명", "v": null, "txt": true}], "summary": "Routing slip for forwarding JCS (WX) cable 92635 regarding deletion of paragraph from USAFIK Field Order No. 1 and deferred approval of Korean military force", "points": ["1948년 1월 12일자 JCS 전문(WX 92635)을 주한미군사령관(CG USAFIK)에게 송부하는 문서이다.", "JCS 전문의 요지는 12월 23일자 USAFIK 야전명령 제1호 제3항D(8)의 삭제를 건의하고 한국군 창설 승인이 보류되었음을 통보하는 것이다.", "본 문서는 전문의 전문(全文)을 전달하는 표지(routing slip) 역할이며, 수신 측에 적절한 후속 조치를 요청하고 있다."], "primary": "[0328면]\n비밀해제\n권한 NND 886527\n2급비밀(TOP SECRET)\n\n총사령부\n미 육군 태평양 전력\nGC-P JTS/ejd\n통상 1948년 1월 13일\n\n발신: CINCAFPAC ADV (미극동육군총사령부 선발대)\n수신: CG USAFIK (주한미군사령관)\n참조: CINCAFPAC MANILA\n\n육군부 전문 윌리엄 엑스레이 구이육삼오 차 1월 12일\n내용 전문 발췌 인용구 참조 윌리엄 엑스레이 구이\n일팔칠 건의사항 12월 23일\n야전명령 제1호 본부 엉클 슈가 에이블 폭스 아이템 킹 제3항 디(8)\n삭제 바 (CAX 56889) 윌리엄 엑스레이 구이일팔칠\n한국군 승인 보류 바 인용구 끝. 적절한\n조치 요망.\n\n공식: 승인됨\n\n9L\nBF 리치 C. A. 러셀\n[서명]\n미 육군 준장\n부관감\n[서명]\n준장, 참모장교단\n인사·작전참모차장(G-3)\n\n8L\n배부처:\n[판독불가]\nG-3 (반납)\n\n0Z\n2급비밀(TOP SECRET)\n9Z", "secondary": "[0328면]\nDECLASSIFIED\nAuthority NND 886527\nTOP SECRET\n\nGENERAL HEADQUARTERS\nUNITED STATES ARMY FORCES, PACIFIC GC-P JTS/ejd\nROUTINE 13 JANUARY 1948\n\nFROM: CINCAFPAC ADV\nTO : CG USAFIK\nINFO: CINCAFPAC MANILA\n\nWAR DEPARTMENT RADIOGRAM WILLIAM XRAY NINE TWO SIX THREE FIVE CHA TWELVE\nJANUARY CMA READS AS FOLLOWS COLON QUOTE REFERENCE WILLIAM XRAY NINE TWO\nONE EIGHT SEVEN SUGEST PARAGRAPH THREE DOG PAREN EIGHT PAREN FIELD ORDER\nNUMBER ONE HEADQUARTERS UNCLE SUGAR ABLE FOX ITEM KING TWO THREE DECEMBER\nBE DELETED PD (CAX 56889) WILLIAM XRAY NINE TWO ONE EIGHT SEVEN\nDEFERRED APPROVAL OF KOREAN MILITARY FORCE PD UNQUOTE DESIRE APPROPRIATE\nACTION\n\nOFFICIAL: APPROVED 9L\nBF RIICH C. A. RUSSELL\n[signed]\nBrigadier General, U.S. Army Adjutant General\n[signed]\nBrigadier General, G.S.C.\nAsst. Chief of Staff, G-3 8L Copies to:\n[illegible]\nG-3 (Return)\n\n0Z\nTOP SECRET\n9Z", "notes": [], "note": "기계 판독 참고 — OCR year corrected from 1946 to 1948 based on context and content referencing events in December (of prior year). 'MANZLA' corrected to 'MANILA'. 'UNCLE SUAR' corrected to 'UNCLE SUGAR'. 'EIGHT BEGHT SEVEN' corrected to 'EIGHT SEVEN'. Numerical message reference 'NINE IWO ONE BEGHT SEVEN' reconstructed as 'NINE TWO ONE EIGHT SEVEN'. 'EIORT' corrected to 'EIGHT'. 'BI FIICH' and adjacent signatures are partially garbled; reconstructed as 'BF RIICH C. A. RUSSELL' based on typical routing slip format.", "warn": false, "pages": ["0328"]}, {"id": "D057", "order": 56, "date": "1946-01-19", "group": "D", "eyebrow": "D057 · D. 장래 정책·철군", "title": "경찰 기능 이양을 위한 한국 국립 민간 경찰(정규, 경비대, 해안 경비대)의 무장 및 편성 계획", "badge": "TOP SECRET", "list_right": "0329–0330", "meta": [{"k": "발신", "v": "CO XXIV CORPS", "txt": true}, {"k": "수신", "v": "CINCATPAC ADV", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "TFOOT 1948 (or similar, see en)"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0329–0330 (2면)"}, {"k": "건명", "v": "Future Policy in Korea", "txt": true}], "summary": "Arms and organization of the Korean National Civil Police (Regular, Guard, Coast Guard) for transition of police functions", "points": ["한국 국립 민간 경찰은 미군 무기로 무장하며, 향후 장비는 한국 행정부에 매각 또는 이전될 것임.", "경찰 조직은 정규 경찰(25,000명), 경찰 경비대(25,000명, 8개 단), 해안 경비대로 편성 중임.", "경찰 경비대는 국가 경찰 기능과 정규 경찰의 예비 전력 역할을 수행하며, 내부 소요 진압을 목적으로 함.", "이 경찰 조직 편성은 현재 주둔 중인 미군의 경찰 임무를 대체하기 위한 것임."], "primary": "[0329면]\n기밀해제\n기관 NND8X6527\n2급 비밀 (TOP SECRET)\n수신 전문\n2급 비밀 (TOP SECRET)\n우선 (PRIORITY)\nUM 1946년 1월 19일\n수신 : CINCATPAC ADV\n발신 : 제24군단 사령관 (CO XXIV CORPS)\n전문 번호 : TFOOT 1948\n\n귀관의 무선 전문 CAX 56889 3D(8) FO 1항 참조. 1, SAFIK는 1946년 1월 15일 철회되었음.\n\n귀관의 무선 전문 CAX 56830 및 합동참모본부(JCS) 무선 전문 WX 92187 참조. 한국 국립 민간 경찰은 참조 무선 전문들에 명시된 바와 같이 승인된 미군 무기로 무장되며, 이에 근거하여 시행될 것임. 이에 사용된 모든 미군 장비를 추후 적절한 날짜에 한국 행정부에 매각하거나 달리 이전하는 방안을 제안함.\n\n2. 경찰국(National Bureau of Police)으로 대표되는 한국 국립 민간 경찰은 현재 정규 경찰, 국립 경찰 경비대(군대식 조직), 해안 경비대의 세 부분으로 편성 중임.\n\n3. 정규 경찰은 경찰국장에 의해 각 도 경찰청장에게 배정되며, 도 경찰청장은 법과 질서 유지를 목적으로 인구 밀도와 지역 요구에 따라 경찰을 군(郡)에 배치함. 계획된 정원은 25,000명임.\n\n4. 경찰 경비대는 정규 경찰과 별도로 약 25,000명의 병력을 보유하게 되며 추가 배치됨. 경찰 경비대는 8개 단(group)으로 구성되며, 남조선의 8개 주요 도에 각 1개 단이 배치됨. 각 단은 단 본부와 3개 중대(squadron)로 구성되며, 중대는 중대 본부와 4개 대(troop)로 구성됨. 경찰 경비대는 일반적으로 국가 경찰의 기능을 수행하며, 광범위한 내부 소요 및 재난에 대처할 수 있도록 훈련 및 대비된 정규 경찰의 예비 전력을 구성할 것임.\n\n우선 (PRIORITY)\n2급 비밀 (TOP SECRET)\n41249\n\n[0330면]\n기밀해제\n기관 NND86527\n2급 비밀 (TOP SECRET)\n수신 전문\n2급 비밀 (TOP SECRET)\n우선 (PRIORITY)\n제24군단, 1946년 1월 19일자 무선 전문 TFOOT 1948. 이어서:\n\n5. 이 임무를 달성하기 위해 경찰 경비대 부대는 전략적·군수적 고려 사항에 따라 각 도 내에 배치되며, 지속적인 훈련이 이루어질 것임.\n\n6. 해안 경비대는 현재 경찰국 산하에 편성되었으며, 연안 순찰 및 경비라는 단일 임무와 목적을 수행할 것임.\n\n7. 정규 경찰 및 경찰 경비대 병력은 권총, 카빈 소총(carbine) 및 소총(rifle)으로 훈련받고 부분적으로 무장할 것임. 경찰 경비대의 일부 부대는 이후 경기관총(light machine gun)으로 무장할 수도 있음. 경찰국 산하 세 부서에 필요한 장비 및 보급품에 대한 세부 조사가 진행 중이며, 조사 결과는 귀 사령부에 제출될 것임.\n\n8. 상술된 경찰국은 남조선 내 법과 질서 유지 및 재산 보호에 필수적이며, 이 조직은 현재 경찰 기능을 수행 중인 미군을 대체할 수 있을 것으로 판단됨.\n\n서명 없음\n발신 시각 (TOO) : 1914,15 I\n전문 통제 번호 (MON) : TJC A 15\n\n배포: \n참조 사본 송부 대상:\n총사령관\n참모장\nG-3\nG-1\n정무과 (Govt Sect)\n\n41249\n본 메시지의 문자 그대로의 평문을 동일 등급의 통신문으로 취급 및 전달하는 것은 AR 380-5, 1944년 3월 15일 변경 제3호, 문단 1ug 및 53a(3)항의 규정에 따라 전쟁부에 의해 승인되었음.\n\n2급 비밀 (TOP SECRET)", "secondary": "[0329면]\nDECLASSIFIED\nAuthority NND8X6527\nTOP SECRET\nINCOMING MESSAGE\nTOP SECRET\nPRIORITY\nUM 19 JAN 46\nTO : CINCATPAC ADV\nFROM : CO XXIV CORPS\nNR : TFOOT 1948 Reference your radio CAX 56889 Par 3D (8) FO 1, I SAFIK, has been rescinded 15 Jan 46.\n\nReference your radio CAX 56830 and Joint Chiefs of Staff radio WX 92187. Korean National Civil Police will be armed with US weapons as authorized and on the basis as outlined in reference radios. It is proposed to sell or otherwise arrange an appropriate transfer date of all US equipment, so used, to the Korean Administration at a later date.\n\n2. The Korean National Civil Police, represented in the National Bureau of Police, is now being organized to contain 3 parts: The Regular Police, the National Police Guard (Constabulary type organization) and the Coast Guard.\n\n3. The Regular Police is allocated by the Director of the Police Bureau to Provincial Chiefs of Police who in turn deploy the police to guns (counties) in accordance with population density and local requirements for the purpose of maintaining law and order. The planned strength is 25,000.\n\n4. The Police Guard will have approximately 25,000 personnel, separate and in addition to the regular Police. The Police Guard will consist of 8 groups, 1 located in each of the 8 Major Provinces of Southern Korea. Each group will be composed of a group hq and 3 squadrons: squadrons will consist of squadron hq and 4 troops. The Police Guard will perform the functions, generally, of State Police and will constitute for the regular Police a reserve force trained and prepared to cope with widespread internal disorders and catastrophes.\n\nPRIORITY\nTOP SECRET\n41249\n\n[0330면]\nDECLASSIFIED\nAuthority NND86527\nTOP SECRET\nINCOMING MESSAGE\nTOP SECRET\nPRIORITY\nGC XXIV CORPS, RADIO TFOOT 1948 DATED 19 JANUARY 46. CONTINUED:\n\n5. To accomplish this mission elements of the Police Guard will be located within provinces in accordance with strategic and logistical considerations where training will be continuous.\n\n6. The Coast Guard has now been organized under the Bureau of Police and will perform the sole mission and purpose of inshore patrol and police.\n\n7. The regular and the police guard forces personnel will be trained and partially armed with the pistol, carbine and the rifle. Some elements of the Police Guard may be later armed with the light machine gun. A detailed survey of further requirements for equipment and supplies for the 3 departments of the Bureau of Police is underway and will be submitted to your headquarters.\n\n8. It is felt that the Bureau of Police, as described, is necessary for the maintenance of law and order and protection of property in Southern Korea and that this organization will be capable of relieving US troops now performing police functions.\n\nNO SIG\nTOO : 1914,15 I MON : TJC A 15 DISTRIBUTION:\nINFORMATION COPIES TO:\nCOMMANDER-IN-CHIEF\nCHIEF OF STAFF\nG-3\nG-1\nGovt Sect 41249 Handling and transmission of the literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 1ug and 53a\n(3) (Changes No. 3 of AR 380-5, 15 March 1944.\n\nTOP SECRET", "notes": [], "note": "기계 판독 참고 — 일부 OCR 오류를 문맥에 따라 수정함. 예: 'guns'는 'guns'의 오기로 판단되어 'guns (counties)'(군)으로 정정. '1ug'는 '1a' 또는 유사 조항 번호의 오독 가능성이 있으나 원문 그대로 유지함.", "warn": false, "pages": ["0329", "0330"]}, {"id": "D058", "order": 57, "date": "1946-01-24", "group": "D", "eyebrow": "D058 · D. 장래 정책·철군", "title": "한국 민간 경찰력 및 해안경비대 조직과 기능, 병력 교체 및 보급 관련 답신", "badge": "TOP SECRET", "list_right": "0331–0334", "meta": [{"k": "발신", "v": "CINCAFPAC ADV", "txt": true}, {"k": "수신", "v": "WARCOS", "txt": true}, {"k": "참조", "v": "CO, USAFIK; CINCAFPAC MANILA", "txt": true}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0331–0334 (4면)"}, {"k": "건명", "v": "Future Policy in Korea", "txt": true}], "summary": "Organization and functions of Korean civil police force and coast guard, with comments on troop replacements and supplies", "points": ["한국 경찰 병력 증원 및 장비 보강: 정규 경찰과 별도로 8개 연대 규모의 경비대(25,000명) 및 해안 경비대 창설 계획을 구체적으로 명시하고 있으며, 병력 충원과 무장 계획(경기관총 포함)도 포함됨.", "극동 미군 사령부의 자원 부족: CINCAFPAC은 1946년 11월 예정된 병사 교체는 가능하지만, 장교 증원과 추가 식량 지원은 가용 자원이 없어 불가하다고 답변함.", "고위급 외교적 해결 촉구: 한국 문제를 최고 정부 차원에서 해결해야 한다는 제안에 동의하며, 현지 군사적 조치만으로는 한계가 있음을 시사."], "primary": "[0331면]\n기밀해제:\n권한 NND886527\n대외비(TOP SECRET)\n미국 육군 태평양 총사령부\n통신대 전문\nOC-P\n우선 1946년 1월 24일\n발신: CINCAFPAC ADV\n수신: WARCOS\n참조: CO, USAFIK\nCINCAFPAC 마닐라\n\n귀신 WX 92187 관련 한국 민간 경찰력의 조직과 기능을 주제로 함. (CAX 57249) 현재 북위\n38도선 이남 한국의 중앙정부 내에서 경무국으로 대표되는 한국 국립 민간 경찰은\n정규 경찰, 국가 경찰 경비대(헌병대 유형 조직) 및 해안경비대의 세 부분으로\n조직되고 있음.\n정규 경찰은 경무국장에 의해 각 도 경찰 책임자에게 배정되며, 이들은\n인구 밀도와 지역 요구에 따라 치안 유지 목적으로 경찰을 군(郡)에 배치함.\n계획 병력은 25,000명임.\n경찰 경비대는 정규 경찰과 별도로 약 25,000명의 인원을 보유하게 되며,\n남한의 8개 주요 도마다 1개씩 총 8개 단으로 구성될 예정임. 각 단은\n단 본부와 3개 중대로 편성되며, 중대는 중대 본부와 4개 소대로 구성됨.\n\n[0332면]\n대외비(TOP SECRET)\n경찰 경비대는 일반적으로 주 경찰의 기능을 수행하며,\n광범위한 내부 소요와 재난에 대처할 수 있도록 훈련되고 준비된\n정규 경찰의 예비 부대를 구성할 것임. 이 임무를 달성하기 위해\n경찰 경비대 부대는 지속적인 훈련이 가능한 전략적·병참적 고려에 따라\n도 내에 배치될 것임.\n해안경비대는 경무국 산하에서 조직되고 있으며,\n연안 순찰 및 경비라는 유일한 임무와 목적을 수행할 것임.\n정규 경찰과 경찰 경비대 인원은 권총, 기병총, 소총으로 훈련 및\n부분 무장을 갖출 것임. 경찰 경비대 일부 부대는 추후 경기관총으로\n무장할 수도 있음.\n경무국 산하 세 부서에 대한 추가 장비 및 보급품 소요에 대한\n상세 조사가 진행 중이며, 권고안이 제출될 것임. 상기 정의된\n경찰 경비대의 포함이 남한의 법과 질서 유지 및 재산 보호에\n필요하다고 판단됨.\n마지막 문장 CA 57159, 1946년 1월 23일에서 언급된 모병은\n경찰 경비대 인원을 말함.\n귀신 WX 92635 문단 3d (8) 야전 명령 1호, USAFIK 사령부\n1월 15일자는 철회되었음.\n공식:\n/s/ R. M. PITCH,                 승인:\n미국 육군 준장,                   /s/ Bali. Bidwell\n부관.                             C. A. RUSSELL,\n                                  미국 육군 준장,\n                                  참모차장보, G-3\n배포:\nG-3 참모장(2) G-1(3) 정부과 반환) -2-\n대외비(TOP SECRET)\n\n[0333면]\n기밀해제\n권한 NND886527\n대외비(TOP SECRET)\nG-3/S PJ/wrb\n1946년 11월 1일 교체\n발신: CINCAFPAC\n수신: NDOSA PAREN NDOPO PAREN 011253\n참조: CG. USAFIK\nW84240\nPAREN Xo 6.85 3 PAREN 귀신 윌리엄 사이트 귀측 240 관련\n10월 30일 귀측 찰리 66691은 단순 정보 제공용으로,\n조치용이 아니었음. 귀 요청에 따라 호지스 장군의\n160개 권고 사항에 대해 순차적으로 다음 의견을 밝힘.\n본 사령부는 11월 극장 도착 교체 병력 배정을 조정하여\n1946년 11월 30일 기준으로 주한 미군의 3/OBOE 대비(약 100%)\n병사 충원을 목표로 조치하였음. 장교 병력은 극장 내\n전보 불가로 인해 한국에서 증원 불가함을 재차 밝힘.\nBAKER: 본 사령부는 이미 제공되었거나 제공 예정인 식량 외에\n추가 식량을 한국에 공급할 자원이 없음. CHARLIE:\n한국 문제 해결을 위한 최고 정부 차원의 대책이 필요하며,\n이를 지속 추진해야 한다는 제안에 동의함.\nJGA 12 맥아더\n공식:\nJOHN B. COOLEY A.G.D.\n부관\n배포:\n총사령관\n참모장\nG-3 (반환 2)\n동일 등급의 서신으로 본 전문의 축자적 평문 취급 및 전송은\n육군부에 의해 1946년 3월 6일 문단 10-c, 18-E, 53-A 및\n60-A (1) (2) (3) (4), 53-D (1) (3) (4)에 따라 승인되었음.\n비밀(SECRET)\n\n[0334면]\n대외비(TOP SECRET)\n111/ 2쪽 ////\n한국 문제 해결을 위한 최고 정부 차원의 대책이 필요하며,\n이를 지속 추진해서는 안 된다는 PD\nJGA 12 맥아더\n공식:\nJOHN B. COOLEY A.G.D.\n부관\n배포:\n총사령관\n참모장\nG-3 (반환 2)\n동일 등급의 서신으로 본 전문의 축자적 평문 취급 및 전송은\n육군부에 의해 1946년 3월 6일 승인되었음.\n비밀(SECRET)", "secondary": "[0331면]\nDECLASSIFIED:\nAuthority NND886527\nTOP SECRET\nUNITED STATES ARMY FORCES, PACIFIC GENERAL HEADQUARTERS\nSIGNAL CORPS MESSAGE\nOC-P\nPRIORITY 24 JANUARY 1946\nFROM: CINCAFPAC ADV\nTO : WARCOS\nINFO: CO, USAFIK\nCINCAFPAC MANILA\n\nOrganisation and functions of Korean civil police force reur WX 92187 is subject. (CAX 57249) The Korean National Civil Police, represented in the National Government in Korea south of the 38 degrees North Latitude by the Bureau of Police, is now being organized to contain three parts: the Regular Police, the National Police Guard (Constabulary type organisation) and the Coast Guard. The Regular Police is allocated by the Director of the Police Bureau to provincial chiefs of police who in turn deploy the police to guns (counties) in accordance with population density and local requirements for the purpose of maintaining law and order. Their planned strength is 25000.\nThe Police Guard will have approximately 25000 personnel, separate from and in addition to the Regular Police. The Police Guard will consist of eight groups, one located in each of the eight major provinces of Southern Korea. Each group will be composed of a group headquarters and three squadrons; squadrons will consist of squadron headquarters and four troops. The Police Guard will in general perform the functions of\n\n[0332면]\nTOP SECRET\nState Police and will constitute for the Regular Police a reserve force trained and prepared to cope with widespread internal disorders and catastrophes. To accomplish this mission elements of the Police Guard will be located within provinces in accordance with strategic and logistical considerations where training will be continuous. The Coast Guard is being organized under the Bureau of Police and will perform the sole mission and purpose of inshore patrol and police. The Regular Police and the Police Guard personnel will be trained and partially armed with the pistol, carbine and the rifle. Some elements of the Police Guard may be later armed with the light machine gun. A detailed survey of further requirements for equipment and supplies for the three departments of the Bureau of Police is underway and recommendations will be submitted to you. It is believed that the inclusion of the Police Guard as defined above is necessary for the maintenance of law and order and protection of property in Southern Korea. Recruiting cited in last sentence CA 57159, 23 January 1946 refers to personnel for Police Guard.\nReur WX 92635 paragraph 3d (8) field order one, Headquarters USAFIK on 15 January was rescinded.\nOFFICIAL:\n/s/ R. M. PITCH,                 APPROVED:\nBrigadier General, U.S. Army,     /s/ Bali. Bidwell Adjutant General.                 C. A. RUSSELL, Brigadier General, U.S.C., Asst. Chief of Staff, G-3 Copies to:\nG-3 c/s (2) G-1 (3) Govt Sect Return) -2-\nTOP SECRET\n\n[0333면]\nDECLASSIFIED\nAuthority NND886527\nTOP SECRET\nG-3/S PJ/wrb Replacement 1 November 1946\nFROM: CINCAFPAC\nTO : NDOSA PAREN NDOPO PAREN 011253\nINFO: CG. USAFIK\nW84240\nPAREN Xo 6.85 3 PAREN REUR WILLIAM SIGHT YOUR TWO FOUR ZERO OF\nTHREE ZERO OCTOBER PD OUR CHARLIE SIX SIX SIX NINE ONE WAS INTENDED\nMERELY FOR INFORMATION AND NOT FOR ACTION PD IN ACCORDANCE WITH YOUR\nREQUEST THE FOLLOWING COMMENTS ARE MADE SERIATIM ON GENERAL HODGES' 160\nRECOMMENDATIONS CIN ABLE PD THIS HEADQUARTERS HAS TAKEN MEASURES TO\nADJUST ASSIGNMENT OF NOVEMBER REPLACEMENTS ARRIVING IN THEATER SO THAT\nAPPROXIMATELY ONE ZERO ZERO PERCENT THREE SLASH OBOE STRENGTH ENLISTED\nMEN WOULD BE IN KOREA THREE ZERO NOVEMBER ONE NINE FOUR SIX PD OFFICER\nSTRENGTH CANNOT REPEAT NOT BE AUGMENTED IN KOREA OWING TO NON DASH\nAVAILABILITY IN THEATER FOR TRANSFER PD BAKER PD NO RESOURCES ARE\nAVAILABLE TO THIS HEADQUARTERS FOR SUPPLYING FOOD IN ADDITION TO THAT\nALREADY FURNISHED AND PLANNED TO BE FURNISHED TO KOREA PD CHARLIE PD\nCONCUR IN THIS SUGGESTION THAT REPEAT THE HIGHEST GOVERNMENTAL PLANE\nSOLVE THE KOREAN PROBLEM AND THAT IT SHOULD NOT BE NEED TO CONTINUE TO\nDRIPE PD\nJGA 12 MAC ARTHUR\nOFFICIAL:\nJOHN B. COOLEY A.G.D.\nAdjutant General DISTRIBUTION:\nC-in-C\nC/S\nG-3 (Return 2)\nHandling and transmission of literal plain text of this message as correspondence of the same classification in accordance with the provisions of paragraphs 10-c, 18-E, 53-A and 60-A (1) (2) (3) (4), 53-D (1) (3) (4), has been authorized by the War Department, 6 March 1946.\nSECRET\n\n[0334면]\nTOP SECRET\n111/ PAGE 2WO ////\nHIGHEST GOVERNMENTAL PLANE TO SOLVE THE KOREAN PROBLEM AND THAT IT\nSHOULD NOT BE NEED TO CONTINUE TO DRIPE PD\nJGA 12 MAC ARTHUR\nOFFICIAL:\nJOHN B. COOLEY A.G.D.\nAdjutant General DISTRIBUTION:\nC-in-C\nC/S\nG-3 (Return 2)\nHandling and transmissio MY FORCES, PACIFIC\nADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\n\nINCOMING MESSAGE\n\nTOP SECRET\n\nFROM: WASHINGTON (WDGPO)\nTO: CINCAFPAC (FOR MACARTHUR)\nNR: W 84240 Reference C 66691. No action is being taken on General Hodges message passed to WD in your C 66691 dtd 28 Oct pending receipt of your comments and recommendations which are requested.\n\nNORSTAD\n\nACTION: G-3 Pla INFORMATION: COMMANDER-IN-CHIEF, CHIEF OF STAFF\n\nACTION COMPLETED\n\nBL DAT 1 Nov - 1235 hrs OHO. 30 OCT RECEIVED\nE/N TO C/S\n\nN BY OTTETTY\n24257 OPERATIONAL PRIORITY TOO: 292039Z\nMCN: YA 85/30\n\nTOP SECRET\n\nHandling and transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 380-5, 6 March 1946.\n\nCOPY NO. 1\nRouted Copy", "notes": [], "note": "기계 판독 참고 — DOCID/TOO 복원: '322.' 줄은 해당 전문의 첫 문장 앞 별도 줄 번호로 보이나 문장 일부일 가능성도 있음. 전문 본문 맨 앞의 '322. Reference C 66691...' 그대로 유지. 'NORSTAD'는 노스태드 장군(서명자) 오탈자 아님. 'C 66691 dtd 28 oott'는 '28 Oct'의 OCR 오류로 수정함. 'BL DAT 1 Nov - 1235 hrs OHO. 30 OCT RECEIVED'에서 BL, OHO, E/N to C/S, N BY OTTETTY 등은 전문 송수신·기록 표식으로 보존.", "warn": false, "pages": ["0338"]}, {"id": "D061", "order": 60, "date": "1946-10-31", "group": "X", "eyebrow": "D061", "title": "극동군사령관이 주한미군의 한국 관련 권고에 대해 논평하고 이전 전문을 해명함", "badge": "TOP SECRET", "list_right": "0339–0340", "meta": [{"k": "발신", "v": "CINCFE", "txt": true}, {"k": "수신", "v": "WDCSA (IDGPO)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0339–0340 (2면)"}, {"k": "건명", "v": null, "txt": true}], "summary": "CINCFE comments on USAFIK recommendations for Korea and clarification of prior message", "points": ["맥아더는 한국 내 미군 교체병력 배치를 조정했으나 장교 증원은 전구 내 가용 자원 부족으로 불가하다고 답변했다.", "한국에 대한 추가 식량 지원은 현재 지원 계획을 넘어서는 자원이 없다는 입장을 재확인했다.", "한국 문제의 표류를 방치하지 말고 최고 정부 차원에서 해결하는 적극적 조치가 필요하다는 1945년 12월의 기존 권고를 반복했다.", "G-3 메모는 육군부 전문에 대한 회신 작성 과정에서 '쌀'을 '식량'으로 변경하는 등 사실관계에 기초한 수정이 이뤄졌음을 기록했다."], "primary": "[0339면]\n기밀해제\n권한 NND886527\n일급비밀(TOP SECRET)\n총사령부\n미국 태평양 육군\n통신대 전문\nGO-P\n1946년 11월 1일\n발신: 극동군사령관(CINCFE)\n수신: 육군부 참모총장실 (IDGPO) .... 작전우선\n( ) 귀신 10월 30일자 WILLIAM 84240 관련. 당신 CHARLIE 66691은 단지 정보 제공 목적이었으며\n조치 요청은 아니었음. 귀 요청에 따라 HODGE 장군의 ABLX항의 권고사항들에\n대해 다음과 같이 순차적으로 논평함.\n본 사령부는 전구에 도착하는 11월 교체병력의 배치를 조정하여\n1946년 11월 30일부로 편제표(T/O&E) 병력의 약 100%에 해당하는\n사병이 한국에 있도록 조치했음. 장교 병력은 전구 내 전보 가능 인원이\n없어서 한국에서 증강될 수 없음.\nBAKER 1D항 -- 본 사령부는 현재 공급 중이거나 공급 계획 중인 것 외에\n추가로 식량을 공급할 자원이 없음.\nCHARLIE 2D항 -- 이 제안은 실행 불가능한 것으로 판단됨.\nDOG항 -- 1945년 12월 17일자 CHARLIE 56096에서의 이전 권고를 재차 천명함.\n즉, 한국 문제 해결을 위해 최고 정부 차원에서 적극적 조치가 취해져야 하며,\n상황이 계속 표류하도록 방치해서는 안 된다는 것임.\n맥아더\n사본 배포:\n존 B. 쿨리\n육군감, 부관부장\n참모차장\nG-3 (반송) 2\n\n[0340면]\n기밀해제\n권한 NND 846527\n일급비밀(TOP SECRET)\n1946년 10월 31일\n\n기록용 메모:\n\n1. 기본 조치: 1946년 10월 30일자 W 84240. 동 전문은 우리가 10월 28일자\nC 66691로 육군부에 송부한 10월 28일자 IFGC 522에 대해 우리의 논평과 권고가\n도착할 때까지 육군부에서 조치를 취하지 않고 있음을 통보.\n\n2. 10월 30일 참모차장으로부터 작전참모부(G-3)로 송부된 회람전표는 W 84240에 대한\n회신의 기초가 되는 전문 초안을 전달함. 제안된 전문에는 연필로 \"유사 성명에 대한\n이전 전문 확인요\"라는 주기가 기재되어 있음. 이는 한국 문제가 계속 표류하도록\n방치하기보다는 고위 정부 차원의 조치를 요구하는 부분을 언급한 것임. 1945년\n12월 17일 최고사령관이 합참에 보낸 우리의 C 56096은 주한미군사령관의 보고에\n주의를 환기하며 \"상황이 궁극적 위기로 표류하도록 방치하는 것보다 더 나쁜 것은\n없으므로 적극적 조치가 요구된다\"고 명시한 바 있음.\n\n3. 권고 조치: 참모차장이 G-3로 송부한 초안에 따라 육군부로 전문 송부.\n단, 전문 참조번호 추가, A항의 \"쌀(rice)\"을 \"식량(food)\"으로 변경, B항은\nHodge 장군이 C 66691에서 쌀을 요청하지 않았으며 미국산 쌀이 한국에 인도된\n바도 없고 가용 물량도 없으므로 해당 조치.\n\n4. 합의: G-1 (Dunn 대령) 및 G-4 (Ebel 중령)\n\n5. 권고: 첨부된 전문의 승인 및 발송.\n\n6. 완료: 이로써 W 84240에 대한 조치 완료.\n\n[서명]\n조치담당장교\n\nG-3 파일 사본\n\n일급비밀(TOP SECRET)", "secondary": "[0339면]\nDECLASSIFIED\nAuthority NND886527\nTOP SECRET\nGENERAL HEADQUARTERS\nUNITED STATES ARMY FORCES, PACIFIC\nSIGNAL CORPS MESSAGE\nGO-P\n1 NOV 1946\nFROM: CINCFE\nTO : WDCSA (IDGPO) . . . . OPERATIONAL PRIORITY ( ) REUR WILLIAM EIGHT FOUR TWO FOUR ZERO OF THREE ZERO\nOCTOBER PD OUR CHARLIE SIX SIX SIX NINE ONE WAS INTENDED MERELY FOR INFORMATION\nAND NOT FOR ACTION PD IN ACCORDANCE WITH YOUR REQUEST THE FOLLOWING COMMENTS\nARE MADE SERIATIM ON GENERAL HODGES RECOMMENDATIONS IN PARA ABLX PD THIS\nHEADQUARTERS HAS TAKEN MEASURES TO ADJUST ASSIGNMENT OF NOVEMBER REPLACEMENTS\nARRIVING IN THEATER SO THAT APPROXIMATELY ONE ZERO ZERO PERCENT TABLE OF\nORGANIZATION STRENGTH ENLISTED MEN WILL BE IN KOREA THREE ZERO NOVEMBER ONE\nNINE FOUR SIX PD OFFICER STRENGTH CANNOT BE AUGMENTED IN KOREA OWING TO NON-\nAVAILABILITY IN THEATER FOR TRANSFER PD PARAGRAPH BAKER ID NO RESOURCES\nARE AVAILABLE TO THIS HEADQUARTERS FOR SUPPLYING FOOD IN ADDITION TO THAT\nALREADY FURNISHED AND PLANNED TO BE FURNISHED TO KOREA PD PARA CHARLIE ID\nTHIS SUGGESTION IS BELIEVED TO BE UNFEASIBLE PD PARA DOG ID ITEM REPEAT IT\nPREVIOUS RECOMMENDATION MADE IN CHARLIE FIVE SIX ZERO NINE SIX OF ONE SEVEN DECEMBER\nFOUR FIVE THAT POSITIVE ACTION SHOULD BE TAKEN AT THE HIGHEST GOVERNMENTAL\nLEVEL TO SOLVE THE KOREAN PROBLEM AND THAT IT SHOULD NOT BE ALLOWED TO CONTINUE\nTO DRIFT PD\nMACARTHUR\nEZ OFFICIAL:\nTOP SECRET\nJOHN B. COOLEY, Copies to:\nColonel, AGD, Adjutant General. c/s G-3 (Return) 2\n\n[0340면]\nDECLASSIFIED\nAuthority NND 846527\nTOP SECRET\n31 October 1946 MEMO for RECORD:\n\n1. BASIC ACTION: W 84240, 30 October 46 which advises that no action is being taken by WD on IFGC 522, 28 Oct passed to WD in our C 66691, 28 Oct pending receipt of our comments and recommendations.\n\n2. Routing slip from C/S, 30 Oct forwarded to G-3 a draft of a radio forming the basis for reply to W 84240. The proposed radio bears the penciled notation \"check against prior radio on a similar statement\" in referring to high governmental action to solve the Korea problem rather than allowing it to continue to drift. Our C 56096, 17 Dec 45, from C-in-C to JCS invited attention to report made by CG USAFIK and stated that \"The situation demands positive action as nothing could be worse than to allow it to drift to an ultimate crisis.\"\n\n3. Recommended Action: Radio to WD in accord with the draft forwarded to G-3 by C/S, with radio reference added, Par \"A\" and word \"rice\" changed to \"food\", Par \"B\" as General Hodge did not ask for rice in C 66691 and no US rice has been delivered or is available for Korea.\n\n4. Concurrences: G-1 (Col Dunn) and G-4 (Lt Col Ebel)\n\n5. RECOMMENDATION: Approval and dispatch of attached radio.\n\n6. Completion: This completes action on W 84240.\n\n[signed]\nAction Officer G-3 File Copy\n\nTOP SECRET", "notes": [], "note": "기계 판독 참고 — 사본 배포 부분 'c/s'는 'Chief of Staff(참모차장)'로 추정됨. C 56096 전문 인용문의 정확한 문구는 부분적으로 재구성됨. 0339면의 'TABIE GE ORGANIZATION SIRINGTH'는 'TABLE OF ORGANIZATION STRENGTH'로 판독됨. ( )로 표시된 통신 호출부호 등 두문자는 미확인 상태로 유지됨.", "warn": false, "pages": ["0339", "0340"]}, {"id": "D062", "order": 61, "date": "1946-11-01", "group": "X", "eyebrow": "D062", "title": "WDCSA 앞 전문(라디오 CX 66853 관련) 초안 송부 표지", "badge": null, "list_right": "0341–0342", "meta": [{"k": "발신", "v": "G-3", "txt": true}, {"k": "수신", "v": "C/S", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "routing_slip"}, {"k": "면", "v": "0341–0342 (2면)"}, {"k": "건명", "v": null, "txt": true}], "summary": "Cover sheet for draft radio to WDCSA regarding radio CX 66853", "points": ["G-3가 1946년 11월 1일 참모장에게 WDCSA 앞 전문 초안의 승인을 요청하는 검토 용지 표지임.", "해당 초안은 전문 CX 66853 및 011253Z 발송 건과 관련됨.", "두 번째 면은 문서 내용이 없는 백지이며 사진 촬영용 자만 포함됨."], "primary": "[0341면]\n기밀해제\n권한 NND86527\n\n총사령부\n미국 육군 태평양 부대\n검토 용지\n(첨부 서류에서 분리 금지)\n파일 번호: 제목: WDCSA 앞 전문 초안\n비망록 번호: 발신: G-3 수신: 참모장 일자: 1946년 11월 1일\n승인 후 G-3으로 반송 요망.\n1. 첨부: WDCSA 앞 전문 초안\n[판독불가 낙서]\n회신은 011253[?]Z 발송된 전문 CX 66853으로 완료.\n\nAFPAC AGO 양식 제37호\n\n[0342면]\n[이 면은 기밀해제 도장, 사진 촬영용 자, 그리고 가장자리의 \"10 11\"부터 \"27\"까지의 느슨한 눈금 숫자 외에 백지임. 문서 내용 없음.]", "secondary": "[0341면]\nDECLASSIFIED\nAuthority NND86527\n\nGENERAL HEADQUARTERS\nUNITED STATES ARMY FORCES, PACIFIC\nCHECK SHEET\n(Do not remove from attached sheets)\nFile No: Subject: Draft of radio to WDCSA.\nNote No. From: G-3 To: C/S Date: 1 November 1946 For approval and return to G-3.\n1. Incl. Draft of radio to WDCSA\n[Illegible marginalia: \"LI V pare\" etc.]\nReply made in radio CX 66853 dispatched 011253[?]Z AFPAC AGO Form No. 37\n\n[0342면]\n[Page is blank except for declassification stamp, photographic ruler, and loose tick numbers \"10 11\" through \"27\" along the edge. No document text.]", "notes": [], "note": "기계 판독 참고 — Date is 1 November 1946, which predates the stated temporal scope of the file (Nov 1947 – Apr 1948). G-3 section likely filed an older form with later documents, or it is a misdated reference. Marginalia on page 0341 is largely illegible; 'pare' may be part of 'compare' or 'prepare'. Reply date/time string '011253[?]' is an uncertain reading.", "warn": false, "pages": ["0341", "0342"]}, {"id": "D063", "order": 62, "date": "1946-11-08", "group": "X", "eyebrow": "D063", "title": "한국 군중 상공 저고도 통과 비행 중단", "badge": "TOP SECRET", "list_right": "0343–0346", "meta": [{"k": "발신", "v": "CG USAFIK", "txt": true}, {"k": "수신", "v": "CINCAFPAC", "txt": true}, {"k": "참조", "v": "CG PACUSA", "txt": true}, {"k": "전문번호", "v": "TFGCG 527"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0343–0346 (4면)"}, {"k": "건명", "v": null, "txt": true}], "summary": "Discontinuation of low level passes over Korean crowds", "points": ["주한미군사령관(USAFIK)이 극동태평양총사령관(CINCAFPAC)에게 보낸 전문으로, 한국 내 군중을 향한 저고도 위협 비행과 사전 승인 없는 저고도 기총소사를 즉시 중단했음을 통보함.", "동 전문에 대한 G-3 부서의 기록 메모는 극동태평양총사령부의 지시사항(필요시 사전 승인 및 위협 비행의 전술적 불리함)을 명확히 하고, 관련 조치가 완료되었음을 확인함.", "문서는 최고 기밀 전문의 유통, 접수, 부서 배치표 및 회람 과정을 상세히 보여주며, 당시 한반도 미군의 군중 통제 방식과 그에 대한 상부의 통제를 드러냄."], "primary": "[0343면]\n비밀해제\n해제권한 NND 86527\n\n미국 육군 태평양 총사령부\n부관실\n무선·전보 센터\n\n수신 전문\n\n2급 비밀(TOP SECRET)\n\n긴급 1946년 11월 8일\n\n발신: 주한 미 육군 사령관\n수신: 미 태평양 육군 총사령관\n참조: 미 태평양 육군 항공대 사령관\n전문번호: TFGCG 527\n\n귀관 CX 67038호 수령 확인함. 저고도 통과 비행은 중단되었음.\n\n홀트(HOLTE)\n\n조치: G-3 계획\n정보 배포: 외교과, 총사령관, 참모장, G-2\n\n전문관리번호: TJC 47/8 080700 Z\n\n본 전문의 평문 취급 및 동일 등급 문서로서의 전송은 1946년 3월 6일자 육군규정 AR 380-5의 16-C, 18-E, 53-A, 53-D (1) (2) (3) 및 60-A (1) (2) (3) (4)항 규정에 의거, 육군부의 승인을 받았음.\n\n사본번호 7\n\n[0344면]\n비밀해제\n해제권한 NND 886527\n\n2급 비밀(TOP SECRET)\n\nBIP/sib\n1946년 11월 9일\n\n기록용 메모:\n\n1. 근거: TFGCG 527/11월 8일자는 미 태평양 육군 항공대 사령관과 주한 미 육군 사령관 앞으로 발송된 미 태평양 육군 총사령부 CX 67038호에 관한 건임. 동 전문은 한국 내에서의 저고도 기총소사(strafe)의 모든 사용은 미 태평양 육군 총사령관의 사전 승인을 받도록 요구함. 또한 위협 목적으로 한국 군중을 향해 저고도 통과 비행을 실시하는 것은 동 총사령관 견해로는 유리한 전술이 아니라고 명시했음.\n\n2. 근거 전문은 수령 확인 및 주한 미 육군 사령관이 필요한 조치를 취했음을 나타냄.\n\n3. 추가 조치 불필요.\n\n4. 이것으로 TFGCG 527호에 대한 G-3 조치 완료.\n\nJGA\n담당관\n\n[0345면]\n비밀해제\n해제권한 NND 886527\n\n2급 비밀(TOP SECRET)\n\nG-3 부서 배치표\n\nG-3 부참모장\nCol C A Russell\n\n집행과\nCol F S Henry\nLt Col D G Sherrard\nLt Col R Tarr\n\n행정과\nLt Col E O Donohue\nMaj J C S Cumings\nWOJG E I Haase\n\n작전과\nCol A Watson, 작전II\nCol F H Britton\nLt Col D S Johnson\nLt Col C B Hammerle\nLt Col J I Westermeier\nLt W M Borthwick, Jr\n\nCol R J Butchers\nLt Col V W Burgess\nLt Col W F Gallup\nLt Col C D Wood\nMaj I I Stewart\nMaj G E White, Jr\nCapt R W Foust\nCapt C I Holland\nLt J D Keenan\n\n계획과\nCol D Larr\nCol C Babcock\nLt Col G Allen\nCol Paige\nLt Col R Strauss\nLt Col J B Yost\nLt Col J T Schwenk\n\n사료편찬관\nCol W J Niederpruem\nMaj J M Roberts\n\n병력통제\nCol W A Dumas\nLt Col M I Ogden\n\n병력기초\nLt Col W W Bailey\n\nChaffee\nMaj H Mastro\nMaj [판독불가] B Hollis, Jr\nLt F M E Fowler\n[판독불가] Benson\n\n훈련\nLt Col H D Wilson\nLt Col J Ham\nMaj T F Gordon\n\n편제 및 장비\nLt Col H I Pittman\n[판독불가] Herberts\n[판독불가] B R McDonald\n[판독불가] R Stevens Burkchart\n\n주임 서기\n\n기안\n\n간행물\n\n발송 목적:\n결재\n의견조회\n동의\n정보\n필수조치\n서명\n회송\n발송\n요약\n일지\n귀 파일\n문서관리\n\n[0346면]\n비밀해제\n해제권한 NND 86527\n\nG-3 계획과\n\n회람 전표\n\n번호 15835\n\nCol D Larr 정보\nCol C S Babcock 결재\nCol P G Allen 필수조치\nCol B. L. Paige 동의\nLt Col J B Yost 요약\nLt Col J T Schwenk 서명\n발송\n파일\n주임 서기\n폐기\n문서 서기\n\nJGA", "secondary": "[0343면]\nDECLASSIFIED\nAuthority NND 86527 GENERAL HEADQUARTERS, U.S. ARMY FORCES, PACIFIC\nADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\n\nINCOMING MESSAGE\n\nTOP SECRET\n\nURGENT 8 Nov 46\n\nFROM: CG USAFIK\nTO: CINCAFPAC\nINFO: CG PACUSA\nNR: TFGCG 527 Your CX 67038 acknowledged. Low level passes have been discontinued.\n\nHOLTE\n\nACTION: G-3 Plans INFORMATION: DIPLOMATIC SECT COMMANDER-IN-CHIEF, CHIEF OF STAFF, G-2,\n\nMCN: TJC 47/8 080700 Z Handling and transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) (2) (3), and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946.\n\nCOPY NO. 7\n\n[0344면]\nDECLASSIFIED\nAuthority NND 886527\n\nTOP SECRET\n\nBIP/sib 9 November 1946 MEMO for RECORD:\n\n1. BASIC: TFGCG 527/8 November concerns AFPAC CX 67038 to CG PACUSA and CG USAFIK which required that any employment of low level strafing in Korea be previously approved by CINCAFPAC. It also stated that making of low level passes at Korean crowds for intimidation purposes is, in CINCAFPAC opinion, not an advantageous tactic.\n\n2. Basic consists of an acknowledgment and indicates necessary action has been taken by CG USAFIK.\n\n3. No further action required.\n\n4. This completes G-3 action of TFGCG 527.\n\nJGA\nAction Officer\n\n[0345면]\nDECLASSIFIED\nAuthority NND 886527\n\nTOP SECRET\n\nG-3 Routine Strip ASST C/S, G-3 Col C A Russell\n\nEXECUTIVE\nCol FS Henry Lt Col D G Sherrard Lt Col R Tarr\n\nADMINISTRATION\nLt Col E O Donohue Maj J C S Cumings WOJG E I Haase\n\nOPERATIONS\nCol A Watson, Operations II Col F H Britton Lt Col D S Johnson Lt Col C B Hammerle Lt Col J I Westermeier Lt W M Borthwick, Jr Col R J Butchers Lt Col V W Burgess Lt Col W F Gallup Lt Col C D Wood Maj I I Stewart Maj G E White, Jr Capt R W Foust Capt C I Holland Lt J D Keenan\n\nPLANNING\nCol D Larr Col C Babcock Lt Col G Allen Col Paige Lt Col R Strauss Lt Col J B Yost Lt Col J T Schwenk\n\nHISTORIAN\nCol W J Niederpruem Maj J M Roberts\n\nTROOP CONTROL\nCol W A Dumas Lt Col M I Ogden Troop Basis Lt Col W W Bailey Chaffee Maj H Mastro Ma.j] Maj [illegible] B Hollis, Jr Lt F M E Fowler I I It [illegible] Ben son Training Lt Col H. D Wilson Lt Col J Ham Maj T F Gordon Organization & Eqpt Lt Col H I Pittman I It Col 3 [illegible] Herberts Ma.j Mal [illegible] B R McDonald Maj j G [illegible] R Stevens Burkchart\n\nCHIEF CLERK\n\nDRAFTING\n\nPUBLICATIONS\n\nFOR:\nApproval Comment Concur Info Nec Action Signature Ret Adm Dispatch Summary Journal Your File File Adm\n\n[0346면]\nDECLASSIFIED\nAuthority NND 86527 G-3 Planning\n\nROUTING SLIP\n\nNo. 15835 Col D Larr Info Col C S Babcock Approval Col P G Allen Nec Action Col B. L. Paige Concur Lt Col J B Yost Summary Lt Col J T Schwenk Signature Dispatch File Chief Clerk Destroy File Clerk\n\nJGA", "notes": [], "note": "기계 판독 참고 — 페이지 0345의 조직도는 OCR 손상으로 인해 여러 이름에 [판독불가]가 포함되었습니다. 손상된 철자를 최대한 유추했으나 원문 확인이 필요할 수 있습니다.", "warn": false, "pages": ["0343", "0344", "0345", "0346"]}, {"id": "D064", "order": 63, "date": "1946-11-08", "group": "X", "eyebrow": "D064", "title": "민간 소요 진압을 위한 저고도 기총소사 작전: 극동육군총사령관 승인 없는 한국 내 실행 금지 명령", "badge": "TOP SECRET", "list_right": "0347–0348", "meta": [{"k": "발신", "v": "CINCAFPAC", "txt": true}, {"k": "수신", "v": "CG USAFIK; CG PACUSA", "txt": true}, {"k": "참조", "v": "COMAF FIVE", "txt": true}, {"k": "전문번호", "v": "GX 67038"}, {"k": "종류", "v": "memorandum"}, {"k": "면", "v": "0347–0348 (2면)"}, {"k": "건명", "v": null, "txt": true}], "summary": "Discontinuance of low-level strafing against civil disturbances in Korea without CINCAFPAC authorization", "points": ["태평양미육군사령관은 민간 소요 진압 시 비무장 항공기의 저고도 위협 비행 관행에 반대하며, 발포가 불가피할 경우 사전 경고를 요구했다.", "극동육군총사령관은 한국 내 민간 소요에 대한 저고도 기총소사를 자신의 특별 승인 없이 금지했다.", "이는 전투기의 공격적 이미지로 인한 국제적 파장과 인명 피해를 우려하여 1946년 8월 5일자 'Baker 61' 연구에 근거한 조치다."], "primary": "[0347면]\n해제\n해제권한 NND886527\n일급비밀\n총사령부\n미 육군 태평양 전력\n통신대 메시지 GC-A WAD/mcg\n1946년 11월 7일\n\n발신: 극동육군총사령관 (CINCAFPAC)\n수신: 주한미군사령관 (CG USAFIK). •긴급\n     태평양미육군사령관 (CG PACUSA). •긴급\n\n정보: 제5공군사령관 (COMAF FIVE) . • ... ...긴급\n\nLO\n(- GX 67038 참조 태평양미육군 무선 ABLE NINE SEVEN EIGHT\nSEVEN FOUR ABLE DASH THREE 11월 6일자 CMA 2부에서 반복 태평양미육군사령관의 의견에\n동의함 PD 1부에 관하여 반복 CMA 아니오 반복 한국 내 민간 소요에 대하여\n극동육군총사령관이 특별히 승인하지 않는 한 저고도 기총소사는 실시되지\n않을 것임 PD 이와 관련하여 CMA 1946년 8월 5일자 전문 송부문 3항에\n주의를 환기함 CMA 극동육군총사령관 앞 한국 내 민간 소요에 관한\n참모 연구\n8L 공식:\n• 6L\n                                       존 B. 쿨리, 대령, ACD,\nOZ                                     부관감,\n배포처: 총사령관\n           참모장\n           G-2\n           G-3 (반송)\n           AG\n           외교과\n\n                                     승인자:\n                                     C. A. 러셀,\n                                     대령, G.S.C.,\n                                     작전참모부차장(G-3).\n\n[0348면]\n해제\n해제권한 NND886527\n일급비밀\nCSC/jln\n1946년 11월 8일\n200cl\n\n기록용 메모:\n1. • 기초 조치: 태평양미육군사령관 무선 A 97874 A-3, 1946년 11월 6일자\n(비밀)에 따르면:\na. 김포 주둔 제308폭격비행단장에게 한국 내 민간 소요에 대비하여\n저고도 기총소사 작전을 준비하라는 요청이 있었음.\nb. 태평양미육군은 소요를 일으키는 군중 위로 비무장 또는\n비발포 항공기에 의한 저고도 통과 관행의 지속에 동의하지 않음.\nc. 군중에게 발포할 필요가 발생할 경우, 그 행위는 저공비행\n기총소사 항공기의 치명적 능력을 설명하는 적절한 경고가 선행되어야 함.\nd. 실탄 사용과 그에 따른 인명 손실로 인해 심각한 국제적 반향이\n발생할 수 있는데, 이는 전투 항공기가 방어용이 아닌 공격용 무기라는\n보편적인 인식 때문임.\n2. 참모총장의 승인을 받고 1946년 8월 5일자 \"Baker 61\"(사본은\n태평양미육군이 보관)의 규정에 따라 작성된 첨부 무전(일급비밀):\na. 비발포 항공기에 의한 저고도 통과 관행 중단과 관련하여\n태평양미육군사령관의 의견에 동의함을 명시함.\nb. 극동육군총사령관이 특별히 승인하지 않는 한, 한국 내 민간 소요를\n일으키는 군중에 대하여 저고도 기총소사를 실시하지 말 것을 지시함.\nc. \"Baker 61\"의 해당 부분에 주의를 환기함.\n3. 이로써 태평양미육군 무선 A 97874 A-3에 대한 조치 완료.\n\nS/\n커밍스 2-2253\n22\n23\n24\n25 일급비밀\n26 Ton\n27", "secondary": "[0347면]\nDECLASSIFIED\nAuthority NND886527\nTOP SEC\nGENERAL HEADQUARTERS\nUNITED STATES ARMY FORCES, PACIFIC SIGNAL CORPS MESSAGE GC-A WAD/mcg 7 NOVEMBER 1946\n\nFROM: CINCAFPAC\nTO : CG USAFIK. •URGENT CG PACUSA. •URGENT\n\nINFO: COMAF FIVE . • ... ...URGENT LO (- GX 67038 REFERENCE PACUSA RADIO ABLE NINE SEVEN EIGHT\nSEVEN FOUR ABLE DASH THREE OF SIX NOVEMBER CMA CONCUR IN OPINION OF\nCOMMANDING GENERAL PACUSA CONTAINED IN PART TWO REPEAT TWO PD PARA\nRE PART ONE REPEAT ONE CMA NO REPEAT NO LOW LEVEL STRAFING WILL BE\nCONDUCTED IN KOREA AGAINST CIVIL DISTURBANCES UNLESS SPECIFICALLY\nAUTHORIZED BY CINCAFPAC PD IN THIS CONNECTION CMA ATTENTION IS INVITED\nTO PARAGRAPH THREE REPEAT THREE LETTER OF TRANSMITTAL DATED FIVE AUGUST\nONE NINE FOUR SIX CMA TO CINCAFPAC STAFF STUDY COVERING CIVIL DISTURBANCES\nIN KOREA\n8L OFFICIAL:\n• 6L JOHN B. COOLEY, Colonel, ACD, OZ                                     Adjutant General, Copies to: CinC c/s\nG-2\nG-3 (Return)\nAG Diplomatic Section APPROVED BY:\nC. A. RUSSELL, Colonel, G.S.C., Asst. Chief of Staff, G-3.\n\n[0348면]\nDECLASSIFIED\nAuthority NND886527\nTOP SECRET\nCSC/jln 8 November 1946 200cl MEMO for RECORD:\n1. • BASIC ACTION: Radio from CG PACUSA A 97874 A-3, 6 Nov 46 (Secret) states:\na. That the commanding officer 308 Bomb Wing, KIMPO, has been requested to be prepared to conduct low level strafing operations against civil disturbances in Korea.\nb. That PACUSA does not concur in the continuance of the practice of low level passes by unarmed or non-firing aircraft over crowds causing disturbances.\nc. That in the event it becomes necessary to fire upon crowds, the act should be preceded by an adequate warning explaining lethal capabilities of low-flying strafing aircraft.\nd. That serious international repercussion may result from the use of live ammunition and the resultant loss of life, because of the universal conception of combat aircraft as an offensive rather than defensive weapon.\n2. Attached radio (Top Secret), approved by the Chief of Staff and prepared in accordance with the provisions of \"Baker 61\", 5 Aug 46, copy of which is held by PACUSA:\na. States that we concur in the opinion of CG PACUSA relating to discontinuance of practice of low level passes by non-firing aircraft.\nb. Directs that no low level strafing be conducted against crowds causing civil disturbances in Korea unless specifically authorized by CINCAFPAC.\nc. Invites attention to pertinent portions of \"Baker 61\".\n3. This completes action on PACUSA radio A 97874 A-3.\n\nS/ Cumings 2-2253 22 23 24 25 TOP SECRET 26 Ton 27", "notes": [], "note": null, "warn": false, "pages": ["0347", "0348"]}, {"id": "D065", "order": 64, "date": "1946-11-07", "group": "X", "eyebrow": "D065", "title": "한국 내 민간 소요 진압을 위한 저고도 기총소사 정책", "badge": "TOP SECRET", "list_right": "0349–0349", "meta": [{"k": "발신", "v": "CINCAFPAC", "txt": true}, {"k": "수신", "v": "CG USAFIK; CG PACUSA", "txt": true}, {"k": "참조", "v": "COMAF FIVE", "txt": true}, {"k": "전문번호", "v": "GC-A"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0349–0349 (1면)"}, {"k": "건명", "v": null, "txt": true}], "summary": "Policy on low-level strafing against civil disturbances in Korea", "points": ["CINCAFPAC는 PACUSA 사령관의 의견에 동의하며, 한국 내 민간 소요에 대한 저고도 기총소사는 자신의 특별 승인 없이 실시되지 않을 것임을 명확히 함.", "한국 내 민간 소요 진압 시 무력 사용 수준을 통제하기 위해 1946년 8월 5일자 참모 연구 및 전달 공한 3항을 상기시킴.", "본 전문은 최고 기밀로 분류되며, 외교 문서 수준의 엄격한 취급 및 전송 절차를 따르도록 지시함."], "primary": "[0349면]\n기밀해제:\n권한 NND86527\n[판독불가]\n사령부\n미국 태평양 육군\n통신대 메시지 GC-A WAD/mcg\n1946년 11월 7일\n일급비밀(TOP SECRET)\n발신: CINCAFPAC (미 태평양 육군 총사령관)\n수신: CG USAFIK (주한미군 사령관). 긴급 071047\nCG PACUSA (미 태평양 육군 항공대 사령관). 긴급\n참조: COMAF FIVE . 긴급\nLO X6703 8 ) 참조 PACUSA 무선 ABLE 97874 ABLE DASH 3 11월 6일자. CINCAFPAC는 2부(REPEAT TWO)에 수록된 PACUSA 사령관의 의견에 동의함. 1부(REPEAT ONE) 관련 사항. 아니요(REPEAT NO), CINCAFPAC가 특별히 승인하지 않는 한, 한국 내 민간 소요에 대해 저고도 기총소사는 실시되지 않을 것임. 이와 관련하여, 1946년 8월 5일자 전달 공한 3항(REPEAT THREE)에 주목할 것. CINCAFPAC에 보내진 한국 내 민간 소요에 관한 참모 연구.\n공식:\n승인자:\n18\n존 B. 쿨리, 대령, 4GD, C. A. 러셀,\n부관감. 대령, G.S.C.,\nG-3 참모차장보.\n21 배포처: 사령관\n22 G-2 참모장 일급비밀\n23 (반송) 본 전문의 평문 문자 취급 및 전송은 외교 문서에 준하는 분류로...\n24 ...\n25 ... 규정 53-D (1) (2)항, 16-C, 18-E, 23-A, ...\n3) 6 380-3, 123 60-A (1) (2)\n26 G-3 파일\n27", "secondary": "[0349면]\nDECLASSIFIED:\nAuthority NND86527 Irl, vicint\nGENERAL HEADQUARTERS\nUNITED STATES ARMY FORCES, PACIFIC SIGNAL CORPS MESSAGE GC-A WAD/mcg 7 NOVEMBER 권한 NND 8X652\n2급 극비(TOP SECRET)\n2급 극비(TOP SECRET)\n긴급\n발신: CINCAFPAC(미극동육군총사령관)\n수신: CG USAFIK(주한미군사령관)\n CG PACUSA(태평양미육군사령관)\n참조: COMAF 5\n참고: 11월 6일자 PACUSA 무선 A-97874 A-3, 제2부에 수록된 CG PACUSA의 의견에 동의함.\n제1부 관련, 한국 내 민간 소요에 대해서는 CINCAFPAC의 구체적 사전 승인이 없는 한 어떠한 저고도 기총소사도 실시하지 않을 것임. 이와 관련하여, 한국 내 민간 소요를 다룬 CINCAFPAC 참모연구의 1946년 8월 5일자 전달공문 제3항에 주목할 것.\n공식 기록:\n존 B. 쿨리, 대령, AGD, 부관감\n승인자:\nC. A. 러셀, 대령, G.S.C., 참모차장, G-3\n배포처: 총사령관\n참모장 부관감 G-2 G-3 (회수) 외교과\n2급 극비\n2급 극비\n\n[0351면]\n기밀해제\n해제권한 NND 8X6527\n[주사용 자: SEKISUI JUSHI 및 무관한 눈금 숫자 19 20 21 / 29 30 31]", "secondary": "[0350면]\nDECLASSIFIED\nAuthority NND 8X652\nTOP SECRET\nTOP SECRET\nURGENT\nFROM: CINCAFPAC\nTO: CG USAFIK\nCG PACUSA\nLO. INFO: COMAF 5 Reference PACUSA radio A-97874 A-3 of 6 November, concur in opinion of CG PACUSA contained in Part 2 repeat 2. Re Part 1 repeat 1, no repeat no low level strafing will be conducted in Korea against civil disturbances unless specifically authorized by CINCAFPAC. In this connection, attention is invited to paragraph 3 repeat 3 letter of transmittal dated 5 August 1946, to CINCAFPAC Staff Study covering civil disturbances in Korea.\nOFFICIAL:\nJOHN B. COOLEY, Colonel, AGD, Adjutant General. APPROVED BY:\nC. A. RUSSELL, Colonel, G.S.C., Asst. Chief of Staff, G-3 Copies to: C-in-C C/S AG G-2 G-3 (Return) Diplomatic Section\nTOP SECRET\nTOP SECRET\n\n[0351면]\nDECLASSIFIED\nAuthority NND 8X6527 [Scanning artifacts: SEKISUI JUSHI ruler and loose tick numbers 19 20 21 / 29 30 31]", "notes": [], "note": "기계 판독 참고 — 0351면은 사진 촬영용 눈금자와 무관한 숫자들만 있는 공백 페이지로 판단됨. 0350면의 배포처 목록 하단에 'CHIEF OF STAFF APPROVED' 구절은 원문에 난외 기입 또는 스탬프로 찍힌 것으로 보이나 위치가 불명확하여 'en'에 포함시키지 않았음.", "warn": false, "pages": ["0350", "0351"]}]</script>
<script id="conf" type="application/json">{"pages": {"dir": "../pages", "ext": "jpg", "label": "스캔 원본", "thumbs": "../thumbs", "thumb_ext": "jpg"}, "chrono": {"from": "1943-09-01", "to": "1948-12-31", "note": "열람기 아래쪽에 늘 떠 있는 연대 바의 눈금이다. 문서 하나를 읽을 때 그것이 어느 시점의 것인지 잡아 준다. 문서철을 가리지 않고 공용으로 쓴다. note 는 사건에 마우스를 올렸을 때 뜨는 요약이다 — 두세 문장을 넘기지 마라.", "events": [{"date": "1943-11-27", "label": "카이로 선언", "key": true, "where": "카이로", "note": "미·영·중 3국 수뇌가 대일 전후 처리를 합의해 발표했다. 조선에 관한 대목은 「적당한 시기에(in due course) 자유롭고 독립된 나라가 되게 한다」였다. 이 묶음이 좇는 문구가 여기서 태어난다."}, {"date": "1943-11-28", "label": "테헤란 회담", "where": "테헤란", "note": "루스벨트·처칠·스탈린의 첫 3자 회담. 유럽 제2전선(노르망디)의 시기가 정해졌고, 스탈린은 독일 항복 뒤 대일전 참전을 처음으로 시사했다."}, {"date": "1944-06-06", "label": "노르망디 상륙", "note": "연합군이 프랑스 북부에 상륙해 서부 제2전선이 열렸다. 유럽 전쟁의 승패가 사실상 이때 갈렸고, 미국 안에서 「그다음은 일본」이라는 계산이 본격화된다."}, {"date": "1944-10-20", "label": "레이테 상륙", "where": "필리핀", "note": "맥아더가 필리핀 탈환에 착수했다. 뒤이은 레이테만 해전에서 일본 연합함대가 무너져, 일본 본토와 남방 자원지대를 잇는 해상 수송로가 끊긴다."}, {"date": "1945-02-04", "label": "얄타 회담", "key": true, "where": "크림반도 얄타", "note": "루스벨트·처칠·스탈린의 두 번째 3자 회담. 소련의 대일 참전 조건이 비밀협정으로 정해졌고, 루스벨트가 스탈린에게 조선의 신탁통치를 꺼내며 「20년에서 30년」이라 말했다. 카이로의 「적당한 시기」에 처음으로 숫자가 붙은 자리다."}, {"date": "1945-03-10", "label": "도쿄 대공습", "note": "B-29 편대의 야간 소이탄 공습으로 도쿄 시가지가 불탔다. 하룻밤 사망자가 10만 명 안팎으로 추정된다. 일본 안에서 본토 방위가 불가능하다는 인식이 퍼지기 시작한다."}, {"date": "1945-04-01", "label": "오키나와 전투", "note": "미군이 오키나와에 상륙해 6월까지 싸웠다. 사상자 규모가 본토 상륙전의 비용을 가늠하는 근거가 되어, 원폭 사용과 소련 참전 요청 양쪽의 논거로 쓰인다."}, {"date": "1945-04-12", "label": "루스벨트 사망", "note": "루스벨트가 급서하고 트루먼이 승계했다. 트루먼은 얄타의 비밀협정도 원폭 개발도 취임 뒤에야 통보받았다. 조선 신탁통치 구상을 밀던 사람이 사라진 자리다."}, {"date": "1945-05-02", "label": "베를린 함락", "note": "소련군이 베를린을 함락했다. 이틀 전 히틀러가 자살했고, 남은 것은 항복 절차뿐이었다. 도쿄의 일본 지도부는 이 소식을 스위스·스웨덴 공관과 외신을 통해 받아 본다."}, {"date": "1945-05-08", "label": "독일 항복", "key": true, "note": "독일이 무조건 항복해 유럽 전쟁이 끝났다. 일본은 마지막 동맹을 잃었고, 소련은 대일전으로 병력을 돌릴 수 있게 됐다. 이 소식에 대한 일본 안팎의 반응이 이 묶음의 「기」에 해당한다."}, {"date": "1945-07-17", "label": "포츠담 회담", "where": "베를린 근교 포츠담", "note": "트루먼·처칠(뒤에 애틀리)·스탈린의 회담. 회담 중 원폭 실험 성공이 보고되고, 대일 최후통첩의 문안이 다듬어진다."}, {"date": "1945-07-26", "label": "포츠담 선언", "note": "미·영·중 명의로 일본에 무조건 항복을 요구했다. 제8항에 「카이로 선언의 조항은 이행되어야 한다」고 못박아, 조선 독립 약속이 항복 조건 안으로 들어온다. 일본은 이를 묵살(黙殺)한다고 발표했다."}, {"date": "1945-08-06", "label": "히로시마", "key": true, "note": "히로시마에 원자폭탄이 투하됐다. 트루먼은 같은 날 성명을 내 「이제껏 없던 폭탄」임을 알리고 항복하지 않으면 파멸이 이어질 것이라 경고했다."}, {"date": "1945-08-08", "label": "소련 참전", "note": "소련이 일본에 선전포고하고 이튿날 만주로 진공했다. 얄타에서 약속한 「독일 항복 뒤 3개월」을 지킨 날짜다. 미국이 조선에 지상군을 두려면 시간이 없다는 것이 이날 분명해진다."}, {"date": "1945-08-09", "label": "나가사키", "note": "나가사키에 두 번째 원자폭탄이 투하됐다. 같은 날 밤 어전회의가 열려 국체 유지를 조건으로 한 항복 제의가 정해진다."}, {"date": "1945-08-11", "label": "38선 획정", "key": true, "note": "일반명령 제1호(SWNCC 21/5)가 고쳐지면서 조선이 북위 38도로 갈렸다. 한 문서의 b항과 f항, 다섯 조항 사이에 조선이 둘로 나뉘어 적혔다. 합참이 든 이유는 미군에게 경성의 항만과 교통 지역을 주기 위해서였다."}, {"date": "1945-08-15", "label": "일본 항복", "key": true, "note": "일본이 포츠담 선언 수락을 방송으로 알렸다. 전날 밤 일부 장교들이 방송을 막으려 궁성을 봉쇄하고 총리 관저를 습격했으나 실패했고, 아나미 육군대신은 새벽에 자결했다."}, {"date": "1945-09-02", "label": "항복문서 조인", "where": "도쿄만 미주리함", "note": "도쿄만의 미주리함 위에서 항복문서에 서명했다. 이 문서로 연합국최고사령관(SCAP)의 권한이 발효되고, 일반명령 제1호가 법적 효력을 갖는다."}, {"date": "1945-09-08", "label": "미군 인천 상륙", "key": true, "note": "하지 중장의 제24군단이 인천에 상륙해 이튿날 조선총독부의 항복을 받았다. 미군정이 시작된다. 닷새 뒤 하지는 카이로의 「in due course」가 조선어로 「수일 내」로 옮겨져 퍼져 있었다는 것을 알게 된다."}, {"date": "1945-12-27", "label": "모스크바 3상회의", "key": true, "note": "미·영·소 외상이 조선에 최대 5년의 신탁통치를 두고 미소공동위원회를 설치하기로 합의했다. 카이로의 「적당한 시기」가 마침내 문서상의 기한이 된 자리이자, 조선 안에서 신탁통치 반대 운동이 폭발한 계기다."}, {"date": "1946-03-20", "label": "1차 미소공동위", "where": "서울", "note": "임시정부 수립을 협의할 미소공동위원회가 열렸다. 어느 정당·사회단체와 협의할 것인가를 두고 갈라져 5월에 결렬된다."}, {"date": "1946-10-01", "label": "대구 10월 사건", "note": "식량 공출과 경찰에 대한 항의가 대구에서 시작해 남한 전역으로 번졌다. 미군정이 계엄을 선포하고 진압했다. 점령 1년 만에 통치의 정당성이 시험대에 오른 사건이다."}, {"date": "1947-05-21", "label": "2차 미소공동위", "where": "서울", "note": "미소공동위원회가 다시 열렸으나 같은 쟁점에서 다시 갈라져 10월에 사실상 끝난다. 미국은 이 무렵부터 조선 문제를 유엔으로 넘기는 쪽으로 방향을 바꾼다."}, {"date": "1947-09-17", "label": "한국 문제 유엔 이관", "key": true, "note": "미국이 조선 문제를 유엔 총회에 상정했다. 4개국 신탁통치라는 전시 구상이 공식적으로 폐기되고, 처리의 무대가 미소 양자에서 유엔으로 옮겨간다."}, {"date": "1948-01-08", "label": "유엔한국임시위원단 입국", "note": "유엔한국임시위원단(UNTCOK)이 서울에 들어왔다. 소련이 북위 38도 이북 입경을 거부해, 감시할 수 있는 지역에서만 선거를 치른다는 결론으로 이어진다."}, {"date": "1948-05-10", "label": "5·10 총선거", "key": true, "note": "남한만의 제헌국회 선거가 치러졌다. 좌익과 김구·김규식 계열이 불참했다. 분단이 절차를 갖춘 사실이 되는 날이다."}, {"date": "1948-08-15", "label": "대한민국 정부 수립", "key": true, "note": "대한민국 정부가 수립되고 미군정이 끝났다. 카이로에서 「in due course」라고 적힌 지 4년 9개월 뒤다. 북에서는 9월 9일 조선민주주의인민공화국이 수립된다."}]}, "terms": {"_": [{"w": "T.F.O.O.T. 1948", "k": "_:18", "href": "#D057", "doc": "D057"}, {"w": "T.F.G.C.G. 527", "k": "_:17", "href": "#D063", "doc": "D063"}, {"w": "W.A.R.X. 94729", "k": "_:23", "href": "#D037", "doc": "D037"}, {"w": "W.A.R.X. 96766", "k": "_:24", "href": "#D022", "doc": "D022"}, {"w": "G.D.S.P. 1438", "k": "_:11", "href": "#D046", "doc": "D046"}, {"w": "Z.G.C.G. 1201", "k": "_:31", "href": "#D045", "doc": "D045"}, {"w": "Z.G.C.G. 1396", "k": "_:32", "href": "#D043", "doc": "D043"}, {"w": "Z.G.C.G. 1497", "k": "_:33", "href": "#D039", "doc": "D039"}, {"w": "Z.G.C.T. 1401", "k": "_:35", "href": "#D048", "doc": "D048"}, {"w": "Z.G.C.T. 1472", "k": "_:36", "href": "#D033", "doc": "D033"}, {"w": "N.I.X. 92187", "k": "_:14", "href": "#D054", "doc": "D054"}, {"w": "W.A.R. 91520", "k": "_:22", "href": "#D041", "doc": "D041"}, {"w": "Z.G.B.I. 502", "k": "_:30", "href": "#D010", "doc": "D010"}, {"w": "Z.G.C.T. 252", "k": "_:37", "href": "#D023", "doc": "D023"}, {"w": "K.V.C. 0413", "k": "_:13", "href": "#D004", "doc": "D004"}, {"w": "S.V.C. 5055", "k": "_:15", "href": "#D044", "doc": "D044"}, {"w": "Z.G.C.G. 85", "k": "_:34", "href": "#D003", "doc": "D003"}, {"w": "Z.G.C.T. 74", "k": "_:38", "href": "#D029", "doc": "D029"}, {"w": "C.X. 55756", "k": "_:3", "href": "#D052", "doc": "D052"}, {"w": "C.X. 56612", "k": "_:4", "href": "#D049", "doc": "D049"}, {"w": "C.X. 57728", "k":
