er to determine future policy under Par 5 (F) of SWNCC 176/30, as obviously the stop-gap remedies which can be completed within next year before withdrawal will not begin to ensure the economic stability and political security of the new South Korea state. Accordingly, as I envisage the situation today (realizing that the unfolding of future events may require many changes) some of the cardinal points of our revised policy, which would constitute directives to American representatives here would be as follows:\n\n1. As contemplated in Par (2) through (5) of WX 90136, we should, subject to possible developments mentioned therein, proceed with preparation for troop withdrawal by third quarter of 1948, the establishment of an armed South Korean security force, and the rapid completion or near completion by end of 77945 (Over)\nPRIORITY SECRET\n#paraphrase not required. Handle as TOP SECRET correspondence per para 51 1 and 60 a (4) AR 380-5. Copy 10- COl. GINDER Handling and transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) (2) (3), and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946. Copy No. 12\n\n[0288면]\nDECLASSIFIED\nAuthority NND8X6527\nTOP SECRET\nCG USAFIK MSG NR ZGCG 1396 DTD 22 NOV 47 CONTINUED:\n\n1948 of as many essential economic programs and projects as may be feasible and possible. In following this program we shall obviously continue to be guided by existing directives insofar as they remain applicable and not specifically voided by instructions from Washington.\n\n2. As various reports of the economic capacities of South Korea already available to SANACC clearly indicate that South Korea can only avoid economic chaos followed inevitably by political chaos unless considerable aid and assistance is forthcoming, further studies should be made, on a yearly basis, for several years after 1948, of the most necessary and essential economic projects and the ways and means of implementing them, taking into account that South Korea will be independent with the result that, due to strong nationalist feeling and pride, as well as Soviet intrigue, special safeguards will need to be devised even though we must visualize that they may not be successful. In administration of these safeguards I recommend that US, which will probably be the only source of supply, both materially and financially, should be the responsible agency (in cooperation with the South Korean officials) rather than UN. The latter, as an international agency, might well be compelled, if it had that responsibility, as did UNRRA, to continue to channelize aid and assistance to South Korea when it had become abundantly clear that Soviet controlled groups are taking over the country. In other words, as regards future aid and assistance from the US, we should avoid giving authority in such controls to an international agency which might bind the US to hand over sinews to support an enemy of the US.\n\n3. The subcommittee of SANACC must give consideration to preparations for the establishment of a diplomatic mission in South Korea when the new government comes into being. Within the framework of that mission there should be not only the usual political section, but also a well staffed competent economic section, a military section staffed to perform not only the usual attache functions but also to wind up military affairs and to perform military advisory functions for the new South Korean security forces unless the new government objects, preferring possibly UN assistance in this respect, and finally a strong informational section to combat inevitable Soviet propaganda. Immediate steps should be taken to acquire additional property in Seoul for this purpose as referred to in Par 2\n\nPRIORITY TOP SECRET\n\"Paraphrase not required. Handle as TOP SECRET correspondence per para 51 1 and 60 a (4) AR 380-5.\" -2-\n\n[0289면]\nDECLASSIFIED\nAuthority NND8X6527 GENERAL HEADQUARTERS, U. S. ARMY FORCES, PACIFIC ADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\n\nINCOMING MESSAGE\n\nPRIORITY\nCG USAFIK MSG NBR ZGCG 1396 DTD 22 NOV 47 CONTINUED:\n\nSection II of this telegram.\n\n4. We must begin working upon plans for transferring to the new government our authority, property, such operating personnel as the new government may desire as well as various other related matters. All of this will be done of course with the UN Commission acting as the liaison agency as provided in the UN Resolution. In this connection it should be established as an invariable rule that no American property shall be handed over to the South Korean Government if in advance or at any late stage it is evident that it might fall into the hands of our enemies. Likewise as a precautionary measure we might as a general rule require the South Korea Government to sign an undertaking that no US property handed over to it will be alienated, sold or transferred so as to vitiate the purposes intended unless we give our consent.\n\n5. In any future planning, SANACC must provide for the possible, almost probable, contingency that any moment the struggle now going on between the Soviets and the US may reach a point where we shall be compelled to delay or postpone some projects while hastening others and devising new projects to meet the Soviet menace. For instance, if before we withdraw from Korea, the situation in North China and Manchuria takes such a turn as to move the US to take positive action to support the Central Government of China it might be the height of folly to continue withdrawal from Korea. There are many contingencies of this nature that might arise within the coming year. Our planning, therefore, should above all things envisage fluidity and adaptability.\n\n6. Insofar as we envisage the election and the setting up of a South Korean Government under UN observation, we expect no insurmountable difficulty. The command will render all possible assistance to the UN Commission and to the Koreans.\n\n77945 (Over)\nPRIORITY SECRET\n\"Paraphrase not required. Handle as TOP SECRET correspondence per para 51 1 and 60 a (4) AR 380-5. Handling and transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) (2) (3), and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946. COPY NO. [blank]\n\n[0290면]\nDECLASSIFIED\nAuthority NND8X6527\nPRIORITY TOP SECRET\nCG USAFIK MSG NBR ZGCG 1396 DTD 22 NOV 47 CONTINUED:\n\nRhee and his group may cause some headaches but we hope he can be controlled now that we know our immediate and ultimate election objectives. Assuming that the Leftists will boycott the election, Rhee and his group are likely to win the majority of the seats in the new assembly. We hope that with adequate supervision and observation, a fair number of other Rightists and Coalitionists may be elected to constitute a healthy influence. This is something to be desired inasmuch as a landslide for Rhee would lead to the establishment of what even we (to say nothing of the Soviets) would call a reactionary, Fascist government with which it may be very difficult if not impossible to deal.\n\n7. While we do not feel assured that the Soviets will permit the UN Commission to enter North Korea or permit that area to participate in the establishment of a United Korea, there is the possibility that once the organization of a South Korean government under UN aegis is under way, national feeling among North Koreans may be aroused and sufficient pressure brought to bear upon the Soviets to compel them to permit the making of overtures to the South Korean authorities for an amalgamation of the two areas. Such a development is more likely to occur if the Soviet troops are withdrawn from North Korea. If such overtures are made, there may be a need to modify our plans. In this connection, it is believed desirable for the UN Commission after its arrival to continually urge the Soviet commanding general and the North Korean authorities to accept the UN resolution. If the Soviet troops withdraw unilaterally such efforts may bear fruit. However, it must be considered as probable that the Soviets, having established their satellites in North Korea, will never permit them to join up with South Korea; that only fortunes of war will permit a reunion of the North and South either as a western or a Soviet Democracy.\n\nSection II - Economic.\n\n8. Reference Par 4, following are answers to specific questions: Land reform: It is desirable to support land reform legislation by KILA particularly for the disposition of vested farm land. Program would probably not be entirely completed by the fall of 1948 although it is hoped the bulk of land would be transferred to individual ownership by 77945 PRIORITY \"Paraphrase not required. Handle as TOP SECRET correspondence per para 51 1 and 60 a (4) AR 380-5.\"\n\nSECRET\n\n[0291면]\nDECLASSIFIED • Authority NND 816527\n\nFAR EAST COMMAND\nGENERAL HEADQUARTERS, U. S. ARMY FORCES, PACIFIC ADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\n\nTOP SECRET\nINCOMING MESSAGE\n\nTOP SECRET    PRIORITY\n\nCG USAFIK MSG NBR ZGCG 1396 DTD 22 NOV 47 CONTINUED:\n\nthat time. 2.E Disposition of vested property: Property custodian at present has staff of 72 US personnel and has completed full inventory of vested property in only 2 provinces in South Korea. To complete this inventory in 8 months will take a total staff of about 200 US personnel. Practically no sales of urban residences or small businesses has occurred, although disposal procedures have been established for more than 3 months. Difficulty in disposal appears to be desire on part of many Koreans to hold up program until they are in full power and can dispose of these properties without US supervision. It will be possible to complete an inventory of vested property by September 1948 but little progress expected in its sale except farm land. The question of legal right of US to transfer vested property to Korean Government should be considered. This can be achieved either through peace treaty or action of Japanese Diet divesting Japanese Government and its citizens of rights to property held in Korea. Unless either of these steps is taken should the US vest all property in Korean Government or should it retain control through US or UN agency? The question of retaining control or management is particularly pertinent to the possibility of the growth of a huge spoils system in the hands of any group which may attain power. This involves the possible sale of properties and rights to foreign corporations in order to obtain foreign exchange either to pay for imports or provide a foreign refuge in case there is danger of the government being overthrown. If vested property is not transferred to the Korean Government or is transferred subject to controls, consideration should be given to the agency which will exercise control or management and its relationship to the Korean Government. Vested property required by the US to house its mission should be immediately sold or allocated to the US Government.\n\n77945 (Over)\nPRIORITY    SECRET\n\n\"Paraphrase not required. Handle as TOP SECRET correspondence per para 51 1 and 60 a (4) AR 380-5.\"\n\nHandling and transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) (2) (3), and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946.\n\nTOP SECRET    COPY NO.\n\n[0292면]\nDECLASSIFIED • Authority NND8X6527\n\nSECRET\nPRIORITY\n\nCG USAFIK MSG NBR ZGCG 1396 DTD 22 NOV 47 CONTINUED:\n\n2.F Irrigation: There are about 50 major irrigation projects now under construction, of which 14 are scheduled for completion by date specified in your radio. Estimate an additional 10 projects could be completed by specified time if imports of cement, reinforcing steel, and dynamite were accelerated. Remainder of projects scheduled for completion in 1949 and 1950.\n\nOther economic developments: It will be possible almost to complete rehabilitation of textile industry by fall of 1948. Substantial progress will be made in rehabilitation of coal mines and other important individual plants and mines such as Sandong tungsten mine by specified date provided funds, materials, and key personnel requested in rehabilitation program are made available.\n\n5. Electric power: Under present conditions it is impossible for South Korea to provide the goods required by North Korea in payment for both past and present power used in this zone. Our liaison officer in Pyongyang has been informed that less power will be available in future due to inadequate transmission facilities; power from North Korea could be cut off at any time with disastrous effect on production in South Korea. In event of decision to withdraw and in order to accomplish maximum amount of work prior to withdrawal consideration should be given to obtaining naval power units to supplement South Korea power sources. Glen R. Evans sailed on Gen Morton November 16 on TDY to Washington; he can discuss this problem in detail with the committee. It is recommended that:\n\n6. USAMGIK property: a. Title to all supplies and equipment brought into Korea under civilian supply programs be transferred to the Korean Government;\nb. Equipment and supplies purchased under FLC credit should be allocated to the Korean Government provided that they negotiate settlement of loan;\nc. The 8 Baltic vessels of the Maritime Commission assigned to Korea by CINCFE, the 101 locomotives and other miscellaneous equipment now on loan to Military Government be retained in Korea only if adequate safeguard preventing 77945 PRIORITY \"Paraphrase not required. Handle as TOP SECRET correspondence per para 51 1 and 60 a (4) AR 380-5.\" -6-\n\n[0293면]\nDECLASSIFIED\nAuthority NND8X6527\n\nFAR EAST COMMAND\nGENERAL HEADQUARTERS, U.S. ARMY FORCES, PACIFIC ADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\n\nTOP SECRET\nINCOMING MESSAGE\n\nTOP SECRET    PRIORITY\n\nCG USAFIK MSG NBR ZGCG 1396 DTD 22 NOV 47 CONTINUED:\n\ntheir use by an unfriendly country can be assured. Personnel and materials: Estimates of additional material and personnel required to complete projects are included in rehabilitation programs already submitted. Some key civilian personnel are now leaving Korea because of delay in arrival of dependents. If Military Government is to achieve its accelerated program, vigorous recruitment must be launched to fill requisitions for key personnel now in Washington by March 1 1948. It is recommended that the committee consult with Owen I. Jones, Dept of State, regarding personnel and material requirements in light of availabilities and probable financial aid.\n\n8. Financial aid: South Korea will face economic collapse in event economic aid is suddenly withdrawn. Shortage of foreign exchange would eliminate coal imports from Japan and railways would practically cease to operate after 10 day period. Curtailment of import of petroleum products would immobilize motor transportation and affect fisheries so seriously; this might make it impossible for Korean Government to maintain food collection and distribution program; serious political results would undoubtedly follow. While exports are being pushed by SKIG there is no possibility of these reaching sufficient volume to cover basic essential imports. See five year rehabilitation program submitted to Under Secretary of Army Draper. An increase in Korean armed forces for South Korea will further unbalance budget and exert added inflationary pressure. To counteract this it is essential that tax reforms and collections be emphasized. A continuation of supplies under a grant in aid or rehabilitation program would do much to offset this inflationary pressure and stabilize economy. Consideration should, therefore, be given to question on whether US will remain financially involved in South Korea and for how 77945 PRIORITY \"Paraphrase not required. Handle as TOP SECRET correspondence per para 51 1 and 60 a (4) AR 380-5.\" -7Handling and transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) (2) (3), and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946.\n\nTOP SECRET    COPY NO.\n\n[0294면]\nDECLASSIFIED\nAuthority NND886527\n\nSECRET    PRIORITY\n\nCG USAFIK MSG NBR ZGCG 1396 DTD 22 NOV 47 CONTINUED:\n\nlong. If it is decided to continue economic assistance to South Korea consideration must be given whether funds should be freely turned over to Korean Government or closely supervised or administered by US or UN agency; in latter case the relationship of such agency to Korean Government and its specific powers should be defined. 9. Settlement of accounts:\na. Won receipts from sale of civilian supplies from GARIOA and FLC purchases are held in separate restricted account in the Bank of Chosen;\nb. Won expenditures by USAFIK for costs of occupation were borrowed from the Bank of Chosen;\nc. The dollar proceeds held in the Korea trust account will arise from exports of Korean products and deposits from pay as you go;\nLack of balance in budget for USAMGIK operations over past 2 years has resulted in an overdraft in the Bank of Chosen. It is recommended that these 4 accounts together with FLC loan and obligations to SCAP be considered jointly and one final settlement negotiated. Terms of this settlement should be considered in reference to any future financial commitments and controls which the US or UN may consider desirable. 10. Union of North and South Korea: In event of united Korea being established, any grant in aid program should be revised in light of change in economic requirements and political realities. Consideration should also be given to procedures for the assumption of powers by the Korean Government and the problems of integrating the economy and administration of North and South Korea. These problems are summarized in a paper entitled \"Procedure for the Assumption of Powers by the Provisional Government\" prepared by Subcommission No 3 of the Joint Commission; 5 copies were forwarded to Joint Chiefs of Staff as enclosure to radio from CG USAFIK. Should withdrawal be delayed, the problems raised in this paper will have to be solved.\n\nSection III.\n\nPar A. Reference orderly withdrawal from Korea, plans are based on troops to be withdrawn as tactical and preliminary essential service units, either to (1) FEC, or (2) ZI. Par B 77945 PRIORITY \"Paraphrase not required. Handle as TOP SECRET correspondence per para 51 1 and 60 a (4) AR 380-5.\" -8-\n\n[0295면]\nDECLASSIFIED\nAuthority NND8X6527\nFAR EAST COMMAND\nGENERAL HEADQUARTERS, U. S. ARMY FORCES, PACIFIC ADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\nTOP SECRET PRIORITY\nINCOMING MESSAGE\n\nCG USAFIK MSG NBR ZGCG 1396 DTD 22 NOV 47 CONTINUED:\n\nand Pusan over a period of 90 days. Dependents and civilians to be evacuated on shipping availability commencing at least 90 days prior to commencement of troop evacuation.\n\n3. Under Plan A (1), all TO and E equipment and serviceable post, camp and station property, less that used in Korea and authorized by WD, would accompany combat troops. 11 tons TO and E.\nTotal evacuation shipping weight is 120,000 long tons, or 321,000 measurement tons. Household goods and personal effects not included in previous figures total 20,000 long tons, or 60,000 measurement tons. Private cars - 4,000 long tons, or 10,000 measurement tons. Troop baggage - 2,000 long tons, or 3,000 measurement tons. For total personnel evacuation figures, 34,000 long tons, or 75,000 measurement tons should be considered.\n\n4. Under Plan A (2) only TO and E property would accompany troops in tonnages listed under Plan A (1).\n\n5. Under Plan B (1) and B (2) only essential individual equipment would be carried or accompany personnel. Total tonnages involved, 2,200 long tons, or 5,500 measurement tons. Additional Items to be shipped under any plan involves: Troop baggage - 4,000 long tons, or 10,000 measurement tons. Private cars - 2,000 long tons, or 8,600 measurement tons. Household goods and dependent baggage 2,300 long tons, or 6,100 measurement tons.\n\n6. It is recommended that balance of US property and equipment not required by US troops in Pacific be turned over to Korean Government. The shipping weight of all equipment in Korea at present is 625,000 long tons, or 1,500,000 measurement tons.\n\n7. All categories of ammunition on hand total 16,000 long tons, or 17,000 measurement tons; these weights not included in previous tonnage figures. If South Korean Army is authorized along lines of my ZGCQ 1293(210825/2), and my letter TA 32, 1 November 1947, ammunition needed for it and authorized weapons should be turned over to Korean Government. Remainder of serviceable ammunition to be removed or destroyed. Unserviceable ammunition to be destroyed.\n\n8. Under any assumption, all Class I, Class III and engineering construction material have not been included\n[0296면]\nDECLASSIFIED\nAuthority NND8X6527\nTOP SECRET PRIORITY\n\nCG USAFIK MSG NBR ZGCG 1396 DTD 22 NOV 47 CONTINUED:\n\nin previous figures. It is assumed such stocks would be consumed and all balance remaining turned over to Korean Government. Practically all types of equipment and stocks on hand would greatly aid Korean economy, even though some mal-administration may ensue under a new and necessarily weak government. The formation and training of a South Korean army, if authorized, would be greatly accelerated by furnishing ammunition from surplus stocks, or that in the hands of troops, or both. In event of withdrawal from Korea, it is estimated that under assumption that TO and E and post, camp and station property would accompany troops, following would remain for transfer to Korea under such arrangements as might be necessary. This does not include material which has been acquired for Korea under civilian supply programs or FLC arrangements.\n\nConstruction material - 270,000 long tons.\nHeavy engineer equipment - 200,000 long tons, consisting of topo equipment - 400 long tons; boat and bridge equipment - 8,000 long tons; heavy construction equipment including rock crushers, low bed trailers, cranes, road rollers and tractors, 172,000 long tons; pumps, generators and power tools - 18,000 long tons; and hand tools and organization sets 1,600 long tons. Engineer spare parts - 18,000 long tons.\nOrdnance spare parts - 24,000 long tons.\n3,200 vehicles of all types, weight 23,000 long tons, of which however approximately 6,000 long tons are combat vehicles. Ultimate disposition of latter would depend on decision now under consideration.\nRations, including field rations - 7,600 long tons. Other than field rations, articles are principally canned meat and milk.\nQuartermaster clothing and equipment, individual, approximately 50,000 sets of both. Weight 3,000 long tons. In addition post, camp and station Quartermaster equipment such as wall lockers, steel cots, etc, 5,000 long tons. Approximately 2,100 long tons miscellaneous medical supplies including beds, laboratory equipment, and fixed installations.\n\n[0297면]\nDECLASSIFIED\nAuthority NND8X6527\nFAR EAST COMMAND\nGENERAL HEADQUARTERS, U.S. ARMY FORCES, PACIFIC ADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\nTOP SECRET PRIORITY\nINCOMING MESSAGE\n\nCG USAFIK MSG NBR ZGCG 1396 DTD 22 NOV 47 CONTINUED:\n\n1. As to withdrawal of supplies and equipment, I recommend the overall withdrawal policy adopted visualize leaving in Korea and turning over to the Korean Government everything not vitally needed elsewhere in the Pacific area or that we do not want to fall into hands of agencies hostile to the US.\n\nThe economic situation here is such that almost everything we have, with the possible exception of weapons and ammunition, would serve a useful purpose in Korea. Most of the supplies and equipment are in areas requiring extensive rail haulage to reach a port, and most of it would have to clear through the limited and inflexible port of Inchon to avoid excessive haulage. The rail situation including fuel available and degree of willingness and ability of Koreans to operate the system, is such that it will be virtually impossible in reasonable time to evacuate a large part of impedimenta that would be visualized as profitably removable. We are having great difficulty even now in maintaining movement of our own supplies and equipment and movement of items essential in the local economy.\n\nSection IV concerning organization and training of a South Korea army or security force is being submitted separately.\n\nSection V, In view of nature of this answer, air mail letter will not follow unless further requests are made that will require such action. POLAD Bunce and Military Governor concur.\n\n[0298면]\n[illegible: heavily garbled OCR fragment; appears to be partial Korean/English teletype test pattern or scanning artifact]\n\n--Handle as TOP SECRET correspondence per para 51 1 and 60 a (4) AR 380-5.\n\nHandling and transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) (2) (3), and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946.\nTOP SECRET", "notes": [], "note": "기계 판독 참고 — OCR errors corrected: 'FORGES' to 'FORCES', 'JCOS' to 'JCS', '1s' to 'is', 'ФH' to 'as', 'Vited' to 'United', 'KILA' left as-is (proper noun). 'cance' in INFO line appears to be 'cancel' or garbled, preserved as-is. Top/bottom header stamps, page numbers, and marginal notes preserved. / 페이지 0292의 'Glen R Roams'는 문맥상 'Glen R. Evans'로 정정함. 페이지 0294의 'IN AND NINE'은 불명확하여 원문의 'in a paper entitled'로 재구성함. 'ZOCO 1396'은 문맥상 'ZGCG 1396'으로 정정함. / Page 0298 is mostly illegible; one sentence (POLAD concurrence) was recovered from legible fragments and context. Minor OCR garble at p. 0295 line 10 ('11 tons' likely part of 'All' but kept as-is).", "warn": false, "pages": ["0287", "0288", "0289", "0290", "0291", "0292", "0293", "0294", "0295", "0296", "0297", "0298"]}, {"id": "D044", "order": 43, "date": "1947-10-05", "group": "X", "eyebrow": "D044", "title": "미 국무부, 유엔 제출 한국 결의안 재초안; 미소공위 전 소련 답변 요구 시 지침", "badge": "TOP SECRET", "list_right": "0299–0299", "meta": [{"k": "발신", "v": "WAR (STATE DEPT, LOVETT)", "txt": true}, {"k": "수신", "v": "CG USAFIK (FOR POLAD)", "txt": true}, {"k": "참조", "v": "SCAP", "txt": true}, {"k": "전문번호", "v": "WAR SVC 5055"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0299–0299 (1면)"}, {"k": "건명", "v": null, "txt": true}], "summary": "State Dept redrafts UN resolution on Korea; instructions if Soviets demand answer before Joint Commission", "points": ["미 국무부는 한반도 문제를 유엔에 회부하기 위한 결의안을 재초안 중이며, 곧 최종안을 서울의 호지 장군에게 송부할 예정이다.", "소련이 유엔 결의안 송부 전에 미소공위 개최를 강행하고 소련 제안에 대한 미국의 답변을 요구할 경우, 미국 대표단은 '검토 중이며 적절한 시기에 답변하겠다'는 원론적 답변으로 대응할 것을 지시하고 있다.", "이 전문은 일급비밀(TOP SECRET) 등급으로, 극동군 주요 참모 및 외교라인에 배포되었다."], "primary": "[0299면]\n기밀해제:\n권한 NND8X6527\nLHS\n\n미 육군 태평양지역 총사령부\n인사참모부\n라디오 및 전보 센터\n수신 전문\n\n일급비밀\n일급비밀 우선급\n1947년 10월 5일\n\n발신: 미 육군부\n수신: 주한미군사령관 (정치고문 앞)\n참조: SCAP(연합군 최고사령관)\n전문번호: WAR SVC 5055 (국무부 발신 042228Z 군사통신문 중계)\n(국무부 전문번호 231, 1945년 10월 45일 오후, 로벳 서명)\n\n호지 장군의 9월 28일자 ZGCG 1201, 9월 22일자 ZGCG 1178 및 정치고문의 9월 22일자 369에서 언급된 사항을 고려하여, 국무부는 유엔에 제출할 결의안을 재초안하였으며 조만간 최종 결의안 형태를 서울로 송부할 수 있기를 희망함. 동 시점 이전에 소련이 미소공위 회의를 고집하고 소련 제안에 대한 미국의 답변 관련 성명을 요구할 경우, 미국 대표단은 소련 제안이 미국 정부에 의해 검토 중이며 적절한 시기에 적절한 방식으로 답변할 것이라고 밝혀야 함.\n\n서명 없음\n\n배포: 극동군 총사령관, 참모총장, G-2(정보), G-3(작전), 외교참모, JPO(합동기획국)\n\n수신일\n1947년 10월 6일\nARL\n\n우선급\n일급비밀 MCN: 62884 TOO: 050057 Z\n\n\"의역 불필요. AR 380-5, 제51항 1호 및 제60항 a (4)에 따라 일급비밀 문서로 취급할 것.\"\n\n\"이 전문 원문을 동일 등급의 문서로 취급 및 전달하는 것은 육군규정 380-5 (1946년 3월 6일) 제16-C, 18-E, 53-A, 53-D (1)(2)(3) 및 60-A (1)(2)(3)(4)항의 규정에 따라 육군부에 의해 승인되었음.\"\n\n사본 11번\n\nG-3 Lil", "secondary": "[0299면]\nDECLASSIFIED:\nAuthority NND8X6527\nLHS\n\nGENERAL HEADQUARTERS, U. S. ARMY, FORCES, PACIFIC\nADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\nINCOMING MESSAGE\n\nTOP SECRET\nTOP SECRET PRIORITY\n5 Oct 47\n\nFROM: WAR\nTO: CG USAFIK (FOR POLAD)\nINFO: SCAP\nNR: WAR SVC 5055 (RELAYS MSG DTG 042228 Z FROM STATE DEPT)\n(STATE SERIAL 231 OCT 45 PM SIGNED LOVETT)\n\nHaving in mind considerations mentioned General Hodge's ZGCG 1201 Sept 28, ZGCG 1178 Sept 22 and POLAD's 369 Sept 22 Dept has redrafted resolution for submission to UN and hopes to have final form of resolution ready for transmission Seoul shortly. Should Soviets insist on meeting of Joint Commission prior this time and should they insist on statement regarding US answer to Soviet proposal US Delegation should state that Soviet proposal is under consideration by US Govt which will answer in due course in appropriate manner.\n\nNO SIG\n\nINFORMATION: COMMANDER IN CHIEF, CHIEF OF STAFF, G-2, G-3, DIPLOMATIC, JPO\n\nRECEIVED\nOCT 6 1947\nARL\n\nPRIORITY\nTOP SECRET MCN: 62884 TOO: 050057 Z \"Paraphrase not required Handle as TOP SECRET correspondence per par 51 1 and 60 a (4) AR 380-5.\"\n\n\"Handling and transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) (2) (3), and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946.\"\n\nCOPY NO. 11\n\nG-3 Lil", "notes": [], "note": "기계 판독 참고 — OCR 원문의 날짜 표기 'OCT 45' 부분이 국무부 전문번호(STATE SERIAL)로 보이나 부자연스러움. 원문 그대로 유지함.", "warn": false, "pages": ["0299"]}, {"id": "D045", "order": 44, "date": "1947-09-29", "group": "D", "eyebrow": "D045 · D. 장래 정책·철군", "title": "소련의 철수 제안 분석: 선전 목적, 한국 내 반응, 그리고 남한군 창설 결정 필요성", "badge": "TOP SECRET", "list_right": "0300–0303", "meta": [{"k": "발신", "v": "CG USAFIK", "txt": true}, {"k": "수신", "v": "WAR (JCOS) G", "txt": true}, {"k": "참조", "v": "CINCFE", "txt": true}, {"k": "전문번호", "v": "ZGCG 1201"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0300–0303 (4면)"}, {"k": "건명", "v": "Withdrawal from Korea", "txt": true}], "summary": "Soviet withdrawal proposal analysis: propaganda aims, Korean reactions, and need for South Korean army decision", "points": ["소련의 조기 철수 제안은 예상된 것이나, 유엔 상정으로 인해 시기가 앞당겨진 측면이 있으며, 이는 점령군 상호 철수 속에서도 한국의 평화적 정부 수립을 위한 안전장치를 확보하지 않으면 내전을 초래할 것이라는 분석.", "이 제안은 광범위한 선전 공세로서, 미국의 점령을 인기 없게 만들고 신탁통치 비난을 미국에 전가하며 미국 내 철군 여론을 조장하려는 의도를 지님.", "한국 내 반응은 우익은 경계하며 반대, 좌익은 격렬히 환영하는 양상이나, 대중은 결과를 모른 채 조기 철수를 지지할 가능성이 높아 치안 소요가 우려됨.", "소련 제안 이후 가장 시급한 현안은 북한 인민군에 대항할 남한군 창설 여부로, 군 창설에는 막대한 외부 지원이 필수적이며 전면적 내전의 위험을 수반함."], "primary": "[0300면]\n비밀해제\n해제권한 NND 886527\nJLR\njjk\n미태평양육군총사령부(GENERAL HEADQUARTERS, U.S. ARMY FORCE, PACIFIC) 부관실 무선·전보센터\n수신 전문\n2급 비밀(TOP SECRET)\n\n1947년 9월 29일\n발신: 주한미군사령관(CG USAFIK)\n수신: 육군성 (합동참모본부) G\n참조: 극동군총사령관(CINCFE)\n메시지 번호: ZGCG 1201\n\n1. 한국 내 자치 정부 수립을 위한 공백 상태를 조성한다는 명목으로 점령군을 조기 철수하자는 소련의 제안은 예상치 못한 바가 아니었다. 북한 내 소련의 지배가 공고화되는 대로 이러한 제안이 나올 가능성은 수개월 동안 본 사령부의 보고에서 언급되어 왔다. 그러나 우리가 한국 문제를 유엔에 상정한 조치로 인해 소련이 당초 의도보다 다소 일찍 이 제안을 하게 된 것으로 보인다. 금주 초 회담 요구가 있었던 것은 유엔 총회가 한국 문제를 의제로 채택할 최종 결정을 내리기 전에 세계 여론을 선점하려는 의도였음을 시사한다. 이 메시지와 관련하여 9월 28일자 서울 폴라드 388, ZPOI 1200을 참조하라.\n\n2. 소련 대표단의 성명은 1946년 미소공동위원회 개막 이래 내가 이곳에서 목격한 것 중 가장 효과적이고 광범위한 의미를 지닌 흥미로운 대중 선전이다. 미국을 겨냥한 선전 공세로서 이는 다음과 같은 목표를 지닌 정곡을 찌르는 일격이다:\n(1) 한국인들 사이에서 미군 점령을 극도로 인기 없게 만들고 소련의 지지를 전 한국적으로 확산시킨다.\n(2) 소규모 국가들에게 소련이 소규모 국가들을 병합하려는 제국주의적 움직임을 보이지 않으며 완전한 독립과 민족자결을 지지한다는 신념을 심어준다.\n(3) 한국에 대한 원조 법안이 실패하도록 미국 의회와 국민을 혼란시키고 철군 여론을 들끓게 만든다.\n(4) 한국의 골칫거리인 \"신탁통치\"의 비난을 미국에 직접 돌리고 소련이 이제 신탁통치를 포기한다고 한국인들이 믿게 만든다.\n(5) 유엔에서 한국 문제를 의제에서 철회시키기 위해 쟁점을 흐린다.\n(6) 점령군의 조기 철수에 관한 구체적 제안 문제에서 미국보다 먼저 주도권을 잡는다.\n이 제안이 고위급에서가 아니라 미소공동위원회라는 국지적 무대에서 이루어졌다는 점이 다소 의외였지만, 이는 유엔보다 우리가 주도권을 먼저 잡는 것을 차단하기 위한 시간적 필요성 때문이었음이 분명하다.\n\n[0301면]\n3. 제안의 문구를 분석해 보면 극히 일반적이고 모호하여 소련이 원하는 대로 향후 어떤 해석이든 가할 수 있게 되어 있다. 이러한 모호함이 의도적이라는 점에는 의심의 여지가 없으며, 이는 이곳은 물론 전 세계 다른 지역에서도 우리의 점령에 반대하는 향후 대대적인 선전 포격을 위한 유연한 발판을 마련하기 위함이다. 우리는 초기에는 이 공세에 몸을 맡기며 유엔에서 이 문제를 가차 없이 추진해야 한다고 본다. 즉, 총회에 제출할 우리 결의안을 수정하여 원칙적으로 쌍방의 병력 철수는 수용하되, 한국 국민의 의사에 따른 평화적 정부 수립을 위한 안전장치 제공의 필요성을 명확히 제시하는 것을 희생하지 말아야 한다. 이러한 안전장치 없이 성급하게 철군한다면 이곳은 틀림없이 내전이 발발할 상황에 놓이게 될 것이며, 뒤따르는 혼란 속에서 공산주의가 전면적으로 득세하고 모든 민족주의 지도자들이 숙청되어 소련의 한국 장악 목표가 용이하게 완수될 것이다.\n\n4. 이곳의 초기 여론 반응을 보면, 이승만-김구 계열을 포함한 우익 지도자들은 소련 제안의 간계를 인지하고 반대할 것이다. 이들은 우리의 보호를 원하기 때문이지만, 한국인이 통치권을 인수하는 대로 철군한다는 발상 자체는 여전히 환영하고 있다. 좌익 계열은 이 제안을 하나 같이 격렬하게 환영하고 있다. 그들의 성명은 사전에 준비된 느낌을 준다.\n\n[0302면]\n김규식은 개인적으로 반대하지만, 협동위원회의 한 대변인을 포함한 광범위한 계층이 이 제안에 대한 환영과 찬성의 뜻을 표하고 있다. 공산주의자들에게 선동된 무지한 대중이 결과에 대한 자각 없이 어떤 조건에서든 조기 철수를 전적으로 지지하리라는 점은 예상된 바다. 또한 한국의 소용돌이 속으로 던져진 이 새로운 요소가 미군 병력과 인원이 연루된 폭력적 소요 사태의 가능성을 상당히 증가시키리라는 점도 예상해야 할 것이다.\n\n5. 소련의 제안은 미군의 한국 철수에 있어 우리의 \"체면을 유지할\" 길을 열어줄지도 모른다. 웨더마이어 장군과 드레이퍼 차관이 이곳에 머무는 동안 제공받은 브리핑과 문서는 미군 철수에 대해 미국이 취해야 할 장기적 자세에 관한 고위급 결정을 내리는 데 본 사령부로부터 필요한 정보를 제공하기에 충분히 완전한 것이라고 믿는다. 과거 보고와 논의에서 내가 시사해 온 대로, 소련이 상호 철수를 제안한 이후로는 우리가 장기간에 걸쳐 한국에 군대를 주둔시키는 것이 불가능하지는 않더라도 어려울 것이라는 것이 나의 견해이다. 그러나 소련이 이 제안을 내놓는 근거는 현재의 북한 내 소련 통제 상황, 대규모 꼭두각시 \"인민군\"과 남한 내의 효과적인 제5열대의 존재 하에서는 미국이나 한국의 비공산주의자들이 결코 수용할 수 없는 것이다.\n\n6. 소련 제안이 제기하는 가장 큰 당면 과제 중 하나는 한국의 비공산주의 무장 병력 문제라고 본다. 러시아가 장래의 유엔 결정이나 협상을 통해 합의될 사항을 준수하지 않는 한, 북한 \"인민군\"의 철폐나 실질적 감축을 얻어낼 가망은 거의 없다.\n\n[0303면]\n반면에, 소련의 제안 이후 지금 우리가 남한에 강력한 군대를 창설한다면, 이 지역의 전면적 내전을 위한 무대를 설정하는 셈이 된다. 비공산주의자들로서는 공산주의자들보다 2년이나 뒤처진 불리한 조건에 맞서야 하는 것이다. 우리의 결정은 전체 외교 정책에 기초해 내려져야 한다. 만약 남한군을 창설하기로 결정한다면, 보급품, 수송, 무기, 장비에 대한 대대적인 지원이 현지 관할권을 벗어난 출처로부터 가능한 한 신속히 제공되어야만 한다.\n\n하 지(HODGE, 주한미군사령관)\n\n통보: 총사령관, 참모장, G-2, G-3, 외교, 정보기획실(JPO)\n\n우선 처리 메시지 통제 번호 발신 시각: 280730/Z : 62383\n\"의역 불요. 육군규정 380-5 511항 및 60 a(4)에 의거 2급 비밀(TOP SECRET) 통신으로 취급할 것.\"", "secondary": "[0300면]\nDECLASSIFIED\nAuthority NND 886527\nJLR\njjk GENERAL HEADQUARTERS, U.S. ARMY FORCE, PACIFIC ADJUTANT GENERAL'S OFFICE RADIO AND CABLE CENTER\nINCOMING MESSAGE\nTOP SECRET\n\n29 Sep 47 5L\nFROM: CG USAFIK\nTO: WAR (JCOS) G\nINFO: CINCFE\nNR: ZGCG 1201\n\n1. The Soviet proposal for early withdrawal of occupying forces from Korea, with a view to creating a vacuum within which Koreans can form their own government, was not unexpected. The probability of such a proposal as soon as the Soviets were consolidated in North Korea, has been mentioned in reports from this command over a period of several months. However, it appears that we may have forced the proposal slightly earlier than the Soviets intended by our action of putting the Korean question into the United Nations. Demands for a meeting early this week indicated they were attempting to get this proposal before the world prior to the final decision of the General Assembly to put the Korean question on its agenda. In connection with this message, see Seoul POLAD 388 Sep 28, ZPOI 1200.\n\n2. Soviet Delegation's statement is the most effective and interesting piece of general propaganda of wide significance that I have seen here since the Joint Commission opened in 1946. As a propaganda blow aimed at the United States it is a swing from the tops designed to:\n(1) Make US occupation vastly unpopular with Koreans and win Soviet support all over Korea;\n(2) Win the support of small nations to the belief that the Soviets are not making imperialistic moves to absorb small nations and that they favor complete independence and self-determination by small nations;\n(3) Confuse the United States Congress and people to the end that proposals for grant in aid for Korea will fail and that a clamor will be made to withdraw troops;\n(4) Place the onus of the Korean bugaboo of \"trusteeship\" directly at the door of the United States and make Koreans believe the Soviets now renounce trusteeship;\n(5) Becloud the Korean issue in the United Nations in effort to get Korea withdrawn from agenda;\n(6) Beat the United States to the punch on the matter of any specific suggestion of early withdrawal of occupying forces from Korea.\nIt was a little surprising that the proposal was made locally in the Joint Commission rather than on a high level, but apparently this was because of required timing to beat us to the punch with United Nations.\n\n[0301면]\n3. Analysis of wording of the proposal shows it to be extremely general and amorphous, so that it can be subject to any future interpretation that the Soviets wish to place upon it. There is no question but that this generality is deliberate so as to form a flexible groundwork for a future heavy propaganda barrage against our occupation here, as well as in other areas throughout the world, It is my opinion that we should initially roll with the punch and push the issue relentlessly in United Nations, making such modification of our resolution to be presented to the General Assembly as is necessary to accept in principle a mutual withdrawal of our forces in Korea but without sacrificing a clear cut presentation of necessity for providing safeguards for the peaceful formation of a Korean government by the will of the Korean people, Any precipitate withdrawal without these safeguards would leave a condition here where civil war will certainly break out, and in the resulting chaos, Communism will take over full sway, and all Nationalist leaders will be wiped out, thus making easy the full accomplishment of the Soviet aims to take over Korea.\n\n4. Early public reaction here indicates that Rightist leaders, including the Rhee-Kim Koo groups, recognize the trick in the Soviet proposal and will oppose it because they want our protection, although they still welcome the idea of withdrawal as soon as Koreans take over. Leftist groups solidly and vehemently welcome the proposal as is. Their statements have flavor of being pre-prepared.\n\n[0302면]\nBroad groups, including one Coalition Committee spokesman express welcome and approval of the proposal although Kimm Kiusic personally opposes. It is to be expected that the mass of ignorant Koreans agitated by the Communists will fully support early withdrawal under any conditions without realization of results. It may also be expected that this new feature thrown into the Korean cauldron will increase considerably the potential for violent disorders in South Korea involving American troops and personnel.\n\n5. The Soviet proposal may open the way to our \"saving face\" in withdrawal from Korea by US troops. I believe the briefing and documents given to General Wedemeyer and Under Secretary Draper while here are sufficiently complete to give the information needed from this command to make any high level decisions as to the long range attitude the United States should take toward troop withdrawals. As I have indicated in past reports and discussions, it is my opinion that after a Soviet proposal for mutual withdrawal it will be difficult if not impossible for us to maintain troops in Korea over any extended period. However, the basis upon which the Soviets put this suggestion is certainly not acceptable to the United States or to Korean non-Communists under present conditions of the Soviet control in the north, with the large stooge \"peoples army\" and the effective Fifth Column in South Korea.\n\n6. In my opinion one of the greatest immediate questions posed by the Soviet proposal is the question of Korean non-Communist Armed Forces. Unless Russia will abide by future United Nations decisions or by agreements to be negotiated, there is little hope of getting abolition or material reduction of the \"peoples army\" of North Korea.\n\n[0303면]\nOn the other hand, if now, after the Soviet proposal, we should build up a strong army in South Korea we are setting the stage for full scale civil war in this area — with the non-Communists facing the odds of a two year start by the Communists. Our decision must be made based on overall foreign policy. If we decide to build a South Korean Army, large scale support in supplies, transportation, arms, and equipment must be forthcoming soonest from sources beyond local jurisdiction.\n\nHODGE\n\nINFORMATION: COMMANDER IN CHIEF, CHIEF OF STAFF, G-2, G-3, DIPLOMATIC, JPO PRIORITY MCN TOO: 280730/Z : 62383 \"Paraphrase not required. Handle as TOP SECRET correspondence per para 511 and 60 a (4) AR 380-5.\"", "notes": [], "note": "기계 판독 참고 — 두 번째 페이지의 선전 목적 번호가 원문에서 5번이 중복되어 6번으로 수정함. 세 번째 페이지 말미 서명란의 약어들은 OCR 오류로 보존함.", "warn": false, "pages": ["0300", "0301", "0302", "0303"]}, {"id": "D046", "order": 45, "date": "1947-12-06", "group": "D", "eyebrow": "D046 · D. 장래 정책·철군", "title": "한국 국방경비대 및 경찰을 위한 탄약·카빈 소총 소요 요청", "badge": "SECRET", "list_right": "0304–0304", "meta": [{"k": "발신", "v": "CG XXIV CORPS", "txt": true}, {"k": "수신", "v": "CINCFE", "txt": true}, {"k": "참조", "v": "CSGPO", "txt": true}, {"k": "전문번호", "v": "GDSP 1438"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0304–0304 (1면)"}, {"k": "건명", "v": "Future Policy in Korea", "txt": true}], "summary": "Ammunition and carbine requirements for Korean Constabulary and National Police", "points": ["한국 국방경비대 탄약 소요(CX 56855)는 확정된 수치임.", "한국 경찰용으로 9,852정의 카빈 소총(.30구경)과 수십만 발의 실탄을 FEC에 추가 요청함.", "추가 카빈 1,627정은 경찰 보유 카빈 27,111정에 대한 6개월분 교체 소요로 산정됨.", "예비 부품 및 부속품 소요는 1948년 말 기준 재고 초과분을 검토하여 별도 목록으로 송부할 예정임."], "primary": "[0304면]\nDECLASSIFIED\nAuthority NND 886527\n극동군 총사령부(GHQ/FEC)\n부관부\n무선통신센터\n수신 전문\nSECRET 1947년 12월 6일\n발신: 제24군단장(CG XXIV CORPS)\n수신: 극동군 총사령관(CINCFE)\n정보 배포: CSGPO\n전문 번호: GDSP 1438\n\n제1부. 1947년 12월 1일자 귀관 전문 57020에 열거된 대로의 탄약 소요. 본 전문은 4부로 구성됨.\n\n제2부. CX 56855에 열거된 탄약 소요는 한국 국방경비대(Korean Constabulary) 소요이며 확정된 것임.\n\n제3부. 상기 소요에 다음의 한국 경찰(Korean National Police) 탄약 청구 추가를 요청함. 68,125 카빈 소총, .30구경; 130,900발, .30구경; 812,500발. 기준: 숙달 훈련 및 경계용 무기 1정당 100발. FEC로부터 한국 경찰에 필요한 8,125정의 카빈 소총 요청에 추가로 1,627정(M1 또는 M2)을 추가하여 총 9,852정을 요청함. 이 추가분 1,627정은 경찰용 카빈 27,111정에 대한 6개월분 교체 계수임.\n\n제4부. 예비 부품 및 부속품 소요는 본 사령부에서 1948년 12월 31일 기준 초과 가용 품목에 대해 검토 중이며, 목록은 FEC로 송부될 예정임.\n\n서명 없음\n조치 참조처: G-4\n정보 참조처: G-2, G-3\n\n발신 시간: 050620 Z MCN: 66973\n\"의역 불필요. SECRET. AR 380-5 제51조 1항 및 제60조 a (4)에 따라 취급.\"\nTOP SECRET 통신\nG-3 파일 SECRET\n본 전문의 축어적 평문 취급 및 동일 등급 통신으로서의 전송은 1946년 3월 6일자 AR 380-5 제16-C조, 제18-E조, 제53-A조, 제53-D(1)조, 제3-G(2)(3)조 및 제60-A(1)(2)(3)(4)조의 규정에 따라 육군부(War Department)에 의해 승인되었음. 16-50735-1 GPO 사본 번호 10", "secondary": "[0304면]\nDECLASSIFIED\nAuthority NND 886527 GENERAL HEADQUARTERS, FAR EAST COMMAND\nADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\nINCOMING MESSAGE\nSECRET 6 Dec 47\nFROM : CG XXIV CORPS\nTO : CINCFE\nINFO: CSGPO\nNR : GDSP 1438 Part 1. Ammunition requirements as listed in your radio 57020 dtd 1 Dec 47. Radio in 4 parts.\n\nPart 2. Ammunition requirements listed in CX 56855 are for Korean Constabulary and are firm.\n\nPart 3. Request following ammunition requisitions for Korean National Police be added to above requirements: 68,125 carbines, cal .30; 130,900 rds. cal .30; 812,500 rds. Basis: 100 rds per weapon for familiarization and alert. Request additional 1,627 carbines, M 1 or M 2 be added to request for 8,125 carbines to make a total requirement of 9,852 carbines needed from FEC for Korean National Police. This additional requirement of 1,627 carbines is 6 months replacement factor for 27,111 carbines for National Police.\n\nPart 4. Spare parts and accessory requirements are being screened by this HQ for items available in excess of 31 Dec 48 level, and list forwarded to FEC.\n\nNO SIG\nACTION : G-4 INFORMATION : G-2, G-3\n\nTOO: 050620 Z MCN: 66973 \"Paraphrase not required SECRET. Handle as per para 51 1 and 60 a (4) AR 380-5. \" TOP SECRET correspondence\nG-3 FILE SECRET\nHandling and transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) 3-G (2) (3), and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946. 16-50735-1 GPO COPY No. 10", "notes": [], "note": "기계 판독 참고 — Line 1 of original OCR: 'GEI 'AL HEADQUARTERS' corrected to 'GENERAL HEADQUARTERS'. Line 9: '11 Cx 56855' corrected to 'Part 2. Ammunition requirements listed in CX 56855'. Line 11-13: Carbine quantity '0,125' corrected to '68,125'; 'ras.' corrected to 'rds.'; extraneous text 'For 1,389 pistols, cal 7/ p10 VE!' removed. Line 15 '1s' corrected to 'is'. Line 15 '27,1l1' corrected to '27,111'. Line 16 'ho' corrected to 'HQ'. Line 18 'uthority of Mes t'8 * Judson Sr.' underneath 'NO SIG' line removed as probable artifact/scribble. Line 19 'G-3 uthority of Mes t'8 * Judson Sr.' truncated to 'G-3' per visible text.", "warn": false, "pages": ["0304"]}, {"id": "D047", "order": 46, "date": "1947-12-01", "group": "X", "eyebrow": "D047", "title": "ZGC T-1401 및 CX 56855에 언급된 조선국방경비대 탄약 소요에 대한 임시 조치", "badge": "TOP SECRET", "list_right": "0305–0305", "meta": [{"k": "발신", "v": "CINCFE", "txt": true}, {"k": "수신", "v": "CG XXIV CORPS", "txt": true}, {"k": "참조", "v": "WAR (CSGPO)", "txt": true}, {"k": "전문번호", "v": "GD 8P/JDS/AA/nce (?) / T-1401? (ZGC T-1401 referred to)"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0305–0305 (1면)"}, {"k": "건명", "v": null, "txt": true}], "summary": "Interim action on ammunition requirements for Korean Constabulary, referring to ZGC T-1401 and CX 56855", "points": ["CINCFE는 XXIV 군단장에게 한국군(Korean Constabulary) 추가 탄약 소요에 대해 임시 조치 기준을 전달함.", "기존 전문 CX 56855의 탄약 소요량이 추가된 8,125정의 카빈 소총 물량을 포함한다고 간주함.", "만약 그렇지 않을 경우, 군단장은 전체 탄약 소요량과 그 산출 근거를 상세히 보고할 것을 지시받음.", "해당 전문은 육군 규정에 따라 평문 취급 및 전송이 허가된 문서임."], "primary": "[0305면]\n기밀해제\n권한 NND886527\n2급비밀(TOP SECRET)\n\n극동군 총사령부(GHQ/FEC)\n\n발신 전문 GD 8P/JDS/AA/nce\n\n일자: 1947년 12월 1일\n\n발신: 극동군 총사령관(CINCFE)\n수신: 제24군단장(CG XXIV CORPS) 통상 010231\n\n정보: WAR(육군부 참모총장 작전참모부) (CSGPO) 통상\n\n괄호 귀관 전문 ZGC T-1401 11월 23일부 및 우리 측 전문 CX 56855 11월 22일부 (WAR에는 필요하지 않음) 임시 조치에 관한 건. ZGC T-1401에 추가로 요청된 소요는 CX 56855에서 이미 지시된 심사 연장선에서 검토될 것임. 2항. ZGC T-1401에 탄약 소요가 전혀 언급되지 않았음을 여기서 확인함. CX 56855의 탄약 소요가 추가 8,125정의 카빈 소총에 대한 탄약 소요를 포함하는 것으로 간주함. 만약 그렇지 않을 경우 전체 탄약 소요와 그 산출 근거를 명시하라.\n\n공식:\n본 전문의 평문 취급 및 전송이\n육군부 전쟁성(War Department)에 의해 허가되었음.\n\n서명 /s/ B. M. 레비\n대령, 부관감부\n서명 /s/ H. E. 이스트우드\n대령, 부관감부\n부관감\n\n배포처:\nG-1\nG-2\nG-3\nG-4 기획 및 정책\n\n비밀전문서 사본\n3 - 2급비밀 G-3 사본 제7호 파일 보관용\n\n(하단 비고: 육군 규정 AR 380-5, 1946년(추정) 3월 6일자 16-c항 및 기타 조항에 의거함)", "secondary": "[0305면]\nDECLASSIFIED\nAuthority NND886527\nTOP SECRET\n\nGENERAL HEADQUARTERS\nFAR EAST COMMAND\n\nOUTGOING MESSAGE GD 8P/JDS/AA/nce Date: 1 December 1947\n\nFROM: CINCFE\nTO : CG XXIV CORPS ROUTINE 010231\n\nINFO: WAR (CSGPO) ROUTINE\n\nPAREN PAREN ONE PD REURAD ZEBRA GEORGE CHARLIE TARE ONE FOUR ZERO ONE OMA TWO THREE NOVEMBER OMA LOOK ALL OURAD CHARLIE XRAY FIVE SIX EIGHT FIVE FIVE OMA TWO TWO ONE NOVEMBER PAREN NOT TO WILLIAM ABLE ROGER NOR NEEDED PAREN FOR INTERIM ACTION PD ADDITIONAL REQUIREMENT URAD ZEBRA GEORGE CHARLIE TARE ONE FOUR ZERO ONE WILL BE CONSIDERED IN EXTENSION OF SCREENING ALREADY INDICATED IN CHARLIE XRAY FIVE SIX EIGHT FIVE FIVE PD PARA TWO PD NOTED HERE NO RPT NO AMMUNITION REQUIREMENTS STATED IN ZEBRA GEORGE CHARLIE TARE ONE FOUR ZERO ONE PD ASSUMED HERE AMMUNITION REQUIREMENTS OURAD CHARLIE XRAY FIVE SIX EIGHT FIVE FIVE COVER AMMO REQUIREMENTS INCLUDING ADDITIONAL EIGHT ONE TWO FIVE CARBINES PD IF NOT CMA STATE COMPLETE AMMO REQUIREMENTS AND BASIS THEREFOR PD\n\nOFFICIAL:\nHandling and transmission cancelled plain text of this message has been authorized\n\n/s/ B. M. Levy\nColonel, Adjutant General's Dept.\n/s/ H. E. EASTWOOD\nColonel, AGD Adjutant General Gopies furnished:\nG-1\nG-2\nG-3\nG-4 P&P\n\nSECRETEMATION COPY\n3 - TOP SECRET G-3 Copy No. 7 File Copy 21 by the War Department 22 in accordance with the provisions of paragraphs 16-c, 23 -, AR 380-5, 6 March [illegible]\n24 25 26", "notes": [], "note": "기계 판독 참고 — OCR noise in message number and date formats partially reconstructed using phonetic alphabet context (e.g., ZGCT->ZGC, CINCPE->CINCFE). The message text was heavily corrupted but restored using standard military ‘PATTERN’ (phonetic alphabet) parsing. 'Gopies' corrected to 'Copies'. 'Our' in message nr prefix interpreted as standard Army cable designation.", "warn": false, "pages": ["0305"]}, {"id": "D048", "order": 47, "date": "1947-11-23", "group": "D", "eyebrow": "D048 · D. 장래 정책·철군", "title": "미국 무기의 남조선 경비대 및 경찰 지급 계획", "badge": "TOP SECRET", "list_right": "0306–0306", "meta": [{"k": "발신", "v": "CG XXIV CORPS", "txt": true}, {"k": "수신", "v": "CINCFE", "txt": true}, {"k": "참조", "v": "WAR (CSGPO)", "txt": true}, {"k": "전문번호", "v": "ZGCT 1401"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0306–0306 (1면)"}, {"k": "건명", "v": "Future Policy in Korea", "txt": true}], "summary": "Issue of US weapons to South Korean Constabulary and National Police", "points": ["주한 미 제24군단은 남조선 경비대에 대해 1948년 말까지 소총(M-1) 3,038정, 카빈 소총 2,102정이 부족하지만, 여타 장비는 가용 자산 내에서 즉시 지급을 개시할 계획이다.", "대한 경찰은 기존 지급된 미군 무기 외에 추가로 카빈 소총 8,125정이 필요하며, 노후된 일본제 무기를 완전히 교체하려 한다.", "경찰 및 경비대의 무기 소요량 산정 시 주일 미8군의 재고를 제24군단의 가용 자산으로 포함하여 청구를 준비 중이다."], "primary": "[0306면]\n기밀해제\n권한 NND8X6527\n\n극동군 사령부\n미 육군 태평양 지역 총사령부\n인사참모부\n전문 통신 센터\n\n일급비밀(TOP SECRET)\n\n통상(Routine)\n\n1947년 11월 23일\n\n발신: 제24군단장\n수신: 극동군 총사령관(CINCFE)\n참조: 전쟁부(CSGPO)\n전문번호: ZGCT 1401\n\n본 전문은 세 부분으로 구성됨:\n\n제1부.\n남조선 경비대에 대한 미국 장비 지급.\n회신 전문 CX 56612 (100645/z). 미국 장비는 공표 없이 즉시 통상적인 방식으로 점진적으로 남조선 경비대에 지급될 예정임.\n\nb. 1948년 12월 31일까지 제24군단의 정상 교체 소요를 초과하는 충분한 무기가 다음을 제외하고 가용함: M-1 소총 3,038정, 카빈 소총 2,102정.\n\n제2부.\n대한 경찰에 대한 미국 장비 지급.\n현재 경찰에는 다음과 같이 미군 무기가 지급되어 있음: 카빈 소총 18,986정 및 구경 .45 권총 500정. 나머지 경찰은 일본제 무기를 지급받았음. 노후화, 정비 및 보급 시설 부족, 일본제 탄약 재보급 규정으로 인해, 경찰을 전면 미국 무기로 무장시키는 것이 바람직함. 이를 위해 다음 미국제 무기가 추가로 소요됨: 카빈 소총: 8,125정.\n\n제3부.\n한국 외부에서 제공될 추가 무기 소요를 산정함에 있어 주한 미8군이 보유한 한국용 무기 재고를 제24군단의 가용 자산으로 고려하였음. 제24군단을 위해 미8군이 보유 중인 무기에 대한 청구서를 미8군에 제출하기 위해 현재 작성 중임.\n\n조치: G-3\n\n정보 배포: 총사령관, 참모장, G-2, G-4\n\n통상 230148\n66273\n\n\"본 전문의 평문 원문 전송은 동일 등급의 왕복 서신에 대해 육군부가 1946년 3월 6일자 육군 규정 380-5, 16-C, 18-E, 53-A, 53-D (1) (2) (3) 및 60-A (1) (2) (3) (4)항의 규정에 의거하여 승인하였으므로 전송 전 군사 의역이 요구되지 않음.\"\n\n일급비밀 서신", "secondary": "[0306면]\nDECLASSIFIED\nAuthority NND8X6527\n\nFAR EAST COMMAND\nGENERAL HEADQUARTERS, U.S. ARMY FORCES, PACIFIC\nADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\n\nTOP SECRET\n\nROUTINE\n\n23 Nov 47\n\nFROM : CG XXIV CORPS\nTO : CINCFE\nINFO : WAR (CSGPO)\nNR : ZGCT 1401 This radio in 3 parts:\n\nPart 1.\nIssue of US equipment to South Korean Constabulary. Reurad CX 56612 (100645/z). It is contemplated that US equipment will be issued to the South Korean Constabulary on a gradual basis in a routine manner beginning immediately without publicity.\n\nb. Sufficient weapons in excess of XXIV Corps normal replacement requirements through 31 Dec 48 are available except follows: Rifles M-1; 3,038. Carbines; 2,102.\n\nPart 2.\nIssue of US equipment to National Korean Police. The National Police at present have been issued US weapons as follows: 18,986 carbines and 500 pistols caliber .45. remainder of the police are issued Japanese weapons. Due to deterioration, lack of maintenance and supply facilities, and provisions for resupply of Japanese ammunition, it is desired to completely arm the National Police with US weapons. To accomplish this the following additional US weapons will be required: Carbines: 8,125.\n\nPart 3.\nIn arriving at the additional requirements of weapons to be furnished from sources outside of Korea, the stocks of weapons held by Eighth Army for Korea were taken into consideration as assets available to XXIV Corps. Requisitions for the weapons held by Eighth Army for XXIV Corps are now being prepared for submission to Eighth Army.\n\nACTION : G-3 INFORMATION : COMMANDER IN CHIEF, CHIEF OF STAFF, G-2, G-4\n\nROUTINE 230148\n66273 \"Paraphrase not required prior to transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) (2) (3), and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946.\"\n\nTOP SECRET correspondence", "notes": [], "note": "기계 판독 참고 — Original OCR contained numerous typographical errors, especially in the bottom boilerplate text, which were reconstructed based on common phrasing in similar military cables.", "warn": false, "pages": ["0306"]}, {"id": "D049", "order": 48, "date": "1947-11-05", "group": "D", "eyebrow": "D049 · D. 장래 정책·철군", "title": "미국 장비의 한국 경비대(Constabulary) 지급 승인, 보병 소화기로 제한", "badge": "SECRET", "list_right": "0307–0308", "meta": [{"k": "발신", "v": "CINCFE", "txt": true}, {"k": "수신", "v": "CG USAFIK", "txt": true}, {"k": "참조", "v": "WAR (CSGPO)", "txt": true}, {"k": "전문번호", "v": "CX 56612"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0307–0308 (2면)"}, {"k": "건명", "v": "Future Policy in Korea", "txt": true}], "summary": "Authorization to issue US equipment to South Korean Constabulary (National Police Guard), limited to infantry small arms", "points": ["미국은 참조 문서에 정의된 국가 경찰 예비대(경비대)에 대한 장비 지급 조항을 확대 적용하는 것을 승인했다.", "지급되는 무장은 보병 소화기(경기관총 포함)로만 제한되며, 박격포·곡사포는 유엔 위원단(UNTCOK)에 한국 문제가 회부된 상황에서 바람직하지 않아 지급을 금지했다.", "장비 지급은 1948년 말까지의 24군단 충원 소요를 초과하는 한국 내 잉여 재고 내에서만 이루어져야 하며, 외부에 알리지 않고 일상적으로 수행되어야 한다."], "primary": "[0307면]\n비밀해제\n권한 NND86527\n\n극동군 총사령부\n통신대 메시지 GC-P IDS/it\n\n발신: 극동군 총사령관(CINCFE)                      1947년 11월 5일 비밀\n수신: 주한 미군 사령관(CG USAFIK)   ..              정규 100645\n정보: 전쟁부(참모총장 작전기획처)(CSGPO) ..         정규\n\n       (CX 56612) 제목: 남한 경비대(Constabulary)에 대한 미국 장비\n지급 건. 참조: (A) 10월 29일자 W-89253, (B) 10월 22일자 C X 56266,\n(C) 46년 1월 24일자 C A X 57249, (D) 46년 1월 11일자 W X 92187.\n\n제1항. 참조 D의 규정을 참조 C에 정의된 국가 경찰 예비대(경비대)에게지\n확대 적용하는 것을 승인함.\n제2항. 미국이 지원하는 무장은 참조 C에 명시된 목적을 위한 것이어야 하며,\n경기관총을 포함한 보병 소화기에 국한됨. 무기 및 장비 지급은 1948년 12월\n31일까지의 24군단(XXIV Corps)의 통상적인 18개월 분 교체 소요를 초과하는\n한국 내 재고의 범위로 제한됨. 한국 문제가 유엔 한국 임시 위원단(UNTCOK)에\n회부된 점에 비추어, 박격포 및 곡사포 지급은 불필요함(반복). 무기 지급은\n일상적인 방식으로 수행되어야 하며, 어떠한 대외 공표도 금지됨(반복).\n제3항. 지급된 수량과 제2항 규정에 따라 충당할 수 없는 소요를 보고할 것.\n\n비밀등급 비밀, 또는 109-18의 권한에 의해,\nby art ya. 변경됨.\n\n        /서명/ H. X. 저드슨\n\n        H. X. 저드슨(H. X. JUDSON)\n        작전참모부(G-3) AN CX 56612\n\n[0308면]\n비밀해제\n권한 NND886527\n\n공식 증명:\n\n/서명/ R. M. 레비\n    R. M. 레비(R. M. LEVY)\n부관감실장(Adjutant General)\n\n /서명/ 워드 H. 메리스\n     워드 H. 메리스(WARD H. MARIS)\n     대령, 부관감실(AGD)\n     A Bt a C Cen os sta.5, C3\n\n배포처:\n(반송)\n\nCX 56612", "secondary": "[0307면]\nDECLASSIFIED\nAuthority NND86527\n\nGENERAL HEADQUARTERS\nFAR EAST COMMAND\nSIGNAL CORPS MESSAGE GC-P IDS/it\n\nFROM: CINCFE                                 SECRET 5 November 1947\nTO  : CG USAFIK              ..              ROUTINE 100645\nINFO: WAR (CSGPO)           ..              ROUTINE (CX 56612) SUBJECT IS ISSUE OF UNITED STATES EQUIPMENT TO\nSOUTH KOREAN CONSTABULARY PD REFERENCES CIN (A) WILLIAM EIGHT\nNINE TWO FIVE THREE OF TWO NINE OCTOBER SUCIN (B) CHARLIE XRAY\nFIVE SIX TWO SIX SIX OF TWO TWO OCTOBER SMOIN (C) CHARLIE\nABLE XRAY FIVE SEVEN TWO FOUR NINE OF TWO FOUR JANUARY FOUR SIX SMOIN\n(D) WILLIAM XRAY NINE TWO ONE EIGHT SEVEN OF ONE ONE JANUARY FOUR SIX PD\n\nPARA ONE PD YOU ARE AUTHORIZED TO EXTEND THE PROVISIONS OF REF DOG TO INCLUDE\nTHE NATIONAL POLICE GUARD (CONSTABULARY) AS DEFINED IN REF CHARLIE\nPD PARA TWO PD ARMAMENT FURNISHED BY THE UNITED STATES WILL BE FOR THE\nPURPOSES SET FORTH IN REF CHARLIE AND WILL BE LIMITED TO INFANTRY SMALL ARMS\nINCLUDING LIGHT MACHINE GUNS PD ISSUE OF ARMS AND EQUIPMENT WILL BE LIMITED\nTO STOCKS AVAILABLE IN KOREA IN EXCESS OF ROMAN TWENTY FOUR CORPS NORMAL\n18 MONTH REPLACEMENT REQUIREMENTS THROUGH THREE ONE DEC FOUR EIGHT PD IN VIEW OF\nREFERENCE OF KOREAN PROBLEM TO UNTCOK THE ISSUANCE OF MORTARS AND\nHOWITZERS IS NOT REPEAT NOT DESIRED PD ISSUANCE OF ARMS WILL BE CONDUCTED\nIN A ROUTINE MANNER WITH NO REPEAT NO PUBLICITY PD PARA THREE PD REPORT\nQUANTITIES ISSUED AND REQUIREMENTS THAT CANNOT BE MET UNDER PROVISIONS OF\nPAR TWO PD.\n\nClassificaSECRET or changed to authority of 109-18, by art ya.\n\n/s/ H. X. Judson\n\nH. X. JUDSON\nG-3 AN CX 56612\n\n[0308면]\nDECLASSIFIED\nAuthority NND886527 OFFICIAL:\n\n/s/ R. M. Levy\nR. M. LEVY\nAdjutant General\n\n/s/ Ward H. Maris\nWARD H. MARIS\nColonel, AGD A Bt a C Cen os sta.5, C3 Copies to:\n(Return)\n\nCX 56612", "notes": [], "note": "기계 판독 참고 — OCR에서 일부 오독이 있었으나 문맥상 복원. 'WILLIAM EIGHT NINE TWO FIVE THREE' 등의 통신 약어는 원문 그대로 유지(참조 문서 식별자). 'art ya.' 등 일부 불명확한 부분은 그대로 둠.", "warn": false, "pages": ["0307", "0308"]}, {"id": "D050", "order": 49, "date": "1947-11-04", "group": "A", "eyebrow": "D050 · A. 조선경비대 무장·증강", "title": "남조선 경비대 무장 건", "badge": "TOP SECRET", "list_right": "0309–0312", "meta": [{"k": "발신", "v": "G-3", "txt": true}, {"k": "수신", "v": "c/s", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "memorandum"}, {"k": "면", "v": "0309–0312 (4면)"}, {"k": "건명", "v": "Arming of South Korean Constabulary", "txt": true}], "summary": "Arming of South Korean Constabulary", "points": ["육군부는 1947년 10월 29일 전문을 통해 남조선 경비대 무장에 원칙적으로 이의가 없으나, CINCFE에게 남조선군 창설 소요에 대한 의견을 요청하였다.", "G-3은 중박격포와 야포로 경비대를 무장시키는 것은 원래의 경찰 예비대 창설 취지를 넘어서며, 유엔 회원국들에게 남조선군 창설 시도로 간주될 수 있다고 판단하였다.", "경비대(경찰 경비대)는 1946년 1월 기준 약 25,000명 규모의 일반 경찰과는 별도의 국가 경찰 예비대로 계획되었으며, 현재는 약 17,000명이 일본제 소화기로 부분 무장되어 있다.", "G-3은 장비 지급의 법적 근거가 확인되었으나, 미군 장비 고갈 방지를 위한 수량 제한 정책 수립과 함께 무장 계획의 비공개 원칙을 지시서에 명시할 것을 권고하였다."], "primary": "[0309면]\n기밀해제\n권한 NND 886527\n일급비밀(TOP SECRET)\n-- 극동군사령부(GHQ/FEC)\n검토 기록지(CHECK SHEET)\n\n파일 번호: ... 3:03 제목: 남조선 경비대 무장 건.\n기록 번호. 보낸이: G-3 받는이: c/s 날짜: 1947년 11월 4일\n\n1. 남조선 경비대에 대한 미군 장비 지급에 관하여 CG, USAFIK(주한미군사령관) 앞으로, 육군부에 정보 사본 송부 예정인 전문 초안을 승인 및 G-3으로 반송하여 발송할 수 있도록 이에 첨부 송부합니다.\n\n첨부 1건:\n전문 초안 및\n관련 참조 문서\n\n[0310면]\n기밀해제\n권한 NND846527\n\n[판독불가 페이지 -- 대부분 판독 불가]\n\n[0311면]\n기밀해제\n권한 NND886527\n일급비밀(TOP SECRET)\n\n1947년 11월 4일\n\n기록용 메모(MEMO FOR RECORD):\n\n제목: 남조선 경비대 무장 건.\n\n1. 기본 문서: 10월 29일자 육군부 전문 W 89253. 이 전문은 남조선군 창설에 수반되는 소요에 대한 CINCFE(극동군사령관)의 의견을 요청하며, 육군부가 남조선 경비대 무장에 이의가 없음을 명시한다.\n\n2. 참조:\na. 육군부는 기본 문서(W89253, 앞의 1항 참조)를 통해 남조선 경비대 무장을 위해 취해진 조치에 대해 통보받기를 요청한다.\n나. 10월 22일자 전문 CX 56266은 육군부에 재전송된 것으로, 남조선군 창설 및 남조선 경비대 무장의 바람직함에 대한 CG, USAFIK(주한미군사령관)의 의견을 포함한다. CINCFE(극동군사령관)는 이 의견을 전달하면서, 유엔에 의한 조치가 있을 때까지는 어떤 결정도 내릴 수 없으며, 현시점에서 미국의 일방적 조치는 미국이 유엔에 제출한 제안과 불일치할 것이라고 밝혔다.\n다. 1946년 1월 24일자 CINCAFPAC 전문 CAX 57249는 한국 민간 경찰대(Korea Civil Police Force)의 조직과 기능을 개괄한다.\n라. 1946년 1월 11일자 JCS 전문 WX 92187은 CINCFE(극동군사령관)가 한국 국립 민간 경찰(Korean National Civil Police)을 미군 장비로 무장시키는 것을 승인했다.\n\n3. 논의:\n가. 남조선 경비대는 현재 약 17,000명의 장교와 사병으로 구성되어 있으며, 일본제 소화기(권총, 기총, 소총, 경기관총 포함)로 부분적으로 장비되어 있다.\n나. 참조 나의 3부에서 하지(Hodge) 장군은 남조선 경비대를 승인된 정원 25,000명으로 증강하고 81mm 박격포와 105mm 곡사포를 포함한 미군 무장으로 장비할 권한을 요청한다. 경비대를 단일한 부대로 만들기 위해서는 완전히 미군 무장으로 장비하는 것이 필요할 것이다.\n다. 참조 나를 육군부에 전달하면서 CINCFE(극동군사령관)는 경비대 무장에 관한 구체적인 논평을 하지 않았다. 그러나 육군부는 참조 가에서 \"하지 장군이 요청한 한국 경비대에 대한 미군 장비 지급 권한을 부여하는 것에 이의가 없다고 본다\"고 밝혔다. 이어 참조 가는 한국 국립 민간 경찰 무장 권한(참조 라)을 인용한다.\n\n[0312면]\n기밀해제\n권한 NND 886527\n일급비밀(TOP SECRET)\n\n라. 참조 다에 기술된 바와 같이, 한국 경비대는 한국 민간 경찰대(Korea Civil Police Force)의 일부이다. 참조 다가 작성될 당시(1946년 1월 24일) 경비대는 \"국립 경찰 경비대(National Police Guard)\"로 정의되었으며 일반 경찰과는 별도 조직이었다. 경비대(경찰 경비대)는 약 25,000명 규모로, 일반 경찰과 별도로 국가 경찰 기능을 수행하고, 광범위한 내부 소요 및 재난에 대처하도록 훈련되고 준비된 일반 경찰의 예비대를 구성할 의도였다. 경비대를 중박격포와 야포로 무장시키는 것은 내부 소요에 대처할 경찰 예비대 창설의 본래 취지를 넘어서는 것으로 보인다. 경비대의 무장이 공표 없이 이루어질 수는 있겠으나, 미군 장비 지급이 한국인이나 소련 측 어느 쪽에도 발각되지 않을 것 같지는 않다. 군 전투부대에는 통상적이나 경찰 조직에는 통상적이지 않은 무기(예: 박격포 및 야포)로 경비대를 무장시키는 것은 유엔 회원국들에 의해 남조선군을 창설하려는 행위로 해석될 수 있다.\n마. 한국 경비대에 미군 장비를 지급할 근거는 참조 라에 규정되어 있으며 추가적인 상세 설명은 필요 없다. 주한 미군 장비의 심각한 고갈을 피하기 위해서는, 경비대에 지급될 수 있는 그러한 장비의 수량에 관한 명확한 방침을 CG, USAFIK(주한미군사령관)에게 제시해야 한다.\n바. 경비대의 무장이 비밀리에 이루어질 수 있다고 보이지는 않지만, CG, USAFIK(주한미군사령관)에게 장비 지급을 승인하는 지시서에는 이 계획에 대해 어떤 공표도 하지 말 것을 명시해야 한다.\n\n4. 시사하는 조치:\n가. CG, USAFIK(주한미군사령관)이 이미 참조 가를 수령했지만, 앞의 3항에서 논의된 방침 사항을 개괄하는 구체적인 지시서를 CINCFE(극동군사령관)으로부터 그에게 송부해야 한다.\n나. CG, USAFIK(주한미군사령관)에 대한 지시서 사본을 참조 가 마지막 단락에 포함된 요청에 따라 육군부로 송부해야 한다.\n\n5. 건의: 첨부된 전문 초안(육군부 정보 사본 포함)을 c/s에게 송부하여 승인받고 G-3으로 반송하여 발송할 수 있도록 한다.\n\n6. 합의: 제안된 조치에 대한 G-4의 합의가 첨부된 전문 초안에 표시되어 있다.\n\n7. 완료: 기본 문서 1부에 대한 건의는 별도 통신문을 통해 육군부로 송부될 것이다. 이것으로 기본 문서(참조 가) 2부에 대한 G-3 조치가 완료된다.\n\nSMITH\n담당 장교\n\n일급비밀(TOP SECRET)", "secondary": "[0309면]\nDECLASSIFIED\nAuthority NND 886527\nTOP SECRET\n-- GENERAL HEADQUARTERS\nFAR EAST COMMAND\nCHECK SHEET\n\nFile No: ... 3:03 Subject: Arming of South Korean Constabulary. Note No. From: G-3 To: c/s Date: 4 Nov 1947\n\n1. Forwarded herewith for approval and return to G-3 for dispatch is a proposed radio to CG, USAFIK (with info copy to Department of the Army) concerning the issue of U. S. equipment to the South Korean Constabulary.\n\n1 Incl:\nDraft Rad and Associated Refs\n\n[0310면]\nDECLASSIFIED\nAuthority NND846527\n\n[illegible page -- mostly unreadable]\n\n[0311면]\nDECLASSIFIED\nAuthority NND886527\nTOP SECRET\n\n4 November 1947 MEMO FOR RECORD:\n\nSUBJECT: Arming of South Korean Constabulary.\n\n1. BASIC: Dept of the Army rad W 89253 of 29 Oct which requests CINCFE comments as to requirements involved in establishing a South Korean Army, and states Dept of Army has no objection to arming South Korean Constabulary.\n\n2. REFERENCES:\na. Army be advised Basic (W89253, see para 1, preceding) requests Dept of the of action taken toward arming South Korean Constabulary.\nb. CX 56266/22 Oct which repeated to the Dept of the Army CG USAFIK's comments concerning desirability of establishing a South Korean Army, and arming the South Korean Constabulary. In forwarding these comments, CINCFE stated that no decision can be made until action is reached by United Nations, and that unilateral action by the US at this time would be inconsistent with proposal submitted by US to the United Nations.\nc. CINCAFPAC rad CAX 57249/24 Jan 46 which outlined the organization and functions of the Korea Civil Police Force.\nd. JCS rad WX 92187/11 Jan 46 which authorized CINCFE to arm the Korean National Civil Police with US equipment.\n\n3. DISCUSSION:\na. The South Korean Constabulary now consists of approximately 17,000 officers and men, and is partially equipped with small arms (including pistols, carbines, rifles, and light machine guns) of Japanese manufacture.\nb. In part 3 of ref b General Hodge requests authority to bring South Korean Constabulary up to authorized strength of 25,000 and to equip the Constabulary with United States armament including 81 mm. mortars and 105 mm. Howitzers. In order to make the Constabulary a homogenous unit, it will be necessary to completely equip the force with United States armament.\nc. In passing ref b to the Dept of the Army CINCFE made no specific comments relative to the arming of the Constabulary. Dept of the Army, however, in ref a states that \"no objection is perceived to your granting General Hodge authority requested by him to issue United States equipment to the Korean Constabulary.\" Ref a then quotes authority (ref d) for arming Korean National Civil Police.\n\n[0312면]\nDECLASSIFIED\nAuthority NND 886527\nTOP SECRET\n\nd. As described in ref c the Korean Constabulary is a part of the Korean Civil Police Force. At the time ref c was prepared (24 Jan 46) the Constabulary was defined as the \"National Police Guard\" and in addition to the Regular Police. The Constabulary (Police Guard) was intended to have a strength of approximately 25,000 personnel, separate from the Regular Police, and to perform the functions of state police and to constitute a reserve for the Regular Police, trained and prepared to cope with widespread internal disorders and catastrophes. To equip the Constabulary with heavy mortars and artillery appears to be beyond the intent of establishing a police reserve to cope with internal disorders. Although the arming of the Constabulary may be accomplished without publicity, it is not probable that the issue of US equipment will go unnoticed by either Koreans or the USSR. Arming the Constabulary with weapons (such as mortars and artillery) which are common to army combat units, but which are not common to police organizations, could be interpreted by members of the United Nations as an act to establish a South Korean Army.\ne. The basis for issuing US equipment to the Korean Constabulary is established in ref d and requires no amplification. In order to avoid critical depletion of US military equipment in Korea, a definite policy should be indicated to CG, USAFIK as to the quantities of such equipment which may be issued to the Constabulary.\nf. Although it does not appear that arming the Constabulary can be accomplished secretly, the directive authorizing CG, USAFIK to issue equipment should state that no publicity will be given to this program.\n\n4. INDICATED ACTION:\na. Although CG, USAFIK has already received ref a, a specific directive should be forwarded to him from CINCFE outlining the matters of policy discussed in para 3 preceding.\nb. A copy of the directive to CG, USAFIK should be forwarded to Dept of the Army in accordance with request contained in last paragraph of ref a.\n\n5. RECOMMEND: Attached draft radio (with info copy to Dept of the Army) be forwarded to C/s for approval and return to G-3 for dispatch.\n\n6. CONCURRENCE: G-4 concurrence in proposed action is indicated on attached draft radio.\n\n7. COMPLETION: Recommendations on Part 1 of Basic will be forwarded to Dept of the Army by separate communication. This completes G-3 action on Part 2 of Basic (ref a).\n\nSMITH\nAction Officer\n\nTOP SECRET", "notes": [], "note": "기계 판독 참고 — Page 0310 was almost entirely illegible and could not be reconstructed. The header and footer elements suggest it was a blank or routing page, or its content was obscured beyond recognition. A few phrases on page 0311 were garbled and required reconstruction based on context (e.g., 'Harever' corrected to 'however').", "warn": false, "pages": ["0309", "0310", "0311", "0312"]}, {"id": "D051", "order": 50, "date": "1947-11-03", "group": "X", "eyebrow": "D051", "title": "W 89253(10월 29일, 남조선군 창설 관련)에 대한 회신 현황", "badge": "TOP SECRET", "list_right": "0313–0313", "meta": [{"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": "The Chief of Staff", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "memorandum"}, {"k": "면", "v": "0313–0313 (1면)"}, {"k": "건명", "v": null, "txt": true}], "summary": "Status of Reply to W 89253/29 Oct, re Establishment of South Korean Armed Forces", "points": ["육군성은 조선경비대에 대한 소화기(경기관총 포함) 보급은 승인했으나, 박격포와 포병 장비 지급은 정책 불부합 및 SANACC 반대 가능성으로 보류되었다.", "주한미군사령부(G-3 타이슨, G-4 쇼 대령)가 도쿄에서 CINCFE 측과 편성·장비 세부를 협의했으나, 호지 장군의 최종 승인 및 동원계획 추가 검토가 필요하다.", "남조선군에 대한 완전한 개요 계획과 소요 명세서 제출은 11월 12일경으로 예상되며, 이에 앞서 전략·정치적 측면의 논평이 별도로 준비 완료되었다.", "정책 수준의 최종 회신은 편성·훈련·군수 연구가 완료될 때까지 보류하기로 결정되었다."], "primary": "[0313면]\n비밀해제 •\n해제권한 NND 8X6527\n일급비밀(TOP SECRET)\n370.05 G-3 한국 BLF/it\n1947년 11월 3일\n\n회람용 전문: 참모총장 귀하.\n\n제목: W 89253(10월 29일, 남조선군 창설 관련)에 대한 회신 현황\n\n1. 참조:\n   W 89253/10월 29일(부록 A)\n   CX 56266/10월 22일(부록 B)\n   CX 58572/10월 17일(부록 C)\n\n2. W 89253(부록 A)의 제2부에서 육군성은 현행 승인된 조선경비대(Korean Constabulary)를\n미군 장비로 무장시키라는 호지(Hodge) 장군의 권한 요청에 이의가 없다고 밝히고 있다.\n이 사안에 대한 호지 장군 앞 제안 지시문(정보 사본: CSGPO)은 현재 시점의 보급 조치를\n경기관총을 포함한 소화기로 제한할 것이다. 호지 장군이 요청한(부록 B, 2쪽 3항)\n박격포 및 포병 장비 지급은 CX 56266(부록 B) 마지막 항에 명시된 정책과\n부합하지 않을 것이며, 육군의 사전 승인에도 불구하고 SANACC(국무·육군·해군\n조정위원회)의 지지를 받지 못할 가능성이 있다고 판단된다.\n조치안 제출은 G-4의 보급 제약에 대한 추가 조사를 기다리고 있다.\n제출 예정일은 11월 10일이다.\n\n3. W 89253(부록 A) 제1부에 대한 조치는 주한미군사령부(C/S, USAFIK)에\n호지 장군이 구상하는 남조선군의 완전한 편성 및 장비 세부사항을 도쿄로\n보내도록 요청함으로써 개시되었다. G-3 참모차장 타이슨(Tyssen)과\nG-4 참모차장 쇼(Shaw) 대령이 토요일에 도착했으나,\nG-4가 확정된 장비 소요를 산출하기 전에 상당한 세부 편성 작업과\n호지 장군의 최종 승인이 필요함을 확인하였다. 나아가 동원계획에 대해서도\n확정된 훈련 소요와 단계별 일정을 결정하기 전 주한미군사령부의\n추가 검토가 필요하다. CSGPO에 비교적 완전한 개요 계획과 소요 명세서를\n제출하는 데 최소 10일이 소요될 것으로 추산된다. 제출 예정일은 11월 12일이다.\n\n4. 한편, 전략적·정치적 측면만을 토대로 한 제안에 대한 논평이\n즉시 회신을 위한 기초로서 준비되었다. 이 부분의 연구는 완료되었으나, G-3의\n구두 지시에 대한 이해를 고려하여 제안된 정책 수준의 회신은 편성,\n훈련, 군수 요소에 대한 연구가 완료될 때까지 보류될 것이다.\n\nT. H. M. 확인함\n참모총장 대리\n\n일급비밀\nTS 30-7-", "secondary": "[0313면]\nDECLASSIFIED • Authority NND 8X6527\nTOP SECRET\n370.05 G-3 Korea BLF/it 3 November 1947\n\nMEMORANDUM FOR: The Chief of Staff.\n\nSUBJECT: Status of Reply to W 89253/29 Oct, re Establishment of South Korean Armed Forces.\n\n1. References:\nW 89253/29 Oct (Tab A)\nCX 56266/22 Oct (Tab B)\nCX 58572/17 Oct (Tab C)\n\n2. W 89253 (Tab A) states (Part II) that Dept of Army sees no objection to granting Gen. Hodge the authority requested by him to arm presently authorized Korean Constabulary with U.S. equipment. Proposed instructions to Gen. Hodge (info to CSGPO) on this matter will limit supply action at this time to light arms to include light machine guns. It is believed that issuance of mortars and artillery as requested by Gen. Hodge (3d para, page 2, Tab B) would not be in consonance with policy stated in last paragraph of CX 56266 (Tab B), and despite Army clearance might not be favored by SANACC. Submission of action awaits further G-4 investigation of supply limitations. Estimated date of submission is 10 Nov.\n\n3. Action on Part I of W 89253 (Tab A) was initiated by requesting C/S, USAFIK to send representatives to Tokyo with complete organizational and equipment details of Gen. Hodge's proposed South Korean Army. Tyssen, AC/S G-3, and Col. Shaw, AC/S G-4, arrived Saturday, but found that considerable detailed work on the organization and final approval by Gen. Hodge will be required before G-4 can develop firm equipment requirements. Furthermore, the mobilization plan requires further thought by USAFIK before firm training requirements and phasing can be determined. It is estimated that at least ten days will be required to submit to CSGPO a relatively complete outline plan and statement of requirements. Estimated date of submission is 12 Nov.\n\n4. Meanwhile, comments on the proposal based purely on strategic and political aspects have been prepared as the basis for an immediate reply. This portion of the study is completed, but in view of G-3 understanding of verbal instructions the proposed policy-level reply will be held until the study of the organizational, training, and logistical factors has been completed.\n\nT. H. M. NOTED\nBY C/S\n\nTOP SECRET\nTS 30-7-", "notes": [], "note": "기계 판독 참고 — 'BLF/it' after G-3 Korea is likely file initials, preserved as written.", "warn": false, "pages": ["0313"]}, {"id": "D052", "order": 51, "date": "1947-09-27", "group": "X", "eyebrow": "D052", "title": "극동군 총사령관, 한국 전략적 중요성 연구 초안 결론 전달 및 경비대를 미래 군핵으로 언급", "badge": "TOP SECRET", "list_right": "0314–0314", "meta": [{"k": "발신", "v": "CINCFE", "txt": true}, {"k": "수신", "v": "OSGPO (FOR BYROADE FROM DUPUY)", "txt": true}, {"k": "참조", "v": "CG USAFIK", "txt": true}, {"k": "전문번호", "v": "CX 55756"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0314–0314 (1면)"}, {"k": "건명", "v": null, "txt": true}], "summary": "CINCFE transmits draft Korea strategic importance study conclusions, notes constabulary as future army nucleus", "points": ["하지 장군은 9월 12일자 '한국의 전략적 중요성' 연구 초안의 모든 결론에 동의했다.", "하지 장군은 남한 무장 병력의 기초로 한국 경비대(Korean Constabulary)를 핵심으로 구상 중이다.", "공식적인 견해 요청이 접수되면, 남한 군대의 규모 및 조직에 관한 견해를 정식 경로로 제출할 예정이다.", "해당 연구 초안은 현재 극동군 사령부(FECOM) 참모진에게 참고용으로 배포되었다."], "primary": "[0314면]\n비밀해제\n권한 NND886527\n\n파일 최상급 비밀\n\n극동군 총사령부\n\nGC-P BLP/sib\n1947년 9월 27일\n\n발신: 극동군 총사령관(CINCFE) 270757\n수신: OSGPO (뒤퓌로부터 바이로드에게) • 긴급\n참조: 주한미군 사령관(CG USAFIK) • 통상\n\n011 cam\n괄호 엑스 55756 괄호 참조 주한미군 전문 제브라 피터 오보이 POL 1162 러브, 원원식스투와 제브라 엉클 로저 찰리 원원나인포 전문\n\n15\" 정보 제공 차원에서 귀관의 초기 계획 수립 및 국무부와의 논의를 위해 전달함 쉼표 하지 장군은 9월 12일자 한국의 전략적 중요성에 관한 연구 초안의 모든 결론을 검토하였고 이에 동의함 전문 그는 한국 경비대를 모든 남한 무장 병력의 핵심(core)으로 구상하고 있음 콤마 그리고 공식적인 견해 요청이 있을 경우 이들 무장 병력의 규모와 조직에 관한 자신의 견해를 정식 경로를 통해 제출할 준비가 되어 있을 것임 항연구분 초안은 정보 공유 차원에서 극동군 사령부 참모진에게 보여졌음\n\n공식:\n\n승인자:\n\nR. M. 레비,\n부관감\n\n워드 H. 머리스,\n대령, AGD, 참모차장보, G-3, 준장,\n\n배포처:\nG-3 (반납)\n\nJPO Tep-deeict\n\n3 CX 55756", "secondary": "[0314면]\nDECLASSIFIED\nAuthority NND886527 File Top A\n\nGENERAL HEADQUARTERS\nFAR EAST COMMAND\n\nGC-P BLP/sib 27 September 1947\n\nFROM : CINCFE 270757\nTO : OSGPO (FOR BYROADE FROM DUPUY) • URGENT\nINFO: CG USAFIK • ROUTINE 011 cam PAREN X 55756 PAREN REFERENCE USAFIK RADIOS ZEBRA PETER OBOE POL 1162 LOVE, ONE ONE SIX TWO AND ZEBRA UNCLE ROGER CHARLIE ONE ONE NINE FOUR PD 15\" FOR YOUR INFORMATION IN EARLY PLANNING AND DISCUSSIONS WITH STATE DEPARTMENT CMA GENERAL HODGE HAS SEEN AND CONCURRED IN ALL CONCLUSIONS OF DRAFT STUDY ON STRATEGIC IMPORTANCE OF KOREA DATED ONE TWO SEPTEMBER PD HE CONTEMPLATES KOREAN CONSTABULARY AS NUCLEUS OF ANY SOUTH KOREAN ARMED FORCES CNA AND WILL BE PREPARED TO SUBMIT THROUGH PROPER CHANNELS HIS VIEWS ON STRENGTH AND ORGANIZATION OF THESE ARMED FORCES IF HIS VIEWS SHOULD BE REQUESTED OFFICIALLY PARA STUDY HAS BEEN SHOWN TO FECOM STAFF FOR THEIR INFORMATION OFFICIAL:\n\nAPPROVED BY:\n\nR. M. LEVY, Adjutant General.\n\nWARD H. MARIS, Colonel, AGD, Asst. Chief of staff, G-3, Brigadier General, Copies to:\nG-3 (Return)\n\nJPO Tep-deeict 3 CX 55756", "notes": [], "note": "기계 판독 참고 — 원문 'PROPER CHANNELS'는 'PROPER CHANNELS'으로, 'IF HIS VIEWS 1b o'는 'IF HIS VIEWS SHOULD'로 교정. 하단의 'JPO Tep-deeict'는 판독이 불확실하나 원문 그대로 유지.", "warn": false, "pages": ["0314"]}, {"id": "D053", "order": 52, "date": "1947-07-06", "group": "X", "eyebrow": "D053", "title": "호지 장군의 한국 상황 불안정 평가에 대한 정보참모부(G-2)의 동의 및 관련 정세 보고", "badge": "TOP SECRET", "list_right": "0315–0323", "meta": [{"k": "발신", "v": "G-2", "txt": true}, {"k": "수신", "v": "Chief of Staff and Commander-in-Chief", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "memorandum"}, {"k": "면", "v": "0315–0323 (9면)"}, {"k": "건명", "v": null, "txt": true}], "summary": "G-2 concurrence with Gen Hodge's estimate of deteriorating situation in Korea", "points": ["1947년 7월 기준 주한미군사령부(G-2)는 호지 장군의 평가에 동의하며, 남한 내 공산주의 사주 소요가 북한의 직접 군사 행동보다 더 큰 위협이라고 판단했다.", "남한의 전복 활동 가능성은 이미 1947년 3월 31일자 G-2 보고서(Baker 61)에서 제시되었으며, 조기 실행이 제안되었다.", "1946년 1월 합동참모본부의 지시에 따라 한국 독립 문제 해결 전까지 38선 이남 국가 군대 창설이 연기되었으며, 관련 장교 심의회 결과는 보류 상태다.", "1947년 1월 주한미군사령부는 한국 경비대 창설 관련 초기 기록(1945년 말~1946년 초)을 보충하기 위해 극동군 총사령부에 관련 자료 사본을 요청했다.", "USAFIK는 한국 경찰예비대 창설 관련 초기 전문 사본을 요청했으며, G-3는 관련 문서 이력을 정리하고 기본 문서를 USAFIK에 반환할 것을 권고함.", "46년 1월부로 한국 국군 창설은 국제적 공약 및 한국 독립 문제의 해결 시까지 공식적으로 연기된 상태이며, 이에 관한 위원회 회의록은 보류 중임.", "첨부된 45년 11월 하지 장군의 전문은 사조직 군대의 확산을 막기 위해 미군 잉여 무기로 무장한 국가 경찰예비대의 즉각 창설을 주장함.", "하지 장군은 일본제 무기 사용을 성능, 수량, 지속적 군수지원 문제로 인해 부적절하다고 평가하고 미군 잉여 무기 사용을 강력히 권고함.", "맥아더 CINCAFPAC가 11월 3일자 USAFIK의 메시지(CAX 54290)에 동의함을 표명했다.", "USAFIK에 대해 해당 메시지에 기반한 계획을 준비하여 제출할 것을 지시했다.", "본 전문은 참모 조직(G-2, G-3, G-4)및 정부 관련 부서 등에 배포되었다."], "primary": "[0315면]\n기밀해제\n권한 NND 846527\n\n2급비밀\n\n1947년 7월 6일\n\n메모 수신: 참모총장 겸 총사령관\n\n제목: 주한미군사령부 무선 2000846호 (1947.7.2.); 호지 장군의 현 한국 상황 평가\n\n1. 호지 장군의 무선 전문(요약본 별첨 A)은 현 한국 상황에 대한 그의 평가를 제시하고 있음:\n\n본문 중 \"....한국 상황은 그 어느 때보다도 위태롭다...\" \"....공동위원회 재소집을 중심으로....공산주의자들이 통제하는 좌익 세력이 크게 강화되고 있다....\" \"....그러한 증가는 미국식 민주주의에 점점 더 적대적인 상황을 만들고 있다....\" \"....상황은 나날이 더욱 폭발적으로 변하고 있다....만약 공동위원회가 결렬된다면, 양측의 테러 행위는 동양식 내전의 양상에 접근할 것이며, 공산주의자들은 남한에서 대중 봉기를 조기에 실행하려 할 것이다....\"\n\n2. 주한미군사령부의 평가는 3월 31일자 G-2의 기존 평가(부록 2a Baker 61)와 일치함. 1947년 5월 20일자 JSPOG 검토 문서(별첨 B)에서 G-2는 전쟁계획참모부(SPOG) 기획관들에게 현재로서는 가능성이 낮은 명백한 전쟁 행위인 북한으로부터의 러시아 직접 개입을 지나치게 강조하지 말고, 공산주의자들이 사주한 반체제 인사들에 의한 남한 내부 소요가 더 큰 위협이며 발생 가능성이 더 높다는 점을 받아들이라고 조언했음.\n\n3. 남한 내 전복 운동의 일반적 가능성은 1947년 3월 31일자 부록 2a Baker 61에 이미 제시되었으며, 그 요약본이 첨부되어 있음. (별첨 C)\n\n4. 별첨 D 및 E로 첨부된 지도는 1946년 10월부터 1947년 5월까지의 전복 행위, 폭동 및 소요의 위치, 소요 및 반체제 집단 발생 지역, 그리고 상대적인 미군과 한국 경찰 병력을 보여줌.\n\n5. 본 검토 문서는 참모총장에게 호지 장군의 현 평가와 동일한 주제에 관한 1947년 3월 31일 및 1947년 5월 28일자 이전 평가들에 대한 G-2의 동의와 G-2의 기존 견해를 재확인시켜 줌.\n\n6. 가. Baker 61의 실질적 측면을 조기에 실행할 수 있도록 검토할 것을 제안함.\n   나. 비밀 자금 사용 제한에 항의하는 G-2 주한미군사령부의 서한에 주목할 것.\n\nC.A.W.\n\n첨부 5건:\n1 - 주한미군사령부 비밀 무선 200G846호 요약\n2 - G-3/JSPOG 검토 문서\n3 - 부록 Baker 61 (1947.3.31.) 요약\n4 - 지도: 전복 행위 발생 위치\n5 - 지도: 전복 집단 발생 지역\n별첨 A B C D E\n\n전쟁계획참모부(SPO)\n2급비밀 T/S 470/cy 3\n[0316면]\n기밀해제\n권한 NND 846527\n\n[비고: 0316면 OCR 판독 완전 불가. 0315면의 내용을 일부 중복하는 텍스트의 거울상 이미지이거나 심각하게 손상된 스캔본으로 보임. 복구 가능한 텍스트 없음.]\n[0317면]\n기밀해제\n권한 NND 846527\n\n2급비밀\n\n기본:\nAG 014.12 (1947.1.24.) GC 1차 지시\n\n극동군 총사령부(GHQ), APO 500\n\n수신: 주한미국육군사령관, APO 235\n\n1. 다음 문서를 참조함 -\n   가. 주한미군사령부 무선 TEGG 139호 (1945.11.3.)\n   나. GHQ/미육군태평양부대(AFPAC) 무선 CAX 54290호 (1945.11.4.)\n   다. GHQ/AFPAC 무선 CAX 55238호 (1945.11.25.)\n   라. 합동참모본부(JCS) 무선 WX 92167호 (1946.1.11.) 386.2 TS 7-1\n   마. GHQ/AFPAC 무선 CAX 56830호 (1946.1.11.) 386.2 TS 7-1\n   바. GHQ/AFPAC 무선 CAX 56889호 (1946.1.13.) 386.2 TS\n   사. 주한미군사령부 IFCT 1948호 (1946.1.19.)\n   아. GHQ/AFPAC 무선 CAX 57249호 (1946.1.24.) 386.2 TS 7-2\n   자. 제24군단 사령부 서한, 파일 AG 381 (IFGCG)\n       제목: \"1945년 11월 20일자 '북위 38도선 이남 한국 국방 수립에 관한 장교 심의회 승인 결과'\",\n       본 주제에 관한 장교 심의회 승인 결과를 전달함.\n\n2. 위에 열거된 참조 문서의 사본들은 한국 국립 경찰대 창설 및 장비에 관한 귀관의 기록을 완료하기 위해 송부됨.\n\n3. 참조 문서 라는 한국 독립 관련 문제가 해결될 때까지 북위 38도선 이남 한국의 국가 군대 창설 조치를 연기하도록 지시했으므로, 참조 문서 자에 언급된 장교 심의회 결과는 보류 상태에 놓여 있음.\n\n맥아더 장군의 명령에 따라:\n\n첨부 1건.\n기재된 대로.\n\nC.E.\n[0318면]\n기밀해제\n권한 NND 846527\n\n2급비밀\n\n주한미군사령부\n사령관실\nAPO 235\n\n1947년 1월 14일\n\n제목: 한국 경비대 창설 및 장비\n\n수신: 극동 총사령관\n      APO 500\n\n1. 한국 경비대 창설에 관련된 본 사령부의 기록은 매우 불완전하므로, 귀 사령부에 보관된 모든 자료를 요청함.\n\n2. 다음 정보를 제공함:\n\n   가. 본 사령부 기록에 따르면, 본 주제에 관하여 1945년 11월 3일 SCAP에 비밀 무선 TEGG 제139호가 발송되었음.\n\n   나. 본 사령부 기록에 따르면, 위 무선에 대한 회신인 1945년 11월 042003일자 비밀 무선 54290호가 수신되었으나 폐기되었음. 사본을 요청함.\n\n   다. 본 사령부 기록에 따르면, 1945년 11월 20일 북위 38도선 이남 한국 국방 수립에 관한 장교 심의회 승인 결과 1건과 첨부 1건이 쉬크 장군에 의해 GHQ/AFPAC으로 송부되었음. 본 사령부에는 장교 심의회 결과가 반환되었거나 사본이 파일로 보관되었다는 기록이 없음.\n\n   라. 본 사령부 기록에는 본 주제에 관한 SCAP의 2급비밀 또는 비밀 무선 WX 92187 (1946년 1월 110932Z 발신)에 대한 참조가 남아 있음. 사본을 요청함.\n\n사령관을 대신하여:\n\n찰스 에니스\n육군부관감실(AGD) 대령\n부관감\n\n2급비밀\n\n[0319면]\n(이 면은 스캔 인공물만 포함 — SEKISUI JUSHI 자, 잔류 눈금 표시, 판독 불가 OCR 조각. 문서 내용 없음)\n\n[0320면]\n기밀해제\n권한 NND 886527\n\n일급비밀\nJBX/3.t\n\n47년 1월 23일\n\n기록용 메모:\n\n1. 기본 조치 본 건은 한국 경찰예비대 창설과 관련된 정보에 대한 USAFIK(주한미군사령부)의 요청에 관한 것이다. USAFIK 서한 IFAG 381, 제목 \"한국 경찰예비대 창설 및 장비\", 47년 1월 14일자는 구체적으로 45년 11월 4일자 CAX 54290호 및 46년 1월 11일자 WX 92187호의 사본을 요청하고 있다. 또한 이 서한은 상기 주제에 관한 USAFIK의 기록이 매우 불완전하므로 기록물 일체를 요청한다고 밝히고 있다.\n\n2. 한국 경찰예비대 창설 및 장비와 관련된 참조문서의 개요는 다음과 같다:\n\na. TFGCG 193호, 45년 11월 3일, 한국 군대 창설에 관한 계획이 시작되어야 한다는 USAFIK의 견해를 SCAP(연합국최고사령관)에 통보함.\n\nb. CAX 54290호, 45년 11월 4일, TFGCG 193호에 동의하고 CG USAFIK(주한미군사령관)에게 그의 계획을 제출할 것을 요청함.\n\nc. 38도선 이남 한국의 국방을 위한 연구를 목적으로 임명된 장교위원회. 본 위원회 회의록, 문서철 AG 381 (TFGCG), 제목: \"38도선 이남 한국 국방 창설에 관한 장교위원회 승인 회의록\", 45년 11월 20일자. 본 사령부에 접수되었으며, 이 회의록에 포함된 USAFIK 계획을 개괄한 CAX 55328호 전문이 45년 11월 25일 육군성으로 송부되었다. 위원회 회의록은 육군성 답신 접수 시까지 추가 검토를 위해 참모장(C/S)에 의해 G-3로 반려되었다.\n\nd. 46년 1월 11일자 WX 92187호는 한국 국립 일반경찰의 무장을 승인하고 그 조직, 장비 및 기능에 관한 추가 정보를 요청했다. 이 전문은 또한 한국 국군 창설 문제가 한국 독립 이행을 위한 국제적 공약과 관련된 미해결 문제들과 밀접하게 연관되어 있으므로 연기될 것이라고 밝혔다.\n\ne. CAX 56830호는 WX 92187호 사본이 정보용으로 USAFIK에 전달되었음을 통보했다. 이 전문은 USAFIK가 경찰력 무장을 진행하도록 승인하고,\n\n[0321면]\n기밀해제\n권한 NND 886527\n\n일급비밀\n\nWX 92837호에 대한 회신의 기초로 삼기 위해 일반경찰의 조직 및 기능에 관한 정보를 요청했다.\n\nf. WX 92635호, 1월 12일, WX 92887호에 비추어 12월 23일자 USAFIK 사령부 야전명령 제1호 3d(8)항을 삭제할 것을 제안함. 이 하위 단락은 남한의 군정청이 자유롭고 독립된 국가로서 국제사회의 일원이 되기 위해 한국 군대를 창설하고 유지하도록 지시했었다. 1월 13일자 CAX 56889호는 WX 92635호를 CG USAFIK에게 인용하면서 적절한 조치를 취할 것을 요청했다. 1월 19일자 TFGCT 1948호는 야전명령 제1호 3d(8)항이 철회되었음을 통보하고 CAX 56830호가 요청한 정보를 전달했다. 이 정보는 46년 1월 24일 CAX 57249호에 의해 육군성으로 전달되었다.\n\n3. 38도선 이남 한국에서의 국가 군대의 지위를 변경시킬 만한 어떤 일도 발생하지 않았다. 46년 1월 11일자 WX 92187호에 명시된 바와 같이, 그러한 군대 창설 조치는 한국 독립과 관련된 문제들의 해결 시까지 연기될 것이다. 따라서 이 주제에 관한 위원회 회의록은 보류 파일에 남아 있어야 한다.\n\n4. 권고 조치 - 상기 전문들의 사본을 정보용으로 전달하는 제1차 배서를 통해 기본 문서들을 USAFIK에 반환할 것.\n\n5. 권고 사항 - 첨부된 배서의 승인
