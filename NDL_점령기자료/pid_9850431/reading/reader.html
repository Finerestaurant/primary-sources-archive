 "0026–0029 (4면)"}, {"k": "건명", "v": "Establishment of a South Korean Army", "txt": true}], "summary": "Request for authority to issue public statement on augmentation of South Korean Constabulary", "points": ["주한 미군 사령관은 남조선 국방경비대의 재편 및 증강에 대한 대국민 성명 발표 권한을 요청했다.", "소련의 선전과 남조선 내 여론으로 인해 경비대 모병이 방해받고 있는 상황이 보고되었다.", "극동군 총사령관은 '남조선' 대신 '한국'이라는 표현을 사용하고, 경비대의 규모 및 무장은 향후 한국 정부의 재량에 맡긴다는 내용의 두 개의 서론 항을 추가할 것을 권고했다.", "육군부는 군사 정책보다는 정치적 정책 차원에서 이 문제에 대한 지침을 제공해 줄 것이 요청되었다."], "primary": "[0026면]\n비밀해제\n해제권한 NND 886527\n\n2급 비밀 (TOP SECRET)\n\n극동군 총사령부\n\n발신 전보 GC-P BLP/ld\n\n1948년 4월 26일\n\n발신: 극동군 총사령관(CINCFE) 2611371\n수신: 육군부 최우선\n참조: 주한 미군 사령관(CG, USAFIK) 통상\n\n( CX60234 ) 전략기획참모부(OSaPO) 귀속. 제목: 남조선 국방경비대 증강 건,\n참조: 3월 18일자 WX 97866 및 4월 20일자 ZGBI 502 (후자는 육군부나 타부처 불필요).\n\n제1부. 현재 진행 중인 모병으로 인해 경비대의 일부 증강 및 재편성이 이루어지고\n있다는 사실이 대중에게 알려지는 것을 막는 것은 비현실적임. 주한 미군 사령관이\n다음과 같은 대국민 성명을 발표할 권한을 요청함:\n\"1. 남조선 과도정부의 권력 인수 이전:\n가. 미군 장교들은 경비대 창설 이래 그래 왔듯이 계속해서 경비대 훈련에 대한\n조언과 지원을 제공할 것이다.\n나. 경비대의 규모는 기밀 정보이다.\n다. 경비대는 미국 내 여러 주(州) 경찰대의 임무와 대체로 유사한 임무를\n계속 수행할 것이다.\n라. 일본군 장비가 열악하고, 점령 당국이 예비 법집행 기관으로서의 기능을\n수행할 적절한 수단을 경비대에 제공하지 않는다면 직무 태만이 될 것이므로,\n미국산 무기와 장비가 경비대에 지급될 것이다.\n마. 경비대는 군대에 적합한 무기로 조직 및 장비되지 않을 것이며, 순수하게\n법집행 기관으로서만 편성될 것이다.\"\n전문 종료.\n\n[0027면]\n비밀해제\n해제권한 NND 886527\n\n극동군 총사령관이 육군부에 보낸 전문, 1948년 4월\n\n바. 점령 당국에 의해 추가적인 '보안 부대' 창설이 고려되고 있지 않다.\n\"2. 남조선 과도정부의 권력 인수 이후, 경비대 규모는 새로운 정부에 의해\n결정될 것으로 예상된다. 현 시점에서 그 규모에 대해 합리적인 추측을 제시할\n수는 없다.\"\n\n제2부. 주한 미군 사령관은 소련이 군대가 편성되고 있다고 주장할 가능성을\n거론하며, 남조선 군대가 곧 창설될 것이라는 현지 여론으로 인해 경비대 모집이\n저해되고 있다고 보고함.\n\n제3부. 주한 미군 사령관이 권고한 방향의 대국민 발표가 바람직하다는 데 동의하나,\n극동군 총사령관은 제2항 삭제, 제1항 첫 문장의 \"남\"(South) 단어 삭제,\n그리고 다음과 같은 서론 두 개 항의 삽입을 권고함 (현재의 제1항은 제3항이 됨):\n\"1. 유엔 후원 하에 예정된 선거의 결과로 책임 있는 한국 정부가 수립될 것을\n예상하며, 한국 주권 획득의 첫걸음은 그러한 정부가 국내 법과 질서 유지에\n대한 전적인 책임을 인수하는 것이라는 확고한 신념으로,\n주한 미군정은 미국 정부의 승인을 받아 현재의 남조선 국방경비대를 재편성 및\n증강하는 데 착수하였으며, 이는 장래의 책임 있는 한국 정부의 직접 통제 하에\n예비 법집행 기관이라는 본연의 역할을 수행할 수 있도록 준비시키기 위함이다.\n\"2. 증강된 경비대의 총 병력 및 무장의 공개는 선거 후 수립될 한국 정부의\n재량에 맡겨야 할 사안으로 간주된다.\"\n\n[0028면]\n비밀해제\n해제권한 NND 886527\n\n2급 비밀 (TOP SECRET)\n\n극동군 총사령관이 육군부에 보낸 전문, 1948년 4월\n\n제4부. 육군부가 군사 정책보다는 정치적 정책의 문제로서 주한 미군 사령관에게\n필요한 지침을 제공해 줄 것을 요청함.\n\n공식 발신:\n서명 /P. M. 레비/\nP. M. 레비\n대령, 부관감실\n부관감\n\n승인자:\n서명 /워드 H. 마리스/\n워드 H. 마리스\n준장, 참모단\n참모차장, G-3\n\n배포처:\n참모장 겸 총사령관\nG-3 (반송)\n\n참모장 승인 4/26/48\n\n이 전문의 동일 비밀 등급 수정 발송분의 전송은 전시육군성훈령(AR) 380-5의\n9g 60-1010 53-B (1) (2) (3) (4)호 단락 조항에 따라 육군부에 의해 승인되었음.\n\n[0029면]\n비밀해제\n해제권한 NND 886527\n\nCX 60234 1948년 4월 26일\nC/N G-3 참모장 1948년 4월 28일\n회람용 메모\n\n제목: 남조선 국방경비대 증강 건.\n남조선 국방경비대 증강에 관한 대국민 발표 건.", "secondary": "[0026면]\nDECLASSIFIED\nAuthority NND 886527\n\nTOP SECRET\n\nGENERAL HEADQUARTERS\nFAR EAST COMMAND\n\nOUTGOING MESSAGE GC-P BLP/ld 26 April 1948\n\nFROM: CINCFE 2611371\nTO: DEPT OF ARMY PRIORITY\nINFO: CG, USAFIK ROUTINE ( CX60234 ) For OSaPO. Subject is Augmentation of South Korean Constabulary, reference WX 97866 of 18 Mar and ZGBI 502 of 20 Apr (latter not to DA or needed).\n\nPart I. Recruiting now under way makes it impracticable to prevent public knowledge that some augmentation and reorganization of constabulary is being effected. CG, USAFIK has requested authority to issue public statement as follows: \"1. Prior to the assumption of power by a South Korean Govt:\na. American officers will continue to advise and assist in the training of the Constabulary as they have been doing since its inception.\nb. The size of the Constabulary is classified information.\nc. The Constabulary will continue to have duties that are in general the same as the duties of various state constabularies in US.\nd. US arms and equipment will be furnished the Constabulary because the Japanese equipment is poor and the occupation authorities would be derelict in their duties if they did not provide the Constabulary with proper means of carrying out its functions as a reserve law enforcement agency.\ne. The Constabulary will not be organized and equipped with weapons that are appropriate to an army but purely as a law enforcement body.\"\nSTOP\n\n[0027면]\nDECLASSIFIED\nAuthority NND 886527 Radio from CINCFE to Dept of Army, April 1948\n\nf. There is no additional 'security force' being contemplated by occupation authorities.\n\"2. Subsequent to the assumption of power by a South Korean Govt, it is anticipated that the size of the Constabulary will be determined by the new government. No reasonable conjecture can be advanced at this time concerning that size.\"\n\nPart II. CG, USAFIK cites possibility that Soviets will claim that Army is being formed and states that recruiting for constabulary is being hampered by local feeling that South Korean army is in the offing.\n\nPart III. Concur in desirability of public announcement along lines recommended by CG, USAFIK, except that CINCFE recommends elimination of par 2, deletion of word \"South\" in first sentence of par 1, and insertion of two introductory pars as follows (present par 1 becomes par 3): \"1. In anticipation of the establishment of a responsible Korean Government as a result of scheduled elections under United Nations sponsorship, and with the firm conviction that the first step in attainment of Korean sovereignty is the assumption by such a government of full responsibility for maintenance of internal law and order, the United States Military Government in Korea, with the approval of the United States Government, is currently engaged in reorganizing and augmenting the present South Korean Constabulary with a view to readying it for its proper role as a reserve law enforcement agency under the direct control of a future responsible Korean government. \"2. Public disclosure of the total strength and armament of the\n\n[0028면]\nDECLASSIFIED\nAuthority NND 886527\n\nTOP SECRET\n\nRadio from CINCFE to Dept of Army, April 1948 augmented Constabulary is considered to be a matter which should be left to the discretion of the Korean Government to be established after the elections.\"\n\nPart IV. Request that DA furnish CG, USAFIK necessary guidance as a matter of political rather than military policy.\n\nOFFICIAL:\n/s/ P. M. LEVY\nP. M. LEVY\nColonel, AGD Adjutant General APPROVED BY:\n/s/ WARD H. MARIS\nWARD H. MARIS\nBrigadier General, G.S.C.\nAssistant Chief of Staff, G-3 Copies to:\nC/S C-in-C G-3 (return)\n\nApproved by C/S 4/26/48 Transmission of this message as corrected transmission of the same classification has been authorized by the War Department in accordance with the provisions of par 9g 60-1010 53-B (1) (2) (3) (4), AR 380-5.\n\n[0029면]\nDECLASSIFIED\nAuthority NND 886527 CX 60234 26 April 1948 C/N G-3 C/S 28 April 1948\nM/R\n\nSubject is augmentation of South Korean Constabulary. Public Announcement augmentation of South Korea Constabulary.", "notes": [], "note": "기계 판독 참고 — 메시지 하단의 전송 근거 조항은 OCR이 불완전하여 'par 9g 60-1010' 부분을 원문 그대로 유지했습니다. 실제 문서에서는 중계인(relay), 기호 부호, 통신보안 표시 등이 생략되었을 수 있습니다. 면 0029의 꼬리표는 원본의 회람용 표지나 간략 초록 페이지로 보입니다.", "warn": false, "pages": ["0026", "0027", "0028", "0029"]}, {"id": "D010", "order": 9, "date": "1948-04-20", "group": "A", "eyebrow": "D010 · A. 조선경비대 무장·증강", "title": "남조선 국방경비대 관련 보도자료 배포 권한 요청", "badge": "TOP SECRET", "list_right": "0030–0031", "meta": [{"k": "발신", "v": "CG USAFIK", "txt": true}, {"k": "수신", "v": "CINCFE (ATTN G-2)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "ZGBI 502"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0030–0031 (2면)"}, {"k": "건명", "v": "T/O&E's for Security Forces in South Korea", "txt": true}], "summary": "Request for authority to issue a press statement about the South Korean Constabulary", "points": ["미군정사령관은 국방경비대가 순수한 법 집행 기관이며 군대가 아니라는 점을 강조하는 보도자료를 비밀이 아닌 문건으로 배포할 권한을 요청했다.", "이 보도자료는 한국 과도정부 수립 전까지 미군이 국방경비대 훈련을 계속 지원하고, 미군 장비를 제공한다는 내용을 담고 있다.", "미측은 소련이 이를 '군대 건설'로 규정하고 항의할 가능성과, 한국 정치인들이 장래에 군대를 만들 것이라는 발언으로 인해 징병 저항이 발생한 현실을 인지하고 있었다.", "보도자료의 목적은 추가 장교 배치와 미군 장비 지급 사실이 이미 알려지고 있는 상황을 투명하게 관리하기 위한 것으로 분석된다."], "primary": "[0030면]\n해제됨\n권한 NND8X6527\nGE - 극동사령부\n부관실\n무선전신 센터 FSS\nld\n수신 전문\n2급 비밀\n2급 비밀 1948년 4월 20일\n발신: 미군정사령관\n수신: 극동군총사령관 (참조: 정보참모)\n00\n전문번호: ZGBI 502\nCRABAPPLE 참조. 다음 성명을 비밀이 아닌 것으로 배포할 권한을 요청함:\n1. 남조선 과도정부가 권력을 인수하기 전까지:\na. 미군 장교들은 창설 이래 해온 대로 계속해서 국방경비대 훈련에 조언과 지원을 제공할 것이다.\nb. 국방경비대의 규모는 기밀 정보이다.\nc. 국방경비대는 미국의 여러 주 방위대의 임무와 대체로 유사한 임무를 계속 수행할 것이다.\nd. 일본군 장비가 열악하여 점령 당국이 예비 법 집행 기관으로서의 기능을 수행하기 위한 적절한 수단을 국방경비대에 제공하지 않는다면 직무 태만이 될 것이므로, 미군 무기와 장비가 국방경비대에 지급될 것이다.\ne. 국방경비대는 군대에 적합한 무기가 아닌 순수 법 집행 기관으로서의 무기로 편성 및 장비될 것이다.\nf. 점령 당국이 고려 중인 추가적인 \"보안 병력\"은 없다.\n2. 남조선 과도정부의 권력 인수 이후에는 국방경비대의 규모가 새 정부에 의해 결정될 것으로 예상된다. 이 규모와 관련하여 현 시점에서 합리적인 추측을 제시할 수 없다.\n위와 같은 이유:\n(1) 추가 장교들이 국방경비대에 배치되었고, 미군 장비가 지급되고 있다는 사실이 널리 알려지게 될 것이 확실시되기 때문이다.\n[0031면]\n미군정사령관 전문 번호 ZGBI 502, 일자 1948년 4월 20일, 계속:\n(2) 소련이 우리가 군대를 건설하고 있다고 항의할 가능성이 높으며, 정치인들이 장차 군대를 결성할 것이라고 말하고 다니기 때문에 징병에 일부 저항이 이미 있었기 때문이다.\n서명 없음\n조치 부서: 작전참모\n정보 배포: 총사령관, 참모장, 정보참모, 군수참모, 합동참모부 기획운영국\n30469 우선 전송, 발송 시간: 월요일: 74764 200145Z\n2급 비밀 전문\n\"육군규정 380-5, 51항 b (4)에 의거 의역 불필요. 육군규정 380-40, 16항 e에 의거.\n이 전문의 축자적 평문을 동일 비밀 등급의 문서로 취급 및 전송하는 것은 1946년 3월 6일자 육군규정 380-5의 16-C, 18-E, 53-A, 53-D (1) (2) (3), 60-A (1) (2) (3) (4)항의 규정에 따라 육군부가 권한을 부여하였음.\"", "secondary": "[0030면]\nDECLASSIFIED\nAuthority NND8X6527 GE - HEADQUARTERS, FAR EAST COM\nADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER FSS\nld\nINCOMING MESSAGE\nTOP SECRET\nTop Secret 20 Apr 48\nFROM : CG USAFIK\nTO : CINCFE (ATTN G-2)\n00\nNR : ZGBI 502 Reference CRABAPPLE, request authority to issue the following statement as unclassified:\n1. Prior to the assumption of power by a South Korean Govt:\na. American officers will continue to advise and assist in the training of the Constabulary as they have been doing since its inception.\nb. The size of the Constabulary is classified information.\nc. The Constabulary will continue to have duties that are in general the same as the duties of various state constabularies in US.\nd. US arms and equipment will be furnished the Constabulary because the Japanese equipment is poor and the occupation authorities would be derelict in their duties if they did not provide the Constabulary with proper means of carrying out its functions as a reserve law enforcement agency.\ne. The Constabulary will not be organized and equipped with weapons that are appropriate to an army but purely as a law enforcement body.\nf. There is no additional \"security force\" being contemplated by occupation authorities.\n2. Subsequent to the assumption of power by a South Korean Govt, it is anticipated that the size of the Constabulary will be determined by the new government. No reasonable conjecture can be advanced at this time concerning that size. Reasons for the above are:\n(1) The fact that additional officers have been put on duty with the Constabulary and that US equipment is being issued is certain to become widely known;\n[0031면]\nCG USAFIK MSG NBR ZGBI 502 DTD 20 APR 48 CONTINUED:\n(2) The Soviets are likely to protest that we are building an army; Some resistance to recruiting has already been met because politicians speak of forming an army in the future.\nNO SIG\nACTION: G-3\nINFO: COMMANDER IN CHIEF, CHIEF OF STAFF, G-2, G-4,\nJS P&O\n30469 PRIORITY TOO: MON: 74764 200145Z TOP SECRET correspondence \"Paraphrase not required per para 51b(4) AR 380-5. per para 16e AR 380-40 Handling and transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department acting in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1)\n(2) (3), and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946.\"", "notes": [], "note": "기계 판독 참고 — Page 0030, line 13-14: 'information' cut after 'infor-'; reconstruction matches standard message format. Line 23-27 boilerplate text partially garbled in OCR, reconstructed based on standard AR 380-5 security classification markings. Original has 'Top lant' and 'Top beent' which were corrected to 'Top Secret'.", "warn": false, "pages": ["0030", "0031"]}, {"id": "D011", "order": 10, "date": "1948-04-20", "group": "D", "eyebrow": "D011 · D. 장래 정책·철군", "title": "CINCFE, 남조선 경비대 증강 및 장비 지급 구두 지시 확인", "badge": "TOP SECRET", "list_right": "0032–0032", "meta": [{"k": "발신", "v": "CINCFE", "txt": true}, {"k": "수신", "v": "DEPT OF ARMY; CG USAFIK", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "CX 60054"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0032–0032 (1면)"}, {"k": "건명", "v": "Withdrawal from Korea", "txt": true}], "summary": "CINCFE confirms augmentation and equipping of South Korean Constabulary, confirms oral directive", "points": ["CINCFE는 JCS 1483/51에 대한 서면 시행 지시를 발하지 않았으며, USAFIK가 직접 모집을 개시하였음을 CSGPO에 통보했다.", "증강된 경비대에 대한 초기 장비 지급은 1948년 11월 15일 철수 계획을 초과하는 한국 내 잉여 물자로 제한된다.", "제24군단이 실제 병력 유지 이상으로 보유한 장비는 한국 철수 개시 지시 후 지급 가능한 물량으로 간주된다."], "primary": "[0032면]\n비밀해제\n해제권한 NND 886527\n\n극동사령부\n\n발신전문\n\n1948년 4월 20일\n\n발신: CINCFE\n수신: 육군부 • 통상\n 주한미군사령관(CG USAFIK) • 통상\n\nBLP/sib\n\n제목: 남조선 경비대 증강 및 장비 지급 건, 3월 18일자 WX 97866 참조. 본 전문은 두 부분으로 구성됨.\n\n제1부. CSGPO 귀속. JCS 1483/51 전달 메모와 관련하여, CINCFE가 발행한 서면 시행 지시는 없음. 모집 조치는 주한미군사령관이 WX 97866 수신 즉시 개시하였으며, 장비 지급에 관한 지침은 도쿄 회의 시 주한미군사령부 참모진에게 전달되었고 제2부로 확정함.\n\n제2부. 주한미군사령관 귀속. 3월 31일 주한미군사령부 참모장에게 전달된 구두 지시를 본 전문으로 확정함. 초기에는 증강된 경비대에 대한 보급품 및 장비를 각서 수령증을 통해 지급하되, 제24군단(XXIV Corps) 승인 병력 기준상 1948년 11월 15일 철수 배치 수준(T/O&E 및 15 Nov 48 disposition level)을 초과하여 한국 내에서 가용한 물량으로 제한함. 현재 제24군단 장병이 보유 중인 보급품 및 장비 중 실제 병력 유지에 필요한 물량 또는 30,000명분 중 더 큰 수치를 초과하는 물량은 기획 목적상, 한국으로부터 제24군단의 철수 개시 지시가 접수되는 대로 지급 가능한 물량으로 간주함.\n\n공식: 승인:\nR. M. 레비 준장 WARD H. MARIS\n부관 준장, 육군 참모부\n G-3 부참모장\n\n참모장 승인 1948년 4월 20일\n\n배포처:\n97-72- 반송본\n75- (3) (4), 일급비밀\n\nCX 60054", "secondary": "[0032면]\nDECLASSIFIED\nAuthority NND 886527\n\nGENERAL HEADQUARTERS FAR EAST COMMAND\n\nOUTGOING MESSAGE\n\n20 April 1948\n\nFROM : CINCFE\nTO : DEPT OF ARMY • ROUTINE CG USAFIK • ROUTINE BLP/sib Subject is augmentation and equipping of South Korean Constabulary, reference WX 97866 dtd 18 March. This radio in two parts.\n\nPart I. For CSGPO. Reference your memo of transmittal of JCS 1483/51, no written implementing directive has been issued by CINCFE. Recruiting action was initiated by CG, USAFIK upon receipt of WX 97866; instructions on issuance of equipment were delivered to USAFIK Staff during Tokyo conference, and are confirmed by Part II.\n\nPart II. For CG, USAFIK. This confirms oral directive delivered to Chief of Staff, USAFIK 31 March. Initially, issue on memorandum receipt of supplies and equipment to augmented Constabulary will be limited to that available in Korea in excess of T/O&E and 15 Nov 48 disposition level for XXIV Corps authorized troop basis. Supplies and equipment now in the hands of XXIV Corps troops in excess of that required for actual troop strength or 30,000, whichever is the greater, will for planning purposes be considered available for issue upon receipt directive to begin withdrawal of XXIV Corps from Korea.\n\nOFFICIAL: APPROVED:\nR. M. LEVY WARD H. MARIS\nAdjutant Brigadier General, General Staff Corps Assistant Chief of Staff, G-3\n\nAPPROVED BY C/S 4/20/48\n\nCopies to:\n97-72- RETURN COPY 75- (3) (4), Top Secret\n\nCX 60054", "notes": [], "note": null, "warn": false, "pages": ["0032"]}, {"id": "D012", "order": 11, "date": "1948-04-16", "group": "X", "eyebrow": "D012", "title": "남조선 경비대 증강 및 장비 지원에 관한 JCS 1483/51 요약", "badge": "TOP SECRET", "list_right": "0033–0035", "meta": [{"k": "발신", "v": "G-3 Section, GHQ/FEC", "txt": true}, {"k": "수신", "v": "Chief of Staff", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "memorandum"}, {"k": "면", "v": "0033–0035 (3면)"}, {"k": "건명", "v": null, "txt": true}], "summary": "Brief of JCS 1483/51 on augmentation and equipping of South Korean Constabulary", "points": ["JCS 1483/51은 남조선 경비대를 50,000명으로 증강하고 미군 장비 지원을 승인하는 근거이다.", "증강 조치에는 105일이 소요될 전망이며, 다가오는 선거와 미군의 부담 증가를 고려하여 즉시 개시해야 한다.", "장비 지급 정책에 관한 구두 지시만 있었을 뿐, CINCFE의 공식적인 서면 지시는 발령되지 않았다.", "육군부의 지시에 따라 서면 지시 대신 무전으로 구두 지시를 확인해 주는 것이 제안되었다."], "primary": "[0033면]\n해제\n권한 NND 86527\n일급비밀\n\n제목: JCS 1483/51\n\n제1차 회람\n발신: SGS 수신: G-3 일자: 1948년 4월 12일\n1. JCS 1483/51에 관한 조치는 귀 부서의 주의를 위해 배당됨.\n2. 참모총장 제출을 위해 본 문서의 요약을 작성할 것이 요청됨. 요약에는 문서 내용의 간결한 요약, 관련된 추가 배경 정보, 그리고 CINCFE가 기취했거나 취해야 할 조치에 관한 설명이 포함되어야 함. 요약은 한 페이지로 제한하는 것이 바람직함.\n\n별첨: JCS 1483/51 사본 제37호\n\nF. J. S.\n\n제2차 회람\n발신: G-3 수신: 참모총장 일자: 1948년 4월 14일\n\nJCS 1483/51에 대한 요약서 및 참모총장실(SGS)의 전달 메모 제2항에 따르기 위한, CG USAFIK 앞(D/A 정보 참조)으로 발신할 무전 초안을 별첨함.\n\n별첨 3부:\n#1 - JCS 1483/51 요약\n#2 - 참모총장 승인용 무전 초안\n#3 - JCS 1483/51 사본 제37호 (메모 포함)\n\nH. W. M.\n\n[0034면]\n해제\n권한 NND86527\n일급비밀\n\n극동군 총사령부\nG-3 부서\n1948년 4월 16일\n\n수신: 참모총장.\n\n제목: \"남조선 경비대 증강 및 장비 지원\"에 관한 JCS 1483/51 요약\n\n1. JCS 1483/51은 남조선 경비대를 50,000명으로 즉시 증강하도록 승인한 WX 97866 (CINCFE 3월 19일 수신)의 근거임.\n\n2. 합동참모본부가 3월 18일 결정으로 승인한 결론에는 \"남조선 보안군을 미군 장비로 지원할 SANACC의 승인이 존재한다\" 및 \"가능한 가장 빠른 시일 내에 경비대 증강을 개시하는 것이 바람직하다\"는 진술이 포함됨.\n\n3. 논의 부분은 \"계획 목적상 50,000명으로의 증원을 현 경비대의 가능한 최대 증원으로 간주할 것\"을 권고한 CX 58437/2월 6일부 전문을 언급하면서도, 인용되지 않은 CX 57862/1월 9일부 전문에 포함된 데이터의 상당량을 이 전문에 잘못 귀속시키고 있음. 증강에 105일이 소요될 것이라는 점, 다가오는 선거와 그에 따른 미국의 후속 조치를 고려할 때 증강을 지금 즉시 개시해야 한다는 점, 그리고 이번 증원은 USAFIK의 보충 수요를 어떤 식으로도 충족하지 못할 것이며 오히려 CG USAFIK에게 증가된 부담을 지울 것이라는 점이 지적됨.\n\n4. 극동군사령부 PRO국(PRO Div)의 참모총장 앞 전달 메모에는 JCS 1483/5 (원문대로) 시행을 위해 발령된 지시문의 정보 사본을 D/A에 제공할 것을 요청함. (WX 97866으로 수신된 CINCFE 앞 지시문). CINCFE는 WX 97866에 대해 공식 조치를 취하지 않았음. 정보 사본을 수신한 CG USAFIK는 CINCFE에게 달리 지시가 없는 한 자신의 계획에 따라 진행할 것이라고 통보하였음. 그 후, USAFIK 참모총장이 USAFIK의 G-3 및 G-4와 동행하여 GHQ를 방문하였고, 당시 유일한 쟁점이었던 장비 지급 정책에 대해 구두로 통보받았음. 그 결과, CINCFE에 의해 서면 지시는 발령되지 않았음.\n\n5. D/A의 지시에 부응하기 위해, CG USAFIK 앞(D/A 정보 참조)으로 무전을 발송하여 구두 지시 사항을 확인해 주는 것이 타당하다고 사료됨.\n\n별첨 (SGS에서 G-3 계획과(Plans Div)로 반납):\n#1 - WX 97866\n#2 - CX 58437\n#3 - CX 57862\n\nW. H. M.\n대령, GSC\n참모차장, G-3\n\n[0035면]\n해제\n권한 NND 86527\n\nG-3 회람표, 극동군 총사령부, 1948년 4월 16일\n\n참모차장, G-3\nW H MARIS, 대령\n\n참모차장 대리, G-3\nCol R D Palmer Col P D Ginder\n\n작전과\nCol E C Burkart - Lt Col T R Hannah\nLt Col C B Hammerle Jr\nCol * Stanton\nMaj W B Todd\nMaj J H Leonard\n\n행정과\nLt Col E O'Donohue - Lt Col K J Woodbury\nCapt H G Minch\nLt H Ammerman\n\n훈련과\nCol A M Parsons -\nLt Col H G Fisher\nLt Col J Bealke Jr\nMaj J M Hall\n\n병력 통제\nLt Col Paige\nCol R J Butchers - Lt Col L W Smith\nLt Col J M Churchill\nLt Col V E Day\nMaj R A Edwards\n\n기획과\nCol A D Jennings\nLt Col L H Ham\nLt Col J T Schwenk\nLt Col K L Haycraft\nMaj Sam J Bradley\n\n편제 및 장비\nLt Col J M Pittman\nMaj R C McDonald\nMaj C I Lucas\n\n주임 서기\n\n송환과\nLt Col B J Young\nMaj M I Anderson\n\n용도:\n( ) 승인\n( ) 의견\n( ) 동의\n( ) 필요조치\n( ) 서명\n( ) 정보\n( ) 반송경유\n( ) 발송 회부\n( ) 행정\n( ) 귀 보관\n( ) 수정대로\n( ) 편철\n( ) 행정\n( ) 관계자", "secondary": "[0033면]\nDECLASSIFIED\nAuthority NND 86527\nTOP SECRET\n\nSubject: JCS 1483/51 1st Ind From: SGS To: G-3 Date: 12 April 1948\n1. The action on JCS 1483/51 is assigned to your section for attention.\n2. It is requested a brief of this paper be prepared for presentation to the CofS. The brief should present a concise summary of the substance of the paper, such additional background information as is pertinent, and a statement of action, if any, taken or required to be taken by CINCFE. It is desirable to limit the length of the brief to a single page.\n\nIncl. Cy 37, JCS 1483/51\n\nF. J. S.\n\n2nd Ind From: G-3 To: C/S Date: 14 April 1948 Attached hereto are briefs of JCS 1483/51 and proposed radio to CG USAFIK, info D/A, to comply with par 2 of SGS memo of transmittal.\n\n3 Incls:\n#1 - Brief of JCS 1483/51 #2 - Proposed rad for C/S approval #3 - Copy 37, JCS 1483/51, w/memo\n\nH. W. M.\n\n[0034면]\nDECLASSIFIED\nAuthority NND86527\nTOP SECRET\n\nGENERAL HEADQUARTERS\nFAR EAST COMMAND\nG-3 Section 16 April 1948\n\nMEMORANDUM FOR: Chief of Staff.\n\nSUBJECT: Brief of JCS 1483/51, \"Augmentation and Equipping of South Korean Constabulary.\"\n\n1. JCS 1483/51 is the basis for WX 97866 (received by CINCFE 19 Mar), which authorized immediate action to augment South Korean constabulary to 50,000.\n\n2. Conclusions (accepted by JCS decision on 18 Mar) include statements \"that SANACC authorization exists for equipping South Korean Security Forces with U.S. equipment\" and \"that it is desirable to initiate augmentation of the Constabulary at earliest possible date.\"\n\n3. Discussion refers to CX 58437/6 Feb, which recommended \"that for planning purposes increase to 50,000 be considered maximum feasible augmentation of present Constabulary,\" but incorrectly attributes to this radio much of the data contained in CX 57862/9 Jan, which was not cited. It is pointed out that augmentation will require 105 days; that in view of approaching election and possible subsequent action by the U.S., the augmentation should be initiated at once and that the augmentation will not in any way satisfy USAFIK's requirements for replacements but rather will place on CG, USAFIK an increased burden.\n\n4. FEC PRO Div memo of transmittal to CofS requests that D/A be furnished info copies of directives issued in implementation of JCS 1483/5. (directive to CINCFE received as WX 97866). CINCFE took no formal action on WX 97866; CG, USAFIK, who received info copy, informed CINCFE that unless otherwise directed he would proceed according to his plan. Thereafter, C/S USAFIK, accompanied by G-3 and G-4, USAFIK, visited GHQ, at which time they were orally advised of policy on issuance of equipment, the only matter in question. As a result, no written directives have been issued by CINCFE.\n\n5. To conform to D/A instructions, it is considered that a radio should be dispatched to CG, USAFIK, info D/A, confirming verbal instructions.\n\nIncls (to be retd by SGS to G-3 Plans Div):\n#1 - WX 97866 #2 - CX 58437 #3 - CX 57862\n\nW. H. M.\nCol, GSC Asst Chief of Staff, G-3\n\n[0035면]\nDECLASSIFIED\nAuthority NND 86527 G-3 ROUTING SLIP GHQ, FEC, 16 April 1948 ASST CHIEF OF STAFF, G-3 W H MARIS, Col DEPUTY AC/S, G-3 Col R D Palmer Col P D Ginder\n\nOPERATIONS\nCol E C Burkart - Lt Col T R Hannah Lt Col C B Hammerle Jr Col * Stanton Maj W B Todd Maj J H Leonard\n\nADMINISTRATION\nLt Col E O'Donohue - Lt Col K J Woodbury Capt H G Minch Lt H Ammerman\n\nTRAINING\nCol A M Parsons Lt Col H G Fisher Lt Col J Bealke Jr Maj J M Hall\n\nTROOP CONTROL\nLt Col Paige Col R J Butchers - Lt Col L W Smith Lt Col J M Churchill Lt Col V E Day Maj R A Edwards\n\nPLANS\nCol A D Jennings Lt Col L H Ham Lt Col J T Schwenk Lt Col K L Haycraft Maj Sam J Bradley\n\nORGANIZATION & EQUIPMENT\nLt Col J M Pittman Maj R C McDonald Maj C I Lucas\n\nCHIEF CLERK\n\nREPATRIATION\nLt Col B J Young Maj M I Anderson FOR:\n( ) Approval ( ) Comment ( ) Concur ( ) Nec Action ( ) Signature ( ) Info ( ) Returned by ( ) Ret to Dispatch ( ) Adm ( ) Your File ( ) As Amen ( ) File ( ) Adm ( ) Person Concerned 1230 K G, 20 Apr 48", "notes": [], "note": "기계 판독 참고 — OCR 오류 교정: 'JOS'→'JCS', 'Cots'/'CofS' 혼용은 원문 그대로 유지. 배포 경로 명단에서 '*' 표시된 대령의 이름은 OCR이 복원하지 못했으나 원문에 존재하는 것으로 보존(Stanton). 'JCS 1483/51'과 'JCS 1403/5'가 혼재되어 나타나는데, 원문의 오타 가능성이 있어 그대로 유지.", "warn": false, "pages": ["0033", "0034", "0035"]}, {"id": "D013", "order": 12, "date": "1948-04-14", "group": "A", "eyebrow": "D013 · A. 조선경비대 무장·증강", "title": "남한 경비군 T/O&E 관련 전표, 전문 일부 및 내부 메모", "badge": "TOP SECRET", "list_right": "0036–0040", "meta": [{"k": "발신", "v": "G-3", "txt": true}, {"k": "수신", "v": "G-4", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "memorandum"}, {"k": "면", "v": "0036–0040 (5면)"}, {"k": "건명", "v": "T/O&E's for Security Forces in South Korea", "txt": true}], "summary": "Routing slips, cable fragment, and internal memo regarding T/O&E's for Security Forces in South Korea", "points": ["1948년 4월, 주한미군정이 작성한 남한 경비군 증강용 T/O&E 초안을 검토한 결과, 장비 목록에서 기밀 및 희소 품목이 삭제되었으나, 원본 T/O&E 자체가 아닌 별도 군수 양식에서만 수정이 이루어져 추가 검토가 필요한 상태였다.", "G-4는 합참 승인을 위한 T/O&E를 육군부로 송부할 때, 장비 목록을 통해 수정되었음을 명시하는 문구를 포함할 것을 권고했다.", "4월 중순 한국에서 열린 회의 결과 하지 장군이 기존 T/O&E 계획을 대폭 수정한 서한을 보내기로 함에 따라, G-3는 G-4 또한 이에 맞춰 기존 비망록을 수정할 필요가 있다고 판단했다.", "한국경비대 증강 및 장비지급에 관한 지속적 조치는 G-3 계획과에서 주도하도록 결정되었다.", "OCR 인식 오류로 내용을 전혀 파악할 수 없는 조각입니다."], "primary": "[0036면]\n대외비 해제\nG-4\n주한미군정\n부참모장\n극동해군사령부\n\n참조:\n참모차장, G-3\n부관감,\n대령, 부관감실\n워드 H. 마\n준장, 미육군\n존 R. M. 레비,\n대위, 법무감실\n\n승인자:\n제24사단\n\n공식:\n(반송)\nG-2\n\n표제:\n\n\n사세보 행. 상황상 바람직하다고 판단될 경우 미군 경비병 6명 사용 승인됨.\n선박에 약 100명의 일본인 탑승 가능.\n사세보에서 나제 및 부레아까지 약 300명의 류큐인 수송.\n사세보에서 부산까지 약 250명의 불법 한국인 이민자 수송.\n1948년 4월. 선박은 약 150명의 합법 한국인을 수송할 것임.\n1948년, 부산 도착 예정 1948년 4월 15일, 나제 도착 예정 1948년 4월 17일, 도착 예정\n1947년 2월 전체 혹은 필요 참조가 아님. 보고타 마루, 출발일\n) 경비병 ZX 13279, 1947년 7월 7일 및 44989\n\n\n17 사세보 함대활동부대\n제6보병사단장\n18 제24보병사단장\n주한미군정사령관\n제1군단장\n참조:\n19 류큐군사령관\n.\n(부산에서)\n제24군단장\n20 제8군사령관.\n수신:\n극동연합군최고사령관\n발신:\n98 기관총단 (경유\n22\n\n통신대 전문\n24 연합국\n최고사령관\n육군대장\n25\n\n[0037면]\n비밀해제\n권한 NND86527\n\n일급비밀\n남한 경비군 편제 및 장비표\nG-3\n1948년 4월 14일\n\n1. 상기 건에 대한 1948년 4월 6일자 주한미군사령관 발 극동군총사령관 앞 일급비밀 서신을 참조한다. 동봉된 편제 및 장비표와\n문서들을 검토한 결과, 주한미군사령관은 기밀 물자와 대부분의 고도 기술 및 희소 품목\n장비를 삭제 완료했음을 알 수 있다. 이 삭제들은 해당 편제 및 장비표 자체가 아닌\n별첨 5 \"군수 양식\"에서 이루어졌으며,\n이 장비 목록들에 대한 추가 검토가 바람직하다고 판단되므로,\n적절한 논평을 첨부하여 이 편제 및 장비표들을 승인하고 육군부로 송부할 것을 건의한다.\n\n2. 이 편제 및 장비표들을 육군부에 송부하는 이첩 서한에 다음 문단을 포함시킬 것을 건의한다: \"별첨 5 군수 양식에 제시된\n장비 목록에 의해 수정된, 제안된 편제 및 장비표에 대한 합동참모본부 승인을\n건의한다. 이 장비 목록들은 기밀, 고도 기술 및 특정 희소 장비 품목 삭제를 통해\n편제 및 장비표 대비 수량 감축이 이루어졌음을 보여준다. 소요 품목 및 수량의\n추가 감축을 위해 이 목록들에 대한 세부 검토가 계속 진행 중이다.\n\n3. 1948년 3월 18일, 이 수정된 편제 및 장비표에서 요구하는 장비를 극동군사령부의\n가용 자원으로 지급하기 위한 조치가 개시되었다.\"\n\n4. 특정 장비의 명시적 삭제 및 특정 품목의 수량 감축을\n달성하기 위해 이 장비 목록들에 대한 추가 검토는 별도 조치로 시행할 것을 건의한다.\n\n5. 주한미군사령관의 기본 서신 9항의 요청에 대한 회신은 G-4와 협조할 것을 요청한다.\n\n\n/서명/ JMC\nJMC/vn\n\n\n제1 추신\n\n발신: G-3 수신: G-4 일자: 1948년 4월 17일\n\n제1 비망록 1항에서 참조한 서신이 철회되고\n최근 회의 결과에 따른 다른 의견으로 대체될 예정임을 비공식적으로 파악했다.\n\n위 사항을 고려할 때 G-4가 제1 비망록을 수정하기를\n원할 것으로 판단된다.\n\n일급비밀\n\n[0038면]\n비밀해제\n권한 NND86527\n\n[대부분 판독 불가 — 전표 또는 도표의 이면이 뒤집혀 손상된 채 스캔된 것으로 보이며, 텍스트 조각들이 반전되어 있음. 복원 가능한 군사적 내용 없음.]\n\n[0039면]\n비밀해제\n권한 NND86527\n\n일급비밀\n\nG-3 조정실\nRJB/JMC/vn\n1948년 4월 17일\n\n기록용 비망록:\n\n1. 기본 조치: G-4 발 G-3 수신, 1948년 4월 14일, 제목:\n\"남한 경비군 편제 및 장비표,\" (일급비밀).\n\n가. G-4는 한국에서 한국 경비대 증강을 위해\n작성된 편제 및 장비표들을 언급함.\n이 증강을 위한 원 편제 및 장비표들은 4월 초 극동군총사령부에\n접수되었으며, 여기서 개최된 전반적 주제에 관한 회의의\n일부로 검토되었음.\n\n나. G-4는 현재 언급된 편제표들에 대한 논평으로\nCINCFE가 육군부로 보내는 전달 서한에 포함시킬\n문단을 건의함.\n\n2. G-3 계획과에서 확인된 사항:\n\n가. 한국 경비대의 주요 현안은 육군부의 지시에 따른\n이 부대의 증강 및 장비 지급임.\n\n나. 4월 13일부터 16일까지 한국에서 실시된 회의에서\n군단장이 해당 편제 및 장비표에 대한 논평을 확대해야 한다는 점이 드러남.\n하지 장군은 수정된 서한이 가능한 한 빠른 시일 내에 송부될 것임을 확약함.\n\n다. 수정된 서한(제2항 나)의 개념이 회의 결과\n실질적으로 변경되고 있으므로,\nG-4도 자신의 논평을 수정하기를 원할 것으로 판단됨.\n\n라. 본 건에 대한 지속적 조치는 G-3 계획과에서\n필요 시 타 부서의 지원을 받아 수행할 것임.\n\n3. 건의: 첨부된 비망록을 G-4로 발송 승인.\n\n4. 동의: G-3 계획과 (스미스 중령).\n\n5. 완료: 이로써 기본 건에 대한 조치 완료. 위 2-라항에 명시된 바와 같이\n본 건에 대한 지속적 조치가 취해질 것임.\n\n/서명/ R. J. 부처스\nR. J. 부처스\n대령, 일반참모단\n\n일급비밀\n\n6 - u\n\n[0040면]\nDECLASSIFIED\nAutority NND846527\nТ39032 90T\n\n[이 페이지의 나머지 텍스트는 극심한 OCR 오류로, 많은 단어가 좌우 반전 또는 역상으로 나타나 판독이 불가능합니다.]", "secondary": "[0036면]\nUNCLASSIFIED\nG-4\nUSAMGIK\nD C/S\nCOMNAVFE\n\nInfo:\nAsst. Chief of Staff, G-3 Adjutant General, Colonel, AGD,\nWARD H. MARR\nBrigadier General, USA JON R. M. LEVY, Captain, JAGD APPROVED BY:\n24 Inf Div.\n\nOFFICIAL:\n(return)\nG-2\n\ncaptions to:\n\nto Sasebo. Authority granted to use 6 U.S. guards if deemed advisable aboard vessel available for approximately 100 Japanese to be lift approximately 300 Ryukyuans from Sasebo to Naze and Burea approximately 250 illegal Korean immigrants from Sasebo to Pusan April 1948. Vessel will lift approximately 150 legal Korean 1948, ETA Pusan 15 April 1948, ETA Naze 17 April 1948, ETA February 1947 not to all or needed refer. Bogota Maru, EID ) Guards ZX 13279 of 7 July 1947 and 44989 17 COMFITACT Sasebo CG 6th Inf Div 18 CG 24th Inf Div\nCG USAMGIK\nCG I Corps Info:\n19 CG Rykom .\n(at Pusan)\nCG XXIV Corps 20 CG 8th Army.\nTo:\nSCAP\nFrom:\n98 MG GP to (Pass 22\n\nSIGNAL CORPS MESSAGE\n24 FOR THE ALLIED POWERS\nSUPREME COMMANDER\nGENERAL\n25\n\n[0037면]\nDECLASSIFIED\nAuthority NND86527\n\nTOP SECRET\nT/O&E's for Security Forces in South Korea\nG-3\n14 APR 1948\n\n1. Reference is made to Top Secret letter, subject as above, from CG USAFIK, dated 6 April 1948 to CINCFE. A review of the T/O&E's and papers attached thereto indicates that CG USAFIK has accomplished deletions of classified material and of most types of highly technical and scarce items of equipment. Although these deletions have been made in Inclosure 5, \"Logistical forms\", rather than in the specific T/O&E's to which they pertain, and further screening of these equipment lists is considered desirable it is recommended that the T/O&E's be approved with appropriate comments and forwarded to the D/A.\n\n2. It is recommended that the following paragraph be included in the letter of transmittal accompanying these T/O&E's to the D/A: \"Recommend JCS approval of proposed T/O&E's, as amended by lists of equipment set forth in logistical forms (Incl. 5). These lists of equipment indicate reductions in quantity below T/O&E's by the deletion of classified, highly technical, and certain items of scarce equipment. Additional detailed screening of these lists is being continued in order to further reduce quantities and types of items required.\n\n3. On 18 March 1948, action has been initiated to issue equipment required under these modified T/O&E's from resources available in this Far East Command.\"\n\n4. It is recommended that further screening of these lists of equipment, in order to accomplish specific deletions of equipment and reduction of quantities in certain items, be accomplished by separate action.\n\n5. It is requested that the reply to request in Par 9 of basic letter from CG USAFIK be coordinated with G-4.\n\n/s/ JMC\nJMC/vn 1st Ind.\n\nFrom: G-3 To: G-4 Date: 17 April 1948 It is understood informally that letter referenced in Par 1 of C/N #1 is to be withdrawn and other remarks in accordance with recent conferences substituted therefor.\n\nIn view of the above it is believed G-4 may desire to revise C/N #1.\n\nTOP SECRET\n\n[0038면]\nDECLASSIFIED\nAuthority NND86527 [Page mostly illegible - appears to be a mirror image or damaged scan of the reverse side of a routing slip or diagram, with reversed text fragments. No coherent military content recoverable.]\n\n[0039면]\nDECLASSIFIED\nAuthority NND86527\n\nTOP SECRET\n\nG-3 TC\nRJB/JMC/vn 17 Apr 48 MEMO for RECORD:\n\n1. BASIC ACTION: C/N, G-4 to G-3, 14 Apr 48, subject:\n\"T/O & E's for Security Forces in Southern Korea,\" (Top Secret).\n\na. G-4 refers to T/O & E's which were drafted in Korea for the augmentation for the Korean Constabulary. Original T/O & E's for this augmentation were in GHQ early in April and were considered as part of conferences conducted here on the overall subject.\n\nb. G-4 now recommends a paragraph to be included in CINCFE's forwarding letter of transmittal to DA commenting on T/O's mentioned above.\n\n2. From G-3 Plans it has been ascertained that:\n\na. The primary subject of the Korean Constabulary has been the augmenting and equipping of this unit as directed by DA.\n\nb. Conferences conducted in Korea from 13 April to 16 April developed that CG, XXIV Corps should expand his comments on subject T/O & E's. General Hodge assures this revised letter will be forwarded earliest.\n\nc. Since the concept of the revised letter, Par 2 b, is being materially changed as a result of conferences, it is believed G-4 may wish to revise his comments also.\n\nd. Continuing action on the subject will be taken by G-3 Plans with assistance as required by other divisions.\n\n3. RECOMMENDED: Approval and dispatch of attached C/N to G-4.\n\n4. CONCURRENCES: G-3 Plans (Lt Col Smith).\n\n5. COMPLETION: This completes action on basic. Continuing action on the subject will be taken as in Par 2-d, above.\n\n/s/ R. J. Butchers\nR. J. BUTCHERS\nColonel, GSC\n\nTOP SECRET\n\n6 - u\n\n[0040면]\nDECLASSIFIED\nAutority NND846527 Т39032 90T [The remainder of the text on this page is a severely garbled OCR artifact, with many words appearing reversed or mirrored. No intelligible sentences can be recovered.]", "notes": [], "note": "기계 판독 참고 — Page 0036 is a routing slip that appears to be two separate documents overlaid (a signal corps message fragment and a routing slip). The signal corps message regarding the Bogota Maru ship movement seems unrelated to the main T/O&E subject. Page 0038 is completely illegible due to scan error (mirror image). Some text on page 0036 is reconstructed from context; original OCR was heavily garbled. / The OCR output contains extensive mirrored text (e.g., 'doldw' for 'window', 'bebul' for 'lubeb') and is completely unrecoverable. No document content can be extracted.", "warn": false, "pages": ["0036", "0037", "0038", "0039", "0040"]}, {"id": "D014", "order": 13, "date": "1948-03-19", "group": "A", "eyebrow": "D014 · A. 조선경비대 무장·증강", "title": "남한 경비대 5만 명 증강 승인", "badge": "TOP SECRET", "list_right": "0041–0042", "meta": [{"k": "발신", "v": "DA (Department of the Army)", "txt": true}, {"k": "수신", "v": "CINCFE (MacArthur)", "txt": true}, {"k": "참조", "v": "CG USAFIK (Hodge)", "txt": true}, {"k": "전문번호", "v": "WX 97866"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0041–0042 (2면)"}, {"k": "건명", "v": "Augmentation of South Korean Constabulary", "txt": true}], "summary": "Augmentation of South Korean Constabulary to 50,000", "points": ["육군부는 1948년 3월 19일 전문 WX 97866을 통해 남한 경비대를 5만 명으로 증강하는 것을 조건부로 승인했으며, 이는 미군 철수 문제와는 별개로 추진됨.", "경비대에 지급될 초기 장비는 잉여분으로 제한되며, 향후 상황 변화에 따라 지급 기준이 조정될 수 있음.", "주한미군 사령부는 승인 즉시 증강 계획 이행에 착수했으며, 참모장 헤렌 장군이 극동군 사령부를 방문하여 보급 문제를 협의함."], "primary": "[0041면]\n해제됨\n권한: NND 846527\n\n극동군 사령부\n미 육군 태평양부대 총사령부\n부관실\n\n무선 및 전신 센터\n\n수신 전문\n\n비밀(SECRET)\n\n발신 : 육군부\n수신 : 극동군 총사령관 (맥아더)\n참조 : 주한미군 사령관 (하지)\n전문 번호 : WX 97866\n\n11 극동군 총사령관 전문 CX 58437 참조.\n남한 경비대를 5만 명으로 증강하는 것을 귀관의\n해당 전문에서 제안한 기준으로 승인함.\n장비는 1946년 1월 9일자 WX 92187에서\n승인된 것과 동일한 기준으로 이관되어야 함.\n현 시점의 보안상 이유로, 이 조치는 조건 (2)를 상정하고 있으며,\n현재 검토 중인 계획된 철수와는 별개로 고려되고 있음.\n국무부 동의함.\n\n16\n17\n조치 : 작전참모부(G-3)\n정보 : 총사령관, 참모장, 정보참모부(G-2), 군수참모부(G-4)\n18\n19\n\n20 접수\n전문통제번호(MCN): 72905 우선순위 발신시간(TOO): 181915 Z\n비밀(SECRET)\n\n분류가 다음에 의해\n비밀로 취소 또는 변경됨\nNOSIG\n권한 wx83304 48년 6월 6일자.\n\nAR 380-5 제51항 1 및 a (4)에 따라 '해석 불필요'. 최고 비밀로 취급\n본 전문의 축어적 평문을 동일 등급의 서신으로 취급 및 전송하는\n것이 1946년 3월 6일자 AR 380-5 제16-C, 18-E, 53-A,\n53-D (1) (2) (3) 및 60-A (1) (2) (3) (4)항의 규정에 따라\n육군부에 의해 승인되었음.\n\n[0042면]\n해제됨\n권한: NND86527\n\n최고 비밀(TOP SECRET)\n\nG-3 BLP/slb\n1948년 4월 3일\n\n기록용 메모:\n\n제목 : 남한 경비대 증강.\n\n1. 기본문서: 1948년 3월 19일자 WX 97866, 이는 참조 a의 CX 58437에 개요된 기준에 따라 5만 명으로의 증강을 승인함.\n\n2. 참조문서:\n a. 1948년 2월 6일자 CX 58437, 이는 5만 명으로의 증강을 현 경비대의 최대 실현 가능 증강 규모로 간주할 것을 권고하고, 증강을 위한 주한미군 육군부대(USAFIK) 개요 계획을 요약함.\n b. 1946년 1월 9일자 WX 92187, 이는 경비대 증강 및 한국 보안군에 대한 장비 지급을 위한 기획 기준을 수립함.\n\n3. 논의:\n a. 주한미군 사령관은 극동군 총사령관에게 (최고비밀) 1948년 3월 23일자 ZGCT 355 (참조목록에 미포함)를 통해 달리 지시가 없는 한 기본문서에 포함된 권한을 즉시 이행하기 시작할 것이라고 통보함.\n b. 주한미군 사령관에 대한 공식 지시의 근거가 될 수 있었던 유일한 문제는 1948년 12월 31일까지의 완전 편제장비표(T/O&E) 요구량 및 처분 수준을 초과하는 실제 잉여분 중 초과하는 주한미군 육군부대(USAFIK) 편제장비표(T/O&E) 장비를 경비대 프로그램에 적용할 권한에 관한 것이었음. 기존 권한에 따라 주한미군 사령관은 이를 적용할 권한이 있음.\n c. 1948년 3월 31일, 주한미군 참모장(헤렌 장군)이 작전참모부장 및 군수참모부장을 대동하고 총사령부(GHQ)를 방문함. 이때 극동군 사령부 부참모장 및 군수참모부장과의 회의에서 경비대 프로그램을 위한 보급 가용성 문제가 상당히 논의되어, 기본문서에 대한 더 이상의 조치가 불필요하게 되었음. 일반적으로 초기 지급은 1948년 12월 31일까지의 완전 편제장비표(T/O&E) 요구량 및 처분 수준을 초과하는 잉여분으로 제한되며, 이는 보다 완전한 지급이 필수적이게 되기 전에 후속 상황 전개가 이 지급 기준의 변경을 허용할 것이라는 가정 하에 이루어짐.\n\n4. 완료: 이로써 기본문서 및 ZGCT 355에 대한 작전참모부(G-3) 조치를 완료함.\n\n페이지 - 26-5947\n최고 비밀(TOP SECRET)", "secondary": "[0041면]\nDECLASSIFIED\nAuthority NND 846527\n\nFAR EAST COMMAND\nGENERAL HEADQUARTERS, U.S. ARMY FORCES, PACIFIC\nADJUTANT GENERAL'S OFFICE\n\nRADIO AND CABLE CENTER\n\nINCOMING MESSAGE\n\nSECRET\n\nFROM : DA\nTO : CINCFE (MACARTHUR)\nINFO : CG USAFIK (HODGE)\nNR : WX 97866 11 Reference CINCFE rad CX 58437.\nAugmentation of South Korean Constabulary to 50,000 is authorized on basis suggested by your radio referred. Equipment should be transferred on same basis as authorized in WX 92187, 9 Jan 46. For reasons of security at this time, this action envisaging condition (2). being considered as separate from planned withdrawal which is still under consideration.\nDept of State concurs.\n\n16 17 ACTION : G-3 INFORMATION : COMMANDER IN CHIEF, CHIEF OF STAFF, G-2, G-4 18 19 20 RECEIVED\nMCN: 72905 PRIORITY TOO: 181915 Z\nSECRET\n\nClassification cancelled or changed to Secret by\nNO SIG\nauthority cf wx83304 6 Jun 48.\n\na * AR 380-5. Handle as TOP SECRET Handling and transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) (2) (3), and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946.\n\n[0042면]\nDECLASSIFIED\nAuthority NND86527\n\nTOP SECRET\n\nG-3 BLP/slb 3 April 48 MEMO FOR RECORD:\n\nSUBJECT : Augmentation of South Korean Constabulary.\n\n1. BASIC: WX 97866/19 Mar 48, which authorized augmentation to 50,000 on the basis outlined in CX 58437 (ref a).\n\n2. REFERENCES:\na. CX 58437/6 Feb 48, which recommends that increase to 50,000 be considered maximum feasible augmentation of present Constabulary and summarizes USAFIK outline plan for augmentation.\nb. WX 92187/9 Jan 46, which established planning basis for augmentation of Constabulary and issue of equipment to Korean Security Forces.\n\n3. DISCUSSION:\na. CG, USAFIK has notified CINCFE (TOP SECRET) ZGCT 355/23 Mar, (not included in references) that he is proceeding immediately to begin implementation of authority contained in Basic unless otherwise directed.\nb. Only question involved which might have been basis for formal directive to CG, USAFIK was that of authority to apply to the Constabulary program such USAFIK T/O&E equipment as is excess to actual excesses above full T/O&E requirements and disposition levels to 31 Dec\n48. Under his existing authority CG, USAFIK is authorized to apply\nc. On 31 Mar 48, C/S, USAFIK (Gen Herren), accompanied by the A C/S, G-3 and A C/S, G-4 visited GHQ. At this time, in conference with D C/S and A C of S G-4, FEC the question of supply availability for the Constabulary program was discussed at some length, rendering any further action on Basic unnecessary. In general, initial issues will be limited to excesses above full T/O&E requirements and disposition levels to 31 Dec 48, under assumption that subsequent developments will permit changes in this basis for issue prior to the time that more complete issue becomes imperative.\n\n4. COMPLETION: This completes G-3 action on Basic and on ZGCT 355.\n\nPAGE - 26-5947\nTOP SECRET", "notes": [], "note": "기계 판독 참고 — Page 0041's OCR had multiple dates and garbled text mixed in, likely from overlaid stamps or annotations (e.g., '19 Mar 48', '9 Jan 46', '6 Jun 48'). WX 97866 is dated 19 Mar 1948; WX 92187 is cited as 9 Jan 1946. The cancellation authority date of 6 Jun 1948 appears to be a later admin annotation. The 'condition (2)' likely refers to a specific security or operational condition from the original plan. Page 0042 section 3.b appears to be an incomplete sentence; the text is rendered as-is.", "warn": false, "pages": ["0041", "0042"]}, {"id": "D015", "order": 14, "date": "1948-03-05", "group": "D", "eyebrow": "D015 · D. 장래 정책·철군", "title": "CINCFE, 미군 철수에 앞서 한국군에 대한 수정된 소요 추산 및 편제표 요청", "badge": "SECRET", "list_right": "0043–0044", "meta": [{"k": "발신", "v": "CINCFE", "txt": true}, {"k": "수신", "v": "CG USAFIK", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "C-59039"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0043–0044 (2면)"}, {"k": "건명", "v": "Withdrawal from Korea", "txt": true}], "summary": "CINCFE requests revised estimates and TO&Es for South Korean forces prior to planned US withdrawal", "points": ["주한 미군 사령부에 이전 계획인 미군 장비의 가용성 및 상태에 대한 수정된 상세 보고서를 요청함.", "한국 경비대, 경찰, 해안 경비대의 편제표를 모든 병참적 측면을 포괄하는 단일 보고서로 제출할 것을 지시함.", "기 제출된 탄약 부족 목록은 비표준 명칭으로 인해 거부되었으며, 표준 명칭으로 재제출하도록 요구함."], "primary": "[0043면]\n해제\n권한 NND86527\n극동사령부\n발신 전문\n1948년 3월 5일\n발신: CINCFE(극동군 총사령관)\n수신: CG USAFIK(주한 미군 사령관) • • • PRIORITY SECRET 050843\n\nC-59039 참조: WARX 96766 (48.3.1), WX 95935 (48.2.11),\nCX 58800 (48.2.22), 및 귀전 ZGCT 252 (48.2.28)\n\n1. 귀전 ZGCT 252의 내용이 불완전하며 본부에 기 전달된 정보와 부분적으로 불일치함. 첫째, WX 95935와 본부 발신 CX 58800 제2부는 귀전 ZGCT 252에서 보고된 바와 같이 무기에 한하지 않고 전 유형의 장비에 대한 보충 및 정비 보급품에 적용되었음. 둘째, 무기 정비 보급품 6개월분이 가용하다는 귀측의 진술은 \"무기용 예비 부품\"(48.12.30부 귀측 서신 파일 IFGDS 474, 6개 첨부)에서 보고된 무기 예비 부품의 빈약한 가용성을 감안할 때 이해되지 않음. 귀전 ZGCT 252 제3부에 기재된 탄약 및 발화 장치 품목들은 사용된 명칭이 비표준이므로 승인 불가함. 표준 탄약 명칭 및 탄약 부호 지정을 포함하여 탄약 부족 목록 재제출 요청. 추가로, 모든 기술부대의 나머지 최초 지급 및 보충 최종 품목과 정비 보급품에 대한 부족 목록을 최대한 조기에 제출할 것(아래 3항 참조).\n\n2. 인수 완료일을 1948년 12월 31일로 가정하고, WARX 96766 2항에서 요구된 추산치가 다음에 따라 최대한 조기에 제출되기 바람:\n\na. 증강된 경비대에 최초 지급분과 6개월분 보충분을 제공할 수 있도록 이관 계획된 XXIV(24)군단 소속 부대가 보유한 T/O&E(편제장비표) 장비 비율. (1) 사단급 및 (2) 근무 부대로 세분화 제안. 본 보고서 목적상, XXIV(24)군단 철수 시 비축 물자가 부대 보유 T/O&E(편제장비표) 장비보다 먼저 이관되는 것으로 가정함.\n\nb. 위 장비를 인계하지 않고 미군이 계속 사용할 경우, 수명 개월 수 기준 가동률. 위와 유사한 세분화 제안.\n\n3. WARX 96766 3항 관련. 다음에 대한 제안 편제표의 최대한 조기 제출 바람:\n\na. 민간 경찰;\n\nb. 증강 경비대;\n\nc. 해안 경비대;\n\n[0044면]\n\nCINCFE 전문 TO CG USAFIK 48.3.5일자\n\n1년간의 보급품, 최종 품목의 초기 지급에 대한 세부 내역을 표시하는 장비 목록, 1년간의 보충품 및 탄약 소요. 미 육군 요소, 소모율 및 권장 보충 계수에 대한 기술 부대별 백분율 관계로 표시할 것. 주한 미군 사령부가 48.2.3부 서신 TFGCT 322, 제목 \"남조선 경비대\"로 제출한 편제표 도표 접수되었으나 상술된 요구 조건을 충족하기에 충분히 상세하지 않은 것으로 간주됨. 동 건에 대한 소요 및 가용성을 단편적으로 추산하는 것을 피하기 위해, 모든 병참 측면을 망라하는 단일 완전 종합 보고서 준비를 제안함. 동 건에 대해 귀측을 보좌하기 위해, 포함 항목과 보고서 수립 형식을 제안하는 항공 서신을 최단시일 내 발송 예정. 따라서 전술된 항공 서신 수령 시까지 초기 계획을 위해 이 전문 1항 및 3항을 활용할 것. 이 전문 수령 후 최대한 조기에 상기 2항에 의한 비율 및 가동률 보고서 제출할 것. 본 건은 현재 TDY(임시 근무) 차 내한 중인 XXIV(24)군단 보좌 G-4(병참 참모) 메이저 A. C. 페데르센(O-528472)과 논의되었음.\n\n공식:\n- 알 엠 레비\n육군부 대령\n부관장\n\n승인:\n- 에이치 이 이스트우드\n육군 참모단 대령\nG-4(병참) 부참모장\n\n사본 배포처:\n총사령관\n참모장\nG-2(정보)\nG-3(작전)\nG-4(병참)\n작전과\n\nSECRET\n\n초극비 사본 2호.", "secondary": "[0043면]\nDECLASSIFIED\nAuthority NND86527\nGENERAL HEADQUARTERS\nFAR EAST COMMAND GD SP OAK/JDS/AA/hst\nOUTGOING MESSAGE\n5 March 1948\nFROM: CINCFE\nTO: CG USAFIK • • • PRIORITY SECRET 050843 C-59039 Refs WARX 96766 dtd 1 Mar 48, WX 95935 dtd 11 Feb 48, CX 58800 dtd 22 Feb 48, and urad ZGCT 252 dtd 28 Feb 48.\n\n1. Contents urad ZGCT 252 incomplete and partially inconsistent with info already furnished here. First, WX 95935 and Part II of urad CX 58800 applied to replacement and maintenance supplies for all types of equipment, not merely for weapons as reported urad ZGCT 252. Second, your statement that six months maintenance supplies for weapons available not understood in view of meagre availability of spare parts for weapons reported by your Letter, file IFGDS 474, 30 Dec 47, subject, \"Spare Parts for Weapons\" with six inclosures. Line items on ammo and firing devices listed Part III urad ZGCT 252 not rpt not acceptable in view of non-standard nomenclature used in describing items. Request ammo shortage list be resubmitted using standard ammo nomenclature to include ammo code designations. In addition, request shortage list on remaining initial issue and replacement end items, plus maintenance supplies, of all technical services, be submitted earliest (refer par 3 below).\n\n2. Assuming a completion of transfer date of 31 Dec 48, desire estimate required by par 2 rpt par 2 of WARX 96766 be furnished here earliest as follows:\n\na. Percentage of T/O&E equipment in hands of troops of XXIV Corps which is planned for transfer to augmented constabulary so as to provide initial issue plus six months replacements. Suggest breakdown by (1) divisional and (2) service units. Assume for purposes of this report only that depot stocks upon withdrawal of XXIV Corps will be transferred prior to T/O&E equipment in hands of troops.\n\nb. Serviceability in terms of months of life expectancy of above equipment should it not rpt not be turned over but continued in use by US troops. Suggest similar breakdown as above.\n\n3. Re par 3 of WARX 96766. Desire submission earliest proposed T/O&E's for:\n\na. Civil Police;\n\nb. Augmented Constabulary;\n\nc. Coast Guard;\n\n[0044면]\n\nCINCFE RAD TO CG USAFIK DTD 5 Mar 48 ment issues for one year, equipment lists to show breakdown for initial issues of end items, replacements and ammunition requirements for one year. Indicate by percentage relationship by technical service to United States Army Forces factors, consumption rates and replacement factors recommended. Receipt of TO&E chart submitted with letter Headquarters USAFIK file TFGCT 322, 3 Feb 48, subject, \"South Korean Constabulary\" acknowledged but not considered sufficiently in detail to meet requirement outlined above. In order to avoid piecemeal estimates on requirements and availabilities this subject, suggest that a single complete and all inclusive report be prepared covering all logistical aspects. To assist you in this matter, letter by air courier will be dispatched soonest suggesting items for inclusion, format upon which to establish report. Use pars 1 and 3 this rad, therefore, for initial planning pending receipt aforementioned letter. Submit percentage wise and serviceability report required by par 2 above earliest after receipt of this rad. This subject has been discussed with Major A. C. Pedersen, 0-528472, Assistant G-4, XXIV Corps, currently here on TDY.\n\nOFFICIAL:\n- R. M. LEVY Colonel, AGD Adjutant General Approved by:\n- H. E. EASTWOOD Colonel, GSC Asst. C/S, G-4 Copies furnished:\nC-in-C\nC/S\nG-2\nG-3\nG-4\nOpns\n\nSECRET\n\nTop Secret Copy No. 2.", "notes": [], "note": "기계 판독 참고 — Original message date header '5 March 1948', but internal references indicate it was drafted on 5 March 1948. The '050843' is likely a date-time group. The physical document contains scanning artifacts ('SEKISUI JUSHI', '200cn/l') that were omitted.", "warn": false, "pages": ["0043", "0044"]}, {"id": "D016", "order": 15, "date": "1948-03-01", "group": "X", "eyebrow": "D016", "title": "한국군 군수 소요", "badge": "TOP SECRET", "list_right": "0045–0047", "meta": [{"k": "발신", "v": "CG USAFIK", "txt": true}, {"k": "수신", "v": "Director of Service, Supply and Procurement, General Staff, United States Army, Washington 25, D.C.", "txt": true}, {"k": "참조", "v": "Commander in Chief, Chief of Staff, G-2, G-3; Copy for G-3", "txt": true}, {"k": "전문번호", "v": "AG 091 (1 Mar 48)QD"}, {"k": "종류", "v": "memorandum"}, {"k": "면", "v": "0045–0047 (3면)"}, {"k": "건명", "v": null, "txt": true}], "summary": "Logistic Requirements for the Korean Army", "points": ["1948년 3월 1일, 주한 미군 사령부는 10만 명 규모의 한국군 창설 계획이 5만 명 규모의 경비대 증강으로 축소되었음을 확인하고, 이에 따른 잉여 물자 발생을 보고함.", "잉여 물자는 제24군단 철수 시 반납될 미군 장비 및 보급품으로 충당 가능하므로 조선 경비대 증강에는 불필요하나, 타 군사 지원 프로그램 전용 가능성을 열어두고 회신을 요청함.", "가용 물자로 보고된 품목들은 육군성의 공식 처분 지시가 있을 때까지 지정 보류 상태이며, 신속한 처분을 위한 조기 회신을 요청하고 있음."], "primary": "[0045면]\nDECLASSIFIED\nAuthority NND86527\nTOP SECRET\n극동군 사령부(FAR EAST COMMAND)\n미 육군 태평양 부대 총본부\n부관실\n무선 및 전보 센터\n\n수신 전문\n48년 3월 12일\n\n발신: 주한 미군 사령관(CG USAFIK)\n수신: 극동군 총사령관(CINCFE)\n문서번호: TFGDS 304 CWO.USA\n\n본부의 48년 3월 7일자 전문 Urad C 59039 (기원시간 050843)로 부분 답변, 문서번호 TRODS 475, 제목: 조선 경비대(Korean Constabulary), 일자 1948년 3월 12일 수신 및 편철. 해당 전문의 나머지 부분은 조속히 답변될 것임. 귀 전문의 제목 서한은 현재까지 수신되지 않았음.\n서명 없음.\n\n조치: 병참참모부(G-4)\n정보: 총사령관, 참모장, 정보참모부(G-2), 작전참모부(G-3)\n\n등급 해제 또는\n변경\n권한에 의함\n\n수신됨\n\n16985 기원시간(TOO): 120720\n전문통제번호(MCN): 72459\n\"의역 불필요 - 본 전문의 축어적 평문 취급 및 전송은, 1946년 3월 0일자 육군 규정 380-5, 16-C, 18-A320, (2) (3)항 및 16 K 60-A (1) (2) (3) (4)항의 규정에 따라 육군성에 의해 동일 등급의 통신문으로 승인되었음.\"\n\nTOP SECRET\n사본 번호 13 페이지\n\n[0046면]\nDECLASSIFIED\nAuthority NND886527\n\nXXX XXXXXXXXXXXXXXXXXXXXXXXXXXXX\n극동군 사령부(FAR EAST COMMAND)\nAPO 500\n\nAG 091 (48년 3월 1일)QD\n\nTOP SECRET\n1948년 3월 1일\n\n제목: 한국군 군수 소요\n\n수신: 미 육군 참모본부 군수, 보급 및 조달 국장, 워싱턴 25, D.C. (사본 작전참모부(G-3) 송부)\n\n1. 다음 문서를 참조함:\n   가. 1947년 12월 4일자 육군성 전문 WARX 92520, 남한 군대 창설에 관한 건.\n   나. 1947년 12월 27일자 육군성 전문 WAR 93049.\n\n2. 1948년 1월 8일자 주한 미군 본부 문서, 문서번호 TRODS 475, 제목 \"한국군 군수 소요\"에 대한, 1948년 1월 22일자 극동군 사령부(GHQ/FEC)의 미 육군 참모본부 군수, 보급 및 조달 국장 앞 첫 번째 승인 의견서.\n\n3. 첨부된 보고서(별지 제1호)는 상기 참조 1나에 의해 수정된 참조 1가의 28항에 대한 답변으로서 작성되었음. 본부에서 WAR 93049를 접수한 이후, 한국군에 대한 최초 계획 기준(약 100,000명 규모)이 현 조선 경비대를 약 50,000명 규모로 증강하는 축소된 병력으로 변경되었음을 인지하고 있음. 그러나 가용하다고 판명된 물자들을 다른 지원 프로그램에 적용할 가능성을 고려하여 첨부 보고서의 작성을 완료하는 것이 바람직하다고 판단되었음. 이에 따라 별지 제1호의 L열에 나열된 가용 물자로 보고된 모든 품목들은 지정되어 육군성으로부터의 처분 지시를 기다리며 보류 중임.\n\n4. 가용하다고 보고된 물자들은 현 경비대의 최초 지급 품목으로 필요하지 않으며, 터키 프로그램이나 CAP 8-1/3 그룹 프로그램과 같이 극동군 총사령관(CINCFE)에게 알려진 다른 군사 지원 프로그램을 위해 이미 설정된 소요를 충족하는 데에도 필요하지 않음. 또한, 현 계획 하에서는 제24군단(XXIV Corps) 철수 시, 현재 한국에 있는 미 육군 보급품 및 장비로 증강된 경비대의 초기 필요를 충족할 수 있으므로, 본 문서와 함께 보고된 가용 물자는 계획된 조선 경비대 증강에 소요되지 않을 것임. 그러나\n\nTOP SECRET\n사본 번호 3\n\n[0047면]\nDECLASSIFIED\nAuthority NND 886527\n\nTOP SECRET\nAG 091 (48년 3월 1일)QD\n\n증강된 경비대가 한국 내 재고로부터 유지될 수 있는 정도는 현재 1948년 2월 14일자 육군성 전문 WX 95935의 지시에 따라 검토 중임.\n\n5. 본 보고서 별지 제1호에 나열된 가용 물자로 보고된 품목들이 육군성의 다른 지원 프로그램에 필요한지 여부에 대한 조기 회신을 요청함. 축소된 자금 및 인력과 잔여 임무 완료의 시급성을 고려하여 조기 회신을 요청함.\n\n총사령관을 대신하여:\n\nJ. M. EBBITT,\n대위, 부관감실(AGD),\n부관 차장\n\n별지 1:\n가용 현황 보고서\n\n1948년 3월 1일 1600 AG GIQ 발송\n사본 송부처:\n작전참모부(G-3)\n\n사본 번호 3\n\nTOP SECRET", "secondary": "[0045면]\nDECLASSIFIED\nAuthority NND86527\nTOP SECRET\nFAR EAST COMMAND\nGENERAL HEADQUARTERS, U.S. ARMY FORCES, PACIFIC\nADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\n\nINCOMING MESSAGE\n12 Mar 48\n\nFROM: CG USAFIK\nTO: CINCFE\nNR: TFGDS 304 CWO.USA 11 partially answered by letter this hq, Urad C 59039 dtd 050843 7 March 1948 received and file TRODS 475, subject: Korean Constabulary, dated 12 March 1948. Remainder of radio will be answered soonest. Subject letter, your radio, has not been received this date.\nNO SIG [Signature]\n\nACTION: G-4 INFORMATION: COMMANDER IN CHIEF, CHIEF OF STAFF, G-2, G-3 Classification cancelled, or changed By authority\n\nRECEIVED\n\n16985 TOO: 120720\nMCN: 72459 \"Paraphrase not required - handle and transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-A320, (2) (3), and 16 K 60-A (1) (2) (3) (4), AR 380-5, 0 March 1946.\n\nTOP SECRET\nCopy No. 13 Paige\n\n[0046면]\nDECLASSIFIED\nAuthority NND886527\n\nXXX XXXXXXXXXXXXXXXXXXXXXXXXXXXX\nFAR EAST COMMAND\nAPO 500\n\nAG 091 (1 Mar 48)QD\n\nTOP SECRET\n1 March 1948\n\nSUBJECT: Logistic Requirements for the Korean Army\n\nTO: Director of Service, Supply and Procurement, General Staff, United States Army, Washington 25, D.C. COPY FOR G-3\n\n1. Reference is made to the following:\na. Department of Army radio WARX 92520, 4 December 1947, concerning establishment of the south Korean Armed Forces.\nb. Department of Army radio WAR 93049, 27 December 1947.\n\n2. First Indorsement from General Headquarters, Far East Command, to Director of Service, Supply and Procurement, General Staff, United States Army, dated 22 January 1948, to letter Headquarters, United States Army Forces in Korea, file TRODS 475, 8 January 1948, subject, \"Logistic Requirement for Korean Army.\"\n\n3. The attached report (Inclosure 1) was initiated as an answer to Part 28 of reference 1a as amended by reference 1b above. It is realized that subsequent to receipt here of WAR 93049 the original planning basis for a Korean Army (approximately 100,000 men strength) has been changed to a reduced force consisting of an augmentation of the present Korean Constabulary to approximately 50,000 man strength. However, it was deemed advisable to complete preparation of the attached report in view of the possible application of the items found available, to the other programs of assistance. Accordingly, all items reported available as listed in column L of Inclosure 1 have been earmarked and are being held pending receipt of disposition instructions from the Department of the Army.\n\n4. The items reported available are not required as initial issue items for the present constabulary, nor are they required to meet already established requirements known to the Commander-in-Chief, Far East for other military assistance programs, such as the Turkey Program and CAP 8-1/3 Group Program. Also, since under present plans the initial needs of the augmented constabulary can be met from United States Army supplies and equipment presently in Korea, upon evacuation of XXIV Corps, the items reported available herewith will not be required for the planned augmentation of the Korean Constabulary. However, the\n\nTOP SECRET\nCopy No. 3\n\n[0047면]\nDECLASSIFIED\nAuthority NND 886527\n\nTOP SECRET\nAG 091 (1 Mar 48)QD degree to which the augmented constabulary can be sustained from stocks in Korea is now under consideration per instructions in Department of Army radio WX 95935 dated 14 February 1948.\n\n5. Early reply is requested as to whether these items (items reported available as listed in Inclosure 1 of this report) are required by Department of the Army for other programs of assistance. In view of reduced funds and personnel, and the urgency of completing roll-up missions early reply is requested.\n\nFOR THE COMMANDER-IN-CHIEF:\n\nJ. M. EBBITT, Captain, AGD, Asst Adj. Gen.\n\n1 Incl:\nReport of Availability MAILED 1600 Mar 1 '48 AG GIQ Copy furnished:\nG-3\n\nCopy No. 3\n\nTOP SECRET", "notes": [], "note": "기계 판독 참고 — 3페이지(면 0045)의 메시지는 별개 전보 사본이지만, 면 0046-0047의 보고서와 동일한 'Copy No. 13' 및 'Copy No. 3'으로 구분되어 한 문서군으로 처리함. 페이지 3의 제목 표기 'Logistic' 오류는 원문에 충실하여 수정하지 않음.", "warn": false, "pages": ["0045", "0046", "0047"]}, {"id": "D017", "order": 16, "date": "1948-01-08", "group": "C", "eyebrow": "D017 · C. 병참·편제", "title": "한국군 소요 군수 목록 – 공군 및 공병 품목", "badge": "TOP SECRET", "list_right": "0048–0054", "meta": [{"k": "발신", "v": "CG USAFIK", "txt": true}, {"k": "수신", "v": "CINCFE", "txt": true}, {"k": "참조", "v": "Refer to 1st Ind, ltr CG USAFIK, file TFGDS", "txt": true}, {"k": "전문번호", "v": "475"}, {"k": "종류", "v": "table"}, {"k": "면", "v": "0048–0054 (7면)"}, {"k": "건명", "v": "Logistic Requirements for the Korean Army", "txt": true}], "summary": "Logistic Requirements for the Korean Army - Air Force & Engineer Items", "points": ["1948년 1월 8일, 주한미군사령부(CG USAFIK)가 극동군사령부(CINCFE)에 한국군 창설을 위한 공군 및 공병 장비 소요 목록을 송부함.", "이 문서는 한국군이 필요로 하는 장비 총소요와, 한국 및 극동사령부(FEC) 자체 조달에서 충당 가능한 물량을 대조하여 부족분을 산출한 군수 계획임.", "연락기, 낙하산부터 도로 그레이더, 불도저, 교량 장비에 이르기까지 광범위한 공군 및 공병 중장비 목록이 포함됨.", "표에는 1951년 6월 30일 기준 병력 보유분을 초과하여 FEC가 아닌 외부 조달이 필요한 품목이 명시되어 있음.", "1948년 1월 8일자 주한미군사령관의 한국군을 위한 공병 물자 군수 소요표로, 총 6쪽 중 4~6쪽에 해당한다.", "트레일러, 용접장비, 각종 공병 작업장비 세트, 크레인, 콘크리트 믹서 등 총 28개 품목의 세부 소요량이 기재되어 있다.", "각 품목별로 한국 외 소요원 및 극동군사령부(FEC) 외 소요원으로부터의 소요량을, 현 부대 보유분 고려 여부에 따라 구분하여 계산하고 있다.", "문서는 NND846527 권한으로 비밀해제된 일급비밀(Top Secret) 등급이다."], "primary": "[0048면]\n제목: 파일 TFALS, 1948년 1월 8일, 주제: \"한국군 군수 소요\" 발신인: 극동사령관(CINCFE).\n\n공군 품목(415)\n\n                                                     한국 외 다른  한국 외 다른  극동사령부       극동사령부\n                                           한국 외     출처 소요,    출처 소요,    (FEC)      출처 소요,      출처 소요,\n                                총소요     다른 출처    병력 보유분   병력 보유분    출처       1951.6.30.       병력 보유분\n품목  재고번호       품명                   소요, 병력   미고려        미고려        (한국 외)   기준 병력        고려\n번호                                        보유분 미고려                                              보유분 초과분\n                                                                                        (2열 - 4열)      (3열 - 4열)\n(1)                   (2)           (3)       (4)          (5)          (6)         (7)              (8)\n1.                    연락기       88         88           88                     63\n2.                    유지보수 키트 32         32           32                     32\n3.    8300-637805      24피트 완전형 176        176          151                    176              151\n                      낙하산, ents for the Korean Army", "txt": true}], "summary": "Practically blank page; only declassification stamp and photographic ruler visible", "points": ["내용이 없는 페이지로, 촬영용 자와 'RECEIVED' 스탬프, 'MAR Able' 날짜만 기재되어 있음. 문서 D021의 0080면 후면으로 추정됨."], "primary": "[0081면]\n비밀해제\n기관 NND 846527\nSEKISUI JUSHI\n10\"1\n14\n16\n18\n19 20 21\n22\n23\n3월 24일 Able\n수신\n25\n26\n27", "secondary": "[0081면]\nDECLASSIFIED\nAuthority NND 846527\nSEKISUI JUSHI\n10\"1 14 16 18 19 20 21 22 23 24 MAR Able\nRECEIVED\n25 26 27", "notes": [], "note": null, "warn": false, "pages": ["0080", "0081"]}, {"id": "D022", "order": 21, "date": "1948-03-02", "group": "D", "eyebrow": "D022 · D. 장래 정책·철군", "title": "남조선 경비대 증강이 제24군단 장비에 미칠 영향 및 향후 군사원조 입법을 위한 T/O&E 자료 요청", "badge": "SECRET", "list_right": "0082–0083", "meta": [{"k": "발신", "v": "CSGPO (Chief of Staff, General Planning and Operations?)", "txt": true}, {"k": "수신", "v": "CINCFE", "txt": true}, {"k": "참조", "v": "CG USAFIK", "txt": true}, {"k": "전문번호", "v": "WARX 96766"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0082–0083 (2면)"}, {"k": "건명", "v": "Withdrawal from Korea", "txt": true}], "summary": "Impact of Constabulary expansion on XXIV Corps equipment, and request for T/O&E data for future military aid legislation", "points": ["남조선 경비대 5만 명 증강이 주한미군 제24군단의 기본 편제장비 반출 가능 규모에 미칠 영향을 백분율로 추정하여 조속히 답신할 것을 요청함.", "과거 분석에서는 미군 철수 시 가용 장비로 한국군 10만 명을 30일 내 무장 가능하다고 보았으나, 금번 5만 경비대 증강안과 6개월 정비 소요를 감안한 현실적 장비 잠식률 산정이 필요함.", "경비대 증강 승인 검토를 위해, 증강 시 사용될 미군 전술 장비의 현재 전투 사용가능 상태에 대한 평가도 함께 요구함.", "해안경비대를 포함한 향후 군사원조 입법 및 예산 편성 근거로, 증강된 경비대의 구체적 편제장비(T/O&E) 및 연간 정비 소요 자료를 최우선 요망함."], "primary": "[0082면]\nDECLASSIFIED\n권한: NND8X6527\n극동사령부\n미극동육군총사령부 인사참모처\n무선 및 통신 센터\n전문\n수신\n2급비밀(SECRET) 1948년 3월 2일\n발신: CSGPO\n수신: 극동군총사령관(CINCFE)\n참조: 주한미군사령관(CG USAFIK)\n문서번호: WARX 96766\n\n귀 전문 CX 58800 및 C 58437 참조.\n\n1. CX 58800 전문 제2부 동의함.\n\n2. 상세 연구 결과, 권고대로 남조선 경비대를 50,000명으로 증강할 경우 제24군단 및 주요 예하 부대의 기본 편제장비(T/O & E)에 미칠 추정 영향을 파악할 필요성이 드러남. 귀 전문 CX 56266 참조. 동 전문에서는 이전의 방어적 야전군 개념에 관해 \"소화기, 105mm 곡사포, 발사기 및 차량을 포함한 충분한 필수 병기 장비가 주한미군의 소요를 초과하여 가용하므로, 기본적으로 25,000명 규모의 병력을 장비할 수 있음. 미군 전술부대가 철수 시 해편되고 그 장비가 한국군에 제공된다면, 철수 후 30일 이내에 100,000명을 기본적으로 장비할 수 있음\"이라고 언급됨. 본부에서는 위의 점을 고려하여, CX 58800에 명시된 야전군 편성 대신 남조선 경비대를 50,000명으로 증강하고 6개월분 정비 소요를 더하는 권고안이, 실행 가능할 경우 제24군단 및 주요 예하 부대의 편제장비의 상당한 반출을 여전히 허용할 수 있다고 추정해 왔음. 귀측 CX 58437에 명시된 기준에 따른 증강이 한국 내 전술부대의 기본 편제장비를 백분율 기준으로 어느 정도 잠식할 것인지에 대한 추정치를 최대한 조속히 바람. 추가 조치로, 동 편제장비가 미군에 의해 계속 사용될 경우의 전투 사용가능 상태에 대한 귀측의 추정도 요망함. 경비대 증강을 진행하라는 승인에 대한 검토는 본 항에 대한 답신을 기다리며 보류 중임.\n\n3. 새로운 주제. 증강이 승인될 것이라 가정하고, 향후 군사원조를 위한 법률 및 예산 입증자료로 다음 사항이 최대한 조속히 요망됨: 증강된 민간경찰 겸 경비대를 위한 편제장비 및 연간 정비 계수와 예비 부품, 교체 부품, 탄약 포함. 해안경비대에도 적용 가능한 유사한 정보도 요망함.\n\n[0083면]\nDECLASSIFIED\n권한: NND886527\n2급비밀(SECRET) 2800\n발신: CSGPO 문서번호: WARX 96766 일자: 1948년 3월 2일 계속\n\n4. 참고를 위해 슐러 장군에게 전달 바람.\n\n서명 없음.\n\nWx 83304 권한에 의해 분류 등급 해제 또는 비밀로 변경됨.\n\n조치: G-3 계획\n정보: 총사령관, 참모장, G-2, G-4\n\n발신시간: 011729 Z\n\"의역 불필요. 2급비밀 전문 중지. 2급비밀 통신문, AR 330-5, 제51조 1항 및 제60조 a-4에 의거함.\"\n\n-2-\n\n통신관리번호(MCN): 71781", "secondary": "[0082면]\nDECLASSIFIED\nAuthority NND8X6527\nFAR EAST COMMAND\nGENERAL HEADQUARTERS, U.S. ARMY FORCES, PACIFIC ADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\nMESSAGE\nINCOMING\nSECRET 2 Mar 48\nFROM : CSGPO\nTO : CINCFE\nINFO : CG USAFIK\nNR : WARX 96766 Refers your CX 58800 and C 58437.\n\n1. Part 2 radio CX 58800 concurred in.\n\n2. Detailed study reveals desirability of determining estimated impact on basic TO and E equipment of XXIV Corps and major subordinate units of augmenting constabulary to 50,000 as recommended. Refer urad CX 56266 which states in regard to previous concept of defensive field army that \"sufficient essential Ordnance equipment to include small arms weapons, 105 mm howitzers, launchers and vehicles is available in excess of requirements for United States troops in Korea to equip basically a force of 25,000. If United States tactical forces are inactivated upon withdrawal and their equipment made available to a Korean Army 100,000 could be basically equipped within 30 days after withdrawal.\" It has been assumed here in light of the above the recommended augmentation to 50,000 of the South Korean Constabulary in lieu of field army establishment plus a 6 months maintenance requirement as outlined CX 58800 may still permit substantial removal if feasible of TO and E equipment of XXIV Corps and major subordinate units. Desired earliest is estimate of extent percentage wise that augmentation on basis outlined your CX 58437 will cut into basic TO and E of tactical units in Korea. Further action is your estimate of combat serviceability of this TO and E equipment if it were to be continued in use by US troops. Consideration of authorization to proceed augmentation constabulary held awaiting reply this part.\n\n3. New subject. Assuming that augmentation will be authorized, required earliest for substantiation legislation and appropriations for possible future military aid are following TO and E for civil police augmented constabulary plus annual maintenance factors including spare parts replacements and ammunition. Such comparable information as would be applicable to Coast Guard also desired.\n\n[0083면]\nDECLASSIFIED\nAuthority NND886527\nSECRET 2800\nFROM : CSGPO NR: WARX 96766 DTD 2 MAR 48 CONT 'D\n\n4. Please pass to Gen Schulyer for information.\n\nNO SIG\n\nChanged to Classification cancelled or secret by authority of Wx 83304 ACTION: G-3 Plans INFORMATION: COMMANDER IN CHIEF, CHIEF OF STAFF, G-2, G-4\n\nTOO: 011729 Z \"Paraphrase not required SECRET STOP SECRET correspondence per par 51 1 and 60 a (4) AR 330-5.\"\n\n-2-\n\nMCN: 71781", "notes": [], "note": "기계 판독 참고 — Authority string on page 0082 shows 'NND8X6527', on page 0083 shows 'NND886527'. Not corrected as per digit-string instruction. 'WARX 96766' is likely a typo for 'WAR' or 'WX' prefix; left as OCR saw it. 'Gen Schulyer' is almost certainly Gen. Cortlandt V.R. Schuyler, a key officer involved in Korea planning. 'CSGPO' likely stands for Chief of Staff, General Planning and Operations section of the War Department. Page 083 text from 'Changed to Classification cancelled...' onwards appears to be a security classification downgrade stamp/note embedded in the text.", "warn": false, "pages": ["0082", "0083"]}, {"id": "D023", "order": 22, "date": "1948-02-29", "group": "X", "eyebrow": "D023", "title": "주한미군사령부, 한국 경비대 탄약 소요량 산정 및 재고 부족분 보고", "badge": "TOP SECRET", "list_right": "0084–0089", "meta": [{"k": "발신", "v": "CG USAFIK", "txt": true}, {"k": "수신", "v": "CINCFE", "txt": true}, {"k": "참조", "v": "COMMANDER IN CHIEF, CHIEF OF STAFF, G-2, G-3", "txt": true}, {"k": "전문번호", "v": "ZGCT 252"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0084–0089 (6면)"}, {"k": "건명", "v": null, "txt": true}], "summary": "Ammunition requirements for Korean Constabulary: shortages from USAFIK stocks", "points": ["주한미군은 한국 경비대의 6개월분 탄약 소요량을 산정하고 주한미군 보유 재고로 충당을 계획하되, 부족분 목록을 극동군사령부에 보고함.", "소요 기준은 극동군 화력단위표상 3단위 화력 예비량과 육군규정 775-10의 연간 훈련 소모량임.", "소총탄, 기관총탄, 박격포탄, 수류탄, 신호탄, 지뢰, 폭파 자재 등 거의 모든 품목에서 대규모 부족이 발생함.", "본 산출은 한국 내 실재고만을 대상으로 하며, 제8군이 일본에 보유하거나 청구·입고 대기 중인 물량은 미포함임.", "극동군사령관은 50,000명 규모의 한국 경찰예비대 지원을 위한 주한미군사고문단 규모를 장교 25명, 사병 30명으로 수정하는 주한미군사령부의 권고에 동의한다.", "주한 외교 사절단 전체를 육군 지원 병력 없이 순수 민간인으로 운영할 것을 육군부에 권고함으로써 군사 개입 최소화 의지를 표명했다.", "주한미군사령부에 철수 계획 수립에 필요한 보충 및 정비 보급품과 탄약의 부족분 및 조달 소요 시간 추정치를 제출할 것을 지시했다."], "primary": "[0084면]\n비밀해제\n권한 NND886527\n극동군사령부\n미태평양육군총사령부\n부관실\n무선통신센터\n\n수신전문\n/제한\n\n발신: 주한미군사령관\n수신: 극동군총사령관\n전문번호: ZGCT 252\n\n본 전문은 4부로 구성됨. 재참조 WX 95935 (141522/Z) 및 CX 58800 (220801/Z).\n\n가. 계획 목적상, 본 문서의 총 탄약 소요량은 한국 경비대(Constabulary)를 위한 것이며, 현재 보유 재고가 경비대에 제공된다는 가정 하에, 아래 제3부에 열거된 품목을 제외한 주한미군 전체 재고로부터 6개월간 탄약 소요와 무기 대체·정비 보급품을 충당함. 소요 기준:\n   극동군사령부 화력단위표(FEC Unit of Fire Table)에 현재 기재된 3단위 화력 예비량.\n   육군규정 775-10(AR 775-10)에 기재된 연간 훈련 허용량.\n나. 부족분은 위 가항에 명시된 총 소요량에서 각 품목별 주한미군 보유 재고를 차감하여 산출함.\n\n제2부. 정보는 3열로 기재됨.\n\n[0085면]\n비밀해제\n권한 NND8
