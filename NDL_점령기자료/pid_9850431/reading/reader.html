<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>091 : File 1 Korea — 열람기</title>
<style>
:root{
  --bg:#eef1f4; --panel:#f7f9fa; --edge:#ccd4da; --edge-soft:#dde4e9;
  --ink:#16202a; --ink-2:#4a5b68; --ink-3:#71828f;
  --stamp:#8c2f39;            /* 기밀등급 도장의 자주색 */
  --link:#2f5d86;
  --a:#4a7c59; --b:#8a6d3b; --c:#3f6d8c; --d:#7a4a6b; --e:#5a6f7d; --x:#8a8f94;
  --term-line:#9db0c2; --term-bg:rgba(47,93,134,.05);
  --term-line-go:#7fa3c4; --term-bg-go:rgba(47,93,134,.10);
  --term-bg-on:rgba(47,93,134,.17);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",
         -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
    --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
    --stamp:#c9707a; --link:#7fb0da;
    --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
    --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
    --term-bg-on:rgba(127,176,218,.22);
    --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
  }
}
:root[data-theme="dark"]{
  --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
  --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
  --stamp:#c9707a; --link:#7fb0da;
  --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
  --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
  --term-bg-on:rgba(127,176,218,.22);
  --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--link)}

.wrap{display:grid;grid-template-columns:minmax(300px,25%) 1fr;height:100vh}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{max-height:42vh}
}

/* ── 좌측 목록 ─────────────────────────────── */
.rail{border-right:1px solid var(--edge);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
.rail-head{padding:14px 14px 10px;border-bottom:1px solid var(--edge-soft);
  display:flex;flex-direction:column;gap:8px}
/* 문서철에 들어오면 나갈 길이 있어야 한다 */
.home{display:inline-flex;align-items:center;gap:5px;text-decoration:none;
  color:var(--link);font-size:11.5px;font-family:var(--mono);
  letter-spacing:.04em;width:fit-content;
  background:var(--term-bg-go);border:1px solid var(--term-line-go);
  border-radius:999px;padding:2px 10px 2px 8px}
.home:hover{background:var(--term-bg-on);border-color:var(--link)}
.home span{font-size:12px;line-height:1}
.brand{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font-weight:400;letter-spacing:0;text-transform:none;
  color:var(--ink-3);font-size:11.5px;margin-top:2px}
input[type=search]{width:100%;padding:7px 10px;border:1px solid var(--edge);
  border-radius:3px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
input[type=search]:focus,button:focus-visible,.item:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--edge);background:transparent;color:var(--ink-2);
  border-radius:999px;padding:2px 9px;font-size:11.5px;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sortbar{display:flex;gap:10px;font-size:11.5px;color:var(--ink-3);align-items:center}
.sortbar button{background:none;border:none;color:var(--ink-3);cursor:pointer;
  font:inherit;padding:0;border-bottom:1px solid transparent}
.sortbar button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.list{overflow-y:auto;flex:1;min-height:0}
.item{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--edge-soft);border-left:3px solid transparent;
  padding:9px 13px;cursor:pointer;font:inherit;color:inherit}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--bg);border-left-color:var(--ink)}
.item.tA{border-left-color:var(--a)} .item.tB{border-left-color:var(--b)}
.item.tC{border-left-color:var(--c)} .item.tD{border-left-color:var(--d)}
.item.tE{border-left-color:var(--e)} .item.tX{border-left-color:var(--x)}
.item-top{display:flex;justify-content:space-between;gap:8px;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.item-sum{font-size:12.5px;line-height:1.45;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── 우측 본문 ─────────────────────────────── */
.main{overflow-y:auto;min-height:0}
.toolbar{position:sticky;top:0;z-index:5;background:var(--panel);
  border-bottom:1px solid var(--edge);padding:8px 26px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px}
.toolbar .grow{flex:1}
.seg{display:flex;border:1px solid var(--edge);border-radius:3px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 11px;cursor:pointer;
  font:inherit;font-size:12px;color:var(--ink-2);border-right:1px solid var(--edge)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.srcline{padding:10px 26px 0;font-size:11px;color:var(--ink-3);line-height:1.5}

/* ── 연대 바 ───────────────────────────────
   5년 반을 한 줄에 욱여넣으면 1945년 8월 열흘은 0.5% 밖에 안 된다. 그래서
   줄을 늘여 놓고 **띠 자체를 움직인다** — 지금 읽는 문서의 날짜가 늘 정중앙이다.
   문서를 옮기면 띠가 미끄러지고, 사건 이름은 겹치지 않게 위아래로 층을 나눈다. */
.chrono{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
  width:min(940px,calc(100vw - 48px));z-index:20;user-select:none;
  border:1px solid var(--edge);border-radius:8px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 20px rgba(0,0,0,.10);
  transition:box-shadow .2s ease}
.chrono:hover{box-shadow:0 6px 26px rgba(0,0,0,.18)}
/* 옅어지는 것은 **내용**이지 판이 아니다. 판까지 투명해지면 뒤의 본문이
   비쳐 들어와 글자가 서로를 밟는다. */
.chrono-track{opacity:.5;transition:opacity .2s ease}
.chrono:hover .chrono-track{opacity:1}

/* 띠가 지나가는 창. 손으로도 밀 수 있게 진짜 가로 스크롤을 쓴다 */
.chrono-vp{position:relative;overflow-x:auto;overflow-y:hidden;
  height:var(--chH,92px);border-radius:8px;cursor:grab;
  scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain}
.chrono-vp::-webkit-scrollbar{display:none}
.chrono-vp.drag{cursor:grabbing}
/* 안쪽 띠. 양옆 여백은 창의 절반 — 첫 문서도 마지막 문서도 가운데에 설 수 있게 */
.chrono-track{position:relative;height:100%;margin:0 var(--chPad,0px)}
/* 시간 축 — 층의 한가운데 */
.chrono-track::before{content:"";position:absolute;
  left:calc(0px - var(--chPad,0px));right:calc(0px - var(--chPad,0px));
  top:var(--axis,46px);height:1px;background:var(--edge)}

/* 연도 — 해가 바뀌는 자리에 선을 긋고, 그 선부터가 그 해다.
   이름표는 창 왼쪽에 들러붙는다. 1945년 한복판을 보고 있어도 「1945」가 남는다. */
.cy{position:absolute;top:0;bottom:0;
  border-left:1px solid color-mix(in srgb,var(--ink-3) 50%,transparent)}
.cy.alt{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.cy b{position:absolute;bottom:3px;font-family:var(--mono);font-size:11px;
  font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;
  line-height:1;letter-spacing:.06em;white-space:nowrap;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px}
/* 달·분기 눈금 — 해 안에서 어디쯤인지. 분기는 조금 길게 */
.cq{position:absolute;top:calc(var(--axis,46px) - 1.5px);width:1px;height:4px;
  background:var(--edge);opacity:.7}
.cq.q{top:calc(var(--axis,46px) - 2.5px);height:6px;opacity:1}
.cq[hidden]{display:none}

/* 배율 — 5년 반을 한눈에 볼 때와 8월 열흘을 벌려 볼 때가 같을 수 없다 */
.chrono-zoom{position:absolute;right:6px;top:5px;z-index:3;display:flex;gap:3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-zoom,.chrono-zoom:focus-within{opacity:1}
.chrono-zoom button{width:19px;height:19px;padding:0;line-height:1;
  font-family:var(--mono);font-size:12px;color:var(--ink-2);cursor:pointer;
  background:var(--panel);border:1px solid var(--edge);border-radius:3px}
.chrono-zoom button:hover:not(:disabled){color:var(--link);border-color:var(--link)}
.chrono-zoom button:disabled{opacity:.35;cursor:default}
.chrono-scale{position:absolute;right:6px;bottom:3px;z-index:3;
  font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.03em;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-scale{opacity:1}

/* 사건 점 */
.cm{position:absolute;top:calc(var(--axis,46px) - 3px);width:7px;height:7px;
  margin-left:-3.5px;border-radius:50%;background:var(--ink-3);z-index:1;
  border:1.5px solid var(--panel);cursor:help;
  transition:background .15s ease,transform .15s ease}
.cm.key{background:var(--stamp);width:9px;height:9px;margin-left:-4.5px;
  top:calc(var(--axis,46px) - 4px)}
.cm:hover{background:var(--link);transform:scale(1.45)}

/* 사건 이름 — 층(lane)을 나눠 위아래로 흩는다. 여기서 겹침이 풀린다 */
.cl{position:absolute;transform:translateX(-50%);white-space:nowrap;z-index:1;
  font-family:var(--mono);font-size:10px;line-height:1.1;color:var(--ink-2);
  letter-spacing:.01em;padding:1px 4px;border-radius:2px;cursor:help;
  background:color-mix(in srgb,var(--panel) 70%,transparent)}
.cl.key{color:var(--stamp)}
.cl:hover,.cl:focus-visible{color:var(--link);outline:0;
  background:color-mix(in srgb,var(--link) 12%,var(--panel))}
/* 이름에서 축까지 내려/올려 긋는 실 — 어느 점의 이름인지 알아보게 */
.cl::after{content:"";position:absolute;left:50%;width:1px;background:var(--edge)}
.cl.up::after{top:100%;height:var(--leg,0px)}
.cl.dn::after{bottom:100%;height:var(--leg,0px)}

/* 지금 읽는 문서가 놓인 자리. 문서를 고르면 이 표가 창 한가운데로 온다.
   손으로 띠를 밀면 표는 제 날짜에 남는다 — 표는 시간에 박혀 있지 창에 박혀 있지 않다. */
.chrono-cursor{position:absolute;top:0;bottom:0;width:1px;z-index:2;
  background:var(--stamp);pointer-events:none}
/* 가상 요소는 위의 *{box-sizing:border-box}가 닿지 않는다 — 여기서 직접 잡아 주지
   않으면 테두리 2px 만큼 표시가 축 아래·오른쪽으로 밀려 앉는다. */
.chrono-cursor::before{content:"";position:absolute;box-sizing:border-box;
  left:-6px;top:calc(var(--axis,46px) - 6px);width:13px;height:13px;
  border-radius:50%;background:var(--stamp);border:2px solid var(--panel)}
/* 날짜는 맨 아래, 표 바로 밑에 — 위쪽은 사건 이름 층에 내준다 */
.chrono-date{position:absolute;bottom:2px;transform:translateX(-50%);
  font-family:var(--mono);font-size:10px;color:var(--stamp);
  font-variant-numeric:tabular-nums;background:var(--panel);
  padding:0 5px;border-radius:2px;white-space:nowrap;z-index:2}
.chrono[data-nodate="1"] .chrono-cursor,
.chrono[data-nodate="1"] .chrono-date{display:none}

@media(max-width:900px){.chrono{display:none}}
@media(prefers-reduced-motion:reduce){.chrono-track{transition:none}}

/* 아래쪽 여백은 떠 있는 연대 바가 마지막 문단을 덮지 않을 만큼 */
article{max-width:none;padding:26px 26px 190px}
.doc-head{border-bottom:1px solid var(--edge);padding-bottom:14px;margin-bottom:18px}
h1{font-size:19px;margin:0 0 4px;line-height:1.35;text-wrap:balance;font-weight:650}
.docid{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  letter-spacing:.04em;font-variant-numeric:tabular-nums}
.stamp{display:inline-block;border:1.5px solid var(--stamp);color:var(--stamp);
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:1px 6px;
  border-radius:2px;transform:rotate(-1.2deg);margin-left:8px;vertical-align:2px}
.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:3px 20px;margin-top:10px;font-size:12.5px}
.meta div{display:flex;gap:7px}
/* 참석자 명단처럼 긴 값. 좁은 칸에 넣으면 한 글자씩 세로로 눌린다 */
.meta div.wide{grid-column:1/-1}
.meta b{color:var(--ink-3);font-weight:500;min-width:52px;font-size:11.5px}
.meta span{font-family:var(--mono);font-size:12px}
.meta span.txt{font-family:var(--sans);font-size:12.5px}

.points{margin:16px 0;padding:12px 16px;border-left:2px solid var(--edge);
  background:var(--panel);border-radius:0 3px 3px 0}
.points li{margin:3px 0}
.points ul{margin:0;padding-left:18px}

.cols{display:grid;gap:26px}
.cols.two{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.cols.two{grid-template-columns:1fr}}
.pane h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 8px;font-weight:600}
.body{white-space:pre-wrap;word-break:break-word}
/* 번역문에 마크다운이 섞여 들어온다 — 긴 문서는 옮긴 쪽이 소제목과 항목으로
   나눠 두어야 읽힌다. 본문은 pre-wrap 이므로 줄 단위로만 풀어 준다. */
.mdh{display:block;font-weight:700;margin:20px 0 6px;letter-spacing:-.01em}
.mdh.h1{font-size:17px} .mdh.h2{font-size:15.5px}
.mdh.h3,.mdh.h4,.mdh.h5,.mdh.h6{font-size:14px;color:var(--ink-2);
  letter-spacing:.04em}
.mdq{display:block;border-left:2px solid var(--edge);padding-left:13px;
  color:var(--ink-2);margin:6px 0}
.mdli{display:block;padding-left:17px;text-indent:-17px;margin:2px 0}
.mdli::before{content:"· ";color:var(--ink-3)}
.mdli[data-n]::before{content:attr(data-n) " ";color:var(--ink-3);
  font-family:var(--mono);font-size:12px}
.mdhr{border:0;border-top:1px solid var(--edge);margin:18px 0}
.body.en{font-family:var(--mono);font-size:12.5px;line-height:1.65;color:var(--ink-2)}
.body del{color:var(--ink-3)}
.body strong{font-weight:650}

.pagemark{display:block;margin:16px 0 6px;font-family:var(--mono);font-size:10.5px;
  color:var(--ink-3);letter-spacing:.06em;border-top:1px dashed var(--edge);padding-top:5px}
.pagemark.hit{cursor:zoom-in;text-decoration:underline;
  text-decoration-style:dotted;text-underline-offset:3px}
.pagemark.hit:hover{color:var(--link)}
.fnref{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);vertical-align:super}

/* 본문 속 용어 주석.
   앞서 --edge 로 밑줄을 그었더니 배경에 묻혀 아예 보이지 않았다.
   옅은 바탕을 깔아 「여기 무언가 있다」를 먼저 알리고, 점선으로 종류를 나눈다.
   다른 문서로 가는 것(a)과 설명만 뜨는 것(span)을 색으로 구분한다. */
.term{color:inherit;text-decoration:none;cursor:help;
  background:var(--term-bg);border-radius:2px;
  padding:0 2px;margin:0 -1px;
  border-bottom:1px dashed var(--term-line);
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
a.term{cursor:pointer;color:var(--link);
  background:var(--term-bg-go);border-bottom-color:var(--term-line-go)}
.term:hover{background:var(--term-bg-on);border-bottom-style:solid;
  border-bottom-color:var(--link);color:var(--link)}
.term:focus-visible{outline:2px solid var(--link);outline-offset:2px}

.fns{margin-top:24px;padding-top:14px;border-top:1px solid var(--edge-soft);
  font-size:12px;color:var(--ink-3);line-height:1.6}
.fns h2,.scans h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 9px;font-weight:600}
.fns div{margin:4px 0}
.note{margin-top:14px;font-size:12px;color:var(--ink-3);border-left:2px solid var(--edge);
  padding-left:11px}
.empty{padding:60px 26px;color:var(--ink-3)}
.warn{color:var(--stamp)}

/* ── 스캔 원본 ─────────────────────────────── */
.scans{margin-top:24px;padding-top:14px;border-top:1px solid var(--edge-soft)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{border:1px solid var(--edge);background:var(--panel);padding:0;cursor:zoom-in;
  border-radius:2px;overflow:hidden;line-height:0;position:relative}
.thumb:hover{border-color:var(--link)}
.thumb img{width:84px;height:110px;object-fit:cover;object-position:top center;
  display:block;background:var(--edge-soft)}
.thumb b{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.62);color:#fff;
  font-family:var(--mono);font-size:9.5px;font-weight:400;padding:1px 4px;
  letter-spacing:.04em;line-height:1.5}

/* ── 확대 뷰어 ─────────────────────────────── */
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,11,14,.94);
  display:none;flex-direction:column}
.lb[open]{display:flex}
.lb-bar{display:flex;align-items:center;gap:14px;padding:9px 16px;color:#c9d3db;
  font-size:12px;border-bottom:1px solid #2a343d;flex:none}
.lb-bar .grow{flex:1}
.lb-bar button{background:none;border:1px solid #3a464f;color:#c9d3db;
  border-radius:3px;padding:3px 11px;font:inherit;font-size:12px;cursor:pointer}
.lb-bar button:hover:not(:disabled){border-color:#7fb0da;color:#fff}
.lb-bar button:disabled{opacity:.35;cursor:default}
.lb-bar .pg{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lb-stage{flex:1;min-height:0;overflow:auto;display:flex;
  align-items:flex-start;justify-content:center;padding:16px}
.lb-stage img{max-width:100%;height:auto;background:#fff;box-shadow:0 2px 24px rgba(0,0,0,.5)}
.lb-stage.fit img{max-height:calc(100vh - 90px);width:auto}

/* 호버 카드 — 링크 위에 머물면 그 문서가 무엇인지 미리 보여 준다.
   열람기와 같은 토큰(--panel, --edge, --ink…)을 쓰므로 별도 팔레트가 없다.
   토큰을 정의하지 않은 페이지에 얹으려면 그 값들만 채워 주면 된다. */

.hc {
  position: fixed;
  z-index: 60;
  width: min(400px, calc(100vw - 32px));
  background: var(--panel);
  border: 1px solid var(--edge);
  border-radius: 4px;
  box-shadow: 0 6px 28px rgba(16, 26, 38, .16), 0 1px 3px rgba(16, 26, 38, .1);
  padding: 15px 17px 16px;
  font-size: 13.5px;
  line-height: 1.62;
  color: var(--ink-2);
  opacity: 0;
  transform: translateY(3px);
  transition: opacity .13s ease, transform .13s ease;
  pointer-events: none;
}
.hc[data-open] { opacity: 1; transform: none; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .hc {
    box-shadow: 0 6px 30px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
  }
}
:root[data-theme="dark"] .hc {
  box-shadow: 0 6px 30px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
}

.hc-top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: baseline;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 5px;
}
.hc-top .id { white-space: nowrap }

.hc h4 {
  margin: 0 0 7px;
  font-size: 14.5px;
  line-height: 1.42;
  font-weight: 640;
  color: var(--ink);
  text-wrap: balance;
}

/* 발신 → 수신. 문서철마다 있을 수도 없을 수도 있어 비면 통째로 빠진다 */
.hc-route {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  margin: 0 0 8px;
  line-height: 1.5;
}

.hc p.sum {
  margin: 0;
  /* 요약이 길 수 있다. 넘치면 자른다 — 카드는 미리보기지 본문이 아니다 */
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.hc ul {
  margin: 9px 0 0;
  padding-left: 16px;
  color: var(--ink-3);
  font-size: 12.5px;
}
.hc li {
  margin: 2px 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.hc-foot {
  margin-top: 11px;
  padding-top: 9px;
  border-top: 1px solid var(--edge-soft);
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-3);
  display: flex;
  justify-content: space-between;
  gap: 10px;
}
.hc-foot .go { color: var(--link) }

/* 손가락으로 쓰는 기기에는 호버가 없다. 링크는 그대로 동작하므로 카드만 뺀다 */
@media (hover: none) { .hc { display: none } }
@media (prefers-reduced-motion: reduce) {
  .hc { transition: none }
}

소 중임. 한국에 대한 더 이상의 우선순위 명단을 제출하지 말 것.\n\n2. 본부에서는 대외 발표를 계획하고 있지 않으나, 이번 조치와 관련하여 예상되는 질문에 대비한 국무부-육군부 합의 입장은 다음과 같음: \"5월 9일 한국 정부 수립 및 궁극적인 병력 철수를 목표로 하는 총선거 참관과 관련하여 유엔 한국임시위원단(UNTCOK)이 조치를 취함에 따라, 유엔 조치의 결과로 점령군의 향후 지위가 불확실해졌으므로 한국으로의 추가적인 가족 파견을 종료하는 것이 바람직하다고 판단되었다.\"\n\n서명 없음\n\n조치과: 정보참모부(G-2)\n정보배포: 총사령관, 참모장\n\n전쟁부(육군부)로 전문 발송 요망\n\n추가 배포: 정보참모부(G-2), 작전참모부(G-3), 군수참모부(G-4) (48년 3월 19일)\n\n우선순위 발신시간: 182022Z\n메시지 통제 번호(MCN): 72903\n\n문단 51 I 및 60 A에 의거 \"의역 불필요 (4) 육군규정 380-5. 2급 비밀(Top Secret) 문서로 취급할 것. 본 메시지의 축어적 평문을 서신으로 취급 및 전송하는 것은 1946년 3월 6일자 육군규정 380-5, 문단 16-C, 18-E, 53-A, 53-D (1) (2) (3) 및 60-A (1) (2) (3) (4)에 의거하여 육군부로부터 허가되었음.\n\n2급 비밀 5-3 파일 사본 번호 16이 동일 등급으로 제작되었음.", "secondary": "[0003면]\nDECLASSIFIED\nAuthority NND 816527\n\nFAR EAST COMMAND\nGENERAL HEADQUARTERS, U.S. ARMY FORCES, PACIFIC\nADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\n\nINCOMING MESSAGE\n\nTOP SECRET\n\n19 Mar 48\n\nFROM : CSGPO\nTO : CINCFE\nINFO : CO USAFIK\nNR : WX 97877\n\n1. Shipment of dependents to Korea being terminated after 25 Mar sailing. Calls for 9 Apr sailing are being cancelled. Submit no further priority lists for Korea.\n\n2. No public announcement is planned here but following is agreed State-Army position as regards queries anticipated on this action: \"In light of United Nations Temporary Commission on Korea having taken action in regard to observing of a general election on 9 May looking to the formation of a government for Korea and eventual troop withdrawal it has been deemed advisable to terminate further dispatch of dependents to Korea owing to indeterminate future status of occupation forces as a result of UN action.\"\n\nNO SIG\n\nACTION : G-2 INFORMATION: COMMANDER IN CHIEF, CHIEF OF STATE\n\nTO WAR PRO\n\nADDED DIST : G-2, G-3, G-4 (19 Mar 48)\n\nPRIORITY TOO: 182022Z\nMCN: 72903 per para 51 I and 60 A \"Paraphrase not required (4) AR 380-5. Handle as TOP SECRET correspondence. Handling and transmission of literal plain text of this message as correspondence authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) (2) (3), and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946.\n\nTOP SECRET 5-3 FILE COPY NO. 16 of the same classification has been made.", "notes": [], "note": "기계 판독 참고 — TOO '182022'에 Z가 누락됨(182022Z로 수정). OCR의 'CSGPO'는 육군부 참모총장실로 판단됨. 'WAR PRO' 및 'Tonderer'는 문맥상 각각 '전쟁부로 전문 발송' 및 '이관자'로 추정되나 원문 상태 유지.", "warn": false, "pages": ["0003"]}, {"id": "D003", "order": 2, "date": "1948-01-25", "group": "D", "eyebrow": "D003 · D. 장래 정책·철군", "title": "WX 94049에 대한 회신으로 주한미군 철수, 경제 원조, 및 가족 철수에 관한 USAFIK 의견", "badge": "TOP SECRET", "list_right": "0004–0008", "meta": [{"k": "발신", "v": "CG USAFIK", "txt": true}, {"k": "수신", "v": "CINCFE", "txt": true}, {"k": "참조", "v": "COMMANDER IN CHIEF, CHIEF OF STAFF, G-1, G-2, G-4", "txt": true}, {"k": "전문번호", "v": "ZGCG 85"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0004–0008 (5면)"}, {"k": "건명", "v": "Withdrawal from Korea", "txt": true}], "summary": "USAFIK comments on troop withdrawal, economy, and dependents in reply to WX 94049", "points": ["남한만의 단독 선거 실시가 현실화되고 있으며, 선거 후 구성될 정부의 주권과 조직은 미군정의 지원 하에 결정될 것임.", "정치·경제적 안정과 소련권 이탈을 위해 1949년 중반까지 연장되는 경제 원조 프로그램의 승인과 유연한 자금 운용 권한이 필요함.", "유엔 감시 선거 직후 모든 가용 선박을 동원하여 주한미군 가족의 한국 내 반입 중단과 조기 철수를 즉각 시작할 것을 건의함. 주둔 여건 악화 및 철수 전망으로 인해 가족들이 점령군의 작전 역량에 부담이 되고 있음.", "본 전문에 대한 G-3 조치는 별도 의견 대립 없이 종결 처리되었으며, 육군성에 직접 전달된 의견과 동일함을 확인함.", "1948년 1월 G-3(작전참모부) 내부 문서 회람 및 배포 전표.", "작전, 행정, 훈련, 계획, 병력통제 등 각 기능별 담당 장교 명단이 기재됨.", "문서 처리 지시란(승인, 의견, 협조 등)이 포함된 표준 참모부 전표 양식.", "Top Secret 등급 문서의 유통 경로 추적을 위한 목적의 행정 문서."], "primary": "[0004면]\n기밀해제\n권한 NND886527\n\n극동군 총사령부\n부관실\n무선 및 전보 센터\n\n수신 전문\n\n2급 비밀 긴급\n\n1948년 1월 25일\n\n발신: 주한미군 사령관\n수신: 극동군 총사령관\n전문 번호: ZGCG 85\n\n참조: 뮐러 장군과 하지 장군 간 전화 통화. 본 전문은 WX 94049에 대한 답신인 나의 ZGCG 70을 귀하의 정보를 위해 재전송한 것임. 조사 결과 현지 취급 오류로 인해 정보 사본이 귀 사령부로 발송되지 않았음.\n\n= WX 94049 (1월 15일자)에 대해 다음 의견을 제출함.\n\n항목 A 3\n\n합참 지시(JGA) 12: 한국에서 선거 실시 결정일로부터 80일간 유지 가능. (1) 남한 지역 선거는 주한미군 사령관의 조언과 지원을 받는 새로 선출된 의회에 의해 결정될 것이며, 그 정부는 주권을 가질 것으로 예상됨.\n\n13. (2) 정부 각 부처의 구성 형태, 조직 및 책임은 추후 결정될 것으로 가정함.\n\n참조 항목 D: 부록 B 12항에 제시된 일정은 현재 정황상 3월 31일 이후가 될 선거일자에 맞춰 조정되어야 함.\n\n참조 항목 F: 남한에 정치·경제적 안정을 도모하고 남한이 소련 영향권으로 이동하는 움직임을 지연시키기 위해 시간과 자금이 허용하는 한 최대한 강력한 경제를 구축하기 위해, 본 항을 수정하여 1949년 6월 30일까지 연장되는 원조 프로그램을 전제로 이전에 작성·제출된 계획들이 이행 승인 및 인가되도록 허용할 것을 건의함. 우리 측 ZGO 1396, 섹션 2, 8항의 견해를 참조할 것.\n\nARIOA (CAD) 예산에 더해 앞서 언급된 7,500만 달러 무상 원조 프로그램을 포함하면, 정규 프로그램은 가용 시간 내에 달성할 수 있는 모든 경제 재건을 위한 충분한 자금을 제공할 것임.\n\n98727 (계속)\n\n\"의역 불필요. AR 380-5, 51 1항 및 60 a (4)항에 따라 2급 비밀 문서로 취급할 것.\"\n\n2급 비밀\n\n1946년 3월 6일자 AR 380-5, 16-C, 18-E, 53-A, 53-D (1) (2) (3)항 및 60-A (1) (2) (3) (4)항의 규정에 따라, 본 메시지의 축어적 평문을 동일 등급의 서신으로 취급 및 전송하는 것이 육군성에 의해 인가되었음.\n\n접수됨\n1월 00일\n-1-\n사본 *5- Cal Hinder\n사본 10. Cal Paige\n16-50735-1 정부인쇄국\n\n[0005면]\n기밀해제\n권한 NND 886527\n\n2급 비밀 긴급\n\n발신: 주한미군 사령관 전문 번호: ZGCG 85 1948년 1월 25일 계속\n\n...단, 해당 자금이 1948년 12월 31일 이전에 의무 지출이 인가되고 그 이후에도 물자 인도가 계속된다는 조건 하에 달성 가능. 지출의 유연성 및 한 프로젝트에서 다른 프로젝트로 자금을 이전할 수 있는 권한은 가장 경제적인 사용을 위해 필수적임. 현재 워싱턴에 있는 헬믹 준장 (Gardner Helmick, 한국 군정 부장관)은 두 프로그램에 관한 우리의 견해를 충분히 숙지하고 있음.\n\n다음 문제들이 논의되어야 함:\n\n(1) 단기적 비용 절감을 가져오거나 노후·손상된 기계를 대체할 선별적 자본 투자를 허용하도록 F항의 문구 수정이 바람직함.\n\n상기 자금 권고사항에 따라, 재건 물자의 상당 부분이 1948년 12월 31일 이후 도착할 것이며, 그 속도는 점령 기간 중 어느 때보다 높을 것이나, 그때에는 현 군의 감독과 보호는 철수한 상태일 것임.\n\n12 가족의 한국 철수와 관련하여, 유엔 감시 하의 선거가 전 한국 혹은 남한만이라도 실시된 직후에는 가족의 한국 반입을 중단하고 이용 가능한 모든 선복을 활용하여 즉시 반출을 시작해야 한다는 것이 나의 의견임.\n현재 지침에 따라, 군인 가족 숙소에 대한 신규 계약은 체결되지 않고 있으며, 현 계약으로는 극소수만 추가 공급될 것임. 제한된 주택과 우선순위 정책으로 인해 가족이 늦게 도착하는 인원은 전구에서 1년 또는 그 조금 넘게만 근무하게 될 것임. 이곳 부대의 지속적인 병력 감소로 많은 부대가 서류상 지위로 축소되어야 하고, 현재 가족 숙소가 있는 여러 지역에서 병력이 철수함에 따라 가용 부대는 더 줄어들 것임.\n어떤 경우든, 불충분한 전력, 연료, 용수 및 하수 시설, 한국인들이 가족 숙소에 대해 합리적 유지보수를 수행할 능력이나 의지 부족, 낮은 병력 수준 및 이 지역의 심각한 정치적 혼란 가능성 등을 고려할 때, 나는 군인 가족들이 점령군 역량에 불필요한 부담이라고 간주하며,\n\n98727 긴급\n\n\"의역 불필요. AR 380-5, 51 1항 및 60 a (4)항에 따라 2급 비밀 문서로 취급할 것.\"\n-2-\n\n[0006면]\n기밀해제\n권한 NND886527\n\n극동군 총사령부\n부관실\n무선 및 전보 센터\n\n수신 전문\n\n2급 비밀 긴급\n\n발신: 주한미군 사령관 전문 번호: ZGCG 85 1948년 1월 25일 계속\n\n육군부가 사태가 진전되어 우리의 철수가 합리적으로 예견되고 그러한 조치가 과도한 난처함 없이 취해질 수 있는 시점이 되면 즉시 이들을 철수시키는 적극적 조치를 취하기를 희망하는 바임.\n\n하지\n\n액션: G-3 계획\n\n정보: 극동군 총사령관, 참모장, G-1, G-2, G-4\n\n98727 발신시간: 240300 Z\n\n\"의역 불필요. AR 380-5, 51 1항 및 60 a (4)항에 따라 2급 비밀 문서로 취급할 것.\"\n-3-\n\n조치 완료\n일자 1948년 1월 26일. 기록용 메모\n\n1946년 3월 6일자 AR 380-5, 16-C, 18-E, 53-A, 53-D (1) (2) (3)항 및 60-A (1) (2) (3) (4)항의 규정에 따라, 본 메시지의 축어적 평문을 동일 등급의 서신으로 취급 및 전송하는 것이 육군성에 의해 인가되었음.\n\n2급 비밀\n사본 번호. __\n16-50735-1 정부인쇄국\n\n[0007면]\n기밀해제\n권한 NND886527\n\n2급 비밀\n\n1948년 1월 26일\n\n기록용 메모:\n\n제목: 한국으로부터의 철수.\n\n참조: 1월 25일자 ZGCG 85, WX 94049에 대한 하지 장군의 의견을 육군성에 직접 전달한 ZGCG 70의 내용을 전달함.\n\n1. 참조 전문은 참모장이 하지 장군에게 전화로 요청하여 극동군 총사령부로 전달되었음. 참조 전문에 따르면 주한미군 사령부의 현지 취급 오류로 인해 ZGCG 70이 극동군 총사령부로 발송되지 않았음.\n\n2. WX 94049에 대한 극동군 총사령관 의견은 별도 조치를 통해 육군성으로 전달되었음.\n\n3. JGA 12에 동일 주제로 논평되어 있으며, 참조 전문의 내용은 이미 육군성으로 직접 전달되었으므로 추가 조치가 필요치 않음.\n\n4. 참조 전문의 의견이 극동군 총사령관의 의견과 상충되지 않는 한.\n\n5. 권고: 본 기록 메모를 G-3가 확인하고 G-3 행정반이 편철할 것.\n\n6. 완료: 본 조치로 참조 전문(ZGCG 85)에 대한 G-3의 조치를 종결함.\n\n스미스\n조치 담당 장교\n\nG-3 파일\n사본\n\n265950\n\n2급 비밀\n\n[0008면]\n비밀해제\n기관 NND846527\n2급 비밀 (TOP SECRET)\n1948년 1월\n\n작전참모부장\nBG (준장) W H 마리스\n\n작전참모부차장 (G-3)\nCol (대령) E C 버카트\n\n주임장교\nCol (대령) P D 긴더\n\n행정\nLt Col (중령) E 오도노휴\n\nJOBC E L 하세\nLt (중위) H E 암머만\n\n훈련\nCol (대령) C H 코츠\n\n연락장교\nLt Col (중령) R V 스트라우스\nLt Col (중령) W B 제닝스\n\nMaj (소령) E L 앳킨스\n\n병력통제\nCol (대령) E J 버처스\n\n병력기초\nLt Col (중령) E 데이\nLt Col (중령) R P 타르 주니어\n\nMaj (소령) R A 에드워즈\nMaj (소령) 샘 J 브래들리\nCapt (대위) J E 켈러허\n\nLt (중위) H E 마이어스 (TAC)\n\n16 [판독불가] GOT J M 피트먼\n\nMaj (소령) H 매스트로\nMaj (소령) R R 맥도널드\n\nCol (대령) T C 스탠턴\nLt Col (중령) C B 해멀리 주니어\nLt Col (중령) T S 핫츠펠드 주니어\nLt Col (중령) K C 헤이크래프트\nMaj (소령) I 레너드\n\n상황 및 보고\nLt Col (중령) J I 웨스터마이어\nCapt (대위) H G 민치\n\nCol (대령) A M 파슨스\n송환\nLt Col (중령) B I 앤더슨\n\nCapt (대위) M B 영\n\nLt Col (중령) J 빌키 주니어\n계획\nLt Col (중령) B L 페이지\nLt Col (중령) L D 스미스\n\nLt Col (중령) J T L 슈벵크\n\n주임 서기\nCol (대령) J H 헴\n\n간행물\n\n처리 구분 :\n승인\n의견\n협조 필요 조치\n정보 서명\n행정처 반송\n발송\n귀하 보관\n행정처 보관 관계자 주목\n\nN\n22\n23\n2급 비밀\n25", "secondary": "[0004면]\nDECLASSIFIED\nAuthority NND886527 GENERAL HEADQUARTERS, FAR EAST COMMAND\nADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\n\nINCOMING MESSAGE\n\nTOP SECRET PRIORITY\n\n25 Jan 48\n\nFROM: CG USAFIK\nTO: CINCFE\nNR: ZGCG 85 Ref telephone conversation Gen Mueller Gen Hodge, transmitted here for your info is my ZGCG 70 in answer to WX 94049. Investigation shows that through error in local handling info copy was not dispatched to your hq.\n\nRef WX 94049 Jan 15 the fol comments are furnished.\n\nPara A 3 JGA 12 Korea can be held 80 days after the date when decision is made to hold such election. (1) It is anticipated that a zonal election in South Korea will be undetermined by the newly elected assembly advised and assisted by the CG USAFIK and that the government will be sovereign.\n\n13. (2) It is assumed that the form, organization and responsibilities of the various branches of the government will be determined later.\n\nRef para D the time schedule given in para twelve (12) appendix B must be adjusted to the date of election which from present indications will be subsequent to Mar 31.\n\nRef para F in order to establish in South Korea as strong an economy as time and funds permit in order to foster political and economic stability and to retard any movement of South Korea into the Soviet sphere of influence it is recommended that this para be reworded to permit plans previously drawn and submitted predicated on a program of aid extending to 30 Jun 49 to be approved and authorized for implementation. Note views expressed in para 8 Sec 2 ourrad ZGO 1396.\n\nThe ARIOA (CAD) budget supplemented by the 75 million grant in aid program of aid above referred to includes the regular program will provide ample funds for all economic rehabilitation 98727 (over)\n\n\"Paraphrase not required. Handle as TOP SECRET correspondence per para 51 1 and 60 a (4) AR 380-5.\"\n\nTOP SECRET\n\nHandling and transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) (2) (3), and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946.\n\nRECEIVED\n5 JAN 00 -1Cy *5- Cal Hinder Cy lo. Cal Paige 16-50735-1 GPO\n\n[0005면]\nDECLASSIFIED\nAuthority NND 886527\n\nTOP SECRET PRIORITY\n\nFROM: CG USAFIK NR: ZGCG 85 25 JAN 48 CONTINUED that can be achieved in the time available providing such funds are auth to be obligated prior to Dec 31, 48 and deliveries continued after that date. Flexibility in expenditures and authority to transfer funds from 1 project to another is essential to permit most economical use. Brig Gen Gardner Helmick Deputy Military Governor Korea now in Washington is thoroughly conversant our views concerning both programs.\n\nThe fol problems should be discussed:\n\n(1) The desirability of rewording para F to permit selected capital investments that will effect short run savings or replace obsolescent or damaged machinery.\n\nUnder above recommendations regarding funds a large part of rehabilitation materials will arrive after 31 Dec 1948 at a rate exceeding arrivals during any period of the occupation and that present military supervision and protection will have withdrawn.\n\n12 With ref to removal of dependents from Korea, It is my opinion that immediately after a UN observed election is held, either in all Korea or only in South Korea, movement of dependents into Korea should cease and movement out begun promptly, utilizing all available shipping space. Under current directives, no new contracts for dependent housing are being let, and present contracts will supply only a few more units. The limited housing available and policy on priorities will operate so that those whose dependents arrive late will have only a year or a little over to serve in the theater. With constantly lowering strength of units here, requiring reduction of many units to paper status and withdrawal of troops from several areas where there are now dependent houses, units available will be further reduced. In any case, with inadequate power, fuel, water and sewage facilities the lack of ability or any great desire on the part of the Koreans to perform reasonable maintenance on dependent housing, combined with low troop strength and probability of serious political turmoil in the area, I consider dependents to be an unnecessary burden on the capabilities of the occupation force, and hope that 98727 PRIORITY \"Paraphrase not required. Handle as TOP SECRET correspondence per para 51 1 and 60 a (4) AR 380-5.\" -2-\n\n[0006면]\nDECLASSIFIED\nAuthority NND886527 GENERAL HEADQUARTERS, FAR EAST COMMAND\nADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\n\nINCOMING MESSAGE\n\nTOP SECRET PRIORITY\n\nFROM: CG USAFIK NR: ZGCG 85 25 JAN 48 CONTINUED the Dept of the Army will take positive action to remove them as soon as the situation develops to the point where our withdrawal is reasonably foreseen and such action can be taken without too much embarrassment.\n\nHODGE\n\nACTION: G-3 Plans INFORMATION: COMMANDER IN CHIEF, CHIEF OF STAFF, G-1, G-2, G-4 98727 TOO: 240300 Z \"Paraphrase not required. Handle as TOP SECRET correspondence per para 51 1 and 60 a (4) AR 380-5.\" -3-\n\nACTION COMPLETED\nDATE 26 Jan 48. Memo for Record Handling and transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) (2) (3), and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946.\n\nTOP SECRET\nCOPY No. __ 16-50735-1 GPO\n\n[0007면]\nDECLASSIFIED\nAuthority NND886527\n\nTOP SECRET\n\n26 January 1948 MEMO for RECORD:\n\nSUBJECT: Withdrawal from Korea.\n\nBASIC: ZGCG 85 of 25 Jan which forwards contents of ZGCG 70 which in turn forwarded directly to D/A Gen Hodge's comments on WARX 94049.\n\n1. Basic was forwarded to CINCFE in answer to telephone request from C/S to Gen Hodge. Basic states that through error in local handling in Hq, USAFIK ZGCG 70 was not dispatched to CINCFE.\n\n2. CINCFE comments on WARX 94049 have been forwarded to D/A by separate action.\n\n3. JGA 12 comments on same subject and inasmuch as contents of basic have already been forwarded directly to D/A no other action is required.\n\n4. Inasmuch as comments in basic are not in conflict with CINCFE\n\n5. RECOMMEND: This M/R be noted by G-3 and filed by G-3 Adm.\n\n6. COMPLETION: This completes G-3 action on basic (ZGCG 85).\n\nSMITH\nAction Officer\n\nG-3 FILE\nCOPY\n\n265950\n\nTOP SECRET\n\n[0008면]\nDECLASSIFIED\nAuthority NND846527\nTOP SECRET\nJanuary 1948 ASST CHIEF OF STAFF, OPERATIONS BG W H Maris DEPUTY AC/S, G-3 Operations Col E C Burkart\n\nEXECUTIVE\nCol P D Ginder\n\nADMINISTRATION\nLt Col E O'Donohue JOBC E L Haase Lt H E Ammerman\n\nTRAINING\nCol C H Coates LO Lt Col R V Strauss Lt Col W B Jennings Maj E L Atkins\n\nTROOP CONTROL\nCol E J Butchers Troop Basis Lt Col E Day Lt Col R P Tarr Jr Maj R A Edwards Maj Sam J Bradley Capt J E Kelleher Lt H E Meyers (TAC)\n\n16 [illegible] GOT JM Pittman Maj H Mastro Maj R R McDonald Col T C Stanton Lt Col C B Hammerle Jr Lt Col T S Hatzfeld Jr Lt Col K C Haycraft Maj I Leonard Situation and Reports Lt Col J I Westermeier Capt H G Minch Col A M Parsons Repatriation Lt Col B I Anderson Capt M B Young Lt Col J Bealke Jr\nPLANS\nLt Col B L Paige Lt Col L D Smith Lt Col J T L Schwenk\n\nCHIEF CLERK\nCol J H Hem\n\nPUBLICATIONS\n\nFOR :\nApproval Comment Concur Nec Action Info Signature Ret to Adm Dispatch Your File File Adm Person Concerned N 22 23\nTOP SECRET\n25", "notes": [], "note": "기계 판독 참고 — The cover memo on page 0007 summarises the action taken on the cable, noting the original message ZGCG 70 was not dispatched to CINCFE due to a handlin  [], "note": "기계 판독 참고 — This page appears to be primarily a cover/routing slip for a message about ship movements, not the substantive message itself. Recipient 'CG RYUKOM' is likely CG, Ryukyu Command. The OCR text at the bottom resembles a teletype routing block rather than continuous message content.", "warn": false, "pages": ["0009"]}, {"id": "D005", "order": 4, "date": "1948-01-25", "group": "X", "eyebrow": "D005", "title": "소련이 유엔 위원단의 북한 진입을 거부할 경우 남한 단독 선거에 관한 일방적 발표를 승인", "badge": "TOP SECRET", "list_right": "0010–0010", "meta": [{"k": "발신", "v": "OSGPO (Department of the Army)", "txt": true}, {"k": "수신", "v": "CG USAFIK", "txt": true}, {"k": "참조", "v": "CINCFE", "txt": true}, {"k": "전문번호", "v": "WX 94669"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0010–0010 (1면)"}, {"k": "건명", "v": null, "txt": true}], "summary": "Authorizing unilateral announcement on South Korea elections if UN Commission blocked by Soviets", "points": ["소련이 유엔 위원단의 북한 진입을 거부할 경우 국무부는 남한 단독 선거 참관을 임시위원회에서 지지할 방침을 밝힘.", "UN 위원단의 결정으로 남한 내 소요가 악화되면 CG USAFIK이 남한 단독 선거 지시를 요청하겠다는 미국의 의사를 발표할 권한을 승인함.", "UN 위원단의 결정 전까지는 점령 지역에서 일방적 선거 진행 의도로 비춰질 어떠한 조치도 금지됨.", "임시위원회로의 회부가 선거 실시를 더 지연시키는 구실이 되어서는 안 된다는 점을 명시함."], "primary": "[0010면]\n비밀해제\n해제권한 NND 846527\n\n극동사령부 본부, 부관감실\n무선통신센터\n\n수신 전문\n\n2급 비밀 (TOP SECRET)\n\n우선 (PRIORITY)\n\n3급 비밀 (SECRET) 48년 1월 25일\n\n발신: OSGPO (육군부)\n\n수신: CG USAFIK (주한미군사령관)\n\n통보: CINCFE (극동군총사령관)\n\n전문번호: WX 94669\n\n1. 소련이 유엔 위원단의 북한 진입을 거부한 결과 위원단이 한국 문제를 임시위원회로 회부하기로 결정할 경우, 국무부는 위원단이 남한에서만 선거를 참관하도록 하는 내용의 즉각적인 조치를 임시위원회에서 지지할 것을 제안함.\n\n2. 만약 그러한 위원단의 결정으로 인해 남한 주민들 사이의 소요가 악화될 경우, 귀관은 임시위원회에 유엔 위원단이 남한에서만 선거를 참관하도록 지시해 줄 것을 요청하겠다는 미국의 의사를 발표할 권한을 가짐.\n\n3. 그러한 조치의 결과가 나오기 전까지는, 위원단의 뜻을 참작하지 않고 미국 점령지역에서 일방적으로 선거를 진행할 의도로 해석될 수 있는 어떠한 조치도 현지에서 취해서는 안 됨. 귀관의 비밀 정보를 위해 알리는데, 임시위원회로의 회부가 선거 실시를 더 지연시키는 구실이 되어서는 안 될 것임. 국무부도 이 전문에 동의함.\n\n서명 없음\n\n정보 배포: 총사령관, 참모장, G-2, G-3, 외교참모\n\n98829 우선 (PRIORITY) 발신시간: 242352 Z\n통제번호: 69702\n\n2급 비밀 (TOP SECRET)\n2급 비밀 문서로 취급할 것\n육군규정 AR 380-5, 5항 및 9항에 따름. 의역 불필요.\n\n본 전문의 평문 그대로의 동급 문서로서의 취급 및 전송은 1946년 3월 6일자 육군규정 AR 380-5, 16-C, 18-E, 53-A, 53-D (1) (2) (3), 60-A (1) (2) (3) (4)항의 규정에 의거하여 전쟁부의 승인을 받았음.\n\n16-50735-1 GPO\n\n배포담당 칼 린더\n배포담당 칼 페이지\n사본 제11호", "secondary": "[0010면]\nDECLASSIFIED\nAuthority NND 846527 HEADQUARTERS, FAR EAST COMMAND ADJUTANT GENERAL'S OFFICE\nRADIO AND CABLE CENTER\n\nINCOMING MESSAGE\n\nTOP SECRET\n\nPRIORITY\n\nSecret 25 Jan 48\n\nFROM: OSGPO\n\nTO: CG USAFIK\n\nINFO: CINCFE\n\nNR: WX 94669\n\n1. In the event Soviet refusal to permit UN Commission enter North Korea results in decision by the Commission to refer Korean problem back to the Interim Committee Department of State proposes support immediate action in the Interim Committee favoring observance by the Commission of elections in South Korea alone.\n\n2. Should such Commission decision result in aggravating unrest among South Korean people you are authorized to announce the United States intention of requesting the Interim Committee to instruct the UN Commission to observe elections in South Korea alone.\n\n3. Pending outcome of such action, no steps should be taken at this time in the field which might be construed as indicative of an intention to proceed with elections in US Zone unilaterally and without reference to wishes of the Commission. For your confidential information, it is not intended that reference to Interim Committee will be excuse for further delay in holding elections. State concurs this message.\n\nNO SIG\n\nINFORMATION: COMMANDER IN CHIEF, CHIEF OF STAFF, G-2, G-3, DIPLOMATIC 98829 PRIORITY TOO: 242352 Z\nMCN: 69702 Top secret Handle as TOP SECRET correspondence per paragraphs 5 and 9, AR 380-5. Paraphrase not required.\n\nHandling and transmission of literal plain text of this message as correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) (2) (3), and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946.\n\n16-50735-1 GPO Cut 9-Cal Linder Cut 10-Cal Paige COPY No. 11", "notes": [], "note": "기계 판독 참고 — Original telegram message form with classification and distribution marks. OCR clearly interprets paragraph numbering, though some line breaks appear mid-sentence due to the teletype format. The message lacks a formal signature block, marked 'NO SIG'.", "warn": false, "pages": ["0010"]}, {"id": "D006", "order": 5, "date": "1947-10-29", "group": "D", "eyebrow": "D006 · D. 장래 정책·철군", "title": "한국 문제가 유엔에 계류 중인 상황에서 남한 군대 창설이 부적절하다는 점에 동의하며, 인력 및 물자 소요에 관한 상세 견해 요청", "badge": "SECRET", "list_right": "0011–0012", "meta": [{"k": "발신", "v": "WAR (CSGPO)", "txt": true}, {"k": "수신", "v": "CINCFE (PASS FOR INFO TO CG USAFIK)", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": "89253"}, {"k": "종류", "v": "cable"}, {"k": "면", "v": "0011–0012 (2면)"}, {"k": "건명", "v": "Withdrawal from Korea", "txt": true}], "summary": "Inadvisability of establishing South Korean armed forces while Korea is before UN; request for detailed views on personnel and materiel requirements", "points": ["미국 전쟁부는 한국 문제가 유엔에 계류 중인 가운데 남한 군대를 창설하는 것이 시기상 부적절하다는 CINCFE의 견해에 동의한다.", "그러나 향후 소련의 비협조로 인한 독립 남한 정부 수립 및 미군 철수 시나리오에 대비해, 남한 군대 창설에 필요한 인력·물자 소요에 대한 상세한 검토가 필요하다.", "전쟁부는 한국 경비대에 미군 장비를 지급할 권한을 하지 장군에게 부여하는 것을 승인하며, 관련된 본토로부터의 지원 소요를 조속히 파악할 것을 CINCFE에 요청한다."], "primary": "[0011면]\n비밀해제\n해제권한 NND886527\n주한미군사령부(USA Forces) 극동군사령부 인사참모부(AG) 전파통신센터\n수신전문\n사본\n비밀(ROUTINE) 1947년 10월 29일\n발신: 전쟁부(CSGPO) 비밀\n수신: 극동군총사령관(CINCFE, 주한미군사령관에게 정보용 전달)\n문서번호: 89253\n\n참조: CX 56266, 1947년 10월 22일; WARX 92187, 1946년 1월 9일; CAX 57249, 1946년 1월 27일. 한국 문제가 국제연합(UN)에 계류 중인 상황에서 남한 군대를 창설하는 것이 부적절하다는 귀측 의견에 여기서도 동의한다.\n\nSWNCC 176/30의 4항 K 및 5항 F에서 지적된 바와 같이, 총회(General Assembly)가 미국이 만족할 만한 해결책에 도달하더라도 소련이 이 결정을 수락하지 않을 가능성이 있다. 그럴 경우 미국이 독립적인 남한 정부를 수립하고 한국으로부터 미군을 철수하는 것이 필요하거나 바람직해질 수 있다. 정치적 고려 사항에 따라 그러한 상황에서는 미군 철수 이전에 미국이 남한 군대를 창설하는 방안을 검토해야 할 수도 있다. SANACC 극동소위원회가 SWNCC 176/30 제5항 F에 권고된 연구를 준비하는 데 도움을 주기 위해, CX 56266에서 하지(Hodge) 장군이 권고한 바와 같은 군대 창설에 수반될 인력, 물자 및 기타 소요 사항에 대한 보다 상세한 견해를 요청한다.\n\n제2항. SWNCC 232/1(JCS 1483/20)에 포함되어 WARX 92187로 송부된 승인 권한을 고려할 때, 귀측이 하지 장군에게 한국 경비대(Korean Constabulary)에 미군 장비를 지급할 수 있도록 그가 요청한 권한을 부여하는 것에 대해 이의가 없다고 본다. 귀측의 CAX 57249에서 언급된 바와 같이, WARX 92187에서 언급된 한국 민간 경찰대(Korean Civil Police Force)는 당시 정규 경찰, 경비대 및 해안 경비대로 구성되는 것으로 간주되었다.\n\n[0012면]\n비밀해제\n해제권한 NND886527\n사본\n비밀\n전쟁부 전문 번호 W 89253, 1947년 10월 29일자 (계속):\n\n이와 관련하여 귀측이 취한 조치 및 본토(ZI)로부터의 장비 또는 정비 소요 사항이 무엇인지 조기에 답변 바란다.\n\n처리부서: G-3(작전참모)\n정보배포: 총사령관, 참모장, G-1(인사참모), G-2(정보참모), G-4(군수참모)\n\n주: 본 전문은 주한미군사령관(CG USAFIK)에게 정보용으로 재발송하기 위해 통신소(Signal Center)로 전달되었다.\n\n주: 교정된 사본 AG R/C 292130 I에서 접수됨.\n\n290125 Z\n\n\"전문은 발송 전에 의역이 필요하지 않았다. 동일 등급의 분류된 문서에 대한 취급 및 전송은 1946년 3월 6일자 AR 380-5, 16-C, 18-E, 53-A, 53-D (1) (2) (3) 및 60-A (1) (2) (3) (4)항의 규정에 따라 전쟁부에 의해 승인되었다.\"\n비밀\n\n-2-\n\n미 육군 수석영장 H. F. 저드슨(H. F. Judson, Sr. CWO USA)\n사본 번호 7\n\n빈 부서 표기", "secondary": "[0011면]\nDECLASSIFIED\nAuthority NND886527 GENERAL HEADQUARTERS, U. S. ARMY FORCES, ADJUTANT GENERAL'S OFFICE FAR EAST COMMAND AG RADIO AND CABLE CENTER\nINCOMING MESSAGE\nCOPY\nSECRET ROUTINE 29 Oct 47\nFROM: WAR (CSGPO) SECRET\nTO: CINCFE (PASS FOR INFO TO CG USAFIK)\nNR: 89253 Reference CX 56266, 22 Oct 47; WARX 92187, 9 Jan 46; and CAX 57249, 27 Jan 46. Your comment regarding the inadvisability of establishing South Korean armed forces while the Korean problem is before the United Nations is concurred in here.\n\nAs pointed out in paragraphs 4 K and 5 F of SWNCC 176/30, there is a possibility that even though the General Assembly may reach a solution satisfactory to the United States, the Soviet Union may refuse to accept this decision. It might then become necessary or desirable for the United States to establish an independent South Korean government and to withdraw United States forces from Korea. Political considerations may require that under such circumstances consideration be given to the US establishing South Korean armed forces prior to withdrawal of United States forces. In order to assist the Far East Subcommittee of SANACC in its preparation of the study recommended in Par 5 F of SWNCC 176/30, more detailed views are requested as to the personnel, materiel and other requirements which would be involved in establishing an army such as recommended by General Hodge in CX 56266.\n\nPara 2. No objection is perceived to your granting General Hodge the authority requested by him to issue United States equipment to the Korean Constabulary, in view of authorization contained in SWNCC 232/1 (JCS 1483/20), transmitted as WARX 92187. As indicated in your CAX 57249, Korean Civil Police Force, referred to in WARX 92187, was at that time considered to consist of regular police, constabulary and Coast Guard.\n\n[0012면]\nDECLASSIFIED\nAuthority NND886527\nCOPY\nSECRET\nWAR MSG NBR W 89253 DTD 29 OCT 47 CONTINUED:\n\nRequest information as to action taken by you in this regard and early advice as to what requirements for equipment or maintenance from ZI may be involved.\n\nACTION: G-3 INFORMATION: COMMANDER IN CHIEF, CHIEF OF STAFF, G-1, G-2, G-4 NOTE: This message has been passed to Signal Center for redispatch to CG USAFIK for Info.\n\nNOTE: Corrected copy received in AG R/C 292130 I.\n\n290125 Z \"Paraphrase not required prior to transmission. Handling and transmission of classified correspondence of the same classification has been authorized by the War Department in accordance with the provisions of paragraphs 16-C, 18-E, 53-A, 53-D (1) (2) (3), and 60-A (1) (2) (3) (4), AR 380-5, 6 March 1946.\"\nSECRET\n\n-2H. F. Judson Sr. CWO USA\nCOPY NO. 7\n\nPorted Empty", "notes": [], "note": "기계 판독 참고 — 원문 OCR에서 날짜 오류(WARX 92187의 날짜를 1946년 1월 9일로 인식한 것으로 보이나, 실제 경찰력 관련 언급 내용과 맥락상 '46년 1월'은 원문의 오기 가능성이 있음. 문맥상 '47년' 관련 문건으로 해석)가 있으나, 원본을 그대로 복원 표기했다. 'Ported Empty' 부분은 원문 훼손으로 인한 공란으로 추정되어 그대로 표기했다.", "warn": false, "pages": ["0011", "0012"]}, {"id": "D007", "order": 6, "date": "1947-12-05", "group": "B", "eyebrow": "D007 · B. 한국군 창설·훈련", "title": "G-3, 남한군 창설 요구사항에 관한 육군부 앞 공문 송부 승인 요청 및 실현 가능성 논평 첨부", "badge": "TOP SECRET", "list_right": "0013–0022", "meta": [{"k": "발신", "v": "G-3", "txt": true}, {"k": "수신", "v": "C/S", "txt": true}, {"k": "참조", "v": null, "txt": true}, {"k": "전문번호", "v": null}, {"k": "종류", "v": "memorandum"}, {"k": "면", "v": "0013–0022 (10면)"}, {"k": "건명", "v": "Establishment of a South Korean Army", "txt": true}], "summary": "G-3 Check Sheet forwarding for approval a letter to Dept of Army on South Korean Army requirements, with comments on feasibility", "points": ["육군부가 요청한 남한군 창설 소요자료를 Hodge 장군의 계획에 기초하여 공한으로 송부하기 위해 참모총장 승인을 요청한다.", "G-3는 동 계획이 지나치게 낙관적이며, XXIV 군단의 현재 병력 및 능력으로는 Hodge 장군의 동원·훈련 계획을 수행하는 것이 사실상 불가능하다고 판단한다.", "11월 12일 참모회의 지시에 따라 원칙적 논평은 배제되었으나, CINCFE가 실행 불가능성을 직접 언급하는 추가 논평을 권고한다.", "현재 개념에 반대하는 정책적 반대 논거를 G-3가 준비 중이며, 향후 지시에 따라 무전 회신이나 공한에 포함시킬 예정이다.", "극동군사령부는 1947년 12월 4일, 호지 중장의 권고에 따른 남조선군(6개 사단, 10만 명 규모) 창설 소요를 미 육군부에 송부했다.", "제안된 조직의 동원 및 훈련에는 가용 병력 이상의 자원이 필요하며, 미 본토에서 차출된 600명의 전문가로 구성된 자문단의 증강이 필수적이다.", "극동군사령관은 원칙적 사안에 대한 찬반 권고 없이 현실적 문제만 기술하도록 지시했으며, 이에 따라 송부 공문에서도 정책적 권고가 배제되었다.", "주한미군사령부가 제출한 계획은 초기에 미비하여 G-3, G-4에서 편성, 훈련, 군수 분야에 걸쳐 상세 연구 및 수정을 거쳤다.", "1947년 11월 10일자 OX 56612호로 CG USAFIK에게 특정 제한 범위 내에서 장비 지급을 승인하여 한국 경비대 창설 관련 조치가 완료됨.", "이 문건은 기본 계획 제2부(경비대에 대한 미군 장비 지급)에 관한 G-3의 최종 행정 조치 및 종결을 기록한 메모임.", "별첨된 G-3 문서 전달 전표(1947년 10월 15일자)는 해당 건의 부서 간 검토 및 승인 경로를 보여줌."], "primary": "[0013면]\n기밀해제\n권한 NND8X6527\n2급비밀(TOP SECRET)\n극동사령부\n점검표\n(첨부 서류에서 분리하지 말 것)\n문서번호: AG 091.1(4 Dec 47)C-제목: 남한군 창설\n주기 번호. 발신: G-3 수신: C/S 일자: 1947년 12월 5일\n\n1. 본부 무전 CX 56266/10월 22일자(육군부에 인용됨)로 인용된 Hodge 장군의 ZGCT 1293/10월 22일에 의거, 그가 제안한 남한군 창설을 위한 세부 소요자료를 P&O 국장에게 송부하는 공한을 C/S 승인 후 G-3로 반송하여 발송토록 여기 첨부합니다.\n\n2. 이 정보는 육군부 무전 W 89253/10월 29일(기본)에 의해 요청된 바입니다. 11월 12일 참모회의에서의 귀관 지시에 따라, 원칙적인 문제에 대한 논평이나 권고는 포함되지 않았습니다. 그러나 \"동원 및 훈련\" 소요의 기초가 된 가정사항을 공한에서 언급해야 할 것으로 사료되며, 이는 동 가정사항들이 FEC가 XXIV 군단의 정편(定編) 유지 및 본국(ZI)의 고문 특수병 추가 지원 없이는 Hodge 장군의 계획을 수행할 수 없음을 시사하기 때문입니다.\n\n3. 동 소요는 전적으로 Hodge 장군의 계획에 기초하고 있음에 유의하시기 바랍니다. \"군수 소요\"에 관한 첨부서류는 제안된 부대의 실제 소요와 이들 소요의 부분적 충족을 위한 XXIV 군단의 역량을 제시합니다. FEC G-4가 작성한 서문에서는 FEC의 역량을 명시하기 전에 육군부로부터 추가 가정사항을 확보해야 한다고 지적하고 있습니다.\n\n4. 첨부된 조치의 최초 제출 이후에 도착한 WAR 91520/12월 4일은 여기 제출된 자료를 변경하지 않습니다. 본건에 첨부된 기본 정보는 (어떤 경우에도 필요할 것이므로) 가능한 한 조속히 육군부로 송부해야 할 것으로 사료됩니다. 승인을 위해 동봉된 공한은 동원 및 훈련 소요의 기초가 된 가정사항을 언급하는 것 외에 Hodge 장군 계획의 실행 가능성에 대한 CINCFE의 판단에 관해 어떠한 논평도 하지 않습니다. 그러나 여기에 제시된 훈련 계획은 다가오는 중요한 몇 달 동안 XXIV 군단 자체의 훈련 수준을 유지하는 데 겪을 어려움을 고려할 때 극히 낙관적이며, Hodge 장군이 제안한 프로그램 달성의 사실상의 불가능성을 지적하는 추가 논평을 CINCFE가 하는 것이 좋을 것으로 생각됩니다. 그러나 육군부도 훈련 프로그램 연구를 통해 거의 동일한 결론을 도출할 수 있을 것입니다. 그러한 논평은 수정된 공한에 포함시키거나 WAR 91520/12월 4일에 대한 중간 무전 회신에 포함시킬 수 있습니다.\n\n5. 현재 논의 중인 개념에 반대하여 정책적 차원에서 제시될 수 있는 강력한 논거들이 있습니다. G-3는 그러한 논거들을\n\n[0014면]\n2급비밀(TOP SECRET)\n극동사령부\n점검표\n(첨부 서류에서 분리하지 말 것)\n문서번호: AG 091.1(4 Dec 47)GC-제목: 남한군 창설\n주기 No. 발신: G-3 수신: C/S 일자: 1947년 12월 5일\n(계속) WAR 91520에 대한 무전 회신 또는 지시가 있을 경우 공한에 포함시키기 위해 공식화할 준비가 되어 있습니다. 한편, C/S 지침의 수정이 있을 때까지는, 추후 있을 수 있는 정책 논거 제시에 지장을 주지 않도록 모든 조치가 표현될 것입니다.\n\n첨부 1건:\n첨부 및 관련 문서와 함께 CSGPO 앞 발송 예정 공한(안)\n\n[0015면]\n기밀해제\n권한 NND8X6527\nAG 091.1(4 Dec 47)GC-제목: 남한군 창설\nG-3, AG 1947년 12월 6일\n\n상기 제목에 관한 공한이 첨부 3건과 함께 단일 폴더로 제본되어 서명 및 육군부 기획작전국장 앞 발송을 위해 여기 송부됩니다. 기본 사본에 G-3 승인이 기재되었습니다.\n\n첨부 1건: 원본 및 사본 4부\n첨부 서류 포함 CSGPO 앞 서한\n\n[0016면]\n기밀해제\n권한 NND8X6527\n2급비밀(TOP SECRET)\n극동사령부\nAPO 500\n\n1947년 12월 5일\n\nAG 091.1 (4 Dec 47)GC-P\n제목: 남한군 창설 소요.\n수신: 워싱턴 25, D.C., 육군부, 참모본부, 기획작전국장\n\n1. 1947년 10월 29일자 육군부 무전 W 89253의 제I부에 포함된 요청에 따라, 주한미군사령관이 1947년 10월 22일자 극동사령부 무전 CX 56266으로 육군부에 송부한 통신문에서 권고한 바와 같은 남한군 창설을 위한 소요자료를 여기 첨부합니다.\n\n2. 동원 및 훈련 계획(첨부 2)은 제안된 남한군이 18개월 이내에 6개 사단의 유효 전력으로 창설될 수 있다는 Hodge 장군의 추정에 기초하고 있음에 주의를 환기합니다. 이는 실행 불가능한 것으로 보이는 목표입니다. 제시된 시간 제한 내에 2차 증원분을 동원하거나, 상정된 장애요소(첨부 2, 부록 B)로 볼 때 만족스러운 훈련 수준에 도달하는 것은 실현 가능하다고 믿지 않습니다. 11월 7일자 육군부 무전 WARX 81946의 결과로 부과된 병력 수준 하에서, 증강된 경비대 이상의 어떤 것도 동원하고 훈련시키는 것은 XXIV 군단의 역량을 완전히 벗어날 것입니다. XXIV 군단은 자체 특수병 훈련조차 할 수 없을 것이며, 동원 및 훈련 계획에서 상정하는 교관 및 감독 요원을 제공할 가시적인 능력이 없을 것입니다.\n\n3. 12월 3일자 육군부 무전 WAR 91520은 첨부된 소요 명세서가 작성된 후 본 사령부에 접수되었습니다. 명시된 추가 가정사항에 기초하여, 군수 역량과 제안된 고문단의 구성 및 기능에 관한 보다 상세한 논평을 작성하기 위한 추가 조치가 시작되었습니다. 육군부 무전 WAR 91520에 명시된 가정사항들은 첨부 3에 명시된 정보 소요에 대한 부분적인 답변만을 제공할 뿐임이 주목될 것입니다.\n\n총사령관을 대신하여:\n\n첨부 3건:\n첨부 1 - 동원 및 훈련\n첨부 2 - [판독불가]\n첨부 3 - 군수 소요\n\n2급비밀(TOP SECRET)\n\n[0017면]\n기밀해제\n권한 NND886527\n일급비밀(TOP SECRET)\n\n극동사령부(GHQ/FEC)\nAPO 500\n\nAG 091.1 (47.12.4) 00-P\n\n제목: 남조선군 창설 소요\n\n수신: 워싱턴 25, D.C. 육군부 일반참모부 기획운영국장\n\n1. 1947년 10월 29일자 육군부 무선전보 W 89253호 제1부에 포함된 요청에 따라, 미 극동군사령부 무선전보 CX 56266호(1947년 10월 22일)를 통해 육군부로 송부된 주한미군사령관의 통신에서 권고된 바와 같은 남조선군 창설 소요를 이에 송부합니다.\n\n2. 제안된 조직의 동원 및 훈련은 제24군단(XXIV Corps)의 가용 능력을 초과할 것이라는 점에 주의를 환기합니다. 단, 제24군단이 승인된 정원을 유지하고 미 본토(Zone of the Interior)로부터의 600명 전문가로 구성된 \"자문단(Advisory Group)\"으로 증강될 경우는 예외입니다(부록 A, 첨부문서 2). 육군부로부터의 추가 정보가 확보되기 전까지(극동사령부 능력 이상의) 구체적 군수 소요를 수립할 수 없다는 점에도 주의를 환기합니다(첨부문서 3).\n\n최고사령관을 대신하여:\n\n첨부 3건:\n첨부 1 - 편성 및 장비\n첨부 2 - 동원 및 훈련\n첨부 3 - 군수 소요\n\n승인됨:\n\n일급비밀(TOP SECRET)\n\n[0018면]\n기밀해제\n권한 NND8X6527\n일급비밀(TOP SECRET)\n\nAG 091.1(47.12.4) 00-2\n\n남조선군 창설\n인사참모부/참모장(G-3 C/S) 1947년 12월 4일\n\n호지 중장이 극동사령부 무선전보 CX 56266호(10월 22일)에서 제안한 대로 남조선군 창설을 위한 세부 소요를 송부하는 기획운영국장 앞 전달 공문을 승인 및 G-3로 반송하기 위해 이에 첨부합니다.\n\n본 정보는 육군부 무선전보 W 89253호(10월 29일, 기초문서)에 의해 요청되었습니다. 귀관의 지시(11월 12일 참모회의)에 따라, 원칙적 사안에 대한 어떠한 논평이나 권고도 포함되지 않았습니다. 오늘 승인을 받을 수 있다면, 본 보고서는 햄(Ham) 대령이 워싱턴으로 휴대할 수 있습니다.\n\n참고를 위해 G-3 기록용 회람 및 관련 참조문서를 첨부합니다.\n\n첨부 2건:\n송부 공문(안), 첨부문서 및 관련 서류 포함.\n\n배포 완료.\n\nTS- 36-5\n일급비밀(TOP SECRET)\n\n[0019면]\n기밀해제\n권한 NND8X6527\n일급비밀(TOP SECRET)\n\n극동사령부(GHQ/FEC)\nAPO 500\n1947년 12월 4일\n\nAG 091.1 (47.12.4) 00-P\n\n제목: 남조선군 창설 소요\n\n수신: 워싱턴 25, D.C. 육군부 일반참모부\n\n1. 1947년 10월 29일자 육군부 무선전보 W 89253호 제1부에 포함된 요청에 따라, 미 극동군사령부 무선전보 CX 56266호(1947년 10월 22일)를 통해 육군부로 송부된 주한미군사령관의 통신에서 권고된 바와 같은 남조선군 창설 소요를 이에 송부합니다.\n\n2. 제안된 조직의 동원 및 훈련은 제24군단(XXIV Corps)이 승인된 정원을 유지하고 미 본토(Zone of the Interior)로부터의 600명 전문가로 구성된 \"자문단(Advisory Group)\"으로 증강되지 않는 한(부록 A, 첨부문서 2), 제24군단의 가용 능력을 초과할 것이라는 점에 주의를 환기합니다. 육군부로부터의 추가 정보가 확보되기 전까지(극동사령부 능력 이상의) 구체적 군수 소요를 수립할 수 없다는 점에도 주의를 환기합니다(첨부문서 3).\n\n최고사령관을 대신하여:\n\n첨부 3건:\n첨부 1 - 편성 및 장비\n첨부 2 - 동원 및 훈련\n첨부 3 - 군수 소요\n\n부관참모부(AG)에 편철.\n\n[0020면]\n기밀해제\n권한 NND8X6527\n일급비밀(TOP SECRET)\n\n1947년 12월 4일\n\n기록용 회람(MEMO FOR RECORD):\n\n제목: 남조선군 창설.\n\n참조:\n\nW 89253/10.27 (수신: 극동군사령관, 참조: 주한미군사령관) — 한국으로부터 미군 철수 가능성의 관점에서 남조선군 창설의 타당성에 관한 의견을 요청한 전문.\n\nCX 56266/10.22 — 호지 중장의 CC 2000 3293/10.22 보고서를 부분 인용한 전문으로, 총 10만 명 규모의 6개 사단으로 구성된 남조선군을 조속한 시일 내에 창설할 것을 권고한 내용 포함.\n\nWX 56512/11.10 — 기초문서 제2부에 대한 G-3 조치를 완료한 전문.\n\n논의 사항:\n\n최초 조치는 주한미군사령부(USAFIK) 참모장에게 전화하여 호지 중장의 권고가 기반한 주한미군사령부 계획안을 도쿄로 가져올 대표단을 요청하는 것이었음. 주한미군사령부 G-3 및 G-1이 11월 1일 도착하여 11월 2일 회의가 열렸음. 주한미군사령부 계획안이 아직 확정적 용어로 제시될 만큼 충분히 발전되지 않았음이 확인되었고, 대표단은 세부사항을 보강하기 위해 한국으로 복귀했음.\n\n11월 13일, 주한미군사령부 대표단이 상세 편성 계획안을 가지고 돌아왔으며, G-3 병력통제과에서 주한미군사령부의 기본 개념을 변경하지 않은 채 기계적 오류에 대해 검토했음. 그러나 동원 및 훈련 계획은 여전히 너무 개괄적이어서 확정적인 인원 및 시간 소요를 쉽게 산출할 수 없었음. G-3 훈련과(파슨스 대령)가 상세 연구를 수행하여 상당히 수정되고 확장된 계획안을 도출했음. 한편, 주한미군사령부 대표단이 제공한 수정된 편성장비표(T/O&E) 및 한국 내 장비 가용성 정보에 기초하여, G-4에서 군수 소요에 관한 연구를 준비했음.\n\nG-3는 11월 12일(참모회의 시) 참모장으로부터 극동군사령관(CINCFE)이 원칙적 사안에 대해 찬반 어떠한 권고도 하지 않고, 수반되는 기술적 문제만 기술할 것이라는 통보를 받았음. 따라서 송부 공문에는 어떠한 권고도 포함되어서는 안 됨.\n\n일급비밀(TOP SECRET)\n\n[0021면]\n비밀해제\n해제권한 NND866527\n2급비밀\n\n(보안 승인된 경비대)는 1947년 11월 10일자 OX 56612호로 완료되었으며, 이는 CG USAFIK(주한미군사령관)이 특정 제한 범위 내에서 장비를 지급하도록 승인한 것이다.\n\n기본 계획 제2부(한국 경비대에 대한 미군 장비 지급)에 관한 조치—\n\n권고: G-3는 기본 계획이 요구하는 정보를 기획운영국장(Dir of P&O)에게 전달하는 참모총장(C/S) 앞 공문의 기안 및 발송을 한다. G-3는 이에 동봉할 송부 공문을 (승인 및 발송을 위해 G-3로 반송) 발송한다.\n\n5. 종결. 이로써 기본 계획에 대한 G-3 조치를 완료한다.\n\n[0022면]\n비밀해제\n해제권한 NND846527\n\nG-3 문서 전달 전표 1947년 10월 15일\n\n참모차장, G-3\n준장 W H 마리스\n\n참모차장 대리, G-3\n대령 W C 스탠턴\n\n작전\n대령 E C 버카트\n중령 C B 해멀리 주니어\n중령 KC 헤이크래프트\n\n주임\n소령 I F 고든\n\n정세 및 보고\n대령 P D 긴더\n중령 J T 웨스터마이어\n\n부주임\n대위 H B 민치\n\n소령 C S 쿠밍스\n송환\n\n행정\n중령 B I 앤더슨\n중령 E 오도너휴\n대위 W J 영 주니어\n준위 E I 하세\n\n훈련\n대령 A M 파슨스\n\n계획\n중령 B D L 페이지\n중령 J B 요스트\n중령 J 타일러\n중령 J T L 슈벵크\n\n중령 C H 코츠\n중령 R V 스트라우스\n중령 W A 제닝스\n소령 E I 앳킨스\n중령 J I 빌키 주니어\n주임 서기\n\n병력 통제\n병력 기반 대령 R J 버처스\n간행물\n대령 I H 햄\n중령 R P 타르 주니어\n대위 J E 켈러허\n\n조직 및 장비\n중령 J I 피트먼\n소령 R A 에드워즈\n소령 H 일라스트로\n\n중위 R E 마이어스 (WAC)\n\n검토 / 승인 / 논평 / 동의 / 필요 조치 / 서명 / 정보\nD / D / 행정과 반송 / 발송 / 일지 요약 / 귀하 파일 / 행정 파일 / 관계자\n\nR / 0945", "secondary": "[0013면]\nDECLASSIFIED\nAuthority NND8X6527\nTOP SECRET\nGENERAL HEADQUARTERS\nFAR EAST COMMAND\nCHECK SHEET\n(Do not remove from attached sheets)\nFile No: AG 091.1(4 Dec 47)C-Subject: Establishment of a South Korean Army Note No. From: G-3 To: C/S Date: 5 December 1947\n\n1. Forwarded herewith for C/S approval and return to G-3 for dispatch is a letter of transmittal to the Director of P&O forwarding the detailed requirements for establishment of a South Korean Army as proposed by General Hodge in his ZGCT 1293/22 Oct (quoted to Department of Army in our radio CX 56266/22 Oct).\n\n2. This information was requested by Department of Army in W 89253/29 Oct (Basic). In accordance with your instructions (Staff Conference of 12 Nov), no comment or recommendations on matters of principle have been included. However, it is considered that reference should be made in the letter of transmittal to the assumptions on which the \"Mobilization and Training\" requirements were based, inasmuch as these assumptions indicate the inability of FEC to carry out Gen. Hodge's plan without continued maintenance of XXIV Corps at authorized strength and additional help from the ZI in advisory specialists.\n\n3. It will be noted that the requirements are based entirely on Gen. Hodge's plan. The inclosure on \"Logistic Requirements\" gives the actual requirements for the force proposed, together with XXIV Corps capabilities for partial fulfillment of these requirements. Introductory remarks prepared by G-4 FEC point out that further assumptions must be secured from Dept of Army before FEC capabilities can be stated.\n\n4. WAR 91520/4 Dec, which arrived subsequent to initial submission of attached action, does not change the data submitted herewith. It is considered that the basic information attached hereto (which will be required in any case) should be forwarded as soon as possible to the Dept of Army. The letter of transmittal included herewith for approval makes no comment on CINCFE estimate of the feasibility of Gen. Hodge's plan other than to make reference to the assumptions on which the mobilization and training requirements are based. However, it is felt that the training plan set forth herein is extremely optimistic in view of the difficulty which XXIV Corps will have in maintaining its own training standards during the coming critical months, and that additional comment might well be made by CINCFE pointing out the virtual impossibility of accomplishing the program proposed by Gen. Hodge. Dept of Army, however, could draw virtually the same conclusion by study of the training program. Such comments may be included either in a revised letter of transmittal or in an interim radio reply to WAR 91520/4 Dec.\n\n5. There are strong arguments which could be presented on a policy level against the concept now being discussed. G-3 is prepared to formulate such arguments for inclusion either in radio reply to\n\n[0014면]\nTOP SECRET\nGENERAL HEADQUARTERS\nFAR EAST COMMAND\nCHECK SHEET\n(Do not remove from attached sheets)\nFile No: AG 091.1(4 Dec 47)GC-Subject: Establishment of a South Korean Army Note No. From: G-3 To: C/S Date: 5 December 1947 (Cont'd) WAR 91520 or in letter of transmittal if directed. Meanwhile, pending revision of C/S instructions, all actions will be phrased so as not to interfere with possible subsequent presentation of policy arguments.\n\n1 Incl:\nProposed Itr of transmittal to CSGPO, with incls and associated papers.\n\n[0015면]\nDECLASSIFIED\nAuthority NND8X6527 AG 091.1(4 Dec 47)GC-Subject: Establishment of a South Korean Army G-3, AG 6 Dec 47 Forwarded herewith for signature and dispatch to the Director of Plans and Operations, Department of the Army, is a letter of transmittal on the subject as above, with three inclosures, bound in a single folder. G-3 approval has been indicated on the basic copy.\n\n1 Incl: Original & 4 copies ltr to CSGPO with incls\n\n[0016면]\nDECLASSIFIED\nAuthority NND8X6527\nTOP SECRET\nGENERAL HEADQUARTERS\nFAR EAST COMMAND\nAPO 500\n\n5 December 1947 AG 091.1 (4 Dec 47)GC-P\nSUBJECT: Requirements for Establishment of a South Korean Army.\nTO: The Director of Plans and Operations, General Staff, Department of the Army, Washington 25, D.C.\n\n1. Forwarded herewith in compliance with the request contained in part I of Department of the Army radio W 89253 of 29 October 1947, are the requirements for establishment of a South Korean Army such as recommended by the Commanding General, United States Army Forces in Korea, in a communication transmitted to the Department of the Army in Far East Command radio CX 56266 of 22 October 1947.\n\n2. Attention is invited to the fact that the mobilization and training plan (Inclosure 2) is based on General Hodge's estimate that the proposed South Korean Army could be established as an effective force of six divisions within a period of eighteen months, a feat which appears to be impracticable. It is not believed feasible to mobilize the second increment within the time limits proposed or to attain a satisfactory level of training in view of the obstacles envisioned (Appendix B, Inclosure 2). Mobilization and training of anything other than an augmented constabulary will be completely beyond the capabilities of XXIV Corps under the manning levels imposed as a result of Department of the Army radio WARX 81946 of 7 November. The XXIV Corps will be unable even to train its own specialists and will have no foreseeable capability of furnishing the instructor and supervisory personnel visualized by the mobilization and training plan.\n\n3. Department of the Army radio WAR 91520 of 3 December was received in this headquarters after preparation of attached statement of requirements. Further action has been initiated, based on the additional assumptions stated, to develop more detailed comments on logistic capabilities and on the composition and functions of the proposed advisory groups. It will be noted that the assumptions stated in Department of the Army radio WAR 91520 provide only partial answers to the informational requirements stated in Inclosure 3.\n\nFOR THE COMMANDER IN CHIEF:\n\n3 Incls:\nIncl 1 - Mobilization and Training Incl 2 - [illegible]\nIncl 3 - Logistic Requirements\n\nTOP SECRET\n\n[0017면]\nDECLASSIFIED\nAuthority NND886527\nTOP SECRET\n\nGENERAL HEADQUARTERS\nFAR EAST COMMAND\nAPO 500\n\nAG 091.1 (4 Dec 47) 00-P\n\nSUBJECT: Requirements for Establishment of a South Korean Army.\n\nTO: The Director of Plans and Operations, General Staff, Department of the Army, Washington 25, D.C.\n\n1. Forwarded herewith in compliance with the request contained in Part I of Department of the Army radio W 89253 of 29 October 1947 are the requirements for establishment of a South Korean Army such as recommended by the Commanding General, United States Army Forces in Korea in a communication transmitted to the Department of the Army in Far East Command radio CX 56266 of 22 October 1947.\n\n2. Attention is invited to the fact that the mobilization and training of the proposed organization will be beyond the capabilities of XXIV Corps unless the XXIV Corps is kept at authorized strength and augmented by an \"Advisory Group\" of 600 specialists from the Zone of the Interior (Appendix A, Inclosure 2). Attention is further invited to the necessity for further information from the Department of the Army before specific logistic requirements (over and above Far East Command capabilities) can be formulated (Inclosure 3).\n\nFOR THE COMMANDER IN CHIEF:\n\n3 Incls:\nIncl 1 - Organization and Equipment Incl 2 - Mobilization and Training Incl 3 - Logistic Requirements APPROVED:\n\nTOP SECRET\n\n[0018면]\nDECLASSIFIED\nAuthority NND8X6527\nTOP SECRET\n\nAG 091.1(4 Dec 47) 00-2 Establishment of a South Korean Army G-3 C/S 4 December 1947 Attached hereto for approval, and return to G-3 for dispatch is a letter of transmittal to the Director of P&O forwarding the detailed requirements for establishment of a South Korean Army as proposed by General Hodge in his CX 56266/22 October (reported to Department of the Army in Far East Command radio CX 56266/22 October).\n\nThis information was requested by Department of the Army in W 89253/29 October (Basic). In accordance with your instructions (Staff Conference of 12 November), no comment or recommendations on matters of principle have been included. If approval can be secured today, this report can be carried to Washington by Colonel Ham.\n\nG-3 Memo for Record and pertinent references are attached for info.\n\n2 Incls:\nProposed Ltr of Transmittal, with incls and associated papers.\n\nPersed.\n\nTS- 36-5\nTOP SECRET\n\n[0019면]\nDECLASSIFIED\nAuthority NND8X6527\nTOP SECRET\n\nGENERAL HEADQUARTERS\nFAR EAST COMMAND\nAPO 500\n4 December 1947 AG 091.1 (4 Dec 47) 00-P\n\nSUBJECT: Requirements for Establishment of a South Korean Army.\n\nTO: General Staff, Department of the Army, Washington 25, D.C.\n\n1. Forwarded herewith in compliance with the request contained in Part I of Department of the Army radio W 89253 of 29 October 1947 are the requirements for establishment of a South Korean Army such as recommended by the Commanding General, United States Army Forces in Korea in a communication transmitted to the Department of the Army in Far East Command radio CX 56266 of 22 October 1947.\n\n2. Attention is invited to the fact that the mobilization and training of the proposed organization will be beyond the capabilities of XXIV Corps unless the XXIV Corps is kept at authorized strength and augmented by an \"Advisory Group\" of 600 specialists from the Zone of the Interior (Appendix A, Inclosure 2). Attention is further invited to the necessity for further information from the Department of the Army before specific logistic requirements (over and above Far East Command capabilities) can be formulated (Inclosure 3).\n\nFOR THE COMMANDER IN CHIEF:\n\n3 Incls Incl 1 - Organization and Equipment Incl 2 - Mobilization and Training Incl 3 - Logistic Requirements Filed AG\n\n[0020면]\nDECLASSIFIED\nAuthority NND8X6527\nTOP SECRET\n\n4 December 1947 MEMO FOR RECORD:\n\nSUBJECT: Establishment of South Korean Army.\n\nREFERENCES:\n\nW 89253/27 Oct (to CINCFE, Info to CG, USAFIK) which requested comments on advisability of establishing South Korean armed forces in view of probability of withdrawal of US forces from Korea.\n\nCX 56266/22 Oct, which quotes in part General Hodge's CC 2000 3293/22 Oct report on ref, including a recommendation that a South Korean Army of six divisions, totaling 100,000, be established at an early date.\n\nWX 56512/10 Nov, which completes G-3 action on Part II of basic.\n\nDISCUSSIONS: [sic]\n\nInitial action consisted of a telephone call to C/S, USAFIK requesting that representatives bring to Tokyo the USAFIK plan on which General Hodge's recommendation was based. G-3 and G-1 of USAFIK arrived 1 Nov and conference was held 2 Nov. It was found that USAFIK plan had not yet been sufficiently evolved for presentation in definitive terms, and representatives returned to Korea to work up further details.\n\nOn 13 Nov USAFIK representatives returned with detailed organization plan which was reviewed by G-3 Troop Control for mechanical faults without changing USAFIK concept. However, the plan for mobilization and training was still so sketchy that definitive personnel and time requirements could not be readily determined. G-3 Training (Col. Parsons) made a detailed study which resulted in a considerably modified and expanded plan. Meanwhile, based on the corrected T/E [sic; likely T/O&E] and information on equipment availability in Korea furnished by USAFIK representatives, G-4 prepared a study of logistic requirements.\n\nG-3 was informed by C/S on 12 Nov (at a Staff Conference) that CINCFE would offer no recommendations pro or con on matters of principle, but would simply state the mechanical problem involved. Forwarding letter should therefore contain no recommendations.\n\nTOP SECRET\n\n[0021면]\nDECLASSIFIED\nAuthority NND866527\nTOP SECRET\n\n(security authorized constabulary) was completed by OX 56612/10 Nov, which authorized CG USAFIK to issue equipment within specified limitations.\n\nAction on Part II of basic (issue of US equipment to proRECOMMEND: G-3 initial and dispatch attached C/L to C/S forwarding to Dir of P&O the information required by basic. G-3 forwarding (for approval and return to G-3 for dispatch) a letter of transmittal to accompany.\n\n5. COMPLETE CLOSE. This completes G-3 action on basic.\n\n[0022면]\nDECLASSIFIED\nAuthority NND846527 G-3 ROUTING SLIP 15 October 1947 ASST CHIEF OF STAFF, G-3 BG W H Maris DEPUTY AC/S, G-3 Col W C Stanton Operations Col E C Burkart Lt Col C B Hammerle, Jr Lt Col KC Haycraft\n\nEXECUTIVE\nMaj I F Gordon Situation & Reports Col P D Ginder Lt Col J T Westermeier\n\nASST EXECUTIVE\nCapt H B Minch Maj C S Cumings Repatriation\n\nADMINISTRATION\nLt Col B I Anderson Lt Col E O'Donohue Capt W J Young, Jr WOJG E I Haase\n\nTRAINING\nCol A M Parsons\n\nPLANS\nLt Col B D L Paige Lt Col J B Yost Lt Col J Tyler Lt Col J T L Schwenk Lt Col C H Coates Lt Col R V Strauss Lt Col W A Jennings Maj E I Atkins Lt Col J I Bealke, Jr Chief Clerk\n\nTROOP CONTROL\nTroop Basis Col R J Butchers Publications Col I H Ham Lt Col R P Tarr, Jr Capt J E Kelleher Organization & Equipment Lt Col J I Pittman Maj R A Edwards Maj H Ilastro Lt RE Meyers (WAC)\n\nFOR / Approval / Comment / Concurrence / Necessa
