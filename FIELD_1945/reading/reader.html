<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전황 보고 — 열람기</title>
<style>
:root{
  --bg:#eef1f4; --panel:#f7f9fa; --edge:#ccd4da; --edge-soft:#dde4e9;
  --ink:#16202a; --ink-2:#4a5b68; --ink-3:#71828f;
  --stamp:#8c2f39;            /* 기밀등급 도장의 자주색 */
  --link:#2f5d86;
  --a:#4a7c59; --b:#8a6d3b; --c:#3f6d8c; --d:#7a4a6b; --e:#5a6f7d; --x:#8a8f94;
  --term-line:#9db0c2; --term-bg:rgba(47,93,134,.05);
  --term-line-go:#7fa3c4; --term-bg-go:rgba(47,93,134,.10);
  --term-bg-on:rgba(47,93,134,.17);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",
         -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
    --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
    --stamp:#c9707a; --link:#7fb0da;
    --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
    --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
    --term-bg-on:rgba(127,176,218,.22);
    --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
  }
}
:root[data-theme="dark"]{
  --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
  --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
  --stamp:#c9707a; --link:#7fb0da;
  --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
  --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
  --term-bg-on:rgba(127,176,218,.22);
  --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--link)}

.wrap{display:grid;grid-template-columns:minmax(300px,25%) 1fr;height:100vh}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{max-height:42vh}
}

/* ── 좌측 목록 ─────────────────────────────── */
.rail{border-right:1px solid var(--edge);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
.rail-head{padding:14px 14px 10px;border-bottom:1px solid var(--edge-soft);
  display:flex;flex-direction:column;gap:8px}
/* 문서철에 들어오면 나갈 길이 있어야 한다 */
.home{display:inline-flex;align-items:center;gap:5px;text-decoration:none;
  color:var(--link);font-size:11.5px;font-family:var(--mono);
  letter-spacing:.04em;width:fit-content;
  background:var(--term-bg-go);border:1px solid var(--term-line-go);
  border-radius:999px;padding:2px 10px 2px 8px}
.home:hover{background:var(--term-bg-on);border-color:var(--link)}
.home span{font-size:12px;line-height:1}
.brand{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font-weight:400;letter-spacing:0;text-transform:none;
  color:var(--ink-3);font-size:11.5px;margin-top:2px}
input[type=search]{width:100%;padding:7px 10px;border:1px solid var(--edge);
  border-radius:3px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
input[type=search]:focus,button:focus-visible,.item:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--edge);background:transparent;color:var(--ink-2);
  border-radius:999px;padding:2px 9px;font-size:11.5px;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sortbar{display:flex;gap:10px;font-size:11.5px;color:var(--ink-3);align-items:center}
.sortbar button{background:none;border:none;color:var(--ink-3);cursor:pointer;
  font:inherit;padding:0;border-bottom:1px solid transparent}
.sortbar button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.list{overflow-y:auto;flex:1;min-height:0}
.item{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--edge-soft);border-left:3px solid transparent;
  padding:9px 13px;cursor:pointer;font:inherit;color:inherit}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--bg);border-left-color:var(--ink)}
.item.tA{border-left-color:var(--a)} .item.tB{border-left-color:var(--b)}
.item.tC{border-left-color:var(--c)} .item.tD{border-left-color:var(--d)}
.item.tE{border-left-color:var(--e)} .item.tX{border-left-color:var(--x)}
.item-top{display:flex;justify-content:space-between;gap:8px;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.item-sum{font-size:12.5px;line-height:1.45;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── 우측 본문 ─────────────────────────────── */
.main{overflow-y:auto;min-height:0}
.toolbar{position:sticky;top:0;z-index:5;background:var(--panel);
  border-bottom:1px solid var(--edge);padding:8px 26px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px}
.toolbar .grow{flex:1}
.seg{display:flex;border:1px solid var(--edge);border-radius:3px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 11px;cursor:pointer;
  font:inherit;font-size:12px;color:var(--ink-2);border-right:1px solid var(--edge)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.srcline{padding:10px 26px 0;font-size:11px;color:var(--ink-3);line-height:1.5}

/* ── 연대 바 ───────────────────────────────
   5년 반을 한 줄에 욱여넣으면 1945년 8월 열흘은 0.5% 밖에 안 된다. 그래서
   줄을 늘여 놓고 **띠 자체를 움직인다** — 지금 읽는 문서의 날짜가 늘 정중앙이다.
   문서를 옮기면 띠가 미끄러지고, 사건 이름은 겹치지 않게 위아래로 층을 나눈다. */
.chrono{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
  width:min(940px,calc(100vw - 48px));z-index:20;user-select:none;
  border:1px solid var(--edge);border-radius:8px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 20px rgba(0,0,0,.10);
  transition:box-shadow .2s ease}
.chrono:hover{box-shadow:0 6px 26px rgba(0,0,0,.18)}
/* 옅어지는 것은 **내용**이지 판이 아니다. 판까지 투명해지면 뒤의 본문이
   비쳐 들어와 글자가 서로를 밟는다. */
.chrono-track{opacity:.5;transition:opacity .2s ease}
.chrono:hover .chrono-track{opacity:1}

/* 띠가 지나가는 창. 손으로도 밀 수 있게 진짜 가로 스크롤을 쓴다 */
.chrono-vp{position:relative;overflow-x:auto;overflow-y:hidden;
  height:var(--chH,92px);border-radius:8px;cursor:grab;
  scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain}
.chrono-vp::-webkit-scrollbar{display:none}
.chrono-vp.drag{cursor:grabbing}
/* 안쪽 띠. 양옆 여백은 창의 절반 — 첫 문서도 마지막 문서도 가운데에 설 수 있게 */
.chrono-track{position:relative;height:100%;margin:0 var(--chPad,0px)}
/* 시간 축 — 층의 한가운데 */
.chrono-track::before{content:"";position:absolute;
  left:calc(0px - var(--chPad,0px));right:calc(0px - var(--chPad,0px));
  top:var(--axis,46px);height:1px;background:var(--edge)}

/* 연도 — 해가 바뀌는 자리에 선을 긋고, 그 선부터가 그 해다.
   이름표는 창 왼쪽에 들러붙는다. 1945년 한복판을 보고 있어도 「1945」가 남는다. */
.cy{position:absolute;top:0;bottom:0;
  border-left:1px solid color-mix(in srgb,var(--ink-3) 50%,transparent)}
.cy.alt{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.cy b{position:absolute;bottom:3px;font-family:var(--mono);font-size:11px;
  font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;
  line-height:1;letter-spacing:.06em;white-space:nowrap;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px}
/* 달·분기 눈금 — 해 안에서 어디쯤인지. 분기는 조금 길게 */
.cq{position:absolute;top:calc(var(--axis,46px) - 1.5px);width:1px;height:4px;
  background:var(--edge);opacity:.7}
.cq.q{top:calc(var(--axis,46px) - 2.5px);height:6px;opacity:1}
.cq[hidden]{display:none}

/* 배율 — 5년 반을 한눈에 볼 때와 8월 열흘을 벌려 볼 때가 같을 수 없다 */
.chrono-zoom{position:absolute;right:6px;top:5px;z-index:3;display:flex;gap:3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-zoom,.chrono-zoom:focus-within{opacity:1}
.chrono-zoom button{width:19px;height:19px;padding:0;line-height:1;
  font-family:var(--mono);font-size:12px;color:var(--ink-2);cursor:pointer;
  background:var(--panel);border:1px solid var(--edge);border-radius:3px}
.chrono-zoom button:hover:not(:disabled){color:var(--link);border-color:var(--link)}
.chrono-zoom button:disabled{opacity:.35;cursor:default}
.chrono-scale{position:absolute;right:6px;bottom:3px;z-index:3;
  font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.03em;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-scale{opacity:1}

/* 사건 점 */
.cm{position:absolute;top:calc(var(--axis,46px) - 3px);width:7px;height:7px;
  margin-left:-3.5px;border-radius:50%;background:var(--ink-3);z-index:1;
  border:1.5px solid var(--panel);cursor:help;
  transition:background .15s ease,transform .15s ease}
.cm.key{background:var(--stamp);width:9px;height:9px;margin-left:-4.5px;
  top:calc(var(--axis,46px) - 4px)}
.cm:hover{background:var(--link);transform:scale(1.45)}

/* 사건 이름 — 층(lane)을 나눠 위아래로 흩는다. 여기서 겹침이 풀린다 */
.cl{position:absolute;transform:translateX(-50%);white-space:nowrap;z-index:1;
  font-family:var(--mono);font-size:10px;line-height:1.1;color:var(--ink-2);
  letter-spacing:.01em;padding:1px 4px;border-radius:2px;cursor:help;
  background:color-mix(in srgb,var(--panel) 70%,transparent)}
.cl.key{color:var(--stamp)}
.cl:hover,.cl:focus-visible{color:var(--link);outline:0;
  background:color-mix(in srgb,var(--link) 12%,var(--panel))}
/* 이름에서 축까지 내려/올려 긋는 실 — 어느 점의 이름인지 알아보게 */
.cl::after{content:"";position:absolute;left:50%;width:1px;background:var(--edge)}
.cl.up::after{top:100%;height:var(--leg,0px)}
.cl.dn::after{bottom:100%;height:var(--leg,0px)}

/* 지금 읽는 문서가 놓인 자리. 문서를 고르면 이 표가 창 한가운데로 온다.
   손으로 띠를 밀면 표는 제 날짜에 남는다 — 표는 시간에 박혀 있지 창에 박혀 있지 않다. */
.chrono-cursor{position:absolute;top:0;bottom:0;width:1px;z-index:2;
  background:var(--stamp);pointer-events:none}
/* 가상 요소는 위의 *{box-sizing:border-box}가 닿지 않는다 — 여기서 직접 잡아 주지
   않으면 테두리 2px 만큼 표시가 축 아래·오른쪽으로 밀려 앉는다. */
.chrono-cursor::before{content:"";position:absolute;box-sizing:border-box;
  left:-6px;top:calc(var(--axis,46px) - 6px);width:13px;height:13px;
  border-radius:50%;background:var(--stamp);border:2px solid var(--panel)}
/* 날짜는 맨 아래, 표 바로 밑에 — 위쪽은 사건 이름 층에 내준다 */
.chrono-date{position:absolute;bottom:2px;transform:translateX(-50%);
  font-family:var(--mono);font-size:10px;color:var(--stamp);
  font-variant-numeric:tabular-nums;background:var(--panel);
  padding:0 5px;border-radius:2px;white-space:nowrap;z-index:2}
.chrono[data-nodate="1"] .chrono-cursor,
.chrono[data-nodate="1"] .chrono-date{display:none}

@media(max-width:900px){.chrono{display:none}}
@media(prefers-reduced-motion:reduce){.chrono-track{transition:none}}

/* 아래쪽 여백은 떠 있는 연대 바가 마지막 문단을 덮지 않을 만큼 */
article{max-width:none;padding:26px 26px 190px}
.doc-head{border-bottom:1px solid var(--edge);padding-bottom:14px;margin-bottom:18px}
h1{font-size:19px;margin:0 0 4px;line-height:1.35;text-wrap:balance;font-weight:650}
.docid{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  letter-spacing:.04em;font-variant-numeric:tabular-nums}
.stamp{display:inline-block;border:1.5px solid var(--stamp);color:var(--stamp);
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:1px 6px;
  border-radius:2px;transform:rotate(-1.2deg);margin-left:8px;vertical-align:2px}
.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:3px 20px;margin-top:10px;font-size:12.5px}
.meta div{display:flex;gap:7px}
/* 참석자 명단처럼 긴 값. 좁은 칸에 넣으면 한 글자씩 세로로 눌린다 */
.meta div.wide{grid-column:1/-1}
.meta b{color:var(--ink-3);font-weight:500;min-width:52px;font-size:11.5px}
.meta span{font-family:var(--mono);font-size:12px}
.meta span.txt{font-family:var(--sans);font-size:12.5px}

.points{margin:16px 0;padding:12px 16px;border-left:2px solid var(--edge);
  background:var(--panel);border-radius:0 3px 3px 0}
.points li{margin:3px 0}
.points ul{margin:0;padding-left:18px}

.cols{display:grid;gap:26px}
.cols.two{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.cols.two{grid-template-columns:1fr}}
.pane h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 8px;font-weight:600}
.body{white-space:pre-wrap;word-break:break-word}
/* 번역문에 마크다운이 섞여 들어온다 — 긴 문서는 옮긴 쪽이 소제목과 항목으로
   나눠 두어야 읽힌다. 본문은 pre-wrap 이므로 줄 단위로만 풀어 준다. */
.mdh{display:block;font-weight:700;margin:20px 0 6px;letter-spacing:-.01em}
.mdh.h1{font-size:17px} .mdh.h2{font-size:15.5px}
.mdh.h3,.mdh.h4,.mdh.h5,.mdh.h6{font-size:14px;color:var(--ink-2);
  letter-spacing:.04em}
.mdq{display:block;border-left:2px solid var(--edge);padding-left:13px;
  color:var(--ink-2);margin:6px 0}
.mdli{display:block;padding-left:17px;text-indent:-17px;margin:2px 0}
.mdli::before{content:"· ";color:var(--ink-3)}
.mdli[data-n]::before{content:attr(data-n) " ";color:var(--ink-3);
  font-family:var(--mono);font-size:12px}
.mdhr{border:0;border-top:1px solid var(--edge);margin:18px 0}
.body.en{font-family:var(--mono);font-size:12.5px;line-height:1.65;color:var(--ink-2)}
.body del{color:var(--ink-3)}
.body strong{font-weight:650}

.pagemark{display:block;margin:16px 0 6px;font-family:var(--mono);font-size:10.5px;
  color:var(--ink-3);letter-spacing:.06em;border-top:1px dashed var(--edge);padding-top:5px}
.pagemark.hit{cursor:zoom-in;text-decoration:underline;
  text-decoration-style:dotted;text-underline-offset:3px}
.pagemark.hit:hover{color:var(--link)}
.fnref{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);vertical-align:super}

/* 본문 속 용어 주석.
   앞서 --edge 로 밑줄을 그었더니 배경에 묻혀 아예 보이지 않았다.
   옅은 바탕을 깔아 「여기 무언가 있다」를 먼저 알리고, 점선으로 종류를 나눈다.
   다른 문서로 가는 것(a)과 설명만 뜨는 것(span)을 색으로 구분한다. */
.term{color:inherit;text-decoration:none;cursor:help;
  background:var(--term-bg);border-radius:2px;
  padding:0 2px;margin:0 -1px;
  border-bottom:1px dashed var(--term-line);
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
a.term{cursor:pointer;color:var(--link);
  background:var(--term-bg-go);border-bottom-color:var(--term-line-go)}
.term:hover{background:var(--term-bg-on);border-bottom-style:solid;
  border-bottom-color:var(--link);color:var(--link)}
.term:focus-visible{outline:2px solid var(--link);outline-offset:2px}

.fns{margin-top:24px;padding-top:14px;border-top:1px solid var(--edge-soft);
  font-size:12px;color:var(--ink-3);line-height:1.6}
.fns h2,.scans h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 9px;font-weight:600}
.fns div{margin:4px 0}
.note{margin-top:14px;font-size:12px;color:var(--ink-3);border-left:2px solid var(--edge);
  padding-left:11px}
.empty{padding:60px 26px;color:var(--ink-3)}
.warn{color:var(--stamp)}

/* ── 스캔 원본 ─────────────────────────────── */
.scans{margin-top:24px;padding-top:14px;border-top:1px solid var(--edge-soft)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{border:1px solid var(--edge);background:var(--panel);padding:0;cursor:zoom-in;
  border-radius:2px;overflow:hidden;line-height:0;position:relative}
.thumb:hover{border-color:var(--link)}
.thumb img{width:84px;height:110px;object-fit:cover;object-position:top center;
  display:block;background:var(--edge-soft)}
.thumb b{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.62);color:#fff;
  font-family:var(--mono);font-size:9.5px;font-weight:400;padding:1px 4px;
  letter-spacing:.04em;line-height:1.5}

/* ── 확대 뷰어 ─────────────────────────────── */
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,11,14,.94);
  display:none;flex-direction:column}
.lb[open]{display:flex}
.lb-bar{display:flex;align-items:center;gap:14px;padding:9px 16px;color:#c9d3db;
  font-size:12px;border-bottom:1px solid #2a343d;flex:none}
.lb-bar .grow{flex:1}
.lb-bar button{background:none;border:1px solid #3a464f;color:#c9d3db;
  border-radius:3px;padding:3px 11px;font:inherit;font-size:12px;cursor:pointer}
.lb-bar button:hover:not(:disabled){border-color:#7fb0da;color:#fff}
.lb-bar button:disabled{opacity:.35;cursor:default}
.lb-bar .pg{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lb-stage{flex:1;min-height:0;overflow:auto;display:flex;
  align-items:flex-start;justify-content:center;padding:16px}

/* 손가락으로 쓰는 기기에는 호버가 없다. 링크는 그대로 동작하므로 카드만 뺀다 */
@media (hover: none) { .hc { display: none } }

A) 운용 일지(Calendar of Employment).\n\n(B) 편성의 변경 및 개별 함정의 손상과 이동에 관한 연대기적 기록.\n\n(C) 1945년 3월 18일부터 4월 18일까지의 기간에 대한 제58기동부대 보충 소요.\n\n(D) 1945년 4월 7일 야마토(Yamato) 기동부대의 격멸.\n\n(E) 병참 보고(제50.8기동부대군(TG 50.8) 수치).\n\n(F) 규슈(KYUSHU)에서의 제58기동부대 비행 계획표.\n\n(G) 항공전대 정원(제1항모기동부대 사령관(CFCTFP) 기밀 서한 일련번호 00220, 1945년 5월 31일자).\n\n(H) 오키나와(OKINAWA)를 위한 제58기동부대 방공 계획 도해.", "secondary": "HyperWar: Action Report--Task Force 58 at Okinawa\nUNITED STATES PACIFIC FLEET\nCOMMANDER FIRST CARRIER TASK FORCE\nA16-3\nSerial: 00222\n18 June 1945.\nFrom:\nCommander Task Force FIFTY-EIGHT\n(Commander FIRST Carrier Task Force, Pacific, -- Vice Admiral M.A. MITSCHER.\nFlagships: U.S.S. Bunker Hill, 14 March to 11 May, 1945\nU.S.S. Enterprise, 11 May to 15 May, 1945\nU.S.S. Randolph, 15 May to 28 May, 1945).\nTo:\nCommander in Chief, United States Fleet.\nVia:\n(1) Commander FIFTH Fleet.\n(2) Commander in Chief, U.S. Pacific Fleet.\nSubject:\nReport of Operations of Task Force FIFTY-EIGHT in Support of Landings at OKINAWA,\n14 March through 28 May (East Longitude Dates), including Actions against KYUSHU,\nNANSI SHOTO, Japanese Fleet at Kure, the Yamato, and Operations in Direct Support\nof Landings at OKINAWA.\nReference:\n(a) Com5thFlt Operation Plan 1-45.\n(b) CTF 58 Operation Order 2-45.\nEnclosure:\n(A) Calendar of Employment.\n(B) Changes in Organization and Chronological Record\nof Damages to and Movements of Individual Ships.\n(C) Task Force 58 Replacement Requirements for the\nperiod 18 March through 18 April, 1945.\n(D) Destruction of Yamato Task Force on 7 April 1945.\n(E) Logistics Report (TG 50.8 figures).\n(F) Task Force 58 Flight Schedules at KYUSHU.\n(G) Complement of Air Groups (CFCTFP Secret Ltr.\nSerial 00220 dated 31 May, 1945).\n(H) Diagram of Task Force 58 Air Defense Plan for OKINAWA.", "note": "원문 첫 줄 'HyperWar: Action Report--Task Force 58 at Okinawa'는 원 문서의 일부가 아니라 이 텍스트를 전사한 HyperWar Foundation 웹판의 표제 줄이나, 원문 그대로 옮겼다. 원문의 'NANSI SHOTO'는 통상 표기인 'NANSEI SHOTO(난세이 제도)'의 오식으로 보이나 원문 철자를 그대로 두었다. 'From:' 항목의 여는 괄호가 닫히지 않은 채 문단이 끝나는 것도 원문 그대로다.", "warn": false, "search": "Report of Operations of Task Force FIFTY-EIGHT in Support of Landings at OKINAWA, 14 March through 28 May Marc A. Mitscher 마크 A. 미처 — 미 해군 중장, 제58기동부대 사령관(제1항모기동부대 사령관, 태평양)"}, {"id": "tf58-1", "order": 12, "date": "1945-03-14", "group": "B", "eyebrow": "제58기동부대 작전 보고 · 미처 중장", "title": "총론 — 기동부대군 편성의 축소와 오키나와 동쪽 60마일 해역의 상주 운용", "list_right": "본문", "meta": [{"k": "다루는 시점", "v": "1945-03-14"}, {"k": "문서 일자", "v": "1945-06-18"}, {"k": "성격", "v": "본문", "txt": true}, {"k": "원제", "v": "GENERAL", "txt": true}], "summary": "제58기동부대가 제5함대 작전계획 1-45호에 따라 오키나와 상륙군을 지원한 방식과, 전투 손상으로 4개 기동부대군이 3개로 줄어든 뒤에도 두 달 반 동안 규슈에서 350마일도 떨어지지 않은 좁은 해역에 머물며 작전한 경위를 총괄한 대목이다.", "points": ["지원의 형태는 주야간 공격, 규슈(KYUSHU) 소탕·수색, AMAMI GUNTO(아마미 군토)와 MINAMI DAITO(미나미다이토) 비행장 무력화, 3월 18일부터 시작된 주야간 전투공중초계(CAP)와 근접항공지원이었다.", "3월 14일 ULITHI(울리시)에서 4개 기동부대군으로 출격했으나 3월 22일 Franklin(프랭클린)·Wasp(와스프)·Enterprise(엔터프라이즈)의 전투 손상으로 3개 군으로 줄었고, 이후 대체로 그 규모를 유지했다.", "4월 27일부터는 1개 기동부대군이 10일간 후방 기지에서 정비·수리를 받아 2개 군만이 상륙군을 지원했다.", "5월 13~18일 5일간은 2개 기동부대군(58.1·58.3)이 규슈를 이틀간 대규모로 공격하고 이틀간 보급을 받았는데, 이 기간이 오키나와 인근에 기동부대군이 하나도 없던 유일한 때였다.", "엔터프라이즈를 3월 19일 잃으면서 각 항공모함(CV)의 야간전투기(VFN) 정원을 4기에서 6기로 늘렸고, 이로써 3월 25일부터 4월 7일 엔터프라이즈 복귀 때까지 오키나와 상공에 야간 전투공중초계를 끊이지 않고 유지할 수 있었다.", "기동부대는 두 달 반 동안 매일 오키나와 동쪽 60마일 사방(60마일 정사각형) 해역에서, 규슈로부터 350마일이 채 안 되는 거리에서 작전했다.", "미처는 이 기간 동안 적 잠수함 부대가 기동부대를 움직이게 하기는커녕 위협조차 하지 못한 것을 두고 「적 잠수함 전력에 대한 수치스러운 평가」라고 적었다."], "primary": "**총론(GENERAL)**\n\n1. 본 보고가 다루는 기간 동안 제58기동부대(Task Force FIFTY-EIGHT)는 미처(MITSCHER) 중장의 전술 지휘 아래, 제5함대 사령관의 작전계획 1-45호에 따라 OKINAWA(오키나와)와 그 인접 도서를 점령·탈취하는 제5함대 상륙부대를 지원하며 작전했다. 이 지원은 다음과 같은 형태를 띠었다 — 주간 및 야간 공격, KYUSHU(규슈)에 대한 소탕 및 수색 작전, AMAMI GUNTO(아마미 군토)와 MINAMI DAITO(미나미다이토)의 적 비행장 및 시설 무력화, 그리고 1945년 3월 18일부터 시작되어 이 보고를 쓰는 지금까지도 계속되고 있는, 점령군에 대한 주야간 CAP(전투공중초계)와 근접항공지원 제공이 그것이다. 제58기동부대의 정례 수색 작전은 1945년 4월 9일 중지되었다. (본 보고에서 모든 시각은 마이너스 9 시간대이며 모든 날짜는 동경 기준이다.)\n\n—1—\n\n2. 본 작전 보고는 기동부대의 운용과 성과에 관한 일반적 논의이며, 각 기동부대군 사령관들의 보다 구체적이고 상세한 보고들이 채워 넣어져야 할 뼈대다. 첨부 (A)는 일자별 운용 일지다. 첨부 (B)는 작전의 여러 단계에서 각 기동부대군의 편성과 본 부대 함정들의 손상을 보여 준다. 유의할 점은, 기동부대가 3월 14일 ULITHI(울리시)에서 4개 기동부대군으로 출격했으나 3월 22일 전투 손상(Franklin(프랭클린), Wasp(와스프), Enterprise(엔터프라이즈))으로 3개 기동부대군으로 줄었고, 4월 8일부터 17일까지 제58.2기동부대군이 재편성된 기간을 제외하면 나머지 기간 내내 이 규모를 유지했다는 것이다. 4월 27일부터는 1개 기동부대군이 10일간의 정비·수리 기간을 위해 계속 후방 기지에 머물렀고, 2개 기동부대군이 남아 상륙부대에 전술적·전략적 지원을 제공했다. 3월 23일부터는 날씨가 막은 약 5일과, 가용한 2개 기동부대군(58.1과 58.3)이 이틀간 KYUSHU(규슈)를 대규모로 공격하고 이틀간 보급을 받은 5월의 5일(13일부터 18일까지)을 제외하고는 상륙부대에 전투공중초계와 항공지원 임무가 제공되었다. 이때가 1개 이상의 기동부대군이 오키나와 바로 인근에 있지 않았던 유일한 기간이었다. 보급 일정은 통상 기동부대군이 나흘마다 급유와 보급을 받도록 짜여 있었다. 이는 3월 23일부터 4월 28일까지의 기간 동안 평균 2개 기동부대군이 매일 오키나와를 지원했다는 뜻이다. 4월 28일부터 5월 32일까지는 항상 1개 기동부대군이 지원 중이었고, 나흘 중 이틀은 2개 기동부대군이 지원했다. 엔터프라이즈의 임무 상실(3월 19일)로 인해 각 CV(항공모함)의 VFN(야간전투기) 정원을 4기에서 6기로 늘렸다. 이로써 기동부대는 3월 25일부터, 엔터프라이즈가 제58.2기동부대군의 일원으로 복귀한 4월 7일까지 오키나와 상공에 야간 전투공중초계를 끊임없이 제공할 수 있었다. 엔터프라이즈는 4월 11일 다시 손상을 입어 수리를 위해 울리시로 돌아가야 했다. 흥미로운 점은, 기동부대가 두 달 반 동안 오키나와 동쪽의 60마일 사방 구역에서, KYUSHU(규슈)로부터 350마일이 채 되지 않는 거리에서 날마다 작전했다는 사실이다. 이는 가용한 구역이 제한되어 있었던 데다, AMAMI GUNTO(아마미 군토)의 비행장을 엄호하고 공습이 오키나와에 닿기 전에 요격하면서도 지상군에 항공지원을 제공할 수 있어야 했기 때문에 불가피했다. 이 모든 것을 해낼 수 있는 다른 위치는 없었다. 이 기간 동안 적 잠수함 부대가 우리를 움직이게 만들기는커녕 우리 함정을 위협조차 하지 못했다는 것은 그들에 대한 창피스러운 평가다.", "secondary": "GENERAL\n\n1. During the period covered by this report Task Force FIFTY-EIGHT,\nunder the tactical command of Vice Admiral MITSCHER,\noperated in support of the amphibious forces of the FIFTH Fleet,\noccupying and capturing OKINAWA and adjacent islands in accordance\nwith Com5thFleet's Operation Plan 1-45. This support took\nthe form of day and night strikes, sweep and search operations\nagainst KYUSHU, the neutralization of enemy airfields and facilities\nin AMAMI GUNTO and MINAMI DAITO, the supplying of day and\nnight CAP and close air support to the occupation forces commencing\n18 March, 1945, and still continuing as this report is\nwritten. Routine search operations by Task Force FIFTY-EIGHT\nwere discontinued on 9 April, 1945. (In this report all times\nare minus 9 and all dates East Longitude).\n--1--\n\n2. This action report constitutes a general discussion of the\nTask Force employment and accomplishments and a framework into\nwhich should be fitted the more specific and detailed reports\nof the Task Group Commanders. Enclosure (A) is a day by day\ncalendar of employment. Enclosure (B) shows the composition of\nthe various Task Groups at different stages of the operation and\nthe damage to ships of the Force. It should be noted that\nalthough the Task Force sortied from ULITHI on 14 March with\nfour Task Groups, it was reduced by battle damage\n(Franklin,\nWasp and\nEnterprise)\non the 22nd of March to three Task Groups\nand remained at this strength (except for the period 8 to 17\nApril when Task Group 58.2 was reorganized) the remainder of\nthe time. Commencing on 27 April, one Task Group was continuously\nat a rear base for a 10-day period of upkeep and repairs,\nleaving two Task Groups to furnish tactical and strategical\nsupport to the amphibious forces. Beginning on 23 March, combat\nair patrol and air support missions were furnished to the\namphibious forces with the exception of about five days when\nweather prevented, and five days in May (13th to 18th) when the\ntwo available Task Groups (58.1 and 58.3) attacked KYUSHU in\nforce for two days and replenished for two days. This was the\nonly period during which one or more Task Groups were not in\nthe immediate vicinity of OKINAWA. The schedule of replenishment\nnormally allowed Task Groups to refuel and replenish every\nfourth day. This meant that during the period 23 March to 28\nApril, an average of two Task Groups were supporting OKINAWA\neach day. From 28 April until 32 May, one Task Group was always\nin support and two Task Groups on two days out of every four.\nDue to the loss of the services of the Enterprise (19 March) the\nVFN complement of Each CV was increased from four to six night\nfighters. This enabled the Task Force to supply continuous night\nCAP over OKINAWA from 25 March until the return of the Enterprise\non 7 April, as a unit of Task Group 58.2. The Enterprise was\ndamaged again on 11 April and had to return to ULITHI for repairs.\nIt is interesting to note that for two and one-half months the\nTask Force operated daily in a 60-mile square area East of OKINAWA,\nless than 350 miles from KYUSHU. This was necessitated by\nthe restricted area available and the necessity for being able\nto cover AMAMI GUNTO airfields, intercept air raids before they\nreached OKINAWA and still furnish air support to ground forces.\nThere was no other location from which all these things could\nbe done. It is a degrading reflection on the enemy submarine\nservice that they were unable to make us move or even threaten\nour ships during this time.", "note": "원문의 'From 28 April until 32 May'는 '32 May'라는 존재하지 않는 날짜를 적고 있다. 문맥상 5월 28일(보고 종료일)의 오식으로 보이나 원문 그대로 옮겼다. 본문에 'Jap' 등 멸칭은 나오지 않는다. 마지막 문장의 'It is a degrading reflection on the enemy submarine service'는 적 잠수함 부대의 무능에 대한 평가를 뜻하며, 원문의 담담하면서도 비꼬는 어조를 살려 옮겼다. 'a 60-mile square area'는 한 변 60마일의 정사각형 구역으로 읽었다. 이 장은 1945년 3월 14일부터 5월 28일까지의 작전 전반을 다룬다. '32 May' 오식과 60마일 구역 해석 때문에 confidence를 medium으로 두었다.", "warn": true, "search": "GENERAL Marc A. Mitscher 마크 A. 미처 — 미 해군 중장, 제58기동부대 사령관"}, {"id": "tf58-2", "order": 13, "date": "1945-03-17", "group": "B", "eyebrow": "제58기동부대 작전 보고 · 미처 중장", "title": "3월 18~21일 규슈와 내해 공격 — 프랭클린 피격과 바카 폭탄의 첫 출현", "list_right": "본문", "meta": [{"k": "다루는 시점", "v": "1945-03-17"}, {"k": "문서 일자", "v": "1945-06-18"}, {"k": "성격", "v": "본문", "txt": true}, {"k": "원제", "v": "18 to 21 March -- Attacks on KYUSHU and Inland Sea", "txt": true}], "summary": "3월 18일부터 21일까지 규슈 비행장과 내해의 일본 함대를 공격한 경과, 그 사이 프랭클린·와스프·엔터프라이즈가 입은 손상, 그리고 3월 21일 요격전에서 바카(Baka) 폭탄이 처음으로 확인된 일을 기록한 대목이다.", "points": ["3월 18일 05시 45분(0545) 규슈 남단 동쪽 약 100마일 지점에서 첫 전투기 소탕(각 기동부대군 약 32기)과 45분 뒤 뇌격기·폭격기 약 60기에 전투기 약 40기 호위의 공격대가 발진했다.", "3월 18일 성과 — 적기 102기 공중 격추, 지상에서 약 275기 추가 격파 또는 손상. 아군 CAP가 12기, 기동부대 대공포화가 21기를 더 격추했다.", "3월 18일 Yorktown(요크타운)과 Enterprise(엔터프라이즈)가 폭탄에 피격되었으나 요크타운의 손상은 경미했고 엔터프라이즈에 맞은 폭탄은 불발이어서 모든 항모가 비행 작업을 계속할 수 있었다.", "3월 19일 구레(KURE)·고베(KOBE)·히로시마(HIROSHIMA) 공격에서 야마토급 전함 1척(경미), 이세급 전함/항모 1척(폭탄 여러 발 명중), 항모 2척, 경항모 1척, 중순양함 1척, 경순양함 오요도(Oyodo) 심대 손상 등을 확인했으나, 극히 강력하고 정확한 대공포화 때문에 성과는 보통에 그쳤고 한 부대군만도 구레 상공에서 13기를 잃었다.", "3월 19일 제58.2기동부대군이 공격받아 Franklin(프랭클린)이 공격대 발진 도중 피격되어 맹렬히 불탔고, 수평선 아래로 사라진 뒤에도 여섯 차례의 거대한 폭발이 목격되었다. Wasp(와스프)는 폭탄이 2·3갑판 사이에서 터졌으나 한 시간 내에 항공기 운용을 재개했다.", "3월 19일 하루 격추 주장은 공중 97기, 지상 격파·손상 약 225기였다.", "3월 20일 16시 30분(1630)경 제58.2기동부대군이 약 15기에 공격받아 전투기가 7기, 함포가 7기를 격추했으나, 엔터프라이즈가 아군 포화에 맞아 화재로 비행 작업 불능이 되고 항공기 8기를 잃었다. 구축함 Halsey Powell(핼시 파월)이 항공기에 피해를 입어 10노트밖에 내지 못했다.", "3월 21일 14시(1400) 북서쪽 100마일에서 대편대가 탐지되어 단시간에 전투기 150기가 발진했고, 제38.1기동부대군의 전투기 24기가 약 50마일 밖에서 베티(Betty) 32기와 단발 전투기 약 16기를 요격해 전부 격추, 아군 손실은 2기였다.", "격추된 베티들은 각기 동체 아래에 소형기 1기를 달고 있었고, 이것이 나중에 바카(Baka) 폭탄으로 확인되었다 — 바카가 확인된 최초의 사례다."], "primary": "3. 다음의 짧은 기록들은 오키나와 작전 기간 중 제58기동부대가 거둔 성과의 주요 대목 가운데 일부다.\n\n—2—\n\n**(a) 3월 18일부터 21일까지 — KYUSHU(규슈)와 내해(Inland Sea) 공격**\n\n3월 17일 주간에는 어떤 미확인기(bogey)도 본 부대를 괴롭히지 않았다. 구축함 12척의 초계선을 함대 침로에 직각으로 30마일 앞에 배치했다. 이 구축함들은 18일 새벽에 두 무리로 나뉘어 두 개의 레이더 초계군을 이루었는데, 하나는 기동부대 북쪽 30마일, 다른 하나는 서쪽 30마일에 두었다. 각 레이더 초계군에는 최소 8기의 전투기로 이루어진 전투공중초계(CAP)를 붙였다. 이 CAP는 구축함이 관제했다. 공격이 전개될 때마다 CAP를 16기의 VF(전투기)로 늘렸다.\n\n첫 미확인기는 3월 17~18일 밤 21시 45분(2145)에 탐지되었고, 그때부터 본 부대는 계속 미행당했다. 미행기 가운데 2기를 엔터프라이즈(Enterprise)의 야간전투기가 격추했다. 잠수함 접촉 2건도 구축함 경계막이 공격했다.\n\n3월 18일 05시 45분(0545), KYUSHU(규슈) 남단 동쪽 약 100마일 지점에서 첫 전투기 소탕대(fighter sweep)와 CAP가 발진했다. 이 소탕대는 대체로 각 기동부대군에서 약 32기의 전투기로 이루어졌다. 소탕대에 이어 45분 뒤 각 기동부대군에서 약 60기의 VT(뇌격기)와 VB(폭격기)가 약 40기의 전투기 호위를 받아 공격에 나섰다. VF 소탕대의 목표는 공중과 지상 양쪽에서 적기를 파괴하는 것이었다. VB/VT 공격대는 주요 비행장 시설을 파괴하도록 지시받았다. 각 기동부대군의 항공 공격 계획은 첨부 (F)에 있다. 기동부대 사령관의 지시는 참조 (b)에 실려 있다.\n\n오전 중 규슈 상공의 적 항공 저항이 미미했고 목격된 항공기도 많지 않았으므로, 오후 공격대에는 원래 3월 19일에 공격하기로 계획되어 있던 더 내륙의 목표를 치도록 명령했다. 이는 유익한 조치였음이 드러나, 우리 소탕·공격·수색기가 적기 102기를 격추했고 지상에서 약 275기를 추가로 파괴하거나 손상시켰다. 주요 비행장 시설이 크게 피해를 입었고 — 입은 손상을 담은 훌륭한 사진들이 촬영되었다.\n\n자기네 해안에서 100마일 떨어진 우리의 존재에 대한 적의 항공 대응은 투입된 항공기 수로 보면 미미했으나, 공격은 공격적이고 단호하게 수행되었다. 구름을 엄폐물로 쓴 단기의 적기들이\n\n—3—\n\n본 부대 상공에 나타나 어떤 경우에는 자살공격으로 보이는 것을 시도했으나 아마도 모두 강하게 밀어붙인 활공폭격이었을 것이다. 많은 항공기가 강력하고 잘 통제된 포화에 격추되었지만, 그럼에도 Yorktown(요크타운)과 Enterprise(엔터프라이즈)가 폭탄에 맞았고, Intrepid(인트레피드)는 포화에 격추된 쌍발기의 근접탄을 입었다. 요크타운의 손상은 경미했고 엔터프라이즈에 맞은 폭탄은 폭발하지 않았다. 따라서 모든 항모가 비행 작업을 계속할 수 있었다. 본 부대의 레이더가 경보를 거의 또는 전혀 주지 못했고, 때로는 항공기 접근의 첫 징후가 근접 경계막의 육안 목격이었으므로 힘든 시기였다. 초계 구축함들의 육안 목격은 값을 매길 수 없이 소중했다. CAP는 모두 12기를 격추했고 기동부대의 대공포화가 21기를 더 떨어뜨렸다.\n\n18일 오전 중 제58.3기동부대군 소속기의 사진 정찰로 내해에 다수의 주력 함대 부대가 있음이 드러났다. 제58기동부대 사령관(CTF 58)은 이튿날 이 함정들을 공격하되 KURE(구레)와 KOBE(고베)의 항만 시설을 대체 목표로 삼기로 결정했다. 그 사이에 놓인 SHIKOKU(시코쿠)와 서부 HONSHU(혼슈)의 비행장에 대한 전투기 소탕은 이 공격의 앞뒤로 실시하기로 했다.\n\n3월 18~19일 밤은 조용히 지나갔다. 엔터프라이즈에서 발진한 야간 수색기가 전함(BB) 1척과 항모(CV) 1척이 KII(기이) 수도로 빠져나갈 가능성을 보고했으나 뒤이은 새벽 수색으로 이 보고는 사실이 아님이 밝혀졌다. 첫 소탕대가 05시 25분(0525)에 발진했고 뒤이어 공격대가 나갔다. 제58.3기동부대군과 제58.1기동부대군은 구레의 군함에 집중했고, 제58.3기동부대군과 제58.1기동부대군은 구레의 군함에 집중했고, 제58.4기동부대군은 고베의 군함에, 제58.2기동부대군은 구레 해군항공창 구역의 목표와 시설에 집중했다. 일본군(Jap) 함대는 구레와 HIROSHIMA(히로시마) 항에서 발견되었다. 공격은 그저 그런 정도의 성공에 그쳤는데, 주된 까닭은 맞닥뜨린 대공포화가 극도로 강력하고 정확했기 때문으로, 한 부대군만도 구레 상공에서 항공기 13기를 잃었다. 사진으로 함대 부대에 대한 다음의 손상이 판정되었다:\n\n**구레(KURE) — (손상)**\n\n- 야마토(Yamato)급 전함(BB) 1척 — 경미한 손상.\n- 이세(Ise)급 전함/항모(BB/CV) 1척 — 폭탄 여러 발 명중.\n- 항모(CV) 2척 — 경미한 손상.\n- 경항모(CVL) 1척 — 중간 정도로 연소 중.\n- 중순양함(CA) 1척 — 도네(Tone)급.\n- 경순양함(CL) 1척 — 오요도(Oyodo) — 심대한 손상 — 격렬히 연소 중.\n- 구축함(DD) 2척 — 경미한 손상.\n\n**고베(KOBE) — (손상)**\n\n- 항모(CV) 1척 — 선체에 500파운드 폭탄 3발 명중.\n- 호위항모(CVE) 1척 — 500파운드 폭탄 5발 명중 — 심대한 손상.\n- 잠수함(SS) 1척 — 경미한 손상.\n\n—4—\n\n이 밖에 조종사들은 잠수함(SS) 1척을 격침했을 것으로, 호위항모(CVE) 1척과 잠수함(SS) 2척을 손상시킨 것으로 보고했고, 내해 여러 곳에서 상당수의 상선·연안 선박·소형 선박을 격침하거나 손상시켰다고 보고했다.\n\n첫 소탕대와 공격대가 발진한 직후, 주로 다른 부대군들보다 20마일 북쪽에 있던 제58.2기동부대군을 향해 공격이 전개되었다. Franklin(프랭클린)과 Wasp(와스프)가 피격되었다. 프랭클린은 공격대를 절반쯤 발진시킨 상태에서 맞아 맹렬히 불탔다. 함이 수평선 아래로 내려간 뒤에도 여섯 차례의 거대한 폭발이 목격되었다. 와스프는 제2갑판과 제3갑판 사이에서 터진 폭탄에 맞았음에도 여느 때처럼 화재를 진압하고 한 시간 안에 항공기를 운용할 수 있었다. 보일러실 하나가 침수되어 속력은 28노트로 떨어졌다. 그러고 나서 모든 기동부대군이 공격을 받았는데, 날씨는 적에게 완벽했다 — 2,500피트에 7/10의 얇은 구름층. 레이더는 이번에도 감당하지 못했다. 최소 6기가 제58.3기동부대군을 공격했는데 모두 구름 높이로 들어와 45도 각도로 강하했다. 여섯 기 모두 산산조각으로 날아갔으나 모두 근접탄이 되었다. 이 항공기들이 자살기였는지 아닌지는 말할 수 없었고, 두말할 것 없이 언제나 항모가 그들의 표적이었다.\n\n대공 사격은 훌륭했다. 어쩌면 포수들이 사거리를 한참 벗어난 데서부터 사격을 개시하는 경향이 있었을지 모르나, 그 사격이 무엇보다 든든했으므로 아무도 그것을 말리려 하지 않았다.\n\n19일 오후 기동부대는 프랭클린을 엄호하며 물러났고, 동시에 부대가 남쪽으로 천천히 철수하는 동안 계획될 법한 공격을 흐트러뜨리기 위해 규슈 비행장에 전투기 소탕대를 발진시켰다. 소탕은 지상의 상당수 항공기를 파괴하는 데 성공했다. 그날 저녁 기동부대에 대한 유일한 공격은 약 8기에 의한 것이었는데 80마일 밖에서 요격되어 5기가 격추되었고 나머지는 기지로 달아났다. 그날 대공포화와 항공기에 의해 공중에서 격추했다고 주장한 항공기 총수는 97기였고, 지상에서 약 225기를 추가로 파괴하거나 손상시켰다.\n\n3월 19~20일 밤에는 미행기가 나타나지 않았다. 20일 새벽 프랭클린과 제58.2기동부대군의 대부분은 기동부대에서 북쪽 40마일, 가장 가까운 적 기지에서 약 160마일 되는 곳에 있었다. 이때 프랭클린은 Pittsburgh(피츠버그)에 예인되어 약 5노트를 내고 있었다. 프랭클린의 타는 한쪽으로 끝까지 꺾인 채 고착되어 애를 먹이고 있었다.\n\n—5—\n\n20일은 비교적 조용히 지나갔으나, 미행기가 다시 나타났고 16시 30분(1630)경 제58.2기동부대군이 적기 약 15기의 공격을 받았다. 적기들은 낮고 매우 빠르게 접근한 뒤 흩어져 개별 공격에 들어갔다. 7기는 전투기가, 7기는 함정 포화가 격추했다. 엔터프라이즈가 아군 포화에 맞아 화재가 일어나 비행 작업을 할 수 없게 되었고 항공기 8기를 잃었다. 구축함 Halsey Powell(핼시 파월)은 Hancock(핸콕)의 현측에서 벗어나던 중, 핸콕을 아슬아슬하게 빗나간 항공기에 손상을 입었다. 이 피격의 결과 핼시 파월은 10노트밖에 낼 수 없게 되어 우리의 남하 철수를 더 지연시켰다. [원문 결락]은 이때쯤 자력으로 15노트까지 속력을 올려 놓았고 점차 기동부대의 남쪽으로 옮겨 가고 있었다.\n\n해질 무렵 미행기가 더 나타났고, 공중에 있던 야간전투기들은 그들의 급격한 기동과 채프(window)의 영리한 사용 때문에 요격하지 못했다. 23시(2300)경 제58.3·58.1기동부대군에 대한 8기의 뇌격이 있었으나 실패했다. 미행기들은 밤새 우리 위치를 계속 보고했는데, 그중 3기는 대공포화에 격추되었다.\n\n3월 21일 14시(1400), 북서쪽 100마일에서 대규모 항공기 무리가 레이더에 탐지되었다. 추가 전투기를 긴급 발진시켜 매우 짧은 시간 안에 모두 150기의 전투기가 공중에 떴다. 제38.1기동부대군의 전투기 24기가 본 부대에서 약 50마일 떨어진 곳에서 베티(Betty) 32기와 약 16기의 단발 전투기를 요격했고, 아주 짧은 사이에 모든 베티와 모든 전투기가 격추되었으며 아군 전투기 손실은 2기였다. 베티들은 각기 동체 아래에 소형 항공기 1기씩을 달고 있는 것이 목격되었다. 이것들은 나중에 바카(Baka) 폭탄으로 확인되었다. 이것이 바카가 알려진 최초의 출현이었다.", "secondary": "3. The following brief accounts are some of the highlights of\nTask Force FIFTY-EIGHT's accomplishments during the OKINAWA operations.\n--2--\n(a) 18 to 21 March -- Attacks on KYUSHU and Inland Sea\nNo bogies worried the Force during daylight on the 17th\nof March. A scouting line of twelve destroyers was placed\nthirty miles ahead, normal to the Fleet Course; these destroyers\nsplit at dawn on the 18th into two groups and formed\ntwo radar patrol groups, one 30 miles North and one 30 miles\nto the West of the Task Force. A combat air patrol of at\nleast eight fighters for each radar patrol group was provided.\nThis CAP was controlled by the destroyers. Whenever an attack\ndeveloped the CAP was increased to 16 VF.\nThe first bogey was detected at 2145 on the night of\n17-18 March and from then on the Force was shadowed continuously.\nTwo of the shadowers were shot down by the Enterprise\nnight fighters. Two submarine contacts were also attacked\nby the destroyer screen.\nAt 0545 on the 18th of March, the first fighter sweeps\nand CAP were launched from a position approximately 100\nmiles to the East of the Southern tipi of KYUSHU. These\nsweeps consisted generally of about 32 fighters from each\nTask Group. The sweeps were followed three-quarters of an\nhour later by strikes from each Task Group of about 60 VT\nand VB escorted by approximately 40 fighters. The VF sweeps\nhad as their objective the destruction of enemy aircraft,\nboth in the air and on the ground. The VB/VT strikes were\ndirected to destroy primary airfield installations. The air\nplan of attack for the various Task Groups is shown in enclosure\n(F). The Task Force Commander directives are contained\nin reference (b).\nAs the air opposition over KYUSHU during the forenoon\nwas of a minor nature and not many aircraft were seen, the\nafternoon strikes were ordered to attack targets further inland\nwhich originally had been planned to be attacked on 19\nMarch. This proved to be a profitable move and 102 enemy\naircraft were shot down by our sweep, strike, and search\nplanes and about 275 additional aircraft were destroyed or\ndamaged on the ground. Primary airfield installations suffered\nheavily--excellent photographs being taken of the\ndamage incurred.\nThe enemy air reaction to our presence, 100 miles from\ntheir coast, was slight in the number of aircraft employed,\nbut the attacks were conducted in an aggressive and determined\nmanner. Single enemy aircraft using cloud cover were\n--3--\nover the force and attempting what in some cases may have\nbeen suicide attacks but were probably all well-pressed home\nglide bombing attacks; many aircraft were shot down by heavy\nand well directed gunfire, but nevertheless\nYorktown and\nEnterprise were hit by bombs, and\nIntrepid\nsuffered a near\nmiss by a twin-engine plane shot down by gunfire. Damage\nto Yorktown was minor and the bomb that hit Enterprise\nfailed to explode; consequently, all carriers were able to\ncontinue flight operations. It was a trying period, as\nlittle, if any, warning was being given by the radars in\nthe Force, and t times the first indication of an aircraft\napproaching was visual sighting by the close screen. The\npicket destroyers were invaluable with their visual sightings.\nThe CAP shot down a total of 12 aircraft and Task Force\nanti-aircraft fire splashed 21 more.\nDuring the morning of the 18th, photo reconnaissance by\nplanes from Task Group 58.3 disclosed a large number of major\nfleet units in the Inland Sea. Commander Task Force 58\ndecided to attack these units the following day with the\nharbor installations at KURE and KOBE as alternate targets.\nFighter sweeps against intervening airfields on SHIKOKU and\nWestern HONSHU were to precede and follow these strikes.\nThe night of 18-19 March passed quietly. A night search\nlaunched form the Enterprise reported the possibility of a\nBB and CV leaving by the KII Channel but a subsequent dawn\nsearch proved this report to be incorrect. The first sweep\nwas launched at 0525 and followed by the strikes. Task Groups\n58.3 and 58.1 concentrated on warships at KURE, Task Groups\n58.3 and 58.1 concentrated on warships at KURE, Task Group\n58.4 on those at KOBE, and Task Group 58.2 on targets and\ninstallations in the KURE Naval Air Depot Area. The Jap\nFleet was found at KURE and HIROSHIMA harbors. The attack\nwas only moderately successful, mainly because of the extremely\nheavy and accurate AA fire encountered, one group\nalone losing 13 aircraft over KURE. From photographs the\nfollowing damage to fleet units was assessed:\nKURE - (Damaged)\n-\n1 Yamato Class BB--slight damage.\n1 Ise Class BB/CV--several bomb hits.\n2 CV--slight damage.\n1 CVL--burning moderately\n1 CA--Tone Class\n1 CL--Oyodo--severe damage--burning badly.\n2 DD--slight damage\nKOBE - (Damaged)\n-\n1 CV--hull hit by 3 500lb. bombs.\n1 CVE--hit by 5 500lb. bombs--severely damaged.\n1 SS--slightly damaged.\n--4--\nIn addition pilots reported probably sinking 1 SS and damaging\n1 CVE and 2 SS, and sinking and damaging a considerable\nnumber of merchant ships, coastal vessels and small craft at\nvarious locations in the Inland Sea.\nShortly after the first sweep and strike had been launched\nan attack developed, mainly on Task Group 58.2, which\nwas 20 miles to the Northward of the other groups. Franklin\nand Wasp were hit. Franklin was hit half way through\nlaunching her strike and burned fiercely; six enormous explosions\nwere seen when the ship was below the horizon.\nWasp, although hit by a bomb which exploded between her second\nand third decks, put out the usual fire and was able to\nwork aircraft within an hour. Owing to a flooded boiler\nroom her speed was reduced to 28 knots. All Task Groups\nthen came under attack, the weather being perfect for the\nenemy--a thin layer of 7/10 clouds at 2500 feet. Radar\nagain was unable to compete. At least six aircraft attacked\nTask Group 58.3, all coming in at cloud level and diving\nat an angle of 45 degrees; all six were blow to pieces, but\nthey were near misses. It was impossible to say whether\nthe aircraft were suicides or otherwise and, needless to say,\ncarriers were invariably their targets.\nThe AA gunnery was excellent. Perhaps gun crews were\ninclined to open fire well out of range but no one attempted\nto stop them as their fire was most comforting.\nDuring the afternoon of the 19th the Task Force retired,\ncovering the Franklin and at the same time launching fighter\nsweeps against KYUSHU airfields in order to disorganize any\nproposed attack on the Force as it withdrew slowly to the\nSouthward. The sweep was successful in destroying fair\nnumbers of aircraft on the ground. The only attack on the\nTask Force that evening, by about eight planes, wsa intercepted\n80 miles away and five aircraft were shot down, the\nothers escaping to their bases. The total number of aircraft\nclaimed for the day,k shot down in the air by AA and\naircraft, was 97 planes with approximately 225 additional\naircraft destroyed or damaged on the ground.\nNo shadowing aircraft put in appearance during the night\nof 19-20 March. At dawn on the 20th, the Franklin and the\nmajority of Task Group 58.2 were 40 miles to the North of\nthe Task Force and about 160 miles from the nearest enemy\nbase. At this time the Franklin was being towed by the\nPittsburgh\nand making about 5 knots. Her rudder was jammed\nhard over and was causing trouble.\n--5--\nAfter a moderately quiet day on the 20th, shadowers\nagain put in their appearance and at about 1630, Task Group\n58.2 was attacked by about 15 enemy aircraft which approached\nlow and very fast and then split up for individual attacks.\nSeven planes were shot down by fighters and seven\nby ship's gunfire. Enterprise was hit by own forces' gunfire\nand a fire developed which put her out of action for\nflying operations, and destroyed 8 planes. The destroyer\nHalsey Powell,\nwhile clearing the side of the\nHancock, was\ndamaged by a plane which narrowly missed the Hancock. As a\nresult of this hit Halsey Powell was able to make only ten\nknots, causing more delay in our retirement to the Southward.\nby this time had managed to work up to 15 knots\nunder her own power and was gradually working to the Southward\nof the Task Force.\nMore shadowers appeared at sunset, and the night fighters\nwhich were airborne were unable to intercept them owing\nto their radical maneuvers and intelligent use of window.\nAt about 2300, an unsuccessful 8-plane torpedo attack on\nTask Groups 58.3 and 58.1 took place. Shadowing aircraft\ncontinued to report our position during the night, although\nthree of them were shot down by AA fire.\nAt 1400 on 21 March, a large group of aircraft were detected\nby radar 100 miles to the Northwest. Extra fighters\nwere scrambled and altogether 150 fighters were airborne\nin a very short space of time. Twenty-four fighters from\nTask Group 38.1 intercepted 32 Bettys and about 16 single-engine\nfighters about 50 miles from the Force, and in a very\nshort while all the Bettys and all of the fighters had\nbeen shot down for the loss of 2 of our own fighters. The\nBettys were seen to be carrying one small plane each\nunder the fuselage. These were subsequently identified as\nBaka Bombs. This was the first known appearance of the Baka.", "note": "이 장은 1945년 3월 17일부터 21일까지의 작전을 다룬다. 원문에 'Jap Fleet'라는 멸칭 표기가 나오며 그대로 옮겼다(제58기동부대 원문 표기). 원문에는 전사 과정에서 생긴 오식이 여럿 있어 그대로 두었다 — 'southern tipi of KYUSHU'(tip), 'at times'를 'at times'로 적어야 할 자리의 't times', 'was'를 'wsa'로, 'day'를 'day,k'로, 'from'을 'form'으로, 'blown to pieces'를 'blow to pieces'로 적은 것 등. 특히 3월 19일 대목의 'Task Groups 58.3 and 58.1 concentrated on warships at KURE'라는 문장이 원문에 두 번 연달아 인쇄되어 있는데, 중복 그대로 옮겼다. 또한 3월 21일 요격 부대를 원문은 'Task Group 38.1'로 적고 있으나 본 보고의 문맥상 제58.1기동부대군의 오식으로 보인다 — 원문 표기를 유지했다. 3월 20일 대목의 '__ by this time had managed to work up to 15 knots'는 문장 첫머리의 함명(문맥상 Franklin)이 원문에서 빠져 있어 [원문 결락]으로 표시했다. 오식과 결락이 다수 있어 confidence를 medium으로 두었다.", "warn": true, "search": "18 to 21 March -- Attacks on KYUSHU and Inland Sea Marc A. Mitscher 마크 A. 미처 — 미 해군 중장, 제58기동부대 사령관"}, {"id": "tf58-3", "order": 14, "date": "1945-03-21", "group": "B", "eyebrow": "제58기동부대 작전 보고 · 미처 중장", "title": "오키나와 항공 지원의 시작과 4월 6~7일 — 특공의 총력 공격과 야마토 격침", "list_right": "본문", "meta": [{"k": "다루는 시점", "v": "1945-03-21"}, {"k": "문서 일자", "v": "1945-06-18"}, {"k": "성격", "v": "본문", "txt": true}, {"k": "원제", "v": "Task Force 58 Air Support Operations at OKINAWA (23 March to 1 April 1945); 6th and 7th of April", "txt": true}], "summary": "3월 23일 시작된 오키나와 상륙 준비 항공 지원과, 4월 6일 일본군이 마침내 감행한 총력 항공 공격, 그리고 4월 7일 386기의 공격대가 야마토(Yamato) 이하 일본 수상부대를 격멸한 경과를 기록한 대목이다.", "points": ["3월 22일 병참지원군과 만나 급유·보급·항공기 및 조종사 보충을 받고 기동부대를 3개 군으로 재편했으며, 제58기동부대 사령관 참모부의 영국 연락장교가 이 첫 보급 기간에 미 태평양함대의 다재함·위력·효율을 온전히 알게 되었다고 공식 보고했다.", "3월 23일 00시 28분(0028) USS Haggard(해거드)가 적 잠수함을 들이받아 격침했고, 3월 24일 고속전함들이 오키나와 남동쪽 시위 해안을 포격했으며 제58.1기동부대군이 적 수송선단(중형 화물선 3척, 호위구축함 1척, 지도리형 수뢰정 1척, 기타 호위함 3척)을 격멸했다.", "4월 6일 일본군의 총력 공격이 전개되어, 12시 45분(1245)부터 산발적 공격이 종일 이어졌다. 두 기동부대군 합계 249기의 공중 격파를 기록했고 그중 제58.1기동부대군이 오키나와 상공에서 136기를 주장했으며 Essex(에식스)는 하루에 65기를 격추해 항모 기록에 근접했다.", "4월 6일 공중전 손실은 아군 2기 대 적 236기였다(원문 표기 그대로).", "4월 7일 08시 22분(0822) 에식스 수색대가 야마토급으로 보이는 전함 1척, 순양함 2척, 구축함 8척을 북위 31도 22분·동경 129도 15분에서 발견해 최초 보고했다.", "주공격대의 발진 규모는 전투기 180기, 폭격기 75기, 뇌격기 131기로 합계 386기였다. 발진 위치에서 적 함대 추정 위치까지는 약 240마일이었다.", "원래 전력 전함 1척·경순양함 1척·구축함 8척 가운데 야마토, 경순양함 1척, 구축함 4척이 격침되었고 구축함 1척이 심대한 손상(데루쓰키급), 1척이 연소 상태로 남았으며 2척은 심각한 손상을 입지 않은 것으로 보였다.", "이 공격에서 아군 손실은 폭격기 4기, 뇌격기 3기, 전투기 3기이며 인명 손실은 조종사 4명과 항공승무원 8명, 나머지는 구조되었다.", "같은 날 12시 10분(1210) 특공기 1기가 Hancock(핸콕)의 좌현 전방 승강기 바로 뒤에 돌입해 29명 전사, 약 35명 실종, 71명 부상을 냈으나, 45분 만에 옅은 연기만 남을 정도로 손상통제가 이루어졌고 16시 30분(1630) 귀환기를 착함시켰다."], "primary": "기동부대가 BORODINO(보로디노) 제도에서 100마일밖에 떨어져 있지 않았으므로, VFN(야간전투기) 4기의 소탕대를 MINAMI DAITO(미나미다이토) 비행장에 보냈다. 비행장에서는 항공기 4기밖에 보이지 않았고, 이들과 소형 선박 몇 척에 맹렬한 기총소사를 가했다.\n\n이튿날 아침(3월 22일) 병참지원군(Logistic Support Group)과 만나 급유, 식량 보급, 탄약 보충, 그리고 보충 항공기와 조종사 인수로 매우 분주한 하루를 보냈다. 기동부대는\n\n—6—\n\n오키나와에 대한 작전 개시를 위해 3개 군으로 재편되었다. 함정들이 사방으로 움직이고 있었다. 제58기동부대 사령관 참모부의 영국 연락장교는 「이 첫 보급 기간에야 비로소 미합중국 태평양함대의 다재함과 위력과 효율을 온전히 알게 되었다」고 공식 보고했다.\n\n**(b) 오키나와에서의 제58기동부대 항공 지원 작전(1945년 3월 23일부터 4월 1일까지)**\n\nKERAMA RETTO(게라마 열도)를 포함한 OKINAWA(오키나와)와 인접 도서에 대한 초기 항공 작전은 주 상륙일 9일 전에 시작되었다. 이 작전들은 연안포대를 포함한 모든 알려진 시설에 대한 광범위한 폭격의 형태를 띠었으며, 소해 작전과 게라마 열도 상륙을 위해 그 구역을 준비하도록 설계되었다. 이에 더하여 완전한 사진 정찰 자료를 확보하여 상륙 직전에 상륙 부대 사령부에 전달했다.\n\n3월 23일 00시 28분(0028), 제58.4기동부대군의 일원으로 작전 중이던 USS Haggard(해거드)가 적 잠수함을 들이받아 격침했다. 3월 24일 고속전함들이 오키나와의 남동 시위(示威) 해안(Southeastern Demonstration Beaches)에 효과적인 포격을 가했다. 같은 날 제58.1기동부대군은 오키나와 북서쪽 150마일에서 발견된 적 수송선단을 격멸했는데, 이 선단은 중형 화물선(AK) 3척, 호위구축함(DE) 1척, 지도리(Chidori)형 수뢰정 1척, 기타 호위함 3척으로 이루어져 있었다. 관련된 모든 부대의 작전은 순조롭게 계획대로 진행되었다. 적의 항공 저항은 전무했고, 규슈 시설에 대한 우리의 초기 공격이 기대했던 것 이상으로 적의 항공 작전을 방해했음이 점점 분명해졌다.\n\n**(c) 4월 6일과 7일**\n\n일본군이 해안과 지원 부대 양쪽에 가할 것으로 예상되던 총력 공격이 마침내 4월 6일에 전개되었다. 그때까지 기동부대 전체로 보면 걱정할 일이 거의 없었으나, 6일 새벽부터 일본군(the Japs)이 본때를 보이려 한다는 것이 분명해졌다. 오전 중 미행기 또는 특공기(suicider)로 보이는 7기가 격추되었고, 12시 45분(1245)에 그 자리에 있던 두 기동부대군, 즉 58.1과 58.3에 대해 간헐적인 공격이 전개되었다. 이 공격은 그날 남은 시간 내내 계속되었다. 제58.3기동부대군의 Cabot(캐벗)은 갑판을 스치듯 지나갔으나 빗나간 특공기에 아슬아슬하게 화를 면했다. 순양함 2척도 폭탄의 근접탄을 입었고, 본 부대 인근에서 모두 약 30기가 격추되었다. 제58.1기동부대군에서는 항모 3척이 근접탄을 입었다. 항모 한 척, San Jacinto(샌재신토)가 경미한 손상을 입었다. 기동부대군들과\n\n—7—\n\n초계 구축함들 사이의 연결함으로 본 부대에서 떨어져 있던 구축함 1척이 특공기에 피격되어 부대에서 분리해야 했다. 레이더 초계 구축함군은 이번에도 큰 성과를 올렸다 — 구축함 한 척만으로 특공기 3기를 격추했고 그들의 CAP는 적기 6기를 격추했다. 오키나와 상공의 기동부대 전투공중초계와 북쪽 도서 상공의 전투기 소탕·초계는 매우 정신없는 시간을 보냈고, 두 기동부대군을 합쳐 모두 249기의 공중 항공기를 격파했는데 그중 제58.1기동부대군이 오키나와 상공에서 136기를 주장했으며, Essex(에식스)는 그날 하루 소속기가 65기를 격추해 항모 기록을 거의 깰 뻔했다. 그날 우리 자신의 공중전 손실은 모두 2기였고 적은 236기였다.\n\n4월 6~7일 밤, BUNGO SUIDO(분고 수도) 해협[내해의 남동쪽 입구 — 규슈와 혼슈 사이 — 소설 『Run Silent, Run Deep』에 등장한다 — HyperWar 주] 앞바다에서 초계 중이던 우리 잠수함 한 척이 남쪽으로 향하는 적 수상부대를 보고했다. 모든 기동부대군에 오키나와 북동쪽으로 집결하라는 명령이 내려졌다. 새벽에 4기 단위의 전투기 40기로 이루어진 수색기가 발진하여 336도에서 056도 사이를 325마일 깊이로 수색했고, 08시 22분(0822) 에식스의 한 수색조가 최초의 적 발견 보고를 했다 — 전함 1척(아마도 야마토급), 순양함 2척, 구축함 8척, 위치 북위 31도 22분·동경 129도 15분, 침로 300도, 속력 12노트. (접촉 보고는 100마일과 200마일에 있던 중계기 2대를 이용해 VHF로 신속히 수신되었다.) 추적·엄호 부대로 전투기 16기가 09시 15분(0915)에 발진했고, 10시(1000)에 제58.1·58.3기동부대군의 공격대가, 그로부터 45분 뒤 제58.4기동부대군의 공격대가 뒤따랐다. 원래 의도는 모든 기동부대군이 함께 발진하는 것이었으나 제58.4기동부대군이 제때 준비를 마치지 못했다. 핸콕(Hancock)의 항공전대(뇌격기 12기, 폭격기 15기, 전투기 24기)는 이륙이 15분 늦어 합류에 실패했고 결국 적을 찾지 못했다. (적의 항적과 공격의 도해는 첨부 (D) 참조.)\n\n주공격에서 발진한 항공기 수는 모두 다음과 같았다:\n\n| 기종 | TG 58.1 | TG 58.3 | TG 58.4 | 합계 |\n|---|---|---|---|---|\n| VF(전투기) | 52 | 80 | 48 | 180 |\n| VB(폭격기) | 21 | 29 | 25 | 75 |\n| VT(뇌격기) | 40 | 58 | 33 | 131 |\n| **총계** | | | | **386** |\n\n모든 어벤저(Avenger, VT)기는 어뢰를 실었고, 헬다이버(Helldiver, VB)기는 1,000파운드 반철갑탄(SAP)과 통상탄(GP), 그리고 250파운드 통상탄 2발을 섞어 실었으며, 전투기는 500파운드 통상탄 1발과 함께 장거리 연료탱크를 달았다.\n\n—8—\n\n발진 위치는 북위 27도 10분, 동경 129도 30분으로, 적 함대의 추정 위치까지 약 240마일 거리였다. 미행기로부터는 죽은 듯한 침묵이 이어졌는데, 이는 10시 30분(1030)에야 깨져 적 부대가 북쪽으로 침로를 바꾸었다는 보고가 들어왔고, 곧이어 오키나와에서 온 수색기가 접촉하여 적의 침로를 확인해 주었다. 이 기체는 그날 남은 시간 내내 미행하며 훌륭한 일을 해냈다. 대체로 그 뒤로는 미행 보고가 기동부대 사령관에게까지 전달되지 못했으나, 결과적으로 공격대 지휘관들이 곧 미행기와 연락이 닿았고 공격대의 항로에 놓인 섬들이 항법 문제를 간단하게 만들어 주었다. 최종 유도는 SB2C의 레이더(APS-4)로 이루어졌는데, 이 레이더는 6,000피트 고도에서 32마일 거리의 적 부대를 포착했다.\n\n적 전투함대는 북위 30도 34분, 동경 128도 08분에서 발견되었으며, 이는 최초 발견 보고 지점으로부터 225도 방향 약 70마일이었다. 날씨는 나빠 3,000피트에 8/10의 구름이 덮여 있었다. 낮은 운고와 너무 많은 항공기 때문에 공격을 협조하기가 대단히 어려웠다. 대공포화는 강력했으나 부정확했고, 첫 두 공격대(58.1과 58.3 순)가 야마토(Yamato)와 순양함 1척, 구축함 3척에 다수의 어뢰 및 폭탄 명중을 주장했다. 제58.4기동부대군의 공격대는 도착해 보니 야마토가 눈에 띄게 기울어 있었고, 다수의 폭탄과 어뢰 6발을 명중시켰는데 그중 5발은 높이 들린 쪽 현측에 맞았다 — 야마토는 폭발했다. 물 위에 멈춰 선 채 발견된 경순양함(CL, 아가노(Agano)급)은 어뢰 약 4발과 1,000파운드 폭탄 8발을 맞고 바닥으로 가는 길을 재촉당했다. 원래 전력이었던 전함 1척, 경순양함 1척, 구축함 8척 가운데 야마토와 경순양함 1척, 구축함 4척이 격침되었고, 구축함 1척(데루쓰키(Terutsuki)급)이 크게 손상되었으며 1척은 불타는 채로 남았다. 구축함 2척은 심각한 손상을 입지 않은 것으로 보였다. 우리 자신의 항공기 손실은 가벼워 폭격기 4기, 뇌격기 3기, 전투기 3기였다. 인명 손실은 조종사 4명과 항공승무원 8명이었고 나머지는 구조되었다.\n\n12시 10분(1210), 공격대가 나가 있는 동안 본 부대가 4기의 무리에게 공격받았다. 그중 3기는 부대로 들어오는 길에 격추되었고, 네 번째 기체는 제58.3기동부대군 한복판의 구름을 뚫고 나와 길어야 1분 동안 포화를 받은 뒤 핸콕(Hancock)에 돌입했는데, 기체와 함께 실려 있던 폭탄이 전방 승강기 바로 뒤 좌현에 명중했다. 비행갑판의 양 끝과 격납갑판 앞부분이 즉시 화염에 휩싸였고 자욱한 연기가 함을 감쌌다. 놀랍도록 짧은 45분 만에 옅은 연기 몇 가닥만이 보일 뿐이었다 — 그 함의 손상통제\n\n—9—\n\n효율을 보여 주는 매우 인상적인 증명이었다. 29명이 전사하고 약 35명이 실종되었으며 71명이 부상했으나, 함은 16시 30분(1630) 돌아온 자기 항공기들을 착함시킬 수 있었다. 비상시에는 항공기를 운용할 수 있었음에도 핸콕은 수리를 위해 본 부대에서 분리해야 했다. 레이더 초계선의 CAP는 이 작전 전체를 통틀어 최고의 날을 보내, 그날 공중에서 격파된 총 54기 가운데 14기를 격추했다.\n\n이튿날에는 일본 부대의 잔존 함정을 마무리하기 위해 수색에 이어 폭탄을 단 전투기 32기의 소탕대를 발진시켰다. 수색과 소탕은 325마일까지 나갔으나 그들을 찾지 못했다. 수색에 나선 코르세어(Corsair) 1기가 구명정에 탄 격추 조종사를 발견하고 일곱 시간 반 동안 공중에 머물렀다. 이는 165 미국 갤런 낙하탱크 하나를 단 코르세어로서는 사상 최고 기록으로 여겨지며, 엔진을 경제적으로 운용할 줄 아는 조종사가 무엇을 할 수 있는지를 보여 준다.\n\n**(d) 4월 11일과 12일**\n\n4월 11일 새벽, 제58기동부대(보급차 떠나 있던 제58.4기동부대군 제외)는 오키나와 동쪽에 집결해 있었다. 모든 징후가 분주한 하루를 가리키고 있었다. 오키나와에서의 지원 임무는", "secondary": "As the Task Force was only 100 miles from BORODINO Islands\na sweep of 4 VFN was sent over MINAMI DAITO airfields.\nOnly four aircraft were seen on the field and these together\nwith a few small craft were heavily strafed.\nThe Logistic Support Group was met the following morning\n(22 March) and a very busy day was spent fueling,\nprovisioning, replenishing ammunition, and receiving replacement\naircraft and pilots. The Task Force was reorganized\ninto three groups for the commencement of\n--6--\noperations against OKINAWA. Ships were moving everywhere.\nThe British Liaison Officer on the Staff of Commander Task\nForce 58, reported officially, \"that it was during this\nfirst replenishment period that he became fully aware of\nthe versatility, power and efficiency of the United States\nPacific Fleet.\"\n(b) Task Force 58 Air Support Operations at OKINAWA (23 March to 1 April 1945)\nInitial air operations against OKINAWA and adjacent islands,\nincluding KERAMA RETTO, commenced 9 days before the date of the\nmain landing. These operations took the form of extensive\nbombing attacks of all known installations including coastal\nbatteries and were designed to prepare the are for mine sweeping\noperations and the landing on KERAMA RETTO. In addition,\ncomplete photo reconnaissance coverage was accomplished and\ndelivered to the amphibious commands just prior to their landings.\nOn 23 March at 0028, an enemy submarine was rammed and\nsunk by the USS Haggard\nwhile operating as a unit of Task Group\n58.4. On 24 March, the fast battleships carried out an effective\nbombardment of the Southeastern Demonstration Beaches on\nOKINAWA. Also on this day Task Group 58.1 destroyed an enemy\nconvoy consisting of 3 medium AKs, 1 DE, 1 Chidori TB and 3\nother escorts which were located 150 miles Northwest of OKINAWA.\nThe operations of all forces involved proceeded smoothly and\naccording to plan. Enemy air opposition was non-existent and\nit became increasingly apparent that our initial strike on\nKYUSHU facilities had interfered with enemy air operations to\na greater extent than had been hoped for.\n(c) 6th and 7th of April\nThe expected all-out effort by the Japanese on both the\nbeaches and the supporting forces finally developed on the 6th\nof April. Until then the Task Force as a whole had been worried\nbut little, but from dawn on the 6th it was apparent that the\nJaps meant business. Seven shadowers or possible suiciders\nwere shot down during the forenoon, and at 1245, an intermittent\nattack developed on the two Task Groups present which were\n58.1 and 58.3. This attack continued for the rest of the day.\nThe Cabot,\nin Task Group 58.3, had a very close shave with a\nsuicider which skimmed over her deck, but missed; two cruisers\nwere also near-missed by bombs and altogether about 30 aircraft\nwere shot down in the proximity of the Force. Task Group\n58.1 had three carriers near-missed. One carrier, the\nSan Jacinto,\nwas slightly damaged. One destroyer, separated from\n--7--\nthe Force as a linking vessel between the Task Groups and the\npicket destroyers, was hit by a suicider and had to be detached\nfrom the Force. The radar picket group of destroyers again had\na field day--one destroyer alone shooting down three suiciders\nwhile their CAP shot down six enemy aircraft. The Task Force\nfighter combat air patrols over OKINAWA, and fighter sweeps and\npatrols over the islands to the Northward, had a very hectic\ntime and altogether between the two Task Groups 249 airborne\nplanes were destroyed, of which Task Group 58.1 claimed 136 over\nOKINAWA, and Essex\nnearly broke the carrier record by her aircraft\nshooting down 65 aircraft in the course of the day. Our\nown losses in air combat totaled 2 for the day as against\n236 for the enemy.\nDuring the night of 6-7 April, one of our submarines on\npatrol off BUNGO SUIDO Channel [the southeastern entrance to the\nInland Sea--between Kyushu and Honshu--featured in\nRun\nSilent, Run Deep --HyperWar] reported an enemy surface force\nheaded Southward. All Task Groups were ordered to concentrate\nto the Northeast of OKINAWA. Search aircraft, 40 VF in units\nof four, were launched at dawn, searching between 336 and 056\ndegrees to a depth of 325 miles and at 0822 an Essex search\nunit made the first enemy report of one battleships, probably\nYamato Class, two cruisers and eight destroyers in position\n31°-22'N, 129°-15'E., course 300°, speed 12 knots. (The\ncontact report was expeditiously received via VHF using two link\nunits at 100 and 200 miles). A tracking and covering force of\n16 fighters were launched at 09156 and they were followed at 1000\nby the strikes of Task Groups 58.1 and 58.3, and 45 minutes\nlater by Task Group 58.4. The original intention was for all\nTask Groups to launch together, but Task Group 58.4 could not be\nready in time. Hancock's air group (12 VT, 15 VB and 24 VF)\nwas 15 minutes late on taking-off, failed to join up and\nsubsequently did not find the enemy. (For plot of\nenemy track\nand attack, see enclosure (D)).\nAltogether the numbers of aircraft launched in the main\nstrike were as follows:\nTG 58.1\nTG 58.3\nTG 58.4\nTotal\nVF\n52\n80\n48\n180\nVB\n21\n29\n25\n75\nVT\n40\n58\n33\n131\n386\nAll Avenger (VT) aircraft carried torpedoes, the Helldivers\n(VB) were armed with a mixed load of 1000-lb. SAP, GP,\nand two 250-lb. GP, and the fighter aircraft with a 500-lb. GP\nbomb as well as a long-range tank.\n--8--\nThe launching position was latitude 27°-10'N, longitude\n129°-30'E, approximately a distance of 240 mils to the estimated\nposition of the enemy fleet. A deathly silence ensued from\nthe shadowing aircraft which was not broken until 1030, when\nthe Force was reported to have altered course to the Northward,\nand shortly afterward a search aircraft from OKINAWA made contact\nand confirmed the enemy course. This plane shadowed the\nrest of the day and did an excellent job. On the whole, shadowing\nreports failed to ge through to the Task Force Commander\nafter that, but as it turned out, the strike leaders were soon\nin touch with the shadowing aircraft, and the islands in the\ntrack of the strike made the navigation problem simple. Final\nhoming was done on a SB2C radar\n(APS-4)\nwhich picked up the\nenemy force at a distance of 32 miles from 6000 feet.\nThe enemy battle fleet was sighted in position 30°-34'N,m\n128°-08'E, approximately 70 miles, 225 degrees from first\nsighting report. The weather was poor with 8/10 cloud cover\nat 3000 feet. The low ceiling and so many aircraft made the\nattack most difficult to coordinate. Anti-aircraft fire was\nheavy but inaccurate and a large number of both torpedo and\nbomb hits were claimed on the Yamato, the one cruiser and three\ndestroyers by first two strike groups (58.1 and 58.3 in order).\nThe strike group of Task Group 58.4 arrived to find the Yamato\nlisting appreciably and hit her with many bombs and 6 torpedoes,\n5 of them on the high side--the Yamato blew up. The CL\n(Agano Class) which was found dead in the water was hit by\napproximately four torpedoes and eight 1000-lb. bombs to help\nher on her way to the bottom. Out of the original force of one\nBB, one CL, and 8 destroyers, the Yamato, one CL, and\nfour destroyers were sunk, one destroyer badly damaged\n(Terutsuki Class) and one left burning. Two destroyers were\napparently not seriously damaged. Our own plane losses were\nlight-- 4 VB, 3 VT and 3 VF. personnel losses were four pilots\nand eight aircrewmen, the rest being rescued.\nAt 1210, while the strike was away, the Force was attacked\nby a group of four aircraft, three of them were shot down on\ntheir way in to the Force and the fourth broke cloud over the\ncenter of Task Group 58.3 and was under fire for, at the most,\na minute before it dived into the Hancock, the aircraft and\naccompanying bomb hitting the port side just aft of her forward\nelevator. Both ends of her flight deck and the forward end\nof her hangar deck were in flames immediately, and volumes of\nsmoke enveloped her. In the surprisingly short time of three-quarters\nof an hour only thin wisps of smoke were visible--a\nmost impressive demonstration of her damage control\n--9--\nefficiency. Twenty-nine men were killed, about 35 missing and 71\nwounded, but she was able to land her own aircraft on their\nreturn at 1630. Although she was able to operate planes in an\nemergency, it was necessary to detach the Hancock from the Force\nfor repairs. The radar picket line CAP had its high day of the\nentire operation, shooting down 14 planes out of the total of\n54 destroyed airborne during the day.\nA search followed by a sweep of 32 VF armed with bombs was\nlaunched the following day to finish the remnants of the Japanese\nforce. The search and sweep went to 325 miles but failed\nto find them. One search Corsair located a downed pilot in his\nboat and remained airborne for seven and one-half hours. This\nis believed to be an all-time record for a Corsair with one 165\nU.S. gallon drop tank, and demonstrates what can be done by a\npilot who understands how to operate his engine economically.\n(d) 11th and 12th of April\nAt dawn on 11 April, Task Force 58 (less TG 58.4 away\nreplenishing), was concentrated to the Eastward of OKINAWA.\nAll indications pointed to a busy day. Support missions at", "note": "이 장은 1945년 3월 21일 말미부터 4월 11일 새벽까지의 작전을 다룬다. 원문에 'the Japs meant business' 등 'Jap' 멸칭 표기가 나오며 그대로 옮겼다. 원문의 전사 오식을 고치지 않았다 — 'the are'(area), 'battleships'(battleship), 'launched at 09156'(0915의 오식으로 보임), '240 mils'(miles), 'ge through'(get through), '30°-34'N,m', 'personnel'의 소문자 시작 등. 4월 6일 손실 대목에서 앞서 '249기 격파'라 적고 뒤에서 '적 236기'라 적어 수치가 어긋나나 원문 그대로 두었다. 원문 중 대괄호로 묶인 BUNGO SUIDO 설명은 원 문서가 아니라 HyperWar 전사자가 붙인 주석이며, 그 사실을 밝히고 옮겼다. 발진 시각 오식과 4월 6일 수치 불일치 때문에 confidence를 medium으로 두었다.", "warn": true, "search": "Task Force 58 Air Support Operations at OKINAWA (23 March to 1 April 1945); 6th and 7th of April Marc A. Mitscher 마크 A. 미처 — 미 해군 중장, 제58기동부대 사령관"}, {"id": "tf58-4", "order": 15, "date": "1945-04-11", "group": "B", "eyebrow": "제58기동부대 작전 보고 · 미처 중장", "title": "4월 11일~5월 11일 — 특공 방어의 한계, 규슈 선제 소탕, 잠수함 격침", "list_right": "본문", "meta": [{"k": "다루는 시점", "v": "1945-04-11"}, {"k": "문서 일자", "v": "1945-06-18"}, {"k": "성격", "v": "본문", "txt": true}, {"k": "원제", "v": "11th and 12th of April; 14th through 17th of April; 18th of April; 4th of May; 11th of May 1945", "txt": true}], "summary": "4월 11~12일 대규모 특공 공격에 대한 종심 방어와 그 한계, 4월 14~17일 규슈 비행장 선제 소탕과 인트레피드 피격, 4월 18일 잠수함 격침, 5월 4일 오키나와 상공 요격, 그리고 5월 11일 벙커힐 피격 직전까지를 기록한 대목이다.", "points": ["4월 11일 방어는 각 기동부대군 상공 전투기 24기, 레이더 초계군 상공 12기, 오키나와 목표 CAP 24기, 아마미·기카이 상공 24기를 고도별로 층층이 배치한 종심 방어였다.", "제58.3기동부대군의 함포가 피격 없이 특공기 11기를 격추했으나, 대형 함정 100야드 안에 근접탄 약 9발이 떨어진 데 대해 미처는 「특공기 문제는 해결되지 않았음이 분명하다」고 적었다.", "4월 11일 하루 격추는 함포 12기, 전투기 17기였다. Missouri(미주리)가 특공기에 피격되었으나 손상은 없었고, Enterprise(엔터프라이즈)는 특공기 4기의 근접탄으로 전방 탱크가 뚫리고 축 하나가 심하게 진동했으며, 구축함 Kidd(키드)는 직격으로 심대한 손상을 입었다.", "4월 11일 밤 야간 공격에서 함포가 7기, 야간전투기가 11기를 격추했으며, 야간 공격은 조잡해 잘 기동하는 부대에는 위협이 되지 못했다고 평가했다.", "4월 12일 적이 주공을 오키나와 정박지로 옮겼고, 제58기동부대 전투기는 아군 6기를 잃고 적기 151기를 격추, 대공포화가 3기를 더 격추했다. 특공기 1기만이 주 정박지에 침투했고 Tennessee(테네시)·Idaho(아이다호)와 구축함 1척이 손상되었다.", "4월 15일 13시 15분(1315) 전투기 125기의 특별 소탕대가 규슈 비행장을 기습해 29기 격추, 지상 51기 소각, 약 67기 추가 파괴·손상 추정. 아군 손실은 대공포화에 2기였으며 두 조종사 모두 덤보(Dumbo) 구조기가 구조했다.", "4월 16일 규슈 선제 소탕에도 불구하고 적의 대규모 공격이 종일 이어졌고 USS Intrepid(인트레피드)가 비행갑판에 특공기를 맞았다. 그날 전과는 적기 155기 격추(야간전투기 2기 포함), 대공포화 14기, 지상 55기 파괴·79기 손상이며 아군 손실은 9기와 조종사 6명이었다.", "4월 18일 새벽까지 Heermann(히어먼)·McCord(맥코드)·Uhlmann(울먼)·Mertz(머츠)·Collett(콜렛)이 이어 붙은 폭뢰 공격으로 일본 잠수함 1척을 격침했고, 13시 12분(1312) 공격 뒤 접촉이 사라지며 대형 유막과 일본어 표기가 있는 잔해, 살점이 떠올랐다.", "5월 4일 제58기동부대 전투기가 적기 98기를 격추했고 아군 손실은 전투기 5기, 조종사 1명이었다."], "primary": "포기했고, 모든 VT(뇌격기)와 VB(폭격기)를 격납고에 넣고 폭탄과 연료를 뺐다. 각 기동부대군 상공에는 전투기 24기의 전투공중초계(CAP)를, 북동쪽 25마일의 레이더 초계군(구축함 8척) 상공에는 12기를 유지했다. 오키나와에는 그들 자신의 코르세어 — 며칠 전 100기가 날아 들어왔으나 아직 완전히 작전 가능한 상태는 아니었다 — 를 보강하기 위해 전투기 24기의 목표 CAP를 주었고, 우리 작전 구역 북쪽 약 100마일에 있는 섬들인 AMAMI(아마미)와 KIKAI(기카이) 상공에 다시 24기를 배치했다. 이 대규모 전투기 병력은 오키나와와 기동부대 양쪽에 종심 방어를 제공할 목적으로 고도를 층층이 달리하여 배치되었다. 항모에는 바깥쪽 전투기 초계대가 교전에 들어가면 발진시킬 전투기가 더 있었다. 날씨는 오전에는 낮은 구름으로 적에게 유리했으나, 뒤에 개어 걷혔고 공격이 시작될 무렵에는 운저(雲底)가 4,000피트에 5/10 정도였다.\n\n공격은 13시 30분(1330)에 시작되어, 몇 기의 단발기가 인근에서 구름 사이로 우리 전투기와 숨바꼭질을 벌였다. 레이더가 경보를 주기는 했으나 흔히 알 수 있는 것이라고는 머리 위에 적기가 있다는 것뿐이었다. 기동부대군들은 여느 때의 5 빅터(5 VICTOR) 대형으로 항모를 1,500야드 원 위에 두고 있었는데, 몇몇 함정이 사격하는 것이 자주 보였음에도 나머지는 그 표적을 볼 수 없었다. 제58.3기동부대군 대공협조관(AA Coordinator)의 활동은 그 부대군 모든 함정의 포술장과 연락을 취하고 있었으므로\n\n—10—\n\n필요한 정보를 전달하는 데 큰 가치가 있었고, 이번 교전에서 확실히 그 값어치를 증명했다. 일본군(The Japs)은 채프(window) 사용에 기발했고, 한 기씩 들어오고, 구름과 태양을 이용했으며, 강하를 매우 능숙하게 협조했고, 현재 레이더 장비의 결함을 명백히 알고 있었다.\n\n모두가 자살 방식의 공격에 대응하는 연습을 실컷 했다 — 제58.3기동부대군은 함정 포화로 특공기 11기를 격추하면서 한 척도 피격되지 않았으나, 근접탄으로 인한 손상은 있었다. 사격은 훌륭했다 — 특히 인상적이었던 것은 Mk 51 조준기로 통제된 벙커힐(Bunker Hill) 5인치 포탑의 신속한 조준·사격 개시와 빠른 선회·발사였다. 그럼에도 특공기들은 일단 강하에 들어가면 집요했고 표적에서 벗어나게 되기까지 많은 타격을 견뎌 냈으며, 이 부대군의 큰 함정들로부터 100야드 이내에 약 9발의 빗나간 명중이 있었던 것으로 보아 특공기 문제가 해결되지 않았음이 분명하다.\n\n공격은 그날 남은 시간 동안 산발적으로 계속되었으나 다행히 해질 무렵 전에 끊겨, 본 부대는 이 시간 동안 방해받지 않았다. 그날의 총 전과는 함포 격추 12기, 전투기 격추 17기였다.\n\n이 공격 중 여러 함정이 손상을 입었다. 제58.4기동부대군의 Missouri(미주리)는 특공기에 피격되었으나 손상은 입지 않았다. 엔터프라이즈(Enterprise)는 특공기 4기의 근접탄을 입어 전방 탱크 일부가 뚫리고 축 하나가 심하게 진동했으며 전원 공급 장치와 레이더가 손상되었다. Essex(에식스)는 전방 연료탱크 하나가 뚫리고 레이더 하나가 작동 불능이 되었다. 구축함 Kidd(키드)는 자살 직격을 맞아 심대한 손상을 입었고, 다른 구축함 3척이 각각 폭탄 명중, 특공기 근접탄, 아군 5인치 대공포화로 얼마간 손상을 입었다. 엔터프라이즈와 구축함 4척은 수리를 위해 울리시(ULITHI)로 돌아가야 했다.\n\n그날 밤 적은 미행기와 뇌격기로 다시 공격에 나서 12일 02시(0200)까지 간헐적으로 이어졌으며, 그동안 7기가 함정 포화에, 11기가 야간전투기에 격추되었다. 야간 공격은 주로 단기 또는 소규모 편대였고 조잡하게 수행되어 잘 기동하는 부대에는 거의 위협이 되지 않았다.\n\n4월 12일 적은 공격의 주된 무게를 오키나와의 정박지로 옮겼고, 제58.1기동부대군에 대한 짧은 공격을 빼면 기동부대는 그대로 두었다.\n\n—11—\n\n방어 계획은 전날과 같았고, 오키나와와 북쪽 도서 상공의 CAP들은 큰 성과를 거두었다 — 아군 항공기 6기를 잃는 대가로 제58기동부대 전투기가 적기 151기를 격추했고, 3기가 함정의 대공포화에 격추되었다. 특공기 1기만이 주 정박지 안으로 뚫고 들어오는 데 성공했다. 그러나 적은 주 표적이 좌절되자 오키나와 주위의 레이더 초계함들을 공격하여 구축함 1척이 크게 손상되었다. 오키나와 남서쪽의 구식 전함들도 공격받아 Tennessee(테네시)와 Idaho(아이다호), 그리고 구축함 1척이 특공기에 손상을 입었다. 제58기동부대는 4월 12일 밤에도 다시 공격을 받았으나 손상은 없었고, 대공포화로 적기 2기가 격추되었으며 [판독 불능]기가 야간전투기(VFN)에 격추되었다.\n\n**(e) 4월 14일부터 17일까지**\n\n4월 14일, 제58.3기동부대군이 급유를 받는 동안 다른 기동부대군들이 오키나와에 항공 지원과 북방 전투기 초계를 제공했다. 오후에 본 부대는 여러 소규모 적기 무리의 공격을 받았는데, 이들은 고도를 달리하며 접근해 왔다. 구축함 초계선이 이 공격의 정면을 받아 구축함 Sigsbee(식스비)가 자살기들에 크게 손상되었다. 그날 항공기에 의한 적기 격추는 모두 50기였고 대공포화로 12기가 추가로 격추되었는데, 그중 10기는 레이더 초계군 구축함들의 전과였다.\n\n4월 15일 13시 15분(1315), 전투기 125기로 이루어진 특별 소탕대가 KYUSHU(규슈)의 비행장을 공격하기 위해 발진했다. 이 공격은 적에게 완전한 기습이었고 온갖 기종의 항공기가 비행장에서 발견되었다. 적기 29기를 격추했고 51기를 지상에서 소각했으며, 기총소사와 로켓으로 67기를 파괴하거나 손상시킨 것으로 추정되었다. 지상 시설에도 기총소사와 폭격을 가해 많은 화재를 일으켰다. 우리 손실은 대공포화에 의한 2기였고 조종사 두 사람 모두 덤보(Dumbo)기가 구조했다.\n\n4월 16일 오전 중에는 적이 분명히 감행하려던 대규모 항공 공격을 흐트러뜨리기 위해 다시 남부 규슈 비행장에 전투기 소탕대를 발진시켰다. 이 소탕대는 적기 17기를 격추하고 지상에서 54기를 파괴했으며 73기를 추가로 지상에서 손상시켰다. 그럼에도 적은 오키나와 바로 인근의 우리 부대들과 제58기동부대에 대해 수많은 공격을 감행할 수 있었다. 공격은 하루 종일 그리고 초저녁까지 계속되었다. 항공 지원은 제공하지 못했고 모든 노력을 전투기 방어에 쏟았다. 교전 중 USS Intrepid(인트레피드)가 비행갑판에 특공기를 맞아 여느 때와 같은\n\n—12—\n\n격렬한 화재가 일어났다. 초저녁에도 공격이 계속되었으나 효과는 없었다. 그날 기동부대의 전과는 적기 155기 격추(그중 2기는 야간전투기(VFN)의 전과), 대공포화로 14기 추가 격추, 지상 55기 파괴, 지상 79기 손상이었다. 우리 자신의 그날 항공기 손실은 9기와 조종사 6명이었다. 잃은 아홉 기 가운데 7기는 적 대공포화에, 2기는 공중전에서 잃었다. 그날의 흥미로운 대목 하나는 규슈로 가는 덤보(Dumbo) 구조기를 호위하던 전투기(VF)가 적기 3기를 격파한 일이다.\n\n4월 16~17일 밤부터 4월 17일 정오까지 적은 항공 공격을 계속했으나 규모는 줄었다. 야간전투기가 적기 4기, 기동부대 CAP가 31기, 대공포화가 5기, 오키나와 상공의 제58기동부대 전투기가 14기를 격추했다. 우리의 전투 중 항공기 손실은 1기였다.\n\n**(f) 1945년 4월 18일**\n\n4월 18일 오전의 주요 사건은 제58.4기동부대군과 제58.1기동부대군의 구축함들이 일본 잠수함 1척을 격침한 일이었다. 4월 17일 밤 23시 30분(2330)경, Heermann(히어먼, 제58.4기동부대군)이 수상 접촉을 얻었고 이는 곧 북위 26도 42분·동경 130도 38분에서 음탐 접촉으로 발전하여 즉시 폭뢰 공격을 시작했다. McCord(맥코드)에게 지원 지시가 내려져 공격을 계속했고, Uhlmann(울먼, 제58.4기동부대군)이 일시 합류했으나 두 차례 공격을 마친 뒤 초계 위치 임무로 복귀했다. 제47구축함전대 사령관이 맥코드에 타고 공격을 지휘했으며, 새벽에는 항공기의 지원을 받았고 10시 30분(1030)에 Mertz(머츠, 제58.4기동부대군)와 Collett(콜렛, 제58.1기동부대군)에게 인계했다. 이 교대는 맥코드와 울먼이 폭뢰를 거의 다 써 버렸기 때문에 07시(0700)에 명령된 것이었다. 이른 아침 동안 디젤유의 흔적이 여러 차례 나타났고 수중 폭발이 관측되었다. 13시 12분(1312)의 공격 뒤 접촉이 사라졌고 큰 유막이 퍼졌으며, 일본어 표기가 있는 재료와 목재, 그리고 살점을 포함한 잔해가 떠올랐다.\n\n**(g) 1945년 5월 4일**\n\n5월 3~4일 밤 오키나와에 대한 적의 항공 공격이 재개되었다. 제58기동부대의 야간전투기(VFN)가 4기를 격추했고 그중 3기는 야간전투기 조종사 한 사람의 전과였다. 주간 항공 공격은 모두 오키나와에 집중되었다. 오키나와 북쪽 도서 상공의 초계와 오키나와 상공의 전투공중초계로 작전하던 제58기동부대 전투기(VF)가 적기 98기를 격추했다. 우리 자신의 손실은 전투기 5기와 전투기 조종사 1명이었다.\n\n—13—\n\n**(h) 1945년 5월 11일**\n\n5월 11일 새벽, 제58.3기동부대군과 제58.4기동부대군은 오키나와 동쪽 약 90마일에서 작전 중이었다. 본 부대는 전날 밤 대부분 미행당했다. 적기들이 오키나와를 공격하고 있다는 것이 알려져 있었다. 10시(1000)경,", "secondary": "OKINAWA were abandoned, and all VT and VB aircraft were placed\nin the hangar and debombed and degassed. Combat air patrols of\n24 VF were kept over each Task Group and 12 VF over the Radar\nPatrol Group (8 destroyers), 25 miles to the northeastward.\nOKINAWA was given a target CAP of 24 fighters to augment their\nown Corsairs--a hundred of which had been flown n a few days\npreviously but were not yet entirely operational--and a\nfurther 24 were disposed over AMAMI and KIKAI, the islands approximately\n100 miles to the Northward of our operating area. This\nlarge force of fighters was staggered in height with the object\nof giving defense in depth to both OKINAWA and the Task Force.\nMore fighters were available in the carriers to be launched as\nthe outer patrols of fighters became engaged. The weather was\nfavorable to the enemy in the forenoon with low cloud cover,\nbut broke and lifted, and by the time the attack commenced,\ncloud base was t 4000 feet with 5/10 coverage.\nThe attack commenced at 1330 with a few single-engine aircraft\nin the vicinity playing hide and seek with our fighters\namongst the clouds. Radar was giving warning but often all\nthat was known was that there were enemy aircraft over head.\nThe Task Groups were in the usual 5 VICTOR formation with the\ncarriers on 1500-yard circle, but a few ships were often seen\nfiring without the remainder being able to see the target. The\nwork of the AA Coordinator in Task Group 58.3, who was in touch\n--10--\nwith the gunnery officers in every ship of the Task Group, was\nof great value in passing out the necessary information, and\ncertainly proved his worth in this action. The Japs were ingenious\nin their use of window, coming in singly, using cloud\nand the sun, coordinating their dives very ably and obviously\naware of the deficiencies of present radar installations.\nPlenty of practice was had by all in countering the suicide\ntype of attack--11 suiciders being shot down by ships' gunfire\nof Task Group 58.3 without a ship being hit, although damage\nwas caused by near misses. The shooting was excellent--particularly\nimpressive was the quick sighting and opening of\nfire and the rapid training and firing of Bunker Hill's five-inch\nturrets, controlled by Mk 51 directors. Nevertheless the\nsuiciders once in their dive were persistent and took a lot of\npunishment before being deflected from their targets, and as\nthere were about 9 misses within 100 yards of the bigger ships\nof the group, it is apparent that the problem of the suicider\nis not solved.\nThe attacks continued sporadically for the remainder of the\nday, but fortunately were discontinued prior to dusk--the force\nbeing undisturbed during this period. The total bag for the\nday was 12 shot down by gunfire and 17 by fighters.\nSeveral ships were damaged during these attacks.\nMissouri\nin Task Group 58.4 was hit by a suicider but suffered no\ndamage. Enterprise was near-missed by four suiciders which\npierced some of her forward tanks, caused one of her shafts to\nvibrate excessively and damaged her power supply and radars.\nEssex had a forward fuel tank pierced and one radar put out of\naction. The destroyer\nKidd\nwas severly damaged by a direct\nsuicide hit and 3 other destroyers suffered some damage from\na bomb hit, suicide near miss and friendly five-inch AA\nrespectively. Enterprise and the four destroyers had to return\nto ULITHI for repairs.\nThat night the enemy returned to the attack with shadowers\nand torpedo aircraft which continued intermittently until 0200\non the 12th. During the cvourse of which 7 aircraft were shot\ndown by ships' gunfire and 11 more by night fighters. The night\nattacks were mainly single or small groups of aircraft and were\nbadly executed and presented little threat to a well-maneuvered Force.\nOn the 12th of April the enemy shifted tthe main weight of\nhis attcks to the anchorages at OKINAWA and except for a short\nattack on Task Group 58.1, the Task Force was left alone. The\n--11--\ndefense plan was the same as for the previous day and the CAP's\nat OKINAWA and over the islands to the Northward had a field\nday--for the loss of 6 of our own aircraft, Task Force 58\nfighters shot down 151 enemy aircraft, and 3 were shot down by\nships' AA fire. Only 1 suicider managed to penetrate into the\nmain anchorage. The enemy however, thwarted of their main target,\nattacked the radar pickets around OKINAWA and one destroyer\nwas badly damaged. The old battleships to the Southwest of\nOKINAWA were also attacked, the\nTennessee and\nIdaho and 1\ndestroyer being damaged by suiciders. Task Force 58 was again\nunder attack the night of 12 April, but no damage was caused\nand two enemy aircraft were shot down by AA fire, and [illegible] by VFN.\n(e) 14th through 17th of April\nOn 14 April, Task Group 58.3 fueled while the other Task\nGroups provided air support for OKINAWA and fighter patrols to\nthe North. During the afternoon the Force was attacked by\nseveral small groups of enemy aircraft, making their approach\nfrom variable altitudes. The destroyer picket line received the\nbrunt of this attack and the destroyer\nSigsbee was\nseriously damaged by suicide planes. A total of 50 enemy aircraft were\nshot down during the day by aircraft and an additional 12 planes\nwere shot down by AA fire, of which 10 were credited to the\nRadar Patrol Group destroyers.\nAt 1315, on 15 April, a special fighter sweep consisting of\n125 fighters was launched to make attacks on airfields on KYUSHU.\nThis attack was a complete surprise to the enemy and many\nplanes of all types were found on the fields. Twenty-nine\nenemy aircraft were shot down, 51 were destroyed on the ground\nby burning, and it was estimated that 67 aircraft were probably\ndestroyed or damaged by strafing and rockets. Ground installations\nwere also strafed and bombed, causing many fires. Our\nlosses were two planes to AA fire--both pilots were rescued\nby Dumbo.\nDuring the morning of 16 April VF sweeps were again launched\nagainst Southern KYUSHU airfields in an effort to break up what\nwas obviously to be a major air attack by the enemy. These\nsweeps shot down 17 enemy aircraft, destroyed 54 on the ground\nand damaged 73 additional on the ground. In spite of this the\nenemy was able to launch numerous attacks against our forces in\nthe immediate vicinity of OKINAWA, and against Task Force 58.\nAttacks continued throughout the entire day and early evening.\nNo air support was supplied, all efforts being devoted to\nfighter defense. During the course of the action the USS\nIntrepid took a suicider on the flight deck, causing the usual\n--12--\nintense fires. During the early evening attacks continued by\nwere not effective. The Task Force score for the day was 155\nenemy planes shot down, two of which were destroyed by VFN, 14\nmore shot down by AA fire, 55 destroyed on the ground and 79\ndamaged on the ground. Our own plane losses for the day were\n9 planes and 6 pilots. Of the nine planes lost, 7 were to\nenemy AA fire and 2 in air combat. An interesting feature of\nthe day was the destruction of three enemy aircraft by the VF\nescorting the Dumbo rescue plane to KYUSHU.\nDuring the night of 16-17 April and continuing until noon\non 17 April, the enemy continued his air attacks, but at a reduced\nscale. Four enemy aircraft were shot down by night fighters,\n31 by the Task Force CAP, 5 by AA fire and 14 by Task Force\n58 fighters over OKINAWA. Our aircraft loss in combat was 1 plane.\n(f) 18th of April 1945\nThe morning of 18 April was highlighted by the sinking of\na Japanese submarine by destroyers of Task Group 58.4 and Task\nGroup 58.1. At about 2330, on the night of 17 April, the\nHeermann\n(TG 58.4) had a surface contact that very shortly\ndeveloped into a sound contact in Lat. 26-42W, Long. 130-38E,\nand immediately began depth charge attacks. The\nMcCord was\ndirected to assist and remained on the attack, and the\nUhlmann\n(TG 58.4) joined temporarily but resumed her picket station\nduties after making two attacks. Commander Destroyer Squadron\nFORTY-SEVEN in the McCord led the attack, assisted by aircraft\nat dawn, until relieved at 1030 by the\nMertz\n(TG 58.4) and\nCollett\n(TG 58.1). This relief was ordered at 0700 due to the\nfact that the McCord, and Uhlmann had expended most of their\ndepth charges. During the early morning several traces of diesel\noil appeared and underwater explosions were noted. After an\nattack at 1312, the contact disappeared, a large oil slick\ndeveloped, and debris surfaced including material and wood with\nJapanese markings and pieces of flesh.\n(g) 4th of May 1945\nEnemy air attacks on OKINAWA were resumed during the night\nof 3-4 May. Task Force 58 VFN shot down 4 planes, 3 of them\ncredited to one night fighter pilot. The day air attacks were\nall concentrated on OKINAWA. Task Force 58 VF operating as\npatrols over the islands North of OKINAWA, and as combat air\npatrol over OKINAWA, shot down 98 enemy planes. Our own losses\nwere 5 VF planes and 1 VF pilot.\n--13--\n(h) 11th of May 1945\nAt dawn on 11 May, Task Groups 58.3 and 58.4 were operating\nabout 90 miles East of OKINAWA. The Force had been shadowed\nmost of the previous night. Enemy planes were known to be\nattacking OKINAWA. About 1000, the", "note": "이 장은 1945년 4월 11일부터 5월 11일 오전까지의 작전을 다룬다. 원문에 'The Japs were ingenious in their use of window' 등 'Jap' 멸칭 표기가 나오며 그대로 옮겼다. 원문 전사 오식이 많아 고치지 않았다 — 'flown n'(on/in), 'cloud base was t 4000 feet'(at), 'severly'(severely), 'cvourse'(course), 'tthe main weight of his attcks'(the/attacks), 'thwarted of'(thwarted in), 'Lat. 26-42W'(N의 오식으로 보임), 'continued by were not effective'(but), 'form any source'(from). 4월 12일 야간 대목의 'and [illegible] by VFN'은 원문에 판독 불능으로 표시되어 있어 그대로 두었다. 4월 16일 항공기 손실 내역(9기 중 7기 대공포화, 2기 공중전)과 조종사 6명도 원문 그대로다. 오식과 판독 불능 표시가 있어 confidence를 medium으로 두었다. 이 장 마지막 문장은 5월 11일 '약 10시(1000)경, the'에서 끊기며 다음 장(tf58-5)의 'Bunker Hill(벙커힐)이 …'로 이어진다.", "warn": true, "search": "11th and 12th of April; 14th through 17th of April; 18th of April; 4th of May; 11th of May 1945 Marc A. Mitscher 마크 A. 미처 — 미 해군 중장, 제58기동부대 사령관"}, {"id": "tf58-5", "order": 16, "date": "1945-05-11", "group": "B", "eyebrow": "제58기동부대 작전 보고 · 미처 중장", "title": "5월 11일 벙커힐 피격과 5월 13~14일 규슈 공격 — 엔터프라이즈 이탈", "list_right": "본문", "meta": [{"k": "다루는 시점", "v": "1945-05-11"}, {"k": "문서 일자", "v": "1945-06-18"}, {"k": "성격", "v": "본문", "txt": true}, {"k": "원제", "v": "11th of May 1945 (concluded); 13th and 14th of May 1945", "txt": true}], "summary": "5월 11일 기함 벙커힐이 특공기 2기에 피격되어 352명이 전사한 일과, 5월 13~14일 제58.1·58.3기동부대군의 규슈 비행장 공격 및 엔터프라이즈 피격까지를 기록한, 이 보고서 본문의 마지막 대목이다.", "points": ["5월 11일 Bunker Hill(벙커힐)이 아무런 사전 경보 없이 특공기 2기에 피격되었다. 두 기 모두 낮은 구름에서 급각도로 강하했다.", "주로 질식으로 인한 사상은 전사 352명, 작전 중 실종 52명이었고 부상자는 그보다 훨씬 많았다. 바다로 뛰어들거나 튕겨 나간 약 300명은 구축함들이 구조했다.", "제58기동부대 사령관 참모부도 장교 3명과 병 10명을 잃었고, 미처는 5월 11일 15시(1500)경 최소 인원의 참모와 함께 USS Enterprise(엔터프라이즈)로 옮겼다.", "5월 11일 하루 CAP가 적기 69기를 격추했고(대부분 오키나와 인근), 아군 대공포화가 3기를 격추했으며 벙커힐에 돌입한 특공기 2기도 격파된 것으로 셈했다.", "5월 13~14일 규슈 공격은 이틀 밤낮의 소탕·타격·야간 교란기 일정이었고, 목표는 전부 비행장과 항공 시설이었다. 13일 하루에만 두 기동부대군이 약 700회의 목표 출격을 수행했다.", "5월 14일 06시 15분(0615) 단발기 약 26기가 기동부대를 공격해 대공포화가 6기, CAP가 19기를 격추했으나 06시 59분(0659) 특공기 1기가 엔터프라이즈에 돌입해 작전 불능으로 만들었다.", "적기들은 저고도로 기동부대 서쪽을 크게 지나쳐 남서쪽에서 접근함으로써 북서쪽의 레이더 초계군을 피했고, 25마일에서야 레이더에 처음 포착되었다.", "엔터프라이즈에 돌입한 제케(Zeke)는 제58.3기동부대군 전 함정의 극히 격렬한 대공포화를 받고 20mm 탄에 맞은 것이 분명했음에도 어떤 기적인지 격파되지 않았다.", "이틀간의 전과는 공중 격파 72기(그중 16기는 야간), 지상 파괴 73기, 지상 파괴·손상 추정 167기이며, 가노야(KANOYA)·사에키(SAEKI)·오이타(OITA) 등 규슈·시코쿠의 다수 비행장과 기지의 격납고·함선·병사·연료 집적소를 파괴했다.", "구마모토(KUMAMOTO) 항공기 공장도 폭격해 지붕 면적의 약 30%를 파괴·손상시켰으나, 촬영된 사진은 그 공장이 이미 가동 불능 상태였을 가능성을 시사했으며 이런 가능성에 대한 사전 정보는 어느 출처로부터도 받은 바 없었다.", "이틀간 아군 항공 손실은 14기(그중 11기는 적 대공포화), 조종사 10명, 항공승무원 7명이었다."], "primary": "Bunker Hill(벙커힐)이 아무런 사전 경보 없이 특공기(suicider) 2기에 피격되었다. 두 기 모두 낮은 구름에서 급한 각도로 강하해 들어왔다. 그로 인한 화재와 손상은 심각한 성질의 것이었다. 사상은 주로 질식에 의한 것으로, 전사 352명, 작전 중 실종 52명이었고 부상자는 그보다 훨씬 많았다. 바다로 뛰어들 수밖에 없었거나 폭발로 튕겨 나간 약 300명은 구축함들이 건져 냈다. 제58기동부대 사령관 참모부는 장교 3명과 병 10명을 잃었다. 제58기동부대 사령관과 최소 인원의 참모는 5월 11일 15시(1500)경 USS Enterprise(엔터프라이즈)로 옮겨 탔다.\n\n그날 하루 동안 전투공중초계(CAP)가 적기 69기를 격추했는데 대부분 오키나와(OKINAWA) 인근에서였다. 적기 3기가 우리 대공포화에 격추되었고, 벙커힐에 충돌한 특공기 2기도 격파된 것으로 셈했다.\n\n**(i) 1945년 5월 13일과 14일**\n\n5월 12~13일 밤, 제58.1기동부대군과 제58.3기동부대군은 KYUSHU(규슈)의 비행장을 공격하기 위해 북상했다. 공격 계획은 이틀 밤낮에 걸친 소탕과 타격과 야간 교란기(night heckler) 운용을 요구했다. 모든 공격의 주 목표는 비행장과 항공 시설이었다.\n\n접근 중에 야간 교란기와 엔터프라이즈에서 발진한 새벽 목표 CAP가 매우 훌륭한 활약을 하여 모두 적기 12기를 격추했는데, 3기는 기동부대 인근에서, 9기는 적 영토 상공에서였다. 우리의 접근과 위치가 적에게 명백히 알려져 있었음에도 5월 1
