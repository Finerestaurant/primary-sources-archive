3일 하루 종일 공격은 없었다. 두 기동부대군 모두 할당된 목표 구역에 대해 전체 일정을 소화했으며, 그 총량은 약 700회의 목표 출격에 이르렀다.\n\n5월 13~14일 밤, 엔터프라이즈의 항공기들이 KYUSHU(규슈) 전역과 SHIKOKU(시코쿠)의 일부를 성공적으로 교란했다. 그 밤에 야간전투기가 4기를, 대공포화가 1기를 격파했다. 기동부대의 주간 공격은 5월 14일 새벽 규슈에 대해 재개되었다. 06시 15분(0615), 기동부대가 약 26기의 단발기에게 공격받았다. 6기는 대공포화가, 19기는 CAP가 격추했으나 06시 59분(0659)에 특공기 1기가 엔터프라이즈에 충돌하여 이 함을 작전 불능으로 만들었다.\n\n—14—\n\n—15—\n\n이 공격은 08시 30분(0830)까지 이어진 신경을 갉아먹는 경험이었다. 적기들은 저고도로 기동부대의 서쪽을 한참 지나쳐 간 뒤 남서쪽에서 접근한 것으로 추정되었다. 그렇게 함으로써 그들은 기동부대 북서쪽의 우리 레이더 초계군을 피했다. 이 공격은 25마일 거리에서 처음으로 레이더에 포착되었다. 전투기들이 즉시 유도되어 나갔고 뒤이은 교전은 전투기 관제와 전투기 조종사의 기량에서 최고의 것을 요구했다. 적 전투기와 주디(Judy)기들이 제각기 구름 속을 들락거리는 상황에서 19기를 격파해 낸 것은 전투기 관제와 전투기 조종사들에게 큰 영예다. 엔터프라이즈에 자살 강하로 충돌하는 데 성공한 제케(Zeke)기는 제58.3기동부대군 모든 함정으로부터 극히 격렬한 대공포화를 받았고 20mm 사격에 맞은 것이 분명했음에도 어떤 기적인지 격파되지 않았다.\n\n위와 같은 방해가 있었음에도 소탕과 타격은 그날 남은 시간 내내 일정대로 유지되었다. 기동부대는 해질 무렵 물러났다. 엔터프라이즈의 임무 상실 때문에 우리의 철수를 엄호할 야간 공세 작전은 수행할 수 없었다.\n\n이틀간의 공세 작전의 결과는 공중에서 적기 총 72기 격파(그중 16기는 야간), 지상에서 73기 추가 격파, 지상에서 167기 격파 또는 손상 추정이었다. 이 밖에 VB/VT와 VFB 폭격대가 다음의 적 비행장과 기지에서 격납고, 함선, 병사(兵舍) 및 기타 시설을 파괴·손상시켰으며 여기에는 여러 연료 집적소가 포함된다 — KANOYA(가노야), SAEKI(사에키), OITA(오이타), NIYAKONOJO, TAMANA, KIKUCHI, ASHIYA, GANNOSHU, KOKUBU, USA, IZUMI, TACHIARAI CHIRAN, OMURA, HITOYOSHI, KOCHI 및 MATSUYAMA WEST. KUMAMOTO(구마모토) 항공기 공장도 폭격하여 지붕 면적의 약 30%가 파괴 또는 손상되었다. 그러나 촬영된 사진은 그 공장이 이미 가동 불능 상태였을 가능성을 시사했다. 이러한 가능성에 대한 사전 정보는 어떤 출처로부터도 받은 바 없었다. 이틀 동안 우리 자신의 항공 손실은 항공기 14기(그중 11기는 적 대공포화), 조종사 10명, 항공승무원 7명이었다.\n\n전사 및 편집: 패트릭 클랜시(Patrick Clancey), HyperWar Foundation", "secondary": "Bunker Hill\nwas hit by two\nsuiciders without any previous warning of any kind. Both planes\ndove out of low clouds at a steep angle. The resulting fires\nand damage were of a serious nature. The casualties, mainly\nthrough asphyxiation, were 352 killed, 52 missing in action and\nmany more injured. About 300 men who were forced to jump overboard\nor were blown overboard, were picked up by destroyers.\nCommander Task Force 58 staff suffered the loss of 3 officers\nand 10 men. Commander Task Force 58 and a skeleton staff\ntransferred to the USS Enterprise about 1500, 11 May.\nDuring the course of the day 69 enemy aircraft were shot\ndown by the CAP, mostly in the vicinity of OKINAWA. Three enemy\nplanes were shot down by our AA and 2 suiciders which crashed\nthe Bunker Hill were destroyed.\n(i) 13th and 14th of May 1945\nDuring the night of 12-13 May, Task Groups 58.1 and 58.3\nproceeded North to attack KYUSHU airfields. The attack plan\ncalled for two full days and nights of sweeps, strikes and night\nhecklers. The primary targets for all attacks were airfields\nand air facilities.\nDuring the approach, night heckler planes and a dawn target\nCAP from the Enterprise did some very excellent work shooting\ndown a total of 12 enemy planes, 3 in the vicinity of the Task\nForce and 9 over enemy territory. Although our approach and\nposition were obviously known to the enemy, no attacks were\nexperienced throughout the day of 13 May. Both Task Groups\ncarried out full schedules against assigned target areas,\namounting to a total of about 700 target sorties.\nDuring the night of 13-14 May, Enterprise planes successfully\nheckled all of KYUSHU and part of SHIKOKU. During the\nnight 4 planes were destroyed by night fighters and 1 by AA.\nTask Force day attacks were resumed on KYUSHU at dawn on 14\nMay. At 0615, the Task Force was attacked by about 26 single-engine\nplanes. Six were shot down by AA, 19 by CAP and at\n0659, one suicider crashed into the Enterprise putting her out\nof operation.\n--14--\n--15--\nThis attack was a nerve-racking experience lasting until\n0830. It was estimated that the enemy planes had passed the\nTask Force well to the West at low altitude and they approached\nfrom the Southwest. By so doing they avoided our radar picket\ngroup to the Northwest of the Task Force. The attack was first\npicked up by radar at a distance of 25 miles. Fighters were\nimmediately vectored out and the ensuing engagement required the\nutmost in fighter direction and fighter pilot performance. It\nis a great tribute to the fighter direction and the fighter\npilots that they were able to destroy 19 planes under existing\nconditions with the enemy fighters and Judys individually ducking\nin and out of the clouds. The Zeke which managed to crash dive\nthe Enterprise was subjected to very heavy AA fire from all\nships in Task Group 58.3 but by some miracle was not destroyed\nalthough it was evident that the plane had been hit by 20 mm fire.\nIn site of the above interruption, the sweeps and strikes\nwere maintained on schedule throughout the remainder of the\nday. The Task Force retired at sunset. Because of the loss\nof service of the Enterprise, no offensive night operations\ncould be conducted to cover our retirement.\nThe results of these two days of offensive operations were\na total of 72 airborne enemy planes destroyed, 16 of them at\nnight, another 73 planes were destroyed on the ground and 167\nprobably destroyed or damaged on the ground. In addition,\nVB/VT and VFB bomber strikes destroyed and damaged hangars,\nships, barracks and other installations, including several fuel\ndumps at the following enemy airfields and bases: KANOYA,\nSAEKI, OITA, NIYAKONOJO, TAMANA, KIKUCHI, ASHIYA, GANNOSHU,\nKOKUBU, USA, IZUMI, TACHIARAI CHIRAN, OMURA, HITOYOSHI, KOCHI\nAND MATSUYAMA WEST. KUMAMOTO aircraft factory was also bombed\nand about 30% of the roof area was destroyed or damaged; however\nphotos taken indicated that the factory was probably\ninoperative. No previous indication of this possibility had\nbeen received form any source. Our own air losses for the two\ndays were 14 planes, (11 to enemy AA) 10 pilots and 7 aircrewmen.\nTranscribed and formatted by Patrick Clancey, HyperWar Foundation", "note": "이 장은 1945년 5월 11일부터 14일까지의 작전을 다룬다. 첫 문장은 앞 장(tf58-4)의 '10시(1000)경,'에서 이어지며, 원문이 그 자리에서 장이 나뉘어 있다. 이 장에는 'Jap' 등의 멸칭이 나오지 않는다. 원문 전사 오식을 고치지 않았다 — 'In site of'(In spite of), 'form any source'(from), 'NIYAKONOJO'(통상 표기 MIYAKONOJO 미야코노조의 오식으로 보임), 'TACHIARAI CHIRAN'(TACHIARAI와 CHIRAN 사이 쉼표 누락으로 보임). 원문 14쪽과 15쪽 사이에 '--14--' '--15--'가 연달아 나오는데 이는 전사 과정에서 한 쪽 분량이 비어 있음을 시사하나 문맥은 끊기지 않는다. 비행장 이름들은 원문 대문자 표기를 그대로 두고 확실한 것에만 한국어를 병기했다. 마지막 줄의 전사자 표시는 원 문서가 아니라 HyperWar Foundation 웹판의 것이다. 오식과 쪽 표시 이상 때문에 confidence를 medium으로 두었다.", "warn": true, "search": "11th of May 1945 (concluded); 13th and 14th of May 1945 Marc A. Mitscher 마크 A. 미처 — 미 해군 중장, 제58기동부대 사령관 Patrick Clancey 패트릭 클랜시 — HyperWar Foundation, 이 문서의 전사·편집자"}, {"id": "toyoda-0", "order": 0, "date": "1945-11-13", "group": "A", "eyebrow": "도요다 소에무 심문조서 · USSBS Nav-75", "title": "심문 표제와 도요다 소에무의 이력 — 「일본의 전쟁 계획과 화평 공작」", "list_right": "요약", "meta": [{"k": "다루는 시점", "v": "1945-11-13"}, {"k": "문서 일자", "v": "1945-11-13"}, {"k": "성격", "v": "요약", "txt": true}, {"k": "원제", "v": "JAPANESE WAR PLANS AND PEACE MOVES — Interrogation NAV No. 75, USSBS No. 378", "txt": true}], "summary": "USSBS 해군 제75호 심문의 표제부로, 도요다 소에무 대장의 보직 이력과 심문관·배석자 명단, 그리고 심문 전체가 다루는 주제를 밝힌 대목이다.", "points": ["심문 표제는 「일본의 전쟁 계획과 화평 공작(Japanese War Plans and Peace Moves)」이며, 1945년 11월 13~14일 도쿄에서 이루어졌다.", "도요다는 1941년 9월 구레(KURE) 진수부 사령장관, 1942년 11월 군사참의관(도쿄 거주), 1943년 5월 요코스카(YOKOSUKA) 진수부 사령장관을 지냈다.", "1944년 5월, 전사한 고가(KOGA) 대장의 뒤를 이어 연합함대 사령장관이 되었다.", "1945년 5월 군령부총장에 임명되었고, 그 자리는 1945년 9월 해군총사령관직으로 대체되어 1945년 10월 15일 그 조직이 해체될 때까지 재임했다.", "심문관은 오프스티(OFSTIE) 해군소장, 앤더슨(ANDERSON) 육군소장, 와일즈(WILDS) 해군예비역 소령이며, 니츠(NITZE) USSBS 부위원장 등이 배석했다.", "다루는 주제는 육군의 정치 개입과 그것이 일본 팽창사에 미친 영향, 대미 전쟁 기본 계획의 전략과 경제, 군의 관여 문제, 그리고 1945년 여름 어전회의에서의 항복 문제 심의다."], "primary": "**USSBS: 일본 관계자 심문록 — 도요다 소에무(豊田副武) 대장**\n\n**심문 NAV 제75호**\n\n**USSBS 제378호**\n\n**일본의 전쟁 계획과 화평 공작(JAPANESE WAR PLANS AND PEACE MOVES)**\n\n도쿄(TOKYO)\n\n1945년 11월 13~14일\n\n**심문 대상자와 각자의 이력:**\n\n심문 대상: 도요다 소에무(TOYODA, Soemu) 대장.\n\n1941년 9월 구레(KURE) 진수부 사령장관(CinC KURE NavSta). 1942년 11월 군사참의관(Supreme Military Counsellor)에 임명되어 도쿄(TOKYO)에 거주. 1943년 5월 요코스카(YOKOSUKA) 진수부 사령장관이 됨. 1944년 5월, 고가(KOGA) 대장이 전사하자 그 뒤를 이어 연합함대 사령장관(CinC Combined Fleet)이 됨. 1945년 5월 군령부총장(Chief of Naval General Staff)에 임명. 이후 이 직위는 1945년 9월 해군총사령관(Chief, Naval Combined Forces) 직위로 대체되었으며, 그는 1945년 10월 15일 그 조직이 해체될 때까지 이 자리를 맡았다.\n\n**심문자:** R. A. 오프스티(OFSTIE) 해군소장(USN); O. A. 앤더슨(ANDERSON) 육군소장(USA); W. 와일즈(WILDS) 해군예비역 소령(USNR).\n\n**배석한 연합국 측 인원:** P. H. 니츠(NITZE) 씨, USSBS 부위원장; T. J. 헤딩(HEDDING) 해군대령(USN); J. A. 필드 2세(FIELD, Jr.) 해군예비역 소령(USNR).\n\n도요다 대장은 일본 육군의 정치적 영향력과 그 영향력이 일본 팽창의 역사에서 갖는 함의, 대(對)미국 전쟁을 위한 일본의 기본 계획의 전략과 경제, 군의 관여 문제, 그리고 1945년 여름 어전회의(Imperial Conferences)에서의 항복 문제 심의에 관하여 논한다.", "secondary": "USSBS: Interrogations of Japanese Officials -- Admiral TOYODA Soemu\nINTERROGATION NAV NO. 75\nUSSBS NO. 378\nJAPANESE WAR PLANS AND PEACE MOVES\nTOKYO\n13-14 November 1945\nPersonnel interrogated and background of each:\nInterrogation of: Admiral TOYODA , Soemu;\nSeptember 1941, CinC KURE NavSta; November 1942 appointed Supreme Military Counsellor,\nresiding in TOKYO. May 1943 became CinC YOKOSUKA NavSta. May 1944 became CinC Combined Fleet\nsucceeding Admiral KOGA when latter was killed. May 1945 appointed Chief of Naval General Staff;\nlater post superseded by position of Chief, Naval Combined Forces, September 1945 which\nhe held until dissolution of that organization 15 October 1945.\nInterrogated by: Rear Admiral R.A. OFSTIE, USN; Maj. Gen. O.A. ANDERSON, USA;\nLt. Comdr. W. WILDS, USNR.\nAllied Personnel Present: Mr. P.H. NITZE, Vice Chairman, USSBS; Captain T.J. HEDDING, USN;\nLt. Comdr. J.A. FIELD, Jr., USNR.\n\nAdmiral TOYODA discusses the influence of the Japanese Army in politics and the implications of\nthis influence in the history of Japanese expansion, the strategy and economics of the basic\nJapanese plan for war against the UNITED STATES, the question of implication of the armed forces,\nand the consideration of the surrender question at Imperial Conferences in the summer of 1945.", "note": "원문에 고가(KOGA) 대장의 이름(峯一 미네이치)은 성만 표기되어 있어 병기는 역자가 보충했다. 원문 마지막 문단의 'the question of implication of the armed forces'는 문맥상 '군의 (전쟁 개시에 대한) 관여·책임 문제'로 옮겼으나, implication의 함의가 모호하여 그대로의 어감을 살렸다. 원문 'CinC ... NavSta'는 진수부 사령장관으로 옮겼다.", "warn": false, "search": "JAPANESE WAR PLANS AND PEACE MOVES — Interrogation NAV No. 75, USSBS No. 378 豊田副武 도요다 소에무 (TOYODA Soemu) — 대장, 연합함대 사령장관·군령부총장 古賀峯一 고가 미네이치 (KOGA) — 대장, 도요다의 전임 연합함대 사령장관 R. A. Ofstie 오프스티 — 미 해군소장, 심문자 O. A. Anderson 앤더슨 — 미 육군소장, 심문자 W. Wilds 와일즈 — 미 해군예비역 소령, 심문자 P. H. Nitze 니츠 — USSBS 부위원장 T. J. Hedding 헤딩 — 미 해군대령 J. A. Field, Jr. 필드 — 미 해군예비역 소령"}, {"id": "toyoda-1", "order": 1, "date": "1945-11-13", "group": "A", "eyebrow": "도요다 소에무 심문조서 · USSBS Nav-75", "title": "육군의 정치 개입과 개전 책임, 그리고 「가장 큰 위협은 태평양을 건너오는 미 해군」", "list_right": "문답", "meta": [{"k": "다루는 시점", "v": "1945-11-13"}, {"k": "문서 일자", "v": "1945-11-13"}, {"k": "성격", "v": "문답", "txt": true}, {"k": "원제", "v": "Army's political power, Japanese war aims, and the American Navy as the principal threat", "txt": true}], "summary": "도요다는 자신이 개전 전후 기본 국책 결정에서 배제되어 있었음을 밝히고, 육군이 메이지 시대부터 정치에 개입해 왔다고 단언하며, 일본이 맞선 최대 위협은 태평양을 건너오는 미 해군이었고 중국과의 전쟁은 희생을 치르더라도 청산했어야 했다고 말한다.", "points": ["각 함대·진수부 사령장관은 작전 지시만 받을 뿐 기본 국책에는 자문받지 못했고, 도요다도 개전 이래 도쿄 중앙부로부터 그런 자문을 받은 일이 없다.", "1941년 11월 5일 각 진수부·요항부 사령장관이 도쿄에 소집되어 대미 개전 시 작전 계획을 설명받았으나, 의견을 내거나 수정을 제안할 기회는 주어지지 않았다.", "기본 전쟁 계획 수립에서 육해군 간에 완전한 이해와 합의가 있었느냐는 물음에 도요다는 「아니다」라고 답하며, 육군의 정치력이 커서 해군이 원하는 것을 다 얻으려면 곤란을 겪었다고 말한다.", "군인은 정치에 관여해서는 안 된다는 것이 자신의 신념이며, 이는 천황의 군인칙유(勅諭)에 담긴 요점 중 하나라고 밝힌다.", "육군의 정치 관여는 최근의 현상이 아니라 메이지(MEIJI) 시대까지 거슬러 올라가며, 내각 구성에까지 육군이 역할을 했다고 말한다.", "개전 책임을 개전 당시 정부에만 물을 수 있는지 의문이며, 만주사변(Manchurian Incident)까지 거슬러 올라가야 한다고 본다.", "육군의 영향은 군수 장비 분야에서는 상당히 느꼈으나, 작전 면에서는 「몇몇 예외를 빼면」 두 군종의 협력이 꽤 만족스러웠다고 평가한다.", "최대의 위협은 태평양을 건너오는 미국 해군과 항공 병력이었고, 이에 맞설 주된 책임은 일본 해군에 있었다고 인정한다.", "대미 전쟁과 대중국 대륙 전쟁을 동시에 수행한 것은 큰 잘못이며, 어느 정도 희생을 치르더라도 중국과의 전쟁은 청산했어야 했다고 말한다.", "뉴기니(NEW GUINEA) 방면 작전 무렵, 육군기를 포함한 일본의 모든 항공기를 해군 지휘 아래 두지 않으면 작전을 최대 성과로 수행할 수 없다는 의견을 낸 해군 장교들이 있었다고 전한다."], "primary": "**문.** (오프스티 소장) 전쟁 기간 내내 귀관의 직위는 전쟁의 진행 상황, 그리고 최고회의(Supreme Council)와 대본영(Imperial Headquarters), 각 통수부(General Staffs) 등에서 논의되던 계획과 정책에 관하여 충분히 정보를 받는 자리였습니까?\n\n**답.** 일본 해군에서 각 함대 사령장관과 각 진수부 사령장관은, 작전에 관하여는 중앙부(Central Headquarters)로부터 지시를 받았습니다만, 기본 정책에 관한 사항에 대하여는 자문을 받지 않습니다. 따라서 개전 이래 저는 도쿄(TOKYO) 중앙부로부터 그러한 사항에 관하여 자문을 받은 일이 없습니다.\n\n**문.** 그러나 저는 귀관이 일본의 전쟁 계획, 즉 대동아전쟁(Greater East ASIA War)을 위한 국가 전쟁 정책에는 충분히 정통했으리라고 봅니다. 그렇습니까?\n\n**답.** 정확한 날짜는 제가 틀릴 수도 있습니다만, 1941년 11월 5일이었다고 생각합니다. 각 진수부와 각 요항부(minor Naval Stations)의 사령장관들이 도쿄(TOKYO)에 소집되어, 대미(對美) 개전 시의 작전 계획에 관한 설명을 들었습니다. 그러나 그 계획에 대하여 의견을 말하거나 수정을 제안할 기회는 저희에게 주어지지 않았습니다.\n\n**문.** 대장, 기본 전쟁 계획을 준비하는 과정에서 해군은 물론 육군 쪽에서도 완전한 이해와 합의가 있었다고 보십니까?\n\n**답.** 아닙니다. 유감스럽게도 사정은 그렇지 못했다고 말씀드려야겠습니다. 육군이 큰 정치적 권력을 쥐고 있었기 때문에, 해군이 원하는 것을 모두 얻어내려 했다면 일정한 곤란에 부딪혔을 것입니다. 그러한 사정은 전쟁 중만이 아니라 개전 이전에도 마찬가지였습니다.\n\n**문.** 조금 더 나아가서 — 예컨대 기본 전쟁 계획이 변경되어, 알류샨(ALEUTIANS)·솔로몬(SOLOMONS)·미드웨이(MIDWAY)로 들어감으로써 당면 목표를 다소 확대하기로 결정되었을 때, 그 변경은 육군의 동의를 얻었거나 육군의 검토를 거쳐 만족스러운 합의에 이르렀습니까?\n\n**답.** 그때 저는 구레(KURE)에 있었으므로, 해군의 기본 방침이나 그러한 점들에 관한 육군과의 협조 문제에 대하여 알 수 있는 위치에 있지 않았습니다.\n\n**문.** 그렇더라도, 알류샨(ALEUTIANS)으로 들어가고, 솔로몬(SOLOMONS)과 포트모르즈비(PORT MORESBY)로 들어가며, 미드웨이(MIDWAY)에 상륙한다는 결정과 같은 큰 변경이 이루어졌다면, 그런 문제는 당연히 두 군종 사이에서 꽤 폭넓게 논의되지 않았겠습니까?\n\n**답.** 물론 그만한 중요성을 가진 점들에 대해서는 두 군종 사이의 논의가 당연히 있었으리라고 생각합니다만, 당시 저는 도쿄(TOKYO)가 아니라 구레(KURE)에 있었으므로 그 논의가 어떻게 이루어졌고 어떻게 진행되었는지는 알지 못합니다. 물론 그런 문제들이 저에게 알려졌을 때 저 나름의 분명한 개인적 의견은 가지고 있었습니다만, 그 의견을 중앙부에 올릴 기회는 주어지지 않았습니다.\n\n*--313--*\n\n**문.** 대장, 간단히 말씀해 주십시오. 일본의 전쟁 목적은 무엇이었다고 보십니까?\n\n**답.** 물론 저에게도 전쟁 목적이 무엇이었을지에 관한 저 나름의 의견이 있었습니다. 일반 국민 쪽에도 분명 다른 의견이 있었을 것이고, 정부가 견지한 전쟁 목적은 밝혀져 있습니다만, 저는 우리나라의 전쟁 목적이 무엇이라고 제가 생각하는지를 어느 때에도 표명한 일이 없습니다. 제 공적 지위상 전쟁 목적에 관하여 아무런 발언도 하지 않았습니다.\n\n**문.** 전쟁 목적에 관한 정부의 입장을 귀관은 어떻게 이해하고 있었습니까?\n\n**답.** 정부의 전쟁 목적이 무엇이었을지에 대하여 제 나름의 확정적 의견을 말씀드리기는 매우 어렵습니다. 왜냐하면 저는 지금도 그렇게 느끼고 당시에도 그렇게 느꼈습니다만, 나라가 충분히 애를 썼더라면 전쟁을 피할 수 있었으리라고 보기 때문입니다.\n\n**문.** 취해지지 않았지만 취했더라면 전쟁을 피할 수 있었을 조치로는 무엇이 있었다고 생각하십니까?\n\n**답.** 당시 우리나라가 전쟁을 피하기 위해 필요했던 것은, 그때 나라를 이끌 수 있는 강하고 현명한 정치가의 존재였습니다.\n\n제 마음속에는 개전 당시 정권을 쥐고 있던 정부만이 전쟁이 시작된 데 대한 책임을 져야 하는가에 대해 큰 의문이 있습니다. 더 거슬러 올라가야 하는 것이 아닌가 — 만주사변(Manchurian Incident) 때까지도 말입니다. 그때 나라의 사정이, 우리 천황(EMPEROR)께서 그리시던 바가 세계의 다른 나라들에 알려지는 것이 사실상 불가능한 지경이 되었습니다. 저는 이 심문의 목적을 이해한다고 생각합니다만, 한 가지 반드시 양해를 구해야 할 점이 있습니다. 그것은 이른 시절부터 육해군 군인은 정치에 관여해서는 안 된다는 것이 저의 신념이었다는 사실입니다. 그리고 그것은 실제로 천황(EMPEROR)께서 육해군에 내리신 칙유(軍人勅諭)에서 제시된 중요한 요점 중 하나입니다. 정치 권력과 군사 권력이 같은 손에 결합되어서는 아무것도 나올 것이 없다는 것이 언제나 저의 신념이었습니다.\n\n제가 소장(Rear Admiral)이 되었을 무렵에 만주사변이 일어났고, 그때 이래로 저는 젊은 장교들에게 그 점에 관한 제 신념을 말해 왔습니다. 그런 이유로, 물론 이 전쟁에 관하여 개인적 의견을 가지고 있기는 합니다만, 그것이 다른 사람들의 견해와 일치할지는 의문입니다. 아마 일치하지 않을 것이고, 그런 까닭에 전쟁의 여러 국면에 관한 제 개인적 의견의 표명이 귀관들에게 큰 값어치가 있을지 의심스럽습니다.\n\n**문.** 그런데 앞서 하신 말씀에서 저는, 귀관이 육군이 정치에 매우 깊이 관여했으며, 해군이 조금이라도 관여했다 하더라도 해군보다 훨씬 더 그러했다고 느끼고 있다고 이해했습니다. 맞습니까?\n\n**답.** 저는 사정이 그러했다고 분명히 말씀드리기를 주저하지 않습니다. 즉 육군은 정치에 관여했으며, 그것은 최근의 현상이 아닙니다. 상당히 과거로 거슬러 올라가며, 멀리 메이지(MEIJI) 시대까지 더듬어 올라갑니다. 육군이 내각의 구성에까지 역할을 한 방식을 보면, 육군의 정치 활동이 여러 해 전 과거까지 거슬러 올라간다는 것을 알 수 있습니다.\n\n**문.** 다시 말해 육군은 국가 정책에 깊은 영향을 미쳤다는 것입니다. 그렇게 말해도 되겠습니까?\n\n**답.** 그렇다고 생각합니다.\n\n**문.** 그 영향이 해군 작전에 직접적인 효과를 미칠 정도에까지 이르렀습니까? 예컨대 특정 방향으로의 확장을 밀어붙인다든지, 전선의 병력에 보급하기 위해 잠수함을 쓴다든지, 육군이 고른 목표에 해군력을 우선 쓰게 한다든지 하는 식으로 말입니다. 다시 말해 육군이 순전히 해군의 소관 사항에 간섭했습니까?\n\n**답.** 군수 장비 분야에서는 육군의 영향을 상당한 정도로 느꼈다고 생각합니다만, 작전 사항에서는 아마도 몇 가지 예외를 빼면 두 군종 간의 협력이 꽤 만족스러웠습니다.\n\n**문.** 전쟁 초기 단계에, 계획의 성공을 위협하는 주요 요인이 무엇이라고 최고위층은 보았습니까? 중국(CHINA)의 병력이었습니까, 러시아가 만주(MANCHURIA)로 들어올 가능성이었습니까, 오스트레일리아–뉴기니(AUSTRALIA-NEW GUINEA) 방면 — 그곳의 미군이었습니까, 아니면 전쟁 초기 동쪽의 미군이었습니까?\n\n**답.** 물론 앞서 말씀드린 대로 저는 중앙부의 전쟁 계획 수립에 관여한 바가 없습니다만, 개인적으로는 우리의 가장 큰 목표는 당연히 미국의 해군력과 항공 병력이라고 느꼈습니다.\n\n**문.** 동쪽으로부터의 위협입니까, 남동쪽으로부터의 위협입니까? 이것은 개전 초에 방어선(perimeter)이 설정되어 일본(JAPAN)이 그 전 둘레에 걸쳐 전쟁에 임하고 있던 때를 말합니다. 어느 지점엔가 가장 큰 위협이 있었을 것입니다.\n\n**답.** [저는] 가장 큰 위협은 태평양(PACIFIC)을 건너오는 미국 해군의 행동이라고 느꼈습니다.\n\n**문.** 중국(CHINA)에서의 육군 작전이, 방금 말씀하신 동쪽으로부터의 공격에 대하여 일본이 스스로를 방어할 능력을 어느 정도나 감소시켰거나 달리 영향을 미쳤다고 보십니까?\n\n**답.** 물론 저는 육군 자체에 관하여는 잘 알지 못합니다만, 미국(UNITED STATES)과의 전쟁과 아시아 대륙에서의 중국(CHINA)과의 전쟁을 동시에 수행하려 한 것은 큰 잘못이었다고 늘 느껴 왔습니다. 그리고 어느 정도의 희생을 치르더라도 중국과의 전쟁은 청산해야 한다고 느꼈습니다.\n\n*--314--*\n\n**문.** 다시 말씀드립니다만, 주된 위협이 동쪽으로부터 오는 미국 해군이었다면, 그 위협에 맞서는 주된 책임은 일본 해군에 있었던 것입니다. 그렇게 말해도 무방하겠습니까?\n\n**답.** 그렇습니다. 그것이 제 의견이었고, 도쿄(TOKYO) 중앙부의 해군 당국도 그 생각을 공유했다고 믿습니다. 또 뉴기니(NEW GUINEA) 방면에서 작전이 수행되고 있던 무렵에, 육군기를 포함한 일본의 모든 항공기가 일본 해군의 지휘 아래 놓이지 않는 한 그 작전들을 최대의 성과로 수행할 수 없다는 의견을 표명한 장교들이 우리 해군에 있었다고 들었습니다.", "secondary": "Q. (Admiral Ofstie) Throughout the war were your positions such that you were fully informed\non the progress of the war, on the plans and policies under discussion in the Supreme Council,\nImperial Headquarters, by the General Staffs, etc.?\nA. In the Japanese Navy, the commandants of the various fleets and the various Naval Stations,\nwhile they received instructions from Central Headquarters regarding operations, are not\nconsulted on matters of fundamental policy; and, therefore, from the beginning of the war\nI was not consulted on those matters by the TOKYO headquarters.\n\nQ. I assume, however, that you were thoroughly familiar with the Japanese War Plan, their\nNational War policy for the Greater East ASIA War; is that correct?\nA. I may be wrong as to the exact date, but I believe it was on 5 November 1941 that the\nCommander-in-Chiefs of the various Naval Stations and minor Naval Stations were brought together\nin TOKYO and were given an explanation regarding our plans for operations in the event of\nwar against the UNITED STATES. No opportunity was given us, however, to make any comments on\nthose plans or to suggest modifications.\n\nQ. Admiral, would you say that in the preparation of the basic war plans there appeared to be\nfull understanding and agreement on the part of the Army as well as the Navy?\nA. No. I regret to say that such was not the situation. Because the Army had great political\npower, if the Navy were to endeavor to get all that it desired, it would encounter certain\ndifficulties. Such was the situation not only during the war but prior to the beginning\nof the war.\n\nQ. To go slightly further--as an example, when the basic war plan was changed and it was\ndecided to somewhat expand the immediate objective by going into the ALEUTIANS, SOLOMONS,\nMIDWAY, was that change agreed to or given consideration by the Army and a satisfactory\naccord reached?\nA. Having been in KURE at the time, I was not in a position to have knowledge as to the Navy's\nbasic policy or the question of cooperation with the Army upon such points.\n\nQ. But still, when a major change, such as the decision to go into the ALEUTIANS, to go into\nthe SOLOMONS and to PORT MORESBY, to land on MIDWAY, was made, surely such a matter would have\nbeen rather widely discussed between the services, wouldn't it?\nA. Of course, I think that discussion between the services on points of such importance took place\nas a matter of course, but as I was not in TOKYO at the time, but in KURE, I do not know how\nthose discussions took place or were carried out. of course I had definite personal opinions\nof my own regarding these questions when they were made known to me, but no chance was given\nto me to forward such opinions to Central Headquarters.\n--313--\n\nQ. Admiral, what do you consider, just briefly, were the Japanese war aims?\nA. I, of course had an opinion of my own as to what the war aims probably were. There was\nundoubtedly other opinion on the part of the general public, and war aims as held by the\nGovernment have been clarified; but I did not at any time give expression to what I considered\nto be the war aim of our country. From my official position I made no statement regarding\nwar aims.\n\nQ. What was your understanding of the Government's position as to war aims?\nA. It is very difficult for me to give a definite opinion of my own as to what the Government's\nwar aim probably was for the reason that I feel now and felt at the time that the country could\nhave avoided the war if it had tried hard enough.\n\nQ. What steps do you think might have been taken that were not taken that might have avoided\nthe war?\nA. Our country needed at the time to avoid war, the presence of a strong and wise statesman\nwho could have led the country at the time.\nThere is great doubt in my mind as to whether the Government that was in power at the beginning\nof the war should alone be held responsible for the war that the war started. I wonder whether\nwe should not go back farther, even to the Manchurian Incident when the situation in the country\nbecame such that it was virtually impossible for the situation in the country as envisaged by\nour EMPEROR to be made known to the rest of the World. I believe I understand the object of\nyour interrogation, but there is one point upon which I must secure understanding and that is\nthe fact that, from early days, it has been my conviction that soldiers and sailors should\nnot mix in politics; and that is, in fact, one of the important points brought out in the\nEMPEROR's rescript to the military and Navy. That has always been my conviction, that nothing\ncan come from combination of political and military power in one and the same hands.\nIt was about the time that I became a Rear Admiral that the Manchurian incident broke out,\nand ever since that time I have been telling my young officers my conviction on that point.\nFor that reason, although of course I have personal opinions regarding this war, I question\nwhether it would coincide with views of others. It probably would not, and for that reason\nI doubt whether an expression of my personal opinion on the various phases of the war would\nbe of much value to you.\n\nQ. From an earlier statement, however, I gathered that you felt the Army was very much in\npolitics, much more so than the Navy, if the Navy was at all. Is that correct?\nA. I do not hesitate to state definitely that such was the case; namely, that the Army did\nparticipate in politics and that is not a recent phenomenon. It goes back considerably\ninto the past. tracing as far back as the MEIJI era. I can see from the way in which the Army\nplayed a part, even in the formation of the cabinets, that the political activity of the Army\nwent back many years into the past.\n\nQ. In other words, the Army had a profound influence on national policies. It that a\ncorrect statement?\nA. I think so.\n\nQ. Did that influence extend to a point where it had a direct effect upon naval operations;\nsuch, for example, as pushing expansion in certain directions, using submarines to supply troops\nin the field, use of naval strength primarily for objectives which the Army selected?\nIn other words, did they interfere with strictly naval responsibilities?\nA. In the field of military equipment, I think we felt the effect of the Army's influence\nto a considerable extent, but in matters of operations the cooperation between the two services\nwas quite satisfactory, with a few exceptions perhaps.\n\nQ. In the early stages of the war, what was the opinion of the highest echelons as to the\nprobable major threat to the success of its plan? Was from forces in CHINA, was it the possibility\nof the Russians coming into MANCHURIA, was it down in the AUSTRALIA-NEW GUINEA Area--the American\nforces there--or was it the U.S. forces in the east, in the early part of the war?\nA. Of course, as already stated, I had no part in the laying down of the war plans in central\nheadquarters, but I personally felt that our biggest objective was of course the American\nNaval and Air Force.\n\nQ. The threat from the east or from the southeast? This was at the beginning of the war when\na perimeter has been established and which JAPAN faced all the war around. At some point\nthere was possibly the greatest threat.\nA. felt the biggest threat was the action of the American Navy coming across the PACIFIC.\n\nQ. To what extent do you consider that operations of the Army in CHINA reduced or otherwise\naffected JAPAN's ability to defend herself from the attack from the east which you mention?\nA. Of course I do not know much about the Army as such, but I have always felt that it was a\ngreat mistake to try to carry on, at the same time, war against the UNITED STATES and war\nagainst CHINA on the Asiatic Continent; and I felt that we should liquidate the war with\nCHINA even at some sacrifice.\n--314--\n\nQ. if the major threat, again, was from the American Navy from the east, then the major\nresponsibility for meeting that threat rested with the Japanese Navy. Is that a fair statement?\nA. Yes, such was my opinion, and I believe that feeling was shared by the naval authorities\nin TOKYO Headquarters; and I have heard that there were officers in our Navy who expressed\nthe opinion that around the time that the operations were being carried on around NEW GUINEA\nthat we could not carry out those operations with maximum success unless all the Japanese\naircraft, including those of the Army, were placed at the disposal of the Japanese Navy.", "note": "원문 105행은 'A. felt the biggest threat...'로 주어 I가 빠져 있다(원문 그대로 결락 표기 없이 문맥대로 옮김). 원문 36~38행의 'of course I had definite personal opinions'는 문장 첫 글자가 소문자로 시작하는 등 타자 오식이 여러 곳 있으나 고치지 않았다. 원문 115행 'if the major threat'도 소문자 시작이다. 'EMPEROR's rescript to the military and Navy'는 군인칙유(軍人勅諭)로 보아 그렇게 옮겼다. 'Supreme Council'은 최고전쟁지도회의를 가리키는 것으로 보이나 원문 표기대로 「최고회의」로 두고 병기했다.", "warn": false, "search": "Army's political power, Japanese war aims, and the American Navy as the principal threat 豊田副武 도요다 소에무 (TOYODA Soemu) — 대장, 심문 대상 R. A. Ofstie 오프스티 — 미 해군소장, 심문자 昭和天皇 천황 (EMPEROR) — 군인칙유의 하사자로 언급"}, {"id": "toyoda-2", "order": 2, "date": "1945-11-13", "group": "A", "eyebrow": "도요다 소에무 심문조서 · USSBS Nav-75", "title": "「전환점은 미드웨이였다」 — 생산·연료의 붕괴와 야마토의 오키나와 출격", "list_right": "문답", "meta": [{"k": "다루는 시점", "v": "1945-11-13"}, {"k": "문서 일자", "v": "1945-11-13"}, {"k": "성격", "v": "문답", "txt": true}, {"k": "원제", "v": "The turning point at MIDWAY, the collapse of production and fuel, and the YAMATO sortie to OKINAWA", "txt": true}], "summary": "도요다는 전쟁 전체를 통틀어 주된 위협은 미 수상 함대였다고 말하고, 전쟁의 전환점을 미드웨이 해전으로, 연료 사정이 극도로 나빠진 분기점을 필리핀 상실로 지목하며, 1945년 4월 야마토의 오키나와 출격 당시 연료 2,500톤을 긁어모으는 것조차 어려웠다고 증언한다.", "points": ["전쟁 전 기간을 통틀어 주된 위협은 미국의 수상 함대였으며, 미 공군의 효과도 해군 기동부대의 협력을 통해서만 발휘되었다고 평가한다.", "필리핀(PHILIPPINES) 상실 이후로는 해군력으로 미 해군에 성공적으로 맞설 수 없음이 다소 분명해졌고, 종전 직전에는 미군이 혼슈(HONSHU) 본토나 인근 도서에 상륙할 경우 「출혈(bleeding) 작전」만이 미 함대와 싸울 유일한 방법이라고 결정했다.", "일본이 전쟁 목적을 이루지 못한 원인 — 물질적으로는 자원이 없는 나라의 약함, 정신적으로는 국민에게 이 전쟁이 실제로 무엇을 위한 것인지 알리지 않은 것.", "미국 측 요인으로는 충분한 원자재와 풍부한 자원, 막대한 생산 능력, 그리고 생산 계획이 예정대로 실행된 점을 든다.", "연합함대 사령장관 부임 시 해군대신에게 「계획된 수를 못 채울 것 같으면 계획 자체를 줄이더라도 약속한 수는 반드시 달라」고 요청했으나, 생산이 계획을 따라가지 못해 지켜지지 않았다.", "생산 실패의 단일 원인을 굳이 꼽자면 원자재와 천연자원의 부족이며, 그 때문에 육해군은 국력에 어울리지 않는 넓은 전선으로 부족한 병력을 늘려 남방 자원을 확보하려 했다고 말한다.", "1945년 들어 항공기·항공 자재 생산 감소의 최대 원인은 일본 본토 공장에 대한 폭격이었으나, 전쟁 수행력 전반에 대한 최대 영향은 선박 부족과 그에 따른 남방 물자 수송 불능이었다.", "「전환점은 미드웨이(MIDWAY) 해전」 — 손실도 심각했고 예상보다 훨씬 많은 연료를 썼으며 그 여파가 이후 내내 이어졌다.", "연료 사정의 전환점은 필리핀 상실 — 이후 미군이 남중국 해·공을 장악해 남방 항로가 완전히 끊겼다.", "함대 연료 사정은 1945년 초에 극도로 악화되어 훈련조차 제한되었고, 4월 7~8일 야마토(YAMATO)를 구축함 12척 남짓과 함께 오키나와(OKINAWA)로 보낼 때 성공 확률이 반반이나 되는지 의심스러웠으며 필요한 중유 2,500톤을 모으는 데도 큰 어려움을 겪었다.", "그럼에도 보낸 이유 — 본토 해역에 놀려 두어 얻을 것이 없고, 보내지 않는 것은 일본 해군의 전통에 어긋난다고 보았기 때문.", "1944년 5월 연합함대 인수 당시에는 보르네오(BORNEO)와 수마트라(SUMATRA)의 유전에 접근할 수 있어 유류 자체는 거의 충분했으나, 유조선이 문제였다. 약 8만 톤의 유조선을 요청해 얻었으나 잠수함 공격으로 손실이 나기 시작했고, 사이판(SAIPAN) 작전 무렵에는 유조선 부족이 작전 계획 수립의 최대 장애였다.", "아고(A-GO) 작전 계획은 처음부터 함대의 마리아나 방어 투입을 포함했으나, 미군의 주공은 팔라우(PALAU)로 향할 개연성이 더 크다고 보았고 거리가 짧아 유조선 부담이 덜하다는 이점 때문에 아고 계획을 채택했다."], "primary": "**문.** 이 전반적 상황은 상당 기간 계속되었습니까? 마셜(MARSHALLS) 작전 이후에도, 사이판(SAIPAN) 이후에도, 필리핀(PHILIPPINES) 이후에도 계속되었습니까? 아니면 위협의 상대적 중요성 — 즉 미 해군의 위협 — 에 변화가 있었습니까? 그것이 어느 시점엔가 덜 중요해졌습니까?\n\n**답.** 그렇습니다. 전쟁의 전 기간을 놓고 보면, 미국의 수상 부대가 우리의 주된 위협이었다는 것이 제 느낌입니다. 그렇다고 미 공군(U.S. Air Force)의 효과를 간과하는 것은 아닙니다만, 그것조차도 미 해군 기동부대(Naval Task Force)의 협력을 통해서만 유효해졌습니다. 그러므로 국지적으로 고립된 지점에서는 예외가 있었을지 몰라도, 태평양(PACIFIC) 전 지역을 놓고 보면 미국의 수상 부대가 우리의 주된 위협을 이루었다고 생각합니다. 전쟁 말기에, 특히 필리핀(PHILIPPINES)을 잃은 뒤에는, 우리 해군력을 미국 해군력에 맞서 성공적으로 쓸 수 없다는 것이 다소 분명해졌습니다. 그래서 특히 종전 직전에는, 미군이 일본 본토 — 혼슈(HONSHU) — 나 인근의 어느 섬에 상륙을 시도할 경우 미국 함대와 싸울 유일한 방법은 우리가 「출혈(bleeding)」 작전이라 부른 것뿐이라고 결정했습니다.\n\n**문.** 귀관이 본 대로 전쟁의 경과를 따라갈 때, 가능하다면 몇 마디로, 일본이 전쟁 목적을 달성하지 못한 주된 원인은 무엇이었다고 하시겠습니까?\n\n**답.** 물질적인 면에서는 우리나라가 자원이 없어 참담하게 약했다는 사실입니다. 정신적인 면에서는, 가장 큰 방해물은 국민에게 이 전쟁이 실제로 무엇을 위한 것인지가 알려지지 않았고 그런 까닭에 국민이 전쟁 노력에 스스로를 정말로 던져 넣을 수 없었다는 사실이라고 하겠습니다.\n\n**문.** 미국(UNITED STATES) 쪽의 관점에서, 일본이 전쟁 목적을 달성하지 못하게 만든 주된 힘은 무엇이었다고 하시겠습니까?\n\n**답.** 미국 쪽에서는, 충분한 원자재와 넘치는 자원과 막대한 생산 능력을 가지고 있었다는 사실, 그리고 생산 계획이 거의 예정대로 실행되었다는 사실이라고 하겠습니다. 제가 연합함대의 지휘를 맡기 위해 도쿄(TOKYO)를 떠날 때 해군대신(Navy Minister)에게 한 가지 요청을 했던 것이 기억납니다. 해군 계획에 따라 연합함대에 약속된 모든 함정과 모든 항공기와 그 밖의 보급품이 글자 그대로 이행되도록 약속해 달라는 것이었습니다. 계획에 지정된 수를 끝까지 채우기 어렵다고 생각되면 계획을 바꾸어 달라고 했습니다. 예컨대 연합함대에 항공기 10기를 주기가 어려울 것 같으면 10기를 적어 놓지 말고 5기로 줄이되, 그 5기는 반드시 이행해 달라는 것이었습니다. 그러나 결과적으로 해군대신은 그 약속을 지킬 수 없었습니다. 지킬 뜻이 없어서가 아니라 생산이 도무지 계획을 따라가지 못했기 때문입니다.\n\n**문.** 그러면 같은 선에서 조금 더 나아가겠습니다. 생산 부족에는 여러 원인이 있습니다. 그 생산 부족의 주된 이유로 무엇을 꼽으시겠습니까?\n\n**답.** 생산 실패의 이유로 어느 한 가지를 짚어내기는 어렵습니다. 원인이 여럿이고 각각이 다소간 악순환을 이루며 서로에게 영향을 미친다고 생각하기 때문입니다. 그러나 하나를 꼽아야 한다면 원자재와 천연자원의 부족을 들겠습니다. 물론 일본 본토와 중국(CHINA)과 만주(MANCHURIA)로부터 우리 생산 공장에 원자재를 공급하는 것은 불가능했습니다. 그것은 처음부터 명백했고, 바로 그 때문에 우리 육해군은 남방에서 원자재를 얻기 위해 부족한 병력을 그토록 넓은 지역에, 우리의 병력 규모에 전혀 어울리지 않는 전선을 따라 늘려 놓았던 것입니다. 그러나 결과적으로 그것은 그 지역에서 우리가 가진 힘으로는 너무 많은 영역을 떠맡은 것이었습니다.\n\n**문.** 남방으로부터 그 원자재를 본국으로 들여오지 못한 주된 이유는 무엇이었습니까?\n\n**답.** 주된 이유는, 우선 우리에게 충분한 수의 선박이 없었다는 것, 그리고 가지고 있던 것마저 귀측의 잠수함과 항공 공격으로 큰 손해를 입었다는 것이라고 생각합니다.\n\n**문.** 귀관이 처하게 된 상황의 주요 항목으로서, 일차적 원인은 무엇이었다고 하시겠습니까? 선박의 상실이었습니까, 함대 전력의 심각한 손상이었습니까, 항공력의 상실이었습니까, 항공과 잠수함에 의한 봉쇄였습니까, 아니면 본토 폭격이었습니까?\n\n**답.** 올해(1945년) 들어서는 생산 감소의, 특히 항공기와 항공 자재 생산 감소의 가장 큰 원인이 일본 본토의 국내 공장 — 생산 시설 — 에 대한 귀측의 폭격의 효과였다고 생각합니다. 그러나 우리 전쟁 수행력 전반에 미친 영향에 관하여는, 결국 가장 큰 영향은 선박의 부족과 그로 인해 남방에서 물자를 들여올 수 없었던 것이 미쳤다고 생각합니다. 그와 관련하여서도, 전쟁 중에는 일본에 물자가 부족하지 않았던 시기가 있었으나 수송 수단의 부족으로 물자를 한 곳에서 다른 곳으로 옮길 수 없었던 때가 있었습니다. 다시 말해 여러 원인이 서로에게 영향을 미쳐 전반적인 생산 수준의 저하를 불러왔습니다.\n\n*--315--*\n\n**문.** 그러면 모든 요인 — 생산의 부족, 함대의 상태, 그리고 항공 전력에 관한 귀관의 처지 — 을 고려할 때, 전쟁의 어느 시점에서 전쟁을 성공적으로 계속할 수 없으리라는 개연성을 깨달으셨습니까? 어떤 한 시점, 어떤 한 전투, 어떤 한 작전이 있습니까?\n\n**답.** 처음부터 어렵다고 느꼈습니다만, 전환점이라 할 만한 것은 미드웨이(MIDWAY) 해전이었다고 생각합니다. 그곳에서의 우리 손실은 매우 심각한 영향을 우리에게 미쳤고, 아울러 그때 우리는 필요하리라 예상했던 것보다 훨씬 많은 연료를 썼습니다. 그리고 그 영향은 그 뒤로 내내 느껴졌습니다. 올해(1945년) 제가 군령부총장으로 중앙부에 왔을 때, 항공기와 항공 연료와 수상 함정용 중유에 관하여 당시의 실정을 보고받고서, 그러한 조건에서 전쟁을 계속하는 것이 극도로 어렵다는 것을 그 어느 때보다도 절실히 깨달았습니다. 연료 사정에 관한 한 전환점은 — 즉 그 뒤로 우리 연료 사정이 극도로 급박해진 시기는 — 귀측 병력에 필리핀(PHILIPPINES)을 잃은 것이었다고 생각합니다. 그 뒤로 귀측이 남중국(South CHINA) 상공과 해상을 장악하여 남방으로 가는 우리 항로를 완전히 끊어 버렸기 때문입니다.\n\n**문.** 함대의 움직임이 연료 부족으로 확실히 제약을 받은 것은 언제가 처음이었습니까?\n\n**답.** 함대 연료 사정은 올해(1945년) 초에 매우 급박해졌습니다. 우리 수상 부대는 훈련 활동까지 제한을 받았고, 다량의 연료 보급을 필요로 하는 대규모 작전은 거의 논외가 되었습니다. 올해 4월 7~8일 전함 야마토(YAMATO)를 구축함 12척 남짓과 함께 오키나와(OKINAWA)로 보냈을 때, 우리는 성공 확률이 반반(50-50)이라도 되는지 의심스러웠습니다. 그 전대를 편성하는 데만도 필요한 중유 2,500톤을 긁어모으느라 매우 큰 어려움을 겪었습니다. 그러나 반반의 승산이 없다 하더라도 그 함정들을 본토 해역에 놀려 두어서는 얻을 것이 없다고 여겼고, 게다가 성공의 승산이 반반이라고 분명히 볼 수 없더라도 그것들을 보내지 않는 것은 일본 해군의 전통에 어긋나는 일이었습니다. 올해 초 연료 사정이 그만큼 급박했습니다.\n\n**문.** 그보다 1년 전의 사정은 어떠했습니까? 함대를 자유로이 움직일 수 있었습니까?\n\n**답.** 아닙니다. 1년 전에 우리에게 충분한 연료 보급이 있었다고는 말하지 않겠습니다. 저는 그 전해(1944년) 5월에 연합함대를 인수했습니다. 다만 그때는 보르네오(BORNEO)와 수마트라(SUMATRA)의 석유에 접근할 수 있었습니다. 남방에서 직접 보급을 받을 수 있었으므로, 유류의 재고는 함대의 목적에 거의 충분했고 어려움은 유조선에 있었습니다. 저는 함대용으로 약 8만 톤의 유조선을 요청하여 얻었습니다만, 잠수함 작전으로 손해를 입기 시작했습니다. 그리고 사이판(SAIPAN) 작전 무렵에는 작전 계획을 세우는 데 가장 큰 방해물이 그것을 뒷받침할 유조선이 충분치 않다는 사실이었습니다.\n\n**문.** 다시 사이판(SAIPAN) 혹은 마리아나(MARIANAS) 작전에 관하여, 애초의 아고(A-GO) 계획은 마리아나 방어에 함대를 쓰는 것을 상정하고 있었습니까?\n\n**답.** 그렇습니다. 함대의 사용은 처음부터 그 계획에 포함되어 있었습니다. 다만 마리아나에 대한 귀측의 공세 가능성을 무시하거나 얕본 것은 아니었습니다만, 우리는 귀측의 공격이 팔라우(PALAU) 쪽으로 향할 개연성이 더 크다고 생각했습니다. 그것이 우리가 아고(A-GO) 작전 계획을 채택한 이유였는데, 그 계획은 거리가 더 짧아 우리에게 더 유리했고 앞서 말씀드린 대로 우리의 가장 큰 약점이었던 유조선의 필요를 어느 정도 덜어 주는 것이었습니다.", "secondary": "Q. Did this general situation continue for a considerable period? Did it continue after the\nMARSHALLS Operation, after SAIPAN, after the PHILIPPINES: or was there a change in the relative\nimportance of the threat--that is, of the U.S. Navy threat? Did that at some time become\nless important?\nA. Yes, taking the whole period of the war, my feeling is that the American surface forces\nwere our principal threat. That is not to overlook the effect of the U.S. Air Force, but even that\nwas made effective only through the cooperation of the American Naval Task Force. So while there\nmight have been exceptions locally in isolated spots, taking the whole area of the PACIFIC,\nI think that the U.S. surface forces constituted our main threat. Toward the end of the war,\nparticularly after the loss of the PHILIPPINES, it became more or less clear that we could\nnot successfully use our naval forces against the American naval forces; so that, especially\njust prior to the conclusion of the war, we decided that the only way to combat the American\nFleet was by what we termed \"bleeding\" operations, should American forces endeavor to make a\nlanding either on JAPAN proper--HONSHU--or on some nearby island.\n\nQ. In following the progress of the war as you saw it, what would you say, in just a few words\nif it can so be done, were the chief causes for the inability of JAPAN to carry out her war aims?\nA. On the material side, the fact that our country was woefully weak, lacking resources.\nOn the spiritual side, I should say that the biggest hindrance was the fact that people were\nnot told what this war was actually for, and for that reason they were not able to really put\nthemselves into the war effort.\n\nQ. From the standpoint of the UNITED STATES, what was the principal force you might say that\nresulted in Japan's inability to carry out her war aims?\nA. On the American side I should say that it was the fact that you had adequate raw materials,\nbountiful resources, and tremendous production capacity, and the fact that production plans\nwere carried out very much according to schedule. I recall that when I left TOKYO to take over\ncommand of the Combined Fleet I made one request of the Navy Minister, and that was the fact\nthat he should promise that all the ships, all the planes, and other supplies which were\npromised to the Combined Fleet under the Naval Plan should be carried out to the letter;\nthat if he felt that it was impossible to go through with the number designated in the plan,\nto change the plan. For instance, if he thought it was going to be difficult to let the\nCombined Fleet have ten planes, don't pout ten planes down but reduce that to five, but be sure\nto come through with the five planes. But as it turned out, the Navy Minister was not able\nto carry out that promise, not because of lack of will to do so but because production\nsimply did not keep up with the plan.\n\nQ. Then to go a little further along the same line, lack of production has many causes.\nWhat would you ascribe the principle reason for the lack of that production?\nA. It is difficult to point to any one thing as the reason for failure in production because\nthere are many and each, I think operates to affect the others in more or less of a vicious\ncircle, but if I have to name one, I would point out lack of raw materials and natural resources.\nIt was, of course, impossible to supply our production plants with raw materials from JAPAN\nproper, CHINA and MANCHURIA. That was evident from the first, and it was for that reason that\nour Army and Navy extended their insufficient force over such a broad area, along battle lines\nall out of proportion to our strength in men, in order to obtain raw materials from the south,\nbut as it turned out, that was simply taking in too much territory with the strength that\nwe had in that area.\n\nQ. What was the principal reason why you couldn't get those raw materials to your country\nfrom the south?\nA. The main reason, I think was that we did not have a sufficient number of ships to begin with,\nand such as we had, we suffered heavy damage owing to your submarines and air action.\n\nQ. As major items in the position that you came to, what would you say were the primary causes?\nWas it the loss of shipping, was it the severe damage to the fleet strength, was it loss of\nair power, was it blockade by air and submarines, or was it bombing of the homeland?\nA. Beginning this year, I think the biggest cause of fall in production, especially in aircraft\nand air material, was the effect of your bombing on the domestic plants--factories--in JAPAN\nproper; but as regards the effects on our war strength on the whole, I think the greatest effect\nwas felt after all by the lack of ships and consequent inability to bring material from the south.\nAlong that line also there were periods in the war when there was not a lack of material\nin JAPAN, but they could not be moved from one place to another owing to lack of transportation\nfacilities. In other words, various causes affected one another to bring down the general fall\nin production level.\n--315--\n\nQ. Now, considering all factors--the lack of production and the condition of the fleet and\nyour position with respect to air strength--at what point in the war did you realize the\nprobability that the war could not be successfully continued? Is there some one point, some action,\nsome operation?\nA. I felt it was difficult from the very beginning, but I think what might be termed the turning\npoint was the Battle of MIDWAY. Our losses there had a very serious effect upon us, together with\nthe fact that we used very much fuel at that time, more than we had expected would be necessary;\nand the effect of that was felt right through afterwards. When I came to Central Headquarters\nas Chief of the Naval Staff this year and was informed of the situation prevailing then\nwith regard to aircraft, aviation fuel, heavy oil for surface units, I realized more than\never, then, that continuation of the war under such conditions was extremely difficult.\nI believe the turning point, in so far as the fuel situation was concerned--that is, the period\nafter which our fuel situation became extremely acute--was our loss of the PHILIPPINES\nto your forces, because after that you had control of air and sea over South CHINA and\ncompletely cut off our shipping lanes to the south.\n\nQ. What was the first time when the movements of the fleet were definitely restricted\nby lack of fuel?\nA. The fleet fuel situation became very acute early in this year. Our surface units were\nrestricted even as to their training activities, and any large-scale operation requiring\nheavy supplies of fuel became almost out of the question. On 7-8 April of this year when\nthe battleship YAMATO was sent with a dozen or more destroyers into OKINAWA, we questioned\nwhether there was a 50-50 chance. Even in getting that squadron together we had a very\ndifficult time getting the necessary 2,500 tons of fuel oil together. But it was felt that,\neven if there was not a 50-50 chance, nothing was to be gained by letting those ships lie idle\nin home waters, and besides it would have been contrary to the tradition of the Japanese Navy\nnot to have sent them, even though we could not clearly perceive they had a 50-50 chance\nof success. That is how acute the fuel situation was in the early part of this year.\n\nQ. What was the situation, let's say, one year preceding that? Were you free to move\nyour fleet about?\nA. No, I would not say that we had adequate fuel supplies a year before. I took over the Combined\nFleet in May of the preceding year. At that time, however, we had access to the oil in BORNEO\nand SUMATRA. We were able to obtain supplies directly from the south; so while the stock\nof oil was almost sufficient for purposes of a fleet, the difficulty was in tankers. I had asked\nfor and obtained approximately 80,000 tons of tankers for fleet use, but we began to suffer\ndamages through submarine operations; and by the time of the SAIPAN operation, the greatest\nhindrance to the drafting of the operation plans was the fact that we did not have sufficient\ntankers to support it.\n\nQ. Again with regard to the SAIPAN or the MARIANAS Operations, did the original A-GO Plan\ncontemplate the use of the fleet in defense of the MARIANAS?\nA. Yes, use of the fleet was included in those plans from the beginning. But while the\npossibility of your offensive against the MARIANAS was not ignored or belittled, we thought\nthe probability would be that your attack would be directed more against PALAU, and that was\nthe reason for our adoption of the A-GO Operation Plan, which was more to our advantage\nbecause of the shorter distance involved and would eliminate the need of tankers to some\nextent, which was, as already stated, our greatest handicap.", "note": "원문 33행 'don't pout ten planes down'은 'put'의 오식으로 보이나 고치지 않고 문맥대로 옮겼다. 원문 68행 이하에서 도요다가 말하는 'this year'는 심문 시점 기준 1945년, 'the preceding year'는 1944년이다 — 번역에서는 혼동을 막기 위해 연도를 병기했다. 'Navy Minister'는 1944년 5월 시점 기준 시마다 시게타로에서 요나이 미쓰마사로 넘어가는 시기에 걸쳐 있어 원문에 이름이 없으므로 직명만 옮겼다. 'bleeding operations'는 원문 그대로 「출혈(bleeding) 작전」으로 병기했다.", "warn": false, "search": "The turning point at MIDWAY, the collapse of production and fuel, and the YAMATO sortie to OKINAWA 豊田副武 도요다 소에무 (TOYODA Soemu) — 대장, 심문 대상 米内光政 요나이 미쓰마사 — 해군대신(Navy Minister)으로 직명만 언급됨"}, {"id": "toyoda-3", "order": 3, "date": "1945-11-13", "group": "A", "eyebrow": "도요다 소에무 심문조서 · USSBS Nav-75", "title": "쇼고(捷號) 작전과 레이테의 도박 — 구리타의 임무, 「천우를 믿고 돌진하라」, 그리고 반전(反轉)", "list_right": "문답", "meta": [{"k": "다루는 시점", "v": "1945-11-13"}, {"k": "문서 일자", "v": "1945-11-13"}, {"k": "성격", "v": "문답", "txt": true}, {"k": "원제", "v": "The SHO-GO gamble at LEYTE: KURITA's mission, the order \"Advance counting on Divine Assistance\", and the turn-back", "txt": true}], "summary": "도요다는 전 함대를 필리핀에 투입한 것이 계산된 도박이었음을 밝히고, 구리타 함대에 손해의 제한 없이 「천우를 믿고 돌진하라」는 명령을 보낸 이유를 설명하며, 그럼에도 구리타의 반전을 잘못이라 보지 않는다고 말한다.", "points": ["마리아나에 미군 공격이 오면 처음부터 함대를 쓸 작정이었다.", "함대와 기지 항공대의 협동은 극도로 어려웠다 — 통신 곤란으로 두 지휘관의 대면 회합은 사실상 불가능했고, 수상 부대가 육상기의 통신을 수신·감청할 단계에 이르지 못했으며 통신 기재의 성능이 낮았다.", "필리핀에 대한 미군 공세는 8월 또는 9월 무렵으로 예상했고 그 예상은 맞았으나, 사이판 작전이 6~7월에 있었던 탓에 항공기 보충에 4~5개월이 걸려 10월이나 11월 이전에는 쇼고(SHO-GO) 작전을 시작할 준비가 되어 있지 않았다.", "마리아나·비아크(BIAK) 등을 잇달아 잃은 뒤 국내에서 「해군은 무엇을 하고 있느냐」는 물음이 나오기 시작했으며, 도쿄 중앙부의 동의를 얻어 전 함대를 필리핀 작전에 투입하는 도박을 하기로 결정했다.", "잘되면 뜻밖의 좋은 결과를, 최악의 경우 함대 전부를 잃을 수 있다고 보았으나 그 위험은 감수해야 한다고 판단했다.", "북방 부대(오자와)를 미끼로 쓴 것은 원래의 쇼고 작전 기본 계획에 없었고 레이테(LEYTE) 상륙 개시 보고가 들어온 뒤 채택되었다.", "10월 중순 제3·제4항공전대의 항공기를 대만(FORMOSA)에 육상 기지화해 보낸 이유는, 조종사 다수가 훈련이 부족하여 항모에서 이함은 할 수 있어도 항상 항모로 돌아오지는 못했기 때문이다.", "구리타(KURITA)의 임무는 레이테만(LEYTE Bay) 수송선단의 완전 격멸이었고, 명령에 그가 감수할 손해에 대한 제한은 없었다.", "10월 24일 오후 제2함대가 항공 공격으로 상당한 손해를 입고 해협 안에서 되돌아서기 시작하자, 도요다는 연합함대 명의로 「천우를 믿고 돌진하라(Advance counting on Divine Assistance)」는 취지의 명령을 보냈다 — 함대가 완전히 상실되더라도 전진하라는 뜻이었다.", "그 결단의 이유 — 필리핀에서 지면 함대가 남더라도 남방 항로가 완전히 끊겨 본토로 돌아와도 연료를 얻을 수 없고 남방에 남아도 탄약과 병기를 보급받을 수 없으니, 필리핀을 잃으면서 함대를 살릴 의미가 없다는 것.", "구리타의 반전 이유에 대해 도요다는, 연합함대 사령부는 일반적 목표만 지시하고 세부는 현지 지휘관에게 맡긴다며 구리타가 만 안으로 진입해도 기대한 성과가 없으리라 판단했을 것이라고 답한다.", "지금 돌이켜 보면 그 철수는 잘못이 아니었으며, 뒤에 핼시(HALSEY) 기동부대가 생각보다 남쪽에 있었음을 알게 된 이상 구리타는 항공 공격 권내에 있었을 것이므로 반전은 현명치 못한 일이 아니었다고 하며, 「비판하지 않겠다」고 말한다."], "primary": "**문.** 그러나 공격이 마리아나(MARIANAS)로 오는 경우에는 처음부터 함대를 쓸 작정이었습니까?\n\n**답.** 그렇습니다. 귀측의 공격이 마리아나(MARIANAS) 쪽으로 향한다면 함대를 쓸 수밖에 없다는 것이 처음부터의 의도였습니다.\n\n**문.** 그런데 함대와 기지 항공대는 둘 다 귀관의 지휘 계통에 속해 있었는데, 사이판(SAIPAN)에서 그 두 병력의 작전을 신속히 협동시키기 위해 어떤 수단을 가지고 있었습니까?\n\n**답.** 기지 항공 병력과 함대 사이의 협력은 극도로 어려웠습니다. 통신이 곤란했던 탓에 두 지휘관이 육상에서 만나는 것은 사실상 논외였습니다. 때로는 참모 장교들을 합동 회의에 파견했고, 경우에 따라서는 군령부 사령부에서 기지 항공 병력의 사령부로 참모 장교들을 보내기도 했습니다. 그러나 일반적으로 말해서 시종 긴밀한 통신을 유지하지 못한 것이 두 병력 사이의 충분한 협력을 가로막은 주된 어려움 가운데 하나였습니다. 우리의 통신 방식은, 예컨대 수상 부대가 육상 기지 항공기의 통신을 감청하거나 수신할 수 있는 단계에까지 발전해 있지 않았습니다. 통신의 어려움에는 통신 기재의 성능이 낮았다는 것도 한 이유였습니다.\n\n**문.** 다음으로 필리핀(PHILIPPINES) 방어를 위한 쇼고(SHO-GO) 작전과 관련하여, 귀관은 그곳에 대한 우리의 공격이 언제 오리라고 판단했으며, 우리는 그 판단보다 앞서 도달했습니까, 그리고 그 결과는 어떠했습니까?\n\n**답.** 저는 필리핀(PHILIPPINES)에 대한 귀측의 공격이 8월이나 9월 무렵 개시되리라 예상했고, 그 점에 관한 제 예상은 맞았습니다. 즉 작전이 실제로 시작된 것이 대략 그 무렵입니다. 아고(A-GO) 작전에 관하여는 5월에 공격이 오리라 예상했으나 실제 공격은 약 한 달 뒤인 6월에 왔습니다. 필리핀에 대한 귀측의 공세가 8월이나 9월 무렵 시작되리라 예상했다고 말씀드렸습니다만, 그렇다고 그때 우리가 그 공세를 맞을 준비가 되어 있었다는 뜻은 아닙니다. 왜냐하면 우리 육해군 병력은 여러 작전에서 지원 항공기를 사실상 전부 잃었고, 잃은 항공기를 보충하는 데 넉넉잡아 4개월에서 5개월이 걸렸기 때문입니다. 사이판(SAIPAN) 작전이 6월과 7월에 있었으므로, 우리는 10월이나 11월 이전에는 쇼고(SHO-GO) 작전을 개시할 준비가 되어 있지 않았습니다. 그러나 저는 귀측이 그때까지 기다리지 않고 8월이나 9월 무렵에 필리핀에 대한 작전을 개시하리라 느꼈습니다.\n\n*--316--*\n\n**문.** 다시 쇼고(SHO-GO) 작전에 관하여, 어떤 이득을 얻기 위해 함대에서 어느 정도의 손실까지 감수할 뜻이 있었습니까? 다시 말해 그곳에서 무엇과 무엇을 맞바꿀 — 손실과 이득을 — 각오였습니까?\n\n**답.** 앞서 말씀드린 대로 귀측의 작전이 시작된 시점에 우리 기동부대와 항공 부대는 작전할 준비가 되어 있지 않았습니다. 우리는 기동부대를 레이테(LEYTE)로 끌고 들어가는 것이 큰 도박이라고 느꼈습니다. 그리고 우리가 여론에 좌우되었다고 말하는 것은 정확하지 않겠습니다만, 마리아나(MARIANAS)와 비아크(BIAK)처럼 남방의 거점을 하나하나 잃은 뒤로 해군은 대체 무엇을 하고 있느냐는 물음이 국내에서 나오기 시작하고 있었습니다. 그래서 도쿄(TOKYO)의 중앙부와 협의하여 그 동의를 얻은 뒤, 이 도박을 걸어 전 함대를 필리핀(PHILIPPINE) 작전에 투입하기로 결정했습니다. 당시 함대의 일부는 본토 해역에 있었습니다. 그것을 서둘러 남쪽으로 보내어 나머지 함대와 함께 이 작전에 참가하게 했습니다. 그리고 함대의 일부를 귀측의 기동부대를 북쪽으로 유인하는 데 쓴다는 것이 우리의 계획이었습니다. 그러나 우리 연합함대의 참가 없이는 필리핀의 기지 병력이 귀측 병력에 맞서 조금이라도 승산을 가질 가능성이 전혀 없었으므로, 도박을 걸어 전 함대를 보내기로 결정한 것입니다.\n\n일이 잘 풀리면 뜻밖에 좋은 결과를 얻을 수도 있었습니다만, 최악의 경우가 닥친다면 함대 전부를 잃을 가능성이 있었습니다. 그러나 저는 그 위험은 감수해야 한다고 느꼈습니다.\n\n**문.** 귀관이 미끼라고 말씀하신 북방 부대의 사용은 처음부터 계획된 것이었습니까, 아니면 당시의 상황에 따른 그때그때의 결정이었습니까?\n\n**답.** 아닙니다. 그것은 원래 정해 둔 기본 계획의 일부가 아니었고, 레이테(LEYTE)에서 상륙이 시작되었다는 보고가 들어왔을 때 채택된 것입니다. 애초의 쇼고(SHO-GO) 작전 계획의 일부가 아니었습니다.\n\n**문.** 10월 중순 무렵, 제3항공전대와 제4항공전대(Carrier Divisions 3 and 4)의 항공기 일정 수가 육상 기지화되기 위해 대만(FORMOSA)으로 보내졌다고 들었습니다. 그것은 어떤 정보에 근거한 것이었습니까? 그 이유는 무엇이었습니까?\n\n**답.** 그 명령의 이유는, 조종사 다수가 충분한 훈련을 받지 못하여 항모에서 이함은 할 수 있어도 항상 항모로 무사히 돌아오지는 못했기 때문입니다. 그래서 그들에게 대만(FORMOSA)의 기지 항공 병력에 합류하도록 명령하기로 결정한 것입니다.\n\n**문.** 구리타(KURITA) 제독의 임무는 무엇이었습니까? 미국 기동부대의 격멸이었습니까, 수송선단이었습니까, 아니면 상륙 거점 공격이었습니까? 구체적으로 어떤 임무였습니까? 또 그가 그곳에서 감수할 수 있는 손실에 관하여 귀관이 명시적으로든 묵시적으로든 그에게 부과한 제한이 있었습니까? 그는 작전에서 어디까지 갈 수 있었습니까?\n\n**답.** 구리타(KURITA) 제독의 임무는 레이테만(LEYTE Bay)에 있는 수송선단의 완전한 격멸이었습니다. 명령에는 그가 입을 수 있는 손해에 관한 제한이 없었습니다. 사정은 이러했습니다 — 24일 오후 제2함대가 귀측 항공 병력으로부터 상당한 손해를 입어, 해협 안에서 되돌아서기 시작했습니다. 그래서 저는 연합함대로부터 대략 이런 문언의 명령을 보냈습니다. 「천우(天佑)를 믿고 돌진하라(Advance counting on Divine Assistance).」 그 명령의 뜻은, 명령의 문언에는 나타나 있지 않습니다만, 되돌아선다고 해서 손해가 제한되거나 줄어들 수는 없으니 함대가 완전히 상실되더라도 전진하라는 것이었습니다. 그 명령을 보낼 때 제 심정이 그러했습니다. 따라서 제2함대는 감수할 손해에 관하여 어떤 식으로도 제한받지 않았다고 말씀드려도 무방합니다.\n\n그 명령을 보낼 때 제가 그런 결심을 한 이유는, 만일 우리가 필리핀(PHILIPPINES) 작전에서 진다면 함대가 남는다 하더라도 남방으로 가는 항로가 완전히 끊겨, 그 함대가 일본 해역으로 돌아온다 해도 연료 보급을 받을 수 없으리라는 사실 때문이었습니다. 남방 해역에 그대로 있는다면 탄약과 병기의 보급을 받을 수 없을 것입니다. 필리핀을 잃으면서 함대를 살린다는 것은 아무 의미가 없습니다. 그것이 그 명령을 내린 제 이유였습니다.\n\n**문.** 그러면 구리타(KURITA) 제독은 왜 되돌아섰습니까? 만(灣) 안으로 들어가지 않고 되돌아선 데 대하여 그는 귀관에게 올린 보고에서 어떤 이유를 댔습니까?\n\n**답.** 당시 연합함대 사령부는 일본에 있었고, 이 작전에서도 다른 작전에서와 마찬가지로, 연합함대 사령부는 일정한 작전 계획에 관하여 일반적 목표를 지시하되 세부 사항의 문제는 현지 지휘관에게 맡깁니다. 구리타(KURITA) 제독은 그 지점에서 만 안으로 전진하는 것이 기대한 성과를 낳지 못하리라고 판단했음이 틀림없고, 그리하여 철수하기로 결정한 것입니다.\n\n**문.** 지금 알려진 대로의 정황 아래에서, 귀관의 의견으로 되돌아선 구리타(KURITA)의 그 결정은 옳은 것이었습니까?\n\n**답.** 지금 돌이켜 보면 그 철수는 잘못이 아니었다고 생각합니다. 당시 저에게도, 연합함대 사령부에도 그 교전의 세부에 관한 정보가 없었습니다. 나중에 핼시(HALSEY) 제독의 기동부대가 우리가 생각했던 것보다 더 남쪽에 있었음을 알게 되고 보니, 구리타(KURITA) 제독은 그때 귀측 기동부대의 항공 공격 권내에 들어 있었으리라고 봅니다. 그러므로 그가 그 시점에 되돌아선 것은 현명치 못한 일이 아니었습니다.\n\n**문.** 되돌아선 그의 행동을 지금 비판하지는 않으시겠습니까?\n\n**답.** 비판하지 않겠습니다.", "secondary": "Q. But if the attacks did come to the MARIANAS, it was intended to employ the fleet\nfrom the beginning?\nA. Yes, it was intended from the first that if your attack should be directed toward\nMARIANAS we would have to use the fleet.\n\nQ. Now, in coordination of the effort of the fleet and of the shore-based air, both of which\nstemmed up to you, what means did you have for quickly coordinating the operations of the\ntwo forces at SAIPAN?\nA. Cooperation between the land-based air forces and the fleet was extremely difficult.\nBecause of the difficulty of communication, for the two commanders to meet on land was\npractically out of the question. Staff officers were sometimes dispatched to joint meetings\nand in some cases staff officers were sent from naval General Staff Headquarters to the\nheadquarters of the land-based air forces; but generally speaking, failure to maintain\nclose communication throughout was one of the main difficulties in the way of adequate\ncooperation between the two forces. Our communication method had not been developed to the stage\nwhere, for instance, surface units could intercept or receive messages from land-based aircraft.\nOne reason for the difficulty in communications was the low efficiency of communications equipment.\n\nQ. Now, in connection with the SHO-GO Operations in the defense of the PHILIPPINES,\nwhen did you estimate that our attack there would arrive, and did we arrive in advance of\nyour estimate and with what consequences?\nA. I expected that your attack against the PHILIPPINES would commence around August or September,\nand my expectations in that respect were correct; that is just about when the operations\ndid begin. In regard to the A-GO Operation, we expected the attack May; but the actual attack\ncame about a month later, in June. I stated that I expected your offensive against the\nPHILIPPINES would commence around August or September; that is not to say that we were prepared\nat the time to meet that offensive, for the reason that our forces, both Army and Navy,\nhad lost practically all their supporting aircraft at the various operations and it took\nanywhere from four to five months to replenish the lost aircraft. Since the SAIPAN Operation\nhad taken place in June and July, we were not prepared to start the SHO-GO Operation before\nOctober or November; but I felt that you would not wait that long, instead that you would commence\nyour operation against the Philippines around August or September.\n--316--\n\nQ. In the SHO-GO Operations again, what losses were you willing to take in the fleet against\nwhat gains> In other words, what were you prepared to trade there--losses and gains?\nA. As already stated, our Task Force and our air squadron were not ready for operation at the\ntime that your campaign began. We felt that to take the Task Force into LEYTE was to take\na big gamble; and while it would not be accurate to say that we were influenced by public opinion,\nquestions were beginning to be asked at home as to what the Navy was doing after loss of one\npoint after another down south, such as MARIANAS and BIAK. So, after having consulted\nheadquarters in TOKYO and having obtained their consent, it was decided to take this gamble\nand to send the whole fleet into the PHILIPPINE Operations. A part of the fleet at the time\nwas in home waters. That was rushed south in a hurry to take part in this operation with\nthe rest of the fleet, and it was our plant that part of the fleet should be used in an endeavor\nto draw your Task Force up north; but since without the participation of our Combined Fleet\nthere was no possibility of the land-based forces in the PHILIPPINES having any chance against\nyour forces at all, it was decided to send the whole fleet, taking the gamble.\nif things went well, we might obtain unexpectedly good results; but if the worst should happen,\nthere was a chance that we would lose the entire fleet. But I felt that that chance had to\nbe taken.\n\nQ. Was the use of the northern force, which you mentioned as a decoy, planned from the beginning\nor was it a decision of the moment depending upon conditions present?\nA. No, that was not a part of the basic plan originally laid down, but it was adopted when the\nnews came that landings had begun in LEYTE. It was not a part of the original SHO-GO\nOperation Plan.\n\nQ. About the middle of October, we were told that certain numbers of aircraft from Carrier\nDivisions 3 and 4 were sent to FORMOSA to be land-based. What information was that based on?\nWhat was the reason for that?\nA. The reason for that order was that many of the pilots had not received sufficient training\nand therefore, while they could take off from carriers, were not able to successfully always\nget back to the carrier. THerefore, it was decided to order them to join the land-based force\nat FORMOSA.\n\nQ. What was Admiral KURITA's mission? Was it to destroy the American Task Force, or the transports,\nor attack the beachhead? What specific mission; and, also, were there any restrictions placed\non him by you, whether specific or implied, as to what losses he could take there?\nHow far could he go in the operation?\nA. Admiral KURITA's mission was complete destruction of the transports in LEYTE Bay.\nIn the orders there was no restriction as to damage that he might take. The situation was\nthat, on the afternoon of the 24th, the Second Fleet suffered considerable damage from your air force,\nso they started to turn back while in the Strait. Thereupon I sent an order from the\nCombined Fleet worded something like this: \"Advance counting on Divine Assistance.\" The meaning\nof that order was, while to does not appear in the wording of the orders, that damage could not\nbe limited or reduced by turning back, so advance even thought the fleet should be completely\nlost. That was my feeling when sending that order; consequently I am safe in saying that the\nSecond Fleet was not restricted in any way as to the damage it might suffer.\nThe reason for my determination when sending that order was the fact that should we lose\nin the PHILIPPINES operations, even though the fleet should be left, the shipping lane to the\nsouth would be completely cut off so that the fleet, if it should come back to Japanese waters,\ncould not obtain its fuel supply. If it should remain in southern waters, it could not receive\nsupplies of ammunition and arms. There would be no sense in saving the fleet at the expense\nof the loss of the PHILIPPINES. That was my reason for that order.\n\nQ. Then why did Admiral KURITA turn back? What reason did he give in his report to you\nfor turning back and not having gone into the Gulf?\nA. The Headquarters of the Combined Fleet at the time was located in JAPAN, and in this operation,\nas in other operations, while the Headquarters of Combined Fleet indicates the general aim\nin respect to certain operation plans, questions of detail are left to the local commanding\nofficers. It must have been that Admiral KURITA decided that to advance into the Gulf\nfrom that point would not be productive of the results anticipated; consequently,\nhe decided to withdraw.\n\nQ. Under the circumstances as they are now known, in your opinion what that decision of\nKURITA to turn back a correct one?\nA. Looking back on it now, I think that withdrawal was not a mistake. At the time I did not\nhave and Combined Fleet Headquarters did not have information regarding the details of\nthe engagement. Later, when we learned that Admiral HALSEY's Task Force was further south than\nwe thought it was, I believe that Admiral KURITA then would have been within the range of\nair attack from your Task Force, so that it was not unwise for him to have turned back\nat that time.\n\nQ. You would not criticize his action now in turning back?\nA. I would not criticize.", "note": "원문에 타자 오식이 여럿 있으나 고치지 않았다 — 36행 'against what gains>'(물음표 대신 '>'), 45행 'it was our plant that'(plan의 오식), 64행 'THerefore', 76행 'while to does not appear'(it의 오식), 49행 'if things went well'(문두 소문자). 원문 71행 'LEYTE Bay'는 통상 'LEYTE Gulf(레이테만)'로 불리는 곳이며 원표기를 그대로 두었다. 「Advance counting on Divine Assistance」는 일본 측 원전문 「天佑ヲ確信シ全軍突撃セヨ」에 해당하나, 여기서는 USSBS 영역을 그대로 옮겼다.", "warn": false, "search": "The SHO-GO gamble at LEYTE: KURITA's mission, the order \"Advance counting on Divine Assistance\", and the turn-back 豊田副武 도요다 소에무 (TOYODA Soemu) — 대장, 심문 대상 栗田健男 구리타 다케오 (KURITA) — 중장, 제2함대 사령장관 William F. Halsey 핼시 — 미 해군 대장, 제3함대 사령관"}, {"id": "toyoda-4", "order": 4, "date": "1945-11-13", "group": "A", "eyebrow": "도요다 소에무 심문조서 · USSBS Nav-75", "title": "레이테 실패의 원인과 특별공격대의 발생 — 「근대전의 성격을 위에서부터 잘못 보았다」", "list_right": "문답", "meta": [{"k": "다루는 시점", "v": "1945-11-13"}, {"k": "문서 일자", "v": "1945-11-13"}, {"k": "성격", "v": "문답", "txt": true}, {"k": "원제", "v": "Why LEYTE failed, the birth of the Special Attack Corps, and the miscalculation of modern war", "txt": true}], "summary": "도요다는 레이테 작전 실패의 원인을 항공 열세와 오자와 부대 조종사의 훈련 부족으로 돌리고, 제2함대의 레이테만 돌입 결정이 특별공격대(가미카제)를 발생시킨 뜻밖의 결과였다고 증언하며, 개전 시 선복 600만 톤·연 100만 톤 건조 계획을 근대전의 성격을 잘못 본 「위에서부터의 착오」라고 말한다.", "points": ["레이테 작전 실패의 일차 원인은 항공 열세이며, 오자와(OZAWA) 휘하 조종사들의 훈련 부족도 사실상 같은 원인의 일부라고 답한다.", "제2함대를 레이테만(LEYTE Gulf)에 투입하기로 한 결정의 뜻밖의 결과가 이른바 특별공격대(Special Attack Air Corps)의 출현이었다.", "특별공격대는 그 자리에서 즉흥적으로 조직된 것이 아니라, 참모 장교뿐 아니라 조종사들 사이에서도 이미 논의되어 왔으며, 조종사 대다수의 훈련 부족을 감안할 때 특공만이 성공할 가망이 있는 방법이라는 인식에서 검토되고 있었다.", "제2함대가 레이테만으로 들어간다는 소식이 기지 항공 병력에 전해지자, 제1·제2항공함대를 각각 지휘하던 오니시(ONISHI)와 후쿠도메(FUKUDOME)가 「수상 부대가 그런 결사적 수단을 쓴다면 우리도 그에 준하는 결사적 수단을 써야 한다」고 결정하여 첫 특별공격을 개시했다. 당시 제1·제2항공함대는 필리핀에 있었다.", "특공이 아닌 함대 작전 전체의 실패 원인 — 준비가 완전히 갖추어지기 전에 교전에 끌려 들어간 것, 함대 자체의 훈련 부족, 그리고 앞서 지적한 항공 열세.", "해군 특별공격대의 주된 목표는 미국 항공모함이었고, 육군 특별공격대의 주된 목표는 가까이 있을 때는 기동부대였으나 그보다는 상륙 지점과 수송선이었다.", "전쟁 초기 미 해군 가운데 가장 큰 위협으로 여긴 것은 잠수함이었다고 답한다.", "적극적 공세 작전에 항공모함은 불가결하며, 상륙 작전에서는 기지 항공 병력만으로는 부족하고 수상 기동부대의 협력이 있어야 한다고 평가한다 — 특히 기지 항공 권외에서 상륙이 이루어질 때 그러하다.", "미 수상 기동부대에 심각한 타격을 주면 상륙 시도 간의 간격이 벌어지고 일본으로 다가오는 징검다리 사이의 거리가 짧아지리라고 보았다.", "방어선을 안정시켜 지키지 못한 근본 원인은 병참이 아니라 「근대전의 성격에 관한 위에서부터의 착오」라고 답한다 — 유럽에서 시작된 제2차 세계대전, 특히 지중해(MEDITERRANEAN)에서의 영국과 독일의 싸움과 그 막대한 물자 소모를 조금만 더 연구했더라면 달라졌을 것이라고 말한다.", "개전 당시 선복은 600만 톤에 불과했고 개전 후 채택된 계획은 연 100만 톤 건조였는데, 실제로 필요한 양에 비하면 하잘것없는 수치였으며 다른 소모 물자·군비도 마찬가지로 규모가 너무 작았다고 말한다.", "일본이 실행한 계획이 국력을 넘어선 것이었느냐는 물음에, 세워 놓은 계획조차 실행하지 못했으나 애초의 계획 자체가 전쟁의 소요에 맞지 않았다고 답한다.", "해군이 전쟁을 어떻게 끝낼 작정이었는지는 그런 정보를 얻을 위치에 있지 않아 분명히 말할 수 없다고 하며, 다만 1945년 5월 군령부총장이 된 뒤로는 종전까지 어전회의(Imperial Conferences)에 참석했다고 확인한다."], "primary": "**문.** 작전 전체를 놓고 볼 때 — 니시무라(NISHIMURA) 제독 부대의 수리가오(SURIGAO) 통과, 구리타(KURITA) 제독 부대의 산베르나르디노(SAN BERNARDINO) 통과, 그리고 북방에서의 오자와(OZAWA) 제독의 운용 — 그 작전이 성공하지 못한 일차적 원인은 무엇이었다고 하시겠습니까?\n\n*--317--*\n\n**답.** 우리의 항공 열세입니다. 그리고 거기에 덧붙이고 싶은 것은, 사실 같은 답의 일부입니다만, 작전 실패가 오자와(OZAWA) 제독 휘하의 조종사들이 충분히 훈련되어 있지 않았다는 사실에도 기인한다는 점입니다.\n\n제2함대를 레이테만(LEYTE Gulf)에 투입하기로 한 결정의 뜻밖의 결과 하나는 이른바 특별공격대(Special Attack Air Corps, 가미카제)의 출현이었습니다. 그렇다고 특별공격대가 그때 그 자리에서 즉흥적으로 조직되었다는 뜻은 아닙니다. 그 문제는 항공 부대 구성원들 사이에서, 참모 장교들뿐 아니라 조종사들 자신들 사이에서도 이야기되어 왔습니다. 그것이 검토되고 있었던 것은, 이 조종사들 대부분이 받은 훈련이 불충분하다는 점을 감안할 때 특별공격이라는 방법만이 성공할 가망이 있는 유일한 방법이라는 생각 때문이었습니다. 제2함대가 레이테만(LEYTE Gulf)으로 보내진다는 소식이 기지 항공 병력에 전해지자, 각각 제1항공함대와 제2항공함대를 지휘하고 있던 오니시(ONISHI)와 후쿠도메(FUKUDOME) 두 제독은, 수상 부대가 그와 같은 결사적 수단을 취한다면 우리도 그에 준하는 결사적 수단을 취해야 한다고 결정하고, 이른바 특별공격대의 첫 작전을 개시했습니다. 이것은 어떤 면에서는 제2함대의 레이테(LEYTE) 진입에서 나온 다소 뜻밖의 결과였습니다. 제1항공함대와 제2항공함대는 당시 필리핀(PHILIPPINES)에 주둔하고 있었습니다.\n\n**문.** 그 작전의 실패 또는 성공의 근본 이유는 무엇이었습니까? 특별공격이 아니라 함대 작전 전체를 말하는 것입니다.\n\n**답.** 우리가 완전히 준비되기 전에 교전에 끌려 들어갔다는 사실에, 함대 자체의 훈련 부족과 이미 지적한 항공 열세가 겹친 것입니다.\n\n**문.** 방금 그곳의 특별공격대의 실태를 말씀하셨는데, 그들의 목표는 무엇이었습니까? 무엇을 격파하는 것 — 함선입니까, 육상 지점입니까? 특별공격대에 의한 공격의 목적은 무엇이었습니까?\n\n**답.** 해군 특별공격대의 주된 목표는 귀측의 항공모함이었고, 육군 특별공격대의 주된 목표는 가까이 있을 경우에는 귀측의 기동부대였습니다만, 그보다는 상륙 지점과 수송선이었습니다.\n\n**문.** (와일즈 소령) 귀관은 대화 초반에, 일본(JAPAN)이 방어선을 채워 넣은 뒤 전쟁 초기에 동쪽으로부터 우리 해군이 이룬다고 여기신 위협을 언급하셨습니다. 그 위협을 항공모함, 수상 함대, 상륙 작전 가운데 어떻게 견주어 평가하시겠습니까?\n\n**답.** 전쟁 초기에는 미국(UNITED STATES) 해군 가운데 가장 큰 위협으로 여긴 것은 잠수함이었다고 생각합니다.\n\n**문.** 그러면 항모 부대와 수상 함대와 우리의 잠재적 상륙 능력이 각각 이룬 상대적 위협에 관한 귀관의 의견을 부연해 주시겠습니까?\n\n**답.** 적극적인 공세 작전에서 항공모함이 불가결하다는 데 동의합니다. 그리고 상륙 작전에서는 기지 항공 병력만으로는 수상 기동부대의 협력 없이 충분하지 않습니다. 그런 뜻에서 저는 수상 기동부대를 매우 높이 평가합니다. 특히 상륙이 기지 항공 부대의 행동 반경 밖에서 이루어질 경우에 그러합니다. 그래서 우리는 귀측의 수상 기동부대에 심각한 타격을 줄 수 있다면, 그것이 귀측의 상륙 시도들 사이의 간격을 벌리고, 또한 귀측이 일본(JAPAN)을 향해 전진하는 데 쓰는 징검돌 사이의 거리를 짧게 만들리라고 여겼습니다.\n\n**문.** 전쟁 첫 6개월 동안 거의 달성되었던 방어선을 일본(JAPAN)이 안정시켜 지키지 못한 것을 생각할 때, 어떤 요인들이 그 원인이었다고 하시겠습니까? 즉 필요한 전력을 쌓아 올릴 만한 규모의 기지가 없었던 것입니까, 아니면 그 기지들에 보급할 수 없었던 것입니까? 다시 말해 병참의 문제였습니까?\n\n**답.** 저는 근대전의 성격에 관하여 처음부터 위에서부터의 착오가 있었다고 생각합니다. 유럽(EUROPE)에서 시작된 제2차 세계대전, 특히 지중해(MEDITERRANEAN) 일대에서 영국(ENGLAND)과 독일(GERMANY) 사이에 벌어지고 있던 싸움, 그토록 많은 물자 소모를 뜻했던 그 싸움을 조금만 더 면밀히 연구했더라면, 그리고 근대전의 성격에 관한 보다 건전한 관념을 처음부터 염두에 두고 계획을 세웠더라면 사정이 달랐을지도 모릅니다. 우리에게는 개전 시 선복(ship bottom)이 600만 톤밖에 없었고, 일단 전쟁이 시작되자 채택된 계획은 연간 100만 톤을 건조한다는 것이었습니다. 그것은 실제로 필요한 양에 비하면 하잘것없는 수치였고, 다른 소모 물자와 군비 등에도 같은 말이 해당됩니다. 규모가 전적으로 너무 작았습니다.\n\n**문.** 그러면 일본(JAPAN)이 실행한 계획은 그 능력을 넘어선 것이었다고 하시겠습니까?\n\n**답.** 앞서 말씀드린 대로 세워 놓은 계획조차 실행할 수 없었습니다. 그러나 애초의 계획 자체가 전쟁의 소요에 맞지 않았다고 생각합니다.\n\n**문.** 일본 해군은 전쟁을 어떻게 끝낼 것으로 예상했습니까? 전쟁의 종결에 관한 해군의 구체적인 예상은 무엇이었습니까?\n\n**답.** 개전 시 해군이 무엇을 예상했는지에 관하여는 제가 분명한 진술을 하기 어렵습니다. 저는 그러한 정보를 얻을 수 있는 위치에 있지 않았기 때문입니다.\n\n**문.** 귀관은 전쟁 종결에 관한 어전회의(Imperial Conferences)에 참석한 일이 있습니까?\n\n**답.** 그렇습니다. 올해(1945년) 5월 군령부총장을 맡은 뒤로 종전 때까지 어전회의에 참석했습니다.\n\n*--318--*", "secondary": "Q. Considering the operation as a whole--the movement of Admiral NISHIMURA's force through\nSURIGAO and Admiral KURITA's through SAN BERNARDINO and the employment of Admiral OZAWA\nin the north--what would you say was the primary cause for the lack of success in that operation?\n--317--\nA. Our weakness in air, and to that I wish to add the failure of the operation was due also to,\nreally a part of the same answer, the fact that the pilots under Admiral OZAWA were not\nsufficiently trained.\nOne unexpected result of the decision to send the Second Fleet into LEYTE Gulf was the\nappearance of the so-called Special Attack Air Corps. That is not to say that the Special\nAttack Corps were organized then on the spur of the moment. The matter had been talked over\namong members of air units, not only among staff officers but even among pilots themselves.\nIt had been under consideration because of the feeling that the method of special attack\nwas the only one likely to prove successful in view of the insufficient training which\nmost of these pilots had received. When the news came to the land air forces that the Second\nFleet was being sent into LEYTE Gulf, Admirals ONISHI and FUKUDOME, in command respectively\nof the First and Second Air Fleets, decided that if the surface units are taking such\ndesperate measures we too must take similarly desperate measures, and started the first\noperation of the so-called Special Attack Force. This was in some ways a somewhat unexpected\nresult from the entry of the Second Fleet into LEYTE. The First and Second Air Fleets\nwere at the time stationed in the PHILIPPINES.\n\nQ. What were the basic reasons for the failure or success of that operation,\nnot the Special Attack, but the whole fleet operation?\nA. The fact that we were drawn into the engagement before we were fully prepared, combined\nwith insufficient training of the fleet itself and air weakness as already pointed out.\n\nQ. You mentioned the status of the Special Attack Forces there; what was their objective,\nthe destruction of what--ships or shore points? What was the purpose of the attack by the\nSpecial Attack Corps?\nA. The principal objective of the Navy's Special Attack Units was your aircraft carriers,\nwhile the principal objectives of the Army Special Attack Units were your Task Forces when close\nby, but more your landing points and transports.\n\nQ. (Lt. Comdr. Wilds) You referred early in the conversation to the threat which you\nconsidered our Navy represented from the east early in the war, after JAPAN had filled in\nher perimeter. How would you evaluate that threat as between carriers, or surface fleet,\nor amphibious operations?\nA. Early in the war I think the submarines were the part of the UNITED STATES Navy which\nI considered the greatest threat.\n\nQ. Will you, then, elaborate as to the relative threat in your opinion that the carrier force\nand the surface fleet and our potential amphibious capabilities represented?\nA. In positive offensive operations, I agree that aircraft carriers are indispensable, and\nin landing operations, even land-based air force is not sufficient without the cooperation\nof the surface Task Force units; so in that sense, I evaluate surface Task Forces very highly,\nespecially where the landing is to be made beyond the range of land-based air units.\nSo we felt that if we could deal a serious blow to your surface Task Force, that would widen\nthe gap between your landing attempts and also shorten the distance between the stepping stones\nby which you made the advance toward JAPAN.\n\nQ. In considering JAPAN's inability to stabilize and hold the perimeter which had been\nalmost achieved in the first six months of the war, what factors would you say were accountable?\nThat is, was it a lack of bases of sufficient size to build up necessary strength or was it\ninability to supply the bases? Was it a logistics problem, in other words?\nA. I think there was a mistake at the top from the very beginning as to the nature of\nmodern warfare. It a little closer study had been made of the Second World War as it started\nin EUROPE, especially in the fighting going on between ENGLAND and GERMANY around the MEDITERRANEAN,\nthe fighting that meant so much consumption of material, and if we had laid our plans from\nthe beginning with some sounder ideas as to the nature of modern war in mind, it might have\nbeen different. We had at the beginning only 6,000,000 tons of ship bottom, and once the war\nstarted, the plan adopted wax to build a million tons annually. That was a puny figure as\ncompared to the amount actually needed, and the same applied as to the other consumption\nmaterials, armaments, etc.; entirely too small a scale.\n\nQ. Would you say then that the plan executed by JAPAN was in excess of her capability?\nA. As already stated, even the plans that were laid could not be carried out; but the plans\nto begin with, I think were not accordance with the need of the war.\n\nQ. How did the Japanese Navy expect to end the war? What were its specific expectations\nconcerning the end of the war?\nA. I can hardly make a clear statement as to what the Navy expected at the beginning of the war,\nas I was not in a position where I could acquire such information.\n\nQ. Did you participate in any Imperial Conferences concerning the termination of the war?\nA. Yes, after May of this year when I took over as head of the Naval General Staff,\nI attended Imperial meetings to the end of the war.\n--318--", "note": "원문 타자 오식을 고치지 않았다 — 56행 'It a little closer study'(If의 오식), 61행 'the plan adopted wax to build'(was의 오식), 67행 'were not accordance'(not in accordance). 니시무라·오니시·후쿠도메의 이름(祥治·瀧治郎·繁)은 원문에 성만 있어 역자가 병기를 보충했다. 'Special Attack Air Corps'는 「특별공격대(가미카제)」로, 'Special Attack Units'는 「특별공격대」로 옮기고 미화·비하하는 어휘를 더하지 않았다. 'ship bottom'은 선복(船腹), 즉 총 선박 톤수로 옮겼다.", "warn": false, "search": "Why LEYTE failed, the birth of the Special Attack Corps, and the miscalculation of modern war 豊田副武 도요다 소에무 (TOYODA Soemu) — 대장, 심문 대상 小澤治三郎 오자와 지사부로 (OZAWA) — 중장, 북방(기동) 부대 지휘 西村祥治 니시무라 쇼지 (NISHIMURA) — 중장, 수리가오 해협 돌입 부대 지휘 栗田健男 구리타 다케오 (KURITA) — 중장, 산베르나르디노 해협 통과 부대 지휘 大西瀧治郎 오니시 다키지로 (ONISHI) — 중장, 제1항공함대 사령장관 福留繁 후쿠도메 시게루 (FUKUDOME) — 중장, 제2항공함대 사령장관 W. Wilds 와일즈 — 미 해군예비역 소령, 심문자"}, {"id": "toyoda-5", "order": 5, "date": "1945-11-13", "group": "A", "eyebrow": "도요다 소에무 심문조서 · USSBS Nav-75", "title": "최고전쟁지도회의와 소련 중개 시도 — 6월 어전회의에서 8월 8일 국교 단절까지", "list_right": "문답", "meta": [{"k": "다루는 시점", "v": "1945-11-13"}, {"k": "문서 일자", "v": "1945-11-13"}, {"k": "성격", "v": "문답", "txt": true}, {"k": "원제", "v": "Meetings of the Supreme War Guidance Council and the Attempt at Soviet Mediation", "txt": true}], "summary": "도요다가 1945년 6월부터 8월까지 최고전쟁지도회의의 회합 경과와, 외무성이 주도한 소련 중개 공작이 어떻게 완전한 실패로 끝났는지를 날짜별로 진술한 대목이다.", "points": ["최고전쟁지도회의 6인 구성원(총리·육군대신·해군대신·외상·군령부총장·참모총장) 가운데 소련 중개 논의를 확실히 알던 해군 측 인사는 해군대신과 군령부총장 두 사람뿐이었다고 진술.", "6월 6일 회합의 결론은 화평이 아니라 「무언가 급격한 수단으로 국민을 분기시키지 않으면 국력이 급속히 떨어진다」는 것 — 즉 전쟁 계속 결정이었다.", "6월 8일 천황 임석 회의는 6일 회의 보고만 있었고 천황의 발언이나 질문은 없었다.", "6월 26일 천황이 6인을 불러 「전쟁을 마무리할 가능성」을 고려하라고 말했고, 총리·외상·해군대신이 전적으로 동의한다고 답했다.", "7월 10일 천황이 외상을 불러 특사 파견을 재촉했고, 사토 대사가 7월 13일경 소련 외무인민위원 대리에게 접촉했으나 스탈린·몰로토프의 포츠담 출발을 이유로 회답이 미뤄졌다.", "8월 8일 모스크바에서 온 실제 회답은 대일 국교 단절이었고, 소련 중개에 의한 종전 노력은 완전한 실패(a flat failure)로 끝났다.", "화평 조건은 논의하지 않았다 — 「소련의 의견을 존중해야 할 문제」로 보았고, 어떤 결과든 전전(戰前)보다 나쁠 것은 각오하고 있었다.", "도요다는 원폭 사용과 소련 참전을 종전의 직접 원인으로 보는 것은 정확하지 않으며, 다만 그 두 요인이 일본 국내에 큰 혼란을 일으키지 않고 전쟁을 끝낼 수 있게 해 주었다고 진술.", "부하들의 사기를 이유로 화평 논의를 막았다 — 부총장에게 「장교가 관여할 일이 아니다」라고 말했다고 진술."], "primary": "**문.** 그 회합들을 하나하나 들어 주시고, 그 자리에서 오간 논의와 도달한 결정을 요약해 주시겠습니까?\n\n**답.** 나는 새 직위를 맡아 5월 19일에 도쿄(TOKYO)에 도착했습니다. 그 전부터, 아마 5월에 들어서면서부터라고 생각합니다만, 최고전쟁지도회의(Supreme War Guidance Council) 구성원들이 전쟁을 끝낼 방법과 수단을 논의하고 있었습니다. 이른바 최고전쟁지도회의는 여섯 사람으로 구성됩니다. 총리대신, 육군대신, 해군대신, 외무대신, 군령부총장(Chief of the Naval General Staff), 참모총장(Chief of the Army General Staff)입니다. 이 모임의 회합은 다음과 같이 열렸습니다.\n\n6월 6일, 여섯 구성원이 — 여섯 구성원 외에도 여러 사람이 배석했는데, 내각서기관장, 해군성 군무국장, 육군성 군무국장, 농림대신, 내각조사국장 등이 있었습니다 — 이 전쟁의 수행과 관련하여 어떤 조치를 취해야 하는지를 논의했습니다. 그 회의의 결론은, 국민을 분기시킬 어떤 급격한 방책을 채택하지 못하는 한 국가의 전쟁 수행력은 매우 급속히 쇠퇴할 수밖에 없다는 것이었습니다. 그렇다고 해서 그 자리에서 누군가가 화평을 청해야 한다는 의견을 냈다는 뜻은 아닙니다. 그처럼 많은 사람이 함께 있는 자리에서는 어느 한 사람이 그렇게 간청해야 한다고 말하기가 어렵습니다. 그래서 결정은 이 전쟁을 계속하기 위해 무언가를 해야 한다는 것이었습니다.\n\n이틀 뒤인 6월 8일, 거의 같은 구성원들이 또 한 번 회합을 가졌는데, 이번에는 천황이 임석한 자리였습니다. 논의는 없었고 6일의 앞선 회의에서 있었던 일을 보고했을 뿐입니다. 최고전쟁지도회의의 이러한 공식 회합과는 별도로, 그 회의를 구성하는 같은 여섯 사람이 적당한 시기에 소비에트 러시아(Soviet RUSSIA)의 주선을 얻을 목적으로 회합을 갖고 있었습니다. 외무대신이 이 일에서 주도적 역할을 하고 있었고, 그 문제는 이미 도쿄 주재 말리크(MELIK) 대사에게 제시되어 있었습니다. 동시에 모스크바(MOSCOW)의 사토(SATO) 대사도 외무대신으로부터, 도쿄에서 모스크바로 그 목적의 특사를 파견하기 위한 사전 정지 작업을 하라는 훈령을 받고 있었습니다. 그러나 도쿄에서든 모스크바에서든 이 교섭은 만족스러운 진전을 보지 못했고, 교섭을 시작한 뒤 20일 남짓 지났으나 이루어진 것은 없었습니다.\n\n6월 26일, 천황이 최고전쟁지도회의의 이 여섯 사람을 앞으로 불러, 물론 이 전쟁을 계속 밀고 나가는 것이 필요하기는 하나 국내 사정에 비추어 동시에 전쟁을 마무리 지을 가능성도 고려할 필요가 있다고 말씀하셨습니다. 회의 구성원들은 그 생각을 어떻게 보는가 하는 것이었습니다. 천황께 대한 답으로 총리대신, 외무대신, 해군대신은 천황의 뜻(the Imperial view)에 전적으로 동의하며 그 방향으로 이미 조치를 취하고 있다고 말씀드렸습니다. 그러자 천황이 다시, 대신들은 언제쯤 모스크바로 특사를 보낼 수 있으리라 보는가 하고 물으셨습니다. 날짜는 확실치 않으나 포츠담(POTSDAM) 회담이 열리기 전에 보내기를 바란다는 답을 드렸습니다.\n\n7월 10일, 천황이 갑자기 우리 외무대신을 불러 「이제 7월 초인데, 우리 특사를 지체 없이 모스크바로 보내야 하지 않겠는가?」라고 말씀하셨습니다. 사정인즉 도쿄 주재 러시아 대사가 병중이라고 하여 외무성이 이곳 러시아 대사관과 연락을 유지하는 데 어려움을 겪고 있었으므로, 모스크바의 우리 대사에게 훈령을 보내 특사를 그리로 보내겠다는 우리 제안을 러시아 정부에 제출하도록 하기로 정했습니다. 모스크바의 사토 대사가 외무인민위원 대리(Vice Commissar of Foreign Affairs)에게 이 제안을 가지고 접근했고, 「무슨 목적으로 대사를 보내는가 — 화평을 성립시키기 위해 우리에게 중개해 달라는 것인가?」라는 질문을 받자 우리 대사는 그렇다고 답했습니다. 이 대화가 모스크바에서 오간 것이 7월 13일경이며, 돌아온 답은 스탈린(STALIN)과 몰로토프(MOLOTOV)가 둘 다 곧 포츠담으로 떠나므로 모스크바에 돌아온 뒤에 회답하겠다는 약속이었습니다.\n\n우리 정부가 8월 8일 모스크바로부터 실제로 받은 회답은 일본과의 국교 단절이었습니다. 그것이 회답이었습니다. 이리하여 러시아의 중개로 전쟁을 끝내려던 우리의 노력은 완전한 실패(a flat failure)로 끝났습니다. 해군 전체에서 러시아의 중개에 관한 논의를 알고 있던 사람은 단 두 사람, 곧 해군대신과 군령부총장뿐이었습니다. 회의가 자주 열리고 있었으므로 해군성의 다른 고위 인사들 가운데 얼마간 눈치챈 이가 있었을지도 모릅니다. 나 자신도 그럴 수 있겠다고 느꼈기 때문에, 군령부차장(Deputy Chief of Naval General Staff)에게 전쟁의 종결에 관한 대화가 진행되고는 있으나 그것은 장교들이 관여할 일이 아니라고 말했습니다. 그들은 오로지 전쟁의 수행에만 관심을 두어야 하며, 화평의 문제를 생각하는 것은 사기를 떨어뜨리는 결과밖에 되지 않기 때문입니다. 육군성에서도 사정은 비슷했으리라, 곧 두 사람만이 이 논의를 확실히 알고 있었으리라 생각합니다.\n\n**문.** 러시아를 통해 화평을 모색하는 데 기초로 삼으려 했던 주요 요점들을 개략해 주시겠습니까? 조건은 어떠해야 한다고 보았습니까?\n\n**답.** 조건이 어떠해야 하는가는 외무성 관리들의 머릿속에는 있었을지 모르나 우리 사이에서는 논의에 오르지 않았습니다. 주된 이유는 그것이 러시아의 의견을 존중해야 할 문제라고 우리가 생각했기 때문입니다. 구체적인 조건에 관해 말하자면, 물론 우리는 결과가 어떻게 되든 전전(戰前)의 상태보다는 나쁘리라는 각오는 하고 있었습니다.\n\n--319--\n\n**문.** 그렇다면 결국 해군은 어떤 조건이든 화평에 찬성했다는 것입니까?\n\n**답.** 화평 논의가 오가던 당시에는 물론 우리는 포츠담 선언(POTSDAM Declaration)을 아직 듣지 못한 상태였습니다. 아직 나오지 않았습니다. 그러나 우리는 전쟁이 끝날 경우의 실제 사정이 그 선언의 조항만큼 그렇게 가혹하리라고는 생각하지 않았고, 카이로(CAIRO) 선언에 대해서도 마찬가지였습니다. 우리는 그것을 하나의 선언으로 보았지, 그 조항이 실제로 우리에게 적용될 것으로는 보지 않았습니다. 그 조건을 완화할 가능성에 관해서라면, 만일 당신들이 전쟁을 계속 밀고 나간다면 혼슈(HONSHU)에서 상륙 작전이 시작될 때 우리는 당신들에게 큰 희생을 요구하겠다는 것이었습니다.\n\n**문.** 전쟁이 진행되는 동안 어느 시점이라면 해군이 전쟁을 끝내는 조서(Imperial Rescript)를 받아들였겠습니까?\n\n**답.** 그것은 매우 답하기 어렵습니다. 실제로 종전의 조서가 내려진 15일에조차 「당장 나가려고 벼르던(raring to go)」 제일선 부대를 억누르기가 어려웠고, 그들을 붙들어 두기가 매우 힘들었기 때문입니다. 원자폭탄(Atomic Bomb)의 사용과 소비에트 러시아의 참전·개입을 전쟁 종결의 직접적 원인으로 보는 것은 정확하지 않다고 생각합니다만, 그 두 요인이 일본에 너무 큰 혼란을 일으키지 않고 전쟁을 종결로 이끌 수 있게 해 주었다고는 생각합니다.\n\n**문.** 아마 내 질문이 온전히 이해되지 않은 듯합니다. 나는 그것을 천황의 뜻에 대한 해군의 충성 문제로 물은 것이 아니라, 전쟁의 경과에 대한 냉정한 평가에 근거한 판단을 얻고자 한 것입니다. 전쟁이 진행되는 어느 시점이라면 해군이 전쟁을 멈추는 조서의 발포에 동의하고 그것을 뒷받침했겠습니까?\n\n**답.** 소비에트 러시아의 개입을 별개로 하고, 전쟁이 실제로 끝나기 전 어느 시점에라도 천황이 전쟁을 끝내는 조서를 내리셨다면 해군이 그것이 잘못이 아니라고 말할 용의가 있었겠는지, 나로서는 말하기 어렵습니다. 아직 어떤 가망이 남아 있다고 느끼는 한, 그만둘 때가 이미 왔다고 말하기란 매우 어렵기 때문입니다.\n\n**문.** 제독께서는 6월 8일 최고전쟁지도회의와 함께한 어전회의(Imperial Conference)를 언급하셨습니다. 그때 당신이 올린 보고에 대해 천황의 논평이나 반응은 어떠했습니까?\n\n**답.** 내가 기억하는 한 천황으로부터는 논평도 질문도 없었습니다.", "secondary": "Q. Will you please enumerate those meetings and summarize the discussions and decisions reached?\nA. I arrived in TOKYO in my new position May 19. Prior to that, I believe beginning in May,\nmembers of the Supreme War Guidance Council had been discussing ways and means whereby the\nwar might be terminated. This so-called Supreme War Guidance Council is composed of six members:\nThe Prime Minister, War Minister, Navy Minister, Foreign Minister, Chief of the Naval General\nStaff, and Chief of the Army General Staff. The meetings of this group were held on:\n6 JUNE, the six members--in addition to the six members, there were numerous others present,\nincluding Chief Secretary of the Cabinet, Chief of the Naval Bureau of Military Affairs,\nalso of the Army Bureau of Military Affairs, the Minister of Agriculture and Forestry and\nChief of the Cabinet Research Bureau--discussed what steps should be taken relative to\nthe prosecution of this war. The conclusion of that meeting was that unless some radical\nmeasure could be adopted to arouse the people, the nation's war power was bound to decline\nvery rapidly. That is not to say that anyone there expressed the opinion that we should ask\nfor peace; for when a large number of people are present like that, it is difficult for any\none member to say that we should so entreat. So the decision was that something must be\ndone to continue this war.\nTwo days later on 8 JUNE, practically the same members held another meeting, this time in the\npresence of the Emperor. There was no discussion but merely a report of what had taken place\nat the prior meeting on the 6th. Independent of these official meetings of the Supreme War\nGuidance Council, the same six members which constituted the Council were holding meetings\nwith the view to obtaining the services of Soviet RUSSIA at an opportune time. The Foreign Minister\nwas taking a leading part in this and the matter had already been presented to Ambassador\nMELIK in TOKYO; and at the same time our Ambassador SATO in MOSCOW had been instructed\nby the Foreign Minister to prepare the ground there for the dispatch of the special ambassador\nfor the purpose from TOKYO to MOSCOW. However, these negotiations, both in TOKYO and in\nMOSCOW, made no satisfactory headway, and some 20 days passed after the commencement of\nthe negotiations, but nothing was accomplished.\nOn 26 JUNE, The Emperor called these six members of the Supreme War Guidance Council into\nhis presence and stated that, while it was of course necessary to keep on pushing this war,\nit was necessary at the same time, in view of the domestic situation, to consider the possibility\nof bringing the war to a conclusion. What did the members of the Council think of that idea?\nIn reply to the Emperor, the Prime Minister, the Foreign Minister and the Navy Minister\nstated that they concurred fully with the Imperial view and that such steps were now being taken\nto that end. Then the Emperor in turn asked when the Ministers expected to be able to send\na special Ambassador to MOSCOW. The reply given was that the date was not certain but hoped that\nhe would be sent before the POTSDAM Conference should be held.\nOn JULY 10, the Emperor suddenly called our Foreign Minister and stated, \"As it is now early July,\nshould not our special ambassador be dispatched to MOSCOW without delay?\" The situation was\nthat the Russian Ambassador to TOKYO was reported ill and the Foreign Office was having difficulty\nin maintaining contact with the Russian embassy here, so it was decided to send instructions\nto our Ambassador in MOSCOW to propose to submit to the Russian Government our proposal\nto send a special ambassador there. Our Ambassador SATO in MOSCOW approached the Vice Commissar\nof Foreign Affairs with this proposal, and when asked, \"For what purpose are you sending\nthe Ambassador--to ask us to intervene with a view to bringing about peace?\", our Ambassador\nreplied that such was the case. That was about the 13th of July that this conversation took\nplace in MOSCOW, and the answer given was that since STALIN and MOLOTOV were both about to\ndepart for POTSDAM, they promised to give an answer upon their return to MOSCOW.\nThe actual answer that our Government did get from MOSCOW on 8 August was breaking of\ndiplomatic relations with JAPAN, that was the answer. Thus, our efforts to bring the war\nto an end with the intervention of RUSSIA ended in a flat failure. There were only two people\nin all of the Navy who had any knowledge of the discussions relating to intervention of RUSSIA;\nnamely, the Navy Minister and the Chief of the Naval General Staff. It may be that,\nsince frequent conferences were being held, some of the others high up in the Navy Department\nmight have had some suspicions; and because I, myself, felt that such might be the case,\nI stated to my Deputy Chief of Naval General Staff that, although conversations were being\ncarried out relative to the conclusion of the war, that was not an affair with which officers\nshould be concerned. Only with the prosecution of the war should they be concerned at all,\nfor, for them to consider questions of peace would serve only to reduce their morale; and I\nbelieve that a similar situation prevailed in the Army Department; namely, that only two officials\nhad definite knowledge of these discussions.\n\nQ. Will you outline the principal points which it was intended would be the basis for seeking\npeace through RUSSIA? What the terms should be?\nA. What the terms should be, while it might have been in the minds of officials in the Foreign\nOffice, did not come up for discussion among us, principally because we thought that it was\na matter in which opinions of RUSSIA should be respected. By way of concrete terms, we of course\nwere prepared that, whatever the result, it would be worse than pre-war conditions.\n--319--\n\nQ. In effect, then, the Navy was in favor of peace whatever the basis?\nA. At the time that peace discussion were taking place, of course we had not heard of the\nPOTSDAM Declaration; it had not\ncome out yet. We did not think, however, that the actual situation, if and when the war should end,\nshould be quite so stern as under the term of the declaration, and the same is true as regards\nthe CAIRO Declaration. We looked\nupon that as a declaration but not as one whose terms would be actually applied to us.\nBy way of possibility of reducing these terms, if you should continue pushing the war,\nwe would demand of you the heavy sacrifice when your landing operations should commence\nin HONSHU.\n\nQ. At what time during the course of the war would the Navy have accepted an Imperial Rescript\nterminating the war?\nA. That is very difficult to answer because even on the 15th when the Imperial Rescript to\nterminate the war was actually issued, even then we found it difficult to hold down the\nfront-line forces who were all \"raring to go\", and it was very difficult to hold them back.\nI do not think it would be accurate to look upon use of the Atomic Bomb and the entry\
