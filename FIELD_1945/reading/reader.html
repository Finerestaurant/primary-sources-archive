nand participation of Soviet RUSSIA into the war as direct cause of termination of the war,\nbut I think that those two factors did enable us to bring the war to a termination without\ncreating too great chaos in JAPAN.\n\nQ. Perhaps my question was not entirely understood by you. I did not mean to direct it to\nthe loyalty of the Navy to the Imperial will, but to get an estimate based on a cold appraisal\nof the course of the war. At what point in the progress of the war would the Navy have agreed\nto and would have backed the issuance of an Imperial Rescript to stop the war?\nA. It is difficult for me to say whether, apart from the intervention of Soviet RUSSIA,\nif at any time prior to the actual termination of the war the Emperor had issued a rescript\nterminating the wary, the Navy would have been willing to say that is not a mistake;\nbecause so long as one feels that there is any chance left, it is very difficult to say\nthat the time to quit had already come.\n\nQ. The Admiral referred to the Imperial Conference with the Supreme War Guidance Council\nof 8 June. What was the Emperor's comment or reaction to the information you gave him at that time?\nA. So far as I can recollect, there were neither comment nor questions from the Emperor.", "note": "원문 오식을 그대로 두었다 — 'the wary'(terminating the wary, 'the war'의 오식), 'peace discussion were'(주술 불일치), 'Ambassador MELIK'은 주일 소련 대사 야코프 말리크(Yakov Malik)를 가리킨다. 원문 본문 중간의 '--319--'는 원 간행물 쪽수 표시로 그대로 남겼다. 'Imperial view', 'Imperial Rescript'는 각각 「성려(聖慮)」가 아니라 원문 어법을 살려 「천황의 뜻」·「종전 조서(Imperial Rescript)」로 옮기되 궁정 어법을 평범한 말로 풀지 않았다. 'National Equality'는 뒷장(toyoda-7)에서 통역자가 '국체(國體)'를 옮긴 말로 언급된다.", "warn": false, "search": "Meetings of the Supreme War Guidance Council and the Attempt at Soviet Mediation 豊田副武 도요다 소에무 — 해군대장, 1945년 5월 군령부총장(피심문자) 鈴木貫太郎 스즈키 간타로 — 총리대신 東鄕茂德 도고 시게노리 — 외무대신 米内光政 요나이 미쓰마사 — 해군대신 佐藤尚武 사토 나오타케(SATO) — 주소련 대사 MELIK 말리크(야코프 말리크) — 주일 소련 대사 STALIN 스탈린 MOLOTOV 몰로토프 昭和天皇 쇼와 천황(the Emperor)"}, {"id": "toyoda-6", "order": 6, "date": "1945-11-14", "group": "A", "eyebrow": "도요다 소에무 심문조서 · USSBS Nav-75", "title": "국민에게 알리지 않은 전황 — 승리에 취한 국민, 해군의 정책 영향력, 육해군 통합론", "list_right": "문답", "meta": [{"k": "다루는 시점", "v": "1945-11-14"}, {"k": "문서 일자", "v": "1945-11-14"}, {"k": "성격", "v": "문답", "txt": true}, {"k": "원제", "v": "Public Morale, Naval Influence on National Policy, and Service Unification", "txt": true}], "summary": "도요다가 미드웨이 이후의 전황을 국민에게 숨긴 것이 패전의 정신적 요인이었다고 진술하고, 해군이 국정에 영향을 미친 경로와 육해군 통합 구상에 대한 견해를 밝힌 대목이다.", "points": ["도요다는 전쟁의 전환점이 미드웨이(MIDWAY) 해전이었다고 거듭 말하며, 그때 정부·양 군뿐 아니라 국민도 전환점이 왔음을 알았어야 했다고 진술.", "미드웨이는 국민에게 대승으로 알려졌고, 과달카날(GUADALCANAL) 철수는 「장엄한 작전과 전술」인 양 선전되었다.", "자원 부족의 전모는 국가 기밀로 덮여 있어 국민은 사태가 얼마나 나빠지는지 알 길이 없었고, 그래서 「일억일심(一億一心), 나라를 위해 죽을 각오」라는 표어를 실행할 마음가짐에 이르지 못했다고 진술.", "미국의 여성 노동 참여 증가 같은 정보를 일본 선전 기관은 미국의 자원·인력 고갈의 징후로 거꾸로 이용했다 — 양국의 선전 정책이 정반대였다는 지적.", "해군이 국책에 의견을 반영하는 정규 경로는 오직 해군대신이며, 전쟁 중에는 개별 장교가 정부에 영향을 미치려 한 예외가 있었음을 유감으로 진술.", "육군의 정치적 힘이 커서 원활한 협조를 얻으려면 해군이 육군의 주도를 따르는 수밖에 없었고, 그 점에서 시마다(SHIMADA) 해군대신의 처지에 깊이 동정한다고 진술.", "돌이켜 보면 육상기지 항공(land-based aviation)에 더 많은 자원을 돌렸어야 했고 전함을 지나치게 중시했다고 평가.", "육해공 통합 단일군에 대해 해군은 늘 반대였다 — 통합하면 수장이 육군 인사가 되고 해군부는 약체가 될 수밖에 없다고 보았다.", "해군 항공대는 수상 부대와의 협동을 위해 해군에 직속되어야 하며, 영국의 함대항공대(Fleet Air Arm)처럼 이름만 독립인 형태가 이상적이라고 진술."], "primary": "**문.** 어제 오후 대화 초반에 패전의 원인을 논하면서 국민의 정신적 측면, 곧 국민이 마땅히 들었어야 할 것을 듣지 못했다는 점을 말씀하셨습니다. 염두에 두신 바를 좀 더 구체적으로 풀어 주시겠습니까?\n\n**답.** 전쟁 초기로 거슬러 올라가 보면, 국민이 전쟁 후반에 대해 충분히 대비하지 못한 까닭 하나는 초기에 우리 작전이 극히 순조롭게 진행되었다는 사실에 있다고 생각합니다. 특히 하와이(HAWAII)와 여러 남방 지역이 그러했습니다. 공식 발표가 잇달아 나오며 승리에 승리를 거듭하니 국민이 이른바 「승리에 취한(victory-drunk)」 상태가 되었고, 전황이 우리에게 불리해진 뒤에도 국민이 그 상태에서 빠져나오기가 어려웠습니다. 어제 말씀드린 대로 나 개인적으로는 전쟁의 전환점이 미드웨이(MIDWAY) 해전이었다고 봅니다. 그때 정부와 두 군뿐 아니라 국민도 전환점이 왔음을 깨닫고 앞날에 대해 그에 맞게 마음을 정했어야 했다고 생각합니다. 그럼에도 일반 국민은 미드웨이 해전이 우리 측의 뛰어난 승리였다는 인상을 받았습니다. 게다가 과달카날(GUADALCANAL)에서의 철수는 일본군에게 명백한 불리를 뜻하는 것이었음에도, 마치 우리 측의 웅대하고 숭고한 작전이자 전술이었던 것처럼 선전되었습니다.\n\n물질 면에서는, 전쟁이 진행됨에 따라 자원이 근본적으로 부족하리라는 것을 처음부터 알고 있었으면서도, 처음에 가지고 있던 것이 급속히 고갈되어 가는 사정은 국민 전체에게 알려지지 않았습니다. 물론 개인들은 자기가 직접 관계된 분야에 부족이 있다는 것을 알고 있었습니다. 그것은 사실입니다. 그러나 날로 커져 가는 전체적인 부족이 어떠한지를 알 기회는 주어지지 않았습니다. 그 부족이 국가 기밀로 덮여 있었기 때문에 국민은 사태가 얼마나 나빠져 가는지 알 길이 없었습니다. 그런 정보를 얻지 못했기 때문에, 국민은 정부가 채택한 표어, 곧 「일억 국민이 하나 되어 나라를 위해 죽을 각오」라는 것을 살아 내겠다고 마음먹을 수가 없었습니다. 그것을 행동으로 옮길 마음 상태에 스스로를 놓을 수가 없었던 것입니다.\n\n**문.** 그렇다면 전쟁 내내 군사 작전의 경과에 관한 사실을 국민에게 알렸어야 했다는 것이 당신의 생각입니까?\n\n**답.** 물론 적에게 특정 사실을 감춘다는 관점에서 국민에게 말할 수 없는 것들도 있었으므로, 모든 것을 다 말하기란 달리 가능하지 않았을 것입니다. 그러나 적어도 더 많은 정보를 얻어 전쟁이 어떻게 진행되고 있는지를 이해할 기회는 분명히 주었어야 합니다. 당신들 쪽에서 인상 깊었던 것 하나는, 그루(Grew) 대사가 워싱턴(WASHINGTON)으로 돌아간 뒤 일본을 너무 가볍게 보아서는 안 되며 일본의 전쟁 역량은 매우 뿌리가 깊다고 자국민에게 거듭 경고했다는 사실입니다. 반대로 일본의 사정은, 당신 나라에서 오는 어떤 정보를 우리 선전 기관이 정반대 방식으로 이용하는 것이었습니다. 예컨대\n\n--320--\n\n더 많은 여성이 산업에 들어갔다는 사실은 물자와 인력 양면에서 당신들의 자원이 바닥나고 있다는 징후로 지적되곤 했습니다. 다시 말해 두 나라의 선전 정책은 정반대였던 것으로 보입니다.\n\n**문.** 어제 당신은 군인이 정치에서 멀리 떨어져 있어야 한다는 신념을 언급하셨습니다. 일본 해군은 어떤 수단으로 국책을 만들고 거기에 영향을 미쳤습니까? 국책에 관한 해군의 견해가 어떻게 효력을 가질 수 있었습니까?\n\n**답.** 공식 체제는 정부 정책이 어떠해야 하는지, 또는 그것을 어떻게 수정해야 하는지에 관한 해군의 의견을 모두 해군대신이라는 경로를 통해 표명하는 것입니다. 그것이 정당하게 정해진 경로이며, 언제나 그렇게 해야 하는 방식입니다. 그 경로만을 따르고 다른 경로는 따르지 않는다는 것이 해군의 전통이었습니다. 그러나 전쟁 중에는 유감스럽게도 그것이 늘 지켜지지는 않았고, 개별 장교가 정부의 정책 수립에 영향을 미치려 한 예외가 있었다고 생각합니다.\n\n이미 말씀드린 대로 해군이 자기 의견을 정부 정책에 반영시킬 수 있는 길은 해군대신이라는 사람을 통하는 것이었습니다. 전쟁 내내 천황뿐 아니라 일본 국민 일반이 육군과 해군의 협조에 깊은 우려를 품고 있었습니다. 두 군 사이의 원활한 협조가 성공에 절대적으로 긴요했다는 것은 말할 나위도 없습니다. 그러나 어제 말씀드린 대로 육군이 큰 정치적 영향력과 권력을 가지고 있었으므로, 내가 필요하다고 여긴 그 원활함을 얻으려면 해군이 육군의 주도를 따르는 것 외에는 달리 방법이 없었습니다. 그런 점에서 전쟁 내내 해군대신의 자리는 극히 어려운 자리였습니다. 시마다(SHIMADA) 제독이 해군대신으로서 취한 조치 가운데 유감스럽게 여기는 점이 몇 가지 있기는 하지만, 동시에 그가 놓여 있던 어려운 처지에 나는 깊이 동정합니다.\n\n일본 해군의 영향력이 국정에서 가장 효과적으로 발휘된 시기는 러일전쟁 직전과 전쟁 중, 그리고 그 직후였다고 생각합니다. 당시 해군대신은 야마모토(YAMAMOTO, 곤노효에·Gumbai) 제독이었는데, 그는 훌륭한 해군인이었을 뿐 아니라 뛰어난 정치가여서 그 경륜으로 전쟁에 대비해 해군을 정비하고, 성공적인 작전 계획의 기초를 놓아 해군을 이끌어 전쟁을 치러 낼 수 있었습니다.\n\n**문.** 이제 막 끝난 전쟁을 뒤늦은 지혜로 돌아본다면, 다음 각 항목에 해군의 자원을 어떻게 투입하시겠습니까? (1) 항공모함, (2) 육상기지 항공, (3) 수상 전투함. 해군이 쓸 수 있는 자원을 어떤 비율로 투입하시겠습니까?\n\n**답.** 우리가 처했던 실제 물자 사정에 비추어 볼 때, 육상기지 항공에 더 많이 투입했어야 한다고 생각합니다. 실은 항공을 강화하는 계획은 있었으나 그 계획이 실행되지 않았습니다. 우리가 전함의 중요성을 지나치게 강조했으며 전함에 그만큼 주의를 기울일 필요는 없었다고 생각합니다.\n\n**문.** 육군과 해군, 항공을 합친 단일 통합 군종이 전쟁 전이나 전쟁 중에 논의된 일이 있습니까?\n\n**답.** 육군 쪽에서 그런 취지의 제안이 얼마간 나왔다고 들었습니다만 자세한 것은 알지 못합니다.\n\n**문.** 그런 제안이 해군에서 나온 일은 있습니까?\n\n**답.** 해군은 그런 변경에 언제나 반대였다고 이해하고 있습니다. 이상으로 말한다면 두 군을 하나의 지휘 아래 묶어 「국방군(Defense Force)」이라 부를 만한 것을 만드는 것이 좋은 일일 수도 있습니다. 그러나 실제 문제로서는, 특히 일본에 지배적이던 조건 아래에서는 그런 조치가 전혀 불가능했을 것이고 혼란만 낳았을 것입니다.\n\n**문.** 왜 실행이 불가능했는지를 좀 더 구체적으로 논해 주시고, 또 앤더슨 장군이 묻는 대로 그것이 순전히 전쟁이 진행 중이었기 때문에 바람직하지 않다고 여겨진 것인지도 말씀해 주시겠습니까?\n\n**답.** 물론 이미 전쟁이 진행 중이었다는 사실도 한 요인이었다고 해야겠지요. 그러나 더 근본적으로는, 일본에서 그 둘을 하나의 군종으로 합친다면 수장은 아마 육군 인사가 되었어야 했을 것입니다. 그 아래에 육군부와 해군부라는 두 부문이 만들어졌을 것이고, 육군 인사가 대신인 상황에서 해군부는 상대적으로 약한 군종이 되는 일이 불가피했을 것입니다.\n\n**문.** 합동군 체제에 관한 논의에서 해군 항공과 육군 항공을 합친 별도의 항공 부문이 상정된 일이 있습니까? 논의된 안에서 항공 부대의 지위는 어떠했겠습니까?\n\n**답.** 두 군종의 병합으로 단일 군종이 만들어진다 하더라도, 해군에 관한 한 해군 항공대는 수상 부대와 효과적으로 협동하기 위해 해군에 직속되어야 한다고 생각합니다. 사정은 잉글랜드(ENGLAND)에 지배적이던 것과 매우 비슷하다고 생각합니다. 그곳에는 독립된 항공 군종이 존재하지만 실제로는 해군과의 협동이 매우 긴밀하여, 이 독립 항공 군종은 이름만 독립일 뿐 실제로는 해군력의 일부라 불러도 좋다고 생각합니다. 그것이 이상이라고 봅니다.\n\n--321--", "secondary": "Q. Early in our conversation of yesterday afternoon, in discussing the causes of the loss\nof the war, you mentioned the spiritual side of the people, that they were not told what they\nshould have been told. Will you develop more specifically what you had in mind?\nA. Going back to the early days of the war, I believe that one of the reasons for the failure\nof the people to be fully prepared for the later stages of the war was the fact that our\noperations went extremely smoothly in the early period, especially HAWAII and the various\nsouthern regions; and while our official announcements came one after another, victory after\nvictory, tended to get the people \"victory-drunk\" one might say, and it was difficult for\nthe people to get out of that stage, even after the war began to go adversely against us.\nAs I stated yesterday, I personally believe that the turning point of the war was the\nBattle of MIDWAY; and at that time I believe that not only the Government and the two services\nbut the people also should have realized that the turning point had come and made up their minds\nfor the future accordingly. Notwithstanding, the general public got the impression that the\nBattle of MIDWAY was an outstanding victory for us. Moreover, out withdrawal from\nGUADALCANAL, although that marked a definite disadvantage for the Japanese forces,\nwas publicized as though it had been a grand and sublime operation and tactics on our part.\nOn the material side, although it was known from the start that there would be basically a shortage\nin resources as the war progressed, the rapid depletion of what we had to start with was not\nmade known to the people as a whole. To be sure, individuals realized that there was a\nshortage in activities with which they were directly concerned, that is true; but they were\nnot given a chance to find out the overall shortage that was increasing from day to day,\nbecause that shortage was kept under cover as a national secret, and the people had no chance\nto find out how bad the situation was becoming. Because of the failure of the people to acquire\nsuch information, it was not possible for them to make up their minds to live out the slogan\nthat was adopted by the Government; namely, \"100,000,000 people united and ready to die for\nthe Nation.\" They could not place themselves in a state of mind to carry out that in their actions.\n\nQ. It is your belief, then, that the people should have been told the facts concerning the course\nof military operations throughout the war?\nA. Of course there were some things that the people could not be told from a standpoint of\nconcealing such certain facts from the enemy, so that it would not have been possible otherwise\nto tell them everything; but certainly they should have been given a chance through acquisition of\nmore information, at least, to understand how the war was progressing. One of the things that\nimpressed me on your side was the fact that Ambassador Grew, after his return to WASHINGTON,\nkept warning your people that JAPAN must not be held too lightly and that JAPAN's war strength\nwas very deeply rooted. On the contrary, the situation in JAPAN was that certain information\ncoming from your country would be used by our propaganda organs in just contrary fashion.\nFor instance, the fact\n--320--\nthat more women were joining industry would be pointed out as an indication that your resources\nwere running low, both in material and manpower. In other words, the propaganda policy of the\ntwo countries seems to have been just opposite.\n\nQ. Yesterday you referred to your belief that military people should stay removed from politics.\nBy what means did the Japanese Navy create and influence national policy? How could the\nviews of the Navy concerning national policy have effect?\nA. The official setup is that the Navy's opinion as to what the Government policy should be\nor how it should be modified is all expressed through the channel of the Navy Minister.\nThat is the proper and set channel, and that is the way it should always be done.\nIt has been the tradition of the Navy that that channel should be followed and none other;\nbut during the war I think, to my regret, that that was not always followed, that there were\nexceptions where individual officers endeavored to influence the Government in its establishment\nof policy.\nAs I have already stated, the way in which the Navy could bring its opinion to be reflected\nin Government policy was through the person of the Navy Minister. Throughout the war,\nnot only did the Emperor, but the Japanese people in general, feel the deep concern regarding\ncooperation between the Army and the Navy. It goes without saying that smooth cooperation\nbetween the two services was absolutely essential to success. However, as I stated yesterday,\nthe Army had great political influence and power so that in order to obtain that smoothness,\nwhich I considered necessary, the only thing possible was for the Navy to follow the Army's\nleadership. In that respect the position of the Navy Minister throughout the war was an\nextremely difficult one; and while I find certain points in the steps taken by Admiral SHIMADA\nas Minister of Navy, which I consider regrettable, at the same time I feel deep sympathy\nfor the difficult position in which he was placed.\nI believe that the period during which Japanese Navy's influence was most effectively\nexerted in Government politics was just before, during, and after the Russia-Japanese War.\nThe Navy Minister at that time was Admiral YAMAMOTO, (Gumbai), who in addition to being\na good sailor, was an excellent statesman and was able through his statesmanship to equip\nthe Navy in preparation for the war, to lead the Navy through the war by laying the\nfoundation for the successful operational plans.\n\nQ. Using hindsight on the war, looking in retrospect on the war which was just ended,\nhow would you invest the Navy's resources in each of the following categories: (1) Carriers,\n(2) land-based aviation, (3) surface combat ships? In what proportions would you invest\nthe resources available to the Navy?\nA. In light of the actual material situation that we faced, I think that we should have\ndevoted more to land-based aviation. The fact is that we did have plans for strengthening\naviation, but the plan simply did not carry out. I think that we overstressed the importance\nof battleships and need not have devoted as much attention to battleships as we did.\n\nQ. Was a single, unified military service, combining the Army and Navy and Air, ever\ndiscussed before or during the war?\nA. I heard that there were some suggestions of that kind coming from the Army but I know\nnothing of the details.\n\nQ. Did such a suggestion ever come from the Navy?\nA. It is my understanding that the Navy was always opposed to such a change. As an ideal,\nit may be a good thing to combine the two services under one command which we might call\n\"Defense Force\"; but as a practical question, especially under the conditions that prevailed\nin JAPAN, such a step would have been quite impossible and would only have led to confusion.\n\nQ. Will you discuss more specifically why it was impractical and, as General Anderson says,\nwhether it was considered inadvisable purely because the war was going on?\nA. Of course the fact that the war was already going on was one of the factors, I should say;\nbut more fundamentally, if the two were to be combined into one service in JAPAN, the head\nwould probably have had to be an Army man. Under him there would have been created two sections,\nthe Army section and the Navy section; and with an Army man as Minister, it would have been\ninevitable that the Navy section would have become a relatively weak service.\n\nQ. In any discussions concerning a joint-forces set-up, was a separate air section,\ncombining Navy Air and Army Air, envisaged? What would the status of the air forces have been\nunder the proposal discussed?\nA. Even should a single service be formed through the merger of the two services,\nI believe that so far as the Navy is concerned, the Naval Air Force would have to be attached\ndirectly to the Navy in order to effectively cooperate with the surface units. The situation,\nI thin,, is very much as that which prevailed in ENGLAND: Although an independent air service\nexists there, actually its cooperation with the Navy is so close that this independent\nair service is independent only in name and I think actually could be termed a part of the\nnaval force. That I think is the ideal.\n--321--", "note": "원문 오식을 고치지 않았다 — 'out withdrawal'(our의 오식), 'I thin,,'(I think의 오식), 'begin very rapidly depleted' 등. 'YAMAMOTO, (Gumbai)'는 러일전쟁기 해군대신 야마모토 곤노효에(山本權兵衛)를 가리키는 표기이며, 'Gumbai'는 '곤베에/곤노효에'의 음차로 보인다. 연합함대 사령장관 야마모토 이소로쿠(山本五十六)와는 다른 인물이다. '100,000,000 people united and ready to die for the Nation'은 일본 측 표어 「일억일심(一億一心)」·「일억옥쇄」 계열의 영역으로, 원문 그대로 옮겼다. 원문 중간의 '--320--', '--321--'은 원 간행물 쪽수 표시다.", "warn": false, "search": "Public Morale, Naval Influence on National Policy, and Service Unification 豊田副武 도요다 소에무 — 해군대장, 군령부총장(피심문자) 嶋田繁太郎 시마다 시게타로(SHIMADA) — 해군대장, 전 해군대신 山本權兵衛 야마모토 곤노효에(YAMAMOTO, Gumbai) — 러일전쟁기 해군대신 Joseph C. Grew 조지프 그루 — 전 주일 미국 대사 General Anderson 앤더슨 장군 — USSBS 심문관"}, {"id": "toyoda-7", "order": 7, "date": "1945-11-14", "group": "A", "eyebrow": "도요다 소에무 심문조서 · USSBS Nav-75", "title": "포츠담 선언 수락과 8월 14일의 성단 — 국체 논쟁, 어전회의, 천황의 말", "list_right": "문답", "meta": [{"k": "다루는 시점", "v": "1945-11-14"}, {"k": "문서 일자", "v": "1945-11-14"}, {"k": "성격", "v": "문답", "txt": true}, {"k": "원제", "v": "Acceptance of the Potsdam Declaration and the Emperor's Decision of 14 August", "txt": true}], "summary": "8월 9일부터 14일까지 최고전쟁지도회의의 포츠담 선언 수락 논의와 두 차례 어전회의, 그리고 천황이 스스로 내린 종전 결정의 발언 요지를 도요다가 전하는 대목이다.", "points": ["최고전쟁지도회의 구성원 가운데 전쟁 종결에 근본적으로 반대한 사람은 없었고, 쟁점은 포츠담 선언의 조항 전부를 받아들일 수 있는가였다.", "격론이 된 세 가지는 (1) 천황의 장래 지위, (2) 전범 처리, (3) 일본의 장래 국가 형태(통역자 주 — 「National Equality」로 옮겨 온 말, 곧 국체) 였다.", "천황의 지위 유지에는 전원이 일치했고, 전범은 일본 정부가 스스로 색출·재판하게 해 달라는 희망, 국체는 연합국이 조직하는 국민투표가 아니라 일본 국민에게 맡겨야 한다는 희망이 표명되었다.", "8월 9일 논의가 합의에 이르지 못해 10일 새벽 02시 30분(0230)경 어전회의가 열렸고, 천황의 지위가 어떤 식으로도 훼손되지 않는다는 조건 아래 포츠담 선언 수락을 결정했다.", "10일 오전 회의 뒤 수락 의사가 스위스(SWITZERLAND)와 스웨덴(SWEDEN) 중립국 정부를 통해 미국 정부에 전달되었다 — 이 아카이브의 베른·스톡홀름 전보와 맞물리는 대목.", "미국의 공식 회답은 13일에 도착했으나 12일 샌프란시스코(SAN FRANCISCO) 방송으로 그 취지를 먼저 알았다.", "미국 회답의 「천황과 일본 정부의 권한은 연합군 최고사령관의 권한에 종속된다」는 문구가 최대 쟁점이었다 — 천황을 「살아 있는 신」으로 여기는 국민이 받아들이지 않으리라는 우려.", "13일 밤늦게까지의 논의도 결론이 나지 않아 14일 다시 어전회의가 열렸고 포츠담 선언을 전면 수락하기로 결정했다.", "종전의 성단(the Imperial decision)은 다른 누구의 시사도 없이 천황 자신이 내린 것이라고 도요다가 명언하고, 「참기 어려운 것을 참기로 했다」는 천황의 발언 요지를 전한다.", "종전 결정의 군사적 요인으로 도요다는 본토 폭격과 오키나와(OKINAWA) 작전의 실패를 꼽았고, 필리핀(PHILIPPINES) 상실 이후에는 연료 사정 때문에 해군 수상 부대에 기대할 것이 없음을 알고 있었다고 진술.", "일본의 전쟁 자원을 가장 크게 고갈시킨 것은 남방으로부터의 보급 차단 — 주로 선복(shipping bottoms) 상실과 수송 시설 전반의 붕괴라고 답했다."], "primary": "**문.** (앤더슨 장군) 그 말씀은 영국인들이 연안항공사령부(Coastal Command)라 부르는 것을 뜻합니까, 아니면 함대항공대(Fleet Air Arm)를 뜻합니까? 영국은 함대항공대를 운용했고 동시에 해군과 매우 긴밀히 협력하는 연안항공사령부도 두었는데, 연안항공사령부는 영국공군(RAF)의 일부였습니다.\n\n**답.** 나는 함대항공대를 말한 것입니다. 잉글랜드(ENGLAND)에는 육군과 함께 일하는 그에 상응하는 항공 부대도 있으리라 생각합니다. 그리고 거기에 더해 당신들의 폭격 부대와 같은 독립된 육상기지 항공 부대를 두는 것은 반대할 일이 아닙니다.\n\n**문.** (와일즈 해군소령) 어제 오후에 우리가 나눈 전쟁 종결에 관한 논의에 대해 더 하실 말씀이나 덧붙일 정보가 있습니까?\n\n**답.** 최고전쟁지도회의(Supreme War Guidance Council) 회합 이야기를 이어 가겠습니다. 그 회의 구성원 가운데 전쟁을 끝내는 데 근본적으로 반대한 사람은 없었습니다. 다만 포츠담 선언(POTSDAM Declaration)의 조항 전부를 일본이 받아들일 수 있는가에 대해서는 얼마간 의문이 제기되었습니다. 상당한 논의가 오간 점은 세 가지였습니다. (1) 천황의 장래 지위 문제, (2) 전쟁 범죄인 처리 문제, (3) 일본의 장래 국가 조직 형태 문제입니다. (통역자 주 — 우리는 이 어구를 「국가 평등(National Equality)」으로 옮겨 온 일이 잦다고 생각한다.)\n\n첫째 점, 곧 천황의 지위 문제에 관해서는 그것이 유지되어야 한다는 데 구성원 전원의 견해가 일치했습니다. 전쟁 범죄인 문제에 관해서는 일부 구성원이 일본 정부가 전쟁 범죄인을 스스로 색출하여 재판하도록 허용되기를 바란다는 희망을 표명했습니다. 일본의 「장래 국가 조직 형태」에 관해서는, 현재 이 나라의 조직이 국민의 깊은 신념 위에 서 있는 것이므로 현재의 형태를 유지하도록 허용되기를 바란다는 희망이 표명되었습니다. 다시 말해 장래에 그것이 어떤 형태를 가져야 하는지의 결정은 예컨대 연합국 당국이 조직하는 국민투표가 아니라 일본 국민에게 맡겨져야 한다는 것이었습니다.\n\n이 논의는 8월 9일에 있었고, 합의에 이르지 못했으므로 10일 새벽 02시 30분(0230)경에 천황이 임석한 회의가 소집되었습니다. 그 자리에서, 천황의 지위가 어떤 식으로도 영향받지 않는다는 조건 아래 포츠담 선언의 조항을 수락한다는 결정에 이르렀습니다.\n\n10일 오전에 열린 회의 뒤, 포츠담 선언을 받아들일 용의가 있다는 우리 뜻이 스위스(SWITZERLAND)와 스웨덴(SWEDEN)의 중립국 정부를 통해 미국 정부에 전달되었습니다. 미국 정부의 공식 회답은 13일에 접수되었으나, 우리는 그 회답의 취지를 12일 샌프란시스코(SAN FRANCISCO) 방송으로 알았습니다. 최고전쟁지도회의는 13일에 다시 열려 미국의 회답을 논의하며 밤늦게까지 회의를 이어 갔습니다.\n\n천황의 지위 문제에 관해 미국의 회답은 직접적인 언명을 하지 않았으나, 천황과 일본 정부의 권한은 연합군 최고사령관(Supreme Commander for the Allied Powers)의 권한에 종속된다고 밝히고 있었습니다. 그 회의에서 논의의 중심은 천황의 지위였습니다. 천황은 그 위에 어떤 지상의 존재도 있을 수 없는 살아 있는 신(a living god)이라는 것이 일본 국민의 신념이었기 때문입니다. 천황을 점령군 최고사령관보다 아래에 놓는 그 회답의 문구를 일본 국민이 순순히 받아들이지 않으리라는 우려가 있었습니다. 물론 실제로는 그렇게 될 수밖에 없다는 것을 쉽게 이해할 수 있었습니다. 패전국인 이상 우리 원수가 승전국 대표보다 아래 지위에 놓여야 한다는 것은 이해할 만한 일이었습니다. 그러나 문구가 그렇게 쓰인 대로는 받아들이기 어려우리라고 느껴졌습니다. 그래서 그 어려움을 넘기 위해, 점령군 최고사령관의 명령과 지시가 일본 정부에 직접 가고, 그 명령을 내각이 천황에게 전달하여 천황이 헌법상의 권한에 따라 전쟁 종결에 관한 일을 수행하도록 하는 것이 가능하지 않겠는가 하는 제안이 나왔습니다. 그러나 그 논의 뒤에도 결론에는 이르지 못했고, 당시의 국제 관계로 보아 연합국이 그런 체제를 받아들이지 않으리라는 우려가 표명되었습니다. 그리하여 14일에 천황이 임석한 또 한 번의 회의가 열렸고, 그 회의에서 포츠담 선언을 그 온전한 형태로 수락한다는 결정에 이르렀습니다.\n\n전쟁을 끝내겠다는 천황의 결정(The Imperial decision)은 다른 어느 쪽의 시사도 없이 천황 자신이 내린 것입니다. 그때 쓰신 말씀은 대략 다음과 같이 요약할 수 있겠습니다.\n\n> 「전쟁을 계속하는 것은 어느 각도에서 사태를 보더라도 성공적인 결말을 약속하지 못한다. 그러므로 나는 누구의 시사도 받지 않고, 전쟁을 끝내도록 명하기로 결정했다. 수만, 아니 수십만 신민을 죽여야 한다는 생각을 견딜 수 없고, 더구나 세계 평화의 교란자라 불려야 한다는 것도 견딜 수 없기 때문이다. 또한 그동안 내 몸의 일부처럼 의지해 온 장교와 병사들을 연합국 당국에 넘겨야 한다는 것은 나로서는 극히 어려운 일이다. 그러나 나는 참기 어려운 것을 참고 포츠담 선언의 조항을 받아들이기로 결정했다.」\n\n--322--\n\n그리고 필요하다면 조서(Imperial Rescript)를 내리는 것에 더해 직접 라디오에 나가 국민에게 방송하겠다고 말씀하시며 회의 구성원들의 계속된 보좌를 청하는 것으로 말씀을 맺으셨습니다. 매우 감동적인 장면이었습니다. 물론 이것은 그때 천황이 말씀하신 바의 앙상한 요약일 뿐입니다.\n\n**문.** (앤더슨 장군) 기록을 위해, 이 최고회의가 전쟁을 끝내야 한다는 사고와 결론에 이르도록 지배한 근본적이고 주요한 이유들을 알고 싶습니다. 최고회의가 그 기간 내내 적대 행위의 종결 문제를 두고 토의하고 검토할 때 고려하고 저울질한 요인은 무엇이었으며, 이유는 무엇이었고 원인은 무엇이었습니까? 첫 회기가 6월에 시작되었다고 알고 있는데, 그렇습니까? 나는 그때 최고회의가 전쟁 종결의 해법을 찾는 문제를 처음 다루게 만든 요인이 무엇이었는지 알고 싶습니다. 또한 포츠담 선언을 수락하는 최종 결정으로 이끈 요인이 무엇이었는지도 확인하고 싶습니다.\n\n**답.** 그 문제의 논의가 내가 군령부의 지휘를 맡기 몇 주 전에 시작되었다는 점을 지적해 두어도 되겠습니까. 곧 그 논의는 대략 5월 1일 무렵에 시작되었습니다. 나는 그때 회의의 구성원이 아니었으므로 확실하게 말할 수는 없습니다. 다만 봄철 이른 시기부터 일본의 전쟁 역량이 매우 급속히 고갈되고 있음이 명백했으므로, 그 사정이 천황의 주의를 끌게 되어 총리대신이나 내각의 다른 구성원에게 그런 논의를 시작해야 한다고 시사하셨을 가능성이 있습니다. 그것은 단지 가능성일 뿐이고, 확실한 것은 나는 알지 못합니다.\n\n**문.** 우리는 그 무렵 수상에서 작전을 수행하고 있었고 상륙을 감행하며 수상에서 전진하고 있었습니다. 그러나 그때는 또한 일본 본토에 대한 항공 공격도 시작한 뒤였습니다. 최고회의가 항복을 결정하는 데 이바지한 정도로 볼 때, 다음의 여러 군사 작전의 상대적 중요성을 어떻게 매기시겠습니까. (1) 본토에 대한 항공 공격, (2) 수상으로부터의 상륙, (3) 물론 우리 수상 부대가 더 전진하리라는 위협.\n\n**답.** 일본 해군의 수상 부대가 크게 패했다는 사실은 군 바깥의 일본에서는 널리 알려져 있지 않았습니다. 그러므로 일본 본토에 대한 당신들의 폭격이 오키나와(OKINAWA) 작전에서의 우리 실패와 더불어 적대 행위를 중지한다는 결정과 크게 관계가 있었다고 생각합니다. 해군의 수상 부대에 관한 한, 필리핀(PHILIPPINES)을 잃고 나서는 연료 사정 때문에 우리 해군에 크게 기대할 것이 없다는 점을 우리는 알고 있었습니다.\n\n**문.** 당신은 군사 자원의 급속한 고갈을 언급하셨습니다. 우리가 일본에 대해 쓴 병력의 형태 가운데 어느 것이 적대 행위를 계속할 일본의 군사 자원을 고갈시키는 데 가장 크게 이바지했는지에 대한 판단이 있습니까?\n\n**답.** 남방으로부터 오는 우리 보급의 차단입니다. 주로 선복(shipping bottoms)의 상실과 수송 시설 전반의 붕괴를 통해서였습니다.", "secondary": "Q. (General Anderson) Do you mean by that, what the British call their Coastal Command\nor Fleet Air Arm? The British used a Fleet Air Arm and also had a Coastal Command which\nalso worked very closely with the Navy; the Coastal Command was a part of the RAF.\nA. I refer to the Fleet Air Arm. I believe that in ENGLAND there must be a corresponding\nair force working with the Army; and then in addition, to have an independent land-based\nair force such as your bombing forces would not be objectionable.\n\nQ. (Lt. Comdr. Wilds) Do you have any further information or comment you wish to make\non the discussion we had yesterday afternoon regarding the termination of the war?\nA. Continuing with the story of the meetings of the Supreme War Guidance Council,\nthere was no member of that Council who had any fundamental objection to terminating the war,\nbut there was some question raised as to whether or not all the terms of the\nPOTSDAM Declaration\nwould be acceptable to JAPAN. THe points upon which considerable discussion took place\nwere three: (1) the question of the Emperor's future position; (2) the question of disposition\nof war criminals; and (3) the question of JAPAN's future form of organization. (Note by\nthe Interpreter: I think we have often translated the phrase as National Equality.)\nOn the first point, namely, the question of the Emperor's position, all the members were united\nin their view that it should be maintained. On the question of war criminals, the desire\nwas expressed by some of the members that the Japanese Government should be permitted to\nferret out and try the war criminals; and as regards JAPAN's \"future form of National\nOrganization\", the desire was expressed that since the present organization of the country was\none based upon the deep convictions of the people we should be permitted to maintain the\npresent form. In other words, determination of the form that it should have in the future\nshould be left to the Japanese people and not, for instance, to a plebiscite organized by\nAllied authorities.\nThese discussions took place on 9 August and as there was no agreement, a meeting was called\nin the presence of the Emperor on the 10th at about 0230 in the morning; and the decision\nwas reached there that, subject to the condition that the Emperor's position should in no\nway be affected, the term of the POTSDAM Declaration would be accepted.\nAfter the meeting held in the morning of the 10th, our readiness to accept the POTSDAM Declaration\nwas transmitted to the UNITED STATES Government through the neutral Governments of\nSWITZERLAND and SWEDEN. The official reply of the UNITED STATES Government was received\non the 13th, but we learned the purport of that reply from a SAN FRANCISCO broadcast on the 12th.\nThe Supreme War Guidance Council reconvened on the 13th and continued the meeting until late\nat night, discussing the American reply.\nOn the question of the Emperor's position, the American reply made no direct statement but did\nstate that the powers of the Emperor and the Japanese Government would be subject to the\nauthority of the Supreme Commander for the Allied Powers. The main point of discussion at\nthat meeting had to do with the Emperor's position, since it was the conviction of the Japanese\npeople that the Emperor was a living god above whom there could be no earthly being.\nIt was feared that the Japanese people would not readily accept the wording of the reply\nwhich placed the Emperor in a position subordinate to that of the Supreme Commander of the\nOccupation Forces. In practice, of course, it was readily understandable that such would have\nto be the situation because, being the defeated power, it was understandable that our head\nshould have to be placed in a position subordinate to that of the representative of the\nvictorious powers; but the language as it was worded, it was felt, would be found difficult\nto accept. So to overcome that difficulty, the suggestion was made that, would it not be\npossible to have the orders and instructions of the Supreme Commander of the Occupation Forces\ngo directly to the Japanese Government and that those orders would be passed on by the cabinet\nto the Emperor who, in pursuance of his constitutional right, would carry out the work\nconnected with the termination of the war. However, no conclusion was reached after those\ndiscussions and the fear was expressed that, in view of the international relation obtained\nat that time, the Allied Powers would not accept such a set-up. Therefore, another meeting\nwas held on the 14th in the presence of the Emperor which led to the decision to accept\nthe POTSDAM Declaration in its full form.\nThe Imperial decision to bring the war to a close was made by the Emperor himself without\nsuggestions from any other quarters. The words that he used on that occasion might be summed\nup somewhat as follows:\n\"Continuation of the war does not promise successful conclusion no matter from what angle\nthe situation is considered. Therefore I have decided, without suggestions from anyone, to\norder the conclusion of the war, as I cannot endure the thought of having to kill tens,\nevens hundreds of thousands of my subjects, and moreover to have to be called the disturber\nof world peace. moreover, it is extremely difficult for me to have to turn over to the Allied\nauthorities officers and men upon whom I have depended all this time as though they\nwere part of my own body. But I have decided to endure what is unendurable and to accept the\nterms of the POTSDAM Declaration.\"\n--322--\nHe closed his statement by saying that if necessary he would go to the radio and broadcast to\nthe people in addition to issuing the Imperial Rescript and he asked for the continued\nassistance of the members of the council. It was a very moving scene. Of course, that is just\na bare summary of what the Emperor stated on that occasion.\n\nQ. (General Anderson) For the purposes of the record, I would like to get the fundamental\nor major reasons that dominated the thinking and the conclusion of this Supreme Council\nthat the war should be terminated? What were the factors, what were the reasons, the causes,\nthat were considered and weighted at the time the Supreme Council was debating and considering\nthe matter of terminating hostilities throughout that period? I think the first session\nbegan in June, did it not? I want to know what the factors were at that time that caused\nthe Supreme Council to take up initially the matter of finding a solution to the termination\nof the war. I also want to determine what the factors were that led to final decision to accept\nthe POTSDAM Declaration.\nA. May I point out that the discussion of that question commenced some weeks before I\nassumed command of the Naval General Staff; namely, that those discussions commenced somewhere\naround the first of May. I was not a member of the Council at the time, so I cannot say\nwith authority; but since it was evident from the early part of the Spring that JAPAN's war strength\nwas begin very rapidly depleted, it is possible that the situation came to the Emperor's attention\nand that he might have suggested to the Prime Minister or to some other member of the cabinet\nthat such discussion should begin. That is merely a possibility; definitely, I do not know.\n\nQ. We were conducting at that time operations on the surface, we were making invasions,\nmoving ahead on the surface; but also by that time we had begun the air attack on JAPAN proper.\nHow would you list the relative importance of these various military operations in their\ncontribution to the decision on the part o the Supreme Council to surrender: (1) the air attacks\nagainst the homeland proper; (2) the surface invasions; and (3) the threat of course of further\nadvances of our surface forces?\nA. The fact that the Japanese Navy's surface units had been badly defeated was not generally\nknown in JAPAN outside of the services, so I think that your bombing against JAPAN proper,\ntogether with our failure in the OKINAWA Operations, had a great deal to do with the\ndecision to cease hostilities. So far as the Navy's surface units were concerned, it was\nrealized that we couldn't expect much of our Navy once the PHILIPPINES were lost,\nbecause of the fuel situation.\n\nQ. You referred to the rapid depletion of military resources. Do you have an estimate\nas to what form of force that we were employing against JAPAN contributed most toward the\ndepletion of JAPAN's military resources for the continuation of hostilities?\nA. Cutting off of our supplies from the south, principally through the loss of shipping\nbottoms and disruption of transportation facilities in general.", "note": "원문 오식을 그대로 두었다 — 'THe points'(The), 'evens hundreds'(even), 'moreover' 소문자 시작, 'was begin very rapidly depleted'(being), 'on the part o the Supreme Council'(of). 통역자 주에 나오는 'National Equality'는 일본어 「국체(國體)」를 옮긴 말로, 원문 표기를 그대로 살리고 뜻풀이를 덧붙였다. 'Imperial decision'은 「성단(聖斷)」에 해당하나 원문 어법대로 「천황의 결정/성단」으로 병기해 옮겼다. 'living god'(살아 있는 신)도 원문 그대로다. 원문 중간의 '--322--'는 원 간행물 쪽수 표시다.", "warn": false, "search": "Acceptance of the Potsdam Declaration and the Emperor's Decision of 14 August 豊田副武 도요다 소에무 — 해군대장, 군령부총장(피심문자) 昭和天皇 쇼와 천황(the Emperor) General Anderson 앤더슨 장군 — USSBS 심문관 Lt. Comdr. Wilds 와일즈 해군소령 — USSBS 심문관"}, {"id": "toyoda-8", "order": 8, "date": "1945-11-14", "group": "A", "eyebrow": "도요다 소에무 심문조서 · USSBS Nav-75", "title": "폭격이 무엇을 무너뜨렸는가 — 생산 설비·항공기 생산·항공연료, 그리고 개전 전 해군의 계산", "list_right": "문답", "meta": [{"k": "다루는 시점", "v": "1945-11-14"}, {"k": "문서 일자", "v": "1945-11-14"}, {"k": "성격", "v": "문답", "txt": true}, {"k": "원제", "v": "Effects of the Air Offensive on Japan and Prewar Naval Estimates", "txt": true}], "summary": "도요다가 미군 공습이 선박·생산 설비·항공기 생산과 항공연료에 미친 효과를 평가하고, 국민 사기에 대한 영향은 예상보다 작았다고 진술하며, 이어 개전 전 일본 해군의 전력 판단과 방어선 구상을 논한 대목이다.", "points": ["1945년까지 선박 손실의 주원인은 잠수함이었으나, 특히 1945년 4~5월 무렵부터는 공습이 선박 손실의 주된 원인이 되었다고 진술.", "본토에 대한 소이탄 공격의 효과는 물자 자체의 파괴보다 생산 설비(생산 능력)의 파괴가 더 컸다고 평가.", "국민 사기에 대한 효과는 우려했던 것만큼 크지 않았다 — 집을 잃은 사람들도 전쟁을 그만두자는 데까지 가지 않았고, 폭격을 받지 않은 지방에서는 방공호도 파지 않을 만큼 무관심했다고 진술.", "항복 논의에서 공습은 독자적 문제로 거론되지 않았다 — 「하루라도 폭격을 덜 받으려고 전쟁을 그만두어야 한다」는 생각은 없었고, 주된 고려는 국가 생산 능력의 전반적 약화와 물자 상실이었다.", "가장 걱정한 것은 항공기 생산에 대한 폭격의 효과 — 전년에는 해군기만 월 1,000기 이상 생산했으나 1945년 7월에는 약 600기로 전년의 절반 이하로 떨어졌다는 구체적 수치를 제시.", "항공연료가 거의 바닥나 9월 이후에는 충분한 항공연료를 조달할 길이 보이지 않았고, 공습이 몇 달 더 계속되면 전쟁 수행이 불가능해지리라는 결론에 이르게 된다고 진술.", "워싱턴·런던 군축조약으로 대미 60%로 제한되었고, 조약 폐기 후에도 어떤 경우에도 60% 아래로 떨어지지 않게 하는 것을 목표로 삼았다.", "일본 해군의 역사에서 영국과 미국을 동맹한 적으로 상정한 계획은 한 번도 세워진 적이 없으며, 따라서 이 전쟁은 「일본 해군이 성공의 가망이 조금이라도 있는 계획을 세운 전쟁이 아니었다」고 단언.", "진주만(PEARL HARBOR) 공격에 대해 — 함대가 집결해 있지 않았을 경우의 대체 계획은 들은 바 없으며, 그 병력을 진주만에서 찾지 못했다면 기습은 큰 도박이 되었을 것이라고 진술.", "쿠릴(KURILES)–마셜(MARSHALLS)–비스마르크 제도(BISMARCK ARCHIPELAGO)–수마트라(SUMATRA)·말라야(MALAY)·버마(BURMA) 남방을 잇는 방어 주변선 구상은 보유 자원으로 감당하기에 너무 컸다고 평가.", "알류샨(ALEUTIANS)과 미드웨이(MIDWAY)까지 끌어들인 것은 전선의 과도한 확장이었고, 자바(JAVA)·수마트라 이남으로는 나가지 말았어야 하며 중부 태평양에서도 트루크(TRUK) 동쪽으로는 가지 말았어야 했다는 견해.", "「해군력은 결국 소모품(consumption goods)」이라는 인식 — 손실 보충이 물자·인력 부족으로 불가능했다는 진술."], "primary": "**문.** 이 항공 공격, 이 소이탄 공격이 남아 있는 군사 자원을 무너뜨리는 데 어느 정도 이바지하고 있다고 느끼셨습니까?\n\n**답.** 올해까지 우리 선박 손실의 주된 원인은 잠수함 활동이었습니다. 그러나 특히 올해 4월과 5월 무렵부터는 당신들의 공습이 우리 선박 손실의 주된 원인이었습니다.\n\n**문.** 우리는 선박 왕래가 상당히 효과적으로 차단되어 일본에는 앞으로의 군사 작전을 수행할 본토의 군사 자원만이 남게 되었음을 알고 있습니다. 본토에 대한 항공 공격, 소이탄 공격은, 만일 전쟁을 계속했다면 그것으로 전쟁을 이어 갈 작정이었던 본토의 남은 군사 자원에 어떤 영향을 주고 있었습니까? 그 작전들은 전쟁 계속을 위한 당신들의 자원을 더 고갈시키는 데 얼마나 큰 효과가 있었습니까?\n\n**답.** 일본 본토에서 물자에 가해진 손해의 정도에 대해서는 대략의 숫자조차 댈 수 없습니다. 그러나 물자 자체의 파괴가 미친 효과보다 공습에 의한 우리 생산 설비의 파괴가 더 컸다고 생각합니다.\n\n**문.** 생산 능력 말입니까?\n\n**답.** 그렇습니다, 생산 능력입니다.\n\n**문.** 그것이 국민의 계속 싸우려는 의지에 어떤 영향을 주었다고 느끼셨습니까? 다시 말해 이 항공 공격, 이 소이탄 공격이 전쟁을 계속하려는 국가의 의지에 어떤 효과를 주었습니까? 그것이 약화되는 경향이 있었습니까? 그렇다면 어느 정도였습니까?\n\n**답.** 국민 사기에 미친 효과는 우리가 두려워했던 만큼 크지 않았습니다. 다시 말해 집을 잃은 사람들이 극히 어려운 처지에 놓이기는 했으나, 전쟁을 그만두고 싶어 하는 데까지 발전하지는 않았습니다. 물론 수송을 끊었기 때문에 생산에는 영향이 있었고, 어떤 경우에는 폭격의 위험 때문에 공장에 나오지 않은 공원(工員)도 분명 있었을 것입니다. 그것이 생산에 어느 정도 영향을 주었습니다만, 국민의 싸우려는 의지에 미친 영향은 우리가 두려워했던 만큼 크지 않았습니다.\n\n**문.** 항복을 고려하게 된 그 회의들에서 일본 본토에 대한 항공 공세에는 어떤 값이 매겨졌습니까? 전쟁 종결 문제를 검토할 때 그것을 어떻게 평가했습니까?\n\n**답.** 공습 문제가 구성원들의 머릿속에 독자적인 문제로 떠올랐다고는 생각하지 않습니다. 곧 하루라도 폭격을 더 받지 않기 위해 전쟁을 그만두어야 한다는 생각은 없었습니다.\n\n--323--\n\n적대 행위를 중지한다는 결정으로 이끈 주된 고려는 결국 국가 생산 능력의 전반적 약화, 물자의 상실 등이었습니다. 사기에 미친 효과에 관해서는 이미 말씀드린 바를 다시 언급하면서, 폭격을 받은 지역 밖에서는, 특히 지방에서는 사람들이 폭격에 거의 전혀 개의치 않는 듯이 보였고 그것은 방공호를 파지 않는 것 등으로 드러났다는 점을 지적해 두겠습니다. 그러므로 나라 전체로 보면 사기에 미친 효과는 매우 가벼웠습니다.\n\n**문.** 이런 성격의 지속적인 폭격이 여러 달 더 계속되도록 허용되었을 경우의 누적 효과, 그런 지속적 작전이 일본 본토와 그 전쟁 수행 능력 또는 생존 능력에 미쳤을 누적 효과에 값을 매겨 보려는 시도가 그때 있었습니까?\n\n**답.** 나를 가장 걱정시킨 점은 계속되는 폭격이 항공기 생산에 미치는 효과였습니다. 전년에는 해군기만 해도 월 1,000기 이상을 생산하고 있었는데 올해 7월에는 그 생산이 약 600기로 떨어져 전년의 절반에도 못 미쳤습니다. 그리고 내가 보는 한 우리 항공연료 공급은 거의 끝에 다다르고 있었으며, 9월 이후에는 충분한 항공연료를 어떻게 조달할 수 있을지 도무지 알 수 없었습니다. 그 두 가지 사실, 곧 항공기 생산의 감소와 항공연료의 부족은 대체로 당신들의 공습 때문이었으므로, 그 뒤로도 공습이 몇 달 더 계속된다면 우리가 전쟁을 계속하기는 불가능해지리라는 결론에 자연히 이르게 되는 것입니다.\n\n**문.** 개전 전 해군이 스스로의 역량을 어떻게 판단했는지, 곧 미국의 역량에 견준 일본 해군의 역량을 어떻게 보았는지 듣고 싶습니다.\n\n**답.** 워싱턴·런던 해군 군축조약(WASHINGTON-LONDON Naval Disarmament Treaties)의 결과로 일본 해군력은 미국 전력의 약 60%로 제한되어 있었습니다. 그 조약들이 폐기된 뒤로는 물론 그 비율을 유지할 의무가 더는 없었으므로, 우리는 어떤 경우에도 상대적 전력이 당신들의 60% 아래로 떨어지지 않도록 양과 질 양면에서 해군을 증강하는 데 힘을 쏟았습니다. 우리 해군의 상대적 전력이 항목별로 어떠했는지는 숫자로는 기억하지 못합니다. 이 전쟁에서 미국과 잉글랜드(ENGLAND) 양쪽을 상대해야 할 필요에 직면했을 때, 미국과의 상대적 전력 문제는 상대적으로 작은 문제가 되었습니다. 우리 해군의 역사에서 대영제국(GREAT BRITAIN)과 미국을 동맹한 적으로 상정한 계획이 세워진 일은 한 번도 없었습니다. 따라서 이 전쟁은 일본 해군이 조금이라도 성공의 가망이 있는 계획을 세워 놓은 전쟁이 아니었다고 말해도 무방할 것입니다.\n\n**문.** 이 전쟁이 불가피해진 뒤, 이 전쟁을 수행한다는 결정이 내려진 뒤에, 미국과 영국의 적 해군에 맞서는 해군의 전쟁 계획은 대체로 무엇이었습니까? 그 상대 해군력에 어떻게 대처할 작정이었습니까?\n\n**답.** 어제 말씀드린 대로 나는 그때 중앙 사령부에 있지 않았으므로 미영 해군에 대한 장비와 작전에 관해 어떤 계획이 있었는지 말할 처지가 아닙니다. 다만 나의 추측으로는, 결정이 내려진 이상 그들은 손에 가진 것으로 일어나 싸우는 수밖에 없었을 것입니다.\n\n**문.** 그들이 상대 연합국 해군에 대해 작전을 수행하려던 넓은 의미의 전반적 전쟁 계획에 대해 당신이 통보받고 있었는지 궁금했습니다.\n\n**답.** 해군이 역점을 둔 것은 기습 공격이 아니었을까 생각합니다.\n\n**문.** 그 대답이 내가 묻고 싶은 다음 질문으로 이어집니다. 곧 집결한 목표를 치는 것이 분명했던 진주만(PEARL HARBOR) 공격 계획에서, 그런 병력의 집결이 없을 경우에 대비한 그러한 기습 공격의 대체 계획이 일본 해군에 있었습니까? 만일 그 병력이 밖에 나가 있었다면, 이 집결한 목표를 찾지 못했을 경우에 시행할 다른 계획이 있었습니까?\n\n**답.** 그런 계획이 있었다는 말은 듣지 못했습니다. 만일 그런 병력이 진주만에서 발견되지 않았다면 그 기습 공격은 큰 도박이 되었을 것입니다.\n\n**문.** (헤딩 대령) 나는 일본 해군도 미국 해군이 그러했듯 전쟁을 준비하면서 여러 사태에 대비한 일정한 기본 계획을 세워 두었으리라고 봅니다. 당신은 그 기본 계획들을 알고 있었습니까, 아니면 전쟁 전의 그 계획이 어떤 것이었는지 지금은 꽤 잘 알고 있습니까?\n\n**답.** 그렇습니다. 만들어진 모든 해군 계획은 천황의 재가를 위해 상주됩니다. 그러나 그런 계획이 해군 안에서도 아주 널리 알려진다고는 생각하지 않으며, 진수부(Naval Station) 당국에까지 알려지는지도 의심스럽습니다.\n\n**문.** 그러나 당신은 그 전반적 계획을 어느 정도 알고 있었습니까?\n\n**답.** 아닙니다.\n\n**문.** 오마에(OHMAE) 대령이 기록에 의해서든 개인적 지식에 의해서든 이 전쟁의 기본 계획을 대략 다음과 같이 개략한 바 있습니다. 남방의 일정 지역을 획득하고 이 자원 지역을 지키기 위한 주변 방어선을 세우는 것인데, 그 주변선은 대략 쿠릴 열도(KURILES), 마셜 제도(MARSHALLS), 비스마르크 제도(BISMARCK ARCHIPELAGO), 그리고 수마트라(SUMATRA)·말라야(MALAY)·버마(BURMA)의 남쪽을 잇는 것입니다. 해군의 자원이 이 폭넓은 계획을 수행하기에 충분했다고 보십니까?\n\n--324--\n\n**답.** 이것은 우리가 가진 자원으로 수행하기에는 너무 컸던 수많은 계획 가운데 하나였다고 생각합니다. 우리가 처음에 가지고 있던 병력으로도 이 계획을 수행하기는 어려웠을 것이고, 해군력이란 결국 소모품(consumption goods)이라는 점을 생각하면 나중에는 훨씬 더 그러했습니다. 전쟁이 진행되면서 우리는 손실을 입었는데, 그 손실을 계속 보충할 충분한 조치는 취해지지 않았고 물자와 인력의 부족으로 취할 수도 없었습니다. 나는 처음부터 알류샨 열도(ALEUTIANS)와 미드웨이(MIDWAY)까지 끌어들였을 때 우리 전선을 지나치게 늘였다고 느꼈습니다. 나는 언제나 전선을 압축하고 우리가 가진 병력을 비교적 좁은 지역에 집중해야 한다고 느꼈습니다. 남방에서 자원을 얻어야 할 필요 때문에 우리 전선이 자바(JAVA)와 수마트라까지 뻗는 것은 물론 불가피했으나, 남쪽으로 그 너머까지 갈 일은 아니었습니다. 중부 태평양(Central PACIFIC)에 머물러 트루크(TRUK)보다 동쪽으로 더 나아가지 않았더라면 더 현명했을 것입니다. 그렇다고 해서 처음부터 마셜 제도를 포기하는 데 찬성했으리라는 말은 아닙니다. 다만 나라면 그곳에는 그 방면에서 오는 당신들의 공세를 충분히 오래 지연시켜 우리가 안쪽 방어선을 강화할 수 있게 할 만큼의 병력만을 두었을 것입니다.", "secondary": "Q. Did you feel that these air attacks, these fire attacks, were contributing in any degree\ntoward the disruption of the remaining military resources?\nA. Until this year our main loss in shipping was due to submarine activities;\nbut, especially beginning around April and May of this year, your air raids were the\nprincipal cause of our shipping losses.\n\nQ. We know that shipping had become interdicted rather effectively, leaving JAPAN with\nonly the military resources on the homeland with which to conduct her further military\noperations. What effect was the air attacks, the fire attacks, on the homeland having on\nthe remaining military resources that you had on the homeland proper with which, if you\nhad continued war, you had intended to continue war? How much effect did those operations\nhave on further depleting your resources for continuing war?\nA. I cannot give even approximate figures as to the extent of damage done to material\nin JAPAN proper, but I believe that greater than the effect on the destruction of materials\nthemselves was the destruction of our production equipment by air raids.\n\nQ. Production capacity?\nA. Yes, production capacity.\n\nQ. How did you feel that it affected the will of the people to continue to fight?\nIn other words, what effect did these air attacks, these fire attacks, have on the will of\nthe nation to continue war? Did it tend to deteriorate? If so, to what degree?\nA. The effect on the people's morale was not as great as we had feared. In other words,\nwhile people who lost their homes faced extremely difficult times, it did not develop to\nthe point of wanting to give up the war. To be sure, it had an effect on production because\nit cut off transportation, and in some cases, no doubt, some factory hands stayed away from\nfactories because of the danger of bombing. That affected production to some extent,\nbut affecting the people's will to fight was not as great as we had feared.\n\nQ. In these conferences leading to the consideration of surrender, what value was put on\nthe air assaults on JAPAN proper? How did they evaluate that when they were considering\nthe matter of terminating war?\nA. I do not believe that the question of air raids came up in the minds of the members\nas an independent question at all; that is there was no idea that we must give up the war\nto avoid even a single additional day of bombing.\n--323--\nThe main consideration that led to the decision to cease hostilities was, after all,\nthe overall weakening of the Nation's production capacity, loss of material, etc.\nI refer to the statement already made regarding the effect on morale and point out that\noutside of bombed areas, especially in the country, people appeared to be almost wholly\nunconcerned about bombing as was evidenced by their failure to dig air raid shelters, etc.;\nso that, taking the country as a whole, the effect on morale was very light.\n\nQ. Was there any attempt at this time to put a value on the cumulative effect of\nsustained bombing of this nature had it been permitted to continue on for many months,\nthe cumulative effect that such sustained operations would have on JAPAN proper, her capacity\nto wage war, or to survive?\nA. The point that worried me most was the effect of continued bombing on aircraft production.\nWhereas the year before we were producing over 1,000 naval aircraft alone monthly,\nin July of this year that production had fallen to around 600, less than half of the previous\nyear; and so far as I could see we were just about nearing the end of our aviation fuel supply,\nand I could not see how we could possibly procure sufficient aviation fuel after September;\nand since those two facts, namely, fall in aircraft production and shortage in aviation fuel,\nwere largely due to your air raids, we would naturally reach the conclusion that, if the air raids\nwere to continue for months after that, it would become impossible for us to continue the war.\n\nQ. I want to get from you the naval estimate of their capabilities prior to the opening\nof the war; that is, the Japanese Navy's capabilities in terms of American capabilities.\nA. As a result of the WASHINGTON-LONDON Naval DIsarmament Treaties, Japanese Naval strength\nhad been restricted to around 60% of UNITED STATES strength. After those treaties were\nabdicted it was, of course, no longer incumbent upon us to maintain that ratio, so we\ndevoted our efforts to the building up of the Navy, quantitatively and qualitatively so that\nin no case would our relative strength fall below 60% of yours. I do not remember by figures\nwhat the relative strength of our Navy was categorically. When we faced the necessity of taking\non both the UNITED STATES and ENGLAND in this war, the question of our relative strength\nwith the UNITED STATES became relatively a small question. Never in the history of our Navy\nwere plans ever drafted which envisaged a war with GREAT BRITAIN and the UNITED STATES as\nallied enemies. Consequently it may safely be said that this was not a war in which the\nJapanese Navy laid down plans which had even a fair chance of success.\n\nQ. After this war became inevitable, after the decision was reached to conduct this war,\nwhat generally was the naval war plan for opposing the enemy Navies, American and British?\nHow did you intend to cope with this opposing naval power?\nA. As I stated yesterday, I was not in Central Headquarters at the time so that I am not in\na position to say what were the plans with regard to equipment and operations against\nthe American and British Navies, but my guess in that since the decision had been made\nthey had to get up and fight with what we had on our hands.\n\nQ. I was wondering if you were informed on the broad general war plans under which they\nproposed to conduct operations against the opposing Allied naval forces?\nA. I wonder whether the emphasis on the Navy was not placed upon surprise attack.\n\nQ. That carries to another question I'd like to ask and that is: In the planned attack on\nPEARL HARBOR, which apparently was to attack a concentrated target, did the Japanese Navy\nhave any alternate plan for such a surprise attack in the event that there was not such a\nconcentration of force? If the force had been out in the open, was there another plan to\nbe implemented in case this concentrated target was not found?\nA. I have not heard of any such plan. If such a force had not been found in PEARL HARBOR,\nthe surprise attack would have been a big gamble.\n\nQ. (Captain Hedding) I assume that in preparing for war in the Japanese Navy,\nas well as we did in the American Navy, you laid certain basic plans for eventualities.\nDid you know of those basic plans or are you now fairly familiar with what those plans were\nprior to the war?\nA. Yes. Every naval plan made is submitted to the Emperor for his approval, but I do not\nbelieve that those plans are made known very widely even in the Navy, and I doubt whether they\nare made known even to the Naval Station authorities.\n\nQ. But you were familiar with, more or less, the general planning?\nA. No.\n\nQ. Captain OHMAE has outlined from either\nrecords or from personal knowledge a basic plan for this war which went about as follows:\nTo obtain certain areas in the south and to establish a perimeter to protect these resource areas,\nthe perimeter being roughly from the KURILES, the MARSHALLS, the BISMARCK ARCHIPELAGO and south\nof SUMATRA, MALAY, BURMA. Do you feel that the naval resources were sufficient to carry out\nthis broad plan?\n--324--\nA. I believe that this was one of numerous plans which was too big to be carried out\nby the resources at our command. Even with the forces which we had to start with, the\ncarrying out of this plan would have been difficult, much more so later when you consider\nthat naval force after all, is consumption goods. As war progresses we suffer losses, and\nsufficient measures had not been taken, could not be taken in view of shortage of material\nand manpower, to continually replenish those losses. I felt at the outset that we had\nover-extended our line when we took in the ALEUTIANS and MIDWAY. I always felt that the line\nshould be made compact and to concentrate the forces that we did have in a relatively narrow area.\nBecause of the necessity of obtaining resources from the south, it was of course inevitable\nthat our lines should be extended as far as JAVA and SUMATRA but not beyond that, down south.\nIt would have been wiser had we kept ourselves to Central PACIFIC, not going further east\nthan TRUK. That is not to say that I would have favored giving up the MARSHALLS to being with,\nbut I would have put in there only sufficient force so as to have delayed your offensive\nfrom that region a sufficiently long time to enable us to strengthen the inner line.", "note": "원문 오식을 그대로 두었다 — 'Naval DIsarmament'(Disarmament), 'abdicted'(abrogated의 오식으로 보임), 'my guess in that'(is), 'the MARSHALLS to being with'(to begin with), 'a feeing'(feeling). 'Kenzai Hombu'는 다음 장(toyoda-9)에 나오는 표기로, 해군 함정본부(艦政本部, Kansei Hombu)의 오기로 보이나 원문대로 두었다. 항공기 생산 수치(월 1,000기 이상 → 1945년 7월 약 600기)는 원문 그대로 옮겼고 반올림하지 않았다.", "warn": false, "search": "Effects of the Air Offensive on Japan and Prewar Naval Estimates 豊田副武 도요다 소에무 — 해군대장, 군령부총장(피심문자) Captain Hedding 헤딩 대령 — USSBS 심문관 大前敏一 오마에 도시카즈(Captain OHMAE) — 일본 해군 대령, 별도 심문 대상자"}, {"id": "toyoda-9", "order": 9, "date": "1945-11-14", "group": "A", "eyebrow": "도요다 소에무 심문조서 · USSBS Nav-75", "title": "강철 600만 톤과 연료 10퍼센트 — 「1년은 어떻게든」이라는 계산, 미드웨이의 교훈, 기지항공과의 협동 실패", "list_right": "문답", "meta": [{"k": "다루는 시점", "v": "1945-11-14"}, {"k": "문서 일자", "v": "1945-11-14"}, {"k": "성격", "v": "문답", "txt": true}, {"k": "원제", "v": "Steel and Fuel, the Lesson of Midway, and Land-Based Air Cooperation", "txt": true}], "summary": "도요다가 개전 전 해군 수뇌부의 「1년 남짓」이라는 전망과 강철·연료의 절대적 열세를 밝히고, 미드웨이 이후 항모 중심으로의 전환, 기지항공대와 모함항공대의 협동이 왜 실패했는지를 진술한 대목이다.", "points": ["고급 장교들 사이에 개전 전부터 「1년 남짓」이라는 전망이 있었음을 인정하고, 야마모토 제독이 제3자를 통해 「1년은 어떻게든 밀고 나갈 수 있으나 그 뒤는 모르겠다」고 말했다고 전해 들었다고 진술.", "강철 연산 약 600만 톤 대 미국의 연 8,000만~1억 톤 — 「거의 무시할 만한 양」이라고 표현. 연료 격차는 더 커서 일본은 연간 소요의 약 10%만 생산할 수 있었다.", "개전 전 2년간 함정본부(Kenzai Hombu, 원문 표기) 수장으로 있으면서 함형·사양을 둘러싼 의견 불일치와 물자 곤란을 겪었다고 진술.", "군축조약의 양적 제한이 풀린 뒤에도 조선 전문가들의 머릿속에는 질 향상의 사고가 남아 있었고, 도요다는 질에서 양으로 방향을 되돌려야 한다고 보았다 — 「함선은 소모품」이며 급속히 대체되어야 한다는 인식.", "미드웨이(MIDWAY)의 교훈은 전함이 충분한 항공 지원 없이는 유효한 무기가 아니라는 것이었고, 그 결과 함대 편성이 항모 중심으로 재편되었음을 확인. 구축함과 잠수함의 건조 방식도 그 뒤 달라졌다.", "연합함대 사령장관 재임 중 해군 모함기 전부를 투입한 두 차례 큰 해전에서 기지항공대와 모함기의 긴밀한 협동 명령이 있었으나, 모함항공대가 양과 질 모두에서 너무 약해 협동이 이루어지지 못했다고 진술.", "기지항공 우산 아래로 미 수상 부대를 끌어들이려는 구상은 있었으나, 항공기 부족과 조종사 훈련 부족, 그리고 부대 하급 제대 간 통신이 불가능해 사령부 간 연락에 의존해야 했던 통신 체계의 미비 때문에 실현되지 못했다.", "마리아나(MARIANAS)의 예 — 제1항공함대(First Air Fleet)가 티니안(TINIAN) 섬에 배치되었으나 일본에서 훈련받고 급히 내려보내져 도착하자마자 마리아나 작전이 시작되었다.", "일본 해군에 대해 가장 효과적이었던 무기 — 전쟁 전반기는 잠수함, 후반기는 항공 병력이었다고 시기를 나누어 답했다.", "미드웨이 작전의 목적을 알지 못하며 이해할 수도 없어 「완전한 실패」로 단정한다고 진술.", "일본 지도부가 「미국에게 이 전쟁은 국가의 명예나 극동 경제 이익의 보호에 지나지 않으므로 전쟁이 조금 더 이어지면 싸울 의지를 잃을 것」이라 느꼈을 수 있고, 그 생각으로 전선을 계속 넓혔을지 모른다는 도요다의 추측."], "primary": "**문.** 우리는 일본 해군의 몇몇 고급 장교들이, 개전 전에 일본 해군이 아마도 1년, 혹은 1년 반쯤밖에 성공적으로 작전할 수 없으리라 느꼈다고 표명한 의견을 들은 바 있습니다. 그 의견을 긍정하시겠습니까, 부정하시겠습니까?\n\n**답.** 고급 장교들 사이에 그런 느낌이 있었다고 생각합니다. 다만 그런 취지의 의견 교환이나 표명을 나는 알지 못합니다. 각자 마음속에 담아 두고 있었습니다. 나는 직접이 아니라 제3자를 통해, 야마모토(YAMAMOTO) 제독이 「1년은 어떻게든 밀고 나갈 수 있으나 그 뒤는 나도 모르겠다」는 것이 자기 의견이라고 말했다는 것을 들었습니다.\n\n**문.** 지금도 비슷하게 생각하십니까?\n\n**답.** 그렇습니다. 나도 전쟁 초기 1년쯤은 그럭저럭 해낼 수 있겠으나 그 뒤에는 극히 어려워지리라는 견해를 대체로 함께 가지고 있었습니다. 마침 개전 전 2년 동안 나는 함정본부(Kenzai Hombu)의 해군 기술 부문 수장이었고, 따라서 해군의 장비와 함선에 관해 책임 있는 자리에 있었습니다. 그때 나는 건조할 함형에 관해서든 함선의 사양에 관해서든 의견이 늘 일치하지는 않는다는 것, 그리고 물자에 곤란이 있다는 것을 보았습니다. 우리 물자 곤란의 주된 원인은 강철 부족이었습니다. 우리 연간 공급량은 약 600만 톤이었는데, 이는 당신 나라의 연간 8,000만 톤에서 1억 톤에 견주면 거의 무시할 만한 양이었습니다. 연료 공급의 차이는 그보다도 더 컸습니다. 우리 연료 공급은 당신들에 견주면 아예 논외였습니다. 우리는 연간 소요량의 약 10%밖에 생산하지 못했습니다.\n\n조선 이야기로 돌아가면, 함종과 사양을 둘러싼 의견 차이는 워싱턴(WASHINGTON) 및 런던(LONDON) 조약 아래에서 우리가 양적 제한을 받고 있었다는 사실에서 나왔습니다. 양에 역점이 놓여 있었기 때문에, 내가 해군 기술 부문의 수장으로 있던 시기에 우리는 이미 톤수에 관한 조약 제한을 받지 않게 되었음에도 조선 전문가들의 머릿속에는 질을 높인다는 같은 생각이 남아 있었고, 우리는 해군의 여러 부서로부터 더 높은 성능의 함선을 요구하는 주문을 받곤 했습니다. 나는 그때, 이제 양적 상한에 묶이지 않게 되었으니 우리가 질에서 다시 양으로 관심을 돌려 함선의 수를 늘려야 한다고 느꼈습니다. 이미 시작되어 있던 제2차 유럽 전쟁(Second European War)의 경험에서 보건대 함선을 오랫동안 안전하게 보전하기를 기대할 수 없다는 것을 알 수 있었기 때문입니다. 다시 말해 함선은 소모품이며, 일정한 전력 수준을 유지하려면 빠르게 대체되어야 하는 것입니다.\n\n**문.** 당신은 일본 해군이 미드웨이(MIDWAY)에서 얻은 교훈 가운데 하나가 함대 편성에 지나치게 역점을 두었고 그 편성이 전함에 지나친 비중을 두고 있었다는 것이며, 미드웨이 해전의 결과로 함대의 주요 유효 병기로서 항공모함에 대한 비중을 높이는 방향으로 재편성이 이루어졌다고 말씀하셨습니다. 그러한 진술이 옳은지에 대해 의견을 말씀해 주시겠습니까?\n\n**답.** 그렇습니다, 사실입니다. 그 전까지 전함이 그림의 중심을 차지하고 있었던 까닭은, 함대 대 함대의 중요한 해전이 있으리라는 생각을 우리가 가지고 있었기 때문입니다. 그러나 미드웨이 교전의 결과로 우리는 전함이라는 것이 충분한 항공 지원을 받지 못하면 유효한 병기가 아니라는 교훈을 얻었습니다. 구축함과 잠수함에 관해서도 비슷한 교훈을 얻었고, 그 두 함종의 건조 방식은 그 뒤로 달라졌습니다.\n\n**문.** (앤더슨 장군) 이 전쟁 수행의 전반적 계획에서, 일본 해군이 주변 방어선을 넓혀 가면서 육상기지 항공을 기동 수상 부대와 함께 지원하고 협동시키는 데 관한 기본 구상은 무엇이었습니까? 이 주변선 확장에서 육상기지 항공과 해상 항공을 협동시켜 이 주변선을 방어하는 효과를 높인다는 계획이 있었습니까? 또 그 계획은 육상기지 항공을 함대 기동부대(Task Forces)와 직접 지원 협력하도록 조율하는 것을 상정하고 있었습니까?\n\n**답.** 내가 연합함대를 지휘하는 동안 해군의 모함기 전부가 투입된 중요한 해전이 두 차례 있었습니다. 사령부의 기지항공 부대와 모함기 사이에 가장 긴밀한 협동이 있어야 한다는 명령이 내려져 있었으나, 그 협동은 실효 있게\n\n--325--\n\n수행되지 못했습니다. 모함항공 부대가 양과 질 양면에서 너무 약했기 때문입니다. 우리에게는 모함기가 충분치 않았고 조종사들도 고도로 훈련되어 있지 않았습니다. 따라서 협동은 결코 잘되지 않았습니다.\n\n**문.** 내가 밝히고 파고들고 싶은 것은, 육상기지 항공을 활용하고 그 우산 아래에서 작전한다는 일본 해군의 구상입니다. 곧 육상기지 항공의 항속과 지원 거리 안에서 작전함으로써 해군 부대의 역량을 높이고, 그렇게 하여 동쪽 미국(AMERICA)에서 오는 병력과 싸울 힘을 키워 이 방어 주변선을 세운다는 구상 말입니다.\n\n**답.** 그렇습니다, 그런 생각은 분명 해군 당국의 머릿속에 있었습니다. 그러나 육상기지 항공 부대를 효과적으로 활용하지 못한 것은 주로 육상기지 항공 부대 자체가 약했던 데 있고, 어제 말씀드린 대로 육상기지 항공 부대와 모함항공 부대 사이의 협동이 약했던 것은 양자 간 통신이 나빴기 때문입니다. 둘이 협동해야 하는 작전은 각 사령부 사이의 연락으로 수행해야 했습니다. 우리 통신 체계는 하급 제대의 부대들 사이에서 통신이 가능한 수준까지 발달해 있지 않았습니다.\n\n물론 구상으로는 우리도 당신들의 수상 부대를 우리 육상기지 항공기의 항속 안으로 끌어들이고자 했습니다만, 그것을 실현하는 데는 늘 어려움이 있었습니다. 그 까닭은 이미 말씀드린 대로 항공기가 충분치 않았고 조종사들의 훈련이 충분하지 않았다는 것입니다. 한 예로 마리아나(MARIANAS)에서는 제1항공함대(First Air Fleet)를 그리로 내려보내 다가올 교전에 대비해 티니안(TINIAN) 섬에 배치했습니다. 그 부대는 일본에서 훈련을 받고 서둘러 그리로 보내졌는데, 도착하자마자 마리아나 작전이 시작되었습니다.\n\n**문.** 어제 당신은 어느 질문에 답하면서 수상 부대가 일본 해군에 가장 큰 위협이 되었다고 보았다고 말씀하신 것으로 이해했습니다. 이 전쟁에서 일본 해군에 대해 쓰인 가장 효과적인 병기는 무엇이었다고 보십니까? 아마 수상 포화와 항공 화력 가운데 어느 쪽인지를 밝혀 두어야 질문이 분명해지겠습니다.\n\n**답.** 어떤 병기로 말입니까?\n\n**문.** 일본 해군을 소모시키는 데 효과가 있었던 것으로서 항공 병기인지 해상 병기인지 말입니다.\n\n**답.** 이 질문에 답하려면 전쟁을 두 시기로 나누어야 하겠습니다. 전쟁 전반기에는 잠수함이 가장 효과적인 병기였다고 생각합니다.\n\n**문.** 일본 해군에 대해서 말입니까?\n\n**답.** 그렇습니다. 그리고 전쟁 후반기에는 당신들의 항공 병력이 가장 효과적인 병기였습니다.\n\n**문.** 한 가지만 더 묻고 싶습니다. 일본 해군의 역량을 바꾸어 놓은 매우 결정적인 작전으로 여겨지는 이 미드웨이 작전에서, 미드웨이에 대한 그 작전의 목표는 무엇이었습니까? 전략적으로 왜 그 작전이 감행되었습니까?\n\n**답.** 나는 그것이 무엇이었는지 알지 못하며, 그 작전의 목적이 무엇이었을지 이해할 수도 없습니다. 그래서 나는 그것을 완전한 실패라고 단언하는 것입니다. 이것은 순전히 내 추측입니다만, 미드웨이 작전은 최초 작전들의 눈부신 성공의 결과로 생겨난 경향, 곧 활동 범위를 사방으로 — 동쪽으로는 하와이(HAWAII), 서쪽으로는 인도양(INDIAN OCEAN)의 실론(CEYLON)까지 — 넓히려는 경향의 한 단계로 감행된 것이라고 생각합니다.\n\n또 하나 추측이 허용된다면, 작전 지역을 그토록 넓게 확대하기로 한 결정은 당시 일본 당국자들의 다음과 같은 느낌에 돌릴 수 있으리라 생각합니다. 곧 당신들이 이 전쟁을 치르는 마음가짐과 우리가 이 전쟁을 치르는 마음가짐이 매우 달랐다는 것입니다. 우리에게 이 전쟁은 국가의 존립 자체를 건 전쟁이었던 데 반해, 당신들의 경우에는 단지 국가의 명예 문제이거나 어쩌면 극동에서의 경제적 이익의 보호에 지나지 않았다는 것입니다. 그리고 그런 조건에서 치르는 전쟁은 당신들에게는 우리에게보다 상대적으로 대수롭지 않은 것이므로, 전쟁이 조금 더 계속되면 당신들이 싸울 의지를 잃으리라는 느낌이 우리 지도자들 쪽에 있었을 수 있고, 그런 생각으로 우리가 전선을 계속 넓혀 갔을지도 모릅니다.", "secondary": "Q. We had heard opinions expressed by some of the senior Japanese naval officers that,\nprior to the war, they felt that the Japanese navy could only operate successfully for perhaps\na year or perhaps a year and a half. Would you affirm or deny that opinion?\nA. I believe that such was the feeling among high officers, although I know of no changes or\nexpressions of opinion to that effect; each man kept it to himself. I have heard, not directly\nbut through a third person, that Admiral YAMAMOTO expressed as his opinion that \"we can carry\nthrough for one year some way, but after that I don't know.\"\n\nQ. Do you think similarly now?\nA. Yes, I more or less shared the view that while we might do well enough in the early part\nof the war for a year or so, after that it would become extremely difficult.\nIt so happened that for two years prior to the beginning of the war I was Chief of the\nNaval Technical Department at Kenzai Hombu and there was in a position of responsibility\nregarding the Navy's equipment and ships, and I noticed that there was not always unanimity\nof opinion regarding the types to be constructed, regarding specifications of ships,\ndifficulty in material. The principal cause of our difficulty in material was our shortage\nin steel. Our annual supply was about 6,000,000 tons which, as compared with anywhere\nfrom 80,000,000 to 100,000,000 tons annually for your country, was an almost negligible\nquantity, and the difference in our fuel supply wsa even greater. Our fuel supply was\nalmost out of the question as compared with yours, we being able to produce only around\n10% of our annual needs.\nGoing back to shipbuilding, the difference in opinion regarding categories and specifications\narose from the fact that under the WASHINGTON and LONDON treaties we were subject to\nquantitative limitations. Emphasis had been laid upon quantity so that during the time that\nI was head of the Naval Technical Department although we were then no longer under treaty\nrestrictions as to tonnage, the same idea of improving quality remained in the minds of our\nshipbuilding experts, and we used to receive orders from different sections of the Navy for\nships of higher efficiency. I felt at the time that now that we were no longer held down\nby a quantitative ceiling, we should redirect our attention from quality back to quantity and\nto increase the number of ships, because we could see from experiences of the Second European\nWar, which had already started, that one could not expect to keep ships safely for any\nlength of time. In other words, ships were consumption goods and would have to be\nreplaced rapidly to maintain a standard of strength.\n\nQ. You stated that one of the lessons learned at MIDWAY by the Japanese Navy\nwas that too much emphasis had been placed on the organization of the fleet, which organization\ngave too much emphasis on battleships, and that as a result of the MIDWAY battle\na reorganization was made to place increasing emphasis on carriers as the major\neffective weapon of a fleet. Would you give your opinion as to the correctness of such statement?\nA. Yes, that is true, and the reason for the battleship having held the center of the picture\nprior to that was the fact that we had the idea there would be important naval engagements,\nfleet against fleet. But as a result of the MIDWAY engagement, we learned the lesson that\nbattleships as such were not effective weapons unless they had sufficient air support.\nA similar lesson was learned with regard to destroyers and submarines and methods\nof construction of those two types were varied after that.\n\nQ. (General Anderson) In the overall plans for the conduct of this war, what were\nthe basic concepts of the Japanese Navy in the coordinated use, as it expanded its perimeter,\nof land-based aviation to further support and work with mobile surface forces? Was there\na plan in this extension of the perimeter to coordinate land-based aviation with floating aviation\nto increase its effectiveness to defend this perimeter, and did plans envisage coordinating\nland-based aviation in direct supporting cooperation with fleet Task Forces?\nA. Two important naval engagements took place while I was in command of the Combined Fleet\nin which the whole of the Navy's carrier-based planes were thrown in; and while orders had\nbeen that there should be closest cooperation between headquarters land-based air force and\ncarrier-based planes, that cooperation could not be effectively\n--325--\ncarried out owing to the fact that the carrier-based air force was too weak, both in quantity\nand in quality. We didn't have enough carrier-based planes and the pilots were not highly\ntrained; consequently, cooperation never went well.\n\nQ. What I would like to develop and explore is the Japanese naval concept on the matter\nof utilizing land-based aviation and working under a canopy of land-based aviation, to increase\nthe capabilities of the naval forces in their operations working within the ranges and\nthe supporting distances of land-based aviation, thereby gaining an increased strength\nto combat forces coming from the east, from AMERICA, setting up this perimeter of defense?\nA. Yes, such an idea was no doubt in the minds of naval authorities, but failure to utilize\nland-based air forces effectively was attributable principally to weakness of the land-based\nair forces, and as I stated yesterday the weakness of cooperation between the land-based\nair forces and carrier-based air forces was the poor communication between the two.\nOperations in which the two were to cooperate had to be carried out by liaison between the\nrespective headquarters. Our communication system had not developed to a point where there\ncould be communication between the forces at lower levels.\nAs an idea, of course, we wanted to draw your surface units within range of our land-based\nplanes, but we always had difficulty in bringing that about; and the reason, as already stated,\nwas that we didn't have enough aircraft and pilots were not sufficiently trained. By way of\nan example, at the MARIANAS, the First Air Fleet was taken down there, stationed at TINIAN\nIsland in preparation for the coming engagement. It had been trained in JAPAN and rushed\ndown there in a hurry, and just got there when MARIANAS Operation started.\n\nQ. Yesterday I understood you to say in answer to a question that you considered surface forces\nconstituted the greatest threat to the Japanese Navy. What do you consider was the most\neffective weapon that was employed against the Japanese Navy in this war? I'll probably have\nto clarify that by stating, between surface fire and air fire.\nA. By what weapon?\n\nQ. The air weapon or the sea weapon in its effectiveness against the Japanese Navy in attrition.\nA. I think that I would have to divide the war into two periods in answering the question.\nThe first half of the war I believe the submarine constituted the most effective weapon.\n\nQ. Against the Japanese Navy?\nA. Yes; and the latter half of the war that your air force was the most effective weapon.\n\nQ. I want to ask just one other question. In this operation against MIDWAY which I understand\nwas considered as a very decisive one, changing the capabilities of the Japanese Navy,\nwhat was the objective of that operation against MIDWAY? Why, strategically, was that operation\nlaunched?\nA. I don't know what it was and I can't understand what might have been the object of that.\nThat is the reason I pronounce that an utter failure. I think that, this is just a guess on\nmy part, the MIDWAY Operation was undertaken as one step in the tendency which arose as a result\nof the outstanding success of the first operations, to extend this scope of activity in all\ndirections, HAWAII on the east and as far west as CEYLON in the INDIAN OCEAN.\nIf I may be permitted another guess, I think the decision to expand the area of operations\nso widely might be attributed to a feeing on the part of the Japanese authorities at the time\nthat the state of mind under which you fought the war and the state of mind under which we\nfought the war were very different, in that to us this was the war for our very national existence,\nwhereas in your case it was merely a case of national honor or perhaps protection of your\neconomic interests in the Far East; and, because to you the war under such conditions would be\nof relatively slight significance as compared with ours, there might have been a feeling\non the part of our leaders that, should the war continue a little longer, you would lose your\nwill to fight, and with that idea we might have continued spreading the battle line.", "note": "원문 오식을 고치지 않았다 — 'wsa'(was), 'a feeing'(feeling), 'Second European War'(제2차 유럽 전쟁, 곧 제2차 세계대전의 유럽 전쟁을 가리키는 당시 일본식 표현). 'Kenzai Hombu'는 해군 함정본부(艦政本部, Kansei Hombu)의 오기로 보이나 원문 표기를 그대로 두고 병기했다. confidence를 medium으로 낮춘 이유 — 원문 'I know of no changes or expressions of opinion to that effect'의 'changes'는 'exchanges'의 오식으로 보이며, 이 경우 뜻이 「그런 취지의 의견 교환을 알지 못한다」가 된다. 여기서는 원문 낱말을 따라 옮기고 이 주에 밝혀 둔다. 또한 'the whole of the Navy's carrier-based planes were thrown in'이 가리키는 두 해전은 마리아나 해전과 레이테 해전으로 보이나 원문에 명시가 없어 추정하지 않았다.", "warn": true, "search": "Steel and Fuel, the Lesson of Midway, and Land-Based Air Cooperation 豊田副武 도요다 소에무 — 해군대장, 군령부총장(피심문자) 山本五十六 야마모토 이소로쿠(Admiral YAMAMOTO) — 연합함대 사령장관 General Anderson 앤더슨 장군 — USSBS 심문관"}, {"id": "toyoda-10", "order": 10, "date": "1945-11-14", "group": "A", "eyebrow": "도요다 소에무 심문조서 · USSBS Nav-75", "title": "미드웨이의 목적을 끝내 알 수 없다 — 심문의 마지막 문답", "list_right": "문답", "meta": [{"k": "다루는 시점", "v": "1945-11-14"}, {"k": "문서 일자", "v": "1945-11-14"}, {"k": "성격", "v": "문답", "txt": true}, {"k": "원제", "v": "The Strategic Object of the Midway Operation — Closing Exchange", "txt": true}], "summary": "심문관이 미드웨이 점령의 전략적 값어치를 거듭 묻고, 도요다가 그 작전의 목적을 끝내 알 수 없다고 답하며 심문이 끝나는 마지막 대목이다.", "points": ["심문관은 하와이(HAWAII)에서 그리 멀지 않은, 다른 육괴의 지원도 없는 이 섬 하나를 차지하는 것이 안보 강화인지, 전력 증강인지, 추가 진출의 발판인지를 물었다.", "도요다는 미드웨이(MIDWAY)가 후속 작전을 위한 발판으로 계획되었을 가능성은 있다고 하면서도 그것 역시 추측일 뿐이라고 밝혔다.", "안보 강화라는 설명은 성립하기 어렵다고 판단 — 미드웨이가 미국 손에 남아 있어도 일본의 안전에 그리 심각한 위협이 되지 않았고, 그것을 얻는다고 이쪽의 안보감이 반드시 커지지도 않았다는 것.", "도요다는 미드웨이 작전의 목적을 누구와도 논의한 적이 없고 그 작전이 무엇을 위한 것이었는지 들은 적도 없다고 진술하며 심문이 끝난다.", "장 말미에 원 간행물의 목차 표시와 하이퍼워 재단(HyperWar Foundation) 패트릭 클랜시(Patrick Clancey)의 HTML 전사·편집 표기가 붙어 있다 — 원문(轉寫) 출처 표시이며 심문 내용의 일부가 아니다."], "primary": "**문.** 내가 알아보려던 것은 일본 측이 평가한 이 섬 하나를 취하는 일의 전략적 의의, 곧 이점입니다. 하와이(HAWAII)에서 그리 짧은 거리에 있고 다른 육괴의 지원이라고는 전혀 없는 이 섬 하나를 취하는 것이 그들의 안보를 높이는 일이었는지, 전력을 더하는 일이었는지, 아니면 더 나아간 진출을 위한 것, 다시 말해 앞으로의 전진을 위한 디딤돌이었는지 하는 것입니다. 보시다시피 이것은 여기 있는 섬 하나에 지나지 않고, 그것이 안보와든 이후의 공세 작전과든 어떤 중요한 관계를 가지지 않는 한 우리로서는 그 작전을 분석하는 데 다소 어려움이 있습니다.\n\n**답.** 미드웨이(MIDWAY)가 — 이것도 또 하나의 추측입니다만 — 후속 작전을 준비하는 디딤돌로 계획되었을 가능성은 있습니다. 그것은 하나의 가능성입니다. 그러나 우리 안보를 높이는 방편으로 미드웨이를 얻는다는 것은 거의 성립하기 어렵습니다. 미드웨이가 미국 손에 남아 있다 하더라도 그것이 일본의 안전에 그토록 심각한 위협을 이루었다고는 생각하지 않으며, 우리가 그것을 얻는다고 해서 이쪽의 안보감이 반드시 커지는 것도 아니기 때문입니다. 그러므로 나로서는 무엇이 진짜 목적이었을지 알기 어렵습니다. 나는 그 문제를 누구와도 논의한 적이 없고, 그 작전이 무엇을 위한 것이었는지 들은 적도 없습니다.\n\n--326--\n\n목차(Table of Contents)\n\n하이퍼워 재단(HyperWar Foundation) 패트릭 클랜시(Patrick Clancey)가 전사(轉寫)하고 HTML로 편집함", "secondary": "Q. I was trying to get the evaluation on the strategic significance, or the advantage\nto the Japanese as they evaluated the taking of this one lone island so short a distance from\nHAWAII, unsupported by other land masses at all--whether it was one of increasing their security,\nadding to their strength, or for further exploitation, in other words, as a stepping stone\nfor further advance. You see, this is just one island here, and unless it had some significant\nrelationship to either security or to further offensive operations, we have a little difficulty\nanalyzing that operation.\nA. It is possible that MIDWAY, this is just another guess, might have been planned\nas a stepping stone in preparation for subsequent operations, that is a possibility;\nbut as for getting MIDWAY by way of increasing our security, that is hardly possible because\neven with MIDWAY remaining in American hands, I do not believe that it constituted such a\nserious threat to the safety of JAPAN; and the fact that we might get it would not necessarily\nincrease the feeling of security on this side. So it is difficult for me to see what really\nmight have been the object. I have never discussed that question with anybody\nnor have I heard what the operation was for.\n--326--\nTable of Contents\nTranscribed and formatted for HTML by Patrick Clancey, HyperWar Foundation", "note": "이 장은 도요다 심문의 마지막 조각이다. 마지막 두 줄('Table of Contents', 전사자 표기)은 심문 기록의 내용이 아니라 하이퍼워 재단 웹 전사본의 꼬리말이므로, 번역에 남기되 그 성격을 여기에 밝혀 둔다. 심문관 이름이 명시되지 않았으나 앞 장(toyoda-9)의 흐름으로 보아 앤더슨 장군의 미드웨이 관련 질문이 이어진 것으로 보인다 — 원문에 표기가 없어 추정하지 않고 「문」으로만 두었다.", "warn": false, "search": "The Strategic Object of the Midway Operation — Closing Exchange 豊田副武 도요다 소에무 — 해군대장, 군령부총장(피심문자) Patrick Clancey 패트릭 클랜시 — HyperWar Foundation, 원문 전사·HTML 편집자(사료 본문이 아닌 전사 표시)"}]</script>

<script>/* 호버 카드 — 링크에 머물면 그 문서의 요약을 미리 보여 준다.
 *
 *   <a href="cairo-1943/#d309" data-card="cairo-1943:d309">…<\/a>
 *   그리고 HoverCard.init(CARDS) 를 부른다.
 *
 * CARDS 는 { "문서철:문서id": {…} } 꼴이다. 값의 항목은 전부 없어도 된다 —
 * 없는 줄은 통째로 빠진다.
 *
 *   { title, date, route, sum, points: [], pages: 3, badge }
 *
 * 화면 밖으로 나가지 않게 자리를 잡고, 키보드 초점에도 뜬다.
 * 손가락으로 쓰는 기기(hover: none)에서는 CSS 가 카드를 감춘다 — 링크는 그대로다.
 */
window.HoverCard = (function () {
  var DATA = {}, el = null, cur = null, showT = 0, hideT = 0;
  var DELAY = 260, HIDE = 140;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
