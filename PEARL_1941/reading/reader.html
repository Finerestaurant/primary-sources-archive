는 내가 말한 프랑스령 인도차이나의 사태를 알지 못한다고 말하였다. 나는 그가 최근의 전개에 관하여 스스로를 완전히 최신 상태로 만들어 두는 것이 지극히 중요하다고 말하고, 남양국장과 상의해 볼 것을 권하였다. 나는 프랑스인과 중국인의 체포, 사유재산의 압수, 비행장과 병영의 접수, 세관을 접수하겠다는 위협 등 일본 군대의 행동을 거론하였다. 나는, 일본군이 인도차이나에 만들어 놓은 지극히 곤란한 상황에 비추어 볼 때, 미국 정부가 지금 이 시점에 회담이 진전되기를 바라지 않으리라고 상정할 만한 타당한 이유가 있다는 데에 그도 동의하리라고 믿는다는 뜻을 표하였다.\n\n남서태평양에서의 균등대우 원칙 적용에 관한 일본 측 문안이 심각한 장애를 이루는지를 묻는 데라사키 씨의 질문에 답하여, 나는 그가 여러 차례에 걸쳐 나에게 말한 바에 근거할 때, 문제의 그 일본 측 문안은 기회균등 원칙의 적용을 남서태평양에 국한하려는 일본 정부 측의 의사 표시로 받아들여지도록 만들어진 것이 아니라는 것이 나의 의견이라고 말하였다 — 그것은 일본 정부가 현재 그 일부에서 사실상의 지배를 행사하고 있는 지역, 곧 프랑스령 인도차이나에 관한 적극적 의사의 확인으로서 의도된 것이며, 일본이 지배를 행사하고 있는 다른 지역들로부터 그 원칙의 적용을 [669면] 함축적으로 배제하려고 의도된 것은 아니라고 말하였다. 데라사키 씨는 바로 그러하며, 일본 정부의 의도가 분명하게 표현되지 못하였음이 명백하다고 말하였다. 그는 또한 중국에서의 기회균등에 관한 일본 측 설명, 특히 지리적 근접성이 만들어 내는 조건에 대한 언급이, 일본 정부가 특히 주지 않기를 바라던 함의에 열려 있다고 생각하였다.\n\n데라사키 씨는 10월 2일 각서 가운데 중국으로부터의 철병 문제에 대한 언급으로 되돌아갔다. 그는 일본과 중국 사이에 합의가 이루어지기 전에는, 중국에서 군대를 철수함으로써 그러한 철수를 실행할 의사의 증거를 보인다는 것이 일본으로서는 불가능하다고 말하였다. 그렇다면 일본이 미국 정부의 이 요구를 어떻게 충족시킬 수 있겠는가? 나는 문제의 그 구절을 해석하는 체할 수는 없으나, 일본 정부가 중국에서 물러나려는 자기 바람의 진지함을 입증할 수 있는 길이 여럿 있을 수 있다고 말하였다. 예컨대 철병의 시간표를 제시하는 것이 가능할지도 모른다. 또는 일본 정부가, 법과 질서를 유지한다는 특정한 목적을 위하여 내몽골과 화북에 주둔시키겠다고 제안한 일본군의 만족스러운 대체물로서, 아마도 외국 군사전문가의 조력을 받아 중국 정부가 군사경찰대를 창설하는 것을 고려할 용의가 있음을 표명할 수도 있을 것이다.\n\n이 대목에서 데라사키 씨는 외상의 호출을 받았고, 우리의 대화를 끝맺으면서 그는 오늘 아침 자기를 방문하여 나의 견해를 들려준 나의 호의에 사의를 표하였다.\nE[ugene] H. D[ooman]", "secondary": "[Tokyo,] October 9, 1941.\n\nI called this morning on Mr. Terasaki at his request.\n\nMr. Terasaki said that he was very anxious to obtain “off the record” my impressions of the memorandum handed by the Secretary of State to Admiral Nomura on October 2. I said that the Ambassador told me that Mr. Terasaki had already called on the Ambassador and had received the latter’s private and informal observations on the memorandum, and that I did not see that I was in a [668면] position to add anything. Mr. Terasaki then briefly summarized his conversation of last night with the Ambassador, laying special emphasis on the Ambassador’s observations that, in our view, the memorandum was friendly in tone and helpful in substance. He went on to say that he was especially interested in that portion of the memorandum which makes mention of the need for Japan’s manifesting evidence of intention to withdraw its forces from Indochina and China. He pointed out that the paragraph under reference might be open to the interpretation that the American Government expected that Japan should withdraw its forces from the areas mentioned before the proposed meeting of the heads of Government could be held. After remarking that possibly the passage which he had in mind was open to such interpretation, I said that there was obviously another one. The Japanese military forces in Indochina were acting as though they were in permanent occupation of French Indochina and had converted that area into a Japanese colony. It stood to reason that the American Government would hesitate to make the slightest move toward agreeing to the opening of formal negotiations so long as the actions of the Japanese forces in Indochina constitute a complete negation of the spirit and letter of the undertakings which the Japanese Government expresses willingness to assume.\n\nMr. Terasaki said that he was not aware of the situation in French Indochina to which I referred. I told him that it was extremely important that he should bring himself completely up to date on recent developments, and I suggested that he confer with the Director of the South Seas Bureau. I referred to the actions of the Japanese military forces, such as the arrests of French and Chinese nationals, seizure of private property, seizure of air fields and military barracks, threats to seize the Customs, etc. I expressed the belief that he would agree, in view of the extremely difficult position created in Indochina by the Japanese forces, that there was sound reason for assuming that the American Government would not want to have the conversations progress at this time.\n\nIn reply to Mr. Terasaki’s question whether the Japanese formula with regard to the application of the principle of equality of treatment in the southwestern Pacific constituted a serious obstacle, I said that it was my opinion, based on what he had said to me on various occasions, that the Japanese formula under reference was not designed to be taken as an expression of intention on the part of the Japanese Government to confine the application of the principle of equality of opportunity to the southwestern Pacific—that it was intended as an affirmation of a positive intention with regard to an area in part of which the Japanese Government now exercise de facto control, namely, French Indochina, but that it was not intended by [669면] implication to exclude the application of the principle from other areas under which the Japanese exercised control. Mr. Terasaki said that that was precisely the case, and that it was evident that the intentions of the Japanese Government had not been clearly expressed. He thought also that the Japanese explanation with regard to equality of opportunity in China, particularly the reference to conditions created by geographical propinquity, were open to implications the giving of which the Japanese Government had especially desired to avoid.\n\nMr. Terasaki reverted to the reference in the October 2 memorandum to the question of withdrawal of troops from China. He said that it was impossible for Japan to manifest evidence, by withdrawing its troops from China, of intention to effect such withdrawal, until agreement had been reached between Japan and China. How then was it possible for Japan to meet this requirement of the American Government? I said that I could not pretend to interpret the passage under reference, but there could be several ways in which the Japanese Government could demonstrate the sincerity of its desire to evacuate China. It might be possible, for example, to provide a time schedule of withdrawal of troops; or, again, the Japanese Government might indicate willingness to consider the establishment of a military police force by the Chinese Government, possibly with the assistance of foreign military experts, as a satisfactory substitute for the Japanese troops which Japan proposed to station in Inner Mongolia and North China for the specific purpose of maintaining law and order.\n\nMr. Terasaki was summoned at this point by the Foreign Minister, and in bringing our conversation to an end he expressed his appreciation for my courtesy in calling on him this morning and giving him the benefit of my views.\n\nE[ugene] H. D[ooman]", "notes": [], "warn": false, "pages": ["0734", "0735"], "search": "두먼(Eugene H. Dooman) — 주일 미국대사관 참사관, 비망록 작성자 데라사키(寺崎英成, Terasaki) — 일본 외무성 미국국장 그루(Joseph C. Grew) — 주일 미국대사(본문의 「대사」) 헐(Cordell Hull) — 국무장관 노무라(野村吉三郎, Nomura) — 주미 일본대사"}, {"id": "d366", "order": 366, "date": "1941-10-09", "group": "A", "eyebrow": "d366 · Memorandum by the Counselor of Embassy in Japan (Dooman)", "title": "주일대사관 참사관(두먼)의 비망록", "badge": null, "list_right": "문서 366", "meta": [{"k": "일자", "v": "1941-10-09"}, {"k": "시각", "v": "late this afternoon (오늘 늦은 오후)"}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2624", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 366 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d366"}], "summary": "두먼 참사관이 데라사키 미국국장에게 일본군의 통킹 증파(약 5만 명) 정보를 들이대며, 그것이 실행되면 회담이 끝날 것으로 본다고 자기 책임으로 말한다.", "points": ["대사관은 일본 육군이 10월 15일경 프랑스령 인도차이나 통킹에 약 5만 명의 병력을 추가 상륙시키려 준비 중이라는 정보를 입수했다.", "두먼은 대사의 지시에 따라, 그러한 병력 상륙을 허가할 셈이라면 현재의 회담이 심각하게 나쁜 영향을 받을 것으로 예상해야 한다는 그루의 개인적·사적 의견을 외상에게 전해 달라고 요청했다.", "7월의 인도차이나 파병 때문에 양국 정부 간 회담이 중단되었던 일과, 그 회담이 재개된 경위를 상기시켰다.", "두먼은 자기 책임으로, 그 상륙이 실행되면 회담의 종료를 예상하겠다고 말했다.", "데라사키는 눈에 띄게 크게 동요하며 그 일은 전혀 모른다고 했고, 전달받은 내용을 도요다 제독에게 즉시 전하겠다고 말했다."], "primary": "[도쿄,] 1941년 10월 9일.\n\n오늘 늦은 오후 나는 미국국장을 찾아가, 일본 육군이 10월 15일이나 그 무렵에 프랑스령 인도차이나 통킹에 약 5만 명의 병력을 추가로 상륙시키려 준비 중이라는 정보를 대사관이 입수했다고 말했다. 대사의 지시에 따라 나는 데라사키(寺崎英成, Terasaki) 씨에게, 만일 일본 정부가 그러한 병력의 상륙을 허가할 셈이라면 현재의 회담이 [670면] 심각하게 나쁜 영향을 받을 것으로 예상해야 한다는 그루(Joseph Grew) 씨의 개인적이고 사적인 의견을 외상에게 전해 줄 것을 요청했다. 나는 데라사키 씨에게 우리 두 정부 간의 회담이 7월의 일본군 인도차이나 파병 때문에 중단되었던 일을 상기시키고, 그 회담이 재개된 경위를 다시 떠올리게 한 뒤, 나 자신의 책임으로, 제안된 병력 상륙이 실행된다면 나로서는 회담의 종료를 예상하겠다고 말했다. 데라사키 씨는 눈에 띄게 몹시 동요하면서, 그 일에 관해서는 아무것도 아는 바가 없으며 내가 전달한 정보를 도요다(豊田貞次郎, Toyoda) 제독에게 즉시 전하겠다고 말했다.\n\nE[ugene] H. D[ooman]", "secondary": "[Tokyo,] October 9, 1941.\n\nI called upon the Director of the American Bureau late this afternoon and told him that the Embassy was informed that the Japanese military were preparing to land on or about the 15th of October some 50,000 additional troops in Tonking, French Indochina. At the direction of the Ambassador I requested that Mr. Terasaki convey to the Foreign Minister the personal and private opinion of Mr. Grew that the Japanese Government should expect the current conversations [670면] to suffer seriously adverse effects if it is prepared to grant permission for such forces to be landed. Recalling to Mr. Terasaki that the conversations between our two Governments had been suspended because of the despatch of Japanese troops to Indochina in July, and bringing to mind again the circumstances of the renewal of these conversations, I stated on my own responsibility that, were the proposed landing of forces carried out, I should expect a termination of the conversations. Mr. Terasaki, obviously much disturbed, said that he knew nothing about the matter and would immediately convey to Admiral Toyoda the information which I had communicated to him.\n\nE[ugene] H. D[ooman]", "notes": [], "warn": false, "pages": ["0736"], "search": "두먼(Eugene H. Dooman) — 주일대사관 참사관, 비망록 작성자 데라사키(寺崎英成, Terasaki) — 일본 외무성 미국국장 그루(Joseph Grew) — 주일 미국대사 도요다(豊田貞次郎, Toyoda) — 일본 외상, 해군 제독"}, {"id": "d367", "order": 367, "date": "1941-10-09", "group": "A", "eyebrow": "d367 · Memorandum of a Conversation", "title": "회담 비망록", "badge": null, "list_right": "문서 367", "meta": [{"k": "일자", "v": "1941-10-09"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/24064/11", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 367 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d367"}], "summary": "노무라 대사가 헐의 아파트를 찾아와 양국 사이에 남은 세 가지 견해차에 대한 국무장관의 견해를 거듭 청하고, 헐은 원칙의 적용 범위가 좁혀졌다고 지적하며 중국 주둔 문제에 대해 미국의 중남미·남북전쟁 경험을 든다.", "points": ["노무라가 자기 요청으로 국무장관의 아파트를 방문했다. 오바타가 동행했다.", "노무라는 징발된 일본 선박 세 척의 미국 방문 문제에서 미국 정부가 취한 조치에 사의를 표했다.", "노무라는 10월 2일자 미국 성명을 본국에 전달했으며, 남은 견해차에 관한 국무장관의 견해를 얻으라는 훈령을 최근 며칠 사이 세 차례 받았다고 말했다.", "노무라가 세 가지 견해차를 들었다. 유럽 전쟁에 대한 양국의 관계, 중국 일부 지역의 일본군 주둔, 태평양 전역에 대한 무차별 원칙의 적용이다.", "헐은 회담이 일본의 인도차이나 행동으로 중단되기 전까지는 태평양 전역을 포괄하는 평화적 해결의 양해를 논의해 왔다고 지적했다.", "헐은 일본 측 제안이 무차별 원칙을 남서태평양 지역으로 좁히는 것으로 보이며, 중국과의 근접 관계를 이유로 든 원칙 제한의 뜻이 분명하지 않다고 했다.", "헐은 해밀턴과 밸런타인이 대사를 만나 양측 문서의 뜻을 더 밝히도록 하겠다고 제의했다.", "노무라는 일본군 철수 뒤 중국이 혼란에 빠지고 일본의 상업적 기업을 보호할 수 없게 된다고 하며, 국민당과 공산당이 대립하는 중국을 묶어 주는 유일한 것은 일본에 저항하려는 공통의 욕구라고 했다.", "헐은 라틴아메리카 주둔이 악감정만 낳고 불안정을 지속시켰다는 미국의 경험과, 남북전쟁 뒤 북군이 남부 주에 주둔하여 남부에 격심한 원한을 남긴 일을 들었다.", "노무라는 대사가 아니라 개인 자격의 견해라며, 일본은 지금 갈림길에 서 있고 일본 국민의 99퍼센트는 미국과의 분쟁을 원하지 않으나 규율 잡힌 국민이라 명령을 받으면 싸울 것이라고 말했다.", "노무라는 미일 전쟁은 결말이 어떻든 매우 중대한 일이 될 것이라며, 양국 모두 충돌 가능성을 막기 위해 할 수 있는 모든 것을 해야 한다고 했다."], "primary": "[워싱턴,] 1941년 10월 9일.\n\n일본 대사가 자기 요청으로 국무장관의 아파트를 방문했다.[주29] 그는 무엇보다 먼저, 징발된 일본 선박 세 척의 미국 방문 문제에 관하여 미국 정부가 취한 조치에 감사의 뜻을 표하고 싶다고 말했다.\n\n이어 대사는, 10월 2일자 우리 성명을 본국 정부에 전달했다고 말했다. 그는 미국 정부의 입장을 충분히 이해하고 있으나, 우리 두 정부 사이에 아직 견해차가 남아 있는 점들에 관하여 국무장관의 견해 표명을 얻어내라는 훈령을 지난 며칠 사이에 세 차례 받았다고 말했다. 따라서 자신은 본국 정부의 명시적이고 거듭된 훈령에 따라 이 문의를 하고 있다는 것이었다. 대사는 견해차가 있는 점이 세 가지라고 이해하고 있다고 말했는데, 곧 유럽 전쟁에 대한 두 나라의 관계 문제, 중국의 어떤 지역들에 일본군을 주둔시키는 문제, 그리고 태평양 전역에 무차별 원칙을 적용하는 문제였다.\n\n국무장관은, 일본의 인도차이나 행동으로 회담이 중단되기까지 우리 회담에서 우리는 태평양 전역을 포괄하는 평화적 해결에 관한 양해를 이야기해 왔음을 지적하였다. 그는 널리 보편적으로 적용되는 넓은 폭의 계획을 바탕으로 해서만 태평양 지역에 평화와 안정을 세울 수 있으리라고 본다고 하였다. 또 일본 총리는 대통령에게 보낸 성명에서 우리 회담이 바탕으로 삼아 온 [671면] 원칙들에 찬동한다는 뜻을 밝혔는데, 그 뒤에 나온 일본 측 제안은 우리가 보기에 그 원칙들의 적용 범위를 좁히는 것으로 보인다고 하였다. 예컨대 국무장관은, 우리는 국제 통상 관계에서의 무차별 원칙을 태평양 전역에 적용하는 것을 이야기해 왔는데 일본 측 제안은 그것을 남서태평양 지역으로 좁히자는 것으로 보이며, 또 일본이 중국과 인접해 있다는 관계를 이유로 무차별 원칙에 어떤 제한을 두자고 시사한 것이 무슨 뜻인지 분명하지 않다고 지적하였다. 이어 국무장관은, 해밀턴 씨와 밸런타인 씨가 일본 대사를 만나 양측 문서의 어떤 점들을 더 명확히 하고 뜻의 미묘한 결을 드러낼 수 있을지 살펴보게 한다면 기쁘겠다고 말하였다. 국무장관은 그런 다음 해밀턴 씨와 밸런타인 씨가 그에 관하여 자신에게 보고할 것이라고 덧붙였다.\n\n밸런타인 씨는 일본 대사에게, 대사가 편한 때에 언제든 응하겠다고 말했다. (조금 뒤 일본 대사가 밸런타인 씨에게 지금 곧 와 줄 수 있겠는지 묻자 밸런타인 씨는 오늘 오후까지 기다리는 편이 좋겠다고 제안했다. 일본 대사도 그것이 무방한 듯하였고, 오바타 씨는 밸런타인 씨에게 「그러면 나중에 서로 연락합시다」라고 말했다.)\n\n대사는, 일본 총리가 그루 대사에게 국무장관이 언급한 네 가지 원칙에 원칙적으로 개인으로서 찬동한다고 말했다고 하였다. 대사는 중국의 어떤 지역들에 군대를 주둔시키는 문제에 관하여, 이것이 일본 정부에 매우 어려운 문제를 제기한다고 말했다. 일본군이 철수한 뒤 중국에는 혼란한 상태가 만연하리라 예상할 수 있고, 중국에 있는 일본의 상업적 기업을 충분히 보호할 수 없다는 데서 중대한 문제가 생기리라는 것이었다. 대사는 현재 중국 안에는 한쪽에 국민당(Kuomintang)이 있고 다른 한쪽에 공산당이 있어 서로 맞서는 집단들이 있으며, 중국인을 하나로 묶어 주는 유일한 것은 일본에 저항하려는 공통의 욕구라고 덧붙였다.\n\n국무장관은 대사에게, 중국에 일본군을 주둔시킨다는 그러한 제안에 중국 정부가 동의하리라고 보는지 물었다. 대사는 확실한 대답을 하지 않았고, 국무장관은 이어서 중국에서 질서를 유지하는 데 믿고 맡길 만한 훈련된 중국 군대가 충분히 있다고 볼 수는 없겠는지 물었다. 국무장관은, 우리나라의 경험에 비추어 보면 라틴아메리카 나라들에 군대를 두는 것은 악감정만 불러일으키고 불안정한 상태를 지속시킬 뿐이었음을 알게 되었다고 지적하였다. [672면] 이런 까닭에 그는, 처음에는 얼마간의 손실과 희생을 감수해야 할지라도 길게 보면 얻는 것이 그것을 정당화하리라고 본다고 하였다. 국무장관은 남북전쟁 뒤 북군이 남부의 여러 주에 주둔했던 상황과, 그 군대의 주둔이 남부에 불러일으킨 쓰라린 원한을 언급하였다. 대사는 국무장관의 말이 옳다고 개인적으로 믿는다는 뜻을 나타냈다.\n\n이어 대사는, 이제 국무장관에게 하려는 말은 일본 대사로서 하는 말이 아니라 자신의 개인적 견해를 은밀히 밝히는 것이라고 말했다. 그는 이 나라에서 아주 많은 사람들과 이야기를 나누어 보았는데, 공화당 지도자들을 포함하여 그들 모두가 국무장관의 완전한 성실성에 대해서는 뜻을 같이한다고 말했다. 국무장관은, 대사가 하고 싶은 말은 무엇이든 거리낌 없이 해 주기 바라며, 자신 쪽에서도 대사에게는 언제나 완전히 신뢰하는 마음으로 솔직하게 이야기할 수 있다고 느껴 왔다고 말했다. 그러자 대사는, 일본은 지금 갈림길에 서 있으며 일본 정부는 매우 어려운 처지에 있다고 말했다. 그는 일본 국민의 99퍼센트가 미국과의 분쟁을 원하지 않는 것은 전적으로 사실이나, 그들은 규율 잡힌 국민이어서 명령을 받으면 싸울 것이라고 말했다. 대사는 일본에는 양국 관계에 말썽을 일으키려 하는 선동자들이 있으며, 그들은 아마도 다른 나라들로부터 자금 지원을 받고 있을 것이라고 말했다. 이어 대사는, 미국과 일본 사이의 전쟁은 최종적인 결말이 어떠하든 매우 중대한 일이 될 것이며, 대통령도 해군부에서의 오랜 경험에서 그것을 충분히 알고 있으리라는 데 의심이 없다고 지적하였다. 따라서 대사는 일본의 관점에서 보나 미국의 관점에서 보나, 두 나라 사이에 충돌이 일어날 가능성을 막기 위하여 양쪽 모두가 할 수 있는 모든 일을 하여야 한다고 생각한다고 하였다. 국무장관은 대사가 자신의 견해를 거리낌 없이 밝혀 준 데 대하여 감사하였다.\n\n[Joseph W.] Ballantine", "secondary": "[Washington,] October 9, 1941.\n\nThe Japanese Ambassador called at his request at the Secretary’s apartment. [주29] He said first of all he wished to express his appreciation of the action of this Government in regard to the matter of the visit to the United States of three requisitioned Japanese ships.\n\nThe Ambassador then went on to say that he had communicated to his Government our statement of October 2. He said that while he thoroughly understood the position of this Government he had been instructed three times during the last few days to obtain from the Secretary an expression of the Secretary’s views in regard to the points on which there remains a divergence of view between our two Governments. He was, therefore, making this inquiry at the express and repeated instruction of his Government. The Ambassador said that he understood there were three points of divergence, namely: the question of the relation of the two countries to the European war; the question of the stationing of Japanese troops in certain areas of China; and the question of application of the principle of non-discrimination to the entire Pacific area.\n\nThe Secretary pointed out that during our conversations up to the time that the conversations were interrupted by Japan’s action in Indochina, we had been talking about an understanding in regard to a peaceful settlement covering the entire Pacific area; that he felt that only on the basis of a broad-gauge program of universal application could we expect to establish peace and stability in the Pacific area; that the Japanese Prime Minister, in his statement to the President, had indicated that he subscribed to the principles upon [671면] which our conversations have been based; and that then came the Japanese proposals which appeared to us to narrow down the application of these principles. For example, the Secretary noted that we had talked about the application to the entire Pacific area of the principle of non-discrimination in international commercial relations, whereas the Japanese proposal seemed to call for narrowing it down to the southwest Pacific area, and that it was not clear what the Japanese meant when they suggested some limitation of the principle of non-discrimination on account of Japan’s relations of propinquity to China. The Secretary then went on to say that he would be glad to have Mr. Hamilton and Mr. Ballantine see the Japanese Ambassador in an endeavor to see whether any points in our respective documents could be further clarified and shades of meaning brought out. The Secretary added that Mr. Hamilton and Mr. Ballantine would then report to the Secretary thereon.\n\nMr. Ballantine said to the Japanese Ambassador that we would be glad to be at his disposal at his convenience. (A little later on the Japanese Ambassador asked Mr. Ballantine whether we could come right away and Mr. Ballantine suggested that it might be better to wait until this afternoon. That seemed agreeable to the Japanese Ambassador, and Mr. Obata said to Mr. Ballantine, “Then we will get in touch with each other later.”)\n\nThe Ambassador said that the Japanese Prime Minister had told Ambassador Grew that the Prime Minister personally subscribed in principle to the four principles to which the Secretary had referred. The Ambassador said, with regard to the question of stationing troops in certain areas of China, that this presented to the Japanese Government a very difficult question; that chaotic conditions might be expected to prevail in China following the withdrawal of Japanese troops and a serious question would be presented by the lack of adequate protection for Japanese commercial enterprise in China. The Ambassador added that at the present time there were conflicting groups within China with the Kuomintang on one side and the Communists on another and that the only thing that was holding the Chinese together was a common desire to resist Japan.\n\nThe Secretary asked the Ambassador whether he thought the Chinese Government would agree to such a proposal as that of stationing Japanese troops in China. The Ambassador made no definite reply and the Secretary went on to ask whether the Ambassador did not think it possible that there were sufficient number of trained Chinese troops who could be counted upon to maintain order in China. The Secretary pointed out that according to the experience of this country we had found maintenance of troops in Latin American countries only aroused ill will and perpetuated a situation of instability. [672면] For this reason he felt that, even though some losses and sacrifices might have to be faced at the outset, in the long run the gains would justify them. The Secretary referred to the situation in the South after the Civil War when northern troops were stationed in southern states and to the bitter resentment aroused in the South by the presence of these troops. The Ambassador indicated his personal belief in the soundness of what the Secretary said.\n\nThe Ambassador then said that what he wished now to say to the Secretary was not as coming from the Japanese Ambassador but as expressing in confidence his own personal views. He said that he had talked with a great many people in this country and all of them, including Republican leaders, agreed as to the complete integrity of the Secretary. The Secretary said that he hoped that the Ambassador would feel free to say anything that he might wish to say and that the Secretary, for his part, had always felt that he could talk in complete confidence and with frankness to the Ambassador. The Ambassador then said that Japan was now at the crossroads and the Japanese Government was in a very difficult position. He remarked that it was quite true that 99 per cent of the Japanese people did not want trouble with the United States but that they were a disciplined people and would fight if commanded to do so. The Ambassador said that there were agitators in Japan who were trying to cause trouble in our relations and they were probably being assisted with funds from other countries. The Ambassador then pointed out that war between the United States and Japan, whatever might be the final outcome, would be a very serious undertaking, as undoubtedly the President, from his long experience in the Navy Department, fully realized. The Ambassador, therefore, felt that both from the point of view of Japan and of the United States everything possible should be done by both sides to avert the possibility of a conflict between the two countries. The Secretary thanked the Ambassador for having expressed his views freely.\n\n[Joseph W.] Ballantine", "notes": ["[주29] 오바타(小畑) 씨가 대사를 수행했다."], "warn": false, "pages": ["0737", "0738"], "search": "노무라(野村吉三郎, Nomura) — 주미 일본대사 헐(Cordell Hull) — 국무장관 밸런타인(Joseph W. Ballantine) — 비망록 작성자 해밀턴(Maxwell M. Hamilton) 오바타(小畑, Obata) — 일본대사관원 고노에(近衞文麿, Konoye) — 일본 총리 (본문에 직위로만 등장) 그루(Joseph Grew) — 주일 미국대사 루스벨트(Franklin D. Roosevelt) — 대통령 (본문에 직위로만 등장)"}, {"id": "d368", "order": 368, "date": "1941-10-09", "group": "A", "eyebrow": "d368 · Memorandum of a Conversation", "title": "회담 비망록", "badge": null, "list_right": "문서 368", "meta": [{"k": "일자", "v": "1941-10-09"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "11.94/24065/11", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 368 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d368"}], "summary": "해밀턴·밸런타인·슈미트가 일본대사관을 찾아, 9월 25일 일본 측 제안의 어디가 문제인지 조목조목 밝혀 달라는 일본 측 요구와, 10월 2일 문서와 기본 원칙으로 돌아가자는 미국 측 태도가 두 시간 가까이 맞선다.", "points": ["국무장관의 제안으로 마련된 회담이다. 해밀턴·밸런타인·슈미트가 일본대사관을 방문했다. 와카스기·오쿠무라·마쓰다이라·오바타도 동석했다.", "일본 측은 본국 훈령에 따라, 9월 25일 일본 측 제안(6월 21일 미국 문서의 재기초안)의 어느 대목 어느 점이 미국 정부에게 반대할 만하고 불만스럽고 수락할 수 없는지를 조목조목 짚어 달라고 요구했다.", "미국 측은 오늘 대사관에 온 것은 일본 측이 10월 2일 문서를 함께 검토하기를 바라리라 예상했기 때문이라고 답하고, 오랫동안 주장해 온 기본 원칙들을 새로이 고려하는 것이 도움이 되리라는 그 문서의 취지를 되풀이했다.", "일본 측은 총리가 국무장관의 네 가지 기본 원칙을 「원칙적으로」 수락했으므로 원칙에서는 합의가 있다고 주장했다. 대사는 이 점을 회담 중 여러 차례 꺼냈다.", "노무라는 몇 주 전 대통령과 만났을 때 미해결 쟁점을 셋으로 꼽았다고 했다. (1) 삼국동맹과 양도할 수 없는 자위권, (2) 국제 통상에서의 무차별 원칙 적용, (3) 중국 영토 내 일본군 주둔.", "노무라는 그 가운데 하나만이 특별한 어려움을 낳을 것이며, 고노에가 대통령과의 회담에서 중국 주둔 문제를 풀 어떤 문안을 제시할 수 있으리라 믿는다고 하면서, 회담 이전에 그런 문안을 만들어 내기는 총리로서 매우 어려우리라고 넌지시 말했다.", "미국 측은 7월 회담 중단 이후 일본 북방 지역과 프랑스령 인도차이나 등에서 새로운 사태가 생겨 새 문제들이 실제로 발생했다고 지적했고, 대사는 그래서 시베리아·대러 태도·인도차이나 활동 문제가 더해진 것으로 이해한다고 했다.", "미국 측은 그보다 더 일반적이고 근본적인 문제, 곧 태평양 전역의 평화 문제가 있다고 짚었다.", "노무라는 일본 정부가 삼국동맹상의 의무를 독자적으로 해석하겠다는 약속을 할 용의를 표시해 왔으며, 태평양 평화에 대한 근본적 바람이 있는 이상 그 약속의 함의는 분명하다고 말했다.", "일본 측은 미국이 내세운 원칙들은 십계명이나 다른 도덕률처럼 「본래적으로 선한」 것이나, 실제 문제에 적용할 때는 조정을 논의할 필요가 있는 경우가 있다고 여러 차례 지적했다.", "노무라는 자기가 참석했던 베르사유 회의와 윌슨의 14개조를 거론하며, 양쪽이 차이를 극복할 마음만 있다면 넘지 못할 어려움은 없다고 말하고, 9월 6일 일본 측 제안에서 「4원칙」과 모순되는 대목을 스스로 발견했다고 덧붙였다.", "노무라는 4년의 전쟁 희생에 대해 일본 국민에게 어떤 보상이나 매력적인 대안적 이득을 제시해야 한다고 했고, 미국 측은 일본이 태평양 전역의 진보적·건설적 평화 계획을 따르는 편이 다른 어떤 길보다 얻는 것이 많다고 답했다.", "회담을 끝맺으며 노무라는 일본어로 참모들에게, 미국 정부가 구체적 반대 제안을 내놓지 않았으며 일본 정부가 제안을 다시 기초하든가 기본 원칙을 추가로 고려하여 새 문서를 준비할 수 있을 것 같다는 취지의 보고를 도쿄에 보내라고 지시했다.", "일본 측은 미국이 9월 6일 제안이나 9월 25일 재기초안을 조목조목 다루기를 피한 데 실망한 듯 보였으나, 10월 2일 문서와 「새로이 고려한다」는 제안의 취지를 이제 더 분명히 이해하게 되었다고 밝혔다."], "primary": "[워싱턴,] 1941년 10월 9일.\n\n일본대사가 제기한 질문들에 응하여 국무장관의 제안으로 그날 앞서 마련된 약속에 따라, 해밀턴(Maxwell M. Hamilton) 씨, 밸런타인(Joseph W. Ballantine) 씨, 슈미트(Max W. Schmidt) 씨가 일본대사 [주30]를 방문하였다.\n\n[673면]\n\n일본 측은 대화를 열면서, 일본 정부로부터 그렇게 하도록 훈령받은 대로, 9월 25일에 행해진 일본 측 제안(6월 21일 우리가 일본 측에 건넨 문서의 재기초안)이 어느 대목에서 그리고 어떤 점들에서 미국 정부에게 반대할 만하고 불만스러우며 수락할 수 없는 것인지를 묻고자 한다고 진술하였다. 그들은 그 제안들을 조목조목 훑어 나가기를 바랐다.\n\n이 서두에 이어, 그리고 대화 중에 다시 뒤에서도, 우리는 오늘 일본대사관에 오면서 그들이 10월 2일자 우리 문서를 함께 훑어보기를 바라리라고 예상하였으며 그리하여 그 문서 가운데 그들에게 온전히 분명하지 않은 점들을 우리가 밝히고 부연할 수 있게 되기를 기대하였다고 진술하였다. 우리는, 10월 2일자 문서에서, 미국 정부가 오랫동안 주창하여 온 기본 원칙들을 새로이 고려하는 것이 본질적인 문제들에 관하여 뜻이 맞는 자리를 찾으려는 우리의 노력에 도움이 되리라고 우리가 믿는다는 점이 지적되어 있었다고 덧붙였다. 우리는 지금도 그렇게 믿고 있으며, 10월 2일자 문서가 그에 앞선 문서들 및 미국 정부 관리들의 진술과 더불어 일본 정부에게 우리 생각의 분명한 윤곽을 주리라고 여긴다고 말하였다. 우리는 또한 10월 2일자 문서에, 9월 6일 및 그 뒤의 날짜에 행해진 일본 측 제안과 설명이 우리가 논의하여 온 넓은 시야의 원칙들과 우리가 일본 정부로부터 받은 일반적 확언들을 좁히고 제약하는 구실을 한다고 우리가 느낀 사례의 몇 가지 예가 제시되어 있다고 말하였다.\n\n일본 측은 총리가 국무장관이 여러 차례에 걸쳐 열거한 네 가지 기본 원칙을 「원칙적으로」 수락하였다고 진술하였다. (일본대사는 대화 중에 이 점을 여러 차례 꺼냈다.) 그들은 따라서 원칙에 관하여는 우리 사이에 합의가 있으며 일본 정부는 그 원칙들을 「원칙적으로」 수락한다고 주장하였다. 다만 일본 정부가 가능하다면 미국 정부의 희망에 부응하는 문제를 고려할 수 있도록, 미국 정부가 일본 측 제안의 어느 대목에서 반대할 바를 찾아내었는지를 확정하는 것이 바람직하다고 하였다.\n\n문제에 대한 이와 똑같은 접근이 거의 두 시간에 걸친 대화 내내 일본 측에 의하여 여러 번 되풀이되었다. 그때마다 우리는 이에 답하여, 기본 원칙과 일반적 확언에 관하여서뿐만 아니라 그 원칙과 확언을 실제로 적용함에 있어 따라야 할 계획과 정책에 관한 우리의 관념에 관하여서도 각 정부가 무엇을 염두에 두고 있는지에 대한 상호 이해에 이르도록 노력함으로써, 어떠한 합의에 대해서든 또 국가 수반 사이의 어떠한 회담에 대해서든 확고한 기초를 놓는 것이 일반적으로 바람직하다는 점을 지적하고자 하였다. 우리는 논의에서 가능한 한 10월 2일자 문서가 우리 정부의 [674면] 생각을 담고 있음을 가리키고자 하였고, 가능한 곳에서는 그 문서의 표현을 그대로 썼다. 우리는, 일본 정부가 스스로 자기의 최근 제안들을 앞서 언급한 기본 원칙들과 일본 총리 및 일본 정부가 이미 준 일반적 확언들에 비추어 다시 훑어보는 것이 일본 정부의 견지에서 바람직할 수 있겠다고 제언하였다. 우리는 태평양 문제의 폭넓은 전반적 해결을 구하는 우리 정부의 바람을 밝혔다. 대화 중 기회가 생길 때마다 우리는 몇 차례에 걸쳐 우리가 나누어 온 이전의 논의들, 일본 측과 교환한 문서들, 그리고 비공식 예비 회담에서 우리가 짚은 요점들을 언급하였다. 우리는 일본 정부가 그러한 문서와 진술과 회담을 되짚어 본다면 미국 정부의 입장을 분명하게 이해하고 그려 볼 수 있으리라고 믿는다고 진술하였다. 우리는 국무장관이 일본대사에게, 다른 나라들과의 관계에서의 기본 원칙에 관한 미국 정부의 입장은 그 관계의 기록에 분명히 그려져 있으며, 우리는 처음부터 아무것도 감추어 두지 않고 우리 입장을 그 원칙들 위에 똑바로 놓아 왔다고 알린 바 있음을 지적하였다.\n\n일본대사는, 몇 주 전 대통령과 이야기하였을 때 자기(대사)가 비공식 회담에서 전개된 대로 미국 정부와 일본 정부 사이에 미해결로 남아 있는 차이가 세 가지 있다는 자기 이해를 표명하였다고 진술하였다. 대사의 말에 따르면 그 세 가지 점은 그가 대통령과 국무장관에게 다음과 같이 열거한 것이었다. (1) 삼국동맹과 양도할 수 없는 자위권의 문제, (2) 국제 통상 사무에서의 무차별 원칙 적용의 문제, (3) 중국 영토 내 일본군 주둔의 문제. 대사는 그 문제들 가운데 아마도 오직 하나만이 특별한 어려움을 낳으리라는 취지의 자기 개인의 의견을 대통령에게 표명하였다고 말하였다. 그는 이어서, 고노에 공작이 대통령과의 회담에서 중국 내 일본군 주둔이라는 어려운 문제를 풀어 낼 어떤 문안을 제시할 수 있으리라 믿는다고 말하였다. 그는 그러한 회담에 앞서 그러한 문안을 만들어 내는 일이 총리로서는 지극히 어려우리라는 것을 넌지시 내비쳤다. 대사는 이어서, 대통령과의 회담 당시 국무장관이 노무라 대사가 열거한 세 가지 문제 외에 어떤 표현상의 문제들과 문서(6월 21일자 우리 초안)를 현재에 맞게 고치는 문제가 있음을 지적하였다고 말하였다.\n\n우리는 일본 측에게, 7월에 회담이 중단된 뒤로 일본 북방의 지역들뿐만 아니라 [675면] 프랑스령 인도차이나와 그 밖의 지역들에 관하여 세계에 어떤 조건들과 상황들이 전개되었으며 따라서 어떤 새로운 문제들이 실제로 생겨났다고 지적하였다. 그러나 우리는, 국무장관이 문서를 현재에 맞게 고치고 표현상의 어떤 변경을 가하는 것이 바람직하다고 언급하였을 때, 국무장관은 이렇게 생겨난 새로운 상황들에 더하여, 9월 10일 우리가 일본 측에 제안된 양해의 제5절 재기초안을 주었을 때 우리가 제언한 것과 같은 변경만을 염두에 두고 있었다고 믿는다는 뜻을 표하였다. 우리가 믿기로 그 재기초안은 문서의 취지를 넓히는 구실을 하였으며 일본에게 유리한 것이었다. 우리는, 6월 21일자 초안에서 잠정적으로 합의되었던 문제들에 대한 미국 정부의 태도에는 실질적인 변화가 없었다고 우리가 믿는다는 점을 지적하였다.\n\n이어 대사는, 우리가 말한 바로부터, 미해결로 남아 있는 세 가지 문제 외에 시베리아 문제와 러시아에 대한 일본의 태도 및 인도차이나에서의 일본의 활동이라는 문제가 생겨났다고 이해한다고 진술하였다.\n\n우리는 그 밖에도 태평양 전역의 평화라는 더 일반적이고 근본적인 문제가 있다고 지적하였다. 우리는 9월 6일자 일본 측 제안을 받았을 때의 국무장관의 최초 반응을 다시 언급하고, 그 제안들과 그 뒤 우리가 받은 설명들을 검토하면 할수록 그 제안과 그에 이은 설명들이 우리가 염두에 두어 온 넓은 시야의 원칙들과 일반적 확언들을 좁히고 제약한다는 우리의 느낌이 더욱 강해졌다고 덧붙였다.\n\n대사는 잠시 이야기를 옆으로 돌려 삼국동맹에 대한 일본의 태도를 말하였다. 그는 일본 정부가 근본적으로 태평양의 평화를 바라고 있다고 말하였다. 일본 정부는 삼국동맹상의 의무를 독자적으로 해석하겠다는 약속을 줄 용의가 있음을 표시하여 왔으며, 대사는 일본 정부가 태평양의 평화에 대한 이러한 근본적 바람을 가지고 있는 이상 그 약속에 담긴 함의는 분명하다고 시사하였다.\n\n일본 측은, 대화 중 여러 차례 그리하였듯이, 만약 일본 정부가 미해결 문제들에 관하여 미국 정부의 입장에 부응하였는데 그러고 나서 미국이 새로운 문제들을 제기한다면 일본 정부가 놓이게 될 곤란한 처지를 지적하였다. 그들은 몇 차례에 걸쳐, 우리가 개괄한 원칙들은 십계명이나 그 밖의 도덕률과 마찬가지로 「본래적으로 선한」 것이며 그 건전함은 반박될 수 없다고 지적하였다. 다만 실제의 문제로서, 그 원칙들을 구체적인 문제들에 실제로 적용함에 있어 조정의 문제를 논의할 필요가 있는 경우들이 있다는 것이었다.\n\n[676면]\n\n대사는 자기가 참석하였다고 말한 베르사유 회의와 윌슨(Woodrow Wilson) 대통령의 14개조 제안을 언급하면서, 그 제안이 반년에 걸친 논의로 이어졌다고 말하였다. 대사는 만약 양쪽이 차이를 극복할 마음을 가지고 있다면 현재의 상황에 넘지 못할 어려움은 없다는 의견을 표하였다. 그는 자기 자신도 9월 6일자 일본 측 제안에서 「4원칙」과 어긋나는 대목 몇 가지를 알아차렸다고 덧붙이고, 만약 그 제안들을 다시 검토한다면 추가 논의를 요하는 새로운 점들이 생겨날 가능성이 있는지를 물었다. 그는 미국 정부의 입장을 도쿄에 정확히 알릴 필요가 있음을 강조하였다.\n\n일본 국민이 4년에 걸친 전쟁의 희생을 겪어 왔음을 언급하면서, 대사는 자기 정부가 그 희생에 대한 어떤 보상이나 어떤 매력적인 대안적 이득을 필연적으로 일본 국민에게 제시하지 않으면 안 될 것이라고 말하였다. 우리는, 우리가 일본 측에 자주 말하여 온 대로, 우리의 경험에 비추어 볼 때 일본은 태평양 전역에서 진보적이고 건설적인 평화의 계획을 따름으로써 다른 어떤 길에 의해서보다도 더 많은 것을 얻게 되리라고 믿는다고 답하였다. 우리는 우리의 바람이 앞날의 안정을 위하여 쌓아 올리는 데 있다고 언급하였다. 우리는 일본 정부가 무엇을 하여야 하고 무엇을 하여서는 안 되는지를 일러 주려 하였다는 비판을 받을 수 있는 처지에 놓이는 것을 피하고자 애써 왔다고 말하였다.\n\n우리는 각 문제를 조목조목 다루자는 일본 측의 제언이 상황을 다루는 한 가지 방법일 수 있다는 데에 동의하였다. 그러나 우리는, 일본 측이 국내 정치의 어려운 문제들을 강조한 것과 꼭 마찬가지로 우리도 이 나라에서 비슷하게 어려운 문제들에 부딪혀 있다고 지적하였다. 우리는 일본 측 자신이 세목의 미로에 빠져 헤매는 것을 피하는 것이 바람직하다고 제언한 바 있음을 언급하였고, 일본 외상이 그루 대사에게 자기가 10월 2일자 문서를 검토하고 있으며 나중에 그 문서에 관한 소견을 말하겠다고 알렸다는 사실을 이야기하였다. 우리는 다른 한편으로, 이 문제에 접근하는 또 하나의 방법 — 세목과 지엽의 미로에 빠져 헤매는 것을 피하고 기본 원칙으로 돌아가는 데 도움이 될 수 있는 방법 — 은 10월 2일자 문서를 집어 들고 미국 정부가 행한 다른 진술들 및 국무장관이 대사와 나눈 대화들에 비추어 그것을 검토하는 것일 수 있다고 지적하였다. 우리는 태평양의 평화라는 근본 문제 위에 선 태평양 문제의 넓은 시야의 전반적 해결을 이루고자 하는 미국 정부의 바람을 다시 한 번 지적하였다.\n\n대사는 우리가 그에게 준 6월 21일자 초안에 관하여 자기 정부로부터 어떤 훈령을 받았으나 회담의 중단으로 말미암아 그 훈령에 근거한 문서를 전달할 수 없었다고 언급하였다. [677면] 대사는 미해결의 문제들과 차이들에 관한 미국 정부의 견해에 대하여 구체적인 정보를 얻고 싶다는 바람을 다시 표하였다. 우리는 10월 2일자 문서에 표명된 미국 정부의 입장을 한 번 더 훑고, 우리가 믿기로 미국 정부의 견해가 널리 개진되어 있는 이전의 교환 문서들과 대화들을 언급하였다.\n\n대화를 끝맺으면서 일본대사는 자기 참모들에게 일본어로, 미국 정부가 내놓을 구체적인 반대 제안을 가지고 있지 않으며 일본 정부로서는 자기 제안을 다시 기초하든가 아니면 우리가 논의한 기본 원칙들을 추가로 고려한 바탕 위에서 새로운 문서를 준비할 수 있을 것으로 보인다는 취지의 보고를 도쿄에 보내야 한다고 제언하였다.\n\n일본 측은 우리가 9월 6일자 그들의 제안이나 9월 25일 그루 대사에게 건네진 제안 협정의 재기초안을 조목조목 다루는 것을 피한 데 대하여 실망한 듯이 보였다. 그러나 일본 측은 우리의 논의에 사의를 표하고, 미국 정부가 10월 2일자 문서에서 그리고 기본 원칙들을 「새로이 고려」하는 것이 도움이 될 수 있다는 그 제언에서 무엇을 염두에 두고 있었는지를 이제 더 분명하게 이해하게 되었다고 밝혔다. 우리는 언제든지 대사와 그 동료들을 만날 용의가 있으며 우리가 할 수 있는 어떤 방식으로든 도움이 될 용의가 있음을 표하였다.\n\n앞의 대화 전체를 통하여 우리는 기본 원칙과 정책에 관한 우리의 견해를 개진하였는데, 여기에는 태평양 지역 전역에 걸친 기회균등 원칙의 적용에 관한 것과 한 나라의 군대를 다른 나라의 영토에 주둔시키는 것에 관한 것이 포함된다.\n\n[Max W.] Schmidt", "secondary": "[Washington,] October 9, 1941.\n\nMr. Hamilton, Mr. Ballantine and Mr. Schmidt called on the Japanese Ambassador [주30] conformably with an arrangement made earlier in the day at the suggestion of the Secretary in response to questions which had been raised by the Japanese Ambassador.\n\n[673면]\n\nThe Japanese opened the conversation by stating that they desired to inquire, as they had been instructed by the Japanese Government to do, wherein and on what points the Japanese proposals made on September 25 (a redraft of our document given the Japanese on June 21) were objectionable, unsatisfactory or unacceptable to this Government. They desired to go over the proposals point by point.\n\nFollowing this introduction and again later in the conversation, we stated that in coming to the Japanese Embassy today we had expected that they would wish to go over our October 2 document in order that we might be able to clarify and elaborate any points in that document which were not entirely clear to them. We added that in the document of October 2 it was pointed out that we believed that renewed consideration of the fundamental principles long advocated by this Government might prove helpful in our effort to find a meeting of minds on essential questions. We remarked that we were still of that belief and that we felt the October 2 document along with previous documents and statements by officers of the American Government should give the Japanese Government a clear outline of our thoughts. There were given, we said, in the document of October 2, some examples of instances wherein we felt the Japanese proposals and explanations of September 6 and subsequent dates served to narrow and to restrict the broad-gauge principles we had been discussing and the general assurances we had received from the Japanese Government.\n\nThe Japanese stated that the Prime Minister had accepted “in principle” the four fundamental principles which had been enumerated on several occasions by the Secretary. (The Japanese Ambassador brought out this point several times during the conversation.) They maintained that we were therefore in agreement on principles, and that the Japanese Government accepted those principles “in principle”; but that it was desirable to determine wherein the American Government found objection to the Japanese proposals in order that the Japanese Government could consider the question of meeting, if possible, the desires of the American Government.\n\nThis same approach to the problem was repeated by the Japanese numerous times throughout the conversation lasting almost two hours. On each occasion we endeavored in reply to point out the general desirability of laying a firm foundation for any agreement or meeting between heads of state by trying to reach a mutual understanding of what each Government has in mind as relating not only to fundamental principles and general assurances but also as to our concepts of the program and policies to be followed in the practical application of those principles and assurances. We tried in our discussion in so far as possible to point to the October 2 document as embodying the [674면] thoughts of our Government, and wherever possible we employed the language of that document. We suggested that it might be desirable from the viewpoint of the Japanese Government for that Government itself to go over its recent proposals in the light of the fundamental principles referred to and the general assurances already given by the Japanese Premier and the Japanese Government. We brought out the desire of our Government to seek a broad general settlement of Pacific problems. On several occasions as opportunity arose in the conversation we referred to previous discussions which we had had, documents which we had exchanged with the Japanese and points which we had made in the informal exploratory conversations. We stated that we believed the Japanese Government, by reviewing those documents, statements and conversations would be able clearly to understand and to visualize the position of this Government. We pointed out that the Secretary had informed the Japanese Ambassador that the position of this Government in regard to the fundamental principles in its relations with other nations was clearly portrayed in the record of those relations, and that we had not from the first held anything back, but had placed our position squarely on those principles.\n\nThe Japanese Ambassador stated that when he had talked with the President some weeks ago he (the Ambassador) had expressed his understanding that there were outstanding three points of difference between the American and Japanese Governments as developed in the informal conversations. Those points were, the Ambassador said, enumerated by him to the President and the Secretary as: (1) The question of the Tripartite Pact and the inalienable right of self-defense; (2) the question of the application of the principle of nondiscrimination in international commercial affairs; and (3) the question of the stationing of Japanese troops in Chinese territory. The Ambassador said that he had expressed his own personal opinion to the President to the effect that only one of those questions would probably present especial difficulty. He went on to say that he believed that Prince Konoye would be able to present some formula in a meeting with the President which would solve the difficult question of the stationing of Japanese troops in China. He suggested indirectly that the Prime Minister would find it most difficult to evolve such a formula prior to such a meeting. The Ambassador went on to say that the Secretary of State had pointed out at the time of the meeting with the President that in addition to the three questions which Ambassador Nomura had enumerated there were certain problems of phraseology and the question of bringing the document (our draft of June 21) up to date.\n\nWe pointed out to the Japanese that following the interruption of the conversations in July there had developed certain conditions and [675면] situations in the world with respect to areas north of Japan as well as French Indochina and other areas and that therefore certain new questions had in fact arisen. We expressed the belief, however, that when the Secretary had mentioned the desirability of bringing the document up to date and of making certain changes in phraseology, the Secretary merely had in mind, in addition to these new situations which had arisen, such changes as we had suggested on September 10 when we gave them a redraft of Section V of the proposed understanding. This redraft, we believed, served to broaden the purport of the document and was to the advantage of Japan. We pointed out that in our belief there had been no substantial change in the attitude of this Government toward questions which had been tentatively agreed upon in the draft of June 21.\n\nThe Ambassador then stated that he understood from what we had said that in addition to the three questions which remained outstanding there had arisen the question of Siberia and the Japanese attitude toward Russia and Japanese activities in Indochina.\n\nWe pointed out that there was also the more general and fundamental question of peace in the entire Pacific area. We referred again to the initial reaction of the Secretary upon receiving the Japanese proposals of September 6 and added that the more we studied those proposals and subsequent explanations which we had received, the stronger our feeling became that those proposals and subsequent explanations narrowed and restricted the broad-gauge principles and general assurances which we had had in mind.\n\nThe Ambassador digressed for a moment and spoke of the attitude of Japan toward the Tripartite Pact. He said that the Japanese Government fundamentally desires peace in the Pacific. The Japanese Government has indicated its willingness to give a commitment that it will independently interpret the obligations of the Tripartite Pact, and the Ambassador suggested that as the Japanese Government has this fundamental desire for peace in the Pacific the implication in that commitment is clear.\n\nThe Japanese, as they did several times during the conversation, pointed out the difficult position in which the Japanese Government will be placed, if it were to meet the position of the American Government on the outstanding questions and then the United States were to raise new questions. They pointed out on several occasions that the principles which we had outlined were “inherently good”, as were the Ten Commandments and other moral precepts, the soundness of which could not be controverted; but that, as a matter of practicality, there were occasions when it was necessary to discuss the question of adjustments in the practical application of those principles to concrete problems.\n\n[676면]\n\nThe Ambassador referred to the Versailles conference, which he said he had attended, and to the proposal of fourteen points by President Wilson, which proposal, he said, led to discussions lasting a half a year. The Ambassador expressed the opinion that there were no insurmountable difficulties in the present situation if both sides were of a mind to overcome differences. He added that he himself had noted some contradictions of “the four principles” in the Japanese proposals of September 6 and inquired whether if a reexamination of those proposals were made, there would possibly arise new points requiring further discussion. He emphasized the necessity of informing Tokyo exactly of the position of this Government.\n\nMentioning that the Japanese public had suffered the sacrifices of four years of war, the Ambassador said that his Government would necessarily have to present to the Japanese people some reward for that sacrifice or some attractive alternative gain. We replied that, as we had often told the Japanese, our experience led us to believe that Japan stood to gain more by following a progressive and constructive program of peace in the entire Pacific than by any other course. We mentioned that our desire was to build for future stability. We said that we had sought to avoid being placed in a position of possible criticism for having tried to tell the Japanese Government what it must do or must not do.\n\nWe agreed that the procedure suggested by the Japanese of taking each question point by point was possibly one way of handling the situation. We pointed out, however, that just as the Japanese had emphasized difficult questions of domestic politics we also were faced with similarly difficult questions in this country. We mentioned that the Japanese had themselves suggested the desirability of avoiding becoming lost in a maze of details; and spoke of the fact that the Japanese Minister for Foreign Affairs had informed Ambassador Grew that he was studying the October 2 document and would later make observations on that document. We pointed out that, on the other hand, another way of approaching this problem, which might serve to avoid becoming lost in a maze of details and minutiae and to get back to fundamental principles, might be to take the October 2 document and to study it in the light of other statements which this Government had made and conversations which the Secretary has had with the Ambassador. We pointed out again the desire of this Government to accomplish a broad-gauge general settlement of Pacific problems based upon the fundamental question of peace in the Pacific.\n\nThe Ambassador mentioned that he had received from his Government certain instructions in regard to the June 21 draft which we had given him but that he had been unable to deliver a document based on those instructions owing to the interruption in the conversations. [677면] The Ambassador again expressed a desire to obtain concrete information of the views of this Government in regard to outstanding questions and differences. We once more went over the position of this Government as expressed in the October 2 document and referred to previous exchanges and conversations in which the views of the American Government had, we believed, been extensively set forth.\n\nIn concluding the conversation the Japanese Ambassador suggested in Japanese to members of his staff that a report should be sent to Tokyo stating that the American Government had no concrete counterproposal to make and that it would seem that the Japanese Government could either redraft its proposals or could prepare a new document on the basis of additional consideration of the fundamental principles which we had discussed.\n\nThe Japanese seemed disappointed that we had avoided taking up point by point their proposals of September 6 or the redraft of the proposed agreement which was given Ambassador Grew on September 25. The Japanese, however, expressed their appreciation of our discussion and indicated that they now understood more clearly what the American Government had in mind in its document of October 2 and its suggestion that “renewed consideration” of fundamental principles might be helpful. We expressed our readiness to meet the Ambassador and his associates at any time and to be helpful in any way that we could.\n\nThroughout the foregoing conversation we brought out our views in regard to basic principles and policies, including those relating to the application of the principle of equality of opportunity throughout the Pacific area and to the stationing of troops of one country in the territory of another country.\n\n[Max W.] Schmidt", "notes": ["[주30] 와카스기 씨, 오쿠무라 씨, 마쓰다이라 씨, 오바타 씨도 동석하였다."], "warn": true, "pages": ["0739", "0740", "0741", "0742", "0743"], "search": "해밀턴(Maxwell M. Hamilton) — 국무부 극동국장 밸런타인(Joseph W. Ballantine) — 국무부 슈미트(Max W. Schmidt) — 국무부, 비망록 작성자 노무라(野村吉三郎, Nomura) — 주미 일본대사 와카스기(若杉要, Wakasugi) — 주미 일본공사 오쿠무라(奥村勝蔵, Okumura) — 일본대사관 마쓰다이라(松平, Matsudaira) — 일본대사관 오바타(小畑, Obata) — 일본대사관 헐(Cordell Hull) — 국무장관 루스벨트(Franklin D. Roosevelt) — 대통령 고노에(近衞文麿, Konoye) — 총리 그루(Joseph C. Grew) — 주일 미국대사 윌슨(Woodrow Wilson) — 전 대통령"}, {"id": "d369", "order": 369, "date": "1941-10-10", "group": "A", "eyebrow": "d369 · Memorandum by the Ambassador in Japan (Grew)", "title": "주일대사(그루)의 각서", "badge": null, "list_right": "문서 369", "meta": [{"k": "일자", "v": "1941-10-10"}, {"k": "시각", "v": "오후(this afternoon)"}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2624", "txt": true}, {"k": "발신", "v": "The Ambassador in Japan (Grew) 주일대사 그루", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 369 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d369"}], "summary": "도요다 외상이 그루 대사를 불러, 미국이 일본에 요구하는 의무를 구체적으로 제시해 달라고 요청하고, 고노에-루스벨트 회담이 열리면 광범위한 약속을 할 수 있다고 말하며, 극단 세력을 통제하지 못할까 우려한다고 밝힌다.", "points": ["외상은 10월 2일자 국무장관 각서를 정독했으나 요점을 파악하기 어려웠다며, 양국의 견해가 갈리는 문제를 (1) 중국에서의 일본군 주둔 유지, (2) 유럽 전쟁에 대한 미·일 각각의 태도, (3) 중국에서의 기회 균등 세 가지로 정리했다.", "외상은 10월 3일과 10월 6일 두 차례 노무라 대사에게 훈령하여, 위 세 문제에 관해 미국이 일본에게 지우고자 하는 의무를 정확한 표현으로 제시해 줄 것을 국무장관에게 묻게 했다.", "10월 9일 노무라는 그날 국무장관을 만났으나 요청한 정보를 제공할 수 없다고 전보로 알려 왔다. 도요다는 「매우 귀중한 한 주일」이 허비되었다고 말했다.", "도요다는 지연을 막고자 그루 대사를 통해 미국 정부에 직접 묻겠다며, 「일본 정부가 낸 제안이 미국 정부에 만족스럽지 않은 듯하니, 이제 미국 정부가 일본 정부에게 어떤 의무를 지면 만족스럽겠는지 제시해 달라」는 문면을 건넸다.", "그루는 일본 언론의 회담 부진 비판에 답하여, 미국 정부는 정책의 결정과 집행에서 미국 여론의 발전과 상태를 끊임없이 고려하고 정당한 무게를 둔다고 강조했다.", "도요다는 고노에-대통령 회담이 성사되어 어떤 합의가 이루어진다면 일본 국내 여론을 통제하는 일은 비교적 쉬울 것이라고 말했다.", "도요다는 그러한 회담에서 일본 정부가 광범위한(far-reaching) 약속을 할 수 있을 것이지만, 현 상황에서는 일본이 질 용의가 있는 의무의 전모를 회담에 앞서 밝힐 수는 없다고 확언했다.", "도요다는 사태가 현재의 미결 상태로 남아 있으면 정부가 일본 내 극단 세력을 통제하지 못하게 될까 우려한다고 거듭 말했다.", "그루는 회담 진행 중에 인도차이나로 일본군 증파를 보내는 것은 매우 미묘한 사태를 낳고 회담에 심각하게 악영향을 줄 수밖에 없다고 강력히 강조했다. 전신·우편·세관 접수 위협과 추가 공군기지 요구를 이미 지적한 바 있다고 했다.", "외상은 그 사안을 육군대신과 이미 협의했고 며칠 안에 회답할 수 있기를 바라며, 인도차이나 일본 당국의 행위에 대해서도 육군대신에게 즉각 시정 조치를 요청했다고 답했다.", "외상은 노무라 대사가 매우 지쳐 보인다는 인상을 받았다며, 대사급 개인 자격의 노련한 고위 외교관을 워싱턴에 보내 회담을 돕게 하는 방안을 진지하게 검토 중이라고 밝히고, 마닐라–샌프란시스코 항공편 좌석 확보가 가능한지 알아봐 달라고 했다. 그 인물은 미국 정부에 신임장을 제정하지 않고 일본대사관에 임시·비공식으로 부속될 것이라고 했다.", "외상은 시간 요소의 중요성에 비추어 회담의 진전을 서둘러야 한다고 여러 차례 강조하며 회담을 마쳤다."], "primary": "[도쿄,] 1941년 10월 10일.\n\n외무대신이 오늘 오후에 나를 불렀다.\n\n대신은 먼저, 국무장관의 10월 2일자 각서를 면밀히 검토하기는 하였으나 그 각서의 요점을 파악하는 데 다소 어려움을 겪었다고 말하며 시작하였다. 그러나 그는 미국 정부와 일본 정부가 서로 다른 견해를 가지고 있는 세 가지 문제가 다음과 같다는 결론에 이르렀다고 하였다. (1) 중국에서의 일본 군대의 유지, (2) 유럽에서의 전쟁에 관한 미국과 일본 각각의 태도, (3) 중국에서의 기회 균등. 대신은 10월 3일에 자기가 워싱턴 주재 일본 [678면] 대사에게 훈령하여, 위에 든 세 가지 문제와 관련하여 미국 정부가 일본 정부로 하여금 지게 하고자 하는 의무를 미국 정부가 정확한 표현으로 제시하여 줄 것인지 국무장관에게 물어보도록 하였다고 덧붙였다. 일본대사로부터 아무 소식도 듣지 못하였으므로, 그는 10월 6일에 다시 노무라 제독에게 훈령하여 위와 같은 취지로 국무장관에게 접촉하도록 하였다. 10월 9일 일본대사는 그날 국무장관을 만났으나 외무대신이 요청한 정보를 제공할 수 없다고 외무대신에게 전보하였다. 도요다 제독은, 만약 받았더라면 현재의 회담을 상당히 앞당겼을 정보를 일본대사를 통하여 얻어내려는 노력에 매우 귀중한 한 주일이 허비되었다고 덧붙였다. 외무대신은 오늘 노무라 제독에게 원하는 정보를 얻기 위한 노력을 계속하라는 추가 훈령을 보냈으나, 동시에 더 이상의 지연을 막기 위하여 다음 진술에 대한 회답으로 원하는 정보를 제공하여 줄 것을 나의 정부에 요청해 달라고 청하고 있다고 하였다.\n\n일본 정부는 특정 문제들에 관하여 미국 정부에 제안들을 제출하였으나, 그것들은 미국 정부에 만족스럽지 않은 것으로 보인다. 미국 정부는 이제 일본 정부가 검토할 수 있도록, 일본 정부가 지게 될 의무로서 미국 정부에 만족스러울 만한 것을 일본 정부에 제시하여 주겠는가?\n\n대화의 이 대목에서 나는 기회를 얻어, 현재의 회담에 진전이 없다는 일본 언론의 비판에 대하여, 미국 정부는 그 정책의 결정과 집행에서 미국 여론의 발전과 상태를 끊임없이 고려하고 정당한 무게를 둔다는 점을 도요다 제독에게 강조함으로써 답하였다. 도요다 제독은 일본에서도 여론을 무시할 수는 없으나, 고노에 공(公)과 대통령 사이의 제의된 회담의 결과로 어떤 합의에 이르기만 한다면 이 나라에서 여론을 통제하는 일은 비교적 쉬운 일이 될 것이라고 말하였다. 대신은 나에게, 일본 정부는 그러한 회담에서 광범위한 성격의 약속을 하는 일이 가능하다고 볼 것이지만, 현재의 조건에서는 일본 정부가 지고자 하는 의무의 전모를 그 회담에 앞서 제시할 수는 없다고 확언하였다. 그는 사태가 현재와 같은 미결 상태로 남아 있을 경우 정부가 일본 내의 극단주의 집단들을 통제하지 못하게 되지 않을까 하는 우려를 거듭 말하였다.\n\n대신이 대화 첫머리에 프랑스령 인도차이나로 일본군을 증파한다는 보도된 계획에 관하여 내가 어제 그에게 보낸 전언에 대한 사의를 [679면] 표하였으므로, 나는 이 점으로 되돌아가, 우리 두 정부 사이에 회담이 진행되고 있는 이 시점에 일본군 증원 부대를 인도차이나로 파견하는 일은 매우 미묘한 사태를 낳을 것이며 내 의견으로는 이 회담들에 심각하고도 나쁜 영향을 미치지 않을 수 없다고 그에게 강력히 강조하였다. 나는 외무대신에게, 이 시점에 일본군 증원 부대가 인도차이나에 도착하는 일은, 내가 이미 그의 주의를 환기한 바 있는 인도차이나 주재 일본 당국의 최근 행위들 — 이를테면 전신·우편·세관을 접수하겠다는 위협이나 추가 공군기지에 대한 요구 같은 것들 — 에 비추어 볼 때 프랑스령 인도차이나에 관한 일본의 목적에 대하여 필연적으로 가장 심각한 의심을 불러일으킬 것이라고 말하였다. 대신은 그 문제에 관한 나의 사적이고 비공식적인 전언을 매우 신중하게 검토하고 있으며 이미 육군대신과 협의하였고 며칠 안에 회답을 줄 수 있기를 바란다고 답하였다. 그는 또한 내가 그의 주의를 환기한 인도차이나 주재 일본 당국의 행위들에 관하여도 육군대신과 논의하였으며, 그 사태를 시정하기 위한 즉각적인 조치를 취하여 줄 것을 대신에게 요청하였다고 덧붙였다.\n\n이어서 외무대신은, 워싱턴 주재 일본대사가 보아하니 매우 지쳐 있다는 인상을 자기가 받았으므로, 현재의 회담을 진행해 나가는 데 대사를 보좌하도록 폭넓은 경험을 가진 외교관 한 사람을 워싱턴에 보내는 문제를 진지하게 검토하고 있다고 나에게 말하였다. 도요다 제독은 대사의 개인 자격 지위를 가진 고위 외교 관리를 염두에 두고 있으나, 아직 해당 관리에게 타진하지 않았으므로 그가 그 임무를 맡기로 동의할지 여부는 확실하지 않다고 말하였다. 해당 관리를 워싱턴에 보내기로 결정될 경우 미국 정부가 마닐라발 샌프란시스코행 항공기의 좌석을 그를 위하여 마련해 줄 용의가 있는지를 확인해 두는 것이 대신에게 큰 도움이 되리라고 하였다. 도요다 제독은 해당 관리가 미국 정부에 신임장을 제정하는 것이 아니라 워싱턴 주재 일본대사관에 임시로, 비공식적으로 부속될 것이라고 말하였다. 나는 외무대신에게 그의 문의를 나의 정부에 전달하겠다고 말하였다.\n\n대화를 마치면서 대신은 시간 요소의 중요성에 비추어 회담의 진전을 서둘러야 할 필요성을 나에게 여러 차례 강조하였다.\n\nJ[oseph] C. G[rew]\n\n[680면]", "secondary": "[Tokyo,] October 10, 1941.\n\nThe Minister for Foreign Affairs asked me to call this afternoon.\n\nThe Minister began by saying that although he had given careful study to the Secretary’s memorandum of October 2 he had encountered some difficulty in seizing the point of the memorandum. He had, however, come to the conclusion that the three questions concerning which the American and Japanese Governments held divergent views were as follows: (1) the maintenance of Japanese armed forces in China, (2) the respective attitude of the United States and Japan in regard to the war in Europe, and (3) equal opportunity in China. The Minister added that on October 3 he had instructed the Japanese [678면] Ambassador in Washington to ask the Secretary whether the United States Government would set forth in precise terms the obligations which the United States Government wished the Japanese Government to undertake with reference to the three questions mentioned above. Having heard nothing from the Japanese Ambassador, he had again on October 6 instructed Admiral Nomura to approach the Secretary in the above sense. On October 9 the Japanese Ambassador had telegraphed the Foreign Minister that he had seen the Secretary on that date but that the Ambassador was unable to provide the information which had been requested by the Foreign Minister. Admiral Toyoda added that a week of very valuable time had been wasted in an endeavor to elicit through the Japanese Ambassador information which, had it been received, would have measurably accelerated the present conversations. The Foreign Minister had today sent further instructions to Admiral Nomura to continue his efforts to obtain the desired information, but at the same time, in order to prevent further delay, he was requesting that I ask my Government to provide the desired information in reply to the following statement:\n\nThe Government of Japan has submitted to the Government of the United States with reference to certain questions proposals which are apparently not satisfactory to the Government of the United States. Will the American Government now set forth to the Japanese Government for its consideration the undertakings to be assumed by the Japanese Government which would be satisfactory to the American Government?\n\nAt this point in the conversation I took occasion to reply to the criticism in the Japanese press concerning the absence of progress in the present conversations, by stressing to Admiral Toyoda that the American Government in the determination and execution of its policy continuously considers and gives due worth to the development and state of American public opinion. Admiral Toyoda remarked that public opinion even in Japan could not be disregarded but that it would be a comparatively easy matter to control public opinion in this country provided, as a result of the suggested meeting between Prince Konoye and the President, some agreement were arrived at. The Minister gave me his assurances that the Japanese Government would find it possible to make commitments of a far-reaching character at such a meeting but that under present conditions the full extent of the undertakings which the Japanese Government was willing to assume could not be set forth prior to the meeting. He reiterated his concern lest the Government be unable to control extremist groups in Japan if matters remain in their present undetermined conditions.\n\nThe Minister having at the beginning of the conversation expressed his appreciation of the message which I had sent him yesterday [679면] concerning the reported plan to send additional Japanese forces into French Indochina, I reverted to this point and strongly emphasized to him that the despatch of Japanese reinforcements to Indochina at this juncture while the conversations were in progress between our two Governments would create a very delicate situation and in my opinion could not but seriously and adversely affect these conversations. I told the Foreign Minister that the arrival of additional Japanese forces in Indochina at this time, in the light of recent activities of the Japanese authorities in Indochina to which I had already drawn his attention, such as threats to take over the telegraph, post, and customs, and the demands for additional air bases, would inevitably give rise to the most serious suspicions in regard to Japan’s aims in respect of French Indochina. The Minister replied that he was giving most careful study to my private and informal message on the subject and had already conferred with the Minister of War and hoped to be able to give me a reply in a few days. He added that he had also discussed with the War Minister the activities of the Japanese authorities in Indochina to which I had drawn his attention and had asked the Minister to take immediate steps to remedy the situation.\n\nThe Minister for Foreign Affairs then told me that since he had the impression that the Japanese Ambassador in Washington was apparently very fatigued, serious consideration was being given to the question of sending to Washington a diplomat of wide experience to assist the Ambassador in carrying on the present conversations. Admiral Toyoda said he had in mind a high-ranking diplomatic official with the personal rank of Ambassador, but he had not yet approached the official in question and was therefore uncertain as to whether he would agree to undertake to accept the mission. It would be of great assistance to the Minister to ascertain whether the Government of the United States, in the event that it was decided to send the official in question to Washington, would be prepared to make available a reservation for him on the airplane from Manila to San Francisco. Admiral Toyoda said that the official in question would not be accredited to the Government of the United States but would be temporarily and unofficially attached to the Japanese Embassy in Washington. I told the Foreign Minister that I would transmit his inquiry to my Government.\n\nIn concluding the conversation, the Minister several times stressed to me, in view of the importance of the time factor, the necessity of expediting the progress of the conversations.\n\nJ[oseph] C. G[rew]\n\n[680면]", "notes": [], "warn": false, "pages": ["0744", "0745", "0746"], "search": "그루(Joseph C. Grew) — 주일 미국대사 도요다(豊田貞次郎, Toyoda) — 일본 외무대신, 해군 제독 노무라(野村吉三郎, Nomura) — 주미 일본대사, 해군 제독 헐(Cordell Hull) — 국무장관(원문에는 「국무장관」으로만 나온다) 고노에(近衞文麿, Konoye) — 일본 총리 루스벨트(Franklin D. Roosevelt) — 대통령(원문에는 「대통령」으로만 나온다) 도조(東條英機, Tojo) — 육군대신(원문에는 「육군대신」으로만 나온다)"}, {"id": "d370", "order": 370, "date": "1941-10-13", "group": "A", "eyebrow": "d370 · Memorandum by the Under Secretary of State (Welles)", "title": "국무차관 웰스의 각서", "badge": null, "list_right": "문서 370", "meta": [{"k": "일자", "v": "1941-10-13"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/24066/11", "txt": true}, {"k": "발신", "v": "국무차관 웰스(Sumner Welles)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 370 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d370"}], "summary": "일본으로 소환되었다 돌아온 와카스기 공사가 웰스를 찾아와 일본 국내 사정(황족과 내각의 대미 평화 희망, 육군 소장층의 추축 지지, 정부 붕괴 위험)을 전하고 회담 지연의 이유를 물은 회담 기록.", "points": ["일본대사관 공사참사관 와카스기(若杉要, Wakasugi)가 자신의 요청으로 오후에 웰스(Sumner Welles)를 방문했다. 지난달 본국에 소환되어 정확히 2주를 일본에서 보내고 온 참이었다.", "와카스기가 만난 사람들: 도착 즉시 천황의 아우이며 현재 천황의 가장 가까운 조언자인 다카마쓰노미야(高松宮, Prince Takamatsu), 곧이어 황족 두 사람(특히 히가시쿠니노미야, Prince Higashi Kuni), 총리(여러 차례), 내대신 기도(木戸幸一) 후작, 그리고 외상과 육·해군 고위 장교들.", "위의 모든 인물에게서 미일 평화 유지에 대한 만장일치의 희망과 회담이 만족스러운 결과에 이르기를 바라는 간절하고 진지한 소망을 발견했다고 했다.", "그러나 특히 육군의 소장층, 그보다는 덜하지만 해군과 다른 분야에도, 자기 운명을 추축국 편에 걸고 미일 양해를 막기 위해 천지를 뒤흔들 각오가 되어 있으며 일본을 독일 편에서 전면적으로 활동하게 하려는 「작지만 매우 강력한 집단」이 존재한다고 했다. 일본 내 독일 대표와 공작원들이 지극히 강력하고 선전에 매우 효과적이며 유럽 정세로 활동을 늘리고 있다고 솔직히 말했다.", "현 일본 정부는 여론의 대다수와 육·해군 주류의 지지를 받고 있으나 회담을 무기한 계속할 수는 없고 어떤 결과를 보여야 한다고 했다. 과거, 특히 최근 몇 년 사이 일본에서 자주 일어난 종류의 사건에 비추어 정부 각료들이 놓인 신체적 위험을 상기시킬 필요는 없을 것이라고 했다. 암살을 가리킨다.", "현 정부가 쿠데타나 암살로, 또는 대미 조정의 희망이 보이지 않아 무너진다면, 십중팔구 오로지 독일의 압력에만 호응하는 군 대표들로 구성된 내각으로 교체될 것이며 그때는 미일 관계 조정의 희망이 적어도 당분간 사라질 수밖에 없다고 했다.", "와카스기는 총리의 개인적 훈령에 따라, 다만 이 단계에서는 비공식으로 아무런 약속도 요구하지 않으면서, 지연의 이유가 무엇인지 또는 미국 정부가 아직 일본 정부로부터 얻고자 하는 해명의 요점이 무엇인지 말해 준다면 대단히 고맙겠다고 했다.", "웰스는 6월 21일 문서, 9월 6일 일본 측 성명(미국이 보기에 이미 합의에 이르렀다고 여긴 광범한 원칙들을 실질적으로 제한·한정·수정한 것), 10월 2일 구두 성명으로 미국 입장이 이미 충분히 개진되었으므로 더 보탤 것이 없다고 답했다.", "웰스가 지적한 근본적 곤란: 합의 추구의 토대가 태평양의 평화 유지인데도 일본 정부는 인도차이나에서 군사 행동을, 북방에서 군사 활동을 벌였고, 최근에는 인도차이나에서 더한 군사 활동을 꾀하고 있다는 보고까지 받았다. 일본 정부의 공공연한 행동이 스스로 밝히는 목적과 부합하지 않는다는 것이다.", "아이슬란드 비유의 반박: 와카스기가 인도차이나 진주는 방어 목적이며 독일 점령하 정부와의 합의에 따른 것으로, 마찬가지로 독일에 점령된 덴마크와의 합의로 이루어진 미국의 아이슬란드 점령과 완전히 유사하다고 하자, 웰스는 잘못이라고 답했다. 미국은 덴마크와 아이슬란드에 관하여 아무 회담도 하지 않았고 아이슬란드 정부와 자유로운 합의로 이루어졌으며, 일본은 인도차이나를 통한 어떤 침략 위협도 두려워하지 않는 반면 미국은 독일에 대한 자위로서 부득이 그리했다는 것이다.", "북방에 관한 「정당한 이유가 있는 경우를 제외하고(save for justifiable reasons)」라는 9월 6일 성명의 문구를 와카스기는 전혀 불필요하며 철회할 수 있다고 했다. 스탈린 정부가 무너지거나 동시베리아에 1919~20년과 같은 완전한 무정부 상태가 벌어질 경우를 뜻한 것뿐이라고 했다. 일본 정부는 북방·남방을 비롯한 태평양 어디에서도 침략 행동을 하지 않겠다고 전면적으로 약속할 용의가 있다고 했다.", "중국 철병: 와카스기는 「일본 정부는 중국에서 전 병력을 철수할 용의가 있다」고 말했다. 웰스는 잘못 들은 줄 알고 되풀이해 달라고 청했고 그는 같은 말로 두 번 되풀이했다. 다만 4년간의 군사 작전 뒤에 24시간 안에 전 병력을 철수할 수는 없다고 했다. 웰스는 「이 현대에 기적을 기대하는 사람은 물론 아무도 없다」고 답했다.", "웰스는 미국이 중재를 맡는다면, 그 판단으로 불공정하고 태평양의 안정된 평화 유지에 이바지하지 않는 강화 조건을 중국 정부에 전달하는 일은 떠맡을 수 없다고 밝혔다.", "「햄릿」 비유: 다른 주요 원칙에 관하여 양해의 기초를 마련할 수 있다면 중국 문제는 미결로 남겨 두고 앞으로 나아갈 수 없겠느냐는 물음에, 웰스는 그것은 「햄릿」이라는 연극을 햄릿이라는 인물 없이 무대에 올릴 수 있겠느냐고 묻는 것과 매우 흡사해 보인다고 답했다. 공사는 크게 웃으며 뜻을 충분히 알겠다고 했다.", "와카스기는 24시간 내지 48시간 안에 본국 정부가 기본 문제에 관하여 최종 결정에 이르러야 한다고 믿는다고 했다. 떠나기 전에, 일본 육군의 주도적 장군들과 해군의 주도적 제독들이 모두 미국과의 포괄적이고 만족스러운 협정 체결을 바라는 정부의 입장을 전적으로 지지하고 있으며, 너무 늦기 전에 협정이 이루어진다면 현재의 통제 상태로 보아 정부가 그 조건을 이행할 수 있으리라는 점을 미국 정부가 의심하지 않아도 된다고 알아 달라고 했다."], "primary": "[워싱턴,] 1941년 10월 13일.\n\n일본대사관 공사참사관 와카스기(若杉要, Wakasugi) 씨가 자신의 요청으로 오늘 오후 나를 만나러 왔다.\n\n통상의 인사말을 나눈 뒤 와카스기 씨는, 지난달 본국으로 소환되었을 때 정확히 2주를 일본에서 보냈다고 나에게 말하였다. 그는 자기 나라에 머무는 동안 받은 인상을 나에게 전함에 있어 전적으로 솔직하고자 한다고 말하고, 자신이 만난 사람들과 자신이 본 사정에 관하여 상세히 이야기하였다.\n\n공사는 도착하자마자 천황의 아우이며 현재 천황의 가장 가까운 조언자인 다카마쓰노미야(Prince Takamatsu)로부터 즉시 부름을 받았다고 말하였다. 그 직후 그는 황실의 다른 두 사람과의 면담에 불려 갔는데, 그는 특히 히가시쿠니노미야(Prince Higashi Kuni)를 언급하였다. 이어 그는 총리에게 불려 가 여러 차례 회담을 가졌고, 다음으로는 내대신이자 마찬가지로 황실의 가장 가까운 조언자 가운데 한 사람인 기도(Marquis Kido) 후작에게 불려 갔다. 그는 또한 물론 외상 및 육군과 해군의 고위 장교들과도 여러 차례 회담을 가졌다고 말하였다.\n\n공사는 위에 언급한 모든 인사들 편에서 일본과 미국 사이의 평화 유지에 대한 만장일치의 희망과, 양국 정부 사이의 현재의 회담이 만족스러운 결과에 이르기를 바라는 간절하고 진지한 소망을 발견하였다고 말하였다. 그러나 그는, 특히 육군의 소장 분자들 사이에, 그리고 그보다 덜한 정도로 해군과 일본 내 그 밖의 활동 영역에도, 자신들의 운명을 추축국 편에 걸고서 일본과 미국 사이에 어떠한 양해도 이루어지지 못하게 막고 일본을 독일 편에 서서 온전히 활동하게 하려고 천지를 뒤흔들 각오가 되어 있는, 작지만 매우 강력한 집단이 존재한다고 말하였다. 그는 일본 내의 독일 대표들과 독일 공작원들이 지극히 강력하고 그 선전에 있어 대단히 효과적이며, 유럽의 사태 전개로 말미암아 그 활동을 늘리고 있음이 틀림없다고 아주 솔직하게 말하였다. 그는 현 일본 정부가 여론의 대다수를 등에 업고 있고 현재의 정책에 있어 일본 육군과 일본 해군의 주도적 분자들의 지지를 받고 있기는 하나, 미국과의 회담을 무기한으로 계속할 수는 없다고 말하였다. 어떤 결과를 보여 주어야 한다는 것이었다. 그는 과거에, 그리고 특히 근년에 일본에서 불행히도 그토록 빈번히 일어났던 종류의 사건에 비추어 [681면] 일본 정부의 각료들이 놓여 있는 신체적 위험을 자신이 나에게 새삼 상기시킬 필요는 없으리라고 말하였다. 그는 만일 현 일본 정부가 쿠데타의 결과로, 또는 암살 때문에, 또는 미국과 어떠한 만족스러운 조정에 이를 희망도 보이지 아니하기 때문에 무너진다면 그 결과가 어떠할지는 알 수 없다고 말하였다. 그는 십중팔구 그 정부는 오로지 독일의 압력에만 호응하는 군의 대표들로 구성된 내각으로 교체될 것이며, 그러한 경우 일본과 미국 사이의 관계를 조정할 어떠한 희망도 적어도 당분간은 사라질 수밖에 없다고 말하였다. 그는 자신이 본 대로의 사정을 매우 진지하게 표명하고자 하며, 일본인은 황실에 관하여 가벼이 말하지 아니하는 법이지만 우리 대화의 첫머리에 자신이 나에게 언급한 바로 미루어 황실이 현 내각과 마찬가지로 미국과의 평화를 유지하고 일본과 이 나라 사이에 생겨난 문제들을 신속히 조정하기를 간절히 바라고 있다는 점이 분명해질 것임을 강조하고자 한다고 말하였다.\n\n그는 내가 알고 있다시피 고노에(近衞文麿, Konoye) 공(公)이 자신과 대통령의 회담을 제의한 바 있다고 말하였다. 그는 우호적 양해에 이르는 것을 촉진하려는 일본 정부 측의 온갖 노력에도 불구하고, 또 일본 정부가 7월에 집권하였을 때 양해에 필요한 근본 원칙이 이미 찾아졌다고 믿었다는 사실에도 불구하고, 어떠한 합의에도 이르지 못한 채 한없는 시간이 흘렀으며, 일본 정부로서는 미국의 희망이 실제로 무엇이고 미국이 이루고자 하는 합의가 실제로 무엇인지를 알아내는 것이 불가능해 보인다고 말하였다. 그는 총리의 개인적 훈령에 따라 행동하고 있으나 그럼에도 이 단계에서는 비공식으로, 또 나에게 어떠한 약속도 요구함이 없이 행동하는 것이라고 하면서, 지연의 이유가 무엇일 수 있는지, 또는 이 정부가 여전히 자국 정부로부터 얻고자 하는 해명의 요점이 무엇인지를 내가 말해 줄 수 있다면 대단히 고맙겠다고 말하였다.\n\n나는 공사에게, 일본 정부가 실제로 이 정부의 입장에 대하여 매우 명확하고 구체적인 이해를 가지고 있지 아니하다는 것은 나로서는 믿을 수 없는 일로 보인다고 말하였다. 나는 이 정부의 견해가 국무장관이 일본대사와 가진 헤아릴 수 없이 많은 회담에서뿐만 아니라, 더 구체적으로는 6월 21일 일본대사에게 건넨 문서들에서 우리의 견해를 제시함으로써 충분히 개진되었다고 말하였다. 나는 그 날짜 이후 이 정부는 매우 만족스러운 진전이 이루어지고 있으며 [682면] 양국 정부가 양해의 공통된 기초를 찾아 가고 있다고 믿었으나, 9월 6일 이 정부에 건네진 성명을 통하여 우리가 유감스럽게도 일본 정부가 양해의 기초에 이미 이르렀다고 우리가 여겼던 광범한 원칙들을 매우 실질적으로 제한하고 한정하고 수정하려는 듯이 보였다고 말하였다. 나는 9월 6일 이후 국무장관이 일본대사와 몇 차례 해명을 위한 회담을 가졌고, 그에 관한 이 정부의 견해가 10월 2일 일본대사에게 건넨 구두 성명에서 다시 매우 명확히 개진되었다고 내가 이해하고 있다고 말하였다.\n\n따라서 나는, 와카스기 씨가 워싱턴에 돌아온 뒤로 이 모든 회담과 내가 언급한 보다 최근의 성명들에 충분히 익숙해졌으리라 확신하는 만큼, 이미 제시된 해명을 넘어 쟁점을 조금이라도 유용한 방식으로 밝혀 줄 만한 것으로 내가 더 보탤 수 있는 바는 없다고 말하였다.\n\n나는 이 회담이 진행되어 온 동안 일본 정부의 입장을 헤아리는 데 있어 이 정부로서 겪은 주된 곤란 가운데 하나는, 합의에 이르려는 노력이 세워져 있던 토대 전체가 곧 태평양에서의 평화 유지임에도 불구하고, 와카스기 씨가 일본으로 떠나기 직전에 내가 그에게 강조한 바와 같이 일본 정부가 인도차이나에서 군사 행동을 감행하고 또 북방에서 군사 활동을 감행하였다는 사실이었으며, 이는 합의에 이르려는 노력의 주된 목적을 전적으로 뒤집는 것으로 보이리라고 말하였다. 나는 바로 최근에 일본 정부가 인도차이나에서 더 나아간 군사 활동을 꾀하고 있음을 시사하는 듯한 보고들을 유감스럽게도 받았다고 말하였다. 이러한 관점에서 볼 때, 일본 정부의 공공연한 행동은 일본 정부가 미국과의 회담에서 추구하고 있다고 우리에게 보증하는 목적과 부합하지 아니하는 것으로 불행히도 보인다고 나는 말하였다.\n\n그러자 공사는, 일본 내의 추축 측 공작원들이 이 정부가 일본과 양해에 이를 뜻이 없이 다만 교섭을 지연시키기 위하여 고의로 지연시키고 있다는 믿음을 부지런히, 그리고 어느 정도는 성공적으로 퍼뜨려 왔다고 말하였다. 나는 공교롭게도 바로 오늘 아침에 일본 정부야말로 자국의 이익을 위하여 시간을 벌고자 바로 이와 똑같은 정책을 취하고 있다고 주장하는 신문 기사를 보았다고 답하였다. 나는 이 정부가 만족스러운 양해에 이르기 위하여 가능한 모든 분야를 탐색하기를 진지하게 바라고 있음을 공사에게 보증할 수 있다고 말하였으며, 양국 정부가 여기까지 회담을 이어 온 이상 참된 양해를 찾고자 하는 [683면] 회담 상대방의 진지함을 서로 인정하여야 한다고 느낀다고 말하였다.\n\n공사의 마지막 물음, 그리고 매우 집요한 물음은, 이 정부가 현재의 회담의 일부로서 제기할 다른 주요한 요구 가운데 아직 일본 정부에 제출되지 아니한 것이 있느냐는 것이었다. 나는 이 물음에 관하여는 우리 대화의 첫머리에 내가 말한 바를 되풀이할 수 있을 뿐이라고 말하였다. 즉 이 정부의 견해는 6월 21일의 문서들과 그 뒤 일본 정부에 전달된 구두 성명들에서 충분히 개진되었다고 나는 믿으며, 이러한 종류의 중요한 교섭에 있어 교섭 상대방을 속이거나 오도하려 드는 것은 미합중국 정부의 정책이 아니라는 것이었다.\n\n와카스기 씨는 자국 정부가 인도차이나에서 취한 행동이 양국 정부가 추구하고자 하는 정책과 어긋나 보인다는 것을 물론 자신도 인정한다고 말하였다. 그러나 그는 일본 정부 내의 의견은 인도차이나에서 취한 행동이 방어의 목적을 위한 것이었으며 미국이 아이슬란드에서 취한 행동과 전적으로 유사하다고 여기고 있다고 말하였다. 그는 인도차이나 점령이 독일에 점령당한 어느 정부와의 합의를 통하여 이루어졌고, 미국의 아이슬란드 점령 또한 마찬가지로 독일에 점령당한 나라인 덴마크와의 합의를 통하여 이루어졌다고 말하였다.\n\n나는 공사가 잘못 알고 있다고 답하였다. 나는 미합중국 정부가 덴마크로부터 분리된 나라인 아이슬란드에 관하여 덴마크 정부와 아무런 회담도 가진 바 없으며, 아이슬란드 점령에 관한 합의는 아이슬란드 정부 측과 미합중국 정부 측의 자유로운 합의를 통하여 이루어졌다고 말하였다. 나아가 나는, 이미 앞선 회담에서 와카스기 씨에게 지적한 바와 같이 일본 정부가 인도차이나를 통한 어느 다른 열강의 침략 위협을 두려워하고 있다고는 누구도 도저히 주장할 수 없는 반면, 미합중국 정부는 독일 정부가 미국의 사활적 이익을 꾸준히 그리고 점점 더 위협하고 있는 유럽의 사태에 직면하여, 독일에 대한 자위의 수단으로서, 또한 독일이 아이슬란드나 이 나라의 방위에 사활적으로 필요한 대서양의 다른 어느 지역을 점령함으로써 미국에 닥칠 임박한 위험을 피하는 수단으로서, 아이슬란드 정부와 이룬 그 합의에 들어가지 아니할 수 없었다고 말하였다.\n\n이어 공사는, 9월 6일의 성명에서 일본 정부가 [684면] 제한하였다고 이 정부가 여긴 근본 원칙들 가운데 일부에 관하여는 부적절한 표현을 쓴 탓에 불필요한 오해가 있었다고 자신은 느낀다고 말하였다. 그는 일본 정부가 남방으로도 북방으로도 어떠한 침략적 움직임도 취하지 아니하겠다고 스스로 약속할 의사가 전적으로 있다고 말하였다. 그는 일본 정부가 9월 6일의 성명에서 러시아에 대한 있을 수 있는 움직임과 관련하여 「정당한 이유가 있는 경우를 제외하고(save for justifiable reasons)」 북방에서 침략적 행동을 취하지 아니하겠다는 문구를 쓰기는 하였으나, 이 뒷부분의 문구는 전혀 불필요하며 손쉽게 철회될 수 있다고 말하였다. 그는 그것이 오로지 다음을 나타내려는 의도였을 뿐이라고 말하였다. 즉 스탈린 정부가 무너지고 어떤 다른 외국 열강이 동시베리아에서 활동에 나서거나, 1919년과 1920년에 그러하였던 바와 같이 동시베리아에 완전한 무정부 상태가 벌어지는 경우에는, 일본 정부가 그러한 근원으로부터의 침략에 대하여 「만주국(Manchukuo)」의 이익을 위하여 자국의 이익을 방어할 필요를 느끼게 되리라는 것이었다. 그러나 그는 이 문구가 삭제될 수 있으며, 일본 정부는 북방으로도 남방으로도 또 태평양 지역의 그 밖의 어디로도 어떠한 침략적 활동도 하지 아니하겠다는 전면적인 약속을 할 준비가 되어 있다고 되풀이하여 말하였다.\n\n나는 이는 그의 편에서 나온 매우 흥미롭고 반가운 진술이며, 우리에게 지극히 중요한 문제 하나를 밝히는 데 도움이 되리라 믿는다고 말하였다. 그는 나아가, 태평양에서의 통상 관계에 있어 균등 대우와 무차별에 관하여 쓰인 표현 때문에 이 정부가 불안해하였음이 분명하며, 9월 6일의 일본 측 성명이 이 약속에서 중국이 빠져 있고 그것이 서남태평양 지역에만 적용된다는 인상을 준 듯하다고 말하였다. 그는 나아가 이 점에 관하여 일본 정부가 우리가 염두에 두고 있는 광범하고 일반적인 취지에 따라 합의에 이르는 것을 떠맡을 의사가 전적으로 있으리라고 말하였다.\n\n이어 그는 추축 협정(the Axis pact) 아래에서의 일본의 의무와 관련하여, 그 협정 아래에서의 자국 의무의 해석에 관한 일본의 「재량(discretion)」을 일본 정부의 판단에 맡기는 데 이 정부가 동의할 수는 없겠느냐고 물었다. 그는 새로 들어서는 어떠한 내각도 현 일본 내각이 자국 의무를 판단하는 방식과 다른 방식으로 일본의 의무를 판단할 수 있다는 것을 자신이 충분히 알고 있으나, 실제 문제로서 현 일본 내각이야말로 만일 미국이 전쟁에 들어가는 경우에 미국과의 평화를 유지하기를 바랄 유일한 내각이라고 말하였다. 나는 이 점에 관하여는 이 정부의 입장이 이미 국무장관에 의하여 충분히 명확하게 밝혀졌다고 느끼며, [685면] 더 이상의 해명이 필요한지를 정하기 위하여 이 문제를 국무장관에게 회부하여야 하겠다고 말하였다.\n\n이어 공사는 일본군의 중국 철수 문제를 꺼냈다. 그는 일본 정부가 중국으로부터 자국의 전 병력을 철수시킬 용의가 있다고 말하였다. (내가 그의 말을 잘못 알아들은 줄 알고 나는 그에게 이 진술을 되풀이해 달라고 청하였는데, 그는 같은 말로 두 번 되풀이하였다.) 그러나 그는 4년에 걸친 중국에서의 군사 작전 뒤에 일본 정부가 24시간 안에 전 병력을 중국에서 철수시키는 일을 떠맡기란 불가능하다고 말하였다. 나는 물론 이 현대에 기적을 기대하는 사람은 아무도 없다고 말하였다. 나는 이 문제에 관하여 여기에서도 다시 이 정부의 견해가 일본 정부에 매우 명확히 알려졌으며, 국무장관이 태평양 지역에 평화와 안정을 가져올 정책이 어떠하여야 한다고 우리가 믿는지를 보이는 예시로서 서반구에서의 우리 자신의 경험과 우리 자신의 정책을 자주 언급하여 왔다고 말하였다. 이어 공사는, 만일 미합중국 대통령이 일본과 중국 사이를 중재하는 데 동의하는 경우 이 정부가 일본이 제안하는 강화 조건을 중국에 제출하기에 앞서 그 조건을 심사하겠다고 고집할 것인지 물었다. 나는 이 경우에도 다시 한번 우리의 견해는 매우 명확히 알려졌으며, 국무장관과 상의하지 아니하고는 이 점에 관하여 그에게 더 구체적인 의견을 줄 위치에 있지 아니하다고 말하였다. 나는 대체로, 내가 자주 설명한 바와 같이 이 정부의 견해는 이 정부가 중재의 임무를 떠맡게 되는 경우 그 판단으로 공정하지 아니하고 태평양 지역의 안정된 평화의 유지에 이바지하지 아니하는 강화 조건을 중국 정부에 전달하는 일은 떠맡을 수 없다는 것이라고 말하였다.\n\n이어 공사는, 만일 이 정부가 근본적이라고 여기는 다른 모든 주요 원칙에 관하여 양해의 기초에 이르는 것이 가능하다면, 양국 정부가 중국 문제는 미결로 남겨 둔 채 앞으로 나아갈 수는 없겠느냐고 물었다. 나는 이 물음이 나에게는 「햄릿(Hamlet)」이라는 연극을 햄릿이라는 인물 없이 무대에 올릴 수 있겠느냐고 묻는 것과 매우 흡사해 보인다고 말하였다. 공사는 크게 웃으며 나의 뜻을 충분히 알겠다고 말하였다.\n\n공사는 자국 정부의 견해를 밝히는 일을 앞당기기 위하여 온갖 노력을 다하겠다고 말하였다. 그는 6월 21일 이 정부가 개진한 바와 같은 기저의 원칙들이 일본 정부에 의하여 받아들여질 수 있으리라 믿는다고 말하였다. 그는 양국 사이에 만족스러운 합의가 이루어지는 것보다 자신이 더 간절히 바라는 바는 없다고 말하였다. 나는 그 점에 관한 그의 표명된 소망에 전적으로 뜻을 같이한다고 말하였다. [686면] 그는 24시간 내지 48시간 안에 자국 정부가 관련된 기본 문제들에 관하여 최종 결정에 이르러야 한다고 믿는다고 말하였다. 그는 자신이 비공식으로 말하고 있다는 사실을 강조하였다. 떠나기 전에 그는, 일본 육군의 주도적인 장군들 전부와 일본 해군의 주도적인 제독들 전부가 미국과 포괄적이고 만족스러운 협정을 체결하기를 바라는 일본 정부의 입장을 전적으로 지지하고 있음을 내가 알아 주기 바란다고 말하였다. 그는 만일 너무 늦기 전에 합의가 이루어질 수 있다면, 현재의 상황 아래에서 육군과 해군에 대한 통제가 정부로 하여금 그러한 합의의 조건을 수행하고 이행할 수 있게 하기에 충분한 것임을 이 정부가 조금도 의심할 필요가 없다고 말하였다.\n\nS[umner] W[elles]", "secondary": "[Washington,] October 13, 1941.\n\nMr. Wakasugi, the Minister-Counselor of the Japanese Embassy, called to see me this afternoon at his request.\n\nAfter the usual preliminaries Mr. Wakasugi told me that he had spent exactly two weeks in Japan when he was summoned home last month. He said that he wished to be completely frank in giving me an account of his impressions during the time he was in his own country and he told me in detail of the persons he had seen and the situation as he found it.\n\nThe Minister said that as soon as he arrived he was summoned immediately by Prince Takamatsu, the brother of the Emperor and who is now the closest adviser of the Emperor. Immediately thereafter he was summoned to interviews with two others in the Imperial family and he mentioned specifically Prince Higashi Kuni. He was then summoned to the Prime Minister with whom he had several conferences and then to Marquis Kido, the Lord Keeper of the Privy Seal and likewise one of the closest advisers of the Imperial family. He said that he also, of course, had several conferences with the Foreign Minister and with high ranking officers of the Army and of the Navy.\n\nThe Minister said that on the part of all of the personages mentioned above he had found the unanimous desire for the maintenance of peace between Japan and the United States and the earnest and sincere hope that the present conversations between the two Governments might reach a satisfactory result. He said, however, that there existed, particularly among the younger elements in the Army and to a lesser degree in the Navy and in other spheres of activity in Japan, a small but very powerful group that had placed its fortunes on the side of the Axis powers and was determined to move heaven and earth to prevent the reaching of any understanding between Japan and the United States and to bring Japan squarely into full activity on the side of Germany. He said quite frankly that German representatives and German agents in Japan were exceedingly powerful and most effective in their propaganda and were undoubtedly increasing their activities because of developments in Europe. He said that while the present Japanese Government had the bulk of public opinion behind it and was backed in its present policies by the controlling elements in the Japanese Army and in the Japanese Navy, it could not indefinitely continue the conversations with the United States. It would have to show some results. He said he need not remind me of the physical danger to which the members of [681면] the Japanese Government were exposed in view of the kind of incident which had unfortunately taken place in Japan so frequently in the past and particularly in recent years. He said that if the present Japanese Government fell as a result of a coup d’état, because of assassination or because it could see no hope of reaching any satisfactory adjustment with the United States, there was no telling what the result might [be]. He said that in all probability it would be replaced by a cabinet composed of military representatives responsive solely to German pressure and that in such event any hope of adjusting relations between Japan and the United States must vanish at least for the time being. He said that he wished to express very sincerely the situation as he saw it and to emphasize the fact that while a Japanese did not speak lightly of the Imperial family, the references he had made to me at the outset of our conversation should make it clear that the Imperial family, as well as the present Cabinet, was earnestly desirous of maintaining peace with the United States and of adjusting rapidly the problems which had arisen between Japan and this country.\n\nHe said that as I knew Prince Konoye had suggested a meeting between himself and the President. He said that notwithstanding every effort on the part of the Japanese Government to expedite the reaching of a friendly understanding and notwithstanding the fact that the Japanese Government had believed when it came into power in July that the fundamental principles necessary for an understanding had been found, an interminable time had elapsed without the reaching of any agreement and that it seemed impossible for the Japanese Government to find out what in reality were the desires of the United States and what in reality was the agreement which the United States desired to achieve. He said that acting under personal instructions from the Prime Minister, but nevertheless at this stage acting unofficially and without requesting any commitment from me, he would greatly appreciate it if I could tell him what the reasons for the delay might be or what the points of clarification were which this Government still desired to obtain from his Government.\n\nI said to the Minister that it seemed to me impossible to believe that the Japanese Government did not in fact have a very clear and specific understanding of the position of this Government. I said that the views of this Government had been fully set forth not only in the innumerable conversations which the Secretary of State had had with the Japanese Ambassador, but more specifically in the presentation of our views in the documents given to the Japanese Ambassador on June 21. I said that after that date this Government had believed that very satisfactory progress was being made [682면] and that the two Governments were finding common bases for understanding when, through the statement given this Government on September 6, it appeared to our regret that the Japanese Government seemed to restrict, to limit and to modify very materially the broad principles upon which we had thought a basis for an understanding had already been reached. Subsequent to September 6, I said, it was my understanding that the Secretary of State had had several clarifying conversations with the Japanese Ambassador and that the views of this Government with regard thereto had again been very clearly set forth in an oral statement given the Japanese Ambassador on October 2.\n\nI said therefore that since I was sure Mr. Wakasugi had fully familiarized himself since his return to Washington with all of these conversations and the more recent statements to which I had referred, there was nothing more that I could add which would clarify the issues in any useful manner beyond the clarifications already advanced.\n\nI said that one of the chief difficulties from the standpoint of this Government in appreciating the position of the Japanese Government throughout the course of these conversations had been the fact that while the whole foundation upon which the striving for the reaching of an agreement had been predicated, namely, the maintenance of peace in the Pacific, the Japanese Government, as I had emphasized to Mr. Wakasugi just before he left for Japan, had undertaken military action in Indochina and had undertaken military activities in the north which would seem to belie entirely the main purpose for which the reaching of an agreement was sought. Only recently, I said, I had regretted to receive reports which would seem to indicate that the Japanese Government was contemplating further military activities in Indochina. From this standpoint I said it seemed unfortunately that the overt actions of the Japanese Government did not correspond to the purposes which the Japanese Government assured us they were seeking in their conversations with the United States.\n\nThe Minister then said that the Axis agents in Japan had sedulously, and to a certain extent successfully, spread the belief that this Government was deliberately delaying negotiations in order to delay them with no desire on its part to reach an understanding with Japan. I replied that it happened that only this morning I had seen a newspaper article alleging that the Government of Japan was adopting exactly this same policy in order to gain time for its own interests. I said that I could assure the Minister that this Government was sincerely desirous of exploring every possible field in order to reach a satisfactory understanding and that I felt that the two Governments, since they had pursued the conversations this far, must recognize [683면] the sincerity of the other party to the conversations in desiring to find a real understanding.\n\nThe final and very insistent question of the Minister was whether this Government had any other major demands to make as a part of the present conversations and which had not yet been submitted to the Japanese Government. I said that with regard to this question I could only reiterate what I had said at the outset of our talk, namely, that I believed that the views of this Government had been fully set forth in the documents of June 21 and in the oral statements subsequently transmitted to the Japanese Government and that it was not the policy of the Government of the United States, in an important negotiation of this type, to attempt to deceive or to mislead the other party to the negotiation.\n\nMr. Wakasugi said that of course he recognized that the action taken by his Government in Indochina seemed at variance with the policies which both Governments desired to pursue. He said, however, that Japanese opinion in governmental circles felt that the action taken in Indochina had been for purposes of defense and was entirely analogous to the action taken by the United States in Iceland. He said that the occupation of Indochina had been undertaken through agreement with a government which was occupied by Germany and that the occupation by the United States of Iceland had likewise been undertaken through an agreement with Denmark, a country also occupied by Germany.\n\nI replied that the Minister was in error. I said that the Government of the United States had had no conversations with the Government of Denmark concerning Iceland, which was a country divorced from Denmark, and that the agreement for occupation of Iceland had been reached through a free agreement on the part of the Government of Iceland and on the part of the Government of the United States. Furthermore, I said, as I had already in an earlier conversation pointed out to Mr. Wakasugi, no one could possibly maintain that the Japanese Government feared any threat of aggression on the part of any other power through Indochina, whereas the Government of the United States, confronting a situation in Europe in which the Government of Germany was steadily and increasingly threatening the vital interests of the United States, was obliged to enter into the agreement which it had reached with the Government of Iceland as a means of self-defense against Germany and as a means of averting the imminent peril to the United States which would result from the occupation by Germany of Iceland or of any other region in the Atlantic which was vitally necessary for the defense of this country.\n\nThe Minister then went on to say that he felt that in some of the fundamental principles which this Government thought had been [684면] restricted by the Japanese Government in the statement of September 6 there had been unnecessary misunderstanding through the use of unfortunate phraseology. He said that the Japanese Government was entirely willing to commit itself to undertake no aggressive moves either to the south or to the north. He said that although the Japanese Government in its statement of September 6 with regard to a possible move against Russia had used the phrase that it would not undertake aggressive action in the north “save for justifiable reasons”, this latter phrase was entirely unnecessary and could readily be withdrawn. He said it had been intended solely to indicate that if the Stalin government collapsed and some other foreign power undertook to operate in eastern Siberia or if a complete case of anarchy broke out in eastern Siberia as had been the case in 1919 and 1920, the Japanese Government in that event would find it necessary to defend its own interests in the interest of “Manchukuo” against such aggression from that source. He repeated, however, that this phrase could be eliminated and that the Japanese Government was prepared to make a full commitment to undertake no aggressive activities to the north, south or anywhere else in the Pacific region.\n\nI said that this was a very interesting and gratifying statement on his part and that I believed it tended to clarify a question which to us was of the utmost importance. He further went on to say that it was evident that this Government had been disturbed by the phraseology employed with regard to equal treatment and nondiscrimination in commercial relations in the Pacific and that the Japanese statement of September 6 had apparently given the impression that China was omitted from this commitment and that it applied only to the southwestern Pacific region. He said further that on this point the Japanese Government would be entirely willing to undertake to reach an agreement along the broad and general lines which we had in mind.\n\nHe then asked, with regard to the obligations of Japan under the Axis pact, whether this Government could not agree to leave the “discretion” of Japan as to the interpretation of its obligations under such pact to the determination of the Japanese Govern
