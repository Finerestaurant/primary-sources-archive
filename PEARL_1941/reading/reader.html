가 11월 15일 의회 개회 전에 명확히 정리되어야 하고 그때에는 보고를 행하여야 하기 때문이었다. 나의 정보 제공자에 따르면, 다가올 의회 회기는 정부가 면밀히 조직할 것이며 방만하거나 무책임한 발언은 일절 허용되지 않을 것이었다.\n\n나는 정보 제공자에게 알려 준 데 대하여 사의를 표하고, 내가 외상에게 말한 바를 그에게 되풀이하였다. 즉 실제의 회담은 워싱턴에서 수행되어야 하며 도쿄에서는 다만 그와 병행될 뿐이라는 것이었다.\n\nJ[oseph] C. G[rew]", "secondary": "[Tokyo,] November 3, 1941.\n\nI received a visit today from the same reliable Japanese informant who called on me on October 25. He informed me that he had seen the Foreign Minister yesterday with a view to ascertaining the prospects of a resumption of the conversations between Japan and the United States. The Foreign Minister had told him that during [701면] the past few days he had been constantly in conference day and night with the Prime Minister and the Minister of the Navy, and that as a result the Government had reached a definite decision as to how far it was prepared to go in implementing the desires of the Emperor for an adjustment of relations with the United States. This decision, which was being held in strictest secrecy, had been communicated by the Prime Minister to the Emperor on the afternoon of November 2. The Foreign Minister had conveyed to my informant the impression that he expected to ask me to call for an extended conversation within a few days.\n\nAccording to my informant this was the first time for many years that a Japanese Foreign Minister had been in a position to assume obligations with the entire support and approval of the Prime Minister, who was an Army officer on the active list and who held as well the portfolios of the War and Home ministries, and also the support of the Navy Minister. My informant was of the opinion that the Foreign Minister would ask me to call not later than November 7 since the question of relations with the United States would have to be clarified before the Diet meets on November 15 at which time a report would have to be delivered. The forthcoming meeting of the Diet, according to my informant, would be carefully organized by the Government and no loose or irresponsible talk would be permitted.\n\nI thanked my informant for his information and repeated to him what I had told the Foreign Minister, namely, that the actual conversations were to be carried on in Washington and only paralleled in Tokyo.\n\nJ[oseph] C. G[rew]", "notes": [], "warn": false, "pages": ["0767"], "search": "그루(Joseph Grew) — 주일 미국대사 도고(東郷茂徳, Togo) — 일본 외상. 원문에는 「외상(Foreign Minister)」으로만 적혀 있다 도조(東條英機, Tojo) — 일본 총리 겸 육군대신 겸 내무대신. 원문에는 「총리(Prime Minister)」로만 적혀 있다 시마다(嶋田繁太郎) — 해군대신. 원문에는 「해군대신(Minister of the Navy)」으로만 적혀 있다 히로히토(Hirohito) — 천황. 원문에는 「천황(the Emperor)」으로만 적혀 있다"}, {"id": "d379", "order": 379, "date": "1941-11-03", "group": "D", "eyebrow": "d379 · The Ambassador in Japan (Grew) to the Secretary of State", "title": "주일대사 그루가 국무장관에게", "badge": null, "list_right": "문서 379", "meta": [{"k": "일자", "v": "1941-11-03"}, {"k": "시각", "v": "도쿄, 1941년 11월 3일 오후 3시 발신 / [오후 4시 19분 접수]"}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": "1736"}, {"k": "원문출처", "v": "711.94/2408: Telegram (전보)", "txt": true}, {"k": "발신", "v": "The Ambassador in Japan (Grew) 주일대사 그루(Joseph Grew)", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 379 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d379"}], "summary": "그루 대사가 헐 국무장관과 웰스 국무차관 앞으로 보낸 종합 정세 판단. 경제 압박만으로는 전쟁을 피할 수 없으며, 교섭이 실패하면 일본은 「나라의 할복」을 무릅쓴 사생결단에 나설 개연성이 있고, 그 행동은 위험하고 극적인 돌연함으로 올 수 있다고 경고한다.", "points": ["머리에 [Substance] 표시가 있다. FRUS가 전문(全文)이 아니라 요지를 3인칭으로 옮겨 실은 것이다. 각주는 「7개 부(部)로 된 전보」라고 적는다.", "대사는 국무장관 헐과 국무차관 웰스 앞으로 보고한다.", "(1) 11월 1일자 『도쿄 니치니치』의 사설과, 「제국은 최대의 위기에 다가서고 있다」는 전면 표제를 단 뉴욕발 기사를 든다. 그 기사는 일본대사관이 『뉴욕 타임스』에 주었다는, 미일 경제 전쟁을 끝낼 필요에 관한 성명 요약을 실었다. 대사는 이것들이 현재 일본인 정서를 가깝게 비추고 있다고 본다.", "(2)(a) 일본은 일본 자신도, 중국과의 사변도, 유럽 전쟁과 그 변동에서 떼어 놓을 수 없다.", "(2)(b) 일본에서는 정치 사상이 중세적인 것부터 자유주의적인 것까지 걸쳐 있어 여론이 가변량이며, 일본 밖의 사건과 조건이 어느 때든 어느 학파가 우세할지를 결정할 수 있다. 서구 유럽에서의 독일 승리 뒤 친(親)추축 세력이 힘을 얻었고, 영국 침공 실패가 온건파를 보강했으며, 독일의 대소 공격이 일본을 삼국동맹으로 끌고 간 자들이 일본을 오도했음을 일본인에게 깨닫게 했다고 예시한다.", "(2)(c) 1940년의 잘못을 바로잡으려는 시도가 고노에가 하고 도조 내각이 약속한 대미 관계 조정 노력에서 보인다. 이 시도가 실패하고 독일 무력에 계속 성공이 따른다면 최종적이고 더 긴밀한 추축 정렬이 예상될 수 있다.", "(2)(d) 대사관은 일본의 재정·경제 자원의 고갈로 군국주의 강국으로서 일본이 곧 붕괴하리라는, 여러 미국 경제학자들이 내세운 이론에 한 번도 설득된 적이 없다. 그 예측은 일본이 자본주의 체제를 유지하리라는 가정에 무의식적으로 기대고 있었다. 실제로는 국민경제 통합이 가차 없이 추진되었다. 따라서 무역 금수의 계속과 봉쇄 부과가 극동에서 전쟁을 가장 잘 막을 수 있다는 견해를 지금까지 벌어진 일은 뒷받침하지 않는다.", "(3) 대사는 1940년 9월 12일자 전보 제827호(유럽에서의 독일 승리에 따라 일본 육군 쪽이 팽창의 「절호의 기회」로 보았다고 보고한 것)를 언급한다. 그때 권고한 강경 정책은 뒤에 미국이 채택했고, 그것과 세계 정치의 충격이 일본 정부를 대미 화해 모색으로 이끌었다. 이 노력이 실패하면 진자가 다시 예전 위치로 또는 그보다 더 멀리 돌아갈 개연성을 내다본다.", "(3) 그것은 외국의 압력에 굴복하기보다 일본을 외국의 경제 금수에 끄떡없는 나라로 만들기 위하여 실제로 「나라의 할복(national hara-kiri)」을 무릅쓰는 전면적 사생결단의 시도가 될 것이며, 이 사태는 가능할 뿐 아니라 개연적이라고 적는다.", "(4) 점진적으로 가혹한 경제 조치를 부과하면 전쟁의 위험이 얼마간 있더라도 전쟁은 아마 피할 수 있으리라는 견해는, 미국 정책의 토대로 삼기에 불확실하고 위험한 가설이다. 대사관 견해로는 그런 방침을 취해도 전쟁은 피할 수 없다. 다만 어느 쪽이나 의견일 뿐이므로 한쪽의 정당함을 단정하고 그 위에 확정적 정책을 세우는 것은 미국 국익에 어긋나며 「말 앞에 수레를 놓는」 격이다.", "(4) 먼저 결정해야 할 근본 문제는, 국방의 제1선인 외교가 실패할 경우 대일 전쟁이 미국의 국가 목적·정책·필요에 비추어 정당화되는가 하는 것이다. 대사는 그 결정이 아무리 되돌릴 수 없는 것으로 판명될지라도 이미 충분히 논의되고 채택되었으리라 의심치 않는다. 「모래가 빠르게 흘러내리고 있기」 때문이다.", "(5) 대사는 자기가 미국에 대한 어떠한 「유화(appeasement)」도, 근본 원칙에서 미국 정부가 티끌만큼도 물러서는 것도 결코 주장하지 않는다고 못 박는다. 원칙과의 타협은 있어서는 안 되며 방법은 신축적일 수 있다.", "(5) 대사의 목적은 오직, 일본이 미국과의 자멸적 싸움에 앞뒤 없이 뛰어들 능력에 관한 어떠한 오해 때문에 미국이 대일 전쟁에 말려드는 일이 없게 하려는 데 있다. 「국가적 온전한 정신은 그러한 행동을 말리지만, 일본의 정신은 미국의 논리 기준으로 잴 수 없다.」", "(5) 대사는 일본의 준비를 「칼자루 흔들기」에 지나지 않는다고 보는 것도 근시안이라 하고, 미국과의 무력 충돌을 피할 수 없게 만들 일본의 행동이 「위험하고 극적인 돌연함으로 올 수 있다」고 맺는다."], "primary": "[요지]\n\n도쿄, 1941년 11월 3일 오후 3시.\n\n[오후 4시 19분 접수.[주36]]\n\n1736. 대사는 헐 국무장관과 웰스 국무차관 앞으로 다음과 같이 보고한다.\n\n(1)\n\n그는 11월 1일자 『도쿄 니치니치(東京日日)』의 사설 기사를 인용하면서(같은 날짜 전보 제1729호로 보고한 것[주37]), 「제국은 최대의 위기에 다가서고 있다」고 선언하는 전면 표제가 뉴욕발 기사를 이끌고 있으며, 그 기사에는 미일 경제 전쟁을 끝낼 필요에 관하여 일본대사관이 『뉴욕 [702면] 타임스』에 주었다고 하는 성명의 요약이 실려 있다고 덧붙인다. 그 기사와 『니치니치』의 사설(11월 1일 오후 7시자 전보[주37a]를 보라)은 둘 다 현재 일본인의 정서를 가깝게 비추고 있는 것으로 여겨진다.\n\n(2)\n\n대사는 지난 여러 달 동안 일본의 정책에 영향을 미치는 요인들을 분석한 자기의 여러 전보 보고를 언급하면서, 거기에 더 보탤 것도 실질적으로 고칠 것도 없다고 말한다. 그의 의견으로는, 다음의 여러 점을 현재의 정세와 가까운 앞날에 적용함으로써 일본의 처지에 대한 결정적인 판단을 얻을 수 있다.\n\n(a)\n\n일본으로서는 일본 자신도, 중국과의 사변도 유럽의 전쟁 및 그 변동에서 떼어 놓는 것이 불가능하다.\n\n(b)\n\n일본에서는 정치 사상이 중세적인 것에서 자유주의적인 관념에 이르기까지 걸쳐 있으며, 따라서 여론은 가변량이다. 일본 밖의 사건과 조건이 주는 충격이 어느 때든 어느 학파의 사상이 우세할 것인지를 결정할 수 있다. (한편 민주주의 국가들에서는 외교 정책에 영향을 주고 그것을 이끄는 원칙들이 하나의 동질적인 덩어리를 이루고 있고, 또 의견의 차이를 낳는 것이 원칙이 아니라 방법인 경우가 더 많은 까닭에, 여론은 다른 식으로 형성된다.) 예를 들어 일본에서는 작년 서구 유럽에서의 독일 승리에 뒤이어 친(親)추축 세력이 힘을 얻었다. 그다음에는 독일이 영국 제도(諸島) 침공에 실패함으로써 독일의 최종적 승리에 대한 일본인의 의심이 생겨났고, 이 요인이 온건 세력을 보강하는 데 도움이 되었다. 그리고 마지막으로 독일의 소련 공격이 독소 평화가 계속되리라는 기대를 뒤엎었고, 일본을 삼국동맹으로 끌고 들어간 자들이 일본을 오도하였음을 일본인들이 깨닫게 만들었다.\n\n(c)\n\n1940년의 잘못을 바로잡으려는 시도는, 고노에 공(近衞文麿, Konoye)이 벌였고 도조(東條英機, Tojo) 내각이 약속한 바, 일본의 대미 관계를 조정하고 그로써 중국과의 강화 체결에 이르는 길을 트려는 노력에서 찾아볼 수 있다. 만일 이 시도가 실패하고 또 독일의 무력에 계속 성공이 따른다면, 최종적이고 더 긴밀한 추축 정렬을 예상할 수 있다.\n\n(d)\n\n주일 대사관은 미국의 여러 저명한 경제학자들이 내세운 이론, 곧 일본의 재정적·경제적 자원의 소모와 마침내의 고갈로부터 군국주의 강국으로서의 일본의 붕괴가 머지않아 오리라는 이론에 한 번도 설득된 적이 없다. 그러한 예측은 일본이 자본주의 체제를 유지하는 것이 지배적인 고려 사항이 되리라는 가정 위에 무의식적으로 서 있었다. 일본 통상의 대부분이 상실되었고 일본의 공업 생산이 대폭 줄었으며 일본의 국가 자원이 소모된 것은 사실이지만, 그들이 예측한 결말은 일어나지 않았다. [703면] 그 대신 일본의 국민경제를 통합하는 과정이 가차 없이 추진되었으며, 이것이 없었더라면 예측된 일본의 붕괴가 능히 일어났을 수도 있었을 것이다. 그러므로 오늘까지 일어난 일은, 무역 금수의 계속과 (일부에서 제안하는) 봉쇄의 부과가 극동에서 전쟁을 막는 최선의 길이 될 수 있다는 견해를 뒷받침하지 않는다.\n\n(3)\n\n대사는 1940년 9월 12일자 자기의 전보 제827호[주38]를 언급한다(그것은 유럽에서의 독일의 승리에 따라 일본 육군 쪽이 팽창의 「절호의 기회」로 보고 있음을 보고한 것이었다). 그는 그 전보를, 미국이 회유적 조치를 취하는 것이 현명하지도 않고 소용도 없어 보이던 사정 아래 그러한 시기에 보냈다. 그 전보에서 권고한 강경 정책은 그 뒤 미국이 채택하였다. 이 정책은 세계 정치의 여러 사건이 일본에 준 충격과 더불어 일본 정부를 미국과의 화해를 모색하는 지점까지 데려왔다. 만일 이 노력이 실패한다면, 대사는 일본에서 진자가 다시 한 번 예전의 일본의 자리로, 또는 그보다 더 멀리 되돌아 흔들릴 개연성을 내다본다. 이것은 그가 앞서 말한 바, 외국의 압력에 굴복하기보다는 일본을 외국의 경제 금수에 끄떡없는 나라로 만들기 위하여 실제로 나라의 할복(national hara-kiri)을 무릅쓰는 전면적인 사생결단의 시도로 이어질 것이다. 일본의 국민적 기질과 심리를 날마다 느끼고 있는 관찰자들은, 이 사태가 가능할 뿐 아니라 개연적이기까지 하다는 것을 의심의 여지 없이 깨닫고 있다.\n\n(4)\n\n일본 국민의 기질과 성정을 염두에 둔다면, 가혹한 경제 조치를 점진적으로 부과함으로써 전쟁의 위험이 얼마간 있을지라도 전쟁은 아마 피할 수 있으리라는 견해는, 숙고된 미국의 정책과 조치를 그 위에 세우기에는 불확실하고 위험한 가설이다. 대사관의 의견으로는 그러한 방침을 취한다 하더라도 그것으로 전쟁이 피해지지는 않을 것이다. 그러나 어느 쪽 견해나 의견에 지나지 않으며, 따라서 그 가운데 어느 하나가 옳다고 단정하고 그 위에 확정적인 정책을 세우는 것은, 대사관이 믿는 바로는, 미국의 국가 이익에 어긋나는 일이 될 것이다. 그것은 말 앞에 수레를 놓는 격이 될 것이다. 먼저 결정되어야 할 요점은 보기에, 국방의 제1선 곧 외교가 실패할 경우에 일본과의 전쟁이 미국의 국가적 목적과 정책과 필요에 비추어 정당화되는가 하는 문제와 관련되어 있다. 왜냐하면 그러한 결정을 토대로 해서만 루스벨트 행정부가 불확실성과 억측과 의견의 요소를 될 수 있는 대로 걷어 낸 방침을 따를 수 있을 것이기 때문이다. 대사는, 그러한 결정이 능히 되돌릴 수 없는 것으로 판명될 수 있음에도 [704면] 이미 충분히 논의되고 채택되었으리라고 의심하지 않는다. 모래가 빠르게 흘러내리고 있기 때문이다.\n\n(5)\n\n대사는, 이 중대하고 중요한 문제에 관한 위의 논의에서 자기가 그에 대한 행정부의 의도와 생각에 접하고 있지 못함을 강조하며, 워싱턴이 숙고되지 않은 정책을 좇고 있다고 넌지시라도 말할 뜻은 조금도 없다고 한다. 또한 그는 미국이 일본에 대하여 어떠한 「유화(appeasement)」를 하는 것도, 미국 정부가 국제 관계 — 미일 관계를 포함하여 — 의 운영과 조정의 기초로서 정해 놓은 근본 원칙에서 티끌만큼이라도 물러서는 것도 한순간이라도 주장할 뜻이 없다. 방법은 신축적일 수 있으나 원칙과의 타협은 있어서는 안 된다. 대사의 목적은 오로지, 일본이 미국과의 자멸적인 싸움에 앞뒤 없이 뛰어들 능력에 관한 어떠한 오해로 말미암아 미국이 일본과의 전쟁에 말려드는 일이 없도록 막자는 데 있다. 국가적인 온전한 정신은 그러한 행동을 하지 말라고 말하지만, 일본의 온전한 정신은 미국의 논리 기준으로 잴 수 없다. 대사는 현재 일본 신문의 호전적인 논조와 내용(지난 몇 해 동안 되풀이하여 물결처럼 미국을 격렬히 공격해 온 것)에 대하여 크게 걱정할 필요는 없다고 보지만, 평화 계획이 실패할 경우에 대비한 대안 계획을 실행하려는 일본의 명백한 준비를 얕잡아 보는 것은 근시안적인 일이라고 지적한다. 그는 마찬가지로, 일본의 준비가 다만 일본의 고압적인 외교에 정신적 뒷받침을 주려는 칼자루 흔들기에 지나지 않는다는 믿음 위에 미국의 정책을 세우는 것도 근시안적인 일이 되리라고 덧붙인다. 미국과의 무력 충돌을 피할 수 없게 만들지도 모를 일본의 행동은 위험하고 극적인 돌연함으로 올 수 있다.\n\n그루", "secondary": "[Substance]\n\nTokyo, November 3, 1941—3 p.m.\n[Received 4:19 p.m. [주36] ]\n\n1736. The Ambassador reports for Secretary Hull and Under Secretary Welles as follows:\n\n(1)\n\nHe cites a leading article from the Tokyo Nichi Nichi of November 1 (reported in telegram No. 1729 of that date [주37] ), adding that a banner headline declaring “Empire Approaches Its Greatest Crisis” introduced a despatch from New York with a summary of a statement the Japanese Embassy reportedly gave to the New York [702면] Times regarding the need of ending the United States–Japanese economic war. Both the article and the Nichi Nichi editorial (see telegram of November 1, 7 p.m. [주37a] ) are believed to be close reflections of Japanese sentiments at present.\n\n(2)\n\nThe Ambassador refers to his various telegraphic reports during several months past analyzing the factors affecting policy in Japan and says he has nothing to add thereto nor any substantial revision to make thereof. In his opinion, a conclusive estimate may be had of Japan’s position through the application to the existing situation and the immediate future of the following points:\n\n(a)\n\nIt is not possible for Japan to dissociate either Japan or the conflict with China from the war in Europe and its fluctuations.\n\n(b)\n\nIn Japan political thought ranges from medieval to liberal ideas and public opinion is thus a variable quantity. The impact of events and conditions beyond Japan may determine at any given time which school of thought shall predominate. (In the democracies, on the other hand, owing to a homogeneous body of principles which influence and direct foreign policy and because methods instead of principles are more likely to cause differences of opinion, public opinion is formed differently.) For example, in Japan the pro-Axis elements gained power following last year’s German victories in Western Europe; then Japanese doubt of ultimate German victory was created by Germany’s failure to invade the British Isles, this factor helping to reinforce the moderate elements; and finally Germany’s attack on the Soviet Union upset the expectation of continued Russo-German peace and made the Japanese realize that those who took Japan into the Tripartite Alliance had misled Japan.\n\n(c)\n\nAn attempt to correct the error of 1940 may be found in the efforts to adjust Japanese relations with the United States and thereby to lead the way to conclusion of peace with China, made by Prince Konoye and promised by the Tojo Cabinet. If this attempt fails, and if success continues to favor German arms, a final, closer Axis alinement may be expected.\n\n(d)\n\nThe Embassy in Japan has never been convinced by the theory that Japan’s collapse as a militaristic power would shortly result from the depletion and the eventual exhaustion of Japan’s financial and economic resources, as propounded by many leading American economists. Such forecasts were unconsciously based upon the assumption that a dominant consideration would be Japan’s retention of the capitalistic system. The outcome they predicted has not transpired, although it is true that the greater part of Japan’s commerce has been lost, Japanese industrial production has been drastically curtailed, and Japan’s national resources have been depleted. [703면] Instead, there has been a drastic prosecution of the process to integrate Japan’s national economy, lacking which there might well have occurred the predicted collapse of Japan. What has happened to date therefore does not support the view that continuation of trade embargoes and imposition of a blockade (proposed by some) can best avert war in the Far East.\n\n(3)\n\nThe Ambassador mentions his telegram No. 827, September 12, 1940 [주38] (which reported the “golden opportunity” seen by Japanese army circles for expansion as a consequence of German triumphs in Europe). He sent this telegram under circumstances and at a time when it appeared unwise and futile for the United States to adopt conciliatory measures. The strong policy recommended in the telegram was subsequently adopted by the United States. This policy, together with the impact of world political events upon Japan brought the Japanese Government to the point of seeking conciliation with the United States. If these efforts fail, the Ambassador foresees a probable swing of the pendulum in Japan once more back to the former Japanese position or even farther. This would lead to what he has described as an all-out, do-or-die attempt, actually risking national hara-kiri, to make Japan impervious to economic embargoes abroad rather than to yield to foreign pressure. It is realized by observers who feel Japanese national temper and psychology from day to day that, beyond peradventure, this contingency not only is possible but is probable.\n\n(4)\n\nIf the fiber and temper of the Japanese people are kept in mind, the view that war probably would be averted, though there might be some risk of war, by progressively imposing drastic economic measures is an uncertain and dangerous hypothesis upon which to base considered United States policy and measures. War would not be averted by such a course, if it is taken, in the opinion of the Embassy. However, each view is only opinion, and, accordingly, to postulate the correctness of either one and to erect a definitive policy thereon would, in the belief of the Embassy, be contrary to American national interests. It would mean putting the cart before the horse. The primary point to be decided apparently involves the question whether war with Japan is justified by American national objectives, policies, and needs in the case of failure of the first line of national defense, namely, diplomacy, since it would be possible only on the basis of such a decision for the Roosevelt administration to follow a course which would be divested as much as possible of elements of uncertainty, speculation, and opinion. The Ambassador does not doubt that such a decision, irrevocable as it might well prove to [704면] be, already has been debated fully and adopted, because the sands are running fast.\n\n(5)\n\nThe Ambassador emphasizes that, in the above discussion of this grave, momentous subject, he is out of touch with the intentions and thoughts of the Administration thereon, and he does not at all mean to imply that Washingon is pursuing an undeliberated policy. Nor does he intend to advocate for a single moment any “appeasement” of Japan by the United States or recession in the slightest degree by the United States Government from the fundamental principles laid down as a basis for the conduct and adjustment of international relations, American relations with Japan included. There should be no compromise with principles, though methods may be flexible. The Ambassador’s purpose is only to ensure against the United States becoming involved in war with Japan because of any possible misconception of Japan’s capacity to rush headlong into a suicidal struggle with the United States. While national sanity dictates against such action, Japanese sanity cannot be measured by American standards of logic. The Ambassador sees no need for much anxiety respecting the bellicose tone and substance at present of the Japanese press (which in the past several years has attacked the United States intensely in recurrent waves), but he points out the shortsightedness of underestimating Japan’s obvious preparations to implement an alternative program in the event the peace program fails. He adds that similarly it would be shortsighted for American policy to be based upon the belief that Japanese preparations are no more than saber rattling, merely intended to give moral support to the high pressure diplomacy of Japan. Action by Japan which might render unavoidable an armed conflict with the United States may come with dangerous and dramatic suddenness.\n\nGrew", "notes": ["[주36] 7개 부(部)로 된 전보.", "[주37] 수록하지 않음.", "[주37a] 수록하지 않음.", "[주38] 수록하지 않음."], "warn": false, "pages": ["0768", "0769", "0770"], "search": "Grew 그루(Joseph Grew, 주일대사) Hull 헐(Cordell Hull, 국무장관) Welles 웰스(Sumner Welles, 국무차관) Konoye 고노에(近衞文麿) Tojo 도조(東條英機) Roosevelt 루스벨트"}, {"id": "d380", "order": 380, "date": "1941-11-04", "group": "C", "eyebrow": "d380 · Memorandum by the Ambassador in Japan (Grew)", "title": "주일대사 그루의 각서", "badge": null, "list_right": "문서 380", "meta": [{"k": "일자", "v": "1941-11-04"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2625", "txt": true}, {"k": "발신", "v": "The Ambassador in Japan (Grew) 주일대사 그루(Joseph Grew)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 380 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d380"}], "summary": "워싱턴으로 떠나기 전날 저녁 구루스 특사가 그루 대사를 찾아와, 자기 사명이 노무라 대사를 돕는 데 있다고 말한다.", "points": ["구루스는 이튿날 이른 아침 일본 비행기로 광둥을 거쳐 홍콩으로 떠나기에 앞서 그루를 찾아왔다.", "구루스는 워싱턴으로 가라는 외무대신의 뜻을 바로 전날에야 들었고, 그 뒤로 사명에 관한 공문서를 검토해 왔다고 말했다.", "구루스는 자기가 가는 것은 다만 새로운 관점을 가져와 현재의 어려운 정세에서 일본 대사를 돕기 위함이며, 일본과 미국 두 정부 사이의 회담을 성공적으로 매듭짓기 위해 손대지 않은 돌이 하나도 남지 않게 하기 위함이라고 했다.", "구루스는 외무성 미국국 제1과장 유키 시로지를 비서로 데려간다고 했다. 유키는 워싱턴 회담의 경과에 밝다.", "각주는 구루스를 「전 주독 일본대사」로 적고 있다."], "primary": "[도쿄,] 1941년 11월 4일.\n\n내일 이른 아침 일본 비행기로 광둥을 거쳐 홍콩으로 떠나기에 앞서, 구루스(来栖三郎, Kurusu) 씨[주38a]가 오늘 저녁 나를 찾아왔다. 그는 바로 어제 외무대신이 그가 워싱턴으로 가기를 바란다는 말을 들은 이래로 줄곧 자기 사명과 관련된 공문서들을 검토해 왔다고 말했다. 구루스 씨는 자기가 가는 것은 다만 새로운 관점을 가져옴으로써 현재의 어려운 정세에서 일본 대사를 돕기 위함이며, 또한 일본 정부와 미국 정부 사이에 진행 중인 회담을 성공적으로 매듭짓기 위한 노력에서 [705면] 뒤집어 보지 않은 돌이 하나도 남지 않도록 하기 위함이라고 알려 주었다.\n\n구루스 씨는 유키 시로지(Shiroji Yuki) 씨를 자기 비서로 데려간다고 말했다. 유키 씨는 외무성 미국국 제1과장으로서 대사관에 매우 큰 도움을 주어 왔고 워싱턴 회담의 전개에 밝은 사람이다.\n\nJ[oseph] C. G[rew] 조지프 C. 그루", "secondary": "[Tokyo,] November 4, 1941.\n\nBefore leaving for Hong Kong via Canton by Japanese plane early tomorrow morning, Mr. Kurusu [주38a] called to see me this evening. He said that he has been studying the official papers in connection with his mission to the United States ever since he had been told, only yesterday, of the Foreign Minister’s desire that he proceed to Washington. Mr. Kurusu informed me that he is going simply to help the Japanese Ambassador in the present difficult situation by bringing a fresh point of view and in order that no possible stone be left [705면] unturned in the endeavor to bring to a successful conclusion the conversations being conducted between the Japanese and American Governments.\n\nMr. Kurusu said that he was taking with him as his secretary Mr. Shiroji Yuki who, as Chief of the First Section of the American Bureau of the Foreign Office, has been most helpful to the Embassy and is familiar with the development of the conversations in Washington.\n\nJ[oseph] C. G[rew]", "notes": ["[주38a] 구루스 사부로(Saburo Kurusu), 전 주독 일본대사."], "warn": false, "pages": ["0771"], "search": "Grew 그루(Joseph Grew, 주일대사) Kurusu 구루스(来栖三郎, Saburo Kurusu, 특사) Nomura 노무라(野村吉三郎, 주미대사) — 원문에는 「일본 대사」로만 나온다 Shiroji Yuki 유키 시로지(結城司郎次, 외무성 미국국 제1과장)"}, {"id": "d381", "order": 381, "date": "1941-11-07", "group": "A", "eyebrow": "d381 · Memorandum by the Ambassador in Japan (Grew)  The information contained in this memorandum was transmitted to the Department in telegram No. 1769, November 7, 1941, 11 p.m.", "title": "주일대사(그루)의 비망록", "badge": null, "list_right": "문서 381", "meta": [{"k": "일자", "v": "1941-11-07"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": "이 비망록의 내용은 1941년 11월 7일 오후 11시 전보 제1769호로 국무부에 타전되었다"}, {"k": "원문출처", "v": "711.94/2625", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 381 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d381"}], "summary": "도고 외상이 유력한 일본인을 통해 그루에게 간접적으로 전언을 보내, 도조 내각이 양보의 한계를 정했으나 그것이 부족하다 하더라도 워싱턴 회담이 결렬되어서는 안 된다고 전한다.", "points": ["현 정부와 긴밀히 접촉하는 어느 유력한 일본인이 도고 외상의 요청으로 그루를 찾아왔다.", "외상은 자신이 바라는 만큼 자유롭게 말할 수 없다고 느껴 간접적으로 제안을 보내는 방식을 택했다.", "전언의 요지는 이렇다. 도조 내각은 미국의 희망에 부응하려는 노력에서 갈 수 있는 한계를 정하였으나, 그 양보가 미국 정부에게 불충분하게 여겨지더라도 워싱턴 회담이 계속되고 결렬되지 않는 것이 지극히 중요하다.", "정보 제공자는 자기 개인의 의견이라며, 일본에 재앙적 영향을 미치고 있는 현 상황이 계속되면 일본 정부는 워싱턴 회담의 결렬을 막기 위해서라도 시간이 흐르면 미국의 견해를 받아들이는 데 동의할 수밖에 없게 될 것이라고 말했다.", "그루는 일본 언론의 호전적이고 격한 논조가 관계 조정 노력을 더 어렵게 만든다고 지적하고 이를 도고에게 전해 달라고 요청했다. 11월 5일 『재팬 타임스 앤드 애드버타이저』 사설, 미국이 「창녀처럼(like a harlot) 말하고 있다」고 한 어제 저녁 『니치니치』 기사 등이다.", "정보 제공자는 일본 신문에 너무 주의를 기울일 것이 아니라며, 겁먹은 개가 짖고 겁이 클수록 짖는 소리도 커진다고 비유하고, 지금 일본의 군부 세력은 눈앞에 열리는 전망에 겁먹고 있다고 했다.", "그는 미국이 일본인을 어른으로 여기는 것은 잘못이며 실상 그들은 아이들이므로 그에 맞게 다루어야 한다고, 우호적인 몸짓이나 말 한마디로 신뢰를 얻을 수 있으며 독일인은 이 일본인 심리의 측면을 정확히 진단하여 성공적으로 이용해 왔다고 말했다.", "그는 끝으로, 앞으로의 전개가 어떠하든 워싱턴 회담이 결렬되도록 두어서는 안 되며 그럴 경우 어떤 극단적이고 운명적인 결과가 올까 두렵다고 거듭 촉구했다."], "primary": "[도쿄,] 1941년 11월 7일.\n\n오늘 나는 현 정부와 긴밀한 접촉을 유지하고 있는 어느 유력한 일본인 [주40]의 방문을 받았는데, 그는 외상 도고(東郷茂徳, Togo) 씨의 요청으로 찾아왔다고 말하였다. 나의 정보 제공자는, 외상이 자기가 바라는 만큼의 자유로움을 가지고 나에게 자기 뜻을 표명할 수 없다고 느끼는 까닭에 다음과 같은 취지의 제안을 나에게 간접적으로 보내는 이 방법을 취하는 것이라고 나에게 말하였다. 즉, 도조(東條英機, Tojo) 내각은 미국의 희망에 부응하려는 노력에서 나아갈 수 있는 한계를 정하였으나, 그럼에도 불구하고 그 양보들이 미국 정부에 의해 불충분한 것으로 여겨지는 경우에도 워싱턴 회담이 계속되고 결렬되도록 방치되지 않는 것이 지극히 중요하다는 것이다.\n\n이어 나의 정보 제공자는, 자기 개인의 의견이라고 언명하였으나 외상의 의견을 반영하는 것일 수도 있고 아닐 수도 있는 바를 말하였다. 그는, 일본에 재앙적 영향을 미치고 있는 현재의 상황이 계속된다면, 일본 정부는 시간이 흐르는 가운데, 오직 워싱턴 회담의 결렬을 막기 위해서라도, 미국의 견해를 받아들이는 데 동의하지 않을 수 없게 될 것이라고 진술하였다. 나는 나의 정보 제공자에게 말하고 또 그것을 도고 씨에게 전해 줄 것을 요청하였는데, 미국에 관한 일본 언론의 현재의 호전적이고 격렬한 논조 — 특히 11월 5일 『재팬 타임스 앤드 애드버타이저』에 실린 사설과 미국이 창녀처럼 말하고 있다고 비난한 어제 저녁 『니치니치』의 기사, 그 밖의 것들 — 는, 이러한 사나운 기사들, 그중에서도 일본 외무성의 태도를 표명하는 것으로 알려진 [706면] 『재팬 타임스 앤드 애드버타이저』의 기사들을 일본 정부의 의견을 정확히 반영하는 것으로 당연히 여기는 미국의 여론에 비추어, 양국 관계를 조정하려는 우리의 노력을 더욱 어렵게 만들고 있다는 것이었다. 나의 정보 제공자는 나의 소견을 도고 씨에게 되풀이해 전하고 문제의 기사들에 그의 주의를 환기하겠다고 약속하였다.\n\n나의 정보 제공자는 일본 신문에 지나치게 주의를 기울여서는 안 된다고 말하며, 비유적으로 겁먹은 개는 짖는 법이고 겁이 클수록 짖는 소리도 커진다고, 그리고 현재 일본의 군부 세력은 자기들 앞에 열리고 있는 전망에 겁을 먹고 있다고 덧붙였다. 그는 이어서, 미국이 일본인을 어른으로 여기는 것은 잘못이라고 말하였다. 실제로 그들은 아이들이며 그에 걸맞게 다루어져야 한다. 그들의 신뢰는 우호적인 몸짓이나 말 한마디로 얻을 수 있다. 독일인은 일본인 심리의 이러한 측면을 정확히 진단하였고 그것을 성공적으로 이용하여 왔다.\n\n끝으로 나의 정보 제공자는, 앞으로의 전개가 어떠하든 워싱턴 회담이 결렬되도록 방치되어서는 안 된다고 다시 한 번 촉구하였는데, 그러한 사태가 벌어질 경우 어떤 극단적이고 운명적인 결과가 있을까 두렵기 때문이라고 하였다.\nJ[oseph] C. G[rew]", "secondary": "[Tokyo,] November 7, 1941.\n\nI received a visit today from a leading Japanese [주40] who maintains close contacts with the present government and who said he was calling at the request of Mr. Togo, the Foreign Minister. My informant told me that inasmuch as the Foreign Minister felt he could not express himself to me with the freedom which he desired, he was taking this means of sending me indirectly a suggestion along the following lines: The Tojo government has decided the limits to which it will be possible to go in an endeavor to meet the desires of the United States, but nevertheless should these concessions be regarded as inadequate by the Government of the United States it is of the highest importance that the Washington conversations be continued and not permitted to break down.\n\nMy informant then went on to express what he declared were his own personal opinions but which may or may not reflect the opinions of the Foreign Minister. He stated that if the present situation which was having a calamitous effect upon Japan were continued, the Japanese Government in the course of time would be compelled to agree to accept the views of the United States if only in order to prevent the breakdown of the conversations in Washington. I told my informant, and requested him to pass it on to Mr. Togo, that the present bellicose and violent tone of the Japanese press in regard to the United States, such as in particular the editorial published in the Japan Times and Advertiser on November 5 and the article in the evening Nichi Nichi yesterday which charged that the United States was talking like a harlot, and others, were rendering more difficult our efforts to adjust relations between our two countries in view of public opinion in the United States which naturally regards these truculent articles, and especially those of the Japan Times and Advertiser [706면] which is known to express the attitudes of the Japanese Foreign Office, as accurately reflecting the opinion of the Japanese Government. My informant promised to repeat my observations to Mr. Togo and to draw his attention to the articles in question.\n\nMy informant said that too much attention should not be paid to Japanese newspapers and added metaphorically that frightened dogs bark and the greater the fright the louder the bark, and that at present the military party in Japan are frightened by the prospects opening up before them. He went on to say that it is a mistake for the United States to regard the Japanese as adults. In reality they are children and should be treated accordingly. Their confidence can be gained by a friendly gesture or word. The Germans have correctly diagnosed this aspect of Japanese psychology and have utilized it successfully.\n\nIn conclusion my informant again urged that irrespective of future developments the Washington conversations must not be permitted to break down since in such an event he was fearful of some drastic and fateful results.\n\nJ[oseph] C. G[rew]", "notes": ["[주39] 이 비망록에 담긴 정보는 1941년 11월 7일 오후 11시 전보 제1769호로 국무부에 타전되었다.", "[주40] 「유력한 일본인이자 믿을 만한 정보 제공자.」"], "warn": false, "pages": ["0772"], "search": "그루(Joseph C. Grew) — 주일 미국대사, 비망록 작성자 도고(東郷茂徳, Togo) — 외상 도조(東條英機, Tojo) — 총리"}, {"id": "d382", "order": 382, "date": "1941-11-07", "group": "A", "eyebrow": "d382 · Memorandum of a Conversation", "title": "회담 비망록", "badge": null, "list_right": "문서 382", "meta": [{"k": "일자", "v": "1941-11-07"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/25403/35", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 382 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d382"}], "summary": "노무라가 도조 신내각의 훈령을 받아 회담 재개를 청하며 병력 배치와 무차별 원칙에 관한 문서를 건네고, 헐은 중국과의 진정한 화해라는 착상을 내놓는다.", "points": ["노무라가 자기 요청으로 국무장관의 아파트를 방문했다. 와카스기가 동행했다.", "헐이 먼저 하얼빈에서 만주 당국에 구금된 미국인 선교사 세 사람 문제를 꺼냈다.", "헐은 선교사 사건과 극단적 정책을 주장하는 일본 언론 보도가 미국 내에서 대일 논의를 어렵게 만들고 있다고 말했다.", "노무라는 새 내각 성립 이후 확실한 훈령이 없어 면담을 청하지 않았으나 이제 훈령을 받았으므로 회담을 재개하고자 한다고 말했다.", "일본 신내각은 6월 21일자 미국 초안을 면밀히 검토하여, 극동 정세와 일본 여론을 고려한 한도에서 최대의 양보를 하려 했다고 한다.", "노무라는 세 쟁점 가운데 삼국동맹상의 일본의 의무와 국제 통상의 무차별 두 가지는 견해를 맞추기 어렵지 않으리라 보나, 화북·내몽골에 일정 병력을 얼마간 남기려는 문제는 합의가 더 어렵다고 인정했다.", "노무라는 자신의 실책 가능성을 줄이기 위해 경험 있는 외교관의 조력을 요청했고, 이에 따라 구루스가 파견된다고 알리며 대통령의 접견을 희망했다.", "노무라가 건넨 문서의 항목은 이렇다. 「일본군의 배치」 (A) 중국에서의 일본군 주둔과 그 철수, (B) 프랑스령 인도차이나에서의 일본군 주둔과 그 철수, 그리고 「무차별 원칙」이다.", "헐이 중국에 남길 병력 비율을 묻자 노무라는 직접 답하지 않고 의화단 의정서상의 권리, 외몽골 소련군에 대한 「균형추」로서의 내몽골 주둔을 들었다.", "헐이 착상을 내놓는다. 중국이 일본과 진정한 우호를 원한다고 말한다면, 칼끝으로 유지되지 않는 화해와 우호의 새 정책이야말로 일본이 극동에서 진정한 도의적 지도력을 얻을 기회가 아니겠는가.", "헐은 라틴아메리카 주둔 정책을 포기하여 미국이 얻은 이익과 무역 증대를 다시 들었다.", "추축국 관계에 대해 헐은 도움이 될 구체적 성명을 바랐고, 노무라는 더 이상의 성명이 필요해 보이지 않는다고 했으나 헐은 일본에 새 정부가 들어서면 현 내각의 태도 표명으로는 사태를 감당하지 못할 수 있다고 지적했다.", "노무라는 본국이 국내 정세를 위급하게 보고 있다며 검토를 서둘러 달라고 하고, 대통령에게 견해를 개진하라는 훈령을 받았다며 면담 주선을 청했다.", "논의의 기초가 될 문서를 확인한다. 미국 6월 21일자, 일본 9월 25일자, 그리고 헐이 덧붙인 미국 10월 2일자다."], "primary": "[워싱턴,] 1941년 11월 7일.\n\n일본 대사가 자기 요청으로 국무장관의 아파트를 방문했다.[주41] 대사가 방문 목적에 관하여 무슨 말을 꺼내기 전에, 국무장관이 먼저 하얼빈에서 만주 당국에 구금된 미국인 선교사 세 사람의 문제를 일본 대사와 논의하였다. 이는 별도의 비망록에서 다룬다.[주42]\n\n이어 국무장관은, 앞서 말한 선교사와 관련된 것과 같은 사태나, 극단적 정책을 주창하는 일본 언론의 발언이 여러 신문 보도로 이 나라에 실리는 일이 일본 정부와의 논의와 관련하여 이쪽에서 우리의 어려움을 키운다고 말했다. 그는 여러 사람이 계속 자기를 찾아와 이런 보도들을 언급하고는, 문제의 보도들이 드러내는 것과 같은 상황에 비추어 미국 정부가 어떻게 일본과의 관계 개선을 기대할 수 있느냐고 묻는다고 말했다.\n\n대사는 새 내각이 들어선 뒤로는 확실한 훈령을 받지 못하였고 따라서 국무장관의 시간을 뺏고 싶지 않아 면담을 청하지 않았다고 말했다. 그는 이제 훈령을 받았으며 [707면] 그에 따라 회담을 재개하기를 바란다고 말했다.\n\n대사는, 일본의 새 내각이 두 정부 사이의 해결안의 여러 조항을 매우 신중하게 숙의하였으며, 극동 정세와 일본 여론의 태도를 충분히 고려한 위에서 할 수 있는 최대한의 양보를 하고자 6월 21일자 우리 초안을 매우 면밀히 검토하였다고 말했다. 그는 양측의 견해가 갈렸던 세 가지 주요 문제를 언급하면서, 그 가운데 두 가지, 곧 삼국동맹에 따른 일본의 의무와 국제 통상 관계에서의 무차별에 관해서는 양측의 견해를 조화시키기가 어렵지 않으리라 본다고 말했다. 화북과 내몽골에 일정 수의 병력을 얼마 동안 남겨 두고자 하는 일본 정부의 희망 문제에 관해서는, 합의에 이르는 어려움이 더 크다는 것을 자신도 안다고 말했다.\n\n이어 대사는, 사태가 중대한 만큼 자신의 책임을 매우 무겁게 느끼고 있으며 자기 쪽에서 어떤 실책을 저지를 가능성을 최소한으로 줄이기 위하여 일본 정부에 경험 있는 외교관의 조력을 요청하였고, 그 요청에 따라 정부가 자신을 돕도록 구루스 씨를 보내고 있다고 말했다. 대사는 구루스 씨가 개인 자격의 대사 격(personal ambassadorial rank)을 지니고 있음에 비추어 대통령이 구루스 씨를 접견해 주기를 바란다는 뜻을 밝혔다.\n\n이어 대사는 국무장관에게 문서 한 통을 건넸는데, 그 사본이 첨부되어 있다.[주43] 거기에는 다음과 같은 표제가 붙은 방식안(formulas)이 담겨 있었다.\n\n> 「일본군의 배치\n>\n> (A)\n>\n> 중국에서의 일본군 주둔 및 그 철수:\n>\n> (B)\n>\n> 프랑스령 인도차이나에서의 일본군 주둔 및 그 철수:\n>\n> 무차별 원칙」\n\n국무장관은 그 문서를 훑어보고, 현재 중국에 있는 일본군 가운데 어느 정도 비율을 그곳에 남겨 두자는 것인지 물었다. 일본 대사는, 국무장관도 알다시피 일본은 의화단 의정서에 따라 이미 베이핑·톈진 지역에 군대를 주둔시킬 권리를 가지고 있으며, 소련이 외몽골에 군대를 두고 있으므로 그 군대에 대한 「균형추(equipoise)」로서 내몽골에 일본군을 주둔시키기를 바란다고 대답했다. 대사는 국무장관의 구체적인 질문에는 직접 대답하지 않은 채, 다른 나라들이 중국에 유지하고 있는 병력을 언급하고, 또 장제스(蔣介石, Chiang Kai-shek)가 처음 상하이에 들어왔을 때[주44] 영국이 일본에 상하이에서 공동 행동을 취하자고 요청했으나 일본은 이를 거절했다고 말했다. 그는 일본이 그처럼 온건한 태도를 취했음에도 그 뒤 곧 중국의 격렬한 배일 불매 운동의 대상이 되었다고 말했다.\n\n국무장관은, 자신이 중국 대사에게 우리가 일본과 탐색적 회담을 하고 있다고 말하기는 했으나 우리가 논의하고 있는 여러 점의 내용은 전혀 알려 주지 않았다고 말했다. 그러고는 일본 대사에게, 자신이 여러 차례 일본 대사에게 말한 바와 같이 우리는 어떠한 정식 교섭에 들어가기 전에 중국·영국·네덜란드와 이 문제를 논의할 생각임을 다시 일깨웠다. 국무장관은 방금 한 가지 생각이 떠올랐는데 아직 아무와도 논의한 바 없다고 하면서 이렇게 말했다 — 만약 중국이 지금 일본과 진정한 우호를 바라며 평화적인 길을 따라 함께 일하기 위하여 힘닿는 모든 것을 하겠다고 말한다고 하자, 그렇다면 이것은 일본이 진정한 신질서, 곧 일본이 극동에서 참된 도의적 지도력을 얻게 될 그러한 질서로 나아갈 훌륭한 기회가 되지 않겠는가? 히틀러가 자기 국민을 벼랑으로 이끌고 있고 유럽이 무정부 상태의 위협을 받고 있는 이때에, 칼끝으로 유지되는 것이 아닌 대중국 화해와 우호의 새로운 정책을 일본이 채택한다면, 그것이야말로 일본과 미국이 세계를 구하기 위하여 협력할 수 있는 진취적 지도력의 진정한 기회를 일본에 주는 것이 아니겠는가? 대사와 와카스기 씨는 이 제안에 매우 깊은 인상을 받은 듯하였고, 본국 정부에 회부하여 검토하게 하겠다고 말했다. 대사는 자신은 국무장관의 정책이 현명하다고 개인적으로 확신하며, 일본에 돌아가 은퇴하게 되면 중국에 일본군을 남겨 두자는 따위의 시대에 뒤떨어진 생각에서 벗어나는 방향으로 자신의 영향력을 쓰겠다고 말했다. 국무장관은 라틴아메리카 나라들에 군대를 주둔시키던 종전 정책을 포기함으로써 미국 정부가 얻은 이익을 다시 짚었다. 그는 그 나라들과의 미국 무역이 크게 늘어난 것을 언급하였다. 그는 일본이 중국에 대하여 넓은 폭의 자유주의적 정책을 채택한다면 무역과 번영의 면에서 헤아릴 수 없는 이익을 얻게 되리라고 확신한다는 뜻을 밝혔다.\n\n일본과 추축국들의 관계 문제에 관하여, 국무장관은 우리에게 도움이 될 어떤 구체적인 성명이 마련될 수 있기를 바란다는 뜻을 밝혔다. 대사는, 태평양 지역의 평화를 유지하기를 명백히 바라고 있는 일본 정부의 태도를 [709면] 고려하면 이미 낸 것 이상의 어떠한 성명도 필요하다고는 여겨지지 않는다는 견해를 밝혔다. 국무장관은, 현 일본 내각의 태도를 그렇게 표명하는 것으로는 일본에 어떤 새로운 정부가 들어설 경우의 사태를 감당하지 못할 수도 있다고 지적하였다.\n\n대사는, 일본 정부가 본국의 정세를 위급하다고 보고 있어 문제가 급박한 만큼, 대사가 우리에게 두고 간 문서에 대한 우리의 검토를 서둘러 주기를 바란다는 뜻을 밝혔다. 대사는 대통령에게 자신의 견해를 개진하라는 훈령을 받았다고 덧붙이면서, 국무장관에게 면담 약속을 주선해 주면 고맙겠다고 청했다. 대사는 대통령의 시간을 많이 빼앗지는 않을 것이며, 대통령의 시간을 아끼기 위하여 문서로 된 서류를 제시하겠다고 말했다. 국무장관은 대사의 요청에 기꺼이 응하겠다고 말했다. 그는 대사에게, 대사가 제시한 문서는 앞서 교환된 문서들과 함께 놓고 보아야 하는 것인지 물었다. 대사는 그렇다고 대답했다. 대사는 우리의 6월 21일자 문서와 자기들의 9월 25일자 문서가 있다고 말했다. 국무장관은 「그리고 우리의 10월 2일자 문서」라고 덧붙였다.\n\nJ[oseph] W. B[allantine]", "secondary": "[Washington,] November 7, 1941.\n\nThe Japanese Ambassador called at his request at the Secretary’s apartment. [주41] Before the Ambassador had said anything in regard to the purpose of his call the Secretary took up with the Japanese Ambassador the question of three American missionaries who had been taken into custody by the Manchurian authorities at Harbin, as referred to in a separate memorandum. [주42]\n\nThe Secretary then went on to say that situations like that relating to the missionaries referred to and the publication in this country of various press reports of utterances in the Japanese press advocating extremist policies increased our difficulties over here in connection with our discussions with the Japanese Government. He said that various people keep coming to him, refer to these reports and then ask how this Government can expect to improve relations with Japan in view of a situation such as the reports under reference revealed.\n\nThe Ambassador said that since the advent of the new Cabinet he had not sought to talk with the Secretary as he had had no definite instructions and as he consequently did not wish to take up the Secretary’s time. He said that he had now received instructions [707면] and that in accordance therewith he desired to resume the conversations.\n\nThe Ambassador said that the new Cabinet in Japan had deliberated very carefully upon the various provisions of a proposed settlement between our two Governments and had examined very carefully our draft of June 21 with a view to making the utmost concessions that they could make, having due regard for the situation in the Far East and of the attitude of public opinion in Japan. He referred to the three principal questions on which our respective views had diverged and he said that, with regard to two of those questions, namely, Japan’s obligations under the Tripartite Pact and nondiscrimination in international commercial relations, he thought that it would not be difficult to reconcile our views. In regard to the question of the desire of the Japanese Government to retain for some time a certain number of troops in north China and Inner Mongolia, he said he realized that difficulties of reaching an agreement were greater.\n\nThe Ambassador then went on to say that in view of the gravity of the situation he was very conscious of his responsibility and in order to minimize the possibility of any blunder on his part he had asked the Japanese Government for the assistance of an experienced diplomatist and that in accordance with his request the Government was sending Mr. Kurusu to assist him. The Ambassador expressed the hope that in view of Mr. Kurusu’s personal ambassadorial rank the President would receive Mr. Kurusu.\n\nThe Ambassador then handed the Secretary a document, copy of which is attached, [주43] containing formulas captioned as follows:\n\n“Disposition of Japanese forces\n\n(A)\n\nStationing of Japanese forces in China and the withdrawal thereof:\n\n(B)\n\nStationing of Japanese forces in French Indochina and the withdrawal thereof:\n\nPrinciple of non-discrimination”\n\nThe Secretary glanced over the document and inquired what proportion of the Japanese troops now in China Japan would propose to retain there. The Japanese Ambassador replied that, as the Secretary was aware, Japan already had the right under the Boxer Protocol to station troops in the Peiping and Tientsin areas; that as the Soviets had troops in Outer Mongolia the stationing of Japanese troops in Inner Mongolia was desired as an “equipoise” to those troops. The Ambassador, without making any direct reply to the Secretary’s specific question, went on to refer to armed forces maintained by other countries in China and he said also that when Chiang [708면] Kai-shek first entered Shanghai [주44] the British had asked the Japanese to take joint action with them at Shanghai, but that the Japanese had declined to do so. He said that notwithstanding the moderate attitude of the Japanese, the Japanese soon thereafter became the object of a bitter Chinese boycott campaign.\n\nThe Secretary said that, although he had told the Chinese Ambassador that we were having exploratory conversations with the Japanese, he had not acquainted the Chinese Ambassador with any of the substance of the points we were discussing. He then recalled to the Japanese Ambassador that, as he had on numerous occasions said to the Japanese Ambassador, we proposed before entering into any formal negotiations to discuss the matter with the Chinese and the British and the Dutch. The Secretary said that an idea had just occurred to him which he had so far discussed with no one, namely, supposing the Chinese were now to say that they desired a real friendship with Japan and would do everything in their power to work together along peaceful ways, would not this be a wonderful opportunity for Japan to launch forth on a real new order, an order in which Japan would gain her real moral leadership in the Far East? At a time when Hitler was leading his people over a precipice and when Europe was threatened with anarchy, would not the adoption by Japan of a new policy of conciliation and friendship with China not maintained at a sword’s point provide Japan with a real opportunity for progressive leadership in which Japan and the United States could cooperate to save the world? The Ambassador and Mr. Wakasugi appeared to be very much impressed with this suggestion and said that they would refer it to their Government for its consideration. The Ambassador said that he was personally convinced of the wisdom of the Secretary’s policies and that when he went back to Japan and retired he would use his influence in a direction away from outmoded ideas such as would call for the retention of Japanese troops in China. The Secretary reviewed again the advantages which this Government had derived from renouncing its previous policies of stationing armed forces in Latin-American countries. He mentioned the great increase that had taken place in United States trade with those countries. He expressed the conviction that if Japan should adopt a broad-gauge liberal policy in relation to China Japan would derive incalculable advantage in the way of trade and prosperity.\n\nWith reference to the question of Japan’s relations to the Axis powers, the Secretary expressed the hope that some concrete statement could be worked out which would help us. The Ambassador expressed the view that, considering the attitude of the Japanese Government [709면] which manifestly desired to maintain peace in the Pacific area, it did not seem to him that any further statement was necessary than had already been made. The Secretary pointed out that such manifestations of the attitude of the present Japanese Cabinet might not cover the situation should some new government come into power in Japan.\n\nThe Ambassador expressed the hope that, in view of the urgency of the matter, as the Japanese Government considered the situation critical at home, we would expedite our study of the document which the Ambassador had left with us. The Ambassador added that he had been instructed to present his views to the President and asked the Secretary if he would be so kind as to arrange an appointment. The Ambassador said that he would not take up much of the President’s time but would present him with a written document in order to conserve the President’s time. The Secretary said that he would be glad to comply with the Ambassador’s request. He asked the Ambassador whether the document which the Ambassador had presented was to be taken in conjunction with the previous documents which had been exchanged. The Ambassador replied in the affirmative. The Ambassador said that there was our document of June 21 and their document of September 25. The Secretary added “and our document of October 2”.\n\nJ[oseph] W. B[allantine]", "notes": ["[주41] 와카스기 씨가 대사를 수행했다.", "[주42] 수록하지 않음.", "[주43] 아래 문서.", "[주44] 1927년 3월."], "warn": false, "pages": ["0773", "0774", "0775"], "search": "노무라(野村吉三郎, Nomura) — 주미 일본대사 헐(Cordell Hull) — 국무장관 와카스기(若杉要, Wakasugi) — 주미 일본공사 구루스(来栖三郎, Kurusu) — 특사 밸런타인(Joseph W. Ballantine) — 비망록 작성자 장제스(蔣介石, Chiang Kai-shek) 히틀러(Adolf Hitler) 루스벨트(Franklin D. Roosevelt) — 대통령 (본문에 직위로만 등장) 후스(胡適) — 주미 중국대사 (본문에 「중국 대사」로만 등장)"}, {"id": "d383", "order": 383, "date": "1941-11-07", "group": "C", "eyebrow": "d383 · Document Handed by the Japanese Ambassador (Nomura) to the Secretary of State on November 7, 1941", "title": "1941년 11월 7일 일본대사(노무라)가 국무장관에게 건넨 문서", "badge": null, "list_right": "문서 383", "meta": [{"k": "일자", "v": "1941-11-07"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "11.94/25403/35", "txt": true}, {"k": "발신", "v": "노무라(野村吉三郎, Nomura) — 주미 일본대사", "txt": true}, {"k": "수신", "v": "헐(Cordell Hull) — 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 383 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d383"}], "summary": "중국과 프랑스령 인도차이나 주둔 일본군의 처리, 그리고 무차별 원칙에 관한 일본 측 문안(가역).", "points": ["문서 자체가 「가역(Tentative translation)」이라고 밝히고 있다.", "중국 주둔군 가운데 화북과 몽강(내몽골)의 특정 지역 및 해남도의 부대는 중일 간 평화 관계가 회복된 뒤에도 일정한 소요 기간 주둔한다.", "그 밖의 부대는 중일 간 전반적 평화가 회복되는 즉시 철수를 개시하며, 철수는 중일 간 별도의 협정에 따라 진행되어 평화와 질서의 확립과 함께 2년 이내에 완료된다.", "일본 정부는 프랑스령 인도차이나의 영토주권을 보장할 것을 약속하며, 현재 주둔 중인 일본군은 중국사변이 해결되거나 동아시아에 공정한 평화가 수립되는 즉시 철수한다.", "일본 정부는 중국을 포함한 태평양 전역에 적용되는 국제 통상관계상의 무차별 원칙을 인정하되, 그 원칙이 전 세계의 나머지 지역에도 똑같이 적용된다는 양해 위에서 그러하다."], "primary": "1941년 11월 7일\n\n(가역(假譯))\n\n**일본군의 처리**\n\n(A) 중국에 대한 일본군의 주둔 및 그 철수:\n\n중국사변과 관련하여 중국에 파견된 일본군에 관하여는, 화북 및 몽강(내몽골)의 특정 지역과 해남도(하이난 섬)에 있는 부대들은 일본과 중국 사이에 평화적 관계가 회복된 뒤에도 일정한 소요 기간 동안 주둔한 채로 남는다. 그 밖의 모든 부대는 일본과 중국 사이에 전반적 평화가 회복되는 즉시 철수를 개시하며, 그 철수는 일본과 중국 사이의 별도의 협정에 따라 진행되고 평화와 질서의 확고한 확립과 함께 2년 이내에 완료된다.\n\n[710면]\n\n(B) 프랑스령 인도차이나에 대한 일본군의 주둔 및 그 철수:\n\n일본 정부는 프랑스령 인도차이나의 영토주권을 보장할 것을 약속한다. 현재 그곳에 주둔하고 있는 일본군은 중국사변이 해결되거나 동아시아에 공정한 평화가 수립되는 즉시 철수한다.\n\n**무차별의 원칙**\n\n일본 정부는 국제 통상관계에 있어서의 무차별 원칙이 중국을 포함한 모든 태평양 지역에 적용됨을 인정하되, 문제의 그 원칙이 전 세계의 나머지 전부에도 똑같이 적용된다는 양해 위에서 그러하다.", "secondary": "November 7, 1941\n\n(Tentative translation)\n\nDisposition of Japanese Forces\n\n(A) Stationing of Japanese forces in China and the withdrawal thereof:\n\nWith regard to the Japanese forces that have been despatched to China in connection with the China Affair, those forces in specified areas in North China and Mengchiang (Inner Mongolia) as well as in Hainan-tao (Hainan Island) will remain to be stationed for a certain required duration after the restoration of peaceful relations between Japan and China. All the rest of such forces will commence withdrawal as soon as general peace is restored between Japan and China, and the withdrawal will proceed according to separate arrangements between Japan and China and will be completed within two years with the firm establishment of peace and order.\n\n[710면]\n\n(B) Stationing of Japanese forces in French Indo-China and the withdrawal thereof:\n\nThe Japanese Government undertakes to guarantee the territorial sovereignty of French Indo-China. The Japanese forces at present stationed there will be withdrawn as soon as the China Affair is settled or an equitable peace is established in East Asia.\n\nPrinciple of Non-discrimination\n\nThe Japanese Government recognizes the principle of non-discrimination in international commercial relations to be applied to all the Pacific areas, inclusive of China, on the understanding that the principle in question is to be applied uniformly to the rest of the entire world as well.", "notes": [], "warn": false, "pages": ["0776"], "search": "노무라(野村吉三郎, Nomura) — 주미 일본대사 헐(Cordell Hull) — 국무장관"}, {"id": "d384", "order": 384, "date": "1941-11-10", "group": "A", "eyebrow": "d384 · Memorandum by the Ambassador in Japan (Grew)", "title": "주일대사(그루)의 비망록", "badge": null, "list_right": "문서 384", "meta": [{"k": "일자", "v": "1941-11-10"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2625", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 384 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d384"}], "summary": "도고 외상이 그루 대사에게 새 일본 제안(11월 7일 워싱턴 제출분)을 건네며 그것이 일본의 최대한의 양보라고 밝히고, 미국이 극동의 실상을 제대로 알지 못한다고 논박하며 경제 압박이 계속되면 일본 국민이 자위 조치에 나서지 않을 수 없다고 말한다.", "points": ["도고 외상은 10월 30일 회담을 상기시키며, 미일 우호 관계 유지는 실행 가능한 일이라고 굳게 생각하고 양국 관계를 우호적 기초 위에 재수립하고 태평양의 평화를 유지하는 데 온 힘을 쏟기로 결심했다고 말했다. 현 내각의 목적은 세계 평화에 대한 기여로서 「대동아」 건설 계획을 계속하는 것이라고 했다.", "새 제안이 작성되어 노무라 제독에게 보내졌으며, 노무라는 대통령 및 국무장관과 교섭(negotiations)에 들어가라는 훈령을 받았다고 했다. 그루가 미국 정부는 「예비적·탐색적 회담」임을 신중히 강조해 왔다고 가로막자, 도고는 그 사실을 잘 알지만 정식·공식 교섭에 들어갈 때가 되지 않았는가 싶다고 하면서도 그 점을 밀어붙이고 싶지는 않다고 했다.", "도고는 지금까지의 회담 기록을 검토하며 가장 절실히 느낀 것은 극동 정세의 실상에 관한 미국의 지식과 인식이 유감스럽게도 불충분하다는 점이라고 말했다. 헐이 일본을 극동의 안정 세력이라고 인정한 바 있으나 회담 내내 미국이 취한 입장은 그 사실과 조화되지 않는다고 했다.", "도고는 일본 인구가 약 1억으로 꾸준히 급증하고 있어 생존에 필요한 원료의 확보가 필요하다고 하고, 미국이 이를 정세의 실상으로 깨닫지 못하면 회담의 성공적 타결은 어려울 것이라고 했다.", "도고는 6개월 넘게 일본이 거듭 미국 견해에 다가서는 제안을 냈으나 미국은 일본 입장을 맞으러 아무 걸음도 떼지 않았고 아무것도 양보하지 않았으며 오히려 더 앞선 입장을 취했다고 하며, 「일본에 있는 우리로서는 미국 정부가 회담을 계속함에 있어 성의가 어느 정도인지 의심하게 된다」고 말했다.", "도고는 두 장의 종이(첨부)를 건네며 이를 새 일본 제안이라 설명했고, 이것이 일본이 할 수 있는 최대한의 양보를 담고 있다고 거듭 말했다. 새 안은 6월 21일 미국 초안에 대응하며, 9월 6일·25일 일본 문서의 요소를 담고 10월 2일 미국 각서의 입장에 되도록 맞추어 수정한 것이라고 했다.", "논평 (a) 유럽전 태도는 9월 25일 일본 초안에 기초해 견해 일치가 있었다는 것이 일본 정부의 이해다. (b) 경제상 무차별 문제는 새 제안이 미국의 요망을 충분히 충족한다고 본다. (c) 회담의 최대 장애였던 중국 주병·철병에 관하여 심각한 국내적 곤란에도 불구하고 최대한의 양보로 보아야 할 추가 양보를 했다. (d) 미영 협의와 관련하여, 미일 협정이 성립할 경우 같은 취지의 문서가 일본과 영국 사이에 동시에 체결되어야 하며 미국이 영국을 설득해 주기 바란다.", "도고는 워싱턴 회담과 병행하는 도쿄 회담을 단순한 중복으로 삼을 뜻은 없고, 워싱턴에서의 정보·의견 교환을 보완하여 진전을 앞당기는 것이어야 한다고 했다.", "그루는 세 가지를 제기했다. (1) 미국 정부가 극동 정세를 이해하지 못한다는 말에 동의하지 않는다. 대사관과 주미 일본대사가 완전히 명확한 관념을 전했을 것이다. (2) 「동아시아의 안정 세력」이라는 말은 매우 넓은 해석의 여지가 있다. (3) 일본이 필요한 물자에 접근해야 한다는 지적은 문제의 핵심을 찌른다. 현 회담의 근본 목적 가운데 하나가 무력 사용이 아니라 평화적 수단으로 일본이 그러한 물자와 자유로운 무역·시장을 얻을 길을 여는 것이며, 헐의 구상이 바로 그 요망 사항들을 담고 있다.", "도고는 미국의 자산 동결이 많은 중요 원료의 대일 공급을 끊었으며, 이런 성격의 경제적 압박은 직접적인 무력 사용보다 더 크게 국가의 존립을 위협할 수 있다고 하고, 일본 국민이 경제적 압박에 계속 노출되면 끝내는 단호히 자위 조치에 의지하지 않을 수 없다고 느낄 가능성을 미국이 깨닫기 바란다고 말했다.", "도고는 4년 넘는 적대 행위의 성과를 희생하라는 요구를 받으면 일본은 반드시 무너질 수밖에 없다고 말했고, 그루가 그 주장과 침략·무력 사용 자제 원칙 수락 사이의 명백한 모순을 지적하자, 일본은 침략 전쟁을 하는 것이 아니므로 침략의 성과를 유지하는 문제는 생기지 않는다고 답했다. 도고는 미국이야말로 자위를 내세워 국제법이 일반적으로 인정하는 범위를 넘는 조치를 취하고 있다는 인상을 받는다고 했다."], "primary": "[도쿄,] 1941년 11월 10일.\n\n외상[주45]은 10월 30일 나와 가졌던 회담을 상기시켰다. 그때 그는 미국과 일본 사이의 우호 관계 유지가 실행 가능한 일이라고 굳게 생각한다고 말했었다. 그는 이어서, 이 문제를 늘 생각해 왔으며 두 나라의 관계를 우호적인 기초 위에 다시 세우고 태평양의 평화를 유지하기 위해 온갖 노력을 기울이기로 결심했다고 말했다. 세계 평화에 대한 기여로서 「대동아」를 건설하는 계획을 계속하는 것이 현 내각의 목적이었다. 도고(東郷茂徳, Togo) 씨는 취임한 이래 지금까지 진행되어 온 회담에 관한 문서들을 집중적으로 연구해 왔다고 말했다. 새로운 제안이 작성되어 노무라(野村吉三郎, Nomura) 제독에게 보내졌으며, 노무라는 대통령 및 국무장관과 교섭에 들어가라는 훈령을 받았다는 것이었다. 나는 외상의 말을 가로막고, 우리 정부는 일본 정부와 「예비적이고 탐색적인 회담」을 하고 있다는 점을 신중히 강조해 왔다고 말했다. 도고 씨는 그 사실을 잘 알고 있으나 정식의 공식 교섭에 들어갈 때가 되지 않았는가 싶다고 답했다. 그러나 그는 그 점을 밀어붙이고 싶지는 않다고 말했다.\n\n도고 씨는 이어서, 아주 최근에 구루스(来栖三郎, Kurusu) 씨가 노무라 제독을 도와 회담을 이끌도록 워싱턴에 파견되었다고 말했다. [711면] 그는 이와 관련하여, 구루스 씨의 미국행을 도와 달라고 나에게 부탁했고 미국 정부와 내가 더없이 고마운 방식으로 응해 주었음을 상기시켰다. 그는 내가 우리 두 나라 사이의 우호 관계를 증진하려 애써 왔다는 것이 일본에 널리 알려져 있으며 그 방면의 내 노력이 온 나라에서 높이 평가받고 있다고 말했다. 그로서도 두 나라가 마주한 문제들을 서로 받아들일 수 있는 방식으로 해결할 길을 여는 데 나와 협력하기 위해 어떤 노력도 아끼지 않을 생각이었다.\n\n외상은 이어서, 지금까지 진행된 회담을 기록한 문서들을 훑어보며 가장 절실히 느낀 것은 극동 정세의 실상에 관한 미국의 지식과 인식이 유감스럽게도 불충분하다는 점이라고 말했다. 헐(Cordell Hull) 씨가 일본이 극동의 안정 세력임을 인정한 바 있으나, 회담 내내 미국이 취한 입장은 그 사실과 조화를 이루지 못했다. 일본이 4년 반 동안 중국과 적대 행위를 벌여 왔다는 사실을 미국 정부가 충분히 인식하지 않는 한, 일본이 극동의 안정 세력이라고 인정하는 것은 실제로는 아무 의미도 없을 것이다. 도고 씨는 헐 씨가 10월 16일 와카스기(若杉要, Wakasugi) 씨와의 회담에서, 일본을 안정 세력으로 인정하며 그러한 인정을 공식적인 방식으로 표명할 준비가 되어 있다고 사이토(斎藤博, Saito) 전 대사에게 말했던 일을 상기시켰다고 말했다.[주45a] 외상은 이어서, 이 나라의 인구가 꾸준히 그리고 급속히 늘어 지금은 약 1억이며, 그들의 생존에 필요한 원료를 확보하는 일이 필요하다고 말했다. 미국 정부가 이 사실을 정세의 실상 가운데 하나로 깨닫지 않는 한 회담의 성공적 타결은 어려우리라는 것이 그의 견해였다. 6개월이 넘는 기간 동안 진행된 회담에서 일본 정부는 미국의 견해에 다가서려는 제안을 거듭 내놓았으나, 미국 정부는 그 나름대로 일본의 입장을 맞으러 나오는 어떠한 걸음도 떼지 않았고 아무것도 양보하지 않았다 — 어쩌면 더 앞선 입장을 취했다. 사정이 그러하므로 「일본에 있는 우리로서는 미국 정부가 회담을 계속함에 있어 그 성의가 어느 정도인지 의심하게 된다」는 것이었다. 그는 국민 감정이 어떤 결론에 이르기까지 더 오래 끄는 것을 용납하지 않으리라고 말했다. 그는 곧 의회가 열린다는 사실을 언급하면서 사태가 나날이 더 절박해지고 있다고 강조했다. 그는 미국 정부가 [712면] 정치가다운 입장을 취하여 해결해야 할 문제들을 되도록 가장 넓은 관점에서 보아 주기를, 그리하여 이 문제들을 「단번에」 해결하려 애써 주기를 바란다고 표명했다. 그렇게 하지 않으면 현재의 곤란을 이겨 낼 전망이 희박하리라는 것이 그의 견해였다.\n\n외상은 이어서, 일본은 이미 할 수 있는 최대한의 양보라고 여겨져 온 것을 해 왔다고 말했다. 그러나 새 내각이 그 입장을 검토했고, 지금 내놓는 새 제안은 일본이 할 수 있는 최대한의 양보를 담고 있다는 것이었다. 이 대목에서 외상은 나에게 두 장의 종이(여기에 첨부)[주46]를 건네며 그것을 새 일본 측 제안이라고 설명했고, 다음 두 가지 소견을 밝히고 싶다고 말했다.\n\n1.\n\n새 일본 초안은 6월 21일 미국 초안에 대응한다. 그것은 9월 6일과 25일 일본 문서에 제시된 제안의 요소들을 담고 있으며, 10월 2일 미국 각서에 제시된 미국의 입장에 되도록 맞추기 위한 수정을 가한 것이다.\n\n2.\n\n9월 25일 일본 초안은 대체로 6월 21일 미국 초안에 기초한 것이었다. 외상의 견해로는 그 초안에는 문면으로 보나 실질로 보나 만족스럽지 못한 점이 많다. 그러나 회담을 앞당기기 위해 외상은 그 초안을 새 출발의 기초로 삼기로 결정했다. 그는 이 새 제안이 최대한의 양보를 담고 있다고 거듭 말했다.\n\n논평으로서 그는 다음과 같이 말했다.\n\n(a)\n\n유럽전쟁에 대한 미국 정부와 일본 정부의 태도에 관해서는, 9월 25일 일본 초안에 기초하여 견해의 일치가 있었다는 것이 일본 정부의 이해이다.\n\n(b)\n\n경제 사항에서의 무차별 문제에 관해서는, 자국의 새 제안이 미국 정부의 요망을 충분히 아우른다는 것이 일본 정부의 믿음이다.\n\n(c)\n\n회담을 성공적인 결말로 이끄는 데 가장 큰 장애가 되어 온 중국에서의 주병 및 철병 문제에 관해서는, 일본 정부가 심각한 국내적 곤란에도 불구하고 한층 더 나아간, 그리고 가능한 최대한의 양보로 보아야 할 양보를 했다. 일본 정부는 미국과 우호적인 해결에 이르고자 하는 일본의 바람을 보여 주는 이 한층 더 나아간 표시를 미국 정부가 높이 평가하리라 믿는다.\n\n(d)\n\n헐 씨는 회담에 관하여 이미 영국 정부와 협의해 왔으며 그러한 협의를 계속할 생각이라고 넌지시 밝혔다. 극동에서 영국의 이익이 큰 것은 인정되는 바이며 지금 미국과 일본 사이에서 논의 중인 사항들에 깊이 영향을 받을 것이다. 외상은 미국과 일본 사이에 추구되는 협정이 이루어질 경우 [713면] 일본과 영국 사이에도 같은 취지의 문서가 동시에 체결되어야 한다고 여긴다. 외상은 미국 정부가 그러한 동시 서명에 동의하도록 영국 정부를 설득해 주기를 바란다는 희망을 표명했다.\n\n외상은, 교섭을 신속하고 만족스러운 결말로 이끄는 데 나의 협력을 청한다는 말을 되풀이하며 소견을 마쳤다. 그는 지난번 우리 회동에서 언급되었던 문제, 즉 워싱턴에서 진행되는 회담과 나란히 도쿄에서도 회담을 진행하는 문제를 거론했다. 외상은 워싱턴에서 오갈 이야기를 이곳에서 그저 되풀이할 뜻은 없다고 말했다. 그는 도쿄에서 병행 회담을 갖는 데 미국 정부가 이의를 두지 않으리라 믿는다고 하면서도, 그의 견해로는 그러한 병행 회담이 회담의 진전을 앞당길 목적으로 워싱턴에서 이루어지는 정보와 의견의 교환을 보완하도록 마련되어야 한다고 말했다.\n\n외상의 진술이 끝난 뒤 나는, 워싱턴에서 논의될 문제들로서 외상이 다룬 문제들을 놓고 토론할 권한이 나에게 없으나 그 논의에 관련되는 세 가지 점을 제기하고자 한다고 말했다. 다음과 같다.\n\n(1)\n\n우리 정부가 극동 정세의 실상을 이해하지 못한다는 외상의 소견에 관하여, 나는 미국 정부가 이 대사관으로부터, 그리고 내가 짐작하기로는 워싱턴 주재 일본 대사로부터도 정세와 그 여러 요인에 관하여 완전히 명확한 관념을 전달받아 왔다는 이유로 감히 동의하지 않는다.\n\n(2)\n\n외상이 일본에 적용한 「동아시아의 안정 세력」이라는 말은 매우 넓은 해석의 여지가 있다.\n\n(3)\n\n일본이 필요한 물자에 접근할 수 있어야 한다는 외상의 소견은 문제 전체의 한복판을 꿰뚫는다. 현재 회담의 근본 목적 가운데 하나가 바로 일본이 그러한 필요한 물자를, 아울러 자유로운 무역과 통상의 흐름과 자국 산업을 위한 시장을 얻을 길을 여는 것이되, 무력의 사용이 아니라 평화적 수단에 의해 그렇게 하는 것이기 때문이다. 그리고 헐 씨의 구상은 일본의 장래의 복리와 번영과 만족을 보장하려는 바로 이 요망 사항들을 내다보고 있다.\n\n외상은, 대사관이 극동 정세를 정확히 보고하려 애쓰고 있음은 기꺼이 인정하겠으나 미국 정부가 취하고 있는 입장으로 보아 미국 정부가 실제로 그 실상을 올바로 인식하고 있는지 의문이라고 논평했다. 자기 논점을 예증하기 위해 그는 소련군이 외몽골에 주둔하고 있는 문제를 들고자 했는데, 외몽골은 중국의 일부로 널리 인정되고 있다는 것이었다. 그가 아는 한 소련군이 외몽골에 있는 데 대해 누구도 이의를 제기하지 않았다. 「동아시아의 안정 세력」이라는 어구에 대한 내 논평에 관하여, 외상은 상식적인 관점에서 [714면] 그 어구의 만족스러운 해석이 있어야 한다고 말했다. 일본에 원료 공급원을 확보해 주는 문제에 관한 내 소견에 대하여, 외상은 이것이 여러 해에 걸쳐 제네바를 비롯한 여러 곳에서 논의되어 온 문제라고 말했다. 그는 이 문제의 근본으로 들어가고 싶지는 않으나 미국과 일본 사이의 통상적·경제적 관계의 중요성은 짧게 언급할 수 있겠다고 생각했다. 미국의 일본 자산 동결은 많은 중요한 원료의 대일 공급을 멎게 했다. 이러한 성격의 경제적 압박은 직접적인 무력 사용보다 더 큰 정도로 국가의 존립을 위협할 수 있다. 그는 미국 정부가 이러한 성격의 사정을 고려에 넣기를, 그리고 만일 일본 국민이 계속되는 경제적 압박에 노출된다면 끝내는 단호히 자위 조치에 의지하지 않을 수 없다고 느낄 가능성이 있음을 깨닫기를 바랐다.\n\n외상은 이어서, 일본이 4년이 넘는 기간 동안 광범위한 적대 행위를 벌여 왔으며, 만일 일본이 그렇게 오래 끈 적대 행위의 성과를 희생하라는 요구를 받는다면 반드시 무너지고 말 것이라고 말했다. 미국 정부가 이 사실을 깨닫는다면 회담의 신속한 타결은 쉬울 것이다.\n\n나는 일본이 적대 행위의 성과를 유지해야 한다는 주장을 외상이 강조하는 것과, 침략과 무력 사용을 삼간다는 원칙을 일본이 수락한 것 사이의 명백한 모순을 지적했다.\n\n외상은 일본이 침략 전쟁을 수행하고 있는 것이 아니며 따라서 침략의 성과를 유지하는가 하는 문제는 생기지 않는다고 답했다. 그가 받은 인상으로는 지금 미국 정부야말로 자위를 내세워 국제법이 일반적으로 인정하는 것을 넘어서는 조치에 의지하고 있다는 것이었다. 그는 일본이 미국에 자위의 원칙을 너무 넓게 해석하지 말아 달라고 요청하는 것이 부적절하지는 않을 것이라는 견해를 표명했다. 어떻든 이론적인 논의는 회담을 진전시키지 못하리라는 것이 그의 견해였고, 그는 회담이 현실적인 선을 따라 추구되어야 한다고 생각했다.\n\n그러고 나서 대화는 별도의 비망록에서 다루는 다른 문제로 넘어갔다.\n\nJ[oseph] C. G[rew]\n\n[715면]", "secondary": "[Tokyo,] November 10, 1941.\n\nThe Foreign Minister [주45] recalled the conversation which he had had with me on October 30, when he said that he was firmly of the opinion that the maintenance of friendly relations between the United States and Japan was a practicable proposition. He went on to say that he had given constant thought to this matter and that he had determined to put forward every effort to re-establish relations between the two countries on a friendly basis and to maintain peace in the Pacific. It was the purpose of the present Cabinet to continue with the project of establishing a “Greater East Asia” as a contribution toward world peace. Mr. Togo said that ever since he has assumed office he had been intensively studying the documents relating to the conversations which have thus far taken place. Fresh proposals had been formulated and had been sent to Admiral Nomura, who had been instructed to enter into negotiations with the President and the Secretary of State. I interrupted the Foreign Minister to say that our Government had been careful to emphasize that it was engaged in “preliminary and exploratory conversations” with the Japanese Government. Mr. Togo replied that he was well aware of that fact, but that he wondered whether the time had not come to enter into formal and official negotiations. However, he said that he did not wish to press the point.\n\nMr. Togo went on to say that only recently Mr. Kurusu had been despatched to Washington to assist Admiral Nomura in conducting [711면] the conversations. He recalled in this connection that he had asked me to facilitate Mr. Kurusu’s journey to the United States, and that the American Government and I had responded in a manner which was most gratifying. He said that it was everywhere known in Japan that I had striven to promote friendly relations between our two countries and that my efforts in this regard were highly appreciated throughout the country. He intended on his part to spare no effort to cooperate with me with a view to opening up a way for the solution of the problems confronting the two countries which would be mutually acceptable.\n\nWhat he most keenly felt, the Foreign Minister continued, from reviewing the documents recording conversations which have thus far taken place was that the knowledge and appreciation of the United States with regard to the realities of the situation in the Far East are unfortunately inadequate. Although Mr. Hull had admitted that Japan is a stabilizing force in the Far East, the position taken by the United States throughout the conversations had not been in harmony with that fact. Unless the American Government should take full cognizance of the fact that Japan has been engaged in hostilities with China for four and a half years, then the admission of Japan’s being a stabilizing force in the Far East would have in actuality no meaning. Mr. Togo said that Mr. Hull, in a conversation with Mr. Wakasugi on October 16, recalled that he had told former Ambassador Saito that he recognized Japan as a stabilizing force and would be prepared to express such recognition in an official manner. [주45a] The Minister went on to say that the population of this country is steadily and rapidly increasing; it was now about one hundred million; and it was necessary to assure raw materials necessary for their existence. It was his opinion that unless the American Government realizes this fact as among the realities of the situation, successful conclusion to the conversations would be difficult. During the conversations carried on for a period of more than six months, the Japanese Government had repeatedly made proposals calculated to approach the American point of view, but the American Government for its part had taken no step toward meeting the Japanese position and had yielded nothing—it had perhaps taken a more advanced position. Those being the facts, “we in Japan are led to wonder what is the degree of sincerity of the American Government in continuing with the conversations.” He said that national sentiment will not tolerate further protracted delay in arriving at some conclusion. Referring to the fact that the Diet is shortly to meet, he emphasized that the position is daily becoming more pressing. He expressed the hope that the American Government would take [712면] a statesmanlike position and view the problems to be resolved from the broadest possible viewpoint—that it would try to settle these problems “with one sweep”. It was his opinion that otherwise the prospects of overcoming the present difficulties would be small.\n\nThe Foreign Minister went on to say that Japan had already made what were believed to have been the greatest possible concessions. However, the position had been examined by the new Cabinet and the new proposal now being made comprises the maximum possible concessions by Japan. The Minister at this point handed me two pieces of paper (attached hereto) [주46] which he described as the new Japanese proposals, and he said that he wished to make two observations as follows:\n\n1.\n\nThe new Japanese draft corresponds to the American draft of June 21. It contains the elements of the proposals put forward in the Japanese documents of September 6 and 25, with modifications to meet as far as possible the American position as set forth in the American memorandum of October 2.\n\n2.\n\nThe Japanese draft of September 25 was largely based on the American draft of June 21. In the Foreign Minister’s opinion it contains many unsatisfactory features with regard to both text and substance. However, to expedite the conversations, the Minister had decided to make use of that draft as a basis for a fresh start. He reiterated that this new proposal includes the maximum concessions.\n\nBy way of commentary he said:\n\n(a)\n\nWith regard to the attitudes of the American and Japanese Governments towards the European war, it is the understanding of the Japanese Government that there has been an agreement of views based on the Japanese draft of September 25;\n\n(b)\n\nWith regard to the question of non-discrimination in economic matters, it is the belief of the Japanese Government that its new proposal adequately covers the desires of the American Government;\n\n(c)\n\nWith regard to the stationing in and withdrawal of troops from China, which have been the greatest obstacle in bringing the conversations to a successful end, the Japanese Government has, notwithstanding grave domestic difficulties, made a further and what must be regarded as the maximum possible concession. The Japanese Government believes that the American Government will appreciate this further manifestation of Japan’s desire to come to an amicable settlement with the United States:\n\n(d)\n\nMr. Hull has intimated that he has already consulted the British Government with regard to the conversations and that he proposes to continue such consultation. British interests in the Far East are admittedly large and would be deeply affected by matters now under discussions between the United States and Japan. The Foreign Minister regards it as necessary that in the event of the sought-f or agreement being reached between the United States and Japan there should [713면] simultaneously be concluded a similar instrument between Japan and Great Britain. The Foreign Minister expressed the hope that the American Government will persuade the British Government to agree to such simultaneous signature.\n\nThe Minister concluded his observations by repeating that he solicited my cooperation to bring about a speedy and satisfactory end to the negotiations. He referred to the question of conversations being carried on in Tokyo paralleling those taking place in Washington, which was touched on at our last meeting. The Minister said that he had no intention of merely duplicating here what would be said in Washington. He believed that there would be no objection on the part of the American Government to holding parallel conversations in Tokyo, but in his view such parallel conversations should be designed to supplement exchanges in Washington of information and of opinion with a view to expediting the progress of the conversations.\n\nAt the end of the Minister’s presentation I said that I had no authority to debate the questions approached by the Minister which would be discussed in Washington but that I wished to raise three points as pertinent to those discussions, as follows:\n\n(1)\n\nIn connection with the Minister’s observation that my Government does not understand the realities of the situation in the Far East I ventured to disagree on the ground that the American Government had been given a perfectly clear conception of the situation and its various factors by this Embassy and, I assumed, by the Japanese Ambassador in Washington;\n\n(2)\n\nThe term “stabilizing force in East Asia” as applied by the Minister to Japan is open to very wide interpretation;\n\n(3)\n\nThe Minister’s observation that Japan must have access to necessary supplies penetrates to the center of the whole problem since one of the fundamental purposes of the current conversations is to open a way for Japan to obtain such necessary supplies, together with a free flow of trade and commerce and markets for her industries, but by peaceful means as opposed to the use of force, and that Mr. Hull’s program visualizes precisely these desiderata which are aimed to ensure Japan’s future welfare, prosperity and contentment.\n\nThe Foreign Minister remarked that he was quite prepared to admit that the Embassy is endeavoring to report accurately on the situation in the Far East, but that, in view of the position which is being taken by the American Government, he wondered whether the American Government has in fact a correct appreciation of the realities. To illustrate his point, he wished to cite the question of the stationing of Soviet troops in Outer Mongolia, which was universally recognized to be a part of China. So far as he knew no one had objected to the presence of Soviet troops in Outer Mongolia. With regard to my comment on the phrase “stabilizing force in East Asia,” the Foreign Minister said that there should be a satisfactory interpretation [714면] of that phrase from a common-sense point of view. With regard to my observations on the question of assuring to Japan sources of raw materials the Foreign Minister said that this was a question which had been debated over a period of years at Geneva and elsewhere. He did not wish to go into the fundamentals of the question, but he thought that he could advert briefly to the importance of commercial and economic relations between the United States and Japan. The freezing by the United States of Japanese assets had stopped supplies of many important raw materials to Japan. Economic pressure of this character is capable of menacing national existence to a greater degree than the direct use of force. He hoped that the American Government would take into consideration circumstances of this character and realize the possibility that the Japanese people, if exposed to continued economic pressure, might eventually feel obliged resolutely to resort to measures of self-defense.\n\nThe Minister went on to say that Japan had been engaged in extensive hostilities for a period of more than four years, and that if Japan were called upon to sacrifice the fruits of such protracted hostilities she must inevitably collapse. If the American Government realizes this fact a speedy conclusion to the conversations will be easy.\n\nI pointed out the apparent inconsistency between the Minister’s emphasis on the insistence of Japan that she retain the fruits of hostilities and Japan’s acceptance of the principle of refraining from aggression and the use of force.\n\nThe Foreign Minister replied that Japan is not conducting a war of aggression and that therefore no question arises of her retaining the fruits of aggression. It is his impression that the American Government is now resorting, under the plea of self-defense, to measures over and beyond those that are generally recognized by international law. He expressed the opinion that it might not be out of place for Japan to ask the United States not to put too liberal a construction on the principle of self-defense. In any event, it was his opinion that theoretical discussions would not promote the conversations, which he thought should be pursued along realistic lines.\n\nThe conversation then turned to another matter which is covered by a separate memorandum.\n\nJ[oseph] C. G[rew]\n\n[715면]", "notes": ["[주45] 주일 미국대사관 참사관(두먼)과 일본 외무성 미국국 제1과장(가세)도 동석했다.", "[주45a] 다만 687면의 국무장관 회담 비망록을 보라.", "[주46] 본문은 1941년 11월 7일 국무장관에게 건네진 문서, 709면 참조."], "warn": false, "pages": ["0777", "0778", "0779", "0780", "0781"], "search": "그루(Joseph C. Grew) — 주일 미국대사, 비망록 작성자 도고(東郷茂徳, Togo) — 일본 외상 노무라(野村吉三郎, Nomura) — 주미 일본대사, 해군 제독 구루스(来栖三郎, Kurusu) — 특사 헐(Cordell Hull) — 국무장관 와카스기(若杉要, Wakasugi) — 주미 일본대사관 공사 사이토(斎藤博, Saito) — 전 주미 일본대사 루스벨트(Franklin D. Roosevelt) — 대통령(본문에는 「대통령」으로만 표기) 두먼(Eugene H. Dooman) — 주일대사관 참사관(각주 45) 가세(加瀬俊一, Kase) — 일본 외무성 미국국 제1과장(각주 45)"}, {"id": "d385", "order": 385, "date": "1941-11-10", "group": "A", "eyebrow": "d385 · Memorandum by the Secretary of State", "title": "국무장관의 비망록", "badge": null, "list_right": "문서 385", "meta": [{"k": "일자", "v": "1941-11-10"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2460", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 385 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d385"}], "summary": "노무라가 와카스기를 데리고 대통령을 방문하여 「갑안」의 요지(무차별 원칙, 유럽 전쟁에 대한 태도, 일본군 주둔과 철병)를 훈령대로 낭독하고, 이어 구두 성명으로 자산 동결과 시간의 절박함을 호소한다. 대통령이 구두 성명으로 답한다.", "points": ["노무라 대사가 와카스기 공사를 대동하고 대통령을 방문했고, 루스벨트의 명시적 희망에 따라 국무장관이 배석했다.", "노무라는 9월 25일 일본 측 제안에 대한 10월 2일 국무장관의 소견과 그 뒤 국무장관·웰스 국무차관이 표명한 견해로부터, 가장 큰 어려움이 세 가지 점에서 생겨났다고 정리했다. 국제 통상관계에서의 무차별 원칙 적용, 유럽 전쟁에 대한 양국 정부의 태도, 일본군의 주둔과 철병 문제다.", "무차별 원칙에 대해 일본 정부는 그 원칙이 세계의 나머지에도 똑같이 적용된다는 양해 위에서 중국을 포함한 모든 태평양 지역에서의 적용을 수락하기로 결정했다.", "유럽 전쟁에 대해 노무라는, 미국 정부가 「보호와 자위」라는 말에 지나치게 넓은 해석을 붙여 그에 근거한 권리를 남용할 의도가 없다는 확언을 줄 수 있는지 물었고, 상호주의 위에서 일본도 같은 확언을 줄 용의가 있다고 했다.", "삼국동맹에 대해서는 9월 25일 초안의 문면(미국이 유럽 전쟁에 참전할 경우 일본은 조약 해석을 전적으로 독자적으로 결정한다) 이상으로 흑백으로 적어 넣는 것을 현재의 정세가 허락하지 않는다며, 「행간을 읽어」 그 문안을 만족스러운 것으로 받아 달라고 했다.", "노무라는 상호 신뢰가 없는 곳에서는 천 마디 말이나 서한도 만족스러운 확언이 되지 못한다고 말했다. 원문에는 이 대목 앞에 「(노무라 대사가 삭제)」라는 표시가 있다.", "철병 문안은 이렇다. 화북·몽강(내몽골)의 특정 지역과 해남도의 부대는 중일 평화 회복 뒤에도 일정 기간 주둔하고, 나머지는 전반적 평화 회복 즉시 철수를 개시하여 2년 이내에 완료한다. 프랑스령 인도차이나 주둔군은 중국사변 해결 또는 동아시아의 공정한 평화 수립 즉시 철수한다.", "노무라는 구두 성명에서, 고노에 내각 총사퇴 이후 회담이 근 3주 방치되었으며 지금 정세에서는 3주는커녕 3일도 매우 귀중한 시간이라고 했다.", "노무라는 자국 국민이 자산 동결을 경제 봉쇄로 받아들이며 「현대전의 수단은 총을 쏘는 것에 국한되지 않는다」고까지 주장한다고 전하고, 본국의 보고는 정세가 심각하고 절박하다고 알린다고 했다.", "노무라는 일본 정부가 구루스 대사를 파견해 자신을 돕게 하며, 도쿄에서는 도고 외상과 그루 대사 사이에 병행하여 회담이 진행될 것이라고 알렸다.", "노무라는 훈련된 외교관이 써서는 안 될 말을 오늘 썼을지도 모르겠으나 용서해 달라고 끝맺었고, 헐은 그가 성명을 읽는 태도가 매우 진지해 보였다고 적었다.", "노무라는 일본이 산둥에 들어갔다가 6년 만에 군대를 빼라는 요구를 받은 사실을 불평조로 언급했다.", "대통령은 구두 성명으로, 미국 정부의 목적은 공정한 경기의 정신으로 태평양 지역의 평화·안정·질서의 기초를 세우는 데 이바지하는 것이며, 일본 정부가 그 반대의 길이 아니라 평화로운 길을 걸을 뜻임을 분명히 하기를 바란다고 답했다.", "대통령은 국가는 백 년 앞을 내다보아야 한다고 말하고, 산둥 문제 처리에 3년이 걸렸다는 대사의 말에 대해 우리는 태평양의 관계 해결을 논의하는 데 겨우 여섯 달을 썼을 뿐이며 인내가 필요하다고 답했다.", "대통령은 modus vivendi 를 한갓 편의적·잠정적 합의가 아니라 실제 인간의 삶을 고려에 넣는 것으로 말했다.", "다음 회담 시기에 관해서는 아무 말도 없었다. 대통령은 이번 주말 웜스프링스 방문 일정을 꺼냈고, 대사는 구루스가 토요일쯤 도착한다고 말했다."], "primary": "[워싱턴,] 1941년 11월 10일.\n\n일본대사가 와카스기(若杉要, Wakasugi) 공사를 대동하고 대통령을 방문하였다. 국무장관은 루스벨트 대통령의 명시적인 희망에 따라 배석하였다. 대사는 몇 마디 서두의 말을 한 뒤, 자기 정부의 훈령에 따르는 것으로서 다음의 통첩을 읽어 나갔다.\n\n「이제 저는 저의 정부가 귀 정부에 제출하도록 저에게 훈령한 제안들의 요점을 각하께 설명드리려 합니다. 기억하시겠습니다만, 일본 정부가 미국 정부에 마지막으로 제안을 낸 것은 9월 25일이었고, 그에 대하여 10월 2일 국무장관께서 하신 소견과 또 그 뒤 국무장관 및 웰스 국무차관께서 표명하신 견해로 미루어 볼 때, 가장 큰 어려움은 세 가지 점에서 생겨났습니다. 곧,\n\n1. 국제 통상관계에서의 무차별 원칙의 적용,\n\n2. 유럽 전쟁에 대한 우리 두 정부의 태도, 그리고\n\n3. 일본군의 주둔 및 철병의 문제.\n\n「첫째 문제, 곧 무차별의 원칙에 관하여는, 저의 정부는 그 원칙이 세계의 나머지에도 똑같이 적용된다는 양해 위에서, 귀 정부가 바라는 대로 중국을 포함한 모든 태평양 지역에서의 그 적용을 수락하기로 이제 결정하였습니다. 국무장관께서는 그 원칙이 전 세계에 걸쳐 적용되는 것을 보는 것이 오래 품어 온 자신의 구상이라고 저에게 거듭 지적하신 바 있습니다. 그러므로 저는 이와 관련하여 저의 정부가 드릴 확언이 각하께 흡족한 것이 되기를 바랍니다.\n\n「둘째 문제, 유럽 전쟁에 대한 우리 두 정부의 태도에 관하여는, 저의 정부는 9월 25일자 초안에서 다음과 같이 제안하였습니다.\n\n『양국 정부는 그 행동에 있어 보호와 자위의 고려에 인도될 것이다.』\n\n이와 관련하여 저는, 미국 정부가 「보호와 자위」라는 말에 지나치게 넓은 해석을 붙임으로써 그에 근거한 승인된 권리의 남용으로 이어지게 할 의도가 없다는 확언을 줄 수 있는 처지에 있는지를 여쭈어야 하겠습니다. 일본 정부는 상호주의의 바탕 위에서, 곧 미국 정부로부터 그러한 확언이 나온다면, 같은 확언을 줄 용의가 있겠습니다.\n\n「앞서 말씀드린 9월 25일자 초안에서 저의 정부는 다음과 같이 제안하였습니다.\n\n『만약 미국이 유럽 전쟁에 참가하게 될 경우, 일본은 일본·독일·이탈리아 사이의 [716면] 삼국동맹의 해석 문제에 있어 전적으로 독자적으로 결정할 것이며, 마찬가지로 그 해석에 따라 의무를 이행하는 방식으로 어떠한 행동을 취할 것인지를 정할 것이다.』\n\n이와 관련하여, 현재의 회담을 개시한 근본 동기가 가능한 모든 수단으로 태평양의 평화를 보전하는 데 있었음은 굳이 지적할 필요조차 없을 것입니다. 일본이 놓여 있는 현재의 사정은, 제가 방금 인용한 9월 25일자 초안에서 제안한 것보다 더 나아가 흑백으로 적어 넣는 것을 저의 정부에 허락하지 않습니다. 제가 각하께 청해야 할 전부는 「행간을 읽으시고」 그 문안을 만족스러운 것으로 받아들여 주십사 하는 것입니다. (노무라 대사가 삭제.) 상호간의 신뢰와 믿음이 없는 곳에서는 천 마디 말이나 서한도 만족스러운 확언이 되지 못하리라는 데에 각하께서도 저와 뜻을 같이하실 것입니다.\n\n「셋째 문제, 일본군의 주둔과 철병에 관하여, 저의 정부가 제출하고자 하는 문안은 다음과 같습니다.\n\n『중국사변과 관련하여 중국에 파견된 일본군에 관하여는, 화북 및 몽강(내몽골)의 특정 지역과 해남도(하이난 섬)에 있는 부대들은 일본과 중국 사이에 평화적 관계가 회복된 뒤에도 일정한 소요 기간 동안 주둔한 채로 남는다. 그 밖의 모든 부대는 일본과 중국 사이에 전반적 평화가 회복되는 즉시 철수를 개시하며, 그 철수는 일본과 중국 사이의 별도의 협정에 따라 진행되고 평화와 질서의 확고한 확립과 함께 2년 이내에 완료된다.』\n\n「이 문안을 제출함에 있어 일본 정부는 이전에 나아갔던 것보다 훨씬 더 멀리 나아갔습니다. 그 문안은 일본 정부가 자국 군대를 중국에 남겨 두기를 바라는 지역뿐만 아니라 그 기간까지도 명시하고 있으며, 중국에서의 일본군 주둔이 영구적 성질의 것이 아님을 분명히 나타내고 있기 때문입니다. 모든 일본군의 중국으로부터의 완전하고 즉각적인 철수가 바람직할 수는 있으나 현재의 사정 아래에서는 실행할 수 없는 일임을 각하께서도 선뜻 동의하실 것입니다. 그러므로 저는 각하께서 실제적인 견지에서 호의적으로 고려해 주시기를 간절히 바랍니다.\n\n「저는 프랑스령 인도차이나의 일본군에 관하여 일본 정부가 다음의 문안을 제안한다는 것을 덧붙이도록 훈령받았습니다.\n\n『일본 정부는 프랑스령 인도차이나의 영토주권을 존중할 것을 약속한다. 현재 그곳에 주둔하고 있는 일본군은 중국사변이 해결되거나 동아시아에 공정한 평화가 수립되는 즉시 철수한다.』」 [주47]\n\n이어 대사는 자기의 구두 성명이라고 말한 다음의 원고를 읽었다.\n\n「오늘 각하를 뵐 수 있어 매우 기쁩니다. 고노에 공작 내각의 총사퇴 이래 국무장관과 저 사이의 회담이 근 3주 동안 그대로 방치되어 있어야 했기 때문입니다 — 현재의 사정 아래에서는 3주는 물론 3일도 매우 귀중한 시간입니다. 일본과 미국 사이의 정세가 저 갈 대로 가도록 방치되어 구제할 수 없는 데까지 떠내려가서는 안 된다는 데에 각하께서도 저와 뜻을 같이하시리라 믿습니다.\n\n[717면]\n\n「현재의 비공식 회담이 시작된 지 여섯 달이 넘었습니다. 처음부터 일본 정부는 될 수 있는 대로 빠른 타결에 이르기를 몹시 바랐고 일본 국민은 거기에 큰 희망을 걸었습니다만, 회담은 끌고 또 끌었으며, 다른 한편으로 우리 두 나라의 관계는 점점 더 긴장되어 갔고 저의 나라 국민은 점점 더 참지 못하게 되었습니다.\n\n「일본 쪽에서 보자면, 일본 정부는 여러 단계에서 자기 주장에 적지 않은 양보를 하여 온 반면, 미국 정부는 일본인이 보기에 자기 주장에서 완강히 버티며 상응하는 응답의 기색을 거의 보이지 않았습니다. 그리하여 저의 나라의 어떤 층에서는 미국 정부의 진의에 대하여 어느 정도의 회의가 생겨났음을 솔직히 각하께 알려 드려야 하겠습니다. 개인적으로 저는 그런 말을 하고 싶지 않습니다만, 그것은 사실입니다. 저의 나라 사람들은 자산 동결을 경제 봉쇄로 받아들이며, 현대전의 수단이 총을 쏘는 것에 국한되지 않는다고 주장하는 데까지 나아가고 있습니다. 어떤 나라도 자기 산업에 긴요한 물자의 공급 없이는 살아갈 수 없습니다. 본국에서 저에게 오는 보고들은 정세가 심각하고 절박하며 평화를 보전하는 유일한 길은 불필요하게 시간을 잃지 않고 미국과 어떤 종류의 우호적이고 만족스러운 양해에 이르는 것뿐임을 알리고 있습니다. 이렇게 쌓여 가는 어려움 앞에서, 일본 정부는 오로지 태평양의 평화를 유지한다는 목적을 위하여 회담을 계속하고 만족스러운 양해를 이루어 내는 데 온 노력을 기울였습니다. 그러므로 저의 정부는 그 목적을 위한 최대한의 노력으로서 이제 어떤 제안들을 제출하는 것이며, 될 수 있는 대로 빠른 기회에 그에 대한 귀 정부의 견해를 들을 수 있다면 매우 감사하겠습니다. 만약 우리가 이 나라와 양해에 이른다고 한다면, 그것이 우리 국민에게 미칠 심리적 효과는 종이 위에 실제로 적히는 것보다 훨씬 더 큰 뜻을 지닐 것이며, 저의 정부의 정책도 필연적으로 그에 인도되고 그에 좌우될 것입니다. 저는 일본 정부가 품고 있는 견해와 바람을 귀 정부도 온전히 함께 나누고 그에 응하여 주시리라고 확신을 가지고 희망합니다.\n\n「참고로 덧붙이건대, 우리 두 나라의 관계에 지금 감돌고 있는 심각한 정세에 비추어, 일본 정부는 현재의 회담에서 저를 돕도록 구루스(来栖三郎, Kurusu) 대사를 이곳으로 보내고 있으며, 또한 도쿄에서는 도고(東郷茂徳, Togo) 외상과 그루 대사 사이에 병행하여 회담이 진행되리라는 것도 말씀드립니다.\n\n「오늘 저는 훈련받은 외교관이라면 써서는 안 될 말을 더러 썼을지도 모르겠습니다만, 저의 잘못을 너그러이 용서해 주시기 바랍니다. 그것은 오직 우리 두 나라의 관계를 제가 믿기에 양쪽 모두에게 가장 좋은 길로 지키고 이끌고자 하는 저의 간절한 바람 때문이었습니다.」\n\n대사는 그 성명을 읽으면서 매우 진지해 보였다.\n\n[718면]\n\n대사는 몇 달 전 해상 회담에서 대통령과 처칠(Winston Churchill) 총리가 논의하고 선언한 통상 정책에 대하여 얼마간 언급하였다. 그는 일본이 산둥에 들어갔다가 겨우 6년쯤 그곳에 머무는 것만이 허용되었고 그 기간이 끝나자 군대를 빼도록 요구받았다는 사실을 불평조로 언급하였다.\n\n이에 대통령은 다음의 구두 성명을 읽었다.\n\n「침략 세력이 저질러 온 참화의 결과로 온 세계가 위태로운 처지에 놓였다. 우리의 상식은 세계가 평화의 길로 되돌아와야 할 지극한 필요를 우리에게 일러 준다. 태평양 지역에 평화와 안정과 질서의 기초를 세우는 데 공정한 경기의 정신으로 최선을 다하여 이바지하는 것이 미국 정부의 목적이다. 이러한 목표를 이루는 수단으로서, 인간의 복리에 관한 건전한 철학에 실제적인 효력을 부여하는 데 힘을 기울이는 것이 긴요하다. 우리는 이 점에 관하여 우리가 무엇을 염두에 두고 있는지를 자주, 그리고 아주 최근에도 공개적으로 분명히 밝혀 왔다. 우리는 우리의 예비 회담이 교섭의 기초를 마련하는 방향으로 좋은 결과를 거두기를 바란다. 우리는 일본 정부가 그렇게 하기를 몹시 바라고 있는 것으로 우리가 이해하는 것과 꼭 마찬가지로, 회담을 서두르기 위하여 계속 최선을 다할 것이다. 우리는 일본 정부가 그 반대의 길이 아니라 평화로운 길을 걸을 의도임을 분명히 하기를 바라는데, 그러한 분명한 밝힘이 우리가 구하는 결과에 이르는 길을 열어 줄 것이기 때문이다.」\n\n대통령은 또한 구두로, 국가는 백 년 앞을 내다보아야 하며 특히 세계가 지나가고 있는 이 시대에는 더욱 그러하다는 자기 의견을 말하고, 중국 정부는 지난 30년 동안 새로운 경험을 겪어 오고 있다고 말하였다. 그는 치외법권 법정과 중국의 그 새로운 경험에 뒤따랐던 그 밖의 예사롭지 않은 조건들을 언급하였다. 내가 대사의 말을 옳게 알아들었다면, 그는 산둥 문제를 전개시키고 처리하는 데 3년이 걸렸다고 말하였다. 이에 대통령은, 대사와 헐 국무장관과 자기 자신은 태평양에서의 우리의 관계와 다른 나라들의 관계의 해결을 논의하는 데 겨우 여섯 달쯤을 썼을 뿐이며 인내가 필요하다고 답하였다. 대통령은 modus vivendi 란 한갓 편의적이고 잠정적인 합의일 뿐 아니라 실제의 인간 생존을 고려에 넣는 것이기도 하다고 말하였다. 대사는 일본이 단계적으로 중국에서 물러나는 문제를 다시 짧게 이야기하면서, 병합도 배상도 없을 것이라는 등을 덧붙였다.\n\n다음 회담이 언제 열릴 것인지에 관하여는 아무 말도 없었다. 대통령은 이번 주말에 열흘쯤 웜스프링스를 방문할 일정을 꺼냈다. 대사는 구루스가 토요일쯤 이곳에 도착할 것이라고 말하였다. [주47a] 대통령은 물론 구루스를 만나고 [719면] 대사와 공사 및 그 동료들과 협의할 생각이라고 말하였다. 대사는 구루스가 오직 자기를 돕기 위하여, 그리고 자기 요청으로 오는 것이며 대사가 아는 한 그가 무엇인가 새로운 것을 가져오는 것은 아니라고 말하였다.\nC[ordell] H[ull]", "secondary": "[Washington,] November 10, 1941.\n\nThe Japanese Ambassador, accompanied by Minister Wakasugi, called on the President. The Secretary of State was present at the express wish of President Roosevelt. The Ambassador, after a few preliminary remarks, proceeded to read as under instruction from his Government the following communication:\n\n“I am now going to explain to you the salient points of the proposals which my Government has instructed me to submit to your Government. As you will recall, it was on the 25th of September that the Japanese Government, last made its proposals to the United States Government, and, gathering from the observations which the Secretary of State made on them on the 2nd of October and also from the views which were subsequently expressed by the Secretary of State and the Under-Secretary of State Mr. Welles, the greatest difficulties arose from three points, that is:—\n\n1.\n\nThe application of the principle of non-discrimination in international commercial relations,\n\n2.\n\nThe attitude of our two Governments toward the European war, and\n\n3.\n\nThe question of the stationing and withdrawal of Japanese forces.\n\n“In regard to the first question, that is, the principle of non-discrimination, my Government has now decided to accept its application in all the Pacific areas, including China, as your Government desires, on the understanding that the principle is to be applied uniformly to the rest of the world as well. The Secretary of State has repeatedly pointed out to me that it has been his long-cherished scheme to see the application of the principle throughout the whole world. I therefore hope that the assurance to be given by my Government in this connection will be gratifying to you.\n\n“As to the second question, the attitude of our two Governments toward the European war, my Government proposed, in the draft of September 25th, that\n\n‘both Governments will be guided in their conduct by considerations of protection and self-defense.’\n\nIn this connection I have to inquire if the United States Government is in a position to give an assurance that it has no intention of placing too liberal an interpretation on the term ‘protection and self-defense’ that may lead to an abuse of the recognized right based upon it. The Japanese Government would be ready to give a similar assurance on the basis of reciprocity, that is, if the assurance is forthcoming from the United States Government.\n\n“In the draft of September 25th referred to, my Government proposed that\n\n‘in case the United States should participate in the European war. Japan would decide entirely independently in the matter of interpretation of the [716면] Tripartite Pact between Japan, Germany and Italy, and would likewise determine what actions might be taken by way of fulfilling the obligations in accordance with the said interpretation.’\n\nIt will hardly be necessary to point out in this connection that the fundamental motive for initiating the present conversations was the preservation of peace in the Pacific by all possible means. The present circumstances under which Japan is placed do not permit my Government to go any further to write in black and white than what it proposed in the draft of September 25th which I have just quoted. All I have to ask you is to ‘read between the lines’ and to accept the formula as satisfactory. (Deleted by Ambassador Nomura.) You will agree with me that where there is no mutual confidence and trust, a thousand words or letters would not be a satisfactory assurance.\n\n“In regard to the third question, the stationing and withdrawal of Japanese forces, the formula which my Government wants to submit is as follows:\n\n‘With regard to the Japanese forces which have been despatched to China in connection with the China Affair, those forces in specified areas of North China and Mengchiang (Inner Mongolia) as well as in Hainan-tao (Hainan Island) will remain to be stationed for a certain required duration after the restoration of peaceful relations between Japan and China. All the rest of such forces will commence withdrawal as soon as general peace is restored between Japan and China and the withdrawal will proceed according to separate arrangements between Japan and China and will be completed within two years with the firm establishment of peace and order.’\n\n“In submitting this formula, the Japanese Government has gone a great deal further than it went previously in that the formula specifies not only the areas in, but also the duration for, which the Japanese Government desires to have its forces remaining in China, clearly indicating that the stationing of the Japanese forces in China is not of a permanent nature. You will readily agree that, while complete and immediate withdrawal of all the Japanese forces from China may be desirable, it is impracticable under the present circumstances. I therefore earnestly hope that you will give favorable consideration from a practical standpoint.\n\n“I have been instructed to add that, in regard to the Japanese forces in French Indo-China, the Japanese Government proposes the following formula:\n\n‘The Japanese Government undertake to respect the territorial sovereignty of French Indo-China. The Japanese forces at present stationed there will be withdrawn as soon as the China Affair is settled or an equitable peace is established in East Asia.’” [주47]\n\nThe Ambassador then read the following manuscript which he said was an oral statement by him:\n\n“I am very glad to be able to see you to-day, because since the resignation of the Cabinet of Prince Konoye, the conversations between the Secretary of State and myself had to be left alone for nearly three weeks—three weeks, even three days, are very precious time under the present circumstances. I am sure you will agree with me that the situation between Japan and the United States must not be left alone to take its own course and drift away beyond rescue.\n\n[717면]\n\n“It is more than six months since the present informal conversations were started. From the very beginning the Japanese Government was very anxious to reach the earliest possible conclusion and the Japanese people placed a great deal of hope on it, but the conversations dragged on and on and, on the other hand, the relations be
