answer of this Government on the question of Japan’s relations with the Tripartite Pact. The Secretary replied that when we got an answer from the Japanese Government in regard to its attitude on the point that he had raised about the Tripartite Pact becoming automatically a dead letter in case we entered into an agreement with Japan we would be better able to make reply. The Japanese Ambassador said that he was afraid that the American Government did not trust the Japanese Government whereas there was [734면] no material difference between the policies of the present Japanese Government and the previous Japanese Government, notwithstanding the fact that the Prime Minister was a military man. The Secretary replied that the new Government in Japan seems to take the attitude that we must reply at once to their points, but that we do not feel that we should be receiving ultimatums of such a character from the Japanese Government under circumstances where the United States has been pursuing peaceful courses throughout and the Japanese Government is the one which has been violating law and order. The Secretary said, in conclusion, that when we hear from the Japanese Government concerning its position on the points we had raised with them two days ago on their peaceful intentions and when we could clear up the question of non-discrimination, as suggested in our proposal of today, and also in regard to the Tripartite Pact, he believed that we could sit down like brothers and reach some solution of the question of stationing Japanese troops in China. The Secretary emphasized at the same time that we did not desire any delay and that we were working as hard as we could to bring about a wholly satisfactory and broad settlement.\n\nJ[oseph] W. B[allantine]", "notes": ["[주55] 와카스기(若杉要, Wakasugi) 씨가 대사를 수행하였다.", "[주56] 바로 아래에 실려 있다."], "warn": false, "pages": ["0798", "0799", "0800"], "search": "노무라(野村吉三郎, Nomura) — 주미 일본대사. 본문에는 「일본대사」·「대사」로만 적혀 있다 와카스기(若杉要, Wakasugi) — 주미 일본공사. 본문에는 「일본공사」로도 적혀 있다 헐(Cordell Hull) — 미국 국무장관. 본문에는 「국무장관」으로만 적혀 있다 밸런타인(Joseph W. Ballantine) — 국무부 관리, 이 비망록의 기록자 그루(Joseph Grew) — 주일 미국대사 도고(東郷茂徳, Togo) — 일본 외상. 원문에는 「일본 외상」으로만 적혀 있다 도조(東條英機, Tojo) — 일본 총리. 원문에는 「총리(the Prime Minister)」로만 적혀 있다 히틀러(Adolf Hitler) — 원문에는 직접 이름이 나오지 않고 「독일」로 적혀 있다"}, {"id": "d394", "order": 394, "date": "1941-11-15", "group": "B", "eyebrow": "d394 · Oral Statement Handed by the Secretary of State to the Japanese Ambassador (Nomura) on November 15, 1941", "title": "1941년 11월 15일 국무장관이 주미 일본대사(노무라)에게 건넨 구두 성명(oral statement)", "badge": null, "list_right": "문서 394", "meta": [{"k": "일자", "v": "1941-11-15"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/254019/25", "txt": true}, {"k": "발신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "수신", "v": "The Japanese Ambassador (Nomura) 주미 일본대사 노무라", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "구두 성명"}], "links": [{"k": "FRUS", "text": "문서 394 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d394"}], "summary": "일본이 통상상의 비차별 원칙을 「전 세계에 똑같이 적용될 것을 전제로」 받아들이겠다고 한 단서에 대해, 미국이 자국의 무조건 최혜국대우 정책 실적을 들어 그 단서가 필요한지 묻고, 부속서로 미·일 경제정책 공동선언 초안을 시안으로 제시한다.", "points": ["일본 정부는 「해당 원칙이 그 밖의 전 세계에도 똑같이 적용된다는 전제 위에서, 중국을 포함한 모든 태평양 지역에 적용될 국제 통상관계에서의 비차별 원칙을 인정한다」고 진술했다(밑줄은 미국이 그은 것).", "미국은 밑줄 친 부분의 뜻이 온전히 분명하지 않다고 보면서, 일본이 미국에게 주권 관할 밖 지역의 차별 관행에 대한 책임을 지라고 요구하거나 다른 모든 정부의 동의와 협력 없이는 이행할 수 없는 조건을 미·일 합의에 넣자고 제안하는 것은 아니라고 상정한다.", "무조건 최혜국대우 원칙은 오랫동안 미국 통상정책의 초석이며, 제1차 세계대전 이후 사실상 모든 통상조약에 담겼고 1934년 이후 무역장벽 인하 협정 계획에서도 일관되게 적용되었다.", "미국은 22개 협정에서 천 개가 넘는 관세 분류의 세율을 인하하고 그 인하를 두 나라만 빼고 일본을 포함한 전 세계에 확대했다. 그 두 나라는 비차별 원칙에서 노골적으로 이탈한 통상 관행을 가진 나라였고, 그 중 한 나라가 노골적 차별 조치를 버리자 미국은 즉시 관세 인하 혜택을 확대했다.", "미국은 자국의 무역관계를 무조건 최혜국대우 기초 위에 놓았을 뿐 아니라 전 세계에 그 정책의 적용을 넓히려 일관되게 노력했으며, 협정에서 얻은 양허를 모든 나라로 확대할 것을 주창해 왔다.", "미국은 일본이 이 비차별 정책 촉진에 진심으로 협력한다면 일본 정부의 진술이 겨냥한 목표에 크게 다가서리라고 본다.", "그리하여 미국은 문제의 단서, 곧 「해당 원칙이 그 밖의 전 세계에도 똑같이 적용된다는 전제 위에서」가 일본 정부의 견해로 볼 때 필요한지, 그 단서를 생략할 수는 없는지 묻는다.", "부속서로 「미·일 경제정책 공동선언」 초안을 순전히 잠정적인 시안(purely tentative suggestion)으로 제시하되, 그 합의는 태평양 지역 전체를 포괄하는 평화적 해결의 다른 쟁점들에 대한 합의를 전제로 하며, 미국은 교섭에 들어가기 전에 영국 정부 및 특별한 이해를 가진 다른 정부들과 협의할 것을 예정한다고 밝힌다.", "부속 초안은 「비공식, 예비적 탐색, 구속력 없음(Unofficial, Exploratory and Without Commitment)」이라는 표시를 달고 있다.", "부속 초안 제3부(태평양 지역 정책)는 중국에 경제·재정·통화 사무에 대한 완전한 통제를 회복시키고, 미·일 어느 쪽도 중국에서 특혜적·독점적 권익을 구하지 않으며, 중국 정부에 경제개발 종합계획의 착수를 권고하되 미·일에 제3국 못지않은 조건의 참여 기회를 줄 것을 규정한다."], "primary": "1941년 11월 15일\n\n일본 정부는 「해당 원칙이 그 밖의 전 세계에도 마찬가지로 똑같이 적용된다는 양해 위에서, 중국을 포함한 모든 태평양 지역에 적용될 국제 통상관계에서의 비차별 원칙을 인정한다」고 진술하였다. (밑줄은 덧붙인 것임.)\n\n이 진술의 밑줄 친 부분은 그 뜻이 온전히 분명하지 않은 하나의 조건을 제시하고 있다. 그러나 일본 정부가 미국 정부에게 그 주권적 관할 밖에 있는 지역들에서의 차별적 관행에 대하여 책임을 지라고 요구하려는 것이거나, 다른 모든 정부의 동의와 협력이 있어야만 이행될 수 있는 조건을 미국과의 약정에 넣자고 제안하려는 것은 아니라고 상정한다.\n\n무조건 최혜국대우의 원칙은 여러 해 동안 미국 통상정책의 초석이 되어 왔다. 제1차 세계대전 이후 이 원칙은 미국 정부가 체결한 사실상 모든 통상조약에 담겨 왔다. 미국이 무역장벽의 [735면] 인하를 위한 광범위한 통상협정 계획에 착수한 1934년 이래로 미국은 이 원칙을 끊임없이 적용해 왔다. 스물두 개의 협정에서 미국 정부는 미국 관세의 천 개가 넘는 분류 항목에 대하여 그 세율을 인하하였으며, 단 두 나라를 제외하고는 일본과 그 밖의 세계 모든 나라에 이 인하를 확대하였다. 그 예외가 된 나라들은 그 통상 관행이 비차별 대우의 원칙으로부터 노골적으로 이탈한 나라들이었다. 그 나라들에 대하여 통상협정상의 양허를 유보한 것 자체가 비차별 정책을 촉진하는 하나의 조치였으니, 그 목적이 차별적 관행을 버리도록 유인을 만들어 내는 데 있었기 때문이다. 그러한 양허의 혜택이 유보되었던 나라들 가운데 하나가 그 노골적인 차별 조치들을 버리자, 미국은 즉시 그 나라에 자국의 통상협정에서 이루어진 관세 인하의 혜택을 확대하였다.\n\n미국 정부는 외국들과의 자국의 무역관계를 무조건 최혜국대우의 기초 위에 놓았을 뿐 아니라, 전 세계에 걸쳐 그 정책의 적용을 넓히고자 일관되게 노력하여 왔다. 미국은 적절한 기회가 있을 때마다 다른 나라들에게 비차별 정책의 채택을 촉구하였으며, 온갖 종류의 특혜와 차별을 점진적으로 없애 나가고자 힘써 왔다.\n\n위에 말한 스물두 개의 통상협정에서 미국 정부는 외국들로부터 수천 가지 산품에 대한 관세 및 그 밖의 무역장벽 인하에 관한 약속을 얻어 내었다. 이 양허들은 미국에서만이 아니라 다른 나라들로부터도 수입되는 산품들에 영향을 미친다. 미국 정부는 이러한 혜택이 미국으로부터의 수입에만 국한되도록 하는 약속을 구하지도 받아들이지도 않았다. 도리어 미국 정부는 그러한 혜택이 다른 공급국들에도 확대되리라는 전제와 기대 위에서 외국의 무역장벽에 대한 이러한 인하를 얻어 내었다. 실로 미국 정부는 국제무역에서의 비차별이라는 그 전반적 정책의 일부로서, 그러한 협정에서 이루어진 양허를 모든 나라에 확대할 것을 주창하여 왔다. 이러한 방식으로 미국이 추구해 온 것과 같은 통상협정 계획에서 나오는 무역장벽의 인하는 가능한 한 가장 넓은 효력을 갖게 되고, 모든 나라가 그로부터 이익을 얻는 세계무역의 증진에 최대한의 기여를 하게 된다.\n\n만약 일본이 미국 정부가 실행하고 주창하여 온 대로, 그리고 일본 정부 자신이 여러 해 동안 실행하고 주창하여 온 대로 비차별 정책을 촉진하는 데 전심으로 협력하는 데 힘을 쏟는다면, 문제의 일본 정부 진술이 염두에 두고 있는 목표를 달성하는 쪽으로 크게 한 걸음 나아가게 되리라고 믿는다.\n\n[736면]\n\n이상에 비추어, 미국 정부는 일본 정부의 견해로 보아 논의 중인 그 단서, 곧 「해당 원칙이 그 밖의 전 세계에도 마찬가지로 똑같이 적용된다는 양해 위에서」라는 문구가 필요한지, 그리고 그 단서를 생략할 수는 없는지 의문을 제기한다.\n\n미국 정부가 국제 통상관계에서의 비차별 원칙을 어떤 방식으로 적용하여 왔고 또 적용할 용의가 있는지를 실제로 보여 주는 것으로서, 미·일 경제정책 공동선언이 될 만한 것의 초안 하나를 순전히 잠정적인 시안으로서 검토에 부친다. 물론 그러한 선언에 대한 합의는 태평양 지역 전체를 포괄하는 평화적 해결에 관련된 다른 여러 점에 대한 합의를 전제로 하며, 미국 정부는 그러한 미·일 경제정책 공동선언이 될 만한 것에 관한 교섭에 들어가기에 앞서 영국 정부 및 특별한 이해관계를 가진 그 밖의 정부들과 이 문제를 논의할 것으로 예정하고 있음은 말할 것도 없다.\n\n[부속서]\n\n1941년 11월 15일 국무장관이 주미 일본대사(노무라)에게 건넨 문서 초안\n\n비공식, 예비적 탐색, 구속력 없음\n\n경제정책에 관한 미합중국과 일본의 공동선언\n\nI. 전반적 정책\n\n1.\n\n미합중국 정부와 일본국 정부는, 모든 나라에 대하여 무역장벽을 낮추고 국제 통상관계에서 모든 형태의 차별을 없애도록 촉구하는 데, 그리고 대체로 모든 나라가 각자의 경제를 지키고 발전시키는 데 필요로 하는 물자와 상품을 평화로운 무역 과정을 통하여 확보할 합당한 기회를 갖게 되는 그러한 국제무역 및 국제투자의 조건을 만들어 내는 방향으로 노력하는 데 충분히 협력할 것을 약속한다.\n\n2.\n\n미합중국 정부와 일본국 정부는, 위에 상정된 유형의 국제 경제관계를 만들어 내는 데 각자가 각자에게 알맞은 기여를 할 것을 약속한다.\n\n3.\n\n그 방향으로 나아가는 중요한 조치로서, 미합중국 정부와 일본국 정부는 양국 사이에 아래에 제시된 경제 관계를 수립하며, 또한 태평양 지역에 그것을 수립하도록 힘쓴다.\n\n[737면]\n\nII. 미합중국과 일본의 관계\n\n1.\n\n미합중국과 일본은 양국 사이의 통상·금융 및 그 밖의 경제 관계를 정상적인 기초 위로 회복시키는 조치를 실행 가능한 한 신속히 개시할 것을 약속한다.\n\n2.\n\n미합중국과 일본은 양국 사이의 호혜통상협정 체결을 내다보는 논의에 들어갈 것에 동의한다.\n\n3.\n\n현재의 국제적 위기 동안 일본과 미합중국은 각기 상대방에게 그 자신의 사용을 위한 상품의 수출을 허용하되, 각자가 그 자신의 안전과 자위를 위하여 요구할 수 있는 제한이나 한정에 따르는 것으로 양해한다. 양국 정부는 그러한 제한이나 한정을 우방국들과의 관계를 지배하는 정신에 따라 적용할 것으로 양해한다.\n\nIII. 태평양 지역에서의 정책\n\n1.\n\n중국의 경제·재정 및 통화 사무에 대한 완전한 통제권이 중국에 회복된다.\n\n2.\n\n미합중국 정부와 일본국 정부는 중국에서 자국 또는 자국민을 위하여 어떠한 특혜적 또는 독점적 통상상의 권리나 그 밖의 경제적 권리도 구하지 않을 것과, 중국으로부터 어떠한 제3국에 부여되는 것보다 불리하지 아니한 통상상의 대우와 이 선언 제1항에 진술된 전반적 정책의 촉진에 대한 충분한 협력을 확보하는 방향으로 그들의 모든 영향력을 사용할 것을 약속한다.\n\n3.\n\n미합중국 정부와 일본국 정부는 중국 정부에 대하여, 필요한 경우 외국의 원조를 받아 경제개발의 종합적인 계획을 개시하되 미합중국과 일본에 어떠한 제3국에 부여되는 것보다 불리하지 아니한 조건으로 그에 참여할 충분한 기회가 주어지도록 할 것을 제의할 것을 약속한다.\n\n4.\n\n미합중국과 일본이 각기 태평양 지역의 다른 나라들과 수립하고자 하는 관계는 이 선언에 제시된 기본 원칙들의 지배를 받는다. 그리고 미합중국 정부와 일본국 정부는 그 나라들에 대하여, 실행 가능한 곳이면 어디서나 경제개발의 종합적인 계획을 착수하되, 외국의 원조가 요청되는 한에서는 미합중국과 일본에 어떠한 제3국에 부여되는 것보다 불리하지 아니한 조건으로 그러한 계획에 참여할 충분한 기회가 부여되도록 촉구할 것에 동의한다.\n\n[738면]", "secondary": "November 15, 1941\n\nThe Japanese Government has stated that it “recognizes the principle of non-discrimination in international commercial relations to be applied to all the Pacific areas, inclusive of China, on the understanding that the principle in question is to be applied uniformly to the rest of the entire world as well”. (Underlining added.)\n\nThe underlined portion of the statement sets forth a condition the meaning of which is not entirely clear. It is assumed, however, that it is not the intention of the Japanese Government to ask the Government of the United States to assume responsibility for discriminatory practices in areas outside of its sovereign jurisdiction, or to propose including in an arrangement with the United States a condition which could be fulfilled only with the consent and cooperation of all other Governments.\n\nThe principle of unconditional most-favored-nation treatment has for many years been the cornerstone of the commercial policy of the United States. Since the first World War this principle has been embodied in virtually every commercial treaty concluded by this Government. Since 1934, when the United States embarked upon an extensive program of commercial agreements for the reduction of [735면] trade barriers, it has constantly applied this principle. In twenty-two agreements this Government has on its part reduced duties on over a thousand classifications of the American tariff, and it has extended these reductions to Japan and all other countries of the world with only two exceptions. These exceptions have been countries whose commercial practices represented a flagrant departure from the principle of non-discriminatory treatment. The withholding of trade-agreement concessions from those countries was itself a step in furtherance of the policy of non-discrimination since the purpose was to create inducement for the abandonment of discriminatory practices. One of the countries from which the benefit of such concessions had been withheld abandoned its flagrant discriminatory measures, and the United States at once extended to that country the benefit of the duty reductions made in its trade agreements.\n\nThe Government of the United States has not only placed its own trade relations with foreign countries on an unconditional most-favored-nation basis, but has sought consistently to further the application of that policy throughout the world. On every appropriate occasion it has urged upon other countries the adoption of non-discriminatory policies and has sought to bring about the progressive elimination of preferences and discriminations of all kinds.\n\nIn the twenty-two trade agreements above referred to, the Government of the United States has obtained from foreign countries commitments respecting the reduction of tariffs and other trade barriers on thousands of products. These concessions affect products which are imported not only from the United States but from other countries as well. The Government of the United States has neither sought nor accepted commitments whereby these benefits would be restricted to imports from the United States. On the contrary, it has obtained these reductions in the trade barriers of foreign countries on the assumption and expectation that they would be extended to other supplying countries. Indeed, as part of its general policy of nondiscrimination in international trade, it has advocated the extension to all countries of the concessions made in such agreements. In this way the reduction of trade barriers which results from a program of trade agreements such as that pursued by the United States is given the widest possible effect and makes the maximum contribution to the building up of world trade from which all nations benefit.\n\nIt is believed that, if Japan would devote itself to wholehearted cooperation in furthering the policy of non-discrimination as practiced and advocated by the Government of the United States and as practiced and advocated for many years by the Government of Japan, a long forward step would be taken toward attaining the objective which the Japanese Government’s statement under reference has in view.\n\n[736면]\n\nIn the light of the foregoing, the Government of the United States raises question whether in the view of the Japanese Government there is need of the proviso under discussion, namely, “on the understanding that the principle in question is to be applied uniformly to the rest of the entire world as well”, and whether the proviso might not be omitted.\n\nAs a practical manifestation of the way in which the Government of the United States has applied and is prepared to apply the principle of non-discrimination in international commercial relations, there is offered for consideration as a purely tentative suggestion a draft of a possible United States-Japanese declaration on economic policy. It is understood, of course, that agreement as to such a declaration is subject to agreement on the other points involved in a peaceful settlement covering the Pacific area as a whole and that this Government would expect, before entering into negotiations on such a possible United States-Japanese declaration on economic policy, to discuss the matter with the British Government and with other specially interested governments.\n\n[Annex]\n\nDraft Document Handed by the Secretary of State to the Japanese Ambassador (Nomura) on November 15, 1941\n\nUnofficial, Exploratory and Without Commitment\n\nJoint Declaration by the United States and Japan on Economic Policy\n\ni. general policy\n\n1.\n\nThe Government of the United States and the Government of Japan undertake to cooperate fully in urging all nations to reduce trade barriers, to eliminate all forms of discrimination in international commercial relations, and in general to work toward the creation of conditions of international trade and international investment under which all countries will have a reasonable opportunity to secure, through peaceful trade processes, the means of acquiring those goods and commodities which each country needs for the safeguarding and development of its economy.\n\n2.\n\nThe Government of the United States and the Government of Japan undertake that each of them shall make its appropriate contribution toward the creation of the type of international economic relations envisaged above.\n\n3.\n\nAs important steps in that direction, the Government of the United States and the Government of Japan shall establish between themselves and shall seek to establish in the Pacific area the economic relationships indicated below.\n\n[737면]\n\nii. the united states-japan relationship\n\n1.\n\nThe United States and Japan undertake to inaugurate, as rapidly as practicable, measures toward restoring the commercial, financial and other economic relationships between them to a normal basis.\n\n2.\n\nThe United States and Japan agree to enter into discussions looking toward the negotiation of a reciprocal trade agreement between the two countries.\n\n3.\n\nIt is understood that during the present international emergency Japan and the United States each shall permit export to the other of commodities for its own use subject to such restrictions or limitations as may be required by each for its own security and self-defense. It is understood that both governments will apply any such restrictions or limitations in the spirit dominating relations with friendly nations.\n\niii. policy in the pacific area\n\n1.\n\nComplete control over its economic, financial and monetary affairs shall be restored to China.\n\n2.\n\nThe Government of the United States and the Government of Japan undertake not to seek in China any preferential or monopolistic commercial or other economic rights for themselves or their nationals, but to use all their influence toward securing from China commercial treatment for themselves no less favorable than that accorded to any third country and full cooperation in the promotion of the general policy stated in the first paragraph of this Declaration.\n\n3.\n\nThe Government of the United States and the Government of Japan undertake to suggest to the Chinese Government that it inaugurate, with foreign assistance where necessary, a comprehensive program of economic development, a full opportunity to participate in which shall be accorded the United States and Japan on terms no less favorable than those accorded any third country.\n\n4.\n\nThe relations which the United States and Japan, respectively, will seek to establish with other countries of the Pacific area shall be governed by the basic principles set forth in this Declaration; and the Governments of the United States and of Japan agree to urge those countries, wherever feasible, to undertake comprehensive programs of economic development with full opportunity to participate in such programs, in so far as foreign assistance may be requested, accorded to the United States and to Japan on terms no less favorable than those accorded any third country.\n\n[738면]", "notes": [], "warn": false, "pages": ["0801", "0802", "0803", "0804"], "search": "헐(Cordell Hull) — 국무장관 노무라(野村吉三郎, Nomura) — 주미 일본대사"}, {"id": "d395", "order": 395, "date": "1941-11-17", "group": "A", "eyebrow": "d395 · Memorandum of a Conversation", "title": "회담 비망록", "badge": null, "list_right": "문서 395", "meta": [{"k": "일자", "v": "1941-11-17"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/254014/35", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 395 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d395"}], "summary": "노무라 대사가 구루스를 국무장관에게 소개한 회담의 기록이다. 헐은 양국의 장기적 이해에 충돌은 없어야 한다고 말하고, 구루스는 도조가 미국과의 합의를 진심으로 바란다고 전한다.", "points": ["일본대사(노무라)가 자신의 요청으로 잡은 약속에 따라 국무장관실을 찾아 구루스를 소개했다.", "국무장관은 구루스가 이 나라에 온 이래 대중과의 관계를 다룬 방식을 칭찬하고, 이어 자신과 동료들이 일본대사에게 품고 있는 존경과 신뢰를 높이 평가해 말했다.", "국무장관은 일본과 미국 양국의 장기적 이해로 보면 두 나라의 진정한 이익에 충돌이 있어서는 안 된다고 말했다.", "국무장관은 세계대전 후 유럽과 미국에서 나타난 근시안적 국가주의 정치가 지금 세계가 겪는 곤란의 원인이라고 하고, 두 나라가 현명하고 멀리 내다보는 정치를 펴기를 바란다고 했다.", "국무장관은 히틀러가 유럽에서 1억~2억의 사람을 총검 끝에 억누르고 있음을 지적하고, 이런 사태가 이 세상에 영속되는 것을 보고 싶지 않다고 말했다.", "구루스는 신임 총리가 군인이라 전임 총리와 견해·태도가 다르리라는 인상이 이 나라 일각에 있는 듯하나, 자신이 도조 대장과 정책을 논의해 보고 그가 미국과의 합의를 진심으로 바라는 것을 알고 기분 좋게 놀랐다고 했다.", "구루스는 오프더레코드로, 도조가 조각 명을 받았을 때 자신에게 각내 요직을 제의했으나 고노에 내각이 국책 수행 방법에 관한 각내 중대한 이견으로 무너졌다는 발표를 읽고 도조가 미국과의 회담을 중단할 뜻이라 생각해 사양했다고 말했다.", "구루스는 회담에서 이견이 생긴 세 가지 요점 가운데 무차별 대우와 유럽 전쟁에 대한 양국 관계의 이견은 도조가 해소 전망을 낙관하는 듯했으나, 중국에서 일본군을 단기간에 철수하기 어려운 까닭에 그 문제가 더 큰 곤란을 낳으리라 보았다고 전했다.", "대통령이 대사와 구루스를 접견할 시각이 다가와 대화가 중단되었고, 대사는 (1) 일본의 평화적 의도와 (2) 제안된 양해의 범위 축소에 관한 미국 측 제기 사항에 대한 일본 정부의 회답이라는 두 문서를 국무장관에게 건넸다."], "primary": "[워싱턴,] 1941년 11월 17일.\n\n일본대사가 자신의 요청으로 잡은 약속에 따라 구루스(来栖三郎, Kurusu) 씨를 소개하고자 국무장관실을 방문했다.\n\n대사가 구루스 씨를 소개하고 알맞은 인사를 주고받은 뒤, 국무장관은 구루스 씨가 이 나라에 온 이래 대중과의 관계를 다루어 온 방식을 칭찬했다. 이어 국무장관은 자신과 동료들이 일본대사에게 품고 있는 존경과 신뢰에 관하여 높이 평가하는 말을 했다.\n\n국무장관은 이어서, 일본과 미국 양국의 긴 안목의 이해관계라는 관점에서 볼 때 두 나라의 진정한 이익에는 아무런 충돌도 있어서는 안 된다고 느낀다고 말했다. 그리고 세계대전 후 유럽과 미국에서 나타난 근시안적인 국가주의적 정치를 언급하며, 그것이 지금 세계가 겪고 있는 곤란의 원인이라고 말했다. 그는 우리 두 나라가 현명하고 멀리 내다보는 정치를 펴 나가고, 그리하여 세계를 다시 평화의 길 위에 올려놓는 데 무언가 이바지할 수 있기를 바란다고 말했다. 그는 히틀러가 유럽에서 1억 내지 2억의 사람들을 총검 끝에 억눌러 놓고 있다는 사실을 지적하고, 이는 우리가 이 세상에 영속되는 것을 보고 싶지 않은 사태라고 말했다.\n\n구루스 씨는, 이 나라의 어떤 방면에서는 신임 총리가 군인인 까닭에 전임 총리와는 다른 견해와 태도를 지녔으리라는 유감스러운 인상이 있는 듯하나, 자신은 도조(東條英機, Tojo) 대장과 정책을 논의했을 때 그가 미국과 합의에 이르기를 진심으로 바라고 있음을 알고 기분 좋게 놀랐다고 말했다. 그는 국무장관에게 오프더레코드로 말하고 싶다고 하면서, 도조 대장이 조각의 명을 받았을 때 도조는 구루스에게 내각의 중요한 자리를 맡으라고 권했으나 구루스는 이를 사양했다고 말했다. 국책 수행의 방법에 관한 각내의 중대한 이견 때문에 고노에(近衞文麿, Konoye) 내각이 무너졌다는 발표를 읽고, 도조 대장이 미국과의 회담을 중단할 뜻이라고 생각했기 때문이라는 것이다. 구루스는 그 뒤 자신의 이번 사명에 관하여 도조 대장과 논의했으며, 미국과 평화적 해결에 이르려는 대장의 의욕에 관하여 충분히 안심하게 되었다고 말했다. 구루스는, 우리 회담에서 이견이 생긴 세 가지 중요한 점 가운데 [739면] 도조 대장은 무차별 대우 및 유럽 전쟁에 대한 양국의 관계에 관한 이견을 해소할 전망에 대하여는 낙관적인 듯했으나, 중국에서 일본 군대를 짧은 기간에 철수시키기 어려운 까닭에 그 문제는 더 큰 곤란을 안겨 줄 문제가 되리라고 대장은 생각했다고 말했다.\n\n대통령이 대사와 구루스 씨를 접견할 시각이 다가온 까닭에 대화는 이 대목에서 중단되었다.\n\n대사는 국무장관에게 두 건의 문서를 건네면서, 이는 (1) 일본의 평화적 의도[주57]와 (2) 제안된 양해의 범위를 좁히는 문제[주58]에 관하여 우리가 제기한 점들에 대한 일본 정부의 회답이라고 말했다.\n\nJ[oseph] W. B[allantine]", "secondary": "[Washington,] November 17, 1941.\n\nThe Japanese Ambassador called at the Secretary’s office to present Mr. Kurusu in pursuance of an appointment made at the Ambassador’s request.\n\nAfter the Ambassador had presented Mr. Kurusu and appropriate amenities had been exchanged, the Secretary complimented Mr. Kurusu upon the way he had handled his relations with the public since coming to this country. The Secretary then spoke highly of the respect and confidence in which the Secretary and his associates hold the Japanese Ambassador.\n\nThe Secretary then went on to say that, from the point of view of the long-swing interests of both Japan and the United States, he felt that there should be no conflict in the real interests of the two countries. He referred then to the short-sighted nationalistic statesmanship that developed in Europe and in the United States after the World War which he said was responsible for the troubles from which the world is now suffering. He expressed the hope that our two countries could pursue a wise, far-sighted statesmanship and in this way do something to contribute to put the world back on peaceful courses. He pointed to the fact that Hitler was holding down one or two hundred million people in Europe at the point of the bayonet and observed that this was a situation we do not like to see perpetuated in this world.\n\nMr. Kurusu said that there appeared to be an unfortunate impression that in certain quarters in this country the new Prime Minister, being a military man, had an outlook and attitude which was different from that of the previous Prime Minister, but that Kurusu himself had been agreeably surprised when he discussed policies with General Tojo and found him to be sincerely desirous of reaching an agreement with the United States. He said he wished to tell the Secretary off the record that when General Tojo had been commanded to form a cabinet, Tojo had invited Kurusu to take an important position in the cabinet but that Kurusu had declined because he had thought, having read the announcement that the Konoye cabinet had fallen on account of important differences within the cabinet as to methods of executing national policy, that General Tojo intended to discontinue the conversations with the United States. Kurusu said that later on he had discussed with General Tojo the matter of his present mission and he was fully reassured of the General’s desire to reach a peaceful settlement with the United States. Kurusu said that in the three important points on which differences have developed in our conversations [739면] General Tojo seemed to be optimistic in regard to the prospects of eliminating the differences in respect to nondiscrimination and the relations of the two countries toward the European war, but that the General felt that on account of the difficulty of withdrawing Japanese troops from China in a short time this problem would be one which would present greater difficulties.\n\nThe conversation was interrupted at this point owing to the approach of the hour for the President’s reception of the Ambassador and Mr. Kurusu.\n\nThe Ambassador handed the Secretary two documents which the Ambassador said were the Japanese Government’s reply to the points we had raised on (1) Japan’s peaceful intentions [주57] and (2) on narrowing down the scope of the proposed understanding. [주58]\n\nJ[oseph] W. B[allantine]", "notes": ["[주57] 바로 아래 문서.", "[주58] 뒤 740면."], "warn": false, "pages": ["0805"], "search": "노무라(野村吉三郎, Nomura) — 주미 일본대사. 원문에는 「일본대사」로만 적혀 있다 구루스(来栖三郎, Kurusu) — 특사 헐(Cordell Hull) — 국무장관. 원문에는 「the Secretary 국무장관」으로만 적혀 있다 도조(東條英機, Tojo) — 일본 총리, 원문은 「General Tojo 도조 대장」 고노에(近衞文麿, Konoye) — 전임 총리 히틀러(Adolf Hitler) 루스벨트(Franklin D. Roosevelt) — 대통령. 원문에는 「the President 대통령」으로만 적혀 있다 밸런타인(Joseph W. Ballantine) — 비망록 작성자"}, {"id": "d396", "order": 396, "date": "1941-11-17", "group": "B", "eyebrow": "d396 · Oral Statement Handed by the Japanese Ambassador (Nomura) to the Secretary of State on November 17, 1941", "title": "1941년 11월 17일 일본 대사(노무라)가 국무장관에게 건넨 구두 성명", "badge": null, "list_right": "문서 396", "meta": [{"k": "일자", "v": "1941-11-17"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/254014/35", "txt": true}, {"k": "발신", "v": "일본 대사 노무라(野村吉三郎, Nomura)", "txt": true}, {"k": "수신", "v": "국무장관 헐(Cordell Hull)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "구두 성명"}], "links": [{"k": "FRUS", "text": "문서 396 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d396"}], "summary": "11월 12일 국무장관의 구두 성명에 대한 일본 정부의 회답으로, 인용된 여러 항목은 9월 6일·25일 제안에 이미 담겨 있고 이를 확인하되 그 확인은 현 교섭의 타결을 전제로 한다고 밝힌다.", "points": ["1941년 11월 12일 국무장관이 일본 대사에게 건넨 구두 성명에 대한 회답이며, 대사는 본국 정부의 훈령에 따라 말한다.", "국무장관이 구두 성명에서 인용한 발췌문에 담긴 모든 항목은 일본 정부가 지난 9월 6일과 25일에 미국 정부에 제시한 제안 속에 이미 구현되어 있고, 현 일본 내각도 이 항목들이 그 대체적 취지를 나타내는 것으로 확인하는 데 아무런 이의가 없다.", "다만 그러한 확인은 현재의 미일 교섭이 성공적으로 타결되는 것을 전제로 하며, 혹시라도 그 타결이 이루어지지 않으면 일본 정부는 당연히 위 항목들에 관한 약속에 구속되지 않는다.", "일본 정부의 평화적 의도를 한정하는 것으로 구두 성명에 인용된 어구들은 결국 동일한 하나의 의도를 나타내기 위한 것이었다.", "특히 소비에트 러시아의 경우에는 현존하는 소일 중립조약과 그것이 독소 전쟁과 맺는 관계를 고려하여 다소 상세한 규정을 둔 것이다.", "그 어구들은 주권국가에 마땅하고 필요한 유보를 표현하기 위해 쓰였을 뿐이며, 일본 정부의 평화적 의도를 어떤 식으로든 제한하거나 좁히려는 것이 아니었다."], "primary": "[워싱턴,] 1941년 11월 17일.\n\n1941년 11월 12일 국무장관이 일본 대사에게 건넨 구두 성명에 관하여, 일본 대사는 본국 정부의 훈령에 따라 다음과 같이 진술한다. —\n\n1.\n\n국무장관이 구두 성명에서 인용한 발췌문에 담긴 모든[sic] 항목은 일본 정부가 지난 9월 6일과 25일에 미국 정부에 제시한 제안들 속에 구현되어 있으며, 현 일본 내각 또한 이 항목들을 그 대체적 취지를 나타내는 것으로 확인하는 데 아무런 이의가 없다. 그러나 그러한 확인은 일본 정부와 미국 정부 사이의 현재 교섭이 성공적으로 타결되는 것을 전제 조건으로 삼는다는 점, 즉 혹시라도 그러한 성공적 타결이 이루어지지 않을 경우 일본 정부는 위에 말한 항목들에 관한 자기 약속에 당연히 구속된 채로 남지 않는다는 점은 당연한 것으로 여겨져야 한다.\n\n2.\n\n일본 정부의 평화적 의도를 한정하는 것으로서 구두 성명에 인용된 어구들에 관해서는, 문제의 어구들이 결국 하나의 동일한 의도를 표현하기 위한 것이었으며, 특히 소비에트 러시아의 경우에는 현존하는 소일 중립조약 및 그것이 독일과 소비에트 러시아 사이의 전쟁과 맺는 관계를 고려하여 다소간 상세한 규정을 두었던 것이라고 설명해 두는 바이다. [740면] 이 어구들은 주권국가에 마땅히 따르며 또 주권국가에 필요한[sic] 유보를 표현하기 위해서만 쓰였을 뿐, 일본 정부의 평화적 의도를 어떤 식으로든 제한하거나 좁히려는 것이 아니었다.", "secondary": "[Washington,] 17–11–1941.\n\nReference is made to the oral statement handed by the Secretary of State to the Japanese Ambassador on November 12, 1941 and, under instructions from his Government, the Japanese Ambassador states as follows:—\n\n1.\n\nThe all [sic] points contained in the excerpts which the Secretary of State quoted in the oral statement are embodied in the proposals which the Japanese Government made to the United States Government on the 6th and 25th of September last and the present Japanese Cabinet also has no objection whatever to confirming these points as expressing its general purport. It is, however, to be taken for granted that such confirmation has the successful conclusion of the present negotiations between the Japanese and United States Governments as its prerequisite, and that is, failing by any chance such successful conclusion, the Japanese Government is naturally not to be left bound by its commitment on the points above mentioned.\n\n2.\n\nIn regard to the phrases quoted in the oral statement as modifying the peaceful intent of the Japanese Government, it is to be explained that the phrases in question were after all for the purpose of expressing one and the same intent and that, in the case of Soviet Russia in particular, a more or less detailed stipulation was made out of considerations of the existing Soviet-Japanese neutrality treaty and its relation to the war between Germany and Soviet Russia. [740면] These phrases were used only in order to express the qualification which is due to and necessary for an [sic] sovereign state and were not intended to limit or narrow down in any way the peaceful intentions of the Japanese Government.", "notes": [], "warn": false, "pages": ["0806"], "search": "노무라(野村吉三郎, Nomura) — 주미 일본대사 헐(Cordell Hull) — 국무장관(본문에는 「국무장관」으로만 표기)"}, {"id": "d397", "order": 397, "date": "1941-11-17", "group": "B", "eyebrow": "d397 · Oral Statement Handed by the Japanese Ambassador (Nomura) to the Secretary of State on November 17, 1941", "title": "1941년 11월 17일 일본대사 노무라가 국무장관에게 건넨 구두 성명", "badge": null, "list_right": "문서 397", "meta": [{"k": "일자", "v": "1941-11-17"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2466", "txt": true}, {"k": "발신", "v": "일본대사 노무라(野村吉三郎, Nomura)", "txt": true}, {"k": "수신", "v": "국무장관 헐(Cordell Hull)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "구두 성명"}], "links": [{"k": "FRUS", "text": "문서 397 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d397"}], "summary": "일본 정부가 정치적 안정 원칙을 태평양 전역에 적용하는 데 아무런 이의가 없으며, 9월 25일 제안 제6조에서 「남서」라는 낱말을 삭제할 용의가 있음을 밝힌 구두 성명.", "points": ["일본대사는 「일본 정부는 정치적 안정의 원칙을 태평양 전역에 적용하는 데 하등의 이의가 없다」고 말할 권한을 부여받았다.", "일본 정부는 9월 25일자 제안 제6조의 본문에서 「남서(southwestern)」라는 낱말을 삭제할 용의가 있다.", "「남서태평양」에서 「태평양」으로 범위를 넓히는 것으로, 미국이 문제 삼아 온 지역 한정을 푸는 양보다.", "문서 머리의 날짜 표기가 「17–11–1941」로 일본식 일-월-년 순으로 적혀 있다. 일본 측이 작성한 문건임을 보여준다."], "primary": "[워싱턴,] 17–11–1941.\n\n일본대사는 다음과 같이 말할 권한을 부여받았다. 즉, 일본 정부는 정치적 안정의 원칙을 태평양 전역(the entire area of the Pacific)에 적용하는 데 하등의 이의가 없으며, 일본 정부는 9월 25일자 자국 제안 제6조의 본문에서 「남서(southwestern)」라는 낱말을 삭제할 용의가 있다.", "secondary": "[Washington,] 17–11–1941.\n\nThe Japanese Ambassador has been authorized to state that the Japanese Government has no objection whatever to apply the principle of political stabilization to the entire area of the Pacific and that the Japanese Government is willing to eliminate the word “southwestern” from the text of Article VI of its proposal of September 25th.", "notes": [], "warn": false, "pages": [], "search": "노무라(野村吉三郎, Nomura) — 주미 일본대사 헐(Cordell Hull) — 미국 국무장관"}, {"id": "d398", "order": 398, "date": "1941-11-17", "group": "A", "eyebrow": "d398 · Memorandum by the Secretary of State", "title": "국무장관의 각서", "badge": null, "list_right": "문서 398", "meta": [{"k": "일자", "v": "1941-11-17"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2466", "txt": true}, {"k": "발신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 398 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d398"}], "summary": "헐 국무장관이 노무라 대사와 구루스 특사를 백악관에 동행하여 대통령에게 소개한다. 삼국동맹과 자위, 중국 철병, 태평양의 침략자가 누구인가를 두고 오간 말을 적은 기록이다.", "points": ["헐이 노무라 대사와 구루스 사부로 대사를 대통령에게 접견시키기 위해 백악관에 동행했다.", "몇 분간의 인사와 의례가 오간 뒤 대통령이 양국 사이의 오해와 이견을 거론하며, 양국 간 전쟁을 피하고 태평양 지역에 관한 한 공정하고 평화로운 기초 위에서 해결을 이루고자 하는 미국의 바람을 분명히 했고, 일본도 같은 바람이라는 대사의 진술을 받아들였다.", "구루스는 회담 내내 「양국 간의 분규를 피할 합의를 이루어 낼 길을 찾아야 한다」는 한 가지 말을 되풀이했고, 태평양을 가로질러 온통 화약통 같다고 말했다.", "구루스가 삼국동맹을 그럴듯하게 둘러대려 하자(some specious attempt), 헐은 11월 15일 노무라와의 논의에서 쓴 것과 비슷한 말로 답했다. 일본이 독일과의 삼국동맹에 매달린 채로는 어떤 태평양 평화 해결도 대통령과 자신에게 이루 말할 수 없는 비난을 부를 것이고, 그 평화 약정은 조금도 진지하게 받아들여지지 않을 것이며 태평양 관계국들은 일본의 침략에 대비한 무장 노력을 배가할 것이라고 했다.", "헐은 자위(self-defense) 문제를 강조했다. 히틀러가 무제한 침략을 공식 선언하고 병력 천만과 항공기 삼만으로 지구를 가로질러 침략 행군을 시작한 그때부터 미국은 위험에 처했고 그 위험은 매주 커져 왔으며, 미국은 자위 외의 아무런 동기 없이 그 위험을 인정하고 백억·이백오십억·오백억 달러를 자위에 투입하기로 했는데, 정작 일본은 이것이 자위인지 아닌지 모르겠다고 하니 미국 국민에게 그 태도를 이해시킬 수 없다고 했다.", "대통령은 얼마 전 서반구 둘레에 어떤 곳은 해상 300마일, 어떤 곳은 1,100마일에 이르는 구역을 선포한 일을 들며 그것이 자위라고 덧붙였다.", "헐은 미국인과 일본인이 다 같이 자부심 있는 위대한 국민이므로 어느 쪽도 상대를 허세로 위협할 까닭이 없고, 우리 회담에 허세가 끼어든다고는 여기지 않으며 회담은 진정한 우호에서 나온 것이라는 관점에서 노무라와 자기가 진행해 왔다고 말했다.", "구루스는 독일이 아직 일본에게 싸워 달라고 요구한 적이 없으며 일본은 싸우지 않고도 바람직한 목적에 이바지하고 있다고 말했다. 이는 일본이 미·영의 해군과 항공력 등을 딴 데로 돌려놓고 있다는 뜻이었을 것이다.", "구루스가 현 태평양 정세를 두고 미국이 방어 상태인가 하는 문제를 꺼내자, 대통령과 헐은 태평양에서 침략자는 미국이 아니라 일본이라는 점을 분명히 했다.", "헐은 「대동아 신질서」라는 일본식 공식이 태평양 전역을 군사력으로 정치·경제·사회 등 온통 지배하려는 계획의 다른 이름이라는 것이 미국의 믿음이라고 말했고, 그것이 공해·도서·대륙을 아우르며 다른 모든 나라를 히틀러가 유럽에서, 일본이 중국에서 하는 것과 똑같은 자의적 군사 통치의 처분에 맡기게 되리라고 했다. 대사는 별다른 논평을 하지 않았다.", "구루스가 중국에서 병력을 빼지 않겠다는 계획을 변호하려 하자, 대통령은 일본을 수세로 몰며 그 문제는 모든 사정과 사안의 상대적 경중을 고려해 공정한 방식으로 풀어야 하고, 적당한 단계에 이르면(일본이 미국의 어떤 조정도 원하지 않음을 알지만) 미국 정부가 말하자면 일본과 중국을 서로 소개해 주고 태평양 문제가 이미 결정된 뒤에 남은 세부 조정을 진행하라고 할 수도 있다고 말했다.", "구루스는 중국에서 모든 병력을 한꺼번에 빼내는 것은 대단히 어려운 일이라고 강하게 말했다.", "구루스가 세계대전 때 일본이 산둥에 들어갔을 때 미국이 나가라고 고집한 일을 상기시키자, 헐은 미국은 어느 나라든 새 영토를 이렇게 탈취하는 정책에 온 힘을 다해 반대했고, 자국을 위해서는 단 한 푼의 배상도 한 자의 영토도 받기를 거절했으며, 세계가 이 점에서 새 장을 열지 않으면 나라들이 늘 영토를 두고 싸워 현대전의 방식 아래 곧 서로를 파괴하고 철저히 빈곤하게 만들 것이라 주장했다고 답하고, 어쨌든 일본은 이 점에서 잘 지냈다고 했다.", "통상 정책에 관한 최근 미국 제안이 거론되자 구루스는 아직 검토하지 못했으며 외무성을 떠난 뒤로 통상 정책의 기술적 측면을 많이 잊었다고 말했다.", "대통령은 군비의 파괴적 성격과, 늘 전쟁·황폐·파괴를 뜻하는 항구적 군비 정책의 더욱 파괴적인 효과를 매우 적절하고 시의적절하게 언급하며, 장기적으로 보면 양국 사이에 이해의 차이가 없고 따라서 심각한 이견이 있을 까닭도 없다고 강조했다.", "전체적으로 일본대사와 구루스가 새로 내놓은 것은 아무것도 없었고, 구루스는 양국 사이에 심각한 이견이 있어야 할 이유가 없으며 현 사태를 풀 길을 찾아야 한다는 호소를 끊임없이 했다.", "구루스는 도조 총리가 육군 사람임에도 평화적 조정을 매우 바라고 있다고 언급했고, 대통령은 그 말을 듣고 관심과 만족을 표했다.", "대통령은 노무라와 구루스의 발언을, 특히 양국 사이의 세 가지 주요 이견에 관하여 자주 받아넘겼다. 회의에서 이 문제들을 해결하려는 시도는 없었으며, 헐이 이튿날 아침 일본 대표들을 만나기로 하는 양해와 함께 모임이 파했다."], "primary": "[워싱턴,] 1941년 11월 17일.\n\n나는 구루스 사부로(来栖三郎, Saburo Kurusu) 대사가 대통령의 접견을 받을 수 있도록 노무라 대사와 구루스 대사를 백악관까지 동행하였다.\n\n몇 분 동안의 인사와 의례가 오간 뒤, 대통령은 우리 두 나라 사이의 오해와 이견의 문제들을 거론함으로써 보다 진지한 국면을 꺼냈고, 우리 두 나라 사이의 전쟁을 피하고 태평양 지역에 관한 한 공정하고 평화로운 기초 위에서 해결을 이루고자 하는 우리나라의 바람을 분명히 하였으며, 일본의 바람도 마찬가지라는 일본대사의 진술을 받아들였다.\n\n구루스 대사는 회담 내내 계속한 한 가지 말을 이어 갔는데, 그것은 우리 두 나라 사이의 분규를 피할 합의를 이루어 낼 길을 우리가 찾아야 한다는 것이었다. 그는 태평양을 가로질러 온통 화약통 같다고 말하였고, 어떻게든 사태를 조정할 길을 찾아야 한다고 다시 되풀이하였다.\n\n구루스 대사는 삼국동맹을 그럴듯한 말로 둘러대려는 시도를 얼마간 하였다. 나는 11월 15일 노무라 대사와 이 문제를 논의할 때 쓴 것과 비슷한 말로 답하였는데, 여기에 되풀이할 필요는 없다. 나는 일본이 여전히 독일과의 삼국동맹에 매달린 채로 태평양 지역을 위한 어떠한 종류의 평화적 해결이 이루어진다면 그것은 대통령과 [741면] 나 자신이 이루 헤아릴 수 없는 말로 규탄받게 만들 것이며, 그 평화 약정은 한순간도 진지하게 받아들여지지 않을 것이고 태평양에 이해를 가진 모든 나라가 일본의 침략에 대비하여 무장하려는 노력을 배가하게 되리라는 점을 분명히 하였다. 나는 삼국동맹과 자위에 관한 점을 다음과 같이 말함으로써 강조하였다. 히틀러가 무제한의 침략 목표를 노린다는 공식 발표와 함께 병력 천만과 항공기 삼만으로 지구를 가로지르는 침략의 행군에 나섰을 때, 우리나라는 그때부터 위험에 처하였고 그 위험은 이 순간까지 매주 커져 왔다. 그 결과 우리나라는 자위 이외의 아무런 동기 없이 그 위험을 인정하였고, 너무 늦기 전에 스스로를 지키기 위하여 지금까지 나아왔다. 그런데 일본 정부는 우리나라가 그렇게 자위 행동을 하고 있는 것인지 아닌지 모르겠다고 말한다. 우리나라는 그 위험을 하도 깊이 느끼기에 자위에 백억, 이백오십억, 오백억 달러를 쏟아붓기로 하였다. 그런데 일본에게 이것이 자위냐고 물으면 그 문제에 관하여 아무런 의견도 없다는 태도를 보인다 — 나는 이러한 시각을 미국 국민에게 납득시킬 수가 없으며, 국민은 일본이 우리가 자위 행동을 하고 있음을 알고 있음이 틀림없다고 믿기 때문에 일본의 현재 태도를 이해하지 못한다고 말하였다. 나는 그가 자기들의 정치적 어려움을 말하고 있으니 나 역시 우리나라와 일본의 관계와 관련된 우리의 어려움을 이렇게 예시하고 있는 것이라고 말하였다.\n\n대통령은 얼마 전에 자신이 이 반구 둘레에, 어떤 곳은 바다로 300마일, 어떤 곳은 1,100마일에 이르는 구역을 선포한 일을 언급하였다. 대통령은 이것이 자위라고 덧붙였다.\n\n그러자 나는, 노무라 대사와 내가 미국 국민과 일본 국민이 다 같이 자부심 있고 위대한 국민이며 어느 쪽도 상대를 허세로 위협하려 할 까닭이 없다는 관점에서 진행해 왔고, 진정한 우호에서 나온 우리 회담에 허세가 끼어든다고는 여기지 않는다고 말하였다.\n\n대통령은 독일과의 관계 및 우리의 자위와 관련하여 우리의 처지와 일본의 처지를 보여 주는 여러 예를 들었는데, 그것들은 우리의 입장을 부각하고 일본 측 입장의 궤변을 드러내는 데 이바지하였다.\n\n구루스 대사는 독일이 이제까지 일본에게 싸워 달라고 요구한 적이 없으며, 일본은 그렇게 하지 않고도 바람직한 목적에 이바지하고 있다고 말하였다 — 이는 일본이 미국과 영국의 해군, 항공기 등을 딴 데로 돌려놓고 있다는 뜻이었음이 틀림없다.\n\n현재의 태평양 정세에서 미국이 방어하는 쪽인가 하는 그 이상의 문제가, 구루스 대사가 그 정세에 관하여 한 얼마간의 일반적인 논의를 통하여 나왔고, 대통령과 나는 태평양에서 침략자는 우리가 아니라 일본이라는 점을 분명히 하였다.\n\n[742면]\n\n또 다른 대목에서 나는, 대동아 신질서라는 일본식 공식은 태평양 지역 전부를 군사력으로 정치적·경제적·사회적으로 그리고 그 밖의 모든 면에서 온통 지배하려는 계획의 다른 이름일 뿐이라는 것이 우리나라의 믿음이라고 말하였다. 그것은 공해와 도서와 대륙을 포함할 것이며, 히틀러의 계획이 유럽에서, 일본의 계획이 중국에서 하는 것과 꼭 마찬가지로 그 밖의 모든 나라를 매우 자의적인 군사 통치의 처분에 맡기게 되리라고 하였다. 대사는 별다른 논평을 하지 않았다.\n\n구루스 대사 쪽에서 중국으로부터 병력을 빼내지 않겠다는 자기들 계획을 변호하려는 노력이 얼마간 있었다. 대통령은 일본 측을 수세에 몰아넣으면서, 그 문제는 관련된 사안들의 모든 사정과 상대적인 경중을 고려하여 공정한 방식으로 풀어 나가야 한다고 말하였다. 그리고 적절한 단계에 이르면, 일본이 우리가 어떤 식으로든 조정하는 것을 바라지 않는다는 것을 우리가 알고는 있으나, 미국 정부가 말하자면 일본과 중국을 서로 소개해 주고, 태평양의 문제들이 이미 결정된 다음이니 남아 있는 세부적인 조정을 진행하라고 그들에게 말할 수도 있으리라고 하였다.\n\n구루스 대사는 중국으로부터 모든 병력을 한꺼번에 빼내는 일은 대단히 어려울 것이라고 강하게 말하였다.\n\n구루스 대사는, 물론 우리가 우리 두 나라 사이에 있는 문제들의 양면을 다 꺼내기를 바라는 것이라고 말하면서, 세계대전 중에 일본이 산둥(Shantung)에 들어갔을 때 미국 정부가 일본에게 나가라고 고집한 일을 우리가 기억할 것이라고 말하였다. 나는 이렇게 답하였다. 우리나라는 어느 나라가 되었든 그렇게 할 힘이 닿는 데까지 새 영토를 이렇게 탈취하는 정책에 온 힘을 다하여 반대하였다. 우리나라는 스스로를 위해서는 단 한 푼의 배상도, 한 자의 영토도 받기를 거절하였다. 우리나라는 세계가 이 점에서 새 장을 열어야 하며 그러지 않으면 나라들은 늘 영토를 두고 싸울 것이고 현대적인 전쟁 방식 아래에서는 머지않아 서로를 파괴하고 철저히 빈곤하게 만들 것이라고 주장하였다. 어쨌든 그의 나라는 이 점에서 잘 지냈다.\n\n통상 정책에 관한 우리의 최근 제안 문제를 우리 쪽에서 꺼내자, 구루스 대사는 자기가 그것을 아직 검토하지 못하였으며 외무성에 있던 시절 이후로 통상 정책의 기술적인 측면을 많이 잊어버렸다고 말하였다. 대통령은 군비의 파괴적인 성격과, 늘 전쟁과 황폐와 파괴를 뜻하는 항구적인 군비 정책의 더욱더 파괴적인 효과에 관하여 매우 적절하고 시의적절한 언급을 하였다. 그는 장기적인 관점에서 보면 우리 두 나라 사이에 이해의 차이가 없으며 따라서 심각한 이견이 있을 까닭도 없다는 점을 강조하였다.\n\n대체로 보아 일본대사와 구루스 대사가 새로 내놓은 것은 아무것도 없었다. 구루스 대사는 두 나라 사이에 심각한 이견이 있어야 할 [743면] 이유가 없으며 현재의 사태를 풀 길을 찾아야 한다는 호소를 끊임없이 하였다. 그는 도조 총리가 육군 사람임에도 불구하고 평화적인 조정을 이루기를 매우 바라고 있다고 언급하였다. 대통령은 이 말을 듣고 관심과 만족을 표하였다. 대통령은 특히 우리 두 나라 사이의 세 가지 주요 이견에 관하여 노무라 대사와 구루스 대사의 발언을 자주 받아넘겼다. 그 회의에서 이 문제들을 해결하려는 노력은 없었다. 모임은 내가 내일 아침 일본 대표들을 만나기로 한다는 양해와 함께 파하였다.\n\nC[ordell] H[ull]", "secondary": "[Washington,] November 17, 1941.\n\nI accompanied Ambassador Nomura and Ambassador Saburo Kurusu to the White House in order that the latter might be received by the President.\n\nFollowing several minutes of an exchange of courtesies and formalities, the President brought up the more serious side by referring to the misunderstandings and matters of difference between our countries and made clear the desire of this country, and he accepted the statement of the Japanese Ambassador that it was the desire of Japan equally, to avoid war between our two countries and to bring about a settlement on a fair and peaceful basis so far as the Pacific area was concerned.\n\nAmbassador Kurusu proceeded with one line of remarks that he kept up during the conversation and that was that we must find ways to work out an agreement to avoid trouble between our two countries. He said that all the way across the Pacific it was like a powder keg, and again he repeated that some way must be found to adjust the situation.\n\nAmbassador Kurusu made some specious attempt to explain away the Tripartite Pact. I replied in language similar to that which I used in discussing this matter with Ambassador Nomura on November fifteenth, which need not be repeated here. I made it clear that any kind of a peaceful settlement for the Pacific area, with Japan still clinging to her Tripartite Pact with Germany, would cause the President [741면] and myself to be denounced in immeasurable terms and the peace arrangement would not for a moment be taken seriously while all of the countries interested in the Pacific would redouble their efforts to arm against Japanese aggression. I emphasized the point about the Tripartite Pact and self-defense by saying that when Hitler starts on a march of invasion across the earth with ten million soldiers and thirty thousand airplanes with an official announcement that he is out for unlimited invasion objectives, this country from that time was in danger and that danger has grown each week until this minute. The result was that this country with no other motive except self-defense has recognized that danger, and has proceeded thus far to defend itself before it is too late; and that the Government of Japan says that it does not know whether this country is thus acting in self-defense or not. This country feels so profoundly the danger that it has committed itself to ten, twenty-five or fifty billions of dollars in self-defense; but when Japan is asked about whether this is self-defense, she indicates that she has no opinion on the subject—I said that I cannot get this view over to the American people; that they believe Japan must know that we are acting in self-defense and, therefore, they do not understand her present attitude. I said that he was speaking of their political difficulties and that I was thus illustrating some of our difficulties in connection with this country’s relations with Japan.\n\nThe President remarked that some time ago he proclaimed a zone around this hemisphere, 300 miles out in the sea in some places and 1,100 miles in others. The President added that this was self-defense.\n\nI then said that Ambassador Nomura and I have been proceeding on the view that the people of the United States and Japan alike are a proud and great people and there is no occasion for either to attempt to bluff the other and we would not consider that bluffing enters into our conversations, which are of genuine friendliness.\n\nThe President brought out a number of illustrations of our situation and the Japanese situation as it relates to Germany and our self-defense which serve to emphasize our position and to expose the sophistry of the Japanese position.\n\nAmbassador Kurusu said that Germany had not up to this time requested Japan to fight; that she was serving a desirable purpose without doing so,—this must have meant that she was keeping the American and British Navies, aircraft, et cetera, diverted.\n\nThe further question of whether the United States is on the defensive in the present Pacific situation came up by some general discussion in reference to that situation by Ambassador Kurusu, and the President and I made it clear that we were not the aggressors in the Pacific but that Japan was the aggressor.\n\n[742면]\n\nAt another point I said that the belief in this country is that the Japanese formula of a new order in greater East Asia is but another name for a program to dominate entirely, politically, economically, socially and otherwise by military force all of the Pacific area; that this would include the high seas, the islands and the continents and would place every other country at the mercy of very arbitrary military rule just as the Hitler program does in Europe and the Japanese in China. The Ambassador made no particular comment.\n\nThere was some effort by Ambassador Kurusu to defend their plan of not bringing the troops out of China. Placing the Japanese on the defensive, the President said that the question ought to be worked out in a fair way considering all of the circumstances and relative merits of the matters involved; and that at a suitable stage, while we know that Japan does not wish us to mediate in any way, this Government might, so to speak, introduce Japan and China to each other and tell them to proceed with the remaining or detailed adjustments, the Pacific questions having already been determined.\n\nAmbassador Kurusu strongly stated that it would be most difficult to bring all the troops out of China at once.\n\nAmbassador Kurusu said that we, of course, desired to bring up both sides of matters existing between our two countries and he said that we would recall that when the Japanese went into Shantung during the World War, this Government insisted that she get out. I replied that my own country opposed a policy of this seizure of new territory by any country to the fullest extent of its ability to do so; that it declined to take a dollar of compensation or a foot of territory for itself; that it insisted that the world must turn over a new leaf in this respect or nations would be fighting always for territory and under modern methods of war would soon destroy and utterly impoverish each other; that in any event his country fared well in this respect.\n\nThe question of our recent proposal on commercial policy was brought up by us and Ambassador Kurusu said he had not examined it and that he had forgotten much of the technical side of commercial policy since he was in the Foreign Office. The President made very pertinent and timely reference to the destructive nature of armaments and the still more destructive effects of a permanent policy of armaments which always means war, devastation and destruction. He emphasized the point that there is from the long-term point of view no difference of interest between our two countries and no occasion, therefore, for serious differences.\n\nAll in all, there was nothing new brought out by the Japanese Ambassador and Ambassador Kurusu. Ambassador Kurusu constantly made the plea that there was no reason why there should [743면] be serious differences between the two countries and that ways must be found to solve the present situation. He referred to Prime Minister Tojo as being very desirous of bringing about a peaceful adjustment notwithstanding he is an Army man. The President expressed his interest and satisfaction to hear this. The President frequently parried the remarks of Ambassador Nomura and also of Ambassador Kurusu, especially in regard to the three main points of difference between our two countries. There was no effort to solve these questions at the conference. The meeting broke up with the understanding that I would meet the Japanese representatives tomorrow morning.\n\nC[ordell] H[ull]", "notes": [], "warn": false, "pages": ["0807", "0808", "0809"], "search": "헐(Cordell Hull) — 국무장관, 이 각서의 작성자 노무라(野村吉三郎, Nomura) — 주미 일본대사 구루스(来栖三郎, Saburo Kurusu) — 특사, 원문 표기는 「Ambassador Kurusu」 루스벨트(Franklin D. Roosevelt) — 대통령(원문에는 「대통령」으로만 나온다) 히틀러(Adolf Hitler) — 독일 총통 도조(東條英機, Tojo) — 일본 총리"}, {"id": "d399", "order": 399, "date": "1941-11-17", "group": "D", "eyebrow": "d399 · The Ambassador in Japan (Grew) to the Secretary of State", "title": "주일대사 그루가 국무장관에게", "badge": null, "list_right": "문서 399", "meta": [{"k": "일자", "v": "1941-11-17"}, {"k": "시각", "v": "도쿄, 1941년 11월 17일 오후 8시 발신 / [11월 17일 오후 2시 9분 접수]"}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": "1814"}, {"k": "원문출처", "v": "711.94/2447: Telegram (전보)", "txt": true}, {"k": "발신", "v": "The Ambassador in Japan (Grew) 주일대사 그루(Joseph Grew)", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 399 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d399"}], "summary": "그루 대사가 일본의 기습에 대비하라고 경고하면서, 사전 경보의 주된 책임을 대사관에 지우지 말 것을 본국에 권한다. 대사관의 관찰 범위가 사실상 육안으로 보이는 데까지에 그치기 때문이다.", "points": ["머리에 [Substance] 표시가 있다. FRUS가 전문(全文)이 아니라 요지를 3인칭으로 옮겨 실은 것이다.", "대사는 11월 3일 오후 3시자 전보 제1736호의 마지막 문장을 상기시키며, 지금 중국 전역(戰域)에 포함되지 않은 지역에서 일본이 갑자기 해군 또는 육군 행동을 일으키는 데 대비할 필요를 강조한다.", "대사는 일본이 기습과 선제 같은 모든 전술적 이점을 이용할 개연성을 셈에 넣고 있다.", "대사는 사전 경보를 주는 주된 책임을 해군·육군 무관을 포함한 대사관 직원에게 두지 말 것이 중요하다고 본국에 권고한다. 일본에서는 1차·2차 군사 정보 모두에 대한 통제가 극히 효과적이기 때문이다.", "대사관은 일본인 개인 접촉으로도 신문으로도 사전에 어떤 정보를 얻으리라 기대하지 않는다. 남아 있는 소수의 미국인은 대체로 도쿄·요코하마·고베 세 도시에 몰려 있어 군사 이동의 관찰이 불가능하다.", "인접 해역에 미국 및 다른 외국 선박이 없으므로 일본은 외국의 관찰 없이 병력 수송선을 여러 방향으로 보낼 수 있음이 보장되어 있다.", "최근 만주와 타이완의 미국 영사들이 일본군의 집결을 보고했고, 지난 7월 총동원 이래의 병력 배치는 태평양 남서부 또는 시베리아 또는 그 양쪽에서 가능한 한 짧은 예고로 새 작전을 수행할 수 있게 하려는 것으로 보인다.", "대사는 대사관의 해군·육군 관찰 범위가 「거의 문자 그대로 육안으로 볼 수 있는 것에 국한되며 그나마 보잘것없다」고 적고, 따라서 대사관이 실질적인 경보를 줄 수 있으리라는 가망을 지나칠 만큼 조심스럽게 최대한 낮게 잡으라고 미국 정부에 권고한다."], "primary": "[요지]\n\n도쿄, 1941년 11월 17일 오후 8시.\n\n[1941년 11월 17일 오후 2시 9분 접수.]\n\n1814. 대사는 자기의 앞선 전보 제1736호(11월 3일 오후 3시자)의 마지막 문장을 언급하면서, 지금 중국 전역(戰域)에 포함되어 있지 않은 지역들에서 일본이 갑작스러운 해군 또는 육군 행동을 일으키는 데 대비할 필요가 있음을 강조한다. 그러므로 그는 일본이 기습과 선제(先制) 같은 가능한 모든 전술적 이점을 이용할 개연성을 셈에 넣고 있다. 그는 이에 따라 자국 정부에 대하여, 해군 및 육군 무관을 포함한 대사관 직원에게 사전 경고를 주는 주된 책임을 지우지 않는 것이 중요하다고 권고한다. 일본에서는 1차 군사 정보와 2차 군사 정보 양쪽 모두에 대한 통제가 극히 효과적이기 때문이다. 대사관은 일본인과의 개인적 접촉을 통해서도, 신문을 통해서도 사전에 어떠한 정보를 얻으리라고 기대하지 않을 것이다. 군사적 이동의 관찰은 이 나라에 남아 있는 소수의 미국인으로는 불가능하며, 그들은 대체로 세 도시(도쿄, 요코하마, 고베)에 몰려 있다. 또한 인접 해역에 미국 선박과 그 밖의 외국 선박이 없으므로, 일본은 외국의 관찰 없이 병력 수송선을 여러 방향으로 보낼 수 있는 능력을 보장받고 있다. 최근 만주와 타이완의 미국 영사들이 일본군의 집결을 보고하였으며, 한편 지난 7월의 총동원 이래의 병력 배치는, 입수 가능한 그 밖의 모든 징후로 미루어, 태평양 남서부에서든 시베리아에서든 또는 그 양쪽에서든 가능한 한 짧은 예고로 새 작전을 수행할 수 있게 하려는 견지에서 이루어져 왔다.\n\n[744면]\n\n대사는, 지금 아마도 가장 중요한 임무는 위에 말한 지역들에서 일어남 직한 해군 또는 육군 작전의 어떠한 전조도 탐지해 내는 일임을 대사관이 충분히 깨닫고 있음을 밝히며, 기습에 대비하여 온갖 예방 조치를 취하고 있다고 진술한다. 그는 대사관의 해군·육군 관찰의 범위가 거의 문자 그대로 육안으로 볼 수 있는 것에 국한되어 있으며 이는 보잘것없는 정도라고 덧붙인다. 그러므로 미합중국 정부는, 지나칠 만큼 조심하는 뜻에서, 대사관이 실질적인 경고를 줄 수 있으리라는 가망을 될 수 있는 대로 낮게 잡으라는 권고를 받는다.\n\n그루", "secondary": "[Substance]\n\nTokyo, November 17, 1941—8 p.m.\n[Received November 17—2:09 p.m.]\n\n1814. The Ambassador, referring to his previous telegram No. 1736 of November 3, 3 p.m., final sentence, emphasizes the need to guard against sudden Japanese naval or military actions in such areas as are not now involved in the Chinese theater of operations. He is taking into account, therefore, the probability of the Japanese exploiting every possible tactical advantage, such as surprise and initiative. He advises his Government accordingly of the importance of not placing the major responsibility in giving prior warning upon the Embassy staff, the naval and military attaches included, since in Japan there is extremely effective control over both primary and secondary military information. The Embassy would not expect to obtain any information in advance either from personal Japanese contacts or through the press; the observation of military movements is not possible by the few Americans remaining in the country, concentrated mostly in three cities (Tokyo, Yokohama, Kobe); and with American and other foreign shipping absent from adjacent waters the Japanese are assured of the ability to send without foreign observation their troop transports in various directions. Japanese troop concentrations were reported recently by American consuls in Manchuria and Formosa, while troop dispositions since last July’s general mobilization have, according to all other indications available, been made with a view to enabling the carrying out of new operations on the shortest possible notice either in the Pacific southwest or in Siberia or in both.\n\n[744면]\n\nThe Ambassador expresses the Embassy’s full realization that the present most important duty perhaps is to detect any premonitory signs of naval or military operations likely in areas mentioned above and states that every precaution is being taken to guard against surprise. He adds that the Embassy’s field of naval or military observation is restricted almost literally to what could be seen with the naked eye, and this is negligible. Therefore, the United States Government is advised, from an abundance of caution, to discount as much as possible the likelihood of the Embassy’s ability to give substantial warning.\n\nGrew", "notes": [], "warn": false, "pages": ["0810"], "search": "Grew 그루(Joseph Grew, 주일대사)"}, {"id": "d400", "order": 400, "date": "1941-11-18", "group": "A", "eyebrow": "d400 · Memorandum of a Conversation", "title": "회담 비망록", "badge": null, "list_right": "문서 400", "meta": [{"k": "일자", "v": "1941-11-18"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/254013/35", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 400 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d400"}], "summary": "노무라와 구루스가 국무부에서 헐과 만나 삼국동맹·통상정책·중국 주둔 세 문제를 길게 논하고, 끝에 노무라가 7월 남부 인도차이나 진주 이전 상태로 돌아가자는 안을 내비친다.", "points": ["헐은 일본이 한편으로 미국과 협정을 맺고 다른 한편으로 추축국과 동맹을 유지하는 상황을 대중이 어떻게 해석하겠느냐고 지적했다.", "헐은 독일이 방공협정을 맺은 뒤 소련과 불가침조약을 맺어 일본을 놀라게 했고 끝내 소련을 공격해 그 조약을 뒤집었다는 예를 들며, 히틀러가 성공하면 결국 극동으로 돌아와 일본을 배신하리라고 말했다.", "헐은 미국이 1946년 필리핀에서 물러나고 지금 중국에서 해병대를 빼내고 있음을 들며, 교섭에서 내놓을 것은 우리의 우정뿐이라고 했다.", "헐은 미국이 영제국 특혜(Empire preferences)를 줄이도록 영국을 설득하는 노력을 지금도 하고 있다고 말했다.", "구루스는 영제국 특혜 문제가 일본이 추축 진영으로 들어가게 만든 요인의 하나였다고 말했다.", "구루스가 말한다. 일본이 삼국동맹을 폐기하겠다고는 말할 수 없으나, 삼국동맹을 「무색하게(outshine)」 할 무언가는 할 수 있을지 모른다는 것이다.", "헐은 삼국동맹이 양해의 성립과 양립하지 않는다고 보며, 그 처리는 일본이 스스로 풀어야 할 문제라고 못박았다.", "노무라는 큰 배는 빨리 돌 수 없고 천천히 점차 돌려야 한다는 비유로 시간을 청했다.", "구루스는 자산 동결 조치가 일본에 초조감과 「아직 싸울 수 있을 때 싸워야 한다」는 감정을 낳았다고 말했다.", "노무라는 일본이 독일의 앞잡이(cat's-paw)가 되지 않을 것이며, 고립감 때문에 삼국동맹에 들어갔고 그것을 일본 자신의 목적에 쓰려 했다고 강조했다.", "중국 문제에 관하여 무병합·무배상, 중국의 주권과 영토 보전 존중, 균등 원칙을 지지하느냐고 묻자 노무라는 그렇다고 답했다.", "헐은 실질적인 교섭의 기초가 먼저 서지 않고서는 영국·중국 등 관계 정부에 가져갈 수 없다고 했고, 구루스는 그러면 미일 관계가 영국과 중국의 처분에 맡겨지는 셈이라고 응수했다.", "중국 주둔 병력을 두고 헐이 몇 명을 남기려느냐 묻자 노무라는 아마 90퍼센트는 철수할 것이라 답했고, 남는 10퍼센트를 언제까지 두려느냐는 물음에는 직답하지 않고 의화단 의정서를 들었다.", "구루스는 정당한 태평양 해결이 이루어지는 대로 프랑스령 인도차이나에서 철병할 뜻이라고 말하고, 버마 로드 사정을 일본 정부가 매우 중대하게 본다고 했다.", "헐은 동결 완화가 어느 정도까지 일본의 평화적 정책 채택을 가능하게 하겠느냐고 물으며, 일본 내 평화적 지도자들이 주도권을 잡게 하려는 뜻이라고 설명했다.", "노무라가 7월 남부 프랑스령 인도차이나 진주에 뒤이어 동결 조치가 시행되기 전의 상태로 돌아가는 방안을 내비쳤고, 헐은 영국·네덜란드와 상의해 그들의 태도를 알아보겠다고 답했다.", "헐은 인도차이나에서 뺀 병력이 다른 곳에서 똑같이 문제되는 이동에 돌려질지 알 수 없다고 지적했다."], "primary": "[워싱턴,] 1941년 11월 18일.\n\n일본 대사와 구루스 씨가 자기들 요청으로 잡은 약속에 따라 국무부로 국무장관을 방문했다.\n\n몇 마디 서두의 말을 나눈 뒤 국무장관은 일본과 추축국의 관계 문제를 꺼냈다. 그는 한편으로 일본이 우리와 협정을 맺고 다른 한편으로 추축국들과 동맹 관계에 있는 상황이 무엇을 뜻하는지에 대하여 대중은 나름의 해석을 내리게 되리라고 지적하였다. 그는 우리 국민이 히틀러를 믿지 않으며, 나아가 히틀러가 성공한다면 결국에는 극동으로 돌아와 일본을 배신하게 되는 것이 불가피하리라고 우리는 느낀다고 말했다. 국무장관은 독일이 일본과 방공협정(anti-Comintern pact)을 맺은 뒤 나중에 소련과 불가침조약을 맺어 일본을 놀라게 하였고, 끝내는 소련을 공격함으로써 그 불가침조약을 스스로 뒤집은 사례를 들었다. 국무장관은 일본도 우리와 마찬가지로 독일의 의도를 미리 알지 못했으리라 짐작한다고 말했다.\n\n국무장관은 일본이 히틀러와 동맹 관계를 유지하고 있는 동안에 우리가 일본과 맺는 어떠한 협정도 우리 국민의 신뢰를 얻으리라고는 매우 의심스럽다는 뜻을 밝히고, 우리의 평화적 목적을 자명하게 드러내는 명확한 협정이 아니면 안 되며 그렇지 못하면 모든 나라가 군비를 강화하려는 노력을 배가하게 되리라고 강조하였다. 그는 우리가 1946년에 필리핀에서 물러나며 지금 중국에서 해병대를 빼내고 있고, 이런 방식으로 법과 질서에 바탕을 둔 평화로운 세계의 수립에 이바지하려 하고 있음을 지적하였다. 그는 이것이 바로 우리가 일본과 함께 이루어 내고자 하는 바이며, 우리는 우리의 우정 말고는 흥정거리로 내놓을 것이 없다고 말했다. 우리의 통상 계획은 [745면] 재화의 최대 생산과 최대 유통을 지향하는 것이라고 그는 말했다. 국무장관은 또한 우리가 지금도 영제국이 제국 특혜(Empire preferences)를 줄이도록 설득하는 노력을 기울이고 있음을 지적하였다. 그는 우리가 바라는 것은 군대가 여러 나라를 짓밟도록 내버려 두어서는 결코 이룰 수 없는 방식으로 우리 국민을 다시 일자리로 돌려보내는 것이라고 말했다. 국무장관은 많은 일본 대변자들이 일본이 동아시아에서 지배적 영향력을 갖기를 바란다고 말해 왔으나, 무언가 값어치가 있는 유일한 종류의 지배적 영향력은 칼로는 얻을 수도 유지할 수도 없는 그런 것이라고 말했다. 그는 우리가 남아메리카에서 평화적 정책을 통하여, 또 포함과 무력의 사용을 스스로 포기함으로써 이룩한 바를 짧게 짚었다. 국무장관은 현재의 비상한 여건 아래에서 우리의 통상정책을 완벽하게 실행할 수 없고 전시 상황에 맞추어 그것을 수정해야 한다는 것을 우리도 인정한다는 점을 분명히 하면서, 그래도 적어도 원칙만은 세울 수 있다고 하였다. 국무장관은 일본과 추축국의 관계 문제로 되돌아가, 그로 말미암아 우리 국민에 관한 한 어려운 상황이 생겨난다고 말했다 — 예컨대 히틀러가 어떤 잔학 행위를 저질렀을 때 일본 지도자들이 그에게 축전을 보내는 경우가 그러하다는 것이었다.\n\n일본 대사는 미국과 소련이 나란한 행로를 걷고 있지 않은데도 현재 우리가 소련과 한편에 서 있다고 지적하였다. 그는 또한 우리가 남아메리카와 발전시켜 온 관계를 매우 높이 평가하나, 일본도 우리를 본받고 싶기는 하지만 그처럼 아량을 베풀 수 있는 처지가 아니라고 말했다 — 예컨대 다른 나라들에 상당한 무기대여(lend-lease) 원조를 제공하는 일 같은 것이 그러하다는 것이었다.… 이어 국무장관은, 솔직히 말해 일본과 만족스러운 협정에 이르는 일에서 무언가 될 수 있을지 자신은 알지 못하며, 우리도 어느 정도까지는 갈 수 있으나 어떤 선을 넘느니 차라리 그 자리에 서서 그 결과를 감수하는 편이 나으리라고 덧붙였다. 그러자 대사는 일본이 지금 몹시 쪼들리고 있으며, 일본이 미국과 어떤 협정에 이르기를 얼마나 바라고 있는지는 국무장관도 잘 알고 있다고 말했다.\n\n구루스 씨는 자신이 일본 외무성 통상국장으로 5년을 근무하여 일본 통상정책의 전개를 잘 알고 있다고 말했다. 그는 제국 특혜에 관한 상황이 일본을 추축 진영으로 들어가게 만든 요인 가운데 하나였다고 말했다. 그는 미국이 경제적으로 강력한 나라이므로 통상 흥정에 나서기에 일본보다 훨씬 유리한 처지에 있다고 말했다. 게다가 일본은 미국보다 대외 무역에 [746면] 훨씬 더 의존하고 있다고 하였다. 그는 지금 두 정부가 해야 할 일은 현재의 비정상적인 상황을 넘길 무언가를 이루어 내는 것이라고 보았다. 그는 예컨대 일본 점령하 중국에서 만들어진 환관리(exchange control) 상황을 들면서, 그러한 상황은 단시일 안에 없앨 수 없다는 견해를 밝혔다. 그는 전쟁이 끝난 뒤에는 아마도 더 자유주의적인 정책을 채택할 수 있을지 모르나 자기 정부를 대신하여 아무것도 약속할 수는 없다고 말했다. 국무장관은 일본이 지금 통상정책에 관하여 원칙적으로 합의할 수는 없겠는지 물었다. 구루스 씨는 직접 대답하지 않은 채, 미국이 극동과 교류하던 초기에는 우리의 주된 관심이 통상이었지 종교나 문화 활동이 아니었으며, 우리가 이상주의의 행로를 걸어왔으나 미국이 필리핀을 점령하면서 상황이 다소 달라져 미국이 유럽 열강의 협조 체제에 스스로를 얽어매게 되었다고 말했다.\n\n삼국동맹 문제로 돌아서서, 구루스 씨는 일본이 삼국동맹을 폐기하겠다고는 말할 수 없으나 삼국동맹을 「무색하게(outshine)」 만들 무언가를 할 수는 있을지 모른다고 말했다.\n\n국무장관은, 평화를 지향하는 나라들이 지금 재건 계획을 시작하지 않는다면 나중에는 그런 계획을 시작하는 것이 불가능해지리라고 지적하였다. 이기적인 세력이 정세를 장악하여 자유주의적 정책이 실현되는 것을 막을 것이기 때문이라는 것이었다. 따라서 그는, 지금 사기가 꺾여 있는 평화적 세력이 지도력을 발휘할 수 있도록 우리가 첫걸음을 뗄 수 있으려면 근본 원칙을 세워 두는 일이 필요하다고 말했다. 그러한 행로를 걷지 않는다면, 재건 계획을 실행에 옮길 때가 왔을 때 우리는 평화를 지향하는 사람들의 신뢰를 얻을 수 없으리라고 국무장관은 짚었다. 구루스 씨는 일본과 추축 동맹의 관계를 다룰 구체적인 방식안(formula)을 국무장관이 가지고 있는지 물었다. 국무장관은 이것이 일본이 스스로 풀어야 할 문제임을 분명히 하였다. 그는 우리가 평화적 계획을 확고히 세울 수 있다면 히틀러에게 우리를 너무 곤란하게 만들지 말아 달라고 요구해야 마땅하다고 말했다. 그는 일본이 어떤 식으로든 미국 국민이 납득할 만하게 그것을 풀어낼 수는 없겠는지 물었다. 그는 일이 잘못된 방향으로 간다면 평화를 지향하는 모든 나라가 방위 노력을 배가하게 되리라고 말했다. 국무장관은, 일본이 미국과 협정을 맺고 있으면서 일본과 추축국 사이의 관계가 그대로 남아 있다면 대중이 혼란스러워하리라는 점을 다시 강조하였다.\n\n대사는 지금 사태를 구하기 위하여 어떤 양해를 이루는 것이 중요하지 않겠느냐고 물었다. 국무장관은 그 말에 동의하나, 삼국동맹은 양해의 성립과 양립하지 않는다고 본다고 말했다.\n\n[747면]\n\n구루스 씨는 그러면 국무장관은 무엇을 제안할 수 있겠는지 물었다. 국무장관은, 우리가 삼국동맹을 미국과의 협정과 뒤섞는다면 많은 사람이 우리를 따르게 만들 수는 없으리라고 말했다. 국무장관은, 일본의 정치가들이 중국에 대하여 전적으로 평화적인 행로를 걷기를 바라는 것인지 아니면 두 얼굴로 양쪽을 향하기를 바라는 것인지 하는 물음이 생긴다고 말했다. 이어 국무장관은, 일본이 통상정책에 관하여, 평화적 원칙에 부합하는 대중국 행로에 관하여, 그리고 유럽 전쟁에 대한 일본의 관계에 관하여 명확한 입장을 취하는 데서 물러선다면, 이는 제안된 협정과 관련하여 우리를 변호할 수 없는 처지에 놓이게 하리라고 말했다. 우리로서는 일본 정부가 자국의 정치인들을 한 줄로 세우지 못하고 있다고 말할 수밖에 없게 된다는 것이었다.\n\n대사는 일본의 정세가 매우 절박하며 두 나라 관계가 더 나빠지는 것을 막는 일이 중요하다고 거듭 말했다. 그는 이 상황을 지금 멈춰 세울 수만 있다면 미국 정부가 주장하는 행로 쪽으로 나아가는 것이 가능해질 분위기가 생겨나리라고 시사하였다. 그는 큰 배는 그리 빨리 돌 수 없으며 천천히 그리고 점차로 돌려야 한다고 지적하였다.\n\n국무장관은, 우리가 마주 앉아 힘의 교리가 배어 있는 협정을 쓴다면, 결국 각 나라가 서로를 전혀 믿지 못하고 군비를 쌓아 올리게 되리라고 대답하였다. 어떤 식으로든 히틀러와 얽혀 있는 한 나라들은 평화를 증진할 수 없기 때문이라는 것이었다.\n\n구루스 씨는 포괄적인 해결은 당장 이루어 낼 수 없으며 자신은 아무 약속도 할 수 없다고 지적하였다. 그는 우리의 동결 규정이 일본에 초조감을, 그리고 아직 싸울 수 있을 때 싸워야 한다는 감정을 불러일으켰다고 말했다. 그는 우리가 지금 어떤 타결에 이를 수 있다면 그것이 근본 문제를 논의하기에 알맞은 분위기를 길러 주리라고 말했다. 국무장관은 삼국동맹에 관하여 무언가 이루어 낼 수 있다고 보지 않는지 물었다. 대사는, 일본이 독일의 앞잡이(cat's-paw)가 되지는 않으리라는 점, 일본이 삼국동맹에 들어간 목적은 그것을 일본 자신의 목적을 위하여 쓰려는 데 있었다는 점, 일본이 스스로 고립되어 있다고 느꼈기 때문에 삼국동맹에 들어갔다는 점을 강조하고 싶다고 말했다. 국무장관은 이 나라의 여론이 구루스 씨가 말한 대로 상황을 이해하게 만들기는 어려우리라고 짚었다.\n\n이어 그는 중국 정세에 관하여 대사가 어떤 생각을 가지고 있는지, 그리고 일본이 무병합·무배상, 중국의 주권과 영토 보전의 존중, 그리고 균등의 원칙을 지지하는 것인지 물었다. 대사는 그렇다고 대답하였다.\n\n[748면]\n\n이어 국무장관은, 이 점을 이미 대사에게 분명히 밝힌 바 있으나 구루스 씨에게도 분명히 해 두고 싶다고 하면서, 일본 정부는 우리 회담을 탐색적 회담이 아니라 교섭으로 여기고자 하지만, 자신은 교섭의 진정한 기초에 먼저 이르지 않고서는 영국이나 중국, 그 밖에 관계된 정부들에 갈 처지가 아니라고 느낀다고 말했다. 그 정부들도 이 문제들에 정당한 이해관계를 가지고 있기 때문이라는 것이었다. 구루스 씨는 각 정부가 어느 문제에 이해관계를 가지고 있는지 국무장관이 구체적으로 밝히도록 유도하려 하였으나, 국무장관은 명백한 이유로 아직 그 다른 정부들과 이 문제들을 논의한 바 없으므로 자기가 무슨 말을 하든 그것은 자기 쪽의 추측에 지나지 않을 것이라고 말했다. 그러자 구루스 씨는 그러한 사정이라면 미일 관계가 영국과 중국의 처분에 맡겨지는 셈이라고 말했다. 국무장관은, 그 정부들에 가져갈 협정의 기초로서 실질적인 무언가를 우리가 가지고 있어야 한다고 믿으며 이 말을 거듭할 수밖에 없다고 대답하였다. 그렇지 않다면 그들과 이야기할 까닭이 없다는 것이었다. 구루스 씨는 사태가 너무나 절박하여 우리의 통제를 벗어날 수도 있다고 말했다. 국무장관은 그것이 사실이라는 데 동의하면서도, 일본의 지도자들이 힘에 바탕을 둔 계획을 계속 공표하고 있다는 사실이 우리의 어려움을 키운다고 지적하였다. 그는 히틀러와 관련된 문제는 일본 정부가 숙고하도록 맡겨 두고 싶다고 말했다.\n\n중국 정세로 화제를 돌려 국무장관은 일본이 중국에 얼마나 많은 병력을 남겨 두고자 하는지 물었다. 대사는 아마 90퍼센트는 철수하게 되리라고 대답하였다. 국무장관은 남는 그 10퍼센트를 일본이 얼마 동안 중국에 두려는 것인지 물었다. 대사는 이에 직접 대답하지 않고, 현행 의화단 의정서에 따라 일본이 베이핑·톈진 지역에 군대를 남길 수 있게 되어 있다는 사실에 주의를 돌렸다. 국무장관은 중국에 있는 일본군 문제에는 말썽의 요소가 많다고 지적하였다. 미국의 이익조차 일본군의 행위로 심각한 피해를 입었으며 우리에게는 그러한 사례의 긴 목록이 있다는 것이었다. 국무장관은 이러한 상황 앞에서 미국 정부가 발휘해 온 크나큰 인내를 언급하였다. 그는 이 상황은 극단주의자들이 말썽을 찾아다니는 것처럼 보이는 상황이며, 일본 정부가 각별한 노력을 기울여 사태의 멱살을 잡아야 한다고 말했다. 그는 또한 미국과 일본이 과거에는 서로를 신뢰해 왔으며, 현재의 상황은 일본이 스스로 만들어 낸 것이므로 스스로 빠뜨린 그 곤경에서 벗어날 길을 찾는 것은 일본 정부에 달린 일이라고 말했다. 이어 국무장관은, 일본 국민이 전쟁과 침략을 머리에서 지워 버리기만 한다면 지금이야말로 일본이 자국의 공장을 돌려 평화로운 나라들이 [749면] 필요로 하는 물자를 생산하기에 유난히 유리한 상황이라고 말했다.\n\n대사는 우리 회담이 오래 끌어 왔으며, 미국 정부가 이 상황에 관하여 일본에 무언가 희망을 줄 수만 있다면 도움이 되리라고 말했다. 그는 우리나라는 크고 강하다고 덧붙였다. 국무장관은 우리 정부는 어떠한 위협도 한 바 없으며, 자신은 이 나라 안에서 호전적인 언사를 억누르도록 처음부터 자신의 영향력을 행사해 왔다고 대답하였다. 그는 중국에 있는 일본 군대는 자기들이 누구의 영토에 있는지를 깨닫지 못하는 듯하며, 이 나라 사람들은 히틀러가 세계의 절반을 맡으려 하고 일본이 나머지 절반을 맡으려 한다고, 그리고 그들이 성공한다면 미국에는 무엇이 남겠느냐고 말한다고 덧붙였다. 구루스 씨는 일본이 중국에서 점차로 움직일 수밖에 없으며 한 걸음이 다음 걸음으로 이어질 수 있다고 하면서, 지금 중요한 것은 일본이 그 행로를 바꿀 수 있게 할 무언가를 하는 것이라고 시사하였다. 국무장관은 구루스 씨가 무엇을 염두에 두고 있는지 물었다. 지연의 책임이 우리에게 있다고 일본 쪽에서 여기고 있다는 시사에 대하여, 국무장관은 오히려 우리가 일본의 지연을 탓하는 편이 더 온당하다고 지적하면서, 자신은 일본 대사가 면담을 청할 때마다 즉시 만나 충분히 논의해 왔다고 말했다. 국무장관은 7월 일본의 인도차이나 진출이 있었을 때 그것이 우리 회담의 중단을 불러왔으며, 바로 그때 자신은 일본에 대한 석유 제품의 계속적인 선적을 더는 변호할 수 없게 되었다고 덧붙였다. 지난 한 해 동안 그 선적을 끊지 않았다는 이유로 이 나라 안에서 혹독한 비판을 받아 온 터라 더욱 그러하였다는 것이었다.\n\n구루스 씨는 우리가 종전 상태(status quo ante)의 회복을 바라는 것인지, 아니면 일본이 무엇을 하기를 기대하는 것인지 물었다. 국무장관은, 일본이 그 세 가지 점 — 중국에서 군대를 빼는 것, 통상정책, 그리고 삼국 협정 — 에 관하여 지금 아무것도 할 수 없다면, 자신으로서는 일본이 무엇을 할 수 있는지는 일본에 맡길 수밖에 없다고 대답하였다. 국무장관은, 일본이 평화적 계획을 위한 세계적 지도력을 함께 제공하는 것을 보는 것이 우리의 바람이며, 일본의 긴 안목에서의 이익은 우리의 이익과 같다고 본다고 말했다. 대사는 우리 정부가 일본 정부를 의심하고 있음을 자신도 알고 있으나, 일본이 당분간 중국에 얼마간의 병력을 두기를 바라는 것과는 별개로 중국 사건을 해결하고자 한다는 것을 우리에게 확언하고 싶다고 말했다. 그러자 국무장관은 일본이 무엇을 염두에 두고 있는지 다시 물었다. 구루스 씨는, 정당한 태평양 해결이 이루어지는 대로 프랑스령 인도차이나에서 일본군을 철수시키는 것이 일본의 의도라고 말하고, 일본 정부가 버마 로드 상황을 매우 중대하게 여기고 있음을 지적하였다.\n\n국무장관은 동결이 완화된다면 그것이 어느 정도까지 일본으로 하여금 평화적 [750면] 정책을 채택할 수 있게 하겠는지 물었다. 그는 자신이 염두에 둔 것은 일본 안의 평화적 지도자들이 일본의 정세를 장악하고 그들의 영향력을 발휘할 수 있게 하는 것이라고 설명하였다. 대사는 우리의 입장이 완강하며, 장제스에 대한 일본의 완강한 태도야말로 일본에 맞선 중국의 저항을 굳어지게 만들었다고 말했다. 그는 해결의 희망이 조금이라도 있는지 — 우리의 높은 이상을 실현하는 쪽으로 나아가는 어떤 작은 시작이라도 있는지 물었다. 국무장관은, 대중이 신뢰하는 협정을 우리가 이루어 내지 못한다면 여러 나라의 군비 확장은 계속될 것이며, 일본 정부는 우리가 다루려 하는 그 조건들을 스스로 만들어 냈으므로 이 문제에 책임이 있다고 대답하였다. 그러자 대사는, 일본이 남부 프랑스령 인도차이나로 진출한 데 뒤이어 우리의 동결 조치가 시행되었던 7월의 그 날짜 이전에 있던 상태로 돌아가는 것도 가능하지 않겠느냐고 시사하였다. 국무장관은, 대사가 말한 것과 같은 일본의 조치를 근거로 우리가 금수 조치에 얼마간의 수정을 가한다 하더라도, 프랑스령 인도차이나에서 철수한 그 병력이 다른 곳에서 똑같이 문제가 될 만한 이동에 돌려지지 않으리라고는 알 수 없다고 말했다. 대사는 자신이 염두에 둔 것은 단지 우리 관계의 위험한 흐름을 멈추게 할 어떤 조치일 뿐이라고 말했다. 국무장관은, 일본이 평화적 행로에 확실히 나섰고 정복의 목적을 포기하였다고 미국 정부가 믿지 않는 한, 금수 해제에서 크게 나아가도록 정부를 움직이기는 자신으로서 어려우리라고 말했다. 대사는 일본인들이 중국과 싸우는 데 지쳐 있으며, 일본은 첫 단계에서 갈 수 있는 데까지 가겠다고 말했다. 국무장관은 일본 대사가 내놓은 시사에 대하여 영국과 네덜란드가 어떤 태도를 취할지 알아보기 위하여 그들과 상의하겠다고 말했다. 국무장관의 질문에 대하여 대사는, 일본 정부가 11월 15일 우리 제안에 담긴 통상정책 문제들을 아직 검토하고 있다고 대답하였다. 그는 우리가 염두에 둔 것이 전쟁이 끝난 뒤의 상황을 다룰 계획이리라고 짐작한다고 말했다. 국무장관은 건전한 계획의 완전한 시행에 관한 한 그렇다고 대답하면서, 다만 원칙에 관해서는 지금 합의가 이루어져야 한다고 덧붙였다.\n\n대사가 언제 다시 우리와 회담하고 싶은지 국무장관이 묻자, 대사는 본국 정부와 연락한 뒤 밸런타인 씨를 통하여 국무장관에게 알리겠다고 말했다.\n\n[Joseph W.] Ballantine\n\n[751면]", "secondary": "[Washington,] November 18, 1941.\n\nThe Japanese Ambassador and Mr. Kurusu called on the Secretary, by appointment made at their request, at the Department.\n\nAfter some preliminary remarks the Secretary took up the question of Japan’s relations with the Axis. He pointed out that the public would place their own interpretation upon the implications of a situation wherein on the one hand Japan had an agreement with us and on the other was in an alliance with the Axis powers. He said that our people do not trust Hitler and furthermore we feel that it would be inevitable that Hitler would eventually, if he was successful, get around to the Far East and double-cross Japan. The Secretary cited the instance when Germany, after having concluded an anti-Comintern pact with Japan had surprised Japan later on by entering into a non-aggression pact with Russia and finally went back on the non-aggression pact by attacking Russia. The Secretary said that he presumed Japan did not know in advance what Germany’s intentions were any more than we did. The Secretary expressed great doubt that any agreement into which we entered with Japan while Japan at the same time had an alliance with Hitler would carry the confidence of our people and he emphasized that we would have to have a clear-cut agreement making self-evident our peaceful purpose, for otherwise there would be a redoubled effort by all nations to strengthen their armaments. He pointed out that we are coming out of the Philippines in 1946 and that we are now bringing our marines out of China and in this way we are trying to make a contribution to the establishment of a peaceful world based on law and order. He said that this is what we want to work out with Japan; that we had nothing to offer in the way of bargaining except our friendship. Our commercial program [745면] was one, he said, calling for a maximum production and distribution of goods. The Secretary pointed out also that we are even now engaged in efforts to induce the British Empire to reduce its Empire preferences. He said that what we desire is to put our people back to work in a way that can never be accomplished through permitting armies to overrun countries. The Secretary observed that many Japanese spokesmen had spoken of Japan’s desire to have a controlling influence in Eastern Asia, but the only kind of controlling influence which was worth anything was one that could not be achieved or maintained by the sword. He dwelt briefly upon what we have accomplished in South America through our peaceful policies and through renouncing the employment of gunboats and armed forces. The Secretary made it clear that we recognized that under present emergency conditions we cannot carry out to perfection our commercial policy which must be modified to meet war conditions, but we can at least establish the principles. The Secretary said, going back to the situation with regard to Japan’s relations with the Axis, that a difficult situation was created thereby as far as our public was concerned—as, for example, when telegrams of congratulations were sent to Hitler by Japanese leaders when he commits some atrocity.\n\nThe Japanese Ambassador observed that the United States and Russia were not pursuing parallel courses and yet we are aligned with Russia at the present time. He also said he appreciated very well the relations we had developed with South America but that, although Japan would like to imitate us, Japan was not in a position to be so magnanimous—as, for example, in the matter of extending substantial lend-lease aid to other countries.… The Secretary then added that he frankly did not know whether anything could be done in the matter of reaching a satisfactory agreement with Japan; that we can go so far but rather than go beyond a certain point it would be better for us to stand and take the consequences. The Ambassador then said that Japan is now hard-pressed and that the Secretary was well aware of how desirous Japan was to reach some agreement with the United States.\n\nMr. Kurusu said that he had served five years as Director of the Commercial Bureau of the Japanese Foreign Office and that he was familiar with the developments in Japan’s commercial policy. He said that the situation with respect to the Empire preferences was one of the factors which had influenced Japan to go into the Axis camp. He said that the United States was an economically powerful country and that the United States was, therefore, in a much better position than was Japan to enter into commercial bargaining. Furthermore, Japan was much more dependent than was the United States upon foreign [746면] trade. He felt that what the two Governments should now do would be to achieve something to tide over the present abnormal situation. He referred, for example, to the exchange control situation which had been developed in Japanese-occupied China and expressed the view that that situation could not be done away with in a short time. He said that perhaps after the war was over it might be possible to adopt a more liberal policy but that he was unable to promise anything on the part of his Government. The Secretary asked whether Japan could not now agree in principle on commercial policy. Mr. Kurusu made no direct reply but went on to say that in the early years of American intercourse in the Far East our main interest was in commerce and not religious and cultural activities; that we had pursued a course of idealism, but with American occupation of the Philippines the situation changed somewhat and the United States tied itself in with the European concert of nations.\n\nTurning to the question of the Tripartite Pact, Mr. Kurusu said that he could not say that Japan would abrogate the Tripartite Pact but that Japan might do something which would “outshine” the Tripartite Pact.\n\nThe Secretary pointed out that unless peacefully minded nations now start their program of reconstruction it will be impossible to get such a program started later on because the selfish elements would get control of the situation and prevent the materialization of a liberal policy. Therefore, he said it was necessary to get the fundamental principles established so that we might begin to enable the peaceful forces, which were now demoralized, to assert a leadership. Unless we pursue such a course, the Secretary noted, we shall not be able to obtain the confidence of peacefully minded people when the time for putting into effect a reconstruction program arrives. Mr. Kurusu asked whether the Secretary had a concrete formula for dealing with Japan’s relations with the Axis alliance. The Secretary made it clear that this was a matter for Japan to work out. He said that if we could get a peaceful program firmly established, Hitler ought to be asked not to embarrass us too much. He asked whether Japan could not work it out in some way which would be convincing to the American people. He said that if it goes the wrong way every peaceful nation will redouble its defensive efforts. The Secretary emphasized again that the public would be confused in regard to a survival of a relationship between Japan and the Axis while Japan had an agreement with the United States.\n\nThe Ambassador asked whether it was not important now to make some understanding to save the situation. The Secretary said he agreed but that he felt that the Tripartite Pact was inconsistent with the establishment of an understanding.\n\n[747면]\n\nMr. Kurusu asked what could the Secretary suggest. The Secretary said that if we mix the Tripartite Pact with an agreement with the United States it will not be possible to get many people to follow us. The Secretary said that the question arises whether Japanese statesmen desire to follow entirely peaceful courses with China or whether they desire to face two ways. The Secretary went on to say that if the Japanese should back away from adopting a clear-cut position with regard to commercial policy, with regard to a course in China consistent with peaceful principles and with regard to Japanese relations to the European war this would leave us in an indefensible position in regard to the proposed agreement. We would have to say that the Japanese Government is unable to get its politicians into line.\n\nThe Ambassador repeated that the situation in Japan was very pressing and that it was important to arrest a further deterioration of the relations between the two countries. He suggested that if this situation could now be checked an atmosphere would develop when it would be possible to move in the direction of the courses which this Government advocated. He pointed out that big ships cannot turn around too quickly, that they have to be eased around slowly and gradually.\n\nThe Secretary replied that if we should sit down and write an agreement permeated with the doctrine of force it would be found that each country would be entirely distrustful and would be piling up armaments, as countries cannot promote peace so long as they are tied in in any way with Hitler.\n\nMr. Kurusu pointed out that a comprehensive solution cannot be worked out immediately, that he could make no promises. He said that our freezing regulations had caused impatience in Japan and a feeling that Japan had to fight while it still could. If we could come to some settlement now, he said, it would promote an atmosphere which would be conducive to discussing fundamentals. The Secretary asked if he did not think that something could be worked out on the Tripartite Pact. The Ambassador said that he desired to emphasize that Japan would not be a cat’s-paw for Germany, that Japan’s purpose in entering into the Tripartite alliance was to use it for Japan’s own purposes, that Japan entered the Tripartite Pact because Japan felt isolated. The Secretary observed that it would be difficult to get public opinion in this country to understand the situation as Mr. Kurusu had described it.\n\nHe then asked what the Ambassador had in mind in regard to the Chinese situation and whether the Japanese stood for no annexations, no indemnities, respect for China’s sovereignty, territorial integrity and the principle of equality. The Ambassador replied in the affirmative.\n\n[748면]\n\nThe Secretary then said that while he had made this point already clear to the Ambassador he wished to make it clear also to Mr. Kurusu, that whereas the Japanese Government desired to consider our talks negotiations rather than exploratory conversations, the Secretary felt that without having first reached a real basis for negotiations, he was not in a position to go to the British or the Chinese or the other governments involved, as these governments had a rightful interest in these problems. Mr. Kurusu tried to get the Secretary to specify in just which problems each of the respective governments were interested but the Secretary said that he had not yet, for manifest reasons, discussed these problems with these other governments and anything that he might say would be just an assumption on his part. Mr. Kurusu then said that under such circumstances United States-Japanese relations would be at the mercy of Great Britain and China. The Secretary replied that he believed and must repeat that we must have something substantial in the way of a basis for an agreement to take to these governments for otherwise there would be no point in talking to them. Mr. Kurusu said that the situation was so pressing that it might get beyond our control. The Secretary agreed that that was true but he pointed out that the fact that Japan’s leaders keep announcing programs based upon force adds to our difficulties. He said he would like to leave the Hitler situation to the Japanese Government for consideration.\n\nTurning to the China situation the Secretary asked how many soldiers the Japanese wanted to retain in China. The Ambassador replied that possibly 90 per cent would be withdrawn. The Secretary asked how long the Japanese intended to keep that remaining 10 per cent in China. The Ambassador did not reply directly to this but he invited attention to the fact that under the existing Boxer Protocol Japan was permitted to retain troops in the Peiping and Tientsin area. The Secretary pointed out that the question of the Japanese troops in China was one in which there were many elements of trouble. American interests even had suffered severely from the actions of the Japanese forces and we had a long list of such instances. The Secretary made mention of the great patience this Government had exercised in the presence of this situation. He said the situation was one in which the extremists seemed to be looking for trouble and he said that it was up to the Japanese Government to make an extra effort to take the situation by the collar. He said also that the United States and Japan had trusted each other in the past, that the present situation was one of Japan’s own making and it was up to the Japanese Government to find some way of getting itself out of the difficulty in which it had placed itself. The Secretary went on to say that the situation was now exceptionally advantageous for Japan to put her factories to work in producing goods which [749면] are needed by peaceful countries if only the Japanese people could get war and invasion out of mind. The Ambassador said that our conversations had been protracted and if the American Government could only give the Japanese some hope with regard to the situation it might be helpful. He added that our country was great and strong. The Secretary replied that our Government has not made any threats and he has exercised his influence throughout to deprecate bellicose utterances in this country. He added that the Japanese armed forces in China do not appear to realize whose territory they are in and that the people in this country say that Hitler proposes to take charge of one-half of the world and Japan proposes to take charge of the other half and if they should succeed what would there be left for the United States? Mr. Kurusu suggested that Japan would have to move gradually in China, that one step might lead to another and that what was important now was to do something to enable Japan to change its course. The Secretary asked what was in Mr. Kurusu’s mind. In reply to a suggestion that it was felt in Japanese circles that we have been responsible for delay the Secretary pointed out that we could more rightly accuse the Japanese of delays, that he had met with the Japanese Ambassador promptly every time the latter had asked for a meeting and had discussed matters fully with him. The Secretary added that when Japan’s movement into Indochina in July took place this had caused an interruption of our conversations and it was then that the Secretary could no longer defend the continued shipments of petroleum products to Japan, especially as for the past year he had been under severe criticism in this country for not having cut off those shipments. Mr. Kurusu asked whether we wanted the status quo ante to be restored or what we expected Japan to do. The Secretary replied that if the Japanese could not do anything now on those three points—getting troops out of China, commercial policy and the Tripartite agreement—he could only leave to Japan what Japan could do. The Secretary said that it is our desire to see Japan help furnish a world leadership for a peaceful program and that he felt that Japan’s long-swing interests were the same as our interests. The Ambassador said that he realized that our Government was suspicious of the Japanese Government but he wished to assure us that Japan wanted to settle the China affair notwithstanding the fact that Japan desired to keep a few troops in China for the time being. The Secretary then asked again what the Japanese had in mind. Mr. Kurusu said that it was Japan’s intention to withdraw Japanese troops from French Indochina as soon as a just Pacific settlement should be reached and he pointed out that the Japanese Government took the Burma Road situation very seriously. The Secretary asked, if there should be a relaxation of freezing, to what extent would that enable Japan to adopt peaceful [750면] policies. He explained that what he had in mind was to enable the peaceful leaders in Japan to get control of the situation in Japan and to assert their influence. The Ambassador said that our position was unyielding and that it was Japan’s unyielding attitude toward Chiang Kai-shek which had stiffened Chinese resistance against Japan. He asked whether there was any hope of a solution—some small beginning toward the realization of our high ideals. The Secretary replied that if we do not work out an agreement that the public trusts the arming of nations will go on; that the Japanese Government has a responsibility in the matter as it has created the conditions we are trying to deal with. The Ambassador then suggested the possibility of going back to the status which existed before the date in July when, following the Japanese move into southern French Indochina, our freezing measures were put into effect. The Secretary said that if we should make some modifications in our embargo on the strength of a step by Japan such as the Ambassador had mentioned we do not know whether the troops which have been withdrawn from French Indochina will be diverted to some equally objectionable movement elsewhere. The Ambassador said that what he had in mind was simply some move toward arresting the dangerous trend in our relations. The Secretary said that it would be difficult for him to get this Government to go a long way in removing the embargo unless this Government believed that Japan was definitely started on a peaceful course and had renounced purposes of conquest. The Ambassador said that the Japanese were tired of fighting China and that Japan would go as far as it could along a first step. The Secretary said that he would consult with the British and the Dutch to see what their attitude would be toward the suggestion offered by the Japanese Ambassador. In reply to a question by the Secretary the Ambassador replied that the Japanese Government was still studying the questions of commercial policy involved in our proposal of November 15. He said he assumed that what we had in mind was a program for dealing w
