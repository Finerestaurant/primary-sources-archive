tween our two countries became more and more strained, the people of my country becoming more and more impatient.\n\n“As viewed from the Japanese side, the Japanese Government has made not a few concessions in its assertion at various stages while the United States Government has, it seemed to the Japanese, remained adamant on its contention and has shown little sign of reciprocation, and thus I must frankly inform you that in certain quarters in my country some skepticism has arisen as to the true intention of the United States Government. Personally I do not like to say it, but it is true. People in my country take the freezing of the assets as an economic blockade and they go even so far as to contend that the means of modern warfare are not limited to shooting. No nation can live without the supply of materials vital to its industries. Reports reaching me from home indicate that the situation is serious and pressing and the only way of preserving peace is to reach some kind of amicable and satisfactory understanding with the United States without any unnecessary loss of time. In the face of these mounting difficulties, the Japanese Government bent all its efforts to continue the conversations and bring about a satisfactory understanding solely for the purpose of maintaining peace in the Pacific. My Government therefore is now submitting certain proposals as its utmost effort for that purpose, and I shall feel very grateful if I can have the views of your Government on them at the earliest possible opportunity. Suppose we come to an understanding with this country, the psychological effect of it upon our people will mean much more than what is actually written upon the paper, and the policy of our Government will necessarily be guided and dictated thereby. I confidently hope that the views and desires entertained by the Japanese Government are fully shared and reciprocated by your Government.\n\n“I may add for your information that in view of the serious situation now prevailing in the relations between our two countries, the Japanese Government is sending over here Ambassador Kurusu to assist me in the present conversations and also that the conversations will be taken up by Foreign Minister Togo with Ambassador Grew in Tokio in a parallel line.\n\n“I am afraid I may have used to-day some words which a trained diplomat must not use, but I hope you will kindly forgive my transgression, for it was only because of my earnest wish to keep and direct the relations of our two countries in the course which I believe is best for both of us.”\n\nThe Ambassador appeared very much in earnest in reading the statement.\n\n[718면]\n\nThe Ambassador made some reference to commercial policy as discussed and proclaimed by the President and Prime Minister Churchill at their sea conference some months ago. He referred complainingly to the fact that the Japanese went into Shantung and were only allowed to remain there some six years, at the end of which time they were requested to move out their troops.\n\nThe President then read the following oral statement in reply:\n\n“The entire world has been placed in a precarious position as a result of the havoc which has been wrought by the forces of aggression. Our common sense tells us of the extreme need that the world come back to ways of peace. It is the purpose of this Government to do its best in the spirit of fair play to contribute to establishing a basis for peace, stability, and order in the Pacific area. As a means of achieving these objectives it is essential that emphasis be laid upon giving practical effect to a sound philosophy of human welfare. We have often and quite recently made clear publicly what we have in mind in this regard. We hope that our exploratory conversations will achieve favorable results in the way of providing a basis for negotiations. We shall continue to do our best to expedite the conversations just as we understand that the Japanese Government is anxious to do. We hope that the Japanese Government will make it clear that it intends to pursue peaceful courses instead of opposite courses, as such clarification should afford a way for arriving at the results which we seek.”\n\nThe President also referred orally to his opinion that nations must think one hundred years ahead, especially during the age through which the world is passing, and that the Chinese Government for the past thirty years has been passing through a new experience. He referred to extraterritorial courts and other unusual conditions that had accompanied this new experience of China. If I understood the Ambassador correctly, he said it took three years to develop and dispose of the Shantung problems. The President thereupon replied that the Ambassador, Secretary Hull and himself had only consumed some six months in discussing a solution of our relations and those of other countries in the Pacific and that patience was necessary. The President spoke of a modus vivendi as being not merely an expedient and temporary agreement, but also one which takes into account actual human existence. The Ambassador dwelt briefly again on the question of the Japanese getting out of China by degrees and adding that there would be no annexation, no indemnity, et cetera.\n\nThere was nothing said about when the next conversation would take place. The President brought up his program to visit Warm Springs at the end of this week for some ten days. The Ambassador said that Kurusu would be here about Saturday. [주47a] The President said that, of course, he expected to see Kurusu and confer with the [719면] Ambassador and the Minister and their associates. The Ambassador said that Kurusu was only coming to assist him and coming at his request and that he did not have anything new to bring so far as the Ambassador knew.\n\nC[ordell] H[ull]", "notes": ["[주47] 일본대사는 1941년 11월 7일 국무장관에게 건넨 문서(709면)의 사본도 루스벨트 대통령에게 건넸다.", "[주47a] 1941년 11월 15일."], "warn": false, "pages": ["0782", "0783", "0784", "0785"], "search": "헐(Cordell Hull) — 국무장관, 비망록 작성자 루스벨트(Franklin D. Roosevelt) — 대통령 노무라(野村吉三郎, Nomura) — 주미 일본대사 와카스기(若杉要, Wakasugi) — 주미 일본공사 웰스(Sumner Welles) — 국무차관 고노에(近衞文麿, Konoye) — 전 총리 구루스(来栖三郎, Kurusu) — 특사 도고(東郷茂徳, Togo) — 외상 그루(Joseph C. Grew) — 주일 미국대사 처칠(Winston Churchill) — 영국 총리"}, {"id": "d386", "order": 386, "date": "1941-11-10", "group": "A", "eyebrow": "d386 · Memorandum of a Conversation", "title": "회담 비망록", "badge": null, "list_right": "문서 386", "meta": [{"k": "일자", "v": "1941-11-10"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/25404/35", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 386 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d386"}], "summary": "와카스기 공사가 노무라 대사를 대신하여 면담을 요청하며, 회담을 서둘러 달라는 것과 11월 7일 국무장관이 낸 중일 화해 방안을 더 자세히 듣고 싶다는 두 가지 점을 전한다.", "points": ["와카스기 공사가 자기 요청으로 잡은 약속에 따라 방문했다.", "노무라 대사가 그날 아침 국무장관에게 말하려 했으나 중간에 끊겨 말하지 못한 것이 있어, 이날 저녁이나 다음 날 아침 면담을 원한다고 했다.", "첫째 점은 일본의 절박한 정세와 다가오는 의회(帝國議會) 회기를 고려해 회담을 서둘러 달라는 일본 정부의 희망이다.", "둘째 점은 11월 7일 국무장관이 낸 제안이다. 중국과 일본의 상호 서약을 바탕으로 화해와 우호의 새로운 관계를 발전시킬 방도에 관한 것이다.", "일본 정부는 이 제안에 큰 관심을 보이며, 국무장관이 염두에 둔 바를 더 자세히 밝혀 줄 수 있는지 물었다.", "밸런타인은 국무장관과 상의한 뒤 다시 연락하겠다고 답했다."], "primary": "[워싱턴,] 1941년 11월 10일.\n\n일본 공사 와카스기(若杉要, Wakasugi) 씨가 자기 요청으로 잡은 약속에 따라 방문했다. 와카스기 씨는, 일본 대사가 오늘 아침 국무장관에게 무언가 말할 생각이었으나 중간에 이야기가 끊기는 바람에 말할 기회를 얻지 못했으며, 따라서 일본 대사는 오늘 저녁이나 내일 아침에 국무장관을 만날 약속을 얻어 두 가지 점을 국무장관과 논의하기를 바란다고 말했다. 첫째 점은 일본의 절박한 정세와 다가오는 의회 회기에 비추어 회담을 서두르고자 하는 일본 정부의 희망에 관한 것이었다. 둘째 점은 11월 7일에 국무장관이 낸 제안, 곧 중국과 일본의 상호 서약을 바탕으로 화해와 우호의 새로운 관계를 발전시킬 방도에 관한 제안에 관한 것이었다. 와카스기 씨는, 대사가 이 점에 대한 국무장관의 언급을 일본 정부에 전달했고, 일본 정부는 이 제안에 매우 큰 관심을 가지고 있다고 회답하면서 국무장관이 염두에 둔 바가 정확히 무엇인지 좀 더 충분히 밝혀 줄 수 있겠는지 알고 싶어한다고 말했다.\n\n밸런타인 씨는 국무장관과 상의한 뒤 와카스기 씨에게 다시 연락하겠다고 말했다.\n\n[Joseph W.] Ballantine", "secondary": "[Washington,] November 10, 1941.\n\nMr. Wakasugi, Japanese Minister, called by appointment made at his request. Mr. Wakasugi said that the Japanese Ambassador had it in mind this morning to say something to the Secretary which he did not have an opportunity to say because of an interruption and the Japanese Ambassador therefore desired to have an appointment to see the Secretary either this evening or tomorrow morning to take up with the Secretary two points. The first point related to the desire of the Japanese Government to hasten the conversations in view of the pressing situation in Japan and the forthcoming Diet session. The second point related to the suggestion which the Secretary made on November 7 in regard to means for the development on the basis of mutual pledges by China and Japan of a new relationship of conciliation and friendship. Mr. Wakasugi said that the Ambassador had communicated to the Japanese Government the Secretary’s comments on this point, that the Japanese Government had replied that it was very much interested in this suggestion and wondered if it would be possible for the Secretary to develop more fully just what he had in mind.\n\nMr. Ballantine said that after consulting with the Secretary he would communicate again with Mr. Wakasugi.\n\n[Joseph W.] Ballantine", "notes": [], "warn": false, "pages": [], "search": "와카스기(若杉要, Wakasugi) — 주미 일본공사 노무라(野村吉三郎, Nomura) — 주미 일본대사 헐(Cordell Hull) — 국무장관 밸런타인(Joseph W. Ballantine) — 비망록 작성자"}, {"id": "d387", "order": 387, "date": "1941-11-12", "group": "C", "eyebrow": "d387 · Memorandum by the Ambassador in Japan (Grew)", "title": "주일대사 그루의 각서", "badge": null, "list_right": "문서 387", "meta": [{"k": "일자", "v": "1941-11-12"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2625", "txt": true}, {"k": "발신", "v": "주일대사 그루(Joseph C. Grew)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 387 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d387"}], "summary": "도고 외상의 부탁으로 가세가 그루를 찾아와, 예비 회담은 이미 교섭 단계이며 그 최종 단계에 들어섰고 지체되면 매우 위험한 사태가 온다는 외상의 뜻을 전한 회담 기록.", "points": ["도고 외상의 요청으로 가세 씨가 이날 아침 그루를 찾아와, 외상이 직접 말할 수 없는 사정이 있어 자신을 통해 일본 국내 정세를 전한다고 했다.", "도고는 노무라 대사의 최근 보고에서 미국 정부가 회담을 가능한 한 짧은 시일 안에 매듭지어야 할 긴급성을 충분히 파악하지 못하고 있다는 인상을 받고 「충격을 받았다」고 했다. 가세는 뒤에 이 말을 「우려하고 있다」로 바꾸었다.", "도고는 예비 회담이 이미 교섭 단계에 들어섰을 뿐 아니라, 일본 정부가 이미 최대한의 양보를 했으므로 그 교섭이 이제 최종 단계에 이르렀다고 본다는 것이다.", "가세는 고노에 전 내각이 거국적 지지 아래 회담을 진행했으나, 진전의 뚜렷한 표시 없이 긴 시간이 흐르자 미국이 일본 포위망 완성을 위한 준비를 감추는 수단으로 회담을 이용하고 있다는 견해가 일본에 생겼다고 전했다.", "현 내각은 그 견해에 동의하지 않으나 상당한 반대 세력을 무릅쓰고 이 일에 나섰으며, 교섭 타결이 눈에 띄게 지체되면 「매우 위태롭고 위험한 사태」가 올 것이라고 했다.", "가세는 이 발언에 어떠한 위협의 함의도 없으며 그렇게 여겨져서도 안 되고 다만 사실의 진술로 받아들여야 한다고 힘주어 말했다.", "가세는 도고가 자기 관직은 말할 것도 없고 자기 목숨이 걸려 있음을 온전히 알고 있으면서도 실패의 결과를 충분히 인식한 채 이 마지막 시도를 할 용기를 냈다고 덧붙였다.", "그루는 그 관찰이 앞서 고노에 내각 때 도요다 제독과 고노에 본인이 자신에게 한 말과 사실상 같다고 말했고, 가세는 지금과 그때는 상당히 다르다고 답하며 최종 단계가 이미 시작되었다는 말을 되풀이했다.", "그루는 11월 7일 헐과 노무라의 회담을 담은 국무부 전보 제728호를 가세에게 읽게 했고, 가세는 도고가 그 제8항에 특별히 주목했다고 전했다. 제8항은 중국이 일본과 진정으로 우호적인 관계를 세우려는 뜻을 표명하고 평화적 협력에 온 힘을 다할 용의가 있다는 헐의 제안이다.", "가세가 11월 10일 대통령과 일본대사의 회담 내용을 받았는지 묻자 그루는 받지 못했다고 답했고, 가세는 두 회담의 논조가 달랐다고 말했다.", "그루가 자신의 제1782호 전보를 읽게 하자 가세는 제1항 마지막 문장만 빼면 완전히 정확하다고 했다. 도고가 회담을 「교섭」으로 옮기는 문제에 관해 「그 점을 밀어붙이고 싶지는 않다」고 말했다는 기억이 없다는 것이다.", "그루는 회담에 함께 있었던 두먼 씨에 따르면 외상이 일본어로 실제 그 논평을 했으나, 통역을 맡은 가세가 만든 공식 기록에는 그 말이 들어가지 않았을 법하다고 덧붙인다."], "primary": "[도쿄,] 1941년 11월 12일.\n\n가세(加瀬俊一, Kase) 씨[주47b]가 도고(東郷茂徳, Togo) 씨의 요청으로 오늘 아침 방문하여 다음과 같이 말했다. 즉 외상은 사정상 어떤 일들을 나에게 직접 온전히 자유롭게 말할 수 없으나, 미국 정부가 이 나라의 정세를 — 그것이 미국과의 관계 타결에 이르려는 일본 정부의 현재 노력에 영향을 미치는 한에서 — [720면] 완전히 명확하게 이해하고 있는 것이 매우 중요하다고 여기며, 이러한 까닭에 외상이 가세 씨에게 다음의 것을 나에게 전하도록 부탁했다는 것이다.\n\n도고 씨는, 주워싱턴 일본대사가 대통령 및 국무장관과 나눈 회담에 관한 최근 보고들로부터 미국 정부가 현재의 회담을 가능한 한 가장 짧은 시일 안에 성공적으로 매듭지어야 할 긴급성을 충분히 파악하고 있지 못하다는 인상을 받고 「충격을 받았다(shocked)」(가세 씨가 뒤에 「우려하고 있다(concerned)」로 바꾼 말이다). 가세 씨는 나에게, 도고 씨가 예비 회담이 이제 교섭의 단계에 들어섰다고 여길 뿐 아니라, 일본 정부가 이미 가능한 한 최대의 양보를 했으므로 이 교섭이 이제 그 최종 단계에 이르렀다고 여긴다고 말했다.\n\n이어 가세 씨는 다음과 같이 말했다. 고노에(近衞文麿, Konoye) 공의 지난 정부는 나라 전체의 지지를 받으며 회담을 이끌어 왔으나, 회담이 시작된 이래 진전의 아무런 뚜렷한 표시도 없이 오랜 시간이 흘렀으므로, 미국 정부가 일본에 대한 포위망을 완성하기 위하여 진행하고 있는 준비를 감추는 수단으로 회담을 이용하려 하고 있다는 의견이 일본에 생겨났다는 것이다. 현 내각은 이 의견에 동의하지 않으나, 상당한 규모의 반대에 맞서 미국과 합의에 이른다는 현재의 과업에 착수했으며, 그러한 반대에도 불구하고 현재의 노력에 나설 용기를 냈고 이 점에서 외상에게 만장의 지지를 보내고 있기는 하되, 만일 교섭을 성공적으로 매듭짓는 데 눈에 띄는 지체가 생긴다면 매우 위태롭고 위험한 사태가 빚어지리라는 것이었다. 미국과의 조정에 이르려는 노력을 계속하는 데 반대하는 분자들은 그러한 지체를 무엇이든 붙들어 「자기들 견해가 옳다는 증거로 삼을 것이다. 가세 씨는 이와 관련한 자신의 발언에 어떠한 위협의 함의도 들어 있지 않으며 그렇게 여겨져서도 안 되고, 다만 사실의 진술로만 받아들여져야 한다고 힘주어 말했다. 가세 씨는, 도고 씨가 자신의 관직은 말할 것도 없고 자기 목숨이 걸려 있음을 온전히 깨닫고 있으나, 그럼에도 실패의 결과를 충분히 인식한 채 이 마지막 시도를 할 용기를 냈다고 덧붙였다.\n\n나는 가세 씨에게, 그의 관찰이 일반적으로나 개별적으로나 지난 고노에 내각 시절 도요다(豊田貞次郎, Toyoda) 제독과 고노에 공 자신이 나에게 했던 말과 사실상 같으며 물론 그것들은 본국 정부에 빠짐없이 보고되었다고 말했다. 가세 씨는 현재의 정세와 이전에 있었던 정세 사이에는 상당한 차이가 [721면] 있다고 답하고, 더 이상 지체 없이 교섭을 매듭짓는 일이 지극히 중요하다는 점을 다시 강조하면서, 일본 정부는 교섭의 최종 단계가 이미 시작되었다고 여긴다는 앞서의 진술을 되풀이했다.\n\n이 대목에서 나는 가세 씨에게 11월 8일 오후 8시 자 국무부 전보 제728호[주48]를 읽도록 허락했다. 그 전보는 11월 7일 국무장관과 노무라 제독의 면담을 적은 것이었다. 전보를 읽고 난 뒤 가세 씨는 거기에 담긴 회담 기록이 노무라 제독의 보고와 매우 가깝게 일치한다고 말했다. 그는 도고 씨가 국무부 전보 제8항에 담긴 국무장관의 제안 — 중국이 일본과 진정으로 우호적인 관계를 세우고자 하는 뜻을 표명하는 것과 중국 정부가 일본과의 평화적 협력을 향하여 온갖 노력을 기울일 용의가 있다는 것에 관한 제안 — 에 특별히 주목했다고 덧붙였다. 도고 씨는 이제 이 제안이 어떻게 실제로 실행될 수 있을지 궁금해하고 있다는 것이었다. 나는 가세 씨에게, 그 점은 내가 보기에 헐 씨가 태평양 문제 전체의 조정을 위하여 구상하고 있는 전반적 계획과 직접 연결되어 있는 듯하므로, 일본대사가 국무장관과 그 제안을 충분히 논의하고자 할지도 모르겠다고 말했다.\n\n이어 가세 씨는 11월 10일 대통령과 일본대사 사이의 회담 기록을 내가 받았는지 물었고, 나는 받지 못했다고 답하면서, 국무부가 나에게 보고를 보내지 않은 것은 아마도 11월 10일 대통령과의 회담이 11월 7일 대사와 국무장관의 회담과 별 차이가 없었음을 뜻하리라고 덧붙였다. 가세 씨는 두 회담의 논조가 서로 달랐다고 말했고, 이에 나는 그렇다면 아마도 머지않아 11월 10일 대통령과의 회담 기록을 받게 되리라고 답했다.\n\n그러고 나서 나는 가세 씨에게 11월 10일 오후 8시 자 나의 전보 제1782호[주49]를 읽도록 허락했다. 그 전보는 같은 날 도고 씨와 나의 면담을 적은 것이었다. 가세 씨는 제1항의 마지막 문장을 제외하면 그 기록이 완전히 정확하다고 말했다. 문제의 그 문장에 관하여 가세 씨는, 도고 씨가 회담을 「교섭」으로 옮기는 문제에 관하여 「그 점을 밀어붙이고 싶지는 않다」고 말했다는 것이 자기 기억이 아니라고 하면서, 특히 도고 씨는 실제 교섭의 지극히 중요한 단계가 시작되었다고 강하게 느끼고 있으므로 더욱 그렇다고 했다. (그 면담에 자리를 함께하여 외상의 발언을 적어 두었던 두먼 씨에 따르면, 외상은 위에 언급한 나의 전보[722면]에 보고된 그 논평을 일본어로 실제 했으나, 통역을 맡은 가세 씨가 작성한 공식 기록에는 이 발언이 나타나지 않았을 법하다.)\n\nJ[oseph] C. G[rew]", "secondary": "[Tokyo,] November 12, 1941.\n\nMr. Kase [주47b] called this morning at the request of Mr. Togo to say that while the Foreign Minister of necessity could not with entire freedom tell me certain things directly, he regarded it as of great importance that the Government of the United States should have in mind a completely clear understanding of the situation in this country in so far as it affects the present endeavors of the Japanese Government [720면] to reach a settlement of the relations with the United States and for this reason the Minister had asked Mr. Kase to convey to me the following.\n\nMr. Togo had been “shocked” (a term which Mr. Kase later changed to “concerned”) to receive the impression from the latest reports of the Japanese Ambassador in Washington of his talks with the President and the Secretary of State that the Government of the United States does not fully grasp the urgency of successfully concluding the current conversations in the shortest possible time. Mr. Kase told me that not only does Mr. Togo consider that the preliminary conversations have now entered the stage of negotiation but also that he considers that these negotiations have now reached their final stage since the Japanese Government has already made the greatest possible concessions.\n\nMr. Kase then went on to say that the last government of Prince Konoye had conducted the conversations with the support of the country as a whole but that the long period of time which had elapsed since their inception without any clear indications of progress had given rise to the opinion in Japan that the Government of the United States was endeavoring to utilize the conversations as a means of concealing the preparations which it was carrying on to complete the encirclement of Japan. While the present Cabinet does not agree with this opinion, however, it has undertaken its present task of reaching an agreement with the United States against a considerable body of opposition and, although despite this opposition it has had the courage to embark on its present efforts and is according its unanimous support to the Foreign Minister in this respect, a very critical and dangerous state of affairs will result should any appreciable delay be encountered in successfully concluding the negotiations. Those elements who are opposed to a continuance of efforts to reach an adjustment with the United States will seize upon any such delay as evidence of the correctness of “their views. Mr. Kase was emphatic in his statement that his remarks in this connection contained no implication of threat whatsoever and should not be so regarded, but should be taken only as a factual statement. Mr. Kase added that Mr. Togo entirely realizes that his own life is at stake, to say nothing of his official position, but that nevertheless he has had the courage to make this final attempt in full cognizance of the consequences of failure.\n\nI told Mr. Kase that his observations were virtually the same both in general and in particular as those which had been made to me during the last Konoye Cabinet both by Admiral Toyoda and by Prince Konoye himself and which of course had been reported in full to my Government. Mr. Kase replied that there was a considerable difference [721면] between the present situation and that which had obtained previously, and he again emphasized the vital importance of concluding the negotiations without further delay and reiterated his previous statement that the Japanese Government considered that the final stage of the negotiations had already begun.\n\nAt this point I permitted Mr. Kase to read the Department’s telegram No. 728, November 8, 8 p.m., [주48] which set forth the Secretary’s interview with Admiral Nomura on November 7. After reading the telegram Mr. Kase said that the account of the conversation contained therein followed very closely Admiral Nomura’s report. He added that Mr. Togo had taken especial note of the suggestion of the Secretary contained in paragraph eight of the Department’s telegram concerning an expression on the part of China of its desire to establish genuinely friendly relations with Japan and the readiness of the Chinese Government to make every effort toward peaceful cooperation with Japan. Mr. Togo was now wondering how this suggestion might be put into actual effect. I told Mr. Kase that, since the point would seem to me to be directly linked with the general program which Mr. Hull envisages for an adjustment of the whole Pacific problem, the Japanese Ambassador might care to discuss the suggestion fully with the Secretary of State.\n\nMr. Kase then inquired if I had received an account of the conversation on November 10 between the President and the Japanese Ambassador, to which I replied that I had not, adding that the failure of the Department to send me a report probably meant that there had been little difference between the conversation on November 10 with the President and that of the Ambassador with the Secretary of State on November 7. Mr. Kase said that the tenor of the two conversations had been different, to which I replied that I should then probably in due time receive an account of the conversation with the President on November 10.\n\nI then allowed Mr. Kase to read my telegram No. 1782, November 10, 8 p.m., [주49] setting forth my interview with Mr. Togo of that date. Mr. Kase said that with the exception of the last sentence in paragraph one the account was completely accurate. With reference to the sentence in question Mr. Kase said that it was not his recollection that Mr. Togo had stated that “he did not wish to press the point” regarding the transference of the conversations into “negotiations”, particularly as Mr. Togo felt strongly that the vital stages of the actual negotiations had begun. (According to Mr. Dooman, who was present at that interview and who had noted down the Minister’s remarks, the latter did make, in Japanese, the comment reported in my telegram [722면] referred to above, but quite likely this observation did not appear in the official transcript made by Mr. Kase as interpreter.)\n\nJ[oseph] C. G[rew]", "notes": ["[주47b] 일본 외무성 미국국 제1과장.", "[주48] 게재하지 않음. 1941년 11월 7일 자 비망록, 706면을 보라.", "[주49] 게재하지 않음. 1941년 11월 10일 자 주일대사 비망록, 710면을 보라."], "warn": false, "pages": ["0786", "0787", "0788"], "search": "그루(Joseph C. Grew) — 주일 미국대사, 각서 작성자 가세(加瀬俊一, Kase) — 일본 외무성 미국국 제1과장 도고(東郷茂徳, Togo) — 일본 외상 노무라(野村吉三郎, Nomura) — 주미 일본대사, 원문은 「Admiral Nomura 노무라 제독」 헐(Cordell Hull) — 국무장관 루스벨트(Franklin D. Roosevelt) — 대통령. 원문에는 「the President 대통령」으로만 적혀 있다 고노에(近衞文麿, Konoye) — 전임 총리 도요다(豊田貞次郎, Toyoda) — 전임 외상, 원문은 「Admiral Toyoda 도요다 제독」 두먼(Eugene H. Dooman) — 주일 미국대사관 참사관"}, {"id": "d388", "order": 388, "date": "1941-11-12", "group": "C", "eyebrow": "d388 · Memorandum of Comment by the Ambassador in Japan (Grew), November 12, 1941", "title": "주일대사(그루)의 논평 각서, 1941년 11월 12일", "badge": null, "list_right": "문서 388", "meta": [{"k": "일자", "v": "1941-11-12"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2625", "txt": true}, {"k": "발신", "v": "The Ambassador in Japan (Grew) 주일대사 그루", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 388 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d388"}], "summary": "그루 대사가, 11월 7일 어느 저명한 일본인을 통해 외상에게서 전달받았다는 이른바 「전언」의 신빙성을 가세와의 회담 뒤 의심하게 되었다고 적고, 회담이 진전 없이 길어지는 것도 위험하다고 경고한다.", "points": ["가세(Kase)와의 회담으로, 11월 7일 어느 저명한 일본인이 외상에게서 받았다며 전한 이른바 「전언」의 신빙성에 의문이 생겼다.", "그 전언은 대사의 11월 7일 오후 11시 전보 제1769호 제1항에 보고된 것이다.[주50]", "전언이 불명확하고 오해를 부르는 형태로 전달되었을 가능성이 있다. 받았을 당시에도 다소 놀라웠으나, 아직 외상과 첫 실질 회견을 하기 전이라 정확성을 의심할 근거가 없었다.", "그 전언이 순전히 개인적으로 전해질 성질의 것이고 공식 기록의 일부가 되도록 의도되지 않았던 외상의 발언을 정확히 반영했을 가능성도 있으나, 그 해석마저 의문의 여지가 있다.", "회담의 완전한 결렬보다 회담의 계속이 훨씬 낫다는 것은 명백하지만, 양국 정부의 입장을 좁히는 뚜렷한 진전 없이 회담이 오래 끌면 도리어 여러 보고에서 언급한 위험한 사태의 조성을 앞당길 수 있다. 특히 11월 3일 오후 3시 전보 제1736호를 보라.", "진전을 가능케 할 발의는 여전히 일본의 몫임을 대사는 충분히 알고 있다.", "11월 7일 국무장관에게 제출된 제안들이 일본 정부의 주장대로 일본이 할 수 있는 최대한의 양보인지는 대사로서 말할 처지가 아니다."], "primary": "1941년 11월 12일\n\n가세(Kase) 씨와의 회담은, 11월 7일 어느 저명한 일본인이 외무대신으로부터 받아 나에게 전해 준 이른바 그 전언 — 나의 11월 7일 오후 11시 전보 제1769호 제1항에 보고한 것[주50] — 의 신빙성에 의문을 던진다. 오늘 가세 씨와 나눈 회담에 비추어 볼 때, 그 이른바 전언이 나의 정보 제공자에 의하여 다소 불명확하고 오해를 부르는 형태로 나에게 전달되었을 가능성이 있다. 그것을 전달받았을 당시에도 나에게는 다소 놀랍게 여겨졌으나, 그때는 아직 외무대신과 첫 실질적인 회견을 갖지 않은 터라 그 정확성을 의심할 근거가 없었다. 나의 정보 제공자로부터 온 그 이른바 전언이, 순전히 개인적인 방식으로 나에게 전해질 것이었고 공식 기록의 일부를 이루도록 의도되지 않았던 대신의 발언을 정확히 반영한 것일 가능성도 있으나, 그러한 해석조차 의문의 여지가 있다.\n\n회담의 완전한 결렬보다 회담의 계속이 훨씬 더 바람직하다는 것은 자명해 보이지만, 그럼에도 불구하고 양국 정부 각자의 입장을 조화시키는 데 뚜렷한 진전이 이루어지지 않은 채로 회담이 상당한 기간 질질 끌게 된다면, 최근 여러 달 나의 여러 보고에서, 특히 11월 3일 오후 3시 전보 제1736호에서 언급한 그 위험한 사태의 조성을 오히려 앞당길 수도 있다. 회담에서 그러한 진전을 가능하게 할 발의를 내놓는 일이 여전히 일본에게 달려 있다는 점을 나는 온전히 알고 있으나, 11월 7일 국무장관에게 제출된 제안들이 일본 정부가 주장하는 대로 일본이 할 수 있는 최대한의 양보에 해당하는지 여부는 내가 말할 수 있는 처지가 아니라고 느낀다.\n\nJ[oseph] C. G[rew]", "secondary": "November 12, 1941\n\nMy conversation with Mr. Kase casts doubt as to the credibility of the alleged message which was passed on to me from the Foreign Minister by a prominent Japanese on November 7, as reported in my telegram 1769, November 7, 11 p.m., paragraph numbered one. [주50] In view of my conversation today with Mr. Kase, it is possible that the so-called message had been conveyed to me by my informant in somewhat unclear and misleading form. At the time of its delivery it had struck me as somewhat surprising, but as I had not yet at that time had my first real interview with the Foreign Minister I had no grounds on which to question its accuracy. Although it is possible that the alleged message from my informant accurately reflected the Minister’s remarks, which were to be conveyed to me in a purely personal fashion and were not designed to form a part of the official record, even this interpretation is subject to doubt. While it would appear obvious that a continuation of the talks is greatly to be preferred to a complete break-down, nonetheless for the conversations to drag on for a considerable time with no definite progress being made in reconciling the respective positions of the two Governments may well accelerate the creation of the dangerous situation referred to in my various reports of recent months, particularly in my 1736, November 3, 3 p.m. Although I entirely realize that it is still up to Japan to provide the initiative to make possible such progress in the conversations, I do not feel in a position to state whether as asserted by the Japanese Government the proposals which were submitted on November 7 to the Secretary constitute the maximum Japanese concessions.\n\nJ[oseph] C. G[rew]", "notes": ["[주50] 인쇄되지 않음. 705면의 주일대사 1941년 11월 7일자 각서를 보라."], "warn": false, "pages": [], "search": "그루(Joseph C. Grew) — 주일 미국대사 가세(加瀬俊一, Kase) — 일본 외무성 관리 도고(東郷茂徳, Togo) — 외무대신(원문에는 「외무대신」으로만 나온다) 헐(Cordell Hull) — 국무장관(원문에는 「국무장관」으로만 나온다)"}, {"id": "d389", "order": 389, "date": "1941-11-12", "group": "A", "eyebrow": "d389 · Memorandum of a Conversation", "title": "회담 비망록", "badge": null, "list_right": "문서 389", "meta": [{"k": "일자", "v": "1941-11-12"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/25407/35", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 389 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d389"}], "summary": "노무라 대사와 와카스기 공사가 헐 국무장관을 찾아온다. 헐이 문서 두 건을 건네고, 삼국동맹, 중국에서의 일본군 주둔, 회답 시기를 두고 말이 오간다.", "points": ["대사는 11월 10일 국무장관의 아파트에서 자기가 한 요청에 응하여 찾아왔다. 각주에 따르면 와카스기(若杉要) 공사가 동행했다.", "헐은 중국과 일본 사이의 참된 우호 발전에 관한 자기 견해를 더 자세히 밝혀 달라는 일본 공사의 요청에 응하여 준비한 성명을 대사에게 건넸다.", "헐은 태평양 해결에 관한 미국 정부의 일반적 입장이 바뀌지 않았으며, 일본에 새 내각이 섰어도 일본 정부의 입장은 바뀌지 않았으리라 짐작한다고 말하고, 오해가 없도록 일본 측이 자기 입장에 관하여 준 진술들을 요약해 두었다며 그 문서도 건네고 확인을 청했다.", "노무라는 새 정부가 해결을 서두르고자 하는 뜻을 강조하라 했다면서, 일본 국내 정세가 어렵고 국민이 조바심을 내며 의회 회기가 임박했으니 1주일이나 열흘 안에 어떤 합의에 이르기를 바란다고 했다.", "헐은 11월 10일 대통령에게 제출된 사항을 될 수 있는 대로 빨리 다루고 있으며, 탐색적 회담에서 좋은 기초에 이르는 대로 중국 정부에 접근해 그 태도를 타진할 수 있으리라는 것이 미국 측 견해라고 했다.", "삼국동맹에 관하여 헐은 그 사정을 이곳 국민에게 설명하기가 매우 어려우리라 예상한다고 했다. 노무라는 삼국동맹상의 일본의 의무가 한정된 것이며 공수동맹이 아니라 하고, 영일동맹 때 영국이 러일전쟁 중 중립을 지킨 예를 들었다.", "헐은 대사와 현 내각의 태도는 분명히 이해하나 일본에 다른 정부가 들어설 가능성도 생각해야 한다면서, 일본의 대(對)추축 관계를 설명할 수 있도록 도움을 바란다고 했다.", "헐은 유럽 정세의 중대함과 유럽 주민의 곤궁이 커지고 있음을 들며, 히틀러가 그들을 얼마나 오래 짓눌러 둘 수 있겠느냐는 물음이 생긴다고 했다. 그러므로 전후 계획을 준비할 때가 다가오고 있으며 일본도 여기에 관심이 있을 것이고, 그 때문에 일본은 아마 히틀러와 묶여 있기를 바라지 않을 것이라고 했다.", "노무라는 러일전쟁 종결 뒤 영일동맹의 중요성이 사그라들었듯이, 시간이 갈수록 일본이 추축의 유대에 점점 덜 영향받게 되리라 내다본다고 답했다. 삼국동맹의 사문화(死文化)를 시사한 대목이다.", "중국에서의 병력에 관하여 헐은 미국이 좇는 원칙의 하나가 타국 내정 불간섭이며, 한 나라 군대가 다른 나라에 영구히 주둔하는 것은 그 원칙에 어긋난다고 했다. 노무라는 영구 주둔의 의사를 부인했고, 헐이 무기한 주둔에도 같은 고려가 든다고 하자 무기한 주둔의 의사도 부인했으나 이 점에 관하여 아무 확실한 것도 내놓지 않았다.", "와카스기 공사는 미국 측 문서가 8월 28일자 일본 정부 성명을 언급했으나 일본 정부는 9월 25일자 문서를 토의의 기초로 삼기를 바란다고 지적하고, 자기가 국무차관과의 회담에서 단서 어구의 삭제 용의를 밝혔다는 미국 측 진술은 오해이며 자기가 말한 것은 번역에 부적절한 표현이 있었을 수 있다는 것이었다면서 그 대목의 철회를 요청했다. 헐은 기꺼이 그러겠다고 답했다.", "노무라는 제안된 협정이 미뤄진 채 일본이 장제스와 교섭하는 동안 미국이 계속 장제스를 원조한다면 중국 측은 반드시 교섭을 한없이 끌 것이라 했고, 병력 문제에 관한 일본 측 제안에 중국이 동의하지 않는다는 이유만으로 합의에 이르지 못한다면 전쟁으로 갈 수도 있는 미일 관계의 열쇠를 중국이 쥐는 형국이 된다고 했다.", "헐은 밸런타인과 상의한 뒤, 모레(11월 14일)에는 무엇인가 줄 수 있기를 바란다고 답했다."], "primary": "[워싱턴,] 1941년 11월 12일.\n\n일본 대사가 11월 10일 국무장관의 아파트에서 자기가 한 요청에 응하여 찾아왔다.[주51] 국무장관은 중국과 일본 사이의 참된 우호 관계의 발전에 관한 [723면] 국무장관의 견해를 더 자세히 밝혀 달라고 일본 공사가 밸런타인(Joseph W. Ballantine) 씨를 통하여 자기에게 전해 온 요청을 언급하고, 그 요청에 응하여 자기가 성명을 하나 준비하였다고 말한 다음 그것을 일본 대사에게 건넸다.[주52]\n\n이어 국무장관은, 태평양의 해결에 관한 미국 정부의 일반적 입장은 바뀌지 않았으며, 일본에 새 내각이 섰기는 하나 일본 정부의 입장도 바뀌지 않았으리라고 자기는 짐작한다고 말하였다. 그는 아무런 오해가 없도록 하기 위하여 우리가 일본 측이 자기들의 입장에 관하여 우리에게 준 진술들을 간추린 것을 작성해 두었으며, 일본 정부가 우리의 이 짐작이 옳음을 확인해 줄 수 있다면 고맙겠다고 말하였다. 이어 국무장관은 이 문제에 관하여 우리가 준비한 진술서를 일본 대사에게 건넸다.[주53]\n\n대사는, 일본의 국내 정세가 어렵고 국민이 조바심을 내고 있으며 의회의 회기가 임박해 있으므로, 해결을 서둘러 이루려 하는 일본 정부의 바람을 자기가 강조해 주기를 새 정부가 바라고 있다고 말하였다. 따라서 그는 1주일이나 열흘 안에 어떤 합의에 이를 수 있기를 바란다고 하였다. 국무장관은 일본 대사가 11월 10일 대통령에게 제출한 사항들에 관하여 우리가 될 수 있는 대로 빨리 작업하고 있다고 논평하고, 우리의 탐색적 회담에서 좋은 기초에 이르는 대로 우리가 중국 정부에 접근하여 그 태도를 타진할 수 있으리라는 것이 우리의 견해라고 시사하였다. 통상 정책에 관하여 국무장관은, 일본 정부의 제안 가운데 우리가 충분히 이해하지 못한 점들이 있다고 말하고, 일본 정부가 마음에 두고 있는 것이 우리가 마음에 두고 있는 것과 같으리라고 짐작한다며, 그것은 곧 일본과 영국과 그 밖의 나라들이 평등과 공정한 대우의 기초 위에서 함께 모이도록 하는 것이라고 하였다. 국무장관은 이어, 삼국동맹의 사정을 이곳 국민에게 설명하는 데 많은 어려움이 있으리라 예상한다고 말하였다. 대사는, 삼국동맹 아래에서 일본이 지는 의무는 한정되어 있으며 그것이 공수동맹(攻守同盟)이 아니라고 답하고, 영일동맹 시절에도 영국은 일본과 러시아 사이의 전쟁 동안 중립을 지켰다고 하였다.\n\n국무장관은, 일본과 추축 열강의 관계를 자기가 설명할 수 있게 하기 위하여 도움을 받고 싶다고 말하였다. 우리가 대사의 태도와 현 일본 내각의 태도를 분명히 이해하고 있다 하더라도, 일본에 다른 정부가 들어설 가능성을 고려하지 않을 수 없기 때문이라는 것이었다. 국무장관은 이어 유럽 정세가 점점 중대해지고 [724면] 유럽 주민의 곤궁이 커지고 있음을 지적하며, 이는 히틀러가 그 주민들을 얼마나 오래 짓눌러 둘 수 있겠는가 하는 물음을 일으킨다고 하였다. 그는 이런 까닭에 전후 계획을 준비할 때가 다가오고 있으며, 이는 일본 정부도 관심을 가지지 않을 수 없는 문제라고 느낀다고 말하였다. 그는 일본이 전후의 정세에 대처할 건설적인 계획에서 한몫을 맡고 싶어 할 것이며, 이런 까닭에 일본이 아마도 히틀러와 묶여 있기를 바라지 않으리라고 시사하였다. 그는 우리가 말썽에 휘말리지 않으려 애쓰고 있으며, 그 목적을 위하여 우리 자신의 재앙을 막고자 평화적인 세력들을 결집시키려는 노력을 기울이고 있다고 말하였다.\n\n대사는, 러일전쟁의 종결 뒤에 영일동맹의 중요성이 사그라들었던 것과 똑같이, 시일이 지남에 따라 일본이 추축의 유대에 점점 덜 영향을 받게 되리라고 자기는 내다본다고 논평하였다.\n\n국무장관은, 삼국동맹에 관하여 하도 여러 진술이 나왔으므로, 우리가 세계를 올바른 진로로 출발시키려 한다면 우리가 평화의 기초 위에서 나아가고 있음을 분명히 해 두어야 한다고 논평하였다.\n\n대사는 이에 답하여, 제안된 협정이 성립되어 시행된다면 일본이 자기가 바라는 물자와 시장에 접근하기 위하여 무력을 쓰는 문제는 있을 수 없을 것이라고 말하였다.\n\n국무장관은, 우리가 제안된 협정을 다른 면에서 다듬어 낼 수 있다면 삼국동맹 관계 문제는 일본에게 문제가 되지 않아야 마땅하다고 논평하였다.\n\n대사는 미국이 일본과 중국이 강화 조건을 자기들끼리 다듬어 내도록 맡겨 두겠다는 것이 국무장관의 생각인지 물었다. 국무장관은, 우리가 이 문제를 아직 중국 측과도 영국 측이나 네덜란드 측과도 이야기하지 않았으나, 만일 우리가 이 문제를 탐색 단계 너머로 진전시키게 되면 그들과 기꺼이 이야기하겠다고 그들에게 말해 두었다고 답하였다. 그는 우리가 먼저 그들에게 내놓을 실질적인 무엇인가를 가지기를 바란다고 덧붙이고, 우리가 교섭 단계에 이르면 다른 정부들과 이야기하고 그런 다음 일본과 다시 이야기하겠다고 말한 바 있다고 하였다.\n\n일본 공사는 국무장관이 대사에게 건넨 두 문서를 언급하였다. 대사와 공사가 방금 다 읽은 것이었다. 중국과 일본 사이의 상호 화해에 관한 문서에 대하여, 그는 서약의 교환이 어떤 식으로 이루어지리라고 국무장관이 마음에 두고 있는지, 예컨대 우리가 일본 측과 중국 측을 한자리에 데려온 [의] 결과로 그리 되리라는 것인지 물었다. 국무장관은, 두 이웃이 서로 말도 하지 않는 사이가 되었을 때 어느 한쪽이 먼저 나선 결과로 화해하는 일도 있고, 서로가 함께 아는 벗이 그들을 한자리에 데려오는 일도 있다고 답하였다. 여러 사람이 차례로 무엇을 하고 무엇을 말할 것인지를 언제나 미리 계획할 수는 없는 노릇이다. 그는 지금 중요한 것은 강화 해결의 조항에 관한 근본 문제들을 처리하는 일이며, 절차의 문제는 그 뒤에 더 흡족하게 결정될 수 있으리라고 느낀다고 말하였다. [725면] 이 점들은 두세 번 되짚어 이야기되었다. 일본 측이 이를 이해하는 데 어려움을 느끼는 듯이 보였기 때문인데, 아마도 국무장관의 시사에 겉으로 드러난 것 이상의 무엇이 담겨 있으리라는 선입관 탓이었을 것이다.\n\n강화 문제에 관한 현 일본 정부의 일반적 입장 문제에 관계된 둘째 문서에 대하여, 공사는 우리가 일본 정부의 8월 28일자 성명을 언급하였으나 일본 정부는 9월 25일자 문서를 토의의 기초로 삼기를 바란다는 뜻을 밝힌 바 있다고 말하였다. 그는 우리가 8월 25일자 성명에서 인용한 보장에 담긴 단서 어구들을 빼는 데 대한 일본 정부의 용의를 그가 국무차관과의 회담에서 표명하였다고 우리가 진술한 것과 관련하여, 이는 우리 쪽의 오해라고 말하였다. 그는 자기가 언급하고 있던 것은 8월 28일자 성명이 아니라 9월 25일자 성명이었으며, 자기가 국무차관에게 말한 것은 번역에 얼마간 유감스러운 표현이 있었을 수 있고 그것은 일본어 원문과 대조한 뒤에 고칠 수 있으리라는 것이었다고 말하였다. 그는 우리가 그와 관련하여 진술한 바를 철회하겠는지 물었다.\n\n국무장관은 기꺼이 그렇게 하겠다고 말하고, 어떠한 오해든 공사가 주의를 환기해 준 것을 기쁘게 여긴다고 하였다.\n\n대사는, 제안된 협정이 미결로 남겨진 채 일본이 장제스와 교섭하는 동안 미국이 계속 장제스를 원조한다면, 중국 측은 반드시 교섭을 한없이 오래 끌 것이라고 말하였다.\n\n국무장관은, 우리가 중국 문제를 움직이기 시작하게만 하면 그것이 곧 탄력을 얻을 것이라고 말하였다. 만일 일본이 웬만큼 공정해 보이는 조건을 제의한다면 모두가 그 배에 올라타고 싶어 할 것이기 때문이라는 것이었다. 그는 협정으로써 서로의 권리를 지킬 길을 찾아낼 수 있으리라고 확신한다고 하였다.\n\n대사는, 다만 병력에 관한 일본 측 제안에 중국이 동의하려 하지 않는다는 것만으로 우리가 합의에 이르지 못한다면, 그때의 정세는 전쟁으로 이어질지도 모를 일본과 미국의 앞날의 관계에 대한 열쇠를 중국이 쥐고 있는 형국이 되리라고 논평하였다.\n\n국무장관은, 우리가 주선(周旋)에 나서든 일본이 직접 중국에 접근하든, 일본이 중국과 이루는 해결의 성질은 제안된 태평양 해결 전체와 조화를 이루어야 마땅한 것으로 우리는 느낀다고 답하였다. [726면] 그는 우리가 좇고 있는 원칙의 하나가 다른 나라의 내정에 불간섭한다는 것이며, 한 나라의 군대가 다른 나라에 영구히 머무르는 것은 그 원칙과 어긋난다고 말하였다.\n\n대사는 일본 측에 중국에 군대를 영구히 주둔시킬 어떠한 바람도 없다고 부인하였다.\n\n국무장관은 일본군을 중국에 무기한 머무르게 하는 데에도 같은 고려가 든다고 느낀다고 말하였다. 대사는 중국에 군대를 무기한 두려는 어떠한 바람도 부인하였으나, 이 점에 관하여 확실한 것은 아무것도 내놓지 않았다.\n\n일본 공사는, 일본 측 제안에 관하여 될 수 있는 대로 빨리 우리에게서 회답을 듣고자 하는 일본 정부의 바람에 대하여 대사가 앞서 말한 바를 되풀이하였다. 국무장관은 우리가 이 문제에 힘닿는 대로 열심히 작업하고 있다고 답하고, 밸런타인 씨와 상의한 뒤에, 모레(11월 14일)에는 그들에게 줄 무엇인가를 가질 수 있기를 바란다고 말하였다.\n\n[Joseph W.] Ballantine [조지프 W.] 밸런타인", "secondary": "[Washington,] November 12, 1941.\n\nThe Japanese Ambassador called in response to a request made by him on November 10 at the Secretary’s apartment. [주51] The Secretary referred to the request which had been communicated to him by Mr. Ballantine from the Japanese Minister for a further elaboration of [723면] the Secretary’s views in regard to the development of a real friendship between China and Japan, and he said that in response to that request, he had prepared a statement which he then proceeded to hand to the Japanese Ambassador. [주52]\n\nThe Secretary then said that the general position of this Government in regard to a Pacific settlement had not changed and he assumed that although a new ministry had been formed in Japan, the position of the Japanese Government had not changed. He had said that with a view to there being no misunderstanding, we had drawn up a recapitulation of statements which the Japanese had given us in regard to their position, and we would appreciate it if the Japanese Government could confirm that our assumption was correct. The Secretary then handed the Japanese Ambassador the statement which we had prepared on this subject. [주53]\n\nThe Ambassador said that his new Government desired him to emphasize the desire of the Japanese Government to expedite a settlement because the internal situation in Japan was difficult, people becoming impatient and a session of the Diet impending. He therefore hoped that within a week or ten days some agreement could be reached. The Secretary commented that we were working as rapidly as possible on the matters which the Japanese Ambassador had presented to the President on November 10 and suggested that it was our view that as soon as we reached a good basis in our exploratory conversations, we could approach the Chinese Government and sound out their attitude. In regard to commercial policy, the Secretary said that there were points in the Japanese Government’s proposal which we did not fully understand, and we assumed that what the Japanese Government had in mind was the same as what we had in mind, namely, to have Japan, Great Britain and other countries get together on a basis of equality and fair treatment. The Secretary went on to say that he expected much difficulty in explaining to the people here the Tripartite alliance situation. The Ambassador replied that Japan’s obligation under the Tripartite alliance was limited, that it was not an offensive and defensive alliance, and that during the time of the Anglo-Japanese alliance, Great Britain remained neutral during the war between Japan and Russia.\n\nThe Secretary said he would like help in order to enable him to explain Japan’s relationship to the Axis powers, for even though we understood clearly the Ambassador’s attitude and that of the present Japanese Cabinet, there must be considered the possibility of another Government coming into power in Japan. The Secretary went on to point out the increasing gravity of the situation in Europe and [724면] the growing distress of European populations, which raised the question how long could Hitler keep those populations crushed down. For this reason, he said, the time was approaching for preparing for a post-war program, a matter in which he felt that the Japanese Government must be interested. He suggested that Japan would want to play a part in a constructive program to meet the after-the-war situation, and that for this reason Japan would probably not want to be tied in with Hitler. He noted that we are trying to keep out of trouble and to that end are making efforts to unite peaceful forces to avert disaster for ourselves.\n\nThe Ambassador commented that he anticipated that as time went on Japan would be less and less affected by the Axis ties, just as the importance of the Anglo-Japanese alliance waned after the conclusion of the Russo-Japanese war.\n\nThe Secretary commented that so many statements had been made about the Tripartite Pact that it should be made clear if we are going to start the world on the right course that we are going ahead on a basis of peace.\n\nThe Ambassador said in reply that if the proposed agreement were made and applied there would be no question of the use of force by Japan to gain access to materials and markets which she desired.\n\nThe Secretary commented that the matter of the Tripartite Pact relationship ought not to be a problem with Japan if we could work out our proposed agreement in other ways.\n\nThe Ambassador asked whether it was the Secretary’s idea that the United States would leave to Japan and China to work out their peace terms by themselves. The Secretary replied that we had not yet talked the subject over with the Chinese or the British or Dutch, but we have told them that if we get matters beyond an exploratory stage we should be glad to talk with them. He added that we first want to have something substantial to present to them and that he had said that if we reach a stage of negotiations we will talk with the other Governments and will then talk again with Japan.\n\nThe Japanese Minister referred to the two documents which the Secretary had handed the Ambassador and which both the Ambassador and the Minister had just read. With regard to the document relating to mutual conciliation between China and Japan, he asked what the Secretary had in mind as to how the exchange of pledges would come about, as, for example, whether it would be as a result [of] our bringing the Japanese and Chinese together. The Secretary replied that when two neighbors have not been on speaking terms, sometimes they make up as a result of an initiative taken by one or the other and sometimes they are brought together by a mutual friend. One cannot plan always in advance what each of [725면] a number of persons will in succession do or say. He said he felt that the main thing now was to dispose of basic matters in regard to the provisions of a peace settlement and that questions of procedure could thereafter be more satisfactorily settled. These points were gone over two or three times, as the Japanese appeared to find difficulty in understanding them, possibly because of a preconception that the Secretary’s suggestion contained more than appeared on its face.\n\nWith regard to the second document which related to the question of the present Japanese Government’s general position on the question of peace, the Minister said that we had referred to the Japanese Government’s statement of August 28, whereas the Japanese Government had indicated that it desired to use their September 25 document as the basis for discussions. He said that, with reference to our statement that in conversation with the Under Secretary he had expressed the willingness of the Japanese Government to omit the qualifying phrases contained in the assurances which we had quoted from the August 25 statement, this was a misunderstanding on our part. He said that he was not referring to the August 28 statement but to the September 25 statement and that what he had said to the Under Secretary was that there might have been some unfortunate phraseology in translation which could be improved after comparison with the original Japanese text. He asked whether we would withdraw what we had said in that connection.\n\nThe Secretary said he would be glad to do so, and was glad to have the Minister call attention to any misunderstanding.\n\nThe Ambassador said that if the proposed agreement was held in abeyance and the United States continued to aid Chiang Kai-shek while Japan was negotiating with Chiang the Chinese would be certain to keep negotiations dragging for an interminable period.\n\nThe Secretary said that if we got the China matter started to move it would soon gain momentum, for if Japan should propose terms which seem reasonably fair everybody would want to get aboard. He felt sure that ways could be found for safeguarding each other’s rights by agreement.\n\nThe Ambassador commented that if we failed to reach an agreement simply over an unwillingness on the part of China to agree to the Japanese proposals in regard to troops, the situation would then be one in which China held the key to future relations between Japan and the United States which might result in war.\n\nThe Secretary replied that whether we exercised our good offices or whether Japan approached China directly we felt that the nature of the settlement which Japan reached with China was one which should be in harmony with the proposed Pacific settlement as a whole. One [726면] of the principles, he said, upon which we were proceeding was noninterference in the internal affairs of other nations, and the permanent retention of troops of one country in another country was inconsistent with that principle.\n\nThe Ambassador disclaimed any desire on the part of Japan to station troops in China permanently.\n\nThe Secretary said he felt that the same consideration applied to the retention of Japanese troops in China indefinitely. The Ambassador disclaimed any desire to keep troops in China indefinitely, but he did not offer anything definite on this point.\n\nThe Japanese Minister repeated what the Ambassador had earlier said about the desire of the Japanese Government to hear from us as soon as possible in regard to the Japanese proposals. The Secretary replied that we were working as hard as we could on the matter, and after consulting with Mr. Ballantine, said that we hoped we could have something for them day after tomorrow (November 14).\n\n[Joseph W.] Ballantine", "notes": ["[주51] 와카스기 씨가 대사와 동행하였다.", "[주52] 바로 다음 문서.", "[주53] 뒤의 727면."], "warn": true, "pages": ["0789", "0790", "0791", "0792"], "search": "Hull 헐(Cordell Hull, 국무장관) — 원문에는 「국무장관」으로만 나온다 Nomura 노무라(野村吉三郎, 주미대사) — 원문에는 「일본 대사」로만 나온다 Wakasugi 와카스기(若杉要, 공사) — 원문에는 대체로 「일본 공사」로 나온다 Ballantine 밸런타인(Joseph W. Ballantine, 기록자) Welles 웰스(Sumner Welles, 국무차관) — 원문에는 「국무차관」으로만 나온다 Roosevelt 루스벨트 — 원문에는 「대통령」으로만 나온다 Hitler 히틀러 Chiang Kai-shek 장제스(蔣介石)"}, {"id": "d390", "order": 390, "date": "1941-11-12", "group": "B", "eyebrow": "d390 · Oral Statement Handed by the Secretary of State to the Japanese Ambassador (Nomura) on November 12, 1941", "title": "1941년 11월 12일 국무장관이 일본대사(노무라)에게 건넨 구두 성명", "badge": null, "list_right": "문서 390", "meta": [{"k": "일자", "v": "1941-11-12"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/25407/35", "txt": true}, {"k": "발신", "v": "헐(Cordell Hull) — 국무장관", "txt": true}, {"k": "수신", "v": "노무라(野村吉三郎, Nomura) — 주미 일본대사", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "구두 성명"}], "links": [{"k": "FRUS", "text": "문서 390 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d390"}], "summary": "11월 7일 비공식 회담에서 헐이 낸 중일 상호 서약 제안을 부연하며, 일본이 무력이 아닌 도의의 힘으로 국위를 높이고 건설적·자유주의적·평화적 세계 계획에 온전히 참여할 것을 권한다.", "points": ["11월 7일 비공식 회담에서 국무장관이 낸 제안, 곧 중국과 일본 사이에 진정한 우호와 협력을 세우기 위한 상호 서약의 교환에 대해 일본대사가 더 자세한 부연을 요청한 데 답하는 문서다.", "그 제안은, 일본 정부가 중국 전 지역에서 일정 기간 안에 철병하기로 동의한다면 일본 국민은 4년 넘게 치른 무거운 희생에 대해 아무것도 보여 줄 것이 없다고 느낄 것이며 그러한 합의는 일본에게 국위의 손실을 안긴 것으로 여겨지리라는 대사의 소견에서 촉발된 것이다.", "국무장관은, 유럽이 무정부 상태의 위협에 놓인 현 세계 위기가 도리어 일본에게 군사력으로는 결코 이룰 수 없는 방식으로 도의의 힘 위에서 국위를 높일 유례없는 기회를 준다고 논평했다.", "즉 중국 정부가 지금(일본의 발의에 따라서든 스스로의 발의로든) 일본과의 진정한 우호를 바라며 평화롭고 상호 이익이 되는 선을 따라 협력하기 위해 합리적으로 할 수 있는 모든 것을 하겠다고 말한다면, 일본도 상호 우호와 화해의 정책으로 응할 수 있지 않겠는가 하는 것이다.", "상정되는 것은 예비 회담에서 논의해 온 건설적·자유주의적·평화적 세계 계획의 실행이며, 그 계획은 법 아래의 질서 유지, 정의를 갖춘 평화, 인류의 사회적·경제적 복리를 지향하는 기본 원칙들의 실제 적용을 예상한다.", "그 계획은 국가 간의 평화적 협력, 만인의 권리에 대한 상호 존중, 영토 확장의 부인, 그리고 통상의 자유화와 천연자원에 대한 공정한 접근·개발, 생활 수준의 향상을 가져올 넓은 시야의 경제 정책 채택을 예상한다.", "세계사의 이 위중한 순간에 그러한 계획에 일본이 온전히 참여한다면 일본은 의심할 여지 없는 도의적 지도자의 지위를 얻게 될 것이며, 그것은 일본 정치의 원대하고 계명된 성격을 입증하는 것이 될 것이다."], "primary": "1941년 11월 12일\n\n두 나라 사이에 진정한 우호와 협력을 수립하기 위한 중국과 일본 상호간의 서약 교환에 관하여 11월 7일 비공식 회담에서 국무장관이 낸 제안과 관련하여, 국무장관이 염두에 두고 있을 어떠한 추가적 부연이라도 듣고 싶다는 일본대사의 요청에 대하여 언급한다.\n\n문제의 그 제안은 일본대사의 다음과 같은 소견에서 촉발된 것임을 상기하게 될 것이다. 즉, 만약 일본 정부가 중국의 모든 지역에서 일정한 기간 안에 군대를 철수하는 데 동의한다면, 일본 국민은 자기들이 치른 4년 남짓의 무거운 희생에 대하여 내보일 것이 아무것도 없다고 느낄 것이며, 그러한 합의는 일본에게 국위의 상실을 초래한 것으로 여겨지리라는 것이었다. 국무장관은 일본대사의 그 소견에 답하여, 유럽이 무정부 상태의 위협에 놓여 있는 현재의 세계적 위기야말로 일본에게, 군사적 힘으로는 결코 이루어 낼 수 없는 방식으로 도의의 힘이라는 기초 위에서 국위를 드높일 유례없는 기회를 제공한다고 논평하였다. 곧, 만약 중국 정부가 지금 — 일본의 발의의 결과로서든 아니면 스스로의 발의로서든 — 중국은 일본과의 진정한 우호를 바라며 평화롭고 서로에게 이익이 되는 선을 따라 일본과 협력하기 위하여 합리적으로 할 수 있는 모든 것을 다하겠다고 말한다면, 일본도 중국과의 상호 우호와 화해의 정책으로 [727면] 이에 응하는 것이 가능하다고 여길 수 없겠는가? 그러한 정책은 일본으로 하여금 오늘 세계 문명을 위협하고 있는 파괴적 세력들을 저지하는 데에 헤아릴 수 없는 값어치의 기여를 하게 하고, 모든 평화로운 나라가 환영할 세계에서의 지도적 지위를 떠맡게 하지 않겠는가.\n\n상정되고 있는 것은, 우리가 예비 회담에서 이야기해 온 그러한 종류의 건설적이고 자유주의적이며 평화로운 세계 계획의 실행이다. 그 계획은 법 아래에서의 질서 유지, 정의를 갖춘 평화, 그리고 인류의 사회적·경제적 복리를 지향하는 기본 원칙들의 실제적 적용을 예상하고 있다. 그것은 국가들 사이의 평화적 협력, 모든 이의 권리에 대한 상호 존중, 영토 확장의 부인, 그리고 통상의 자유화를 가져오고 천연자원에 대한 공정한 접근과 그 개발을 가능하게 하며 모든 국민의 향상을 위하여 생활 수준을 끌어올릴 넓은 시야의 경제 정책들의 채택을 예상하고 있다.\n\n세계사의 이 위중한 순간에 일본이 그러한 계획에 온전히 참여한다면, 그것은 일본에게 의심할 여지 없는 도의적 지도자의 지위를 부여할 것이며 일본 정치의 멀리 내다보고 계명된 성격을 입증하는 것이 될 것이다.", "secondary": "November 12, 1941\n\nReference is made to the Japanese Ambassador’s request for any further amplification that the Secretary of State might have in mind in connection with the suggestion made by him in informal conversation on November 7 in regard to mutual exchanges of pledges between China and Japan for the establishment of real friendship and collaboration between the two countries.\n\nIt will be recalled that the suggestion under reference was prompted by the observation of the Japanese Ambassador that should the Japanese Government agree to withdraw its troops within a definite period from all areas of China the Japanese people would feel that they had nothing to show for the four years and more of heavy sacrifice that they had made and that such an agreement would be regarded as having caused Japan a loss of prestige. The Secretary, in reply to the Japanese Ambassador’s observation, commented that the present world crisis, in which Europe finds itself threatened with anarchy, affords Japan a unique opportunity to enhance its national prestige on a basis of moral force in a way that military might could never accomplish. That is, if the Chinese Government were now to say, either as a result of Japanese initiative or on its own initiative, that China desired a real friendship with Japan and would do everything it reasonably could to collaborate with Japan along peaceful and mutually beneficial lines, could not Japan [727면] find it possible to reciprocate in a policy of mutual friendship and conciliation with China? Would not such a policy enable Japan to make a contribution of inestimable value toward arresting the destructive forces which now menace world civilization and to assume a leadership in the world which every peaceful nation would welcome.\n\nWhat is envisaged would be an implementation of the kind of constructive, liberal and peaceful world program concerning which we have been talking in our exploratory conversations. That program contemplates practical application of basic principles directed toward preservation of order under law, peace with justice, and the social and economic welfare of mankind. It contemplates peaceful collaboration among nations, mutual respect for the rights of all, no aggrandisement, and the adopting of broad-gauge economic policies which would provide liberalization of trade, afford fair access to and development of natural resources and raise living standards to the betterment of all peoples.\n\nFull association by Japan in such a program at this critical moment in world history would give Japan an undoubted position of moral leadership and be a tribute to the far-sighted and enlightened character of its statesmanship.", "notes": [], "warn": false, "pages": ["0793"], "search": "헐(Cordell Hull) — 국무장관 노무라(野村吉三郎, Nomura) — 주미 일본대사"}, {"id": "d391", "order": 391, "date": "1941-11-12", "group": "B", "eyebrow": "d391 · Oral Statement Handed by the Secretary of State to the Japanese Ambassador (Nomura) on November 12, 1941", "title": "1941년 11월 12일 국무장관이 주미 일본대사(노무라)에게 건넨 구두 성명(oral statement)", "badge": null, "list_right": "문서 391", "meta": [{"k": "일자", "v": "1941-11-12"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/25407/35", "txt": true}, {"k": "발신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "수신", "v": "The Japanese Ambassador (Nomura) 주미 일본대사 노무라", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "구두 성명"}], "links": [{"k": "FRUS", "text": "문서 391 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d391"}], "summary": "미국이 1941년 8월 28일 일본 측 문서에 담긴 평화적 의도의 진술을 인용하며, 도조 내각이 들어선 지금 그 입장이 변하지 않았음을 확인해 줄 것과, 문제가 되는 단서 문구들을 삭제하겠다던 와카스기 공사의 말을 재확인해 줄 것을 요청한다.", "points": ["1941년 8월 28일 일본대사가 대통령에게 전달한 문서들에 담긴 일본 정부의 평화적 의도 진술을 발췌 인용한다.", "인도차이나 주둔에 관하여, 일본은 지나사변이 해결되거나 동아시아에 정당한 평화가 확립되는 즉시 인도차이나에서 철병할 용의가 있으며, 현재의 인도차이나 행동이 인접 영토로의 군사적 진출을 위한 예비 조치가 아님을 거듭 확인한다고 밝혔다.", "그 서약은 타이(Thailand)에 대한 일본의 의도도 명백히 하기에 충분하다고 했으며, 소련에 대해서는 소련이 중립조약에 충실하고 일본이나 만주국(Manchukuo)을 위협하지 않는 한 군사행동을 취하지 않겠다고 했다.", "일본은 「요컨대 일본 정부는 도발 없이 어떤 인접국에 대하여도 무력을 사용할 의도가 없다」고 포괄적으로 진술했다.", "그 진술 이후 일본에 새 내각이 들어섰으므로, 오해의 소지를 피하기 위해 일본 정부가 그 입장이 변하지 않았음을 지금 확인해 준다면 도움이 되겠다는 것이 미국 정부의 생각이다.", "미국은 1941년 10월 2일 성명에서, 일본의 평화적 의도 진술에 「소련이 중립조약에 충실하고 …하는 한」, 「도발 없이」, 「정당한 이유 없이」 같은 불필요해 보이는 단서를 붙일 필요를 이해하기 어렵다고 지적한 바 있다.", "10월 13일 일본 공사는 국무차관과의 회담에서 그러한 단서들이 불행한 표현의 결과이며 일본 정부가 기꺼이 삭제할 것이라고 말했다. 그 회담은 현 일본 내각 성립 이전이었으므로 이 점에 관한 일본 정부의 입장이 분명해지고 공사의 진술이 확인되면 도움이 되겠다.", "이상의 소견은 11월 7일과 11월 10일 일본대사가 제출한 새 제안들을 겨냥한 것이 아니라, 어느 쪽에도 오해가 없도록 우리가 나아가고 있는 기반을 명백히 하기 위한 것이며, 미국 정부는 세목의 논의에 불필요하게 들어갈 뜻이 없고 최근 제안들의 검토를 서두르기 위해 할 수 있는 모든 것을 할 것이다."], "primary": "1941년 11월 12일\n\n1941년 8월 28일 일본대사가 미합중국 대통령에게 전달한 문서들에 평화적인 길을 걷고자 하는 일본 정부의 희망과 의도에 관한 입장 표명이 담겨 있었음을 상기할 것이다. 그 입장은 그 문서들에서 뽑은 다음의 발췌문들에 제시되어 있었다.\n\n「… 일본은 태평양의 평화와 세계의 평화의 유지를 염려하고 있으며, 따라서 일본과 미국의 관계를 개선하기를 바란다 …」\n\n「… 따라서 일본 정부는 태평양 지역에서 항구적이고 광범위한 평화를 가능케 할 양해의 기초로서 기본 정책과 태도에 관한 의견 교환을 하자는 미국 정부의 초청을 환영한다. 그러한 평화를 위하여 일본 정부는 준비가 되어 있다. 태평양 전반의 정세를 포괄하는 평화적 해결을 향한 그러한 공동의 노력을 위하여 일본 정부는, 미국 정부와 마찬가지로, 희생을 치르는 것을 자랑으로 여길 것이다 …」\n\n인도차이나에 일본군이 주둔하는 것에 관하여는 다음과 같이 진술되었다.\n\n「… 일본 정부는 그로써 다른 나라들을 위협할 의도가 없다.\n\n[728면]\n\n「따라서 일본 정부는 지나사변이 해결되거나 동아시아에 정당한 평화가 확립되는 즉시 인도차이나로부터 그 군대를 철수할 용의가 있다.\n\n「나아가 이 점에 관한 모든 있을 수 있는 의혹을 없애기 위하여, 일본 정부는 인도차이나에서의 현재의 행동이 인접 영토로의 군사적 진출을 위한 예비 조치가 아니라는 거듭된 선언을 이에 재확인한다.」\n\n그 진술은 타이에 대하여도 구체적으로 적용되는 것으로 다음과 같이 언명되었다.\n\n「일본 정부는 위의 서약이 타이에 대한 일본의 의도 또한 명백히 하기에 충분하리라고 믿는다.」\n\n소비에트연방에 관하여도 일본 정부는 다음과 같이 구체적으로 언급하였다.\n\n「소·일 관계에 관하여, 일본 정부는 마찬가지로, 소비에트연방이 소·일 중립조약에 충실하고 일본이나 만주국(Manchukuo)을 위협하지 않으며 동 조약의 정신에 반하는 어떠한 행동도 취하지 않는 한 일본은 어떠한 군사행동도 취하지 않을 것임을 선언한다 …」\n\n또한 다음과 같은 포괄적인 진술도 있었다.\n\n「요컨대 일본 정부는 도발 없이 어떠한 인접국에 대하여도 군사력을 사용할 의도가 없다.」\n\n염두에 두고 있는 전반적 계획에 관하여는 다음과 같이 진술되었다.\n\n「… 그러한 토의는 당연히 평화적 방법으로 달성될 수 있는 점진적인 계획을 마련하는 일을 상정할 것이다. 일본 정부는 미국 정부와 그 견해를 온전히 함께한다.\n\n「… 미국 정부가 상세히 제시하였고 비공식 회담에서 태평양 지역을 위한 계획을 이루는 것으로 상정된 원칙과 지침에 관하여, 일본 정부는 이 원칙들과 그것들을 가능한 한 가장 우호적인 방식으로 실제에 적용하는 일이 참된 평화의 으뜸가는 요건이며 태평양 지역뿐 아니라 전 세계에 걸쳐 적용되어야 한다고 여긴다는 점을 밝히고자 한다. 그러한 계획은 일본 자신이 오래도록 바라고 추구해 온 바이다 …」\n\n일본 정부가 위와 같은 입장 표명을 한 뒤에 일본에 새 내각이 들어섰으므로, 미국 정부는 어떠한 오해의 가능성도 피하기 위하여 일본 정부가 이 시점에 일본 정부의 입장이 변하지 않았음을 확인해 줄 수 있다면 도움이 되리라고 믿는다.\n\n미국 정부는 1941년 10월 2일 일본 정부에 보낸 성명에서, 일본 정부의 입장 표명을 받은 것은 기쁜 일이나, 일본 정부가 그 평화적 의도의 진술에 [729면] 불필요해 보이는 단서 문구들을 붙여 한정한 필요성을 이해하기 어렵다고 지적하였다. 우리가 염두에 두었던 것은 다음과 같은 문구들이다.\n\n「소비에트연방이 소·일 중립조약에 충실하고 일본이나 만주국(Manchukuo)을 위협하지 않으며 동 조약의 정신에 반하는 어떠한 행동도 취하지 않는 한.」\n\n「도발 없이.」\n\n「정당한 이유 없이.」\n\n10월 13일 일본 공사는 국무차관과의 회담에서, 그러한 단서들은 불행한 표현의 결과이며 일본 정부는 그것들을 기꺼이 삭제할 용의가 있다고 말하였다. 이 회담은 현재의 일본 내각이 들어서기 전에 이루어진 것이므로, 이 점에 관한 일본 정부의 입장이 분명히 밝혀지고 일본 공사의 진술이 확인된다면 도움이 되리라고 믿는다.\n\n이상의 소견은 11월 7일과 11월 10일에 일본대사가 내놓은 새로운 제안들을 겨냥한 것이 아니라, 다만 일본 정부 측에서나 미국 정부 측에서나 어떠한 오해도 생기지 않도록 우리가 나아가고 있는 기반을 넉넉히 분명하게 하려는 노력에서 제시된 것이다. 세목의 논의에 불필요하게 들어가는 것은 미국 정부의 목적이 아니었고 지금도 아니다. 공통의 이해를 확보하기 위하여 이러한 예비적 소견을 제시하면서, 미국 정부는 일본 정부의 최근 제안들에 대한 검토를 서두르기 위하여 할 수 있는 모든 일을 할 것으로 기대한다.", "secondary": "November 12, 1941\n\nIt will be recalled that the documents communicated by the Japanese Ambassador to the President of the United States on August 28, 1941 contained a statement of the position of the Japanese Government in regard to its desire and intention to pursue peaceful courses. That position was set forth in excerpts taken from those, documents as follows:\n\n“… Japan is solicitous for the maintenance of the peace of the Pacific and the peace of the world and she desires therefore to improve Japanese-American relations …”\n\n“… In consequence, the Japanese Government welcomes the invitation by the Government of the United States to an exchange of views in regard to basic policies and attitudes as the foundation of an understanding that will condition lasting and extensive peace in the Pacific area. For such peace, the Government of Japan is ready: for such a united effort toward a peaceful settlement covering the entire Pacific situation the Government of Japan, like the Government of the United States, would be proud to make sacrifices …”\n\nWith reference to the stationing of Japanese troops in Indochina, it was stated:\n\n“… the Japanese Government has no intention of threatening thereby other countries.\n\n[728면]\n\n“Therefore, the Japanese Government is prepared to withdraw its troops from Indochina as soon as the China Incident is settled or a just peace is established in East Asia.\n\n“Furthermore, in order to remove all possible doubt in this regard, the Japanese Government reaffirms herewith its repeated declaration that its present action in Indochina is not a preparatory step for military advance into neighboring territories.”\n\nThe statement was made specifically applicable to Thailand as follows:\n\n“The Japanese Government believes the above pledge will suffice to clarify also Japan’s intentions toward Thailand.”\n\nSpecific reference was also made to the Soviet Union by the Japanese Government as follows:\n\n“As regards Soviet-Japanese relations, the Japanese Government declares likewise that Japan will take no military action as long as the Soviet Union remains faithful to the Soviet–Japanese neutrality treaty and does not menace Japan or Manchukuo or take any action contrary to the spirit of the said treaty …”\n\nThere was also a comprehensive statement, as follows:\n\n“In a word, the Japanese Government has no intention of using, without provocation, military force against any neighboring nation.”\n\nWith reference to the general program in view, it was stated:\n\n“… such discussions would naturally envisage the working out of a progressive program, obtainable by peaceful methods. The Japanese Government shares fully that view with the Government of the United States.\n\n“… Regarding the principles and directives set forth in detail by the American Government and envisaged in the informal conversations as constituting a program for the Pacific area, the Japanese Government wishes to state that it considers these principles and the practical application thereof, in the friendliest manner possible, are the prime requisites of a true peace and should be applied not only in the Pacific area but throughout the entire world. Such a program has long been desired and sought by Japan itself …”\n\nIn as much as subsequent to the giving by the Japanese Government of the foregoing statement of its position a new cabinet has come into office in Japan, this Government believes that it would be helpful, in order to avoid the possibility of any misunderstanding, if the Japanese Government could at this time confirm that the position of the Japanese Government has not changed.\n\nThis Government, in its statement to the Japanese Government of October 2, 1941, pointed out that, although we were gratified to receive the statement of the position of the Japanese Government, we found it difficult to understand the need for the qualification by [729면] the Japanese Government of its statements of peaceful intent with what would seem to be unnecessary qualifying phrases. We had in mind such phrases as:\n\n“As long as the Soviet Union remains faithful to the Soviets-Japanese neutrality treaty and does not menace Japan or Manchukuo or take any action contrary to the spirit of the said treaty.”\n\n“Without provocation.”\n\n“Without any justifiable reason.”\n\nOn October 13 the Japanese Minister, in a conversation with the Under Secretary of State, said that such qualifications were the result of unfortunate phraseology and that the Japanese Government would be willing to omit them. As this conversation took place before the present Japanese Cabinet came into office, it is believed that it would be helpful if the position of the Japanese Government on this point could be clarified and the statement of the Japanese Minister be confirmed.\n\nThe foregoing observations are not directed to the new proposals put forward by the Japanese Ambassador on November 7 and November 10, but are set forth merely in an effort to make abundantly clear the basis on which we are proceeding in order that there may be avoided any misunderstanding on the part either of the Japanese Government or of this Government. It has not been and is not the purpose of this Government to enter needlessly into a discussion of details. While presenting these preliminary observations toward ensuring a common understanding, this Government will expect to do everything it can to expedite consideration of the latest proposals of the Japanese Government.", "notes": [], "warn": false, "pages": ["0794", "0795"], "search": "헐(Cordell Hull) — 국무장관 노무라(野村吉三郎, Nomura) — 주미 일본대사 루스벨트(Franklin D. Roosevelt) — 대통령(원문에는 「미합중국 대통령」으로만 나온다) 와카스기(若杉要, Wakasugi) — 주미 일본공사(원문에는 「일본 공사」로만 나온다) 웰스(Sumner Welles) — 국무차관(원문에는 「국무차관」으로만 나온다)"}, {"id": "d392", "order": 392, "date": "1941-11-13", "group": "A", "eyebrow": "d392 · Memorandum of a Conversation", "title": "회담 비망록", "badge": null, "list_right": "문서 392", "meta": [{"k": "일자", "v": "1941-11-13"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/25409/35", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 392 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d392"}], "summary": "와카스기 공사가 밸런타인을 찾아와, 10월 13일 자기 발언에 대한 오해를 바로잡고, 구루스의 워싱턴 도착을 알리며, 일본 측 제안에 대한 명확한 가부 회답을 서면으로 조속히 달라고 재촉한다.", "points": ["와카스기가 자기 요청으로 찾아왔다. 구루스가 미드웨이에서 친 전보로 토요일(11월 15일) 오후 워싱턴에 도착한다고 알려 왔다.", "와카스기는 10월 13일 자기가 웰스 국무차관에게 한 말이 전날 일본대사에게 건넨 구두 성명에서 잘못 이해되었다고 다시 지적했다. 자기가 한 말은 「우리 영어가 그리 자신 있지 않으니 훈령의 영역에 불행한 표현이 있을 수 있고, 그런 표현이 있다면 자구를 조정할 수 있다」였다고 했다.", "그는 8월 28일 문서가 아니라 9월 25일 문서를 염두에 두고 있었다고 했다. 8월 28일 문서는 자기가 일본에 가 있는 동안 전달된 것이라고 했다.", "일본대사관은 그 각서의 내용을 본국 정부에 회부하면서 3면 마지막 넉 줄, 4면 첫 문장의 「office」까지, 4행의 마지막 두 낱말과 5행 전부를 삭제했다고 밝혔다.", "와카스기는 일본 국내 사정이 급박하다고 강조했다. 국민이 조급해지고 거의 절망적이 되어 가며, 토요일에 의회가 열리므로 미국과의 구체적 양해를 즉시 바란다고 했다.", "그는 전날 미국이 내일 회답을 준다고 이해했다고 했으나, 밸런타인은 국무장관이 그렇게 말한 것이 아니라 내일 몇 가지 사항을 더 꺼낼 수 있게 되기를 바란다고 말한 것이라고 정정했다.", "와카스기는 11월 7일·10일 제안으로 수정된 9월 25일 일본 제안을 미국이 수락하는지 아닌지를 흑백으로 분명히 적은 회답을 달라고 했고, 시간이 급하니 제안에 대한 논평의 추가 교환을 피하고 싶다고 했다.", "비차별 원칙에 관해, 「전 세계에 적용될 것을 조건으로 중국에도 적용한다」는 뜻은 미국과 일본이 그 원칙을 적용한다는 것이지 모든 나라의 보편적 적용을 가리킨 것이 아니라고 해명했다.", "와카스기는 미국이 여전히 「비공식 예비적 탐색 토의」 단계라 하지만, 일본 정부는 11월 10일 대사가 훈령에 따라 대통령에게 정식으로 성명을 제시한 이후 정식 교섭에 들어갔다고 본다고 했다.", "밸런타인은 실질적으로 논의할 것이 생기면 중국 및 관계국들과 이야기한 뒤 일본에 돌아오며 그때에야 교섭 단계에 이른다는 것이 미국 입장이라고 되풀이했다."], "primary": "[워싱턴,] 1941년 11월 13일.\n\n와카스기(若杉要, Wakasugi) 씨가 자기 요청으로 찾아왔다. 와카스기 씨는 대통령이 구루스 씨를 기꺼이 맞이하겠다고 대사에게 한 말을 거론하면서, 대사관이 구루스 씨가 미드웨이에서 발신한 전보를 받았는데 그가 토요일 오후에 워싱턴에 도착한다는 내용이었다고 말하였다.[주54]\n\n와카스기 씨는, 어제 일본대사에게 건넨 구두 성명에서 언급된 10월 13일 와카스기가 국무차관에게 한 말에 관하여 우리 측에 오해가 있었다고 어제 국무장관에게 진술한 것을 거론하였다. 그는 자기가 웰스 씨에게 한 말은 「우리는 우리의 영어에 그다지 자신이 없으므로 우리 훈령의 영어 번역에 불행한 표현이 더러 있을 수 있습니다. 만약 그러한 표현이 있다면 자구를 조정할 수 있을 것입니다」였다고 말하였다. 그는 자기가 [730면] 염두에 둔 것은 9월 25일 문서였지 자기가 일본에 가 있는 동안 전달된 8월 28일 문서가 아니었다고 말하였다. 그는 일본대사관이 그 각서의 내용을 일본 정부에 회부하면서 3면의 마지막 넉 줄과 4면에서 시작하는 첫 문장의 「office」라는 낱말까지, 그리고 4행의 마지막 두 낱말과 5행 전부를 삭제하였다고 말하였다.\n\n공사는 일본 국민이 조급해지고 거의 절망적이 되어 가고 있으므로 일본의 사정이 급박하다는 점을 밸런타인 씨에게 인식시키려 하였다. 토요일에 의회가 열리며 그들은 미국과의 어떤 구체적인 양해를 당장 바라고 있다는 것이었다. 그는 어제 우리가 내일 그들에게 회답을 주기로 한 것으로 이해하였다고 말하였다. 밸런타인 씨는 국무장관이 그렇게 말한 것이 아니며, 그가 한 말은 내일 몇 가지 사항을 더 그들과 함께 다룰 수 있는 처지가 되기를 바란다는 것이었다고 말하였다. 와카스기 씨는 국무장관이 내일 대사에게, 11월 7일과 11월 10일의 제안으로 수정된 9월 25일 일본 측 제안을 미국 정부가 수락할 것인지 아닌지, 아니면 우리가 그 가운데 몇 가지 점을 고치기를 바라는 것인지, 아니면 우리의 6월 21일 제안이 우리의 최종 제안인지에 관하여 흑백으로 분명한 회답을 줄 수 있기를 바란다고 말하였다. 그는 시간이 매우 급박하므로 일본 측은 자기들 제안에 대한 논평의 추가 교환을 피하고자 한다고 말하였다. 밸런타인 씨는, 귀측 제안의 취지에 관하여 우리가 더 명확한 설명을 필요로 한다면 어떻게 하겠느냐고 물었다. 그는 어제 국무장관이 통상 정책에 관한 일본 측 제안의 뒷부분이 무슨 뜻인지 이해하지 못하겠다고 말한 사실을 거론하였다. 와카스기 씨는, 일본 정부가 그 원칙이 전 세계에 적용될 것을 조건으로 중국에 적용되는 비차별에 동의하겠다고 말한 뜻은 그 원칙이 미국과 일본에 의하여 적용되리라는 것이었지 모든 나라에 의한 그 원칙들의 보편적 적용을 가리킨 것이 아니었다고 말하였다. 밸런타인 씨는 이것이야말로 분명하고 권위 있게 밝혀 두어야 할 매우 중요한 점이 아니냐고 물었다.\n\n와카스기 씨는 이어서, 우리 문서에는 모두 우리가 아직 비공식 예비적 토의 단계에 있다고 적혀 있으나, 일본 정부는 특히 11월 10일에 [731면] 대사가 훈령에 따라 대통령에게 성명을 정식으로 제시한 이후로는 우리가 이제 정식 교섭에 들어섰다고 여긴다고 말하였다. 밸런타인 씨는, 어제 국무장관이 다시 언급한 우리의 입장을 와카스기 씨가 충분히 알고 있지 않느냐고 말하였다 — 우리 회담이 중국 및 그 밖의 관계 정부들과 논의할 실질적인 무엇인가를 갖게 되는 단계에 이르면 우리는 그들과 이야기한 다음 일본 측에게 돌아올 것으로 생각하며, 그때에야 비로소 교섭의 단계에 이르리라는 것이 우리의 생각이라고 하였다. 와카스기 씨는 이러한 점들을 밸런타인 씨와 논쟁할 뜻은 없어 보였고, 다만 그것들을 국무장관에게 전달해 달라고 요청하였다.\n\nJ[oseph] W. B[allantine]", "secondary": "[Washington,] November 13, 1941.\n\nMr. Wakasugi called at his request. Mr. Wakasugi referred to the President’s statement to the Ambassador that the President would be glad to receive Mr. Kurusu and stated that the Embassy had received a telegram from Mr. Kurusu dispatched from Midway stating that he was arriving in Washington Saturday afternoon. [주54]\n\nMr. Wakasugi referred to his statement yesterday to the Secretary that there had been a misunderstanding on our part as to what Wakasugi had said to the Under Secretary on October 13 to which reference was made in the oral statement handed the Japanese Ambassador [730면] yesterday. He said that what he had said to Mr. Welles was: “There may be some unfortunate phraseology in the English translation of our instructions as we are not very sure of our English. If there are such phrases the wording might be adjusted.” He said that he had the September 25 document in mind and not the document of August 28 which was delivered while he was away in Japan. He said that the Japanese Embassy had referred the contents of that memorandum to the Japanese Government, deleting therefrom the last four lines on page 3 and the first sentence beginning on page 4 through the word “office” and the last two words in line 4 and all of line 5.\n\nThe Minister tried to impress upon Mr. Ballantine the pressing nature of the situation in Japan as the public is becoming impatient and almost desperate. The parliament is meeting Saturday and they hope for some concrete understanding with the United States at once. He said he understood yesterday that we were to give them an answer tomorrow. Mr. Ballantine said that the Secretary had not said this, that what he had said was that we hoped to be in a position to have ready to take up with them some further matters tomorrow. Mr. Wakasugi said he hoped that the Secretary could give the Ambassador tomorrow a clear-cut answer in black and white as to whether the United States Government will accept or not the Japanese proposal of September 25 as modified by their proposals of November 7 and November 10 or whether we want to have some points changed therein or whether our June 21 proposal is our final proposal. He said that time is so pressing that the Japanese wanted to avoid any further interchange of comments on their proposals. Mr. Ballantine said, what are we going to do if we need further clarification as to the intent of your proposals? He referred to the fact that the Secretary had said yesterday that he did not understand what was meant by the latter part of the Japanese proposal in regard to commercial policy. Mr. Wakasugi said that what the Japanese Government meant by saying that they would agree to non-discrimination as applied to China provided that it will be made applicable to all the world was that the principle would be applied by the United States and by Japan and did not refer to the universal application of those principles by all countries. Mr. Ballantine asked whether this was not a very important point to be brought out clearly and authoritatively.\n\nMr. Wakasugi then said that in all of our documents we had stated that we were still in a stage of informal exploratory discussions whereas the Japanese Government considered that we had now entered formal negotiations especially since, on November 10, the [731면] Ambassador had formally presented as under instruction a statement to the President. Mr. Ballantine said that Mr. Wakasugi was fully aware of our position as mentioned again by the Secretary yesterday, that we felt that when our talks had reached a stage where we had something of substance to discuss with China and the other governments concerned we expected to talk with them and then come back to the Japanese, and that then only would a stage of negotiations be reached. Mr. Wakasugi did not seem to be disposed to argue any of these points with Mr. Ballantine but simply asked that they be referred to the Secretary.\n\nJ[oseph] W. B[allantine]", "notes": ["[주54] 1941년 11월 15일."], "warn": false, "pages": ["0796", "0797"], "search": "와카스기(若杉要, Wakasugi) — 주미 일본공사 밸런타인(Joseph W. Ballantine) — 국무부 관리, 비망록 작성자 구루스(来栖三郎, Kurusu) — 특사 웰스(Sumner Welles) — 국무차관 헐(Cordell Hull) — 국무장관 루스벨트(Franklin D. Roosevelt) — 대통령 노무라(野村吉三郎, Nomura) — 주미 일본대사"}, {"id": "d393", "order": 393, "date": "1941-11-15", "group": "A", "eyebrow": "d393 · Memorandum of a Conversation", "title": "회담 비망록", "badge": null, "list_right": "문서 393", "meta": [{"k": "일자", "v": "1941-11-15"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/254013/25", "txt": true}, {"k": "발신", "v": "밸런타인(Joseph W. Ballantine) 기록", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 393 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d393"}], "summary": "국무장관 자택에서 노무라·와카스기가 헐을 만나, 통상 무차별 원칙에 관한 미국 측 초안을 받고 삼국동맹과 중국 주둔 문제에 대한 미국의 회답을 요구한 회담 기록.", "points": ["일본대사가 자신의 요청으로 약속을 잡아 국무장관 자택을 방문했다. 와카스기(若杉要, Wakasugi) 공사가 동행했다.", "헐은 11월 7일과 11월 10일 대사가 제시한 통상 정책에 관한 일본 측 제안을 언급하며 구두로 논평하고, 그 구두 성명과 함께 경제 정책에 관한 미일 공동선언 초안을 대사에게 건넸다.", "와카스기는 이것이 미해결로 남아 있던 국제 통상 관계에서의 무차별 문제에 대한 미국 측 회답이냐고 물었고, 헐은 그렇다고 답했다. 와카스기는 나머지 두 미해결 문제(삼국동맹과 일본군의 중국 주둔)에 대한 회답도 요구했다.", "「교섭인가 회담인가」의 다툼: 노무라는 일본 정부가 지금 하고 있는 것을 미국이 주장해 온 단순한 탐색적 회담(exploratory conversations)이 아니라 실제 교섭(actual negotiations)으로 본다고 했다. 헐은 영국·중국·네덜란드에 가서 양국의 태도가 교섭의 기초가 된다고 말할 수 있는 단계에 이르기까지는 탐색적 회담을 계속하는 바탕 위에서만 할 수 있다고 답했다. 그 나라들과 상의 없이 그들에 관한 사항을 일본과 교섭한다는 것을 그들이 신문에서 읽게 할 수는 없다는 것이다.", "헐은 회담이 태평양 전역을 포괄하는 해결에 관한 것이고 6월 21일 미국 초안이 이를 분명히 했음에도, 9월 25일 일본 측 제안은 무차별과 평화의 적용을 서남태평양 지역으로 좁혔다고 지적했다. 노무라가 태평양 전역의 평화는 초안 전문(前文)에서 다루어졌다고 하자, 헐은 전문이 아니라 본문에 적힌 것이 규율한다고 지적했다.", "헐은 11월 10일 그루와의 회담에서 일본 외상이 미국과의 협정 체결과 동시에 영국과도 협정을 맺기를 바란다고 하면서도 미국에는 즉각 회답을 요구하는 것은 일관되지 않다고 지적했다. 일본 정부가 와서 평화적 방침을 채택할 의향인지를 말해 주어야 한다고 했다.", "삼국동맹: 헐이 「일본 정부가 우리와 협정을 맺으면 그 동맹은 자동적으로 폐기되는가」라고 묻자, 와카스기는 삼국동맹의 폐기(denounce)를 요구하는 것이냐고 되물었다. 노무라는 헐의 말을 「사문화(a dead letter)된다는 뜻」으로 이해한다고 했다. 헐은 일본이 평화 계획에 나서면서 동시에 독일과의 전투 동맹을 유지하려 한다고 영국·네덜란드에 말하면 그들이 뭐라 하겠느냐고 되물었다.", "헐의 표현: 일본이 「지난 2천 년 동안 이 행성에 나타난 가장 노골적인 침략자」와 동맹으로 묶여 있는 한, 미국민과 모든 평화적 국민에게 일본이 평화의 길을 걷고 있다고 믿게 하기는 매우 어렵다고 했다. 노무라가 국무장관이 권하면 여론이 받아들일 것이라고 하자, 헐은 일본에 미국과 전쟁할 것을 요구할 수도 있는 대독 의무가 남아 있는 채로 협정을 맺으면 나라가 소란스러워져 자신이 린치를 당해도 이상하지 않을 것이라고 답했다.", "헐은 일소중립조약이 있음에도 만주의 대규모 일본군이 시베리아의 러시아군과 마주하고 있음을 지적하고, 일본이 「양쪽을 다 보려 한다」는 의심을 없앨 명확하고 모호하지 않은 협정을 원한다고 했다.", "「최후통첩」이라는 낱말이 여기서 미국 쪽 입에서 나온다: 헐은 일본의 새 정부가 자기들 요점에 즉각 회답하라는 태도를 취하는 듯하나, 미국이 시종 평화적 방침을 취해 왔고 법과 질서를 침해해 온 쪽은 일본 정부인 상황에서 「일본 정부로부터 그런 성격의 최후통첩(ultimatums)을 받아야 한다고는 느끼지 않는다」고 말했다.", "헐은 결론으로, 이틀 전 제기한 평화적 의도에 관한 요점들에 대한 일본 정부의 입장을 듣고, 오늘 제안대로 무차별 문제와 삼국동맹 문제를 정리할 수 있게 되면 「형제처럼 마주 앉아」 중국 주둔 문제의 해결에 이를 수 있으리라 믿는다고 말하면서, 동시에 지연을 바라지 않으며 전적으로 만족스럽고 광범한 해결을 이루려 힘껏 노력하고 있음을 강조했다."], "primary": "[워싱턴,] 1941년 11월 15일.\n\n일본대사가 자신의 요청으로 잡은 약속에 따라 국무장관의 자택을 방문하였다.[주55] 국무장관은 11월 7일과 11월 10일에 대사가 제시하였던 통상 정책에 관한 일본 측 제안을 언급하고, 그때 경제 정책에 관한 미일 공동선언의 초안과 함께 대사에게 건넨 구두 성명의 취지에 따라 구두로 논평하였다.[주56] 국무장관은 그 초안에 상정된 것과 같은 계획에 일본이 참여하는 것이 일본에게 유리하고 값어치 있는 성격의 일임을 강조하였다. 일본대사는 그 문제에 관하여는 자신이 논평할 수 없으며 본국 정부에 회부하겠다고 말하였다. 일본공사는 이 제안이 우리의 회담에서 미해결로 남아 있던 국제 통상 관계에서의 무차별 문제에 관한 일본 정부에 대한 우리의 회답을 이루는 것이냐고 물었다. 국무장관은 그렇다고 답하였다. 이어 일본공사는, 일본 정부가 나머지 두 미해결 문제, 즉 삼국동맹(the Tripartite Pact)에 대한 일본의 관계 문제와 일본군의 중국 주둔 문제에 관한 우리의 회답을 바라고 있다고 말하였다. 이어 대사는, 미국 정부가 주장하여 온 바와 같은 단순한 탐색적 회담이 아니라 우리가 지금 실제의 교섭에 종사하고 있다고 일본 정부는 여기고 있다는 점도 제기하고 싶다고 진술하였다. 국무장관은 일본공사에게 자신이 이제부터 말하려는 바를 정확히 적어 두라고 청한 뒤, 만일 우리가 태평양 지역에서 평화적 해결을 마련해 내려 한다면 자신은 다만 [732면] 탐색적 회담을 계속하는 바탕 위에서만 그리할 수 있다고, 즉 자신이 영국과 중국과 네덜란드 측에 가서 일본과 미국의 태도가 교섭의 기초를 제공할 만한 것이라고 믿는다고 말할 수 있는 단계에 이르기까지는 그러하며, 그 뒤에 일어나는 일을 우리는 교섭이라고 부를 수 있으리라고 답하였다. 그는 또한 우리가 사태를 만족스러운 기초 위에 올려놓기 전에는 자신이 그 다른 나라들과 협력하는 것은 불가능하다고 말하였다. 그러하지 아니하면 그들은 자신들과 상의도 없이 자신들에게 영향을 미치는 사항에 관하여 국무장관이 일본과 교섭하고 있다는 것을 신문에서 읽게 될지도 모른다는 것이었다. 대사는 아무런 논평도 하지 아니하였다.\n\n국무장관은 이어, 국무장관과 대사 사이의 회담이 태평양 전역을 포괄하는 해결에 관계되어 왔고 6월 21일자 우리의 초안이 이 점을 분명히 하였음에도 불구하고, 9월 25일자 일본 측 제안은 무차별과 평화의 적용을 서남태평양 지역으로 좁혔다는 점을 지적하였다. 대사는 태평양 전역에서의 평화 문제가 자기들 초안의 전문(前文)에서 다루어져 있다고 답하였으나, 국무장관은 전문에 적힌 것이 아니라 문서의 본문에 적힌 것이 규율한다는 점을 지적하였다. 국무장관은 이 점에 관한 일본 정부의 태도를 알고 싶다고 덧붙였다.\n\n이어 국무장관은, 일본 외상이 11월 10일 그루(Joseph Grew) 대사와의 회담에서 일본 정부가 이 나라와 협정을 체결하는 것과 동시에 영국과도 협정을 체결하기를 바란다는 뜻을 내비쳤음에도, 일본 정부는 우리가 일본 정부의 제안에 즉각 회답하기를 기대하고 있다고 말하였다. 그는 일본대사가 이곳에서 수행하도록 요구받고 있는 훈령과 외상이 영국과 관련하여 염두에 두고 있는 바 사이에 어느 정도 모순이 있다고 시사하였다. 이어 국무장관은, 대사는 일본이 지금 회답을 원한다고 말하지만 자신으로서는 일본 정부가 와서 평화적 방침을 채택할 의향인지 아닌지를 우리에게 말해 주어야 마땅하다고 느낀다고 논평하였다. 대사는 태평양에서 평화를 갖고자 하는 일본 정부의 희망에는 의심의 여지가 없으며, 일본에는 결정의 자유가 있고 그 동맹 아래에서의 자국 의무에 관하여는 스스로 해석을 내리게 되리라고 말하였다.\n\n국무장관은 만일 일본 정부가 우리와 협정을 체결한다면 그 동맹은 자동적으로 폐기되는 것이냐고 물었다. 와카스기 씨는 우리가 삼국동맹을 폐기(denounce)할 것을 요구하고 있는 것이냐고 물었다. 대사는 국무장관이 말한 바를 사문(死文, a dead letter)이 된다는 의미에서 폐기된다는 뜻으로 이해한다고 말하였다. 국무장관은, 바로 대사가 시사한 바와 같이 만일 일본 [733면] 정부가 우리와 협정을 체결한다면 삼국동맹이 자동적으로 사문이 되리라고 우리가 상정하여도 좋겠느냐고 되받았다. 왜냐하면 자신이 영국 측과 네덜란드 측에 가서 일본이 평화적 계획에 나설 용의가 있으나 동시에 독일과의 전투 동맹을 고수하기를 바라고 있다고 말한다고 가정하면, 영국 측과 네덜란드 측은 무어라 하겠는가 하는 것이었다. 그는 일본이 독일과의 군사 동맹을 손상 없이 고수한다고 공언하고 있는 마당에 자신이 어떻게 영국 측으로 하여금 일본의 평화적 의도를 믿게 할 수 있겠느냐고 물었다. 그는, 지난 2천 년 동안 이 행성에 나타난 가장 노골적인 침략자와 일본이 동맹으로 묶여 있는 한, 일본이 평화적 방침을 추구하고 있다고 이 나라 국민과 모든 평화적 국가의 국민에게 믿게 하는 일이 자신에게는 매우 어려우리라는 점을 지적하였다. 대사는 대중이 국무장관을 매우 신뢰하고 있으므로 국무장관이 권고한다면 그들은 우리와의 협정을 받아들일 것이라고 논평하였다. 국무장관은, 만일 일본에게 일본으로 하여금 우리와 전쟁하도록 요구할 수도 있는 대독 의무가 남아 있는 상태에서 우리가 일본과 협정에 들어간다면 이는 이 나라에 매우 큰 소란을 일으킬 것이므로 자신이 린치를 당한다 하여도 이상할 것이 없다고 답하였다. 국무장관은 일본과 러시아 사이에 중립조약이 존재함에도 불구하고 만주의 대규모 일본군이 시베리아의 러시아군과 대치하고 있다는 점을 지적하였다. 국무장관은, 우리가 염두에 두고 있는 것은 상호 신뢰를 증진하고 우리로 하여금 군비 확장에서 벗어날 수 있게 할 협정이라고 말하였으며, 자신이 바라는 바는 일본이 양쪽을 다 향하려 하고 있다는 의심을 없애 줄, 명확하고 모호하지 아니한 협정이어서 그로써 우리가 태평양 지역 국가들 사이의 불신을 없앨 수 있게 되는 것이라고 말하였다. 국무장관은, 미국이 자위(自衛)를 통하여 부득이 독일에 대하여 무기를 들게 되는 경우에 삼국동맹 아래에서의 자국 의무에 관하여 일본이 스스로 해석을 내리겠다고 고집하는 한, 평화적 방침을 채택하는 것이 일본의 분명한 의도임을 세계가 알아보기란 매우 어려우리라고 말하였다. 국무장관은, 우리와 협정이 이루어질 때 삼국동맹과 일본의 연계가 자동적으로 사라지는 것인지를 알고 싶다고 말하였다.\n\n일본공사는 국무장관에게, 그가 말한 바가 삼국동맹에 대한 일본의 관계 문제에 관한 이 정부의 회답이냐고 물었다. 국무장관은, 우리가 일본과 협정에 들어가는 경우 삼국동맹이 자동적으로 사문이 되는가 하는 자신이 제기한 점에 대한 일본 정부의 태도에 관하여 일본 정부로부터 회답을 얻게 되면 우리가 더 잘 답할 수 있으리라고 답하였다. 일본대사는, 총리가 군인이라는 사실에도 불구하고 현 일본 정부와 이전 일본 정부의 정책 사이에 실질적인 차이가 없음에도 [734면] 미국 정부가 일본 정부를 신뢰하지 아니하는 것이 아닌가 우려된다고 말하였다. 국무장관은, 일본의 새 정부는 우리가 자기들의 요점에 즉각 회답하여야 한다는 태도를 취하는 듯이 보이나, 미국이 시종 평화적 방침을 추구하여 왔고 법과 질서를 침해하여 온 것은 일본 정부인 그러한 사정 아래에서 우리가 일본 정부로부터 그러한 성격의 최후통첩(ultimatums)을 받아야 한다고는 느끼지 아니한다고 답하였다. 국무장관은 결론으로, 이틀 전 우리가 그들에게 제기한 그들의 평화적 의도에 관한 요점들에 대한 일본 정부의 입장을 우리가 듣게 되고, 또 오늘 우리의 제안에서 시사한 대로 무차별 문제를, 그리고 아울러 삼국동맹에 관한 문제를 우리가 정리할 수 있게 될 때에는, 우리가 형제처럼 마주 앉아 일본군의 중국 주둔 문제에 관한 어떤 해결에 이를 수 있으리라 믿는다고 말하였다. 국무장관은 동시에, 우리가 어떠한 지연도 바라지 아니하며 전적으로 만족스럽고 광범한 해결을 이루어 내기 위하여 우리가 할 수 있는 한 힘껏 노력하고 있음을 강조하였다.\n\nJ[oseph] W. B[allantine]", "secondary": "[Washington,] November 15, 1941.\n\nThe Japanese Ambassador called by appointment made at his request at the Secretary’s apartment. [주55] The Secretary referred to the Japanese proposal in regard to commercial policy which the Ambassador had presented on November 7 and November 10 and offered oral comment along the line of the oral statement which, together with the draft of a joint United States-Japanese declaration on economic policy, he then handed to the Ambassador. [주56] The Secretary emphasized the advantageous and worthwhile character to Japan of participation by Japan in a program such as that envisaged in the draft. The Japanese Ambassador said that he could not comment upon that matter but that he would refer it to his Government. The Japanese Minister asked whether this proposal constituted our answer to the Japanese Government on the question of non-discrimination in international commercial relations which had been outstanding in our conversations. The Secretary replied in the affirmative. The Japanese Minister then said that the Japanese Government desired our reply on the two other outstanding questions, namely, the question of Japan’s relations with the Tripartite Pact and the question of the stationing of Japanese troops in China. The Ambassador then stated that he also wanted to bring up the point that the Japanese Government considered that we were now engaged in actual negotiations and not in merely exploratory conversations as the American Government had contended. The Secretary, after asking the Japanese Minister to make accurate note of what the Secretary was about to say, replied that if we are to work out a peaceful settlement in the Pacific area he could do this only on the basis of carrying on [732면] exploratory conversations until we reached a stage when he could go to Great Britain, to China and to the Dutch and say to them that he believes that the attitudes of Japan and the United States are such as to afford a basis for negotiation and that we could call what took place thereafter a negotiation. He said also that it would be impossible for him to collaborate with those other countries until we had got things on a satisfactory basis; that otherwise they might read in the newspapers that he was negotiating with Japan on matters affecting them without their being consulted. The Ambassador made no comment.\n\nThe Secretary went on to point out that notwithstanding the fact that the conversations between the Secretary and the Ambassador had related to a settlement covering the entire Pacific area and our draft of June 21 had made this clear, the Japanese proposals of September 25 narrowed the application of nondiscrimination and of peace to the southwestern Pacific area. The Ambassador replied that the question of peace in the entire Pacific area was covered in the preamble of their draft, but the Secretary pointed out that what was said in the body of the document rather than in the preamble governed. The Secretary added that he would like to know the attitude of the Japanese Government on this point.\n\nThe Secretary then said that the Japanese Foreign Minister in his conversation with Ambassador Grew on November 10 had indicated that the Japanese Government desired to conclude an agreement with the British simultaneously with concluding an agreement with this country, and yet the Japanese Government expected us to answer at once the Japanese Government’s proposals. He suggested that there was some inconsistency between the instructions which the Japanese Ambassador was being asked to carry out here and what the Foreign Minister had in mind in regard to the British. The Secretary then commented that the Ambassador said that Japan wants an answer now, but that the Secretary felt that the Japanese Government ought to come and tell us whether it intends to adopt peaceful courses. The Ambassador said that there was no doubt about the desire of the Japanese Government to have peace in the Pacific and that Japan had freedom of decision and would make its own interpretation of its obligations under the alliance.\n\nThe Secretary asked whether if the Japanese Government should enter into agreement with us the alliance would be automatically abandoned. Mr. Wakasugi inquired whether we were asking that the Tripartite Pact be denounced. The Ambassador said that he understood what the Secretary had said to mean abandoned in the sense of becoming a dead letter. The Secretary rejoined that, just as the Ambassador had suggested, could we assume that if the Japanese [733면] Government entered into an agreement with us the Tripartite Pact would automatically become a dead letter, for supposing that he went to the British and the Dutch and said that Japan was willing to enter on a peaceful program but at the same time desired to adhere to a fighting alliance with Germany, what would the British and Dutch say? He asked how he could make the British believe in Japan’s peaceful intentions while Japan was proclaiming its adherence intact to a military alliance with Germany. He pointed out that it would be very difficult for him to make the people of this country and the people of all peaceful nations believe that Japan was pursuing a peaceful course so long as Japan was tied in an alliance with the most flagrant aggressor who has appeared on this planet in the last 2,000 years. The Ambassador commented that the public had so much confidence in the Secretary that they would accept the agreement with us if the Secretary recommended it. The Secretary replied that if we went into an agreement with Japan while Japan had an outstanding obligation to Germany which might call upon Japan to go to war with us this would cause so much turmoil in the country that he might well be lynched. The Secretary pointed out that, notwithstanding the existence of a neutrality pact between Japan and Russia, large Japanese armies in Manchuria were facing Russian armies in Siberia. The Secretary said that what we had in mind was an agreement which would promote mutual trust and enable us to get away from the expansion of military preparations, and what he desired was a clear-cut unequivocal agreement which would remove the doubts that Japan was trying to face two ways in order that we could remove distrust between nations in the Pacific area. The Secretary said that, so long as Japan insisted that it would make its own interpretation of its obligations under the Tripartite Pact in the event that the United States through self-defense was obliged to take up arms against Germany, it would be very difficult for the world to see that Japan’s clear intention was to adopt peaceful courses. The Secretary said he would like to know whether, when an agreement is reached with us, Japan’s connection with the Tripartite Pact would automatically disappear.\n\nThe Japanese Minister asked the Secretary whether what he had said was the
