ment. He said he realized fully that any new Cabinet that came in might determine Japan’s obligations in a manner different from that in which the present Japanese Cabinet would determine its obligations, but that as a matter of practical fact the present Japanese Cabinet was the only Cabinet which could be set up which would desire to maintain peace with the United States should the United States go to war. I said that on this point I felt that the position of this Government had already been made fully clear by the Secretary of [685면] State and that I would have to refer this question to the Secretary of State to determine whether any further clarification was necessary.\n\nThe Minister then brought up the question of evacuation of Japanese troops from China. He said that the Japanese Government was willing to evacuate all of its troops from China. (Thinking I had misunderstood him I asked him to repeat this statement which he did, in the same terms, twice.) He said, however, that it was impossible for the Japanese Government after four years of military operations in China to undertake to withdraw its entire troops from China within twenty-four hours. I said that of course nobody expected miracles in this modern age. I said with regard to this question that here again the views of this Government had been made known very clearly to the Japanese Government and that the Secretary of State had frequently referred to our own experience and to our own policies in the Western Hemisphere as an indication of what we believed the policy which would bring about peace and stability in the Pacific region should be. The Minister then asked whether, in the event that the President of the United States agreed to mediate between Japan and China, this Government would insist on passing upon the peace terms proposed by Japan before they were submitted to China. I said that once more in this case our views had been made known very clearly and that I was not in a position to give him any more specific opinion on this point without consulting the Secretary of State. I said that in general, as I had frequently explained, the point of view of this Government was that should this Government undertake the task of mediating, it could not undertake to transmit to the Chinese Government peace terms which in its judgment were inequitable and not conducive to the maintenance of a stable peace in the Pacific region.\n\nThe Minister then asked whether, if it were possible to reach a basis for an understanding with regard to all of the other major principles which this Government regarded as fundamental, the two Governments could not go ahead and leave the China question in abeyance. I said it seemed to me that this question was very much like asking whether the play of “Hamlet” could be given on the stage without the character of Hamlet. The Minister laughed loudly and said he fully understood my point.\n\nThe Minister said that he would make every effort to expedite a clarification of the point of view of his Government. He said he believed that the underlying principles as set forth by this Government on June 21 could be accepted by the Japanese Government. He said there was nothing he himself desired more earnestly than the reaching of a satisfactory agreement between the two countries. I said that I fully corresponded to his expressed desire [686면] in that regard. He said he believed that within twenty-four or forty-eight hours his Government must reach a final decision on the basic questions involved. He emphasized the fact that he was speaking unofficially. Before he left he said that he wished me to know that all of the controlling Generals in the Japanese Army and all of the controlling Admirals in the Japanese Navy were supporting fully the position of the Japanese Government in desiring to conclude a comprehensive and satisfactory agreement with the United States. He said this Government should be in no doubt that if an agreement could be reached before it was too late the control of the Army and of the Navy under present conditions was such as to make it sure that the Government would be able to carry out and implement the terms of such agreement.\n\nS[umner] W[elles]", "notes": [], "warn": false, "pages": ["0747", "0748", "0749", "0750", "0751", "0752"], "search": "웰스(Sumner Welles) — 미국 국무차관. 이 각서의 작성자이며 본문의 「나」다 와카스기(若杉要, Wakasugi) — 주미 일본대사관 공사참사관. 본문에는 「공사(the Minister)」로도 적혀 있다 다카마쓰노미야(高松宮宣仁, Prince Takamatsu) — 천황의 아우 히가시쿠니노미야(東久邇宮稔彦王, Prince Higashi Kuni) — 황족 기도(木戸幸一, Marquis Kido) — 내대신(內大臣) 고노에(近衞文麿, Konoye) — 일본 총리 히로히토(Hirohito) — 천황. 원문에는 「천황(the Emperor)」으로만 적혀 있다 도요다(豊田貞次郎, Toyoda) — 일본 외상. 원문에는 「외상」으로만 적혀 있다 헐(Cordell Hull) — 미국 국무장관. 원문에는 「국무장관」으로만 적혀 있다 노무라(野村吉三郎, Nomura) — 주미 일본대사. 원문에는 「일본대사」로만 적혀 있다 루스벨트(Franklin D. Roosevelt) — 미국 대통령. 원문에는 「미국 대통령」으로만 적혀 있다 스탈린(Joseph Stalin) — 소련 지도자. 원문에 「the Stalin government」로 나온다"}, {"id": "d371", "order": 371, "date": "1941-10-15", "group": "A", "eyebrow": "d371 · Memorandum by the Ambassador in Japan (Grew)", "title": "주일대사(그루)의 비망록", "badge": null, "list_right": "문서 371", "meta": [{"k": "일자", "v": "1941-10-15"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2624", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 371 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d371"}], "summary": "그루 대사가 아마우 외무차관과 오프더레코드로 오찬을 함께하며, 독일이 삼국동맹의 마쓰오카식 해석을 확인하는 성명을 일본에 강하게 요구하고 있다는 말을 듣는다.", "points": ["그루 대사가 외무차관과 단둘이 오찬을 하며 두 시간 반 동안 이야기했고, 차관은 이를 오프더레코드로 취급해 달라고 요청했다.", "대화는 웰스 국무차관과 와카스기의 10월 13일 회담 및 그간의 도쿄·워싱턴 회담과 대체로 같은 선에서, 워싱턴에서 진행 중인 예비 회담의 현황을 다루었다.", "유일하게 중요한 대목은 아마우의 언급이었다. 독일 정부가 삼국동맹에 대한 마쓰오카의 해석을 확인하는 성명을 내라고 일본 정부에 집요하게 압박하고 있다는 것이다.", "그 해석이란, 독일과 미국 사이에 전쟁이 일어나면 일본이 미국에 선전포고한다는 것이다.", "일본 정부는 회답을 할지 언제 할지도 아직 정하지 않았으나, 삼국동맹은 태평양의 평화 유지를 상정하고 있으며 조약상 일본의 의무를 진지하게 고려해 달라고 미국 정부의 주의를 환기해 왔다는 식의, 확답을 피하는 문안을 검토 중이다."], "primary": "[도쿄,] 1941년 10월 15일.\n\n오늘 나는 외무차관과 단둘이 오찬에 초대받았고, 우리는 두 시간 반 동안 긴 이야기를 나누었는데 그는 이를 오프더레코드로 취급해 주기를 요청했다. 우리는 웰스 국무차관이 10월 13일 와카스기(若杉要, Wakasugi) 씨와 나눈 회담(국무부 전보 제661호, 10월 14일 오후 10시 [주32])및 그에 앞선 도쿄와 워싱턴에서의 회담들과 대체로 같은 선을 따라, 현재 워싱턴에서 진행되고 있는 예비 회담의 현황을 논의하였다.\n\n오늘 차관과의 면담에서 드러난 유일하게 중요한 점은 아마우(天羽英二, Amau) 씨의 다음과 같은 언급이었다. 즉 독일 정부가, 마쓰오카(松岡洋右, Matsuoka) 씨가 삼국동맹에 부여한 해석 — 독일과 미국 사이에 전쟁이 일어날 경우 일본은 미국에 선전포고한다는 취지의 해석 — 을 확인하는 성명을 일본 정부가 발표하도록 집요하게 압박하고 있다는 것이다. 그에 대한 회답으로서, 그러한 회답을 독일 정부에 언제 할 것인지 또는 할 것인지 자체가 아직 결정되지 않았으나, 일본 정부는 태평양의 평화 유지가 삼국동맹에서 상정되어 있으며 조약상 일본의 의무를 진지하게 고려해 줄 것을 미국 정부에 환기하여 왔다는 취지의, 확답을 피하는 성격의 문안을 검토하고 있다.\n\nJ[oseph] C. G[rew]\n\n[687면]", "secondary": "[Tokyo,] October 15, 1941.\n\nI was invited to lunch alone with the Vice Minister for Foreign Affairs today and we had a long talk together for two hours and a half which he requested should be regarded as off the record. We discussed, along lines largely parallel to the Under Secretary’s conversation on October 13 with Mr. Wakasugi (Department’s telegram 661, October 14, 10 p.m. [주32] ) and previous conversations in Tokyo and Washington, the present status of the exploratory conversations now progressing in Washington.\n\nDuring my meeting with the Vice Minister today the only point of importance which emerged was the observation of Mr. Amau that the German Government is insistently pressing for the issuance of a statement by the Japanese Government in confirmation of the interpretation given to the Tripartite Pact by Mr. Matsuoka, to the effect that Japan will declare war on the United States in the event of war occurring between Germany and the United States. As a reply, although it has not yet been decided when or whether such reply will be rendered to the German Government, the Japanese Government is considering a formula of a noncommittal nature to the effect that maintenance of peace in the Pacific is envisaged in the Tripartite Pact and that the attention of the American Government has been sought for its earnest consideration of Japan’s obligations under the Pact.\n\nJ[oseph] C. G[rew]\n\n[687면]", "notes": ["[주32] 수록하지 않음. 바로 앞의 1941년 10월 13일 국무차관 비망록을 보라."], "warn": false, "pages": ["0753"], "search": "그루(Joseph C. Grew) — 주일 미국대사, 비망록 작성자 아마우(天羽英二, Amau) — 외무차관 웰스(Sumner Welles) — 국무차관 와카스기(若杉要, Wakasugi) — 주미 일본공사 마쓰오카(松岡洋右, Matsuoka) — 전 외상"}, {"id": "d372", "order": 372, "date": "1941-10-16", "group": "C", "eyebrow": "d372 · Memorandum by the Secretary of State", "title": "국무장관 각서", "badge": null, "list_right": "문서 372", "meta": [{"k": "일자", "v": "1941-10-16"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2393", "txt": true}, {"k": "발신", "v": "국무장관(the Secretary of State) — 헐(Cordell Hull)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 372 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d372"}], "summary": "10월 16·17일 이틀에 걸친 와카스기 공사와의 회담을 헐이 스스로 적은 각서로, 세 쟁점(중국 철병·무차별 통상 정책·삼국동맹)에서 일본이 오히려 태도를 좁히고 있다고 판단한다.", "points": ["일본 공사 와카스기가 10월 16일과 17일 약속에 따라 국무차관을 방문했고, 미리 정한 대로 웰스가 그를 헐의 방으로 데려와 매번 두 시간가량 회담했다.", "6월 21일 미국 문서와 10월 2일 그 부연은 모두 비공식으로 일본대사에게 건네졌으며, 교섭 단계에 이른 것이 아니라 탐색적 구두 회담을 글로 옮긴 것이라는 명확한 양해가 있었다.", "세 가지 주된 이견(중국에서의 철병, 태평양 전역에 대한 무차별 통상 정책의 적용, 미일 관계와 관련한 삼국동맹에 대한 일본 태도의 추가 해명)에서 공사가 다소 얼버무리고 있음이 분명했다고 헐은 적는다.", "헐은 평화적 해결이 태평양의 일부가 아니라 전역에 적용되어야 한다고 강조했다.", "헐은 고노에 총리가 대통령에게 회담을 요청한 서한 이후 일본 측 발언이 문면과 정신 양쪽에서 좁아지고 있다고 지적한다. 해결 대상 지역의 범위, 무차별 원칙의 폭, 삼국동맹의 대미 적용 해석, 중국 철병 논의의 폭, 그리고 정복 반대 약속을 남북 방면으로만 한정한 점이다.", "공사는 삼국동맹이 평화의 문서라고 주장했으나, 헐은 그것이 여러 달 동안 주로 미국을 독일과의 전쟁 밖에 붙들어 두려는 것으로 공표되었고 그 목적을 위한 일독 공동 행동이었음을 상기시키며, 일본 스스로 그 매우 비우호적인 함의를 씻어 낼 말과 행동을 해야 한다고 했다.", "중국 주둔의 필요를 논한 공사에게, 헐은 일본의 침공이 중국에서 수많은 독점과 특권을 낳았고 그것이 주둔을 바라는 주된 이유일 것이라 지적하며, 군대를 두고서는 결코 중국의 우의를 되찾을 수 없다고 말했다.", "통상 정책에서는 아르헨티나와의 최근 통상협정과 영국·영자치령과 진행 중인 제국 특혜 철폐 논의를 들었고, 공사는 마침내 반대하는 것이 아니라며 본국 정부가 이 폭넓은 제안을 받아들일지 곧 타전해 보겠다고 말했다.", "탐색적 회담의 결말은, 이곳 대표들과 더 진지한 회담을 하기 전에 새 일본 정부가 먼저 말해야 한다는 것이었다.", "일본이 인도차이나 진주 때 회담이 일시 중단되었을 당시의 입장 근처로 돌아올 조짐은 현재 전혀 없다는 명확한 인상을 받았으며, 앞으로의 회담에 큰 기대를 걸지 않으나 하고 싶은 말을 할 기회는 충분히 주겠다고 맺는다."], "primary": "[워싱턴,] 1941년 10월 16일 및 17일.\n\n일본 공사 와카스기(若杉要, Wakasugi) 씨가 10월 16일과 17일 약속에 따라 국무차관을 방문했다. 미리 정해 둔 바에 따라 웰스(Sumner Welles) 씨가 그를 본직의 방으로 데려왔고, 회담은 매번 두 시간가량 이어졌다. 회담은 주로 본직이 때때로 노무라(野村吉三郎, Nomura) 대사와 가져 온 회담을 되풀이한 것이었다. 각기 자기 정부를 대표하여 대사와 본직 사이에 교환된 두 문서의 어떤 국면들에 관하여 여기저기 부연이 있었다. 6월 21일 자 우리 문서와 10월 2일 자 그 부연은 둘 다 비공식적인 방식으로 일본대사에게 건네졌으며, 교섭의 어떤 단계에도 이르지 않았다는 것, 그리고 이것들은 실은 탐색적인 구두 회담을 글로 옮겨 놓은 것이라는 명확한 양해가 있었다. 공사는 본국 정부로부터 온 보다 최근의 통보들, 특히 9월에 접수된 것들과, 총리가 미일 관계를 논의하기 위한 양자 회담을 요청하는 개인 서한을 대통령에게 보냈을 때 이 정부에 보내진 통보를 언급했다.\n\n공사는 며칠 전 웰스 국무차관과 나눈 이야기와 어긋나지 않으려 애썼으나, 이러한 국면들에 관하여, 특히 세 가지 주된 이견 — 중국에서 군대를 철수시키는 문제, 태평양 전역에 무차별 통상 정책을 적용하는 문제, 그리고 삼국동맹이 일본과 미국의 관계에 관련될 수 있는 한에서 그에 대한 일본의 태도를 더 분명히 하는 문제 — 에 관하여 그가 다소간 얼버무리고 있음이 분명했다.\n\n본직은, 평등과 무차별의 원칙에 기초한 미국의 통상 정책이 전 세계에 적용되는 것과 꼭 같이, 또 이와 비슷한 언명들이 일본을 포함하여 전 세계에 똑같이 적용되는 것과 꼭 같이, 제안된 평화적 해결도 태평양의 일부가 아니라 그 전역에 적용되어야 한다고 강조했다. 이어 본직은, 총리가 회담을 요청하며 대통령에게 보낸 서한에 딸린 통보 당시 및 그 이후 일본 측이 우리에게 한 발언들 가운데 여러 대목을 언급했다. 그 대목들에서 일본 측은, 3월부터 7월까지 노무라 대사가 본직에게 분명하게 표명했던 태도를 문면에서나 정신에서나 좁히고 있었다. 이렇게 좁아지는 태도는 해결에 포함될 태평양 지역의 범위, 무차별 원칙에 기초한 통상 정책을 규정하는 방식의 범위와 폭, [688면] 삼국동맹이 미국에 관계되는 한에서 그 적용에 대한 그들의 해석, 중국에서 군대를 철수시키는 문제에 관한 노무라 대사의 수많은 회담이 지녔던 폭과 정신과 함의, 그리고 태평양 전역에 관한 만족스러운 평화적 해결을 위한 원칙과 계획에 대한 폭넓고 기본적인 약속 대신 정복에 반대하는 일본의 약속을 북방과 남방으로만 한정하는 것과 관련된 것이었다.\n\n앞의 사항들과 그 적용에 관하여 공사가 여러 차례 시도한 해석의 결과는 진전을 보여 주지 않았다 — 적어도, 일본의 인도차이나 점령으로 우리 회담이 중단되기 전에 노무라 대사가 밝힌 이 문제들에 관한 태도와 견주어 볼 때 진전이라 할 것은 분명 없었다.\n\n공사는 삼국동맹이 우리에게 미칠 수 있는 영향에 관하여, 그것이 평화의 문서라고 역설하고 따라서 그것이 우리를 겨냥한 것이 아니라고 아주 슬며시 내비치면서, 만족스럽지 못한 해석을 시도하는 데 많은 시간을 들였다. 본직은 그에게, 여러 달 동안 그것이 주로 이 나라를 독일과의 전쟁 밖에 붙들어 두려는 것으로 공표되었으며 그 목적을 위한 일본과 독일 쪽의 공동 행동이었음을 상기시켰다. 그러므로 그것이 무해한 문서라고 이 나라를 납득시키는 일은 우리에게 결코 쉬운 일이 아니며, 삼국동맹의 매우 비우호적인 함의를 이 나라 여론의 머릿속에서 씻어 내는 데 필요한 말과 행동은 일본 스스로 해야 한다고 말했다. 공사가 그것에 다른 해석을 붙이려 애써 노력했음에도 문제는 거기서 멈추었다.\n\n공사는 일본군이 중국에 계속 주둔해야 할 필요성을 보이려고 한동안 애썼다. 본직은, 일본이 군대를 빼내고 이런저런 방식으로 얼마간의 일시적 손실을 감수한 뒤, 미국의 평화적 해결 제안의 밑바탕에 놓인 우호적 국제관계의 폭넓은 원칙 아래 두 나라 사이의 우의와 통상을 회복하는 일에 착수하는 것이 일본에 얼마나 큰 이익이 될지를 보여 주는 많은 사실과 사정을 제시했다. 본직은 공사에게, 일본의 침공이 중국에서 수많은 독점과 여러 방식의 수많은 특권 및 이익을 세워 놓는 결과를 낳았고 아마도 그것이 중국에 군대를 두려는 일본의 주된 욕구를 설명해 줄 것이라는 점, 일본이 그곳에 군대를 두고 있는 한 결코 중국의 우의를 되찾을 수 없다는 점, 중국 사태의 해결은 필연적으로 태평양 전역의 평화적 해결을 위하여 이 정부가 제시한 방식과 맞물린다는 점, 그리고 그러한 폭넓은 해결이라면 어떠한 것이든 중국이라는 국면이 그 안에 포함되어야 한다는 점을 상기시켰다. 우리는 중국에서 군대를 빼내는 문제와 중국 사태 전반에 관하여 노무라 대사와 본직 사이에 논의되었던 여러 국면을 다시 짚어 보았다.\n\n[689면]\n\n이 정부가 지지하며 다른 모든 나라와 함께 일본에도 제안해 온 것과 같은 폭넓고 기본적인 자유주의적 통상 정책의 문제에 관하여, 공사와 본직은 찬반 양쪽의 수많은 국면을 논의했으나 특별히 새로운 것이 나오지는 않았다. 다만 본직은 아르헨티나와 맺은 우리의 최근 통상협정[주32a] — 일본과 다른 모든 나라에 그곳 시장에 대하여 우리 자신과 동등한 접근을 부여하는 협정 — 을 들고, 또한 제국 특혜와 쌍무 무역이라는 좁은 정책을 비롯한 그 밖의 차별을 철폐하는 문제에 관하여 이 정부가 영국 및 영자치령들과 갖고 있는 수많은 논의를 들어, 태평양 지역의 어떠한 해결에든 그러한 조항이 포함되기를 이 정부가 간절히 바라고 있음을 강조했다. 그리고 일본이야말로 거의 어느 나라보다도 이 길에 더 큰 이해관계를 갖고 있음에도 태평양에서 무차별 정책의 적용에 반대하고 있다고 강력히 지적했다. 공사는 마침내 자신은 반대하는 것이 아니라고 말하고, 본국 정부가 이 폭넓은 제안을 받아들이지 않겠는지 알아보기 위하여 곧바로 연락하겠다고 했다. 본직은 그것이 좋겠다고 말하고, 본국 정부에서 소식이 오면 알려 달라고 청했다. 우리 탐색적 회담의 결말로 우리가 갖게 된 견해는, 이곳의 일본 대표들과 더 진지한 회담을 갖기 전에 새 일본 정부[주33]가 다음 차례로 말을 해야 하리라는 것이었다. 우리는 또한, 일본이 인도차이나로 들어갔을 때 우리 탐색적 회담이 일시 중단되었던 당시 일본 정부가 차지하고 있던 입장의 근처 어디로든 그들이 돌아올 조짐이 현재로서는 전혀 없다는 명확한 인상을 받았다. 앞으로의 회담에 관한 한 우리는 이 방면에 그리 기대를 걸고 있지 않으나, 그들이 말하고자 하는 바가 무엇이든 그것을 말할 충분한 기회는 주고자 한다.\n\nC[ordell] H[ull]", "secondary": "[Washington,] October 16 and 17, 1941.\n\nMr. Wakasugi, Japanese Minister, called by appointment on October sixteenth and seventeenth on the Under Secretary. By prearrangement, Mr. Welles brought him to my office for a conversation which lasted on each occasion for some two hours. The conversation consisted mainly of a rehash of conversations I have had from time to time with Ambassador Nomura. There were elaborations here and there with respect to certain phases of the two documents which had been exchanged between the Ambassador and myself representing our respective Governments. Our document of June twenty-first and an elaboration of it on October second had both been given to the Japanese Ambassador in an informal way with the definite understanding that no stage of negotiations had been reached and that these were really exploratory oral conversations reduced to writing. The Minister referred to the more recent communications from his Government, especially the ones received in September, and to the communication sent to this Government at the time the Prime Minister sent his personal message to the President requesting a meeting between the two to discuss American-Japanese relations.\n\nThe Minister sought to keep in harmony with his talks with Under Secretary Welles some days ago, but it was apparent that he was hedging more or less on these phases, especially on the three principal points of difference relating to bringing troops out of China, to applying a non-discrimination commercial policy to the entire Pacific area and to further clarification of the Japanese attitude towards the Tripartite Pact as it might relate to the relations between Japan and the United States.\n\nI emphasized that the proposed peaceful settlement should apply to the entire Pacific area and not to just a part of it, just as United States commercial policy based on the principle of equality and nondiscrimination applies to the entire world, and just as similar utterances apply to the entire world alike, including Japan. I then referred to the different points in Japanese statements to us at the time of and since the communication which accompanied the Prime Minister’s communication to the President requesting a meeting wherein the Japanese were narrowing both the letter and the spirit of their attitude, as clearly expressed to me from March until July by Ambassador Nomura. This narrowing attitude related to the range of the Pacific area to be included in a settlement, to the scope and breadth of the formula prescribing commercial policy based on the rule of non-discrimination, to their interpretation of the application [688면] of the Tripartite Pact as it relates to the United States, and to the breadth and spirit and implications of Ambassador Nomura’s many conversations with respect to bringing troops out of China, and to the limitation of Japanese commitments against conquest to the north and south only instead of a broad basic commitment on principles and programs for a satisfactory peaceful settlement pertaining to the entire Pacific area.\n\nThe effect of the Minister’s numerous attempts at interpretation of the foregoing and of their application did not indicate progress—certainly not progress as compared with the attitude existing with respect to these questions, as set forth by Ambassador Nomura prior to the disruption of our conversations resulting from the occupation by Japan of Indochina.\n\nThe Minister spent much time attempting an unsatisfactory interpretation of the Tripartite Pact as it might affect us, by urging that it was a peace instrument and very slightly implying that, therefore, it was not aimed at us. I reminded him that for months it was proclaimed as intended principally to keep this country out of war with Germany and that it was a joint movement on the part of Japan and Germany to this end. It was, therefore, no easy matter for us to convince this country that it was a harmless document; that Japan herself must say and do the things necessary to disabuse the public mind in this country of the very unfriendly implication of the Tripartite Pact. There the matter rested despite the Minister’s labored effort to give it a different interpretation.\n\nThe Minister strove for some time to show the necessity for Japanese troops being retained in China. I brought up the many facts and circumstances showing the great benefit it would be to Japan to get her troops out and mark off some temporary losses in one way or another and begin the work of restoring friendship and trade between the two countries under the broad principles of friendly international relations which underlie the peaceful settlement proposals of the United States. I reminded the Minister that the Japanese invasion has resulted in the establishment of many monopolies in China and many special privileges and benefits in various ways, which probably accounts for the main desire of Japan to keep troops in China, that Japan can never regain the friendship of China while she keeps troops there, that a settlement of the Chinese situation necessarily dovetails into the formula which this Government has suggested for a peaceful settlement for the entire Pacific area, and that the Chinese phase must be included in any such wide settlement. We went over many of the phases that had been discussed between Ambassador Nomura and myself with respect to bringing troops out of China and the Chinese situation generally.\n\n[689면]\n\nOn the question of a broad basic liberal commercial policy such as this Government stands for and has proposed to Japan along with all other nations, the Minister and I discussed numerous phases, pro and con, without anything especially new being brought out, except that I emphasized the earnest desire of this Government for such a provision to be included in any Pacific area settlement by pointing to our recent trade agreement with the Argentine, [주32a] which gives Japan and all other countries equal access with ourselves to the markets there, and also to the numerous discussions this Government is having with the British and the British Dominions with respect to the removal of empire preferences and other discriminations, including the narrow policy of bilateral trade, and suggested strongly that Japan was more interested in this course than almost any nation, and yet she was opposing the application of the policy of non-discrimination in the Pacific. The Minister finally said that he was not disagreeing and that he would communicate at once with his Government to see if it would not accept this broad proposal. I said that was good and asked him to let me know when he hears from his Government. The upshot of our exploratory conversations left us with the view that the new Japanese Government [주33] would have to speak next and before we had further serious conversations with their representatives here. We also derived the definite impression that there were no present signs of the Japanese Government coming back anywhere near the position it occupied in our exploratory conversations when they were temporarily abandoned at the time Japan went into Indochina. We are not very expectant in this line so far as future conversations are concerned, but we shall give them a full opportunity to say what they may have in mind to say.\n\nC[ordell] H[ull]", "notes": ["[주32a] 1941년 10월 14일 부에노스아이레스에서 서명. Department of State, Bulletin, 1941년 10월 18일, 부록(제5권 제121A호).", "[주33] 고노에 공이 이끄는 정부는 1941년 10월 16일 사퇴했다. 10월 18일 도조 히데키[또는 에이키] 대장을 총리로, 도고 시게노리를 외무대신으로 하는 새 정부가 성립되었다."], "warn": false, "pages": ["0754", "0755"], "search": "헐(Cordell Hull) — 국무장관, 각서 작성자 와카스기(若杉要, Wakasugi) — 주미 일본공사 웰스(Sumner Welles) — 국무차관 노무라(野村吉三郎, Nomura) — 주미 일본대사 고노에(近衞文麿, Konoye) — 일본 총리 루스벨트(Franklin D. Roosevelt) — 대통령. 원문에는 「the President 대통령」으로만 적혀 있다 도조(東條英機, Hideki Tojo) — 각주에 나온다 도고(東郷茂徳, Shigenori Togo) — 각주에 나온다"}, {"id": "d373", "order": 373, "date": "1941-10-17", "group": "A", "eyebrow": "d373 · Memorandum by the Counselor of Embassy in Japan (Dooman)", "title": "주일 미국대사관 참사관(두먼)의 비망록", "badge": null, "list_right": "문서 373", "meta": [{"k": "일자", "v": "1941-10-17"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2624", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 373 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d373"}], "summary": "고노에 내각 총사퇴 다음 날 아침, 우시바 비서관이 두먼의 집을 찾아와 고노에의 사신을 전하고, 후임 내각이 군인 중심이 될 수밖에 없는 사정과 그럼에도 회담 중단에 반대하는 인물들로 짜였음을 극비로 전한다. 고노에의 서한과 그루의 답신이 부속되어 있다.", "points": ["우시바 비서관이 이른 아침 전화를 걸어 두먼의 집을 찾아왔다. 평소 침착한 사람이 이날 아침에는 신경이 곤두서 흥분해 있었고, 밤새 고노에를 도와 신임 총리에게 정권을 넘길 준비를 했다고 말했다.", "우시바는 고노에가 그루 대사에게 보내는 사신을 봉함 그대로 건네며 읽어 보라고 권했다. 상관의 생각을 극비로 전하라는 훈령을 받았기 때문이다.", "10월 2일 국무장관 각서는 고노에 내각에 큰 실망이었고, 회담의 성공적 타결에 대한 어떤 희망도 길이 막혔다는 인상이 내각 안에 생겼다.", "고노에는 일주일쯤 전 국내 정세에 비추어 사임을 결심했고, 당시에는 후임 내각이 극단적 성격의 것이 되리라는 것이 불가피해 보였으나, 집중적인 노력과 「기적으로」 대미 회담을 중단해야 한다는 원칙에 동조하지 않는 인물들로 후임 정부가 구성되도록 하는 데 성공했다.", "고노에가 실패한 일을 떠맡을 일본인 문민 정치가는 없으므로 후임 내각은 육군 장교가 이끌고 주로 군인으로 구성될 수밖에 없으며, 육군 내 여러 집단의 구성을 모르는 사람에게는 극단적으로 보일 수도 있다. 고노에는 새 내각의 겉모습에 지나친 무게를 두지 말도록 대사가 미국 정부에 강조해 주기를 바랐다.", "고노에는 후임 총리 역시 미일 관계 조정을 똑같이 바라리라는 확신 없이는 지금 사표를 내지 않았을 것임을 대사가 이해해 주기를 바랐다.", "우시바는 군인 중심 내각이야말로 현재 일본에서 정부를 무너뜨릴 수 있는 유일한 세력이며, 고노에의 집중적이고 기적적인 노력의 결과로써만 다음 정부가 가장 군국주의적이고 극단적인 정책에 매인 군사독재가 되지 않는 것이라고 강조했다.", "두먼은 야마가타 공처럼 육군의 단결을 확보할 큰 지도자가 육군에 없는 것이 몹시 안타깝다고 했고, 우시바는 스기야마 참모총장이 그런 지도자로 거론되나 실은 부하들에게 너무 휘둘리는 도구이며, 관동군 사령관 우메즈가 육군에서 가장 영향력 있는 인물로 필요할 때 나설 것이라고 보았다.", "부속 1은 고노에가 10월 16일 오기쿠보에서 그루에게 보낸 서한이다. 후임 내각이 회담을 성공적 결말로 이어 가리라 확신하며, 내각 교체나 새 내각의 겉모습만으로 실망하거나 낙심하지 말아 달라고 청한다.", "부속 2는 그루가 10월 17일 보낸 답신이다. 후임자가 자신의 진심 어린 협력을 온전히 기대해도 좋다고 하고, 고노에가 얼마간의 휴식을 얻기를 바란다고 쓴다."], "primary": "[도쿄,] 1941년 10월 17일.\n\n오늘 이른 아침 내가 아직 옷을 입고 있는 동안 우시바(牛場信彦, Ushiba) 씨가 나에게 전화를 걸어 우리 집으로 찾아가도 되겠는지 물었다. 그는 내가 아침을 들고 있을 때 도착하였다. 그는 평소에 매우 침착한 사람이나 오늘 아침에는 신경이 곤두서고 흥분해 있었다. 그는 고노에(近衞文麿, Konoye) 공작이 신임 총리에게 정권을 넘겨줄 준비를 하는 것을 돕느라 밤을 꼬박 새웠다고 말하였다.\n\n[690면]\n\n이어 우시바 씨는 총리가 미국대사에게 보내는 사신(私信)을 봉함된 채로 나에게 건네며 그것을 그루 씨에게 전달해 줄 것을 청하였다. (고노에 공작의 서한 사본과 그에 대한 대사의 답신 사본이 이 비망록에 첨부되어 있다.) 그는 자기 상관이 염두에 두고 있는 어떤 생각들을 극비로 나에게 말하도록 훈령받았으므로 그것을 읽어 보라고 권하였다. 우시바 씨의 진술의 요지는 다음과 같았다.\n\n워싱턴에서 일본대사에게 건네진 10월 2일자 국무장관 각서는 고노에 내각에 큰 실망이었으며, 현재의 회담이 성공적으로 타결될 수 있으리라는 어떠한 희망에 대해서도 길이 막혔다는 인상이 내각 안에 생겨났다. 고노에 공작은 일주일쯤 전에 일본의 국내 정세에 비추어 사임하기로 결심하였다. 그 당시에는 뒤를 잇는 내각이 극단적 성격의 것이 되리라는 것이 불가피해 보였으나, 고노에 공작은 집중적인 노력과 「기적에 의하여」 최근 며칠 사이에 자기 뒤를 이을 정부가 미국과의 회담을 중단해야 한다는 원칙에 동조하지 않는 인물들로 구성되도록 확보하는 데 성공하였다.\n\n고노에 공작이 실패한 그 과업을 떠맡을 일본인 문민 정치가는 없으며, 따라서 뒤를 잇는 내각은 육군 장교를 수반으로 하고 주로 군인들로 구성될 수밖에 없다. 새 내각은 일본 육군 안의 여러 집단과 정부에 영향력을 가진 다른 분파들의 짜임새를 알지 못하는 사람들에게는 극단적으로까지 보일 수도 있다. 그러나 고노에 공작은, 새 내각의 겉모습에 지나치게 큰 중요성이 부여되어서는 안 된다는 것을 대사가 미국 정부에 강조해 주기를 바라고 있다. 고노에 공작은 또한, 뒤를 잇는 총리 역시 일본과 미국의 관계를 조정하기를 똑같이 바라리라는 것을 스스로 확신하지 않았다면 이 시점에 사표를 내지 않았으리라는 점을 대사가 이해해 주기를 바라고 있다.\n\n우시바 씨는 덧붙이기를, 현재로서는 자유주의적 색채를 띤 문민 내각을 구성하기가 불가능하리라는 것을 대사가 쉽게 이해하리라고 하였다. 일본에는 총리의 직을 떠맡을 만한 충분한 명망을 지닌 문민이 없으며, 설령 그러한 문민 정부가 구성된다 하더라도 그것을 무너뜨릴 만한 반대가 급속히 일어날 것이다. 따라서 뒤를 잇는 내각은 주로 군인들로 구성될 수밖에 없는데, 이러한 색채의 내각이야말로 현재 일본에서 정부를 무너뜨릴 수 있는 유일한 세력을 대표하기 때문이다. 우시바 씨는, 오직 고노에 공작의 집중적이고 기적적인 노고의 [691면] 결과로서만 다음 정부가 가장 군국주의적이고 극단적인 정책에 매인 군사독재가 되지 않게 되는 것이라고 강조하였다.\n\n우시바 씨는 끝으로, 고노에 공작이 비록 정부에서 물러나 있게 되더라도 배후에서 계속 자기 영향력을 사용하고 미국과 일본 사이의 회담에서 추구되어 온 목적의 달성에 최선의 노력을 바칠 것이며, 그 회담이 아주 머지않아 재개되기를 바라고 있다고 말하였다.\n\n나는, 워싱턴에서의 회담이 아직 진행 중인 마당에 고노에 공작이 사임이 필요하다고 느낀 것은 매우 유감스러운 일이라고 말하였는데, 최근 와카스기(若杉要, Wakasugi) 씨가 국무차관을 방문한 것은 내가 보기에 일본 정부의 입장을 한층 더 분명히 하는 데 좋은 결과를 가져왔기 때문이다. 우시바 씨는 언젠가는 내각 총사퇴로 이어진 사건들을 나에게 이야기할 수 있게 되기를 바란다고 말하면서, 다만 지금으로서 자기가 말할 수 있는 전부는 고노에 공작이 그렇게 함으로써 회담을 성공적인 결말로 이끌 수 있다는 확신에 찬 믿음에서 그 결정을 내렸다는 것뿐이라고 하였다.\n\n나는 일본 육군에 육군 내부의 단결을 확보할 수 있는 야마가타(山縣有朋, Yamagata) 공작과 같은 위대한 지도자가 없는 것이 매우 안타까운 일이라고 말하였다. 우시바 씨도 동의하였다. 그는 참모총장 스기야마(杉山元, Sugiyama) 대장이 그러한 지도자로 떠받들어지고 있으나, 실제로 스기야마 대장은 자기 부하들에게 너무나 고분고분한 도구라고 말하였다. 그의 의견으로는 관동군 사령관 우메즈(梅津美治郎, Umedzu) 대장이 육군에서 가장 영향력 있는 인물이며 필요할 때 앞으로 나서리라는 것이었다.\n\n우시바 씨가 막 떠나려 할 때, 나는 내가 즉시 대사를 만나겠다는 나의 확언을 고노에 공작에게 전해 줄 것을 청하였다.\n\nE[ugene] H. D[ooman]\n\n**[부속 1]**\n\n**퇴임하는 일본 총리(고노에 공작)가 주일 미국대사(그루)에게**\n\n도쿄, 오기쿠보(荻窪), 1941년 10월 16일.\n\n대사 각하: 언젠가 뒷날 각하께 설명드릴 수 있을지도 모를 국내 정치 정세로 말미암아 저와 저의 동료들이 사임하지 않을 수 없게 된 것은 크나큰 유감이며 실망입니다.\n\n그러나 저의 내각의 뒤를 이을 내각이, 우리가 오늘까지 진행해 온 회담을 성공적인 결말로 이어 가는 데에 온 힘을 다하리라고 저는 확신합니다. 그러므로 각하와 각하의 정부가 내각의 교체로 인하여, 또는 새 내각의 한갓 겉모습이나 인상으로 인하여 지나치게 실망하거나 낙심하지 않으시기를 간절히 바랍니다. 저의 내각이 그토록 애썼으나 이루지 못한 그 높은 목적을 새 내각이 달성하도록 돕는 데에 제 힘이 미치는 모든 것을 다하겠음을 [692면] 각하께 확언드립니다.\n\n이 기회를 빌려, 제가 다행히도 누릴 수 있었던 각하의 더없이 우호적인 협력에 대하여 마음으로부터의 감사를 표하고, 아울러 저의 뒤를 잇는 누구에게든 같은 은혜를 베풀어 주시기를 바라는 저의 진심 어린 소망을 전하고자 합니다.\n\n삼가 [이하 생략]\n\nP. 고노에(P. Konoye)\n\n**[부속 2]**\n\n**주일 미국대사(그루)가 퇴임하는 일본 총리(고노에 공작)에게**\n\n도쿄, 1941년 10월 17일.\n\n총리 각하: 10월 16일자 각하의 우정 어린 서한에 매우 깊이 감사드리며, 각하의 너그러운 말씀과, 다가올 내각이 우리 두 정부 사이에 진행되어 온 회담을 성공적인 결말로 이어 가기 위하여 모든 노력을 기울이리라는 각하의 확신이 저에게 준 격려에 대하여 서둘러 진심으로 사의를 표합니다. 각하와 각하의 동료들이 애써 온 그 높은 목적을 달성하는 데에 각하 자신이 새 내각을 도우시리라는 것을 알게 되어 저는 예리한 기쁨을 느낍니다. 그리고 성공적인 결과를 이루기 위한 우리 각자의 정부의 상호 노력을 이어 감에 있어 각하의 후임자가 저 자신의 진심 어린 협력을 온전히 기대하여도 좋다는 것은 새삼 확언할 필요조차 없을 것입니다.\n\n각하께서 그 높은 직책의 노고를 한동안 내려놓으시게 된다면, 조국을 위한 길고 고된, 그리고 더없이 뛰어난 공직 봉사 뒤에 이제 얼마간의 반가운 휴식과 안식을 얻으시기를 바라는 마음을 표하도록 허락해 주시기 바랍니다.\n\n삼가 [이하 생략]\n\n조지프 C. 그루(Joseph C. Grew)", "secondary": "[Tokyo,] October 17, 1941.\n\nMr. Ushiba telephoned me early this morning while I was still dressing and asked whether he might call on me at my house. He arrived as I was having breakfast. He is normally well composed, but this morning he was nervous and excited. He said that he had been up all night helping Prince Konoye to make arrangements for the transfer of office to the incoming Prime Minister.\n\n[690면]\n\nMr. Ushiba then handed me, unopened, a personal letter from the Prime Minister to the American Ambassador and asked that I deliver it to Mr. Grew. (Copy of Prince Konoye’s letter and copy of the Ambassador’s reply thereto are attached to this memorandum.) He suggested that I read it, as he had been instructed to tell me in the strictest confidence certain thoughts which his chief had in mind. The substance of Mr. Ushiba’s statement was as follows:\n\nThe Secretary’s memorandum of October 2 which had been handed to the Japanese Ambassador in Washington had been a great disappointment to the Konoye Cabinet and the impression had been created inside the Cabinet that the road had been blocked to any hopes that the present conversations could be successfully concluded. Prince Konoye about a week ago had decided to resign in view of the internal situation in Japan. At that time it appeared inevitable that the succeeding Cabinet would be one of an extremist nature but Prince Konoye through intensive effort and “by a miracle” had in recent days been successful in ensuring that the government to succeed him would be composed of persons who did not subscribe to the principle that the conversations with the United States should be broken off.\n\nNo Japanese civilian statesman will undertake the task in which Prince Konoye has failed and consequently the succeeding Cabinet must be headed by an Army officer and will be composed primarily of military men. The new Cabinet may even appear to be extremist to persons unacquainted with the set-up of the various groups within the Japanese Army and other factions having influence in the Government. However, Prince Konoye entertains the hope that the Ambassador will stress to the Government of the United States that too great importance should not be given to the outward appearance of the new Cabinet. Prince Konoye also desires the Ambassador to understand that he would not have tendered his resignation at this moment without having convinced himself that the succeeding Prime Minister would be equally desirous of adjusting Japanese-American relations.\n\nThe Ambassador would readily appreciate, Mr. Ushiba added, that it would be impossible at the present time to form a civilian Cabinet with a liberal tinge: there is in Japan no civilian of adequate eminence to take over the office of Prime Minister, and even if such a civilian government should be formed, sufficient opposition to bring about its downfall would rapidly arise. Consequently the succeeding Cabinet must be composed primarily of military men by reason of the fact that a Cabinet of this complexion would represent the only element in Japan which at the present time would be capable of bringing about the downfall of the government. Mr. Ushiba emphasized that only as the result of the intensive and miraculous labors [691면] of Prince Konoye will the next government not be a military dictatorship bound to the most militaristic and drastic policy.\n\nMr. Ushiba concluded that Prince Konoye, although out of the government, will from the background continue to use his influence and to devote his best efforts to the achievement of the aims sought for in the conversations between the United States and Japan and he is hopeful that these conversations will be resumed very shortly.\n\nI said that it was a great pity that Prince Konoye had felt it necessary to resign as the conversations in Washington were still in progress, the recent call of Mr. Wakasugi on the Under Secretary of State having had, in my opinion, good results toward further clarifying the position of the Japanese Government. Mr. Ushiba said that he hoped some day to be able to tell me of the events which had led to the Cabinet’s resignation, but that all that he could say for the present was that Prince Konoye had taken the decision in the confident belief that he could thus bring the conversations to a successful conclusion.\n\nI said that it was a great pity that the Japanese Army did not have a great leader, such as Prince Yamagata, who could insure unity within the Army. Mr. Ushiba agreed. He said that General Sugiyama, Chief of the General Staff, was being touted as such a leader, but that actually General Sugiyama was too pliant an instrument for his subordinates. In his opinion, General Umedzu, chief of the Kwantung Army, was the most influential man in the Army and would come forward when needed.\n\nAs Mr. Ushiba was about to leave, I asked that he convey to Prince Konoye my assurance that I would immediately see the Ambassador.\n\nE[ugene] H. D[ooman]\n\n[Annex 1]\n\nThe Retiring Japanese Prime Minister (Prince Konoye) to the American Ambassador in Japan (Grew)\n\nOgikubo, Tokyo, October 16, 1941.\n\nMy Dear Ambassador: It is with great regret and disappointment that my colleagues and I have had to resign owing to the internal political situation, which I may be able to explain to you sometime in the future.\n\nI feel certain, however, that the cabinet which is to succeed mine will exert its utmost in continuing to a successful conclusion the conversations which we have been carrying on up till today. It is my earnest hope, therefore, that you and your Government will not be too disappointed or discouraged either by the change of cabinet or by the mere appearance or impression of the new cabinet. I assure [692면] you that I will do all in my power in assisting the new cabinet to attain the high purpose which mine has endeavored to accomplish so hard without success.\n\nMay I take this opportunity to express my heartfelt gratitude for your most friendly cooperation which I have been fortunate enough to enjoy and also to convey to you my sincere wish that you will give the same privilege to whomever succeeds me.\n\nWith kindest [etc.]\n\nP. Konoye\n\n[Annex 2]\n\nThe American Ambassador in Japan (Grew) to the Retiring Japanese Prime Minister (Prince Konoye)\n\nTokyo, October 17, 1941.\n\nMy Dear Prime Minister: Your friendly letter of October 16th is very deeply appreciated and I hasten to thank you heartily for your generous expressions and for the encouragement which you have given me in your confidence that the coming cabinet will make every effort to continue to a successful conclusion the conversations carried on between our two Governments. It gives me keen gratification to know that you yourself will assist the new cabinet in attaining the high purpose for which you and your colleagues have striven, and I need hardly assure you that your successor may count fully on my own earnest cooperation in a continuance of the mutual efforts of our respective Governments to achieve a successful outcome.\n\nPlease permit me to express the hope that you yourself, if you are about to lay down for a time the cares of your high office, will now find some degree of welcome relaxation and respite after your long, arduous and most distinguished official service to your country.\n\nWith expressions [etc.]\n\nJoseph C. Grew", "notes": [], "warn": false, "pages": ["0756", "0757", "0758"], "search": "두먼(Eugene H. Dooman) — 주일 미국대사관 참사관, 비망록 작성자 우시바(牛場信彦, Ushiba) — 고노에 총리 비서관 고노에(近衞文麿, Konoye) — 총리(사임) 그루(Joseph C. Grew) — 주일 미국대사 헐(Cordell Hull) — 국무장관 와카스기(若杉要, Wakasugi) — 주미 일본공사 웰스(Sumner Welles) — 국무차관 야마가타(山縣有朋, Yamagata) — 공작, 육군 원로 스기야마(杉山元, Sugiyama) — 참모총장 우메즈(梅津美治郎, Umedzu) — 관동군 사령관"}, {"id": "d374", "order": 374, "date": "1941-10-24", "group": "A", "eyebrow": "d374 · Memorandum by the Under Secretary of State (Welles)", "title": "국무차관(웰스)의 비망록", "badge": null, "list_right": "문서 374", "meta": [{"k": "일자", "v": "1941-10-24"}, {"k": "시각", "v": "this afternoon (오늘 오후)"}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/24069/11", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 374 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d374"}], "summary": "와카스기 공사가 도조 신내각도 전 내각의 대미 정책을 이어 회담을 지체 없이 계속하기를 바란다고 전하자, 웰스가 일본 군부 요인들의 발언과 언론 논조를 들어 반박하고 새 문안 작성·경제 원칙 우선 합의·중일 화평 접촉 문제를 논한다.", "points": ["와카스기 공사는 자기 요청으로 웰스를 찾아와, 일본 정부가 대미 관계에서 전 내각의 정책을 이어 가고자 하며 양국이 만족할 협정을 찾기 위해 회담을 지체 없이 계속하기를 바란다는 훈령을 전했다.", "공사는 신내각이 처한 사정과 긴장된 여론의 압박 때문에 회담을 신속히 만족스러운 결말로 몰아가는 것이 절박하게 바람직하다고 말했다.", "공사는 9월 27일 일본 정부의 제의에 대해 미국이 대안(counterproposals)을 낼 것이 있는지 문의하라는 훈령을 받았다고 말했다.", "웰스는 일본 정부·육군·해군 요인들의 최근 발언이 양해에 이바지할 분위기를 만들지 못한다고 지적했다. 특히 일본 해군의 책임 있는 장교가 일본 해군이 미국 해군과 「싸우고 싶어 근질거린다」고 공개 발언한 것이 이곳 여론, 특히 미 해군에 파멸적인 영향을 미쳤다고 말했다.", "와카스기는 한 시간 전 통신 수신기에서 녹스 장관이 미일 전쟁은 불가피하며 그래서 미 해군이 24시간 태세에 있다고 말했다는 보도를 보았다고 응수했다. 웰스는 전쟁이 불가피하다는 녹스의 발언은 본 적이 없고, 어떤 사건이 일어날 수도 있는 정세여서 해군이 24시간 태세라는 취지의 발언은 보았다고 답했다.", "웰스는 미국의 입장이 6월 21일 전달 문서, 그 뒤의 국무장관·일본 대사 회담, 10월 2일 일본대사관에 전달된 성명에서 완전히 명확하게 제시되었으므로 미국이 대안을 낼 필요는 없어 보인다고 말했다.", "웰스는 9월 27일 일본 측 안의 문언이 오해를 낳았을 수 있으니 문언 수정을 함께 검토할 용의가 있다고 했고, 와카스기는 새로운 접근으로 새 문안을 만드는 것이 이롭지 않겠느냐고 제의했다.", "웰스는 우선 경제 원칙에 관한 합의부터 이루자고 제안하며, 예컨대 영국 제국특혜가 폐지되어 일본이 캐나다·오스트레일리아·뉴질랜드를 포함한 태평양 전 국가와 영국과 같은 조건으로 교역할 수 있게 되면 일본이 얼마나 이익을 볼지 지적했다.", "웰스는 히틀러의 「가진 나라와 못 가진 나라」라는 불길한 표어가 퍼지고 일본이 전통적 우호를 버리고 새 모험에 나서기 전에는 일본이 경제적 포위를 주장할 생각조차 하지 않았다고 말했고, 일본이 공식적·공개적으로 추축 진영에 몸을 둔 데서 얻은 것이 없고 도리어 심각한 손해를 입었다고 했다. 와카스기는 이를 부인하지 않고 잠자코 있었다.", "와카스기는 전적으로 비공식임을 전제로, 웰스가 자기와 중국 대사 후스 또는 중국을 대변할 수 있는 다른 중국 관리와 함께 만날 용의가 있는지 물었다. 대통령이 중일 평화 해결을 촉진할 공식 노력을 하려면 장제스 정부가 일본과 협정에 이를 뜻이 있는지 먼저 확인해야 한다는 것이었다.", "웰스는 신중한 검토 없이 개인적·비공식적으로도 답할 수 없다고 하고, 다음 회담에서 그 제의의 실현 가능성에 관한 개인적 견해를 논의할 준비를 하겠다고 답했다.", "공사는 대사의 출발 계획에 관해 아무 언급도 하지 않았고 웰스도 묻지 않았다. 다만 공사는 더 상세한 훈령이 오는 대로 대사가 양국 회담에 참여하게 될 것이라고 명확히 진술했다."], "primary": "[워싱턴,] 1941년 10월 24일.\n\n일본 공사 와카스기(若杉要, Wakasugi) 씨가 자기 요청으로 오늘 오후 나를 찾아왔다.\n\n공사는 우선, 일본 정부가 미국과의 관계에서 전 내각의 정책을 이어 가기를 바라며 양국 정부가 다 같이 만족할 협정을 찾을 목적으로 양국 정부 사이에 진행되어 온 회담을 지체 없이 계속하기를 바란다는 것을 미국 정부에 알리라는 훈령을 일본 정부로부터 받았다고 진술했다.\n\n[693면]\n\n공사는 자기가 믿기로 새 일본 정부는 그러한 사정 아래에서 취임했고 또 긴장된 여론에 상당한 정도로 밀리고 있으므로, 회담을 신속히 만족스러운 결말로 밀고 나가는 것이 절박하게 바람직하다고 진술했다.\n\n공사는 또한, 9월 27일 일본 정부가 내놓은 제의에 대하여 미국 정부가 내놓을 대안(counterproposals)이 아직 있는지 문의하라는 훈령을 받았다고 진술했다.\n\n나는 이 전언에 대한 답으로 터놓고 아주 솔직하게 말할 필요를 느낀다고 진술했다.\n\n나는 미국이 지난 일고여덟 달 동안, 일본 정부와 이 회담을 갖게 되어 기쁘며 양국 정부 사이의 공평한 협정의 기초를 찾기를 바라고 그러한 바람직한 목표를 되도록 빨리 이루기를 바란다는 것을 충분히 분명하게 밝혀 왔다고 말했다. 그러나 나는, 일본 정부와 일본 육군과 일본 해군의 저명한 관리들이 최근에 한 발언들이 양국 정부가 염두에 둔 회담을 진전시키기 위한 어떤 만족스러운 양해에 이르는 데 이바지할 만한 종류의 분위기를 만들어 내는 데 도움이 되지 않는다는 것을 공사도 나만큼 분명히 인정해야 한다고 말했다. 나는 일본 해군의 책임 있는 장교가 일본 해군이 미국 해군과 「싸우고 싶어 근질거린다」고 공개적으로 밝혔을 때, 그것이 이곳 여론에, 특히 미국 해군에 미친 영향은 파멸적이었다고 말했다. 나는 유감스럽게도 지난 두 주 동안 일본의 고위 당국자가 한 발언 가운데, 일본 정부가 현재의 회담의 결과로 미국과 우호적이고 만족스러운 양해에 이르려는 진지한 바람을 조금이라도 가지고 있다는 뜻으로 해석될 수 있는 것을 거의 보지 못했다고 말했다. 나아가 나는, 같은 기간 일본 언론의 전반적 논조와 일본 언론에 실린 기사와 사설도 일본 언론이 우리 두 나라 사이의 어떤 만족스러운 양해를 진전시키는 데 관심이 없다는 뜻으로밖에 해석될 수 없다고 말했다. 나는 내가 언급한 사정이 지금까지 진행되어 온 회담의 만족스러운 결말에 또 하나의 심각한 장애를 만들어 낸다는 데는 와카스기 씨도 틀림없이 동의할 터이므로 이 사실들을 아주 분명히 해 둘 필요를 느낀다고 말했다.\n\n공사는 답하기를, 자기가 한 시간 전에 통신 수신기에서 녹스(Frank Knox) 장관의 것으로 전해지는 발언을 보았는데, 일본과 미국 사이의 전쟁은 불가피하며 따라서 미국 해군이 24시간 태세에 있다는 내용이었다고 말했다. 나는 우리 두 나라 사이의 전쟁이 불가피하다고 믿는다는 [694면] 취지의 녹스 장관의 발언은 본 적이 없으나, 어떤 사건이 일어날 수도 있는 정세이며 따라서 미국 해군이 24시간 태세에 있다는 뜻을 담은, 그의 것으로 전해지는 발언들은 보고 읽었다고 진술했다. 나는 녹스 장관의 것으로 전해지는 그 발언들을 공사가 언급한 것이야말로 내가 방금 그에게 진술한 바의 진실성을 분명히 강조해 준다고 말했다. 만일 일본 해군이 미국과 「싸우고 싶어 근질거린다」고 세계에 공표한다면, 그것이 미국 해군에 미칠 영향을 그로서도 과소평가하기 어려울 것이다.\n\n나는, 현재의 회담을 성공적인 결말로 이끌려는 시도가 쓸모 있는지 판단함에 있어 미국 정부로서는 내가 언급한 종류의 발언과 언론 공세를 진지하게 고려에 넣지 않을 수 없다는 점을 아주 분명히 해 두어야겠다고 느낀다고 말했다.\n\n그가 본국 정부의 훈령에 따라 언급한 두 번째 사항에 관해서는, 그가 미국에 돌아온 뒤 내가 그와 가진 첫 회담에서 내가 그것을 전적으로 분명히 밝혔다고 확신하며, 헐 국무장관도 그 뒤 두 차례의 회담에서 한층 더 분명히 밝혔다고 말했다. 즉 미국 정부의 견해는 6월 21일 일본 정부에 건네진 문서들과, 그 뒤 국무장관과 일본 대사 사이의 회담들과, 10월 2일 일본대사관에 전달된 성명에서 완전히 명확하게 제시되었다는 것이다. 나는 미국 정부가 어떤 대안을 내놓아야 할 상황으로는 보이지 않는다고 말했다. 국무장관과 가진 지난번 회담에서 국무장관은 우리 두 나라 사이의 양해의 기초 가운데 하나로 미국 정부가 제시한 경제 원칙들이 일본 자신의 관점에서 갖는 가치를 공사에게 각인시켰다고 나는 말했다. 그때 공사는 이를 본국 정부에 전달하고 그 회답을 우리에게 알려 주겠다고 말했었다.\n\n와카스기 씨는 자기가 실제로 헐 장관의 진술을 아주 상세히 본국 정부에 전달했으나 그에 관해 아직 본국 정부로부터 아무 회신도 듣지 못했다고 말했다.\n\n나는, 공사가 앞서 나에게 한 진술 — 9월 27일 일본 측 안에 쓰인 문언이 어쩌면 오해를 낳았을 수 있고 일본 측 견해가 6월 21일 문서들에 제시된 미국 정부의 입장에 훨씬 더 가깝다는 것이 분명해지도록 그 문언을 틀림없이 고칠 수 있으리라는 진술 — 에 관하여 국무장관과 나 둘 다, 그가 기꺼이 제안할 문언상의 그러한 변경이라면 무엇이든 공사와 마주 앉아 검토하겠다고 말했다고 했다. 나는 이런 종류의 노력을 통해 일본 정부의 견해가 9월 27일 일본 측 제안에서 보이는 것보다 [695면] 훨씬 더 미국 정부의 견해와 가깝다는 것을 우리가 확인하게 될 수도 있다고 믿을 만큼 나는 낙관적이라고 말했다.\n\n공사는 아직 본국 정부로부터 상세한 훈령을 받지 못했으나 곧 그러한 상세한 훈령을 받게 되기를 바란다고 말했다. 이어서 그는 멀리 지난 4월에 이미 자기가 대사에게, 태평양 지역에 관계되는 정세의 모든 국면에 걸쳐 미국 정부와 협정할 실제적이고 구체적인 기초를 찾아보라고 권했다고 말했다. 그는 비공식적인 미국인 몇 사람과 비공식적인 일본인 몇 사람이 — 그의 표현으로는 틀림없이 진지하게 — 우리 두 나라 사이의 우호 관계를 진전시키려 애쓰다가 이 국면에 끼어들어 이런저런 문안을 고안해 냈으며, 유감스럽게도 그림을 분명하게 하기보다 오히려 흐려 놓는 데 성공한 것이 아닌가 싶다고 말했다. 그는 이러한 노력들이 상당한 지연을 낳았다고 생각한다고 말했다. 그리하여 그는 새롭게 접근하여, 미국 정부가 제시한 원칙들을 충분히 존중하면서 새로운 문안을 만들어 나가는 것이 이롭지 않겠느냐고 물었다. 나는 공사에게 그 제의가 아주 도움이 될 수도 있겠다고 생각하며, 그가 염두에 둔 새 문안을 작성해 온다면 이곳에서 즉시 검토하겠다고 말했다. 나는 국무장관 이하 모두가, 만족스러운 해결을 진전시키기 위해서라면 필요한 만큼의 시간과 생각을 기꺼이 바치겠다는 뜻을 분명히 해 왔다고 말했다.\n\n나는 편의와 지혜의 관점에서 볼 때, 우선 관련된 경제 원칙들에 관하여 합의에 이를 수 없는지 살펴보는 것이 좋을 듯하다고 진술했다. 나는 새 일본 내각의 정치가들이, 헐 장관이 제시한 경제 정책을 채택할 경우 일본에 돌아올 실제적 이익이 무엇인지를 그만큼 충분히 이해하고 있는지 궁금하다고 말했다. 나는, 만일 그들이 그것을 이해한다면, 예컨대 영국의 제국특혜가 폐지되어 일본이 캐나다·오스트레일리아·뉴질랜드를 포함한 태평양의 모든 나라와 영국이 교역할 수 있는 것과 같은 조건으로 교역할 수 있게 될 경우 일본이 얼마나 이익을 볼지를 그들도 분명히 인정할 수밖에 없다고 말했다.\n\n와카스기 씨는 미국 정부가 제안한 무차별 통상 정책에 일본이 전심으로 동의하는 것이 바람직하다는 자기 나름의 믿음을 강조하면서 매우 진지해 보였다. 나는 만일 우리가 이 전선에서 합의에 이를 수 있다면 미국이 내세운 다른 원칙들에 관하여 만족스러운 합의를 찾는 데로 한층 고무되어 나아갈 수 있을 것이라고 말했다. 나는 어쩌면 지금 양국 정부가 합의할 수 있는 원칙에 관하여 먼저 합의에 이른 뒤에 더 까다로운 문제들을 다루는 것이 현명하리라는 믿음을 강조했다.\n\n[696면]\n\n이어서 공사는, 일정한 천연자원을 자국 주권 아래 갖지 못한 탓에 일본 국민이 다른 열강의 뜻대로 경제적 침략과 경제적 포위의 희생자가 되고 있다는 일본 국민 쪽의 믿음이라는 케케묵은 문제로 되돌아갔다. 나는 공사에게, 일본이 근대사에서 1930년까지의 기간 동안 영국·미국 양국과 더없이 우호적인 관계를 맺고 있었고 그 관계를 통하여, 또 일본의 국가 정책이 내가 말한 두 정부의 정책과 대체로 나란히 갔다는 사실 덕분에, 일본이 급속히 세계의 강대국 가운데 하나가 되고 큰 번영의 시기를 누리지 않았느냐는 것을 그나 다른 어떤 일본인이 부인할 수 있겠느냐고 물었다. 공사는 물론 그러했다고 말했다. 나는, 히틀러가 내세운 「가진 나라와 못 가진 나라」라는 불길한 표어가 세계 여러 국민의 귀에 요란하게 울려 퍼지기 전까지, 그리고 일본 자신이 전통적인 우호 관계에서 벗어나 새로운 모험과 정책에 나서기 전까지는 일본이 경제적 포위를 주장할 생각조차 해 본 적이 없는 것으로 나에게는 보인다고 말했다.\n\n공사는, 일본의 젊은 세대가 세계에 번지고 있는 그 해로운 병에 감응해 온 것은 사실이지만 그럼에도 일본은 자기 나름의 독자적인 정책을 추구하고 있으며 정책의 국가적 결정에서 독일이나 이탈리아에 종속되어 있다고 여겨져서는 안 된다고 말했다. 나는 그럴 수도 있겠으나 그럼에도 일본은 정식으로, 공식적으로, 그리고 공개적으로 자신을 추축 진영에 두었으며, 실제 결과라는 면에서나 일본 국민의 복리와 번영에 관계되는 한에서나 일본이 그로부터 얻은 것이 전혀 없을 뿐 아니라 도리어 심각한 손해를 입었다는 것을 일본의 어떤 친구도 부인할 수 없다고 말했다.\n\n와카스기 씨는 이를 부인하지 않았다. 그는 잠자코 있었다.\n\n이어서 와카스기 씨는 화제를 바꾸어, 헐 장관과 가진 지난번 회담에서 장관이 자기에게 이 나라에서 중국인 친구들과 접촉이 있는지 물었다고 말했다. 공사는 그때 자기가, 중국 대사 후스(胡適, Hu Shih) 박사를 알기는 하지만 자기 나라와 중국 사이의 정세 때문에 그를 만나지는 않고 있다고 답했음을 나에게 상기시켰다. 공사는, 중국과 일본 사이의 분쟁을 해결하기 위해 온갖 접근을 시도하는 것이 무엇보다 중요해 보인다고, 그보다 태평양의 모든 문제의 해결에 더 이바지할 것은 없기 때문이라고 말했다. 그는 — 그리고 이것은 전적으로 비공식적인 것으로 여겨져야 한다고 진술하면서 — 내가 자기와 중국 대사, 또는 자기 나라를 대변할 수 있는 다른 어떤 중국 관리와 함께 만날 용의가 있겠는지 물었다. 그는 만일 미국 대통령이 [697면] 일본과 중국 사이의 평화적 해결에 이르는 것을 촉진하기 위해 어떤 공식적인 노력을 하고자 한다면, 장제스(蔣介石, Chiang Kai-Shek) 정부가 일본과 협정에 이를 뜻이 있는지를 반드시 먼저 확인해야 한다고 말했다.\n\n나는, 아주 신중한 검토와 이 가능성을 살펴볼 기회도 없이 내가 개인적으로나 비공식적으로라도 이 제의에 어떤 응답을 주리라고는 공사도 분명히 기대하지 않을 것이라고 답했다. 그러나 나는 이 문제를 아주 신중히 생각해 보겠으며, 다음 회담 가운데 어느 자리에서 그가 내놓은 제의가 실현 가능한지에 관한 나 개인의 견해를 그와 논의할 준비를 하겠다고 말했다.\n\n공사는 대사의 출발 계획에 관해서는 아무 언급도 하지 않았고 나도 그에 관해 그에게 묻지 않았다. 다만 그는 본국 정부로부터 더 상세한 훈령을 받는 대로 대사가 양국 정부 사이의 회담에 참여하게 되리라고 명확히 진술했다.\n\n공사는 이 훈령을 받는 대로 즉시 나에게 알리겠으며, 그러한 훈령을 서둘러 보내 달라고 본국 정부에 촉구하겠다고 말했다.\n\nS[umner] W[elles]", "secondary": "[Washington,] October 24, 1941.\n\nThe Japanese Minister, Mr. Wakasugi, called to see me this afternoon at his request.\n\nThe Minister first of all stated that he had instructions from the Japanese Government to inform this Government that in its relations with the United States it desired to pursue the policy of the preceding Government and desired to continue without delay the conversations which had taken place between the two Governments with a view to finding a satisfactory agreement to both Governments.\n\n[693면]\n\nThe Minister stated that, in his belief, the new Japanese Government had taken office under such circumstances and was pressed by tense public opinion to such an extent as to make it imminently desirable that the conversations be pressed to a satisfactory conclusion speedily.\n\nThe Minister further stated that he was instructed to inquire whether this Government had as yet any counterproposals to make to the suggestions offered by the Japanese Government on September 27.\n\nI stated that I felt it necessary to speak openly and entirely frankly in reply to this message.\n\nI said that the United States had made it fully clear during the past seven or eight months that it was glad to hold these conversations with the Japanese Government and that it desired to find the basis for an equitable agreement between the two Governments and that they desired to attain such a desirable objective as rapidly as possible. I said, however, that the Minister must recognize, as clearly as I did, that recent statements made by prominent officials of the Japanese Government and the Japanese Army and the Japanese Navy were not conducive to the creation of that kind of atmosphere which would be conducive to the reaching of any satisfactory understanding between the two Governments for the furtherance of the conversations which the two Governments had in mind. I said that, when a responsible officer of the Japanese Navy publicly announced that the Japanese Navy was “itching to fight” with the United States Navy, the result was disastrous in its effects upon public opinion here and particularly in its effects upon the American Navy. I said that I had, to my regret, seen very few statements if any, by high authorities of Japan during the past two weeks which could be interpreted as meaning that the Japanese Government had any sincere desire to reach a friendly and satisfactory understanding with the United States as a result of the present conversations. Furthermore, I said, the whole tone of the Japanese press, as well as articles and editorials appearing in the Japanese press, during the same period could only be interpreted as meaning that the Japanese press was not interested in the furtherance of any satisfactory understanding between our two countries. I said I felt it necessary to make these facts very clear in as much as Mr. Wakasugi would undoubtedly agree that the situation to which I referred created an additional and serious obstacle to any satisfactory outcome of the conversations which have been in progress.\n\nThe Minister replied by saying that he had seen only an hour ago on the ticker a statement attributed to Secretary Knox which said war between Japan and the United States was inevitable and that, consequently, the United States Navy was on a 24-hour basis. I stated that I had not seen any statement by Secretary Knox indicating his belief [694면] that war was inevitable between our two countries, but that I had seen and read statements attributed to him which implied that the situation was such that some incident might occur and that, consequently, the United States Navy was on a 24-hour basis. I said that the Minister’s reference to these statements attributed to Secretary Knox clearly emphasized the truth of what I had just stated to him. If the Japanese Navy announced to the world that it was “itching for a fight” with the United States, he could hardly underestimate the effect which this would have upon the American Navy.\n\nI said that I felt I must make it very clear that this Government would have to take into serious account statements and press campaigns of the kind to which I have referred in considering the utility of trying to find a successful outcome of the present conversations.\n\nWith regard to the second point he had mentioned by instruction of his Government I said that I was confident I had made it entirely plain in my first conversation with him after his return to the United States and that Secretary Hull, in our two succeeding conversations, had made it even more plain that the point of view of this Government had been set forth with complete clarity in communications handed to the Japanese Government on June 21, in the succeeding conversations between the Secretary of State and the Japanese Ambassador, and in the statement delivered to the Japanese Embassy on October 2. I said that it did not seem to me that any counterproposals were called for from this Government. In our last conversation with the Secretary of State I said the latter had impressed upon the Minister the value from Japan’s own standpoint of the economic principles this Government had offered as one of the bases for an understanding between our two countries. The Minister had then said that he would transmit this to his Government and let us have their reply.\n\nMr. Wakasugi said that he had in fact transmitted to his Government the statements of Secretary Hull in the fullest detail, but that he had not yet heard from his Government with regard thereto.\n\nI said that the Secretary of State and I had both said with regard to the Minister’s statement earlier made to me that the phraseology employed in the Japanese project of September 27 had perhaps given rise to misunderstandings and could undoubtedly be modified so as to make it clear that the Japanese point of view corresponded much more nearly to the position of this Government as set forth in its communications on June 21, that we would be glad to sit down with the Minister and consider any such changes in phraseology as he might be willing to suggest. I said that I was optimistic enough to believe that an effort of this kind might result in our ascertaining that the point of view of the Japanese Government was far more [695면] nearly identical to the point of view of the United States Government than would appear from the Japanese proposals of September 27.\n\nThe Minister said that he had not as yet received any detailed instruction from his Government, but that he was hopeful he would receive such detailed instructions in the immediate future. He then said that as far back as last April he had urged his Ambassador to try and find practical and concrete bases for agreement with the United States Government on all phases of the situation affecting the Pacific region. He said that certain American gentlemen who were unofficial and certain Japanese gentlemen who were unofficial, and who had (undoubtedly sincerely, as he put it) been endeavoring to further friendly relations between our two countries, had stepped into the picture and devised certain formulas and, he was afraid, had succeeded in obscuring the picture rather than clarifying it. He said he thought these efforts had resulted in a good deal of delay. He consequently wondered whether it would not be advantageous to make a fresh approach and, with full regard for the principles set forth by this Government, to undertake the development of new formulas. I said to the Minister that I thought this suggestion might be very helpful and, if he would prepare the new formulas which he had in mind, they would receive immediate consideration here. I said that everyone, from the Secretary of State down, had made it clear that we would be only too glad to contribute as much time and thought as might be necessary in order to further a satisfactory solution.\n\nI stated that it seemed to me that from the standpoint of expediency and wisdom it might be well to see if we could not, first of all, reach an agreement on the economic principles involved. I wondered, I said, if the statesmen in the new Japanese cabinet understood as fully as he did what the practical advantages to Japan would be if it adopted the economic policies as set forth by Secretary Hull. Surely, I said, they must recognize, if they understood it, how much Japan would profit if, for example, British imperial preferences were abolished and Japan could trade with all of the Pacific nations, including Canada, Australia and New Zealand, on the same terms on which England could trade.\n\nMr. Wakasugi seemed to be very sincere in emphasizing his own belief in the desirability of Japanese wholehearted agreement in the nondiscrimination commercial policy proposed by this Government. I said that if we could reach an agreement on this front we could then pass with more encouragement to finding a satisfactory agreement with regard to the other principles advanced by the United States. I emphasized my belief that it would be wise to take up the more knotty problems after we had reached an agreement on what perhaps was the principle on which both Governments could agree now.\n\n[696면]\n\nThe Minister then went back to the thread-bare issue of the belief on the part of the Japanese people that their failure to possess certain natural resources under their own sovereignty made them the victims of economic aggression and economic encirclement at the will of other powers. I asked the Minister if he, or any other Japanese, could deny that, during the period of their modern history up to the year 1930, when Japan had a most friendly relationship with both Great Britain and the United States, through that relationship and because of the fact that their national policy was in general alignment with the policy of the two Governments I had mentioned, Japan had not rapidly become one of the great powers of the world and had enjoyed a period of great prosperity. The Minister said that of course that was the case. I said it seemed to me that Japan had never even thought of alleging economic encirclement until the sinister slogan brought forward by Hitler of “have and have not nations” had been dinned into the ears of the peoples of the world and until Japan herself had departed from her traditional friendships and had engaged upon new adventures and policies.\n\nThe Minister said that, while it was true that the younger generation in Japan had been responsive to the pernicious disease which was spreading over the world, Japan nevertheless was pursuing her own independent policies and was not to be regarded as being subservient in her national determinations of policy to either Germany or Italy. I said that this might be the case but that Japan nevertheless formally and officially and publicly had placed herself in the Axis camp and that no friend of Japan could deny that, so far as practical results were concerned and so far as the well-being and prosperity of the Japanese people were involved, Japan had not only gained nothing therefrom but had been gravely prejudiced.\n\nMr. Wakasugi made no denial of this. He remained quiet.\n\nMr. Wakasugi then changed the subject and said that in his last conversation with Secretary Hull the latter had inquired whether he had any contacts with Chinese friends here in this country. The Minister reminded me that he had replied that while he knew the Chinese Ambassador, Dr. Hu Shih, he was not seeing him on account of the situation between his country and China. The Minister said that it seemed to him all important that every approach be undertaken in order to bring about a settlement of the conflict between China and Japan, since nothing would be more conducive than this to a settlement of all of the Pacific problems. He inquired whether—and he stated that this was to be regarded as entirely unofficial—I would be willing to meet with himself and the Chinese Ambassador or any other Chinese officials who might be able to speak for their country. He said that if any official effort was ever to be made by the President [697면] of the United States to further the reaching of a peaceful solution between Japan and China it must certainly first be ascertained whether the Government of Chiang Kai-Shek would be disposed to reach an agreement with Japan.\n\nI replied that obviously the Minister did not expect me even personally and unofficially to give him any response to this suggestion without very careful consideration and the opportunity to study this possibility. I said that I would, however, give the matter the most careful thought and that I would be prepared to discuss with him in one of our next conversations what my individual views might be as to the feasibility of the suggestion he had made.\n\nThe Minister made no reference to any plans for departure on the part of the Ambassador and I did not question him with regard thereto. He did, however, specifically state that as soon as more detailed instructions were received from his Government the Ambassador would be taking part in the conversations between the two Governments.\n\nThe Minister said that as soon as these instructions were received he would immediately let me know and that he would urge his Government to expedite the sending of such instructions.\n\nS[umner] W[elles]", "notes": [], "warn": false, "pages": ["0759", "0760", "0761", "0762", "0763"], "search": "웰스(Sumner Welles) — 국무차관, 비망록 작성자 와카스기(若杉要, Wakasugi) — 주미 일본대사관 공사 헐(Cordell Hull) — 국무장관 녹스(Frank Knox) — 해군장관 노무라(野村吉三郎, Nomura) — 주미 일본대사(본문에는 「대사」로만 표기) 히틀러(Adolf Hitler) 후스(胡適, Hu Shih) — 주미 중국대사 장제스(蔣介石, Chiang Kai-Shek) — 본문 표기 그대로 루스벨트(Franklin D. Roosevelt) — 대통령(본문에는 「미국 대통령」으로 표기)"}, {"id": "d375", "order": 375, "date": "1941-10-25", "group": "A", "eyebrow": "d375 · Memorandum by the Ambassador in Japan (Grew)", "title": "주일대사(그루)의 비망록", "badge": null, "list_right": "문서 375", "meta": [{"k": "일자", "v": "1941-10-25"}, {"k": "시각", "v": "this evening (오늘 저녁)"}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2625", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 375 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d375"}], "summary": "믿을 만한 일본인 제보자가 고노에 내각 붕괴 직전 천황이 어전에서 군부에 개전 회피를 명한 경위와, 도조·도고가 미일회담 타결을 목표로 취임했다는 사정을 그루에게 전한다.", "points": ["고노에 내각 붕괴 직전, 천황이 추밀원과 일본 군부의 수뇌들을 불러 미국과의 전쟁이 없도록 보장할 정책을 추진할 용의가 있는지 물었다.", "육해군 대표들은 천황의 물음에 답하지 않았고, 천황은 조부 메이지 천황의 진취적 정책을 들어 전례 없는 조치로 군에 자기 뜻을 따르라고 명했다.", "천황의 확고한 태도 때문에 육군을 실효적으로 통제할 수 있는 총리를 골라야 했고, 그 결과 고노에 공이 사임하고 도조 대장이 임명되었다. 도조는 현역 명부에 남은 채로 현재의 미일회담을 성공적으로 매듭짓겠다는 정책에 서약해 있다.", "최근 일본 언론의 반미 논조와 친추축 세력의 극단적 견해는 일본 각계, 특히 현 정치 지도자들이 어떻게든 대미관계를 조정해야 한다고 바라는 실상을 전혀 보여 주지 못한다.", "신임 외상 도고는 현재의 회담을 성공적으로 끝맺으려는 명확한 목표를 가지고 취임을 수락했으며, 실패하면 사임한다는 양해가 있었다.", "일본 지도자들 사이에서는 대미 양해의 주된 난점이 중국과 인도차이나로부터의 일본군 철수 문제라는 인식이 퍼져 있으나, 미국이 그 지역의 모든 일본군을 즉시 철수하라고 고집하여 일본을 불가능한 처지에 몰아넣지만 않는다면 그 철수는 성공적으로 이루어질 수 있고 또 이루어질 것이라고 그들은 확신한다.", "최고위층과 접촉하는 제보자는, 지금의 정세와 현존하는 일본의 정치 구도가 10년 만에 처음으로 일본의 정책과 행동을 재정향할 가능성을 제공한다고 말했다."], "primary": "[도쿄,] 1941년 10월 25일.\n\n그 제보자[주34]가 자기 요청으로 오늘 저녁 나를 찾아왔다. 그는 고노에(近衞文麿, Konoye) 내각이 무너지기 바로 전에 추밀원과 일본 군부의 주요 인사들이 참석하는 회의가 천황에 의해 소집되었고, 천황이 미국과의 전쟁이 없으리라는 것을 보장할 정책을 추진할 준비가 되어 있는지 물었다고 나에게 말했다. 이 회의에 참석한 육군과 해군의 대표들은 천황의 물음에 답하지 않았고, 그러자 천황은 자기 조부인 메이지 천황이 추진했던 진취적 정책을 언급하면서, 전례 없는 조치로 군에 자기 뜻에 따를 것을 명했다. 천황의 명확한 태도 때문에 육군을 실효적으로 통제할 수 있는 위치에 있는 총리를 선임하는 일이 불가피해졌고, 이어서 고노에 공이 사임하고 도조(東條英機, Tojo) 대장이 임명되기에 이르렀다. 도조는 육군 현역 명부에 남아 있으면서도 현재의 미일회담을 성공적으로 타결하려 시도한다는 정책에 서약해 있다.\n\n[698면]\n\n제보자는 나에게, 최근 일본 언론의 반미적 논조와 친추축 분자 및 그 밖의 일부 분자들이 표명하는 극단적 견해는, 어떤 식으로든 미국과의 관계 조정이 이루어져야 한다는 일본 각계 각층의, 특히 현재 정치 지도자들의 바람을 전혀 실제로 나타내 주지 못한다고 강조했다. 그는 이와 관련하여, 신임 외상 도고(東郷茂徳, Togo) 씨가 현재의 회담을 성공적인 결말로 이끌고자 노력한다는 구체적인 목표를 가지고 그 임명을 수락했으며, 만일 그가 이에 실패하면 그 자리에서 물러나기로 양해되어 있었다고 덧붙였다.\n\n미국과의 양해를 가로막는 주된 난점이 중국과 인도차이나로부터의 일본 군대 철수 문제라는 생각이 일본 지도자들 사이에 퍼져 있다. 그러나 바로 그 지도자들은, 이 지역들의 일본군 전부를 즉시 철수하라는 미국 측의 고집으로 일본이 불가능한 처지에 놓이지만 않는다면, 그러한 철수가 성공적으로 이루어질 수 있고 또 이루어질 것이라고 확신하고 있다.\n\n최고위 계층과 접촉하고 있는 제보자는 이어서, 현재의 정세와 일본에 현존하는 정치 구도가 10년 만에 처음으로 일본의 정책과 행동을 재정향할 가능성을 열어 준다고 말했다.\n\nJ[oseph] C. G[rew]", "secondary": "[Tokyo,] October 25, 1941.\n\nThe informant [주34] called on me at his own request this evening. He told me that just prior to the fall of the Konoye Cabinet a conference of the leading members of the Privy Council and of the Japanese armed forces had been summoned by the Emperor, who inquired if they were prepared to pursue a policy which would guarantee that there would be no war with the United States. The representatives of the Army and Navy who attended this conference did not reply to the Emperor’s question, whereupon the latter, with a reference to the progressive policy pursued by the Emperor Meiji, his grandfather, in an unprecedented action ordered the armed forces to obey his wishes. The Emperor’s definite stand necessitated the selection of a Prime Minister who would be in a position effectively to control the Army, the ensuing resignation of Prince Konoye, and the appointment of General Tojo who, while remaining in the Army active list, is committed to a policy of attempting to conclude successfully the current Japanese-American conversations.\n\n[698면]\n\nThe informant emphasized to me that the recent anti-American tone of the Japanese press and the extreme views expressed by pro-Axis and certain other elements gave no real indication of the desire of Japanese of all classes and in particular of the present political leaders that in some way or other an adjustment of relations with the United States must be brought about. He added in this connection that Mr. Togo, the new Foreign Minister, had accepted his appointment with the specific aim of endeavoring to pursue the current conversations to a successful end and it had been understood that should he fail in this he would resign his post.\n\nThe belief is current among Japanese leaders that the principal difficulty in the way of an understanding with the United States is the question of the removal of Japanese armed forces from China and Indochina, but these same leaders are confident that, provided Japan is not placed in an impossible position by the insistence on the part of the United States that all Japanese troops in these areas be withdrawn at once, such a removal can and will be successfully effected.\n\nThe informant, who is in contact with the highest circles, went on to say that for the first time in ten years the situation at present and the existing political set-up in Japan offer a possibility of a reorientation of Japanese policy and action.\n\nJ[oseph] C. G[rew]", "notes": ["[주34] 「믿을 만한 일본인 제보자.」"], "warn": false, "pages": ["0764"], "search": "그루(Joseph C. Grew) — 주일 미국대사, 비망록 작성자 고노에(近衞文麿, Konoye) — 전 총리 도조(東條英機, Tojo) — 총리, 육군 대장 도고(東郷茂徳, Togo) — 신임 외상 히로히토(Hirohito) — 천황(원문은 'the Emperor'로만 표기) 메이지 천황(Emperor Meiji) — 천황의 조부"}, {"id": "d376", "order": 376, "date": "1941-10-25", "group": "C", "eyebrow": "d376 · Memorandum of Comment by the Ambassador in Japan (Grew)", "title": "주일대사 그루의 소견 각서", "badge": null, "list_right": "문서 376", "meta": [{"k": "일자", "v": "1941-10-25"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2625", "txt": true}, {"k": "발신", "v": "주일대사 그루(Joseph C. Grew)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 376 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d376"}], "summary": "그루가, 일본이 팽창 정책을 버릴 뜻이 없다는 미국 내 통념은 논리적일지 모르나 틀렸다고 보며, 천황이 처음으로 정책 형성에 적극 나섰다는 정보가 사실이라면 도조 내각에서 회담이 더 구체화될 수 있다고 적은 소견.", "points": ["일본 언론이 미국 해군장관(녹스)의 발언을 크게 보도했다. 일본이 팽창 정책을 버릴 뜻이 없으며 그 정책을 밀고 나가면 미국과의 충돌이 불가피하다는 미국 정부의 확신을 밝힌 발언이다.", "그루는 그 통념이 논리적일 수는 있으나 오류가 있다고 본다. 미국과 실행 가능한 양해에 이를 수 있다면 현 일본 지도자들은 무력에 의한 팽창 계획을 기꺼이 포기하리라는 것이다.", "9월 29일 정오 발신 제1529호 전보의 분석에 덧붙일 것이 별로 없으며, 특히 그 제5항과 제10항의 제언은 여전히 유효하다고 한다.", "다만 대통령과 일본 총리의 회담을 전제로 예상했던 교섭 절차는 이제 바꾸어야 할지 모른다고 한다.", "천황이 처음으로 정책 형성에 적극 관여하고 있다는 정보 제공자의 진술이 사실이라면, 도조 대장과 신임 외상이 회담을 지금까지보다 구체화하려는 더 적극적인 시도를 하리라 예상할 수 있다. 다만 신임 외상을 만나 보기 전까지는 순전한 추측이라고 한다.", "첫 회담에서 그루는 아무것도 먼저 제기하지 않을 것이며, 미국 정부는 회담이 워싱턴에서 계속되고 도쿄에서는 다만 병행될 뿐이기를 바란다는 점을 분명히 하겠다고 한다.", "천황이 이 문제에서 그와 같은 적극적 태도를 취하지 않았더라면 제1529호 제8항에서 언급한 사태가 아마 벌어졌으리라고 확신한다."], "primary": "[도쿄,] 1941년 10월 25일.\n\n일본 언론은 미국 해군장관의 발언, 즉 미국 정부는 일본이 팽창 정책을 버릴 뜻이 없다고 확신하게 되었으며 만일 그 정책을 계속 밀고 나간다면 미국과의 충돌은 피할 수 없다는 취지의 발언을 크게 다루었다. 본 대사관의 유리한 위치에서 보면, 일본이 팽창 정책을 포기할 의사가 없다는 미국 안팎의 널리 퍼진 확신이 논리적일 수는 있으나, 그럼에도 이 견해의 오류는 다음의 사실에서 찾을 수 있음이 분명하다. 즉 현재의 일본 지도자들은 미국과 실행 가능한 양해에 이를 수만 있다면 무력에 의한 팽창 계획을 기꺼이 포기하려 한다는 사실이다.\n\n정보 제공자의 관찰과 관련하여, 9월 29일 정오 본직이 국무부에 보낸 제1529호 전보에 제시한 분석에 덧붙일 것은 거의 없으며, 거기서 제시한 제언들, 특히 제5항과 제10항의 제언은 [699면] 대통령과 일본 총리의 회담을 상정하며 예상했던 교섭 절차가 이제 변경되어야 할지도 모른다는 사실에도 불구하고 여전히 유효하다. 만일 — 본직으로서는 의심할 이유가 없거니와 — 천황이 일본에서 처음으로 정책의 형성에 적극적으로 관여하고 있다는 정보 제공자의 진술과 미국과 합의에 도달한다는 공표된 목표가 사실이라면, 도조 대장과 신임 외상이 현재의 회담을 지금까지보다 더 구체적인 것으로 만들려는 한층 적극적인 시도를 하리라고 예상할 수 있다. 다만 이 의견은 본직이 신임 외상을 만나 보기 전까지는 한낱 추측에 지나지 않는다. 이와 관련하여, 외상의 접근 방식이 어떠한 성격의 것이든, 첫 회담에서 본직은 물론 아무것도 먼저 제기하지 않을 것이며, 본국 정부는 회담이 워싱턴에서 계속되고 이곳에서는 다만 병행되기만을 바란다는 점을 분명히 할 것이다.\n\n입수할 수 있는 정보로 보아 본직은, 만일 천황이 이 문제에 관하여 그가 취한 바와 같은 적극적인 태도를 취하지 않았더라면 9월 29일 정오 본직의 제1529호 제8항에서 언급한 사태가 아마도 전개되었으리라고 상당히 확신한다.\n\nJ[oseph] C. G[rew]", "secondary": "[Tokyo,] October 25, 1941.\n\nThe Japanese press has given prominence to the remarks made by the American Secretary of the Navy to the effect that the Government of the United States has become convinced that Japan does not intend to abandon its policy of expansion and that should this policy be pursued a conflict with the United States is unavoidable. From the vantage point of this Embassy it is apparent that while the widespread conviction in the United States and abroad that Japan has no intention of giving up its policy of expansion may be logical, nevertheless the fallacy of this view may be found in the fact that the present Japanese leaders are willing to give up their expansionist plans through armed force if a workable understanding can be reached with the United States.\n\nIn relation to the informant’s observations, there is little that can be added to the analysis set forth in my telegram to the Department No. 1529 of September 29, noon, and the suggestions advanced therein, particularly in paragraphs 5 and 10, still obtain despite the fact that [699면] the procedure of negotiations anticipated in the suggested meeting between the President and the Japanese Prime Minister may now have to be changed. If, as I have no reason to doubt, the informant’s statement that the Emperor is for the first time actively engaged in the formulation of policy in Japan and the announced aim of reaching an agreement with the United States is true, some more positive attempt by General Tojo and the new Foreign Minister to render the current conversations more concrete than has heretofore been the case may be anticipated, an opinion, however, which must be mere speculation until I have seen the new Foreign Minister. In this connection, whatever may be the character of the Foreign Minister’s approach, in our first conversation I shall of course initiate nothing and shall make it clear that my Government desires that the conversations be continued in Washington and only paralleled here.\n\nFrom the available information I am quite convinced that had the Emperor not taken the positive stand which he did on this issue, the situation mentioned in paragraph 8 of my 1529, September 29, noon, would probably have developed.\n\nJ[oseph] C. G[rew]", "notes": [], "warn": false, "pages": ["0765"], "search": "그루(Joseph C. Grew) — 주일 미국대사, 각서 작성자 녹스(Frank Knox) — 미국 해군장관. 원문에는 「미국 해군장관」으로만 적혀 있다 도조(東條英機, Tojo) — 일본 총리, 원문은 「General Tojo 도조 대장」 도고(東郷茂徳, Togo) — 신임 외상. 원문에는 「신임 외상」으로만 적혀 있다 히로히토(裕仁, Hirohito) — 천황. 원문에는 「the Emperor 천황」으로만 적혀 있다"}, {"id": "d192", "order": 192, "date": "1941-10-28", "group": "D", "eyebrow": "d192 · The Secretary of State to the Ambassador in Japan (Grew)", "title": "국무장관이 주일대사 그루에게", "badge": null, "list_right": "문서 192", "meta": [{"k": "일자", "v": "1941-10-28"}, {"k": "시각", "v": "1941년 10월 28일 오후 11시 발신"}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "694"}, {"k": "원문출처", "v": "894.85/656a: Telegram", "txt": true}, {"k": "발신", "v": "국무장관 헐(Cordell Hull)", "txt": true}, {"k": "수신", "v": "주일대사 그루(Joseph Grew)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 192 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d192"}], "summary": "일본 기선 다쓰타마루·기카와마루·다이요마루의 징용 명령과 관련하여, 국무부가 일본 정부의 면제 주장을 인정하고 법무장관에게 조치를 요청했음을 그루 대사에게 알린 전보.", "points": ["일본 기선 다쓰타마루(Tatuta Maru)·기카와마루(Kikawa Maru)·다이요마루(Taiyo Maru) 세 척의 징용 명령에 관한 건이다.", "10월 16일 일본대사가 국무부에 3인칭 각서를 보내어 이 배들의 공적 지위를 밝히고, 미국과 그 영토의 항구·수역에 있는 동안 미국·주·영토 법원의 관할권으로부터 면제를 부여해 달라고 일본 정부를 대신하여 요청했다.", "각서에는 일본 체신성(Ministry of Communications)의 징용 명령 번역문이 첨부되어 있었다.", "10월 17일 국무장관이 그 각서 사본을 법무장관에게 보내면서, 일본대사 각서의 진술을 국무부가 사실로 받아들였고 일본 정부의 면제 주장을 인정했다고 통지했다.", "국무장관은 동시에, 이 배들이 기항할 항구의 관할 법원에 이 사안을 알리고 면제를 인정받도록 적절한 조치를 취할 것을 요청했다.", "그루 대사가 전보에서 언급한 모든 문서는 국무부 기록을 완성하기 위해 우편으로 보내라고 지시했다."], "primary": "[요지(Substance)]\n\n워싱턴, 1941년 10월 28일—오후 11시.\n\n694. 일본 기선 다쓰타마루(Tatuta Maru), 기카와마루(Kikawa Maru), 다이요마루(Taiyo Maru)의 징용 명령을 주제로 한 귀하의 최근 전보들과 관련하여:\n\n10월 16일 일본대사가 국무부에 3인칭 각서를 보내어[주64] 이 선박들의 공적 지위에 관하여 알리고, 일본 정부를 대신하여 이 세 척에 대해 미국 및 그 영토의 항구와 수역에 있는 동안 미국·미국 각 주·미국 영토 법원의 관할권으로부터 면제를 부여해 줄 것을 요청하였다. 이 각서에는 일본 체신성에 의한 이 선박들의 징용 명령 번역문(귀하가 전보 가운데 하나에서 언급한 바 있는 것)이 동봉되어 있었다.\n\n10월 17일 국무장관은 이 각서의 사본을 법무장관에게 보냈으며, 법무장관에게는 일본대사의 각서에 담긴 진술을 국무부가 진실한 것으로 받아들였고 일본 정부의 면제 주장을 인정하였다는 점을 통지하였다. 국무장관은 동시에, 이 선박들이 기항할 항구의 관할 법원들에 이 사안을 통보하고, 그 법원들이 이 세 척 일본 선박의 면제를 인정하도록 모든 적절한 조치를 취할 것을 요청하였다.\n\n귀하의 전보들에서 언급된 모든 문서는 국무부의 기록을 완성하기 위하여 우편으로 국무부에 보내야 한다.\n\n헐\n\n[273면]", "secondary": "[Substance]\n\nWashington, October 28, 1941—11 p.m.\n\n694. With reference to your recent telegrams on the subject of requisition orders of the Japanese liners Tatuta Maru, Kikawa Maru, and Taiyo Maru:\n\nA third-person note was sent by the Japanese Ambassador on October 16 to the Department [주64] concerning the official status of these ships and requesting on behalf of the Japanese Government the grant to the three vessels of immunity while in ports and waters of the United States and its territories from the jurisdiction of courts of the United States, its states, and its territories. The note enclosed translations of the requisition orders of these ships by the Japanese Ministry of Communications (which you mentioned in one of your telegrams).\n\nA copy of the note was sent by the Secretary of State on October 17 to the Attorney General who was informed that the statements in the note from the Japanese Ambassador were accepted by the Department as true and the Japanese Government’s claim of immunity was allowed. The Secretary at the same time requested that the appropriate courts in the ports which the vessels would visit should be advised of this matter and that all proper steps be taken toward recognition by those courts of the immunity of these three Japanese ships.\n\nAll the documents mentioned in your telegrams should be sent by mail to the Department for the completion of its record.\n\nHull\n\n[273면]", "notes": ["[주64] 수록하지 않음."], "warn": false, "pages": ["0339"], "search": "헐(Cordell Hull) — 미국 국무장관 그루(Joseph Grew) — 주일 미국대사 노무라(野村吉三郎, Nomura) — 주미 일본대사(원문에는 「일본대사」로만 적혀 있다)"}, {"id": "d377", "order": 377, "date": "1941-10-30", "group": "C", "eyebrow": "d377 · Memorandum by the Ambassador in Japan (Grew)", "title": "주일 대사(그루) 각서", "badge": null, "list_right": "문서 377", "meta": [{"k": "일자", "v": "1941-10-30"}, {"k": "시각", "v": "오후 (this afternoon)"}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2625", "txt": true}, {"k": "발신", "v": "그루(Joseph C. Grew) — 주일 미국대사", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 377 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d377"}], "summary": "새 외상 도고 시게노리가 외교단장들을 접견한다. 미일 관계 악화를 지적하며 회담의 조속한 타결을 바란다고 말하고, 그루 대사는 회담이 워싱턴에서 진행되어야 한다는 국무장관의 뜻을 설명한다.", "points": ["1941년 10월 30일 오후, 새 외상 도고 시게노리(東郷茂徳)가 외교단 공관장들을 접견했다. 통역은 가세(加瀬俊一)가 맡았다.", "도고는 몇 해 전 자신이 외무성에 있을 때에도 미일 관계가 좋지 않았는데 그 뒤로 계속 악화되어 왔고, 이 악화가 멈추지 않으면 지극히 중대한 위험을 안고 있다고 말했다.", "도고는 지난봄부터 이어져 온 미일 간 비공식 회담이 계속되어 지체 없이 성공적으로 매듭지어지기를 바란다며 그루의 협력을 요청했다.", "도고는 진전을 보려면 미국이 몇 가지 현실과 사실을 직시해야 한다며 중국에 일본군이 주둔하고 있는 사실을 들고, 다른 나라들도 중국 일부 지역에 군대를 두고 있다며 외몽골 주둔 소련군을 예로 들었다.", "그루는 대통령이 긴밀하고 적극적인 관심을 가지고 있기 때문에 회담이 워싱턴에서 진행되어야 한다는 국무장관의 희망을 설명했다.", "그루는 10월 24일 국무차관과 와카스기의 회담을 보고한 국무부 전보(국무부 제689호, 10월 25일 오후 5시)의 요지를 도고에게 건넸다.", "그루는 특별히 중요하다고 여긴 사안을 별도 서한으로 외상에게 직접 알리던 종전 관행을 도고도 승인하는지 물었고 도고는 그렇다고 답했다.", "가세는 자신이 외무성 미국국 제1과장으로 임명되었으며 외상과 대사 사이의 직접 연락 통로가 되겠다고 말했다."], "primary": "[도쿄,] 1941년 10월 30일.\n\n오늘 오후 외교단 공관장들이 신임 외상 도고 시게노리(東郷茂徳, Shigenori Togo) 씨의 접견을 받았다. 가세(加瀬俊一, Kase) 씨가 통역을 맡았다. 여느 때와 같이 신문 사진 촬영이 있고 적절한 인사가 오간 뒤, 도고 씨는 미국과 일본의 관계가, 몇 해 전 자신이 전에 외무성에 있었을 때에도 그리 좋지 않았으나 그 뒤로 점차 악화되어 현재의 상황에 이르렀으며, 이 악화가 멈추지 않는다면 이는 지극히 중대한 위험을 안고 있는 것이라고 말했다. 지난봄부터 일본 정부와 미국 정부 사이에 진행되어 온 비공식 회담을 언급하면서, 외상은 그 회담이 계속되고 지체 없이 성공적으로 결론에 이르기를 바란다는 뜻을 밝혔다. 그는 이 목적을 이루는 데 나의 협력을 요청했다.\n\n도고 씨는 진전을 보려면 미국이 어떤 현실과 사실들을 직시하여야 한다고 말하고, 그러면서 중국에 일본 군대가 주둔하고 있는 일을 들었다. 그는, 다른 나라들도 현재 중국의 어떤 지역들에 군대를 두고 있으며, 예컨대 외몽골에 주둔한 소련 군대가 그러하다고 말했다. 외상은 예비 회담에 관하여 그 이상 언급하지 않았으나, 머지않아 나와 다시 이야기를 나누기를 바란다고 말했다.\n\n[700면]\n\n나는 이에 답하여 외상과 협력하고자 하는 나의 뜻을 확언한 뒤, 대통령이 이 문제에 긴밀하고 적극적인 관심을 가지고 있기 때문에 회담이 워싱턴에서 진행되어야 한다는 국무장관의 희망을 설명하였다. 다만 도쿄에서의 병행 회담은 미국 정부의 견해로 전해진 바를 더 완전하고 더 정확하게 만들 기회를 준다는 점에서 흔히 도움이 되었으므로, 나는 과거 몇 차례 국무장관으로부터 직접 나에게 보고된 워싱턴 회담의 요지를 외무대신에게 전한 바 있다. 이에 나는 10월 24일 국무차관과 와카스기(若杉要, Wakasugi) 씨의 회담을 보고한 국무부 전보(국무부 제689호, 10월 25일 오후 5시[주35])의 파라프레이즈를 도고 씨에게 건넸는데, 외상이 그로부터 이 예비 회담에 대한 미국 정부의 태도를 분명히 이해하게 되리라 여겼기 때문이다.\n\n나는 도조(Tojo) 씨[sic]에게, 외상이 미국 대사관이 외무성으로 보내는 모든 왕복 문서를 몸소 다 읽는 것은 물론 불가능하므로, 내가 특별히 중요하다고 여긴 사안들은 도요다(豊田貞次郎, Toyoda) 제독의 동의를 얻어 별도 서한으로 그의 직접적인 주의를 환기시키는 것이 지금까지 나의 관행이었다고 말하였다. 도고 씨도 내가 그와 같은 관행을 그대로 지키는 것을 승인하겠는지 묻는 나의 질문에 외상은 그렇다고 답하였고, 회견은 그것으로 끝났다.\n\n내가 자리를 뜨려 할 때 가세 씨는, 자신이 외무성 미국국 제1과장으로 임명되었으며 내가 원할 때에는 언제든지 외상과 나 사이의 직접적인 연락 통로 노릇을 하게 되어 기쁘겠다고 말했다. 나는 가세 씨에게 감사하면서, 전에 유쾌하게 함께 일하던 일을 떠올리며 외상과의 회담에서 그를 다시 통역의 자리에서 만나게 되어 반갑다고 말했다.\n\nJ[oseph] C. G[rew]", "secondary": "[Tokyo,] October 30, 1941.\n\nThe diplomatic chiefs of mission were received this afternoon by Mr. Shigenori Togo, the new Foreign Minister. Mr. Kase acted as interpreter. The usual press photographs having been taken and appropriate amenities exchanged, Mr. Togo remarked that the relations between the United States and Japan, which had not been very good when he formerly was in the Foreign Office several years ago, had since then progressively worsened to the present situation which, if this deterioration were not terminated, was fraught with the gravest dangers. Referring to the informal conversations which had been carried on since last spring between the Japanese and the American Governments, the Minister declared his desire that the conversations be continued and without delay be successfully brought to a conclusion. He requested my cooperation in accomplishing this objective.\n\nMr. Togo said that in order to make progress, the United States should face certain realities and facts and he thereupon cited the stationing in China of Japanese armed forces. Other nations, he said, at present maintained troops in certain areas of China, for instance the Soviet soldiery stationed in Outer Mongolia. The Minister made no further allusion to the preliminary conversations but stated that he hoped to have subsequent talks with me in due time.\n\n[700면]\n\nAfter assuring the Minister, in reply, of my desire to cooperate with him, I described the wish of the Secretary of State that, because of the President’s close and active interest therein, the conversations should be carried on in Washington. However, as parallel talks in Tokyo were often helpful in that they afforded an opportunity for rendering more complete and more precise the reported views of the United States Government, I had on certain occasions in the past conveyed to the Minister for Foreign Affairs the substance of the conversations in Washington which were reported to me directly from the Secretary of State. Hereupon I gave to Mr. Togo a paraphrase of the Department’s telegram reporting the Under Secretary’s conversation with Mr. Wakasugi on October 24 (Department’s 689, October 25, 5 p.m. [주35] ), as I felt that the Foreign Minister would derive therefrom a clear understanding of the attitude of the Government of the United States toward these preliminary conversations.\n\nI told Mr. Tojo that, as it was of course impossible for the Foreign Minister personally to read all of the correspondence directed by the American Embassy to the Foreign Office, it had been in the past my practice to bring in separate letters to the direct attention of Admiral Toyoda, with the latter’s approval, those matters which I had considered of especial importance. In reply to my question whether Mr. Togo would approve of my observing the same practice with him, the Minister replied in the affirmative and the interview was brought to a close.\n\nAs I was leaving, Mr. Kase told me that he had been designated Chief of the First Section of the American Bureau of the Ministry of Foreign Affairs and that he would be happy to serve as a direct avenue of communication between the Foreign Minister and myself whenever I might desire. In thanking Mr. Kase I said that, recalling our former pleasant association, I was glad once again to find him in the role of interpreter during my conversations with the Foreign Minister.\n\nJ[oseph] C. G[rew]", "notes": ["[주35] 수록하지 않음. 1941년 10월 24일 국무차관 각서, 692면을 보라."], "warn": false, "pages": ["0766"], "search": "그루(Joseph C. Grew) — 주일 미국대사, 각서 작성자 도고(東郷茂徳, Shigenori Togo) — 일본 외상 가세(加瀬俊一, Kase) — 통역, 외무성 미국국 제1과장 와카스기(若杉要, Wakasugi) — 주미 일본공사 도요다(豊田貞次郎, Toyoda) — 전 외상, 해군 제독 웰스(Sumner Welles) — 국무차관 (본문에 직위로만 등장) 헐(Cordell Hull) — 국무장관 (본문에 직위로만 등장)"}, {"id": "d378", "order": 378, "date": "1941-11-03", "group": "C", "eyebrow": "d378 · Memorandum by the Ambassador in Japan (Grew)", "title": "주일대사 그루의 각서", "badge": null, "list_right": "문서 378", "meta": [{"k": "일자", "v": "1941-11-03"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2625", "txt": true}, {"k": "발신", "v": "주일대사 그루(Joseph Grew)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 378 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d378"}], "summary": "믿을 만한 일본인 정보 제공자로부터 전해 들은 바, 도조 내각이 대미 관계 조정을 위해 어디까지 나아갈지에 관한 확정적 결정을 내려 11월 2일 오후 천황에게 상주했다는 그루 대사의 기록.", "points": ["10월 25일에 이어 같은 「믿을 만한 일본인 정보 제공자」가 11월 3일 그루를 다시 찾아왔다.", "정보 제공자는 전날 외상을 만나 미일 회담 재개 전망을 타진했다고 알렸다.", "외상은 지난 며칠간 총리 및 해군대신과 밤낮으로 회의를 거듭했으며, 그 결과 정부가 대미 관계 조정에 관한 천황의 뜻을 실행함에 있어 어디까지 나아갈 용의가 있는지에 관하여 확정적 결정에 이르렀다고 말했다.", "이 결정은 극비에 부쳐졌으며, 11월 2일 오후 총리가 천황에게 상주하였다.", "외상은 며칠 안에 그루에게 장시간의 회담을 청할 것으로 예상한다는 인상을 주었다.", "일본 외상이 총리(현역 육군 장교이며 육군대신과 내무대신을 겸임)와 해군대신의 전폭적 지지·승인을 업고 의무를 떠맡을 수 있는 위치에 선 것은 수년 만에 처음이라고 정보 제공자는 말했다.", "11월 15일 의회(제국의회) 개회 전에 대미 관계 문제를 정리해야 하므로, 외상이 늦어도 11월 7일까지는 그루를 부를 것으로 보았다. 다가올 의회는 정부가 면밀히 조직할 것이며 방만하거나 무책임한 발언은 허용되지 않으리라고 했다.", "그루는 자신이 외상에게 이미 말한 바, 즉 실제 회담은 워싱턴에서 진행되고 도쿄에서는 그와 병행할 뿐이라는 점을 정보 제공자에게 되풀이해 말했다."], "primary": "[도쿄,] 1941년 11월 3일.\n\n오늘 나는 10월 25일 나를 찾아왔던 바로 그 믿을 만한 일본인 정보 제공자의 방문을 받았다. 그는 일본과 미국 사이의 회담 재개 전망을 확인할 목적으로 어제 외상을 만났다고 나에게 알렸다. 외상은 그에게 말하기를, 지난 [701면] 며칠 동안 자신은 총리 및 해군대신과 밤낮으로 끊임없이 회의해 왔으며, 그 결과 정부는 미국과의 관계 조정에 대한 천황의 뜻을 실행함에 있어 어디까지 나아갈 용의가 있는지에 관하여 확정적 결정에 도달하였다고 하였다. 이 결정은 극도의 비밀에 부쳐져 있었으며, 11월 2일 오후에 총리가 천황에게 전달하였다. 외상은 나의 정보 제공자에게, 며칠 안으로 나를 불러 장시간의 회담을 갖기를 기대하고 있다는 인상을 전하였다.\n\n나의 정보 제공자에 따르면, 일본의 외상이 총리 — 현역 명부에 올라 있는 육군 장교이며 육군대신과 내무대신의 직도 아울러 맡고 있는 — 의 전폭적인 지지와 승인, 그리고 해군대신의 지지까지 얻은 상태에서 의무를 떠맡을 수 있는 위치에 서게 된 것은 여러 해 만에 처음 있는 일이었다. 나의 정보 제공자는 외상이 늦어도 11월 7일까지는 나를 부를 것이라는 의견이었는데, 이는 미국과의 관계 문제
