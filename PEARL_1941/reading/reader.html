nd for improvement of international conditions by peaceful methods and processes.\n\nIt is believed that in our discussions some progress has been made in reference to the general principles which constitute the basis of a peaceful settlement covering the entire Pacific area. Recently the [767면] Japanese Ambassador has stated that the Japanese Government is desirous of continuing the conversations directed toward a comprehensive and peaceful settlement in the Pacific area; that it would be helpful toward creating an atmosphere favorable to the successful outcome of the conversations if a temporary modus vivendi could be agreed upon to be in effect while the conversations looking to a peaceful settlement in the Pacific were continuing. On November 20 the Japanese Ambassador communicated to the Secretary of State proposals in regard to temporary measures to be taken respectively by the Government of Japan and by the Government of the United States, which measures are understood to have been designed to accomplish the purposes above indicated.\n\nThe Government of the United States most earnestly desires to contribute to the promotion and maintenance of peace and stability in the Pacific area, and to afford every opportunity for the continuance of discussions with the Japanese Government directed toward working out a broad-gauge program of peace throughout the Pacific area. The proposals which were presented by the Japanese Ambassador on November 20 contain some features which, in the opinion of this Government, conflict with the fundamental principles which form a part of the general settlement under consideration and to which each Government has declared that it is committed. The Government of the United States believes that the adoption of such proposals would not be likely to contribute to the ultimate objectives of ensuring peace under law, order and justice in the Pacific area, and it suggests that further effort be made to resolve our divergences of views in regard to the practical application of the fundamental principles already mentioned.\n\nWith this object in view the Government of the United States offers for the consideration of the Japanese Government a plan of a broad but simple settlement covering the entire Pacific area as one practical exemplification of a program which this Government envisages as something to be worked out during our further conversations.\n\nThe plan therein suggested represents an effort to bridge the gap between our draft of June 21, 1941 and the Japanese draft of September 25 by making a new approach to the essential problems underlying a comprehensive Pacific settlement. This plan contains provisions dealing with the practical application of the fundamental principles which we have agreed in our conversations constitute the only sound basis for worthwhile international relations. We hope that in this way progress toward reaching a meeting of minds between our two Governments may be expedited.\n\n[768면]", "notes": [], "warn": false, "pages": ["0833", "0834"], "search": "헐(Cordell Hull) — 미국 국무장관 노무라(野村吉三郎, Nomura) — 주미 일본대사"}, {"id": "d409", "order": 409, "date": "1941-11-26", "group": "C", "eyebrow": "d409 · Document Handed by the Secretary of State to the Japanese Ambassador (Nomura) on November 26, 1941", "title": "1941년 11월 26일 국무장관이 일본대사 노무라에게 건넨 문서", "badge": null, "list_right": "문서 409", "meta": [{"k": "일자", "v": "1941-11-26"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2504", "txt": true}, {"k": "발신", "v": "The Secretary of State 국무장관 헐(Cordell Hull)", "txt": true}, {"k": "수신", "v": "The Japanese Ambassador (Nomura) 일본대사 노무라(野村吉三郎)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 409 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d409"}], "summary": "이른바 「헐 노트」. 문서 자체의 표제는 「미합중국과 일본 사이의 협정을 위한 제안된 기초의 개요」이며, 머리에 「극비, 잠정적이며 구속력 없음」이라 적혀 있다. 제1절은 정책의 공동선언 초안이고, 제2절은 양국이 밟을 열 가지 조치다.", "points": ["문서가 스스로를 부르는 이름은 「미합중국과 일본 사이의 협정을 위한 제안된 기초의 개요(Outline of Proposed Basis for Agreement Between the United States and Japan)」다. 편철상의 표제는 「11월 26일 국무장관이 일본대사에게 건넨 문서(Document Handed…)」다.", "본문 머리에 「Strictly Confidential, Tentative and Without Commitment(극비, 잠정적이며 구속력 없음)」이라는 유보가 붙어 있다.", "「최후통첩(ultimatum)」이라는 낱말은 원문 어디에도 나오지 않는다. 「요구(demand)」라는 낱말도 쓰이지 않는다. 조항들은 모두 「제안한다(propose)」와 「할 것이다(will)」로 적혀 있다.", "제1절은 「정책의 공동선언 초안(Draft Mutual Declaration of Policy)」으로, 정치 원칙 4개와 경제 원칙 5개를 든다.", "제2절 제3항: 일본 정부는 중국과 인도차이나에서 육·해·공군 및 경찰 병력 전부를 철수한다. 시한이나 단계에 관한 문구는 없다.", "제2절 제4항: 양국 정부는 임시로 충칭에 수도를 둔 중화민국 국민정부 이외의 어떠한 중국 내 정부나 정권도 군사적·정치적·경제적으로 지지하지 않는다.", "제2절 제9항: 어느 한쪽이 제3국(들)과 맺은 어떠한 협정도 이 협정의 근본 목적, 곧 태평양 지역 전역의 평화 수립과 유지에 저촉되도록 해석하지 않기로 합의한다. 삼국동맹을 이름을 대지 않고 다룬 대목이다.", "제2절 제7항: 양국은 각각 미국 내 일본 자금과 일본 내 미국 자금에 대한 동결 조치를 해제한다.", "제2절 제5항: 양국은 조계·거류지 및 1901년 의화단 의정서상의 권리를 포함하여 중국에서의 모든 치외법권을 포기한다."], "primary": "워싱턴, 1941년 11월 26일.\n\n극비,\n잠정적이며\n구속력 없음.\n\n## 미합중국과 일본 사이의 협정을 위한 제안된 기초의 개요\n\n### 제1절\n\n#### 정책의 공동선언 초안\n\n미합중국 정부와 일본국 정부는 다 같이 태평양의 평화를 염려하는 바, 양국의 국가 정책이 태평양 지역 전역에 걸친 항구적이고 광범한 평화를 향하고 있으며, 양국이 그 지역에서 아무런 영토적 야심을 가지지 않고, 다른 나라를 위협하거나 어떠한 인접국에 대하여도 침략적으로 무력을 행사할 의도를 가지지 않으며, 따라서 국가 정책에서 서로에 대한 그리고 다른 모든 정부에 대한 양국 관계의 기초가 되는 다음의 근본 원칙들을 적극적으로 지지하고 실제로 적용할 것임을 확인한다.\n\n(1)\n\n각국 및 모든 국가의 영토 보전과 주권의 불가침 원칙.\n\n(2)\n\n타국의 내정에 불간섭한다는 원칙.\n\n(3)\n\n통상상의 기회 및 대우의 균등을 포함한 평등의 원칙.\n\n(4)\n\n분쟁의 방지와 평화적 해결을 위하여, 그리고 평화적 방법과 절차에 의한 국제 정세의 개선을 위하여 국제적 협력과 조정에 의존한다는 원칙.\n\n일본국 정부와 미합중국 정부는, 만성적인 정치적 불안정을 없애고 되풀이되는 경제적 붕괴를 막으며 평화의 기초를 마련하기 위하여, 서로에 대한 그리고 다른 나라들과 국민들에 대한 경제 관계에서 다음의 원칙들을 적극적으로 지지하고 실제로 적용할 것에 합의하였다.\n\n(1)\n\n국제 통상 관계에서의 무차별 원칙.\n\n(2)\n\n국제적 경제 협력의 원칙, 그리고 과도한 무역 제한으로 나타나는 극단적 국가주의의 철폐 원칙.\n\n(3)\n\n모든 나라가 원료 공급에 무차별로 접근한다는 원칙.\n\n(4)\n\n국제 상품 협정의 운용에 관하여 소비국과 소비 주민의 이익을 온전히 보호한다는 원칙.\n\n[769면] (5)\n\n모든 나라의 긴요한 사업과 지속적 발전을 도울 수 있고, 또한 모든 나라의 복리에 부합하는 무역 절차를 통한 결제를 가능하게 할 수 있는 국제 금융의 제도와 장치를 수립한다는 원칙.\n\n### 제2절\n\n#### 미합중국 정부와 일본국 정부가 밟을 조치\n\n미합중국 정부와 일본국 정부는 다음과 같이 조치를 밟을 것을 제안한다.\n\n1.\n\n미합중국 정부와 일본국 정부는 영제국, 중국, 일본, 네덜란드, 소비에트 연방, 타이 및 미합중국 사이에 다자간 불가침 조약을 체결하도록 노력할 것이다.\n\n2.\n\n양국 정부는 미국, 영국, 중국, 일본, 네덜란드 및 타이 각 정부 사이에, 각 정부가 프랑스령 인도차이나의 영토 보전을 존중할 것을 서약하고, 인도차이나의 영토 보전에 대한 위협이 발생할 경우에는 그 위협에 대처하기 위하여 필요하고 적절하다고 인정되는 조치를 취할 것을 목적으로 즉시 협의에 들어갈 것을 서약하는 협정을 체결하도록 노력할 것이다. 그 협정은 또한 협정 당사국인 각 정부가 인도차이나와의 무역이나 경제 관계에서 우선적 대우를 구하거나 받아들이지 아니하며, 각 서명국이 프랑스령 인도차이나와의 무역 및 통상에서 균등한 대우를 얻도록 그 영향력을 행사할 것을 규정한다.\n\n3.\n\n일본국 정부는 중국과 인도차이나로부터 육군, 해군, 공군 및 경찰 병력 전부를 철수한다.\n\n4.\n\n미합중국 정부와 일본국 정부는 임시로 충칭에 수도를 둔 중화민국 국민정부 이외의 어떠한 중국 내 정부나 정권도 군사적으로도 정치적으로도 경제적으로도 지지하지 아니한다.\n\n5.\n\n양국 정부는 조계 및 거류지에 관한 그리고 그에 관련한 권리와 이익, 그리고 1901년 의화단 의정서에 의한 권리를 포함하여 중국에서의 모든 치외법권을 포기한다.\n\n양국 정부는 국제 거류지 및 조계에서의 권리와 1901년 의화단 의정서에 의한 권리를 포함하여 중국에서의 치외법권을 포기하는 데 대한 영국 및 그 밖의 정부들의 동의를 얻도록 노력한다.\n\n6.\n\n미합중국 정부와 일본국 정부는 상호 최혜국 대우와 양국[770면]에 의한 무역 장벽의 인하에 기초하여, 미합중국이 생사(生絲)를 무관세 품목표에 묶어 두는 약속을 포함하는 통상 협정을 미합중국과 일본 사이에 체결하기 위한 교섭에 들어간다.\n\n7.\n\n미합중국 정부와 일본국 정부는 각각 미합중국 내 일본 자금과 일본 내 미국 자금에 대한 동결 제한을 해제한다.\n\n8.\n\n양국 정부는 달러-엔 환율의 안정을 위한 계획에 합의하며, 이 목적에 충분한 자금을 배정하되 절반은 일본이, 절반은 미합중국이 공급한다.\n\n9.\n\n양국 정부는 어느 한쪽이 어떠한 제3국 또는 제3국들과 체결한 어떠한 협정도, 이 협정의 근본 목적 곧 태평양 지역 전역에 걸친 평화의 수립과 유지에 저촉되는 방식으로 그 나라에 의하여 해석되지 아니한다는 데 합의한다.\n\n10.\n\n양국 정부는 다른 정부들이 이 협정에 제시된 기본적인 정치·경제 원칙을 준수하고 실제로 적용하도록 하기 위하여 그 영향력을 행사한다.", "secondary": "Washington, November 26, 1941.\n\nStrictly Confidential,\nTentative and Without\nCommitment.\n\nOutline of Proposed Basis for Agreement Between the United States and Japan\n\nSection I\n\nDraft Mutual Declaration of Policy\n\nThe Government of the United States and the Government of Japan both being solicitous for the peace of the Pacific affirm that their national policies are directed toward lasting and extensive peace throughout the Pacific area, that they have no territorial designs in that area, that they have no intention of threatening other countries or of using military force aggressively against any neighboring nation, and that, accordingly, in their national policies they will actively support and give practical application to the following fundamental principles upon which their relations with each other and with all other governments are based:\n\n(1)\n\nThe principle of inviolability of territorial integrity and sovereignty of each and all nations.\n\n(2)\n\nThe principle of non-interference in the internal affairs of other countries.\n\n(3)\n\nThe principle of equality, including equality of commercial opportunity and treatment.\n\n(4)\n\nThe principle of reliance upon international cooperation and conciliation for the prevention and pacific settlement of controversies and for improvement of international conditions by peaceful methods and processes.\n\nThe Government of Japan and the Government of the United States have agreed that toward eliminating chronic political instability, preventing recurrent economic collapse, and providing a basis for peace, they will actively support and practically apply the following principles in their economic relations with each other and with other nations and peoples:\n\n(1)\n\nThe principle of non-discrimination in international commercial relations.\n\n(2)\n\nThe principle of international economic cooperation and abolition of extreme nationalism as expressed in excessive trade restrictions.\n\n(3)\n\nThe principle of non-discriminatory access by all nations to raw material supplies.\n\n(4)\n\nThe principle of full protection of the interests of consuming countries and populations as regards the operation of international commodity agreements.\n\n[769면] (5)\n\nThe principle of establishment of such institutions and arrangements of international finance as may lend aid to the essential enterprises and the continuous development of all countries and may permit payments through processes of trade consonant with the welfare of all countries.\n\nSection II\n\nSteps To Be Taken by the Government of the United States and by the Government of Japan\n\nThe Government of the United States and the Government of Japan propose to take steps as follows:\n\n1.\n\nThe Government of the United States and the Government of Japan will endeavor to conclude a multilateral non-aggression pact among the British Empire, China, Japan, the Netherlands, the Soviet Union, Thailand and the United States.\n\n2.\n\nBoth Governments will endeavor to conclude among the American, British, Chinese, Japanese, the Netherland and Thai Governments an agreement whereunder each of the Governments would pledge itself to respect the territorial integrity of French Indochina and, in the event that there should develop a threat to the territorial integrity of Indochina, to enter into immediate consultation with a view to taking such measures as may be deemed necessary and advisable to meet the threat in question. Such agreement would provide also that each of the Governments party to the agreement would not seek or accept preferential treatment in its trade or economic relations with Indochina and would use its influence to obtain for each of the signatories equality of treatment in trade and commerce with French Indochina.\n\n3.\n\nThe Government of Japan will withdraw all military, naval, air and police forces from China and from Indochina.\n\n4.\n\nThe Government of the United States and the Government of Japan will not support—militarily, politically, economically—any government or regime in China other than the National Government of the Republic of China with capital temporarily at Chungking.\n\n5.\n\nBoth Governments will give up all extraterritorial rights in China, including rights and interests in and with regard to international settlements and concessions, and rights under the Boxer Protocol of 1901.\n\nBoth Governments will endeavor to obtain the agreement of the British and other governments to give up extraterritorial rights in China, including rights in international settlements and in concessions and under the Boxer Protocol of 1901.\n\n6.\n\nThe Government of the United States and the Government of Japan will enter into negotiations for the conclusion between the United States and Japan of a trade agreement, based upon reciprocal most-favored-nation treatment and reduction of trade barriers by both [770면] countries, including an undertaking by the United States to bind raw silk on the free list.\n\n7.\n\nThe Government of the United States and the Government of Japan will, respectively, remove the freezing restrictions on Japanese funds in the United States and on American funds in Japan.\n\n8.\n\nBoth Governments will agree upon a plan for the stabilization of the dollar-yen rate, with the allocation of funds adequate for this purpose, half to be supplied by Japan and half by the United States.\n\n9.\n\nBoth Governments will agree that no agreement which either has concluded with any third power or powers shall be interpreted by it in such a way as to conflict with the fundamental purpose of this agreement, the establishment and preservation of peace throughout the Pacific area.\n\n10.\n\nBoth Governments will use their influence to cause other governments to adhere to and to give practical application to the basic political and economic principles set forth in this agreement.", "notes": [], "warn": false, "pages": ["0835", "0836"], "search": "Hull 헐(Cordell Hull, 국무장관) Nomura 노무라(野村吉三郎, 주미대사)"}, {"id": "d410", "order": 410, "date": "1941-11-27", "group": "A", "eyebrow": "d410 · Memorandum by the Secretary of State", "title": "국무장관의 각서", "badge": null, "list_right": "문서 410", "meta": [{"k": "일자", "v": "1941-11-27"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2507", "txt": true}, {"k": "발신", "v": "국무장관 헐(Cordell Hull)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 410 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d410"}], "summary": "11월 26일 미국 측 문서를 받은 이튿날, 노무라·구루스 두 대사가 요청하여 대통령을 방문한 기록이다. 대통령이 세 가지 요점을 제시하고 헐이 「공존공영」·「동아 신질서」를 위장된 무력·정복 정책이라고 규정했다.", "points": ["11월 27일, 일본 대사 두 사람(노무라·구루스)이 자신들의 요청으로 방문했다. 대통령이 독일의 국제적 심리에 관한 언급으로 대화를 열었다.", "노무라는 잠정협정(modus vivendi)에 관한 합의가 이루어지지 못한 데 실망했다고 말했다. 전날 미국 측 문서에 대한 첫 반응이다.", "대통령은 태평양 지역의 평화적 해결을 위해 애써 온 일본 내 「평화 세력(peace element)」에 사의를 표하고, 그들이 한 일과 여전히 하려는 일을 잠시도 간과하고 있지 않다고 밝혔다. 사태가 심각하다는 사실은 인정해야 하나 아직 포기하지 않았다고 말했다.", "대통령은 최근 일본의 인도차이나 점령, 그리고 평화적 해결과 그 바탕의 원칙을 온통 무시하고 무력에 의한 정복 쪽으로만 기우는 일본의 최근 움직임과 언사가 미국 정부와 국민에게 「찬물을 끼얹는 효과(the effect of a cold bath)」를 냈다고 말했다.", "대통령의 세 가지 요점: (1) 회담 진행 중에도 일본 지도자들이 회담의 중심 정신인 평화·질서의 근본 원칙에 계속 반대를 표명해 온 것이 매우 실망스럽다. (2) 미국은 매우 참을성 있게 대해 왔고 일본의 행동이 허락하는 한 계속 참을 용의가 있으나, 일본이 평화적 의도의 분명한 표시를 보이지 않는 한 미국은 경제 제한을 실질적으로 완화할 수 없다. (3) 일본 자신의 최선의 이익은 히틀러주의와 침략의 길을 따르는 데 있지 않으며, 만일 일본이 불행히도 그 길을 택한다면 일본이 결국 패자가 되리라는 데 한 점의 의심도 없다.", "대통령은 일본 지도자들이 이 회담이 담고 있는 운동 전체를 방해해 왔다고 강조하고, 4년 동안 전쟁을 해 온 일본 국민에게는 평화의 박자(peace tempo)가 필요하며 전쟁은 미국에도 일본에도 도움이 되지 않는다고 말했다.", "구루스는 열흘째 평화적 조정을 논의·발전시키려 애써 왔다면서, 문제는 근본 원칙보다 그 적용에 있다고 말했다. 대통령이 일본과 중국을 「소개(introduce)」한다고 한 최근 발언에 관하여, 누가 대통령에게 그 소개를 요청하겠느냐고 물었다. 대통령은 즉각 「양쪽 다」라고 답하고, 어느 편도 조정위원회에 회부를 요청하려 들지 않으면서 말은 하지 않은 채 대통령이 나서 주기를 간절히 바라던 파업 처리의 예를 들었다.", "헐은 육군을 따라 화북에 들어간 「25만 명의 카펫배거(carpetbaggers)」를 언급하며, 그들이 남의 권리와 재산을 빼앗아 남북전쟁 뒤 남부의 카펫배거들처럼 눌러앉았다고, 그곳에 아무런 권리가 없으니 빼앗은 재산을 내놓고 나가야 한다고 말했다.", "대통령은 독일이 유럽의 열다섯 나라 이상을 다스릴 만한 상급 인재가 모자라 실패할 것이며 「이류 인간들(second class people)은 점령한 열다섯 나라를 운영할 수 없다」고 말했다. 또 일본이 주장해 온 포위(encirclement)에 관하여, 그 문제로 말하자면 필리핀이야말로 일본에 포위당하고 있다고 지적했다.", "헐은 정부를 장악한 세력 가운데 평화 세력에 반대하는 쪽이 평화적 방향으로 행동하고 말하고 움직이기로 확실히 결심하지 않는 한 어떤 회담도 진전될 수 없다고 못박고, 「공존공영」·「동아 신질서」·특정 지역에서의 「지배적 영향력」이라는 일본의 표어들은 모두 무력과 정복의 정책, 그리고 정복당한 각 주민의 정치·경제·사회·도덕상의 사무를 군 기관이 지배하는 것을 위장하여 표현하는 말이라고 규정했다."], "primary": "[워싱턴,] 1941년 11월 27일.\n\n두 일본 대사가 자신들의 요청으로 방문하였다. 대통령은 독일의 국제적 심리에 관한 언급으로 대화를 시작하였다. 그러자 노무라(野村吉三郎, Nomura) 대사는 잠정협정(modus vivendi)에 관한 어떠한 합의도 이루어지지 못한 데 대하여 자신들이 실망하고 있다고 말하였다. 대통령은 이어서, 태평양 지역에 평화적 해결을 수립하려는 운동을 지지하여 힘써 온 일본 내의 평화 세력(the peace element)에 대하여 자신과 이 정부의 감사와 사의를 표명하였다. 그는 그 세력이 해 온 일, 그리고 여전히 할 준비가 되어 있는 일을 우리가 한순간도 간과하고 있지 않음을 분명히 하였다. 대통령은 덧붙이기를, 미국에서는 대다수 사람들이 태평양 지역의 모든 문제가 평화적으로 해결되기를 원한다고 하였다. 그는 사태가 심각하며 그 사실은 인정되어야 하지만 자신은 아직 포기하지 아니한다고 말하였다. 이어 그는 곤란을 다루어 보려는 시도로 4월 이래 이곳에서 일본대사와 진행해 온 회담을 언급하였다. 대통령은 이러한 곤란 가운데 어떤 것들은 때때로 미국 정부와 국민에게 찬물을 끼얹는 것과 같은 효과를 낸다고 덧붙였는데, 이를테면 최근 일본의 인도차이나 점령, 그리고 평화적 해결의 문제 전체와 그 바탕에 놓인 원칙들을 무시한 채 온통 무력에 의한 정복 쪽으로 기울어 있는 일본의 최근의 움직임과 언사가 그러하다고 하였다. 이어 대통령은 다음의 요점들을 제시하였다: [771면]\n\n(1)\n\n우리는, 이 지극히 중요한 회담이 진행되는 동안에도 일본의 지도자들이 우리가 진행해 온 회담의 중심 정신을 이루는 평화와 질서의 근본 원칙에 대하여 계속 반대를 표명해 온 데 대하여 매우 실망하여 왔다. 일본 지도자들의 이러한 태도는 이 나라와 국외 모두에 어떤 분위기를 자연히 만들어 냈으며, 그것이 회담에서 상호 만족스러운 진전을 이루는 일의 어려움을 크게 더하였다.\n\n(2)\n\n우리는 극동 사태 전반을 다룸에 있어 매우 인내심을 가져 왔다. 일본의 행동 방침이 우리 쪽의 그러한 태도를 지속할 수 있게 한다면, 우리는 계속 인내할 준비가 되어 있다. 우리는 우리가 논의해 온 성격의 평화적 해결이 태평양 전역에서 마련될 수 있으리라는 희망을 여전히 가지고 있다. 이 나라 여론의 기질은 그러한 성격의 것이 되었고 오늘날 세계에서 걸려 있는 큰 쟁점들은 매우 뚜렷이 윤곽을 드러내게 되었으므로, 일본이 이 나라에 평화적 의도의 어떤 분명한 표시를 보이지 아니하는 한 이 나라는 그 경제적 제한을 실질적으로 완화할 수 없다. 만일 그러한 일이 일어난다면, 우리 또한 전반적 사태를 개선하기 위한 구체적 성격의 조치를 취할 수 있다.\n\n(3)\n\n우리는, 일본 자신의 최선의 이익이 히틀러주의와 침략의 길을 따름으로써 이루어지지는 아니하리라는 것, 그리고 일본 자신의 최선의 이익은 우리가 현재의 회담에서 개괄해 온 길에 놓여 있다는 것을 여전히 확신한다. 그러나 만일 일본이 불행히도 히틀러주의와 침략의 길을 따르기로 결정한다면, 우리는 한 점 그늘의 의심도 없이 일본이 궁극적으로 패자가 되리라고 확신한다.\n\n대통령은 일본의 지도자들이 이곳의 회담에 담긴 이 운동 전체를 방해하여 왔음을 강조하였다. 그는 4년 동안 전쟁을 치러 온 일본 국민에게는 평화의 박자(a peace tempo)가 필요하며, 전쟁은 우리에게도 도움이 되지 아니하고 일본에게도 도움이 되지 아니하리라고 말하였다.\n\n구루스(来栖三郎, Kurusu) 대사는 이어 말하기를, 자신은 평화적 조정을 논의하고 발전시키려는 노력으로 이곳에 열흘 동안 있어 왔으며, 문제는 근본 원칙에 있다기보다는 그 적용에 있다고 하였다. 일본과 중국을 소개(introduce)하는 것에 관한 대통령의 최근 발언을 언급하면서, 구루스는 누가 대통령에게 이 두 정부를 소개해 달라고 요청하겠느냐고 물었다. 대통령은 즉각 「양쪽 다」라고 대답하였다. 이어 그는, 어느 편도 조정위원회(the Mediation Board)에 그 문제를 회부해 달라고 요청하기를 원하지 아니하면서도 그렇게 말하지는 않은 채 대통령이 그리해 주기를 간절히 바라던 어떤 파업 사태를 자신이 다루었던 일을 예로 들었다. 나는 육군을 뒤따라 화북에 들어간 25만 명의 카펫배거(carpetbaggers)를 언급하고, 그들이 남의 권리와 재산을 빼앗아 남북전쟁 뒤 남부에서 카펫배거들이 그리하였던 것처럼 그곳에 자리 잡았다고 말하였으며, 그들에게는 그곳에서 아무런 권리도 없으니 남에게서 빼앗은 재산을 내놓고 물러나야 한다고 덧붙였다.\n\n대통령은 일본이 정복한 나라들을 [772면] 식민화하려는 노력을 언급하면서, 독일은 완전히 실패할 것인데 그것은 독일에게 유럽에서 정복한 열다섯 나라 이상을 통치할 만한 상급 인재가 충분하지 아니하기 때문이며, 이것이 독일로 하여금 현재의 행보에서 실패하게 만들 것이라고 말하였다. 이류 인간들(second class people)은 점령한 열다섯 나라를 운영할 수 없다는 것이었다.\n\n대통령은 나아가 일본이 주장하여 온 포위(encirclement)의 문제를 언급하였다. 그는 그 문제로 말하자면 필리핀이야말로 일본에 의하여 포위당하고 있음을 지적하였다.\n\n나는 다음을 분명히 하였다. 즉 정부를 장악하고 있는 가운데 평화 세력에 반대하는 쪽이 평화적 방향으로 행동하고 말하고 움직이기로 확실히 마음을 정하지 아니하는 한, 지금까지 매우 명백히 드러난 바와 같이 어떠한 회담도 어디에도 이를 수 없고 이르지 아니하리라는 것, 공존공영(co-prosperity), 동아 신질서(new order in East Asia), 그리고 특정 지역에서의 지배적 영향력이라는 일본의 표어들이 모두 일본에 의한 무력과 정복의 정책, 그리고 정복당한 각 주민의 정치적·경제적·사회적·도덕적 사무를 군 기관이 지배하는 것을 위장된 방식으로 표현하는 말임을 누구나 알고 있다는 것, 또한 그들이 그 방향으로 움직이면서 방공협정(the Anti-Comintern Pact)이나 삼국동맹(the Tripartite Pact) 따위의 수단을 통하여 히틀러와의 문화적·군사적, 그 밖의 관계를 계속 늘려 가는 한 평화적 방향에서는 어떠한 참된 진전도 이루어질 수 없다는 것이었다.\n\nC[ordell] H[ull]", "secondary": "[Washington,] November 27, 1941.\n\nThe two Japanese Ambassadors called at their request. The President opened the conversation with some reference to German international psychology. Ambassador Nomura then said that they were disappointed about the failure of any agreement regarding a modus vivendi. The President proceeded to express the grateful appreciation of himself and of this Government to the peace element in Japan which has worked hard in support of the movement to establish a peaceful settlement in the Pacific area. He made it clear that we were not overlooking for a moment what that element has done and is ready still to do. The President added that in the United States most people want a peaceful solution of all matters in the Pacific area. He said that he does not give up yet although the situation is serious and that fact should be recognized. He then referred to the conversations since April which have been carried on here with the Japanese Ambassador in an attempt to deal with the difficulties. The President added that some of these difficulties at times have the effect of a cold bath on the United States Government and people, such as the recent occupation of Indochina by the Japanese and recent movements and utterances of the Japanese slanting wholly in the direction of conquest by force and ignoring the whole question of a peaceful settlement and the principles underlying it. The President then made the following points: [771면]\n\n(1)\n\nWe have been very much disappointed that during the course of these very important conversations Japanese leaders have continued to express opposition to the fundamental principles of peace and order which constitute the central spirit of the conversations which we have been carrying on. This attitude on the part of Japanese leaders has naturally created an atmosphere both in this country and abroad which has added greatly to the difficulty of making mutually satisfactory progress in the conversations.\n\n(2)\n\nWe have been very patient in our dealing with the whole Far Eastern situation. We are prepared to continue to be patient if Japan’s courses of action permit continuance of such an attitude on our part. We still have hope that there may be worked out a peaceful settlement in the entire Pacific area of the character we have been discussing. The temper of public opinion in this country has become of such a character and the big issues at stake in the world today have become so sharply outlined that this country cannot bring about any substantial relaxation in its economic restrictions unless Japan gives this country some clear manifestation of peaceful intent. If that occurs, we can also take some steps of a concrete character designed to improve the general situation.\n\n(3)\n\nWe remain convinced that Japan’s own best interests will not be served by following Hitlerism and courses of aggression, and that Japan’s own best interests lie along the courses which we have outlined in the current conversations. If, however, Japan should unfortunately decide to follow Hitlerism and courses of aggression, we are convinced beyond any shadow of doubt that Japan will be the ultimate loser.\n\nThe President emphasized that the leaders in Japan had obstructed this whole movement involved in the conversations here. He said that having been in war for four years the Japanese people need to have a peace tempo; that war does not help us nor would it help Japan.\n\nAmbassador Kurusu proceeded to say that he had been here for ten days in an endeavor to discuss and develop a peaceful arrangement; that the trouble was not with the fundamentals so much as with their application. Referring to a recent remark of the President about introducing Japan and China, Kurusu asked to know who would request the President to introduce these two governments. The President promptly replied “both sides”. He then gave an illustration of his dealing with some strike conditions when neither side desired to request the Mediation Board to bring up the matter but were anxious, without saying so, for the President to do so. I referred to the 250,000 carpetbaggers that had gone into north China following the army and said that they had seized other peoples’ rights and properties and located there as the carpetbaggers had done in the south after the Civil War and added that they had no rights over there and ought to give up the property they took from other people and get out.\n\nThe President, referring to the efforts of Japan to colonize countries [772면] that they conquer, said that Germany would completely fail because she did not have enough top people to govern the fifteen or more conquered countries in Europe and that this would cause Germany to fail in her present movements; that second class people cannot run fifteen captured countries.\n\nThe President further referred to the matter of encirclement that Japan has been alleging. He pointed out that the Philippines were being encircled by Japan so far as that is concerned.\n\nI made it clear that unless the opposition to the peace element in control of the Government should make up its mind definitely to act and talk and move in a peaceful direction, no conversations could or would get anywhere as has been so clearly demonstrated; that everyone knows that the Japanese slogans of co-prosperity, new order in East Asia and a controlling influence in certain areas, are all terms to express in a camouflaged manner the policy of force and conquest by Japan and the domination by military agencies of the political, economic, social and moral affairs of each of the populations conquered; and that so long as they move in that direction and continue to increase their cultural relations, military and otherwise with Hitler through such instruments as the Anti-Comintern Pact and the Tripartite Pact, et cetera, et cetera, there could not be any real progress made on a peaceful course.\n\nC[ordell] H[ull]", "notes": [], "warn": false, "pages": ["0837", "0838"], "search": "루스벨트(Franklin D. Roosevelt) — 미국 대통령. 원문에는 「대통령(the President)」으로만 적혀 있다 헐(Cordell Hull) — 미국 국무장관. 이 각서의 작성자이며 본문의 「나」다 노무라(野村吉三郎, Nomura) — 주미 일본대사 구루스(来栖三郎, Kurusu) — 일본 특사, 대사 히틀러(Adolf Hitler) — 독일 총통"}, {"id": "d90", "order": 90, "date": "1941-12-01", "group": "D", "eyebrow": "d90 · The Ambassador in Japan (Grew) to the Secretary of State", "title": "주일대사 그루가 국무장관에게", "badge": null, "list_right": "문서 90", "meta": [{"k": "일자", "v": "1941-12-01"}, {"k": "시각", "v": "도쿄, 1941년 12월 1일 오후 3시 발신 / [12월 5일 오전 5시 3분 접수]"}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": "1869"}, {"k": "원문출처", "v": "793.94/17041: Telegram (전보)", "txt": true}, {"k": "발신", "v": "The Ambassador in Japan (Grew) 주일대사 그루(Joseph Grew)", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 90 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d90"}], "summary": "그루 대사가 도조 총리의 연설 발췌를 보고한다. 일본·중국·「만주국」 공동선언 1주년 집회에서 영국과 미국을 동아시아에서 몰아내야 한다고 말한 대목이다.", "points": ["전날 대정익찬회와 대일본흥아동맹이 주최한 집회에서 도조 총리가 한 연설의 발췌다. 출처는 『애드버타이저』에 실린 도메이(同盟) 보도다.", "집회는 일본·중국·「만주국」 공동선언 1주년을 기념하는 것이었다. 원문은 Manchukuo에 따옴표를 붙였다.", "도조는 세 나라가 이 깃발 아래 협력하는 것이 「금세기 최대의 과업」이라고 했다.", "도조는 여전히 많은 나라가 일본에 적대적으로 행동하며, 동아시아 공영권 건설을 방해하고 10억 동아시아 민중을 희생시켜 동아시아 착취의 꿈을 누리려 한다고 했다.", "장제스가 영국·미국·공산주의의 장단에 맞춰 춤춘다고 했고, 그것은 영미가 동아시아 민족들끼리 싸우게 하여 혼란을 틈타 이익을 얻고 패권을 쥐려는 「영국과 미국의 상투 수단」 때문이라고 했다.", "도조는 「인류의 명예와 긍지를 위하여」 이런 짓을 동아시아에서 「기어이 숙청해야 한다」고 맺었다.", "전보는 상하이를 거쳐 국무부로 보냈다."], "primary": "도쿄, 1941년 12월 1일 오후 3시.\n\n[1941년 12월 5일 오전 5시 3분 접수.]\n\n1869. 어제 대정익찬회(Imperial Rule Assistance Association)와 대일본흥아동맹(Dai Nippon East Asia League)의 주최로 열린 일본·중국·「만주국」 공동선언[주17] 제1주년 기념 집회에서 행한 도조(東條英機, Tojo) 총리의 연설 발췌는 다음과 같다(『애드버타이저』에 실린 도메이 보도에서):\n\n「가시밭길을 헤쳐 열기 위하여 이 깃발 아래 함께 협력하는 특권을 가진 것은 참으로 세 나라의 더없이 다행한 운명이며, 우리가 이 명예로운 사업을 함께 시작한 지 이미 1년이 지났으니, 이것이 금세기 최대의 과업이 아니라면 달리 무엇이겠는가.\n\n그러나 둘러보면 아직도 우리에게 적대적인 행동에 빠져 있는 나라가 많음을 알게 된다. 실로 그들은 동아공영권 건설의 길에 장애를 놓으려 하고 있으며, 소유욕을 채우기 위하여 10억 동아시아 민족의 희생 위에서 동아시아 착취의 꿈을 누리려 하고 있다.\n\n장제스가 일본에 대한 헛된 저항으로 유능하고 앞날이 창창한 젊은이들을 희생시켜 가며 영국과 미국과 공산주의의 장단에 맞춰 춤추고 있다는 사실은, 오로지 영국과 미국이 동아시아 민족들을 서로 맞붙임[?]으로써 동아시아의 혼탁한 물에서 고기를 낚고 동아시아의 패권을 쥐려는 욕심 때문이다. 이것이 영국과 미국의 상투 수단이다.\n\n[149면]\n\n인류의 명예와 긍지를 위하여 우리는 이런 종류의 짓을 기어이 동아시아에서 숙청해야 한다.」[주18]\n\n상하이를 거쳐 국무부로 발송함.\n\n그루", "secondary": "Tokyo, December 1, 1941—3 p.m.\n[Received December 5—5:03 a.m.]\n\n1869. Extract from Premier Tojo’s message to rally held yesterday under sponsorship Imperial Rule Assistance Association and Dai Nippon East Asia League in commemoration first anniversary joint Japan-China-”Manchukuo” declaration [주17] follows (from Domei report in Advertiser):\n\n“It is certainly the most fortunate lot of the three powers to have the privilege of collaborating together under this banner for cutting open the thorny way, and 1 year has already gone by since we started this honorable work together, and if it is not the greatest task of the present century what else can it be.\n\nHowever if we look around we find that there are still many countries who are indulging in actions hostile to us. In fact they are trying to throw obstacles in the way of the construction of the East Asia co-prosperity sphere and are trying to enjoy the dream of exploitation of East Asia at the cost of the 1,000 million populace of the East Asiatic peoples to satisfy their greed of possession.\n\nThe fact that Chiang Kai-shek is dancing to the tune of Britain, America, and communism at the expense of able-bodied and promising young men in his futile resistance against Japan is only due to the desire of Britain and the United States to fish in the troubled waters of East Asia by putting [pitting?] the East Asiatic peoples against each other and to grasp the hegemony of East Asia. This is a stock in trade of Britain and the United States.\n\n[149면]\n\nFor the honor and pride of mankind we must purge this sort of practice from East Asia with a vengeance.” [주18]\n\nSent Department via Shanghai.\n\nGrew", "notes": ["[주17] 앞의 122면.", "[주18] 이 연설에 대한 일본 측 해명은 1941년 12월 2일자 성명, 778면을 보라."], "warn": false, "pages": ["0215"], "search": "Grew 그루(Joseph Grew, 주일대사) Tojo 도조(東條英機, 총리) Chiang Kai-shek 장제스(蔣介石)"}, {"id": "d91", "order": 91, "date": "1941-12-01", "group": "D", "eyebrow": "d91 · The Ambassador in Japan (Grew) to the Secretary of State", "title": "주일대사 그루가 국무장관에게", "badge": null, "list_right": "문서 91", "meta": [{"k": "일자", "v": "1941-12-01"}, {"k": "시각", "v": "1941년 12월 1일 오후 4시 발신 / [12월 5일 오전 5시 14분 접수]"}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": "1870"}, {"k": "원문출처", "v": "793.94/17042: Telegram", "txt": true}, {"k": "발신", "v": "주일대사 그루(Joseph Grew)", "txt": true}, {"k": "수신", "v": "국무장관 헐(Cordell Hull)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 91 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d91"}], "summary": "일본·「만주국」·중국 동맹 1주년 축하 만찬에서 행한 일본 외상의 연설을 아사히 보도에서 발췌하여 보고한 전보.", "points": ["일본 외상(도고 시게노리)이 일본-「만주국」-중국 동맹 1주년 기념 만찬에서 한 연설을 아사히 보도에서 발췌한 것이다.", "일본·만주국·중국 세 나라의 긴밀한 관계를 일화기본조약과 일·만·화 공동선언의 원칙 위에서 극도로 강화해야 한다고 말했다.", "동아 제민족의 공존공영을 기본 원칙으로 하는 동아 신질서 건설로 나아가야 한다고 밝혔다.", "미국과의 교섭에서 일본 정부는 일관되게 이 원칙을 지켜 왔다고 주장했다.", "미국은 동아시아의 실정을 인정하지 않으려는 경향이 있을 뿐 아니라, 실제 세계 정세에 맞지 않는 「공상적 원칙(fanciful principles)」을 동아시아 국가들에 강압적으로 적용하여 신질서 건설을 방해하려는 태도를 보였다고 비난했다.", "동아 신질서를 확립하는 큰 사명을 맡음에 있어 전보다 더 큰 곤란과 장애에 맞설 각오를 충분히 해야 한다고 말했다. 개전을 열흘 앞둔 시점의 발언이다.", "그루는 이 전보를 상하이를 경유하여 국무부에 보냈다. 12월 1일 오후 4시에 보낸 것이 12월 5일 오전 5시 14분에야 접수되었다."], "primary": "도쿄, 1941년 12월 1일—오후 4시.\n[12월 5일 오전 5시 14분 접수]\n\n1870. 어제 외상이 주최한 일본-「만주국(Manchukuo)」-중국 동맹 1주년 축하 만찬에서의 외상 연설에 관한 아사히 보도의 발췌는 다음과 같다.\n\n「세계는 지금 미증유의 동란에 직면해 있다. 그러나 대동아에 있어서 일본·만주국·중국 삼국 간의 긴밀한 관계는 일화기본조약(Japan-China basic treaty) 및 일·만·화 공동선언(Japan-Manchukuo-China joint declaration)의 원칙에 입각하여 극도로 강화되지 않으면 안 된다. 새삼 말할 것도 없이, 우리는 동아 제민족의 공존공영을 기본 원칙으로 하는 동아 신질서의 건설을 향하여 나아가지 않으면 안 된다.\n\n미국과의 교섭에 있어서 일본 정부는 일관되게 이 원칙을 견지하여 왔다. 그러나 미국은 동아시아의 실정을 인정하지 않으려는 경향에 있다. 그뿐만 아니라 심히 유감스럽게도, 현실의 세계 정세에 적합하지 아니한 공상적 원칙을 동아시아 여러 나라에 강압적으로 적용하여 그로써 신질서의 건설을 방해하려는 태도를 보여 왔다.\n\n동아에 신질서를 확고히 수립하고 그로써 항구적 세계 평화의 대의에 기여한다는 큰 사명을 떠맡음에 있어, 우리는 전에 없이 더욱 큰 곤란과 장애에 맞설 각오를 충분히 하지 않으면 안 된다.\n\n그러나 나는 굳게 믿는다. 일본·만주국·중국 삼국이 철석같은 의지로써 그 유대를 강화하고 완전한 협력 아래 이 큰 목적의 실현을 위하여 힘쓴다면, 이들 여러 장애를 극복할 것이며, 동아 제민족에게는 위대한 장래가 있으리라는 것을.」\n\n상하이를 경유하여 국무부에 발송함.\n\n그루\n\n[153면]", "secondary": "Tokyo, December 1, 1941—4 p.m.\n[Received December 5—5:14 a.m.]\n\n1870. Excerpt from Asahi report Foreign Minister’s address at dinner given by him yesterday in celebration first anniversary Japan-”Manchukuo”-China alliance follows:\n\n“The world at present is confronted with unprecedented disturbances. In greater East Asia, however, the close relations among Japan, Manchukuo, and China must be strengthened to the utmost on the basis of the principles of the Japan-China basic treaty and the Japan-Manchukuo-China joint declaration. Needless to say, we must proceed towards the establishment of a new order in East Asia which has the co-existence and co-prosperity of East Asia peoples as its basic principle.\n\nIn its negotiations with the United States, the Japanese Government consistently has upheld this principle. The United States, however, is inclined not to recognize the real situation in East Asia. Not only that, but also it most regrettably has shown a disposition to apply coercively to the East Asiatic countries fanciful principles not adapted to the actual world situation and thus to obstruct the construction of the new order.\n\nIn undertaking the great mission of firmly establishing a new order in East Asia and thus contributing to the cause of permanent world peace, we must be fully prepared to face difficulties and obstacles greater than ever before.\n\nI firmly believe however that if the three countries, Japan, Manchukuo, and China with iron will strengthen their ties and strive for realization of this great object in perfect cooperation, they will surmount these various obstacles, and that the East Asia peoples have a great future.”\n\nSent Department via Shanghai.\n\nGrew\n\n[153면]", "notes": [], "warn": false, "pages": ["0216", "0217", "0218", "0219"], "search": "그루(Joseph Grew) — 주일 미국대사 도고(東郷茂徳, Togo) — 일본 외상. 원문에는 「외상(Foreign Minister)」으로만 적혀 있다 헐(Cordell Hull) — 미국 국무장관(수신자)"}, {"id": "d411", "order": 411, "date": "1941-12-01", "group": "A", "eyebrow": "d411 · Memorandum of a Conversation", "title": "회담 비망록", "badge": null, "list_right": "문서 411", "meta": [{"k": "일자", "v": "1941-12-01"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2594⅛", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 411 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d411"}], "summary": "노무라와 구루스가 국무부를 찾아온다. 도조 총리의 연설, 11월 26일 미국 문서와 11월 20일 일본 제안, 인도차이나 주둔, 삼국동맹을 두고 헐과 격론이 오간다.", "points": ["구루스가 대통령이 예정보다 앞당겨 워싱턴으로 돌아오는 까닭을 묻자, 헐은 현 정세의 한 요인이 일본 총리의 「큰소리(loud talk)」라고 답한다. 각주는 그 연설이 12월 1일자 그루의 전보 제1869호에 있는 도조의 연설임을 밝힌다.", "헐은 대사가 여기서 좋은 관계를 말하고 있는 마당에 총리가 그런 말을 하지 않도록 말려 줄 충고가 필요해 보인다고 말한다.", "구루스는 총리가 한 것은 10분짜리 방송에 지나지 않는다 하고, 헐은 방송이라서 더 효과가 크다고 받는다. 구루스는 총리의 말이 잘못 인용되었다며 그루 대사에게서 들은 것이 없느냐 묻고, 헐은 들은 것이 없으며 AP통신이 믿을 만하다고 여긴다고 답한다.", "헐은 마쓰오카가 삼국동맹을 늘어놓고 큰소리를 칠 동안 자기는 그 모두를 못 본 체했으며, 지난 7월 회담이 진행되는 중에 일본이 아무 예고 없이 갑자기 인도차이나로 들어갔다고 상기시킨다. 그러면서 미국은 일본을 으르려는 생각이 없고 일본이 우리를 으를 까닭도 없다며, 「우리가 더 나아갈 수 없는 한계가 있고, 머지않아 지금처럼 계속할 수 없는 지점에 이를지도 모른다」고 강조한다.", "구루스는 11월 26일 미국이 건넨 문서를 본국에 전달했고 일본 정부가 검토 중이며 며칠 안에 그에 대한 의견이 전달될 것이라 알린다.", "구루스는 일본 정부가 11월 20일 제출한 제안이 공평하다고 믿으며, 미국 정부의 입장을 이해하기 어렵고, 미국이 건넨 제안은 극동의 실제 사정을 헤아리지 못한 듯이 보인다고 전한다. 본국의 훈령에 따라 회담에서 미국의 궁극 목적이 무엇인지 묻고 「이 문제에 대한 깊은 성찰」을 요청한다.", "구루스는 남부 인도차이나에서 병력을 철수하겠다는 일본의 제의가 여전히 유효하다고 말한다.", "헐은 일본이 중국에서 쓰는 방법이 히틀러가 유럽을 굴복시키려고 쓰는 방법과 비슷하다고 지적하고, 히틀러가 세계의 절반을 차지하려 움직이는 것을 잊을 수 없으며 일본 군국주의자들이 지구의 나머지 절반을 차지하려 같은 방향으로 움직이고 있다고 믿는다고 말한다.", "노무라는 사실 일본의 공영권 관념과 범미주의(Pan-Americanism) 사이에 큰 차이가 없으며 다만 일본의 방법이 더 「원시적(primitive)」일지 모른다고 말하고, 무력을 쓰는 것이 일본의 목적임을 부인한다. 일본은 자위(自衛)에서 움직였으며 쌀과 물자를 얻을 길이 막혔다고 한다.", "헐은 인도차이나의 어디에 주둔하든 그 병력이 남양 지역에 위협이 되며, 그 때문에 미국과 그 벗들이 동아시아에 대군을 묶어 두어야 하니 일본의 행동이 히틀러를 돕는 효과를 내고 있다고 말한다.", "헐은 일본이 갑자기 인도차이나로 들어가기까지 미국이 일본에 석유를 팔고 있었음을 지적하고, 일본의 군부 지도자들이 일본이 평화적 진로를 갈 뜻임을 보이기만 하면 미국은 일본이 원하는 물자를 다 주겠다고 말한다. 그러면서 「일본 군부 지도자들과 동업할 생각은 없으며, 일본 군부에서 평화라는 속삭임 한마디도 듣지 못했고 큰소리와 소름 끼치는 위협만 들었다」고 강조한다.", "헐은 11월 22일 일본 해군에는 석유를 팔 수 없다고 곧바로 말했음을 상기시키고, 회담에서 논의한 기본 원칙에 따라 일본이 해결에 이를 수 있다면 미국은 기꺼이 주선(周旋)에 나서겠다고 밝힌다. 또 일본이 삼국동맹에 묶여 있는 형편에서 중국 원조 중단을 요구하는 것은 영국 원조 중단을 요구하는 것이나 마찬가지라고 한다.", "헐은 「우리는 태평양에서 걷어차여 쫓겨나도록 두지 않겠다」고 말하고, 일본 정치가들이 우리를 동아시아에서 몰아내겠다고 말하는 마당에 대군이 인도차이나 어딘가에 있으면 그만큼 더 주의를 기울여야 한다고 말한다.", "헐은 자기가 근본으로 돌아가야겠다고 결론지었으며 그 근본이 11월 26일 일본에 내놓은 제안에 담겨 있다고 말하고, 일본이 하고 말하는 모든 것이 회담에서 이야기해 온 진로와 정반대이며 진지하게 평화를 더 논하려면 일본 정부가 그것을 되돌려야 한다고 말한다.", "노무라는 전쟁은 아무것도 해결하지 못하며 태평양 전쟁은 비극이 되리라 하면서도, 일본 국민은 미국이 일본을 중국과 계속 싸우게 하고 목을 조른 채로 두려 한다고 믿으며 「미국에 항복하느냐 싸우느냐의 갈림길에 놓여 있다고 느낀다」고 말한다.", "헐은 자기가 여기서 사실상 진을 다 뺐으며, 미국 국민이 이 정세에 이 나라에 대한 진짜 위험이 있다고 여기게 될 것이고 자기가 그것을 막을 방법이 없다고 말한다. 두 사절은 국무장관의 처지를 이해했으며 무엇을 할 수 있을지 보기 위하여 본국에 보고하겠다고 말한다."], "primary": "[워싱턴,] 1941년 12월 1일.\n\n일본 대사와 구루스(来栖三郎, Kurusu) 씨가 자기들의 요청으로 국무부를 찾아왔다. 구루스 씨는 대통령이 예정보다 앞당겨 워싱턴으로 돌아오고 있음을 알았다면서 그 까닭이 무엇인지 물었다. 국무장관은 현 정세의 한 요인이 일본 총리의 큰소리라고 내비쳤다.[주67a] 국무장관은, 대사가 이곳에 와서 좋은 관계를 이야기하고 있는 때에 총리가 그런 말을 늘어놓지 않도록 말려 줄 충고가 총리에게 필요해 보인다고 덧붙였다. 이어 국무장관은 일본 측에 세계 정세의 전반적 흐름, 특히 리비아와 러시아의 정세에 대하여 어떻게 느끼는지 물었다. 일본 대사는 자기들의 주의가 대체로 미일 양국 사이의 정세에 쏠려 있었다는 뜻으로 답하였다. 국무장관은 우리 관점에서는 리비아와 러시아에서 오는 소식에 큰 관심을 느끼며 매우 고무되어 있고, 우리가 모퉁이를 돌아 더 유리한 정세로 접어들고 있는 듯이 보인다고 말하였다.\n\n[773면]\n\n대사와 구루스 씨는, 이 나라에서 우리가 일본 총리의 발언을 마땅한 정도보다 더 심각하게 받아들이는 것 같다고 국무장관을 설득하려 애썼다. 구루스 씨는 총리가 한 일이라고는 10분짜리 방송에 지나지 않는다고 말하였다. 국무장관은 방송이기에 오히려 그만큼 더 효과가 크다고 지적하였다. 구루스 씨는 총리의 말이 잘못 인용되었다고 말하고 우리가 그루 대사에게서 무슨 소식을 들었는지 물었다. 국무장관은 그루 대사에게서 아무것도 들은 바 없으며, 우리는 AP통신이 믿을 만하다고 여기므로 총리가 한 말에 관한 그 보도를 믿어야 한다고 답하였다. 구루스 씨는 일본의 통신사들이 언제나 성명을 영어로 옳게 옮기지는 않는다고 말하였다.\n\n국무장관은 자기가 아홉 달 동안 일본 대사와 평화를 이야기해 왔으며 두 사람 다 온전히 성실하게 임하였다고 말하였다. 그는 마쓰오카(松岡洋右, Matsuoka)가 삼국동맹을 늘어놓으며 이러쿵저러쿵 큰소리를 치던 그 모든 동안에도 자기는 그것을 죄다 못 본 체하였다고 말하였다. 그러고 나서 지난 7월 회담이 진행되는 중에 일본 측은 미국 정부에 아무런 사전 통고도 없이 갑자기 인도차이나로 들어갔으며, 어쩌면 대사도 일본 정부의 의도를 미리 통보받지 못하였을 것이라고 하였다. 또한 국무장관은 일본 신문이 미국에 대하여 큰소리치는 선전을 벌여 왔다고 말하였다. 국무장관은 미국 정부에 일본을 으르려는 생각이 조금도 없으며 일본이 우리를 으르려 할 까닭도 자기는 알지 못한다고 말하고, 우리가 그 너머로는 더 나아갈 수 없는 한계가 있으며 머지않아 우리가 지금처럼 계속해 갈 수 없는 지점에 이를지도 모른다고 강조하였다.\n\n구루스 씨는 일본 정부가 총리의 발언에 대한 이 나라의 반응에 매우 놀랐다고 말하고, 총리의 발언에 대한 올바른 번역이 국무장관에게 전해지도록 자기가 살피겠다고 하였다. 그는 우리가 그루 대사에게서 무엇인가 듣게 되기를 바란다고 말하였다. 이어 그는, 우리가 11월 26일에 그들에게 준 문서가 일본 정부에 전달되었고 일본 정부가 이 건을 검토하고 있으며 며칠 안에 그에 대한 일본 정부의 의견이 우리에게 전달될 것임을 국무장관에게 알리게 되어 기쁘다고 말하였다. 그러고 나서 그는, 일본 정부가 11월 20일 우리에게 제출한 제안이 공평하며 그 안에 회담에서 양쪽이 취한 관점이 충분히 고려되어 있다고 일본 정부는 믿는다고 말하였다. 또한 일본 정부는 미합중국 정부가 취한 입장을 이해하기 어렵다고 여기며, 우리가 그들에게 전달한 제안은 [774면] 극동의 실제 사정을 헤아리지 못한 것으로 보인다고 하였다. 그는 자기 정부가 회담에서 미합중국의 궁극의 목적이 무엇인지 물어보고 미국 정부에 「이 문제에 대한 깊은 성찰」을 하여 줄 것을 요청하라고 자기에게 지시하였다고 말하였다. 구루스 씨는 남부 인도차이나에서 병력을 철수하겠다는 일본의 제의가 여전히 유효하며, 일본은 평화적 해결을 촉진하려는 지극한 바람을 보여 왔다고 말하였다.\n\n국무장관은, 우리가 도쿄에서 나오는 호전적인 발언들을 셈에 넣지 않을 수 없으며, 만일 그러한 협정이 힘의 원칙 위에 서야 하는 것이라면 어떠한 평화적 협정도 결코 가능하지 않으리라고 답하였다. 그는 일본 측이 중국에서 쓰고 있는 방법이 히틀러가 유럽을 굴복시키려고 채택하고 있는 방법과 비슷하다고 지적하였다. 국무장관은 자기가 우리 회담이 진행되는 동안 그 점에 주의를 환기한 바 있다고 말하고, 우리는 세계의 절반을 차지하려는 히틀러의 움직임에서 눈을 뗄 수 없다고 하였다. 그는 일본의 군국주의자들이 지구의 나머지 절반을 차지하려고 그와 비슷한 방향으로 움직이고 있다고 우리는 믿으며, 미국 정부는 그런 종류의 어떠한 것에도 양보할 수 없다고 말하였다. 그는 우리가 평화와 안정과 번영을 촉진할 방식으로 일을 풀어 나가기를 바라는 것이 이 때문이며, 일본 신문이 이 나라에 더러운 욕설을 퍼부어 왔음에도 자기가 지금까지 아무 항의도 하지 않은 것이 이 때문이라고 설명하였다.\n\n대사는, 사실인즉 일본의 공영권 관념과 범미주의(Pan-Americanism) 사이에 큰 차이가 없으며 다만 일본의 방법이 더 원시적일지는 모른다는 견해를 밝혔다. 그는 무력을 쓰는 것이 일본의 목적임을 부인하였다. 국무장관은, 일본 정부가 힘으로 한 치 한 치 다른 나라의 영토로 밀고 들어가고 있을 때 대사는 이것이 우리 정책의 일부라고 생각하느냐고 물었다. 대사는, 일본은 예컨대 시리아에서 영국이 자기 행동에서 그러하였던 것과 똑같이 자위(自衛)의 동기에서 움직였으며, 일본은 미국과 그 밖의 나라들에 의하여 길이 막히고 있던 때에 쌀과 그 밖의 물자가 필요하였고 그 물자에 이르는 길을 얻으려고 애쓰는 것 말고는 달리 길이 없었다고 답하였다.\n\n국무장관은 다음과 같이 말하였다. 일본 측은 미합중국이 일본이 동아시아에서 하고 있는 일에 간섭할 권리가 없다고 말하고 있다. 일본이 인도차이나에 병력을 두고 있는 한, 그 병력이 인도차이나의 어디에 주둔하고 있든 상관없이 이는 남양(南洋) 지역에 대한 위협이 된다. 이 병력을 인도차이나에 주둔시키는 일 때문에 미합중국과 그 벗들은 많은 수의 군대를 동아시아에 묶어 두지 않을 수 없게 되었고, 이러한 방식으로 일본의 행위는 히틀러를 돕는 효과를 내고 있다. 국무장관은 그러한 사태가 벌어지는 동안 우리가 가만히 앉아 있을 수는 없다는 것을 자기가 대사에게 분명히 밝힌 바 있음을 상기시켰다.\n\n[775면]\n\n대사는, 오늘날 전쟁은 경제적 무기를 매개로 수행되고 있으며 일본은 죄어들리고 있고 일본은 원료를 얻기 위하여 팽창하지 않을 수 없다고 논평하였다. 국무장관은, 일본이 갑자기 인도차이나로 들어가기 전까지 우리가 일본에 석유를 팔고 있었으며, 자기로서는 그러한 사태를 언제까지고 두둔할 수 없고, 일본의 군부 지도자들이 일본이 평화적인 진로를 좇을 뜻임을 보여 주기만 한다면 미합중국은 물자의 면에서 일본이 원하는 것을 다 주리라고 지적하였다. 국무장관은 우리가 일본의 군부 지도자들과 동업할 뜻이 없음을 강조하고, 자기는 일본 군부에게서 평화라는 속삭임 한마디도 들은 적이 없으며 오직 큰소리와 소름 끼치는 위협만 들었다고 하였다. 국무장관은 자기가 인내의 정책 때문에 매우 혹독한 비난을 받아 왔으나, 일본 정부가 자기를 뒷받침해 주기만 한다면 그것은 아무래도 좋다고 덧붙였다.\n\n국무장관은 이어서 11월 20일자 일본 측 제안의 여러 항목을 하나씩 들었다. 그는 11월 22일에 자기가 대사에게, 민간용으로 얼마간의 석유를 풀어 주는 것은 고려할 용의가 있을지 몰라도 일본 해군에는 석유를 팔 수 없다고 곧바로 말하였음을 상기시켰다. 그는 만일 일본 측이 우리가 회담에서 논의한 기본 원칙에 따라 해결에 이를 수 있다면 미국 정부는 중국 사건의 해결을 돕기를 간절히 바라며, 그러한 사정 아래에서라면 우리가 기꺼이 주선(周旋)에 나서겠다는 뜻을 분명히 하였다. 국무장관은 이어, 일본이 삼국동맹에 묶여 있는 현재의 사정 아래에서라면 일본이 우리에게 중국 원조를 그만두라고 요구하는 것이나 영국 원조를 그만두라고 요구하는 것이나 매한가지라고 말하였다. 그는 다시 한 번, 일본이 인도차이나에 자리를 파고드는 것을 우리가 못 본 체할 수 없으며 그것은 미국과 그 벗들에 대한 위협을 점점 키우는 결과를 낳는다는 것, 우리가 이 정세를 두고 계속 요행을 바랄 수 없다는 것, 그리고 우리는 우리 자신이 태평양에서 걷어차여 쫓겨나도록 두지 않겠다는 것을 강조하였다. 국무장관은 일본군이 인도차이나로 대거 이동하고 있다고 우리가 신문과 그 밖의 소식통에서 받은 보고에 주의를 환기하고, 일본의 정치가들이 우리를 동아시아에서 몰아내겠다고 말하는 마당에 일본의 대군이 인도차이나 어딘가에 있다면 우리로서는 그 사태에 그만큼 더 주의를 기울이지 않을 수 없다는 것을 분명히 하려 애썼다. 그는 일본의 군부 지도자들이 무슨 짓을 할 것 같은지 우리가 확신할 수 없고, 일본 육군이 어디에 병력을 상륙시키려 하는지 우리가 알지 못하며, 이런 까닭에 우리는 가만히 앉아 있을 수 없고 어떻게든 이 일들을 풀어내지 않으면 안 된다고 지적하였다. 국무장관은 이 정세가 자기에게 매우 고통스러운 것이었다고 설명하고, 일본 정부에 영향을 미치는 일에서 대사가 무엇인가 할 수 있을지 자기는 알지 못한다고 하였다. 구루스 씨는 여러 달의 회담이 뜻해 온 그 노력에서 아무것도 나오지 않는다면 부끄러운 일이라고 느낀다고 말하였다. 그는 [776면] 한때 두어 가지 점을 빼고는 양쪽이 합의에 가까이 갔었다고 느끼는데, 우리의 최근 제안은 양쪽을 전보다 더 멀어지게 하는 것으로 보인다고 말하였다.\n\n국무장관은 우리가 진전의 방향으로 나아가기 시작할 때마다 일본 군부가 우리를 뒤엎는 무슨 일인가를 한다고 지적하였다. 국무장관은 그동안 나온 온갖 위협에 비추어 이제 우리가 앞으로 나아갈 수 있을지 심히 의심스럽다고 밝혔다. 그는 일본 군국주의자들의 행위가 두 대사의 손을 단단히 묶어 놓았으며, 두 대사가 그 손을 푸는 쪽으로 무엇인가를 이루어 낼 수 있을지 자기는 알지 못한다고 지적하였다. 구루스 씨는 앞서 여러 차례 내세운 주장, 곧 중국이 워싱턴 회의 조약들을 이용하여 일본을 업신여겨 왔다는 주장을 다시 꺼내고, 우리가 조심하지 않으면 중국이 미국과 일본을 둘 다 팔아넘길 것이라고 논평하였다. 국무장관은 자기가 일본의 행위와 발언에 담긴 갖가지 모순들을 헤치고 나오는 중이라고 말하였다. 그는 일본 측이 우리에게 무엇인가 빨리 이루어지지 않으면 끔찍한 일이 벌어지려 한다고 말해 왔으며, 지연의 위험을 국무장관에게 거듭 역설하고 무엇인가 하라고 국무장관을 계속 몰아세워 왔음을 지적하였다. 그는 그 온갖 혼란과 위협과 압박에 비추어 자기가 이 안개 낀 분위기를 걷어 내기 위하여 무엇인가 해야 한다고 느끼는 단계에 이르게 되었고, 자기의 결론은 우리를 근본으로 되돌려 놓아야 한다는 것이었으며, 그 근본은 11월 26일 우리가 일본 측에 내놓은 제안에 담겨 있다고 말하였다. 그는 우리가 이 제안에 관련된 여러 점 위에 처음부터 서 있어 왔다고 말하였다. 그는 일본이 하고 있고 말하고 있는 모든 것이 우리가 회담에서 이야기해 온 진로와 정확히 반대되는 방향이며, 우리가 평화를 더 진지하게 논할 수 있으려면 그의 정부가 이것들을 되돌려 놓아야 한다고 지적하였다.\n\n구루스 씨는 일본 육군의 직선적인 군인 사고방식에 대하여 얼마간 군색한 변명을 해 보려 애썼고, 도조 대장이 사태를 통제할 수 있는 자리에 있다고 논평하였다. 국무장관은 일본에서 평화를 생각하는 사람들이 나서서 자기 뜻을 밝힐 가능성이 얼마나 있는지 물었다. 그는 일본에서 정복을 설파하지 않는 한 누구든 자유로이 말할 수 있을지 의심스럽다고 밝혔다. 대사는 일본 국민은 정복을 이야기하고 있지 않다고 논평하였다. 국무장관은 「지배적 영향력」, 「동아시아 신질서」, 「공영권」 같은 말들이 무엇을 함축하는지 우리 모두가 안다고 지적하였다. 국무장관은 히틀러도 정복의 목적을 위한 동의어로 그와 비슷한 말들을 써 왔다고 말하였다. 국무장관은 이어 미합중국과 일본 사이에 충돌할 까닭이 없으며 이해(利害)의 참된 상충이 없다고 말하였다. 그는 일본이 식탁의 상석에 자리를 얻기 위하여 칼을 쓸 필요는 없다고 덧붙였다. 그는 기회의 균등이야말로 우리 의견으로는 모든 나라의 앞날의 평화와 번영에 이르는 열쇠라고 지적하였다.\n\n[777면]\n\n구루스 씨는 일본의 목적과 히틀러의 목적 사이에 어떠한 유사성도 없다고 일본 측으로서 부인하였다. 대사는 전쟁이 결코 아무것도 해결하지 못하며 태평양에서의 전쟁은 비극이 되리라고 지적하면서도, 일본 국민은 미합중국이 일본을 중국과 계속 싸우게 하고 일본의 목을 조른 채로 두고자 한다고 믿는다고 덧붙였다. 그는 일본 국민이 미합중국에 항복하느냐 싸우느냐의 갈림길에 놓여 있다고 느낀다고 말하였다. 대사는 자기가 아직도 이 사태를 구하려 애쓰고 있다고 말하였다. 국무장관은 자기가 여기서 사실상 진을 다 뺐으며, 미국 국민은 이 정세에 이 나라에 대한 진짜 위험이 있다고 여기게 될 것이고, 자기로서는 그것을 막기 위하여 할 수 있는 일이 아무것도 없다고 말하였다.\n\n두 대사는 국무장관의 진술에 비추어 그의 처지를 이해하였다고 말하고, 무엇을 할 수 있을지 알아보기 위하여 이 문제를 일본 정부에 보고하겠다고 말하였다.\n\n[Joseph W.] Ballantine [조지프 W.] 밸런타인", "secondary": "[Washington,] December 1, 1941.\n\nThe Japanese Ambassador and Mr. Kurusu called at their request at the Department. Mr. Kurusu said that he noted that the President was returning to Washington in advance of his schedule and inquired what the reason for this was. The Secretary indicated that one of the factors in the present situation was the loud talk of the Japanese Prime Minister. [주67a] The Secretary added that the Prime Minister seemed to be in need of advice which would deter him from indulging in such talk at a time when the Ambassador was here talking about good relations. The Secretary then asked the Japanese how they felt about the general trend in the world situation, especially the situation in Libya and Russia. The Japanese Ambassador replied to the effect that their attention had been largely engrossed in the situation as between the United States and Japan. The Secretary observed that from our point of view we felt much interest in and were very much encouraged about the news from Libya and Russia and it looked as if we might be turning the corner into a more favorable situation.\n\n[773면]\n\nThe Ambassador and Mr. Kurusu endeavored to convince the Secretary that in this country we seem to take a more serious view of the Japanese Prime Minister’s utterances than was warranted. Mr. Kurusu said that what the Prime Minister had done was nothing more than a ten-minute broadcast. The Secretary pointed out that a broadcast was all the more effective. Mr. Kurusu said that the Prime Minister had been misquoted and asked whether we had heard anything from Ambassador Grew. The Secretary replied that we had heard nothing from Ambassador Grew and that we felt that the Associated Press was reliable and that we should give credence to its reports of what the Prime Minister said. Mr. Kurusu said that Japanese news services did not always correctly translate statements into English.\n\nThe Secretary said that he had been talking peace for nine months with the Japanese Ambassador, both of them acting in entire good faith. He said that during all the time that Matsuoka was holding forth on the Tripartite Alliance and engaging in general bluster, the Secretary had ignored all of that. Then while the talks were in progress last July the Japanese moved suddenly into Indochina without any advance notice to this Government, and possibly the Ambassador was not informed of the Japanese Government’s intention in advance. Then, too, the Secretary said, the Japanese press had been conducting a blustering campaign against the United States. The Secretary said that this Government had no idea of trying to bluff Japan and he saw no occasion for Japan’s trying to bluff us, and he emphasized that there is a limit beyond which we cannot go further and that one of these days we may reach a point when we cannot keep on as we are.\n\nMr. Kurusu said that the Japanese Government had been very much surprised at the reaction in this country to the Prime Minister’s statements and he would see to it that the Secretary was given a correct translation of the Prime Minister’s statements. He said he hoped we would get something from Ambassador Grew. He then said that he was pleased to inform the Secretary that the document we had given them on November 26 had been communicated to the Japanese Government, that the Japanese Government is giving the case study, and that within a few days the Japanese Government’s observation thereon would be communicated to us. He then said that the Japanese Government believed that the proposal which they submitted to us on November 20 was equitable and that full consideration had been given therein to the points of view taken by both sides in the conversations; that the Japanese Government finds it difficult to understand the position taken by the Government of the United States; and that the proposal which we had communicated to them seemed [774면] to fail to take cognizance of the actual conditions in the Far East. He said that his Government directed him to inquire what was the ultimate aim of the United States in the conversations and to request this Government to make “deep reflection of this matter”. Mr. Kurusu said that the Japanese offer to withdraw its troops from southern Indochina still stands; that Japan has shown its extreme desire to promote a peaceful settlement.\n\nThe Secretary replied that we had to take into account the bellicose utterances emanating from Tokyo and that never would there be possible any peaceful arrangements if such arrangements have to be based upon principles of force. He pointed out that the methods the Japanese are using in China are similar to those which are being adopted by Hitler to subjugate Europe. The Secretary said that he had called attention to that during the progress of our conversations and that we cannot lose sight of the movement by Hitler to seize one-half of the world. He said that we believe that the Japanese militarists are moving in a similar direction to seize the other half of the earth, and that this Government cannot yield to anything of that kind. He explained that this is why we desire to work things out in a way that would promote peace, stability and prosperity and that this is why he has thus far made no complaint, notwithstanding the fact that the Japanese press has heaped filthy abuse on this country.\n\nThe Ambassador expressed the view that as a matter of fact there is not much difference between Japan’s idea of a co-prosperity sphere and Pan-Americanism, except that Japanese methods may be more primitive. He denied that it was Japan’s purpose to use force. The Secretary asked whether, when the Japanese Government was moving on the territory of other countries, inch by inch by force, the Ambassador thought that this was a part of our policy. The Ambassador replied that Japan was motivated by self-defense in the same way as Britain had been motivated by her acts, for example, in Syria; that Japan needed rice and other materials at a time when she was being shut off by the United States and other countries and she had no alternative but to endeavor to obtain access to these materials.\n\nThe Secretary observed that the Japanese are saying that the United States has no right to interfere with what Japan is doing in eastern Asia; that when the Japanese keep their troops in Indochina this constitutes a menace to the South Sea area, irrespective of where in Indochina the troops are stationed; that the stationing of these troops in Indochina is making it necessary for the United States and its friends to keep large numbers of armed forces immobilized in east Asia, and in this way Japan’s acts were having the effect of aiding Hitler. The Secretary reminded the Ambassador that he had made it clear to the Ambassador that we could not sit still while such developments were taking place.\n\n[775면]\n\nThe Ambassador commented that today war is being conducted through the agency of economic weapons, that Japan was being squeezed, and that Japan must expand to obtain raw materials. The Secretary pointed out that we were selling Japan oil until Japan suddenly moved into Indochina; that he could not defend such a situation indefinitely; and that the United States would give Japan all she wanted in the way of materials if Japan’s military leaders would only show that Japan intended to pursue a peaceful course. The Secretary emphasized that we do not propose to go into partnership with Japan’s military leaders; that he has not heard one whisper of peace from the Japanese military, only bluster and blood-curdling threats. The Secretary added that he had been subjected to very severe criticism for his policy of patience but that he would not mind if only the Japanese Government could back him up.\n\nThe Secretary went on to enumerate various points in the Japanese proposal of November 20. He reminded the Ambassador that on November 22 he had promptly told the Ambassador that we could not sell oil to the Japanese Navy, although we might be prepared to consider the release of some oil for civilian purposes. He made it clear that this Government was anxious to help settle the China affair if the Japanese could reach a settlement in accordance with the basic principles which we had discussed in our conversations, and that under such circumstances we would be glad to offer our good offices. The Secretary went on to say that under existing circumstances, when Japan was tied in with the Tripartite Pact, Japan might just as well ask us to cease aiding Britain as to cease aiding China. He emphasized again that we can’t overlook Japan’s digging herself into Indochina, the effect of which is to create an increasing menace to America and her friends; that we can’t continue to take chances on the situation; and that we will not allow ourselves to be kicked out of the Pacific. The Secretary called attention to reports that we have received from the press and other sources of heavy Japanese troop movements into Indochina and endeavored to make it clear that, when a large Japanese army is anywhere in Indochina, we have to give that situation all the more attention when Japanese statesmen say that they will drive us out of east Asia. He pointed out that we cannot be sure what the Japanese military leaders are likely to do, that we do not know where the Japanese Army intends to land its forces, and that for this reason we cannot sit still but will have to puzzle these things out in some way. The Secretary explained that this situation had been very painful to him and he did not know whether the Ambassador could do anything in the matter of influencing the Japanese Government. Mr. Kurusu said that he felt it was a shame that nothing should come out of the efforts which the conversations of several months had represented. He said he felt [776면] that the two sides had once been near an agreement except for two or three points, but that our latest proposals seem to carry the two sides further away than before.\n\nThe Secretary pointed out that every time we get started in the direction of progress the Japanese military does something to overturn us. The Secretary expressed grave doubts whether we could now get ahead in view of all the threats that had been made. He pointed out that the acts of the Japanese militarists had effectively tied the hands of the Ambassadors and he did not know whether the Ambassadors could succeed in having anything accomplished toward untying their hands. Mr. Kurusu brought up again his contention made on previous occasions that China had taken advantage of the Washington Conference treaties to flaunt Japan, and commented that if we don’t look out China will sell both the United States and Japan down the river. The Secretary observed that he has been plowing through various contradictions in Japanese acts and utterances. He pointed out that the Japanese had been telling us that if something quick is not done something awful was about to happen; that they kept urging upon the Secretary the danger of delay, and kept pressing the Secretary to do something. He said that in view of all the confusion, threats and pressure, he had been brought to the stage where he felt that something must be done to clear the foggy atmosphere; that his conclusion was that he must bring us back to fundamentals; and that these fundamentals were embodied in the proposal which we had offered the Japanese on November 26. He said that we have stood from the first on the points involved in this proposal. He pointed out that everything that Japan was doing and saying was in precisely the opposite direction from the course we have been talking about in our conversations, and that these should be reversed by his government before we can further seriously talk peace.\n\nMr. Kurusu endeavored to make some lame apology for the direct military mind of the Japanese Army and commented that General Tojo was in position to control the situation. The Secretary asked what possibility there was of peace-minded people coming out in Japan and expressing themselves. He expressed doubt whether anybody in Japan would be free to speak unless he preached conquest. The Ambassador commented that the Japanese people are not talking about conquest. The Secretary pointed out that we all understand what are the implications of such terms as “controlling influence”, “new order in east Asia”, and “co-prosperity sphere”. The Secretary observed that Hitler was using similar terms as synonyms for purposes of conquest. The Secretary went on to say that there was no reason for conflict between the United States and Japan, that there was no [777면] real clash of interests. He added that Japan does not have to use a sword to gain for herself a seat at the head of the table. He pointed out that equality of opportunity is in our opinion the key to the future peace and prosperity of all nations.\n\nMr. Kurusu disclaimed on the part of Japan any similarity between Japan’s purposes and Hitler’s purposes. The Ambassador pointed out that wars never settle anything and that war in the Pacific would be a tragedy, but he added that the Japanese people believe that the United States wants to keep Japan fighting with China and to keep Japan strangled. He said that the Japanese people feel that they are faced with the alternative of surrendering to the United States or of fighting. The Ambassador said that he was still trying to save the situation. The Secretary said that he has practically exhausted himself here, that the American people are going to assume that there is real danger to this country in the situation, and that there is nothing he can do to prevent it.\n\nThe Ambassadors said that they understood the Secretary’s position in the light of his statements and they would report the matter to the Japanese Government with a view to seeing what could be done.\n\n[Joseph W.] Ballantine", "notes": ["[주67a] 도조 대장의 연설에 관하여는 주일대사가 보낸 1941년 12월 1일 오후 3시자 전보 제1869호, 148면을 보라."], "warn": false, "pages": ["0839", "0840", "0841", "0842", "0843"], "search": "Hull 헐(Cordell Hull, 국무장관) — 원문에는 「국무장관」으로만 나온다 Nomura 노무라(野村吉三郎, 주미대사) — 원문에는 「일본 대사」로만 나온다 Kurusu 구루스(来栖三郎, 특사) Ballantine 밸런타인(Joseph W. Ballantine, 기록자) Roosevelt 루스벨트 — 원문에는 「대통령」으로만 나온다 Grew 그루(Joseph Grew, 주일대사) Tojo 도조(東條英機) — 본문에는 「일본 총리」·「도조 대장」으로 나온다 Matsuoka 마쓰오카(松岡洋右, 전 외상) Hitler 히틀러"}, {"id": "d412", "order": 412, "date": "1941-12-02", "group": "A", "eyebrow": "d412 · Memorandum of a Conversation", "title": "회담 비망록", "badge": null, "list_right": "문서 412", "meta": [{"k": "일자", "v": "1941-12-02"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/25944/8", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 412 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d412"}], "summary": "일본대사관 1등서기관 데라사키가 슈미트에게, 11월 30일 이른바 도조 연설 보도에 크게 곤혹스러웠으며 본국에 그런 발언을 삼가 달라고 타전했다고 털어놓는다.", "points": ["데라사키가 밸런타인과의 약속 면담을 마친 뒤 슈미트에게 잠시 이야기를 청했다.", "데라사키는 11월 30일 이른바 도조 연설에 관한 신문 보도에 크게 곤혹스러웠다고 말하고, 앞서 밸런타인에게 준 문서 사본을 슈미트에게 건넸다.", "데라사키는 미국 내 언론 반응을 보자마자 본국에 타전해, 워싱턴에서 회담이 진행되는 동안 총리가 그런 발언을 하는 것을 개탄한다고 알렸다고 했다.", "데라사키는 자신도 본국 정부도 「기겁했다(flabbergasted)」고 했고, 전날 밤 도쿄에서 온 전문을 받고 크게 안도했다고 말했다.", "비공개·오프더레코드 발언으로, 구루스가 지난 일요일 밤 일본 외무성 미국국장 야마모토와 통화하며 도조 연설을 언급하자 야마모토는 어리둥절해하며 「무슨 연설 말인가」라고 되물었다고 했다.", "데라사키는 도조 연설에 대한 일본 측 해명을 어떤 방식으로 공표하기를 국무부가 원하는지 밸런타인이 알려 주기로 한 건을 상기시키며, 연락을 재촉해 달라고 부탁했다."], "primary": "[워싱턴,] 1941년 12월 2일.\n\n데라사키(寺崎英成, Terasaki) 씨[주67b]는 약속에 따라 밸런타인 씨를 방문한 뒤, 슈미트 씨와 잠시 이야기를 나눌 수 있겠는지 물었다.\n\n데라사키 씨는 11월 30일의 이른바 도조(東條英機, Tojo) 연설에 관한 신문 보도로 매우 곤혹스러웠다고 말하면서, 앞서 밸런타인 씨에게 건넸던 문서의 사본을 슈미트 씨에게 건넸다(사본이 첨부되어 있다).[주68] 데라사키 씨는, 도조 총리의 것으로 전해진 발언에 대한 이 나라 언론의 반응을 알아차리자마자 곧바로 본국 정부에 타전하여, 여기 워싱턴에서 회담이 진행되는 동안 총리가 그런 종류의 발언을 하는 것을 개탄한다고 알렸다고 말했다. 데라사키 씨는 자신도 자국 정부도 「기겁했다(flabbergasted)」고 말하고, 이어 어젯밤 도쿄로부터 밸런타인 씨와 슈미트 씨에게 건넨 그 전문을 받고 크게 안도했다고 말했다.\n\n[778면]\n\n데라사키 씨는, 도조 대장의 연설에 대한 일본 측 해명을 국무부가 어떤 방식으로 공표하기를 바라는지 밸런타인 씨가 자기에게 알려 주기로 한 자신의 요청을 언급했다. 데라사키 씨는 슈미트 씨에게, 밸런타인 씨가 이 건에 관해 무언가 소식을 얻는 대로 자기에게 연락하도록 상기시켜 달라고 부탁했다.\n\nM[ax] W. S[chmidt]", "secondary": "[Washington,] December 2, 1941.\n\nAfter calling on Mr. Ballantine by appointment Mr. Terasaki [주67b] asked if he might have a short chat with Mr. Schmidt.\n\nMr. Terasaki said that he had been greatly distressed by the newspaper reports of the so-called Tojo speech on November 30 and handed Mr. Schmidt a copy of the document he had previously given Mr. Ballantine (a copy is attached). [주68] Mr. Terasaki said that he had, immediately after noticing the press reaction in this country to the statements attributed to Premier Tojo, telegraphed to his Government deprecating remarks of that sort by the Prime Minister during the course of conversations here in Washington. Mr. Terasaki said that both he and his Government had been “flabbergasted” and went on to say that he had been greatly relieved to receive last night from Tokyo the message he had given Mr. Ballantine and Mr. Schmidt.\n\nStating that his remarks were confidential and off the record Mr. Terasaki said that when Mr. Kurusu had talked with Mr. Yamamoto, Chief of the American Bureau of the Japanese Foreign Office, last Sunday night and had referred to the speech which General Tojo had made, Mr. Yamamoto had been nonplused and had asked “What speech”.\n\n[778면]\n\nMr. Terasaki referred to his request to Mr. Ballantine that Mr. Ballantine inform him as to the manner in which the Department desired the Japanese explanation of General Tojo’s speech to be made public. Mr. Terasaki asked Mr. Schmidt if he would remind Mr. Ballantine to get in touch with Mr. Terasaki as soon as he had any information on this subject.\n\nM[ax] W. S[chmidt]", "notes": ["[주67b] 일본대사관 1등서기관.", "[주68] 아래 문서."], "warn": false, "pages": ["0844"], "search": "데라사키(寺崎英成, Terasaki) — 주미 일본대사관 1등서기관 밸런타인(Joseph W. Ballantine) 슈미트(Max W. Schmidt) — 비망록 작성자 도조(東條英機, Tojo) — 일본 총리 구루스(来栖三郎, Kurusu) — 특사 야마모토(山本熊一, Yamamoto) — 일본 외무성 미국국장"}, {"id": "d413", "order": 413, "date": "1941-12-02", "group": "E", "eyebrow": "d413 · Statement Handed by the First Secretary of the Japanese Embassy (Terasaki) to Mr. Joseph W. Ballantine on December 2, 1941", "title": "일본대사관 1등서기관 데라사키가 1941년 12월 2일 조지프 W. 밸런타인 씨에게 건넨 성명", "badge": null, "list_right": "문서 413", "meta": [{"k": "일자", "v": "1941-12-02"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/25944/8", "txt": true}, {"k": "발신", "v": "일본대사관 1등서기관 데라사키(寺崎英成, Terasaki)", "txt": true}, {"k": "수신", "v": "조지프 W. 밸런타인(Joseph W. Ballantine)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "성명"}], "links": [{"k": "FRUS", "text": "문서 413 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d413"}], "summary": "이른바 11월 30일 도조 총리 연설은 총리가 실제로 행한 것이 아니라 흥아동맹 사무국원이 초안한 축사가 결재 전에 신문에 넘어간 것이며, 문제된 구절도 오역이라는 일본 측 해명.", "points": ["이른바 도조 연설은 동아부흥연맹(East Asia Restoration League)이라는 민간 단체의 사무국원들이 작성한 축사 초안이었다. 도조는 마침 그 단체의 총재였을 뿐이라고 한다.", "축사는 11월 30일 일화기본관계조약 체결 1주년 기념 행사에서 낭독될 예정이었다.", "11월 30일이 마침 일요일이어서, 사무국원들이 29일(토요일) 밤 기자들의 요청에 따라 원고를 건넸고, 총리도 다른 정부 관계자도 검토하기 전이었는데 그 미결재 원고가 도쿄 신문들에 실렸다.", "실제로 총리는 30일에 어떠한 연설도 하지 않았고, 총리도 다른 정부 당국도 그 연설의 내용을 알지 못했다고 한다.", "보도된 「인류의 명예와 긍지를 위하여 우리는 이런 종류의 관행을 동아시아에서 기어이 소탕해야 한다」는 구절은 오역이며, 원문에는 「소탕(purge)」이나 「기어이(with a vengeance)」에 해당하는 표현이 없다고 한다.", "올바른 번역은 「인류의 명예와 긍지를 위하여 이런 종류의 관행은 제거되어야 한다」라는 것이다."], "primary": "1941년 12월 2일\n\n이른바 도조 히데키(東條英機, Hideki Tojo) 총리의 연설은, 본래 동아부흥연맹(East Asia Restoration League)—도조 씨가 마침 그 총재로 있는 비정부 단체—의 사무국원들이 초안한 것으로, 동 연맹의 주최로 11월 30일 일화기본관계조약[주68a] 체결 1주년을 기념하는 자리에서 낭독될 축사였다.\n\n그런데 11월 30일이 마침 일요일이었으므로, 연맹 사무국원들이 11월 29일(토요일) 밤 신문기자들의 요청에 따라 그 원고를 내주었는데, 이는 해당 초안이 총리 자신이나 다른 정부 관계자에 의하여 검토되기 전이었으며, 이 결재되지 않은 원고가 도쿄의 신문들에 실린 것이다.\n\n사실인즉, 총리 자신은 30일에 어떠한 종류의 연설도 하지 않았다. 더욱이 총리도 다른 정부 당국자도 해당 연설의 내용에 관하여 아무런 지식이 없었다.\n\n또한 다음을 유의해야 한다. 보도된 「인류의 명예와 긍지를 위하여 우리는 이런 종류의 관행을 동아시아에서 기어이 소탕해야 한다(For the honor and pride of mankind we must purge this sort of practice from East Asia with a vengeance)」라는 말은 원문의 오역이다. 원문에는 「소탕한다(purge)」거나 「기어이(with a vengeance)」와 같은 표현이 없다. 그 말의 올바른 번역은 「인류의 명예와 긍지를 위하여 이런 종류의 관행은 제거되어야 한다(For the honor and pride of mankind, this sort of practice must be removed)」라야 한다.", "secondary": "December 2, 1941\n\nThe so-called speech of Premier Hideki Tojo was originally drafted by members of the office staff of the East Asia Restoration League, a non-governmental organization of which Mr. Tojo happens to be President, as a congratulatory address to be delivered on November 30, on the occasion commemorating the first anniversary of the conclusion of the Treaty Concerning the Basic Relations between Japan and China, [주68a] under the auspices of the said League.\n\nHowever, November 30 happened to be Sunday; the League staff gave out the manuscript to the newspaper reporters upon their request on the night of November 29 (Saturday), before the said draft was examined by either the Premier himself or other Government officials, and this unapproved manuscript was printed in the metropolitan newspapers.\n\nAs a matter of fact, the Premier himself made no speech of any kind on the 30th. Moreover, neither the Premier nor other government authorities had any knowledge as to the content of the said speech.\n\nIt should further be noted that the reported statement “For the honor and pride of mankind we must purge this sort of practice from East Asia with a vengeance” is a mistranslation of the original text. There is, in the original text, no such expression as “purge” or “with a vengeance.” The correct translation of the statement should be “For the honor and pride of mankind, this sort of practice must be removed.”", "notes": ["[주68a] 1940년 11월 30일 난징에서 왕징웨이(汪精衛, Wang Ching-wei)와 서명한 조약, 117면."], "warn": false, "pages": [], "search": "데라사키(寺崎英成, Terasaki) — 주미 일본대사관 1등서기관 밸런타인(Joseph W. Ballantine) 도조(東條英機, Hideki Tojo) — 일본 총리 왕징웨이(汪精衛, Wang Ching-wei) — 각주에만 나온다"}, {"id": "d414", "order": 414, "date": "1941-12-02", "group": "A", "eyebrow": "d414 · Memorandum of a Conversation", "title": "회담 비망록", "badge": null, "list_right": "문서 414", "meta": [{"k": "일자", "v": "1941-12-02"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2594⅝", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 414 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d414"}], "summary": "헐의 결근으로 대통령의 지시를 받은 웰스 국무차관이 노무라 대사와 구루스를 불렀다. 남부 인도차이나로의 일본군 증파 이유와 일본 정부의 정책이 무엇인지 묻는 대통령의 성명을 읽어 준 기록이다.", "points": ["국무장관이 가벼운 몸살로 결근하여 대통령이 웰스에게 일본 대사와 구루스를 불러 대통령의 통고를 받게 하라고 요청했다. 성명 사본이 대사에게 건네졌다.", "대통령 성명: 최근 며칠 사이 남부 인도차이나로의 일본군 이동이 계속된다는 보고를 받았으며, 인도차이나에 주둔한 일본의 각종 병력이 매우 급속하고 실질적으로 늘어났음을 보여 준다.", "대통령은 일본과 비시 프랑스 정부 사이 협정의 조건상 인도차이나 주둔이 허용된 일본군 총수가 이미 그곳에 있는 병력 총수보다 상당히 적은 것으로 분명히 이해하고 있었다고 밝힌다.", "그만한 병력은 그 지역 치안에 필요할 리 없으므로 추가 침략 목적의 사용을 뜻하는 것으로 보이며, 필리핀 제도·동인도 제도·버마·말라야, 또는 강압이나 실제 무력 사용에 의한 타이 점령이 그 대상일 수 있다고 한다.", "대통령은 두 대사에게 이미 취해진 조치의 실제 이유와, 이 최근의 급속한 병력 집중이 보여 주는 일본 정부의 정책이 무엇인지 즉시 본국 정부에 문의해 줄 것을 요청한다. 최근 몇 해 유럽에서 같은 성격의 군사적 조치를 이용해 자유롭고 독립한 인민들의 영토와 권리를 꾸준히 잠식해 온 독일 정부의 정책을 보아 왔기 때문이라고 밝힌다.", "노무라는 본국 정부의 의도를 통보받은 바 없어 권위 있게 말할 수 없으나 즉시 전달하겠다고 했고, 구루스는 11월 20일 남부에서 북부로 전 병력을 옮기겠다고 제의한 점에서 미국에 대한 위협 의도가 없음이 명백하다고 했다.", "노무라는 일본 국민이 경제적 조치를 군사적 조치보다 훨씬 효과적인 전쟁 무기로 여기며, 미국의 심한 압력에 굴복하느니 싸우는 편이 낫다고 믿는다고 지적하고, 만족스럽지 못한 협정이라도 협정이 아예 없는 것보다 낫다고 말했다.", "구루스는 11월 26일 미국 제안에 일본 정부가 받아들이기 어려운 점들이 있다고 하고, 6월 21일 미국 초안과 9월 25일 일본 초안 사이에 조정되지 않은 세 가지 미해결 사항으로 되돌아가 노력을 재개할 의향이 있는지 물었다. 웰스는 11월 26일 제안이 언제나 그러했던 미국의 완전한 입장을 다시 진술하려는 노력이었다고 하면서도 그 제의를 국무장관에게 전하겠다고 답했다."], "primary": "[워싱턴,] 1941년 12월 2일.\n\n국무차관은 국무장관이 가벼운 몸살로 국무부에 나오지 않았으며, 그래서 대통령이 웰스(Sumner Welles) 씨에게 일본 대사와 [779면] 구루스(来栖三郎, Kurusu) 씨를 불러 대통령이 그들에게 하고자 하는 통고를 받게 해 달라고 요청했다고 말했다. 이어서 웰스 씨는 두 각하에게 다음의 성명을 읽어 주었다(그 사본 한 부는 대사에게 건네졌다).\n\n「나는 지난 며칠 동안 일본군이 남부 인도차이나로 계속 이동하고 있다는 보고들을 받았다. 이 보고들은 일본이 인도차이나에 주둔시킨 온갖 종류의 병력이 매우 급속하고도 실질적으로 늘어나고 있음을 보여 준다.\n\n「일본과 비시 소재 프랑스 정부 사이의 협정 — 그 협정의 성격을 지금 논할 필요는 없다 — 의 조건에 따라 인도차이나에 주둔이 허용된 일본군의 총수가 이미 그곳에 가 있는 병력의 총수보다 상당히 적다는 것이 나의 분명한 이해였다.\n\n「이렇게 늘어난 일본군을 인도차이나에 주둔시키는 것은 일본이 그 병력을 더 나아간 침략의 목적에 이용하려 함을 뜻하는 것으로 보인다. 그 지역의 치안 유지에 그만한 수의 병력이 필요할 리는 도저히 없기 때문이다. 그러한 침략은 필리핀 제도에 대한 것일 수도 있고, 동인도의 여러 섬에 대한 것일 수도 있으며, 버마에 대한 것일 수도, 말라야에 대한 것일 수도, 또는 강압을 통해서든 실제 무력 사용을 통해서든 타이를 점령하려는 것일 수도 있다. 물론 그러한 새로운 침략은 이미 중국에 대해 저질러진 침략 행위들에 더해지는 것이다. 중국에 관한 우리 태도는 잘 알려져 있고 일본 정부에 거듭 진술되어 왔다.\n\n「일본 대사와 구루스 대사에게, 이미 취해진 조치들의 실제 이유가 무엇인지, 그리고 최근의 이 급속한 인도차이나 병력 집중이 보여 주는 일본 정부의 정책을 내가 무엇으로 여겨야 하는지를 일본 정부에 즉시 문의하도록 요청해 주기 바란다. 미국 정부는 지난 몇 해 동안 유럽에서, 바로 같은 성격의 군사적 조치를 이용하여 자유롭고 독립한 인민들의 영토와 권리를 끊임없이 그리고 꾸준히 잠식해 온 독일 정부의 정책을 보아 왔다. 내가 일본 정부의 의도를 알고자 하는 것은 그 때문이며, 또한 미국 방위라는 넓은 문제 때문이다.」\n\n일본 대사는 자기가 일본 정부로부터 그 의도를 통보받지 못했으므로 이 문제에 관해 권위 있게 말할 수 없으나, 물론 이 성명을 즉시 본국 정부에 전달하겠다고 말했다. 구루스 씨는, 일본이 11월 20일에 남부 인도차이나의 전 병력을 북부 인도차이나로 옮기겠다고 제의한 점에 비추어 미국에 대한 어떠한 위협도 의도된 바 없음이 명백하다고 말했다. 구루스 씨와 대사는 둘 다, 인도차이나에는 적절한 육상 교통 시설이 없기 때문에 남부 인도차이나에 인접한 나라들에 대한 침략을 목적으로 북부에서 남부로 병력을 신속히 옮기는 일이 쉽게 이루어질 수 없다고 설명하려 애썼다. 구루스 씨는 대통령이 언급한 보고들이 [780면] 우리 당국에서 나온 것이냐고 물었다. 웰스 씨는 그 점에 관해서는 성명에 담긴 것 이상으로 말할 처지가 아니라고 말했다.\n\n대사는, 한쪽이 군비와 병력 배치를 강화하면 다른 쪽의 활동도 자연히 늘어나게 마련이므로 일본이 취하고 있는 조치는 그러한 사정에서 자연스러운 것으로 자기에게는 보인다고 말했다. 웰스 씨는 일본 대사도 충분히 알고 있을 터이지만 미국 정부는 일본에 대해 어떠한 침략적 의도도 가진 적이 없다고 진술했다. 대사는 이 문제로 논쟁에 들어가고 싶지는 않으나 다음을 지적하고자 한다고 말했다 — 일본 국민은 경제적 조치가 군사적 조치보다 훨씬 더 효과적인 전쟁 무기라고 믿고 있으며, 자기들이 미국의 입장에 굴복하도록 미국으로부터 심한 압력을 받고 있다고 믿고 있고, 압력에 굴복하느니 싸우는 편이 낫다고 여긴다는 것이다. 대사는 지금이 현명한 경륜이 필요한 정세이며, 전쟁은 아무것도 해결하지 못하고, 이러한 사정에서는 만족스럽지 못한 것일지라도 어떤 협정이 있는 편이 협정이 전혀 없는 것보다 낫다고 덧붙였다.\n\n웰스 씨는 우리가 일본에 제시하고 있는 해결책이야말로, 일본이 자기에게 열려 있다고 느낄 만한 다른 어떤 대안보다도 훨씬 더 확실하게 일본에 평화와 일본의 경제적 필요의 충족을 보장해 줄 것이라고 지적했다.\n\n구루스 씨는 자기가 아주 최근에 일본에서 왔으므로 일본에 널리 퍼져 있는 심리 상태에 관해서는 대사보다 자기가 더 정확하게 말할 수 있다고 말했다. 그는 우리 동결 조치가 일본에 일으킨 반응을 짧게 이야기하고, 그것이 고려에 넣지 않을 수 없는 심리 상태를 낳고 있다고 말했다.\n\n웰스 씨는, 두 대사도 충분히 이해하고 있을 터이지만 이 나라에도 고려에 넣지 않을 수 없는 심리 상태가 있으며, 그 심리 상태는 일본이 중국에서 4년 동안 취해 온 조치들이 일본 점령 지역에서 미국의 이익을 짜내어 몰아낸 결과로 생긴 것이라고 지적했다. 그러자 구루스 씨는 워싱턴 회의 조약들이 중국에 미친 영향에 관하여, 그리하여 중국이 일본의 권리를 무시하며 뽐내게 되었다는 데 관하여 앞서 두세 차례 했던 말을 되풀이했다. 그는 극동의 실제 정세에 비추어 볼 때 11월 26일 우리 제안에는 일본 정부가 받아들이기 어렵다고 여길 점들이 있다고 말했다. 웰스 씨는 우리 제안에 대한 일본 정부의 회답을 곧 기대해도 되겠느냐고 물었다. 대사는 그렇다고 답했으나, 그 제안이 일본 정부에 제기하는 중요한 문제들에 비추어 며칠이 걸릴 수도 있다고 말했다. 구루스 씨는 미국 정부가 양국 정부 사이에서 논의 중인 문제들을 검토함에 있어 냉정한 판단을 발휘해 주기를 바란다는 희망을 표명했다. 웰스 씨는 우리야말로 일본 정치가들 쪽에서 냉정한 판단을 발휘해 줄 것을 요구하고 있다고 말했다.\n\n[781면]\n\n이어서 구루스 씨는, 일본 측은 우리 논의에서 실질적인 진전이 있었다고 느끼고 있었으며, 일본 정부는 6월 21일 우리 초안과 9월 25일 일본 초안이 조정되지 않은 채 남은 세 가지 미해결 사항에 관하여 우리와 함께 어떤 해결을 이루어 낼 수 있으리라 기대하고 있었다고 말했다. 그는 지금까지 이루어진 온갖 진전에 비추어, 일본 정부가 보기에 완전히 새로 시작할 것을 요구하는 듯한 우리의 최근 제안처럼 새로운 각도에서 문제에 접근하는 대신, 그 세 가지 사항에 관한 우리 사이의 차이를 좁히려는 노력을 재개하는 것을 국무장관이 고려할 의향이 있겠느냐고 물었다.\n\n웰스 씨는 11월 26일 우리 제안이 언제나 그러했던 우리의 완전한 입장을 다시 진술하려는 노력이었다고 말했다. 그러나 그는 구루스 씨의 제의를 국무장관에게 기꺼이 전하겠다고 말했다.\n\nJ[oseph] W. B[allantine]", "secondary": "[Washington,] December 2, 1941.\n\nThe Under Secretary said that the Secretary was absent from the Department because of a slight indisposition and that the President had therefore asked Mr. Welles to request the Japanese Ambassador [779면] and Mr. Kurusu to call to receive a communication which the President wished to make to them. Mr. Welles then read to Their Excellencies the following statement (a copy of which was handed to the Ambassador):\n\n“I have received reports during the past days of continuing Japanese troop movements to southern Indochina. These reports indicate a very rapid and material increase in the forces of all kinds stationed by Japan in Indochina.\n\n“It was my clear understanding that by the terms of the agreement—and there is no present need to discuss the nature of that agreement—between Japan and the French Government at Vichy that the total number of Japanese forces permitted by the terms of that agreement to be stationed in Indochina was very considerably less than the total amount of the forces already there.\n\n“The stationing of these increased Japanese forces in Indochina would seem to imply the utilization of these forces by Japan for purposes of further aggression, since no such number of forces could possibly be required for the policing of that region. Such aggression could conceivably be against the Philippine Islands; against the many islands of the East Indies; against Burma; against Malaya or either through coercion or through the actual use of force for the purpose of undertaking the occupation of Thailand. Such new aggression would, of course, be additional to the acts of aggression already undertaken against China, our attitude towards which is well known, and has been repeatedly stated to the Japanese Government.\n\n“Please be good enough to request the Japanese Ambassador and Ambassador Kurusu to inquire at once of the Japanese Government what the actual reasons may be for the steps already taken, and what I am to consider is the policy of the Japanese Government as demonstrated by this recent and rapid concentration of troops in Indochina. This Government has seen in the last few years in Europe a policy on the part of the German Government which has involved a constant and steady encroachment upon the territory and rights of free and independent peoples through the utilization of military steps of the same character. It is for that reason and because of the broad problem of American defense that I should like to know the intention of the Japanese Government.”\n\nThe Japanese Ambassador said that he was not informed by the Japanese Government of its intentions and could not speak authoritatively on the matter but that of course he would communicate the statement immediately to his Government. Mr. Kurusu said that, in view of Japan’s offer of November 20 to transfer all its forces from southern Indochina to northern Indochina, it was obvious no threat against the United States was intended. Both Mr. Kurusu and the Ambassador endeavored to explain that owing to lack of adequate land communication facilities in Indochina a rapid transfer of forces from northern to southern Indochina for purposes of aggression against countries neighboring southern Indochina could not be easily effected. Mr. Kurusu asked whether the reports to which the President referred [780면] were from our authorities. Mr. Welles said that he was not in position to say any more on that point than was contained in the statement.\n\nThe Ambassador said that it appeared to him that the measures which Japan was taking were natural under the circumstances, as the strengthening of armaments and of military dispositions by one side naturally leads to increasing activity by the other side. Mr. Welles stated that, as the Japanese Ambassador must be fully aware, this Government has not had any aggressive intention against Japan. The Ambassador said that, while he did not wish to enter into a debate on the matter, he wished to point out that the Japanese people believe that economic measures are a much more effective weapon of war than military measures; that they believe they are being placed under severe pressure by the United States to yield to the American position; and that it is preferable to fight rather than to yield to pressure. The Ambassador added that this was a situation in which wise statesmanship was needed; that wars do not settle anything; and that under the circumstances some agreement, even though it is not satisfactory, is better than no agreement at all.\n\nMr. Welles pointed out that the settlement which we are offering Japan is one which would assure Japan of peace and the satisfaction of Japan’s economic needs much more certainly than any other alternative which Japan might feel was open to her.\n\nMr. Kurusu said that having just recently arrived from Japan he could speak more accurately of the frame of mind which is prevalent in Japan than could the Ambassador. He dwelt briefly upon the reaction which has been caused in Japan by our freezing measures and he said that this produces a frame of mind which has to be taken into account.\n\nMr. Welles pointed out that, as the Ambassadors must fully understand, there is a frame of mind in this country also which must be taken into account, and that frame of mind is produced by the effect of four years of the measures taken by Japan in China causing the squeezing out of American interests in Japanese-occupied areas. Mr. Kurusu then repeated what he had said two or three times previously about the effect of the Washington Conference treaties upon China which had caused China to flaunt Japan’s rights. He said that in view of the actual situation in the Far East there were points in our proposal of November 26 which the Japanese Government would find it difficult to accept. Mr. Welles asked whether we may expect shortly a reply from the Japanese Government on our proposal. The Ambassador replied in the affirmative, but said that it might take a few days in view of the important questions which it raised for the Japanese Government. Mr. Kurusu expressed the hope that the American Government would exercise cool judgment in its consideration of questions under discussion between the two Governments. Mr. Welles said that we are asking for cool judgment on the part of Japanese statesmen.\n\n[781면]\n\nThen Mr. Kurusu said that the Japanese felt that we had made real progress in our discussions and that the Japanese Government had been hopeful of being able to work out with us some settlement of the three outstanding points on which our draft of June 21 and the Japanese draft of September 25 had not been reconciled. He asked whether the Secretary would be willing to consider resuming our efforts to reconcile our differences on those three points, in view of all the progress that had been made, instead of approaching the problem from a new angle as we had done in our latest proposal which seemed to the Japanese Government to require a completely fresh start.\n\nMr. Welles said that our proposal of November 26 represented an effort to restate our complete position, as it has always stood. He said, however, that he would be glad to refer to the Secretary Mr. Kurusu’s suggestion.\n\nJ[oseph] W. B[allantine]", "notes": [], "warn": false, "pages": ["0845", "0846", "0847"], "search": "웰스(Sumner Welles) — 국무차관 헐(Cordell Hull) — 국무장관(본문에는 「국무장관」으로만 표기) 루스벨트(Franklin D. Roosevelt) — 대통령(본문에는 「대통령」으로만 표기) 노무라(野村吉三郎, Nomura) — 주미 일본대사(본문에는 「일본 대사」·「대사」로 표기) 구루스(来栖三郎, Kurusu) — 특사. 대통령 성명에서는 「구루스 대사」로 지칭 밸런타인(Joseph W. Ballantine) — 비망록 작성자"}, {"id": "d193", "order": 193, "date": "1941-12-05", "group": "C", "eyebrow": "d193 · The Secretary of State to the Japanese Ambassador (Nomura)", "title": "국무장관이 주미 일본대사(노무라)에게", "badge": null, "list_right": "문서 193", "meta": [{"k": "일자", "v": "1941-12-05"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "311.9454 Tatuta Maru/9", "txt": true}, {"k": "발신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "수신", "v": "The Japanese Ambassador (Nomura) 주미 일본대사 노무라", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 193 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d193"}], "summary": "일본 정부가 징발한 기선 다쓰타마루(Tatuta Maru)의 미국 항구 기항에 관하여, 국무장관이 일본 정부가 주장한 면제(immunity)를 인정하고 법무장관에게 관련 법원에 이를 알리도록 요청했다고 통고한다.", "points": ["1941년 12월 3일자 일본대사 공문 제330호에 대한 접수 확인이다.", "대상은 일본 정부가 징발한 기선 다쓰타마루의 미국 항구 기항 예정 건이다.", "국무장관은 대사 공문에 담긴 진술을 사실로 받아들이고, 일본 정부가 제기한 면제 주장을 승인·허용한다고 법무장관에게 알렸다.", "국무장관은 법무장관에게, 이 선박이 기항할 미국 및 파나마 운하 지대 항구를 관할하는 해당 법원들에 이 사안을 알리고 법원이 면제를 인정하도록 필요한 조치를 취해 줄 것을 요청했다.", "진주만 공습 이틀 전인 1941년 12월 5일 자 문서다."], "primary": "국무장관은 일본대사 각하께 경의를 표하며, 일본 정부가 징발한 기선 다쓰타마루(Tatuta Maru)의 미국 항구 기항 예정에 관한 1941년 12월 3일자 각하의 공문 제330호[주65]를 접수하였음을 알리는 영광을 가진다.\n\n국무장관은 법무장관에게, 대사의 공문에 담긴 진술들을 진실한 것으로 받아들이며 일본 정부가 제기한 면제(immunity) 주장을 인정하고 허용한다고 통고하였다. 국무장관은 법무장관에게, 이 문제를 해당 선박이 기항할 우리나라 및 파나마 운하 지대의 항구들을 관할하는 적절한 법원들의 주의에 회부하고, 그 면제가 법원에 의하여 인정될 수 있도록 필요한 조치를 취하여 줄 것을 요청하였다.\n\n워싱턴, 1941년 12월 5일.\n\n[277면]", "secondary": "The Secretary of State presents his compliments to His Excellenc
