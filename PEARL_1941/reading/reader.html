<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>진주만으로 가는 열 주 — 열람기</title>
<style>
:root{
  --bg:#eef1f4; --panel:#f7f9fa; --edge:#ccd4da; --edge-soft:#dde4e9;
  --ink:#16202a; --ink-2:#4a5b68; --ink-3:#71828f;
  --stamp:#8c2f39;            /* 기밀등급 도장의 자주색 */
  --link:#2f5d86;
  --a:#4a7c59; --b:#8a6d3b; --c:#3f6d8c; --d:#7a4a6b; --e:#5a6f7d; --x:#8a8f94;
  --term-line:#9db0c2; --term-bg:rgba(47,93,134,.05);
  --term-line-go:#7fa3c4; --term-bg-go:rgba(47,93,134,.10);
  --term-bg-on:rgba(47,93,134,.17);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",
         -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
    --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
    --stamp:#c9707a; --link:#7fb0da;
    --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
    --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
    --term-bg-on:rgba(127,176,218,.22);
    --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
  }
}
:root[data-theme="dark"]{
  --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
  --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
  --stamp:#c9707a; --link:#7fb0da;
  --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
  --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
  --term-bg-on:rgba(127,176,218,.22);
  --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--link)}

.wrap{display:grid;grid-template-columns:minmax(300px,25%) 1fr;height:100vh}

/* 좁은 화면 — 목록을 위로 접어 올리면 본문이 설 자리가 없다.
   목록은 서랍으로 빼고 화면 전부를 문서에 준다. */
.mbar{display:none}
.scrim{display:none}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;grid-template-rows:1fr;padding-top:44px}
  .mbar{display:flex;align-items:center;gap:10px;
    position:fixed;top:0;left:0;right:0;height:44px;z-index:30;padding:0 12px;
    background:var(--panel);border-bottom:1px solid var(--edge)}
  .mbar button{background:var(--term-bg-go);border:1px solid var(--term-line-go);
    color:var(--link);border-radius:999px;padding:3px 11px;cursor:pointer;
    font:inherit;font-size:12px;font-family:var(--mono);white-space:nowrap}
  .mbar-t{font-size:12.5px;font-weight:650;color:var(--ink-2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail{position:fixed;top:0;bottom:0;left:0;z-index:40;
    width:min(88vw,340px);max-height:none;
    transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:0 0 30px rgba(0,0,0,.35)}
  body.railopen .rail{transform:none}
  .scrim{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45);border:0;padding:0}
  body.railopen .scrim{display:block}
  .toolbar{padding:7px 16px;gap:8px}
  .toolbar #themeBtn{display:none}
  .mbar-t{flex:1}
  .mbar-th{padding:3px 9px;font-size:13px}
  .seg button{padding:4px 9px;font-size:11.5px}
  .srcline{padding:10px 16px 0}
}
@media(prefers-reduced-motion:reduce){.rail{transition:none}}

/* ── 좌측 목록 ─────────────────────────────── */
.rail{border-right:1px solid var(--edge);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
.rail-head{padding:14px 14px 10px;border-bottom:1px solid var(--edge-soft);
  display:flex;flex-direction:column;gap:8px}
/* 문서철에 들어오면 나갈 길이 있어야 한다 */
.home{display:inline-flex;align-items:center;gap:5px;text-decoration:none;
  color:var(--link);font-size:11.5px;font-family:var(--mono);
  letter-spacing:.04em;width:fit-content;
  background:var(--term-bg-go);border:1px solid var(--term-line-go);
  border-radius:999px;padding:2px 10px 2px 8px}
.home:hover{background:var(--term-bg-on);border-color:var(--link)}
.home span{font-size:12px;line-height:1}
.brand{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font-weight:400;letter-spacing:0;text-transform:none;
  color:var(--ink-3);font-size:11.5px;margin-top:2px}
input[type=search]{width:100%;padding:7px 10px;border:1px solid var(--edge);
  border-radius:3px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
input[type=search]:focus,button:focus-visible,.item:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--edge);background:transparent;color:var(--ink-2);
  border-radius:999px;padding:2px 9px;font-size:11.5px;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sortbar{display:flex;gap:10px;font-size:11.5px;color:var(--ink-3);align-items:center}
.sortbar button{background:none;border:none;color:var(--ink-3);cursor:pointer;
  font:inherit;padding:0;border-bottom:1px solid transparent}
.sortbar button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.list{overflow-y:auto;flex:1;min-height:0}
.item{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--edge-soft);border-left:3px solid transparent;
  padding:9px 13px;cursor:pointer;font:inherit;color:inherit}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--bg);border-left-color:var(--ink)}
.item.tA{border-left-color:var(--a)} .item.tB{border-left-color:var(--b)}
.item.tC{border-left-color:var(--c)} .item.tD{border-left-color:var(--d)}
.item.tE{border-left-color:var(--e)} .item.tX{border-left-color:var(--x)}
.item-top{display:flex;justify-content:space-between;gap:8px;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.item-sum{font-size:12.5px;line-height:1.45;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 제목이 「국무장관이 주한대사에게」 꼴이라 무엇을 읽는 것인지 알 수 없다.
   요지 한 줄을 옅게 깔아 준다. 목록이 길어지지 않도록 두 줄에서 자른다. */
.item-hint{font-size:11.5px;line-height:1.4;margin-top:3px;color:var(--ink-3);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── 우측 본문 ─────────────────────────────── */
.main{overflow-y:auto;min-height:0}
.toolbar{position:sticky;top:0;z-index:5;background:var(--panel);
  border-bottom:1px solid var(--edge);padding:8px 26px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px}
.toolbar .grow{flex:1}
.seg{display:flex;border:1px solid var(--edge);border-radius:3px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 11px;cursor:pointer;
  font:inherit;font-size:12px;color:var(--ink-2);border-right:1px solid var(--edge)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.srcline{padding:10px 26px 0;font-size:11px;color:var(--ink-3);line-height:1.5}

/* ── 연대 바 ───────────────────────────────
   5년 반을 한 줄에 욱여넣으면 1945년 8월 열흘은 0.5% 밖에 안 된다. 그래서
   줄을 늘여 놓고 **띠 자체를 움직인다** — 지금 읽는 문서의 날짜가 늘 정중앙이다.
   문서를 옮기면 띠가 미끄러지고, 사건 이름은 겹치지 않게 위아래로 층을 나눈다. */
.chrono{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
  width:min(940px,calc(100vw - 48px));z-index:20;user-select:none;
  border:1px solid var(--edge);border-radius:8px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 20px rgba(0,0,0,.10);
  transition:box-shadow .2s ease}
.chrono:hover{box-shadow:0 6px 26px rgba(0,0,0,.18)}
/* 옅어지는 것은 **내용**이지 판이 아니다. 판까지 투명해지면 뒤의 본문이
   비쳐 들어와 글자가 서로를 밟는다. */
.chrono-track{opacity:.5;transition:opacity .2s ease}
.chrono:hover .chrono-track{opacity:1}

/* 띠가 지나가는 창. 손으로도 밀 수 있게 진짜 가로 스크롤을 쓴다 */
.chrono-vp{position:relative;overflow-x:auto;overflow-y:hidden;
  height:var(--chH,92px);border-radius:8px;cursor:grab;
  scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain}
.chrono-vp::-webkit-scrollbar{display:none}
.chrono-vp.drag{cursor:grabbing}
/* 안쪽 띠. 양옆 여백은 창의 절반 — 첫 문서도 마지막 문서도 가운데에 설 수 있게 */
.chrono-track{position:relative;height:100%;margin:0 var(--chPad,0px)}
/* 시간 축 — 층의 한가운데 */
.chrono-track::before{content:"";position:absolute;
  left:calc(0px - var(--chPad,0px));right:calc(0px - var(--chPad,0px));
  top:var(--axis,46px);height:1px;background:var(--edge)}

/* 연도 — 해가 바뀌는 자리에 선을 긋고, 그 선부터가 그 해다.
   이름표는 창 왼쪽에 들러붙는다. 1945년 한복판을 보고 있어도 「1945」가 남는다. */
.cy{position:absolute;top:0;bottom:0;
  border-left:1px solid color-mix(in srgb,var(--ink-3) 50%,transparent)}
.cy.alt{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.cy b{position:absolute;bottom:3px;font-family:var(--mono);font-size:11px;
  font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;
  line-height:1;letter-spacing:.06em;white-space:nowrap;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px}
/* 달·분기 눈금 — 해 안에서 어디쯤인지. 분기는 조금 길게 */
/* 1px 짜리 표는 좌표에 걸터앉혀야 한다. 왼쪽 모서리를 좌표에 맞추면 표가
   반 픽셀 오른쪽에 서서, 같은 날짜의 점과 어긋나 보인다. 아래 실·표도 같다. */
.cq{position:absolute;top:calc(var(--axis,46px) - 1.5px);width:1px;height:4px;
  margin-left:-.5px;background:var(--edge);opacity:.7}
.cq.q{top:calc(var(--axis,46px) - 2.5px);height:6px;opacity:1}
.cq[hidden]{display:none}

/* 배율 — 5년 반을 한눈에 볼 때와 8월 열흘을 벌려 볼 때가 같을 수 없다 */
.chrono-zoom{position:absolute;right:6px;top:5px;z-index:3;display:flex;gap:3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-zoom,.chrono-zoom:focus-within{opacity:1}
.chrono-zoom button{width:19px;height:19px;padding:0;line-height:1;
  font-family:var(--mono);font-size:12px;color:var(--ink-2);cursor:pointer;
  background:var(--panel);border:1px solid var(--edge);border-radius:3px}
.chrono-zoom button:hover:not(:disabled){color:var(--link);border-color:var(--link)}
.chrono-zoom button:disabled{opacity:.35;cursor:default}
.chrono-scale{position:absolute;right:6px;bottom:3px;z-index:3;
  font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.03em;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-scale{opacity:1}

/* 사건 점 — 이름에서 내려오는 실보다 위다. 실이 점 위를 지나가면
   점이 실에 꿰뚫린 것처럼 보이고, 어느 것이 사건 자리인지 흐려진다. */
.cm{position:absolute;top:calc(var(--axis,46px) - 3px);width:7px;height:7px;
  margin-left:-3.5px;border-radius:50%;background:var(--ink-3);z-index:2;
  border:1.5px solid var(--panel);cursor:help;
  transition:background .15s ease,transform .15s ease}
.cm.key{background:var(--stamp);width:9px;height:9px;margin-left:-4.5px;
  top:calc(var(--axis,46px) - 4px)}
.cm:hover{background:var(--link);transform:scale(1.45)}

/* 사건 이름 — 층(lane)을 나눠 위아래로 흩는다. 여기서 겹침이 풀린다 */
.cl{position:absolute;transform:translateX(-50%);white-space:nowrap;z-index:1;
  font-family:var(--mono);font-size:10px;line-height:1.1;color:var(--ink-2);
  letter-spacing:.01em;padding:1px 4px;border-radius:2px;cursor:help;
  background:color-mix(in srgb,var(--panel) 70%,transparent)}
.cl.key{color:var(--stamp)}
.cl:hover,.cl:focus-visible{color:var(--link);outline:0;
  background:color-mix(in srgb,var(--link) 12%,var(--panel))}
/* 이름에서 축까지 내려/올려 긋는 실 — 어느 점의 이름인지 알아보게 */
.cl::after{content:"";position:absolute;left:calc(50% - .5px);width:1px;
  background:var(--edge)}
.cl.up::after{top:100%;height:var(--leg,0px)}
.cl.dn::after{bottom:100%;height:var(--leg,0px)}

/* 지금 읽는 문서가 놓인 자리. 문서를 고르면 이 표가 창 한가운데로 온다.
   손으로 띠를 밀면 표는 제 날짜에 남는다 — 표는 시간에 박혀 있지 창에 박혀 있지 않다. */
.chrono-cursor{position:absolute;top:0;bottom:0;width:1px;z-index:3;
  margin-left:-.5px;background:var(--stamp);pointer-events:none}
/* 가상 요소는 위의 *{box-sizing:border-box}가 닿지 않는다 — 여기서 직접 잡아 주지
   않으면 테두리 2px 만큼 표시가 축 아래·오른쪽으로 밀려 앉는다. */
.chrono-cursor::before{content:"";position:absolute;box-sizing:border-box;
  left:-6px;top:calc(var(--axis,46px) - 6px);width:13px;height:13px;
  border-radius:50%;background:var(--stamp);border:2px solid var(--panel)}
/* 날짜는 맨 아래, 표 바로 밑에 — 위쪽은 사건 이름 층에 내준다 */
.chrono-date{position:absolute;bottom:2px;transform:translateX(-50%);
  font-family:var(--mono);font-size:10px;color:var(--stamp);
  font-variant-numeric:tabular-nums;background:var(--panel);
  padding:0 5px;border-radius:2px;white-space:nowrap;z-index:3}
.chrono[data-nodate="1"] .chrono-cursor,
.chrono[data-nodate="1"] .chrono-date{display:none}

/* 좁은 화면에서도 연대 바는 남긴다 — 이 화면의 절반은 「언제인가」이다.
   폭을 화면 끝까지 늘리고, 손가락으로 미는 것이 이미 되므로 줌 단추는 접는다. */
@media(max-width:900px){
  .chrono{bottom:8px;width:calc(100vw - 16px);border-radius:6px}
  .chrono-zoom{display:none}
  .chrono-track{opacity:1}
}
@media(prefers-reduced-motion:reduce){.chrono-track{transition:none}}

/* 아래쪽 여백은 떠 있는 연대 바가 마지막 문단을 덮지 않을 만큼 */
article{max-width:none;padding:26px 26px 190px}
@media(max-width:900px){article{padding:18px 16px 170px}}

/* ── 앞뒤로 넘기기 ─────────────────────────────
   목록을 다시 열지 않고도 이어 읽을 수 있어야 한다. */
.steps{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;
  margin-top:34px;padding-top:18px;border-top:1px solid var(--edge)}
.step{display:flex;flex-direction:column;gap:2px;text-align:left;
  border:1px solid var(--edge);border-radius:5px;background:transparent;
  padding:9px 12px;cursor:pointer;font:inherit;color:var(--ink-2);min-width:0}
.step.next{text-align:right;align-items:flex-end}
.step:hover{border-color:var(--link);color:var(--ink);background:var(--term-bg)}
.step-k{font-family:var(--mono);font-size:11px;color:var(--link);letter-spacing:.04em}
.step-d{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.step-t{font-size:13px;line-height:1.4;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.step.empty{display:flex;align-items:center;justify-content:center;border-style:dashed;
  color:var(--ink-3);font-size:12px;font-family:var(--mono);cursor:default}
.steps .step-n{align-self:center;font-family:var(--mono);font-size:11.5px;
  color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}

@media(max-width:900px){
  .steps{grid-template-columns:1fr;gap:8px}
  .steps .step-n{order:-1;text-align:center}
  .step.next{text-align:left;align-items:flex-start}
}
.doc-head{border-bottom:1px solid var(--edge);padding-bottom:14px;margin-bottom:18px}
h1{font-size:19px;margin:0 0 4px;line-height:1.35;text-wrap:balance;font-weight:650}
.docid{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  letter-spacing:.04em;font-variant-numeric:tabular-nums}
.stamp{display:inline-block;border:1.5px solid var(--stamp);color:var(--stamp);
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:1px 6px;
  border-radius:2px;transform:rotate(-1.2deg);margin-left:8px;vertical-align:2px}
.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:3px 20px;margin-top:10px;font-size:12.5px}
.meta div{display:flex;gap:7px}
/* 참석자 명단처럼 긴 값. 좁은 칸에 넣으면 한 글자씩 세로로 눌린다 */
.meta div.wide{grid-column:1/-1}
.meta b{color:var(--ink-3);font-weight:500;min-width:52px;font-size:11.5px}
.meta span{font-family:var(--mono);font-size:12px}
.meta span.txt{font-family:var(--sans);font-size:12.5px}

.points{margin:16px 0;padding:12px 16px;border-left:2px solid var(--edge);
  background:var(--panel);border-radius:0 3px 3px 0}
.points li{margin:3px 0}
.points ul{margin:0;padding-left:18px}

.cols{display:grid;gap:26px}
.cols.two{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.cols.two{grid-template-columns:1fr}}
.pane h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 8px;font-weight:600}
.body{white-space:pre-wrap;word-break:break-word}

<script id="data" type="application/json">[{"id": "d359", "order": 359, "date": "1941-10-02", "group": "A", "eyebrow": "d359 · Memorandum of a Conversation", "title": "회담 비망록", "badge": null, "list_right": "문서 359", "meta": [{"k": "일자", "v": "1941-10-02"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/24061/11", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 359 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d359"}], "summary": "헐이 노무라를 자기 아파트로 불러 일본 측 제안에 대한 미국 정부의 견해를 담은 극비 성명을 건네고, 정상회담에 앞서 본질적 논점에서 의견의 일치를 보아야 한다고 말한 회담.", "points": ["국무장관의 요청으로 대사가 국무장관의 아파트를 방문했고, 국무장관은 일본 정부의 제안에 대한 미국 정부의 견해를 담은 극비 성명을 건넸다.", "대사는 본국 정부가 회담 개최를 매우 간절히 바라고 있어 실망할 것이 두렵다고 하면서, 일본 정부가 이 일에 전적으로 진실하며 다른 속셈이 없다고 확신한다고 말했다.", "대사는 다만 일본 국내 정세의 곤란에 비추어 본국 정부가 지금 이 이상 나아갈 수 있으리라 생각하지 않는다고 덧붙였다.", "국무장관은 미국에도 어려움이 있어 비판자들의 반론에 답해야 하며, 지난 경위에 비추어 하루아침에 그들의 의구심을 없앨 수는 없다고 했다. 그래서 「그 자체로 말해 주는 합의」가 필요하다는 것이다.", "대사는 일본을 패퇴시킨다는 언급이 들어 있는 미국 각료의 연설 보도를 문제 삼았고, 국무장관은 회담 내내 마쓰오카가 회담의 정신과 어긋나는 공개 발언을 해 왔다는 사실을 상기시켰다.", "국무장관은 간접적인 경로가 아니라 직접 나아가야 하며, 「임시변통의 미봉책(patchwork arrangement)」으로는 태평양 지역의 평화 수립이라는 상황에 대처할 수 없다고 말했다.", "대사가 앞의 요점을 알아듣지 못한 듯하자 밸런타인 씨가 국무장관의 말을 일본어로 되풀이했다.", "대사는 합의에 이르기 어려우리라 예상되는 유일한 점은 중국에서의 일본군 주둔 문제라고 하고, 무차별 대우 문제에서는 일본 정부가 미국 측 요구에 응하리라 보았다.", "대사는 지역 경제 블록에 관한 오늘날 일본의 사고는 오타와에서 도입된 제국 특혜 같은 다른 나라들의 조치가 낳은 결과라고 했고, 국무장관은 자신이 그런 조치와 싸워 왔으며 일본이 미국과 함께 자유주의적 경제 정책을 위해 싸우기를 바란다고 답했다.", "대사는 끝으로 고노에 내각이 비교적 강한 위치에 있으며 반동 세력이 집권할 가능성은 예상하지 않는다고 하고, 고노에 내각이 미국과의 합의를 지극히 바라고 있다는 확신을 되풀이했다."], "primary": "[워싱턴,] 1941년 10월 2일.\n\n국무장관의 요청에 따라 대사가 국무장관의 아파트를 방문했다. 국무장관은 대사에게 일본 정부의 제안에 관한 이 정부의 견해를 담은 [655면] 극비 성명[주27]을 건넸다.\n\n대사가 그 성명을 읽고 난 뒤 국무장관은 일본대사에게 소견을 말하도록 청했다. 대사는 본국 정부가 그 회담을 갖기를 매우 간절히 바라고 있는 까닭에 실망하지 않을까 두렵다고 말했다. 그는 국무장관에게, 일본 정부가 이 문제에서 전적으로 진실하며 어떠한 다른 속셈도 갖고 있지 않다고 자신이 확신한다는 점을 분명히 말해 두고 싶다고 했다. 그러나 그는 일본 국내 정세의 곤란에 비추어 본국 정부가 지금 이 이상 더 나아갈 수 있으리라고는 생각하지 않는다고 덧붙였다. 국무장관은 총리를 비롯한 일본 정부 인사들의 진실성을 충분히 확신한다고 답했다. 그는 이 정부로 말하자면 우리에게도 우리대로의 곤란이 있으며, 우리는 비판자들의 반론에 답하지 않으면 안 되고, 지난날의 경위에 비추어 하루아침에 그들의 의구심을 없앨 수는 없다고 말했다. 이러한 까닭에, 국무장관이 여러 번 말했듯이, 우리는 그 자체로 말해 주는 합의 — 겉으로 보아 두 정부가 한결같이 평화의 길을 추구하려는 목적을 분명히 드러내 보이는 합의 — 를 가질 필요가 있다고 느낀다는 것이었다. 대사는 어제 자신이 본 신문 보도, 즉 일본을 패퇴시키는 일에 관한 언급이 들어 있는 미국 각료의 연설 보도를 거론했다. 그의 논평이 함축한 바는, 각료의 말은 행정부의 견해를 대변하는 것으로 여겨질 터이므로 그러한 발언은 일본에서 나쁜 영향을 미치리라는 것이었다. 그는 일본에서도 어떤 사람들이 유감스러운 발언을 했을지 모르나 그러한 사람들이 각료였다고는 생각하지 않으며, 일본 각료가 하는 말이라면 무엇이든 일본 정부의 견해를 대변하는 것으로 받아들여질 것이라고 말했다.\n\n국무장관은, 대사와 자신이 우리가 제안한 양해에 관하여 회담을 하고 있는 내내 마쓰오카(松岡洋右, Matsuoka) 씨가 그 회담의 정신에 어긋나는 성격의 공개 발언을 하고 있었다는 사실을 언급했다. 그는 대사가 그러한 발언들에도 불구하고 회담을 계속해 왔음을 지적했다.\n\n국무장관은 이어서, 우리 두 정부가 추구하고 있는 목적을 달성하는 데 우리가 간접적인 경로를 통해 나아갈 수는 없다고 느껴 왔으며, 직접 나아가야 하고, 어떠한 임시변통의 미봉책도 태평양 지역에 평화를 수립한다는 상황에 대처하지 못하리라고 말했다. 국무장관이 제안된 회담을 갖기에 앞서 본질적인 점들에 관하여 의견의 일치에 이르도록 힘써야 한다고 느낀 것은 그 때문이었다. 그는 우리에게 조금이라도 지연을 일으키려는 뜻은 전혀 없다고 힘주어 말했다. 국무장관은 또한, 우리가 비밀로 하는 것과 공개하는 것의 효과를 둘 다 시험해 보았으며 [656면] 비공식적이고 탐색적인 회담이 진행되고 있음을 알린 결과로 두 정부 사이에 제안된 양해에 대한 여론의 반응을 이미 가늠할 수 있게 되었다고 지적했다. 따라서 이제 우리에게 중요한 일은, 우리가 열게 될지 모를 어떠한 회담이든 그 성공을 확실히 하기 위하여 본질적인 점들에 관하여 의견의 일치에 이르도록 힘쓰는 것이었다.\n\n대사가 자신에게 제시된 앞의 요점을 알아듣지 못한 듯 보였으므로, 밸런타인 씨가 국무장관이 말한 바를 일본어로 되풀이했다.\n\n대사는, 두 정부가 합의에 이르는 데 곤란이 있으리라고 자신이 예상하는 유일한 점은 중국에서의 일본군 주둔 문제에 관한 것이라고 느낀다고 말했다. 그는 무차별 대우 문제에 관하여는 일본 정부가 우리 요구에 응하리라고 생각했다. 국무장관은, 자기 의견으로는 이 원칙의 일반적·보편적 적용으로부터 일본보다 더 많은 것을 얻을 나라는 없다고 힘주어 말했다. 국무장관은 이어서, 경제 문제에 관하여 채택된 결의를 담은 리마 회의 보고서를 대사에게 주고 싶다고 하면서, 일본 정부도 극동에서 그와 비슷한 정책을 채택하는 데 관심이 있을지 모른다고 말했다. 대사는, 지역 경제 블록에 관한 오늘날 일본의 사고는 여러 사정의 결과, 다시 말해 오타와에서 도입된 제국 특혜와 같은 다른 나라들이 취한 조치의 결과라고 말했다. 국무장관은 자신이 오타와에서 취해진 것과 같은 조치들과 싸워 왔으며, 일본이 자유주의적 경제 정책을 위한 싸움에 미국과 함께 나서 주기를 바란다고 답했다.\n\n끝으로 대사는, 고노에(近衞文麿, Konoye) 내각이 비교적 강한 위치에 있다고 생각하며 반동적인 집단이 정권을 잡을 가능성이 있으리라고는 예상하지 않는다고 논평했다. 그는 고노에 내각이 미국과 합의에 이르기를 지극히 바라고 있다는 자신의 확신을 되풀이했다.\n\n[Joseph W.] Ballantine", "secondary": "[Washington,] October 2, 1941.\n\nThe Ambassador called at the Secretary’s apartment at the request of the Secretary. The Secretary handed the Ambassador a strictly confidential [655면] statement [주27] containing the views of this Government with respect to the Japanese Government’s proposals.\n\nAfter the Ambassador had read the statement the Secretary invited the Japanese Ambassador to comment. The Ambassador said that he feared that his Government would be disappointed because of its very earnest desire to hold the meeting. He said he wished to assure the Secretary that he was convinced that the Japanese Government was entirely sincere in this matter and had no ulterior purpose. He added, however, that in view of the difficulties of the internal situation in Japan he did not think his Government could go further at this time. The Secretary replied that he was fully convinced of the sincerity of the Prime Minister and others in the Japanese Government. He said that so far as this Government was concerned we had our difficulties, too; that we had to meet the objections of critics; and that in view of past developments it was not possible in one day to remove their misgivings. For this reason, as the Secretary had often remarked, we felt it necessary to have an agreement that would speak for itself: one that would on the face of it make manifest the purposes of both Governments consistently to pursue courses of peace. The Ambassador referred to a press report that he had seen yesterday of a speech by a member of the American Cabinet in which there was a reference to bringing about the defeat of Japan. His comment implied that such statements would have a bad effect in Japan as it would be assumed that what a member of the Cabinet said represented the views of the administration. He said that certain persons in Japan might have made unfortunate statements, but he did not think that such persons were members of the Cabinet and that anything a member of the Japanese Cabinet might say would be taken as representing the views of the Japanese Government.\n\nThe Secretary referred to the fact that all the time the Ambassador and he were holding conversations in regard to our proposed understanding Mr. Matsuoka was making public statements of a character inconsistent with the spirit of those conversations. He noted that the Ambassador had continued their conversations despite those statements.\n\nThe Secretary went on to say that we had felt that we could not proceed through indirect courses to attain the objects which our two Governments are seeking, that we must proceed directly, and that no patchwork arrangement would meet the situation of establishing peace in the Pacific area. It was for that reason the Secretary felt that we should endeavor to reach a meeting of minds on essential points before holding the proposed meeting. We had no desire whatever, he emphasized, to cause any delay. The Secretary further pointed out that we had tried the effects of both secrecy and of publicity [656면] and that we already were able to gauge public reaction to the proposed understanding between the two Governments as a result of our letting it be known that informal and exploratory conversations were proceeding. Thus the important thing for us now was to endeavor to reach a meeting of minds on essentials in order to insure the success of any meeting that we might hold.\n\nAs the Ambassador did not appear to understand the foregoing point made to him, Mr. Ballantine repeated in Japanese what the Secretary had said.\n\nThe Ambassador said that he felt that the only point on which he anticipated difficulty in the two Governments reaching an agreement was in regard to the question of retention of Japanese troops in China. He thought that, with regard to the question of non-discrimination, the Japanese Government would meet us. The Secretary emphasized that in his opinion no country would stand to gain more than Japan from the general universal application of this principle. The Secretary added that he would like to give the Ambassador a report of the Lima Conference containing the resolutions adopted in regard to economic matters and he suggested that the Japanese Government might be interested in adopting similar policies in the Far East. The Ambassador said that Japanese present-day thought with respect to regional economic blocs was the result of circumstances, that is to say, of measures taken by other countries such as the Empire preferences introduced at Ottawa. The Secretary replied that he had been fighting such measures as those taken at Ottawa and he would like to have Japan join with the United States in fighting for liberal economic policies.\n\nIn conclusion, the Ambassador commented that he thought that the Konoye Cabinet was in a comparatively strong position and that he did not anticipate that there was a likelihood of reactionary groups coining into power. He repeated his conviction that the Konoye Cabinet was extremely desirous of reaching an agreement with the United States.\n\n[Joseph W.] Ballantine", "notes": ["[주27] 바로 아래 문서."], "warn": false, "pages": ["0721", "0722"], "search": "노무라(野村吉三郎, Nomura) — 주미 일본대사. 원문에는 「대사」로만 적혀 있다 헐(Cordell Hull) — 국무장관. 원문에는 「the Secretary 국무장관」으로만 적혀 있다 밸런타인(Joseph W. Ballantine) — 비망록 작성자 마쓰오카(松岡洋右, Matsuoka) — 전임 외상 고노에(近衞文麿, Konoye) — 일본 총리"}, {"id": "d360", "order": 360, "date": "1941-10-02", "group": "B", "eyebrow": "d360 · Oral Statement Handed by the Secretary of State to the Japanese Ambassador (Nomura) on October 2, 1941", "title": "1941년 10월 2일 국무장관이 일본대사(노무라)에게 건넨 구두 성명", "badge": null, "list_right": "문서 360", "meta": [{"k": "일자", "v": "1941-10-02"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/24061/11", "txt": true}, {"k": "발신", "v": "국무장관(the Secretary of State) — 헐(Cordell Hull)", "txt": true}, {"k": "수신", "v": "일본대사 노무라(野村吉三郎, Nomura)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "구두 성명"}], "links": [{"k": "FRUS", "text": "문서 360 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d360"}], "summary": "9월 6일 일본 측 제안이 그동안의 회담이 딛고 선 원칙의 적용과 일본 스스로 준 보장을 오히려 좁히고 제한하는 것으로 보인다며, 그런 상황에서 정상회담이 과연 목적에 이바지하겠느냐고 되묻는 미국 정부의 성명.", "points": ["1941년 9월 6일 일본대사가 국무장관에게 전한 일본 정부의 제안과 그 뒤의 관련 성명들에 대한 미국 정부의 소견이다.", "8월 초 일본 측이 제안한 양국 책임 수뇌의 회담과 비공식 회담 재개를, 미국은 평화 계획의 폭넓은 목적과 원칙을 진전시킬 기회로 보고 환영했다고 밝힌다.", "8월 17일 대통령의 회답은 그러한 계획이 태평양 전역에 통상상의 기회와 대우의 균등 원칙을 적용하는 것을 포함하리라고 했다.", "8월 28일 총리의 메시지와 일본 정부 성명은 도발 없이는 어떤 이웃 나라에도 무력을 쓸 뜻이 없다는 포괄적 보장을 담았고, 일본은 대통령이 개괄한 계획과 원칙을 태평양뿐 아니라 전 세계에 적용될 것으로서 지지한다고 선언했다.", "9월 3일 대통령은 미국이 나라 사이 관계의 기초로 여기는 네 가지 원칙(영토 보전과 주권 존중, 내정 불간섭, 통상 기회 균등을 포함한 평등, 평화적 수단에 의하지 않은 태평양 현상 변경의 금지)을 되풀이했다.", "9월 6일 도쿄에서 고노에 총리는 미국대사에게 이 네 원칙에 전적으로 찬동한다고 말했다.", "그럼에도 9월 6일 제출된 일본 측 제안은 두 정부의 관념에 차이가 있음을 드러낸 것으로 보여 미국 정부에 실망의 원인이 되었다고 한다. 원칙의 적용과 일본이 준 보장을 모두 좁히고 제한한다는 것이다.", "일본이 평화적 의도의 보장에 붙인 단서들(프랑스령 인도차이나 인접지, 타이, 소련에 관한 것)은 그 필요가 쉽게 이해되지 않으며, 무엇을 염두에 두고 불필요해 보이는 단서를 다는지 의문이 생길 수 있다고 지적한다.", "비공식 회담에서 잠정 합의된 경제 정책 방식(양해 초안 제5항)은 태평양 지역에서의 무차별 원칙을 규정했으나, 9월 6일 제안은 그 약속을 남서태평양 지역으로 한정했고, 중국에 관하여는 지리적 근접을 이유로 한 제한을 염두에 두고 있다는 함의가 엿보인다고 한다.", "중국 일부 지역에 무기한 주둔하겠다는 데 대하여, 대군이 점령 중인 나라가 평화적 해결의 조건으로 자국 군대의 계속 주둔을 요구하는 절차는 회담에서 논의된 원칙에 어긋나 보이며 평화나 안정의 전망을 주지 못한다고 본다.", "중국과 프랑스령 인도차이나에서의 철병에 관한 일본의 의도를 분명히 밝히는 것이 (특히 비판적일 수 있는 이들에게) 가장 도움이 되리라고 한다.", "유럽 전쟁에 대한 태도에서 일본이 한 걸음 더 나아간 것을 고맙게 여기나 입장을 더 명확히 하는 문제를 더 연구해 주면 도움이 되겠다고 한다.", "「만일 이 인상이 옳다면, 그러한 사정 아래 책임 있는 수뇌 사이의 회담이 우리가 서로 품어 온 높은 목적을 진전시키는 데 이바지할 법하다고 일본 정부는 느낄 수 있겠는가」라고 되묻는다.", "대통령은 그 회담이 열릴 수 있도록 근본 문제의 논의가 진전되기를 간절히 바라며, 두 정부가 원칙을 실제적·포괄적으로 적용하기로 결의한다면 미일 관계의 근본적 회복을 이루어 낼 수 있다는 확신을 일본 정부도 함께하기를 바란다고 맺는다."], "primary": "[워싱턴,] 1941년 10월 2일.\n\n1941년 9월 6일 일본대사가 국무장관에게 전달한 일본 정부의 제안과, 그 뒤 일본 정부가 이 정부에 전달한 그에 관련된 성명들을 언급한다.\n\n[657면]\n\n언급된 그 통보들에 대하여 신중한 검토를 하였으며, 그 검토와 관련하여 같은 주제에 관하여 앞서 일본 정부로부터 접수한 다른 통보들도 주의 깊게 재검토하였다. 이 검토에 기초하여 다음과 같이 소견을 제시한다.\n\n미국 정부는, 8월 초 일본 정부가 이곳 주재 자국 대사를 통하여 한 제의 — 미일 관계의 조정을 가져올 방도를 논의하기 위하여 일본 정부와 미국 정부의 책임 있는 수뇌 사이의 회담을 열자는 제의, 그리고 태평양 정세 전반을 포괄하는 평화적 해결에 관한 교섭의 기초가 존재하는지 확인하기 위하여 양국 사이에 진행되어 오던 비공식 회담을 재개하자는 제의 — 를 평화 계획의 폭넓은 목적과 원칙을 진전시킬 수 있는 기회를 주는 것으로서 환영하였다.\n\n이에 따라 1941년 8월 17일 대통령이 일본대사에게 한 회답에서는 다음과 같은 견해가 표명되었다. 즉 그러한 비공식 회담은 당연히 평화적 수단으로 달성할 수 있는 점진적 계획을 마련하는 일을 상정할 것이라는 것, 그러한 계획은 태평양 전역에 통상상의 기회와 대우의 균등이라는 원칙을 적용하는 것을 포함하며 그리하여 모든 나라가 원료와 그 밖의 모든 긴요한 물자에 접근할 수 있게 하리라는 것이었고, 아울러 그러한 계획의 채택으로부터 일본을 포함한 모든 나라에 흘러들 이익이 서술되었다. 끝으로, 만일 일본 정부가 미국이 서약하고 있는 계획과 원칙의 노선을 따라 태평양을 위한 평화적 계획에 착수할 수 있는 처지에 있다면, 이 정부는 비공식 탐색적 논의의 재개를 고려할 용의가 있으며 견해를 교환할 알맞은 시기와 장소를 마련하고자 기꺼이 힘쓰겠다고 밝혔다.\n\n이 정부가 견지하는 폭넓은 목적과 근본 원칙에 비추어, 1941년 8월 28일 총리의 메시지와 일본 정부의 성명 — 미국 국민과 정부가 서약하고 있는 근본 원칙과 조화를 이루는 평화의 길을 걷겠다는 일본의 희망과 의도를 표명한 진술이 담긴 것 — 을 접수한 것은 대통령과 미국 정부에 흡족한 일이었다. 그 성명에서 일본 정부는 얼마간의 단서를 붙이기는 하였으나 자국의 평화적 의도에 관하여 폭넓은 보장을 하였으며, 여기에는 일본 정부가 도발 없이 어떠한 이웃 나라에 대해서도 무력을 사용할 의도가 없다는 포괄적인 보장이 포함되어 있었다. 일본 정부는 [658면] 대통령이 간략히 개괄한 계획과 원칙을 태평양 지역에 적용될 것으로서만이 아니라 전 세계를 위한 계획으로서 지지한다고 선언하였다.\n\n미국 정부는 국가 수뇌 사이의 회담을 위한 준비의 검토를 될 수 있는 대로 신속히 진행하기를 바라면서도, 그 회담이 목표로 삼은 목적을 달성하도록 확실히 하기 위하여 어떤 원칙들의 해석과 그 원칙들이 태평양 지역의 구체적 문제에 실제로 적용되는 방식을 분명히 하는 것이 바람직하다고 느꼈다. 이 정부의 목적은 세부 사항의 논의에 들어가려는 데 있지 않았다. 그러나 이 정부는 그와 같은 해명이 의견의 일치에 이르려는 우리의 노력을 앞당길 방도가 되리라고 느껴 왔다.\n\n1941년 9월 3일 대통령은 일본대사에게 회답하면서, 일본 정부가 언급한 원칙들을 실제에서 실효 있게 하려는 노력에 협력하고자 하는 미국 정부의 간절한 희망을 표명하였다. 대통령은 나라와 나라 사이의 관계가 마땅히 딛고 서야 할 기초라고 이 정부가 여기는 네 가지 원칙을 되풀이하였다. 그 원칙들은 다음과 같다.\n\n1.\n\n각국과 모든 나라의 영토 보전 및 주권의 존중.\n\n2.\n\n타국의 내정에 간섭하지 않는다는 원칙의 지지.\n\n3.\n\n통상상의 기회 균등을 포함한 평등 원칙의 지지.\n\n4.\n\n태평양에서의 현상(現狀)이 평화적 수단으로 변경되는 경우를 제외한 현상의 불교란.\n\n대통령은, 태평양 문제의 만족스러운 해결을 어떻게든 가져오기 위해서는 우리 두 정부 사이에 비공식 회담에서 근본적인 의견의 차이가 생겨난 어떤 점들에 관하여 견해의 일치와 명확한 합의에 이르는 것이 매우 중요하다고 지적하였다. 그리고 대통령은 그러한 근본 문제들에 관한 일본 정부의 현재 태도를 밝혀 줄 것을 요청하였다.\n\n9월 6일 일본 총리는 도쿄 주재 미국대사와의 회담에서 위에 든 네 가지 원칙에 전적으로 찬동한다고 말하였다.\n\n앞서 든 경위와 보장들은, 일본 정부가 한 다른 진술들과 아울러, 일본 정부가 태평양 전역을 포괄하는 폭넓고 점진적인 계획을 지키고 그것을 실제로 적용하리라고 기대할 수 있다는 결론을 이 정부가 내리는 것을 정당화하는 듯하였다. 그러므로 [659면] 1941년 9월 6일 일본대사가 제출한 일본 정부의 제안 — 일본 정부가 논의의 구체적 기초를 이루게 하려 의도한 것이 분명한 제안 — 이 두 정부의 관념에 차이가 있음을 드러내는 듯이 보인 것은 미국 정부에 실망의 원인이 되었다. 다시 말해, 이 정부의 의견으로는 그 제안과 그에 관하여 뒤이어 이루어진 해명적 진술들은 앞서 언급한 우리 비공식 회담이 딛고 서 있던 원칙들의 적용을 좁히고 제한할 뿐 아니라, 태평양 전역에 평화와 안정을 확립하고 유지하려는 폭넓은 계획을 실행에 옮기는 데 미국과 함께 나아가고자 한다며 일본 정부가 한 여러 보장까지도 좁히고 제한하는 구실을 한다.\n\n이미 말한 바와 같이 일본 총리와 일본 정부가 한 여러 폭넓은 보장은 매우 흡족한 것이다. 다른 나라들에 대한 평화적 의도라는 자국의 태도를 내놓으면서, 일본 정부는 그 보장에 어떤 문구들로 단서를 달았는데 그 필요성은 쉽게 이해되지 않는다. 현재의 사정 아래 프랑스령 인도차이나에 인접한 어느 영역에서든, 또는 타이나 소련에서 일본에 대한 어떠한 침략적 위협이나 도발이 생겨나리라고는 생각하기 어렵다. 자위(自衛)의 불가양(不可讓)의 권리는 물론 모든 나라가 잘 인정하는 바이며, 일본 정부가 평화적 의도의 보장에 불필요해 보이는 단서 문구를 둘러 놓으면서 무엇을 염두에 두고 있는가 하는 의문이 어떤 이들의 마음에는 생겨날 수 있을 것이다.\n\n비공식 회담에서는 경제 정책에 관한 방식(양해 초안 제5항)이 잠정적으로 마련되었는데, 그것은 태평양 지역에서 일본의 활동과 미국의 활동이 평화적 수단으로, 그리고 국제 통상 관계에서의 무차별 원칙에 부합하게 수행되어야 한다고 규정한 것이었다. 9월 6일 일본 정부의 제안과 그 뒤 일본 정부로부터 온 통보들에서는 그 방식에 담긴 약속이 남서태평양 지역의 나라들로 한정되었다(태평양 지역 전체가 아니다). 중국에 관하여 일본 정부는 무차별 원칙을 존중하겠다고 진술하나, 이 점에 관하여 주어진 설명은 일본이 중국과 지리적으로 가깝다는 이유에서 생기는 이 원칙 적용에 대한 어떤 제한을 일본 정부가 염두에 두고 있다는 함의에 열려 있는 듯하다.\n\n미국이나 일본 가운데 어느 쪽이든 어떤 지역에서는 하나의 길이나 정책을 추구하면서 동시에 다른 지역에서는 그와 반대되는 길이나 정책을 추구한다면, 그것이 일본 정부나 이 정부가 [660면] 확언한 목적에 이바지하지 못하리라는 것은 명백하다.\n\n이 정부는 중국의 어떤 지역에 무기한으로 군대를 주둔시키고자 하는 일본 정부의 희망을 뒷받침하는 견해에 유의하였다. 그러한 제안의 이유가 무엇이냐 하는 문제와는 전혀 별개로, 일본이 중국의 넓은 지역을 군사적으로 점령하고 있는 때에 일본과 중국 사이의 평화적 해결의 조건 안에 그러한 규정을 넣는 것은 어떤 이의(異議)에 열려 있다. 예컨대 어떤 나라가 다른 나라의 영토를 군사적으로 점령하고 있으면서 그 두 번째 나라에 대하여, 평화적 해결의 조건으로서, 그리하여 다른 지역에서 점령군을 철수하는 조건으로서, 첫 번째 나라의 군대를 어떤 지역에 계속 주둔시킬 것을 제의한다면, 그러한 절차는 비공식 회담에서 논의된 진보적이고 계몽된 길 및 원칙과 어울리지 않는 듯이 보이며, 따라서 이 정부의 의견으로는 평화에 이바지하지도 못하고 안정의 전망을 주지도 못할 것이다.\n\n중국과 프랑스령 인도차이나로부터의 일본군 철수에 관한 일본의 의도를 뚜렷하게 드러내 보이는 것이야말로, 일본의 평화적 의도와 태평양 지역의 장래 안정 및 진보를 위한 건전한 기초를 세우기에 알맞은 길을 따르고자 하는 일본의 희망을 — 특히 비판적인 쪽으로 기울지 모를 이들에게 — 알리는 데 가장 도움이 되리라고 믿는다.\n\n유럽 전쟁에 대한 각국의 태도에 관하여, 이 정부는 양국 관계의 이 국면에 본래 따르는 곤란에 대처하고자 일본 정부가 한 걸음 더 나아간 것에 감사의 뜻으로 유의하였다. 일본 정부가 자국 입장을 한층 더 명확히 할 수 있는 가능성의 문제를 더 연구해 줄 수 있다면 도움이 되리라고 믿는다.\n\n제안된 책임 있는 정부 수뇌 회담의 터를 닦기 위하여 근본 문제들에 관하여 원칙적 합의에 이르려는 노력으로 두 정부 사이에 이루어진 견해 교환에서, 이 정부는 자신이 상정하는 바가 자유주의적이고 진보적인 원칙을 태평양 전역에 한결같이 적용할 것을 요구하는 포괄적 계획이라는 점을 분명히 하고자 힘써 왔다. 일본 정부가 자국의 목적에 관하여 지금까지 밝힌 바로부터 이 정부가 받는 인상은, 일본 정부가 그러한 원칙들의 실제 적용에 단서와 예외를 붙임으로써 테두리가 좁혀진 계획을 염두에 두고 있다는 것이다.\n\n[661면]\n\n만일 이 인상이 옳다면, 그러한 사정 아래 책임 있는 정부 수뇌 사이의 회담이 우리가 서로 마음에 품어 온 높은 목적을 진전시키는 데 이바지할 법하다고 일본 정부는 느낄 수 있겠는가?\n\n이미 말한 바와 같이, 이 정부는 일본 총리가 미국 대통령에게 보낸 메시지에 딸린 일본 정부의 성명에 담긴 보장 — 안정된 국제관계의 유일하게 건전한 기초로서 이 정부가 오랫동안 주창해 온 원칙들에 일본 정부가 찬동한다는 보장 — 을 환영하였다. 이 정부는, 이 근본 원칙들을 다시금 검토하는 것이 우리가 합의를 구하는 긴요한 문제들에 관하여 의견의 일치를 찾으려는 우리의 노력에 도움이 될 수 있고, 그리하여 두 정부의 책임 있는 수뇌 사이의 회담을 위한 굳건한 기초를 놓게 되리라고 믿는다. 총리가 제안한 회담이라는 주제와 거기서 추구되는 목적들은 미국 대통령의 깊고 적극적인 관심을 끌어 왔으며 지금도 끌고 있다. 그리고 근본 문제들의 논의가 그러한 회담을 열 수 있도록 진전되기를 대통령은 간절히 바라고 있다. 또한 대통령은, 만일 일본 정부와 미국 정부가 그 원칙들에 실제적이고 포괄적인 적용을 부여하기로 결의한다면 두 정부는 미일 관계의 근본적인 회복을 이루어 낼 수 있고 태평양 전역에 정의와 형평과 질서를 갖춘 항구적 평화를 가져오는 데 이바지할 수 있다는 이 정부의 확신을 일본 정부도 함께하기를 바라고 있다.", "secondary": "[Washington,] October 2, 1941.\n\nReference is made to the proposals of the Japanese Government communicated on September 6, 1941, by the Japanese Ambassador to the Secretary of State, and to statements relating thereto subsequently communicated to this Government by the Japanese Government.\n\n[657면]\n\nThoughtful study has been given to the communications to which reference is made, and in connection with that study careful review has been made of other communications previously received from the Japanese Government on the same subject. On the basis of this study observations are offered as follows:\n\nThe Government of the United States welcomed, as affording a possible opportunity for furthering the broad-gauge objectives and principles of a program of peace, the Japanese Government’s suggestions made through its Ambassador here in the early part of August that there be held a meeting of the responsible heads of the Japanese Government and of the Government of the United States to discuss means for bringing about an adjustment of relations between the United States and Japan and that there be resumed the informal conversations which had been in progress between the two countries to ascertain whether there existed a basis for negotiations relative to a peaceful settlement covering the entire Pacific situation.\n\nAccordingly, in the reply made by the President on August 17, 1941, to the Japanese Ambassador the view was expressed that such informal conversations would naturally envisage the working out of a progressive program attainable by peaceful means; that such a program would involve the application in the entire Pacific area of the principle of equality of commercial opportunity and treatment, thus making possible access by all countries to raw materials and to all other essential commodities, and there were described the advantages which would flow to all countries, including Japan, from the adoption of such a program. In conclusion, it was stated that if the Japanese Government were in position to embark upon a peaceful program for the Pacific along the lines of the program and principles to which the United States is committed, this Government would be prepared to consider resumption of the informal exploratory discussions and would be glad to endeavor to arrange a suitable time and place to exchange views.\n\nIn the light of the broad purposes and fundamental principles which this Government holds, it was gratifying to the President and the Government of the United States to receive the message of the Prime Minister and the statement of the Government of Japan on August 28, 1941, containing statements expressing Japan’s desire and intent to pursue courses of peace in harmony with the fundamental principles to which the people and Government of the United States are committed. In its statement the Japanese Government gave, with some qualifications, broad assurances of its peaceful intent, including a comprehensive assurance that the Japanese Government has no intention of using without provocation military force against any neighboring nation. The Japanese Government declared [658면] that it supported the program and principles which had been briefly outlined by the President not only as applicable to the Pacific area but also as a program for the entire world.\n\nThe Government of the United States, while desiring to proceed as rapidly as possible with consideration of arrangements for a meeting between the heads of state, felt it desirable, in order to assure that that meeting would accomplish the objectives in view, to clarify the interpretation of certain principles and the practical application thereof to concrete problems in the Pacific area. It has not been the purpose of this Government to enter into a discussion of details; this Government has felt, however, that the clarification sought would afford a means of expediting our effort to arrive at a meeting of minds.\n\nOn September 3, 1941, the President in giving reply to the Japanese Ambassador expressed the earnest desire of the Government of the United States to collaborate in efforts to make effective in practice the principles to which the Japanese Government made reference. The President reiterated the four principles regarded by this Government as the foundation upon which relations between nations should properly rest. Those principles are:\n\n1.\n\nRespect for the territorial integrity and the sovereignty of each and all nations.\n\n2.\n\nSupport of the principle of non-interference in the internal affairs of other countries.\n\n3.\n\nSupport of the principle of equality, including equality of commercial opportunity.\n\n4.\n\nNon-disturbance of the status quo in the Pacific except as the status quo may be altered by peaceful means.\n\nThe President pointed out that in order to bring about any satisfactory settlement of Pacific questions it was highly important to reach a community of view and a clear agreement upon certain points with respect to which fundamental differences of opinion between our two Governments had developed in the informal conversations; and the President requested an indication of the present attitude of the Japanese Government with regard to those fundamental questions.\n\nOn September 6, the Prime Minister of Japan in a conversation with the American Ambassador at Tokyo stated that he subscribed fully to the four principles above mentioned.\n\nThe foregoing developments and assurances, together with other statements made by the Japanese Government, seemed to justify this Government in concluding that the Japanese Government might be expected to adhere to and to give practical application to a broad progressive program covering the entire Pacific area. It was therefore [659면] a source of disappointment to the Government of the United States that the proposals of the Japanese Government presented by the Japanese Ambassador on September 6, 1941, which the Japanese Government apparently intended should constitute a concrete basis for discussions, appeared to disclose divergence in the concepts of the two Governments. That is to say, those proposals and the subsequent explanatory statements made in regard thereto serve, in the opinion of this Government, to narrow and restrict not only the application of the principles upon which our informal conversations already referred to had been based but also the various assurances given by the Japanese Government of its desire to move along with the United States in putting into operation a broad program looking to the establishment and maintenance of peace and stability in the entire Pacific area.\n\nAs has already been said, the various broad assurances given by the Japanese Premier and the Japanese Government are highly gratifying. In putting forward its attitude of peaceful intent toward other nations, the Japanese Government qualified its assurances with certain phrases the need for which is not easily understood. It is difficult to conceive of there developing under present circumstances in any of the territories neighboring French Indochina, in Thailand or in the Soviet Union any aggressive threat or provocation to Japan. The inalienable right of self-defense is of course well recognized by all nations and there could arise in some minds a question as to just what the Japanese Government has in view in circumscribing its assurances of peaceful intent with what would seem to be unnecessary qualifying phrases.\n\nIn the informal conversations there was tentatively arrived at a formula in regard to economic policy (Section V of the draft understanding), which provided that Japanese activity and American activity in the Pacific area shall be carried on by peaceful means and in conformity with the principle of non-discrimination in international commercial relations. In the Japanese Government’s proposals of September 6 and in subsequent communications from the Japanese Government the commitments contained in that formula were restricted to the countries of the Southwest Pacific area (not the Pacific area as a whole). In reference to China, the Japanese Government states that it will respect the principle of non-discrimination, but the explanation given in regard to this point would seem to be open to the implication that the Japanese Government has in mind some limitation upon the application of this principle occasioned by reasons of Japan’s geographical propinquity to China.\n\nObviously, it would not be likely to serve the purposes affirmed by the Japanese Government or by this Government if either the United [660면] States or Japan were to pursue one course or policy in certain areas while at the same time pursuing an opposite course or policy in other areas.\n\nThis Government has noted the views of the Japanese Government in support of its desire to station troops for an indeterminate period in certain areas of China. Entirely apart from the question of the reasons for such a proposal, the inclusion of such a provision in the proposed terms of a peaceful settlement between Japan and China at a time when Japan is in military occupation of large areas in China is open to certain objections. For example, when a country in military occupation of territory of another country proposes to the second country the continued stationing of troops of the first country in certain areas as a condition for a peaceful settlement and thus for the withdrawal of the occupationary forces from other areas, such procedure would seem to be out of keeping with the progressive and enlightened courses and principles which were discussed in the informal conversations and thus would not, in the opinion of this Government, make for peace or offer prospects of stability.\n\nIt is believed that a clear-cut manifestation of Japan’s intention in regard to the withdrawal of Japanese troops from China and French Indochina would be most helpful in making known—in particular to those who might be inclined to be critical—Japan’s peaceful intentions and Japan’s desire to follow courses calculated to establish a sound basis for future stability and progress in the Pacific area.\n\nWith reference to the attitude of each country toward the European war, this Government has noted with appreciation the further step taken by the Japanese Government to meet the difficulties inherent in this aspect of the relations between the two countries. It is believed that it would be helpful if the Japanese Government could give further study to the question of possible additional clarification of its position.\n\nIn the exchanges of views which have taken place between the two Governments in an effort to reach an agreement in principle upon fundamental questions in order to prepare the ground for the proposed meeting of the responsible chiefs of government, this Government has endeavored to make clear that what it envisages is a comprehensive program calling for the application uniformly to the entire Pacific area of liberal and progressive principles. From what the Japanese Government has so far indicated in regard to its purposes this Government derives the impression that the Japanese Government has in mind a program which would be circumscribed by the imposition of qualifications and exceptions to the actual application of those principles.\n\n[661면]\n\nIf this impression is correct, can the Japanese Government feel that a meeting between the responsible heads of government under such circumstances would be likely to contribute to the advancement of the high purposes which we have mutually had in mind?\n\nAs already stated, this Government welcomed the assurances contained in the statement of the Japanese Government which accompanied the Japanese Prime Minister’s message to the President of the United States that the Japanese Government subscribed to the principles which have long been advocated by this Government as the only sound basis for stable international relations. This Government believes that renewed consideration of these fundamental principles may be helpful in our effort to seek a meeting of minds in regard to the essential questions on which we seek agreement and thus lay a firm foundation for a meeting between the responsible heads of the two Governments. The subject of the meeting proposed by the Prime Minister and the objectives sought have engaged, and continue to engage, the close and active interest of the President of the United States, and it is the President’s earnest hope that discussion of the fundamental questions may be so developed that such a meeting can be held. It is also the President’s hope that the Japanese Government shares the conviction of this Government that, if the Governments of Japan and of the United States are resolved to give those principles practical and comprehensive application, the two Governments can work out a fundamental rehabilitation of the relations between the United States and Japan and contribute to the bringing about of a lasting peace with justice, equity and order in the whole Pacific area.", "notes": [], "warn": false, "pages": ["0723", "0724", "0725", "0726", "0727"], "search": "노무라(野村吉三郎, Nomura) — 주미 일본대사 헐(Cordell Hull) — 국무장관 루스벨트(Franklin D. Roosevelt) — 대통령. 원문에는 「the President 대통령」으로만 적혀 있다 고노에(近衞文麿, Konoye) — 일본 총리. 원문에는 「일본 총리」로만 적혀 있다 그루(Joseph C. Grew) — 주일 미국대사. 원문에는 「도쿄 주재 미국대사」로만 적혀 있다"}, {"id": "d361", "order": 361, "date": "1941-10-03", "group": "A", "eyebrow": "d361 · Memorandum of a Conversation", "title": "회담 비망록", "badge": null, "list_right": "문서 361", "meta": [{"k": "일자", "v": "1941-10-03"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "11.94/24063/11", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 361 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d361"}], "summary": "노무라 대사가 헐 국무장관을 찾아와, 일본 정부가 대미 회답에 관한 공개 성명을 준비 중이라고 알린다.", "points": ["노무라 대사가 자기 요청으로 국무장관을 방문했다.", "노무라는 일본 정부의 제안에 대한 국무장관의 회답을 전날 본국에 전달했다고 말했다.", "일본 정부는 공개용 성명을 준비 중이라고 대사에게 알려 왔다.", "노무라는 발표 전에 성명 사본을 받아 국무장관에게 제시할 수 있기를 바란다고 했다.", "국무장관은 아무 논평도 하지 않았다."], "primary": "[워싱턴,] 1941년 10월 3일.\n\n일본 대사가 자기 요청으로 방문하여, 별도의 비망록에서 다루는 다른 사항들을 국무장관과 논의한 뒤, 일본 정부의 제안에 대한 국무장관의 회답을 어제 자국 정부에 전달했으며 일본 정부는 지금 공개 발표용 성명을 준비하고 있다고 자기에게 알려 왔다고 말했다. 대사는 그 성명이 발표되기 전에 사본을 받아 국무장관에게 제시할 수 있기를 바란다고 말했다.\n\n국무장관은 아무런 논평도 하지 않았다.\n\nJ[oseph] W. B[allantine]\n\n[662면]", "secondary": "[Washington,] October 3, 1941.\n\nThe Japanese Ambassador called at his request and after having taken up with the Secretary other matters which are dealt with in a separate memorandum stated that he had communicated to his Government yesterday the Secretary’s reply to the Japanese Government’s proposals and the Japanese Government had informed the Ambassador that it was now preparing a statement for public release. The Ambassador said that he hoped to receive a copy of the statement in advance of publication so that he could lay it before the Secretary.\n\nThe Secretary made no comment.\n\nJ[oseph] W. B[allantine]\n\n[662면]", "notes": [], "warn": false, "pages": ["0728"], "search": "노무라(野村吉三郎, Nomura) — 주미 일본대사 헐(Cordell Hull) — 국무장관 밸런타인(Joseph W. Ballantine) — 비망록 작성자"}, {"id": "d362", "order": 362, "date": "1941-10-07", "group": "C", "eyebrow": "d362 · Memorandum by the Counselor of Embassy in Japan (Dooman)", "title": "주일대사관 참사관 두먼의 각서", "badge": null, "list_right": "문서 362", "meta": [{"k": "일자", "v": "1941-10-07"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2624", "txt": true}, {"k": "발신", "v": "The Counselor of Embassy in Japan (Dooman) 주일대사관 참사관 두먼(Eugene H. Dooman)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 362 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d362"}], "summary": "고노에 총리의 비서 우시바가 두먼 참사관과 조찬을 하며, 회담이 진전되지 않아 총리의 처지가 어려워졌고 일본 정부 안에서 미국이 덫을 놓았다는 견해가 늘고 있다고 말한다.", "points": ["우시바의 전화 요청으로 두먼의 자택에서 조찬을 함께했다. 식사 중 하인이 있어 기록할 만한 대화는 짧았다.", "우시바는 미국과의 예비 회담이 아무 진전을 보지 못하여 총리의 처지가 어려워졌으며, 고노에는 더 무엇을 할 수 있을지 몰라 어찌할 바를 모르고, 반대파는 이제 내각 공격에 쓸 구체적 재료를 얻었고, 앞날은 어두워 보인다고 말했다.", "우시바는 육군이 중국 사변을 끝내고 싶어 하면서도 그 청산을 시작하는 책임은 결코 지지 않으려 한다고 말했다. 고노에가 그 책임을 지자 육군은 전면적이고 무조건적인 지지를 주었으며, 그의 큰 기대가 이루어지지 않으면 그는 「책임을 져야」 할 것이라고 했다.", "우시바는 고노에만큼의 위험을 무릅쓸 용기나, 교섭에 의한 중국 사변 해결처럼 국가에 긴요한 일에서 육군의 지지를 얻어낼 만한 위신과 정치적 지위를 가진 사람이 달리 없다고 했다.", "우시바는 미국 정부가 패를 하나도 탁자에 내놓지 않아 일본 관변의 비관이 깊어졌다고 했다. 미국은 원칙은 충분히 제시했으나 일본 정부가 무엇을 약속하기를 바라는지 정확히 특정하지 않았다는 것이다.", "10월 2일자 미국 각서를 받은 뒤로 일본 정부 관계자들 사이에 「일본이 덫에 빠졌다」는 견해가 늘고 있다고 했다. 미국은 애초에 협정을 맺을 의사가 없었고, 이제 일본의 정책과 목적을 다 받아냈으니 그것이 미국의 것과 어긋난다는 이유로 협정 거부와 준적대적 태도의 유지를 정당화할 수 있게 되었다는 논법이다.", "두먼은 그런 억측에 아무 근거가 없다고 말하고, 10월 2일 각서가 정식 교섭 개시에 앞서 몇 가지 근본 문제에서 의견 일치가 필요함을 미국 여론 때문이라 밝힌 대목을 상기시켰다.", "우시바는 자기가 10월 4일에 읽도록 허락받은 요약본은 사무적이고 객관적인 어조였으나 실제 각서는 「극히 불쾌한(extremely disagreeable)」 것으로, 논쟁적이고 훈계조이며 전혀 타협적이지 않고 일본 정부에 도움이 될 만한 시사가 하나도 없다고 했다.", "우시바는 결론으로, 일본 정부에 남은 길은 미국 정부에 일본이 해 주기를 바라는 약속의 성격을 특정해 달라고 요구하는 것뿐이며, 명확한 회답이 오지 않으면 회담을 끝내는 것이라는 생각을 말했다."], "primary": "[도쿄,] 1941년 10월 7일.\n\n어제 우시바(牛場信彦, Ushiba) 씨가 전화로 요청해 온 데 대한 회답으로, 나는 그가 오늘 아침 내 집에서 나와 조찬을 같이 하자고 제의하였다. 우시바 씨는 약속한 시각에 어김없이 도착하였다. 식사 중에 하인이 있었던 까닭에, 우리 대화 가운데 기록해 둘 필요가 있는 부분은 짧았으며 대체로 다음과 같았다.\n\n우시바 씨는 미국과의 예비 회담이 아무런 진전을 보지 못한 탓에 총리의 처지가 어려워졌다고 말하였다. 고노에 공(近衞文麿, Konoye)은 앞으로 더 무엇을 할 수 있을지 몰라 어찌할 바를 모르고 있고, 반대파는 이제 내각을 공격하는 데 쓸 구체적인 것을 손에 넣었으며, 앞날은 어두워 보인다는 것이었다. 그는, 자기 상관이 이 회담을 발기(發起)하는 책임을 떠맡았을 때의 사정을 우리가 충분히 헤아리지 못한다면 우리는 이 정세가 온전히 무엇을 뜻하는지 이해할 수 없을 것이라고 말하였다. 육군은 중국과의 사변을 끝내고자 애태우고 있으나, 그 사변의 청산을 발기하는 책임은 결코 지려 하지 않을 것이다. 고노에 공이 그 책임을 떠맡았을 때 육군은 그에게 전면적이고 무조건적인 지지를 주었으며, 만일 그의 높은 기대가 이루어지지 않는다면 그는 「책임을 져야」 할 것이고, 그때에는 고노에 공이 무릅쓴 위험을 무릅쓸 용기를 가진 사람도, 교섭의 절차에 의한 중국 사변의 해결처럼 나라에 그토록 긴요한 일에서 육군의 지지를 얻어낼 만한 위신과 정치적 지위를 가진 사람도 아무도 없을 것이다.\n\n우시바 씨는 이어서, 미국 정부가 자기 패를 하나도 탁자 위에 내놓지 않은 탓에 일본 관변의 비관이 더욱 깊어졌다고 말하였다. 미국 정부가 자기 원칙을 충분히 개진한 것은 사실이나, 일본 정부가 무엇을 떠맡기를 바라는지는 정확히 특정하지 않았다는 것이다. 회담이 시작된 지 여러 달이 지났는데도, 미국 정부가 일본 측에 아무런 구체적 명시도 주지 않으려고 크게 조심하는 듯이 보이는 것은 지극히 낙담스러운 일이라고 하였다. 지난번 미국 각서(10월 2일자)를 받은 뒤로 일본 정부 관계자 가운데 일본이 덫에 빠졌다는 의견을 가진 사람이 점점 늘고 있으며, 그 논법은 대체로 이러하다는 것이었다 — 미국은 애초에 일본과 어떠한 협정도 맺을 의사가 없었다. 미국은 이제 일본으로부터 일본의 정책과 목적에 대한 개진을 받아냈다. 그 정책과 목적은 미국의 정책 및 목적과 어긋난다. 따라서 일본과 협정 맺기를 거부하고 일본에 대하여 준적대적 태도를 계속 유지하는 데 대한 정당한 구실이 생긴다는 것이다.\n\n[663면]\n\n나는 우시바 씨에게 그러한 억측에는 아무런 근거가 없다고 말하였다. 나는 10월 2일자 각서가 일본과 회담이 진행 중이라는 보도에 대한 미국 국민의 반응을 언급하였고, 미국 정부가 태평양 문제의 해결을 이루어 내기를 바라는 마음이 일본 정부에 못지않으나 미국의 여론이 정식 교섭의 개시에 앞서 몇 가지 근본 문제에서 의견의 합치를 필요로 하는 상태라고 진술하였음을 상기시켰다.\n\n우시바 씨는 우리가 그 각서의 실제 본문을 받았는지 물었다. 내가 그에게 보여 준 요약본(10월 4일에 내가 그에게 읽도록 허락한 것)은 사무적이고 객관적인 어조였으나, 실제 각서는 「지극히 불쾌한」 것이었다고 그는 말하였다. 그것은 논쟁적이고 훈계조이며 도무지 타협적이지 않고, 일본 정부가 미국 정부의 희망에 응하는 데 도움이 되도록 마련된 시사나 암시가 하나도 들어 있지 않다는 것이었다. 그는 유럽 전쟁에 대한 태도를 언급한 대목을 들면서, 일본 정부가 어떤 종류의 약속을 하기를 기대하는지에 대한 무슨 표시가 왜 주어져 있지 않은가 하는 반문(反問)을 던졌다.\n\n끝으로 우시바 씨는, 일본 정부에 남은 유일한 길은 미국 정부에 대하여 일본이 해 주기를 바라는 약속의 성격에 관하여 구체적 명시를 달라고 요구하는 것이며, 명확한 회답이 오지 않는다면 회담을 끝내는 것이라는 생각을 밝혔다.\n\nE[ugene] H. D[ooman] 유진 H. 두먼", "secondary": "[Tokyo,] October 7, 1941.\n\nIn reply to a request by telephone yesterday from Mr. Ushiba, I suggested that he breakfast with me this morning at my house. Mr. Ushiba arrived promptly at the appointed time. Owing to the presence of the servant during the meal, that part of our conversation which needs to be recorded was brief and was substantially as follows:\n\nMr. Ushiba said that the Prime Minister’s position had been made difficult by the failure of the preliminary conversations with the United States to make any progress. Prince Konoye was at a loss to know what further he could do, the opposition had now something concrete to use in their attacks on the Cabinet, and the future looked dark. He said that, unless we fully appreciated the circumstances in which his chief had assumed responsibility for initiating these conversations, we would not be able to understand the full implications of the situation. The Army was anxious to bring the conflict with China to an end but it would never take the responsibility for initiating a liquidation of the conflict. When Prince Konoye had taken that responsibility, the Army gave him full and unqualified support, and if his high hopes are not fulfilled he will have to “assume responsibility”, and there would be no one who would have the courage to take the risks which the Prince has taken or with sufficient prestige and political position to gain the support of the Army in any undertaking so vital to the nation as settlement of the China conflict by process of negotiation.\n\nMr. Ushiba went on to say that pessimism in Japanese official quarters had been strengthened by failure on the part of the American Government to lay any of its cards on the table. It was true that the American Government had given a full presentation of its principles, but it had not precisely specified what it wanted the Japanese Government to undertake. Although several months had elapsed since the conversations began, the apparently great care being taken by the American Government not to give the Japanese any specifications was extremely discouraging. Since the receipt of the last American memorandum (October 2) an increasing number of persons in Japanese Government circles were of the opinion that Japan had fallen into a trap, the argument running somewhat as follows—the United States never had any intention of coming to any agreement with Japan; it has now got from Japan an exposition of Japanese policies and objectives; those policies and objectives are not in line with American policies and objectives; and there is therefore justification for refusing to make an agreement with Japan and for continuing to maintain an attitude of quasi-hostility against Japan.\n\n[663면]\n\nI told Mr. Ushiba that there was no basis for any such conjecture. I recalled that the memorandum of October 2 referred to the reaction of the American public to reports that conversations with Japan were taking place and that the statement was made that, although the American Government was no less eager than the Japanese Government to have brought about settlement of Pacific problems, public opinion in the United States was such as to render necessary a meeting of minds on certain fundamental points prior to the opening of formal negotiations.\n\nMr. Ushiba asked whether we had received the actual text of the memorandum. The summary (which I had allowed him to read on October 4) shown to him by me was business like and objective in tone, but the actual memorandum was, he said, “extremely disagreeable”. It was argumentative and preceptive, it was quite uncompromising, and it contained no suggestion or indication calculated to be helpful to, the Japanese Government toward meeting the desires of the American Government. Citing the reference to attitudes toward the European war, he put the rhetorical question, Why was there not provided some indication of the kind of undertaking the Japanese Government was expected to give?\n\nIn conclusion, Mr. Ushiba expressed the thought that the only thing left for the Japanese Government was to ask the American Government to give specifications with regard to the character of the undertakings which Japan was desired to give, and that if a clear-cut reply was not forthcoming to bring the conversations to an end.\n\nE[ugene] H. D[ooman]", "notes": [], "warn": false, "pages": ["0729"], "search": "Dooman 두먼(Eugene H. Dooman, 주일대사관 참사관) Ushiba 우시바(牛場信彦, 총리 비서) Konoye 고노에(近衞文麿, 총리)"}, {"id": "d363", "order": 363, "date": "1941-10-07", "group": "A", "eyebrow": "d363 · Memorandum by the Ambassador in Japan (Grew)", "title": "주일대사(그루)의 비망록", "badge": null, "list_right": "문서 363", "meta": [{"k": "일자", "v": "1941-10-07"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2624", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 363 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d363"}], "summary": "도요다 외상이 그루 대사를 불러, 9월 6일 고노에 총리가 헐의 4원칙을 「전면적으로 승인」한 것이 아니라 「원칙적으로」 수락한 것이라며 미국 측 기록의 수정을 요구하고, 10월 2일 각서에 대한 첫 소감을 말한다.", "points": ["도요다 외상이 10월 2일 국무장관이 일본대사에게 건넨 각서의 본문을 접수해 정독 중이라고 알렸고, 그루는 요지만 받았을 뿐 전문을 검토하지 못했으므로 논평을 삼가겠다고 답했다.", "외상은 9월 6일 그루와 고노에 총리의 사적 회견을 알고 있으며 그 접촉에 이의가 없고 오히려 유익한 의견 교환이 되기를 바란다고 말했다.", "총리의 사적 기록에 따르면 고노에는 4원칙을 「원칙적으로」 수락했을 뿐이며 실제 정세에 적용할 때는 조정이 필요하다고 했으므로, 10월 2일 각서의 「fully subscribed(전면적으로 승인했다)」를 「in principle(원칙적으로)」로 바꾸라고 노무라에게 훈령했다.", "외상은 고노에의 발언이 순전히 사적·비공식이었고 여러 관리에게 회람되는 공문서에 실릴 것을 예상하지 못했다고 설명했다.", "그루는 괄호 안에서, 두먼이 통역한 총리의 발언이 자신의 9월 6일자 전보 제1413호에 정확히 기재되어 있음은 의심의 여지가 없다고 못박았다.", "외상은 「기술적 절차」에서 생기는 항목의 논의는 당분간 피하는 것이 좋겠다고 했다. 9월 6일 발언의 이해 차이, 9월 4일 대사의 성명 초안처럼 공식 자격이 없거나 불완전한 자료 등이 그것이다.", "외상은 10월 2일 각서에 대해 미국 정부가 일본에게 4년 전의 현상으로 즉시 무조건 되돌아가라고 요구하는 인상을 받았다고 말하며, 일본은 그럴 용의가 있으나 4년의 성과를 사실상 즉각 되돌리는 것은 엄청난 규모의 사업이고 근본적인 조정을 수반한다고 했다.", "그루는 개인적 소감으로, 미국 정부는 태평양의 항구적 평화를 위한 원칙들을 일본이 진실로 온전히 준수할 것임을 스스로 확인하려 하고 있다고 답했다."], "primary": "[도쿄,] 1941년 10월 7일.\n\n오늘 아침 외상의 요청으로 그를 방문했을 때, 그는 먼저 10월 2일 국무장관이 일본대사에게 건넨 각서의 본문이 접수되어 신중히 검토되고 있다고 나에게 알렸다. 그 각서에 대해 무슨 논평을 할 수 있겠느냐는 외상의 물음에 대하여, 나는 대사관이 요지만을 받았을 뿐이므로 전문을 검토할 기회를 갖기 전까지는 아무런 소견도 말하지 않는 편이 좋겠다고 답하였다.\n\n이어서 도요다(豊田貞次郎, Toyoda) 제독은, 9월 6일 내가 총리와 가진 사적 회견에 관하여 보고받았으며, 그 회견에서 고노에(近衞文麿, Konoye) 공작이 [664면] 나에게 한 발언의 요지를 내가 「개인적이고 사적인 전언」으로서 국무장관을 통해 루스벨트 대통령에게 전달하였음을 알고 있다고 나에게 말하였다. 외상은 내가 고노에 공작과 접촉하는 데 대하여 자신은 아무런 이의도 품고 있지 않음을 내가 분명히 이해해 주기를 바란다고 하였다. 오히려 그는 총리와 나 사이의 그러한 회견을 통하여 유익한 의견 교환이 이루어지기를 바란다고 하였다. 도요다 제독은, 9월 6일 회견에 관한 총리의 사적 기록을 보면, 고노에 공작이 국무장관이 거듭 강조해 온 네 가지 요점을 「원칙적으로(in principle)」 수락하기는 하였으나, 총리는 그 네 요점을 실제 정세에 적용하는 문제에서는 어느 정도의 조정이 필요할 것이라고 말하였음이 드러난다고 진술하였다. 그런데 10월 2일 일본대사에게 건네진 각서에는 총리가 그 네 요점에 「전면적으로 승인하였다(fully subscribed)」는 서술이 들어 있었다. 따라서 이러한 기록의 불일치에 비추어, 노무라(野村吉三郎, Nomura) 제독은 사적으로 행해진 그 발언을 총리에게 귀속시킴에 있어 「fully subscribed」라는 말 대신 「in principle」이라는 어구를 놓아야 한다고 국무장관에게 알리도록 훈령받았다는 것이다.\n\n외상은, 9월 6일 총리가 나에게 한 발언은 순전히 사적이고 비공식적인 성격의 것이었으며, 일본 정부의 결정과 정책을 빚어내는 데 중요한 지위를 차지하고 있는 한 개인의 사견을 나에게 알리려는 것에 지나지 않았다고 언명하였다. 자기 소견의 요지를 대통령에게 보내는 개인적 전언으로서 전달하도록 나에게 허락한다는 생각은, 우리 회견이 진행되는 도중에야 비로소 고노에 공작에게 떠오른 것이었다. 그러므로, 도요다 제독의 말에 따르면, 나와 고노에 공작의 회견을 알지 못하는 여러 일본 정부 관리들 사이에 회람되어야 하는 공문서에, 그러한 사정 아래 총리가 나에게 한 발언이 편입되리라고는 예상되지 않았다는 것이다. 따라서 미국 정부의 공문서에 총리에게 귀속된 견해가 나타난 이상, 9월 6일 나와의 회견 당시 고노에 공작이 말하였을 바에 관한 기록을 외상과 내가 미리 대조해 본 일이 없다는 점에 비추어, 총리 발언에 관한 일본 측 기록을 분명히 해 둘 필요가 있다고 여겨졌다는 것이다. (일본어로 행해져 두먼(Eugene H. Dooman)이 나에게 통역한 총리의 소견이, 고노에 공작과의 회견을 보고한 나의 9월 6일 오후 10시자 전보 제1413호 [주28]에 올바르고 정확하게 기술되어 있다는 데에는 아무런 의심의 여지가 없다. 총리가 말하는 것은 필시 그 뒤에 그가 한 발언, 즉 「견해의 차이는 만족스럽게 메울 수 있다고 확신한다」는 것과 [665면] 「어떤 점들은 해명과 정밀화를 요할 수 있음을 알고 있다」는 발언일 것이다.)\n\n이 대목에서 도요다 제독은, 10월 2일자 국무장관 각서의 검토를 마친 뒤에는 논평할 수 있게 되기를 바란다고 진술하였고, 그때까지는 자기가 「기술적 절차」라고 부른 것에서 생겨나는 항목들의 논의를 피할 수 있다면 도움이 되리라고 여긴다고 하였다. 그가 염두에 두고 있는 것은 9월 6일 고노에 공작의 발언에 관한 것과 같은 이해의 차이, 그리고 일본대사가 국무부에 전달한 어떤 자료들 — 공식 자격이 없거나, 9월 4일 대사의 성명 초안의 경우처럼 불완전한 것들 — 이었다. 도요다 제독은 기술적 절차의 문제에서 생겨나는 이런 종류의 세목을 정리하려는 어떠한 노력도 회담을 복잡하게 만들 뿐이라고 믿으나, 일단 어떤 실질적 진전이 이루어지고 나면 그러한 문제들을 다룰 용의가 있다고 하였다. 외상은 10월 2일자 국무장관 각서에 관한 한 한 가지 짧은 논평을 하고 싶다고 말하였는데, 곧 미국 정부가 일본 정부로 하여금 4년 전에 있던 현상(status quo)으로 즉시 그리고 무조건 되돌아가기를 바라고 있다는 것이 자기의 인상이라는 것이었다. 그때 이래 일본은 대규모의 전쟁에 휘말려 일본 국민에게 고난과 희생을 요구하여 왔고, 국민은 그러한 시련을 애국의 의무로서 감내하도록 이끌려 왔다. 일본 정부는 4년 전에 있던 상태로 돌아갈 용의가 있고 또 준비가 되어 있으나, 지난 4년의 성과를 사실상 즉각(at a moment's notice) 되돌린다는 것은 엄청난 규모의 사업이며 근본적인 조정을 수반하는 일임을 미국 정부가 이해하는 것이 긴요하다고 하였다.\n\n이어 도요다 제독은, 10월 2일자 국무장관 각서에 개괄되어 있는 미국 정부의 입장에 대하여 비공식적으로 그리고 사적으로 내가 의견을 말해 줄 수 있겠는지를 물었다. 이에 답하여 나는, 극동의 정세를 확고하고 영속적인 기초 위에 세우는 것이 미국 정부의 바람이며, 그러한 기초 위에서가 아니고서는 어떠한 지속적 합의도 이루어질 수 없다고 그에게 말하였다. 나는 10월 2일자 국무장관 각서에 대한 나의 개인적인 소감은, 그것 없이는 태평양 지역의 항구적 평화를 위한 확실한 기초가 달성될 수 없는 그러한 원칙들을 일본이 진실로 그리고 온전히 준수하리라는 것을 미국 정부가 스스로 확인하고자 애쓰고 있다는 것이라고 그에게 말하였다.\nJ[oseph] C. G[rew]\n\n[666면]", "secondary": "[Tokyo,] October 7, 1941.\n\nWhen I called upon the Foreign Minister at his request this morning he first informed me that the text of the memorandum handed to the Japanese Ambassador on October 2 by the Secretary of State had been received and was being carefully studied. In reply to the Minister’s question whether I could make any comments on the memorandum I said that until I had had an opportunity to study the full text, the Embassy having received a resume only, I would prefer to make no observations.\n\nAdmiral Toyoda then told me that he was informed of my private meeting with the Prime Minister on September 6 and was aware that I had communicated to President Roosevelt through the Secretary of State, as a “personal and private message”, the substance of Prince [664면] Konoye’s statements to me at that meeting. The Foreign Minister said he wanted me clearly to understand that he harbored no objection to my contact with Prince Konoye; rather he was desirous that by such meetings between the Prime Minister and myself a helpful exchange of views might be effected. Admiral Toyoda stated that the private records of the Prime Minister with regard to the September 6 meeting revealed that, although Prince Konoye had “in principle” accepted the four points which the Secretary of State had continuously stressed, the Prime Minister had indicated that some adjustment would be required in the matter of applying the four points to actual conditions. However, a statement that the Prime Minister “fully subscribed” to the four points was contained in the memorandum given to the Japanese Ambassador on October 2. Admiral Nomura had therefore, in view of this disparity in the records, been instructed to inform the Secretary of State that the phrase “in principle” should replace the words “fully subscribed” in attributing to the Prime Minister the statement, which had been made privately.\n\nThe Foreign Minister declared that the statements made to me by the Prime Minister on September 6 were of a purely private and informal nature and were intended merely to acquaint me with the personal views of an individual who held an important position in the moulding of the decisions and policies of the Government of Japan. The thought of authorizing me to communicate the substance of his observations as a personal message to the President had only occurred to Prince Konoye during the course of our meeting. Accordingly there had been no expectation, said Admiral Toyoda, that there would be incorporated into a public document, which had to be circulated among various Japanese Government officials who had no knowledge of my meeting with Prince Konoye, any statement made to me by the Prime Minister under these circumstances. Thus, since an attribution of views to the Prime Minister had appeared in an official document of the United States Government, it had been deemed necessary, in view of the absence of previous comparison between the Foreign Minister and myself of notes relating to what might have been stated by Prince Konoye at the time of his meeting with me on September 6, to clarify the Japanese record of the Prime Minister’s statement. (There is no doubt whatsoever that the observations of the Prime Minister, which were made in Japanese and translated by Dooman to me, were correctly and accurately set forth in my telegram No. 1413, September 6, 10 p.m., [주28] reporting my meeting with Prince Konoye. The Prime Minister doubtless is referring to his remark made subsequently that “he is convinced that divergences of view can be satisfactorily met” and [665면] that he “realizes that certain points may require elucidation and precision”.)\n\nAdmiral Toyoda stated at this point that he hoped to be able to comment following the completion of his examination of the Secretary’s memorandum of October 2, and in the meantime he felt that it would be helpful if discussion of items arising from what he termed “technical procedure” could be avoided. He had in mind such differences of understanding as that relating to Prince Konoye’s statement of September 6, and to certain material delivered to the Department by the Japanese Ambassador which either had no official standing or was incomplete as in the case of the Ambassador’s draft statement of September 4. Admiral Toyoda believed that any efforts to clear up details of this character arising out of questions of technical procedure would only tend to complicate the discussions, but once some real progress had been made he would be prepared to take up such questions. The Foreign Minister said that in so far as the Secretary’s memorandum of October 2 was concerned, he would like to make one brief comment, namely, that it was his impression that the Government of the United States wished the Japanese Government to revert at once and unqualifiedly to the status quo which prevailed four years ago. Since that time Japan had been involved in warfare on a large-scale demanding hardships and sacrifices of the people of Japan who had been led to support such trials as a patriotic duty. The Japanese Government was willing and prepared to return to the situation prevailing four years ago but it was essential that the Government of the United States should understand that to undo virtually at a moment’s notice the work of the past four years is an undertaking of tremendous scope and one entailing basic adjustments.\n\nAdmiral Toyoda then inquired whether unofficially and privately I felt able to offer an opinion on the position of the United States Government as outlined in the Secretary’s memorandum of October 2. In reply I told him that it was the desire of the United States Government to establish conditions in the Far East on a sure and enduring foundation and that no lasting arrangements could be made except on such a basis. I told him that my personal reaction to the Secretary’s memorandum of October 2 was that the American Government was endeavoring to assure itself that Japan would genuinely and fully observe those principles without which no sure basis for a lasting peace in the Pacific area could be achieved.\n\nJ[oseph] C. G[rew]\n\n[666면]", "notes": ["[주28] 수록하지 않음. 1941년 9월 6일자 비망록, 604면을 보라."], "warn": false, "pages": ["0730", "0731", "0732"], "search": "그루(Joseph C. Grew) — 주일 미국대사, 비망록 작성자 도요다(豊田貞次郎, Toyoda) — 외상, 해군대장 고노에(近衞文麿, Konoye) — 총리 헐(Cordell Hull) — 국무장관 루스벨트(Franklin D. Roosevelt) — 대통령 노무라(野村吉三郎, Nomura) — 주미 일본대사 두먼(Eugene H. Dooman) — 주일 미국대사관 참사관"}, {"id": "d364", "order": 364, "date": "1941-10-08", "group": "C", "eyebrow": "d364 · Memorandum by the Ambassador in Japan (Grew)", "title": "주일대사 그루의 각서", "badge": null, "list_right": "문서 364", "meta": [{"k": "일자", "v": "1941-10-08"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2624", "txt": true}, {"k": "발신", "v": "주일대사 그루(Joseph Grew)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 364 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d364"}], "summary": "일본 외무성 미국국장 데라사키가 그루를 찾아와 국무부 10월 2일자 각서에 대한 사견을 물었고, 그루가 중국 주둔군 철병·태평양 전역에의 보장 적용·지리적 근접성에 따른 특권 주장 세 가지를 지적하며 「명백한 의사」의 해석을 사견으로 밝힌 회담 기록.", "points": ["1941년 10월 8일 오후, 외무성 미국국장 데라사키(寺崎英成, Terasaki)가 자신의 요청으로 그루를 방문했다.", "데라사키는 국무부 10월 2일자 각서 전문을 읽었는지 묻고, 전적으로 개인적이고 비공식(off the record)으로 소감을 말해 달라고 청했다.", "그루는 그 각서가 어조가 우호적이고 내용이 도움이 되며, 미국 정부가 회담에서 진전을 이루려는 명백한 뜻을 보여 준다고 답했다.", "그루가 특히 눈에 띈다고 꼽은 세 가지: (1) 중국으로부터의 일본군 철병, (2) 남서태평양에 한정된 것으로 보이는 일본 측 보장 가운데 일부를 태평양 전역에 적용하는 것, (3) 중국과 지리적으로 가깝다는 이유로 일본이 주장하는 특별한 권익.", "세 번째와 관련하여 그루는, 많은 저명한 일본인들이 미국의 먼로주의 및 라틴아메리카 관계를 일본의 극동 지위 및 인접국 관계에 견주고 있으나, 자신의 의견으로는 「이 두 상황 사이의 비교 가능성은 흑과 백 사이의 비교 가능성보다 나을 것이 없다」고 말했다. 데라사키는 동의할 수 없다고 했고 두 사람은 그 주제를 더 밀고 나가지 않았다.", "데라사키는 중국과 인도차이나로부터의 철병은 물리적으로 한꺼번에 될 수 없으니 시간이 걸릴 수밖에 없다고 지적하고, 대통령과 총리의 회담 개최 전에 미국 정부가 전 병력의 실제 철수를 고집할 것인지 물으며 국무부가 쓴 「명백한 의사(manifest intention)」라는 문구의 해석을 물었다.", "그루는 그 문구를 해석할 위치에 있지 않다면서, 다만 개인적 의견으로는 국무부가 그 군대가 철수하리라는 구체적 증거를 원한다고 답했다. 회담 과정에서 일본 정부가 화북·몽골 및 어쩌면 다른 지역에도 일정 기간 군대를 남기려 한다는 것이 드러났다고 지적하고, 역대 일본 정부가 겉으로는 성의 있게 준 보장을 이행하지 않아 미국이 과거에 겪은 불행한 경험들을 들었다.", "그루는 자신에게 10월 2일 각서를 해석할 권한이 정부로부터 부여되어 있지 않다고 밝히고, 회담 장소를 워싱턴에서 도쿄로 옮기자는 외상의 제의에 관해 앞선 회담에서 말한 대로, 대통령이 이 회담에 적극적 관심을 갖고 있는 만큼 회담은 계속 워싱턴에서 열리되 도쿄에서 병행 회담을 가질 수는 있다는 것이 헐의 뜻이라고 되풀이했다.", "그루는 일본 정부가 10월 2일 각서의 문구가 여전히 불확실하다면 노무라 제독이 헐과의 면담을 청하여 그 질문들을 제기하는 것이 좋겠다고 제의했다.", "회담 중 데라사키는, 중국과 인도차이나에서 철병하겠다는 표명된 의사에 관하여 일본 정부가 공개 선언을 하는 것이 이로울지 검토해 봄 직하다는 미국 정부의 제의를 언급했다. 그 점이 분명히 이해되었음이 드러났으나 더 논의되지는 않았다.", "회담 끝에 두 사람 모두 이 대화가 전적으로 개인적이고 비공식이었음을 다시 한번 분명히 했다."], "primary": "[도쿄,] 1941년 10월 8일.\n\n외무성 미국국장 데라사키(寺崎英成, Terasaki) 씨가 자신의 요청으로 오늘 오후 나를 찾아와, 그가 우리에게 열람하도록 빌려 준 국무부의 10월 2일자 각서 전문을 내가 읽었는지 물었다. 나는 그렇다고 답하였다. 그러자 데라사키 씨는 그 각서에 대한 나의 인상을 전적으로 개인적인 방식으로 그리고 비공식(off the record)으로 말해 줄 수 있겠느냐고 물었다. 나는 그 각서가 어조에 있어 우호적이고 내용에 있어 도움이 되며, 회담에서 진전을 이루고자 하는 우리 정부의 분명한 희망을 보여 준다고 생각한다고 말하였다.\n\n이어 데라사키 씨는, 상호 합의에 이르기 위하여 일본이 취해 주기를 미국이 바라는 바와 관련하여 어떤 특정한 점들이 나에게 인상 깊었는지 물었다. 나는 실제 문서를 앞에 두고 있지 아니하므로 제시된 모든 점을 망라할 수는 없으나, 개인적으로 그리고 비공식으로 말하자면 특히 나의 눈길을 끈 것은 다음 세 가지였다고 답하였다. (1) 중국으로부터의 일본군 철수, (2) 남서태평양에 한정된 것으로 보이는 일본 측 보장 가운데 일부를 태평양 전역에 적용하는 것, (3) 중국과의 지리적 근접성의 결과로 일본이 주장하는 특별한 권익. 위에 말한 세 번째 점과 관련하여 나는 이 기회에 다음과 같이 말하였다. 즉 많은 저명한 일본인들이 우리의 먼로주의와 라틴아메리카 여러 나라에 대한 우리의 관계를, 일본의 극동에서의 지위 및 인접 국가들과의 관계에 견주고 있으나, 내 의견으로는 이 두 상황 사이에 비교의 여지란 흑과 백 사이에 있는 것 이상이 아니라는 점을 말해 두고 싶다는 것이었다. 데라사키 씨는 나에게 동의할 수 없노라고 하였고, 우리는 그 주제를 더 밀고 나가지 않았다.\n\n다음으로 데라사키 씨는, 중국과 인도차이나로부터의 일본군 철수는 물리적으로 한꺼번에 이루어질 수 없으므로 필연적으로 시간이 걸릴 수밖에 없다고 지적하면서, 제안된 대통령과 총리의 회담이 열리기 전에 우리 정부가 중국과 인도차이나로부터 모든 일본군이 실제로 떠날 것을 고집할 의향인지에 관한 나의 의견을 알고자 하였고, 이와 관련하여 국무부가 쓴 「명백한 의사(manifest intention)」라는 문구를 내가 어떻게 해석하는지 물었다. 나는 그 문구를 해석할 위치에 있지 아니하며, 다만 나의 개인적 의견으로는 국무부가 이 군대들이 철수하리라는 구체적 증거를 바라고 있다는 것만은 말할 수 있다고 답하였다. 회담 과정에서 일본 정부가 화북(North China)과 몽골, 그리고 어쩌면 그 밖의 [667면] 지역에도 일정 기간 군대를 남겨 두기를 희망한다는 것이 드러난 바 있으므로, 나는 데라사키 씨에게, 역대 일본 정부가 겉보기에 성의를 가지고 우리에게 준 보장을 이행하지 아니함으로써 우리가 과거에 겪었던 불행한 경험들을 지적하였다. 그러므로 나의 정부가 일본 정부의 「명백한 의사」에 대한 구체적 증거를 구하는 것은 명백하고도 합당한 일로 보이며, 이것이 그 문구에 대한 나의 개인적이고 비공식적인 해석이 되겠다고 하였다.\n\n이어 나는 데라사키 씨에게, 나에게는 10월 2일자 각서를 해석할 권한이 나의 정부로부터 부여되어 있지 아니하다는 점을 지적하였고, 또한 회담을 워싱턴에서 도쿄로 옮기자는 외상의 제의와 관련하여 앞선 회담에서 외상에게 말한 바와 같이, 대통령이 이 회담에 적극적인 관심을 가지고 있는 점에 비추어 회담은 계속 워싱턴에서 열리되 도쿄에서 병행 회담이 동시에 열릴 수는 있다는 것이 헐(Cordell Hull) 씨의 뜻이라고 하였다. 데라사키 씨는 처음에는 이 말에 다소 놀란 듯이 보였으나, 나는 이 사실을 이미 도요다(豊田貞次郎, Toyoda) 제독에게 분명히 전달하였다고 거듭 말하였다. 그러므로 나는, 일본 정부가 10월 2일자 각서에 담긴 어떤 진술의 의미에 관하여 아직 확실하지 아니하다면 노무라(野村吉三郎, Nomura) 제독이 헐 씨와의 면담을 청하여 그 질문들을 그에게 제기하는 편이 좋겠다고 제의하였다.\n\n대화 도중 데라사키 씨는, 일본 정부가 중국과 인도차이나로부터 군대를 철수하겠다고 표명한 의사에 관하여 공개 선언을 행하는 것의 이점을 검토해 보는 것이 도움이 되리라는 우리 정부의 제의를 언급하였는바, 이로써 이 점이 명확히 이해되었음이 드러났으나 이 특정한 점은 우리의 대화에서 더 다루어지지 아니하였다.\n\n대화가 끝날 무렵 데라사키 씨와 나는 다시 한번 우리의 대화가 전적으로 개인적이고 비공식이었음을 분명히 하였다.\n\nJ[oseph] C. G[rew]", "secondary": "[Tokyo,] October 8, 1941.\n\nMr. Terasaki, Chief of the American Bureau of the Foreign Office, called on me this afternoon, at his request, and asked if I had read the full text of the Department’s memorandum of October 2 which he had lent us for perusal. I replied in the affirmative. Mr. Terasaki then asked if I would tell him in an entirely personal way and off the record my impressions of the memorandum. I said that I thought the memorandum was friendly in tone and helpful in substance and that it indicated a clear desire on the part of our Government to make progress in the conversations.\n\nMr. Terasaki then asked what particular points impressed me in connection with the desires of the United States for action by Japan in order to reach a mutual agreement. I replied that without having the actual document before me I could not undertake to cover all the points presented, but that personally and off the record I might say that three of the points which had particularly caught my eye were (1) the withdrawal of Japanese troops from China; (2) application to the entire area of the Pacific of certain of the Japanese assurances which appeared to be limited to the southwestern Pacific and (3) the special privileges claimed by Japan as a result of her geographical propinquity to China. In connection with the third point mentioned above I took the occasion to say that many prominent Japanese were comparing our Monroe Doctrine and our relationship to the countries of Latin America with Japan’s position in the Far East and her relationship with the neighboring countries, and I wished to say that in my opinion there was no more comparison between these two situations than between black and white. Mr. Terasaki said that he was obliged to disagree with me and we did not pursue that subject.\n\nMr. Terasaki then pointed out that the withdrawal of Japanese troops from China and Indochina must necessarily take time as it could not physically be done all at once and he wanted to know my opinion as to whether our Government intended to insist on the actual departure of all Japanese troops from China and Indochina before the proposed meeting of the President and the Prime Minister could be held and in this connection he asked my interpretation of the Department’s phrase “manifest intention”. I replied that I was not in a position to interpret the phrase under reference except to say that in my personal opinion the Department desired concrete evidence that these troops would be withdrawn. In the conversations it had developed that it was the desire of the Japanese Government to leave troops for a stated period in North China, Mongolia and possibly other [667면] areas and I pointed out to Mr. Terasaki the unfortunate experiences which we had met in times past through the failure of various Japanese Governments to carry out assurances given us in apparent good faith. It therefore seemed to me obvious and reasonable that my Government should seek concrete evidence of the Japanese Government’s “manifest intention”, and this would be my personal, off the record interpretation of the phrase.\n\nI then pointed out to Mr. Terasaki that I had no authority from my Government to interpret the memorandum of October 2 and as I had said to the Foreign Minister in a previous conversation, in connection with his suggestion that the conversations be transferred from Washington to Tokyo, it was Mr. Hull’s wish, in view of the active interest of the President in these conversations, that they continue to be held in Washington although parallel conversations might be held concurrently in Tokyo. Mr. Terasaki at first seemed a little surprised by this statement but I reiterated that I had already clearly conveyed this fact to Admiral Toyoda. I therefore suggested that if the Japanese Government was still uncertain of the meaning of any statements contained in the memorandum of October 2 it might be well for Admiral Nomura to seek an interview with Mr. Hull and to put these questions to him.\n\nIn the course of the conversation reference was made by Mr. Terasaki to our Government’s suggestion that the Japanese Government might helpfully consider the advantage of making a public declaration with regard to its expressed intention to withdraw its troops from China and Indochina so that it was evident that this point had been clearly understood but this particular point was not pursued in our conversation.\n\nAt the end of our talk it was once more made clear both by Mr. Terasaki and myself that our conversation had been entirely personal and off the record.\n\nJ[oseph] C. G[rew]", "notes": [], "warn": false, "pages": ["0733"], "search": "그루(Joseph Grew) — 주일 미국대사 데라사키(寺崎英成, Terasaki) — 일본 외무성 미국국장 헐(Cordell Hull) — 미국 국무장관 도요다(豊田貞次郎, Toyoda) — 일본 외상, 해군 대장 노무라(野村吉三郎, Nomura) — 주미 일본대사, 해군 대장 루스벨트(Franklin D. Roosevelt) — 미국 대통령. 원문에는 「대통령(the President)」으로만 적혀 있다 고노에(近衞文麿, Konoye) — 일본 총리. 원문에는 「총리(the Prime Minister)」로만 적혀 있다"}, {"id": "d365", "order": 365, "date": "1941-10-09", "group": "A", "eyebrow": "d365 · Memorandum by the Counselor of Embassy in Japan (Dooman)", "title": "주일 미국대사관 참사관(두먼)의 비망록", "badge": null, "list_right": "문서 365", "meta": [{"k": "일자", "v": "1941-10-09"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2624", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 365 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d365"}], "summary": "데라사키가 두먼을 불러 10월 2일 각서에 대한 소감을 오프더레코드로 구하고, 인도차이나·중국 철병과 남서태평양 균등대우 문안을 놓고 논의한다.", "points": ["데라사키가 10월 2일 국무장관이 노무라에게 건넨 각서에 대한 두먼의 인상을 「오프더레코드」로 몹시 듣고 싶어 했다.", "데라사키는 각서 가운데 일본이 인도차이나와 중국에서 철병할 의사의 증거를 보여야 한다는 대목에 특히 관심을 보이며, 그것이 수뇌회담 개최 전에 철병하라는 뜻으로 해석될 여지가 있다고 지적했다.", "두먼은 다른 해석도 명백히 있다고 답했다. 인도차이나의 일본군은 프랑스령 인도차이나를 영구 점령한 듯이 행동하며 그 지역을 일본의 식민지로 바꾸어 놓았다.", "두먼은 프랑스인·중국인 체포, 사유재산 압수, 비행장과 병영 접수, 세관 접수 위협 등을 열거하고 남양국장과 상의하라고 권했다.", "남서태평양에서의 균등대우 원칙 적용에 관한 일본 측 문안이 심각한 장애인지 묻자, 두먼은 그것이 기회균등 원칙의 적용을 남서태평양에 국한하려는 의사 표시로 읽히도록 만들어진 것은 아니라고 본다고 답했다.", "데라사키는 바로 그러하며 일본 정부의 의도가 분명히 표현되지 못한 것이 명백하다고 인정하고, 중국에서의 기회균등에 관한 일본 측 설명(특히 지리적 근접성이 만들어 내는 조건에 관한 언급)도 일본 정부가 특히 피하고자 한 함의를 남긴다고 했다.", "데라사키는 중일 간 합의가 이루어지기 전에는 철병으로써 철병 의사의 증거를 보이는 것이 일본에게 불가능하다고 했다.", "두먼은 철병 시간표를 제시하는 방법, 또는 치안 유지를 명분으로 내몽골·화북에 주둔시키려는 일본군의 만족스러운 대체물로서 외국 군사전문가의 조력을 받는 중국 정부의 군사경찰 창설을 고려할 용의를 표하는 방법 등을 예시했다."], "primary": "[도쿄,] 1941년 10월 9일.\n\n오늘 아침 나는 데라사키(寺崎英成, Terasaki) 씨의 요청으로 그를 방문하였다.\n\n데라사키 씨는 10월 2일 국무장관이 노무라(野村吉三郎, Nomura) 제독에게 건넨 각서에 대한 나의 인상을 「오프더레코드」로 듣기를 몹시 바란다고 말하였다. 나는, 데라사키 씨가 이미 대사를 방문하여 그 각서에 관한 대사의 사적이고 비공식적인 소견을 들었다고 대사가 나에게 말하였으므로, 내가 무엇을 덧붙일 처지에 있다고는 보지 않는다고 [668면] 말하였다. 그러자 데라사키 씨는 어젯밤 대사와 나눈 대화를 간략히 요약하면서, 우리가 보기에 그 각서는 어조가 우호적이고 내용이 도움이 된다는 대사의 소견에 특별한 무게를 두었다. 그는 이어서, 일본이 인도차이나와 중국에서 군대를 철수할 의사의 증거를 보일 필요가 있다고 언급한 각서의 그 부분에 자기가 특히 관심을 가지고 있다고 말하였다. 그는 문제의 그 단락이, 제안된 양국 정부 수뇌의 회담이 열릴 수 있기 전에 일본이 위에 언급된 지역들에서 군대를 철수해야 한다고 미국 정부가 기대하고 있다는 해석에 열려 있을 수 있다고 지적하였다. 그가 염두에 두고 있는 그 구절이 아마도 그러한 해석에 열려 있을 수 있다고 말한 다음, 나는 명백히 또 하나의 해석이 있다고 말하였다. 인도차이나의 일본 군대는 마치 프랑스령 인도차이나를 영구히 점령하고 있는 듯이 행동하고 있으며 그 지역을 일본의 식민지로 바꾸어 놓았다. 인도차이나에서의 일본군의 행동이 일본 정부가 떠맡을 용의가 있다고 표명하는 그 약속들의 정신과 문면을 완전히 부정하고 있는 한, 미국 정부가 정식 교섭의 개시에 동의하는 쪽으로 조금이라도 움직이기를 주저하리라는 것은 이치에 닿는 일이었다.\n\n데라사키 씨
