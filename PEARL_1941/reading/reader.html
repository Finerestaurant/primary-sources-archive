ith the situation after the war. The Secretary replied in the affirmative, so far as the full operation of a sound program is concerned, but added that it should now be agreed upon as to principles.\n\nWhen asked by the Secretary as to when the Ambassador would like to confer with us again the Ambassador said that he would get in touch with his Government and would communicate to the Secretary through Mr. Ballantine.\n\n[Joseph W.] Ballantine\n\n[751면]", "notes": [], "warn": false, "pages": ["0811", "0812", "0813", "0814", "0815", "0816", "0817"], "search": "노무라(野村吉三郎, Nomura) — 주미 일본대사 구루스(来栖三郎, Kurusu) — 특사 헐(Cordell Hull) — 국무장관 밸런타인(Joseph W. Ballantine) — 비망록 작성자 히틀러(Adolf Hitler) 장제스(蔣介石, Chiang Kai-shek)"}, {"id": "d401", "order": 401, "date": "1941-11-19", "group": "A", "eyebrow": "d401 · Memorandum of a Conversation", "title": "회담 비망록", "badge": null, "list_right": "문서 401", "meta": [{"k": "일자", "v": "1941-11-19"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/254019/35", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 401 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d401"}], "summary": "노무라와 구루스가 헐 국무장관의 아파트를 찾아와, 7월의 남부 인도차이나 진주 이전 상태로 되돌리자는 전날의 제안, 삼국동맹의 구속력, 독소전의 전망을 논한다.", "points": ["회담은 국무장관의 아파트에서 열렸다. 두 사람이 요청한 방문이다.", "노무라는 전날의 회담을 본국에 보고하고 훈령을 기다리고 있으며, 전보가 이미 들어왔으나 아직 해독되지 않았다고 말했다.", "노무라는 전날 자기가 7월 하순 일본의 남부 인도차이나 진출 이전 상태의 회복을 제의한 이유를 설명했다. 그 행동이 미국의 동결 조치를 촉발했고 그것이 다시 일본에서 긴장을 높였으니, 그 제안대로 무엇인가 이루어지면 긴장이 풀리고 더 나은 분위기가 생기리라는 것이다.", "헐은 그런 제안이 실행되면 회담을 계속하겠다는 뜻이냐고 물었고 노무라는 그렇다고 답했다. 헐은 그것이 일본의 지도자들이 자기 지위를 지키고 평화적 진로에 유리하게 여론을 조직할 수 있게 해 줄지 모른다고 말하면서, 시간이 걸릴 수 있음을 인정한다고 했다.", "노무라는 지금 양쪽이 다 만일의 사태에 대비하고 있는 듯이 보이지만 그럼에도 일본은, 특히 미국의 동결 조치에 비추어, 빠른 해결을 바란다고 말했다.", "삼국동맹에 관하여 노무라는 일본 정부의 견해가 이미 9월 25일자 성명 초안에 충분히 표명되었다면서, 태평양의 평화를 유지하려는 의도는 밝혔으나 삼국동맹을 폐기할 수는 없으며 그 의무를 이행할 의무가 있다고 했다.", "헐은 일본이 도움이 될 한 가지 길로, 극동의 러시아군과 싱가포르의 영국군이 유럽으로 돌아갈 수 있게 하는 것을 들었다. 그것은 일본이 미국을 얼마나 방해하고 있는지를 보이는 예시라고 했다.", "노무라와 구루스는 러시아가 곧 패배하거나 스탈린 정권이 무너질 가망은 없어 보인다고 했고, 노무라는 스탈린이 정부를 결속시킨 힘에 크게 놀랐다며 러시아 방어의 완강함에 감탄을 표했다. 노무라는 독일이 앞으로 영국 침공에 성공할 전망도 없다고 보았다.", "노무라는 일본이 삼국동맹에서 미국의 반감 말고는 아무것도 얻지 못하고 있다는 점을 꽤 길게 이야기했다. 헐이 일본은 대러 중립조약에도 똑같이 구속되지 않느냐고 묻자, 노무라는 둘 다 똑같이 구속력이 있으므로 삼국동맹에 충실하다면 중립조약에도 똑같이 충실해야 한다고 답했다.", "구루스는 독소 사이에 또 한 번의 브레스트-리토프스크가 있을 전망은 보지 않으나, 그런 사태가 되면 독소 연합의 극동 진출을 뜻하므로 일본은 그것을 매우 우려할 것이라고 말했다.", "헐은 히틀러가 바다의 지배권을 얻지 못하게 하기로 이 나라가 결심하고 있으며 아무리 오래 걸려도 그러하다고 강조했고, 회담을 마치며 우리가 할 수 있는 일은 기본 원칙 위에 굳게 서는 것뿐이라고 다시 강조했다."], "primary": "[워싱턴,] 1941년 11월 19일.\n\n일본 대사와 구루스(来栖三郎, Kurusu) 씨가 자기들의 요청으로 국무장관의 아파트를 찾아왔다. 15분가량 일반적인 이야기를 나눈 뒤 대사는, 자기와 구루스 씨가 어제 국무장관과 나눈 회담을 본국 정부에 보고하였고 곧 훈령이 올 것으로 기다리고 있으며, 실은 전보가 이미 들어왔으나 아직 해독되지 않았다고 말하였다. 두 사람은 아마 내일 국무장관과 회담하기를 바라나, 적어도 다음 면회 약속에 관하여 내일 그와 연락하기를 기대한다고 말하였다. 두 사람은 어제의 회담에 관하여 국무장관이 신문에 말한 바에 만족을 표하였고, 국무장관은 신문 쪽도 만족한 듯이 보인다고 말하였다.\n\n이어 국무장관은 대사가 앞날의 가능성에 대하여 어떻게 느끼는지 물었다. 대사는, 어제 자기가 7월 하순 일본의 남부 인도차이나 진출 이전에 있던 상태의 회복에 관한 제의를 한 것은, 그 행동이 우리 쪽 동결 조치를 촉발하였고 그것이 다시 일본에서 반작용을 일으켜 긴장을 높였으므로, 만일 자기의 제의에 따라 무엇인가 이루어질 수 있다면 그 긴장을 푸는 데 도움이 되고 양국 관계에 더 나은 분위기를 만드는 쪽으로 작용하리라고 느꼈기 때문이라고 말하였다. 국무장관은 대사가 제의한 것과 같은 제안이 실행된다면 우리가 회담을 계속하리라고 대사가 생각하는 것이냐고 물었다. 대사는 그렇다고 답하였다. 국무장관은, 이것이 일본의 지도자들로 하여금 자기 자리를 지키고 평화적인 진로에 유리하도록 여론을 조직할 수 있게 해 줄지도 모른다는 견해를 밝혔다. 그는 여기에 시간이 얼마간 걸릴 수 있음을 자기도 인정한다고 말하였다.\n\n대사는 자기 마음에 있는 것은, 지금 양쪽이 다 만일의 사태에 대비하고 있는 듯이 보이지만 그럼에도 일본 측은, 특히 우리 쪽 동결 조치에 비추어, 빠른 해결을 바란다는 점이라고 말하였다. 국무장관은, 회담의 계속과 관련하여 대사가 마음에 두고 있는 것은 지금까지 우리의 견해가 갈리지 아니한 중요한 점들을 더 다듬어 내려는 노력이라고 짐작한다고 말하였다. 대사는 그렇다고 동의하였다. 그러나 그는, 삼국동맹에 관한 일본 정부의 견해는 일본 정부가 이미 충분히 표명한 바 있다고 말하였다. 곧, 태평양의 평화를 유지하려는 자기들의 의도는 9월 25일자 성명 초안에서 이미 분명히 밝혔으나, 자기들은 삼국동맹을 폐기할 수는 없으며 그 의무를 이행할 의무가 있다는 것이었다. 국무장관은 일본이 [752면] 도움이 될 수 있는 한 가지 길은 극동의 러시아군과 싱가포르의 영국군이 유럽으로 돌아갈 수 있게 하는 것이라고 시사하였다. 국무장관은 자기의 이 시사가 일본이 우리를 얼마나 방해하고 있는지를 보이는 예시로서 한 말이라고 하였다. 국무장관은, 히틀러가 세계를 돕고 있다면 사정이 다르겠으나 사실은 그가 우리 모두에게 해를 끼치고 있다고 덧붙였다.\n\n이어 대화는 몇 분 동안 러시아의 정세와 독일의 전망으로 옮아갔다. 대사와 구루스 씨는 러시아가 이른 시일에 패배하거나 스탈린 정권이 무너질 가망은 없어 보인다는 견해를 밝혔다. 대사는 스탈린이 자기 정부를 결속시켜 온 데서 보인 힘에 자기가 매우 놀랐다고 말하였고, 또한 러시아 방어의 완강함에 대하여 감탄하며 이야기하였다. 대사는 또한 독일이 앞으로 영국 침공을 성공적으로 감행할 수 있으리라는 전망을 자기는 보지 못한다는 견해를 밝혔다. 국무장관은, 독일이 스탈린을 정복할 수 없고 영국을 침공할 수도 없으며 독일에 복속되어 있는 유럽의 수천만 인민의 적의에 부딪치고 있다면, 독일의 결말은 무엇이 되겠느냐고 물었다. 대사는 이 점에 대하여 뚜렷한 견해를 밝히지 않았다. 국무장관은, 만일 일본 정부가 일본 주전파(主戰派)의 견해를 이겨 낼 수 있다면 우리와 무엇인가를 이루어 내는 일이 가능할 것이라고 시사하였다. 대사가 일본이 삼국동맹에 구속되어 있다는 점을 다시 한 번 언급하자, 국무장관은 일본이 러시아와의 중립조약에도 똑같이 구속되어 있지 않느냐고 물었다. 대사는, 일본이 삼국동맹에 충실하다면 중립조약에도 똑같이 충실해야 하며 둘은 똑같이 구속력이 있기 때문이라고 답하였다. 대사는 일본이 삼국동맹에서 미국의 반감 말고는 아무것도 얻지 못하고 있다는 점을 꽤 길게 이야기하였다. 이어 구루스 씨는, 독소 정세에서 또 한 번의 브레스트-리토프스크[주59]가 있을 전망은 자기가 보지 못하나, 만일 그런 사태가 벌어진다면 그것은 독소 연합의 극동 진출을 뜻할 것이므로 일본은 그것을 매우 우려할 것이라는 견해를 밝혔다.\n\n국무장관은 세계를 다시 세울 때를 내다볼 필요가 있음을 언급하고, 만일 일본의 호전적 지도자들이 일본의 정책을 계속 장악한다면 그들은 세계를 안정시키고 진보적인 계획을 세울 기회를 우리에게서 빼앗아 갈 것이라고 말하였다. 대사는 미합중국이 전쟁이 끝날 무렵에는 압도적인 힘의 자리에 있게 될 것 같다고 말하면서도, 우리가 아프리카에 병력을 보낸다면 우리 힘을 손상시킬지 모른다고 넌지시 비쳤다. 이어 히틀러가 바다의 지배권을 얻으려 하는 노력에 대하여 얼마간 논의가 오갔고, 국무장관은 우리에게 아무리 오랜 시일이 걸리더라도 이 나라는 히틀러가 바다의 지배권을 얻지 못하게 하기로 결심하고 있음을 강조하였다. [753면] 그는, 만일 히틀러가 한정된 목표만을 위하여 애썼더라면, 지금 그가 무한정한 정복 계획을 가진 탓에 갖게 된 것보다 성공할 가망이 더 컸을지 모른다는 견해를 밝혔다. 국무장관이 만일 일본 측이 히틀러에게 이치에 닿게 굴라고 말해 줄 수 있다면 하고 말하는데 — 구루스 씨가 이 대목에서 말을 가로막고, 자기 생각으로는 히틀러가 강화 교섭에 들어갈 뜻이 있으리라고 본다고 말하였다. 국무장관은 자기는 비유로 말하고 있는 것이며, 자기가 뜻하는 바는 히틀러가 자기의 정복 계획을 완전히 포기하는 것이라고 답하였다. 이어 대사와 구루스 씨가 작별하려고 일어섰고, 그들이 그렇게 하는 동안 국무장관은 우리가 할 수 있는 일이라고는 우리의 기본 원칙 위에 굳게 서는 것뿐이라고 다시 한 번 강조하였다.\n\nJ[oseph] W. B[allantine] 조지프 W. 밸런타인", "secondary": "[Washington,] November 19, 1941.\n\nThe Japanese Ambassador and Mr. Kurusu called at their request at the Secretary’s apartment. After about fifteen minutes of general conversation the Ambassador said that he and Mr. Kurusu had reported to their Government their conversation of yesterday with the Secretary and were momentarily expecting instructions, and that in fact a telegram had already come in but it had not yet been decoded. They said that they would wish to confer with the Secretary perhaps tomorrow, but would at least expect to communicate with him tomorrow in regard to a further appointment. They expressed satisfaction with what the Secretary had said to the press in regard to yesterday’s conversation and the Secretary remarked that the press seemed to be satisfied.\n\nThe Secretary then asked how the Ambassador felt about the possibilities. The Ambassador said that yesterday he had made the suggestion in regard to a restoration of the status which prevailed before the Japanese move into south Indochina in the latter part of July because he felt that, as this action had precipitated our freezing measures which in turn had reacted in Japan to increase the tension, if something could be done on his suggestion, it would serve to relieve that tension and tend to create a better atmosphere in our relations. The Secretary asked whether the Ambassador contemplated that if a proposal such as the Ambassador had suggested were carried out we would go on with the conversations. The Ambassador replied in the affirmative. The Secretary expressed the view that this might enable the leaders in Japan to hold their ground and organize public opinion in favor of a peaceful course. He said that he recognized that this might take some time.\n\nThe Ambassador said that what was in his mind was that both sides now appeared to be preparing for eventualities and that nevertheless the Japanese desired a quick settlement, especially in view of our freezing measures. The Secretary said that he presumed that the Ambassador had in mind, in connection with the continuation of our conversations, further efforts to iron out the important points on which our views had not so far diverged. The Ambassador agreed. He observed, however, that the views of the Japanese Government with regard to the Tripartite Pact had been fully expressed by the Japanese Government; that is to say, that their intentions to maintain peace in the Pacific were already made clear in their draft statement of September 25, but that they could not abrogate the Tripartite Alliance and were bound to carry out their obligations. The Secretary suggested that one way in which the Japanese could be [752면] helpful would be to let the Russian forces in the Far East and the British forces at Singapore go back to Europe. The Secretary said that his suggestion was by way of illustration how much Japan was hindering us. The Secretary added that if Hitler were helping the world the situation would be different, but the fact was that he was injuring all of us.\n\nThe conversation then turned for a few minutes to the situation in Russia and Germany’s prospects. The Ambassador and Mr. Kurusu expressed the view that there seemed to be no likelihood of an early Russian defeat or of a collapse of Stalin’s regime. The Ambassador said that he had been much surprised at the strength Stalin had shown in holding his government together and he also spoke with admiration of the stubbornness of Russian defense. The Ambassador also expressed the view that he saw no prospect of Germany’s being able in the future to launch a successful invasion of England. The Secretary asked, if Germany could not conquer Stalin, could not invade England, and was faced with the hostility of the many millions in Europe which were being held in subjection by Germany, what would be the outcome for Germany. The Ambassador expressed no clear-cut views on this point. The Secretary suggested that if the Japanese Government could prevail over the views of the Japanese war party it should be possible to work out something with us. The Ambassador made a further reference to Japan’s being bound by the Tripartite Pact, whereupon the Secretary asked whether Japan was not equally bound by the neutrality pact with Russia. The Ambassador replied that if Japan was faithful to the Tripartite Pact it must be equally faithful to the neutrality pact as they were both equally binding. The Ambassador dwelt at some length upon the point that Japan was getting nothing out of the Tripartite Pact except American resentment. Mr. Kurusu then expressed the view that although he did not see any prospect of another Brest-Litovsk [주59] in the Russo-German situation, Japan would be very apprehensive of such a development as it would mean a combined Russo-German advance on the Far East.\n\nThe Secretary referred to the need of looking forward to the time for rebuilding the world and said that, if the Japanese militant leaders keep control of Japanese policy, they would deprive us of a chance of stabilizing the world and laying down a progressive program. The Ambassador said that the United States was likely at the end of the war to be in a position of overwhelming strength, but he intimated that we might impair our strength if we sent forces to Africa. There then ensued some discussion of Hitler’s efforts to gain control of the seas and the Secretary emphasized that this country is determined to keep Hitler from getting control of the seas no matter how long it took us. [753면] He expressed the view that if Hitler had striven only for limited objectives he might have had a better chance for success than he now has because of his unlimited program of conquest. The Secretary said that if the Japanese could tell Hitler to be reasonable—Mr. Kurusu interrupted at this point and said that he thought that Hitler would be willing to enter into peace negotiations. The Secretary replied that he was speaking figuratively; that what he meant was abandonment entirely by Hitler of his program of conquest. The Ambassador and Mr. Kurusu then rose to take leave and as they did so the Secretary emphasized again that all we can do is to stand firm on our basic principles.\n\nJ[oseph] W. B[allantine]", "notes": ["[주59] 독일과 소비에트 러시아 사이의 강화조약, 1918년 3월 3일, 『Foreign Relations』, 1918, 러시아 편, 제1권, 442면."], "warn": false, "pages": ["0818", "0819"], "search": "Hull 헐(Cordell Hull, 국무장관) — 원문에는 「국무장관」으로만 나온다 Nomura 노무라(野村吉三郎, 주미대사) — 원문에는 「일본 대사」로만 나온다 Kurusu 구루스(来栖三郎, 특사) Ballantine 밸런타인(Joseph W. Ballantine, 기록자) Hitler 히틀러 Stalin 스탈린"}, {"id": "d402", "order": 402, "date": "1941-11-20", "group": "A", "eyebrow": "d402 · Memorandum of a Conversation", "title": "회담 비망록", "badge": null, "list_right": "문서 402", "meta": [{"k": "일자", "v": "1941-11-20"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/254022/35", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 402 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d402"}], "summary": "구루스와 노무라가 지난 7월 남부 인도차이나 진주 이전 상태로 돌아가는 것을 뼈대로 한 일본 정부의 제안(이른바 「을안」)을 읽어 건네고, 헐은 삼국동맹과 히틀러를 들며 일본이 평화적 행로를 뚜렷이 보여야 한다고 응한다.", "points": ["노무라 대사와 구루스가 자기들 요청으로 국무부를 방문했다.", "구루스는 지난 7월 일본의 남부 인도차이나 진출 이전 상태로 돌아가자는 대사의 앞선 제의를 본국에 회부했으며, 일본 정부가 이제 그 바탕 위에서 제안을 낼 준비가 되었다고 말했다.", "구루스는 다만 이 제안이 대사의 제의를 확대한 것이라고 밝히고, 제안을 국무장관에게 읽어 주었다. (제안 본문은 다음 문서에 실려 있다.)", "헐은 제안을 나중에 검토하겠고 대체로 호의적으로 살피겠다고 하면서, 지금 할 논평은 제안 자체가 아니라 전반적 정세에 관한 것이라고 말했다.", "헐이 말한다. 일본은 전면적인 평화 행로를 결단함으로써 언제든 현 상황을 끝낼 힘을 가지고 있으며, 일본이 「포위(encirclement)」라 부르는 것도 언제든 스스로 끝낼 수 있다는 것이다.", "헐은 미국이 영국 원조를 중단하겠다고 내일 발표하면 국내 여론이 어떻겠느냐고 되묻고, 미국인은 대중국 원조와 대영국 원조의 목적이 같다고 여긴다고 말했다.", "헐이 말한다. 미국민은 히틀러와 일본이 세계를 반씩 나눠 맡으려는 동반 관계에 있다고 믿으며, 삼국동맹의 존재와 「동아시아 신질서」·「공영권」 같은 나치식 표어의 되풀이가 그 믿음을 굳힌다.", "노무라는 일본의 평화 의사는 의심할 바 없다며, 중국 사건의 조속한 해결을 위한 것이 이 제안이고 4년의 전쟁으로 지친 국민을 승리로 밀고 가려고 그런 표어를 썼다고 했다.", "구루스는 일본이 삼국동맹을 폐기할 수는 없는데 어떻게 그런 믿음을 없앨 수 있겠느냐고 물었고, 헐은 일본이 9개국 조약에 대해서는 그렇게 말하지 않았다고 응수했다. 구루스는 9개국 조약은 20년이 되어 시대에 뒤졌다는 취지로 말했다.", "헐은 일본이 태평양에서 미국에 엄청난 해를 끼치고 있으며, 미국이 중국을 돕는 것은 영국을 돕는 것과 같은 이유, 곧 히틀러가 이끄는 군사 세력이 두렵기 때문이라고 강조하고, 중국에서 일본 군부 지도자들이 쓴 방법이 히틀러의 방법과 다르지 않다고 덧붙였다.", "구루스는 일본 제안의 다섯째 항에 관하여, 본국의 동의 여부는 모르나 그 항은 교섭이 시작되는 때부터 미국의 대중국 원조가 중단된다는 뜻으로 해석될 수 있으리라 생각한다고 말했다. 헐은 그 점에 논평하지 않았다.", "헐은 최근 며칠 사이 도쿄발 호전적 언사가 눈에 띄게 잦아든 것을 짚으며, 이틀이라는 짧은 사이에 그만한 성과가 난 것은 두 사람의 노력 덕이라 확신한다고 했다.", "다음 회담 일시는 정하지 않았다."], "primary": "[워싱턴,] 1941년 11월 20일.\n\n일본 대사와 구루스 씨가 자기들 요청으로 국무부를 방문했다. 구루스 씨는, 지난 7월 일본이 남부 인도차이나로 진출하기 이전에 있던 상태로 돌아가는 것에 관하여 대사가 앞선 회담에서 제의한 바를 본국 정부에 회부하였다고 말하고, 일본 정부가 단시일 안에 인도차이나에서 군대를 이동시키는 데 어려움을 느낄 수도 있으리라 예상했으나 그럼에도 일본 정부는 이제 그 바탕 위에서 제안을 낼 준비가 되어 있다고 말했다. 다만 그는 이 제안이 대사의 제의를 확대한 것이라고 말했다. 이어 그는 국무장관에게 제안을 읽어 주었는데, 그 내용은 다음과 같았다.\n\n[여기에 아래에 실린 제안의 본문이 이어진다.]\n\n국무장관은 그 제안을 나중에 검토하겠으며 일반적으로 말하여 호의적으로 살펴보겠다고 하면서, 다만 자신이 이제부터 하려는 논평은 그 제안을 겨냥한 것이 아니라 전반적 정세에 관한 것이라고 말했다. 국무장관은, 일본은 전면적인 평화적 행로를 택하기로 결단함으로써 어느 때든 현재의 상황에 종지부를 찍을 힘을 가지고 있으며, 일본이 굳이 포위(encirclement)라 부르는 것도 어느 때든 스스로 끝낼 수 있다고 말했다. 그는 우리는 일본이 평화적 행로에 찬성하는 여론을 길러 나가기를 바란다고 말했다. 구루스 씨는, 일본 정부가 방금 낸 것과 같은 제안을 우리가 채택하여 정세를 누그러뜨릴 수 있다면 그것이 여론을 기르는 데 도움이 될 것이라고 말했다. 대사는, 일본 정부가 평화를 바라고 있음은 분명하며, 이 제안을 채택함으로써 이루어질 타이에 대한 압력의 완화를 통하여 그러한 평화적 목적을 보이려 하고 있다고 말했다.\n\n[754면]\n\n국무장관은, 만약 우리가 내일 영국에 대한 원조를 중단하기로 결정했다고 발표한다면 이 나라의 여론이 어떻게 반응하리라 보는지 대사에게 물었다. 그는, 미국 국민의 생각에는 우리가 중국을 돕는 바탕에 깔린 목적이 영국을 돕는 바탕에 깔린 목적과 같으며, 미국 국민은 히틀러가 세계의 절반을 맡고 일본이 나머지 절반을 맡을 수 있도록 하는 것을 노린 히틀러와 일본 사이의 동반 관계가 있다고 믿고 있고, 삼국동맹이라는 사실과 「동아시아 신질서」·「공영권」 따위 나치식 표어를 일본 지도자들이 끊임없이 되뇌는 것이 그러한 믿음을 굳히는 데 이바지한다고 말했다. 따라서 필요한 것은 일본이 평화적 행로를 추구하겠다는 분명한 목적을 드러내 보이는 일이라고 국무장관은 지적하였다.\n\n대사는, 일본이 평화를 바란다는 데에는 의심의 여지가 없으며 이는 중국 사건을 해결하려는 일본 정부의 열의에서 분명하다고 대답하였다. 실제로 자신이 방금 제시한 일본 정부의 제안을 채택하는 것도 중국 사건의 신속한 해결을 가져오려는 것이라고 하였다. 그는 일본 국민이 4년에 걸친 전쟁으로 지쳐 있으며, 국무장관이 언급한 표어들은 일본 국민이 승리를 향해 밀고 나아가도록 북돋우려는 것이었다고 말했다.\n\n국무장관은, 우리가 곤경에 빠지면 모두가 다치기 쉬우므로 물론 우리로서도 이 문제를 풀어 나가는 데 도움을 주고 싶다고 말했다.\n\n구루스 씨는, 우리가 현재의 제안을 가지고 나아갈 수 있다면 그동안 근본 문제들을 계속 다루어 나갈 수 있다는 것이 일본 측의 생각이라고 말했다. 그는 일본은 결코 팽창 정책에 스스로를 묶은 일이 없다고 말했다. 국무장관은 그 점에 관해서는 중국인들이 할 말이 있을지 모른다고 말했다. 국무장관은, 우리 국민은 히틀러가 유럽에서 하고 있는 일이 동아시아에서 되풀이되는 것을 피하고자 하며, 우리 국민은 군사적 통제 아래 놓인 「신질서」라는 관념에 반대한다고 말했다. 또 그는 이 나라의 여론은 일본이 히틀러에게 사슬로 묶여 있다고 생각한다고 말했다. 구루스 씨는, 일본이 삼국동맹을 폐기할 수는 없는 터에 어떻게 그러한 믿음을 없앨 수 있겠느냐고 물었다. 국무장관은 언짢게 굴 뜻은 없으나, 일본이 9개국 조약[주60]에 대해서는 그런 식으로 말하지 않았다는 점은 짚어 두어야겠다고 말했다. 구루스 씨는 9개국 조약은 20년이나 되어 시대에 뒤졌다는 취지로 무언가 말했다. 국무장관은 물론 그 문제로 다툴 뜻은 없다고 말했다. 그는 일본이 우리가 중국을 돕는 데 대해 불평할 때, 이 나라의 여론은 코민테른 협정 밑에 무엇이 깔려 있는지를 의아해한다고 말했다. 그는 일본이 태평양에서 이 나라에 엄청난 해를 끼치고 있음을 강조하고, [755면] 일본의 정치가들은 우리가 영국을 돕는 것과 같은 이유로 중국을 돕고 있다는 것을, 곧 우리는 히틀러가 이끄는 군사 세력을 두려워하고 있다는 것을 이해하여야 한다고 말했다. 그는 중국에서 일본의 군부 지도자들이 취한 방법이 히틀러의 방법과 다르지 않다고 덧붙였다. 대사는 이 국면에서 우리가 어떻게 사태를 구할 수 있겠느냐고 물었다. 국무장관은 사태를 구하는 것이 긴급히 중요하다는 데는 동의한다고 대답하면서, 다만 일본의 정치가들이 일본 국내의 정세를 누그러뜨릴 수 있다고 보는지 대사에게 물었다. 구루스 씨는 일본 제안의 다섯째 항에 관하여, 본국 정부가 동의할지는 모르겠으나 그 항은 교섭이 시작되는 때부터 미국의 대중국 원조가 중단된다는 뜻으로 해석될 수 있으리라 생각한다고 말했다. 국무장관은 그 점에 대해서는 아무런 논평도 하지 않았으나, 지난 며칠 사이에 도쿄에서 나오는 호전적인 언사가 눈에 띄게 잦아들었음을 짚으면서, 이틀이라는 짧은 사이에 이 방향으로 그만한 성과가 이루어진 것은 참으로 대사와 구루스 씨의 공이라고 여기며 그것을 가져온 것이 그들의 노력이었음을 확신한다고 말했다. 그는 이틀 사이에 그만한 것이 이루어졌다면 더 긴 기간에는 훨씬 더 많은 것이 이루어질 수 있으리라고 말했다.\n\n다음 회담의 일시는 정해지지 않았다.\n\nJ[oseph] W. B[allantine]", "secondary": "[Washington,] November 20, 1941.\n\nThe Japanese Ambassador and Mr. Kurusu called at their request at the Department. Mr. Kurusu said that they had referred to their Government the suggestion which the Ambassador had made at a previous meeting in regard to a return to the status which prevailed prior to the Japanese move into south Indochina last July, and said that they had anticipated that the Japanese Government might perceive difficulty in moving troops out of Indochina in short order, but that nevertheless the Japanese Government was now prepared to offer a proposal on that basis. He said, however, that the proposal represented an amplification of the Ambassador’s suggestion. He then read the proposal to the Secretary which was as follows:\n\n[Here follows text of the proposal printed infra.]\n\nThe Secretary said that he would later examine the proposal, and that he would give sympathetic study to the proposal speaking generally, but that the comments which he was about to make were not directed specifically to the proposal but to the general situation. The Secretary said that Japan had it in its power at any moment to put an end to the present situation by deciding upon an all-out peaceful course; that at any moment Japan could bring to an end what Japan chose to call encirclement. He said that we want to have Japan develop public opinion in favor of a peaceful course. Mr. Kurusu said that if we could alleviate the situation by adopting a proposal such as the Japanese Government had just made it would help develop public opinion. The Ambassador said that the Japanese Government was clearly desirous of peace and that it was trying to show this peaceful purpose by relieving the pressure on Thailand which adoption of the proposal would accomplish.\n\n[754면]\n\nThe Secretary asked what the Ambassador thought would be the public reaction in this country if we were to announce tomorrow that we had decided to discontinue aid to Great Britain. He said that in the minds of the American people the purposes underlying our aid to China were the same as the purposes underlying aid to Great Britain; that the American people believed that there was a partnership between Hitler and Japan aimed at enabling Hitler to take charge of one-half of the world and Japan of the other half; and that the fact of the Tripartite Alliance and the continual harping by Japanese leaders upon slogans of the Nazi type such as “new order in East Asia” and “co-prosperity sphere” served to strengthen the public in their belief. What was therefore needed, the Secretary pointed out, was the manifestation by Japan of a clear purpose to pursue peaceful courses.\n\nThe Ambassador replied that there was no doubt of Japan’s desire for peace, as this was clear from the eagerness of the Japanese Government to reach a settlement of the China affair—and indeed adoption of the Japanese Government’s proposal that he had just presented was designed to bring about speedy settlement of the China affair. He said that the Japanese people after four years of fighting were jaded and that the slogans to which the Secretary had made reference were intended to encourage the Japanese people to push on to victory.\n\nThe Secretary said that we of course are anxious to help work this matter out for if we should get into trouble everybody was likely to get hurt.\n\nMr. Kurusu said that if we could go ahead with the present proposal the Japanese idea would be that we could go on working at fundamentals. He said that Japan has never pledged itself to a policy of expansion. The Secretary observed that the Chinese might have an answer to that point. The Secretary said that our people desired to avoid a repetition in east Asia of what Hitler was doing in Europe; that our people oppose the idea of a “new order” under military control. He said also that the public in this country thinks that Japan is chained to Hitler. Mr. Kurusu asked how Japan could eradicate such a belief as Japan could not abrogate the Tripartite Pact. The Secretary said that he did not want to be disagreeable, but he felt he must observe that Japan did not talk that way about the Nine Power Treaty. [주60] Mr. Kurusu said something about the Nine Power Treaty being twenty years old and being outmoded. The Secretary said that of course he did not wish to argue the matter. He said that when the Japanese complained about our helping China the public in this country wonders what is underneath the Comintern Pact. He emphasized that Japan is doing this country tremendous injury in the Pacific; [755면] that Japanese statesmen ought to understand that we are helping China for the same reason that we are helping Britain; that we are afraid of the military elements led by Hitler. He added that the methods adopted by the Japanese military leaders in China were not unlike Hitler’s methods. The Ambassador asked how we could save the situation at this juncture. The Secretary replied that he agreed upon the urgent importance of saving it, but he asked whether the Ambassador thought that the Japanese statesmen could tone down the situation in Japan. Mr. Kurusu said, with reference to the fifth point in the Japanese proposal, that he did not know whether his Government would agree but he thought that that point might be interpreted to mean that American aid to China would be discontinued as from the time that negotiations were started. The Secretary made no comment on that point but noted that in the last few days there had been marked subsidence in warlike utterances emanating from Tokyo, and he felt that it was indeed a great tribute to the Ambassador and Mr. Kurusu that so much had been accomplished in this direction within a short space of two days as he felt sure that it was their efforts which had brought this about. He said that if so much had been accomplished within the course of two days, much more could be accomplished in the course of a longer period.\n\nNo time was set for the next meeting.\n\nJ[oseph] W. B[allantine]", "notes": ["[주60] Foreign Relations, 1922, 제1권, 276면."], "warn": false, "pages": ["0820", "0821"], "search": "노무라(野村吉三郎, Nomura) — 주미 일본대사 구루스(来栖三郎, Kurusu) — 특사 헐(Cordell Hull) — 국무장관 밸런타인(Joseph W. Ballantine) — 비망록 작성자 히틀러(Adolf Hitler)"}, {"id": "d403", "order": 403, "date": "1941-11-20", "group": "B", "eyebrow": "d403 · Draft Proposal Handed by the Japanese Ambassador (Nomura) to the Secretary of State on November 20, 1941", "title": "1941년 11월 20일 주미 일본대사(노무라)가 국무장관에게 건넨 제안 초안(draft proposal)", "badge": null, "list_right": "문서 403", "meta": [{"k": "일자", "v": "1941-11-20"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/254022/35", "txt": true}, {"k": "발신", "v": "The Japanese Ambassador (Nomura) 주미 일본대사 노무라", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "제안"}], "links": [{"k": "FRUS", "text": "문서 403 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d403"}], "summary": "일본이 내민 이른바 「을안(乙案)」이다. 남부 인도차이나 철병과 남방 무력 진출 중지를 내걸고, 그 대가로 자산 동결 이전 상태로의 통상 회복과 미국의 대일 석유 공급, 그리고 미국이 중일 화평 노력을 방해하지 말 것을 요구한다.", "points": ["제1항에서 일본과 미국 양국 정부는 현재 일본군이 주둔 중인 프랑스령 인도차이나의 그 부분을 제외하고, 동남아시아와 남태평양 지역의 어느 곳에도 무력 진출을 하지 않을 것을 약속(undertake)한다. 원문에 「hot to make」라는 오타가 있다(「not to make」).", "제2항에서 일본 정부는 중일 간 평화의 회복 또는 태평양 지역에서 공정한 평화의 확립이 이루어지면 프랑스령 인도차이나 주둔군을 철수할 것을 약속한다.", "제2항 후단에서 일본 정부는 그동안, 뒤에 최종 협정에 담길 이 잠정 조정(present arrangement)이 체결되는 즉시 남부 인도차이나 주둔군을 북부로 이동시킬 용의가 있음을 선언한다.", "제3항에서 양국 정부는 네덜란드령 동인도에서 양국이 필요로 하는 물자·상품의 취득을 확보하기 위하여 협력한다(shall cooperate).", "제4항에서 양국 정부는 통상 관계를 자산 동결 이전 상태로 회복시킬 것을 상호 약속한다. 미국 정부는 일본에 소요량의 석유를 공급한다(shall supply).", "제5항에서 미국 정부는 중일 간 전반적 평화 회복 노력에 해가 될 조치와 행동을 삼갈 것을 약속한다."], "primary": "1941년 11월 20일\n\n1. 일본과 미국 양국 정부는 현재 일본군이 주둔하고 있는 프랑스령 인도차이나의 그 부분을 제외하고, 동남아시아 및 남태평양 지역의 어느 지방에 대하여도 무력 진출을 하지 않을 것을 약속한다.\n\n2. 일본 정부는 일본과 중국 사이의 평화 회복 또는 태평양 지역에서의 공정한 평화의 확립이 있을 때에 현재 프랑스령 인도차이나에 주둔하고 있는 자국 군대를 철수할 것을 약속한다.\n\n그동안 일본 정부는, 뒤에 최종 협정에 담기게 될 본 조정(arrangement)이 체결되는 즉시 현재 프랑스령 인도차이나 남부에 주둔하고 있는 자국 군대를 동 지역의 북부로 이동시킬 용의가 있음을 선언한다.\n\n[756면]\n\n3. 일본 정부와 미국 정부는 양국이 필요로 하는 물자 및 상품을 네덜란드령 동인도에서 취득함을 확보할 목적으로 협력한다.\n\n4. 일본과 미국 양국 정부는 양국의 통상 관계를 자산 동결 이전에 있었던 상태로 회복시킬 것을 상호 약속한다.\n\n미국 정부는 일본에 소요되는 양의 석유를 공급한다.\n\n5. 미국 정부는 일본과 중국 사이의 전반적 평화 회복을 위한 노력에 해가 될 조치 및 행동을 취하지 않을 것을 약속한다.", "secondary": "November 20, 1941\n\n1. Both the Governments of Japan and the United States undertake hot to make any armed advancement into any of the regions in the South-eastern Asia and the Southern Pacific area excepting the part of French Indo-China where the Japanese troops are stationed at present.\n\n2. The Japanese Government undertakes to withdraw its troops now stationed in French Indo-China upon either the restoration of peace between Japan and China or the establishment of an equitable peace in the Pacific area.\n\nIn the meantime the Government of Japan declares that it is prepared to remove its troops now stationed in the southern part of French Indo-China to the northern part of the said territory upon the conclusion of the present arrangement which shall later be embodied in the final agreement.\n\n[756면]\n\n3. The Government of Japan and the United States shall cooperate with a view to securing the acquisition of those goods and commodities which the two countries need in Netherlands East Indies.\n\n4. The Governments of Japan and the United States mutually undertake to restore their commercial relations to those prevailing prior to the freezing of the assets.\n\nThe Government of the United States shall supply Japan a required quantity of oil.\n\n5. The Government of the United States undertakes to refrain from such measures and actions as will be prejudicial to the endeavors for the restoration of general peace between Japan and China.", "notes": [], "warn": false, "pages": ["0822"], "search": "노무라(野村吉三郎, Nomura) — 주미 일본대사 헐(Cordell Hull) — 국무장관"}, {"id": "d404", "order": 404, "date": "1941-11-21", "group": "C", "eyebrow": "d404 · Memorandum by the Secretary of State", "title": "국무장관 각서", "badge": null, "list_right": "문서 404", "meta": [{"k": "일자", "v": "1941-11-21"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2474", "txt": true}, {"k": "발신", "v": "헐(Cordell Hull) — 국무장관", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 404 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d404"}], "summary": "구루스 특사가 헐의 호텔 숙소를 찾아와 삼국동맹에 대한 일본의 해석을 해명하는 서한 초안을 건네지만, 헐은 별 도움이 되지 않는다며 물리친다.", "points": ["구루스가 자기 요청으로 헐의 호텔 아파트를 방문했다.", "그가 가져온 용건은 삼국동맹에 대한 일본 측 해석을 언급하는 것뿐이었고, 해명을 시도하는 뜻으로 자신이 서명하겠다는 문서 초안을 건넸다.", "헐은 문서를 본 뒤 평화적 해결이라는 문제 전반에 관해 더 내놓을 것이 있는지 물었고, 구루스는 없다고 답했다.", "헐은 이것이 별다른 도움이 되리라 생각하지 않는다고 말하고 그것을 물리쳤다. 중요한 이야기는 사실상 그것이 전부였다.", "부속 초안에서 구루스는 자신이 본국 정부의 훈령으로 삼국동맹에 서명한 당사자임을 들며, 그 조약이 독립국으로서 일본의 주권을 어떤 식으로도 침해하지 않는다고 말한다.", "제3조에 따라 일본은 그 의무를 자유롭고 독립적으로 해석할 수 있으며 다른 체약국의 해석에 구속되지 않는다고 한다.", "일본 정부는 그 조약이나 다른 어떤 국제적 약속에 의해서도 제3국의 어떠한 침략에도 협력자가 될 의무를 지지 않으며, 외국의 지시로 일본 국민을 전쟁에 밀어넣는 일은 결코 없을 것이라고 한다.", "구루스는 완전한 양해에 이르면 이 통첩을 공표해도 좋다고 덧붙인다."], "primary": "[워싱턴,] 1941년 11월 21일.\n\n구루스(来栖三郎, Kurusu) 대사가 자기 요청으로 나의 호텔 아파트를 방문했다. 그는 삼국동맹(Tripartite Pact)에 대한 일본 측 해석을 언급하는 것 말고는 나와 논의할 용건이 없었으며, 해명을 시도하는 방편으로 자신이 서명하겠다고 제안한 문서의 초안을 나에게 건넸다. 나는 그 문서를 본 뒤 구루스 씨에게 평화적 해결이라는 문제 전반에 관하여 더 내놓을 것이 있는지 물었다. 그는 없다고 대답했다. 나는 이것이 별다른 도움이 되리라고는 생각하지 않는다고 말하고 그것을 물리쳤다. 중요한 이야기로 오간 것은 사실상 이것이 전부였다.\n\nC[ordell] H[ull]\n\n[부속서]\n\n1941년 11월 21일 구루스 사부로(来栖三郎) 씨가 국무장관에게 건넨 서한 초안[주61]\n\n워싱턴, 1941년 11월 20일.\n\n국무장관 각하: 각하와 영광스럽게도 여러 차례 나눈 회담을 통하여, 일본이 삼국동맹에 따라 떠맡은 의무에 관하여 귀국 국민 사이에 뿌리 깊은 오해가 퍼져 있음을 알게 되어 저는 다소 놀랐습니다.\n\n각하께서 충분히 아시는 바와 같이 저는 본국 정부의 훈령을 받아 그 조약에 서명한 사람이며, 앞서 말씀드린 그릇된 인상을 없애는 데 도움이 되리라 믿는 다음의 성명을 하게 되어 매우 기쁩니다.\n\n이 조약이 독립국으로서 일본이 가지는 주권을 어떤 식으로도 침해할 수 없고 또 침해하지 않는다는 것은 말할 나위가 없습니다.\n\n[757면]\n\n뿐만 아니라, 동맹 제3조의 문면대로라면 일본은 그 의무를 자유로이 그리고 독립적으로 해석할 수 있는 위치에 있으며, 다른 체약 당사국들이 그에 대하여 내릴 수 있는 해석에 구속되지 않습니다. 덧붙여 말씀드리고 싶은 것은, 본국 정부는 앞서 말한 조약에 의해서도 그 밖의 어떠한 국제적 약속에 의해서도 어느 제3국 또는 제3국들의 어떠한 침략에 대해서든 그 협조자나 협력자가 될 의무를 지지 않는다는 점입니다.\n\n본국 정부는 어떠한 외국의 지시에 따라서도 일본 국민을 전쟁에 밀어넣는 일이 결코 없을 것입니다. 정부는 오직 그 안전의 유지와 능동적인 불의에 맞선 국민 생활의 보전을 위한 최종적이고 피할 수 없는 필요로서만 전쟁을 받아들일 것입니다.\n\n위의 성명이, 각하께서 거듭 언급하신 세간의 의혹을 완전히 없애는 데 도움이 되기를 바랍니다. 덧붙여 말씀드릴 것은, 우리 사이에 완전한 양해(Understanding)가 이루어졌을 때에는 각하께서 이 통첩을 공표하셔도 전혀 무방하다고 여기셔도 좋다는 점입니다.\n\n경구[etc.]", "secondary": "[Washington,] November 21, 1941.\n\nAmbassador Kurusu called at my hotel apartment at his request. He had no business to take up with me except to refer to the Japanese interpretation of the Tripartite Pact and handed me a draft of a paper which he proposed to sign by way of attempted clarification. I looked at the paper and then asked Mr. Kurusu whether he had anything more on the whole subject of a peaceful settlement to offer. He replied that he did not. I said that I did not think this would be of any particular help and so dismissed it. This was virtually all that was said of importance.\n\nC[ordell] H[ull]\n\n[Annex]\n\nDraft Letter Handed by Mr. Saburo Kurusu to the Secretary of State on November 21, 1941 [주61]\n\nWashington, November 20, 1941.\n\nMr. Secretary: Through several conversation[s] I have had the honor of holding with Your Excellency, I was rather surprised to learn that a deep-seated misconception prevails among your people about the obligation which Japan assumed under the Tripartite Pact.\n\nAs Your Excellency is fully aware I am the one who signed the said treaty under the instructions of my Government; and I am very happy to make the following statement which I trust will serve to eradicate the aforesaid false impression:\n\nIt goes without saying that this treaty can not and does not infringe, in any way, upon the sovereign right of Japan as an independent state.\n\n[757면]\n\nBesides, as Article III of the Pact stands, Japan is in a position to interpret its obligation freely and independently and is not to be bound by the interpretation which the other high contracting parties may make of it. I should like to add that my Government is not obligated by the aforementioned treaty or any other international engagement to become a collaborator or cooperator in any aggression whatever by any third Power or Powers.\n\nMy Government would never project the people of Japan into war at the behest of any foreign Power; it will accept warfare only as the ultimate, inescapable necessity for the maintenance of its security and the preservation of national life against active injustice.\n\nI hope that the above statement will assist you in removing entirely the popular suspicion which Your Excellency has repeatedly referred to. I have to add that, when a complete Understanding is reached between us, Your Excellency may feel perfectly free to publish the present communication.\n\nI have [etc.]", "notes": ["[주61] 문서번호 762.9411/323으로 따로 편철되어 있음."], "warn": false, "pages": ["0823"], "search": "헐(Cordell Hull) — 국무장관, 각서 작성자 구루스(来栖三郎, Saburo Kurusu) — 특사"}, {"id": "d405", "order": 405, "date": "1941-11-22", "group": "A", "eyebrow": "d405 · Memorandum of a Conversation", "title": "회담 비망록", "badge": null, "list_right": "문서 405", "meta": [{"k": "일자", "v": "1941-11-22"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/254027/35", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 405 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d405"}], "summary": "헐이 노무라·구루스에게, 태평양 관계국 대표들과 논의했으나 일본이 평화적 의도의 증거를 보여야 자산동결 완화가 가능하다고 말하고, 인도차이나 철병과 중국 원조 문제를 두고 맞선 회담.", "points": ["국무장관은 태평양 지역에 이해가 있는 몇몇 다른 나라 대표들을 불러, 일본의 평화 서약 등이 자산동결의 어느 정도 완화가 가능한 방향으로 전개될 수 있는지 논의했다고 밝혔다.", "국무장관은 그 대표들의 마음에도 자신이 회담 과정에서 품었던 것과 같은 종류의 의구심이 생겨나 있음을 알았다고 하고, 지난 7월 일본이 인도차이나로 움직였을 때 대사와 자신이 평화를 이야기하던 중에 놓인 처지를 언급했다.", "국무장관은 지난봄 회담 진행 중 일본의 석유 구매가 늘어난 일, 회담의 성공을 그르치지 않으려 그 선적을 허용했다가 자신이 여론의 비판을 견딘 일, 그리고 그 석유가 평상시 민수(民需)에 쓰이지 않았다는 사실을 언급했다.", "국무장관은 일본 언론이 위협적 논조를 취하고 어느 일본 정치가도 평화의 길을 말하지 않는다고 지적하며, 왜 두 대사를 뒷받침해 평화를 설파하는 일본 정치가가 없느냐고 물었다.", "국무장관은 오늘 일본 측 제안에 관하여 아무 결정도 내려지지 않았다고 하면서도, 일본 정부가 무력과 정복의 정책에 관련된 국내 정세를 장악할 수 있게 되는 대로 민수용에 한하여 석유로 일본을 돕는 것을 고려하겠다고 말했다.", "구루스는 지금 시기에 임시 의회가 열린 것이 유감이라고 하고, 4년의 전쟁과 미국의 동결 조치로 영향받은 일본 국민의 비정상적 심리 상태가 뚜렷이 드러났다고 했다.", "구루스는 육군이 한번 취한 입장을 버리게 하려면 많은 설득이 필요하나 남부 인도차이나 철병 제의에 육군이 응한 것은 고무적인 조짐이라 하면서도, 정세가 폭발점에 다가가고 있다고 했다.", "노무라는 일본이 평화를 바란다는 데 조금도 의심이 없다고 하고, 1905년 대러 강화 뒤 일본에서 일어난 민중의 소요를 들어 유화적 노선을 공공연히 뒷받침하기 어려운 사정을 지적했다.", "구루스는 「환자를 고치는 데 천 달러가 필요한데 삼백 달러를 내놓아서는 목적을 이루지 못한다」고 했고, 국무장관은 일본 정부가 요구된 것을 다 받아야 할 만큼 약하다면 무엇으로도 그것을 구할 수 없을 것이라고 논평했다.", "국무장관은 일본군이 인도차이나의 북·동·남·서 어디에 남아 있든 하룻밤 사이에 이동할 수 있으므로 이웃 나라들의 불안이 가시지 않으며, 예컨대 영국은 싱가포르에서 군함 한 척도 뺄 수 없으리라고 했다.", "구루스가 일본 외상이 그루 대사에게 「양보는 모두 일본 쪽이 해야 하는 것처럼 보인다」고 말했다고 하자, 국무장관은 7월에 일본이 인도차이나로 들어갔다는 사실을 간과했다며, 미국은 처음부터 길 한복판에 서 있었고 법과 질서의 길에서 벗어난 것은 일본이며 「법에 맞는 길로 돌아오는 데 대가를 받아야 할 까닭은 없다」고 응수했다.", "구루스가 미국의 통상조약 폐기가 일본을 궁지에 몰았다고 하자, 국무장관은 일본이 스스로를 궁지에 몰았다고 하며 1934년 사이토 대사에게 일본이 동아시아의 패권을 꾀하고 있다고 말한 일을 들었다.", "국무장관은 미국 함대의 주력이 태평양에 묶여 있는데도 일본은 중국을 돕지 말라 요구한다며, 우리는 중국 원조를 계속해야 한다고 말했고, 대사는 미국의 도의적 영향력이 장제스를 버티게 하고 있다고 논평했다.", "국무장관은 제안 안에 중국 문제를 끼워 넣어 진전을 막는 위험을 지적하며, 그 조항대로 하면 미국이 중일 간 강화에 주선(good offices)을 성공적으로 펴는 일이 사실상 영영 막힌다고 하고 지금은 고려할 수 없다고 했다.", "국무장관은 월요일[11월 24일] 전에 회답을 요구하면 어쩔 수 없다고 하며 관계국 대표들과 다시 협의해야 한다고 했고, 대사는 재촉할 뜻이 없다며 월요일까지 기다리겠다고 했다.", "국무장관은 다른 나라들의 협력을 포함하는 전반적·포괄적 계획을 언젠가 대사와 다루고자 한다고 말했고, 대사는 일본은 다른 나라들이 뒤에 가입할 수 있는 양자 협정을 교섭할 생각이라고 답했다."], "primary": "[워싱턴,] 1941년 11월 22일.\n\n일본대사와 구루스(来栖三郎, Kurusu) 씨가 대사의 요청으로 잡은 약속에 따라 국무장관의 아파트를 방문했다. 국무장관은, 태평양 지역에 이해관계가 있는 어떤 다른 정부들의 대표를 불러들여, 여러 사정(일본의 평화 서약 등을 뜻한다)이 자산동결을 어느 정도 완화할 수 있는 방향으로 전개될 수 있겠는지의 문제를 논의했다고 말했다. 국무장관은 그 대표들이 그 제의에 관심을 보였으며, 만일 일본이 자국의 의도가 평화적이라는 만족스러운 증거를 우리에게 얼마간 보여 줄 수 있다면 이 문제가 모두 해결될 수 있으리라는 전반적인 느낌이 있었다고 말했다.\n\n국무장관은, 이들 다른 나라의 대표들과 정세를 논의하는 가운데 그들의 마음에도 자신이 일본대사와의 회담 과정에서 겪었던 것과 같은 종류의 의구심이 생겨나 있음을 알게 되었다고 말했다. 그는 지난 7월 일본 정부가 인도차이나로 움직였을 때, 평화를 이야기하고 있던 대사와 국무장관이 놓이게 된 처지를 언급했다. 그는 또한 회담이 진행 중이던 지난봄 일본의 석유 구매가 늘어난 일, 회담의 성공적인 결말을 그르치고 싶지 않았던 까닭에 그 선적을 허용한 데 대하여 자신이 여론의 비판을 견뎌 낸 일, 그리고 그 석유가 평상시의 민간 소비에 쓰이지 않았다는 사실을 언급했다.\n\n[758면]\n\n국무장관은 이어, 위협적인 논조를 취하고 있는 일본 언론은 자신에게 아무런 힘을 주지 못하며 어느 일본 정치가도 평화의 길을 이야기하고 있지 않은 반면, 미국 언론에서는 평화의 길을 주창하는 목소리가 언제나 귀를 얻을 수 있다고 말했다. 그는 어찌하여 평화를 설파하여 두 대사를 뒷받침하는 일본 정치가가 하나도 없느냐고 물었다. 국무장관은, 만일 미국과 다른 나라들이 일본이 평화의 길을 걸어오는 것을 보게 된다면 일본이 원하는 모든 물자를 얻는 데 아무런 문제가 없으리라는 것, 그리고 일본 정부도 그것을 알고 있다는 것을 지적했다.\n\n국무장관은, 오늘 일본 측 제안에 관하여 아무런 결정에도 이르지 못했으나, 일본 정부가 무력과 정복의 정책에 관련되는 한에서 일본 국내의 정세를 장악할 수 있게 되는 대로 민간 수요에 한하여 석유 문제에서 일본을 돕는 것을 고려하리라고 느낀다고 말했다. 그는 만일 대사가 일본의 평화적 의도에 관하여 무엇이든 더 보장해 줄 수 있다면 국무장관이 상원의원들과 이 나라의 다른 인사들과 이야기하는 데 도움이 되리라고 말했다.\n\n구루스 씨는 하필 이 시기에 임시 의회가 열린 것이 유감이라고 말했다. 여론의 지지를 얻으려는 정부의 노력이, 4년의 전쟁과 우리의 동결 조치로 영향을 받은 일본 국민의 현재 심리 상태의 비정상성을 뚜렷이 도드라지게 했다는 것이다.\n\n국무장관은 대사의 의견으로는 일본 육군 안에 과격파의 태도가 어느 정도로 널리 퍼져 있느냐고 물었다. 구루스 씨는, 육군으로 하여금 한번 취한 입장을 버리게 하려면 많은 설득이 필요하나, 남부 인도차이나에서 일본군을 철수하겠다고 제의하는 데 관한 자기들의 제안에 일본 육군이 응했을 때 자신과 대사는 모두 기분 좋게 놀랐다고 말했다. 그는 이것이 고무적인 조짐이라고 생각하나, 그럼에도 정세는 폭발점에 다가가고 있다고 말했다.\n\n국무장관은, 이제 어느 일본 정치가가 나서서 다음과 같이 말하는 것이 가능하지 않겠느냐고 물었다. 즉 일본은 평화를 원한다는 것, 전쟁 정세로 세계에 많은 혼란이 있으나 일본은 그것을 얻고 유지하기 위하여 싸울 필요가 없는 그런 평화를 갖고 싶다는 것, 미국은 그러한 생각을 지지한다고 말하고 있다는 것, 그리고 일본은 이 문제에 관하여 미국에 담판을 요구해도 좋으리라는 것이다.\n\n대사는 일본이 평화를 바란다는 데는 조금도 의심이 없다고 말했다. 이어 그는 유화적인 길을 공공연히 뒷받침하는 데 놓인 어려움을 가리켜, 1905년 러시아와의 강화가 이루어진 뒤 일본에서 일어난 민중의 소요를 들었다.\n\n[759면]\n\n국무장관은, 일본 정치가들이 우리 앞에 놓인 문제를 우리가 다루고 있는 정세에 대한 참된 이해를 가지고 다루도록 할 방도가 없겠느냐고 물었다. 여기에는 태평양 지역에 이해관계가 있는 다른 열강의 정부들이 일본과 어떤 통상 협정에 이르도록 북돋울 길을 찾는 문제도 포함된다고 했다. 그는 일본의 인도차이나 진출이 되풀이된다면 군비 확장에 더욱 박차를 가하게 되고 그리하여 자신과 대사가 해 온 모든 일이 허사가 되리라고 지적했다. 그는 만일 미국과 다른 나라들이 처음에는 알맞은 양의 물자를 일본에 공급한다면, 뒷날 일본이 실제로 자국의 평화적 의도를 보여 줄 방도를 찾아내는 경우 그리고 그 정도에 따라, 그 나라들이 일본을 더 충분히 만족시켜 주려는 쪽으로 기울 것이라고 말했다. 그는 일본 쪽의 한 번의 움직임이 우리의 평화 노력을 아주 죽여 버릴 수도 있는 반면, 만일 일본이 점진적인 완화에 만족한다면 다른 나라들을 설득하여 수출 제한을 완화하게 하기는 쉬우리라고 말했다.\n\n구루스 씨는 아무리 잘되어도 통상이 움직이기까지는 얼마간 시간이 걸리리라고 말했다. 국무장관은 그 점을 이해하나, 일본이 자국이 평화의 길에 서약하고 있음을 그 나라들에 납득시킬 수 있기까지는 다른 나라들이 이해하게 하기가 어려우리라고 답했다. 구루스 씨는 어떤 즉각적인 완화가 필요하다고 하면서, 환자를 낫게 하는 데 천 달러가 필요한데 삼백 달러를 내놓는 것으로는 그 목적을 이루지 못하리라고 말했다. 국무장관은, 만일 일본 정부가 요청된 것을 모두 받아야 할 만큼 약하다면 무엇으로도 그것을 구할 수 없을 것 같다고 논평했다.\n\n구루스 씨는 남부 인도차이나에서 병력을 철수하겠다는 일본의 제의가 역방향의 움직임을 일으켜 놓으리라고 말했다.\n\n국무장관은, 일본이 스스로 빠져든 현재의 정세에서 마땅히 도와야 할 만큼 돕고 있지 않으면서 우리가 모든 일을 다 해 주기를 기대하고 있다고 말했다.\n\n구루스 씨는 미국 정부의 생각이 무엇이냐고 물었다.\n\n국무장관은, 일본 측 제안이 미국 정부 앞으로 된 것이기는 하나 다른 나라들이 기여할 뜻이 있는지 알아보는 것이 좋겠다고 생각했으며, 그 나라들이 점진적으로 나아가기를 바란다는 것을 알게 되었다고 답했다. 이 나라들과 일본 사이에 이루어지는 협정의 효과는 일본이 평화의 길을 따라가기로 스스로 서약했음을 보여 줌으로써 전격적인 것이 되리라고 했다.\n\n구루스 씨는 일본이 무엇을 할 수 있겠느냐고 물었다. 국무장관은, 예컨대 자신이 이따금 예외와 단서를 두는 것을 조건으로 하여 평화적 해결에 들어가는 데 동의한다고 말한다면, 평화를 마음에 둔 나라들이 관심을 가지리라고 기대할 수는 없을 것이라고 답했다.\n\n이어 국무장관은, 일본 측 제안이 일본 국내 여론을 정리하는 데 도움이 되도록 하는 잠정적 조치로 의도된 것이며 포괄적 합의의 체결을 내다보는 회담은 계속할 [760면] 의도라는 자신의 이해가 옳은지 물었다. 구루스 씨는 그렇다고 말했다.\n\n구루스 씨는 국무장관에게 더 제안할 것이 있는지 물었다. 국무장관은 마음에 두고 있는 제안은 없으며, 여러 나라가 일본에 어느 정도 양의 수출을 풀어 줄 뜻이 있는지도 알지 못한다고 답했다. 그는 일본이 사태를 매우 어렵게 만들고 있다고 하면서, 만일 일본이 북부든 동부든 남부든 서부든 인도차이나에 병력을 남겨 둔다면 하룻밤 사이에 그것을 이동시킬 수 있을 터이므로 이는 이웃 나라들의 우려를 덜어 주지 못하리라고 말했다. 예컨대 영국은 싱가포르에서 군함 한 척도 옮겨 갈 수 없으리라는 것이었다.\n\n대사는 북부 인도차이나에서 남부 인도차이나로 병력을 옮기는 데는 여러 날이 걸릴 것이라고 논변하고, 일본이 북부 인도차이나에 병력을 두고자 하는 것은 중국과의 해결을 이루기 위함이라고 진술했다. 그는 중국 사건이 해결된 뒤에는 일본이 인도차이나에서 병력을 완전히 빼내겠다고 약속했다고 말했다.\n\n국무장관은 이를 고려할 수 없다는 점을 다시 강조하고, 또한 병력이 인도차이나에 남아 있는 한 불안이 가시지 않을 것이라고 하면서, 일본은 평화적 해결을 이루는 쪽으로 미는 일을 미국이 다 해 주기를 바라고 있다고, 그들은 인도차이나에서 나가야 한다고 논평했다.\n\n구루스 씨는 일본 외상이 그루(Joseph Grew) 대사에게, 양보는 모두 일본 쪽에서 해야 하는 것처럼 우리가 기대하는 듯 보인다고 말했다고 언급했다.\n\n국무장관은 구루스 씨가 7월에 일본이 인도차이나로 들어갔다는 사실을 간과했다고 응수했다. 그는 미국은 처음부터 길 한복판에 머물러 있었고 법과 질서의 길에서 벗어난 것은 일본 쪽이며, 그들이 법에 맞는 길로 돌아오는 데 대가를 받아야 할 까닭은 없다고 덧붙였다.\n\n구루스 씨는 이 나라가 통상조약을 폐기한 일이 일본을 궁지에 몰아넣었다고 말했다.\n\n국무장관은 일본이 스스로를 궁지에 몰아넣었다고 논평했다. 우리는 지난 아홉 해 동안 군국주의가 모두를 좀먹고 있으며 만일 세계가 또 한 번의 전쟁에 빠져든다면 어디에서든 사람들이 얼마 남아나지 않으리라고 설파해 왔다는 것이다. 그는 1934년에 자신이 사이토(斎藤博, Saito) 대사에게 일본이 동아시아에서 패권을 꾀하고 있다고 말했다고 했다. 국무장관은, 히틀러(Adolf Hitler)에게도 평화의 길에 참여하는 것이 그가 필요로 하는 것을 확보해 주리라고 설득하려 애썼다고 덧붙였다. 국무장관은 일본이 이 사태를 넘기는 데 도움이 될 몇 가지 작은 평화적인 일조차 하지 못한다는 것이 딱한 일이라고 말했다.\n\n구루스 씨는 국무장관이 무엇을 뜻하는지 물었다. 국무장관은, 우리 함대의 주력이 태평양에 묶여 있는데도 [761면] 일본은 중국을 돕지 말라고 우리에게 요구하고 있다고 답했다. 그는 우리는 중국을 계속 원조해야 한다고 말했다. 그는 우리가 중국을 돕기 위하여 실제로 하고 있는 일은 아주 적다고 말했다. 대사는 우리의 도의적 영향력이 장제스(蔣介石, Chiang)로 하여금 버티게 하고 있다고 논평했다.\n\n국무장관은 점진적으로 나아감으로써 서른 날이나 마흔 날 안에 평화의 움직임을 시작할 수 있을 터인데도 일본은 원하는 것을 전부 한꺼번에 제안 속에 밀어 넣었다고 말했다. 대사는 일본에는 신속한 해결이 필요하며 그 심리적 가치가 클 것이라고 설명했다.\n\n국무장관은 자신이 낙담하고 있다고 말했다. 다른 나라들의 대표를 불러들였을 때 자신이 참된 기여를 했다고 느꼈으나, 자신이 갈 수 있는 거리에는 한계가 있다는 것이었다. 그럼에도 그는 이 문제가 옳은 방향으로 움직인다면 평화가 전염성을 띠게 되리라고 생각한다고 말했다. 그는 또한 중국 문제를 제안 속에 끼워 넣음으로써 진전을 가로막는 데서 생기는 위험을 지적했다. 일본 측 제안의 그러한 조항을 실행한다면 미국이 일본과 중국 사이의 강화에서 주선(good offices)을 성공적으로 펴는 일이 사실상 영영 막히리라는 것이었다. 그는 이것은 지금 고려할 수 없다고 말했다.\n\n이어 인도차이나의 병력 문제에 관하여 얼마간 더 논의가 이어졌으나 결말에 이르지 못했고, 국무장관은 여전히 철수를 주장했다. 그 뒤 대사는 신속한 해결에 이르고자 하는 일본 정부의 희망으로 되돌아가, 일본 측 제안 가운데 어느 점을 우리가 받아들이겠고 어느 점을 수정하기를 바라는지 말해 줄 수 없겠느냐고 물었다.\n\n국무장관은 자신이 그 짐을 모두 질 수 있는 길은 없다고 강조하면서, 일본 정부가 평화를 설파하는 데 얼마간 시간을 들일 수 있다면 도움이 되리라고 제의했다. 그는 만일 일본이 회답을 받기까지 월요일[주62]까지 기다릴 수 없다면 자신으로서는 어찌할 도리가 없다고 말했다. 관계된 다른 정부들의 대표들이 본국 정부와 협의할 기회를 가진 뒤 그들과 다시 협의해야 할 의무가 자신에게 있기 때문이라는 것이었다. 그는 우리가 최선을 다하고 있다고 되풀이하면서도, 일본이 얼마라도 무언가 하지 못한다면 이야기해 보아야 소용이 없다고 강조했다.\n\n대사는 회답을 얻으려고 국무장관을 지나치게 몰아붙일 뜻이 없음을 밝히고, 면담을 요청할 때마다 국무장관이 언제나 더없이 사려 깊게 만나 주었음을 인정하면서, 일본 측은 월요일까지 기꺼이 기다리겠다고 말했다.\n\n국무장관은, 우리가 마련해 오고 있으며 다른 나라들의 협력을 포함하는 전반적이고 포괄적인 계획을 언젠가 대사와 다루어 볼 생각을 하고 있다고 말했다.\n\n[762면]\n\n대사는, 일본 측은 다른 열강이 뒤에 가입할 수 있는 양자 협정을 우리와 교섭할 것을 생각하고 있다고 말했다.\n\nJ[oseph] W. B[allantine]", "secondary": "[Washington,] November 22, 1941.\n\nThe Japanese Ambassador and Mr. Kurusu called at the Secretary’s apartment by appointment made at the request of the Ambassador. The Secretary said that he had called in the representatives of certain other governments concerned in the Pacific area and that there had been a discussion of the question of whether things (meaning Japanese peaceful pledges, et cetera) could be developed in such a way that there could be a relaxation to some extent of freezing. The Secretary said that these representatives were interested in the suggestion and there was a general feeling that the matter could all be settled if the Japanese could give us some satisfactory evidences that their intentions were peaceful.\n\nThe Secretary said that in discussing the situation with the representatives of these other countries he found that there had arisen in their minds the same kind of misgivings that had troubled him in the course of the conversations with the Japanese Ambassador. He referred to the position in which the Japanese Government had left the Ambassador and the Secretary as they were talking of peace when it made its move last July into Indochina. He referred also to the mounting oil purchases by Japan last Spring when the conversations were in progress, to the fact that he had endured public criticism for permitting those shipments because he did not wish to prejudice a successful outcome to the conversations and to the fact that that oil was not used for normal civilian consumption.\n\n[758면]\n\nThe Secretary went on to say that the Japanese press which is adopting a threatening tone gives him no encouragement and that no Japanese statesmen are talking about a peaceful course, whereas in the American press advocacy of a peaceful course can always get a hearing. He asked why was there not some Japanese statesman backing the two Ambassadors by preaching peace. The Secretary pointed out that if the United States and other countries should see Japan coming along a peaceful course there would be no question about Japan’s obtaining all the materials she desired; that the Japanese Government knows that.\n\nThe Secretary said that while no decisions were reached today in regard to the Japanese proposals he felt that we would consider helping Japan out on oil for civilian requirements only as soon as the Japanese Government could assert control of the situation in Japan as it relates to the policy of force and conquest. He said that if the Ambassador could give him any further assurances in regard to Japan’s peaceful intentions it would help the Secretary in talking with senators and other persons in this country.\n\nMr. Kurusu said it was unfortunate that there had been a special session of the Diet at this time, as the efforts of the Government to obtain public support had brought out in sharp relief the abnormal state of the present temper of the Japanese people who had been affected by four years of war and by our freezing measures.\n\nThe Secretary asked to what extent in the Ambassador’s opinion did the firebrand attitude prevail in the Japanese army. Mr. Kurusu said that it took a great deal of persuasion to induce the army to abandon a position once taken, but that both he and the Ambassador had been pleasantly surprised when the Japanese army acceded to their suggestion in regard to offering to withdraw the Japanese troops from southern Indochina. He said he thought this was an encouraging sign, but that nevertheless the situation was approaching an explosive point.\n\nThe Secretary asked whether it was not possible for a Japanese statesman now to come out and say that Japan wanted peace; that while there was much confusion in the world because of the war situation Japan would like to have a peace which she did not have to fight for to obtain and maintain; that the United States says it stands for such ideas; and that Japan might well ask the United States for a show-down on this question.\n\nThe Ambassador said he did not have the slightest doubt that Japan desired peace. He then cited the popular agitation in Japan following the conclusion of the peace settlement with Russia in 1905, as pointing to a difficulty in the way of publicly backing a conciliatory course.\n\n[759면]\n\nThe Secretary asked whether there was any way to get Japanese statesmen to approach the question before us with real appreciation of the situation with which we are dealing including the question of finding a way to encourage the governments of other powers concerned in the Pacific area to reach some trade arrangement with Japan. He pointed out that Japan’s Indochina move, if repeated, would further give a spurt to arming and thus undo all the work that he and the Ambassador had done. He suggested that if the United States and the other countries should supply Japan with goods in moderate amounts at the beginning those countries would be inclined to satisfy Japan more fully later on if and as Japan found ways in actual practice of demonstrating its peaceful intentions. He said that one move on Japan’s part might kill dead our peace effort, whereas it would be easy to persuade the other countries to relax their export restrictions if Japan would be satisfied with gradual relaxation.\n\nMr. Kurusu said that at best it would take some time to get trade moving. The Secretary replied that he understood this but that it would be difficult to get other countries to understand until Japan could convince those countries that it was committed to peaceful ways. Mr. Kurusu said that some immediate relief was necessary and that if the patient needed a thousand dollars to effect a cure an offer of three hundred dollars would not accomplish the purpose. The Secretary commented that if the Japanese Government was as weak as to need all that had been asked for, nothing was likely to save it.\n\nMr. Kurusu said that Japan’s offer to withdraw its forces from southern Indochina would set a reverse movement in motion.\n\nThe Secretary said that the Japanese were not helping as they should help in the present situation in which they had got themselves but were expecting us to do the whole thing.\n\nMr. Kurusu asked what was the idea of the American Government.\n\nThe Secretary replied that although the Japanese proposal was addressed to the American Government he had thought it advisable to see whether the other countries would contribute and he found that they would like to move gradually. The effect of an arrangement between these countries and Japan would be electrifying by showing that Japan had committed herself to go along a peaceful course.\n\nMr. Kurusu asked what Japan could do. The Secretary replied that if, for example, he should say that he agreed to enter into a peaceful settlement provided that there should be occasional exceptions and qualifications he could not expect to find peaceful-minded nations interested.\n\nThe Secretary then asked whether his understanding was correct that the Japanese proposal was intended as a temporary step to help organize public opinion in Japan and that it was intended to continue [760면] the conversations looking to the conclusion of a comprehensive agreement. Mr. Kurusu said yes.\n\nMr. Kurusu asked whether the Secretary had any further suggestions. The Secretary replied that he did not have in mind any suggestions and that he did not know what amounts of exports the various countries would be disposed to release to Japan. He said that Japan made the situation very difficult, for if Japan left her forces in Indochina, whether in the north, east, south or west, she would be able to move them over night, and that therefore this would not relieve the apprehensions of neighboring countries. The British, for example, would not be able to move one warship away from Singapore.\n\nThe Ambassador argued that it would take many days to move troops from northern Indochina to southern Indochina, and he stated that the Japanese desired the troops in northern Indochina in order to bring about a settlement with China. He said that after the settlement of the China affair Japan promised to bring the troops out of Indochina altogether.\n\nThe Secretary emphasized again that he could not consider this, that also uneasiness would prevail as long as the troops remained in Indochina, and commented that Japan wanted the United States to do all the pushing toward bringing about a peaceful settlement; that they should get out of Indochina.\n\nMr. Kurusu observed that the Japanese Foreign Minister had told Ambassador Grew that we seemed to expect that all the concessions should be made by the Japanese side.\n\nThe Secretary rejoined that Mr. Kurusu had overlooked the fact that in July the Japanese had gone into Indochina. He added that the United States had remained from the first in the middle of the road, that it was the Japanese who had strayed away from the course of law and order, and that they should not have to be paid to come back to a lawful course.\n\nMr. Kurusu said that this country’s denunciation of the commercial treaty had caused Japan to be placed in a tight corner.\n\nThe Secretary observed that Japan had cornered herself; that we had been preaching for the last nine years that militarism was sapping everybody and that if the world were to be plunged into another war there would not be much left of the people anywhere. He said that in 1934 he had told Ambassador Saito that Japan was planning an overlordship in East Asia. The Secretary added that he had tried to persuade Hitler that participation by him in a peaceful course would assure him of what he needed. The Secretary said it was a pity that Japan could not do just a few small peaceful things to help tide over the situation.\n\nMr. Kurusu asked what the Secretary meant. The Secretary replied that the major portion of our fleet was being kept in the Pacific [761면] and yet Japan asked us not to help China. He said we must continue to aid China. He said it was little enough that we were actually doing to help China. The Ambassador commented that our moral influence was enabling Chiang to hold out.\n\nThe Secretary said that a peaceful movement could be started in thirty or forty days by moving gradually, and yet Japan pushed everything it wanted all at once into its proposal. The Ambassador explained that Japan needed a quick settlement and that its psychological value would be great.\n\nThe Secretary said that he was discouraged, that he felt that he had rendered a real contribution when he had called in the representatives of the other countries, but that he could only go a certain distance. He said he thought nevertheless that if this matter should move in the right way peace would become infectious. He pointed also to the danger arising from blocking progress by injecting the China matter in the proposal, as the carrying out of such a point in the Japanese proposal would effectually prevent the United States from ever successfully extending its good offices in a peace settlement between Japan and China. He said this could not be considered now.\n\nThere then ensued some further but inconclusive discussion of the troop situation in Indochina, the Secretary still standing for withdrawal, after which the Ambassador reverted to the desire of the Japanese Government to reach a quick settlement and asked whether we could not say what points in the Japanese proposal we would accept and what points we desired to have modified.\n\nThe Secretary emphasized that there was no way in which he could carry the whole burden and suggested that it would be helpful if the Japanese Government could spend a little time preaching peace. He said that if the Japanese could not wait until Monday [주62] before having his answer there was nothing he could do about it as he was obliged to confer again with the representatives of the other governments concerned after they had had an opportunity to consult with their governments. He repeated that we were doing our best, but emphasized that unless the Japanese were able to do a little there was no use in talking.\n\nThe Ambassador disclaimed any desire to press the Secretary too hard for an answer, agreed that the Secretary had always been most considerate in meeting with the Ambassador whenever an appointment had been requested, and said that the Japanese would be quite ready to wait until Monday.\n\nThe Secretary said he had in mind taking up with the Ambassador sometime a general and comprehensive program which we had been engaged in developing and which involved collaboration of other countries.\n\n[762면]\n\nThe Ambassador said that the Japanese had in mind negotiating a bilateral agreement with us to which other powers could subsequently give their adherence.\n\nJ[oseph] W. B[allantine]", "notes": ["[주62] 1941년 11월 24일."], "warn": false, "pages": ["0824", "0825", "0826", "0827", "0828"], "search": "노무라(野村吉三郎, Nomura) — 주미 일본대사. 원문에는 「일본대사」·「대사」로만 적혀 있다 구루스(来栖三郎, Kurusu) — 특사 헐(Cordell Hull) — 국무장관. 원문에는 「the Secretary 국무장관」으로만 적혀 있다 밸런타인(Joseph W. Ballantine) — 비망록 작성자 그루(Joseph Grew) — 주일 미국대사 도고(東郷茂徳, Togo) — 일본 외상. 원문에는 「일본 외상」으로만 적혀 있다 사이토(斎藤博, Saito) — 전 주미 일본대사 히틀러(Adolf Hitler) 장제스(蔣介石, Chiang) — 원문은 「Chiang」"}, {"id": "d406", "order": 406, "date": "1941-11-24", "group": "D", "eyebrow": "d406 · The Ambassador in Japan (Grew) to the Secretary of State", "title": "주일대사(그루)가 국무장관에게", "badge": null, "list_right": "문서 406", "meta": [{"k": "일자", "v": "1941-11-24"}, {"k": "시각", "v": "발신 오후 8시 / 접수 오후 8시 47분 (Tokyo, November 24, 1941—8 p.m. [Received 8:47 p.m.])"}, {"k": "장소", "v": "Tokyo", "txt": true}, {"k": "전문번호", "v": "1839"}, {"k": "원문출처", "v": "711.94/2470: Telegram", "txt": true}, {"k": "발신", "v": "주일대사 그루(Joseph C. Grew)", "txt": true}, {"k": "수신", "v": "국무장관 헐(Cordell Hull)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 406 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d406"}], "summary": "그루 대사가 도고 외상의 요청으로 만나 그 내용을 보고한다. 도고는 11월 20일 제안의 남부 인도차이나 철병이 일본의 최대한의 양보라 하고, 장제스의 화평 성명과 그에 대한 일본의 호응을 계기로 미국이 대중국 원조를 중단해 주기를 요구한다.", "points": ["도고 외상이 요청하여 이날 오후 그루 대사가 그를 방문했다. 전보는 헐 국무장관과 웰스 국무차관에게 보고하는 형식이다.", "도고는 11월 20일 국무부에 제출된 일본 측 제안과, 11월 22일 노무라 대사·구루스 사부로가 국무장관을 방문했을 때의 대화를 대사가 알고 있는지 물었다. 대사는 제안은 보고받았으나 11월 22일 대화는 아직 듣지 못했다고 답했다.", "도고는 헐이 다른 이해관계국 정부 대표들과 협의해 왔으며 남부 인도차이나 일본군 철수 항목이 만족스럽지 못하다고 말했음을 알렸다.", "도고는 북부 인도차이나 주둔군은 중국 사변의 종결을 앞당기려 파견된 것이므로 지금은 철수할 수 없고, 프랑스령 인도차이나 주둔 일본군을 북부로 철수하는 것이 어떻든 일본이 할 수 있는 최대한의 양보라고 말했다.", "도고는 중국 사변 처리에 관한 미일 간 견해차가 교섭 타결의 심각한 장애 가운데 하나임이 부정할 수 없다고 논평했다.", "장제스가 일본과 화평을 회복하고자 한다는 성명을 낸다면 일본 정부도 같은 취지의 성명으로 응답하고 즉시 중국과 교섭에 들어갈 용의가 있다고 했다. 다만 그때 미국은 중일 화평 회복에 해로운 행동을 삼간다는 양해가 따른다.", "도고는 화평 회복을 방해하는 미국의 활동을 중지한다는 양해에 이르지 않고서는 교섭을 성공적으로 매듭지을 수 없다고 단언했고, 그 중지 시점은 장제스의 성명과 일본의 긍정적 호응 직후 중일 교섭이 시작되는 때라고 밝혔다.", "도고는 11월 20일 제안을 자신이 입안하고 책임진 것이며 미국의 평화 정책에 협력하려는 일본의 의사 표시로 제출했다고 알렸다.", "그루의 논평: 만일 일본 정부가 중일 화평 교섭 개시 이전의 대중국 원조 중단을 기대하지 않는 것이라면, 일본 제안의 제4항(중국 사변 해결을 위한 일본의 노력에 미국이 간섭하지 않는다는 항)은 대체로 체면을 세우기 위한 것으로 보인다."], "primary": "[요지]\n\n도쿄, 1941년 11월 24일 — 오후 8시.\n[접수 오후 8시 47분[주63]]\n\n1839. 대사는 도고(東郷茂徳, Togo) 외상의 요청으로 오늘 오후 그를 방문한 일에 관하여 헐(Cordell Hull) 국무장관과 웰스(Sumner Welles) 국무차관에게 다음과 같이 보고한다.\n\n(1)\n\n외상은 대사에게, 11월 20일 국무부에 제출된 일본 측 제안을 알고 있는지, 그리고 11월 22일 일본 대사와 구루스 사부로(来栖三郎, Saburo Kurusu)가 국무장관을 방문하여 그 제안을 논의했을 때의 대화 내용을 통보받았는지 물었다. 이에 대해 대사는 일본 측 제안은 자기에게 보고되었으나 11월 22일의 대화는 아직 보고받지 못했다고 진술했다. 그러자 도고는 대사에게, 헐 국무장관이 다른 이해관계국 정부 대표들과 협의해 오고 있으며 일본군의 남부 인도차이나 철수에 관한 항목은 만족스럽지 못하다고 말했다고 알렸다. 도고는 이어서, 일본은 태평양의 평화를 유지하려는 진지한 염려에서, 그리고 현재의 어려운 정세에서 벗어날 길을 찾으려는 근심에서 그 제안을 내놓았다고 말했다. 도고는 북부 인도차이나의 병력은 중국 사변의 종결을 앞당기기 위해 그곳에 파견된 것이므로 일본은 지금 그 병력을 철수할 수 없다고 말했다. 외상은 미국과 영국이 남부 인도차이나의 일본군 주둔을 영미의 안전에 대한 위협으로 보았기 때문에 자산 동결령을 시행했음을 상기시켰다. 그는 일본군을 북부 인도차이나로 철수시키는 것은 그가 「교섭」이라고 부른 미국과의 교섭을 성공적으로 타결하고자 하는 일본의 의사를 증명하는 것이라고 말했다. 도고는 현재 프랑스령 인도차이나에 주둔한 일본군을 그 북부로 철수시키는 것이 어떻든 일본이 할 수 있는 최대한의 양보라고 말했다.\n\n(2)\n\n외상은 이어서, 현재의 교섭을 성공적으로 매듭짓는 데 있어 심각한 장애 가운데 하나는 중국 사변의 해결에 관한 미국과 일본의 [763면] 견해차임이 부정할 수 없다고 논평했다. 도고는 얼마 전 루스벨트(Franklin D. Roosevelt) 대통령이 일본 대사에게, 만일 장제스(蔣介石, Chiang Kai-shek) 총통이 일본과 평화를 회복하고 싶다는 성명을 낸다면 일본의 태도가 어떠하겠느냐고 물었던 일을 상기시켰다. 그때 일본 정부는 미국이 중일 직접 교섭의 길을 열어 주는 「소개자」로 나서 준다면 기쁘겠다고 답했다는 것이다. 이어서 도고 외상은, 만일 장제스가 제안된 대로 성명을 낸다면 일본 정부의 응답도 같은 취지의 성명이 될 것이라고 말했다. 그러면 일본은 즉시 중국과 교섭에 들어갈 용의가 있으며, 다만 그때 미국은 중국과 일본 사이의 평화 회복에 해로운 행동을 삼간다는 양해가 따른다는 것이다. 도고는 최근의 일본 측 제안을 받아들이지 않는 이유로 국무장관이 든 근거들을 이해할 수 없다고 진술했다. 도고는 지금까지 일본이 치른 희생을 떠올리면서, 평화 회복을 방해하는 활동을 미국이 중지한다는 데 관하여 양해에 이르지 않고서는 교섭을 성공적으로 매듭짓는 일이 가능하지 않다고 단언했다. 이 대목에서 대사는 외상의 말을 가로막고, 일본이 그러한 미국의 활동이 어느 시점에 중지되기를 기대하는지 자기로서는 분명하지 않다고 말했다. 도고는 루스벨트 대통령의 제의가 현실이 되기를 바란다고 답했다. 외상은, 위에 개설한 대로 장제스 총통이 성명을 내고 일본이 이에 긍정적으로 응답한 직후 중국과 일본이 교섭을 시작하게 되는 바로 그때에 자기가 말한 활동이 중지되기를 일본이 기대한다는 점을 분명히 해 두고자 했다. 도고는 자기가 군사 문제에는 밝지 못하다고 하면서도, 평화 회복을 바라보는 교섭이 시작되면 통상 적대 행위는 곧 그칠 것으로 보이며, 그리하여 논리적으로는 중국 군대를 돕기 위한 미국의 행동이 필요 없게 되는 상황이 오게 될 것이라고 말했다.\n\n(3)\n\n도고는 대사에게, 11월 20일 미국 정부에 제출된 일본 측 제안을 입안하고 그에 대한 책임을 진 사람이 바로 자신이라고 알렸다. 이 제안은 미국의 평화 정책에 협력하고자 하는 일본의 의사를 나타내는 것으로서 제출되었다. 도고는 대사에게, 앞으로의 일본 정책도 바로 그 협력의 정신에서 나올 것이며 평화적 목표를 추구하면서 점점 더 명확하게 수행될 것이라고 확언했다.\n\n(4)\n\n대사는 자기가 외상에게 한 유일한 진술은 그의 소견을 미국 정부에 즉시 전달하겠다는 확언뿐이었다고 보고한다.\n\n(5)\n\n논평으로서, 대사는 만일 일본 정부가 중일 [764면] 평화 교섭 개시에 앞서 미국의 대중국 원조가 중지되기를 기대하는 것이 아니라면, 일본 측 제안의 제4항(즉 중국 사변을 해결하려는 일본의 노력에 미국이 간섭하지 않는다는 항)은 대체로 체면을 세우기 위한 것으로 보인다는 견해를 내놓는다.\n\n그루(Grew)", "secondary": "[Substance]\n\nTokyo, November 24, 1941—8 p.m.\n[Received 8:47 p.m. [주63] ]\n\n1839. The Ambassador reports for Secretary Hull and Under Secretary Welles concerning his call on Foreign Minister Togo this afternoon at the request of the latter as follows:\n\n(1)\n\nThe Foreign Minister asked the Ambassador if he was familiar with the Japanese proposal which was presented on November 20 to the Department and if he was informed of the conversation in substance on November 22 when the proposal was discussed during a call on the Secretary of State by the Japanese Ambassador and Saburo Kurusu. In reply the Ambassador stated that the Japanese proposal had been reported to him, though not the conversation of November 22 as yet. Togo then informed the Ambassador that Secretary Hull had said he had been consulting with the representatives of other interested Governments and the item respecting withdrawal from Southern Indochina of Japanese troops was not satisfactory. Togo continued that Japan made the offer out of sincere solicitude to maintain peace in the Pacific and from anxiety for a way to be found out of the existing difficult situation. Togo said Japan could not withdraw its forces at this time from Northern Indochina because they were despatched there to hasten the China affair’s conclusion. The Minister recalled that the United States and Great Britain had instituted the freezing orders because the stationing in Southern Indochina of Japanese troops was looked upon as a threat to British and American security. He remarked that withdrawing Japanese troops to Northern Indochina evidences Japanese desire for the promotion of a successful conclusion of what he called “negotiations” with the United States. Togo said the withdrawal of Japanese troops at present stationed in French Indochina to the northern part is in any event the maximum concession Japan can make.\n\n(2)\n\nThe Minister proceeded to comment that one of the serious obstacles to concluding the present negotiations successfully is undeniably the divergence of views of the United States and Japan [763면] regarding settlement of the China affair. Togo recalled President Roosevelt’s query sometime ago of the Japanese Ambassador as to what Japan’s attitude would be should General Chiang Kai-shek issue a statement of desire to restore peace with Japan, whereupon the Japanese Government answered that it would be glad for the United States to act as an “introducer” to open the way for direct Japanese-Chinese negotiations. Minister Togo then said if Chiang Kai-shek made a statement as suggested, the Japanese Government’s response would be a statement in similar vein. Japan would be ready thereupon at once to enter into negotiations with China, with the understanding that then the United States would refrain from action prejudicial to restoring peace between China and Japan. Togo stated his inability to appreciate the reasons given by the Secretary of State for not accepting the recent Japanese proposal. Remembering Japan’s sacrifices to date, Togo declared it is not possible successfully to conclude the negotiations without reaching an understanding regarding the cessation by the United States of activities which obstruct a restoration of peace. At this point the Ambassador interrupted the Foreign Minister to say it was not clear to him at what point Japan expects such American activities to cease. Togo replied that he would like President Roosevelt’s suggestion to become a reality. The Foreign Minister wished it to be made clear that Japan expects the cessation of the activities to which he referred as soon as China and Japan begin negotiations, which would occur immediately after General Chiang Kai-shek makes the statement outlined above and after an affirmative response thereto by Japan. Togo said he was unfamiliar with military matters, but it appeared to him that normally hostilities would cease as soon as negotiations were started looking to peace being restored, thereby logically bringing about a situation when it would be unnecessary to have American action which is calculated to aid Chinese military forces.\n\n(3)\n\nTogo informed the Ambassador that he was the one who formulated and became responsible for the Japanese proposal presented on November 20 to the United States Government. This proposal was presented as a manifestation of Japan’s desire for cooperation with the American policy of peace. Togo assured the Ambassador that the same cooperative spirit is to prompt Japan’s future policy, which is to be conducted with growing clarity in pursuit of peaceful aims.\n\n(4)\n\nThe Ambassador reports that the only statement he made to the Foreign Minister was to assure him that his observations would be promptly transmitted to the United States Government.\n\n(5)\n\nBy way of comment, the Ambassador offers the suggestion that, in case the Japanese Government does not expect suspension of United States aid to China prior to the commencement of Chinese-Japanese [764면] peace negotiations, point 4 in the Japanese proposal (i. e., non-interference by the United States in the efforts of Japan to settle the China affair) would appear to be largely to save face.\n\nGrew", "notes": ["[주63] 두 부분으로 나뉜 전보."], "warn": false, "pages": ["0829", "0830"], "search": "그루(Joseph C. Grew) — 주일 미국대사, 발신자 도고(東郷茂徳, Togo) — 일본 외상 헐(Cordell Hull) — 국무장관 웰스(Sumner Welles) — 국무차관 노무라(野村吉三郎, Nomura) — 주미 일본대사(본문에는 「일본 대사」로 표기) 구루스 사부로(来栖三郎, Saburo Kurusu) — 특사 루스벨트(Franklin D. Roosevelt) — 대통령 장제스(蔣介石, Chiang Kai-shek) — 원문 표기 'General Chiang Kai-shek'"}, {"id": "d407", "order": 407, "date": "1941-11-26", "group": "A", "eyebrow": "d407 · Memorandum of a Conversation", "title": "회담 비망록", "badge": null, "list_right": "문서 407", "meta": [{"k": "일자", "v": "1941-11-26"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2504", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 407 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d407"}], "summary": "헐 국무장관이 노무라 대사와 구루스에게 미일 협정안의 개요와 설명용 구두 성명을 건넨다. 구루스는 그것이 사실상 끝을 뜻하는 것으로 해석될 수 있다고 말한다. 그 회담의 기록이다.", "points": ["국무장관은 두 일본인에게 각각 「미국과 일본 사이의 협정 기초안 개요(an outline of a proposed basis of an agreement)」와 설명용 구두 성명의 사본을 건넸다. 원문은 이 문서를 최후통첩이라 부르지 않는다.", "구루스는 이것이 자기들의 잠정협정(modus vivendi) 제안에 대한 미국의 회답이냐고 물었고, 헐은 미국과 일본 양쪽 여론의 소란과 혼란 때문에 그렇게 다룰 수밖에 없었다고 답했다.", "헐은 제안된 협정이 재정 협력의 실제적 조치를 가능하게 하겠지만 오해를 살까 봐 개요에는 언급하지 않았다고 말했다.", "구루스는 원칙 성명에 스팀슨 독트린이 되풀이되어 있다고 지적하고, 다자간 불가침 조약안에 반대하며 영대차지 사건의 헤이그 재판 재정 등 일본의 쓰라린 국제기구 경험을 들었다.", "구루스는 협정안 제(3)항과 제(4)항을 본국 정부가 고려할 수 있으리라 보지 않는다며, 일본이 장제스에게 모자를 벗고 그를 승인하기를 미국이 기대한다면 일본은 동의할 수 없고 어떤 협정도 가능해 보이지 않는다고 말했다.", "헐은 석유 문제를 꺼내며, 석유가 일본으로 자유로이 가도록 허용하면 자기가 린치를 당할 뻔할 만큼 여론이 격앙되어 있다고 말했다.", "노무라가 대통령을 만날 수 없겠느냐고 묻자, 헐은 대통령이 언제든 기꺼이 만나 줄 것을 의심치 않는다고 답했다.", "구루스가 미국의 회답이 사실상 끝을 뜻하는 것으로 해석될 수 있다고 느낀다며 잠정협정에 관심이 없느냐고 묻자, 헐은 그것을 타진해 보았고 자기로서는 타진에 최선을 다했다고만 답했다."], "primary": "[워싱턴,] 1941년 11월 26일.\n\n일본 대사와 구루스(来栖三郎, Kurusu) 씨가 약속에 따라 국무부를 방문했다. 국무장관은 두 일본인에게 각각 미국과 일본 사이의 협정 기초안 개요[주64]와 설명용 구두 성명[주65]의 사본을 건넸다.\n\n일본 측이 문서를 읽고 난 뒤, 구루스 씨는 이것이 잠정협정(modus vivendi)에 관한 자기들의 제안에 대한 우리 회답이냐고 물었다. 국무장관은, 미국과 일본 양쪽 여론에 소란과 혼란이 너무 심하기 때문에 우리로서는 그 제안을 그렇게 다룰 수밖에 없었다고 답했다. 그는 두 일본인에게, 미국에도 일본 정부와 마찬가지로 상대해야 할 정치 정세가 있음을 상기시켰고, 최근 도쿄에서 나오고 있는 호전적인 성명들을 언급하며 그것이 이 나라 여론에 자연스러운 반작용을 일으켜 왔다고 말했다. 그는 우리가 제안한 협정이 재정 협력의 실제적 조치를 가능하게 하겠지만, 그것이 오해를 불러일으킬까 우려하여 개요에는 언급하지 않았다고 말했다. 그는 또한 앞선 회담들에서 이민 문제를 해결하는 것이 자기 포부였음을 대사에게 알렸으나 정세 때문에 지금까지 그 포부를 실현하지 못했다는 사실도 언급했다.\n\n구루스 씨는 제안된 협정에 관하여 이런저런 깎아내리는 논평을 내놓았다. 그는 우리 원칙 성명에 스팀슨 독트린[주66]이 되풀이되어 있음을 지적했다. 그는 다자간 불가침 조약에 관한 제안에 반대하면서 국제기구에 관한 일본의 쓰라린 경험을 언급했고, 영대차지(永代借地) 문제에서 헤이그 재판소가 일본에 불리하게 내린 재정(裁定) 사건[주67]을 들었다. 그는 이어서 워싱턴 회의 조약들이 중국에 그릇된 생각을 심어 주었고, 중국이 그것을 이용하여 일본의 권리를 무시하며 뽐내 왔다고 말했다. 그는 제안된 협정의 제(3)항과 제(4)항을 자기 정부가 어떻게 고려할 수 있을지 모르겠으며, 만일 미국이 [765면] 일본으로 하여금 장제스(蔣介石, Chiang Kai-shek)에게 모자를 벗고 그를 승인하겠다고 제의하기를 기대한다면 일본은 동의할 수 없다고 말했다. 그는 이것이 미국 정부의 생각이라면 어떠한 협정도 가능하리라고 보지 않는다고 말했다.\n\n국무장관은 이 문제를 풀어낼 수는 없겠느냐고 물었다.\n\n구루스 씨는, 자기들이 우리 회답을 본국 정부에 보고하면 그 정부가 두 손을 들어 버릴 공산이 크다고 말했다. 그는 이것이 구속력 없는 잠정 제안(tentative proposal without commitment)임을 지적하고, 여기서 그 내용을 더 비공식적으로 논의하기 전에는 본국 정부에 회부하지 않는 편이 나을지도 모르겠다고 제의했다.\n\n국무장관은 그들이 더 논의하기 전에 문서를 주의 깊게 검토하고 싶어 할 수도 있겠다고 말했다. 그는 여론이 열변에 시달린 나머지 불안해지지 않도록 우리가 최선을 다하고 있다고 거듭 말했다. 그는 언론에 나온 온갖 말들에 비추어 볼 때 우리 제안이 일본 측 제안에 관하여 현 단계에서 우리가 나아갈 수 있는 한계라고 설명했다. 여론에 혼란이 너무 심해 어느 정도 정리가 필요했으며, 여론이 균형 감각을 잃어버린 단계에 이르렀으므로 관련된 본질적 사항 하나하나에 대해 규정을 둠으로써 우리 입장의 완전한 그림을 제시하는 문서를 작성할 필요가 있었다는 것이다.\n\n이어서 국무장관은 석유 문제를 언급했다. 그는 그 문제에 대한 여론의 감정이 너무나 첨예해서, 만일 자기가 석유를 일본으로 자유로이 가게 허용한다면 거의 린치를 당할지도 모른다고 말했다. 그는 만일 일본이 인도차이나를 군대로 채운다면 남쪽과 서쪽의 나라들에 대한 위협이라는 점에서 앞으로 무슨 일이 있을지 우리 국민이 알 수 없게 된다고 지적했다. 그는 일본 측에, 인도차이나에 인접한 나라들에 그토록 많은 병력을 묶어 둠으로써 그들이 우리에게 얼마나 엄청난 손해를 끼치고 있는지 그들 자신은 모른다고 상기시켰다. 그는 우리가 무엇보다도 우리의 항구적인 장래를 도모하고 있으며, 인도차이나 주둔 일본군 문제는 우리의 직접적 이해에 영향을 미친다고 설명했다.\n\n구루스 씨는 일본이 왕징웨이(汪精衞, Wang Ching-wei)에 대한 지지를 포기하기 어렵다는 이야기로 되돌아갔다. 국무장관은 장제스가 중국에서 민족정신을 이끌어 내는 데 두드러진 기여를 했다고 지적하고, 난징 정권은 세계에 인상을 남길 만한 방식으로 스스로를 내세운 적이 없다는 견해를 밝혔다. 구루스 씨는 장제스에 관해 국무장관이 한 말에는 동의했으나, 난징 정권의 위상 문제는 견해의 문제라고 말했다. 이 점에 관한 그의 논변은 다른 여러 점에 관한 논변과 마찬가지로 그럴듯할 뿐 설득력이 없었다.\n\n대사는 이 기회에, 굳은 신념을 지닌 정치가가 때로는 대중 사이에서 공감자를 얻지 못하는 일이 있다고, [766면] 오직 현명한 사람만이 멀리 앞을 내다볼 수 있고 때로는 순교를 당하기도 한다고, 그러나 인생의 길이는 짧으니 사람은 자기 의무를 다할 수 있을 뿐이라고 말했다. 이어서 대사는 다른 가능성은 없는지, 그리고 자기들이 대통령을 만날 수는 없는지 물었다.\n\n국무장관은 대통령이 언제든 기꺼이 그들을 만나 주리라는 것을 의심치 않는다고 답했다.\n\n구루스 씨는, 자기들의 제안에 대한 우리 회답이 사실상 끝을 뜻하는 것으로 해석될 수 있다고 느낀다고 말하면서, 우리가 잠정협정에 관심이 없느냐고 물었다.\n\n국무장관은 그것을 타진해 보았다고 답했다. 구루스 씨는 다른 열강이 동의하지 않아서 그런 것이냐고 물었으나, 국무장관은 다만 자기가 타진하는 방면에서 최선을 다했다고만 답했다.\n\n대사는 일어나면서 공표 문제를 꺼냈다. 국무장관은 내일 언론에 정세를 어느 정도 알릴 생각을 하고 있다고 답하면서 대사의 생각은 어떠냐고 물었다. 대사는 미국 측 제안에 관하여 국무장관이 원하는 바를 공표할 권리를 문제 삼고 싶지는 않다고 말했다. 대사는 목요일에 와카스기(若杉要, Wakasugi) 씨가 밸런타인(Joseph W. Ballantine) 씨를 방문하여 더 자세한 사항을 논의하게 하고 싶다고 말했다.\n\n[Joseph W.] Ballantine", "secondary": "[Washington,] November 26, 1941.\n\nThe Japanese Ambassador and Mr. Kurusu called by appointment at the Department. The Secretary handed each of the Japanese copies of an outline of a proposed basis of an agreement between the United States and Japan [주64] and an explanatory oral statement. [주65]\n\nAfter the Japanese had read the documents, Mr. Kurusu asked whether this was our reply to their proposal for a modus vivendi. The Secretary replied that we had to treat the proposal as we did, as there was so much turmoil and confusion among the public both in the United States and in Japan. He reminded the Japanese that in the United States we have a political situation to deal with just as does the Japanese Government, and he referred to the fire-eating statements which have been recently coming out of Tokyo, which he said had been causing a natural reaction among the public in this country. He said that our proposed agreement would render possible practical measures of financial cooperation, which, however, were not referred to in the outline for fear that this might give rise to misunderstanding. He also referred to the fact that he had earlier in the conversations acquainted the Ambassador of the ambition that had been his of settling the immigration question but that the situation had so far prevented him from realizing that ambition.\n\nMr. Kurusu offered various depreciatory comments in regard to the proposed agreement. He noted that in our statement of principles there was a reiteration of the Stimson doctrine. [주66] He objected to the proposal for multilateral non-aggression pacts and referred to Japan’s bitter experience of international organizations, citing the case of the award against Japan by the Hague tribunal in the Perpetual Leases matter. [주67] He went on to say that the Washington Conference Treaties had given a wrong idea to China, that China had taken advantage of them to flaunt Japan’s rights. He said he did not see how his Government could consider paragraphs (3) and (4) of the proposed agreement and that if the United States should expect [765면] that Japan was to take off its hat to Chiang Kai-shek and propose to recognize him Japan could not agree. He said that if this was the idea of the American Government he did not see how any agreement was possible.\n\nThe Secretary asked whether this matter could not be worked out.\n\nMr. Kurusu said that when they reported our answer to their Government it would be likely to throw up its hands. He noted that this was a tentative proposal without commitment, and suggested that it might be better if they did not refer it to their Government before discussing its contents further informally here.\n\nThe Secretary suggested that they might wish to study the documents carefully before discussing them further. He repeated that we were trying to do our best to keep the public from becoming uneasy as a result of their being harangued. He explained that in the light of all that has been said in the press, our proposal was as far as we would go at this time in reference to the Japanese proposal; that there was so much confusion among the public that it was necessary to bring about some clarification; that we have reached a stage when the public has lost its perspective and that it was therefore necessary to draw up a document which would present a complete picture of our position by making provision for each essential point involved.\n\nThe Secretary then referred to the oil question. He said that public feeling was so acute on that question that he might almost be lynched if he permitted oil to go freely to Japan. He pointed out that if Japan should fill Indochina with troops our people would not know what lies ahead in the way of a menace to the countries to the south and west. He reminded the Japanese that they did not know what tremendous injury they were doing to us by keeping immobilized so many forces in countries neighboring Indochina. He explained that we are primarily out for our permanent futures, and the question of Japanese troops in Indochina affects our direct interests.\n\nMr. Kurusu reverted to the difficulty of Japan’s renouncing its support of Wang Ching-wei. The Secretary pointed out that Chiang Kai-shek had made an outstanding contribution in bringing out national spirit in China and expressed the view that the Nanking regime had not asserted itself in a way that would impress the world. Mr. Kurusu agreed with what the Secretary had said about Chiang, but observed that the question of the standing of the Nanking regime was a matter of opinion. His arguments on this as well as on various other points were specious, and unconvincing.\n\nThe Ambassador took the occasion to observe that sometimes statesmen of firm conviction fail to get sympathizers among the public; [766면] that only wise men could see far ahead and sometimes suffered martyrdom; but that life’s span was short and one could only do his duty. The Ambassador then asked whether there was no other possibility and whether they could not see the President.\n\nThe Secretary replied that he had no doubt that the President would be glad to see them at any time.\n\nMr. Kurusu said that he felt that our response to their proposal could be interpreted as tantamount to meaning the end, and asked whether we were not interested in a modus vivendi.\n\nThe Secretary replied that we had explored that. Mr. Kurusu asked whether it was because the other powers would not agree; but the Secretary replied simply that he had done his best in the way of exploration.\n\nThe Ambassador when rising to go raised the question of publicity. The Secretary replied that he had it in mind to give the press something of the situation tomorrow, and asked what the Ambassador thought. The Ambassador said that they did not wish to question the Secretary’s right to give out what he desired in regard to the American proposal. The Ambassador said he would like to have Mr. Wakasugi call on Mr. Ballantine on Thursday to discuss further details.\n\n[Joseph W.] Ballantine", "notes": ["[주64] 뒤, 768면.", "[주65] 바로 다음 문서.", "[주66] 1932년 1월 7일 정오, 주일대사 앞 전보 제7호, 제1권 76면 참조.", "[주67] Foreign Relations, 1905, 692면 참조."], "warn": false, "pages": ["0831", "0832"], "search": "노무라(野村吉三郎, Nomura) — 주미 일본대사(본문에는 「일본 대사」·「대사」로 표기) 구루스(来栖三郎, Kurusu) — 특사 헐(Cordell Hull) — 국무장관(본문에는 「국무장관」으로만 표기) 밸런타인(Joseph W. Ballantine) — 비망록 작성자 와카스기(若杉要, Wakasugi) — 주미 일본대사관 공사 장제스(蔣介石, Chiang Kai-shek) — 충칭 국민정부 지도자 왕징웨이(汪精衞, Wang Ching-wei) — 난징 정권 수반 루스벨트(Franklin D. Roosevelt) — 대통령(본문에는 「대통령」으로만 표기) 스팀슨(Henry L. Stimson) — 스팀슨 독트린으로만 언급"}, {"id": "d408", "order": 408, "date": "1941-11-26", "group": "B", "eyebrow": "d408 · Oral Statement Handed by the Secretary of State to the Japanese Ambassador (Nomura) on November 26, 1941", "title": "1941년 11월 26일 국무장관이 일본대사 노무라에게 건넨 구두 성명", "badge": null, "list_right": "문서 408", "meta": [{"k": "일자", "v": "1941-11-26"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2504", "txt": true}, {"k": "발신", "v": "국무장관 헐(Cordell Hull)", "txt": true}, {"k": "수신", "v": "일본대사 노무라(野村吉三郎, Nomura)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "구두 성명"}], "links": [{"k": "FRUS", "text": "문서 408 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d408"}], "summary": "미국 정부가 11월 20일 일본 측의 잠정협정(모두스 비벤디) 제안을 근본 원칙과 충돌한다는 이유로 받아들이지 않고, 그 대신 태평양 전역을 포괄하는 「광범하되 단순한 해결안」을 일본 정부의 고려에 부친다고 밝힌 구두 성명이다. 이른바 「헐 노트」에 붙어 있다.", "points": ["원문은 이 문서를 「구두 성명(Oral Statement)」이라 부르고, 함께 건넨 문서를 「태평양 전역을 포괄하는 광범하되 단순한 해결안의 계획(a plan of a broad but simple settlement)」이라 부른다. 최후통첩(ultimatum)이라는 낱말도, 각서(memorandum)라는 낱말도 쓰이지 않는다.", "그 계획은 「우리의 앞으로의 회담 중에 정리해 나갈 것으로 이 정부가 상정하는 계획의 한 가지 실제적 예시」로서 「일본 정부의 고려에 부치는(offers for the consideration)」 것이라고 명시한다. 요구가 아니라 제시의 형식이다.", "미일 회담의 기초 원칙 넷을 다시 열거한다: 각국 영토 보전과 주권의 불가침, 타국 내정 불간섭, 통상 기회·대우의 균등을 포함한 평등, 분쟁의 방지·평화적 해결과 평화적 방법에 의한 국제 상황 개선을 위한 국제 협력·조정에의 의거.", "일본대사가 최근, 평화적 해결을 향한 회담이 계속되는 동안 효력을 갖는 잠정협정(temporary modus vivendi)이 합의된다면 회담 성공에 유리한 분위기 조성에 도움이 되리라고 말했음을 확인한다.", "11월 20일 일본대사가 국무장관에게 전달한 제안(을안)에는, 미국 정부가 보기에 「검토 중인 전반적 해결의 일부를 이루며 양국 정부가 각기 이를 지키기로 선언한 근본 원칙과 충돌하는」 요소들이 있다고 밝힌다.", "그러한 제안의 채택은 태평양 지역에서 법·질서·정의 아래 평화를 확보한다는 궁극적 목표에 기여할 것 같지 않다고 판단하고, 근본 원칙의 실제적 적용에 관한 견해 차이를 풀기 위한 노력을 더 기울일 것을 제의한다.", "제시하는 계획은 1941년 6월 21일 미국 초안과 9월 25일 일본 초안 사이의 간극을 메우려는 시도이며, 포괄적 태평양 해결의 바탕에 놓인 본질적 문제들에 새롭게 접근하는 것이라고 설명한다.", "이로써 양국 정부 사이의 의사 합치를 향한 진전이 촉진되기를 바란다는 말로 끝맺는다."], "primary": "워싱턴, 1941년 11월 26일.\n\n미합중국 정부와 일본국 정부의 대표들은 지난 수개월 동안, 평화·법과 질서·국가 간의 공정한 거래라는 원칙에 입각하여 태평양 전역에 관계되는 문제들을 가능하다면 타결짓기 위한 목적으로 비공식적이고 탐색적인 회담을 진행하여 왔다. 이 원칙들에는 다음이 포함된다. 각 국가 및 모든 국가의 영토 보전과 주권의 불가침이라는 원칙, 타국의 내정에 간섭하지 아니한다는 원칙, 통상상의 기회 및 대우의 균등을 포함하는 평등의 원칙, 그리고 분쟁의 방지와 평화적 해결을 위하여, 또한 평화적인 방법과 절차에 의한 국제 상황의 개선을 위하여 국제적 협력과 조정에 의거한다는 원칙이다.\n\n우리의 논의에 있어서 태평양 전역을 포괄하는 평화적 해결의 기초를 이루는 일반 원칙에 관하여 어느 정도의 진전이 이루어졌다고 믿는다. 최근 [767면] 일본대사는 다음과 같이 진술하였다. 즉 일본 정부는 태평양 지역의 포괄적이고 평화적인 해결을 지향하는 회담을 계속하기를 희망하고 있다는 것, 그리고 태평양에서의 평화적 해결을 바라보는 회담이 계속되는 동안 효력을 갖는 잠정협정(temporary modus vivendi)이 합의될 수 있다면 그것이 회담의 성공적 결말에 유리한 분위기를 조성하는 데 도움이 되리라는 것이다. 11월 20일 일본대사는 일본국 정부와 미합중국 정부가 각기 취할 잠정적 조치에 관한 제안을 국무장관에게 전달하였는바, 이 조치들은 위에 밝힌 목적을 달성하도록 고안된 것으로 이해된다.\n\n미합중국 정부는 태평양 지역에서의 평화와 안정의 증진 및 유지에 기여하기를, 또한 태평양 전역에 걸친 광범한 규모의 평화 계획을 마련하는 것을 지향하여 일본 정부와의 논의를 계속할 모든 기회를 제공하기를 지극히 간절히 바란다. 11월 20일 일본대사가 제시한 제안에는, 이 정부의 의견으로는, 검토 중인 전반적 해결의 일부를 이루며 양국 정부가 각기 이를 준수하기로 선언한 바 있는 근본 원칙들과 충돌하는 몇 가지 요소가 담겨 있다. 미합중국 정부는 그러한 제안의 채택이 태평양 지역에서 법과 질서와 정의 아래 평화를 확보한다는 궁극적 목표에 기여할 것 같지 아니하다고 믿으며, 앞서 말한 근본 원칙들의 실제적 적용에 관한 우리의 견해 차이를 해소하기 위하여 더 한층의 노력이 기울여질 것을 제의한다.\n\n이러한 목적을 염두에 두고 미합중국 정부는, 이 정부가 우리의 앞으로의 회담 중에 마련해 나갈 것으로 상정하는 계획의 한 가지 실제적 예시로서, 태평양 전역을 포괄하는 광범하되 단순한 해결안의 계획을 일본 정부의 고려에 부치는 바이다.\n\n거기에 제시된 계획은, 포괄적인 태평양 해결의 바탕에 놓여 있는 본질적 문제들에 새롭게 접근함으로써 1941년 6월 21일자 우리의 초안과 9월 25일자 일본 측 초안 사이의 간극을 메우려는 노력을 나타낸다. 이 계획에는, 가치 있는 국제 관계의 유일한 건전한 기초를 이룬다고 우리가 회담에서 합의한 바 있는 근본 원칙들의 실제적 적용을 다루는 규정들이 담겨 있다. 우리는 이러한 방식으로 양국 정부 사이에 의사의 합치에 이르는 진전이 촉진될 수 있기를 희망한다.\n\n[768면]", "secondary": "Washington, November 26, 1941.\n\nThe representatives of the Government of the United States and of the Government of Japan have been carrying on during the past several months informal and exploratory conversations for the purpose of arriving at a settlement if possible of questions relating to the entire Pacific area based upon the principles of peace, law and order and fair dealing among nations. These principles include the principle of inviolability of territorial integrity and sovereignty of each and all nations; the principle of non-interference in the internal affairs of other countries; the principle of equality, including equality of commercial opportunity and treatment; and the principle of reliance upon international cooperation and conciliation for the prevention and pacific settlement of controversies a
