y the Japanese Ambassador and has the honor to acknowledge the receipt of his communication No. 330 of December 3, 1941 [주65] regarding the proposed visits to United States ports of the steamship Tatuta Maru, which has been requisitioned by the Japanese Government.\n\nThe Secretary of State has informed the Attorney General that he accepts as true the statements contained in the Ambassador’s communication and recognizes and allows the claim of immunity made by the Japanese Government. The Secretary of State has requested the Attorney General to bring the matter to the attention of the appropriate courts having jurisdiction in the ports of this country and of the Panama Canal Zone to be visited by the vessel and to take such steps as may be necessary to the end that its immunity may be recognized by the courts.\n\nWashington , December 5, 1941.\n\n[277면]", "notes": ["[주65] 인쇄되지 않음."], "warn": false, "pages": ["0340", "0341", "0342", "0343"], "search": "헐(Cordell Hull) — 국무장관 노무라(野村吉三郎, Nomura) — 주미 일본대사"}, {"id": "d415", "order": 415, "date": "1941-12-05", "group": "A", "eyebrow": "d415 · Memorandum of a Conversation", "title": "회담 비망록", "badge": null, "list_right": "문서 415", "meta": [{"k": "일자", "v": "1941-12-05"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/25946/8", "txt": true}, {"k": "발신", "v": "밸런타인(Joseph W. Ballantine) 기록", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 415 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d415"}], "summary": "노무라와 구루스가 프랑스령 인도차이나 주둔 일본군에 관한 대통령의 조회에 대한 일본 정부의 회답을 헐에게 건네고, 중국 원조 중단·석유·언론 문제를 두고 주고받은 회담 기록이다. 개전 이틀 전이다.", "points": ["일본대사와 구루스가 요청하여 국무부를 방문했다. 대사는 프랑스령 인도차이나 주둔 일본군에 관한 대통령의 조회에 대한 일본 정부의 회답이라며 문서 한 통을 국무장관에게 건넸다(그 문서 본문은 다음 문서에 실려 있다).", "헐은 중국이 인도차이나에서 일본을 공격할 우려가 있다고 보느냐고 묻고, 「그러니까 일본이 중국에 대하여 수세를 취하였다는 것이군요」라고 말했다. 일본이 인도차이나에서 수세에 있다는 말은 처음 듣는다고 했다.", "노무라는 중국이 버마 로드 방어에 열심이므로, 일본이 인도차이나에서 버마 로드를 공격하는 것을 막기 위해 중국이 인도차이나를 공격할 가능성을 배제할 수 없다고 답했다.", "노무라는 서남태평양에서 ABCD 열강의 해·공군 준비 증강에 일본이 경악하고 있으며 최근 그중 한 나라의 비행기가 대만(Formosa) 상공을 날았다고 말하고, 미국 군인들은 매우 기민하고 진취적이며 「공격이 최선의 방어」라는 원칙을 믿는 것으로 알려져 있다고 했다. 헐은 그 말이 미국이 히틀러에 대해 취하는 방어 조치에도 해당하느냐고 되물었다.", "헐은, 중국이 인도차이나에서 일본을 공격하려 한다면 그것이야말로 일본이 인도차이나에서 병력을 철수할 또 하나의 이유가 되지 않겠느냐고 물었다.", "구루스는 중일 회담이 개시되는 즉시 미국이 중국 원조를 중단하는 데 동의해야 한다고 했다. 헐은 그 문제를 꺼내면 일본이 히틀러에게 주고 있는 원조 문제가 딸려 나온다면서, 일본이 히틀러를 계속 도우면서 미국더러 중국 원조를 그치라고 요구할 수는 없다고 했다. 일본은 미국과 다른 나라들의 큰 병력을 태평양 지역에 묶어 둠으로써 히틀러를 돕고 있다는 것이다.", "이 대목에서 노무라가 일본어로 낮게 한마디를 뱉었는데, 문맥상 「이래서는 아무 진전이 없다」는 뜻이라고 기록되어 있다.", "석유 문제: 노무라는 헐이 일본 해군용 석유를 허용했다면 「린치를 당할 위험을 무릅쓰다시피 했을 것」이라고 말한 것을 기억한다고 했다. 헐은 지금도 상원의원들과 다른 이들이 자신이 취해 온 방침을 비판하기를 그치지 않고 있다고 답했다.", "헐은 11월 20일 일본 제안에 대해 11월 22일 구두로 논평한 세 가지를 요약했다: 하나, 중국 원조 중단 요구에 관한 미국의 곤란. 둘, 인도차이나 어디에든 일본군 대부대가 있는 것이 인접국들에 안보 불안을 일으킨다는 점. 셋, 군·해군 수요를 위해 일본에 석유를 공급하는 데 대한 미국 내 여론의 태도.", "헐은 일본 정부가 관제·사주 언론을 통한 「악의적 캠페인」으로 사태를 혼란스럽게 하고 있으며, 일본 정부가 언론을 통제할 수 있음을 알기에 고위 관리들이 그런 캠페인을 벌이는 동기를 이해할 수 없다고 했다. 구루스는 미국 쪽에도 해로운 신문 선전이 있다고 맞받았다.", "구루스는 자신이 대사를 감시하러 파견되었다는 등의 중상 보도를 언급했고, 헐은 구루스와 대사에 관하여 좋은 평판만 들었다고 답했다. 두 사람은 바쁜 장관의 시간을 많이 빼앗은 데 대한 통상의 사과를 하고 물러갔다."], "primary": "[워싱턴,] 1941년 12월 5일.\n\n일본대사와 구루스(来栖三郎, Kurusu) 씨가 자신들의 요청으로 국무부를 방문하였다. 대사는 프랑스령 인도차이나 주둔 일본군에 관한 대통령의 조회에 대한 일본 정부의 회답이라고 말하면서 문서 한 통을 국무장관에게 건넸다. 그 문서의 내용은 다음과 같다.\n\n[여기에 아래에 실린 성명의 본문이 온다.]\n\n국무장관은 그 문서를 읽고, 일본 측은 중국인들이 인도차이나에서 일본을 공격할 우려가 있다고 보는지 물었다. 그는 「그러니까 일본은 중국에 대하여 수세를 취하였다는 것이군요」라고 말하였다. 그는 중국인들이 윈난에 병력을 집결시키는 것은 일본이 인도차이나에 병력을 집결시키는 데 대한 대응이라고 그들이 주장하고 있다고 들었다고 말하였다. 구루스 씨는 이 문제에 관하여 자기들이 본국 정부로부터 받은 것은 그것이 전부라고 말하였다. 대사는 중국인들이 버마 로드(the Burma Road)를 방어하는 데 열심이므로, 일본이 인도차이나에서 버마 로드를 공격하는 것을 막는 수단으로서 중국이 인도차이나를 공격할 가능성은 배제할 수 없다고 자신은 느낀다고 말하였다.\n\n국무장관은, 자신이 알기로 일본은 그곳에서 중국을 공격할 목적으로 북부 인도차이나에 병력을 들여보내 왔다고 말하였다. 그는 북부 인도차이나로의 일본군 이동이 중국의 공격에 대한 방어를 목적으로 한 것이라는 말은 전에 들어 본 적이 없다고 하였다. 국무장관은 일본이 인도차이나에서 수세에 있다는 것을 자신이 알게 된 것은 이번이 처음이라고 덧붙였다.\n\n[782면]\n\n대사는, 일본은 서남태평양 지역에서 ABCD 열강의 해군 및 군사 준비가 증강되는 데 대하여 경악하고 있으며, 최근 그 나라들 가운데 하나의 비행기가 대만(Formosa) 상공을 날았다고 말하였다. 그는 미국의 군인들이 매우 기민하고 진취적이며 공격이 최선의 방어라는 원칙을 믿는 것으로 알려져 있다고 말하였다. 국무장관은 대사의 그러한 견해가 우리가 히틀러에 대하여 취하고 있는 방어 조치에도 적용되는 것이냐고 물었다. 대사는 자신이 그렇게 말한 것은 아니며, 다만 사태에 대한 일본의 우려 때문에 자기들이 11월 20일 제안을 하였던 것이라고 답하였다.\n\n국무장관은, 만일 중국인들이 인도차이나에서 일본을 공격하려 하고 있다면 그것이야말로 일본이 인도차이나에서 병력을 철수할 또 하나의 이유가 되지 아니하겠느냐고 물었다. 국무장관은 이 문제에 관하여 일본 정부가 우리에게 더 말할 것이 떠오른다면 무엇이든 기꺼이 받겠다고 말하였다.\n\n대사는 일본 정부가 이 정부와 합의에 이르기를 매우 간절히 바라고 있다고 말하였고, 구루스 씨는 중국과 일본 사이의 회담이 개시되는 즉시 우리가 중국에 대한 원조를 중단하는 데 기꺼이 동의하여야 마땅하다고 일본 정부는 느끼고 있다고 말하였다. 국무장관은, 일본 측이 그 문제를 꺼내면 일본이 히틀러에게 주고 있는 원조의 문제가 따라 나온다는 점을 지적하였다. 그는 일본이 계속 히틀러를 도우면서 우리에게는 중국에 대한 원조를 그치라고 요구할 수 있다는 것이 어떻게 가능한지 모르겠다고 말하였다. 구루스 씨는 일본이 어떤 방식으로 히틀러를 돕고 있느냐고 물었다. 국무장관은, 자신이 이미 일본대사에게 분명히 밝힌 바와 같이 일본은 이 나라와 다른 나라들의 큰 병력을 태평양 지역에 묶어 둠으로써 히틀러를 돕고 있다고 답하였다. (이 대목에서 대사는 낮은 목소리로(sotto voce) 일본어 표현 하나를 내뱉었는데, 현재의 문맥에서 그것은 「이래서는 아무 데도 이르지 못한다」는 뜻이다.) 국무장관은, 11월 22일에 자신이 이 점에 관하여 대사에게 말한 바를, 또한 일본이 남태평양에서 우리를 상대로 작전할 수 있게 해 줄 일본 해군용 석유를 일본에 공급할 뜻이 우리에게 없다는 점을, 나아가 중국에 대한 원조를 계속하는 데 대한 우리의 태도를 대사에게 상기시켰다. 대사는, 만일 국무장관이 일본 해군용 석유가 일본으로 가도록 허용한다면 자신이 린치를 당할 위험을 무릅쓰다시피 하게 되리라고 국무장관이 말하였던 것을 기억한다고 말하였다. 대사는, 일본에 석유를 주는 것이 평화적 합의에 이르는 것이 바람직하다는 데서 나온 일이라고 국무장관이 설명한다면 그러한 설명이 받아들여지리라고 자신은 믿는다고 말하였다. 국무장관은, 상원의원들과 그 밖의 사람들이 자신이 지금까지 취해 온 방침에 대하여 지금도 여전히 비판을 그치지 아니하고 있다고 답하였다.\n\n이어 국무장관은 11월 20일자 일본 측 제안과 관련하여 11월 22일 일본대사에게 구두로 논평하였던 세 가지 점을 [783면] 요약하였다. 즉 첫째, 중국에 대한 원조를 중단하라는 일본 측 요구와 관련한 우리의 곤란, 둘째, 인도차이나의 어느 곳에든 일본군의 대부대가 있다는 것이 인접 국가들 사이에 그들의 안전에 대한 불안을 일으키고 있다는 우리의 느낌, 셋째, 군사적·해군적 수요를 위하여 일본에 석유를 공급하는 데 대한 이 나라의 여론의 태도였다. 그는 자신이 11월 22일 대사에게 이 점들에 관한 자신의 입장을 명확히 밝히지 아니하였느냐고 대사에게 물었다. 대사는 그렇다고 인정하였다.\n\n대사는, 이 정부가 인도차이나로의 진주를 두고 일본을 비난하고 있으나 만일 인도차이나가 다른 열강에 의하여 지배된다면 그것은 일본에게 위협이 되리라고 말하였다. 국무장관은, 대사도 알고 있다시피 일본 정부가 무력과 침략의 길을 단념하기만 한다면 우리는 지체 없이 문제를 해결할 수 있다고 답하였다. 국무장관은 우리가 분란을 찾아다니는 것은 아니지만 동시에 위협 앞에서 달아나지도 아니한다고 덧붙였다.\n\n구루스 씨는, 우리가 잠정 조치에 관하여 합의에 이르기만 한다면 그다음에 근본적 해결의 탐색을 진행할 수 있으리라고 자신은 느낀다고 말하였다. 그는 그러한 근본적 합의에는 필연적으로 시간이 걸릴 것이며 지금 필요한 것은 잠정적 방편이라고 말하였다. 국무장관은, 일본 측이 관에 의하여 통제되고 사주되는 언론을 통하여 수행되는 악의에 찬 캠페인으로 사태를 혼란스럽게 유지하고 있으며 그것이 평화에 이롭지 아니한 분위기를 만들어 내고 있다고 답하였다. 국무장관은 일본 정부가 언론을 통제할 수 있음을 우리가 알고 있으며, 따라서 일본 정부의 고위 관리들이 그러한 캠페인을 조장하는 동기가 무엇인지 우리로서는 이해할 수 없다고 말하였다. 구루스 씨는 미국 쪽도 해로운 신문 선전으로부터 자유롭지 아니하다고 말하였다. 그는 예를 들어 국무장관의 기자 회견에 관한 어느 신문 보도가 일본에 불행한 인상을 만들어 낸 일이 있다고 말하였다. 국무장관은, 자신은 여러 달 동안 일본 관리들과 일본 언론이 호전적인 성격의 표어들을 외치는 것을 보아 왔으며 그 모든 일이 벌어지는 동안 자신은 침묵을 지켜 왔다고 답하였다. 그는 이제 자신이 자국 정부의 원칙에 관하여 한마디만 하여도 일본 측으로부터 뭇매를 맞고 있다고 지적하였다. 이어 구루스 씨는, 자신이 대사를 감시하기 위하여 이곳에 파견되었다는 등등의 취지로 자신을 중상하는 어느 언론 보도를 언급하였다. 국무장관은 구루스 씨와 대사에 관하여 자신은 좋은 이야기밖에 듣지 못하였다고 답하였다. 이 시점에서 대사와 구루스 씨는 바쁜 국무장관의 시간을 그토록 많이 빼앗은 데 대하여 통상의 사과를 한 뒤 물러갔다.\n\nJ[oseph] W. B[allantine]\n\n[784면]", "secondary": "[Washington,] December 5, 1941.\n\nThe Japanese Ambassador and Mr. Kurusu called at their request at the Department. The Ambassador handed to the Secretary a paper which he said was the Japanese Government’s reply to the President’s inquiry in regard to Japanese troops in French Indochina. The paper reads as follows:\n\n[Here follows text of the statement printed infra.]\n\nThe Secretary read the paper and asked whether the Japanese considered that the Chinese were liable to attack them in Indochina. He said, so Japan has assumed the defensive against China. He said that he had heard that the Chinese are contending that their massing troops in Yunnan was in answer to Japan’s massing troops in Indochina. Mr. Kurusu said that that is all that they have received from their Government in regard to this matter. The Ambassador said that as the Chinese were eager to defend the Burma Road he felt that the possibility of a Chinese attack in Indochina as a means of preventing Japan’s attacking the Burma Road from Indochina could not be excluded.\n\nThe Secretary said that he had understood that Japan had been putting forces into northern Indochina for the purpose of attacking China from there. He said that he had never heard before that Japan’s troop movements into northern Indochina were for the purpose of defense against Chinese attack. The Secretary added that it was the first time that he knew that Japan was on the defensive in Indochina.\n\n[782면]\n\nThe Ambassador said that the Japanese are alarmed over increasing naval and military preparations of the ABCD powers in the southwest Pacific area, and that an airplane of one of those countries had recently flown over Formosa. He said that our military men are very alert and enterprising and are known to believe in the principle that offense is the best defense. The Secretary asked whether the Ambassador’s observations applied to defensive measures we are taking against Hitler. The Ambassador replied that he did not say that, but that it was because of Japan’s apprehensions in regard to the situation that they had made their November 20 proposal.\n\nThe Secretary asked whether, if the Chinese are about to attack Japan in Indochina, this would not constitute an additional reason for Japan to withdraw her armed forces from Indochina. The Secretary said that he would be glad to get anything further which it might occur to the Japanese Government to say to us on this matter.\n\nThe Ambassador said that the Japanese Government was very anxious to reach an agreement with this Government and Mr. Kurusu said that the Japanese Government felt that we ought to be willing to agree to discontinue aid to China as soon as conversations between China and Japan were initiated. The Secretary pointed out that when the Japanese bring that matter up it brings up the matter of the aid Japan is giving to Hitler. He said that he did not see how Japan could demand that we cease giving aid to China while Japan was going on aiding Hitler. Mr. Kurusu asked in what way was Japan aiding Hitler. The Secretary replied that, as he had already made clear to the Japanese Ambassador, Japan was aiding Hitler by keeping large forces of this country and other countries immobilized in the Pacific area. (At this point the Ambassador uttered sotto voce an expression in Japanese which in the present context means “this isn’t getting us anywhere”.) The Secretary reminded the Ambassador of what the Secretary had said to the Ambassador on this point on November 22 as well as on our unwillingness to supply oil to Japan for the Japanese Navy which would enable Japan to operate against us in the southern Pacific and also on our attitude toward continuing aid to China. The Ambassador said that he recalled that the Secretary had said that he would almost incur the danger of being lynched if he permitted oil to go to Japan for her navy. The Ambassador said that he believed that if the Secretary would explain that giving of oil to Japan had been prompted by the desirability of reaching a peaceful agreement such explanation would be accepted. The Secretary replied that senators and others are not even now desisting from criticizing the Secretary for the course that he had hitherto taken.\n\nThe Secretary then recapitulated the three points on which he had orally commented to the Japanese Ambassador on November 22, [783면] with reference to the Japanese proposal of November 20, namely one, our difficulty with reference to the Japanese request that we discontinue aid to China, two, our feeling that the presence of large bodies of Japanese troops anywhere in Indochina caused among neighboring countries apprehensions for their security, and, three, public attitude in this country toward supplying Japan with oil for military and naval needs. He asked the Ambassador whether he had not set forth clearly his position on these points to the Ambassador on November 22. The Ambassador agreed.\n\nThe Ambassador said that this Government blames Japan for its move into Indochina but that if Indochina was controlled by other powers it would be a menace to Japan. The Secretary replied that as the Ambassador was aware we could solve matters without delay if only the Japanese Government would renounce courses of force and aggression. The Secretary added that we were not looking for trouble but that at the same time we were not running away from menaces.\n\nMr. Kurusu said that he felt that if we could only come to an agreement on temporary measures we could then proceed with our exploration of fundamental solutions. He said that such a fundamental agreement would necessarily take time and that what was needed now was a temporary expedient. The Secretary replied that the Japanese were keeping the situation confused by a malignant campaign conducted through the officially controlled and inspired press which created an atmosphere not conducive to peace. The Secretary said that we knew the Japanese Government could control the press and that therefore we did not understand what the motives are of the higher officials of the Japanese Government in promoting such a campaign. Mr. Kurusu said that on the American side we were not free from injurious newspaper propaganda. He said that for example there was the case of a newspaper report of the Secretary’s interview with the press which created an unfortunate impression in Japan. The Secretary replied that he had been seeing for months and months that Japanese officials and the Japanese press had been proclaiming slogans of a bellicose character and that while all this was going on he had kept silent. He pointed out that now he was being jumped on by the Japanese if he said a single word in regard to his Government’s principles. Mr. Kurusu then referred to a press report casting aspersions on Kurusu to the effect that he had been sent here to check on the Ambassador, et cetera, et cetera. The Secretary replied that he had heard only good reports in regard to Mr. Kurusu and the Ambassador. At this point the Ambassador and Mr. Kurusu took their leave after making the usual apologies for taking so much of the Secretary’s time when he was busy.\n\nJ[oseph] W. B[allantine]\n\n[784면]", "notes": [], "warn": false, "pages": ["0848", "0849", "0850"], "search": "노무라(野村吉三郎, Nomura) — 주미 일본대사. 본문에는 「일본대사」·「대사」로만 적혀 있다 구루스(来栖三郎, Kurusu) — 일본 특사 헐(Cordell Hull) — 미국 국무장관. 본문에는 「국무장관」으로만 적혀 있다 밸런타인(Joseph W. Ballantine) — 국무부 관리, 이 비망록의 기록자 루스벨트(Franklin D. Roosevelt) — 미국 대통령. 원문에는 「대통령」으로만 적혀 있다 히틀러(Adolf Hitler) — 독일 총통"}, {"id": "d416", "order": 416, "date": "1941-12-05", "group": "E", "eyebrow": "d416 · Statement Handed by the Japanese Ambassador (Nomura) to the Secretary of State on December 5, 1941", "title": "1941년 12월 5일 일본 대사(노무라)가 국무장관에게 건넨 성명", "badge": null, "list_right": "문서 416", "meta": [{"k": "일자", "v": "1941-12-05"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/25946/8", "txt": true}, {"k": "발신", "v": "일본 대사 노무라(野村吉三郎, Nomura)", "txt": true}, {"k": "수신", "v": "국무장관 헐(Cordell Hull)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "성명"}], "links": [{"k": "FRUS", "text": "문서 416 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d416"}], "summary": "프랑스령 인도차이나 내 일본군 이동에 관한 미국 측 문의에 대해, 중국군의 움직임에 대비한 북부 증강과 그에 따른 남부의 이동일 뿐이며 과장된 보고라고 답한다.", "points": ["프랑스령 인도차이나에서 보고된 일본군의 이동에 관한 미국 측 문의에 대한 회답이며, 도쿄의 훈령에 따른 것이다.", "중국과 접한 프랑스령 인도차이나 북부 국경을 따라 최근 중국군의 이동 징후가 잦았다는 것이 일본 측의 설명이다.", "주로 예방 조치를 취한다는 목적으로 프랑스령 인도차이나 북부에서 일본군을 어느 정도 증강했다.", "그 조치의 당연한 귀결로 해당 영역 남부에 주둔한 부대들 사이에서도 일정한 이동이 있었다.", "이러한 이동에 관하여 과장된 보고가 이루어진 것으로 보인다.", "일본과 프랑스 사이의 공동방위 의정서 규정을 위반할 만한 조치는 일본 정부 측에서 전혀 취해진 바 없다고 덧붙인다."], "primary": "1941년 12월 5일\n\n프랑스령 인도차이나에서 보고된 일본군의 이동에 관한 귀하의 문의와 관련하여, 도쿄의 훈령에 따라 다음과 같이 알려 드리고자 합니다.\n\n최근 중국과 접경한 프랑스령 인도차이나 북부 국경을 따라 중국군이 이동하는 징후를 자주 보였으므로, 주로 예방 조치를 취한다는 목적에서 프랑스령 인도차이나 북부에서 일본군이 어느 정도 증강되었습니다. 이 조치의 당연한 귀결로, 위 영역의 남부에 주둔하고 있는 부대들 사이에서도 일정한 이동이 이루어졌습니다. 이러한 이동에 관하여 과장된 보고가 이루어진 것으로 보입니다. 일본과 프랑스 사이의 공동방위 의정서의 규정을 위반할 수 있는 조치는 일본 정부 측에서 아무것도 취해진 바 없다는 점을 덧붙여 둡니다.", "secondary": "December 5, 1941\n\nReference is made to your inquiry about the intention of the Japanese Government with regard to the reported movements of Japanese troops in French Indo-china. Under instructions from Tokyo I wish to inform you as follows:\n\nAs Chinese troops have recently shown frequent signs of movements along the northern frontier of French Indo-china bordering on China, Japanese troops, with the object of mainly taking precautionary measures, have been reinforced to a certain extent in the northern part of French Indo-china. As a natural sequence of this step, certain movements have been made among the troops stationed in the southern part of the said territory. It seems that an exaggerated report has been made of these movements. It should be added that no measure has been taken on the part of the Japanese Government that may transgress the stipulations of the Protocol of Joint Defense between Japan and France.", "notes": [], "warn": false, "pages": [], "search": "노무라(野村吉三郎, Nomura) — 주미 일본대사 헐(Cordell Hull) — 국무장관(본문에는 'you'로만 나타난다)"}, {"id": "d417", "order": 417, "date": "1941-12-06", "group": "E", "eyebrow": "d417 · President Roosevelt to the Secretary of State", "title": "루스벨트 대통령이 국무장관에게", "badge": null, "list_right": "문서 417", "meta": [{"k": "일자", "v": "1941-12-06"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "740.0011 Pacific War/856", "txt": true}, {"k": "발신", "v": "루스벨트 대통령(President Roosevelt)", "txt": true}, {"k": "수신", "v": "국무장관(the Secretary of State) — 헐(Cordell Hull)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "서한"}], "links": [{"k": "FRUS", "text": "문서 417 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d417"}], "summary": "루스벨트가 천황 앞 친전을 그루 대사에게 곧바로 타전하라고 헐에게 지시하며, 그레이 암호로 보내도 좋고 傍受되어도 상관없다고 적은 쪽지.", "points": ["12월 6일 백악관에서 루스벨트가 헐에게 직접 쓴 짧은 쪽지다.", "「이것」(각주에 따르면 바로 아래 문서, 즉 천황 앞 친전)을 그루에게 보내라고 지시한다.", "그레이 암호(gray code)로 보내도 된다고 했다. 저급 암호이지만 시간을 아낀다는 이유다.", "「누가 가로채도 상관없다(I don't mind if it gets picked up)」. 傍受를 감수하겠다는 뜻이다.", "서명은 직함 없이 「F.D.R.」 이니셜뿐이다."], "primary": "백악관, 워싱턴, [1941년 12월 6일].\n\n친애하는 코델에게: 이것을[주69] 그루에게 쏘아 보내시오 — 그레이 암호로 가도 된다고 봅니다 — 시간이 절약되지요 — 누가 그것을 가로채도 나는 상관없습니다.\n\nF.D.R.", "secondary": "The White House, Washington [December 6, 1941].\n\nDear Cordell: Shoot this [주69] to Grew—I think it can go in gray code—saves time—I don’t mind if it gets picked up.\n\nF.D.R.", "notes": ["[주69] 아래 문서를 보라."], "warn": false, "pages": [], "search": "루스벨트(Franklin D. Roosevelt) — 미국 대통령, 「F.D.R.」로 서명 헐(Cordell Hull) — 국무장관, 「친애하는 코델」로 불린다 그루(Joseph Grew) — 주일 미국대사"}, {"id": "d418", "order": 418, "date": "1941-12-06", "group": "E", "eyebrow": "d418 · President Roosevelt to Emperor Hirohito of Japan  This message was transmitted in telegram No. 818, December 6, 1941, 9 p.m., to the Ambassador in Japan (Grew), with instructions to communicate the President’s message, to the Japanese, Emperor in such manner as deemed most appropriate by the Ambassador and at the earliest possible moment, addressed to “His Imperial Majesty, the Emperor of Japan.” The telegram added that the press was being informed that the President was despatching a message to the Emperor.", "title": "루스벨트 대통령이 일본 천황 히로히토에게", "badge": null, "list_right": "문서 418", "meta": [{"k": "일자", "v": "1941-12-06"}, {"k": "시각", "v": "전보 발신 1941년 12월 6일 오후 9시 (전보 제818호)"}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": "818"}, {"k": "원문출처", "v": "740.0011 Pacific War/856", "txt": true}, {"k": "발신", "v": "루스벨트(Franklin D. Roosevelt) 미국 대통령", "txt": true}, {"k": "수신", "v": "일본 천황 히로히토(裕仁, Hirohito) 폐하", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "서한"}], "links": [{"k": "FRUS", "text": "문서 418 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d418"}], "summary": "루스벨트 대통령이 천황에게 직접 친서를 보내, 남부 인도차이나의 일본군 집중이 주변 여러 민족에게 정당한 공포를 일으키고 있으니 인도차이나에서 철병하면 남태평양 전역의 평화가 보장될 것이라며 「검은 구름」을 걷어낼 길을 함께 생각하자고 호소한다.", "points": ["거의 한 세기 전 미국 대통령이 일본 천황에게 우호를 제의했고 그것이 받아들여져 오랜 평화와 우호가 이어져 왔음을 상기시킨다.", "국사(國事)에 관해 폐하께 글을 보내는 것은 두 나라에 지극히 중대한 상황일 때뿐이며, 지금 형성되고 있는 깊고 광범한 위기 때문에 쓴다고 밝힌다.", "미국민이 바란 것은 중일 분쟁의 종식, 여러 민족이 침략의 공포 없이 나란히 살 수 있는 태평양의 평화, 견딜 수 없는 군비 부담의 제거, 어느 나라도 차별하거나 편들지 않는 통상의 재개다.", "이 큰 목표를 이루려면 일본과 미국 모두 어떠한 형태의 군사적 위협도 제거하기로 합의해야 한다.", "북부 프랑스령 인도차이나 진주(5~6천 명)와 이 봄·여름 남부 프랑스령 인도차이나 진주의 경위를 짚고, 인도차이나에 대한 공격은 없었고 계획된 바도 없다고 말한다.", "지난 몇 주 남부 인도차이나로 보내진 일본 육·해·공군의 규모가 너무 커서 그 집중이 방어적 성격이 아니라는 합리적 의심을 낳고 있다.", "필리핀·동인도의 수백 섬·말라야·타이 사람들이 자기들 중 어느 방향으로 공격이 준비되고 있는지 자문하는 것은 당연하며, 그 공포는 평화와 국가 존립이 걸린 정당한 공포다.", "「그러한 상황이 지속되는 것은 생각할 수 없는 일이다」. 누구도 다이너마이트 통 위에 무한정 앉아 있을 수 없다.", "일본 군인이 한 사람도 남지 않고 철수한다 해도 미국은 인도차이나를 침공할 생각이 전혀 없으며, 동인도·말라야·타이 정부에서도 같은 보장을 얻을 수 있고 중국 정부에도 같은 보장을 요청하겠다고 한다.", "따라서 인도차이나에서 일본군이 철수하면 남태평양 전역의 평화가 보장될 것이라고 결론짓는다."], "primary": "[워싱턴,] 1941년 12월 6일.\n\n거의 한 세기 전에 미합중국 대통령은 일본 천황에게 미국 국민의 우호의 제의를 담은 서한을 보냈습니다.[주71] 그 제의는 받아들여졌고, 그 뒤로 이어진 오랜 세월의 끊이지 않은 평화와 우호 속에서 우리 두 나라는 [785면] 그 국민의 미덕과 그 통치자의 지혜를 통하여 번영하였고 인류를 실질적으로 도왔습니다.\n\n두 나라에 지극히 중대한 사태가 있을 때에만 저는 국사에 관한 서한을 폐하께 올릴 필요가 있습니다. 저는 지금 형성되고 있는 것으로 보이는 깊고도 멀리 미치는 위기 때문에 이제 폐하께 이렇게 글을 올려야 한다고 느낍니다.\n\n태평양 지역에서는 우리 두 나라 사이의 오랜 평화가 주는 이로운 영향을, 우리 두 나라와 온 인류로부터 빼앗아 갈 위험이 있는 사태들이 일어나고 있습니다. 그 사태들은 비극적인 가능성을 품고 있습니다.\n\n미국 국민은 평화를 믿고 또 여러 나라가 서로 살고 살게 할 권리를 믿기에, 지난 몇 달 동안 우리 두 정부 사이의 회담을 간절한 마음으로 지켜보아 왔습니다. 우리는 일본과 중국 사이의 현 분쟁이 끝나기를 바라 왔습니다. 우리는 태평양의 평화가 다음과 같은 방식으로 이루어질 수 있기를 바라 왔습니다 — 곧 서로 다른 여러 민족의 국민들이 침략의 두려움 없이 나란히 존재할 수 있고, 그들 모두에게서 견딜 수 없는 군비의 짐이 걷힐 수 있으며, 모든 국민이 어느 나라를 차별하거나 어느 나라에 특혜를 주는 일 없이 통상을 재개하는 것입니다.\n\n저는 이러한 큰 목표를 추구함에 있어 일본과 미국이 다 같이 어떠한 형태의 군사적 위협도 제거하기로 합의하여야 한다는 것이, 저에게 그러하듯 폐하께도 분명하리라고 확신합니다. 이것이 그 높은 목표를 이루는 데 긴요한 것으로 여겨졌습니다.\n\n일 년도 더 전에 폐하의 정부는 비시 정부와 협정을 맺어, 더 북쪽에서 중국을 상대로 작전 중이던 일본군의 보호를 위하여 5, 6천 명의 일본군이 북부 프랑스령 인도차이나에 들어가는 것이 허용되었습니다. 그리고 올 봄과 여름에 비시 정부는 프랑스령 인도차이나의 공동 방위를 위하여 일본군 병력이 더 남부 프랑스령 인도차이나에 들어가는 것을 허용하였습니다. 인도차이나에 대한 공격은 이루어진 바 없고 또 계획된 바도 없다고 말씀드리는 것이 옳으리라 생각합니다.\n\n지난 몇 주 사이에, 일본의 육군·해군·항공 병력이 그토록 큰 규모로 남부 인도차이나에 보내져, 인도차이나에서 계속되는 이 집중이 그 성격에 있어 방어적인 것이 아니라는 합리적인 의심을 다른 나라들 쪽에서 품게 되었다는 것이 온 세계에 분명해졌습니다.\n\n인도차이나에서 계속되는 이 집중이 그토록 큰 규모에 이르렀고, 또 그것이 이제 그 반도의 동남쪽과 서남쪽 끝까지 뻗쳐 있으므로, 필리핀의 국민과 동인도의 수백 섬의 주민들, 말라야와 타이 자체의 국민들이 이 일본의 병력이 이 여러 방향 가운데 하나 또는 그 이상을 향하여 공격을 준비하고 있는 것인지 또는 그럴 뜻을 품고 있는 것인지 스스로 묻고 있는 것은 지극히 당연한 일입니다.\n\n[786면]\n\n이 모든 국민의 두려움은, 그것이 그들의 평화와 그들의 국가적 존립에 관계되는 것인 만큼, 정당한 두려움이라는 것을 폐하께서 이해하시리라 확신합니다. 또한 미국 국민이 그토록 많은 수로, 공격적 조치를 감당할 수 있는 무력을 이룰 만큼 크게 인원과 장비를 갖춘 육군·해군·항공 기지의 설치를 미심쩍은 눈으로 바라보는 까닭을 폐하께서 이해하시리라 확신합니다.\n\n그러한 상황이 계속되는 것은 생각할 수도 없는 일임이 분명합니다.\n\n제가 위에서 말씀드린 어느 국민도 다이너마이트 통 위에 무한정으로도, 영구히도 앉아 있을 수는 없습니다.\n\n일본의 군인이나 수병이 한 사람도 남김없이 인도차이나에서 철수한다 하더라도, 미국 쪽에는 인도차이나를 침공할 생각이 전혀 없습니다.\n\n저는 동인도의 여러 정부, 말라야의 여러 정부, 그리고 타이 정부로부터도 같은 보장을 얻을 수 있으리라 생각합니다. 저는 중국 정부 쪽에서도 같은 보장을 요청하는 일을 떠맡을 용의까지 있습니다. 그리하여 인도차이나로부터 일본군이 철수한다면 그것은 남태평양 지역 전체에 걸친 평화의 보장이라는 결과를 낳을 것입니다.\n\n저는 이 명백한 위기에 즈음하여, 폐하께서도 제가 그리하고 있듯이 저 검은 구름을 걷어낼 방도를 생각해 주시기를 간절히 바라는 마음으로 이 순간 폐하께 글을 올립니다. 우리 두 사람 모두가, 우리 자신의 위대한 두 나라의 국민을 위해서만이 아니라 이웃 지역 인류를 위해서도, 전통적인 우호를 회복하고 세계에서 더 이상의 죽음과 파괴를 막아야 할 신성한 의무를 지고 있다고 저는 확신합니다.\n\n프랭클린 D. 루스벨트(Franklin D. Roosevelt)", "secondary": "[Washington,] December 6, 1941.\n\nAlmost a century ago the President of the United States addressed to the Emperor of Japan a message extending an offer of friendship of the people of the United States to the people of Japan. [주71] That offer was accepted, and in the long period of unbroken peace and friendship which has followed, our respective nations, through the [785면] virtues of their peoples and the wisdom of their rulers have prospered and have substantially helped humanity.\n\nOnly in situations of extraordinary importance to our two countries need I address to Your Majesty messages on matters of state. I feel I should now so address you because of the deep and far-reaching emergency which appears to be in formation.\n\nDevelopments are occurring in the Pacific area which threaten to deprive each of our nations and all humanity of the beneficial influence of the long peace between our two countries. Those developments contain tragic possibilities.\n\nThe people of the United States, believing in peace and in the right of nations to live and let live, have eagerly watched the conversations between our two Governments during these past months. We have hoped for a termination of the present conflict between Japan and China. We have hoped that a peace of the Pacific could be consummated in such a way that nationalities of many diverse peoples could exist side by side without fear of invasion; that unbearable burdens of armaments could be lifted for them all; and that all peoples would resume commerce without discrimination against or in favor of any nation.\n\nI am certain that it will be clear to Your Majesty, as it is to me, that in seeking these great objectives both Japan and the United States should agree to eliminate any form of military threat. This seemed essential to the attainment of the high objectives.\n\nMore than a year ago Your Majesty’s Government concluded an agreement with the Vichy Government by which five or six thousand Japanese troops were permitted to enter into Northern French Indo-China for the protection of Japanese troops which were operating against China further north. And this Spring and Summer the Vichy Government permitted further Japanese military forces to enter into Southern French Indo-China for the common defense of French Indo-China. I think I am correct in saying that no attack has been made upon Indo-China, nor that any has been contemplated.\n\nDuring the past few weeks it has become clear to the world that Japanese military, naval and air forces have been sent to Southern Indo-China in such large numbers as to create a reasonable doubt on the part of other nations that this continuing concentration in Indo-China is not defensive in its character.\n\nBecause these continuing concentrations in Indo-China have reached such large proportions and because they extend now to the southeast and the southwest corners of that Peninsula, it is only reasonable that the people of the Philippines, of the hundreds of Islands of the East Indies, of Malaya and of Thailand itself are asking themselves whether these forces of Japan are preparing or intending to make attack in one or more of these many directions.\n\n[786면]\n\nI am sure that Your Majesty will understand that the fear of all these peoples is a legitimate fear in as much as it involves their peace and their national existence. I am sure that Your Majesty will understand why the people of the United States in such large numbers look askance at the establishment of military, naval and air bases manned and equipped so greatly as to constitute armed forces capable of measures of offense.\n\nIt is clear that a continuance of such a situation is unthinkable.\n\nNone of the peoples whom I have spoken of above can sit either indefinitely or permanently on a keg of dynamite.\n\nThere is absolutely no thought on the part of the United States of invading Indo-China if every Japanese soldier or sailor were to be withdrawn therefrom.\n\nI think that we can obtain the same assurance from the Governments of the East Indies, the Governments of Malaya and the Government of Thailand. I would even undertake to ask for the same assurance on the part of the Government of China. Thus a withdrawal of the Japanese forces from Indo-China would result in the assurance of peace throughout the whole of the South Pacific area.\n\nI address myself to Your Majesty at this moment in the fervent hope that Your Majesty may, as I am doing, give thought in this definite emergency to ways of dispelling the dark clouds. I am confident that both of us, for the sake of the peoples not only of our own great countries but for the sake of humanity in neighboring territories, have a sacred duty to restore traditional amity and prevent further death and destruction in the world.\n\nFranklin D. Roosevelt", "notes": ["[주70] 이 서한은 1941년 12월 6일 오후 9시, 전보 제818호로 주일 대사(그루)에게 타전되었으며, 대통령의 서한을 「일본국 천황 폐하(His Imperial Majesty, the Emperor of Japan)」 앞으로 하여, 대사가 가장 적절하다고 판단하는 방식으로 가능한 한 이른 시각에 일본 천황에게 전달하라는 훈령이 붙어 있었다. 이 전보는 대통령이 천황에게 서한을 보내고 있다는 사실을 언론에 알리고 있다고 덧붙였다.", "[주71] 1851년 5월 10일 필모어 대통령이 일본 천황에게 보낸 서한을 보라. Miller, Treaties, 제6권, 517면."], "warn": false, "pages": ["0851", "0852"], "search": "루스벨트(Franklin D. Roosevelt) — 미국 대통령 히로히토(裕仁, Hirohito) — 일본 천황 그루(Joseph Grew) — 주일 미국대사 필모어(Millard Fillmore) — 전 미국 대통령 (각주)"}, {"id": "d419", "order": 419, "date": "1941-12-07", "group": "A", "eyebrow": "d419 · Memorandum of a Conversation", "title": "회담 비망록", "badge": null, "list_right": "문서 419", "meta": [{"k": "일자", "v": "1941-12-07"}, {"k": "시각", "v": "약속 요청 1:00 p.m. → 1:45 p.m. 로 연기 요청; 국무부 도착 2:05 p.m.; 국무장관 접견 2:20 p.m."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2594⅞", "txt": true}, {"k": "발신", "v": null, "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "회담 비망록"}], "links": [{"k": "FRUS", "text": "문서 419 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d419"}], "summary": "1941년 12월 7일 오후 2시 20분, 노무라 대사와 구루스가 국무부에서 헐 국무장관에게 각서를 건넨다. 헐은 그 문서를 「극악한 허위와 왜곡으로 가득 찬」 문서라고 규탄한다. 그 회담의 기록이다.", "points": ["일본대사는 처음에 오후 1시 접견을 요청했다가, 「아직 준비가 덜 되었다」며 전화로 1시 45분으로 연기해 달라고 청했다.", "대사와 구루스는 오후 2시 5분에 국무부에 도착했고, 국무장관은 2시 20분에 이들을 접견했다.", "각주에 따르면 진주만 공습은 워싱턴 시각 12월 7일 오후 1시 20분(호놀룰루 시각 오전 7시 50분, 도쿄 시각 12월 8일 오전 3시 20분)에 있었다. 즉 문서를 건넨 시각보다 한 시간 앞선다.", "대사는 자기가 건넨 문서를 오후 1시에 전달하라는 훈령을 받았으나 전문 해독에 시간이 더 걸려 늦었다며 유감을 표했다.", "국무장관이 왜 1시로 시각을 지정했느냐고 묻자, 대사는 모르겠으며 그것이 자기가 받은 훈령이라고 답했다.", "국무장관은 「어쨌든 나는 이 문서를 두 시에 받는 것」이라고 말했다.", "두세 면을 읽은 뒤 국무장관이 이 문서가 일본 정부의 훈령에 따라 제출된 것이냐고 묻자 대사는 그렇다고 답했다.", "국무장관은 다 읽고 나서, 지난 아홉 달간 자기는 한마디도 거짓을 말한 적이 없으며, 오십 년 공직 생활에서 이토록 극악한 허위와 왜곡으로 가득 찬 문서는 본 적이 없다고 말했다.", "대사와 구루스는 아무런 논평 없이 물러갔다."], "primary": "[워싱턴,] 1941년 12월 7일.\n\n일본대사는 오후 1시에 국무장관을 만나겠다며 접견을 요청하였으나,[주72] 뒤에 전화를 걸어 대사가 아직 준비가 다 되지 않았으니 약속을 1시 45분으로 미루어 달라고 청하였다. 대사와 구루스는 오후 2시 5분에 국무부에 도착하였고, 2시 20분에 국무장관의 접견을 받았다.\n\n일본대사는 자기가 국무장관에게 건넨 문서를 오후 1시에 전달하라는 훈령을 받았으나, 전문을 해독하는 데 시간이 [787면] 더 필요하여 늦어진 것을 유감으로 생각한다고 말하였다. 국무장관은 왜 한 시로 시각을 지정하였느냐고 물었다. 대사는 모르겠으나 그것이 자기가 받은 훈령이었다고 답하였다.\n\n국무장관은 어쨌든 자기는 이 문서를 두 시에 받고 있는 것이라고 말하였다.\n\n국무장관은 두세 면을 읽은 뒤 대사에게 이 문서가 일본 정부의 훈령에 따라 제출된 것이냐고 물었다. 대사는 그렇다고 답하였다. 국무장관은 문서를 다 읽자마자 일본대사를 향하여 이렇게 말하였다.\n\n「나는 지난 아홉 달 동안 귀하(일본대사)와 나눈 모든 회담에서 단 한마디도 거짓을 말한 일이 없다고 말해 두어야겠소. 이는 기록으로 절대적으로 뒷받침되는 바요. 나의 오십 년 공직 생활을 통틀어 나는 이보다 더 극악한 허위와 왜곡으로 가득 찬 문서를 본 일이 없소 — 그 규모가 하도 거대하여 오늘까지 나는 이 지구상의 어떤 정부도 이런 말을 입 밖에 낼 수 있으리라고는 상상조차 하지 못하였소.」\n\n대사와 구루스는 그러고 나서 아무런 논평도 하지 않고 물러갔다.\n\n일본대사가 국무장관에게 건넨 문서의 사본을 첨부한다.[주73]\n\nJ[oseph] W. B[allantine]", "secondary": "[Washington,] December 7, 1941.\n\nThe Japanese Ambassador asked for an appointment to see the Secretary at 1:00 p.m., [주72] but later telephoned and asked that the appointment be postponed to 1:45 as the Ambassador was not quite ready. The Ambassador and Mr. Kurusu arrived at the Department at 2:05 p.m. and were received by the Secretary at 2:20.\n\nThe Japanese Ambassador stated that he had been instructed to deliver at 1:00 p.m. the document which he handed the Secretary, but that he was sorry that he had been delayed owing to the need [787면] of more time to decode the message. The Secretary asked why he had specified one o’clock. The Ambassador replied that he did not know but that that was his instruction.\n\nThe Secretary said that anyway he was receiving the message at two o’clock.\n\nAfter the Secretary had read two or three pages he asked the Ambassador whether this document was presented under instructions of the Japanese Government. The Ambassador replied that it was. The Secretary as soon as he had finished reading the document turned to the Japanese Ambassador and said,\n\n“I must say that in all my conversations with you (the Japanese Ambassador) during the last nine months I have never uttered one word of untruth. This is borne out absolutely by the record. In all my fifty years of public service I have never seen a document that was more crowded with infamous falsehoods and distortions—infamous falsehoods and distortions on a scale so huge that I never imagined until today that any Government on this planet was capable of uttering them.”\n\nThe Ambassador and Mr. Kurusu then took their leave without making any comment.\n\nA copy of the paper which was handed to the Secretary by the Japanese Ambassador is attached. [주73]\n\nJ[oseph] W. B[allantine]", "notes": ["[주72] 하와이 진주만에 대한 일본의 공격은 1941년 12월 7일 워싱턴 시각 오후 1시 20분(호놀룰루 시각 오전 7시 50분)에 일어났으며, 이는 도쿄 시각으로는 12월 8일 오전 3시 20분이었다. 도쿄 시각 12월 8일 오전 6시(워싱턴 시각 12월 7일 오후 4시)에 일본 대본영은 그날 「새벽」을 기하여 전쟁이 시작되었다고 발표하였다.", "[주73] 바로 다음 문서."], "warn": false, "pages": ["0853"], "search": "노무라(野村吉三郎, Nomura) — 주미 일본대사 구루스(来栖三郎, Kurusu) — 특사 헐(Cordell Hull) — 국무장관 밸런타인(Joseph W. Ballantine) — 비망록 작성자"}, {"id": "d420", "order": 420, "date": "1941-12-07", "group": "C", "eyebrow": "d420 · Memorandum Handed by the Japanese Ambassador (Nomura) to the Secretary of State at 2:20 P.M. on December 7, 1941", "title": "1941년 12월 7일 오후 2시 20분 주미 일본대사(노무라)가 국무장관에게 건넨 각서", "badge": null, "list_right": "문서 420", "meta": [{"k": "일자", "v": "1941-12-07"}, {"k": "시각", "v": "2:20 P.M."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "711.94/2594⅞", "txt": true}, {"k": "발신", "v": "The Japanese Ambassador (Nomura) 주미 일본대사 노무라", "txt": true}, {"k": "수신", "v": "The Secretary of State 국무장관", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "각서"}], "links": [{"k": "FRUS", "text": "문서 420 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d420"}], "summary": "일본 정부가 8개월에 걸친 미·일 교섭의 경위와 미국에 대한 비난을 열거한 끝에, 미국의 태도에 비추어 더 이상의 교섭을 통해서는 합의에 이르는 것이 불가능하다고 볼 수밖에 없음을 통고하는 이른바 「14부 각서」다. 진주만 공습(워싱턴 시각 오후 1시 20분)이 끝난 뒤에 전달되었다.", "points": ["제1항에서 일본 정부는 지난 4월 이래 미국 정부와 성심을 다해 교섭을 계속해 왔으며, 미국이 줄곧 고집해 온 주장과 지난 8개월간 미국·영국이 일본에 취한 조치에 관한 견해를 솔직히 밝힌다고 시작한다.", "제2항에서는 동아시아의 안정을 확보하고 세계 평화를 증진하여 모든 나라가 각기 세계에서 그 마땅한 위치를 얻게 하는 것이 일본 정부의 불변의 정책이라고 하며, 지난해 9월 독일·이탈리아와 삼국동맹을 맺은 것도 그 목적을 위해서였다고 말한다.", "제2항에서는 미·영이 충칭 정권 원조와 자산 동결로 일본과 경제 관계를 끊고 대일 포위망을 완성하여 「제국의 존립 자체를 위태롭게 하는」 사태를 빚었다고 비난한다.", "제3항에서는 11월 20일 제안(을안)의 다섯 항목을 다시 열거하고, 미국이 이를 거부했을 뿐 아니라 장제스 원조 계속 의사를 밝히고 중일 화평의 「소개자(introducer)」 역할 제의를 철회했다고 적는다.", "제3항에서는 11월 26일 미국이 일본 측 주장을 전적으로 무시한 제안(a proposal)을 했다고 하며, 각서 자신은 그것을 「최후통첩」이라 부르지 않고 「제안」이라고만 부른다.", "제4항 1호에서는 다자간 불가침조약 제의가 낡은 집단안전보장 관념을 본뜬 것으로 동아시아의 현실과 거리가 멀며, 미국의 여러 원칙은 그 즉각적 채택을 강요하려는 「공상적 이상(a Utopian ideal)」으로 보인다고 한다.", "제4항 2호에서는 미국안의 제3국과의 협정 조항이 미국이 유럽 전쟁에 참전할 때 일본이 삼국동맹상의 의무를 이행하지 못하게 하려는 것으로 보이므로 수락할 수 없다고 명시한다.", "제4항 3호에서는 경제력에 의한 압박은 때로 군사적 압박보다 더 비인도적이므로 규탄받아야 한다고 한다.", "제4항 4호에서는 지난 백여 년 동안 동아시아 나라들이 「영·미의 제국주의적 착취 정책」 아래 현상 유지를 강요당해 왔다고 하고, 인도차이나에 관한 미국안은 구화국조약과 유사한 체제의 확장이라며 거부한다.", "제4항 5호에서는 중국에 관한 미국의 요구가 난징 정부의 존재를 무시하고 충칭 이외의 정권을 지원하지 말라는 것으로 교섭의 기초 자체를 무너뜨린다고 한다.", "제5항에서는 미국안에 통상협정 체결, 동결 해제, 엔·달러 환 안정, 중국에서의 치외법권 철폐 같은 수락 가능한 항목도 있으나, 전체로 보면 지나사변 4년의 희생을 무시하고 제국의 존립을 위협하며 명예와 위신을 깎는 것이므로 교섭의 기초로 수락할 수 없다고 한다.", "제6항에서는 11월 26일 제안이 영국·오스트레일리아·네덜란드·충칭과의 빈번한 협의 끝에, 그리고 중국 문제에서는 충칭 정권의 뜻에 영합하여 나온 것이므로 이들 나라 모두가 미국과 한통속으로 일본의 입장을 무시하고 있다고 결론짓는다.", "제7항에서는 미국이 영국 등과 공모하여 일본과 중국을 계속 싸우게 함으로써 영·미의 권익을 지키려 한다고 하며, 미국 정부의 태도에 비추어 더 이상의 교섭을 통하여 합의에 이르는 것이 불가능하다고 볼 수밖에 없음을 통고한다."], "primary": "1. 일본국 정부는 두 나라가 공동의 노력으로 태평양 지역의 평화를 확보하고 이로써 세계 평화의 실현에 이바지할 수 있도록 미합중국 정부와 우호적인 양해에 이르고자 하는 진실한 소망에서, 일·미 관계의 조정과 증진 및 태평양 지역의 안정에 관하여 지난 4월 이래 미합중국 정부와 더할 나위 없는 성의로써 교섭을 계속하여 왔다.\n\n일본국 정부는 미국 정부가 집요하게 고수하여 온 주장들과 아울러 이 여덟 달 동안 미국과 영국이 일본에 대하여 취하여 온 조치들에 관하여 그 견해를 솔직하게 밝히는 영광을 가진다.\n\n2. 동아시아의 안정을 확보하고 세계 평화를 증진하며 [788면] 이로써 모든 나라가 각기 세계에서 그 마땅한 자리를 찾을 수 있게 하는 것이 일본국 정부의 불변의 정책이다.\n\n중국이 일본의 참뜻을 이해하지 못한 탓으로 지나사변이 일어난 이래로, 일본국 정부는 평화의 회복을 위하여 힘써 왔으며 전란의 확대를 막기 위하여 일관되게 최선의 노력을 기울여 왔다. 지난해 9월 일본이 독일 및 이탈리아와 삼국동맹을 체결한 것도 그 목적을 위해서였다.\n\n그러나 미국과 영국은 모두 충칭 정권을 돕기 위하여 온갖 조치에 호소함으로써 일본과 중국 사이의 전반적 평화의 수립을 방해하고, 동아시아의 안정을 향한 일본의 건설적인 노력을 훼방하여 왔다. 두 나라는 네덜란드령 동인도에 압력을 가하고 프랑스령 인도차이나를 위협함으로써 이들 지역과 협력하여 공동의 번영이라는 이상을 이루려는 일본의 열망을 좌절시키려 하였다. 나아가 일본이 프랑스와의 의정서에 따라 프랑스령 인도차이나의 공동 방위 조치를 취하였을 때, 미국과 영국 양 정부는 이를 자국 영토에 대한 위협이라고 고의로 곡해하고 네덜란드 정부를 꾀어 뒤따르게 하여 자산 동결령을 시행함으로써 일본과의 경제 관계를 끊었다. 이렇게 명백히 적대적인 태도를 드러내면서 이들 나라는 군사적 준비를 강화하여 일본에 대한 포위를 완성하였고, 제국의 존립 자체를 위태롭게 하는 사태를 빚어내었다.\n\n그럼에도 불구하고 신속한 해결을 쉽게 하기 위하여 일본국 총리는 지난 8월 태평양 전역에 걸친 양국 사이의 중요한 문제들을 논의하고자 미합중국 대통령과 만날 것을 제의하였다. 그러나 미국 정부는 일본 측의 제의를 원칙적으로 받아들이면서도 그 회담이 근본적이고 본질적인 문제들에 관하여 의견의 일치가 이루어진 뒤에 열려야 한다고 고집하였다.\n\n3. 그 뒤 9월 25일 일본국 정부는 미국 정부가 제의한 방식에 기초하여, 과거 미국 측의 주장을 충분히 고려하고 아울러 일본 측의 견해를 담은 제안을 제출하였다. 거듭된 논의로도 쉽사리 의견의 일치를 보지 못하였다. 그리하여 현 내각은 교섭에서 주된 난점이 되는 점들에 관하여 일본 측의 주장을 한층 더 완화한 수정 제안을 제출하고 해결에 이르고자 힘써 노력하였다. 그러나 미국 정부는 애초의 주장을 확고히 고수하며 조금도 화해의 정신을 보이지 않았다. 교섭은 아무런 진전을 보지 못하였다.\n\n따라서 일본국 정부는 일·미 관계의 위기를 피하기 위하여 최선을 다한다는 견지에서, 보다 본질적이고 긴급한 문제들의 공평한 해결에 이르고자 [789면] 11월 20일 또 하나의 제안을 제출하였으니, 그것은 종전의 제안을 간소화하여 다음의 점들을 규정한 것이었다.\n\n(1)\n\n일본과 미합중국 양국 정부는 프랑스령 인도차이나를 제외하고 동남아시아 및 남태평양 지역의 어느 지방에도 무력을 파견하지 않을 것을 약속한다.\n\n(2)\n\n양국 정부는 양국이 필요로 하는 물자 및 상품을 네덜란드령 동인도에서 취득함을 확보할 목적으로 협력한다.\n\n(3)\n\n양국 정부는 통상 관계를 자산 동결 이전에 있었던 상태로 회복시킬 것을 상호 약속한다.\n\n미합중국 정부는 일본에 소요되는 양의 석유를 공급한다.\n\n(4)\n\n미합중국 정부는 일본과 중국 사이의 전반적 평화 회복을 위한 노력에 해가 될 조치와 행동에 호소하지 않을 것을 약속한다.\n\n(5)\n\n일본국 정부는 일본과 중국 사이의 평화 회복 또는 태평양 지역에서의 공평한 평화의 확립이 있을 때에 현재 프랑스령 인도차이나에 주둔하고 있는 군대를 철수할 것을 약속하며, 본 협정이 체결되는 즉시 프랑스령 인도차이나 남부의 일본군을 북부로 이동시킬 용의가 있다.\n\n중국에 관하여 일본국 정부는, 앞서 제시된 바 있는 대로 일·중 간 평화의 「소개자(introducer)」로 나서겠다는 미합중국 대통령의 제의를 받아들일 용의가 있음을 밝히면서, 양 당사자가 직접 교섭을 개시하였을 때 미합중국이 중·일 평화의 회복에 해가 될 일을 아무것도 하지 않겠다는 약속을 하여 줄 것을 요청하였다.\n\n미국 정부는 위의 새 제안을 거부하였을 뿐 아니라 장제스에 대한 원조를 계속할 뜻을 밝혔으며, 위에 말한 자기의 제의에도 불구하고 아직 때가 무르익지 않았다는 구실로 일·중 간 평화의 이른바 「소개자」로 나서겠다는 대통령의 제의를 철회하였다. 마침내 11월 26일 미국 정부는 자기가 집요하게 고수하여 온 원칙들을 일본국 정부에 강요하는 태도로, 일본 측의 주장을 전적으로 무시한 제안을 내놓았으니, 이는 일본국 정부에 깊은 유감의 원인이 되는 바이다.\n\n4. 이번 교섭의 처음부터 일본국 정부는 언제나 공정하고 온건한 태도를 지켜 왔으며, 해결에 이르고자 최선을 다하여 큰 어려움을 무릅쓰고서도 가능한 모든 양보를 하였다. 교섭의 중요한 주제를 이룬 중국 문제에 관하여 일본국 정부는 더할 나위 없이 화해적인 태도를 보였다. 미국 정부가 주창하는 국제 통상에서의 비차별 원칙에 관하여, [790면] 일본국 정부는 해당 원칙이 전 세계에 걸쳐 적용되기를 바란다는 뜻을 밝혔고, 이 원칙이 세계에서 실제로 실행되어 감에 따라 일본국 정부는 중국을 포함한 태평양 지역에서도 이를 적용하도록 노력하겠다고 선언하였으며, 일본은 공평한 기초 위에서 이루어지는 제3국의 경제 활동을 중국에서 배제할 의도가 없음을 분명히 하였다. 나아가 프랑스령 인도차이나로부터의 철병 문제에 관하여도 일본국 정부는, 위에 말한 대로 사태를 완화하는 조치로서 남부 프랑스령 인도차이나로부터의 즉각적인 철병을 실행하겠다고 자진하여 나서기까지 하였다.\n\n이 모든 문제에서 일본국 정부가 더할 수 없는 정도로 보여 준 화해의 정신은 미국 정부도 충분히 인정하는 바라고 생각한다.\n\n한편 미국 정부는 언제나 현실을 도외시한 채 이론에 집착하고 그 비현실적인 원칙들에서 한 치도 물러서기를 거부함으로써 교섭에 부당한 지연을 초래하였다. 미국 정부의 이러한 태도는 이해하기 어려운 바이며, 일본국 정부는 특히 다음의 점들에 대하여 미국 정부의 주의를 환기하고자 한다.\n\n1. 미국 정부는 세계 평화의 이름으로 자기에게 유리한 원칙들을 주창하며 일본국 정부에 그 수락을 촉구한다. 세계의 평화는 사태의 현실을 인정하고 서로 상대방의 처지를 헤아림으로써 쌍방이 받아들일 수 있는 방식을 찾아내야만 비로소 이루어질 수 있다. 현실을 무시하고 자기의 이기적인 견해를 남에게 강요하는 것과 같은 태도는 교섭의 성립을 쉽게 하는 목적에 좀처럼 이바지하지 못할 것이다.\n\n미국 정부가 일·미 협정의 기초로 내놓은 여러 원칙 가운데에는 일본국 정부가 원칙적으로 받아들일 용의가 있는 것들도 있으나, 세계의 실제 사정에 비추어 볼 때 그 즉각적인 채택을 강요하려는 것은 미국 정부 쪽의 공상적인 이상에 지나지 않아 보인다.\n\n또한 일본, 미합중국, 영국, 중국, 소비에트연방, 네덜란드 및 타이 사이에 다자간 불가침조약을 체결하자는 제의는 낡은 집단안전보장 관념을 본뜬 것으로서 동아시아의 현실과는 거리가 멀다.\n\n2. 미국 측 제안에는 다음과 같이 진술하는 규정이 담겨 있었다 — 「양국 정부는 어느 한쪽이 어떤 제3국 또는 제3국들과 체결한 어떠한 협정도, 이 협정의 근본 목적인 태평양 지역 전역에 걸친 평화의 수립과 유지에 저촉되는 방식으로 그 한쪽에 의하여 해석되지 아니한다는 데 동의한다.」 위의 조항은 미합중국이 유럽의 전쟁에 참가할 때 일본이 삼국동맹상의 의무를 이행하지 못하도록 억제하려는 견지에서 제안된 것으로 생각되며, 그러한 것으로서 일본국 정부는 이를 수락할 수 없다.\n\n[791면]\n\n미국 정부는 자기의 견해와 의견에 사로잡혀 전쟁의 확대를 꾀하고 있다고 말할 수 있다. 그것은 한편으로 태평양 지역을 안정시킴으로써 자기의 배후를 확보하려 하면서, 다른 한편으로는 영국을 돕고 유럽에 새 질서를 세우려 애쓰고 있는 두 강국, 곧 독일과 이탈리아를 자위의 이름으로 공격할 준비를 하고 있다. 그러한 정책은 미국 정부가 평화적 수단으로 태평양 지역의 안정을 세우겠다며 내세우는 수많은 원칙과 전적으로 어긋난다.\n\n3. 미국 정부는 자기가 엄격히 떠받드는 원칙들에 따라 군사적 압박으로 국제 문제를 해결하는 데 반대하면서도, 영국 및 그 밖의 나라들과 함께 경제력에 의한 압박을 행사하고 있다. 국제 관계를 다루는 수단으로 그러한 압박에 의지하는 것은 때로 군사적 압박보다 더 비인도적이므로 규탄받아야 마땅하다.\n\n4. 미국 정부가 영국 및 그 밖의 강국들과 손잡고 중국에서뿐 아니라 동아시아의 다른 지역에서도 지금까지 차지하여 온 그 지배적인 지위를 유지하고 강화하려 한다는 결론에 이르지 않을 수 없다. 지난 백여 년 동안 동아시아의 나라들이 영·미의 제국주의적 착취 정책 아래 현상 유지를 지키도록 강요당하고 그 두 나라의 번영을 위하여 스스로를 희생하도록 강요당하여 왔다는 것은 역사의 사실이다. 일본국 정부는 그러한 상태가 영구히 이어지는 것을 용납할 수 없으니, 그것은 모든 나라가 각기 세계에서 그 마땅한 자리를 누리게 한다는 일본의 근본 정책에 정면으로 어긋나기 때문이다.\n\n프랑스령 인도차이나에 관하여 미국 정부가 제안한 규정은 위에 말한 미국식 정책을 잘 보여 주는 예이다. 그리하여 프랑스를 제외한 여섯 나라 — 일본, 미합중국, 영국, 네덜란드, 중국 및 타이 — 가 그들 사이에서 프랑스령 인도차이나의 영토 보전과 주권 및 통상에서의 대우 균등을 존중할 것을 약속하여야 한다는 것은 그 영토를 그 여섯 나라 정부의 공동 보장 아래 두는 것과 다름없을 것이다. 그러한 제안이 프랑스의 처지를 전적으로 무시한다는 점은 차치하더라도, 그러한 약정은 오늘날 동아시아의 곤경을 빚어낸 주된 요인인 구화국조약(九國條約) 체제와 비슷한 제도를 프랑스령 인도차이나에까지 확장하는 것으로 볼 수밖에 없다는 점에서 일본국 정부로서는 받아들일 수 없다.\n\n5. 미국 정부가 중국에 관하여 일본에 요구한 모든 항목, 이를테면 병력의 전면적 철수라든가 국제 통상에서의 비차별 원칙의 무조건적 적용 같은 것들은 중국의 실제 사정을 무시한 것이며 동아시아의 안정 요소로서의 일본의 지위를 무너뜨리려고 꾸며진 것이다. 일본에 대하여 충칭 정권 이외의 어떠한 정권도 군사적·정치적·경제적으로 지원하지 말라고 요구함으로써 난징 정부의 존재를 도외시하는 미국 정부의 태도는 이번 교섭의 기초 자체를 무너뜨린다. 미국 정부의 이 [792면] 요구는 충칭 정권에 대한 원조를 그만두기를 거부하는 위에 말한 태도와 궤를 같이하는 것으로서, 일본과 중국 사이의 정상적인 관계의 회복과 동아시아 평화의 복귀를 방해하려는 미국 정부의 의도를 명백히 보여 준다.\n\n5. 요컨대 미국 측 제안에는 통상협정의 체결을 포함한 통상에 관한 사항, 동결 제한의 상호 해제, 엔·달러 환의 안정, 또는 중국에서의 치외법권 철폐와 같이 받아들일 만한 항목들이 얼마간 담겨 있다. 그러나 다른 한편으로 문제의 제안은 지나사변 4년 동안 일본이 치른 희생을 무시하고 제국의 존립 그 자체를 위협하며 그 명예와 위신을 깎아내린다. 따라서 전체로서 보건대 일본국 정부는 그 제안을 교섭의 기초로서 받아들일 수 없음을 유감으로 여긴다.\n\n6. 일본국 정부는 교섭의 조속한 타결을 바라는 마음에서, 일·미 교섭의 타결과 동시에 영국 및 그 밖의 이해관계국들과 서명될 협정들을 제의하였다. 그 제의는 미국 정부에 의하여 받아들여졌다. 그러나 미국 정부가 11월 26일의 제안을 영국, 오스트레일리아, 네덜란드 및 충칭과의 빈번한 협의의 결과로서, 그리고 짐작건대 중국 문제에서는 충칭 정권의 바람에 영합함으로써 내놓은 이상, 이 모든 나라가 일본의 처지를 무시하는 데 미국과 한통속이라고 결론지을 수밖에 없다.\n\n7. 미국 정부가 영국 및 그 밖의 나라들과 공모하여 동아시아에 새 질서를 창건함으로써 평화를 세우려는 일본의 노력을 방해하려 한다는 것, 그리고 특히 일본과 중국을 계속 전쟁 상태에 묶어 둠으로써 영·미의 권리와 이익을 보전하려 한다는 것은 명백하다. 이러한 의도는 이번 교섭의 과정에서 뚜렷이 드러났다. 이리하여 일·미 관계를 조정하고 미국 정부와의 협력을 통하여 태평양의 평화를 보전하고 증진하려던 일본국 정부의 간절한 희망은 마침내 사라지고 말았다.\n\n일본국 정부는 미국 정부의 태도에 비추어 볼 때 더 이상의 교섭을 통하여 합의에 이르는 것은 불가능하다고 여길 수밖에 없음을 이에 미국 정부에 통고하지 않을 수 없음을 유감으로 여기는 바이다.\n\n[워싱턴,] 1941년 12월 7일.\n\n[793면]", "secondary": "1. The Government of Japan, prompted by a genuine desire to come to an amicable understanding with the Government of the United States in order that the two countries by their joint efforts may secure the peace of the Pacific Area and thereby contribute toward the realization of world peace, has continued negotiations with the utmost sincerity since April last with the Government of the United States regarding the adjustment and advancement of Japanese-American relations and the stabilization of the Pacific Area.\n\nThe Japanese Government has the honor to state frankly its views concerning the claims the American Government has persistently maintained as well as the measures the United States and Great Britain have taken toward Japan during these eight months.\n\n2. It is the immutable policy of the Japanese Government to insure the stability of East Asia and to promote world peace and [788면] thereby to enable all nations to find each its proper place in the world.\n\nEver since China Affair broke out owing to the failure on the part of China to comprehend Japan’s true intentions, the Japanese Government has striven for the restoration of peace and it has consistently exerted its best efforts to prevent the extention of war-like disturbances. It was also to that end that in September last year Japan concluded the Tripartite Pact with Germany and Italy.\n\nHowever, both the United States and Great Britain have resorted to every possible measure to assist the Chungking régime so as to obstruct the establishment of a general peace between Japan and China, interfering with Japan’s constructive endeavours toward the stabilization of East Asia. Exerting pressure on the Netherlands East Indies, or menacing French Indo-China, they have attempted to frustrate Japan’s aspiration to the ideal of common prosperity in cooperation with these regions. Furthermore, when Japan in accordance with its protocol with France took measures of joint defence of French Indo-China, both American and British Governments, wilfully misinterpreting it as a threat to their own possessions, and inducing the Netherlands Government to follow suit, they enforced the assets freezing order, thus severing economic relations with Japan. While manifesting thus an obviously hostile attitude, these Countries have strengthened their military preparations perfecting an encirclement of Japan, and have brought about a situation which endangers the very existence of the Empire.\n\nNevertheless, to facilitate a speedy settlement, the Premier of Japan proposed, in August last, to meet the President of the United States for a discussion of important problems between the two countries covering the entire Pacific area. However, the American Government, while accepting in principle the Japanese proposal, insisted that the meeting should take place after an agreement of view had been reached on fundamental and essential questions.\n\n3. Subsequently, on September 25th the Japanese Government submitted a proposal based on the formula proposed by the American Government, taking fully into consideration past American claims and also incorporating Japanese views. Repeated discussions proved of no avail in producing readily an agreement of view. The present cabinet, therefore, submitted a revised proposal, moderating still further the Japanese claims regarding the principal points of difficulty in the negotiation and endeavoured strenuously to reach a settlement. But the American Government, adhering steadfastly to its original assertions, failed to display in the slightest degree a spirit of conciliation. The negotiation made no progress.\n\nTherefore, the Japanese Government, with a view to doing its utmost for averting a crisis in Japanese-American relations, submitted [789면] on November 20th still another proposal in order to arrive at an equitable solution of the more essential and urgent questions which, simplifying its previous proposal, stipulated the following points:\n\n(1)\n\nThe Governments of Japan and the United States undertake not to dispatch armed forces into any of the regions, excepting French Indo-China, in the Southeastern Asia and the Southern Pacific area.\n\n(2)\n\nBoth Governments shall cooperate with the view to securing the acquisition in the Netherlands East Indies of those goods and commodities of which the two countries are in need.\n\n(3)\n\nBoth Governments mutually undertake to restore commercial relations to those prevailing prior to the freezing of assets.\n\nThe Government of the United States shall supply Japan the required quantity of oil.\n\n(4)\n\nThe Government of the United States undertakes not to resort to measures and actions prejudicial to the endeavours for the restoration of general peace between Japan and China.\n\n(5)\n\nThe Japanese Government undertakes to withdraw troops now stationed in French Indo-China upon either the restoration of peace between Japan and China or the establishment of an equitable peace in the Pacific Area; and it is prepared to remove the Japanese troops in the southern part of French Indo-China to the northern part upon the conclusion of the present agreement.\n\nAs regards China, the Japanese Government, while expressing its readiness to accept the offer of the President of the United States to act as “introducer” of peace between Japan and China as was previously suggested, asked for an undertaking on the part of the United States to do nothing prejudicial to the restoration of Sino-Japanese peace when the two parties have commenced direct negotiations.\n\nThe American Government not only rejected the above-mentioned new proposal, but made known its intention to continue its aid to Chiang Kai-shek; and in spite of its suggestion mentioned above, withdrew the offer of the President to act as so-called “introducer” of peace between Japan and China, pleading that time was not yet ripe for it. Finally on November 26th, in an attitude to impose upon the Japanese Government those principles it has persistently maintained, the American Government made a proposal totally ignoring Japanese claims, which is a source of profound regret to the Japanese Government.\n\n4. From the beginning of the present negotiation the Japanese Government has always maintained an attitude of fairness and moderation, and did its best to reach a settlement, for which it made all possible concessions often in spite of great difficulties. As for the China question which constituted an important subject of the negotiation, the Japanese Government showed a most conciliatory attitude. As for the principle of non-discrimination in international commerce, [790면] advocated by the American Government, the Japanese Government expressed its desire to see the said principle applied throughout the world, and declared that along with the actual practice of this principle in the world, the Japanese Government would endeavour to apply the same in the Pacific Area including China, and made it clear that Japan had no intention of excluding from China economic activities of third powers pursued on an equitable basis. Furthermore, as regards the question of withdrawing troops from French Indo-China, the Japanese Government even volunteered, as mentioned above, to carry out an immediate evacuation of troops from Southern French Indo-China as a measure of easing the situation.\n\nIt is presumed that the spirit of conciliation exhibited to the utmost degree by the Japanese Government in all these matters is fully appreciated by the American Government.\n\nOn the other hand, the American Government, always holding fast to theories in disregard of realities, and refusing to yield an inch on its impractical principles, caused undue delay in the negotiation. It is difficult to understand this attitude of the American Government and the Japanese Government desires to call the attention of the American Government especially to the following points:\n\n1. The American Government advocates in the name of world peace those principles favorable to it and urges upon the Japanese Government the acceptance thereof. The peace of the world may be brought about only by discovering a mutually acceptable formula through recognition of the reality of the situation and mutual appreciation of one another’s position. An attitude such as ignores realities and imposes one’s selfish views upon others will scarcely serve the purpose of facilitating the consummation of negotiations.\n\nOf the various principles put forward by the American Government as a basis of the Japanese-American Agreement, there are some which the Japanese Government is ready to accept in principle, but in view of the world’s actual conditions, it seems only a Utopian ideal on the part of the American Government to attempt to force their immediate adoption.\n\nAgain, the proposal to conclude a multilateral non-aggression pact between Japan, United States, Great Britain, China, the Soviet Union, the Netherlands and Thailand, which is patterned after the old concept of collective security, is far removed from the realities of East Asia.\n\n2. The American proposal contained a stipulation which states—“Both Governments will agree that no agreement, which either has concluded with any third power or powers, shall be interpreted by it in such a way as to conflict with the fundamental purpose of this agreement, the establishment and preservation of peace throughout the Pacific area.” It is presumed that the above provision has been proposed with a view to restrain Japan from fulfilling its obligations under the Tripartite Pact when the United States participates in the War in Europe, and, as such, it cannot be accepted by the Japanese Government.\n\n[791면]\n\nThe American Government, obsessed with its own views and opinions, may be said to be scheming for the extension of the war. While it seeks, on the one hand, to secure its rear by stabilizing the Pacific Area, it is engaged, on the other hand, in aiding Great Britain and preparing to attack, in the name of self-defense, Germany and Italy, two Powers that are striving to establish a new order in Europe. Such a policy is totally at variance with the many principles upon which the American Government proposes to found the stability of the Pacific Area through peaceful means.\n\n3. Whereas the American Government, under the principles it rigidly upholds, objects to settle international issues through military pressure, it is exercising in conjunction with Great Britain and other nations pressure by economic power. Recourse to such pressure as a means of dealing with international relations should be condemned as it is at times more inhumane than military pressure.\n\n4. It is impossible not to reach the conclusion that the American Government desires to maintain and strengthen, in coalition with Great Britain and other Powers, its dominant position it has hitherto occupied not only in China but in other areas of East Asia. It is a fact of history that the countries of East Asia for the past hundred years or more have been compelled to observe the status quo under the Anglo-American policy of imperialistic exploitation and to sacrifice themselves to the prosperity of the two nations. The Japanese Government cannot tolerate the perpetuation of such a situation since it directly runs counter to Japan’s fundamental policy to enable all nations to enjoy each its proper place in the world.\n\nThe stipulation proposed by the American Government relative to French Indo-China is a good exemplification of the above-mentioned American policy. Thus the six countries,—Japan, the United States, Great Britain, the Netherlands, China and Thailand,—excepting France, should undertake among themselves to respect the territorial integrity and sovereignty of French Indo-China and equality of treatment in trade and commerce would be tantamount to placing that territory under the joint guarantee of the Governments of those six countries. Apart from the fact that such a proposal totally ignores the position of France, it is unacceptable to the Japanese Government in that such an arrangement cannot but be considered as an extension to French Indo-China of a system similar to the Nine Power Treaty structure which is the chief factor responsible for the present predicament of East Asia.\n\n5. All the items demanded of Japan by the American Government regarding China such as wholesale evacuation of troops or unconditional application of the principle of non-discrimination in international commerce ignored the actual conditions of China, and are calculated to destroy Japan’s position as the stabilizing factor of East Asia. The attitude of the American Government in demanding Japan not to support militarily, politically or economically any régime other than the régime at Chungking, disregarding thereby the existence of the Nanking Government, shatters the very basis of the present negotiation. This demand [792면] of the American Government falling, as it does, in line with its above-mentioned refusal to cease from aiding the Chungking regime, demonstrates clearly the intention of the American Government to obstruct the restoration of normal relations between Japan and China and the return of peace to East Asia.\n\n5. In brief, the American proposal contains certain acceptable items such as those concerning commerce, including the conclusion of a trade agreement, mutual removal of the freezing restrictions, and stabilization of yen and dollar exchange, or the abolition of extraterritorial rights in China. On the other hand, however, the proposal in question ignores Japan’s sacrifices in the four years of the China Affair, menaces the Empire’s existence itself and disparages its honour and prestige. Therefore, viewed in its entirety, the Japanese Government regrets that it cannot accept the proposal as a basis of negotiation.\n\n6. The Japanese Government, in its desire for an early conclusion of the negotiation, proposed simultaneously with the conclusion of the Japanese-American negotiation, agreements to be signed with Great Britain and other interested countries. The proposal was accepted by the American Government. However, since the American Government has made the proposal of November 26th as a result of frequent consultation with Great Britain, Australia, the Netherlands and Chungking, and presumably by catering to the wishes of the Chungking regime in the questions of China, it must be concluded that all these countries are at one with the United States in ignoring Japan’s position.\n\n7. Obviously it is the intention of the American Government to conspire with Great Britain and other countries to obstruct Japan’s efforts toward the establishment of peace through the creation of a new order in East Asia, and especially to preserve Anglo-American rights and interests by keeping Japan and China at war. This intention has been revealed clearly during the course of the present negotiation. Thus, the earnest hope of the Japanese Government to adjust Japanese-American relations and to preserve and promote the peace of the Pacific through cooperation with the American Government has finally been lost.\n\nThe Japanese Government regrets to have to notify hereby the American Government that in view of the attitude of the American Government it cannot but consider that it is impossible to reach an agreement through further negotiations.\n\n[Washington,] December 7, 1941.\n\n[793면]", "notes": [], "warn": false, "pages": ["0854", "0855", "0856", "0857", "0858", "0859"], "search": "노무라(野村吉三郎, Nomura) — 주미 일본대사 헐(Cordell Hull) — 국무장관 루스벨트(Franklin D. Roosevelt) — 대통령(원문에는 「미합중국 대통령」으로만 나온다) 고노에(近衞文麿, Konoye) — 지난 8월 회담을 제의한 일본국 총리(원문에는 「일본국 총리」로만 나온다) 장제스(蔣介石, Chiang Kai-shek) — 충칭 국민정부 주석"}, {"id": "d421", "order": 421, "date": "1941-12-07", "group": "E", "eyebrow": "d421 · Statement by the Secretary of State, December 7, 1941  Issued by the Department of State as a press release; reprinted from Department of State, Bulletin, December 13, 1941 (vol. v, No. 129), p. 461.", "title": "국무장관 성명, 1941년 12월 7일", "badge": null, "list_right": "문서 421", "meta": [{"k": "일자", "v": "1941-12-07"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "국무부가 보도자료로 발표. Department of State, Bulletin, 1941년 12월 13일(제5권 제129호) 461면에서 전재.", "txt": true}, {"k": "발신", "v": "국무장관(the Secretary of State) — 헐(Cordell Hull)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "성명"}], "links": [{"k": "FRUS", "text": "문서 421 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d421"}], "summary": "헐이 일본의 공격을 「배신적이며 아무런 도발도 없이 가해진」 것이라 규정하고, 11월 26일 자신이 일본대사에게 건넨 문서와 이날 일본대사가 건넨 회답의 문면을 공개한다고 밝힌 성명.", "points": ["헐은 일본이 미국에 대해 「배신적이며 전혀 도발받지 않은 공격」을 가했다고 규정한다.", "일본 정부 대표들이 (그것도 일본 측 요청으로) 평화의 원칙과 방도를 논하고 있던 바로 그 시각에, 일본 군대는 여러 전략 지점에 집결하며 새로운 공격을 준비하고 있었다고 한다.", "헐은 11월 26일 자신이 일본대사에게 건넨 문서를 「미국 정부의 정책을 규율하는 원칙의 성명이자 태평양 전역을 포괄하는 전면적 평화 해결의 제안을 담은 것」이라 부른다. 최후통첩이라 부르지 않는다.", "같은 날 일본대사가 자신에게 건넨 일본 측 회답의 문면도 함께 공개한다고 밝힌다.", "「일본대사가 본국 정부의 이 최종 성명을 전달하기 전에 이미 미국에 대한 배신적 공격은 일어나 있었다」. 시각 관계를 못박은 대목이다.", "일본이 최근 내세운 평화의 뜻은 「파렴치하게 거짓되고 기만적이었음」이 이제 온 세계에 명백해졌다고 맺는다."], "primary": "1941년 12월 7일\n\n일본은 미국에 대하여 배신적이며 전혀 도발받지 않은 공격을 가했다.\n\n일본 정부의 대표들이 — 그것도 일본 측의 요청에 따라 — 이 정부의 대표들과 평화의 원칙과 방도를 논의하고 있던 바로 그 순간에, 일본의 군대는 미국을 포함하여 일본이 표면상 평화 관계에 있던 여러 나라와 국민에 대하여 새로운 공격과 새로운 침략을 개시하기 위하여 여러 전략 지점에서 준비하고 집결하고 있었다.\n\n나는 이제 미국 국민이 알 수 있도록, 미국 정부의 정책을 규율하는 원칙의 성명이자 태평양 전역을 포괄하는 전면적인 평화적 해결을 위한 제안을 담은 문서 — 1941년 11월 26일 내가 일본대사에게 건넨 그 문서 — 를 공개한다.\n\n또한 오늘 일본대사가 나에게 건넨 그에 대한 일본 측 회답의 문면도 아울러 공개한다. 일본대사가 본국 정부의 이 최종 성명을 전달하기 전에, 미국에 대한 배신적 공격은 이미 일어나 있었다.\n\n이 정부는 나라와 나라 사이의 공정한 거래, 평화, 법과 질서, 그리고 정의의 밑바탕이 되는 모든 원칙을 지켜 왔으며, 자국과 다른 모든 나라 사이에 그러한 관계를 증진하고 유지하고자 한결같이 힘써 왔다.\n\n일본이 근래에 내세운 평화에의 희망이 파렴치하게 거짓되고 기만적이었음은 이제 온 세계에 명백하다.", "secondary": "December 7, 1941\n\nJapan has made a treacherous and utterly unprovoked attack upon the United States.\n\nAt the very moment when representatives of the Japanese Government were discussing with representatives of this Government, at the request of the former, principles and courses of peace, the armed forces of Japan were preparing and assembling at various strategic points to launch new attacks and new aggressions upon nations and peoples with which Japan was professedly at peace including the United States.\n\nI am now releasing for the information of the American people the statement of principles governing the policies of the Government of the United States and setting out suggestions for a comprehensive peaceful settlement covering the entire Pacific area, which I handed to the Japanese Ambassador on November 26, 1941.\n\nI am likewise releasing the text of a Japanese reply thereto which was handed to me by the Japanese Ambassador today. Before the Japanese Ambassador delivered this final statement from his Government the treacherous attack upon the United States had taken place.\n\nThis Government has stood for all the principles that underlie fair-dealing, peace, law and order, and justice between nations and has steadfastly striven to promote and maintain that state of relations between itself and all other nations.\n\nIt is now apparent to the whole world that Japan in its recent professions of a desire for peace has been infamously false and fraudulent.", "notes": [], "warn": false, "pages": [], "search": "헐(Cordell Hull) — 국무장관, 성명의 화자 노무라(野村吉三郎, Nomura) — 주미 일본대사. 원문에는 「일본대사」로만 적혀 있다"}, {"id": "d422", "order": 422, "date": "1941-12-08", "group": "E", "eyebrow": "d422 · Message by President Roosevelt to Congress, December 8, 1941  Issued by the White House as a press release; reprinted from ibid., p. 474.", "title": "1941년 12월 8일 루스벨트 대통령이 의회에 보낸 교서", "badge": null, "list_right": "문서 422", "meta": [{"k": "일자", "v": "1941-12-08"}, {"k": "시각", "v": null}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "Issued by the White House as a press release; reprinted from ibid., p. 474.", "txt": true}, {"k": "발신", "v": "루스벨트 대통령(Franklin D. Roosevelt)", "txt": true}, {"k": "수신", "v": "미합중국 의회(the Congress of the United States)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "연설"}], "links": [{"k": "FRUS", "text": "문서 422 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d422"}], "summary": "루스벨트가 12월 7일 일본의 기습 공격을 의회에 보고하고, 12월 7일 일요일 이래 미국과 일본제국 사이에 전쟁 상태가 존재함을 선언해 줄 것을 요청한다.", "points": ["「어제, 1941년 12월 7일 — 오욕 속에 살아남을 날짜 — 미합중국은 일본제국의 해군과 항공 병력에게 돌연히 그리고 고의로 공격당했다.」", "미국은 그 나라와 평화 상태에 있었고, 일본의 간청으로 태평양의 평화 유지를 바라보며 일본 정부 및 그 천황과 여전히 회담 중이었다.", "일본 항공 편대가 오아후에서 폭격을 시작한 지 한 시간 뒤에 주미 일본대사와 그 동료가 최근의 미국 측 메시지에 대한 정식 회답을 국무장관에게 전달했다. 그 회답은 현재의 외교 교섭을 계속하는 것이 무익해 보인다고 했을 뿐, 전쟁이나 무력 공격의 위협이나 암시는 담고 있지 않았다.", "하와이와 일본 사이의 거리로 보아 이 공격이 여러 날 혹은 여러 주 전에 고의로 계획되었음이 명백하며, 그동안 일본 정부는 거짓 진술과 평화 지속의 희망 표명으로 미국을 속이려 고의로 애썼다고 기록될 것이다.", "어제 하와이 제도 공격으로 미 해군과 육군 병력에 심각한 손해가 났고 매우 많은 미국인이 목숨을 잃었으며, 샌프란시스코와 호놀룰루 사이 공해에서 미국 선박이 어뢰 공격을 받았다는 보고도 있다.", "어제 말라야, 간밤에 홍콩·괌·필리핀 제도·웨이크섬, 오늘 아침 미드웨이섬이다. 일본은 태평양 전역에 걸친 기습 공세를 감행했다.", "육해군 총사령관으로서 방위를 위한 모든 조치를 취하도록 지시했으며, 이 계획된 침략을 이겨 내는 데 얼마가 걸리든 미국 국민은 정의로운 힘으로 절대적 승리를 거둘 것이라고 말한다.", "「나는 의회가, 12월 7일 일요일 일본의 도발 없는 비겁한 공격 이래 미합중국과 일본제국 사이에 전쟁 상태가 존재해 왔음을 선언할 것을 요청한다.」"], "primary": "미합중국 의회에:\n\n어제, 1941년 12월 7일 — 오욕 속에 살아남을 날짜 — 미합중국은 일본제국의 해군 및 항공 병력에게 돌연히 그리고 고의로 공격당했습니다.\n\n미합중국은 그 나라와 평화 상태에 있었고, 일본의 간청에 따라 태평양의 평화 유지를 내다보면서 그 정부 및 그 천황과 여전히 회담을 하고 있었습니다. 실로 일본 항공 편대가 오아후에서 폭격을 시작한 지 한 시간 뒤에, 주미 일본대사와 그의 동료가 최근의 미국 측 메시지에 대한 정식 회답을 국무장관에게 전달했습니다. 이 회답은 현존하는 외교 교섭을 계속하는 것이 무익해 보인다고 진술하기는 했으나, 전쟁이나 무력 공격에 관한 어떠한 위협도 암시도 담고 있지 않았습니다.\n\n[794면]\n\n하와이가 일본으로부터 떨어진 거리로 보아 이 공격이 여러 날, 아니 여러 주 전에 고의로 계획된 것임이 명백하다는 사실은 기록에 남을 것입니다. 그 사이의 시간 동안 일본 정부는 거짓된 진술과 평화 지속에 대한 희망의 표명으로 미합중국을 속이려고 고의로 애썼습니다.\n\n어제 하와이 제도에 가해진 공격은 미국의 해군 및 육군 병력에 심각한 손해를 입혔습니다. 매우 많은 미국인의 생명이 희생되었습니다. 그 밖에 샌프란시스코와 호놀룰루 사이의 공해에서 미국 선박들이 어뢰 공격을 받았다는 보고가 있습니다.\n\n어제 일본 정부는 말라야에 대해서도 공격을 개시했습니다.\n\n간밤에 일본군은 홍콩을 공격했습니다.\n\n간밤에 일본군은 괌을 공격했습니다.\n\n간밤에 일본군은 필리핀 제도를 공격했습니다.\n\n간밤에 일본군은 웨이크섬을 공격했습니다.\n\n오늘 아침 일본군은 미드웨이섬을 공격했습니다.\n\n따라서 일본은 태평양 지역 전역에 걸친 기습 공세를 감행한 것입니다. 어제의 사실들은 그 자체로 말해 줍니다. 미합중국 국민은 이미 자기들의 견해를 세웠으며, 그것이 우리 국가의 바로 그 생명과 안전에 대해 갖는 의미를 잘 이해하고 있습니다.\n\n육군과 해군의 총사령관으로서 나는 우리의 방위를 위한 모든 조치를 취하도록 지시했습니다.\n\n우리는 우리에게 가해진 그 맹습의 성격을 언제까지나 기억할 것입니다.\n\n이 미리 꾸며진 침략을 이겨 내는 데 우리에게 얼마나 오랜 시간이 걸리든, 미국 국민은 그 정의로운 힘으로 절대적 승리에 이르러 낼 것입니다.\n\n우리가 우리 자신을 끝까지 지킬 뿐만 아니라 이러한 형태의 배신이 다시는 우리를 위태롭게 하지 못하도록 반드시 확실히 하겠다고 단언할 때, 나는 의회와 국민의 뜻을 옮기고 있다고 믿습니다.\n\n적대 행위가 존재합니다. 우리 국민과 우리 영토와 우리 이익이 중대한 위험에 처해 있다는 사실은 눈감아 넘길 수 없습니다.\n\n우리 군대에 대한 확신을 가지고 — 우리 국민의 한없는 결의를 가지고 — 우리는 필연적인 승리를 얻을 것입니다 — 하느님이여 도우소서.\n\n나는 의회가, 12월 7일 일요일 일본의 도발 없는 비겁한 공격 이래 미합중국과 일본제국 사이에 전쟁 상태가 존재해 왔음을 선언할 것을 요청합니다.\n\nFranklin D. Roosevelt (프랭클린 D. 루스벨트)\n\n백악관, 1941년 12월 8일.\n\n[795면]", "secondary": "To the Congress of the United States:\n\nYesterday, December 7, 1941—a date which will live in infamy—the United States of America was suddenly and deliberately attacked by naval and air forces of the Empire of Japan.\n\nThe United States was at peace with that Nation and, at the solicitation of Japan, was still in conversation with its Government and its Emperor looking toward the maintenance of peace in the Pacific. Indeed, one hour after Japanese air squadrons had commenced bombing in Oahu, the Japanese Ambassador to the United States and his colleague delivered to the Secretary of State a formal reply to a recent American message. While this reply stated that it seemed useless to continue the existing diplomatic negotiations, it contained no threat or hint of war or armed attack.\n\n[794면]\n\nIt will be recorded that the distance of Hawaii from Japan makes it obvious that the attack was deliberately planned many days or even weeks ago. During the intervening time the Japanese Government has deliberately sought to deceive the United States by false statements and expressions of hope for continued peace.\n\nThe attack yesterday on the Hawaiian Islands has caused severe damage to American naval and military forces. Very many American lives have been lost. In addition American ships have been reported torpedoed on the high seas between San Francisco and Honolulu.\n\nYesterday the Japanese Government also launched an attack against Malaya.\n\nLast night Japanese forces attacked Hong Kong.\n\nLast night Japanese forces attacked Guam.\n\nLast night Japanese forces attacked the Philippine Islands.\n\nLast night the Japanese attacked Wake Island.\n\nThis morning the Japanese attacked Midway Island.\n\nJapan has, therefore, undertaken a surprise offensive extending throughout the Pacific area. The facts of yesterday speak for themselves. The people of the United States have already formed their opinions and well understand the implications to the very life and safety of our Nation.\n\nAs Commander-in-Chief of the Army and Navy I have directed that all measures be taken for our defense.\n\nAlways will we remember the character of the onslaught against us.\n\nNo matter how long it may take us to overcome this premeditated invasion, the American people in their righteous might will win through to absolute victory.\n\nI believe I interpret the will of the Congress and of the people when I assert that we will not only defend ourselves to the uttermost but will make very certain that this form of treachery shall never endanger us again.\n\nHostilities exist. There is no blinking at the fact that our people, our territory, and our interests are in grave danger.\n\nWith confidence in our armed forces—with the unbounded determination of our people—we will gain the inevitable triumph—so help us God.\n\nI ask that the Congress declare that since the unprovoked and dastardly attack by Japan on Sunday, December seventh, a state of war has existed between the United States and the Japanese Empire.\n\nFranklin D. Roosevelt\n\nThe White House, December 8, 1941.\n\n[795면]", "notes": [], "warn": false, "pages": ["0860", "0861"], "search": "루스벨트(Franklin D. Roosevelt) — 미합중국 대통령 노무라(野村吉三郎, Nomura) — 주미 일본대사(본문에는 「주미 일본대사」로만 표기) 구루스(来栖三郎, Kurusu) — 특사(본문에는 「그의 동료」로만 표기) 헐(Cordell Hull) — 국무장관(본문에는 「국무장관」으로만 표기) 히로히토(Hirohito) — 천황(본문에는 'its Emperor'로만 표기)"}, {"id": "d423", "order": 423, "date": "1941-12-08", "group": "E", "eyebrow": "d423 · Declaration by the United States of America of a State of War With Japan, December 8, 1941  Reprinted from Department of State, Bulletin, December 13, 1941 (vol. v, No. 129), p. 475.", "title": "미합중국의 대일 전쟁상태 선언, 1941년 12월 8일", "badge": null, "list_right": "문서 423", "meta": [{"k": "일자", "v": "1941-12-08"}, {"k": "시각", "v": "1941년 12월 8일 오후 4시 10분, 동부 표준시(E. S. T.) — 승인 시각"}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "전문번호", "v": null}, {"k": "원문출처", "v": "Reprinted from Department of State, Bulletin, December 13, 1941 (vol. v, No. 129), p. 475. (국무부 『불레틴』 1941년 12월 13일자, 제5권 제129호, 475면에서 전재)", "txt": true}, {"k": "발신", "v": "United States Congress 미합중국 의회", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "결의"}], "links": [{"k": "FRUS", "text": "문서 423 원문", "url": "https://history.state.gov/historicaldocuments/frus1931-41v02/d423"}], "summary": "미국 의회가 일본 제국 정부와 미합중국 정부 및 국민 사이에 전쟁상태가 존재함을 정식으로 선언하고, 대통령에게 육해군 전력의 사용을 수권하는 합동결의.", "points": ["표제는 「합동결의(Joint Resolution)」이며, 일본 제국 정부와 미합중국 정부 및 국민 사이에 전쟁상태가 존재함을 선언하고 그 수행을 위한 규정을 두는 것이다.", "전문(前文)은 일본 제국 정부가 미합중국 정부와 국민에 대하여 「도발받지 않은 전쟁 행위(unprovoked acts of war)」를 저질렀다고 적는다.", "결의는 전쟁상태를 새로 창설한다고 하지 않고, 미국에 「떠안겨진(thrust upon)」 전쟁상태를 이에 정식으로 선언한다고 적는다.", "대통령에게 미합중국의 해군 및 육군 전력 전부와 정부의 자원을 사용할 것을 수권하고 또한 지시한다.", "분쟁을 성공적으로 종결시키기 위하여 의회가 이 나라의 자원 전부를 서약한다.", "승인 시각이 1941년 12월 8일 오후 4시 10분 동부 표준시로 명기되어 있다."], "primary": "일본 제국 정부와 미합중국 정부 및 국민 사이에 전쟁상태가 존재함을 선언하고 그 수행을 위한 규정을 두는 합동결의.\n\n일본 제국 정부가 미합중국의 정부와 국민에 대하여 도발받지 않은 전쟁 행위를 저질렀으므로, 이에\n\n미합중국 상원 및 하원은 의회에 모여 다음과 같이 결의한다. 즉, 이렇게 미합중국에 떠안겨진 미합중국과 일본 제국 정부 사이의 전쟁상태를 이에 정식으로 선언하며, 대통령에게 미합중국의 해군 및 육군 전력 전부와 정부의 자원을 사용하여 일본 제국 정부에 대한 전쟁을 수행할 것을 이에 수권하고 또한 지시한다. 그리고 이 분쟁을 성공적으로 종결시키기 위하여 이 나라의 자원 전부를 이에 미합중국 의회가 서약한다.\n\n1941년 12월 8일 오후 4시 10분, 동부 표준시에 승인됨.\n\n[799면]", "secondary": "Joint Resolution Declaring that a state of war exists between the Imperial Government of Japan and the Government and the people of the United States and making provisions to prosecute the same.\n\nWhereas the Imperial Government of Japan has committed unprovoked acts of war against the Government and the people of the United States of America: Therefore be it\n\nResolved by the Senate and House of Representatives of the United States of America in Congress assembled, That the state of war between the United States and the Imperial Government of Japan which has thus been thrust upon the United States is hereby formally declared; and the President is hereby authorized and directed to employ the entire naval and military forces of the United States and the resources of the Government to carry on war against the Imperial Government of Japan; and, to bring the conflict to a successful termination, all of the resources of the country are hereby pledged by the Congress of the United States.\n\nApproved, December 8, 1941, 4:10 p.m., E. S. T.\n\n[799면]", "notes": [], "warn": false, "pages": ["0862", "0863", "0864", "0865"], "search": ""}]</script>
