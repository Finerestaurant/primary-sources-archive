11-28", "label": "테헤란 회담", "bar": true, "where": "테헤란", "note": "루스벨트·처칠·스탈린의 첫 3자 회담. 유럽 제2전선(노르망디)의 시기가 정해졌고, 스탈린은 독일 항복 뒤 대일전 참전을 처음으로 시사했다."}, {"id": "1944-06-06", "date": "1944-06-06", "label": "노르망디 상륙", "bar": true, "note": "연합군이 프랑스 북부에 상륙해 서부 제2전선이 열렸다. 유럽 전쟁의 승패가 사실상 이때 갈렸고, 미국 안에서 「그다음은 일본」이라는 계산이 본격화된다."}, {"id": "1944-07-25", "date": "1944-07-25", "label": "항복문서 완성", "bar": true, "key": true, "where": "런던 유럽자문위원회", "note": "유럽자문위원회가 「독일의 무조건 항복」 본문을 확정했다. 독일이 항복하기 아홉 달 전이고, 파리가 해방되기 한 달 전이다. 이 뒤의 넉 달은 새로 쓰는 것이 아니라 손질하는 기간이며, 정작 1945년 5월 7일 랭스에서는 지연을 우려해 이 문서 대신 간이 「항복문서」를 쓴다."}, {"id": "1944-10-20", "date": "1944-10-20", "label": "레이테 상륙", "bar": true, "where": "필리핀", "note": "맥아더가 필리핀 탈환에 착수했다. 뒤이은 레이테만 해전에서 일본 연합함대가 무너져, 일본 본토와 남방 자원지대를 잇는 해상 수송로가 끊긴다."}, {"id": "1944-12-22", "date": "1944-12-22", "docs": [["machinery-1945", "d486"]]}, {"id": "1944-12-28", "date": "1944-12-28", "docs": [["surrender-1945", "d368"]]}, {"id": "1945-01", "date": "1945-01", "docs": [["surrender-1945", "d340"]]}, {"id": "1945-01-03", "date": "1945-01-03", "docs": [["surrender-1945", "d370"]]}, {"id": "1945-01-04", "date": "1945-01-04", "docs": [["machinery-1945", "d130"]]}, {"id": "1945-01-25", "date": "1945-01-25", "docs": [["machinery-1945", "d139"]]}, {"id": "1945-02-04", "date": "1945-02-04", "label": "얄타 회담", "bar": true, "key": true, "where": "크림반도 얄타", "note": "루스벨트·처칠·스탈린의 두 번째 3자 회담. 소련의 대일 참전 조건이 비밀협정으로 정해졌고, 루스벨트가 스탈린에게 조선의 신탁통치를 꺼내며 「20년에서 30년」이라 말했다. 카이로의 「적당한 시기」에 처음으로 숫자가 붙은 자리다."}, {"id": "1945-02-08", "date": "1945-02-08", "docs": [["yalta-1945", "d393"]]}, {"id": "1945-02-08-1", "date": "1945-02-08", "docs": [["machinery-1945", "d149"]]}, {"id": "1945-03-09", "date": "1945-03-09", "docs": [["mofa-1945", "d949"]]}, {"id": "1945-03-10", "date": "1945-03-10", "label": "도쿄 대공습", "bar": true, "note": "B-29 편대의 야간 소이탄 공습으로 도쿄 시가지가 불탔다. 하룻밤 사망자가 10만 명 안팎으로 추정된다. 일본 안에서 본토 방위가 불가능하다는 인식이 퍼지기 시작한다."}, {"id": "1945-03-14", "date": "1945-03-14", "docs": [["machinery-1945", "d488"]]}, {"id": "1945-03-18", "date": "1945-03-18", "docs": [["field-1945", "tf58-2"]]}, {"id": "1945-03-23", "date": "1945-03-23", "docs": [["machinery-1945", "d161"]]}, {"id": "1945-03-30", "date": "1945-03-30", "docs": [["machinery-1945", "d165"]]}, {"id": "1945-04", "date": "1945-04", "docs": [["surrender-1945", "d343"]]}, {"id": "1945-04-01", "date": "1945-04-01", "label": "오키나와 전투", "bar": true, "note": "미군이 오키나와에 상륙해 6월까지 싸웠다. 사상자 규모가 본토 상륙전의 비용을 가늠하는 근거가 되어, 원폭 사용과 소련 참전 요청 양쪽의 논거로 쓰인다."}, {"id": "1945-04-05", "date": "1945-04-05", "docs": [["machinery-1945", "d172"]]}, {"id": "1945-04-06", "date": "1945-04-06", "docs": [["field-1945", "tf58-3"]]}, {"id": "1945-04-11", "date": "1945-04-11", "docs": [["field-1945", "tf58-4"]]}, {"id": "1945-04-12", "date": "1945-04-12", "label": "루스벨트 사망", "bar": true, "note": "루스벨트가 급서하고 트루먼이 승계했다. 트루먼은 얄타의 비밀협정도 원폭 개발도 취임 뒤에야 통보받았다. 조선 신탁통치 구상을 밀던 사람이 사라진 자리다."}, {"id": "1945-04-14", "date": "1945-04-14", "docs": [["machinery-1945", "d178"]]}, {"id": "1945-04-15", "date": "1945-04-15", "docs": [["machinery-1945", "d179"]]}, {"id": "1945-04-18", "date": "1945-04-18", "docs": [["machinery-1945", "d181"]]}, {"id": "1945-04-22", "date": "1945-04-22", "docs": [["machinery-1945", "d59"]]}, {"id": "1945-04-23", "date": "1945-04-23", "docs": [["machinery-1945", "d187"]]}, {"id": "1945-04-23-1", "date": "1945-04-23", "docs": [["machinery-1945", "d495"]]}, {"id": "1945-04-24", "date": "1945-04-24", "docs": [["machinery-1945", "d189"]]}, {"id": "1945-04-25", "date": "1945-04-25", "label": "힘러의 항복 제의", "bar": true, "key": true, "where": "뤼베크 · 스톡홀름", "note": "힘러가 4월 24일 새벽 뤼베크에서 베르나도테 백작을 만나, 서부전선만 아이젠하워에게 항복하겠다며 스웨덴 정부에 전달을 부탁했다. 히틀러가 뇌출혈로 이미 죽었거나 이틀을 넘기지 못한다는 말도 함께 전해진다. 트루먼과 처칠은 전화로 3국 동시 무조건항복 외에는 없다고 못 박는다."}, {"id": "1945-04-25-1", "date": "1945-04-25", "docs": [["veday-1945", "d548"]]}, {"id": "1945-04-25-2", "date": "1945-04-25", "docs": [["veday-1945", "d550"]]}, {"id": "1945-04-25-3", "date": "1945-04-25", "docs": [["veday-1945", "d549"]]}, {"id": "1945-04-28", "date": "1945-04-28", "docs": [["veday-1945", "d557"]]}, {"id": "1945-04-30", "date": "1945-04-30", "label": "히틀러 자살", "bar": true, "where": "베를린 총통관저", "note": "베를린 지하에서 히틀러가 자살하고 되니츠가 승계한다. 되니츠는 전쟁을 계속하겠다고 말했고, 연합국은 히틀러가 순교자로 남는 전설이 만들어지지 않도록 5월 2일 성명을 낸다.", "docs": [["veday-1945", "d75"]]}, {"id": "1945-05-01", "date": "1945-05-01", "docs": [["veday-1945", "d205"]]}, {"id": "1945-05-01-1", "date": "1945-05-01", "docs": [["veday-1945", "d203"]]}, {"id": "1945-05-02", "date": "1945-05-02", "label": "베를린 함락", "bar": true, "where": "베를린", "note": "소련군이 베를린을 함락했다. 이틀 전 히틀러가 자살했고 남은 것은 항복 절차뿐이었다. 미국 문서에 히틀러의 죽음은 부고가 아니라 「항복문서에 서명할 능력이 있는 중앙 권력이 없을 경우」라는 가정으로 나타난다.", "docs": [["veday-1945", "d560"]]}, {"id": "1945-05-04", "date": "1945-05-04", "docs": [["veday-1945", "d561"]]}, {"id": "1945-05-04-1", "date": "1945-05-04", "docs": [["veday-1945", "d562"]]}, {"id": "1945-05-04-2", "date": "1945-05-04", "docs": [["veday-1945", "d212"]]}, {"id": "1945-05-07", "date": "1945-05-07", "docs": [["veday-1945", "d566"]]}, {"id": "1945-05-07-1", "date": "1945-05-07", "docs": [["veday-1945", "d567"]]}, {"id": "1945-05-08", "date": "1945-05-08", "label": "독일 항복", "bar": true, "key": true, "where": "랭스 · 베를린", "note": "5월 7일 새벽 2시 41분 랭스에서 서명이 끝났으나, 발표는 8일까지 묶여 있었다. 스탈린은 동부전선에서 항복 명령이 이행될지 확실치 않다며 소련의 발표를 9일로 미뤘고, 8일 밤 베를린에서 다시 서명한다. 그날 서명한 것은 유럽자문위원회가 여덟 달 다듬어 온 항복문서가 아니라 초기 군사 조항만 담은 간이 문서였다.", "docs": [["veday-1945", "d224"]]}, {"id": "1945-05-10", "date": "1945-05-10", "docs": [["mofa-1945", "d951"]]}, {"id": "1945-05-10-1", "date": "1945-05-10", "docs": [["veday-1945", "d357"]]}, {"id": "1945-05-11", "date": "1945-05-11", "docs": [["surrender-1945", "d349"]]}, {"id": "1945-05-11-1", "date": "1945-05-11", "docs": [["field-1945", "tf58-5"]]}, {"id": "1945-05-12", "date": "1945-05-12", "docs": [["veday-1945", "d235"]]}, {"id": "1945-05-18", "date": "1945-05-18", "docs": [["mofa-1945", "d953"]]}, {"id": "1945-05-21", "date": "1945-05-21", "docs": [["surrender-1945", "d355"]]}, {"id": "1945-05-28", "date": "1945-05-28", "docs": [["surrender-1945", "d379"]]}, {"id": "1945-06-22", "date": "1945-06-22", "docs": [["surrender-1945", "d358"]]}, {"id": "1945-06-27", "date": "1945-06-27", "docs": [["surrender-1945", "d385"]]}, {"id": "1945-06-30", "date": "1945-06-30", "docs": [["mofa-1945", "d960"]]}, {"id": "1945-07-16", "date": "1945-07-16", "docs": [["surrender-1945", "d361"]]}, {"id": "1945-07-17", "date": "1945-07-17", "label": "포츠담 회담", "bar": true, "where": "베를린 근교 포츠담", "note": "트루먼·처칠(뒤에 애틀리)·스탈린의 회담. 회담 중 원폭 실험 성공이 보고되고, 대일 최후통첩의 문안이 다듬어진다."}, {"id": "1945-07-21", "date": "1945-07-21", "docs": [["mofa-1945", "d964"]]}, {"id": "1945-07-26", "date": "1945-07-26", "label": "포츠담 선언", "bar": true, "note": "미·영·중 명의로 일본에 무조건 항복을 요구했다. 제8항에 「카이로 선언의 조항은 이행되어야 한다」고 못박아, 조선 독립 약속이 항복 조건 안으로 들어온다. 일본은 이를 묵살(黙殺)한다고 발표했다."}, {"id": "1945-07-27", "date": "1945-07-27", "docs": [["mofa-1945", "d1079"]]}, {"id": "1945-08", "date": "1945-08", "docs": [["frus-1945", "d771"]]}, {"id": "1945-08-02", "date": "1945-08-02", "docs": [["surrender-1945", "d364"]]}, {"id": "1945-08-04", "date": "1945-08-04", "docs": [["surrender-1945", "d390"]]}, {"id": "1945-08-06", "date": "1945-08-06", "label": "히로시마", "bar": true, "key": true, "note": "히로시마에 원자폭탄이 투하됐다. 트루먼은 같은 날 성명을 내 「이제껏 없던 폭탄」임을 알리고 항복하지 않으면 파멸이 이어질 것이라 경고했다.", "disp": "08.06", "docs": [["surrender-1945", "d401"]]}, {"id": "1945-08-08", "date": "1945-08-08", "label": "소련 참전", "bar": true, "note": "소련이 일본에 선전포고하고 이튿날 만주로 진공했다. 얄타에서 약속한 「독일 항복 뒤 3개월」을 지킨 날짜다. 미국이 조선에 지상군을 두려면 시간이 없다는 것이 이날 분명해진다.", "disp": "08.08", "docs": [["surrender-1945", "d402"]]}, {"id": "1945-08-09", "date": "1945-08-09", "label": "나가사키", "bar": true, "note": "나가사키에 두 번째 원자폭탄이 투하됐다. 같은 날 밤 어전회의가 열려 국체 유지를 조건으로 한 항복 제의가 정해진다.", "docs": [["mofa-1945", "d1085"]]}, {"id": "1945-08-10", "date": "1945-08-10", "disp": "08.10", "docs": [["surrender-1945", "d406"]]}, {"id": "1945-08-10-1", "date": "1945-08-10", "disp": "08.10 06:45", "docs": [["mofa-1945", "d1086"]]}, {"id": "1945-08-10-2", "date": "1945-08-10", "disp": "08.10 18:00", "docs": [["mofa-1945", "d1091"]]}, {"id": "1945-08-11", "date": "1945-08-11", "label": "38선 획정", "bar": true, "key": true, "note": "일반명령 제1호(SWNCC 21/5)가 고쳐지면서 조선이 북위 38도로 갈렸다. 한 문서의 b항과 f항, 다섯 조항 사이에 조선이 둘로 나뉘어 적혔다. 합참이 든 이유는 미군에게 경성의 항만과 교통 지역을 주기 위해서였다.", "docs": [["surrender-1945", "d418"]]}, {"id": "1945-08-11-1", "date": "1945-08-11", "disp": "08.11", "docs": [["surrender-1945", "d410"]]}, {"id": "1945-08-11-2", "date": "1945-08-11", "disp": "08.11", "docs": [["surrender-1945", "d412"]]}, {"id": "1945-08-11-3", "date": "1945-08-11", "disp": "08.11", "docs": [["surrender-1945", "d418"]]}, {"id": "1945-08-11-4", "date": "1945-08-11", "disp": "08.11 10:46", "docs": [["surrender-1945", "d413"]]}, {"id": "1945-08-11-5", "date": "1945-08-11", "disp": "08.11 밤", "docs": [["mofa-1945", "d1093"]]}, {"id": "1945-08-12", "date": "1945-08-12", "disp": "08.12", "docs": [["surrender-1945", "d425"]]}, {"id": "1945-08-12-1", "date": "1945-08-12", "disp": "08.12", "docs": [["surrender-1945", "d427"]]}, {"id": "1945-08-14", "date": "1945-08-14", "disp": "08.14", "docs": [["surrender-1945", "d442"]]}, {"id": "1945-08-14-1", "date": "1945-08-14", "disp": "08.14", "docs": [["surrender-1945", "d431"]]}, {"id": "1945-08-14-2", "date": "1945-08-14", "disp": "08.14", "docs": [["surrender-1945", "d437"]]}, {"id": "1945-08-14-3", "date": "1945-08-14", "disp": "08.14", "docs": [["mofa-1945", "d1098"]]}, {"id": "1945-08-14-4", "date": "1945-08-14", "disp": "08.14 20:05", "docs": [["mofa-1945", "d1097"]]}, {"id": "1945-08-14-5", "date": "1945-08-14", "disp": "08.14 20:10", "docs": [["surrender-1945", "d440"]]}, {"id": "1945-08-15", "date": "1945-08-15", "label": "일본 항복", "bar": true, "key": true, "note": "일본이 포츠담 선언 수락을 방송으로 알렸다. 전날 밤 일부 장교들이 방송을 막으려 궁성을 봉쇄하고 총리 관저를 습격했으나 실패했고, 아나미 육군대신은 새벽에 자결했다.", "disp": "08.15", "docs": [["mofa-1945", "d1100"]]}, {"id": "1945-09-02", "date": "1945-09-02", "label": "항복문서 조인", "bar": true, "where": "도쿄만 미주리함", "note": "도쿄만의 미주리함 위에서 항복문서에 서명했다. 이 문서로 연합국최고사령관(SCAP)의 권한이 발효되고, 일반명령 제1호가 법적 효력을 갖는다."}, {"id": "1945-09-08", "date": "1945-09-08", "label": "미군 인천 상륙", "bar": true, "key": true, "note": "하지 중장의 제24군단이 인천에 상륙해 이튿날 조선총독부의 항복을 받았다. 미군정이 시작된다. 닷새 뒤 하지는 카이로의 「in due course」가 조선어로 「수일 내」로 옮겨져 퍼져 있었다는 것을 알게 된다."}, {"id": "1945-09-09", "date": "1945-09-09", "docs": [["scap-0141", "1"]]}, {"id": "1945-09-13", "date": "1945-09-13", "docs": [["scap-0141", "2"]]}, {"id": "1945-09-24", "date": "1945-09-24", "docs": [["scap-0141", "2-B"]]}, {"id": "1945-09-27", "date": "1945-09-27", "disp": "09.27", "docs": [["surrender-1945", "d507"]]}, {"id": "1945-10-10", "date": "1945-10-10", "disp": "10.10", "docs": [["surrender-1945", "d526"]]}, {"id": "1945-11-13", "date": "1945-11-13", "docs": [["field-1945", "toyoda-2"]]}, {"id": "1945-11-13-1", "date": "1945-11-13", "docs": [["field-1945", "toyoda-5"]]}, {"id": "1945-11-14", "date": "1945-11-14", "docs": [["field-1945", "toyoda-7"]]}, {"id": "1945-11-14-1", "date": "1945-11-14", "docs": [["field-1945", "toyoda-8"]]}, {"id": "1945-11-23", "date": "1945-11-23", "disp": "11.23", "docs": [["surrender-1945", "d488"]]}, {"id": "1945-12-27", "date": "1945-12-27", "label": "모스크바 3상회의", "bar": true, "key": true, "note": "미·영·소 외상이 조선에 최대 5년의 신탁통치를 두고 미소공동위원회를 설치하기로 합의했다. 카이로의 「적당한 시기」가 마침내 문서상의 기한이 된 자리이자, 조선 안에서 신탁통치 반대 운동이 폭발한 계기다."}, {"id": "1946-01", "date": "1946-01", "docs": [["scap-0141", "6"]]}, {"id": "1946-03-20", "date": "1946-03-20", "label": "1차 미소공동위", "bar": true, "where": "서울", "note": "임시정부 수립을 협의할 미소공동위원회가 열렸다. 어느 정당·사회단체와 협의할 것인가를 두고 갈라져 5월에 결렬된다."}, {"id": "1946-04", "date": "1946-04", "docs": [["scap-0141", "7-J"]]}, {"id": "1946-10-01", "date": "1946-10-01", "label": "대구 10월 사건", "bar": true, "note": "식량 공출과 경찰에 대한 항의가 대구에서 시작해 남한 전역으로 번졌다. 미군정이 계엄을 선포하고 진압했다. 점령 1년 만에 통치의 정당성이 시험대에 오른 사건이다."}, {"id": "1947-05-21", "date": "1947-05-21", "label": "2차 미소공동위", "bar": true, "where": "서울", "note": "미소공동위원회가 다시 열렸으나 같은 쟁점에서 다시 갈라져 10월에 사실상 끝난다. 미국은 이 무렵부터 조선 문제를 유엔으로 넘기는 쪽으로 방향을 바꾼다."}, {"id": "1947-09-17", "date": "1947-09-17", "label": "한국 문제 유엔 이관", "bar": true, "key": true, "note": "미국이 조선 문제를 유엔 총회에 상정했다. 4개국 신탁통치라는 전시 구상이 공식적으로 폐기되고, 처리의 무대가 미소 양자에서 유엔으로 옮겨간다."}, {"id": "1948-01-08", "date": "1948-01-08", "label": "유엔한국임시위원단 입국", "bar": true, "note": "유엔한국임시위원단(UNTCOK)이 서울에 들어왔다. 소련이 북위 38도 이북 입경을 거부해, 감시할 수 있는 지역에서만 선거를 치른다는 결론으로 이어진다."}, {"id": "1948-02", "date": "1948-02", "docs": [["ndl-091", "D024"]]}, {"id": "1948-04", "date": "1948-04", "docs": [["ndl-091", "D014"]]}, {"id": "1948-04-02", "date": "1948-04-02", "docs": [["korea-1948-50", "48-d776"]]}, {"id": "1948-04-28", "date": "1948-04-28", "docs": [["korea-1948-50", "48-d790"]]}, {"id": "1948-05-10", "date": "1948-05-10", "label": "5·10 총선거", "bar": true, "key": true, "note": "남한만의 제헌국회 선거가 치러졌다. 좌익과 김구·김규식 계열이 불참했다. 분단이 절차를 갖춘 사실이 되는 날이다."}, {"id": "1948-05-11", "date": "1948-05-11", "docs": [["korea-1948-50", "48-d797"]]}, {"id": "1948-05-15", "date": "1948-05-15", "docs": [["korea-1948-50", "48-d801"]]}, {"id": "1948-08-09", "date": "1948-08-09", "docs": [["korea-1948-50", "48-d862"]]}, {"id": "1948-08-15", "date": "1948-08-15", "label": "대한민국 정부 수립", "bar": true, "key": true, "note": "대한민국 정부가 수립되고 미군정이 끝났다. 카이로에서 「in due course」라고 적힌 지 4년 9개월 뒤다. 북에서는 9월 9일 조선민주주의인민공화국이 수립된다."}, {"id": "1948-08-17", "date": "1948-08-17", "docs": [["korea-1948-50", "48-d872"]]}, {"id": "1948-12-12", "date": "1948-12-12", "label": "유엔총회 결의 195(III)", "bar": true, "where": "파리 유엔총회", "note": "유엔 총회가 대한민국 정부를 위원단이 감시할 수 있었던 지역의 합법 정부로 승인했다. 「조선 전역의 유일 합법 정부」라는 뒷날의 표현과 결의문의 문언은 같지 않다.", "docs": [["korea-1948-50", "48-d924"]]}, {"id": "1948-12-17", "date": "1948-12-17", "docs": [["korea-1948-50", "48-d926"]]}, {"id": "1948-12-22", "date": "1948-12-22", "docs": [["korea-1948-50", "48-d928"]]}, {"id": "1949-03-22", "date": "1949-03-22", "docs": [["korea-1948-50", "49-d209"]]}, {"id": "1949-06-11", "date": "1949-06-11", "docs": [["korea-1948-50", "49-d262"]]}, {"id": "1949-06-26", "date": "1949-06-26", "label": "김구 피살", "bar": true, "key": true, "where": "서울 경교장", "note": "한국독립당 위원장 김구가 육군 소위 안두희의 총에 죽었다. 무초는 이튿날 「공식·비공식 여러 경로에서 지금까지 모은 바」로 시작하는 전문을 올린다 — 전날 첫 전문에는 아무 세부사항이 없었다."}, {"id": "1949-06-27", "date": "1949-06-27", "docs": [["korea-1948-50", "49-d265"]]}, {"id": "1949-06-27-1", "date": "1949-06-27", "docs": [["korea-1948-50", "49-d266"]]}, {"id": "1949-06-29", "date": "1949-06-29", "label": "주한미군 철수 완료", "bar": true, "key": true, "where": "서울", "note": "전투부대 철수가 끝나고 군사고문단(KMAG) 약 500명만 남았다. 철수 날짜를 이승만과 매듭짓는 일이 1949년 전반기 대사관 전문의 주된 내용이었다."}, {"id": "1949-10-01", "date": "1949-10-01", "label": "중화인민공화국 수립", "bar": true, "where": "베이징", "note": "국공내전이 사실상 끝났다. 무초는 다섯 달 전 이승만에게 중국의 결과가 조선에 당장 자국을 남기지는 않으리라고 말했었다."}, {"id": "1950-01-12", "date": "1950-01-12", "label": "애치슨 연설", "bar": true, "key": true, "where": "워싱턴 내셔널프레스클럽", "note": "애치슨이 미국의 태평양 방위선을 알류샨–일본–류큐–필리핀으로 그었다. 조선은 그 선 안에 들지 않았다. 이승만이 아홉 달 전 무초에게 우려한 바로 그 이야기다."}, {"id": "1950-01-20", "date": "1950-01-20", "docs": [["korea-1948-50", "50-d3"]]}, {"id": "1950-06-09", "date": "1950-06-09", "docs": [["korea-1948-50", "50-d46"]]}, {"id": "1950-06-14", "date": "1950-06-14", "docs": [["korea-1948-50", "50-d53"]]}, {"id": "1950-06-19", "date": "1950-06-19", "docs": [["korea-1948-50", "50-d57"]]}, {"id": "1950-06-23", "date": "1950-06-23", "docs": [["korea-1948-50", "50-d58"]]}, {"id": "1950-06-25", "date": "1950-06-25", "label": "한국전쟁 발발", "bar": true, "key": true, "where": "38선 전역", "note": "북한군이 38선 전역에서 남침했다. 유엔 안전보장이사회는 같은 날 결의 82호로 적대행위 중지와 38선 이북으로의 철수를 요구했다.", "docs": [["korea-1950-53", "50-d62"]]}, {"id": "1950-06-27", "date": "1950-06-27", "label": "안보리 결의 83호", "bar": true, "key": true, "where": "뉴욕 유엔 안보리", "note": "안보리가 회원국에 대한민국을 돕는 데 필요한 지원을 권고했다. 소련 대표는 중국 대표권 문제로 회의를 비우고 있어 거부권이 행사되지 않았다.", "docs": [["korea-1950-53", "50-d130"]]}, {"id":  "주영 미국대사. 런던의 유럽자문위원회(EAC) 미국 대표를 겸했다. 독일 항복 무렵 런던에서 국무부로 올린 전문의 발신자로 반복해서 나온다.", "badge": "이 문서철의 주석", "points": ["25회 나온다", "모두 「독일 항복」에 있다"]}, "_:4": {"title": "코델 헐(Cordell Hull, 1871–1955)", "sum": "미국 국무장관. 1941년 내내 노무라와 마주 앉아 일미교섭을 끌고 갔고 11월 26일의 각서를 냈다. 문서에서는 이름 없이 「국무장관」으로만 적힌 곳이 많다. 각서와 비망록의 작성자이자 본문의 「나」로 자주 등장한다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 75회 나온다", "「진주만으로 가는 열 주」·「일미교섭 1941」·「항복문서를 만들다」에 걸쳐 있다"]}, "_:5": {"title": "프랭클린 D. 루스벨트(Franklin D. Roosevelt, 1882–1945)", "sum": "미국 대통령. 성만 적힌 표기로 나오는 대목을 따로 모은 것이다. 카이로와 얄타의 기록에 나온다.", "badge": "이 문서철의 주석", "points": ["4회 나온다", "「카이로 선언과 조선」·「항복문서를 만들다」·「얄타의 신탁통치 구두 양해」에 있다"]}, "_:6": {"title": "조지프 C. 그루(Joseph C. Grew, 1880–1965)", "sum": "미국 국무차관. 개전 전 주일대사를 열 해 지냈다. 1945년 국무장관 대리로서 독일 항복 발표를 둘러싼 전보를 처리했다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 25회 나온다", "「독일 항복」에만 나온다"]}, "_:7": {"title": "존 J. 무초(John J. Muccio, 1900–1989)", "sum": "주한 미국대사. 1948년 8월 대한민국 정부 수립과 함께 특별대표로 서울에 부임했고 1949년 4월 초대 대사가 되었다. 이 문서철에서 서울발 전보의 발신자로 가장 많이 나오며, 1950년 6월까지 이승만 정부와 국무부 사이의 보고선을 맡는다.", "badge": "이 문서철의 주석", "points": ["75회 나온다. 이 문서철에서 가장 많이 나오는 인물이다", "「전쟁이 오기까지」에 있다"]}, "_:8": {"title": "해리 트루먼(Harry S. Truman, 1884–1972)", "sum": "미국 대통령. 1945년 4월 루스벨트가 죽은 뒤 뒤를 이었다. 일본 외무성 전보에서는 종전 교섭의 상대인 미국 수뇌로 가타카나 표기로 언급된다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "모두 「스위스와 스웨덴을 거쳐」에 있다"]}, "_:9": {"title": "딘 애치슨(Dean Acheson, 1893–1971)", "sum": "미국 국무차관. 1945년 8월 취임해 장관이 없을 때 국무장관 대리로 전문에 서명했다. 조선 점령과 정책을 다루는 국무부 발신 전문에 그의 이름이 오른다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 9회 나온다", "「014.1 Korea」, 「미국의 대한정책」, 「항복문서를 만들다」 세 문서철에 걸친다"]}, "_:10": {"title": "존 R. 하지(John R. Hodge, 1893–1963)", "sum": "미육군 중장. 제24군단장으로 조선에 들어와 주한미군사령관을 맡았다. 서울에서 올린 전문의 발신자로 나오는데 서명 없이 'CG USAFIK'이나 'COMGEN USAFIK'으로만 적힌 것이 많다.", "badge": "이 문서철의 주석", "points": ["19회 나온다", "「미국의 대한정책」과 「014.1 Korea」 양쪽에 있다"]}, "_:11": {"title": "조지 C. 마셜(George C. Marshall, 1880–1959)", "sum": "미 육군참모총장. 카이로에서 연합참모부 회의에 앉았고 1945년에는 항복 기구와 조선 진주를 다루는 전보의 발신 명의로 나온다. 진주만 직전 태평양 방면 경고 전문의 발신자로도 언급된다.", "badge": "이 문서철의 주석", "points": ["12회 나온다", "여섯 개 문서철에 걸쳐 있다"]}, "_:12": {"title": "장제스(蔣介石, 1887–1975)", "sum": "중화민국 국민정부 주석. 1943년 11월 카이로에서 루스벨트, 처칠과 만나 조선의 독립을 명기한 선언에 이름을 올렸다. 1945년 일반명령 제1호에서는 중국 지역의 항복을 받는 사람으로 실명이 박힌다. 일본 쪽 문서에서는 「蔣政権」 「援蔣」의 대상으로만 나온다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 36회 나온다", "「카이로 선언과 조선」부터 「일본의 항복」까지 일곱 문서철에 걸친다", "forms에 「Madam Chiang Kai-shek 장 부인」이 섞여 있다. 장제스의 부인 쑹메이링(宋美齡)이고 다른 사람이다."]}, "_:13": {"title": "구루스 사부로(来栖三郎, 1886–1954)", "sum": "직업 외교관. 1941년 11월 특파대사로 워싱턴에 보내져 노무라를 돕는다. 두 사람이 함께 헐을 만난 기록이 이 아카이브의 마지막 국면을 채운다. 일본 쪽 전보는 두 사람을 묶어 「両大使」·「貴両大使」로 부른다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 34회 나온다", "「진주만으로 가는 열 주」와 「일미교섭 1941」 양쪽에 나온다"]}, "_:14": {"title": "드와이트 D. 아이젠하워(Dwight D. Eisenhower, 1890–1969)", "sum": "연합국원정군 최고사령관. 랭스에서 독일군의 항복을 받았고 발표 시각과 문서 형식을 두고 워싱턴·런던과 오간 전문에 사령관으로 나온다.", "badge": "이 문서철의 주석", "points": ["12회 나온다", "「카이로 선언과 조선」·「항복문서를 만들다」·「독일 항복」에 있다"]}, "_:15": {"title": "조지프 W. 밸런타인(Joseph W. Ballantine, 1888–1973)", "sum": "미국 국무부 극동국 관리. 1941년 헐과 노무라의 회담에 배석해 회담 비망록을 적었다. 이 아카이브에서 그 회담이 어떻게 오갔는지를 알 수 있는 것은 대개 그가 남긴 기록 덕이다. 뒤에는 극동국장이 된다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 30회 나온다", "「진주만으로 가는 열 주」, 「일미교섭 1941」, 「일본의 항복」, 「미국의 대한정책」 네 문서철에 걸친다. 1941년에는 회담 기록자로, 1945년에는 극동국장으로 나온다"]}, "_:16": {"title": "아돌프 히틀러(Adolf Hitler, 1889–1945)", "sum": "독일 총통. 성만 적힌 표기로 나오는 대목을 따로 모은 것이다.", "badge": "이 문서철의 주석", "points": ["8회 나온다", "「독일 항복」과 「진주만으로 가는 열 주」에 있다"]}, "_:17": {"title": "조지프 E. 제이컵스(Joseph E. Jacobs)", "sum": "주조선 미군사령관의 정치고문. 서울에서 유엔조선임시위원단의 움직임과 남조선 정치를 국무장관에게 보고했다. 1948년 문서에서 위원단 위원별 태도, 이승만·김구·김규식의 동향을 전하는 전보의 발신자로 되풀이해 나온다.", "badge": "이 문서철의 주석", "points": ["27회 나온다. 모두 1948년 문서다", "「전쟁이 오기까지」에 있다"]}, "_:18": {"title": "윈스턴 처칠(Winston S. Churchill, 1874–1965)", "sum": "영국 총리. 성만 적힌 표기로 나오는 대목을 따로 모은 것이다. 카이로 선언 문안과 독일 항복 발표를 다루는 문서에서 언급된다.", "badge": "이 문서철의 주석", "points": ["8회 나온다", "「카이로 선언과 조선」·「항복문서를 만들다」·「독일 항복」에 있다"]}, "_:19": {"title": "에드워드 R. 스테티니어스(Edward R. Stettinius, Jr., 1900–1949)", "sum": "미국 국무장관. 1944년 말 헐의 뒤를 이었다. 유럽자문위원회와 독일 항복 문서에서 전문의 수신자로 자주 나오는데, 본문에는 이름 없이 「국무장관」으로만 적힌 곳이 많다.", "badge": "이 문서철의 주석", "points": ["26회 나온다", "「항복문서를 만들다」와 「독일 항복」에 있다"]}, "_:20": {"title": "도조 히데키(東條英機, 1884–1948)", "sum": "육군 대장. 1941년 10월 내각총리대신이 되어 육군대신과 내무대신을 겸했다. 미국 쪽 문서에는 이름 없이 「the Prime Minister」로만 적힌 곳이 많다. 일본 쪽 전보에는 「東条総理」·「東条首相」으로 나온다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 21회 나온다", "「진주만으로 가는 열 주」, 「일미교섭 1941」, 「일본의 항복」에 걸친다"]}, "_:21": {"title": "이오시프 스탈린(Joseph Stalin, 1878–1953)", "sum": "소련의 최고 지도자. 일본 외무성 전보에서 가타카나 표기로 언급된다. 소련의 중재를 기대하던 일본이 상대로 삼은 인물이다.", "badge": "이 문서철의 주석", "points": ["7회 나온다", "모두 「스위스와 스웨덴을 거쳐」에 있다"]}, "_:22": {"title": "제퍼슨 캐퍼리(Jefferson Caffery, 1886–1974)", "sum": "주프랑스 미국대사. 파리에서 항복문서와 점령 기구에 프랑스가 낄 자격을 두고 프랑스 정부의 뜻을 워싱턴에 전했다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 4회 나온다", "「항복문서를 만들다」에만 나온다"]}, "_:23": {"title": "애버렐 해리먼(W. Averell Harriman, 1891–1986)", "sum": "주소련 미국대사. 성만 적힌 표기로 나오는 대목을 따로 모은 것이다. 모스크바에서 오간 협의를 워싱턴에 보고했다.", "badge": "이 문서철의 주석", "points": ["6회 나온다", "모두 「독일 항복」에 있다"]}, "_:24": {"title": "윌리엄 스트랭(Sir William Strang, 1893–1978)", "sum": "유럽자문위원회(EAC)의 영국 대표. 런던에서 독일 항복문서와 점령 구역 문안을 다듬는 협의를 이끌었고 위원회 의장을 맡기도 했다. 본문에 「영국 대표」로만 적힌 곳이 많다.", "badge": "이 문서철의 주석", "points": ["24회 나온다", "「항복문서를 만들다」와 「독일 항복」에 있다"]}, "_:25": {"title": "가세 슌이치(加瀨俊一)", "sum": "주스위스 일본공사. 베른에서 종전 관련 전보를 주고받은 발신자이자 수신자로 나온다. 스위스를 거친 연락선의 일본 쪽 끝이다.", "badge": "이 문서철의 주석", "points": ["23회 나온다", "모두 「스위스와 스웨덴을 거쳐」에 있다"]}, "_:26": {"title": "W. 월턴 버터워스(W. Walton Butterworth, 1903–1975)", "sum": "미국 국무부 극동국장. 뒤에 극동담당 국무차관보가 된다. 워싱턴에서 조선 문제 결재선의 중심에 있고, 각서 작성자이자 전보 결재자로 나온다.", "badge": "이 문서철의 주석", "points": ["22회 나온다", "「전쟁이 오기까지」에 있다"]}, "_:27": {"title": "오카모토 스에마사(岡本季正)", "sum": "주스웨덴 일본공사. 1945년 스톡홀름에서 본성과 전보를 주고받는다. 「스위스와 스웨덴을 거쳐」의 전보에서 발신자와 수신자로 되풀이해 나온다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 22회 나온다", "「스위스와 스웨덴을 거쳐」에만 나온다"]}, "_:28": {"title": "H. 프리먼 매슈스(H. Freeman Matthews)", "sum": "미국 국무부 유럽국장. 항복 기구와 점령 정책을 다루는 회의에 국무부 쪽 주역으로 앉았고 3부조정위원회 의장 대리를 맡기도 했다. 기록에서 위넌트가 「Doc」이라 부른다.", "badge": "이 문서철의 주석", "points": ["18회 나온다", "「항복문서를 만들다」·「일본의 항복」·「독일 항복」에 있다"]}, "_:29": {"title": "고노에 후미마로(近衞文麿, 1891–1945)", "sum": "일본 총리. 1941년 8월 루스벨트와의 정상회담을 제의했고 10월에 사임했다. 문서에서는 그 회담 제의와 사임이 교섭의 흐름을 가르는 대목으로 되풀이 언급된다. 원문에는 「일본국 총리」로만 적힌 곳이 많다.", "badge": "이 문서철의 주석", "points": ["17회 나온다", "모두 「진주만으로 가는 열 주」에 있다"]}, "_:30": {"title": "로버트 A. 러벳(Robert A. Lovett, 1895–1986)", "sum": "미국 국무차관. 마셜 장관 아래에서 국무장관 대리를 겸했다. 서울발 전보의 수신자로, 또 국무부 각서의 작성자로 나온다.", "badge": "이 문서철의 주석", "points": ["16회 나온다", "「전쟁이 오기까지」에 있다"]}, "_:31": {"title": "제임스 클레먼트 던(James Clement Dunn, 1890–1979)", "sum": "미국 국무차관보. 유럽 문제를 맡았다. 독일 항복문서와 점령 기구를 준비하는 국무부 내부 문서에서 결재선의 중심에 있다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 10회 나온다", "「항복문서를 만들다」와 「일본의 항복」에 나온다"]}, "_:32": {"title": "제임스 F. 번스(James F. Byrnes, 1882–1972)", "sum": "미국 국무장관. 1945년 7월 취임해 일본의 항복 교섭을 국무부 쪽에서 맡았다. 포츠담 선언 수락 조건에 대한 답, 이른바 번스 회답이 그의 이름으로 나간다. 조선 정책 문서에도 발신 명의로 오른다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 17회 나온다", "「미국의 대한정책」, 「일본의 항복」, 「스위스와 스웨덴을 거쳐」에 걸친다"]}, "_:33": {"title": "표도르 구세프(Fedor Tarasovich Gousev)", "sum": "유럽자문위원회(EAC)의 소련 대표. 주영 소련대사를 겸했다. 성만 적힌 표기로 나오는 대목을 따로 모은 것이다.", "badge": "이 문서철의 주석", "points": ["6회 나온다", "모두 「항복문서를 만들다」에 있다"]}, "_:34": {"title": "존 G. 에르하르트(John G. Erhardt)", "sum": "오스트리아 문제 담당 미국 정치고문. 성만 적힌 표기로 나오는 대목을 따로 모은 것이다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "모두 「독일 항복」에 있다"]}, "_:35": {"title": "에버렛 F. 드럼라이트(Everett F. Drumright, 1906–1993)", "sum": "주한 미국대사관 참사관. 무초가 서울에 없을 때 대리대사로 전보에 서명한다. 1949년부터 1950년 6월까지 서울발 보고의 두 번째 발신자다.", "badge": "이 문서철의 주석", "points": ["17회 나온다", "「전쟁이 오기까지」에 있다"]}, "_:36": {"title": "김구(金九, 1876–1949)", "sum": "대한민국임시정부 주석. 이 아카이브에서는 미국이 임시정부와 그 인사를 어떻게 다룰지 따지는 문서에 이름으로 나온다.", "badge": "이 문서철의 주석", "points": ["4회 나온다", "「미국의 대한정책」과 「014.1 Korea」에 있다"]}, "_:37": {"title": "필립 E. 모즐리(Philip E. Mosely)", "sum": "유럽자문위원회(EAC) 미국 대표단의 정치고문. 런던에서 독일 항복문서와 점령 구역 문안을 실제로 다듬은 실무자다. 협의위원회 미국 위원으로도 나온다.", "badge": "이 문서철의 주석", "points": ["16회 나온다", "「항복문서를 만들다」와 「독일 항복」에 있다"]}, "_:38": {"title": "조지 F. 케넌(George F. Kennan, 1904–2005)", "sum": "주소련 미국 대리대사. 해리먼이 모스크바를 비운 동안 대사관 전보를 대신 발신했다. 독일 항복 발표를 둘러싼 소련 쪽 태도를 워싱턴에 전한 보고가 남아 있다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 16회 나온다", "「독일 항복」에만 나온다"]}, "_:39": {"title": "프랭크 로버츠(Frank Roberts, 1907–1998)", "sum": "주소련 영국 대리대사. 모스크바에서 영국 정부를 대신해 소련 외무인민위원부를 상대했다. 독일 항복 절차를 두고 미국, 영국이 소련에 함께 움직이는 대목에 나온다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 5회 나온다", "「항복문서를 만들다」와 「독일 항복」에 나온다"]}, "_:40": {"title": "섬너 웰스(Sumner Welles, 1892–1961)", "sum": "미국 국무차관. 헐을 대신해 노무라를 상대한 회담의 비망록을 남겼다. 문서에서는 이름 없이 「국무차관」으로만 적힌 곳이 많고, 각서 본문의 「나」가 웰스인 것도 있다.", "badge": "이 문서철의 주석", "points": ["16회 나온다", "「진주만으로 가는 열 주」와 「일미교섭 1941」에 있다"]}, "_:41": {"title": "와카스기 가나메(若杉要)", "sum": "주미 일본대사관 공사. 노무라를 도와 국무부와의 실무 접촉을 맡았고 웰스와 여러 차례 마주 앉았다. 본문에는 대체로 「일본 공사」로만 적혀 있다.", "badge": "이 문서철의 주석", "points": ["16회 나온다", "모두 「진주만으로 가는 열 주」에 있다"]}, "_:42": {"title": "딘 러스크(Dean Rusk, 1909–1994)", "sum": "미국 국무부 극동담당 국무차관보. 1945년 8월에는 육군부 대령으로 본스틸과 함께 38선 획정안을 만들었고, 그 경위를 회고한 1950년의 글이 「미국의 대한정책」의 각서에 인용되어 있다. 1950년 문서에서는 장면 주미대사와 인플레이션과 선거 연기를 논의한 기록에 나온다.", "badge": "이 문서철의 주석", "points": ["8회 나온다", "「전쟁이 오기까지」와 「미국의 대한정책」 두 문서철에 걸친다"]}, "_:43": {"title": "로버트 D. 머피(Robert D. Murphy, 1894–1978)", "sum": "대독일 미국 정치고문. 아이젠하워 사령부에 붙어 항복 처리와 점령 초기 문제를 국무부에 보고했다.", "badge": "이 문서철의 주석", "points": ["15회 나온다", "「항복문서를 만들다」와 「독일 항복」에 있다"]}, "_:44": {"title": "케네스 C. 로열(Kenneth C. Royall, 1894–1971)", "sum": "미국 육군장관. 주한미군 철수의 시기와 규모를 두고 국무부와 협의하는 육군부 쪽 당사자다. 1949년 2월 한국에 왔고, 일본을 두고 낸 그의 성명이 서울에서 방어선 논란을 낳은 기록이 남아 있다.", "badge": "이 문서철의 주석", "points": ["13회 나온다", "「전쟁이 오기까지」에 있다"]}, "_:45": {"title": "이범석(李範奭, 1900–1972)", "sum": "대한민국 초대 국무총리. 1948년 8월 2일 국회의 동의를 얻어 임명되었고 국방장관을 겸했다. 잠정 군사협정 초안에 반대한 일과 남조선 봉기를 두고 낸 담화가 이 문서철에 옮겨져 있다.", "badge": "이 문서철의 주석", "points": ["13회 나온다", "「전쟁이 오기까지」에 있다"]}, "_:46": {"title": "신성모(申性模, 1891–1960)", "sum": "대한민국 내무부장관을 거쳐 1949년 국방장관이 되었다. 제주도 게릴라 소탕을 지휘하러 내려간 일이 무초의 전보에 보고된다. 원문의 로마자 표기가 Sihn, Shin, Sinn으로 엇갈린다.", "badge": "이 문서철의 주석", "points": ["11회 나온다. 모두 1949년 이후 문서다", "「전쟁이 오기까지」에 있다"]}, "_:47": {"title": "도요다 소에무(豊田副武, 1885–1957)", "sum": "일본 해군대장. 연합함대 사령장관을 거쳐 1945년 5월 군령부총장이 됐다. 이 아카이브에서는 종전 뒤 미군 심문에 응한 피심문자로 나온다.", "badge": "이 문서철의 주석", "points": ["11회 나온다", "모두 「전황 보고」에 있다"]}, "_:48": {"title": "윌리엄 D. 리히(William D. Leahy, 1875–1959)", "sum": "미국 해군 원수. 육해군 최고사령관인 대통령의 참모장으로 군의 의견을 백악관에 잇는다. 카이로 회담에 배석했고 독일 항복과 점령 기구 문서에도 이름이 오른다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 5회 나온다", "「카이로 선언과 조선」, 「항복문서를 만들다」, 「독일 항복」 세 문서철에 걸친다"]}, "_:49": {"title": "앤서니 이든(Anthony Eden, 1897–1977)", "sum": "영국 외무장관. 성만 적힌 표기로 나오는 대목을 따로 모은 것이다.", "badge": "이 문서철의 주석", "points": ["4회 나온다", "모두 「독일 항복」에 있다"]}, "_:50": {"title": "월터 베델 스미스(Walter Bedell Smith, 1895–1961)", "sum": "미육군 중장. 연합국원정군최고사령부(SHAEF) 참모장으로 랭스에서 독일군 항복 조인을 진행했다. 본문에 「참모장」으로만 적힌 곳이 있다.", "badge": "이 문서철의 주석", "points": ["11회 나온다", "「항복문서를 만들다」와 「독일 항복」에 있다"]}, "_:51": {"title": "김규식(金奎植, 1881–1950)", "sum": "정치인. 미국 문서는 그를 중도파 지도자로 분류한다. 1948년 유엔조선임시위원단과 남조선 선거를 둘러싼 보고에서 이승만·김구와 나란히 되풀이해 언급된다. 원문 표기는 대개 「Kimm Kiusic」이다.", "badge": "이 문서철의 주석", "points": ["12회 나온다", "「전쟁이 오기까지」에 있다"]}, "_:52": {"title": "조지 애치슨 2세(George Atcheson, Jr., 1896–1947)", "sum": "주일 미국 정치고문 대리. 맥아더 밑에서 국무부의 눈 노릇을 했다. 도쿄에서 조선 정세와 점령 실무를 워싱턴에 보고한 전문의 발신자다. 그 전에는 중경에서 주중 대사대리를 지냈다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 11회 나온다", "「014.1 Korea」, 「미국의 대한정책」, 「일본의 항복」 세 문서철에 걸친다"]}, "_:53": {"title": "쇼와 천황(昭和天皇, 1901–1989)", "sum": "일본 천황. 미군 심문에 응한 일본 군인들의 진술에서 군인칙유를 내린 이로 언급된다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "모두 「전황 보고」에 있다"]}, "_:54": {"title": "뱌체슬라프 몰로토프(Vyacheslav M. Molotov, 1890–1986)", "sum": "소련 외무인민위원. 성만 적힌 표기로 나오는 대목을 따로 모은 것이다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "모두 「독일 항복」에 있다"]}, "_:55": {"title": "플로리(Flory)", "sum": "미군 장군. 항복 기구를 다루는 문서에 성만 적혀 나온다. 이름과 소속은 문서에서 확인되지 않는다.", "badge": "이 문서철의 주석", "points": ["5회 나온다", "모두 「항복문서를 만들다」에 있다"]}, "_:56": {"title": "하인리히 힘러(Heinrich Himmler, 1900–1945)", "sum": "독일 친위대 전국지도자. 1945년 봄 서방 연합국에만 항복하겠다고 스웨덴을 거쳐 타진했다. 미국과 영국은 소련을 뺀 항복을 받지 않겠다고 못박는다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 3회 나온다", "「독일 항복」에만 나온다"]}, "_:57": {"title": "카를 레너(Karl Renner, 1870–1950)", "sum": "오스트리아 임시정부 수반. 성만 적힌 표기로 나오는 대목을 따로 모은 것이다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "모두 「독일 항복」에 있다"]}, "_:58": {"title": "윌리엄 H. 드레이퍼(William H. Draper, Jr., 1894–1974)", "sum": "미국 육군차관. 조선 원조 예산과 철군 문제를 두고 국무부와 협의한다. 1948년 서울에서 하지, 제이컵스와 함께한 대화 기록에 나오고, 육군부와 국무부의 양해를 담은 서한의 작성자로도 나온다.", "badge": "이 문서철의 주석", "points": ["11회 나온다", "「전쟁이 오기까지」에 있다"]}, "_:59": {"title": "조병옥(趙炳玉, 1894–1960)", "sum": "미군정 경무부장을 지냈고 대한민국 수립 뒤에는 이승만 대통령의 특별대표와 유엔 대표로 나온다. 1949년 3월 군사 원조를 요청하는 긴 각서를 국무부에 냈고, 장면과 함께 국무부를 찾아 한국군 증강을 요청한 대화 비망록이 남아 있다. 1948년 보고에서는 이승만 계열과 김성수 계열 사이에서 중간 노선을 걷는 인물로 적혀 있다.", "badge": "이 문서철의 주석", "points": ["7회 나온다", "모두 「전쟁이 오기까지」에 있다"]}, "_:60": {"title": "찰스 E. 솔츠먼(Charles E. Saltzman)", "sum": "미국 국무차관보. 점령지역을 담당했다. NSC 8 이행을 두고 국무장관을 대리했고, 서울발 전보의 수신 지정자로 이름이 오른다.", "badge": "이 문서철의 주석", "points": ["10회 나온다", "「전쟁이 오기까지」에 있다"]}, "_:61": {"title": "폴 G. 호프먼(Paul G. Hoffman, 1891–1974)", "sum": "미국 경제협조처(ECA) 처장. 대한 원조 계획을 관장했다. 1950년 3월 23일 한국 국무총리에게 인플레이션이 통제되지 않으면 대한 ECA 계획을 재검토해야 한다고 적은 서한을 보냈고, 그 서한을 둘러싼 반응이 이 문서철에 여러 건 남아 있다.", "badge": "이 문서철의 주석", "points": ["10회 나온다", "「전쟁이 오기까지」에 있다"]}, "_:62": {"title": "아서 C. 번스(Arthur C. Bunce)", "sum": "경제협조처(ECA) 주한사절단장. 그 전에는 주한 미군 사령관의 경제고문이었다. 원조 규모와 인플레이션 억제를 논한 회합에 거의 빠짐없이 나오고, 1950년 1월 이승만에게 통제안을 직접 건넨 자리의 기록도 그의 것이다.", "badge": "이 문서철의 주석", "points": ["「전쟁이 오기까지」에 있다"]}, "_:63": {"title": "존 H. 힐드링(John H. Hilldring, 1895–1974)", "sum": "미육군 소장. 육군부 민사국장으로 점령지 통치 기구를 짜는 실무를 맡았다. 항복문서와 군정 조직을 다루는 국무부·육군부 협의 문서에 되풀이해 나온다.", "badge": "이 문서철의 주석", "points": ["9회 나온다", "모두 「항복문서를 만들다」에 있다"]}, "_:64": {"title": "헨리 L. 스팀슨(Henry L. Stimson, 1867–1950)", "sum": "미국 육군장관. 항복 기구와 점령 계획을 놓고 국무부와 마주 앉았고 펜타곤 사무실이 회의 장소로 적힌 문서도 있다. 1941년 문서에서는 만주 불승인의 스팀슨 독트린으로만 언급된다.", "badge": "이 문서철의 주석", "points": ["9회 나온다", "네 개 문서철에 걸쳐 있다"]}, "_:65": {"title": "유진 H. 두먼(Eugene H. Dooman)", "sum": "주일 미국대사관 참사관. 도쿄에서 그루를 도왔고 회담 비망록을 여러 편 남겼다. 뒤에는 국무차관보 특별보좌관으로 대일 정책 실무를 맡았다.", "badge": "이 문서철의 주석", "points": ["9회 나온다", "「일본의 항복」과 「진주만으로 가는 열 주」에 있다"]}, "_:66": {"title": "나일스 W. 본드(Niles W. Bond)", "sum": "미국 국무부 동북아시아과 부과장. 워싱턴에서 한국 문제 실무를 맡았다. 장면 주미대사가 온 회담의 배석자로 나오고, 대한 군사 원조와 이승만 정부의 태도를 두고 낸 의견이 각서에 적혀 있다.", "badge": "이 문서철의 주석", "points": ["9회 나온다", "「전쟁이 오기까지」에 있다"]}, "_:67": {"title": "데라사키 히데나리(寺崎英成, 1900–1951)", "sum": "주미 일본대사관 1등서기관. 1941년 워싱턴에서 노무라 대사 밑의 교섭 실무를 맡았다. 문서철에 따라 외무성 미국국장으로도 적혀 있다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 9회 나온다", "「일미교섭 1941」과 「진주만으로 가는 열 주」 양쪽에 나온다"]}, "_:68": {"title": "해럴드 페어(Harold Fair)", "sum": "미국 육군 중령. 태평양미육군총사령부 부관부에서 부관감보를 맡았다. 조선 관련 서한의 서명자로 나오고, 결재란의 자필 메모에는 「Col Fair」로 적혀 있다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 8회 나온다", "「014.1 Korea」에만 나온다"]}, "_:69": {"title": "패트릭 J. 헐리(Patrick J. Hurley, 1883–1963)", "sum": "주중 미국대사. 충칭에서 중국 정부와 임시정부 문제를 다룬 보고를 올렸다. 조선 관련 전문의 발신자로 나온다.", "badge": "이 문서철의 주석", "points": ["8회 나온다", "「미국의 대한정책」과 「일본의 항복」에 있다"]}, "_:70": {"title": "조지 V. 스트롱(George V. Strong)", "sum": "미육군 소장. 합동참모본부 합동전후위원회의 육군 수석대표로 항복문서 초안 작성에 관여했다.", "badge": "이 문서철의 주석", "points": ["8회 나온다", "「항복문서를 만들다」와 「일본의 항복」에 있다"]}, "_:71": {"title": "표도르 톨부힌(Fyodor Tolbukhin, 1894–1949)", "sum": "소련 원수. 남동유럽 방면 소련군을 이끌었다. 독일군 잔여 부대의 항복 접수와 오스트리아 처리를 다루는 전보에 이름이 나온다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 4회 나온다", "「독일 항복」에만 나온다"]}, "_:72": {"title": "폴봉쿠르(Paul-Boncour)", "sum": "유엔조선임시위원단의 프랑스 대표. 남조선 선거를 진행하는 쪽에 강한 입장을 취했으나 결정적 사안에서는 대개 기권했다고 제이컵스가 보고한다. 잭슨의 결의안을 앞장서 공격한 일과 귀속재산 처리에 관심을 보인 일이 기록에 남아 있다.", "badge": "이 문서철의 주석", "points": ["8회 나온다", "「전쟁이 오기까지」에 있다"]}, "_:73": {"title": "김일성(金日成, 1912–1994)", "sum": "조선민주주의인민공화국 수상. 1948년 북조선인민회의에 헌법을 제출하는 연설을 했고 그 전문이 방송을 통해 남쪽에 전해졌다. 서울의 미국 쪽 보고에서는 소련이 길러 낸 인물로 서술되며, 하지와 소련군 사령관 사이에 오간 서한 묶음에도 그의 편지가 함께 들어 있다.", "badge": "이 문서철의 주석", "points": ["8회 나온다", "모두 「전쟁이 오기까지」에 있다"]}, "_:74": {"title": "앨런 덜레스(Allen Dulles, 1893–1969)", "sum": "전략사무국(OSS)의 유럽 책임자. 베른에서 북이탈리아 독일군의 항복을 주선했고 뒤에 비스바덴 OSS 임무단장을 맡았다. 각주에는 「유럽에서 OSS에 복무 중인 뉴욕 변호사」로 적혀 있다.", "badge": "이 문서철의 주석", "points": ["5회 나온다", "모두 「일본의 항복」에 있다"]}, "_:75": {"title": "해리 L. 홉킨스(Harry L. Hopkins, 1890–1946)", "sum": "대통령 특별보좌관. 루스벨트의 가장 가까운 심복으로 카이로에 수행했고 선언 초안 작성자로 각주에 추정된다. 1945년에는 모스크바 특사로 나온다.", "badge": "이 문서철의 주석", "points": ["7회 나온다", "네 개 문서철에 걸쳐 있다"]}, "_:76": {"title": "르네 마시글리(René Massigli)", "sum": "유럽자문위원회(EAC)의 프랑스 대표. 성만 적힌 표기로 나오는 대목을 따로 모은 것이다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "모두 「항복문서를 만들다」에 있다"]}, "_:77": {"title": "릴런드 해리슨(Leland Harrison)", "sum": "주스위스 미국공사. 베른에서 중립국을 거쳐 오가는 항복 관련 연락을 국무부에 중계했다. 발신자로도 수신자로도 나온다.", "badge": "이 문서철의 주석", "points": ["7회 나온다", "「항복문서를 만들다」와 「일본의 항복」에 있다"]}, "_:78": {"title": "루피노 루나(Rufino Luna)", "sum": "유엔조선임시위원단(UNTCOK)과 뒤이은 유엔한국위원단(UNCOK)의 필리핀 대표. 처음에는 아란스(Arranz)의 대리위원으로 남았다가 교체대표가 되었다. 1948년 소총회 회부 없이 조기에 선거를 치르자는 안을 냈고, 미국 쪽 보고는 그를 위원단 안에서 가장 도움이 되는 대표로 꼽는다.", "badge": "이 문서철의 주석", "points": ["7회 나온다", "모두 「전쟁이 오기까지」에 있다"]}, "_:79": {"title": "필립 C. 제섭(Philip C. Jessup, 1897–1986)", "sum": "미국 순회대사이자 국무장관 특별고문. 유엔 주재 미국 대표대리를 지냈다. 1950년 1월 11일부터 14일까지 조선을 방문해 이승만과 만났고, 그 방문에 관한 대사관의 보고서가 이 문서철에 있다.", "badge": "이 문서철의 주석", "points": ["5회 나온다", "모두 「전쟁이 오기까지」에 있다"]}, "_:80": {"title": "제임스 E. 웨브(James E. Webb, 1906–1992)", "sum": "미국 국무차관. 국무장관 대리로 서울에 훈령 전보를 보내는 발신 명의로 되풀이해 나온다. 1949년 6월 한국원조법안을 지지해 하원 외교위원회에서 증언한 사실이 각주에 적혀 있다.", "badge": "이 문서철의 주석", "points": ["5회 나온다", "모두 「전쟁이 오기까지」에 있다"]}, "_:81": {"title": "윌리엄 R. 랭던(William R. Langdon)", "sum": "주한 미국 정치고문. 1946년 서울에서 소련 대표단 만찬에 배석해 소련군 사령관 정치고문 발라사노프의 견해를 들은 대화가 하지의 전보에 남아 있다. 1948년 문서철에서는 정치고문 대리로 서울발 전보를 발신한다.", "badge": "이 문서철의 주석", "points": ["6회 나온다", "「014.1 Korea」와 「전쟁이 오기까지」에 걸친다"]}, "_:82": {"title": "마크 A. 미처(Marc A. Mitscher, 1887–1947)", "sum": "미 해군 중장. 제58기동부대 사령관으로 항모 기동부대를 이끌었다. 일본 쪽 전황 보고에서 일본 본토를 치는 미군 함대의 지휘관으로 이름이 나온다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 6회 나온다", "「전황 보고」에만 나온다"]}, "_:83": {"title": "해럴드 알렉산더(Harold Alexander, 1891–1969)", "sum": "영국 원수. 지중해 방면 연합군 최고사령관으로 이탈리아 전선의 독일군 항복을 받았다. 카세르타에서 오간 전문에 사령관으로 언급된다.", "badge": "이 문서철의 주석", "points": ["5회 나온다", "모두 「독일 항복」에 있다"]}, "_:84": {"title": "찰스 E. 볼렌(Charles E. Bohlen, 1904–1974)", "sum": "국무장관의 백악관 연락 특별보좌관. 러시아 전문가로 정상 회담의 통역과 기록을 맡았다. 이 아카이브의 여러 회의록이 그의 손에서 나왔다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "「카이로 선언과 조선」·「항복문서를 만들다」·「독일 항복」에 있다"]}, "_:85": {"title": "샤를 드골(Charles de Gaulle, 1890–1970)", "sum": "프랑스 임시정부 수반. 독일 항복 발표 시각과 프랑스의 서명 참가를 두고 미·영·소와 조율하는 문서에 나온다.", "badge": "이 문서철의 주석", "points": ["6회 나온다", "「독일 항복」과 「항복문서를 만들다」에 있다"]}, "_:86": {"title": "아치볼드 클라크 커(Sir Archibald Clark Kerr)", "sum": "주소련 영국대사. 모스크바에서 해리먼과 나란히 소련 정부를 상대했다. 얄타의 신탁통치 논의부터 독일 항복 처리까지 걸쳐 나온다.", "badge": "이 문서철의 주석", "points": ["6회 나온다", "네 개 문서철에 걸쳐 있다"]}, "_:87": {"title": "존 R. 딘(John R. Deane, 1896–1982)", "sum": "미국 육군 소장. 모스크바 주재 미국 군사사절단장으로 소련군 총참모부와 실무를 다뤘다. 독일 항복 절차와 대일 항복 관련 통보를 소련 쪽에 전하는 통로였다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 6회 나온다", "「항복문서를 만들다」와 「일본의 항복」에 나온다"]}, "_:88": {"title": "안드레이 비신스키(Andrey Y. Vyshinski, 1883–1954)", "sum": "소련 외무인민위원 대리. 성만 적힌 표기로 나오는 대목을 따로 모은 것이다.", "badge": "이 문서철의 주석", "points": ["6회 나온다", "모두 「독일 항복」에 있다"]}, "_:89": {"title": "K. P. S. 메논(K. P. S. Menon, 1898–1982)", "sum": "인도 외교관. 유엔조선임시위원단의 인도 대표이자 의장이었다. 1948년 초 위원단이 남조선에서만 선거를 치를지를 두고 갈릴 때 후(Hoo) 사무국장과 함께 레이크석세스로 가 소총회에 보고했다. 미국 쪽 보고는 그를 오스트레일리아, 캐나다와 함께 「영국 블록」으로 묶어 적는다.", "badge": "이 문서철의 주석", "points": ["6회 나온다", "모두 「전쟁이 오기까지」에 있다"]}, "_:90": {"title": "A. B. 제이미슨(A. B. Jamieson)", "sum": "유엔한국위원단의 오스트레일리아 대표. 잭슨을 대신하도록 서울로 명령받았고 대리대표를 거쳐 대표가 되었으며 위원단 의장도 맡았다. 1949년부터 1950년까지 통일과 선거를 주제로 한 그의 라디오 연설이 북조선 쪽에 전달할 문서 목록에 들어간다.", "badge": "이 문서철의 주석", "points": ["6회 나온다", "모두 「전쟁이 오기까지」에 있다"]}, "_:91": {"title": "스즈키 간타로(鈴木貫太郎, 1868–1948)", "sum": "예비역 해군대장. 1945년 4월 내각총리대신이 되어 종전 내각을 이끌었다. 포츠담 선언 수락에 이르는 어전회의와 각의가 그의 내각에서 벌어진다. 1941년 문서에는 부의장 겸 심사위원장으로 적혀 있다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 5회 나온다", "「전황 보고」, 「일미교섭 1941」, 「스위스와 스웨덴을 거쳐」에 나온다"]}, "_:92": {"title": "그레이(Gray)", "sum": "국무부 쪽 인물. 독일 항복문서와 점령 기구를 다루는 문서에 성만 적혀 나온다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 3회 나온다", "「항복문서를 만들다」에만 나온다"]}, "_:93": {"title": "허셜 V. 존슨(Herschel V. Johnson)", "sum": "주스웨덴 미국공사. 스톡홀름에서 들어온 독일과 일본 쪽 타진을 국무부로 넘겼다. 전문의 발신자로 나온다.", "badge": "이 문서철의 주석", "points": ["5회 나온다", "「일본의 항복」과 「독일 항복」에 있다"]}, "_:94": {"title": "체스터 W. 니미츠(Chester W. Nimitz, 1885–1966)", "sum": "미 해군원수. 태평양함대 및 태평양지역 총사령관이다. 1945년 9월 2일 미주리함 항복 조인식에서 미국 대표로 서명했다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 5회 나온다", "「일본의 항복」에만 나온다"]}, "_:95": {"title": "앨버트 C. 웨드마이어(Albert C. Wedemeyer, 1897–1989)", "sum": "미국 육군 중장. 1945년에는 중국전구 미군 사령관 겸 참모장으로, 인도차이나와 네덜란드령 동인도의 항복 접수를 다루는 문서에 이름이 오른다. 1949년에는 육군부 기획작전 담당으로 한국군의 적정 병력을 두고 조병옥의 주장을 부인하는 대목에 나온다.", "badge": "이 문서철의 주석", "points": ["5회 나온다", "「일본의 항복」과 「전쟁이 오기까지」에 걸친다"]}, "_:96": {"title": "윌리엄 L. 클레이턴(William L. Clayton, 1880–1966)", "sum": "미국 국무부 차관보. 경제 문제를 맡았다. 독일 항복 무렵의 국무부 회람에 나온다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 3회 나온다", "「독일 항복」에만 나온다"]}, "_:97": {"title": "존 B. 콜터(John B. Coulter, 1891–1983)", "sum": "미국 육군 소장. 하지의 후임으로 1948년 8월부터 1949년 1월까지 주조선 미육군사령관을 지냈다. 미군 철수를 앞두고 한국 보안군의 규모와 능력을 이승만 정부에 설명할 때 무초와 함께 나온다.", "badge": "이 문서철의 주석", "points": ["5회 나온다", "모두 「전쟁이 오기까지」에 있다"]}, "_:98": {"title": "아누프 싱(Anup Singh)", "sum": "유엔조선임시위원단과 유엔한국위원단의 인도 대표. 위원단 의장과 제1소위원회 의장을 맡았다. 1949년 이승만이 새 정부 수립을 통고한 서한의 수신자가 그이고, 1950년에는 통일과 선거를 주제로 한 그의 방송이 북조선 쪽에 전달할 문서에 들어간다.", "badge": "이 문서철의 주석", "points": ["5회 나온다", "모두 「전쟁이 오기까지」에 있다"]}, "_:99": {"title": "임병직(林炳稷, 1893–1976)", "sum": "대한민국 외무장관. 1949년 진해 회담 때 우궈전과 만난 한국 쪽 인사로, 1950년 6월 19일 이승만과 덜레스의 회견에 배석한 사람으로 나온다. UNCOK에 북조선과의 접촉 여부를 따져 물은 5월 19일자 서한도 그의 명의다.", "badge": "이 문서철의 주석", "points": ["4회 나온다", "「전쟁이 오기까지」에 있다"]}, "_:100": {"title": "에드윈 W. 폴리(Edwin W. Pauley, 1903–1981)", "sum": "배상 문제에 관한 대통령 개인 대표. 배상위원회의 미국 위원이자 배상사절단장으로 모스크바와 도쿄를 오갔다. 조선의 일본인 재산 처리와 얽혀 육군부 문서에도 이름이 오른다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 4회 나온다", "「독일 항복」과 「014.1 Korea」 양쪽에 나온다"]}, "_:101": {"title": "H. 메릴 베닝호프(H. Merrell Benninghoff)", "sum": "국무부 주한 정치고문. 1945년 가을 서울에서 조선의 정세를 워싱턴에 보고했다. 미군정과 국무부를 잇는 통로다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 4회 나온다", "「014.1 Korea」와 「미국의 대한정책」 양쪽에 나온다"]}, "_:102": {"title": "김성수(金性洙, 1891–1955)", "sum": "한국민주당 대표. 1945년 10월 군정장관이 임명한 고문회의의 의장으로 뽑혔고, 그 보고가 「014.1 Korea」의 첫머리에 있다. 1948년 문서에서는 선거 공천을 두고 당의 기율을 유지하기 어려워하는 모습으로, 1950년 문서에서는 대통령에 반대하는 가장 강한 조직의 대표로 나온다.", "badge": "이 문서철의 주석", "points": ["4회 나온다", "「014.1 Korea」와 「전쟁이 오기까지」에 걸친다"]}, "_:103": {"title": "사토 나오타케(佐藤尚武, 1882–1971)", "sum": "주소련 일본대사. 모스크바에서 소련의 중재를 얻어 보려 애썼고 몰로토프의 통고를 받은 상대로 나온다. 종전 교섭의 소련 쪽 창구다.", "badge": "이 문서철의 주석", "points": ["4회 나온다", "「전황 보고」와 「스위스와 스웨덴을 거쳐」에 있다"]}, "_:104": {"title": "윌슨 브라운(Wilson Brown)", "sum": "미국 해군 제독. 대통령의 해군 부관으로 회담에 따라다녔다. 카이로 회담 기록의 참석자 명단에 이름이 오른다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 3회 나온다", "「카이로 선언과 조선」에만 나온다"]}, "_:105": {"title": "앨런 브룩(Alan Brooke, 1883–1963)", "sum": "영제국참모총장. 카이로 회담의 연합참모부 회의에 영국 측 수석으로 앉았다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "「카이로 선언과 조선」과 「항복문서를 만들다」에 있다"]}, "_:106": {"title": "블라디미르 N. 파블로프(Vladimir N. Pavlov, 1915–1993)", "sum": "소련 쪽 통역. 스탈린과 몰로토프가 미국, 영국 대표를 만날 때 통역으로 배석했다. 회담 기록의 참석자 명단에 이름만 오르는 경우가 많다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 4회 나온다", "「카이로 선언과 조선」, 「독일 항복」, 「얄타의 신탁통치 구두 양해」 세 문서철에 걸친다"]}, "_:107": {"title": "얼 R. 디코버(Erle R. Dickover)", "sum": "미국 국무부 일본과장. 대일 점령과 조선 처리를 다루는 국무부 문서에서 수신자로 나온다. 동료들은 사신에서 그를 「딕」으로 부른다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 4회 나온다", "「미국의 대한정책」과 「일본의 항복」에 나온다"]}, "_:108": {"title": "핼리팩스 경(Lord Halifax, 1881–1959)", "sum": "주미 영국대사. 워싱턴에서 항복 기구를 다루는 미국 국무부와의 협의에 영국 쪽 상대로 나온다.", "badge": "이 문서철의 주석", "points": ["4회 나온다", "모두 「항복문서를 만들다」에 있다"]}, "_:109": {"title": "제임스 V. 포레스털(James V. Forrestal, 1892–1949)", "sum": "미국 해군장관. 항복 조건과 천황의 지위를 두고 국무·육군·해군 3부가 마주 앉은 협의에 해군 쪽 대표로 나온다.", "badge": "이 문서철의 주석", "points": ["4회 나온다", "「항복문서를 만들다」와 「일본의 항복」에 있다"]}, "_:110": {"title": "제임스 W. 리들버거(James W. Riddleberger, 1904–1982)", "sum": "미국 국무부 중부유럽과장. 독일 항복문서 초안과 점령 기구 문서를 실무에서 다뤘다. 사신에서는 「지미 리들버거」로 불린다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 4회 나온다", "「항복문서를 만들다」에만 나온다"]}, "_:111": {"title": "조지프 T. 매크나니(Joseph T. McNarney, 1893–1972)", "sum": "미국 육군 장군. 지중해 방면 연합군 부사령관을 맡았고 독일 항복과 점령 기구를 다루는 전보에 이름이 오른다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 4회 나온다", "「항복문서를 만들다」에만 나온다"]}, "_:112": {"title": "페르 야콥손(Per Jacobsson, 1894–1963)", "sum": "스웨덴 사람으로 바젤 국제결제은행(BIS)의 경제고문. 덜레스와 일본 쪽 사이를 오가며 종전 타진을 중계했다. 주바티칸 공사 하라다와는 국제연맹 시절부터 아는 사이다.", "badge": "이 문서철의 주석", "points": ["4회 나온다", "「일본의 항복」과 「스위스와 스웨덴을 거쳐」 양쪽에 기록이 있다"]}, "_:113": {"title": "기타무라 고지로(Kojiro Kitamura)", "sum": "국제결제은행(BIS) 이사. 요코하마정금은행을 대표했고 그 전에는 베를린 주재 재무관이었다. 1945년 스위스에서 이뤄진 종전 관련 접촉 기록에 이름이 오른다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 4회 나온다", "「일본의 항복」에만 나온다"]}, "_:114": {"title": "오노데라 마코토(小野寺信, 1897–1987)", "sum": "일본 육군 소장. 주스웨덴 육군무관으로 스톡홀름에서 정보 활동을 맡았다. 1945년 스웨덴을 거친 종전 타진에 그의 이름이 나온다. 일본 쪽 전보는 그를 「右武官」으로 적는다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 4회 나온다", "「일본의 항복」과 「스위스와 스웨덴을 거쳐」 양쪽에 나온다. 미국 쪽 기록과 일본 쪽 기록이 다 있다"]}, "_:115": {"title": "허버트 V. 에바트(Herbert V. Evatt, 1894–1965)", "sum": "오스트레일리아 외무장관. 뒤에 유엔 총회 의장을 맡았다. 1945년 일본의 항복 공식 발표에 오스트레일리아도 동시에 참여해야 한다고 요구한 진정이 남아 있다. 1948년에는 조선 문제 결의 초안을 미국과 공동으로 내자는 오스트레일리아 쪽 움직임의 승인자로 나온다.", "badge": "이 문서철의 주석", "points": ["4회 나온다", "「일본의 항복」과 「전쟁이 오기까지」에 걸친다"]}, "_:116": {"title": "카를 되니츠(Karl Dönitz, 1891–1980)", "sum": "독일 해군원수. 히틀러가 죽은 뒤 국가원수가 되어 항복을 결정했다. 항복 절차와 그 정부의 처리를 두고 연합국이 주고받는 전보에 나온다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 4회 나온다", "「독일 항복」에만 나온다"]}, "_:117": {"title": "톰 코널리(Tom Connally, 1877–1963)", "sum": "미국 상원의원이자 상원 외교위원회 위원장. 1945년 4월 샌프란시스코에서 독일의 항복 타진을 두고 한 발언이 누설 경위를 따지는 국무부 전보에 인용된다. 1949년 잡지 인터뷰에서 한 조선 관련 발언은 서울 신문들의 반박 사설을 불렀고, 애치슨이 기자회견에서 이를 해명한다.", "badge": "이 문서철의 주석", "points": ["4회 나온다", "「독일 항복」과 「전쟁이 오기까지」에 걸친다"]}, "_:118": {"title": "S. H. 잭슨(S. H. Jackson)", "sum": "유엔조선임시위원단의 오스트레일리아 대표. 1948년 위원단 안에서 남조선만의 선거 감시에 끝까지 반대했고, 남조선은 선거를 위한 자유로운 분위기가 없는 경찰국가라고 소총회에 보고하자고 주장했다. 6월 24일 서울을 떠났고 제이미슨이 그를 대신하도록 명령받았다.", "badge": "이 문서철의 주석", "points": ["4회 나온다", "모두 「전쟁이 오기까지」에 있다"]}, "_:119": {"title": "조지 S. 패터슨(George S. Patterson)", "sum": "유엔조선임시위원단 캐나다 대표. 1948년 2월 위원단 본회의에 총회 협의 대상자 선출 선거를 두고 결의안을 냈고, 4월 28일 선거 감시를 진행하기로 한 표결에서는 기권했다. 하지와 랭던이 워싱턴에 보낸 전보에 그의 발언이 되풀이해 인용된다.", "badge": "이 문서철의 주석", "points": ["4회 나온다", "「전쟁이 오기까지」에 있다"]}, "_:120": {"title": "자비(Djabi)", "sum": "유엔조선임시위원단 시리아 대표. 남조선에서만 선거를 치르는 데 반대했고, 정치범 석방 문제를 위원단에서 처음 제기한 사람으로 적힌다. 교체대표는 무기르(Mughir)다.", "badge": "이 문서철의 주석", "points": ["4회 나온다", "「전쟁이 오기까지」에 있다"]}, "_:121": {"title": "슈미트(Schmidt)", "sum": "이 표기로 두 사람이 나온다. 하나는 1941년 워싱턴에서 국무부 쪽 대화 비망록을 작성한 맥스 W. 슈미트(Max W. Schmidt)로, 해밀턴, 밸런타인과 함께 노무라 대사를 방문한 기록에 이름이 오른다. 다른 하나는 유엔조선임시위원단 사무국 수석서기 슈미트로, 1948년 하지의 전보에 사무국 인사로 나온다.", "badge": "이 문서철의 주석", "points": ["4회 나온다", "「진주만으로 가는 열 주」와 「전쟁이 오기까지」에 있다", "성이 같은 두 사람이 한 묶음에 들어 있다. 두 사람 모두 생몰년을 확인하지 못했다."]}, "_:122": {"title": "윤치영(尹致暎, 1898–1996)", "sum": "대한민국 내무부장관. 1948년 8월 미군에서 정부로 통치권을 넘기는 협의에 한국 쪽 지명자로 이름이 오른다. 뒤에는 대한국민당 소속 국회 부의장으로 나오며, 1950년 4월 선거 연기를 경고한 국무부 각서에 국회에서 반발한 발언이 대사관 보고에 길게 인용된다.", "badge": "이 문서철의 주석", "points": ["4회 나온다", "「전쟁이 오기까지」에 있다"]}, "_:123": {"title": "후스(胡適, 1891–1962)", "sum": "중경 국민정부의 주미대사. 1941년 워싱턴에서 미일 교섭의 진행을 살피고 중국의 뜻을 국무부에 넣었다. 미국 쪽 문서에는 이름 없이 「중국 대사」로만 적힌 곳이 있다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 4회 나온다", "「진주만으로 가는 열 주」와 「일미교섭 1941」 양쪽에 나온다"]}, "_:124": {"title": "맥스 W. 비숍(Max W. Bishop)", "sum": "미국 국무부 관리. 1945년에는 도쿄 주일 정치고문실에 있으면서 스즈키 내각 서기관장 사코미쓰 히사쓰네와의 대화 비망록을 작성했다. 1948년 12월에는 동북아과장으로 극동국장 버터워스에게 NSC 8의 재검토를 권고하는 각서를 냈다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "「일본의 항복」, 「014.1 Korea」, 「전쟁이 오기까지」에 걸친다"]}, "_:125": {"title": "요나이 미쓰마사(米内光政, 1880–1948)", "sum": "일본 해군대신. 종전 무렵 화평 쪽에 선 인물이다. 문서에는 이름 없이 직명만 적힌 곳도 있다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "「전황 보고」와 「스위스와 스웨덴을 거쳐」에 있다"]}, "_:126": {"title": "앤더슨(Anderson)", "sum": "미국 육군 장군. 미국 전략폭격조사단(USSBS)의 심문관으로 일본 쪽 인물을 심문한다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 3회 나온다", "「전황 보고」에만 나온다"]}, "_:127": {"title": "어니스트 J. 킹(Ernest J. King, 1878–1956)", "sum": "미 합동함대 총사령관 겸 해군작전부장. 카이로 회담에 배석했고 일본의 항복 접수 절차를 다루는 문서에도 이름이 오른다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 3회 나온다", "「카이로 선언과 조선」과 「일본의 항복」에 나온다"]}, "_:128": {"title": "레더스 경(Lord Leathers, 1883–1965)", "sum": "영국 전시운수성 장관. 카이로 회담에 수행해 선박 배정 문제를 다뤘다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "「카이로 선언과 조선」과 「스위스와 스웨덴을 거쳐」에 있다"]}, "_:129": {"title": "존 카터 빈센트(John Carter Vincent, 1900–1972)", "sum": "미국 국무부 극동국장. 1945년 조선 정책 문서를 만드는 국무부 쪽 책임자다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 3회 나온다", "「미국의 대한정책」에만 나온다"]}, "_:130": {"title": "조소앙(趙素昻, 1887–1958)", "sum": "대한민국임시정부 외무부장. 임시정부의 이름으로 연합국에 승인과 참전 자격을 요구했다. 1945년 조선 정책을 다루는 미국 국무부 문서에 그 요구를 낸 사람으로 나온다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 3회 나온다", "「미국의 대한정책」에만 나온다"]}, "_:131": {"title": "찰스 W. 매카시(Charles W. McCarthy)", "sum": "국무·육군·해군 3부조정위원회(SWNCC) 간사. 위원회 명의의 문서를 대표로 발송하는 사람이다. 조선에 관한 맥아더 지령을 우선 작성하라는 1945년 8월의 지시와, 독일 군정 지령 수정안을 국무부 차관보 클레이턴에게 보낸 각서가 그의 명의로 나간다.", "badge": "이 문서철의 주석", "points": ["묶음 전체가 3회 나온다", "「미국의 대한정책」, 「항복문서를 만들다」, 「전쟁이 오기까지」에 한 번씩 있다", "이름에 「찰스」가 들어가는 세 사람이 한 묶음에 들어 있다. 주이탈리아 영국 고등판무관 노엘 찰스(Noel Charles)와 육군부 참모부 계획작전국장 찰스 L. 볼테(Charles L. Bolté)는 매카시와 다른 사람이다. 캐나다 대사 레이턴 매카시(Leighton McCarthy)도 다른 사람이라 alias에 성만 넣지 않았다."]}, "_:132": {"title": "아르카디 A. 소볼레프(Arkady A. Sobolev, 1903–1964)", "sum": "소련 외교관. 1945년 런던에서 유럽자문위원회의 소련 측 대표대리이자 연합국협의위원회 의장이었고, 독일 항복 무렵의 회담 기록에 배석자로 이름이 오른다. 1948년에는 유엔 사무국의 안전보장·정치 담당 사무차장으로, 유엔조선임시위원단에 가는 지시를 결재하는 사람으로 나온다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "「항복문서를 만들다」와 「전쟁이 오기까지」에 걸친다"]}, "_:133": {"title": "E. 앨런 라이트너 2세(E. Allan Lightner, Jr.)", "sum": "유럽자문위원회(EAC) 미국 대표단의 서기관. 런던 회의의 기록과 실무를 맡았다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "모두 「항복문서를 만들다」에 있다"]}, "_:134": {"title": "앨프리드 더프 쿠퍼(Alfred Duff Cooper, 1890–1954)", "sum": "주프랑스 영국대사. 파리에서 프랑스 정부의 뜻을 런던에 전했다. 항복문서에 프랑스가 어떻게 낄지를 다루는 문서에 나온다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 3회 나온다", "「항복문서를 만들다」에만 나온다"]}, "_:135": {"title": "윌리엄 J. 도너번(William J. Donovan, 1883–1959)", "sum": "전략사무국(OSS) 국장. 일본의 항복 의사를 타진하는 정보를 정리한 각서의 작성자로 나온다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "모두 「일본의 항복」에 있다"]}, "_:136": {"title": "어니스트 베빈(Ernest Bevin, 1881–1951)", "sum": "영국 외무장관. 1945년 7월 노동당 정부에서 이든의 뒤를 이었다. 일본의 항복 조건을 두고 미국과 오간 협의에 영국 쪽 상대로 나온다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "모두 「일본의 항복」에 있다"]}, "_:137": {"title": "루이스 마운트배튼(Louis Mountbatten, 1900–1979)", "sum": "동남아시아사령부 연합국최고사령관. 일반명령 제1호에서 동남아시아 지역의 일본군 항복을 받는 사람으로 지정된다. 항복 접수 구역을 어떻게 나눌지 다투는 문서에 그의 이름이 나온다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 3회 나온다", "「일본의 항복」에만 나온다"]}, "_:138": {"title": "기도 고이치(木戸幸一, 1889–1977)", "sum": "내대신. 천황 곁에서 중신들의 뜻을 모으고 후임 총리를 고르는 일을 맡았다. 1941년 개전으로 가는 국면과 1945년 항복 결정 국면 양쪽에 그의 이름이 나온다. 미국 쪽 문서는 이름 없이 성만 적는다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 3회 나온다", "「진주만으로 가는 열 주」, 「일미교섭 1941」, 「일본의 항복」 세 문서철에 걸친다"]}, "_:139": {"title": "갤브레이스(Galbraith)", "sum": "1945년 11월 도쿄 문서에서는 미국 전략폭격조사단의 케네스 갤브레이스로 나온다. 내대신 기도 고이치와의 면담에서 들은 말을 주일 정치고문 대리 애치슨에게 전한 사람이다. 1950년 워싱턴 문서에서는 국무부 상호방위원조실(S/MDA)의 갤브레이스로, 대한민국에 대한 공군 지원 문제를 다루는 회의에 나온다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "「일본의 항복」과 「전쟁이 오기까지」에 걸친다", "1945년의 갤브레이스와 1950년의 갤브레이스가 같은 사람인지 문서만으로는 확인할 수 없다. 생몰년을 적지 않았다."]}, "_:140": {"title": "폴케 베르나도테(Folke Bernadotte, 1895–1948)", "sum": "스웨덴 적십자 부총재. 힘러가 서방에만 항복하겠다는 뜻을 전해 온 통로였다. 스톡홀름을 거쳐 들어온 그 타진이 문서에 남아 있다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "모두 「독일 항복」에 있다"]}, "_:141": {"title": "새뮤얼 레버(Samuel Reber)", "sum": "미국 국무부 관리. 1945년 4월까지 대독일 정치고문 머피 사절단의 참사관이었고, 파리 주재로 케넌의 전보가 전달되는 참조 수신처로 나온다. 뒤에는 유럽국장 특별보좌관과 유럽국 차장으로 적힌다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "「독일 항복」과 「전쟁이 오기까지」에 걸친다"]}, "_:142": {"title": "헨리 모겐소(Henry Morgenthau, Jr., 1891–1967)", "sum": "미국 재무장관. 독일을 농업국으로 되돌리자는 계획으로 점령 정책 논의에 이름이 오른다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "모두 「독일 항복」에 있다"]}, "_:143": {"title": "어니스트 A. 그로스(Ernest A. Gross, 1906–1999)", "sum": "미국 국무부 법률고문. 1948년 새로 설 조선 정부를 언제 어떤 자격으로 승인할지를 두고 극동국장 버터워스와 각서를 주고받는다. 승인 뒤에도 점령 권한을 얼마간 유지할 수 있다고 회신한 6월 1일자 각서가 그의 명의다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "「전쟁이 오기까지」에 있다"]}, "_:144": {"title": "시드니 W. 수어스(Sidney W. Souers, 1892–1973)", "sum": "미국 국가안전보장회의 사무국장. 조선에 관한 국가안전보장회의 보고 NSC 8을 1948년 4월 트루먼 대통령에게 올렸고, NSC 8/2를 대통령이 승인했다는 1949년 3월 23일자 표지 각서도 그의 명의다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "「전쟁이 오기까지」에 있다"]}, "_:145": {"title": "김두봉(金枓奉)", "sum": "조선최고인민회의 상임위원장. 1948년 9월 18일 소련최고회의 간부회가 소련군 철수 결정을 통보한 상대로 나온다. 주한 미국대사관 보고에서는 김일성, 박헌영, 김무정과 함께 북조선 지도자로 열거된다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "「전쟁이 오기까지」에 있다"]}, "_:146": {"title": "라이먼 L. 렘니처(Lyman L. Lemnitzer, 1899–1988)", "sum": "미국 육군 소장. 국방장관실 군사원조국장으로 대한민국에 대한 군사 원조를 다루는 회의에 국방부 쪽으로 참석한다. 1950년 5월 무초가 전투기 공여를 요청한 회의에서 남한이 극동에서 미국의 전략 위치에 특별한 값어치가 있다고 여겨지지 않는다고 발언한다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "「전쟁이 오기까지」에 있다"]}, "_:147": {"title": "야마모토 구마이치(山本熊一)", "sum": "일본 외무성 아메리카국장. 1941년 대미 교섭의 실무를 외무성 안에서 총괄했다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 3회 나온다", "「일미교섭 1941」과 「진주만으로 가는 열 주」 양쪽에 나온다"]}, "_:148": {"title": "오시마 히로시(大島浩, 1886–1975)", "sum": "주독일 일본대사. 육군 중장 출신으로 베를린에서 독일 쪽과의 통로를 맡았다. 일본 외무성 전보에는 「在独国大島大使」로 적혀 나온다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 3회 나온다", "「일미교섭 1941」과 「스위스와 스웨덴을 거쳐」 양쪽에 나온다. 1941년과 1945년에 걸친다"]}, "_:149": {"title": "쑹쯔원(宋子文, 1894–1971)", "sum": "중화민국 외교부장. 국민정부의 대외 교섭을 맡았고 대미 관계의 창구였다. 일본 외무성 문서에서는 중국 쪽의 움직임을 나타내는 이름으로 나온다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 3회 나온다", "「일미교섭 1941」과 「스위스와 스웨덴을 거쳐」 양쪽에 나온다. 1941년과 1945년에 걸친다"]}, "_:150": {"title": "바게(Bagge)", "sum": "주일 스웨덴공사. 중립국을 거친 종전 타진의 통로로 일본 외무성 전보에 나온다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "모두 「스위스와 스웨덴을 거쳐」에 있다"]}, "_:151": {"title": "하라다 겐(原田健)", "sum": "주바티칸 일본공사. 종전 타진 전보의 발신자다. 국제연맹 시절부터 알던 야콥손과의 친교가 통로가 됐다.", "badge": "이 문서철의 주석", "points": ["3회 나온다", "모두 「스위스와 스웨덴을 거쳐」에 있다"]}, "_:152": {"title": "간다(神田)", "sum": "주취리히 일본 총영사. 1945년 스위스에서 본성으로 보내는 전보의 발신자다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 3회 나온다", "「스위스와 스웨덴을 거쳐」에만 나온다"]}, "_:153": {"title": "마쓰오카 요스케(松岡洋右, 1880–1946)", "sum": "일본 외무대신. 삼국동맹과 일소중립조약을 밀어붙였고 1941년 7월 내각 개편으로 물러났다. 「진주만으로 가는 열 주」에서는 대미 교섭의 앞 국면을 맡았던 전임 외상으로 언급된다.", "badge": "이 문서철의 주석", "points": ["아카이브에서 3회 나온다", "「진주만으로 가는 열 주」에만 나온다"]}}, "panes": {"primary": "한국어 번역", "secondary": "영문 원문 · FRUS 정본", "both": "나란히"}, "warn": "번역 확신이 낮다. 원문 대조 필요.", "sorts": ["date", "order"]}</script>

 *
 * 화면 밖으로 나가지 않게 자리를 잡고, 키보드 초점에도 뜬다.
 * 손가락으로 쓰는 기기(hover: none)에서는 CSS 가 카드를 감춘다 — 링크는 그대로다.
 */
window.HoverCard = (function () {
  var DATA = {}, el = null, cur = null, showT = 0, hideT = 0;
  var DELAY = 260, HIDE = 140;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function ensure() {
    if (el) return el;
    el = document.createElement('div');
    el.className = 'hc';
    el.setAttribute('role', 'tooltip');
    document.body.appendChild(el);
    return el;
  }

  /* 자료의 핵심점에는 **굵게** 가 들어 있다. esc 만 하면 별표가 그대로 찍힌다. */
  function mk(s) {
    return esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1<\/strong>');
  }

  function html(d) {
    var pts = (d.points || []).slice(0, 2).map(function (p) {
      return '<li>' + mk(p) + '<\/li>';
    }).join('');
    return '<div class="hc-top"><span>' + esc(d.date || '날짜 미상') + '<\/span>' +
             (d.badge ? '<span class="id">' + esc(d.badge) + '<\/span>' : '') +
           '<\/div>' +
           '<h4>' + esc(d.title || '') + '<\/h4>' +
           (d.route ? '<p class="hc-route">' + esc(d.route) + '<\/p>' : '') +
           (d.sum ? '<p class="sum">' + mk(d.sum) + '<\/p>' : '') +
           (pts ? '<ul>' + pts + '<\/ul>' : '') +
           (d.go === false && !d.pages ? '' :
             '<div class="hc-foot"><span>' +
               (d.pages ? esc(d.pages) + '면' : '') +
             '<\/span>' +
             (d.go === false ? '' : '<span class="go">눌러서 원문 보기 →<\/span>') +
             '<\/div>');
  }

  /* 링크 옆에 놓되 화면 밖으로 나가지 않게 민다. 위아래는 공간이 넓은 쪽으로. */
  function place(a) {
    var r = a.getBoundingClientRect();
    var w = el.offsetWidth, h = el.offsetHeight, m = 12;
    var top = r.bottom + 8;
    if (top + h > innerHeight - m && r.top - h - 8 > m) top = r.top - h - 8;
    top = Math.max(m, Math.min(top, innerHeight - h - m));
    var left = Math.min(r.left, innerWidth - w - m);
    el.style.top = top + 'px';
    el.style.left = Math.max(m, left) + 'px';
  }

  function show(a) {
    var d = DATA[a.dataset.card];
    if (!d) return;
    ensure();
    el.innerHTML = html(d);
    el.style.visibility = 'hidden';
    el.setAttribute('data-open', '');
    place(a);                    // 크기를 잰 뒤에 자리를 잡아야 한다
    el.style.visibility = '';
    cur = a;
  }

  function hide() {
    if (!el) return;
    el.removeAttribute('data-open');
    cur = null;
  }

  function bind(a) {
    function enter() {
      clearTimeout(hideT);
      clearTimeout(showT);
      showT = setTimeout(function () { show(a); }, DELAY);
    }
    function leave() {
      clearTimeout(showT);
      hideT = setTimeout(hide, HIDE);
    }
    a.addEventListener('mouseenter', enter);
    a.addEventListener('mouseleave', leave);
    a.addEventListener('focus', function () { clearTimeout(hideT); show(a); });
    a.addEventListener('blur', leave);
  }

  return {
    init: function (data, root) {
      // 덮어쓰지 않고 얹는다 — 본문 용어와 연대 바가 서로 다른 때에 init 을 부른다
      var add = data || {};
      for (var k in add) if (Object.prototype.hasOwnProperty.call(add, k)) DATA[k] = add[k];
      var scope = root || document;
      [].forEach.call(scope.querySelectorAll('[data-card]'), bind);
      addEventListener('scroll', function () { if (cur) place(cur); }, true);
      addEventListener('keydown', function (e) { if (e.key === 'Escape') hide(); });
    },
    hide: hide
  };
})();
</script>
<script>
const DOCS = JSON.parse(document.getElementById('data').textContent);
const CONF = JSON.parse(document.getElementById('conf').textContent);
const PG = CONF.pages;   // null 이면 스캔 기능이 없는 자료다

let state = {q:'', groups:new Set(),
             sort:(CONF.sorts && CONF.sorts[0]) || null,
             view:'primary', cur:null};

const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* 본문에서 특별 취급하는 것은 두 가지뿐이다.
   [1050면] → 원본 지면 구분선(스캔이 있으면 눌러서 열린다), [주74] → 각주 참조.
   d777처럼 편집 이력을 취소선·굵게로 복원한 문서가 있어 인라인 서식도 함께 푼다. */
function marks(t){
  const cls = PG ? 'pagemark hit' : 'pagemark';
  const tail = PG ? '면 · 원본 보기' : '면';
  return esc(t)
    .replace(/\[(\d+)면\]/g, `<span class="${cls}" data-pg="$1">$1${tail}</span>`)
    .replace(/\[주(\d+)\]/g, '<span class="fnref">$1</span>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

/* 줄머리의 마크다운. 번역이 길어지면 옮긴 쪽이 `## 소제목` 과 `- 항목` 으로
   나눠 두는데, 그대로 두면 우물정자와 붙임표가 본문에 그냥 찍힌다.
   본문 상자가 pre-wrap 이라 문단을 다시 짜지 않고 줄 단위로만 푼다. */
function blocks(t){
  const out = [];
  for (const line of String(t == null ? '' : t).split('\n')){
    let m;
    if ((m = /^(#{1,6})\s+(.*)$/.exec(line)))
      out.push(`<b class="mdh h${m[1].length}">${marks(m[2])}</b>`);
    else if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line))
      out.push('<hr class="mdhr">');
    else if ((m = /^\s*>\s?(.*)$/.exec(line)))
      out.push(`<span class="mdq">${marks(m[1])}</span>`);
    else if ((m = /^\s*(\d+)[.)]\s+(.*)$/.exec(line)))
      out.push(`<span class="mdli" data-n="${esc(m[1])}.">${marks(m[2])}</span>`);
    else if ((m = /^\s*[-*+]\s+(.*)$/.exec(line)))
      out.push(`<span class="mdli">${marks(m[1])}</span>`);
    else
      out.push(marks(line) + '\n');
  }
  return out.join('').replace(/\n$/, '');
}

const haystack = d => [d.id, d.date, d.title, d.eyebrow, d.summary, d.search,
    (d.points||[]).join(' '), (d.meta||[]).map(m=>m.v).join(' '),
    (d.notes||[]).join(' '), d.note, d.primary, d.secondary]
  .join(' ').toLowerCase();

function visible(){
  const q = state.q.trim().toLowerCase();
  let out = DOCS.filter(d => {
    if (state.groups.size && !state.groups.has(d.group)) return false;
    return !q || haystack(d).includes(q);
  });
  if (state.sort === 'date')
    out.sort((a,b) => (a.date||'9999').localeCompare(b.date||'9999') || a.order - b.order);
  else if (state.sort)
    out.sort((a,b) => a.order - b.order);
  return out;
}

/* 목록에서 지금 읽는 문서가 있는 자리로 목록을 옮긴다.
   주제 화면이나 연표에서 문서를 찍고 들어오면 본문은 그 문서인데 목록은 맨 위에
   서 있었다 — 152건 중 66번째를 읽으면서 내가 어디쯤인지 목록에서 찾아야 했다.
   `center` 는 밖에서 들어왔을 때다. 앞뒤가 같이 보여야 어디쯤인지 알 수 있다.
   목록 안에서 눌러 옮길 때는 이미 보이는 것을 굳이 움직이지 않는다. */
function revealCur(center){
  const list = $('#list');
  const el = list.querySelector('.item[aria-current="true"]');
  if (!el) return;                       // 갈래·검색에 걸려 목록 밖으로 나갔다
  const r = el.getBoundingClientRect(), c = list.getBoundingClientRect();
  if (center) list.scrollTop += (r.top - c.top) - (c.height - r.height) / 2;
  else if (r.top < c.top) list.scrollTop += r.top - c.top - 8;
  else if (r.bottom > c.bottom) list.scrollTop += r.bottom - c.bottom + 8;
}

function renderList(center){
  const items = visible();
  $('#count').textContent = `${items.length}건`;
  $('#list').innerHTML = items.map(d => `
    <button class="item t${d.group||'X'}" data-id="${esc(d.id)}"
            aria-current="${state.cur===d.id}">
      <div class="item-top"><span>${esc(d.date||'날짜미상')}</span>
        <span>${esc(d.list_right||'')}</span></div>
      <div class="item-sum">${esc(d.title||d.id)}</div>
      ${d.summary?`<div class="item-hint">${esc(d.summary)}</div>`:''}
    </button>`).join('') ||
    '<div class="empty">해당하는 문서가 없다.</div>';
  revealCur(center);
}

function pane(kind){
  const d = DOCS.find(x => x.id === state.cur);
  const txt = kind==='primary' ? d.primary : d.secondary;
  if (!txt) return '';
  const cls = kind==='primary' ? 'body' : 'body en';
  return `<div class="pane"><h2>${esc(CONF.panes[kind])}</h2>
    <div class="${cls}">${blocks(txt)}</div></div>`;
}

function renderDoc(){
  const d = DOCS.find(x => x.id === state.cur);
  if (!d){ $('#main').innerHTML =
    '<div class="empty">왼쪽에서 문서를 고르세요.</div>'; renderStepBar(); return; }

  const meta = (d.meta||[]).filter(m => m && m.v).map(m =>
    `<div class="${m.wide?'wide':''}"><b>${esc(m.k)}</b>` +
    `<span class="${m.txt?'txt':''}">${esc(m.v)}</span></div>`).join('')
    + (d.links||[]).filter(l => l && l.url).map(l =>
    `<div><b>${esc(l.k)}</b><span class="txt"><a href="${esc(l.url)}" target="_blank"
       rel="noopener">${esc(l.text||l.url)}</a></span></div>`).join('');

  const pts = (d.points||[]).length
    ? `<div class="points"><ul>${d.points.map(p=>`<li>${marks(p)}</li>`).join('')}</ul></div>` : '';

  const cols = state.view==='both'
      ? `<div class="cols two">${pane('primary')}${pane('secondary')}</div>`
      : `<div class="cols">${pane(state.view)}</div>`;

  const fns = (d.notes||[]).length
    ? `<div class="fns"><h2>각주</h2>${d.notes.map(n=>`<div>${marks(n)}</div>`).join('')}</div>` : '';

  // 목록에는 작은 사본을 쓴다. 원본은 확대해 볼 때만 받는다 —
  // 84×110 으로 찍으면서 883KB 를 내려받던 것을 고친 것이다.
  const thumb = p => PG.thumbs
    ? `${PG.thumbs}/${p}.${PG.thumb_ext||'jpg'}` : `${PG.dir}/${p}.${PG.ext}`;
  const scans = (PG && (d.pages||[]).length)
    ? `<div class="scans"><h2>${esc(PG.label||'원본 지면')} ${d.pages.length}면</h2>
        <div class="thumbs">${d.pages.map(p=>
          `<button class="thumb" data-pg="${p}" title="${p}면 크게 보기">
             <img loading="lazy" src="${thumb(p)}" alt="${p}면 원본"><b>${p}</b>
           </button>`).join('')}</div></div>` : '';

  $('#main').innerHTML = `<article>
    <div class="doc-head">
      ${d.eyebrow?`<div class="docid">${esc(d.eyebrow)}</div>`:''}
      <h1>${esc(d.title||d.id)}
        ${d.badge?`<span class="stamp">${esc(d.badge)}</span>`:''}</h1>
      ${meta?`<div class="meta">${meta}</div>`:''}
    </div>
    ${d.summary?`<div class="points">${marks(d.summary)}</div>`:''}
    ${pts}${cols}${fns}${scans}
    ${d.note?`<div class="note">${esc(d.note)}</div>`:''}
    ${d.warn?`<div class="note warn">${esc(CONF.warn)}</div>`:''}
    ${renderStep()}
  </article>`;
  $('#main').scrollTop = 0;
  markTerms(d.id);
  markNow(d.date);
  renderStepBar();
}

/* ── 앞뒤로 넘기기 ─────────────────────────────
   지금 걸려 있는 검색·갈래·정렬 안에서의 앞뒤다. 전보만 골라 놓고 넘겼는데
   각서가 나오면 고른 것이 무슨 소용인가. */
function neighbours(){
  const items = visible();
  const i = items.findIndex(x => x.id === state.cur);
  // 갈래를 거는 순간 읽던 문서가 목록 밖으로 나갈 수 있다. 그때 화살표까지
  // 죽으면 빠져나갈 길이 없다 — 걸린 목록의 첫 문서로 보내 준다.
  if (i < 0) return {i:-1, n:items.length, prev:null, next:items[0]||null};
  return {i, n:items.length, prev:items[i-1]||null, next:items[i+1]||null};
}
function step(dir){
  const {prev, next} = neighbours();
  const t = dir < 0 ? prev : next;
  if (t) select(t.id);
}
/* 문서 끝 — 다음 문서가 무엇인지 이름까지 보여 준다. 무엇이 오는지 알고 넘긴다. */
function renderStep(){
  const {i, n, prev, next} = neighbours();
  if (n < 2 || (i < 0 && !next)) return '';
  const side = (d, dir) => d
    ? `<button class="step ${dir}" data-step="${dir==='prev'?-1:1}">
         <span class="step-k">${dir==='prev'?'← 이전':'다음 →'}</span>
         <span class="step-d">${esc(d.date||'날짜미상')}</span>
         <span class="step-t">${esc(d.title||d.id)}</span>
       </button>`
    : `<span class="step empty ${dir}">${dir==='prev'?'첫 문서':'마지막 문서'}</span>`;
  return `<nav class="steps" aria-label="문서 넘기기">
    ${side(prev,'prev')}<span class="step-n">${i<0?'—':i+1} / ${n}</span>${side(next,'next')}</nav>`;
}
/* 갈래·검색을 바꾸면 앞뒤가 달라진다 — 문서를 통째로 다시 그리지 않고
   끝의 안내만 갈아 끼운다. 읽던 자리를 잃지 않게. */
function renderStepBar(){
  const art = document.querySelector('#main article'); if (!art) return;
  const old = art.querySelector('.steps');
  const html = renderStep();
  if (!html){ if (old) old.remove(); return; }
  if (old) old.outerHTML = html; else art.insertAdjacentHTML('beforeend', html);
}

/* 본문 속 용어에 주석을 붙인다.
   HTML 문자열을 치환하면 이미 만들어 둔 태그(면 표시·각주·굵게) 안을 건드려
   깨진다. 그래서 다 그린 뒤 **텍스트 노드만** 훑는다. */
function markTerms(scope){
  const rules = (CONF.terms||{});
  const list = [].concat(rules['_']||[], rules[scope]||[]);
  if (!list.length) return;
  const roots = document.querySelectorAll('#main .body');
  roots.forEach(root => {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(n){
        // 이미 링크·주석·코드 안이면 건드리지 않는다
        if (n.parentElement.closest('a,.term,.pagemark,.fnref,code,del'))
          return NodeFilter.FILTER_REJECT;
        return n.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    const targets = [];
    while (walker.nextNode()) targets.push(walker.currentNode);
    targets.forEach(node => {
      let html = null, rest = node.nodeValue;
      for (const r of list){
        const i = rest.indexOf(r.w);
        if (i < 0) continue;
        html = html || document.createDocumentFragment();
        break;
      }
      if (!html) return;
      // 가장 먼저 나오는 것부터 차례로 잘라 붙인다
      const frag = document.createDocumentFragment();
      let s = node.nodeValue;
      let guard = 0;
      while (s && guard++ < 200){
        let best = null;
        for (const r of list){
          const i = s.indexOf(r.w);
          if (i >= 0 && (!best || i < best.i || (i === best.i && r.w.length > best.r.w.length)))
            best = {i, r};
        }
        if (!best){ frag.appendChild(document.createTextNode(s)); break; }
        if (best.i) frag.appendChild(document.createTextNode(s.slice(0, best.i)));
        // 지금 보고 있는 문서를 가리키는 번호는 링크로 만들지 않는다 — 제자리걸음이다
        const self = best.r.doc && best.r.doc === scope;
        const el = document.createElement(best.r.href && !self ? 'a' : 'span');
        el.className = 'term';
        el.textContent = best.r.w;
        el.dataset.card = best.r.k;
        if (best.r.href && !self) el.setAttribute('href', best.r.href);
        frag.appendChild(el);
        s = s.slice(best.i + best.r.w.length);
      }
      node.parentNode.replaceChild(frag, node);
    });
  });
  if (window.HoverCard) HoverCard.init(CONF.term_cards || {}, document.getElementById('main'));
}

/* ── 연대 바 ───────────────────────────────
   문서를 하나씩 읽다 보면 「얄타가 언제였더라」를 매번 놓친다.
   5년 반을 한 화면에 눌러 담으면 1945년 8월 열흘이 0.5%로 뭉개져 이름이 겹친다.
   그래서 셋으로 나눠 푼다.
     (1) 축을 길게 늘여 놓고 띠를 민다 — 지금 문서의 날짜가 늘 정중앙.
         띠는 진짜 가로 스크롤이라 손으로도 밀 수 있다.
     (2) 그래도 남는 겹침은 이름을 위아래 층으로 흩어 푼다.
     (3) 해가 바뀌는 자리에 선을 긋고, 이름표는 창 왼쪽에 들러붙인다 —
         1945년 한복판을 보고 있어도 「1945」가 떠나지 않는다.
   덕분에 사건 이름을 하나도 숨기지 않는다.

   자리는 전부 날짜에서 다시 계산한다. 그래야 배율을 바꿔도(줌) 같은 코드로
   다시 그릴 수 있다. 화면에 박아 둔 좌표는 없다. */
const CH = CONF.chrono;
const CH_STEPS = [0.6, 1.2, 2.5, 4, 8, 16, 32];  // 하루 몇 px
const CH_LANE = 14;    // 이름 한 층의 높이
const CH_GAP  = 5;     // 같은 층에서 이름끼리 띄울 최소 간격
let CH_PXD = 4;        // 기본 배율 — 창 하나에 대략 여덟 달
let chFrom=0, chEndT=0, chMarks=[], chBands=[], chTicks=[];
const chX = t => ((t - chFrom) / 86400000) * CH_PXD;

function initChrono(){
  const box = $('#chrono');
  if (!CH || !box){ if (box) box.hidden = true; return; }
  chFrom = Date.parse(CH.from);
  chEndT = Date.parse(CH.to);

  // 연표는 문서철을 가리지 않고 공용이라, 문서철이 그 바깥으로 나갈 수 있다.
  // 그러면 그 문서의 커서가 눈금 끝 너머에 놓여 띠가 끝에 붙박이고, 1949년
  // 이후 문서를 아무리 넘겨도 띠는 같은 자리에서 움직이지 않는다.
  // 자료를 연표에 맞추라고 할 수는 없으니 눈금 쪽을 자료에 맞춰 늘린다.
  for (const d of DOCS){
    const t = Date.parse(d.date || '');
    if (isNaN(t)) continue;
    if (t < chFrom) chFrom = t;
    if (t > chEndT) chEndT = t;
  }

  const track = $('#chronoTrack');

  // 연도는 「선」이다. 이 선부터 1944, 저 선부터 1945.
  // 한 해를 띠(band)로 잡아 두면 이름표를 그 띠 안에서 움직일 수 있다.
  const y0 = new Date(chFrom).getFullYear(), y1 = new Date(chEndT).getFullYear();
  for (let y = y0; y <= y1; y++){
    const el = document.createElement('div');
    el.className = 'cy' + (y % 2 ? ' alt' : '');
    el.innerHTML = '<b>' + y + '</b>';
    track.appendChild(el);
    chBands.push({el, tag: el.firstChild,
                  t0: Math.max(chFrom, Date.parse(y + '-01-01')),
                  t1: Math.min(chEndT,  Date.parse((y + 1) + '-01-01'))});

    ['02','03','04','05','06','07','08','09','10','11','12'].forEach(m => {
      const t = Date.parse(y + '-' + m + '-01');
      if (t < chFrom || t > chEndT) return;
      const q = document.createElement('div');
      q.className = 'cq' + (m === '04' || m === '07' || m === '10' ? ' q' : '');
      track.appendChild(q);
      chTicks.push({el: q, t});
    });
  }

  // 점과 이름을 한꺼번에 놓는다.
  // 점·이름 어느 쪽에 머물러도 그 사건이 무엇이었는지 카드로 뜬다 —
  // 이름 넉 자로는 「38선 획정」이 무슨 문서에서 어떻게 갈렸는지 알 수 없다.
  // **바에는 이정표만 띄운다.** 사건 목록에는 주제 화면에 실리는 것까지
  // 함께 들어 있어 184개인데, 그것을 다 찍으면 12년 치 띠가 빗금이 된다.
  // 바가 성글어야 「지금 읽는 것이 어느 즈음인가」가 한눈에 잡힌다.
  const cards = {};
  chMarks = CH.events.filter(e => e.bar).map(e => {
    const t = Date.parse(e.date), key = 'ch:' + e.id;
    cards[key] = {title: e.label, date: e.date, route: e.where || '',
                  sum: e.note || '', go: false};

    const dot = document.createElement('div');
    dot.className = 'cm' + (e.key ? ' key' : '');
    dot.dataset.card = key;
    track.appendChild(dot);

    const lab = document.createElement('div');
    lab.className = 'cl' + (e.key ? ' key' : '');
    lab.textContent = e.label;
    lab.dataset.card = key;
    lab.tabIndex = 0;
    track.appendChild(lab);
    return {t, dot, lab};
  });

  renderChrono();
  if (window.HoverCard) HoverCard.init(cards, track);
  // 글꼴이 늦게 오면 아까 잰 이름 너비가 틀린다 — 오고 나서 한 번 더 잰다
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderChrono);
}

/* 배율이 바뀔 때마다 날짜에서 자리를 다시 뽑는다 */
function renderChrono(){
  const track = $('#chronoTrack');
  if (!track || !chMarks.length) return;
  track.style.width = chX(chEndT) + 'px';
  chBands.forEach(b => {
    b.x0 = chX(b.t0); b.x1 = chX(b.t1);
    b.el.style.left  = b.x0 + 'px';
    b.el.style.width = (b.x1 - b.x0) + 'px';
  });
  // 달 눈금은 넉넉히 벌어졌을 때만. 좁을 때는 빗금처럼 보여 축을 더럽힌다
  chTicks.forEach(k => {
    k.el.style.left = chX(k.t) + 'px';
    k.el.hidden = !k.el.classList.contains('q') && CH_PXD < 4;
  });
  chMarks.forEach(m => {
    m.x = chX(m.t);
    m.dot.style.left = m.x + 'px';
    m.lab.style.left = m.x + 'px';
  });
  chMarks.sort((a, b) => a.x - b.x);
  layoutChrono();
  const t = Date.parse(chCur || '');
  if (!isNaN(t)){
    $('#chronoCursor').style.left = chX(t) + 'px';
    $('#chronoDate').style.left = chX(t) + 'px';
  }
  stickYears();

  // 지금 창에 얼마만큼의 시간이 들어와 있는지. 배율을 바꿀 때 유일한 길잡이다
  const vp = $('#chronoVp'), sc = $('#chronoScale');
  if (vp && sc){
    const d = vp.clientWidth / CH_PXD;
    sc.textContent = d >= 400 ? '창 폭 ' + (d / 365).toFixed(1) + '년'
                   : d >= 55  ? '창 폭 ' + Math.round(d / 30) + '달'
                              : '창 폭 ' + Math.round(d) + '일';
  }
  const z = $('#chronoZoom'), i = CH_STEPS.indexOf(CH_PXD);
  if (z){
    z.querySelector('[data-z="-1"]').disabled = i <= 0;
    z.querySelector('[data-z="1"]').disabled  = i >= CH_STEPS.length - 1;
  }
}

/* 줌. 창 안의 한 지점을 붙들어 두고 그 둘레를 늘이거나 줄인다 —
   붙들지 않으면 배율을 바꿀 때마다 보던 자리를 잃는다. */
function chZoom(dir, holdPx){
  const vp = $('#chronoVp');
  if (!vp) return;
  const i = CH_STEPS.indexOf(CH_PXD);
  const j = Math.max(0, Math.min(CH_STEPS.length - 1, i + dir));
  if (j === i) return;
  const pad = parseFloat(getComputedStyle(vp).getPropertyValue('--chPad')) || 0;
  const px = holdPx == null ? vp.clientWidth / 2 : holdPx;
  const hold = chFrom + ((vp.scrollLeft - pad + px) / CH_PXD) * 86400000;
  CH_PXD = CH_STEPS[j];
  renderChrono();
  vp.scrollLeft = pad + chX(hold) - px;
  stickYears();
}

function layoutChrono(){
  const box = $('#chrono'), items = chMarks;
  if (!box || !items.length) return;

  // 층 배정 — 왼쪽부터, 그 층의 마지막 이름과 안 겹치는 첫 층에 얹는다.
  // 층 0,1,2… 를 위·아래로 번갈아 내보내면 축을 사이에 두고 고르게 흩어진다.
  const ends = [];
  let lanes = 0;
  items.forEach(it => {
    const half = it.lab.offsetWidth / 2;
    let k = 0;
    while (k < ends.length && ends[k] > it.x - half) k++;
    ends[k] = it.x + half + CH_GAP;
    it.lane = k;
    lanes = Math.max(lanes, k + 1);
  });

  // 층 수가 정해져야 바 높이와 축의 자리가 나온다
  const up = Math.ceil(lanes / 2), dn = lanes - up;   // 위쪽이 한 층 더
  const axis = 12 + up * CH_LANE;                     // 위 여백 + 위층들
  const H    = axis + dn * CH_LANE + 26;              // 아래층들 + 연도·날짜 자리
  box.style.setProperty('--chH', H + 'px');
  box.style.setProperty('--axis', axis + 'px');

  items.forEach(it => {
    const side = it.lane % 2 === 0 ? 'up' : 'dn';     // 0,2,4…는 위 / 1,3,5…는 아래
    const row  = Math.floor(it.lane / 2);             // 축에서 몇 번째 층인가
    it.lab.classList.remove('up', 'dn');
    it.lab.classList.add(side);
    if (side === 'up'){
      it.lab.style.top = (axis - 8 - (row + 1) * CH_LANE) + 'px';
      it.lab.style.setProperty('--leg', (CH_LANE * row + 8) + 'px');
    } else {
      it.lab.style.top = (axis + 8 + row * CH_LANE) + 'px';
      it.lab.style.setProperty('--leg', (CH_LANE * row + 8) + 'px');
    }
  });
}

/* 연도 이름표를 창 왼쪽에 들러붙인다. 그 해의 띠가 창에 걸쳐 있는 동안은
   이름표가 띠를 벗어나지 않는 선에서 왼쪽 끝을 따라다닌다. */
function stickYears(){
  const vp = $('#chronoVp');
  if (!vp || !chBands.length) return;
  const pad = parseFloat(getComputedStyle(vp).getPropertyValue('--chPad')) || 0;
  const L = vp.scrollLeft - pad;                 // 창 왼쪽이 띠 좌표계에서 어디인가
  chBands.forEach(b => {
    const w = b.tag.offsetWidth;
    const x = Math.max(0, Math.min(L + 6 - b.x0, b.x1 - b.x0 - w - 2));
    b.tag.style.left = x + 'px';
  });
}

let chCur = null, chJump = null;
function markNow(date){
  const box = $('#chrono'), vp = $('#chronoVp');
  if (!CH || !box || !vp) return;
  chCur = date;
  const t = Date.parse(date || '');
  if (!date || isNaN(t)){ box.dataset.nodate = '1'; return; }
  delete box.dataset.nodate;

  // 창 절반만큼 양옆에 여백을 둬야 첫 문서도 마지막 문서도 가운데에 설 수 있다.
  // 양 끝을 붙잡지 않는다 — 붙잡으면 「가운데가 곧 지금」이라는 약속이 깨진다.
  const vpW = vp.clientWidth;
  box.style.setProperty('--chPad', (vpW / 2) + 'px');
  $('#chronoCursor').style.left = chX(t) + 'px';
  const dl = $('#chronoDate');
  dl.style.left = chX(t) + 'px';
  dl.textContent = date;

  // 곧바로 옮긴다. 부드럽게 미는 길(scrollTo behavior:'smooth' 도, CSS 의
  // scroll-behavior 도) 은 브라우저 설정에 따라 통째로 무시돼서, 띠가 아예
  // 안 움직인 적이 있다. 움직이지 않는 띠보다 툭 옮겨지는 띠가 낫다.
  clearTimeout(chJump);
  chJump = setTimeout(() => { vp.scrollLeft = chX(t); stickYears(); }, 0);
}

/* 손으로도 민다 — 세로 휠은 가로로 바꿔 주고, 끌어서도 옮길 수 있게 */
function initChronoScroll(){
  const vp = $('#chronoVp');
  if (!vp) return;
  vp.addEventListener('scroll', stickYears, {passive: true});
  vp.addEventListener('wheel', e => {
    // ⌘/Ctrl 을 누른 채 굴리면 배율. 손가락 아래 날짜를 붙들고 늘인다
    if (e.ctrlKey || e.metaKey){
      e.preventDefault();
      chZoom(e.deltaY < 0 ? 1 : -1, e.clientX - vp.getBoundingClientRect().left);
      return;
    }
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (!d) return;
    e.preventDefault();
    vp.scrollLeft += d;
  }, {passive: false});

  const z = $('#chronoZoom');
  if (z) z.addEventListener('click', e => {
    const b = e.target.closest('button[data-z]');
    if (b) chZoom(+b.dataset.z, null);
  });

  let down = false, x0 = 0, s0 = 0, moved = false;
  vp.addEventListener('pointerdown', e => {
    down = true; moved = false; x0 = e.clientX; s0 = vp.scrollLeft;
    vp.classList.add('drag');
  });
  vp.addEventListener('pointermove', e => {
    if (!down) return;
    if (Math.abs(e.clientX - x0) > 3){ moved = true; vp.setPointerCapture(e.pointerId); }
    if (moved) vp.scrollLeft = s0 - (e.clientX - x0);
  });
  const up = () => { down = false; vp.classList.remove('drag'); };
  vp.addEventListener('pointerup', up);
  vp.addEventListener('pointercancel', up);
}

/* 좁은 화면의 목록 서랍. 문서를 고르면 닫힌다 — 고른 것을 보러 온 것이지
   목록을 계속 보려던 것이 아니다. */
const railBtn = $('#railBtn');
function rail(open){
  document.body.classList.toggle('railopen', open);
  if (railBtn) railBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
}
if (railBtn) railBtn.addEventListener('click',
  () => rail(!document.body.classList.contains('railopen')));
$('#scrim').addEventListener('click', () => rail(false));

document.addEventListener('click', e => {
  const b = e.target.closest('[data-step]');
  if (b && !b.disabled) step(+b.dataset.step);
});
addEventListener('keydown', e => {
  if (e.key === 'Escape'){ rail(false); return; }
  // 검색창에 글을 치는 중이면 화살표는 글자 사이를 오가야 한다
  const t = e.target;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.key === 'ArrowLeft'  || e.key === 'k'){ step(-1); e.preventDefault(); }
  if (e.key === 'ArrowRight' || e.key === 'j'){ step(1);  e.preventDefault(); }
});

function select(id){ state.cur=id; renderList(); renderDoc(); rail(false);
  document.querySelector('.main').scrollTop = 0;
  history.replaceState(null,'','#'+id); }

$('#q').addEventListener('input', e => { state.q=e.target.value; renderList(); renderStepBar(); });
$('#list').addEventListener('click', e => {
  const b = e.target.closest('.item'); if (b) select(b.dataset.id); });
document.querySelectorAll('.chip[data-group]').forEach(c => c.addEventListener('click', () => {
  const k=c.dataset.group;
  state.groups.has(k)?state.groups.delete(k):state.groups.add(k);
  c.setAttribute('aria-pressed', state.groups.has(k));
  renderList(); renderStepBar();
}));
document.querySelectorAll('[data-sort]').forEach(b => b.addEventListener('click', () => {
  state.sort=b.dataset.sort;
  document.querySelectorAll('[data-sort]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  renderList(); renderStepBar();
}));
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
  state.view=b.dataset.view;
  document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  renderDoc();
}));
/* 명암 단추는 둘이다 — 넓은 화면은 툴바, 좁은 화면은 위쪽 바.
   좁은 화면에서 툴바가 두 줄로 접히면 본문이 그만큼 밀려난다. */
document.querySelectorAll('[data-theme-btn]').forEach(b => b.addEventListener('click', () => {
  const r=document.documentElement;
  const dark=(r.getAttribute('data-theme')||
    (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark';
  r.setAttribute('data-theme', dark?'light':'dark');
}));

// ── 확대 뷰어 ─── 스캔이 없는 자료에서는 통째로 건너뛴다
if (PG){
  let lbPages = [], lbAt = 0;
  const lb = $('#lb'), lbImg = $('#lbImg'), lbStage = $('#lbStage');
  const src = p => `${PG.dir}/${p}.${PG.ext}`;

  function lbShow(){
    const p = lbPages[lbAt];
    lbImg.src = src(p);
    lbImg.alt = `${p}면 원본`;
    $('#lbPg').textContent = `${p}면  (${lbAt+1}/${lbPages.length})`;
    $('#lbPrev').disabled = lbAt === 0;
    $('#lbNext').disabled = lbAt === lbPages.length - 1;
    $('#lbOpen').href = src(p);
    lbStage.scrollTop = 0;
  }
  function lbOpen(pg){
    const d = DOCS.find(x => x.id === state.cur);
    lbPages = (d && d.pages || []).slice();
    // 면 번호는 숫자일 수도 "0003" 같은 문자열일 수도 있다. 문자열로 맞춰 찾는다.
    lbAt = lbPages.map(String).indexOf(String(pg));
    if (lbAt < 0){ lbPages = [pg]; lbAt = 0; }
    lb.setAttribute('open',''); lbShow();
  }
  function lbClose(){ lb.removeAttribute('open'); lbImg.removeAttribute('src'); }
  function lbStep(n){
    const i = lbAt + n;
    if (i >= 0 && i < lbPages.length){ lbAt = i; lbShow(); }
  }

  $('#main').addEventListener('click', e => {
    const t = e.target.closest('.thumb,.pagemark.hit');
    if (t) lbOpen(t.dataset.pg);
  });
  $('#lbPrev').addEventListener('click', () => lbStep(-1));
  $('#lbNext').addEventListener('click', () => lbStep(1));
  $('#lbClose').addEventListener('click', lbClose);
  lb.addEventListener('click', e => { if (e.target === lb || e.target === lbStage) lbClose(); });
  $('#lbFit').addEventListener('click', e => {
    const fit = lbStage.classList.toggle('fit');
    e.target.setAttribute('aria-pressed', fit);
    e.target.textContent = fit ? '실제 크기' : '화면 맞춤';
  });
  addEventListener('keydown', e => {
    if (!lb.hasAttribute('open')) return;
    if (e.key === 'Escape') lbClose();
    else if (e.key === 'ArrowLeft') lbStep(-1);
    else if (e.key === 'ArrowRight') lbStep(1);
  });
}

/* 주소의 #문서번호 로 들어왔다. 밖에서 지정해 준 자리이므로 목록도 그 자리에
   맞춰 세운다. 뒤로 가기로 되돌아오는 경우도 같다 — select() 는 주소만 바꾸므로
   (replaceState) 여기서 열리는 것은 다른 화면에서 건너온 문서다. */
addEventListener('hashchange', () => {
  const id = decodeURIComponent((location.hash||'').slice(1));
  if (!id || id === state.cur || !DOCS.some(d => d.id === id)) return;
  state.cur = id;
  renderList(true); renderDoc();
  document.querySelector('.main').scrollTop = 0;
});

state.cur = decodeURIComponent((location.hash||'').slice(1)) ||
            visible()[0]?.id || DOCS[0]?.id;
if (!DOCS.some(d => d.id === state.cur)) state.cur = DOCS[0].id;
initChrono(); initChronoScroll();
addEventListener('resize', () => { renderChrono(); markNow(chCur); });
renderList(true); renderDoc();
</script>
</body></html>
