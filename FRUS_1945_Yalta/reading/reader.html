<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>얄타의 신탁통치 구두 양해 — 열람기</title>
<style>
:root{
  --bg:#eef1f4; --panel:#f7f9fa; --edge:#ccd4da; --edge-soft:#dde4e9;
  --ink:#16202a; --ink-2:#4a5b68; --ink-3:#71828f;
  --stamp:#8c2f39;            /* 기밀등급 도장의 자주색 */
  --link:#2f5d86;
  --a:#4a7c59; --b:#8a6d3b; --c:#3f6d8c; --d:#7a4a6b; --e:#5a6f7d; --x:#8a8f94;
  --term-line:#9db0c2; --term-bg:rgba(47,93,134,.05);
  --term-line-go:#7fa3c4; --term-bg-go:rgba(47,93,134,.10);
  --term-bg-on:rgba(47,93,134,.17);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",
         -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
    --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
    --stamp:#c9707a; --link:#7fb0da;
    --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
    --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
    --term-bg-on:rgba(127,176,218,.22);
    --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
  }
}
:root[data-theme="dark"]{
  --bg:#12171c; --panel:#171d23; --edge:#2b353e; --edge-soft:#222a31;
  --ink:#dfe6ec; --ink-2:#a4b2bd; --ink-3:#75858f;
  --stamp:#c9707a; --link:#7fb0da;
  --term-line:#5b7183; --term-bg:rgba(127,176,218,.07);
  --term-line-go:#6d90ad; --term-bg-go:rgba(127,176,218,.13);
  --term-bg-on:rgba(127,176,218,.22);
  --a:#7fae8c; --b:#c0a06a; --c:#79a9c7; --d:#b287a3; --e:#93a6b3; --x:#8a939a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--link)}

.wrap{display:grid;grid-template-columns:minmax(300px,25%) 1fr;height:100vh}

/* 좁은 화면 — 목록을 위로 접어 올리면 본문이 설 자리가 없다.
   목록은 서랍으로 빼고 화면 전부를 문서에 준다. */
.mbar{display:none}
.scrim{display:none}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;grid-template-rows:1fr;padding-top:44px}
  .mbar{display:flex;align-items:center;gap:10px;
    position:fixed;top:0;left:0;right:0;height:44px;z-index:30;padding:0 12px;
    background:var(--panel);border-bottom:1px solid var(--edge)}
  .mbar button{background:var(--term-bg-go);border:1px solid var(--term-line-go);
    color:var(--link);border-radius:999px;padding:3px 11px;cursor:pointer;
    font:inherit;font-size:12px;font-family:var(--mono);white-space:nowrap}
  .mbar-t{font-size:12.5px;font-weight:650;color:var(--ink-2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail{position:fixed;top:0;bottom:0;left:0;z-index:40;
    width:min(88vw,340px);max-height:none;
    transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:0 0 30px rgba(0,0,0,.35)}
  body.railopen .rail{transform:none}
  .scrim{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45);border:0;padding:0}
  body.railopen .scrim{display:block}
  .toolbar{padding:7px 16px;gap:8px}
  .toolbar #themeBtn{display:none}
  .mbar-t{flex:1}
  .mbar-th{padding:3px 9px;font-size:13px}
  .seg button{padding:4px 9px;font-size:11.5px}
  .srcline{padding:10px 16px 0}
}
@media(prefers-reduced-motion:reduce){.rail{transition:none}}

/* ── 좌측 목록 ─────────────────────────────── */
.rail{border-right:1px solid var(--edge);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
.rail-head{padding:14px 14px 10px;border-bottom:1px solid var(--edge-soft);
  display:flex;flex-direction:column;gap:8px}
/* 문서철에 들어오면 나갈 길이 있어야 한다 */
.home{display:inline-flex;align-items:center;gap:5px;text-decoration:none;
  color:var(--link);font-size:11.5px;font-family:var(--mono);
  letter-spacing:.04em;width:fit-content;
  background:var(--term-bg-go);border:1px solid var(--term-line-go);
  border-radius:999px;padding:2px 10px 2px 8px}
.home:hover{background:var(--term-bg-on);border-color:var(--link)}
.home span{font-size:12px;line-height:1}
.brand{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font-weight:400;letter-spacing:0;text-transform:none;
  color:var(--ink-3);font-size:11.5px;margin-top:2px}
input[type=search]{width:100%;padding:7px 10px;border:1px solid var(--edge);
  border-radius:3px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
input[type=search]:focus,button:focus-visible,.item:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--edge);background:transparent;color:var(--ink-2);
  border-radius:999px;padding:2px 9px;font-size:11.5px;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sortbar{display:flex;gap:10px;font-size:11.5px;color:var(--ink-3);align-items:center}
.sortbar button{background:none;border:none;color:var(--ink-3);cursor:pointer;
  font:inherit;padding:0;border-bottom:1px solid transparent}
.sortbar button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.list{overflow-y:auto;flex:1;min-height:0}
.item{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--edge-soft);border-left:3px solid transparent;
  padding:9px 13px;cursor:pointer;font:inherit;color:inherit}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--bg);border-left-color:var(--ink)}
.item.tA{border-left-color:var(--a)} .item.tB{border-left-color:var(--b)}
.item.tC{border-left-color:var(--c)} .item.tD{border-left-color:var(--d)}
.item.tE{border-left-color:var(--e)} .item.tX{border-left-color:var(--x)}
.item-top{display:flex;justify-content:space-between;gap:8px;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.item-sum{font-size:12.5px;line-height:1.45;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 제목이 「국무장관이 주한대사에게」 꼴이라 무엇을 읽는 것인지 알 수 없다.
   요지 한 줄을 옅게 깔아 준다. 목록이 길어지지 않도록 두 줄에서 자른다. */
.item-hint{font-size:11.5px;line-height:1.4;margin-top:3px;color:var(--ink-3);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── 우측 본문 ─────────────────────────────── */
.main{overflow-y:auto;min-height:0}
.toolbar{position:sticky;top:0;z-index:5;background:var(--panel);
  border-bottom:1px solid var(--edge);padding:8px 26px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px}
.toolbar .grow{flex:1}
.seg{display:flex;border:1px solid var(--edge);border-radius:3px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 11px;cursor:pointer;
  font:inherit;font-size:12px;color:var(--ink-2);border-right:1px solid var(--edge)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.srcline{padding:10px 26px 0;font-size:11px;color:var(--ink-3);line-height:1.5}

/* ── 연대 바 ───────────────────────────────
   5년 반을 한 줄에 욱여넣으면 1945년 8월 열흘은 0.5% 밖에 안 된다. 그래서
   줄을 늘여 놓고 **띠 자체를 움직인다** — 지금 읽는 문서의 날짜가 늘 정중앙이다.
   문서를 옮기면 띠가 미끄러지고, 사건 이름은 겹치지 않게 위아래로 층을 나눈다. */
.chrono{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
  width:min(940px,calc(100vw - 48px));z-index:20;user-select:none;
  border:1px solid var(--edge);border-radius:8px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 20px rgba(0,0,0,.10);
  transition:box-shadow .2s ease}
.chrono:hover{box-shadow:0 6px 26px rgba(0,0,0,.18)}
/* 옅어지는 것은 **내용**이지 판이 아니다. 판까지 투명해지면 뒤의 본문이
   비쳐 들어와 글자가 서로를 밟는다. */
.chrono-track{opacity:.5;transition:opacity .2s ease}
.chrono:hover .chrono-track{opacity:1}

/* 띠가 지나가는 창. 손으로도 밀 수 있게 진짜 가로 스크롤을 쓴다 */
.chrono-vp{position:relative;overflow-x:auto;overflow-y:hidden;
  height:var(--chH,92px);border-radius:8px;cursor:grab;
  scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain}
.chrono-vp::-webkit-scrollbar{display:none}
.chrono-vp.drag{cursor:grabbing}
/* 안쪽 띠. 양옆 여백은 창의 절반 — 첫 문서도 마지막 문서도 가운데에 설 수 있게 */
.chrono-track{position:relative;height:100%;margin:0 var(--chPad,0px)}
/* 시간 축 — 층의 한가운데 */
.chrono-track::before{content:"";position:absolute;
  left:calc(0px - var(--chPad,0px));right:calc(0px - var(--chPad,0px));
  top:var(--axis,46px);height:1px;background:var(--edge)}

/* 연도 — 해가 바뀌는 자리에 선을 긋고, 그 선부터가 그 해다.
   이름표는 창 왼쪽에 들러붙는다. 1945년 한복판을 보고 있어도 「1945」가 남는다. */
.cy{position:absolute;top:0;bottom:0;
  border-left:1px solid color-mix(in srgb,var(--ink-3) 50%,transparent)}
.cy.alt{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.cy b{position:absolute;bottom:3px;font-family:var(--mono);font-size:11px;
  font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;
  line-height:1;letter-spacing:.06em;white-space:nowrap;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px}
/* 달·분기 눈금 — 해 안에서 어디쯤인지. 분기는 조금 길게 */
/* 1px 짜리 표는 좌표에 걸터앉혀야 한다. 왼쪽 모서리를 좌표에 맞추면 표가
   반 픽셀 오른쪽에 서서, 같은 날짜의 점과 어긋나 보인다. 아래 실·표도 같다. */
.cq{position:absolute;top:calc(var(--axis,46px) - 1.5px);width:1px;height:4px;
  margin-left:-.5px;background:var(--edge);opacity:.7}
.cq.q{top:calc(var(--axis,46px) - 2.5px);height:6px;opacity:1}
.cq[hidden]{display:none}

/* 배율 — 5년 반을 한눈에 볼 때와 8월 열흘을 벌려 볼 때가 같을 수 없다 */
.chrono-zoom{position:absolute;right:6px;top:5px;z-index:3;display:flex;gap:3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-zoom,.chrono-zoom:focus-within{opacity:1}
.chrono-zoom button{width:19px;height:19px;padding:0;line-height:1;
  font-family:var(--mono);font-size:12px;color:var(--ink-2);cursor:pointer;
  background:var(--panel);border:1px solid var(--edge);border-radius:3px}
.chrono-zoom button:hover:not(:disabled){color:var(--link);border-color:var(--link)}
.chrono-zoom button:disabled{opacity:.35;cursor:default}
.chrono-scale{position:absolute;right:6px;bottom:3px;z-index:3;
  font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.03em;
  background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 3px;
  opacity:0;transition:opacity .2s ease}
.chrono:hover .chrono-scale{opacity:1}

/* 사건 점 — 이름에서 내려오는 실보다 위다. 실이 점 위를 지나가면
   점이 실에 꿰뚫린 것처럼 보이고, 어느 것이 사건 자리인지 흐려진다. */
.cm{position:absolute;top:calc(var(--axis,46px) - 3px);width:7px;height:7px;
  margin-left:-3.5px;border-radius:50%;background:var(--ink-3);z-index:2;
  border:1.5px solid var(--panel);cursor:help;
  transition:background .15s ease,transform .15s ease}
.cm.key{background:var(--stamp);width:9px;height:9px;margin-left:-4.5px;
  top:calc(var(--axis,46px) - 4px)}
.cm:hover{background:var(--link);transform:scale(1.45)}

/* 사건 이름 — 층(lane)을 나눠 위아래로 흩는다. 여기서 겹침이 풀린다 */
.cl{position:absolute;transform:translateX(-50%);white-space:nowrap;z-index:1;
  font-family:var(--mono);font-size:10px;line-height:1.1;color:var(--ink-2);
  letter-spacing:.01em;padding:1px 4px;border-radius:2px;cursor:help;
  background:color-mix(in srgb,var(--panel) 70%,transparent)}
.cl.key{color:var(--stamp)}
.cl:hover,.cl:focus-visible{color:var(--link);outline:0;
  background:color-mix(in srgb,var(--link) 12%,var(--panel))}
/* 이름에서 축까지 내려/올려 긋는 실 — 어느 점의 이름인지 알아보게 */
.cl::after{content:"";position:absolute;left:calc(50% - .5px);width:1px;
  background:var(--edge)}
.cl.up::after{top:100%;height:var(--leg,0px)}
.cl.dn::after{bottom:100%;height:var(--leg,0px)}

/* 지금 읽는 문서가 놓인 자리. 문서를 고르면 이 표가 창 한가운데로 온다.
   손으로 띠를 밀면 표는 제 날짜에 남는다 — 표는 시간에 박혀 있지 창에 박혀 있지 않다. */
.chrono-cursor{position:absolute;top:0;bottom:0;width:1px;z-index:3;
  margin-left:-.5px;background:var(--stamp);pointer-events:none}
/* 가상 요소는 위의 *{box-sizing:border-box}가 닿지 않는다 — 여기서 직접 잡아 주지
   않으면 테두리 2px 만큼 표시가 축 아래·오른쪽으로 밀려 앉는다. */
.chrono-cursor::before{content:"";position:absolute;box-sizing:border-box;
  left:-6px;top:calc(var(--axis,46px) - 6px);width:13px;height:13px;
  border-radius:50%;background:var(--stamp);border:2px solid var(--panel)}
/* 날짜는 맨 아래, 표 바로 밑에 — 위쪽은 사건 이름 층에 내준다 */
.chrono-date{position:absolute;bottom:2px;transform:translateX(-50%);
  font-family:var(--mono);font-size:10px;color:var(--stamp);
  font-variant-numeric:tabular-nums;background:var(--panel);
  padding:0 5px;border-radius:2px;white-space:nowrap;z-index:3}
.chrono[data-nodate="1"] .chrono-cursor,
.chrono[data-nodate="1"] .chrono-date{display:none}

/* 좁은 화면에서도 연대 바는 남긴다 — 이 화면의 절반은 「언제인가」이다.
   폭을 화면 끝까지 늘리고, 손가락으로 미는 것이 이미 되므로 줌 단추는 접는다. */
@media(max-width:900px){
  .chrono{bottom:8px;width:calc(100vw - 16px);border-radius:6px}
  .chrono-zoom{display:none}
  .chrono-track{opacity:1}
}
@media(prefers-reduced-motion:reduce){.chrono-track{transition:none}}

/* 아래쪽 여백은 떠 있는 연대 바가 마지막 문단을 덮지 않을 만큼 */
article{max-width:none;padding:26px 26px 190px}
@media(max-width:900px){article{padding:18px 16px 170px}}

/* ── 앞뒤로 넘기기 ─────────────────────────────
   목록을 다시 열지 않고도 이어 읽을 수 있어야 한다. */
.steps{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;
  margin-top:34px;padding-top:18px;border-top:1px solid var(--edge)}
.step{display:flex;flex-direction:column;gap:2px;text-align:left;
  border:1px solid var(--edge);border-radius:5px;background:transparent;
  padding:9px 12px;cursor:pointer;font:inherit;color:var(--ink-2);min-width:0}
.step.next{text-align:right;align-items:flex-end}
.step:hover{border-color:var(--link);color:var(--ink);background:var(--term-bg)}
.step-k{font-family:var(--mono);font-size:11px;color:var(--link);letter-spacing:.04em}
.step-d{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.step-t{font-size:13px;line-height:1.4;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.step.empty{display:flex;align-items:center;justify-content:center;border-style:dashed;
  color:var(--ink-3);font-size:12px;font-family:var(--mono);cursor:default}
.steps .step-n{align-self:center;font-family:var(--mono);font-size:11.5px;
  color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}

@media(max-width:900px){
  .steps{grid-template-columns:1fr;gap:8px}
  .steps .step-n{order:-1;text-align:center}
  .step.next{text-align:left;align-items:flex-start}
}
.doc-head{border-bottom:1px solid var(--edge);padding-bottom:14px;margin-bottom:18px}
h1{font-size:19px;margin:0 0 4px;line-height:1.35;text-wrap:balance;font-weight:650}
.docid{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  letter-spacing:.04em;font-variant-numeric:tabular-nums}
.stamp{display:inline-block;border:1.5px solid var(--stamp);color:var(--stamp);
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:1px 6px;
  border-radius:2px;transform:rotate(-1.2deg);margin-left:8px;vertical-align:2px}
.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:3px 20px;margin-top:10px;font-size:12.5px}
.meta div{display:flex;gap:7px}
/* 참석자 명단처럼 긴 값. 좁은 칸에 넣으면 한 글자씩 세로로 눌린다 */
.meta div.wide{grid-column:1/-1}
.meta b{color:var(--ink-3);font-weight:500;min-width:52px;font-size:11.5px}
.meta span{font-family:var(--mono);font-size:12px}
.meta span.txt{font-family:var(--sans);font-size:12.5px}

.points{margin:16px 0;padding:12px 16px;border-left:2px solid var(--edge);
  background:var(--panel);border-radius:0 3px 3px 0}
.points li{margin:3px 0}
.points ul{margin:0;padding-left:18px}

.cols{display:grid;gap:26px}
.cols.two{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.cols.two{grid-template-columns:1fr}}
.pane h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 8px;font-weight:600}
.body{white-space:pre-wrap;word-break:break-word}

<script id="data" type="application/json">[{"id": "d246", "order": 246, "date": null, "group": "A", "eyebrow": "d246 · Briefing Book Paper", "title": "브리핑북 문서 — 중국에 관한 미국의 장기 목표 및 정책 개요", "badge": null, "list_right": "문서 246", "meta": [{"k": "일자", "v": "원문 첫 줄이 'undated'. 얄타 회담(1945년 2월) 대비용 브리핑북 문서이므로 1945년 1월~2월 초로 추정되나 원문에 날짜 표기가 없다."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "발신", "v": "국무부(Department of State)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "브리핑북 문서"}], "links": [{"k": "FRUS", "text": "문서 246 원문", "url": "https://history.state.gov/historicaldocuments/frus1945Malta/d246"}], "summary": "중국이 극동의 주된 안정 요인이 되어야 한다는 전제 위에서 미국의 대중국 장기 정책을 정치·경제·문화 세 방면으로 정리한 국무부 브리핑북 문서.", "points": ["조선 관련: 미국은 중국이 조선·버마·태국·인도차이나 및 그 밖의 인접 지역과 긴밀하고 우호적인 관계를 수립하는 것에는 찬성하나, 그러한 지역에 대한 중국의 지배나 정치적 통제에는 찬성하지 않는다(1-e항).", "대중국 정책의 근거: 중국이 극동의 주된 안정 요인이 되는 것이 그 지역 평화·안전의 근본 요건이라는 믿음.", "정치 목표: 중국 인민의 뜻을 대표하는 정부를 갖춘 강하고 안정되고 통일된 중국. 국민당-공산당 간 이견의 조정을 포함한 광범위한 대표성을 지닌 정부 수립을 촉진.", "어느 정파도 편들지 않되 현 중국 정부를 중앙 권력으로 계속 지지하며, 다만 현 정부의 권위가 붕괴하면 중국 인민이 드러낸 뜻에 비추어 미국의 입장을 재검토하고 통일을 이룰 전망이 있는 정부·운동을 호의적으로 볼 것이다.", "중소 협력을 극동 평화·안전의 필수 조건(sine qua non)으로 보며, 소련 무역의 만주 통과를 위해 중·소가 자발적으로 맺는 합의(자유항 지정 가능성 포함)에는 이의를 제기하지 않는다.", "영국이 홍콩을 중국에 반환하는 것을 환영할 것이며, 그 경우 홍콩의 자유항 지위 보전을 중국에 권고할 준비가 되어 있다.", "중국의 영토 보전을 존중한다. 티베트·외몽골 등 변경 영토에 대한 주권 주장을 포함한다. 다만 우호적 교섭으로 이루어진 합의에는 반대하지 않으며, 그 지역 원주민들의 지방 자치 열망을 중국 정부가 충족시키기를 바란다.", "경제 목표: 통합되고 균형 잡힌 중국 경제와 교역 확대. 무조건 최혜국 대우에 기초한 통상항해조약 교섭, 기술·재정 지원(주로 민간 금융·투자를 통해).", "문화 목표: 중국과 다른 연합국 사이의 문화·과학 협력."], "primary": "*[날짜 미상]*\n\n# 중국에 관한 미국의 장기 목표 및 정책 개요\n\n## 요약\n\n중국에 관한 미국 정부의 장기 정책은, 중국이 극동에서 주된 안정 요인이 되어야 한다는 필요가 그 지역의 평화와 안전을 위한 근본적 요건이라는 믿음에 근거한다. 따라서 우리 정책은 다음 목표들을 향한다.\n\n1. **정치**: 중국 인민의 뜻을 대표하는 정부를 갖춘, 강하고 안정되고 통일된 중국.\n\n2. **경제**: 통합되고 균형 잡힌 중국 경제의 발전, 그리고 중국과 다른 나라들 사이의 더 충실한 교역의 흐름.\n\n3. **문화**: 공통의 이해와 진보의 기초로서 중국과의 문화적·과학적 협력.\n\n## 중국에 관한 미국의 장기 목표 및 정책 개요\n\n중국에 관한 미국 정부의 장기 정책은, 중국이 극동에서 주된 안정 요인이 되어야 한다는 필요가 그 지역의 평화와 안전을 위한 근본적 요건이라는 믿음에 근거한다. 따라서 우리 정책은 다음 목표들을 향한다.\n\n**1. 정치**: 중국 인민의 뜻을 대표하는 정부를 갖춘, 강하고 안정되고 통일된 중국.\n\na. 우리는 모든 정당한 수단으로, 국민당-공산당 간 이견의 조정을 포함하여 내부 통일을 가져오고 국내적·국제적 책임을 실효성 있게 이행할, 광범위한 대표성을 지닌 정부의 수립을 촉진하고자 한다. 어떠한 정치 정파도 편들지 않으면서, 우리는 중국 인민이 인정하는 중앙 권력으로서 현존하는 중국 정부를 계속 지지하며, 그 틀 안에서 필요로 하는 통일되고 실효성 있는 형태의 정부가 수립되기를 기대한다.\n\nb. 만약 이러한 기대가 이루어지지 못하고 현존 정부의 권위가 붕괴한다면, 우리는 중국 인민이 드러낸 뜻에 비추어 우리의 입장을 재검토할 것이며, 통일을 이루고 동아시아의 평화와 안전에 기여할 전망을 보이는 어떠한 정부나 운동도 호의적으로 볼 것이다.\n\nc. 우리는 중소 협력을 극동의 평화와 안전을 위한 필수 조건(sine qua non)으로 보며, 중국과 소련 사이에 현존하는 [357면] 불신을 제거하고 양국 사이에 긴밀하고 우호적인 관계를 가져오는 데 도움을 주고자 한다. 우리는 소련의 무역이 만주를 통과하는 것을 용이하게 하기 위하여 중국과 소련이 자발적으로 맺는 조치들 — 중국 정부에 의한 자유항 지정의 가능성을 포함하여 — 에 아무런 이의도 제기하지 않을 것이다.\n\nd. 우리는 중국과 영국 사이의 협력이 국제연합(United Nations)의 결속에 필수적인 부분이며 극동의 안정 요인으로서 중국이 발전하는 데 필요하다고 여긴다. 우리는 영국이 홍콩을 중국에 반환하는 것을 환영할 것이며, 그 경우 홍콩의 자유항 지위를 보전하는 것이 바람직함을 중국에 권고할 준비가 되어 있다. 두 강국 사이에 다른 영토 문제가 발생한다면, 우리는 그것이 우호적 교섭으로 해결되는 것을 보기를 바란다.\n\ne. 우리는 중국이 조선, 버마, 태국, 인도차이나 및 그 밖의 인접 지역과 긴밀하고 우호적인 관계를 수립하는 것에 찬성한다. 우리는 그러한 지역들에 대한 중국의 지배나 정치적 통제에는 찬성하지 않는다.\n\nf. 우리는 티베트와 외몽골 같은 변경 영토에 대한 중국의 주권 주장을 포함하여 중국의 영토 보전이 존중되어야 한다고 믿는다. 그러나 우리는 중국과 그 밖의 이해관계 정부들 사이에 우호적 교섭의 과정을 통해 이루어진, 그 영토들에 관한 어떠한 합의에도 반대하지 않을 것이다. 우리는 중국 정부가 그러한 영토의 원주민들이 지방 자치를 바라는 열망을 충족시켜 주기를 바란다.\n\ng. 모스크바에서 천명된 정책과 덤바턴 오크스에서 제시된 구도에 따라, 우리는 세계 평화와 안전의 조직 및 유지에서 일차적 책임을 나눌 자격이 있고 또 나눌 필요가 있는 주요 주권 국가들 가운데 대등한 일원으로서 중국에 온전한 협력을 제안하고 또 구한다.\n\n**2. 경제**: 통합되고 균형 잡힌 중국 경제의 발전, 그리고 중국과 다른 나라들 사이의 더 충실한 교역의 흐름. 이 목표들을 향하여 우리는 다음을 의도한다.\n\na. 기회 균등과 국가 주권 존중이라는 우리의 전통적 원칙, 그리고 이 정부가 일반적 준수를 확보하고자 노력하고 있는 자유주의적 통상 정책의 틀 안에서, 중국이 요청할 수 있는 모든 실행 가능한 경제적·재정적 원조를 계속 제공한다.\n\nb. 무조건 최혜국 대우에 기초하고 모든 형태의 차별적 대우의 철폐를 지향하는, 통상 및 항해에 관한 포괄적 조약을 중국과 교섭한다.\n\nc. 통합되고 균형 잡힌 경제를 계획하려는 중국의 노력과 관련하여, 특히 농업·운수·통신·공업에 관하여 실행 가능한 원조를 제공한다. 그러한 원조는 중국의 요청에 따라 제공될 것이다.\n\n[358면]\n\nd. 미국에서의 중국인 기술자 훈련을 포함하여, 중국이 바랄 수 있는 기술 원조를 제공한다.\n\ne. 중국에서 조성되는 여건에 비추어 적절할 수 있는 재정 원조를, 주로 민간 금융과 투자를 통하여 제공한다.\n\nf. 중국과 미국 상호의 이익과 편익을 위하여 모든 실행 가능한 수단으로 미국의 대중국 무역을 촉진한다.\n\n이러한 형태의 지원을 제공함에 있어 우리는 중국 정부의 통상 정책과, 중국과의 그리고 중국 내에서의 미국 무역에 영향을 미치는 실제 여건을 주의 깊게 살피고자 한다.\n\n**3. 문화**: 공통의 이해와 진보의 기초로서 중국과의 문화적·과학적 협력.\n\na. 우리는 문화 및 과학 분야에서 중국과 다른 연합국들 사이의 더 긴밀한 결합이 가장 긴요하다고 여긴다. 그 목적을 향하여 우리는 중국인과 미국인 사이에 서로의 사상과 문화에 대한 더 나은 이해를 증진하고, 중국이 그 발전과 국제적 진보에 대한 기여를 위해 필요로 하는 과학 지식과 원조를 중국에 제공할 수 있도록 여러 방식으로 노력하고 있다.\n\n조선의 전후 지위", "secondary": "undated\n\nOutline of Long-Range Objectives and Policies of the United States With Respect to China Summary\n\nThe American Government’s long-range policy with respect to China is based on the belief that the need for China to be a principal stabilizing factor in the Far East is a fundamental requirement for peace and security in that area. Our policy is accordingly directed toward the following objectives:\n\n1.\n\nPolitical: A strong, stable and united China with a government representative of the wishes of the Chinese people.\n\n2.\n\nEconomic: The development of an integrated and well-balanced Chinese economy and a fuller flow of trade between China and other countries.\n\n3.\n\nCultural: Cultural and scientific cooperation with China as a basis for common understanding and progress.\n\nOutline of Long-Range Objectives and Policies of the United States With Respect to China\n\nThe American Government’s long-range policy with respect to China is based on the belief that the need for China to be a principal stabilizing factor in the Far East is a fundamental requirement for peace and security in that area. Our policy is accordingly directed toward the following objectives:\n\n1. Political: A strong stable and united China with a government representative of the wishes of the Chinese people:\n\na. We seek by every proper means to promote establishment of a broadly representative government which will bring about internal unity, including reconcilement of Kuomintang-Communist differences, and which will effectively discharge its internal and international responsibilities. While favoring no political faction, we continue to support the existing Government of China as the central authority recognized by the Chinese people and we look for the establishment within its framework of the unified and effective type of government that is needed.\n\nb. Should these expectations fail of achievement and the authority of the existing government disintegrate, we would reexamine our position in the light of the manifested wishes of the Chinese people and regard sympathetically any government or movement which gave promise of achieving unity and of contributing to peace and security in eastern Asia.\n\nc. We regard Sino-Soviet cooperation as a sine qua non of peace and security in the Far East and seek to aid in removing the existing mistrust [357면] between China and the Soviet Union and in bringing about close and friendly relations between them. We would interpose no objection to arrangements voluntarily made by China and the Soviet Union to facilitate the passage of Soviet trade through Manchuria, including the possible designation by the Chinese Government of a free port.\n\nd. We consider cooperation between China and Great Britain to be an essential part of United Nations’ solidarity and necessary for the development of China as a stabilizing factor in the Far East, We would welcome the restoration by Great Britain of Hong Kong to China and we are prepared in that event to urge upon China the desirability of preserving its status as a free port. Should other territorial problems arise between the two powers, we would hope to see them settled by friendly negotiation.\n\ne. We favor the establishment by China of close and friendly relations with Korea, Burma, Thailand, Indochina and other neighboring areas. We do not favor Chinese domination or political control over such areas.\n\nf. We believe that China’s territorial integrity should be respected, including her claim to sovereign rights over such outlying territories as Tibet and Outer Mongolia. We would not oppose, however, any agreements respecting those territories reached by process of amicable negotiation between China and other interested governments. We hope that the Chinese Government will meet the aspirations of the native peoples of such territories for local autonomy.\n\ng. In line with the policy enunciated at Moscow and the pattern outlined at Dumbarton Oaks, we offer and seek full collaboration with China as an equal among the major sovereign powers entitled and needed to share primary responsibility in the organization and maintenance of world peace and security.\n\n2. Economic: The development of an integrated and well-balanced Chinese economy and a fuller flow of trade between China and other countries. Toward these objectives we intend to:\n\na. Continue to give to China all practicable economic and financial assistance which she may request within the framework of our traditional principles of equality of opportunity and respect for national sovereignty and the liberal trade policies to which this Government is endeavoring to secure general adherence.\n\nb. Negotiate with China a comprehensive treaty relating to commerce and navigation on the basis of unconditional most-favored-nation treatment and looking toward the elimination of all forms of discriminatory treatment.\n\nc. Give practicable assistance to China in connection with her efforts to plan an integrated and well-balanced economy, with particular reference to agriculture, transportation, communication and industry. Such assistance would be extended at China’s request.\n\n[358면]\n\nd. Make available such technical assistance as may be desired by China, including the training of Chinese technicians in the United States.\n\ne. Provide such financial assistance as may be appropriate in the light of conditions obtaining in China, largely through private financing and investment.\n\nf. Promote American trade with China by all practicable means to the mutual benefit and advantage of China and the United States.\n\nIn extending such forms of support, we propose to take careful cognizance of the commercial policies of the Chinese Government and of actual conditions affecting American trade with and in China.\n\n3. Cultural: Cultural and scientific cooperation with China as a basis for common understanding and progress:\n\na. We consider most essential closer association between China and other United Nations in cultural and scientific fields. Toward that end we are undertaking in various ways to promote between the Chinese and American peoples a better appreciation of each other’s thought and culture and to make available to China scientific knowledge and assistance which she needs for her development and contribution to international progress.\n\nPost-war status of Korea", "notes": [], "warn": false, "pages": ["356", "357", "358"], "search": ""}, {"id": "d247", "order": 247, "date": null, "group": "A", "eyebrow": "d247 · Briefing Book Paper", "title": "브리핑북 문서 — 조선에 관한 연합국 간 협의", "badge": null, "list_right": "문서 247", "meta": [{"k": "일자", "v": "원문 첫 줄이 'undated'. 얄타 회담(1945년 2월) 대비용으로 국무부가 준비한 브리핑북 문서이므로 1945년 1월~2월 초로 추정되나 원문에 날짜 표기가 없다."}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "발신", "v": "국무부(Department of State)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "브리핑북 문서"}], "links": [{"k": "FRUS", "text": "문서 247 원문", "url": "https://history.state.gov/historicaldocuments/frus1945Malta/d247"}], "summary": "조선의 군사 점령과, 잠정 국제 행정 또는 신탁통치에 어느 나라가 참여해야 하는가에 관한 국무부의 입장이다. 미국·영국·중국·소련 4개국을 모두 포함시키되 미국이 점령과 군정에서 주도적 역할을 맡아야 한다는 것이다.", "points": ["문제 설정: (1) 조선의 군사 점령에, (2) 그러한 행정을 두기로 결정될 경우 조선을 위한 잠정 국제 행정 또는 신탁통치에 어느 나라들이 참여해야 하는가.", "국무부 결론: 조선의 군사 점령에는 '실질적 이해관계를 가진 나라들', 즉 미국·영국·중국 그리고 태평양 전쟁에 참전한 경우 소련의 연합국 대표가 참여해야 한다.", "국무부 잠정 의견: 잠정 국제 행정 또는 신탁통치는 제안된 국제기구의 권한 아래에서든 그와 별개로든 조선에 수립되어야 하며, 미국·영국·중국·소련이 그 행정에 포함되어야 한다.", "군정은 '중앙집권적 행정' 원칙 위에 조직되어야 하고, 조선 전역을 분리된 지대(zones)가 아니라 하나의 단위로 관리해야 한다.", "다른 나라들의 대표 규모가 미국의 비례적 세력을 그 실효성이 약화될 지점까지 줄여서는 안 된다. 미국의 비중을 명시적으로 계산하는 대목이다.", "미국 참여의 중요한 요소는 '미국이 제국주의적 의도를 품지 않으리라고 조선인들이 둘 신뢰'이며, 따라서 미국이 점령과 군정에서 주도적 역할을 해야 한다.", "잠정 행정·신탁통치는 '조선인이 스스로를 통치할 수 있게 될 때까지' 기능해야 한다고 서술한다. 조선인의 자치 능력을 유보적으로 보는 대목이다.", "소련은 태평양 전쟁 참전 여부와 무관하게 극동에서의 지위 때문에 잠정 국제 행정에 대표를 두게 하는 것이 바람직하다.", "단일 강국의 단독 점령은 심각한 정치적 반향을 낳을 수 있다. 중국은 소련의 단독 책임이 만주·화북에 소련 세력권을 낳을까 두려워하고, 소련은 중국의 단독 책임에 반감을 가질 것이다.", "영국 외무부의 요청으로 조선의 군사 점령 문제는 현재 진행 중인 미·영·중 3국의 전후 조선 연구 대상에서 빠져 있다."], "primary": "*[날짜 미상]*\n\n# 조선에 관한 연합국 간 협의\n\n## 요약\n\n영국 정부 및 중국 정부와, 그리고 사태의 전개에 따라서는 소련 정부와도, (1) 조선의 군사 점령에, 그리고 (2) 그러한 행정을 수립하기로 결정될 경우 조선을 위한 잠정 국제 행정 또는 신탁통치에 어느 나라들이 참여해야 하는가 하는 문제에 관하여 양해에 도달하는 것이 바람직하다.\n\n이 문제의 첫 번째 부분과 관련하여, 조선의 여러 문제는 그 성격이 지극히 국제적이므로 조선에서의 군사 작전이 완료되면 (1) 실행 가능한 한, 조선의 점령군과 군정에 연합국 대표의 참여가 있어야 하고, (2) 그러한 대표의 참여는 미국, 영국, 중국 그리고 태평양 전쟁에 참전했을 경우 소련과 같이 조선의 장래 지위에 실질적 이해관계를 가진 나라들에 의해 이루어져야 하며, (3) 다른 나라들의 대표 규모가 미국의 비례적 세력을 그 실효성이 약화될 지점에까지 줄일 만큼 커서는 안 된다는 것이 국무부의 견해이다.\n\n[359면]\n\n이 문제의 두 번째 부분에 관해서는, (1) 잠정 국제 행정 또는 신탁통치가 제안된 국제기구의 권한 아래에서든 그와는 별개로든 조선에 수립되어야 하며, (2) 미국, 영국, 중국 및 소련이 그러한 행정에 포함되어야 한다는 것이 국무부의 잠정적 의견이다.\n\n## [조선에 관한 연합국 간 협의]\n\n### 문제\n\n1) 조선의 군사 점령에, 그리고 2) 그러한 행정을 수립하기로 결정될 경우 조선을 위한 잠정 국제 행정 또는 신탁통치에 어느 나라들이 참여해야 하는가?\n\n### 논의\n\n(1) 조선 독립의 수립과 관련한 공동 행동은 다음의 이유로 중요하고도 필요하다.\n\n1) 중국과 소련은 조선과 국경을 접하고 있으며 조선 문제에 전통적인 이해관계를 가져 왔다.\n\n2) 미국, 영국, 중국은 카이로 선언에서 적절한 시기에(in due course) 조선이 자유롭고 독립된 나라가 될 것을 약속하였다.\n\n3) 어느 한 강국에 의한 조선의 군사 점령은 심각한 정치적 반향을 불러올 수 있다.\n\n연합국 육·해·공군의 작전에 관한 문제들은 분명히 순전히 군사적 성격의 것이며 따라서 국무부의 직접적 소관이 아니라는 점은 인정되지만, 어느 한 국가만에 의한 조선에서의 군사 작전과 그에 뒤따르는 군사 점령은 광범위한 정치적 결과를 낳을 수 있다. 중국은 조선의 군정에 대한 소련의 배타적 책임이 만주와 화북에 소련 세력권의 성장을 가져올까 두려워할 것이다. 마찬가지로 소련은 적대 행위가 종식된 뒤 중국이 조선의 군정에 대한 배타적 책임을 갖게 되는 어떠한 조치에 대해서도 반감을 가질 것이다. 그러므로 조선에서의 군사 작전이 완료되면 실행 가능한 한 조선의 점령군과 군정에 연합국 대표의 참여가 있어야 하고, 그러한 군정은 조선 전역을 분리된 지대(zones)가 아니라 하나의 단위로 관리하는 중앙집권적 행정의 원칙 위에 조직되어야 한다는 것이 우리의 견해이다. 그러한 대표의 참여는 조선의 장래 정치적 지위에 실질적 이해관계를 가진 나라들에 의해 이루어져야 하되, 다른 나라들의 대표 규모가 그 점령에서 미국의 참여가 갖는 실효성을 해칠 만큼 커서는 안 된다. 미국의 참여에서 [360면] 중요한 요소 하나는, 미국이 제국주의적 의도를 품지 않으리라고 조선인들이 미국에 둘 신뢰이다. 따라서 미국은 점령과 군정에서 주도적 역할을 해야 한다.\n\n전후 조선 문제에 관한 연구는 전후 조선의 정치·군사·경제 각 방면에 관한 질문서 초안에 근거하여 현재 국무부와 영국·중국 외무부에 의해 진행되고 있다. 이 연구들이 완료되면 이 문제들에 관한 문서들이, 정책 사항에 관하여 각국 정부를 어떤 식으로도 구속하지 않는 방식으로, 비공식적으로 교환될 것이다. 그런 다음 견해차를 분명히 하기 위한 비공식 양자 병행 논의가 열릴 것이다.\n\n조선의 군사 점령에 어느 나라들이 참여해야 하는가의 문제는 당면한 중요성을 지니며 신중한 검토를 받아야 하는데, 그 이유는 1) 영국 외무부의 요청으로 조선에서의 군사 점령 문제가 현재 국무부와 영국·중국 외무부가 연구하고 있는 문제들에 포함되어 있지 않고, 2) 소련의 대일 참전은 조선에 소련군이 주둔하는 결과를 낳을 것이며 이는 점령군의 구성을 결정하는 데 중요한 요소가 될 것이고, 3) 조선에 대한 소련의 전통적 이해관계는, 소련이 태평양 전쟁에 참전하지 않더라도 조선의 군사 점령에 참여하기를 바랄 가능성을 제기하기 때문이다.\n\n(2) 독립에 앞선 조선에 관한 두 번째 중요한 문제는, 그러한 행정을 수립하기로 결정될 경우 조선을 위한 잠정 국제 행정 또는 신탁통치에 어느 나라들이 참여해야 하는가이다. 조선의 군사 점령 기간을 최소한으로 줄이는 동시에 조선인들에게 독립과 함께 따라올 책임에 대한 준비를 시키기 위하여, 점령 기간 이후 조선 독립의 수립 이전에 조선에는 어떤 형태의 국제 행정 또는 신탁통치가 있어야 하며, 그러한 행정 또는 신탁통치는 조선인들이 스스로를 통치할 수 있게 될 때까지 기능해야 한다는 것이 현재 우리의 의견이다.\n\n조선을 위한 잠정 국제 행정 또는 신탁통치가 계획 중인 국제기구의 권한 아래 수립된다면, 그 기구는 아마도 미국, 영국, 중국 및 소련을 포함하여 조선에 주된 이해관계를 가진 나라들을 신탁통치국(trustees)으로 임명할 것이다. 나아가 조선을 위한 잠정 행정 당국이 계획 중인 국제기구와는 별개로 수립된다 하더라도, 미국, 영국, 중국 및 소련은 당연히 그러한 행정에 적극적으로 참여하게 될 것이다. 극동에서 [361면] 소련이 차지하는 지위는, 소련이 태평양 전쟁에 참전하는지 여부와 관계없이 잠정 국제 행정에 소련 대표를 두게 하는 것이 바람직해 보일 만한 것이다.\n\n전후 조선 문제에 관한 연구는 아직, 조선을 위한 잠정 국제 감독 당국의 정확한 구조에 관해서나 조선에 독립이 부여되어야 할 시기에 관해서나 국무부가 권고를 내릴 수 있을 만큼 진척되지 않았다. 그러나 점령 기간이 길어질 가능성을 피하고 조선 독립이 불필요하게 연기되는 것을 막기 위하여, 조선을 위한 잠정 국제 감독 당국을 수립할 것인지, 수립한다면 어느 열강들이 거기에 대표를 두어야 하는지의 문제에 관하여 주요 이해관계국들 사이에 조속한 시일 내에 합의가 이루어져야 한다는 것이 국무부의 견해이다.\n\n소련의 대일 참전 [주1]", "secondary": "undated\n\nInter-Allied Consultation Regarding Korea\n\nSummary\n\nIt is desirable that an understanding be reached with the British and Chinese Governments and depending upon developments, with the Soviet Government, on the question of what countries should participate (1) in the military occupation of Korea and (2) in an interim international administration or trusteeship for Korea if it is decided that such an administration should be established.\n\nIn reference to the first part of the question it is the view of the Department that the problems of Korea are of such an international character that with the completion of military operations in Korea, (1) there should be, so far as practicable, Allied representation in the army of occupation and military government in Korea; (2) such representation should be by those countries which have a real interest in the future status of Korea, such as the United States, Great Britain, and China and the Soviet Union if it has entered the war in the Pacific; and (3) the representation of other states should not be so large as to reduce the proportionate strength of the United States to a point where its effectiveness would be weakened.\n\n[359면]\n\nAs regards the second part of the question, it is the Department’s tentative opinion that (1) an interim international administration or trusteeship should be established for Korea either under the authority of the proposed international organization or independently of it; and that (2) the United States, Great Britain, China and the Soviet Union should be included in any such administration.\n\n[Inter-Allied Consultation Regarding Korea]\n\nThe Problem\n\nWhich countries should participate 1) in the military occupation of Korea and 2) in an interim international administration or trusteeship for Korea if it is decided that such an administration should be established?\n\nDiscussion\n\n(1) Joint action in connection with the establishment of Korean independence is both important and necessary for the following reasons:\n\n1)\n\nChina and the Soviet Union are contiguous to Korea and have had a traditional interest in Korean affairs;\n\n2)\n\nThe United States, Great Britain and China have promised in the Cairo Declaration that in due course Korea shall become free and independent;\n\n3)\n\nThe military occupation of Korea by any single power might have serious political repercussions.\n\nWhile the questions relating to the operations of Allied military, naval and air forces are admittedly of a purely military character and hence are not of direct concern to the Department, military operations and subsequent military occupation in Korea by any single state alone might have far-reaching political consequences. China would fear that exclusive Soviet responsibility for military government in Korea might lead to the growth of a Soviet sphere of influence in Manchuria and north China. Likewise, the Soviet Union would be resentful of any arrangement whereby China would have exclusive responsibility for military government in Korea after the cessation of hostilities. It is our view, therefore, that with the completion of military operations in Korea, there should be, so far as practicable, Allied representation in the army of occupation and in military government in Korea and that such military government should be organized on the principle of centralized administration with all of Korea administered as a single unit and not as separate zones. Such representation should be by those countries which have a real interest in the future political status of Korea, but the representation of other states should not be so large as to prejudice the effectiveness of American participation in that occupation. An [360면] important element in American participation consists of the trust which Koreans will place in the United States not to harbor imperialistic designs. The United States, therefore, should play a leading role in the occupation and military government.\n\nStudies on post-war Korean problems are now being undertaken by the Department and the British and Chinese Foreign Offices, based on a draft questionnaire which relates to various political, military and economic aspects of post-war Korea. When these studies have been completed, papers on these questions will be exchanged informally without in any way committing the respective Governments on matters of policy. Informal bilateral parallel discussions will then be held to clarify points of difference.\n\nThe question of which countries should participate in the military occupation of Korea is of immediate importance and should receive careful consideration because 1) at the request of the British Foreign Office, the problems of military occupation in Korea are not included among those questions now being studied in the Department and by the British and Chinese Foreign Offices, 2) the entrance of the Soviet Union in the war against Japan would result in the presence of Soviet forces in Korea which would be an important factor in determining the composition of the occupational forces, and 3) the traditional interest of the Soviet Union in Korea raises the possibility that it will wish to participate in the military occupation of Korea even though the Soviet Union may not enter the war in the Pacific.\n\n(2) The second important question concerning Korea prior to independence is what countries should participate in an interim international administration or trusteeship for Korea if it is decided that such an administration should be established. In order to reduce to a minimum the period of military occupation of Korea and at the same time to prepare the Korean people for the responsibilities which will come with independence, it is our present opinion that there should be in Korea, following the period of occupation and prior to the establishment of Korean independence, some form of international administration or trusteeship, such administration or trusteeship to function until such time as the Koreans are able to govern themselves.\n\nIf an interim international administration or trusteeship is established for Korea under the authority of the projected international organization, that organization would presumably appoint as trustees those countries principally interested in Korea including the United States, Great Britain, China and the Soviet Union. Moreover, even if an interim administrative authority for Korea is established independently of the projected international organization, the United States, Great Britain, China and the Soviet Union would naturally take an active part in such an administration. The position of the [361면] Soviet Union in the Far East is such that it would seem advisable to have Soviet representation on an interim international administration regardless of whether or not the Soviet Union enters the war in the Pacific.\n\nThe studies on problems of post-war Korea have not yet progressed far enough to enable the Department to make recommendations on either the exact structure of any interim international supervisory authority for Korea, or the time when Korea should be granted independence. However, it is the view of the Department that an agreement should be reached at an early date among the principal interested powers on the question of whether an interim international supervisory authority is to be established for Korea and if so what powers are to be represented thereon in order to avoid the possibility of an extended period of occupation and to prevent an unnecessary postponement of Korean independence.\n\nEntry of the Soviet Union into the war against Japan [주1]", "notes": ["[주1] 앞의 351–352면에 실린 「소련이 극동 전쟁에 참전할 경우 중국의 정치·군사 정세(Political and Military Situation in China in the Event the U. S. S. R. Enters the War in the Far East)」라는 제목의 문서도 참조."], "warn": false, "pages": ["358", "359", "360", "361"], "search": ""}, {"id": "d393", "order": 393, "date": "1945-02-08", "group": "B", "eyebrow": "d393 · Bohlen Minutes  The first two subjects here are separate memoranda, while the last four subjects are grouped in a third memorandum.", "title": "볼렌 회의록", "badge": "top secret (극비)", "list_right": "문서 393", "meta": [{"k": "일자", "v": "1945-02-08"}, {"k": "장소", "v": "Yalta (원문 표기: Leningrad / 말미의 본회의는 Livadia Palace)", "txt": true}, {"k": "발신", "v": "Bohlen 볼렌 (회의록 작성)", "txt": true}, {"k": "수신", "v": null, "txt": true}, {"k": "참석", "v": "President Roosevelt 루스벨트 대통령 (미국), Marshal Stalin 스탈린 원수 (소련), — 이하는 문서 말미에 이어 붙은 제5차 본회의(1945년 2월 8일 오후 4시, 리바디아 궁전) 참석자 명단 —, United States 미국: President Roosevelt 루스벨트 대통령, Secretary Stettinius 스테티니어스 국무장관, Fleet Admiral Leahy 리히 해군원수, Mr. Hopkins 홉킨스, Mr. Byrnes 번스, Mr. Harriman 해리먼, Mr. Matthews 매슈스, Mr. Hiss 히스, Mr. Bohlen 볼렌, United Kingdom 영국: Prime Minister Churchill 처칠 총리, Foreign Secretary Eden 이든 외무장관, Sir Archibald Clark Kerr 아치볼드 클라크 커 경, Sir Alexander Cadogan 알렉산더 캐도건 경, Sir Edward Bridges 에드워드 브리지스 경, Mr. Jebb 젭, Mr. Wilson 윌슨, Mr. Dixon 딕슨, Major Birse 버스 소령, Soviet Union 소련: Marshal Stalin 스탈린 원수, Foreign Commissar Molotov 몰로토프 외무인민위원, Mr. Vyshinsky 비신스키, Mr. Maisky 마이스키, Mr. Gusev 구세프, Mr. Gromyko 그로미코, Mr. Pavlov 파블로프", "txt": true, "wide": true}, {"k": "종류", "v": "회의록"}], "links": [{"k": "FRUS", "text": "문서 393 원문", "url": "https://history.state.gov/historicaldocuments/frus1945Malta/d393"}], "summary": "1945년 2월 8일 오후 3시 30분 루스벨트 대통령과 스탈린 원수의 회담 기록으로, 극동 항공기지·유럽 비행장 사용·전후 선박 매각·소련의 대일 참전 조건(사할린 남부, 쿠릴, 다롄·뤼순과 만주 철도)에 이어 「신탁통치」 항목에서 조선에 대한 소·미·중 3국 대표 신탁통치와 그 기간, 외국 군대 주둔 여부, 영국 참여 문제가 논의된다.", "points": ["조선 신탁통치: 대통령은 조선에 대해 \"소련, 미국, 중국 대표로 구성된 신탁통치\"를 염두에 두고 있다고 말했다.", "조선 신탁통치 기간: 대통령은 이 문제에 관한 유일한 경험이 필리핀이며 그곳에서는 국민이 자치를 준비하는 데 \"약 50년\"이 걸렸다고 말하고, 조선의 경우에는 그 기간이 \"20년에서 30년\"일 수 있다고 보았다.", "스탈린은 기간이 짧을수록 좋다고 답하고, 조선에 외국 군대가 주둔하게 되는지 물었다. 대통령은 부정으로 답했고 스탈린은 찬성의 뜻을 표했다.", "영국 참여: 대통령은 조선 신탁통치에 영국을 초청할 필요는 없다고 개인적으로 느끼지만 영국이 이를 언짢게 여길 수 있다고 말했다. 스탈린은 영국이 반드시 기분이 상할 것이며 총리가 \"우리를 죽일지도(kill us)\" 모른다면서, 영국을 초청해야 한다는 의견을 냈다.", "인도차이나 신탁통치도 함께 거론되었고, 영국이 버마에 미칠 파장을 우려해 반대하며 프랑스에 돌려주려 한다는 점이 논의되었다.", "소련의 대일 참전 정치적 조건: 사할린 남부와 쿠릴 열도의 소련 귀속, 부동항(다롄) 사용, 만주 철도 사용. 대통령은 조차와 국제 관리(국제화된 자유항) 두 방식을 제시했고, 스탈린은 국제화된 자유항에 반대하지 않겠다고 했다.", "스탈린은 이 조건들을 3국이 합의한 문서로 남기고 떠나는 것이 좋겠다고 말했고, 대통령은 그렇게 할 수 있으리라 본다고 했다. 중국(장제스)과는 아직 논의하지 않았으며, 중국에 말하면 24시간 안에 온 세계가 알게 된다는 점이 어려움으로 지적되었다.", "그 밖에 극동 항공기지(콤소몰스크·니콜라옙스크 허용, 캄차카는 보류), 부다페스트 인근 비행장 사용과 폭격 피해 조사 요청 수락, 전후 잉여 선박의 무이자 신용 이전(20년 상환), 무기대여(Lend-Lease)에 대한 스탈린의 평가, 중국 국내 정세가 다뤄졌다."], "primary": "레닌그라드, 1945년 2월 8일 오후 3시 30분\n\n극비(top secret)\n\n## 극동의 항공기지\n\n**대통령**은 마닐라 함락으로 태평양 전쟁이 새로운 국면에 접어들고 있으며, 우리는 보닌 제도와 타이완(포모사) 인근 도서에 기지를 설치하기를 희망한다고 말했다. 그는 일본에 대한 추가 폭격 계획을 세울 때가 왔다고 말했다. 그는 실제로 일본 본토 제도를 침공할 필요가 없기를 희망하며, 절대적으로 필요한 경우에만 그렇게 할 것이라고 말했다. 일본은 육군에 400만 명을 두고 있으며, 그는 집중 폭격으로 일본과 그 군대를 파괴하여 미국인의 목숨을 구할 수 있기를 희망한다고 말했다.\n\n**스탈린 원수**는 미국이 콤소몰스크나 니콜라옙스크에 기지를 두는 데 반대하지 않는다고 말했다. 그는 앞의 것은 아무르 강 하류에, 뒤의 것은 그 하구에 있다고 말했다. 그는 캄차카의 기지에 관해서는 그곳에 일본 영사가 주재하고 있어 지금 시점에 필요한 조치를 취하기가 어려우므로 나중 단계로 미뤄야 할 것으로 생각한다고 말했다. 어쨌든 연해주의 다른 두 기지가 더 가깝다고 그는 덧붙였다.\n\n**스탈린 원수**는 이 문제에 관한 대통령의 서한[주2]에 나온 \"상업 항로(commercial routes)\"에 관한 한 구절이 자신에게 분명하지 않았다고 덧붙였다.\n\n[767면]\n\n**대통령**은 태평양과 동시베리아를 가로질러 소련으로 가는 보급로의 중요성을 염두에 두고 있었다고 말하고, 일단 일본과 소련 사이에 전쟁이 벌어지면 그 보급로가 매우 중요해지겠지만 일본 열도를 지나가기가 또한 매우 어려워질 것이라고 느낀다고 말했다.\n\n**스탈린 원수**는 이 보급로의 중요성을 인정한다는 뜻을 밝히고, 연해주에 미국 기지를 설치하는 데 반대하지 않는다고 다시 한 번 되풀이했다.\n\n**대통령**은 원수에게 소련 참모부가 미국 참모부와 계획 협의에 들어가도록 지시해 줄 것을 요청하는 문서[주3]를 건넸다.\n\n**스탈린 원수**는 필요한 지시를 내리겠다는 뜻을 밝혔다.\n\n## 동유럽 및 동남유럽에서의 비행장 사용과 폭격 피해 조사[주4]\n\n**대통령**은 유럽에 관한 군사적 성격의 문제 두 가지를 원수와 다루고자 한다고 말했다. 그는 이어 영어로 된 문서 두 건을 스탈린 원수에게 건넸고, 이는 러시아어로 통역되었다.\n\n첫째는 독일에 대한 폭격 작전을 수행하기 위해 미국 공군이 부다페스트 인근의 일정한 비행장을 사용할 수 있도록 허용해 달라는 요청이었다. 대통령은 현재 이탈리아에 기지를 둔 미국 폭격기들이 독일에 이르기 위해 알프스를 넘는 길고 위험한 비행을 해야 한다고 말했다.\n\n둘째 문서는 플로이에슈티에서 실시된 조사와 유사하게, 붉은 군대가 해방했거나 점령한 동유럽 및 동남유럽 지역에서 미국 전문가단이 폭격의 효과에 대한 조사를 수행할 수 있도록 허가해 달라는 요청을 담고 있었다. 이 문서는 증거가 아직 생생하고 폭격 당시 그곳에 있던 사람들이 아직 현장에 남아 있는 동안 피해를 조사하는 것이 중요하므로 이 조사단이 즉시 출발할 수 있도록 허가해 달라고 요청했다.\n\n**스탈린 원수**는 이 두 요청을 모두 승인할 수 있으며 즉시 필요한 명령을 내리겠다고 말했다.\n\n## 전후 소련에 대한 선박 매각[주5]\n\n**스탈린 원수**는 스테티니어스 씨가 몰로토프 씨에게 미국이 전후 잉여 선박 자산을 갖게 되어 이를 소련에 매각할 가능성이 있다고 말했다는 점을 언급했다.\n\n[768면]\n\n**대통령**은 이를 위해서는 법률에 어느 정도 변경이 필요하며, 미국과 영국이 필요로 하지 않는 전후 잉여 선박을 이자 없이 신용으로 이전할 수 있도록 그 변경을 성사시키기를 희망한다고 말했다. 그는 지난 전쟁 뒤에 잉여 자산 처분에 이자를 물리려 한 잘못이 있었으나 그것이 통하지 않았다고 말했다. 그의 구상은 선박 가격에서 감가상각분을 뺀 금액을 포함하는 정해진 액수로 신용 이전하여 20년이면 신용이 전부 소멸되도록 하는 것이었다. 그는 영국은 상업적 이자 없이 무엇을 판 적이 결코 없지만 자신은 생각이 다르다고 말했다.\n\n**스탈린 원수**는 대통령의 발언에 만족을 표하고, 이 선박이 장래 소련의 과업을 크게 덜어 줄 것이라고 말했다.\n\n**대통령**은 소련이 해운 사업에 크게 관심을 갖기를 희망한다고 답했다.\n\n**스탈린 원수**는 대통령의 구상이 매우 훌륭하다고 생각하며, 또한 무기대여(Lend-Lease)는 그것이 없었더라면 승리가 늦어졌을 놀라운 발명이라고 말했다. 그는 이전의 전쟁들에서는 일부 동맹국이 다른 동맹국에 보조금을 주었으나 이는 보조금을 받는 동맹국의 감정을 상하게 하여 어려움을 낳았다고 말했다. 그러나 무기대여는 그런 원한을 낳지 않았다고 하면서, 그는 무기대여가 전쟁 승리에 기여한 바가 비상하다는 자신의 견해를 되풀이했다.\n\n**대통령**은 4년 전 자신의 작은 요트에서 쉬고 있을 때 연합국을 돕는 동시에 차관에 내재된 어려움을 피할 방법을 거듭 생각한 끝에 마침내 무기대여라는 방안을 떠올렸다고 답했다.\n\n## 극동: 러시아의 요구\n\n극동과 관련된 몇몇 군사 문제를 논의한 뒤, **스탈린 원수**는 소련이 대일 전쟁에 참전할 정치적 조건을 논의하고 싶다고 말했다. 그는 이 주제에 관해 이미 해리먼 대사와 대화를 나눈 바 있다고 말했다.\n\n**대통령**은 그 대화에 관한 보고[주6]를 받았다고 말하고, 사할린 남반부와 쿠릴 열도가 전쟁이 끝날 때 러시아에 넘어가는 데 대해서는 아무런 어려움도 없을 것으로 느낀다고 말했다. 그는 소련을 위한 극동의 부동항에 관해서는 원수도 기억하듯 테헤란에서 그 점을 논의했다고 말했다. 그는 당시 자신이 남만주 철도의 종점에 있는 부동항, 아마도 관동 반도의 [769면] 다롄을 소련이 사용하도록 하자고 제안했다고 덧붙였다. 대통령은 아직 장제스 원수와 이 문제를 논의할 기회가 없었으므로 중국을 대신해 말할 수는 없다고 말했다. 그는 이어 러시아가 이 항구의 사용권을 얻는 데는 두 가지 방법이 있다고 말했다. (1) 중국으로부터의 완전한 조차, (2) 어떤 형태의 국제 위원회 아래 다롄을 자유항으로 만드는 것. 그는 홍콩 문제와의 관련 때문에 후자의 방법을 선호한다고 말했다. 대통령은 영국이 홍콩의 주권을 중국에 돌려주고 홍콩이 그 뒤 국제화된 자유항이 되기를 희망한다고 말했다. 그는 처칠 씨가 이 제안에 강하게 반대하리라는 것을 안다고 말했다.\n\n**스탈린 원수**는 또 하나의 문제가 있는데 그것은 러시아의 만주 철도 사용에 관한 것이라고 말했다. 그는 차르들이 만저우리에서 하얼빈까지, 거기서 다롄과 뤼순까지 이어지는 노선과, 하얼빈에서 동쪽으로 니콜스크-우수리스크로 가서 하바롭스크-블라디보스토크 선과 연결되는 노선을 사용했다고 말했다.\n\n**대통령**은 이 주제에 관해서도 장제스 원수와 이야기하지는 않았지만, 이를 실현하는 데는 역시 두 가지 방법이 있다고 말했다. (1) 소련이 직접 운영하는 형태로 조차하는 것, (2) 중국인 1명과 러시아인 1명으로 구성된 위원회 아래 두는 것.\n\n**스탈린 원수**는 이러한 조건들이 충족되지 않는다면 자신과 몰로토프가 러시아가 왜 대일 전쟁에 참전하는지를 소련 인민에게 설명하기 어려우리라는 점은 분명하다고 말했다. 그들은 소련의 존립 자체를 위협했던 독일과의 전쟁은 분명히 이해하고 있었으나, 러시아가 별다른 문제가 없던 나라와 왜 전쟁에 들어가는지는 이해하지 못할 것이라고 했다. 그러나 이 정치적 조건들이 충족된다면 인민은 거기에 걸린 국가적 이익을 이해할 것이고, 최고 소비에트에 그 결정을 설명하기가 훨씬 쉬워질 것이라고 말했다.\n\n**대통령**은 장제스 원수와 이야기할 기회가 없었다고 답하고, 중국인들에게 말할 때의 어려움 가운데 하나는 그들에게 한 말은 무엇이든 24시간 안에 온 세계가 알게 된다는 점이라고 느낀다고 말했다.\n\n**스탈린 원수**는 이에 동의하고, 아직 중국인들에게 말할 필요는 없다고 생각하며 최고 소비에트의 보안은 자신이 보장할 수 있다고 말했다. 그는 이 조건들을 3국이 합의한 문서로 작성해 두고 이곳을 떠나는 것이 좋겠다고 덧붙였다.\n\n**대통령**은 그렇게 할 수 있으리라 생각한다는 뜻을 밝혔다.\n\n**스탈린 원수**는 이어 중국에 관해서, 쑹쯔원(T. V. Soong)이 4월 말에 모스크바에 올 것으로 예상된다고 말하고, 서부에서 소련군 상당수를 빼내어 25개 사단을 극동으로 이동시킬 수 있게 되면 [770면] 장제스 원수와 이 문제들에 관해 이야기할 수 있으리라 생각한다고 말했다.\n\n**스탈린 원수**는 부동항 문제에 관해서는 러시아가 까다롭게 굴지 않을 것이며 국제화된 자유항에 반대하지 않겠다고 말했다.\n\n## 신탁통치\n\n**대통령**은 이어 스탈린 원수와 신탁통치 문제를 논의하고 싶다고 말했다. 그는 조선(Korea)에 대해서는 소련, 미국, 중국 대표로 구성된 신탁통치를 염두에 두고 있다고 말했다. 그는 이 문제에서 우리가 가진 유일한 경험은 필리핀의 경우인데, 그곳에서는 국민이 자치를 준비하는 데 **약 50년**이 걸렸다고 말했다. 그는 조선의 경우에는 그 기간이 **20년에서 30년**일 수 있으리라고 느낀다고 말했다.\n\n**스탈린 원수**는 기간이 짧으면 짧을수록 좋다고 말하고, 조선에 외국 군대가 주둔하게 되는지 물었다.\n\n**대통령**은 부정으로 답했고, 이에 대해 스탈린 원수는 찬성의 뜻을 표했다.\n\n**대통령**은 이어 조선에 관해 미묘한 문제가 하나 있다고 말했다. 그는 개인적으로는 조선의 신탁통치에 영국을 초청할 필요가 있다고 느끼지 않지만, 영국이 이를 언짢게 여길 수 있다고 느낀다고 말했다.\n\n**스탈린 원수**는 그들이 틀림없이 기분이 상할 것이라고 답했다. 실제로 총리가 \"우리를 죽일지도(kill us)\" 모른다고 그는 말했다. 그의 의견으로는 영국을 초청해야 한다고 느낀다는 것이었다.\n\n**대통령**은 이어 인도차이나에 대한 신탁통치도 염두에 두고 있다고 말했다. 그는 영국이 이 구상에 찬성하지 않는데, 신탁통치가 버마에 미칠 수 있는 파장을 우려하여 인도차이나를 프랑스에 돌려주고자 하기 때문이라고 덧붙였다.\n\n**스탈린 원수**는 영국이 인도차이나에 의존했다가 한 번 버마를 잃은 적이 있다고 언급하고, 영국이 이 지역을 지키는 데 믿을 만한 나라라고는 생각하지 않는다고 말했다. 그는 인도차이나가 매우 중요한 지역이라고 생각한다고 덧붙였다.\n\n**대통령**은 인도차이나인들이 자바인이나 버마인처럼 체구가 작은 사람들이며 호전적이지 않다고 말했다. 그는 프랑스가 이 식민지를 차지한 이래 원주민의 처지를 개선하기 위해 아무것도 하지 않았다고 덧붙였다. 그는 드골 장군이 프랑스군을 인도차이나로 수송할 선박을 요청했다고 말했다.\n\n**스탈린 원수**는 드골이 어디서 병력을 구할 것인지 물었다.\n\n**대통령**은 드골이 대통령이 선박을 구할 수 있게 되면 자신은 병력을 찾아내겠다고 말했다고 답하면서, 다만 현재까지 자신은 선박을 구하지 못했다고 덧붙였다.\n\n[771면]\n\n## 중국의 국내 정세\n\n**대통령**은 우리가 얼마 전부터 중국을 살려 두려고 애써 왔다고 말했다.\n\n**스탈린 원수**는 중국이 계속 살아남을 것이라는 의견을 표했다. 그는 장제스 주변에 새로운 지도자들이 필요하며, 국민당 안에 좋은 사람들이 더러 있는데도 왜 그들이 전면에 나서지 않는지 이해할 수 없다고 덧붙였다.\n\n**대통령**은 웨더마이어 장군과 신임 대사인 헐리 장군이 전임자들보다 훨씬 큰 성과를 거두고 있으며, 북부의 공산주의자들을 충칭 정부와 결합시키는 데 더 많은 진전을 이루었다고 말했다. 그는 잘못이 이른바 공산주의자들보다 국민당과 충칭 정부에 더 있다고 말했다.\n\n**스탈린 원수**는 그들이 일본에 맞서 통일전선을 이루어야 하는데도 왜 함께하지 않는지 이해할 수 없다고 말했다. 그는 이 목적을 위해서는 장제스가 지도력을 맡아야 한다고 생각했다. 그는 이와 관련하여 몇 해 전에 통일전선이 있었음을 상기하고, 왜 그것이 유지되지 않았는지 이해할 수 없다고 말했다.\n\n## 제5차 본회의, 1945년 2월 8일 오후 4시, 리바디아 궁전\n\n**참석자**\n\n미국\n\n- 루스벨트 대통령(President Roosevelt)\n- 스테티니어스 장관(Secretary Stettinius)\n- 리히 해군원수(Fleet Admiral Leahy)\n- 홉킨스 씨(Mr. Hopkins)\n- 번스 씨(Mr. Byrnes)\n- 해리먼 씨(Mr. Harriman)\n- 매슈스 씨(Mr. Matthews)\n- 히스 씨(Mr. Hiss)\n- 볼렌 씨(Mr. Bohlen)\n\n영국\n\n- 처칠 총리(Prime Minister Churchill)\n- 이든 외무장관(Foreign Secretary Eden)\n- 아치볼드 클라크 커 경(Sir Archibald Clark Kerr)\n- 알렉산더 캐도건 경(Sir Alexander Cadogan)\n- 에드워드 브리지스 경(Sir Edward Bridges)\n- 젭 씨(Mr. Jebb)\n- 윌슨 씨(Mr. Wilson)\n- 딕슨 씨(Mr. Dixon)\n- 버스 소령(Major Birse)\n\n소련\n\n- 스탈린 원수(Marshal Stalin)\n- 몰로토프 외무인민위원(Foreign Commissar Molotov)\n- 비신스키 씨(Mr. Vyshinsky)\n- 마이스키 씨(Mr. Maisky)\n- 구세프 씨(Mr. Gusev)\n- 그로미코 씨(Mr. Gromyko)\n- 파블로프 씨(Mr. Pavlov)", "secondary": "Leningrad, February 8, 1945, 3:30 p.m.\n\ntop secret\n\nAir Bases in the Far East\n\nThe President said that with the fall of Manila the war in the Pacific was entering into a new phase and that we hoped to establish bases on the Bonins and on the islands near Formosa. He said the time had come to make plans for additional bombing of Japan. He hoped that it would not be necessary actually to invade the Japanese islands and would do so only if absolutely necessary. The Japanese had 4,000,000 men in their army and he hoped by intensive bombing to be able to destroy Japan and its army and thus save American lives.\n\nMarshal Stalin said he did not object to the United States having bases at Komsomolsk or at Nikolaevsk. He said the first was on the lower reaches of the Amur River and the second at its mouth. He said that in regard to the bases on Kamchatka he thought we would have to leave that until a later stage since the presence of the Japanese Consul there made it difficult at this time to make the necessary arrangements. At any rate, he added, the other two bases in the Maritime Provinces were nearer.\n\nMarshal Stalin added that there had been one phrase in regard to “commercial routes” in the President’s letter [주2] on the subject which had not been clear to him.\n\n[767면]\n\nThe President said he had had in mind the importance of the supply routes across the Pacific and Eastern Siberia to the Soviet Union and he felt that once war broke out between Japan and the Soviet Union it would become very important but also very difficult to get by the Japanese Islands.\n\nMarshal Stalin indicated that he recognized the importance of these supply routes and again repeated that he had no objection to the establishment of American bases in the Maritime provinces.\n\nThe President handed the Marshal a paper [주3] in which it was requested that the Soviet staff be instructed to enter into planning talks with the United States staff.\n\nMarshal Stalin indicated that he would give the necessary instructions.\n\nUse of airfields and survey of bomb damage in Eastern and Southeastern Europe [주4]\n\nThe President said he had two questions of a military nature relating to Europe which he wished to take up with the Marshal. He then handed to Marshal Stalin two papers in English which were translated into Russian.\n\nThe first was a request that the United States Air Force be allowed to use certain airfields in the vicinity of Budapest in order to carry out bombing operations against the Germans. The President said that at the present time the American bombers based in Italy had to make a long and hazardous flight over the Alps in order to reach Germany.\n\nThe second paper contained a request that a group of United States experts be permitted to make surveys of the effects of bombing in the areas liberated or occupied by the Red Army in Eastern and South Eastern Europe, similar to the surveys that had been made at Ploesti. The paper asked that this group be permitted to proceed at once since it was important to examine the damage while the evidence was still fresh and the people who had been there during the bombing still were on the spot.\n\nMarshal Stalin said he could grant both these requests and would immediately give the necessary orders.\n\nSale of Ships to the Soviet Union after the War [주5]\n\nMarshal Stalin mentioned that Mr. Stettinius had told Mr. Molotov there was a possibility that the United States would have surplus shipping property after the war which might be sold to the Soviet Union.\n\n[768면]\n\nThe President said that this would require some changes in legislation which he hoped to work out so that surplus shipping after the war not needed by the United States and Great Britain could be transferred on credit without any interest. He said after the last war the mistake had been made of attempting to charge interest for the disposal of surplus property but it had not worked. His idea was to transfer the ships for a fixed sum on credit which would include the cost of the ship less the cost of depreciation, so that in twenty years the entire credit would be extinguished. He said that the British had never sold anything without commercial interest but that he had different ideas.\n\nMarshal Stalin expressed gratification at the President’s statement and said this shipping would greatly ease the task of the Soviet Union in the future.\n\nThe President replied that he hoped the Soviet Union would interest itself in a large way in the shipping game.\n\nMarshal Stalin said that he thought the President’s idea was a very good one and also that Lend-Lease was a remarkable invention, without which victory would have been delayed. He said that in former wars some allies had subsidized others but this had offended the allies receiving the subsidies and had led to difficulties. Lend-Lease, however, produced no such resentment, and he repeated his opinion of the extraordinary contribution of Lend-Lease to the winning of the war.\n\nThe President replied that four years ago, when having a rest on his small yacht, he had thought and thought of a way to help the Allies and at the same time avoid the difficulties inherent in loans, and had finally hit upon the scheme of Lend-Lease.\n\nFar East: Russian Desires\n\nFollowing the discussion of certain military questions involved in the Far East, Marshal Stalin said that he would like to discuss the political conditions under which the USSR would enter the war against Japan. He said he had already had a conversation on this subject with Ambassador Harriman.\n\nThe President said he had received a report [주6] of this conversation, and he felt that there would be no difficulty whatsoever in regard to the southern half of Sakhalin and the Kurile Islands going to Russia at the end of the war. He said that in regard to a warm water port in the Far East for the Soviet Union, the Marshal recalled that they had discussed that point at Tehran. He added that he had then suggested that the Soviet Union be given the use of a warm water port at the end of the south Manchurian railroad, at possibly Dairen on [769면] the Kwantung peninsula. The President said he had not yet had an opportunity to discuss this matter with Marshal Chiang Kai-shek, so therefore he could not speak for the Chinese. He went on to say that there are two methods for the Russians to obtain the use of this port; (1) outright leasing from the Chinese; (2) making Dairen a free port under some form of international commission. He said he preferred the latter method because of the relation to the question of Hong Kong. The President said he hoped that the British would give back the sovereignty of Hong Kong to China and that it would then become an internationalized free port. He said he knew Mr. Churchill would have strong objections to this suggestion.\n\nMarshal Stalin said there was another question and that involved the use by the Russians of the Manchurian railways. He said the Czars had use of the line running from Manchouli to Harbin and from there to Dairen and Port Arthur, as well as the line from Harbin running east to Nikolsk-Ussurisk connecting there with the Khabarovsk to Vladivostok line.\n\nThe President said that again, although he had not talked with Marshal Chiang Kai-shek on the subject, there were again two methods of bringing this about: (1) to lease under direct Soviet operation; (2) under a commission composed of one Chinese and one Russian.\n\nMarshal Stalin said that it is clear that if these conditions are not met it would be difficult for him and Molotov to explain to the Soviet people why Russia was entering the war against Japan. They understood clearly the war against Germany which had threatened the very existence of the Soviet Union, but they would not understand why Russia would enter a war against a country with which they had no great trouble. He said, however, if these political conditions were met, the people would understand the national interest involved and it would be very much easier to explain the decision to the Supreme Soviet.\n\nThe President replied that he had not had an opportunity to talk to Marshal Chiang Kai-shek and he felt that one of the difficulties in speaking to the Chinese was that anything said to them was known to the whole world in twenty-four hours.\n\nMarshal Stalin agreed and said he did not think it was necessary yet to speak to the Chinese and that he could guarantee the security of the Supreme Soviet. He added that it would be well to leave here with these conditions set forth in writing agreed to by the three powers.\n\nThe President indicated that he thought that this could be done.\n\nMarshal Stalin went on to say that in regard to the Chinese, T. V. Soong was expected to come to Moscow at the end of April, and he said that when it was possible to free a number of Soviet troops in the west and move twenty-five divisions to the Far East he thought [770면] it would be possible to speak to Marshal Chiang Kai-shek about these matters.\n\nMarshal Stalin said that in regard to the question of a warm water port the Russians would not be difficult and he would not object to an internationalized free port.\n\nTrusteeships\n\nThe President then said he wished to discuss the question of trusteeships with Marshal Stalin. He said he had in mind for Korea a trusteeship composed of a Soviet, an American and a Chinese representative. He said the only experience we had had in this matter was in the Philippines where it had taken about fifty years for the people to be prepared for self-government. He felt that in the case of Korea the period might be from twenty to thirty years.\n\nMarshal Stalin said the shorter the period the better, and he inquired whether any foreign troops would be stationed in Korea.\n\nThe President replied in the negative, to which Marshal Stalin expressed approval.\n\nThe President then said there was one question in regard to Korea which was delicate. He personally did not feel it was necessary to invite the British to participate in the trusteeship of Korea, but he felt that they might resent this.\n\nMarshal Stalin replied that they would most certainly be offended. In fact, he said, the Prime Minister might “kill us”. In his opinion he felt that the British should be invited.\n\nThe President then said he also had in mind a trusteeship for Indochina. He added that the British did not approve of this idea as they wished to give it back to the French since they feared the implications of a trusteeship as it might affect Burma.\n\nMarshal Stalin remarked that the British had lost Burma once through reliance on Indochina, and it was not his opinion that Britain was a sure country to protect this area. He added that he thought Indochina was a very important area.\n\nThe President said that the Indochinese were people of small stature, like the Javanese and Burmese, and were not warlike. He added that France had done nothing to improve the natives since she had the colony. He said that General de Gaulle had asked for ships to transport French forces to Indochina.\n\nMarshal Stalin inquired where de Gaulle was going to get the troops.\n\nThe President replied that de Gaulle said he was going to find the troops when the President could find the ships, but the President added that up to the present he had been unable to find the ships.\n\n[771면]\n\nInternal Conditions in China\n\nThe President said that for some time we had been trying to keep China alive.\n\nMarshal Stalin expressed the opinion that China would remain alive. He added that they needed some new leaders around Chiang Kai-shek and although there were some good people in the Kuomintang he did not understand why they were not brought forward.\n\nThe President said General Wedemeyer and the new Ambassador, General Hurley, were having much more success than their predecessors and had made more progress in bringing the communists in the north together with the Chungking government. He said the fault lay more with the Kuomintang and the Chungking Government than with the so-called communists.\n\nMarshal Stalin said he did not understand why they did not get together since they should have a united front against the Japanese. He thought that for this purpose Chiang Kai-shek should assume leadership. He recalled in this connection that some years ago there had been a united front and he did not understand why it had not been maintained.\n\nFifth plenary meeting, February 8, 1945, 4 p.m., Livadia Palace\n\nPresent\n\nUnited States United Kingdom Soviet Union\n\nPresident Roosevelt Prime Minister Churchill Marshal Stalin\n\nSecretary Stettinius Foreign Secretary Eden Foreign Commissar Molotov\n\nFleet Admiral Leahy Foreign Secretary Eden Mr. Vyshinsky\n\nMr. Hopkins Sir Archibald Clark Kerr Mr. Maisky\n\nMr. Byrnes Sir Alexander Cadogan Mr. Gusev\n\nMr. Harriman Sir Edward Bridges Mr. Gromyko\n\nMr. Matthews Mr. Jebb Mr. Pavlov\n\nMr. Hiss Mr. Wilson\n\nMr. Bohlen Mr. Dixon\n\nMajor Birse", "notes": ["[주1] 여기의 앞의 두 주제는 별개의 각서이고, 뒤의 네 주제는 세 번째 각서에 묶여 있다.", "[주2] 앞의 594면을 보라.", "[주3] 위의 부록 \"B\"를 보라.", "[주4] 이 주제에 관한 논의는 오후 3시 40분에 시작되었다.", "[주5] 이 주제에 관한 논의는 오후 3시 45분에 시작되었다.", "[주6] 앞의 378~379면."], "warn": false, "pages": ["766", "767", "768", "769", "770", "771"], "search": "Roosevelt 루스벨트 (대통령) Stalin 스탈린 (원수) Churchill 처칠 (영국 총리) Molotov 몰로토프 Harriman 해리먼 Stettinius 스테티니어스 Bohlen 볼렌 Eden 이든 Chiang Kai-shek 장제스 T. V. Soong 쑹쯔원 Hurley 헐리 (신임 주중 대사) Wedemeyer 웨더마이어 de Gaulle 드골 Leahy 리히 Hopkins 홉킨스 Byrnes 번스 Matthews 매슈스 Hiss 히스 Vyshinsky 비신스키 Maisky 마이스키 Gusev 구세프 Gromyko 그로미코 Pavlov 파블로프 Archibald Clark Kerr 아치볼드 클라크 커 Alexander Cadogan 알렉산더 캐도건 Edward Bridges 에드워드 브리지스 Jebb 젭 Wilson 윌슨 Dixon 딕슨 Birse 버스 President Roosevelt 루스벨트 대통령 (미국) Marshal Stalin 스탈린 원수 (소련) — 이하는 문서 말미에 이어 붙은 제5차 본회의(1945년 2월 8일 오후 4시, 리바디아 궁전) 참석자 명단 — United States 미국: President Roosevelt 루스벨트 대통령, Secretary Stettinius 스테티니어스 국무장관, Fleet Admiral Leahy 리히 해군원수, Mr. Hopkins 홉킨스, Mr. Byrnes 번스, Mr. Harriman 해리먼, Mr. Matthews 매슈스, Mr. Hiss 히스, Mr. Bohlen 볼렌 United Kingdom 영국: Prime Minister Churchill 처칠 총리, Foreign Secretary Eden 이든 외무장관, Sir Archibald Clark Kerr 아치볼드 클라크 커 경, Sir Alexander Cadogan 알렉산더 캐도건 경, Sir Edward Bridges 에드워드 브리지스 경, Mr. Jebb 젭, Mr. Wilson 윌슨, Mr. Dixon 딕슨, Major Birse 버스 소령 Soviet Union 소련: Marshal Stalin 스탈린 원수, Foreign Commissar Molotov 몰로토프 외무인민위원, Mr. Vyshinsky 비신스키, Mr. Maisky 마이스키, Mr. Gusev 구세프, Mr. Gromyko 그로미코, Mr. Pavlov 파블로프"}, {"id": "d477", "order": 477, "date": "1945-02-05", "group": "C", "eyebrow": "d477 · The Acting Secretary of State (Grew) to the Secretary of State", "title": "국무장관 대리(그루)가 국무장관에게", "badge": "top secret (극비)", "list_right": "문서 477", "meta": [{"k": "일자", "v": "1945-02-05"}, {"k": "장소", "v": "Washington", "txt": true}, {"k": "발신", "v": "국무장관 대리 그루(Grew)", "txt": true}, {"k": "수신", "v": "국무장관 스테티니어스(Stettinius)", "txt": true}, {"k": "참석", "v": null, "txt": true, "wide": true}, {"k": "종류", "v": "전보"}], "links": [{"k": "FRUS", "text": "문서 477 원문", "url": "https://history.state.gov/historicaldocuments/frus1945Malta/d477"}], "summary": "장제스가 쑹쯔원을 소련에 개인 대표로 보내기로 했으며, 그 회담 의제에 조선과 만주에서의 소련-중국 관계가 포함된다는 헐리의 보고를 전달한 극비 전보(발췌).", "points": ["조선 관련: 예정된 소련-중국 회담의 논의 대상에 '조선과 만주에서의 소련-중국 관계'가 포함된다.", "소련 정부가 장제스의 개인 대표로 쑹쯔원을 2월 하순 또는 3월 초에 접수하기로 동의했다고 장제스와 쑹쯔원이 헐리에게 통보했다.", "회담 의제: 관계 긴밀화, 대일 전쟁에 대한 소련의 참전, 조선과 만주에서의 소련-중국 관계, 전후 경제 문제, 중소 국경.", "헐리는 전면적 협력을 바라는 장제스를 위해 이 의제에 관한 제안을 요청하고 있다.", "헐리는 지난 9월 회담에서 몰로토프가 '러시아는 중국 공산주의자들을 지원하고 있지 않으며 그들은 전혀 공산주의자가 아니다', 그리고 러시아는 중국과의 관계 긴밀화를 바라고 중국 내 분열을 원치 않는다고 말했음을 지적한다.", "장제스는 그것이 여전히 소련의 태도인지 알고자 애태우고 있다.", "본문 말미에 '(이것은 열여섯 번째 전문이다)'라는 표시가 있고, 발췌 문서라 앞뒤가 생략되어 있다."], "primary": "[발췌]\n\n**극비**\n\n워싱턴, 1945년 2월 5일.\n\n1. **소련-중국 회담.** 장제스(Chiang Kai-shek)와 쑹(Soong)은, 소련 정부가 총통(Generalissimo)의 개인 대표로서 쑹을 2월 하순이나 3월 초에 접수하는 데 동의하였음을 헐리(Hurley)에게 통보하였다. 논의는 관계 긴밀화의 수립, 대일 전쟁에 대한 소련의 참전, 조선과 만주에서의 소련-중국 관계, 전후 경제 [953면] 문제, 그리고 중소 국경을 다루게 될 것이다. 헐리는 전면적 협력을 바라는 장제스를 위하여 이 의제에 관한 제안을 요청하고 있다. 헐리는 9월의 회담에서 몰로토프(Molotov)가 그에게, 러시아인들은 중국 공산주의자들을 지원하고 있지 않으며 그들은 전혀 공산주의자가 아니라고 말했고 또 중국과의 더 긴밀한 관계를 바란다고 말했음을 지적한다. 몰로토프는 또한 러시아가 중국 내의 분열을 원치 않는다고도 말하였다. 장제스는 이것이 여전히 소련의 태도를 나타내는 것인지 알고자 애태우고 있다. (이것은 열여섯 번째 전문이다).\n\n. . . . . . . . . . . . . .", "secondary": "[Excerpt]\n\ntop secret\n\nWashington, February 5, 1945.\n\n1. Soviet-Chinese Conversations. Chiang Kai-Shek and Soong have informed Hurley that the Soviet Government has agreed to receive Soong as a personal representative of the Generalissimo either late in February or early in March. Discussions will cover establishment of closer relations, Soviet participation in the War against Japan, Soviet-Chinese relations in Korea and Manchuria, post-war economic [953면] matters and the Sino-Soviet border. Hurley invites suggestions regarding this agenda for Chiang who desires full cooperation. Hurley points out that in September conversations, Molotov stated to him that Russians are not supporting Chinese communists who are not communists at all and desires closer relations with China. Molotov also stated that Russia does not want dissention in China. Chiang is anxious to learn whether this still represents Soviet attitude. (This is sixteenth message).\n\n. . . . . . . . . . . . . .", "notes": [], "warn": true, "pages": ["952", "953"], "search": "Chiang Kai-shek 장제스 Soong 쑹(쑹쯔원) Hurley 헐리 Molotov 몰로토프 Grew 그루 Stettinius 스테티니어스"}]</script>
